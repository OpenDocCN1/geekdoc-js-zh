  trans: "\n到目前为止，我们一直在摆弄我们的微文本搜索应用程序，但实际上有一个非常有用的函数可以帮助我们缩短代码——`search()` 函数。让我们来试一下：\n\
    \n```javascript\nvar text = \"I’ve gone through all this trouble and it turns\
    \ out there’s an easy way out.\";var positionOfText = text.search(\"easy way out\"\
    );console.log(positionOfText);\n```\n\n但请注意，`search()` 函数只查找查询字符串在文本中第一次出现的位置。不过，你可以修改原始程序，并在\
    \ `for` 循环中使用 `search()` 函数来使代码更简洁。这是编程中的另一个重要教训——学习如何为特定任务找到合适的函数，这样你就不必自己亲手写一个了。尽管如此，这里使用另一个名为\
    \ `match()` 的函数来实现我们微文本搜索应用程序的另一种方法：\n\n```javascript\nvar text = \"This is getting\
    \ ridiculous.\";var results = text.match(\"ridiculous\");console.log(\"Matches:\
    \ \" + results.length);\n```\n\n我们之前所做的——只用基础的 `if-else if-else` 和 `for` 循环创建文本搜索应用——帮助我们理解了那些我们经常理所当然的函数内部发生了什么。通过理解这一点，当可用函数不符合我们的需求时，我们可以轻松地创建自己的函数。\n\
    \n## 结论\n\n到目前，你基本上已经掌握了 JavaScript 的基础过程处理部分。在下一章中，你将学习更多关于数据结构的知识，这是组织信息（记得我们关于数组的课程吗？）的一种，以便计算机更高效地管理。过去的几章中，我们使用\
    \ JavaScript 讨论了通用的编程概念（`if-else` 语句、函数等），那么下一章将帮助你开启面向对象编程之旅。\n\n# 第 7 章：更有效地管理数据\n\
    \n在这一章中，你将通过学习数据结构来更有效地管理数据。实际上，你已经在第 5 章学习过一种数据结构——数组。在这一章中，我们将更深入探索数组，并向你介绍对象，对象基本上是区分面向对象编程与过程编程的关键。话如此，让我们先快速回顾一下数组：\n\
    \n## 数组 - 快速回顾\n\n这里有一组数组：\n\n```javascript\nvar fruits = [\"Banana\", \"Apple\"\
    , \"Orange\"];var numbers = [1, 2, 3];var fruitSalad = [\"Banana\", \"Apple\"\
    , \"Orange\",1, 2, 3];\n```\n\n包含两种或更多类型数据的数组被称为异构数组。在上面的示例中，`fruitSalad` 就是那个异构数组。你可以在数组中存储任何类型的数据，并使用对应数据的索引访问它：\n\
    \n```javascript\nconsole.log(fruits[0]); // 应该给你 Banaconsole.log(fruitSalad[5]);\
    \ // 应该给你 3\n```\n\n你可以像检查字符串一样方法检查数组的长度：\n\n```javascript\nconsole.log(fruits.length);\
    \ // 应该给你 3console.log(numbers.length); // 应该给你 3console.log(fruitSalad.length);\
    \ // 应该给你 6\n```\n\n数组上有很多可以使用可以使用的方法，例如 `push()` 方法：\n\n```javascript\nfruits.push(\"\
    Tomato\");\n```\n\n你可以通过快速在线搜索来获取数组方法的完整列表，因为把它们全部列在这里会让书籍内容太太密了。\n\n现在你已经对数组有了快速回顾，让我们通过讨论二维数组来让事情变得更有趣一点。\n\
    \n## 二维数组\n\n当我们讨论数组可以存储任何类型的数据时，我们不仅仅是在说字符串、数字和布尔值；我们还可以在数组中存储数组！这有什么用呢？假设你你想在数组中存储个人信息：\n\
    \n```javascript\nvar personalInfo = [\"John\", 23, \"johnSnow@myCorporation.net\"\
    ];\n```\n\n但当你想要添加更多的人时会发生什么？就像我们要创建一个信息列表时一样，我们也创建一个数组列表：\n\n```javascript\n\
    var group = [personalInfo, [\"Jen\", 21, \"jenRose@myCorporation.net\"], [\"Jake\"\
    , 25, \"jakeSullivan@myCorporation.net\"]];\n```\n\n回想我们的 `for` 循环课程，让我们遍历每个条目的个人信息：\n\
    \n```javascript\nfor(var counter = 0; counter < group.length; counter++){\n  \
    \  for(var counter1 = 0; counter1 < group[counter].length; counter1++)\n    {\n\
    \        console.log(group[counter][counter1]);\n    }\n}\n```\n\n尝试玩一下这段代码，并尝试反序显示数据：\n\
    \n1. 先显示 Jake 的信息，最后显示 John 的信息\n2. 先显示电子邮件地址，后显示名称\n\n现在你已经掌握了二维数组的精髓，是时候进入更高的平面了——对象的平面！\
    \ \n\n## 对象介绍\n\n过程化编程要求程序员向计算机写出几乎每一条命令。这可能迅速导致代码变得混乱，因此人们考虑将某些命令和信息保留在一个被称为“对象”的内容内部。例如，如果你想创建一个宠物数据库，你必须执行如下操作：\n\
    \n```javascript\n//首先，我们创建包含我们想要保存的宠物信息的数组 petName = [\"Cat\", \"Fluffy\"];var\
    \ petSpecies = [\"Dog\", \"Fish\", \"Parrot\"];var petAge = [5, 6];var petGender\
    \ = [\"Male\", \"Female\", \"Male\"];创建一个信息列表 create a functionInformation = function(details){\
    \ console.log(\"Name: \" + details[0]); console.log(\"Species: \" + details[1]);\
    \ console.log(\"Age: \" + details[2]); console.log(\"Gender: \" + details[3]);\
    \ }};\n```\n\n虽然这段代码可以工作并为我们提供了整洁的信息列表，但在添加新函数时代码会变得相当乱且难以调试。话如此，这里是将第一个项目转换为对象的代码：\n\
    \n```javascript\nvar pet = {};pet.name = \"Cat\";pet.species = \"Dog\";pet.age\
    \ = 5;pet.gender = \"Male\";pet.showDetails = function(){ console.log(\"Name:\
    \ \" + this.name); console.log(\"Species: \" + this.species); console.log(\"Age:\
    \ \" + this.age); console.log(\"Gender: \" + this.gender); };pet.showDetails();\n\
    ```\n\n这一行：\n\n```javascript\nvar pet = {};\n```\n\n创建一个名为 `pet` 的对象。实际上有两种创建对象的方法，第一种被称为字面量表示法。我们从空对象开始并在声明后添加属性，但我们也可以从一个填充好的对象开始：\n\
    \n```javascript\nvar pet = { name: \"Cat\", species: \"Dog\", age: 5, gender:\
    \ \"Male\", };pet.showDetails = function(){ console.log(\"Name: \" + this.name);\
    \ console.log(\"Species: \" + this.species); console.log(\"Age: \" + this.age);\
    \ console.log(\"Gender: \" + this.gender); };pet.showDetails();\n```\n\n注意这些差异，尽管它们微乎其微！（例如，使用冒号\
    \ (:) 而不是等号 (`=`))\n\n你也可以使用构造函数，将代码段转换为：\n\n```javascript\nvar pet = new Object();pet.name\
    \ = \"Cat\";pet.species = \"Dog\";pet.age = 5;pet.gender = \"Male\";pet.showDetails\
    \ = function(){ console.log(\"Name: \" + this.name); console.log(\"Species: \"\
    \ + this.species); console.log(\"Age: \" + this.age); console.log(\"Gender: \"\
    \ + this.gender); };pet.showDetails();\n```\n\n两种创建对象的方法都是正确的，所以完全取决于个人喜好。\n\n\
    现在观察对象与我们目前使用的其他数据类型有何不同。这是因为对象是现代概念，通过将所有相关的细节和信息放在一起来表示现实世界的物品。例如，如果创建一个“手机”对象，那么它很可能包含屏幕尺寸、像素密度、处理器数量和速度、内存等属性。如果我们想创建不同的手机，我们只需要执行如下操作：\n\
    \n"
- fmt: "\n```javascript\nvar smartPhone1 = {\n    screenSize: 5,\n    pixelDensity:\
    \ 200,\n    processorNumber: 2,\n    processorSpeed: 500,\n};\nvar smartPhone2\
    \ = {\n    screenSize: 6,\n    pixelDensity: 400,\n    processorNumber: 8,\n \
    \   processorSpeed: 2000,\n};\n```\n\nThis makes organizing data much more efficient\
    \ and easy.\n\nAs an exercise, print out the details of each phone into the console\
    \ by accessing the properties using the dot notation. To start you off, here’s\
    \ the code for the `screenSize` of `smartPhone1` printed to the console:\n\n```javascript\n\
    console.log(smartPhone1.screenSize);\n```\n\nSo far, we can access either information\
    \ or functions of an object using the dot notation. The variables we access using\
    \ the dot notation are called `properties`, while the functions we access using\
    \ the dot notation are called `methods`.\n\nThe concept of methods and properties\
    \ arose from the need to turn real life concepts into code. Going back to our\
    \ phone example, for instance, without objects there’s no simple way to tell which\
    \ screen size belongs to a specific phone, unless one keeps the phone names and\
    \ screen sizes in two different arrays. This quickly becomes more complicated\
    \ when more attributes are added.\n\nGoing back to our explanations about functions,\
    \ functions are able to keep a large number of instructions without messing up\
    \ the whole source code by being invokable with a function name. Going back to\
    \ our phone example, phones differ in terms of what functionalities are available,\
    \ as well as the internal implementation of those functionalities. For instance,\
    \ let’s add a texting function to the two phones from our example earlier, as\
    \ well as the capability to swap sim cards:\n\n```javascript\nvar smartPhone1\
    \ = {\n    screenSize: 5,\n    pixelDensity: 200,\n    processorNumber: 2,\n \
    \   processorSpeed: 500,\n    simCardNumber: 123456,\n    textNumber: function(number,\
    \ text) {\n        console.log(\"Message, '\" + text + \"' has been sent to \"\
    \ + number);\n        console.log(\"Processing time: \" + text.length/this.processorNumber);\n\
    \    },\n    setSimCardNumber: function(newSimCardNumber) {\n        this.simCardNumber\
    \ = newSimCardNumber;\n    },\n};\nvar smartPhone2 = {\n    screenSize: 6,\n \
    \   pixelDensity: 400,\n    processorNumber: 8,\n    processorSpeed: 2000,\n \
    \   simCardNumber: 654321,\n    textNumber: function(number, text) {\n       \
    \ console.log(\"'\" + text + \"' sent to \" + number);\n        console.log(\"\
    Processing time: \" + text.length/this.processorNumber);\n    },\n    setSimCardNumber:\
    \ function(newSimCardNumber) {\n        this.simCardNumber = newSimCardNumber;\n\
    \    },\n};\n```\n\nNotice how both phones have the same set of functions, but\
    \ with a slightly different implementation, just as in real life, when you tell\
    \ somebody to text someone, you only need to specify the message and the number\
    \ you need to send it to regardless of the type of phone used. As for the `setSimCardNumber`\
    \ function, this is actually common practice in object-oriented programming; instead\
    \ of setting the properties of an object manually, like:\n\n```javascript\nsmartPhone1.simCardNumber\
    \ = 55555;\n```\n\nSince the setter at least can have an extra set of instructions,\
    \ like checking for any possible errors in the process.\n\nAnother thing you might\
    \ have noticed is that we’re using the keyword, `this` when we’re creating methods\
    \ for our objects. The keyword, `this` acts as a placeholder and will point to\
    \ the object that called the method. For example, if you type:\n\n```javascript\n\
    smartPhone2.textNumber(0000, \"Hi!\");\n```\n\nThen we call the function:\n\n\
    ```javascript\ntextNumber: function(number, text) {\n    console.log(\"'\" + text\
    \ + \"' sent to \" + number);\n    console.log(\"Processing time: \" + text.length/this.processorNumber);\n\
    },\n```\n\nThis makes references to a `processorNumber` variable. Because of the\
    \ `this` keyword, the function finds a variable called `processorNumber` in the\
    \ object that called it, which is `smartPhone2`.\n\n## Custom Constructors\n\n\
    As you may have noticed, having to create and assign properties every time for\
    \ similar objects is quite a hassle. Since `smartPhone1` and `smartPhone2` are\
    \ both classified as phones, then they’re bound to have similar methods and properties.\
    \ With that in mind, we can do something like this to make our code cleaner:\n\
    \n```javascript\nfunction Phone(screenSize, pixelDensity, processorNumber, processorSpeed,\
    \ simCardNumber) {\n    this.screenSize = screenSize;\n    this.pixelDensity =\
    \ pixelDensity;\n    this.processorNumber = processorNumber;\n    this.processorSpeed\
    \ = processorSpeed;\n    this.simCardNumber = simCardNumber;\n    this.textNumber\
    \ = function(number, text) {\n        console.log(\"Message, '\" + text + \"'\
    \ has been sent to \" + number);\n        console.log(\"Processing time: \" +\
    \ text.length/this.processorNumber);\n    };\n    this.setSimCardNumber = function(newSimCardNumber)\
    \ {\n        this.simCardNumber = newSimCardNumber;\n    };\n}\nvar smartPhone1\
    \ = new Phone(5, 200, 2, 500, 123456);\nvar smartPhone2 = new Phone(6, 400, 8,\
    \ 2000, 654321);\n```\n\nSee how it makes our code much shorter? In real life,\
    \ this would be the equivalent of creating a factory - you systemize the creation\
    \ while the basics are taken of.\n\n## Conclusion\n\nCongratulations! You’ve just\
    \ had your first exposure to object-oriented programming! Object-oriented programming\
    \ lets you create code that’s much easier to understand at first glance because\
    \ of the concepts of properties and methods. Knowing how to create and manipulate\
    \ objects is the first step, just as learning the syntax for procedural programming\
    \ is also the first step. The second step is learning how to break down complex\
    \ problems, and in object-oriented programming, it means learning how to represent\
    \ data as objects. In the final chapter, we’ll take a deeper exploration into\
    \ object-oriented programming so that you can get a better sense of how we can\
    \ take advantage of.\n\n# Chapter 8: Exploring Objects\n\nSo far, we’ve talked\
    \ about how one can create objects to make it easier to break down complex problems,\
    \ as well as represent real-life concepts in JavaScript. In this chapter, you'll\
    \ learn a little more about how you can identify objects, as well as how you can\
    \ run through their properties. To cap things off, we'll then talk about some\
    \ important object-oriented concepts to help you get started on your journey to\
    \ more complicated object-oriented programming, the scope of which lies outside\
    \ this book.\n\n## Identifying Data Types\n\nWith bigger code come more chances\
    \ of messing up and forgetting the data type one’s dealing with. Furthermore,\
    \ some hackers may also take advantage of unchecked data types to exploit a possible\
    \ security hole in the JavaScript app. That being said, in order to find out what\
    \ the data type of the information you’re dealing with is, simply use the `typeof`\
    \ keyword. For example:\n\n```javascript\nvar numberSample = 12;\nvar stringSample\
    \ = \"AAA\";\nvar objectSample = { property1: \"Sample string\" };\nconsole.log(\"\
    Type of numberSample is: \"+ typeof numberSample);\nconsole.log(\"Type of stringSample\
    \ is: \"+ typeof stringSample);\nconsole.log(\"Type of objectSample is: \"+ typeof\
    \ objectSample);\n```\n\n## Distinguishing Between Different Objects\n\nWe now\
    \ know how to identify strings, numbers, and objects, but since objects have an\
    \ inner classification (an object of type Phone is different from an object of\
    \ type Car, for instance), it’s a good idea to be able to distinguish between\
    \ different objects too. Unfortunately, JavaScript provides no built-in way to\
    \ provide you with the type of the object you’re dealing with. You can, however,\
    \ confirm if you’re dealing with a specific type of object. Take this sample code,\
    \ for instance:\n"
