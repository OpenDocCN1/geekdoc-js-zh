    \n```javascript\nconsole.log(smartPhone1.screenSize);\n```\n\n到为止，我们可以使用点符号表示访问对象的任何信息或函数。我们使用点符号表示访问的变量被称为\
    \ `properties`（属性），而我们使用点符号表示访问的函数被称为 `methods`（方法）。\n\n方法和属性的概念源于将现实世界概念转换为代码的需求。回到我们的手机示例，例如，如果没有对象，就没有简单的方法告诉我们哪个屏幕尺寸属于哪个特定的手机，除非将手机名称和屏幕尺寸存储在两个不同的数组中。当添加更多属性时，情况会迅速变得复杂。\n\
    \n回到我们对函数的解释，函数能够通过函数名调用来保留大量的指令，而不会搞乱整个源代码。回到我们的手机示例，手机在可用功能以及功能的内部实现上是存在差异的。例如，让我们为之前示例中的那两部手机添加一个短信功能，以及更换\
    \ SIM 卡的能力：\n\n```javascript\nvar smartPhone1 = {\n    screenSize: 5,\n    pixelDensity:\
    \ 200,\n    processorNumber: 2,\n    processorSpeed: 500,\n    simCardNumber:\
    \ 123456,\n    textNumber: function(number, text) {\n        console.log(\"Message,\
    \ '\" + text + \"' has been sent to \" + number);\n        console.log(\"Processing\
    \ time: \" + text.length/this.processorNumber);\n    },\n    setSimCardNumber:\
    \ function(newSimCardNumber) {\n        this.simCardNumber = newSimCardNumber;\n\
    \    },\n};\nvar smartPhone2 = {\n    screenSize: 6,\n    pixelDensity: 400,\n\
    \    processorNumber: 8,\n    processorSpeed: 2000,\n    simCardNumber: 654321,\n\
    \    textNumber: function(number, text) {\n        console.log(\"'\" + text +\
    \ \"' sent to \" + number);\n        console.log(\"Processing time: \" + text.length/this.processorNumber);\n\
    \    },\n    setSimCardNumber: function(newSimCardNumber) {\n        this.simCardNumber\
    \ = newSimCardNumber;\n    },\n};\n```\n\n注意这两部手机都具有相同的函数集，但实现略有不同，这就像现实生活中一样，当你告诉某人发送短信时，无论使用什么类型的手机，你只需要指定信息内容和要发送号码。至于\
    \ `setSimCardNumber` 函数，这实际上是面向对象编程中的常见做法；而不是手动设置对象的属性，例如：\n\n```javascript\n\
    smartPhone1.simCardNumber = 55555;\n```\n\n因为设置器（setter）至少可以拥有一额外的指令，例如检查过程中的任何可能错误。\n\
    \n你可能注意到的另一点是，当我们为对象创建方法时使用了关键字 `this`。关键字 `this` 充当占位符，并将指向调用方法的对象。例如，如果你输入：\n\
    \n```javascript\nsmartPhone2.textNumber(0000, \"Hi!\");\n```\n\n那么我们就调用了函数：\n\n\
    ```javascript\ntextNumber: function(number, text) {\n    console.log(\"'\" + text\
    \ + \"' sent to \" + number);\n    console.log(\"Processing time: \" + text.length/this.processorNumber);\n\
    },\n```\n\n这产生了对 `processorNumber` 变量的引用。由于 `this` 关键字，函数会在调用它的对象中找到名为 `processorNumber`\
    \ 的变量，即 `smartPhone2`。\n\n## 自定义构造函数\n\n正如你可能注意到的，每次都为相似对象创建并分配属性是非常麻烦的。由于 `smartPhone1`\
    \ 和 `smartPhone2` 都被归类为手机，它们必然具有相似的方法和属性。考虑到这一点，我们可以这样做来让代码更整洁：\n\n```javascript\n\
    function Phone(screenSize, pixelDensity, processorNumber, processorSpeed, simCardNumber)\
    \ {\n    this.screenSize = screenSize;\n    this.pixelDensity = pixelDensity;\n\
    \    this.processorNumber = processorNumber;\n    this.processorSpeed = processorSpeed;\n\
    \    this.simCardNumber = simCardNumber;\n    this.textNumber = function(number,\
    \ text) {\n        console.log(\"Message, '\" + text + \"' has been sent to \"\
    \ + number);\n        console.log(\"Processing time: \" + text.length/this.processorNumber);\n\
    \    };\n    this.setSimCardNumber = function(newSimCardNumber) {\n        this.simCardNumber\
    \ = newSimCardNumber;\n    };\n}\nvar smartPhone1 = new Phone(5, 200, 2, 500,\
    \ 123456);\nvar smartPhone2 = new Phone(6, 400, 8, 2000, 654321);\n```\n\n看到代码是如何变得更短了吗？在现实生活中，这相当于创建了一个工厂。\n\
    \n## 结\n\n恭喜！你刚刚接触了面向对象编程！由于属性和方法的概念，面向对象编程使得代码更易理解。知道如何创建和操作对象是第一步，正如学习过程化编程语法也是第一步一样。第二步是学习如何分解复杂问题，而在面向对象编程中，这意味着学习如何表示数据。\n\
    \n# 第 8 章：探索对象\n\n到为止，我们讨论了如何创建对象来更方便地分解复杂问题，以及如何表示现实世界的概念。在本章中，你将学习更多关于如何识别对象，以及如何遍历它们的属性。在最后，我们将讨论一些重要的面向对象概念，以帮助你开启更复杂的面向对象编程之旅，其范围超出了本书。\n\
    \n## 识别数据类型\n\n随着代码变大，出错或忘记正在处理的数据类型也会随之增加。此外，某些黑客可能会利用未检查的数据类型来利用 JavaScript\
    \ 应用程序中的安全漏洞。尽管如此，为了确定你正在处理的信息的数据类型，只需使用 `typeof` 关键字。例如：\n\n```javascript\nvar\
    \ numberSample = 12;\nvar stringSample = \"AAA\";\nvar objectSample = { property1:\
    \ \"Sample string\" };\nconsole.log(\"Type of numberSample is: \"+ typeof numberSample);\n\
    console.log(\"Type of stringSample is: \"+ typeof stringSample);\nconsole.log(\"\
    Type of objectSample is: \"+ typeof objectSample);\n```\n\n## 区分不同对象\n\n我们现在知道如何识别字符串、数字和对象，但由于对象有内部分类（例如，手机类型的对象与汽车类型的对象不同），能够区分不同的对象也是个好主意。遗憾的是，JavaScript\
    \ 没有提供内置方法来提供你正在处理的对象类型。不过，你可以确认你正在处理的是特定类型的对象。参考以下示例代码：\n\n"
- fmt: "\n```javascript\nfunction Vehicle(transmission, color, type){\n    this.transmission\
    \ = transmission;\n    this.color = color;\n    this.type = type;\n}\nfunction\
    \ Boat(type, color){\n    this.type = type;\n    this.color = color;\n}\nvar blueTruck\
    \ = new Vehicle(\"automatic\", \"blue\", \"truck\");\nvar greenBoat = new Boat(\"\
    sailboat\", \"green\");\n```\n\nWe can use the following code to check if `blueTruck`\
    \ and `greenBoat` are vehicles or boats:\n\n```javascript\nconsole.log(\"Is blueTruck\
    \ a vehicle? \" + (blueTruck instanceof Vehicle));\nconsole.log(\"Is greenBoat\
    \ a vehicle? \" + (greenBoat instanceof Vehicle));\nconsole.log(\"Is blueTruck\
    \ a boat? \" + (blueTruck instanceof Boat));\nconsole.log(\"Is greenBoat a boat?\
    \ \" + (greenBoat instanceof Boat));\n```\n\n## Data Verification\n\nIn programming,\
    \ it’s always important to verify the data you’re dealing with, especially since\
    \ the computer can easily go haywire when fed with information it doesn’t expect.\
    \ That being said, just as it’s important to verify the object you’re dealing\
    \ with in certain cases, it’s also important to verify the existence of methods\
    \ you’re using.\n\nIn smaller codes, this might not be too important since it’s\
    \ relatively easy to keep track of methods and objects in your code, but in cases\
    \ wherein you’re tasked to build and maintain a complex program, certain methods\
    \ could be updated or removed in newer versions of the program. That being said,\
    \ it’s a good idea to check the availability of methods and properties that you\
    \ suspect may change in the future. Here’s a sample code that helps you determine\
    \ whether a method or property exists in an object:\n\n```javascript\n//Sample\
    \ function\nfunction Sample(aNumber, aString){\n    this.aNumber = aNumber;\n\
    \    this.aString = aString;\n    this.aFunction = function() {\n        console.log(\"\
    This is a function\");\n    };\n}\n// Method and Property check\nvar newObject\
    \ = new Sample(0, \"Hello\");\nconsole.log(\"Testing if aFunction exists: \" +\
    \ (typeof newObject.aFunction == 'function'));\nconsole.log(\"Testing if anotherFunction\
    \ exists: \" + (typeof newObject.anotherFunction == 'function'));\nconsole.log(\"\
    Testing if aNumber exists: \" + newObject.hasOwnProperty(\"aNumber\"));\nconsole.log(\"\
    Testing if anotherNumber exists: \" + newObject.hasOwnProperty(\"anotherNumber\"\
    ));\n```\n\nIn this code, we’ve used the `typeof` keyword to check whether a certain\
    \ function exists inside a method. If the method doesn’t exist, the statement\
    \ should return false, otherwise, it returns true. We’ve then introduced a new\
    \ method called `hasOwnProperty()` to check whether a property exists in an object\
    \ or not. As an exercise, do the same type of testing for the `aString` variable.\n\
    \n## Running through properties in a loop\n\nSurprisingly, there’s a variation\
    \ of the `for`-loop in JavaScript that you can use to run through all the properties\
    \ of a method. This modified for-loop is called a `for-in` loop, and it looks\
    \ like this:\n\n```javascript\nvar sampleObject = {\n    name: \"John Smith\"\
    ,\n    age: 22,\n    job: \"Software Engineer\",\n};\nfor(var property in sampleObject){\n\
    \    console.log(property);\n}\n```\n\nThis type of for-loop is usually only available\
    \ in object-oriented programming languages because it hides a lot of lines of\
    \ code that allow you to run through each property inside an object without creating\
    \ an intricate for-loop with counters and iterations.\n\n## Conclusion\n\nObject-oriented\
    \ programming contains a lot of new concepts that may baffle people who are used\
    \ to using procedural languages like C. Some of these include:\n\n*   `Inheritance`\
    \ - getting properties and methods from the parent class. You’ve seen this happen\
    \ whenever you call on functions and properties of an object you’ve created from\
    \ a parent class.\n*   `Polymorphism` - allows you to replace methods previously\
    \ defined in the prototype class, e.g.,\n\n```javascript\nfunction Sample(firstNumber,\
    \ secondNumber){\n    this.firstNumber = firstNumber;\n    this.secondNumber =\
    \ secondNumber;\n    this.sampleFunction = function() {\n        console.log(this.firstNumber\
    \ + this.secondNumber);\n    };\n}\nvar functionA = new Sample(5, 10);\nvar functionB\
    \ = new Sample(5, 10);\n// In here, we’ve redefined the sampleFunction() method,\
    \ but only for functionB:\nfunctionB.sampleFunction = function(){\n    console.log(this.firstNumber\
    \ - this.secondNumber);\n};\n// Notice how functionB now does things differently\
    \ from functionA even though they both come from the same class, which is Sample.\n\
    functionA.sampleFunction();\nfunctionB.sampleFunction();\n```\n\n*   `Prototype\
    \ Changes` - changing the prototype class so that we can add new functions that\
    \ all the objects under that class can use, e.g.,\n\n```javascript\nfunction Sample\
    \ (aNumber){\n    this.aNumber = aNumber;\n}\nvar objectFromSample = new Sample(15);\n\
    // Here, we add a new property using the 'prototype' keyword\nSample.prototype.aString\
    \ = \"Hi there!\";\nconsole.log(objectFromSample.aString);\nvar anotherObjectFromSample\
    \ = new Sample(25);\nconsole.log(anotherObjectFromSample.aString);\n```\n\nWith\
    \ the power to create many instances of objects, you can create all kinds of applications,\
    \ from games that rely on multiple instances of enemies, weapons, etc., to web\
    \ applications that rely on multiple data from users. It is through practice that\
    \ one learns how to use them efficiently. Hopefully, this chapter has introduced\
    \ enough of the object-oriented programming concepts to get you going.\n\n# Conclusion\n\
    \nCongratulations! You are now ready to explore JavaScript on your own; you can\
    \ check out other people’s codes and see how they work, or search for more JavaScript\
    \ methods and other information available online. While JavaScript has been known\
    \ as the interactive language of the web, more and more developers are now discovering\
    \ how JavaScript can be used in other platforms, like Android and iOS. There are\
    \ plenty of resources online that can help you use JavaScript in mobile development\
    \ and web development, but hopefully this book has given you a head start in the\
    \ concepts of programming. \n\nJavaScript is just one of the many languages out\
    \ there; if you’re interested in web programming, I suggest you pick up a book\
    \ on HTML5 and CSS. If you’re interested in mobile development, I suggest you\
    \ pick up a book on Android development or iOS Development (make sure you get\
    \ a fairly recent copy for iOS development, since the language used for older\
    \ versions is different). \n\nRemember that your learning doesn’t stop when you\
    \ flip the last page; in fact, it is after the last page of the book that you\
    \ get to test your book knowledge and gain experiential knowledge. Keep in mind\
    \ that programming, more than a hobby or a job, is a lifestyle. Programmers take\
    \ it upon themselves to solve the problems people don’t see. They create problems,\
    \ and then they solve them.\n\nI wish you the best of luck!\n\nRobert Dwight\n\
