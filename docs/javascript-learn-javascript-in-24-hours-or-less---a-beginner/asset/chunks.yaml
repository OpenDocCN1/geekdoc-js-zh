    \ saved is tucked neatly inside the file and accessible only through the word\
    \ processor menus. However, if you want to display the same sentence in HTML form,\
    \ the HTML file would look like this:\n\n| <html>    <head>    </head>    <body>       \
    \ <p>This is a sentence.</p>    </body></html> |\n\nBy saving this file with a\
    \ .html extension, you get a basic webpage that displays \"This is a sentence.\"\
    \ Notice how it has the same string of text as the previous text box, but it contains\
