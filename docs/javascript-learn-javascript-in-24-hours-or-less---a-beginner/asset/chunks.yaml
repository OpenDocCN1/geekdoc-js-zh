    \ The exercises and code snippets in this book do not require a specific text\
    \ editor so feel free to jump in and out of different text editors until you find\
    \ one that fits your needs.\n\n## \n\nChoosing a Web Browser\n\nText editors allow\
    \ you to create and save html files while web browsers allow you to view them.\
    \ Unfortunately, sometimes, the web pages you create may look and act differently\
    \ when viewed on different browsers, so here are the browsers you’ll want installed\
    \ on your system:\n\n*   Google Chrome – Google Chrome is one of the most popular\
    \ web browsers because of its speed and simplicity. With its built-in developer\
    \ tools you get to play around with the web sites you build and change snippets\
    \ of code on the fly so you can immediately see what lines of code you’ll want\
