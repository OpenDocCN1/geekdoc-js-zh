  trans: '


    注意程序现在如何一次又请求输入，直到从用户处获得有效输入为止。但请注意，重复弹出仅作为说明 `while-loops`（while 循环）能力的示例，不应在实际程序中使用，尤其是在网站中；没有人喜欢收到太多侵入性的弹出窗口。


    ## Do-While 循环


    某些情况下，你希望确保无论发生什么，一组指令在可能重复之前至少执行**一次**（ONCE）。例如：


    ```javascript

    var bool = false;while (bool){    console.log("I wanna be seen!");}

    ```


    由于条件已经返回 `false`，`while` 循环内部的任何内容都不会被执行。相比之下，`Do-while` 循环具有以下语法：


    ```javascript

    do{    <something>} while (<condition>);

    ```


    注意 `while` 语句位于代码块的末尾，并跟着一个分号，因为计算机只有在执行完 `do-while` 循环内部的代码块后，才会检查条件。修改我们之前的示例，我们现在有了：


    ```javascript

    var bool = false;do{console.log("I wanna be seen!");} while (bool);

    ```


    作为一个练习，请重写那个请求用户姓名、电子邮件、年龄和密码的示例，以使用 `do-while` 循环。与其说“你不能留这里为空……”，你不如再次询问用户“你的……是什么”。


    ## If-Else If-Else


    到目前，我们只制作了 `if-else` 语句，它只给了我们两个选项可选——在 `if` 语句或 `else` 语句中执行代码块。幸运的是，如果我们需要更多选项，只需在
    `if` 和 `else` 块之间添加一个 `else if` 块。如此，`if-else if-else` 语句看起来如下：


    ```javascript

    if ( <condition> ){    <action>}else if ( <condition> ){    <action>}else{    <action>}

    ```


    这是一个关于我们如何应用 `if-else if-else` 语句的示例：


    ```javascript

    var input = prompt("Please enter a number: ");if(input.length == 0){    alert("You
    haven’t entered anything!");}else if(isNaN(input)) //isNaN 是一个检查数据是否为数字的函数。它的实际含义是“不是数字”（is-Not-a-Number）。{    alert(input+"
    isn’t a number!");}else{    alert("You’ve typed: " + input);}

    ```


    作为一个练习，创建一个循环，不断询问用户数字，直到用户提供有效输入（字符串和空输入都是无效）。提示：`do-while` 和 `if-else if-else`
    代码的组合将会有用。


    ## Switch 语句


    `If-else if-else` 语句允许你向计算机提供条件指令，但有时，你只需要计算机根据特定的用户输入执行特定的指令。这在现实生活中的类比就像从自动售卖机中选择饮料。对于固定的、硬性的选择，让用户输入自己的选择是没有意义的。设置与首选饮料对应的按钮会更有意义。考虑到这一点，`switch`
    语句看起来如下：


    ```javascript

    var drinks = ["[a] Soda", "[b] Juice", "[c] Water", "[d] Milk"];var choice = prompt("Hi
    there! What are you in the mood for? We have: " + drinks + ". Please key in the
    letter of your choice.");switch(choice){    case ''a'':        alert("Dispensing
    one soda. Have a nice day!");        break;    case ''b'':        alert("Dispensing
    one juice. Have a nice day!");        break;    case ''c'':        alert("Dispensing
    one water. Have a nice day!");        break;    case ''d'':        alert("Dispensing
    one milk. Have a nice day!");        break;    case null:        alert("You don’t
    want anything? Alright, have a nice day!");        break;    case '''':        alert("You
    don’t want anything? Alright, have a nice day!");        break;    default:        alert("I’ve
    never heard of this " + choice + ". Here, take this water instead.");}

    ```


    注意它与 `if-else if-else` 语句非常相似，不同之处你不能在 `cases` 中放入数学表达式；你只能根据用户给出的输入让计算机选择要执行的代码块。`default`
    块非常类似于 `else` 块，告诉计算机当用户没有选择 `switch` 语句中具有对应 `cases` 的任何选项时该做什么。


    注意：`break` 关键字告诉计算机特定 `case` 的代码已执行完毕，因此可以退出。如果你删掉它，代码将继续执行其他 `cases`；始终记住在每个
    `case` 之后放置 `break`！


    ## 复习


    干得好！你刚刚完成了你的流程控制工具库：


    1. `if-else` 和 `if-else if-else` 语句

    2. `for`、`while` 和 `do-while` 循环

    3. `switch` 语句


    通过掌握这些流程控制工具，你可以编写出更高效的程序，因此继续练习并寻找优化代码的新方法非常重要。例如，让我们看看文本搜索应用程序（注意红色的添加行）：


    ```javascript

    var textBlock = "And so we’re back to this program.";var queryWord = "so";var
    matchCount = 0;for (var counter = 0; counter < textBlock.length; counter++){console.log("Outer
    for loop processing letter: " + textBlock[counter]);    if((textBlock[counter]
    == queryWord[0]) && (textBlock.length-counter >= queryWord.length))    {    console.log("Code
    inside ''if-else'' statement now processing letter: " + textBlock[counter]);      var
    match = true;      for(var counter1 = 0; counter1 < queryWord.length; counter1++)    {        if(!(textBlock[counter+counter1]
    == queryWord[counter1]))    {            match = false;            break;        }      if(match==true)    {            matchCount++;        }    else    {console.log("Code
    inside ''if-else'' statement now processing letter: " + textBlock[counter]);  }}console.log(''Done!
    Total matches: '' + matchCount);

    ```


    虽然程序目前运行良好，但问题是，即使剩余文本不足以匹配我们的查询，外层循环仍在运行。你可以看到这一点，因为 `for-loop` 和 `if-else` 代码仍然显示了我们添加的消息。在编程中，我们确保程序尽可能高效地运行，所以让我们添加一些代码来优化程序：


    ```javascript

    var textBlock = "And so we’re back to this program.";var queryWord = "back";var
    matchCount = 0;for (var counter = 0; counter < textBlock.length; counter++){console.log("Outer
    for loop processing letter: " + textBlock[counter]);


    if((textBlock[counter] == queryWord[0]) && (textBlock.length-counter >= queryWord.length))    {    console.log("Code
    inside ''if-else'' statement now processing letter: " + textBlock[counter]);      var
    match = true;      for(var counter1 = 0; counter1 < queryWord.length; counter1++)    {        if(!(textBlock[counter+counter1]
    == queryWord[counter1]))    {            match = false;            break;        }      if(match==true)    {            matchCount++;        }    else
    if(!(textBlock.length-counter >= queryWord.length))    {        console.log("’"
    +textBlock.substring(counter, textBlock.length) + "’" + " is too small to match
    " + "’" + queryWord + "’");        break;    }else    {console.log("Code inside
    ''if-else'' statement now processing letter: " + textBlock[counter]);  }}console.log(''Done!
    Total matches: '' + matchCount);

    ```


