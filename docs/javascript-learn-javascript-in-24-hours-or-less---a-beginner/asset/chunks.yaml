  trans: "\n通常情况下，你需要为每个类创建一个实例。需要指出，“对象（object）”和“类实例（class instance）”被视为同义词。在 Ruby\
    \ 中，你应该使用构造函数（即与类关联的方法）来创建对象。该语言使用 `new` 作为其默认构造函数。分析下方的示例：\n\n```\nmusic1 = Music.new(“Hotel\
    \ California”)\nmusic2 = Music.new(“Sweet Child of Mine”)\n```\n\n这两个实例都源自一个名为\
    \ `Music` 的类。然而，每个实例都有不同的属性。例如，每个对象都有一个标识符（也称为“对象 ID”）。此外，每个对象都可以持有一个或多个实例变量（即包含该实例特有数据的变量）。实例变量持有对象的“状态”（state）。在上面的示例中，每首歌都有一个唯一的变量来存储歌曲的标题。\n\
    \n你可以在每个类内部指定实例方法（instance methods）。方法是一系列功能集合，你可以在类的 `context` 上下文中调用这些功能。反过来，这些方法可以访问对象的状态和实例变量。例如，`Music`\
    \ 类可能有一个名为 `play` 的方法。如果一个变量指向一个对象，你可以调用该对象的 `play` 方法并听一首歌。\n\n你可以通过向对象发送消息来调用方法。这些消息包含了方法名以及它所需的参数。在接收消息后，对象将检查其所属类并搜索正确的方法。如果成功，该方法将运行。\n\
    \n这些消息和方法听起来可能很。但在实践中，它们极其简单。现在是时候分析一些方法调用了。对于这个示例，你将使用 `puts`（即一个打印其参数的方法）并在下一个表达式之前添加一个换行符：\n\
    \n```\nputs “Sample”.index(“a”)\nputs “test box.”.length\nputs sam.play(music)\n\
    ```\n\n这段代码产生：\n\n```\n2\n3\nboom, boom, boom ...\n```\n\n这些行显示了方法是如何作为 `puts`\
    \ 的参数被调用的。每个参数包含两个部分：“接收者（receiver）”（即点号左侧的单词）和方法（即点号后的单词）。\n\n## 基础知识\n\n语法规则可能非常枯燥无味，特别是对于没有经验的程序员来说。正如此，你将在以后学习语法规则。这本书的这部分将重点关注你创建\
    \ Ruby 应用时将用到的内容。\n\n现在，让我们创建一个基础的 Ruby 应用。你在这里使用的方法将在终端上打印问候语。在这个示例中，让我们多次调用该方法：\n\
    \n```rubydef say_hi(user_name)\n  result = “Hi, ” + user_name\n  return result\n\
    end\n\n# 个性化问候\nputs say_hi(“Mark”)\nputs say_hi(“Mary”)\n```\n\n如你所见，Ruby 的语法是清晰且简单的。如果你在不同的行上编写这些语句，就不需要使用分号来终止语句。要添加注释，你只需要使用\
    \ `#` 符号即可。此外，该语言在代码布局方面并不严格。即使你没有在代码中放置任何缩进，你的程序也不会产生错误。然而，建议使用缩进，因为它们可以确保代码的可读性。\n\
    \n你需要使用 `def` 关键字来定义方法。在这个关键字之后，你需要指定方法的标识符以及它的参数。你可以使用括号将参数括起来以提高代码的可读性。该语言在划分复合定义和语句时不需要大括号。相反，你只需要使用\
    \ `end` 关键字来终止你的定义或语句。\n\n在这个示例中，你定义了一个方法并调用了两次。在在这些情况下，你都将输出传递给了 `puts` 方法。记住，`puts`\
    \ 只是在终端上打印其参数并添加一个换行符（即该字符）。\n"
- fmt: "\nThe hashes and arrays of the Ruby language are collections of objects. Both\
    \ contain sets of objects that you can asses through a “key.” Hashes allow you\
    \ to use any type of object as your key. Arrays, on the other hand, require you\
    \ to use integers as keys. Both hashes and arrays expand to contain more elements.\
    \ Arrays offer excellent efficiency when it comes to accessing objects. However,\
    \ hashes provide great flexibility. Hashes and arrays may contain objects from\
    \ different data types. Thus, you may create a hash to store a string and an integer.\n\
    \nYou should use array literals (i.e. sets of elements written between brackets)\
    \ to generate an array object. Once you have an array, you may access its elements\
    \ by entering an index between a pair of square brackets. As the next example\
    \ shows, the indices of Ruby start from zero.\n\n```ruby\nx = [ 5, 'alligator',\
    \ 9.99 ]    # basic array that contains three elements\n\nputs = “The third element\
    \ of the array is #{x[2]}”\n\n# modify the first element\n\nx[0] = 6\n\nputs “The\
    \ elements of the array are #{x.inspect}”\n```\n\noutput:\nThe third element of\
    \ the array is 9.99\nThe elements of the array are [6, “alligator”, 9.99]\n\n\
    The current example involves a special value called “nil.” In most computer languages,\
    \ the term `nil` refers to the absence of any object. In the Ruby language, however,\
    \ `nil` has a different meaning: it is an object that doesn't represent anything.\n\
    \nCreating word-based arrays can be difficult, particularly because of the commas\
    \ and quotation marks. Fortunately, the Ruby language offers a shortcut: “%w”.\
    \ Analyze the example below:\n\n```ruby\nx = [ 'knight', 'bishop', 'king', 'queen',\
    \ 'pawn' ]\n\nx[2]      # “king”\n\nx[4]      # “pawn”\n\n# the code given below\
    \ produces the same result:\n\nx = %w{ knight bishop king queen pawn }\n\nx[2]\
    \      # “king”\n\nx[4]      # “pawn”\n```\n\nA hash is similar to an array. Hash\
    \ literals require curly braces instead of square brackets. Its literals should\
    \ provide two objects per item: the value and the key. You must separate these\
    \ objects using “=>”.\n\nFor instance, you can map songs to the artists who sang\
    \ them. The hash given below will show you how:\n\n```ruby\nsongs_artists = {\n\
    'If You Could See Me Now' => 'The Script'\n'Night Changes'      => 'One Direction'\n\
    'Love Yourself'      => 'Justin Bieber'\n}\n```\n\nThe words on the left-hand\
    \ side of the code serve as the keys. The ones on the right-hand side, meanwhile,\
    \ are the values. In Ruby, each key should be unique – you'll get an error if\
    \ you'll enter 'Love Yourself' twice.\n\nSimilar to arrays, you need to use square\
    \ brackets to index hashes. For the current example, you should use a method called\
    \ `p` to print values on a terminal. This method is similar to `puts`. The only\
    \ difference is that `p` prints values explicitly.\n\n```ruby\np songs_artists[\
    \ 'Night Changes' ]\n\np songs_artists[ 'If You Could See Me Now' ]\n\np songs_artists[\
    \ 'Love Yourself' ]\n\np songs_artists[ 'Like a Virgin' ]\n```\n\noutput:\n“One\
    \ Direction”\n“The Script”\n“Justin Bieber”\nnil\n\nAs you can see, hashes return\
    \ `nil` whenever you enter an invalid index. This is a convenient feature most\
    \ of the time, since `nil` is equivalent to `false` if used in a conditional expression.\
    \ However, Ruby lets you change this feature. For instance, if you want to know\
    \ how many times each particular word occurs within a file, you may set zero (i.e.\
    \ “o”) as your default value. Here, you can set words as keys and just increase\
    \ the corresponding value.\n\n## Symbols\n\nWhile programming, you usually need\
    \ to set the name of each significant object. For instance, you may set a name\
    \ for each compass point. Here's an example:\n\n```ruby\nEAST        =  1\nWEST\
    \       =  2\nNORTH  =  3\nSOUTH  =  4\n```\n\nYou may use these names for the\
    \ remaining part of your code. Here's an example:\n\n```ruby\nwalk(SOUTH)\nlook(WEST)\n\
    ```\n\n**Important Note:** In most cases, the numeric value of a constant is not\
    \ important (it just needs to be unique).\n\nThe Ruby language offers a simpler\
    \ alternative. A symbol is a constant name that doesn't require pre-declaration.\
    \ Additionally, a symbol is unique 100% of the time. Symbol literals begin with\
    \ “:”. Check the examples below:\n\n```ruby\nwalk( :SOUTH )\nlook( :WEST )\n```\n\
    \nYou don't have to set any value for your symbols—Ruby will do that on your behalf.\
    \ Additionally, Ruby makes sure that a symbol will retain its value regardless\
    \ of its position in the application. The code below will illustrate this idea:\n\
    \n```ruby\ndef walk(compass_point)\n  if compass_point == :SOUTH\n  # …\n  end\n\
    end\n```\n\nRuby programmers often use symbols in hashes. You may use symbols\
    \ to rewrite the “songs_artists” example above:\n\n```ruby\nsongs_artists {\n\
    'If You Could See Me Now' => 'The Script'\n'Night Changes'      => 'One Direction'\n\
    'Love Yourself'      => 'Justin Bieber'\n}\n```\n"
