- fmt: "\nYou can, instead, enter each line of code individually so you can see the\
    \ output of each command, but this gets especially tedious in larger bits of code.\
    \ When you get to more complicated stuff, you’ll eventually run into more errors\
    \ and bugs. When this happens, you’ll want to know what happens in specific commands\
    \ you give so that you can pinpoint exactly where things go wrong. \n\n`console.log()`\
    \ takes whatever code you put inside and logs its execution to the console. That\
    \ being said, let’s see `console.log()` in action:\n\n```\nconsole.log(5 > 10)\n\
    console.log(6 < 12)\nconsole.log(7 > 14)\n```\n\nNow you can see the output of\
    \ each line of code! \n\n# Flow Control\n\nYou now know the most basic data types,\
    \ mathematical operators, comparison operators, and a couple of neat console tricks.\
    \ In order to make them useful, however, we need to be able to manipulate the\
    \ flow of commands. For instance, if you wanted to create a user registration\
    \ form that asks for the user’s name, email address, age, and password, you’d\
    \ first declare the variables as:\n\n```\nvar name;\nvar email;\nvar age;\nvar\
    \ password;\n```\n\nNow we’d need to store the user’s input. For now, we use the\
    \ `prompt` function:\n\n```\nname = prompt('What’s your name?');\nemail = prompt('What’s\
    \ your email?');\nage = prompt('What’s your age?');\npassword = prompt('Please\
    \ enter your desired password: ');\n```\n\nAssuming you’ve entered the right kind\
    \ of information in the data fields, the `name`, `email`, `age`, and `password`\
    \ variables now have the right type of data to process and store. What if, however,\
    \ the user leaves the email field blank, or the age field with a letter? We can’t\
    \ just let the program continue if some of the vital fields of information don’t\
    \ have the right kind of data, therefore we use flow control statements. The first\
    \ one we shall discuss is the `if` statement.\n\n# If Statement\n\nIf you’ve already\
    \ programmed before, the structure of an `if` statement in JavaScript should be\
    \ almost identical to the one you’re familiar with:\n\n```javascript\nif (<condition>){\
    \    <action>}\n```\n\nIf you haven’t already programmed before, an `if`-statement\
    \ basically tells the computer to do whatever is inside the curly brackets (`{}`)\
    \ if the `if` condition is true. If we want to, for instance, prevent the user\
    \ from entering a blank field, we can do the following:\n\n```javascript\nname\
    \ = prompt('What’s your name?');\nif (name.length == 0){    name = prompt('You\
    \ cannot leave this empty. What’s your name?');}\nemail = prompt('What’s your\
    \ email?');\nif (email.length == 0){    email = prompt('You cannot leave this\
    \ empty. What’s your email address?');}\nage = prompt('What’s your age?');\nif\
    \ (age.length == 0){    age = prompt('You cannot leave this empty. What’s your\
    \ age?');}\npassword = prompt('Please enter your desired password: ');\nif (password.length\
    \ == 0){    password = prompt('You cannot leave this empty. Please enter your\
    \ desired password:');}\n```\n\nThe code can seem overwhelming for the first-time\
    \ programmer, but when you read each line carefully, you’ll see that they follow\
    \ quite a neat and logical structure:\n\n1) First, since the `prompt()` function\
    \ gives you whatever the user types in, you store the string inside a variable\
    \ so you can use it later in the program.\n2) The `if` statements check if the\
    \ variable is empty by checking if the length is equal to zero or not.\n    a)\
    \ If the length is equal to zero, it asks for input again.\n    b) If the length\
    \ isn’t equal to zero, it doesn’t ask for input again.\n\nTake note that this\
    \ sample code only serves to illustrate how the `if` statement works. Under no\
    \ circumstances should you keep using the `prompt()` function to ask the user\
    \ for information. \n\nNow, what if you want to do something else in case your\
    \ first condition isn’t met? For instance, what if you want to say \"Your name\
    \ is <name>. Got it!\" after the user types in a valid name? Then we add an `else`\
    \ condition, followed by a second pair of curly braces that enclose the second\
    \ set of commands:\n\n```javascript\nname = prompt('What’s your name?');\nif (name.length\
    \ == 0){    name = prompt('You cannot leave this empty. What’s your name?');}else{\
    \    alert('Your name is ' + name + '. Got it!');}\nemail = prompt('What’s your\
    \ email?');\nif (email.length == 0){    email = prompt('You cannot leave this\
    \ empty. What’s your email address?');}else{    alert('Your email is ' + email\
    \ + '. Got it!');}\nage = prompt('What’s your age?');\nif (age.length == 0){ \
    \   age = prompt('You cannot leave this empty. What’s your age?');}else{    alert('Your\
    \ age is ' + age + '. Got it!');}\npassword = prompt('Please enter your desired\
    \ password: ');\nif (password.length == 0){    password = prompt('You cannot leave\
    \ this empty. Please enter your desired password:');}else{    alert('Your password\
    \ is ' + password + '. Got it!');}\n```\n\nNow your code sounds a little more\
    \ human, as it responds better to user input. Try messing around with the code\
    \ and see how the interpreter changes the output depending on the conditions met\
    \ with the `if-else` statements. \n\n# Debugging\n\nSo far, you’ve managed to\
    \ play around with variables, data types, mathematical operators, comparison operators,\
    \ user prompts, confirmation dialogues, and alerts, and lastly, `if-else` statements.\
    \ Don’t worry if you make a couple of mistakes; computers are intrinsically literal\
    \ and will not tolerate the tini syntactical mistakes. That being said, here are\
    \ a couple of codes that don’t seem to work as intended. Change the following\
    \ code snippets so that you can produce the appropriate output!\n\n```javascript\n\
    var name = \"Chris\";\nalert('Hi ' + 'name' + '! It’s nice to meet you.');\n```\n\
    \nIn this code snippet, the output is supposed to be \"Hi Chris! It’s nice to\
    \ meet you.\" What’s the current output and what do you think is wrong with the\
    \ code? Notice that the console doesn’t complain and throw you an error message\
    \ when you execute this code. This kind of problem is called a 'bug,' because\
    \ while the JavaScript interpreter sees nothing wrong with this code, it doesn’t\
    \ work as intended. \n\nNow try to correct this code snippet that contains both\
    \ bugs and errors:\n\n```javascript\nvar name;\nvar age;\nname = prompt('What’s\
    \ your name?');\nif (name.length = 0);{    name = prompt('You cannot leave this\
    \ empty. What’s your name?');}else (name.length != 0){    alert('Your name is\
    \ ' + name + '. Got it!');}\nage = prompt('What’s your age?');\nif (age.length\
    \ = 0){    age = prompt('You cannot leave this empty. What’s your age?');}else\
    \ (name.length != 0){    alert('Your age is ' + age + '. Got it!');}\n```\n\n\
    This code is a distorted version of a previous sample code, so you may try to\
    \ compare the codes and see why this doesn’t work. If you feel stuck, you can\
    \ check out a program called 'linter,' which is a handy tool that checks your\
    \ code for errors and tells you which lines have them. It’s good exercise to practice\
    \ your debugging skills now, because when you create more complex programs, debugging\
    \ becomes almost routine. \n\n## What to look for when debugging\n\nLooking for\
    \ bugs and errors can be quite overwhelming if you don’t know where to look. Here\
    \ are some of the most common mistakes programmers make when coding:\n\n1. Using\
    \ `=` instead of `==` to compare two values - the `=` sign in programming is used\
    \ as an assignment operator, which means that if you use this instead of the `==`\
    \ sign, you end up replacing the value of the variable on the left hand side of\
    \ the equation with the value on the right hand side of the equation. \n2. Misplacing\
    \ the semicolon - just as periods end sentences in the English language, semicolons\
    \ end statements in JavaScript, as well as other programming languages like C,\
    \ Java, etc. If, for instance, you’ve accidentally put a semicolon in the middle\
    \ of a statement, JavaScript would see the statement as incomplete and produce\
    \ an error for it.\n"
