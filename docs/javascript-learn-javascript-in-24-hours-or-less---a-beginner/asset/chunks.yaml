    \ didn’t have the <html> tags and other stuff. What gives?\n\nNow, try changing\
    \ your html file by adding a few tags. It should then look like this:\n\n| <!DOCTYPE\
    \ html><html>   <body>      Hi There!   </body></html> |\n\nNow reload your browser\
    \ and see what happens.\n\nYour browser isn’t malfunctioning; the web page looks\
    \ pretty much the same despite the addition of tags in the source code. At this\
    \ point you may not fully understand why tags are used, but don’t worry; you’ll\
    \ see what they're for when you start programming in HTML more.\n\nConclusion\n\
    \nYou’ve just had your first dive into HTML- nothing too thorough, just enough\
    \ of the basics to help you use JavaScript with HTML properly. If you’re interested\
    \ in learning more about HTML, you’ll want to take a look at online tutorials\
    \ and references, as well as see how other web developers code their own sites.\
    \ You can do the latter by right-clicking a site and clicking on 'view page source'\
    \ or something along those lines. If you’re ready to take the plunge into JavaScript,\
    \ head over to chapter 2.\n\n# Chapter 2: Introduction to JavaScript\n\nNow that\
    \ we’ve covered the essentials of HTML, we can now introduce the basics of programming,\
    \ with JavaScript as the medium. Make sure that you at least understand the backbone\
    \ of HTML before proceeding, otherwise, feel free to go back to Chapter 1 and\
    \ skim through the material once more.\n\n## Piecing Together HTML and JavaScript\n\
    \nJavaScript conveniently fits into HTML quite readily using the script tag. The\
    \ script tag can either contain a JavaScript code or a reference to a .js file\
    \ that contains the JavaScript code. The latter is advised when creating long\
    \ JavaScript code to avoid mixing up different programming languages in one file\
    \ - that’d be like writing an essay with some paragraphs in English and some paragraphs\
    \ in Latin! Internal JavaScript is, however, good to use when  you’re testing\
    \ out small fragments of JavaScript code. \n\n## \n\na. Internal JavaScript\n\n\
    If you want to use JavaScript without having to create a .js file, you can simply\
    \ put the JavaScript inside the script tag as shown below:\n\n| <script>    alert(\"\
    Hi There!\");</script> |\n\nPut this inside your HTML file as show below and check\
    \ out your first JavaScript code popping-up to greet you!\n\n| <!DOCTYPE html><html> \
    \  <body>      <script>         alert(\"Hi There!\");      </script>   </body></html>\
    \ |\n\nPretty cool, huh? While this chunk of code is simple enough to understand,\
    \ when you begin writing websites with more complex codes, keeping different programming/scripting\
    \ languages in one file becomes rather unwieldy. It makes sense to place the JavaScript\
    \ code in a separate file so that the HTML code stays neat and easier to maintain.\
    \ This is where external JavaScript comes in.\n\n## \n\nb. External JavaScript\n\
    \nJust as you can reference a CSS file from an HTML file to keep the codes separate,\
    \ you can also keep JavaScript in a separate file and simply reference that file\
    \ from HTML. In order to use JavaScript code saved in another file, you’ll simply\
    \ have to use a script tag that contains an src attribute that references the\
    \ file you’d like to use, as shown below:\n\n| <script src=\"hello.js\"></script>\
    \ |\n\nThis code snippet will find a file called “hello.js” and execute whatever\
    \ JavaScript code is inside it. Make sure, however, that the JavaScript file is\
    \ located in the same folder where the HTML file is kept.\n\n## \n\nc. Instant\
    \ JavaScript \n\nIf you’d like to test short JavaScript statements without having\
    \ to modify the original source code, you can use the consoles provided by Google\
    \ Chrome and Firefox by right clicking the webpage and clicking on “inspect element”.\
    \ In the console window/tab, you can type any JavaScript statement you want, and\
    \ pressing enter executes it immediately. You can either choose this method to\
    \ test the code snippets in this book, or if you’d like a more traditional approach,\
    \ you can use the script tags for your JavaScript code and refresh your webpage\
    \ to update the output. However, in the examples and exercises that’ll be provided,\
    \ the modern approach of using the console shall be used.\n\n## \n\nMeet JavaScript\n\
    \nIn order to give you a running start in JavaScript, you’re going to try out\
    \ a few lines of JavaScript code. For now, we’re going to use the console to try\
    \ out the commands (right-click any webpage, click inspect, and find the console\
    \ tab). As you test the succeeding codes, make sure you don’t just passively copy\
    \ and paste them into the console. Observe the structure of the language and make\
    \ a couple of guesses as to what the outputs would be before you check. This’ll\
    \ make it much easier for you to retain what you’re learning. \n\nType your name\
    \ and lock it in with two quotation marks, for example:\n\n| \"Chris\" |\n\nYou’ve\
    \ just created a string, which is basically just a collection of letters, numbers,\
    \ and other symbols. We can do plenty of things even with a single string, but\
    \ for now, let’s make JavaScript count how many letters your name has:\n\n| \"\
    Chris\".length |\n\n You should get 5\\. That being said, apart from dealing with\
    \ strings, JavaScript also knows how to do math. Try adding the lengths of your\
    \ first and last name, for example:\n\n| \"Chris\".length + \"Nicholas\".length\
    \ |\n\nThis would give you 13\\. Now go ahead and play around with this by using\
    \ actual numbers and trying out multiplication (*), division (/), and subtraction(-).\n\
    \nNotice that while the commands you’ve put in so far are quite intuitive and\
    \ easy to understand, programming languages require a lot more precision compared\
    \ to human language. For instance, if you try to read the following \"Tihs is\
    \ a Coemplx Stenence,\" you’d be able to decipher the meaning, but in programming\
    \ languages, if you so much as misplace a period, at best you’d receive an error\
    \ - at worst a bug. For instance, try inputting the following code:\n\n| \"Chris\"\
    l.ength |\n\n This would confuse the interpreter, even if you’ve simply misplaced\
    \ the period. \n\nOther than misspellings and misplaced symbols, another way to\
    \ confuse the interpreter is to use commands it doesn’t know about, for instance,\
    \ if you type:\n\n| bacon |\n\nThe interpreter would complain and say that 'bacon'\
    \ is not defined. Because you’ve typed 'bacon' without the quotation marks, the\
    \ interpreter thinks you’re trying to make it perform the 'bacon' command, which\
    \ doesn’t exist in the JavaScript library as of now. \n\nWhat if you simply want\
    \ to type a bunch of hints and descriptions inside your code? You can tell the\
    \ interpreter to ignore lines of code simply by typing '//' before the beginning\
    \ of the line. For example:\n\n| //This is a comment. The interpreter won’t care\
    \ about what I put here, even//Valid commands like//2+3//But by removing the '//', 2+3//You\
    \ should get 5\\. |"
