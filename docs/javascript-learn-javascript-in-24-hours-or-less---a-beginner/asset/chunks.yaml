    # Introduction

    The Internet has come a long way since the early 90s. With hundreds of thousands
    of computers already connected in a network, there arose the dilemma as how data
    were to be distributed to different computers in an organized manner. With this
    mind, Tim Berners-Lee created a hyperlinking framework known as the Hypertext
    Protocol (`HTTP`). Alongside `HTTP` he also created a markup language known as
    the Hypertext Markup Language (`HTML`).


    In modern web browsers, most of the time you no longer have to type in `HTTP`
    or `HTTPS` in order to visit a website. You also won’t see the `.html` extension
    very often as you surf the web. These are done in order to simplify the web browsing
    experience for casual users.


    As you may have noticed, there’s a trend among web developers to make things as
    simple as possible for the web surfers. While the early 2000’s seemed good enough
    for a lot of people, with the advent of flashy, glossy text and buttons and “click
    here to enter” flash intros, these elements do not accurately represent the current
    trend of minimalist, dynamic content. The old sites required you to load and reload
    different web pages whenever you click a button, which hampers the web surfing
    experience, as a lot of data would get lost in data fields because you had to
    keep refreshing web pages to check for updated content. In short, as information
    grew more dense and complex, there was a need to simplify how we access those
    bits and pieces of information, otherwise we end up drowning in a sea of data.


    This book isn’t a reference guide, nor is it a set of dry academic lectures; it’s
    a practical walkthrough in `JavaScript programming`, built on the very idea current
    web technologies are built upon - the need to simplify.


    Before going any further, ask yourself these questions:

    - Do you have a computer that has a functional browser and an internet connection?

    - Do you want to learn how to create web pages that can intelligently talk back
    to the user and add new information in real time?

    - Do you prefer friendly walkthroughs over dull and dry reference manuals?


    If you’ve answered yes to at least number 2 and 3, this book is for you. In case
    you’ve answered no to number 1, you may want to consider getting `Google Chrome`
    or `Mozilla Firefox`, both of which are excellent browsers, to start you off,
    otherwise the sample codes may not work as intended.


    **Note:**

    If you truly wish to learn as quickly as you can from this book, then I advise
    doing ALL the exercises and activities in the chapters. Resist the urge to skim
    through sample codes without trying them out yourself - running the codes help
    you understand and apply what you’ve learned. Speed-reading through the chapters
    will only give you surface-level knowledge - enough to impress programming novices
    at a dinner party.


    Let’s begin the journey.


    # Chapter 1: HTML Overview

    `HTML`, `CSS`, and `Javascript` work in tandem to give users a seamless web experience.
    A lot of budding web developers have these three confused. If you’re completely
    new to the world of web development, this chapter should give you a quick tour
    of `HTML`. On the other hand, if you already know `HTML`, feel free to skip or
    skim this chapter.


    ## Choosing a Text Editor

    Before you start creating interactive webpages, you’ll have to download a good
