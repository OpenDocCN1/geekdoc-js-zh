    \ until the last letter of \"two\", then we can now say that we’ve found 1 instance\
    \ of \"two\" in the numberSet. The search, however, still has to continue until\
    \ the last three letters of the numberSet:\n\n\"One two three four f[i]ve\" vs.\
    \ \"[t]wo\"\n\nwhich translates to:\n\n| numberSet[20] == queryString[0]; |\n\n\
    Since this statement will return false, there’s no need to go further to 'v' or\
    \ 'e' since the remaining letters are too small to provide a match for \"two\"\
    .\n\n## \n\nStill Confused?\n\nIf you find yourself confused and overwhelmed with\
    \ the process of converting problems from English to JavaScript, it’s a good idea\
    \ to come up with a list of how you want your program to handle the problem. For\
    \ instance, here’s the procedure list for our string-search program:\n\n3) Run\
    \ through the letters of the block of text \n\na) Does the current letter match\
    \ the first letter of our query string?\n\ni) If yes, run through the rest of\
    \ the letters of our query string and compare each letter to the succeeding letter\
    \ of the block of text.\n\nii) If no, proceed to next letter.\n\nb) Was there\
    \ a match?\n\ni) If yes, record it\n\nii) If no, continue \n\nOf course, there\
    \ are plenty of optimizations that you may discover in the future that’ll make\
    \ this program use less resources, but for now, this is a  great example of how\
    \ one needs to learn the art of reverse-engineering. As you start creating more\
    \ and more complex JavaScript applications, you learn more about how you can efficiently\
    \ translate human problems into computer-understandable problems. \n\nConclusion\n\
    \nCongratulations! You’ve just learned about for-loops, arrays, and how everything\
    \ else you’ve learned so far comes together to help you write useful programs!\
    \ As you’ve noticed in our latest example, programming entails more than just\
    \ learning the syntax of a language. In the same way that poetry requires not\
    \ only a certain level of mastery of the language, but also a certain level of\
    \ mastery in self-expression, programming requires a certain level of mastery\
    \ in breaking down problems, as well as coming up with working solutions to them.\
    \ The language simply serves to provide a concrete structure for your solution.\
    \ In the next chapter, we’ll add some improvements to our current program, as\
    \ well as add a couple of flow control techniques to your arsenal. So far you’ve\
    \ taken in quite a handful of information, so feel free to take a break and come\
    \ back when you’re ready.\n\n# Chapter 6: Mastering Flow Control\n\nSo far, we’ve\
    \ taken up if-else statements and for-loops. While you can make fast and efficient\
    \ programs using only these two, there are more tools that can help you fine-tune\
    \ your programs. In this chapter, we’ll learn about these new tools, as well as\
    \ optimization techniques to wrap-up the procedural part of JavaScript (JavaScript\
    \ is a dynamic language, so it can be procedural, object-oriented, etc. depending\
    \ on how you use it).\n\n## \n\nWhile Loops \n\nThe first kind of loop you’ve\
    \ used in this book is the for-loop, which uses three parameters:\n\n1.  Initial\
    \ value of the counter\n\n2.  Condition for the loop to repeat\n\n3.  Iteration\
    \ of the counter\n\nWhat if, however, you need to repeat something based on a\
    \ non-numerical condition? For instance, what if, say, going back to our lesson\
    \ on if-statements back in Chapter 3, we’ve talked about repeating the request\
    \ for user input if the user doesn’t enter anything. The if-statements, however,\
    \ only lets you do this once. For-loops, while useful in repeating commands for\
    \ a specific number of times, it doesn’t fit particularly well in this dilemma\
    \ since you want to keep asking the user for input until he puts in something\
    \ valid; you can’t realistically predict how many times the user will leave something\
    \ blank. \n\nThat being said, when we can’t easily tell when we need to stop looping\
    \ at the start of the code, we can use a while loop. Here’s what it looks like:\n\
    \n| while(<condition>){    <action>    <something that should eventually make\
    \ the condition false>} |\n\nBasically, the while loop is just a for-loop without\
    \ the counter and its iteration. The good and bad thing about this is that you\
    \ can put just about any condition that returns true or false, and inside the\
    \ brackets, you can put any statement that eventually turns the condition false.\
    \ For instance:\n\n| var keepLooping = true;while (keepLooping){    console.log(\"\
    Just keep looping!\");    keepLooping = false;} |\n\nNotice that we’ve executed\
    \ the code only once because we’ve set keepLooping to false. You can also use\
    \ while loops to do the same thing for-loops do, for instance:\n\n| var counter\
    \ = 0;while(counter <= 10){    console.log(counter);    counter++;} |\n\nThe equivalent\
    \ of this for the for-loop is:\n\n| for(var counter = 0; counter <= 10; counter++){ \
    \   console.log(counter);} |\n\nBut as you see, the for-loop does this much more\
    \ cleanly than the while loop, especially since the variable 'counter' only exists\
    \ inside the for-loop and is cleaned up when the loop ends. As for the while loop,\
    \ the counter keeps its value as long as the program remains running. \n\nNow\
    \ let’s use while loops to optimize our code back in Chapter 3:\n\n| var name\
    \ = prompt('What’s your name?');while (name.length == 0){    name = prompt('You\
    \ cannot leave this empty. What’s your name?');}alert('Your name is ' + name +\
    \ '. Got it!');var email = prompt('What’s your email?');while (email.length ==\
    \ 0){    email = prompt('You cannot leave this empty. What’s your email address?');}alert('Your\
    \ email is ' + email + '. Got it!');var age = prompt('What’s your age?');while\
    \ (age.length == 0){    age = prompt('You cannot leave this empty. What’s your\
    \ age?');}alert('Your age is ' + age + '. Got it!');var password = prompt('Please\
    \ enter your desired password: ');while (password.length == 0){    password =\
    \ prompt('You cannot leave this empty. Please enter your desired password:');}alert('Your\
    \ password is ' + password + '. Got it!'); |"
