    # 进入安全模式


    如果你在使用 Windows 10 时遇到问题并必须返回安全模式，请按照以下步骤操作：


    - 打开设置 > 更新和安全 > 恢复 > 高级启动。

    - 点击 疑难解答 > 高级选项 > 系统还原。

    - 点击重启，并按 F4。


    # 第 6 章：键盘快捷键及更多技巧


    学习键盘快捷键和技巧，它们将帮助你以更高效、更易管理的方式使用 Windows 10！


    ### 打开程序的快捷键


    转到开始菜单 > 所有应用。


    找到你想要创建快捷方式的程序，然后右键点击它。你将看到一个下拉菜单。选择“打开文件位置”，然后跳过屏幕上弹出的下一个步骤。


    一旦找到该程序，将其从开始菜单一直拖动到桌面。右键点击并选择“属性”。


    现在，属性窗口会在屏幕上打开。寻找“快捷方式”选项卡，然后选择“快捷键”。按下你想要与程序关联的键（例如，CTRL + ALT + [所选按键]）。


    点击“确定”。


    现在你可以使用你选择的快捷键来打开此特定程序！


    ### 命令提示符快捷键


    转到开始菜单 > 所有应用 > Windows 系统 > 命令提示符。


    点击属性 > 选项 > 编辑选项 > 启用 CTRL 键快捷键。


    现在，这里有一个你可以使用的快捷键列表：


    - Alt + F4（关闭命令提示符）

    - CTRL + A（选择当前行所有内容）

    - CTRL + C 或 CTRL + Insert（将选定文本复制到剪贴板）

    - CTRL + F（从命令提示符打开查找窗口）

    - CTRL + M（进入标记模式）

    - CTRL + Page Up/Down（屏幕向上或向下移动一页）

    - CTRL + Shift + Home/End（光标移动到缓冲区开头/结尾，然后选择输出内容的开头/结尾）

    - CTRL + Shift + Left/Right（光标向左/右移动并选择文本）

    - CTRL + Up/Down（向上或向下移动一行）

    - CTRL + V 或 Shift + Insert（粘贴复制行并选择文本）

    - Shift + Home/End（光标移动到当前行开头/结尾并选择文本）

    - Shift + Page Up/Down（光标向上/向下移动屏幕并选择文本）

    - Shift + Up/Down（光标向上或向下移动一行然后选择文本）

    - Up/Down/Left/Right（在标记模式下；光标上、下、左、右移动）


    ### 其他实用的键盘快捷键：


    - Windows  + 左（将窗口贴靠到屏幕左侧）

    - Windows  + 右（将窗口贴靠到屏幕右侧）

    - Windows  + 上/下（将窗口贴靠到象限）

    - Windows  + Tab（任务视图）

    - Windows  + CTRL + 左（返回上一个虚拟桌面）

    - Windows  + CTRL + 右（前往下一个虚拟桌面）

    - Windows  + CTRL + F4（关闭当前虚拟桌面）

    - Windows  + CTRL + D（创建新虚拟桌面）


    # 加速 Windows 10


    若要创建更快的设置，只需进入搜索框，输入 `netplwiz` 并按回车。


    当你看到标签*必须输入用户名和密码才能使用此计算机*时，找到旁边的框并取消勾选。


    为了获得更快的开始菜单，转到搜索框，输入 `sysdm.cpl` 并按回车。


    点击*高级 > 设置*。


    取消勾选*在最小化和最大化时激活 Windows*。


    点击应用。


    现在，为了更快地关闭电脑，只需在桌面右键点击，点击*新建 > 快捷方式*，然后在位置字段中输入以下：`%windir%\system32\shutdown.exe/s/0`


    # 最大化 Windows 10 的使用


    确保最小化你正在使用的窗口以外的所有窗口。这将加快进程并确保电脑不会卡顿！


    将回收站固定到开始菜单——像以前一样！


    使用 Alt 键快速打开属性菜单。


    通过点击“所有应用”来快速浏览开始菜单。


    要在背景滚动，只需点击*设备 > 鼠标和触控板*


    - 悬停在非活动窗口时滚动。


    # 第 7 章：常见问题 (FAQs)


    最后，这里有关于 Windows 10 的常见问题解答供你参考！


    问：Windows 10 是什么时候发布的？


    答：Windows 10 于 2015 年 7 月 28 日正式发布。对于操作系统为 Windows 7 或 8 的用户，这提供一年的免费。如果你在一年后没有升级到
    Windows 10 并决定要升级，则需要为 Windows 10 支付 119，为 Windows 10 专业版支付 199。


    问：哪里可以获取 Windows10 应用？


    答：微软认为你可以从应用 Store 购买，这些通用应用将适用于你同步到帐户的所有设备。即使是 Microsoft Office 也可以运行——你基本上可以过上便利的生活！


    问：它可以在笔记本电脑或 Windows 手机上运行吗？


    答：Windows 10 可以作为桌面/笔记本电脑、Windows 手机和平板的唯一操作系统。这是由于 Continuum，它让 Windows 10 运行——并且无论使用鼠标、键盘还是触摸屏都可以轻松操作。你还可以下载和使用适合手指的全屏应用。


    问：如果我不希望应用程序占据所有屏幕空间，或者我想重新排列它们怎么办？


    答：Windows 10 的优点在于全屏应用是可选的——如果你觉得你的设备与它们不兼容，你可以选择不下载。由于我们现在有了 Continuum，你可以预计应用程序将在你希望运行的设备上工作——它们会自动调整形状，让你无需费力调整。


    开始菜单让人想起了美好的时光，不像 Windows 8 那样令人困惑（很多人讨厌它）。此外，正如你之前学到的，这个新的开始菜单可以使用根据自己的需求和偏好自定义的磁贴（Live
    Tiles）——使 Windows 10 成为你能拥有的最好的操作系统。


    由于所谓的“贴靠”（Snap），你还可以并排排列应用程序。这就是象限的用途，正如你所看到的，你已经拥有可以使用来运行它的命令。很棒的一是……

    '
