    ## 第 4 章：理解界面


    在本章中，你将学习更多享受 Windows 10 的方法——这主要关于了解如何与它的界面交互！


    ### 使用快速访问


    许多人说“快速访问”让 Windows 10 变得更加容易管理——这确实很有道理。你可以在下方了解更多相关信息：


    - 要将文件添加到快速访问，只需导航到你想要添加的文件，然后简单点击“固定到快速访问”。


    - 要从快速访问中移除文件，转到该文件并点击“取消从快速访问”。


    - 要从快速访问中移除最近使用的文件和频繁使用的文件夹，只需前往“查看 > 选项 > 通用 > 隐私”。然后，取消勾选“显示最近使用的文件”。点击“清除 >
    清除文件资源管理器历史”。你也可以选择“隐藏”或“从最近使用列表中隐藏”。


    - 要更改资源管理器的打开方式，只需点击“查看 > 选项 > 打开资源管理器 > 此电脑”。


    ### 使用贴靠辅助 (Snap Assist)


    这是 Windows 10 独有的功能！它可以帮助你将特定窗口贴到屏幕的一侧，这样你就无需花费大量时间来移动它。


    - 要使用鼠标贴靠窗口，点击它的标题并将其拖到屏幕侧边。你将看到一个轮廓，它会显示在你拖动后窗口将出现的位置。


    - 使用键盘贴靠，只需按下 Windows 键 + 左箭头（或右箭头）。


    - 要贴靠到四个象限之一，只需按下 Windows 键 + 向上箭头（或向下箭头），然后通过同时按下 Windows 键和方向键来移动它。


    ### 使用多桌面


    是的，在运行 Windows 10 时可以使用多个“桌面”。要实现这一点，请按照以下说明操作：


    - 点击“任务视图”添加桌面。按下 Tab + Windows 键 > 新桌面。


    现在，你有两个虚拟桌面了。要在它们之间切换，只需按下 Windows 键 + CTRL + 左箭头 + Windows 键 + CTRL + 右箭头。


    - 要在桌面之间移动窗口，只需右键点击你想移动的窗口，然后选择你想将其移动到的位置。


    - 要关闭桌面，只需点击 X 或按下 Windows 键 + CTRL + F4。


    ### 隐藏系统托盘图标


    要临时隐藏系统托盘图标，你只需要将该图标拖放到箭头下方的隐藏区域即可。然而，如果你能在屏幕上看到所有图标，只需打开任务管理器（按 CTRL + ALT +
    DELETE），然后终止 GWXUX 或 GWX。


    - 要永久隐藏系统托盘图标，前往“控制面板 > Windows 更新”。


    选择“已安装的更新”——你会在屏幕左侧看到它。


    查找标签“Update for Microsoft Windows KB3035583”并移除该更新。


    通过将其从未来的更新中隐藏来始终跳过此更新。


    ## 第二部分：第二周


    现在你已经了解了基础知识，是时候更加享受 Windows 10 了！


    ## 第 5 章：理解功能


    当然，为了确保你能够享受 Windows 10 的各种功能，学习如何使用它的许多功能是恰恰好的！


    ### 在网页上书写


    这是 Windows 10 的一个趣味功能！基本上，你可以借助 Windows 10 的下一代浏览器 Microsoft Edge，通过实实在在地在网页上书写来增加一点乐趣！


    - 要开始“书写”，点击浏览器窗口右上角看起来像笔和纸那样的图标。


    - 一旦点击该图标，你正在浏览的网页就会刷新。然后你就可以使用屏幕上看到的工具在上述网页上书写或涂鸦了！


    - 要输入注释，你可以可以使用上述工具栏上的文本工具。


    - 可以点击编号图钉并关闭文本框来使页面整洁。


    - 点击垃圾桶图标删除文本框以及注释图钉。


    - 你还可以使用剪切工具让光标变成十字准星。


    - 你还可以使用橡擦工具逐行擦除。只需点击、按住并移动到屏幕上你不想要的行上即可。


    - 要分享或保存你的所作，只需点击保存图标。然后屏幕上会弹出一个菜单。它会询问你是否想将项目添加到阅读列表、保存到 OneNote 或添加到收藏夹。只需根据你想要发生的结果进行即可。


    ### 管理通知


    由于 Windows 10 被证明是新时代的操作系统，你可以预期它为你提供实时通知。简而言之，你将收到来自 Facebook、Twitter、Instagram
    以及你可能使用的任何其他应用的通知——只要它们连接了你的微软帐户。


    - 要选择你想收到的通知，前往“操作中心 > 显示来自这些应用的通知”。在那里，你会看到你拥有的应用列表。只需选择你想收到的通知，就搞定了！


    - 你还可以选择你想访问哪些“快速操作”。要执行此操作，前往“设置 > 系统 > 通知和操作 > 选择你的快速操作”。


    ### 快速共享文件


    - 寻找你想共享的文件。


    - 在文件资源管理器中点击“共享”。


    - 点击“共享”按钮。


    - 选择你想与哪个程序共享该文件。


    - 通过“设置 > 系统 > 共享实验室”来配置选项。


    ### 设置默认程序


    你可以按照以下说明更改默认程序：


    打开“设置 > 系统 > 默认应用”。


    - 要设置单个文件类型，前往“设置 > 系统 > 默认应用按文件类型”。


    - 要设置协议默认值，前往“设置 > 系统 > 默认应用按协议”。


    ### 照片应用


    请注意，照片应用现在有两个主要功能，即“收藏”和“相册”。你的照片按日期排列在“收藏”中。


    - 要添加文件夹，前往“设置 > 将此文件夹添加到照片”。


    - 要显示来自 OneDrive 的照片和视频，只需选择“设置 > 显示我的照片”。


    - 要分享照片，只需选择你想分享的照片并点击“共享”！


    ### 使用延迟快门捕捉弹出窗口


    你也可以在截屏时延迟快门，以确保也能捕捉弹出窗口。方法如下：


    打开截图工具并点击“延迟”。选择 0 到 5 之间的数字。


    点击你找到的截屏类型（窗口、矩形、自由形状或全屏）。


    点击“新建”开始截图。根据你之前的选择，你现在将有5 秒时间。屏幕将冻结，你可以捕捉所需的图像。


    点击*保存*截图。


    ### 导入书签


    如果你之前使用的是其他浏览器并想重新访问在那里创建的书签，你可以将它们导入 Edge。方法如下：


    - 打开 Edge 并点击“...",进入设置。


    选择“从浏览器导入收藏”。


    选择你想从哪些浏览器导入书签，就搞定了！


    ### 侧载


    侧载很重要，因为它允许你安装 Windows 商店中未提供的应用程序。方法如下：


    - *打开设置 > 更新和安全。*


    前往“开发人员 > 侧载应用”。


    你现在将收到关于侧载具有危险性的警告。只需点击“是”表示你理解这些风险。


    ### 禁用 Wi-Fi 密码共享


    为了确保你的 Wi-Fi 连接仅属于你自己，并且拥有更多隐私，你可以禁用 Wi-Fi 共享！方法如下：


    - 前往“设置 > 网络和 Internet > Wi-Fi > 管理 Wi-Fi 设置”。你还可以关闭自动连接到 Skype、Quora、Outlook
    或其他网络。


