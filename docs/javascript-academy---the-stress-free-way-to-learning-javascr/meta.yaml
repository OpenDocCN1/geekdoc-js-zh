    # The Miscellaneous Operators


    This section of the book will discuss two useful operators that don’t belong to
    the categories discussed above. These operators are:


    +   - “?:?” – This is known as the “ Conditional Operator.” It checks whether
    the value of an expression is true or false. Then, it performs one of the assigned
    statements based on the evaluation ’ s result.


    For example, if the condition is true, the operator will assign 1 to the expression.
    If the condition is false, however, the operator will assign 2.


    +   - typeof – This is a unary operator, which means you can use it on a single
    operand. You can use it to determine an operand ’ s data type. This operator gives
    “ string,” “ boolean, ” or “ number ” if the operator is a string, Boolean, or
    number. Then, it gives true or false, depending on the result of the evaluation.


    The table below provides useful information regarding the typeof operator:


    | Data Type | The typeof Result |

    |---|---|

    | Object | “ object ” |

    | Number | “ number ” |

    | Boolean | “ boolean ” |

    | Undefined | “ undefined ” |

    | Null | “ object ” |'
