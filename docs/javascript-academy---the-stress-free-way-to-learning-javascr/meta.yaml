  md: '# The Assignment Operators


    These are the operators that you can use to assign values:


    +   - = = - This is the Simple Assignment operator. It assigns the value of the
    right-hand operand to the left-hand operand. For example: (z = x + y) assigns
    the value of x + y to z.


    +   - += - This operator is known as “ Addition and Assignment ” operator. It
    adds the values of both operands and gives the result to the left-hand operand.
    For example: (z += x) is equal to (z = z + x).


    +   - -= - Programmers call this “ Subtraction and Assignment ” operator. It subtracts
    the value of the right-hand operand from the left-hand operand. Then, it assigns
    the difference to the left-hand operand. For example: (z -= x) is equal to (z
    = z - x).


    +   - *= - This operator is called “ Multiplication and Assignment .” It multiplies
    the values of both operands and gives the product to the left-hand operand. For
    example: (z *= x) is equal to (z = z * x).


    +   - /= - This is known as the “ Division and Assignment ” operator. It divides
    the value of the left-hand operand by the value of the right-hand operand. Then,
    it assigns the quotient to the left-hand operand. For instance: (z /= x) is equal
    to (z = z / x).


    +   - %= - JavaScript users refer to it as the “ Modulus and Assignment ” operator.
    It takes the modulus of both operands. Then, it gives the result to the left-hand
    operand. For example: (z %= x) is equal to (z = z % x).'
