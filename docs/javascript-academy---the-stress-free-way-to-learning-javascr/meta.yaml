  md: '# Identifiers


    An identifier is basically used to determine functions, variables, modules, classes,
    and any other objects. It begins with an underscore ( _ ) or a letter. It is then
    followed by digits, underscores, zero or other letters. As a programmer, feel
    free to use any letter or digit. You can use uppercase and lowercase letters.


    However, you cannot use punctuations and special characters, such as @, $, and
    %, within the identifiers. In addition, Python is a case sensitive programming
    language. This means that you have to be careful when you use uppercase and lowercase
    letters in your codes. For instance, wendy, Wendy, and WENDY are all the same
    name and yet they are regarded as three different identifiers in Python.


    # Rules for Identifiers in Python


    There are several rules that you have to abide by when writing programs in Python:


    +   - The class name must always start with an uppercase character while the rest
    of the identifiers must start with a lowercase character.

    - The identifier is private if it starts with just one leading underscore.

    - The identifier is strongly private if it starts with two leading underscores.

    - The identifier is a language-defined special name if it ends with two trailing
    underscores.'
