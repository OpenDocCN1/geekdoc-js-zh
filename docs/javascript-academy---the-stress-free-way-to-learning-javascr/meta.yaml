    \ own webpages or programs using the JavaScript programming language.\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_60_0.png)\n\
    \nFinally, if you enjoyed this book, then I'd like to ask you for a favor, would\
    \ you be kind enough to leave a review for this book on Amazon? It'd be greatly\
    \ appreciated!\n\nClick here to leave a review for this book on Amazon!\n\nThank\
    \ you and good luck!\n"
  mdcn: "\n\"for\" 循环的语法如下：\n\n```javascript\nfor (initialization; test condition;\
    \ iteration statement){\n    Statement(s) to be executed if test condition is\
    \ true\n}\n```\n\n##\n\n# 如何控制你的循环\n\nJavaScript 语言允许你操作所有的循环和 switch。在某些情况下，你必须在到达循环的最后部分之前退出循环语句。在某些情况下，你必须忽略代码的某部分并初始化下一个。\n\
    \n为了帮助你处理这些情况，这种编程语言提供了两个强大的工具：`break` 语句和 `continue` 语句。让我们详细讨论一下这两个语句。\n\n##\
    \ break 语句\n\n该语句在上一章中介绍，允许你提前退出任何循环。下面的图片将向你展示基本 `break` 语句的流程图。\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_51_0.png)\n\
    \n注意：在我们讨论 switch 语句时，你已经看到过 break 语句的工作原理。\n\n## continue 语句\n\n`continue` 语句指示\
    \ JavaScript 解释器开始循环的下一次迭代，并忽略剩余的代码块。一旦系统遇到 `continue` 语句，程序的流将跳转到表达式评估。如果条件仍然为真，`continue`\
    \ 语句将开始下一次迭代。另一方面，如果条件变为假，程序控制将跳出循环。\n\n##\n\n# 第 7 章：JavaScript 语言中的函数\n\n基本上，函数是可用代码的集合，可以在程序的任何部分调用。这意味着你不需要多次编写相同的代码。函数帮助程序员创建模块化代码。它们还允许程序员将一个大型程序拆分成较小的函数。\n\
    \n与任何其他编程语言一样，JavaScript 提供了通过函数帮助编写模块化代码的功能。你可能在本书提供的代码中见过如 **write()** 和 **alert()**\
    \ 等函数。你可以反复使用这些函数，但它们在 JavaScript 中只写过一次。\n\n这种语言还允许你编写自己的函数。本章将教你 JavaScript\
    \ 函数的基础知识。\n\n##\n\n# 如何定义函数\n\n在使用函数之前，你必须定义它们。定义函数最流行的方法是使用 `function`（即 JavaScript\
    \ 关键字）。在输入 `function` 后，指定你想使用的名称和参数。然后，添加一个用大括号括起的 JavaScript 语句块。\n\n注意：你可以创建一个不定义任何参数的函数。因此，参数列表可以是空的。\n\
    \n以下是你定义函数时必须使用的语法：\n\n```html\n<script type=\"text/javascript\">\n<!--\nfunction\
    \ functionname(parameter-list)\n{\n  statements\n}\n-->\n</script>\n```\n\n##\n\
    \n# 如何调用函数\n\n要在你的脚本中调用函数，你只需要指定函数的名称。你可以使用下面的代码作为示例：\n\n```html\n<html>\n<head>\n\
    <script type=\"text/javascript\">\nfunction sayHello()\n{\n  document.write(\"\
    Hello there!\");\n}\n</script>\n</head>\n<body>\n<p>点击下面的按钮调用函数</p>\n<form>\n\
    <input type=\"button\" onclick=\"sayHello()\" value=\"Say Hello\">\n</form>\n\
    <p>在 write 方法中使用不同的文本，然后尝试...</p>\n</body>\n</html>\n```\n\n该代码将给你带来如下结果：\n\n\
    > 点击下面的按钮调用函数\n\nSay Hello\n\n##\n\n# 函数的参数\n\n你目前为止看到的函数没有任何任何参数。然而，你可以在用用/调用函数时轻松地分配各种参数。你可以在函数内部捕获这些参数。一旦捕获，你就可以根据需要修改这些参数。\n\
    \n## return 语句\n\nJavaScript 允许你在函数中添加 `return` 语句。这个 `return` 语句是完全可选的，尽管如果你想从函数中获取值，就必须使用它。通常，你应该将\
    \ `return` 语句放在函数的最后部分。\n\n例如，你可以向函数传递两个值。然后，你可以期望该函数将这些值相并在调用的程序中显示结果。\n\n##\n\
    \n# 嵌套函数\n\nJavaScript 允许将一个函数放在另一个函数内部。这个过程被称为“嵌套函数”。作为一个规则，你不能在循环或条件语句内部包含函数定义。\n\
    \n下面的代码将教你如何嵌套自己的函数：\n\n```html\n<head>\n<script type=\"text/javascript\">\n<!--\n\
    function hypotenuse(a, b) {\n  function square(x) { return x*x; }\n\n  return\
    \ Math.sqrt(square(a) + square(b));\n}\nfunction secondFunction(){\n  var result;\n\
    \  result = hypotenuse(1,2);\n  document.write ( result );\n}\n-->\n</script>\n\
    </head>\n\n<body>\n<p>点击下面的按钮调用函数</p>\n\n<form>\n<input type=\"button\" onclick=\"\
    secondFunction()\" value=\"Call Function\">\n</form>\n\n<p>在函数内部使用不同的参数，然后尝试...</p>\n\
    </body>\n</html>\n```\n\n上面的代码给出结果：\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_58_0.png)\n\
    \n##\n\n# 如何使用 “Function() 创建函数\n\n除了上面讨论的函数语句，你还可以通过 `Function()`（即 JavaScript\
    \ 构造函数）和 `new`（即 JavaScript 运算符）来创建函数。\n\n使用此构造函数，你必须使用以下语法：\n\n```html\n<script\
    \ type=\"text/javascript\">\n<!--\n var variabelname = new Function(Arg1, Arg2...,\
    \ \"Function Body\");\n-->\n</script>\n```\n\n该语法可以包含任意字符串参数。最后一个参数作为函数体——它可以包含由分号分隔的任意语句。\n\
    \n重要注意：`Function()` 不为其生成的函数指定名称。程序员将这些无名函数称为“匿名”函数。\n\n##\n\n# 结\n\n再次感谢下载这本书！\n\
    \n我希望这本书能够帮助你学习 JavaScript 的基础知识。\n\n下一步是使用 JavaScript 编程语言编写你自己的网页或程序。\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_60_0.png)\n\
