  md: '# Chapter 3: Data Types


    In Python, input data are sorted according to different categories. The primary
    purpose of sorting is to help programmers like you in processing information more
    efficiently. Such categories function as data storage locations that you can access
    whenever you run the Python platform.


    # Variables


    Variables contain values that have been specifically allocated to them. If you
    are working on complex codes for applications, you may want to store your information
    in these variables. Do not worry because you can access them anytime you need
    them. You can even use them to ensure that the information you gather from your
    end users stay safe and secured.


    # Numeric Types


    Numbers in the Python programming language are different from the numbers you
    use to solve problems in Algebra. In Mathematics, adding .0 at the end of a number
    practically means nothing. It does not make any difference to its value. For instance,
    3 and 3.0 are the same.


    In Python, however, 3 and 3.0 are different numbers. Before the program processes
    it, it has to undergo certain data processing methods. As a programmer, you have
    to learn about the different numeric types.'
