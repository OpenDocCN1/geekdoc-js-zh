    # Chapter 1: Introduction to Python


    If you are looking for a general purpose, high level programming language with
    code readability as its main focal point, you should consider Python. It has a
    syntax that allows you to express concepts using fewer lines of code than other
    programming languages, such as C, C++, and Java. It supports a wide range of programming
    paradigms, thereby encompassing imperative, functional and object-oriented programming.
    Also, it features a comprehensive standard library, a dynamic tape system and
    an automatic memory management.


    There are plenty of interpreters you can use for installation on different operating
    systems; hence, it is possible for you to execute Python on various systems. You
    can even make use of third-party applications. If you do not want to install an
    interpreter, you can package the code into standalone executable programs so that
    you can effectively distribute Python-based software to different environments.


    # A Brief History of the Python Programming Language


    Python was developed by Guido van Rossum in the late 1980s. It was initially just
    a Christmas project. Van Rossum wanted an interpreter for a scripting language
    that C and UNIX hackers will use. His little project eventually upgraded to Python
    2.0, which was released in October 2000. This new version had a complete garbage
    collector and Unicode support. Python 3.0, also called Python 3000 and py3k, was
    released in December 2008 and had features that were backported to versions 2.6
    and 2.7.


    # Why should you Use Python?


    Programming languages exist for a reason. Python, for instance, was developed
    to allow programmers to create efficient and productive codes. Its main objective
    is to help beginners learn a programming language easily and quickly. Due to this
    less learning time, you can create more useful applications that will be difficult
    to do with more obscure and complicated programming languages.


    With Python, you can also benefit from less development time when coding applications.
    As mentioned earlier, Python has fewer lines of code than C, C++, and Java. Its
    codes are actually five to ten times shorter; thus, making it more efficient and
    less complicated. You get to spend less time in developing applications and more
    time tweaking and improving them.


    When it comes to checking for bugs and errors, it is crucial for the programming
    language that you use to be easy to read and comprehend. If the programming language
    is too complicated, you may have a hard time coding and checking your program.
    With Python, codes are much easier to read and write; hence, you can easily interpret
    the codes and make the necessary changes.


    Furthermore, Python has many other uses. It is ideal for scripting applications
    that are browser-based, creating great user interfaces and rough application examples,
    interacting with databases, working with XML and designing mathematic, engineering
    and scientific applications.


    # Python vs. C#, Java, and Perl


    You may find comparing programming languages with one another to be a subjective
    task. Usually, their differences are a matter of personal preference. Nonetheless,
    there are times when such comparisons are backed up by scientific data. Anyway,
    you have to keep in mind that an all-encompassing programming language does not
    exist. As a programmer, you just have to find one that works best for your goals
    or needs.


    # C#


    If you have a background in Java, you may notice that C# and Java are highly similar.
    Then again, C# still has its own advantages and disadvantages compared to Java.
    Microsoft claims that their primary objective in developing C# is to produce a
    better version of C and C++. Compared to C#, however, Python has better scientific
    and engineering applications and better multiplatform support. It is more extendable
    when it comes to using C, C++ and Java. It is easier to learn and comprehend,
    and it allows the use of various computer environments. It also has more concise
    codes.


    # Java


    Programmers consider Java as a one-stop shop programming language. For many years,
    they have searched for something that can be run and written anywhere and they
    found Java, which can perform well in different platforms and computer environments.
    With this being said, Python is also a one-stop shop programming language. It
    is very similar to Java, except that it has more concise codes and is easier to
    learn and comprehend. It is much faster to develop and it has improved data boxes
    or variables that can store different data types that are useful when running
    applications.


    # PERL


    PERL stands for Practical Extraction and Report Language. It is a programming
    language that is suitable for acquiring and processing data from another database.
    In comparison, Python is better than PERL because it is easier to read, implement,
    learn and understand. It has better Java integration and data protection. It also
    has less platform-specific biases.


