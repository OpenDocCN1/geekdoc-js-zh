    ```\n\nAs you can see, makeNoise doesn’t have any parameter. Meanwhile, “power”\
    \ has two (i.e. base and exponent).\n\n# The Parameters and Scopes in JavaScript\n\
    \nA function’s parameters behave like ordinary variables, although they get their\
