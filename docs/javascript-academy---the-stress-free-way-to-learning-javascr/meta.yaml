- md: "\n## Chapter 2: The Syntax of JavaScript\n\nYou may implement this language\
    \ by placing JavaScript statements inside your webpage's <script> tags. In general,\
    \ you can put these <script> tags anywhere in the webpage. Professional website\
    \ developers, however, usually keep these tags inside the page's <script>\n\n\
    Basically, a <script> tag instructs browsers to interpret the text it contains\
    \ as a script. Here is the basic syntax of JavaScript:\n\n```html\n<script ...>\n\
    JavaScript code\n</script>\n```\n\nScript tags accept the following attributes:\n\
    \n- Language – This attribute indicates the language being used. Recent versions\
    \ of HTML and XHTML, however, no longer support this attribute.\n- Type – This\
    \ is the attribute being used in modern sites and webpages. You must use it to\
    \ indicate the computer language you are using. Make sure that its value is \"\
    text/javascript\".\n\nTaking those attributes into account, the syntax of JavaScript\
    \ is:\n\n```html\n<script language=\"javascript\" type=\"text/javascript\">\n\
    JavaScript code\n</script>\n```\n\n## Using JavaScript for the First Time\n\n\
    In this section, you'll be using this scripting language for the first time. The\
    \ code that you will use is designed to display Hello World! on the screen of\
    \ your computer. As you can see, the JavaScript code (see the screenshot below)\
    \ involves an optional HTML element. That HTML comment allows you to save the\
    \ code from browsers that don't support the JavaScript language.\n\nThe symbol\
    \ \"//\" terminates the HTML comment. In JavaScript, \"//\" represents comments.\
    \ That means you have to use a pair of slashes to prevent browsers from interpreting\
    \ HTML comments as part of your JavaScript statements. Then, you must invoke the\
    \ document.write() function to write a string into your HTML file.\n\nImportant\
    \ Note: You can use the document.write() function to write HTML statements, text-based\
    \ content, or both.\n\nHere's the code that you must type into your JavaScript\
    \ editor:\n\n```html\n<html>\n<body>\n<script language=\"javascript\" type=\"\
    text/javascript\">\n<!--\ndocument.write(\"Hello World!\")\n//-->\n</script>\n\
    </body>\n</html>\n```\n\nIf written and executed properly, the code given above\
    \ will show you: Hello World!\n\n## Whitespaces and Line Breaks\n\nThis scripting\
    \ language ignores tabs, spaces, and newlines inside your programs. That means\
    \ you may use these elements to make your JavaScript codes readable and understandable.\n\
    \n## Semicolons\n\nSimilar to other computer languages (e.g. C++), JavaScript\
    \ requires you to terminate simple statements using a semicolon. However, you\
    \ won't have to add a semicolon if your statements are entered on separate lines.\
    \ For instance, the code below works fine if it doesn't have any semicolon:\n\n\
    ```html\n<script language=\"javascript\" type=\"text/javascript\">\n<!--\nvar1\
    \ = 10\nvar2 = 20\n//-->\n</script>\n```\n\n## The Case-Sensitivity of JavaScript\
    \ Statements\n\nThis programming language is case-sensitive. For example, \"WORD,\"\
    \ \"Word,\" and \"word\" are treated as three different entities in JavaScript.\
    \ That means you must be consistent with letter capitalization when working on\
    \ functions, keywords, variables, and other identifiers.\n\n## JavaScript Comments\n\
    \nYou must remember the following rules when creating a comment in JavaScript:\n\
    \n- This language ignores all of the text placed between the \"//\" symbol and\
    \ the end of a line.\n- You may use /** and */ to create comments. In general,\
    \ programmers employ these symbols when creating multi-line comments.\n- JavaScript\
    \ also allows you to use <!-- (i.e. the symbol used in HTML to start comments)\
    \ when writing single-line comments.\n- JavaScript doesn't recognize -->> (i.e.\
    \ the symbol used in HTML to end comments). You must use //-- > instead.\n\n##\
    \ Chapter 3: The Placement of JavaScript Codes\n\nYou can place JavaScript codes\
    \ in any part of an HTML file. However, the recommended areas for keeping JavaScript\
    \ codes inside an HTML document are:\n\n- In the <head> </head> area\n- In the\
    \ <body> </body> area\n- In the <head> </head> and <body> </body> areas of the\
    \ document\n- Inside an external document\n\nThis chapter will discuss each of\
    \ these areas.\n\n### Placing Your Code in the <head> </head> Area\n\nThis is\
    \ the ideal area if you want your scripts to run during specific events (e.g.\
    \ when the user clicks on a button). The sample code below will show you how to\
    \ save codes in this area.\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\n<!--\nfunction sayHello() {\n  alert(\"Hello World\")\n}\n-->\n</script>\n\
    </head>\n<body>\nClick here for the result\n\n<input type=\"button\" onclick=\"\
