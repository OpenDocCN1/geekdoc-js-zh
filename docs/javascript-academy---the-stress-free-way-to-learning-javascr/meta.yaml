  - '[PAGE 115]


    It is possible to skip the indentation and use a keyword instead.


    Yes, you can skip using an indentation and just use a keyword. There are actually
    a few programmers who prefer to use *endif* instead of an indentation to indicate
    the end of a block of code.


    Well, it is not exactly a recognized keyword in Python. The earlier versions of
    the programming language come with a tool that converts code using the keyword
    *end* to correct the indentation and remove such keyword.


    This may be used as a pre-processor to the compiler. In the recent versions of
    the programming language, however, the tool has been removed, most probably because
    it is not often used.


    How is the indentation parsed by the compiler?


    The parsing is actually simple and well defined. In general, the changes to the
    level of indentation are inserted as tokens into the stream. The indentation levels
    are stored using a stack from the lexical analyzer or tokenizer. At first, the
    stack only has a value of 0, which is found at the leftmost part.


    Each time a nested block starts, a new level of indentation gets pushed on the
    stack. The *indent* token is then inserted into the stream, which is eventually
    passed on to'
  - '[PAGE 116]


    the parser. It is not possible to have more than a single indent token in succession.


    In the event that a line is seen with a smaller level of indentation, the values
    start popping from the stack until one of them gets on top. This is equivalent
    to the new level of indentation. In case there is nothing found, a syntax error
    is generated. For ever value popped, there is a dedent token. It is possible to
    have multiple dedent tokens in succession. At the end of every source code, there
    are dedent tokens generated for the level of indentation that is left at the stack.
    This continues to occur until there is 0 left.


