    \n请注意，整数有容量限制。如果你尝试处理超出允许限制的值，将产生错误。整数通常处理 -9,223,372,036,854 到 9,223,372,036,854\
    \ 之间的数字。\n\n`int` 变量还带有一些有趣的特性。例如，二进制只使用 0 和 1，八进制使用 0 到 7 的数字，十进制具有与十进制系统相似的属性，而十六进制则使用字母\
    \ A 到 F 和数字 0 到 9 位。\n\n## 浮点数\n\n任何包含小数点的数字在 Python 中都被视为浮点数。小数点后的数字是否为 0 并不重要。例如，3.0、1.5\
    \ 和 11.4 都是浮点数。它们存储在 `float` 数据类型中。浮点数优于整数的一个巨大优势是它们具有更大的存储空间；因此，它们能够存储非常小或大的值。\n\
    \n尽管如此，你不应该认为它们具有无限的存储空间。仍然存在限制。尽管如此，它们可以包含低至 ± 2.225073858502014 × 10⁻³⁰⁸ 和高达\
    \ 1.7976931348623157 × 10³⁰⁸。使用浮点数分配值的方法。首先你可以你可以直接赋值。其次，你可以使用科学计数法。记住，负指数产生等分数。\n\
    \n## 复数\n\n这些数字由实数和虚数组成。通常用于动态系统、量子力学、计算机图形、电气工程和流体力学。复数可以在 Python 和其他少数编程语言中处理。\n\
    \n## 布尔值\n\n这是两个常量对象 `True` 和 `False`。它们代表真值。当用于数值上下文时，它们充当 0 和 1。如果一个值可以被解释为真值，你可以使用函数\
    \ `bool` 为布尔值赋值。\n\n## 字符串\n\n它们是用双引号连接的字符组。考虑以下示例：\n\nTheString = \"Python got\
    \ its name from a popular comedy show.\"\n\n如你在上面的示例代码所示，短语 `Python got its name\
    \ from a popular comedy show.` 被赋值给变量 `TheString`。\n\n计算机无法理解字母，只能理解数字。所以当你编写程序时，Python\
    \ 根据代表字母的数字来读取和解释它。例如，在美国信息交换标准代码 (ASCII) 中，数字 65 代表字母 A。所以如果你输入\n\n`ord ( \"\
    \ A \")`\n\n你将得到输出\n\n65\n\n因为计算机无法理解字母，你必须将字符串转换为数字。你可以使用 `int` 或 `float` 来这样做。在需要将数字转换为字符串的情况下，你可以使用\
    \ `str`。\n\n## 第 4 章：运算符\n\n你的操作数的值由运算符操纵。Python 编程语言中使用了七种运算符。下表显示了这些运算符，并对其功能进行了简要说明。\n\
    \n## 算术运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| 加法 (+) | 它相加值。 |\n| 减法 (-) | 它从上一个操作数减去第二个操作数。\
    \ |\n| 乘法 (*) | 它相乘值。 |\n| 除法 (/) | 它将第一个操作数除以第二个操作数。 |\n| 取模 (%) | 它将第一个操作数除以第二个操作数并返回余数。\
    \ |\n| 幂 (**) | 它对运算符执行指数计算。 |\n| 整除 (//) | 它除以操作数，但消结果结果后的小数点。 |\n\n## 比较运算符或关系运算符\n\
    \n| 运算符 | 描述 | \n| :--- | :--- |\n| == | 如果两个操作数的值相等，则条件为真。 |\n| != | 如果两个操作数的值不等，则条件为真。\
    \ |\n| <> | 如果两个操作数的值不等，则条件为真。 |\n| > | 如果左操作数大于右操作数，则条件为真。 |\n| < | 如果左操作数小于右操作数，则条件为真。\
    \ |\n| >= | 如果左操作数大于或等于右操作数，则条件为真。 |\n| <= | 如果左操作数小于或等于右操作数，则条件为真。 |\n\n## 赋值运算符\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| = | 它将右操作数的值赋值给左操作数。 |\n| += | 它将右操作数加到左操作数，并将结果分配给左操作数。\
    \ |\n| -= | 它从左操作数减去右操作数，并将结果分配给左操作数。 |\n| *= | 它将左操作数与右操作数相乘，并将结果分配给左操作数。 |\n\
    | /= | 它将左操作数除以右操作数，并将结果分配给左操作数。 |\n| %= | 它使用两个操作数找到模，并将结果分配给左操作数。 |\n| ** |\
    \ 它对运算符执行指数运算并赋值。 |\n| // | 它对运算符执行整除并赋值。 |\n\n## 位运算符（位运算符）\n\n| 运算符 | 描述 |\n\
    | :--- | :--- |\n| & 二进制位与 | 如果位在两个操作数中都存在，则复制该位。 |\n| | 二进制位或 | 如果位在任何一个操作数中存在，则复制该位。\
    \ |\n| ^ 二进制位异或 | 如果位仅在一个操作数中存在，则复制该位。 |\n| ~ 二进制位取反 | 它翻转位。 |\n| << 二进制位左移 |\
