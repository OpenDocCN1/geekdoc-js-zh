    $）和下划线（即 _）。JavaScript 不允许在变量名中使用标点符号。


    你可以更改分配给变量的值。在 JavaScript 中，你可以简单地在任何变量上使用=”符号给它一个新值。


    ```

    var taste = "bitter";


    console.log(taste);


    // -> bitter


    taste = "sweet"


    console.log(taste);

    ```


    通常情况下，你应该将变量视为触角而不是容器。变量抓取值，而不是包含它们。这意味着多个变量可以指向同一个值。


    让我们分析一个简单的示例。你需要生成一个变量来记住 Johnny 欠你的金额。当他支付 50 美元时，你必须给现有变量分配一个新值。查看下方的代码：


    ```

    var JohnnysDebt = 200;


    JohnnysDebt = JohnnysDebt – 50;


    console.log(JohnnysDebt);


    // -> 150

    ```


    如果你创建一个不分配赋值的变量，它将被认为是空的。如果你询问它所包含的值，它将返回“undefined”。


    JavaScript 允许你在一个 var 语句中包含多个变量。在使用此功能时，你应该用逗号分隔变量。这里有一个示例：


    ```

    var three = 3, four = 4;

    ```


    ```

    console.log(three + four);

    ```


    ```

    // -> 7

    ```


    ## JavaScript 中的保留字


    如之前讨论的，在命名变量时不能使用关键字。然而，还有其他单词是你不能作为变量名的，因为 JavaScript 已为未来的开发预留了它们。以下是该脚本语言中的一些保留字：


    in, do, let, if, new, try, with, case, void, with, while, false, yield, extends,
    delete, default, const, debugger, class, break, finally, null, private, return,
    import, protected, switch, super, instanceof, throw, implements


    记住在定义变量时不能使用上述词汇。如果你忘记了这个简单的规则，在处理 JavaScript 程序时可能会遇到问题。


    ## JavaScript 环境


    “环境”一词指的是活动值和变量的集合。基本上，环境在启动 JavaScript 程序时不是空的。环境与语言本身有关，通常它们存在允许与系统交互的变量。例如，在浏览器环境中，存在各种函数和变量来检查并影响鼠标和键盘输入。


    ## 函数


    默认的 JavaScript 环境涉及函数。函数是链接到值的程序段。你可以应用这些值来激活程序。例如，在浏览器环境中，alert（即一个变量）包含一个显示对话框的函数。这是一个示例：


    ```

    alert("You are not authorized to access this page!");

    ```


    你可以通过在生成函数表达式后放置括号来执行函数。通常，你会指定包含函数的变量名称。通过在括号内包含值，你是将这些值赋值给函数。对于上一个示例，“alert”使用分配的字符串在对话框中显示消息。


    ## “console.log”


    你可以使用“alert”来测试新的字符串或语句。然而，它需要你关闭生成的窗口，你可能会觉得这样做这样做且耗时。因此，你可能想使用你在书中前面章节过的函数：console.log。几乎所有的
    JavaScript 系统（例如 Node.js、浏览器等）都提供此函数来将参数传输到兼容文本的输出设备。


    对于浏览器来说，代码的输出到 JavaScript 的控制台。虽然浏览器的这部分通常是隐藏的，但你可以通过按下某些键来访问它（例如对于 Windows 电脑，按
