    # The Optional Arguments


    The JavaScript language accepts the code given below. You won’t encounter any
    problem

    while invoking it.


    ```

    alert(“Hi", “Good Morning", “How are you?”);

    ```


    Officially, the “alert” function accepts a single argument only. However, it won’t
    complain

    if you’ll invoke it using the sample code above. It will just accept the first
    argument (i.e.

    “Hi”) and ignore the rest.


    This programming language is “open-minded” when it comes to the quantity of arguments

    you can assign to your functions. If you’ll assign too many arguments, it will
    accept the

    valid ones and ignore the others. If your arguments are not enough, however, JavaScript

    will complete your statement by assigning “undefined” to the appropriate parameters.'
