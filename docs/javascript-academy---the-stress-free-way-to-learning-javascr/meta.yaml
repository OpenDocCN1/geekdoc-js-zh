    +   - You can reduce server interactions – JavaScript can validate the information
    entered by the users before sending it to the web server. That means you can filter
    out the useless traffic from your server.


    +   - Instant feedback – Your website visitors will immediately see if they have
    missed a field or entered the wrong data. They will see the error message without
    any page reload.


    +   - Improved webpage interactivity – With JavaScript, you can generate user
    interfaces that respond to mouse and keyboard inputs.


    +   - Enhanced Interfaces – In this language, you can easily add cool interface
    items (e.g. sliders, drag-and-drop components, etc.) to provide your website visitors
    with an enhanced interface.


    # The Disadvantages of JavaScript


    Just like other things in life, JavaScript has its own drawbacks. The main ones
    are:


    +   - This language doesn’t have multiprocessing or multithreading capabilities.


    +   - You can’t use JavaScript for networking programs. This language doesn’t
    support programs/applications that focus on networking.


    +   - You can’t read or edit files written using Client-Side JavaScript. These
    features are disabled for security reasons.'
