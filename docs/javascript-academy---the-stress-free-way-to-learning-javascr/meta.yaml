    while loops execute a statement or block of code when an expression is true. The
    loops will end as soon as the expression becomes false.


    Here is the flowchart of a while loop:


    ![](img/3e5423b5395581eac3ca44c78bc4be92_46_0.png)


    # The Syntax


    Here is the syntax of a while loop:


    ```

    ```javascript

    while (expression){

    Statement(s) to be executed if expression is true

    }

    ```

