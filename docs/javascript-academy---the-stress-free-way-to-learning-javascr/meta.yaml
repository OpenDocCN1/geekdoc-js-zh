    # The Switch-Case Statements


    You may use a series "if ... else if " statements to execute a multi-path branch
    system.

    You’ ve learned about this in the previous section of the book. However, this
    method isnn’ t always the ideal answer, particularly if all of the branches rely
    on the value of one variable.


    Fortunately, JavaScript offers switch statements. A single switch statement is
    more effective than a group of "if ... else if " statements when used in the situation
    described above.


    Here is the flowchart of a basic switch-case statement:


    ![](img/3e5423b5395581eac3ca44c78bc4be92_44_0.png)


    # The Syntax


    Switch statements are designed to do two things:


    +   - Provide an expression that the program can evaluate


    +   - Provide various statements that will run depending on the result of the
    evaluation.'
  - "[PAGE 45]\n\nJavaScript's built-in interpreter compares each case with the expression\
    \ 's value. This process will continue until the interpreter finds a match. If\
    \ no match is found, the interpreter will run the default condition. The syntax\
    \ of a switch statement is:\n\n```\nswitch (expression)\n{\n  case condition 1:\
    \ statement(s)\n    break;\n  case condition 2: statement(s)\n    break;\n  ...\n\
    \  case condition n: statement(s)\n    break;\n  default: statement(s)\n}\n```\n\
    \nThis syntax uses break statements to terminate each case. If you 'll remove\
    \ these break statements, the JavaScript interpreter will execute all of the statements\
    \ inside each case. You 'll learn about break statements in the next chapter."
