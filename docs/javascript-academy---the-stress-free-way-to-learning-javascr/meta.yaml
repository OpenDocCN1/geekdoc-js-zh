    \n## The Syntax\n\nHere is the syntax of a while loop:\n\n```\nwhile (expression){\n\
    \  Statement(s) to be executed if expression is true\n}\n```\n\nBefore executing\
    \ any statement, a while loop evaluates the condition. That means if the expression\
    \ is false, none of the statements will be performed.\n\n## Do ... while Loops\n\
    \nA “do ... while ” loop is similar to a while loop. The only difference is that\
    \ it evaluates the expression after executing the statement/s. If the result of\
    \ the evaluation is true, the loop will execute the statement/s again. The process\
    \ will only stop once the result becomes false. Because of this, a “do ... while\
    \ ” loop will run at least once even if the result of the evaluation is false.\n\
    \nThe flowchart of a typical “do ... while ” loop is:\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_48_0.png)\n\
    \n## The Syntax\n\nHere is the syntax of a “do ... while ” loop:\n\n```\ndo{\n\
