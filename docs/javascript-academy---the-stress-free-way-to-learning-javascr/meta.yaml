    \n## Chapter 6: The Conditional Statements\n\nWhile using JavaScript, there will\
    \ be situations that require you to choose one out of a predetermined set of choices.\
    \ In these cases, you must use conditional statements. A conditional statement\
    \ allows your program to make proper judgments and execute correct processes.\n\
    \nThis programming language offers conditional statements that you can use on\
    \ your codes. This chapter will discuss three of the most important conditional\
    \ statements: (1) the “if ” statement, (2) the “if ... else ” statement, and (3)\
    \ the “if ... else if ... ” statement.\n\nLet’s discuss these statements in detail:\n\
    \n## The Flow Chart of a Conditional Statement\n\nThe image below shows the basic\
    \ flow chart of a conditional statement.\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_41_0.png)\n\
    \n## The if Statement\n\nThis statement serves as the basic conditional statement\
    \ in JavaScript. It helps programs in making decisions and executing other statements.\n\
    \nThe syntax of the \" if \" statement is:\n\n```\nif (expression){\n  Statement(s)\
    \ to be executed if expression is true\n}\n```\n\nThe code given above evaluates\
    \ JavaScript expressions. If the result of the evaluation is true, the assigned\
    \ statement/s will be performed. If the result is false, however, none of the\
    \ assigned statements will be performed. In most cases, you'll be using comparison\
    \ operators with this statement.\n\n## The if ... else Statement\n\nThis statement\
    \ is more complex than the previous one. That’s is because the “ if ... else ”\
    \ statement offers better control in executing statements conditionally.\n\nHere\
    \ is the syntax of the “ if ... else ” statement:\n\n```\nif (expression){\n \
    \ Statement(s) to be executed if expression is true\n}else{\n  Statement(s) to\
    \ be executed if expression is false\n}\n```\n\nYou can use the syntax given above\
    \ to evaluate JavaScript expressions. If the result is true, the statement placed\
    \ in the “ if ” section will be performed. If the result is false, on the other\
    \ hand, the statement within the “ else ” section will be performed.\n\n## The\
    \ “ if ... else if ... Statement\n\nBasically, this is an enhanced form of the\
    \ “ if ... else ” statement. By providing multiple conditions, it helps your programs\
    \ in making the right decisions and performing the correct actions.\n\nHere is\
    \ the syntax that you must use when creating an “ if ... else if ... ” statement:\n\
    \n```\nif (expression 1){\n  Statement(s) to be executed if expression 1 is true\n\
    }else if (expression 2){\n  Statement(s) to be executed if expression 2 is true\n\
    }else if (expression 3){\n  Statement(s) to be executed if expression 3 is true\n\
    }else\n  Statement(s) to be executed if no expression is true\n}\n```\n\nIf you'll\
    \ think about it, the syntax given above is a basic one. It’s a simple collection\
    \ of “ if ” statements where every “ if ” serves as a part of the preceding else\
    \ statement’s else clause. This syntax executes statement/s depending on the result\
    \ of the evaluation. If all of the given conditions are false, the system will\
    \ run the “ else ” section of the code.\n\n## The Switch-Case Statements\n\nYou\
    \ may use a series \"if ... else if \" statements to execute a multi-path branch\
    \ system. You’ve learned about this in the previous section of the book. However,\
