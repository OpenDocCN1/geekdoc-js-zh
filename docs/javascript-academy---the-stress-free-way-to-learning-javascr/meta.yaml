    Java 编程语言非常流行，JavaScript 的所有者决定采用它的名称。这是一种利用 Java 流行度的营销手段。


    # 代码 – 通信息


    代码是构成计算机程序和 Web 应用程序的文本。本电子书包含大量代码，因此你应该熟悉它们。计算机专家认为，编写代码和阅读代码是成为程序员的重要方面。因此，你应该阅读并理解书中包含的代码。如果你只是简单扫一眼代码示例，将会剥夺自己良好的学习机会。


    初学者在分析代码时可能会遇到困难。然而，如果他们仔细阅读说明，一定能理解 JavaScript 是如何工作的。最好的办法是用 JavaScript 解释器尝试代码示例。这样，你就可以立即获得代码在编译为程序后样子的信息。


    # 第二章：JavaScript 的不同方面


    # 数据与位


    数据构成了数字世界。如果你“访问”计算机内部的世界，你将看到一件事：数据。你可以读取、编辑和生成数据。每当你保存新数据时，它都将以位（bits）序列的形式存储。这就是为什么存储的数据片段具有相似的外观和特征的原因。


    在编程中，位（bit）是指任何具有两个值的单位（通常用 1 和 0 表示）。你可以将任何数据片段还原为一系列的 1 和 0。这个过程被称为数据到位的转换。


    # 值


    典型的计算机系统涉及数十亿个位。这意味着处理数据可能会极其混乱。如果你想处理如此惊人的信息，就必须将其分成更小的块。在 JavaScript 中，这些信息块被称为“值”（values）。尽管所有值都由位组成，但它们有不同的类型和功能。JavaScript
    支持六种值，即：字符串、数字、函数、对象、undefined 值和布尔值。


    要生成一个值，你只需指定它的名称。这个过程简单易行。你不需要收集材料或支付任何费用。只需指定一个值的名称，砰！你就拥有它了。


    本章将介绍 JavaScript 语言的基本元素（即运算符和值类型）。这些元素可以与 JavaScript 中的值进行交互。


    现在，让我们谈谈不同的值类型。


    # 数字


    属于这种类型的值……你猜得对：数值。在编写 JavaScript 应用时，你必须使用以下格式：


    ```

    <number>

    ```


    例如，假设你在 JavaScript 程序中输入了此值：99。这将在你的机器内存中为数字 99 创建一个位序列。


    JavaScript 语言使用 64 位来存储每个数值。用 64 位可以创建的模式是有限的，因此用它们表示的数字也是有限的。对于 x 个十进制数字，你可以表示的数字等于
    10⁰。同样地，由于你有 64 位数字，你最多可以表示 2⁶⁴ 个值。


    以前，计算机内存非常小，人们必须使用一组8位或16位来表示数值。由于内存不足，用户在使用 JavaScript 时经常会遇到“数据溢出”。然而，现在即使是基础级桌面电脑也拥有大量内存。这意味着你可以轻松使用
    64 位序列——你不再需要担心数据溢出了。


    数值还可以存储负整数。在这里，其中一个位表示值的符号（可以是“+”或“−”）。此外，JavaScript 还支持非整数（即小数）。为了实现这一点，某些位存储了小数点的位置。


    你可以使用句号编写小数和小数。这里有一个例子：


    99.99


    另一方面，对于极大或极小的数字，你可以添加“e”来使用科学计数法。只需在其后加上指数即可。例如：


    9.999e9 = 9.999 x10


    整数（也称为全数）的计算是 100% 准确的。然而，小数的计算并不是。例如，“π”的值无法通过有限的十进制数字精确表示。许多数值会因为位的限制而丢失精度。如果你想避免与小数的问题，必须记住这些数字只是估算值。不要将它们视为精确的值。


    # 算术运算


    这是你对数值的操作。通常，算术运算（如加法、除法、减法等）使用两个数值生成一个新值。这是一个用 JavaScript 语言编写的算术运算示例：


    ```

    10 + 4 * 5

    ```


    “*”和“+”符号被称为“运算符”。“+”表示加法，“*”表示乘法。你通过在两个数值之间放置运算符来生成数值。注意的是，JavaScript 中的算术运算遵循运算符优先级（也称为运算顺序）。在这里，你应该按照以下顺序执行操作：括号、指数、乘法/除法、加法/减法。如果你在上面的示例中使用运算符优先级，10
    将加到 4 * 5 的积上。


    你可以使用括号来修改运算顺序。例如：


    ```

    (10 + 4) * 5

    ```


    在 JavaScript 语言中，“–”符号表示减法，“/”表示除法。你不担心运算符优先级。如果你不确定，可以简单地在代码中添加括号。


