    # Chapter 4: Understanding Interface


    In this chapter, you''ll learn more ways to enjoy Windows 10—and it''s mostly
    about knowing how to work with its interface!


    Using Quick Access


    A lot of people say that Quick Access makes Windows 10 a whole lot more manageable—and
    there is a lot of truth to that. You can learn more about it below:


    To add a file to Quick Access, just navigate towards the file you want to add,
    and then simply click Add to Quick Access.


    To remove a file from Quick Access, go to the said file and click Unpin from Quick
    Access.


    To remove recently used files and frequently used folders from Quick Access, just
    go to View > Options > General > Privacy. Then, uncheck the boxes that say Show
    Recently Used Files. Click Clear > Clear File Explorer History. You can also choose
    Hide or Hide from Recent.


    To change the way File Explorer opens, just click View > Options > Open Explorer
    > This PC.


    Using Snap Assist


    This is a feature that is exclusive for Windows 10! This helps you snap a certain
    window to a certain side of the screen you won''t spend lots of time moving around.


    To snap a window with the mouse, click on its title and drag it to the side of
    the screen. You will then see an outline that will show you where the window would'
  - '[PAGE 155]


    appear once you have dragged it.


    To snap with the keyboard, just press Windows Key + Left Arrow (or Right Arrow).


    To snap to one of the quadrants, just press Windows Key + Up Arrow (or Down Arrow),
    and then move it around by pressing Windows Key and arrow keys together.


    # Using Multiple Desktops


    Yes, you can make use of multiple “desktops” while using Windows 10. To make this
    happen, just follow the instructions below:


    +   - Add a desktop by clicking Task View. Press Tab + Windows Key > New Desktop.


    Now, you have two virtual desktops. To switch between them, just press Windows
    Key + CTRL + Left Arrow + Windows Key + CTRL + Right Arrow.


    To move windows between desktops, just right click on the window you’d want to
    move, then choose where you’d want to move it to.


    To close the desktop, just click X or press Windows Key + CTRL + F4.


    # Hiding System Tray Icon


    To hide the System Tray Icon temporarily, all you have to do is drag and drop
    said icon to the hidden area under the arrow. However, if you can see all of the
    icons onscreen, just open Task Manager (press CTRL + ALT + DELETE) and then go
    ahead and terminate GWXUX or GWX.


    To hide the System Tray permanently, go to Control Panel > Windows Update.


    Choose Installed Updates—you’ll see this on the left side of the screen.


    Look for the label Update for Microsoft Windows KB3035583 and remove said update.'
