- md: "\nThe syntax of a \"for\" loop is:\n\n```javascript\nfor (initialization; test\
    \ condition; iteration statement){\n    Statement(s) to be executed if test condition\
    \ is true\n}\n```\n\n##\n\n# How to Control Your Loops\n\nThe JavaScript language\
    \ allows you to manipulate all of your loops and switches. In some cases, you\
    \ have to exit a loop statement before reaching its final section. There are also\
    \ some situations where you have to ignore a certain part of the code and initialize\
    \ the next one.\n\nTo help you with such situations, this programming language\
    \ offers two powerful tools: the break statement and the continue statement. Let's\
    \ discuss each statement in detail.\n\n## Break Statements\n\nThis statement,\
    \ which was introduced in the previous chapter, allows you to exit any loop early.\
    \ The image below will show you the flowchart of a basic break statement.\n\n\
    ![](img/3e5423b5395581eac3ca44c78bc4be92_51_0.png)\n\nNote: You've seen how break\
    \ statements work during our discussion about switch statements.\n\n## Continue\
    \ Statements\n\nA continue statement instructs the JavaScript interpreter to begin\
    \ the next iteration of a loop and ignore the remaining blocks of code. Once the\
    \ system encounters a continue statement, the flow of the program goes to the\
    \ expression evaluation. If the condition is still true, the continue statement\
    \ will begin the next iteration. If the condition becomes false, on the other\
    \ hand, program control will go outside the loop.\n\n##\n\n# Chapter 7: The Functions\
    \ in the JavaScript Language\n\nBasically, functions are collections of reusable\
    \ codes that can be invoked at any part of your program. That means you won’t\
    \ have to write the same code multiple times. Functions help programmers in creating\
    \ modular codes. They also allow programmers to divide a large program into smaller\
    \ functions.\n\nJust like any other programming language, JavaScript offers features\
    \ that can help in writing modular codes through functions. You've probably seen\
    \ functions such as **write()** and **alert()** in the codes given in this book.\
    \ You can use these functions repeatedly, but they were written in JavaScript\
    \ once.\n\nThis language also allows you to write your own functions. This chapter\
    \ will teach you the basics of functions in JavaScript.\n\n##\n\n# How to Define\
    \ a Function\n\nYou have to define functions before you can use them. The most\
    \ popular method of defining a function involves the use of function (i.e. a JavaScript\
    \ keyword). After typing function, specify the name and parameters that you'd\
    \ like to use. Then, add a block of JavaScript statement enclosed by braces.\n\
    \nNote: You may create a function without defining any parameter. Thus, the list\
    \ of parameters may be empty.\n\nHere is the syntax that you must use when defining\
    \ a function:\n\n```html\n<script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list)\n\
    {\n  statements\n}\n-->\n</script>\n```\n\n##\n\n# How to Call a Function\n\n\
    To call a function in your scripts, you just have to specify the function's name.\
    \ You may use the code below as an example:\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\nfunction sayHello()\n{\n  document.write(\"Hello\
    \ there!\");\n}\n</script>\n</head>\n<body>\n<p>Click the following button to\
    \ call the function</p>\n<form>\n<input type=\"button\" onclick=\"sayHello()\"\
    \ value=\"Say Hello\">\n</form>\n<p>Use different text in write method and then\
    \ try...</p>\n</body>\n</html>\n```\n\nThat code will give you this result:\n\n\
    > Click the following button to call the function\n\nSay Hello\n\n##\n\n# The\
    \ Parameters of a Function\n\nThe functions you've seen so far don't have any\
    \ parameter. However, you can easily assign various parameters while invoking/calling\
    \ a function. You can capture these parameters within the function. Once captured,\
    \ you may modify those parameters according to your needs.\n\n## Return Statements\n\
    \nJavaScript allows you to add a return statement to your functions. This return\
    \ statement is completely optional, although you have to use it if you want to\
    \ acquire values from your function/s. In general, you should place the return\
    \ statement at the last section of your function.\n\nFor instance, you may pass\
    \ two values into your function. Then, you may expect that function to multiply\
    \ the values and show the result in the program you are calling.\n\n##\n\n# The\
    \ Nested Functions\n\nJavaScript allows you to place a function inside another\
    \ function. This process is called \"nesting a function.\" As a general rule,\
    \ you can’t include a function definition inside loops or conditional statements.\n\
    \nThe code below will teach you how to nest your own functions:\n\n```html\n<head>\n\
    <script type=\"text/javascript\">\n<!--\nfunction hypotenuse(a, b) {\n  function\
    \ square(x) { return x*x; }\n\n  return Math.sqrt(square(a) + square(b));\n}\n\
    function secondFunction(){\n  var result;\n  result = hypotenuse(1,2);\n  document.write\
    \ ( result );\n}\n-->\n</script>\n</head>\n\n<body>\n<p>Click the following button\
    \ to call the function</p>\n\n<form>\n<input type=\"button\" onclick=\"secondFunction()\"\
    \ value=\"Call Function\">\n</form>\n\n<p>Use different parameters inside the\
    \ function and then try...</p>\n</body>\n</html>\n```\n\nThe code above gives\
    \ the following result:\n\n![](img/3e5423b5395581eac3ca44c78bc4be92_58_0.png)\n\
    \n##\n\n# How to Create Functions using “Function()\"\n\nAside from the function\
    \ statement discussed above, you may also create functions by using Function()\
    \ (i.e. a JavaScript constructor) and new (i.e. a JavaScript operator).\n\nTo\
    \ use this constructor, you must use the following syntax:\n\n```html\n<script\
    \ type=\"text/javascript\">\n<!--\n var variabelname = new Function(Arg1, Arg2...,\
    \ \"Function Body\");\n-->\n</script>\n```\n\nThis syntax can contain any amount\
    \ of string arguments. The final argument serves as the function's body – it may\
    \ hold arbitrary statements that are separated by semicolons.\n\nImportant Note:\
    \ Function() doesn’t specify names for the functions it generates. Programmers\
    \ refer to these unnamed functions as “anonymous” functions.\n\n##\n\n# Conclusion\n\
    \nThank you again for downloading this book!\n\nI hope this book was able to help\
