    # For Loops


    This kind of loop is known for its compactness. In general, “ for loops ” have
    the following parts:


    +   - Loop Initialization – This is the part where you begin your counter at an
    initial value. The interpreter of JavaScript executes this part before running
    the loop itself.


    +   - Test Statement – This part of the loop evaluates the assigned condition.
    If the assigned condition is true, the interpreter will execute the code within
    the “ for ” loop. If the condition is false, however, the system control will
    be given to the statement after the “ for ” loop.


    +   - Iteration Statement – You can use this part to increase or decrease the
    loop ’s counter.


    JavaScript allows you to place all of these parts in a single line. You just have
    to separate each part using semicolons.


    The image below shows the flowchart of a “ for ” loop:


    ![](img/3e5423b5395581eac3ca44c78bc4be92_49_0.png)


