    # The Case-Sensitivity of JavaScript Statements


    This programming language is case-sensitive. For example, “WORD,” “ Word,” and
    “ word ” are treated as three different entities in JavaScript. That means you
    must be consistent with letter capitalization when working on functions, keywords,
    variables, and other identifiers.


    # JavaScript Comments


    You must remember the following rules when creating a comment in JavaScript:


    +   - This language ignores all of the text placed between the “ // ” symbol and
    the end of a line.

    - You may use /** and */ to create comments. In general, programmers employ these
    symbols when creating multi-line comments.

    - JavaScript also allows you to use <! — (i.e. the symbol used in HTML to start
    comments) when writing single-line comments.

    - JavaScript doesn’ t recognize → (i.e. the symbol used in HTML to end comments).
    You must use // → → instead.'
