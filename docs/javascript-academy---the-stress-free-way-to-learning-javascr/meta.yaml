    \ the JavaScript statements that you want to execute once the function is invoked\
    \ (or called). Additionally, you should always enclose the body using curly braces\
    \ (even if it contains a single statement).\n\nA parameter, on the other hand,\
    \ is a name listed in the function’s definition. Functions may have one or more\
