    ## Chapter 4: Understanding Interface


    In this chapter, you''ll learn more ways to enjoy Windows 10—and it''s mostly
    about knowing how to work with its interface!


    ### Using Quick Access


    A lot of people say that Quick Access makes Windows 10 a whole lot more manageable—and
    there is a lot of truth to that. You can learn more about it below:


    - To add a file to Quick Access, just navigate towards the file you want to add,
    and then simply click Add to Quick Access.


    - To remove a file from Quick Access, go to the said file and click Unpin from
    Quick Access.


    - To remove recently used files and frequently used folders from Quick Access,
    just go to View > Options > General > Privacy. Then, uncheck the boxes that say
    Show Recently Used Files. Click Clear > Clear File Explorer History. You can also
    choose Hide or Hide from Recent.


    - To change the way File Explorer opens, just click View > Options > Open Explorer
    > This PC.


    ### Using Snap Assist


    This is a feature that is exclusive for Windows 10! This helps you snap a certain
    window to a certain side of the screen you won''t spend lots of time moving around.


    - To snap a window with the mouse, click on its title and drag it to the side
    of the screen. You will then see an outline that will show you where the window
    would appear once you have dragged it.


    - To snap with the keyboard, just press Windows Key + Left Arrow (or Right Arrow).


    - To snap to one of the quadrants, just press Windows Key + Up Arrow (or Down
    Arrow), and then move it around by pressing Windows Key and arrow keys together.


    ## Using Multiple Desktops


    Yes, you can make use of multiple “desktops” while using Windows 10. To make this
    happen, just follow the instructions below:


    - Add a desktop by clicking Task View. Press Tab + Windows Key > New Desktop.


    Now, you have two virtual desktops. To switch between them, just press Windows
    Key + CTRL + Left Arrow + Windows Key + CTRL + Right Arrow.


    - To move windows between desktops, just right click on the window you’d want
    to move, then choose where you’d want to move it to.


    - To close the desktop, just click X or press Windows Key + CTRL + F4.


    ## Hiding System Tray Icon


    To hide the System Tray Icon temporarily, all you have to do is drag and drop
    said icon to the hidden area under the arrow. However, if you can see all of the
    icons onscreen, just open Task Manager (press CTRL + ALT + DELETE) and then go
    ahead and terminate GWXUX or GWX.


    - To hide the System Tray permanently, go to Control Panel > Windows Update.


    Choose Installed Updates—you’ll see this on the left side of the screen.


    Look for the label Update for Microsoft Windows KB3035583 and remove said update.


    Always skip this update by hiding it from future updates.


    ## Part 2: Second Week


    Now that you know the basics, it’s time to enjoy Windows 10 even more!


    ## Chapter 5: Understanding the Features


    And of course, in order to make sure that you enjoy the various features of Windows
    10, it’s just right that you learn how to use its many features!


    ### Writing on Web Pages


    This is a fun feature of Windows 10! Basically, you can have a little fun by literally
    writing on web pages, with the help of Windows 10’s Microsoft Edge, a next-gen
    browser!


    - To start “inking”, click on the icon that looks like pen and paper found on
    the upper right corner of the browser window.


    - Once you have clicked that, the web page you’re browsing will refresh. You can
    then start using the tools you see onscreen to write or doodle on the said webpage!


    - To type comments, you can use the text tool found on the toolbar mentioned earlier.


    - You can declutter the page by clicking on the numbered pin and closing the text
    box.


    - Click the trash icon to delete the text box, as well as the comment pin.


    - You can also use the clipping tool to make crosshair out of your cursor.


    - You can also erase line by line using the eraser tool. Just click, hold, and
    move over the lines you don’t want to see onscreen.


    - To share or save what you have done, just click the save icon. Then, a pop-up
    menu will appear onscreen. This’ll ask you whether you want to add the project
    to your reading list, save to OneNote, or add to your favorites. Just choose what
    you want to happen.


    ### Managing Notifications


    Since Windows 10 proves to be the Operating System for the new age, you can expect
    it to give you real time notifications. In short, you’ll get notifications from
    Facebook, Twitter, Instagram, and any other apps you might be using—as long as
    they’re connected to your Microsoft account.


    - To choose which notifications you’d like to have, go to Action Center > Show
    Notifications from These Apps. There, you’d see a list of the apps you have. Just
    choose what notifications you’d like to have and you’re all set!


    - You can also choose which Quick Actions you’d like to have access to. To do
    this, go to Settings > System > Notifications and Actions > Choose Your Quick
    Actions.


    ### Sharing Files Quickly


    - Look for the file that you want to share.


    - Click Sharing in the File Explorer.


    - Click Share button.


    - Choose the program you’d want to share the said file with.


    - Configure options by going to Settings > System > Share Lab.


    ### Setting Default Programs


    You can change default programs by following the instructions:


    Open Settings > System > Default Apps.


    - To set individual file types, go to Settings > System > Choose Default Apps
    by File Type.


    - To set defaults for protocols, go to Settings > System > Choose Default Apps
    by Protocol.


    - To change default programs for App:


    ### Exploring Photos App


    Take note that the Photos App now has two main features, and these are Collections
    and Albums. Your photos are chronologically arranged by date in Collections.


    - To add a folder, go to Settings > Sources > Add this Folder to Pictures.


    - To show photos and videos from OneDrive, just choose Settings > Show my Photos
    from OneDrive.


    - To share pictures, just select the picture you want and click Share!


    ### Delaying Shutter Speed with Pop-Ups


    You can also delay shutter speed in capturing screenshots by making sure you get
    to capture pop-ups, too. Here''s how:


    Open Snipping Tool and then click Delay. Choose between numbers 0 to 5.


    Choose the type of Snip you''d like to make by clicking what you find next to
    window, rectangular, free-form, full-screen.


    Click New so you could begin sniping. You will now have an allowance of 5 seconds,
    depending on what you chose earlier. The screen will freeze and you’ll be able
    to capture the image you want.


    Click *Save* to save your screenshot.


    ### Importing Bookmarks


    If you have been using other browsers before and want to regain access to bookmarks
    you’ve made there, you can just import them to the Edge. Here’s how:


    - Open Edge and click “...", then click Settings.


    - Choose Import Favorites from Another Browser.


    - Choose all the browsers you want to import bookmarks from and you’re all set!


    ### Sideloading


    Sideloading is important because it allows you to install apps that are not available
    in the Windows Store. Here’s how you can do it:


    - *Open Settings > Update and Security.*


    - Go to For Developers > Sideload Apps.


    - You will now receive a warning about sideloading being dangerous. Just click
    Yes to say that you understand the risks.


    ### Disabling Wi-Fi Password Sharing


    In order to make sure that your Wi-Fi connection stays yours, and that you would
    have more privacy, you can disable Wi-Fi sharing! Here’s how:


    - Go to *Settings > Network and Internet > Wi-Fi > Manage Wi-Fi Settings.* You
    can also turn off networks that automatically connect to Skype, Quora, Outlook
    or other.

