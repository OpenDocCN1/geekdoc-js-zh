  md: '# Chapter 1: Introduction to Python


    If you are looking for a general purpose, high level programming language with
    code readability as its main focal point, you should consider Python. It has a
    syntax that allows you to express concepts using fewer lines of code than other
    programming languages, such as C, C++, and Java. It supports a wide range of programming
    paradigms, thereby encompassing imperative, functional and object-oriented programming.
    Also, it features a comprehensive standard library, a dynamic tape system and
    an automatic memory management.


    There are plenty of interpreters you can use for installation on different operating
    systems; hence, it is possible for you to execute Python on various systems. You
    can even make use of third-party applications. If you do not want to install an
    interpreter, you can package the code into standalone executable programs so that
    you can effectively distribute Python-based software to different environments.


    # A Brief History of the Python Programming Language


    Python was developed by Guido van Rossum in the late 1980 '' s. It was initially
    just a Christmas project. Van Rossum wanted an interpreter for a scripting language
    that C and UNIX hackers will use. His little project eventually upgraded to Python
    2.0, which was released in October 2000. This new version had a complete garbage
    collector and Unicode support. Python 3.0, also called Python 3000 and py3k, was
    released in December 2008 and had features that were backported to versions 2.6
    and 2.7.'
  merge: -1
