  md: '# Chapter 7: FAQs


    Finally, here are frequently asked questions about Windows 10—answered for your
    convenience!


    Q: When was Windows 10 Launched?


    +   - Windows 10 was officially launched in July 28, 2015. This makes it FREE
    for one year for those whose operating systems are Windows 7 or 8. If after a
    year you have not upgraded to Windows 10 and decide that you want to, you''d have
    to pay $119 for Windows 10, and $199 for Windows 10 Pro.


    Q: Where can you get Windows 10 Apps?


    +   - Microsoft believes that you can buy from the Windows Store once and then
    these universal apps would work on all of the gadgets that you have synced with
    your account. Even Microsoft Office will work—so you''d basically be able to live
    a life of convenience!


    Q: Can it work with laptops or Windows Phones?


    +   - Windows 10 can be the sole OS for your desktop/laptop computer, Windows
    Phone, and Tablet. This is because of Continuum, the said driving force that makes
    Windows 10 work—and which makes it easy to operate whether by using mouse, keyboard,
    or touchscreen. There are finger-friendly fullscreen apps that you could download
    and use, too!


    Q: What if I don''t want the apps to take all of the screen space, or if I want
    to rearrange them?


    A: The great thing about Windows 10 is that fullscreen apps are optional—so if
    you'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'feel like your device is not compatible with them, you can opt not to download
    them. Since we now have Continuum, you can expect that the apps will work on the
    gadget you want it to work on—and that it will take its shape so you would not
    have a hard time to adjust.


    The Start Menu is reminiscent of the good old days and is not as confusing as
    the one from Windows 8 (which a lot of people hated). Plus, as you may have learned
    earlier, this new start menu makes use of Live Tiles that you can customize for
    your own benefit and preferences—making Windows 10 the best operating system you
    could have.


    You can also arrange apps side by side, thanks to what is called Snap. This is
    what the quadrants are for, and as you can see, you''ve been given commands that
    you can use to make it work. The great thing is that this supports virtual desktops,
    so if you multitask a lot, or have lots of things to address, this will certainly
    be helpful for you!


    Q: Do I have to use Windows Explorer? Or can I use other web browsers instead?


    A: Internet Explorer, while still part of the Microsoft Brand, is no longer the
    main browser used—so you can breathe a sigh of relief, especially if you''ve found
    it to be extremely slow in the past. Now, you''ll be able to use Microsoft Edge
    (as you have been told earlier), which has lots of new functions and extensions
    that will deliver a great experience for you.


    Microsoft Edge also comes with Cortana, your very own virtual assistant that will
    provide suggestions about what to put in the address bar, or gather information
    about the restaurant you want to visit, or tell you about latest promos and the
    like. This way, you''ll always be informed—and will never get bored anymore!


    Q: Is this really better than Vista? Or should I just stick to Windows 7 or 8
    instead?'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'A: Well, Windows 10 is definitely better than Vista as it does not lag like
    that and works on more computers, and also has a lot of upgrades from Windows
    7 and 8. Some users have said their laptops’ batteries have been draining ever
    since they used Windows 10, but noticed that when they charge their laptops better,
    then it does not happen.


    In short, it would still be best to make an upgrade because sooner or later, apps
    in Windows 7 or 8 might be phased out, and Windows 10 really works faster, and
    works in a sleek, professional manner, too!'
