    # Chapter 6: The Different Types of Loops in JavaScript


    When writing your own programs, you ''ll encounter situations where you have to
    execute an action multiple times. Obviously, typing the same thing repeatedly
    can be time-consuming (and extremely boring). Fortunately, JavaScript offers various
    tools that can help you repeat repeat statements quickly and easily. These tools,
    known as loops, are the main topic of this chapter.


    Here are the loops that you can use in the JavaScript language:


    # While Loops


