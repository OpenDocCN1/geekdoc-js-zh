    ## Chapter 3 – Second Week


    ## Week 2 Day 1 – Categories & Tags


    You can organize your posts into various categories such as topics or subject
    areas. For instance, if you are writing a post, consider a wider subject of the
    post. If you are planning to write more posts about the subject in the future,
    it is ideal to organize these posts together.


    ### Adding New Categories


    If you are yet to include categories, click the link showing + Add new category.
    Insert a new category by clicking the Add new category. You will notice that a
    new category has been included in the list of categories. To include a category
    to a post, click the checkbox next to the category.


    Another method to manage post categories is by navigating through the link Posts
    > Categories that is located in the Dashboard menu. If you click the Categories
    link, you can access the Categories page. From this, you can view all the categories
    located on the right, where you can also include new entries.


    ### Category Description


    The description area allows you to add more information about the posts linked
    to that category. Some WordPress themes display this information.


    ### Category Hierarchies


    Unlike tags, categories could be nested into hierarchies. For instance, you may
    have a News category, and under that you may include sub-categories for World
    News and Sports News.


    ### Category Slugs


    The Category Slugs is the link-friendly version of the category. This is often
    in lowercase form and involves only numbers, hyphens, and letters.


    ### What''s the Difference between Categories and Tags


    Just think of your website as a book. Categories are similar to the Table of Contents,
    while the tags serve like the index section.


    ## Week 2 Day 2 – Create a WordPress Page


    The first step in creating a new page is to locate the Pages menu in the Dashboard.
    Just click the Add new option.


    You will notice that the page editor has the same interface with the post editor.
    The only difference lies on few boxes that you can find on the right section of
    the screen. Add the page title such as Contact Us. Remember, if you have created
    pretty permalinks, the page title will also be used as the URL slug.


    After adding content for the page, you can Publish the section of the page editor,
    which is similar when you are writing posts. If you are ready to publish, you
    could either publish immediately, schedule for future posting or schedule it.


    The section for Page Attributes includes a parent page and template to your new
    page. In the Parent section, you can organize the pages according the the hierarchies.
    For instance, you can create this new page with added pages below it. Take note
    that there are no restrictions on the number of levels that you want to nest pages.


    The Template section allows you to include a template for your new page. This
    is possible if your theme allows custom page templates.


    The Order interface lets you organize the page in numerical order. Pages are often
    organized alphabetically, but you can select your own arrangement by providing
    a number in this box.


    Preview the page first, then hit Publish if all is well.


    ## Week 2 Day 3 – Applying a WordPress Template


    There are WordPress themes that feature templates, which change the format of
    the page on the front end of the website. Through page templates, the theme can
    provide you some flexibility for how the page will look and where specific elements
    will be placed.


    The first step in adding a page template is to browse the Pages menu in the Dashboard
    and find the edit or add a new page link. Locate the Page Attributes area, where
    you can see a drop-down list for templates that you can use. Depending on the
    WordPress theme, you can see certain options for page template located in the
    drop-down menu.


    To see how a template will change the look of the page, choose a template and
    preview it to check if it is appropriate for the page.


    You can hit Publish once you have finally selected the template you want to use.


    ## Week 2 Day 4 – Installing a Plugin


    Plugins allow you to add more functionalities for your WordPress website. Installing
    plugins is easy.


    The first step is to find and expand the Plugins menu after logging into your
    site Dashboard. Look for the Installed Plugins page where you can see a list of
    the plugins that are already installed on your site. Some plugins are automatically
    installed when you install WordPress such as Jetpack and Akismet.


    To add a new plugin, click the Add New option. From this page, you can choose
    to browse for plugins that you want to install from the WP Plugin Directory. You
    can also filter your search according to the plug-ins published date, popularity
    or those that you have marked as your favorites.


    To start uploading a plugin, follow this command thread: Choose file > locate
    your plugin zip file > Install Now > Activate.


    The last menu section under the Plugins in the Dashboard is the Editor, which
    allows you to make some changes.


    ## Week 2 Day 5 – Managing Themes


    The first step in managing WordPress themes is to browse the Appearance menu.
    Choose the Themes.


    At the upper part, you can see the Customize option as well. If you go back to
    the Themes tab, you can see a list of available themes. These themes are already
    installed on your site.


    If you choose the Live Preview, you can see how your website will look with that
    theme. In the preview, you can browse different pages. On the left side of the
    preview, you can edit the settings of the settings of the theme.


    Be sure to hit the Save & Activate button found on the upper left.


    ## Week 2 Day 6 – Create a Custom Menu


    You can create a custom menu that will serve as navigation menu for your website.
    The Menu feature allows you to build your own menu as a replacement for the default
    menus.


    Some custom menus contain links, categories, pages, and other types of content.
    You can also include a custom navigation label for a menu item as well as other
    attributes.


    In general, there’s no cap on how many menus you want to set up. Hence, if your
    theme includes more than one location, you can select which custom menu to link
    with every location. You can also utilize custom menus alongside the Custom Menus
    widget.


    ### How to Create a Custom Menu in WP Website


    The first step is to expand the Appearance menu on the left side of the Dashboard.
    Hit on the link for Menus in the Appearance, which will activate the Menu editor
    page. Provide the name that you want for the menu, and click Create menu. Then,
    you can add menu items inside the boxes on the left such as links, categories,
    and pages.


    If you want to change which menu options you see from this page, you just need
    to expand the Screen Options tab. Then, add other menu options such as CSS classes,
    formats, tags, and posts.


    Once you have organized your menu items, make sure to Save Menu.


    ## Week 2 Day 7 – Managing Comments


    Managing comments in a site built on WordPress is similar to the manner of handling
    pages and posts.


    In the Dashboard, look for the Comments page. You can customize this screen in
    similar as you customize other WordPress screens. A yellow color indicator signifies
    that the comment needs to be moderated. You can respond on comments through the
    Bulk Actions or by hovering on the action links.


    In the Author column, aside from the name of the author, blog URL, email address,
    the IP address of the commenter will also be displayed. If you click this link,
    it will reveal all the comments from specific address.

    '
  mdcn: '


    ## 第3章 – 第二周


    ## 第2周第1天 – 分类与标签


    你可以将文章组织成各种分类，例如主题或学科领域。例如，如果你正在写一篇文章，可以考虑该文章更广泛的主题。如果你计划未来就就该主题编写更多文章，那么将这些文章组织在一起是理想的。


    ### 添加新分类


    如果你还没有包含分类，请点击显示“+ 添加新分类 (Add new category)”的链接。点击“添加新分类”插入新分类。你会发现分类列表中包含了一个新分类。要为文章添加分类，请点击分类旁边的复选框。


    另一种管理文章分类的方法是通过位于仪表板菜单中的“文章 (Posts) > 分类 (Categories)”链接进行导航。如果你点击“分类”链接，即可进入分类页面。在这里，你可以查看右侧的所有分类，你也可以在那里添加新条目。


    ### 分类描述


    描述区域允许你添加更多与该分类关联的文章信息。某些 WordPress 主题会显示这些信息。


    ### 分类层级


    与标签不同，分类可以嵌套成层级结构。例如，你可以有一个“新闻 (News)”分类，在下面你可以包含“世界新闻 (World News)”和“体育新闻 (Sports
    News)”子分类。


    ### 分类别名 (Slugs)


    分类别名（Category Slugs）是分类的链接友好版本。这通常是小写形式，仅包含数字、连字符和字母。


    ### 分类和标签有什么区别


    将你的网站想象成一本书。分类类似于目录，而标签则像索引部分。


    ## 第2周第2天 – 创建 WordPress 页面


    创建新页面的第一步是在仪表板中找到“页面 (Pages)”菜单。只需点击“添加新增 (Add new)”选项。


    你会发现页面编辑器的界面与文章编辑器相同。唯一的区别在于屏幕右侧区域的几个选项框。添加页面标题，例如“联系我们 (Contact Us)”。记住，如果你创建了固定链接（pretty
    permalinks），页面标题也将用作 URL 别名。


    在为页面添加内容后，你可以点击页面编辑器中的“发布 (Publish)”部分，这与写文章时类似。如果你准备好发布，可以选择立即发布、安排在未来发布或进行计划。


    “页面属性 (Page Attributes)”部分包含你新页面的父页面和模板。在“父级 (Parent)”部分，你可以根据层级结构组织页面。例如，你可以创建一个新页面并在其下方添加页面。请注意，对想要嵌套页面的层数没有限制。


    “模板 (Template)”部分允许你为新页面包含一个模板。如果你的主题允许自定义页面模板，这是可能的。


    “排序 (Order)”界面允许你按数字顺序组织页面。页面通常按字母顺序组织，但你可以通过在此框中提供一个数字来选择自己的安排方式。


    先预览页面，如果无误，则点击发布。


    ## 第2周第3天 – 应用 WordPress 模板


    某些 WordPress 主题带有模板，这些可以更改网站前端的页面格式。通过页面模板，主题可以为页面外观以及特定元素的放置位置提供一些灵活性。


    添加页面模板的第一步是浏览仪表板中的“页面”菜单，并找到“编辑”或“添加新页面”链接。定位到“页面属性 (Page Attributes)”区域，你可以在那里看到可以使用的模板下拉列表。根据
    WordPress 主题的不同，你可以在下拉列表中看到某些页面模板选项。


    要查看模板将如何更改页面外观，选择一个模板并进行预览，以检查它是否适合该页面。


    一旦你最终选择了想要使用的模板，即可点击发布。


    ## 第2周第4天 – 安装插件


    插件允许你为 WordPress 网站添加更多功能。安装插件非常简单。


    第一步是在登录网站仪表板后，找到并展开“插件 (Plugins)”菜单。寻找“已安装插件 (Installed Plugins)”页面，你可以在那里看到已安装在网站上的插件列表。某些插件在安装
    WordPress 时会自动安装，例如 Jetpack 和 Akismet。


    要添加新插件，点击“添加新增 (Add New)”选项。从该页面，你可以选择从 WP 插件目录（WP Plugin Directory）浏览想要安装的插件。你还可以根据插件的发布日期、流行程度或你标记为收藏的项目来过滤搜索。


    要开始上传插件，请遵循此流程：选择文件 (Choose file) > 位你的插件 zip 文件 > 现在安装 (Install Now) > 激活 (Activate)。


    仪表板中“插件”下的最后一个菜单部分是“编辑器 (Editor)”，允许你进行一些更改。


    ## 第2周第5天 – 管理主题


    管理 WordPress 主题的第一步是浏览“外观 (Appearance)”菜单。选择“主题 (Themes)”。


    在上部，你还可以看到“自定义 (Customize)”选项。如果你回到“主题”选项卡，可以看到可用主题列表。这些主题已经安装在你的网站上。


    如果你选择“实时预览 (Live Preview)”，你可以看到你的网站使用该主题后的样子。在预览中，你可以浏览不同的页面。在预览的左侧，你可以编辑主题的设置。


    务必点击左上角的“保存并激活 (Save & Activate)”按钮。


    ## 第2周第6天 – 创建自定义菜单


    你可以创建一个自定义菜单，作为你网站的导航菜单。“菜单 (Menu)”功能允许你构建自己的菜单来替换默认菜单。


    某些自定义菜单包含链接、分类、页面和其他类型的内容。你还可以为菜单项目包含自定义导航标签以及其他属性。


    通常情况下，你想要设置的菜单数量没有限制。因此，如果你的主题包含多个位置（location），你可以选择将哪个自定义菜单链接到每个位置。你也可以配合“自定义菜单”小部件使用。


    ### 如何在 WP 网站创建自定义菜单


    第一步是展开仪表板左侧的“外观”菜单。点击“外观”中的“菜单”链接，这将激活菜单编辑器页面。为你想要的菜单提供名称，并点击“创建菜单”。然后，你可以从左侧框中添加菜单项，如链接、分类和页面。


    如果你想更改在此页面上看到的菜单选项，只需展开“屏幕选项 (Screen Options)”选项卡。然后，添加其他菜单选项，如 CSS 类、格式、标签和文章。


    一旦你组织好菜单项，务必点击“保存菜单 (Save Menu)”。


    '
