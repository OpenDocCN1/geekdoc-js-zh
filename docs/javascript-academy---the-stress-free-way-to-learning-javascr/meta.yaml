- md: '

    ## Media Settings


    The Media Settings page allows you to set max sizes for images you want to add
    into the post. These settings will allow you to save time if you want images to
    be of the same size, if you want to set default settings for image sizes.


    The option for Uploading files allows you to choose if you want your uploads to
    be organized into month or year. Make certain to Save Changes.


    ## Discussion Settings


    The Discussion Settings allow you to manage the comments and links to your posts
    and pages.


    The first section is the default article settings. The first setting allows you
    to manage links you make to other blogs. The second setting allows you to manage
    the trackbacks and ping backs or links back to your site. Finally, the third setting
    allows your site visitors to post comments on new articles. You can uncheck this
    box if you don’t want visitors to comment on the posts.


    The Other comment settings allow you to choose the guidelines for how visitors
    post comments and how you manage their comments.


    For the email me whenever section, you can select to be notified via email if
    someone posts a comment or if a comment has been handled by a moderator.


    The section for Before a comment appears will allow you to manage the published
    comments. Through this, you can select if an administrator should approve the
    comments first or if the comments could be published automatically.


    In the section for Comment Moderation, you can change how a comment is managed
    depending on the number of links. Inside the box, you can include IPs, emails,
    names, words, and URLs to filter comments for moderation. This feature alongside
    the comment blacklist are can help you in defending your blog against comments
    that are inappropriate and spammy.


    There is also the Avatar setting. You can enable the avatars of users who posted
    comments on your website, select a default avatar for users who don’t have their
    own avatar yet, or filter the comments based on their ratings.


    Again, be sure to Save changes.


    ## Permalink Settings


    Permalinks refer to the permanent URLs to each page and blog post including tag
    and category archives. In general, a permalink is the web address that can be
    used to link to your content. It got its name by combining permanent and link.
    Hence, permalink.


    The Permalink settings in WordPress allows you to manage the default structure
    of your permalinks. You can either select from common settings or build your customized
    URL. As a default, WordPress utilizes URLs that have question marks and with numbers.
    You may want to change the permalinks here to improve its forward compatibility,
    usability, and aesthetics.


    ## Week 1 Day 6 – Create a WordPress Post


    To create your first post, find the Posts menu in the left side of the Dashboard.
    You can click to expand it to access the submenu or just hover over the link Posts.


    In the + New link in the Admin Bar, you can also find the Add New Pages page.
    Just click the link for Add New to access the Add New Post page so you can start
    creating your first WordPress post.


    You can enter the title of your post in the first box.


    Below that is the post editor or Post formatting section, where you will type
    or paste the post content. There are two tabs on the right side of the tabs showing
    two modes of post editing: Text and Visual.


    The Text tab will let you access a plain-text HTML version of the post editor.
    You can use this mode to edit the HTML code of your post. If you are not comfortable
    with HTML, the visual mode is recommended.


    The Visual tab is ideal for developers who are comfortable with the WYSIWYG (What
    You See Is What You Get) concept. It comes with a format toolbar with different
    options to format your posts. Many of these icons will look familiar if you have
    been using Microsoft Word.


    The Publish box is located at the top of the right column of the screen. You can
    save your post as a draft if you want to save it. The Preview button will allow
    you to take a glimpse of how the post will actually look once you publish it.
    The Status will let you know if the post is currently a draft, has been saved,
    already published or if it is a pending review if you have schedule the post.


    The succeeding links allows you to see the post’s visibility or what the site
    visitors see. The Publish line shows if the post will be immediately published
    or at a future date. The next section is for tags and categories assigned to your
    post. Save this lesson later.


    If you want to change the screen options for your editor, you can click the screen
    options tab found in the upper right. This will expand the link and you will see
    the options, which will be displayed on the screen’s post editor.


    In the post editor, you can just drag or drop the arrangement of these boxes,
    to change how you want them to appear on the page.


    If you need help in adding new posts, you can just click the Help tab found in
    the upper right. From here, you can easily refer on inserting media, using the
    editor, helpful tips for adding a post title, and pointers on customizing your
    post display.


    ## Week 1 Day 7 – Adding Links and Images


    Links are important for the SEO of your content, while images are ideal to improve
    the appeal and readability of your posts. WordPress makes it easy to add these
    two elements into your website.


    ### Adding Links


    In the page editor or WordPress post, choose and highlight the text, which you
    want to be added with link. Then, click the hyperlink button located in the toolbar.
    This will reveal a box that you can use to enter the specific URL of the hyperlink
    as well as the title which will be shown if you hover over the link. Clicking
    this checkbox will also allow you to access the link in the new tab.


    If you prefer linking to an existing content on your site, you can just click
    to expand this section. With this, you can see a search bar to search your website,
    as well as a list of present pages or posts.


    Choosing one of the items on the list will also change the hyperlink. If your
    hyperlink is ready, just click the Add Link button. Your chosen text will now
    have a link. If you want to remove the link, choose the text again and choose
    the unlink button. You will see that the link has been removed and the text is
    in normal display again.


    ### Adding Images


    Choose the best place in the post to insert your image. On the upper section of
    the Post editor toolbar, you will see the button Add Media. Click this button
    to reveal the Insert Media box.


    WordPress stores a media library to keep all your media files such as videos and
    images. In this box, you can select to either upload a new file or use a present
    file from the media library. If you want to upload an image, click the button
    Select files and find the image you want to use.


    After your image has been uploaded, you will notice that it has been added to
    the media library. On the right area of the box, you will see the attachment details
    for the page. In this section, you can see the Description , Alt text , Caption
    and Title. You can also select the image alignment as right , left , or center.


    Ensure that the image has a checkbox. Click the insert into post button. Now you
    can see that your image has been inserted into your post.


    Once you click the image, you will see two boxes in the upper section of the image.
    The first is the image icon. When you click this icon, you will see that another
    box will appear where you can edit all the image details. In this prompt, you
    can modify the image size based on the percentages or you can change the link
    URL, caption, alt text, and title. You can also choose the image link or to link
    to the actual file of the image.


    In choosing the advanced settings tab, you will see the link of where the image
    is currently hosted, properties and style that adds padding on the image, the
    CSS Class, and the actual height and width of the image in pixels.


    Next, return to the image. The next icon in the upper corner will let you delete
    the image from the post. In clicking the Add Media button, you will notice the
    same insert media box. On the left side, you will see the options to set up a
    gallery and choose the featured image. If you have enough images in the media
    library, you can add a whole image gallery into your post.


    Featured images are used by some themes. If your chosen theme has the featured
    image, go ahead and select the image and go back to the post editor. Click the
    preview button and check if the image has been inserted.

