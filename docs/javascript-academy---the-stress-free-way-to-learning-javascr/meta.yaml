    \ comments. You have to use empty lines to terminate multiline statements in an\
    \ interactive interpreter session.\n\n## Chapter 3: Data Types\n\nIn Python, input\
    \ data are sorted according to different categories. The primary purpose of sorting\
    \ is to help programmers like you in processing information more efficiently.\
    \ Such categories function as data storage locations that you can access whenever\
    \ you run the Python platform.\n\n## Variables\n\nVariables contain values that\
    \ have been specifically allocated to them. If you are working on complex codes\
    \ for applications, you may want to store your information in these variables.\
    \ Do not worry because you can access them anytime you need them. You can even\
    \ use them to ensure that the information you gather from your end users stay\
    \ safe and secured.\n\n## Numeric Types\n\nNumbers in the Python programming language\
    \ are different from the numbers you use to solve problems in Algebra. In Mathematics,\
    \ adding .0 at the end of a number practically means nothing. It does not make\
    \ any difference to its value. For instance, 3 and 3.0 are the same.\n\nIn Python,\
    \ however, 3 and 3.0 are different numbers. Before the program processes it, it\
    \ has to undergo certain data processing methods. As a programmer, you have to\
    \ learn about the different numeric types.\n\n## Integers\n\nAll whole numbers\
    \ are integers. Numbers that contain a decimal point are not whole numbers; therefore,\
    \ 3 is a whole number while 3.0 is not. Integers in Python are characterized by\
    \ the data type int.\n\nTake note that integers have capacity limitations. You\
    \ will generate an error if you try to process a value beyond the allowed limits.\
    \ Integers typically process numbers between -9,223,372,036,854 and 9,223,372,036,854.\n\
    \nThere are interesting features that come with the int variable. For instance,\
    \ base 2 only uses 0 and 1, base 8 uses numbers from 0 to 7, base 10 has similar\
    \ properties with the decimal system and base 16 uses the letters A to F and the\
    \ numbers 0 to 9 digits.\n\n## Floating Point Values\n\nAny number that contains\
    \ a decimal point is considered as a floating point value in Python. It does not\
    \ matter if the number after the decimal point is 0 or not. 3.0, 1.5, and 11.4,\
    \ for example, are all floating point values. They are stored in the float data\
    \ type. One huge advantage of floating point values over integers is that they\
    \ have bigger storage spaces; hence, they are capable of storing very small or\
    \ large values.\n\nThen again, you should not think that they have an unlimited\
    \ storage space. There is still a limitation. Nevertheless, they can contain as\
    \ little as ± 2.225073858502014 × 10⁻³⁰⁸ and as much as 1.7976931348623157 × 10³⁰⁸\
    \ there are a couple of ways to allocate values with the use of floating point\
    \ values. First, you can directly assign them. Second, you can use a scientific\
    \ notation. Keep in mind that negative exponents produce fraction equivalents.\n\
    \n## Complex Numbers\n\nThese numbers consist of real numbers and imaginary numbers\
    \ combined. Usually, they are used in dynamic systems, quantum mechanics, computer\
    \ graphics, electrical engineering and fluid dynamics. Complex numbers can be\
    \ processed in Python and a few other programming languages.\n\n## Boolean Values\n\
    \nThese are the two constant objects True and False. They represent truth values.\
    \ When used in a numeric context, they function as 0 and 1. You can use the function\
    \ bool to assign a value to a Boolean if such value may be interpreted as a truth\
    \ value.\n\n## Strings\n\nThey are groups of characters that are connected with\
    \ double quotation marks. Consider the following example:\n\nTheString = \"Python\
    \ got its name from a popular comedy show.\"\n\nAs you can see in the sample code\
    \ shown above, the phrase Python got its name from a popular comedy show. is assigned\
    \ to the variable TheString.\n\nComputers cannot understand letters, only numbers.\
    \ So when you write a program, Python reads and interprets it based on the numbers\
    \ that represent letters. For example, in the American Standard Code for Information\
    \ Interchange (ASCII), the number 65 represents the letter A. So if you type in\n\
    \nord ( \" A \")\n\nyou will get an output of\n\n65\n\nBecause computers cannot\
    \ understand letters, you have to convert strings into numbers. You can use int\
    \ or float to do this. In case you need to convert numbers into strings, you can\
    \ use str.\n\n## Chapter 4: Operators\n\nThe values of your operands are manipulated\
    \ by operators. There are seven types of operators used in the Python programming\
    \ language. The following tables display these operators and provide brief explanations\
    \ regarding their function.\n\n## Arithmetic Operators\n\n| Operator | Description\
    \ |\n| :--- | :--- |\n| Addition (+) | It adds the values. |\n| Subtraction (-)\
    \ | It subtracts the second operand from the previous operand. |\n| Multiplication\
    \ (*) | It multiplies the values. |\n| Division (/) | It divides the first operand\
    \ by the second operand. |\n| Modulus (%) | It divides the first operand by the\
    \ second operand and returns the remainder. |\n| Exponent (**) | It performs exponential\
    \ calculation on the operators. |\n| Floor Division (//) | It divides the operands\
    \ but eliminates the decimal points after the result. |\n\n## Comparison Operators\
    \ or Relational Operators\n\n| Operator | Description | \n| :--- | :--- |\n| ==\
    \ | If the values of both operands are equal, the condition is true. |\n| != |\
    \ If the values of both operands are not equal, the condition is true. |\n| <>\
    \ | If the values of both operands are not equal, the condition is true. |\n|\
    \ > | If the value of the left operand is bigger than the value of the right operand,\
    \ the condition is true. |\n| < | If the value of the left operand is less than\
    \ the value of the right operand, the condition is true. |\n| >= | If the value\
    \ of the left operand is bigger or equal to the value of the right operand, the\
    \ condition is true. |\n| <= | If the value of the left operand is less than or\
    \ equal to the value of the right operand, the condition is true. |\n\n## Assignment\
    \ Operators\n\n| Operator | Description |\n| :--- | :--- |\n| = | It assigns values\
    \ from the right operand to the left operand. |\n| += | It adds the right operand\
    \ to the left operand, and then allocates the result to the left operand. |\n\
    | -= | It subtracts the right operand from the left operand, and then allocates\
    \ the result to the left operand. |\n| *= | It multiplies the left operand and\
    \ the right operand, and then allocates the result to the left operand. |\n| /=\
    \ | It divides the left operand with the right operand, and then allocates the\
    \ result to the left operand. |\n| %= | It uses the two operands to find the modulus,\
    \ and then allocates the result to the left operand. |\n| ** | It performs exponential\
    \ computation on the operators and then assigns the value to the left operand.\
    \ |\n| // | It performs floor division on the operators and assigns the value\
    \ to the left operand. |\n\n## Bitwise Operators\n\n| Operator | Description |\n\
    | :--- | :--- |\n| & binary AND | It copies the bit if it is present in both operands.\
    \ |\n| | binary OR | It copies the bit if it is present in either operand. |\n\
    | ^ binary XOR | It copies the bit if it is present in one operand, but not both.\
    \ |\n| ~ binary ones complement | It flips bits. |\n| << binary left | It moves\
    \ the value of the left operand towards the left based on the number of bits assigned\
    \ by the right operand. |\n| >> binary right | It moves the value of the left\
    \ operand towards the right based on the number of bits assigned by the right\
    \ operand. |\n"
