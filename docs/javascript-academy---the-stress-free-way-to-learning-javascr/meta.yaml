    ## 第一部分：第一周


    在安装 Windows 10 的第一周，你可以学到这些内容！


    ## 第章：安装 Windows 10


    在安装 Windows 10 之前，你必须确保电脑已准备就绪，这意味着你必须遵循以下步骤：


    ### 正确的配置 + 适当的备份


    首先，确保你的电脑符合要求，这意味着你需要按照以下步骤操作：


    - 显卡需要支持 DirectX 9 驱动程序；

    - 内存（RAM）至少为 2GB；

    - 磁盘空间需要 20GB；

    - 处理器需要 1GHz 或更高；


    现在，请备份数据。你可以将其存在外部硬盘或云服务（如 Dropbox、Google Drive 或 OneDrive）。


    对于 Windows，你可以通过点击“文件历史记录”备份个人文件。


    在屏幕左侧选择“系统映像”，并选择保存位置。


    ## 更新


    在安装 Windows 10 之前，你必须先进行更新。要执行此操作，请遵循以下说明：


    - 如果你使用的是 Windows 7，前往“开始菜单 > 控制面板 > 系统和安全 > Windows 更新”。

    - 对于 Windows 8，前往“开始 > 设置 > 更新和恢复 > Windows 更新”。

    - 对于其他版本，只需等待电脑发送更新提示。


    ## 安装时间！


    请注意，有两种方法可以实现。查看下第一种：


    你可以尝试这样做：


    - 如果你的电脑运行 Windows 7 或 8 或更早的版本，请先从微软下载“媒体创建工具”。检查你需要的是 32 位还是 64 位版本。

    - 运行下载好的工具，然后选择“为另一台电脑创建介质”，并点击下一步。

    - 现在，选择语言、版本和架构，然后点击下一步。

    - 当询问使用什么介质，选择“USB 闪盘”。

    - 将闪盘插入 USB 端口，等待提示并点击下一步。电脑现在正在下载 Windows 10。

    - 大约 10 分钟后，在资源管理器中打开驱动器并运行设置。等待“准备好安装”提示，然后选择“选择保留的内容”。等待其余安装完成，你就大功告成了！


    或者，你也可以尝试下面的方法：


    第二种方法仅适用于已经运行 Windows 10 的电脑。如果你对目前的设置不满意，或者想彻底刷新电脑，可以使用此方法。你可以这样操作：


    - 点击 Windows 10 菜单中的“设置”。

    - 点击“更新和安全”。

    - 点击“恢复 > 重置此电脑 > 开始”。

    - 选择“删除所有内容”。等待其余安装完成。


