  md: '# Chapter 1: The JavaScript Language


    # Basic Information


    JavaScript is one of the most popular programming languages today. This language
    plays an important role in the development of modern websites and webpages. Its
    characteristics and capabilities can help you create dynamic websites that support
    user interactions. Additionally, JavaScript is an interpreted computer language
    that possesses powerful object-oriented features.


    This language was originally called “LiveScript,” but Netscape (the company that
    created it) changed the name to JavaScript in order to exploit the popularity
    enjoyed by Java (another programming language). It must be pointed out that JavaScript
    has no connection with the Java language.


    # The Client-Side Form of JavaScript


    According to computer experts, the most popular variant of this language is the
    Client-Side JavaScript. Website developers use this variant in creating their
    projects. In general, you may use Client-Side JavaScript in two different ways:


    +   - Include it in the codes of the webpage/s


    +   - Save it in an external file


