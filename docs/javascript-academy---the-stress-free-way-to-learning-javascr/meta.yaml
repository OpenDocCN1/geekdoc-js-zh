    and is more semantically correct. Anyway, the print statement is not considered
    as a function in version 2.0; hence, you can invoke it without including parentheses
    in your code. On the other hand, the print statement is considered as a function
    in version 3.0; hence, you have to use parentheses if you wish to invoke it.


