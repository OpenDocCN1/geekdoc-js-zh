    ## Chapter 3: The Program Structure in JavaScript


    This chapter will teach you “actual programming.” You’ll be using JavaScript commands
    that go beyond the nouns and phrases you’ve used so far. Study this material carefully
    since it will help you master the basics of JavaScript in two weeks.


    ## Statements and Expressions


    In the previous chapter, you generated new values by applying operators on existing
    values. It seems like value creation is the most important part of JavaScript
    programs. However, it’s just a small part of this powerful language.


    The part of a code that creates a value is known as “expression.” Thus, any value
    you’ll write literally (e.g. 99 or “ninety-nine”) falls under this category. Expressions
    are still called expressions even if you’ll enclose them in parentheses. Also,
    an expression is still an expression even if you are using unary, binary, or ternary
    operators.


    The paragraph above highlights the advantages of a programming interface that
    is based on language. Expressions act as subsequences in any human language –
    they can hold other expressions inside them. That means you can mix JavaScript
    expressions to state confusing calculations.


    If expressions are equivalent to subsequences, JavaScript statements are equivalent
    to complete sentences. Basically, a JavaScript program is just a collection of
    statements.


    The most basic type of statement is a value followed by a semicolon. Based on
    this principle, we can create this simple program:


    ```

    0;

    false;

    ```


    In JavaScript, the sample given above is considered as a complete program. It’s
    a worthless one, though. Statements are only useful if they do something that
    affects other things (e.g. showing some characters on the screen, improving the
    programming environment, etc.). The two statements shown above simply create two
    values (i.e. 0 and false). They don’t change or improve anything. If you’ll execute
    this program, you won’t observe anything significant.


    ## The Variables


    How can JavaScript programs maintain themselves? How do they store things? You
    have seen how to create new values using old ones. However, that process doesn’t
    modify the preexisting values. You also need to use the resulting values immediately
    or they will simply disappear. To capture and hold values, JavaScript offers variables.


    ```

    var example = 3 * 3;

    ```


    In this example, var (one of the keywords in JavaScript) indicates that the line
    will create a variable. The keyword is followed by the variable’s name, and if
    you want to assign a value immediately, by an “=” sign and your desired expression.


    The statement generates a variable named “example” and uses it to store the product
    of 3 * 3.


    Once you have defined a variable, you can use its name as an ordinary expression
    in your future JavaScript statements. The value that you’ll get from “expression”
    is identical to the value you assigned while creating it. Check the following
    example:


    ```

    var three = 3;

    ```


    ```

    console.log(three * three);

    ```


    ```

    // -> 9

    ```


    When naming variables, you can use any word that isn’t a keyword (e.g. var). You
    can include numbers in the variable’s name, but you can’t use a number as the
    initial character.


    For example, programming1 is valid but Iprogramming isn’t. Additionally, you cannot
    use spaces in naming variables. In terms of special characters, you can only use
    the dollar sign (i.e. $) and the underscore (i.e. _). JavaScript doesn’t allow
    you to use punctuation marks in variable names.


    You may change the value assigned to a variable. In JavaScript, you can simply
    use the “=” sign on any variable to give it a new value.


    ```

    var taste = "bitter";


    console.log(taste);


    // -> bitter


    taste = "sweet"


    console.log(taste);

    ```


    In general, you should think of variables as tentacles instead of containers.
    A variable grasps values, it doesn’t contain them. That means multiple variables
    can point to a single value.


    Let’s analyze a simple example. You need to generate a variable to remember the
    amount Johnny owes you. When he pays $50, you have to assign a new value to the
    existing variable. Check the lines below:


    ```

    var JohnnysDebt = 200;


    JohnnysDebt = JohnnysDebt – 50;


    console.log(JohnnysDebt);


    // -> 150

    ```


    If you will create a variable without assigning a value, it will be considered
    empty. It will give “undefined” if you’ll ask for the value it contains.


    JavaScript allows you to include several variables in one var statement. When
    using this functionality, you should separate the variables using commas. Here’s
    an example:


    ```

    var three = 3, four = 4;

    ```


    ```

    console.log(three + four);

    ```


    ```

    // -> 7

    ```


