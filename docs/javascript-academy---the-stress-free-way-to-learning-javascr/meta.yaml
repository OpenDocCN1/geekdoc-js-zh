    ## Chapter 2: Using the Start Menu


    A lot of people find the Windows 10 Start Menu to be confusing—and this is really
    evident, especially in the beginning. But don’t worry because in this chapter,
    you’ll learn how to make the most out of that Start Menu—and make sure that it’ll
    work for you!


    You can use the Start Menu this way:


    - Click the Start Menu. This will appear on the left side of the screen.

    - Click All Apps. Again, this’ll be on the left side of the screen. You’ll then
    see a display of all the apps installed on your computer.

    - To search for an app or file, type what you’re looking for in the Search Field
    and you’ll see a list of choices popping up onscreen.

    - The Power button would allow you to rest or shut Windows down. This is found
    on the left column of the screen.

    - To lock the PC, just right-click your account name and then you’d see the following
    options: lock, change account picture, sign out. Choose lock.

    - You can also pin certain items on the Start Menu. To do this, just right click
    on the file you’d like to see on the Start Menu and click Pin to Start.

    - To manage the tiles on the right side of the screen, just right-click on a tile,
    and then you’ll see a menu pop up onscreen. Choose either Unpin from Start, Resize
    or Pin to Taskbar. Also check if there is an Uninstall option—this would come
    with most apps.


    ### Using both Start Menu and Start Screen


    If you’re quite a multitasker and you want to work on both the Start Screen and
    Start Menu at the same time, here’s what you have to do:


    - Click Start button, followed by Settings > Personalization.

    - Click Start.

    - Choose Use Start FullScreen.

    - Click Start Screen to make Start Menu disappear.

    - Uncheck Use Start FullScreen to return to Settings.


    Then, you can also resize the Start Menu. To do this, click Start.


    Move cursor to the top of the Start Menu, and then drag and move it up to the
    top of the said Menu. To decrease the height, just drag the cursor down.


    Increase width by dragging cursor to the right, and drag it to the left to decrease.


    ## Customizing the Start Menu


    Take note that you can definitely customize what you see onscreen and how you
    want your PC to work for you!


    To make a switch between the Start Menu and the Start Screen, open Settings >
    Personalization > Start > Start Behaviors > Use Fullscreen when in Desktop.


    To change the color of the Start Menu, window borders, and taskbar, go to Settings
    > Personalization > Colors. If you want a brightly colored PC, just go to Show
    Color on Start, Taskbar, and Action Center, and it’ll happen.


    To customize what you’ll see onscreen, go to Settings > Customize. There, you’ll
    see a list of suggested apps from Microsoft. Another setting would show you setting
    controls for your recently opened programs, and the last one would be about Jump
    List items.


    Click Start > Choose Folders to choose which folders you’d like to see onscreen.


    Click Start again to see whether you have all the folders and files that you need.


    ## The Secret Menu


    There is also a so-called “secret” Start Menu that you can also use and customize.
    Here’s how you can gain access to it.


    - Right click on the Start icon.

    - You will then see a pop-up menu with mostly everything you can do with the computer!

    - If using touchscreen, you can access this menu by tapping and holding the button
    for at least 5 to 10 seconds!


    ## Chapter 3: Understanding Settings


    By understanding the settings and knowing how to use it, you’ll easily be able
    to navigate Windows 10 and make the most out of it!


    ### Accounts


    You can find the Accounts tab under the Charms bar, and is basically about your
    Windows account.


    - Your Account is your primary sign-in account. This is linked to Microsoft’s
    Cloud Network.

    - Sign-options will ask you how exactly you want to open your computer. You can
    make use of normal log-in plus password, choose Windows Hello, which would allow
    you to log in using biometrics.

    - Work Access tells you whether the PC or your account is connected to another
    network.

    - Family and Other Users allows you to add more admins to the PC. To do this,
    click Set up account for assigned access > Choose an Account > Choose an App.

    - Sync Your Settings allows you to sync this PC with your other gadgets—and other
    computers at home, as well.


    ### Privacy


    Of course, you can also make sure that your privacy is protected with the help
    of Windows 10. Here’s how:


    - General is about deciding whether you’d like your name to appear on apps, programs,
    photos, and any other file that is connected to your computer.

    - Location basically works on GPS, and allows you whether you’d like to let others
    see where you are or not.

    - Microphone gives you the chance to turn the microphone on or off.

    - Speech, Inking, Typing mostly gives you the option to use Cortana (Windows 10''s
    digital assistant) or not.

    - Account Info, Calendar, Contacts, Messaging, Radio just give you permission
    whether you’d like to sync them with other devices or not.

    - Other Devices gives you permission to sync Xbox One and information found there
    with your Microsoft account.

    - Feedback. Choose which you’d want Microsoft to ask you for feedback once a day,
    once a week, automatically, always, or never.


    ### Devices


    The Devices Tab gives you what devices you’d like to connect.


    - Printers and Scanners allows you to add printers.

    - Connected Devices, meanwhile, is about other devices.

    - Mouse and Touchpad gives you what settings to configure.

    - Typing allows you to choose your keyboard.

    - Autoplay allows you to choose whether it should be switched on or off.


    ### Ease of Access


    The Ease of Access Tab contains settings.


    - Narrator helps you with what is onscreen. It basically reads what you type.

    - Magnifier gives you a floating toolbar and also magnifies your screen.

    - High Contrast allows you to choose a theme.

    - Closed Captions provides you with subtitles or captions to help you understand
    what you hear.


    ### Personalization


    Then again, you also have the chance to personalize your Windows experience. Take
    note, though, that you’d have more chances to customize your experience—but more
    of that on a later chapter. Here are the basics first:


    - Background is mainly just the wallpaper of your computer, and choose how you’d
    want the photo to fit on your screen.

    - Colors are the colors that would be used for desktop, toolbars, etc.

    - Lockscreen is what you''ll see onscreen while it is locked. Click Pictures,
    and you''ll see the 5 recent lockscreen pictures used, as well as a Browse button
    for you to choose photos from your files. Choosing Slideshow would make a slideshow
    of pictures as your lockscreen. You can also choose Screen Timeout, and more Saver
    Settings.

    - Themes would help you choose which theme you''d like to use. Go to Theme Settings
    > Related Settings to do this.

    - Start helps you turn applications and notifications on or off—and more. You’d
    learn about this in the next chapter.


    ## Update and Restore


    And of course, you also have the Update and Restore tab, which works something
    like this:


    - Activation is about the version of Windows that you have, and gives you the
    chance to change Product Key.

    - Advanced Options would give you more settings to choose from.

    - Backup gives you the chance to backup your settings.

    - Click Check for Updates so you could check for updates manually.

    - For Developers is all about making apps and programs while on Windows 10.

    - Recovery contains options that you can use to fix your computer, which are:
    Reset PC, Go back to Earlier Build, and Advanced Startup.


    The tab named Windows Update contains everything you’d ever need to update Windows.

