    ## 第 2 章：使用开始菜单


    许多人发现 Windows 10 的开始菜单非常令人困惑——这确实非常明显，尤其是在刚开始时。但别担心，在本章中，你将学会如何充分利用开始菜单——并确保它能满足你的需求！


    你可以通过以下方式使用开始菜单：


    - 点击开始菜单。它将出现在屏幕的左侧。

    - 点击“所有应用”。同样，这也会出现在屏幕的左侧。你将看到电脑上安装的所有应用程序列表。

    - 若要搜索应用程序或文件，在搜索框中输入你正在查找的内容，屏幕上就会弹出一个选项列表。

    - 电源按钮允许你进入休眠或关闭 Windows。它位于屏幕左侧的列。

    - 要锁定电脑，只需右键点击你的账户名称，然后就会看到以下选项：锁定、更改帐户图片、注销。选择“锁定”。

    - 你还可以在开始菜单上固定某些项目。要这样做，只需右键点击你想在开始菜单上显示的文件，然后点击“固定到开始”。

    - 要管理屏幕右侧的磁贴，只需右键点击磁贴，屏幕上就会弹出一个菜单。选择“从开始取消”、“调整大小”或“固定到任务栏”。还要检查是否有“卸载”选项——大多数应用程序都带有此选项。


    ### 同时使用开始菜单和开始屏幕


    如果你是一个多任务处理高手，并且想同时在开始屏幕和开始菜单上工作，你需要这样做：


    - 点击开始按钮，然后进入 设置 > 个性化。

    - 点击开始。

    - 选择“使用全屏开始”。

    - 点击“开始屏幕”使开始菜单消失。

    - 取消勾选“使用全屏开始”返回设置。


    然后，你还可以调整开始菜单的大小。要这样做，点击开始。


    将光标移动到开始菜单的顶部，然后向上拖动到该菜单的顶部。要减小高度，只需向下拖动光标。


    向右拖动光标可以增加宽度，向左拖动可以缩小。


    ## 自定义开始菜单


    请注意，你完全可以自定义屏幕显示的内容以及你希望电脑如何为你工作！


    若要在开始菜单和开始屏幕之间切换，请打开 设置 > 个性化 > 开始 > 开始行为 > 在桌面上使用全屏。


    要更改开始菜单、窗口边界和任务栏的颜色，进入 设置 > 个性化 > 颜色。如果你想要色彩鲜艳的电脑，只需勾选“在开始、任务栏和操作中心中显示颜色”，即可生效。


    若要自定义屏幕显示的内容，请进入 设置 > 个性化。在那里，你将看到来自微软的建议应用列表。另一个设置将显示你最近打开的程序的设置控制，最后一个是关于跳转列表项的。


    点击开始 > 选择文件夹，以选择你想在屏幕上看到的文件夹。


    再次点击开始，查看你是否拥有了所有需要的文件夹和文件。


    ## 秘密菜单


    还有一个所谓的“秘密”开始菜单，你也可以使用并自定义它。以下是访问它的方法：


    - 右键点击开始图标。

    - 你将看到一个弹出的菜单，其中包含了你可以在电脑上进行几乎所有操作！

    - 如果使用触摸屏，按住按钮至少 5 到 10 秒即可访问此菜单！


    ## 第 3 章：理解设置


    通过了解设置并知道如何使用它们，你将轻松地操作 Windows 10 并充分利用它！


    ### 账户


    你可以在  Charm栏（Charms bar）下找到“账户”选项卡，它基本上是关于你的 Windows 账户的。


    - 你的账户是你的主账户。

    - 你的账户设置允许你使用 Windows Hello 登录选项。

    - 工作或学校账户允许你同步你的设置。

    - 家庭和其他用户允许你添加其他用户。

    - 电子邮件和账户设置允许你选择你想要同步的文件夹和文件。


    ### 隐私


    在隐私，当然，你还可以通过以下设置来保护隐私。设置如下：


    - 通用：关于你是否允许应用程序访问位置。

    - 放大镜提供一个悬浮工具栏，还可以放大屏幕。

    - 高对比度允许你选择主题。

    - 字幕可以帮助你理解音频内容。

    - 位置

    - 麦克风允许你开启麦克风。

    - 语音、输入和活动设置是关于 Cortana（Windows 10 的数字助理）的。

    - 你的设置允许你同步其他设备。

    - 你的设置包含你同步设置选项。

    - 反馈：选择你希望每天、每周一次还是从不提供反馈。


    ### 设备


    “设备”选项卡提供了你感兴趣的设备。


    - 打印机和扫描仪允许你添加打印机。

    - 连接的设备是关于其他设备的。

    - 鼠标和触控板允许你配置键盘。

    - 自动播放允许你选择开启或关闭它。


    ### 辅助功能


    “辅助功能”选项卡包含以下设置：


    - 朗读器可以帮助你处理屏幕内容。它基本上会读取你输入的内容。


    ### 个性化


    此外，你还有机会个性化你的 Windows 体验。请注意，你会有更多机会自定义体验——但将在后面的章节介绍。这里是基础：


    - 背景主要是你的电脑壁纸，并可以选择你希望照片如何适应屏幕。

    - 颜色是用于桌面、任务栏等的颜色。

    - 锁屏是在电脑锁定时显示的内容。点击“图片”，你将看到最近使用的 5 张锁屏图片，以及一个用于从文件中选择图片的按钮。选择“幻灯片”可以让照片作为你的锁屏。你还可以选择屏幕超时时间和更多屏幕保护程序设置。

    - 主题将帮助你选择想要的主题。进入主题设置 > 相关设置进行操作。

    - 开始帮助你开启或关闭应用程序和通知以及更多。你将在下一章节学习这些。


    ## 更新和恢复


    当然，你还有“更新和恢复”选项卡，它的工作方式如下：


    - 激活是关于你使用的 Windows 版本，并提供了更改产品密钥的机会。

    - 高级选项将为你提供更多可供设置。

    - 备份提供了备份你设置的机会。

    - 点击“检查更新”可以手动检查更新。

    - 开发者选项是关于在 Windows 10 上制作应用程序和程序。

    - 恢复包含你可以修复电脑的选项，包括：重置此电脑、恢复到以前版本和高级启动。


    名为“Windows 更新”的选项卡包含了更新 Windows 所需的所有内容。


    '
