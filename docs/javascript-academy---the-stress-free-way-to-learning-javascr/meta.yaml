    # Arithmetic Operations


    This is what you do with numeric values. In general, arithmetic operations (e.g.
    addition, division, subtraction, etc.) use two numeric values to generate a new
    value. Here’s a sample arithmetic operation written in the JavaScript language:


    ```

    10 + 4 * 5

    ```


    The “*” and “+” signs are known as “operators.” The “+” represents addition while
    “*” represents multiplication. You can generate a numeric value by placing an
    operator between 2 numeric values. It is important to note that arithmetic operations
    in JavaScript follow operator precedence (also called order of operations). Here,
    you should perform operations in this order: parentheses, exponents, multiplications/divisions,
    and additions/subtractions. If you apply operator precedence in the example given
    above, 10 will be added to the product of 4 * 5.


    You can use parentheses to modify the order of operations. For example:


    ```

    (10 + 4) * 5

    ```


    In the JavaScript language, the “–” sign represents subtraction while “/” represents
    division. You don’t have to worry about operator precedence. If you aren’t sure,
