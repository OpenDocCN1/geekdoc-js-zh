  md: '# Integers


    All whole numbers are integers. Numbers that contain a decimal point are not whole
    numbers; therefore, 3 is a whole number while 3.0 is not. Integers in Python are
    characterized by the data type int.


    Take note that integers have capacity limitations. You will generate an error
    if you try to process a value beyond the allowed limits. Integers typically process
    numbers between -9,223,372,036.854 and 9,223,372,036.854.


    There are interesting features that come with the int variable. For instance,
    base 2 only uses 0 and 1, base 8 uses numbers from 0 to 7, base 10 has similar
    properties with the decimal system and base 16 uses the letters A to F and the
    numbers 0 to 9 digits.


    # Floating Point Values


    Any number that contains a decimal point is considered as a floating point value
    in Python. It does not matter if the number after the decimal point is 0 or not.
    3.0, 1.5, and 11.4, for example, are all floating point values. They are stored
    in the float data type. One huge advantage of floating point values over integers
    is that they have bigger storage spaces; hence, they are capable of storing very
    small or large values.


    Then again, you should not think that they have an unlimited storage space. There
    is still a limitation. Nevertheless, they can contain as little as ± 2.225073858502014
    × 10⁻³⁰⁸ and as much as 1.7976931348623157 ×1⁰³⁰⁸ There are a couple of ways to
    allocate values with the use of floating point values. First, you can directly
    assign them. Second, you can use a scientific notation. Keep in mind that negative
    exponents produce fraction equivalents.


    # Complex Numbers'
