    # Part 2: Second Week


    Now that you know the basics, it’s time to enjoy Windows 10 even more!


    # Chapter 5: Understanding the Features


    And of course, in order to make sure that you enjoy the various features of Windows
    10, it’s just right that you learn how to use its many features!


    Writing on Web Pages


    This is a fun feature of Windows 10! Basically, you can have a little fun by literally
    writing on web pages, with the help of Windows 10’s Microsoft Edge, a next-gen
    browser!


    To start “inking”, click on the icon that looks like pen and paper found on the
    upper right corner of the browser window.


    Once you have clicked that, the web page you’re browsing will refresh. You can
    then start using the tools you see onscreen to write or doodle on the said webpage!


    To type comments, you can use the text tool found on the toolbar mentioned earlier.


    You can declutter the page by clicking on the numbered pin and closing the text
    box.


    Click the trash icon to delete the text box, as well as the comment pin.


    You can also use the clipping tool to make crosshair out of your cursor.


    You can also erase line by line using the eraser tool. Just click, hold, and move
    over the lines you don’t want to see onscreen.


    To share or save what you have done, just click the save icon. Then, a pop-up
    menu will appear onscreen. This’ll ask you whether you want to add the project
    to your'
  - '[PAGE 158]


    reading list, save to OneNote, or add to your favorites. Just choose what you
    want to happen.


    # Managing Notifications


    Since Windows 10 proves to be the Operating System for the new age, you can expect
    it to give you real time notifications. In short, you’ll get notifications from
    Facebook, Twitter, Instagram, and any other apps you might be using—as long as
    they’re connected to your Microsoft account.


    To choose which notifications you’d like to have, go to Action Center > Show Notifications
    from These Apps. There, you’d see a list of the apps you have. Just choose what
    notifications you’d like to have and you’re all set!


    You can also choose which Quick Actions you’d like to have access to. To do this,
    go to Settings > System > Notifications and Actions > Choose Your Quick Actions.


    # Sharing Files Quickly


    Look for the file that you want to share.


    Click Sharing in the File Explorer.


    Click Share button.


    Choose the program you’d want to share the said file with.


    Configure options by going to Settings > System > Share Lab.


    # Setting Default Programs


    You can change default programs and protocols by following the instructions below:


    Open Settings > System > Default Apps.


    Change the programs you want to use for email, calendar, maps, web browser, video
    player, photo viewer, and the like.'
  - '[PAGE 159]


    To set individual file types, go to Settings > System > Choose Default Apps by
    File Type.


    To set defaults for protocols, go to Settings > System > Choose Default Apps by
    Protocol.


    To change default programs, just go to Settings > System > Set Defaults by App
    > Set Default Programs > Set Program as Default > Choose Defaults for this Program


    Exploring Photos App


    Take note that the Photos App now has two main features, and these are: Collections
    and Albums. Your photos are chronologically arranged by date in the Collections
    tab. Meanwhile, Albums contain albums that the app has created automatically for
    you.


    To add a folder, go to Settings > Sources > Add a Folder > Add this Folder to
    Pictures.


    To show photos and videos from OneDrive, just choose Settings > Show my Photos
    and Videos from OneDrive.


    To share pictures, just select the picture you want to share and click Share!


    You can also make use of Filters and other Editing Features, too!


