    to the desktop. Right-click and then choose Properties.


    Now, the Properties window will open onscreen. Look for the Shortcut tab and then
    choose Shortcut Key. Tap the key you''d want to be associated with the app (i.e.,
    CTRL + ALT + [chosen key]).


    Click Continue.


    You can now use your chosen shortcut to open this certain app!


    Command Prompt Shortcuts


    Go to Start Menu > All Apps > Windows System > Command Prompt.


