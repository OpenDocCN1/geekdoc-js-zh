    # The Logical Operators


    JavaScript supports these logical operators:


    Note: Let '' s assume that x = 5 and that y = 10.


    +   - "&&" – This is known as the Logical AND operator. If both operands are not
    equal to zero, the condition is true. For example: (x && y) is true.

    - "||" – This operator is called Logical OR. If at least one of the operands is
    not equal to zero, the condition is true. For example: (x || y) is true.

    - "!" – Programmers refer to this operator as Logical NOT. This operator reverses
    the result of the operator it is used on. For instance: (x && y) is false.'
