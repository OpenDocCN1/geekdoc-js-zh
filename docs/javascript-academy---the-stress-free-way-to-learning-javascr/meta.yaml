  mdcn: '

    在使用 JavaScript 时，你会遇到三个即使行为不像数字也被称为“数字”的值。这些特殊值是：Infinity、-Infinity 和 NaN。Infinity
    和 -Infinity 分别表示正无穷负无穷。通常情况下，你不应该信任基于无穷的计算。这些计算在数学上是不可靠的。


    另一方面，NaN 意味着“不是数字”（not a number）。当你执行产生不精确或无意义的算术运算时，就会得到这个特殊值。例如，如果你将零除以零（即 `0
    / 0`），你将得到 NaN。


    # 字符串


    你应该使用字符串来表示基于文本的信息。你应该使用引号（即单引号或双引号）来包裹你的字符串。查看以下示例：


    “五只小猴子”


    “我正在骑自行车”


    在创建字符串时，请确保你的引号保持一致。如果你使用双引号开始了一行，请务必使用相同的符号结束该行。


