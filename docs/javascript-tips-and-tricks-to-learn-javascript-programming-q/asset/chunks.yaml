    不要走捷径。虽然直接丢进预写好的代码看起来很容易，但如果你决定这样做，你只会是在伤害自己。这是因为你需要确保自己确实是在学习，而不仅仅是使用别人已经写好的代码。如果你抄了捷径或试图作弊，你将花费更长的时间才能学会你通过
    `JavaScript` 需要的知识。这样做会带来很多问题，而且你将无法尽可能地学习。


    如果你在寻找练习 `JavaScript` 的动力方面遇到困难，你只需要做的就是改变心态。想象一下，你刚刚学会了一些 `JavaScript` 却无法练习它或将其付诸实践。你可能很想能够使用它，对吧？保持这种心态。如果你只是想象自己无法练习它，你
    own 比完全有能力随地练习时更想去练习它。


    另一个你可以使用的心理技巧是尝试回想你第一次学习 `JavaScript` 时的感受。你当时充满了热情，想要想一直做下去。让你的大脑回到那个时刻，并为此感到兴奋。即使你必须再次假装自己很兴奋，也要假装直到你真的感到兴奋为止。这将给你一个机会，让你再次像一个拥有新玩具的孩子一样——渴望并准备好玩你所学到的
    `JavaScript`。


    执行这些心理技巧中的每一个不能保证你有更多时间练习，也不能保证你能更高效地练习，但它们将帮助你进入练习 `JavaScript` 的正确心态。如果你处于正确的心态，你更有可能在实际练习中成功，并在你学习时尝试编写的
    `JavaScript` 代码上取得进展。


    # 第 2 章：Facebook 与大白话


    现在你已经进入了可以练习的正确心态，你实际上需要开始练习了。即使你对这个过程充满热情，开始和产生动力可能是困难的部分之一。确保你已经在心理上做好了练习准备，然后开始使用这些技巧来完成练习。


    本章的第一部分将告诉该如何开始练习，以及你练习和学习你想要通过编写代码实现目标的最简单方法。


    ## Facebook


    当你有空闲，并且想什么都不做时，你很可能实际上是在看手机浏览 `Facebook` 或你其他喜欢的社交媒体。回想一下你开始浏览的时候。你是怎么做的？你是刻意说自己要坐在沙发上看几个小时
    `Facebook` 并反复刷新它吗？还是，你坐下来心里想，你只想看看某某人在做什么？如果是后者，请举手。现在，放下手，你看起来很傻。事实是，大多数人并没有刻意坐下来浪费
    4 或 5 小时浏览 `Facebook`，但大多数人人都这样做过。


    如果你上 `Facebook` 只是为了快速看一眼，很容易掉入不断刷新并获取所有朋友最新消息的旋涡中。如果你试图完成某些任务，这种旋涡可能是危险的。`Facebook`
    是对生产力最不利的事情之一，但有一种方法可以利用它来转化为你的优势。你可以利用 `Facebook` 旋涡来帮助自己开始练习 `JavaScript`。


    坐下来告诉自己，你只写一段代码或看一眼与你的 `JavaScript` 练习相关的内容。开始处理那件事。你很有可能会被某些其他代码分散注意力，并在完成你原本打算坐下来做的“仅仅一个”之后开始写另一段代码。你现在已经进入了旋涡，可以一次性工作几个小时，而完全没有想过它。你通过只完成一个微小任务欺骗了自己去练习
    `JavaScript`。


    显然，这并不是每次都灵灵。你做得越多，它不起作用的可能性就越高，所以确保只有在你真的找不到动力开始 `JavaScript` 练习时才使用它。你不会每次都掉进旋涡，但不要失望。那只意味着你现在真的不适合开始练习。休息一下，稍后回来练习，这样你就能确保自己确实处于开始练习的正确状态。


    通过利用 `Facebook` 旋涡，你为自己提供了又一种练习方式。你可能会发现，一旦你这样做，你就会不断回来尝试更多。你可以陷入练习 `JavaScript`
    的旋涡中，这并不是坏事。这正是你所希望的。你希望总是渴望练习，并在编写 `JavaScript` 代码的过程中随着所学的内容不断前进。确保你已经为这种情况的发生做好了准备，并设定了可以练习的时间。


    在开始阶段，从日程表中抽出时间可能不是最好的做法，所以确保你不要这样做。如果你为它留了时间，你可能在那个时间并没有练习，从而失去了你一天中的那块时间。你应该只在进入旋涡并且知道自己很喜欢练习后才这样做。你执行它的时间应该是一个其他干扰极少、且你可以清晰思考的时间。


    当你开始编写代码和学习 `JavaScript` 时，你可能不知道你的社交媒体习惯能帮助你学习更多，但你始终可以利用它来获得优势。一个可以迅速变成优势的一点是减少在社交媒体上的时间。几乎每个人都需要减少使用
    `Facebook` 或 Instagram 的时间，在那里保持高效是一个好主意。如果你处于练习旋涡中，你花花少的时间浏览 `Facebook`，花更多时间编写对以后有益的代码。


    现在你已经知道了开始练习的正确方法，请继续阅读如何以最高效的方式进行练习。


    ## 大白话


    当你和朋友聊天时，想要清楚地说出每个字，你不会在开始说话前停顿，对吧？当你编写代码时也不应该这样做。你应该确保开始时使用大白话，然后利用你对 `JavaScript`
    的知识将其以正确的方式编码。

