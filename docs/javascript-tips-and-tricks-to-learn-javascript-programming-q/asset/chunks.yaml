- fmt: '

    While you probably won’t be writing a 10 page paper on why George Washington had
    wooden teeth like you would be if you were in a high school or college course,
    you would still be writing about what you want to do. Start out by writing what
    the web page is going to be, what it is going to include, what it is going to
    look like and the specific details of it. This will give you the chance to write
    down everything that you are thinking about the web page.


    Once you have all of this information written down, you can begin to write information
    about the content on the page. Is it going to be a blog page? A question area?
    A quiz site? Will it be something that tells people about you? Or, will it be
    a navigation page? All of these can be done using your coding languages, and `JavaScript`
    so makes sure that you know what you want to write. Write it down in plain language
    in the same place that you wrote down the information on what the page would look
    like.


    As you get more experienced with writing `JavaScript`, you may find that you are
    actually putting codes right into the plain writing that you were supposed to
    be doing. That is acceptable to do as long as the codes flow out of your thoughts
    and you don’t have to look them up. If you find that you are pausing your writing
    to look up codes, it is time to get back to writing in plain language only so
    that you are not wasting time with the rough draft of the codes that you are going
    to do.


    Even experienced developers will use this tip so that they can get accustomed
    to the way that very complicated codes will look. It can be hard to write out
    complicated codes so make sure that you are able to write them in plain language
    first. You will have a better understanding of what you are doing with the code
    and what you want to do with it later on if you are able to write it in plain
    language first. Always make sure that you do this if you know that you will be
    writing a complicated code so that you can get rid of the flaws and the errors
    before you even go back to check it for errors.


    There are many different things that you can do to practice but putting each of
    these principals into your practice will allow you the chance to make sure that
    you are making all of the right decisions when it comes to your `JavaScript` learning
    process. Always make sure that you practice as much as you possibly can and that
    you learn as much as possible before you try to practice. There is an old saying
    that practice makes perfect and that absolutely applies to learning `JavaScript`
    and what it can do for you.


    When you’re practicing, make sure that you always remember what you wanted to
    do when you first started out. Doing so will keep you humble and give you the
    required motivation that you need to always keep learning more.


    ## Chapter 3: Thinking Slowly and Staying Humble


    Writing code can go quickly especially when you know what you are doing and when
    you have a lot of experience with the codes that you are writing in your `JavaScript`
    strings. You may go quickly, and that can cause you to make mistakes. This is
    especially true if you are becoming very experienced with `JavaScript` and if
    you feel like you are going to be able to do more with it. You may also find that,
    when you get better at writing code, you get very confident with everything that
    you are doing. It is not a terrible thing to have confidence, but it can lead
    to you missing out on some of the things that you could have created errors with.
    To make sure that you are doing the best job with your code, even when you’re
    practicing, you should make sure that you think as slowly as possible and that
    you don’t get overly confident in your abilities.


    ### Slowing Down


    As you write the codes that you are thinking about, make sure that you go as slow
    as possible. It may take more time this way initially, but it will save you a
    lot of time when it comes to going back and looking at the different things that
    you may have to do with the errors that you have made. By going slowly, you will
    be less likely to create errors.


    Even as you are looking back at your code and going through each of the lines
    of `JavaScript`, look at it slowly. Read each and every letter and symbol so that
    you will know what you are talking about and so you will be able to see if you
    missed anything. This is like proofreading it the way that you might have done
    in high school or college when you wrote a paper. Slow down to proofread the work
    that you wrote and the codes that you did line by line. This slow pace will help
    you catch any mistakes that you may have made.


    It is also worth noting that going slower will help you avoid any major errors
    in the work. If you are moving at a slower pace, you will be more aware of each
    keystroke and each thing that you put into all of your lines of code. The slow
    pace will not only help you when you are looking back at what you wrote down but
    also at what you were doing when you were writing it. Make sure that you are prepared
    to go as slow as possible and that you don’t rush your work.


    ### Taking a Break


    It is always beneficial for you to take a break from the work that you are doing.
    After looking at lines of code for hours on end, your eyes will not only be tired,
    but your mind will begin to get weary, too. A break will help you to refresh what
    you are doing and allow you the chance to come back and start over with a blank
    canvas in your mind. There are many benefits to having a fresh mind when you are
    writing code and breaks will give you the perfect refresher.


    In general, for every hour that you work on code, you should take 5-10 minutes
    to look away from the computer, get up and walk around and do something that does
    not involve anything with `JavaScript`. It is a good idea to take this time to
    step outside and get some fresh air or to simply just walk around getting a bit
    of exercise. Doing both of these activities will help get the blood flowing and
    will give you the oxygen that you need in your brain to help it work more efficiently
    when you decide to go sit back and start working again.


    A word of caution: try to stay off of your cell phone during the time that you
    are taking a break from your computer screen. While much smaller, the screen on
    your cell phone emits the same blue light that can be detrimental from your computer
    screen. Set aside specific time for using your cell phone while you are working
    so that you don’t have to use up your break time to chat with your friends or
    check your non-business emails. It is a good idea to just keep the cell phone
    out of reach when you are taking a break.


    ### Working Through It


    Once you have written the code that you want to write, you need to make sure that
    you are working your way through it. Do this as slowly as you did the writing
    process so that you will be able to catch any mistakes that you have made. You
    should do this after you have written your final line of code and before you take
    the chance to check it out by testing it for different things. It is always a
    good idea to make sure that you are going slowly and looking at each line of code.


    One way that you can be sure that you are looking at every character of code that
    you have written is to read it out loud. Say each of the letters, numbers and
    characters to yourself so that you will be able to make sure that they are written
    the right way. It is always a good idea to read it out loud because reading it
    out loud will show you what you have actually written. It will take more time
    for you to read it out loud than it would to just read it in your head. There
    are many things that you may miss if you are reading it in your head.

