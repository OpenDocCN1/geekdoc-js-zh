    ## 引言

    恭喜你下载本书，感谢你的支持。


    接下来的章节将讨论帮助你更快、更高效学习 JavaScript 的最佳技巧和方法。


    市场上上有许多关于此主题的书，再次感谢你选择这一本！我们尽全力确保它包含尽可能有用的信息，请尽情享受！


    ## 第一章：路线图与实践

    在阅读本书的过程中，你会发现它分为两个主要部分：学习编码的技巧与方法，以及将你学到的编码知识应用于实际编写 JavaScript 的技巧与方法。通过这种划分，你将能够学习更多并开始更高效地编码。在书的最后三章中，你将学习已经设计好并准备给你使用的编码技巧、快捷键和模板。请确保你知道在哪里找到这些内容以供参考，之后考虑使用我们在上一本书中提到的笔记本或文档，这样你就能随时知道信息在哪里。


    在书的第一部分第一章中，我们将讨论你的路线图以及你可以采取的实践。如果你想确保从 JavaScript 体验中获得最大收益并尽可能学习，这些是你需要遵循的重要步骤。


    ### 你的路线图

    如果你想去一个从未去过的地方，你就必须使用路线图才能到达。实际上，你可能会使用安装在手机和汽车上的 GPS，但 GPS 是取代了路线图的，如果没有路线图，它们是不可能的。为了到达你想达到的
    JavaScript 目标，你需要使用路线图。这并不意味着你要旅行或必须去某个特定的地方，它仅意味着你将找到学习 JavaScript 的最佳行动方案。


    如果你想学习 JavaScript 以便编写网站甚至成为前端开发人员，在进入 JavaScript 部分之前，你将需要几个步骤。如果你只是想学习它来完成任务或教别人如何做，请考虑简单地接触路线图中包含的每个步骤。


    你至少需要学习基础的 `HTML`。你不需要成为它的专家，如果你以后要用 JavaScript，也完全不需要使用唯一的 `HTML`，但学习它是有的，这样你可以利用所学的
    `JavaScript` 和 `HTML` 结合创建一个完整的网页。了解这些将为你你的网站提供所需的基础，并帮助你在进行网站 JavaScript 部分时做出一些更大、更重要的决定。


    学习 `HTML` 之后，你还需要学习一些关于 `CSS` 内容。这是大多数网站使用的语言，同时学习这两者将确保你能够以正确的方式进行编码并使用你所学的 `JavaScript`。`CSS`
    比 `HTML` 和 `JavaScript` 都复杂得多，所以你可能只想了解表面。如果你计划成为一名开发人员，你最终需要学习 `CSS` 和 `HTML`
    的所有方面，但如果你只想学习它来为 `JavaScript` 做准备，就不需要钻得太深。


    学习这两种语言后，你就可以创建一个功能完整的网站。你只需要使用它们来制作网站即可。不过，你也可以为其添加一些 `JavaScript`。这就是你学习 `HTML`
    和 `CSS` 的原因，对吧？你的 `JavaScript` 将完美融入你通过 `HTML` 和 `CSS` 完成的代码中。请确保在遇到问题时，检查你的 `JavaScript`、`HTML`
    和 `CSS` 是否有错误。


    每个人的路线图看起来都会不同。你应该确保为你自己创建的路线图是量身定制的。例如，你可能不需要担心 `HTML` 或 `CSS`，因为那是你已经熟悉的内容。你可能还需要了解由于你编写代码的方式而可能产生的不同事物，因为你是
    `Jquery` 的专家。编写代码和开发网站有许多不同的方面，找出哪些适合你，并在开始编写代码时将其付诸实践。


    ### 高效实践

    当你做出学习 JavaScript 的决定时，你可能对它非常兴奋，迫不及待开始编写自己的代码并创建自己的网站。随着时间的推移，这种兴奋可能会消退，特别是当你发现学习编写
    `JavaScript` 需要大量的实践和步骤时。这可能会令人沮丧，但有一些方法可以帮助实践再次变得有趣。这些只是你在练习 `JavaScript` 时可以使用的一些简单心理技巧。（额外奖励：你实际上在练习任何想要学习的内容时都可以使用这些技巧）。


