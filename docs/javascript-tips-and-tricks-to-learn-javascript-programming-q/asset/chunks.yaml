- fmt: '

    Don’t take shortcuts. It may seem easy to just throw in prewritten codes, but
    you will only be hurting yourself if you make the decision to do this. This is
    because you need to make sure that you are actually learning instead of just using
    what other people have already written in the code. If you take a shortcut or
    try to cheat, it will take you a much longer time to be able to learn what you
    need to with `JavaScript`. There are many problems that can come with doing this
    and you will not be able to learn as much as possible.


    If you are having trouble getting motivated to practice your `JavaScript`, all
    you need to do is change your mindset. Imagine you had just learned some `JavaScript`
    but that you are not able to practice it or put it into use. You’ll probably really
    want to be able to use it, right? Keep that mindset up. If you just imagine that
    you are not able to practice it, you will want to practice it even more than if
    you have the full ability to practice it any time that you want.


    Another mind trick that you can use is trying to remember how you first felt when
    you learned about `JavaScript`. You were enthusiastic, and you wanted to do it
    all of the time. Bring your mind back to that time and get excited about it. Even
    if you have to pretend that you are excited about it again, fake it until you
    are actually excited about it. This will give you the chance to become like a
    child with a brand new toy again- eager and ready to play with the `JavaScript`
    that you have learned about.


    Doing each of these mind tricks will not guarantee that you have more time to
    practice or that you can practice more efficiently, but they will help you to
    get in the right mindset to practice your `JavaScript`. If you are in the right
    mindset, you will be more likely to be successful at actually practicing and with
    the `JavaScript` codes that you are trying to write as you learn them.


    # Chapter 2: Facebook and the Plain Language


    Now that you are in the right mindset to be able to practice, you need to actually
    begin to practice. Getting started and motivated can be one of the hardest parts
    even if you are truly enthusiastic about the process. Make sure that you are prepared
    mentally for practice and then begin to use these tips for getting the practice
    done.


    The first part of this chapter will tell you how to start practicing and the easiest
    way for you to practice and to learn what you want to do with the codes that you
    are going to write.


    ## Facebook


    When you have free time, and you want to just do nothing, it is likely that you
    are actually looking at your phone and browsing through `Facebook` or your other
    favorite social media. Think back to when you started browsing. How did you do
    it? Did you intentionally say that you were going to sit on the couch and look
    at `Facebook` for hours refreshing it over and over? Or, did you sit down and
    think to yourself that you would just check on so and so to see what he or she
    is up to? Raise your hand if the second one is you. Now, put your hand down, you
    look silly. The truth, though, is that most people do not intentionally sit down
    to waste 4 or 5 hours browsing through `Facebook`, but most people have done it.


    If you get on `Facebook` just to look real quick, it is easy to fall down into
    the spiral of constantly refreshing and getting the latest news from all of your
    friends. This spiral can be dangerous if you are trying to get things done. `Facebook`
    is one of the worst things that can happen to productivity but there is a way
    that you can use this to your advantage. You can use the `Facebook` spiral to
    be able to help you start practicing your `JavaScript`.


    Sit down and tell yourself that you are only going to do one code or look at one
    thing that is related to your `JavaScript` practice. Start working on that one
    thing. The chances are that you will get distracted by some other code and will
    begin working on it when you are finished with the “just one” that you were going
    to sit down to do. You have now entered into the spiral and can continue working
    for hours at a time without ever even thinking about it. You’ve tricked yourself
    into practicing your `JavaScript` by just doing one little task.


    Obviously, this is not going to work every time that you do it. The more that
    you do it, the higher the chance of it not working for you so make sure that you
    only use it if you really cannot get motivated to start working on the `JavaScript`
    practice. You won’t fall into the spiral every time but don’t get disappointed.
    That only means that you really aren’t meant to start practicing right then. Take
    a break and come back to that practice later on so that you can be sure that you
    are truly in the right frame of mind to start practicing.


    By using the `Facebook` spiral, you are giving yourself one more way that you
    will be able to practice. You may find that once you have done that, you keep
    coming back for more. You can get stuck in the spiral of practicing your `JavaScript`
    which is not a bad thing. This is what you want. You want to always be eager to
    practice and to move forward with what you have learned while doing your `JavaScript`
