    如果你使用了错误的代码，就会面临破坏你在代码中编写的其他字符串的风险。这可能导致你无法继续处理页面的其余部分，并让你在实际改进时变得更加困难。开头可能存在一个容易修复的问题，但如果它一直留在那里，即使是其余代码看起来也不对，你的页面也将无法按照你完成后预期的样子呈现。


    ## 额外字符


    在编写代码时，你可能会发现代码中不小心混入了一些字母，这些字母可能会导致代码发生变化。这是一个问题，因为你需要确保充分利用代码的作用，而代码中额外的字符会改变整体的逻辑链条。除非你希望在代码之外出现额外的字符，否则你需要检查并再检查，确保你没有混入任何额外内容。


    你还应该确保你编写的代码中没有无关字符。这可以是任何内容，从一个多余的逗号到整段完全不需要的单词字符串。


    ## 缺失字符


    你始终需要在文本字符串后加上一个分号。这一点无论怎么强调都不为过，它是确保你每次都以正确的方式完成正确代码至关重要。即使你认为不需要分号，在那里加一个分号也是好主意。缺失分号会对代码的呈现方式产生严重影响，并可能导致你的页面看起来是不完全的。因此，你需要确保在每次更改文本字符串时都写上分号。


    此外，确保包含所有必要的括号和大大括号也很重要，这样你的代码才能保持良好的组织结构。如果你想用圆括号代替括号，你应该确保它们的方向正确，并放置在正确的位置，以便它们能够支撑起代码。


    ## 错误位置


    如果你想确保网页尽可能美观，那么将部分代码放在错误的位置可能会是一个大问题。你应该确保信息被包含在正确的位置，无论是在顶部还是底部。通常，加载时间较长的内容应该放在底部，而你需要在页面上首先显示的内容应该放在靠后的位置。所有信息应该包含在
    `<script>` 标签内，并应该放在一个中心位置。


    如果你未能将信息包含在 `<script>` 标签中，可能需要另一个标签，或者一个与初始标签结合使用的标签。你还应该确保你的方法正确，并且你想要包含的所有信息都已包含在内。标签之外的代码将独立显示，在网页上显得格格不入。它不会被格式化，也不会与页面上的其他信息相融合。


    ## 格式错误


    格式在 JavaScript 中至关重要。因为这是一门主要用于格式化的语言，所以你在编写网页代码时，需要确保这是你工作的重点。无论遇到什么种类型的错误，始终检查格式都是一个好主意。JavaScript
    的格式以及文本格式，当你测试页面以查看是否有何问题（如果有问题的话）时，都可能是问题的根源。


    有些东西与不同类型的代码是不兼容的。还有有些东西无论你如何努力让它们结合，都无法运行。例如，你无法创建一个既是粗体又格式化为加粗的字体。那样太极端了，字体将因为太粗而无法阅读。这种错误可能表现为仅显示为纯文本，或者根本不显示。确保所有的格式化都正确完成，你就能在你创建的网页上准确地显示你想要的内容。


    ## 结论


    感谢你读到这本书的最后，希望它提供了丰富的信息，并能够为你实现目标（无论目标是什么）提供所需的所有工具。


    下一步是阅读系列中的下一本书，书中包含了简单的 JavaScript 策略。一旦你完成了这一点，你就已经在编程的道路上了，并开始开始使用 JavaScript
    编写。


    最后，如果你觉得这本书在任何方面都有帮助，非常感谢你在 Amazon 上给出评价！


