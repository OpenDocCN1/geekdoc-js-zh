    While it may seem complicated to have to read each and every line of code that
    you have written out loud, you should still try to do so. Doing this will give
    you the chance to see what you may have missed. If you are good at reading and
    you make sure that you are not making any mistakes, you will be able to do this
    efficiently, and it will not waste a lot of time. It will actually take less time
    than needing to go back to fix all of your errors.


    # Leveling Confidence


    While you may not come across this problem when you are first getting started
    or while you are learning code, confidence can be a big problem for those who
    write `JavaScript`. You think that you know enough about it and you, essentially,
    let your guard down when you are writing it. This is a problem because you will
    not be as quick to catch mistakes when you are writing the code, and you may think
    that you have not done anything wrong with the code that you wrote.


    It is important to make sure that you keep your confidence in check. Even if you
    feel that you are very good at writing code and that you will never make a mistake,
    the chances of you making a mistake are still very high. It can happen to anyone
    at any time while they are writing any type of line of code. Make sure that you
    know what you are doing and that you do not get narcissistic about the skills
    that you have. There is always something more that you can learn when it comes
    to coding, and nobody knows all of it.


    Your confidence can even trick you into forgetting things that you have learned
    about code. Confidence tells you that you know what you are doing and that you
    know the best way to be able to write code. It tells you that there is nothing
    wrong with writing the same things over and over for each line of code but it
    also tells you that you don’t need to try harder with different options for codes
    that you write. Make sure that you are confident with your skills but that you
    don’t let that confidence get too high to where it obstructs your view of success.


    # Distrusting Yourself


    Don’t trust yourself. Your mind will try to tell you that you are not making mistakes
    and that you have not missed anything when you are looking over the code that
    you wrote but the chances are that you have actually missed some different lines
    and that you have made some mistakes. Be sure that you always question whether
    or not you are doing the best coding job possible so that you will be able to
    write the exact code that you are hoping for. Don’t trust yourself to do it but
    always check whether or not you are doing the right thing.


    A good way to do this is to take a break in between writing and checking the code.
    Make sure that the break is long enough that you will be able to truly refresh
    your mind. Make it like one of your refresher breaks but take an even longer amount
    of time so that you will truly be able to come back with a clean slate when you
    start to test it and look at the code. If you are staring at the same 100 lines
    of code for 5 hours and then try to edit them, you will have a difficult time
    picking out the mistakes that you have made.


    All of the tips that were in the chapters of the first part of this book involve
    practicing and learning what you can do while you are practicing. They are essentially
    minding tricks that you can use to make your coding practice go better. For the
    rest of the book, you will learn how to apply each of these when you start to
    code. The real fun comes when you learn the best codes to be able to use right
    here in the second part of this book.


    # Chapter 4: The Basics


    You have to learn the basics of `JavaScript` before you are able to truly take
    part in the most advanced parts of `JavaScript`. It is important that you learn
    the basics so that when you begin to do more with it, you will have a strong foundation.
    Learning a few of these basic tips to add to your `JavaScript` repertoire will
    help you to have the best chance possible at succeeding with `JavaScript` and
    writing code in a way that you can truly make great websites and options on your
    websites.


    ## List of Variables


    There is a good chance that you will, at some point, need to list variables when
    you are writing your `JavaScript` code. After learning `JavaScript`, it would
    seem like it would be a good idea to list each of them under a variable tag, for
    example:


    ```

    var one thing = ‘a list’;

    var differentthing = ‘different list’;

    var otherdifferentthing = ‘other different list’;

    ```


    Each of these is a different line of code, and they are separate. Instead of doing
    this, you can make your code look better and cleaner by doing this:


    ```

    var onething = ‘a list’,

    var differentthing = ‘different list’,

    var other differentthing = ‘other different list’;

    ```


    Notice that in each of the top ones there is a semicolon after each of the variables.
    In the bottom, there is an indentation before the second and third variables.
    This indicates that there is a new variable. There is also a comma after the first
    and the second indicating that it is still a list but also that it must be separated.
    The semicolon is used only at the end of each of the things listed instead of
    in between each of the variables.


    This is a good idea to use, not because it brings any more speed to the page than
    doing the typical semicolon would but that it makes the code look nicer. It is
    easier to read when you are looking at it, and it will be much easier for you
    if you need to come back and edit it so that you can make changes. You will not
    have to sift through lines and lines of variables because they will all be in
    one place.


    ## The Semicolon Dilemma


    With modern browsers, `JavaScript` does not necessarily need to have semicolons
    in between the strings of text because the browsers are able to just pick up on
    a strong of text. The problem with that is that they are not foolproof and browsers
    will commonly pick up on the wrong string. This can destroy the whole code and
    can leave you looking unprofessional whether you are working as a developer, a
    teacher or just someone who works on their own pages. No matter what you do, do
    not create a string like this:


    ```

    var youritem = “this string

    function doit () {

    return ‘it’

    }

    ```


    There are no semicolons in this, and you cannot find the errors that are in it
    because there are no semicolons. The systems that are unable to pick up the strings
    will leave your web page appearing as if it just coded and that can make you look
    terrible. It is a good idea to always separate with semicolons, like this:


    ```

    var youritem = ‘this string’ ;

    function doit () {

    return ‘it’ ;

    ```


    The semicolon is the beginning of your string and the end of your string. It tells
    the browser where it should stop reading at and where it can pick up new information
    at. By making sure that you have the semicolons in place, you will be able to
    tell it where it needs to stop.


    If you are using some type of testing software or even software that allows you
    to write in plain text, you should change the settings. You can choose the setting
    that allows the program the ability to make sure that semicolons are not in front
    of and behind strings. The system can pick up where the semicolons need to be
    and can tell you what you need to change the string and adding semicolons to it.


    ## Make Notes


    If you have read any of the previous work or the previous books that are in this
    series, you will know that it is important to make a note of the different codes
    that you create and what they do in the document that you keep for reference when
    you are coding but it is also important to write down in the code. Doing this
    will give you a chance to skim easily through your code so that you can find what
    you did and the difference that it made. If you need to fix something specific,
    like the way that the website times up, you can always go back and find the code
    where you made a comment about it.

