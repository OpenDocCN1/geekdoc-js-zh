  trans: "\n\n可以将此代码添加到你的代码行中，这样人们就能一直知道自己处于一个合法的网站上。当有人访问你的网站时，不会弹出任何内容，他们甚至无法知道你已经在网站中编写了这种类型的代码。除非你的网站被他人克隆了，否则他们什么也看不见。服务器地址和\
    \ `URL` 必须完全匹配，才能被正确使用。你可以采取许多不同的方法来确保你的网站受到保护，但这是你可以编写的最简单的代码之一，而且你的访客甚至完全不会察觉到它的存在。\n\
    \n添加这段代码是一个好主意，因为这样你的访客将始终能够确信他们访问的是正确的网站。如果出于某种原因出现了警告信息，你应该让访客知道他们实际上并不在你的网站上，并且面临着被黑客或在线攻击者攻击的风险。他们应该知道，如果看到该消息，就需要离开浏览器或跳转到其他网站。\n\
    \n## 简单章节 (Simple Sections)\n\n你可以通过一行代码在网页上创建一个与其他部分隔离开的章节。它实际上由几行不同的代码组成，其中包含变量并可以更改网站上的显示方式，让你能够对其进行更多操作。模态框（modal）是一种让内容在网页上弹出的简单有效的方法，让人们能够看到你在做什么。编写方法如下：\n\
    \n```css\ndiv# easy modal {\n  width: 449 px\n  position: absolute; top: 28 px;\
    \ left: 150 px;\n  padding: 15 px;\n  border: sold 1px #000;\n  background: #fff;\n\
    \  -webkit-box-shadow: 0px 4 px 8 px rgba (0, 0, 0, 0.25);\n  -webskit-transition:\
    \ -opacity 0.25 ease-out;\n}\n\ndiv# simple modal.shown {\n```\n\n你可以更改各种属性，如边框的大小以及页面上不同定位的大小，但要确保它不会变得太大，或者不会完全覆盖你已经编写好的作为其一部分页面。\n\
    \n除了边框的大小、框的大小以及它所在的位置，你还可以更改颜色。你可以使用简单或高级的十六进制比例来选择颜色，但要确保模态框内的文字不会因为背景颜色而变得不可见。你还应该确保框的颜色与你已经在网页上使用的其他颜色协调。\n\
    \n## 对象属性 (Object Properties)\n\n有时你可能想让对象的所有属性都为人感知。这可能是因为你想展示可用的不同选项，或者你只是想让某物在许多其他相似物品中脱颖而出。当你这样做时，你可以确保自己以正确的方式处理对象，并可以确保人们在决定访问你的网页时能够看到不同的选项。如果你想让人们选择一个特定的对象，这样做是一个好主意。以下为对象编写属性迭代的代码：\n\
    \n```javascript\nfor (I = 4; i <thislist.length; i++) {\n  var thislist = thislist\
    \ [i];\n  //this list does it\n}\n```\n\n这不仅可以显示特定对象的自带属性，还包含了你在脚本注释中需要留下的说明。这样做将让你有机会引导你的网页访客选择你想要的对象，但也会向他们展示当他们选择访问你的页面时将要做。\n\
    \n选择其中一个能向他人展示你能做什么的属性高亮显示，将给你一个机会来确保你正在以正确的方式处理事务。它还将让人们在访问你的网站时看到可选的选项，并为他们提供做出良好选择所需的信息。这不一定能保证他们会做出选择，但可以引导他们做出那个选择。\n\
    \n## 用于其他网站 (For Other Sites)\n\n你不一定非要在自己的网站上工作才能使用 `JavaScript`。你可以使用 `JavaScript`\
    \ 编辑一个甚至不是你自己的网站，使其呈现出你想要的样子。这种方法非常简单，你会对结果感到满意，因为在编辑页面时，你可以受益于许多不同的选项。要编辑你当前所在的页面，你需要做的就是删除浏览器栏中的信息并插入：\n\
    \n```javascript\njavascript: document.body. contentEditable='true'; document .designMode='on';\
    \ void 0\n```\n\n它现在的运行方式与文字处理器或你可以使用的任何其他类型的编辑器完全相同，让它看起来和你想要的一样。除非你从服务器端使用这种技巧，否则在任何其他人的电脑上都不会以此方式显示；但如果你想为了自己的利益让某个网站呈现出特定的样子，它会非常有用。你能想象一下，如果\
    \ Google 上输入的是你的名字，而不是你所熟悉的“Google”标志，它会是什么样吗？\n\n在改变内容并使用 `JavaScript` 实现这一点方面，有很多选择。无论你是在使用自己的网页、他人的网页，还是只是在尝试这样做，你都能从\
    \ `JavaScript` 提供的一切功能中受益。当你学会了这些技巧时，可以对它们进行定制，使其以适合你的方式工作。只需确保你总是善意使用它们，而不是对其他开发者或喜欢电脑的人进行恶意行为。\n\
    \n"
