    Do not use the function that was listed after a comment. It is only a snippet
    of a line of code, and it will not be functional if you are trying to actually
    find a timer that will keep track of how long it takes your site to load. It is
    only being shown to reference where your comment needs to go.


    You can use the comment function on every line of code that you write. While it
    may seem redundant to do so at the beginning when you only have a few lines of
    code that you are writing, you will be glad that you did it when you have more
    codes written in because you will be able to make sure that you can find exactly
    what you are looking for in a sea of hundreds of codes.


    # Firebug Timer


    There are many instances that it would be a good idea for you to find out how
    long it is taking for your web page to load and how long it will be before you
    can get it to fully load. No matter what type of developer you are, you can benefit
    from learning the amount of time that it will take you to be able to load the
    page. You can then use this to make improvements to it. While this is not necessarily
    a code that you will write on your own, it is a template that was created by Firebug
    that you can use to find out how long it will take you to load:


    ```

    function time tracker (){


    console.time (“THE TIMER”);


    for (x=5000; x > 0; x ---) {}


    console.timeend (“THE TIMER”);


    }

    ```


    This is a code that is especially useful when you are getting started or if you
    are just trying to find out how long it will take your page to load.


    If you find out that it is taking a long time for the page to load, there are
    several different options that you have to make it go faster. You can change the
    code that you have written to make it more efficient by cutting out some of the
    things that you do not need. You can also take the time and move everything to
    the bottom of your page.


    ## To the Bottom


    When you make a move to the bottom of your page, your text and content will be
    able to load faster. While you do need to write in the important information on
    the top of the page, you can add things that you don’t necessarily need on the
    bottom of the page. This will ensure that you are able to let the page load.


    Since the page won’t be able to load until all of the necessary information is
    loaded onto it, you will still need to add the important parts to the top of your
    page so that they will load. The reason that it is acceptable to add less important
    information to the bottom is that it will take a shorter amount of time to load.
    The less there is at the top, the quicker your page will be able to load when
    you visit it.


    ## Eliminate the Language


    When JavaScript codes were first written, they had the “language” tag included
    in them. This was so that the browser would be able to identify the language of
    the code and pick up on it right away. Since most browsers are now intuitive and
    JavaScript is one of the most popular options for people to be able to use to
    code, the tag for the language of the code is not necessary anymore. In fact,
    using it is ancient and can actually slow down the system and make your page load
    much slower. A common code that you may have seen 20 years ago:


    ```

    <script type= “text/javascript” language=”javascript”> PUT ALL OF YOUR INFORMATION
    HERE</script>

    ```


    Since the language tag is redundant, you would just need to put:


    ```

    <script type= “text/javascript” PUT ALL OF YOUR INFORMATION HERE</script>

    ```


    This eliminates the language, allows you to have fewer lines of code that is included
    in your list and can actually improve the load speed of your web page. Removing
    the language tag will not only allow you to find the information that you need
    more easily, but it can also allow you the chance to have a faster web page when
    people visit it.


    There are many things that you can do with just some basic knowledge of JavaScript.
    It is a great way for you to get started and to practice it but using some of
    these simple tips will give you the chance to do more with what you have. Try
    out some of the tips that are included in this section when you are first getting
    started so that you will not have to worry about what you are going to do when
    it comes time to move onto the bigger and more involved tips for your JavaScript
    code.


    # Chapter 5: Cool JavaScript Tricks


    Writing JavaScript doesn’t have to be all about how to make radio buttons and
    popups for people to enjoy when they come to your web page. There are also some
    cool things that you can do with the JavaScript that will leave people wondering
    how you made your web page do that. This is a great way to make your site stand
    out among millions and to make a name for yourself. People love to see unusual
    things and all of these cool tricks will give you exactly that – something that
    is different and something that you can feel good about when you do it.


    ## Image Movement


    The images that are on your page are actually able to move. You don’t even need
    to use the extremely common GIF images to be able to do it (although, you can
    stick those into your code just like you would any other object). If you want
    to make static images begin to move and dance when someone enters your page or
    when they mouse over the images, all you need to do is put a few things into the
    code. The trick will allow all of the images that are on the page to dance in
    a circle with each other. To make your images dance:


    ```javascript

    R=0; x1=.1; y1=.05; x2=.25; y2=.24; x3=.6; y3=.24; x4=300; y4=200; x5=300; y5=200;
    DI=document.getElementsByTagName("img"); DIL=DI.length; function A(){for(i=0;
    i<DIL; i++){DIS=DI[i].style; DIS.position=''absolute''; DIS.left=(Math.sin(R*x1+i)*x2+x3)+"px";
    DIS.top=(Math.cos(R*y1+i)*y2+y4)+"px"}R++}setInterval(''A()'',5); void(0);

    ```


    Make sure that you put the exact copy into your text generator so that you will
    be able to make sure it is done the right way. It is a good idea to just copy
    and paste it, but if you are unable to do that, you need to write write down so
    that you will be able to get the most out of it.


    If you want to make the images dance in a different pattern, consider playing
    around with the bottom numbers. These are the direction that they dance in and
    it can be easily changed. To figure out which way will work best with your browser,
    you will need to make the necessary changes and then use those changes to be able
    to test it out to see which direction the images are moving in.


    ## Checking URLS


    It is not uncommon that you could be redirected to a website that is not what
    it is supposed to be. Hackers, scammers, and other malicious people could be trying
    to get you to go to a specific website for many different reasons. This could
    be so that they are able to take the different information that you could put
    into your browser thinking that you are on an actual website. Even though this
    code is not necessarily going to help your own web page, it will help to keep
    you from getting the malicious virus that could be detrimental to your computer.
    To use this code, you will need to put it into the control section of your browser.
    This will allow you the chance to see if a website is an actual website and if
    it actually matches up to what it is supposed to be a part of. Use:


    ```javascript

    alert("The actual URL is:\t\t" + location.protocol + "//" + location.hostname
    + "/" + "\nThe address URL is:\t\t" + location.href + "\n" + "\nIf server names
    do not match up. Beware of a spoof site that could be malicious or have some type
    of intent to harm your computer.");

    ```

