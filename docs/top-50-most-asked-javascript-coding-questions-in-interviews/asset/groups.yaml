- md: "\n## Top 50 Most Asked Javascript Coding Questions in Interviews\n\n```javascript\n\
    const personB = {\n  firstName: \"Bob\",\n  lastName: \"Smith\",\n};\n\n// Using\
    \ call\nconsole.log(personA.getFullName.call(personB, \"Los Angeles\", \"USA\"\
    ));\n\n// Using apply\nconsole.log(personA.getFullName.apply(personB, [\"Los Angeles\"\
    , \"USA\"]));\n\n// Using bind\nconst boundGetFullName = personA.getFullName.bind(personB,\
    \ \"Los Angeles\", \"USA\");\nconsole.log(boundGetFullName());\n```\n\n**Output**:\n\
    `Bob Smith Los Angeles USA`\n`Bob Smith Los Angeles USA`\n`Bob Smith Los Angeles\
    \ USA`\n\n**Time Complexity**: *O(1)*. The operations are constant time as they\
    \ involve context switching and argument passing, which are not dependent on input\
    \ size.\n\n**Explanation**:\n1. **call Method**: Calls the `getFullName` method\
    \ of `personA` with `this` set to `personB`, and individual arguments for city\
    \ and country.\n2. **apply Method**: Similar to `call`, but arguments are provided\
    \ as an array.\n3. **bind Method**: Creates a new function where `this` is bound\
    \ to `personB` with predefined arguments. The new function is then called.\n\n\
    ## Q-49 Write a JS Program to Explain Higher-Order Functions in JavaScript.\n\n\
    Approach:-\n1. **Function as an Argument**\n\n```javascript\n// Function to double\
    \ a number\nfunction double(num) {\n  return num * 2;\n}\n\n// Higher-order function\
    \ that applies a function to each element in an array\nfunction applyFunction(arr,\
    \ func) {\n  return arr.map(func);\n}\n\nconst numbers = [2, 4, 6, 7, 8];\nconst\
    \ doubledNumbers = applyFunction(numbers, double);\nconsole.log(doubledNumbers);\n\
    ```\n\n**Output**: `[4, 8, 12, 14, 16]`\n\n**Time Complexity**: *O(n)*, where\
    \ *n* is the number of elements in the array. The function applies the `double`\
    \ function to each element.\n\n**Explanation**:\n- **double(num)**: A simple function\
    \ that doubles its input.\n- **applyFunction(arr, func)**: A higher-order function\
    \ that takes an array and a function as arguments, and applies the function to\
    \ each element of the array using `map`.\n\n2. **Function Returning Another Function**\n\
    \n```javascript\n// Function that returns another function to add a number to\
    \ its argument\nfunction adder(x) {\n  return function(y) {\n    return x + y;\n\
    \  };\n}\n\nconst add = adder(11);\nconsole.log(add(5));\n```\n\n**Output**: `16`\n\
    \n**Time Complexity**: *O(1)* for both creating and invoking the functions, as\
    \ they are simple operations with constant time complexity.\n\n**Explanation**:\n\
    - **adder(x)**: A function that returns another function. The returned function\
    \ takes one argument and adds it to the value `x`.\n- **add**: Created by calling\
    \ `adder(11)`, resulting in a function that adds 11 to its argument.\n\n## Q-50\
    \ Write a JS Program to Explain Closure with Example in JavaScript. (Most Asked)\n\
    \nApproach:-\n```javascript\nfunction multiplier(factor) {\n  // 'factor' is captured\
    \ by the inner function\n  return function(number) {\n    // Inner function multiplies\
    \ 'number' by the captured 'factor'\n    return factor * number;\n  };\n}\n\n\
    const triple = multiplier(3); // multiplier returns a function with factor set\
    \ to 3\nconsole.log(triple(7)); // Output: 21, the inner function multiplies 7\
    \ by 3\n```\n\n**Output**: `21`\n\n**Time Complexity**: *O(1)*, as the operation\
    \ inside the inner function is constant time.\n\n**Explanation**: This example\
    \ demonstrates how closures work in JavaScript. The inner function has access\
    \ to the `factor` variable from its outer lexical scope, even after `multiplier`\
    \ has finished executing. When you call `triple(7)`, it multiplies `7` by `3`,\
    \ which was the captured value of `factor`.\n"
  mdcn: "\n\n## 面试中最常见的50道 JavaScript 编码题\n\n```javascript\nconst personB = {\n  firstName:\
    \ \"Bob\",\n  lastName: \"Smith\",\n};\n\n// Using call\nconsole.log(personA.getFullName.call(personB,\
    \ \"Los Angeles\", \"USA\"));\n\n// Using apply\nconsole.log(personA.getFullName.apply(personB,\
    \ [\"Los Angeles\", \"USA\"]));\n\n// Using bind\nconst boundGetFullName = personA.getFullName.bind(personB,\
    \ \"Los Angeles\", \"USA\");\nconsole.log(boundGetFullName());\n```\n\n**输出**:\n\
    `Bob Smith Los Angeles USA`\n`Bob Smith Los Angeles USA`\n`Bob Smith Los Angeles\
    \ USA`\n\n**时间复杂度**: *O(1)*。这些操作是常数时间，因为它们涉及上下文切换和参数传递，不依赖于输入规模的大小。\n\n**解释**:\n\
    1. **call 方法**：调用 `personA` 的 `getFullName` 方法，并将 `this` 设置为 `personB`，同时传入城市和国家的单独参数。\n\
    2. **apply 方法**：与 `call` 类似，但参数以数组的形式提供。\n3. **bind 方法**：创建一个新函数，其中 `this` 绑定到\
    \ `personB` 并带有预定义的参数。然后调用该新函数。\n\n## Q-49 编写一个 JS 程序解释 JavaScript 中的高阶函数。\n\n\
    方法:-\n1. **将函数作为参数**\n\n```javascript\n// 将数字翻倍的函数\nfunction double(num) {\n \
    \ return num * 2;\n}\n\n// 将函数应用到数组每个元素上的高阶函数\nfunction applyFunction(arr, func)\
    \ {\n  return arr.map(func);\n}\n\nconst numbers = [2, 4, 6, 7, 8];\nconst doubledNumbers\
    \ = applyFunction(numbers, double);\nconsole.log(doubledNumbers);\n```\n\n**输出**:\
    \ `[4, 8, 12, 14, 16]`\n\n**时间复杂度**: *O(n)*，其中 *n* 是数组中元素的数量。该函数对每个元素应用了 `double`\
    \ 函数。\n\n**解释**:\n- **double(num)**：一个简单的函数，将其输入值翻倍。\n- **applyFunction(arr, func)**：一个高阶函数，接收一个数组和一个函数作为参数，并使用\
    \ `map` 将函数应用到数组的每个元素上。\n\n2. **返回另一个函数**\n\n```javascript\n// 返回另一个函数以向其参数添加一个数字\n\
    function adder(x) {\n  return function(y) {\n    return x + y;\n  };\n}\n\nconst\
    \ add = adder(11);\nconsole.log(add(5));\n```\n\n**输出**: `16`\n\n**时间复杂度**: 创建和调用函数的时间均为\
    \ *O(1)*，因为它们是常数时间复杂度的简单操作。\n\n**解释**:\n- **adder(x)**：一个返回另一个函数的。返回的函数接收一个参数，并将其与值\
    \ `x` 相加。\n- **add**：通过调用 `adder(11)` 创建，结果是一个在其参数基础上加11的函数。\n\n## Q-50 编写一个 JS\
    \ 程序通过示例解释 JavaScript 中的闭包。（最常）\n\n方法:-\n```javascript\nfunction multiplier(factor)\
    \ {\n  // 'factor' 被内部函数捕获\n  return function(number) {\n    // 内部函数将 'number'\
    \ 乘以捕获的 'factor'\n    return factor * number;\n  };\n}\n\nconst triple = multiplier(3);\
    \ // multiplier 返回一个 factor 设置为 3 的函数\nconsole.log(triple(7)); // 输出: 21，内部函数将\
    \ 7 乘以 3\n```\n\n**输出**: `21`\n\n**时间复杂度**: *O(1)*，因为内部函数内部的操作是常数时间。\n\n**解释**:\
    \ 这个示例演示了 JavaScript 中闭包是如何工作的。内部函数可以访问其外部词法作用域中的 `factor` 变量，即使在 `multiplier`\
    \ 执行完毕后也是。当你调用 `triple(7)` 时，它将 `7` 乘以 `3`（即被捕获的 `factor` 值）。\n\n"
