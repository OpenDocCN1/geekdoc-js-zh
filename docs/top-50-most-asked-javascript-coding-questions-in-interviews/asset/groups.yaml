    \  }\n  }\n  return secondLargest;\n}\nconst result = secondLargestElement(arr);\n\
    console.log(result); // 输出: 8\n```\n\n**输出：** 数组 `[1, 2, 3, 4, 5, 6, 7, 8, 9]`\
    \ 中的第二大元素是 8。\n\n**时间复杂度：** O(n)\n\n**解释：** 该函数遍历数组一次，根据需要更新 `largest` 和 `secondLargest`\
    \ 变量。最终结果是第二大元素，该过程高效，时间复杂度为 O(n)。\n\n## Q-20 编写一个 JS 程序找到序列中的缺失数字。（最常问）\n\n方法\
    \ :-\n\n```javascript\nlet arr = [1, 2, 3, 5, 6]; // 缺少数字的序列\n// 找到序列中缺失数字的函数\n\
    function findMissingNumber(arr) {\n  let n = arr.length + 1; // 序列的长度\n  let totalSum\
    \ = (n * (n + 1)) / 2; // 前 n 个自然数的和\n  let arrSum = arr.reduce((acc, curr) =>\
    \ acc + curr, 0); // 数组元素之\n  return totalSum - arrSum; // 差值即为缺失数字\n}\nconst\
    \ result = findMissingNumber(arr);\nconsole.log(result); // 输出: 4\n```\n\n**输出：**\
    \ 序列中缺失的数字是 4。\n\n## Q-21 编写一个 JS 程序展平嵌套数组。\n\n方法 :-\n\n```javascript\nlet arr\
    \ = [[12, [4, 5]], [7, 9], 3];\n// 展平嵌套数组的函数\nfunction flattenArray(arr) {\n \
    \ return arr.reduce((preVal, currentVal) => {\n    // 如果当前值是数组，递归展平\n    if (Array.isArray(currentVal))\
    \ {\n      return preVal.concat(flattenArray(currentVal));\n    }\n    return\
    \ preVal.concat(currentVal);\n  }, []);\n}\n```\n\n"
