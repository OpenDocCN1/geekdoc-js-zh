    let str = \"hello\";\nfunction reverseStr(str) {\n  return str.split(\"\").reverse().join(\"\
    \");\n}\nlet result = reverseStr(str);\nconsole.log(result); // Output: \"olleh\"\
    \n```\n\n**Output:** The reversed string is printed as \"olleh\".\n\n**Time Complexity:**\
    \ *O(n)*\n\n**Explanation:** This program reverses a given string by iterating\
    \ through each character and adding it to the front of a new string. The time\
    \ complexity is (O(n)), where (n) is the length of the string.\n\n## Q-28 Write\
    \ a JS Program to Reverse the words in a string.\n\nApproach :-\n\n```javascript\n\
    let str = \"my name is rahul chaurasia\"; // String to reverse the words\n// Function\
    \ to reverse the words in a string\nfunction reverseWordsInString(str) {\n  let\
    \ words = str.split(\" \").reverse().join(\" \"); // Split, reverse, and join\
    \ the words\n  return words;\n}\nlet result = reverseWordsInString(str);\nconsole.log(result);\
    \ // Output: \"chaurasia rahul is name my\"\n```\n\n**Output:** The words in the\
    \ string \"my name is rahul chaurasia\" reversed are \"chaurasia rahul is name\
    \ my\".\n\n**Time Complexity:** *O(n)*\n\n**Explanation:** The function splits\
    \ the string into an array of words, reverses the array, and then joins the words\
    \ back into a string. The time complexity is *O(n)*, where n is the number of\
    \ characters in the string.\n\n## Q-29 Write a JS Program to find the Longest\
    \ word in the string.\n\nApproach :-\n\n```javascript\nlet str = \"My name is\
    \ Rahul Chaurasia\";\nlet words = str.split(\" \");\nfunction longestWord(words)\
    \ {\n  let longestWord = \"\";\n  for (let i = 0; i < words.length; i++) {\n \
    \   if (words[i].length > longestWord.length) {\n      longestWord = words[i];\n\
    \    }\n  }\n  return longestWord;\n}\nlet result = longestWord(words);\nconsole.log(result);\n\
    ```\n\n**Output:** The longest word is \"Chaurasia\".\n\n**Time Complexity:**\
    \ *O(n)*\n\n**Explanation:** This program finds the longest word in a given string\
    \ by splitting the string into individual words and then iterating through each\
    \ word to compare their lengths. The time complexity is O(n), where n is the number\
    \ of words in the string.\n\n## Q-30 Write a JS Program to check if a given string\
    \ is a palindrome or not. (Most Asked)\n\nApproach :-\n\n```javascript\nlet str\
    \ = \"racecar\";\n// Function to reverse the string\nfunction reverseStr(str)\
    \ {\n  return str.split(\"\").reverse().join(\"\");\n}\n// Function to check if\
    \ the string is a palindrome\nfunction isPalindrome(string) {\n  let reversedString\
    \ = reverseStr(string);\n  return reversedString === str ? true : false;\n}\n\
    let result = isPalindrome(str);\nconsole.log(result); // Output: true\n```\n\n\
    **Output:** The string is a palindrome: true.\n\n**Time Complexity:** *O(n)*\n\
    \n**Explanation:** This program checks if a given string is a palindrome by first\
    \ reversing the string and then comparing reversed string to original string.\
    \ If they are the same, the string is palindrome. The time complexity is O(n),\
    \ where n is the length of the string.\n\n## Q-31 Write a JS Program to check\
    \ if two given strings are anagrams or not. (Most Asked)\n\nApproach :-\n\n```javascript\n\
    let str1 = \"listen\";\nlet str2 = \"silent\";\n// Function to check if two strings\
    \ are anagrams\n// Sort and join characters of both strings\nfunction isAnagram(str1,\
    \ str2) {\n  const sortedArr1 = str1.split(\"\").sort().join(\"\");\n  const sortedArr2\
    \ = str2.split(\"\").sort().join(\"\");\n  // Compare sorted versions of the strings\n\
    \  return sortedArr1 === sortedArr2;\n}\nlet result = isAnagram(str1, str2);\n\
    console.log(result); // Output: true\n```\n\n**Output:** The strings are anagrams:\
    \ true.\n\n**Time Complexity:** *O(n log n)*\n\n**Explanation:** This program\
    \ checks if two strings are anagrams by sorting the characters of both strings\
    \ and then comparing them. If sorted strings are identical, the original strings\
    \ are anagrams. The time complexity is O(n log n) due to the sorting operation,\
    \ where n is the length of the strings.\n\n## Q-32 Write a JS program return First-Repeated\
    \ Character of a String.\n\nApproach:-\n\n```javascript\nlet str = \"algorithm\"\
    ; // String to check\n// Function to find first non-repeated character\nfunction\
    \ firstRepeatedCharacter(str) {\n  for (let i = 0; i < str.length; i++) {\n  \
    \  // Check if the character is non-repeated\n    if (str.indexOf(str[i]) ===\
    \ str.lastIndexOf(str[i])) {\n      return str[i];\n    }\n  }\n  return null;\
    \ // Return null if all characters are repeated\n}\nlet result = firstRepeatedCharacter(str);\n\
    console.log(result); // Output: \"g\"\n```\n\n**Output:** The first non-repeated\
    \ character in the string \"algorithm\" is \"g\".\n\n**Time Complexity:** *O(n^2)*\n\
    \n**Explanation:** The function uses `indexOf` and `lastIndexOf` to find characters\
    \ that appear once. The time complexity is O(n^2), where n is the length of the\
    \ string.\n\n## Q-33 Write a JS program Return number of vowels in a given String.\
    \ (Most Asked)\n\nApproach:-\n\n```javascript\nlet str = \"Rajat\"; // String\
    \ to check for vowels\n// Function to count the number of vowels in the given\
    \ string\nfunction countVowels(str) {\n  const vowels = [\"a\", \"e\", \"i\",\
    \ \"o\", \"u\"]; // Array of vowel characters\n  let count = 0; // Initialize\
    \ the vowel count\n  // Iterate through each character in the string\n  for (let\
    \ char of str.toLowerCase()) {\n    // Increment count if the character is a vowel\n\
    \    if (vowels.includes(char)) {\n      count++;\n    }\n  }\n  return count;\
    \ // Return the total count of vowels\n}\nconst result = countVowels(str);\nconsole.log(result);\
