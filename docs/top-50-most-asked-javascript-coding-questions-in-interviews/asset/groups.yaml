    `let key = "profession";`

    `let user = {`

    `  name: "Alice",`

    `  age: 28,`

    `  [key]: "Developer",`

    `  getDetails: function() {`

    `    return \`User: ${this.name}, Profession: ${this.profession}\`;;`

    `  },`

    `};`

    `console.log(user.getDetails());`


