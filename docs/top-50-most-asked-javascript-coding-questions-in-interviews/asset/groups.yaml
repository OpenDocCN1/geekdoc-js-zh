- md: "\n# Top 50 Most Asked Javascript Coding Questions in Interviews\n\n## About\
    \ Me\n**Rahul Chaurasia**\n**2 Year Experienced React Developer**\n**Master of\
    \ Computer Applications (MCA), NIT Raipur**\n\n**Connect with Me**\n- **Topmate:**\
    \ https://topmate.io/rahul_chaurasia12\n- **LinkedIn:** https://www.linkedin.com/in/rahul-chaurasia-997a56186/\n\
    \n## Section 1 - Numbers\n\n### Q-1 Write a JS Program to find Factorial of any\
    \ given number. (Most Asked)\nApproach :-\n```javascript\nlet number = 7; // Number\
    \ to find the factorial\n// Function to find the factorial of a given number\n\
    function findFactorial(num) {\n  // Factorial of 0 is defined as 1\n  if (num\
    \ === 0) {\n    return 1;\n  }\n  // Initialize factorial result as 1\n  let factorial\
    \ = 1;\n  // Calculate factorial by multiplying each integer up to num\n  for\
    \ (let i = 1; i <= num; i++) {\n    factorial *= i;\n  }\n  return factorial;\n\
    }\nconst result = findFactorial(number);\nconsole.log(result); // Output: 5040\n\
    ```\n**Output:** The factorial of 7 is 5040.\n**Time Complexity:** O(n)\n**Explanation:**\
    \ This program calculates the factorial of the number 7. The `findFactorial` function\
    \ starts by checking if the number is 0, returning 1 if true (since 0! = 1). For\
    \ numbers greater than 0, it initializes factorial to 1 and multiplies it by each\
    \ integer from 1 to 7. The final result, 5040, is the factorial of 7. The time\
    \ complexity is O(n), where n is the value of num as it involves multiplications.\n\
    \n### Q-2 Write a JS Program to check given number is prime or not. (Most Asked)\n\
    Approach :-\n```javascript\nlet number = 13; // Number to check for primality\n\
    // Function to check if a given number is prime\nfunction isPrime(num) {\n  //\
    \ Handle cases: 0, 1, and negative numbers are not prime\n  if (num <= 1) {\n\
    \    return false;\n  }\n  // Check divisibility from 2 to num/2\n  for (let i\
    \ = 2; i <= num/2; i++) {\n    if (num % i === 0) {\n      return false; // Not\
    \ prime if divisible by i\n    }\n  }\n  return true; // Return true if no divisors\
    \ are found\n}\nconst result = isPrime(number);\nconsole.log(result); // Output:\
    \ true (since 13 is a prime number)\n```\n**Output:** The output is true because\
    \ 13 is a prime number.\n**Time Complexity:** O(n)\n**Explanation:** The `isPrime`\
    \ function checks for divisibility from 2 to num/2. If a divisor is found, it\
    \ returns false. The approach determines the primality of a given number.\n\n\
    ### Q-3 Write a JS Program to reverse the digits of a given Number. (Most Asked)\n\
    Approach :-\n```javascript\nlet num = 34567; // Number to reverse\n// Function\
    \ to reverse the digits of a number\nfunction reverseDigits(num) {\n  let s =\
    \ num.toString(); // Convert the number to a string\n  return s.split(\"\").reverse().join(\"\
    \"); // Reverse the string and join it back\n}\nconst result = reverseDigits(num);\n\
    console.log(result); // Output: 76543\n```\n**Output:** The digits of the number\
    \ 34567 reversed are 76543.\n**Time Complexity:** O(n)\n**Explanation:** The function\
    \ converts the number to a string, reverses the string, and then joins the characters\
    \ back. The time complexity is O(n), where n is the number of digits in the number.\n\
    \n### Q-4 Write a JS Program to return Fibonacci Series of a given number. (Most\
    \ Asked)\nApproach :-\n```javascript\n// Function to generate the Fibonacci series\
    \ up to the n-th term\nfunction fibonacci(n) {\n  if (n === 0) {\n    return [0];\n\
    \  }\n  if (n === 1) {\n    return [0, 1];\n  }\n  let fib = [0, 1]; // Initialize\
    \ the series with the first two terms\n  for (let i = 2; i < n; i++) {\n    fib[i]\
    \ = fib[i-1] + fib[i-2]; // Compute the next term\n  }\n  return fib;\n}\nlet\
    \ n = 5; // Number of terms in the Fibonacci series\nconst result = fibonacci(n);\n\
    console.log(result); // Output: [0, 1, 1, 2, 3]\n```\n**Output:** The Fibonacci\
    \ series up to the 5th term is [0, 1, 1, 2, 3].\n**Time Complexity:** O(n)\n**Explanation:**\
    \ The function initializes the series with the first two terms and then iterates\
    \ to compute the next terms. The time complexity is O(n), where n is the number\
    \ of terms in the series.\n\n### Q-5 Write a JS Program to Swap Variables Without\
    \ a Third Variable. (Most Asked)\nApproach :-\n```javascript\nlet a = 10;\nlet\
    \ b = 6; // Function to swap two variables without a third variable\nfunction\
    \ swap(a, b) {\n  a = a + b;\n  b = a - b;\n  a = a - b;\n  console.log(a, b);\
    \ // Output: 6 10\n}\nswap(a, b);\n```\n\n## Section 2 - Arrays\n\n### Q-6 Write\
    \ a JS program to find Sum of all Elements in an Array. (Most Asked)\n```javascript\n\
    function sumArray(arr) {\n  return arr.reduce((sum, num) => sum + num, 0);\n}\n\
    const numbers = [10, 20, 30, 40, 50];\nconst total = sumArray(numbers);\nconsole.log(total);\
    \ // Output: 150\n```\nThe function uses the `reduce` method to iterate over the\
    \ array, adding each element to the accumulator starting with an initial value\
    \ of 0.\n\n### Q-7 Write a JS Program to perform Binary Search on a Sorted array.\
    \ (Most Asked)\nApproach :-\n```javascript\nlet arr = [1, 3, 7, 8, 9, 34, 56];\n\
    let k = 9; // The value to search for\n// Function to perform Binary Search\n\
    function binarySearch(arr, k) {\n  let start = 0;\n  let end = arr.length - 1;\n\
    \  while (start <= end) {\n    let mid = Math.floor((start + end) / 2);\n    //\
    \ If k is less than the middle element, search in the left half\n    if (k < arr[mid])\
    \ {\n      end = mid - 1;\n    }\n    // If k is greater than the middle element,\
    \ search in the right half\n    else if (k > arr[mid]) {\n      start = mid +\
    \ 1;\n    }\n    // If k is equal to the middle element, return the index\n  \
    \  else if (k === arr[mid]) {\n      return mid;\n    }\n  }\n  return -1; //\
    \ Element not found\n}\nconst result = binarySearch(arr, k);\nconsole.log(result);\
    \ // Output: 4 (since 9 is at index 4)\n```\n**Output:** The element 9 is found\
    \ at index 4.\n**Time Complexity:** O(log n)\n**Explanation:** This program implements\
    \ the Binary Search algorithm, which is used to search for an element in a sorted\
    \ array. The algorithm repeatedly divides the search interval in half. If the\
    \ value of the search key is less than the item in the middle of the interval,\
    \ it narrows the interval to the lower half, otherwise, it narrows it to the upper\
    \ half. The time complexity is O(log n), where n is the number of elements in\
    \ the array.\n\n### Q-8 Write a JS Program to Find the Maximum Element in an Array.\
    \ (Most Asked)\nApproach :-\n"
  mdcn: "\n\n# 面试中最常见的 50 道 JavaScript 编码题\n\n## 关于我\n**Rahul Chaurasia**\n**2 年经验\
    \ React 开发者**\n**计算机应用硕士 (MCA), NIT Raipur**\n\n**与我联系**\n- [Topmate:](https://topmate.io/rahul_chaurasia12)\n\
    - [LinkedIn](https://www.linkedin.com/in/rahul-chaurasia-997a56186/)\n\n## 第 1\
    \ 部分 - 数字\n\n### Q-1 写一个 JS 程序找到任意给定数字的阶乘。（常问）\n方法 :-\n```javascript\nlet number\
    \ = 7; // 要计算阶乘的数字\n// 计算给定数字阶乘的函数\nfunction findFactorial(num) {\n  // 0 的阶乘定义为\
    \ 1\n  if (num === 0) {\n    return 1;\n  }\n  // 初始化阶乘结果为 1\n  let factorial\
    \ = 1;\n  // 通过乘以从 1 到 num 的每个整数来计算阶乘\n  for (let i = 1; i <= num; i++) {\n  \
    \  factorial *= i;\n  }\n  return factorial;\n}\nconst result = findFactorial(number);\n\
    console.log(result); // 输出: 5040\n```\n**输出:** 7 的阶乘是 5040。\n**时间复杂度:** O(n)\n\
    **解释：** 该程序计算数字 7 的阶乘。`findFactorial` 函数首先检查数字是否为 0，如果是则返回 1（因为 0! = 1）。对于大于 0\
    \ 的数字，它将 factorial 初始化为 1，并乘以从 1 到 7 的每个整数。最终结果 5040 是 7 的阶乘。时间复杂度为 O(n)，其中 n\
    \ 是 num 的值，因为涉及多次乘法运算。\n\n### Q-2 写一个 JS 程序检查给定的数字是否为质数。（常问）\n方法 :-\n```javascript\n\
    let number = 13; // 要检查质数性的数字\n// 检查给定数字是否为质数的函数\nfunction isPrime(num) {\n  //\
    \ 处理特殊情况：0、1 和负数不是质数\n  if (num <= 1) {\n    return false;\n  }\n  // 从 2 到 num/2\
    \ 检查可整除性\n  for (let i = 2; i <= num/2; i++) {\n    if (num % i === 0) {\n   \
    \   return false; // 如果被 i 整除则不是质数\n    }\n  }\n  return true; // 如果没有找到除数，则返回\
    \ true\n}\nconst result = isPrime(number);\nconsole.log(result); // 输出: true（因为\
    \ 13 是质数）\n```\n**输出:** 输出为 true，因为 13 是质数。\n**时间复杂度:** O(n)\n**解释：** `isPrime`\
    \ 函数检查从 2 到 num/2 的整除性。如果找到除数，则返回 false。该方法判断给定数字的质数性。\n\n### Q-3 写一个 JS 程序反转给定数字的数字。（常问）\n\
    方法 :-\n```javascript\nlet num = 34567; // 要反转的数字\n// 反转数字数字的函数\nfunction reverseDigits(num)\
    \ {\n  let s = num.toString(); // 将数字转换为字符串\n  return s.split(\"\").reverse().join(\"\
    \"); // 反转字符串并重新拼接\n}\nconst result = reverseDigits(num);\nconsole.log(result);\
    \ // 输出: 76543\n```\n**输出:** 数字 34567 的数字反转后是 76543。\n**时间复杂度:** O(n)\n**解释：**\
    \ 该函数将数字转换为字符串，反转字符串，然后重新拼接。\n\n### Q-4 写一个 JS 程序返回给定数字的斐波那契数列。（常问）\n方法 :-\n```javascript\n\
    // 生成斐波那契数列的函数\nfunction fibonacci(n) {\n  if (n <= 0) return [];\n  if (n ===\
    \ 1) return [0];\n  let fib = [0, 1];\n  for (let i = 2; i < n; i++) {\n    fib.push(fib[i\
    \ - 1] + fib[i - 2]);\n  }\n  return fib;\n}\nconst n = 5;\nconst result = fibonacci(n);\n\
    console.log(result); // 输出: [0, 1, 1, 2, 3]\n```\n**输出:** 前 5 个斐波那契数是 [0, 1, 1,\
    \ 2, 3]。\n**时间复杂度:** O(n)\n**解释：** 该函数通过不断累加前两个数来生成斐波那契数列，时间复杂度为 O(n)。\n\n###\
    \ Q-5 写一个 JS 程序在不使用临时变量的情况下交换变量。（常问）\n方法 :-\n```javascript\n// 在不使用临时变量的情况下交换变量的函数\n\
    function swap(a, b) {\n  a = a + b;\n  b = a - b;\n  a = a - b;\n  console.log(`a=${a},\
    \ b=${b}`);\n}\nswap(10, 20); // 输出: a=20, b=10\n```\n**输出:** a=20, b=10\n**复杂度:**\
    \ O(1)\n**解释：** 该方法使用算术加减法在不使用额外空间的情况下交换两个值。\n\n## 第 2 部分 - 数组\n\n### Q-6 写一个\
    \ JS 程序计算数组中所有元素的和。（常问）\n```javascript\nfunction sumArray(arr) {\n  return arr.reduce((sum,\
    \ num) => sum + num, 0);\n}\nconst numbers = [10, 20, 30, 40, 50];\nconst total\
    \ = sumArray(numbers);\nconsole.log(total); // 输出: 150\n```\n该函数使用 `reduce` 方法遍历数组，并从值\
    \ 0 开始累加。\n\n### Q-7 写一个 JS 程序在排序数组上进行二分查找。（常问）\n方法 :-\n```javascript\nlet arr\
    \ = [1, 3, 7, 8, 9, 34, 56];\nlet k = 9; // 要查找的值\n// 执行二分查找函数\nfunction binarySearch(arr,\
    \ k) {\n  let start = 0;\n  let end = arr.length - 1;\n  while (start <= end)\
    \ {\n    let mid = Math.floor((start + end) / 2);\n    // 如果 k 小于中间元素，在左半部分查找\n\
    \    if (k < arr[mid]) {\n      end = mid - 1;\n    }\n    // 如果 k 大于中间元素，在右半部分查找\n\
    \    else if (k > arr[mid]) {\n      start = mid + 1;\n    }\n    // 如果 k 等于中间元素，返回索引\n\
    \    else if (k === arr[mid]) {\n      return mid;\n    }\n  }\n  return -1; //\
    \ 未找到元素\n}\nconst result = binarySearch(arr, k);\nconsole.log(result); // 输出:\
    \ 4（因为 9 在索引 4 ）\n```\n**输出:** 元素 9 在索引 4。\n**时间复杂度:** O(log n)\n**解释：** 该程序实现了二分查找算法，用于在排序数组中查找元素。算法反复将搜索范围减半。如果搜索值小于中间元素，则将范围缩小到下半部分，否则缩小到上半部分。时间复杂度为\
    \ O(log n)，其中 n 是数组中的元素个数。\n\n### Q-8 写一个 JS 程序找到数组中的最大元素。（常问）\n方法 :-\n\n"
