    \ // 输出: true\n```\n\n**输出：** `true`（因为 `arr2` 中的所有元素都存在于 `arr1` 中）。\n\n**时间复杂度：**\
    \ *O(n * m)*\n\n**解释：** 函数使用 `every` 方法检查 `arr2` 中的每个元素是否包含在 `arr1` 中。该检查使用了 `includes`\
    \ 方法。时间复杂度为 O(n * m)，其中 n 是 `arr1` 的长度，m 是 `arr2` 的长度。\n\n## Q-25 编写一个 JS 程序查找两个数组的交集\n\
