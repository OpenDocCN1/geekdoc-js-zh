    \ - 1; i >= 0; i--) {\n    reversedArray.push(array[i]);\n  }\n  return reversedArray;\n\
    }\nconst reversed = reverseArray(originalArray);\nconsole.log(reversed); // 输出:\
    \ [7, 6, 5, 4, 3, 2, 1]\n\n**输出：** 反转后的数组是 `[7, 6, 5, 4, 3, 2, 1]`。\n\n**时间复杂度：**\
    \ *O(n)*\n\n**解析：** 该程序实现了 `reverseArray` 来反转 `originalArray` 中元素的顺序。它使用索引 `i`\
    \ 从数组末尾开始遍历，将每个元素推入新数组 `reversed` 中。时间复杂度为 O(n)，其中 `n` 是数组中的元素个数，因为每个元素恰好被处理一次。\n\
    \n**Q-11** **编写一个 JS 程序按升序排序数组（泡泡排序）**\n\n方法 :-\n\nlet arr = [4, 7, 5, 3, 8, 9,\
    \ 6];\n\n// 执行泡泡排序的函数\nfunction bubbleSort(arr) {\n  // 外层循环遍历数组\n  for (let i\
    \ = 0; i < arr.length; i++) {\n    // 内层循环比较相邻元素\n    for (let j = 0; j < arr.length\
    \ - i - 1; j++) {\n      if (arr[j] > arr[j + 1]) {\n        // 交换元素\n       \
    \ let temp = arr[j];\n        arr[j] = arr[j + 1];\n        arr[j + 1] = temp;\n\
    \      }\n    }\n  }\n  return arr;\n}\nconst result = bubbleSort(arr);\nconsole.log(result);\
    \ // 输出: [3, 4, 5, 6, 7, 8, 9]\n\n**输出：** 排序后的数组是 `[3, 4, 5, 6, 7, 8, 9]`。\n\n\
    **时间复杂度：** *O(n²)*\n\n**解析：** 泡泡排序通过嵌套循环比较并交换相邻元素来排序。时间复杂度为 O(n²)，其中 `n` 是数组的长度。\n\
    \n**Q-12** **编写一个 JS 程序检查数组是否升序排序。**\n\n方法 :-\n\nfunction isSorted(arr) {\n  for\
    \ (let i = 0; i < arr.length - 1; i++) {\n    if (arr[i] > arr[i + 1]) {\n   \
    \   return false;\n    }\n  }\n  return true;\n}\nconst arr = [1, 2, 3, 4, 5,\
    \ 6, 7];\nconst result = isSorted(arr);\nconsole.log(result); // 输出: true\n\n\
    **输出：** true\n\n**时间复杂度：** *O(n)*\n\n**解析：** 该函数遍历数组并检查当前元素是否大于后一个元素。如果是，则返回 `false`。时间复杂度为\
    \ *O(n)*，其中 `n` 是数组中的元素个数。\n\n**Q-13** **编写一个 JS 程序检查两个数组是否相等。**\n\n方法 :-\n\n\
    function arraysAreEqual(arr1, arr2) {\n  if (arr1.length !== arr2.length) {\n\
    \    return false;\n  }\n  for (let i = 0; i < arr1.length; i++) {\n    if (arr1[i]\
    \ !== arr2[i]) {\n      return false;\n    }\n  }\n  return true;\n}\nconst arr1\
    \ = [1, 2, 3, 4, 5];\nconst arr2 = [1, 2, 3, 4, 5];\nconst result = arraysAreEqual(arr1,\
    \ arr2);\nconsole.log(result); // 输出: true\n\n**输出：** true\n\n**时间复杂度：** *O(n)*\n\
    \n**解析：** 该函数首先检查两个数组的长度，如果不同则返回 `false`。然后，它遍历数组并比较对应位置的元素。如果任何元素不同，则返回 `false`。时间复杂度为\
    \ *O(n)*。\n\n**Q-14** **编写一个 JS 程序统计数组中每个元素的出现次数。**\n\n方法 :-\n\nlet arr = [4,\
    \ 7, 5, 3, 8, 9, 6];\n\n// 统计每个元素出现次数的函数\nfunction numberOfOccurence(arr) {\n\
    \  let obj = {};\n  for (let i = 0; i < arr.length; i++) {\n    // 如果元素已在对象中，增加计数\n\
    \    if (arr[i] in obj) {\n      obj[arr[i]] += 1;\n    } else {\n      // 如果元素不在对象中，将其计数置为1\n\
    \      obj[arr[i]] = 1;\n    }\n  }\n  return obj;\n}\nconst result = numberOfOccurence(arr);\n\
    console.log(result); // 输出: { '4': 1, '7': 1, '5': 1, '3': 1, '8': 1, '9': 1,\
    \ '6': 1 }\n\n**输出：** 数组中每个元素的出现次数为 `{ '4': 1, '7': 1, '5': 1, '3': 1, '8': 1,\
    \ '9': 1, '6': 1 }`。\n\n**时间复杂度：** *O(n)* 其中 *n* 是数组中的元素个数。\n\n**解析：** 该程序遍历一次数组，并使用对象存储每个元素的计数。\n\
    \n**Q-15** **编写一个 JS 程序将数组循环旋转 K 个位置。**\n\n方法 :-\n\nlet arr = [1, 2, 3, 4, 5,\
    \ 6, 7];\nlet k = 3; // 需要旋转的位置数\n\n"
