    `const inputString = " Hello World! How are you?";`

    `const result = removeWhitespace(inputString);`

    `console.log(result);`


    **Output**: `"HelloWorld!Howareyou?"`


    **Time Complexity**: *O(n)*, where *n* is the length of the input string. The
    program iterates through each character in the string exactly once.


    **Explanation**: The program iterates through each character in the string and
    checks if it is not a space. If the character is not a space, it is added to the
    `result` string.


    ## Q-35 Write a JS program to count the number of Occurrences of a character in
    the string.(Most Asked)


    Approach:-


    `let str = "Chaurasia"; // String to search in`

    `let char = "a"; // Character to count`

    `// Function to find the number of occurrences of a character in a string`

    `function numberOfOccurrences(str, char) {`

    `  let count = 0;`

    `  for (let i = 0; i < str.length; i++) {`

    `    if (str[i] === char) {`

    `      count++;`

    `    }`

    `  }`

    `  return count;`

    `}`

    `let result = numberOfOccurrences(str, char);`

    `console.log(result); // Output: 3`


    **Output**: The number of occurrences of `''a''` in the string "Chaurasia" is
    `3`.


    **Time Complexity**: *O(n)*


    **Explanation**: The function iterates through the string and counts the occurrences
    of the specified character. The time complexity is *O(n)*, where `n` is the length
    of the string. The variable `char` is used to specify the character to count.


    ## Q-36 Write a JS program to convert the First Letter of Each Word in the String
    to Uppercase.


    Approach:-


    `let str = "i am a frontend developer"; // Original string`

    `// Function to capitalize the first letter of each word`

    `function capitalizeFirstLetter(str) {`

    `  return str`

    `    .split(" ") // Split the string into words`

    `    .map((word) => word.charAt(0).toUpperCase() + word.slice(1)) // Capitalize
    the first letter`

    `    .join(" "); // Join the words back into a string`

    `}`

    `const result = capitalizeFirstLetter(str);`

    `console.log(result); // Output: "I Am A Frontend Developer"`


    **Output**: The string `"i am a frontend developer"` is converted to `"I Am A
    Frontend Developer"`.


    **Time Complexity**: *O(n)*


    **Explanation**: The function splits the string `"i am a frontend developer"`
    into an array of words, capitalizes the first letter of each word, and then joins
    the words back into a single string. The result is `"I Am A Frontend Developer"`.
    The time complexity is *O(n)*, where `n` is the number of characters in the string.


