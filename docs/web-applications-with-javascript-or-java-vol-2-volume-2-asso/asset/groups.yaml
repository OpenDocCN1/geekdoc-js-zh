    ## 1.5 为非无向关联添加方向


    当我们以 UML 类图的形式创建信息模型时，最终会得到一个包含一个或多个关联的模型，这些关联的端点没有定义任何所有权，例如图 1.4 所示。当关联的两个端点都没有所有权点（ownership
    dot）时（如本例所示），这意味着模型没有指定如何通过引用属性（reference properties）来定义（或实现）该关联。这种关联没有方向。根据 UML
    2.5 规范，此类关联的端点是由关联自身“所有”的，而不是由参与其中的任何一个类所所有。


