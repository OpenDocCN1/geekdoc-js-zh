    可以通过执行以下步骤从信息设计模型导出 TCI 表模型：


    - 1. 将所有类中的标准 ID 属性修符 {id} 替换为 {pkey}，以指示标准 ID 属性是*主键*。

    - 2. 将单数（大写）类名（*Person, Author, 等*）替换为复数小写表名（*people, authors, 等*），并将驼峰命名属性（*personId*
    和 *empNo*）替换为小写下划线分隔列名（*person_id* 和 *emp_no*）。

    - 3. 为所有类矩形添加 «table»刻型。

    - 4. 将平台无关的数据类型名称替换为 SQL 数据类型名称。

    - 5. 删除所有的泛化/继承箭头，并将子表的列（例如来自 *people* 的 *person_id* 和 *name*）添加到它们的子表（authors
