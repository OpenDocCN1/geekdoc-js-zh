    ## 术语表


    ### C


    CRUD 是 *Create, Read/Retrieve, Update, Delete（删除）* 的缩写，表示任何软件应用程序都需要执行的四种基本数据管理操作。


    级联样式表


    CSS 用于定义网页的呈现样式，它通过告诉浏览器如何渲染其 HTML（或 XML）内容：例如使用内容元素的布局、字体和文本样式，以及哪些颜色、背景和动画。通常，这些设置在一个独立的
    CSS 文件中完成，该文件通过 HTML `head` 标签中的一个特殊链接元素与 HTML 文件关联。


    ## D


    文档对象模型


    DOM 是一种用于用于检索和修改 HTML 或 XML 文档中节点和元素的抽象 API。所有编程语言都具有实现 DOM 的绑定（DOM bindings）。


    域名系统


    DNS 将用户易读的域名翻译为 IP 地址，以便在互联网上定位主机计算机。


    ## E


    ECMAScript


    一种由行业组织“国际制码标准组织（Ecma International）”定义的 JavaScript 标准。


    可扩展标记语言


    XML 允许以机器可读的方式标记各种类型文档、数据文件和消息的结构。如果标签名是自解释的，XML 也可以是人类可读的。XML 基于 Unicode。SVG
    和 MathML 基于 XML，并且存在基于 XML 的 HTML 版本。


    XML 提供了一种语法，以带有*元素*及其*属性*的*XML 文档*形式表示结构化信息。XML 文档中使用的特定元素和属性可以来自任何词汇表，例如公共标准或用户定义的
    XML 格式。


    ## H


    超文本标记语言


    HTML 允许标记（或描述）人类可读的网页文档或网页的结构。基于 XML 的 HTML 版本被称为“XHTML5”，与传统的 HTML 相比提供了更简单简洁的语法。


    超文本传输协议


    HTTP 是一种基于互联网技术 TCP/IP 和 DNS 的无状态请求/响应协议，使用人类可读的文本消息在客户端和 Web 服务器之间通信。HTTP 的主要目的是允许从浏览器获取由
    URL 指定的网页文档，并从浏览器执行的 HTML 表单调用后端 Web 程序的操作。最近，HTTP 越来越多地提供 Web API 和 Web 服务。


    ## I


    IANA 代表互联网分配编号机构（Internet Assigned Numbers Authority），它是 ICANN 的附属机构，负责互联网协议使用的名称和数字。


    ICANN 代表互联网分配名称与数字机构（Internet Corporation of Assigned Names and Numbers），是一个维护域名系统的国际非营利组织。


    IndexedDB


    由浏览器管理的索引数据存储的 JavaScript API。索引允许高性能搜索。与许多 SQL 数据库管理系统一样，IndexedDB 支持数据库事务。


    I18N（国际化）是一组帮助产品适应任何目标语言和文化的最佳实践集。它处理多种字符集、计量单位、键盘布局、时间和日期格式以及文本方向。


    JSON 代表 JavaScript 对象表示法（JavaScript Object Notation），是一种遵循 JavaScript 对象字面量语法的数据交换格式。许多编程语言都支持
    JSON 作为 XML 的轻量级替代。


    ## M


    MathML


    一种用于表示数学表达式的开放标准，可用于数据交换或在网页内渲染。


    MIME 类型（也称为“媒体类型”或“内容类型”）是随文件发送的关键字字符串，用于指示其内容类型。例如，声音文件可能标记为 audio/ogg，或者图像文件标记为
    image/png。


    模型-视图-控制器


    MVC 是一种通用的架构比喻，强调关注点分离原则（主要在模型和视图之间），并将模型视为应用程序最基本的部分。在 MVC 框架中，“M”、“V”和“C”有不同的定义方式。通常，“模型”指的是应用程序的数据源，而“视图”表示用于用户界面的代码（它基于
    CSS 样式的 HTML 表单和 DOM 事件），而“控制器”通常指负责在视图和模型之间调调的（胶水）代码。


    ## O


    对象约束语言


    OCL 是一种用于表示 UML 模型的形式语言。


    面向对象编程


    OOP 是一种基于对象的编程范式，其核心是对象和类。OOP 的高级特性是类的继承。


    ## P


    OWL 是一种用于在 Web 上表示表示的形式语言。


    便携式网络图形


    PNG 是一种开放（无专利）的图形格式，支持无损压缩。


    补丁（Polyfill）是一段 JavaScript 代码，用于在浏览器中模拟尚未支持的 JavaScript 方法。


    ## R


    RDF 是一种用于在 Web 上表示机器可读信息的 W3C 语言。


    ## S


    SGML 是标记语言的 ISO 规范。HTML4 是基于 SGML 的。XML 是 SGML 的简化后续版本。HTML5 不再基于 SGML。


    可缩矢量图形


    SVG 是一种基于 XML 的 2D 图像格式。可以使用 CSS 进行样式设置，并使用 JavaScript 实现交互。HTML5 允许在 HTML 文档中嵌入
    SVG 内容。


    槽（Slot）


    Slot 是一个键值对。在面向对象的程序（例如 Java 对象）中，槽通常是一个属性值。但在 JavaScript 对象中，槽也可以由方法名和方法体组成。


    ## U


    Unicode


    一种平台无关的字符集，包含了世界上大多数语言（包括印地语、缅甸语和盖尔克语）的字符。每个字符分配一个 0 到 1114111 之间的整数代码。例如，希腊字母
    π 的代码为 960。Unicode 包含了 ASCII 和 ISO-8859-1（Latin1）等旧字符集。XML 基于 Unicode。因此，希腊字母
    π（代码为 960）可以使用 XML 语法插入 XML 文档。XML 文档中 Unicode 字符的编码是 UTF-8，它对 ASCII 字符使用一个字节，对不常用的字符使用三个字节。


    统一资源标识符


    URI 是统一资源定位符（URL）或统一资源名称（URN）。


    统一资源定位符


    URL 是资源名称，包含一个在 Web 上定位该资源的地址。


    统一资源名称


    RN 指向资源但不指定其位置。


    统一建模语言


    UML 是一项行业标准，定义了一系列建模语言，用于支持面向对象的问题分析和软件设计的各种模型和图表。其核心语言是用于信息/数据建模的类图，以及用于过程/行为建模的序列图、活动图和状态图（或状态图）。


    用户代理


    用户代理是前端 Web 客户端程序，例如浏览器。


    ## W


    WebM 是一种由 Google Chrome 和 Mozilla Firefox 支持的开放（免版税）视频格式，但不支持 Microsoft Internet
    Explorer 和 Apple Safari。


    WHATWG 成立于 2004 年，由 Apple、Mozilla 和 Opera 的前员工创立，他们对 W3C 专注于 XHTML2 标准化导致 Web
    技术标准化进展缓慢感到不满。WHATWG 由 Ian Hickson 领导，与 W3C 竞争与合作开发了 HTML5 及相关的 JavaScript API。


    超文本应用技术工作组


    '
