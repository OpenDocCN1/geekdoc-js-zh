- md: "\n## 50 3 Implementing Unidirectional Non-Functional Associations with Plain\
    \ JS\n\nWhen a book to be updated has been chosen, the input fields isbn, title\
    \ and year, and the select control for updating the publisher, are assigned corresponding\
    \ values from the chosen book, and the associated authors select widget is set\
    \ up:\n\n```javascript\nhandleBookSelectChangeEvent: function () {\n  const formEl\
    \ = document.querySelector(\"#section#Book-U\"),\n  saveButton = formEl.commit,\n\
    \  selectAuthorsWidget = formEl.querySelector(\".MultiChoiceWidget\"),\n  selectPublisher\
    \ = formEl.selectPublisher,\n  isbn = formEl.Book.value;\n  if (isbn !== \"\"\
    ) {\n    let book = Book.instances[isbn];\n    formEl.isbn.value = book.isbn;\n\
    \    formEl.title.value = book.title;\n    formEl.year.value = book.year;\n  \
    \  // set the associated authors select widget\n    util.createMultipleWidget(selectAuthorsWidget,\
    \ book.authors,\n    Author.instances, \"authorId\", \"name\", 1); // minCard=1\n\
    \    // set up associated publisher select list\n    util.fillSelectWithOptions(selectPublisher,\
    \ Publisher.instances,\n    \"name\");\n    if (book.publisher) formEl.selectPublisher.value\
    \ = book.publisher.name;\n    saveButton.disabled = false;\n  } else {\n    formEl.reset();\n\
    \    formEl.selectPublisher.selectedIndex = 0;\n    selectAuthorsWidget.innerHTML\
    \ = \"\";\n    saveButton.disabled = true;\n  }\n}\n```\n\nWhen the user, after\
    \ updating values, finally clicks the save button, all form control values, including\
    \ the value of the single-select control for assigning a publisher, are copied\
    \ to corresponding slots in a slot record, which is used as the argument for invoking\
    \ the update method after all values have been checked for validity. Before invoking\
    \ update, a list of ID references to authors to be added, and another list of\
    \ ID references to authors to be removed, is created (in the authorIdRefsToAdd\
    \ and authorIdToRemove slots) from the updates that have been recorded in the\
    \ associated authors select widget with the help of classList values, as shown\
    \ in the following program listing:\n\n```javascript\nhandleSaveButtonClickEvent:\
    \ function () {\nconst formEl = document.querySelector(\"section#Book-U form\"\
    );\nconst selectBookEl = formEl.selectBook;\nconst authorIdWidget = formEl.querySelector(\"\
    .MultiChoiceWidget\");\nmultiChoiceListEl = authorIdWidget.firstElementChild;\n\
    const slots = { isbn: formEl.isbn.value,\n  title: formEl.title.value,\n  year:\
    \ formEl.year.value,\n  publisher_id: formEl.selectPublisher.value\n};\n// add\
    \ event listeners for responsive validation\n..\n// commit the update only if\
    \ all form values are valid\nif (formEl.checkValidity()) {\n  // construct authorIdRefsToAdd/RemoveRefs\
    \ from the association list\n  let authorIdRefsToAdd=[], authorIdRefsToRemove=[];\n\
    \  for (let mclListItemEl of multiChoiceListEl.children) {\n    if (mclListItemEl.classList.contains(\"\
    removed\")) {\n      authorIdRefsToRemove.push(mclListItemEl.getAttribute(\"data-value\"\
    ));\n    }\n    if (mclListItemEl.classList.contains(\"added\")) {\n      authorIdRefsToAdd.push(mclListItemEl.getAttribute(\"\
    data-value\"));\n    }\n  }\n  // if the add/remove list is non-empty create a\
    \ corresponding slot\n  if (authorIdRefsToRemove.length > 0) {\n    slots.authorIdRefsToRemove\
    \ = authorIdRefsToRemove;\n  }\n  if (authorIdRefsToAdd.length > 0) {\n    slots.authorIdRefsToAdd\
    \ = authorIdRefsToAdd;\n  }\nBook.update(slots);\n// update the book selection\
    \ list's option element\nselectBookEl.options[selectBookEl.selectedIndex].text\
    \ = slots.title;\n}\n}\n```\n\n## 3.6 How to Run the App and Get the Code\n\n\
    You can run the app from our server and download it as a ZIP archive file.\n\n\
    ## 3.7 Points of Attention\n\nWe have still included the repetitive code structures\
    \ (called boilerplate code) in the model layer per class and per property for\
    \ constraint validation (checks and setters) and per class for the data storage\
    \ management methods add, update, and destroy. While it is good to write this\
    \ code a few times for learning app development, you don't want to write it again\
    \ and again when you work on real projects. For avoiding repetitive boilerplate\
    \ code, generic forms of these methods are needed, such that they can be reused\
    \ in all model classes of an app. For instance, the class-js library provides\
    \ such an approach.\n\n## 4 Implementing Unidirectional Functional Associations\
    \ with Java EE\n\nA unidirectional functional association is either one-to-one\
    \ or many-to-one. In both cases such an association is represented, or implemented,\
    \ with the help of a single-valued reference property.\n\nIn this chapter, we\
    \ show:\n\n- 1. how to derive a data model in the form of a Java Entity class\
    \ model from an OO class model with single-valued reference properties representing\
    \ unidirectional functional associations,\n- 2. how to code the Java Entity class\
    \ model in the form of entity classes (implementing model classes),\n- 3. how\
    \ to write the view and controller code based on the entity classes.\n\n## 4.1\
    \ Implementing Single-Valued Reference Properties in Java\n\nA single-valued reference\
    \ property, such as the publisher of the object type Book, allows storing internal\
    \ references to objects of another type, such as the publisher.\n\n```java\n@Entity\n\
    @Table(name=\"books\")\npublic class Book {\n\n    @Id\n    private String isbn;\n\
    \n    private String title;\n\n    private Integer year;\n\n    @ManyToOne\n \
    \   private Publisher publisher;\n\n    public Book() {}\n\n    public Book(String\
    \ isbn, String title, Integer year, Publisher publisher) {\n        this.isbn\
    \ = isbn;\n        this.title = title;\n        this.year = year;\n        this.publisher\
    \ = publisher;\n    }\n\n    public String getIsbn() { return isbn; }\n    public\
    \ void setIsbn(String isbn) { this.isbn = isbn; }\n\n    public String getTitle()\
    \ { return title; }\n    public void setTitle(String title) { this.title = title;\
    \ }\n\n    public Integer getYear() { return year; }\n    public void setYear(Integer\
    \ year) { this.year = year; }\n\n    public Publisher getPublisher() { return\
    \ publisher; }\n    public void setPublisher(Publisher publisher) { this.publisher\
    \ = publisher; }\n\n    @Override\n    public String toString() {\n        return\
    \ \"Book{\" + \"isbn='\" + isbn + \"', title='\" + title + \"', year=\" + year\
    \ + '}';\n    }\n}\n```\n\n## 4.2 Make a Java Entity Class\n\nThe starting point\
    \ for making a Entity class is an OO class model like the one shown. In our example,\
    \ we obtain the Entity class by:\n1. making all properties private,\n2. adding\
    \ getters and setters,\n3. adding a toString method,\n4. adding a constructor\
    \ that initializes all properties.\n\n## 4.3 New Issues\n\nCompared to the single-class\
    \ apps discussed in previous, we have to deal with a number of new issues:\n\n\
    - 1. In the model code we now have to take care of **reference properties** that\
    \ require\n   1. defining referential integrity constraints with the help of JPA\
    \ annotations;\n   2. extending the code of the *create*, update and delete methods\
    \ by taking the reference properties into consideration;\n   3. a method for converting\
    \ between (internal) object references and corresponding (external) ID references\
    \ in serialization and de-serialization operations.\n- 2. In the **user interface**\
    \ (view) code we now have to take care of\n   1. showing information about associated\
    \ objects in the *retrieve/list* all use case;\n   2. allowing to select an associated\
    \ object from a list of all existing instances of the target class in the *create\
    \ object* and *update object* use cases.\n\n## 4.4 Write the Model Code\n\nThe\
    \ Java Entity model can be directly coded for getting the model layer of our Java\
    \ back-end app.\n\n### 4.4.1 Summary\n\n- 1. Code each class from the Java Entity\
    \ class model as a corresponding entity class.\n- 2. Code an [id] property modifier\
    \ with the JPA annotation @Id\n- 3. Code any property modifier denoting the functionality\
    \ type of a reference property, such as {manyToOne}, with the JPA annotation,\
    \ such as @ManyToOne.\n- 4. Code the integrity constraints specified in the model\
    \ with the help of Java Bean Validation annotations (or custom validation annotations).\n\
    - 5. Code the getters and setters.\n- 6. Code the *create*, *retrieve*, update\
    \ and delete storage management operations as class-level methods.\n"
