    \n## 5.7 Sets Versus Ordered Sets as Values of Properties\n\nRecall that a set\
    \ is an unordered collection that has unique elements, while a list is an ordered\
    \ collection that may contain the same element more than once. When a non-functional\
    \ association is ordered, like `Book::authors`, in the class diagram shown in\
    \ Figure 5.1, this implies that the range of the corresponding property needs\
    \ to be an ordered collection, such as List.\n\n| Book | authored | Author |\n\
    | :--- | :--- | :--- |\n| <id>isbn : String | | <id>personid[1]: Integer |\n|\
    \ title : String | | name[1]: String |\n| year : Integer | | (ordered) |\n\nFigure\
    \ 5.1: A set-valued and ordered-set-valued properties\n\nIn theory, set-valued\
    \ reference properties should be defined with `Set<T>`, such as declaring `Set<Book>`\
    \ as the range of `Author::authoredBooks`, while ordered-set-valued properties\
    \ should be defined with `SortedSet<T>`, such as declaring `SortedSet<Author>`\
    \ as the range of `Book::authors`.\n\nHowever, if there is no concern about avoiding\
    \ duplicate elements, both set-valued and ordered-set-valued properties can also\
    \ be defined with the generic interface `List<T>` as their range, which is typically\
    \ implemented with `ArrayList`.\n\nWhen the main use cases are adding elements\
    \ to the collection and later iterating over them, the best choice is `List` implemented\
    \ by `ArrayList`, which is more memory efficient than `LinkedList` or any implementation\
    \ of `Set`, and has fast insertion, iteration, and random access. Using `HashSet`\
    \ provides a performance benefit only in the use case of finding an element.\n\
