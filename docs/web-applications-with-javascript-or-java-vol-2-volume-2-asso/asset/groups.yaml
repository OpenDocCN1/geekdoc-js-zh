- md: "\n## 13.3 Case Study 2: Implementing a Class Hierarchy\n\nWhenever a class\
    \ hierarchy is more complex, we cannot simply eliminate it, but have to implement\
    \ it (1) in the app's model code, (2) in the underlying database and (3) in its\
    \ user interface.\n\nThe starting point for our case study is the design model\
    \ shown in Figure 12.8 above. In the following sections, we derive a JS class\
    \ model and an JS entity model from the design model. The entity table model is\
    \ used as a design for the object-to-storage mapping that we need for storing\
    \ the objects of our app with the browsers; Local storage technology.\n\n## 13.3.1\
    \ Make a JS Class Model\n\nWe design the model classes of our example app with\
    \ the help of a JS class model that we derive from the design model by essentially\
    \ leaving the generalization rows as they are and just adding get/set methods\
    \ and static check functions to each class. However, in the case of our app, it\
    \ is natural to apply the Class Hierarchy Merge design pattern (discussed in Section\
    \ 12.6) to the single-subclass segmentation of Employee for simplifying the class\
    \ model by eliminating the Manager subclass. This leads to the model shown in\
    \ Figure 13.2. Notice that a Person may be an Employee or Author or both.\n\n\
    | Person |\n| :--- |\n| <get/set> personid: Integer (id) |\n| <get/set> name :\
    \ String |\n| checkPerson(in string) : ConstraintViolation |\n| checkPersonAid(in\
    \ id, in type) : ConstraintViolation |\n| checkName(in n) : ConstraintViolation\
    \ |\n\n| Author |\n| :--- |\n| <get/set> biography : string |\n| checkBiography(in\
    \ b) : ConstraintViolation |\n\n| Employee | enumeration |\n| :--- | :--- |\n\
    | <get/set> empNo[1] : number (unique) | |\n| <get/set> category[0..1] : EmployeeCategoryEL\
    \ | MANAGER |\n| <get/set> department[0..1] : string | |\n| checkEmpNo(in n) :\
    \ ConstraintViolation | checkCategory(in c number) : ConstraintViolation | checkDepartment(in\
    \ d string) : ConstraintViolation | |\n\nFigure 13.2: The JS class model of the\
    \ Person roles class hierarchy.\n\n## 13.3.2 Make a JS Table Model\n\nSince we\
    \ use the browsers' Local Storage as the persistent storage technology for our\
    \ example app, we have to deal with simple key-value storage. For each design\
    \ model class with a singular (capitalized) name Entity, we use its plural-case\
    \ name entities as the corresponding name and a key such that its associated string\
    \ value is obtained by serializing the object Entity instances with the help of\
    \ the JSON.stringify method.\n\nWe design a set of suitable JS tables in the form\
    \ of a JS entity table model that we derive from the information design model.\
    \ We have to make certain choices how to organize our data and how to derive a\
    \ corresponding entity table model.\n\nThe first choice to make concerns therein\
    \ using the Single Table Inheritance (STI), the Table per Class Inheritance (TCI)\
    \ which are introduced in Section 12.7.4. In the STI approach, a segmentation\
    \ (or an entire hierarchy) is represented with a single table, containing columns\
    \ for all attributes of all classes involved, and are shown in the example model\
    \ of Figure 13.3.\n\n| JS entity table | category |\n| :--- | :--- |\n| personid[1]:\
    \ number pkey | 1 = Author |\n| name[1]: string | 2 = Employee |\n| categories[1]:\
    \ number (1,2,3) | 3 = Employee & Manager |\n| biography[0]: string | |\n| empNo[0]:\
    \ number (unique) | |\n| department[0]: string | |\n\nFigure 13.3: An STI model\
    \ of the Person roles class hierarchy.\n\nSince the given segmentation is non-disjoint,\
    \ a multi-valued enumeration attribute categories is used for representing the\
    \ information to which subclasses instance belongs.\n\nUsing the STI approach\
    \ is feasible for the given example, since the role hierarchy does not have many\
    \ levels and the segment subclasses do not add many attributes. But, in a more\
    \ realistic example, we would have a lot more attributes than the STI is not really\
    \ an option for representing a multi-level role hierarchy. However, we may choose\
    \ it for representing the the single-segment class hierarchy Manager-is-subclass-of-Employee.\n\
    \nFor simplicity, and because the browsers' Local Storage does not support keys\
    \ as required by JTI, we choose the TCI approach, where we obtain a rateable for\
    \ each class of the Person segmentation, but without foreign keys. Our choices\
    \ result in the model shown in Figure 13.4 below, which has been derived from\
    \ the design model shown in Figure 12.8\n\n- 1. Merging the Manager subclass into\
    \ its superclass Employee, according to the Class Hierarchy Merge design pattern\
    \ described in Section 12.6.\n- 2. Replacing the standard ID property modifier\
    \ {id} of the personId attribute of Person, Author and Employee with {pkey} for\
    \ indicating that the attribute is a primary key.\n- 3. Replacing the singular\
    \ (capitalized) class names (Person, Author and Employee) with pluralized lowercase\
    \ table names (people, authors and employees).\n- 4. Adding the {JS entity table}\
    \ stereotype to all class rectangles (people, authors and employees).\n- 5. Replacing\
    \ the platform-independent datatype names with JS datatype names.\n- 6. Dropping\
    \ all generalization/inheritance arrows and adding all attributes of supertables\
    \ (personId and name) to their subtables (authors and employees).\n\n| «JS entity\
    \ table» |\n| :--- |\n| people |\n| personId : number (pkey) |\n| name : string\
    \ |\n\n| «JS entity table» |\n| :--- |\n| authors |\n| personId : number (pkey)\
    \ |\n| biography : string |\n\n| «JS entity table» |\n| :--- |\n| employees |\n\
    | personId : number (pkey) |\n| name : string |\n| empNo : number (unique) |\n\
    | category |\n| department : string |\n\nFigure 13.4: A TCI of the Person hierarchy.\n\
    \nIn the case of the TCI approach, in addition to the steps 1–5, we would:\n-\
    \ 1. Copy the primary key (personId) of root table (people) to subtables (authors\
    \ and employees).\n- 2. Replace generalization arrows with foreign key dependencies.\n\
    \n## 13.3.3 New Issues\n\nCompared to the model shown in Figure 13.2 above, we\
    \ have to deal with new issues:\n\n### 13.3.3.1 Defining Subtype Relationships\n\
    \nWe define the subtype relationships between Employee and Person, as well as\
    \ Author and Person. For instance, in Employee.js we define:\n\n```javascript\n\
    class Employee extends Person {\n  constructor ({personId, name, empNo, category,\
    \ department}) {\n    super({personId, name});\n    this.empNo = empNo;\n    if\
    \ (category) this.category = category;\n    if (department) this.department =\
    \ department;\n  }\n}\n```\n\n### 13.3.3.2 Loading the Instances of the Root Class\n\
    \nWhen retrieving the instances of a class hierarchy’s root class (in our example,\
    \ Person) from a persistent data store organized according to TCI approach, we\
    \ have to retrieve not only its direct instances from the table representing the\
    \ root class (people), but all indirect instances from tables representing its\
    \ subclasses (employees and authors), as shown in the following code:\n\n```javascript\n\
    Person.retrieve = function () {\n  var people={}, employees={}, authors={};\n\
    \  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"{}\";\n  if (!localStorage[\"\
    employees\"]) localStorage[\"employees\"] = \"{}\";\n  if (!localStorage[\"people\"\
    ]) localStorage[\"people\"] = \"{}\";\n  try {\n    people = JSON.parse(localStorage[\"\
    people\"]);\n    employees = JSON.parse(localStorage[\"employees\"]);\n    authors\
    \ = JSON.parse(localStorage[\"authors\"]);\n  } catch (e) {\n    console.log(\"\
    Error reading from Local Storage\\n\" + e);\n  }\n  for (let key of Object.keys(authors))\
    \ {\n    try { // convert record to (typed) object\n      Author.instances[key]\
    \ = new Author(authors[key]);\n      // create superclass extension\n      Person.instances[key]\
    \ = Author.instances[key];\n    } catch (e) {\n      console.log(`${e.constructor.name}\
    \ while deserializing` + `author ${key}: ${e.message}`);\n    }\n  }\n}\n```\n\
    \nEach record of the authors table is retrieved and converted to an Author object,\
    \ a reference to it. Also the records of the employees table are processed in\
    \ this way, while the records of the people table are simply retrieved and converted\
    \ to Person objects:\n\n```javascript\nPerson.retrieveAll = function () {\n  //\
    \ ...\n  for (let key of Object.keys(employees)) {\n    // ...\n  }\n}\n```\n"
  mdcn: "\n\n## 13.3 案例研究 2：实现类层次结构\n\n当类层次结构变得复杂时，我们不能简单地将其消除，而必须在 (1) 应用模型代码中、(2)\
    \ 底层数据库以及 (3) 用户界面中对其实现它。\n\n我们案例研究的起点是图 12.8 所示的设计模型。在接下来的章节中，我们从设计模型推导出一个 JS\
    \ 类模型和一个 JS 实体模型。实体表模型被用于对象到存储映射的设计，我们需要通过浏览器的 Local storage 技术，利用 `JSON.stringify`\
    \ 方法序列化 Entity 实例来存储应用中的对象。\n\n## 13.3.1 构建 JS 类模型\n\n我们借助一个 JS 类模型来设计示例应用的模型类。该类模型是从设计模型推导而来的，本质上是保持泛化行不变，仅为每个类添加\
    \ get/set 方法和静态检查函数。然而，在我们应用中，自然的做法是将“类层次结构合并”设计模式（在 12.6 节中讨论）应用于 `Employee`\
    \ 的单子子类分段，通过消除 `Manager` 子类来简化类模型。这导致了图 13.2 所示的模型。注意，`Person` 可能是 `Employee`、`Author`\
    \ 或两者兼有。\n\n| Person |\n| :--- |\n| <get/set> personid: Integer (id) |\n| <get/set>\
    \ name : String |\n| checkPerson(in string) : ConstraintViolation |\n| checkPersonAid(in\
    \ id, in type) : ConstraintViolation |\n| checkName(in n) : ConstraintViolation\
    \ |\n\n| Author |\n| :--- |\n| <get/set> biography : string |\n| checkBiography(in\
    \ b) : ConstraintViolation |\n\n| Employee | enumeration |\n| :--- | :--- |\n\
    | <get/set> empNo[1] : number (unique) | |\n| <get/set> category[0..1] : EmployeeCategoryEL\
    \ | MANAGER |\n| <get/set> department[0..1] : string | |\n| checkEmpNo(in n) :\
