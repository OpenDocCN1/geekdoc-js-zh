    \ |\n| checkNameAid(in n: string): ConstraintViolation |\n| checkNameAsIdRef(in\
    \ n: string): ConstraintViolation |\n| checkAddress(in a: string): ConstraintViolation\
    \ |\n| toString(): String |\n| toRecord(): Object |\n\nFigure 2.1: A JS class\
    \ model defining the classes Book and Publisher.\n\n## 2.4 New Issues\n\nCompared\
    \ to the validation and enumeration apps discussed in Volume 1, we have to deal\
    \ with a number of new technical issues:\n\n- 1. In the model code we now have\
    \ to take care of reference properties that require:\n    1. maintaining referential\
    \ integrity;\n    2. choosing and implementing one of the two deletion policies\
    \ discussed in Section 1.2 for managing the corresponding object destruction dependency\
    \ in the destroy method of the property’s range class;\n    3. conversion between\
    \ internal object references and external ID references in the serialization function\
    \ toString() and the conversion function toRecord(), as well as in the constructor\
    \ function.\n- 2. In the user interface (“view”) code we now have to take care\
    \ of:\n    1. showing information about associated objects in the Retrieve/List\
    \ use case;\n    2. allowing to select associated objects in the Create/Edit use\
    \ case.\n\n## 2.5 Code the Model\n\n### 2.5.1 Summary\n\n- 1. Add a `get/set`\
    \ stereotype to all (non-derived) single-valued properties, implying that they\
    \ have implicit getters and setters. Recall that in the setter, the corresponding\
    \ check operation is invoked and the property is only set, if the check does not\
