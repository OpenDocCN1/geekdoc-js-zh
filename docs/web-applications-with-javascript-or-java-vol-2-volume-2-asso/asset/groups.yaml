    \n```js\nset authors ( a ) {\n  this._authors = {};\n  if (Array.isArray(a)) {\
    \ // ID 数组\n    for (let idRef of a) {\n      this.addAuthor(idRef);\n    }\n\
    \  } else { // ID 到对象的 map\n    for (let idRef of Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n\
    \    }\n  }\n}\n```\n\n在 JS 中，集合值引用属性可以通过两种方式实现：\n1. 使用数组列表（JS 数组）作为值，\n2. 使用\
    \ map 作为值，将对象的标准 ID 属性值作为键，映射到内部 JS 对象引用。\n\n我们倾向于使用 map 实现集合值引用属性，因为它们可以确保每个元素都是唯一的，而在数组中我们必须防止重复元素。此外，map\
    \ 的元素可以很容易地删除（借助 `delete` 操作符），而在数组情况下这需要更多工作。然而，对于对应于有序集合值（或包/序列值）引用属性的有序关联端，我们使用\
    \ JS 数组。\n\n## 3.2 制作类模型\n\n我们制作 JS 类模型的起点是以下 OO 类模型：\n\n| Book | Publisher |\n\
