- md: "\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 165\n\nonly one database table is used for representing a class hierarchy.\
    \ This table contains the columns corresponding to all the properties of the classes\
    \ from the hierarchy plus the discriminator column. In our example, the books\
    \ table contains the following columns: isbn, title, year, subjectArea, about\
    \ and category. The simplified SQL-DDL code used to generate the books table for\
    \ our application is shown below:\n\n```\nCREATE TABLE IF NOT EXISTS `books` (\n\
    \  `ISBN` varchar(10) NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11)\
    \ NOT NULL,\n  `SUBJECTAREA` varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255)\
    \ DEFAULT NULL,\n  `category` varchar(16) DEFAULT NULL\n)\n```\n\n## 14.2.5 Write\
    \ the View And Controller Code\n\nThe user interface (UI) consists of a page that\
    \ allows navigating to the data management pages (in our example, to index.xhtml\
    \ in the folder WebContent/views/books/). Such data management page contains four\
    \ sections: retrieve/list all books, create book, update book and delete book.\n\
    \n### 14.2.5.1 Summary\n\nWe have to take care of handling the category discriminator\
    \ and the subjectArea and about segment properties in the “List all books” use\
    \ case as well as in the “Create book” and “Update book” use cases\n\n- 1. Adding\
    \ a segment information column (`Special type`) to the display table of the Retrieve/List\
    \ All use case in retrieveAndListAdapter.xhtml in the folder WebContent/views/books/\n\
    - n. Adding a “Special type” select control, and corresponding form fields for\
    \ all segment properties, in the forms of the “Create book” and “Update book”\
    \ use cases in create.xhtml and update.xhtml in the folder WebContent/views/books/.\
    \ Segment property fields are only displayed, and their validation occurs only\
    \ when a corresponding book category has been selected.\n\n### 14.2.5.2 Add a\
    \ Segment Information Column in Retrieve/List All\n\nWe add a \"Special type\"\
    \ column to the display table of the \"List all books\" use case in books.\n\n\
    ```\n<h:dataTable value=\"#{bookController.books}\" var=\"b\">\n\n<h:column>\n\
    \  <f:facet name=\"header\">Special type</f:facet>\n  #{b.getClass().getSimpleName()\
    \ != 'Book' ?\n  b.getClass().getSimpleName() : ''}\n</h:column>\n</h:dataTable>\n\
    ```\n\nA conditional expression is used to check if the Java bean class name is\
    \ Book, in which case we don't show it, or if it is something else (e.g. Textbook\
    \ or Biography), and then it is shown. This expression also shows how to call/vary\
    \ Java bean methods, not only custom methods.\n\n### 14.2.5.3 Add a \"Special\
    \ Type\" Select Control in Create and Update\n\nIn use cases, we need to allow\
    \ selecting a special category of book ('textbook' or 'biography') with the help\
    \ of a select control in a panel grid element:\n\n```\n<h:panelGrid id=\"bookPanel\"\
    \ columns=\"3\">\n\n<h:outputText value=\"Special type: \" />\n<h:selectOneMenu\
    \ id=\"bookType\" value=\"#{viewScope.bookType}\">\n  <f:select itemLabel=\"--\"\
    \ />\n  <f:selectItems value=\"#{book.typeItems}\" />\n  <f:ajax event=\"change\"\
    \ execute=\"@this\" render=\"textPanel\n  bookPanel standardBookPanel\"/>\n</h:selectOneMenu>\n\
    <h:message for=\"bookType\" errorClass=\"error\" />\n</h:panelGrid>\n```\n\nIn\
    \ the select control, three alternative panel groups are referenced:\n\n- 1. A\
    \ \"standardBookPanel\":\n\n```\n<h:panelGroup id=\"standardBookPanel\">\n<h:commandButton\
    \ value=\"#{viewScope.bookTypeValue == null}\"\n  rendered=\"#{bookController.create(book.isbn\"\
    ,\n```\n\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 167\n\nbook.title, book.year)\" />\n</h:panelGroup>\n\n2. A \"textBookPanel\"\
    \n<h:panelGroup id=\"textBookPanel\">\n<h:panelGrid rendered=\"#{viewScope.bookType\
    \ == 'TEXTBOOK'}\"\ncolumns=\"3\">\n<h:outputText value=\"Subject area: \" />\n\
    <h:inputText id=\"subjectArea\" value=\"#{book.subjectArea}\" />\n<h:message for=\"\
    subjectArea\" errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton value=\"\
    Create\"\nrendered=\"#{viewScope.bookType == 'TEXTBOOK'}\"\naction=\"#{textBookController.create(book.isbn,\
    \ book.title, book.year, book.subjectArea)}\" />\n</h:panelGroup>\n\n3. A \"biographyBookPanel\"\
    \n<h:panelGroup id=\"biographyBookPanel\">\n<h:panelGrid rendered=\"#{viewScope.bookType\
    \ == 'BIOGRAPHY'}\"\ncolumns=\"3\">\n<h:outputText value=\"About: \" />\n<h:inputText\
    \ id=\"about\" value=\"#{biography.about}\" />\n<h:message for=\"about\" errorClass=\"\
    error\" />\n</h:panelGrid>\n<h:commandButton value=\"Create\"\nrendered=\"#{viewScope.bookType\
    \ == 'BIOGRAPHY'}\"\naction=\"#{biographyBookController.create(book.isbn, book.title,\
    \ book.year, book.subjectArea)}\" />\n</h:panelGroup>\n\n## 14.2 Case Study 2:\
    \ Implement a Class Hierarchy with Joined Inheritance\n\n## 14.3 Case Study 2:\
    \ Implement a Class Hierarchy with Joined Inheritance\n\nThe starting point for\
    \ our case study is the design model shown in Figure 12.8 above. In the following\
    \ sections, we show how to eliminate the Manager class using the Class Hierarchy\
    \ design pattern and how to implement the Person hierarchy and use Joined, Multiple\
    \ Inheritance storage with the help of JPA framework.\n\n### 14.3.1 Make the Java\
    \ Entity class model\n\nWe design the model classes of our example app with the\
    \ help of a Java Entity model that we derive from the design model by essentially\
    \ leaving the generalization as they are and just adding getters and setters to\
    \ each class. However, in the case of our example app, it is natural to apply\
    \ the Class Hierarchy design pattern to the segmentation of Employee for simplifying\
    \ the data model by eliminating the Manager subclass. This leads to the model\
    \ shown in Figure 14.2 below. Note that we have made two technical decisions:\n\
    \n| Java Entity |\n| :--- |\n| Person |\n| /get/set> personid : Integer (id) |\n\
