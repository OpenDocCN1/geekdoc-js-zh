    ## 2.3 创建 JS 类模型\n\n创建 JS 类模型的起点是类似于图 1.10 所示的面向对象（OO）类模型。\n\n我们知道如何通过四个步骤从该 OO\
    \ 类模型推导出 JS 类模型。对于 OO 类模型中的每个检查：\n\n- 1. 为所有（非派生的）单值属性添加 `get/set` 拷贝（stereotype），意味着它们具有隐式的\
    \ getter 和 setter。回想一下在 setter 中，会调用相应的检查操作，并且只有当检查没有检测到任何约束违背时，属性才会被设置。\n- 2.\
    \ 为每个（非派生的）属性创建一个 `check` 操作，以便为实现**属性约束**提供一个集中的位置地。对于标准的 ID 属性（如 `Book::isbn`），需要两个或三个检查操作：\n\
    \    - 1. 一个基础检查操作，如 `checkIsbn`，用于检查所有句法约束，但不包括 `mandatory`（必填）值和 `unique`（唯一）约束。\n\
    \    - 2. 一个标准的 ID 检查操作，如 `checkIsbnAsId`，用于检查标准 ID 属性隐含的**必填**值和唯一性约束。\n    -\
    \ 3. 如果其他类有一个引用正在考虑的类的引用属性，则添加一个 ID 引用检查操作，用于检查施加在 ID 引用（或外键）属性上的引用完整性约束。例如，由于\
    \ `Book::publisher` 属性引用了 Publisher 对象，我们需要在 Publisher 类中一个 `checkNameAsIdRef`\
    \ 操作。\n\n  对于引用属性（如 `Book::publisher`），检查操作 `Book.checkPublisher` 必须通过调用 `Publisher.checkNameAsIdRef`\
    \ 来检查隐含的引用完整性约束，如果该属性是必填的，可能还要检查强制约束。\n- 3. 为 `toString()` 添加一个序列化函数，用于在错误消息和日志消息中显示对象的状态。\n\
