    \ function to `Record()` that prepares a model object for being stored as a row\
    \ in an entity table, which can be serialized to a JSON string with `JSON.stringify`\
    \ such that it can be stored as a value of an app's `localStorage` datastore.\n\
    \n### 2.5.2 Code Each Class as ES15 Class\n\nEach class C of the JS model is coded\
    \ as ES15 class having a single parameter for each (non-derived) property. In\
    \ the constructor body, we assign the fields of the record to corresponding properties.\
