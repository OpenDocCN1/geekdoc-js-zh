    \ is `books_author`. The operation consists of three steps:\n\n1. Create a JPQL\
    \ query which selects all books of this author.\n2. For every found book referencing\
    \ this author, we have to remove the author reference from its authors list.\n\
    3. Finally, delete the author record.\n\nThe entity class is created as follows:\n\
    \n```java\n@Entity @Table(name=\"author\")\n@ViewScoped(@ManagedBean(name=\"author\"\
    ))\npublic class Author {\n    // Properties\n    @Id\n    private Integer personId;\n\
    \n    @Column(nullable = false)\n    private String name;\n\n    @Column(nullable\
