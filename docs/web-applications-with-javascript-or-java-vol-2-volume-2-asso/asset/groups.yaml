    Java 类的设计，因为它没有指定如何通过引用属性来实现该关联。


    有三种方案可以将无向关联（不包含任何关联所有权点）的信息设计模型转换为所有关联均为单向或双向的信息设计模型：我们可以在关联的任一端点或两个端点放置所有权点。这三个方案中的每一种都定义了通过引用属性表示或实现关联的不同方式。因此，对于上述图
