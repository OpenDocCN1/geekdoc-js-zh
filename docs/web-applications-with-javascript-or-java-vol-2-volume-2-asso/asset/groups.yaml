    to organize our data and how to derive a corresponding entity table model.


    The first choice to make concerns therein using the Single Table Inheritance (STI),
    the Table per Class Inheritance (TCI) which are introduced in Section 12.7.4.
    In the STI approach, a segmentation (or an entire hierarchy) is represented with
    a single table, containing columns for all attributes of all classes involved,
