    ```\n\n## 10 Special Topics on Associations\n\n### 10.1 Part-Whole Associations\n\
    \nA part-whole association represents a relationship between a part type and a\
    \ whole type. Its instances are part-whole relationships between two objects where\
    \ one of them is a part of the other (the). The UML makes a distinction between\
    \ two kinds of part-whole associations: aggregation and composition. While these\
    \ two terms are defined in a pretty precise, albeit unsatisfactory, way in the\
    \ UML, many software developers have a different interpretation following a terminological\
    \ tradition of the C++ programming community where, unlike the parts of an 'aggregation-composition',\
    \ the parts of a 'composition' cannot exist independently of the composite that\
    \ references them.\n\nWe follow the UML and improve their definition of composition\
    \ by introducing a distinction between two kinds of compositions: those with separable\
    \ parts and those with inseparable parts.\n\n#### 10.1.1 Aggregation\n\nAn aggregation\
    \ is a special form of a part-whole association, where the parts of a whole can\
    \ be shared with others. For instance, we can model an aggregation between the\
    \ classes DegreeProgram and Course, as shown in the following diagram, since a\
    \ course is part of a degree program and a course can be shared among two or more\
    \ degree programs (e.g. an engineering degree could share).\n\n| DegreeProgram\
    \ | Course |\n|---|---|\n| name : String | id : String |\n\nHowever, the concept\
    \ of aggregation doesn't mean much, as the UML spec says the parts can exist independently\
    \ of the composite. \n\n#### 10.1.2 Composition\n\nA composition is a special\
    \ form of a part-whole association where the parts of the whole cannot exist without\
    \ the composite. If the composite is destroyed, the parts are also destroyed.\
    \ This is often referred to as a lifetime dependency.\n\nThe UML specification\
    \ states: \"A part may be removed from a composite before the composite instance\
    \ is deleted, and then not deleted as part of the composite instance.\" This indicates\
    \ that the part's lifetime is tied to the composite, but it can be detached early.\n"
