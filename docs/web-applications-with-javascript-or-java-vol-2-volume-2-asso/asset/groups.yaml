    \ |\n\n图 2.1：定义 Book 和 Publisher 类的 JS 类模型。\n\n## 2.4 新问题\n\n与第 1 卷讨论的验证和枚举应用相比，我们必须处理许多新的技术问题：\n\
    \n- 1. 在模型代码中，我们现在需要处理满足以下要求的引用属性：\n    1. 维护引用完整性；\n    2. 在第 1.2 节讨论的两种删除策略中选择并实现一种，用于在属性范围类的\
    \ destroy 方法中管理相应的对象销毁依赖；\n    3. 在序列化函数 `toString()` 和转换函数 `toRecord()` 以及构造函数函数中，在内部对象引用和外部\
