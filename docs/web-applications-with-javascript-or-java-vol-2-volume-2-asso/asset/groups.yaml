    }\n```\n\n```javascript\nclass Book {\n  constructor({isbn, title, year, authors,\
    \ authorRefs, publisher, publisher_id}) {\n    this.isbn = isbn;\n    this.title\
    \ = title;\n    this.year = year;\n    this.authors = authors || authorRefs;\n\
    \    if (publisher || publisher_id) {\n      this.publisher = publisher || publisher_id;\n\
    \    }\n  }\n  ...\n}\n```\n\n注意，调用 Book 构造可以使用对象引用 authors 或者使用 ID 引用 authorRefs\
    \ 和 publisher_id。这种方法使得 Book 构造函数更加灵活且更加健壮。\n\n### 2.5.3 实现属性检查\n\n确保类模型中指定的属性的所有约束都已在其检查函数中正确编码，正如第\
    \ 1 卷第 8 章解释的那样。约束违反（或验证错误）类定义在 `lib/errorTypes.js` 文件中。\n\n例如，对于 `Publisher.checkName`\
    \ 函数，我们获得了以下代码：\n\n```javascript\nclass Publisher {\n  static checkName(n) {\n\
    \    if (n === undefined) {\n      return new NoConstraintViolation(); // 非强制\n\
    \    } else {\n      if (typeof n !== \"string\" || n.trim() === \"\") {\n   \
    \     return new RangeConstraintViolation(\n          \"名称必须是非空字符串!\"\n      \
    \  );\n      } else {\n        return new NoConstraintViolation();\n      }\n\
    \    }\n  }\n  ...\n}\n```\n\n"
