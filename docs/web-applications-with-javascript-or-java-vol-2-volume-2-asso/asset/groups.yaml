    \ : String |\n| +checkPersonoidAsId(in pld : Integer, in em : EntityManager) :\
    \ ConstraintViolation |\n| +toString() : String |\n| +(...) |\n\n在 Java 实体类模型中，OO\
    \ 模型中指定的任何引用属性都用其所表示的关联的功能类型进行注解。\n\n## 5.4 编写模型代码 — 69\n\n在我们的示例中，我们为实体类 `Book`\
    \ 中的引用属性 `authors` 注解了 `manyToMany`：\n\n\n\n| «Java 实体» |\n|---|---|\n| «get/set-isbn[1]\
