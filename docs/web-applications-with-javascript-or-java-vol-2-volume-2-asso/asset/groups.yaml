    \ render=\"isbn\"/>\n</h:selectOneMenu>\n<h:message for=\"selectBook\"/>\n</h:panelGrid>\n\
    <h:commandButton value=\"Update\" action=\"#{bookCtrl.update(book.isbn, book.title,\
    \ book.year, book.publisher)}\" />\n</h:form>\n</ui:define>\n</ui:composition>\n\
    ```\n\n## 5 Unidirectional Non-Functional Associations with Java EE\n\nA unidirectional\
    \ non-functional association is either one-to-many or many-to-many. In both cases\
    \ such an association is represented with the help of a multi-valued reference\
    \ property.\n\nIn this chapter, we show\n\n- 1. how to derive Java Entity class\
    \ model from an OO class model with multi-valued reference properties representing\
    \ unidirectional non-functional associations,\n- 2. how to code the Java Entity\
    \ class model in the form of entity classes (implementing model classes),\n- 3.\
    \ how to write the view and controller code based on the model code.\n\n## 5.1\
    \ Implementing Multi-Valued Reference Properties in Java\n\nA multi-valued reference\
    \ property, as Book::authors, allows storing collection of internal references\
    \ to objects of some type, such as references to Author objects. When creating\
    \ a new type of Book, the constructor function needs to have a parameter for providing\
    \ a suitable value for this property. In general, the value can be a set of internal\
    \ object references or of ID references. With JPA, we use object references:\n\
    \n```\n@Entity @Table (name=\"books\")\n@ManagedBean (name=\"book\")\n@ViewScoped\n\
    public class Book {\n\n    private Set<Author> authors;\n\n    public Book() {\
    \ // required by JPA @Entity annotation!\n    public Book( String isbn, String\
    \ title, Integer year,\n                Publisher publisher, Set<Author> authors)\
    \ { . . }\n\n    public Set<Author> getAuthors() { return this.authors; }\n  \
    \  public void setAuthors( Set<Author> authors) { this.authors = authors; }\n\
    }\n```\n"
  mdcn: "\n\n## 4.5.1 初始化应用\n\n由于代码在 Tomcat 容器中运行，初始化是由容器内部完成的。\n\n## 4.5.2 在检索/列出所有中显示关联对象的信息\n\
    \n在我们的示例中，我们只有一个引用属性 `Book::publisher`，它是功能性的。为了在检索/列出所有书籍的用例中显示书籍的可选出版者信息，HTML\
    \ 表格中对应的列被填充了出版者的名称，如下：\n\n```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n  <h:dataTable value=\"#{bookCtrl.books}\" var=\"\
    b\">\n    ..\n    <h:column>\n      <f:facet name=\"header\">Publisher</f:facet>\n\
    \      #{b.publisher.name}\n    </h:column>\n  </h:dataTable>\n  <h:button value=\"\
    Main menu\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\n注意在\
    \ #{b.publisher.name} JSF 中使用的级联调用，它访问了发布者的属性名，而发布者是书籍实例 b 的属性。\n\n## 4.5.3 在创建和更新中允许选择关联对象\n\
    \n在本节中，我们将讨论如何创建和更新具有引用属性的对象，例如带有引用属性 `publisher` 的 Book 对象。\n\n### 4.5.3.1 创建对象到字符串的转换器\n\
    \nHTML 需要字符串或数字值来填充表单。在我们的情况下，Book 类的 `publisher` 属性是一个对象引用。JSF 允许通过转换器将对象转换为字符串反反之，转换器是带有\
    \ @FacesConverter 注解并实现了 `javax.faces.convert` 接口的类：\n\n```\n@FacesConverter(value=\"\
    pl.m.converter.PublisherConverter\")\npublic class PublisherConverter implements\
    \ Converter {\n    @Override\n    public Object getObject(FacesContext context,\n\
    \        UIComponent component, String value) {\n        PublisherController ac\
    \ = FacesContext\n            .getCurrentInstance()\n            .getApplication()\n\
    \            .evaluateExpressionGet(context, \"#{publisherCtrl}\",\n         \
    \       PublisherController.class);\n        EntityManager em = ac.getEntityManager();\n\
    \        if (value == null) return null;\n        else return em.find(Publisher.class,\
    \ value);\n    }\n    @Override\n    public String getAsString(FacesContext context,\n\
    \        UIComponent component, Object value) {\n        if (value == null) return\
    \ null;\n        else if (value instanceof Publisher) {\n            return ((Publisher)\
    \ value).getName();\n        }\n        else return null;\n    }\n}\n```\n\n转换器定义了两个方法：`getAsObject`\
    \ 和 `getAsString`，它们负责两种转换。为了能够从数据库中检索对象，我们需要一个 `EntityManager`，它可以从控制器（例如托管的\
    \ bean `publisherCtrl`）获取。控制器可以通过 `FacesContext` 单例获取。\n\n```\nPublisherController\
    \ ac = FacesContext.getCurrentInstance()\n    .getApplication()\n    .evaluateExpressionGet(\
    \ context, \"#{publisherCtrl}\",\n        PublisherController.class);\n```\n\n\
    此外，我们需要在控制器类中添加一个 `getEntityManager` 方法，如下所示：\n\n```\n@ManagedBean(name=\"publisherCtrl\"\
    )@SessionScoped\npublic class PublisherContext {\n    @PersistenceContext(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource\n    UserTransaction\
    \ ut;\n\n    public EntityManager getEntityManager() {\n        return this.em;\n\
    \    }\n}\n```\n\n当在更新书籍用例中需要自动选择当前出版者时，JSF 需要比较两个出版者实例。由于这个原因，`Publisher` 模型类需要实现\
    \ `equals` 方法。在我们情况下，如果两个出版者的 `name` 属性值相等，则认为这两个出版者是“同一个”的：\n\n```\n@Override\n\
    public boolean equals(Object obj) {\n    if (obj instanceof Publisher) {\n   \
    \     Publisher publisher = (Publisher) obj;\n        return this.name.equals(publisher.name);\n\
    \    } else return false;\n}\n```\n\n### 4.5.3.2 编写视图代码\n\n为了在创建和更新用例中允许选择与当前编辑对象关联的对象，需要一个\
    \ `h:selectOneMenu` 的 HTML 选择列表（select 元素）。位于 `WebContent/views/books/` 文件夹下的\
    \ `create.xhtml` 文件更新为：\n\n```\n<ui:composition template=\"WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n```\n\n```\n<h:panelGrid columns=\"3\">\n  ..\n<h:outputLabel\
    \ for=\"publisher\" value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\"\
    \ value=\"#{book.publisher}\">\n<f:selectItem value=\"\"\n```\n\n转换器通过 `f:converter`\
    \ 元素及其关联的 `@ConverterId` 属性指定。`value` 属性必须与定义转换类时使用的 `@FacesConverter` 注解的 `value`\
    \ 属性相同，例如：\n\n```\n@FacesConverter( value = \"pl.m.converter.PublisherConverter\"\
    )\n```\n\n通常，可以使用转换器的本地类名（例如 `PublisherConverter`），或者在存在命名冲突风险时使用全名（例如 `pl.m.converter.PublisherConverter`）。我们建议在\
    \ #{publisherCtrl.publishers} 表达式中使用全名，这将调用 `Publisher` 类的 `getPublishers` 方法，该方法返回可用出版者的列表：\n\
    \n```public\npublic List<Publisher> getPublishers() {\n  return em;\n}\n```\n\n\
    书籍创建是通过使用 `h:commandButton` 元素实现的。它简单地调用控制器类中的 `create` 方法：\n\n```java\npublic\
    \ String create(String isbn, String title, Integer year, Publisher publisher)\
    \ {\n    try {\n        em.create(isbn, title, publisher);\n        ut.commit();\n\
    \    } catch (Exception e) {\n        ut.rollback();\n        e.printStackTrace();\n\
    \    }\n    FacesContext.getCurrentInstance().remove(\"book\");\n    return \"\
    create\";\n}\n```\n\n更新代码非常相似，唯一的区别是增加了元素（即使用 `h:selectOneMenu`）以便选择要更新的书籍：\n\n\
    ```\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h:form id=\"updateBookForm\" styleClass=\"pure-form pure-form-aligned\"\
    >\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"selectBook\" value=\"Select\
    \ book: />\n<h:selectOneMenu id=\"selectBook\" value=\"#{book.isbn}\">\n<f:selectItem\
    \ value=\"\" itemLabel=\"-\" />\n<f:selectItems value=\"#{bookCtrl.books}\" var=\"\
    b\"\nitemValue=\"#{b.isbn}\" itemLabel=\"#{b.title}\" />\n<f:ajax listener=\"\
    #{bookCtrl.refreshObject(book)}\" render=\"isbn\"/>\n</h:selectOneMenu>\n<h:message\
    \ for=\"selectBook\"/>\n</h:panelGrid>\n<h:commandButton value=\"Update\" action=\"\
    #{bookCtrl.update(book.isbn, book.title, book.year, book.publisher)}\" />\n</h:form>\n\
    </ui:define>\n</ui:composition>\n```\n\n## 5 使用 Java EE 实现单向关联\n\n单向关联是一一对多或多对多的。在这两种情况下，这种关联都通过多值引用属性来表示。\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从具有表示单向关联的多值引用属性的 OO 类模型导出 Java 实体模型；\n- 2. 如何以实体类的形式编写\
    \ Java 实体模型；\n- 3. 如何基于模型代码编写视图和控制器代码。\n\n## 5.1 在 Java 中实现多值引用属性\n\n多值引用属性如 `Book::authors`\
    \ 用于存储内部对象的集合，例如 `Author` 对象的引用。在创建新的 `Book` 类型时，构造函数需要一个参数来为该属性提供合适的值。通常，该值可以是内部对象引用或\
    \ ID 引用。使用 JPA，我们使用对象引用：\n\n```\n@Entity @Table (name=\"books\")\n@ManagedBean\
    \ (name=\"book\")\n@ViewScoped\npublic class Book {\n\n    private Set<Author>\
    \ authors;\n\n    public Book() { // JPA @Entity 注解需要的！\n    public Book( String\
    \ isbn, String title, Integer year,\n                Publisher publisher, Set<Author>\
    \ authors) { . . }\n\n    public Set<Author> getAuthors() { return this.authors;\
    \ }\n    public void setAuthors( Set<Author> authors) { this.authors = authors;\
    \ }\n}\n```\n\n"
