    \nIn Java EE, the serialization from objects to corresponding database records\
    \ as well as the de-serialization from database records to objects are performed\
    \ automatically by the Java EE execution environment based on JPA annotations\
    \ and converter clas-ses for custom conversions."
- md: "\n## 5.5 Write the User Interface Code\n\n### 5.5.1 Show Information About\
    \ Associated Objects in Retrieve/List All\n\nFor showing information about the\
    \ authors of a book in the retrieve/list all books case, the corresponding cell\
    \ in the HTML table is to be filled with a list of the names of all authors. For\
    \ this, we implement a method in the Book class which returns the serialized list\
    \ of author names (in the form, authorName_1, authorName_2, ..., authorName_n):\n\
    \n```java\npublic String getAuthorNames() {\n    String result = \"\";\n    int\
    \ i = 0, n = 0;\n    if (this.authors != null) {\n        n = this.authors.size();\n\
    \        for (Author author : this.authors) {\n            result += author.getName();\n\
    \            if (i < n - 1) {\n                result += \",\";\n            }\n\
    \            i++;\n        }\n    }\n    return result;\n}\n```\n\nIn the file\
    \ `retrieveAndListAll.xhtml` in the folder `WebContent/views/books/`, this method\
    \ is invoked in the JSF expression of the \"Authors\" column:\n\n```xml\n<ui:composition\
    \ template=\"WEB-INF/templates/page.xhtml\">\n  <ui:define name=\"content\">\n\
    \    <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n      <h:column>\n\
    \        <f:facet name=\"header\">Publisher</f:facet>\n        #{b.publisher.name}\n\
    \      </h:column>\n      <h:column>\n        <f:facet name=\"header\">Authors</f:facet>\n\
    \        #{b.authorNames}\n      </h:column>\n    </h:dataTable>\n    <h:button\
    \ value=\"Back\" outcome=\"index\" />\n  </ui:define>\n</ui:composition>\n```\n\
    \nRecall that using `b.authorNames` results in invoking a method named `getAuthor`\
    \ on the given `b` object.\n\n### 5.5.2 Allow Selecting Associated Objects in\
    \ Create\n\nFor allowing to select multiple authors to be associated with a book\
    \ in the create book case, a multiple selection list (a select element with `multiple=\"\
    multiple\"`), as shown in the facet col below, is populated with the instances\
    \ of the associated object type. The following code is part of the `create.xhtml`\
    \ view file in the folder `WebContent/views/`:\n\n```xml\n<ui:composition template=\"\
    WEB-INF/templates/page.xhtml\">\n  <ui:define name=\"content\">\n    <h:form id=\"\
    createBookForm\">\n      <h:panelGrid columns=\"3\">\n        <h:outputLabel for=\"\
    authors\" value=\"Authors\"/>\n        <h:selectManyListbox id=\"authors\" value=\"\
    #{book.authors}\" var=\"a\">\n          itemLabel=\"#{a.name}\" itemValue=\"#{a}\"\
    \ />\n          <f:converter converterId=\"AuthorConverter\"/>\n        </h:selectManyListbox>\n\
    \        <h:message for=\"authors\" errorClass=\"error\"/>\n      </h:panelGrid>\n\
    \      <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn,\
    \ book.title, book.publisher, book.authors)}\" />\n      <h:button value=\"Back\"\
    \ outcome=\"index\" />\n    </h:form>\n  </ui:define>\n</ui:composition>\n```\n\
    \nRemember that we have to add the `equals` method for the Author model class.\
    \ In our case, two authors are \"one and the same\" if the values of their `personId`\
    \ property are equal:\n\n```java\n@Override\npublic boolean equals(Object obj)\
    \ {\n    if (obj instanceof Author) {\n        Author author = (Author) obj;\n\
    \        return (this.personId.equals(author.personId));\n    } else return false;\n\
    }\n```\n\nLike the case of Publisher, a JSF converter class is used to serialize\
    \ objects to display strings when the select list is populated, and back to objects\
    \ when the create method of the BookController is de called (the “Create” button\
    \ was pushed by the user). The `BookController.create` method is extended with\
    \ a new parameter, the authors list:\n\n```java\npublic String create(String isbn,\
    \ String title, Integer year,\n                     Publisher publisher, Set<Author>\
    \ authors) {\n    try {\n        Book.create(em, ut, isbn, title, year, publisher,\
    \ authors);\n        // Enforce clearing the form after creating the Book record\n\
