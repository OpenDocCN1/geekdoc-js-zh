    \ single-valued property, code the specified getter and setter such that in each\
    \ setter, the corresponding property check is invoked and the property is only\
    \ set/unset, if the check does not detect any constraint violation.\n- 3. For\
    \ each multi-valued property, code its add and remove operations, as well as the\
    \ specified get/set operations:\n  - 1. Code the add/remove operations as (instance-level)\
    \ methods that invoke the corresponding property checks.\n  - 2. Code the setter\
    \ so that it invokes the add operation for each item of the collection to be assigned.\n\
    \  - 4. Write the code of serialization toString() and the object-storage conversion\
