    \      \"The subject area must be a non-empty string!\"\n    );\n  } else {\n\
    \    return new ConstraintViolation();\n  }\n}\n```\n\n在序列化函数 `toString` 中，我们在\
    \ `switch` 语句中序列化 `category` 属性和段属性：\n\n```js\ntoString() {\n  var bookStr = \"\
    Book{ ISBN: \" + this.isbn + \", title: \" + \n    this.title + \", year: \" +\
    \ this.year;\n  switch (this.category) {\n    case BookCategoryEL.TEXTBOOK:\n\
    \      bookStr += \", textbook subject area: \" + this.subjectArea;\n      break;\n\
    \    case BookCategoryEL.BIOGRAPHY:\n      bookStr += \", biography about: \"\
    \ + this.about;\n      break;\n  }\n  return bookStr + \"}\";\n}\n```\n\n在模型类的\
    \ `update` 方法中，只有当属性需要更新时才进行设置，即当存在对应的参数槽且其值与旧属性值不同时。对于具有冻结值约束（Frozen Value Constraint）的\
    \ `category` 属性的特殊情况，我们需要确保只有在尚未赋值的情况下才能连同配套的一组段属性一起更新。因此，在 `update` 方法中，我们对 `book.category\
    \ === undefined` 进行特殊测试以处理初始赋值的特殊情况，而以更标准的方式处理段属性 `subjectArea` 的更新：\n\n```js\n\
    update({isbn, title, year, category, subjectArea, about}) {\n  if (isbn !== undefined)\
    \ this.isbn = isbn;\n  if (title !== undefined) this.title = title;\n  if (year\
    \ !== undefined) this.year = year;\n  if (category !== undefined) {\n    if (this.category\
    \ === undefined) {\n      this.category = category;\n    } else {\n      throw\
    \ new FrozenConstraintViolation(\"The category cannot be changed!\");\n    }\n\
    \  }\n  if (subjectArea !== undefined) {\n    var err = Book.checkSubjectArea(subjectArea,\
    \ this.category);\n    if (!(err instanceof ConstraintViolation)) {\n      this.subjectArea\
    \ = subjectArea;\n    } else {\n      throw err;\n    }\n  }\n  if (about !==\
    \ undefined) {\n    var err = Book.checkAbout(about, this.category);\n    if (!(err\
    \ instanceof ConstraintViolation)) {\n      this.about = about;\n    } else {\n\
    \      throw err;\n    }\n  }\n}\n```\n\n"
