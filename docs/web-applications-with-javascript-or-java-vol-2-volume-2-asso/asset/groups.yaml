    \ Serialization and Object-to-Storage Mapping\n\nWe need a serialization function\
    \ `toString()` for converting an object to a human-readable string that can be\
    \ used for showing an object in a user interface, and an object-record mapping\
    \ function `toRecord()` converting a typed object to a corresponding record that\
    \ can be saved in a persistent data-store. In both cases, internal object references\
    \ are converted to ID references.\n\nThe `Book::toString()` function creates a\
    \ representation that may only contain the relevant properties. The simplest method\
    \ for showing a set of associated objects, like the authors of a book, is creating\
    \ a comma-separated list of IDs:\n\n```javascript\ntoString() {\n  var bookStr\
    \ = `Book: ISBN: ${this.isbn}, title: ${this.title}, year: ${this.year}`;\n  if\
    \ (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n  return\
    \ bookStr + `, authors: \" + Object.keys(this.authors).join(\", \");\n}\n```\n\
    \nThe `Book::toRecord()` function needs to serialize all property slots of an\
    \ object. This involves deleting the underscore prefix for obtaining the corresponding\
    \ record field name:\n\n```javascript\ntoRecord() {\n  var rec = {};\n  for (let\
    \ p of Object.keys(this)) {\n    // copy only property slots with underscore prefix\n\
    \    if (p.charAt(0) !== \"_\") continue;\n    switch (p) {\n      case \"_publisher\"\
    :\n        // convert object reference to ID reference\n        if (this._publisher)\
    \ rec.publisher_id = this._publisher.name;\n        break;\n      case \"_authors\"\
    :\n        // convert map of object references to list of ID references\n    \
    \    rec.authorIdRefs = [];\n        Object.keys(this.authors).forEach(authorIdStr\
    \ => {\n          rec.authorIdRefs.push(parseInt(authorIdStr));\n        });\n\
    \        break;\n      default:\n        // remove underscore prefix\n       \
    \ rec[p.substr(1)] = this[p];\n    }\n  }\n  return rec;\n}\n```\n\n## 3.5 Code\
    \ the View\n\n### 3.5.1 Showing Information About Associated Objects in Retrieve/List\
