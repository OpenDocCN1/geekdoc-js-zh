    \n## 4.5.3 Allow Selecting Associated Objects in Create and Update\n\nIn this\
    \ section, we discuss how to create and update an object which has reference properties,\
    \ such as a Book object with the reference property publisher.\n\n### 4.5.3.1\
    \ Create the Object-to-String Converter\n\nHTML requires string or number values\
