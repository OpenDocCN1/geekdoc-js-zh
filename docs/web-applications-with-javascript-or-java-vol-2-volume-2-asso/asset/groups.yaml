    \ < 1 ||\n    parseInt(c) > CategoryEL.MAX) {\n    return new RangeConstraintViolation(\n\
    \      \"Invalid value for category: \" + c);\n  } else {\n    return new NoConstraintViolation();\n\
    \  }\n}\nset category(c) {\n  var validationResult = null;\n  if (this.category)\
    \ { // 已设置/赋值\n    validationResult = new FrozenConstraintViolation(\n      \"\
    The category cannot be changed!\");\n  } else {\n    validationResult = Book.checkCategory(c);\n\
    \  }\n  if (validationResult instanceof NoConstraintViolation) {\n    this._category\
    \ = parseInt(c);\n  } else {\n    throw validationResult;\n  }\n}\n```\n\n虽然段属性（在本例中：`subjectArea`\
    \ 和 `about`）的 getter 遵循标准模式，但它们的检查和 setter 必须确保该属性适用于被检查实例的类别。这通过检查属性值和类别的组合来实现，如下例所示：\n\
    \n```js\nstatic checkSubjectArea(sa, c) {\n  if (c === BookCategoryEL.TEXTBOOK\
