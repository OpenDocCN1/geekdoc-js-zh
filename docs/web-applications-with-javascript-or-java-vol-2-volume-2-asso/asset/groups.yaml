    ## 1.8 在用户界面中渲染引用属性


    ## 1.9 多值引用属性的集合类型


    CRUD 数据管理用户界面 (UI) 中用于数据输入和输出的组件通常对应于应用模型类中定义的属性。我们必须区分对应于（各种类型）属性的（各种）输入字段，以及对应于枚举属性或引用属性的选择组件（如选择列表）。在
    UI 中使用选择控件（select controls）而不是输入字段来表示引用属性，可以防止用户输入无效的 ID 引用，从而维护引用完整性。


    通常，单值引用属性可以渲染为 UI 中的选择列表，无论填充该引用属性范围的对象有多少个，只需从中选出一个特定的选项即可。如果引用属性范围的基数足够小（例如，不超过
    7 个），我们也可以使用单选按钮组（radio button group）代替列表。


    多值引用属性可以渲染为 UI 中的多选列表。然而，一旦有许多（例如超过 20 个）选项可供选择，HTML 对应的多选控件就变得不再好用了，因为读者选择的方式在视觉上太分散了。在只有少数（例如不超过
    7 个）选项的特殊情况下，我们也可以复选框组（checkbox group）代替多选列表。但对于在 UI 中包含从引用属性范围类中选择的所有关联对象的通用情况，我们需要开发一种特殊的
    UI 组件，允许从已选对象列表中（添加）或（移除）对象。


    这种多选择组件由：


    - 一个 HTML 列表元素，包含从引用属性范围类中选择的所有关联对象；

    - 一个选择列表，允许将对象添加到已选对象列表中；

    - 一个按钮，允许从已选对象列表中移除对象。


    默认情况下，非功能性关联将目标类的实例集与源类关联，这意味着属性的集合值是集合（sets）。


    在以下示例中，关联端无序的，而集合是有序的。


    ## 1.16 引用属性单向关联


    | 出版社 | 书籍 | 作者 |

    | :--- | :--- | :--- |

    | isbn[1] : String (id) | name : String (id) | personid : Integer (id) |

    | title[1] : String | address : String | | |

    | year[1] : Integer | | | |

    | publisher[0..1] : Publisher | | | |

    | authors[*] : Author | | |


    注意对于非功能性关联，通常使用集合（sets）而不是序列（sequences）来处理对象集合。


