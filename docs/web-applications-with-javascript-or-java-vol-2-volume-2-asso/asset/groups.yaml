    # 7 双向关联


    在派生反向引用属性为多值而其反向属性为单值的情况下（如下图 7.4 所示，`Publisher::publishedBooks` 由 `Book::publisher`
    派生），生命周期依赖关系意味着：


    - 1. 每当创建一个“基对象”（如书）时，都必须通过向其值集中添加指向新基对象的引用，来更新相应的反向属性（即向 `Publisher::publishedBooks`
    中添加指向新对象的对象的引用）；

    - 2. 每当基属性被更新时（例如，为一本书分配了新的出版商），也必须更新相应的反向属性（在我们的示例中为 `Publisher::publishedBooks`），即从其值集中移除该对象引用并添加新的引用；

    - 3. 每当一个基对象（如书）被销毁时，都必须通过从其值集中移除该基对象来更新相应的反向属性（从 `Publisher::publishedBooks`
    中移除指向待销毁对象的引用）。


    请注意，从纯粹计算的角度来看，我们可以自由地选择两个互反的引用属性之一（如 `Book::authors` 和 `Author::authored`）作为主属性。然而，在许多情况下，关联代表了不对称的本体论存在，这决定了两个互反引用属性中哪一个是主。例如，`Book`
    和 `Author` 类之间的作者关系关联代表了书籍对其作者的本体论存在依赖。一本书在存在上依赖于其作者（们），而作者并不在存在上依赖于她的任何书。因此，`Book`
    和 `Author` 之间对应的对象生命周期依赖意味着，它们的双向关联是通过在 `Book::authors` 中维护 `Author` 引用来维持的，因为
    `Author::authoredBooks` 是主属性的自然选择，而 `Author` 是从属性，它从 `Book::authors` 派生而来。


    # 7.2 构建 OO 类模型


    由于经典的 OO 语言不支持将显式关联作为一等公民，而仅支持带有引用属性的类来表示隐式关联，我们必须消除所有显式关联以获取 OO 类模型。


    ## 7.2.1 基础属性


    我们消除关联过程的起点是一个包含各种单向和双向关联的信息设计模型，如图 7.1 所示的模型。如果模型仍然包含任何非导向关联，我们必须通过对末端所有权做出决策来将其转换为导向关联，这通常基于导航性需求。


    请注意，在 `Publisher-Book-Author` 信息设计模型中，两个关联——`publisher-publishedBooks` 和 `authored-authors`（或
    `Authorship`）都是双向的，如关联两端的所有权点所示。若要从信息设计模型中消除显式关联，我们必须执行以下步骤：


    - 1. 消除连接源类与目标类的单向关联，通过将其替换为源类中的一个引用属性，使目标类成为其范围（range）。

    - 2. 通过将它们替换为一对互反的引用属性来消除双向关联。


    ## 7.2.2 如何消除单向关联


    连接源类与目标类的单向关联被替换为其源类中对应的引用属性，该属性的范围为目标类。其多重性与目标关联端的多重性相同。它的名称是关联末端的名称（如果有任何的话），否则被设为目标类的名称（如果引用属性是多值的，则可能使用复数形式）。


    ## 7.2.3 如何消除双向关联


    双向关联（如图 7.1 所示模型中 `Book` 和 `Author` 类之间的作者关联）被替换为一对互反的引用属性，如 `Book::authors` 和
    `Author::authoredBooks`。由于两个引用属性代表相同的信息（同一组二元关系集合），因此可以选择将其中一个视为“主”，另一个视为“从”，后者由“主”派生而来。我们讨论了一一对一关联和多对多关联的情况。


    - 1. 在双向一对一关联的情况下，这会在两个关联类中的每个类产生一对互反的单值引用属性。由于两者本质上代表相同的信息（链接/关系的集合），必须选择其中哪一个被视为主属性，使得另一个成为从属性，该从属性通过反转从主属性派生。在类图中，从属性被指定为派生属性，每当发生以下情况时会自动更新：1)
    创建了新的主对象，2) 主引用属性被更新，或 3) 主对象被销毁。这种转换如图 7.2 所示。


    | Committee | chairedCommittee | ClubMember |

    | --- | --- | --- |

    | name : String | 0..1 | 1 |


    ![](img/26c953d1023457333859f69258a99556_103_0.png)


    | Committee | ClubMember |

    | --- | --- |

    | name : String | /chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | |


    图 7.2: 将双向一对一关联转换为互反的主从属性。


    - 2. 双向多对多关联映射为一对互反的多值引用属性，位于关联的两个类中。同样，在参与关联的其中一个类中，多值属性被指定为派生属性，当另一个类的对应属性更新时自动更新。这种转换如图
    7.3 所示。


    | Book | Author |

    | --- | --- |

    | isbn : String | personid : Integer |

    | title : String | name : String |

    | * | * |


    ![](img/26c953d1023457333859f69258a99556_103_1.png)


    | Book | Author |

    | --- | --- |

    | isbn[1] : String | personID[1] : Integer |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | /authoredBooks[*] : Book (inverse of author)


    图 7.3: 将双向多对多关联转换为互反的主从属性。


    ## 7.2.4 OO 类模型


    将所有双向关联替换为引用属性后，我们获得了图 7.4 所示的 OO 类模型。


    | Book | Publisher |

    | --- | --- |

    | isbn[1]: String (id) | name[1]: String (id) |

    | title[1]: String | address[1]: String |

    | year[1]: Integer | /publishedBooks[*]: Book (inverse of publisher) |

    | publisher[0..1]: Publisher | Author |

    | authors[*]: Author | personId[1]: integer |

    | name[1]: String | /authoredBooks[*]: Book (inverse of author) |


    图 7.4: 具有两个互反属性对的 OO 类模型。


    由于书籍本质上依赖于可能存在的出版商，而不是反过来，因此在书籍对象中维护主引用，并将出版商和作者对象中的反向引用视为派生的（从）数据。因此，我们将 `publishedBooks`
    和 `authoredBooks` 定义为派生引用属性，这在 OO 模型中通过斜杠前缀指示。


    该 OO 类模型的意义可以通过涉及三个模型类的示例数据填充来说明：


