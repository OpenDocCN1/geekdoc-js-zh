- md: "\n## 4.3 Implementing Unidirectional Non-Functional Associations with Plain\
    \ JS\n\nThis model contains, in addition to the single-valued reference property\
    \ Book::publisher representing the unidirectional many-to-one association Book-hasPublisher,\
    \ the multi-valued reference property Book::authors representing the unidirectional\
    \ many-to-many association Book-hasAuthor.\n\nFor deriving a JS class from the\
    \ OO class model we have to follow the same steps as in 2.3 and, in addition,\
    \ we have to take care of multi-valued reference properties, such as Book::authors;\
    \ for which we\n\n- 1. create a class-level check operation, such as checkAuthor,\
    \ which is responsible for checking the corresponding referential integrity constraint\
    \ for the references to be added to the property's collection;\n- 2. create an\
    \ add operation, such as addAuthor, for adding a reference to the collection;\n\
    - 3. create a remove operation, such as removeAuthor, for removing a reference\
    \ from the collection.\n\nThis leads to the following JS class model:\n\n| Book\
