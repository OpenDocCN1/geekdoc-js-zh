    \ to code the JS class model in the form of JS model classes,\n- 3. how to write\
    \ the view and controller code based on the model code.\n\n### 13.1 Subtyping\
    \ with Constructor-Based Classes\n\nAs of the version ES2015, JavaScript did not\
    \ have an explicit class concept and subtyping was not directly supported, so\
    \ it had to be implemented with the help of certain code patterns providing two\
    \ inheritance mechanisms: (1) inheritance of properties and (2) inheritance of\
    \ methods.\n\nAs we explained in Chapter 1 of Volume 1, classes can be defined\
    \ in two alternative ways: constructor-based and factory-based. Both approaches\
    \ have their own way of implementing inheritance.\n\nWe summarize the ES2015 code\
    \ pattern for defining a superclass and a subclass in a constructor-based single-inheritance\
    \ class hierarchy with the help of the following example:\n\n| Person |\n|---|\n\
    | firstName : String |\n| lastName : String |\n| Student |\n| studNo : Integer\
    \ |\n\nThen, we define a base class, Person, with two properties, firstName and\
    \ lastName, defined with getters and setters:\n\n```javascript\nclass Person {\n\
    \  constructor ({first, last}) {\n    // assign properties by invoking their setters\n\
    \    this.firstName = first;\n    this.lastName = last;\n  }\n\n  getFirstName\
    \ () {return this._firstName};\n  setFirstName (f) {\n    // . . . check constraints\n\
    \    this._firstName = f;\n  }\n\n  getLastName () {return this._lastName};\n\
    \  setLastName (l) {\n    // . . . check constraints\n    this._lastName = l;\n\
    \  }\n}\n```\n\nThen, we define a subclass, Student, with one additional property,\
    \ studNo:\n\n```javascript\nclass Student extends Person {\n  constructor ({first,\
    \ last, studNo}) {\n    // invoke constructor of superclass\n    super({first,\
    \ last});\n    // assign additional properties\n    this.studNo = studNo;\n  }\n\
    \n  get studNo () {return this._studNo;}\n  set studNo (sn) {\n    // check constraints\n\
    \    this._studNo = sn;\n  }\n}\n```\n\nNotice how the constructor of the superclass\
    \ is invoked: with super({first, last}).\n\n### 13.2 Case Study 1: Eliminating\
    \ a Class Hierarchy\n\nSimple class hierarchies can be eliminated by applying\
    \ the Class Hierarchy Merge design pattern. The starting point for our case study\
    \ is the simple class hierarchy shown in information model of Figure 12.1, representing\
