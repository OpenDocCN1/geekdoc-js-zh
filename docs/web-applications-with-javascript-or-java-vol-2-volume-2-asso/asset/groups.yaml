    \ |\n\n# 9 Implementing Bidirectional Associations with Java EE\n\n## 9.2 Write\
    \ the Model\n\nThe Java Entity model can be directly coded for getting the model\
    \ layer code of our Java back-end app.\n\n### 9.2.1 New Issues\n\nCompared to\
    \ the unidirectional association app discussed before, we have to deal with a\
    \ number of new technical issues:\n\n- 1. In the model code you now have to take\
    \ care of maintaining the derived inverse reference properties by maintaining\
    \ the derived (sets) of inverse references that form the values of a derived inverse\
    \ reference property. In particular\n  1. whenever the value of a single-valued\
    \ master reference property is initialized or updated with the help of a setter\
    \ (such as assigning a reference to an Publisher instance p to b.publisher for\
    \ a Book instance b), an inverse reference has to be assigned or added to the\
    \ corresponding value of the derived inverse reference property (such as adding\
    \ b to p.publishedBooks); when the value of the master reference property is updated\
    \ or multi-valued, the obsolete inverse reference to the previous value of the\
    \ single-valued master reference property must be deleted;\n  2. whenever the\
    \ value of an optional single-valued master reference property is unset (eg. by\
    \ assigning null to b.publisher for a Book instance b), the inverse reference\
    \ has to be removed from the corresponding value of the derived inverse reference\
    \ property (such as removing b from p.publishedBooks); if the derived inverse\
    \ reference property is multi-valued, otherwise the corresponding value of the\
    \ derived inverse reference property has to be multi-valued, otherwise it has\
    \ to be unset or updated;\n  3. whenever a reference is added to the value of\
    \ a multi-valued master reference property with the help of an add method (such\
    \ as adding an Author reference to b.authors for a Book instance b), an inverse\
    \ reference has to be assigned or added to the corresponding value of the derived\
    \ reference property (such as adding b to a.authoredBooks);\n  4. whenever a reference\
    \ is removed from the value of a multi-valued master reference property with the\
    \ help of a remove method (such as removing a reference to an Author instance\
    \ from b.authors for a Book instance b), the inverse reference has to be removed\
    \ from the corresponding value of the derived inverse reference property (such\
    \ as removing b from a.authoredBooks), if the derived inverse reference property\
    \ is multi-valued, otherwise the corresponding value of the derived inverse reference\
    \ property is to be unset or updated;\n- whenever an object with a single reference\
    \ or multiple references the value of a master reference property is destroyed\
    \ (e.g., when a Book instance with a single reference b.publisher to a Publisher\
    \ instance p is destroyed), the derived inverse references have to be removed\
    \ first (e.g., by removing p from p.publishedBooks).\nNotice that when a new object\
    \ is created with a single reference or multiple references (e.g., a new Book\
    \ instance with a single reference b.publisher), its setter or add method will\
    \ be invoked and will take care of creating the inverse references.\n\n- In the\
    \ UI code we can now exploit the inverse reference properties for more efficiently\
    \ creating a list of inversely associated objects in the list objects use case.\
    \ For instance, we can more efficiently create a list of all published books for\
    \ each publisher.\n\n### 9.2 Write the Model Code\n\n### 9.2.2 Summary\n\n- Code\
    \ each class of the Java Entity.\n- Code the inverse property with the property\
    \ modifier.\n- Code the inverse reference with the @ToMany annotation.\n- Code\
    \ the getters and setters as well as the create, update and delete operations.\n\
    - Code the multi-valued property management with the add and remove methods.\n\
    \n### 9.2.3 Code Each Class of the Java Entity Model\n\nIn the Publisher class,\
    \ we add the publishedBooks property and we use the @ToMany annotation corresponding\
    \ to manyToOne from the Book class:\n\n```java\n@Entity\npublic class Publisher\
    \ {\n    @OneToMany(fetch=FetchType.EAGER, mappedBy=\"publisher\")\n    private\
    \ Set<Book> publishedBooks;\n}\n```\n\nThe mappedBy parameter of the @OneToMany\
    \ annotation of publishedBooks specifies the property in the Book class:\n\n```java\n\
    @Entity\npublic class Book {\n    @OneToOne(fetch=FetchType.EAGER)\n    @JoinColumn(name=\"\
    publisher\")\n    private Publisher publisher;\n}\n```\n\nIn the Author class\
    \ we add the authoredBooks property with the @ToMany annotation corresponding\
    \ to manyToMany from the Book class:\n\n```java\n@Entity\npublic class Author\
    \ {\n    @OneToMany(fetch=FetchType.EAGER, mappedBy=\"authors\")\n    private\
    \ Set<Book> authoredBooks;\n}\n```\n\nThe mappedBy attribute of the @ManyToMany\
    \ annotation for authoredBooks property of the Author class specifies the name\
    \ of the inverse property in the Book class:\n\n```java\n@Entity\npublic class\
    \ Book {\n    @ManyToMany(fetch=FetchType.EAGER)\n    @JoinTable(\n        name=\"\
    books_authors\",\n        joinColumns = @JoinColumn(name=\"BOOK_ISBN\"),\n   \
    \     inverseJoinColumns = @JoinColumn(name=\"AUTHOR_PERSONID\")\n    )\n    private\
    \ Set<Author> authors;\n}\n```\n\nWe also use the @JoinTable annotation to specify\
    \ the join table name for the Many-To-Many relation and the corresponding column\
    \ names for the join table, e.g., the table is books_authors and the columns are\
    \ named BOOK_ISBN and AUTHOR_PERSONID.\n\n### 9.2.4 Code the Setter Operations\n\
    \nAny setter for a reference property that is coupled to a derived inverse reference\
    \ property (implementing a bidirectional association), now also needs to assign/add/remove\
    \ inverse references to/from the corresponding value (set) of the inverse property.\
    \ An example of such a setter is the following setPublisher method:\n\n```java\n\
    public class Book {\n\n  public void setPublisher(Publisher publisher) {\n   \
    \ // remove the book reference from publisher.publishedBooks\n    if (this.publisher\
    \ != null) {\n      this.publisher.removePublishedBook(this);\n    }\n    // add\
    \ the book to publisher.publishedBooks\n    if (publisher != null) {\n      publisher.addPublishedBook(this);\n\
    \    }\n    this.publisher = publisher;\n  }\n\n}\n```\n\n### 9.2.5 Code the Add\
    \ and Remove Operations\n\nFor any multi-valued reference property that is coupled\
    \ to a derived inverse reference property, both the add and the remove method\
    \ also have to assign/add/remove corresponding references to/from (the value set\
    \ of) the inverse property.\n"
