    \n实体类的创建如下：\n\n```\n@Entity @Table(name=\"author\")\n@ViewScoped(@ManagedBean(name=\"\
    author\"))\npublic class Author {\n    // 属性\n    @Id\n    private Integer personId;\n\
    \    // ... (省略)\n}\n```\n\n*(注：由于原文第86-87页的 OCR 文本存在严重碎片化/损坏，已根据可见片段和标准 JPA 模式重新整理了逻辑流。)*\n\
    \n### 5.4.3 实现删除策略\n\n对于引用属性 `Book::authors`，必须在 `delete` 方法中实现删除策略：\n\n```java\n\
    public static void delete(EntityManager em, UserTransaction ut,\nInteger personId)\
    \ throws Exception {\n    ut.begin();\n    Author author = em.find(Author.class,\
    \ personId);\n    // 查找该作者的所有书籍\n    Query query = em.createQuery(\"SELECT DISTINCT\
    \ b FROM Book b \" +\n    INNER JOIN b.authors WHERE a.personId = :personId\"\
    );\n    query.setParameter(\"personId\", personId);\n    List<Book> books = query.getResultList();\n\
    \    // 从书籍的作者列表中移除该作者\n    for (Book b : books) {\n      b.getAuthors().remove(author);\n\
    \    }\n    // 删除作者记录（表行）\n    em.remove(author);\n    ut.commit();\n}\n```\n"
