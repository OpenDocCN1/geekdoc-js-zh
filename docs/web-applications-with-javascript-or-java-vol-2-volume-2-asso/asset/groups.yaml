    \ : AbTypeEL | Bcd |\n| a2[0..1] : String | Cde |\n| a3[0..1] : String | |\n\n\
    我们现在从这个模型推导出 JS 类模型。\n\n#### 13.2.2 新问题\n\n与第一卷第11章讨论的枚举相比，我们需要处理许多新问题：\n\n- 1.\
