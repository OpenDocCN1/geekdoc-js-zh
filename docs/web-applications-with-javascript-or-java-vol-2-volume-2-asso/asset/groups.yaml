    In the case of a single-valued reference property (representing a functional association)
    annotated with @OneToOne or @ManyToMany, the default value is FetchType.EAGER,
    so referenced entities are fetched together with referencing entities, while in
    the case of a non-functional association (with either @ToMany or @ManyToMany),
    the default value is FetchType.LAZY, so referenced entities are not fetched together
    with referencing entities, but have to be retrieved separately, if needed.


