    \    document.getElementById(\"Publisher-M\").style.display = \"none\";\n    document.getElementById(\"\
    Publisher-R\").style.display = \"block\";\n  }\n};\n```\n\n## 9 使用 Java EE 实现双向关联\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从 OO 模型（派自信息设计模型）推导出**实体类模型**，\n- 2. 如何以实体类的形式编码实体模型（代表**模型类**），\n\
    - 3. 如何基于实体类编写视图和控制器代码。\n\n## 9.1 创建 Java 实体模型\n\n制作 Java 实体模型的起点是带有派生属性的 OO 类模型（如图所示），为了方便起见，在此展示：\n\
    \n| Book | Publisher |\n| --- | --- |\n| isbn[1]: String (id) | name[1]: String\
    \ (id) |\n| title[1]: String | address[1]: String |\n| year[1]: Integer | /publishedBooks[*]:\
    \ Book (inverse of publisher) |\n| publisher[0..1]: Publisher | Author |\n| authors[*]:\
    \ Author | personid[1]: Integer (id) |\n| | name[1]: String |\n| | /authoredBooks[*]:\
