    \ 类层次结构映射到一组通过外键依赖相互关联的三个数据表。\n\n在两个案例研究中，我们展示了：\n\n- 1. 如何推导出 JS 类模型以及相应的实体表模型，\n\
    - 2. 如何以 JS 模型类的形式编写 JS 类模型，\n- 3. 如何基于模型代码编写视图和控制器代码。\n\n### 13.1 基于构造函数的类的子类型\n\
    \n截至 ES2015 版本，JavaScript 还没有显式的类概念，且不支持直接支持子类型，因此必须借助某些提供两种继承机制的代码模式来实现，这些机制是：(1)\
    \ 属性继承和 (2) 方法继承。\n\n正如我们在第一卷第一章中解释的那样，类可以通过两种替代方式定义：基于构造函数的（constructor-based）和基于工厂的（factory-based）。这两种方法都有各自实现继承的方式。\n\
    \n我们通过以下示例总结了 ES2015 代码模式，用于在构造函数的单继承类层次结构中定义父类和子类：\n\n| Person |\n|---|\n| firstName\
    \ : String |\n| lastName : String |\n| Student |\n| studNo : Integer |\n\n然后，我们定义了一个基类\
