    \ “Update book” use cases by:\n\n- Adding a segment information column (with heading\
    \ “Category”) to the display table of the “Retrieve and list all books” use case\
    \ in books.html.\n- Adding a “Category” selection field, and input fields for\
    \ all segment properties, in the forms of the “Create book” and “Update book”\
    \ use cases in books.html. The form fields for segment properties are only displayed,\
    \ when a corresponding category has been selected.\n\n### 13.2.4.2 Add a Segment\
    \ Information Column in Retrieve/List All\n\nWe add a “special type” category\
    \ to the display table of the “List all books” use case in books.html.\n\n```html\n\
    <table id=\"books\">\n  <head><tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th></tr></head>\n\
    \  <tbody></tbody>\n</table>\n```\n\nA book without a special category will have\
    \ an empty table cell in this column, for all other books their category will\
    \ be shown in this column, with category-specific information. This requires a\
    \ corresponding switch statement in pl.v.books.retrieveAndListAll.setupUserInterface\
    \ in the view/books.js file:\n\n```js\nif (book.category) {\n  switch (book.category)\
    \ {\n    case BookCategoryEL.TEXTBOOK:\n      row.insertCell(-1).textContent =\
    \ book.subjectArea + \" textbook\";\n      break;\n    case BookCategoryEL.BIOGRAPHY:\n\
    \      row.insertCell(-1).textContent = \"Biography about \" + book.about;\n \
    \     break;\n  }\n}\n```\n\n### 13.2.4.3 Add a Category Selection Field in Create\
    \ and Update\n\nIn both cases, we need to allow selecting a special category of\
    \ book ('textbook' or 'biography') with the help of a selection field, as shown\
    \ in the following HTML fragment:\n\n```html\n<div class=\"field\">\n  <label>Category:\
    \ <select name=\"category\"></select></label>\n</div>\n<div class=\"field\" Textbook<!--\
    \ conditional field -->\n  <label>Subject area: <input type=\"text\" name=\"subjectArea\"\
    \ /></label>\n</div>\n<div class=\"field\" Biography<!-- conditional field -->\n\
    \  <label>About: <input type=\"text\" name=\"about\" /></label>\n</div>\n```\n\
    \nNotice that we have added \"Textbook\" and \"Biography\" as additional values\
