    Person 来对这两个对象类型进行泛化，如图 12.3 的图表所示。


    在泛化两个或多个对象类型时，我们将它们共享的特征移动到新添加的超类型中，并进行集中管理。在 Employee 和 Author 的情况下，这组共享特征由属性
    `name`、`dateOfBirth` 和 `dateOfDeath` 组成。通常，共享特征可能包括属性、关联和约束。


