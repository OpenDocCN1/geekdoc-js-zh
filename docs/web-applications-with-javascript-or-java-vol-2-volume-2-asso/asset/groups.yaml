    | 1001 | Harry Wagner | 1956年出生于马萨诸塞州波士顿. . . . |

    | 1077 | Immanuel Kant | 埃曼纽尔·康德 (1724–1804) 是一位德国哲学家. . . . |


    | person_id | name | emp_no |

    |---|---|---|

    | 1001 | Harry Wagner | 21035 |


