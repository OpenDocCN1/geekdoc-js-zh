    ## 7 Bidirectional Associations


    In OO modeling and programming, a bidirectional association is an association
    that is represented as a pair of mutually inverse reference properties, which
    allow ''navigation'' (object access) in both directions.

    The model shown in Figure 7.1 below (about publishers, books and their authors)
    serves as our running example. Notice that it contains two bidirectional associations,
    as indicated by the ownership dots at both association ends.


    | Publisher | published Books | Book | authored Books | Author |

    | :--- | :--- | :--- | :--- | :--- |

    | name : String (id) | | isbn : String (id) | | person : Integer (id) |

    | address : String | 0..1 | * | year : Integer | * | name : String |


    Figure 7.1: The Publisher-Book-Author design model with bidirectional associations.


    ### 7.1 Inverse Properties


    For being able to easily retrieve the committees that are chaired or co-chaired
    by a club member, we add two reference properties to our Committee-ClubMember
    example: the property of a club member to be the chair of a committee (ClubMember::sharedCommittee)
    and the property of a club member to be the co-chair of a committee (ClubMember::coChaired)
    may chair or co-chair at one committee (where the disjunction is exclusive). So,
    we get the following model:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..] : Committee |

    | chair : ClubMember | coChairedCommittee[0..] : Committee |


    Notice that there is a close correspondence between the two reference properties
    Committee::chair and ClubMember::chairedCommittee. They are the inverse of each
    other: when the club member is the chair of the committee, expressed by the tuple
    ("budget committee", "Tom"), then the committee is chaired by the club member,
    expressed by the inverse tuple ("Tom", "budget committee"). For expressing this
    inverse correspondence in the diagram, we append a constraint {inverse of chair}
    in curly braces to the declaration of the property ClubMember::chairedCommittee,
    and a similar one to the property Committee::chair, as shown in the following
    diagram:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember (inverse of chairedCommittee) | coChairedCommittee[0..1]
    : Committee |


    Using the reference path notation of OOP, with c referencing a Committee object,
    we obtain the equation:


    ```

    c.chair.chairedCommittee = c (7.1)

    ```


    Or, the other way, with m referencing a Committee object, we obtain the equation:


    ```

    m.chairedCommittee.chair = m (7.2)

    ```


    Notice when the property $p_2$ is the inverse of a property $p_1$, this implies
    that the other way around, $p_1$ is the inverse of $p_2$. Therefore, we declare
    the property ClubMember::chairedCommittee to be the inverse of Committee::chair,
    then, implicitly, Committee::chair is the inverse of ClubMember::chairedCommittee.
    We therefore call Committee::chair and ClubMember::chairedCommittee a pair of
    mutually inverse properties. Having such a pair in a model implies redundancy
    because each of the two reference properties can be derived from the other by
    inversion. This type of redundancy implies data storage and update overhead which
    is the price to pay for the navigability that supports efficient object access
    in both directions.


    For maintaining the duplicate information of a mutually inverse property, it is
    common to treat one of the inverse properties as the *master*, and the other as
    the *slave*, and take this distinction into consideration in the code of the change
    methods (such as the property setters) of the affected model classes. We indicate
    the slave of an inverse property pair in a model by declaring the *derived* property
    using the UML notation of a slash (/) as a prefix of the property name as shown
    in the following diagram:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | coChairedCommittee[0..1] : Committee |


    The property chairedCommittee in ClubMember is now *derived* (as indicated by
    its slash prefix). Its annotation {inverse of chair} defines a *derivation rule*
    according to which it is derived by inverting the property Committee::chair.


    ### 7.1 Inverse Reference Properties


    In a UML class diagram, the derivation of a property can be specified by an OCL
    /derive that evaluates the value of the derived property for a given object. In
    the case of a property being the inverse of another property, specified by the
    constraint expression (**inverse of anotherProperty**) appended to the property
    declaration, the derivation expression is implied. In our example, for any club
    member m, it evaluates the committee c such that c.chair = m. In OCL, this derivation
    would be expressed like:


    ```

    context ClubMember::chairedCommittee: Committee

    derive:

    if Committee.allInstances().exists(c | c.chair = self) then c

    ```


    There are two ways to realize the derivation of a property: it may be **derived
    on read** via a read-time computation of its, or it may be **derived on update**
    via an update-time computation performed whenever one of the variables in the
    expression (typically, another property) changes its value. The latter case responds
    to a materialized view in a database. While a reference property that is derived
    on read may not guarantee efficient navigation, the reference property that is
    derived on update provides efficient navigation.


    When we designate a slash (/), we indicate that it is derived on update. For instance,
    the property **ClubMember::chairedCommittee** in the example above is derived
    on update from the property chair.


    In the case of a derived reference property, we have to deal with **life-cycle
    dependencies** between the affected model classes requiring special change management
    mechanisms based on the functionality of the represented association (either **one-to-one**,
    **many-to-one** or **many-to-many**).


    - ClubMember::chairedCommittee, which is single-valued and optional, this means
    that:

    1. whenever a new member object is created (with a mandatory chair assignment),
    the corresponding ClubMember::chairedCommittee property has to be assigned accordingly;

    2. whenever the chair property is updated (that is, a new chair is assigned to
    a committee), the corresponding ClubMember::chairedCommittee property has to be
    unset for the club member who was the previous chair and set for the one being
    the new chair;

    3. whenever a committee object is destroyed, the corresponding ClubMember::chairedCommittee
    property has to be unset.

