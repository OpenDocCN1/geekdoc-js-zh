    \ form of entity classes (implementing model classes),\n3. how to write the view\
    \ and controller code based on the entity classes.\n\n# 4.1 Implementing Single-Valued\
    \ Reference Properties in Java\n\nA single-valued reference property, such as\
    \ the publisher of the object type Book, allows storing internal references to\
    \ objects of another type, such as Publisher. When creating a new object, the\
    \ constructor function needs to have a parameter for allowing to assign a suitable\
