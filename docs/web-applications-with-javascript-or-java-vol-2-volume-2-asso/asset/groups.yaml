    We have the following duality: while all features of a supertype are included
    in the intentions, or feature sets, of its subtypes (intensional inclusion), all
    instances of a subtype are included in the extensions, or instance sets, of its
    supertypes (extensional inclusion). This formal structure has been investigated
    in formal concept analysis.


    Due to the intention/extension duality we can specialize a given type in two different
    ways:


    +   1. **By extending the type’s intention** through adding features in the new
    subtype (such as adding the attribute subjectArea in the subtype Textbook).

    2. **By restricting the type’s extension** through adding a constraint (such as
    defining a subtype MathTextbook as a Textbook where the attribute subjectArea
    has the specific value “Mathematics”).


    Typical OO programming languages, such as Java and C#, only support the first
    possibility (specializing a given type by extending its intention), while XML
    Schema and SQL99 also support the second possibility (specializing a given type
    by restricting its extension).


