    # 1.5 Adding Directionality to a Non-Directed Association


    When we make an information model in the form of a UML class diagram, we end up
    with a model containing one or more associations that do not have any ownership
    defined for their ends, as, for instance, in Figure 1.4. When there is no ownership
    dot at either end of an association, such as in this example, this means the model
    does not specify how the association is to be (or realized) with the help of reference
    properties. Such an association does not have direction. According to the UML
    2.5 specification, the ends of such association are “owned” by itself, not by
    any of the classes participating in it.


    | Committee | ClubMember |

    | --- | --- |

    | name : String | 0.1 1 |


    Figure 1.4: A model of a non-directed association between Committee and ClubMember.


    An information design model that contains an association without association ownership
    dots is acceptable as a relational database design model, but it is incomplete
    as a design model for OOP languages.


    For instance, the model of Figure 1.4 provides a relational database design with
    two entity tables, committees and clubmembers, and a separate one-to-one relation
    table committee_clubmember_as_chair. It does not provide a design for Java classes,
    since it does not specify how the association is to be implemented with the help
    of reference properties.


    There are three options to turn an information design model of a non-directed
    association (without any association ownership dots) into an information design
    model where all associations are either unidirectional or bidirectional: we can
    place an ownership dot at either end or at both ends of the association. Each
    of these three options defines a different way to represent, or implement, the
    association with the help of reference properties. So, for the association shown
    in Figure 1.4 above, we have the following options:


    +   1. Place an ownership dot at the chair association end, leading to the model
    shown in Figure 1.2, which can be transformed into the OO class model shown in
    Figure 1.1 above.'
