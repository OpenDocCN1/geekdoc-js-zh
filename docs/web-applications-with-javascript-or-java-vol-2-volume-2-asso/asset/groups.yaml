    \ 函数的编码方式如下：\n\n```javascript\ntoRecord() {\n  var rec = {};\n  // 遍历所有 Author\
    \ 属性\n  for (let p of Object.keys(this)) {\n    // 保留下划线开头的属性，但 \"_authoredBooks\"\
