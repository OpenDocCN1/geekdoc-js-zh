    # 12.7.4 Representing Class Hierarchies with SQL Database Tables


    A standard DBMS stores information (objects) in the rows of tables, which have
    been conceived as set-theoretic relations in relational database systems. The
    relational database language SQL is used for defining, populating, updating and
    querying such databases. But there are also simpler data storage techniques that
    allow to store data in the form of tables, but do not support SQL. In particular,
    key-value storage systems, such as JavaScript''s Local Storage API, allow storing
    serialization of a JS entity (a map of entity records) as the string value associated
    with the table as a key.


    While the classical version of SQL (SQL92) there is no support for subtyping and
    inheritance, this has been changed in SQL99. However, the subtyping-related language
    elements of SQL99 have only been implemented in some DBMS, for instance in the
    open source DBMS PostgreSQL. As a consequence, making a design model that can
    be implemented with various frameworks using SQL DBMSs (including weaker technologies
    such as MySQL and SQLite, we cannot use the'
  - '[PAGE 149]


    # 12 Subtyping and Inheritance


    SQL features for subtyping, but have to model inheritance hierarchies in database
    design models by means of plain tables and foreign key dependencies. This mapping
    from class hierarchies to relational tables (and back) is the business of Object-Relational-Mapping
    frameworks such as JPA Providers (like Hibernate), Microsoft''s Entity Framework,
    or the Active Record approach of the Rails framework.


    There are essentially three alternative approaches how to represent a class hierarchy
    with database tables:


    +   1. Single Table Inheritance (STI) is the simplest approach, where the entire
    class hierarchy is represented by a single table, containing columns for all attributes
    of the root class and all of its subclasses, and after the name of the root class.


    +   2. Table per Class Inheritance (TCI) is an approach, where each of the hierarchy
    is represented by a corresponding table containing columns for inherited properties,
    repeating the columns of the tables that represents its superclasses.


    +   3. Joined Tables Inheritance (JTI) is a more logical approach, where each
    segment subclass is represented by a corresponding table (subtable) connected
    to the table representing its superclass (supertable) via its primary key referencing
    the primary key of the superclass, such that the (inherited) properties of the
    subclass are not represented as columns in subtables.


    Notice that the STI approach is closely related to the Class Hierarchy Merge design
    pattern discussed in Section 12.6 above. Whenever this design pattern has already
    been applied in the design model, or the design model has already been refactored
    according to this design pattern, class hierarchies (their subclasses) have been
    eliminated in the design, and consequently also in the data to be coded in the
    form of class definitions in the app''s model layer, so there is no anymore to
    map class hierarchies to single tables. Otherwise, the design model contains a
    class hierarchy that is implemented with a corresponding class hierarchy in the
    app''s model layer, which would be mapped to database tables with the help of
    the STI approach.


    We illustrate the use of these approaches with the help of two simple examples.
    The first example is the Book class hierarchy, which is shown in Figure 12.1 above.
    The second example is the class hierarchy of the Person roles Employee, Manager
    and Author, shown in the class diagram in Figure 12.8 below.


