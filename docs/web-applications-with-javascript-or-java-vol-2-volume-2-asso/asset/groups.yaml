    为了避免在重叠情况下 TCI 的数据冗余问题，可以采用图 12.12 所示的 JTI 方法。该模型通过定义相同的主键来连接表示子类的表（*subtables*）和表示父类的表（*supertables*）：img/26c953d1023457385f69258a956png


