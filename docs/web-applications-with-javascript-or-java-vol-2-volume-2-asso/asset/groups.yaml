    \ local class name can be used (e.g., PublisherConverter) or the fully qualified\
    \ name, if there is risk of naming conflicts (e.g., pl.m.converter.PublisherConverter).\
    \ We recommend using the fully qualified name in the #{publisherCtrl.publishers}\
    \ expression results in calling the getPublishers method of Publisher class, which\
