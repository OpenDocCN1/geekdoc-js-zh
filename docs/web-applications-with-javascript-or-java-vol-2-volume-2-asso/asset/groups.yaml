    \ JPA does not provide automatic maintenance of inverse references. According\
    \ to the Java Persistence Wiki, we have to implement the (di- and inverse) relations\
    \ management with set/add/remove methods:\n\n> A common problem with bidirectional\
    \ relationships is the application updates one side of the relationship, while\
    \ the other side does not updated, and becomes out of sync. In JPA, as in general,\
    \ it is the responsibility of the application or the object model to maintain\
    \ relationships. If your application adds to one side of a relationship, then\
    \ it must add to the other side. This is commonly resolved through add or set\
    \ methods in the object model that handle both sides of the relationships, so\
    \ the application code needs not to worry about it. There are two ways to go about\
    \ this: you can either add the relationship maintenance code to one side of the\
    \ relation, and only use the setter from that side (such as making the other side\
    \ protected), or add to both sides and ensure you avoid an infinite loop.\n\n\
    We have used an entity manager for each controller class. Every entity manager\
    \ maintains a set of cached entities which can be “shared” with other entity managers"
