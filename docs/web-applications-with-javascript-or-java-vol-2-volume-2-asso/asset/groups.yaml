    \ |\n| checkChair(c : ClubMember) : ConstraintViolation |\n| toString() : string\
    \ |\n| toRecord(): Object |\n\n[PAGE BREAK]\n\n## 3 Implementing Unirectional\
    \ Functional Associations with Plain JS\n\nA unidirectional-functional association\
    \ is either one-to-many or many-to-many. In both cases such association is represented,\
    \ with the help of multi-valued property. In this chapter, we show\n\n1. how to\
    \ derive a JS class model from an OO class model,\n2. how to code the view and\
    \ controller for multi-valued associations,\n3. how to implement set-valued reference\
    \ properties using maps.\n\n## 3.1 Implementing Multi-Valued Reference Properties\n\
    \nA multi-valued reference property, such as authors, allowing a collection of\
    \ references of type, such as Author objects. When creating a new object of Book,\
    \ the constructor needs to have parameter for this, as shown in the following\
    \ example:\n\n```js\nclass Book {\n  constructor({isbn, title, year, authors,\
    \ authorIdRefs,\n    publisher, publisher_id}) {\n    this.isbn = isbn;\n    this.title\
    \ = title;\n    this.year = year;\n    // assign object reference or ID reference\n\
    \    this.authors = authors || authorIdRefs;\n    if (publisher || publisher_id)\
    \ this.publisher = publisher || publisher_id;\n  }\n}\n```\n\nNote that the constructor's\
    \ parameter is expected to contain either authors or authorIdRefs. The JavaScript\
    \ expression authors ||IdRefs, using the disjunction operator ||, evaluates to\
    \ a map authors, if there is a slot with name, or to an array authorIdRefs, otherwise.\
