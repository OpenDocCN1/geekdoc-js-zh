    # 4.2 Make a Java Entity Class Model


    The starting point for making a Java Entity class is an OO class model like the
    one shown in Figure 1.10.

    As explained before, we obtain the Entity class Publisher from the corresponding
    OO design class by (1) making all properties private, (2) using Java data-type
    classes (String, Integer, etc.), (3) adding the stereotype «get/set» to properties
    (specifying public getters and setters), (4) adding to toString function, (5)
    adding the (class-level) data storage methods to retrieve, update and delete:


    | Java Entity |

    |Publisher |

    |<get/set>-name : String |

    |<get/set>-address : String |

    |+checkNameAid(in : String, em : EntityManager) : ConstraintViolation |

    |+toString(): String |

    |+retrieveAll(in : EntityManager) : List<Publisher> |

    |+retrieve(in : EntityManager, name : String) : Publisher |

    |+create(in : EntityManager, name : String, address : String) |

    |+update(in : EntityManager, name : String, address : String) |

    |+delete(in : EntityManager, name : String) |


    In a Java Entity class model, for any association end dot in the OO class model,
    we show the property reference representing the association and annotate it with
    the functionality type of the unidirectional association represented by it. In
    our example, we use a property publisher in the Entity class and annotate it with
    the association''s functionality type manyToOne:


    | Java Entity |

    |Book |

    |<get/set>-isbn[1] : String |

    |<get/set>-title[1] : String |

    |<get/set>-year[1] : Integer |

    |<get/set>-publisher[0..1] : Publisher (manyToOne) |

    |+checkIsbnAid(isbn : String, em : EntityManager) : ConstraintViolation |

    |+toString(): String |

    |..() |'
  - "[PAGE 70]\n\n# 4.4 Write the Model Code\n\n# 4.3 New Issues\n\nCompared to the\
    \ single-class apps discussed in previous, we have to deal with a number of new\
    \ technical issues:\n\n+   1. In the model code we now have to take care of **reference\
    \ properties** that require\n   1. defining **referential integrity constraints**\
    \ with the help of suitable JPA annotations;\n   2. extending the code of the\
    \ *create*, update and delete methods by taking the reference properties into\
    \ consideration;\n   3. a method for converting between (internal) object references\
    \ and corresponding (external) ID references in serialization and de-serialization\
    \ operations.\n2. In the **user interface** (view) code we now have to take care\
    \ of\n   1. showing information about associated objects in the *retrieve/list*\
    \ all use case;\n   2. allowing to select an associated object from a list of\
    \ all existing instances of the target class in the *create object* and *update\
    \ object* use cases.\n\n# 4.4 Write the Model Code\n\nThe Java Entity model can\
    \ be directly coded for getting the model layer of our Java back-end app.\n\n\
    # 4.4.1 Summary\n\n+   1. Code each class from the Java Entity class model as\
    \ a corresponding entity class.\n2. Code an [id] property modifier with the JPA\
    \ annotation @Id\n3. Code any property modifier denoting the functionality type\
    \ of a reference property, such as [{manyToOne}, with the JPA annotation, such\
    \ as @ManyToOne.\n4. Code the integrity constraints specified in the model with\
    \ the help of Java Bean Validation annotations (or custom validation annotations).\n\
    5. Code the getters and setters.\n6. Code the *create*, *retrieve*, update and\
    \ delete storage management operations as class-level methods.\n\nThese steps\
    \ are discussed in more detail in the following sections."
- md: "\n## 4.4.2 Code Each Class of the Entity Model\n\nEach class C of the Java\
    \ entity class model is coded as an annotated bean class with name C having a\
    \ default constructor (no parameters) and a constructor with entity creation parameters.\n\
    \nFor instance, the Book class from the Entity class model is coded in the following-way:\n\
    \n```\n@Entity( name=\"books\")\n@ViewScoped ManagedBean(name=\"book\")\npublic\
    \ class Book {\n  @Id @NotNull(message=\"An ISBN is required!\")\n  private String\
    \ isbn;\n  @Column(nullable=false)\n  @NotNull(message=\"A title is required!\"\
    )\n  private String title;\n  @Column(nullable=false)\n  @NotNull(message=\"A\
    \ year is required!\")\n  private Integer year;\n  @ToOne( fetch=FetchType.EAGER)\n\
    \  private Publisher publisher;\n\n  public Book() {}\n  public Book(String isbn,\
    \ String title, Integer year, Publisher publisher) {\n    this.setIsbn(isbn);\n\
    \    this.setTitle(title);\n    this.setYear(year);\n    this.setPublisher(publisher);\n\
    \  }\n  .. // getters, etc.\n}\n```\n\nThe @ManyToOne annotation on the publisher\
    \ is used for specifying the functionality type of the association Book has Publisher\
    \ represented by the reference property publisher since it holds that a book has\
    \ one publisher and a publisher has many books. This annotation also allows to\
    \ specify a fetch type with the parameter fetching one of the following two values:\n\
    \n- FetchType.EAGER, implying that a retrieval of an entity includes a retrieval\
    \ of the associated entity referenced by the entity with this property. In our\
    \ example, this means that when a Book entity is retrieved, the Publisher entity\
    \ referenced by the book's publisher property is also retrieved. This behavior\
    \ is very useful and it should be used whenever the data to be retrieved can be\
    \ handled in main memory.\n- FetchType.LAZY, implying that referenced entities\
    \ are not automatically retrieved with a referencing entity. In example means\
    \ that the referenced Publisher entity is not retrieved with a referencing Book\
    \ entity, leaving the value of the publisher property to null. With this fetching\
    \ behavior, referenced entity has been retrieved separately by invoking the reference\
    \ property's getter in the context of a transaction (in our example by invoking\
    \ getPublisher).\n\nIn the case of a single-valued reference property (representing\
    \ a functional association) annotated with @OneToOne or @ManyToMany, the default\
    \ value is FetchType.EAGER, so referenced entities are fetched together with referencing\
    \ entities, while in the case of a non-functional association (with either @ToMany\
    \ or @ManyToMany), the default value is FetchType.LAZY, so referenced entities\
    \ are not fetched together with referencing entities, but have to be retrieved\
    \ separately, if needed.\n\nAs a result of JPA annotations, the following SQL\
    \ table creation statement for creating the tables is:\n\n```\nCREATE TABLE IF\
    \ NOT EXISTS `books` (\n`ISBN` varchar(10) NOT NULL,\n`TITLE` varchar(255) NOT\
    \ NULL,\n`YEAR` int(10) NOT NULL,\n`PUBLISHER_NAME` varchar(255) DEFAULT NULL\n\
    FOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers` (`NAME`)\n);\n```\n\n##\
    \ 4.4.3 Code the Constraints\n\nTake care that all property constraints specified\
    \ in the entity class model are properly coded using suitable Bean Validation\
    \ annotations. For instance, for the attribute name, we have to use the JPA annotation\
    \ @Id for specifying that the attribute corresponds to the primary key column\
    \ of the database table to which the entity is mapped, and the Bean Validation\
    \ annotation @NotNull for defining a mandatory value constraint that is checked\
    \ before an entity is saved to the database.\n\nIn the case of the address attribute,\
    \ we have to define a mandatory value constraint in two forms: with the JPA annotation\
    \ @Column(nullable=false) for the corresponding table column, and with the Bean\
    \ Validation annotation @NotNull for the attribute.\n\n```\n@Id@NotNull( message=\"\
    A name is required!\")\nprivate String name;\n```\n\n```\n@Column( nullable=False)\n\
    @NotNull( message=\"An address is required!\")\nprivate String address;\n```\n\
    \nNotice that, unfortunately, the current Java EE technology requires defining\
    \ the same constraint twice, once for the database in the form of a JPA annotation,\
    \ and for the Java app in the form of a Bean Validation annotation.\n\n## 4.4.4\
    \ Code Getters and Setters\n\nCode the setter operations as (instance-level) methods.\
    \ The setters only assign values and do not perform any validation, since the\
    \ property constraints are only checked before save by the Java EE execution environment.\
    \ The getters simply return the actual values of properties.\n\n## 4.4.5 Implement\
    \ Deletion Policy\n\nFor any reference property, we have to choose and implement\
    \ a deletion policy for taking care of the corresponding object destruction dependency\
    \ in the delete method of the reference property’s class range. In our case, we\
    \ have to choose between\n\n- deleting all books published by the deleted publisher;\n\
    - dropping from all books published by the deleted publisher reference to the\
    \ deleted publisher.\n\nWe choose the second policy, which can only be used if\
    \ the case of an optional reference property such as book.publisher. This is shown\
    \ in the following code of the Publisher.delete method where for all book entities\
    \ concerned the property publisher is cleared:\n\n```\npublic static void delete(EntityManager\
    \ em, UserTransaction ut,\nString name) throw Exception {\n    ut.begin();\n \
    \   Publisher publisher = em.find(Publisher.class, name);\n    // all Books which\
    \ has this publisher\n    Query query = em.createQuery(\n        \"SELECT b FROM\
    \ Book b WHERE b.publisher.name = :name\");\n    query.setParameter(\"name\",\
    \ name);\n    List<Book> books = query.getResultList();\n    // clear these books'\
    \ publisher\n    for ( Book b: books) { b.setPublisher(null); }\n    em.remove(publisher);\n\
    \    ut.commit();\n}\n```\n\nThe method loops through all entities referencing\
    \ the publisher to be destroyed and sets its property to null.\n\n## 4.4.6 Serialization\
    \ and De-Serialization\n\nBased on JPA annotations, together with suitable classes\
    \ when needed, serialization (from Java objects to table rows) as well as the\
    \ corresponding de-serialization (from table columns to Java objects) are performed\
    \ automatically.\n\n## 4.5 The View and Controller Layers\n\nThe user interface\
    \ (UI) consists of a start page for navigating to the data management pages and\
    \ one UI page for each object type and data management use case. All UI pages\
    \ are defined in the form of JSF view files in subfolders of WebContent/views/.\
    \ We create the Menu page index.xhtml in the subfolder WebContent/views/app with\
    \ the following content:\n\n```\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \nxmlns:ui=\"..\" xmlns:f=\"..\">\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h2>Public Library</h2>\n<h:button value=\"Manage\
    \ publishers\"\noutcome=\"/views/publishers/index\" />\n<h:button value=\"Manage\
    \ books\"\noutcome=\"/views/books/index\" />\n<h:form>\n<h:commandButton value=\"\
    Clear database\"\naction=\"#{appCtrl.clearData()}\" />\n<h:commandButton value=\"\
    Create test data\"\naction=\"#{appCtrl.createTestData()}\" />\n</h:form>\n</ui:define>\n\
    </ui:composition>\n</html>\n```\n\nIt creates the menu buttons which provide the\
    \ redirects to corresponding views for each of the management pages. Additionally,\
    \ we need to create a corresponding AppController class which is responsible for\
    \ the creation and deletion of the test data. The controller is used to combine\
    \ code of the Publisher.createTestData methods with Book.createTestData and Book.clearData\
    \ methods as follows:\n\n```\n@ManagedBean(name=\"appCtrl\") @SessionScoped\n\
    public class AppController {\n    @PersistenceContext(unitName=\"UnidirAssocApp\"\
    )\n    private EntityManager em;\n    @Resource\n    UserTransaction ut;\n\n \
    \   public String clearData() {\n        try {\n            Book.clearData(em,\
    \ ut);\n            Publisher.clearData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n\n    public String createTestData() {\n        try {\n            Publisher.createTestData(em,\
    \ ut);\n            Book.createTestData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n}\n```\n\nThe deletion of Book and Publisher data must be done in a particular\
    \ order for avoiding referential integrity violations (books have to be deleted\
    \ first, before their publishers are deleted).\n"
  mdcn: "\n\n## 4.4.2 为实体模型中的每个类编码\n\nJava 实体类模型中的每个类 C 被编码为一个带注解的 Bean 类，其名为 C，并有一个默认构造函数（无参数）以及一个带有实体创建参数的构造函数。\n\
    \n例如，实体类模型中的 Book 类以以下方式编码：\n\n```\n@Entity( name=\"books\")\n@ViewScoped ManagedBean(name=\"\
