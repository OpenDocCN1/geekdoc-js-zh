    Pros of the JTI approach: (1) Subtyping relationships and the structure of class
    hier-archies are explicitly preserved. (2) Data redundancy in the case of overlapping
    segments is avoided.


    Cons: (1) The main disadvantage of the JTI approach is that for querying a subclass,
    join queries (for joining the segregated entity data) are required, which may
    create performance issues.


