    \ |\n| +addAuthor(in : Author) |\n| +removeAuthor(in : Author) |\n| +toString()\
    \ : string |\n\n## 5.3 新问题\n\n与前文讨论的单向功能性关联相比，我们必须处理以下新的技术问题：\n\n1. 在**模型类**中，我们现在必须处理**多值引用属性**，这些属性必须被\
    \ `@OneToMany` 或 `@ManyToMany` 注解。\n2. 在**用户界面**代码中，我们需要处理：\n   1. 在 *retrieve*（检索）所有对象的用例中，在渲染多值引用属性的视图列中显示关联对象集合的信息；\n\
    \   2. 在 *create*（创建）对象和 *update*（更新）对象用例中，允许从目标类的所有现有实例列表中选择关联对象集合。\n\n最后一个问题（即从某些类的所有现有实例列表中选择关联对象集合）通常由于可用性问题，无法通过\
    \ HTML `select multiple` 元素解决。每当可选选项集超过某个阈值时（由无需滚动条即可在屏幕上看到的选项数量定义），HTML `select\
    \ multiple` 元素不再可用，必须使用替代的多选小部件。\n\n## 5.4 编写模型代码\n\nJava 实体类模型可以直接编码，以实现我们 Java\
    \ 后端应用的模型层。\n\n### 5.4.1 总结\n\n1. 将 Java 实体类模型中的每个类编码为相应的实体类。\n2. 使用 JPA 属性注解\
    \ `@Id` 编码任何 `[id]` 属性修饰符。\n3. 表示引用属性功能类型（如 `[manyToOne]`）的属性修饰符使用对应的 JPA 注解（如\
