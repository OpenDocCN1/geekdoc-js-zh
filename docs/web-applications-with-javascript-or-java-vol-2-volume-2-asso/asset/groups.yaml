    \    2. 允许在用例中选择关联对象。\n\n## 2.5 实现模型\n\n### 2.5.1 总结\n\n- 1. 为所有（非派生的）单值属性添加 `get/set`\
    \ 拷贝，意味着它们具有隐式的 getter 和 setter。回想一下在 setter 中，会调用相应的检查操作，并且只有当检查没有检测到任何约束违背时，属性才会被设置。\n\
    - 2. 为每个（非派生的）属性创建一个 `check` 操作，以便为实现**属性约束**提供一个集中的位置。对于标准的 ID 属性（如 `Book::isbn`），需要两个或三个检查操作：\n\
