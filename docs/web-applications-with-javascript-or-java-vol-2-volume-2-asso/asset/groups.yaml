    # Foreword


    This two-book volume shows how to design and implement web applications with a
    model-based approach, using the most relevant platforms for web development: JavaScript
    and Java. Web apps are designed with the help of information models in the form
    of UML diagrams and implemented:

    - JavaScript front-ends, using one of the local storage technologies offered by
    browsers;

    - Java back-end apps, using Java Server Faces (JSF) as the user interface technology,
    the Java Persistence API (JPA) for object-to-storage mapping, and MySQL/MariaDB
    management system.


    The focus of the book is general concepts and techniques concerning the fundamental
    management issues of de-facto. We assume that the reader is already familiar with
    HTML and with at least one object-oriented programming language, such as C++,
    Java, PHP or C#. In addition, we assume that the reader has some familiarity with
    JavaScript, and is interested to learn more about programming with JavaScript
    or Java. The book can be used in web development courses for students of Computer
    Science or related disciplines; by JavaScript developers for learning Java; by
    Java developers for learning JavaScript and PHP/C# developers for learning how
    to implement basic information management concepts and complete web apps with
    plain JavaScript. The book comes with the complete source code of six example
    apps that you can run or download from our web server.


