    # 170 14 Subtyping of Java EE


    - 1. We have declared the segmentation of Person into Employee and Author to be
    disjoint and complete, that is, any person is either an employee or an author.
    Since Java does not support multiple classification, we cannot implement an overlapping
    segmentation, as needed when modeling roles, with Java.


    - 2. We turned Person into an abstract class (indicated by its name in italics),
    which means that it cannot have direct instances, but only indirect ones via its
    subclasses Employee and Author. This technical design decision is compatible with
    the fact that any Person is an Employee or Author (or both), and consequently
    there is no need for any object to instantiate directly.


    ## 14.3.2 New Issues


    Compared to the model of our first case study, shown in Figure 14.1 above, we
    have to define the category relationships between Employee and Person, as well
    as between Author and Person, using the JPA annotation.

    In the UI we have to care of:


    - 1. Adding the views (in the folders WebContent/views/authors and WebContent/views/employees)
    and controller classes (AuthorController and EmployeeController) for the corresponding
    Author and Employee model classes.


    - 2. Deal with the Manager case, by adding a "Special type" select control, in
    the forms of the "Create book and "Update book" use cases in WebContent/views/books/create.xhtml
    and WebContent/views/books/update.xhtml. Segment property fields (i.e. department
    in our example) are only displayed, and their validation is performed, when a
    corresponding employee type has been selected.


    ## 14.3.3 Code the Model Classes of the Java Entity Class Model


    The Java Entity class shown in Figure 14.2 above is coded by using the JavaBeans
    Person, Employee and Author as well as for the enumeration type EmployeeEL.


    ### 14.3.3.1 Define the Category Relationships


    We define the category relationships between Employee and Person, as well as between
    Author and Person, using the JPA annotations. At first we create the Person class
    as shown:


    ```java

    @Entity @Table(name="persons")

    @Inheritance(strategy=InheritanceType.JOINED)

    ```


    ## 14.3 Case Study 2: Implement a Class Hierarchy with Joined Inheritance — 171


    ```java

    @DiscriminatorColumn(name="category",

    discriminatorType=DiscriminatorType.STRING, length=16)

    public abstract class Person {

    @Id @NotNull(message="A person ID is required!")

    private Integer personId;

    @NotNull(message="A name is required!") @Column(nullable=false)

    private String name;

    }

    ```


    Comparing with the Book hierarchy shown in Test Case 1, the @Inheritance annotation
    defines the strategy=InheritanceType.JOINED. This means, for every class in the
    inheritance hierarchy, a database table is used. The @DiscriminatorColumn(name="category")
    specifies the column in the corresponding table (i.e. persons) of the top hierarchy
    class (i.e. Person) which stores the discriminator values used to identify the
    type of each entry (table).


    Notice that the Java class Person is declared as abstract, which means it cannot
    be initialized, instead we can and initialize subclasses derived from it (i.e.
    Employee and Author). This also mean we don''t declare a @DiscriminatorValue because
    no instance of Person is stored in the database table.


    Further, we define the Author class as follows:


    ```java

    @Entity @Table(name="authors")

    @DiscriminatorValue(value="AUTHOR")

    @ManagedBean(name="author") @ViewScoped

    public class Author extends Person {

    @NotNull(message="A biography is required!")

    private String biography;

    }

    ```


    The Author class inherits Person, therefore the get and set methods corresponding
    to personId and name properties are available. The @discriminatorValue(value="AUTHOR")
    specifies the column of the category table stores the value AUTHOR for every entry
    which comes from persisting an Author instance.

    Finally, we define the Employee class:


    ```java

    @Entity @Table(name="employees")

    @DiscriminatorValue(value="EMPLOYEE")

    @ManagedBean(name="employee") @ViewScoped

    public class Employee extends Person {

    @Column( nullable=false)

    @NotNull message="An employee ID is required!"

    private Integer empno;

    @Column(nullable=false, length=32)

    @Enumerated(EnumType.STRING)

    private EmployeeCategoryEL type;

    @Column(nullable=false, length=64)

    private String department;

    }

    ```


    ### 14.3.3.2 Database Schema for Joined Inheritance


    As a result of the @Inheritance(strategy=InheritanceType.JOINED) for each class
    in the inheritance hierarchy, a database table is used. The DDL scripts generated
    by JPA are shown below:


    | Table | Columns | Constraints |

    | :--- | :--- | :--- |

    | persons | personId (PK), name, category | |

    | authors | personId (FK), biography, category | FK to persons |

    | employees | personId (FK), empno, type, department, category | FK to persons
    |


    Notice that the Java class Person is declared as abstract, which means it cannot
    be initialized, instead we can and initialize subclasses derived from it (i.e.
    Employee and Author). This also mean we don''t declare a @DiscriminatorValue because
    no instance of Person is stored in the database table. (Note: The table above
    is based on the logic provided).


    ### 14.3.4 Write the View and Controller


    In the user interface, for every bean class we have a controller. The Person class
    is defined as abstract and contains the PersonId method which is common to all
    subclasses. For every non-abstract entity in the inheritance hierarchy we define
    a set of views. For example, in the case of Author we have RetrieveAll.xml, create.xml,
    update.xml, and delete.xml in WebContent/views/authors/. In the case of Employee,
    we have the following:


    ```xml

    <h:column>

    <f:facet name="header">Special type of employee</f:facet>

    #{e.type == null ? e.label.concat(" ").concat(department) : "")}

    </h:column>

    ```


    Notice that within EL expressions we cannot use the + (plus) operator for concatenating
    strings. EL allows the + operator to be used only for numeric addition. However,
    we can use concat instead.


    ## 14.4 Run the App


    For running your application, you may first have to stop your Tomcat/TomEE server
    (with shutdown.bat for Windows or shutdown.sh for Linux). Next, download and unzip
    your ZIP archive containing all the source code of the application and also the
    ANT script file that you have to edit (modify the server.folder property value).
    Now, execute the following command in your console:


    ```bash

    ant deploy -Dappname=SubtypingApp

    ```


    Finally, start your Tomcat web server (by using startup.bat for Windows or startup.sh
    for Linux). Please be patient, this can take some time depending on the speed
    of your computer. It will be ready when the console displays the following message:
    *INFO: Initializing Mojarra [some library versions and paths are shown here]*
    for context ''/subtypingapp''. Finally, open a web browser and type:


    ```http://localhost:8080/SubtypingApp/WebContent/views/app/index.xhtml

    ```


