    \ a ) : a.authorId;\n  const validationResult = Book.checkAuthor(author_id);\n\
    \  if (author_id && validationResult instanceof NoConstraintViolation) {\n   \
    \ // add the author reference\n    let key = String(author_id);\n    this._authors[key]\
    \ = Author.instances[key];\n  } else {\n    throw validationResult;\n  }\n}\n\
    ```\n\nIn the removeAuthor method, the author reference is first checked, and\
    \ if no constraint violation is detected, the corresponding entry in the map _authors\
