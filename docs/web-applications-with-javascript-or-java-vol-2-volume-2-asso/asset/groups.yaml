    \ {\n    if (obj instanceof Publisher) {\n        Publisher publisher = (Publisher)\
    \ obj;\n        return this.name.equals(publisher.name);\n    } else return false;\n\
    }\n```\n\n### 4.5.3.2 Write the View Code\n\nTo allow selection of objects which\
    \ have to be associated with the currently edited object from the create and update\
    \ use cases, an HTML selection list (a select element) of a h:selectOne menu.\
