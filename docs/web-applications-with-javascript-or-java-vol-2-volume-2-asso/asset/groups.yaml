    \ In both cases such an association is represented, or implemented, with the help\
    \ of a single-valued reference property.\n\nIn this chapter, we show\n\n+   1.\
    \ how to derive a data model in the form of a Java Entity class model from an\
    \ OO class model with single-valued reference properties representing unidirectional\
