    ## 12.7 计算机编程语言中的子类型化与继承


    面向对象编程（OOP）、数据库语言（如 SQL99）、XML 定义语言 XML Schema 以及其他计算语言已经以各种方式和不同程度支持了子类型化和继承。其核心在于，计算语言中的子类型化是关于定义层次结构和特征继承的：OOP
    中的属性、约束和方法；SQL99 中的表列和约束；XML Schema 中的元素、属性和约束。


