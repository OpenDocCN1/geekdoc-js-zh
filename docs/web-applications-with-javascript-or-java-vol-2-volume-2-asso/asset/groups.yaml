    # 9 Implementing Bidirectional Associations with Java EE


    In this chapter, we show


    +   1. how to derive a Java **Entity class model** from an OO class model (that
    has been derived from an information design model),

    2. how to code the Entity class model in the form of entity classes (representing
    **model classes**),

    3. how to write the view and controller code based on the entity classes.


    # 9.1 Make a Java Entity Class Model


    The starting point for making a Java Entity class model is an OO class model with
    derived inverse reference properties like the one discussed above (in Figure 7.4),
    we present here again, for convenience:


    | Book | Publisher |

    | --- | --- |

    | isbn[1]: String (id) | name[1]: String (id) |

    | title[1]: String | address[1]: String |

    | year[1]: Integer | /publishedBooks[*]: Book (inverse of publisher) |

    | publisher[0..1]: Publisher | Author |

    | authors[*]: Author | personid[1]: Integer (id) |

    | | name[1]: String |

    | | /authoredBooks[*]: Book (inverse of authors) |


    Notice that the model contains two inverse reference properties: Publisher::publishedBooks
    and Author::authoredBooks. Each of them is linked to a master property, which
    is derived, by an inverse of constraint. Consequently, each of them represents
    a pair of mutually inverse reference properties corresponding to a bidirectional
    association.


    +   We now show how to derive a Java Entity class model from the OO class model:

    1. Turn each class into a <Java Entity>, making all properties private.

    2. Replace the platform-independent datatype names of the OO class model with
    corresponding Java datatype classes (Integer, Float, etc.).

    3. Add a «get/set» stereotype to all non-derived properties for indicating that
    they need getters and setters.

    4. Add a «get» stereotype to all derived properties for indicating that they need
    getters, others.'
