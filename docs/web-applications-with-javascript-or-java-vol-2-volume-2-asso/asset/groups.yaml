    )\n  private String isbn;\n  @Column(nullable=false)\n  @NotNull(message=\"A title\
    \ is required!\")\n  private String title;\n  @Column(nullable=false)\n  @NotNull(message=\"\
    A year is required!\")\n  private Integer year;\n  @ToOne( fetch=FetchType.EAGER)\n\
    \  private Publisher publisher;\n\n  public Book() {}\n  public Book(String isbn,\
    \ String title, Integer year, Publisher publisher) {\n    this.setIsbn(isbn);\n\
    \    this.setTitle(title);\n    this.setYear(year);\n    this.setPublisher(publisher);\n\
    \  }\n  .. // getters, etc.\n}\n```\n\npublisher 上的 `@ManyToOne` 注解用于指定 Book 与\
    \ Publisher 之间关联的功能类型。该关联由引用属性 `publisher` 表示，因为它认为一本书对应一个出版社，而一个出版社有许多书。此注解还允许通过\
    \ `fetching` 参数指定获取类型，其取值为以下两个值之一：\n\n- FetchType.EAGER：意味着获取一个实体会包含获取该实体通过属性引用的关联实体。在我们的示例中，这意味着当获取一个\
    \ Book 实体时，通过书的 `publisher` 属性所引用的 `Publisher` 实体也会被获取。这种行为非常有用，每当要获取的数据可以在主内存中处理时都应该使用它。\n\
    - FetchType.LAZY：意味着被引用的实体不会随着引用实体自动获取。在示例中，意味着被引用的 `Publisher` 实体不会与引用的 `Book`\
    \ 实体一起获取，使 `publisher` 属性的值为空。通过这种获取行为，被引用的实体将在事务上下文中调用引用属性的 getter 方法来单独获取（在我们的示例中是通过调用\
    \ `getPublisher`）。\n\n对于带有 `@OneToOne` 或 `@ManyToMany` 注解的单值引用属性（表示功能关联），默认值为\
    \ `FetchType.EAGER`，因此被引用实体会与引用实体一起获取；而在非功能关联（使用 `@ToMany` 或 `@ManyToMany`）的情况下，默认值为\
    \ `FetchType.LAZY`，因此被引用实体不会与引用实体一起获取，如果需要，则必须单独获取。\n\n根据 JPA 注解的结果，用于创建表的 SQL\
    \ 建表语句如下：\n\n```\nCREATE TABLE IF NOT EXISTS `books` (\n`ISBN` varchar(10) NOT\
    \ NULL,\n`TITLE` varchar(255) NOT NULL,\n`YEAR` int(10) NOT NULL,\n`PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL\nFOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers`\
    \ (`NAME`)\n);\n```\n\n## 4.4.3 为约束编码\n\n请确保实体类模型中指定的所有属性约束都使用合适的 Bean Validation\
    \ 注解进行了正确编码。例如，对于属性名，我们必须使用 JPA 注解 `@Id` 来指定该属性对应于实体映射的数据库表的主键列，并使用 Bean Validation\
    \ 注解 `@NotNull` 来定义强制值约束，该约束会在实体保存到数据库之前进行检查。\n\n对于地址属性，我们必须以两种形式定义强制值约束：使用 JPA\
    \ 注解 `@Column(nullable=false)` 对应表列，以及使用 Bean Validation 注解 `@NotNull` 对应属性。\n\
    \n```\n@Id@NotNull( message=\"A name is required!\")\nprivate String name;\n```\n\
    \n```\n@Column( nullable=False)\n@NotNull( message=\"An address is required!\"\
    )\nprivate String address;\n```\n\n请注意，遗憾的是，目前的 Java EE 技术需要定义两次相同的约束：一次是以 JPA\
    \ 注解的形式针对数据库，另一次是以 Bean Validation 注解的形式针对 Java 应用。\n\n## 4.4.4 为 Getter 和 Setter\
    \ 编码\n\n将 setter 操作编码为（实例级）方法。setter 只负责赋值且不执行任何验证，因为属性约束仅在 Java EE 执行环境在保存之前进行检查。getter\
    \ 简单地返回属性的实际值。\n\n## 4.4.5 实现删除策略\n\n对于任何引用属性，我们必须选择并实现一种删除策略，以处理引用属性类删除方法中相应的对象销毁依赖。在我们的案例中，我们必须在以下两种方案之间选择：\n\
    \n- 删除所有由被删除出版社出版的书；\n- 从所有由被删除出版社出版的书删除对被删除出版社的引用。\n\n我们选择第二种策略，该策略仅适用于可选引用属性（如\
    \ `book.publisher`）的情况。这在下面 `Publisher.delete` 方法的代码中显示，对于所有相关的 Book 实体，`publisher`\
    \ 属性都被清空了：\n\n```\npublic static void delete(EntityManager em, UserTransaction\
    \ ut,\nString name) throw Exception {\n    ut.begin();\n    Publisher publisher\
    \ = em.find(Publisher.class, name);\n    // 所有拥有此出版社的书\n    Query query = em.createQuery(\n\
    \        \"SELECT b FROM Book b WHERE b.publisher.name = :name\");\n    query.setParameter(\"\
    name\", name);\n    List<Book> books = query.getResultList();\n    // 清空这些书的出版社\n\
    \    for ( Book b: books) { b.setPublisher(null); }\n    em.remove(publisher);\n\
    \    ut.commit();\n}\n```\n\n该方法遍历所有引用要销毁出版社的实体，并将其属性设置为 null。\n\n## 4.4.6 序列化与反序列化\n\
    \n基于 JPA 注解并配合需要时的类，序列化（从 Java 对象到表行）以及相应的反序列化（从表列到 Java 对象）将自动完成。\n\n## 4.5 视图和控制器层\n\
    \n用户界面（UI）包含一个导航到数据管理页面的起始页，以及每个对象类型和数据管理用例的一个 UI 页面。所有 UI 页面定义在 `WebContent/views/`\
    \ 子文件夹下的 JSF 视图文件中。我们在 `WebContent/views/app` 子文件夹中创建了菜单页面 `index.xhtml`，内容如下：\n\
    \n```\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:ui=\"\
    ..\" xmlns:f=\"..\">\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h2>Public Library</h2>\n<h:button value=\"Manage\
    \ publishers\"\noutcome=\"/views/publishers/index\" />\n<h:button value=\"Manage\
    \ books\"\noutcome=\"/views/books/index\" />\n<h:form>\n<h:commandButton value=\"\
    Clear database\"\naction=\"#{appCtrl.clearData()}\" />\n<h:commandButton value=\"\
    Create test data\"\naction=\"#{appCtrl.createTestData()}\" />\n</h:form>\n</ui:define>\n\
    </ui:composition>\n</</html>\n```\n\n它创建了菜单按钮，跳转到每个管理页面对应的视图。此外，我们需要创建一个相应的 `AppController`\
    \ 类，负责测试数据的创建和删除。控制器用于将 `Publisher.createTestData` 方法与 `Book.createTestData` 和\
    \ `Book.clearData` 方法结合如下：\n\n```\n@ManagedBean(name=\"appCtrl\") @SessionScoped\n\
    public class AppController {\n    @PersistenceContext(unitName=\"UnidirAssocApp\"\
    )\n    private EntityManager em;\n    @Resource\n    UserTransaction ut;\n\n \
    \   public String clearData() {\n        try {\n            Book.clearData(em,\
    \ ut);\n            Publisher.clearData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n\n    public String createTestData() {\n        try {\n            Publisher.createTestData(em,\
    \ ut);\n            Book.createTestData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n}\n```\n\nBook 和 Publisher 数据的删除必须按特定顺序进行，以避免引用完整性冲突（必须先删除书，然后再删除它们的出版社）。\n\
    \n"
