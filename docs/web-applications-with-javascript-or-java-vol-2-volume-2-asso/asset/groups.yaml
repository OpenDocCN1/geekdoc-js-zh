    \ ${e.message}`);\n  }\n}\n```\n\n# 13.3.4.3 在保存子表时保存超表\n\n由于应用数据在运行期间一直保存在主内存中（只要浏览器中的应用网页页保持打开状态），因此在应用退出时（例如通过关闭浏览器标签页），必须将数据保存到持久化存储中。在\
    \ `pl.v.employees.manage.exit` 和 `pl.v.authors.manage.exit` 将 Employee 和 Author\
    \ 的实例保存到持久化存储时，我们也保存了 Person 的直接实例（作为 people 表的记录）。这是有必要的，因为对 Employee 或 Author\
    \ 实例的更改可能意味着 `Person.instances` 的变化。\n\n例如，对于 Employee 数据管理，我们在 `v/employees.js`\
    \ 中定义了：\n\n```javascript\npl.v.employees.manage = {\n  exit: function () {\n \
    \   Employee.saveAll();\n    Person.saveAll();\n  },\n..\n```\n\n# 14 使用 Java\
    \ EE 实现子类型\n\n在本章中，我们将基于我们的运行示例——公共图书馆应用）的信息模型片段，解释两个案例研究。在第一个案例研究中，我们考虑了图 12.1\
    \ 所示的以 Book 为根的单级类层次结构，这是一个不完全的交斥划分。我们使用**单表继承（Single Table Inheritance）**方法将此类层次结构映射到单个数据库表。\n\
    \n在第二个案例研究中，我们考虑了由 Person 角色 Employee、Manager 和 Author 组成的多级类层次结构，如图 12.8 所示。我们使用**连接表继承（Joined\
    \ Table Inheritance）**方法将此类层次结构映射到一组通过外键依赖关联的数据库表。\n\n在两种情况下，我们都展示了：\n\n- 1. 如何推导出\
    \ Java 实体类（Entity class）\n- 2. 如何以 Java 实体类的形式对 Java 实体类模型进行编码，\n- 3. 如何基于模型代码编写视图和控制器代码。\n\
    \n# 14.1 Java 中的子类型\n\nJava 通过其 `extends` 关键字为子类型提供了内置支持，但它不支持多继承。考虑以下信息设计模型：\n\
    \n| Person |\n| :--- |\n| firstName : String |\n| lastName : String |\n| Student\
    \ |\n| studNo : Integer |\n\n首先，我们定义父类 Person。然后，我们通过 `extends` 关键字定义子类 Student\
    \ 及其与 Person 的子类型关系：\n\n```java\npublic class Person {\n    private String firstName;\n\
    \    private String lastName;\n    ..\n}\npublic class Student extends Person\
    \ {\n    private int studentNo;\n```\n\n# 14.2 案例研究 1：使用单继承实现类层次结构 — 161\n\n```java\n\
    public Student( String first, String last, int studNo) {\n  super(firstName, lastName);\n\
    \  this.setStudNo(studNo);\n}\n```\n\n请注意，在 Student 类中，我们定义了一个包含创建 Student 实例所需所有参数的构造函数。在这个子类构造函数中，我们使用\
    \ `super` 来调用父类 Person 的构造函数。\n\n# 14.2 案例研究 1：使用单继承实现类层次结构\n\n在这个示例中，我们实现了图 12.1\
    \ 所示的 Book 层次结构。Java 实体类是从此设计模型推导出的。\n\n# 14.2.1 构建 Java 实体类模型\n\n回想，我们通过以下方式从\
    \ OO 类模型获取 Java 实体类模型：（1) 将所有属性设为私有，(2) 使用 Java 数据类型类，(3) 添加公共 getter 和 setter，(4)\
    \ 添加 `toString` 函数，(5) 添加（静态）数据存储方法 create、retrieve、update 和 delete，从而得到图 14.1\
    \ 所示的模型。\n\n# 14.2.2 新问题\n\n我们必须处理许多新问题：\n\n- 1. 在模型代码中，我们有一个枚举类型（BookCategoryEL），它用于\
    \ UI 代码以创建一个选择列表小部件，允许选择书籍类别。\n- 2. 使用适当的 JPA 注解对 Book 类层次结构中的每个类进行编码，以便持久化存储在相应的数据库表（如\
    \ books）中。\n- 3. 在 UI 代码中，我们必须处理：\n  1. 在 `WebContent/views/books/` 文件夹下的 `retrieveAnd.xhtml`\
    \ 的“检索/列出所有书籍”用例显示表中添加“特殊类型”列。没有特殊类别的书籍表格单元格为空，而对于所有其他书籍，其类别将在此单元格中显示，以及其他特定段的属性值。\n\
    \n在 `WebContent/views/books/` 文件夹下的 `create.xml` 和 `update.html` 的“创建书籍”和“更新书籍”用例中，添加“特殊类型”选择控件以及所有段属性的对应表单字段。只有当选择了相应的书籍类别时，才会显示段属性字段并对其进行验证。这种根据特定条件渲染特定表单字段的方法被称为**动态表单**。\n\
    \n![](img/26c953d1023457333859f69258a99556_177_0.png)\n\n![](img/26c953d1023457333859f69258a99556_177_1.png)\n\
    \n![](img/26c953d1023457333859f69258a99556_177_2.png)\n\n![](img/26c953d1023457333859f69258a99556_177_3.png)\n\
    \n图 14.1：Book 的实体模型。\n\n# 14.2.3 构建 Java 实体类\n\nJava 实体类可以针对后端直接编码。\n\n# 14.2\
    \ 案例研究 1：使用单继承实现类层次结构 — 163\n\n# 14.2.3 总结\n\n- 1. 编码枚举类型（用于 facelets）。\n- 2.\
    \ 使用 JPA 注解编码类。\n\n这些步骤将在后续章节详细讨论。\n\n# 14.2.3.2 举类型\n\n枚举类型 BookCategoryEL 被编码为\
    \ Java enum，提供了可读的字面量：\n\n```java\npublic enum BookCategoryEL {\n    TEXTBOOK(\"\
    TextBook\"), BIOGRAPHY(\"Biography\");\n    private final String label;\n\n  \
    \  BookCategoryEL(String label) {\n        this.label = label;\n    }\n    public\
    \ String getLabel() {\n        return label;\n    }\n}\n```\n\n# 14.2.3.2.1 类的编码\n\
    \n在使用 JPA 单表继承技术处理类层次结构时，必须为父类设置 `@Inheritance` 注解，并将 `strategy` 参数设置为 `InheritanceType.SINGLE_TABLE`。`@DiscriminatorColumn`\
    \ 注解指定了存储区分子类型的列（在我们示例中为 Textbook 和 Biography）。\n\n遗憾的是，我们无法使用 BookCategoryEL\
    \ 枚举定义区分列类型，因为像 BookCategoryEL.name() 这样的 Java 表达式常量常量因此会抛出 Java 编译器异常。相反，我们使用\
    \ `DiscriminatorType.STRING`。`@DiscriminatorValue` 注解指定了存储在表示类实例区分列中的唯一值。\n\n\
    ```java\n@Entity @Table(name=\"books\")\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    @DiscriminatorColumn(name=\"category\", discriminatorType=DiscriminatorType.STRING,\
    \ length=16)\n@DiscriminatorValue(value=\"BOOK\")\npublic class Book {\n    @Column(length=10)\n\
    \    @NotNull(message=\"必须提供 ISBN!\")\n    @Pattern(regexp=\"\\\\d{9}(\\\\d|X)\"\
    , message=\"ISBN 必须有效!\")\n    private String isbn;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"必须提供标题!\")\n    private String title;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"必须提供年份!\")\n    @Min(value=1459, message=\"年份不能早于 1459!\"\
    )\n    private Integer year;\n}\n```\n\n进一步，我们定义子类 Textbook 和 Biography：\n\n```java\n\
    @Entity(name=\"textbooks\")\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"\
    text\") @ViewScoped\npublic class Textbook extends Book {\n    @Column( nullable=false)\n\
    \    @NotNull(message=\"必须提供学科值\")\n    String subjectArea;\n}\n```\n\n# 14.2.4\
    \ STI 数据库模式\n\n由于注解的结果\n\n\n"
