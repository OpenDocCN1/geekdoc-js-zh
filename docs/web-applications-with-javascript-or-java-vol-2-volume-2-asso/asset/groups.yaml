    \  delete this._authors[author_id];\n  } else {\n    throw validationResult;\n\
    \  }\n}\n```\n\nFor assigning an array of ID references, or a map of object references,\
    \ to the property Book::authors, the method setAuthors adds one by one with the\
    \ help of addAuthor:\n\n```js\nset authors (a) {\n  this._authors = {};\n  if\
