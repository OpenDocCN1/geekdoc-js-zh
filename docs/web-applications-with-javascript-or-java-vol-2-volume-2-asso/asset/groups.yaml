    \ managed by the application in the form of entity table (a map of records). This\
    \ property is initially set to {}. For instance, in the case of the model Publisher,\
    \ we define:\n\n`Publisher.instances = {};`\n\nThe Book class from the JS model\
    \ is coded in a similar way:\n\n```javascript\nclass Publisher {\n  constructor({name,\
    \ address}) {\n    this.name = name;\n    this.address = address;\n  }\n  ...\n\
    }\n```\n\n```javascript\nclass Book {\n  constructor({isbn, title, year, authors,\
    \ authorRefs, publisher, publisher_id}) {\n    this.isbn = isbn;\n    this.title\
    \ = title;\n    this.year = year;\n    this.authors = authors || authorRefs;\n\
    \    if (publisher || publisher_id) {\n      this.publisher = publisher || publisher_id;\n\
    \    }\n  }\n  ...\n}\n```\n\nNote that the Book constructor can be invoked either\
    \ with object references authors or with ID references authorRefs and publisher_id.\
    \ This approach makes using the Book constructor more flexible and more robust.\n\
    \n### 2.5.3 Code the Property Checks\n\nTake care that all constraints of a property\
    \ as specified in the class model are properly coded in its check function, as\
    \ explained in Chapter 8 of Volume 1. Recall that constraint violation (or validation\
