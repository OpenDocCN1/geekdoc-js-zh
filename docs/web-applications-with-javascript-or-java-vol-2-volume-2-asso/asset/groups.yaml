    # 124 12 子类型与继承


    在对对象类型进行特化时，我们为新添加的子类型定义额外的特征。许多情况下，这些额外的特征是更具体的属性。例如，在 `TextBook` 特化 `Book` 的情况下，我们定义了额外的属性
    `subjectArea`。在某些编程语言中（如 Java），因此子类型扩展超类型。


    然而，我们也可以在不定义额外属性或操作的方法的情况下，通过定义额外的约束来特化对象类型。


    ## 12.2 通过泛化引入超类型


    我们通过图 12.2 所示的示例来说明泛化。


