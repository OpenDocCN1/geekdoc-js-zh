    \ (from BookCategory, frozen) | |\n| «get/set> subjectArea[0]: string | |\n| «get/set>\
    \ about[0]: string | |\n| checkISBN(in isbn: string) : ConstraintViolation | |\n\
    | checkISBNId(in isbn: string) : ConstraintViolation | |\n| checkTitle(in title:\
