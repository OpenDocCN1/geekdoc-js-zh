    Notice that the name of a publisher is used as an ID reference, since it is the\
    \ standard ID of the Publisher class.\n\n## 2.3 Make a JS Class Model\n\nThe starting\
    \ point for making a JS class model is an OO class model like the one shown in\
    \ Figure 1.10.\n\nWe now know how to derive a JS class model from this OO class\
    \ model in four steps. For each check in the OO class model:\n\n- 1. Add a `get/set`\
    \ stereotype to all (non-derived) single-valued properties, implying that they\
    \ have implicit getters and setters. Recall that in the setter, the corresponding\
    \ check operation is invoked and the property is only set, if the check does not\
    \ detect any constraint violation.\n- 2. Create a `check` operation for each (non-derived)\
    \ property in order to have a central place for implementing **property constraints**.\
    \ For a standard ID attribute (such as `Book::isbn`), two or three check operations\
    \ are needed:\n    - 1. A basic check operation, like `checkIsbn`, for checking\
    \ all syntactic constraints, but not the `mandatory` value and the `unique` constraints.\n\
    \    - 2. A standard ID check operation, like `checkIsbnAsId`, for checking the\
    \ **mandatory** value and uniqueness constraints that are implied by a standard\
    \ ID attribute.\n    - 3. If other classes have a reference property that references\
    \ the class under consideration, add an ID reference check operation for checking\
    \ the reference integrity constraint imposed on ID reference (or foreign key)\
    \ attributes. For instance, since the `Book::publisher` property references Publisher\
    \ objects, we need a `checkNameAsIdRef` operation in the Publisher class.\n\n\
    \  For a reference property, as `Book::publisher`, the check operation, Book.checkPublisher,\
    \ has to check the implied referential integrity constraint by invoking `Publisher.checkNameAsIdRef`,\
    \ and possibly also a mandatory constraint, if the property is mandatory.\n- 3.\
    \ Add a serialization function to `toString()` for showing an object's state in\
    \ error messages and log messages.\n- 4. Add an object-to-storage conversion function\
    \ to `Record()` that prepares a model object for being stored as a row in an entity\
    \ table, which can be serialized to a JSON string with `JSON.stringify` such that\
    \ it can be stored as a value of an app's `localStorage` datastore.\n\nThis leads\
    \ to the following JS class model for Book, where the class-level ('static') methods\
    \ are shown underlined:\n\n| Book | Book |\n| --- | --- |\n| isbn[1]: String (id)\
    \ | «get/set» isbn[1]: string (id) |\n| title[1]: String | «get/set» title[1]:\
    \ string |\n| year[1]: integer | «get/set» year[1]: number(int) |\n| publisher[0..]:\
    \ Publisher | «get/set» publisher[0..1]: Publisher |\n| | checkIsbn(in isbn: string):\
    \ ConstraintViolation |\n| | checkIsbnAid(in isbn: string): ConstraintViolation\
    \ |\n| | checkIsbnAsIdRef(in isbn: string): ConstraintViolation |\n| | checkTitle(in\
    \ title: string): ConstraintViolation |\n| | checkYearIn(year: number(int)): ConstraintViolation\
    \ |\n| | checkPublisher(in p: Publisher): ConstraintViolation |\n| | toString():\
    \ String |\n| | toRecord(): Object |\n\nWe have to perform a similar transformation\
    \ also for the class Publisher. This gives out the complete JS class model derived\
    \ from the above OO class model, as depicted in Figure 2.1.\n\n| Book |\n| ---\
    \ |\n| «get/set» isbn[1]: string (id) |\n| «get/set» title[1]: string |\n| «get/set»\
    \ year[1]: number(int) |\n| «get/set» publisher[0..1]: Publisher |\n| checkViolation(in\
    \ isbn: string): ConstraintViolation |\n| checkIsbnAid(in isbn: string): ConstraintViolation\
    \ |\n| checkIsbnAsIdRef(in isbn: string): ConstraintViolation |\n| checkTitle(in\
    \ title: string): ConstraintViolation |\n| checkYearIn(year: number(int)): ConstraintViolation\
    \ |\n| checkPublisher(in p: Publisher): ConstraintViolation |\n| toString(): String\
    \ |\n| toRecord(): Object |\n\n| Publisher |\n| --- |\n| «get/set» name: string\
