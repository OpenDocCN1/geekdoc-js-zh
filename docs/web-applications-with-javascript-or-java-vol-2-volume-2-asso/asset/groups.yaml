    \ | TextBook |\n| category[0..1] : BookTypeEL (frozen) | Biography |\n| subjectArea[0..1]\
    \ : String | |\n| about[0..1] : String | invariant (category=\"TextBook\" IF subjectArea=undefined\
    \ AND category=\"Biography\") |\n\nWe now derive a JS class model from this design\
    \ model.\n\n#### 13.2.1 Make the JS Class Model\n\nWe make the JS class model\
    \ in 3 steps:\n\n- 1. Replace the platform-independent datatypes (used as ranges\
