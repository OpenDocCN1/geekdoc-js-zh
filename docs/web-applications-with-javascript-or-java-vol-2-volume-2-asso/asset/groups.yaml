    \ authors), the table name is concatenated with the primary key column name, (e.g.,\
    \ authors_PERSONID).\n\nIt is possible to control these parameters, i.e., table\
    \ name and relation column names, by using the @JoinTable annotation. To obtain\
    \ a custom relation table, e.g., books_authors and the corresponding custom named\
    \ columns, e.g., book_isbn and author_personid, one can use:\n\n```\n@JoinTable(name=\"\
    books_authors\",\nJoinColumns={@JoinColumn(name=\"book_isbn\", referencedColumnName=\"\
    ISBN\")),\ninverseJoinColumns={@JoinColumn(name=\"author_personid\", referencedColumnName=\"\
    PERSONID\")})\n```\n\nIn our application, we keep the default, so a @JoinTable\
    \ annotation is not used.\nThe corresponding Author class is created as a Java\
