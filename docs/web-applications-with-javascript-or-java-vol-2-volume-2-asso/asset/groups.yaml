    about\");\n    }\n  } catch (e) {\n};\n```\n\n### 13.2.4 Write the View and Controller\n\
    \nThe app's user interface (UI) consists of a start page that allows navigating\
    \ to data management pages (in our example, books.html). Such a data management\
    \ page contains sections: manage books, list and retrieve all books, create book,\
    \ update book and delete book, such that only one of them is displayed (by setting\
    \ the CSS property display:none for others).\n\n### 13.2.4.1 Summary\n\nWe have\
