    | +get/authoredBooks[]: Book (manyToMany, mappedBy=\"authors\") |\n| +checkPersonId(in\
    \ pld: Integer, in em: EntityManager): ConstraintViolation |\n| +toString(): String\
    \ |\n| +... |\n\n# 9 使用 Java EE 实现双向关联\n\n## 9.2 编写模型\n\n可以直接为 Java 实体模型编码以获取\
    \ Java 后端应用的模型层代码。\n\n### 9.2.1 新问题\n\n与之前讨论单向关联应用相比，我们必须处理许多新的技术问题：\n\n- 1. 在模型代码中，你现在必须维护派生反向引用属性的维护，方法是维护构成派生反向引用属性值的派生（集合）反向引用。特别是\n\
    \  1. 每当单值主引用属性的值通过 setter 初始化或更新时（例如将指向 `Publisher` 实例 `p` 的引用赋值给 `Book` 实例 `b`\
    \ 的 `b.publisher`），必须向派生反向引用属性的相应值分配或添加反向引用（例如将 `b` 添加到 `p.publishedBooks`）；当主引用属性的值更新或变为多值时，必须删除指向单值主引用属性旧值的过时反向引用；\n\
    \  2. 每当可选单值主引用属性的值被取消设置时（例如通过给 `Book` 实例 `b` 的 `b.publisher` 赋值 `null`），必须从派生反向引用属性的相应值中移除反向引用（例如从\
    \ `p.publishedBooks` 中移除 `b`）；如果派生反向引用属性是多值的，否则派生反向引用属性的相应值必须是多值的，否则必须取消或更新；\n\
    \  3. 每当通过 add 方法向多值主引用属性的值添加引用时（例如向 `Book` 实例 `b` 的 `b.authors` 添加 `Author` 引用），必须向派生引用属性的相应值分配或添加反向引用（例如将\
    \ `b` 添加到 `a.authoredBooks`）；\n  4. 每当通过 remove 方法从多值主引用属性的值中移除引用时（例如从 `Book`\
    \ 实例 `b` 的 `b.authors` 中移除 `Author` 实例的引用），必须从派生反向引用属性的相应值中移除反向引用（例如从 `a.authoredBooks`\
    \ 中移除 `b`），如果派生反向引用属性是多值的，否则派生反向引用属性的相应值将被取消或更新；\n- 每当具有单引用或多个主引用属性值的对象被销毁时（例如当一个带有单引用\
    \ `b.publisher` 指向 `Publisher` 实例 `p` 的 `Book` 实例被销毁时），必须先移除派生反向引用（例如从 `p.publishedBooks`\
    \ 中移除 `p`）。注意，当创建一个带有单引用或多个引用的新对象时（例如带有单引用 `b.publisher` 的新 `Book` 实例），其 setter\
    \ 或 add 方法将被调用并负责反向引用的创建。\n\n- 在 UI 代码中，我们现在可以利用反向引用属性在列表用例中更有效地创建反向关联对象的列表。例如，我们可以更高效地为每个出版社创建出版书籍列表。\n\
    \n### 9.2 编写模型代码\n\n### 9.2.2 总结\n\n- 为 Java 实体的每个类编码。\n- 使用属性修饰符编写反向属性。\n- 使用\
    \ `@ToMany` 注解编写反向引用。\n- 编写 getter 和 setter 以及创建、更新和删除操作。\n- 使用添加和移除方法编写多值属性\n\
    \n### 9.2.3 为 Java 实体的每个类\n\n在 `Publisher` 类中，我们添加 `publishedBooks` 属性并使用对应于 `Book`\
    \ 类的 `@ToMany` 注解：\n\n```java\n@Entity\npublic class Publisher {\n    @OneToMany(fetch=FetchType.EAGER,\
    \ mappedBy=\"publisher\")\n    private Set<Book> publishedBooks;\n}\n```\n\n`@OneToMany`\
    \ 注解的 `mappedBy` 参数指定 `Book` 类中的属性：\n\n```java\n@Entity\npublic class Book {\n\
    \    @OneToOne(fetch=FetchType.EAGER)\n    @JoinColumn(name=\"publisher\")\n \
    \   private Publisher publisher;\n}\n```\n\n在 `Author` 类中，我们使用对应于 `Book` 类的 `@ToMany`\
    \ 注解添加 `authoredBooks` 属性：\n\n```java\n@Entity\npublic class Author {\n    @OneToMany(fetch=FetchType.EAGER,\
    \ mappedBy=\"authors\")\n    private Set<Book> authoredBooks;\n}\n```\n\n`@ManyToMany`\
    \ 注解的 `mappedBy` 属性指定 `Book` 类中的反向属性：\n\n```java\n@Entity\npublic class Book {\n\
    \    @ManyToMany(fetch=FetchType.EAGER)\n    @JoinTable(\n        name=\"books_authors\"\
    ,\n        joinColumns = @JoinColumn(name=\"BOOK_ISBN\"),\n        inverseJoinColumns\
    \ = @JoinColumn(name=\"AUTHOR_PERSONID\")\n    )\n    private Set<Author> authors;\n\
    }\n```\n\n我们还使用 `@JoinTable` 注解来指定多多关系的表名以及连接表的列名，例如表名为 `books_authors`，列名为 `BOOK_ISBN`\
    \ 和 `AUTHOR_PERSONID`。\n\n### 9.2.4 编写 setter 操作\n\n任何关联派生反向引用属性的引用属性 setter（实现双向关联），现在都需要向反向属性的相应值（集合）分配/添加/移除反向引用。这种\
    \ setter 的示例是以下 `setPublisher` 方法：\n\n```java\npublic class Book {\n\n  public\
    \ void setPublisher(Publisher publisher) {\n    // 从 publisher.publishedBooks\
    \ 中移除书籍引用\n    if (this.publisher != null) {\n      this.publisher.removePublishedBook(this);\n\
    \    }\n    // 将书籍添加到 publisher.publishedBooks\n    if (publisher != null) {\n\
    \      publisher.addPublishedBook(this);\n    }\n    this.publisher = publisher;\n\
    \  }\n\n}\n```\n\n### 9.2.5 编写添加和移除操作\n\n对于任何关联派生反向引用属性的多值引用属性，其添加和移除方法都必须向反向属性的（值集合）分配/添加/移除相应的引用。\n\
    \n"
