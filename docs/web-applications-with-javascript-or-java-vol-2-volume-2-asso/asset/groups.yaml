    After the platform-specific OO class model has been completed, one or more platform-specific
    implementation models, for a choice of specific implementation platforms, can
    be derived from it. Examples of types of platform-specific implementation are
    JS class models, Java Entity class models and SQL table models.


    A platform-specific implementation model can still be expressed in the form of
    a UML class diagram, but it contains only modeling elements that can be directly
    coded in the chosen platform. Thus, for any platform considered, two guidelines
    are needed: 1) how to make the platform-specific implementation model, and 2)
    how to code this model.


    ## 1.8 Rendering Reference Properties in the User Interface


    ## 1.9 Collection Types for Multi-Valued Reference Properties


    The widgets used for data input and output in a CRUD data management user interface
    (UI) normally correspond to properties defined in a model class of an app. We
    have to distinguish between (various types of) input fields corresponding to (various
    kinds of) attributes, and choice widgets (such as selection lists) corresponding
    to enumeration attributes or reference properties. Representing reference properties
    in the UI with select controls, instead of input fields, prevents the user from
    entering invalid ID references, so it takes care of referential integrity.


    In general, a single-valued reference property can be rendered as a select list
    in the UI, no matter how many objects populate the reference property''s range,
    from which one specific choice is to be made. If the cardinality of the reference
    property''s range is sufficiently small (say, not greater than 7), then we can
    also use a radio button group instead of a list.


    A multi-valued reference property can be rendered as a multiple-selection list
    in the UI. However, the corresponding multiple-select control of HTML is not really
    usable as soon as there are many (say, more than 20) options to choose from because
    the way the readers chooses is visually too scattered. In the special case of
    having only a few (say, not more than 7) options, we can also use a checkbox group
    instead of a multiple-selection list. But for the general case of having in the
    UI containing all associated objects chosen from the reference property''s range
    class, we need to develop a special UI widget that allows to (and remove) objects
    to (from) a list of chosen objects.


    Such a multiple-choose widget consists of:


    - an HTML list element containing all associated objects chosen from the reference
    property''s range class;

    - a select list that allows to add an object to the list of chosen objects;

    - a button that allows to remove an object from the list of chosen objects.


    By default, a non-functional association associates a set of instances of the
    target class with the source class, which means the collection values of the property
    are sets.


    In the following example, the association end is not ordered, while the collection
    is ordered.


    ## 1.16 Reference Properties Unidirectional Associations


