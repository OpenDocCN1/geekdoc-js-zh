    # 170 14 Java EE 的子类型


    - 1. 我们已经将 Person 分为 Employee 和 Author，并声明它们是互斥且完全的，也就是说，任何人要么是员工，要么是作者。由于 Java
    不支持多重分类，我们无法在 Java 中实现（建模角色时可能需要的）重叠的划分。


    - 2. 我们将 Person 变为一个抽象类（通过其*斜体*名称来标识），这意味着它不能有直接实例，只能通过其子类 Employee 和 Author 间接实例化。这一技术设计决策与“任何
    Person 都是 Employee 或 Author（或两者兼有）”这一事实相兼容，因此不需要任何对象直接实例化。


    ## 14.3.2 新问题


    与上文图 14.1 所示的第一个案例研究的模型相比，我们必须使用 JPA 注解来定义 Employee 与 Person 之间、以及 Author 与 Person
    之间的类别关系。

    在 UI 界面，我们需要处理：


    - 1. 为对应的 Author 和 Employee 模型类添加视图（在 WebContent/views/authors 和 WebContent/views/employees
    文件夹下）和控制器类（AuthorController 和 EmployeeController）。


    - 2. 处理 Manager 情况，通过在 WebContent/views/books/create.xhtml 和 WebContent/views/books/update.xhtml
    的“创建书籍”和“更新书籍”用例表单中添加“特殊类型”选择控件。只有在选择了对应的员工类型时，才会显示段属性字段（例如示例中的部门）并进行验证。


    ## 14.3.3 编写 Java 实体类模型类


    上图 14.2 所示的 Java 实体类是使用 JavaBeans Person、Employee 和 Author 以及枚举类型 EmployeeEL 编写的。


    ### 14.3.3.1 定义类别关系


    我们使用 JPA 注解定义 Employee 与 Person 之间、以及 Author 与 Person 之间的类别关系。首先，如所示创建 Person
    类：


    ```java

    @Entity @Table(name="persons")

    @Inheritance(strategy=InheritanceType.JOINED)

    ```


    ## 14.3 案例研究 2：使用连接继承实现类层次结构 — 171


    ```java

    @DiscriminatorColumn(name="category",

    discriminatorType=DiscriminatorType.STRING, length=16)

    public abstract class Person {

    @Id @NotNull(message="A person ID is required!")

    private Integer personId;

    @NotNull(message="A name is required!") @Column(nullable=false)

    private String name;

    }

    ```


    与用例 1 所示的 Book 层次结构相比，@Inheritance 注解定义了 strategy=InheritanceType.JOINED。这意味着，对于继承层次结构中的每个类，都会使用一个数据库表。@DiscriminatorColumn(name="category")
    指定了顶层层次结构类（即 Person）在对应表（即 persons）中的列，该列存储了用于识别每个条目（表）类型的判别值。


    注意 Java 类 Person 被声明为抽象类，这意味着它不能被初始化，相反，我们可以并初始化派生自子类（即 Employee 和 Author）。这也意味着我们没有声明
    @DiscriminatorValue，因为数据库表中没有存储 Person 的实例。


    此外，我们如下所示定义 Author 类：


    ```java

    @Entity @Table(name="authors")

    @DiscriminatorValue(value="AUTHOR")

    @ManagedBean(name="author") @ViewScoped

    public class Author extends Person {

    @NotNull(message="A biography is required!")

    private String biography;

    }

    ```


    Author 类继承自 Person，因此可以使用对应 personId 和 name 属性的 get 和 set 方法。@discriminatorValue(value="AUTHOR")
    指定了类别表中的列为每个来自持久化 Author 实例的条目存储值 AUTHOR。

    最后，我们定义了 Employee 类：


    ```java

    @Entity @Table(name="employees")

    @DiscriminatorValue(value="EMPLOYEE")

    @ManagedBean(name="employee") @ViewScoped

    public class Employee extends Person {

    @Column( nullable=false)

    @NotNull message="An employee ID is required!"

    private Integer empno;

    @Column(nullable=false, length=32)

    @Enumerated(EnumType.STRING)

    private EmployeeCategoryEL type;

    @Column(nullable=false, length=64)

    private String department;

    }

    ```


    ### 14.3.3.2 连接继承的数据库模式


    由于继承层次结构中的每个类都使用了 @Inheritance(strategy=InheritanceType.JOINED)，因此使用了数据库表。JPA
    生成的 DDL 脚本所示：


    | 表 | 列 | 约束 |

    | :--- | :--- | :--- |

    | persons | personId (PK), name, category | |

    | authors | personId (FK), biography, category | FK to persons |

    | employees | personId (FK), empno, type, department, category | FK to persons
    |


    注意 Java 类 Person 被声明为抽象类，这意味着它不能被初始化，相反，我们可以并初始化派生自子类（即 Employee 和 Author）。这也意味着我们没有声明
    @DiscriminatorValue，因为数据库表中没有存储 Person 的实例。（注：上面的表基于提供的逻辑）。


    ### 14.3.4 编写视图和控制器


    在用户界面中，对于每个 bean 类我们都有一个控制器。Person 类被定义为抽象类，并包含所有子类通用的 PersonId 方法。对于继承层次结构中的每个非抽象实体，我们都定义了一组视图。例如，对于
    Author，我们在 WebContent/views/authors 中中有 RetrieveAll.xml、create.xml、update.xml
    和 delete.xml。对于 Employee，如下所示：


    ```xml

    <h:column>

    <f:facet name="header">特殊员工类型</f:facet>

    #{e.type == null ? e.label.concat(" ").concat(department) : "")}

    </h:column>

    ```


    注意在 EL 表达式中我们无法使用 + 号来拼接字符串。EL 只允许将 + 用于数值加法。然而，我们可以使用 concat。


    ## 14.4 运行应用程序


    运行应用程序之前，你可能需要先停止 Tomcat/TomEE 服务器（Windows 使用 shutdown.bat，Linux 使用 shutdown.sh）。接下来，下载并解压包含应用程序源代码的
    ZIP 包以及你需要修改的 ANT 文件（修改 server.folder 属性值）。现在，在控制台中执行以下命令：


    ```bash

    ant deploy -Dappname=SubtypingApp

    ```


    最后，启动你的 Tomcat Web 服务器（Windows 使用 startup.bat，Linux 使用 startup.sh）。请耐心等待，这取决于电脑的速度。当控制台显示以下消息时，*INFO:
    Initializing Mojarra [此处显示某些库的版本和路径]* 对于上下文 ''/subtypingapp''，表示它已经就绪了。最后，打开浏览器并输入：


    ```http://localhost:8080/SubtypingApp/WebContent/views/app/index.xhtml

    ```


    # 15 子类型练习项目


    ## 15.1 项目 1 – 人物类型与电影类型


    要构建的应用程序目的是管理电影信息及其导演和演员，这些演员涉及两种两种类型的电影：传记片和电视剧集，如下模型所示：


    ![](img/26c953d1023457333859f69258a99556_190_0.png)


    按照我们的指南编写应用程序。


    确保你的页面符合 HTML5 的 XML 语法，并且你的 JavaScript 符合我们的编码规范（并通过了 JSHint 检查）。


