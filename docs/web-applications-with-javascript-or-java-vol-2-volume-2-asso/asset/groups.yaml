    | 1002 | Peter Boss | 23107 | Sales |


    **TCI 方法的优点：**(1) 显式地表示了从元素（类）角度给定的类层次结构的结构。(2) 当给定类层次结构的分段互不相交时，TCI 是内存高效的非冗余存储。


    **缺点：**(1) TCI 方法未能忠实地表示原始类层次结构中表达的子类型关系。特别是，对于任何代表子类实例（员工、经理或作者）的行，没有信息表明它代表一个父类。(2)
    TCI 方法需要重复列。(3) TCI 方法可能意味着数据冗余。


