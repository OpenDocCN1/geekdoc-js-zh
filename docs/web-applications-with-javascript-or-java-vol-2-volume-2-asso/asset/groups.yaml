    # 12.7.2 Subtyping and Inheritance with XML Schema


    In XML Schema, a subtype can be defined by *extending* or by *restricting* an
    existing complex type. While extending a complex type means *extending its intention*
    by adding elements or attributes, restricting a complex type means *restricting
    its extension* by adding constraints.


    We can define a complex type name="Person" and a subtype Student by extending
    Person in the following way:


    ```

    <xs:complexType name="Person">

    <xs:attribute name="firstName" type="xs:string" />

    <xs:attribute name="lastName" type="xs:string" />

    <xs:attribute name="gender" type="GenderValue" />

    </xs:complexType>

    <xs:complexType name="Student">

    <xs:extension base="Person">

    <xs:attribute name="studentNo" type="xs:string" />

    </xs:extension>

    </xs:complexType>

    ```


    We can define a subtype FemalePerson by restricting Person in the following way:


    ```

    <xs:complexType name="FemalePerson">

    <xs:restriction base="Person">

    <xs:attribute name="firstName" type="xs:string" />

    <xs:attribute name="lastName" type="xs:string" />

    <xs:attribute name="gender" type="GenderValue"

    use="fixed" value="f" />

    </xs:restriction>

    </xs:complexType>

    ```


    Notice by fixing the value of the gender attribute to "f", we define a constraint
    that is only satisfied by the female instances of Person.


