    \ this.firstName = first;\n    this.lastName = last;\n  }\n\n  getFirstName ()\
    \ {return this._firstName};\n  setFirstName (f) {\n    // . . . 检查\n    this._firstName\
    \ = f;\n  }\n\n  getLastName () {return this._lastName};\n  setLastName (l) {\n\
    \    // . . . 检查\n    this._lastName = l;\n  }\n}\n```\n\n然后，我们定义了一个子类 `Student`，它多了一个额外属性\
    \ `studNo`：\n\n```javascript\nclass Student extends Person {\n  constructor ({first,\
    \ last, studNo}) {\n    // 调用父类的构造函数\n    super({first, last});\n    // 分配额外属性\n\
