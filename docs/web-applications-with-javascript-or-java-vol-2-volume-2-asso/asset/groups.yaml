    \    if (book.authors[authorId]) delete book.authors[authorId];\n  }\n}\n```\n"
  mdcn: "\n\n## 4.3 使用原生 JS 实现单向非功能关联\n\n该模型除了包含单值引用属性 `Book::publisher`（它表示单向多对一关联\
