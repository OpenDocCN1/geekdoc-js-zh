    ));\n    }\n    if (mclListItemEl.classList.contains(\"added\")) {\n      authorIdRefsToAdd.push(mclListItemEl.getAttribute(\"\
    data-value\"));\n    }\n  }\n  // if the add/remove list is non-empty create a\
    \ corresponding slot\n  if (authorIdRefsToRemove.length > 0) {\n    slots.authorIdRefsToRemove\
    \ = authorIdRefsToRemove;\n  }\n  if (authorIdRefsToAdd.length > 0) {\n    slots.authorIdRefsToAdd\
    \ = authorIdRefsToAdd;\n  }\nBook.update(slots);\n// update the book selection\
    \ list's option element\nselectBookEl.options[selectBookEl.selectedIndex].text\
    \ = slots.title;\n}\n}\n```\n\n## 3.6 如何运行应用并获取代码\n\n你可以从我们的服务器运行应用并将其下载为 ZIP\
    \ 压缩包。\n\n## 3.7 注意事项\n\n我们仍然在模型层中为每个类和每个属性包含了重复的代码结构（称为**样板代码**），用于约束验证（检查和设置器），并为每个类包含了用于数据存储的管理方法（添加、更新和销毁）。虽然在学习应用开发时编写这些代码是有好处的，但在处理实际项目时，你不希望反复不断地编写它们。为了避免重复的样板代码，需要这些方法的通用形式，以便它们可以在应用的所有模型类中被复用。例如，`class-js`\
    \ 库提供了这种方法。\n\n## 4 使用 Java EE 实现单向函数关联\n\n单向函数关联可以是一对一，也可以是多对一。在这两种情况下，这种关联都是通过单个单值引用属性来表示或实现的。\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从具有表示单向函数关联的单值引用属性的 OO 类模型，导出 Java 实体类模型的数据模型；\n- 2. 如何以实体类（实现模型类）的形式编写\
    \ Java 实体类模型；\n- 3. 如何基于实体类编写视图和控制器代码。\n\n## 4.1 在 Java 中实现单值引用属性\n\n单值引用属性（例如\
    \ `Book` 类型对象的出版者）允许存储对另一种类型对象（如出版者）的内部引用。\n\n```java\n@Entity\n@Table(name=\"\
    books\")\npublic class Book {\n\n    @Id\n    private String isbn;\n\n    private\
    \ String title;\n\n    private Integer year;\n\n    @ManyToOne\n    private Publisher\
    \ publisher;\n\n    public Book() {}\n\n    public Book(String isbn, String title,\
    \ Integer year, Publisher publisher) {\n        this.isbn = isbn;\n        this.title\
    \ = title;\n        this.year = year;\n        this.publisher = publisher;\n \
    \   }\n\n    public String getIsbn() { return isbn; }\n    public void setIsbn(String\
    \ isbn) { this.isbn = isbn; }\n\n    public String getTitle() { return title;\
    \ }\n    public void setTitle(String title) { this.title = title; }\n\n    public\
    \ Integer getYear() { return year; }\n    public void setYear(Integer year) {\
    \ this.year = year; }\n\n    public Publisher getPublisher() { return publisher;\
    \ }\n    public void setPublisher(Publisher publisher) { this.publisher = publisher;\
    \ }\n\n    @Override\n    public String toString() {\n        return \"Book{\"\
    \ + \"isbn='\" + isbn + \"', title='\" + title + \"', year=\" + year + '}';\n\
    \    }\n}\n```\n\n## 4.2 创建 Java 实体类\n\n制作实体类的起点是所示的 OO 模型。在示例中，我们通过以下步骤获取实体类：\n\
    1. 将所有属性设为私有；\n2. 添加 getter 和 setter 方法；\n3. 添加 `toString` 方法；\n4. 添加初始化所有属性的构造函数。\n\
    \n## 4.3 新问题\n\n与之前讨论单类应用相比，我们必须处理许多新问题：\n\n- 1. 在模型代码中，我们需要处理**引用属性**，这需要：\n\
    \   1. 使用 JPA 注解定义引用完整性约束；\n   2. 结合引用属性扩展创建、更新和删除方法的代码；\n   3. 在序列化和反序列化操作中，提供在内部对象引用和相应的\
    \ ID 引用之间转换的方法。\n- 2. 在**用户界面**（视图）代码中，我们需要处理：\n   1. 在“检索/列出所有”用例显示关联对象的信息；\n\
    \   2. 在“创建对象”和“更新对象”用例中允许从目标类的现有实例列表中选择关联对象。\n\n## 4.4 编写模型代码\n\n可以直接编写 Java\
    \ 实体模型以获取 Java 后端应用的模型层。\n\n### 4.4.1 总结\n\n- 1. 将 Java 实体类模型中的每个类对应相应的实体类。\n\
    - 2. 使用 JPA 注解 @Id 编写 [id] 属性修饰符。\n- 3. 使用 JPA 注解（如 @ManyToOne）编写表示引用属性功能类型的修饰符（如\
    \ {manyToOne）。\n- 4. 使用 Java Bean Validation 注解（自定义验证注解）编写模型中指定的完整性约束。\n- 5. 编写\
    \ getter 和 setter。\n- 6. 以类方法的形式编写创建、检索、更新和删除存储管理操作。\n\n"
