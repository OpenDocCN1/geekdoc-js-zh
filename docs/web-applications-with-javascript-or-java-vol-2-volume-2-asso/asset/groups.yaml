    \ a field for each (non-derived) property of the class. The range of these properties\
    \ should be indicated in a comment. In the case of a reference property the range\
    \ is another model class.\n\nIn the constructor body, we assign the fields of\
    \ the record parameter to corresponding properties. These property assignments\
    \ invoke the corresponding setter methods.\n\nFor instance, the Publisher class\
    \ from the JS class model is coded in the following way:\n\n```\nclass Publisher\
    \ {\n  constructor(({name, address})) {\n    this.name = name;\n    this.address\
    \ = address;\n  }\n  ..\n}\n```\n\nSince the setters may throw constraint violation\
    \ exceptions, the constructor function, and any setter, should be called in a\
    \ try-catch block where the catch clause takes care of logging suitable error\
    \ messages.\n\nFor each model class C, we define a class-level property C.instances\
    \ representing the collection of all C instances managed by the application in\
    \ the form of an entity table (a map of records). This property is initially set\
