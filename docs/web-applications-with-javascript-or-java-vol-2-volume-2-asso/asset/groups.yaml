- md: "\n## 9. Implementing Bidirectional Associations with Java EE\n\nFor instance,\
    \ for the multi-valued reference property Book::authors is coupled to the derived\
    \ inverse property Author::authoredBooks for implementing the bidirectional association\
    \ between Book and Author, the addAuthor method is coded in the following way:\n\
    \n```java\npublic class Book {\n  public void addAuthor(Author author) {\n   \
    \ if (this.authors == null) {\n      this.authors = new HashSet<Author>();\n \
    \   }\n    if (!this.authors.contains(author)) {\n      this.authors.add(author);\n\
    \      author.addAuthoredBook(this);\n    }\n  }\n}\n```\n\nFor the removal removeAuthor\
    \ we obtain the following code:\n\n```java\npublic class Book {\n  public void\
    \ removeAuthor(Author author) {\n    if (this.authors != null && author != null\
    \ &&\n        this.authors.contains(author)) {\n      // delete the author reference\n\
    \      this.authors.remove(author);\n      // delete the derived inverse reference\n\
    \      author.removeAuthoredBook(this);\n    }\n  }\n}\n```\n\nRemember, for a\
    \ Java Collection, such as Set or List, the contains method compares two objects\
    \ by using the equals method of the objects. For example, for using the contains\
    \ method over a Set<>, such as publishedBooks, in the Author class we implement\
    \ the following equals method (two authors are equal if their personId property\
    \ values are):\n\n### 9.2 Write the Model Code\n\n```java\npublic class Author\
    \ {\n  @Override\n  public boolean equals(Object obj) {\n    if (obj instanceof\
    \ Author) {\n      Author author = (Author) obj;\n      return (this.personId.equals(author.personId));\n\
    \    } else return false;\n  }\n}\n```\n\n### 9.2.6 Take Care of Deletion Dependencies\n\
    \nWhen a Book instance b, with a single reference b.publisher to a Publisher instance\
    \ and multiple references b.authors to Author instances, is destroyed, the derived\
    \ inverse references have to be removed first (e.g., removing b from p.publishedBooks).\
    \ This is accomplished by calling the methods for the single and multi-valued\
    \ properties with a null parameter, e.g., b.setPublisher(null) and b.setAuthors(null)\
    \ within the Book.delete method:\n\n```java\npublic class Book {\n  public static\
    \ void delete(EntityManager em,\n    UserTransaction ut, String isbn) throws Exception\
    \ {\n    ut.begin();\n    Book b = em.find(Book.class, isbn);\n    b.setPublisher(null);\n\
    \    b.setAuthors(null);\n    em.remove(b);\n    ut.commit();\n  }\n}\n```\n\n\
    In the same way, we have to take care of deleting the references to Book instances\
    \ when deleting a Publisher or an Author instance:\n\n```java\npublic class Author\
    \ {\n  ..\n  public static void delete(EntityManager em,\n    UserTransaction\
    \ ut, Integer personId) throws Exception {\n    ut.begin();\n    Author a = em.find(Author.class,\
    \ personId);\n    a.setAuthoredBooks(null);\n    em.remove(a);\n    ut.commit();\n\
    \  }\n}\n```\n\nAnd, likewise,\n\n```java\npublic class Publisher {\n  public\
    \ static void delete(EntityManager em,\n    UserTransaction ut, String name) throws\
    \ Exception {\n    ut.begin();\n    Publisher p = em.find(Publisher.class, name);\n\
    \    p.setAuthoredBooks(null);\n    em.remove(p);\n    ut.commit();\n  }\n}\n\
    ```\n\n### 9.2.7 Entity Managers and Cached Entities\n\nUnfortunately, JPA does\
    \ not provide automatic maintenance of inverse references. According to the Java\
    \ Persistence Wiki, we have to implement the (di- and inverse) relations management\
    \ with set/add/remove methods:\n\n> A common problem with bidirectional relationships\
    \ is the application updates one side of the relationship, while the other side\
    \ does not updated, and becomes out of sync. In JPA, as in general, it is the\
    \ responsibility of the application or the object model to maintain relationships.\
    \ If your application adds to one side of a relationship, then it must add to\
    \ the other side. This is commonly resolved through add or set methods in the\
    \ object model that handle both sides of the relationships, so the application\
    \ code needs not to worry about it. There are two ways to go about this: you can\
    \ either add the relationship maintenance code to one side of the relation, and\
    \ only use the setter from that side (such as making the other side protected),\
    \ or add to both sides and ensure you avoid an infinite loop.\n\nWe have used\
    \ an entity manager for each controller class. Every entity manager maintains\
    \ a set of cached entities which can be “shared” with other entity managers using\
    \ the merge method. In our example code, as part of the create and update methods\
    \ of each model class, we have to merge the entities that belong to another entity\
    \ manager. For example, in the Book.create method, we need to merge the new book's\
    \ publisher, managed by the PublisherController's entity manager, and all its\
    \ authors, managed by the AuthorController's entity manager:\n\n```java\npublic\
    \ class Book {\n    public static void create(EntityManager em,\n    UserTransaction\
    \ ut,\n    String isbn, String title, Integer year,\n    Publisher publisher,\
    \ Set<Author> authors)\n    throws Exception {\n    ut.begin();\n    Book book\
    \ = new Book(isbn, title, year,\n    publisher, authors);\n    em.persist(book);\n\
    \    if (publisher != null) {\n    em.merge(publisher);\n    }\n    if (authors\
    \ != null) {\n    for (Author a : authors) {\n    em.merge(a);\n    }\n    }\n\
    \    ut.commit();\n}\n```\n\nWithout using merge, the publisher as well as all\
    \ author instances from the authors list, do not represent references to the originally\
    \ cached entities, and are not going to retain their changes. For more details,\
    \ please check the Java Persistence Documentation related to this.\n\nIt is also\
    \ possible to disable the JPA caching, so the entities are reloaded from the database\
    \ for every new instance, e.g., when EntityManager.find method is called. This\
    \ can be achieved by adding the following line in the persistence.xml file:\n\n\
    ```xml\n<property name=\"eclipselink.cache.shared.default\" value=\"false\"/>\n\
    ```\n\nThe above configuration works for eclislink implementation and it may be\
    \ different for other API implementations. Notice that disabling entity caching\
    \ is not recommended without a serious reason, since it degrades the app's performance\
    \ and may produce unpredictable behavior in some cases, such as using SessionScoped\
    \ managed entities.\n\n## 9.3 Exploiting Derived Reference Properties in the Interface\n\
    \nWe can now exploit the derived inverse properties Publisher::publishedBooks\
    \ and Author::authoredBooks for more efficiently creating a list associated.\n\
    \n### 9.3.1 Show Information About Published Books in Retrieve/List\n\nFor showing\
    \ information about published books in the retrieve/list all publishers, we can\
    \ now exploit the derived inverse property:\n\n```xml\n<ui:composition template=\"\
    /WEB-INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n<h:dataTable value=\"\
    #{publisherController.publishers}\" var=\"p\">\n<h:column>\n<f:facet name=\"header\"\
    >Published books</f:facet>\n<h:outputText value=\"#{p.Books}\" escape=\"false\"\
    \ converter=\"pl.converter.BookListConverter\"/>\n</h:column>\n</h:dataTable>\n\
    <h:button value=\"Back\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n\
    ```\n\nIn the case of unidirectional associations, for the case of the retrieve/list\
    \ all authors, we have used a method in the Book model class, i.e., getAuthorNames(),\
    \ which returns a comma-separated list of author names as a string:\n\n```java\n\
    public class Book {\n  ...\n  public String getAuthorNames() {\n    String result\
    \ = \"\";\n    int i = 0, n = 0;\n    if (this.authors != null) {\n      n = this.authors.size();\n\
    \      for (Author author : this.authors) {\n        result += author.getName();\n\
    \        if (i<n-1) {\n          result += \", \";\n        }\n        i++;\n\
    \      }\n    }\n    return result;\n  }\n}\n```\n\nThis makes sense in the case\
    \ of a book, since the number of authors is general limited to a small number.\
    \ However, a Publisher may have a large number of published books. As a better\
    \ alternative to our string serialization, we can use a JSF converter which allows\
    \ us to present the list of authors in a custom way. In our case, we choose to\
    \ present it as list of names, where every name is presented on a separate line.\
    \ For this, we implement the `p.m.converter.BookListConverter` and annotate it\
    \ with `@FacesConverter` as follows:\n\n```java\n@FacesConverter(value=\"pl.m.converter.BookListConverter\"\
    )\npublic class BookListConverter implements Converter {\n    @Override\n    public\
    \ Object getObject(FacesContext context, UIComponent component, String value)\
    \ {\n        return null; // this method is not needed\n    }\n    @Override\n\
    \    public String getString(FacesContext context, UIComponent component, Object\
    \ value) {\n        String result = \"\";\n        int i=0, n=0;\n        if (value\
    \ == null) {\n            return null;\n        } else if (value instanceof Set<?>)\
    \ {\n            n = ((Set<Book>).value).size();\n            for (Book b : (Set<Book>)\
    \ value) {\n                result += b.getTitle();\n                if (i<n-1)\
    \ {\n                    result += \"<br/>\";\n                }\n           \
    \ }\n        }\n        i++;\n        return result;\n    }\n}\n```\n"
  mdcn: "\n\n## 9. 使用 Java EE 实现双向关联\n\n例如，对于多值引用属性 `Book::authors` 耦合到派生反向属性 `Author::authoredBooks`\
    \ 以实现 `Book` 和 `Author` 之间的双向关联，`addAuthor` 方法的代码如下：\n\n```java\npublic class\
    \ Book {\n  public void addAuthor(Author author) {\n    if (this.authors == null)\
    \ {\n      this.authors = new HashSet<Author>();\n    }\n    if (!this.authors.contains(author))\
    \ {\n      this.authors.add(author);\n      author.addAuthoredBook(this);\n  \
    \  }\n  }\n}\n```\n\n对于删除操作 `removeAuthor`，我们获得以下代码：\n\n```java\npublic class\
    \ Book {\n  public void removeAuthor(Author author) {\n    if (this.authors !=\
    \ null && author != null &&\n        this.authors.contains(author)) {\n      //\
    \ 删除作者引用\n      this.authors.remove(author);\n      // 删除派生的反向引用\n      author.removeAuthoredBook(this);\n\
    \    }\n  }\n}\n```\n\n记住，对于 Java 集合（如 `Set` 或 `List`），`contains` 方法通过对象的 `equals`\
    \ 方法来比较两个对象。例如，在 `Author` 类中对 `Set<>`（如 `publishedBooks`）使用 `contains` 方法，我们实现了以下\
    \ `equals` 方法（如果两个作者的 `personId` 属性值相等，则相等）：\n\n### 9.2 编写模型代码\n\n```java\npublic\
    \ class Author {\n  @Override\n  public boolean equals(Object obj) {\n    if (obj\
    \ instanceof Author) {\n      Author author = (Author) obj;\n      return (this.personId.equals(author.personId));\n\
    \    } else return false;\n  }\n}\n```\n\n### 9.2.6 处理删除依赖关系\n\n当一个 `Book` 实例\
    \ `b`（具有单个引用 `b.publisher` 指 `Publisher` 实例和多个引用 `b.authors` 指 `Author` 实例）被销毁时，必须先移除派生的反向引用（例如从\
    \ `p.publishedBooks` 中移除 `b`）。这通过在 `Book.delete` 方法中带入 `null` 参数调用单值和多值属性的方法来实现，例如\
    \ `b.setPublisher(null)` 和 `b.setAuthors(null)`：\n\n```java\npublic class Book\
    \ {\n  public static void delete(EntityManager em,\n    UserTransaction ut, String\
    \ isbn) throws Exception {\n    ut.begin();\n    Book b = em.find(Book.class,\
    \ isbn);\n    b.setPublisher(null);\n    b.setAuthors(null);\n    em.remove(b);\n\
    \    ut.commit();\n  }\n}\n```\n\n同样，在删除 `Publisher` 或 `Author` 实例时，我们必须处理对 `Book`\
    \ 实例的引用：\n\n```java\npublic class Author {\n  ..\n  public static void delete(EntityManager\
    \ em,\n    UserTransaction ut, Integer personId) throws Exception {\n    ut.begin();\n\
    \    Author a = em.find(Author.class, personId);\n    a.setAuthoredBooks(null);\n\
    \    em.remove(a);\n    ut.commit();\n  }\n}\n```\n\n同样地，\n\n```java\npublic class\
    \ Publisher {\n  public static void delete(EntityManager em,\n    UserTransaction\
    \ ut, String name) throws Exception {\n    ut.begin();\n    Publisher p = em.find(Publisher.class,\
    \ name);\n    p.setAuthoredBooks(null);\n    em.remove(p);\n    ut.commit();\n\
    \  }\n}\n```\n\n### 9.2.7 实体管理器与缓存实体\n\n遗憾的是，JPA 未提供对反向引用的自动维护。根据 Java Persistence\
    \ Wiki，我们必须通过 `set`/`add`/`remove` 方法来实现（单向和反向的）关系管理：\n\n> 双向关系中的一个常见问题是应用程序更新了关系的一侧，而另一侧没有更新，导致不同步。在\
    \ JPA 中，通常情况下，维护关系是应用程序或对象模型的责任。如果应用程序添加了关系的一侧，则必须添加到另一侧。这通常通过对象模型中处理关系双侧的方法来解决。有两种方法：你既可以在关系的一侧添加关系维护代码，并仅使用该侧的\
    \ setter（例如使另一侧受保护），也可以在双侧都添加，以避免无限循环。\n\n我们为每个控制器使用了一个实体管理器。每个实体管理器都维护一组缓存实体，这些实体可以通过\
    \ `merge` 方法与其他实体管理器“共享”。在示例代码中，在每个类的 `create` 和 `update` 方法中，我们必须合并属于另一个实体器的实体。例如，在\
    \ `Book.create` 方法中，我们需要合并由 `PublisherController` 管理的新书籍出版社，以及由 `AuthorController`\
    \ 管理的所有作者：\n\n```java\npublic class Book {\n    public static void create(EntityManager\
    \ em,\n    UserTransaction ut,\n    String isbn, String title, Integer year,\n\
    \    Publisher publisher, Set<Author> authors)\n    throws Exception {\n    ut.begin();\n\
    \    Book book = new Book(isbn, title,\n    publisher, authors);\n    em.persist(book);\n\
    \    if (publisher != null) {\n    em.merge(publisher);\n    }\n    if (authors\
    \ != null) {\n    for (Author a : authors) {\n    em.merge(a);\n    }\n    }\n\
    \    ut.commit();\n}\n```\n\n如果不使用 `merge`，`authors` 列表中的 `publisher` 将不会代表缓存实体，也不会保留其更改。更多细节请查看相关的\
    \ Java Persistence 文档。\n\n也可以禁用 JPA 缓存，以便每次调用 `EntityManager.find` 方法都从数据库重新加载实体。这可以通过在\
    \ `persistence.xml` 文件中添加以下行来实现：\n\n```xml\n<property name=\"eclip.cache.default\"\
    \ value=\"false\"/>\n```\n\n上述配置适用于 EclipseLink 实现，其他实现可能不同。注意，除非有严重原因，否则不建议禁用实体缓存，因为它会在某些情况下（如使用\
    \ `SessionScoped` 实体）产生不可预测的行为。\n\n## 9.3 在接口中利用派生引用属性\n\n我们现在可以使用派生反向属性 `Publisher::publishedBooks`\
    \ 和 `Author::authoredBooks` 更高效地创建关联列表。\n\n### 9.3.1 在列表中显示书籍信息\n\n为了在列出所有出版社时显示书籍信息，我们现在可以使用派生反向属性：\n\
    \n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define\
    \ name=\"content\">\n<h:dataTable value=\"#{publisherController.publishers}\"\
    \ var=\"p\">\n<h:column>\n<f:facet name=\"header\">Published books</f:facet>\n\
    <h:outputText value=\"#{p.Books}\" escape=\"false\" converter=\"pl.converter.BookListConverter\"\
    />\n</h:column>\n</h:dataTable>\n<h:button value=\"Back\" outcome=\"index\" />\n\
    </ui:define>\n</ui:composition>\n```\n\n在单向关联的情况下，对于列出所有作者的情况，我们在 `Book` 模型类中使用了一个方法\
    \ `getAuthorNames()`，它返回逗号分隔的作者名称字符串：\n\n```java\npublic class Book {\n  ...\n\
    \  public String getAuthorNames() {\n    String result = \"\";\n    int i = 0,\
    \ n = 0;\n    if (this.authors != null) {\n      n = this.authors.size();\n  \
    \    for (Author author : this.authors) {\n        result += author.getName();\n\
    \        if (i<n-1) {\n          result += \", \";\n        }\n        i++;\n\
    \      }\n    }\n    return result;\n  }\n}\n```\n\n这对于书籍来说是合理的，因为作者数量通常限制在较小范围内。然而，一个出版社可能有有很多出版物。作为字符串序列化的更好替代方案，我们可以使用\
    \ JSF 转换器，允许我们以自定义的方式展示作者列表。在我们的案例中，我们将其呈现为名称列表，每个名称单独占一行。为了实现这一点，我们实现了 `p.m.converter.BookListConverter`\
    \ 并按如下注释了 `@FacesConverter`：\n\n```java\n@FacesConverter(value=\"pl.m.converter.BookListConverter\"\
    )\npublic class BookListConverter implements Converter {\n    @Override\n    public\
    \ Object getObject(FacesContext context, UIComponent component, String value)\
    \ {\n        return null; // 此方法不需要\n    }\n    @Override\n    public String getString(FacesContext\
    \ context, UIComponent component, Object value) {\n        String result = \"\"\
    ;\n        int i=0, n=0;\n        if (value == null) {\n            return null;\n\
    \        } else if (value instanceof Set<?>) {\n            n = ((Set<Book>).value).size();\n\
    \            for (Book b : (Set<Book>) value) {\n                result += b.getTitle();\n\
    \                if (i<n-1) {\n                    result += \"<br/>\";\n    \
    \            }\n            }\n        }\n        i++;\n        return result;\n\
    \    }\n}\n```\n\n"
