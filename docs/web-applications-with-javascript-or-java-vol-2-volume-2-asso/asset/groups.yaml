    \ = subjectArea;\n    if (about) this.about = about;\n  }\n  get isbn() { . .\
    \ }\n  static checkIsbn(isbn) { . . }\n  static checkIsbnAsId(isbn) { . . }\n\
    \  set isbn(isbn) { . . }\n  get title() { . . }\n  static checkTitle(t) { . .\
    \ }\n  set title(t) { . . }\n  get year() { . . }\n  static checkYear(y) { . .\
    \ }\n  set year(y) { . . }\n  get category() { . . }\n  static checkCategory(c)\
    \ { . . }\n  set category(c) { . . }\n  get subjectArea() { . . }\n  static checkSubjectArea(sA,\
    \ cat) { . . }\n  set subjectArea(s) { . . }\n}\n```\n\n## 13.2 Case Study 1:\
    \ Eliminating a Class Hierarchy\n\n```js\nget about() { . . }\nstatic checkAbout(a,\
    \ cat) {. . . }\nset about(a) { . . }\n```\n\nNote that the constructor function\
    \ is defined with a single record parameter using the ES2015 feature of function\
    \ destructuring.\nWe code the checkCategory and setCategory methods for the category\
    \ attribute in the following way:\n\n```js\nstatic checkCategory(c) {\n  if (c\
    \ === undefined || c === \"\") {\n    return new NoConstraintViolation(); // category\
    \ is optional\n  } else if (!util.isIntegerOrIntegerString(c) || parseInt(c) <\
