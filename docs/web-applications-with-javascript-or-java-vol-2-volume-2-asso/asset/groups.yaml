    \ We have two possi-ilities for dealing with this situation:\n\n+   1. delete\
    \ all books (co-)authored by the deleted author;\n2. drop from all books (co-)authored\
    \ by the deleted author the reference to the de-leted author.\n\nWe go for the\
    \ second option. This is shown in the following code of the Author.de-lete method:\n\
    \n```\npublic static void delete(EntityManager em, UserTransaction ut,\nInteger\
    \ personId) throws Exception {\nut.begin();\nAuthor author = em.find(Author.class,\
    \ personId);\n// Find all books of this author\nQuery query = em.createQuery(\"\
    SELECT DISTINCT b FROM Book b \" +\nINNER JOIN b.authors WHERE a.personId = :personId\"\
    );\nquery.setParameter(\"personId\", personId);\nList<Book> books = query.getResultList();\n\
    // Remove the author reference from the books' authors\nfor (Book b : books) {\n\
    \  b.getAuthors().remove(author);\n}\n// Delete the author record (table row)\n\
    em.remove(author);\nut.commit();\n}\n```\n\nEssentially, the delete operation\
    \ consists of three steps:\n\n+   1. Create a JPQL query which selects all books\
    \ of this author (since this is a uni-directional association from books to authors,\
    \ the books of an author are not rect-ibly from an author).\n2. For every found\
    \ book referencing this author, we have to remove the author ref-er from its authors\
