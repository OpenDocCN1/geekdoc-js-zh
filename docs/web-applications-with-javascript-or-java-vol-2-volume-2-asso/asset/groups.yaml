    \ |\n| |checkTitle(title: String) : ConstraintViolation | |toRecord() : Object\
    \ |\n| |checkYear(year: integer) : ConstraintViolation | Author |\n| |checkPublisher(publisher:\
    \ String) : ConstraintViolation | |get/set::authorid: number(int) (id) |\n| |checkAuthorAid(authorid:\
    \ String) : ConstraintViolation | |get/set::name: string |\n| |checkAuthor(author:\
    \ Author) : ConstraintViolation | |checkAuthorAid(aid: number(int)) : ConstraintViolation\
    \ |\n| |addAuthor(author: Author) | |checkAuthorAidRef(aid: number(int)) : ConstraintViolation\
    \ |\n| |removeAuthor(author: Author) | |checkName(n: string) : ConstraintViolation\
    \ |\n| |toString() : string | |toString() : string |\n| |toRecord() : Object |\
    \ |toRecord() : Object |\n\n## 3.3 New Issues\n\nIn dealing with a functional\
    \ association, as discussed in the previous chapter, we now have to deal with\
    \ the following new issues:\n\n- 1. In the model code we have to take care of\
    \ multi-valued reference properties that require implementing\n  - 1. an add and\
    \ a remove method, such as addAuthor and removeAuthor, as well as a setter method\
    \ for assigning a set of object references with the help of the add method, possibly\
    \ converting ID references to object references; three methods may need to check\
    \ cardinality constraints, if there are any;\n  - 2. a class-level check operation,\
    \ such as checkAuthor, which has to invoke the corresponding check AsRef method\
    \ of the property's range class for checking the property's implicit referential\
    \ integrity constraint;\n  - 3. converting a collection of object references to\
    \ a collection of ID references in the object-storage conversion function toRecord.\n\
    - 2. In the user interface (“view”) code we now have to take care of\n  - 1. showing\
    \ information about a set of associated objects in the property's column of the\
    \ table view of the Retrieve/list all use case; the simplest approach is showing\
    \ a comma-separated list of ID references, possibly combined with corresponding\
    \ names; alternatively, HTML lists can be rendered in the property's data table\
    \ cells;\n  - 2. allowing to select a set of associated objects from a list of\
    \ all existing instances of the property's range class in the Create and Update\
    \ cases.\n\nThe last issue, allowing to select a set of associated objects from\
    \ a list of all instances, can not be solved with the help of an HTML multiselect\
    \ control because of its poor usability. Whenever the selectable options is greater\
    \ than a threshold (defined by the number of options that can be seen on the screen\
    \ without scrolling), the multiple-select element is no longer usable, and an\
    \ alternative multiple-choice widget has to be used.\n\n## 3.4 Code the Model\n\
    \nNotice that, for simplicity, we do not include the code for all constraint validation\
