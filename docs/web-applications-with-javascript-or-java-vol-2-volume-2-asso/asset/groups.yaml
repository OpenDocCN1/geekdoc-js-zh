  - "[PAGE 82]\n\n# 5 Unidirectional Non-Functional Associations with Java EE\n\n\
    A unidirectional non-functional association is either one-to-many or many-to-many.\
    \ In both cases such an association is represented with the help of a multi-valued\
    \ reference property.\n\nIn this chapter, we show\n\n+   1. how to derive Java\
    \ Entity class model from an OO class model with multi-valued reference properties\
    \ representing unidirectional non-functional associations,\n2. how to code the\
    \ Java Entity class model in the form of entity classes (implementing model classes),\n\
    3. how to write the view and controller code based on the model code.\n\n# 5.1\
    \ Implementing Multi-Valued Reference Properties in Java\n\nA multi-valued reference\
    \ property, as Book::authors, allows storing collection of internal references\
    \ to objects of some type, such as references to Author objects. When creating\
    \ a new type of Book, the constructor function needs to have a parameter for providing\
    \ a suitable value for this property. In general, the value can be a set of internal\
    \ object references or of ID references. With JPA, we use object references:\n\
    \n```\n@Entity @Table (name=\"books\")\n@ManagedBean (name=\"book\")\n@ViewScoped\n\
    public class Book {\n\n    private Set<Author> authors;\n\n    public Book() {\
    \ // required by JPA @Entity annotation!\n    public Book( String isbn, String\
    \ title, Integer year,\n                Publisher publisher, Set<Author> authors)\
    \ { . . }\n\n    public Set<Author> getAuthors() { return this.authors; }\n  \
    \  public void setAuthors( Set<Author> authors) { this.authors = authors; }\n\
    }\n```"
- md: "\n## 5.2 Make a Java Entity Class Model\n\nOur starting point for making a\
    \ Java Entity class model is the following OO class model:\n\n| Book | Publisher\
    \ |\n|---|---|\n| isbn[1] : String (id) | name : String (id) |\n| title[1] : String\
    \ | address : String |\n| year[1] : Integer | |\n| publisher[0..1] : Publisher\
    \ | |\n| authors[*] : Author | |\n| | Author | |\n| | personid : integer (id)\
    \ | |\n| | name : String | |\n\nThis model contains, in addition to the single-valued\
    \ reference property Book::publisher representing the unidirectional many-to-one\
    \ association Book-has-Publisher, the multi-valued reference property Book::authors\
    \ representing the unidirectional many-to-many association Book-has-Author.\n\n\
    Recall that we obtain a Java Entity class, like Author, from the corresponding\
    \ class in the OO class model, by (1) making all properties private, (2) using\
    \ Java data-type classes, (3) adding public getters and setters, (4) adding a\
    \ toString function, (5) adding the data storage methods create, retrieve, update\
    \ and delete:\n\n| «Java Entity» Author |\n|---|---|\n| «get/set» -personid :\
    \ Integer (id) |\n| «get/set» -name : String |\n| +checkPersonoidAsId(in pld :\
    \ Integer, in em : EntityManager) : ConstraintViolation |\n| +toString() : String\
    \ |\n| +(...) |\n\nIn the Java Entity class model, any reference property specified\
    \ in the OO model is annotated with the functionality type of the association\
    \ represented by it.\n\n## 5.4 Write the Model Code — 69\n\nIn our example, we\
    \ annotate the reference property authors in the Entity class Book with manyToMany:\n\
    \n| «Java Entity» |\n|---|---|\n| «get/set-isbn[1] : String (id) |\n| «get/set-title[1]\
    \ : String |\n| «get/set-year[1] : Integer |\n| «get/set-publisher[0..1] : Publisher\
    \ (manyToMany) |\n| «get/set-authors[*] : Author (manyToMany) |\n| +checkbnAid(in\
    \ : String, in : EntityManager) : ConstraintViolation |\n| +addAuthor(in : Author)\
    \ |\n| +removeAuthor(in : Author) |\n| +toString() : string |\n\n## 5.3 New Issues\n\
    \nCompared to dealing with a unidirectional functional association, as discussed\
    \ in the previous sentence, we have to deal with the following new technical issues:\n\
    \n1. In **model classes** we now have to take care of **multi-valued reference\
    \ properties** that have to be annotated with `@OneToMany` or `@ManyToMany`.\n\
    2. In the **user interface** code we have to take care of:\n   1. showing information\
    \ about a collection of associated objects in the view table columns that render\
    \ multi-valued reference properties in the *retrieve* list all objects use case;\n\
    \   2. allowing to select a collection of associated objects from a list of all\
    \ existing instances of the target class in the *create* object and *update* object\
    \ use cases.\n\nThe last issue, allowing to select a collection of associated\
    \ objects from a list of all existing instances of some class, in general, cannot\
    \ be solved with the help of an HTML select multiple element because of usability\
    \ problems. Whenever the set of selectable options is greater than a certain threshold\
    \ (defined by the number of options that can be seen on the screen without scrolling),\
    \ the HTML select multiple element is no longer usable, and an alternative multi-selection\
    \ widget has to be used.\n\n## 5.4 Write the Model Code\n\nThe Java Entity class\
    \ model can be directly coded for implementing the model layer of our Java back-end\
    \ app.\n\n### 5.4.1 Summary\n\n1. Code each class of the Java Entity class model\
    \ as a corresponding entity class.\n2. Code any [id] property modifier with the\
    \ JPA property annotation @Id.\n3. Code any property modifier denoting the functionality\
    \ type of a reference property, such as [manyToOne], with the corresponding JPA\
    \ annotation, such as @ManyToMany.\n4. Code the integrity constraints specified\
    \ in the model with the help of Java Bean Validation annotations (or custom validation\
    \ annotations).\n5. Code the getters and setters as well as the add and remove\
    \ methods for multivalued properties.\n6. Code the create, retrieve, update and\
    \ delete storage management operations as class-level methods.\n\nThese steps\
    \ are discussed in more detail in the following sections.\n\n### 5.4.2 Each Class\
    \ of the Java Entity Class Model\n\nFor the multi-valued reference property Book::authors,\
    \ we use a parametrized Set type:\n\n```\n@Entity @Table( name=\"books\")\n@ViewScoped(@ManagedBean\
    \ ( name=\"book\")\npublic class Book {\n\n    @ManyToMany ( fetch=FetchType.EAGER)\n\
    \    private Set<Author> authors;\n\n    public Book() {}\n    public Book( String\
    \ isbn, String title, Integer year,\n               Publisher publisher, Set<Author>\
    \ authors) { . . }\n\n    . . .\n    public Set<Author> getAuthors() { return\
    \ this.authors; }\n    public void setAuthors(Set<Author> authors) { this.authors=authors;\
    \ }\n\n}\n```\n\nThe JPA annotation @ManyToMany allows to specify the Many-To-Many\
    \ relation between the Book and Author. The annotation parameter FetchType.EAGER\
