  md: '# 4.4 Write the Model Code 57


    useful and it should be used whenever the data to be retrieved can be handled
    in main memory.

    FetchType.LAZY, implying that referenced entities are not automatically retrieved
    with a referencing entity. In example means that the referenced Publisher entity
    is not retrieved with a referencing Book entity, leaving the value of the publisher
    property to null. With this fetching behavior, referenced entity has been retrieved
    separately by invoking the reference property''s getter in the context of a transaction
    (in our example by invoking getPublisher).


    In the case of a single-valued reference property (representing a functional association)
    annotated with @OneToOne or @ManyToMany, the default value is FetchType.EAGER,
    so referenced entities are fetched together with referencing entities, while in
    the case of a non-functional association (with either @ToMany or @ManyToMany),
    the default value is FetchType.LAZY, so referenced entities are not fetched together
    with referencing entities, but have to be retrieved separately, if needed.


    As a result of JPA annotations, the following SQL table creation statement for
    creating the tables is:


    ```

    CREATE TABLE IF NOT EXISTS `books` (

    `ISBN` varchar(10) NOT NULL,

    `TITLE` varchar(255) NOT NULL,

    `YEAR` int(10) NOT NULL,

    `PUBLISHER_NAME` varchar(255) DEFAULT NULL

    FOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers` (`NAME`)

    );

    ```


    # 4.4.3 Code the Constraints


    Take care that all property constraints specified in the entity class model are
    properly coded using suitable Bean Validation annotations. For instance, for the
    attribute name, we have to use the JPA annotation @Id for specifying that the
    attribute corresponds to the primary key column of the database table to which
    the entity is mapped, and the Bean Validation annotation @NotNull for defining
    a mandatory value constraint that is checked before an entity is saved to the
    database.


    In the case of the address attribute, we have to define a mandatory value constraint
    in two forms: with the JPA annotation @Column(nullable=false) for the corresponding
    table column, and with the Bean Validation annotation @NotNull for the attribute.'
