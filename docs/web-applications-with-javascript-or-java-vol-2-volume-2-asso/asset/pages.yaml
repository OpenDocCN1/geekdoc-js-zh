  md: "26 — 2 Implementing Unidirectional Functional Associations with Plain JS\n\n\
    # 2.4 New Issues\n\nCompared to the validation and enumeration apps discussed\
    \ in Volume 1, we have to deal with a number of new technical issues:\n\n+   1.\
    \ In the model code we now have to take care of reference properties that require\n\
    \    1. maintaining referential integrity;\n    2. choosing and implementing one\
    \ of the two deletion policies discussed in Section 1.2 for managing the corresponding\
    \ object destruction dependency in the destroy method of the property’s range\
    \ class;\n    3. conversion between internal object references and external ID\
    \ references in the serialization function toString() and the conversion function\
    \ toRecord(), as well as in the constructor function.\n\n+   2. In the user interface\
    \ (“view”) code we now have to take care of\n    1. showing information about\
    \ associated objects in the Retrieve/List use case;\n    2. allowing to select\
    \ an object from a list of all instances of the association's target class and\
    \ add it to, or remove an object from, a list of associated objects, in the Create\
    \ and Update cases.\n\n# 2.5 Code the Model\n\nThe JS class can be directly coded\
    \ for getting the JS classes of our app.\n\n# 2.5.1 Summary\n\nCode each class\
    \ of the JS class model as an ES2015 class with implicit getters and setters:\n\
    \n+   1. Code the property checks in the form of class-level (‘static’) methods.\
    \ Take care that all constraints of a property as specified in the JS class model\
    \ are properly coded in the property checks.\n2. For each single-valued property,\
    \ code the specified getter and setter that in each setter, the corresponding\
    \ property is invoked and the property is only set/unset, the check does not detect\
    \ any constraint violation.\n3. Write the code of the serialization function toString()\
    \ and the storage conversion function toRecord().\n4. Take care of deletion dependencies\
    \ in the destroy method.\n\nThese steps are discussed in more detail in the following\
    \ sections."
