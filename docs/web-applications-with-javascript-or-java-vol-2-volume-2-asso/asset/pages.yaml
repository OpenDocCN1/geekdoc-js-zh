  md: '# Web Ontology Language


    OWL is formal logic language for representation on the Web. It allows defining
    vocabularies (mainly classes with properties) and supports expressing many types
    of integrity constraints on them. OWL is the basis for performing automated inferences,
    such as checking the consistency of an OWL vocabulary. Vocularies, or data models,
    defined in the form of UML class models can be converted to OWL vocabularies and
    then checked for consistency.


    # P


    Portable Network Graphics Polyfill


    PNG is an open (non-proprietary) graphics format that supports lossless compression.

    A polyfill is a piece of JavaScript code for emulating a standard JavaScript method
    in a browser, which does not support the method.


    # R


    Resource Description Framework


    RDF is a W3C language for representing machine-readable propositional information
    on the Web.


    # S


    Standard Generalized Markup Language


    SGML is an ISO specification for defining markup languages. HTML4 has been defined
    with SGML. XML is a simplified successor of SGML. HTML5 is no longer SGML-based
    and has its own parsing rules.


    Scalable Vector Graphics


    SVG is a 2D image format based on XML. SVG can be styled with CSS and make interactive
    using JavaScript. HTML5 allows direct embedding of SVG content in an HTML document.

    A slot is a name-value pair. In an object-oriented program (for instance, in a
    Java object), a slot normally is a property-value pair. But in a JavaScript object,
    a slot may also consist of a method name and method body or it may be a key-value
    pair of a map.


    Slot'
