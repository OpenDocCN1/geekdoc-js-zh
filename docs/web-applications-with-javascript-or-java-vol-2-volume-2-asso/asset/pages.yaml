    # 4.2 Make a Java Entity Class Model


    The starting point for making a Java Entity class is an OO class model like the
    one shown in Figure 1.10.

    As explained before, we obtain the Entity class Publisher from the corresponding
    OO design class by (1) making all properties private, (2) using Java data-type
    classes (String, Integer, etc.), (3) adding the stereotype «get/set» to properties
    (specifying public getters and setters), (4) adding to toString function, (5)
    adding the (class-level) data storage methods to retrieve, update and delete:


    | Java Entity |

    |Publisher |

    |<get/set>-name : String |

    |<get/set>-address : String |

    |+checkNameAid(in : String, em : EntityManager) : ConstraintViolation |

    |+toString(): String |

    |+retrieveAll(in : EntityManager) : List<Publisher> |

    |+retrieve(in : EntityManager, name : String) : Publisher |

    |+create(in : EntityManager, name : String, address : String) |

    |+update(in : EntityManager, name : String, address : String) |

    |+delete(in : EntityManager, name : String) |


    In a Java Entity class model, for any association end dot in the OO class model,
    we show the property reference representing the association and annotate it with
    the functionality type of the unidirectional association represented by it. In
    our example, we use a property publisher in the Entity class and annotate it with
    the association''s functionality type manyToOne:


    | Java Entity |

    |Book |

    |<get/set>-isbn[1] : String |

    |<get/set>-title[1] : String |

    |<get/set>-year[1] : Integer |

    |<get/set>-publisher[0..1] : Publisher (manyToOne) |

    |+checkIsbnAid(isbn : String, em : EntityManager) : ConstraintViolation |

    |+toString(): String |

    |..() |'
