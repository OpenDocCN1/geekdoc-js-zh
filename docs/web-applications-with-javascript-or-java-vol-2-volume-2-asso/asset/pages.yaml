  md: "# 4 Implementing Unidirectional Functional Associations with Java EE\n\nA unidirectional\
    \ functional association is either one-to-one or many-to-one. In both cases such\
    \ an association is represented, or implemented, with the help of a single-valued\
    \ reference property.\n\nIn this chapter, we show\n\n+   1. how to derive a data\
    \ model in the form of a Java Entity class model from an OO class model with single-valued\
    \ reference properties representing unidirectional functional associations,\n\
    2. how to code the Java Entity class model in the form of entity classes (implementing\
    \ model classes),\n3. how to write the view and controller code based on the entity\
    \ classes.\n\n# 4.1 Implementing Single-Valued Reference Properties in Java\n\n\
    A single-valued reference property, such as the publisher of the object type Book,\
    \ allows storing internal references to objects of another type, such as Publisher.\
    \ When creating a new object, the constructor function needs to have a parameter\
    \ for allowing to assign a suitable value to the reference property. In a typed\
    \ programming language, as Java, we may have to take a decision if this value\
    \ is expected to be an internal object reference or an ID reference. Using the\
    \ JPA object-to-storage mapping technology, we can work with object references\
    \ and leave the mapping to corresponding ID references to JPA. The Book class\
    \ is extended as follows:\n\n```\n@Entity @Table(name=\"books\")\n@Scoped @ManagedBean(name=\"\
    Book\")\npublic class Book {\n\n    private Publisher publisher;\n\n    public\
    \ Book() {}\n\n    public Book(String isbn, String title, Integer year,\n    \
    \  Publisher publisher) { . . . }\n\n    public Publisher getPublisher() { . .\
    \ . }\n}\n```"
