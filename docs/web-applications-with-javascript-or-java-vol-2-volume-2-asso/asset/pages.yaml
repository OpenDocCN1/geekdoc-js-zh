  md: '# 1 Reference Properties and Unidirectional Associations


    A property defined for an object type, or class, is called a reference property
    if its values are references that reference one of another, or of the same type.
    For instance, the Committee shown in Figure 1.1 below has a reference property
    chair, the values of which are references to objects of type ClubMember.

    An association between object types classifies relationships between objects of
    those types. For instance, the association Committee-hasClubMember-as-chair, which
    is visualized as a connection line in the class diagram shown Figure 1.2, classifies
    the relationships FinanceCommittee-has-PeterMiller-as-chair, RecruitmentCommittee-has-SusanSmith-as-chair
    and AdvisoryCommittee-has-SarahAnderson-as-chair, where the objects PeterMiller,
    SusanSmith and SarahAnderson are of type ClubMember, and the objects FinanceCommittee,
    RecruitmentCommittee and AdvisoryCommittee are of type Committee. An association
    as a set of relationships can be represented as a table like so:


    | Committee-hasClubMember-as-chair |

    |--- |--- |

    | Finance Committee | Peter Miller |

    | Recruitment Committee | Susan Smith |

    | Advisory Committee | Sarah Anderson |


    Reference properties correspond to a special form of associations, namely unidirectional
    binary associations. While a binary association does, in general, need not to
    be directional, a reference property represents a binary association that is directed
    from the property''s domain class (where it is defined) to its range class.

    In general, associations are relationship types with two or more object types
    participating in them. An association between two object types is considered binary.
    In this book we only say ''association'' when we mean ''binary association''.


    While individual relationships (such as FinanceCommittee-has-PeterMiller-as-chair)
    are important information items in business communication and in information systems,such
    as Committee-hasClubMember-as-chair) are important elements of information models.
    Consequently, software applications have to implement them in a proper way, typically
    as part of their model layer within a model-view-controller (MVC) architecture.
    Unfortunately, many application frameworks lack the required support for dealing
    with associations.'
  merge: -1
