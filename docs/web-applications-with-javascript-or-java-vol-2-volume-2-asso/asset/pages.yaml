    # 12.7 Subtyping and Inheritance in Computational Languages Programming


    Subtyping and inheritance have been supported in Object-Oriented Programming (OOP),
    in database languages (such as SQL99), in the XML definition language XML Schema,
    and in other computational languages, in various ways and to different degrees.
    At its core, subtyping in computational languages is about defining hierarchies
    and the inheritance of features: properties, constraints and methods in OOP; table
    columns and constraints in SQL99; elements, attributes and constraints in XML
    Schema.


    In general, it is desirable to have support for multiple classification and multiple
    inheritance in type hierarchies. Both language features are closely related and
    considered to be advanced features, which may not be needed in many applications
    or can be dealt with using workarounds.


    **Multiple classification** means that an object has more than one direct type.
    This is mainly the case when an object plays multiple roles at the same time,
    and therefore directly instances multiple classes defining these roles.


    **Multiple inheritance** is typically also related to role classes. For instance,
    a student assistant is a person playing both the role of a student and the role
    of an academic staff member, so a corresponding OOP class StudentAssistant inherits
    from both classes Student and AcademicStaffMember. In a similar way, in our model
    above, an AmphibianVehicle inherits from both role classes LandVehicle and WaterVehicle.


