  md: '# 7 Bidirectional Associations


    In OO modeling and programming, a bidirectional association is an association
    that is represented as a pair of mutually inverse reference properties, which
    allow ''navigation'' (object access) in both directions.

    The model shown in Figure 7.1 below (about publishers, books and their authors)
    serves as our running example. Notice that it contains two bidirectional associations,
    as indicated by the ownership dots at both association ends.


    | Publisher | published Books | Book | authored Books | Author |

    | :--- | :--- | :--- | :--- | :--- |

    | name : String (id) | | isbn : String (id) | | personid : Integer (id) |

    | address : String | 0.1 | * | year : Integer | * | name : String |


    Figure 7.1: The Publisher-Book-Author Information design model with bidirectional
    associations.


    # 7.1 Inverse Properties


    For being able to easily retrieve the committees that are chaired or co-chaired
    by a club member, we add two reference properties to our Committee-ClubMember
    example: the property of a club member to be the chair of a committee (ClubMember::sharedCommittee)
    and the property of a club member to be the co-chair of a committee (ClubMember::coChairedCommittee)
    may chair or co-chair at one committee (where the disjunction is non-exclusive).
    So, we get the following model:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..] : Committee |

    | chair : ClubMember | coChairedCommittee[0..] : Committee |


    Notice that there is a close correspondence between the two reference properties
    Committee::chair and ClubMember::chairedCommittee. They are the inverse of each
    other: when the club member Tom is the chair of the committee, expressed by the
    tuple ("budget committee", "Tom"), then the budget committee is chaired by the
    club member Tom, expressed by the inverse tuple ("Tom", "budget committee"). For
    expressing this inverse correspondence in the diagram, we append an inverse property
    constraint, inverse of chair, in curly braces'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'to the declaration of the property ClubMember::chairedCommittee, and a similar
    one to the property CommitteeMember::chair, as shown in the following diagram:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember (inverse of chairedCommittee) | coChairedCommittee[0..1]
    : Committee |


    Using the reference path notation of OOP languages, with c referencing a Committee
    object, we obtain the equation:


    ```

    c.chair.chairedCommittee = c (7.1)

    ```


    Or, the other way around, with m referencing a Committee object, we obtain the
    equation:


    ```

    m.chairedCommittee.chair = m (7.2)

    ```


    Notice when the property $p_2$ is the inverse of a property $p_1$, this implies
    that, the other way around, $p_1$ is the inverse of $p_2$. Therefore, we declare
    the property ClubMember::chairedCommittee to be the inverse of Committee::chair,
    then, implicitly, Committee::chair is the inverse of ClubMember::chairedCommittee.
    We therefore call Committee::chair and ClubMember::chairedCommittee a pair of
    mutually inverse reference properties. Having such a pair in a model implies redundancy
    because each of the two reference properties can be derived from the other by
    inversion. This type of redundancy implies data storage storage and update overhead
    which is the price to pay for the bidirectional navigability that supports efficient
    object access in both directions.


    For maintaining the duplicate information of a mutually inverse reference property,
    it is common to treat one of the inverse properties as the *master*, and the other
    as the *slave*, and take this distinction into consideration in the code of the
    change methods (such as the property setters) of the affected model classes. We
    indicate the slave of an inverse reference property pair in a model by declaring
    the *derived* property using the UML notation of a slash (/) as a prefix of the
    property name as shown in the following diagram:


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | coChairedCommittee[0..1] : Committee |


    The property chairedCommittee in ClubMember is now *derived* (as indicated by
    its slash prefix). Its annotation {inverse of chair} defines a *derivation rule*
    according to which it is derived by inverting the property Committee::chair.'
