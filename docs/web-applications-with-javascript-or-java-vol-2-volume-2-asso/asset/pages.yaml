    Notice that from a purely computational point of view, we are free to choose between
    the two mutually inverse reference properties (like Book::authors and Author::authored)
    to be the master. However, in many cases, associations represent asymmetrical
    ontological existence dictate which of the two mutually inverse reference properties
    is the master. For instance, the authorship association between the classes Book
    and Author represents an ontological existence dependency of books on their authors.
    A book existentially depends on its author(s), while an author does not existentially
    depend on any of her books. Consequently, the corresponding object lifecycle dependency
    between Book and Author implies that their bidirectional association is maintained
    by maintaining Author references in Book::authors as Author::authoredBooks is
    the natural choice of master property, while Author is the slave property, which
    is derived from Book::authors.


    # 7.2 Making an OO Class Model


    Since classical OO programming languages do not support explicit associations
    as first class citizens, but only classes with reference properties representing
    implicit associations, we have to eliminate all explicit associations for obtaining
    an OO class model.


    # 7.2.1 The Basic Property


    The starting point of our association elimination procedure is an information
    design model with various kinds of unidirectional and bidirectional associations,
    such as the model shown in Figure 7.1. If the model still contains any non-directed'
