    We define the category relationships between Employee and Person, as well as between
    Author and Person, using the JPA annotations. At first we create the Person class
    as shown:


    ```

    @Entity @Table(name="persons")

    @Inheritance(strategy=InheritanceType.JOINED)

    ```'
