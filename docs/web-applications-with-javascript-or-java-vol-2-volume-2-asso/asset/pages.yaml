  md: "# 4.4.2 Code Each Class of the Entity Model\n\nEach class C of the Java entity\
    \ class model is coded as an annotated bean class with name C having a default\
    \ constructor (no parameters) and a constructor with entity creation parameters.\n\
    \nFor instance, the Book class from the Entity class model is coded in the following-way:\n\
    \n```\n@Entity( name=\"books\")\n@ViewScoped ManagedBean(name=\"book\")\npublic\
    \ class Book {\n  @Id @NotNull(message=\"An ISBN is required!\")\n  private String\
    \ isbn;\n  @Column(nullable=false)\n  @NotNull(message=\"A title is required!\"\
    )\n  private String title;\n  @Column(nullable=false)\n  @NotNull(message=\"A\
    \ year is required!\")\n  private Integer year;\n  @ToOne( fetch=FetchType.EAGER)\n\
    \  private Publisher publisher;\n\n  public Book() {}\n  public Book(String isbn,\
    \ String title, Integer year, Publisher publisher) {\n    this.setIsbn(isbn);\n\
    \    this.setTitle(title);\n    this.setYear(year);\n    this.setPublisher(publisher);\n\
    \  }\n  .. // getters, etc.\n}\n```\n\nThe @ManyToOne annotation on the publisher\
    \ is used for specifying the functionality type of the association Book has Publisher\
    \ represented by the reference property publisher since it holds that a book has\
    \ one publisher and a publisher has many books. This annotation also allows to\
    \ specify a fetch type with the parameter fetching one of the following two values:\n\
    \n+   - FetchType.EAGER, implying that a retrieval of an entity includes a retrieval\
    \ of the associated entity referenced by the entity with this property. In our\
    \ example, this means that when a Book entity is retrieved, the Publisher entity\
    \ referenced by the book's publisher property is also retrieved. This behavior\
    \ is very"
