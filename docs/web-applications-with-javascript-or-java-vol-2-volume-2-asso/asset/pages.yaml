  md: '# # 10 Special Topics on Associations


    # ## 10.1 Part-Whole Associations


    A part-whole association represents a relationship between a part type and a whole
    type. Its instances are part-whole relationships between two objects where one
    of them is a part of the other (the). The UML makes a distinction between two
    kinds of part-whole associations: aggregation and composition. While these two
    terms are defined in a pretty precise, albeit unsatisfactory, way in the UML,
    many software developers have a different interpretation following a terminological
    tradition of the C++ programming community where, unlike the parts of an ''aggregation-composition'',
    the parts of a ''composition'' cannot exist independently of the composite references
    them.


    We follow the UML and improve their definition of composition by introducing a
    distinction between two kinds of compositions: those with separable parts and
    those with inseparable parts.


    # ### 10.1.1 Aggregation


    An aggregation is a special form of a part-whole association, where the parts
    of a whole can be shared with others. For instance, we can model an aggregation
    between the classes DegreeProgram and Course, as shown in the following diagram,
    since a course is part of a degree program and a course can be shared among two
    or more degree programs (e.g. an engineering degree could share a C programming
    course with a computer science degree),


    | DegreeProgram | Course |

    | :--- | :--- |

    | name : String | id : String |


    However, the concept of an aggregation with shareable parts doesn''t mean much,
    really, so does not have any implications on how to code the association and many
    developers prefer not to use the white diamond in their class diagrams, but just
    model a plain association instead. The UML spec says "Precise semantics of shared
    aggregation varies by application area and modeler".


    The multiplicity of an aggregation''s association end at the whole side may be
    any number (*) because a part may belong to, or shared among, any number of wholes.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# 10.1.2 Composition


    It''s amazing how much confusion exists about the distinction between the part-whole
    association concepts aggregation and composition. The main problem is the widespread
    misunderstanding (even among expert software developers and among the authors
    of UML) the concept of composition implies a life-cycle dependency between the
    whole and its parts that the parts cannot exist without the whole. But this view
    ignores the fact that there are also cases of part-whole associations with non-shareable
    parts where the parts can be detached and survive the destruction of the whole.


    In the UML specification document, the definition of the term "composition" has
    always implied non-shareable parts, but it is not clear what is the defining characteristic
    of "composition". In the UML version 2.5 (as of 2015), after an attempt to provide
    the definition of the term "composition", it remains still ambiguous and doesn''t
    provide any guidance to how model part-whole associations with non-shareable parts
    where the parts can be detached from, and survive the destruction of, the whole
    as opposed to the case where the parts cannot be detached and are destroyed together
    with the whole. They say:


    > If a composite object is deleted, all of its parts are objects and deleted with
    it.


    But at the same time they also say:


    > A part may be removed from a composite object before the composite object is
    deleted, and thus not be deleted as part of the composite object.


    This confusion points to an incompleteness of the UML definition, which does not
    account for life-cycle dependencies between components and composites. It''s therefore
    important to understand how the UML definition can be enhanced, e.g. by introducing
    a UML stereotype for «inseparable» compositions, or by introducing a constraint
    key word inseparable for characterizing the association end at the component side.


    Martin Fowler has explained, the main issue for characterizing composition relationships
    is that "an object can only be the part of one composition relationship". This
    is also explained in the blog post UML Composition with Aggregation as Association
    by G. Bellekens. In addition to defining this characteristic of a composition
    (to exclusive, or non-shareable, parts), a composition may also come with a life-cycle
    dependency between the composite and its components. In fact, there are two kinds
    of such dependencies:


    +   1. Whenever a composite must be attached to a composite, or in other words,
    when it has a mandatory composite, as expressed by the "exactly one" multiplicity
    at the composite side of the composition line, then it must be re-used (or re-attached
    to) another composite, or destroyed, when its current composite is destroyed.
    This is exemplified by the composition between Person and Heart, shown in the
    diagram below. A heart is either destroyed or transplanted to another person,
    when its owner has died.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '2. Whenever a component must not be detached from its composite, or in other
    words, when it is inseparable, then, and only then, the component has to be destroyed,
