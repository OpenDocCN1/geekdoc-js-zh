    # Introduction


    This book teaches you how to code in JavaScript using tried-and-true methods.
    Step-by-step programming techniques in JavaScript are given in the book so that
    you can master them effectively. A scripting language is JavaScript. You''ll notice
    that HTML tags have a lot of scripts embedded in them. Because JavaScript cannot
    function independently, I decided to embed it in HTML to be used in web browsers.


    If you''d like to put what you''ve learned into practice, open a code editor,
    copy the code, and paste it in to see what happens. You may also simply load the
    website into your computer browser to see the results right there on the page.
    Embedded scripts are complete and ready to use. The ideal strategy is to memorize
    the scripts and alter them to make them more personalized to learn faster and
    have more fun.


    This book is the best literature you will find on the market, whether you are
    developing websites or are a student aspiring to be a web developer or building
    a website for your own business. You''ll be in the correct mentality to move on
    and understand the more challenging topics once you''ve completed the first couple
    of chapters. Start gently and then raise your speed as your grasp of the concepts
    improves.


    This book provides tried-and-true processes and tactics for learning to code from
    the ground up. Even better, intermediate systems and lessons are available, allowing
    people who are already familiar with JavaScript to step up their game and use
    it with more advanced tools and systems.


    Don''t worry; you won''t have to pay for any additional third-party software or
    tools to learn Javascript. If you''re using a Mac, all you''ll need is Notepad
    or TextEdit. When you get to the intermediate stages, though, you''ll want to
    utilize a source code editor that supports HTML and CSS, such as Notepad ++.

