  md: "controlling event behavior. How events propagate through\n\nthe \n\nDOM \n\n\
    and \n\nhow \n\nto \n\nuse \n\nevent \n\nmethods \n\nlike\n\n`**.stopPropagation()**`\
    \ and `**.preventDefault()**` to control and modify\n\nthis behavior.\n\n**Example\
    \ of** `**.stopPropagation()**`**:**\n\nThe `**.stopPropagation()**` method is\
    \ used to prevent the event\n\nfrom propagating to parent elements. It stops the\
    \ event from\n\n“`**bubbling up**`” the DOM tree.\n\n`<div id=”parent”>`\n\n`<button\
    \ id=”child”>Click Me</button>`\n\n`</div>`\n\n`<script>`\n\n`$(document).ready(function()\
    \ {`\n\n`$(“#child”).click(function(event) {`\n\n`alert(“Child button clicked!”);`\n\
    \n`event.stopPropagation(); // Prevent the event from`\n\n`reaching the parent`\n\
    \n`});`\n\n`$(“#parent”).click(function() {`\n\n`alert(“Parent div clicked!”);`\n\
    \n`});`\n\n`});`\n\n`</script>`\n\nIn this example, when you click the “`**Click\
    \ Me**`” button, it\n\ntriggers an alert, and the `**.stopPropagation()**` method\
    \ prevents\n\nthe click event from propagating to the parent div. So, you\n\n\
    will only see the “`**Child button clicked!**`” alert. If you remove\n\nthe `**.stopPropagation()**`\
    \ you will see the second alert after the\n\nfirst one is closed.\n\n**Example\
    \ of** `**.preventDefault()**`**:**\n\nThe `**.preventDefault()**` method is used\
    \ to prevent the default\n\nbehavior of certain HTML elements, such as links and\
    \ form\n\nsubmissions."
