    In this example, when you click the “`**Click Me**`” link or submit


    the form, the `**.preventDefault()**` method is used to prevent the


    default behavior (navigating to another page or submitting


    the form). Instead, an alert message is displayed.


    These examples illustrate how to use `**.stopPropagation()**` and


    `**.preventDefault()**` to control event propagation and default


