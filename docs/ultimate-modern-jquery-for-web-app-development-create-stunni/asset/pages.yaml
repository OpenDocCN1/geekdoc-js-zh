    \ is clicked, its index and a\n\nmessage are displayed in the “`**output**`” div.\n\
    \n4\\. A custom data object (`**obj**`) is associated with the “`**output**`”\n\
    \ndiv to be used in click events. When you click the\n\n“`**output**`” div, the\
