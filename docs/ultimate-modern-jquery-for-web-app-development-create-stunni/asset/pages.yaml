    **Using the **`**:eq()**`** Selector:**


    The `:``**eq()**` selector allows you to select a specific element


    within a set by providing its index. Indexing starts from 0.


    For example, to select the second element within a set of


    elements, you would use `**:eq(1)**` because it is at index 1


    (remember, the index is 0-based).


    `$(‘ul li:eq(2)’).css(‘color’, ‘red’);`


    In this case, the text color of the third `**<li>**` element (index 2)


    within a `**<ul>**` element is changed to red.


    **Using the **`**:lt()**`** Selector:**


    The `**:lt()**` selector allows you to select all elements up to,


    but not including, a specified index. This is useful when you


    want to select a range of elements within a set. To select the


    first three elements, you would use `**:lt(3)**``:`


    `$(‘ul li:lt(3)’).addClass(‘highlight’);`'
