    them down. Animation duration is customizable:


    `$(“#slideDownElement”).slideDown(1000);`


    .`**slideToggle()**`: Toggle Sliding


    The .`**slideToggle()**` method toggles between sliding an


    element up and down. It’s perfect for creating collapsible


    sections:


