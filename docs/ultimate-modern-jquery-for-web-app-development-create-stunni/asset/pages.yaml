  md: 'Event delegation is a powerful approach for handling events


    on dynamically created elements. It allows you to attach


    event handlers to a parent element and capture events from


    its children, reducing the need for individual event bindings.


    **The **`**.on()**`** method**


    The `**.on()**` method is a versatile way to attach multiple events


    to elements. It simplifies event binding, making it easier to


    manage multiple interactions on a single element.


    `<button id=”myButton”>Click Me</button>`


    `JavaScript (jQuery):`


    `$(document).ready(function() {`


    `// Attach a click event handler to the button element with the`


    `ID “myButton”`


    `$(‘#myButton’).on(‘click’, function() {`


    `alert(‘Button clicked!’);`


    `});`


    `});`


    In this example, when the document is ready (that is, the


    DOM is fully loaded), a click event handler is attached to the


    button element with the ID “`**myButton**`.” When the button is


    clicked, it triggers the click event, and the event handler


    displays an alert with the message “`**Button clicked!**`”


    The `**.on()**` method provides a way to handle various events,


    including click, hover, keypress, and more, and it’s a


    powerful tool for event delegation and dynamic event


    handling in jQuery.


    **Exercise: Attach events with the on**


