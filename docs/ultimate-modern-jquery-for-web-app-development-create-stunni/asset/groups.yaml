    \ the event execution completely.\n5. d) `.on()`\n\n## CHAPTER 12: jQuery AJAX\
    \ Methods and Callback Options\n\n### Introduction\nThis chapter covers AJAX methods\
    \ and callback options in jQuery. AJAX stands for Asynchronous JavaScript and\
    \ XML and is a technique used to update a web page without refreshing it. With\
    \ AJAX, web developers can create highly interactive applications that respond\
    \ quickly to input.\n\nThe chapter starts by introducing the `$.ajax()` method,\
    \ which is the core of jQuery’s AJAX functionality. Use this method to make HTTP\
    \ requests and handle responses from a server. Different options can be passed\
    \ to the `$.ajax()` methods, such as type, url, data, and dataType, and how to\
    \ use them to customize AJAX requests.\n\nShorthand methods are available in jQuery\
    \ for making AJAX requests such as `$.get()`, `$.post()`, `$.getJSON()`, and `$.getScript()`.\
    \ Learn how to use these methods to simplify AJAX requests and make code more\
    \ readable.\n\nThe chapter concludes with a discussion of callback options in\
    \ jQuery, which allow developers to define functions that will execute when AJAX\
    \ requests are complete. Readers will learn about the different callback functions\
    \ available in jQuery such as success, error, and complete, and how to use them\
    \ to handle AJAX responses and errors. By the end of this chapter, readers will\
    \ have a comprehensive understanding of how to use AJAX methods and callback options\
    \ to create highly interactive and responsive applications.\n\n### Structure\n\
    In this chapter, we will cover the following:\n- Explanation of AJAX (Asynchronous\
    \ JavaScript and XML) and its role in updating web pages without refreshing\n\
    - Introduction to the core jQuery method for making HTTP requests and handling\
    \ responses\n- Customizing AJAX requests using options like type, url, data, and\
    \ dataType\n- Overview of shorthand methods in jQuery for making common AJAX requests:\
    \ `$.get()`, `$.post()`, `$.getJSON()`, and `$.getScript()`\n- How to use the\
    \ load method in jQuery to load content from external files into HTML elements\n\
    - Explanation of how to use `$.get()` to retrieve JSON data from a server and\
    \ process it\n- How to use shorthand methods like `$.getScript()` and `$.getJSON()`\
    \ for GET requests to load scripts and JSON data\n- Introduction to callback options\
    \ in jQuery, including success, error, and complete; how to define functions to\
    \ handle AJAX responses\n\n### Introduction to AJAX with jQuery\nThe `load()`\
    \ method in jQuery is a simple and convenient way to perform an AJAX request and\
    \ load data from a server into a specific HTML element on a web page. It simplifies\
    \ the process of fetching content from a server and updating a designated element\
    \ in your HTML. Here’s an explanation of how the `load()` method works:\n\n**Basic\
    \ Syntax:**\n`$(selector).load(url, [data], [complete]);`\n\n1. `selector`: This\
    \ is the HTML element where you want to load the content from the server.\n2.\
    \ `url`: The URL of the server-side resource (for example, an HTML file, a text\
    \ file, or a specific server endpoint) that you want to fetch data from.\n3. `data`\
    \ (optional): an optional parameter that allows you to send data to the server,\
    \ typically used with POST requests.\n4. `complete` (optional): a callback function\
    \ that is executed once the request is complete, which can be used for additional\
    \ processing.\n\n**Exercise: AJAX example connects to an external file and loads\
    \ the contents directly into a page**\nFigure 12.1 shows exercise output with\
    \ three clickable buttons (an example of the expected output from the exercise):\n\
    img/919ec6404bc87421b2aa4aa9dd58b_207_0.png\n\nFigure 12.1: Exercise output with\
    \ 3 clickable buttons\n1. Create several text and html files with content that\
    \ you want to load directly into your page elements.\n2. Using a click event on\
    \ the button and the `load()` method, select the element and in the load parameters\
    \ add a string value of the path to the file.\n3. An optional callback function\
    \ can return the response text, the response status and the entire xHR object,\
    \ which can then be used within the callback function. Check the status. If the\
    \ status returns ‘success’ then load a message into the console.\n\n**HTML**\n\
    ```html\n<div class=\"output\"></div>\n<div class=\"btns\">\n  <button id=\"btn1\"\
    >1</button>\n  <button id=\"btn2\">2</button>\n  <button id=\"btn3\">3</button>\n\
    </div>\n```\n\n**JavaScript**\n```javascript\n$('#btn1').click(() => {\n  $('.output').load('file1.txt',\
    \ (rep,status,xhr) => {\n    if(status == 'success'){\n      console.log(rep,status);\n\
    \      console.log('success!!!!');\n    }\n    console.log(xhr);\n  });\n});\n\
    $('#btn2').click(() => {\n  $('.output').load('file1.html');\n});\n$('#btn3').click(()\
    \ => {\n  $('.output').load('file1.txt');\n});\n```\n\nThe `$.ajax()` method forms\
    \ the bedrock for making HTTP requests and handling server responses. Through\
    \ key parameters like type, url, data, and dataType, developers can customize\
    \ their AJAX interactions, unlocking the potential for a wide range of applications.\
    \ The `$.ajax()` method in jQuery is a powerful and versatile function used to\
    \ make asynchronous HTTP requests to a web server. It allows you to retrieve data\
    \ from a server, send data to a server, or perform other actions without the need\
    \ to reload the entire web page.\n\n- **URL (Uniform Resource Locator)**: You\
    \ specify the URL of the server-side resource you want to interact with. This\
    \ can be a web page, an API endpoint, or any other resource that can handle HTTP\
    \ requests.\n- **HTTP Method (type)**: You can specify the HTTP method, such as\
    \ GET, POST, PUT, DELETE, and so on, to indicate the type of request you want\
    \ to make. GET is used for retrieving data, while POST is typically used for sending\
    \ data to the server.\n- **Data**: You can include data to send to the server,\
    \ typically in the form of an object or a string. This is often used for sending\
    \ form data or other information to the server.\n- **DataType**: You specify the\
    \ expected data type of the response from the server, such as JSON, XML, HTML,\
    \ or text. jQuery will automatically parse the response based on this setting.\n\
    - **Success and Error Handlers**: You can define functions that will be executed\
    \ when the request is successful (using the success parameter) or when there is\
    \ an error (using the error parameter). These functions allow you to handle the\
    \ response from the server appropriately.\n"
  mdcn: "\n探索了通过 `type`、`URL`、`data` 和 `dataType` 等选项对 AJAX 请求进行自定义，以满足特定的应用程序需求。\n\
