- md: "\n```css\nwidth: \"200px\",\nopacity: 0.5\n},\n1000\n);\n```\n\n## CSS positioning\
    \ properties\n\nTo use the `**.animate()**` method in jQuery effectively, you\
    \ often need to understand and manipulate the CSS positioning properties. CSS\
    \ positioning properties determine how an element is positioned within its containing\
    \ element or the document. In jQuery animations, you can animate changes to these\
    \ properties to create various visual effects.\n\nHere are the key CSS positioning\
    \ properties that you might need to use with the `**.animate()**` method, along\
    \ with examples:\n\n### position\n\nThe `**position**` property specifies the\
    \ positioning method used for an element. Common values include relative, absolute,\
    \ fixed, and static.\n\n**Example:**\n\n```css\n.box {\n  position: relative;\n\
    }\n```\n\n### top, right, bottom, left:\n\nThese properties are often used with\
    \ elements whose position is set to relative, absolute, or fixed. They specify\
    \ the offset from the element’s normal position.\n\n**Example:**\n\n```css\n.box\
    \ {\n  position: relative;\n  top: 20px;\n  left: 30px;\n}\n```\n\n### margin\n\
    \nThe `**margin**` property controls the space outside an element’s border. You\
    \ can animate the margin to change an element’s position smoothly.\n\n**Example:**\n\
    \n```css\n.box {\n  margin-left: 10px;\n}\n```\n\n### transform\n\nThe `**transform**`\
    \ property allows you to apply transformations like translation, rotation, and\
    \ scaling to an element. It’s often used with animations to create complex effects.\n\
    \n**Example:**\n\n```css\n.box {\n  transform: translate(50px, 20px);\n}\n```\n\
    \n### z-index\n\nThe `**z-index**` property controls the stacking order of elements\
    \ with the same position value. It’s useful when you want to animate elements\
    \ in and out of view, changing their stacking order.\n\n**Example:**\n\n```css\n\
    .box1 {\n  z-index: 1;\n}\n.box2 {\n  z-index: 2;\n}\n```\n\nHere’s an example\
    \ of how you might use these properties with jQuery’s `**.animate()**` method:\n\
    \n```javascript\n$(document).ready(function() {\n  $(\"#moveButton\").click(function()\
    \ {\n    $(\".box\").animate({\n      left: \"+50px\",\n      top: \"+30px\",\n\
    \      margin: \"10px\",\n      transform: \"rotate(45deg)\",\n      zIndex: 2,\n\
    \    }, \n    1000 // Duration in milliseconds\n    );\n  });\n});\n```\n\nIn\
    \ this example, clicking the `**moveButton**` will animate `**the .box**` elements.\
    \ It changes their left and top positions, margin, transform (rotation), and z-index.\
    \ This showcases how jQuery’s `**.animate()**` method can smoothly transition\
    \ these CSS properties to create dynamic visual effects.\n\n## Creating Custom\
    \ Animations with jQuery Exercise\n\nSelect and move page elements and apply custom\
    \ animation effects to selected elements.\n\n1. Add position relative or absolute\
    \ to the page elements you want to move\n2. Select all the elements, with button\
    \ 1 click apply various animations with styling values\n3. With button 2 click\
    \ add different custom animations to the page elements\n\n### HTML Code\n\n```html\n\
    <div class=\"div1\">Hello World 1</div>\n<div class=\"div2\">Hello World 2</div>\n\
    <div class=\"div3\" id=\"div3\">Hello World 3</div>\n<button id=\"btn1\">1</button>\n\
    <button id=\"btn2\">2</button>\n```\n\n### CSS Code\n\n```css\ndiv {\n  left:\
    \ 100px;\n  position: relative;\n  border: 1px solid #ddd;\n  width: 120px;\n\
    }\n```\n\n### JavaScript code\n\n```javascript\n$('#btn1').click(() => {\n  $('.div1').text(`I’m\
    \ moving`);\n  $('.div1').animate({\n    left: \"+20\",\n    opacity: 0.5\n  },\
    \ 1000, () => {\n    $('.div1').text(`STOPPED`);\n  });\n  $('.div2').animate({\n\
    \    left: \"+50\",\n    fontSize: \"20px\"\n  }, 3000, () => {\n    $('.div2').text(`Laurence\
    \ Svekis`);\n  });\n  $('.div3').animate({\n    top: \"+50\",\n    width: \"150px\"\
    ,\n    height: \"150px\"\n  }, 1000, () => {\n    $('.div2').text(`Laurence Svekis`);\n\
    \  });\n})\n\n$('#btn2').click(() => {\n  $('.div1').text(`I’m moving`).animate({\n\
    \    left: \"-50\",\n    opacity: 1\n  }, 1000, () => {\n    $('.div1').text(`STOPPED`);\n\
    \  });\n  $('.div3').animate({\n    top: \"-50\",\n    width: \"50px\",\n    height:\
    \ \"35px\"\n  }, 1000, () => {\n    $('.div2').text(`DONE`);\n  });\n});\n```\n\
    \n**Button 1 (**#btn1****) Click Event:**\n\nWhen `**btn1**` is clicked, `$('.div1').text('I’m\
    \ moving').animate({ left: \"+20\", opacity: 0.5 }, 1000, () => { $('.div1').text('STOPPED');\
    \ });` changes the text of `div1` to \"I'm moving\", then animates it left by\
    \ 20px and reduces opacity to 0.5 over 1000ms, after which the text becomes \"\
    STOPPED\".\n\n`$('.div2').animate({ left: \"+50\", fontSize: \"20px\" }, 3000,\
    \ () => { $('.div2').text('Laurence Svekis'); });` animates `div2` moving right\
    \ by 50px and increasing font size to 20px over 3000ms, then sets the text to\
    \ \"Laurence Svekis\".\n\n`$('.div3').animate({ top: \"+50\", width: \"150px\"\
    , height: \"150px\" }, 1000, () => { $('.div2').text('Laurence Svekis'); });`\
    \ animates `div3` moving down by 50px, increasing width to 150px and height to\
    \ 150px over 1000ms, then again sets `div2` text to \"Laurence Svekis\".\n\n**Button\
    \ 2 (**#btn2****) Click Event:**\n\nWhen `**btn2**` is clicked, `$('.div1').text('I’m\
    \ moving').animate({ left: \"-50\", opacity: 1 }, 1000, () => { $('.div1').text('STOPPED');\
    \ });` changes `div1` text to \"I'm moving\", animates it moving left by 50px\
    \ and restoring opacity to 1 over 1000ms, finally setting text to \"STOPPED\"\
    .\n\n`$('.div3').animate({ top: \"-50\", width: \"50px\", height: \"35px\" },\
    \ 1000, () => { $('.div2').text('DONE'); });` animates `div3` moving up by 50px,\
    \ shrinking width to 50px and height to 35px over 1000ms, then sets `div2` text\
    \ to \"DONE\".\n"
