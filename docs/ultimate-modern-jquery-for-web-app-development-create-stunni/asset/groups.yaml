    \ ‘toggle’}, 400);`\n\n## 第 4 章 操作元素内容和插入元素\n\n### 引言\n\n在本章中，我们将深入探索利用 jQuery\
    \ 力量操作网页元素内容以及插入新元素的奇妙世界。无论你是经验丰富的 Web 开发者还是初学者，掌握这些技术都将显著提升你创建动态和交互式网页的能力。\n\n\
    ### 结构\n\n在本章中，我们将涵盖以下主题：\n- 使用 jQuery 操作元素内容\n- 使用 jQuery 插入元素\n- 在所选元素外部插入元素\n\
    \n## 使用 jQuery 操作元素内容\n\n### 理解元素内容\n\n在开始内容操作之旅之前，让我们先了解网页元素是如何存储其内容的。在 HTML\
    \ 中，元素可以同时包含文本内容和 HTML 内容。文本内容是元素的可视部分，例如段落或标题中的文本。而 HTML 内容则包含了子元素，构成了网页的层级结构。\n\
    \n### 修改文本内容\n\n在处理网页元素时，最常见的任务之一就是更改它们的文本内容。jQuery 提供了 `.text()` 方法，允许你设置或获取元素的文本内容。你可以使用此方法来：\n\
    \n**更新标题的文本**\n`$(“h1”).text(“New Heading Text”);`\n\n**获取元素的当前文本**\n`let currentText\
    \ = $(“p”).text();`\n\n**修改 HTML 内容**\n\n除了更改文本内容外，你经常需要操作元素的 HTML 内容。jQuery 的\
    \ `.html()` 方法在这一目的上非常用用。该方法允许你：\n\n**替换 div 的 HTML 内容：**\n`$(“div”).html(“<p>New\
    \ HTML content</p>”);`\n\n**向元素追加 HTML 内容：**\n`$(“ul”).append“(<li>New List Item</li>”);`\n\
    \n**通过将 HTML 内容设置为空字符串来移除元素：**\n`$(“#removeMe”).html(\"\");`\n\n**追加和前置内容**\n\n\
    动态内容更新对于创建交互式网页至关重要。jQuery 提供了 `.append()` 和 `.prepend()` 方法，分别向所选元素的末或开头添加内容。你可以：\n\
    \n**向 div 追加一个新段落：**\n`$(“div”).append“(<p>Appended paragraph</p>”);`\n\n**向 section\
    \ 部分前置一个标题：**\n`$(“section”).prepend“(<h2>Prepended heading</h2>”);`\n\n**清空元素内容**\n\
    \n在某些情况下，你需要从元素移除所有内容。jQuery 中的 `.empty()` 方法允许你实现这一点：\n\n**移除列表中的所有内容：**\n`$(“ul”).empty();`\n\
    \n**清空 div 的内容：**\n`$(“#clearMe”).empty();`\n\n理解 jQuery 中这些操作元素内容的方法对于创建动态且响应式的网页至关重要。无论你是更新文本、修改\
    \ HTML 还是管理元素内部的内容，jQuery 的工具都让这些任务变得高效且易用，增强了你的 Web 程序的交互性。\n\n### 练习：向页面添加新内容和元素\n\
    \n在本练习中，我们将探索使用 jQuery 向网页添加新内容和元素的各种方法。我们还将与用户输入进行交互，并执行诸如追加等操作。\n\n**第一步：创建新元素**\n\
    \n在这一步，我们将使用 jQuery 向网页添加新内容和元素。这些生成的元素会显示不同的内容。\n\nlet counter = 0;\nfor (let\
    \ i = 0; i < 10; i++) {\ncounter++;\nconst $span = `<span>Hello ${counter}</span>`;\n\
    $(‘div1’).append($span);\n$span.text('New content'); \n}\n\n**第二步：处理点击事件**\n\n\
    为所选元素添加点击事件。这些按钮会在控制台中打印内容。\n\nfor (let i = 0; i < 3; i++) {\nconst $btn = `<button>After\
    \ ${i + 1}</button>`;\n$(‘div2’).after($btn);\n$btn.click(function() {\n  console.log($(this).text());\n\
    });\n}\n\n**第三步：动态创建元素**\n\n在本练习中，我们将使用计数器创建新元素，并在控制台中打印内容。\n\nlet counter = 0;\n\
    for (let i = 0; i < 5; i++) {\ncounter++;\nconst $div = `<div>Before ${counter}</div>`;\n\
    $(‘div3’).insertBefore($div);\n$div.click(function() {\n  console.log($(this).text());\n\
    });\n}\n\n**第四步：动态创建元素**\n\n在这一步中，我们将使用计数器创建新元素，并向控制台打印。\n\nlet counter = 0;\n\
    for (let i = 0; i < 2; i++) {\ncounter++;\nconst $div = `<div>Hello ${counter}</div>`;\n\
    $(‘div4’).append($div);\n$div.appendTo(‘div3’);\nconsole.log($div);\n}\n\n## 使用\
    \ jQuery 插入元素\n\n在本节中，我们将探索使用 jQuery 向网页中插入元素的强大技术。这些方法允许你精细地控制元素的何时以及何时添加，使你的网页更加动态和交互。\n\
    \n### .after() 和 .before() 的力量\n\njQuery 中的 `.after()` 和 `.before()` 方法是在现有元素之前或之后插入新元素的本质工具。\n\
    \n### 包装元素\n\n掌握使用 jQuery `.wrap()` 和 `.unwrap()` 方法包装元素对于创建结构化布局和样式灵活性至关重要。方法如下\n\
    \n- `.wrap()`：该方法在每个所选元素周围添加包装元素。它对于将元素封装在容器中非常有用，允许你应用 CSS 样式或操作一组元素。\n- `.unwrap()`：相反，`.unwrap()`\
    \ 会移除所选元素的父元素，保留被包裹的内容。当你想要移除不需要的容器时非常方便。\n\n### 在所选元素外部插入元素\n\n有时，你需要在最初选中的元素外部插入元素。jQuery\
    \ 提供了 `.insertBefore()` 和 `.insertAfter()` 方法来实现：\n\n- `.insertBefore()`：使用此方法在所选元素之前插入元素或内容。它对于将内容移动或复制到\
