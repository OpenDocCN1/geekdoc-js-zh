- md: "\nc. `.empty()`\n\nd. `.detach()`\n\n**Answers**\n\na. a) `.empty()`\n\nb.\
    \ b) `.clone()`\n\nc. a) `.unwrap()`\n\n## CHAPTER 6\n## jQuery Dynamic List Project\
    \ - Interactive Elements\n\n### Introduction\n\nIn this chapter, we’ll embark\
    \ on a practical project using jQuery, where we’ll create a dynamic list with\
    \ interactive elements. This project will allow readers to apply their knowledge\
    \ of jQuery to build a real-world, interactive feature that can be used in web\
    \ applications. Let’s dive in!\n\n### Structure\n\nIn this chapter, we will discuss\
    \ the following topics:\n- Creating a Dynamic List with jQuery\n- Interactive\
    \ Elements with jQuery\n\n## Creating a Dynamic List with jQuery\n\nIn this section,\
    \ we will create a dynamic list with jQuery:\n\n1. **Project Overview**: We’ll\
    \ begin by understanding the project’s scope. We aim to create a dynamic list\
    \ that users can interact with, allowing them to add and remove items as needed.\
    \ This list will dynamically update its content and structure based on user actions.\n\
    2. **HTML Structure**: We’ll define the HTML structure for our list, including\
    \ an input field for adding new items, a button to submit new items, and an area\
    \ to display the list of items.\n3. **CSS Styling**: We’ll use CSS to style our\
    \ list and make it visually appealing. This will include styling the list items,\
    \ buttons, and the overall layout.\n4. **jQuery for Interactivity**: We’ll leverage\
    \ jQuery to add interactivity to our list. Readers will learn how to use jQuery\
    \ methods to:\n    a. **Add Items**: We’ll use `.append()` or `.prepend()` to\
    \ add new items to the list when the user submits them.\n    b. **Remove Items**:\
    \ We’ll implement a mechanism to remove items from the list when the user clicks\
    \ a delete button associated with each item. This will involve using event delegation\
    \ to handle dynamic elements.\n\n### Event Delegation\n\nEvent delegation in jQuery\
    \ is a technique used to handle events efficiently, especially when dealing with\
    \ multiple elements that can trigger the same event. It’s particularly useful\
    \ in scenarios where elements are dynamically added to the DOM (that is, not present\
    \ when the page initially loads) or when you want to minimize the number of event\
    \ handlers you attach to elements.\n\nIn traditional event handling, you attach\
    \ an event handler directly to each target element. However, this approach can\
    \ lead to performance issues if there are many elements because each element gets\
    \ its own event handler. Also, if new elements are added dynamically to the DOM,\
    \ they won’t automatically inherit these event handlers.\n\n### Interactive Elements\
    \ with jQuery\n\nHere are the interactive elements with jQuery:\n\n- **Event Listeners**:\
    \ Readers will gain experience in adding event listeners to interactive elements\
    \ within our project, such as the submit button for adding items and the delete\
    \ buttons for removing items. We’ll utilize event delegation to handle these events\
    \ efficiently.\n- **Dynamic Updates**: jQuery will be used to dynamically update\
    \ the list when items are added or removed. This ensures that the user interface\
    \ is always in sync with the underlying data.\n- **User Feedback**: We’ll implement\
    \ feedback mechanisms to inform users of successful item additions and removals.\
    \ This can include visual cues or informative messages.\n- **Validation**: We’ll\
    \ add basic input validation to ensure that users don’t submit empty or invalid\
    \ items. jQuery will be instrumental in performing these checks.\n\n### Learning\
    \ Outcomes\n\nLearners will have created a fully functional dynamic list with\
    \ interactive elements using jQuery. They will have gained practical experience\
    \ in:\n- Creating interactive web features with jQuery.\n- Adding and removing\
    \ elements dynamically.\n- Handling interactions with event listeners.\n- Using\
    \ CSS for styling and layout.\n- Implementing basic input validation.\n\nThis\
    \ project serves as a valuable hands-on experience, allowing readers to apply\
    \ the concepts learned in previous chapters to a real-world scenario. It’s an\
    \ excellent opportunity to reinforce jQuery skills and build confidence in developing\
    \ interactive web applications.\n\n![](img/919ec6404bc87421b2aa4baaa49dd58b_109_0.png)\n\
    ***Figure 6.1: Interactive list using jQuery*\n\n## Exercise: Create an Interactive\
    \ List with jQuery\n\nIn this exercise, we’ll build an interactive list using\
    \ jQuery. Users will be able to add new items to the list, cross out items by\
    \ clicking on them, and remove items by clicking a button associated with each\
    \ item. Here are the steps:\n\n### Step 1: Styling the List Elements\n\nWe start\
    \ by defining the CSS styles for our list elements. This includes styling for\
    \ list items, the text decoration for crossed-out items, and the appearance of\
    \ the delete buttons:\n\n```css\nli span {\n  padding: 5px;\n}\n\n.red span {\n\
    \  color: red;\n  text-decoration: line-through;\n}\n\nli button {\n  font-size:\
    \ 0.5em;\n  background-color: red;\n  color: white;\n}\n```\n\n### Step 2: HTML\
    \ Structure\n\nNext, we create the HTML structure for our interactive list. This\
    \ includes an unordered list (`<ul>`), an input field for adding new items, and\
    \ a button for triggering the addition of items:\n\n```html\n<ul class=\"output\"\
    ></ul>\n<input type=\"text\" value=\"test\" id=\"myIn\">\n<button id=\"btn1\"\
    >Add to List</button>\n```\n\n### Step 3: jQuery Event Handling\n\nWe add a click\
    \ event to the `Add to List` button (`#btn1`) that will trigger the creation of\
    \ a new list item:\n\n```javascript\n$('#btn1').click(adder);\n```\n\nWe also\
    \ initialize a counter to keep track of the number of added items:\n\n```javascript\n\
    let counter = 0;\n```\n\n### Step 4: Adding List Items\n\nIn the adder function,\
    \ we retrieve the value from the input field and create a new list item. `$('<li>')`:\
    \ This is a jQuery function call that creates a new jQuery object. The argument\
    \ `'<li>'` is an HTML string representing a list item element (`<li>`):\n\n```javascript\n\
    const val = $('input').val();\nconst $li = $('<li>');\n```\n\nThen, we create\
    \ a `<span>` element to hold the text:\n\n```javascript\nconst $el = $('<span>').text(val);\n\
    ```\n\n### Step 5: Toggle Class on Click\n\nWe add a click event to the `<span>`\
    \ element. When the user clicks it, the class `red` is toggled on the parent `<li>`,\
    \ crossing the item:\n\n```javascript\n$el.click(function(){\n  $li.toggleClass('red');\n\
    });\n```\n\n### Step 6: Remove Item on Button Click\n\nWe also add a click event\
    \ to the delete button. When clicked, it removes the parent `<li>` element from\
    \ the list:\n\n```javascript\n$btn.click(function(){\n  $li.remove();\n});\n```\n\
    \n### Step 7: Appending Elements\n\nFinally, we append the `<span>` and the delete\
    \ button to the `<li>` element, and then we append the `<li>` element to the `<ul>`\
    \ with the class `output`:\n\n```javascript\n$li.append($el).append($btn);\n$('.output').append($li);\n\
    ```\n\nWe increment the counter and update the input field with a new default:\n\
    \n```javascript\ncounter++;\nconst temp = `Item ${counter}`;\n$('input').val(temp);\n\
    ```\n\n### Step 8: Validation of input\n\n`.trim()` is used to remove any leading\
    \ or trailing whitespace from the input value.\n\nA check is added to see if the\
    \ trimmed value is an empty string (`val === ''`). If it is, the function shows\
    \ an alert and returns early, preventing an empty list item from being added:\n\
    \n```javascript\nconst val = $('input').val().trim(); // Use trim() to remove\
    \ any leading/trailing whitespace\nif (val === '') {\n  alert('Please enter some\
    \ text.'); // Simple alert for empty input\n  return; // Exit the function if\
    \ input is empty\n}\n```\n"
  mdcn: "\n\nc. `.empty()`\n\nd. `.detach()`\n\n**答案**\n\na. a) `.empty()`\n\nb. b)\
    \ `.clone()`\n\nc. a) `.unwrap()`\n\n## 第 6 章\n## jQuery 动态列表项目 - 交互元素\n\n###\
    \ 引言\n\n在本章中，我们将开启一个使用 jQuery 的实践项目，创建一个带有交互元素的动态列表。该项目将允许读者运用他们的 jQuery 知识来构建一个可以在\
    \ Web 应用程序中使用的交互功能。让我们开始吧！\n\n### 章节结构\n\n在本章中，我们将讨论以下主题：\n- 使用 jQuery 创建动态列表\n\
    - 使用 jQuery 实现交互元素\n\n## 使用 jQuery 创建动态列表\n\n在本节中，我们将使用 jQuery 创建一个动态列表：\n\n1.\
    \ **项目概述**：我们将了解项目的范围。目标是创建一个用户可以交互的动态列表，允许他们根据需要添加和删除项目。列表将根据用户的操作动态更新其内容和结构。\n\
    2. **HTML 结构**：我们将为列表定义 HTML 结构，包括用于添加新项目的输入字段、提交新项目的按钮以及一个显示项目列表的区域。\n3. **CSS\
    \ 样式设置**：我们将使用 CSS 为列表设置样式，使其视觉上更美。这包括对列表项、按钮和整体布局进行样式。\n4. **jQuery 交互**：我们将利用\
    \ jQuery 为列表添加交互性。读者将学习如何使用 jQuery 方法来：\n    a. **添加项目**：我们将使用 `.append()` 或 `.prepend()`\
    \ 在用户提交时向列表添加新项目。\n    b. **删除项目**：我们将实现一种机制，当用户点击与每个项目相关的删除按钮时，从列表中删除项目。这将涉及使用事件委托来处理动态元素。\n\
    \n### 事件委托\n\njQuery 中的事件委托是一种用于高效处理事件的技术，特别是在处理多个可能触发相同事件的元素时。当元素被动态地添加到 DOM\
    \ 中（即在页面初始加载时不存在）或者当你想减少附加到元素上的事件处理器数量时，这种技术尤为有用。\n\n在传统的事件处理中，你直接将事件处理器器挂载到每个目标元素上。然而，如果元素很多，这种方法可能会导致性能问题，因为每个元素都有自己的事件处理器。此外，如果新元素被动态添加到\
    \ DOM，它们将不会自动继承这些事件处理器。\n\n### 使用 jQuery 实现交互元素\n\n以下是使用 jQuery 实现的交互元素：\n\n-\
    \ **事件监听器**：读者将获得为项目中的交互元素添加事件监听器的经验，例如用于添加项目的提交按钮和删除项目的删除按钮。我们将利用事件委托来高效地处理这些事件。\n\
    - **动态更新**：将使用 jQuery 在添加或删除项目时动态更新列表。这确保了用户界面与底层数据始终同步。\n- **用户反馈**：我们将实现反馈机制，通知用户项目已成功添加或删除。这可以包括视觉提示或信息性消息。\n\
    - **验证**：我们将添加基本的输入验证，确保用户不会提交空或无效的项目。jQuery 将在执行这些检查中起关键作用。\n\n### 学习成果\n\n学习者将使用\
    \ jQuery 创建一个带有交互元素的完全功能动态列表。他们将在以下方面获得实践经验：\n- 使用 jQuery 创建交互式 Web 功能。\n- 动态添加和删除元素。\n\
    - 使用事件监听器处理交互。\n- 使用 CSS 进行样式设计和布局。\n- 实现基本的输入验证。\n\n这个项目是一个非常有值的实践机会，允许读者将之前章节中学到的概念应用到现实场景中。它是强化\
    \ jQuery 技能并建立开发交互式 Web 应用信心的绝佳机会。\n\n![](img/919ec6404bc87421b2aa4baaa49dd58b_109_0.png)\n\
    ***图 6.1：使用 jQuery 的交互列表*\n\n## 练习：使用 jQuery 创建交互列表\n\n在练习中，我们将使用 jQuery 构建一个交互列表。用户将能够向列表添加新项目、通过点击项目来划掉项目并通过点击每个项目相关的按钮来删除项目。以下是步骤：\n\
    \n### 第 1 步：列表元素的样式\n\n我们首先为列表元素定义 CSS 样式。这包括列表项的样式、划掉项目的文本装饰以及删除按钮的外观：\n\n```css\n\
    li span {\n  padding: 5px;\n}\n\n.red span {\n  color: red;\n  text-decoration:\
    \ line-through;\n}\n\nli button {\n  font-size: 0.5em;\n  background-color: red;\n\
