    **关于作者**


    **Laurence Svekis** 是一位备受尊敬的 Web 开发者、在线教育者和企业家，因其在技术和数字学习领域的动态贡献而闻名。


    在 Web 应用开发领域拥有超过二十年的职业生涯，他已成为在线教育领域的基石，教授编程课程并向全球观众分享他丰富的知识。


    Laurence 在 Web 开发领域的历程以他早期采用并精通各种编程语言为标志，特别是对 JavaScript 具有出众的熟练程度。他的专业知识扩展到 Google
    Workspace 的复杂功能中。


    作为一名在线讲师，Laurence 编写了大量课程，涵盖了 Web 开发广泛主题。这些课程不仅内容详尽，而且设计为适用于编程之旅中不同阶段的学习者，从初学者到高级从业者。他对教育的投入在他全球范围内影响超过百万名学生的成就中显而易见，这证明了他的教学方法的影响力和范围。


    除了在线课程外，Laurence 还以畅销作家的身份留下了足印。他的著作与他的教学哲学相共鸣，为读者提供了实用的见解，并清晰、轻松地引导他们应对 Web 开发和编程的复杂性。


    Laurence 对技术和创新的热情不仅止于教学和写作。他内心也是一个企业家，不断探索 Web 技术的新领域，并开发解决现实世界挑战的解决方案。他对分享知识和赋予他人利用技术力量的热情凸显了他作为数字世界领导者和愿景者的角色。


    总之，Laurence Svekis 作为顶尖 Web 开发者、有影响力的在线教育者、畅销作家和激励人的企业家脱颖而出。他的贡献不仅丰富了 Web 开发领域，还为无数学习者在数字格局中释放潜力铺平了道路。


    **关于技术审核员**


    **Siddharth Shrivastava** 是 HCLTech 的资深前端技术主管，专长构建可访问、包容性的产品以及专为 Web 定制的数字体验。他在技术领域的历程始于
    2014 年，在过去的 9 多年变革性岁月里，他为美国的金融科技、电信和银行客户构建了软件。


    Siddharth 的演变使他从构建网站转变为精通动态前端技术。目前，在 HCL，他负责将原型转换为充满活力的界面，将技术实力与软件生命周期相结合。在搬到美国之前，Siddharth
    在印度的 Cognizant 工作，在那里他从 Angular 迁移到 React。他的工作不仅展示了技术专长，还带来了巨大的价值。


    **致谢**


    我深感谢许多人士，他们的见解和鼓励对于本书的创作是不可或缺的。首先向社区和每一位参与者表示诚挚的感谢。我也欠我的教育同行和学生的情，他们的好奇心和学习渴望驱动了我使每一章都变得通俗易懂。最后，我的孩子理应巨大的感谢，感谢他们在写作和修订的无数小时中给予的无私支持。这本书不仅是我知识的反映，也是我们对
    Web 开发共同努力和热情的证明。


    **前言**


    本书是对 jQuery 的一次简洁而详尽的探索，从基础语法和如何将其嵌入 HTML 文件开始，扩展到用于动态内容的 AJAX 等高级主题。每一章都在前章的基础上系统地构建，涵盖了元素选择、动画、DOM
    操作等，并在实际项目中应用你所学的知识。


    在通过这些章节的过程中，读者将精通选择和操作页面元素、制作 Web 动画以及通过 jQuery 充分利用文档对象模型 (DOM)。实际项目（例如创建一个带有交互元素的动态列表）不仅加强了理论知识，还鼓励在现实场景中应用技能。最后，你将熟练地使用
    jQuery 创建交互式、响应式的 Web 体验。开启这段释放 Web 开发潜旅程。


    **第一章 jQuery 入门:** 向读者介绍 jQuery、语法以及将其添加到 HTML 文件的过程。在本章结束时，你将为使用 jQuery 创建引人入胜的交互式
    Web 应用以及改进开发流程做好准备。让我们进入 jQuery 的世界。


    **第二章 页面元素选择与 DOM**


