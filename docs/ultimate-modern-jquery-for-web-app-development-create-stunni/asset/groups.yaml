    \n每个按钮（****btn1**、****btn2**、****btn3**、****btn4**）都绑定了一个点击事件。当点击按钮时，将获取对应 div\
    \ 的存储数据，并将其设置为该 div 的新文本。此外，获取的值会被打印到控制台。\n\n总结来说，这段代码提供了一个实用练习，用于学习如何从元素中存储和检索数据，并将其应用于创建跟踪用户交互的交互式元素。它展示了如何使用\
    \ `**data()**` 方法保存和检索数据，以及如何利用这些数据动态更新元素的文本内容。\n\n## 页面元素索引索引方法 (Index of Page\
    \ Element Index Method)\n\n### **.index()**\n\n`.index()` 方法是您确定元素相对于其兄弟元素位置的工具箱。要使用\
    \ `.index()` 方法获取元素的位置，jQuery 中的 `.index()` 方法是一个强大的工具，它允许您获取元素在所选元素组中相对于其兄弟元素的位置。该方法对于识别元素在列表、项目组或任何有序集合中的位置特别有用。让我们探索如何使用\
    \ `.index()` 方法获取元素的位置并利用其功能。\n\n#### 使用 **`.index()`**\n\n可以在特定元素上调用 `.index()`\
    \ 方法，以检索其在一组元素中的位置。以下是其使用方法：\n\n```javascript\nconst position = $('#myElement').index();\n\
    ```\n\n在此示例中，position 将包含 `#myElement` 在共享相同父级元素的元素组中的索引。\n\n在代码中使用 `index()`：\n\
    \n```html\n<ol id=\"myList\">\n    <li>Item 1</li>\n    <li>Item 2</li>\n    <li>Item\
    \ 3</li>\n</ol>\n\n$('#myList li').click(function() {\n    const position = $(this).index();\n\
    \    alert(`您点击了项目 ${position + 1}`);\n});\n```\n\n在此示例中，当点击列表项时，代码使用 `.index()`\
    \ 获取其位置并显示指示该项目位置的警告框。\n\n**元素位置**\n\n要找到特定元素的位置，请在该元素上调用 `.index()`。该方法将返回一个从\
    \ 0 开始的索引，表示它在组中的位置。\n\n在处理 jQuery 时，根据与其他元素的相对位置选择元素是一项常见任务。知道如何根据与相邻元素的关系来识别和选择元素是非常用的。\n\
    \njQuery 中的 `.index()` 方法允许您检索元素相对于其兄弟元素的索引位置。当您需要识别元素在相似元素组中的特定位置时，这会非常有用。\n\n\
    `.index()` 方法最基本的的用法是在 jQuery 对象上调用它。例如，如果您有一组兄弟元素，您可以在其中一个元素上调用 `.index()` 来获取它在兄弟元素中的位置。\n\
    \n```javascript\n// 假设您有一组类名为 item 的兄弟元素\nconst position = $('.item').index();\n\
    console.log(`位置: ${position}`);\n```\n\n这将记录所选元素在其兄弟元素中的位置（从 0 开始的索引）。\n\n您还可以结合\
    \ `.index()` 方法与选择器使用，以在匹配选择器的兄弟元素组中查找特定元素的索引。\n\n```javascript\n// 假设您想找到类为 active\
    \ 的特定元素的索引\nconst position = $('.item.active').index('.item');\nconsole.log(`位置:\
    \ ${position}`);\n```\n\n在这种情况下，您正在寻找类为 active 的元素在其类为 item 的兄弟元素中的索引。\n\n一个常见的用例是确定在元素组中点击了哪一个元素。您可以使用\
    \ `.index()` 方法找到特定元素的索引，然后执行操作。\n\n```javascript\n// 假设您有一组类名为 clickable 的兄弟元素\n\
    $('.clickable').click(function() {\n    const position = $(this).index();\n  \
    \  alert(`您点击了项目 ${position + 1}`);\n});\n```\n\n"
