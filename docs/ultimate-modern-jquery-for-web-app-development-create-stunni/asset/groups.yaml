    ## CHAPTER 4 Manipulating Element Content and Inserting Elements


    ### Introduction


    In this chapter, we will dive into the exciting world of manipulating the contents
    of web page elements and inserting new elements using the power of jQuery. Whether
    you’re a seasoned web developer or just getting started, mastering these techniques
    will significantly enhance your ability to create dynamic and interactive web
    pages.


    ### Structure


    In this chapter, we will cover the following topics:

    - Manipulating element content with jQuery

    - Inserting elements with jQuery

    - Inserting elements outside of the selected element


    ## Manipulating element content with jQuery


    ### Understanding element content


    Before we embark on the journey of content manipulation, let’s first understand
    how web page elements store their content. In HTML, elements can contain both
    text and HTML content. Text content is the visible part of an element, such as
    the text within a paragraph or heading. HTML content, on the other hand, includes
    child elements, making up the hierarchical structure of a web page.


    ### Changing text content


    One of the most common tasks when working with web page elements is changing their
    text content. jQuery provides the `.text()` method, which allows you to set or
    retrieve the text content of an element. You can use this method to:


    **Update the text of a heading**

    `$(“h1”).text(“New Heading Text”);`


    **Retrieve the current text of an element**

    `let currentText = $(“p”).text();`


    **Modifying HTML content**


    In addition to changing text content, you often need to manipulate the HTML content
    of elements. jQuery’s `.html()` method comes in handy for this purpose. This method
    enables you to:


    **Replace the HTML content of a div:**

    `$(“div”).html(“<p>New HTML content</p>”);`


    **Append HTML content to an element:**

    `$(“ul”).append(“<li>New List Item</li>”);`


    **Remove elements by setting their HTML content to an empty string:**

    `$(“#removeMe”).html("");`


    **Appending and prepending content**


    Dynamic content updates are essential for creating interactive web pages. jQuery
    offers the `.append()` and `.prepend()` methods to add content to the end or beginning
    of selected elements, respectively. You can:


    **Append a new paragraph to a div:**

    `$(“div”).append(“<p>Appended paragraph</p>”);`


    **Prepend a heading to a section:**

    `$(“section”).prepend(“<h2>Prepended heading</h2>”);`


    **Clearing element content**


    There are situations where you need to remove all content from an element. The
    `.empty()` method in jQuery allows you to do just that:


    **Remove all content from a list:**

    `$(“ul”).empty();`


    **Clear the contents of a div:**

    `$(“#clearMe”).empty();`


    Understanding these methods for manipulating element contents in jQuery is essential
    for creating dynamic and responsive web pages. Whether you’re updating text, modifying
    HTML, or managing content within elements, jQuery’s tools make these tasks efficient
    and accessible, enhancing the interactivity of your web applications.


    ### Exercise: Adding new content and elements to the page


    In this exercise, we will explore various ways to add new content and elements
    to a web page using jQuery. We’ll also interact with user input and perform operations
    like appending, prepending, and removing elements.


    **Step 1: Creating new page elements**


    Create a loop to generate clickable buttons, each displaying a different text
    content. These buttons will later be used to interact with the page.


    `let counter = 0;`

    `for (let i = 0; i < 10; i++) {`

    `counter++;`

    `const $span = \`<<span>Hello :${counter}</span>\`;`

    `$span.text(‘New’);`

    `$(‘.div2’).append($span);`

    `}`


    In this step, we create 10 clickable buttons and append them to the element with
    the class `.div2`.


    **Step 2: Handling button clicks**


    Attach click event handlers to the buttons generated in step 1. When a button
    is clicked, its text content will be logged to the console.


    `for (let i = 0; i < 3; i++) {`

    `const $btn = \`<button>After ${i + 1}</button>\`;`

    `$(‘.div4’).after($btn);`

    `$btn.click(function () {`

    `console.log($(this).text());`

    `});`

    `$(`<button>Before ${i + 1}</button>\`).insertBefore(‘.div4’).click(function ()
    {`

    `console.log($(this).text());`

    `});`

    `}`


    Here, we attach event handlers to buttons, both after and before the element with
    the class .div4. When a button is clicked, it logs its text content to the console.
    This demonstrates the use of `.after()`, `.insertBefore()`, and event handling.


    **Step 3: More element manipulation**


    On click of the first button with the id btn1, get the text value of the input
    element and perform several operations:

    1. Set the text content of .div1 to the input value.

    2. Append the input value to `.div2`.

    3. Prepend the input value to `.div3`.

    4. Remove the element with the class `.div4`.


    `$(‘#btn1’).click(() => {`

    `const val = $(‘input’).val();`

    `$(‘.div1’).text(val);`

    `$(‘.div2’).append(val);`

    `$(‘.div3’).prepend(val);`

    `$(‘.div4’).remove();`

    `});`


    **Step 4: Dynamic element creation**


    On click of the second button with the id btn2, create a new div element with
    an incremental counter and perform the following:

    1. Append the new div element to `.div3`.

    2. Append the new div element to `.div3` again using `.appendTo()`.

    3. Log the created div element to the console.


    `$(‘#btn2’).click(() => {`

    `counter++;`

    `const $div = \`<<div>Hello :${counter}</div>\`;`

    `$(‘.div3’).append(\`<<div>Hello :${counter}</div>\`));`

    `$(`<<div>Hello :${counter}</div>\`).appendTo(‘.div3’);`

    `console.log($div);`

    `});`


    In this step, we create new div elements, append them to `.div3`, and showcase
    the use of .append().


    ## Inserting elements with jQuery


    In this section, we’ll explore powerful techniques for inserting elements into
    a web page using jQuery. These methods provide you with fine-grained control over
    where and how elements are added, making your pages more dynamic and interactive.


    ### The Power of .after() and .before()


    The `.after()` and `.before()` methods in jQuery are essential tools for inserting
    new elements before or after an existing element.


    ### Wrapping elements


    Mastering the art of wrapping elements using jQuery’s `.wrap()` and `.unwrap()`
    methods is crucial for creating structured layouts and styling flexibility. Here’s
    how


    - `.wrap()`: This method adds a wrapping element around each selected element.
    It’s particularly useful for encapsulating elements in containers, allowing you
    to apply CSS styles or manipulate grouped elements as a unit.

    - `.unwrap()`: Conversely, `.unwrap()` removes the parent wrapper element from
    the selected elements, leaving the wrapped content intact. It’s handy when you
    want to remove unnecessary containers.


    ### Inserting elements outside of the selected element


    Sometimes, you may need to insert elements outside of the initially selected element.
    jQuery provides `.insertBefore()` and `.insertAfter()` methods for this purpose:


    - `.insertBefore()`: Use this method to insert an element or content before the
    selected element. It’s valuable for moving or duplicating content to a different
    location in the DOM.

    - `.insertAfter()`: Similar to `.insertBefore()`, `.insertAfter()` inserts content
    or elements after the selected element, allowing you to reposition content dynamically.

