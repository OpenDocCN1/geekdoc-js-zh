    ## Adding and Removing CSS Classes with jQuery:\n\nAdding and Removing CSS Classes:\
    \ We’ll delve into the `.addClass()` and `.removeClass()` methods in jQuery, which\
    \ allow us to add or remove CSS classes from selected elements.\n\nThese classes\
    \ can define various styles, making it easy to change an element’s appearance\
    \ with a single method call.\n\n**Example: Toggle CSS Classes on Button Click**\n\
    \n**CSS:**\n```css\n.red {\n  color: red;\n}\n.blue {\n  color: blue;\n}\n```\n\
    \n**HTML:**\n```html\n<p id=\"myText\">This text can change color.</p>\n<button\
    \ id=\"toggleRed\">Toggle Red</button>\n<button id=\"toggleBlue\">Toggle Blue</button>\n\
    ```\n\n**JS:**\n```javascript\n$('#toggleRed').click(function () {\n  $('#myText').addClass('red');\
    \ // Add the ‘red’ class\n  $('#myText').removeClass('blue'); // Remove the ‘blue’\
    \ class\n});\n$('#toggleBlue').click(function () {\n  $('#myText').addClass('blue');\
    \ // Add the ‘blue’ class\n  $('#myText').removeClass('red'); // Remove the ‘red’\
    \ class\n});\n```\n\n**Explanation:**\nIn this example, we have a paragraph element\
    \ (`<p>`) with the id of `myText`. Initially, it has no CSS classes applied, so\
    \ its text color is the default.\n\nWe also have two buttons, “Toggle Red” and\
    \ “Toggle Blue.” When the “Toggle Red” button is clicked, jQuery’s `.addClass('red')`\
    \ method is used to add the red class to `#myText`, changing its text color to\
    \ red. Then, `.removeClass('blue')` is used to remove the blue class if it’s present,\
    \ ensuring that only the red class is applied.\n\nConversely, when the “Toggle\
    \ Blue” button is clicked, jQuery’s `.addClass('blue')` method is used to add\
    \ the blue class to `#myText`, changing its text color to blue. `.removeClass('red')`\
    \ is used to remove the red class if it’s present, ensuring that only the blue\
    \ class is applied.\n\nThese examples demonstrate how to use the `.addClass()`\
    \ and `.removeClass()` methods to dynamically change the styling of HTML elements\
    \ by toggling CSS classes based on user interactions.\n\n**Using `.toggleClass()`:**\
    \ The `.toggleClass()` method toggles a class on and off for selected elements.\
    \ This is useful for creating interactive elements that change style with user\
    \ interactions.\n\n## Exercise: Get the Style Properties of an Element\n\n**HTML:**\n\
    ```html\n<button id=\"btn1\">Button 1</button>\n<button id=\"btn2\">Button 2</button>\n\
    <div></div>\n<div></div>\n```\n![](img/919ec6404bc87421b2aa4baaa49dd58b_123_0.png)\n\
    ***Figure 7.1: Style properties of an element*** \n\nIn this exercise, we’ll explore\
    \ how to interact with the style properties of HTML elements using jQuery. We’ll\
    \ add events to buttons and elements to update style properties, generate random\
    \ colors, retrieve style properties, and increment the width of elements.\n\n\
    **Step 1: Toggling Classes and Updating Style Properties**\nWe start by adding\
    \ click events to two buttons, `#btn1` and `#btn2`. When clicked, these buttons\
    \ will toggle the ‘red’ and ‘blue’ classes on all div elements, respectively.\
    \ Additionally, they will update the width style property.\n\n```javascript\n\
    $('#btn1').click(() => {\n  $('div').toggleClass('red');\n  $('div').css('width',\
    \ '100px');\n});\n$('#btn2').click(() => {\n  $('div').toggleClass('blue');\n\
    \  $('div').css('width', '+=50');\n});\n```\n\n**Step 2: Generating Random Colors\
    \ and Updating Style Properties**\nWe add a click event to all div elements on\
    \ the page. When clicked, this event generates random colors for the color and\
    \ background-color style properties using JavaScript code.\n\n```javascript\n\
    $('div').click(function () {\n  const rc = '#' + Math.random().toString(16).substring(2,\
    \ 8);\n  const rc2 = '#' + Math.random().toString(16).substring(2, 8);\n  $(this).css('background-color',\
    \ rc);\n  $(this).css('color', rc2);\n  // Retrieve multiple style properties\
    \ and store them in ‘temp’.\n  const temp = $(this).css(['color', 'background-color',\
    \ 'height', 'font-size', 'width']);\n  // Create an HTML string to display the\
    \ style properties.\n  let elText = $(this).text();\n  let html = `<h1>${elText}</h1><ul>`;\n\
    \  for (const prop in temp) {\n    html += `<li>${prop}:${temp[prop]}</li>`;\n\
    \  }\n  html += '</ul>';\n  // Display the style properties in one of the page\
    \ elements.\n  output(html);\n});\n```\n\n**Step 3: Output Function**\nWe create\
    \ an output function to display content within one of the page elements (.div4).\n\
    ```javascript\nfunction output(val) {\n  $('.div4').html(val);\n}\n```\n\n**Step\
    \ 4: Testing**\nThe exercise is complete, and users can interact with buttons\
    \ to toggle classes and update style properties, click div elements to change\
    \ their colors and retrieve properties, and click .div4 to display content. By\
    \ working through this exercise, readers will gain practical experience using\
    \ jQuery to update and retrieve properties of HTML elements. They will also learn\
    \ how to generate random colors, toggle classes, and dynamically adjust element\
    \ dimensions. These skills are valuable for creating dynamic and visually appealing\
    \ web applications.\n\n## Exercise: Getting and Setting Element Attributes with\
