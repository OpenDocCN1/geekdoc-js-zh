    \ jQuery 的 `.addClass('red')` 方法为 `#myText` 添加红色类，将其文本颜色变为红色。然后，使用 `.removeClass('blue')`\
    \ 移除可能存在的蓝色类，以确保只应用红色类。\n\n相反，当点击“切换蓝色”按钮时，使用 jQuery 的 `.addClass('blue')` 方法\
    \ 方法为 `#myText` 添加蓝色类，将其文本颜色变为蓝色。使用 `.removeClass('red')` 移除可能存在的红色类，以确保只应用蓝色类。\n\
    \n这些示例演示了如何使用 `.addClass()` 和 `.removeClass()` 方法根据用户交互切换 CSS 类，从而动态更改 HTML 元素的样式。\n\
