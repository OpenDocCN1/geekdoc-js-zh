    \n**CSS:**\n```css\n<style>\n.box {\n  width: 100px;\n  height: 100px;\n  background-color:\
    \ lightblue;\n  transition: background-color 0s;\n}\n</style>\n```\n**HTML:**\n\
    ```html\n<div class=\"box\"></div>\n<button id=\"changeColor\">Change Color</button>\n\
    ```\n**JS:**\n```javascript\n$('#changeColor').click(function() {\n  $('.box').css('background-color',\
