    7. Add two buttons, one with the text “Up” and the other with the text “Down,”\
    \ to each “box” element.\n8. Add a click event to the “Up” button. Inside the\
    \ event handler, select the previous sibling of the parent element and assign\
    \ it to a variable (**$sel**).\n9. Check if the length of the selected element\
    \ is greater than zero. If it is, add a class of “active” to the current “box”\
    \ element and slide it up slowly. When the slide-up animation is complete, remove\
    \ the “active” class, insert the “box” element before the selected element using\
    \ **`insertBefore()****, and slide it down fast.\n10. Add a click event to the\
    \ “Down” button. Inside the event handler, select the next sibling of the parent\
    \ element and assign it to a variable (**$sel**).\n11. Check if the length of\
    \ the selected element is greater than zero. If it is, add a class of “active”\
    \ to the current “box” element and slide it up slowly. When the slide-up animation\
    \ is complete, remove the “active” class, insert the “box” element after the selected\
    \ element using **`insertAfter()****, and slide it down fast.\n12. Apply some\
    \ animations and styling to the elements.\n\n**CSS:**\n```css\n.btn {\n  background-color:\
    \ black;\n  color: white;\n  font-size: 0.6em;\n}\n.output span {\n  margin: 5px;\n\
    }\n.active {\n  color: red;\n}\n```\n\n**HTML:**\n```html\n<div class=\"output\"\
    ></div>\n```\n\n**JavaScript:**\n```javascript\nconst arr = ['Laurence', 'Larry',\
    \ 'Mike', 'Dave', 'Joe', 'Lisa', 'Jack'];\n\n$.each(arr, function (ind, val) {\n\
    \  $('.output').append(`<div class=\"box\">${val}</div>`);\n});\n\n$('.box').each(function\
    \ () {\n  let $ele = $(this);\n  let temp = $ele.text();\n  $ele.empty();\n  $ele.append(`<span>${temp}</span>`);\n\
    \  $ele.append('<button class=\"up\">Up</button>');\n  $ele.append('<button class=\"\
    down\">Down</button>');\n\n  $('.up').click(function () {\n    let $sel = $(this).parent().prev();\n\
    \    if ($sel.length > 0) {\n      $(this).parent().addClass('active').slideUp('slow',\
    \ function () {\n        $(this).parent().removeClass('active');\n        $(this).parent().insertBefore($sel).slideDown('fast');\n\
    \      });\n    }\n  });\n\n  $('.down').click(function () {\n    let $sel = $(this).parent().next();\n\
    \    if ($sel.length > 0) {\n      $(this).parent().addClass('active').slideUp('slow',\
