    \ the request is completed, regardless of whether it was successful or not (using\
    \ the complete parameter).\n\n`**Other Settings**`: `$.ajax()` provides many other\
    \ settings and options for customizing your request, such as setting headers,\
    \ handling timeouts, and enabling cross-origin requests.\n\nOverall, `$.ajax()`\
    \ is a versatile tool for handling various types of AJAX requests in web development,\
    \ making it possible to interact with remote servers and retrieve or send data\
    \ dynamically without reloading the entire web page.\n\nIn the `$.ajax()` method\
    \ in jQuery, the `$.fail()` method allows you to specify a function that will\
    \ be executed when the AJAX request encounters an error, providing a way to handle\
    \ and respond to failed requests. On the other hand, the `$.always()` method allows\
    \ you to define a function that will be executed regardless of whether the AJAX\
    \ request succeeds or fails, making it useful for performing cleanup or finalization\
    \ tasks after the request is complete.\n\n**Exercise: jQuery AJAX method and callback**\n\
    \n**options**\n\nUse the `$.ajax()` method to connect to endpoints and use the\
    \ response data within the web page elements.\n\n1. Use the `$.ajax()` method,\
    \ within the argument object add a property value for the url of the source file.\
    \ Add a callback function for the successful property value. With the successful\
    \ request, output the data values into the web page element.\n\n2. Use the `$.ajax()`\
    \ method and a GET method type, in the ajax argument object, set the url to the\
    \ endpoint URL, set the type to GET, set the data to an object of the input field\
    \ values and names, set the response data as dataType json.\n\n3. Add chained\
    \ methods to `$.ajax()` of `$.done()` which will fire the callback function once\
    \ the connection has been successful. Use the data values returned from the server\
    \ endpoint and add them to your web page elements.\n\n4. Chain to the `$.ajax()`\
    \ method, the `$.fail()` and `$.always()` methods and output the response data\
    \ into the console.\n\n5. Use the same code as the GET request and update the\
    \ type to POST. This will now send the request as a POST with the data from the\
    \ web page input elements.\n\n**User.json file:**\n\n```json\n{\n  \"firstName\"\
    : \"Laurence\",\n  \"lastName\": \"Svekis\",\n  \"para\": {\n    \"first\": \"\
    Laurence\",\n    \"last\": \"Svekis\"\n  }\n}\n```\n\n```javascript\nconst url\
    \ = 'https://script.google.com/macros/s/AKfycbzuGPGSdXCOOD9jQq4S0sx-OQxlOdL70sC_Z4AmWsRC6jnaxnwg8HGWfMBvalb-aD4U/exec';\n\
    \n$('<input>').attr({\n  type: 'text',\n  value: 'Laurence',\n  name: 'first'\n\
    }).appendTo('.ins').before('First:').after('<br>');\n\n$('<input>').attr({\n \
    \ type: 'text',\n  value: 'Svekis',\n  name: 'last'\n}).appendTo('.ins').before('Last:').after('<br>');\n\
    \n$('#btn1').text('JSON File').click(() => {\n  $.ajax({\n    url : 'user.json',\n\
    \    success: (result) => {\n      console.log(result);\n      const html = `AJAX\
    \ with file JSON data ${result.firstName} ${result.lastName}`;\n      $('<div').html(html).appendTo('.output');\n\
    \    }\n  });\n});\n\n$('#btn2').text('AJAX GET').click(() => {\n  $.ajax({\n\
    \    url: url,\n    type: 'GET',\n    data: {\n      first : $('input').first().val(),\n\
    \      last : $('input').last().val()\n    },\n    dataType: 'json'\n  })\n  .done((data)\
    \ => {\n    console.log(data);\n    const html = `AJAX with Data ${data.para.first}\
    \ ${data.para.last}`;\n    $('<div').html(html).appendTo('.output');\n  })\n \
    \ .fail((err) => {\n    console.log(err);\n  })\n  .always((data) => {\n    console.log(data);\n\
    \  })\n});\n\n$('#btn3').text('AJAX POST').click(() => {\n  $.ajax({\n    url:\
    \ url,\n    type: 'POST',\n    data: {\n      first : $('input').first().val(),\n\
    \      last : $('input').last().val()\n    },\n    dataType: 'json'\n  })\n  .done((data)\
    \ => {\n    console.log(data);\n    const html = `AJAX POST data ${data.para.first}\
    \ ${data.para.last}`;\n    $('<div').html(html).appendTo('.output');\n  })\n \
    \ .fail((err) => {\n    console.log(err);\n  })\n  .always((data) => {\n    console.log(data);\n\
    \  })\n});\n```\n\n**Streamlined AJAX with Shorth Methods**\n\njQuery’s shorthand\
    \ methods include `$.get()`, `$.post()`, `$.getJSON()`, and `$.getScript()`. These\
    \ concise and easy-to-use methods simplify the process of making AJAX requests,\
    \ enhancing code readability and maintainability.\n\n$.get( url [, success [,\
    \ dataType ):\n**Explanation:** The `$.get()` method is used to make an AJAX GET\
    \ request to retrieve data from a server.\n```javascript\n$.get(\"https://jsonplaceholder.typicode.com/posts/1\"\
    , function(data) {\n  console.log(data); // Display the retrieved data\n});\n\
    ```\n\n$.post( url [, success [, dataType ):\n**Explanation:** The `$.post()`\
    \ method is used to make an AJAX POST request to send data to a server.\n```javascript\n\
    $.post(\"https://jsonplaceholder.typicode.com/posts\", {\n  title: \"New Post\"\
    ,\n  body: \"This is the post body\"\n}, function(data) {\n  console.log(data);\
    \ // Display the response from the server\n});\n```\n\n$.getJSON( url [, success\
    \ ):\n**Explanation:** The `$.getJSON()` method is used to make an AJAX GET request\
    \ specifically for JSON data. It automatically parses the JSON response.\n```javascript\n\
    $.getJSON(\"https://jsonplaceholder.typicode.com/posts/1\", function(data) {\n\
    \  console.log(data); // Display the parsed JSON data\n});\n```\n\n$.getScript(\
    \ url [, success )\n**Explanation:** The `$.getScript()` method is used to dynamically\
    \ load and execute a JavaScript script from a server.\n```javascript\n$.getScript(\"\
    https://example.com/script.js\", function() {\n  // The external script has been\
    \ loaded and executed\n  // You can now use functions or variables defined in\
    \ the script\n});\n```\n\nThese shorthand methods simplify the process of making\
    \ common types of AJAX requests in jQuery. They provide a convenient way to perform\
    \ GET and POST requests, retrieve JSON data, and load external scripts, reducing\
    \ the amount of code you need to write for these common operations.\n\n**Callback\
    \ Options for Handling AJAX Responses**\n\nOne of the essential aspects of AJAX\
    \ is managing the response from the server. These powerful tools enable developers\
    \ to define functions that execute when AJAX requests are completed. Readers will\
    \ discover various callback functions, such as success, error, and complete, which\
    \ play a pivotal role in handling AJAX responses and errors.\n\nCallback options\
    \ in jQuery are functions that you can define to be executed when an AJAX request\
    \ completes, providing a way to handle various aspects of the response from the\
    \ server. Callbacks are an essential part of managing AJAX responses and errors\
    \ effectively. Here’s an explanation the commonly used callback options for handling\
    \ AJAX responses.\n\n**success**:\nExplanation: The success callback is executed\
    \ when the AJAX request is successful. It is typically used to handle the data\
    \ received from the server.\n```javascript\n$.ajax({\n  url: \"https://api.example.com/data\"\
    ,\n  success: function(data) {\n    // Handle the data from the server\n    console.log(data);\n\
    \  }\n});\n```\n\n**error**:\nExplanation: The error callback is executed when\
    \ there is an error with the AJAX request, such as a network issue or a server\
    \ error. It is used to handle error conditions.\n```javascript\n$.ajax({\n  url:\
    \ \"https://api.example.com/data\",\n  error: function(xhr, status, error) {\n\
    \    // Handle the error\n    console.log(\"AJAX request failed with status: \"\
    \ + status);\n  }\n});\n```\n\n**complete**:\nExplanation: The complete callback\
    \ is executed regardless of whether the request is successful or results in an\
    \ error. It is often used to perform cleanup tasks or other actions after the\
    \ request.\n```javascript\n$.ajax({\n  url: \"https://api.example.com/data\",\n\
    \  complete: function() {\n    // This code will run after the request is completed\n\
    \    console.log(\"Request completed.\");\n  }\n});\n```\n\nThese callback options\
    \ allow you to handle the various outcomes of an AJAX request effectively. You\
    \ can use them to display data, manage errors, and perform actions after the request,\
    \ ensuring your web application responds gracefully to different scenarios. Callbacks\
    \ are a key feature of jQuery’s AJAX functionality, providing flexibility and\
    \ control over asynchronous interactions with web servers.\n\n**Get JSON data\
    \ with jQuery get method**\n\nEndpoints you can use to make GET method requests\
    \ with practice data: https://www.discoveryvip.com/shared/.\n\n**Exercise**: Make\
    \ and AJAX request to a JSON file and retrieve the values as an object in the\
    \ code:\n\n1. Create a JSON file locally and use the `$.get()` method to get the\
    \ JSON object data.\n\n2. Use the JSON object data by outputting the values into\
    \ the web page once the button is clicked.\n\n3. Make several different connections,\
    \ create elements with jQuery and add the JSON response data values into the\n"
  mdcn: "\n\n`**完成回调函数**`: 你也可以定义一个函数在请求完成时执行，无论该请求是否成功（使用 `complete` 参数）。\n\n`**其他设置**`:\
    \ `$.ajax()` 为你的自定义请求提供了许多其他设置和选项，例如设置请求头、处理超时以及启用跨域请求。\n\n总的来说，`$.ajax()` 是 Web\
    \ 开发中处理各种类型 AJAX 请求的万功能工具，它使得能够与远程服务器交互，并动态地检索或发送数据，而无需重新加载整个网页页面。\n\n在 jQuery\
    \ 的 `$.ajax()` 方法中，`$.fail()` 方法允许你指定一个在 AJAX 请求遇到错误时执行的函数，从而提供了一种处理和响应失败请求的方法。另一方面，`$.always()`\
    \ 方法允许你定义一个无论 AJAX 请求成功还是失败都会执行的函数，这对于在请求完成后执行清理工作或终结性任务非常有用。\n\n**练习：jQuery AJAX\
    \ 方法和回调**\n\n**options**\n\n使用 `$.ajax()` 方法连接到端点，并在网页元素中使用响应数据。\n\n1. 使用 `$.ajax()`\
    \ 方法，在参数对象中为源文件的 `url` 添加一个属性值。为 `success` 属性值添加回调函数。在请求成功时，将数据值输出到网页元素中。\n\n\
    2. 使用 `$.ajax()` 方法和 `GET` 方法类型，在 ajax 参数对象中将 `url` 设置为端点 URL，将 `type` 设置为 `GET`，将\
    \ `data` 设置为输入字段值和名称的对象的，将响应数据的 `dataType` 设置为 `json`。\n\n3. 为 `$.ajax()` 添加链式方法\
    \ `$.done()`，一旦在连接成功后，该方法将触发回调函数。使用从服务器端点返回的数据值，并将其添加到你的网页元素中。\n\n4. 为 `$.ajax()`\
    \ 方法链链 `$.fail()` 和 `$.always()` 方法，并将响应数据输出到控制台。\n\n5. 使用与 GET 请求相同的代码，并将 `type`\
    \ 更新为 `POST`。这现在将带有来自网页输入元素的数据以 POST 方式发送请求。\n\n**User.json 文件：**\n\n```json\n\
    {\n  \"firstName\": \"Laurence\",\n  \"lastName\": \"Svekis\",\n  \"para\": {\n\
    \    \"first\": \"Laurence\",\n    \"last\": \"Svekis\"\n  }\n}\n```\n\n```javascript\n\
    const url = 'https://script.google.com/macros/s/AKfycbzuGPGSdXCOOD9jQq4S0sx-OQxlOdL70sC_Z4AmWsRC6jnaxnwg8HGWfMBvalb-aD4U/exec';\n\
    \n$('<input>').attr({\n  type: 'text',\n  value: 'Laurence',\n  name: 'first'\n\
    }).appendTo('.ins').before('First:').after('<br>');\n\n$('<input>').attr({\n \
    \ type: 'text',\n  value: 'Svekis',\n  name: 'last'\n}).appendTo('.ins').before('Last:').after('<br>');\n\
    \n$('#btn1').text('JSON File').click(() => {\n  $.ajax({\n    url : 'user.json',\n\
    \    success: (result) => {\n      console.log(result);\n      const html = `AJAX\
    \ with file JSON data ${result.firstName} ${result.lastName}`;\n      $('<div').html(html).appendTo('.output');\n\
    \    }\n  });\n});\n\n$('#btn2').text('AJAX GET').click(() => {\n  $.ajax({\n\
    \    url: url,\n    type: 'GET',\n    data: {\n      first : $('input').first().val(),\n\
    \      last : $('input').last().val()\n    },\n    dataType: 'json'\n  })\n  .done((data)\
    \ => {\n    console.log(data);\n    const html = `AJAX with Data ${data.para.first}\
    \ ${data.para.last}`;\n    $('<div').html(html).appendTo('.output');\n  })\n \
    \ .fail((err) => {\n    console.log(err);\n  })\n  .always((data) => {\n    console.log(data);\n\
    \  })\n});\n\n$('#btn3').text('AJAX POST').click(() => {\n  $.ajax({\n    url:\
    \ url,\n    type: 'POST',\n    data: {\n      first : $('input').first().val(),\n\
    \      last : $('input').last().val()\n    },\n    dataType: 'json'\n  })\n  .done((data)\
    \ => {\n    console.log(data);\n    const html = `AJAX POST data ${data.para.first}\
    \ ${data.para.last}`;\n    $('<div').html(html).appendTo('.output');\n  })\n \
    \ .fail((err) => {\n    console.log(err);\n  })\n  .always((data) => {\n    console.log(data);\n\
    \  })\n});\n```\n\n**使用简写方法精简 AJAX**\n\njQuery 的简写方法包括 `$.get()`、`$.post()`、`$.getJSON()`\
    \ 和 `$.getScript()`。这些精简且易于使用的方法简化了发起 AJAX 请求的过程，增强了代码的可读性和维护性。\n\n$.get( url\
    \ [, success [, dataType ):\n**解释：** `$.get()` 方法用于发送 AJAX GET 请求以从服务器检索数据。\n\
    ```javascript\n$.get(\"https://jsonplaceholder.typicode.com/posts/1\", function(data)\
    \ {\n  console.log(data);\n});\n```\n\n$.post( url [, data [, success [, dataType\
    \ ):\n**解释：** `$.post()` 方法用于发送 AJAX POST 请求数据。\n```javascript\n$.post(\"https://jsonplaceholder.typicode.com/posts\"\
    , { title: \"foo\", body: \"bar\", userId: 1 }, function(data) {\n  console.log(data);\n\
    });\n```\n\n$.getJSON( url [, success ):\n**解释：** `$.getJSON()` 方法用于发送 AJAX GET\
    \ 请求并自动解析 JSON 数据。\n```javascript\n$.getJSON(\"https://jsonplaceholder.typicode.com/posts/1\"\
    , function(data) {\n  console.log(data);\n});\n```\n\n$.getScript( url [, success\
    \ ):\n**解释：** `$.getScript()` 方法加载并执行 JavaScript 脚本。\n```javascript\n$.getScript(\"\
    https://example.com/script.js\", function(data) {\n  console.log(data);\n});\n\
    ```\n\n"
