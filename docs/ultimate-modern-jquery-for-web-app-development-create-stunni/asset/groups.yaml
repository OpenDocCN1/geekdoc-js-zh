    \n## Mouse Events\n\nIn jQuery, mouse events allow developers to respond to user\
    \ interactions with a web page through actions like clicking, hovering, moving,\
    \ and dragging the mouse cursor, enabling the creation of an interactive and engaging\
    \ user interface.\n\njQuery mouse events respond to user mouse interactions like\
    \ clicks, hovers, drags, and releases. Easily attach listeners to HTML elements,\
    \ executing custom code in response to various mouse actions.\n\n### .hover()\n\
    **Function**: This method is used to assign functions to be executed when the\
    \ mouse pointer enters and leaves an element.\n**Explanation**: In the code, all\
    \ the **<div>** elements with the class \"**box**\" within the .main container\
    \ have the **.hover()** method applied. When the mouse enters any of these divs,\
    \ it changes their background color to red, and when the mouse leaves, it resets\
    \ the background color to white.\n\n### .mouseup()\nThe **.mouseup()** method\
    \ in jQuery is used to assign a function that will be executed when the mouse\
    \ button is released (clicked and then released) while the pointer is positioned\
    \ over an HTML element. It allows you to perform actions in response to the mouse\
    \ button being released. For example, you can change the appearance or behavior\
    \ of an element after the user releases a mouse button. It’s commonly used for\
    \ interactive features like buttons or elements that respond to clicks. This event\
    \ can be used in conjunction with **.mousedown()** to create click-like functionality\
    \ where you respond to both mouse button presses and releases.\n\n**Function**:\
    \ This method assigns a function to be executed when a mouse button is released\
    \ over an element.\n**Explanation**: In the code, when a mouse button is released\
    \ over any of the **<div>** elements with the class \"**box**,\" it changes their\
    \ text content to \"**MOUSE UP**\" and the background color to blue.\n\n### .mousedown()\n\
    The **.mousedown()** method in jQuery is used to assign a function that will be\
    \ executed when the mouse button is pressed down (clicked) while the pointer is\
    \ positioned over an HTML element. It allows you to perform actions in response\
    \ to the mouse button being pressed. For example, you can change the appearance\
    \ or behavior of an element when the user clicks on it. It’s commonly used for\
    \ creating interactive features, such as button clicks or drag-and-drop functionality.\
    \ This event is often used in conjunction with the **.mouseup()** event to create\
    \ functionality that responds to both mouse button presses and releases.\n\n**Function**:\
    \ This method assigns a function to be executed when a mouse button is pressed\
    \ down over an element.\n**Explanation**: In the code, when a mouse button is\
    \ pressed down over any of the **<div>** elements with the class \"**box**** it\
    \ changes their text content to \"**MOUSE DOWN**\" and the background color to\
    \ green.\n\n### .mouseout()\nThe **.mouseout()** method in jQuery is used to assign\
    \ a function that will be executed when the mouse pointer moves out of an HTML\
    \ element. It is triggered when the mouse exits the boundaries of the selected\
    \ element. This event is useful for scenarios where you want to take action when\
    \ the user moves their mouse away from a particular area or element, such as hiding\
    \ a tooltip when the mouse is no longer over the tooltip-triggering element. It\
    \ is the opposite of the **.mouseover()** event, which triggers when the mouse\
    \ enters an element’s boundaries.\n\n**Function**: This method assigns a function\
    \ to be executed when the mouse pointer leaves the element.\n**Explanation**:\
    \ When the mouse pointer leaves the .main container, the text content of the div\
    \ with the class \"**div2**\" changes to \"**Mouse OUT on MAIN!**\"\n\n### .mouseover()\n\
    The **.mouseover()** method in jQuery is used to assign a function that will be\
    \ executed when the mouse pointer moves over an HTML element. It is triggered\
    \ when the mouse enters the boundaries of the selected element. This event is\
    \ commonly used to create interactive effects when a user hovers their mouse over\
    \ an element, such as showing tooltips or changing the appearance of an element.\
    \ It is the opposite of the **.mouseout()** event, which triggers when the mouse\
    \ leaves an element’s boundaries.\n\n**Function**: This method assigns a function\
    \ to be executed when the mouse pointer leaves the element.\n**Explanation**:\
    \ When the mouse pointer leaves the .main container, the text content of the div\
    \ with the class \"**div2**\" changes to \"**Mouse ENTER on MAIN!**\"\n\n### .mouseleave()\n\
    The **.mouseleave()** method in jQuery is used to assign a function that will\
    \ be executed when the mouse pointer moves out of an HTML element. It is triggered\
    \ when the mouse exits the boundaries of the selected element. This event is useful\
    \ for scenarios where you want to take action when the user moves their mouse\
    \ away from a particular area or element, such as hiding a tooltip when the mouse\
    \ is no longer over the tooltip-triggering element. It is the opposite of the\
    \ **.mouseenter()** event, which triggers when the mouse enters an element’s boundaries.\n\
    \n**Function**: This method assigns a function to be executed when the mouse pointer\
    \ leaves the element.\n**Explanation**: When the mouse pointer leaves the .main\
    \ container, the text content of the div with the class \"**div3**\" changes to\
    \ \"**Mouse LEFT on MAIN!**\"\n\n### .mouseenter()\nThe **.mouseenter()** method\
    \ in jQuery is used to assign a function that will be executed when the mouse\
    \ pointer enters an HTML element. It is triggered when the mouse enters the boundaries\
    \ of the selected element. This event is commonly used to create interactive effects\
    \ when a user hovers their mouse over an element, such as showing tooltips or\
    \ changing the appearance of an element. It is the opposite of the **.mouseover()**\
    \ event, which triggers when the mouse leaves an element’s boundaries.\n\n**Function**:\
    \ This method assigns a function to be executed when the mouse pointer enters\
    \ the element.\n**Explanation**: When the mouse pointer enters the .main container,\
    \ the text content of the div with the class \"**div3**\" changes to \"**Mouse\
    \ OVER on MAIN!**\"\n\n### .mousemove()\nThe **.mousemove()** method in jQuery\
    \ is used to assign a function that will be executed when the mouse pointer moves\
    \ over an HTML element. This event is triggered continuously as the mouse cursor\
    \ is in motion within the element’s boundaries. It is commonly used to track the\
    \ mouse’s position and create interactive features like updating coordinates or\
    \ following the mouse’s movement. The event handler receives information about\
    \ the mouse’s current position, which can be used for various purposes in web\
    \ applications.\n\n**Function**: This method assigns a function to be executed\
    \ when the mouse pointer moves over the document.\n**Explanation**: When the mouse\
    \ pointer moves anywhere over the document, the text content of the div with the\
    \ class \"**div1**\" changes to display the current X and Y coordinates of the\
    \ mouse pointer.\n\n**jQuery mouse moves events listeners and hover events**\n\
    \n**Exercise**: Attach various mouse movement events to page elements.\n\n1. Add\
    \ the **.hover()** event to the divs within the main class. On entering, update\
    \ the background color to red and then on leave set it back to white.\n2. Add\
    \ **.mouseup()** and **.mousedown()** to the divs updating the text and the color\
    \ of the background on the different mouse press states.\n3. Add **.mouseout()**\
    \ and **.mouseleave()** to the main element, and check the difference.\n4. Add\
    \ **.mouseenter()** and **.mouseover()** to the main element, check the difference.\n"
