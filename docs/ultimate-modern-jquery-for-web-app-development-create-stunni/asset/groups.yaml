    \ guidance on jQuery mouse move listeners and hover events. Additionally, the\
    \ chapter covers listening for keyboard events and extracting values from the\
    \ event object, enhancing developers’ proficiency. Emphasizing the significance\
    \ of jQuery form events, the chapter concludes by imparting insights into optimizing\
    \ performance and organizational best practices, equipping readers to create dynamic\
    \ and interactive web applications efficiently.\n\nComing up in the next chapter,\
    \ on event delegation in jQuery introduces readers to the versatile `.on()` method.\
    \ Emphasizing the efficiency of event delegation for dynamically created elements,\
    \ the chapter explores event bubbling and propagation, demonstrating their roles\
    \ in tailoring event behavior. A practical example with `.stopPropagation()` highlights\
    \ effective event control.\n\nAdditionally, the chapter extends its coverage to\
    \ browser and window events, concluding with a hands-on exercise on jQuery scroll\
    \ events, providing readers with a comprehensive toolkit for creating responsive\
    \ and interactive web applications.\n\n## CHAPTER 11\n## Advanced Event Handling\
    \ Techniques\n\n### Introduction\n\nWe’ll focus on the efficient use of the `.on()`\
    \ method for handling events. Engage in exercises to understand event attachment\
    \ intricacies and enhance skills with more powerful interactions. The chapter\
    \ covers key concepts like event bubbling and propagation, clarifying their roles\
    \ in shaping event behavior. A practical example using `.stopPropagation()` helps\
    \ master precise event control. The chapter concludes with hands-on exercises\
    \ on jQuery scroll events, empowering readers to create responsive web applications\
    \ effectively.\n\n### Structure\n\nIn this chapter, we will cover the following\
    \ topics:\n- Introduction to Event Delegation\n- The Versatile `.on()` Method\n\
    - Event Bubbling and Propagation\n- Example of `.stopPropagation()`\n- Exercise\
    \ on jQuery Scroll Events\n\nBeyond the basic event methods, this chapter covers\
    \ more advanced event-handling techniques.\n\n**Event delegation**\n\nEvent delegation\
    \ is a powerful approach for handling events on dynamically created elements.\
    \ It allows you to attach event handlers to a parent element and capture events\
    \ from its children, reducing the need for individual event bindings.\n\n### The\
    \ `.on()` method\n\nThe `.on()` method is a versatile way to attach multiple events\
    \ to elements. It simplifies event binding, making it easier to manage multiple\
    \ interactions on a single element.\n\n```html\n<button id=\"myButton\">Click\
    \ Me</button>\n```\n\nJavaScript (jQuery):\n\n```javascript\n$(document).ready(function()\
    \ {\n  // Attach a click event handler to the button element with the ID \"myButton\"\
    \n  $('#myButton').on('click', function() {\n    alert('Button clicked!');\n \
    \ });\n});\n```\n\nIn this example, when the document is ready (for example, by\
    \ clicking into it), the value of the selected input field is displayed in the\
    \ “output” element. The `.on()` method provides a way to handle various events\
    \ like click, hover, keypress, and more.\n\n**Exercise:**\n\n1. Create an element\
    \ with a class of boxes at the start.\n2. Add multiple events to the element:\
    \ `.click()`, `.mouseenter()`, and `.mouseleave()`.\n3. For all elements within\
    \ the `.btns` class, the `.click()` method should output the index.\n4. Create\
    \ an object with some data, then using `.on()`, pass data to the callback function.\n\
    5. In the `adder` function, output the object.\n6. Create buttons and append them\
    \ to the `.btns` class. Buttons created after the `.click()` event was added will.\n\
    \n**CSS:**\n\n```css\n.box {\n  border: 1px solid #ddd;\n  height: 50px;\n  width:\
    \ 100px;\n}\n.input {\n  display: block;\n}\n.active {\n  background-color: red;\n\
    \  color: green;\n}\n```\n\n**HTML:**\n\n```html\n<div class=\"output\"></div>\n\
    <div class=\"btns\">\n  <button id=\"btn1\">1</button>\n  <button id=\"btn2\"\
    >2</button>\n  <button id=\"btn3\">3</button>\n</div>\n```\n\n**JavaScript:**\n\
    \n```javascript\n$(document).ready(function() {\n  $('<div>').text('Laurence Svekis').addClass('box').prependTo('body');\n\
    \n  $('.box').on({\n    click: function() { $(this).toggleClass('active'); },\n\
    \    mouseenter: function() { $(this).css('background-color', 'blue'); },\n  \
    \  mouseleave: function() { $(this).css('background-color', 'white'); }\n  });\n\
    \n  $('.btns').on('click', 'button', function() {\n    const val = `${$(this).index()}\
    \ index button`;\n    $('.output').text(val);\n  });\n\n  const obj = {\n    first:\
    \ 'Laurence',\n    last: 'Svekis',\n    id: 100\n  };\n\n  $('.output').on('click',\
    \ obj, adder);\n\n  function adder(e) {\n    console.log(e.data);\n  }\n\n  $('.btns\
    \ button').click(function() {\n    const val = `${$(this).index()} index button`;\n\
    \    $(this).css('background-color', 'red');\n    console.log(val);\n  });\n\n\
    \  for (let i = 0; i < 5; i++) {\n    const temp = `${i + 4}`;\n    $('<button>').text(temp).appendTo('.btns');\n\
