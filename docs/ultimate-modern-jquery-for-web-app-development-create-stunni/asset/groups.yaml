    \ Web 体验。在本章中，我们将深入研究使用 jQuery 选择 DOM 元素的艺术。\n\n**基础选择器 (Basic Selectors)**\n\n\
    在网页上选择元素是 jQuery 能力的核心。基础选择器允许你通过 HTML 标签、类和 ID 定位元素。以下是实现方式的简览：\n\n```javascript\n\
    // 按标签选择\n$(\"p\") // 选择所有 <p> 元素\n// 按类选择\n$(\".highlight\") // 选择类为“highlight”的元素\n\
