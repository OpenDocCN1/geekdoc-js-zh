    \ `.filter()` 允许你根据特定条件从较大的集合选择性地定位元素，使你的选择更加精确。\n- **动态过滤：** 你可以根据不断变化的条件或用户交互动态过滤元素。\n\
    - **可读性：** 由于过滤条件在函数内部清晰定义，代码的可读性得到了增强。\n- **效率：** jQuery 优化了过滤过程，确保了元素的高效选择。\n\
    \n总结，`**.filter()**` 方法是一个强大的工具，可以根据特定条件或标准完善你的元素选择，让你对 页面上操作的元素进行精粒度控制。\n\n##\
    \ 根据可见性和状态选择元素\n\n在本节中，我们将探索如何使用 `**:visible**` 和 `**:hidden**` 选择器在 jQuery 中根据元素的可见性来选择元素。这些选择器对于定位当前在网页上显示或隐藏的元素非常有用，允许你对它们应用特定的操作或样式。\n\
    \n### 理解 `**:visible**` 和 `**:hidden**`\n\n考虑这样一个场景：你的网页上有有多个 **`<div>`** 元素，其中一些可见，其他隐藏。你想选择所有可见的\
    \ **`<div>`** 元素并将它们的背景颜色改为绿色。\n\n以下是使用 `:visible` 选择器实现操作的方法：\n\n**示例:**\n\n\
    ```javascript\n// Select all visible ‘div’ elements\n$('div:visible').css('background-color',\
    \ 'green');\n```\n\n在上述示例中：\n\na. **`$('div:visible')`** 选择页面上当前可见的所有 **`<div>`**\
    \ 元素。\n\nb. **`.css('background-color', 'green')`** 将所选可见 **`<div>`** 元素的背景颜色改为绿色。\n\
    \nc. 你可以类似地使用 `**:hidden**` 来选择当前隐藏的元素。\n\n**:visible 和 :hidden 的优势：**\n\n- **可见性控制：**\
    \ 这些选择器对于根据元素的当前可见性状态与元素进行交互是无价的。\n- **动态处理：** 你可以对元素可见性的变化做出动态响应，让网站更具交互性。\n\
