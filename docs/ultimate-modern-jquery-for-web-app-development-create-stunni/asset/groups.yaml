    \ 方法同时绑定多个事件\n-   DOM 中事件冒泡和传播的解释\n-   介绍 `.stopPropagation()` 和 `.preventDefault()`\
    \ 等控制事件行为的事件方法\n-   演示如何使用 jQuery 监听鼠标移动事件并处理悬停事件\n-   监听键盘事件\n-   从 jQuery 的事件对象中提取值\n\
    -   探索如何使用 jQuery 处理与 HTML 表单相关的事件\n\n**理解事件处理**\n\nJavaScript 中的事件模型允许开发者响应 Web\
