    \ 来获取按下按键的键码。\n7. 然后在 \"**output**\" 段落中显示键码。当你在输入字段中输入时，会捕获按下按键的键码，并其值显示在 \"\
    **output**\" 段落中。\n\n## 鼠标事件\n\n在 jQuery 中，鼠标事件允许开发者通过点击、悬停、移动和拖动鼠标指针等操作对用户与网页的交互做出响应，从而创建交互式且吸引人的用户界面。\n\
    \njQuery 鼠标事件响应点击、悬停、拖拽和释放等鼠标交互。可以轻松地为 HTML 元素绑定监听器，根据各种鼠标动作执行自定义代码。\n\n### .hover()\n\
    **功能**：此方法用于在鼠标指针进入和离开元素时分配要执行的函数。\n**解释**：在代码中，.main 容器内所有类名为 \"**box**\" 的 **<div>**元素都应用了\
    \ **.hover()****方法。当鼠标进入这些任何一个 div 时，它们的背景颜色将更改为红色；当鼠标离开时，背景颜色将重置为白色。\n\n### .mouseup()\n\
    jQuery 中的 **.mouseup()****方法用于分配一个函数，该函数会在指针置于 HTML 元素上并释放鼠标按钮（点击后释放）时执行。它允许你执行响应鼠标按钮释放而产生的操作。例如，你可以在用户释放鼠标按钮后更改元素的外观或行为。它通常用于按钮或响应点击的元素等交互式功能。此事件可以与\
    \ **.mousedown()** 结合使用，创建类似点击的功能，即你同时对鼠标按钮的按下和释放做出响应。\n\n**功能**：此方法用于在元素上释放鼠标按钮时分配一个要执行的函数。\n\
    **解释**：在代码中，当鼠标按钮在任何类名为 \"**box**\" 的 **<div>**元素上被释放时，它们的文本内容将更改为 \"**MOUSE UP**\"\
    ，且背景颜色将变为蓝色。\n\n### .mousedown()\njQuery 中的 **.mousedown()****方法用于分配一个函数，该函数会在指针置于\
    \ HTML 元素上并按下鼠标按钮（点击）时执行。它允许你执行响应鼠标按钮按下而产生的操作。例如，当用户点击元素时，你可以更改该元素的外观或行为。它通常用于创建交互式功能，如按钮点击或拖放功能。此事件经常与\
    \ **.mouseup()****事件结合使用，以创建对鼠标按钮按下和释放都做出响应的功能。\n\n**功能**：此方法用于在元素上按下鼠标按钮时分配一个要执行的函数。\n\
    **解释**：在代码中，当鼠标按钮在任何类名为 \"**box**\" 的 **<div>**元素上被按下时，它们的文本内容将将其更改为 \"**MOUSE\
    \ DOWN**\"，且背景颜色将变为绿色。\n\n### .mouseout()\njQuery 中的 **.mouseout()****方法用于在鼠标指针移出\
    \ HTML 元素范围时分配一个要执行的函数。它在鼠标离开所选元素边界时被触发。此事件适用于以下场景：你希望在用户将鼠标离开特定区域或元素时采取行动，例如当鼠标不再悬停在触发提示框的元素上时隐藏提示框。它是\
    \ **.mouseover()****事件的相反事件，后者在鼠标进入元素边界时触发。\n\n**功能**：此方法用于在鼠标指针离开元素时分配一个要执行的函数。\n\
    **解释**：当鼠标指针离开 .main 容器时，类名为 \"**div2**\" 的 div 文本内容更改为 \"**Mouse OUT on MAIN!**\"\
    。\n\n### .mouseover()\njQuery 中的 **.mouseover()****方法用于在鼠标指针移过 HTML 元素时分配一个要执行的函数。它在鼠标进入所选元素边界时被触发。此事件通常用于在用户将鼠标悬停在元素上时创建交互效果，例如显示提示框或更改元素的外观。它是\
    \ **.mouseout()****事件的相反事件，后者在鼠标离开元素边界时触发。\n\n**功能**：此方法用于在鼠标指针离开元素时分配一个要执行的函数。（注：此处英文原文描述可能与方法名逻辑有出入，已按原意翻译）\n\
    **解释**：当鼠标指针离开 .main 容器时，类名为 \"**div2**\" 的 div 文本内容更改为 \"**Mouse ENTER on MAIN!**\"\
    。\n\n### .mouseleave()\njQuery 中的 **.mouseleave()****方法用于在鼠标指针移出 HTML 元素范围时分配一个要执行的函数。它在鼠标离开元素边界时被触发。此事件适用于以下场景：你希望在用户将鼠标离开特定区域或元素时采取行动，例如当鼠标不再悬停在触发提示框的元素上时隐藏提示框。它是\
    \ **.mouseenter()****事件的相反事件，后者在鼠标进入元素边界时触发。\n\n**功能**：此方法用于在鼠标指针离开元素时分配一个要执行的函数。\n\
    **解释**：当鼠标指针离开 .main 容器时，类名为 \"**div3**\" 的元素文本内容更改为 \"**Mouse LEFT on MAIN!**\"\
    。\n\n### .mouseenter()\njQuery 中的mouseenter 方法用于在鼠标指针进入元素时分配一个要执行的函数。它在鼠标进入元素边界时触发。此事件通常用于在用户将鼠标悬停在元素上时创建交互效果，例如显示提示框或更改元素的外观。它是\
    \ **.mouseout()****事件的相反事件，后者在鼠标离开元素边界时触发。\n\n**功能**：此方法用于在鼠标指针进入元素时分配一个要执行的函数。\n\
    **解释**：当鼠标指针进入 .main 容器时，类名为 \"**div3**\" 的元素文本内容更改为 \"**Mouse OVER on MAIN!**\"\
    。\n\n### .mousemove()\njQuery 中的 **.mousemove()****方法用于在鼠标指针在 HTML 元素上移动时分配一个要执行的函数。当鼠标指针在元素边界内移动时，此事件会持续触发。它通常用于跟踪鼠标位置并创建交互功能，如更新坐标或跟随鼠标移动。事件处理器接收鼠标当前位置的信息，这些信息可以用于\
    \ Web 应用程序。\n\n**功能**：此方法用于在鼠标指针在文档上移动时分配一个要执行的函数。\n**解释**：当鼠标指针在文档任何位置移动时，类名为\
    \ \"**div1**\" 的 div 文本内容将更改为显示鼠标指针的 X 和 Y 坐标。\n\n**jQuery 鼠标移动事件监听和悬停事件**\n\n\
    **练习**：为页面元素附加各种鼠标移动事件。\n\n1. 为 main 类 div 添加 **.hover()** 事件。进入时，将背景颜色更改为红色，离开时将其设回白色。\n\
    2. 为 div 添加 **.mouseup()** 和 **.mousedown()**，在不同的鼠标按下状态下更新文本和背景颜色。\n3. 为主元素添加\
    \ **.mouseout()** 和 **.mouseleave()**，并检查差异。\n4. 为主元素添加 **.mouseenter()** 和 **.mouseover()**，检查差异。\n\
    \n"
