    \ 定位属性\n\n为了有效使用 jQuery 中的**.animate()** 方法，通常需要理解并操作 CSS 定位属性。CSS 定位属性决定了元素在其容器元素或文档中的定位方式。在\
    \ jQuery 动画中，你可以对这些属性的变化进行动画处理，从而创建各种视觉效果。\n\n在使用**.animate()** 方法时可能需要的关键 CSS\
    \ 定位属性及其示例：\n\n### position\n\n**position** 属性指定了元素元素使用的定位方法。常见值包括相对（relative）、绝对（absolute）、固定（fixed）和静态（static）。\n\
    \n**示例：**\n\n```css\n.box {\n  position: relative;\n}\n```\n\n### top, right,\
    \ bottom, left:\n\n这些属性通常用于位置设置为 relative、absolute 或 fixed 的元素。它们指定了元素相对于正常位置的偏移量。\n\
    \n**示例：**\n\n```css\n.box {\n  position: relative;\n  top: 20px;\n  left: 30px;\n\
    }\n```\n\n### margin\n\n**margin** 属性控制元素边框之外的空间。你可以通过对 margin 进行动画来平滑地改变元素的位置。\n\
    \n**示例：**\n\n```css\n.box {\n  margin-left: 10px;\n}\n```\n\n### transform\n\n\
    **transform** 属性允许对元素应用平移、旋转和缩放等变换。它通常用于动画以创建复杂的效果。\n\n**示例：**\n\n```css\n.box\
    \ {\n  transform: translate(50px, 20px);\n}\n```\n\n### z-index\n\n**z-index**\
    \ 属性控制具有位置值的元素的堆叠顺序。当你想要让元素进入或离开视野并改变它们的堆叠顺序时，它非常有用。\n\n**示例：**\n\n```css\n.box1\
    \ {\n  z-index: 1;\n}\n.box2 {\n  z-index: 2;\n}\n```\n\n以下是如何结合 jQuery 的**.animate()**方法使用这些属性的示例：\n\
    \n```javascript\n$(document).ready(function() {\n  $(\"#moveButton\").click(function()\
    \ {\n    $(\".box\").animate({\n      left: \"+50px\",\n      top: \"+30px\",\n\
    \      margin: \"10px\",\n      transform: \"rotate(45deg)\",\n      zIndex: 2,\n\
    \    }, \n    1000 // 以毫秒为单位\n    );\n  });\n});\n```\n\n在此示例中，点击**moveButton**将对**..box**\
    \ 元素执行动画。它改变了它们的 left 和 top 位置、margin、transform（旋转）以及 z-index。这展示了 jQuery 的**.animate()**方法如何平滑地过渡这些\
    \ CSS 属性以创建动态视觉效果。\n\n## 使用 jQuery 创建自定义动画练习\n\n选择并移动页面元素，并对选中的元素应用自定义动画效果。\n\n\
    1. 为你想移动的页面元素添加 position: relative 或 absolute\n2. 选择所有元素，点击按钮 1 时应用带有样式值的各种动画\n\
