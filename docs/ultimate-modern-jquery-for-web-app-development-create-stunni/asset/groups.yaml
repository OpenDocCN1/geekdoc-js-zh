    \n### 第 1 步：创建一个输出索引的点击事件\n- a. 在这一步中，你正针对 id 为 `btn1` 的按钮创建一个点击事件。\n- b. 当点击此按钮时，你正在使用\
    \ `$(this).index()` 方法来获取被点击按钮的索引。\n- c. 你将索引值打印到控制台。\n\n### 第 2 步：为 `main` 类中的页面\
    \ div 添加点击事件\n- a. 你正在使用选择器针对 main 类 `(.main div)` 中的所有 `div` 元素。\n- b. 为这些 div\
    \ 中的每一个，你都创建一个点击事件。\n- c. 在点击事件内部，你使用 `$(this).index()` 获取被点击 div 的索引值。\n- d.\
    \ 你还使用 `$(this).text()` 获取了 div 现有的文本内容。\n- e. 然后，你更新 div 的文本内容，使其包含索引和原始文本内容（例如，“1\
    \ Hello World 1”）。\n- f. 这在视觉上于被点击 div 的现有文本旁边显示了索引值。\n\n### 第 3 步：创建一个 UL 并添加带有点击事件的\
    \ LI 项\n- a. 你正在创建一个无序列表 (`<ul>`)，并使用 `$('<ul>').prependTo('nav')` 将其插入到 nav 元素之前。\n\
    - b. 在运行十次数的循环 `(for(let i=0;i<10;i++))` 中，你正在向无序列表添加列表项 (`<li>`)。\n- c. 每个列表项包含类似“0\
    \ List Item”、“1 List Item”等文本。\n- d. 为每个列表项，你都绑定了一个点击事件。\n- e. 在列表项的点击事件中，你使用\
    \ `$(this).index()` 获取被点击列表项的索引。\n- f. 随后你将此索引打印到控制台。\n- g. 这允许你确定并显示被点击列表项的索引。\n\
    \n此练习展示了如何使用 `index()` 方法在各种语下获取元素的索引值。无论是按钮、div 还是列表项，你都在为这些元素添加点击事件以与其交互并显示它们的索引值。\n\
    \n## HTML\n\n```html\n<nav>\n  <div class=\"main\">\n    <div class=\"div1\">Hello\
    \ World 1</div>\n    <div class=\"div2\"><<span>Hello World 2</span></div>\n \
    \   <div class=\"div3\" id=\"div3\">Hello World 3</div>\n    <div class=\"div4\"\
    >Laurence Svekis</div>\n    <input>\n    <button id=\"btn1\">1</button>\n    <button\
    \ id=\"btn2\">2</button>\n    <button id=\"btn3\">3</button>\n    <span class=\"\
    span1\">Hello</span>\n  </div>\n</nav>\n<button id=\"btn4\">4</button>\n<button\
    \ id=\"btn5\">5</button>\n```\n\n## JavaScript\n\n```javascript\n$('#btn1').click(function(){\n\
    \  console.log($(this).index());\n})\n\n$('.main div').click(function(){\n  const\
    \ val = $(this).index();\n  const temp = $(this).text();\n  $(this).text(`${val}\
    \ ${temp}`);\n})\n\nconst $ul = $('<ul>').prependTo('nav');\nfor(let i=0;i<10;i++){\n\
    \  $('<li>').text(`${i} List Item`).appendTo($ul).click(function(){\n    console.log($(this).index());\n\
    \  })\n}\n```\n\n## jQuery 数据方法 `(.data())` \n\n`data()` 方法允许开发者向 HTML 元素附加自定义数据并在以后检索它。它对于存储与元素相关的状态信息或元数据有用。\n\
    \n你可以在元素存储不同类型的数据，例如字符串、数字、对象或数组。\n\n要将数据保存到元素中，你通常选择该元素并使用 `.data('key', 'value')`，其中‘key’是数据的唯一标识符，“value”是你想要存储的数据。\n\
    \n你可以通过使用 `.data('key')` 来检索存储的数据。\n\n## 元素索引 `(.index())`\n\n`index()` 方法允许你在各种语下获取元素的索引值。无论是按钮、div\
    \ 还是列表项，你都在为这些元素添加点击事件以与其交互并显示它们的索引值。\n\n## 总结\n\n此练习展示了如何使用 `index()` 方法在各种语下获取元素的索引值。无论是按钮、div\
    \ 还是列表项，你都在为这些元素添加点击事件以与其交互并显示它们的索引值。\n\n"
