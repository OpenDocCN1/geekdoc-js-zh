- md: "\n}\n\nThe HTML document contains a div element with the class “**output**”\
    \ and another div with the class “**btns**” containing three buttons.\n\n1. A\
    \ div element with the class “**box**” is dynamically created, styled, and added\
    \ to the body.\n2. Event handling is attached to the “**box**” elements using\
    \ the `**.on()**` method. Three events (****click**, ****mouseenter**, and ****mouseleave****)\
    \ are defined. When you click a “**box**,” it toggles the “**active**” class,\
    \ changing the background color and text color. Mouse enter and leave events to\
    \ change the background color.\n3. Event delegation is used to handle button clicks\
    \ within the “**btns**” div. When a button is clicked, its index and a message\
    \ are displayed in the “**output**” div.\n4. A custom data object (`**obj**`)\
    \ is associated with the “**output**” div to be used in click events. When you\
    \ click the “**output**” div, the data is logged to the console.\n5. Additional\
    \ event handling for the dynamically created buttons in the “**btns**” div. When\
    \ you click these buttons, the index and a background color change are displayed.\n\
    6. A loop creates and appends five buttons to the “**btns**” div.\n\nThis code\
    \ demonstrates the use of event handling, event delegation, dynamic event handling,\
    \ and custom data in jQuery.\n\n## Understanding Event Bubbling and Propagation\n\
    \nEvents in the Document Object Model (DOM) can propagate in different ways, affecting\
    \ how they are handled.\n\nUnderstanding event bubbling and propagation is crucial\
    \ for controlling event behavior. How events propagate through the DOM and how\
    \ to use event methods like `**.stopPropagation()**` and `**.preventDefault()**`\
    \ to control and modify this behavior.\n\n### Example of `**.stopPropagation()**`:\n\
    \nThe `**.stopPropagation()**` method is used to prevent the event from propagating\
    \ to parent elements. It stops the event from “**bubbling up**” the DOM tree.\n\
    \n```html\n<div id=\"parent\">\n  <button id=\"child\">Click Me</button>\n</div>\n\
    <script>\n$(document).ready(function() {\n  $(\"#child\").click(function(event)\
    \ {\n    alert(\"Child button clicked!\");\n    event.stopPropagation(); // Prevent\
    \ the event from reaching the parent\n  });\n  $(\"#parent\").click(function()\
    \ {\n    alert(\"Parent div clicked!\");\n  });\n});\n</script>\n```\n\nIn this\
    \ example, when you click the “**Click Me**” button, it triggers an alert, and\
    \ the `**.stopPropagation()**` method prevents the click event from propagating\
    \ to the parent div. So, you will only see the “**Child button clicked!**”” alert.\
    \ If you remove the `**.stopPropagation()**` you will see the second alert after\
    \ the first one is closed.\n\n### Example of `**.preventDefault()**`:\n\nThe `**.preventDefault()**`\
    \ method is used to prevent the default behavior of certain HTML elements, such\
    \ as links and form submissions.\n\n```html\n<a id=\"link\" href=\"https://www.example.com\"\
    >Click Me</a>\n<form id=\"myForm\">\n  <input type=\"text\" name=\"username\"\
    \ placeholder=\"Enter your username\">\n  <button type=\"submit\">Submit</button>\n\
    </form>\n<script>\n$(document).ready(function() {\n  $(\"#link\").click(function(event)\
    \ {\n    event.preventDefault(); // Prevent the link from navigating to another\
    \ page\n    alert(\"Link clicked, but default behavior prevented.\");\n  });\n\
    \  $(\"#myForm\").submit(function(event) {\n    event.preventDefault(); // Prevent\
    \ the form from submitting\n    alert(\"Form submitted, but default behavior prevented.\"\
    );\n  });\n});\n</script>\n```\n\nIn this example, when you click the “**Click\
    \ Me**” link or submit the form, the `**.preventDefault()**` method is used to\
    \ prevent the default behavior (navigating to another page or submitting the form).\
    \ Instead, an alert message is displayed.\n\nThese examples illustrate how to\
    \ use `**.stopPropagation()**` and `**.preventDefault()**` to control event propagation\
    \ and default behaviors in your web applications using jQuery.\n\n## Exercise:\
    \ jQuery scroll event on Browser Events and Window events\n\n*Figure 11.1* shows\
    \ image of links that can be clicked to scroll the page automatically:\n\n![](img/919ec6404bc87421b2aa4baaa49dd58b_199_0.png)\n\
    \n***Figure 11.1:**** Image of links that can be clicked to scroll the page automatically*\n\
    \n**Exercise:** Add elements and connect the anchor tag to the elements with id,\
    \ add an event of the scroll and resize to the Window object.\n\n1. When the button\
    \ is clicked, create a random value to be used for height, and a random color\
    \ to be used for background color of a new element. Create a new `div`, set the\
    \ `**.css()`, add an attribute of id and append it to the body of the page.\n\
    2. Add anchor tag, with a hyperlink to the element with class of output.\n3. Add\
    \ a `**.scroll()**` event to the window and `**.resize()**` to window. Output\
    \ those events to the console.\n\n**CSS Code:**\n```css\n.box {\n  border: 1px\
    \ solid #ddd;\n  height: 50px;\n  width: 100px;\n}\ninput{\n  display: block;\n\
    }\n.active{\n  background-color: red;\n  color: green;\n}\n```\n\n**HTML Code:**\n\
    ```html\n<div class=\"output\"></div>\n<div class=\"btns\">\n  <button id=\"btn1\"\
    >1</button>\n  <button id=\"btn2\">2</button>\n  <button id=\"btn3\">3</button>\n\
    </div>\n```\n\n**JavaScript Code:**\n```javascript\nlet counter = 1;\n$(\".button\"\
    ).click(() => {\n  counter++;\n  const r = Math.floor(Math.random() * 200) + 100;\n\
    \  const c = '#' + Math.random().toString(16).substring(2, 8);\n  const id = 'id'\
    \ + counter;\n  $(\"<div>\").text(\"New Div\").css(\"height\", r + \"px\").attr(\"\
    id\", id).css(\"background-color\", c).appendTo(\"body\");\n  $(\"<a>\").attr(\"\
    href\", \"#\" + id).text(id).appendTo(\".output\");\n});\n$(window).scroll((e)\
    \ => {\n  console.log(e);\n});\n$(window).resize((e) => {\n  console.log($(window).height());\n\
    \  console.log($(document).height());\n});\n```\n\n1. In the HTML the page has\
    \ three buttons inside a div with the class “**btns**,” there’s an empty div with\
    \ the class “**output**.”\n2. In the JavaScript section, a counter variable is\
    \ initialized to 1. It tracks the number of times a button is clicked.\n3. An\
    \ event handler is set up to respond to button clicks. When a button is clicked,\
    \ the following actions occur:\n   a. The counter is incremented.\n   b. A random\
    \ height (between 100 and 300 pixels) and a random background color are generated.\n\
    \   c. An ID for a new `div` element is created using the counter.\n   d. A new\
    \ `div` element is created, with the text ‘**New Div**, a specified height, a\
    \ unique ID, and the generated background color.\n   e. The new `div` element\
    \ is appended to the body of the page.\n   f. A new `<a>` element is created with\
    \ an `**href` attribute pointing to the newly created `div`’s ID. This link is\
    \ added to the “**output**” div, creating a list of links to the generated `div`\
    \ elements.\n4. Additional event handlers are set up using jQuery:\n   a. `$(window).scroll()`:\
    \ When the user scrolls the page, this event handler logs information about the\
    \ scroll event to the console.\n   b. `$(window).resize()`: When the browser window\
    \ is resized, this event handler logs the height of the window and the height\
    \ of the document to the console.\n\nIn summary, the code dynamically generates\
    \ and adds new colored `div` elements to the web page with unique IDs every time\
    \ a button is clicked. It also creates a list of links to these generated `div`\
    \ elements. Additionally, it provides event handlers to log information when the\
