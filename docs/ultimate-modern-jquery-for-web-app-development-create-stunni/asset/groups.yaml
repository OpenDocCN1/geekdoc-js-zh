- md: "\n<div class=\"div4\">Laurence Svekis</div>\n<input>\n<button id=\"btn1\">1</button>\n\
    <button id=\"btn2\">2</button>\n<button id=\"btn3\">3</button>\n<span class=\"\
    span1\">Hello</span>\n</nav>\n<button id=\"btn4\">4</button>\n<button id=\"btn5\"\
    >5</button>\n\n## JavaScript\n\n```javascript\n$('#btn1').click(()=>{\n  const\
    \ temp = $(('.main div').get(1);\n  console.log(temp.innerHTML);\n  console.log(temp.textContent);\n\
    })\n\n$('#btn2').click(()=>{\n  const len = $('.main div').length;\n  console.log(len);\n\
    \  let html = '';\n  for(let i=0;i<len;i++){\n    const temp = $('.main div').get(i);\n\
    \    console.log(temp.textContent);\n    html += `${i}. ${temp.textContent} `;\n\
    \  }\n  $('.main .span1').text(html);\n})\n```\n\n## Exercise: Make a selection\
    \ of page elements with jQuery and return the `index()` value of the selected\
    \ element\n\nThis exercise focuses on using jQuery’s `index()` method to return\
    \ the index value of selected elements in different scenarios. It involves adding\
    \ click events to elements and outputting their index values into the console.\
    \ Here are the detailed steps for this exercise:\n\n### Step 1: Create a Button\
    \ Click Event to Output Index\n- a. In this step, you’re targeting the button\
    \ with the id btn1 to create a click event.\n- b. When this button is clicked,\
    \ you’re using the `$(this).index()` method to retrieve the index of the clicked\
    \ button.\n- c. You’re logging the index value to the console.\n\n### Step 2:\
    \ Add Click Events to Page Divs in the `main` Class\n- a. You’re targeting all\
    \ the div elements within the main class `(.main div)` using a selector.\n- b.\
    \ For each of these divs, you’re creating a click event.\n- c. Within the click\
    \ event, you’re obtaining the index value of the clicked div using `$(this).index()`.\n\
    - d. You’re also capturing the existing text content of the div with `$(this).text()`.\n\
    - e. Then, you’re updating the text content of the div to include both the index\
    \ and the original text content (for example, “1 Hello World 1”).\n- f. This visually\
    \ displays the index value alongside the existing text on the clicked div. \n\n\
    ### Step 3: Create a UL and Add LI Items with Click Events\n- a. You’re creating\
    \ an unordered list (`<ul>`) and prepending it to the nav element using `$('<ul>').prependTo('nav')`.\n\
    - b. Inside a loop that runs ten times `(for(let i=0;i<10;i++))`, you’re adding\
    \ list items (`<li>`) to the unordered list.\n- c. Each list item contains text\
    \ like “0 List Item,” “1 List Item,” and so on.\n- d. For each list item, you’re\
    \ attaching a click event.\n- e. Within the click event for the list items, you’re\
    \ using `$(this).index()` to retrieve the index of the clicked list item.\n- f.\
    \ You’re then logging this index to the console.\n- g. This allows you to determine\
    \ and display the index of the clicked list item.\n\nThis exercise showcases how\
    \ to use the `index()` method to obtain the index values of elements in various\
    \ contexts. Whether it’s a button, a div, or a list item, you’re adding click\
    \ events to interact with these elements and display their index values.\n\n##\
    \ HTML\n\n```html\n<nav>\n  <div class=\"main\">\n    <div class=\"div1\">Hello\
    \ World 1</div>\n    <div class=\"div2\"><<span>Hello World 2</span></div>\n \
    \   <div class=\"div3\" id=\"div3\">Hello World 3</div>\n    <div class=\"div4\"\
    >Laurence Svekis</div>\n    <input>\n    <button id=\"btn1\">1</button>\n    <button\
    \ id=\"btn2\">2</button>\n    <button id=\"btn3\">3</button>\n    <span class=\"\
    span1\">Hello</span>\n  </div>\n</nav>\n<button id=\"btn4\">4</button>\n<button\
    \ id=\"btn5\">5</button>\n```\n\n## JavaScript\n\n```javascript\n$('#btn1').click(function(){\n\
    \  console.log($(this).index());\n})\n\n$('.main div').click(function(){\n  const\
    \ val = $(this).index();\n  const temp = $(this).text();\n  $(this).text(`${val}\
    \ ${temp}`);\n})\n\nconst $ul = $('<ul>').prependTo('nav');\nfor(let i=0;i<10;i++){\n\
    \  $('<li>').text(`${i} List Item`).appendTo($ul).click(function(){\n    console.log($(this).index());\n\
    \  })\n}\n```\n\n## jQuery Data Method `(.data())` \n\nThe `data()` method allows\
    \ developers to attach custom data to an HTML element and retrieve it later on.\
    \ It’s useful for storing state information or metadata associated with an element.\n\
    \nYou can store different types of data, such as strings, numbers, objects, or\
    \ arrays, within an element.\n\nTo save data into an element, you typically select\
    \ the element and use `.data('key', 'value')`, where ‘key’ is a unique identifier\
    \ for the data, and ‘value’ is the data you want to store.\n\nYou can retrieve\
