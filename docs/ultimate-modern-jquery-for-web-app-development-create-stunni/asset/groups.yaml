    \ 以及一个触发添加项的按钮 (`<button>`)。\n\n为元素分配适当的 ID 和类，以便于选择和操作。\n\n**jQuery 事件处理：**\n\
    \n使用 jQuery 为元素添加事件处理器。\n\n例如，要为“添加到列表”按钮 (`#btn1`) 添加点击事件，请使用 `$('#btn1').click(handlerFunction);`。\n\
    \n初始化计数器变量以跟踪已添加的项。\n\n你可以这样声明：`let counter = 0;`。\n\n**添加列表项：**\n\n使用 `$('input').val()`\
