    ## 动态创建和修改元素


    在本节中，我们将深入探讨 jQuery 在网页文档对象模型（DOM）中**动态创建和修改元素**方面的强大功能。

    这些技术允许你增强用户界面、动态添加内容，并创建真正的动态 Web 体验。


    ### 创建新元素


    动态创建 HTML 元素是 jQuery 的核心能力之一。你可以生成全新的元素，指定它们的属性和内容，然后将它们插入到 DOM 中所需的位置。以下是其工作原理：


    - **创建新元素**：你可以通过在 jQuery 函数中指定标签名来创建一个新的 HTML 元素。例如：

    `const newDiv = $(‘<div></div>’);`


    - **设置属性**：要为新元素设置属性，可以链用 `**.attr()**` 方法。例如：

    `const newLink = $(‘<a></a>’).attr(‘href’, ‘https://example.com’);`


    - **添加内容**：你还可以使用 .html() 或 `**.text()**` 方法为新元素添加内容：

    `const newParagraph = $(‘<p></p’).text(‘这是一个新段落。);`


    - **插入 DOM**：要将新创建的元素放入 DOM，可以在现有元素可以使用 `**.append()**`、`**.prepend()**`、`**.before()**`
    或 `**.after()**` 方法。例如：

    `newDiv.appendTo(‘.container’); // 将 newDiv 添加到类名为‘container’的元素中`


    ### 修改元素


    一旦你在 DOM 中拥有了元素，jQuery 就提供了修改它们的方法，例如添加内容或在页面结构中移动元素。关键方法包括：


    - `**.append()**`：此方法将内容或元素添加到所选元素的末尾。它通常用于插入段落、图像或列表等元素。

    `$(.container’).append(‘<p>结尾的新内容。</p>’);`


    - `**.prepend()**`：与 `**.append()**` 类似，`.prepend()**` 将内容或元素添加到所选元素的开头。

    `$(.container’).prepend(‘<p>开头的新内容。</p>’);`


    - `**.before()**` 和 `**.after()**`：这些方法在所选元素之前或之后插入内容或元素。

    `$(.element’).before(‘<div>之前</div>’);`

    `$(.element’).after(‘<div>之后</div>’);`


    ### 移除元素


    jQuery提供了从 DOM 中移除元素及其内容的方法。了解何时以及如何使用这些方法很重要：


    - `**.remove()**`：此方法从 DOM 中移除所选元素及其所有后代元素。

    `$(.element-to-remove’).remove();`


    - `**.empty()**`：.empty() 方法移除所选元素的所有子元素和内容，保留元素本身。

    `$(.element-to-empty’).empty();`


    掌握这些创建、修改和移除元素的技巧使你能够创建动态且交互式的网页，响应用户操作，并根据需要动态更新内容。这些技能是构建响应式且吸引人的 Web 应用程序的核心。


    ## 选择和操作多个元素


    在本节中，我们将深入研究使用 jQuery 选择和操作多个元素。

    这些技术能够对 DOM 中的元素进行精确控制，允许你遍历层级结构、定位特定的子元素并与相关的兄弟元素进行操作。


    ### 父元素


    使用 jQuery 的 `**.parent()**` 方法，你可以轻松选择和操作给定元素的父元素。这对于层级导航和样式设置特别有用。以下是其工作原理：


    - **选择父元素**：`**.parent()**` 方法选择匹配元素的直接父元素。例如：

    `$(.child-element’).parent(); // 选择类为‘child-element’元素的父元素`


    - **设置父元素样式**：你可以应用 CSS 样式或操作父元素来更改它们的外观或行为。这对于创建悬停效果或根据父元素调整布局非常方便。


    ### 子元素


    jQuery 中的 `**.children()**` 方法允许你选择和操作父元素的子元素。这提供了对容器内特定元素的精确控制。以下是其工作原理：


    - **选择子元素**：`**.children()**` 方法选择匹配元素的所有直接子元素。例如：

    `$(.parent-element’).children();`


    - **操作子元素**：你可以对子元素应用更改、内容或执行操作。


    ### 兄弟元素


    `**.siblings()**` 方法是选择具有相同父元素的强大工具。这对于层级导航和样式设置非常有用。以下是其工作原理：


    - **选择兄弟元素**：`**.siblings()**` 方法选择匹配元素的所有兄弟。例如：

    `$(.element’).siblings();`


    - **操作兄弟元素**（此处同上所述）


    ## 高级技术


    在本节中，我们将探索使用 jQuery 的高级操作技术。这些技术允许你执行更复杂的操作，例如克隆元素、替换元素以及通过移除不需要的元素来优化文档。


    ### 克隆元素


    jQuery 中的 `**.clone()**` 方法允许你创建现有元素的副本。克隆对于许多场景都至关重要，包括在动态表单中复制元素、复制内容。

    以下是其工作原理：


    - **克隆元素**：通过在代表要复制元素的 jQuery 对象上调用 `**.clone()**` 方法来克隆元素。例如：

    `const $originalElement = $(.original-element’);`

    `const $cloneElement = $originalElement.clone();`


    - **修改克隆元素**：一旦克隆了元素，你可以根据需要修改其属性、内容或其他属性。克隆提供了自定义起点。


    - **插入克隆元素**：你可以使用 `**.append()**`、`**.prepend()**`、****.insertBefore()**` 或 `**.insertAfter()**`
    方法将克隆元素插入相同位置或其他位置。


    ### 练习：克隆元素并修改其内容


    1. 首先选择类名为 original 的元素。

    2. 使用 `**.clone()**` 方法克隆此元素并将克隆元素存储在变量 `**$cloneElement**` 中。

    3. 使用 `**.text()**` 方法将克隆元素的文本内容修改为“**I am a clone!****”。

    4. 最后，将修改后的克隆元素添加到 ID 为 cloned-elements-container 的元素中。


    **HTML**


    `<div class=”original-element”>Hello, World!</div>`

    `<div id=”cloned-elements-container”></div>`


    **jQuery**


    `$(document).ready(function() {`

    `const $originalElement = $(‘original-element’);`

    `const $cloneElement = $originalElement.clone();`

    `// 修改克隆元素的内容`

    `$cloneElement.text(‘I am a clone!’);`

    `$(.cloned-elements-container’).append($cloneElement);`

    `});`

