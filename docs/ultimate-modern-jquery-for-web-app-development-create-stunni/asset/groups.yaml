    \n## 第 12 章：jQuery AJAX 方法与回调选项\n\n### 引言\n本章介绍了 jQuery 中的 AJAX 方法和回调选项。AJAX 代表异步\
    \ JavaScript 和 XML（Asynchronous JavaScript and XML），是一种用于在不刷新 own的情况下更新 Web 页面的技术。通过\
    \ AJAX，Web 开发者可以创建对输入做出快速响应的高交互性应用程序。\n\n本章从介绍引入了 `$.ajax()` 方法，它是 jQuery AJAX\
    \ 功能的核心。使用此方法发送 HTTP 请求并处理来自服务器的响应。可以向 `$.ajax()` 方法传递不同的选项，例如 `type`、`url`、`data`\
    \ 和 `dataType`，以及如何使用它们来自定义 AJAX 请求。\n\njQuery 提供了许多用于发送 AJAX 请求的简写方法，如 `$.get()`、`$.post()`、`$.getJSON()`\
    \ 和 `$.getScript()`。学习如何使用这些方法来简化 AJAX 请求并使代码更具可读性。\n\n本章以 jQuery 回调选项的讨论结束，这些选项允许开发者定义在\
    \ AJAX 请求完成后执行的函数。读者将学习 jQuery 中可用的不同回调函数，如 `success`、`error` 和 `complete`，以及如何使用它们来处理\
    \ AJAX 响应和错误。在本章结束时，读者将全面理解如何使用 AJAX 方法和回调选项来创建高度交互且响应迅速的应用程序。\n\n### 结构\n在本章中，我们将涵盖以下内容：\n\
    - 对 AJAX（异步 JavaScript 和 XML）的解释及其在不刷新的情况下更新 Web 页面的作用\n- 介绍发送 HTTP 请求和处理响应的核心\
    \ jQuery 方法\n- 使用 `type`、`url`、`data` 和 `dataType` 等选项自定义 AJAX 请求\n- jQuery 中用于常用\
    \ AJAX 请求的简写方法概述：`$.get()`、`$.post()`、`$.getJSON()` 和 `$.getScript()`\n- 如何使用\
    \ jQuery 中的 `load` 方法将外部文件的内容加载到 HTML 元素中\n- 解析如何使用 `$.get()` 从服务器检索 JSON 数据并进行处理\n\
    - 如何使用 `$.getScript()` 和 `$.getJSON()` 等简写方法进行 GET 请求以加载脚本和 JSON 数据\n- 介绍 jQuery\
    \ 中的回调选项，包括 `success`、`error` 和 `complete`；以及如何定义函数处理 AJAX 响应\n\n### 使用 jQuery\
    \ 介绍 AJAX\njQuery 中的 `load()` 方法是执行 AJAX 请求并将从服务器加载数据到 Web 页面特定 HTML 元素的一种简单且方便的方法。它简化了从服务器获取内容并更新\
    \ HTML 中指定元素的过程。以下是 `load()` 方法工作原理的说明：\n\n**基本语法：**\n`$(selector).load(url, [data],\
    \ [complete]);`\n\n1. `selector`: 这是你想要从服务器加载内容的 HTML 元素。\n2. `url`: 服务器端资源的 URL（例如，HTML\
    \ 文件、文本文件或特定的服务器端点），你想要从其获取数据。\n3. `data`（可选）：一个可选参数，允许你向服务器发送数据，通常用于 POST 请求。\n\
    4. `complete`（可选）：一个在请求完成后执行的回调函数（callback function），可用于用于额外处理。\n\n**练习：AJAX 示例连接外部文件并直接将内容加载到页面**\n\
    图 12.1 显示了练习输出，带有三个可点击的按钮（练习预期的输出示例）：\nimg/919ec6404bc87421b2aa4aa9dd58b_207_0.png\n\
    \n图 12.1：带有 3 个可点击按钮的练习输出\n1. 创建几个文本和 html 文件，其中包含你想直接加载到页面元素中的内容。\n2. 使用按钮上的点击事件，通过\
    \ `load()` 方法选择元素并在文件路径。\n3. 一个可选的回调函数可以返回响应文本、响应状态和 xHR 对象，可以在回调函数中使用。如果状态返回‘success’则进入控制台。\n\
    \n**HTML**\n```html\n<div class=\"output\"></div>\n<div class=\"btns\">\n  <button\
    \ id=\"btn1\">1</button>\n  <button id=\"btn2\">2</button>\n  <button id=\"btn3\"\
    >3</button>\n</div>\n```\n\n**JavaScript**\n```javascript\n$('#btn1').click(()\
    \ => {\n  $('.output').load('file1.txt', (rep,status,xhr) => {\n    if(status\
    \ == 'success'){\n      console.log(rep,status);\n      console.log('success');\n\
    \    }\n    console.log(xhr);\n  });\n});\n$('#btn2').click(() => {\n  $('.output').load('file1.html');\n\
    });\n$('#btn3').click(() => {\n  $('.output').load('file1.txt');\n});\n```\n\n\
    `$.ajax()` 方法是发送 HTTP 请求和处理服务器响应的基础。通过 `type`、`url`、`data` 和 `dataType` 等关键参数，开发者可以自定义他们的\
    \ 交互，释放各种应用程序的潜力。jQuery 中的 `$.ajax()` 方法是一个强大且多功能的函数，用于向 Web 服务器发送异步 HTTP 请求。它允许从服务器检索数据、向服务器发送数据或执行其他操作，而无需重新加载整个\
    \ 页面。\n\n- **URL (资源定位符)**：你指定要交互的服务器端资源的 URL。它可以是网页、API 端点或任何可以处理 HTTP 请求的资源。\n\
    - **HTTP 方法 (type)**：你可以指定 HTTP 方法，例如 GET、POST、PUT、DELETE 等，以指示你想进行的请求类型。GET 用于检索数据，而\
    \ POST 通常用于向服务器发送数据。\n- **data**：你可以包含发送到服务器的数据，通常以对象或字符串的形式。这通常用于向服务器发送表单数据或其他信息。\n\
    - **dataType**：你指定预期的数据类型，例如 JSON、XML、HTML 或文本。jQuery 会根据此设置自动解析响应。\n- **成功和错误处理器**：你可以定义在请求成功时（使用\
    \ `success` 参数）或发生错误时（使用 `error` 参数）执行的函数。这些函数允许你妥善地处理来自服务器的响应。\n"
