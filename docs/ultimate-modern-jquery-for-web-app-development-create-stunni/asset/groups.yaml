- md: "\nAdditionally, we highlighted the efficiency of chaining methods for concise\
    \ and readable code. Finally, we underscored the importance of best practices\
    \ in jQuery for optimized performance and maintainable code. This knowledge equips\
    \ developers with the tools necessary for creating interactive, efficient, and\
    \ user-friendly web applications.\n\nIn the next chapter, we will uncover a variety\
    \ of tools to breathe life into your web pages. We will explore the `Hide` and\
    \ `Show` methods, which allow you to toggle the visibility of elements, providing\
    \ seamless transitions and interactive features. We will also delve into `Fade\
    \ In` and `Fade Out` methods, enabling graceful opacity transitions. Additionally,\
    \ we will cover `Slide Up` and `Slide Down` methods to add dynamic vertical motion\
    \ to your web elements. Lastly, we will dive into the realm of custom animations,\
    \ empowering you to create unique, eye-catching transitions tailored to your specific\
    \ design needs.\n\n# CHAPTER 3\n## Element Hide and Show Methods and Animation\
    \ Effects\n\n### Introduction\nIn the realm of web development, the ability to\
    \ control the visibility and add animation effects to page elements can transform\
    \ a static website into an interactive and engaging experience. jQuery offers\
    \ a robust set of methods to achieve this, opening up a world of possibilities\
    \ for creating dynamic web content. In this chapter, we will explore these methods,\
    \ from simple hide and show techniques to more advanced fading and sliding effects,\
    \ equipping you with the skills to breathe life into your web pages.\n\n### Structure\n\
    In this chapter, we will discuss the following topics:\n- `Hide` and `show` methods\n\
    - `Fade in` and `fade out` methods\n- `slideUp` and `slideDown` methods\n- Custom\
    \ animations with jQuery\n\n## Hide and Show Methods\njQuery provides the `.hide()`\
    \ and `.show()` methods, which are used to control the visibility of HTML elements\
    \ on a web page. These methods are commonly employed in web development to create\
    \ interactive and dynamic user interfaces.\n\n### .hide(): Concealing Elements\n\
    The `.hide()` method does precisely what its name suggests – it conceals elements\
    \ from view by setting their CSS display property to none. Here is how you can\
    \ use it:\n\n`$(\"#elementToHide\").hide();`\n\nThe `.hide()` method is used to\
    \ hide one or more selected elements by modifying their CSS properties, particularly\
    \ the display property. When you hide an element using `.hide()**`, it becomes\
    \ invisible and no longer takes up space in the layout. Here is how it works:\n\
    \n`$(selector).hide(speed, callback);`\n\n- **selector**: This is a jQuery selector\
    \ that specifies the element(s) you want to hide. It can be an element type, class,\
    \ ID, or any other valid selector.\n- **speed** (optional): This parameter specifies\
    \ the speed of the hiding animation. It can be one of the following values:\n\
    \    - `slow`: Slow animation (600 milliseconds)\n    - `fast`: Fast animation\
    \ (200 milliseconds)\n    - A numeric value: The duration of the animation in\
    \ milliseconds\n- **callback** (optional): This is a function that gets executed\
    \ after the `.hide()` operation is complete.\n\n**Example:**\n```javascript\n\
    // Hide a specific element with ID \"myElement\" slowly\n$(\"#myElement\").hide(\"\
    slow\");\n\n// Hide all <div> elements with class \"hidden\" quickly\n$(\"div.hidden\"\
    ).hide(\"fast\");\n```\n\n### .show(): Revealing Hidden Elements\nConversely,\
    \ `.show()` method reveals hidden elements by changing their display property\
    \ back to its default, which is usually block or inline. Its usage is straightforward:\n\
    \n`$(\"#elementToShow\").show();`\n\nThe `.show()` method is used to display one\
    \ or more selected elements that have previously hidden using `.hide()` or were\
    \ initially hidden by default. It reverses the effect of the `.hide()` method,\
    \ making the elements again. Here is how it works:\n\n`$(selector).show(speed,\
    \ callback);`\n\n- **selector**: This is a jQuery selector that specifies the\
    \ element(s) you want to display.\n- **speed** (optional): This parameter specifies\
    \ the speed of the showing animation, just like `.hide()`.\n- **callback** (optional):\
    \ This is a function that gets executed after the `.show()` operation is complete.\n\
    \n**Example:**\n```javascript\n// Show a specific element with ID \"myElement\"\
    \ slowly\n$(\"#myElement\").show(\"slow\");\n\n// Show all <div> elements with\
    \ class \"visible\" quickly\n$(\"div.visible\").show(\"fast\");\n```\n\n**Toggle\
    \ Visibility**: `.hide()` and `.show()` are often used together to toggle the\
    \ visibility of elements. For example, you can hide when a button is clicked and\
    \ then show again when a button is clicked.\n\n**Creating Animations**: These\
    \ methods can be used to create simple animations, such as fading elements in\
    \ and out or sliding them up and down.\n\n**Building Accordion Menus**: In combination\
    \ with event handlers, these methods are used to create menus where clicking one\
    \ section hides others and reveals the clicked section.\n\n**Showing and Hiding\
    \ Tooltips and Popovers**: Tooltips and popovers in web applications are often\
    \ implemented using these methods to control their display. In summary, the `.hide()`\
    \ and `.show()` methods in jQuery are fundamental for controlling the visibility\
    \ of elements on a web page. They are versatile tools that can be used in various\
    \ scenarios to create interactive and dynamic user interfaces.\n\n### Exercise:\
    \ Element hide and Show Methods and Animation effects\nClick elements, hide the\
    \ clicked elements. Add a button that will show the elements:\n1. Select all the\
    \ `<div>` from the page\n2. Select the first one using `.first()` and the last\
    \ one using `.last()`\n3. Add a click event to the `<div>`. When clicked, it should\
    \ select the element from the click event that was clicked (be careful, as this\
    \ will select the nested elements). Update the html to say \"clicked\". Update\
    \ the element with text \"Ready\". Then apply the `.hide()` function to the element.\n\
    4. Add an event to the button which shows all the `<div>`, and the H1.\n\n**Example\
    \ of hide and show used in code:**\n**HTML for this section:**\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>jQuery Course</title>\n</head>\n<body>\n \
    \   <div>Hello World 1</div>\n    <div class=\"div2\">Hello World 2</div>\n  \
    \  <div id=\"div3\">Hello World 3</div>\n    <button>Show</button>\n    <script\
    \ src=\"jquery.min.js\"></script>\n    <script src=\"app3.js\"></script>\n</body>\n\
    </html>\n```\n\n**JavaScript JS code:**\n```javascript\nconsole.log$(\"div\").first());\n\
    const val = \"<h1>Laurence Svekis</h1>\";\n$(\"div\").first().html(val);\n$(\"\
    div\").last().text(val);\n\n$(\"div\").click((e) => {\n    const $el = $(e.target);\n\
    \    console.log($el);\n    $el.html('clicked');\n    $(e.target).text('Ready');\n\
    \    $(e.target).hide(\"slow\");\n});\n\n$(\"button\").click((e) => {\n    $(\"\
    div\").show(\"fast\");\n    $(\"h1\").show(4000);\n});\n\nfunction eleClicker(e){\n\
    \    console.log(e);\n}\n```\n\n![](img/919ec6404bc87421b2aa4baaa49dd58b_62_0.png)\n\
    *Figure 3.1: Example output from Exercise*\n\nHere is a breakdown of the JavaScript\
    \ code:\n- `console.log$(\"div\").first());`: This line selects the first `<div>`\
    \ element on the page using jQuery and logs it to the console.\n- `const val =\
    \ \"<h1>Laurence Svekis</h1>\";`: This line creates an HTML string containing\
    \ an `<h1>` element with the text Laurence Svekis.\n- `$(\"div\").first().html(val);`:\
    \ This line selects the first `<div>` element and sets its HTML content to the\
    \ value stored in the `val` variable (that is, it replaces the content of the\
    \ first `<div>` with the `<h1>` element).\n- `$(\"div\").last().text(val);`: This\
    \ line selects the last `<div>` element and sets its text content to the value\
    \ stored in the `val` variable (that is, it changes the text of the last `<div>`\
    \ to Laurence Svekis).\n- `$(\"div\").click((e) => { ... });`: This code attaches\
    \ a click event handler to all `<div>` elements. When a `<div>` is clicked, the\
    \ handler function is executed. It changes the HTML content of the clicked `<div>`\
    \ to clicked, changes the text content to Ready, and then hides the `<div>` element\
    \ with a slow animation.\n"
  mdcn: "\n此外，我们强调了链式调用方法对于编写简洁且易读代码的效率。最后，我们强调了 jQuery 中最佳实践对于优化性能和保持代码可维护性的重要。这些知识为开发者创建交互式、高效且用户友好的\
    \ Web 应用程序提供了必要的工具。\n\n在下一章中，我们将发现各种工具来为你的网页注入灵魂。我们将探索 `Hide` 和 `Show` 方法，它们允许你切换元素的可见性，提供无缝的过渡效果和交互功能。我们还将深入研究\
    \ `Fade In` 和 `Fade Out` 方法，实现优雅的透明度过渡。此外，我们涵盖了 `Slide Up` 和 `Slide Down` 方法，为你的网页元素添加动态的垂直运动。最后，我们将进入自定义动画的领域，使你能够根据特定的设计需求创建独特且引人注目的过渡效果。\n\
    \n# 第3 章\n## 元素隐藏、显示方法与动画效果\n\n### 引言\n在 Web 开发领域，控制页面元素的可见性并添加动画效果的能力可以将静态网站转变为交互式且引人入胜的体验。jQuery\
    \ 提供了一套强大的方法来实现这一目标，为创建动态 Web 内容开启了无限可能。在本章中，我们将探索这些方法，从简单的隐藏和显示技术到更高级的渐变和滑动效果，让你具备为网页注入灵魂的技能。\n\
    \n### 结构\n在本章中，我们将讨论以下主题：\n- `Hide` 和 `show` 方法\n- `Fade in` 和 `fade out` 方法\n\
    - `slideUp` 和 `slideDown` 方法\n- 使用 jQuery 自定义动画\n\n## 与显示方法\njQuery 提供了 `.hide()`\
    \ 和 `.show()` 方法，用于控制网页上 HTML 元素的可见性。这些方法在 Web 开发中被广泛用于创建交互式和动态的用户界面。\n\n### .hide():\
    \ 隐藏元素\n`.hide()` 方法正如其名所示——通过将元素的 CSS `display` 属性设置为 `none` 来隐藏元素元素。以下是它的使用方法：\n\
    \n`$(\"#elementToHide\").hide();`\n\n`.hide()` 方法通过修改元素的 CSS 属性（特别是 `display`\
    \ 属性）来隐藏一个或多个选定的元素。当你使用 `.hide()` 隐藏一个元素时，它将变得不可见，并且不再占据布局中的空间。其工作原理如下：\n\n`$(selector).hide(speed,\
    \ callback);`\n\n- **selector**: 这是一个 jQuery 选择器，用于指定你想隐藏的元素。它可以是元素类型、类、ID 或任何有效的选择器。\n\
    - **speed**（可选）：此参数指定隐藏动画的速度。它可以是以下值之一：\n    - `slow`: 慢速动画（600 毫秒）\n    - `fast`:\
    \ 快速动画（200 毫秒）\n    - 数值：以毫秒为单位的动画持续时间\n- **callback**（可选）：这是一个在 `.hide()` 操作完成后执行的函数。\n\
    \n**示例：**\n```javascript\n// 缓慢隐藏 ID 为 \"myElement\" 的特定元素\n$(\"#myElement\").hide(\"\
    slow\");\n\n// 快速隐藏所有类名为 \"hidden\" 的 <div> 元素\n$(\"div.hidden\").hide(\"fast\"\
    );\n```\n\n### .show(): 显示隐藏的元素\n相反，`.show()` 方法通过将元素的 `display` 属性恢复为默认值（通常是\
    \ `block` 或 `inline`）来显示隐藏的元素。用法非常直观：\n\n`$(\"#elementToShow\").show();`\n\n`.show()`\
    \ 方法用于显示之前使用 `.hide()` 隐藏或初始隐藏的一个或多个选定元素。它反转了 `.hide()` 方法的效果，使元素再次出现。其工作原理如下：\n\
    \n`$(selector).show(speed, callback);`\n\n- **selector**: 这是一个 jQuery 选择器，用于指定你想显示的元素。\n\
    - **speed**（可选）：此参数指定显示动画的速度，与 `.hide()` 相同。\n- **callback**（可选）：这是一个在 `.show()`\
    \ 操作完成后执行的函数。\n\n**示例：**\n```javascript\n// 缓慢显示 ID 为 \"myElement\" 的特定元素\n$(\"\
    #myElement\").show(\"slow\");\n\n// 快速显示所有类名为 \"visible\" 的 <div> 元素\n$(\"div.visible\"\
    ).show(\"fast\");\n```\n\n**切换可见性**：`.hide()` 和 `.show()` 经常结合使用来切换元素的可见性。例如，你可以在点击按钮时隐藏元素，然后在再次点击按钮时显示它。\n\
    \n**创建动画**：这些方法可以创建简单的动画，例如元素的淡入和淡出，或让它们向上向下滑动。\n\n**构建手风琴菜单**：配合事件处理程序，这些方法可用于创建菜单，点击其中一个部分会隐藏其他部分并显示被点击的部分。\n\
    \n**显示和隐藏工具提示和弹出框**：Web 中的工具提示和弹出框通常使用这些方法来控制它们的显示。总而言之，jQuery 中的 `.hide()` 和\
    \ `.show()` 方法是控制网页上元素可见性的基础。它们是多功能工具，可以用于各种场景以创建交互式和动态的用户界面。\n\n### 练习：元素隐藏、显示方法与动画效果\n\
    点击元素，隐藏被点击的元素。添加一个按钮来显示这些元素：\n1. 选择页面上所有的 `<div>`\n2. 使用 `.first()` 选择第一个，使用 `.last()`\
    \ 选择最后一个\n3. 给 `<div>` 添加点击事件。当被点击时，它应该选择来自点击事件的被点击的元素（注意，这将选取嵌套的元素）。更新 HTML 使其显示为\
    \ \"clicked\"。更新文本为 \"Ready\" 的元素。然后对该元素应用 `.hide()` 函数。\n4. 添加一个事件来显示这些元素。\n\n\
    选择所有 `<div>` \n使用 `.first()` 选择第一个，使用 `.last()` 选择最后一个\n给 `<div>` 添加点击事件。当被点击时，它应该选择来自点击事件的被点击的元素（注意，这将选取嵌套的元素）。更新\
    \ HTML 使其显示为 \"clicked\"。更新文本为 \"Ready\" 的元素。然后对该元素应用 `.hide()` 函数。\n添加一个事件来显示这些元素。\n\
    \n选择所有 `<div>`\n**代码中隐藏和显示的示例：**\n**此部分的 HTML：**\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title>jQuery Course</title>\n</head>\n<body>\n    <div>Hello World\
    \ 1</div>\n    <div class=\"div2\">Hello World 2</div>\n    <div id=\"div3\">Hello\
    \ World 3</div>\n    <button>Show</button>\n    <script src=\"jquery.min.js\"\
    ></script>\n    <script src=\"app3.js\"></script>\n</body>\n</html>\n```\n\n**JavaScript\
    \ 代码：**\n```javascript\nconsole.log$(\"div\").first());\nconst val = \"<h1>Laurence\
    \ Svekis</h1>\";\n$(\"div\").first().html(val);\n$(\"div\").last().text(val);\n\
    \n$(\"div\").click((e) => {\n    const $el = $(e.target);\n    console.log($el);\n\
    \    $el.html('clicked');\n    $(e.target).text('Ready');\n    $(e.target).hide(\"\
    slow\");\n});\n\n$(\"button\").click((e) => {\n    $(\"div\").show(\"fast\");\n\
    \    $(\"h1\").show(4000);\n});\n\nfunction eleClicker(e){\n    console.log(e);\n\
    }\n```\n\n![](img/919ec6404bc87421b2aa4baaa49dd58b_62_0.png)\n*图 3.1：练习输出*\n\n\
    以下 JavaScript 代码解析：\n- `console.log$(\"div\").first());`: 此行使用 jQuery 选择页面上的第一个\
    \ `<div>` 元素并将其打印到控制台。\n- `const val = \"<h1>Laurence Svekis</h1>\";`: 此行创建一个包含文本\
    \ Laurence Svekis 的 `<h1>` 元素的 HTML 字符串。\n- `$(\"div\").first().html(val);`: 此行选择第一个\
    \ `<div>` 元素并将其 HTML 内容设置为变量 `val` 中的值（即用 `<h1>` 元素替换第一个 `<div>` 的内容）。\n- `$(\"\
    div\").last().text(val);`: 此行选择最后一个 `<div>` 元素并将其文本内容设置为变量 `val` 中的值（即将最后一个 `<div>`\
    \ 的文本更改为 Laurence Svekis）。\n- `$(\"div\").click((e) => { ... });`: 此代码为所有 `<div>`\
    \ 元素绑定点击事件处理程序。当 `<div>` 被点击时，执行处理函数。它将被点击的 `<div>` 的 HTML 内容更改为 clicked，将文本内容更改为\
    \ Ready，然后以慢速隐藏该 `<div>` 元素。\n"
