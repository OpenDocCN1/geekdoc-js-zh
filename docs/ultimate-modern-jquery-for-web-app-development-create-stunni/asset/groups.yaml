    \n3. 选中了具有 `type=\"text\"` 属性的 `<input>` 元素，并为其绑定了 `change` 事件。当输入框中的文本发生变化时，输入框的值将显示在“output”\
    \ 元素中。\n\n4. 使用 `:input` 选择器选中了所有输入元素（例如文本输入框），并为它们绑定了 `select` 事件。当某个输入字段被选中时（例如通过点击它），所选输入字段的值将显示在“output”元素中。\n\
    \n5. 选中了类名为“main”的 `<form>` 元素，并为其绑定了 `submit` 事件。当表单提交时，此事件处理器使用 `e.preventDefault()`\
    \ 防止默认的表单提交行为。它还会控制台输出一条消息，表明表单已提交。\n\n6. 选中了 ID 为“btn1”的按钮。当点击此按钮时，点击事件处理器将通过调用\
    \ `$('.main').submit()` 触发表单提交。\n\n总而言之，这段代码演示了如何使用 jQuery 处理各种表单元素的事件，以及如何防止默认的表单提交。它还展示了如何在点击按钮时通过程序触发表单提交。从表单元素中选中的值将显示在“output”元素中。\n\
    \n**结论**\n\n本章深入探讨了 jQuery 事件处理，这是 Web 开发中的一个关键方面。从 JavaScript 事件模型的概述开始，jQuery\
    \ 强大的强大的方法（如 `.click()`、`.hover()` 和 `.submit()`）让读者能够熟练地管理用户交互。它探索了鼠标事件，确保了拥有处理各种鼠标相关交互的多种功能工具箱，并提供了关于\
    \ jQuery 鼠标移动监听器和悬停事件的实用指导。此外，本章涵盖了监听键盘事件和从事件对象中提取值，提升了开发者的熟练程度。本章强调了 jQuery 表单事件的重要性，通过提供优化性能和组织最佳实践的见解结束，使读者能够高效地创建动态交互的\
    \ Web 应用程序。\n\n在下一章中，关于 jQuery 事件委托将向读者介绍多功能的 `.on()` 方法。本章强调了事件委托对于动态创建元素的效率，并探索了事件冒泡和传播，演示了它们在定制事件行为中的作用。一个使用\
    \ `.stopPropagation()` 的实用示例强调了有效的事件控制。\n\n此外，本章将其范围扩展到浏览器和窗口事件，以关于 jQuery 滚动事件的实操练习结束，为读者提供了创建响应式交互式\
    \ Web 程序的全面工具箱。\n\n## 第 11 章\n## 高级事件处理技术\n\n#### 简介\n\n我们将关注如何高效使用 `.on()` 方法处理事件。通过练习来理解事件绑定的复杂性，并通过更强大的交互来提升技能。本章涵盖了事件冒泡和传播等核心概念，阐明了它们在塑造事件行为中的作用。使用\
    \ `.stopPropagation()` 的实用示例有助于掌握精确的事件控制。本章以 jQuery 滚动事件的实操练习结束，让读者能够有效地创建响应式\
    \ Web 应用程序。\n\n#### 结构\n\n在本章中，我们将涵盖以下主题：\n- 事件委托简介\n- 多功能的 `.on()` 方法\n- 事件冒泡与传播\n\
    - `.stopPropagation()` 示例\n- jQuery 滚动事件练习\n\n除了基础事件方法外，本章还涵盖了更高级事件处理技术。\n\n**事件委托**\n\
    \n事件委托是处理动态创建元素事件的一种强大方法。它允许你向父元素绑定事件处理器并捕获来自子元素的事件，减少了对单个事件绑定的需求。\n\n### `.on()`\
    \ 方法\n\n`.on()` 方法是向元素绑定多个事件的多功能方式。它简化了事件绑定，使得管理单个元素上的多个交互变得更加容易。\n\n```html\n\
    <button id=\"myButton\">点击我</button>\n```\n\nJavaScript (jQuery):\n\n```javascript\n\
    $(document).ready(function() {\n  // 为 ID 为 \"myButton\" 的按钮元素绑定点击事件处理器\n  $('#myButton').on('click',\
    \ function() {\n    alert('按钮被点击了！');\n  });\n});\n```\n\n在这个示例中，当文档准备就绪（例如通过点击它），所选输入字段的值将显示在“output”元素中。`.on()`\
    \ 方法提供了一种处理点击、悬停、按键等各种事件的方法。\n\n**练习：**\n\n1. 在开始时创建一个类名为 `boxes` 的元素。\n2. 为该元素添加多个事件：`.click()`、`.mouseenter()`\
    \ 和 `.mouseleave()`。\n3. 对于 `.btns` 类中的所有元素，`.click()` 方法应该输出索引（index）。\n4. 创建一个包含某些数据的对象，然后使用\
    \ `.on()` 将数据传递给回调函数。\n5. 在 `adder` 函数中输出该对象。\n6. 创建按钮并将它们附加到 `.btns` 类中。在添加 `.click()`\
    \ 事件之后创建的按钮也将生效。\n\n**CSS:**\n\n```css\n.box {\n  border: 1px solid #ddd;\n  height:\
    \ 50px;\n  width: 100px;\n}\n.input {\n  display: block;\n}\n.active {\n  background-color:\
    \ red;\n  color: green;\n}\n```\n\n**HTML:**\n```html\n<div class=\"output\"></div>\n\
    <div class=\"btns\">\n  <button id=\"btn1\">1</button>\n  <button id=\"btn2\"\
    >2</button>\n  <button id=\"btn3\">3</button>\n</div>\n```\n\n**JavaScript:**\n\
    \n```javascript\n$(document).ready(function() {\n  $('<div>').text('Laurence Svekis').addClass('box').prependTo('body');\n\
    \n  $('.box').on({\n    click: function() { $(this).toggleClass('active'); },\n\
    \    mouseenter: function() { $(this).css('background-color', 'blue'); },\n  \
    \  mouseleave: function() { $(this).css('background-color', 'white'); }\n  });\n\
    \n  $('.btns').on('click', 'button', function() {\n    const val = `${$(this).index()}\
    \ index button`;\n    $('.output').text(val);\n  });\n\n  const obj = {\n    first:\
    \ 'Laurence',\n    last: 'Svekis',\n    id: 100\n  };\n\n  $('.output').on('click',\
    \ obj, adder);\n\n  function adder(e) {\n    console.log(e.data);\n  }\n\n  $('.btns\
    \ button').click(function() {\n    const val = `${$(this).index()} index button`;\n\
    \    $(this).css('background-color', 'red');\n    console.log(val);\n  });\n\n\
    \  for (let i = 0; i < 5; i++) {\n    const temp = `${i + 4}`;\n    $('<button>').text(temp).appendTo('.btns');\n\
    \  }\n});\n```\n\n"
