    \ // 输出被点击的元素\n  const boo = $(this).hasClass('red'); // 检查元素是否有‘red’类\n  console.log(boo);\
    \ // 输出结果（true 或 false）\n  if(boo){\n    $(this).text('已经是红色了');\n  } else {\n\
    \    $(this).text('已变为蓝色');\n  }\n});\n```\n\n在此步骤中：\n1. 我们开始为页面上所有的 `<div>` 元素添加点击事件。\n\
    2. 使用 `.hasClass()` 检查元素是否具有 'red' 类。\n3. 根据结果，我们更改元素的文本。\n4. 然后我们添加或移除 'red'\
    \ 类。\n\n### 第 2 步：添加蓝色类\n\n我们为第一个按钮 `#btn1` 添加事件，为所有的 `<div>` 元素添加 `blue` 类。\n\
    \n```javascript\n$('#btn1').click(() => {\n  $('div').addClass('blue'); // 为所有\
    \ div 添加蓝色类\n});\n```\n\n在此步骤中：\n当点击第一个按钮 `#btn1` 时，我们使用 `.addClass()` 为所有的 `<div>`\
    \ 元素添加 `blue` 类。这会将它们的颜色变为蓝色。\n\n### 第 3 步：通过第二个按钮切换类\n\n我们为第二个按钮 `#btn2` 添加事件，切换所有\
    \ `<div>` 元素的 `red` 和 `blue` 类。\n\n```javascript\n$('#btn2').click(() => {\n \
    \ $('div').toggleClass('red'); // 切换红色类\n  $('div').toggleClass('blue'); // 切换蓝色类\n\
    });\n```\n\n在此步骤中：\n1. 当点击第二个按钮 `#btn2` 时，我们使用 `.toggleClass()` 切换所有 `<div>` 元素的\
