    ```html\n<div class=\"box\"></div>\n<button id=\"changeColor\">更改颜色</button>\n\
    ```\n**JS：**\n```javascript\n$('#changeColor').click(function() {\n  $('.box').css('background-color',\
    \ 'coral');\n});\n```\n**解释：**\n在此示例中，我们有一个类为 box 的 div。初始背景为浅蓝色。当点击“更改颜色”按钮时，使用\
    \ `.css()` 方法将颜色改为珊瑚色。\n\n**使用 jQuery 获取和设置元素属性**\n\n**理解元素属性：** 我们探索元素属性的概念，它们是提供\
    \ HTML 元素信息的值，例如 href 或 src。\n\n**使用 .attr()：** jQuery 的 .attr() 方法允许我们获取或设置属性。例如，我们可以更改图像的\
