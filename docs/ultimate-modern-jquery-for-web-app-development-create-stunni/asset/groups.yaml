    ***图 7.1：元素的样式属性*** \n\n在本次练习中，我们将探索如何使用 jQuery 与 HTML 元素的样式属性交互。我们将为按钮和元素添加事件以更新样式属性、生成随机颜色、获取样式属性并增加元素的宽度。\n\
    \n**步骤 1：切换类并更新样式属性**\n我们首先为两个按钮 `#btn1` 和 `#btn2` 添加点击事件。当点击时，这些按钮将分别切换所有 `div`\
    \ 元素的‘red’和‘blue’类。此外，它们将更新宽度样式属性。\n\n```javascript\n$('#btn1').click(() => {\n\
    \  $('div').toggleClass('red');\n  $('div').css('width', '100px');\n});\n$('#btn2').click(()\
    \ => {\n  $('div').toggleClass('blue');\n  $('div').css('width', '+=50');\n});\n\
    ```\n\n**步骤 2：生成随机颜色并更新样式属性**\n我们为页面上所有的 `div` 元素添加点击事件。点击时，该事件将使用 JavaScript\
    \ 代码为 `color` 和 `background-color` 样式属性生成随机颜色。\n\n```javascript\n$('div').click(function\
    \ () {\n  const rc = '#' + Math.random().toString(16).substring(2, 8);\n  const\
    \ rc2 = '#' + Math.random().toString(16).substring(2, 8);\n  $(this).css('background-color',\
    \ rc);\n  $(this).css('color', rc2);\n  // 获取多个样式属性并存储在‘temp’中。\n  const temp\
    \ = $(this).css(['color', 'background-color', 'height', 'font-size', 'width']);\n\
    \  // 创建一个 HTML 字符串来显示样式属性。\n  let elText = $(this).text();\n  let html = `<h1>${elText}</h1><ul>`;\n\
    \  for (const prop in temp) {\n    html += `<li>${prop}:${temp[prop]}</li>`;\n\
    \  }\n  html += '</</ul>';\n  // 在页面其中一个元素中显示样式属性。\n  output(html);\n});\n```\n\
    \n**步骤 3：输出函数**\n我们创建一个输出函数来在页面元素之一（.div4）中显示内容。\n```javascript\nfunction output(val)\
