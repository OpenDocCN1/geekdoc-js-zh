    \ box. Initially, it has light blue background. When the Change Color button is\
    \ clicked, the jQuery .css() method is used to change the color to coral.\n\n\
    **Getting and Setting Element Attributes with jQuery**\n\n**Understanding Element\
    \ Attributes:** We’ll explore the concept of element attributes, which are values\
    \ that provide information about HTML elements, like href or src.\n\n**Using .attr():**\
    \ jQuery’s .attr() method allows us to get or set attributes. For example, we\
    \ can change the src of image.\n\n**Manipulating Attributes:** We’ll demonstrate\
    \ how to manipulate various attributes, including href, data-*. Readers will learn\
    \ how to create interactive elements by changing attributes.\n\n**Example: Toggle\
    \ Image Source**\n\n**HTML:**\n```html\n<img id=\"myImage\" src=\"image1.jpg\"\
    \ alt=\"Image 1\">\n<button id=\"toggleImage\">Toggle Image</button>\n```\n**JS:**\n\
    ```javascript\n$('#toggleImage').click(function() {\n  const image = $('#myImage');\n\
    \  const currentSrc = image.attr('src');\n  if (currentSrc === 'image1.jpg') {\n\
    \    image.attr('src', 'image2.jpg').attr('alt', 'Image 2');\n  } else {\n   \
    \ image.attr('src', 'image1.jpg').attr('alt', 'Image 1');\n  }\n});\n```\n**Explanation:**\n\
    In this example, we have an image with id myImage. Initially, it displays \"Image\
    \ 1\" with source image1.jpg. When the Toggle Image button is clicked, we check\
    \ the current source. If the current source is image1.jpg, it changes the src\
    \ to image2.jpg and updates the alt to Image 2. Otherwise, it reverts to image1.jpg\
    \ and Image 1.\n\n**Retrieving and Modifying Element Dimensions with jQuery**\n"
  mdcn: "\n实现 jQuery 事件处理以创建、修改和删除列表项。\n\n**结论**\n\n本章为读者提供了实操经验，加强了他们对 jQuery 概念的理解。通过引导读者创建一个带有交互元素的动态列表，本章演示了如何应用各种\
