    ) // 选择所有文本输入\n// 带属性选择\n$(\"[data-toggle]\") // 选择带有 data-toggle 的元素\n```\n\n\
    **使用属性选择：**\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Attribute\
    \ Selector</title>\n</head>\n<body>\n    <button data-toggle=\"modal\">打开模态框</button>\n\
