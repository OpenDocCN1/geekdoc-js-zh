    ![](img/cover.jpg)


    ![CSS3 网页设计师指南](img/cover.jpg)


    版权所有 © 2010 Dan Cederholm


    保留所有权利


    出版人：Jeffrey Zeldman


    设计师：Jason Santa Maria


    编辑：Mandy Brown


    技术编辑：Ethan Marcotte


    文字编辑：Krista Stevens


    ISBN 978-0-9844425-3-9


    A Book Apart


    纽约，纽约州


    [`books.alistapart.com`](http://books.alistapart.com)


    ## 前言


    网站并非网站的图片。当一个人在 Photoshop 中设计，另一个人将设计转换为标记和 CSS 时，编码者必须对设计者的意图进行猜测和假设。这种解读过程难免会有摩擦——除非编码者是
    Dan Cederholm。当 Dan 为别人的设计编写代码时，他总能做到完美无缺，甚至连设计者出错的部分也能纠正。例如，Dan 总能将设计者固定的 Photoshop
    尺寸转化为灵活、可访问且坚固的代码。（事实上，Dan 在教会我们如何做到这一点的同时，还创造了“坚固的网页设计”这一术语。）


    对 Dan 而言，灵活绝不意味着马虎。细节始终至关重要。这是因为 Dan 不仅是一位出色的前端开发者和用户倡导者，他骨子里也是一位设计师。他梦想设计，倾注设计，甚至通过
    [dribbble.com](http://dribbble.com) 为世界带来了一种分享设计的新方式。Dan 还是一位天生的教师和风趣的人，他那面无表情的冷幽默让
    Steven Wright 都相形见绌。Dan 在世界各地演讲，帮助设计师提升技艺，他不仅传授知识，而且*技惊四座*。


    朋友们，正因如此，我们邀请他担任我们（以及你们）的 CSS3 向导。你再也找不到比我们的 Dan 更聪明、更有经验、更专注于设计的向导，或者比他更狂热的网络标准极客了。祝旅途愉快！


    ——Jeffrey Zeldman


    ![第 1 章：今天就用 CSS3](img/chap-1.png)


    回顾 CSS 的传奇历史，我们看到一些重要的里程碑塑造了我们作为网页设计师的方向。这些分水岭式的技术、文章和事件帮助我们创建了灵活、可访问的网站，无论从视觉上还是从底层代码上，我们都引以为豪。


    可以说，事情在 2001 年开始变得有趣起来，当时 Jeffrey Zeldman 撰写了《让糟糕的浏览器见鬼去吧》（[`bkaprt.com/css3/1/`](http://bkaprt.com/css3/1/)）^(1)，标志着
    CSS 时代的黎明。这份宣言鼓励设计师们向前迈进，将 CSS 用于不仅仅是链接颜色和字体，而抛弃那些无法处理 CSS1 的旧式、无能的浏览器。是的，*CSS1*。


    接下来的几年里，我们不断发现并分享使用 CSS 实现客户和老板需求的技术。那是一个激动人心的实验时代，我们突破界限，摸索出处理跨浏览器渲染问题的复杂方法——所有这一切都是为了增加灵活性、提高可访问性并减少代码量。


    大约在 2006 年左右，关于 CSS 的讨论变得沉寂。我们需要解决的大多数问题都有了文档化的解决方案。常见的浏览器漏洞也有了多种变通方法。我们为那些因莫名其妙的
    Internet Explorer 漏洞而留下心理创伤的设计师成立了支持小组。我们的头发开始变白。（好吧，我是在说我自己。）但最重要的是，当时的主流浏览器相对停滞不前。这段稳定期让我们有时间打磨可复用的方法并建立最佳实践，但对于渴望更好工具的
    CSS 爱好者来说，情况变得有点，我敢说，*无聊*。


    幸运的是，情况发生了变化。浏览器开始更快地迭代和更新（好吧，至少其中一些是这样）。Firefox 和 Safari 不仅开始获得市场份额，而且凭借更快的开发周期蓬勃发展，在添加更多实验性属性的同时，也提供了坚实的标准支持。在许多情况下，这些具有前瞻性的浏览器选择实现的技术随后被纳入草案规范。换句话说，有时是浏览器厂商推动了规范的进展。


    ## 但别去读规范


    问一屋子网页设计师：“谁喜欢读规范？”可能只有一个人会举手。（如果你是那个人，我赞赏你，以及你显然拥有的空闲时间。）虽然规范是重要的*参考*，但我当然不喜欢通读整个规范，也不建议为了全面掌握
    CSS3 而这样做。


    好消息是，CSS3 实际上是一系列*模块*，它们被设计成可以彼此独立地实现。这是一件非常好的事情。这种分块的方法使得规范的某些部分可以比其他部分进展得更快（或更慢），并鼓励浏览器厂商在
    CSS3 整体被认为完成之前，先实现那些更成熟的模块。


    W3C 解释了这种模块化方法：


    > 与其试图将数十个更新塞进一个单一的庞大规范中，不如能够单独更新规范的各个部分，这样会更简单、更高效。模块将使 CSS 能够以更及时、更精确的方式更新，从而使整个规范能够更灵活、更及时地演进。^(2)


    这对我们网页设计师的好处是，伴随着实验和更快的发布周期，我们可以在许多 CSS3 属性成为候选推荐标准之前（也许要等上几年）就使用它们。


    当然，如果你*喜欢*阅读规范，那就去读吧！自然，里面有很多东西可以学——但更实际的做法是专注于那些目前已经实现且*今天*就能用的部分，而这些正是我们将在本章剩余部分讨论的内容。之后，我们将在本书其余部分的示例中应用这些内容。


    我通过剖析现实中的示例学到的网页设计知识，总是比阅读白皮书要多，而这正是我们在接下来的页面中要强调的。


    ## CSS3 属于每个人


    我经常听到全球各地的同行网页设计师这样说：“我等不及要用 CSS3 了……*等它完成的时候*。”


    但事实是，每个人现在就可以开始使用 CSS3。幸运的是，你不需要改变思维方式，也不需要对你构建网站的方式进行剧烈调整。怎么能在任何项目中使用 CSS3 呢？因为我们将精心选择应用
    CSS3 的场景，将重点放在*体验层*上。


    ### 瞄准体验层


    如果过去几年我们做得正确，我们一直在网络标准（语义化 HTML 和用于布局、字体、颜色等的 CSS）的基础上构建，而将大部分交互效果——动画、反馈和移动——留给
    Flash 和 JavaScript 等技术。随着 CSS3 属性在有前瞻性的浏览器中缓慢但稳步地引入，我们可以开始将部分体验层转移到样式表中。


    作为一个更偏向视觉设计而非编程的界面设计师，我越能用已经熟悉的工具（如 HTML 和 CSS）来创造引人入胜的用户体验，我就越会开心地手舞足蹈。


    CSS3 是为像你我这样的网页设计师准备的，我们可以*今天*就开始使用它的部分功能，只要我们知道*何时*以及*如何*将其融入其中。


    ### 何时应用 CSS3


    就网站的视觉体验而言，我们可以将事物分为两类：关键性和非关键性（表 1.01）。


    表 1.01：网站的视觉体验可分为关键性和非关键性两类。后者是今天可以应用 CSS3 的地方。


    | 关键性 | 非关键性 |

    | --- | --- |

    | 品牌 | 交互 |

    | 可用性 | 视觉奖励 |

    | 可访问性 | 反馈 |

    | 布局 | 动效 |


