  trans: "\n声明 CSS 渐变的语法在 Safari 和 Firefox 的实现中略有不同。不过，（非常初步的）规范更倾向于 Firefox 的处理方式。这里有一个很好的例子说明为什么厂商前缀是这个过程的重要组成部分：这两种不同的语法可以为每个浏览器正确声明，而官方规范仍在制定中。\n\
    \n老实说，这两种语法都有点令人困惑。创建渐变时可以有大量的控制，包括涉及的颜色、颜色停止点、渐变方向等。\n\n例如，以下是在 WebKit 和基于 Mozilla\
    \ 的浏览器中为元素背景创建简单线性渐变的语法：\n\n```\n#foo {\n  background-image: -webkit-gradient(linear,\
    \ 0% 0%, 0% 100%, from(#fff), to(#999));\n  background-image: -moz-linear-gradient(0%\
    \ 100% 90deg, #fff, #999);\n  }\n```\n\n这并不完全直观，而且也很难记住每个厂商的差异。\n\n我发现生成正确代码的最佳方法是使用\
    \ John Allsopp 出色的所见即所得编辑器（图 6.06，[`bkaprt.com/css3/14/`](http://bkaprt.com/css3/14/)）。^(17)\n\
    \n![John Allsopp 渐变工具的用户界面截图。](img/6-06.jpg)\n\n图 6.06：John Allsopp 出色的 CSS 渐变工具。\n\
    \n使用这个工具直观地创建你想要的渐变，然后获取适用于 Safari 和 Firefox 的相应语法。John 的工具为你完成了所有繁重的工作。这非常有帮助，因为我还没能记住代码（以及浏览器之间的差异）。\n\
    \nJonathan Snook 有一篇关于处理渐变语法的有用文章，可能也会有所帮助：[`bkaprt.com/css3/15/`](http://bkaprt.com/css3/15/)。^(18)\n\
    \n我们要添加到文本输入框中的渐变非常微妙——只是一个小小的边缘，使其看起来像是内嵌的（图 6.07）。经过调整并在 John Allsopp 的工具中输入一些值后，我们得到了两行简短的\
    \ CSS：\n\n```\n#thing-alerts fieldset input[type=\"text\"] {\n  width: 215px;\n\
    \  padding: 5px 8px;\n  font-size: 1.2em;\n  color: #666;\n  border: none;\n \
    \ background-image: -webkit-gradient(linear, 0% 0%, 0% 12%, from(#999), to(#fff));\n\
    \  background-image: -moz-linear-gradient(0% 12% 90deg, #fff, #999); \n  background-color:\
    \ #fff;\n  -webkit-border-radius: 4px;\n  -moz-border-radius: 4px;\n  -o-border-radius:\
    \ 4px;\n  border-radius: 4px;\n  }\n```\n\n![输入框上渐变的特写，显示字段顶部从深灰色渐变到白色的几个像素。](img/6-07.jpg)\n\
    \n图 6.07：每个文本输入框顶部微小渐变的放大视图，使其看起来有凹陷感。\n\n我们在这里应用的是*线性*渐变，但 CSS 也可以实现*径向*渐变。\n\
    \n在这里你可以看到`-webkit`和`-moz`实现之间的语法差异。我们实际上是在输入框垂直高度的 12%范围内添加了一个从浅灰色（`#999`）到白色（`#fff`）的小型线性渐变。我们使用厂商前缀的`background-image`规则来让\
    \ Safari 和 Firefox 实现这一效果。\n\n图 6.08 显示了结果，你可以看到我们的圆角输入框现在无需图片就拥有了一点内阴影。\n\n![文本输入框现在带有渐变，看起来有深度感。](img/6-08.jpg)\n\
    \n图 6.08：应用了 CSS 渐变的文本输入框。\n\n尚不支持 CSS 渐变的浏览器会忽略这些`background-image`规则，只显示纯白色背景。这完全没问题。但\
    \ CSS 渐变带来的调整、灵活性和控制力相当引人注目。在下一节关于提交按钮的部分，我们将更多地使用它们。\n\n## 纯 CSS3 按钮\n\n如果有一个\
    \ UI 元素能展示 CSS3 的变革性，那可能就是按钮了。结合本书中已经讨论过的许多技术，我们将把一个普通的表单提交按钮变成更有趣的东西——完全使用 CSS（图\
    \ 6.09）。\n\n![默认按钮与样式化按钮的对比。](img/6-09.jpg)\n\n图 6.09：左侧是 Safari 中的默认提交按钮，右侧是使用\
    \ CSS3 样式化的按钮——没有图片！\n\n使用 CSS3 来样式化按钮的美妙之处在于，由于不使用图片，我们得到了更灵活的东西。如果浏览器不支持我们将用来提升按钮视觉效果的属性，那也没关系。它会优雅地降级为用户正在使用的任何浏览器中的默认表单按钮。\n\
    \n那么，让我们逐步了解将默认表单按钮变成图 6.09 右侧那个闪亮按钮所需的步骤。\n\n### 基础按钮样式\n\n首先，我们将添加一些内边距，将字体改为\
    \ Helvetica 以匹配整体设计，关闭边框，并将背景色设置为白色。\n\n```\n#thing-alerts input[type=\"submit\"\
    ] {\n  padding: 8px 15px;\n  font-family: Helvetica, Arial, sans-serif;\n  font-weight:\
    \ bold;\n  line-height: 1;\n  color: #444;\n  border: none;\n  background-color:\
    \ #fff;\n  }\n```\n\n图 6.10 显示了在 Safari 中应用这些简单基础样式后的效果。我们已经得到了一个看起来完全不像默认输入按钮的东西。\n\
    \n![提交按钮，带有矩形白色背景且无边框。](img/6-10.jpg)\n\n图 6.10：移除了默认边框和背景的提交按钮。\n\n### 圆角成胶囊形状\n\
    \n接下来，让我们添加一个`border-radius`堆栈，使按钮变成胶囊形状（图 6.11）。\n\n```\n#thing-alerts fieldset\
    \ input[type=\"submit\"] {\n  padding: 8px 15px;\n  font-family: Helvetica, Arial,\
    \ sans-serif;\n  font-weight: bold;\n  line-height: 1;\n  color: #444;\n  border:\
    \ none;\n  background-color: #fff;\n  -webkit-border-radius: 23px;\n  -moz-border-radius:\
    \ 23px;\n  -o-border-radius: 23px;\n  border-radius: 23px; \n  }\n```\n\n![提交按钮，现在带有圆形白色背景。](img/6-11.jpg)\n\
    \n图 6.11：使用`border-radius`将提交按钮圆角化。\n\n经过一些尝试找到合适的值后，我们确定了`23px`来获得胶囊形状。\n\n###\
    \ 应用线性渐变\n\n现在让我们在按钮上应用一个从底部浅灰色（`#bbb`）到顶部白色（`#fff`）的渐变。我们将再次依赖 Allsopp 先生的渐变工具来生成适用于\
    \ Safari、Chrome 和 Firefox 的正确规则。\n\n```\n#thing-alerts input[type=\"submit\"]\
    \ {\n  padding: 8px 15px;\n  font-family: Helvetica, Arial, sans-serif;\n  font-weight:\
    \ bold;\n  line-height: 1;\n  color: #444;\n  border: none;\n  background-image:\
    \ -webkit-gradient(linear, 0% 0%, 0% 100%, from(#fff), to(#bbb));\n  background-image:\
    \ -moz-linear-gradient(0 100% 90deg, #fff, #bbb); \n  background-color: #fff;\n\
    \  -webkit-border-radius: 23px;\n  -moz-border-radius: 23px;\n  -o-border-radius:\
    \ 23px;\n  border-radius: 23px;\n  }\n```\n\n图 6.12 显示了在 Safari 中的进展。现在我们有了一个带有\
    \ CSS 渐变的圆角按钮。到目前为止，没有使用任何图片，我们只在样式表中添加了几行代码。\n\n![提交按钮，渐变背景从顶部白色到底部深灰色。](img/6-12.jpg)\n\
    \n图 6.12：为提交按钮添加的 CSS 渐变。\n\n### 添加文本阴影让文字有嵌入感\n\n现在让我们在文字下方添加一个近乎白色的`text-shadow`，使文字看起来像是印在按钮上。\n\
    \n```\n#thing-alerts input[type=\"submit\"] {\n  padding: 8px 15px;\n  font-family:\
    \ Helvetica, Arial, sans-serif;\n  font-weight: bold;\n  line-height: 1;\n  color:\
    \ #444;\n  border: none;\n  text-shadow: 0 1px 1px rgba(255, 255, 255, 0.85);\n\
    \  background-image: -webkit-gradient(linear, 0% 0%, 0% 100%, from(#fff), to(#bbb));\n\
    \  background-image: -moz-linear-gradient(0 100% 90deg, #fff, #bbb); \n  background-color:\
    \ #fff;\n  -webkit-border-radius: 23px;\n  -moz-border-radius: 23px;\n  -o-border-radius:\
    \ 23px;\n  border-radius: 23px;\n  }\n```\n\n"
- fmt: "\nWe’ll use `RGBA` to tone down pure white to 85%, letting the gray gradient\
    \ show through just a tiny bit. We’re also specifying that the shadow sits directly\
    \ under the text by one pixel, and blurring the shadow one pixel as well.\n\n\
    FIGURE 6.13 shows a close-up of the subtle shadow in place, as well as how the\
    \ button is coming along so far.\n\n![A close-up of the white text-shadow on the\
    \ submit button, and a view at regular size.](images/6-13.jpg)\n\nFIG 6.13: A\
    \ zoomed-in view of the subtle `text-shadow` we added to create an embossed look.\n\
    \n### Adding a box-shadow to the button\n\nOur last piece of CSS3 to add to this\
    \ stylish little button is a very slight `box-shadow` to add just another hint\
    \ of dimension. It’ll help it sit better on the gray background behind it.\n\n\
    Here’s a stack that adds the `box-shadow` to the browsers that currently support\
    \ it, as well as future ones.\n\n```\n#thing-alerts input[type=\"submit\"] {\n\
    \  padding: 8px 15px;\n  font-family: Helvetica, Arial, sans-serif;\n  font-weight:\
    \ bold;\n  line-height: 1;\n  color: #444;\n  border: none;\n  text-shadow: 0\
    \ 1px 1px rgba(255, 255, 255, 0.85);\n  background-image: -webkit-gradient(linear,\
    \ 0% 0%, 0% 100%, from(#fff), to(#bbb));\n  background-image: -moz-linear-gradient(0%\
    \ 100% 90deg, #bbb, #fff);\n  background-color: #fff;\n  -webkit-border-radius:\
    \ 23px;\n  -moz-border-radius: 23px;\n  -o-border-radius: 23px;\n  border-radius:\
    \ 23px;\n  -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n  -moz-box-shadow:\
    \ 0 1px 2px rgba(0, 0, 0, 0.5);\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); \n\
    \  } \n```\n\nFIGURE 6.14 shows the results in Safari after adding a `box-shadow`\
    \ to the button that’s just `1px` from the top with a `2px` blur. For color, we’re\
    \ using black at 50% using `RGBA`, so that the shadow will have some transparency\
    \ to it, letting the background behind it shine through.\n\n![A close-up of the\
    \ gray shadow beneath the submit button, and a view at regular size.](images/6-14.jpg)\n\
    \nFIG 6.14: A zoomed-in view of the small `box-shadow` added to the bottom of\
    \ the button, lifting it off the background just a bit.\n\nAnd that not only completes\
    \ our button, but our entire form as well. Using a few extra lines of CSS3, we’ve\
    \ molded an otherwise default-looking form into something a bit more stylized\
    \ and in line with the rest of the page design. We’ve chosen to use CSS3 here\
    \ instead of images, as it’s perfectly OK and harmless for browsers that don’t\
    \ yet support these advanced rules. Let’s take a look to make sure.\n\n## What\
    \ about other browsers?\n\nIf we view our form in Internet Explorer 7, a browser\
    \ that has zero support for CSS3, we see a perfectly acceptable, functional form\
    \ (FIG 6.15). And that’s great news! All the enhancements we added via a handful\
    \ of CSS3 rules in the stylesheet have been safely ignored, leaving a bare-bones\
    \ form that acts exactly as it should. Mission accomplished.\n\n![The form in\
    \ IE7; inputs are not rounded and there are no gradients or text-shadows.](images/6-15.jpg)\n\
    \nFIG 6.15: In IE7, the form looks like a normal form. And functions like one,\
    \ too. This is good.\n\n## Using box-shadow to create focus states\n\nWe could\
    \ go a step further in our enrichment of this form’s interactions by using the\
    \ `box-shadow` property on the inputs’ focus state. It’s quick, easy, and like\
    \ the aforementioned CSS3, degrades beautifully.\n\nIt requires simply creating\
    \ a new declaration and adding the `:focus` pseudo-class to the attribute selector\
    \ for text inputs.\n\n(By the way, the preceding paragraph is a sure-fire pickup\
    \ line, should you be in need of one. Thank me later.)\n\n```\n#thing-alerts input[type=\"\
    text\"]:focus {\n  -webkit-box-shadow: 0 0 12px rgba(51, 204, 255, 0.5);\n  -moz-box-shadow:\
    \ 0 0 12px rgba(51, 204, 255, 0.5);\n  box-shadow: 0 0 12px rgba(51, 204, 255,\
    \ 0.5);\n  }\n```\n\nThis declaration includes a `box-shadow` stack applying a\
    \ bright blue shadow at 50% opacity around the text inputs when they are focused.\
    \ We see the results in FIGURE 6.16, where we’re mimicking the default OS behavior\
    \ of focused inputs, but in creating our own we have much more control over the\
    \ appearance.\n\n![A blue glow appears around the text input when focused.](images/6-16.jpg)\n\
    \nFIG 6.16: A `box-shadow` is applied to the `:focus` state of the text inputs.\n\
    \nBrowsers that don’t support `box-shadow` yet? Well they just get a normal input\
    \ when focused. And I’ll bet you can guess what I’m about to say … yep, that’s\
    \ perfectly OK.\n\n## Adding CSS Animations to enrich form interactions\n\nGoing\
    \ even a step further with the `box-shadow` on focus treatment, what if the shadow\
    \ was *animated* as well, perhaps pulsing as if waiting for you to type. Let’s\
    \ briefly take a dip into the world of CSS Animations to make that happen in WebKit-powered\
    \ browsers.\n\nI say WebKit-powered browsers in this case because CSS Animations\
    \ (like CSS Transforms and Transitions), were initially developed by the WebKit\
    \ team, then folded back into a proposed standard at the W3C ([http://bkaprt.com/css3/16/](http://bkaprt.com/css3/16/)).^([19](#chapter6.html_footnote-19))\
    \ However, unlike Transforms and Transitions, Animations have yet to be implemented\
    \ by anyone else. They currently work in Safari and Chrome, but not Firefox or\
    \ Opera, nor is there planned support in IE9. For that reason, I don’t place as\
    \ much attention on Animations (at least for now). And while they *are* powerful\
    \ and exciting, it remains to be seen whether their adoption will be as comprehensive\
    \ and swift as Transforms and Transitions have been, which already have decent\
    \ (and growing) support.\n\nNonetheless, the concept and syntax for creating CSS\
    \ Animations is rather straightforward, and for non-critical enhancements that\
    \ only WebKit browsers will enjoy for now, it’s fun to inject them into appropriate\
    \ places. Let’s add a simple animation to the focus state of the input to get\
    \ a sense of how it all works.\n\n### Working with keyframes\n\nThe first part\
    \ of building a CSS animation is to create a keyframes declaration. Those familiar\
    \ with programming might relate this to building a function that can be called\
    \ and referenced elsewhere in the stylesheet.\n\nA `keyframe` is a specialized\
    \ CSS at-rule. It’s similar to a normal CSS declaration, but allows you to name\
    \ it with an identifier and specify CSS rules and changes over the duration with\
    \ a list of percentage values (or the keywords “to” and “from”).\n\nIt’ll make\
    \ more sense to just see one in practice, so let’s create a simple animation that\
    \ will fade in and fade out the `box-shadow` we previously added to focused form\
    \ inputs.\n\nWe’ll name it “pulse” and set three rules that differ slightly: one\
    \ at the starting point (0%), one at the halfway point (50%), and one at the end\
    \ (100%). Each percentage rule is just adjusting the level of opacity of the blue\
    \ `box-shadow`, from 20% up to 90% and back down to 20%. This change, transitioned\
    \ over time and looped, will create the appearance of the `input` pulsing when\
    \ focused in WebKit-powered browsers.\n\n```\n@-webkit-keyframes pulse {\n  0%\
    \ {\n    -webkit-box-shadow: 0 0 12px rgba(51, 204, 255, 0.2);\n  }\n  50% {\n\
    \    -webkit-box-shadow: 0 0 12px rgba(51, 204, 255, 0.9);\n  }\n  100% {\n  \
    \  -webkit-box-shadow: 0 0 12px rgba(51, 204, 255, 0.2);\n  }\n}\n```\n\nHere\
    \ I’m specifying rules for WebKit only, using the `-webkit-` vendor prefix. Previously\
    \ in the book we’ve been good about writing duplicate rules for all the vendors\
    \ that currently support the properties, as well as adding the non-prefixed version\
    \ for future-proofing. In this case, with CSS Animations still unsupported in\
    \ anything but Safari and Chrome, and reservations from other vendors about whether\
    \ animations in fact belong in CSS at all, I’m choosing to write the `-webkit-`\
    \ rules only.\n\n### Referencing the keyframe\n\nThe second part of a CSS animation\
    \ is referencing the `keyframe` by name using the `animation` property.\n"
