  trans: "\n\n```\nul.gallery li {\n  float: left;\n  margin: 0 10px;\n  padding:\
    \ 10px;\n  border: 1px solid #ddd;\n  list-style: none;\n  }\n\nul.gallery li\
    \ a img {\n  float: left;\n  width: 200px;\n  }\n```\n\n这里我们让列表项浮动，关闭了 `list-style`\
    \ 项目符号，并为每个 `li` 添加了 1 像素的灰色边框。我们还让图片本身浮动，并将其尺寸缩小到 200 像素宽。\n\n这两行简洁的声明就能让我们达到默认设计的目标（请参考图\
    \ 4.01）。\n\n### 在悬停时应用缩放变换\n\n现在该轮到变换了。让我们添加一个 `scale` 变换，使照片在悬停时变大。请记住，标记中的原始图片比我们在样式表中指定的\
    \ 200 像素宽度要大。这意味着我们可以安全地放大图片，同时保持其质量。\n\n缩放变换在 Safari、Chrome、Firefox 和 Opera 中均受支持——每个浏览器都需要一个厂商前缀。让我们添加一组代码，既能满足这些浏览器，也能兼容未来的浏览器。\n\
    \n```\nul.gallery li a:hover img {\n  -webkit-transform: scale(1.5);\n  -moz-transform:\
    \ scale(1.5);\n  -o-transform: scale(1.5);\n  transform: scale(1.5);\n  }\n```\n\
    \n当超链接被悬停时，我们表示：“将图片缩放到其初始大小的 1.5 倍”（初始大小为 200 像素宽）。设置 `scale(2)` 会使照片变为两倍大，`scale(0.5)`\
    \ 则使其变为一半大小，以此类推。\n\n图 4.03 显示了结果，此处是在 Safari 中查看的。请注意，`transform` 不会干扰文档中的其他元素，并且会从中心向外放大照片，而不影响其周围的布局。\n\
    \n![三张照片水平排列，中间的照片被悬停。中间的照片更大，并覆盖了左右两侧的照片。](img/4-03.jpg)\n\n图 4.03：中间的照片被悬停，并通过\
    \ CSS 变换进行了缩放。\n\n你还可以选择设置一个 `transform-origin`，它将决定缩放从何处展开：顶部、底部、中心或百分比（参见 [`bkaprt.com/css3/8/`](http://bkaprt.com/css3/8/)）。^(10)\n\
    \n例如，要让照片从其容器的左下角而不是中心向外缩放，你可以这样写：\n\n```\nul.gallery li a:hover img {\n  -webkit-transform-origin:\
    \ bottom left; \n  -moz-transform-origin: bottom left; \n  -o-transform-origin:\
    \ bottom left; \n  transform-origin: bottom left; \n  -webkit-transform: scale(1.5);\n\
    \  -moz-transform: scale(1.5);\n  -o-transform: scale(1.5);\n  transform: scale(1.5);\n\
    \  }\n```\n\n### 合适的投影\n\n我们可以在这个例子中更进一步，为悬停时的照片添加投影。这是 CSS3 `box-shadow` 属性的一个恰当用法，因为我们让放大的照片看起来像是从页面上浮起来。\n\
    \n投影是一种微妙的技巧，常常被过于冲动的设计师滥用。很容易就会过头。但在本例中，我们试图为照片放大效果增加*立体感*，所以应该会效果不错。\n\n`box-shadow`\
    \ 的语法与我们在第 3 章中使用的 `text-shadow` 属性相同。不过，与 `text-shadow` 不同，`box-shadow` 需要厂商前缀才能在\
    \ Safari、Chrome 和 Firefox 中工作。（Opera 10+ 和 IE9 Beta 支持无前缀的 `box-shadow`。）让我们把这些规则整合进来。\n\
    \n```\nul.gallery li a:hover img {\n  -webkit-transform: scale(1.5);\n  -moz-transform:\
    \ scale(1.5);\n  -o-transform: scale(1.5);\n  transform: scale(1.5);\n  -webkit-box-shadow:\
    \ 4px 4px 10px rgba(0, 0, 0, 0.5);\n  -moz-box-shadow: 4px 4px 10px rgba(0, 0,\
    \ 0, 0.5);\n  box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5); \n  }\n```\n\n我们为支持\
    \ `box-shadow` 属性的 WebKit 和 Mozilla 浏览器添加了一组 CSS3 代码，最后以无前缀版本结尾，就像我们在其他示例中所做的那样。\n\
    \n就语法而言，这里我们为悬停的图片应用了一个阴影：距离顶部 `4px`，距离左侧 `4px`，模糊半径 `10px`，颜色为黑色且不透明度 50%（确保它能与背后的任何背景或元素融合）。\n\
    \n图 4.04 显示了当照片被悬停时，阴影与 `scale` 变换同时出现的效果。这种组合产生了放大的照片从页面中弹出的效果。\n\n![中间的照片再次被悬停，下方带有阴影。](img/4-04.jpg)\n\
    \n图 4.04：悬停的照片，现在应用了 `box-shadow` 并进行了缩放。\n\n### 使用过渡平滑缩放效果\n\n最后，为链接的照片添加一个过渡效果，可以使缩放变得平滑，让\
    \ `:hover` 处理呈现出动画般的放大和缩小效果——这种效果以前只能通过 Flash 或 JavaScript 实现，但现在只需几行 CSS3 就能在许多浏览器中实现。\n\
    \n以下是为我们的小型照片画廊添加的完整 CSS 过渡代码：\n\n```\nul.gallery li {\n  float: left;\n  margin:\
    \ 0 10px;\n  padding: 10px;\n  border: 1px solid #ddd;\n  list-style: none;\n\
    \  }\n\nul.gallery li a img {\n  float: left;\n  width: 200px;\n  -webkit-transition:\
    \ -webkit-transform 0.2s ease-in-out;\n  -moz-transition: -moz-transform 0.2s\
    \ ease-in-out;\n  transition: transform 0.2s ease-in-out; \n  }\n\nul.gallery\
    \ li a:hover img {\n  -webkit-transform: scale(1.5);\n  -moz-transform: scale(1.5);\n\
    \  -o-transform: scale(1.5);\n  transform: scale(1.5);\n  -webkit-box-shadow:\
    \ 4px 4px 10px rgba(0, 0, 0, 0.5);\n  -moz-box-shadow: 4px 4px 10px rgba(0, 0,\
    \ 0, 0.5);\n  box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5); \n  } \n```\n\n请注意，这次我们过渡的属性是\
    \ `scale` 变换，因此 `transition` 和 `transform` 属性都使用了相应的厂商前缀。\n\n## 改变体验\n\n一切就绪后，仅用极少的\
    \ CSS 就能实现如此令人印象深刻的效果。我们将大部分效果负担交给了支持这些特性的浏览器，而不是注入 Flash 或 JavaScript 来实现。\n\n\
    再次强调，在这个特定示例中，我们选择全面拥抱 CSS3 的地方在于体验层：当照片被悬停时，我们提供了一个增强的视图。对于不支持这些属性的浏览器来说，这并非关键。\n\
    \n例如，Internet Explorer 的用户只会看到一个可点击缩略图的画廊，这完全没问题。如果悬停处理是*关键*的，那么我们就需要重新考虑使用 CSS3\
    \ 来实现视觉体验的方式。\n\n## 旋转、倾斜和平移\n\n除了 `scale`，还有另外三种变换可用于旋转、倾斜和平移元素。（平移通过 x/y 坐标移动元素。）让我们将它们分别添加到照片画廊示例中，快速了解它们的工作原理。\n\
    \n### 添加旋转\n\n如果我们希望在悬停时旋转照片，同时仍然放大它，可以在 `:hover` 规则中添加以下 `rotate` 变换：\n\n```\n\
    ul.gallery li a:hover img {\n  -webkit-transform: scale(1.5) rotate(-10deg);\n\
    \  -moz-transform: scale(1.5) rotate(-10deg);\n  -o-transform: scale(1.5) rotate(-10deg);\n\
    \  transform: scale(1.5) rotate(-10deg);\n  -webkit-box-shadow: 4px 4px 10px rgba(0,\
    \ 0, 0, 0.5);\n  -moz-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);\n  box-shadow:\
    \ 4px 4px 10px rgba(0, 0, 0, 0.5);\n  }\n```\n\n我们仍然在悬停时放大照片，但同时使用 `rotate` 将照片向左倾斜\
    \ 10 度（图 4.05）。这在 Safari、Chrome、Firefox 和 Opera 中都能工作。从 `-1deg` 到 `-360deg` 的负值会使元素逆时针旋转，而从\
    \ `1deg` 到 `360deg` 的正值则使其顺时针旋转。\n\n![左侧的照片被悬停并向左旋转，下方带有阴影。](img/4-05.jpg)\n\n\
    图 4.05：一张悬停的照片，现在使用 `rotate` 变换进行了缩放和向左旋转。\n\n"
- fmt: "\nAlternatively, we could add varying `rotate` transforms to the list items,\
    \ so that the photo (and frame) appear to be tossed on the table, randomly. Then\
    \ we can `rotate` and `scale` on `:hover` as well (FIG 4.06).\n\n![All three photos\
    \ are rotated; the left one is rotated a few degrees to the left, the center photo\
    \ is rotated a few degrees to the right, and the right photo is rotated more strongly\
    \ to the left. The right photo is shown hovered over and enlarged with a shadow\
    \ underneath.](images/4-06.jpg)\n\nFIG 4.06: Using `rotate` to make the photos\
    \ appear scattered on the page.\n\nI’m stressing in this little book that the\
    \ most appropriate place to add CSS3 is on the experience layer—but that doesn’t\
    \ mean you can’t use these techniques on the default view of a design, provided\
    \ again that they’re not critical and degrade well.\n\nFor example, should the\
    \ browser not support `rotate` transforms, and the photos appear perfectly straight,\
    \ that’d would be fine. Nothing would appear broken.\n\n### No rotate? Don’t Panic\n\
    \nA nice example of using `rotate` in the primary design of a page is Panic Software’s\
    \ blog ([http://www.panic.com/blog](http://www.panic.com/blog)), where they use\
    \ *very* subtle rotation via CSS3 to tip the entries to the left as if they’re\
    \ sheets of paper left on a desk (FIG 4.07). It’s not crucial to the design, and\
    \ if the entries are straight without rotation (FIG 4.08), it’s perfectly OK.\n\
    \n![Screenshot from Panic Software's blog, showing a post designed to look like\
    \ an index card and rotated slightly to the left.](images/4-07.jpg)\n\nFIG 4.07:\
    \ Panic Software’s blog design uses subtle rotation via CSS3 to add realism.\n\
    \n![Screenshot from Panic Software's blog showing a post designed to look like\
    \ an index card but without the subtle rotation.](images/4-08.jpg)\n\nFIG 4.08:\
    \ Without rotation, the blog still looks great. Nothing appears missing or broken.\n\
    \n### Rotating the sun\n\nAnother nice example of an *appropriate* use of CSS\
    \ transforms is the site for Outside ([http://outsideapp.com](http://outsideapp.com)),\
    \ a wonderful weather app for the iPhone (FIG 4.09).\n\n![Screenshot of the Outside\
    \ app website, showing a sun with dramatic sun rays in the upper right corner.](images/4-09.jpg)\n\
    \nFIG 4.09: The Outside iPhone app uses rotation on the sun graphic.\n\nAt the\
    \ top of the page is a sun graphic (FIG 4.10) that rotates 360° via the use of\
    \ the `rotate` transform. (In this case, JavaScript is used to animate the rotation\
    \ in non-WebKit browsers, but we’ll be discussing pure CSS-based animations later\
    \ in [Chapter 6](#chapter6.html)). This subtle experience enhancement is simple\
    \ and appropriate, as it mimics the same animated sunshine that appears in the\
    \ iPhone app itself. The sun doesn’t rotate in browsers that don’t support CSS\
    \ transforms, and that’s perfectly fine. Nothing appears broken or missing in\
    \ a non-animated version of the site.\n\n![Screenshot of the sun graphic with\
    \ sun rays extending all around it.](images/4-10.jpg)\n\nFIG 4.10: Outside app’s\
    \ sun graphic comes to life after positioning and rotating with CSS.\n\nTransforms\
    \ coupled with transitions in CSS can help support the overall message in the\
    \ designs we create for the web, and that’s a wonderfully enabling tool for us\
    \ web designers.\n\n### The skew transform\n\nThe `skew` transform takes x and\
    \ y coordinates and skews an element. If we were to skew the photos in our gallery\
    \ on hover, for example, we’d use the following CSS (skewing negative five degrees\
    \ on the x coordinate, and 30 degrees on the y coordinate) (FIG 4.11):\n\n```\n\
    ul.gallery li a:hover img {\n  -webkit-transform: scale(1.5) skew(-5deg, 30deg);\n\
    \  -moz-transform: scale(1.5) skew(-5deg, 30deg);\n  -o-transform: scale(1.5)\
    \ skew(-5deg, 30deg);\n  transform: scale(1.5) skew(-5deg, 30deg);\n  }\n```\n\
    \n![The horizontal list of photos, where the center photo has been distorted.](images/4-11.jpg)\n\
    \nFIG 4.11: Using the `skew` transform to distort the photo.\n\nLike `rotate`,\
    \ `skew` accepts positive and negative degree values. You can also use just one\
    \ value for both x and y like so (FIG 4.12):\n\n```\nul.gallery li a:hover img\
    \ {\n  -webkit-transform: scale(1.5) skew(30deg);\n  -moz-transform: scale(1.5)\
    \ skew(30deg);\n  -o-transform: scale(1.5) skew(30deg);\n  transform: scale(1.5)\
    \ skew(30deg);\n  }\n```\n\n![The horizontal list of photos, where the center\
    \ photo has been distorted.](images/4-12.jpg)\n\nFIG 4.12: Skewing the photo 30\
    \ degrees on both the x and y axis.\n\nNow I realize that what we just did to\
    \ the photo is far from visually compelling, and admittedly, I don’t use `skew`\
    \ all that often; however, I’m convinced there are interesting uses for it.\n\n\
    For example, `skew` could be used on blocks of text to create three-dimensional\
    \ visuals—all with semantic markup and CSS3 (FIGS 4.13 and 4.14).\n\n![Screenshot\
    \ showing three cubes, each with text on the three visible sides.](images/4-13.jpg)\n\
    \nFIG 4.13: A demo by Paul Hayes using `skew` and transitions to create multiple\
    \ 3D cubes from simple chunks of hypertext ([http://www.fofronline.com/experiments/cube/multiCubes.html](http://www.fofronline.com/experiments/cube/multiCubes.html)).\n\
    \n![Screenshot showing a pseudo-three-dimensional grid with names and Twitter\
    \ avatars plotted on it.](images/4-14.jpg)\n\nFIG 4.14: The Web Trend Map uses\
    \ `skew` to place avatars on an isometric grid, creating unique data visualizations\
    \ from otherwise flat elements ([http://webtrendmap.com](http://webtrendmap.com)).\n\
    \n### The translate transform\n\nLastly, the `translate` transform allows you\
    \ to *move* an element from its normal position on screen, using x and y coordinates.\n\
    \nFor example, if we wanted to move an image in the photo gallery from its initial\
    \ position upon hover, we could do that with `translate`. And with our transition\
    \ in place, that movement will be smoothly animated.\n\nHere’s the syntax for\
    \ moving the image 20 pixels to the right and 40 pixels from the top of its original\
    \ location (FIG 4.15):\n\n```\nul.gallery li a:hover img {\n  -webkit-transform:\
    \ scale(1.5) translate(20px, 40px);\n  -moz-transform: scale(1.5) translate(20px,\
    \ 40px);\n  -o-transform: scale(1.5) translate(20px, 40px);\n  transform: scale(1.5)\
    \ translate(20px, 40px);\n  }\n```\n\n![The horizontal list of photos, with the\
    \ center photo hovered over and moved to the right and below it's default position.](images/4-15.jpg)\n\
    \nFIG 4.15: Using the `translate` transform to move the photo on `:hover`.\n\n\
    If we wanted to move the image to the left and/or top, we’d use negative values,\
    \ e.g., `translate(-20px, -40px)`.\n\nLike the aforementioned transforms, `translate`\
    \ doesn’t disturb the other elements in the document, moving it explicitly to\
    \ wherever you tell it to go. That means you don’t have to be concerned with margins,\
    \ padding, clearing floats, or absolute positioning. Give an element `translate`\
    \ coordinates and it’ll move it there.\n\n## Different transforms to help support\
    \ the story\n\nThe photo gallery example demonstrated how `scale`, `rotate`, `skew`,\
    \ and `translate` can work together with transitions to create richer experiences.\
    \ The key to using these transforms well is to find appropriate situations in\
    \ which they’ll assist in telling the story of what’s on screen.\n\nAgain, it’s\
    \ easy to get carried away with transforms, because, well, they’re fun and simple\
    \ to implement. But searching for the appropriate places in the experience layer\
    \ to enable them will make for a better end product.\n\n## Transforming the moon\n\
    \nLet’s return to the moon example site, where I’ve used various transforms and\
    \ transitions to help liven the experience on the slideshow gallery (FIG 4.16).\n\
    \n![Screenshot of the slideshow carousel of Things We Left on the Moon, showing\
    \ five rectangular images with arrows on either side.](images/4-16.jpg)\n\nFIG\
    \ 4.16: The slideshow carousel area of *Things We Left on the Moon*.\n\nWhen hovering\
    \ each of the items left on the moon, the image reacts in a different way, depending\
    \ on the nature of the item being featured, be it a doughnut, a lawnmower, a cat,\
    \ etc.\n"
