- fmt: "\nAreas like branding, usability, and layout are crucial to any website’s\
    \ success, and as such utilizing technology that’s not fully supported by all\
    \ browsers would be a risky venture there.\n\nFor example, in the evolving CSS3\
    \ spec there are multiple drafts for controlling layout—something we drastically\
    \ need. We’ve been bending the `float` property to handle layout for years now.\
    \ We’ve figured out how to get by with what we have, but a real layout engine\
    \ is absolutely a necessity.\n\nThat said, two of the three new CSS3 layout modules\
    \ have yet to be implemented by any browser. They’re still being worked out, and\
    \ arguably are still confusing, difficult to grasp, and likely not the final solution\
    \ we’ve been looking for. Most importantly, for something as important as layout,\
    \ CSS3 just isn’t the right tool. Yet.\n\nOn the opposite end of the spectrum\
    \ are non-critical events like interaction (hover, focus, form elements, browser\
    \ viewport flexibility), and visual enhancements that result from those interactions\
    \ (along with animation). It’s far less crucial to match an identical experience\
    \ between browsers for events like these, and that’s why it’s a perfect opportunity\
    \ to apply certain portions of CSS3 here for browsers that support them now.\n\
    \nIt’s atop these non-critical events where we’ll be applying CSS3 throughout\
    \ the book, keeping the more important characteristics of the page intact for\
    \ all browsers, regardless of their current CSS3 support.\n\nWhen we decide to\
    \ focus on and target these non-critical areas of the visual experience, it becomes\
    \ incredibly freeing to layer on CSS3 and enrich the interaction of a website\
    \ without worrying that the core message, layout, and accessibility will be hindered.\n\
    \n## Core CSS3 properties that are usable today\n\nSo, while we’ve pinpointed\
    \ the experience layer as a place we can safely apply CSS3 today, we’ll also want\
    \ to pinpoint which CSS3 properties we can use. That is, which portions of the\
    \ spec have a reached enough of a browser implementation tipping point to be practical\
    \ and usable right now.\n\nLarge chunks of CSS3 have not yet been implemented\
    \ in any browser. Things are still being worked out. We can be curious about those\
    \ chunks that are in flux, but we’re better off focusing our attention on what\
    \ actually works, and lucky for us there’s a fair amount now that does.\n\nLet’s\
    \ take a quick look at the relatively small set of core CSS3 properties that we’ll\
    \ be using in the examples in the book (below, and TABLE 1.02). I’m merely introducing\
    \ them here, as we’ll be digging much deeper into advanced syntax and real-world\
    \ usage later.\n\nTABLE 1.02: CSS3 properties and the browsers that support them.\n\
    \n| Property | Supported in |\n| --- | --- |\n| `border-radius` | ![webkit-icon](images/webkit-icon.png)\
    \ | ![chrome-icon](images/chrome-icon.png) | ![firefox-icon](images/firefox-icon.png)\
    \ | ![opera-icon](images/opera-icon.png) | ![ie-icon](images/ie-icon.png) |\n\
    |  | 3+ | 3+ | 1+ | 10.5+ | 9 beta |\n| `text-shadow` | ![webkit-icon](images/webkit-icon.png)\
    \ | ![chrome-icon](images/chrome-icon.png) | ![firefox-icon](images/firefox-icon.png)\
    \ | ![opera-icon](images/opera-icon.png) |  |\n|  | 1.1+ | 2+ | 3.1+ | 9.5+ |\
    \  |\n| `box-shadow` | ![webkit-icon](images/webkit-icon.png) | ![chrome-icon](images/chrome-icon.png)\
    \ | ![firefox-icon](images/firefox-icon.png) | ![opera-icon](images/opera-icon.png)\
    \ | ![ie-icon](images/ie-icon.png) |\n|  | 3+ | 3+ | 3.5+ | 10.5+ | 9 beta |\n\
    | Multiple background images | ![webkit-icon](images/webkit-icon.png) | ![chrome-icon](images/chrome-icon.png)\
    \ | ![firefox-icon](images/firefox-icon.png) | ![opera-icon](images/opera-icon.png)\
    \ | ![ie-icon](images/ie-icon.png) |\n|  | 1.3+ | 2+ | 3.6+ | 10.5+ | 9 beta |\n\
    | `opacity` | ![webkit-icon](images/webkit-icon.png) | ![chrome-icon](images/chrome-icon.png)\
    \ | ![firefox-icon](images/firefox-icon.png) | ![opera-icon](images/opera-icon.png)\
    \ | ![ie-icon](images/ie-icon.png) |\n|  | 1.2+ | 1+ | 1.5+ | 9+ | 9 beta |\n\
    | RGBA | ![webkit-icon](images/webkit-icon.png) | ![chrome-icon](images/chrome-icon.png)\
    \ | ![firefox-icon](images/firefox-icon.png) | ![opera-icon](images/opera-icon.png)\
    \ | ![ie-icon](images/ie-icon.png) |\n|  | 3.2+ | 3+ | 3+ | 10+ | 9 beta |\n\n\
    ### `border-radius`\n\nRounds the corners of an element with a specified radius\
    \ value. Supported in Safari 3+, Chrome 3+, Firefox 1+, Opera 10.5+, and IE9 Beta.\
    \ Example:\n\n```\n.foo {\n  border-radius: 10px;\n  }\n```\n\n### `text-shadow`\n\
    \nA CSS2 property (dropped in 2.1 then reintroduced in CSS3) that adds a shadow\
    \ to hypertext, with options for the direction, amount of blur, and color of the\
    \ shadow. Supported in Safari 1.1+, Chrome 2+, Firefox 3.1+, and Opera 9.5+. Example:\n\
    \n```\np {\n  text-shadow: 1px 1px 2px #999;\n  }\n```\n\n### `box-shadow`\n\n\
    Adds a shadow to an element. Identical syntax to `text-shadow`. Supported in Safari\
    \ 3+, Chrome 3+, Firefox 3.5+, Opera 10.5+, and IE9 Beta. Example:\n\n```\n.foo\
    \ {\n  box-shadow: 1px 1px 2px #999;\n  }\n```\n\n### Multiple background images\n\
    \nCSS3 adds the ability to apply multiple background images on an element (separated\
    \ with commas), as opposed to just one as defined in CSS2.1. Supported in Safari\
    \ 1.3+, Chrome 2+, Firefox 3.6+, Opera 10.5+, and IE9 Beta. Example:\n\n```\n\
    body {\n  background: url(image1.png) no-repeat top left,\n  url(image2.png) repeat-x\
    \ bottom left,\n  url(image3.png) repeat-y top right;\n  }\n```\n\n### `opacity`\n\
    \nDefines how opaque an element is. A value of 1 means completely opaque, while\
    \ a value of 0 means fully transparent. Supported in Safari 1.2+, Chrome 1+, Firefox\
    \ 1.5+, Opera 9+, and IE9 Beta. Example:\n\n```\n.foo {\n  opacity: 0.5; /* .foo\
    \ will be 50% transparent */\n  }\n```\n\n### RGBA\n\nNot a CSS property, but\
    \ rather a new *color model* introduced in CSS3, adding the ability to specify\
    \ a level of opacity along with an RGB color value. Supported in Safari 3.2+,\
    \ Chrome 3+, Firefox 3+, Opera 10+, and IE9 Beta. Example:\n\n```\n.foo {\n  color:\
    \ rgba(0, 0, 0, 0.75); /* black at 75% opacity */\n  }\n```\n\nNow that list is\
    \ far from exhaustive, of course. CSS3 contains many more properties and tools,\
    \ many of which are still being developed and are not yet implemented in any browser.\
    \ But you’ll notice that each property in the previous list has a reached a certain\
    \ threshold of browser support: it works in at least two of the major browsers.\
    \ And in some cases, support is promised in future versions of Internet Explorer\
    \ (and Opera).\n\nSo we now have a nice concise list of properties to play with,\
    \ based on their relatively decent support in Safari, Chrome, Firefox, and Opera.\
    \ They don’t work across the board yet, and we’ll be discussing why that’s OK,\
    \ and how to plan for that non-uniform support later in the book.\n\n### What\
    \ we aren’t going to cover\n\nI’ve listed the handful of CSS3 properties that\
    \ we’ll be using often in the book, but what about the rest? I’ve chosen not to\
    \ exhaustively cover everything here, but rather what’s practically usable right\
    \ now because it has decent, stable browser support.\n\nThere are also other portions\
    \ of the CSS3 spec that might be usable today, but are out of the scope of this\
    \ book (and might warrant a book entirely on their own):\n\n1.  Media Queries\
    \ ([http://www.w3.org/TR/CSS3-mediaqueries/](http://www.w3.org/TR/css3-mediaqueries/))\n\
    2.  Multi-Column Layout ([http://www.w3.org/TR/CSS3-multicol/](http://www.w3.org/TR/css3-multicol/))\n\
    3.  Web Fonts ([http://www.w3.org/TR/CSS3-webfonts/](http://www.w3.org/TR/css3-webfonts/))\n\
    \nBe sure to check out these other modules after you’ve finished reading this\
    \ book.\n\n## Vendor-specific prefixes\n"
  raw: "Areas like branding, usability, and layout are crucial to any website’s success,\
    \ and as such utilizing technology that’s not fully supported by all browsers\
    \ would be a risky venture there.\n\nFor example, in the evolving CSS3 spec there\
    \ are multiple drafts for controlling layout—something we drastically need. We’ve\
    \ been bending the `float` property to handle layout for years now. We’ve figured\
    \ out how to get by with what we have, but a real layout engine is absolutely\
    \ a necessity.\n\nThat said, two of the three new CSS3 layout modules have yet\
    \ to be implemented by any browser. They’re still being worked out, and arguably\
    \ are still confusing, difficult to grasp, and likely not the final solution we’ve\
    \ been looking for. Most importantly, for something as important as layout, CSS3\
    \ just isn’t the right tool. Yet.\n\nOn the opposite end of the spectrum are non-critical\
    \ events like interaction (hover, focus, form elements, browser viewport flexibility),\
    \ and visual enhancements that result from those interactions (along with animation).\
    \ It’s far less crucial to match an identical experience between browsers for\
    \ events like these, and that’s why it’s a perfect opportunity to apply certain\
    \ portions of CSS3 here for browsers that support them now.\n\nIt’s atop these\
    \ non-critical events where we’ll be applying CSS3 throughout the book, keeping\
    \ the more important characteristics of the page intact for all browsers, regardless\
    \ of their current CSS3 support.\n\nWhen we decide to focus on and target these\
    \ non-critical areas of the visual experience, it becomes incredibly freeing to\
    \ layer on CSS3 and enrich the interaction of a website without worrying that\
    \ the core message, layout, and accessibility will be hindered.\n\n## Core CSS3\
    \ properties that are usable today\n\nSo, while we’ve pinpointed the experience\
    \ layer as a place we can safely apply CSS3 today, we’ll also want to pinpoint\
    \ which CSS3 properties we can use. That is, which portions of the spec have a\
    \ reached enough of a browser implementation tipping point to be practical and\
    \ usable right now.\n\nLarge chunks of CSS3 have not yet been implemented in any\
    \ browser. Things are still being worked out. We can be curious about those chunks\
    \ that are in flux, but we’re better off focusing our attention on what actually\
    \ works, and lucky for us there’s a fair amount now that does.\n\nLet’s take a\
    \ quick look at the relatively small set of core CSS3 properties that we’ll be\
    \ using in the examples in the book (below, and TABLE 1.02). I’m merely introducing\
    \ them here, as we’ll be digging much deeper into advanced syntax and real-world\
    \ usage later.\n\nTABLE 1.02: CSS3 properties and the browsers that support them.\n\
