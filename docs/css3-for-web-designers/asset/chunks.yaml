    \ 背景处理，现在通过 `border-radius` 实现了圆角，在 Safari、Chrome、Firefox、Opera 以及 IE9 中都能看到。请记住，我们将不带前缀的\
    \ `border-radius` 属性放在列表的*最后*，确保最终实现会覆盖带浏览器前缀的版本。例如，Safari 5 现在同时支持*不带*前缀的 `border-radius`\
    \ 属性和 Safari 4 中支持的 `-webkit-border-radius`。\n\n![水平排列的导航链接，其中一个链接处于悬停状态，显示其下方有一个圆角的半透明白色背景。](img/3-14.jpg)\n\
    \n图 3.14：使用 `border-radius` 为背景添加圆角。\n\n你可能会想，为什么我要把 `border-radius` 规则放在 `#nav\
    \ li a` 声明中，而不是放在 `#nav li a:hover` 声明中（因为效果是在悬停时显现的）。答案在于我们接下来要添加的 CSS 过渡，作为最后的润色。\n\
    \n### 添加过渡效果\n\n最后，让我们运用在第 2 章中学到的知识，为导航链接的 `:hover` 和 `:focus` 状态添加过渡效果。这将平滑背景药丸形状的出现，使其在文本后方微妙地显现。过渡效果还会平滑文本颜色从半透明白色到全白色的变化（图\
    \ 3.15）。\n\n![动画过渡的几个步骤：从半透明文本且无背景，过渡到更亮的白色文本并带有圆角半透明白色背景。](img/3-15.jpg)\n\n\
    图 3.15：过渡生效时的缓入缓出效果。\n\n这里，我们将添加当前在 Safari、Chrome、Firefox（4.0）和 Opera 中有效的过渡堆栈，并将不带前缀的\
    \ `transition` 属性放在声明的最后，以便其他浏览器（或未来版本）最终实现。\n\n```\n#nav li a {\n  padding: 5px\
    \ 15px;\n  font-weight: bold;\n  color: #ccc;\n  color: rgba(255, 255, 255, 0.7);\n\
    \  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);\n  -webkit-border-radius: 14px;\n\
    \  -moz-border-radius: 14px;\n  border-radius: 14px;\n  -webkit-transition: all\
    \ 0.3s ease-in-out; \n  -moz-transition: all 0.3s ease-in-out;\n  -o-transition:\
    \ all 0.3s ease-in-out;\n  transition: all 0.3s ease-in-out; \n  }\n\n#nav li\
    \ a:hover,\n#nav li a:focus {\n  color: #fff;\n  background: rgba(255, 255, 255,\
    \ 0.15);\n  }\n```\n\n请记住，我们将过渡属性添加到要过渡的元素的正常状态。过渡之所以这样设计，是为了让过渡不仅在 `:hover` 时发生，也在\
    \ `:focus` 或 `:active` 状态时发生。\n\n我在过渡中使用了 `all` 值，以捕获 `:hover` 和 `:focus` 时变化的所有属性——本例中是\
    \ `color` 和 `background`。或者，我们也可以通过逗号分隔的列表显式列出每个属性来实现相同的过渡，如下所示：\n\n```\n-webkit-transition:\
    \ \n  color 0.3s ease-in-out, \n  background 0.3s ease-in-out;\n-moz-transition:\
    \ \n  color 0.3s ease-in-out, \n  background 0.3s ease-in-out;\n-o-transition:\
    \ \n  color 0.3s ease-in-out, \n  background 0.3s ease-in-out;\ntransition: \n\
    \  color .3s ease-in-out, \n  background .3s ease-in-out;\n```\n\n你可以很快看出，对于过渡元素上的多个变化，`all`\
    \ 值更加简洁高效。\n\n### 悬停体验的精细打磨\n\n我们刚刚经历了一个相当简单的例子，为体验层添加了各种 CSS3 属性。支持这些属性的浏览器会在带有文本阴影的文本链接后面平滑地显示一个半透明的圆角背景。不支持这些属性的浏览器则无法获得增强的悬停体验，但这完全没问题。它们得到的是一个语义化的水平链接列表——而这个基础才是最重要的。\n\
    \n我认为这个小练习也展示了实现以前需要 Flash 和/或 JavaScript 才能实现的效果是多么高效。我们使用的 CSS 规则简单直接，对于尚不支持它们的浏览器来说也无害。\n\
    \n我们还通过确保规范中的属性放在规则的最后，为我们的 CSS3 做好了未来兼容。用适当的浏览器特定前缀重复这些规则是必要的努力——但回报是丰厚的：*现在*就能使用\
    \ CSS3 来增强许多用户的体验。\n\n## 使用 opacity 实现简单灵活的悬停效果\n\n我们一直在寻找能够节省时间并提供额外灵活性的解决方案。这正是\
    \ CSS3 大量提供给我们的：用几行代码就能实现过去需要更多时间和资源来创建和维护的效果。\n\n悬停效果武器库中的另一个工具是 `opacity` 属性。正如第\
    \ 1 章中提到的，`opacity` 是一个 CSS3 属性，允许你指定给定元素的不透明度。与前面提到的 RGBA 结合使用，`opacity` 提供了另一种为网页设计添加透明度的方法。\n\
    \n我喜欢使用 `opacity` 的一种方式是为超链接图形创建简单灵活的悬停状态，利用透明度的变化从单个图像创建多个状态。再加上 CSS 过渡，你现在就能为页面上的链接图形提供丰富且易于维护的体验。\n\
    \n让我们看看在月球案例研究中是如何使用 `opacity` 属性的。\n\n### 可点击图片上的不透明度\n\n图 3.16 显示了月球示例网站的页脚，在一些法律声明和令人震惊的免责声明下方，有三个可点击的徽标。\n\
    \n![网站页脚的截图，文字为“这是一个虚构的案例研究，由马萨诸塞州塞勒姆的 SimpleBits 手工制作。我们并没有真的把那些东西留在月球上。版权所有\
    \ 2010。”下方有三个徽标：SimpleBits 徽标（一个带括号的方框）、RSS 徽标（圆圈中的无线电波）和比特怪兽（像素化的机器人角色）。](img/3-16.jpg)\n\
    \n图 3.16：*我们留在月球上的东西*的页脚。\n\n我们将使用 `opacity` 属性不仅控制 `:hover` 和 `:focus` 的处理，还设置*初始*透明度级别。而\
    \ CSS 过渡将平滑并动画化这一变化，以实现完整效果。\n\n### 标记\n\n与之前的顶部导航示例类似，这些页脚徽标的标记简单且语义化——只是一个超链接图片的无序列表：\n\
    \n```\n<ul id=\"footer-logos\">\n  <li><a href=\"#\"><img src=\"img/logo-sb.png\"\
    \  \n    alt=\"SimpleBits 徽标\" /></a>\n  </li>\n  <li><a href=\"#\"><img src=\"\
    img/icon-feed.png\" alt=\"RSS 订阅\" /></a>\n  </li>\n  <li><a href=\"#\"><img src=\"\
    img/icon-bitman.png\"  \n    alt=\"比特人\" /></a>\n  </li>\n</ul>\n```\n\n### 不透明度与图片效率\n\
    \n实际上，我将图标本身创建为全白的 PNG 图像，因为我知道之后可以使用 `opacity` 属性通过 CSS 调整透明度级别。这改变了我在某些情况下对\
    \ Web 项目图形资源的思考方式。\n\n我不再保存半透明的 PNG，而是保存完全不透明的版本（图 3.17），然后在浏览器中调整。这不仅节省了时间，还允许我们在\
    \ `:hover`、`:focus` 和 `:active` 状态下改变 `opacity` 级别，而无需创建多组图像。\n\n![三个徽标文件（比特怪兽、RSS\
    \ 符号和 SimpleBits 徽标）在 Photoshop 中显示在透明背景上。](img/3-17.jpg)\n\n图 3.17：徽标 PNG 创建为全白。\n\
    \n### 为列表添加样式\n\n"
- fmt: "\nThe first bits of style will center the images in the footer, and make them\
    \ horizontal instead of vertical (FIG 3.18).\n\n```\n#footer-logos {\n  text-align:\
    \ center;\n  }\n#footer-logos li {\n  display: inline;\n  }\n```\n\n![The footer\
    \ again, with the three logos shown fully white and centered in the footer.](images/3-18.jpg)\n\
    \nFIG 3.18: The white PNGs centered in the footer.\n\nNext, let’s add the `opacity`\
    \ values that will dim the icons in their default state, brightening them up a\
    \ bit when hovered or focused.\n\n```\n#footer-logos a img {\n  opacity: 0.25;\n\
    \  }\n\n#footer-logos a:hover img,\n#footer-logos a:focus img {\n  opacity: 0.6;\n\
    \  }\n```\n\nHere we’re showing the images at 25% opacity, then bringing them\
    \ up to 60% opacity when hovered or focused (FIG 3.19). Quite a simple thing,\
    \ isn’t it? And it requires only one set of images.\n\n![The footer again, with\
    \ the three logos in a semi-transparent white; the center logo is hovered over\
    \ and appears in a brighter white.](images/3-19.jpg)\n\nFIG 3.19: Showing the\
    \ `:hover` state of the icons in the footer by adjusting the `opacity`.\n\nNote\
    \ that the `opacity` property doesn’t require vendor prefixes, and will work in\
    \ Safari, Chrome, Firefox, and Opera. IE8 and below don’t support `opacity`, but\
    \ there *is* a hack-ish solution available for those who don’t mind treading into\
    \ propriety waters.\n\n### The IE opacity hack\n\nThankfully, `opacity` is now\
    \ supported in Internet Explorer 9 Beta, but we can also mimic the same result\
    \ for older versions of IE by using the proprietary Microsoft `filter` property.\n\
    \nNormally I wouldn’t suggest using `filter`, as (unlike vendor-prefixed properties)\
    \ it’s not part of any proposed standard. Also, use of the `filter` property can\
    \ bring increased performance overhead depending on where or how often it’s used.\
    \ It’s a hack—but it provides a means to an end.\n\nSo long as you understand\
    \ this, and perhaps quarantine the use of this property to its own stylesheet\
    \ or else carefully comment it, then it can be a viable method.\n\nHere’s how\
    \ it works:\n\n```\n#footer-logos a img {\n  border: none;\n  opacity: 0.25;\n\
    \  -ms-filter: \"progid:DXImageTransform.Microsoft.Alpha(Opacity=25)\"; /* IE\
    \ 8 hack */\n  filter: alpha(opacity = 25); /* IE 5-7 hack */ \n  }\n\n#footer-logos\
    \ a:hover img,\n#footer-logos a:focus img {\n  opacity: 0.6;\n  -ms-filter:\"\
    progid:DXImageTransform.Microsoft.Alpha(Opacity=60)\"; /* IE 8 hack */\n  filter:\
    \ alpha(opacity = 60); /* IE 5-7 hack */\n  }\n```\n\nThe syntax is similar, with\
    \ a value of opacity passed through IE’s alpha filter. Note that IE8 ignores the\
    \ `filter` property and requires the vendor-prefixed `-ms-filter` with some additional\
    \ (ugly) values.\n\nWith the hacks in place, you’ll now see the same results in\
    \ Internet Explorer (FIG 3.20). Again, use this sparingly, if at all. But the\
    \ reality is that you’ll likely need to use it should any of your sites have sizable\
    \ IE traffic stats (and most sites do).\n\n![The footer in IE7, with the centered\
    \ logo hovered over and appearing in brighter white.](images/3-20.jpg)\n\nFIG\
    \ 3.20: The footer in IE7, with the `filter` hack in place, mimicking the `opacity`\
    \ property.\n\n### Adding a transition\n\nLastly, adding a transition to the `opacity`\
    \ swap will smooth out that value change, and provide a bit of animated richness\
    \ that’ll tie this whole technique together.\n\nLet’s add our (now familiar) `transition`\
    \ stack to the declaration, this time transitioning the `opacity` property specifically.\
    \ We’ll make it rather quick (just 0.2 seconds) and ease it in and then out again.\n\
    \n```\n#footer-logos a img {\n  opacity: 0.25;\n  -ms-filter: \"progid:DXImageTransform.Microsoft.Alpha(Opacity=25)\"\
    ; /* IE 8 hack */ \n  filter: alpha(opacity = 25); /* IE 5-7 hack */\n  -webkit-transition:\
    \ opacity 0.2s ease-in-out; \n  -moz-transition: opacity 0.2s ease-in-out; \n\
    \  -o-transition: opacity 0.2s ease-in-out; \n  transition: opacity 0.2s ease-in-out;\
    \ \n  }\n\n#footer-logos a:hover img,\n#footer-logos a:focus img {\n  opacity:\
    \ 0.6;\n  -ms-filter: \"progid:DXImageTransform.Microsoft.Alpha(Opacity=60)\"\
    ; /* IE 8 hack */\n  filter: alpha(opacity = 60); /* IE 5-7 hack */ \n  }\n```\n\
    \nWith the transition in place, we now have a simple technique for using opacity\
    \ to craft a flexible hover experience using a single set of images.\n\n## Go\
    \ forth and hover-craft\n\nAs I mentioned before, this solution has affected the\
    \ way I think about creating the asset graphics for a design. We can use `opacity`\
    \ to control how the graphic appears by default, blending it into the background—then\
    \ applying a different value for `:hover`, `:focus`, and `:active` states, tying\
    \ it together with a transition for browsers that support it.\n\nKeep the `opacity`\
    \ property in mind next time you’re creating hover treatments for hyperlinked\
    \ images in your own designs. You’ll save time, bandwidth, and the unnecessary\
    \ complexity that other solutions might require.\n\nHover-crafting with CSS3 is\
    \ about quickly and efficiently adding simple styles that enrich the experience\
    \ layer, surprising and delighting users with the browsers that support those\
    \ properties now and into the future. If the browser doesn’t support the high-fidelity\
    \ experience you’ve created, that’s perfectly OK, as they won’t know what they’re\
    \ missing.\n\n![Chapter 4: Transforming the Message](images/chap-4.png)\n\nLike\
    \ CSS transitions, CSS transforms were also initially developed by the WebKit\
    \ team, then folded back into two separate Working Drafts at the W3C:\n\n1.  CSS\
    \ 2D Transforms ([http://www.w3.org/TR/CSS3-2d-transforms/](http://www.w3.org/TR/css3-2d-transforms/))\n\
    \n2.  CSS 3D Transforms ([http://www.w3.org/TR/CSS3-3d-transforms/](http://www.w3.org/TR/css3-3d-transforms/))\n\
    \nWe’re going to focus solely on 2D transforms in this book, as they’re the most\
    \ practical to use right now. An entire book could be filled with information\
    \ on 3D transforms alone, and they’re wonderfully magical. But 2D transforms have\
    \ the most traction in regards to browser support, including Safari 3.2, Chrome\
    \ 3.2, Firefox 4.0, and Opera 10.5 (just like transitions).\n\nSo just what are\
    \ CSS Transforms? The W3C describes them as:\n\n> CSS 2D Transforms allow elements\
    \ rendered by CSS to be transformed in two-dimensional space.^([9](#chapter4.html_footnote-9))\n\
    \nWell, that was helpful. The best way to understand transforms is to see them\
    \ in action.\n\nSo let’s first walk through a simple example applying various\
    \ 2D transforms on a small photo gallery. We’ll then use those same techniques\
    \ in practice on the moon example site later in the chapter.\n\n## The scale transform\n\
    \nConsider a horizontal list of three, subtly framed photos from a recent trip\
    \ to Martha’s Vineyard, a small island off the coast of Massachusetts (FIG 4.01).\
    \ This is a rather typical design pattern: a grid of linked images.\n\n![Three\
    \ photos, from left to right: of the water beneath the pier, of a beach scene,\
    \ and of shells on a bench. The photos are horizontal, set on a light gray background,\
    \ and have white borders around them.](images/4-01.jpg)\n\nFIG 4.01: A grid of\
    \ three hyperlinked photos.\n\nWe’re going to rely once again on our trusty unordered\
    \ list to mark these up:\n\n```\n<ul class=\"gallery\">\n  <li><a href=\"#\"><img\
    \ src=\"photo-1.jpg\" /></a></li>\n  <li><a href=\"#\"><img src=\"photo-2.jpg\"\
    \ /></a></li>\n  <li><a href=\"#\"><img src=\"photo-3.jpg\" /></a></li>\n</ul>\n\
    ```\n\nWith no style yet applied, FIGURE 4.02 shows how this list would appear\
    \ by default. Notice how the images are quite a bit larger than we’d like them\
    \ to be in the final design. This is intentional, as we’ll be using CSS to scale\
    \ them down.\n\n![The same three photos, in a vertical list with round bullets\
    \ to the left of each photo. The photos are a bit larger than in the previous\
    \ figure.](images/4-02.jpg)\n\nFIG 4.02: The list of large photos, before CSS\
    \ is applied.\n\n### Adding style\n\nLet’s add some CSS to make this vertical\
    \ list of photos a horizontal grid, with a one pixel border around each image\
    \ (also note the page background is a light gray `#eee`).\n"
