  trans: "\n品牌塑造、可用性和布局等领域对任何网站的成功都至关重要，因此，使用尚未被所有浏览器完全支持的技术会带来风险。\n\n例如，在不断发展的 CSS3\
    \ 规范中，有多个关于布局控制的草案——这正是我们迫切需要的。多年来，我们一直在借用 `float` 属性来处理布局。我们已经学会了如何利用现有手段勉强应付，但一个真正的布局引擎绝对是必需的。\n\
    \n话虽如此，CSS3 的三个新布局模块中有两个尚未被任何浏览器实现。它们仍在完善中，可以说仍然令人困惑、难以掌握，而且很可能不是我们一直在寻找的最终解决方案。最重要的是，对于布局这样重要的事情，CSS3\
    \ 目前还不是合适的工具。\n\n另一方面，非关键性事件（如交互：悬停、聚焦、表单元素、浏览器视口灵活性）以及由这些交互产生的视觉增强（包括动画）则不同。在这些事件上，让不同浏览器提供完全一致的体验远没有那么重要，因此这正是将\
    \ CSS3 的某些部分应用于当前支持它们的浏览器的绝佳机会。\n\n正是基于这些非关键性事件，我们将在本书中应用 CSS3，同时保持页面更重要的特性在所有浏览器中完好无损，无论它们当前对\
    \ CSS3 的支持程度如何。\n\n当我们决定聚焦并瞄准视觉体验中的这些非关键领域时，就可以非常自由地叠加 CSS3 并丰富网站的交互，而无需担心核心信息、布局和可访问性会受到影响。\n\
    \n## 当前可用的核心 CSS3 属性\n\n那么，虽然我们已经将体验层确定为当前可以安全应用 CSS3 的地方，但我们还需要确定可以使用哪些 CSS3\
    \ 属性。也就是说，规范的哪些部分已经达到了足够的浏览器实现临界点，从而可以实际使用。\n\nCSS3 的很大一部分尚未在任何浏览器中实现。许多内容仍在制定中。我们可以对那些仍在变化的部分保持好奇，但最好还是将注意力集中在实际可用的部分上，幸运的是，现在已经有相当多的部分是可用的。\n\
    \n让我们快速浏览一下本书示例中将使用的相对较小的核心 CSS3 属性集（如下所示，以及表 1.02）。这里只是简单介绍，稍后我们将深入探讨高级语法和实际用法。\n\
    \n表 1.02：CSS3 属性及其支持的浏览器\n\n| 属性 | 支持的浏览器 |\n| --- | --- |\n| `border-radius`\
    \ | ![webkit-icon](img/webkit-icon.png) | ![chrome-icon](img/chrome-icon.png)\
    \ | ![firefox-icon](img/firefox-icon.png) | ![opera-icon](img/opera-icon.png)\
    \ | ![ie-icon](img/ie-icon.png) |\n|  | 3+ | 3+ | 1+ | 10.5+ | 9 beta |\n| `text-shadow`\
    \ | ![webkit-icon](img/webkit-icon.png) | ![chrome-icon](img/chrome-icon.png)\
    \ | ![firefox-icon](img/firefox-icon.png) | ![opera-icon](img/opera-icon.png)\
    \ |  |\n|  | 1.1+ | 2+ | 3.1+ | 9.5+ |  |\n| `box-shadow` | ![webkit-icon](img/webkit-icon.png)\
    \ | ![chrome-icon](img/chrome-icon.png) | ![firefox-icon](img/firefox-icon.png)\
    \ | ![opera-icon](img/opera-icon.png) | ![ie-icon](img/ie-icon.png) |\n|  | 3+\
    \ | 3+ | 3.5+ | 10.5+ | 9 beta |\n| 多重背景图像 | ![webkit-icon](img/webkit-icon.png)\
    \ | ![chrome-icon](img/chrome-icon.png) | ![firefox-icon](img/firefox-icon.png)\
    \ | ![opera-icon](img/opera-icon.png) | ![ie-icon](img/ie-icon.png) |\n|  | 1.3+\
    \ | 2+ | 3.6+ | 10.5+ | 9 beta |\n| `opacity` | ![webkit-icon](img/webkit-icon.png)\
    \ | ![chrome-icon](img/chrome-icon.png) | ![firefox-icon](img/firefox-icon.png)\
    \ | ![opera-icon](img/opera-icon.png) | ![ie-icon](img/ie-icon.png) |\n|  | 1.2+\
    \ | 1+ | 1.5+ | 9+ | 9 beta |\n| RGBA | ![webkit-icon](img/webkit-icon.png) |\
    \ ![chrome-icon](img/chrome-icon.png) | ![firefox-icon](img/firefox-icon.png)\
    \ | ![opera-icon](img/opera-icon.png) | ![ie-icon](img/ie-icon.png) |\n|  | 3.2+\
    \ | 3+ | 3+ | 10+ | 9 beta |\n\n### `border-radius`\n\n用指定的半径值将元素的角变为圆角。支持 Safari\
    \ 3+、Chrome 3+、Firefox 1+、Opera 10.5+ 和 IE9 Beta。示例：\n\n```\n.foo {\n  border-radius:\
    \ 10px;\n  }\n```\n\n### `text-shadow`\n\n一个 CSS2 属性（在 2.1 中被移除，后在 CSS3 中重新引入），为超文本添加阴影，可设置阴影的方向、模糊程度和颜色。支持\
    \ Safari 1.1+、Chrome 2+、Firefox 3.1+ 和 Opera 9.5+。示例：\n\n```\np {\n  text-shadow:\
    \ 1px 1px 2px #999;\n  }\n```\n\n### `box-shadow`\n\n为元素添加阴影。语法与 `text-shadow`\
    \ 相同。支持 Safari 3+、Chrome 3+、Firefox 3.5+、Opera 10.5+ 和 IE9 Beta。示例：\n\n```\n.foo\
    \ {\n  box-shadow: 1px 1px 2px #999;\n  }\n```\n\n### 多重背景图像\n\nCSS3 增加了在元素上应用多个背景图像（用逗号分隔）的能力，而\
    \ CSS2.1 只允许一个。支持 Safari 1.3+、Chrome 2+、Firefox 3.6+、Opera 10.5+ 和 IE9 Beta。示例：\n\
    \n```\nbody {\n  background: url(image1.png) no-repeat top left,\n  url(image2.png)\
    \ repeat-x bottom left,\n  url(image3.png) repeat-y top right;\n  }\n```\n\n###\
    \ `opacity`\n\n定义元素的不透明度。值为 1 表示完全不透明，值为 0 表示完全透明。支持 Safari 1.2+、Chrome 1+、Firefox\
    \ 1.5+、Opera 9+ 和 IE9 Beta。示例：\n\n```\n.foo {\n  opacity: 0.5; /* .foo 将具有 50%\
    \ 的不透明度 */\n  }\n```\n\n### RGBA\n\n这不是一个 CSS 属性，而是 CSS3 中引入的一种新的*颜色模型*，允许在指定\
    \ RGB 颜色值的同时指定不透明度级别。支持 Safari 3.2+、Chrome 3+、Firefox 3+、Opera 10+ 和 IE9 Beta。示例：\n\
    \n```\n.foo {\n  color: rgba(0, 0, 0, 0.75); /* 黑色，75% 不透明度 */\n  }\n```\n\n当然，这个列表远非详尽。CSS3\
    \ 包含更多属性和工具，其中许多仍在开发中，尚未在任何浏览器中实现。但你会注意到，前面列表中的每个属性都达到了某种浏览器支持阈值：它至少在两个主流浏览器中可用。在某些情况下，未来版本的\
    \ Internet Explorer（和 Opera）也承诺支持。\n\n因此，我们现在有了一份简洁且可用的属性列表，它们基于在 Safari、Chrome、Firefox\
    \ 和 Opera 中相对较好的支持。它们尚未在所有浏览器中通用，我们将在本书后面讨论为什么这没问题，以及如何为这种不统一的支持做好规划。\n\n### 我们不会涉及的内容\n\
    \n我列出了本书中经常使用的少数 CSS3 属性，但其他属性呢？我选择不在这里详尽地涵盖所有内容，而是只关注当前实际可用的部分，因为它们具有良好且稳定的浏览器支持。\n\
    \nCSS3 规范中还有其他部分可能现在就可以使用，但超出了本书的范围（并且可能值得单独成书）：\n\n1.  媒体查询（[`www.w3.org/TR/CSS3-mediaqueries/`](http://www.w3.org/TR/css3-mediaqueries/)）\n\
    2.  多列布局（[`www.w3.org/TR/CSS3-multicol/`](http://www.w3.org/TR/css3-multicol/)）\n\
    3.  网络字体（[`www.w3.org/TR/CSS3-webfonts/`](http://www.w3.org/TR/css3-webfonts/)）\n\
    \n读完本书后，请务必查看这些其他模块。\n\n## 厂商特定前缀\n\n"
- fmt: "\nI mentioned earlier that the CSS3 specification is a series of modules that\
    \ are being slowly rolled out by browser vendors. In some cases this rolling out\
    \ involves experimental support. That is, while the spec is being written, debated,\
    \ and hashed out at the W3C, a browser maker might choose to add support for certain\
    \ properties anyway, testing it in a real-world environment. It’s become a healthy\
    \ part of the process, where feedback from experimental usage is often used to\
    \ make adjustments to the spec.\n\nAlternatively, a browser vendor might want\
    \ to introduce an experimental property that’s not part of any proposed standard,\
    \ but may become one at a later date.\n\nOften this experimental support for CSS\
    \ properties is handled by the use of a *vendor prefix* like so:\n\n```\n-webkit-border-radius\n\
    ```\n\nThis dash-prefixed keyword attached to the beginning of the property name\
    \ flags it as a work-in-progress, specific to the browser’s implementation and\
    \ interpretation of the evolving spec. If and when the experiment becomes part\
    \ of a finished CSS3 module, the browser should support the non-prefixed property\
    \ name going forward.\n\nEach browser vendor has their own prefix, essentially\
    \ namespacing their experimental properties. Other browsers will ignore rules\
    \ containing prefixes they don’t recognize.\n\nTABLE 1.03 shows the most widely-used\
    \ vendors and their associated prefixes, and we’ll be using the WebKit, Mozilla,\
    \ and Opera prefixes as they pertain to CSS3 in the examples in the chapters ahead.\n\
    \nTABLE 1.03: The most widely-used vendors and their associated prefixes.\n\n\
    | ![webkit-icon](images/webkit-icon.png) | WebKit | `–webkit–` |\n| ![firefox-icon](images/firefox-icon.png)\
    \ | Mozilla | `–moz–` |\n| ![opera-icon](images/opera-icon.png) | Opera | `–o–`\
    \ |\n| ![konqueror-icon](images/konqueror-icon.png) | Konqueror | `–khtml–` |\n\
    | ![ie-icon](images/ie-icon.png) | Microsoft | `–ms–` |\n| ![chrome-icon](images/chrome-icon.png)\
    \ | Chrome | `–chrome–` |\n\n### How vendor prefixes work\n\nHere’s how vendor-prefixed\
    \ CSS works in practice; we’ll use the `border-radius` property as an example.\
    \ Say we wanted to round the corners of an element with a radius of 10 pixels;\
    \ here’s how we’d do it:\n\n```\n.foo {\n  -webkit-border-radius: 10px;\n  -moz-border-radius:\
    \ 10px;\n  border-radius: 10px;\n  }\n```\n\nWebKit (the engine behind Safari,\
    \ mobile Safari, and Chrome) and Gecko (the engine behind Firefox) browsers each\
    \ support the `border-radius` property by way of their own vendor-prefixed versions,\
    \ while Opera supports the property without a vendor prefix. IE9 will also support\
    \ `border-radius` without a vendor prefix.\n\n### Optimal ordering\n\nWhen using\
    \ vendor prefixes, it’s important to keep in mind the order in which you list\
    \ rules in your declarations. You’ll notice in the above example that we listed\
    \ the vendor-prefixed property first, followed by the non-prefixed CSS3 property.\n\
    \nWhy put the actual CSS3 property last? Because your styles will likely work\
    \ in more browsers in the future, progressively enhancing your designs going forward.\
    \ And when a browser finally implements support for the property as defined in\
    \ the specification, that real property will trump the experimental version since\
    \ it comes last in the list. Should the implementation for the vendor-specific\
    \ version differ from the real property, you’re ensuring that the final standard\
    \ reigns supreme.\n\n### Don’t be afraid of vendor prefixes!\n\nYour initial reaction\
    \ might be one of, “Blech, this is messy, proprietary stuff!” But I assure you,\
    \ not only is it a way forward, it’s much less messy than the code bloat and inflexibility\
    \ that often come along with *non*-CSS3 solutions, and an important part of the\
    \ evolution of the specification as well.\n\nBy using these properties now via\
    \ vendor prefixes, we can test the waters, even giving valuable feedback to browser\
    \ makers before the spec is final. Remember, too, that the prefixes are usually\
    \ attached to *proposed standards*. That’s a big difference from other hackish\
    \ CSS we’ve all periodically used to solve cross-browser issues.\n\nSome might\
    \ compare vendor prefixes to the syntax exploits many of us have used to target\
    \ specific browser versions (for example, using `w\\idth: 200px` or `_width: 200px`\
    \ to target specific versions of IE). But rather, vendor prefixes are *an important\
    \ part of the standards process*, allowing the evolution of a property in a real-world\
    \ implementation.\n\nAs CSS expert Eric Meyer explains in “Prefix or Posthack”\
    \ on A List Apart ([http://bkaprt.com/css3/2/](http://bkaprt.com/css3/2/)):^([3](#chapter1.html_footnote-3))\n\
    \n> Prefixes give us control of our hacking destiny. In the past, we had to invent\
    \ a bunch of parser exploits just to get inconsistent implementations to act the\
    \ same once we found out they were inconsistent. It was a wholly reactive approach.\
    \ Prefixes are a proactive approach.\n\nHe goes on to suggest that vendor prefixing\
    \ is not only positive, but should be made more central to the standards process,\
    \ and would:\n\n> … force the vendors and the Working Group to work together to\
    \ devise the tests necessary to determine interoperability. Those tests can then\
    \ guide those who follow, helping them to achieve interoperable status much faster.\
    \ They could literally ship the prefixed implementation in one public beta and\
    \ drop the prefix in the next.\n\nSo, don’t fret over vendor prefixes. Use them\
    \ knowing you’re a part of a process that allows you to get work done today, and\
    \ paves the way toward a future when prefixes can be dropped.\n\n### What about\
    \ all that repetition?\n\nYou might think it’s silly to have to repeat what seems\
    \ like the same property three or four times for each vendor, and I might agree\
    \ with you.\n\nBut the reality is that non-CSS3 solutions would likely require\
    \ inflexible and more complex code, albeit perhaps non-repetitive.\n\nWe won’t\
    \ need to repeat ourselves forever. For now, it’s a necessary but temporary step\
    \ to keep potentially varying implementations between browsers separate from the\
    \ final spec implementation.\n\nBefore we start doing compelling things with the\
    \ handful of usable CSS3 properties and their respective vendor prefixes, let’s\
    \ get a basic grasp on CSS transitions. Understanding transitions and how they\
    \ operate will help us combine them with other properties to create wonderful\
    \ experiences.\n\n1\\. The long URL: [http://www.alistapart.com/articles/tohell/](http://www.alistapart.com/articles/tohell/)\
    \ [[↵]](#chapter1.html_footnote-1-backlink)\n\n2\\. [http://www.w3.org/TR/css3-roadmap/#whymods](http://www.w3.org/TR/css3-roadmap/#whymods)\
    \ [[↵]](#chapter1.html_footnote-2-backlink)\n\n3\\. [http://www.alistapart.com/articles/prefix-or-posthack/](http://www.alistapart.com/articles/prefix-or-posthack/)\
    \ [[↵]](#chapter1.html_footnote-3-backlink)\n\n![Chapter 2: Understanding CSS\
    \ Transitions](images/chap-2.png)\n\nIt was 1997 and I was sitting in a terribly\
    \ run-down apartment in beautiful Allston, Massachusetts. A typical late night\
    \ of viewing source and teaching myself HTML followed a day of packing CDs at\
    \ a local record label for peanuts (hence the run-down apartment). I’m sure you\
    \ can relate.\n\nOne triumphant night, I pumped my fist in sweet victory. I’d\
    \ just successfully coded my first JavaScript image rollover. Remember those?\n\
    \nI still remember the amazement of seeing a crudely designed button graphic I’d\
    \ cobbled together “swap” to a different one when hovered over by the mouse. I\
    \ barely had a clue as to what I was doing at the time, but making something on\
    \ the page successfully change, *dynamically*, was, well … magical.\n\nWe’ve come\
    \ a *long* way over the past decade in regard to interaction and visual experience\
    \ on the web. Historically, technologies like Flash and JavaScript have enabled\
    \ animation, movement, and interaction effects. But recently, with browsers rolling\
    \ out support for CSS transitions and transforms, some of that animation and experience\
    \ enrichment can now be comfortably moved to our stylesheets.\n"
