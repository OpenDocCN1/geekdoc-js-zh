  trans: "\n\n或者，我们可以为列表项添加不同的 `rotate` 变换，让照片（和相框）看起来像是被随意扔在桌子上。然后我们还可以在 `:hover`\
    \ 时应用 `rotate` 和 `scale`（图 4.06）。\n\n![三张照片都旋转了；左边那张向左旋转了几度，中间那张向右旋转了几度，右边那张则更大幅度地向左旋转。右边那张照片显示为悬停状态，被放大并带有下方的阴影。](img/4-06.jpg)\n\
    \n图 4.06：使用 `rotate` 让照片看起来散落在页面上。\n\n在这本小册子中，我一直在强调，添加 CSS3 最合适的地方是体验层——但这并不意味着你不能在设计的默认视图中使用这些技术，前提是它们不是关键性的，并且降级效果良好。\n\
    \n例如，如果浏览器不支持 `rotate` 变换，照片完全保持笔直，那也没问题。不会出现任何看起来损坏的情况。\n\n### 没有旋转？别慌\n\n在页面主要设计中运用\
    \ `rotate` 的一个好例子是 Panic Software 的博客（[`www.panic.com/blog`](http://www.panic.com/blog)），他们通过\
    \ CSS3 使用了*非常*微妙的旋转，让条目向左倾斜，仿佛它们是留在桌子上的纸张（图 4.07）。这对设计来说并非关键，如果条目没有旋转而是笔直的（图 4.08），也完全没问题。\n\
    \n![Panic Software 博客的截图，显示一篇设计成索引卡样式的文章，并稍微向左旋转。](img/4-07.jpg)\n\n图 4.07：Panic\
    \ Software 的博客设计通过 CSS3 使用微妙的旋转来增加真实感。\n\n![Panic Software 博客的截图，显示一篇设计成索引卡样式的文章，但没有微妙的旋转。](img/4-08.jpg)\n\
    \n图 4.08：没有旋转，博客看起来依然很棒。没有任何缺失或损坏的迹象。\n\n### 旋转太阳\n\n另一个*恰当*使用 CSS 变换的好例子是 Outside\
    \ 网站（[`outsideapp.com`](http://outsideapp.com)），这是一款适用于 iPhone 的出色天气应用（图 4.09）。\n\
    \n![Outside 应用网站的截图，右上角显示一个带有强烈太阳光线的太阳图形。](img/4-09.jpg)\n\n图 4.09：Outside iPhone\
    \ 应用在太阳图形上使用了旋转。\n\n页面顶部有一个太阳图形（图 4.10），通过 `rotate` 变换实现 360° 旋转。（在这个例子中，非 WebKit\
    \ 浏览器使用 JavaScript 来驱动旋转动画，但我们将在第 6 章中讨论纯 CSS 动画）。这种微妙的体验增强简单而恰当，因为它模仿了 iPhone\
    \ 应用本身出现的动态阳光。在不支持 CSS 变换的浏览器中，太阳不会旋转，这完全没问题。在非动画版本的网站中，没有任何东西看起来损坏或缺失。\n\n![太阳图形及其周围延伸的太阳光线的截图。](img/4-10.jpg)\n\
    \n图 4.10：Outside 应用的太阳图形在通过 CSS 定位和旋转后变得生动起来。\n\nCSS 中的变换与过渡相结合，有助于支持我们为网络设计中的整体信息传达，这对我们网页设计师来说是一个极好的赋能工具。\n\
    \n### 倾斜变换\n\n`skew` 变换接受 x 和 y 坐标，并对元素进行倾斜。例如，如果我们想在悬停时倾斜图库中的照片，可以使用以下 CSS（在\
    \ x 坐标上倾斜负 5 度，在 y 坐标上倾斜 30 度）（图 4.11）：\n\n```\nul.gallery li a:hover img {\n\
    \  -webkit-transform: scale(1.5) skew(-5deg, 30deg);\n  -moz-transform: scale(1.5)\
    \ skew(-5deg, 30deg);\n  -o-transform: scale(1.5) skew(-5deg, 30deg);\n  transform:\
    \ scale(1.5) skew(-5deg, 30deg);\n  }\n```\n\n![水平排列的照片列表，中间的照片发生了变形。](img/4-11.jpg)\n\
    \n图 4.11：使用 `skew` 变换使照片变形。\n\n与 `rotate` 类似，`skew` 接受正负角度值。你也可以只使用一个值同时应用于 x\
    \ 和 y 轴，如下所示（图 4.12）：\n\n```\nul.gallery li a:hover img {\n  -webkit-transform:\
    \ scale(1.5) skew(30deg);\n  -moz-transform: scale(1.5) skew(30deg);\n  -o-transform:\
    \ scale(1.5) skew(30deg);\n  transform: scale(1.5) skew(30deg);\n  }\n```\n\n\
    ![水平排列的照片列表，中间的照片发生了变形。](img/4-12.jpg)\n\n图 4.12：在 x 轴和 y 轴上同时倾斜照片 30 度。\n\n现在我意识到，我们对照片所做的这些操作远非视觉上引人入胜，而且坦白说，我并不经常使用\
    \ `skew`；不过，我相信它有一些有趣的用途。\n\n例如，`skew` 可以用于文本块来创建三维视觉效果——全部使用语义化标记和 CSS3（图 4.13\
    \ 和 4.14）。\n\n![截图显示三个立方体，每个立方体的三个可见面上都有文字。](img/4-13.jpg)\n\n图 4.13：Paul Hayes\
    \ 的一个演示，使用 `skew` 和过渡从简单的超文本块创建多个 3D 立方体（[`www.fofronline.com/experiments/cube/multiCubes.html`](http://www.fofronline.com/experiments/cube/multiCubes.html)）。\n\
    \n![截图显示一个伪三维网格，上面标有名字和 Twitter 头像。](img/4-14.jpg)\n\n图 4.14：Web Trend Map 使用\
    \ `skew` 将头像放置在等距网格上，从原本平面的元素中创建出独特的数据可视化效果（[`webtrendmap.com`](http://webtrendmap.com)）。\n\
    \n### 平移变换\n\n最后，`translate` 变换允许你使用 x 和 y 坐标将元素从屏幕上的正常位置*移动*。\n\n例如，如果我们想在悬停时将照片图库中的图像从其初始位置移开，可以使用\
    \ `translate`。配合我们已有的过渡，这种移动将被平滑地动画化。\n\n以下是将图像从其原始位置向右移动 20 像素、向下移动 40 像素的语法（图\
    \ 4.15）：\n\n```\nul.gallery li a:hover img {\n  -webkit-transform: scale(1.5)\
    \ translate(20px, 40px);\n  -moz-transform: scale(1.5) translate(20px, 40px);\n\
    \  -o-transform: scale(1.5) translate(20px, 40px);\n  transform: scale(1.5) translate(20px,\
    \ 40px);\n  }\n```\n\n![水平排列的照片列表，中间的照片被悬停并向右下方移动。](img/4-15.jpg)\n\n图 4.15：使用\
    \ `translate` 变换在 `:hover` 时移动照片。\n\n如果我们想将图像向左和/或向上移动，可以使用负值，例如 `translate(-20px,\
    \ -40px)`。\n\n与前面提到的变换一样，`translate` 不会干扰文档中的其他元素，它会明确地将元素移动到指定的位置。这意味着你无需担心外边距、内边距、清除浮动或绝对定位。给元素一个\
    \ `translate` 坐标，它就会移动到那里。\n\n## 不同的变换有助于支持叙事\n\n照片图库的例子展示了 `scale`、`rotate`、`skew`\
    \ 和 `translate` 如何与过渡协同工作，以创造更丰富的体验。善用这些变换的关键在于找到合适的情境，让它们有助于讲述屏幕上内容的故事。\n\n再次强调，很容易过度使用变换，因为它们实现起来既有趣又简单。但在体验层中寻找合适的位置来启用它们，将带来更好的最终产品。\n\
    \n## 变换月亮\n\n让我们回到月亮示例网站，我在其中使用了各种变换和过渡来让幻灯片图库的体验更加生动（图 4.16）。\n\n![“我们留在月球上的东西”幻灯片轮播截图，显示五张矩形图片，两侧有箭头。](img/4-16.jpg)\n\
    \n图 4.16：“我们留在月球上的东西”的幻灯片轮播区域。\n\n当悬停在月球上留下的每个物品时，图像会根据该物品的特性（无论是甜甜圈、割草机、猫等）以不同的方式做出反应。\n\
    \n"
- fmt: "\nAdding an appropriate transform/transition to each of the items is not only\
    \ fun and easy to implement, it’s also harmless for browsers that don’t yet support\
    \ the bits of CSS3 that make the interaction possible.\n\nLet’s go through each\
    \ item one by one to see how `scale`, `rotate`, positioning, and `opacity` can\
    \ be combined with transitions to complete the experience.\n\n### Supporting the\
    \ message\n\nIf we think about each of the linked items, and specifically about\
    \ their *meaning*, we can then apply a transform and/or transition that supports\
    \ the story of the object at hand.\n\nHow would a big doughnut or reclining chair\
    \ react to interaction? We can choose to apply the appropriate CSS3 here to help\
    \ enrich the experience (FIG 4.17).\n\n![The five things from the carousel, on\
    \ a moon background: a big doughnut, a lawnmower, a cat with an astronaut's helmet\
    \ (&quot;astro cat&quot;), a plushy reclining chair, and a lawn gnome. All the\
    \ images are placed on a moon background.](images/4-17.jpg)\n\nFIG 4.17: The things\
    \ we’ll be transforming.\n\n### The markup\n\nTo mark up this faux carousel of\
    \ wacky things, the semantics are quite simple: just an ordered list of linked\
    \ images, with a heading underneath to describe what each item is.\n\n```\n<ol\
    \ id=\"things\">\n  <li id=\"things-1\">\n    <a href=\"#\"><img src=\"img/doughnut.png\"\
    \ /></a>\n    <h2>1 big doughnut</h2>\n  </li>\n  <li id=\"things-2\">\n    <a\
    \ href=\"#\"><img src=\"img/mower.png\" /></a>\n    <h2>1 lawnmower</h2>\n  </li>\n\
    \  <li id=\"things-3\">\n    <a href=\"#\"><img src=\"img/cat.png\" /></a>\n \
    \   <h2>1 astro cat</h2>\n  </li>\n  <li id=\"things-4\">\n    <a href=\"#\"><img\
    \ src=\"img/recliner.png\" /></a>\n    <h2>1 recliner</h2>\n  </li>\n  <li id=\"\
    things-5\">\n    <a href=\"#\"><img src=\"img/gnome.png\" /></a>\n    <h2>1 magic\
    \ gnome</h2>\n  </li>\n</ol>\n```\n\nNotice we’ve added an `id` of `#things` to\
    \ the list itself, and then an `id` for each list item as well, so that we can\
    \ add unique interactions to the `:hover` state of each item.\n\n### Base styles\
    \ for each item\n\nNext we’ll add the base CSS for each list item that contains\
    \ the linked images. The following styles float the items to make them horizontal,\
    \ set relative positioning for the context in which we will later absolutely position\
    \ each image, and finally, add a rounded, semi-transparent background frame.\n\
    \n```\nol#things li {\n  position: relative;\n  float: left;\n  margin: 0 15px\
    \ 0 0;\n  padding: 10px;\n  background: #444; /* backup for non-RGBA */\n  background:\
    \ rgba(255, 255, 255, 0.1);\n  list-style: none;\n  -webkit-border-radius: 4px;\n\
    \  -moz-border-radius: 4px;\n  -o-border-radius: 4px;\n  border-radius: 4px;\n\
    \  }\n```\n\nWe’ll now set the moon background image that appears behind each\
    \ item, as well as giving each link a specific `width` and `height` (FIG 4.18).\n\
    \n```\nol#things li a {\n  float: left;\n  width: 137px;\n  height: 91px;\n  background:\
    \ url(../img/moon-137.jpg) no-repeat top left;\n  }\n```\n\n![close-up of the\
    \ first image spot in the carousel, showing the label &quot;1 Big Doughnut&quot;\
    \ and a moon background.](images/4-18.jpg)\n\nFIG 4.18: The list items, now with\
    \ the moon background image.\n\n### Catch-all declaration\n\nOur next step is\
    \ to create a catch-all declaration that will absolutely position each image within\
    \ the list item’s frame and therefore on top of the moon background image.\n\n\
    We’ll be positioning each item slightly differently depending on the object, as\
    \ well as using varying transforms, but we can declare `position: absolute;` here\
    \ for *all* images so we don’t have to duplicate that rule for each item. We’ll\
    \ also add a transition stack using the `all` value. That way, any transform or\
    \ change we wish to make on each thing will be transitioned and smoothed out,\
    \ regardless of which CSS properties we decide to change.\n\n```\nol#things li\
    \ a img {\n  position: absolute;\n  -webkit-transition: all 0.2s ease-in;\n  -moz-transition:\
    \ all 0.2s ease-in;\n  -o-transition: all 0.2s ease-in;\n  transition: all 0.2s\
    \ ease-in;\n  }\n```\n\nNow we’re ready to add exact positioning and width for\
    \ each image, taking advantage of those `id`s we added to each list item.\n\n\
    ```\nol#things li#things-1 a img { \n  width: 60px;\n  top: 23px;\n  left: 26px;\n\
    \  }\n\nol#things li#things-2 a img { \n  width: 50px;\n  top: 20px;\n  left:\
    \ 50px;\n  }\n\nol#things li#things-3 a img { \n  width: 80px;\n  top: 19px;\n\
    \  left: 30px;\n  }\n\nol#things li#things-4 a img { \n  width: 70px;\n  top:\
    \ 25px;\n  left: 45px;\n  }\n\nol#things li#things-5 a img { \n  width: 80px;\n\
    \  top: 20px;\n  left: 34px;\n  }\n```\n\nI’ve created these images on the large\
    \ side, so that if we wish to scale them up, we can do so without stretching the\
    \ image beyond its native dimensions.\n\nNow we’ll add a unique `:hover` treatment\
    \ to each item, knowing that the catch-all transition will smooth out and animate\
    \ whatever we fold in.\n\n### Scaling the big doughnut\n\nThe big doughnut gets\
    \ bigger on hover, so we’ll use the `scale` transform here to scale up the image.\
    \ Remember that the original image in the markup is quite a bit bigger than what\
    \ we sized down to in the stylesheet. This was intentional, so we could scale\
    \ it up like this.\n\n```\nol#things li#things-1 a:hover img {\n  -webkit-transform:\
    \ scale(1.25);\n  -moz-transform: scale(1.25);\n  -o-transform: scale(1.25);\n\
    \  transform: scale(1.25);\n  }\n```\n\nThese rules will scale the doughnut up\
    \ by 25% on hover. FIGURE 4.19 shows the normal and hover states, with the doughnut\
    \ getting a little bigger when moused over.\n\n![The big doughnut image before\
    \ and after hover; on hover, the doughnut gets larger.](images/4-19.jpg)\n\nFIG\
    \ 4.19: The big doughnut gets bigger on `:hover` using `scale`.\n\n### Perspective\
    \ with scale and position\n\nFor the lawnmower left on the moon, we’ll do two\
    \ things:\n\n1.  Scale it larger with a transform.\n\n2.  Move it down and to\
    \ the right.\n\nThese two changes plus the transition make the mower appear like\
    \ it’s coming at you (lookout!). It’s very subtle, but simple and effective.\n\
    \nWe’ll adjust the default position five pixels lower and 10 pixels to the right.\
    \ And we’ll also add a transform stack to scale the mower 20% larger than the\
    \ default.\n\n```\nol#things li#things-2 a:hover img {\n  top: 25px;\n  left:\
    \ 60px;\n  -webkit-transform: scale(1.2);\n  -moz-transform: scale(1.2);\n  -o-transform:\
    \ scale(1.2);\n  transform: scale(1.2);\n  }\n```\n\nFIGURE 4.20 shows the default\
    \ and hovered state, and the illusion of a mower coming at you is complete.\n\n\
    ![The lawnmower before and after hover; on hover, it moves forward and gets larger.](images/4-20.jpg)\n\
    \nFIG 4.20: The lawnmower uses position and `scale` to create a pseudo three-dimensional\
    \ effect.\n\n### The elusive astro cat\n\nWe can add CSS transitions on a whole\
    \ host of properties (not just CSS3 ones); simply smoothing out a *position* change\
    \ can make the astro cat appear as though it’s avoiding the mouse.\n\nBy adjusting\
    \ the `left` position of the image on hover, the catch-all transition will smooth\
    \ that movement out, making the astro cat appear like it’s sliding back and forth.\n\
    \nHere we’ll move the cat 15 pixels to the right by upping the `left` value from\
    \ `30px` to `45px` (FIG 4.21):\n\n```\nol#things li#things-3 a:hover img {\n \
    \ left: 45px;\n  }\n```\n\n![The cat before and after hover; on hover, the cat\
    \ slides to the right.](images/4-21.jpg)\n\nFIG 4.21: The cat slides back and\
    \ forth, as cats often do.\n\nPretty simple. And it’s really the CSS transition\
    \ that’s doing the magic here.\n\n### Tipping back the recliner\n\nA good recliner\
    \ tips back, and we can mimic that real-world reaction with the aforementioned\
    \ `rotate` transform.\n\nLet’s add the transform stack to rotate the recliner\
    \ slightly, to the left. We’ll use the vendor-prefixed rules for WebKit, Mozilla,\
    \ and Opera-based browsers, as well as ending with the actual `transform` property\
    \ for future implementations.\n\n```\nol#things li#things-4 a:hover img {\n  -webkit-transform:\
    \ rotate(-15deg);\n  -moz-transform: rotate(-15deg);\n  -o-transform: rotate(-15deg);\n\
    \  transform: rotate(-15deg);\n  }\n```\n"
  raw: "Adding an appropriate transform/transition to each of the items is not only\
    \ fun and easy to implement, it’s also harmless for browsers that don’t yet support\
    \ the bits of CSS3 that make the interaction possible.\n\nLet’s go through each\
    \ item one by one to see how `scale`, `rotate`, positioning, and `opacity` can\
    \ be combined with transitions to complete the experience.\n\n### Supporting the\
    \ message\n\nIf we think about each of the linked items, and specifically about\
    \ their *meaning*, we can then apply a transform and/or transition that supports\
    \ the story of the object at hand.\n\nHow would a big doughnut or reclining chair\
    \ react to interaction? We can choose to apply the appropriate CSS3 here to help\
    \ enrich the experience (FIG 4.17).\n\n![The five things from the carousel, on\
    \ a moon background: a big doughnut, a lawnmower, a cat with an astronaut's helmet\
    \ (&quot;astro cat&quot;), a plushy reclining chair, and a lawn gnome. All the\
    \ images are placed on a moon background.](images/4-17.jpg)\n\nFIG 4.17: The things\
    \ we’ll be transforming.\n\n### The markup\n\nTo mark up this faux carousel of\
    \ wacky things, the semantics are quite simple: just an ordered list of linked\
    \ images, with a heading underneath to describe what each item is.\n\n```\n<ol\
    \ id=\"things\">\n  <li id=\"things-1\">\n    <a href=\"#\"><img src=\"img/doughnut.png\"\
    \ /></a>\n    <h2>1 big doughnut</h2>\n  </li>\n  <li id=\"things-2\">\n    <a\
    \ href=\"#\"><img src=\"img/mower.png\" /></a>\n    <h2>1 lawnmower</h2>\n  </li>\n\
    \  <li id=\"things-3\">\n    <a href=\"#\"><img src=\"img/cat.png\" /></a>\n \
    \   <h2>1 astro cat</h2>\n  </li>\n  <li id=\"things-4\">\n    <a href=\"#\"><img\
    \ src=\"img/recliner.png\" /></a>\n    <h2>1 recliner</h2>\n  </li>\n  <li id=\"\
    things-5\">\n    <a href=\"#\"><img src=\"img/gnome.png\" /></a>\n    <h2>1 magic\
    \ gnome</h2>\n  </li>\n</ol>\n```\n\nNotice we’ve added an `id` of `#things` to\
    \ the list itself, and then an `id` for each list item as well, so that we can\
    \ add unique interactions to the `:hover` state of each item.\n\n### Base styles\
    \ for each item\n\nNext we’ll add the base CSS for each list item that contains\
    \ the linked images. The following styles float the items to make them horizontal,\
    \ set relative positioning for the context in which we will later absolutely position\
    \ each image, and finally, add a rounded, semi-transparent background frame.\n\
    \n```\nol#things li {\n  position: relative;\n  float: left;\n  margin: 0 15px\
    \ 0 0;\n  padding: 10px;\n  background: #444; /* backup for non-RGBA */\n  background:\
    \ rgba(255, 255, 255, 0.1);\n  list-style: none;\n  -webkit-border-radius: 4px;\n\
    \  -moz-border-radius: 4px;\n  -o-border-radius: 4px;\n  border-radius: 4px;\n\
    \  }\n```\n\nWe’ll now set the moon background image that appears behind each\
    \ item, as well as giving each link a specific `width` and `height` (FIG 4.18).\n\
    \n```\nol#things li a {\n  float: left;\n  width: 137px;\n  height: 91px;\n  background:\
    \ url(../img/moon-137.jpg) no-repeat top left;\n  }\n```\n\n![close-up of the\
    \ first image spot in the carousel, showing the label &quot;1 Big Doughnut&quot;\
    \ and a moon background.](images/4-18.jpg)\n\nFIG 4.18: The list items, now with\
    \ the moon background image.\n\n### Catch-all declaration\n\nOur next step is\
    \ to create a catch-all declaration that will absolutely position each image within\
    \ the list item’s frame and therefore on top of the moon background image.\n\n\
    We’ll be positioning each item slightly differently depending on the object, as\
    \ well as using varying transforms, but we can declare `position: absolute;` here\
    \ for *all* images so we don’t have to duplicate that rule for each item. We’ll\
    \ also add a transition stack using the `all` value. That way, any transform or\
    \ change we wish to make on each thing will be transitioned and smoothed out,\
    \ regardless of which CSS properties we decide to change.\n\n```\nol#things li\
    \ a img {\n  position: absolute;\n  -webkit-transition: all 0.2s ease-in;\n  -moz-transition:\
    \ all 0.2s ease-in;\n  -o-transition: all 0.2s ease-in;\n  transition: all 0.2s\
    \ ease-in;\n  }\n```\n\nNow we’re ready to add exact positioning and width for\
    \ each image, taking advantage of those `id`s we added to each list item.\n\n\
    ```\nol#things li#things-1 a img { \n  width: 60px;\n  top: 23px;\n  left: 26px;\n\
    \  }\n\nol#things li#things-2 a img { \n  width: 50px;\n  top: 20px;\n  left:\
    \ 50px;\n  }\n\nol#things li#things-3 a img { \n  width: 80px;\n  top: 19px;\n\
    \  left: 30px;\n  }\n\nol#things li#things-4 a img { \n  width: 70px;\n  top:\
    \ 25px;\n  left: 45px;\n  }\n\nol#things li#things-5 a img { \n  width: 80px;\n\
    \  top: 20px;\n  left: 34px;\n  }\n```\n\nI’ve created these images on the large\
    \ side, so that if we wish to scale them up, we can do so without stretching the\
    \ image beyond its native dimensions.\n\nNow we’ll add a unique `:hover` treatment\
    \ to each item, knowing that the catch-all transition will smooth out and animate\
    \ whatever we fold in.\n\n### Scaling the big doughnut\n\nThe big doughnut gets\
    \ bigger on hover, so we’ll use the `scale` transform here to scale up the image.\
    \ Remember that the original image in the markup is quite a bit bigger than what\
    \ we sized down to in the stylesheet. This was intentional, so we could scale\
    \ it up like this.\n\n```\nol#things li#things-1 a:hover img {\n  -webkit-transform:\
    \ scale(1.25);\n  -moz-transform: scale(1.25);\n  -o-transform: scale(1.25);\n\
    \  transform: scale(1.25);\n  }\n```\n\nThese rules will scale the doughnut up\
    \ by 25% on hover. FIGURE 4.19 shows the normal and hover states, with the doughnut\
    \ getting a little bigger when moused over.\n\n![The big doughnut image before\
    \ and after hover; on hover, the doughnut gets larger.](images/4-19.jpg)\n\nFIG\
    \ 4.19: The big doughnut gets bigger on `:hover` using `scale`.\n\n### Perspective\
    \ with scale and position\n\nFor the lawnmower left on the moon, we’ll do two\
    \ things:\n\n1.  Scale it larger with a transform.\n\n2.  Move it down and to\
    \ the right.\n\nThese two changes plus the transition make the mower appear like\
    \ it’s coming at you (lookout!). It’s very subtle, but simple and effective.\n\
    \nWe’ll adjust the default position five pixels lower and 10 pixels to the right.\
    \ And we’ll also add a transform stack to scale the mower 20% larger than the\
    \ default.\n\n```\nol#things li#things-2 a:hover img {\n  top: 25px;\n  left:\
    \ 60px;\n  -webkit-transform: scale(1.2);\n  -moz-transform: scale(1.2);\n  -o-transform:\
    \ scale(1.2);\n  transform: scale(1.2);\n  }\n```\n\nFIGURE 4.20 shows the default\
    \ and hovered state, and the illusion of a mower coming at you is complete.\n\n\
    ![The lawnmower before and after hover; on hover, it moves forward and gets larger.](images/4-20.jpg)\n\
    \nFIG 4.20: The lawnmower uses position and `scale` to create a pseudo three-dimensional\
    \ effect.\n\n### The elusive astro cat\n\nWe can add CSS transitions on a whole\
    \ host of properties (not just CSS3 ones); simply smoothing out a *position* change\
    \ can make the astro cat appear as though it’s avoiding the mouse.\n\nBy adjusting\
    \ the `left` position of the image on hover, the catch-all transition will smooth\
    \ that movement out, making the astro cat appear like it’s sliding back and forth.\n\
    \nHere we’ll move the cat 15 pixels to the right by upping the `left` value from\
    \ `30px` to `45px` (FIG 4.21):\n\n```\nol#things li#things-3 a:hover img {\n \
    \ left: 45px;\n  }\n```\n\n![The cat before and after hover; on hover, the cat\
    \ slides to the right.](images/4-21.jpg)\n\nFIG 4.21: The cat slides back and\
    \ forth, as cats often do.\n\nPretty simple. And it’s really the CSS transition\
    \ that’s doing the magic here.\n\n### Tipping back the recliner\n\nA good recliner\
    \ tips back, and we can mimic that real-world reaction with the aforementioned\
    \ `rotate` transform.\n\nLet’s add the transform stack to rotate the recliner\
    \ slightly, to the left. We’ll use the vendor-prefixed rules for WebKit, Mozilla,\
    \ and Opera-based browsers, as well as ending with the actual `transform` property\
    \ for future implementations.\n\n```\nol#things li#things-4 a:hover img {\n  -webkit-transform:\
    \ rotate(-15deg);\n  -moz-transform: rotate(-15deg);\n  -o-transform: rotate(-15deg);\n\
    \  transform: rotate(-15deg);\n  }\n```"
