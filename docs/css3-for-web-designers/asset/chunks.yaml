  trans: "\n\n那么具体是如何实现的呢？保罗·安奈特（Paul Annett）在 2008 年初为*Think Vitamin*撰写的一篇文章中，记录了他专门为\
    \ Silverback 网站创建视差效果所使用的技术（[`bkaprt.com/css3/10/`](http://bkaprt.com/css3/10/)）。^(13)\n\
    \n为了将三层藤蔓（每层都是一个独立的 PNG）分层放置，你至少需要三个可用的块级元素。需要两个额外的包装`div`，以便在`body`、`#midground`和`#foreground`元素上放置背景图像。\n\
    \n为了简单起见，我在这里进行了粗略的翻译，但标记大致如下：\n\n```\n<body>\n  <div id=\"midground\">\n    <div\
    \ id=\"foreground\">\n      <!-- 页面内容放在这里 -->  \n    </div>\n  </div>\n</body>\n\
    ```\n\n用于放置三张图像（每张图像的水平位置各不相同）的 CSS 大致如下：\n\n```\nbody {\n  background: url(vines-back.png)\
    \ repeat-x 20% 0;\n  }\n\n#midground {\n  background: url(vines-mid.png) repeat-x\
    \ 40% 0;\n  }\n\n#foreground {\n  background: url(vines-front.png) repeat-x 150%\
    \ 0; \n  }\n```\n\n这种方法效果很好。但使用 CSS3 中引入的多背景语法后，实现起来就简单多了。\n\n让我们看看如何将多背景应用于月球示例网站的`body`，以及如何为可能体验到的用户创建更简单的视差效果。\n\
    \n## 新方法：通过 CSS3 实现多背景\n\n我使用了四个半透明的 PNG 来创建月球示例网站所用的深邃太空背景。它们都层叠在`body`元素上，一个叠在另一个上面，以便在用户调整浏览器窗口大小时营造出立体感。\n\
    \n图 5.03 展示了所使用的四张 PNG 图像：\n\n1.  尘埃云（`clouds.png`）\n2.  蓝到紫的渐变（`space-bg.png`）\n\
    3.  一层星星（`stars-1.png`）\n4.  另一层随机分布的星星（`stars-2.png`）\n\n![四张背景图像彼此分离、清晰可见。](img/5-03.jpg)\n\
    \n图 5.03：层叠在月球示例网站下方的四张半透明背景 PNG。\n\n### 多背景语法\n\n下面就是使用更新后的 CSS3 语法将这四张图像指定为`body`元素的背景有多么简单：\n\
    \n```\nbody {\n  background: \n    url(../img/stars-1.png) repeat-x fixed -130%\
    \ 0,\n    url(../img/stars-2.png) repeat-x fixed 40% 0,\n    url(../img/space-bg.png)\
    \ repeat-x fixed -80% 0,\n    url(../img/clouds.png) repeat-x fixed 100% 0;\n\
    \  background-color: #1a1a1a;\n  }\n```\n\n这里我将四张图像层叠起来，云层在底部，星星在顶部，形成一个逗号分隔的列表（注意堆叠顺序从“最靠近”用户的图像开始）。我还让每张图像水平重复，并将它们设置在不同的水平位置（使用正值和负值），以便在调整窗口大小时，每一层以不同的速度“移动”。最后，我使用`fixed`值将它们固定在页面上的锁定位置。\n\
    \n近乎黑色的背景色`#1a1a1a`作为单独的`background-color`规则最后添加。\n\n就是这样（图 5.04）。它的美妙之处在于不需要任何多余的标记。我们将所有这些图像放在`body`元素上，使它们位于页面内容之后，但我们不需要添加虚拟的包装`div`来分层。\n\
    \n![一张太空插图，散布着星星和蓝紫色的尘埃云。](img/5-04.jpg)\n\n图 5.04：四张 PNG 彼此层叠，并带有深炭灰色背景色。\n\n\
    ### 浏览器支持情况如何？\n\n正如第 1 章中提到的，多背景在 Safari 1.3+、Chrome 2+、Firefox 3.6+、Opera 10.5+和\
    \ IE9 Beta 中得到支持。因此，实际上，它们与我们在本书中一直使用的许多其他 CSS 属性处于同一水平。\n\n再次强调，由于支持不完善，我们选择在设计的非关键部分使用这个精彩的\
    \ CSS3 宝石：丰富页面的*背景*，通过为能够体验到的用户创建视差效果，增强调整窗口大小的体验。\n\n### 为所有浏览器提供回退方案\n\n尚不支持多背景的浏览器会忽略整个`background`规则。这正是我们将`background-color`定义在单独规则中的原因。\n\
    \n图 5.05 显示了在 IE7 中查看的月球示例网站，其中我们声明的多背景图像被忽略，只显示炭灰色的`background-color`。\n\n![“我们留在月球上的东西”网站，只有黑色背景。](img/5-05.jpg)\n\
    \n图 5.05：IE7 忽略了声明多背景图像的规则，只显示深炭灰色背景色。\n\n现在，这里并没有*破坏*任何东西——但失去背景中的所有太空感是一种遗憾。解决方案是，在声明中*首先*为不支持多图像的浏览器（如\
    \ IE7 和 8）指定一个单一的回退背景图像。然后，我们可以用多背景规则覆盖该规则（IE 会忽略多背景规则）。\n\n```\nbody {\n  background:\
    \ url(../img/space-bg.png) repeat-x fixed -80% 0; \n  background: \n    url(../img/stars-1.png)\
    \ repeat-x fixed -130% 0,\n    url(../img/stars-2.png) repeat-x fixed 40% 0,\n\
    \    url(../img/space-bg.png) repeat-x fixed -80% 0,\n    url(../img/clouds.png)\
    \ repeat-x fixed 100% 0;\n  background-color: #1a1a1a;\n }\n```\n\n对于单一图像回退，你可以选择多背景声明中使用的其中一张图像，甚至可以创建一个多层的扁平化版本。\n\
    \n对于月球网站，我选择简单地使用`space-bg.png`，即颜色渐变图像（图 5.06），从而为尚不支持多背景图像的浏览器提供一个没有星星、没有云层的背景版本。这很合适。\n\
    \n![“我们留在月球上的东西”网站，背景为蓝紫色尘埃云。](img/5-06.jpg)\n\n图 5.06：有了单一回退图像，IE7 现在恢复了一些太空感。\n\
    \n## 今天使用多背景\n\n与本书其他示例的主题一致，这里我们正在使用多背景图像。我们正在推进一个在 Safari、Chrome、Firefox 和 Opera\
    \ 以及 IE9 Beta 中得到良好支持的 CSS3 属性。我们不是害怕这种非普遍支持并等待它普及，而是选择将该属性应用于一个非关键的视觉事件（视差移动背景）。\n\
    \n我们还知道，如果浏览器不支持多背景，它会忽略整个`background`规则。为了弥补这一点，我们将在多背景规则之前定义一个扁平或备用的单一图形作为背景规则。\n\
    \n考虑到所有这些，我们现在可以更灵活地尝试将背景图像彼此层叠、移动和定位，而无需额外的标记。看到这项技术以创造性的新方式被使用，将会令人兴奋。\n\n11\\\
    . 长链接：[`www.w3.org/TR/CSS3-background/`](http://www.w3.org/TR/CSS3-background/)\
    \ [[↵]](#chapter5.html_footnote-11-backlink)\n\n12\\. [`en.wikipedia.org/wiki/Parallax_scrolling`](http://en.wikipedia.org/wiki/Parallax_scrolling)\
    \ [[↵]](#chapter5.html_footnote-12-backlink)\n\n13\\. 长链接：[`thinkvitamin.com/design/how-to-recreate-silverbacks-parallax-effect/`](http://thinkvitamin.com/design/how-to-recreate-silverbacks-parallax-effect/)\
    \ [[↵]](#chapter5.html_footnote-13-backlink)\n\n![第 6 章：丰富表单](img/chap-6.png)\n\
    \n表单是网站中另一个涉及交互的方面，因此它们提供了额外的视觉事件，非常适合用 CSS3 来丰富。\n\n默认情况下，表单元素本身的外观可能因浏览器或操作系统而异。为什么不接受这种差异，选择应用那些今天就能工作的\
    \ CSS3 部分来提升体验呢？\n\n"
- fmt: "\nIt’s important to strike a balance between subtle modification of form elements\
    \ and maintaining the familiar to ensure usability for your forms. In other words,\
    \ an input should still obviously appear as an input. Now that CSS is capable\
    \ of deep styling of form elements (in most browsers), we have to be careful to\
    \ not tamper with the most important part: the functionality.\n\nThat said, there’s\
    \ a lot we *can* do with forms in regards to CSS3 to enrich the experience for\
    \ browsers that support it now, while degrading that experience gracefully for\
    \ browsers that don’t.\n\nThis chapter also gives us an excuse to talk about three\
    \ portions of CSS3 that we haven’t yet touched on:\n\n1. Powerful new selectors\n\
    2. CSS Gradients\n3. CSS Animations\n\nAgain, we’ll use the moon example site\
    \ as a launching pad to talk about how forms and CSS3 can work together in new\
    \ and creative ways. Specifically, the “New Thing Alerts” sign-up form that sits\
    \ in the right sidebar (FIG 6.01).\n\n![The sidebar of the Things We Left on the\
    \ Moon website with a form titled &quot;New Thing Alerts,&quot; below which are\
    \ two input fields labeled &quot;Your Name&quot; and &quot;Your Email,&quot; and\
    \ a styled submit button.](images/6-01.jpg)\n\nFIG 6.01: A simple form where users\
    \ can subscribe to updates as new items are left on the moon.\n\n## Marking up\
    \ the simple sign-up form\n\nIn terms of HTML, this little form is about as simple\
    \ as it gets. Just a few inputs with labels and a submit button.\n\n```\n<form\
    \ action=\"/\" id=\"thing-alerts\">\n  <fieldset>\n    <label for=\"alerts-name\"\
    >Your Name</label>\n    <input type=\"text\" id=\"alerts-name\" />\n  </fieldset>\n\
    \n  <fieldset>\n    <label for=\"alerts-email\">Your Email</label>\n    <input\
    \ type=\"text\" id=\"alerts-email\" />\n  </fieldset>\n\n  <fieldset>\n    <input\
    \ type=\"submit\" value=\"Subscribe\" />\n  </fieldset>\n</form>\n```\n\nFIGURE\
    \ 6.02 shows the form with the default browser styles (as viewed in Safari).\n\
    \n![The same form, but the labels are to the left of the input fields instead\
    \ of above and a default submit button.](images/6-02.jpg)\n\nFIG 6.02: The form\
    \ viewed in Safari, sans styles.\n\n## Adding styles for fieldset and label\n\n\
    The first bits of CSS we’ll add to start sculpting this form are for the `fieldset`\
    \ and `label` elements—just a bit of spacing between each row.\n\n```\n#thing-alerts\
    \ fieldset {\n  margin: 0 0 10px 0;\n  }\n\n#thing-alerts label {\n  display:\
    \ block;\n  font-weight: bold;\n  line-height: 1.4;\n  color: #666;\n  color:\
    \ rgba(0, 0, 0, 0.6);\n  text-shadow: 0 1px 1px #fff;\n  }\n```\n\nLooking at\
    \ FIGURE 6.03 you’ll notice we’ve added a `10px` margin below each `fieldset`\
    \ row, and we’ve set labels to `display: block` to put them on their own line.\
    \ We’ve also assigned black at 60% transparency for the text, as well as a backup\
    \ color of solid gray for browsers that don’t yet support RGBA. And we’ve applied\
    \ a subtle white highlight with `text-shadow`, to make the text appear as though\
    \ it’s inset on the background.\n\n![The same form, now with the labels on top\
    \ of the input fields and with some padding for better spacing.](images/6-03.jpg)\n\
    \nFIG 6.03: The `fieldset` and `label` elements are now styled.\n\nNow while we\
    \ have nice 10 pixel spacing between `fieldset` rows, because of the padding inside\
    \ the gray box, we *don’t* need the 10 pixel margin under the last row (containing\
    \ the submit button).\n\nThis is a common pattern: you have a list or succession\
    \ of elements, each with the same styles applied, but you’d like to style the\
    \ last element in that succession a little differently.\n\nInstead of adding `class=\"\
    last\"` to the final element, why not take advantage of the `:last-child` pseudo-class\
    \ in CSS3 to remove the bottom margin without having to touch the markup:\n\n\
    ```\n#thing-alerts fieldset {\n  margin: 0 0 10px 0;\n  }\n\n  #thing-alerts fieldset\
    \ label {\n  display: block;\n  font-weight: bold;\n  line-height: 1.4;\n  color:\
    \ #666;\n  color: rgba(0, 0, 0, 0.6);\n  text-shadow: 0 1px 1px #fff;\n  }\n\n\
    \  #thing-alerts fieldset:last-child {\n    margin: 0;\n  }\n```\n\nKeep in mind\
    \ that `:last-child` isn’t supported in IE8 and below, but for minor presentational\
    \ adjustments like this one, it’s a great alternative to adding a class in the\
    \ markup.\n\nFIGURE 6.04 shows where we’re at currently, now with bottom margin\
    \ on the last `fieldset` element removed by way of the `:last-child` pseudo-class.\n\
    \n![The same form, with less spacing below the submit button.](images/6-04.jpg)\n\
    \nFIG 6.04: With the bottom margin removed from the final `fieldset`, our form\
    \ spacing is looking good.\n\n### More CSS3 selectors\n\nWhile we’re making good\
    \ use of `:last-child`, it’s a good time to point out that there are many more\
    \ wonderfully convenient new selectors in CSS3.\n\nI highly recommend Roger Johansson’s\
    \ article on the subject, “CSS3 selectors explained” ([http://bkaprt.com/css3/11/](http://bkaprt.com/css3/11/))^([14](#chapter6.html_footnote-14))\
    \ where he demonstrates what they are and how they work. Support for CSS3 selectors\
    \ varies across browsers, so be sure to reference Peter-Paul Koch’s thorough “CSS\
    \ contents and browser compatibility” tables ([http://bkaprt.com/css3/12/](http://bkaprt.com/css3/12/))^([15](#chapter6.html_footnote-15))\
    \ and “CSS Compatibility and Internet Explorer” from Microsoft ([http://bkaprt.com/css3/13/](http://bkaprt.com/css3/13/))^([16](#chapter6.html_footnote-16))\
    \ to see who supports what.\n\n## Styling the text inputs\n\nNext, let’s start\
    \ adding the styles that turn default text inputs into something a bit more customized.\
    \ This time we’ll use a CSS2.1 attribute selector to target the `input type=\"\
    text\"` elements only (and not the `input type=\"submit\"` button).\n\nIf we simply\
    \ declared:\n\n```\n#thing-alerts input\n```\n\nwe’d be styling all inputs in\
    \ the form (text *and* buttons), but if we modify that to:\n\n```\n #thing-alerts\
    \ input[type=\"text\"] \n```\n\nwe’ll target the text inputs only.\n\nAgain, using\
    \ a powerful selector in the stylesheet avoids having to add extra classes in\
    \ the markup to style the various form elements separately. This is beautiful.\n\
    \nKeep in mind that while attribute selectors are supported in IE7 and above,\
    \ they *aren’t* supported in IE6, but that’s OK since we’re just modifying the\
    \ non-critical appearance of these form elements. IE6 will ignore these rules,\
    \ and that’s perfectly acceptable in this case.\n\nThe following declaration applies\
    \ a specific `width`, `padding`, and `font-size`, turns off default borders, adds\
    \ a `background-color`, and rounds the corners of the inputs using our trusty\
    \ `border-radius` stack.\n\n```\n#thing-alerts fieldset input[type=\"text\"] {\n\
    \  width: 215px;\n  padding: 5px 8px;\n  font-size: 1.2em;\n  color: #666;\n \
    \ border: none;\n  background-color: #fff;\n  -webkit-border-radius: 4px;\n  -moz-border-radius:\
    \ 4px;\n  -o-border-radius: 4px;\n  border-radius: 4px;\n  }\n```\n\nFIGURE 6.05\
    \ shows our progress viewed in Safari (with similar results in Firefox and Opera).\
    \ We now have flat, rounded text inputs which look quite nice, but let’s add some\
    \ depth to make them look more like a typical, editable input.\n\n![The same form,\
    \ with the default browser styles removed from the input fields; the input fields\
    \ are not flat and rounded.](images/6-05.jpg)\n\nFIG 6.05: Flat, rounded text\
    \ inputs.\n\n## Using CSS3 gradients\n\nOne crafty way we can add some of that\
    \ depth is by way of CSS gradients, which are new in CSS3. That is, create a gradient\
    \ from one color to another without the use of any images. That sounds pretty\
    \ enticing, doesn’t it?\n\nCSS gradients are currently supported in Safari 4+,\
    \ Chrome 2+, and Firefox 3.6+ only, but again, for non-critical uses, it can be\
    \ a flexible solution that degrades well.\n\nCSS gradients can be assigned anywhere\
    \ that an image can be declared in the stylesheet. In other words, `background-image`,\
    \ `list-style-image`, `border-image`, and generated content.\n"
