  trans: "\n\n1997 年，我第一次用 JavaScript 实现图片翻转效果，花了几个晚上挠头苦思，写了许多当时对我来说如同天书般的代码，还用了多张图片。而如今的\
    \ CSS3 只需几行简洁的代码就能实现更丰富、更灵活的交互效果，而且值得庆幸的是，在不支持它的浏览器中也能优雅降级。\n\n正如我在第 1 章中提到的，只要我们谨慎选择使用场景，现在就可以开始使用一些\
    \ CSS3 属性。CSS 过渡也是如此。它们当然不会*取代*Flash、JavaScript 或 SVG 等现有技术（尤其是在浏览器支持还不够广泛的情况下），但与前面提到的核心\
    \ CSS3 属性（以及我们将在本书后面介绍的 CSS 变换和动画）结合使用时，它们可以用来将体验层提升一个档次。最重要的是，对于已经熟悉 CSS 的网页设计师来说，它们相对容易实现，只需要几行代码。\n\
    \n我在这里（第 2 章）早早地介绍 CSS 过渡，是因为我们将在本书后面的许多示例中应用它们。在深入案例研究之前，对过渡的语法及其工作原理有一个基本了解会很有帮助。\n\
    \n## 本末倒置\n\nCSS 过渡最初由 WebKit 团队为 Safari 开发，现在已成为 W3C 的工作草案规范。（CSS 变换和 CSS 动画有着相同的渊源，我们将在第\
    \ 4 章和第 6 章中分别讨论它们。）\n\n这是一个很好的例子，展示了浏览器创新如何被纳入潜在标准。我说*潜在*，是因为它目前还只是一个草案。不过，Opera\
    \ 最近在 10.5 版本中增加了对 CSS 过渡的支持，Firefox 也承诺在 4.0 版本中支持。换句话说，尽管它还是一个*草案*规范，仍在演变中，但它已经足够稳定，以至于\
    \ Opera 和 Firefox 都认真对待并添加了支持。最重要的是，CSS 过渡不再是 Safari 独有的专有实验。\n\n让我们来看看过渡是如何工作的，好吗？就像第\
    \ 1 章中讨论的 CSS3 属性一样，我在这里只介绍它们的基本语法，以便你掌握它们的运作方式。稍后，我们将用过渡做各种有趣的事情，用它来润色后续章节中的示例，届时你就能快速理解过渡如何恰当地融入其中。\n\
    \n## 什么是 CSS 过渡？\n\n我喜欢把 CSS 过渡想象成*黄油*，当触发悬停、点击和聚焦等交互时，它能平滑地改变样式表中的值变化。与真正的黄油不同，过渡不会让人发胖——它们只是样式表中的几条简单规则，用来丰富设计中的某些事件。\n\
    \nW3C 对 CSS 过渡的解释非常简单（[`bkaprt.com/css3/3/)`](http://bkaprt.com/css3/3/)）：^(4)\n\
    \n> CSS 过渡允许 CSS 值的属性变化在指定的持续时间内平滑发生。\n\n这种平滑效果会在鼠标点击、聚焦或激活状态，或任何元素变化（甚至包括元素 class\
    \ 属性的变化）触发时，对 CSS 值的变化进行动画处理。\n\n## 一个简单的示例\n\n让我们从一个简单的例子开始，我们将为链接的背景颜色切换添加一个过渡。当鼠标悬停时，链接的背景颜色会改变，我们将使用过渡来平滑这种变化——这种效果以前只能用\
    \ Flash 或 JavaScript 实现，但现在只需几行简单的 CSS 代码即可。\n\n标记是一个简单的超链接，如下所示：\n\n```\n<a href=\"\
    #\" class=\"foo\">过渡我吧！</a>\n```\n\n接下来，我们将为正常链接状态添加声明，设置一点内边距和浅绿色背景，然后在悬停时切换到深绿色背景（图\
    \ 2.01）：\n\n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  }\n\na.foo:hover\
    \ {\n  background: #690;\n  }\n```\n\n![链接的正常状态（浅绿色背景）和悬停状态（深绿色背景）。](img/2-01.jpg)\n\
    \n图 2.01：链接的正常状态和`:hover`状态。\n\n现在，让我们为这个背景颜色变化添加一个过渡。这将平滑地动画化指定时间段内的变化（图 2.02）。\n\
    \n为了简单起见，我们暂时只使用目前基于 WebKit 的浏览器（Safari 和 Chrome）中有效的厂商前缀属性。稍后，我们将为 Mozilla 和\
    \ Opera 添加厂商前缀。\n\n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n \
    \ -webkit-transition-property: background; \n  -webkit-transition-duration: 0.3s;\n\
    \  -webkit-transition-timing-function: ease; \n  }\n```\n\n```\na.foo:hover {\n\
    \  background: #690;\n  }\n```\n\n![动画过渡中的几个步骤，背景从浅绿色变为深绿色。](img/2-02.jpg)\n\n\
    图 2.02：此图显示了从浅绿色到深绿色背景的平滑过渡。\n\n你会注意到声明中过渡的三个部分：\n\n*   `transition-property`：要过渡的属性（本例中为`background`属性）\n\
    \n*   `transition-duration`：过渡应持续的时间（0.3 秒）\n\n*   `transition-timing-function`：过渡随时间变化的速度（`ease`）\n\
    \n## 计时函数（或者，我真希望当初数学课认真听了）\n\n计时函数值通过定义六种可能性之一来允许过渡速度随时间变化：`ease`、`linear`、`ease-in`、`ease-out`、`ease-in-out`和`cubic-bezier`（允许你定义自己的计时曲线）。\n\
    \n如果你像我一样在高中几何课上睡着了，别担心。我建议你直接插入每个计时函数值，看看它们有何不同。\n\n对于我们的简单示例，过渡持续时间非常短（仅 0.3\
    \ 秒），很难区分这六种选项。对于较长的动画，你选择的计时函数就变得更加重要，因为你有时间注意到动画过程中速度的变化。\n\n如果不确定，`ease`（也是默认值）或`linear`对于短过渡来说应该没问题。\n\
    \n## 延迟过渡\n\n回到我们的示例，过渡可以在屏幕上触发事件后延迟发生。例如，假设我们希望背景过渡在链接悬停后*半秒*才开始。我们可以使用`transition-delay`属性来实现。\n\
    \n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition-property:\
    \ background;\n  -webkit-transition-duration: 0.3s;\n  -webkit-transition-timing-function:\
    \ ease;\n  -webkit-transition-delay: 0.5s; \n  }\n\na.foo:hover {\n  background:\
    \ #690;\n  }\n```\n\n## 过渡的简写形式\n\n我们可以通过使用过渡的简写属性来大大简化（无延迟的）声明，这也是我们在本书后续示例中使用的语法。\n\
    \n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition:\
    \ background 0.3s ease; \n  }\n```\n\n```\na.foo:hover {\n  background: #690;\n\
    \  }\n```\n\n现在我们有了一个更紧凑的规则，实现了相同的结果。\n\n### 带延迟的简写过渡\n\n如果我们想为简写版本的过渡重新添加半秒延迟，可以通过将持续时间值放在规则末尾来实现，如下所示：\n\
    \n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition:\
    \ background 0.3s ease 0.5s;\n  }\n```\n\n```\na.foo:hover {\n  background: #690;\n\
    \  }\n```\n\n当然，所有这些美妙的过渡在 WebKit 浏览器中运行良好，但其他浏览器呢？\n\n## 浏览器支持\n\n"
- fmt: "\nAs I mentioned earlier, transitions were initially developed by WebKit,\
    \ and have been in Safari and Chrome since version 3.2, but Opera supports them\
    \ as well in version 10.5 ([http://bkaprt.com/css3/4/](http://bkaprt.com/css3/4/))^([5](#chapter2.html_footnote-5))\
    \ and support has been promised in Firefox 4.0 ([http://bkaprt.com/css3/5/](http://bkaprt.com/css3/5/)).^([6](#chapter2.html_footnote-6))\n\
    \nBecause of that present and near-future support, it’s important to add the appropriate\
    \ vendor prefixes so that our transitions will work in more browsers as support\
    \ is rolled out.\n\n## Building the full transition stack\n\nHere’s a revised\
    \ declaration, adding the `–moz-` and `–o-` prefixes as well as the actual CSS3\
    \ `transition` property. Again, we’re putting the non-prefixed property last in\
    \ the stack to ensure that the final implementation will trump the others as the\
    \ property moves from draft to finished status.\n\n```\na.foo {\n  padding: 5px\
    \ 10px;\n  background: #9c3;\n  -webkit-transition: background 0.3s ease; \n \
    \ -moz-transition: background 0.3s ease;\n  -o-transition: background 0.3s ease;\
    \ \n  transition: background 0.3s ease; \n  }\n\na.foo:hover {\n  background:\
    \ #690;\n  }\n```\n\nWith that stack, we’ll be smoothing out that background color\
    \ change in current versions of Safari, Chrome, and Opera, as well as future versions\
    \ of any browser that chooses to support it.\n\n## Transitioning states\n\nI remember\
    \ being slightly confused when I first started playing around with CSS Transitions.\
    \ Wouldn’t it make more sense if the transition properties were placed in the\
    \ `:hover` declaration, since that’s the trigger for the transition? The answer\
    \ is that there are other possible states of an element besides `:hover`, and\
    \ you’ll likely want that transition to happen on each of those without duplication.\n\
    \nFor instance, you may want the transition to also happen on the `:focus` or\
    \ `:active` pseudo-classes of the link as well. Instead of having to add the transition\
    \ property stack to each of those declarations, the transition instructions are\
    \ attached to the normal state and therefore declared only once.\n\nThe following\
    \ example adds the same background switch to the `:focus` state. This enables\
    \ triggering the transition from either hovering over *or* focusing the link (via\
    \ the keyboard, for example).\n\n```\na.foo {\n  padding: 5px 10px;\n  background:\
    \ #9c3;\n  -webkit-transition: background 0.3s ease;\n  -moz-transition: background\
    \ 0.3s ease;\n  -o-transition: background 0.3s ease;\n  transition: background\
    \ 0.3s ease;\n  }\n\na.foo:hover,\na.foo:focus {\n  background: #690;\n  }\n```\n\
    \n## Transitioning multiple properties\n\nLet’s say that along with the background\
    \ color, we also want to change the link’s text color and transition that as well.\
    \ We can do that by stringing multiple transitions together, separated by a comma.\
    \ Each can have their varying duration and timing functions (FIG 2.03).\n\n```\n\
    a.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition: background\
    \ .3s ease, color 0.2s linear;\n  -moz-transition: background .3s ease, color\
    \ 0.2s linear;\n  -o-transition: background .3s ease, color 0.2s linear;\n  transition:\
    \ background .3s ease, color 0.2s linear;\n  }\n\na.foo:hover,\na.foo:focus {\n\
    \  color: #030;\n  background: #690;\n  }\n```\n\n![The normal state (light green\
    \ background, white text) and hover state (dark green background, black text)](images/2-03.jpg)\n\
    \nFIG 2.03: The normal and `:hover` states of the link.\n\n## Transitioning all\
    \ possible properties\n\nAn alternative to listing multiple properties is using\
    \ the `all` value. This will transition all available properties.\n\nLet’s drop\
    \ `all` into our simple example instead of listing `background` and `color` separately.\
    \ They’ll now share the same duration and timing function.\n\n```\na.foo {\n \
    \ padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition: all 0.3s ease;\n\
    \  -moz-transition: all 0.3s ease;\n  -o-transition: all 0.3s ease;\n  transition:\
    \ all 0.3s ease;\n  }\n\na.foo:hover,\na.foo:focus {\n  color: #030;\n  background:\
    \ #690;\n  }\n```\n\nThis is a convenient way of catching all the changes that\
    \ happen on `:hover`, `:focus`, or `:active` events without having to list each\
    \ property you’d like to transition.\n\n## Which CSS properties can be transitioned?\n\
    \nNow that we’ve successfully transitioned the `background` and `color` of a hyperlink,\
    \ there are many other CSS properties that can be transitioned, including `width`,\
    \ `opacity`, `position`, and `font-size`. A chart of all the possible properties\
    \ (and their types) that can be transitioned is available from the W3C ([http://bkaprt.com/css3/6/](http://bkaprt.com/css3/6/)).^([7](#chapter2.html_footnote-7))\n\
    \nThe opportunities for wonderfully fluid experiences are clear. We’ll be using\
    \ several of these properties in conjunction with transitions throughout our case\
    \ study examples in the next chapter and onward.\n\n## Why not use JavaScript\
    \ instead?\n\nYou might be wondering, with not all browsers supporting (or at\
    \ least promising support for) CSS Transitions, why not use a JavaScript solution\
    \ to handle the animation? Popular frameworks such as jQuery, Prototype, and script.aculo.us\
    \ have enabled animations via JavaScript that work cross-browser for some time\
    \ now.\n\nIt all depends on how crucial the transitions are to the experience.\
    \ I’m stressing here in this little book that you can embrace the simplicity and\
    \ flexibility of CSS3 if you choose the appropriate parts of the user experience\
    \ to apply it: enriching the interactions that happen on the page. Quite often,\
    \ the animation of these interactions when handled by CSS Transitions aren’t integral\
    \ to the brand, readability, or layout of the website. Therefore, a few simple\
    \ lines of CSS to trigger a simple animation that’s *native* to the browsers that\
    \ support it (rather than tapping into a JavaScript framework) seems like a smart\
    \ choice. And one I’m glad we have at our disposal.\n\n## Be smart, be subtle\n\
    \nLike all shiny new tools, it’s important to use transitions *appropriately*.\
    \ One can easily go overboard adding transitions to everything on the page, resulting\
    \ in some sort of annoying, pulsating monster. It’s key to decide where transitions\
    \ rightfully enrich the user experience and when they are just extraneous noise.\
    \ Additionally, making sure the speed of the transition doesn’t slow down an otherwise\
    \ snappy action from the user is crucial. Use with care and caution.\n\nFor more\
    \ thoughts on appropriate speeds for CSS transitions and animations, see Trent\
    \ Walton’s post on the subject: [http://bkaprt.com/css3/7/](http://bkaprt.com/css3/7/).^([8](#chapter2.html_footnote-8))\n\
    \nNow that we have a solid base knowledge of how CSS transitions work at a technical\
    \ level, we can use them to smooth out the experience layer in the examples that\
    \ follow, beginning with the very next chapter. Let’s get to it.\n\n4\\. The long\
    \ URL: [http://www.w3.org/TR/CSS3-transitions/](http://www.w3.org/TR/CSS3-transitions/)\
    \ [[↵]](#chapter2.html_footnote-4-backlink)\n\n5\\. The long URL: [http://www.opera.com/docs/specs/presto23/css/transitions/](http://www.opera.com/docs/specs/presto23/css/transitions/)\
    \ [[↵]](#chapter2.html_footnote-5-backlink)\n\n6\\. The long URL: [https://developer.mozilla.org/en/CSS/CSS_transitions](https://developer.mozilla.org/en/CSS/CSS_transitions)\
    \ [[↵]](#chapter2.html_footnote-6-backlink)\n\n7\\. The long URL: [http://www.w3.org/TR/css3-transitions/#properties-from-css-](http://www.w3.org/TR/css3-transitions/#properties-from-css-)\
    \ [[↵]](#chapter2.html_footnote-7-backlink)\n\n8\\. [http://trentwalton.com/2010/03/22/CSS3-in-transition/](http://trentwalton.com/2010/03/22/CSS3-in-transition/)\
    \ [[↵]](#chapter2.html_footnote-8-backlink)\n\n![Chapter 3: Hover-Crafting with\
    \ CSS3](images/chap-3.png)\n\nWe’ve spent the first two chapters in training,\
    \ getting up to speed with what’s currently usable today in terms of CSS3. We\
    \ also talked about how the *experience layer* is currently the most appropriate\
    \ place to apply that usable CSS3.\n"
