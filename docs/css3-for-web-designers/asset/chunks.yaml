  trans: "\n我之前提到过，CSS3 规范是一系列模块，浏览器厂商正在逐步推出这些模块。在某些情况下，这种推出涉及实验性支持。也就是说，当规范在 W3C\
    \ 被编写、讨论和敲定时，浏览器制造商可能会选择添加对某些属性的支持，并在真实环境中进行测试。这已成为流程中健康的一部分，实验性使用的反馈常被用来调整规范。\n\
    \n或者，浏览器厂商可能希望引入一个不属于任何拟议标准、但日后可能成为标准的实验性属性。\n\n通常，对 CSS 属性的实验性支持是通过使用*厂商前缀*来处理的，如下所示：\n\
    \n```\n-webkit-border-radius\n```\n\n这个以连字符为前缀的关键词附加在属性名称的开头，将其标记为进行中的工作，特定于浏览器对不断演变的规范的实现和解释。如果实验最终成为完成的\
    \ CSS3 模块的一部分，浏览器应支持不带前缀的属性名称。\n\n每个浏览器厂商都有自己的前缀，本质上是对其实验性属性进行命名空间划分。其他浏览器会忽略包含它们无法识别前缀的规则。\n\
    \n表 1.03 显示了最广泛使用的厂商及其相关前缀，在后续章节的示例中，我们将使用 WebKit、Mozilla 和 Opera 前缀，因为它们与 CSS3\
    \ 相关。\n\n表 1.03：最广泛使用的厂商及其相关前缀。\n\n| ![webkit 图标](img/webkit-icon.png) | WebKit\
    \ | `–webkit–` |\n| ![firefox 图标](img/firefox-icon.png) | Mozilla | `–moz–` |\n\
    | ![opera 图标](img/opera-icon.png) | Opera | `–o–` |\n| ![konqueror 图标](img/konqueror-icon.png)\
    \ | Konqueror | `–khtml–` |\n| ![ie 图标](img/ie-icon.png) | Microsoft | `–ms–`\
    \ |\n| ![chrome 图标](img/chrome-icon.png) | Chrome | `–chrome–` |\n\n### 厂商前缀的工作原理\n\
    \n以下是带厂商前缀的 CSS 在实际中的工作方式；我们以 `border-radius` 属性为例。假设我们想将一个元素的圆角半径设为 10 像素，可以这样写：\n\
    \n```\n.foo {\n  -webkit-border-radius: 10px;\n  -moz-border-radius: 10px;\n \
    \ border-radius: 10px;\n  }\n```\n\nWebKit（Safari、移动 Safari 和 Chrome 的内核）和 Gecko（Firefox\
    \ 的内核）浏览器各自通过自己的厂商前缀版本支持 `border-radius` 属性，而 Opera 则支持不带厂商前缀的属性。IE9 也将支持不带厂商前缀的\
    \ `border-radius`。\n\n### 最佳顺序\n\n使用厂商前缀时，务必注意声明中列出规则的顺序。你会注意到在上面的例子中，我们首先列出了带厂商前缀的属性，然后是不带前缀的\
    \ CSS3 属性。\n\n为什么把实际的 CSS3 属性放在最后？因为你的样式在未来可能会在更多浏览器中工作，从而逐步增强你的设计。当浏览器最终按照规范实现对该属性的支持时，真正的属性会取代实验性版本，因为它位于列表的最后。如果厂商特定版本的实现与真正的属性不同，你就能确保最终标准占据主导地位。\n\
    \n### 不要害怕厂商前缀！\n\n你的第一反应可能是：“哎呀，这太混乱了，是专有技术！”但我向你保证，这不仅是前进的方向，而且比非 CSS3 解决方案中常见的代码臃肿和僵化要清晰得多，同时也是规范演进的重要组成部分。\n\
    \n通过现在使用这些带厂商前缀的属性，我们可以测试水温，甚至在规范最终确定之前向浏览器制造商提供宝贵的反馈。也请记住，前缀通常附加在*拟议标准*上。这与我们过去偶尔用来解决跨浏览器问题的其他\
    \ hackish CSS 有很大区别。\n\n有些人可能会将厂商前缀与许多人为针对特定浏览器版本而使用的语法技巧（例如，使用 `w\\idth: 200px`\
    \ 或 `_width: 200px` 来针对特定版本的 IE）相提并论。但相反，厂商前缀是*标准流程的重要组成部分*，允许属性在真实世界的实现中演进。\n\
    \n正如 CSS 专家 Eric Meyer 在 A List Apart 上的文章“Prefix or Posthack”（[`bkaprt.com/css3/2/`](http://bkaprt.com/css3/2/)）中所解释的那样：^(3)\n\
    \n> 前缀让我们掌控自己的 hack 命运。过去，我们不得不发明一堆解析器技巧，仅仅是为了让不一致的实现在我们发现它们不一致后表现一致。那是一种完全被动的做法。前缀是一种主动的做法。\n\
    \n他接着指出，厂商前缀不仅是积极的，而且应该更深入地融入标准流程，并且会：\n\n> ……迫使厂商和工作组共同制定必要的测试来确定互操作性。这些测试可以指导后来者，帮助他们更快地实现互操作状态。他们可以在一个公开测试版中直接发布带前缀的实现，然后在下一个版本中移除前缀。\n\
    \n所以，不要为厂商前缀烦恼。使用它们，要知道你是这个过程的一部分，它让你今天就能完成工作，并为未来移除前缀铺平道路。\n\n### 重复那么多怎么办？\n\
    \n你可能觉得为每个厂商重复看似相同的属性三四次很愚蠢，我可能同意你的看法。\n\n但现实是，非 CSS3 解决方案可能需要僵化且更复杂的代码，尽管可能不重复。\n\
    \n我们不需要永远重复自己。目前，这是一个必要但临时的步骤，以保持浏览器之间可能不同的实现与最终规范实现分离。\n\n在我们开始用少数可用的 CSS3 属性及其各自的厂商前缀做令人兴奋的事情之前，让我们先基本掌握\
    \ CSS 过渡。理解过渡及其运作方式将帮助我们将其与其他属性结合，创造美妙的体验。\n\n1. 长 URL：[`www.alistapart.com/articles/tohell/`](http://www.alistapart.com/articles/tohell/)\
    \ [[↵]](#chapter1.html_footnote-1-backlink)\n\n2. [`www.w3.org/TR/css3-roadmap/#whymods`](http://www.w3.org/TR/css3-roadmap/#whymods)\
    \ [[↵]](#chapter1.html_footnote-2-backlink)\n\n3. [`www.alistapart.com/articles/prefix-or-posthack/`](http://www.alistapart.com/articles/prefix-or-posthack/)\
    \ [[↵]](#chapter1.html_footnote-3-backlink)\n\n![第 2 章：理解 CSS 过渡](img/chap-2.png)\n\
    \n那是 1997 年，我坐在马萨诸塞州美丽的奥尔斯顿一间破旧不堪的公寓里。一个典型的深夜，我在查看源代码并自学 HTML，白天则在当地一家唱片公司打包 CD\
    \ 赚取微薄收入（所以公寓破旧）。我相信你能理解。\n\n一个胜利的夜晚，我兴奋地挥舞着拳头。我刚刚成功编写了第一个 JavaScript 图像翻转效果。还记得那些吗？\n\
    \n我仍然记得看到自己拼凑出来的粗糙按钮图形在鼠标悬停时“切换”成另一个图形时的惊奇。当时我几乎不知道自己在做什么，但让页面上的东西成功变化，*动态地*，嗯……就像魔法一样。\n\
    \n在过去的十年里，我们在网页交互和视觉体验方面取得了*长足*的进步。历史上，Flash 和 JavaScript 等技术实现了动画、运动和交互效果。但最近，随着浏览器开始支持\
    \ CSS 过渡和变换，其中一些动画和体验增强现在可以轻松地转移到我们的样式表中。\n"
- fmt: "\nMy first JavaScript rollover back in 1997 took me several nights of head\
    \ scratching, many lines of code that seemed alien to me at the time, and multiple\
    \ images. CSS3 today enables far richer, more flexible interactions through simple\
    \ lines of code that thankfully degrade gracefully in the browsers that don’t\
    \ yet support it.\n\nAs I mentioned in [Chapter 1](#chapter1.html), we can start\
    \ to use some CSS3 properties right now as long as we carefully choose the situations\
    \ in which to use them. The same could be said for CSS transitions. They certainly\
    \ won’t *replace* existing technologies like Flash, JavaScript, or SVG (especially\
    \ without broader browser support)—but in conjunction with the aforementioned\
    \ core CSS3 properties (and CSS transforms and animations which we’ll cover later\
    \ in the book), they can be used to push the experience layer a notch higher.\
    \ And most importantly, they’re relatively easy to implement for the web designer\
    \ already familiar with CSS. It only takes a few lines of code.\n\nI’m introducing\
    \ CSS transitions early here in Chapter 2, as we’ll be applying them to many of\
    \ the examples later in the book. Having a basic understanding of the syntax of\
    \ transitions and how they work will be beneficial before we dig deeper into a\
    \ case study.\n\n## Tail wagging the dog\n\nInitially developed solely by the\
    \ WebKit team for Safari, CSS Transitions are now a Working Draft specification\
    \ at the W3C. (CSS Transforms and CSS Animations share that same lineage, and\
    \ we’ll be talking about them in Chapters [4](#chapter4.html) and [6](#chapter6.html),\
    \ respectively.)\n\nThis is a nice example of browser innovation being folded\
    \ back into a potential standard. I say *potential* since it’s merely a draft\
    \ today. However, Opera has recently added CSS transitions support in version\
    \ 10.5 and Firefox has pledged support for version 4.0\\. In other words, while\
    \ it is a *draft* specification and evolving, it’s stable enough for Opera and\
    \ Firefox to be taking it seriously and adding support for it. Most importantly,\
    \ CSS transitions are no longer proprietary Safari-only experiments.\n\nLet’s\
    \ take a look at how transitions work, shall we? Like the CSS3 properties discussed\
    \ in [Chapter 1](#chapter1.html), I’m only introducing them here along with their\
    \ basic syntax so you’ll have a good handle on how they operate. Later, we’ll\
    \ be doing all sorts of fun things with transitions, using them to polish the\
    \ examples in the chapters ahead, and you’ll be up to speed on how transitions\
    \ properly fit into the mix.\n\n## What are CSS transitions?\n\nI like to think\
    \ of CSS transitions like *butter*, smoothing out value changes in your stylesheets\
    \ when triggered by interactions like hovering, clicking, and focusing. Unlike\
    \ real butter, transitions aren’t fattening—they’re just a few simple rules in\
    \ your stylesheet to enrich certain events in your designs.\n\nThe W3C explains\
    \ CSS transitions quite simply ([http://bkaprt.com/css3/3/)](http://bkaprt.com/css3/3/)):^([4](#chapter2.html_footnote-4))\n\
    \n> CSS Transitions allow property changes in CSS values to occur smoothly over\
    \ a specified duration.\n\nThis smoothing animates the changing of a CSS value\
    \ when triggered by a mouse click, focus or active state, or any changes to the\
    \ element (including even a change on the element’s class attribute).\n\n## A\
    \ simple example\n\nLet’s start with a simple example, where we’ll add a transition\
    \ to the background color swap of a link. When hovered over, the link’s background\
    \ color will change, and we’ll use a transition to smooth out that change—an effect\
    \ previously only possible using Flash or JavaScript, but now possible with a\
    \ few simple lines of CSS.\n\nThe markup is a simple hyperlink, like so:\n\n```\n\
    <a href=\"#\" class=\"foo\">Transition me!</a>\n```\n\nNext, we’ll add a declaration\
    \ for the normal link state with a little padding and a light green background,\
    \ followed by the background swap to a darker green on hover (FIG 2.01):\n\n```\n\
    a.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  }\n\na.foo:hover {\n  background:\
    \ #690;\n  }\n```\n\n![The normal state (light green background) and hover state\
    \ (dark green background) of the link.](images/2-01.jpg)\n\nFIG 2.01: The normal\
    \ and `:hover` state of the link.\n\nNow let’s add a transition to that background\
    \ color change. This will smooth out and animate the difference over a specified\
    \ period of time (FIG 2.02).\n\nFor the time being, we’ll use only the vendor-prefixed\
    \ properties which currently work in WebKit-based browsers (Safari and Chrome)\
    \ to keep things simple. Later, we’ll add vendor prefixes for Mozilla and Opera.\n\
    \n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition-property:\
    \ background; \n  -webkit-transition-duration: 0.3s;\n  -webkit-transition-timing-function:\
    \ ease; \n  }\n```\n\n```\na.foo:hover {\n  background: #690;\n  }\n```\n\n![Several\
    \ steps in the animation transition, as the background changes from light green\
    \ to dark green.](images/2-02.jpg)\n\nFIG 2.02: This figure shows the smooth transition\
    \ of light green to darker green background.\n\nYou’ll notice the three parts\
    \ of a transition in the declaration:\n\n*   `transition-property`: The property\
    \ to be transitioned (in this case, the `background` property)\n\n*   `transition-duration`:\
    \ How long the transition should last (0.3 seconds)\n\n*   `transition-timing-function`:\
    \ How fast the transition happens over time (`ease`)\n\n## Timing functions (or,\
    \ I really wish I’d paid attention in math class)\n\nThe timing function value\
    \ allows the speed of the transition to change over time by defining one of six\
    \ possibilities: `ease`, `linear`, `ease-in`, `ease-out`, `ease-in-out`, and `cubic-bezier`\
    \ (which allows you to define your own timing curve).\n\nIf you slept through\
    \ geometry in high school like I did, don’t worry. I recommend simply plugging\
    \ in each of these timing function values to see how they differ.\n\nFor our simple\
    \ example, the duration of the transition is so quick (just a mere 0.3 seconds)\
    \ that it’d be difficult to tell the difference between the six options. For longer\
    \ animations, the timing function you choose becomes more of an important piece\
    \ of the puzzle, as there’s time to notice the speed changes over the length of\
    \ the animation.\n\nWhen in doubt, `ease` (which is also the default value) or\
    \ `linear` should work just fine for short transitions.\n\n## Delaying the transition\n\
    \nGoing back to our example, transitions can be delayed from the moment the trigger\
    \ happens on screen. For example, let’s say we wanted the background transition\
    \ to happen half a second *after* the link is hovered over. We can do that using\
    \ the `transition-delay` property.\n\n```\na.foo {\n  padding: 5px 10px;\n  background:\
    \ #9c3;\n  -webkit-transition-property: background;\n  -webkit-transition-duration:\
    \ 0.3s;\n  -webkit-transition-timing-function: ease;\n  -webkit-transition-delay:\
    \ 0.5s; \n  }\n\na.foo:hover {\n  background: #690;\n  }\n```\n\n## Shorthand\
    \ transitions\n\nWe could simplify the (non-delayed) declaration significantly\
    \ by using the transition shorthand property, which is the syntax we’ll be using\
    \ in the examples later in the book.\n\n```\na.foo {\n  padding: 5px 10px;\n \
    \ background: #9c3;\n  -webkit-transition: background 0.3s ease; \n  }\n```\n\n\
    ```\na.foo:hover {\n  background: #690;\n  }\n```\n\nNow we have a much more compact\
    \ rule that accomplishes the same result.\n\n### Shorthand transition with a delay\n\
    \nIf we wanted to add back in the half-second delay to the shorthand version of\
    \ the transition, we can do that by placing the duration value at the end of the\
    \ rule, like this:\n\n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n\
    \  -webkit-transition: background 0.3s ease 0.5s;\n  }\n```\n\n```\na.foo:hover\
    \ {\n  background: #690;\n  }\n```\n\nNow sure, all of this wonderful transitioning\
    \ works just fine in WebKit browsers, but what about the others?\n\n## Browser\
    \ support\n"
