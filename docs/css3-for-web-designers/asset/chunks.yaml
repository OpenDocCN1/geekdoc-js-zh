- fmt: "\n## Do websites need to be experienced exactly the same in every browser?\n\
    \nIt’s an important question (and an appropriate one to ask at this point), and\
    \ I attempt to answer it on this enormously long domain (FIG 3.06): [http://dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com](http://dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com).\n\
    \n![Screenshot of a website with a black background and white text that says &quot;Nope.&quot;](images/3-06.jpg)\n\
    \nFIG 3.06: The curiously named [http://dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com](http://dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com).\n\
    \nLike Faruk’s example, it’s not until you start to interact with the site that\
    \ things get interesting. On the surface, the site looks nearly identical in most\
    \ browsers, but the moment you move the mouse across the screen and text (FIG\
    \ 3.07), a series of CSS3 properties, transitions, and transforms are applied\
    \ to make the experience a unique and memorable one.\n\n![Screenshot of a website\
    \ with a space background and white text that says &quot;Nope&quot; with a rounded,\
    \ semi-transparent white background underneath the text.](images/3-07.jpg)\n\n\
    FIG 3.07: An enriched experience is revealed when the site is interacted with.\
    \ Made possible by our friend CSS3.\n\nOnce again, it’s within the experience\
    \ layer that we’re progressively enriching this web design. The core content,\
    \ readability, usability, and markup remain consistent and uncompromised.\n\n\
    ## Navigating the moon\n\nLet’s take the concept of adding CSS3 to the hover interactions\
    \ of a design right to our case study. I’ll walk us through the creation of the\
    \ top navigation of the site (FIG 3.08), where we combine `border-radius`, `text-shadow`,\
    \ RGBA, and CSS transitions to create an experience that surprises and delights.\n\
    \n![Five navigation links (News, Things, Stuff, Junk, and About) in a horizontal\
    \ list, with Things hovered hover showing a semi-transparent white rounded box\
    \ underneath.](images/3-08.jpg)\n\nFIG 3.08: The top navigation of our case study,\
    \ enriched with CSS3 when hovered.\n\n### First, the markup\n\nBeing good semanticians,\
    \ we’ll markup the top navigation with a good ol’ unordered list.\n\n```\n<ul\
    \ id=\"nav\">\n  <li><a href=\"#\">News</a></li>\n  <li><a href=\"#\">Things</a></li>\n\
    \  <li><a href=\"#\">Stuff</a></li>\n  <li><a href=\"#\">Junk</a></li>\n  <li><a\
    \ href=\"#\">About</a></li>\n</ul>\n```\n\nNothing earth-shattering here of course—just\
    \ an appropriate structure we can use to start applying styles.\n\n### Floating\
    \ the items\n\nFirst, let’s float the entire list and use a bit of padding to\
    \ position it over to the right of the page; then, let’s also float each list\
    \ item.\n\n```\n#nav {\n  float: right;\n  padding: 42px 0 0 30px;\n  }\n\n#nav\
    \ li {\n  float: left;\n  margin: 0 0 0 5px;\n  }\n```\n\nFIGURE 3.09 shows the\
    \ result. Our list is now horizontal.\n\n![Horizontal list of navigation links\
    \ in the default blue link color with no padding.](images/3-09.jpg)\n\nFIG 3.09:\
    \ A list of links, turned horizontal by a few CSS rules.\n\n### Styling the link\
    \ color with RGBA\n\nNext, let’s add some padding to each link, and change the\
    \ color to a semi-transparent white. We’ll use RGBA to assign white (`255, 255,\
    \ 255`) at 70% opacity (`0.7`), letting the text soak up some of the background\
    \ color behind it (FIG 3.10).\n\n```\n#nav li a {\n  padding: 5px 15px;\n  font-weight:\
    \ bold;\n  color: rgba(255, 255, 255, 0.7);\n  }\n```\n\n![Horizontal list of\
    \ navigation links in a semi-transparent white color and with padding to space\
    \ out the links.](images/3-10.jpg)\n\nFIG 3.10: Links now styled with RGBA, blending\
    \ the text into the background a bit.\n\nFIGURE 3.11 shows a close up of the links,\
    \ where the white at 70% opacity via RGBA lets the background shine through, ever\
    \ so slightly.\n\n![Close-up of the semitransparent links showing the background\
    \ bleeding through a bit. XXXX](images/3-11.jpg)\n\nFIG 3.11: A zoomed-in view\
    \ of the semi-transparent links.\n\n### Providing a backup for RGBA\n\nNow, while\
    \ RGBA is an amazingly flexible way of specifying color along with a level of\
    \ opacity, it’s not supported in all browsers. Current flavors of Safari, Chrome,\
    \ Firefox, and Opera all support it, and it’s available in Internet Explorer 9—but\
    \ what about IE6–8?\n\nHere’s where specifying a *backup* color comes into play.\
    \ When using RGBA to assign color values, it’s good practice to specify a solid\
    \ color first, as a fallback for browsers that don’t yet support RGBA.\n\n```\n\
    #nav li a {\n  padding: 5px 15px;\n  font-weight: bold;\n  color: #ccc; \n  color:\
    \ rgba(255, 255, 255, 0.7);\n  }\n```\n\nBrowsers that *do* support RGBA will\
    \ override the solid color (a light gray `#ccc` in this case), while browsers\
    \ that *don’t* yet support RGBA yet will ignore the RGBA rule.\n\nSo, an important\
    \ point to remember: specify solid backups for RGBA colors in a separate rule\
    \ that appears *before* the RGBA rule.\n\n### Adding text-shadow\n\nFor one last\
    \ addition to the link styling, let’s add a very subtle `text-shadow`. We’ll use\
    \ RGBA again here to define the shadow’s color, letting the semi-transparent black\
    \ at 50% opacity blend into the background behind it.\n\n```\n#nav li a {\n  padding:\
    \ 5px 15px;\n  font-weight: bold;\n  color: #ccc;\n  color: rgba(255, 255, 255,\
    \ 0.7);\n  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5); \n  }\n```\n\nFIGURE 3.12\
    \ shows a comparison of the text links without `text-shadow` applied (left) and\
    \ with `text-shadow` applied (right), as viewed in Safari. It’s an almost imperceptible\
    \ detail, yet the tiny shadow gives the text just enough “lift” off the space\
    \ background behind it.\n\n![Comparison of links without text shadow and links\
    \ with text-shadow, with the slight semi-transparent black text-shadow just barely\
    \ noticeable.](images/3-12.jpg)\n\nFIG 3.12: Comparison of links without `text-shadow`\
    \ applied (left) and with `text-shadow` applied (right).\n\nRemember that `text-shadow`\
    \ works in current versions of Safari, Chrome, Firefox, and Opera. Browsers that\
    \ don’t support `text-shadow` (**cough** IE) will harmlessly ignore the rule.\
    \ No shadow, no problem.\n\nWith the `text-shadow` in place, we’re now free to\
    \ move on to the `:hover` treatment. And here’s where we’ll lean more heavily\
    \ on CSS3.\n\n### Hover and focus styles\n\nWe’re going to add a color change\
    \ and background color to the `:hover` state of each link. Once again, we’ll use\
    \ RGBA to set a semi-transparent white background behind the text on `:hover`.\n\
    \n```\n#nav li a {\n  padding: 5px 15px;\n  font-weight: bold;\n  color: #ccc;\n\
    \  color: rgba(255, 255, 255, 0.7);\n  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);\n\
    \  }\n\n#nav li a:hover,\n#nav li a:focus {\n  color: #fff;\n  background: rgba(255,\
    \ 255, 255, 0.15);\n  }\n```\n\nSo, on `:hover`, we’re changing the text color\
    \ to solid white, and adding a background color of white at 15% opacity. I’ve\
    \ also gone ahead and declared this style for when links are *focused* as well.\
    \ Users navigating with the keyboard, for instance, will then see this change\
    \ when each link is focused.\n\nFIGURE 3.13 shows the new `:hover` (and `:focus`)\
    \ state of the links. Browsers that support RGBA will get the semi-transparent\
    \ white background behind brighter white text.\n\n![Horizontal list of navigation\
    \ links with one link hovered over, showing the square semi-transparent white\
    \ background underneath it. XXX](images/3-13.jpg)\n\nFIG 3.13: Showing the `:hover`\
    \ state, now with a semi-transparent background via RGBA.\n\n### Rounding the\
    \ hover with border-radius\n\nGoing a step further, we could round the corners\
    \ of the hover background using the CSS3 `border-radius` property, creating a\
    \ pill shape for browsers that support it.\n\nRemembering what we learned back\
    \ in [Chapter 1](#chapter1.html) about the `border-radius` property and the vendor\
    \ prefixes that enable us to use it today, we can add our stack to the default\
    \ link declaration like so:\n"
