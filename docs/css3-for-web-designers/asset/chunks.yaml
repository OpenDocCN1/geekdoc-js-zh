    ]:focus {\n  -webkit-animation: pulse 1.5s infinite ease-in-out;\n}\n```\n\n这样，我们就确保了\
    \ `pulse` 动画仅在用户聚焦表单中的文本输入框时运行（仅限 Safari 和 Chrome）。\n\n效果相当惊艳。图 6.17 展示了发生的情况：`box-shadow`\
    \ 缓慢地淡入淡出，仿佛输入框在等待用户交互。\n\n![输入框周围的蓝色光晕淡入淡出的动画的几个步骤。](img/6-17.jpg)\n\n图 6.17：我们添加到文本输入框\
    \ `:focus` 状态的脉冲动画。\n\n我使用了简写属性 `animation` 来在一个规则中设置调用动画的所有值。或者，你也可以用各自的属性分别指定每个值，如下所示：\n\
    \n```\n#thing-alerts input[type=\"text\"]:focus {\n  -webkit-animation-name: pulse;\n\
    \  -webkit-animation-duration: 1.5s;\n  -webkit-animation-iteration-count: infinite;\n\
    \  -webkit-animation-timing-function: ease-in-out;\n}\n```\n\n### 在按钮悬停时复用动画\n\
    \n创建关键帧的一个好处是，它们可以在样式表中的多个声明中重复使用。例如，我们可以将相同的 `pulse` 动画应用于提交按钮的悬停或聚焦状态，添加一种类似\
    \ Wii 的蓝色脉冲光晕。\n\n只需将相同的 `animation` 规则添加到提交按钮的新 `:hover`/`:focus` 声明中即可，就像我们对文本输入框所做的那样：\n\
    \n```\n#thing-alerts input[type=\"submit\"]:hover,\n#thing-alerts input[type=\"\
    submit\"]:focus {\n  -webkit-animation: pulse 1.5s infinite ease-in-out;\n}\n\
    ```\n\n我们之前为文本输入框创建的 `pulse` 动画会淡入淡出蓝色 `box-shadow`——但在这里我们也可以将其用于按钮，效果同样出色（图\
    \ 6.18），在悬停或聚焦时柔和地发光，仿佛在等待用户提交。\n\n![提交按钮周围的蓝色光晕淡入淡出的动画的几个步骤。](img/6-18.jpg)\n\
    \n图 6.18：按钮悬停时其背后阴影的脉冲效果。\n\n### 其他浏览器呢？\n\n添加 CSS 动画是本书中第一次真正只针对一个浏览器厂商（WebKit）来丰富体验。我们看到\
    \ CSS3 被越来越多地使用的一个主要原因，是它被 Firefox、Opera 甚至 IE9 所采纳。你可能会问，现在添加 CSS 动画是否值得。这确实值得考虑。\n\
    \n要么 CSS 动画仍然是 WebKit 独有的技术，要么它会像过渡和变换一样被其他浏览器采纳。无论如何，CSS 动画简单、开销小，并且不支持它们的浏览器会安全地忽略它们。我在这里演示的动画相当基础，只是触及了仅用标记和样式表在屏幕上实现可能性的皮毛。这令人兴奋，仅凭这一点就值得尝试。\n\
    \n## 聚焦交互\n\n表单元素很少同时是关键的品牌元素，而这正是用 CSS3 增强表单的绝佳机会。\n\n表单元素的外观因用户环境而异——但我们可以选择用高级\
    \ CSS 来丰富它们，同时知道在不支持 CSS3 的浏览器中，它们会优雅降级为功能完整、熟悉且默认的表单控件。\n\n14. 长链接：[`www.456bereastreet.com/archive/200601/css_3_selectors_explained/`](http://www.456bereastreet.com/archive/200601/css_3_selectors_explained/)\
    \ [[↵]](#chapter6.html_footnote-14-backlink)\n\n15. 长链接：[`www.quirksmode.org/css/contents.html`](http://www.quirksmode.org/css/contents.html)\
    \ [[↵]](#chapter6.html_footnote-15-backlink)\n\n16. 长链接：[`msdn.microsoft.com/en-us/library/cc351024(VS.85).aspx`](http://msdn.microsoft.com/en-us/library/cc351024(VS.85).aspx)\
    \ [[↵]](#chapter6.html_footnote-16-backlink)\n\n17. 长链接：[`www.westciv.com/tools/gradients/index-moz.html`](http://www.westciv.com/tools/gradients/index-moz.html)\
    \ [[↵]](#chapter6.html_footnote-17-backlink)\n\n18. 长链接：[`snook.ca/archives/html_and_css/multiple-bg-css-gradients`](http://snook.ca/archives/html_and_css/multiple-bg-css-gradients)\
    \ [[↵]](#chapter6.html_footnote-18-backlink)\n\n19. 长链接：[`www.w3.org/TR/CSS3-animations/`](http://www.w3.org/TR/CSS3-animations/)\
    \ [[↵]](#chapter6.html_footnote-19-backlink)\n\n![第 7 章：结论](img/chap-7.png)\n\n\
    好了，现在让我们回到现实，放松一下。\n\n我们已经介绍了许多（如果我可以这么说的话）在当前日常工作中使用 CSS3 的绝妙方法。我希望通过展示这些技术如何在支持它们的浏览器中增强体验层，同时在不支持的浏览器中优雅降级，能够激励你在日常工作中使用它们，无论你正在做什么项目。\n\
    \nCSS3 的真正承诺在于，它使我们能够更高效地解决常见的设计问题，用更少的代码和更多的灵活性。只要你（以及你的客户和老板）能够接受网站在访问它们的浏览器和设备上可能看起来和体验不同，那么就没有上限。大胆去做吧。\n\
    \n我在第 1 章中提到过，我经常听到“我等不及要用 CSS3 了——等它完成的时候”。我写这本书的目标就是证明你不需要等待。现在就开始尝试这些东西吧。开始在你的设计中将\
    \ CSS3 用于非关键的视觉事件。既然你已经掌握了哪些有效，更重要的是，当它们无效时如何降级，你就可以轻松地用几行 CSS 实现以前需要更多时间和代码才能完成的事情。\n\
    \n## 那些不理解 CSS3 的客户和老板怎么办？\n\n另一个我在谈论 CSS3 时经常被问到的问题是，如何在客户项目中使用它。如何教育客户使用 CSS3\
    \ 相比其他解决方案的好处？教育是最有帮助的：向客户展示代码和图片减少了多少。向他们展示在不支持 CSS3 的浏览器中体验有何不同。向他们解释权衡。\n\n\
    如果这听起来太麻烦，那就*直接去做*。\n\n开始在你的日常工作中添加 CSS3，让你的客户和老板愉快地发现它。事实上，我在本书中演示的许多例子都是在浏览网站时发现的：悬停、聚焦、交互等。这当然是有意为之。\n\
    \n通常，在我自己的客户项目中，我会在不提一个字的情况下将这种体验增强添加到项目中，当客户偶然发现时，会感到惊喜和愉悦。更重要的是，当客户的*访客*偶然发现时，也会感到惊喜和愉悦。\n\
    \n要让它在所有能想到的浏览器中工作？嗯，那得额外收费。咳咳。\n\n## 展望未来\n\n未来呢？整个 CSS3 涵盖的内容远不止这本小书所能覆盖的。我想非常专注于当前实际可用的内容，避免那些仍在其他模块中讨论、可能尚未广泛实现的部分。\n\
    \n但趋势是积极的。几乎在 WebKit、Mozilla 和 Opera 的每一个新版本中，都在添加新的属性支持。这种通过厂商前缀的快速采用正在推动创新。关注新特性，并观察这些前瞻性浏览器在实现上的临界点，可以帮助你了解实际应用。\n\
    \n"
- fmt: '

    We also have exciting times ahead by way of IE9 Beta. Yes, I really did say that.
    We’re seeing more and more CSS3 support being added to Internet Explorer, and
    that means all good things.


    Eventually, we’ll be able to rely on CSS3 not only for experience enhancement,
    but for those critical visual concepts as well (layout being a primary example).
    It’s been a seemingly slow path to get there, but that’s necessary for things
    to unfold correctly. While on that slow path, don’t hesitate to grab hold and
    use what works in the present. You, your clients, and the web’s citizens will
    benefit.


    ## Further reading and resources


    CSS3.info has long been rounding up news, examples, and developments: [http://www.CSS3.info](http://www.css3.info)


    Also see their preview section for demos of specific properties: [http://www.CSS3.info/preview](http://www.css3.info/preview)


    Earlier, I told you not to read the specs, but for a relevant big picture view,
    to prepare for what’s ahead, and to see which modules are in what state (Working
    Draft, Candidate Recommendation, etc.), look here: [http://www.w3.org/Style/CSS/current-work](http://www.w3.org/Style/CSS/current-work)


    Or, go here for more on the modules themselves, how they’re broken up, and what
    they contain: [http://www.w3.org/TR/CSS3-roadmap](http://www.w3.org/TR/CSS3-roadmap)


    The development blogs for all the major browsers are a fantastic place to keep
    up on what’s being implemented and when. I highly recommend subscribing to keep
    abreast of what’s being adopted, rejected, and experimented with: [http://webkit.org/blog](http://webkit.org/blog),
    [http://blog.mozilla.com](http://blog.mozilla.com), [http://dev.opera.com/articles/css](http://dev.opera.com/articles/css),
    [http://blogs.msdn.com/b/ie](http://blogs.msdn.com/b/ie)


    Several sites have emerged to help understand browser compatibility and identify
    which versions support which properties: [http://caniuse.com](http://caniuse.com),
    [http://www.quirksmode.org/css/contents.html](http://www.quirksmode.org/css/contents.html),
    [http://html5readiness.com](http://html5readiness.com) *Don’t let the URL fool
    you, as it contains CSS3 info as well*.


    A number of browser-based tools provide a visual environment for creating the
    currently supported syntax, and serve as great learning tools: [http://CSS3generator.com](http://css3generator.com),
    [http://CSS3please.com](http://css3please.com), [http://gradients.glrzad.com](http://gradients.glrzad.com),
    [http://tools.westciv.com](http://tools.westciv.com), [http://border-radius.com](http://border-radius.com)


    And finally, JavaScript solutions can assist in broadening the support for CSS3
    to many additional browsers. For critical visual events that need to work everywhere
    using today’s CSS3, there are options: [http://www.modernizr.com](http://modernizr.com),
    [http://ecsstender.org](http://ecsstender.org), [http://selectivizr.com](http://selectivizr.com)
    *A pseudo-class selector emulation for IE5.5-8*.


    Thanks for reading! Now go build wonderful things. Dream big and implement small.


