  trans: "\n正如我之前提到的，过渡效果最初由 WebKit 开发，自 Safari 和 Chrome 3.2 版本起就已支持，而 Opera 在 10.5\
    \ 版本中也提供了支持（[`bkaprt.com/css3/4/`](http://bkaprt.com/css3/4/)）^(5)，并且 Firefox\
    \ 4.0 已承诺支持（[`bkaprt.com/css3/5/`](http://bkaprt.com/css3/5/)）。^(6)\n\n由于当前及近期的支持情况，添加适当的厂商前缀至关重要，这样我们的过渡效果就能在更多浏览器中随着支持的推出而生效。\n\
    \n## 构建完整的过渡堆栈\n\n以下是修订后的声明，添加了 `–moz-` 和 `–o-` 前缀以及实际的 CSS3 `transition` 属性。同样，我们将无前缀的属性放在堆栈的最后，以确保当该属性从草案变为最终状态时，最终实现将优先于其他实现。\n\
    \n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition:\
    \ background 0.3s ease; \n  -moz-transition: background 0.3s ease;\n  -o-transition:\
    \ background 0.3s ease; \n  transition: background 0.3s ease; \n  }\n\na.foo:hover\
    \ {\n  background: #690;\n  }\n```\n\n有了这个堆栈，我们就能在当前版本的 Safari、Chrome 和 Opera\
    \ 中平滑地改变背景色，并且在未来任何选择支持该特性的浏览器中也能实现。\n\n## 过渡状态\n\n我记得刚开始尝试 CSS 过渡时有点困惑。将过渡属性放在\
    \ `:hover` 声明中不是更合理吗？因为那是触发过渡的条件。答案是元素除了 `:hover` 之外还有其他可能的状态，而你很可能希望过渡在每个状态上都发生，而无需重复声明。\n\
    \n例如，你可能希望过渡也发生在链接的 `:focus` 或 `:active` 伪类上。与其将过渡属性堆栈添加到每个声明中，不如将过渡指令附加到正常状态，这样只需声明一次。\n\
    \n下面的示例为 `:focus` 状态添加了相同的背景切换。这样，无论是通过悬停还是聚焦链接（例如通过键盘），都能触发过渡。\n\n```\na.foo\
    \ {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition: background\
    \ 0.3s ease;\n  -moz-transition: background 0.3s ease;\n  -o-transition: background\
    \ 0.3s ease;\n  transition: background 0.3s ease;\n  }\n\na.foo:hover,\na.foo:focus\
    \ {\n  background: #690;\n  }\n```\n\n## 过渡多个属性\n\n假设除了背景色，我们还想改变链接的文本颜色并对其进行过渡。我们可以通过用逗号分隔多个过渡来实现。每个过渡可以有不同的持续时间和缓动函数（图\
    \ 2.03）。\n\n```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition:\
    \ background .3s ease, color 0.2s linear;\n  -moz-transition: background .3s ease,\
    \ color 0.2s linear;\n  -o-transition: background .3s ease, color 0.2s linear;\n\
    \  transition: background .3s ease, color 0.2s linear;\n  }\n\na.foo:hover,\n\
    a.foo:focus {\n  color: #030;\n  background: #690;\n  }\n```\n\n![正常状态（浅绿色背景，白色文字）和悬停状态（深绿色背景，黑色文字）](img/2-03.jpg)\n\
    \n图 2.03：链接的正常状态和 `:hover` 状态。\n\n## 过渡所有可能的属性\n\n另一种列出多个属性的方法是使用 `all` 值。这将过渡所有可用的属性。\n\
    \n让我们将 `all` 放入简单的示例中，而不是分别列出 `background` 和 `color`。现在它们将共享相同的持续时间和缓动函数。\n\n\
    ```\na.foo {\n  padding: 5px 10px;\n  background: #9c3;\n  -webkit-transition:\
    \ all 0.3s ease;\n  -moz-transition: all 0.3s ease;\n  -o-transition: all 0.3s\
    \ ease;\n  transition: all 0.3s ease;\n  }\n\na.foo:hover,\na.foo:focus {\n  color:\
    \ #030;\n  background: #690;\n  }\n```\n\n这是一种便捷的方式，可以捕获 `:hover`、`:focus` 或 `:active`\
    \ 事件中发生的所有变化，而无需列出每个你想要过渡的属性。\n\n## 哪些 CSS 属性可以过渡？\n\n现在我们已经成功过渡了超链接的 `background`\
    \ 和 `color`，还有许多其他 CSS 属性也可以过渡，包括 `width`、`opacity`、`position` 和 `font-size`。W3C\
    \ 提供了所有可过渡属性（及其类型）的图表（[`bkaprt.com/css3/6/`](http://bkaprt.com/css3/6/)）。^(7)\n\
    \n实现流畅体验的机会显而易见。在下一章及后续的案例研究示例中，我们将结合过渡使用其中几个属性。\n\n## 为什么不改用 JavaScript？\n\n\
    你可能会想，既然并非所有浏览器都支持（或至少承诺支持）CSS 过渡，为什么不使用 JavaScript 解决方案来处理动画呢？流行的框架如 jQuery、Prototype\
    \ 和 script.aculo.us 已经通过 JavaScript 实现了跨浏览器动画，并且已经有一段时间了。\n\n这完全取决于过渡对体验的重要性。在这本小书中，我强调如果你选择用户体验中合适的部分来应用\
    \ CSS3，就可以拥抱它的简洁性和灵活性：丰富页面上发生的交互。通常，由 CSS 过渡处理的这些交互动画对网站的品牌、可读性或布局并非不可或缺。因此，用几行简单的\
    \ CSS 来触发一个简单的动画，该动画在支持它的浏览器中是*原生*的（而不是依赖 JavaScript 框架），似乎是一个明智的选择。我很高兴我们拥有这个选择。\n\
    \n## 明智而微妙\n\n就像所有闪亮的新工具一样，*恰当地*使用过渡非常重要。很容易过度使用，将过渡添加到页面上的所有元素，结果变成某种烦人、脉动的怪物。关键在于决定哪些地方过渡能真正丰富用户体验，哪些地方只是多余的噪音。此外，确保过渡的速度不会拖慢用户原本敏捷的操作至关重要。请谨慎使用。\n\
    \n关于 CSS 过渡和动画的合适速度的更多思考，请参阅 Trent Walton 的相关文章：[`bkaprt.com/css3/7/`](http://bkaprt.com/css3/7/)。^(8)\n\
    \n现在我们已经对 CSS 过渡在技术层面上的工作原理有了扎实的基础知识，我们可以用它们来平滑后续示例中的体验层，从下一章开始。让我们开始吧。\n\n4\\\
    . 长 URL：[`www.w3.org/TR/CSS3-transitions/`](http://www.w3.org/TR/CSS3-transitions/)\
    \ [[↵]](#chapter2.html_footnote-4-backlink)\n\n5\\. 长 URL：[`www.opera.com/docs/specs/presto23/css/transitions/`](http://www.opera.com/docs/specs/presto23/css/transitions/)\
    \ [[↵]](#chapter2.html_footnote-5-backlink)\n\n6\\. 长 URL：[`developer.mozilla.org/en/CSS/CSS_transitions`](https://developer.mozilla.org/en/CSS/CSS_transitions)\
    \ [[↵]](#chapter2.html_footnote-6-backlink)\n\n7\\. 长 URL：[`www.w3.org/TR/css3-transitions/#properties-from-css-`](http://www.w3.org/TR/css3-transitions/#properties-from-css-)\
    \ [[↵]](#chapter2.html_footnote-7-backlink)\n\n8\\. [`trentwalton.com/2010/03/22/CSS3-in-transition/`](http://trentwalton.com/2010/03/22/CSS3-in-transition/)\
    \ [[↵]](#chapter2.html_footnote-8-backlink)\n\n![第 3 章：使用 CSS3 进行悬停设计](img/chap-3.png)\n\
    \n我们在前两章进行了训练，了解了当前 CSS3 中可用的功能。我们还讨论了*体验层*目前是应用这些可用 CSS3 最合适的地方。\n\n"
- fmt: '

    To recap the important bits we’ve covered so far, let’s keep in mind that:


    1.  There are core CSS3 properties that are usable today.


    2.  Everyone can use these core properties in their own projects, especially when
    targeted at the experience layer.


    3.  Vendor prefixes allow us to push forward right now, helping test in-flux properties
    in real-world contexts.


    4.  CSS Transitions are no longer proprietary experiments, but draft specifications
    that other browsers are embracing. Let’s use ’em!


    With all of this under our anti-gravity belts, it’s now time to have fun with
    all our new tools, and put them to work in the context of a full-page design.


    ## Our case study


    For most of the following examples I’ll be using a fictional case study I’ve designed:
    a humorous homage to all the things left on the moon by the astronauts lucky enough
    to have traveled there (FIG 3.01). There’s a story behind the subject matter that
    directly relates to the theme of this book, if you’ll bear with me for just a
    bit.


    ![Screenshot of the website Things We Left on the Moon.](images/3-01.jpg)


    FIG 3.01: Our fictional case study, *Things We Left on the Moon*.


    ### Messages in space and on the web


    In 1969, astronauts Neil Armstrong and Buzz Aldrin became the first humans to
    set foot on the moon. I’ve been a casual fan of space travel and the NASA program,
    but hearing more about the Apollo 11 mission around the fortieth anniversary inspired
    me to read more about the history and events surrounding the landing. In particular,
    I was fascinated by all the stuff that was left on the moon and remains up there
    to this day.


    Out of all the objects that have been left behind, there’s one in particular that
    I found extremely interesting, and it serves as a wonderful example of user experience
    design. It’s a small, silicon disc (about the size of a US half dollar). Etched
    on the disc are goodwill messages from the leaders of over seventy countries from
    around the world. You need a microscope to read them, but limitations in regard
    to what the astronauts could bring with them helped shape the design of a commemorative
    object that could be left on the moon for future visitors to discover (FIG 3.02).


    ![Photo of the small silicon disk left on the moon, nearly the same size as the
    U.S. half-dollar photographed next to it. The silicon disk has the words &quot;From
    Planet Earth, July 1969&quot; etched on it. Tiny markings are visible in the center
    of the disc.](images/3-02.jpg)


    FIG 3.02: The small (about the size of a U.S. half-dollar) silicon disc left on
    the moon by the Apollo 11 astronauts. (NASA/courtesy of nasaimages.org)


    NASA was, in a sense, designing an object using the latest technology available
    at the time, for an unknown audience sometime in the future. Sound familiar?


    Later, in 1977, a similar design problem was solved for the Voyager 1 and Voyager
    2 spacecraft by way of the Golden Record: a gold-plated copper phonograph record
    that contains audio, images, and diagrams from life here on Earth (FIG 3.03).
    In a sense the record is a message in a bottle to potential civilizations beyond
    our solar system. On its case is etched, in symbolic language, how to properly
    play the record, where in the galaxy it came from, and other instructions.


    ![Photo of the case for the Golden Record, with etchings of mathematical figures.](images/3-03.jpg)


    FIG 3.03: The gold-plated outer case of the Golden Record, a phonograph record
    aboard the Voyager 1 and 2 spacecraft. (Courtesy NASA/JPL-Caltech)


    Like the silicon disc still resting in moon dust, the Golden Record was designed
    using the latest technology on hand at the time it was made, for a user experience
    with numerous unknowns. Would the alien retrievers of the record be able to see,
    feel, and listen to its contents?


    We can learn a lot from the silicon disc left on the moon and the Golden Record
    hurtling into deep space—that utilizing the best technology possible can help
    support the message being sent to a largely unknown audience.


    As web designers, we too are sending messages in a bottle when we create things
    for the web. We can make assumptions about who will be reading them, what they’re
    actually capable of understanding, etc.—but we’re never 100% informed. That shouldn’t
    prevent us from using the best technology available to deliver that message and
    the experience around it, letting the experience degrade gracefully in older or
    less capable devices.


    Our job as designers is not to simply dress up the bottle and make it look pretty,
    but rather to find ways to enrich the story and enhance the message. CSS3 can
    help us do that today.


    So now you know why our case study pays homage to those messages left on the moon
    or floating through space. It’s time to start dissecting the site, breaking it
    into bite-sized examples as they pertain to CSS3\. I find it helpful to collect
    all the techniques we’ll be discussing in a single place. You’ll be able to reference
    this template and all the examples whenever you’d like in a living, breathing,
    one-page website.


    You can download the case study’s example code at [http://CSS3exp.com/code](http://CSS3exp.com/code).


    Each of the remaining chapters tackles a different set of examples related to
    CSS3\. Instead of attempting to be all inclusive, telling you everything there
    is to know about CSS3, I’m doing quite the opposite here: diving into very specific,
    targeted examples, while showing how they work in a simulated context—quick takeaways
    that you’ll be able to apply immediately and build upon after digesting these
    pages. *Burp.*


    ## Surprise and delight


    Part of what makes designing for the web so different and interesting as opposed
    to static media is *interaction*. Things can react, move, and even surprise when
    experienced in pixels rather than paper.


    And it’s the interaction that’s so easily enhanced by CSS3 for browsers that support
    it, yet not missed by those that don’t.


    A wonderful example of surprising and delighting with CSS3 can be found on Dutch
    designer and developer Faruk Ateş’s personal site ([http://farukat.es](http://farukat.es)).
    In the sidebar is a list of links to various social networks that, on hover, expand
    and come alive with several CSS3 treatments and a smooth transition (FIG 3.04).


    ![The normal state (text with images floated to the right) of the sidebar on Faruk
    Ate\u0327''s site and the hover state (blue background color added, image moved
    to the right with a rounded edge).](images/3-04.jpg)


    FIG 3.04: The sidebar and hover treatment found on Faruk Ateş’s site.


    What looks like a normal list of text with images floated off to the right turns
    into something far more interesting when you interact with it. This is a prime
    example of enriching the experience layer, and Faruk uses a variety of CSS3 properties
    in order to make that happen (in the browsers that support them).


    FIGURE 3.05 shows the same default and hover state as viewed in Internet Explorer
    7, which doesn’t support CSS3 at all. But you’ll notice that, while the hover
    state isn’t as polished, it’s still a usable, readable, and *functional* experience—not
    to mention the default, non-hovered state is nearly identical.


    ![The normal state (text with images floated to the right) of the sidebar on Faruk
    Ate\u0327''s site and the hover state (blue background color added, no animation
    or rounded corners).](images/3-05.jpg)


    FIG 3.05: Viewed in IE7, Faruk Ateş’s site doesn’t feature the same visual treatment
    via CSS3, but that’s perfectly OK.


    Hovering over (or focusing on) an element is a wonderful place to enhance things
    with CSS3\. Users of Internet Explorer will get a different experience (until
    it eventually folds in support for CSS3 properties). But this alternate experience
    is perfectly fine, not unexpected, and frankly IE users won’t know what they’re
    missing.


    That is, until they fire this up in their friend’s copy of Safari, Chrome, Firefox,
    or Opera (and feel a flush of jealousy).

