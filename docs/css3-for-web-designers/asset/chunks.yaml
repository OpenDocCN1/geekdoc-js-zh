    ## About A Book Apart


    Web design is about multi-disciplinary mastery and laser focus, and that’s the
    thinking behind our brief books for people who make websites. We cover the emerging
    and essential topics in web design and development with style, clarity, and, above
    all, brevity—because working designer-developers can’t afford to waste time.


    The goal of every title in our catalog is to shed clear light on a tricky subject,
    and do it fast, so you can get back to work. Thank you for supporting our mission
    to provide professionals with the tools they need to move the web forward.


    ## About the Author


    ![Dan Cederholm dressed in an astronaut costume](images/cedernaut.jpg)


    Dan Cederholm is a web designer, author, husband and father living in Salem, Massachusetts.
    He’s the founder of SimpleBits, a tiny design studio. A recognized expert in the
    field of standards-based web design, Dan has worked with YouTube, MTV, Google,
    Yahoo, ESPN, Fast Company, Blogger, and others. He embraces flexible, adaptable
    design using web standards through his design work, writing, and speaking.


    Dan is co-founder and designer of Dribbble, a community for designers sharing
    what they’re working on in real time. Previously, he co-founded Cork’d, the web’s
    first social network for wine aficionados.


    Dan is the author of three bestselling books: *Handcrafted CSS* (New Riders),
    *Bulletproof Web Design*, Second Edition (New Riders) and *Web Standards Solutions*,
    Special Edition (Friends of ED). He also plays a mean ukulele and is merely a
    casual fan of space travel.


    Author photo courtesy John Morrison, NASA, and Photoshop.

