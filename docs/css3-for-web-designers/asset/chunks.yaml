  trans: "\n\n为每个项目添加适当的变换/过渡不仅有趣且易于实现，而且对于尚未支持实现交互所需的 CSS3 特性的浏览器也无害。\n\n让我们逐一查看每个项目，了解如何将`scale`、`rotate`、定位和`opacity`与过渡结合，以完成整个体验。\n\
    \n### 支持信息传达\n\n如果我们思考每个链接项目，特别是它们的*含义*，就可以应用一种变换和/或过渡来支持该对象所讲述的故事。\n\n一个大甜甜圈或躺椅会对交互做出怎样的反应？我们可以选择在这里应用适当的\
    \ CSS3 来丰富体验（图 4.17）。\n\n![旋转木马中的五个物品，背景为月球：一个大甜甜圈、一台割草机、一只戴着宇航员头盔的猫（“太空猫”）、一把毛绒躺椅和一个草坪侏儒。所有图片都放置在月球背景上。](img/4-17.jpg)\n\
    \n图 4.17：我们将要变换的物品。\n\n### 标记\n\n为了标记这个古怪物品的伪旋转木马，语义非常简单：只是一个包含链接图片的有序列表，下方有一个标题描述每个物品是什么。\n\
    \n```\n<ol id=\"things\">\n  <li id=\"things-1\">\n    <a href=\"#\"><img src=\"\
    img/doughnut.png\" /></a>\n    <h2>1 big doughnut</h2>\n  </li>\n  <li id=\"things-2\"\
    >\n    <a href=\"#\"><img src=\"img/mower.png\" /></a>\n    <h2>1 lawnmower</h2>\n\
    \  </li>\n  <li id=\"things-3\">\n    <a href=\"#\"><img src=\"img/cat.png\" /></a>\n\
    \    <h2>1 astro cat</h2>\n  </li>\n  <li id=\"things-4\">\n    <a href=\"#\"\
    ><img src=\"img/recliner.png\" /></a>\n    <h2>1 recliner</h2>\n  </li>\n  <li\
    \ id=\"things-5\">\n    <a href=\"#\"><img src=\"img/gnome.png\" /></a>\n    <h2>1\
    \ magic gnome</h2>\n  </li>\n</ol>\n```\n\n注意，我们为列表本身添加了`id`为`#things`，并为每个列表项也添加了`id`，这样我们就可以为每个项目的`:hover`状态添加独特的交互。\n\
    \n### 每个项目的基础样式\n\n接下来，我们将为包含链接图片的每个列表项添加基础 CSS。以下样式将项目浮动以使其水平排列，设置相对定位作为上下文，以便稍后对每个图片进行绝对定位，最后添加一个圆角半透明背景框。\n\
    \n```\nol#things li {\n  position: relative;\n  float: left;\n  margin: 0 15px\
    \ 0 0;\n  padding: 10px;\n  background: #444; /* backup for non-RGBA */\n  background:\
    \ rgba(255, 255, 255, 0.1);\n  list-style: none;\n  -webkit-border-radius: 4px;\n\
    \  -moz-border-radius: 4px;\n  -o-border-radius: 4px;\n  border-radius: 4px;\n\
    \  }\n```\n\n现在我们将设置每个项目后面出现的月球背景图片，并为每个链接指定具体的`width`和`height`（图 4.18）。\n\n```\n\
    ol#things li a {\n  float: left;\n  width: 137px;\n  height: 91px;\n  background:\
    \ url(../img/moon-137.jpg) no-repeat top left;\n  }\n```\n\n![旋转木马中第一个图片位置的近景，显示标签“1\
    \ Big Doughnut”和月球背景。](img/4-18.jpg)\n\n图 4.18：列表项，现在带有月球背景图片。\n\n### 通用声明\n\n\
    下一步是创建一个通用声明，将每个图片绝对定位在列表项的框架内，从而位于月球背景图片之上。\n\n我们将根据对象的不同，对每个项目进行略微不同的定位，并使用不同的变换，但我们可以在这里为*所有*图片声明`position:\
    \ absolute;`，这样就不必为每个项目重复该规则。我们还将使用`all`值添加一个过渡堆栈。这样，无论我们决定更改哪些 CSS 属性，我们对每个物品所做的任何变换或更改都将被过渡并平滑处理。\n\
    \n```\nol#things li a img {\n  position: absolute;\n  -webkit-transition: all\
    \ 0.2s ease-in;\n  -moz-transition: all 0.2s ease-in;\n  -o-transition: all 0.2s\
    \ ease-in;\n  transition: all 0.2s ease-in;\n  }\n```\n\n现在，我们可以利用添加到每个列表项的`id`，为每个图片添加精确的定位和宽度。\n\
    \n```\nol#things li#things-1 a img { \n  width: 60px;\n  top: 23px;\n  left: 26px;\n\
    \  }\n\nol#things li#things-2 a img { \n  width: 50px;\n  top: 20px;\n  left:\
    \ 50px;\n  }\n\nol#things li#things-3 a img { \n  width: 80px;\n  top: 19px;\n\
    \  left: 30px;\n  }\n\nol#things li#things-4 a img { \n  width: 70px;\n  top:\
    \ 25px;\n  left: 45px;\n  }\n\nol#things li#things-5 a img { \n  width: 80px;\n\
    \  top: 20px;\n  left: 34px;\n  }\n```\n\n我将这些图片做得偏大，这样如果我们想放大它们，可以在不拉伸图片超出其原始尺寸的情况下进行。\n\
    \n现在，我们将为每个项目添加独特的`:hover`处理，知道通用过渡会平滑并动画化我们加入的任何效果。\n\n### 放大甜甜圈\n\n大甜甜圈在悬停时会变大，因此我们将使用`scale`变换来放大图片。请记住，标记中的原始图片比我们在样式表中缩小后的尺寸要大得多。这是有意为之，这样我们就可以像这样放大它。\n\
    \n```\nol#things li#things-1 a:hover img {\n  -webkit-transform: scale(1.25);\n\
    \  -moz-transform: scale(1.25);\n  -o-transform: scale(1.25);\n  transform: scale(1.25);\n\
    \  }\n```\n\n这些规则将使甜甜圈在悬停时放大 25%。图 4.19 显示了正常状态和悬停状态，甜甜圈在鼠标悬停时变得稍大。\n\n![大甜甜圈在悬停前后的图片；悬停时，甜甜圈变大。](img/4-19.jpg)\n\
    \n图 4.19：大甜甜圈在`:hover`时使用`scale`变大。\n\n### 使用缩放和定位实现透视效果\n\n对于留在月球上的割草机，我们将做两件事：\n\
    \n1. 使用变换将其放大。\n2. 将其向下和向右移动。\n\n这两个变化加上过渡，使割草机看起来像是朝你冲过来（小心！）。效果非常微妙，但简单有效。\n\
    \n我们将默认位置向下调整 5 像素，向右调整 10 像素。同时添加一个变换堆栈，将割草机放大到比默认大 20%。\n\n```\nol#things li#things-2\
    \ a:hover img {\n  top: 25px;\n  left: 60px;\n  -webkit-transform: scale(1.2);\n\
    \  -moz-transform: scale(1.2);\n  -o-transform: scale(1.2);\n  transform: scale(1.2);\n\
    \  }\n```\n\n图 4.20 显示了默认状态和悬停状态，割草机朝你冲来的错觉就完成了。\n\n![割草机在悬停前后的图片；悬停时，它向前移动并变大。](img/4-20.jpg)\n\
    \n图 4.20：割草机使用定位和`scale`创建伪三维效果。\n\n### 难以捉摸的太空猫\n\n我们可以在大量属性（不仅仅是 CSS3 属性）上添加\
    \ CSS 过渡；仅仅平滑*位置*变化就可以让太空猫看起来像是在躲避鼠标。\n\n通过调整悬停时图片的`left`位置，通用过渡将平滑该移动，使太空猫看起来像是在来回滑动。\n\
    \n这里我们将`left`值从`30px`增加到`45px`，将猫向右移动 15 像素（图 4.21）：\n\n```\nol#things li#things-3\
    \ a:hover img {\n  left: 45px;\n  }\n```\n\n![猫在悬停前后的图片；悬停时，猫向右滑动。](img/4-21.jpg)\n\
    \n图 4.21：猫来回滑动，就像猫经常做的那样。\n\n非常简单。实际上，CSS 过渡才是这里施展魔法的关键。\n\n### 向后倾斜的躺椅\n\n一把好的躺椅会向后倾斜，我们可以使用前面提到的`rotate`变换来模拟这种现实世界的反应。\n\
    \n让我们添加变换堆栈，将躺椅稍微向左旋转。我们将使用针对 WebKit、Mozilla 和 Opera 浏览器的厂商前缀规则，并以实际的`transform`属性结尾，以备将来实现。\n\
    \n```\nol#things li#things-4 a:hover img {\n  -webkit-transform: rotate(-15deg);\n\
    \  -moz-transform: rotate(-15deg);\n  -o-transform: rotate(-15deg);\n  transform:\
    \ rotate(-15deg);\n  }\n```\n\n"
- fmt: "\nWe used a *negative* value to tip the image to the left (counter-clockwise),\
    \ and once again the transition will smooth out that subtle rotation, completing\
    \ the illusion of our comfy, plushy chair on the moon (FIG 4.22).\n\n![The recliner\
    \ before and after hover; on hover, the recliner tips back.](images/4-22.jpg)\n\
    \nFIG 4.22: The recliner tips back to the left using a negative value on the `rotate`\
    \ transform.\n\n### The disappearing gnome\n\nFor the final item, we’ll take a\
    \ lounging gnome and make him partially disappear. Somehow, that seems like a\
    \ perfectly natural thing for a gnome to do.\n\nWe’ll use the `opacity` property\
    \ to simply and quickly create a hover style for the image, dimming it down considerably.\
    \ Because of the transition already in place for all property changes on the image,\
    \ the `opacity` swap will animate in browsers that support transitions, creating\
    \ a smooth disappearance for our little friend.\n\nThe declaration is simply:\n\
    \n```\nol#things li#things-5 a:hover img {\n  opacity: 0.4;\n  }\n```\n\nFIGURE\
    \ 4.23 shows how the gnome fades out to 40% opacity on `:hover`.\n\n![The gnome\
    \ before and after hover; on hover, the gnome nearly vanishes and the moon background\
    \ can be seen through him.](images/4-23.jpg)\n\nFIG 4.23: The gnome *almost* disappears\
    \ by reducing `opacity` on `:hover`.\n\nNow, remember, if we wanted this effect\
    \ to work (sans transitions) in Internet Explorer, we could revisit the proprietary\
    \ `filter` property hack explained in [Chapter 3](#chapter3.html).\n\n### Harmless\
    \ degradation\n\nLike the photo gallery example we discussed earlier in the chapter,\
    \ the sprinkling of CSS3 we’re adding here is harmless for browsers that don’t\
    \ yet support it.\n\nIn the end, the important thing here is that each of these\
    \ items is a clickable link. What happens beyond that is an enriched experience\
    \ for those that are capable of receiving it.\n\n## One more time now: be smart,\
    \ be subtle\n\nBy taking a little time to think about the *meaning* behind the\
    \ content we’re dealing with, we can choose to apply some of the CSS3 properties\
    \ that work today along with transitions and transforms.\n\nThese experience enhancements\
    \ can be the mark of a true web craftsperson: attention to details that not everyone\
    \ will notice, care and feeding for non-critical visual events, and elevating\
    \ the message a step beyond the norm. For browsers that support this stuff now,\
    \ and those that will in the future, the small amount of code and thought is well\
    \ worth it.\n\nTry and be subtle when it comes to CSS transforms. It’s easy to\
    \ get carried away, but when used appropriately, they can make all the difference\
    \ in the way the reader experiences the message you’re delivering.\n\n### More\
    \ “wow,” please\n\nSpeaking of getting carried away, the next time your client\
    \ or boss says, “this design needs more ‘wow’” or “it’s missing some pizzazz!”\
    \ just add the following declaration to your stylesheet (and make sure they’re\
    \ using Safari, Chrome, Firefox, or Opera, of course):\n\n```\n*:hover {\n  -webkit-transform:\
    \ rotate(180deg);\n  -moz-transform: rotate(180deg);\n  -o-transform: rotate(180deg);\n\
    \  transform: rotate(180deg);\n  }\n```\n\nThis little bit of CSS3 says, “hover\
    \ over anything on the page, and rotate it 180 degrees.” Try it. It’s a sure-fire\
    \ way to make a big impression (FIG 4.24).\n\n![The Things We Left on the Moon\
    \ website with many parts of it upside down and rotated.](images/4-24.jpg)\n\n\
    FIG 4.24: The chaos that results from the “rotate everything on hover” trick.\n\
    \nActually, the sad thing is that there are some clients and bosses that might\
    \ *love* this.\n\n“This is great! Ship it!”\n\n*Sigh.*\n\n9\\. [http://www.w3.org/TR/CSS3-2d-transforms/#abstract](http://www.w3.org/TR/CSS3-2d-transforms/#abstract)\
    \ [[↵]](#chapter4.html_footnote-9-backlink)\n\n10\\. The long URL: [http://www.w3.org/TR/css3-2d-transforms/#transform-origin](http://www.w3.org/TR/css3-2d-transforms/#transform-origin)\
    \ [[↵]](#chapter4.html_footnote-10-backlink)\n\n![Chapter 5: Multiple Backgrounds](images/chap-5.png)\n\
    \nIf you asked me two years ago, “What’s the one thing you’re looking most forward\
    \ to in CSS3?” I might’ve enthusiastically replied, “Multiple background images!”\
    \ At the time, the ability to layer more than one background image on a single\
    \ element seemed as though it would cure a lot of the headaches we’d been suffering\
    \ as web designers.\n\nTo create flexible, bulletproof solutions to design problems,\
    \ we must figure out how we can get by using fewer graphics or without adding\
    \ extraneous markup as hooks for extra background images. We’ve done the best\
    \ with what we’ve had, but the promise of being able to assign multiple background\
    \ images to an element had always seemed, to me, to be this wonderful promise\
    \ of easier times with less code.\n\nThe reality, though, is that along the way,\
    \ browsers have added support for much of the Backgrounds and Borders Module in\
    \ CSS3 ([http://bkaprt.com/css3/9/](http://bkaprt.com/css3/9/)).^([11](#chapter5.html_footnote-11))\
    \ Many of the properties we’ve discussed previously in the book have decent browser\
    \ support today in Safari, Chrome, Firefox, Opera, and IE9 Beta. And properties\
    \ like `border-radius`, `box-shadow`, gradients, `RGBA`, and `opacity` make it\
    \ possible in some cases to solve common problems without images at all. Many\
    \ of the techniques that previously required images are possible entirely within\
    \ the stylesheets themselves. All of that has obvious benefits.\n\nSo while a\
    \ few years ago, I was salivating over the prospect of multiple background support,\
    \ today, I’m less excited because of all the other tools we have at our disposal.\
    \ That said, there are *wonderful* use cases for assigning multiple background\
    \ images on a single element, and we’re going to talk about one particular technique\
    \ in this brief chapter.\n\n## Parallax scrolling\n\nIf we take a look back at\
    \ the moon example site, I’ve used multiple background images on the `body` element\
    \ to create a layered space environment. Instead of one flat image, there are\
    \ four semi-transparent PNGs stacked on top of each other. Each has it’s own horizontal\
    \ positioning to create an animated effect when the browser window is resized\
    \ (FIG 5.01).\n\n![An illustration of space, with scattered stars and blue and\
    \ purple dust clouds.](images/5-01.jpg)\n\nFIG 5.01: The background of the moon\
    \ example site, where four PNGs are stacked to create a sense of deep space.\n\
    \nThis technique of speed-shifting layers has been dubbed “parallax scrolling”\
    \ which our friends at Wikipedia define as:\n\n> A special scrolling technique\
    \ in computer graphics, seen first in the 1982 arcade game Moon Patrol. In this\
    \ pseudo-3D technique, background images move by the “camera” slower than foreground\
    \ images, creating an illusion of depth in a 2D video game and adding to the immersion.\
    \ The technique grew out of the multiplane camera technique used in traditional\
    \ animation since the 1940s.^([12](#chapter5.html_footnote-12))\n\nMany great\
    \ examples of applying the parallax effect on the web have been popping up over\
    \ the last few years, and a longtime favorite of mine is the site for Silverback\
    \ ([http://silverbackapp.com](http://silverbackapp.com)), a handy piece of usability\
    \ testing software from the folks at Clearleft (FIG 5.02).\n\n![Screenshot of\
    \ the SIlverback website, showing an illustration of a gorilla on a green background\
    \ with jungle vines hanging down from the top of the screen.](images/5-02.jpg)\n\
    \nFIG 5.02: Resize the browser window while visiting Silverback and enjoy the\
    \ three-dimensional jungle experience.\n\nResize the browser window back and forth\
    \ and notice how the layers of vines hanging down from the top shift back and\
    \ forth at slightly different speeds, creating a sense of dimension (I did that\
    \ for probably an hour straight when I first encountered the site).\n\nSure, not\
    \ everyone is going to see it—but for those that *do* experience it, it’s a wonderful\
    \ detail and enhanced user experience that can’t help but make you just a tiny\
    \ bit happier.\n\n## The old way: extra markup\n"
  raw: "We used a *negative* value to tip the image to the left (counter-clockwise),\
    \ and once again the transition will smooth out that subtle rotation, completing\
    \ the illusion of our comfy, plushy chair on the moon (FIG 4.22).\n\n![The recliner\
    \ before and after hover; on hover, the recliner tips back.](images/4-22.jpg)\n\
    \nFIG 4.22: The recliner tips back to the left using a negative value on the `rotate`\
    \ transform.\n\n### The disappearing gnome\n\nFor the final item, we’ll take a\
    \ lounging gnome and make him partially disappear. Somehow, that seems like a\
    \ perfectly natural thing for a gnome to do.\n\nWe’ll use the `opacity` property\
    \ to simply and quickly create a hover style for the image, dimming it down considerably.\
    \ Because of the transition already in place for all property changes on the image,\
    \ the `opacity` swap will animate in browsers that support transitions, creating\
    \ a smooth disappearance for our little friend.\n\nThe declaration is simply:\n\
    \n```\nol#things li#things-5 a:hover img {\n  opacity: 0.4;\n  }\n```\n\nFIGURE\
    \ 4.23 shows how the gnome fades out to 40% opacity on `:hover`.\n\n![The gnome\
    \ before and after hover; on hover, the gnome nearly vanishes and the moon background\
    \ can be seen through him.](images/4-23.jpg)\n\nFIG 4.23: The gnome *almost* disappears\
    \ by reducing `opacity` on `:hover`.\n\nNow, remember, if we wanted this effect\
    \ to work (sans transitions) in Internet Explorer, we could revisit the proprietary\
    \ `filter` property hack explained in [Chapter 3](#chapter3.html).\n\n### Harmless\
    \ degradation\n\nLike the photo gallery example we discussed earlier in the chapter,\
    \ the sprinkling of CSS3 we’re adding here is harmless for browsers that don’t\
    \ yet support it.\n\nIn the end, the important thing here is that each of these\
    \ items is a clickable link. What happens beyond that is an enriched experience\
    \ for those that are capable of receiving it.\n\n## One more time now: be smart,\
    \ be subtle\n\nBy taking a little time to think about the *meaning* behind the\
    \ content we’re dealing with, we can choose to apply some of the CSS3 properties\
    \ that work today along with transitions and transforms.\n\nThese experience enhancements\
    \ can be the mark of a true web craftsperson: attention to details that not everyone\
    \ will notice, care and feeding for non-critical visual events, and elevating\
    \ the message a step beyond the norm. For browsers that support this stuff now,\
    \ and those that will in the future, the small amount of code and thought is well\
    \ worth it.\n\nTry and be subtle when it comes to CSS transforms. It’s easy to\
    \ get carried away, but when used appropriately, they can make all the difference\
    \ in the way the reader experiences the message you’re delivering.\n\n### More\
    \ “wow,” please\n\nSpeaking of getting carried away, the next time your client\
    \ or boss says, “this design needs more ‘wow’” or “it’s missing some pizzazz!”\
    \ just add the following declaration to your stylesheet (and make sure they’re\
    \ using Safari, Chrome, Firefox, or Opera, of course):\n\n```\n*:hover {\n  -webkit-transform:\
    \ rotate(180deg);\n  -moz-transform: rotate(180deg);\n  -o-transform: rotate(180deg);\n\
    \  transform: rotate(180deg);\n  }\n```\n\nThis little bit of CSS3 says, “hover\
    \ over anything on the page, and rotate it 180 degrees.” Try it. It’s a sure-fire\
    \ way to make a big impression (FIG 4.24).\n\n![The Things We Left on the Moon\
    \ website with many parts of it upside down and rotated.](images/4-24.jpg)\n\n\
    FIG 4.24: The chaos that results from the “rotate everything on hover” trick.\n\
    \nActually, the sad thing is that there are some clients and bosses that might\
    \ *love* this.\n\n“This is great! Ship it!”\n\n*Sigh.*\n\n9\\. [http://www.w3.org/TR/CSS3-2d-transforms/#abstract](http://www.w3.org/TR/CSS3-2d-transforms/#abstract)\
    \ [[↵]](#chapter4.html_footnote-9-backlink)\n\n10\\. The long URL: [http://www.w3.org/TR/css3-2d-transforms/#transform-origin](http://www.w3.org/TR/css3-2d-transforms/#transform-origin)\
    \ [[↵]](#chapter4.html_footnote-10-backlink)\n\n![Chapter 5: Multiple Backgrounds](images/chap-5.png)\n\
