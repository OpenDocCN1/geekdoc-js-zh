  trans: "\n在表单元素上进行细微调整与保持用户熟悉感之间取得平衡至关重要，这样才能确保表单的可用性。换句话说，输入框仍然需要明显看起来像输入框。如今，CSS\
    \ 已经能够对表单元素进行深度样式化（在大多数浏览器中），我们必须小心不要破坏最重要的部分：功能。\n\n话虽如此，我们仍然可以利用 CSS3 对表单做很多事情，为支持这些特性的浏览器丰富体验，同时为不支持的浏览器优雅降级。\n\
    \n这一章也让我们有机会讨论之前尚未涉及的三个 CSS3 部分：\n\n1. 强大的新选择器\n2. CSS 渐变\n3. CSS 动画\n\n同样，我们将以月球示例网站为起点，讨论表单和\
    \ CSS3 如何以新颖的方式协同工作。具体来说，就是右侧边栏中的“新事物提醒”注册表单（图 6.01）。\n\n![月球遗留物网站侧边栏，包含一个标题为“新事物提醒”的表单，下方有两个输入字段，分别标注“你的姓名”和“你的邮箱”，以及一个样式化的提交按钮。](img/6-01.jpg)\n\
    \n图 6.01：一个简单的表单，用户可以在月球上留下新物品时订阅更新。\n\n## 标记简单的注册表单\n\n就 HTML 而言，这个小表单再简单不过了。只有几个带标签的输入框和一个提交按钮。\n\
    \n```\n<form action=\"/\" id=\"thing-alerts\">\n  <fieldset>\n    <label for=\"\
    alerts-name\">你的姓名</label>\n    <input type=\"text\" id=\"alerts-name\" />\n \
    \ </fieldset>\n\n  <fieldset>\n    <label for=\"alerts-email\">你的邮箱</label>\n\
    \    <input type=\"text\" id=\"alerts-email\" />\n  </fieldset>\n\n  <fieldset>\n\
    \    <input type=\"submit\" value=\"订阅\" />\n  </fieldset>\n</form>\n```\n\n图\
    \ 6.02 显示了使用默认浏览器样式的表单（在 Safari 中查看）。\n\n![同样的表单，但标签位于输入字段左侧而非上方，并且提交按钮为默认样式。](img/6-02.jpg)\n\
    \n图 6.02：在 Safari 中查看的表单，未应用样式。\n\n## 为 fieldset 和 label 添加样式\n\n我们为这个表单添加的第一部分\
    \ CSS 是针对 `fieldset` 和 `label` 元素的——只是为每一行之间添加一些间距。\n\n```\n#thing-alerts fieldset\
    \ {\n  margin: 0 0 10px 0;\n  }\n\n#thing-alerts label {\n  display: block;\n\
    \  font-weight: bold;\n  line-height: 1.4;\n  color: #666;\n  color: rgba(0, 0,\
    \ 0, 0.6);\n  text-shadow: 0 1px 1px #fff;\n  }\n```\n\n查看图 6.03，你会注意到我们在每个 `fieldset`\
    \ 行下方添加了 `10px` 的外边距，并将标签设置为 `display: block` 使其独占一行。我们还为文本指定了 60% 透明度的黑色，并为不支持\
    \ RGBA 的浏览器提供了纯灰色作为后备颜色。此外，我们使用 `text-shadow` 添加了微妙的白色高光，使文本看起来像是嵌入背景中。\n\n![同样的表单，现在标签位于输入字段上方，并添加了内边距以改善间距。](img/6-03.jpg)\n\
    \n图 6.03：`fieldset` 和 `label` 元素现在已应用样式。\n\n现在，虽然我们在 `fieldset` 行之间有了漂亮的 10 像素间距，但由于灰色框内的内边距，我们*不需要*最后一行（包含提交按钮）下方的\
    \ 10 像素外边距。\n\n这是一种常见模式：你有一系列元素，每个元素都应用了相同的样式，但你希望对该系列中的最后一个元素进行稍微不同的样式处理。\n\n\
    与其在最后一个元素上添加 `class=\"last\"`，不如利用 CSS3 中的 `:last-child` 伪类来移除底部外边距，而无需修改标记：\n\
    \n```\n#thing-alerts fieldset {\n  margin: 0 0 10px 0;\n  }\n\n  #thing-alerts\
    \ fieldset label {\n  display: block;\n  font-weight: bold;\n  line-height: 1.4;\n\
    \  color: #666;\n  color: rgba(0, 0, 0, 0.6);\n  text-shadow: 0 1px 1px #fff;\n\
    \  }\n\n  #thing-alerts fieldset:last-child {\n    margin: 0;\n  }\n```\n\n请记住，`:last-child`\
    \ 在 IE8 及更低版本中不受支持，但对于像这样的小型外观调整，它是比在标记中添加类更好的替代方案。\n\n图 6.04 显示了当前进度，最后一个 `fieldset`\
    \ 元素的底部外边距已通过 `:last-child` 伪类移除。\n\n![同样的表单，提交按钮下方的间距减少了。](img/6-04.jpg)\n\n\
    图 6.04：移除了最后一个 `fieldset` 的底部外边距后，表单间距看起来不错。\n\n### 更多 CSS3 选择器\n\n既然我们很好地利用了\
    \ `:last-child`，那么现在正好可以指出 CSS3 中还有许多其他非常方便的新选择器。\n\n我强烈推荐 Roger Johansson 关于此主题的文章《CSS3\
    \ 选择器详解》（[`bkaprt.com/css3/11/`](http://bkaprt.com/css3/11/)）^(14)，他在其中演示了这些选择器是什么以及它们如何工作。不同浏览器对\
    \ CSS3 选择器的支持情况各不相同，因此请务必参考 Peter-Paul Koch 详尽的《CSS 内容与浏览器兼容性》表格（[`bkaprt.com/css3/12/`](http://bkaprt.com/css3/12/)）^(15)\
    \ 以及微软的《CSS 兼容性与 Internet Explorer》（[`bkaprt.com/css3/13/`](http://bkaprt.com/css3/13/)）^(16)，以了解各浏览器的支持情况。\n\
    \n## 样式化文本输入框\n\n接下来，让我们开始添加样式，将默认的文本输入框变成更定制化的样子。这次我们将使用 CSS2.1 属性选择器来仅针对 `input\
    \ type=\"text\"` 元素（而不是 `input type=\"submit\"` 按钮）。\n\n如果我们简单地声明：\n\n```\n#thing-alerts\
    \ input\n```\n\n我们将样式化表单中的所有输入框（文本*和*按钮），但如果将其修改为：\n\n```\n #thing-alerts input[type=\"\
    text\"] \n```\n\n我们将仅针对文本输入框。\n\n再次强调，在样式表中使用强大的选择器可以避免在标记中添加额外的类来分别样式化不同的表单元素。这很优雅。\n\
    \n请记住，虽然属性选择器在 IE7 及以上版本中受支持，但在 IE6 中*不受支持*，但这没关系，因为我们只是修改这些表单元素的非关键外观。IE6 会忽略这些规则，在这种情况下完全可以接受。\n\
    \n以下声明应用了特定的 `width`、`padding` 和 `font-size`，关闭了默认边框，添加了 `background-color`，并使用我们信赖的\
    \ `border-radius` 堆栈为输入框添加了圆角。\n\n```\n#thing-alerts fieldset input[type=\"text\"\
    ] {\n  width: 215px;\n  padding: 5px 8px;\n  font-size: 1.2em;\n  color: #666;\n\
    \  border: none;\n  background-color: #fff;\n  -webkit-border-radius: 4px;\n \
    \ -moz-border-radius: 4px;\n  -o-border-radius: 4px;\n  border-radius: 4px;\n\
    \  }\n```\n\n图 6.05 显示了在 Safari 中的进度（在 Firefox 和 Opera 中结果类似）。现在我们有了扁平、圆角的文本输入框，看起来相当不错，但让我们添加一些深度，使它们看起来更像典型的可编辑输入框。\n\
    \n![同样的表单，输入字段的默认浏览器样式已被移除；输入字段现在是扁平且圆角的。](img/6-05.jpg)\n\n图 6.05：扁平、圆角的文本输入框。\n\
    \n## 使用 CSS3 渐变\n\n添加这种深度的一种巧妙方法是使用 CSS 渐变，这是 CSS3 中的新特性。也就是说，无需使用任何图像即可创建从一种颜色到另一种颜色的渐变。听起来很诱人，不是吗？\n\
    \nCSS 渐变目前仅在 Safari 4+、Chrome 2+ 和 Firefox 3.6+ 中受支持，但同样，对于非关键用途，它可以是一种灵活且降级良好的解决方案。\n\
    \nCSS 渐变可以应用于样式表中任何可以声明图像的地方。换句话说，`background-image`、`list-style-image`、`border-image`\
    \ 以及生成内容。\n"
- fmt: "\nThe syntax for declaring CSS gradients differs slightly between Safari’s\
    \ implementation and Firefox. The (very preliminary) spec, however, leans more\
    \ toward the way Firefox handles things. Here’s a prime example of why vendor\
    \ prefixing is an important part of the process: these two varying syntaxes can\
    \ be correctly declared for each browser, while the official spec is still being\
    \ hashed out.\n\nI’ll be honest in saying that the syntax for either can be a\
    \ tad bit confusing. There’s an immense amount of control possible in creating\
    \ gradients, including the colors involved, color stops, direction of the gradient,\
    \ etc.\n\nFor example, here is the syntax for creating a simple linear gradient\
    \ for both WebKit and Mozilla-based browsers on the background of an element:\n\
    \n```\n#foo {\n  background-image: -webkit-gradient(linear, 0% 0%, 0% 100%, from(#fff),\
    \ to(#999));\n  background-image: -moz-linear-gradient(0% 100% 90deg, #fff, #999);\n\
    \  }\n```\n\nIt’s not entirely intuitive, and it’s also difficult to remember\
    \ the differences for each vendor.\n\nThe best way I’ve found to come up with\
    \ the right code is to use John Allsopp’s wonderful WYSIWYG editor (FIG 6.06,\
    \ [http://bkaprt.com/css3/14/](http://bkaprt.com/css3/14/)).^([17](#chapter6.html_footnote-17))\n\
    \n![Screenshot of the user interface for John Allsopp's gradients tool.](images/6-06.jpg)\n\
    \nFIG 6.06: The wonderful CSS gradients tool by John Allsopp.\n\nUse this tool\
    \ to visually create the gradients you want, then grab the appropriate syntax\
    \ for both Safari and Firefox. John’s tool does all the heavy lifting for you.\
    \ And this is extremely helpful as I haven’t been able to memorize the code (and\
    \ the differences between browsers) yet.\n\nJonathan Snook has a helpful post\
    \ on working your way through gradient syntax that might prove helpful as well:\
    \ [http://bkaprt.com/css3/15/](http://bkaprt.com/css3/15/).^([18](#chapter6.html_footnote-18))\n\
    \nThe gradient we want to add to our text inputs is very subtle—just a little\
    \ lip to make it look inset (FIG 6.07). After fiddling and entering some values\
    \ into John Allsopp’s tool, we come up with two short lines of CSS:\n\n```\n#thing-alerts\
    \ fieldset input[type=\"text\"] {\n  width: 215px;\n  padding: 5px 8px;\n  font-size:\
    \ 1.2em;\n  color: #666;\n  border: none;\n  background-image: -webkit-gradient(linear,\
    \ 0% 0%, 0% 12%, from(#999), to(#fff));\n  background-image: -moz-linear-gradient(0%\
    \ 12% 90deg, #fff, #999); \n  background-color: #fff;\n  -webkit-border-radius:\
    \ 4px;\n  -moz-border-radius: 4px;\n  -o-border-radius: 4px;\n  border-radius:\
    \ 4px;\n  }\n```\n\n![close-up of the gradient on the input, showing a few pixels\
    \ of dark gray fading to white in the top of the field.](images/6-07.jpg)\n\n\
    FIG 6.07: A zoomed view of the tiny gradient at the top of each text input that\
    \ makes it look recessed.\n\nWe’re applying a *linear* gradient here, but *radial*\
    \ gradients are also possible with CSS.\n\nAnd here you can see how the syntax\
    \ differs between `-webkit` and `-moz` implementations. We’re essentially adding\
    \ a small linear gradient that goes from light gray (`#999`) to white (`#fff`)\
    \ for just 12% of the vertical height of the input. We’re applying the vendor-prefixed\
    \ `background-image` rules to make that happen in Safari and Firefox.\n\nFIGURE\
    \ 6.08 shows the results, where you can see our rounded inputs now sporting a\
    \ little inner shadow using no images.\n\n![The text inputs now with the gradient,\
    \ so they look like they have some depth.](images/6-08.jpg)\n\nFIG 6.08: Text\
    \ inputs with the CSS gradient in place.\n\nBrowsers that don’t yet support CSS\
    \ gradients will ignore those `background-image` rules and just be flat white.\
    \ And that’s perfectly fine. But the adjustment, flexibility, and control that\
    \ comes along with CSS gradients is rather compelling. We’ll be using them a bit\
    \ more in the next section regarding the submit button.\n\n## A pure CSS3 button\n\
    \nIf there’s one UI element that can demonstrate how transformative CSS3 can be,\
    \ it just may be the button. Combining many of the techniques we’ve already discussed\
    \ throughout the book, we’ll turn an ordinary form submit button into something\
    \ far more interesting—entirely with CSS (FIG 6.09).\n\n![The default button as\
    \ compared to the styled one.](images/6-09.jpg)\n\nFIG 6.09: The default submit\
    \ button in Safari on the left vs. one styled with CSS3—no images!—on the right.\n\
    \nThe beauty of applying CSS3 to style the button is that by not using images,\
    \ we’re left with something far more flexible. If the browser doesn’t support\
    \ the properties we’ll use to elevate this button visually, that’s OK. It’ll degrade\
    \ nicely to a default form button in whatever browser the user happens to be using.\n\
    \nSo let’s walk through the steps needed to take a default form button to the\
    \ wonderfully shiny one on the right in FIGURE 6.09.\n\n### Base button styles\n\
    \nFirst, we’ll add some padding, change the font to Helvetica to match the rest\
    \ of the design, turn off borders, and set the background color to white.\n\n\
    ```\n#thing-alerts input[type=\"submit\"] {\n  padding: 8px 15px;\n  font-family:\
    \ Helvetica, Arial, sans-serif;\n  font-weight: bold;\n  line-height: 1;\n  color:\
    \ #444;\n  border: none;\n  background-color: #fff;\n  }\n```\n\nFIGURE 6.10 shows\
    \ how things are looking in Safari with those simple base styles applied. And\
    \ we already have something that looks nothing like a default input button.\n\n\
    ![The submit button with a rectangular white background and no border.](images/6-10.jpg)\n\
    \nFIG 6.10: A submit button with default borders and backgrounds removed.\n\n\
    ### Rounding to a pill shape\n\nNext, let’s add a `border-radius` stack to get\
    \ the button rounded down to a pill shape (FIG 6.11).\n\n```\n#thing-alerts fieldset\
    \ input[type=\"submit\"] {\n  padding: 8px 15px;\n  font-family: Helvetica, Arial,\
    \ sans-serif;\n  font-weight: bold;\n  line-height: 1;\n  color: #444;\n  border:\
    \ none;\n  background-color: #fff;\n  -webkit-border-radius: 23px;\n  -moz-border-radius:\
    \ 23px;\n  -o-border-radius: 23px;\n  border-radius: 23px; \n  }\n```\n\n![The\
    \ submit button, now with a round white background.](images/6-11.jpg)\n\nFIG 6.11:\
    \ Rounding the submit button using `border-radius`.\n\nAfter a bit of experimenting\
    \ with the right value, we’ve settled on `23px` to get the pill shape.\n\n###\
    \ Appling a linear gradient\n\nNow let’s apply a gradient of light gray (`#bbb`)\
    \ from bottom up to white (`#fff`) at the top of the button. We’ll again rely\
    \ on Mr. Allsopp’s gradient tool to spit out the correct rules for Safari, Chrome,\
    \ and Firefox.\n\n```\n#thing-alerts input[type=\"submit\"] {\n  padding: 8px\
    \ 15px;\n  font-family: Helvetica, Arial, sans-serif;\n  font-weight: bold;\n\
    \  line-height: 1;\n  color: #444;\n  border: none;\n  background-image: -webkit-gradient(linear,\
    \ 0% 0%, 0% 100%, from(#fff), to(#bbb));\n  background-image: -moz-linear-gradient(0\
    \ 100% 90deg, #fff, #bbb); \n  background-color: #fff;\n  -webkit-border-radius:\
    \ 23px;\n  -moz-border-radius: 23px;\n  -o-border-radius: 23px;\n  border-radius:\
    \ 23px;\n  }\n```\n\nFIGURE 6.12 shows the progress as viewed in Safari. Now we\
    \ have a rounded button with a CSS gradient applied. So far, no images have been\
    \ used and we’ve only added a few lines in our stylesheet.\n\n![The submit button,\
    \ with a gradient background running from white at the top to dark gray at the\
    \ bottom.](images/6-12.jpg)\n\nFIG 6.12: The CSS gradient added to the submit\
    \ button.\n\n### Adding text-shadow to let the type sink in\n\nLet’s now add an\
    \ almost-white `text-shadow` below the text that will make it look as if the text\
    \ is stamped into the button.\n\n```\n#thing-alerts input[type=\"submit\"] {\n\
    \  padding: 8px 15px;\n  font-family: Helvetica, Arial, sans-serif;\n  font-weight:\
    \ bold;\n  line-height: 1;\n  color: #444;\n  border: none;\n  text-shadow: 0\
    \ 1px 1px rgba(255, 255, 255, 0.85);\n  background-image: -webkit-gradient(linear,\
    \ 0% 0%, 0% 100%, from(#fff), to(#bbb));\n  background-image: -moz-linear-gradient(0\
    \ 100% 90deg, #fff, #bbb); \n  background-color: #fff;\n  -webkit-border-radius:\
    \ 23px;\n  -moz-border-radius: 23px;\n  -o-border-radius: 23px;\n  border-radius:\
    \ 23px;\n  }\n```\n"
