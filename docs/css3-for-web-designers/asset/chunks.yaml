  trans: "\n我们使用了一个*负值*来让图像向左倾斜（逆时针），而过渡效果会平滑地处理这个微妙的旋转，从而完成我们那把舒适柔软的月球躺椅的幻觉（图 4.22）。\n\
    \n![悬停前后的躺椅；悬停时，躺椅向后倾斜。](img/4-22.jpg)\n\n图 4.22：躺椅通过 `rotate` 变换的负值向左倾斜。\n\n\
    ### 消失的地精\n\n最后一项，我们将让一个躺着的地精部分消失。不知为何，这看起来对地精来说是一件非常自然的事情。\n\n我们将使用 `opacity`\
    \ 属性来简单快速地创建图像的悬停样式，使其显著变暗。由于图像上所有属性变化都已经设置了过渡效果，`opacity` 的切换会在支持过渡的浏览器中产生动画效果，让我们的这位小朋友平滑地消失。\n\
    \n声明很简单：\n\n```\nol#things li#things-5 a:hover img {\n  opacity: 0.4;\n  }\n```\n\
    \n图 4.23 展示了地精在 `:hover` 时淡出至 40% 不透明度的效果。\n\n![悬停前后的地精；悬停时，地精几乎消失，月球背景可以透过它看到。](img/4-23.jpg)\n\
    \n图 4.23：通过降低 `:hover` 时的 `opacity`，地精*几乎*消失了。\n\n现在请记住，如果我们希望这个效果在 Internet Explorer\
    \ 中也能工作（无需过渡），我们可以重新使用第 3 章中介绍的专有 `filter` 属性 hack。\n\n### 无害的降级\n\n就像我们本章前面讨论的照片画廊示例一样，我们在这里添加的少量\
    \ CSS3 对于尚不支持它的浏览器是无害的。\n\n归根结底，重要的是这些项目中的每一个都是可点击的链接。除此之外，对于能够接收它的浏览器来说，这是一种更丰富的体验。\n\
    \n## 再说一次：要聪明，要微妙\n\n花一点时间思考我们所处理内容背后的*含义*，我们可以选择应用一些今天就能使用的 CSS3 属性，以及过渡和变换。\n\
    \n这些体验增强可以成为真正网页工匠的标志：关注并非每个人都会注意到的细节，对非关键的视觉事件进行关怀和滋养，并将信息传递提升到超越常规的水平。对于现在支持这些内容的浏览器，以及未来将支持它们的浏览器，少量的代码和思考是非常值得的。\n\
    \n在 CSS 变换方面，尽量保持微妙。很容易得意忘形，但使用得当，它们可以极大地改变读者体验你所传递信息的方式。\n\n### 再来点“哇”的效果\n\n\
    说到得意忘形，下次你的客户或老板说“这个设计需要更多‘哇’的效果”或“它缺少一些活力！”时，只需在你的样式表中添加以下声明（当然，确保他们使用的是 Safari、Chrome、Firefox\
    \ 或 Opera）：\n\n```\n*:hover {\n  -webkit-transform: rotate(180deg);\n  -moz-transform:\
    \ rotate(180deg);\n  -o-transform: rotate(180deg);\n  transform: rotate(180deg);\n\
    \  }\n```\n\n这一小段 CSS3 的意思是：“悬停在页面上的任何元素上，并将其旋转 180 度。”试试看。这是一个制造深刻印象的万无一失的方法（图\
    \ 4.24）。\n\n![我们留在月球上的东西网站，其中许多部分上下颠倒并旋转。](img/4-24.jpg)\n\n图 4.24：“悬停时旋转所有内容”技巧导致的混乱。\n\
    \n实际上，可悲的是，确实有一些客户和老板可能会*喜欢*这个。\n\n“太棒了！发布吧！”\n\n*唉。*\n\n9\\. [`www.w3.org/TR/CSS3-2d-transforms/#abstract`](http://www.w3.org/TR/CSS3-2d-transforms/#abstract)\
    \ [[↵]](#chapter4.html_footnote-9-backlink)\n\n10\\. 长 URL：[`www.w3.org/TR/css3-2d-transforms/#transform-origin`](http://www.w3.org/TR/css3-2d-transforms/#transform-origin)\
    \ [[↵]](#chapter4.html_footnote-10-backlink)\n\n![第 5 章：多重背景](img/chap-5.png)\n\
    \n如果你两年前问我：“在 CSS3 中你最期待什么？”我可能会热情地回答：“多重背景图像！”当时，能够在单个元素上叠加多个背景图像似乎能解决我们作为网页设计师所面临的许多头痛问题。\n\
    \n为了创建灵活、无懈可击的设计问题解决方案，我们必须弄清楚如何用更少的图形，或者在不添加额外标记作为额外背景图像挂钩的情况下解决问题。我们已经尽力利用现有条件，但能够为元素分配多个背景图像的承诺，对我来说，一直像是用更少的代码实现更轻松时代的绝妙承诺。\n\
    \n然而，现实是，在这个过程中，浏览器已经增加了对 CSS3 中背景与边框模块（[`bkaprt.com/css3/9/`](http://bkaprt.com/css3/9/)）的大部分支持。^(11)\
    \ 我们之前书中讨论的许多属性，如 `border-radius`、`box-shadow`、渐变、`RGBA` 和 `opacity`，如今在 Safari、Chrome、Firefox、Opera\
    \ 和 IE9 Beta 中都有不错的浏览器支持。在某些情况下，这些属性使得无需图像就能解决常见问题。许多以前需要图像的技术现在完全可以在样式表内部实现。所有这些都有明显的好处。\n\
    \n因此，虽然几年前我对多重背景支持的前景垂涎三尺，但今天，由于我们手头有这么多其他工具，我反而没那么兴奋了。尽管如此，在单个元素上分配多个背景图像仍然有*绝佳*的用例，我们将在这一简短章节中讨论一种特定技术。\n\
    \n## 视差滚动\n\n回顾一下月球示例网站，我在 `body` 元素上使用了多个背景图像来创建分层的太空环境。不是一张平面图像，而是四张半透明的 PNG\
    \ 图像堆叠在一起。每张图像都有自己的水平定位，以便在浏览器窗口调整大小时产生动画效果（图 5.01）。\n\n![太空插图，散布着星星和蓝紫色尘埃云。](img/5-01.jpg)\n\
    \n图 5.01：月球示例网站的背景，四张 PNG 图像堆叠在一起，营造出深邃太空的感觉。\n\n这种速度分层技术被称为“视差滚动”，我们在维基百科的朋友将其定义为：\n\
    \n> 计算机图形学中的一种特殊滚动技术，最早出现在 1982 年的街机游戏《月球巡逻队》中。在这种伪 3D 技术中，背景图像相对于前景图像以较慢的速度移动，从而在\
    \ 2D 视频游戏中创造出深度错觉，并增强了沉浸感。该技术源于 20 世纪 40 年代以来传统动画中使用的多平面摄像机技术。^(12)\n\n过去几年中，网络上出现了许多应用视差效果的优秀示例，我长期以来的最爱之一是\
    \ Silverback 的网站（[`silverbackapp.com`](http://silverbackapp.com)），这是 Clearleft\
    \ 团队开发的一款便捷的可用性测试软件（图 5.02）。\n\n![Silverback 网站截图，显示一只大猩猩的插图，背景为绿色，屏幕顶部垂下丛林藤蔓。](img/5-02.jpg)\n\
    \n图 5.02：访问 Silverback 时调整浏览器窗口大小，享受三维丛林体验。\n\n来回调整浏览器窗口大小，注意从顶部垂下的藤蔓层如何以略微不同的速度来回移动，从而产生立体感（我第一次遇到这个网站时，大概连续玩了一个小时）。\n\
    \n当然，并非每个人都会注意到它——但对于那些*确实*体验到它的人来说，这是一个美妙的细节和增强的用户体验，它让你不由自主地感到一丝愉悦。\n\n## 旧方法：额外标记\n\
    \n"
- fmt: "\nSo how is it done? Paul Annett wrote up the techniques he used to create\
    \ the parallax effect specifically for the Silverback site in an article for *Think\
    \ Vitamin* back in early 2008 ([http://bkaprt.com/css3/10/](http://bkaprt.com/css3/10/)).^([13](#chapter5.html_footnote-13))\n\
    \nTo layer the three layers of vines, each a separate PNG, you must have at least\
    \ three available block-level elements. Two extra wrapper `div`s are necessary\
    \ to place a background image on the `body`, `#midground`, and `#foreground` elements.\n\
    \nI’m loosely translating here, for simplicity, but the markup would be something\
    \ like:\n\n```\n<body>\n  <div id=\"midground\">\n    <div id=\"foreground\">\n\
    \      <!-- page content here -->  \n    </div>\n  </div>\n</body>\n```\n\nThe\
    \ CSS to place the three images, each with varying horizontal positions, would\
    \ be something like:\n\n```\nbody {\n  background: url(vines-back.png) repeat-x\
    \ 20% 0;\n  }\n\n#midground {\n  background: url(vines-mid.png) repeat-x 40% 0;\n\
    \  }\n\n#foreground {\n  background: url(vines-front.png) repeat-x 150% 0; \n\
    \  }\n```\n\nNow this works perfectly well. But it’s made far simpler when using\
    \ the multiple backgrounds syntax introduced in CSS3.\n\nLet’s take a look at\
    \ how multiple backgrounds are applied to the body of the moon example site, and\
    \ how that creates a simpler parallax effect for those that might experience it.\n\
    \n## The new way: multiple backgrounds via CSS3\n\nI’m using four semi-transparent\
    \ PNGs to create the deep space background used on the moon example site. They’re\
    \ all layered on the `body` element, stacked one on top of each other to create\
    \ that sense of dimension when the browser’s window is resized by the user.\n\n\
    FIGURE 5.03 shows each of the four PNG images used:\n\n1.  Dust clouds (`clouds.png`)\n\
    2.  Blue to purple gradient (`space-bg.png`)\n3.  Layer of stars (`stars-1.png`)\n\
    4.  Another layer of randomly-placed stars (`stars-2.png`)\n\n![Four background\
    \ images shown separated and distinct from one another.](images/5-03.jpg)\n\n\
    FIG 5.03: The four semi-transparent background PNGs that are layered underneath\
    \ the moon example site.\n\n### Multiple backgrounds syntax\n\nAnd here’s how\
    \ simple it is to assign these four images as backgrounds of the `body` element,\
    \ using the updated CSS3 syntax:\n\n```\nbody {\n  background: \n    url(../img/stars-1.png)\
    \ repeat-x fixed -130% 0,\n    url(../img/stars-2.png) repeat-x fixed 40% 0,\n\
    \    url(../img/space-bg.png) repeat-x fixed -80% 0,\n    url(../img/clouds.png)\
    \ repeat-x fixed 100% 0;\n  background-color: #1a1a1a;\n  }\n```\n\nHere I’m layering\
    \ the four images, with the clouds at the bottom, and stars on top in a comma-delimited\
    \ list (notice the stacking order starts with the image “closest” to the user).\
    \ I’m also repeating each of these horizontally, and setting them at differing\
    \ horizontal positions (using positive and negative values) to make each layer\
    \ “shift” at different speeds as the window is resized. And finally, I’ve fixed\
    \ them in a locked position on the page with the `fixed` value.\n\nThe almost-black\
    \ background color of `#1a1a1a` is added in last as a separate `background-color`\
    \ rule.\n\nAnd that’s it (FIG 5.04). What’s wonderful about this is that there\
    \ is no extraneous markup necessary. We’re putting all of these images on the\
    \ `body` element so that they’ll sit behind the page’s content, but we didn’t\
    \ need to add dummy wrapper `div`s to layer them.\n\n![An illustration of space,\
    \ with scattered stars and blue and purple dust clouds.](images/5-04.jpg)\n\n\
    FIG 5.04: The four PNGs layered on top of each other as well as a dark charcoal\
    \ background color.\n\n### What about browser support?\n\nAs mentioned back in\
    \ [Chapter 1](#chapter1.html), multiple backgrounds are supported in Safari 1.3+,\
    \ Chrome 2+, Firefox 3.6+, Opera 10.5+, and IE9 Beta. So, really, they’re on par\
    \ with many of the other CSS properties we’ve been using throughout the book.\n\
    \nOnce again, we’ve chosen to utilize this wonderful CSS3 gem in a non-critical\
    \ part of the design because of that imperfect support: enriching the *background*\
    \ of the page, heightening the experience of resizing the window by creating a\
    \ parallax effect for those that are able to experience it.\n\n### Providing a\
    \ fallback for all browsers\n\nBrowsers that don’t yet support multiple backgrounds\
    \ will ignore the entire `background` rule. And that’s precisely why we’ve defined\
    \ the `background-color` in a separate rule.\n\nFIGURE 5.05 shows the moon example\
    \ site as viewed in IE7, where the multiple background images we’ve declared are\
    \ ignored, showing only the charcoal `background-color`.\n\n![The Things We Left\
    \ on the Moon website with only a black background.](images/5-05.jpg)\n\nFIG 5.05:\
    \ IE7 ignores the rule where multiple background images are declared, showing\
    \ only the dark charcoal background color.\n\nNow, nothing is *broken* here—but\
    \ losing all the space-y-ness in the background is a shame. The solution is to\
    \ specify a single fallback background image *first* in the declaration, for browsers\
    \ (like IE7 and 8) that don’t support multiple images. Then we can override that\
    \ rule with the multiple one (which will be ignored by IE).\n\n```\nbody {\n \
    \ background: url(../img/space-bg.png) repeat-x fixed -80% 0; \n  background:\
    \ \n    url(../img/stars-1.png) repeat-x fixed -130% 0,\n    url(../img/stars-2.png)\
    \ repeat-x fixed 40% 0,\n    url(../img/space-bg.png) repeat-x fixed -80% 0,\n\
    \    url(../img/clouds.png) repeat-x fixed 100% 0;\n  background-color: #1a1a1a;\n\
    \ }\n```\n\nFor the single image fallback, you could choose one of the images\
    \ used in the multiple declaration, or even go so far as to create a flattened\
    \ version of the multiple layers.\n\nFor the moon site, I’ve chosen to simply\
    \ use `space-bg.png`, which is the color gradient image (FIG 5.06), therefore\
    \ serving a starless, cloudless version of the background to browsers that don’t\
    \ yet support multiple background images. How appropriate.\n\n![The Things We\
    \ Left on the Moon website with the blue and purple dust clouds as the background.](images/5-06.jpg)\n\
    \nFIG 5.06: With the single fallback image in place, IE7 now has a bit more space-y-ness\
    \ restored.\n\n## Using multiple backgrounds today\n\nIn keeping with the theme\
    \ of the other examples in the book, here we’re using multiple background images\
    \ today. We’re forging ahead with a CSS3 property that has healthy support in\
    \ Safari, Chrome, Firefox, and Opera, as well as IE9 Beta. Instead of fearing\
    \ that non-universal support and waiting it out, we’re choosing to apply the property\
    \ on a non-critical visual event (a parallax-shifting background).\n\nWe also\
    \ know that if the browser doesn’t support multiple backgrounds, it will ignore\
    \ the entire `background` rule. To compensate, we’ll define a flat or alternate\
    \ single graphic in a background rule that comes before the multiple one.\n\n\
    And with all of that in mind, we can now more flexibly experiment with layering,\
    \ shifting, and positioning background images on top of each other, without the\
    \ need for extra markup. It’ll be exciting to see how this technique is used in\
    \ creative new ways.\n\n11\\. The long URL: [http://www.w3.org/TR/CSS3-background/](http://www.w3.org/TR/CSS3-background/)\
    \ [[↵]](#chapter5.html_footnote-11-backlink)\n\n12\\. [http://en.wikipedia.org/wiki/Parallax_scrolling](http://en.wikipedia.org/wiki/Parallax_scrolling)\
    \ [[↵]](#chapter5.html_footnote-12-backlink)\n\n13\\. The long URL: [http://thinkvitamin.com/design/how-to-recreate-silverbacks-parallax-effect/](http://thinkvitamin.com/design/how-to-recreate-silverbacks-parallax-effect/)\
    \ [[↵]](#chapter5.html_footnote-13-backlink)\n\n![Chapter 6: Enriching Forms](images/chap-6.png)\n\
    \nForms are another aspect of a website that can involve interaction, and therefore\
    \ they offer additional visual events that are ripe for enriching with CSS3.\n\
    \nBy default, form elements themselves can differ drastically in appearance depending\
    \ on the browser or operating system in which they’re viewed. Why not embrace\
    \ that variation by choosing to apply the portions of CSS3 that work today to\
    \ heighten the experience?\n"
  raw: "So how is it done? Paul Annett wrote up the techniques he used to create the\
    \ parallax effect specifically for the Silverback site in an article for *Think\
    \ Vitamin* back in early 2008 ([http://bkaprt.com/css3/10/](http://bkaprt.com/css3/10/)).^([13](#chapter5.html_footnote-13))\n\
    \nTo layer the three layers of vines, each a separate PNG, you must have at least\
    \ three available block-level elements. Two extra wrapper `div`s are necessary\
    \ to place a background image on the `body`, `#midground`, and `#foreground` elements.\n\
    \nI’m loosely translating here, for simplicity, but the markup would be something\
    \ like:\n\n```\n<body>\n  <div id=\"midground\">\n    <div id=\"foreground\">\n\
    \      <!-- page content here -->  \n    </div>\n  </div>\n</body>\n```\n\nThe\
    \ CSS to place the three images, each with varying horizontal positions, would\
    \ be something like:\n\n```\nbody {\n  background: url(vines-back.png) repeat-x\
    \ 20% 0;\n  }\n\n#midground {\n  background: url(vines-mid.png) repeat-x 40% 0;\n\
    \  }\n\n#foreground {\n  background: url(vines-front.png) repeat-x 150% 0; \n\
    \  }\n```\n\nNow this works perfectly well. But it’s made far simpler when using\
    \ the multiple backgrounds syntax introduced in CSS3.\n\nLet’s take a look at\
    \ how multiple backgrounds are applied to the body of the moon example site, and\
    \ how that creates a simpler parallax effect for those that might experience it.\n\
    \n## The new way: multiple backgrounds via CSS3\n\nI’m using four semi-transparent\
    \ PNGs to create the deep space background used on the moon example site. They’re\
    \ all layered on the `body` element, stacked one on top of each other to create\
    \ that sense of dimension when the browser’s window is resized by the user.\n\n\
    FIGURE 5.03 shows each of the four PNG images used:\n\n1.  Dust clouds (clouds.png)\n\
    \n2.  Blue to purple gradient (space-bg.png)\n\n3.  Layer of stars (stars-1.png)\n\
    \n4.  Another layer of randomly-placed stars (stars-2.png)\n\n![Four background\
    \ images shown separated and distinct from one another.](images/5-03.jpg)\n\n\
    FIG 5.03: The four semi-transparent background PNGs that are layered underneath\
    \ the moon example site.\n\n### Multiple backgrounds syntax\n\nAnd here’s how\
    \ simple it is to assign these four images as backgrounds of the `body` element,\
    \ using the updated CSS3 syntax:\n\n```\nbody {\n  background: \n    url(../img/stars-1.png)\
    \ repeat-x fixed -130% 0,\n    url(../img/stars-2.png) repeat-x fixed 40% 0,\n\
    \    url(../img/space-bg.png) repeat-x fixed -80% 0,\n    url(../img/clouds.png)\
    \ repeat-x fixed 100% 0;\n  background-color: #1a1a1a;\n  }\n```\n\nHere I’m layering\
    \ the four images, with the clouds at the bottom, and stars on top in a comma-delimited\
    \ list (notice the stacking order starts with the image “closest” to the user).\
    \ I’m also repeating each of these horizontally, and setting them at differing\
    \ horizontal positions (using positive and negative values) to make each layer\
    \ “shift” at different speeds as the window is resized. And finally, I’ve fixed\
    \ them in a locked position on the page with the `fixed` value.\n\nThe almost-black\
    \ background color of `#1a1a1a` is added in last as a separate `background-color`\
    \ rule.\n\nAnd that’s it (FIG 5.04). What’s wonderful about this is that there\
    \ is no extraneous markup necessary. We’re putting all of these images on the\
    \ `body` element so that they’ll sit behind the page’s content, but we didn’t\
    \ need to add dummy wrapper `div`s to layer them.\n\n![An illustration of space,\
    \ with scattered stars and blue and purple dust clouds.](images/5-04.jpg)\n\n\
    FIG 5.04: The four PNGs layered on top of each other as well as a dark charcoal\
    \ background color.\n\n### What about browser support?\n\nAs mentioned back in\
    \ [Chapter 1](#chapter1.html), multiple backgrounds are supported in Safari 1.3+,\
    \ Chrome 2+, Firefox 3.6+, Opera 10.5+, and IE9 Beta. So, really, they’re on par\
    \ with many of the other CSS properties we’ve been using throughout the book.\n\
    \nOnce again, we’ve chosen to utilize this wonderful CSS3 gem in a non-critical\
    \ part of the design because of that imperfect support: enriching the *background*\
    \ of the page, heightening the experience of resizing the window by creating a\
    \ parallax effect for those that are able to experience it.\n\n### Providing a\
    \ fallback for all browsers\n\nBrowsers that don’t yet support multiple backgrounds\
    \ will ignore the entire `background` rule. And that’s precisely why we’ve defined\
    \ the `background-color` in a separate rule.\n\nFIGURE 5.05 shows the moon example\
    \ site as viewed in IE7, where the multiple background images we’ve declared are\
    \ ignored, showing only the charcoal `background-color`.\n\n![The Things We Left\
    \ on the Moon website with only a black background.](images/5-05.jpg)\n\nFIG 5.05:\
    \ IE7 ignores the rule where multiple background images are declared, showing\
    \ only the dark charcoal background color.\n\nNow, nothing is *broken* here—but\
    \ losing all the space-y-ness in the background is a shame. The solution is to\
    \ specify a single fallback background image *first* in the declaration, for browsers\
    \ (like IE7 and 8) that don’t support multiple images. Then we can override that\
    \ rule with the multiple one (which will be ignored by IE).\n\n```\nbody {\n \
    \ background: url(../img/space-bg.png) repeat-x fixed -80% 0; \n  background:\
    \ \n    url(../img/stars-1.png) repeat-x fixed -130% 0,\n    url(../img/stars-2.png)\
    \ repeat-x fixed 40% 0,\n    url(../img/space-bg.png) repeat-x fixed -80% 0,\n\
    \    url(../img/clouds.png) repeat-x fixed 100% 0;\n  background-color: #1a1a1a;\n\
    \ }\n```\n\nFor the single image fallback, you could choose one of the images\
    \ used in the multiple declaration, or even go so far as to create a flattened\
    \ version of the multiple layers.\n\nFor the moon site, I’ve chosen to simply\
    \ use `space-bg.png`, which is the color gradient image (FIG 5.06), therefore\
    \ serving a starless, cloudless version of the background to browsers that don’t\
    \ yet support multiple background images. How appropriate.\n\n![The Things We\
    \ Left on the Moon website with the blue and purple dust clouds as the background.](images/5-06.jpg)\n\
    \nFIG 5.06: With the single fallback image in place, IE7 now has a bit more space-y-ness\
    \ restored.\n\n## Using multiple backgrounds today\n\nIn keeping with the theme\
    \ of the other examples in the book, here we’re using multiple background images\
    \ today. We’re forging ahead with a CSS3 property that has healthy support in\
    \ Safari, Chrome, Firefox, and Opera, as well as IE9 Beta. Instead of fearing\
    \ that non-universal support and waiting it out, we’re choosing to apply the property\
    \ on a non-critical visual event (a parallax-shifting background).\n\nWe also\
    \ know that if the browser doesn’t support multiple backgrounds, it will ignore\
    \ the entire `background` rule. To compensate, we’ll define a flat or alternate\
    \ single graphic in a background rule that comes before the multiple one.\n\n\
    And with all of that in mind, we can now more flexibly experiment with layering,\
    \ shifting, and positioning background images on top of each other, without the\
    \ need for extra markup. It’ll be exciting to see how this technique is used in\
    \ creative new ways.\n\n11\\. The long URL: [http://www.w3.org/TR/CSS3-background/](http://www.w3.org/TR/CSS3-background/)\
    \ [[↵]](#chapter5.html_footnote-11-backlink)\n\n12\\. [http://en.wikipedia.org/wiki/Parallax_scrolling](http://en.wikipedia.org/wiki/Parallax_scrolling)\
    \ [[↵]](#chapter5.html_footnote-12-backlink)\n\n13\\. The long URL: [http://thinkvitamin.com/design/how-to-recreate-silverbacks-parallax-effect/](http://thinkvitamin.com/design/how-to-recreate-silverbacks-parallax-effect/)\
    \ [[↵]](#chapter5.html_footnote-13-backlink)\n\n![Chapter 6: Enriching Forms](images/chap-6.png)\n\
    \nForms are another aspect of a website that can involve interaction, and therefore\
    \ they offer additional visual events that are ripe for enriching with CSS3.\n\
    \nBy default, form elements themselves can differ drastically in appearance depending\
    \ on the browser or operating system in which they’re viewed. Why not embrace\
    \ that variation by choosing to apply the portions of CSS3 that work today to\
    \ heighten the experience?"
