  trans: "\n\n## 网站在每个浏览器中都需要完全相同的体验吗？\n\n这是一个重要的问题（在此时提出也很恰当），我尝试在这个超长域名的网站上回答它（图\
    \ 3.06）：[`dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com`](http://dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com)。\n\
    \n![一个黑色背景、白色文字写着“不”的网站截图](img/3-06.jpg)\n\n图 3.06：这个名字古怪的网站 [`dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com`](http://dowebsitesneedtobeexperiencedexactlythesameineverybrowser.com)。\n\
    \n和 Faruk 的例子一样，只有当你开始与网站交互时，事情才变得有趣。表面上，该网站在大多数浏览器中看起来几乎相同，但当你移动鼠标划过屏幕和文字时（图\
    \ 3.07），一系列 CSS3 属性、过渡和变换会被应用，从而创造出独特且令人难忘的体验。\n\n![一个太空背景、白色文字写着“不”，文字下方有圆角半透明白色背景的网站截图](img/3-07.jpg)\n\
    \n图 3.07：与网站交互时，会展现出更丰富的体验。这得益于我们的朋友 CSS3。\n\n再次强调，正是在体验层中，我们逐步增强了这个网页设计。核心内容、可读性、可用性和标记保持一致且不受影响。\n\
    \n## 导航月球\n\n让我们将 CSS3 添加到设计悬停交互的概念应用到我们的案例研究中。我将带领大家创建网站顶部导航（图 3.08），其中我们结合了\
    \ `border-radius`、`text-shadow`、RGBA 和 CSS 过渡，创造出令人惊喜和愉悦的体验。\n\n![五个导航链接（新闻、事物、东西、杂物、关于）水平排列，其中“事物”悬停时显示半透明白色圆角框](img/3-08.jpg)\n\
    \n图 3.08：案例研究的顶部导航，悬停时通过 CSS3 增强效果。\n\n### 首先，标记\n\n作为优秀的语义学家，我们将使用一个经典的无序列表来标记顶部导航。\n\
    \n```\n<ul id=\"nav\">\n  <li><a href=\"#\">新闻</a></li>\n  <li><a href=\"#\">事物</a></li>\n\
    \  <li><a href=\"#\">东西</a></li>\n  <li><a href=\"#\">杂物</a></li>\n  <li><a href=\"\
    #\">关于</a></li>\n</ul>\n```\n\n当然，这里并没有什么惊天动地的东西——只是一个合适的结构，我们可以用它来开始应用样式。\n\n\
    ### 浮动列表项\n\n首先，让整个列表浮动，并使用一些内边距将其定位到页面右侧；然后，也让每个列表项浮动。\n\n```\n#nav {\n  float:\
    \ right;\n  padding: 42px 0 0 30px;\n  }\n\n#nav li {\n  float: left;\n  margin:\
    \ 0 0 0 5px;\n  }\n```\n\n图 3.09 显示了结果。我们的列表现在是水平的。\n\n![默认蓝色链接颜色、无内边距的水平导航链接列表](img/3-09.jpg)\n\
    \n图 3.09：通过几条 CSS 规则变为水平的链接列表。\n\n### 使用 RGBA 设置链接颜色\n\n接下来，为每个链接添加一些内边距，并将颜色改为半透明白色。我们将使用\
    \ RGBA 将白色（`255, 255, 255`）设置为 70% 不透明度（`0.7`），让文字吸收一些其后的背景颜色（图 3.10）。\n\n```\n\
    #nav li a {\n  padding: 5px 15px;\n  font-weight: bold;\n  color: rgba(255, 255,\
    \ 255, 0.7);\n  }\n```\n\n![半透明白色、带有内边距以分隔链接的水平导航链接列表](img/3-10.jpg)\n\n图 3.10：现在链接使用\
    \ RGBA 样式，使文字与背景略微融合。\n\n图 3.11 显示了链接的特写，通过 RGBA 设置的 70% 不透明度的白色让背景微微透出。\n\n![半透明链接的特写，显示背景略微透出](img/3-11.jpg)\n\
    \n图 3.11：半透明链接的放大视图。\n\n### 为 RGBA 提供后备方案\n\n虽然 RGBA 是一种非常灵活的方式来指定颜色及其不透明度，但并非所有浏览器都支持。当前版本的\
    \ Safari、Chrome、Firefox 和 Opera 都支持它，Internet Explorer 9 也支持——但 IE6–8 呢？\n\n这时指定一个*后备*颜色就派上用场了。当使用\
    \ RGBA 分配颜色值时，最佳实践是先指定一个纯色，作为不支持 RGBA 的浏览器的回退方案。\n\n```\n#nav li a {\n  padding:\
    \ 5px 15px;\n  font-weight: bold;\n  color: #ccc; \n  color: rgba(255, 255, 255,\
    \ 0.7);\n  }\n```\n\n*支持* RGBA 的浏览器会覆盖纯色（此处为浅灰色 `#ccc`），而*不支持* RGBA 的浏览器则会忽略 RGBA\
    \ 规则。\n\n因此，需要记住一个重要点：在 RGBA 规则*之前*的单独规则中为 RGBA 颜色指定纯色后备。\n\n### 添加 text-shadow\n\
    \n作为链接样式的最后一项补充，让我们添加一个非常微妙的 `text-shadow`。我们将再次使用 RGBA 来定义阴影的颜色，让 50% 不透明度的半透明黑色与背后的背景融合。\n\
    \n```\n#nav li a {\n  padding: 5px 15px;\n  font-weight: bold;\n  color: #ccc;\n\
    \  color: rgba(255, 255, 255, 0.7);\n  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);\
    \ \n  }\n```\n\n图 3.12 显示了在 Safari 中查看时，未应用 `text-shadow`（左）和应用了 `text-shadow`（右）的文字链接对比。这是一个几乎难以察觉的细节，但微小的阴影为文字提供了足够的“提升感”，使其脱离背后的太空背景。\n\
    \n![未应用 text-shadow 的链接与应用 text-shadow 的链接对比，半透明黑色 text-shadow 几乎不可见](img/3-12.jpg)\n\
    \n图 3.12：未应用 `text-shadow`（左）和应用了 `text-shadow`（右）的链接对比。\n\n请记住，`text-shadow`\
    \ 在当前版本的 Safari、Chrome、Firefox 和 Opera 中有效。不支持 `text-shadow` 的浏览器（**咳咳** IE）会无害地忽略该规则。没有阴影，没问题。\n\
    \n有了 `text-shadow`，我们现在可以自由地继续处理 `:hover` 效果了。而这里我们将更多地依赖 CSS3。\n\n### 悬停和聚焦样式\n\
    \n我们将为每个链接的 `:hover` 状态添加颜色变化和背景颜色。再次使用 RGBA 在 `:hover` 时设置半透明白色背景。\n\n```\n#nav\
    \ li a {\n  padding: 5px 15px;\n  font-weight: bold;\n  color: #ccc;\n  color:\
    \ rgba(255, 255, 255, 0.7);\n  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);\n  }\n\
    \n#nav li a:hover,\n#nav li a:focus {\n  color: #fff;\n  background: rgba(255,\
    \ 255, 255, 0.15);\n  }\n```\n\n因此，在 `:hover` 时，我们将文字颜色改为纯白色，并添加 15% 不透明度的白色背景。我还进一步为链接处于*聚焦*状态时声明了此样式。例如，使用键盘导航的用户在链接聚焦时也会看到这一变化。\n\
    \n图 3.13 显示了链接新的 `:hover`（和 `:focus`）状态。支持 RGBA 的浏览器将在更亮的白色文字后面获得半透明白色背景。\n\n\
    ![水平导航链接列表，其中一个链接悬停，显示其下方的方形半透明白色背景](img/3-13.jpg)\n\n图 3.13：显示 `:hover` 状态，现在通过\
    \ RGBA 实现了半透明背景。\n\n### 使用 border-radius 圆角悬停\n\n更进一步，我们可以使用 CSS3 的 `border-radius`\
    \ 属性将悬停背景的角变圆，为支持它的浏览器创建药丸形状。\n\n回顾我们在第 1 章中学到的关于 `border-radius` 属性以及使我们今天能够使用它的厂商前缀的知识，我们可以将堆叠添加到默认链接声明中，如下所示：\n\
    \n"
- fmt: "\n```\n#nav li a {\n  padding: 5px 15px;\n  font-weight: bold;\n  color: #ccc;\n\
    \  color: rgba(255, 255, 255, 0.7);\n  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);\n\
    \  -webkit-border-radius: 14px;\n  -moz-border-radius: 14px;\n  border-radius:\
    \ 14px; \n  }\n\n#nav li a:hover,\n#nav li a:focus {\n  color: #fff;\n  background:\
    \ rgba(255, 255, 255, 0.15);\n  }\n```\n\nFIGURE 3.14 shows the `:hover` background\
    \ treatment now with rounded corners via `border-radius`, which will be seen in\
    \ Safari, Chrome, Firefox, and Opera, as well as IE9. And remember, we’ve placed\
    \ the non-prefixed `border-radius` property *last* in the list, ensuring the ultimate\
    \ implementation will trump the vendor-prefixed ones. For example, Safari 5 now\
    \ supports both the *non*-prefixed `border-radius` property as well as `-webkit-border-radius`\
    \ supported in Safari 4.\n\n![Horizontal list of navigation links with one link\
    \ hovered over, showing a rounded semi-transparent white background underneath\
    \ it.](images/3-14.jpg)\n\nFIG 3.14: Rounding the corners of the background with\
    \ `border-radius`.\n\nYou might be wondering why I’m placing the `border-radius`\
    \ rules in the `#nav li a` declaration and not in the `#nav li a:hover` declaration\
    \ (where it’s being revealed). The answer lies in the CSS transition we’re going\
    \ to add next as a final bit of polish.\n\n### Adding a transition\n\nLastly,\
    \ let’s take what we learned in [Chapter 2](#chapter2.html) and add a transition\
    \ to the `:hover` and `:focus` on the nav links. This will smooth out the appearance\
    \ of the background pill, subtly bringing it into focus behind the text. The transition\
    \ will also smooth out the text color change from semi-transparent white to fully\
    \ white (FIG 3.15).\n\n![Several steps in the animated transition from semi-transparent\
    \ text with no background, to a brighter white text with a rounded, semi-transparent\
    \ white background.](images/3-15.jpg)\n\nFIG 3.15: The easing in and out when\
    \ the transition is in place.\n\nHere, we’ll add the stack for transitions that\
    \ currently work in Safari, Chrome, Firefox (4.0), and Opera, with the non-prefixed\
    \ `transition` property last in the declaration for eventual implementation by\
    \ additional browsers (or future versions).\n\n```\n#nav li a {\n  padding: 5px\
    \ 15px;\n  font-weight: bold;\n  color: #ccc;\n  color: rgba(255, 255, 255, 0.7);\n\
    \  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);\n  -webkit-border-radius: 14px;\n\
    \  -moz-border-radius: 14px;\n  border-radius: 14px;\n  -webkit-transition: all\
    \ 0.3s ease-in-out; \n  -moz-transition: all 0.3s ease-in-out;\n  -o-transition:\
    \ all 0.3s ease-in-out;\n  transition: all 0.3s ease-in-out; \n  }\n\n#nav li\
    \ a:hover,\n#nav li a:focus {\n  color: #fff;\n  background: rgba(255, 255, 255,\
    \ 0.15);\n  }\n```\n\nRemember that we add the transition properties to the normal\
    \ state of the element to be transitioned. Transitions are designed this way in\
    \ order for the transition to happen not only on `:hover`, but also on `:focus`\
    \ or `:active` states as well.\n\nI’m using the `all` value in our transition\
    \ to catch *all* the properties that change on `:hover` and `:focus`—`color` and\
    \ `background` in this case. Alternatively, we could’ve achieved the same transition\
    \ by listing each of those properties explicitly in a comma-delimited list like\
    \ this:\n\n```\n-webkit-transition: \n  color 0.3s ease-in-out, \n  background\
    \ 0.3s ease-in-out;\n-moz-transition: \n  color 0.3s ease-in-out, \n  background\
    \ 0.3s ease-in-out;\n-o-transition: \n  color 0.3s ease-in-out, \n  background\
    \ 0.3s ease-in-out;\ntransition: \n  color .3s ease-in-out, \n  background .3s\
    \ ease-in-out;\n```\n\nYou can quickly see how the `all` value is a bit more compact\
    \ and efficient for transitioning multiple changes on an element.\n\n### Hover-crafting\
    \ the experience\n\nWe’ve just walked through a rather simple example, adding\
    \ various CSS3 properties to the experience layer. Browsers that are capable will\
    \ ease in a semi-transparent, rounded background color behind text-shadowed text\
    \ links. Browsers that aren’t capable don’t get the enhanced hover experience,\
    \ but that’s perfectly OK. What they do get is a semantically-structured horizontal\
    \ list of links—and that foundation is what’s most important here.\n\nI think\
    \ this little exercise also demonstrates how efficient it is to achieve something\
    \ that previously would have required Flash and/or JavaScript to achieve. The\
    \ CSS rules that we used are simple and straightforward, harmless for browsers\
    \ that don’t yet support them.\n\nWe’ve also future-proofed our CSS3 by ensuring\
    \ that the property from the spec is included last in our rules. Duplicating these\
    \ rules with the appropriate vendor-specific prefixes is a necessary effort—but\
    \ one where the payoff is golden: getting to use CSS3 *right now* to enhance the\
    \ experience for many users.\n\n## Simple and flexible hovering using opacity\n\
    \nWe’re constantly looking for solutions that save time and offer additional flexibility.\
    \ This is precisely what CSS3 offers us in spades: the ability to achieve, in\
    \ a few lines of code, what used to take more time and resources to create and\
    \ maintain.\n\nYet another tool for the hover-crafting arsenal is the `opacity`\
    \ property. As mentioned in [Chapter 1](#chapter1.html), `opacity` is a CSS3 property\
    \ that allows you to specify how opaque a given element is. Coupled with the aforementioned\
    \ RGBA, `opacity` offers another method to add transparency to the designs we\
    \ create for the web.\n\nOne of the ways I like to use `opacity` is to create\
    \ simple and flexible hover states for hyperlinked graphics, using the variation\
    \ in transparency to create multiple states from a single image. Add a CSS transition\
    \ into the mix and you now have a wonderfully rich experience for linked graphics\
    \ on the page that’s easy to maintain.\n\nLet’s take a look at how the `opacity`\
    \ property is used on the moon case study.\n\n### Opacity on clickable images\n\
    \nFIGURE 3.16 shows the footer of the moon example site, where, underneath some\
    \ legal copy and a shocking disclaimer, sit three clickable logos.\n\n![Screenshot\
    \ showing the footer of the site with the text &quot;This is a fictional case\
    \ study, handcrafted by SimpleBits in Salem, Massachusetts. We didn't really leave\
    \ that stuff on the moon. Copyright 2010,&quot; beneath which site three logos:\
    \ the SimpleBits logo (a box with brackets around it), an RSS logo (radio waves\
    \ in a circle), and a bit monster (pixellated robot character).](images/3-16.jpg)\n\
    \nFIG 3.16: The footer of *Things We Left on the Moon.*\n\nWe’re going to use\
    \ the `opacity` property to not only control the `:hover` and `:focus` treatment,\
    \ but also to set the *initial* level of transparency. And a CSS transition will\
    \ smooth out and animate that change for a complete effect.\n\n### The markup\n\
    \nLike the previous top navigation example, the markup for these footer logos\
    \ is simple and semantic—just an unordered list of hyperlinked images:\n\n```\n\
    <ul id=\"footer-logos\">\n  <li><a href=\"#\"><img src=\"img/logo-sb.png\"  \n\
    \    alt=\"SimpleBits logo\" /></a>\n  </li>\n  <li><a href=\"#\"><img src=\"\
    img/icon-feed.png\" alt=\"RSS feed\" /></a>\n  </li>\n  <li><a href=\"#\"><img\
    \ src=\"img/icon-bitman.png\"  \n    alt=\"BitMan\" /></a>\n  </li>\n</ul>\n```\n\
    \n### Opacity and image efficiency\n\nI’ve actually created the icons themselves\
    \ as fully-white PNG images, knowing that I can later use the `opacity` property\
    \ to adjust the level of transparency with CSS. This has changed the way I think\
    \ about graphic assets for web projects in some situations.\n\nInstead of saving\
    \ semi-transparent PNGs, I’ll save fully opaque versions (FIG 3.17) that I can\
    \ adjust in the browser. This not only saves time, it also allows us to vary that\
    \ `opacity` level on `:hover`, `:focus`, and `:active` states without needing\
    \ to create multiple sets of images.\n\n![Three logo files (bit monster, RSS symbol,\
    \ and SimpleBits logo) shown in Photoshop against a transparent background.](images/3-17.jpg)\n\
    \nFIG 3.17: The logo PNGs are created fully-white.\n\n### Styling the list\n"
