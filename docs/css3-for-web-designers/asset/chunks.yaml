  trans: "\n\n首先，一些样式技巧会将页脚中的图片居中，并使其水平排列而非垂直排列（图 3.18）。\n\n```\n#footer-logos {\n\
    \  text-align: center;\n  }\n#footer-logos li {\n  display: inline;\n  }\n```\n\
    \n![再次展示页脚，三个徽标完全以白色显示并居中。](img/3-18.jpg)\n\n图 3.18：白色 PNG 图片在页脚中居中显示。\n\n接下来，我们添加\
    \ `opacity` 值，让图标在默认状态下变暗，在悬停或聚焦时则变亮一些。\n\n```\n#footer-logos a img {\n  opacity:\
    \ 0.25;\n  }\n\n#footer-logos a:hover img,\n#footer-logos a:focus img {\n  opacity:\
    \ 0.6;\n  }\n```\n\n这里我们将图片的透明度设为 25%，然后在悬停或聚焦时将其提升至 60%（图 3.19）。很简单，不是吗？而且只需要一组图片。\n\
    \n![再次展示页脚，三个徽标以半透明白色显示；中间的徽标处于悬停状态，显示为更亮的白色。](img/3-19.jpg)\n\n图 3.19：通过调整 `opacity`\
    \ 展示页脚图标的 `:hover` 状态。\n\n请注意，`opacity` 属性不需要厂商前缀，在 Safari、Chrome、Firefox 和 Opera\
    \ 中都能正常工作。IE8 及更低版本不支持 `opacity`，但对于那些不介意使用专有方案的人来说，也有一个* hack 式的*解决方案。\n\n###\
    \ IE 的 opacity hack\n\n值得庆幸的是，`opacity` 现在已得到 Internet Explorer 9 Beta 的支持，但我们也可以通过使用微软专有的\
    \ `filter` 属性，在旧版 IE 中模拟出相同的效果。\n\n通常我不建议使用 `filter`，因为（与带厂商前缀的属性不同）它不属于任何提议标准的一部分。此外，使用\
    \ `filter` 属性可能会带来额外的性能开销，具体取决于使用的位置或频率。这是一个 hack——但它提供了一种达到目的的手段。\n\n只要你理解这一点，并且或许将该属性的使用隔离到单独的样式表中，或者仔细地添加注释，那么它就是一种可行的方法。\n\
    \n具体做法如下：\n\n```\n#footer-logos a img {\n  border: none;\n  opacity: 0.25;\n \
    \ -ms-filter: \"progid:DXImageTransform.Microsoft.Alpha(Opacity=25)\"; /* IE 8\
    \ hack */\n  filter: alpha(opacity = 25); /* IE 5-7 hack */ \n  }\n\n#footer-logos\
    \ a:hover img,\n#footer-logos a:focus img {\n  opacity: 0.6;\n  -ms-filter:\"\
    progid:DXImageTransform.Microsoft.Alpha(Opacity=60)\"; /* IE 8 hack */\n  filter:\
    \ alpha(opacity = 60); /* IE 5-7 hack */\n  }\n```\n\n语法类似，通过 IE 的 alpha 滤镜传递一个透明度值。请注意，IE8\
    \ 会忽略 `filter` 属性，而需要使用带厂商前缀的 `-ms-filter` 并附加一些（丑陋的）值。\n\n有了这些 hack，你现在就能在 Internet\
    \ Explorer 中看到相同的结果了（图 3.20）。再次强调，请谨慎使用，甚至最好不用。但现实是，如果你的任何网站有可观的 IE 流量（大多数网站都有），你很可能需要用到它。\n\
    \n![在 IE7 中展示页脚，居中的徽标处于悬停状态，显示为更亮的白色。](img/3-20.jpg)\n\n图 3.20：在 IE7 中，通过 `filter`\
    \ hack 模拟 `opacity` 属性的效果。\n\n### 添加过渡效果\n\n最后，为 `opacity` 的切换添加一个过渡效果，可以平滑该值的变化，并提供一些动画丰富度，将整个技术串联起来。\n\
    \n让我们在声明中添加（现已熟悉的）`transition` 堆栈，这次专门过渡 `opacity` 属性。我们将使其相当快（仅 0.2 秒），并采用缓入缓出效果。\n\
    \n```\n#footer-logos a img {\n  opacity: 0.25;\n  -ms-filter: \"progid:DXImageTransform.Microsoft.Alpha(Opacity=25)\"\
    ; /* IE 8 hack */ \n  filter: alpha(opacity = 25); /* IE 5-7 hack */\n  -webkit-transition:\
    \ opacity 0.2s ease-in-out; \n  -moz-transition: opacity 0.2s ease-in-out; \n\
    \  -o-transition: opacity 0.2s ease-in-out; \n  transition: opacity 0.2s ease-in-out;\
    \ \n  }\n\n#footer-logos a:hover img,\n#footer-logos a:focus img {\n  opacity:\
    \ 0.6;\n  -ms-filter: \"progid:DXImageTransform.Microsoft.Alpha(Opacity=60)\"\
    ; /* IE 8 hack */\n  filter: alpha(opacity = 60); /* IE 5-7 hack */ \n  }\n```\n\
    \n有了过渡效果，我们现在就有了一种简单的技术，通过使用一组图片，利用透明度来打造灵活的悬停体验。\n\n## 去打造悬停效果吧\n\n正如我之前提到的，这个解决方案影响了我对设计资源图形创作方式的思考。我们可以使用\
    \ `opacity` 来控制图形默认状态下的显示方式，使其融入背景——然后为 `:hover`、`:focus` 和 `:active` 状态应用不同的值，并通过过渡效果将其与支持该特性的浏览器结合起来。\n\
    \n下次你在自己的设计中为超链接图片创建悬停效果时，请记住 `opacity` 属性。你将节省时间、带宽，以及避免其他解决方案可能带来的不必要的复杂性。\n\
    \n使用 CSS3 打造悬停效果，就是快速高效地添加简单的样式，丰富体验层，让现在和未来支持这些属性的浏览器给用户带来惊喜和愉悦。如果浏览器不支持你创建的高保真体验，那完全没问题，因为用户不会知道自己错过了什么。\n\
    \n![第 4 章：变换信息](img/chap-4.png)\n\n与 CSS 过渡类似，CSS 变换最初也是由 WebKit 团队开发的，后来被纳入 W3C\
    \ 的两个独立工作草案中：\n\n1.  CSS 2D 变换（[`www.w3.org/TR/CSS3-2d-transforms/`](http://www.w3.org/TR/css3-2d-transforms/)）\n\
    \n2.  CSS 3D 变换（[`www.w3.org/TR/CSS3-3d-transforms/`](http://www.w3.org/TR/css3-3d-transforms/)）\n\
    \n本书将只关注 2D 变换，因为它们是当前最实用的。仅 3D 变换的信息就足以写满一整本书，而且它们非常神奇。但 2D 变换在浏览器支持方面最具优势，包括\
    \ Safari 3.2、Chrome 3.2、Firefox 4.0 和 Opera 10.5（与过渡一样）。\n\n那么，CSS 变换到底是什么？W3C\
    \ 是这样描述的：\n\n> CSS 2D 变换允许由 CSS 渲染的元素在二维空间中进行变换。^(9)\n\n嗯，这很有帮助。理解变换的最佳方式就是看实际效果。\n\
    \n那么，我们先通过一个简单的例子，在一个小型图片库上应用各种 2D 变换。然后在本章后面，我们将在月球示例网站上实际运用这些相同的技术。\n\n## 缩放变换\n\
    \n想象一个水平排列的列表，包含三张带有微妙边框的照片，来自最近一次去玛莎葡萄园岛（马萨诸塞州海岸外的一个小岛）的旅行（图 4.01）。这是一种相当典型的设计模式：一个链接图片的网格。\n\
    \n![三张照片，从左到右：码头下的水面、海滩场景、长椅上的贝壳。照片水平排列，背景为浅灰色，周围有白色边框。](img/4-01.jpg)\n\n图 4.01：三张超链接照片的网格。\n\
    \n我们将再次依赖我们可靠的无序列表来标记这些内容：\n\n```\n<ul class=\"gallery\">\n  <li><a href=\"#\"\
    ><img src=\"photo-1.jpg\" /></a></li>\n  <li><a href=\"#\"><img src=\"photo-2.jpg\"\
    \ /></a></li>\n  <li><a href=\"#\"><img src=\"photo-3.jpg\" /></a></li>\n</ul>\n\
    ```\n\n在未应用任何样式的情况下，图 4.02 显示了该列表的默认外观。请注意，图片比我们最终设计中想要的要大得多。这是有意为之，因为我们稍后将使用\
    \ CSS 来缩小它们。\n\n![同样的三张照片，垂直排列，每张照片左侧有圆形项目符号。照片比上一张图中的略大。](img/4-02.jpg)\n\n图\
    \ 4.02：应用 CSS 之前的大照片列表。\n\n### 添加样式\n\n让我们添加一些 CSS，将这个垂直的照片列表变成水平网格，并为每张图片添加 1\
    \ 像素的边框（同时注意页面背景为浅灰色 `#eee`）。\n\n"
- fmt: "\n```\nul.gallery li {\n  float: left;\n  margin: 0 10px;\n  padding: 10px;\n\
    \  border: 1px solid #ddd;\n  list-style: none;\n  }\n\nul.gallery li a img {\n\
    \  float: left;\n  width: 200px;\n  }\n```\n\nHere we’ve floated the list items,\
    \ turned `list-style` bullets off, and wrapped each `li` in a one pixel gray border.\
    \ We’ve also floated the images themselves and sized them down to 200 pixels wide.\n\
    \nThose two compact declarations will get us where we want to go in terms of a\
    \ default design (refer back to FIG 4.01).\n\n### Applying the scale transform\
    \ on hover\n\nNow it’s time for transforms. Let’s add a `scale` transform to make\
    \ the photo larger when hovered. Remember that the original images in the markup\
    \ are larger than the 200 pixel width we’re specifying in the stylesheet. That\
    \ means we can safely scale up the photo while maintaining its quality.\n\nScale\
    \ transforms are supported in Safari, Chrome, Firefox, and Opera—each requiring\
    \ a vendor prefix. Let’s add a stack that satisfies those browsers as well as\
    \ any future ones.\n\n```\nul.gallery li a:hover img {\n  -webkit-transform: scale(1.5);\n\
    \  -moz-transform: scale(1.5);\n  -o-transform: scale(1.5);\n  transform: scale(1.5);\n\
    \  }\n```\n\nWhen the hyperlinks are hovered, we’re saying, “scale the images\
    \ to 1.5 times their initial size” (which was 200px wide). Setting `scale(2)`\
    \ would make the photo twice as large, `scale(0.5)` would make it half as large,\
    \ etc.\n\nFIGURE 4.03 shows the result, viewed here in Safari. Notice how the\
    \ `transform` doesn’t disturb the rest of the elements in the document, and zooms\
    \ the photo out from the center, without affecting the layout around it.\n\n![The\
    \ three photos in a horizontal list, with the center photo hovered over. The centered\
    \ photo is larger and overlaps the photos to the right and left.](images/4-03.jpg)\n\
    \nFIG 4.03: The middle photo being hovered and scaled with a CSS transform.\n\n\
    You can also optionally set a `transform-origin` that will dictate where the scaling\
    \ will expand from: top, bottom, center, or a percentage (see [http://bkaprt.com/css3/8/](http://bkaprt.com/css3/8/)).^([10](#chapter4.html_footnote-10))\n\
    \nFor example, to have the photo scale out from the bottom left of its container\
    \ instead of the center, you’d write this:\n\n```\nul.gallery li a:hover img {\n\
    \  -webkit-transform-origin: bottom left; \n  -moz-transform-origin: bottom left;\
    \ \n  -o-transform-origin: bottom left; \n  transform-origin: bottom left; \n\
    \  -webkit-transform: scale(1.5);\n  -moz-transform: scale(1.5);\n  -o-transform:\
    \ scale(1.5);\n  transform: scale(1.5);\n  }\n```\n\n### An appropriate drop shadow\n\
    \nWe could go a step further with this example and add a drop shadow to the photo\
    \ when hovered. This would be an appropriate use of the CSS3 `box-shadow` property,\
    \ as we’re making the enlarged photo appear as if it’s pulling up off the page.\n\
    \nNow, the drop shadow is a delicate beast, an often overused crutch by the trigger-happy\
    \ designer. It’s easy to get carried away and overdo it. But in this case, we’re\
    \ attempting to add *dimension* to the photo enlargement, so it should work out\
    \ quite well.\n\nThe syntax for `box-shadow` is identical to the `text-shadow`\
    \ property we used back in [Chapter 3](#chapter3.html). However, unlike `text-shadow`,\
    \ `box-shadow` requires vendor prefixes in order to work in Safari, Chrome, and\
    \ Firefox. (Opera 10+ and IE9 Beta support the non-prefixed `box-shadow`.) Let’s\
    \ fold those rules in.\n\n```\nul.gallery li a:hover img {\n  -webkit-transform:\
    \ scale(1.5);\n  -moz-transform: scale(1.5);\n  -o-transform: scale(1.5);\n  transform:\
    \ scale(1.5);\n  -webkit-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);\n  -moz-box-shadow:\
    \ 4px 4px 10px rgba(0, 0, 0, 0.5);\n  box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);\
    \ \n  }\n```\n\nWe’ve added a CSS3 stack for the `box-shadow` property for the\
    \ WebKit and Mozilla browsers that support it, ending with the non-prefixed version\
    \ as we have with other examples.\n\nIn terms of the syntax, here we’re applying\
    \ a shadow on the hovered image that is `4px` from the top, `4px` from the left,\
    \ has a `10px` blur, and is black at 50% opacity (ensuring it’ll blend in to whatever\
    \ background or element sits behind it).\n\nFIGURE 4.04 shows the shadow now appearing\
    \ in conjunction with the `scale` transform when a photo is hovered over. This\
    \ combination gives the effect of having the enlarged photo pop out from the page.\n\
    \n![The centered photo hovered over again, with a shadow underneath.](images/4-04.jpg)\n\
    \nFIG 4.04: The hovered photo, now scaled with `box-shadow` applied.\n\n### Smoothing\
    \ out the zoom with a transition\n\nLastly, adding a transition to the linked\
    \ photos will smooth out the scaling, giving the `:hover` treatment an animated\
    \ zoom-in-and-out—an effect previously only possible with Flash or JavaScript,\
    \ but now possible in many browsers with just the few lines of CSS3.\n\nHere’s\
    \ the transition stack added to the complete CSS for our little photo gallery:\n\
    \n```\nul.gallery li {\n  float: left;\n  margin: 0 10px;\n  padding: 10px;\n\
    \  border: 1px solid #ddd;\n  list-style: none;\n  }\n\nul.gallery li a img {\n\
    \  float: left;\n  width: 200px;\n  -webkit-transition: -webkit-transform 0.2s\
    \ ease-in-out;\n  -moz-transition: -moz-transform 0.2s ease-in-out;\n  transition:\
    \ transform 0.2s ease-in-out; \n  }\n\nul.gallery li a:hover img {\n  -webkit-transform:\
    \ scale(1.5);\n  -moz-transform: scale(1.5);\n  -o-transform: scale(1.5);\n  transform:\
    \ scale(1.5);\n  -webkit-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);\n  -moz-box-shadow:\
    \ 4px 4px 10px rgba(0, 0, 0, 0.5);\n  box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);\
    \ \n  } \n```\n\nNotice this time, the property we’re transitioning is the `scale`\
    \ transform, hence the appropriate vendor prefixes are in place for both the `transition`\
    \ and `transform` properties.\n\n## Transforming the experience\n\nWith everything\
    \ in place, the result is quite impressive for the minimal amount of CSS that’s\
    \ required to make it happen. We’re putting most of the burden of the effect back\
    \ on the browsers that support it, rather than injecting Flash or JavaScript to\
    \ make it happen.\n\nAgain, the place where we chose to fully embrace CSS3 in\
    \ this particular example is in the experience layer: when the photo is hovered,\
    \ we’re offering an enhanced view. It’s not critical for browsers that don’t support\
    \ those properties.\n\nUsers of Internet Explorer, for example, will just see\
    \ a gallery of clickable thumbnails, and that’s perfectly OK. If the hover treatment\
    \ was *critical*, then we’d need to rethink our use of CSS3 to achieve the visual\
    \ experience.\n\n## Rotate, skew, and translate\n\nIn addition to `scale`, there\
    \ are three other transforms available for rotating, skewing, and translating\
    \ elements. (Translate moves elements via x/y coordinates.) Let’s add each to\
    \ the photo gallery example to quickly see how they operate.\n\n### Adding rotation\n\
    \nIf we wanted to rotate the photo when hovered, while still scaling it up, we\
    \ can add the following `rotate` transform to the `:hover` rule:\n\n```\nul.gallery\
    \ li a:hover img {\n  -webkit-transform: scale(1.5) rotate(-10deg);\n  -moz-transform:\
    \ scale(1.5) rotate(-10deg);\n  -o-transform: scale(1.5) rotate(-10deg);\n  transform:\
    \ scale(1.5) rotate(-10deg);\n  -webkit-box-shadow: 4px 4px 10px rgba(0, 0, 0,\
    \ 0.5);\n  -moz-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);\n  box-shadow: 4px\
    \ 4px 10px rgba(0, 0, 0, 0.5);\n  }\n```\n\nWe’re still scaling up the photo on\
    \ hover, but we’re also tipping the photo 10 degrees to the left using `rotate`\
    \ (FIG 4.05). This will work in Safari, Chrome, Firefox, and Opera. A negative\
    \ value from `-1deg` to `-360deg` rotates the element counter-clockwise, while\
    \ a positive value from `1deg` to `360deg` rotates it clockwise.\n\n![The left\
    \ photo is hovered over and rotated to the left, with a shadow underneath.](images/4-05.jpg)\n\
    \nFIG 4.05: A hovered photo, now scaled and rotated to the left using the `rotate`\
    \ transform.\n"
