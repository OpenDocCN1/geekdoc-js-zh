    \ label {\n  display: block;\n  font-weight: bold;\n  line-height: 1.4;\n  color:\
    \ #666;\n  color: rgba(0, 0, 0, 0.6);\n  text-shadow: 0 1px 1px #fff;\n  }\n\n\
