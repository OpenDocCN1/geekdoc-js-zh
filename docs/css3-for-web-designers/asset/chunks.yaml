  trans: "\n我们将使用 `RGBA` 将纯白色调暗至 85%，让灰色渐变微微透出。同时指定阴影正好位于文本下方一个像素，并将阴影模糊一个像素。\n\n\
    图 6.13 展示了细微阴影的特写，以及按钮目前的进展。\n\n![提交按钮上白色 text-shadow 的特写，以及常规尺寸视图。](img/6-13.jpg)\n\
    \n图 6.13：我们添加的细微 `text-shadow` 的放大视图，用于营造浮雕效果。\n\n### 为按钮添加 box-shadow\n\n我们要为这个时尚小按钮添加的最后一项\
    \ CSS3 属性是非常轻微的 `box-shadow`，以增加一丝立体感。这有助于按钮在灰色背景上显得更协调。\n\n以下是一组代码，为当前支持以及未来支持的浏览器添加\
    \ `box-shadow`。\n\n```\n#thing-alerts input[type=\"submit\"] {\n  padding: 8px\
    \ 15px;\n  font-family: Helvetica, Arial, sans-serif;\n  font-weight: bold;\n\
    \  line-height: 1;\n  color: #444;\n  border: none;\n  text-shadow: 0 1px 1px\
    \ rgba(255, 255, 255, 0.85);\n  background-image: -webkit-gradient(linear, 0%\
    \ 0%, 0% 100%, from(#fff), to(#bbb));\n  background-image: -moz-linear-gradient(0%\
    \ 100% 90deg, #bbb, #fff);\n  background-color: #fff;\n  -webkit-border-radius:\
    \ 23px;\n  -moz-border-radius: 23px;\n  -o-border-radius: 23px;\n  border-radius:\
    \ 23px;\n  -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);\n  -moz-box-shadow:\
    \ 0 1px 2px rgba(0, 0, 0, 0.5);\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); \n\
    \  } \n```\n\n图 6.14 展示了在 Safari 中为按钮添加 `box-shadow` 后的效果，该阴影距离顶部 `1px`，模糊 `2px`。颜色方面，我们使用\
    \ `RGBA` 以 50% 透明度应用黑色，使阴影具有一定透明度，让背景透出。\n\n![提交按钮下方灰色阴影的特写，以及常规尺寸视图。](img/6-14.jpg)\n\
    \n图 6.14：添加到按钮底部的微小 `box-shadow` 的放大视图，使其略微脱离背景。\n\n这不仅完成了我们的按钮，也完成了整个表单。通过使用几行额外的\
    \ CSS3，我们将一个原本默认外观的表单塑造成更具风格、与页面其他设计更协调的样子。我们选择使用 CSS3 而非图片，因为对于尚不支持这些高级规则的浏览器来说，这样做完全可行且无害。让我们来确认一下。\n\
    \n## 其他浏览器呢？\n\n如果我们在 Internet Explorer 7（完全不支持 CSS3 的浏览器）中查看表单，会看到一个完全可以接受且功能正常的表单（图\
    \ 6.15）。这是个好消息！我们通过样式表中的少量 CSS3 规则添加的所有增强效果都被安全地忽略了，留下了一个功能完备的极简表单。任务完成。\n\n![IE7\
    \ 中的表单；输入框没有圆角，也没有渐变或文本阴影。](img/6-15.jpg)\n\n图 6.15：在 IE7 中，表单看起来像普通表单，功能也正常。这很好。\n\
    \n## 使用 box-shadow 创建焦点状态\n\n我们可以更进一步丰富表单交互，在输入框的焦点状态上使用 `box-shadow` 属性。这快速、简单，并且像前面提到的\
    \ CSS3 一样，优雅降级。\n\n只需创建一个新声明，并在文本输入框的属性选择器上添加 `:focus` 伪类即可。\n\n（顺便说一句，如果你需要搭讪的话，前面这段话绝对是个好梗。以后谢我吧。）\n\
    \n```\n#thing-alerts input[type=\"text\"]:focus {\n  -webkit-box-shadow: 0 0 12px\
    \ rgba(51, 204, 255, 0.5);\n  -moz-box-shadow: 0 0 12px rgba(51, 204, 255, 0.5);\n\
    \  box-shadow: 0 0 12px rgba(51, 204, 255, 0.5);\n  }\n```\n\n这个声明包含一组 `box-shadow`，当文本输入框获得焦点时，会应用\
    \ 50% 透明度的亮蓝色阴影。我们在图 6.16 中看到了结果，它模仿了操作系统默认的焦点输入框行为，但通过自定义，我们对外观有了更多控制。\n\n![文本输入框获得焦点时出现蓝色光晕。](img/6-16.jpg)\n\
    \n图 6.16：对文本输入框的 `:focus` 状态应用了 `box-shadow`。\n\n那些不支持 `box-shadow` 的浏览器呢？它们只是在获得焦点时显示普通输入框。我敢打赌你能猜到我要说什么……没错，这完全没问题。\n\
    \n## 添加 CSS 动画以丰富表单交互\n\n在焦点处理的 `box-shadow` 基础上更进一步，如果阴影也*动画化*，比如像等待你输入一样脉动，会怎样？让我们短暂进入\
    \ CSS 动画的世界，在基于 WebKit 的浏览器中实现这一效果。\n\n我在这里说基于 WebKit 的浏览器，是因为 CSS 动画（如 CSS 变换和过渡）最初由\
    \ WebKit 团队开发，随后被纳入 W3C 的提议标准（[`bkaprt.com/css3/16/`](http://bkaprt.com/css3/16/)）。^(19)\
    \ 然而，与变换和过渡不同，动画尚未被其他浏览器实现。它们目前能在 Safari 和 Chrome 中运行，但 Firefox 或 Opera 不支持，IE9\
    \ 也没有计划支持。因此，我不会过多关注动画（至少目前如此）。尽管它们*确实*强大且令人兴奋，但它们的普及程度能否像变换和过渡那样全面且迅速，仍有待观察——而变换和过渡已经获得了相当不错（且不断增长）的支持。\n\
    \n尽管如此，创建 CSS 动画的概念和语法相当直接，对于目前只有 WebKit 浏览器能享受的非关键增强，将其注入合适的位置是很有趣的。让我们为输入框的焦点状态添加一个简单的动画，以了解其工作原理。\n\
    \n### 使用关键帧\n\n构建 CSS 动画的第一步是创建关键帧声明。熟悉编程的人可能会将其类比为构建一个函数，可以在样式表的其他地方调用和引用。\n\n\
    `keyframe` 是一种专门的 CSS at 规则。它类似于普通的 CSS 声明，但允许你使用标识符为其命名，并通过一系列百分比值（或关键字“to”和“from”）指定\
    \ CSS 规则以及随时间的变化。\n\n直接看一个实际例子会更清楚，所以让我们创建一个简单的动画，使之前添加到焦点输入框的 `box-shadow` 淡入淡出。\n\
    \n我们将它命名为“pulse”，并设置三个略有不同的规则：一个在起点（0%），一个在中点（50%），一个在终点（100%）。每个百分比规则只是调整蓝色 `box-shadow`\
    \ 的不透明度，从 20% 上升到 90%，再回落到 20%。这种变化随时间过渡并循环，会在基于 WebKit 的浏览器中产生输入框获得焦点时脉动的效果。\n\
    \n```\n@-webkit-keyframes pulse {\n  0% {\n    -webkit-box-shadow: 0 0 12px rgba(51,\
    \ 204, 255, 0.2);\n  }\n  50% {\n    -webkit-box-shadow: 0 0 12px rgba(51, 204,\
    \ 255, 0.9);\n  }\n  100% {\n    -webkit-box-shadow: 0 0 12px rgba(51, 204, 255,\
    \ 0.2);\n  }\n}\n```\n\n这里我只为 WebKit 指定规则，使用了 `-webkit-` 厂商前缀。在本书前面，我们一直注意为所有当前支持这些属性的厂商编写重复规则，并添加无前缀版本以备将来兼容。但在这种情况下，CSS\
    \ 动画除了 Safari 和 Chrome 外仍不被支持，且其他厂商对动画是否应属于 CSS 持保留态度，因此我选择只编写 `-webkit-` 规则。\n\
    \n### 引用关键帧\n\nCSS 动画的第二部分是通过 `animation` 属性按名称引用 `keyframe`。\n\n"
- fmt: "\nIn this case, we want this pulsing of the `box-shadow` to run when a user\
    \ focuses a text input in the form. Here we’ll call the `keyframe` by name, set\
    \ a duration for the animation to run, loop it infinitely, and finally set the\
    \ transition timing function of easing in and then easing out. You can see how\
    \ the syntax for `animation` is similar to that of a `transition`.\n\n```\n#thing-alerts\
    \ input[type=\"text\"]:focus {\n  -webkit-animation: pulse 1.5s infinite ease-in-out;\n\
    }\n```\n\nWith that, we’re ensuring that the `pulse` animation runs only when\
    \ the user focuses a text input on the form (in Safari and Chrome only).\n\nThe\
    \ result is quite stunning. FIGURE 6.17 shows you what happens: a slow, animated\
    \ fade in/out of the `box-shadow` as if the input is waiting to be interacted\
    \ with.\n\n![Several steps in the animation as the blue glow around the input\
    \ fades in and out.](images/6-17.jpg)\n\nFIG 6.17: The pulsing animation that\
    \ we’ve added to the `:focus` state of the text inputs.\n\nI used the shorthand\
    \ `animation` property to set the values for calling the animation all in one\
    \ rule. Alternatively, you can specify each value with its own property like so:\n\
    \n```\n#thing-alerts input[type=\"text\"]:focus {\n  -webkit-animation-name: pulse;\n\
    \  -webkit-animation-duration: 1.5s;\n  -webkit-animation-iteration-count: infinite;\n\
    \  -webkit-animation-timing-function: ease-in-out;\n}\n```\n\n### Reusing the\
    \ animation on button hover\n\nOne of the nice things about creating keyframes\
    \ is that they can be reused throughout the stylesheet within multiple declarations.\
    \ For example, we could apply that same `pulse` animation to the submit button\
    \ when it’s hovered or focused, adding a Wii-like, blue-pulsing glow.\n\nIt’s\
    \ as simple as adding that same `animation` rule to a new `:hover`/`:focus` declaration\
    \ for the submit button, just as we did with the text inputs:\n\n```\n#thing-alerts\
    \ input[type=\"submit\"]:hover,\n#thing-alerts input[type=\"submit\"]:focus {\n\
    \  -webkit-animation: pulse 1.5s infinite ease-in-out;\n}\n```\n\nThe `pulse`\
    \ animation we previously created for text inputs fades in and out a blue `box-shadow`—but\
    \ we can use it here on the button as well, where the effect also works nicely\
    \ (FIG 6.18), glowing softly when hovered or focused, as if waiting for the user\
    \ to submit.\n\n![Several steps in the animation as the blue glow around the submit\
    \ button fades in and out.](images/6-18.jpg)\n\nFIG 6.18: The pulsing of the shadow\
    \ behind the button as it’s hovered.\n\n### What about other browsers?\n\nAdding\
    \ CSS Animations is the first time in the book where we’ve really targeted just\
    \ one browser vendor with our experience enriching: WebKit. One of the primary\
    \ reasons we’re seeing CSS3 being used more and more is because of its adoption\
    \ by Firefox, Opera, and even IE9. You might be asking if it’s worth adding CSS\
    \ Animations at this point in time. It’s certainly something to consider.\n\n\
    Either CSS Animations will remain a WebKit-only technology, or it will go the\
    \ way of Transitions and Transforms and be adopted by the others. Either way,\
    \ CSS Animations are simple, require little overhead, and are safely ignored by\
    \ browsers that don’t support them. What I’ve demonstrated here with animations\
    \ is rather rudimentary, barely scratching the surface of what’s possible on screen\
    \ with just markup and stylesheets. It’s exciting stuff, and for that reason alone\
    \ it’s worth experimenting with.\n\n## Focus on interaction\n\nIt’s rare when\
    \ form elements are also crucial brand elements, and that’s precisely why forms\
    \ are a fantastic opportunity to enhance with CSS3.\n\nForm elements differ greatly\
    \ in appearance depending on the user’s environment—but we can embrace those differences\
    \ by choosing to enrich them with advanced CSS, knowing things will degrade to\
    \ fully-functional, familiar, default form controls in browsers that don’t yet\
    \ support CSS3.\n\n14. The long URL: [http://www.456bereastreet.com/archive/200601/css_3_selectors_explained/](http://www.456bereastreet.com/archive/200601/css_3_selectors_explained/)\
    \ [[↵]](#chapter6.html_footnote-14-backlink)\n\n15. The long URL: [http://www.quirksmode.org/css/contents.html](http://www.quirksmode.org/css/contents.html)\
    \ [[↵]](#chapter6.html_footnote-15-backlink)\n\n16. The long URL: [http://msdn.microsoft.com/en-us/library/cc351024(VS.85).aspx](http://msdn.microsoft.com/en-us/library/cc351024(VS.85).aspx)\
    \ [[↵]](#chapter6.html_footnote-16-backlink)\n\n17. The long URL: [http://www.westciv.com/tools/gradients/index-moz.html](http://www.westciv.com/tools/gradients/index-moz.html)\
    \ [[↵]](#chapter6.html_footnote-17-backlink)\n\n18. The long URL: [http://snook.ca/archives/html_and_css/multiple-bg-css-gradients](http://snook.ca/archives/html_and_css/multiple-bg-css-gradients)\
    \ [[↵]](#chapter6.html_footnote-18-backlink)\n\n19. The long URL: [http://www.w3.org/TR/CSS3-animations/](http://www.w3.org/TR/CSS3-animations/)\
    \ [[↵]](#chapter6.html_footnote-19-backlink)\n\n![Chapter 7: Conclusion](images/chap-7.png)\n\
    \nOkay, let’s come back down to earth now and decompress.\n\nWe’ve covered a lot\
    \ of wonderful (if I may say so) ways to use CSS3 right now in your daily work.\
    \ My hope is that by demonstrating how these techniques can enhance the experience\
    \ layer in browsers that support them, while gracefully degrading in browsers\
    \ that don’t, you’ll be inspired to use them every day, regardless of the project\
    \ you’re working on.\n\nThe real promise of CSS3 is that it enables us to solve\
    \ common design problems more efficiently, with less code and more flexibility.\
    \ So long as you (and your clients and bosses) can accept that websites may look\
    \ and be experienced differently in the browsers and devices that access them,\
    \ then the sky’s the limit. Jump right in.\n\nI mentioned back in [Chapter 1](#chapter1.html)\
    \ that I often hear, “I can’t wait to use CSS3—*when it’s done*.” My goal with\
    \ this book was to prove that you don’t need to wait. Start experimenting with\
    \ this stuff now. Begin using CSS3 for non-critical visual events in your designs.\
    \ Now that you’re armed with what works, and—more importantly—how things degrade\
    \ when they don’t, you can comfortably achieve what previously took more time\
    \ and code, with only a few lines of CSS.\n\n## What about clients and bosses\
    \ who don’t get it?\n\nAnother question I often get asked when talking about CSS3\
    \ is how to use it in client work. How do you educate clients on the benefits\
    \ of using CSS3 over other solutions? It’s the education that’s most helpful:\
    \ Show your clients how much less code and how many fewer images there are. Show\
    \ them how the experience differs in browsers that don’t yet support CSS3. Explain\
    \ the tradeoffs to them.\n\nIf that sounds like too much work, then *just do it*.\n\
    \nStart adding CSS3 to your daily work and let your clients and bosses happily\
    \ discover it. The truth is, many of the examples I’ve demonstrated in this book\
    \ are discoverable while experiencing the site: hovering, focusing, interacting,\
    \ etc. That’s intentional of course.\n\nOften, with my own client work, I’ll add\
    \ this experience enhancement into the project without saying a word about it,\
    \ surprising and delighting the client when they stumble on it. And more importantly,\
    \ surprising and delighting the client’s *visitors* when *they* stumble upon it.\n\
    \nGetting this to work in every browser imaginable? Well, that will cost extra.\
    \ Ahem.\n\n## Looking ahead\n\nWhat about the future? The whole of CSS3 encompasses\
    \ much, much more than can be covered in this small book. I wanted to focus very\
    \ squarely on what’s practically usable today, avoiding what’s still being hashed\
    \ out in other modules that perhaps don’t have such widespread implementation.\n\
    \nBut the track is a positive one. New property support is being added in almost\
    \ every new iteration of WebKit, Mozilla, and Opera. This rapid adoption via vendor\
    \ prefixing is what’s driving innovation. Keeping tabs on what’s new, and watching\
    \ for a tipping point in implementation among these forward-thinking browsers\
    \ is what can educate you on real world use.\n"
