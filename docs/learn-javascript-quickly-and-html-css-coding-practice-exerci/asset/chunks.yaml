    What is ECMAScript?\nECMAScript is a standard, JavaScript is the language that\
    \ implement ECMAScript standard.\n\nIs JavaScript supports Unicode?\nJavaScript\
    \ programs are written in Unicode. ECMAScript 5 standard supports Unicode 3.\n\
    \nIs JavaScript case-sensitive?\nYes JavaScript is a case sensitive language.\n\
    \nIs it compulsory to end statement using ;?\nMany languages like Java, C, C++\
    \ use `;` as statement terminator. Usage of `;` is optional in JavaScript, but\
    \ I always prefer to use `;` to maintain consistency.\n\nIs JavaScript support\
    \ automatic garbage collection?\nYes, JavaScript support automatic garbage collection,\
    \ whenever JavaScript interpreter finds an unreachable object (or) variable, it\
    \ frees the memory allocated for that variable (or) object.\n\nIs JavaScript an\
    \ object oriented language?\nYes, JavaScript is an object-oriented language, but\
    \ the kind of inheritance it provides is different from the inheritance provided\
    \ by languages like Java and C++. JavaScript supports Prototype inheritance.\n\
    \n# Javascript: Hello world program\nhelloWorld.html\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Hello world</title>\n</head>\n<body>\n  <script type=\"\
    text/javascript\">\n    document.write(\"Hello World\");\n  </script>\n</body>\n\
    </html>\n```\n```javascript\ndocument.write(\"Hello World\");\n```\nAbove statement\
    \ gives instruction to the browser to write \"Hello World\". Java Script is embedded\
    \ between `<script></script>` tags.\n\n# Javascript: Variables\nVariable holds\
    \ a value. Following are some of the examples.\n```javascript\nvar name = \"Krishna\"\
    \nvar id=123\n```\nAbove statements define two variables `name`, `id`. `var` keyword\
    \ is used to define variables.\n\nNaming constraints\na. Variable name must begin\
    \ with any alphabet, `_` (or) `$`.\nb. Variable name can contain any character.\n\
    c. Spaces are not allowed in between variable names.\nd. Don’t use Javascript\
    \ keywords as variable names.\ne. Variable names are case sensitive. `Name`, `NAme`,\
    \ `name` are 3 different variables.\n\nvariables.html\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Variables</title>\n</head>\n<body>\n  <script type=\"\
    text/javascript\">\n    var name = \"Krishna\";\n    var id=123;\n    document.write(\"\
    name = \" + name + \"<br />\");\n    document.write(\"id = \" + id);\n  </script>\n\
    </body>\n</html>\n```\n![https://4.bp.blogspot.com/-O-JnK9iTAFQ/W31iUbfUt-I/AAAAAAAAK_8/LMPN1uFd-9s0k89LIe3P_BCA1SJ-6HhQCLcBGAs/s400/javascript%2Bvariables.png](Images/image00185.jpeg)\n\
