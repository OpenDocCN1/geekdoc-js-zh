    # Introduction to Javascript


    Javascript is a  scripting language, used to validate html form data, before submitting
    to the server. Now a days javaScript is also used for server side development
    (Read node.js)


    What can I do with Javascript?


    a.   You can perform client side validation.


    b.   You can give dynamic behavior to static HTML pages.


    c.   Show animations on web page


    d.   You can update partial portion of page using AJAX.


    e. Develop Server side applications using frameworks like node.js


    Javascript is interpreted language


    Javascript is interpreted language, write once and attach it to HTML page. No
    further compilation is required.


    Is there any relation between JavaScript and Java?


    Absolutely there is no relation between JavaScript and Java.


    What is ECMAScript?


    ECMAScript is a standard, JavaScript is the language that implement ECMAScript
    standard.


    Is JavaScript supports Unicode?


    JavaScript programs are written in Unicode. ECMAScript 5 standard supports Unicode
    3.


    Is JavaScript case-sensitive?


    Yes JavaScript is a case sensitive language.


    Is it compulsory to end statement using ;?


    Many languages like Java, C, C++ use ; as statement terminator. Usage of ; is
    optional in JavaScript, but I always prefer to use ; to maintain consistency.


    Is JavaScript support automatic garbage collection?


    Yes, JavaScript support automatic garbage collection, whenever JavaScript interpreter
    finds an unreachable object (or) variable, it frees the memory allocated for that
    variable (or) object.


    Is JavaScript an object oriented language?


    Yes, JavaScript is an object-oriented language, but the kind of inheritance it
    provides is different from the inheritance provided by languages like Java and
    C++. JavaScript supports Prototype inheritance.


    # Javascript: Hello world program


    helloWorld.html


    <!DOCTYPE html>


    <html>


    <head>


      <title>Hello world</title>


    </head>


    <body>


      <script type="text/javascript">


       document.write("Hello World");


      </script>


    </body>


    </html>


    [![https://1.bp.blogspot.com/-JJo0VYFJ_jw/W30-Atn4RXI/AAAAAAAAK_w/rOj32k5M6cQxtQnQUGLah6aPApXRoWUNwCLcBGAs/s400/javascript%2Bhello%2Bworld.png](Images/image00184.jpeg)](https://1.bp.blogspot.com/-JJo0VYFJ_jw/W30-Atn4RXI/AAAAAAAAK_w/rOj32k5M6cQxtQnQUGLah6aPApXRoWUNwCLcBGAs/s1600/javascript+hello+world.png)


    document.write("Hello World");


    Above statement gives instruction to the browser to write "Hello World". Java
    Script is embedded between <script></script> tags.


    # Javascript: Variables


    Variable holds a value. Following are some of the examples of variables.


    var name = "Krishna"


    var id=123


    Above statements define two variables name, id. ‘var’ keyword is used to define
    variables.


    Naming constraints


    a.   Variable name must begin with any alphabet, _ (or) $.


    b.   Variable name can contain any character.


    c.   Spaces are not allowed in between variable names.


    d.   Don’t use Javascript keywords as variable names.


    e.   Variable names are case sensitive. Name, NAme, name are 3 different variables.


    variables.html


    <!DOCTYPE html>


    <html>


    <head>


      <title>Variables</title>


    </head>


    <body>


      <script type="text/javascript">


       var name = "Krishna";


       var id=123;


       document.write("name = " + name + "<br />");


       document.write("id = " + id);


      </script>


    </body>


    </html>


