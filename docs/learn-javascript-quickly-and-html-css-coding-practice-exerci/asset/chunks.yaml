  trans: "\n\n# HTML CSS 练习：后代选择器\n\n### HTML 代码\n```html\n<!DOCTYPE HTML>\n<html\
    \ lang=\"en\">\n<head>\n<meta charset=utf-8>\n<title>CSS 后代选择器示例</title>\n<style\
    \ type=\"text/css\">\np span{\ncolor:#4b6c9c; \n}\n</style>\n</head>\n<body>\n\
    <p>只有 <span>text within span</span> 的部分将显示不同的颜色</p>\n</body>\n</html>\n```\n\n\
    ### 输出结果\n只有 `text within span` 的部分将显示不同的颜色\n\n# 样式占位文本\n\n# 样式占位文本\n\n### HTML\
    \ 代码\n```html\n<!DOCTYPE html>\n<html\n<head>\n  <meta charset=\"utf-8\">\n  <title>HTML\
    \ CSS 练习 - 样式占位文本</title>\n<style type=\"text/css\">\ninput[type=\"text\"]::-webkit-input-placeholder\
    \ {\n  color: orange;\n}\n</style>\n</head>\n<body>\n//将此内容插入到 html 区域。位于 codepen\
    \ 的 body 中\n<form action=\"\">\n<div>\n    <label for=\"email\">Email:</label>\n\
    \    <input id=\"email\" name=\"email\" type=\"text\" placeholder=\"yourname@yourdomain.com\"\
    >\n  </div>\n</form>\n//将此内容插入到 css 区域。位于 codepen 的 body 中\n</body>\n</html>\n\
    ```\n\n### 输出结果\n![](img/image00197.jpeg)\n\n# 在提交表单时指定表单数据发送到的位置\n\n### HTML\
    \ 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n \
    \ <title>如何在提交表单时指定表单数据发送到的位置</title>\n</head>\n<body>\n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formaction-answer-demo.php\"\
    \ method=\"post\">\n  名: <input type=\"text\" name=\"fname\"><br>\n  姓: <input\
    \ type=\"text\" name=\"lname\"><br>\n  <button type=\"submit\">提交</button><br>\n\
    \  <button type=\"submit\" formaction=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formaction-admin-demo.php\"\
    >以管理员身份提交</button>\n</form>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/image00198.jpeg)\n\
    \n# 发送表单数据（使用哪种 HTTP 方法）\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>如何发送表单数据，使用哪种 HTTP 方法</title>\n</head>\n\
    <body>\n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formmethod-answer-demo.php\"\
    >\n  名: <input type=\"text\" name=\"fname\"><br>\n  姓: <input type=\"text\" name=\"\
    lname\"><br>\n  地址: <input type=\"text\" name=\"place\"><br>\n  <button type=\"\
    submit\">提交</button>\n  <button type=\"submit\" formmethod=\"post\" formaction=\"\
    http://localhost/html-css-exercise/basic/solution/button-formmethod-post-answer.php\"\
    >使用 POST 提交</button>\n</form>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/image00199.jpeg)\n\
    \n# 在提交表单后指定显示响应的位置\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>如何在提交表单后指定显示响应的位置</title>\n</head>\n<body>\n\
    <form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formtarget-answer-demo.php\"\
    \ method=\"POST\">\n  名: <input type=\"text\" name=\"fname\"><br>\n  姓: <input\
    \ type=\"text\" name=\"lname\"><br>\n  <button type=\"submit\">提交</button>\n \
    \ <button type=\"submit\" formtarget=\"_blank\">提交到新窗口/标签页</button>\n</form>\n\
    </body>\n</html>\n```\n\n### 输出结果\n![](img/image00200.jpeg)\n\n# 为按钮指定名称\n\n###\
    \ HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    >\n<title>如何为按钮指定名称</title> \n</head> \n<body> \n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-name-answer-demo.php\"\
    \ method=\"post\">\n选择你喜欢的主题：\n<button name=\"topic\" type=\"submit\" value=\"\
    JavaScript\">JavaScript</button>\n<button name=\"topic\" type=\"submit\" value=\"\
    PHP\">PHP</button>\n</form>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/image00201.jpeg)\n\
    \n# 指定按钮的类型\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
