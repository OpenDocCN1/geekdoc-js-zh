    \ 1 and 7\", 6));\n switch (day) {\n  case 1:\n    document.write(\"Sunday\");\n\
    \    break;\n  case 2:\n    document.write(\"Monday\");\n    break;\n  case 3:\n\
    \    document.write(\"Tuesday\");\n    break;\n  case 4:\n    document.write(\"\
    Wednesday\");\n    break;\n  case 5:\n    document.write(\"Thursday\");\n    break;\n\
