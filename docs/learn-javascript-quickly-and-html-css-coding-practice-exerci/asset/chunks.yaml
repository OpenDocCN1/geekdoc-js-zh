    \ case 标签之后的语句。\n\n### 语法\n```javascript\nswitch(expression){\n    case expression1:\n\
    \        // 语句\n        break;\n    case expression2:\n        // 语句\n       \
    \ break;\n    default:\n        // 语句\n}\n```\n\n`switch.html`\n\n```html\n<!DOCTYPE\
