    \ = 7;\n document.write(\"(a^=10) = \"  + (a ^=  10) +  \"<br />\");\n </script>\n\
    \ </p>\n</body>\n</html>\n```\n\n# Javascript: Ternary operator\n\nTernary operator(\
    \ ?: )`\nReturns one of two expressions depending on a condition.\n\n#### Syntax\n\
    ```\ntest ? expression1 : expression2\n```\nReturns `expression1` if the `test`\
    \ condition evaluates to true otherwise returns `expression2`.\n\n#### Example\n\
    ```javascript\nvar x = prompt(\"Enter an Integer\", \"100\");\nvar y = (x > 10)?\
    \ \"x is greater than 10\": \"x is less than 11\";\n```\nIf you enter a value\
