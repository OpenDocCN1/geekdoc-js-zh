    c&&d = \"  + (c && d) +  \"<br />\");\n document.write(\"d&&a = \"  + (d && a)\
    \ +  \"<br />\");\n document.write(\"d&&b = \"  + (d && b) +  \"<br />\");\n document.write(\"\
    d&&c = \"  + (d && c) +  \"<br />\");\n document.write(\"d&&d = \"  + (d && d)\
    \ +  \"<br />\");\n </script>\n </p>\n</body>\n</html>\n```\n\n# JavaScript: Assignment\
    \ operators\n\nAssignment operator is used to assign value to a variable. Since\
    \ JavaScript is weakly typed, you can assign any type of value to a variable.\n\
    \n#### Syntax\n```\nvar variableName = value;\n```\n\nvariables.html\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n <title>Variables</title>\n</head>\n<body>\n\
    \ <script type=\"text/javascript\">\n var a = 10;\n document.write(\"Value of\
