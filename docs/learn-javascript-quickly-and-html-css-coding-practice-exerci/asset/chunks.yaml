    <tr>\n<th>学生代码</th>\n<th>百分比</th>\n</tr>\n<tr>\n<td>S001</td>\n<td>85</td>\n</tr>\n\
    <tr>\n<td>S002</td>\n<td>86</td>\n</tr>\n<tr>\n<td>S003</td>\n<td>72</td>\n</tr>\n\
    <tr>\n<td>S004</td>\n<td>89</td>\n</tr>\n</table>\n</body>\n</html>\n```\n\n###\
    \ 输出结果\n![](img/image00204.jpeg)\n\n# 指定列的属性\n\n### HTML 代码\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>如何指定列组元素内每列的属性</title>\n\
    </head>\n<body>\n<table class=\"table table-bordered\">\n  <colgroup>\n    <col\
    \ span=\"3\" style=\"background-color:#cc66Ff\">\n<col style=\"background-color:#cc66Ff\"\
    >\n  </colgroup>\n  <tr>\n    <th>COL-1</th>\n    <th>COL-2</th>\n    <th>COL-3</th>\n\
