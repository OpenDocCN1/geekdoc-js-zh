    - HTML CSS 练习: 使用 CSS3 创建气泡\n- HTML CSS 练习: 通过属性选择元素\n- HTML CSS 练习: 为链接设置激活和访问状态样式\n\
    - HTML CSS 练习: 类型选择器\n- HTML CSS 练习: 标题\n- HTML CSS 练习: 后代选择器\n- HTML CSS 练习:\
    \ 样式占位符\n- HTML CSS 练习: 指定发送表单数据\n- HTML CSS 练习: 发送表单数据\n- HTML CSS 练习: 指定显示\n\
    - HTML CSS 练习: 为按钮指定名称\n- HTML CSS 练习: 指定按钮类型\n- HTML CSS 练习: 动态绘制图形\n- HTML CSS\
    \ 练习: 定义表格标题\n- HTML CSS 练习: 指定列属性\n\n# Javascript 简介\nJavascript 是一种脚本语言，用于在提交到服务器之前验证\
    \ html 数据。现在 JavaScript 也用于服务器端开发 (node.js)\n\nJavascript 可以做什么？\na. 你可以进行客户端验证。\n\
    b. 你可以给静态 HTML 添加动态行为。\nc. 在网页上显示动画。\nd. 你可以使用 `AJAX` 更新页面的部分。\ne. 使用 `node.js`\
    \ 等框架开发服务器端应用。\n\nJavascript 是解释型语言\nJavascript 是一种解释型语言，编写一次并附加 HTML 页面。不需要进一步编译。\n\
    \nJavaScript 和 Java 之间有关系吗？\nJavaScript 和 Java 之间没有任何关系。\n\n什么是 ECMAScript？\n\
    ECMAScript 是一个标准，JavaScript 是实现 ECMAScript 标准的语言。\n\nJavaScript 支持 Unicode 吗？\n\
    JavaScript 程序使用 Unicode。ECMAScript 5 标准支持 Unicode。\n\nJavaScript 大敏感敏感？\n是的，JavaScript\
    \ 是一种大小敏感的语言。\n\n必须使用 ; 结束语句吗？\n许多语言如 Java、C、C++ 使用 ; 作为语句终止符。JavaScript 中使用 ;\
    \ 是可选的，但我习惯使用 ; 以保持一致。\n\nJavaScript 支持自动垃圾回收吗？\n是的，JavaScript 支持自动垃圾回收，当 JavaScript\
    \ 解释器找到无法访问的对象（或变量）时，它会释放为该变量（或对象）分配的内存。\n\nJavaScript 是面向对象的语言吗？\n是的，JavaScript\
    \ 是一种面向对象的语言，但它提供的继承与 Java 和 C++ 等语言提供的继承不同。JavaScript 支持原型继承。\n\n# Javascript:\
    \ Hello 好世界程序\nhelloWorld.html\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Hello\
    \ world</title>\n</head>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"\
    Hello World\");\n  </script>\n</body>\n</html>\n```\n```javascript\ndocument.write(\"\
    Hello World\");\n```\n上述语句指示浏览器写入 \"Hello World\"。JavaScript 嵌入在 `<script></script>`\
    \ 标签之间。\n\n# Javascript: 变量\n变量存储一个值。以下是一些示例：\n```javascript\nvar name = \"Krishna\"\
    \nvar id=123\n```\n上述语句定义了两个变量 `name` 和 `id`。`var` 关键字用于定义变量。\n\n命名限制\na. 变量名必须以字母、`_`（或\
    \ `$`）开头。\nb. 变量名可以包含任何字符。\nc. 变量名之间不允许空格。\nd. 不要使用 Javascript 关键字作为变量名。\ne. 变量名是大小敏感的。`Name`、`NAme`、`name`\
    \ 是 3 个不同的变量。\n\nvariables.html\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Variables</title>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n    var name = \"Krishna\"\
    ;\n    var id=123;\n    document.write(\"name = \" + name + \"<br />\");\n   \
    \ document.write(\"id = \" + id);\n  </script>\n</body>\n</html>\n```\n![`4.bp.blogspot.com/-O-JnK9iTAFQ/W31iUbfUt-I/AAAAAAAAK_8/LMPN1uFd-9s0k89LIe3P_BCA1SJ-6HqCLcBGAs/s400/javascript%2Bvariables.png`](img/image00185.jpeg)\n\
    \n"
- fmt: "\nJavaScript is case sensitive, so the names `banana`, `Banana`, `BaNaNa`\
    \ are three different variables.\n\n# JavaScript: Statements\n\nA statement is\
    \ an executable statement, statements in JavaScript are terminated using `;`.\n\
    \n`statements.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Variables</title>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"Hello\
    \ World\" + \"<br />\");\n    document.write(\"Hello PTR\");\n  </script>\n</body>\n\
    </html>\n```\n\n![https://2.bp.blogspot.com/-rEgK0RZJ_SQ/W34wutk8G5I/AAAAAAAALAY/6cu0u5abWAsq-UtYv7UprNWX2zCmHpjbgCLcBGAs/s320/javascript%2Bstatements.png](Images/image00186.jpeg)\n\
    \nIn the above example, below are the JavaScript statements:\n\n```javascript\n\
    document.write(\"Hello World\" + \"<br />\");\ndocument.write(\"Hello PTR\");\n\
    ```\n\n# JavaScript: Comments\n\nComments are used to document the source code.\
    \ Comments in JavaScript make the program more readable. Comments are ignored\
    \ by JavaScript.\n\nSuppose you wrote thousand lines of program without proper\
    \ documentation; after some time, even for the owner of the application, it is\
    \ very difficult to figure out what was written.\n\nComments solve this problem:\n\
    By using comments, you can document your code at the time of writing program.\
    \ Comments won't affect your program execution. Comments simply document your\
    \ code.\n\nJavaScript supports two kinds of comments:\n\na. Single line comments\n\
    b. Multi-line comments\n\n### Single line comment\nSingle line comments start\
    \ with `//`.\n\n```javascript\n// It is a single line comment\n```\n\n### Multi-line\
    \ comment\nMulti-line comments are encoded in `/* */`.\n\n```javascript\n/* I\
    \ am a multiline comment */\n```\n\n`sample.html`\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Variables</title>\n</head>\n<body>\n  <script type=\"\
    text/javascript\">\n    /*\n      JavaScript is weakly typed language\n      Author:\
    \ Hari krishna\n    */\n    var a = 10;\n    document.write(\"Value of a is \"\
    \ + a + \"<br />\");\n    a = \"Hello World\"; // Assigning string\n    document.write(\"\
    Value of a is \" + a + \"<br />\");\n    a = true; // Assigning boolean\n    document.write(\"\
    Value of a is \" + a + \"<br />\");\n    a = 10.09; // Assigning number\n    document.write(\"\
    Value of a is \" + a + \"<br />\");\n  </script>\n</body>\n</html>\n```\n\n# JavaScript:\
    \ Types\n\nTypes are used to represent the type of data. Primarily, there are\
    \ two categories of types:\n\na. Primitive types\nb. Reference types\n\n### Primitive\
    \ Types\nNumbers, strings and Boolean values are considered as primitive types.\
    \ In addition to these, special values `null` and `undefined` are also considered\
    \ as primitive types.\n\n### Reference Types\nObjects and arrays are considered\
    \ as reference types. An object is a collection of name and value pairs. An array\
    \ is a collection of elements.\n\nOne more thing to note is that JavaScript treats\
    \ functions also objects.\n\n`types.html`\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Data Types</title>\n</head>\n<body>\n  <script>\n    var a =\
    \ 10;\n    var b = 10.01;\n    var c = true;\n    var d = \"Hello World\";\n \
    \   var e = {\n      name : \"Hari krishna\",\n      city : \"Bangalore\"\n  \
    \  };\n    var f = [2, 3, 5, 7];\n    document.write(\"a = \" + a + \" Type of\
    \ a = \" + (typeof a) + \"<br />\");\n    document.write(\"b = \" + b + \" Type\
    \ of b = \" + (typeof b) + \"<br />\");\n    document.write(\"c = \" + c + \"\
    \ Type of c = \" + (typeof c) + \"<br />\");\n    document.write(\"d = \" + d\
    \ + \" Type of d = \" + (typeof d) + \"<br />\");\n    document.write(\"e = \"\
    \ + e + \" Type of e = \" + (typeof e) + \"<br />\");\n    document.write(\"f\
    \ = \" + f + \" Type of f = \" + (typeof f) + \"<br />\");\n  </script>\n</body>\n\
    </html>\n```\n\nOpen the above page in a browser, you are able to see the following\
    \ messages in the HTML page:\n\na = 10 Type of a = number\nb = 10.01 Type of b\
    \ = number\nc = true Type of c = boolean\nd = Hello World Type of d = string\n\
    e = [object Object] Type of e = object\nf = 2,3,5,7 Type of f = object\n\nAs you\
    \ see the output, JavaScript treats both integer and float values as number, and\
    \ arrays are treated as object.\n\n# JavaScript: Operators\n\nAn operator is a\
    \ symbol which performs an operation. An operator is said to be unary if it performs\
    \ operation on a single operand. An operator is said to be binary if it performs\
    \ operation on two operands. An operator is said to be ternary if it performs\
    \ operation on three operands.\n\nJavaScript provides the following operators:\n\
    \na. Arithmetic operators\nb. Increment/decrement `++`, `--`\nc. Bitwise operators\n\
    d. Logical operators\ne. Assignment operators\nf. String concatenation\ng. Comparison\
    \ operators\nh. Other operators like `===` (Strict comparison), ternary `?:`\n\
    \n# JavaScript: Arithmetic Operators\n\nThe following table summarizes operators\
    \ supported by JavaScript:\n\n| Operator | Description |\n| :--- | :--- |\n| +\
    \ | Addition (also used for String concatenation) |\n| - | Subtraction |\n| /\
    \ | Division |\n| * | Multiplication |\n| % | Remainder |\n\n`arithmetic.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Arithmetic Operators</title>\n\
    \  <style>\n    p{ font-size: 2em; color: seagreen; }\n  </style>\n</head>\n<body>\n\
    \  <p>\n    <script type=\"text/javascript\">\n      var a = 2;\n      var b =\
    \ 3;\n      document.write(\"a = \" + a + \"<br />\");\n      document.write(\"\
    b = \" + b + \"<br />\");\n      document.write(\"a+b = \" + (a+b) + \"<br />\"\
    );\n      document.write(\"a-b = \" + (a-b) + \"<br />\");\n      document.write(\"\
    a*b = \" + (a*b) + \"<br />\");\n      document.write(\"a/b = \" + (a/b) + \"\
    <br />\");\n      document.write(\"a%b = \" + (a%b) + \"<br />\");\n    </script>\n\
    \  </p>\n</body>\n</html>\n```\n\nNote: Unlike languages like Java, integer division\
    \ in JavaScript returns a float value.\n\n# JavaScript: Increment/decrement ++\
    \ -- operators\n\nIncrement & decrement operators: `++` increments a value by\
    \ 1, `--` decrements a value by 1.\n\n### Pre-increment\nSyntax: `++variable`\n\
    Pre-increment operator increments the variable value by 1 immediately.\n\n###\
    \ Post-increment\nSyntax: `variable++`\nPost-increment operator increments the\
    \ variable value by 1 after executing the current statement.\n\n### Pre-decrement\n\
    Syntax: `--variable`\nPre-decrement operator decrements the variable value by\
    \ 1 immediately.\n\n### Post-decrement\nSyntax: `variable--`\nPost-decrement operator\
    \ decrements the variable value by 1 after executing the current statement.\n\n\
    `arithmetic.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Increment&Decrement\
    \ Operators</title>\n  <style>\n    p{ font-size: 2em; color: seagreen; }\n  </style>\n\
    </head>\n<body>\n  <p>\n    <script type=\"text/javascript\">\n      var a = 2;\n\
    \      document.write(\"a = \" + a + \"<br />\");\n      document.write(\"a++\
    \ = \" + (a++) + \"<br />\");\n      document.write(\"++a = \" + (++a) + \"<br\
    \ />\");\n      document.write(\"a-- = \" + (a--) + \"<br />\");\n      document.write(\"\
    --a = \" + (--a) + \"<br />\");\n    </script>\n  </p>\n</body>\n</html>\n```\n\
    \n# JavaScript: Bitwise operators\n\nThe following table summarizes the bitwise\
    \ operators supported by JavaScript:\n\n| Operator | Description |\n| :--- | :---\
    \ |\n| ~ | Inverts bit pattern |\n| << | Perform Left shift |\n| >> | Perform\
    \ Right shift |\n| >>> | Perform unsigned right shift |\n| & | Bitwise AND |\n\
    | \\| | Bitwise OR |\n| ^ | Bitwise Exclusive OR |\n\nBefore discussing the Bitwise\
    \ operators, we will discuss Binary representations of a number.\n\n### 1's Complement\n\
    1's complement simply inverts the bits: if the bit is set to zero, it sets the\
    \ bit to 1 and if the bit is set to 1 it sets the bit to zero.\n\nEx:\n`8` in\
    \ binary = `0000 1000`\n`1's complement(8)` = `1111 0111`\n\n### 2's complement\n\
    Negative numbers are stored in 2's complement form. i.e., `-8` is the 2's complement\
    \ of `8`.\n2's complement is the sum of (1's complement of a number + 1).\n\n\
    Ex:\n`8` in binary = `0000 1000`\n`1's complement(8)` = `1111 0111`\n`2's complement(8)`\
    \ = `1111 0111 + 1` = `1111 1000`\n\n`-8` in 2's complement form is `1111 1000`\n\
    \nInversion (~)\n"
