    \  }\n}\n```\n**HelloWorld.js**\n```javascript\nvar Employee =  class {\n  constructor(id,\
    \ firstName, lastName){\n    this.id = id;\n    this.firstName = firstName;\n\
    \    this.lastName = lastName;\n  }\n}\n\nfunction print_employee_info(emp){\n\
    \  console.log(\"id : \"  + emp.id);\n  console.log(\"firstName : \"  + emp.firstName);\n\
    \  console.log(\"lastName : \"  + emp.lastName);\n}\n\nvar emp1 =  new Employee(1,\
    \ \"Sailaja\", \"PTR\");\n\nprint_employee_info(emp1);\n```\n\n### Example 2\n\
    ```javascript\nvar Employee = class MyEmployee{\n  constructor(id, firstName,\
