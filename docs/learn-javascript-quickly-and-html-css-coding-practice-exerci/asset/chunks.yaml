    Saturday\");\n    break;\n  default:\n    document.write(\"Invalid day\");\n }\n\
    \ </script>\n</body>\n</html>\n```\n"
- fmt: "\n```javascript\ndocument.write(\"<h2>Even numbers from 0 to \"  + number\
