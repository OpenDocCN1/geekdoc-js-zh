    https://www.htmlresource.com/html-css-exercise/basic/solution/button-name-answer-demo.php\"\
    \ method=\"post\">\n名: <input type=\"text\" name=\"fname\"><br>\n姓: <input type=\"\
    text\" name=\"lname\"><br>\n地址: <input type=\"text\" name=\"place\"><br>\n<button\
    \ type=\"submit\">提交</button>\n</form>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/image00202.jpeg)\n\
    \n# 通过脚本绘制图形\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
