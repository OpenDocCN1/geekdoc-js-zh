    \ it prints the message \"Input should be < 100\" and come put of the loop, else\
    \ it print all the even numbers from 0 to given number.\n\n# JavaScript: continue\
    \ statement\n\n`continue` statement skips the current iteration of a `for`, `while`,\
    \ `do-while` loops.\n\n`continue.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \ <title>continue statement</title>\n</head>\n<body>\n <script type=\"text/javascript\"\
    >\n var number =  parseInt(prompt(\"Enter a number less than 100\", \"10\"));\n\
    \ document.write(\"<h2>Even numbers from 0 to \"  + number +  \" are </h2>\");\n\
    \ var i =  0;\nwhile (i <= number) {\n  if ((i %  4) ==  0) {\n    i +=  2;\n\
    \    continue;\n  }\n  document.write(i +  \"<br />\");\n  i +=  2;\n}\n </script>\n\
    </body>\n</html>\n```\n\nLoad above page in browser, it prompts for a number and\
    \ prints all even numbers up to the number, which are not divisible by 4.\n\n\
    # JavaScript: break in label form\n\n`label` is a group of statements, identified\
    \ by using `labelname`.\n\n### Syntax\n\n```javascript\nlabelName:{\n    statement\
    \ 1\n    statement 2\n    ....\n    statement N\n}\n```\n\n`break` is also available\
    \ in label form.\n\n### Syntax\n\n```javascript\nbreak labelName;\n```\n\n`breakLabel.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>break label example</title>\n\
    </head>\n<body>\n <script type=\"text/javascript\">\nouter:\nfor (var i =  0;\
    \ i <  10; i++) {\n    inner:  for (var j =  0; j <  10; j++) {\n      document.write(i\
    \ +  \",\"  + j +  \"<br />\");\n      if (i * j >  10)\n        break outer;\n\
    \    }\n}\n </script>\n</body>\n</html>\n```\n\n# JavaScript: for in loop\n\n\
    `for in` loop is used to get all enumerable properties of object.\n\n`forin.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>for in loop Example</title>\n\
    </head>\n<body>\n <script>\n var employee = {\n    firstName:  \"Hari Krishna\"\
    ,\n    lastName:  \"Gurram\",\n    age:  26,\n    getDetails:  function() {\n\
    \ return  \"[firstName = \"  + firstName + \", lastName = \"  + lastName +  ]\"\
    ;\n    }\n}\nfor (property in employee) {\n document.write(property +  \" : \"\
    \  + employee[property] +  \"<br />\");\n}\n </script>\n</body>\n</html>\n```\n\
    \nOpen above page in browser, you can able to see following text. As you observe\
    \ the output, `for-in` loop don’t display the built-in properties like `toString`,\
    \ it is because built-in methods are not enumerable.\n\nfirstName : Hari Krishna\n\
    lastName : Gurram\nage : 26\ngetDetails : function (){ return \"[firstName = \"\
    \ + firstName + \", lastName = \" + lastName + \"]\"; }\n\nSince arrays are also\
    \ special kind of objects in JavaScript, you can traverse array using `for-in`\
    \ loop.\n\n`forin.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>for\
    \ in loop Example</title>\n</head>\n<body>\n <script>\nvar arr = [\"Hari Krishna\"\
    , \"Gurram\", 26];\nfor (index in arr) {\ndocument.write(index +  \" :  + arr[index]\
    \ +  \"<br />\");\n}\n </script>\n</body>\n</html>\n```\n\nOpen above page in\
    \ browser, you able to see following text.\n0 : Hari Krishna\n1 : Gurram\n2 :\
    \ 26\n\n# JavaScript: for-of loop\n\n`for-of` loop is used to iterate over iterable\
    \ objects like `String`, `Array`, `TypedArray`, and `Set`.\n\n`HelloWorld.js`\n\
    \n```javascript\nvar arr = [2, 3, 5, 7, 11, 13];\nfor (var i of arr) {\n  console.log(i);\n\
    }\n```\n\nOutput:\n2\n3\n5\n7\n11\n13\n\n# JavaScript: get the type of variable\n\
    \nJavascript provide `typeof` operator to get the type of variable.\n\n### Syntax\n\
    \n```javascript\ntypeof variableName\n```\n\n`type.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n <title>Type of variables</title>\n</head>\n<body>\n\
    \ <script type=\"text/javascript\">\nvar a =  10;\nvar b =  10;\nvar c =  true;\n\
    var d =  \"Hello\";\nvar e =  new String(\"Hello\");\ndocument.write(\"a =  +\
    \ a + \", type = \"  + typeof(a) +  \"<br />\");\ndocument.write(\"b =  + b +\
    \ \", type = \"  + typeof(b) +  \"<br />\");\ndocument.write(\"c =  + c + \",\
    \ type = \"  + typeof(c) +  \"<br />\");\ndocument.write(\"d =  + d + \", type\
    \ = \"  + typeof(d) +  \"<br />\");\ndocument.write(\"e =  + e + \", type = \"\
    \  + typeof(e) +  \"<br />\");\n </script>\n</body>\n</html>\n```\n\n# JavaScript:\
    \ Working with strings\n\n`String` is a collection of characters. Unlike other\
    \ languages, JavaScript don’t have any type to represent character.\n\n### How\
    \ to define a string?\n\nEnclose collection of characters in single quotes or\
    \ double quotes.\n`var str1 = \"Hello World\";`\n`var str2 = 'Hello World';`\n\
    \nYou can also create string using `String` object.\n`var str3 = new String(\"\
    Hello World\");`\n\n`string.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \ <title>strings</title>\n</head>\n<body>\n <script type=\"text/javascript\">\n\
    var str1 =  \"Good Morning\";\nvar str2 =  'Good Afternoon';\nvar str3 =  new\
    \ String(\"Good Night\");\ndocument.write(str1 +  \"<br />\");\ndocument.write(str2\
    \ +  \"<br />\");\ndocument.write(str3 +  \"<br />\");\n </script>\n</body>\n\
    </html>\n```\n\nHow the string in JavaScript is different from other languages?\n\
    All strings are Unicode internally.\n\n# JavaScript: Nested functions\n\nYou can\
    \ define function inside other function. Embedded function can to access all the\
    \ variables defined in enclosing function.\n\n`embedded.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n <title>Embedded Functions</title>\n</head>\n<body>\n\
    \ <script type=\"text/javascript\">\n//Calculate (b*b - 4*a*c)/2*a\nfunction descriminator(a,\
    \ b, c) {\n  return (square(b) - 4 * a * c) / twice(a);\n  function square(x)\
    \ {\n    return (x * x);\n  }\n  function twice(x) {\n    return 2 * x;\n  }\n\
    }\ndocument.write(\"Discriminator of 5, 10, 3 is : \" + descriminator(5, 10, 3));\n\
    \ </script>\n</body>\n</html>\n```\n\nOpen above page in browser, you can able\
    \ to see following message.\nDiscriminator of 5, 10, 3 is : 4\n\n### Scope of\
    \ variables\n\nEmbedded function can access all the variables defined in parent\
    \ function and any other variable where parent function has access.\n\n# JavaScript:\
    \ Array\n\n`Array` is an ordered collection of elements.\n\n### Syntax\n\n```javascript\n\
    var arrayName = [elem1, elem2 .... elemN];\nvar arrayName = new Array(size)\n\
    ```\n\n### How to access element of an array?\n\nBy using index notation, you\
    \ can access element of an array. Index starts from 0.\n\n### Syntax\n\n```javascript\n\
    arrayName[index]\n```\n\n`arr[0]` : Return the first element\n`arr[1]` : Return\
    \ 2nd element\n...\n`arr[n]` : Return n-1th element\n\n`array.html`\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n <title>Array</title>\n</head>\n<body>\n <script\
