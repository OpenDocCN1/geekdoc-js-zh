    \ blue;\n}\n</style>\n<canvas id=\"FirstCanvas\"></canvas>\n</body>\n</html>\n\
    ```\n\n### 输出结果\n![](img/image00203.jpeg)\n\n# 定义表格标题\n\n### HTML 代码\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>如何定义表格标题</title>\n\
