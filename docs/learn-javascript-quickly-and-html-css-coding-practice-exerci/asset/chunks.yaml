    \  <tr>\n    <td>MySQL 练习</td>\n    <td>PHP 练习</td>\n    <td>SQL 练习</td>\n  </tr>\n\
    </table>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/image00205.jpeg)\n\n"
