    c = \"  + c +  \"<br />\");\n document.write(\"d = \"  + d +  \"<br />\");\n document.write(\"\
    a&&b = \"  + (a && b) +  \"<br />\");\n document.write(\"a&&c = \"  + (a && c)\
    \ +  \"<br />\");\n document.write(\"a&&d = \"  + (a && d) +  \"<br />\");\n document.write(\"\
    b&&a = \"  + (b && a) +  \"<br />\");\n document.write(\"b&&c = \"  + (b && c)\
    \ +  \"<br />\");\n document.write(\"b&&d = \"  + (b && d) +  \"<br />\");\n document.write(\"\
    c&&a = \"  + (c && a) +  \"<br />\");\n document.write(\"c&&b = \"  + (c && b)\
