    \ labelled with one or more case or default labels. The switch statement evaluates\
    \ its expression, then executes all statements that follow the matching case label.\n\
    \nSyntax\n\nswitch(expression){\n\n         case expression1:\n\n                           //statements\n\
    \n                           break;\n\n         case expression2:\n\n                           //statements\n\
    \n                           break;\n\n         default:\n\n                  //statements\n\
    \n}\n\nswitch.html\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n <title>switch statement</title>\n\
