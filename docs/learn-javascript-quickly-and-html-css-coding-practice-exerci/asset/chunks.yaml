    \  document.write(\"z is false\" + \"<br />\");\n}\n </script>\n</body>\n</html>\n\
    ```\n\n# JavaScript: 决策：if, if-then\n\n## if 语句\n\n`\"if\"` 告诉程序当条件求值为 true 时执行该代码部分。\n\
    \n### 语法\n```javascript\nif(condition){\n    // 如果条件为真，则执行\n}\n```\n\n`if.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>if statement</title>\n</head>\n\
    <body>\n <script type=\"text/javascript\">\nvar a = prompt(\"Enter any Integer\"\
    , 100);\nif (a % 2 == 0) {\n  document.write(\"You entered even number\");\n}\n\
    \ </script>\n</body>\n</html>\n```\n\n在浏览器中打开上述 html 文件，它会提示输入。如果你输入偶数，它会打印消息\
    \ 'You entered even number'，否则它什么都不打印。\n\n## if-else 语句\n\n如果条件为真，则执行 `if` 块代码；否则，执行\
    \ `else` 块代码。\n\n### 语法\n```javascript\nif(condition){\n}\nelse{\n}\n```\n\n`ifelse.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>if-else statement</title>\n\
    </head>\n<body>\n <script type=\"text/javascript\">\nvar a = prompt(\"Enter any\
    \ Integer\", 100);\nif (a % 2 == 0) {\n  document.write(\"You entered even number\"\
    );\n} else {\n  document.write(\"You entered odd number\");\n}\n </script>\n</body>\n\
    </html>\n```\n\n在浏览器中打开上述 html 文件，它会提示输入。如果你输入偶数，它会打印消息 'You entered even number'，否则会打印\
    \ \"You entered odd number\"。\n\n# Javascript: if-else-if-else 阶梯\n\n在我之前的文章中，我解释了\
    \ `if` 语句和 `if-else` 语句。除了这些，Javascript 提供了 `if-else if- else` 阶梯，用于在有多个替代方案时选择一种解决方案。\n\
    \n### 语法\n```javascript\nif(condition){\n    // 语句块\n}else if(condition){\n  \
    \  // 语句块\n}else{\n    // 语句块\n}\n```\n\n`ladder.html`\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n <title>if-else if-else statement</title>\n</head>\n<body>\n <script\
    \ type=\"text/javascript\">\nvar marks = prompt(\"Enter Your marks\", 100);\n\
    if (marks < 35) {\n  document.write(\"You are failed\");\n} else if (marks < 50)\
    \ {\n  document.write(\"You are passed and got third class\");\n} else if (marks\
    \ < 60) {\n  document.write(\"You are passed and got second class\");\n} else\
    \ if (marks < 70) {\n  document.write(\"You are passed and got first class\");\n\
    } else {\n  document.write(\"You are passed and got distinction\");\n}\n </script>\n\
    </body>\n</html>\n```\n\n# JavaScript: 使用 switch 语句进行决策\n\n`switch` 语句的主体被称为 `switch`\
