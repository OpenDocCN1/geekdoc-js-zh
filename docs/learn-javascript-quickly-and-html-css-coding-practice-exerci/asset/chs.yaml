  \  \"<br />\");\n  i +=  2;\n}\n </script>\n</body>\n</html>\n```\n\n在浏览器中加载上方页面，它会提示输入一个数字并打印出该数字范围内不能被\
  \ 4 整除的所有偶数。\n\n## JavaScript: 标签形式的 break\n\n`label` 是语句组，通过使用 `labelname` 进行标识。\n\
