  \ 文件，它会提示输入。如果你输入偶数，它会打印消息 'You entered even number'，否则会打印 \"You entered odd number\"\
  。\n\n### Javascript: if-else-if-else 阶梯\n\n在我之前的文章中，我解释了 `if` 语句和 `if-else` 语句。除了这些，Javascript\
  \ 提供了 `if-else if- else` 阶梯，用于在有多个替代方案时选择一种解决方案。\n\n### 语法\n```javascript\nif(condition){\n\
  \    // 语句块\n}else if(condition){\n    // 语句块\n}else{\n    // 语句块\n}\n```\n\n`ladder.html`\n\
