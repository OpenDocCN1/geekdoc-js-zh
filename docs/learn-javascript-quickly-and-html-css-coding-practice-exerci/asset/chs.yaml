  \ | a+=10 | a=a+10 |\n| -= | a-=10 | a=a-10 |\n| *= | a*=10 | a=a*10 |\n| /= | a/=10\
  \ | a=a/10 |\n| >>= | a>>=10 | a=a>>10 |\n| <<= | a<<=10 | a=a<<10 |\n| >>>= | a>>>=10\
