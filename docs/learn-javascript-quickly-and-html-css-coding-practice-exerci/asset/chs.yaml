  \n## JavaScript: 三元运算符\n\n三元运算符( ?: ) 根据条件返回两个表达式之一的结果。\n\n### 语法\n```\ntest ? expression1\
  \ : expression2\n```\n如果 `test` 条件为真，则返回 `expression1`，否则返回 `expression2`。\n\n####\
  \ 示例\n```javascript\nvar x = prompt(\"输入整数\", \"100\");\nvar y = (x > 10)? \"x 大于\
  \ 10\": \"x 小于 11\";\n```\n如果你输入的值大于 10，则 `y` 被赋值为 \"x 大于 10\"，否则 `y` 被赋值为 \"x 小于\
  \ 11\"。\n\nternary.html\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>三元运算符</title>\n\
  </head>\n<body>\n```\n\n\n\n\n\n```html\n<script type=\"text/javascript\">\nvar\
  \ x = prompt(\"Enter an Integer\", \"100\");\nvar y = (x > 10) ? \"x is greater\
  \ than 10\" : \"x is less than 11\";\ndocument.write(\"value of x is \" + x + \"\
  <br />\");\ndocument.write(y);\n</script>\n```\n\n</body>\n</html>\n\n## JavaScript:\
  \ 与布尔值进行操作\n\n以下值被视为 false：\n\na. `undefined`\nb. `Null`\nc. `+0`, `-0` 或 `NaN`\n\
  d. 空字符串\n\n所有未在上述的值均被视为 true。\n\n`bool.html`\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n <title>true and false</title>\n</head>\n<body>\n <script type=\"text/javascript\"\
