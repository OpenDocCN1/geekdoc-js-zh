    # More on Link


    The Link component basically attaches an onClick event to its child. So, if the
    child supports onClick event, Link would work. Consider the following case:


    ```

    <Link href=\"/about\"><imgsrc=\"/static/profile.jpeg\" /></Link>

    ```


    In this case, Link would work correctly, and the navigation would happen, but
    you won’t get any atags with the href attribute set in the HTML markup, which
    might be bad for SEO.

    Hence, you should wrap the img tag above in an anchor tag.

    If you want Next.js to display the href attribute on tags other than anchor tag
    (for debugging purposes), you can pass passHref attribute to the Link component
    like this:


    ```

    <Link href=\"/about\" passHref>

    <imgsrc=\"/static/profile.jpeg\" />

    </Link>

    ```


    This would render the following markup:


    ```

    <imgsrc=\"/static/profile.jpeg\" href=\"/about\"/>

    ```


    This is good for debugging purposes when you want to find out what is the link
    page is going to be redirected on clicking that particular element.


    # Next.js components


    Pages are fine, but what about reusable code pieces? We can obviously create component
    files which could be included in other pages. Let’s create a directory called
    **components**, but remember, unlike pages or static, this time the name of the
    directory is not important. Here’s a simple example:


    ```

    // components/Header.js

    import Link from ‘next/link’

    const Header = () => (

    <header>

    <Link href=\"/\">

    <a>Home</a>

    </Link>

    <Link href=\"/about\">

    ```'
