    \ './Footer'\nimport './global.css'\nimport { Provider, defaultState, reducer\
    \ } from './state'\nconst Component1: React.FC = () => {\n  const [state, dispatch]\
    \ = useReducer(reducer, defaultState)\n  return (\n    <Provider value={{ state,\
    \ dispatch }}>\n      <Header />\n      <Content />\n      <Footer />\n    </Provider>\n\
    \  )\n}\nexport default Component1\n```\n\n现在你可以看到我们正在使用一个名为 `useReducer` 的新钩子。这个钩子的作用是返回一个包含两个元素的数组，就像我们之前使用\
    \ `useState` 钩子一样。第一个元素是状态，第二个元素是 `dispatch` 函数。\n\n`useState` 和 `useReducer`\
