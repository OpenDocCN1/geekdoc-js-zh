    \      'process.env': {\n        'BROWSER': 'true',\n      }\n    })\n  ]\n}\n\
    ```\n\n完成此操作后，让我们看看在 server.js 文件中需要做哪些更改：\n\n```\nconst express = require(\"\
    express\")\nconst app = express()\nconst React = require(\"react\")\nconst path\
