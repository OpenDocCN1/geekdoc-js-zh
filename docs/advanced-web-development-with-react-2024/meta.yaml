    \ value: 100 }) // 现在 reducer 被调用\n// 背后逻辑：reducer(state, { type: 'do something',\
    \ value: 100 }) -> 返回 101\n// 状态变为 101\n```\n\n这对于大规模数据管理很重要，因为现在你可以对数据流进行更精细的控制。\n\
