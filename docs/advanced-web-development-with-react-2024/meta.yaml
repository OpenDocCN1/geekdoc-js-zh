    \ `dispatch` 函数。\n5. 状态是我们原始的状态对象，而 `dispatch` 是用于更新状态的方法。你看，这里我们并不直接与状态交互，而是发送某些“操作”，这些操作反过来更新状态。\n\
    \n我们用一个空函数初始化 `dispatch` 方法，但最终在使用上下文提供者时会覆盖它，所以这没关系。\n\n现在，回到 `Component1.tsx`\
    \ 文件，它会是这样的：\n\n```javascript\nimport React, { useReducer } from 'react'\nimport\
