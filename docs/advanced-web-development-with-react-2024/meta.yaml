    \ }</p>\n<button onClick={() =>setCounter(c => c + 1)}>Increment</button>\n</>\n\
    }\n```\n\nAlright, here we could see that we're making use of the useEffect hook\
    \ by passing a function to it. This function is executed every time React renders\
    \ (or re-renders) our component. This function eventually sets the document's\
    \ title to our counter value. And in the function, you'll always have the latest\
    \ value of the state variable. This is because React does not mutate the state\
    \ variables at all! When using functional components and hooks, React does not\
    \ mutate state ever. You could see this fairly clearly by the use of our const\
    \ keyword over simple string/number values too. Instead, whenever React re-renders\
    \ our component, the useState() function returns the newly updated state to the\
    \ state variable, and the useEffect function calls the passed function on every\
    \ single render.\n\n# useEffect dependencies\n\nYou could quickly see how useEffect\
    \ could become a little heavy on performance as it would be running our passed\
    \ function again and again on every render even when nothing has been changed.\
    \ Let's take a look at the following example:\n\n```\nconst [counter1, setCounter1]\
    \ = useState(0)\nconst [counter2, setCounter2] = useState(0)\nuseEffect(() =>\
    \ {\n  document.title = 'Counter is at ' + counter1\n  console.log('Effect called')\n\
    })\nreturn <>\n<span>{ counter1 }</span>&nbsp;\n```"
