    - CSS\n\n### 目标\n\n本章旨在向你介绍 Next.js，这是一个为 React 构建的服务器端渲染框架。Next.js 将为你（作为开发者）简化大量工作流程，从而可以将更多精力投入到应用逻辑和目标上，减少在基础设施部分的投入。我们将学习它是什么，如何设置它以及如何有效地使用它。\n\
    \n### 什么是 Next.js？\n\nNext.js 是一个用于构建服务器端 React 应用程序的框架。框架提供了许多开箱即用的功能。Next.js\
    \ 开箱即用地提供了解决路由、页面管理、服务器端渲染、缓存等问题的方案，并且极其容易设置。\n\n你可以将 Next.js 的易用性与 create-react-app\
