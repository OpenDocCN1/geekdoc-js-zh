    # React on Server


    Currently, what happens when you use a react application is the following:


    +   1. You visit the page (let’s say http://example.com)

    2. The page makes a request to the remote server.

    3. The remote server sends you just a little HTML response like this:


    ![](img/bf8e5efd984d24a77d8cd00bdb613e5b_84_0.png)


    +   4. Your browser understands this request, and if you look closely, you’ll
    see that the request contains no readable content whatsoever. It is just linking
    to a bunch of CSS and JS files only.

    5. Your browser downloads those JS files.

    6. Your browser parses and runs those JS files (which is actually React code you
    wrote)

    7. Depending on the React code, your browser makes another HTTP request to the
    server to bring in the data required by the React app.

    8. Finally, when the data is available, first meaningful content render is done
    to the user.

    9. The DOM is now populated with all the HTML you expect to see. Here’s an example
