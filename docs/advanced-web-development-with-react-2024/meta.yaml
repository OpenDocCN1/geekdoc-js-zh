    \ Next.js to receive the login and process it.\n\n## APIs using Next.js\n\nWhen\
    \ we spun out our TypeScript demo, you must have seen that there’s a folder called\
    \ api which was present under the pages folder. This folder is special. Prior\
    \ to Next.js v9, we had to set up our own server for handling API calls. This\
    \ was cumbersome as it is tiring to maintain 2 Node servers handling a single\
    \ purpose. But now, Next.js natively supports handling API calls. We’ll soon cover\
    \ dynamic routing as well.\n\nDelete whatever was present inside the api folder\
    \ and create a new folder called login and within that create a file called index.ts.\
    \ The contents of the following should look like the following:\n\n```\n// pages/api/login/index.ts\n\
    import { NextApiRequest, NextApiResponse } from 'next'\nexport default async (req:\
    \ NextApiRequest, res: NextApiResponse)\n=> {\n  const { username, password }\
    \ = req.body\n  if(username === 'admin' && password === 'admin') {\n    return\
    \ res.json({\n      status: 'ok',\n      data: {\n        name: 'Mehul Mohan',\n\
    \        age: 21,\n        favQuote: 'Nobody cares about your feelings bro.'\n\
    \      }\n    })\n  }\n  return res.json({ status: 'error', message: 'Invalid\
    \ login' })\n}\n```\n\nAlright! So, what’s happening in this file?\n\n-   We created\
    \ a file under pages/api/login/index.ts.\n-   In this file, we export a function\
    \ instead of a React component. This is because this is our API endpoint and we\
    \ are allowed to write logic here.\n-   There are two arguments which Next.js\
    \ passes for us to work with. The first one is req (the request handler) and the\
    \ second one is res (the response handler).\n-   The first parameter, req, contains\
    \ all the relevant information about the current request hitting that particular\
    \ endpoint. This might include the POST body data, authentication cookies, custom\
    \ headers, and so on.\n-   The second parameter, res, is writable by you, the\
    \ developer. This has methods to call which would, in turn, create an HTTP response\
    \ under the hood which the API endpoint is supposed to send back to the client."
  mdcn: "\n## 启动项目\n\n首先，让我们从一个全新的 Next.js 项目开始。这很简单，我们在上一章已经做过。这里有几个关键点我们需要处理：\n\n\
    -   目前，这个项目我们需要一个登录页面、一个注册页面和一个仪表盘页面。\n-   为了简单起见，我们将登录页面作为首页。\n-   但在开始之前，让我们为\
    \ Next.js 切换到 TypeScript（就像我们之前为 React 做的那样）。\n\n## 切换到 TypeScript\n\nTypeScript\
    \ 本身已经证明，它是在大规模开发中编写 JavaScript 的一种非常可靠的方法，几乎每个达到一定规模的代码库都会遇到常见的 JavaScript 缺陷，例如没有类型检查支持。TypeScript\
    \ 在这个意义上非常实用。它编译成 JavaScript，同时允许我们使用对开发者来说最佳版本的 JavaScript 来编写代码。\n\n-   要创建一个\
    \ TypeScript 项目，我们直接使用 npx 的 create-next-app 工具。\n-   进入你想要设置 Next.js（或者我们应该称之为\
    \ Next.ts）项目的目录。\n-   运行以下命令：`npx create-next-app --example with-typescript my-custom-app`\n\
    -   这个命令会拉取 create-next-app 包，并使用提供的参数运行它。它会拉取一个使用 TypeScript 的示例仓库，然后创建我们的项目\
    \ my-custom-app，并且所有 npm install 和 package.json 的事情都已经处理好了。\n-   完成后，在你的文本编辑器中打开项目。\n\
    \n这是你现在的文件结构应该看起来的样子：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_131_0.png)\n\
    \n上面的截图显示了当前的文件结构。\n\n使用 `npm run dev` 启动你的应用程序，这将在 `localhost:3000` 启动一个本地开发服务器。\n\
    \n现在，让我们看看一个名为 Redux 的状态管理工具。\n\n## Redux\n\nRedux 是一个通用的状态管理工具，可以作为 React 的选项之一使用。Redux\
    \ 基本上集中管理状态，并使数据流是单向的。还记得我们在状态管理章节中如何使用 Context API 吗？Redux 的原理非常相似，只是它是一个外部依赖，并带有\
    \ Redux DevTools 和一系列其他好处。\n\n让我们看看如何将 Redux 与 Next.js 集成，以及如何一般性地使用它。但在此之前，让我们看看\
    \ Next.js 中一个叫做 getInitialProps 的生命周期方法。\n\n## getInitialProps\n\n在 Next.js 中，如果你需要在组件渲染之前用一些自定义逻辑填充\
    \ props，可以使用 getInitialProps。这个方法在客户端和服务器端都会执行。让我们看一些代码来更好地理解。让我们修改项目中的 about.ts\
    \ 文件：\n\n```\n// about.ts\nimport * as React from 'react'\nimport Link from 'next/link'\n\
    import Layout from '../components/Layout'\nimport { NextPage, NextPageContext\
    \ } from 'next'\ntype Props = {\nsomeprop: string\n}\nconst AboutPage: NextPage<Props>\
