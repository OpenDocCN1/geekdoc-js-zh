    \ the DOM directly by yourself - which is of course a bad practice when using\
    \ React).\n\n## State\n\nManaging state in class components is very straightforward.\
    \ Out of the box, React allows you to create a specially named variable called\
    \ state. React also provides a setState function which allows the mutation of\
    \ the state object by React (and subsequent re-render). If you’re wondering from\
    \ where this implementation comes, you could see that we inherit from the React.Component\
    \ class, which contains the functionality mentioned.\n\nHere’s a simple example\
    \ demonstrating the state in a class based component:\n\n```jsx\nclass App extends\
    \ React.Component<{}, { name: string }> {\n  state = {\n    name: 'Mehul'\n  }\n\
    \  render() {\n    return <p>{this.state.name}</p>\n  }\n}\n```\n\nHere we could\
    \ see once again that we could specify the type of the state in TypeScript, and\
    \ then we could go ahead and initialize our state with the defaults.\n\nSo where’s\
    \ the difference? The difference comes when we start using this.setState function.\
    \ Upon calling that, React will update our state object and would automatically\
    \ re-render and apply the updates to the component if necessary. For example:\n\
    \n```jsx\nclass App extends React.Component<{}, { num: number }> {\n  state =\
    \ {\n    num: Math.random()\n  }\n  changeNum() {\n    this.setState({\n     \
    \ num: Math.random()\n    })\n  }\n  render() {\n    return <p onClick={() =>this.changeNum()}>{this.state.num}</p>\n\
    \  }\n}\n```\n\nOn clicking the p tag, we’ll see that the state variable changes\
    \ the num property and sets it to a new Math.random value. See how it is different\
    \ from a functional component. In a functional component, the state is never mutated,\
    \ instead in a new render, the hooks return different (and updated) values. In\
    \ class based components however, React itself mutates the this keyword to update\
    \ the props and state according to the correct behaviour. This shows that although\
    \ functional and class based components might just look like syntactic sugar over\
    \ one another, fundamentally they’re very different from each other at their core\
    \ of working.\n\n## Lifecycle methods\n\nReact provides a bunch of lifecycle methods\
    \ for you to put your code in and take full control over the rendering mechanism\
    \ of the components. Let’s start with those and see a quick example in every component.\
    \ Additionally, we could explore how they differ from hooks and what could be\
    \ a possible behaviour replacement for hooks.\n\n### constructor\n\nIf you’re\
    \ coming from an OOP background, you’ll know constructor is the first method which\
    \ runs whenever you create an object. Although JavaScript doesn’t follow class-based\
    \ inheritance, the syntactic sugar it introduced with classes in ES6 resembles\
    \ pretty closely to the same pattern. This is not a lifecycle method provided\
    \ by React, but rather the language itself. However, you could do all of the initialization\
    \ work here, that is, initializing your state, setting up any global event listeners\
    \ (like window resize, and so on) and get ready for your component to get mounted.\n\
    \n### static getDerivedStateFromProps\n\nThis method was added in v16.3 and simply\
    \ allows you to update the state to match the props if required. The method getDerivedStateFromProps\
    \ runs before the render method both on the first mount and subsequent mounts.\
    \ It is static and you should not perform side effects (like animations or network\
    \ requests) in this method.\n\nInfact, React docs recommend that in most cases\
    \ you don’t need to implement this lifecycle method anyway. Most of your work\
    \ could be done by the other ones we’ll discuss now:\n\n```jsx\nstatic getDerivedStateFromProps(props,\
    \ state) {\n  if (props.email !== state.email) {\n    return {\n      email: props.email\n\
    \    }\n  }\n  return null\n}\n```\n\nYou see that we return null if there’s no\
    \ update, indicating that we do not intend to update the state of the component.\
    \ Whatever you return would be updated as the state of the component.\n\n### render\n\
    \nThis is the only method which is mandatory to be present in a class based React\
    \ component. That is because React is a UI library and the point of using a component\
    \ is to spit out some visual information to the user. So if you’re using React\
    \ component, `render` method is a must to define. Whatever you return from this\
    \ method gets displayed on the screen. Here’s a simple example:\n\n```jsx\nrender()\
    \ {\n  return <p>Hello world!</p>\n}\n```\n\n### getSnapshotBeforeUpdate\n\nReact\
    \ calls this method before react actually writes anything to the browser, that\
    \ is, to the DOM. At this point, render has been called but the DOM has not been\
    \ updated. Again, as the docs says, this method has specific use cases only, but\
    \ it’s always good to know about the available methods. You have to return a “snapshot”\
    \ value from this method which then you’ll be able to access in another lifecycle\
    \ method called `componentDidUpdate`. Here’s an example:\n\n```jsx\ngetSnapshotBeforeUpdate(prevProps,\
    \ prevState) {\n  if (prevProps.prop1 !== this.props.prop1) {\n    return \"Prop\
    \ mismatch\";\n  }\n  return null\n}\n```\n\nReturning null indicates that there\
    \ was no snapshot to be captured. And then we could access it in the componentDidUpdate\
    \ as we’ll see now.\n\n### componentDidMount\n\nThe method componentDidMount is\
    \ called once react is finished mounting the component. But not so fast! The component\
    \ is still not visible to the user as it has not been written to the DOM yet.\
    \ So what does it mean to be mounted? It means that the component has been mounted\
    \ in the virtual DOM of the React and is ready to be pushed to the DOM. At this\
    \ moment, if you call setState, React would perform a component re-render but\
    \ would not show the intermediate state of the component.\n\n### componentDidUpdate\n\
    \nThis method is called by React when your component updates. On the initial mount,\
    \ this method is not called. This gets called with three parameters - prevProps,\
    \ prevState and snapshot which are previous props, previous component state and\
    \ the snapshot from getSnapshotBeforeUpdate method as discussed above. Here’s\
    \ a simple example:\n\n```jsx\ncomponentDidUpdate(prevProps, prevState, snapshot)\
    \ {\n  if (this.props.id !== prevProps.id) {\n    // perform a new network request\
    \ and update state\n  }\n}\n```\n\n### componentWillUnmount\n\nAs the name suggests,\
    \ this method is fired when your component is being unmounted. This is the best\
    \ place for cleanup of global event listeners, cancelling network requests and\
    \ timers, and so on. This is the last lifecycle React would ever call in a component’s\
    \ lifetime.\n\nHere’s a beautiful open source illustration I found for lifecycle\
    \ methods of React:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_58_0.png)\n\n\
    *Figure 3.8*\n\n## Conclusion\n\nThis chapter was an important one as it introduced\
    \ us to components - functional and class based. Additionally, we learned about\
    \ hooks, how they work under the hood and how you could create custom hooks. Further,\
    \ we saw how to work with class based components as well and why React sees functional\
    \ components as the future of the library. We’ll keep covering more React topics\
    \ in depth in the chapters further.\n\n## Questions\n\n- What is the difference\
    \ between class and functional components?\n- Transpile the following into valid\
    \ JS: `<p><span>Hello</span> World</p>`\n- Is useState synchronous? Why/Why not?\n\
    - What does the dependencies array of useEffect hook do?\n- Does the useEffect\
    \ hook run before or after the component is rendered/updated?\n- Why does hook\
    \ have no “lifecycle methods” concept? How does it differ fundamentally from the\
    \ class-based model of lifecycles?\n\n# CHAPTER 4\n\n## Application State Management\
    \ in React\n\nIn the last chapter, we got our basic and solid understanding of\
    \ components and the ways to create and work with them. One thing we noticed is\
    \ that most components are truly useful when they have some sort of state associated\
    \ with them, that is, the components “remember”. That being said, React does a\
    \ great job with the hooks like useState and the this.state object for functional\
    \ and class-based components, respectively. But as your code grows, there’s a\
    \ necessity of managing state in a more organized way, avoid prop drilling and\
    \ make things cleaner, especially when there has to be an information exchange\
    \ among different components at different levels of nesting.\n\nThis could be\
    \ referred to as managing the state of the application. Let’s see how we could\
    \ work with it.\n\n### Structure\n\n- Communication between components\n- Using\
    \ Context API\n  - createContext\n  - useContext\n- useReducer hook\n- Redux as\
    \ an alternative\n\n### Objectives\n\nIn this chapter, we aim to cover basic out\
    \ of the box functionality which react provides us to manage state in our applications.\
    \ In most of the cases, it would be all one would need for his/her projects, and\
    \ even a bit beyond. For very advanced cases, we’ll use a reducer based pattern\
    \ like Redux."
  mdcn: "\n组件，无论你从渲染方法返回什么，那都是用户在屏幕上唯一能看到的内容（除非你直接操作DOM——这在使用React时当然是不良实践）。\n\n##\
    \ State\n\n在类组件中管理状态非常直观。React开箱即用地允许你创建一个名为`state`的特殊变量。React还提供了一个`setState`函数，允许React对状态对象进行修改（并触发后续的重新渲染）。如果你好奇这个实现从何而来，可以发现我们继承自`React.Component`类，它包含了上述提到的功能。\n\
    \n下面是一个展示类组件中state的简单示例：\n\n```jsx\nclass App extends React.Component<{}, { name:\
    \ string }> {\n  state = {\n    name: 'Mehul'\n  }\n  render() {\n    return <p>{this.state.name}</p>\n\
    \  }\n}\n```\n\n这里我们再次看到，可以在TypeScript中指定state的类型，然后用默认值初始化我们的状态。\n\n那么区别在哪里呢？区别出现在我们开始使用`this.setState`函数时。调用该函数后，React会更新我们的状态对象，并在必要时自动重新渲染并将更新应用到组件。例如：\n\
    \n```jsx\nclass App extends React.Component<{}, { num: number }> {\n  state =\
    \ {\n    num: Math.random()\n  }\n  changeNum() {\n    this.setState({\n     \
    \ num: Math.random()\n    })\n  }\n  render() {\n    return <p onClick={() =>this.changeNum()}>{this.state.num}</p>\n\
    \  }\n}\n```\n\n点击`p`标签时，我们会看到状态变量`num`属性被更改为新的`Math.random`值。看看它与函数组件有何不同。在函数组件中，状态永远不会被直接修改；相反，在新的渲染中，钩子会返回不同（已更新）的值。而在类组件中，React自身会修改`this`关键字，根据正确的行为更新props和state。这表明，尽管函数组件和类组件看起来可能只是彼此的语法糖，但在其核心工作原理上，它们彼此有根本性的不同。\n\
    \n## 生命周期方法\n\nReact提供了一系列生命周期方法，让你将代码放入其中，从而完全控制组件的渲染机制。让我们从这些方法开始，并在每个组件中查看一个快速示例。此外，我们可以探讨它们与钩子的区别，以及钩子可能的行为替代方案。\n\
    \n### constructor\n\n如果你有面向对象编程的背景，你会知道`constructor`是创建对象时运行的第一个方法。虽然JavaScript不遵循基于类的继承，但它在ES6中引入的类语法与之非常相似。这不是React提供的生命周期方法，而是语言本身提供的。然而，你可以在这里完成所有初始化工作，即初始化你的状态、设置任何全局事件监听器（如窗口调整大小等），并为组件挂载做好准备。\n\
    \n### static getDerivedStateFromProps\n\n此方法在v16.3中添加，它简单地允许你在需要时更新状态以匹配props。`getDerivedStateFromProps`方法在首次挂载和后续挂载时都在`render`方法之前运行。它是静态的，你不应该在此方法中执行副作用（如动画或网络请求）。\n\
    \n事实上，React文档建议在大多数情况下你不需要实现这个生命周期方法。你的大部分工作可以通过我们现在将要讨论的其他方法完成：\n\n```jsx\nstatic\
    \ getDerivedStateFromProps(props, state) {\n  if (props.email !== state.email)\
    \ {\n    return {\n      email: props.email\n    }\n  }\n  return null\n}\n```\n\
    \n你会看到，如果没有更新，我们返回`null`，表示我们不打算更新组件的状态。无论你返回什么，都会作为组件的状态进行更新。\n\n### render\n\
    \n这是类组件中必须存在的唯一方法。这是因为React是一个UI库，使用组件的目的是向用户输出一些可视信息。所以，如果你使用React组件，`render`方法是必须定义的。从这个方法返回的内容会显示在屏幕上。这里有一个简单的例子：\n\
    \n```jsx\nrender() {\n  return <p>Hello world!</p>\n}\n```\n\n### getSnapshotBeforeUpdate\n\
    \nReact在实际将任何内容写入浏览器（即DOM）之前调用此方法。此时，`render`已被调用，但DOM尚未更新。同样，正如文档所说，此方法有特定的用例，但了解可用的方法总是好的。你必须从这个方法返回一个“快照”值，然后你可以在另一个名为`componentDidUpdate`的生命周期方法中访问它。这里有一个例子：\n\
    \n```jsx\ngetSnapshotBeforeUpdate(prevProps, prevState) {\n  if (prevProps.prop1\
    \ !== this.props.prop1) {\n    return \"Prop mismatch\";\n  }\n  return null\n\
    }\n```\n\n返回`null`表示没有快照需要捕获。然后我们可以在`componentDidUpdate`中访问它，我们接下来会看到。\n\n###\
    \ componentDidMount\n\n`componentDidMount`方法在React完成组件挂载后调用。但先别急！组件对用户仍然不可见，因为它还没有写入DOM。那么，挂载是什么意思呢？它意味着组件已经在React的虚拟DOM中挂载好，准备被推送到DOM。此时，如果你调用`setState`，React会执行组件的重新渲染，但不会显示组件的中间状态。\n\
    \n### componentDidUpdate\n\n当你的组件更新时，React调用此方法。在初始挂载时，此方法不会被调用。它会被传入三个参数：`prevProps`、`prevState`和`snapshot`，分别是之前的props、之前的组件状态，以及上面讨论过的`getSnapshotBeforeUpdate`方法的快照。这里有一个简单的例子：\n\
    \n```jsx\ncomponentDidUpdate(prevProps, prevState, snapshot) {\n  if (this.props.id\
    \ !== prevProps.id) {\n    // perform a new network request and update state\n\
    \  }\n}\n```\n\n### componentWillUnmount\n\n顾名思义，此方法在你的组件即将卸载时触发。这是清理全局事件监听器、取消网络请求和定时器等的最佳位置。这是React在组件生命周期中最后一次调用的方法。\n\
    \n这是我为React生命周期方法找到的一个漂亮的开源插图：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_58_0.png)\n\
    \n*图 3.8*\n\n## 结论\n\n本章非常重要，因为它向我们介绍了组件——函数组件和类组件。此外，我们学习了钩子、它们的底层工作原理以及如何创建自定义钩子。进一步，我们看到了如何使用类组件，以及为什么React将函数组件视为其未来的方向。在后续章节中，我们将继续深入介绍更多React主题。\n\
    \n## 问题\n\n- 类组件和函数组件有什么区别？\n- 将以下内容转译为有效的JS：`<p><span>Hello</span> World</p>`\n\
    - useState是同步的吗？为什么/为什么不？\n- useEffect钩子的依赖数组有什么作用？\n- useEffect钩子是在组件渲染/更新之前还是之后运行？\n\
    - 为什么钩子没有“生命周期方法”概念？它与基于类的生命周期模型有何根本不同？\n\n# 第4章\n\n## React中的应用状态管理\n\n在上一章中，我们对组件有了基本且扎实的理解，以及创建和使用它们的方法。我们注意到的一件事是，大多数组件只有在与某种状态相关联时才真正有用，即组件能“记住”东西。话虽如此，React在钩子（如`useState`）和`this.state`对象（分别用于函数和类组件）方面做得很好。但随着你的代码增长，有必要以更有条理的方式管理状态，避免属性传递（prop\
    \ drilling），并使事情更清晰，尤其是在不同嵌套级别的不同组件之间必须交换信息时。\n\n这可以称为管理应用状态。让我们看看如何处理它。\n\n###\
    \ 结构\n\n- 组件间的通信\n- 使用 Context API\n  - createContext\n  - useContext\n- useReducer\
    \ 钩子\n- Redux 作为替代方案\n\n### 目标\n\n在本章中，我们旨在涵盖React开箱即用提供的基本功能，用于管理应用中的状态。在大多数情况下，这将是你的项目所需要的全部，甚至可能超出一点。对于非常高级的情况，我们将使用基于reducer的模式，如Redux。\n"
