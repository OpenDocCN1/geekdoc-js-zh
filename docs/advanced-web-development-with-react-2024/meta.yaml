- md: "## 1. React 101\n\nJavaScript: It is the programming language of the web. Since\
    \ the dawn of the web, developers are eager to provide increasingly better experiences\
    \ for the end-user in terms of interactivity, animations, effects, and stability.\
    \ JavaScript made it all possible. As it progressed, there were needs for some\
    \ obvious reasons to introduce frameworks and libraries, for faster development\
    \ and better stability.\n\nReact is one such part of the ecosystem. React sells\
    \ itself as \"A JavaScript library for building user interfaces\". But honestly,\
    \ while being true to the statement, we think React goes much beyond that. It\
    \ could be made into a complete ecosystem, powering some of the most complex web\
    \ application systems, for example, Facebook.\n\nWe’ll be quickly going through\
    \ the React basics and then taking up intermediate to advanced topics, which would\
    \ really give you the essence of React and eventually help you to start writing\
    \ your production-ready applications with React.\n\nVery simply speaking, React\
    \ is a **User Interface (UI)** library. Let’s break that down:\n\n1.  React, on\
    \ its own says that it’s a library, which means that it does not try to ship everything\
    \ with it. Instead, you have the option to cherry-pick the things you want in\
    \ your project and can implement them.\n2.  React says that it is a UI library,\
    \ that is used for building interfaces visible to the user. What does that mean?\
    \ In simple terms, it means creating and maintaining what the user sees on the\
    \ screen.\n\n## Structure\n\n- Introduction\n- Understanding React\n- Basic understanding\
    \ of how React works as a UI library\n- Declarative versus imperative programming\n\
    - Cheat-sheet for further React topics\n\n## Objectives\n\nIn this introductory\
    \ chapter, we'll be understanding what exactly is React doing and why should one\
    \ care. We'll be seeing on the surface, how it works as a UI library and how the\
    \ declarative approach of React is so powerful in creating better UI systems.\
    \ Finally, we'll want to get started with React programming, but would end the\
    \ chapter with some notes that might be handy to see as a JavaScript refresher.\n\
    \n## React is component-based\n\nReact makes use of *components*. The ideology\
    \ is simple - React says that instead of coding everything at the same place (like\
    \ we usually do while coding simple HTML pages), break different (and usually\
    \ independent) parts of the page into different components. This increases the\
    \ code maintainability by factors and allows developers to have faster and clean\
    \ codebases. We'll have dedicated chapters on working with components, as it is\
    \ the crux of React.\n\n## React is declarative\n\nWe'll focus mainly on two programming\
    \ paradigms here - declarative programming and imperative programming. Let's start\
    \ with a simple example.\n\nWhen you write a code, you can specify:\n\n1.  What\
    \ do you want to do?\n2.  How do you want to do?\n\nIf you specify both, you're\
    \ making use of the imperative programming practice. If you're just specifying\
    \ what you want to do, then you're using the declarative way of programming. Here's\
    \ a simple example.\n\nConsider that you want to draw a border around a box. In\
    \ CSS, you'd simply say `border: 2px solid black`. This is declarative. You just\
    \ said what you want to do, not how you want to do. On the other hand, if you\
    \ try to draw the border in vanilla JavaScript, you have to specify four coordinates,\
    \ and then draw the line manually using code. This would be an imperative way.\n\
    \nDeclarative programming has its own pros and cons, but the pros almost always\
    \ outweigh the cons:\n\n1.  Declarative code can make use of highly optimized\
    \ algorithms. Since the “how” is abstracted from the end-user, the imperative\
    \ model under declarative code can make use of seriously complex code to provide\
    \ major performance boosts, while exposing an easy declarative way for users to\
    \ use the same functionality at the same time.\n2.  Declarative programming brings\
    \ other benefits like code scalability, reduced bugs, and more understandable\
    \ code.\n\nComing back to React, it is **declarative**. This means that you just\
    \ tell React “what” you want to do, and not “how” you want to do it. React, under\
    \ the hood, manages everything for you in a very optimized way.\n\nWe will discuss\
    \ on how the React virtual DOM, reconciliation and other optional advanced stuff\
    \ works under the hood, in detail, in the last chapter.\n\n## Quick JS revision\n\
    \nBefore we dive into the React ecosystem, we'd like to put some quick JS things\
    \ that you should definitely be aware of, while working with React. Let's take\
    \ a quick look at this section for now and come back later as you need.\n\n##\
    \ this\n\n`this` is surprisingly complicated for a lot of people in JavaScript.\
    \ Keep in mind that in a function, `this` always refers to how that function is\
    \ called, except for arrow functions, where `this` is lexically scoped:\n\n```javascript\n\
    function myName() {\n  return this.myname\n}\n```\n\n## 2. Setting up React\n\n\
