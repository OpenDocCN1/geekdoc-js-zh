    # About components


    Components are the heart of React. Think of components as pieces of code which
    are decoupled from the main big JavaScript bundle to provide maintainability and
    makes it easy to add features on top of the existing codebase. Usually, you’d
    want to separate components on the basis of where and how they appear in the UI
    of the page. With React 16.8 and above, there are precisely two ways to write
    components with similar functionality as we’re going to see now—functional components
    and class-based components.


