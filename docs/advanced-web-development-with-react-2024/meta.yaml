    \n我们构建的树结构在服务器端和客户端渲染之间现在是不一致的。这是因为，当React代码在服务器上渲染时，它并不知道 `process.env.BROWSER`，因此不会预填充状态变量，从而使用了那个加载中的片段。然而，在客户端，当React重新水合数据时，全局作用域中已经有了数据，因此它用实际数据重新水合，从而造成了不一致。React也向我们在控制台报告了这一点：\n\
    \n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_107_1.png)\n\n**图 5.14**\n\n在上一个截图中，你可以看到React抱怨DOM不匹配，即它期望的内容与服务器实际发送的内容不一致。\n\
    \n- 另一个问题在于，我们获取了所有组件的异步数据，而实际上我们只需要获取当前活跃组件的异步数据。\n- 我们也没有处理嵌套组件的问题，即许多嵌套组件需要从彼此那里获取异步数据。\n\
