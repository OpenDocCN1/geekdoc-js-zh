    \n- 首先，我们将所有组件收集到一个名为 components 的数组中。\n- 然后我们创建一个 Promises 数组。最终，这个数组将包含多个未完成的\
    \ fetch 请求。\n- 这里，我们从 components 数组开始，并创建一个新的对象数组，其中包含要获取的链接（asyncData 链接）和组件的名称（在\
