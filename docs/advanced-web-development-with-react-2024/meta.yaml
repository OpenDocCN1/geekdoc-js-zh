  md: '# Moving from classes


    I’m fully aware that React has first-class support for class-based components,
    but this chapter aims at future tech and experimental tech associated with React,
    and the team has made it very clear that in the future, functional components
    would be the ones which would get the most focus on development. With hooks, functional
    components are fully capable of doing everything class-based components do. If
    you’re just picking up React, I would say just know about class-based components
    enough to refactor them, but if you’re creating your own components, always go
    with functional components.


    Class-based components have their own pros and cons, like, they actually mutate
    state and props, whereas functional components actually capture the props and
    state at the time of render. This avoids nasty bugs. Moreover, functional components
    are a more friendly way to code than classes, simply because JavaScript has no
    classes;it is just syntactic sugar over functions.


    # Concurrent mode


    The concurrent mode in React is a completely new way of working with React. In
    Computer Science, concurrency usually means performing multiple tasks on the basis
    of time slicing. React, once it is done with the vDOM diffs, now has to commit
    these changes to the DOM. Calculating the changes in vDOM is non-blocking, even
    now, and it is how internally React works (using browser’s idle time by calling
    requestIdleCallback function in browsers and in different threads for other host
    environments), however the commit phase, that is, writing to DOM is synchronous.
    Some notable features of concurrent mode:


    +   1. **Interruptible rendering**: Consider a huge list consisting of items where
    you could filter for the items. If you ever used such an application, you know
    that it could become all jittery and lagging unless there is some sort of debounce
    function in place which doesn’t run the search JavaScript logic unless the user
    has stopped typing (say checking if the last keystroke was 200ms before or so).
    Concurrent mode fixes this by making the renders interruptible by high priority
    interrupts. A user interacting with an input field is a higher priority'
