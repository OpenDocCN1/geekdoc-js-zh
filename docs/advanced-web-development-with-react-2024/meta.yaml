    在上一章中，我们学习了 Next.js 技术及其如何在今天为 React 的 SSR 领域提供支持。当 Web 应用与原生应用相遇时，一种不同类型的应用诞生了，这就是渐进式
    Web 应用。在本章中，我们将全面了解 PWA，并学习如何使用 React 作为我们的主要前端库来创建一个。


    ### 结构


    -   什么是 **渐进式 Web 应用 (PWA)**

    -   PWA 入门

