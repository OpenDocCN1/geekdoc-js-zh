    \ now, we need a login page, a registration page, and a dashboard page.\n-   Let's\
    \ keep our login page as our index page for simplicity.\n-   But before anything,\
    \ let's switch to TypeScript for Next.js (just like we did with React earlier).\n\
    \n## Switching to TypeScript\n\nTypeScript has proven itself to be a very reliable\
    \ method writing JavaScript on the scale, and almost every codebase after hitting\
    \ a certain scale would suffer from the common JavaScript pitfalls like no type\
    \ checking support. TypeScript comes very handily in this sense. It compiles down\
    \ to JavaScript, at the same time allows us to use the best version of JavaScript\
    \ for developers to write.\n\n-   To create a TypeScript project, let's use the\
    \ create-next-app utility directly from npx\n-   Go to a directory where you want\
    \ to set up your Next.js (or should we call it, Next.ts project\n-   Run the following\
    \ command: `npx create-next-app --example with-typescript my-custom-app`\n-  \
    \ What this does is that it pulls the create-next-app package and runs it with\
    \ the supplied arguments. It pulls an example repo that uses TypeScript and then\
    \ creates our project with the name my-custom-app with all the npm install and\
    \ package.json stuff already taken care of.\n-   Once you do that, open the project\
    \ in your text editor.\n\nThis is how your file structure should look like right\
    \ now:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_131_0.png)\n\nThe preceding\
    \ screenshot shows the file structure right now.\n\nStart your application using\
    \ `npm run dev` which would start a local development server at `localhost:3000`\n\
    \nNow, let’s look at a state management tool called Redux.\n\n## Redux\n\nRedux\
    \ is a generic state management tool that could be used as one of the options\
    \ with React. Redux basically centralizes the state and makes the flow of data\
    \ unidirectional. Remember how we used Context API in the State Management chapter?\
    \ Redux falls on very similar lines, just that it is an external dependency and\
    \ comes with Redux DevTools and a bunch of other benefits.\n\nLet's see how we\
    \ can integrate Redux with Next.js and how to work with it in general. But before\
    \ that, let's look at something called getInitialProps lifecycle in Next.js.\n\
    \n## getInitialProps\n\nIn Next.js, getInitialProps is used to populate the props\
    \ with some custom logic if you want to before the component is rendered. This\
    \ method is executed on both the client and the server. Let's look at some code\
    \ to understand in a better way. Let's modify the about.ts file present in our\
    \ project:\n\n```\n// about.ts\nimport * as React from 'react'\nimport Link from\
    \ 'next/link'\nimport Layout from '../components/Layout'\nimport { NextPage, NextPageContext\
    \ } from 'next'\ntype Props = {\nsomeprop: string\n}\nconst AboutPage: NextPage<Props>\
    \ = (props: Props) => (\n<Layout title=\"About | Next.js + TypeScript Example\"\
    >\n<h1>About</h1>\n<p>This is the about page</p>\n<p>\n<Link href=\"/\">\n<a>Go\
    \ home {props.someprop}</a>\n</Link>\n</p>\n</Layout>\n)\nAboutPage.getInitialProps\
    \ = async ({pathname, query}: NextPageContext) => {\nconsole.log(pathname, query)\n\
    return {\nsomeprop: 'customvalue'\n}\n}\n\nexport default AboutPage\n```\n\nThe\
    \ lines in bold are the changes we did in this file. Notice how we have added\
    \ a function called getInitialProps to the AboutPage. This function runs before\
    \ the component is mounted, as you can see, this function is supposed to return\
    \ a Promise. Thus, you can do all sorts of async activity in it as well, as well\
    \ as set up our Redux store (more on this later). Since this is coming out from\
    \ Next.js, it is isomorphic and runs both on server and client.\n\nIn the browser\
    \ it produces the following output:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_133_0.png)\n\
    \n**Figure 7.2**\n\nThe preceding screenshot shows the output from the browser.\n\
    And the console looks like the following:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_133_1.png)\n\
    \n**Figure 7.3**\n\nThe preceding screenshot shows the output from the browser.\
    \ Okay. Let’s start with our app now.\n\n## Creating App\n\nLet’s start with the\
    \ index.ts page which would be our login page:\n\n1.  Here’s a quick example of\
    \ index.ts file we could use:\n\n```\n// pages/index.ts\nimport React, { useState\
