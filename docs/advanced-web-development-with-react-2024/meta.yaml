- md: "+   Finally, let's touch src/index.js and write the following in it:\n    import\
    \ React from 'react'\n    import ReactDOM from 'react-dom'\n    ReactDOM.render(<div>Hello\
    \ World</div>,\n    document.getElementById('root'))\n\n+   That's it! Now go\
    \ ahead and run npm start in your project's root directory. Your web browser should\
    \ open, and Hello World should appear on your screen.\n\nFor this course, however,\
    \ we'll be making use of create-react-app approach as it abstracts away all the\
    \ webpack and babel configuration and gives us a great opportunity to write and\
    \ focus on our React code.\n\n## JSX\n\nLet's dive a little into JSX, the weird\
    \ HTML syntax that we just wrote in JavaScript file:\n\n```\nReactDOM.render(<div>Hello\
    \ World</div>,\ndocument.getElementById('root'))\n```\n\nDo you see what we did\
    \ there? You can see a div tag written directly, without the quotes. That is JSX.\
    \ JSX stands for JavaScript eXtensible markup language.\nJSX is a different syntax.\
    \ It allows you to harness the simplicity of the HTML markup, whilst making powerful\
    \ JavaScript computation together. You can include JavaScript expressions, dynamic\
    \ props (properties, or what we call attributes in regular HTML), and handling\
    \ UI and functionality at the same time.\n\nYou could also write expressions in\
    \ JSX using curly braces. Consider the following JSX example:\n\n```\nconst elem\
    \ = <div>Hello World { document.location.href } { 5 + 5 }\n{ 'Regular string'\
    \ } </div>\n```\n\nThis is a completely valid JSX syntax, but definitely not valid\
    \ JavaScript. So, what happens under the hood?\n\n## JSX transformation\n\nReact\
    \ compiles down JSX to normal ES5 code. Consider the following example:\n\n```\n\
    const elem = <div className=\"a-classy-div\">JSX seems so cool!</div>\n```\n\n\
    This example is compiled to the following:\n\n```\nconst elem = React.createElement('div',\
    \ { className: 'a-classy-div' }, 'JSX seems so cool!')\n```\n\nThe latter definitely\
    \ looks like a valid JavaScript syntax. This is the magic of JSX. You get a visual\
    \ aid of writing the React components, because now you can easily avoid the cumbersome,\
    \ additional JavaScript code that you have to write for the UI part.\n\nIn fact,\
    \ the preceding two code snippets are the same, which means that instead of JSX\
    \ you could directly write that React.createElement part. But of course, JSX is\
    \ much cleaner to eyes than the barebones JS, for UI development.\n\n## Moving\
    \ to TypeScript\n\nNow that we’re up and running with a basic JavaScript project\
    \ in React, it’s time to introduce TypeScript. We’ll not be focusing too much\
    \ TypeScript with all the typecasts and interfaces and everything baked into,\
    \ right away. Rather, we’ll just use the best parts of TypeScript (that is, auto\
    \ completion and error-free code practices) and would use it throughout the book.\
    \ Here’s how you’re going to start a TypeScript project:\n\n*   Nuke the JS hello\
    \ world folder we created earlier.\n*   Assuming that you’ve already installed\
    \ the create-react-app utility using the instructions above, in your command line,\
    \ write create-react-app hello-world-ts --template typescript.\n*   This will\
    \ initialize your React project with TypeScript.\n*   Here’s how your final file\
    \ structure should look like:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_36_0.png)\n\
    \nFinally, we're ready to work with React!\n\n## Conclusion\n\nWe learned what\
    \ JSX is, how to create our project with React, and eventually, move to TypeScript,\
    \ as it provides better type checking and allows you to write bug-free code more\
    \ easily. In the further chapters, we'll be diving deep into React and seeing\
    \ the fundamentals, as well as the core concepts associated with it.\n\n# CHAPTER\
    \ 3 Components\n\nComponents are a fundamental part of React. The ideology goes\
    \ like this: everything on a webpage can be broken into reusable views called\
    \ components. These components can be linked with each other, could be completely\
    \ independent, could be aware of their parent components or might as well be completely\
    \ “dumb” to their environment.\n\nLet’s see more about how to work with them.\n\
    \n## Structure\n\n*   About components\n*   Class versus functional components\n\
    *   Functional components\n    *   Props\n    *   Children\n    *   Hooks\n  \
    \      *   useState\n        *   useEffect\n        *   useCallback\n    *   Custom\
    \ Hooks\n*   Class components\n    *   Props\n    *   State\n    *   Lifecycle\
    \ methods\n        *   getDerivedStateFromProps\n        *   Render\n        *\
    \   getSnapshotBeforeUpdate\n        *   componentDidMount\n        *   componentDidUpdate\n\
    *   Conclusion\n\n## Objectives\n\nThis chapter aims to introduce you to components\
    \ in React and the two major ways to create them. We’ll start with functional\
    \ components and soon would realize that it is a much better and cleaner way to\
    \ create components compared to the class-based approach to creating components.\
    \ We’ll learn some edge cases and eventually, learn about hooks and lifecycle\
    \ events in functional and class-based components, respectively. We’ll finally\
    \ conclude the chapter with clarity of components in mind moving towards more\
    \ advanced concepts.\n\n## About components\n\nComponents are the heart of React.\
    \ Think of components as pieces of code which are decoupled from the main big\
    \ JavaScript bundle to provide maintainability and makes it easy to add features\
    \ on top of the existing codebase. Usually, you’d want to separate components\
    \ on the basis of where and how they appear in the UI of the page. With React\
    \ 16.8 and above, there are precisely two ways to write components with similar\
    \ functionality as we’re going to see now—functional components and class-based\
    \ components.\n\n## Class versus functional components\n\nClass-based components\
    \ have been present in React for a very long time. In fact, almost forever, it\
    \ has been the only way to create a working React component with its own state.\
    \ This was changed with the introduction of hooks, which we’ll look at in the\
    \ next section. However, here are a couple of points about class and functional\
    \ components after hooks:\n\n1.  Functional component (after hooks) is clearly\
    \ a better way to create components in React because they’re much cleaner than\
    \ classes, avoids a lot of common pitfalls you’ll see in class-based components\
    \ code (example - binding of this), avoids mutation of state and uses side effects\
    \ instead of lifecycle-based model.\n2.  React core team recommends preferring\
    \ hooks as well because of the reasons stated above. Although class-based components\
    \ are not going anywhere anytime soon, still, we could all agree that functional\
    \ components are the future React library is aiming at.\n\nWith that being said,\
    \ there’s always an advantage in learning more than you’d use. We’ll cover class-based\
    \ components here quickly and dive deep into functional components which is a\
    \ more important aspect now. But first, let’s start with functional components.\n\
    \n## Functional Components\n\nFunctional components have existed in React for\
    \ a long time. Let us take a look at this hello world React code before going\
    \ further:\n\n```\nimport React from 'react'\nimport ReactDOM from 'react-dom'\n\
    function App() {\n  return <p>Hello World</p>\n}\nReactDOM.render(<App />, document.getElementById('root'))\n\
    ```\n\nYou can see here, that we’re using a function called App here as a React\
    \ component. Well, how does one know that it is a React component? When you use\
    \ it as JSX (like <App />), it gets transpiled to the following:\n\n```\nimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\nfunction App() {\n \
    \ return React.createElement(\"p\", null, \"Hello World\");\n}\nReactDOM.render(React.createElement(App,\
    \ null),\ndocument.getElementById('root'));\n```\n\nSo what is happening here?\n\
    \n1.  Everything you write in JSX is transpiled to equivalent React calls (we\
    \ discussed this in Chapter 1). JSX is just syntactic sugar for the preceding\
    \ example.\n2.  React.createElement returns a JavaScript object which looks something\
    \ like this:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_40_0.png)\n\nNow, we\
    \ don’t want to get into the internals of React right now, but eventually, React\
    \ uses this object to create a tree, a virtual DOM, to say. Let’s get back to\
    \ some properties of the functional components now.\n\n## Props\n\nPassing props\
    \ (short for properties) is a common scenario, and you’ll be doing it almost always\
    \ as a way to pass down data to child components. React works in a way where parents\
    \ pass down data to child components. Sure, with the context API you could magically\
    \ transport the data multiple level downs (more on this later), but props enable\
    \ you the simplest way of data passing. Let’s take a look at this example:\n\n\
    ```\ninterface props {\n  name: string\n}\n\nconst App: React.FC<props> = props\
    \ => {\n  return <p>Hello {props.name}</p>\n}\nReactDOM.render(<App name=\"Mehul\"\
    \ />,\ndocument.getElementById('root'))\n```"
