    # 献给


    我的家人和朋友


    我的妈妈、爸爸、姐姐以及亲密的朋友们，他们一直对我充满信心。


    # 关于作者


    **Mehul Mohan**是一位企业家、开发者和安全研究员。目前，他正在印度理工学院比尔拉分校攻读计算机科学与工程学士学位。他是WWDC’19学者，并运营着codedamn——一个供人们学习编程的平台。你经常会发现他在他的YouTube频道codedamn上制作编程教程，该频道拥有超过100,000名订阅者。他曾获得谷歌、微软、索尼等公司对其作为安全研究员所做贡献的认可。


    # 关于审稿人


    自驱力强、富有魅力的程序员，目前担任美国Verizon公司的技术分析师，专注于前端编程。参与了将Verizon网站页面从Angular迁移到React Js的工作。拥有印度莫迪科技大学计算机科学学位。


    技术爱好者，热爱UI设计。在软件开发、前端开发方面拥有丰富经验，包括分析、设计、开发和测试基于面向对象JavaScript、HTML5、CSS3、BootStrap、ReactJS、JSON、Redux、JQuery的Web应用程序。以高度承诺和灵活应对多重角色而闻名。参与过Sprint规划、每日Scrum会议、Sprint演示和Sprint回顾会议。在UI开发、Web
    UI分析、响应式设计、编码、单元测试、实施和支持等多个项目中拥有广泛经验。


    在敏捷软件开发团队中使用SCRUM、TDD（测试驱动开发）。精通使用核心Java概念（如OOPS）开发应用程序。优秀的沟通和人际交往能力，自驱力强，喜欢作为团队成员与他人协作。在Verizon之前，我曾在法国电信（Orange
    France）担任Java开发人员。参与将Orange的计费系统从DML（一种遗留代码语言）迁移到Java。由于拥有法语文凭，掌握的法语知识对该项目帮助很大，并且曾为同事们开设法语课程，这也很有趣。


    还曾在HCL和C-DOT实习。喜欢在线上为开源项目做贡献。喜欢在空闲时间做自由职业项目。爱好：探索全球新地方、结识新朋友以及阅读关于太空的书籍。


    # 致谢


    我要感谢一些人在撰写本书期间给予我的持续支持。首先，我要感谢我的妈妈Ritu Mohan女士和我的爸爸Vinay Kumar Mohan先生，无论我何时需要他们，他们总是在那里。


    我还要感谢我的姐姐Ishumita Mohan女士，她恰好也是本书的技术编辑，感谢她一直以来的持续支持。


    最后，我要感谢BPB Publications的Nrip Jain，感谢他给我这个机会，让我为他们撰写我的第一本书。


    # 前言


    随着网络在过去5-6年的快速发展，建立在现有市场最佳实践之上而不是从零开始，这已是不言而喻的。React就是这样一种工具，用于构建高度响应和可扩展的Web应用程序，并带来了行业最佳实践，被Facebook等互联网前端巨头所使用。因此，对于开发者来说，提升他们的Web开发技能，将React纳入他们的工具箱变得极为重要。


    随着企业对优化用户体验以及搜索引擎优化需求的增加，诸如服务器端渲染（SSR）和渐进式Web应用（PWA）之类的技术可以使公司能够构建更好的产品，同时减少现有代码库的技术维护。


    本书是希望学习React前沿功能、温习React技能、或开始使用Next.js和React进行SSR/PWA工作的开发者的首选手册，这最终将帮助他们基于高度维护和值得信赖的开源代码扩展现有应用程序。本书将带你了解构建适用于SSR部署或转换为PWA的应用程序部分所需的不同离散概念。在本书的9章中，你将学习以下内容。


    **第1章**向你介绍React。我们将深入探讨React是什么，以及为什么它是当今构建高度可扩展应用的绝佳选择。我们还将快速温习未来章节所需的一些必要JS概念。


    **第2章**将涵盖使用各种方法设置React，并讨论每种方法的优缺点。我们还将开始用React编写基本应用程序，并开始了解React开箱即用的优势。


    **第3章**将介绍在React中创建组件的两种方式，并讨论React在组件方面的现代方法——函数式。我们还将在本章中使用hooks，并了解为什么它们比其对应物——类组件更有意义。


    **第4章**介绍React中的状态管理。在这里我们讨论使用React管理状态的可能选项。我们将了解使用Redux管理状态，以及使用最新的hooks——useContext和useReducer来模拟Redux
    store。


    **第5章**介绍React中的服务器端渲染，我们将了解什么是SSR，以及它是如何工作的。我们将在本章中从零开始自己实现SSR，并讨论其优缺点。


    **第6章**本章将向你介绍Next.js——在使用React进行SSR时，一个流行的SSR框架选择。我们将了解如何设置Next.js以及它内置的各种功能。


    **第7章**我们将在本章中探索更多高级Next.js功能，深入框架内部，并使用Next.js框架设置API端点。


    **第8章**本章介绍渐进式Web应用以及如何使用Next.js和React框架创建PWA。


    **第9章**本章涵盖React的前沿功能，以及一些关于React内部工作原理的信息。

    '
