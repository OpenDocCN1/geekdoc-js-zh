    \ of the updated value. If you pass a function, React would call that function\
    \ with the latest state variable value and then whatever that function returns\
    \ would be assigned as the latest state.\n\nA general rule of thumb is if your\
    \ state mutation involves results based on the previous state, use the functional\
    \ parameter approach; otherwise you could directly pass the new value.\n\n## useState\
    \ callback\n\nWell, in class-based components, we had a callback associated with\
    \ `this.setState` which could be used in case you wanted to wait for the state\
    \ variables to update and then trigger an action. It is not that straightforward\
    \ with hooks, however, you could make use of another hook to achieve the same\
    \ effect. Let’s take a look at that hook now.\n\n## useEffect\n\nThis hook allows\
    \ you to call a piece of code whenever something *changes*. Think of `useEffect`\
    \ as a custom watch implementation over React’s inbuilt infrastructure.\n\nHere's\
    \ a very simple example of `useEffect`:\n\n```tsx\nconst App: React.FC = props\
    \ => {\n  const [counter, setCounter] = useState(0)\n  useEffect(() => {\n   \
    \ document.title = 'Counter is at ' + counter\n  })\n  return <>\n    <p>{ counter\
    \ }</p>\n    <button onClick={() => setCounter(c => c + 1)}>Increment</button>\n\
    \  </>\n}\n```\n\nAlright, here we could see that we're making use of the `useEffect`\
    \ hook by passing a function to it. This function is executed every time React\
    \ renders (or re-renders) our component. This function eventually sets the document's\
    \ title to our counter value. And in the function, you'll always have the latest\
    \ value of the state variable. This is because React does not mutate the state\
    \ variables at all! When using functional components and hooks, React does not\
    \ mutate state ever. You could see this fairly clearly by the use of our `const`\
    \ keyword over simple string/number values too. Instead, whenever React re-renders\
    \ our component, the `useState()` function returns the newly updated state to\
    \ the state variable, and the `useEffect` function calls the passed function on\
    \ every single render.\n\n## useEffect dependencies\n\nYou could quickly see how\
    \ `useEffect` could become a little heavy on performance as it would be running\
    \ our passed function again and again on every render even when nothing has been\
    \ changed. Let's take a look at the following example:\n\n```jsx\nconst [counter1,\
    \ setCounter1] = useState(0)\nconst [counter2, setCounter2] = useState(0)\nuseEffect(()\
    \ => {\n  document.title = 'Counter is at ' + counter1\n  console.log('Effect\
    \ called')\n})\nreturn <>\n  <span>{ counter1 }</span>&nbsp;\n```"
  mdcn: "\n这里我们可以看到，我们利用TypeScript来增强React。我们没有使用`function`关键字来创建函数，而是采用了箭头函数表示法，因为目前（React中）还无法为函数添加类型注解。\n\
    \n`React.FC`或`React.FunctionalComponent`类型（TypeScript）定义了App组件，它能够接受和验证在使用该组件时传递给组件的props。此外，你可以在定义的接口中列出所有的props及其数据类型。\n\
    \n## Children\n\n一个名为`children`的特殊prop可用于React组件，它基本上包含了在自定义组件的开闭标签之间传递的所有内容。我提到的是“传递的任何东西”而非“传递的组件”，因为你实际上可以传递任何你喜欢的东西——组件、字符串、函数等等。看看下面的例子：\n\
    \n```tsx\nconst App: React.FC<{ name: string }> = props => {\n  return <div>\n\
    \    Hello {props.name}\n    <div className=\"children\">\n        {props.children}\n\
    \    </div>\n  </div>\n}\n```\n\n我们可以这样调用这个组件：\n\n```tsx\n<App name=\"Mehul\"\
    >\n  <p>Hey there!</p>\n</App>\n```\n\n这是使用`children` prop的一种方式。另一种使用方式是通过函数。看这个例子：\n\
    \n```tsx\nconst App: React.FC<{ name: string, children(one: string, two: string):\
    \ JSX.Element }> = props => {\n  return <div>\n    Hello {props.name}\n    <div\
    \ className=\"children\">\n        {props.children('one', 'two')}\n    </div>\n\
    \  </div>\n}\n```\n\n我们将这样使用这个组件：\n\n```tsx\n<App name=\"Mehul\">\n  {(one: string,\
    \ two: string) =><p>Hey there! Passed attributes: { one } { two }</p>}\n</App>\n\
    ```\n\n以下是我们在最后一个例子中所做内容的快速总结：\n\n1.  我们创建了自定义的children类型，该类型接收两个字符串参数并返回一个`JSX.Element`（即那个`<p>`标签）。\n\
    2.  在组件中，我们将`props.children`作为函数使用，并传递两个值来调用它（而不是简单地渲染它）。\n3.  父组件使用子组件传递给父组件的值来渲染子组件。这是一个将少量数据从子组件传递到父组件的巧妙技巧；通常数据是从父组件传递到子组件，但通过这种方式你可以实现反向传递。\n\
    \n事实上，我们之前所做的被称为**渲染属性（render props）**方法。它简单地指的是当一个属性（在我们的例子中是`children`）是一个函数而不是一个JSX元素或常规值时的数据传递。\n\
    \n## Hooks\n\n在React 16.8之前，仅使用函数是无法创建有状态的函数组件的。你会发现问题所在，除非像类组件一样，否则没有办法使用任何*state*对象。但随着hooks的引入，这一切都改变了。通过hooks引入state可以带来巨大的好处。函数组件现在可以*记住*它们的上下文。让我们从React中现在各种有用的hooks开始，以及如何使用它们。\n\
    \n## useState\n\n`useState` hook允许你将类组件中的`this.state`和`this.setState`功能带到函数组件中。下面是一个如何使用它们的快速示例：\n\
    \n```jsx\nfunction App() {\n  const [name, setName] = useState('Mehul')\n  return\
    \ <p>Hello {name}</p>\n}\n```\n\n让我们关注这一行`const [name, setName] = useState('Mehul')`。`useState`方法返回一个包含两个元素的数组，第一个是getter，第二个是setter。如果你只是在你的函数组件中调用`console.log(useState(\"\
    Mehul\"))`，你会看到类似这样的输出：\n\n![img](img/bf8e5efd984d24a77d8cd00bdb613e5b_43_0.png)\n\
    \n图 3.2\n\n这里，我们可以清楚地看到数组的第一个值是getter，第二个值是一个函数。当调用这个函数时，它会更新我们的setter变量，类似于调用`this.setState`所做的那样。让我们看一个简单的例子：\n\
    \n```jsx\nfunction App() {\n  const [name, setName] = useState('Mehul')\n  setTimeout(()\
    \ => {\n    setName(Math.random())\n  }, 1000)\n  return <p>Hello {name}</p>\n\
    }\n```\n\n这里，当你运行这段代码时，你会看到name每秒都会变成0到1之间的随机数。注意，使用`x`和`setX`作为getter和setter的变量名是一种约定。不过，你可以使用任何你喜欢的名字，但我建议遵循约定，因为这样更容易区分。\n\
    \n**useState不是同步的**\n\n这意味着，每当你调用`useState`时，不能保证在调用后立即使用getter就能获取到更新后的值。例如，考虑这个例子：\n\
    \n```tsx\nconst App: React.FC = props => {\n  const [currentNumber, setCurrentNumber]\
    \ = useState(Math.random())\n  function changeState() {\n    setCurrentNumber(Math.random())\n\
    \    console.log(`New number => ${currentNumber}`)\n  }\n  return <button onClick={changeState}>Click\
    \ Me { currentNumber }</button>\n}\n```\n\n以下是代码的输出：\n\n![img](img/bf8e5efd984d24a77d8cd00bdb613e5b_44_0.png)\n\
    \n![img](img/bf8e5efd984d24a77d8cd00bdb613e5b_44_1.png)\n\n**图 3.3**\n\n如果你使用这个组件，你会看到控制台输出的内容与UI中反映的不一致。这是因为`useState`是异步运行的，不会立即更新变量。\n\
    \n现在还有另一个问题，如果`setX`不是异步的，这意味着如果变量的下一个状态依赖于前一个状态，我们不能在`setX`中直接使用`x`！幸运的是，对于这种情况，React允许你在`setX`中传递一个函数，该函数的第一个参数保证是最新值。让我们看这个例子来了解更多：\n\
    \n```tsx\nconst App: React.FC = props => {\n  const [counter, setCounter] = useState(0)\n\
    \  function add() {\n    setCounter(counter => counter + 1)\n  }\n  function sub()\
    \ {\n    setCounter(counter => counter - 1)\n  }\n  return <>\n    <p>{ counter\
    \ }</p>\n    <button onClick={add}>+++</button>\n    <button onClick={sub}>---</button>\n\
    \  </>\n}\n```\n\n这里需要注意几点：\n\n1.  我们可以使用无名JSX元素（直接用`<>`和`</>`）——这不会显示在DOM结构中。\n\
    2.  我们可以在`setX`中传递一个函数，而不是直接传递更新后的值。如果你传递一个函数，React会用最新的状态变量值调用该函数，然后该函数返回的任何内容都会被赋值为最新状态。\n\
    \n一个通用的经验法则是：如果你的状态变更涉及基于前一个状态的结果，请使用函数参数方式；否则，你可以直接传递新值。\n\n## useState回调\n\n\
    在基于类的组件中，我们有一个与`this.setState`关联的回调，如果你希望等待状态变量更新然后再触发一个动作，就可以使用它。使用hooks时，情况并非如此直接，但你可以利用另一个hook来实现相同的效果。现在让我们来看看那个hook。\n\
    \n## useEffect\n\n这个hook允许你在某些东西*变化*时执行一段代码。可以把`useEffect`想象成一个基于React内置基础设施的自定义观察实现。\n\
    \n这是一个非常简单的`useEffect`示例：\n\n```tsx\nconst App: React.FC = props => {\n  const\
    \ [counter, setCounter] = useState(0)\n  useEffect(() => {\n    document.title\
    \ = 'Counter is at ' + counter\n  })\n  return <>\n    <p>{ counter }</p>\n  \
    \  <button onClick={() => setCounter(c => c + 1)}>Increment</button>\n  </>\n\
    }\n```\n\n好的，这里我们可以看到，我们通过向`useEffect`传递一个函数来使用这个hook。这个函数在React每次渲染（或重新渲染）我们的组件时都会执行。这个函数最终将文档的标题设置为我们的计数器值。并且在这个函数中，你总是能获取到状态变量的最新值。这是因为React根本没有变更状态变量！在使用函数组件和hooks时，React永远不会变更状态。通过我们在简单字符串/数字值上使用`const`关键字也能相当清楚地看到这一点。相反，每当React重新渲染我们的组件时，`useState()`函数会返回新更新的状态给状态变量，而`useEffect`函数则在每次渲染时调用传递进来的函数。\n\
    \n## useEffect依赖项\n\n你可以很快地看到`useEffect`如何可能变得对性能有些负担，因为即使什么都没改变，它也会一遍又一遍地运行我们传递的函数。让我们看看下面的例子：\n\
    \n```jsx\nconst [counter1, setCounter1] = useState(0)\nconst [counter2, setCounter2]\
    \ = useState(0)\nuseEffect(() => {\n  document.title = 'Counter is at ' + counter1\n\
    \  console.log('Effect called')\n})\nreturn <>\n  <span>{ counter1 }</span>&nbsp;\n\
    ```\n"
