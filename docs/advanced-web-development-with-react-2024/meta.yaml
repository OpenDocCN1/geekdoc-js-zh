- md: "## Hello, this is homepage! Go to [About](/about)\n\nNow, when you visit the\
    \ homepage and click on the about link, it would not reload the page like before\
    \ and navigate you without reloading to the /about page route. Similarly, if you\
    \ land directly to /about page, the server would fetch you the contents of only\
    \ /about page, and that is again, visible to you in the source code.\n\nThat's\
    \ server-side rendering for you!\n\n## Fetching data\n\nAlthough SSR with react\
    \ is great, oftentimes you'll face difficulties with certain things because some\
    \ things are only available in the browser environment and some things are only\
    \ available in the node environment. One of those things is how to fetch data.\n\
    \nLet's make use of the package called isomorphic-fetch which allows us to use\
    \ fetch in both the environments:\n\n```\nnpm install isomorphic-fetch --save\n\
    ```\n\nNow, let's modify our Home.js file to look something like this:\n\n```\n\
    // Home.js\nconst React = require('react')\nconst { Link } = require('react-router-dom')\n\
    require('isomorphic-fetch')\nconst { useEffect, useState } = React\nfunction Home(props)\
    \ {\n  const [data, setData] = useState(null)\n  useEffect(() => {\n    fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
    \ => data.json())\n    .then(data => setData(data))\n  }, [])\n  if(!data) return\
    \ <p>Loading...</p>\n  return <div className=\"home\">\n    <h2>{data.title}</h2>\n\
    \    <p>{data.body}</p>\n    <Link to=\"/about\">About</Link>\n  </div>\n}\nmodule.exports\
    \ = Home\n```\n\nNotice here; we're using hooks. Since the useEffect hook runs\
    \ after the component is mounted, the code inside it is not executed on the server\
    \ anyway. So we could've just used fetch without the isomorphic-fetch library,\
    \ but still, we'll keep using it for now.\nThen we finally grab the data and display\
    \ it on the client-side:\n\n![Client-side data fetching](img/bf8e5efd984d24a77d8cd00bdb613e5b_101_0.png)\n\
    \nThe preceding screenshot shows how we're fetching the data on the client-side.\
    \ So far, it looks good too. But can we do even better? How about fetching the\
    \ data on the server side (in the Node environment) itself and then sending it\
    \ to the client? Servers are powerful computers and can implement strong caching\
    \ for commonly used resources, and could speed up things a lot. However, it starts\
    \ becoming a pain with syncing server-side state and client-side state, as we'll\
    \ see now.\n\n## Fetching data on the server\n\nSo the idea is that we'll expose\
    \ whatever data a particular component wants through a property, and then we'll\
    \ resolve all the promises and data fetching before we actually render the JSX\
    \ to string. Finally, we'll somehow sync up the state and react code. Let's see\
    \ how we would do this briefly. Let us see the updated Home.js file. Bear with\
    \ me for a moment:\n\n```\n// Home.js\nconst React = require('react')\nconst {\
    \ Link } = require('react-router-dom')\nrequire('isomorphic-fetch')\nconst { useEffect,\
    \ useState } = React\nfunction Home(props) {\n  const [data, setData] =\n    useState(process.env.BROWSER\
    \ && window.componentsData[Home.name])\n  useEffect(() => {\n    if(!data) {\n\
    \      fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\n     \
    \   => data.json())\n        .then(data => setData(data))\n    }\n  }, [])\n \
    \ if(!data) return <p>Loading...</p>\n  return <div className=\"home\">\n    <h1>This\
    \ is home page</h1>\n    <h2>{data.title}</h2>\n    <p>{data.body}</p>\n    <Link\
    \ to=\"/about\">About</Link>\n  </div>\n}\nHome.asyncData = 'https://jsonplaceholder.typicode.com/posts/1'\n\
    module.exports = Home\n```\n\nLet's understand what the preceding code does with\
    \ the following points:\n\n- Alright. So here, we've added some checks if the\
    \ data is already available with us or not.\n- We, first of all, check whether\
    \ we're in the browser environment or not using process.env.BROWSER (we'll configure\
    \ this in webpack soon).\n- If the browser, we want to load the state from the\
    \ global window object (we would set this up).\n- Home.name gives us \"Home\"\
    , that is, the name of the function.\n\nWe've also added asyncData property to\
    \ the Home component, which we'll use later to pre-fetch data on the server.\n\
    Let's update the About.js file as well:\n\n```\nconst React = require('react')\n\
    const { Link } = require('react-router-dom')\nconst { useState, useEffect } =\
