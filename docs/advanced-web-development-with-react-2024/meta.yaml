    \ doesn’t serve anything yet.\n\n### Next.js defaults\n\nAt this point, we’ve\
    \ `Next.js` set up correctly and running. With `Next.js`, to avoid messing around\
    \ with a lot of configuration in the beginning, `Next.js` locks down certain default\
    \ configuration. Let’s look at them one by one.\n\n### Pages\n\nWe created the\
    \ pages folder above. That folder is just not a random name I gave from my side.\
    \ Whatever filename you create inside that folder; it is created as a route in\
    \ your application! Let’s start with simple `index.js` page, which is the root\
    \ page of the application:\n\nIn the `pages/index.js` file, let’s write the following\
