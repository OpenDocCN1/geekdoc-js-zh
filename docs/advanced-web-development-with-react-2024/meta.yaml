    \      background: #2ecc71;\n      width: 100%;\n      cursor: pointer;\n    \
    \  padding: 5px 0;\n      color: white;\n      border-radius: 4px;\n      border:\
    \ #27ae60 1px solid;\n      margin-top: 20px;\n      font-weight: 800;\n     \
    \ font-size: 0.8em;\n    }\n    .btn:hover {\n      background: #2CC06B;\n   \
    \ }\n```\n\n注意，我正在从不同的文件导入 styles.css，因此我们还需要在项目根目录中创建一个自定义的 next.config.js 文件（如上一章所述）：\n\
    \n```\n// next.config.js\nconst withCSS = require('@zeit/next-css')\nmodule.exports\
    \ = withCSS({})\n```\n\n并且安装 @zeit/next-css npm 模块：\n\n```\nnpm i @zeit/next-css\
    \ -S\n```\n\n完成后，别忘了重启服务器。\n\n这将为我们提供以下漂亮的输出：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_137_0.png)\n\
    \n*图 7.4*\n\n上面的截图显示了我们上面创建的登录表单的输出。\n\n注意我们现在如何使用 useState hook 来管理这个组件的用户名和密码。这是正确的做法，因为我们不需要将这个组件的本地状态存储到\
    \ redux 存储中。让我们继续。\n\n现在我们将在 Next.js 中设置一个快速后端来接收登录并处理它。\n\n## 使用 Next.js 的 API\n\
