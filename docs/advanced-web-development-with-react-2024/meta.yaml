    ## Progressive Web Apps


    In the last chapter, we learned about Next.js technology and how it is powering
    the SSR world of React today. When web apps meet native apps, a different type
    of application is born, which is Progressive Web App. We’ll learn all about PWAs
    in this chapter and see how to create one using React as our primary frontend
    library.


    # ### Structure


    +   - What is **Progressive Web App (PWA)**

    - Getting started with PWA

    - manifest.json File

    - Service workers

    - PWA using Next.js

    - Custom server with Next.js


    # ### Objective


    In this chapter, our main aim would be to understand what progressive web apps
    are and how to set them up with our React and Next.js projects. Along the way,
    we’ll learn more about these technologies.


    # ### What is a progressive web app?


    A progressive web app is a web app eventually, but a bit better. It uses modern
    web features to deliver great user experience, similar to the one you’ll experience
    using a native app. Some features of a progressive web app:


    +   1. Responsive: Obviously, your app should be fit for all screens and sizes,
    and fortunately, these days creating a responsive site (or converting an'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'existing site to responsive design) is not very hard unless the code is very
    old.


    +   2. Independent of the internet: Your PWA would be working with something called
    service workers (more on this later) which enables them to work offline or on
    low-speed internet connections.


    +   3. HTTPS: PWA works on HTTPS only.


    +   4. Installable: Your PWA can be installed as a regular app on phones (and
    as a chrome browser app).


    +   5. Linkable: Can be shared with a simple URL


