  mdcn: "\n## 1. React 入门\n\nJavaScript：它是网络的编程语言。自网络诞生以来，开发者们就渴望在交互性、动画、效果和稳定性方面为终端用户提供越来越好的体验。JavaScript让这一切成为可能。随着它的发展，由于一些显而易见的原因，为了更快的开发和更好的稳定性，引入框架和库变得很有必要。\n\
    \nReact是这个生态系统的一部分。React将自己定位为“一个用于构建用户界面的JavaScript库”。但老实说，尽管这句话是正确的，我们认为React远不止于此。它可以被构建成一个完整的生态系统，为一些最复杂的网络应用程序系统提供动力，例如Facebook。\n\
    \n我们将快速浏览React的基础知识，然后从入门到高级主题，这将真正让你领会React的精髓，并最终帮助你开始使用React编写生产就绪的应用程序。\n\n\
    简单来说，React是一个**用户界面（UI）**库。让我们分解一下：\n\n1.  React本身声明它是一个库，这意味着它不会试图将所有东西都打包在一起。相反，你可以选择在你的项目中挑选你需要的东西并加以实现。\n\
    2.  React说它是一个UI库，用于构建用户可见的界面。这是什么意思？简单来说，就是创建和维护用户在屏幕上看到的内容。\n\n## 结构\n\n- 引言\n\
    - 理解React\n- 基本理解React如何作为UI库工作\n- 声明式编程与命令式编程\n- React后续主题的速查表\n\n## 目标\n\n在本章中，我们将理解React具体在做什么，以及为什么应该关注它。我们将从表面了解它如何作为UI库工作，以及React的声明式方法在创建更好的UI系统方面为何如此强大。最后，我们将开始React编程，但会在章节末尾提供一些笔记，这些笔记作为JavaScript复习可能会很方便。\n\
    \n## React是基于组件的\n\nReact使用*组件*。其理念很简单——React认为，与其把所有东西都写在同一个地方（就像我们编写简单的HTML页面时通常做的那样），不如将页面的不同（通常是独立的）部分拆分成不同的组件。这成倍地增加了代码的可维护性，让开发者能够拥有更快、更干净的代码库。我们将有专门的章节来讨论组件的使用，因为它是React的核心。\n\
    \n## React是声明式的\n\n我们将主要关注两种编程范式——声明式编程和命令式编程。让我们从一个简单的例子开始。\n\n当你编写代码时，你可以指定：\n\
    \n1.  你想做什么？\n2.  你想怎么做？\n\n如果你同时指定了两者，你就是在使用命令式编程实践。如果你只指定了你想做什么，那么你就在使用声明式编程方式。这里有一个简单的例子。\n\
    \n假设你想在一个盒子周围画一个边框。在CSS中，你只需说`border: 2px solid black`。这是声明式的。你只说了你想做什么，而不是你想怎么做。另一方面，如果你尝试在原生JavaScript中绘制边框，你必须指定四个坐标，然后使用代码手动绘制线条。这将是命令式的方式。\n\
    \n声明式编程有其优缺点，但优点几乎总是超过缺点：\n\n1.  声明式代码可以使用高度优化的算法。由于“如何做”对终端用户是抽象的，声明式代码下的命令式模型可以使用非常复杂的代码来提供主要的性能提升，同时为用户暴露一个简单的声明式接口来使用相同的功能。\n\
    2.  声明式编程带来了其他好处，如代码可扩展性、减少错误和更易于理解的代码。\n\n回到React，它是**声明式的**。这意味着你只需告诉React你“想要做什么”，而不是“想要怎么做”。React在底层以高度优化的方式为你管理一切。\n\
    \n我们将在最后一章详细讨论React虚拟DOM、协调以及其他可选的高级功能在底层是如何工作的。\n\n## 快速JS复习\n\n在我们深入React生态系统之前，我们想列出一些在处理React时你绝对应该了解的快速JS知识点。现在让我们快速浏览这一部分，稍后根据需要再回来。\n\
    \n## this\n\n在JavaScript中，`this`对很多人来说出人意料地复杂。请记住，在一个函数中，`this`总是指向该函数被调用的方式，箭头函数除外，其中`this`是词法作用域：\n\
    \n```javascript\nfunction myName() {\n  return this.myname\n}\n```\n\n## 2. 设置React\n\
