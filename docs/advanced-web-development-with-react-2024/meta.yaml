- md: "## useEffect cleanup\n\nThe hook useEffect provides you with an option to clean\
    \ up any subscription you want to get rid of before either the component is unmounted\
    \ or it is re-rendered, and the useEffect is called again. That being said, in\
    \ the preceding example, you could call a function when the new component state\
    \ is rendered using useEffect cleanup function. Let’s take a look at an example\
    \ to understand it in a better way:\n\n```javascript\nconst App: React.FC = props\
    \ => {\n  const [counter, setCounter] = useState(0)\n  useEffect(() => {\n   \
    \ document.title = 'Counter is at ' + counter\n    return function cleanup() {\n\
    \      console.log('This will fire whenever this function gets called next/the\
    \ component unmounts. Counter is ${counter} right now')\n    }\n  }, [counter])\n\
    \  return <>\n    <span>{ counter }</span>\n  </>\n}\n```\n\n```javascript\n<button\
    \ onClick={() => setCounter(c => c + 1)}>Increment Counter</button>\n</>\n}\n\
    ```\n\nWhen running this code initially, we would see nothing in the console,\
    \ like the following:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_49_0.png)\n\n\
    But once I click on the **Increment** counter, something interesting would show\
    \ up in the console:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_50_0.png)\n\n\
    *Figure 3.7*\n\nAlright! We see that on the screen, the counter is actually 1.\
    \ But in the console, we receive the log with the counter value of 0. Did we miss\
    \ something? Is this a bug? Actually no, this is expected behaviour.\n\nWell,\
    \ you could see that the purpose of the cleanup function is to remove anything\
    \ you want to get rid of before the *new instance* of that thing is created. Hence,\
    \ React needs to call the cleanup function of the older useEffect function so\
    \ that it could access the old subscription variable and that environment. React\
    \ obviously should not fire the cleanup function of the latest useEffect function\
    \ because well, it does not require a cleanup yet, does it?\n\n## useCallback\n\
    \nRemember how we passed a dependency array in useEffect hook to let React know\
    \ about the variables we cared about? This let React not to run the effect functions\
    \ again and again when they were not required. But what about the functions you\
    \ call inside the useEffect function itself? It is easy to miss things like these:\n\
    \n```javascript\nconst [result, setResult] = useState(null)\nconst [url, setUrl]\
    \ = useState(null)\nasync function someAsyncOperation() {\n    // some more code\n\
    \    return await fetch(url)\n}\n```\n\n```javascript\nuseEffect(() => {\n  //\
    \ some long code....\nsomeAsyncOperation().then(r => {\nsetResult(r)\n  })\n},\
    \ [])\n```\n\nOops! Can you point out the problem in the code snippet that might\
    \ occur? You see, although looking at the effect function it seems like no dependency\
    \ is required (well, because we’re not using any state variable directly, upon\
    \ closely looking we could see that we’re actually using the state variable `url`\
    \ inside the `someAsyncOperation` function! That means, if somewhere `setResult`\
    \ was called, the effect function would not re-run hence not re-fetch the URL\
    \ and hence would produce a buggy output.\n\nThis could happen and is usually\
    \ hard to notice as your codebase grows. So how to ensure that you don’t miss\
    \ adding the dependency in the `useEffect` hook? You don’t. You pass the function\
    \ as a dependency because it makes more sense that way! You see, the behaviour\
    \ of the actual function `someAsyncOperation` changes due to the change in the\
    \ state `url` variable, and hence it should be the one which should be added as\
    \ a dependency. Not only this simplifies things but seems more logical.\n\nHowever,\
    \ there’s no way React could compare a function with the previous version without\
    \ actually executing it and seeing the result, but once you execute the function\
    \ anyway, there’s no point in going back. Remember how we solved this similar\
    \ issue in `useEffect`? Yes, dependencies array to the rescue! But how do we specify\
    \ a dependency array for a standalone function?\n\nHere, you could use a new hook\
    \ called `useCallback`. This hook would allow you to create memorized functions\
    \ which would only change its identity if the dependency array passed to it changes.\
    \ Here’s the same example from above but this time with a memorized function:\n\
    \n```javascript\nconst someAsyncOperation = useCallback(async () => {\n  // some\
    \ more code\n  return await fetch(url)\n}, [url])\nuseEffect(() => {\n  // some\
    \ long code....\nsomeAsyncOperation().then(r => {\nsetResult(r)\n})\n}, [someAsyncOperation])\n\
    ```\n\nHere, we could see that we're now passing someAsyncOperation as the dependency\
    \ of the main side effect function, and we're passing url as the dependency of\
    \ the someAsyncOperation function itself. This keeps things in order and allows\
    \ you to write readable and clean code.\n\nReact has a bunch of more inbuilt hooks\
    \ which we'll take a look at eventually as we proceed in the coming chapters.\n\
    \n## Custom hooks\n\nNow that we have a working knowledge of React hooks and how\
    \ they work under the hood, it is fairly simple to create simple custom hooks\
    \ for your own use case. Let's start with a simple example. Remember we talked\
    \ about how useState doesn't provide a callback function when the state is updated?\
    \ Let's implement that as a custom hook.\n\n```javascript\nimport { useState,\
    \ useEffect } from 'react'\nconst useStateCB = (initState: any, cb: Function)\
    \ => {\n  const [state, setState] = useState(initState)\n  useEffect(() => cb(state),\
    \ [state])\n  return [state, setState]\n}\nexport default useStateCB\n```\n\n\
    We could create something like the above in a file called useStateCB.ts and import\
    \ this hook anywhere and use it! So how does it work?\n\nWhen you call useStateCB(\"\
    test\", updatedState => console.log(updateState)), what you're doing is you're\
    \ setting up two hooks - the original useState hook and the useEffect hook. The\
    \ useEffect hook is used to keep a watch over our useState hook, and once the\
    \ state changes we call the pass callback function with the new state. Because\
    \ remember? The useEffect hook always runs with the latest state value once per\
    \ render. In this way, you can tailor custom hooks to your needs using some basic\
    \ fundamental hooks.\n\n## Class components\n\nHere’s a quick example of a class\
    \ based component written in TypeScript + React:\n\n```javascript\nimport React\
    \ from 'react'\nimport ReactDOM from 'react-dom'\nclass App extends React.Component<{},\
    \ {}> {\n  render() {\n    return <p>Hello World</p>\n  }\n}\nReactDOM.render(<App\
    \ />, document.getElementById('root'))\n```\n\nHere, we create a component named\
    \ App which extends the class React.Component. Upon looking, you’d find that React.Component\
    \ class provides a lot of useful features which enables us to use lifecycle methods\
    \ and state inside class based components. We could specify the types of our props\
    \ and types of our state here <{}, {}>.\n\n## Props\n\nWe discussed in functional\
    \ components about props and how they’re simply a small piece of data that a component\
    \ could pass on to its children and how it could define itself as well. Here’s\
    \ another example which receives a prop:\n\n```javascript\nclass App extends React.Component<{\
    \ prop1: string }, {}> {\n  render() {\n    return <p>Hello World. Prop1 says\
    \ {this.props.prop1}</p>\n  }\n}\nReactDOM.render(<App prop1=\"something\" />,\
    \ document.getElementById('root'))\n```\n\nWe specified the types of props which\
    \ we could receive using TypeScript and then we passed prop1 when rendering the\
    \ component. Finally, we accessed the passed prop using this.props object. The\
    \ this.props object is populated by React with the keys being the names of props\
    \ and values being the value passed with them. Just like in the functional way,\
    \ you could pass anything, even functions, as props as JavaScript has first class\
    \ functions.\n\nAdditionally, we see that we have a method called render which\
    \ is responsible for what the UI is displayed by React. No matter what you do\
    \ in a class based"
  mdcn: "\n## useEffect 清理机制\n\n`useEffect` 这个钩子为你提供了一个选项，用于在组件卸载或重新渲染（即 `useEffect`\
    \ 再次被调用）之前，清理任何你想要移除的订阅。也就是说，在前面的例子中，你可以使用 `useEffect` 的清理函数，在组件的新状态渲染时调用一个函数。让我们通过一个例子来更好地理解：\n\
    \n```javascript\nconst App: React.FC = props => {\n  const [counter, setCounter]\
    \ = useState(0)\n  useEffect(() => {\n    document.title = 'Counter is at ' +\
    \ counter\n    return function cleanup() {\n      console.log('This will fire\
    \ whenever this function gets called next/the component unmounts. Counter is ${counter}\
    \ right now')\n    }\n  }, [counter])\n  return <>\n    <span>{ counter }</span>\n\
    \  </>\n}\n```\n\n```javascript\n<button onClick={() => setCounter(c => c + 1)}>Increment\
    \ Counter</button>\n</>\n}\n```\n\n初次运行这段代码时，控制台里不会显示任何东西，如下图所示：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_49_0.png)\n\
    \n但是，一旦我点击了 **Increment**（增加）按钮，控制台里就会出现一些有趣的内容：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_50_0.png)\n\
    \n*图 3.7*\n\n好的！我们看到屏幕上显示的计数器实际上是 1。但在控制台中，我们收到的日志显示的计数值是 0。我们是不是漏掉了什么？这是一个 bug\
    \ 吗？实际上不是，这是预期的行为。\n\n你可以看到，清理函数的目的就是在该事物的*新实例*被创建之前，移除任何你想要移除的东西。因此，React 需要调用旧\
    \ `useEffect` 函数的清理函数，以便它能够访问到旧的订阅变量和那个环境。React 显然不应该触发最新 `useEffect` 函数的清理函数，因为它还不需要清理，对吧？\n\
    \n## useCallback\n\n还记得我们在 `useEffect` 钩子中是如何传递依赖数组，以告知 React 我们关心哪些变量的吗？这让 React\
    \ 在不需要时不会反复运行 effect 函数。但是，对于那些在 `useEffect` 函数内部调用的函数呢？像这样的问题很容易被忽略：\n\n```javascript\n\
    const [result, setResult] = useState(null)\nconst [url, setUrl] = useState(null)\n\
    async function someAsyncOperation() {\n    // some more code\n    return await\
    \ fetch(url)\n}\n```\n\n```javascript\nuseEffect(() => {\n  // some long code....\n\
    someAsyncOperation().then(r => {\nsetResult(r)\n  })\n}, [])\n```\n\n哎呀！你能指出代码片段中可能出现的问题吗？你看，虽然从\
    \ effect 函数表面看似乎不需要任何依赖（因为我们没有直接使用任何状态变量），但仔细观察就会发现，我们实际上是在 `someAsyncOperation`\
    \ 函数内部使用了状态变量 `url`！这意味着，如果在其他地方调用了 `setResult`，effect 函数不会重新运行，因此不会重新获取 URL，从而导致输出出错。\n\
    \n这种情况确实会发生，而且随着代码库的增长，通常很难察觉。那么，如何确保你没有遗漏在 `useEffect` 钩子中添加依赖项呢？你不用费心去检查。你应该将函数作为依赖项传递，因为这样更有意义！你看，`someAsyncOperation`\
    \ 这个实际函数的行为是由于状态 `url` 变量的改变而改变的，因此它才是应该作为依赖项添加的那个。这不仅使事情简化，而且看起来更合乎逻辑。\n\n然而，React\
    \ 无法在不实际执行函数并查看结果的情况下，将一个函数与其先前版本进行比较，但一旦你执行了函数，就没有回头路了。还记得我们之前是如何在 `useEffect`\
    \ 中解决类似问题的吗？是的，依赖数组来救援！但是，我们如何为一个独立的函数指定依赖数组呢？\n\n这里，你可以使用一个名为 `useCallback` 的新钩子。这个钩子允许你创建记忆化的函数，该函数只有在传递给它的依赖数组发生变化时才会改变其标识。以下是上面同一个例子，但这次使用了记忆化函数：\n\
    \n```javascript\nconst someAsyncOperation = useCallback(async () => {\n  // some\
    \ more code\n  return await fetch(url)\n}, [url])\nuseEffect(() => {\n  // some\
    \ long code....\nsomeAsyncOperation().then(r => {\nsetResult(r)\n})\n}, [someAsyncOperation])\n\
    ```\n\n在这里，我们可以看到现在将 `someAsyncOperation` 作为主 side effect 函数的依赖项传递，并将 `url` 作为\
    \ `someAsyncOperation` 函数自身的依赖项传递。这使得事物保持有序，并允许你编写可读且清晰的代码。\n\nReact 还有更多内置的钩子，我们将在后续章节中逐步了解。\n\
    \n## 自定义钩子\n\n既然我们已经掌握了 React 钩子的工作原理及其底层机制，为自己的用例创建简单的自定义钩子就相当简单了。让我们从一个简单的例子开始。还记得我们讨论过\
    \ `useState` 在状态更新时不提供回调函数吗？让我们将其作为一个自定义钩子来实现。\n\n```javascript\nimport { useState,\
    \ useEffect } from 'react'\nconst useStateCB = (initState: any, cb: Function)\
    \ => {\n  const [state, setState] = useState(initState)\n  useEffect(() => cb(state),\
    \ [state])\n  return [state, setState]\n}\nexport default useStateCB\n```\n\n\
    我们可以在一个名为 `useStateCB.ts` 的文件中创建类似上面的代码，然后在任何地方导入并使用这个钩子！那么它是如何工作的呢？\n\n当你调用 `useStateCB(\"\
    test\", updatedState => console.log(updateState))` 时，你实际上设置了两个钩子——原始的 `useState`\
    \ 钩子和 `useEffect` 钩子。`useEffect` 钩子用于监视我们的 `useState` 钩子，一旦状态发生变化，我们就用新的状态调用传入的回调函数。还记得吗？`useEffect`\
    \ 钩子总是使用最新的状态值运行，并且在每次渲染时只运行一次。通过这种方式，你可以使用一些基本的钩子来定制满足你需求的自定义钩子。\n\n## 类组件\n\n\
    这是一个用 TypeScript + React 编写的基于类组件的简单示例：\n\n```javascript\nimport React from 'react'\n\
    import ReactDOM from 'react-dom'\nclass App extends React.Component<{}, {}> {\n\
    \  render() {\n    return <p>Hello World</p>\n  }\n}\nReactDOM.render(<App />,\
    \ document.getElementById('root'))\n```\n\n在这里，我们创建了一个名为 `App` 的组件，它继承自 `React.Component`\
    \ 类。仔细观察，你会发现 `React.Component` 类提供了许多有用的功能，使我们能够在基于类的组件中使用生命周期方法和状态。我们可以在这里 `<{},\
    \ {}>` 中指定我们 props 的类型和 state 的类型。\n\n## Props\n\n我们在函数组件中讨论过 props，它们仅仅是一小片数据，组件可以将其传递给子组件，也可以用于定义自身。下面是另一个接收\
    \ prop 的例子：\n\n```javascript\nclass App extends React.Component<{ prop1: string\
    \ }, {}> {\n  render() {\n    return <p>Hello World. Prop1 says {this.props.prop1}</p>\n\
    \  }\n}\nReactDOM.render(<App prop1=\"something\" />, document.getElementById('root'))\n\
    ```\n\n我们使用 TypeScript 指定了可以接收的 props 类型，然后在渲染组件时传递了 `prop1`。最后，我们通过 `this.props`\
    \ 对象访问传递的 prop。`this.props` 对象由 React 填充，其中键是 prop 的名称，值是传递的值。就像在函数方式中一样，你可以传递任何东西，甚至是函数作为\
    \ props，因为 JavaScript 中函数是一等公民。\n\n此外，我们看到有一个名为 `render` 的方法，它负责 React 显示的内容。无论你在基于类的组件中做什么，\n"
