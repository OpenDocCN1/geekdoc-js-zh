    # Why Next.js?


    From their official site, here are some points explaining why it is a good choice:


    +   1. Server Rendering: This is the main reason for using Next.js.

    2. Static Export: This means that you could generate a static bundle of your website
    (not possible in every case) if you want within a few clicks and commands.

    3. CSS-in-JS: CSS in JS is a popular technique in which people write styles directly
    in JS. Some people frown upon the practice, but more or less, the community appreciates
    it and has developed numerous solutions around it. Next.js supports all of them

    4. Zero setup: It is as simple as create-react-app when setting it up. We’ll be
    up and ready with our Hello World with Next.js within a few minutes.

    5. Fully extensible: You can control the babel and webpack configuration. And
    once you’re able to control that, you can pretty much control every fine detail
    of your project.

    6. Ready for production: It is an open-source and highly optimized framework which
    is quite mature now for creating production-ready apps with React.


    These are some of the many reasons you could go with Next.js if you’re willing
    to opt into an SSR solution using React.


    # Installation


    Let’s begin by setting up Next.js for our project.


    +   1. Create a directory named react-ssr-next

    2. Using the command line, cd into that directory

    3. Run the following commands:


    ```

    npm init -y

    npm install react react-dom next --save

    ```'
