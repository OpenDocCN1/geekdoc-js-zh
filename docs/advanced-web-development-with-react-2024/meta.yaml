    # Communication between components


    If you think about it, managing application state is roughly another way of saying
    effective communication of some information among a lot of components.


    Although you could have a local state in components, things get tricky when you
    want to communicate between components, especially when it is up the component
    hierarchy or even be very far relatives in the tree. This happens all the time.
    Consider you logout from a website using a link in the content area, this information
    should be dispatched to the header, which is a completely different component,
    so that header could update the links back to the ones to be shown to an unauthenticated
    user.


    Let’s see some common ways we’ll learn in this chapter to communicate between
    the components:


    +   - Props (parent to child data flow)

    - Refs (Calling child methods from a parent)

    - Context API

    - Redux (Centralized state) (in later chapters)


    It is interesting to note that with a slight trick, it is possible to use Context
    API to have two-way communication, however redux is truly decoupled and centralized
    state store. Redux is the go-to choice for intermediate to advanced applications
    because of its unidirectional data flow (careful! This doesn’t mean that it can
    only communicate in one way), centralized state share and great debugging tools.
    Let’s take a look at props first.


