    \ the user data. We’ll fix that later.\n\nLet’s look at nested routing first.\n\
    \n## Nested routes\n\nLet’s start with a simple use case. We’ve created top-level\
    \ paths (that is, `/home` or `/about`, and so on) but how about `/home/page-x`?\
    \ Well, it turns out that in Next.js it is as simple as nesting folders inside\
    \ one another. Let’s create the following file:\n\n`pages/path1/path2/path3.tsx`\n\
    \nAnd write the following code inside it:\n\n```jsx\nimport React from 'react'\n\
    import { NextPage } from 'next'\n\nconst PathPage: NextPage = () => {\n  return\
    \ (\n    <h1>Hello from very deep inside!</h1>\n  )\n}\n\nexport default PathPage\n\
    ```\n\nLet the server apply changes, and when you visit http://localhost:3000/path1/path2/path3,\
    \ you should be able to see the following:\n\n![Figure 7.13](img/bf8e5efd984d24a77d8cd00bdb613e5b_157_0.png)\n\
    \nThe preceding screenshot shows an example of nesting routing in the browser.\n\
    \nAnother thing you should know about is that you can create `path3` as the folder\
    \ and place the preceding code in `path3/index.tsx` and it would work just the\
    \ same. With Next.js 9+, we also have support for dynamic routing. Let’s see what\
    \ it is and how it can work.\n\n## Dynamic routing\n\nNext.js has recently introduced\
    \ dynamic routing, which opens doors for matching a whole lot of URLs instead\
    \ of just static routes which we’ve been doing so far with the `pages` directory.\
    \ Let’s create a file called `users/index.tsx` inside the `pages/` directory.\
    \ We would also create a file called `users/[param].tsx`. Here’s the code for\
