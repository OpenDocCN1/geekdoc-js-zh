    \ somewhere:\n\n```\nnavigator.serviceWorker.register(\"/service-worker.js\",\n\
    {scope:\"/\"}).then...\n```\n\nNow, just like we did with the above react app,\
    \ we need to serve our `service-worker.js` file. Don’t worry, we don’t have to\
    \ code it ourselves as it is again, created by Next automatically! But we surely\
    \ need to serve it on `/service-worker.js` URL, and you know, in Next, static\
    \ files are served under the static directory.\n\nNow, although we can move our\
    \ service worker file in the static directory and change the path of service worker\
    \ using the configuration above, we’ll go ahead and try to redirect all requests\
    \ coming to `/service-worker.js` to the file on our filesystem and let Next handle\
    \ rest of the requests by creating a custom server.\n\n### Custom Next.js Server\n\
    \nCreate a file called `server.js` in the root of project and write the following\
    \ contents inside it:\n\n```\nconst { createServer } = require('http')\nconst\
    \ { join } = require('path')\nconst { parse } = require('url')\nconst next = require('next')\n\
    const app = next({ dev: process.env.NODE_ENV !== 'production' })\nconst handle\
    \ = app.getRequestHandler()\napp.prepare()\n  .then(() => {\n    createServer((req,\
    \ res) => {\n      const parsedUrl = parse(req.url, true)\n      const { pathname\
    \ } = parsedUrl\n```"
