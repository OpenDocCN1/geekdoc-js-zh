  - '[PAGE 86]


    # What is Server-Side Rendering?


    As the name says, you are rendering the page on the server and delivering it to
    the client, instead of letting the client (browser) render the page itself using
    JavaScript you wrote. Server-Side Rendering takes one step from the client back
    into the server, that is, parsing the React code logic. In its very essence, SSR
    means the backend is doing most of the job and delivering the pages to the frontend,
    instead of the client making heavy use of JS for routing and state management.
    That was how applications using PHP used to work back in the days. But with enhancement
    in JS standards and better-performing devices and smartphones, client-side rendering
    is becoming much more popular these days.


    # Why Server Side Rendering?


    If client-side rendering is so good, why are we considering server-side rendering
    in the 2020 decade? Well, SSR has its own benefits which cannot be ignored, some
    of them includes:


    +   1. SEO: Search engines love reading HTML markup and making sense of the page
    out of that. Most of the search engines, except advanced ones like Google, cannot
    really interpret a lot of JavaScript and hence have to rely heavily on what your
    “source code” says. And since for client-side websites, source code doesn’t say
    anything at all, the search engines are not able to index your site which impacts
    your rankings.

    2. Performance: There is an obvious boost in performance when you’re using SSR.
    Since SSR involves rendering a page already before delivering, you don’t have
    to worry about different browser support, different device support APIs, etc.
    in your JS code, because most of them never get delivered anyway.


    Hence, for compatibility reasons with search engines, it is most important to
    have SSR implemented, so that you can get the best of both worlds.


    # Starting with SSR


    SSR with React is tricky without any framework. But still, we would begin with
    that just so that we know what happens under the hood when we’re working with
    other frameworks. Before starting off, we’ll focus on one special thing in React,
    ReactDOM.'
