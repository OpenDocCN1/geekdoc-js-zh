    \ screenshot shows what the file structure should look like at this moment.\n\
    Now you’ll see that we’re able to reuse the Header component on both the pages\
    \ (About and Home).\nAlso, note that, as said above, components are just a choice,\
    \ you could name this folder anything you like and still use it (as we’re using\
    \ a relative path to address the folder).\n\n## Next.js + CSS\n\nThere are a bunch\
    \ of ways to use CSS with the Next.js framework, and you would always use CSS\
    \ in applications these days. Let’s explore some of the common ways to do that.\n\
    \n## Styled JSX\n\nThis method requires you to write your CSS directly in the\
    \ JSX template. Let’s look at an example first. Let’s modify our Header component\
    \ to include some styles:\n\n```javascript\n// Header.js\nimport Link from 'next/link'\n\
    const Header = () => (\n<header>\n<style jsx>{`\nheader {\npadding: 20px;\nbackground:\
    \ #1e1e1e;\nborder-bottom: 1px solid black;\nfont-size: 30px;\n}\na {\ncolor:\
    \ white;\nmargin-right: 30px;\n}\n`}</style>\n<Link href=\"/\">\n<a>Home</a>\n\
    </Link>\n<Link href=\"/about\">\n<a>About</a>\n</Link>\n</header>\n)\nexport default\
    \ Header\n```\n\nThis generates the following mockup:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_122_0.png)\n\
    \nFigure 6.8\n\nJust like the code describes, the preceding screenshot shows the\
    \ output we expected.\nNow, let's look at the rendered HTML. When you see that,\
    \ you'll see something like this:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_123_0.png)\n\
    \nThe preceding screenshot shows us the output DOM tree from the Chrome DevTools.\n\
    See that even though we didn't assign any class to our header/anchor elements,\
    \ Next.js did that itself for us to locally scope the styles. This way, even if\
    \ you have the same elements in different components, you can style them differently\
    \ without worrying about style conflicts. This is extremely useful when you're\
    \ targeting elements directly either through their tag names or through some use\
    \ of very common classes (like “container”, “block”, and so on).\nBut what about\
    \ the cases where you actually want to target global? For example, writing the\
    \ same styles in the top file for it to have effects globally? For that, we could\
    \ include the global attribute. Check the following example:\n\n```javascript\n\
    import Link from 'next/link'\nconst Header = () => (\n<header>\n<style jsx global>{`\n\
    header {\npadding: 20px;\nbackground: #1e1e1e;\nborder-bottom: 1px solid black;\n\
    font-size: 30px;\n}\na {\ncolor: white;\nmargin-right: 30px;\n}\n`}</style>\n\
    <nav>\n<Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\">\n<a>About</a>\n\
    </Link>\n</nav>\n</header>\n)\nexport default Header\n```\n\nThis is exactly the\
    \ same example as above with the exception that now we have a global attribute\
    \ in the style tag. Although the HTML part would still include syntax for custom\
    \ scoping, the CSS part is now truly global, as you can see in the rendered output:\n\
    \n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_124_0.png)\n\nThe preceding screenshot\
    \ shows how the anchor tag is rendered by our Next.js code.\n\nSee, in the style\
    \ section on the right, we have simply the anchor tag being targeted, instead\
    \ of the long class name associated with it. This means we’re targeting all the\
    \ anchor tags on the page.\n\n## Importing CSS files\n\nHonestly, for me, writing\
    \ CSS directly inside JSX is a bit overwhelming, and I would like to keep it separated\
    \ for clarity. Moreover, in separate files, you’ll be able to get better syntax\
    \ highlighting and error handling. Let’s see how we can set up importing CSS files\
    \ in our pages.\n\nUnlike styled-jsx, CSS imports are not baked in Next.js by\
    \ default just because there could be many ways to achieve this. Let's install\
    \ the @zeit/next-css package first. Follow the steps:\n\n1. In your project root,\
    \ do npx i @zeit/next-css --save\n2. Now, we've to create a next.config.js file\
    \ in the root directory of the project. Here's how the file would look like:\n\
    \n    ```javascript\n    // next.config.js\n    const withCSS = require('@zeit/next-css')\n\
    \    module.exports = withCSS({})\n    ```\n\n3. Restart your dev server at this\
    \ point\n4. You could pass additional options in withcss function, for example,\
    \ using CSS modules\n5. Once this is done, let's move our styles in a separate\
    \ file\n\nHere's how our Header.js component looks finally:\n\n```javascript\n\
    // components/Header/index.js\nimport Link from 'next/link'\nimport './style.css'\n\
    const Header = () => (\n<header>\n<Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link\
    \ href=\"/about\">\n<a className=\"special\">About</a>\n</Link>\n</header>\n)\n\
    export default Header\n```\n\nAnd here's how the style.css file would look like:\n\
    \n```css\n/* components/Header/style.css */\nheader {\npadding: 20px;\nbackground:\
    \ #1e1e1e;\nborder-bottom: 1px solid black;\nfont-size: 30px;\n}\na {\ncolor:\
    \ white;\nmargin-right: 30px;\n}\na.special {\ncolor: yellow;\n}\n```\n\nAnd this\
    \ would produce the following output:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_126_0.png)\n\
    \n**Figure 6.11**\n\nThe preceding screenshot shows the output produced by the\
    \ Header component file we just coded.\nAlso, there’s a change in the file structure\
    \ for the components directory. See below:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_127_0.png)\n\
    \nFigure 6.12\n\nThe preceding screenshot shows how the file structure looks right\
    \ now.\nAwesome! Let’s use CSS modules now. We can switch the site’s behaviour\
    \ to use CSS modules, which means that the class names would be randomized so\
    \ that there’s no collision between the same class names in different components.\
    \ Let’s see how this is done. Change the next.config.js file to the following:\n\
    \n```javascript\n// next.config.js\nconst withCSS = require('@zeit/next-css')\n\
    module.exports = withCSS({\ncssModules: true\n})\n```\n\nOnce you do this and\
    \ restart the server, you’ll see that your About link is no longer yellow even\
