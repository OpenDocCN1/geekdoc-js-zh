- md: "## Setting up Redux + Next.js\n\nFirst, let’s install `redux` and `next-redux-wrapper`\
    \ which would provide Redux.js wrapper for Next.js projects. Install the package\
    \ on your systems using the following command:\n\n```\nnpm install react-redux\
    \ redux next-redux-wrapper --save\n```\n\nNext, we’ll set up our Redux store.\
    \ Think of how we set up the default state in the case of Context API. This is\
    \ very similar to those lines. A store is basically a centralized place for all\
    \ of your components to store their data and retrieve data from that particular\
    \ area.\n\nBecause it is centralized and decoupled from your components, there\
    \ could be problems reading/writing values to that area; hence, there has to be\
    \ a streamlined way to access only the values a component needs to read.\n\nSimilarly,\
    \ if you want to write (update) the redux state, you cannot do it directly. You\
    \ have to write a **reducer** for it, that is, something that reduces your state.\
    \ Once you write a reducer for your store, you can then write **dispatchers**.\
    \ These functions are called dispatchers because they dispatch certain actions\
    \ to these reducers, and these reducers on receiving those actions, update the\
    \ state accordingly depending on what actions they received. The following diagram\
    \ shows how Redux architecture works in a nutshell:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_143_0.png)\n\
    \n**Figure 7.7**\n\nIf this confuses you, don’t worry. It’ll make a lot more sense\
    \ when we go through this thing again but using code this time. Let’s now look\
    \ at our reducer code:\n\n1. Create a file named reducer.ts in the redux folder\
    \ located in the project directory (create the redux folder). Here’s the reducer\
    \ code:\n\n```\n// reducer.ts\ntype Action = {\n  type: string\n  payload?: any\n\
    }\nexport type UserDetails = {\n  name: string\n  age: number\n  favQuote: string\n\
    }\nexport type State = {\n  user: UserDetails | null\n}\nconst defaultState: State\
    \ = {\n  user: null\n}\nconst reducer = (state: State = defaultState, action:\
    \ Action) => {\n  switch (action.type) {\n    case 'SET_USER_DETAILS':\n     \
    \ return {\n        ...state,\n        user: <UserDetails>action.payload\n   \
    \   }\n    default:\n      return state\n  }\n}\nexport default reducer\n```\n\
    \nHere, you could see that we’re creating a Redux store and reducer. A store,\
    \ as described above, is a place to store data, whereas a reducer is a function\
    \ that uses certain dispatched actions to update the store. Let’s learn about\
    \ how this code is working:\n\n- First, we defined some types of TypeScript.\n\
    - Then we created a `reducer` function.\n- The `reducer` function takes two arguments,\
    \ the first one is the actual application state, which is populated by redux automatically\
    \ before the reducer is called by redux.\n- The second argument is the action.\
    \ Our task is just to dispatch these actions via dispatcher functions. Redux automatically\
    \ calls the `reducer` function.\n- This action is actually an object, which consists\
    \ of a type and payload.\n- The type of property defines what this action is supposed\
    \ to update.\n- The payload property is some additional data you can transfer\
    \ to the reducer to update the state.\n\nThis is how the file structure looks\
    \ like:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_145_0.png)\n\n*Figure 7.8*\n\
    \nThe preceding screenshot shows how the file structure looks right now.\n\n2.\
    \ Once that is done, now we have to integrate Redux in our app. We use the special\
    \ pages/_app.js (or actually, _app.tsx) file to do that. Let’s discuss that now.\n\
    \n## _app.js File\n\nAccording to the documentation:\n\n- Next.js uses the App\
    \ component to initialize pages\n- To override, create the ./pages/_app.js file\
    \ and override the App class\n\nBasically, this file allows you to override some\
    \ default configuration Next.js uses to serve the pages. Since we want Redux to\
    \ be available everywhere on every page, we can wrap the Redux’s Provider (just\
    \ like we wrapped the Context API provider) in this particular file.\n\nBecause\
    \ we’re using TypeScript, we’ll be creating a file called _app.tsx file instead.\
    \ Let’s go ahead and create it:\n\n```\n// pages/_app.tsx\nimport React from 'react'\n\
    import { createStore, Store, compose } from 'redux'\nimport { Provider } from\
    \ 'react-redux'\nimport withRedux from 'next-redux-wrapper'\nimport reducer, {\
    \ State } from '../redux/reducer'\nimport { NextPage } from 'next'\nimport { NextComponentType,\
    \ NextPageContext } from\n'next/dist/next-server/lib/utils'\nlet devTools = (f:\
    \ any) => f\nif(process.browser) {\n  const _window = window as any\n  if(_window.__REDUX_DEVTOOLS_EXTENSION__)\
    \ {\n    devTools = _window.__REDUX_DEVTOOLS_EXTENSION__()\n  }\n}\nconst makeStore\
