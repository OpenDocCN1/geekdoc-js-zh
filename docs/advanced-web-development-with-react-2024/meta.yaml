    \n图 6.12\n\n上面的截图展示了当前文件结构的样子。\n太棒了！现在让我们使用 CSS modules。我们可以将网站的行为切换为使用 CSS modules，这意味着类名将被随机化，这样不同组件中的相同类名就不会发生冲突。让我们看看这是如何完成的。将\
