    >\n<a className={css.special}>About</a>\n</Link>\n</header>\n)\nexport default\
    \ Header\n```\n\nAnd this should work now! See the HTML markup, and it is a completely\
    \ random class name. This is basically the webpack CSS loader, and you can customize\
    \ it, even more, using the options present in webpack docs: https://github.com/webpack-contrib/css-loader.\n\
    \n## Conclusion\n\nThis chapter introduced us to the Next.js framework and helped\
