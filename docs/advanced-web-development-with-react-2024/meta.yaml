- md: "The actual response from the server:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_85_0.png)\n\
    \nThe rendered DOM finally:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_85_1.png)\n\
    \nThis approach is definitely fine. But there exists an alternate way to do things.\
    \ The reason you chose React is because of its flexibility and robustness, which\
    \ lies under the hood. But what if you want a completely rendered page instead\
    \ of letting the browser go to and fro for every request?\n\nHere, **Server Side\
    \ Rendering (SSR)** comes into place. As the name suggests, Server Side Rendering\
    \ basically means your server renders your React code into the DOM-like code you\
    \ saw above, so that browser could directly render it without any/minimal JS support.\
    \ Before that, let’s answer some common SSR questions.\n\n## What is Server-Side\
    \ Rendering?\n\nAs the name says, you are rendering the page on the server and\
    \ delivering it to the client, instead of letting the client (browser) render\
    \ the page itself using JavaScript you wrote. Server-Side Rendering takes one\
    \ step from the client back into the server, that is, parsing the React code logic.\
    \ In its very essence, SSR means the backend is doing most of the job and delivering\
    \ the pages to the frontend, instead of the client making heavy use of JS for\
    \ routing and state management. That was how applications using PHP used to work\
    \ back in the days. But with enhancement in JS standards and better-performing\
    \ devices and smartphones, client-side rendering is becoming much more popular\
    \ these days.\n\n## Why Server Side Rendering?\n\nIf client-side rendering is\
    \ so good, why are we considering server-side rendering in the 2020 decade? Well,\
    \ SSR has its own benefits which cannot be ignored, some of them include:\n\n\
    1.  SEO: Search engines love reading HTML markup and making sense of the page\
    \ out of that. Most of the search engines, except advanced ones like Google, cannot\
    \ really interpret a lot of JavaScript and hence have to rely heavily on what\
    \ your “source code” says. And since for client-side websites, source code doesn’t\
    \ say anything at all, the search engines are not able to index your site which\
    \ impacts your rankings.\n2.  Performance: There is an obvious boost in performance\
    \ when you’re using SSR. Since SSR involves rendering a page already before delivering,\
    \ you don’t have to worry about different browser support, different device support\
    \ APIs, etc. in your JS code, because most of them never get delivered anyway.\n\
    \nHence, for compatibility reasons with search engines, it is most important to\
    \ have SSR implemented, so that you can get the best of both worlds.\n\n## Starting\
    \ with SSR\n\nSSR with React is tricky without any framework. But still, we would\
    \ begin with that just so that we know what happens under the hood when we’re\
    \ working with other frameworks. Before starting off, we’ll focus on one special\
    \ thing in React, ReactDOM.\n\n## ReactDOM\n\nWhen we do `ReactDOM.render(<App\
    \ />, element)`, we’re effectively telling React to match the DOM tree (what you\
    \ see as UI of the web app) with the host tree (what is contained in JavaScript\
    \ as your React code). We discussed above how `App` unfolds into a nested object\
    \ (a tree, essentially). ReactDOM is one of the renderers of that particular tree.\
    \ Can you think of any other example? React Native could be thought of as another\
    \ complete renderer.\n\nThere’s another renderer called ReactDOMServer. ReactDOMServer,\
    \ as the name says, enables you to write React code and then, instead of rendering\
    \ it into a browser-like environment, render it as a string on a server to be\
    \ sent to the client as (close to) static markup.\n\nLet us now configure our\
    \ very first server-side rendering React app.\n\n## SSR project configuration\n\
    \n1.  Go ahead and create an empty directory named `react-ssr`.\n2.  Using your\
    \ terminal, cd into that.\n3.  Do a `npm init -y` to initialize it with default\
    \ npm configuration.\n\nLet’s install the relevant npm packages first, run the\
    \ following command:\n\n```bash\nnpm install react react-dom express --save\n\
    ```\n\nAnd the other dev dependencies would include:\n\n```bash\nnpm install @babel/core\
    \ @babel/preset-react @babel/register webpack webpack-cli --save-dev\n```\n\n\
    At this point, your `package.json` dependency and devDependency section should\
    \ look roughly like this:\n\n```json\n\"dependencies\": {\n    \"express\": \"\
    ^4.16.3\",\n    \"react\": \"^16.9.0\",\n    \"react-dom\": \"^16.9.0\"\n},\n\"\
    devDependencies\": {\n    \"babel-loader\": \"^8.0.6\",\n    \"@babel/core\":\
    \ \"^7.6.0\",\n    \"@babel/preset-react\": \"^7.0.0\",\n    \"@babel/register\"\
    : \"^7.6.0\",\n    \"webpack\": \"^4.19.1\",\n    \"webpack-cli\": \"^3.3.2\"\n\
    },\n```\n\n4.  Alright. Once we have our dependencies setup correctly, let’s write\
    \ some code now. Here’s our `index.js` file:\n\n```javascript\n// index.js\nrequire(\"\
    @babel/register\")({\n    presets: [\"@babel/preset-react\"]\n})\nrequire(\"./src/server\"\
    )\n```\n\nThis would be the entry point of our script. You can see that we’re\
    \ using the `@babel/register` package directly in the script file. This allows\
    \ us to use JSX inside our node scripts directly.\n\n5.  Although babel could\
    \ be configured via `.babelrc` to parse the server files as well, we’ll just keep\
    \ it simple right now and go with the minimal approach.\n\nAlright, once our `index.js`\
    \ file is setup, let’s see the `server.js` file:\n\n```javascript\n// server.js\n\
    const express = require(\"express\")\nconst app = express()\nconst React = require(\"\
    react\")\nconst { renderToString } = require(\"react-dom/server\")\n\napp.get(\"\
    /*\", (req, res) => {\n    const jsx = <div>Hello</div>\n    const reactDom =\
    \ renderToString(jsx)\n    res.send(template(reactDom))\n});\n\napp.listen(1337)\n\
    \nfunction template(reactDom) {\n    return `\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"utf-8\">\n<title>React SSR</title>\n</head>\n<body>\n<div id=\"\
    root\">${reactDom}</div>\n</body>\n</html>\n`\n}\n```\n\nOkay! Let’s break down\
    \ what is happening in this file:\n\n1.  Firstly, we require the necessary modules,\
    \ the express module, and the react module.\n2.  We also import `react-dom` but\
    \ notice that instead of just `react-dom`, we actually include `react-dom/server`.\n\
    3.  This gives us access to the method called `renderToString`, which does what\
    \ the name says. Instead of rendering the host tree (the vDOM representation in\
    \ JS) to the actual DOM, we render it to a simple string.\n4.  Finally, we send\
    \ the response back to the client using `res.send`.\n5.  Notice we’re using the\
    \ `template` function to inject the constructed string into the response.\n\n\
    And once we start the server using `node index.js`, you could see that we get\
    \ the correct response:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_89_0.png)\n\
    \nFigure 5.4\n\nIn the preceding screenshot, you can see that we get **Hello**\
    \ sent by server which is actually running React code:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_90_0.png)\n\
    \n*Figure 5.5*\n\nAnd once you see the source code of the page, as shown in the\
    \ preceding screenshot, you'll see that this is actually sent by the server, and\
    \ not rendered by the client.\n\n## Writing more components\n\nWe've done our\
    \ basic Hello World with React SSR above, which got us into server-side rendering\
    \ for the first time using React. Let's add some more components. Let's start\
    \ with the Home page and About page:\n\n```javascript\n// Home.js\nconst React\
    \ = require('react')\nfunction Home(props) {\n    return <div className=\"home\"\
    >\n        <h2>Hello, this is homepage! Go to <a href=\"/about\">About</a></h2>\n\
    \    </div>\n}\nmodule.exports = Home\n```\n\nAnd the `About.js` page:\n\n```javascript\n\
    // About.js\nconst React = require('react')\nfunction About(props) {\n    return\
    \ <div className=\"about\">\n        <h2>This is the about page</h2>\n    </div>\n\
    }\nmodule.exports = About\n```\n\nBut do you see the problem above? How do we\
    \ link them to each other, that is, when you click that link on the homepage,\
    \ the about page should open? Similarly, when you directly visit the `/about`\
    \ endpoint, it should directly serve that particular page. Let’s do some routing.\n\
    \n## Routing in SSR\n\nRouting is one of the most important aspects of a web app\
    \ these days, especially if it is a bit complex. It allows you to serve different\
    \ content on different URL paths.\n\nLet’s start by installing the `react-router`\
    \ package, which would help us to implement the routing.\n\n```bash\nnpm install\
    \ react-router-dom --save\n```\n\nOnce you do that, we’re good to make some changes.\
    \ Let’s change our `server.js` file a bit:\n\n```javascript\n// server.js\nconst\
    \ express = require(\"express\")\nconst app = express()\nconst React = require(\"\
    react\")\nconst ReactDOMServer = require(\"react-dom/server\")\nconst { StaticRouter,\
    \ Switch, Route } = require(\"react-router-dom\")\nconst Home = require('./components/Home')\n\
    const About = require('./components/About')\n\napp.get('/*', (req, res) => {\n\
    \    const jsx = <StaticRouter>\n        <Switch>\n            <Route path=\"\
    /\" component={Home} exact={true} />\n            <Route path=\"/about\" component={About}\
    \ exact={true} />\n```"
  mdcn: "\n服务器的实际响应：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_85_0.png)\n\n最终渲染的DOM：\n\
    \n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_85_1.png)\n\n这种方法当然没问题。但处理问题还存在另一种方式。你选择React是因其灵活性和健壮性，这源于其底层设计。但如果你想要一个完全渲染好的页面，而不是让浏览器为每个请求来回奔走呢？\n\
    \n这时，**服务端渲染（SSR）**就派上用场了。顾名思义，服务端渲染基本上意味着你的服务器将React代码渲染成你上面看到的类DOM代码，这样浏览器就能直接渲染它，而无需任何或仅需极少的JavaScript支持。在此之前，让我们先回答一些常见的SSR问题。\n\
    \n## 什么是服务端渲染？\n\n顾名思义，你是在服务器上渲染页面并将其交付给客户端，而不是让客户端（浏览器）使用你编写的JavaScript自行渲染页面。服务端渲染将客户端的一步工作拉回到了服务器，即解析React代码的逻辑。从本质上讲，SSR意味着后端完成了大部分工作，并将页面交付给前端，而不是客户端大量使用JS进行路由和状态管理。这就是过去使用PHP的应用程序的工作方式。但随着JavaScript标准的改进以及设备和智能手机性能的提升，客户端渲染如今变得越来越流行。\n\
    \n## 为什么要使用服务端渲染？\n\n如果客户端渲染这么好，为什么在2020年代我们还在考虑服务端渲染呢？嗯，SSR有其不可忽视的优势，其中一些包括：\n\
    \n1.  SEO：搜索引擎喜欢阅读HTML标记并从中理解页面内容。大多数搜索引擎，除了一些像Google这样的高级搜索引擎外，无法真正解析大量JavaScript，因此不得不严重依赖你的“源代码”内容。而对于客户端网站，源代码根本不包含任何实际内容，搜索引擎无法索引你的网站，这会影响你的排名。\n\
    2.  性能：使用SSR时性能会有明显提升。由于SSR在交付前就已经渲染了页面，你无需担心JS代码中不同的浏览器支持、不同设备的支持API等问题，因为它们中的大部分根本不会被交付。\n\
    \n因此，出于与搜索引擎兼容的原因，实施SSR至关重要，这样你才能两全其美。\n\n## 开始使用SSR\n\n在没有框架的情况下使用React进行SSR是棘手的。但无论如何，我们将从这里开始，以便我们了解在使用其他框架时底层发生了什么。在开始之前，我们将重点关注React中的一个特殊东西：ReactDOM。\n\
    \n## ReactDOM\n\n当我们执行 `ReactDOM.render(<App />, element)` 时，我们实际上是告诉React将DOM树（你看到的Web应用UI）与宿主树（JavaScript中包含的React代码）进行匹配。我们在上面讨论了\
    \ `App` 如何展开为一个嵌套对象（本质上是一棵树）。ReactDOM是那个特定树的一个渲染器。你能想到其他例子吗？React Native可以被视为另一个完整的渲染器。\n\
    \n还有另一个渲染器叫ReactDOMServer。顾名思义，ReactDOMServer使你能够编写React代码，然后，不是将其渲染到类浏览器环境中，而是将其在服务器上渲染为一个字符串，以（接近）静态标记的形式发送给客户端。\n\
    \n现在让我们配置我们的第一个服务端渲染React应用。\n\n## SSR项目配置\n\n1.  首先创建一个名为 `react-ssr` 的空目录。\n\
    2.  使用你的终端，进入该目录。\n3.  执行 `npm init -y` 以使用默认的npm配置进行初始化。\n\n让我们先安装相关的npm包，运行以下命令：\n\
    \n```bash\nnpm install react react-dom express --save\n```\n\n其他的开发依赖将包括：\n\n\
    ```bash\nnpm install @babel/core @babel/preset-react @babel/register webpack webpack-cli\
    \ --save-dev\n```\n\n此时，你的 `package.json` 的依赖和开发依赖部分应该大致如下：\n\n```json\n\"dependencies\"\
    : {\n    \"express\": \"^4.16.3\",\n    \"react\": \"^16.9.0\",\n    \"react-dom\"\
    : \"^16.9.0\"\n},\n\"devDependencies\": {\n    \"babel-loader\": \"^8.0.6\",\n\
    \    \"@babel/core\": \"^7.6.0\",\n    \"@babel/preset-react\": \"^7.0.0\",\n\
    \    \"@babel/register\": \"^7.6.0\",\n    \"webpack\": \"^4.19.1\",\n    \"webpack-cli\"\
    : \"^3.3.2\"\n},\n```\n\n4.  好的。一旦我们正确设置了依赖项，现在让我们编写一些代码。这是我们的 `index.js` 文件：\n\
    \n```javascript\n// index.js\nrequire(\"@babel/register\")({\n    presets: [\"\
    @babel/preset-react\"]\n})\nrequire(\"./src/server\")\n```\n\n这将是我们脚本的入口点。你可以看到我们正在脚本文件中直接使用\
    \ `@babel/register` 包。这允许我们直接在node脚本中使用JSX。\n\n5.  尽管可以通过 `.babelrc` 配置babel来解析服务器文件，但我们现在保持简单，采用最小化方法。\n\
    \n好的，一旦我们的 `index.js` 文件设置好，让我们看看 `server.js` 文件：\n\n```javascript\n// server.js\n\
    const express = require(\"express\")\nconst app = express()\nconst React = require(\"\
    react\")\nconst { renderToString } = require(\"react-dom/server\")\n\napp.get(\"\
    /*\", (req, res) => {\n    const jsx = <div>Hello</div>\n    const reactDom =\
    \ renderToString(jsx)\n    res.send(template(reactDom))\n});\n\napp.listen(1337)\n\
    \nfunction template(reactDom) {\n    return `\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"utf-8\">\n<title>React SSR</title>\n</head>\n<body>\n<div id=\"\
    root\">${reactDom}</div>\n</body>\n</html>\n`\n}\n```\n\n好的！让我们分解一下这个文件中发生的事情：\n\
    \n1.  首先，我们引入必要的模块，express模块和react模块。\n2.  我们还引入了 `react-dom`，但请注意，我们引入的不是单纯的\
    \ `react-dom`，而是 `react-dom/server`。\n3.  这使我们能够使用一个叫做 `renderToString` 的方法，它的作用正如其名。我们没有将宿主树（JS中的vDOM表示）渲染到实际DOM，而是将其渲染为一个简单的字符串。\n\
    4.  最后，我们使用 `res.send` 将响应发回给客户端。\n5.  注意我们使用 `template` 函数将构建好的字符串注入到响应中。\n\n\
    一旦我们使用 `node index.js` 启动服务器，你可以看到我们得到了正确的响应：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_89_0.png)\n\
    \n图 5.4\n\n在前面的截图中，你可以看到我们得到了服务器发送的 **Hello**，这实际上是运行React代码的结果：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_90_0.png)\n\
    \n*图 5.5*\n\n一旦你查看页面的源代码，如前面的截图所示，你会看到这确实是服务器发送的，而不是客户端渲染的。\n\n## 编写更多组件\n\n我们上面用React\
    \ SSR完成了基本的Hello World，这让我们首次使用React进入了服务端渲染。让我们添加更多组件。让我们从主页和关于页面开始：\n\n```javascript\n\
    // Home.js\nconst React = require('react')\nfunction Home(props) {\n    return\
    \ <div className=\"home\">\n        <h2>你好，这是主页！前往 <a href=\"/about\">关于页面</a></h2>\n\
    \    </div>\n}\nmodule.exports = Home\n```\n\n以及 `About.js` 页面：\n\n```javascript\n\
    // About.js\nconst React = require('react')\nfunction About(props) {\n    return\
    \ <div className=\"about\">\n        <h2>这是关于页面</h2>\n    </div>\n}\nmodule.exports\
    \ = About\n```\n\n但你看出上面的问题了吗？我们如何将它们彼此链接起来，也就是说，当你点击主页上的那个链接时，应该打开关于页面？同样，当你直接访问\
    \ `/about` 端点时，它应该直接提供那个特定的页面。让我们来实现一些路由。\n\n## 在SSR中实现路由\n\n路由是当今Web应用程序最重要的方面之一，特别是当它稍微复杂一些时。它允许你在不同的URL路径上提供不同的内容。\n\
    \n让我们从安装 `react-router` 包开始，这将帮助我们实现路由。\n\n```bash\nnpm install react-router-dom\
    \ --save\n```\n\n完成安装后，我们就可以进行一些更改了。让我们稍微修改一下 `server.js` 文件：\n\n```javascript\n\
    // server.js\nconst express = require(\"express\")\nconst app = express()\nconst\
    \ React = require(\"react\")\nconst ReactDOMServer = require(\"react-dom/server\"\
    )\nconst { StaticRouter, Switch, Route } = require(\"react-router-dom\")\nconst\
    \ Home = require('./components/Home')\nconst About = require('./components/About')\n\
    \napp.get('/*', (req, res) => {\n    const jsx = <StaticRouter>\n        <Switch>\n\
    \            <Route path=\"/\" component={Home} exact={true} />\n            <Route\
    \ path=\"/about\" component={About} exact={true} />\n```\n"
