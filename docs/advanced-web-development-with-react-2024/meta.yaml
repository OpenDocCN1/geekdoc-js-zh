  md: 'interrupt than react, rendering the updated view, hence, react pauses its execution
    and frees the main thread to handle the input.


    2. **Loading sequences**: Have you ever seen applications where you see the loading
    spinner just for a split second even though you’re on a fast connection? The concurrent
    mode also solves that problem.


    3. **Concurrency**: Last but not least, react can now work truly concurrently,
    i.e. it can work on multiple state updates simultaneously. This means that if
    you have some I/O bound data (HTTP network requests) to bring in some data, React
    can skip over the data for a while and render views. When the data arrives, React
    can simply place it there. Current standard practice is that we block the whole
    view from rendering if data is not available.


    Concurrent react makes code fetching, data fetching and resource fetching truly
    concurrent, and if the browser supports, parallel too. As of now, concurrent react
    is experimental and not stable except for code splitting. So we’ll not be using
    code examples for unstable APIs.


    # Opting in concurrent mode


    The concurrent mode in React is opt-in right now. To use it, instead of:


    ```

    ReactDOM.render(<Component />, container)

    ```


    Use the following:


    ```

    ReactDOM.createRoot(container).render(<Component />)

    ```


    Now you’re running React in concurrent mode. This API only exists in the experimental
    build, and it is very much possible that in the future you might not need this.


