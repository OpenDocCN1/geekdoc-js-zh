    : \"next start\"\n}\n```\n\n所以，你的 package.json 文件大致会如下所示（你的版本号可能不同）：\n\n```\n\
    {\n  \"name\": \"nextjs\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\"\
