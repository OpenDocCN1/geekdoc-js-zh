  md: '# # Choosing a text editor


    First things first -you need a place to write code. Here’s a list of text editors
    that we recommend personally.


    # # #1 – VSCode


    This is the most popular text editor out right now and a major chunk of web developers
    you find, would be using VSCode all the time. VSCode is fully customizable, with
    tons of additional plugins to supercharge your productivity. It is cross-platform
    (macOS/Linux/Windows) and you can get a stable binary for your platform here:
    https://code.visualstudio.com/#alt-downloads.


    # # #2 – Sublime Text


    Another great text editor is Sublime Text. If you’re unhappy with VSCode, Sublime
    text can be the second choice. You can purchase it, but you’re not forced to.
    Sublime Text allows you to use it for free for a very long time, with a little
    popup coming to your screen every week or so to upgrade. It also ships with a
    powerful package system and great themes. Download it from here: https://www.sublimetext.com/3.


    # # #3 – Atom


    Atom is also a decent alternative, if you’re looking for text editors. It does
    include a package manager, is fully customizable and free! You can download the
    Atom text editor from here: https://atom.io/.


    # # Setting up nNode and NPM


    Once your text editor is installed and is ready (which should relatively take
    5-10 minutes), it’s time to setup node and npm. If you already have that on your
    system, you can skip this section. Node is basically taking the JavaScript engine
    (a piece of code responsible for running your written JavaScript on the machine)
    and putting it on your computer as a local app, instead of embedding it inside
    just a web browser. And npm, is its package manager to add and remove the packages
    and dependencies.


    # # Windows'
