    # Dedicated to


    My Family and Friends


    My mom, dad, sister, and close friends, who have always believed in me.


    # About the Author


    **Mehul Mohan** is an entrepreneur, developer and a security researcher. Currently,
    he is pursuing his bachelor’s degree in CSE at BITS Pilani. He is a WWDC’19 Scholar
    and runs codedamn – a platform for people to learn coding. You’ll often find him
    creating programming tutorials on his YouTube channel, codedamn, having over 100,000
    subscribers. He has been acknowledged by companies such as Google, Microsoft,
    Sony, etc. for his contributions as a security researcher.


    # About the Reviewer


    Self-motivated, charismatic programmer, currently working as Technology Analyst
    for Verizon, USA, focusing on Front-end programming. Involved in migrating Verizon’s
    website pages from Angular to React Js. Holds degree in computer science from
    Mody University of Science and Technology, India.


    A tech enthusiast and loves doing UI designing. Extensive experience in software
    development, front-end development in analysis, design, development and testing
    of web applications on OO JavaScript, HTML5, CSS3, BootStrap, ReactJS, JSON, Redux,
    JQuery. Known for high commitment, flexibility to juggle across multiple roles.
    Experience in contributing to Sprint Planning, Daily Scrum meeting, Sprint demo,
    and Sprint retrospective sessions. Extensive experiences in UI Development, Web
    UI analysis, Responsive design, coding, unit testing, implementation and support
    working with various projects.


    Implementation in Agile Software Development Team using SCRUM, TDD (Test Driven
    Development). Expertise in developing applications using Core Java concepts like
    OOPS. Excellent communication and interpersonal skills, self-motivated, thrives
    on collaboration with people as a team player. Prior to Verizon, I have worked
    for Orange France as a Java developer. Was involved in migrating billing system
    of Orange to Java from DML (a legacy code language). Being a diploma holder in
    French language, the added knowledge of French also helped a lot for that project
    and used to take French classes for my colleagues, which was fun too.


    Have also worked as an intern in HCL and C-DOT. Like to contribute to open source
    jobs online. Like to do freelance projects in free time. Hobbies: exploring new
    places around the globe, meeting new people and reading about space.


    # Acknowledgements


    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank my mom – Mrs Ritu Mohan and my dad – Mr Vinay Kumar Mohan, for always
    being there when I needed them no matter what.


    I would also like to thank my sister Mrs Ishumita Mohan, who also happens to be
    the technical editor for the book, for her constant support throughout.


    Finally, I would like to thank Nrip Jain at BPB Publications for giving me this
    opportunity to write my first book for them.


    # Preface


    With web evolving so rapidly in the past 5-6 years, it is a no-brainer to build
    on top of existing best practices available in the market instead of going through
    scratch. React is one such tool to build highly responsive and scalable web applications,
    and comes with best practices from industry, used by front faces of the internet
    like Facebook. Hence, it becomes extremely important for developers to level up
    their web development skills to include React as a skill in their toolkit.


    With the increasing need of businesses to optimize for user experience as well
    as search engine optimizations, technologies like Server-Side Rendering (SSR)
    and Progressive Web Apps (PWAs) could enable companies to build better products
    whilst cutting down technical maintenance of existing codebase.


    This book is a go-to handbook for developers who want to learn bleeding-edge React
    features, brush up their React skills, or start working with SSR/PWA using Next.js
    and React, which would eventually help them to scale their existing applications
    on the top of highly maintained and trusted open-source code. This book would
    take you through a journey of different discrete concepts you’ll need to know
    in order to build parts of application ready for SSR deployment or converting
    it into a PWA. Over the course of 9 chapters in the book, you’ll learn about the
    following.


    **Chapter 1** Introduces React to you. We’ll dig up what React is and why it is
    a great choice for building highly scalable applications in today’s world. We’ll
    also quickly brush up some necessary JS concepts required for future chapters.


    **Chapter 2** Would cover setting up React using various methods and discuss the
    benefits and drawbacks of each. We’ll also start writing basic applications with
    React and start seeing benefits React offers out of the box.


    **Chapter 3** Would introduce 2 ways to create components in React and discuss
    a modern approach React takes for components – functional way. We’ll also work
    with hooks in this chapter and see why they make more sense than their counterpart
    – Classes.


    **Chapter 4** Introduces state management with React. Here we discuss possible
    options to manage the state with React. We’ll see managing state with Redux, and
    using latest hooks – useContext and useReducer to emulate Redux store.


    **Chapter 5** Introduces server-side rendering in React, where we’ll see what
    SSR is, and how it works. We’ll implement SSR in this chapter ourselves from scratch,
    and discuss the pros and cons with it.


    **Chapter 6** This chapter introduces you to Next.js – a popular choice for SSR
    frameworks when doing SSR using React. We’ll see how to setup Next.js and various
    baked-in features which come with it.


    **Chapter 7** We’ll explore more advanced Next.js features in this chapter, digging
    deep into the framework and setting up API endpoints using Next.js framework.


    **Chapter 8** This chapter introduces Progressive Web Apps and how to create PWAs
    using Next.js and React framework.


    **Chapter 9** This chapter covers bleeding-edge React features and some information
    on how React works under the hood.'
