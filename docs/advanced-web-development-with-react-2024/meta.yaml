- md: "## Communication between components\n\nIf you think about it, managing application\
    \ state is roughly another way of saying effective communication of some information\
    \ among a lot of components.\n\nAlthough you could have a local state in components,\
    \ things get tricky when you want to communicate between components, especially\
    \ when it is up the component hierarchy or even be very far relatives in the tree.\
    \ This happens all the time. Consider you logout from a website using a link in\
    \ the content area, this information should be dispatched to the header, which\
    \ is a completely different component, so that header could update the links back\
    \ to the ones to be shown to an unauthenticated user.\n\nLet’s see some common\
    \ ways we’ll learn in this chapter to communicate between the components:\n\n\
    - Props (parent to child data flow)\n- Refs (Calling child methods from a parent)\n\
    - Context API\n- Redux (Centralized state) (in later chapters)\n\nIt is interesting\
    \ to note that with a slight trick, it is possible to use Context API to have\
    \ two-way communication, however redux is truly decoupled and centralized state\
    \ store. Redux is the go-to choice for intermediate to advanced applications because\
    \ of its unidirectional data flow (careful! This doesn’t mean that it can only\
    \ communicate in one way), centralized state share and great debugging tools.\
    \ Let’s take a look at props first.\n\nReact 16.8 hooks, React provides an out\
    \ of the box solution similar (but less powerful) to redux. Let’s learn all about\
    \ that in this chapter.\n\n## Prop drilling\n\nImagine you have a UI theme in\
    \ your React application which holds values like colours and font sizes. Now,\
    \ of course, these values need to be accessed by respective input fields and textareas.\
    \ However, getting to those input fields in the first place in the hierarchy of\
    \ the elements is a cumbersome task. You’ll need to drill your fontSize prop all\
    \ the way down to the input field, even though none of the components in between\
    \ needs to be aware of it. Let’s see what this is.\n\nIt is the most naive technique\
    \ in sharing data among components. You use props to pass down data to the child\
    \ components. Consider this very simple example:\n\n```jsx\nimport React from\
    \ 'react'\nimport ReactDOM from 'react-dom'\nconst App: React.FC<{ name: string,\
    \ age: number }> = props => {\n  return <div>\n    <p>We’ve got all of your information!</p>\n\
    \    <Profile name={props.name} age={props.age} />\n  </div>\n}\nconst Profile:\
    \ React.FC<{ name: string, age: number }> = props => {\n  return <div>\n    <p>Here’s\
    \ a complete information about you</p>\n    <p>We save everything in our databases</p>\n\
    \    <NameFormatter name={props.name} />\n    <AgeFormatter age={props.age} />\n\
    \  </div>\n}\nconst NameFormatter: React.FC<{ name: string }> = props => {\n \
    \ return <p>Like you can see, here’s your name: <TextField value={props.name}\
    \ type=\"text\" /></p>\n}\nconst AgeFormatter: React.FC<{ age: number }> = props\
    \ => {\n  return <p>Your age is: <TextField value={props.age} type=\"number\"\
    \ /></p>\n}\nconst TextField: React.FC<{ value: any, type: string }> = props =>\
    \ {\n  return <input type={props.type} value={props.value} />\n}\n```\n\n```jsx\n\
    ReactDOM.render(<App name=\"Mehul\" age={20} />, document.getElementById('root'))\n\
    ```\n\nIf you observe here, you'd realize that the component App and Profile never\
    \ needed to know about the props name and age. It was only NameFormatter and AgeFormatter,\
    \ which required the respective values to render the UI correctly. However, because\
    \ the props name and age are available at the App component level, in order to\
    \ reach to NameFormatter and AgeFormatter component levels, you need to *drill*\
    \ it down to them.\nThis practice refers to prop drilling and usually is not required\
    \ with the more advanced and sophisticated methods we have now for communication\
    \ between components at the different hierarchical level. Let's take a look at\
    \ the different methods which could help us prevent situations like these.\n\n\
    ## Refs\n\nRef in react refers to creating a reference to something. A `ref` is\
    \ an escape hatch from React, allowing you to peek directly inside the component\
    \ or DOM, whatever you like. Hence, it should be handled with care. Because the\
    \ things you do with refs are usually following imperative patterns, it kind of\
    \ breaks the way react wants you to work with it - declaratively. But sometimes,\
    \ it is very useful to go out the way a little because there's only so much React\
    \ could bring to the table cooked within itself.\nUsing refs, not only could we\
    \ communicate with the DOM directly, but we could also allow a parent to call\
    \ a child's method. We know that we could do it easily the other way using props,\
    \ but it cannot be done using props for child component method which needs to\
    \ be called by a parent. Let's take a look at this example:\nThis is Parent.tsx\
    \ file:\n\n```tsx\n// Parent.tsx\nimport React, { useRef } from 'react'\nimport\
    \ ReactDOM from 'react-dom'\nimport ChildInput, { ChildInputHandles } from './Child'\n\
    const Parent: React.FC = () => {\n  const ref = useRef<ChildInputHandles>(null)\n\
    \  function setChildFocus() {\n    if (ref.current) {\n      ref.current.setFocus()\n\
    \    }\n  }\n  return <div>\n    <ChildInput ref={ref} defaultValue=\"Hello World\"\
    \ />\n    <button onClick={setChildFocus}>Set focus to input</button>\n  </div>\n\
    }\nReactDOM.render(<Parent />, document.getElementById('root'))\n```\n\nAnd the\
    \ Child.tsx file:\n\n```tsx\n// Child.tsx\nimport React, { RefForwardingComponent,\
    \ forwardRef,\n  useImperativeHandle, useRef } from 'react'\nexport interface\
    \ ChildInputHandles {\n  setFocus(): void\n}\nexport interface ChildInputProps\
    \ {\n  defaultValue: string\n}\nconst ChildInput: RefForwardingComponent<ChildInputHandles,\n\
    \  ChildInputProps> = (props, ref) => {\n  const inputRef = useRef<HTMLInputElement>(null)\n\
    \  useImperativeHandle(ref, () => ({\n    setFocus() {\n      if (inputRef.current)\
    \ {\n        inputRef.current.focus()\n      }\n    }\n  }))\n  return <input\
    \ {...props} defaultValue={props.defaultValue} ref={inputRef} />\n}\n```\n\n```tsx\n\
    export default forwardRef(ChildInput)\n```\n\nLet’s take a look what’s happening\
    \ here:\n\n1. In Parent.tsx file, we first import the ChildRef component and give\
    \ it a ref using the useRef hook. We use `<ChildInputHandles>` to type the methods\
    \ and props we could access via our ref.current variable.\n2. We have a method\
    \ setChildFocus function in Parent which actually uses refs to penetrate into\
    \ the child component and call the specified function, that is, setFocus inside\
    \ the child.\n3. In the ChildInput component, we type it as RefForwardingComponent\
    \ as the TypeScript type to type the receiving props and props available via ref\
    \ forwarding.\n4. We use another hook called useImperativeHandle which accepts\
    \ our passed ref (see the second argument of ChildInput component) and binds certain\
    \ methods which we could directly call on that ref inside the parent.\n5. Finally,\
    \ we use a regular inputRef ref inside the Child itself to actually enable the\
    \ focus inside the definition of setFocus inside the Child component.\n\nIn this\
    \ way, we could use the refs as an escape hatch to access functions and values\
    \ inside children from parent components. However, approaches like these are usually\
    \ not recommended in most scenarios and really put forward the thought that there’s\
    \ a better way to implement whatever the developer is trying to do.\n\nLet us\
    \ now move on to Context API and see how to use it to create *worm-holes* in data\
    \ passing.\n\n## Context API\n\nIn prop drilling example, we saw how a UI theme\
    \ would need to drill its props all the way down to a component which actually\
    \ needs it, exposing it to all other components which don’t even need to know\
    \ about those values. Meet Context in React. Context allows you to create wormholes\
    \ of data in components, that is, you could teleport data from one component to\
    \ another down the tree without the intermediate components knowing about the\
    \ transferred data.\n\nLet's see the code first and understand how context API\
    \ works in general by taking a look at this mini-application:\n\nThis is our index.tsx\
    \ file:\n\n```tsx\nimport React from 'react'\nimport ReactDOM from 'react-dom'\n\
    import Component1 from './Component1'\nReactDOM.render(<Component1 />, document.getElementById('root'))\n\
    ```\n\nThis is our Component1.tsx file:\n\n```tsx\nimport React from 'react'\n\
    import Header from './Header'\nimport Content from './Content'\nimport Footer\
    \ from './Footer'\nimport './global.css'\nconst Component1: React.FC = () => {\n\
    \  return (\n    <div>\n      <Header />\n      <Content />\n      <Footer />\n\
    \    </div>\n  )\n}\nexport default Component1\n```\n\nThis is our Header.tsx\
    \ file:\n\n```tsx\nimport React from 'react'\nconst Header: React.FC = () => {\n\
    \  return (\n    <header>\n      <h1>Welcome to my site!</h1>\n```"
  mdcn: "\n## 组件间的通信\n\n细想一下，管理应用状态大致等同于在众多组件间高效传递某些信息。\n\n虽然可以在组件内使用局部状态，但当需要在组件间通信时，事情就变得复杂了，尤其是当通信发生在组件层级向上时，甚至是树中相距甚远的“远亲”组件之间。这种情况时常发生。例如，当你在网站的内容区域点击链接注销时，这个信息需要分发给页头——一个完全不同的组件——以便页头能更新链接，恢复为向未认证用户显示的状态。\n\
    \n让我们看看本章将学习的一些常见的组件间通信方式：\n\n-   Props（父到子的数据流）\n-   Refs（从父组件调用子组件方法）\n-   Context\
    \ API\n-   Redux（集中式状态管理）（将在后续章节介绍）\n\n有趣的是，通过一点技巧，使用Context API可以实现双向通信，而Redux则是真正解耦的集中式状态存储。对于中级到高级的应用程序，Redux是首选，因为它具有单向数据流（注意！这并不意味着它只能单向通信）、集中状态共享和出色的调试工具。让我们先来看看Props。\n\
    \nReact 16.8引入了Hooks，提供了一个开箱即用的解决方案，类似于（但功能弱于）Redux。本章我们将全面学习这个方案。\n\n## Props逐层传递（Prop\
    \ drilling）\n\n想象一下，你的React应用中有一个UI主题，包含了颜色和字体大小等值。当然，这些值需要被相应的输入框和文本域访问。然而，首先要在元素层级中到达这些输入框本身就是一个繁琐的任务。你需要将`fontSize`这个prop一路“钻”到输入框，即使中间的所有组件都不需要知道它。让我们看看这是怎么回事。\n\
    \n这是组件间共享数据最朴素的技术。你使用props将数据向下传递给子组件。考虑这个非常简单的例子：\n\n```jsx\nimport React from\
    \ 'react'\nimport ReactDOM from 'react-dom'\nconst App: React.FC<{ name: string,\
    \ age: number }> = props => {\n  return <div>\n    <p>We’ve got all of your information!</p>\n\
    \    <Profile name={props.name} age={props.age} />\n  </div>\n}\nconst Profile:\
    \ React.FC<{ name: string, age: number }> = props => {\n  return <div>\n    <p>Here’s\
    \ a complete information about you</p>\n    <p>We save everything in our databases</p>\n\
    \    <NameFormatter name={props.name} />\n    <AgeFormatter age={props.age} />\n\
    \  </div>\n}\nconst NameFormatter: React.FC<{ name: string }> = props => {\n \
    \ return <p>Like you can see, here’s your name: <TextField value={props.name}\
    \ type=\"text\" /></p>\n}\nconst AgeFormatter: React.FC<{ age: number }> = props\
    \ => {\n  return <p>Your age is: <TextField value={props.age} type=\"number\"\
    \ /></p>\n}\nconst TextField: React.FC<{ value: any, type: string }> = props =>\
    \ {\n  return <input type={props.type} value={props.value} />\n}\n```\n\n```jsx\n\
    ReactDOM.render(<App name=\"Mehul\" age={20} />, document.getElementById('root'))\n\
    ```\n\n如果你观察这里的代码，你会意识到`App`和`Profile`组件根本不需要知道`name`和`age`这两个prop。只有`NameFormatter`和`AgeFormatter`需要相应的值来正确渲染UI。然而，由于`name`和`age`这两个prop在`App`组件层级上是可用的，为了将它们传递到`NameFormatter`和`AgeFormatter`组件层级，你需要将它们*向下钻取*。这种做法被称为“prop逐层传递”，通常我们现在拥有更高级、更复杂的跨层级通信方法，不再需要这种做法。让我们看看不同的方法，它们可以帮助我们避免这种情况。\n\
    \n## Refs\n\nReact中的Ref指的是创建一个对某物的引用。`ref`是React的一个“逃生舱口”，允许你直接窥视组件或DOM内部，无论你想要哪种。因此，应该谨慎处理它。因为你用ref做的事情通常遵循命令式模式，这在某种程度上打破了React希望你以声明式方式工作的方式。但有时，稍微偏离一点常规非常有用，因为React自身所能提供的“烹饪”能力是有限的。使用ref，我们不仅可以与DOM直接通信，还可以让父组件调用子组件的方法。我们知道用props可以轻松地做到相反方向（子调父），但使用props无法做到由父组件调用子组件的方法。让我们看一个例子：\n\
    这是Parent.tsx文件：\n\n```tsx\n// Parent.tsx\nimport React, { useRef } from 'react'\n\
    import ReactDOM from 'react-dom'\nimport ChildInput, { ChildInputHandles } from\
    \ './Child'\nconst Parent: React.FC = () => {\n  const ref = useRef<ChildInputHandles>(null)\n\
    \  function setChildFocus() {\n    if (ref.current) {\n      ref.current.setFocus()\n\
    \    }\n  }\n  return <div>\n    <ChildInput ref={ref} defaultValue=\"Hello World\"\
    \ />\n    <button onClick={setChildFocus}>Set focus to input</button>\n  </div>\n\
    }\nReactDOM.render(<Parent />, document.getElementById('root'))\n```\n\n这是Child.tsx文件：\n\
    \n```tsx\n// Child.tsx\nimport React, { RefForwardingComponent, forwardRef,\n\
    \  useImperativeHandle, useRef } from 'react'\nexport interface ChildInputHandles\
    \ {\n  setFocus(): void\n}\nexport interface ChildInputProps {\n  defaultValue:\
    \ string\n}\nconst ChildInput: RefForwardingComponent<ChildInputHandles,\n  ChildInputProps>\
    \ = (props, ref) => {\n  const inputRef = useRef<HTMLInputElement>(null)\n  useImperativeHandle(ref,\
    \ () => ({\n    setFocus() {\n      if (inputRef.current) {\n        inputRef.current.focus()\n\
    \      }\n    }\n  }))\n  return <input {...props} defaultValue={props.defaultValue}\
    \ ref={inputRef} />\n}\n```\n\n```tsx\nexport default forwardRef(ChildInput)\n\
    ```\n\n让我们看看这里发生了什么：\n\n1.  在Parent.tsx文件中，我们首先导入ChildInput组件，并使用useRef hook为其创建一个ref。我们使用`<ChildInputHandles>`来为通过`ref.current`变量可访问的方法和属性提供类型。\n\
    2.  在Parent中有一个`setChildFocus`方法，它实际上使用ref深入到子组件内部，并调用指定的函数，即子组件内的`setFocus`。\n\
    3.  在ChildInput组件中，我们将其类型指定为`RefForwardingComponent`，作为TypeScript类型来定义接收到的props以及通过ref转发可用的props。\n\
    4.  我们使用了另一个名为`useImperativeHandle`的hook，它接受我们传递的ref（见ChildInput组件的第二个参数），并绑定一些我们可以直接在父组件中通过该ref调用的方法。\n\
    5.  最后，我们在Child内部使用一个常规的inputRef ref，实际上在Child组件内`setFocus`的定义中实现了聚焦功能。\n\n通过这种方式，我们可以将ref作为“逃生舱口”，从父组件访问子组件内的函数和值。然而，像这样的方法在大多数场景下通常不被推荐，它真正促使我们思考：开发者试图实现的功能是否有更好的实现方式。\n\
    \n现在，让我们继续学习Context API，看看如何使用它在数据传递中创建*虫洞*。\n\n## Context API\n\n在prop逐层传递的例子中，我们看到了一个UI主题如何需要将其prop一路“钻”到真正需要它的组件，同时将其暴露给所有其他甚至不需要知道这些值的组件。认识一下React中的Context。Context允许你在组件中创建数据的虫洞，也就是说，你可以将数据从一个组件直接传送到树中下方的另一个组件，而中间的组件对传递的数据一无所知。\n\
    \n让我们先看代码，通过一个迷你应用了解context API是如何工作的：\n\n这是我们的index.tsx文件：\n\n```tsx\nimport\
    \ React from 'react'\nimport ReactDOM from 'react-dom'\nimport Component1 from\
    \ './Component1'\nReactDOM.render(<Component1 />, document.getElementById('root'))\n\
    ```\n\n这是我们的Component1.tsx文件：\n\n```tsx\nimport React from 'react'\nimport Header\
    \ from './Header'\nimport Content from './Content'\nimport Footer from './Footer'\n\
    import './global.css'\nconst Component1: React.FC = () => {\n  return (\n    <div>\n\
    \      <Header />\n      <Content />\n      <Footer />\n    </div>\n  )\n}\nexport\
    \ default Component1\n```\n\n这是我们的Header.tsx文件：\n\n```tsx\nimport React from 'react'\n\
    const Header: React.FC = () => {\n  return (\n    <header>\n      <h1>Welcome\
    \ to my site!</h1>\n```\n"
