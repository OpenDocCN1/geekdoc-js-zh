    # Renderer


    React’s second part is the react renderer. Now, DOM is one of the host environments
    which could use React. There are other host environments as well, like React Native
    (for mobile), or maybe React Hardware. Renderers basically allow the reconciler
    to talk to the host environment.

    For example, with DOM, we know that an element is created using document.createElement
    API exposed by browsers. This might not be the case with a mobile host, say Android.
    There, you would have to use some other way to create a UI element on the screen,
    but does it affect the reconciler in any way? No! That is why it is a great decision
    to split the reconciler and renderer into different packages. When you install
    react for web pages, you install the package react and react-dom. Here, the package
    react is basically the reconciler, and the package react-dom is renderer.'
  - '[PAGE 190]


    # Moving from classes


    I’m fully aware that React has first-class support for class-based components,
    but this chapter aims at future tech and experimental tech associated with React,
    and the team has made it very clear that in the future, functional components
    would be the ones which would get the most focus on development. With hooks, functional
    components are fully capable of doing everything class-based components do. If
    you’re just picking up React, I would say just know about class-based components
    enough to refactor them, but if you’re creating your own components, always go
    with functional components.


    Class-based components have their own pros and cons, like, they actually mutate
    state and props, whereas functional components actually capture the props and
    state at the time of render. This avoids nasty bugs. Moreover, functional components
    are a more friendly way to code than classes, simply because JavaScript has no
    classes;it is just syntactic sugar over functions.


    # Concurrent mode


    The concurrent mode in React is a completely new way of working with React. In
    Computer Science, concurrency usually means performing multiple tasks on the basis
    of time slicing. React, once it is done with the vDOM diffs, now has to commit
    these changes to the DOM. Calculating the changes in vDOM is non-blocking, even
    now, and it is how internally React works (using browser’s idle time by calling
    requestIdleCallback function in browsers and in different threads for other host
    environments), however the commit phase, that is, writing to DOM is synchronous.
    Some notable features of concurrent mode:


    +   1. **Interruptible rendering**: Consider a huge list consisting of items where
    you could filter for the items. If you ever used such an application, you know
    that it could become all jittery and lagging unless there is some sort of debounce
    function in place which doesn’t run the search JavaScript logic unless the user
    has stopped typing (say checking if the last keystroke was 200ms before or so).
    Concurrent mode fixes this by making the renders interruptible by high priority
    interrupts. A user interacting with an input field is a higher priority'
  - '[PAGE 191]


    interrupt than react, rendering the updated view, hence, react pauses its execution
    and frees the main thread to handle the input.


    2. **Loading sequences**: Have you ever seen applications where you see the loading
    spinner just for a split second even though you’re on a fast connection? The concurrent
    mode also solves that problem.


    3. **Concurrency**: Last but not least, react can now work truly concurrently,
    i.e. it can work on multiple state updates simultaneously. This means that if
    you have some I/O bound data (HTTP network requests) to bring in some data, React
    can skip over the data for a while and render views. When the data arrives, React
    can simply place it there. Current standard practice is that we block the whole
    view from rendering if data is not available.


    Concurrent react makes code fetching, data fetching and resource fetching truly
    concurrent, and if the browser supports, parallel too. As of now, concurrent react
    is experimental and not stable except for code splitting. So we’ll not be using
    code examples for unstable APIs.


    # Opting in concurrent mode


    The concurrent mode in React is opt-in right now. To use it, instead of:


    ```

    ReactDOM.render(<Component />, container)

    ```


    Use the following:


    ```

    ReactDOM.createRoot(container).render(<Component />)

    ```


    Now you’re running React in concurrent mode. This API only exists in the experimental
    build, and it is very much possible that in the future you might not need this.


