- md: "## Client-Side React\n\nReact is a client-side library. However, in the above\
    \ SSR react, we've seen that we could write React-like markup on a server and\
    \ send it to our client machine using a static router-based system. But in the\
    \ process, we lost the actual “React” code on the frontend. Let's bring it back.\n\
    Let's create another file called `client.js`, and write the following code inside\
    \ it:\n\n```\nimport React from 'react'\nimport ReactDOM from 'react-dom'\nimport\
    \ Home from './components/Home'\nimport About from './components/About'\nimport\
    \ { BrowserRouter as Router, Route, Switch } from 'react-router-dom'\n\nconst\
    \ jsx = (\n<Router>\n<Switch>\n<Route path=\"/\" component={Home} exact={true}\
    \ />\n<Route path=\"/about\" component={About} exact={true} />\n</Switch>\n</Router>\n\
    )\n\nconst app = document.getElementById('root')\nReactDOM.hydrate(js, app)\n\
    ```\n\nWe would place this file with the server.js file. And just to be clear\
    \ on the file structure, here are all the files organized till now:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_95_0.png)\n\
    \nFigure 5.9\n\nThe preceding screenshot shows the file structure organized in\
    \ the project. What you would’ve seen in the preceding code, is that we’re using\
    \ something called ReactDOM.hydrate instead of ReactDOM.render, we would come\
    \ to this later in this section.\n\nFirst, let us set up other things. We would\
    \ also modify our server.js file to include our client.js file. This is how the\
    \ server.js file should look finally:\n\n```\nconst express = require(\"express\"\
    )\nconst app = express()\nconst React = require(\"react\")\nconst ReactDOMServer\
    \ = require(\"react-dom/server\")\nconst { StaticRouter, Switch, Route } = require(\"\
    react-router-dom\")\nconst Home = require('./components/Home')\nconst About =\
    \ require('./components/About')\n\napp.use(express.static(path.resolve(__dirname,\
    \ '../dist')))\n\napp.get('/*', (req, res) => {\n  console.log(req.url)\n  const\
    \ jsx = (\n    <StaticRouter location={req.url}>\n      <Switch>\n        <Route\
    \ path=\"/\" component={Home} exact={true} />\n        <Route path=\"/about\"\
    \ component={About} exact={true} />\n      </Switch>\n    </StaticRouter>\n  )\n\
    \  const reactDom = ReactDOMServer.renderToString(jsx)\n  res.send(template(reactDom))\n\
    });\n\napp.listen(1337)\n\nfunction template(reactDom) {\n  return `\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>React SSR</title>\n\
    </head>\n<body>\n<div id=\"root\">${reactDom}</div>\n<script src=\"./app.bundle.js\"\
    ></script>\n</body>\n</html>\n  `\n}\n```\n\nFocus on lines in bold. Firstly,\
    \ in the express server, we're configuring to serve our static files (that is,\
    \ the client-side bundle file which we created above). Then we included the script\
    \ itself in the HTML response.\n\n## ReactDOM.hydrate\n\nInstead of making use\
    \ of ReactDOM.render, we're making use of ReactDOM.hydrate. ReactDOM.hydrate,\
    \ as the name says, just *hydrates* the existing layout, it doesn't create the\
    \ layout and replaces it in DOM. ReactDOM.hydrate knows that the layout string\
    \ is coming from the server, so it just needs to sync the client-side JS (i.e.\
    \ events and listeners) with the coming server-side HTML code. Hence, we make\
    \ use of the hydrate method.\n\nOne interesting thing here to note is that `ReactDOM.hydrate`\
    \ expects the layout you provide on the frontend (in `client.js`) to be close\
    \ to that coming from the backend (`server.js`), otherwise it’ll create problems\
    \ for you.\nFinally, let’s set up webpack for frontend so that we can make use\
    \ of the import/export syntax and actually use React on the frontend.\nWe already\
    \ installed webpack earlier, so just go ahead and create a `webpack.config.js`\
    \ file like this:\n\n```\nconst path = require('path')\nmodule.exports = {\n \
    \ mode: 'development',\n  devtool: 'source-map',\n  entry: {\n    app: './src/client.js',\n\
    \  },\n  module: {\n    rules: [\n      {\n        test: /\\.jsx?$/,\n       \
    \ exclude: /(node_modules|bower_components)/,\n        loader: \"babel-loader\"\
    ,\n      }\n    ],\n  },\n  output: {\n    path: path.resolve(__dirname, 'dist'),\n\
