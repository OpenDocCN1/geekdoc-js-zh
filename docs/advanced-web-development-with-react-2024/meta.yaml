    background_color\": \"#ffffff\"\n}\n```\n\nLet's go on these properties quickly:\n\
    \n- `short_name`/`name`: These are used for naming your application. At least\
    \ one of them must be specified (you can specify both). If you specify both, `short_name`\
    \ would be used in places with limited space, like the toolbar (you can see above\
    \ in the screenshot, the toolbar holds the title React App and not Create React\
    \ App Sample).\n- `icons`: As the prop name says, these are the icons used for\
    \ your application and what the end-user sees.\n- `start_url`: This URL is the\
    \ URL where your app should start when it is launched. Usually, you’ll just want\
    \ to keep it to your root URL, or you can pass in some query parameters to track\
    \ when your app is opened. For example, passing `/?utm_source=app_opened` would\
    \ allow you to track how many times your PWA is opened.\n- `display`: This allows\
    \ you to set how your app should be launched. Because PWA is a web app anyway,\
    \ it’s launched inside a browser instance only. Here are the values and what they\
    \ do:\n\n| value | Description |\n|---|---|\n| fullscreen | Opens the app in fullscreen\
    \ mode |\n| standalone | Opens the app in a native-looking app window |\n| minimal-ui\
    \ | Similar to fullscreen, but provides more UI elements for controlling navigation\
    \ |\n| browser | Opens your URL in the browser |\n\nIf you want the Add to Home\
    \ Screen Prompt we just saw above, your display value should be set to standalone\
    \ only.\n\n- `theme_color`: This is the color of the toolbar of the application.\n\
    - `background_color`: This is the splash screen background color (for mobile phones)\
    \ when the app is launched.\n\nYou can, in fact, generate your own `manifest.json`\
    \ file easily using online tools like https://app-manifest.firebaseapp.com/.\n\
    \n### Service workers\n\nThink of a service worker as a JavaScript file sitting\
    \ between your application and the network layer. That means, whenever your browser\
    \ tries to connect to the network (URL owned by you), that passes through a service\
    \ worker file. Similarly, when there’s a response back from the network (your\
    \ server), that goes through the service worker before it is received by your\
    \ app. One important thing to note is that service workers, just like web workers,\
    \ run in a separate thread (that doesn’t mean that JS is multithreaded), so your\
    \ UI is never blocked.\n\n## Lifecycle\n\nHere’s a good image showing how service\
    \ workers’ lifecycle looks like:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_175_0.png)\n\
    \n*Figure 8.6*\n\nIn our case, once the service worker is activated, it starts\
    \ fetching static resources and starts caching them for local/offline use. Let's\
    \ look at our build folder. In the build folder, we have a file called service-worker.js,\
    \ which imports the following two scripts at the top:\n\n```\nimportScripts(\"\
    https://storage.googleapis.com/workbox-cdn/releases/4.3.1/workbox-sw.js\");\n\
    importScripts(\n  \"/precache-manifest.01aeacade56ec22296e752a5407421fc.js\"\n\
    );\n```\n\nThe first script is a Workbox script. Workbox is a set of JavaScript\
    \ libraries built by Google over the existing raw PWA API to provide flexible\
    \ methods and ways to implement features like caching in your PWA and eliminates\
    \ a lot of boilerplate.\n\nThe second script is a create-react-app generated file,\
    \ and if you open it, you'll see it consists of static resources (HTML files,\
    \ CSS files, JavaScript files and images) your app is using with their absolute\
    \ URL paths. Finally, at the last, the service-worker.js file contains the following\
    \ snippet:\n\n```\nself.__precacheManifest = [].concat(self.__precacheManifest\
    \ || []);\nworkbox.precaching.precacheAndRoute(self.__precacheManifest, {});\n\
    workbox.routing.registerNavigationRoute(workbox.precaching.getCacheKeyForURL(\"\
    /index.html\"), {\n  blacklist: [/^\\/_/,/[^\\/?]+\\.[^\\/]+$/],\n});\n```\n\n\
    In short, this script registers all the routes described in our precache-manifest\
    \ file to the service worker and tells them to cache these resources. Since React\
    \ applications are effectively **Single Page Applications (SPA)**, we use the\
    \ registerNavigationRoute method of the workbox.routing API to send our index.html\
    \ file on any route hit our app receives from the user. This allows React to take\
    \ control of the routing system again and do the needful internal routing using\
    \ react-router or whatever implementation is present.\n\n## PWA using Next.js\n\
    \nNow that we have a decent understanding of what a PWA is and how it works basically\
    \ let’s shift our focus to how we can implement PWA using Next.js. Let’s start\
    \ by creating a simple Next.js project. You can setup Next.js manually as we did\
    \ in the last chapters, or we can just make use of a handy create-next-app utility\
    \ like this to do the same:\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_177_0.png)\n\
    \n*Figure 8.7*\n\nThis would basically initialize our setup in the same way we\
    \ did before. Once that is done, we need to install another package called next-offline.\
    \ This would enable service worker support for our app and eventually support\
    \ for PWA.\n\n```\nnpm install --save next-offline\n```\n\nThis would install\
    \ the next-offline package. Once that is done, create a new file called next.config.js\
    \ in the project, and this is what would go inside that file:\n\n```\n// next.config.js\n\
    const withOffline = require('next-offline')\nconst nextConfig = {}\nmodule.exports\
    \ = withOffline(nextConfig)\n```\n\nThere is a lot of default configuration which\
    \ the next-offline package uses, and by default, we can safely stick to it. Basically,\
    \ what the withOffline function would do, is that it would inject a service worker\
    \ script with the passed options when the bundle for Next.js is prepared. Let’s\
    \ build our next project using `npm run build`. In the build folder, we’ll see\
