    # Setting up Redux + Next.js


    First, let’s install `redux` and `next-redux-wrapper` which would provide Redux.js
    wrapper for Next.js projects. Install the package on your systems using the following
    command:


    ```

    npm install react-redux redux next-redux-wrapper --save

    ```


    Next, we’ll set up our Redux store. Think of how we set up the default state in
    the case of Context API. This is very similar to those lines. A store is basically
    a centralized place for all of your components to store their data and retrieve
    data from that particular area.


    Because it is centralized and decoupled from your components, there could be problems
    reading/writing values to that area;hence, there has to be a streamlined way to
    access only the values a component needs to read.


    Similarly, if you want to write (update) the redux state, you cannot do it directly.
    You have to write a **reducer** for it, that is, something that reduces your state.
    Once you write a reducer for your store, you can then write **dispatchers**. These
    functions are called dispatchers because they dispatch certain actions to these
    reducers, and these reducers on receiving those actions, update the state accordingly
    depending on what actions they received. The following diagram shows how Redux
    architecture works in a nutshell:'
