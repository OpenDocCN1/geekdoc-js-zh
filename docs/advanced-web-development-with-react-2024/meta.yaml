- md: "For Windows, follow the steps to install the latest stable versions of node\
    \ and npm:\n\n1. Go to [https://nodejs.org/en/download/](https://nodejs.org/en/download/).\n\
    2. Download the **Windows Installer (.msi)** file. Choose according to your operating\
    \ system - 32 bit or 64 bit.\n3. Follow the wizard instructions and complete the\
    \ installation.\n4. Verify your installation by opening cmd from the **Start**\
    \ menu.\n5. Type node -v in cmd and check if it displays a number.\n\n## Linux\n\
    \nFor Linux, follow the steps to install the latest stable versions of node and\
    \ npm:\n\n1. Open your command line (terminal).\n2. Write sudo apt-get update\
    \ && sudo apt-get install npm.\n3. Depending on your distribution, you might not\
    \ have apt-get as the package manager. Just find out what your package manager\
    \ is, and install the npm package from the official repository.\n4. Once it completes,\
    \ write the following: sudo npm install -g n.\n5. This will install a node version\
    \ manager package called n on your systems.\n6. Once this completes, write: sudo\
    \ n stable.\n7. This would finally install a stable release of both, node and\
    \ npm, and add it to your path as well.\n8. Finally, quit your terminal and start\
    \ again. This time write node -v, and see a version number pop up. You’re good\
    \ to go now!\n\n## macOS\n\nIf you have a macOS system, here are the steps you\
    \ need to follow in order to get node and npm on your systems:\n\n1. On macOS,\
    \ you need a brew package manager. If you don’t know what it is, you probably\
    \ don’t have that installed. Write the following in your command line to install\
    \ the brew package manager: /usr/bin/ruby -e \"$(curl -fsSL [https://raw.githubusercontent.com/Homebrew/install/master/install](https://raw.githubusercontent.com/Homebrew/install/master/install))\"\
    .\n2. You can find the brew installation instructions here as well: [https://brew.sh](https://brew.sh).\n\
    3. Once the brew is installed, write brew install node.\n4. Wait for it to install.\n\
    5. You’re done!\n\n## Setting up React projects\n\nNow, let us discuss of the\
    \ various ways in which we could bootstrap our React project. We’ll start with\
    \ the most barebones method first, and gradually proceed towards more advanced\
    \ methods.\n\n### #1 – Setting up with CDN\n\nThis is the most straightforward\
    \ way to write Hello World in React. You just throw in the React libraries using\
    \ some CDN website, and you’re good to go. For example, consider the following\
    \ code:\n\n```html\n<!doctype HTML>\n<html>\n<head>\n<title>React hello world</title>\n\
    </head>\n<body>\n<div id=\"root\"></div>\n<script\nsrc=\"https://unpkg.com/react@16/umd/react.production.min.js\"\
    >\n</script>\n<script src=\"https://unpkg.com/react-dom@16/umd/react-dom.production.min.js\"\
    ></script>\n<script src=\"https://unpkg.com/babel-standalone@6/babel.min.js\"\
    >\n</script>\n\n<script type=\"text/babel\">\n    class HelloWorld extends React.Component\
    \ {\n        render() {\n            return (<p>Hello world</p>);\n        }\n\
    \    }\n\nReactDOM.render(\n  <HelloWorld />,\n  document.getElementById('root')\n\
    );\n</script>\n</body>\n</html>\n```\n\nA lot is happening in this code. Let us\
    \ break this down quickly:\n\n1. Firstly, we’re loading two scripts—react itself\
    \ and react-dom. Why 2? Well, as you can see that React itself isn’t just limited\
    \ to the web. You see React being used on mobile phones as well using React Native.\
    \ That means React is independent of the **Document Object Model (DOM)**, a construction\
    \ which the browser uses to render HTML. Because we’re working with web pages,\
    \ we need the core library, that is, React, plus we need the reconciler that would\
    \ glue React and DOM (browser) together, hence React DOM.\n2. Then we load a library\
    \ called **babel** (more on this in next points).\n3. Finally, you can see that\
    \ we create a script tag with the type `text/babel`. This is because we’re not\
    \ going to write pure JavaScript in this script tag. We’ll write some code that\
    \ needs to be pre-processed, before being executed as regular JavaScript.\n4.\
    \ Finally, we see some React constructs (classes and ReactDOM), but we’ll ignore\
    \ it for now. What is interesting is that we wrote `<p>Hello world</p>` directly,\
    \ without any quotes. This is not an error. It is, in fact, JSX (more on this\
    \ will follow).\n\n### #2 – Using create-react-app\n\ncreate-react-app is a tool\
    \ that allows very quick bootstrapping of React projects with minimal configuration\
    \ to be done by the end-user. To use it:\n\n1. Open your terminal again (cmd on\
    \ Windows or Terminal on macOS/Linux).\n2. Write `npm install create-react-app\
    \ -g`.\n3. Once that is completed, write `create-react-app hello-world`.\n4. Let\
    \ it complete. Once it does, you’ll see a directory named `hello-world`. `cd hello-world`\
    \ and write `npm start`.\n5. This will start your local development server. Open\
    \ the folder in your favorite text editor, and a browser window would open automatically.\
    \ There onwards, you can make your changes and see them reflecting directly in\
    \ the browser.\n\n### #3 – Setting up from scratch\n\nThis is a bit advanced for\
    \ starting with React but setting this up means that you are fine-tuning and controlling\
    \ every aspect of your React application. We’ll follow a model like create-react-app,\
    \ but this time all the configuration files and folders would be visible to us:\n\
    \n1. Create a new folder called `hello-world-scratch`:\n   `cd hello-world-scratch`\n\
    2. Then do a `npm init -y`, which would create a `package.json` file in that directory.\
    \ This file is responsible for handling your project dependencies.\n3. Then do\
    \ `npm install react react-dom -save`.\n4. This will install react and react DOM\
    \ libraries (just like we discussed above) and would mark them as “*need-at-production*”\
    \ dependencies (that is, we’ll need React and ReactDOM even when we’re shipping\
    \ the application).\n5. Finally, do `npm install webpack webpack-dev-server webpack-cli\
    \ @babel/core babel-loader @babel/preset-env @babel/preset-react html-webpack-plugin\
    \ --save-dev`.\n6. This will install all the devDependencies, the dependencies\
    \ you need while coding the application, but not on production. We’ll breakdown\
    \ the need for these dependencies now:\n   - **Webpack:** Webpack is a module\
    \ bundler system. Simply speaking, it combines various assets of yours (JS, CSS,\
    \ and so on), so that you can freely write your code in a maintainable way (i.e.\
    \ clean and different files) and could later automate the combination and compression\
    \ of the code.\n   - `webpack-cli` enables webpack to perform this.\n   - `webpack-dev-server`\
    \ enables us to launch a server to see the output of the code.\n   - `html-webpack-plugin`\
    \ would allow us to dynamically generate an HTML page for react scripts to work\
    \ on. Don't worry, we'll be mostly working with JavaScript files, so we don't\
    \ need to statically create HTML files anyway.\n   - `@babel` packages run the\
    \ JSX transformations into normal, executable JavaScript code (more on JSX below).\n\
    7. Once you do that, in your project directory in the command line, do `touch\
    \ .babelrc`.\n8. It'll create a dotfile called `.babelrc` (notice the dot at the\
    \ front of the filename).\n9. Paste the following content inside it: `{ \"presets\"\
    : [\"@babel/preset-env\", \"@babel/preset-react\"] }`.\n10. This tells babel to\
    \ use the following presets, before working on the React code. Simply speaking,\
    \ it loads a bunch of pre-defined rules to babel about how it should handle JSX.\n\
    11. Finally, because webpack is the main bundler of our project, we need to tell\
    \ the webpack to let babel handle the steering wheel on the appropriate files.\
    \ Here's how we do that:\n    - Create a file called `webpack.config.js` in your\
    \ project's root, and write the following in it:\n\n```javascript\nconst path\
    \ = require('path');\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\n\
    \nmodule.exports = {\n  entry: path.join(__dirname, 'src/index.js'),\n  output:\
    \ {\n    path: path.join(__dirname, 'bundle'),\n    filename: 'bundle.js'\n  },\n\
    \  module: {\n    rules: [\n      {\n        test: /\\.(js|jsx)$/,\n        exclude:\
    \ /node_modules/,\n        use: ['babel-loader']\n      }\n    ]\n  },\n  mode:\
    \ process.env.NODE_ENV || 'development',\n  resolve: {\n    extensions: ['*',\
    \ '.js', '.jsx']\n  },\n  devServer: {\n    contentBase: path.join(__dirname,\
    \ 'src')\n  },\n  plugins: [new HtmlWebpackPlugin({\n    template: path.join(__dirname,\
    \ 'src/index.html')\n  })]\n};\n```\n\n    - This simply tells the webpack that\
    \ hey webpack, load babel whenever you’re processing a .js or .jsx file.\n   \
    \ - We need to launch a webpack dev server when we want to see the output, so\
    \ we’ll add this to the scripts key to the package.json file: `\"start\": \"webpack-dev-server\
    \ --open\"`.\n    - Now we’ll create a static HTML file for this, to use in `src/index.html`:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n    <title>React\
    \ Hello World!</title>\n</head>\n<body>\n    <div id=\"root\"></div>\n</body>\n\
    </html>\n```"
  mdcn: "\n对于Windows系统，请按照以下步骤安装Node.js和npm的最新稳定版本：\n\n1.  访问[https://nodejs.org/en/download/](https://nodejs.org/en/download/)。\n\
    2.  下载**Windows安装程序 (.msi)** 文件。请根据您的操作系统选择32位或64位版本。\n3.  按照向导指示完成安装。\n4.  通过**开始**菜单打开cmd，以验证您的安装。\n\
    5.  在cmd中输入`node -v`，并检查是否显示版本号。\n\n## Linux\n\n对于Linux系统，请按照以下步骤安装Node.js和npm的最新稳定版本：\n\
    \n1.  打开您的命令行（终端）。\n2.  输入`sudo apt-get update && sudo apt-get install npm`。\n\
    3.  根据您的发行版，您可能没有`apt-get`作为包管理器。只需找出您的包管理器是什么，并从官方仓库安装npm包。\n4.  完成后，输入以下命令：`sudo\
    \ npm install -g n`。\n5.  这将在您的系统上安装一个名为`n`的Node版本管理器包。\n6.  完成后，输入：`sudo n stable`。\n\
    7.  这最终将安装Node.js和npm的稳定版本，并将其添加到您的路径中。\n8.  最后，退出终端并重新启动。这次输入`node -v`，您将看到版本号出现。现在一切就绪！\n\
    \n## macOS\n\n如果您使用的是macOS系统，以下是将Node.js和npm安装到系统上的步骤：\n\n1.  在macOS上，您需要brew包管理器。如果您不知道它是什么，很可能尚未安装。在命令行中输入以下命令以安装brew包管理器：`/usr/bin/ruby\
    \ -e \"$(curl -fsSL [https://raw.githubusercontent.com/Homebrew/install/master/install](https://raw.githubusercontent.com/Homebrew/install/master/install))\"\
    `。\n2.  您也可以在此处找到brew的安装说明：[https://brew.sh](https://brew.sh)。\n3.  安装brew后，输入`brew\
    \ install node`。\n4.  等待安装完成。\n5.  搞定！\n\n## 设置React项目\n\n现在，让我们讨论一下引导React项目的各种方法。我们将从最基础的方法开始，逐步介绍更高级的方法。\n\
    \n### #1 – 使用CDN设置\n\n这是用React编写“Hello World”最直接的方式。您只需通过一些CDN网站引入React库，就可以开始了。例如，考虑以下代码：\n\
    \n```html\n<!doctype HTML>\n<html>\n<head>\n<title>React hello world</title>\n\
    </head>\n<body>\n<div id=\"root\"></div>\n<script\nsrc=\"https://unpkg.com/react@16/umd/react.production.min.js\"\
    >\n</script>\n<script src=\"https://unpkg.com/react-dom@16/umd/react-dom.production.min.js\"\
    ></script>\n<script src=\"https://unpkg.com/babel-standalone@6/babel.min.js\"\
    >\n</script>\n\n<script type=\"text/babel\">\n    class HelloWorld extends React.Component\
    \ {\n        render() {\n            return (<p>Hello world</p>);\n        }\n\
    \    }\n\nReactDOM.render(\n  <HelloWorld />,\n  document.getElementById('root')\n\
    );\n</script>\n</body>\n</html>\n```\n\n这段代码中有很多内容。让我们快速分解一下：\n\n1.  首先，我们加载了两个脚本——React本身和React-DOM。为什么是2个？嗯，正如您所看到的，React本身不仅限于Web。您也会看到React通过React\
    \ Native在移动设备上使用。这意味着React独立于**文档对象模型 (DOM)**，这是浏览器用来渲染HTML的构造。由于我们处理的是网页，我们需要核心库（即React），以及一个将React和DOM（浏览器）粘合在一起的协调器，因此有了React\
    \ DOM。\n2.  然后我们加载了一个名为**babel**的库（更多内容将在后续要点中介绍）。\n3.  最后，您可以看到我们创建了一个`type`为`text/babel`的script标签。这是因为我们不会在这个标签中编写纯JavaScript。我们将编写一些需要预处理的代码，然后才能作为常规JavaScript执行。\n\
    4.  最后，我们看到了一些React构造（类和ReactDOM），但现在我们先忽略它们。有趣的是，我们直接写了`<p>Hello world</p>`，没有任何引号。这不是错误。实际上，这是JSX（更多内容将随后介绍）。\n\
    \n### #2 – 使用create-react-app\n\ncreate-react-app是一个工具，允许以最少的配置非常快速地引导React项目。使用方法如下：\n\
    \n1.  再次打开您的终端（Windows上为cmd，macOS/Linux上为Terminal）。\n2.  输入`npm install create-react-app\
    \ -g`。\n3.  完成后，输入`create-react-app hello-world`。\n4.  等待完成。完成后，您将看到一个名为`hello-world`的目录。执行`cd\
    \ hello-world`并输入`npm start`。\n5.  这将启动您的本地开发服务器。在您喜欢的文本编辑器中打开该文件夹，浏览器窗口将自动打开。之后，您可以进行更改，并直接在浏览器中看到它们的反映。\n\
    \n### #3 – 从头开始设置\n\n对于开始使用React来说，这有点高级，但设置这个意味着您正在微调和控制React应用程序的各个方面。我们将遵循类似create-react-app的模型，但这次所有配置文件和文件夹都将对我们可见：\n\
    \n1.  创建一个名为`hello-world-scratch`的新文件夹：\n    `cd hello-world-scratch`\n2.  然后执行`npm\
    \ init -y`，这将在该目录中创建一个`package.json`文件。此文件负责处理项目依赖项。\n3.  然后执行`npm install react\
    \ react-dom -save`。\n4.  这将安装React和ReactDOM库（就像我们上面讨论的那样），并将它们标记为“*生产环境必需*”的依赖项（也就是说，即使在发布应用程序时我们也需要React和ReactDOM）。\n\
    5.  最后，执行`npm install webpack webpack-dev-server webpack-cli @babel/core babel-loader\
    \ @babel/preset-env @babel/preset-react html-webpack-plugin --save-dev`。\n6. \
    \ 这将安装所有devDependencies，即您在编写应用程序代码时需要但不在生产环境中需要的依赖项。我们现在来分解这些依赖项的用途：\n    - \
    \  **Webpack:** Webpack是一个模块打包器系统。简单来说，它将您的各种资源（JS、CSS等）组合在一起，这样您就可以以可维护的方式（即清晰、分离的文件）自由编写代码，然后可以自动组合和压缩代码。\n\
    \    -   `webpack-cli`使得webpack能够执行此操作。\n    -   `webpack-dev-server`使我们能够启动服务器以查看代码的输出。\n\
    \    -   `html-webpack-plugin`允许我们动态生成一个HTML页面，供React脚本使用。别担心，我们主要处理JavaScript文件，所以无论如何我们都不需要静态创建HTML文件。\n\
    \    -   `@babel`包将JSX转换为普通的、可执行的JavaScript代码（更多关于JSX的内容将在下面介绍）。\n7.  完成后，在命令行的项目目录中，执行`touch\
    \ .babelrc`。\n8.  它将创建一个名为`.babelrc`的点文件（注意文件名前面的点）。\n9.  将以下内容粘贴到其中：`{ \"presets\"\
    : [\"@babel/preset-env\", \"@babel/preset-react\"] }`。\n10. 这告诉babel在处理React代码之前使用以下预设。简单来说，它为babel加载了一堆预定义规则，说明应如何处理JSX。\n\
    11. 最后，因为webpack是我们项目的主要打包器，我们需要告诉webpack让babel来处理适当文件的转向。具体操作如下：\n    -   在项目根目录中创建一个名为`webpack.config.js`的文件，并在其中写入以下内容：\n\
    \n```javascript\nconst path = require('path');\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\n\
    \nmodule.exports = {\n  entry: path.join(__dirname, 'src/index.js'),\n  output:\
    \ {\n    path: path.join(__dirname, 'bundle'),\n    filename: 'bundle.js'\n  },\n\
    \  module: {\n    rules: [\n      {\n        test: /\\.(js|jsx)$/,\n        exclude:\
    \ /node_modules/,\n        use: ['babel-loader']\n      }\n    ]\n  },\n  mode:\
    \ process.env.NODE_ENV || 'development',\n  resolve: {\n    extensions: ['*',\
    \ '.js', '.jsx']\n  },\n  devServer: {\n    contentBase: path.join(__dirname,\
    \ 'src')\n  },\n  plugins: [new HtmlWebpackPlugin({\n    template: path.join(__dirname,\
    \ 'src/index.html')\n  })]\n};\n```\n\n    -   这简单地告诉webpack：嘿，当你处理.js或.jsx文件时，加载babel。\n\
    \    -   我们需要在想要查看输出时启动webpack开发服务器，因此我们将此添加到`package.json`文件的scripts键中：`\"start\"\
    : \"webpack-dev-server --open\"`。\n    -   现在我们将为这个创建一个静态HTML文件，用于`src/index.html`：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n    <title>React\
    \ Hello World!</title>\n</head>\n<body>\n    <div id=\"root\"></div>\n</body>\n\
    </html>\n```\n"
