    Awesome! Let’s use CSS modules now. We can switch the site’s behaviour to use
    CSS modules, which means that the class names would be randomized so that there’s
    no collision between the same class names in different components. Let’s see how
    this is done. Change the next.config.js file to the following:


    ```

    // next.config.js

    constwithCSS = require(''@zeit/next-css'')

    module.exports = withCSS({

    cssModules: true

    })

    ```


    Once you do this and restart the server, you’ll see that your About link is no
    longer yellow even though it has a special class in the HTML markup. This is because
    now you have CSS modules in place, and the class name “special” has been rewritten
    by the CSS module system. Now, in order to apply a class to a particular element,
    you have to use the imported styles. Change the Header.js file as follows:


