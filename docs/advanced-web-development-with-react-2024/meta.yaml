    \nDon’t forget to place your icons as well in the .next folder! Finally, to serve\
    \ our manifest.json file, we need to include it as a link tag in every page (just\
    \ like we did with React example above). Let’s do that using the _document.js\
    \ file in Next.js.\n\n### _document.js\n\nThis file inside the pages folder allows\
    \ us to inject our custom markup in various places (like the head of the page).\
