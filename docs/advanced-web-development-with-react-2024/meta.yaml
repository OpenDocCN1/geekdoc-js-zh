  mdcn: "\n## 设置 Redux + Next.js\n\n首先，我们来安装 `redux` 和 `next-redux-wrapper`，它们将为 Next.js\
    \ 项目提供 Redux.js 的封装器。使用以下命令在你的系统上安装该包：\n\n```\nnpm install react-redux redux next-redux-wrapper\
    \ --save\n```\n\n接下来，我们将设置我们的 Redux store。回想一下我们使用 Context API 时设置默认状态的方式。这与此非常相似。store\
    \ 本质上是一个集中化的场所，供你所有的组件存储数据并从该特定区域检索数据。\n\n因为它集中化且与你的组件解耦，所以读取/写入该区域的值可能会存在问题；因此，必须有一种精简的方法，让组件只能访问它需要读取的值。\n\
    \n同样，如果你想写入（更新）redux 状态，你不能直接这样做。你必须为它编写一个 **reducer**，也就是一个能缩减你状态的东西。一旦你为 store\
    \ 编写了 reducer，你就可以编写 **dispatchers**。这些函数被称为 dispatcher，是因为它们向这些 reducer 分发特定的动作，而\
    \ reducer 在接收到这些动作后，会根据接收到的动作相应地更新状态。下图简要展示了 Redux 架构的工作原理：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_143_0.png)\n\
    \n**图 7.7**\n\n如果这让你感到困惑，别担心。当我们再次讲解这个内容，但这次使用代码时，它会变得更容易理解。现在让我们看看我们的 reducer\
    \ 代码：\n\n1.  在项目目录下的 redux 文件夹（创建 redux 文件夹）中创建一个名为 reducer.ts 的文件。以下是 reducer\
    \ 代码：\n\n```\n// reducer.ts\ntype Action = {\n  type: string\n  payload?: any\n\
    }\nexport type UserDetails = {\n  name: string\n  age: number\n  favQuote: string\n\
    }\nexport type State = {\n  user: UserDetails | null\n}\nconst defaultState: State\
    \ = {\n  user: null\n}\nconst reducer = (state: State = defaultState, action:\
    \ Action) => {\n  switch (action.type) {\n    case 'SET_USER_DETAILS':\n     \
    \ return {\n        ...state,\n        user: <UserDetails>action.payload\n   \
    \   }\n    default:\n      return state\n  }\n}\nexport default reducer\n```\n\
    \n这里，你可以看到我们正在创建一个 Redux store 和 reducer。如上所述，store 是一个存储数据的地方，而 reducer 是一个使用某些分发的动作来更新\
    \ store 的函数。让我们来了解一下这段代码是如何工作的：\n\n- 首先，我们定义了一些 TypeScript 类型。\n- 然后我们创建了一个 `reducer`\
    \ 函数。\n- `reducer` 函数接受两个参数，第一个是实际的应用程序状态，它由 redux 在 reducer 被调用之前自动填充。\n- 第二个参数是\
    \ action。我们的任务只是通过 dispatcher 函数分发这些动作。Redux 会自动调用 `reducer` 函数。\n- 这个 action\
    \ 实际上是一个对象，由一个 type 和一个 payload 组成。\n- type 属性定义了这个 action 应该更新什么。\n- payload\
    \ 属性是一些你可以传递给 reducer 以更新状态的额外数据。\n\n文件结构如下所示：\n\n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_145_0.png)\n\
    \n*图 7.8*\n\n上面的截图显示了当前的文件结构。\n\n2.  完成以上步骤后，现在我们必须在应用中集成 Redux。我们使用特殊的 pages/_app.js（或者实际上是\
    \ _app.tsx）文件来完成。现在让我们来讨论它。\n\n## _app.js 文件\n\n根据文档：\n\n- Next.js 使用 App 组件来初始化页面\n\
    - 要覆盖它，请创建 ./pages/_app.js 文件并覆盖 App 类\n\n基本上，这个文件允许你覆盖 Next.js 用于提供页面的一些默认配置。由于我们希望\
    \ Redux 在每个页面上都可用，我们可以在这个特定的文件中包裹 Redux 的 Provider（就像我们包裹 Context API 的 provider\
    \ 一样）。\n\n因为我们使用的是 TypeScript，我们将创建一个名为 _app.tsx 的文件来代替。让我们继续创建它：\n\n```\n// pages/_app.tsx\n\
    import React from 'react'\nimport { createStore, Store, compose } from 'redux'\n\
    import { Provider } from 'react-redux'\nimport withRedux from 'next-redux-wrapper'\n\
    import reducer, { State } from '../redux/reducer'\nimport { NextPage } from 'next'\n\
    import { NextComponentType, NextPageContext } from\n'next/dist/next-server/lib/utils'\n\
    let devTools = (f: any) => f\nif(process.browser) {\n  const _window = window\
    \ as any\n  if(_window.__REDUX_DEVTOOLS_EXTENSION__) {\n    devTools = _window.__REDUX_DEVTOOLS_EXTENSION__()\n\
    \  }\n}\nconst makeStore = (initialState: State) => {\n  return createStore(reducer,\
    \ initialState, compose(devTools))\n}\ntype Props = {\n  Component: NextComponentType<NextPageContext>,\n\
    \  pageProps: any,\n  store: Store\n}\nconst MyApp: NextPage<Props> = props =>\
    \ {\n  const { Component, pageProps, store } = props\n  return (\n    <Provider\
    \ store={store}>\n      <Component {...pageProps} />\n    </Provider>\n```\n"
