  md: 'JSX transformation


    React compiles down JSX to normal ES5 code. Consider the following example:


    ```

    const elem = <div className="a-classy-div">JSX seems so cool!</div>

    ```


    This example is compiled to the following:


    ```

    const elem = React.createElement(''div'', { className: ''a-classy-div'', ''JSX
    seems so cool!'' })

    ```


    The latter definitely looks like a valid JavaScript syntax. This is the magic
    of JSX. You get a visual aid of writing the React components, because now you
    can easily avoid the cumbersome, additional JavaScript code that you have to write
    for the UI part.


    In fact, the preceding two code snippets are the same, which means that instead
    of JSX you could directly write that React.createElement part. But of course,
    JSX is much cleaner to eyes than the barebones JS, for UI development.


