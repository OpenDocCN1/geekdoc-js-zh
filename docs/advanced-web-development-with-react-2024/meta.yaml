    return {\nsomeprop: 'customvalue'\n}\n}\n\nexport default AboutPage\n```\n\n加粗的行是我们在这个文件中所做的更改。注意我们是如何向\
    \ AboutPage 添加一个名为 getInitialProps 的函数的。这个函数在组件挂载之前运行，正如你所见，这个函数应该返回一个 Promise。因此，你也可以在里面做各种异步活动，以及设置我们的\
    \ Redux 存储（稍后会详细介绍）。因为这是从 Next.js 中出来的，所以它是同构的，既在服务器端运行，也在客户端运行。\n\n在浏览器中，它产生以下输出：\n\
