    - Now when you click on the **About** link, it’ll seamlessly navigate to the about
    page.


    Now, let’s explore more about this Link component and how it is different from
    the one we’re used to seeing with react-router-dom.


    # Link is just HoC


    If you’re coming from the react-router-dom Link component, you might confuse this
    Link with that one. In react-router-dom, you could actually pass props to that
    component itself, and it’ll turn into a hyperlink and use those props (like className,
    onClick, and so on). But with the Link API provided by Next.js, it is just a Higher
    Order Component, that is, it just glues your child component to the click event
    of history API changes. It won’t pass down the props you supply to it, to the
    children, and hence you have to make whatever changes you want to make on the
    child, and not on the Link component.


    For example, consider the following code snippet. This is wrong way of assigning
    a class to the anchor tag:


    ```

    <p>Click <Link href="/about" className="mylink"><a>here</a></Link> to go to about
    page</p>

    ```


    In fact, if you run the preceding code, you’ll see that you don’t get myLink class
    attached to your anchor tag.


    This is the correct way to add class to that anchor tag:


    ```

    <p>Click <Link href="/about"><a className="mylink">here</a></Link> to go to about
    page</p>

    ```'
