    \ React.\n\nThese are some of the many reasons you could go with Next.js if you’re\
    \ willing to opt into an SSR solution using React.\n\n### Installation\n\nLet’s\
    \ begin by setting up Next.js for our project.\n\n1. Create a directory named\
    \ react-ssr-next\n2. Using the command line, cd into that directory\n3. Run the\
    \ following commands:\n\n```\nnpm init -y\nnpm install react react-dom next --save\n\
    ```\n\nThese commands basically setup your package.json file and install the required\
    \ dependencies. Did you notice that we only needed three packages in total? The\
    \ react, react-dom, and the next package!\n\n4. Finally, go ahead and make these\
    \ changes to your package.json file's scripts section, so it looks like this:\n\
    \n```\n\"scripts\": {\n  \"dev\": \"next\",\n  \"build\": \"next build\",\n  \"\
    start\": \"next start\"\n}\n```\n\nSo, your package.json file would look more\
    \ or less like the following (your version numbers might be different):\n\n```\n\
    {\n  \"name\": \"nextjs\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\"\
    ,\n  \"scripts\": {\n    \"dev\": \"next\",\n    \"build\": \"next build\",\n\
    \    \"start\": \"next start\"\n  },\n  \"keywords\": [],\n  \"author\": \"\"\
    ,\n  \"license\": \"ISC\",\n  \"description\": \"\",\n  \"dependencies\": {\n\
    \    \"next\": \"^9.1.1\",\n    \"react\": \"^16.9.0\",\n    \"react-dom\": \"\
    ^16.9.0\"\n  }\n}\n```\n\n5. Now, we would create a pages directory inside the\
    \ root folder. This is required by the Next.js framework.\n6. Let's go ahead and\
    \ do npm run dev in the same directory.\n\nIt’ll spin up Next.js processes. But\
    \ because our pages directory is empty, we don’t have any page to serve yet.\n\
    \nAnyway, it’ll give us a URL with a bunch of information: http://localhost:3000:\n\
    \n![](img/bf8e5efd984d24a77d8cd00bdb613e5b_112_0.png)\n\n*Figure 6.1*\n\nIn the\
    \ preceding screenshot, we can see that running `npm run dev` starts a development\
    \ Next.js server for us to use.\n\n7. On navigating to localhost:3000 however,\
