    # Switching to TypeScript


    TypeScript has proven itself to be a very reliable method writing JavaScript on
    the scale, and almost every codebase after hitting a certain scale would suffer
    from the common JavaScript pitfalls like no type checking support. TypeScript
    comes very handily in this sense. It compiles down to JavaScript, at the same
    time allows us to use the best version of JavaScript for developers to write.


