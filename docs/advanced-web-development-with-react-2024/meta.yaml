    \ worker?\n4. What is the function of the file _document.js in Next.js framework?\n\
    5. How does a custom Next.js server differ from a custom API endpoint programmed\
    \ in Next.js?\n\n## CHAPTER 9\n\n## Bleeding Edge React\n\nReact has come a long\
    \ way since its launch in 2013. Today, React has one of the biggest developer\
    \ communities all over the world. React is continuously improving and developing,\
    \ as we speak. This chapter would cover some of the bleeding edge features of\
    \ React, which are either still in the works or are in very experimental stages\
    \ right now in the React framework, and is definitely going to shape the future\
    \ of the framework, and the community as a whole. Let’s dive into it!\n\n### Structure\n\
    \n- How React works\n  - Reconciler\n  - Renderer\n- Concurrent Mode\n- How concurrent\
    \ mode works\n- Opt-in concurrent mode\n- React Suspense\n\n### Objective\n\n\
    In the final chapter, we’ll see some things React has been working on for the\
    \ future. The concurrent mode is a big thing, which is experimentally available\
    \ at the moment for the developers to try out. We’ll learn about that in this\
    \ chapter.\n\n### How does React work?\n\nBefore diving deep into the fundamentals\
    \ of the new technology, it’s important to make ourselves aware of how React works\
    \ anyway. On a higher level, React consists of a reconciler and a renderer. A\
    \ reconciler is a way how React handles the virtual implementation of the DOM\
    \ tree inside its memory. Let’s look at an example first in vDOM.\n\n### Reconciler\n\
    \nVirtual DOM is how React maintains a copy of the original DOM the browser shows\
    \ the end-user, in its own memory. React reconciler handles the creation of this\
    \ tree in memory only. Note that this tree still doesn’t know which environment\
    \ it is in. For example, when you write the following JSX code:\n\n```jsx\n<div\
    \ className=\"myClass\">\n  <h1>Hello World</h1>\n  <p>This is a nice paragraph</p>\n\
    </div>\n```\n\nThis gets transpiled by Babel into the following:\n\n```javascript\n\
    React.createElement(\"div\", {\n  className: \"myClass\"\n}, React.createElement(\"\
    h1\", null, \"Hello World\"),\nReact.createElement(\"p\", null, \"This is a nice\
    \ paragraph\"));\n```\n\nWhich is further, gets represented as the following in\
    \ memory:\n\n```json\n{\n  \"type\": \"div\",\n  \"key\": null,\n  \"ref\": null,\n\
    \  \"props\": {\n    \"className\": \"myClass\",\n    \"children\": [\n      {\n\
    \        \"type\": \"h1\",\n        \"key\": null,\n        \"ref\": null,\n \
    \       \"props\": {\n```"
