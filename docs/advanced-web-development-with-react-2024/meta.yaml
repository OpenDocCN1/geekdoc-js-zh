  mdcn: "\n## 你好，这是主页！前往[关于页面](/about)\n\n现在，当你访问主页并点击关于链接时，它将不会像以前那样重新加载页面，而是无刷新地导航到\
    \ /about 页面路由。同样，如果你直接访问 /about 页面，服务器将只为你获取 /about 页面的内容，这同样可以在源代码中看到。\n\n这就是服务器端渲染！\n\
    \n## 获取数据\n\n虽然使用 React 的 SSR 很棒，但你经常会遇到某些方面的困难，因为有些功能只在浏览器环境中可用，而有些只在 Node 环境中可用。其中之一就是如何获取数据。\n\
    \n让我们利用一个名为 isomorphic-fetch 的包，它允许我们在两种环境中使用 fetch：\n\n```\nnpm install isomorphic-fetch\
    \ --save\n```\n\n现在，让我们修改我们的 Home.js 文件，使其看起来像这样：\n\n```\n// Home.js\nconst React\
    \ = require('react')\nconst { Link } = require('react-router-dom')\nrequire('isomorphic-fetch')\n\
    const { useEffect, useState } = React\nfunction Home(props) {\n  const [data,\
    \ setData] = useState(null)\n  useEffect(() => {\n    fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
    \ => data.json())\n    .then(data => setData(data))\n  }, [])\n  if(!data) return\
    \ <p>Loading...</p>\n  return <div className=\"home\">\n    <h2>{data.title}</h2>\n\
    \    <p>{data.body}</p>\n    <Link to=\"/about\">About</Link>\n  </div>\n}\nmodule.exports\
    \ = Home\n```\n\n注意这里；我们使用了 hooks。由于 useEffect hook 在组件挂载后运行，因此其中的代码在服务器上无论如何都不会执行。所以我们可以直接使用\
    \ fetch 而不需要 isomorphic-fetch 库，但目前我们仍将使用它。\n然后我们最终获取数据并在客户端显示：\n\n![客户端数据获取](img/bf8e5efd984d24a77d8cd00bdb613e5b_101_0.png)\n\
    \n前面的截图显示了我们如何在客户端获取数据。到目前为止，看起来也不错。但我们还能做得更好吗？如何在服务器端（在 Node 环境中）本身获取数据，然后将其发送给客户端呢？服务器是强大的计算机，可以为常用资源实现强大的缓存，这可以大大加快速度。然而，正如我们即将看到的，同步服务器端状态和客户端状态开始变得令人头疼。\n\
    \n## 在服务器上获取数据\n\n因此，我们的想法是，通过一个属性公开特定组件想要的所有数据，然后在我们将 JSX 渲染为字符串之前，解析所有的 promises\
    \ 和数据获取。最后，我们将以某种方式同步状态和 React 代码。让我们简要看看我们将如何做到这一点。让我们看看更新后的 Home.js 文件。请稍等片刻：\n\
    \n```\n// Home.js\nconst React = require('react')\nconst { Link } = require('react-router-dom')\n\
    require('isomorphic-fetch')\nconst { useEffect, useState } = React\nfunction Home(props)\
