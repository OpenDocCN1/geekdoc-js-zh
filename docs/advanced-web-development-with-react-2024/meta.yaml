    \ go over what is happening here:\n\n- Because this script is directly executed\
    \ by node, it doesn’t pass through webpack or babel, so you have to use CommonJS\
    \ imports here.\n- Then we bring in the Node’s createServer method from the http\
    \ package to create a custom server.\n- We also import the package next. Here’s\
    \ how the next API works.\n\n### next(config: object)\n\nThe config object consists\
    \ of the following:\n\n- dev: A Boolean indicating the development/production\
    \ mode (default: false)\n- dir: Location where the project is present (default:\
    \ '.')\n- quiet: Whether to hide error messages containing server info (default:\
    \ false)\n- conf: Next.js configuration object (same object which is read from\
    \ next.config.js file)\n\nThis returns us the app object, which has a bunch of\
    \ methods associated with it for custom routing. We’ll only look at getRequestHandler\
    \ and serveStatic though.\n\n### getRequestHandler()\n\nThis method basically\
    \ allows Next to handle routing just like default way, so in essence, when we\
    \ don't want our custom logic to take place, we'll call this method with the appropriate\
    \ req and res objects from the createServer method.\n\nIt returns us another function,\
    \ handle, which can be called using the request and response objects coming from\
    \ our server.\n\n### serveStatic()\n\nWe use another package called url to parse\
    \ the URL into different parts—hostname, pathname, protocol, port, and so on.\n\
    \nFinally, we check, if the pathname actually matches /service-worker.js. If yes,\
    \ we use the app.serveStatic() method. Basically, we pass in the req and res objects\
    \ with the path where to resolve the static asset to. In our case, our file service-worker.js\
    \ is present inside the .next folder as a direct child, so we just use path.join\
    \ to get the path directly.\n\nOnce that is done, we'll need to make a bunch of\
    \ changes to our package.json file too. Your scripts section inside the JSON file\
    \ should look like this:\n\n```json\n\"scripts\": {\n  \"dev\": \"node server.js\"\
    ,\n  \"build\": \"next build\",\n  \"start\": \"NODE_ENV=production node server.js\"\
    \n}\n```\n\nFinally, let's create a manifest.json file similar to last time and\
    \ place it in the .next folder and add a custom route for it. So the manifest.json\
    \ file would look like:\n\n```json\n{\n  \"short_name\": \"React App\",\n  \"\
    name\": \"Create React App Sample\",\n  \"icons\": [\n    {\n      \"src\": \"\
    favicon.ico\",\n      \"sizes\": \"64x64 32x32 24x24 16x16\",\n      \"type\"\
    : \"image/x-icon\"\n    },\n    {\n      \"src\": \"logo192.png\",\n      \"type\"\
    : \"image/png\",\n      \"sizes\": \"192x192\"\n    },\n    {\n      \"src\":\
    \ \"logo512.png\",\n      \"type\": \"image/png\",\n      \"sizes\": \"512x512\"\
    \n    }\n  ],\n  \"start_url\": \".\",\n  \"display\": \"standalone\",\n  \"theme_color\"\
    : \"#000000\",\n  \"background_color\": \"#ffffff\"\n}\n```\n\nAnd our server.js\
    \ file would look like:\n\n```javascript\nconst { createServer } = require('http')\n\
    const { join } = require('path')\nconst { parse } = require('url')\nconst next\
    \ = require('next')\nconst app = next({ dev: process.env.NODE_ENV !== 'production'\
    \ })\nconst handle = app.getRequestHandler()\napp.prepare()\n.then(() => {\n \
    \ createServer((req, res) => {\n    const parsedUrl = parse(req.url, true)\n \
    \   const { pathname } = parsedUrl\n    // handle GET request to /service-worker.js\n\
    \    if (pathname === '/service-worker.js' || pathname === '/manifest.json' ||\
    \ pathname === '/logo512.png' || pathname === '/logo192.png') {\n      const filePath\
    \ = join(__dirname, '.next', pathname)\n      app.serveStatic(req, res, filePath)\n\
    \    } else {\n      handle(req, res, parsedUrl)\n    }\n  })\n  .listen(3000,\
