- md: "2. The action object consists of type as string and payload as any value. (You\
    \ could narrow this down even more by specifying stricter types for type and payloads).\n\
    3. Now, on the basis of the type, we have certain cases, if the type is SET_THEME,\
    \ we do update the state and return it. This becomes our updated state. How? That\
    \ is done by the useReducer hook which we’ll see in a minute.\n4. Finally, we\
    \ have our old StateContext, but this time, instead of holding just the state,\
    \ our context holds two values. The state and a dispatch function.\n5. The state\
    \ is our original state object, and dispatch is a method which is used to update\
    \ the state. You see, here, we don’t interact with the state directly, instead,\
    \ we send certain “actions” which in turn update the state.\n\nWe initialize the\
    \ dispatch method with a garbage function, but we’ll overwrite that eventually\
    \ when we’re using the context provider, so it doesn’t matter.\n\nNow, coming\
    \ back to Component1.tsx file, this is how it would look like:\n\n```javascript\n\
    import React, { useReducer } from 'react'\nimport Header from './Header'\nimport\
    \ Content from './Content'\nimport Footer from './Footer'\nimport './global.css'\n\
    import { Provider, defaultState, reducer } from './state'\nconst Component1: React.FC\
    \ = () => {\n  const [state, dispatch] = useReducer(reducer, defaultState)\n \
    \ return (\n    <Provider value={{ state, dispatch }}>\n      <Header />\n   \
    \   <Content />\n      <Footer />\n    </Provider>\n  )\n}\nexport default Component1\n\
    ```\n\nNow you can see we’re making use of a new hook called useReducer. What\
    \ this hook does is, it returns us an array with two elements in it, just like\
    \ we had for useState hook. The first element is the state, and the second element\
    \ is the dispatch function.\n\nOne major difference here between useState and\
    \ useReducer is that with useState, your second function is the setter of your\
    \ state, that is, whatever you pass as the argument in the function in case of\
    \ useState gets set as the state, whereas in useReducer, whenever you call dispatch\
    \ method, useReducer calls your reducer on it, and then whatever you return from\
    \ the reducer method gets set as the state. Consider this:\n\n```javascript\n\
    const [state, setState] = useState(0)\nsetState(1) // <- sets the state variable\
    \ to 1\nconst [state, dispatch] = useReducer(reducer, 1)\ndispatch({ type: 'do\
    \ something', value: 100 }) // Now reducer is called\n// behind the scenes: reducer(state,\
    \ { type: 'do something', value: 100 }) -> returns 101\n// state becomes 101\n\
    ```\n\nThis is important for large data management, as now you could have much\
    \ finer control over your data flow.\nLet’s now update other files to work accordingly\
    \ with the useReducer hook:\n\n## Footer.tsx:\n\n```javascript\nimport React,\
    \ { useContext } from 'react'\nimport { context } from './state'\nconst Footer:\
    \ React.FC = () => {\n  const { state: { logo } } = useContext(context)\n  return\
    \ (\n    <footer>\n      <p>Copyright &copy; Me.</p>\n      <img src={`https://codedamn.com/assets/images/${logo}.png`}\
    \ />\n    </footer>\n  )\n}\nexport default Footer\n```\n\n## Header.tsx:\n\n\
    ```javascript\nimport React, { useContext } from 'react'\nimport { context } from\
    \ './state'\nconst Header: React.FC = () => {\n  const { state: { name } } = useContext(context)\n\
    \  return (\n    <header>\n      <h1>Welcome to my site!</h1>\n      <p>Hello\
    \ {name}</p>\n    </header>\n  )\n}\nexport default Header\n```\n\n## RightArticle.tsx:\n\
    \n```javascript\nimport React, { useContext } from 'react'\nimport { context }\
    \ from './state'\nconst RightArticle: React.FC = () => {\n  const { state: { theme\
    \ }, dispatch } = useContext(context)\n  function toggleTheme() {\n    if(theme\
    \ === 'dark') {\n      dispatch({ type: 'SET_THEME', payload: 'light' })\n   \
    \ } else {\n      dispatch({ type: 'SET_THEME', payload: 'dark' })\n    }\n  }\n\
    \  return (\n    <article>\n      <h2>This is my site!</h2>\n      <p>It is very\
    \ nice</p>\n      <p>The mode right now is: {theme}</p>\n      <button onClick={toggleTheme}>Click\
    \ here to turn on dark mode</button>\n    </article>\n  )\n}\nexport default RightArticle\n\
    ```\n\nSee how we're making use of the dispatch function above? That calls our\
    \ reducer on it, and our reducer modifies the state which is propagated to the\
    \ components using it!\n\nAnd Sidebar.tsx:\n\n```javascript\nimport React, { useContext\
    \ } from 'react'\nimport { context } from './state'\nconst Sidebar: React.FC =\
    \ () => {\n  const { state: { logo } } = useContext(context)\n  return (\n   \
    \ <aside>\n      <h2>Wow this is a nice sidebar</h2>\n      <p>See my logo</p>\n\
    \      <img src={`https://codedamn.com/assets/images/${logo}.png`} />\n    </aside>\n\
    \  )\n}\nexport default Sidebar\n```\n\nOnce we complete all these changes, we'll\
    \ see that we still have the same output on the screen. But consider this. It's\
    \ now so easy to implement even more stateful things in the application. For example,\
    \ let's say you want to change the logged in name on clicking of a button.\nYou'll\
    \ simply get to the dispatch method in any component and dispatch an action with\
    \ a type, say, CHANGE_USERNAME and a payload of whatever you wish to do.\n\nNow\
    \ in a completely different file, that is, state.tsx you’ll add to your reducer\
    \ what you wish to do when action is CHANGE_USERNAME as follows:\n\n```javascript\n\
    switch(type) {\n// ..\n  case 'CHANGE_USERNAME':\n    return {\n      ...state,\n\
    \      name: payload\n    }\n// ..\n}\n```\n\nAnd you’re done! It couldn’t get\
    \ more streamlined than this!\n\n## Conclusion\n\nIn this chapter, we learned\
    \ about how we could leverage inbuilt React solutions like Context API to implement\
    \ very streamlined state management without any external libraries. In the further\
    \ chapters, we’ll be looking at how to use more sophisticated technologies with\
    \ React to achieve even more.\n\n## Questions\n\n1. What is Context API from React?\n\
    2. How does useReducer hook work?\n3. What is Context.Consumer? How does Context.Provider\
    \ differs from Context.Consumer?\n\n# CHAPTER 5\n\n# Server Side React\n\nSo far\
    \ we've seen how React works on the frontend, various ways to work with React,\
    \ managing state with it and even created a little working front page for us!\
    \ There's so much more we could do we react, especially once we move it to the\
    \ server-side. Now it is strange to think about React on the server, at least\
    \ it was for me when I was first introduced to the concept! What does it even\
    \ mean to use React on a server? And what benefits does it provide us? We'll answer\
    \ everything on this and more in this chapter. Let's get started.\n\nIn this chapter\
    \ we'll explore how we can move React to a server, essentially using Node.js to\
    \ render React code before we send it to the browsers so that we give users and\
    \ search engine crawlers a seamless experience in seeing our content immediately.\n\
    \n## Structure\n\n- Server-side rendering\n- Why it is required\n- Hello world\
    \ with SSR\n- How ReactDOMServer works\n- Adding more components to SSR\n- Routing\n\
    - Hydrating ReactDOM\n- Fetching data\n\n## Objective\n\nThis chapter aims to\
    \ introduce you to the concept of server-side rendering using React and discuss\
    \ why it is a good option to go about if you're just starting off with a project\
    \ and need SEO and performance to be of no-compromise-area. We'll see how we can\
    \ do Hello World with React SSR by creating a very simple project, and then proceed\
    \ to add more and more functionality to it. Finally, we would conclude with the\
    \ strong argument why it is a good idea to choose a server-side rendering framework\
    \ like Next.js for React to work on medium to large scale SSR apps built with\
    \ React.\n\n## React on Server\n\nCurrently, what happens when you use a react\
    \ application is the following:\n\n1. You visit the page (let’s say http://example.com)\n\
    2. The page makes a request to the remote server.\n3. The remote server sends\
    \ you just a little HTML response like this:\n\n![HTML Response](img/bf8e5efd984d24a77d8cd00bdb613e5b_84_0.png)\n\
    \n4. Your browser understands this request, and if you look closely, you’ll see\
    \ that the request contains no readable content whatsoever. It is just linking\
    \ to a bunch of CSS and JS files only.\n5. Your browser downloads those JS files.\n\
    6. Your browser parses and runs those JS files (which is actually React code you\
    \ wrote)\n7. Depending on the React code, your browser makes another HTTP request\
    \ to the server to bring in the data required by the React app.\n8. Finally, when\
    \ the data is available, first meaningful content render is done to the user.\n\
    9. The DOM is now populated with all the HTML you expect to see. Here’s an example\
    \ from codedamn.com which uses React:"
  mdcn: "\n2. 操作对象由字符串类型的 `type` 和任意值类型的 `payload` 组成。（你可以通过为 `type` 和 `payload` 指定更严格的类型来进一步限定）。\n\
    3. 现在，基于 `type`，我们有特定的情况。如果类型是 `SET_THEME`，我们就更新状态并返回它。这成为了我们更新后的状态。如何做到？这正是通过\
