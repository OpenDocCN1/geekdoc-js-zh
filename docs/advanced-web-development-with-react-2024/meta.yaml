    Now you can see we’re making use of a new hook called useReducer. What this hook
    does is, it returns us an array with two elements in it, just like we had for
    useState hook. The first element is the state, and the second element is the dispatch
    function.


    One major difference here between useState and useReducer is that with useState,
    your second function is the setter of your state, that is, whatever you pass as
    the argument in the function in case of useState gets set as the state, whereas
    in useReducer, whenever you call dispatch method, useReducer calls your reducer
    on it, and then whatever you return from the reducer method gets set as the state.
    Consider this:


    ```

    const [state, setState] = useState(0)

    setState(1) // <- sets the state variable to 1

    const [state, dispatch] = useReducer(reducer, 1)

    dispatch({ type: ‘do something’, value: 100 }) // Now reducer is called

    // behind the scenes: reducer(state, { type: ‘do something’,

    value: 100 }) -> returns 101

    // state becomes 101

    ```


    This is important for large data management, as now you could have much finer
    control over your data flow.

