    >\n<h1>About</h1>\n<p>This is the about page</p>\n<p>\n<Link href=\"/\">\n<a>Go\
    \ home {props.someprop}</a>\n</Link>\n</p>\n</Layout>\n)\nAboutPage.getInitialProps\
