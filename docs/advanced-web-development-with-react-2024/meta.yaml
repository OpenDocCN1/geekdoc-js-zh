    \ of the box and is extremely easy to set up.\n\nYou could compare Next.js ease-of-setup\
    \ that to of create-react-app. Just like how cumbersome it is to set up a React\
    \ project manually, in the last chapter, we saw that it is equally cumbersome\
    \ to set up a React SSR project manually. Next.js to the rescue!\n\n### Why Next.js?\n\
    \nFrom their official site, here are some points explaining why it is a good choice:\n\
