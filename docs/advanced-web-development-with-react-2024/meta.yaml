    # Renderer


    React’s second part is the react renderer. Now, DOM is one of the host environments
    which could use React. There are other host environments as well, like React Native
    (for mobile), or maybe React Hardware. Renderers basically allow the reconciler
    to talk to the host environment.

    For example, with DOM, we know that an element is created using document.createElement
    API exposed by browsers. This might not be the case with a mobile host, say Android.
    There, you would have to use some other way to create a UI element on the screen,
    but does it affect the reconciler in any way? No! That is why it is a great decision
    to split the reconciler and renderer into different packages. When you install
    react for web pages, you install the package react and react-dom. Here, the package
    react is basically the reconciler, and the package react-dom is renderer.'
