    # Chapter 8: Progressive Web Apps


    In the last chapter, we learned about Next.js technology and how it is powering
    the SSR world of React today. When web apps meet native apps, a different type
    of application is born, which is Progressive Web App. We’ll learn all about PWAs
    in this chapter and see how to create one using React as our primary frontend
    library.


    ### Structure


    - What is **Progressive Web App (PWA)**

    - Getting started with PWA

    - manifest.json File

    - Service workers

    - PWA using Next.js

    - Custom server with Next.js


    ### Objective


    In this chapter, our main aim would be to understand what progressive web apps
    are and how to set them up with our React and Next.js projects. Along the way,
    we’ll learn more about these technologies.


    ### What is a progressive web app?


    A progressive web app is a web app eventually, but a bit better. It uses modern
    web features to deliver great user experience, similar to the one you’ll experience
    using a native app. Some features of a progressive web app:


    1.  Responsive: Obviously, your app should be fit for all screens and sizes, and
    fortunately, these days creating a responsive site (or converting an existing
    site to responsive design) is not very hard unless the code is very old.

    2.  Independent of the internet: Your PWA would be working with something called
    service workers (more on this later) which enables them to work offline or on
    low-speed internet connections.

    3.  HTTPS: PWA works on HTTPS only.

    4.  Installable: Your PWA can be installed as a regular app on phones (and as
    a chrome browser app).

    5.  Linkable: Can be shared with a simple URL


    ## Hello World


    Let’s create a new React project with create-react-app and start implementing
    our PWA. We’ll start with a simple way using TypeScript:


    ```bash

    create-react-app pwa-app --typescript

    ```


    Once it’s ready, we’ll see a file structure something like this:


    ![](img/bf8e5efd984d24a77d8cd00bdb613e5b_169_0.png)


    *Figure 8.1*


    Let’s look at the following bolded lines in our src/index.tsx file:


    ```typescript

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import ''./index.css'';

    import App from ''./App'';

    import * as serviceWorker from ''./serviceWorker'';

    ReactDOM.render(<App />, document.getElementById(''root''));

    // If you want your app to work offline and load faster, you can change

    // unregister() to register() below. Note this comes with some pitfalls.

    // Learn more about service workers: https://bit.ly/CRA-PWA

    serviceWorker.unregister();

    ```


    We''re importing a file we''re calling serviceWorker. We''ll come to what service
    workers are shortly, but for now, let''s change the unregister method call to
    register and build the app using:


    ```bash

    npm run build

    ```


    This would create a build folder in your project''s root directory. Now, run a
    simple local development server inside this directory. This depends on what dependencies
    you have installed. If you have python installed (installed by default on macOS
    and Linux), run the following command inside the build folder:


    ```bash

    python -m SimpleHTTPServer 1234 # for python 2

    ```


    If you''re using python3, use the following bash command:


    ```bash

    python3 -m http.server 1234

    ```


    If you have PHP command line installed, you can also start a local development
    server by:


    ```bash

    php -S localhost:1234

    ```


    Make sure to run all these commands when you''re inside the build folder on the
    command line as they''ll serve as the root directory of http://localhost:1234.


    Now, let''s go ahead and visit the site localhost:1234. Nothing too strange, except
    for two things. If we look at the **Network Requests** tab in Chrome DevTools,
    we''ll see some special files being requested which have a gear icon in front
    of them (known as service workers):


    ![](img/bf8e5efd984d24a77d8cd00bdb613e5b_171_0.png)


    **Figure 8.2**


    And the other thing is we see a little add icon (+) in Chrome''s Omnibox:


    ![](img/bf8e5efd984d24a77d8cd00bdb613e5b_171_1.png)


    **Figure 8.3**


    Clicking on that reveals a dialog box prompting to add this application to chrome
    as if we''re installing some sort of application to our browser! Let''s add this:


    ![](img/bf8e5efd984d24a77d8cd00bdb613e5b_171_2.png)


    **Figure 8.4**'
