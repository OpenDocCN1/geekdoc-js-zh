  md: 'For Windows, follow the steps to install the latest stable versions of node
    and npm:


    +   1. Go to [https://nodejs.org/en/download/](https://nodejs.org/en/download/).

    2. Download the **Windows Installer (.msi)** file. Choose according to your operating
    system - 32 bit or 64 bit.

    3. Follow the wizard instructions and complete the installation.

    4. Verify your installation by opening cmd from the **Start** menu.

    5. Type node -v in cmd and check if it displays a number.


    # Linux


    For Linux, follow the steps to install the latest stable versions of node and
    npm:


    +   1. Open your command line (terminal).

    2. Write sudo apt-get update &&sudo apt-get install npm.

    3. Depending on your distribution, you might not have apt-get as the package manager.
    Just find out what your package manager is, and install the npm package from the
    official repository.

    4. Once it completes, write the following: sudonpm install -g n.

    5. This will install a node version manager package called n on your systems

    6. Once this completes, write: sudo n stable.

    7. This would finally install a stable release of both, node and npm, and add
    it to your path as well.

    8. Finally, quit your terminal and start again. This time write node -v, and see
    a version number pop up. You’re good to go now!


    # macOS


    If you have a macOS system, here are the steps you need to follow in order to
    get node and npm on your systems:


    +   1. On macOS, you need a brew package manager. If you don’t know what it is,
    you probably don’t have that installed. Write the following in your command line
    to install the brew package manager: /usr/bin/ruby -e “$(curl -fsSL [https://raw.githubusercontent.com/Homebrew/install/master/install](https://raw.githubusercontent.com/Homebrew/install/master/install))”.'
