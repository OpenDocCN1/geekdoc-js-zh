    \ You\ncan see redux uses the name of our reducer (i.e. user in this case) as\
    \ the\nname of the store as well.\n\n## Dispatching Redux Actions\n\nIn order\
    \ to change the state in the Redux store, we need to dispatch actions.\nActions\
    \ inform redux that there is a change in conditions and state should be\nmodified\
    \ somehow. However, it is not necessary that a dispatch should\nalways update\
    \ the state. Let’s create a new file called `redux/actions.ts`\nwhich would have\
    \ the following code:\n\n```\nimport { UserDetails } from './reducer'\nexport\
    \ const setUserDetails = (payload: UserDetails) => {\n  return { type: 'SET_USER_DETAILS',\
    \ payload }\n}\n```\n\nAnd now, we would use this action in our root page. Let’s\
    \ update\n`pages/index.tsx` to the following:\n\n```\nimport React, { useState\
    \ } from 'react'\nimport { NextPage } from 'next'\nimport './styles.css'\nimport\
    \ { connect } from 'react-redux'\nimport { setUserDetails } from '../redux/actions'\n\
    type Props = {\nsetUserDetails(json: any): void\nname?: string\n}\nconst IndexPage:\
    \ NextPage<Props> = (props) => {\n  const [username, setUsername] = useState<string>('')\n\
    \  const [password, setPassword] = useState<string>('')\n  async function submitForm()\
