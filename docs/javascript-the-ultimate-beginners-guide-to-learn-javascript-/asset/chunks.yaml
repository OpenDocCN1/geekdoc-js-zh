    取决于你使用的主机类型，使用标签方法可能会对你来说更容易。当你使用这种方法甚至链接方法时，你会想要确保你已经保存了存入其中的信息。在平台上进行工作时，你可以保存正在处理的工作，而无需向访问者展示未完成的产品。如果你正在开发网站，你的网站将不会显示为已上线，访问者只会看到错误信息或空白页面。


    一旦你完成了工作并添加了所有你需要的 `JavaScript`（并在此过程中进行了保存），你就可以发布它了。在你决定在主机上对该页面使用 `publish`
    函数之前，访问者不会看到你所做的更改或你放入网站的 `JavaScript`。


    # 格式化它


    你可以对 `JavaScript` 中的不同内容进行格式化。你想要做的第一件事是使用 `JavaScript` 设计落地页。你可以通过 `alerts` 和
    `prompts` 实现这一点，也可以从一个“脚本背景”标签开始。你可以将背景设置为你喜欢的任何。它可以是纯色，也可以是你拍摄的照片。在将图片作为网页的背景时，请务必确保你拥有相应的权利。


    然后，你可以向页面添加各种不同的内容。你可以使用在人们访问你的页面时立即弹出的欢迎 `alert`。你还可以使用你学过的不同 `prompts`，确保人们知道他们在页面上应该做什么。


    一旦你完全学习了可以用于你网站的所有 `JavaScript`，你就可以开始更改人们首次访问你网站时的颜色和外观了。这将让你有机会确保某些事情看起来更好，并且它们是以正确的方式执行的。


    在完成网页的基础部分后再进行这样做是一个好主意。例如，在决定更改网页的颜色或字体之前，务要确保你已经使用 `JavaScript` 将所有信息都放在了网页上。在开始对你创建的页面进行任何类型的深度定制之前，始终务要确保你已经通过
    `JavaScript` 完成了所有可能的操作。


    # 作为模板使用


    在编写 `JavaScript` 时，要确保所有的格式都正确可能是困难的。由于完成所有这些工作非常耗时，你应该经常保存你的工作。如果你用 `JavaScript`
    制作了一个你喜欢的网页，可以将其保存为模板，稍后用于你在相同域名下甚至不同域名下创建的其他页面。这些可以作为模板或起始点，你可以在其基础上进行添加或调整，但你就不需要每次在创建一个新页面时都完全重写页面了。


    你编写 `JavaScript` 的经验越丰富，就越可能拥有许多这样的模板。你可能会有几个不同的模板，供你在拥有的不同页面中使用，这将让你有机会利用现有的工具做更多事情。它还会让你在开始制作网页时确保少做一些工作。除了这些模板，你还可以找到别人用
    `JavaScript` 制作的模板并使用它们。虽然这是一个快速起步绝佳“捷径”方法，但它并不会教你你所需的关于 `JavaScript` 的所有知识。


    你尽可能学习更多 `JavaScript` 知识的最简单方法是开始自己动手。即使你不需要网站或网页，也创建一个，以便在你学习如何利用这项技能完成更多事情时可以练习你的
    `JavaScript`。


    # 第 5 章：文档化 JavaScript


    如果你不记录你做了什么以及你所做的 `JavaScript` 起了什么作用，你永远无法完全掌握你在 `JavaScript` 中在做什么。请确保尽可能多地学习
    `JavaScript`，并始终跟踪你如何使用它以及你用它做了什么。这将向你展示你已经学了什么以及你还需要学习什么。它还可以作为你的参考字典，方便你跟踪你已经掌握的
    `JavaScript` 以及你学会如何做的 `JavaScript`。


    有两种记录记录方法。你可以在电脑上记录，也可以实时记录。如果你想在电脑上记录，请从打开一个 Word 文档或其他类型的处理文档开始。不要使用 `Notepad`
    文档，因为可能效果不好，并且最终可能会被标记。在学习时，把它写下来。如果你学习了许多 `JavaScript` 知识，开始以符合你逻辑的方式来组织文档。你可以通过简单的代码、不同的观察结果甚至
    `prompts` 来组织它。确保你包含了：


    - 如何编写背景代码

    - 如何更改字体颜色（或任何颜色）

    - 如何更改字体样式

    - 将内容移动到哪里

    - 如何创建一个 `alert` 并对其进行格式化

    - 如何创建一个 `prompt` 并对其进行格式化

    - 编写不同内容的方式的变化

    - 字体、对象甚至页面的尺寸


    你可以通过将 Word 文档组织成不同的“章节”并对其标记标签来实现这一点。这很容易，因为如果你在电脑上工作，它会一直带在身边，你将能够找到所需的确切指令，以确保你以正确的方式完成任务。


    你可以做的另一件事是将你的 `JavaScript` 文档放在电脑之外，放在“现实生活中”。你可以使用学科笔记本来跟踪信息。当你刚开始时，将其划分为不同的章节，如字体、警报和格式。当你学习不同的内容时，将它们添加到相应的章节中。


    ## 学习时


    当你学习更多关于 `JavaScript` 并发现可以使用不同的代码时，请把它们写下来。不要只是用过它们就忘记了。


    例如，当你学习如何使用 `JavaScript` 创建 `alert` 时，你可能在编码时就开始使用它了。这是一个确保你有大量练习的好极方法，但如果你忘记了是如何做的，你仍然需要回到这本书。把它写在不在你实际
    JavaScript 页面上的地方。


