    it is working right. You will need to save it to the file that it already was
    and then try to look at it when you are opening it up in a different browser.


    Being the Visitor


    The most important thing that you can do when you are testing out your JavaScript
    is to act as if you were a visitor to the website. Make sure that you feel like
    you are visiting it for the first time and that you click on every part of it
    so that you will know what you are looking for. Doing this will allow you to see
    the many different options on your site and to do different things when it comes
    to your site.


    Visit the web page and look around. See where you can click and what you can do.
    If you have set up variables and prompts, click on them and make sure that they
    are working right. Keep your eye out for any stray codes or letters that could
    be on the web site. Write down if you see any so that you will know to go back
    later on and change those. This is an easy way for you to figure out what you
    are doing with the site and what needs to be done to it.


    If you want to truly make sure that you are catching everything on the site, consider
    asking someone else to do that. The second pair of eyes will be helpful because
    it is not something that they have been looking at for hours and they will be
    able to pick out more mistakes that you may have made when you were writing the
    code. Be sure to let them know that your site isn’t finished and that you can
    do more with it if they help you.


    Issues that Come Up


    There are many issues that may come up when you look at your web page to test
    it out. The most common issues are ones that things are not written properly or
    are not in the right place for where you want them to be. For example, you need
    to make sure that your JavaScript is written the right way so that you can have
    it in the right place.


    Your prompt may not come up, or it may come up without an alert next to it. When
    it does come up, there could be problems. It could look different, there could
    be words that you didn’t want, or the code could be different depending on what
    you wanted to truly write out.


    Make sure that you write down all of the issues when you look at the site. This
    will save you time and will keep you from having to constantly switch between
    looking at the finished code and writing the code that will make it look that
    way when it is finished. If you are working on a computer and have a smartphone
    close by, you can even snap a few pictures of what you see when you visit the
    site so that you will be sure to know what it is that you are looking for when
    you go back to start writing again.


    Check for Errors


    The most common error that people make when they are writing code is that they
    capitalize the things that shouldn’t be or forget to capitalize something that
    should be. This is an error that will not only change the look of your site but
    one that could make it completely unrecognizable. Make sure that you always check
    your capitalization.


    There are some programs that are available that automatically capitalize the words
    that you have written even if they are programs that are designed specifically
    for making the codes and for coding into JavaScript. One program that will never
    capitalize things for you is Notepad. This lies among many other reasons as to
    why this is a great program for you to use especially if you are just starting
    out.


    If you have used the Notepad program and have made sure that everything is capitalized
    in the way that it should be, you can try other things that could be in your errors.
    Something may be misspelled, you may have used the wrong operator, or you may
    just have an issue with the way that things are written. It is not always that
    you are bad at writing code but that you may have slipped some extra letters into
    the code.


    Writing code is a very particular thing. You need to make sure that you are doing
    everything exactly right. One wrong letter or punctuation mark can make you unable
    to have a professional looking website. It can also mess up the way that your
    entire page looks when people come to visit it.


    Be Sure to Save


    If you are using the method of saving to a different file, you always need to
    make sure that you save it. Along with other errors, like bad capitalization or
    added letters, this is one of the most common problems that you will find when
    you are looking at your web page. Just make sure that you have saved everything
    and that it is in the way that you want it to be.


    Failing to save the file that you have just written the code into will not only
    cause your web page to appear flawed but you could possibly lose all of the work
    that you have just done. You need to make sure that you are saving it on a regular
    basis and that you are also saving it before you try to look at your web page.'
