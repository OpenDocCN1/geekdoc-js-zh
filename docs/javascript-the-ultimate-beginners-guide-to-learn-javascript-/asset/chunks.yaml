    ## 第 1 章：学习准备

    当你考虑学习如何编写 JavaScript 时，采取的最重要步骤是准备好学习你需要做的事情。准备工作的一部分包括了解 `JavaScript` 究竟是什么以及它是如何起源的。你还应该通过学习
    `JavaScript` 相比其他编程语言的优势，确保你真的为你的网站选择了正确的语言。


    ### 它是什么？

    `JavaScript` 是一种语言。它与你熟悉或听过的大多数语言不同，因为它以书面形式存在，并且基于技术。它是与网页另一端的人交流信息的方式，让你有机会确保你已经在网站上传达了你的观点。你不能“说”
    `JavaScript`。如果你这样做，听起来会断断续续的，而且可能没有意义。


    当你从网站的后端用 `JavaScript` 编写内容时，访问你网站的人看来，就像是你真的在上面写了东西。如果你不使用编程语言，你的网站看起来就像是许多随机的数字、符号和字母，这不仅会让访问者感到困惑，还可能对任何想要享受你网站的人产生不利影响。它可能会损害你通过该网站想要实现的目标。


    你可以使用许多不同的编程语言，但 `JavaScript` 是最流行的语言之一。它允许你更改字体的外观，添加可点击的按钮，并在当人们想在网站上执行不同的操作时，让你的网站具有完全的功能性。它也是你可以学习的最简单的编程语言之一。


    ### 它从哪里来？

    `JavaScript` 于 1995 年正式在操作系统上可用。这是它首次在计算机上使用的时候，`Netscape`（网景）是第一个意识到这种代码所功能的实体。它被用于帮助创建网页以及人们在使用个人和办公计算机时会看到的其他内容。


    由于该名称与其他不同类型的编码名称相似，某些程序选择将其命名为 `JScript` 而不是 `JavaScript`。这是制造操作系统的者的决定，但这种做法并没有流行起来。现在大多数公司都称其为
    `JavaScript`，它们不会与市场上的其他程序混淆，因为它已经与现在可用的一些其他事物大不相同。


    当 `JavaScript` 最初创建时，是为了让每个人都能使用它。在过去，在 1995 年之前，编码非常困难，很少有人知道这样做。它是一种罕见的东西。


    ### 有优势吗？

    在使用 `JavaScript` 带来的许多优势中，易用性是最大的之一。它允许人们利用现有的资源做更多事情，并提供了比市面上使用的任何其他语言更快学习编程语言的机会。


    `JavaScript` 几乎是不会出错的，因为之前已经有人创建了必要的开发工作，只需在需要的地方插入代码。虽然对于想要一直使用它的人，学习编写 `JavaScript`
    是重要的，但他们也可以直接使用已经编写的代码。任何人都可以以这种方式开始 `JavaScript`，因为它很容易用。


    其他优势还包括能够让网页元素变得可点击、创建交互式网页，以及利用 `JavaScript` 平台提供的功能做更多事情。任何知道并想使用 `JavaScript`
    的人都可以利用它来增加他们网站的外观。他们还可以利用它来帮助自己营造更加用户友好的氛围。


    总而言之，`JavaScript` 是最好的编程语言之一，因为人们可以轻松地使用它，并且因为它带了许多功能。对于刚开始编程的人来说，从 `JavaScript`
    开始是一个好主意。


    ### 你会使用它吗？

    几乎每个学习过 `JavaScript` 的人发现他们都会使用它。无论是在自己的网站上经常使用，还是帮助他人处理网站，`JavaScript` 确实非常有用。


