    ## 尝试更多


    当你测试了你的网站，并且一切都运行正常时，你可能想向它添加更多内容。你可以为它添加不同的提示框（prompts）和警告框（alerts），这会让它看起来更专业。它还将带给你一个机会来扩展页面，使其与你网站上的其他页面相匹配。你甚至可以编写代码将你的页面连接起来，并在访问者点击其中一个页面时，将他们引导到不同的页面。


    当你学会如何编写 `JavaScript` 时，你可以在网页上做很多更多事情。考虑一下当你尝试为网页添加不同选项时可以做的一切事情。你可能会发现，通过向网页中添加更多信息，你可以做更多，并从你的网站中获得更多。


    即使是最简单的命令，如 `alerts` 和 `prompts`，你也可以让你的页面变得多维度。始终尽力为页面添加更多内容，并不断学习关于 `JavaScript`
    的知识，这样你就能添加更多功能。


    ## 添加不同的变量


    虽然 `alerts` 和 `prompts` 非常棒，但你的网站需要的不仅仅是问人们想吃多少颗你的葡萄。它需要有不同的页面、不同的提示框，甚至有人们可以点击的不同按钮。在这些之中，你可能想要更改颜色、字体以及在页面上的位置。幸运的是，这些都是你通过
    `JavaScript` 可以实现的内容。


    一旦你掌握了 `JavaScript` 的基础及其工作原理，你就可以对它进行重大更改。你可以通过“文本颜色”标签以及“文本样式”字体来更改文本颜色。你可以使用
    `<b>`、`<u>` 和 `<i>` 标签对网站上的内容进行加粗、下划线和斜体处理。要停止使用这些标签，你只需要输入 `</style>` 或 `</b>`、`</u>`
    和 `</i>`。


    这些每一个操作都会让你的文本与众不同。你甚至可以使用标签来更改警告框的颜色、背景以及你的文本在页面上的位置方式。


    随着你学习更多 `JavaScript`，你会发现你的网页上执行不同事情的选项是完全无尽的。任何你想在页面上编写或更改的内容触手可及。是否能够使用这些不同的功能完全取决于你的想象力。


    不过，在进行这些操作之前，你需要确保你始终在测试你的网站。测试它以找出哪里出了问题。测试它以确保它看起来良好，并测试它以发现你还可以添加什么。随着你越来越熟悉
    `JavaScript`，你会发现测试是可以很有趣的，甚至可以让你在页面上做得更多。测试是确保你的网站出色的关键。


    ## 第 4 章：付诸行动


    如果没有人能看到那些页面，那么了解 `JavaScript` 和构建网页又有什么用呢？你和 `JavaScript` 之间可以做很多事情，但如果你想成功并让你的
    `JavaScript` 知识为你服务，你就需要能够将这一切付诸行动。采取以下步骤将你的 `JavaScript` 能力付诸实践。


    ### 获取网站


    如果你想让人们能够访问你的网站，你需要一个域名。那些没有使用你同一台电脑的人无法通过点击你创建的文件来看到你用创建的内容。即使你使用 `Notepad` 创建的
    `JavaScript` 是完美的，如果访问者无法通过网站查看它，他们也无法看到。


    你可以从许多不同的来源购买域名。有些平台，比如 `Goaddy`，以非常低的价格出售域名。这些通常是允许你为网站命名的域名，并确保你通过创建一些你能够提供给想要访问你网站的人的东西，从而获得最大价值。确保该域名是你和你和你的访问者都能轻松记住的。


    某些域名可能因为其流行程度而非常昂贵。例如，你可以使用你的名字作为域名，但 `joseph.com` 可能已经被占用，或者可能花费数千美元，因为它是一个非常受欢迎且可能耗费大量资金的东西。网站的变体，如
    `facebookses.com`，可能也很贵。如果你想要一些基础的，比如 `iliketocode.com`，价格可能会便宜一些，因为它们并不极端常见。


    研究一下你打算托管 `JavaScript` 的域名类型是一个好主意。这对于你的网站以及确保你的 `JavaScript` 能够被看到来说是非常重要的。找到一个与你的网页主题以及你希望人们在访问时看到的内容相匹配的域名是一个好主意。如果你刚刚开始学习
    `JavaScript` 和构建页面，考虑只从获取一个非常便宜的域名开始。即使它不是你喜爱的，它也将是你利用它练习 `JavaScript` 的绝佳方式。


    ### 使用托管主机


    互联网并不完全像你的电脑。你不能只是打开一个网页就开始在上面打字，除非你有一个域名。你需要确保你正在使用托管主机。托管主机将为你提供一个放置信息以及构建 JavaScript
    的平台。托管主机是信息进入的地方，而页面是人们访问网站时看到的内容。


    寻找与 `JavaScript` 兼容的托管主机。与其他某些编程语言不同，几乎所有的托管主机都能支持 `JavaScript`，因为它是一种通用编程语言。这意味着可以在任何类型的浏览器上使用，所以你选择的托管主机应该都能兼容。


    有很多不同的托管主机供你选择。对于所有这些主机，你都需要电脑上下载一些软件。最常见的是 `WordPress`。你只需要下载软件，就可以托管你的网站，`JavaScript`
    也可以被放入该托管主机中，以便你的访问者看到它。通过你的托管主机，你可以控制一切，包括你用于电脑的代码。


    ### 输入你的 JavaScript


    将你的 `JavaScript` 放入你为域名选择的托管主机中是整个过程中最重要的部分，特别是如果你想拥有一个功能完备的网站。你的网站应该呈现在访问者面前，并且应该比网络上提供的其他选项更好。确保你尽力将你的
    `JavaScript` 放入其中，并以正确的方式放入。


    如果你使用链接法，请确保你的网站以正确的方式链接到你编写的 `JavaScript`。始终确保你更新文件，这样当人们看到网站时，看到的是 `JavaScript`
    的结果，而不是仅仅看到在其中的大量的代码。

