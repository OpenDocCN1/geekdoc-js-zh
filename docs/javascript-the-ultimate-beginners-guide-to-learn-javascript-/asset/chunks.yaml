  trans: '


    与其自己去寻找需要的知识，你将需要学习老师教你的内容。这可能花费很长时间，代价高昂，而且你可能无法学到你需要的全部知识。


    # 学习一项技能


    对于那些读过那两个章节的人，你可能已经知道，如果自己学习 `JavaScript`，情况会好得多。你不需要老师，不需要专业人士。你只需要一些能够向你展示你可以所做的所有不同内容，并以一种让你理解的方式来呈现它们。


    自己动手做是一个好主意，因为你将学到一项宝贵的技能。学习这项技能将为你提供所需的思路，让你能够在自己的网页上创建内容，并并在 `JavaScript` 的学习过程中发挥创意。


    一旦你掌握了关于 `JavaScript` 的所有知识，你甚至可以成为那些专业人士或老师之一。他们的收费非常高，这意味着他们只需花一点精力就能赚到很多钱。如果你对自己的
    `JavaScript` 技能有信心，你也可以做同样的事情并从中赚钱。即使你不想通过教学或为他人编写 `JavaScript` 来赚钱，拥有这项技能对你也会非常有帮助。


    # 昂贵


    雇人为你完成工作或请老师教你如何操作并不是解决办法。从本系列课程中尽可能多学习是一个好主意。购买该系列中关于 `JavaScript` 的其余书籍，其价格可能比向老师上的第一课还要便宜得多。这仅仅是雇佣专业人士处理你的
    `JavaScript` 任务费用的一小部分。


    由于你可以按照自己的进度进行，自己做甚至可能更快。这让你有机会学习得更多、做更多事情，并开始从中赚钱。通过不雇佣专业人士，你可以节省大量资金，但通过成为 `JavaScript`
    专家，你可以赚到很多钱。请确保你已经准备好学习，并对在书中学到的每项 `JavaScript` 知识继续保持良好的表现。


    如果你觉得你已经从这本书中学到了你需要的知识，那么恭喜你。你不再是一个初学者了，可以转向 `JavaScript` 的其他领域了。尝试书中教给你的所有内容，准备开始成为一名
    `JavaScript` 专业人士。你现在就能从中获益。仅仅学习书中包含的几段代码就足够让你入门了。事实上，你完全可以利用这些代码构建一个整个网页。它可能不会非常有趣或具有互动性，但它是你可以独立完成的。


    当你开始学习更多内容时，请记住书中教给你的一切。始终记录你所做的更改，将内容保持在一个地方，并利用你学到的信息进行回顾参考。即使是专业人士有时也会忘记如何更改文本颜色或字体大小。跟踪并记录一切将让你始终有一个可以回溯的地方，那里会比你以后将学习的高级
    `JavaScript` 要简单。


    # 结


    感谢你读完这本书，希望它为你提供了许多有益的信息，并能够为你提供实现目标（无论这些目标为何）所需的所有工具。


    下一步是开始使用你所学到的 `JavaScript` 并开始准备。你也可以查看该系列中的其他书籍，学习比 `JavaScript` 基础知识更多的内容。你关于它读得越多，就越能学会如何编写它以及可以用它来做什么。


    最后，如果你发现这本书在任何方面都有用，我们非常欢迎你在 Amazon 上给出评价！


