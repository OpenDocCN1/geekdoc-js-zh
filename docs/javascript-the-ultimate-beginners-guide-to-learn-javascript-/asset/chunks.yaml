- fmt: '

    Once you have learned the language, you will likely know what you are doing with
    it for the rest of your time on the web. Make sure that you learn it as much as
    possible so that you will be able to do more with what you have. There are many
    different options when it comes to the `JavaScript` and what you have with it.
    Make sure that you do your best to be able to provide your website with the best
    user experience possible.


    There is no doubt that, if you learn `JavaScript`, you will use it. It is designed
    to be user-friendly, and you can make nearly anything that you want out of the
    codes that are used in `JavaScript`. Make sure that you do your best and that
    you try to always find different ways to use `JavaScript`. Using the best innovation
    will allow you to have the best website possible when it comes to the options
    that you have written with `JavaScript`.


    Despite the fact that it is easy to use, you should still be ready to start learning
    `JavaScript` by preparing yourself for the process. Know what you want to do with
    it, understand the point of using it and learn as much as possible about it before
    you even make the decision to start learning it. It is always a good idea to give
    yourself a strong place to start so that you can do more with the language and
    with the codes that come along with `JavaScript`.


    ## Chapter 2: The Basics


    Just about any person who has a computer is able to get started with `JavaScript`.
    Since the language is somewhat simple, there is no extra software that you need
    to use. This is especially true when you are first getting started because you
    will only be doing simple things with `JavaScript`, so you do not need too many
    extras. As you begin to do more, you can consider getting different software and
    additional programs, but these basics should enable you to do the most with `JavaScript`
    when you are just getting started.


    ### Web Browser


    When the language was first available for programmers to use, it was only able
    to be used in select browsers. It has now grown so much that it is the only language
    that can be used in every browser. It is supported on every browser and platform,
    and it can be used to create web pages that will be able to show up no matter
    what browser your visitor is going to use.


    Because of this, you can use any type of browser to get started with your `JavaScript`
    goals. Most people choose to use their favorite one or one that they normally
    use when they are looking at websites for their own personal use. Some others
    choose to use different browsers that are better or more functional for looking
    at the web pages that they have created.


    One of the most common things that people do is simply use the default browser.
    This is the browser that automatically comes up when you click on a link to a
    website or when you try to open a web page. Those who write in `JavaScript` do
    this so that they do not have to worry about trying to get around it each time
    that they open one of the pages that they have made. It is something that is simple
    and something that allows them to do more with it.


    ### The Editor


    In the beginning, the editor that you choose to write your `JavaScript` will not
    make much of a difference. It will simply be a place where you can put all of
    your information into and save it so that you can use it on the web page and it
    will work well with the web page that you have created.


    There are several programs that you can download to your computer that will be
    able to be used to edit your `JavaScript`. The majority of these are free and
    easy to use so that you don’t have to worry about learning a whole new program
    just because you want to start writing `JavaScript`. You can find them on the
    web or in the app store that is included with your computer if you have a newer
    computer. Each program has different benefits, but most of them are simple, plain
    text processors.


    If you are running Windows, you may be surprised to find that you already have
    your very own software ready for you to start editing `JavaScript`. `Notepad`
    was not created for that reason, but it can be used for it. It is plain text,
    and it does not make changes to the text as you write it in the way that Word
    or another processor would. You can write and save all of your `JavaScript` right
    into a note by using the `Notepad` that comes right with your computer.


    ### Script Tags


    There are two main ways that you can write `JavaScript`, and the first is to create
    script tags. These are tags that you write out on your web page and you put your
    code into the scripts so that you have it all done on your website. This is easy
    for beginners who want basic codes and just want a basic website because it is
    easy to just put the codes into each of the scripts. It is ideal for people who
    do not want to edit their website often or who do not have a lot of changes that
    would go into making the website.


    To do this, you would simply write:


    ```html

    <script type= “text/JavaScript"> Write all of the information that you want to
    include right here and make sure that it is in plain text. That is what your notepad
    editor is going to be used for and what you can do to make sure that you are doing
    it the right way.</script>

    ```


    The information will then appear on your website when people click on it. If you
    were to just write it without the `script` tags, the words would not appear. It
    would likely just be a series of symbols and numbers with some letters thrown
    in there if you are lucky.


    If you want to just start practicing `JavaScript`, this is the best way to do
    it. It will allow you a chance to truly start writing it and to have it appear
    on the web page.


    ### Script Links


    Once you become more comfortable with `JavaScript` and what you can do with it,
    you can begin to link up to the script that you have written. This is a great
    thing to use if you are planning on making a lot of changes, if you have a lot
    of different information or if you want to make your website very interactive
    so that people can click on anything and get a result.


    To be able to use links, you do it similarly. You would write your code in your
    plain text editor, like `Notepad`. Then, save your code that you have just written
    so that it has a name you can easily recognize. Make sure that you use the `.js`
    ending of it so that it will be converted when it is linked into your JavaScript.


    When you are ready to link up your JavaScript that you have saved, all you need
    to do is write:


    ```html

    <script type= “text/JavaScript” src= “scripts/choosisfile.js"></script>

    ```


    Where `choosisfile.js` is written, you would want to put in your own file name,
    you would use the one that you just saved to your computer so that it would be
    linked up with what you have written.


    ### Variables


    There are many different variables for web pages and that is how the page will
    work to display different information so that people can see it when they are
    on the different pages. There are also different things that you can do with what
    you have and with what you are going to show your visitors who decide to come
    to your web page.


    The variables are what communicates what you want to say to your website. They
    are the “meat” of the code and are what your visitors are going to be concerned
