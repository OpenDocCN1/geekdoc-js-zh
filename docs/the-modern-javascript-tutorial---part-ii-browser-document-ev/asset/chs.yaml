  \n跳转到公式\n\n### 浏览器默认行为\n\n为什么 \"return false\" 不起作用？\n\n当浏览器读取像 `onclick` 这样的 `on*`\
  \ 属性时，它根据其内容创建处理器。\n\n对于 `onclick=\"handler()\"`，该函数将是：\n\n```javascript\nfunction(event)\
  \ {\n  handler() // onclick 的内容\n}\n```\n\n现在我们可以看到 `handler()` 返回的值没有被使用，也不会影响结果。\n\
  \n修复方法很简单：\n\n```javascript\n <script>\n  function handler() {\n    alert(\"...\"\
  );\n    return false;\n  }\n</script>\n\n<a href=\"https://w3.org\" onclick=\"return\
  \ handler()\">w3.org</a>\n```\n\n此外我们也可以使用 `event.preventDefault()`，如下所示：\n\n```javascript\n\
  \ <script>\n  function handler(event) {\n    alert(\"...\");\n    event.preventDefault();\n\
  \  }\n</script>\n\n<a href=\"https://w3.org\" onclick=\"handler(event)\">w3.org</a>\n\
  ```\n\n跳转到公式在元素拦截链接\n\n这是事件委托模式的一种极佳用法。\n\n在现实生活中，与其直接询问，不如向服务器发送一个“日志”请求，保存访问者离开位置的信息。或者我们可以加载内容并直接显示在页面上（如果允许的话）。\n\
  \n我们需要捕获 `contents.onclick` 并使用 `confirm` 询问用户。一个好主意是使用 `link.getAttribute('href')`\
  \ 而不是 `link.href` 获取 URL。详情查看解决方案。\n\n[在沙盒中打开解决方案。](https://plnkr.co/edit/HTIoSFD4ZAaGMexAaGTS?p=preview)\n\
