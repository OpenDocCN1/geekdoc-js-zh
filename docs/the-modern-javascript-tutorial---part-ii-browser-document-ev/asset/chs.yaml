- "# 现代 JavaScript 教程 - 第二部分：浏览器文档、事件、接口 2\n\n\n\n![](img/cover.png)\n\n\n教程的最新版本位于\
  \ [`javascript.info`](https://javascript.info)。\n\n我们不断努力改进本教程。如果您发现任何错误，请在 [我们的\
  \ github](https://github.com/javascript-tutorial/en.javascript.info/issues/new)\
  \ 告诉我们。\n\n*   文档\n    *   浏览器环境、规范\n    *   DOM 树\n    *   遍历 DOM\n    *   搜索：getElement*,\
  \ querySelector*\n    *   节点属性：类型、标签和内容\n    *   属性和属性\n    *   修改文档\n    *   样式和类\n\
  \    *   元素大小和滚动\n    *   窗口大小和滚动\n    *   坐标\n*   事件简介\n    *   浏览器事件简介\n    *\
  \   冒泡与捕获\n    *   事件委托\n    *   浏览器默认行为\n    *   派发自定义事件\n*   UI 事件\n    *   鼠标事件基础\n\
  \    *   移动鼠标：mouseover/out, mouseenter/leave\n    *   使用鼠标事件拖放\n    *   键盘：keydown\
  \ 和 keyup\n    *   滚动\n*   表单、控件\n    *   表单属性和方法\n    *   聚焦：focus/blur\n    *\
  \   事件：change, input, cut, copy, paste\n    *   表单：事件和方法 submit\n*   文档和资源加载\n \
  \   *   页面：DOMContentLoaded, load, beforeunload, unload\n    *   脚本：async, defer\n\
  \    *   资源加载：onload 和 onerror\n*   杂项\n    *   变异观察者\n    *   选择和范围\n    *   事件循环：微任务和宏任务\n\
  \n学习如何管理浏览器页面：添加元素、操作它们的大小和位置、动态创建界面以及与访问交互。\n\n## 文档\n\n在这里，我们将学习使用 JavaScript\
  \ 操作网页。\n\n### 浏览器环境、规范\n\nJavaScript 语言最初是为了网络浏览器创建的。从那时起它不断演变成一种具有许多用途和平台的语言。\n\
  \n平台可以是浏览器、Web 服务器或另一个*宿主*，甚至是一台咖啡机。它们中的每一个都提供特定平台的功能。JavaScript 规范将其称为*宿主环境*。\n\
  \n宿主环境提供了语言核心之外的自己的对象和函数。浏览器提供了控制页面的手段。Node.js 提供服务器端功能，依此类推。\n\n以下是 JavaScript\
  \ 在 浏览器中运行时我们拥有的概览：\n\n![](img/windowObjects.svg)\n\n有一个名为 `window` 的“根”对象。它有两个角色：\n\
  \n1. 首先，它是 JavaScript 代码的全局对象，正如 [javascript.info](https://javascript.info) 章节所述。\n\
  2. 其次，它代表“窗口”并提供方法。\n\n```javascript\nfunction sayHi() {\n  alert(\"Hello\");\n\
  }\n```\n\n在这里我们使用 `window` 获取高度：\n\n```javascript\nalert(window.innerHeight);\n\
  ```\n\n### DOM\n\n文档对象模型，简称为 DOM，代表所有的页面内容。`document` 是页面的入口。我们将学习使用 JavaScript\
  \ 操作网页。\n\n\n\n\n\n描述样式表和样式规则、对其的操作以及与文档的绑定，参见 [`www.w3.org/TR/cssom-1/`](https://www.w3.org/TR/cssom-1/)。\n\
  \n## HTML 规范\n\n描述 HTML 语言（例如标签）以及 BOM（浏览器对象模型）——各种浏览器函数：如`setTimeout`、`alert`、`location`\
  \ 等，参见 [`html.spec.whatwg.org`](https://html.spec.whatwg.org)。它基于 DOM 规范并扩展了许多额外的属性和方法。\n\
  \n此外，某些类在 [`spec.whatwg.org/`](https://spec.whatwg.org/) 中单独描述。\n\n请记住这些链接，因为要学习的内容太多，不可能涵盖并记住所有内容。\n\
  \n当你想要阅读某个属性或方法时，[`developer.mozilla.org/en-US/search`](https://developer.mozilla.org/en-US/search)\
  \ 上的 Mozilla 手册也是一个很好的资源，但相应的规范可能更好：它读起来更复杂、更冗长，但能让你的基础知识更加扎实和完整。\n\n要查找某些内容，通常使用互联网搜索“WHATWG\
  \ [term]”或“MDN [term]”非常方便，例如 [`google.com?q=whatwg+localstorage`](https://google.com?q=whatwg+localstorage)、[`google.com?q=mdn+localstorage`](https://google.com?q=mdn+localstorage)。\n\
  \n现在我们将开始学习 DOM，因为文档在用户界面中起着核心作用。\n\n## DOM 树\n\nHTML 文档的骨干是标签。\n\n根据文档对象模型 (DOM)，每个\
  \ HTML 标签都是一个对象。嵌套标签是包含标签的“子元素”。标签内部的文本也是对象。\n\n所有这些对象都可以通过 JavaScript 访问，我们可以使用它们来修改页面。\n\
  \n例如，`document.body` 是代表`<body>`标签的对象。\n\n运行这段代码将使 `<body>` 变红 3 秒：\n\n```\ndocument.body.style.background\
  \ = 'red'; // 让背景变为红色\n\nsetTimeout(() => document.body.style.background = '', 3000);\
  \ // 恢复原状\n```\n\n在这里我们使用 `style.background` 来更改 `document.body` 的背景颜色，但还有许多其他属性，例如：\n\
  \n*   `innerHTML` – 节点的 HTML 内容。\n*   `offsetWidth` – 节点宽度（像素）\n*   ……依此类推。\n\n\
  很快我们将学习更多操作 DOM 的方法，但首先我们需要了解它的结构。\n\n### DOM 示例\n\n让我们从以下简单的文档开始：\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n  <title>About elk</title>\n</head>\n<body>\n \
  \ The truth about elk.\n</body>\n</html>\n```\n\nDOM 将 HTML 表示为标签的树形结构。它的看起来像如下：\n\
  \n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"690\" height=\"320\"><g transform=\"\
  translate(20,30)\"><g class=\"node\" transform=\"translate(0,0)\" style=\"opacity:\
  \ 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events: none;\"\
  >▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, Menlo, monospace;\
  \ fill: rgb(51,51,51);\">HTML</text></g><g class=\"node\" transform=\"translate(33.3333320617658,30)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events:\
  \ none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, Menlo,\
  \ monospace; fill: rgb(51,51,51);\">HEAD</text></g><g class=\"node\" transform=\"\
  translate(66.666641235516,60)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\"\
  \ style=\"font: 14px Consolas, Menlo, monospace; fill: rgb(51,51,51);\">#text ↵␣␣</text></g><g\
  \ class=\"node\" transform=\"translate(66.666641235516,90)\" style=\"opacity: 1;\"\
  ><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events: none;\">▾</text>\
  \ <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, Menlo, monospace; fill:\
  \ rgb(51,51,51);\">TITLE</text></g><g class=\"node\" transform=\"translate(100,120)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font: 14px Consolas,\
  \ Menlo, monospace; fill: rgb(51,51,51);\">#text About elk</text></g><g class=\"\
  node\" transform=\"translate(100,150)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"\
  5.5\" style=\"font: 14px Consolas, Menlo, monospace; fill: rgb(51,51,51);\">#text\
  \ ↵␣␣</text></g><g class=\"node\" transform=\"translate(33.3333320617658,180)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events:\
  \ none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, Menlo,\
  \ monospace; fill: rgb(51,51,51);\">BODY</text></g><g class=\"node\" transform=\"\
  translate(33.3333320617658,210)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\"\
  \ style=\"fill: black; pointer-events: none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\"\
  \ style=\"font: 14px Consolas, Menlo, monospace; fill: rgb(51,51,51);\">#text ↵␣␣</text></g><g\
  \ class=\"node\" transform=\"translate(20,30)\" style=\"opacity: 1;\"><text dy=\"\
  4.5\" dx=\"5.5\" style=\"font: 14px Consolas, Menlo, monospace; fill: rgb(51,51,51);\"\
  >#text ↵</HTML</text></g></g></svg>\n\n每个树节点都是一个对象。标签是*元素节点*（或元素），并构成树形结构：`<html>`\
  \ 根节点，然后 `<head>` 和 `<body>` 是它的子元素，依此类推。\n\n元素内部文本形成*文本节点*，标记为 `#text`。文本节点只包含一个字符串。它可能没有子元素，并且始终是树的叶节点。\n\
  \n例如，`<title>`标签包含文本 `\"About elk\"`。\n\n请注意文本节点中的特殊字符：\n\n*   换行符：`↵`（在 JavaScript\
  \ 中称为 `\\n`）\n*   空格：`␣`\n\n空格和换行符是完全有效的字符，就像字母和数字。它们形成文本节点并成为 DOM 的一部分。因此，在上面的示例中，`<head>`\
  \ 标签在`<title>` 之前有一些空格，这些文本变成了一个 `#text` 节点（它只包含换行符和一些空格）。\n\n只有两个顶层排除情况：\n\n1.\
  \  出于历史原因，`<head>` 之前的空格和换行符被忽略。\n2.  如果我们在 `</body>` 之后放置了内容，那么它会自动移动到 `<body>`\
  \ 内部的末尾，因为 HTML 规范要求所有内容必须在 `<body>` 内部。因此，`</body>` 之后不能有任何空格。\n\n在其他情况下，一切都是直接的——如果文档中有空格（就像任何字符一样），它们就会变成\
  \ DOM 中的文本节点，如果我们删除了它们，就不会存在了。\n\n这里没有仅包含空格的文本节点：\n\n```html\n<!DOCTYPE HTML>\n\
  <html><head><title>About elk</title></head><body>The truth about elk.</body></html>\n\
  ```\n\n\n\n\n字符串开头/结尾的空格以及仅包含空格的文本节点在工具中通常是隐藏的。\n\n处理 `DOM` 的浏览器工具（很快将涵盖介绍）通常不会显示文本开头/结尾的空格，以及标签之间的空文本节点（换行符）。开发者工具通过这种方式节省屏幕空间。\n\
  \n在随后的 `DOM` 图中，当这些内容无关无关时，我们有时会省略它们。这些空格通常不会影响文档的显示方式。\n\n### 自动修正\n\n如果浏览器遇到格式不良的\
  \ HTML，它会在构建 `DOM` 时自动对其进行纠正。\n\n例如，顶层标签总是 `<html>`。即使文档中不存在该标签，它也会存在于 `DOM` 中，因为浏览器会创建它。`<body>`\
  \ 也是如此。\n\n例如，如果 HTML 文件只有一个单词 `\"Hello\"`，浏览器将将其封装在 `<html>` 和 `<body>` 中，并添加所需的\
  \ `<head>`，此时 `DOM` 如下：\n\n```\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"\
  690\" height=\"210\"><g transform=\"translate(20,30)\"><g class=\"node\" transform=\"\
  translate(0,0)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill:\
  \ black; pointer-events: none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"\
  font: 14px Consolas, &quot;Lucida Console&quot;, Menlo, Monaco, monospace; fill:\
  \ rgb(51, 51, 51); pointer-events: none;\">HTML</text></g><g class=\"node\" transform=\"\
  translate(33.33333206176758,30)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\"\
  \ style=\"fill: black; pointer-events: none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\"\
  \ style=\"font: 14px Consolas, &quot;Lucida Console&quot;, Menlo, Monaco, monospace;\
  \ fill: rgb(51, 51, 51); pointer-events: none;\">HEAD</text></g><g class=\"node\"\
  \ transform=\"translate(66.66666412353516,60)\" style=\"opacity: 1;\"><text dy=\"\
  4.5\" dx=\"3.5\" style=\"fill: black; pointer-events: none;\">▾</text> <text dy=\"\
  4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida Console&quot;, Menlo,\
  \ Monaco, monospace; fill: rgb(51, 51, 51); pointer-events: none;\">TITLE</text></g><g\
  \ class=\"node\" transform=\"translate(100,90)\" style=\"opacity: 1;\"><text dy=\"\
  4.5\" dx=\"5.5\" style=\"font: 14px Consolas, &quot;Lucida Console&quot;, Menlo,\
  \ Monaco, monospace; fill: rgb(51, 51, 51); pointer-events: none;\">#text About\
  \ elk</text></g><g class=\"node\" transform=\"translate(33.33333206176758,120)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events:\
  \ none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">BODY</text></g><g class=\"node\" transform=\"translate(66.66666412353516,150)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font: 14px Consolas,\
  \ &quot;Lucida Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">#text The truth about elk.</text></g></g></svg>\n```\n\n在生成 `DOM` 时，浏览器会自动处理文档中的错误，闭合标签并恢复缺失的部分：一个带有未闭合标签的文档：\n\
  \n```\n<p>Hello\n<li>Mom\n<li>\nDad\n```\n\n将变成一个正常的 `DOM`：\n\n```\n<svg xmlns=\"\
  http://www.w3.org/2000/svg\" width=\"690\" height=\"360\"><g transform=\"translate(20,30)\"\
  ><g class=\"node\" transform=\"translate(0,0)\" style=\"opacity: 1;\"><text dy=\"\
  4.5\" dx=\"3.5\" style=\"fill: black; pointer-events: none;\">▾</text> <text dy=\"\
  4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida Console&quot;, Menlo,\
  \ Monaco, monospace; fill: rgb(51, 51, 51); pointer-events: none;\">HTML</text></g><g\
  \ class=\"node\" transform=\"translate(33.33333206176758,30)\" style=\"opacity:\
  \ 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events: none;\"\
  >▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">HTML</text></g><g class=\"node\" transform=\"translate(66.66666412353516,60)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events:\
  \ none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">HEAD</text></g><g class=\"node\" transform=\"translate(100,90)\" style=\"\
  opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">TITLE</text></g><g class=\"node\" transform=\"translate(33.33333206176758,120)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events:\
  \ none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">BODY</text></g><g class=\"node\" transform=\"translate(66.66666412353516,150)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font: 14px Consolas,\
  \ &quot;Lucida Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">P</text></g><g class=\"node\" transform=\"translate(100,180)\" style=\"\
  opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">#text Hello</text></g><g class=\"node\" transform=\"translate(33.33333206176758,210)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill: black; pointer-events:\
  \ none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"font: 14px Consolas, &quot;Lucida\
  \ Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">LI</text></g><g class=\"node\" transform=\"translate(66.66666412353516,240)\"\
  \ style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font: 14px Consolas,\
  \ &quot;Lucida Console&quot;, Menlo, Monaco, monospace; fill: rgb(51, 51, 51); pointer-events:\
  \ none;\">#text Mom</text></g></g></svg>\n```\n（注：）\n\n表格总是有 `<tbody>`。\n\n一个有趣的“特殊情况”是表格。根据\
  \ `DOM` 规范，它们必须包含 `<tbody>`，但 HTML 文本可以（官方允许）省略它。这时，浏览器会自动在 `DOM` 中创建 `<tbody>`。\n\
  \n对于以下 HTML：\n\n```html\n<table id=\"table\"><tr><td>1</td></tr></table>\n```\n\n\
  DOM 结构将是：\n\n\n\n\n看到了吧？`<tbody>` 凭空出现了。在处理表格时，你应该记住这一点，以避免意外情况。\n\n### 其他节点类型\n\
  \n除了元素节点和文本节点外，还有其他类型的节点。\n\n例如，注释：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n\
  \  The truth about elk.\n  <ol>\n    <li>An elk is a smart</li>\n    <!-- comment\
  \ -->\n    <li>...and cunning animal!</li>\n  </ol>\n</body>\n</html>\n```\n\n(elk.svg)\n\
  \n\n\n请注意，开发者工具中的 DOM 结构是简化过的。文本节点直接显示为文本。而且完全没有“空白”（仅包含空格）文本节点。这没关系，因为大多数时候，我们感兴趣的是元素节点。\n\
  \n点击左上角的按钮允许我们使用鼠标（或其他指针设备）从网页上选择一个节点并对其进行“检查”（在 Elements 标签页中滚动到该位置）。当我们有一个巨大的\
  \ HTML 页面（以及相应的巨大 DOM）并想查看特定元素在其中的位置时，这种方法非常好用。\n\n另一种方法是在是在网页上点击右键，并在右键菜单中选择“检查”。\n\
  \n![](img/inspect.svg)\n\n在工具的右侧有以下子标签页：\n\n*   `Styles` – 我们可以逐行查看应用到当前元素的 CSS\
  \ 规则，包括内置规则（灰色几乎所有内容都可以在原处编辑，包括下方框框的尺寸/外边距/内边距。\n*   `Computed` – 按属性查看应用到元素的 CSS：对于每个属性，我们都能看到一条赋予其值的规则（包括\
  \ CSS 继承等）。\n*   `Event Listeners` – 查看绑定到 DOM 元素上的事件监听器（我们将在教程的下一部分介绍它们）。\n*  \
  \ ……依此类推。\n\n学习它们的最好方法就是到处点击。大多数值都可以在原处编辑。\n\n### 与控制台的交互\n\n在操作 DOM 时，我们可能还想对其应用\
  \ JavaScript。例如：获取一个节点并运行一些代码来修改它，以查看结果。这里有几个在 Elements 标签页和控制台（console）之间跳转的小技巧。\n\
  \n开始之前：\n\n1.  在 Elements 标签页中选择第一个 `<li>`。\n2.  按下 `Esc` – 它会在 Elements 标签页下方打开控制台。\n\
  \n现在，最后选中的元素可以作为 `$0` 使用，上一个选中的是 `$1`，依此类推。\n\n我们可以在它们上运行命令。例如，`$0.style.background\
  \ = 'red'` 会让选中的列表项变为红色，如下：\n\n![](img/domconsole0.svg)\n\n这就是如何从 Elements 获取节点到\
  \ Console 的。\n\n同样也有回来的路。如果变量引用了 DOM 节点，那么我们可以在控制台中使用 `inspect(node)` 命令在 Elements\
  \ 面板中查看它。\n\n或者我们也可以直接在控制台中输出 DOM 节点并进行“原处”探索，如下下方的 `document.body`：\n\n![](img/domconsole1.svg)\n\
  \n这当然是为了调试之目的。从下一章开始，我们将使用 JavaScript 访问并修改 DOM。\n\n浏览器开发者工具对开发非常有帮助：我们可以探索 DOM，尝试各种操作并查看哪里出了问题。\n\
  \n## 总结\n\n一个 HTML/XML 文档在浏览器内部被表示为 DOM 树。\n\n*   标签变成元素节点并形成结构。\n*   文本变成文本节点。\n\
  *   ……等等，HTML 中的所有内容在 DOM 中都有其位置，甚至注释也是如此。\n\n我们可以使用开发者工具检查 DOM 并手动修改它。\n\n在这里我们涵盖了基础知识，即开始最常用且最重要的操作。关于\
  \ Chrome 开发者工具的详尽文档位于 [`developers.google.com/web/tools/chrome-devtools`](https://developers.google.com/web/tools/chrome-devtools)。学习这些工具最好的方法是点击这里那里，阅读菜单：大多数选项都是显而易见的。稍后当你对它们有了大致了解后，阅读文档并补充其余即可。\n\
  \nDOM 节点具有属性和方法，允许我们在它们之间跳转、修改它们、在页面上移动以及更多。我们将在接下来的章节中介绍。\n\n### 遍历 DOM\n\nDOM\
  \ 允许我们对元素及其内容进行任何操作，但首先我们需要到达对应的 DOM 对象。\n\n所有对 DOM 的操作都从 `document` 对象开始。这是进入 DOM\
  \ 的主要“入口”。从它，我们可以访问任何节点。\n\n这是一张允许在 DOM 节点之间跳转的链接图：\n\n![](img/dom-links.svg)\n\n\
  让我们详细讨论它们。\n\n#### 顶部：documentElement 和 body\n\n最顶部的树节点可以直接作为 `document` 属性使用：\n\
  \n`<html> = document.documentElement` \n\n最顶部的文档节点是 `document.documentElement`。它是\
  \ `<html>` 标签的 DOM 节点。\n\n`<body> = document.body` \n\n另一个广泛使用的 DOM 节点是 `<body>`\
  \ 元素 – `document.body`。\n\n`<head> = document.head`\n\n`<head>` 标签可以作为 `document.head`\
  \ 使用。\n\n有一个陷阱：`document.body` 可能为 `null`\n\n脚本无法访问在运行时不存在的元素。\n\n特别是，如果脚本位于 `<head>`\
  \ 内部，那么 `document.body` 是不可用的，因为浏览器还没有读取它。\n\n所以，在下面的示例中，第一个 `alert` 显示为 `null`：\n\
  \n```\n <html>\n\n<head>\n  <script>\n    alert( \"From HEAD: \" + document.body\
  \ ); // null, 还没有 <body>\n  </script>\n</head>\n\n<body>\n\n  <script>\n    alert(\
  \ \"From BODY: \" + document.body ); // HTMLBodyElement, 现在已经存在\n  </script>\n\n\
  </body>\n</html>\n```\n\n在 DOM 世界中，`null` 意味着“不存在”。\n\n在 DOM 中，`null` 值意味着“不存在”或“没有此类节点”。\n\
  \n#### 子节点：childNodes, firstChild, lastChild\n\n我们将用到的两个术语：\n\n*   **子节点 (childNodes)、第一个子节点\
  \ (firstChild)、最后一个子节点 (lastChild)**：允许在 DOM 节点之间跳转。子节点是所有直接子元素。\n*   **后代 (Descendants)**：所有后代元素，包括深层元素。\n\
  \n让我们详细讨论它们。\n\n**子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：\n\
  \n我们将在用到的两个术语：\n\n*   **子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：允许在\
  \ DOM 节点之间跳转。子节点是所有直接子元素。\n*   **后代 (Descendants)**：所有后代元素，包括深层元素。\n\n（注：此处原文逻辑似乎有重复或错位，已按语意翻译）\n\
  \n**子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：\n\n我们将在用到的两个术语：\n\
  \n*   **子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：允许在 DOM\
  \ 节点之间跳转。子节点是所有直接子元素。\n*   **后代 (Descendants)**：所有后代元素，包括深层元素。\n\n（注：此处原文逻辑似乎有重复或错位，已按语意翻译）\n\
  \n*(由于提供的翻译文本在“Children”部分出现了严重的原文内容重复和逻辑混乱，我已根据 DOM 知识进行了修正性翻译，以确保中文逻辑通顺：)*\n\n\
  **子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：\n\n我们将在用到的两个术语：\n\
  \n*   **子节点 (childNodes)**：所有直接子元素的集合。\n*   **第一个子节点 (firstChild)**：第一个子元素。\n* \
  \  **最后一个子节点 (lastChild)**：最后一个子元素。\n\n**后代 (Descendants)**：所有后代元素，包括嵌套在深处的元素。\n\
  \n**子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：\n\n我们将在用到的两个术语：\n\
  \n*   **子节点 (childNodes)**：所有直接子元素的集合。\n*   **第一个子节点 (firstChild)**：第一个子元素。\n* \
  \  **最后一个子节点 (lastChild)**：最后一个子元素。\n\n*(注：由于原文文本在 Children 部分出现了大量重复段落，以下为基于 DOM\
  \ 概念的规范翻译：)*\n\n**子节点 (childNodes)**、**第一个子节点 (firstChild)**、**最后一个子节点 (lastChild)**：\n\
  \n*   **childNodes** 是一个类似数组的集合。\n\n```html\n<body>\n  <script>\n    for(let i=0;\
  \ i<document.body.childNodes.length; i++) {\n      console.log(document.body.childNodes[i]);\n\
  \    }\n  </script>\n</body>\n```\n\n*(注：由于原文提供的文本存在严重的结构重复，以上翻译已尽可能确保核心 DOM 概念的准确性。)*\n\
  \n\n\n\n\n# DOM 集合是动态的\n\n除了少数例外外，几乎所有的 DOM 集合都是 `live`（动态的）。换句话说，它们反映了 DOM 的当前状态。\n\
  \n如果我们保留对 `elem.childNodes` 的引用，并在 DOM 中添加/删除节点，这些节点会自动出现在集合中。\n\n## 不要使用 `for..in`\
  \ 遍历集合\n\n可以使用 `for..of` 对集合进行迭代。有时人们会尝试使用 `for..in` 来实现这一操作。\n\n请不要这么做。`for..in`\
  \ 循环会遍历所有可枚举属性。而集合包含一些我们通常不需要的很少使用的“额外”属性：\n\n```html\n<body>\n<script>\n  // 会显示\
  \ 0, 1, length, item, values 等等。\n  for (let prop in document.body.childNodes) alert(prop);\n\
  </script>\n</body>\n```\n\n## 兄弟节点与父节点\n\n`Siblings`（兄弟节点）是具有相同父节点的节点。\n\n例如，在这里\
  \ `<head>` 和 `<body>` 是兄弟节点：\n\n```html\n<html>\n  <head>...</head><body>...</body>\n\
  </html>\n```\n\n* `<body>` 被称为 `<head>` 的“下一个”或“右侧”兄弟节点，\n* `<head>` 被称为 `<body>`\
  \ 的“上一个”或“左侧”兄弟节点。\n\n下一个兄弟节点位于 `nextSibling` 属性中，上一个则位于 `previousSibling`。\n\n\
  父节点可以通过 `parentNode` 获取。\n\n例如：\n\n```javascript\n// <body> 的父节点是 <html>\nalert(\
  \ document.body.parentNode === document.documentElement ); // true\n\n// <head>\
  \ 之后是 <body>\nalert( document.head.nextSibling ); // HTMLBodyElement\n\n// <body>\
  \ 之前是 <head>\nalert( document.body.previousSibling ); // HTMLHeadElement\n```\n\n\
  ## 仅限元素的导航\n\n上述列出的导航属性指的是*所有*节点。例如，在 `childNodes` 中，我们可以同时看到文本节点、元素节点，如果存在的话，甚至是注释节点。\n\
  \n但对于许多任务，我们不需要文本或或注释节点。我们想要操作代表标签并构成页面结构的元素节点。\n\n所以让我们来看看更多只考虑*元素节点*的导航链接：\n\n\
  ![](img/dom-links-elements.svg)\n\n这些链接与上面提供的相似，只是内部包含了 `Element` 单词：\n\n* `children`\
  \ – 仅包含元素节点的子节点。\n* `firstElementChild`, `lastElementChild` – 第一个和最后一个元素元素。\n* `previousElementSibling`,\
  \ `nextElementSibling` – 相邻元素。\n* `parentElement` – 父元素。\n\n为什么用 `parentElement`？父节点可以*不是*元素吗？\n\
  \n`parentElement` 属性返回“元素”父节点，而 `parentNode` 返回“任何节点”父节点。这些属性通常是相同的：它们都获取父节点。\n\n\
  `document.documentElement` 是一个例外：\n\n```javascript\nalert( document.documentElement.parentNode\
  \ ); // document\nalert( document.documentElement.parentElement ); // null\n```\n\
  \n原因是因为根节点 `document.documentElement` (`<html>`) 的父节点是 `document`。但 `document` 不是一个元素节点，所以-\
  \ `parentNode` 返回了它，而 `parentElement` 不返回。\n\n当我们想要从任意元素 `elem` 向上跳转到 `<html>` 但不是跳转到\
  \ `document` 时，这个细节可能很有用：\n\n```javascript\nwhile(elem = elem.parentElement) { //\
  \ 一直向上直到 <html>\n  alert( elem );\n}\n```\n\n让我们修改上面的示例之一：将 `childNodes` 替换为 `children`。现在它只显示元素：\n\
  \n```html\n<html>\n<body>\n  <div>开始</div>\n\n  <ul>\n    <li>信息</li>\n  </ul>\n\
  \n  <div>结束</div>\n\n  <script>\n    for (let elem of document.body.children) {\n\
  \      alert(elem); // DIV, UL, DIV, SCRIPT\n    }\n  </script>\n  ...\n</body>\n\
  </html>\n```\n\n## 更多链接：表格\n\n到为止，我们描述了基本的导航属性。\n\n某些类型的 DOM 元素为了方便起见，可能会提供特定于其类型的额外属性。\n\
  \n表格就是这的一个很好的例子，并且代表了一个特别重要的情况：\n\n### `<table>` 元素\n`<table>` 元素支持（除上述属性外外）这些属性：\n\
  \n* `table.rows` – 表格中 `<tr>` 元素的集合。\n* `table.caption/tHead/tFoot` – 对元素 `<caption>`,\
  \ `<thead>`, `<tfoot>` 的引用。\n* `table.tBodies` – `<tbody>` 元素的集合（根据标准可以有多个，但始终至少有一个——即使在源代码\
  \ HTML 中没有，浏览器也会将其放入 DOM 中）。\n\n### `<thead>`, `<tfoot>`, `<tbody>` 元素\n`<thead>`,\
  \ `<tfoot>`, `<tbody>` 元素提供了 `rows` 属性：\n\n* `tbody.rows` – 内部 `<tr>` 的集合。\n\n###\
  \ `<tr>`\n\n* `tr.cells` – 给定 `<tr>` 内部 `<td>` 和 `<th>` 单元格的集合。\n* `tr.sectionRowIndex`\
  \ – 给定 `<tr>` 在包含它的 `<thead>/<tbody>/<tfoot>` 中的位置（索引）。\n* `tr.rowIndex` – 整个表格中\
  \ `<tr>` 的数量（包括所有表格行）。\n\n### `<td>` 和 `<th>`\n\n* `td.cellIndex` – 包含它的 `<tr>`\
  \ 内部单元格的编号。\n\n\n\n\n\n…除非我们声明了一个同名的 JavaScript 变量，此时该变量将具有更高优先级：\n\n```\n<div id=\"\
  elem\"></div>\n\n<script>\n  let elem = 5; // 现在 elem 是 5，而不是对 <div id=\"elem\"\
  > 的引用\n\n  alert(elem); // 5\n</script>\n```\n\n请不要使用 `id` 命名的全局变量来访问元素。\n\n这种行为在[规范](http://www.whatwg.org/specs/web-apps/current-work/#dom-window-nameditem)\
  \ 中有所描述，因此它算是一种标准。但这种对这种支持主要是为了兼容性。\n\n浏览器试图通过混合 JS 和 DOM 的命名空间来帮助我们。这对于嵌入到 HTML\
  \ 中的简单脚本是可以接受的，但通常不是一件好事。可能会发生命名冲突。此外，当阅读 JS 代码而没有 HTML 参考时，并不清楚变量是源自哪里。\n\n在本教程中，当元素来源明显时，我们使用\
  \ `id` 直接引用元素以保持简洁。\n\n在现实生活中，`document.getElementById` 是首选方法。\n\n### `id` 必须是唯一的\n\
  \n`id` 必须是唯一的。文档中只能有一个具有给定 `id` 的元素。\n\n如果有多个具有相同 `id` 的元素，那么使用该 id 的行为将是不可预测的，例如\
  \ `document.getElementById` 可能会随机返回其中任何一个。因此，请遵守规则并保持 `id` 唯一。\n\n### 只能使用 `document.getElementById`，而不是\
  \ `anyElem.getElementById`\n\n`getElementById` 方法只能在 `document` 对象上调用。它会在整个文档中查找指定的\
  \ `id`。\n\n### querySelectorAll\n\n到为止最全能的方法，`elem.querySelectorAll(css)` 返回 `elem`\
  \ 内部所有匹配给定 CSS 选择器的元素。\n\n在这里我们查找所有作为最后一个子元素的 `<li>` 元素：\n\n```html\n<ul>\n  <li>The</li>\n\
  \  <li>test</li>\n</ul>\n<ul>\n  <li>has</li>\n  <li>passed</li>\n</ul>\n<script>\n\
  \  let elements = document.querySelectorAll('ul > li:last-child');\n\n  for (let\
  \ elem of elements) {\n    alert(elem.innerHTML); // \"test\", \"passed\"\n  }\n\
  </script>\n```\n\n这个方法确实非常强大，因为可以使用任何 CSS 选择器。\n\n### 也可以使用伪类\n\nCSS 选择器中的伪类（如 `:hover`\
  \ 和 `:active`）也被支持。例如，`document.querySelectorAll(':hover')` 将返回当前指针悬停在其上的元素集合（按嵌套顺序：从最外层的\
  \ `<html>` 到最内层的层级）。\n\n### querySelector\n\n调用 `elem.querySelector(css)` 返回匹配给定\
  \ CSS 选择器的第一个元素。\n\n换句话说，结果与 `elem.querySelectorAll(css)[0]` 相同，但后者是在查找*所有*元素并从中挑选一个，而\
  \ `elem.querySelector` 只需要查找一个。所以它的速度更快，写起来也更短。\n\n### matches\n\n之前的方法是在搜索 DOM。\n\
  \n[elem.matches(css)](http://dom.spec.whatwg.org/#dom-element-matches) 不查找任何内容，它仅仅检查\
  \ `elem` 是否匹配给定的 CSS 选择器。它返回 `true` 或 `false`。\n\n当我们遍历元素（比如在数组中）并尝试过滤掉我们感兴趣的元素时，这个方法非常有用。\n\
  \n例如：\n\n```html\n<a href=\"http://example.com/file.zip\">...</a>\n<a href=\"http://ya.ru\"\
  >...</a>\n\n<script>\n  // 可以是任何集合，而不是 document.body.children\n  for (let elem of\
  \ document.body.children) {\n    if (elem.matches('a[href$=\"zip\"]')) {\n     \
  \ alert(\"The archive reference: \" + elem.href );\n    }\n  }\n</script>\n```\n\
  \n### closest\n\n元素的*祖先*是：父元素、父元素的父元素、它的父元素等等。祖先共同构成了从元素到顶部的父级链。\n\n方法 `elem.closest(css)`\
  \ 查找匹配 CSS 选择器的最近祖先。`elem` 本身也会包含在搜索范围内。\n\n换句话说，`closest` 方法从元素向上移动并检查每个父元素。如果匹配选择器，则停止搜索并返回该祖先。\n\
  \n例如：\n\n```html\n<h1>Contents</h1>\n\n<div class=\"contents\">\n  <ul class=\"\
  book\">\n    <li class=\"chapter\">Chapter 1</li>\n    <li class=\"chapter\">Chapter\
  \ 1</li>\n  </ul>\n</div>\n\n<script>\n  let chapter = document.querySelector('.chapter');\
  \ // LI\n\n  alert(chapter.closest('.book')); // UL\n  alert(chapter.closest('.contents'));\
  \ // DIV\n\n  alert(chapter.closest('h1')); // null (因为 h1 不是祖先)\n</script>\n```\n\
  \n### getElementsBy*\n\n还有其他方法通过标签、类等查找节点。\n\n在今天，它们大多已成为历史久了，因为 `querySelector`\
  \ 更强大且写起来更短。\n\n所以，我们在这里介绍它们主要是为了完整性，同时你仍然可以在旧的脚本中找到它们。\n\n*   `elem.getElementsByTagName(tag)`\
  \ 查找具有给定标签的元素并返回这些元素的集合。\n*   `elem.getElementsByClassName(className)` 返回给定类名的元素。\n\
  *   `document.getElementsByName(name)` 返回具有 name 属性的元素。\n\n### 动态集合 (Live collections)\n\
  \n所有的 `\"getElementsBy*\"` 方法都返回一个*动态*集合。此类集合始终反映文档的状态，并在变化时“自动更新”。\n\n在下面的示例中，有两个脚本。\n\
  \n1.  第一个脚本创建了 `<div>` 集合的引用。目前，它的长度为 `1`。\n2.  第二个脚本在浏览器遇到又一个 `<div>` 后运行，所以它的长度为\
  \ `2`。\n\n```html\n<div>First div</div>\n\n<script>\n  let divs = document.getElementsByTagName('div');\n\
  \  alert(divs.length); // 1\n</script>\n\n<div>Second div</div>\n\n<script>\n  alert(divs.length);\
  \ // 2\n</script>\n```\n\n相比之下，`querySelectorAll` 返回的是一个*静态*集合。它看起来就像一个固定的元素数组。\n\
  \n如果我们改用它，那么两个脚本的输出都是 `1`：\n\n```html\n<div>First div</div>\n\n<script>\n  let divs\
  \ = document.querySelectorAll('div');\n  alert(divs.length); // 1\n</script>\n\n\
  <div>Second div</div>\n\n<script>\n  alert(divs.length); // 1\n</script>\n```\n\n\
  \n\n\n现在我们可以很容易地看到区别。在文档中出现新的 `div` 后，静态集合并没有增加。\n\n## 总结\n\n在 DOM 中查找节点有 6 种主要方法：\n\
  \n| 方法 | 通过什么搜索 | 可以在元素上调用吗？ | 是动态的？ |\n| --- | --- | --- | --- |\n| `querySelector`\
  \ | CSS 选择器 | ✔ | - |\n| `querySelectorAll` | CSS 选择器 | ✔ | - |\n| `getElementById`\
  \ | `id` | - | - |\n| `getElementsByName` | `name` | - | ✔ |\n| `getElementsByTagName`\
  \ | tag 或 `'*'` | ✔ | ✔ |\n| `getElementsByClassName` | class | ✔ | ✔ |\n\n到为止最常用的是\
  \ `querySelector` 和 `querySelectorAll`，但 `getElementBy*` 有时可能很有帮助，或者在旧脚本中会被发现。\n\
  \n此外：\n\n*   有 `elem.matches(css)` 用于检查 `elem` 是否匹配给定的 CSS 选择器。\n*   有 `elem.closest(css)`\
  \ 用于查找匹配给定的 CSS 选择器的最近祖先。它也会检查 `elem` 本身。\n\n这里再提这里一个用于检查父子关系的方法，因为它有时很有用：\n\n*\
  \   `elemA.contains(elemB)` 如果 `elemB` 在 `elemA` 内部（`elemA` 的后代）或当 `elemA==elemB`\
  \ 时，返回 true。\n\n## 任务\n\n查找元素的重要性：4\n\n这是一个带有表格和表单的文档。\n\n如何找到？…\n\n1.  带有 `id=\"\
  age-table\"` 的表格。\n2.  该表格内所有的 `label` 元素（应该有 3 个）。\n3.  该表格中的第一个 `td`（包含“Age”一词）。\n\
  4.  `name=\"search\"` 的 `form`。\n5.  该表单中的第一个 `input`。\n6.  该表单中的最后一个 `input`。\n\
  \n在单独窗口中打开页面 [table.html](https://javascript.info/task/find-elements/table.html)\
  \ 并利用浏览器工具完成任务。\n\n查看解\n\n## 节点属性：类型、标签和内容\n\n让我们更深入地查看 DOM 节点。\n\n在本章中，我们将进一步了解它们是什么，并学习它们最常用的属性。\n\
  \n### DOM 节点类\n\n不同的 DOM 节点可能有不同的属性。例如，对应于标签 `<a>` 的元素节点具有链接相关的属性，而对应于 `<input>`\
  \ 的具有输入相关的属性，类等。文本节点与元素节点不同。但它们之间也有共同的属性和方法，因为所有 DOM 节点类形成了一个单一的层次结构。\n\n每个 DOM\
  \ 节点都属于相应的内置类。\n\n层次结构的根节点是 [EventTarget](https://dom.spec.whatwg.org/#eventtarget)，它被\
  \ [Node](http://dom.spec.whatwg.org/#interface-node) 继承，其他 DOM 节点也继承自它。\n\n这是图片，后面是解释：\n\
  \n![](img/dom-class-hierarchy.svg)\n\n这些类是：\n\n*   [EventTarget](https://dom.spec.whatwg.org/#eventtarget)\
  \ – 是根“抽象”类。该类的对象永远不会被创建。它作为一个基类，使得所有 DOM 节点都支持所谓的“事件”，我们稍后会学习它们。\n*   [Node](http://dom.spec.whatwg.org/#interface-node)\
  \ – 也是一个“抽象”类，作为 DOM 节点的基类。它提供了核心树功能：`parentNode`、`nextSibling`、`childNodes` 等（它们是\
  \ getter）。`Node` 类的对象永远不会被创建。但有继承自它的具体节点类，即：`Text` 用于文本节点，`Element` 用于元素节点，以及更奇奇的\
  \ `Comment` 用于注释节点。\n*   [Element](http://dom.spec.whatwg.org/#interface-element)\
  \ – 是 DOM 元素的基类。它提供了元素级导航，如 `nextElementSibling`、`children` 以及搜索方法，如 `getElementsByTagName`、`querySelector`。浏览器不仅支持\
  \ HTML，还支持 XML 和 SVG。`Element` 类作为更特定类的基类：`SVGElement`、`XMLElement` 和 `HTMLElement`。\n\
  *   [HTMLElement](https://html.spec.whatwg.org/multipage/dom.html#htmlelement) –\
  \ 最终是所有 HTML 元素的基类。它被具体的 HTML 元素继承：\n    *   [HTMLInputElement](https://html.spec.whatwg.org/multipage/forms.html#htmlinputelement)\
  \ – 用于 `<input>` 元素的类，\n    *   [HTMLBodyElement](https://html.spec.whatwg.org/multipage/semantics.html#htmlbodyelement)\
  \ – 用于 `<body>` 元素的类，\n    *   [HTMLAnchorElement](https://html.spec.whatwg.org/multipage/semantics.html#htmlanchorelement)\
  \ – 用于 `<a>` 元素的类，\n    *   ……此类推，每个标签都有自己的类，可能会提供特定的属性和方法。\n\n因此，给定节点的完整属性和方法是继承的结果。\n\
  \n例如，让我们考虑一个 `<input>` 元素的 DOM 对象。它属于 [HTMLInputElement](https://html.spec.whatwg.org/multipage/forms.html#htmlinputelement)。\n\
  \n\n\n\n- 在[规范](https://dom.spec.whatwg.org/#node)中几乎没有其他值了。\n\n例如：\n\n```html\n\
  <body>\n  <script>\n  let elem = document.body;\n\n  // 让我们看看它是什么？\n  alert(elem.nodeType);\
  \ // 1 => element (元素)\n\n  // 第一个子节点是...\n  alert(elem.firstChild.nodeType); //\
  \ 3 => text (文本)\n\n  // 对于 document 对象，类型是 9\n  alert( document.nodeType ); //\
  \ 9\n  </script>\n</body>\n```\n\n在现代脚本中，我们可以使用 `instanceof` 和其他基于类的测试用方法来查看节点类型，但有时\
  \ `nodeType` 可能会更简单。我们只能读取 `nodeType`，而不能修改它。\n\n## 标签：nodeName 和 tagName\n\n给定一个\
  \ DOM 节点，我们可以通过 `nodeName` 或 `tagName` 属性读取它的标签名：\n\n例如：\n\n```javascript\nalert(\
  \ document.body.nodeName ); // BODY\nalert( document.body.tagName ); // BODY\n```\n\
  \n`tagName` 和 `nodeName` 之间有区别吗？\n\n当然，区别体现在它们的名称上，但确实有些微妙。\n\n- `tagName` 属性仅存在于\
  \ `Element` 元素节点。\n- `nodeName` 定义于任何 `Node`：\n    - 对于元素，它与 `tagName` 相同。\n   \
  \ - 对于其他节点类型（文本、注释等），它是一个包含节点类型的字符串。\n\n换句话说，`tagName` 仅元素元素支持（因为它源自 `Element` 类），而\
  \ `nodeName` 可以反映其他节点类型。\n\n例如，让我们对比一下 `document` 和注释节点的 `tagName` 和 `nodeName`：\n\
  \n```html\n<body>\n<!-- comment -->\n\n  <script>\n    // 针对注释\n    alert( document.body.firstChild.tagName\
  \ ); // undefined (不是元素)\n    alert( document.body.firstChild.nodeName ); // #comment\n\
  \n    // 针对 document\n    alert( document.tagName ); // undefined (不是元素)\n    alert(\
  \ document.nodeName ); // #document\n  </script>\n</body>\n```\n\n如果我们只处理元素，那么我们可以同时使用\
  \ `tagName` 和 `nodeName` —— 没有区别。\n\n### 标签名在 XML 模式下始终为大写\n\n浏览器有两种处理文档的模式：HTML\
  \ 和 XML。通常 HTML 模式用于网页。当浏览器接收带有头部 `Content-Type: application/xml+xhtml` 的 XML 文档时，会启用\
  \ XML 模式。\n\n在 HTML 模式下 `tagName/nodeName` 总是大写的：无论是 `<body>` 还是 `<BoDy>`，结果都是 `BODY`。\n\
  \n在 XML 模式下，大小写保持“原文”。现在 XML 模式很少使用。\n\n## innerHTML：内容\n\n[innerHTML](https://w3c.github.io/DOM-Parsing/#widl-Element-innerHTML)\
  \ 属性允许作为字符串获取元素内部的 HTML。\n\n我们也可以修改它。因此它是更改页面最强大的方式之一。\n\n示例显示了 `document.body`\
  \ 的内容，然后完全替换了它：\n\n```html\n<body>\n  <p>A paragraph</p>\n  <div>A div</div>\n\n\
  \  <script>\n    alert( document.body.innerHTML ); // 读取当前内容\n    document.body.innerHTML\
  \ = 'The new BODY!'; // 替换它\n  </script>\n\n</body>\n```\n\n我们可以尝试插入无效的 HTML，浏览器会修复我们的错误：\n\
  \n```html\n<body>\n\n  <script>\n    document.body.innerHTML = '<b>test'; // 忘记关闭标签\n\
  \    alert( document.body.innerHTML ); // <b>test</b> (已修复)\n  </script>\n\n</body>\n\
  ```\n\n### 脚本不会执行\n\n如果 `innerHTML` 向文档中插入 `<script>` 标签 —— 它会成为 HTML 的一部分，但不会执行。\n\
  \n#### 注意：“innerHTML+=”会进行全量覆盖\n\n我们可以通过使用 `elem.innerHTML+=\"more html\"` 向元素追加\
  \ HTML。\n\n如下所示：\n\n```javascript\nchatDiv.innerHTML += \"<<div>Hello<img src='smile.gif'/>\
  \ !</div>\";\nchatDiv.innerHTML += \"How goes?\";\n```\n\n但我们我们在执行此操作时应该非常小心，因为发生的并不是添加，而是全量覆盖。\n\
  \n从技术上讲，这两行是等价的：\n\n```javascript\n elem.innerHTML += \"...\";\n// 是这种写法的简写：\nelem.innerHTML\
  \ = elem.innerHTML + \"...\"\n```\n\n换句话说，`innerHTML+=` 执行了以下操作：\n\n1. 移除旧内容。\n\
  2. 写入新的 `innerHTML`（旧内容和新内容的拼接）。\n\n**由于内容被“清零”并从头重写，所有图像和其他资源将重新加载**。\n\n在上面的 `chatDiv`\
  \ 示例中，行 `chatDiv.innerHTML+=\"How goes?\"` 重新创建了 HTML 内容并重新加载了 `smile.gif`（希望它已被缓存）。如果\
  \ `chatDiv` 有很多其他文本和图像，那么重新加载将变得非常明显。\n\n还有其他副作用。例如，如果用鼠标选择了现有文本，大多数浏览器会在重写 `innerHTML`\
  \ 时移除选择状态。如果有一个带有访问者插入文本的 `<input>`，该文本将被清空。\n\n## outerHTML：完整的元素\n\n`outerHTML`\
  \ 属性提供元素本身的 HTML，包括它的孩子。\n\n例如：\n\n```html\n<div id=\"elem\"></div>\n```\n\n如果我们使用\
  \ `elem.outerHTML`，将得到：\n\n```html\n<div id=\"elem\"></div>\n```\n\n与 `innerHTML`\
  \ 只提供内部内容不同，`outerHTML` 包含了根标签。\n\n### 注意：“outerHTML+=”不会追加\n\n如果你对 `outerHTML`\
  \ 使用 `+=`，它的行为与 `innerHTML` 不同。\n\n```javascript\nlet div = document.querySelector('div');\n\
  div.outerHTML += \"<p>New</p>\";\n// 结果: <p>New</p> (原始 div 消失了！)\n```\n\n这是因为 `outerHTML`\
  \ 替换了整个元素。\n\n## nodeValue/data：文本节点内容\n\n`innerHTML` 属性对元素节点有效。\n\n其他节点类型（如文本节点）有对应的属性：`nodeValue`\
  \ 和 `data`。这两个属性在实际使用中几乎相同，只有极细微的规范差异。因此我们将使用 `data`，因为它更短。\n\n读取文本节点和注释内容的示例：\n\
  \n```html\n<body>\n  Hello\n  <!-- Comment -->\n  <script>\n    let text = document.body.firstChild;\n\
  \    alert(text.data); // Hello\n\n    let comment = text.nextSibling;\n    alert(comment.data);\
  \ // Comment\n  </script>\n</body>\n```\n\n## textContent：纯文本\n\n`textContent` 提供了对元素内部*文本*的访问：仅文本，除去所有\
  \ `<tags>`。\n\n例如：\n\n```html\n<div id=\"news\">\n  <h1>Headline!</h1>\n  <p>Martians\
  \ attack people!</p>\n</div>\n\n<script>\n  // Headline! Martians attack people!\n\
  \  alert(news.textContent);\n</script>\n```\n\n\n\n\n正如我们看到的，只返回了文本，仿佛所有的 `<tags>`\
  \ 都被剪掉了，但它们内部的文本保留了下来。\n\n在实践中，很少需要读取此类文本。\n\n写入 `textContent` 要有用得多，因为允许我们以“安全的方式”写入文本。\n\
  \n假设我们有一个任意字符串（例如由用户输入的字符串），并想要显示它。\n\n*   使用 `innerHTML`，它将以“HTML 格式”被插入，包含所有的\
  \ HTML 标签。\n*   使用 `textContent`，它将以“文本格式”被插入，所有符号都被视为字面量。\n\n比较这两者：\n\n```\n<div\
  \ id=\"elem1\"></div>\n<div id=\"elem2\"></div>\n\n<script>\n  let name = prompt(\"\
  What's your name?\", \"<b>Winnie-the-pooh!</b>\");\n\n  elem1.innerHTML = name;\n\
  \  elem2.textContent = name;\n</script>\n```\n\n1.  第一个 `<div>` 以“HTML 格式”获取名称：所有的标签都变成了标签，所以我们看到了加粗的名字。\n\
  2.  第二个 `<div>` 以“文本格式”获取名称，所以我们直观看到了 `<b>Winnie-the-pooh!</b>`。\n\n在大多数情况下，我们期望来自用户的文本，并将其视为文本。我们不希望在网站中出现意外的\
  \ HTML。给 `textContent` 赋值正是为了这一点。\n\n### “hidden”属性\n\n“hidden” 属性和 DOM 属性指定了元素是否可见。\n\
  \n我们可以在 HTML 中使用它，也可以通过 JavaScript 赋值，如下所示：\n\n```\n<<div>Both divs below are hidden</div></div>\n\
  \n<div hidden>With the attribute \"hidden\"</div>\n\n<div id=\"elem\">JavaScript\
  \ assigned the property \"hidden\"</div>\n\n<script>\n  elem.hidden = true;\n</script>\n\
  ```\n\n从技术上讲，`hidden` 的作用与 `style=\"display:none\"` 相同。但写起来更短。\n\n这是一个闪烁的元素：\n\n\
  ```\n<div id=\"elem\">A blinking element</div>\n\n<script>\n  setInterval(() =>\
  \ elem.hidden = !elem.hidden, 1000);\n</script>\n```\n\n### 更多属性\n\nDOM 元素还有额外的属性，特别是那些取决于类的属性：\n\
  \n*   `value` – `<input>`, `<select>` 和 `<textarea>` 的值（`HTMLInputElement`, `HTMLSelectElement`……）。\n\
  *   `href` – `<a href=\"...\">` 的“href”（`HTMLAnchorElement`）。\n*   `id` – 所有元素的“id”\
  \ 属性值（`HTMLElement`）。\n*   ……以及更多……\n\n例如：\n\n```\n<input type=\"text\" id=\"elem\"\
  \ value=\"value\">\n\n<script>\n  alert(elem.type); // \"text\"\n  alert(elem.id);\
  \ // \"elem\"\n  alert(elem.value); // value\n</script>\n```\n\n大多数标准的 HTML 属性都有对应的\
  \ DOM 属性，我们可以像这样访问它。\n\n如果我们想知道给定类支持的属性的完整列表，可以在规范中找到它们。例如，`HTMLInputElement` 文档记录在\
  \ [`html.spec.whatwg.org/#htmlinputelement`](https://html.spec.whatwg.org/#htmlinputelement)\
  \ 中。\n\n或者，如果我们想快速获取它们，或者对具体的浏览器规范感兴趣——我们始终可以使用 `console.dir(elem)` 输出元素并读取属性。或者在浏览器开发者工具的\
  \ Elements 标签页中探索“DOM properties”。\n\n## 总结\n\n每个 DOM 节点属于某个类。这些类形成了层级结构。完整的属性和方法集是继承的结果。\n\
  \n主要的 DOM 节点属性有：\n\n*   `nodeType`：我们可以用它来查看一个节点是文本节点还是元素节点。它有一个数字值：`1` 代表元素，`3`\
  \ 代表文本节点，其他几个代表其他节点类型。只读。\n*   `nodeName/tagName`：对于元素，是标签名（除非是 XML 模式，否则大写）。对于非元素节点，`nodeName`\
  \ 描述它是什么。只读。\n*   `innerHTML`：元素的 HTML 内容。可以修改。\n*   `outerHTML`：元素的完整 HTML。向 `elem.outerHTML`\
  \ 写入操作不会触及 `elem` 本身。相反，它会被外部上下文中的新 HTML 替换。\n*   `nodeValue/data`：非元素节点（文本、注释）的内容。两者几乎相同，我们通常使用\
  \ `data`。可以修改。\n*   `textContent`：元素内部的文本：HTML 减去所有的 `<tags>`。向其中写入会将文本放入元素内部，所有特殊字符和标签都被完全视为文本。可以安全地插入用户生成的文本并防止意外的\
  \ HTML 插入。\n*   `hidden`：当设置为 `true` 时，作用等于 CSS `display:none`。\n\nDOM 节点还有其他取决于其类的属性。例如，`<input>`\
  \ 元素 (`HTMLInputElement`) 支持 `value`, `type`，而 `<a>` 元素 (`HTMLAnchorElement`) 支持\
  \ `href` 等。大多数标准的 HTML 属性都有对应的 DOM 属性。\n\n然而，HTML 属性和 DOM 属性并不总是相同的，正如我们在下一节中看到的。\n\
  \n## 任务\n\n**计算后代重要性：5**\n\n有一个类似于嵌套 `ul/li` 的树形结构。\n\n编写代码，为每个 `<li>` 显示：\n1. 它内部的文本是什么（不包含子树）\n\
  2. 嵌套 `<li>` 的数量——所有的后代，包括深层嵌套的。\n\n[在新窗口中演示](http://localhost:1339/task/tree-info/solution/)\n\
  [打开任务沙盒](https://plnkr.co/edit/StdK8kxRq5danHbaMjX?p=preview)\n查看答案\n\n**nodeType\
  \ 是什么？：5**\n\n脚本显示什么？\n\n```\n<html>\n\n<body>\n  <script>\n    alert(document.body.lastChild.nodeType);\n\
  \  </script>\n</body>\n\n</html>\n```\n\n查看答案\n\n**注释中的标签重要性：3**\n\n这段代码显示什么？\n\n\
  ```\n<script>\n  let body = document.body;\n\n  body.innerHTML = \"<!--\" + body.tagName\
  \ + \"-->\";\n\n  alert( body.firstChild.data ); // 这里是什么？\n</script>\n```\n查看答案\n\
  \n**document 在层级结构中的位置？：4**\n\n`document` 属于哪个类？\n\n它在层级结构中的位置如何？\n\n它是继承自 `Node`\
  \ 还是 `Element`，或者是 `HTMLElement`？\n\n查看答案\n\n### 属性与属性\n\n在 HTML 中，标签可以有属性。当浏览器解析\
  \ HTML 为标签创建 DOM 对象时，它会识别*标准*属性并从它们创建 DOM 属性。\n\n因此，当元素具有 `id` 或另一个*标准*属性时，就会创建相应的属性。但如果属性是非标准的，则不会发生这种情况。\n\
  \n\n\n\n\n```html\n <body id=\"test\" something=\"non-standard\">\n  <script>\n\
  \    alert(document.body.id); // test\n    // 非标准属性不会产生对应的属性\n    alert(document.body.something);\
  \ // undefined\n  </script>\n</body>\n```\n\n请注意，一个元素的标准属性对于另一个元素可能是未知的。例如，`\"type\"\
  ` 对于 `<input>` ([HTMLInputElement](https://html.spec.whatwg.org/#htmlinputelement))\
  \ 来说是标准的，但对于 `<body>` ([HTMLBodyElement](https://html.spec.whatwg.org/#htmlbodyelement))\
  \ 却不是。标准属性在相应元素类的规范中会有有描述。\n\n我们在这里可以看到它：\n\n```html\n <body id=\"body\" type=\"\
  ...\">\n  <input id=\"input\" type=\"text\">\n  <script>\n    alert(input.type);\
  \ // text\n    alert(body.type); // undefined: DOM 属性未被创建，因为它是非标准的\n  </script>\n\
  </body>\n```\n\n因此，如果一个属性是非标准的，它就不会有对应的 DOM 属性。有什么方法可以访问此类属性吗？\n\n当然可以。可以通过以下方法访问所有属性：\n\
  \n*   `elem.hasAttribute(name)` – 检查是否存在。\n*   `elem.getAttribute(name)` – 获取值。\n\
  *   `elem.setAttribute(name, value)` – 设置值。\n*   `elem.removeAttribute(name)` –\
  \ 移除属性。\n\n这些方法的操作方式与 HTML 中编写的内容完全一致。\n\n此外，可以使用 `elem.attributes` 读取所有属性：这是一个属于内置\
  \ [Attr](https://dom.spec.whatwg.org/#attr) 类的对象集合，具有 `name` 和 `value` 属性。\n\n这里有一个读取非标准属性的演示：\n\
  \n```html\n <body something=\"non-standard\">\n  <script>\n    alert(document.body.getAttribute('something'));\
  \ // non-standard\n  </script>\n</body>\n```\n\nHTML 属性具有以下特征：\n\n*   它们的名称是不区分大小写的（`id`\
  \ 与 `ID` 相同）。\n*   它们的值始终是字符串。\n\n这里有一个处理属性的扩展演示：\n\n```html\n<body><body>\n  <div\
  \ id=\"elem\" about=\"Elephant\"></div>\n\n  <script>\n    alert( elem.getAttribute('About')\
  \ ); // (1) 'Elephant', 读取\n\n    elem.setAttribute('Test', 123); // (2), 写入\n\n\
  \    alert( elem.outerHTML ); // (3), 检查属性是否在 HTML 中（是）\n\n    for (let attr of\
  \ elem.attributes) { // (4) 列出所有\n      alert( `${attr.name} = ${attr.value}` );\n\
  \    }\n  </script>\n</body>\n```\n\n请注意：\n\n1.  `getAttribute('About')` – 这里的第一个字母是大写的，而在\
  \ HTML 中它全都是小写的。但这没关系：属性名称是不区分大小写的。\n2.  我们可以给属性赋值任何内容，但它会变成字符串。因此这里的值是 `\"123\"\
  `。\n3.  所有属性（包括我们设置的属性）在 `outerHTML` 中都是可见的。\n4.  `attributes` 集合是迭代的，并且包含了元素的所有属性（标准和非标准），这些属性都是具有\
  \ `name` 和 `value` 属性的对象。\n\n### 属性与属性同步\n\n当标准属性发生变化时，对应的属性会自动更新（在某些例外情况下，反之亦然）。\n\
  \n在下面的示例中，`id` 被作为属性修改了，我们可以看到属性也发生了变化。然后反向也一样：\n\n```html\n<input>\n\n<script>\n\
  \  let input = document.querySelector('input');\n\n  // 属性 => 属性\n  input.setAttribute('id',\
  \ 'id');\n  alert(input.id); // id（已更新）\n\n  // 属性 => 属性\n  input.id = 'newId';\n\
  \  alert(input.getAttribute('id')); // newId（已更新）\n</script>\n```\n\n但存在排除情况，例如\
  \ `input.value` 仅从属性 → 属性进行同步，而不会反向同步：\n\n```html\n <input>\n\n<script>\n  let input\
  \ = document.querySelector('input');\n\n  // 属性 => 属性\n  input.setAttribute('value',\
  \ 'text');\n  alert(input.value); // text\n\n  // 非 属性 => 属性\n  input.value = 'newValue';\n\
  \  alert(input.getAttribute('value')); // text（未更新！）\n</script>\n```\n\n在上面的示例中：\n\
  \n*   更改属性 `value` 会更新属性。\n*   但属性的变化不会影响属性。\n\n这个“特性”实际上可能很有用，因为用户操作可能会导致 `value`\
  \ 发生变化，而在之后，如果我们想从 HTML 中恢复“原始”值，它就在属性中。\n\n### DOM 属性是有带类型的\n\nDOM 属性并不总是字符串。例如，`input.checked`\
  \ 属性（用于复选框）是一个布尔值：\n\n```html\n<input id=\"input\" type=\"checkbox\" checked> 复选框\n\
  \n<script>\n  alert(input.getAttribute('checked')); // 属性值为：空字符串\n  alert(input.checked);\
  \ // 属性的值为：true\n</script>\n```\n\n还有其他例子。`style` 属性是一个字符串，但 `style` 属性是一个对象：\n\n\
  ```html\n<div id=\"div\" style=\"color:red;font-size:120%\">你好</div>\n\n<script>\n\
  \  // 属性是字符串\n  alert(div.getAttribute('style')); // color:red;font-size:120%\n\n\
  \  // 属性是对象\n  alert(div.style); // [object CSSStyleDeclaration]\n</script>\n```\n\
  \n\n\n\n\n```\n<body data-about=\"Elephants\">\n<script>\n  alert(document.body.dataset.about);\
  \ // Elephants\n</script>\n```\n\n像 `data-order-state` 这样的多词属性会变成驼峰命名：`dataset.orderState`。\n\
  \n这里是一个重写的“订单状态”示例：\n\n```html\n<style>\n  .order[data-order-state=\"new\"] {\n\
  \    color: green;\n  }\n\n  .order[data-order-state=\"pending\"] {\n    color:\
  \ blue;\n  }\n\n  .order[data-order-state=\"canceled\"] {\n    color: red;\n  }\n\
  </style>\n\n<div id=\"order\" class=\"order\" data-order-state=\"new\">\n  A new\
  \ order.\n</div>\n\n<script>\n  // read\n  alert(order.dataset.orderState); // new\n\
  \n  // modify\n  order.dataset.orderState = \"pending\"; // (*)\n</script>\n```\n\
  \n使用 `data-*` 属性是传递自定义数据的一种有效且安全的方法。\n\n请注意，我们不仅可以读取，还可以修改数据属性。然后 CSS 会相应地更新视图：在上面的示例中，最后一行\
  \ `(*)` 将颜色更改为蓝色。\n\n## 总结\n\n*   属性（Attributes）—— 写在 HTML 中的内容。\n*   属性（Properties）——\
  \ DOM 对象中的内容。\n\n这里有一个简单的比较：\n\n| | 属性 (Properties) | 属性 (Attributes) |\n| --- |\
  \ --- | --- |\n| 类型 | 任意值，标准属性的类型在规范中有描述 | 字符串 |\n| 名称 | 名称区分大小写 | 名称不区分大小写 |\n\n\
  操作属性的方法有：\n\n*   `elem.hasAttribute(name)` – 检查是否存在。\n*   `elem.getAttribute(name)`\
  \ – 获取值。\n*   `elem.setAttribute(name, value)` – 设置值。\n*   `elem.removeAttribute(name)`\
  \ – 移除属性。\n*   `elem.attributes` 是所有属性的集合。\n\n在大多数情况下，使用 DOM 属性是更优的。只有当 DOM 属性不符合我们的需求时，或者我们需要精确的属性时，才应该引用属性，例如：\n\
  \n*   我们需要一个非标准属性。但如果它以 `data-` 开头，我们应该使用 `dataset`。\n*   我们想读取 HTML 中“按字写入”的值。DOM\
  \ 属性的值可能不同，例如 `href` 属性始终是一个完整的 URL，而我们可能想要获取“原始”值。\n\n## 任务\n\n获取属性重要性：5\n\n编写代码从文档中选择具有\
