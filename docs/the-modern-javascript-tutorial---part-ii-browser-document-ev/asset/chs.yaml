  \ | ... |\n\n编写代码按 `\"name\"` 列对其进行排序。\n\n\n\n\n```javascript\nlet top = /* complex\
  \ calculations */;\nlet left = /* complex calculations */;\n\nelem.style.left =\
  \ left; // 例如 '123px', 在运行时计算\nelem.style.top = top; // 例如 '456px'\n```\n\n对于其他情况，例如让文字变为红色、添加背景图标——请在\
  \ CSS 中描述它们，然后添加类（JavaScript 可以做到这一点）。那样更灵活，也更容易于支持。\n\n## className 和 classList\n\
  \n更改类是脚本中最频繁使用的操作之一。\n\n在旧时代，JavaScript 有一个限制：像 `\"class\"` 这样的保留字不能作为对象的属性。现在这种限制已经不存在了，但在那时是不可能拥有\
  \ `\"class\"` 属性的，例如 `elem.class`。\n\n因此，对于类，引入了外观相似的属性 `\"className\"`：`elem.className`\
  \ 对应于 `\"class\"` 属性。\n\n例如：\n\n```html\n<body class=\"main page\">\n  <script>\n\
  \    alert(document.body.className); // main page\n  </script>\n</</body>\n```\n\
  \n如果我们给 `elem.className` 赋值，它将替换整个类字符串。有时这是我们需要的，但通常我们只是想添加或删除单个类。\n\n有另一个属性可以实现：`elem.classList`。\n\
  \n`elem.classList` 是一个特殊对象，拥有 `add/remove/toggle` 单个类的方法。\n\n例如：\n\n```html\n<body\
  \ class=\"main page\">\n  <script>\n    // 添加一个类\n    document.body.classList.add('article');\n\
  \n    alert(document.body.className); // main page article\n  </script>\n</</body>\n\
  ```\n\n所以，我们既可以使用 `className` 操作整个类类字符串，也可以使用 `classList` 操作单个类。我们选择哪种取决于我们的需求。\n\
  \n### `classList` 的方法：\n\n* `elem.classList.add/remove(\"class\")` – 添加/删除该类。\n\
  * `elem.classList.toggle(\"class\")` – 如果该类不存在则添加，否则删除它。\n* `elem.classList.contains(\"\
  class\")` – 检查是否存在给定的类，返回 `true/false`。\n\n此外，`classList` 是可迭代的，因此我们可以使用 `for..of`\
  \ 列出所有类，如下所示：\n\n```html\n<body class=\"main page\">\n  <script>\n    for (let name\
  \ of document.body.classList) {\n      alert(name); // main，然后是 page\n    }\n  </script>\n\
  </</body>\n```\n\n## Element style (元素样式)\n\n`elem.style` 属性是一个对象，对应于 `\"style\"\
  ` 属性中编写的内容。设置 `elem.style.width=\"100px\"` 与在属性 `style` 中写字符串 `width:100px` 是一样的。\n\
  \n对于多单词属性，使用了驼峰命名法（camelCase）：\n\n```javascript\nbackground-color  => elem.style.backgroundColor\n\
  z-index           => elem.style.zIndex\nborder-left-width => elem.style.borderLeftWidth\n\
  ```\n\n例如：\n\n```javascript\ndocument.body.style.backgroundColor = prompt('background\
  \ color?', 'green');\n```\n\n### 前缀属性 (Prefixed properties)\n\n浏览器前缀属性如 `-moz-border-radius`、`-webkit-border-radius`\
  \ 也遵循相同的规则：连字符表示大写字母。\n\n例如：\n\n```javascript\nbutton.style.MozBorderRadius = '5px';\n\
  button.style.WebkitBorderRadius = '5px';\n```\n\n### 重置样式属性 (Resetting the style\
  \ property)\n\n有时我们想分配样式属性，稍后将其移除。\n\n例如，为了隐藏一个元素，我们可以设置 `elem.style.display = \"\
  none\"`。\n\n稍后我们可能想移除 `style.display` 就像它被设置过一样。与其使用 `delete elem.style.display`，不如给它赋一个空字符串：`elem.style.display\
  \ = \"\"`。\n\n```javascript\n// 如果运行这段代码，<body> 将闪烁\ndocument.body.style.display\
  \ = \"none\"; // 隐藏\n\nsetTimeout(() => document.body.style.display = \"\", 1000);\
  \ // 恢复正常\n```\n\n如果我们将 `style.display` 设置为空字符串，浏览器就会正常应用 CSS 类和内置样式，就像完全没有 `style.display`\
  \ 属性一样。\n\n## 使用 cssText 进行完整重写 (Full rewrite with style.cssText)\n\n通常，我们使用 `style.*`\
  \ 来分配单个样式属性。我们无法像这样 `div.style=\"color: red; width: 100px\"` 直接设置完整样式，因为 `div.style`\
  \ 是一个对象且是只的。\n\n要用字符串设置完整样式，有一个特殊的属性 `style.cssText`：\n\n```html\n<div id=\"div\"\
  >Button</div>\n\n<script>\n  // 可以在这里设置像 \"important\" 这样的特殊标记\n  div.style.cssText=`color:\
  \ red !important;\n    background-color: yellow;\n    width: 100px;\n    text-align:\
  \ center;\n  `;\n\n  alert(div.style.cssText);\n</script>\n```\n\n这个属性很少使用，因为这种赋值会移除所有现有样式：它不是添加而是替换。有时可能会删除需要的内容。但当我们知道不会删除现有样式时，可以安全地对新元素使用它。\n\
  \n可以通过设置属性来实现：`div.setAttribute('style', 'color: red...')`。\n\n\n\n\n\n例如，如果存在 `paddingLeft/paddingTop`\
  \ 属性，那么 `getComputedStyle(elem).padding` 应该得到什么？是空值，还是根据已知内边距生成的“生成”值？这里没有标准规则。\n\
  \n还存在其他不一致之处。例如，某些浏览器（Chrome）在下面的文档中显示 `10px`，而另一些（Firefox）则不显示：\n\n```html\n<style>\n\
  \  body {\n    margin: 10px;\n  }\n</style>\n<script>\n  let style = getComputedStyle(document.body);\n\
  \  alert(style.margin); // 在 Firefox 中返回空字符串\n</script>\n```\n\n应用到 `:visited` 链接的样式是被隐藏的！\n\
  \n访问过的链接可以使用 `:visited` CSS 伪类来设置颜色。\n\n但 `getComputedStyle` 无法访问该颜色，否则任意页面都可以通过在页面上创建链接并检查样式，来发现用户是否访问过该链接。\n\
  \nJavaScript 可能无法看到由 `:visited` 应用的样式。此外，CSS 也有一个限制，禁止在 `:visited` 中应用改变几何形状的样式。这样做是为了确保恶意页面无法通过侧面方法测试链接是否被访问，从而破坏隐私。\n\
  \n## 总结\n\n为了管理类，有两个 DOM 属性：\n\n*   `className` – 字符串值，适用于管理整组类。\n*   `classList`\
  \ – 具有 `add/remove/toggle/contains` 方法的对象，适用于管理单个类。\n\n若要更改样式：\n\n*   `style` 属性是一个包含带有驼峰命名样式的对象。对其进行读取和写入操作与修改\
  \ `\"style\"` 属性中的单独各个属性具有相同含义。如需了解如何应用 `important` 和其他稀有属性——可以参考 [MDN](https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration)\
  \ 上的方法列表。\n*   `style.cssText` 属性对应整个 `\"style\"` 属性，即样式的完整字符串。\n\n要读取解析后的样式（考虑到所有类，在所有\
  \ CSS 均应用并计算出最终值后）：\n\n*   `getComputedStyle(elem, [pseudo])` 返回一个包含这些样式的类样式对象。只读的。\n\
  \n## 任务\n\n创建一个通知 `importance: 5`\n\n编写一个函数 `showNotification(options)`，它创建一个带有给定内容的通知：`<div\
  \ class=\"notification\">`。该通知应在 1.5 秒后自动消失。\n\n选项如下：\n\n```javascript\n// 在窗口右上角显示一个文本为\
  \ \"Hello\" 的元素\nshowNotification({\n  top: 10, // 距离窗口顶部 10px（默认为 0px）\n  right:\
  \ 10, // 距离窗口右边缘 10px（默认为 0px）\n  html: \"Hello!\", // 内容的 HTML\n  className: \"\
  welcome\" // 为 div 添加的额外类（可选）\n});\n```\n\n[在新窗口中查看 Demo](http://localhost:1339/task/create-notification/solution/)\n\
  \n使用 CSS 定位在给定的 top/right 坐标显示元素。源文档已包含所需的样式。\n\n[打开任务的沙盒。](https://plnkr.co/edit/x3gD4Y46gGjDWgAVsdHI?p=preview)\n\
  \n查看解决方案\n\n## 元素尺寸与滚动\n\n有很多 JavaScript 属性允许我们读取关于元素宽度、高度和其他几何特征的信息。\n\n在在 JavaScript\
  \ 中移动或定位元素时，我们经常需要它们。\n\n### 示例元素\n\n为了演示我们将用到的属性，我们使用下面提供的元素：\n\n```html\n<div\
  \ id=\"example\">\n  ...Text...\n</div>\n<style>\n  #example {\n    width: 300px;\n\
  \    height: 200px;\n    border: 25px solid #E8C48F;\n    padding: 20px;\n    overflow:\
  \ auto;\n  }\n</style>\n```\n\n它具有边框、内边距和滚动条。包含了全套功能。没有外边距（margin），因为它们不是元素本身的一部分，也没有专门的属性。\n\
  \n该元素看起来如下：\n\n![](img/metric-css.svg)\n\n你可以[在沙盒中打开文档](https://plnkr.co/edit/mqrTzVMfm5Qk7eaaENTH?p=preview)。\n\
  \n### 注意滚动条\n\n上面的图片展示了元素具有滚动条时最复杂的情况。某些浏览器（并非所有）会通过从内容中留出空间来保留它（如上方标记的“content\
  \ width”）。\n\n因此，如果没有滚动条，内容宽度将是 `300px`，但如果滚动条宽度为 `16px`（宽度可能随设备和浏览器而异），则仅剩 `300\
  \ - 16 = 284px`，我们需要考虑到这一点。这就是为什么本章的示例假设存在滚动条。如果没有它，某些计算会更简单。\n\n### padding-bottom\
  \ 区域可能填充了文本\n\n通常在我们的插图中，内边距显示为空白，但如果元素中有大量文本且发生了溢出，浏览器会在 `padding-bottom` 处显示“溢出”的文本，这是正常的。\n\
  \n### 几何属性\n\n这是几何属性的概览：\n\n![](img/metric-all.svg)\n\n`getComputedStyle` 的值是包含这些样式的类样式对象。只读。\n\
  \n### offset-parent\n\n`getComputedStyle(elem, [pseudo])` 返回包含这些样式的类样式对象。只读。\n\n\
  在以下情况下 `offsetParent` 为 `null`：\n\n1.  对于未显示的元素（`display:none` 或不在文档中）。\n2.  对于\
  \ `body` 和 `html`。\n3.  对于 `position:fixed` 的元素。\n\n### offsetWidth/Height\n\n现在来看元素本身。\n\
  \n这两个属性是最简单的。它们提供了元素的“外部”宽度/高度。换句话说就是包括边框在内的尺寸。\n\n![](img/metric-width-height.svg)\n\
  \n对于我们的示例元素：\n\n*   `offsetWidth = 390` – 宽度，计算方式为内部 宽度 (`300px`) 加上内边距 (`2 * 20px`)\
  \ 和边框 (`2 * 25px`)。\n*   `offsetHeight = 290` – 高度。\n\n### 未显示元素的几何属性\n\n几何属性仅对显示元素进行计算。如果元素（或其任何祖先）具有\
  \ `display:none` 或不在文档中，则所有几何属性均为 0（`offsetParent` 为 `null`）。\n\n例如，当我们创建一个元素但尚未插入文档时，或者它及其祖先具有\
  \ `display:none` 时，`offsetParent` 为 `null`，且 `offsetWidth` 和 `offsetHeight` 为 `0`。我们可以用此来检查元素是否隐藏，如下所示：\n\
  \n```javascript\nfunction isHidden(elem) {\n  return !elem.offsetWidth && !elem.offsetHeight;\n\
  }\n```\n\n请注意，这种 `isHidden` 对于在屏幕上但尺寸为零的元素返回 `true`。\n\n### clientTop/Left\n\n元素内部有边框。为了测量它们，有\
  \ `clientTop` 和 `clientLeft` 属性。在我们的示例中：\n\n*   `clientLeft = 25` – 左边框宽度\n*   `clientTop\
  \ = 25` – 上边框宽度\n\n![](img/metric-client-left-top.svg)\n\n但准确地说，这些属性不是边框宽度/高度，而是内侧相对于外侧的相对坐标。区别在哪里？\n\
  \n\n\n\n当文档从右到左显示时（操作系统为阿拉伯语或希伯来语），这种情况就会变得可见。此时滚动条不在右侧而是在左侧，因此 `clientLeft` 也包含了滚动条的宽度。\n\
  \n在这种情况下，`clientLeft` 将不是 `25`，而是加上滚动条宽度变为 `25 + 16 = 41`。\n\n以下是希伯来语示例：\n\n![](img/metric-client-left-top-rtl.svg)\n\
  \n#### clientWidth/Height\n\n这些属性提供了元素边界内部区域的大小。\n\n它们包含了内容宽度以及内边距（padding），但不包含滚动条：\n\
  \n![](img/metric-client-width-height.svg)\n\n在上面的图片中，让我们先考虑 `clientHeight`。\n\n\
  没有水平滚动条，所以它正好是边界内部内容的总和：CSS 高 `200px` 加上顶部和底部内边距（`2 * 20px`），共 `240px`。\n\n现在看 `clientWidth`\
  \ —— 这里的内容宽度不是 `300px`，而是 `284px`，因为 `16px` 被滚动条占据了。所以总和是 `284px` 加上左、右内边距，共 `324px`。\n\
  \n如果没有内边距，那么 `clientWidth/Height` 正好是边界内部和滚动条（如果有的话）的内容区域。\n\n![](img/metric-client-width-nopadding.svg)\n\
  \n因此，当没有内边距时，我们可以使用 `clientWidth/clientHeight` 来获取内容区域的大小。\n\n#### scrollWidth/Height\n\
  \n这些属性类似于 `clientWidth/clientHeight`，但它们还包含了滚出的（隐藏的）部分：\n\n![](img/metric-scroll-width-height.svg)\n\
  \n在上面的图片中：\n\n*   `scrollHeight = 723` —— 内容区域的完整内部高度，包括滚出的部分。\n*   `scrollWidth\
  \ = 324` —— 完整的内部宽度，这里没有水平滚动，所以它等于 `clientWidth`。\n\n我们可以使用这些属性将元素扩展到它的完整宽度/高度。\n\
  \n如下所示：\n\n```javascript\n// 将元素扩展到完整内容高度\nelement.style.height = `${element.scrollHeight}px`;\n\
  ```\n\n#### scrollLeft/scrollTop\n\n`scrollLeft/scrollTop` 属性是元素隐藏的、滚出的部分的宽度/高度。\n\
  \n在下面的图片中，我们可以看到一个带有垂直滚动条的区块的 `scrollHeight` 和 `scrollTop`。\n\n![](img/metric-scroll-top.svg)\n\
  \n换句话说，`scrollTop` 是“向上滚动了多少”。\n\n`scrollLeft/scrollTop` 可以被修改\n\n大部分几何属性都是只读的，但\
  \ `scrollLeft/scrollTop` 可以更改，浏览器会因此滚动元素。\n\n将 `scrollTop` 设置为 `0` 或 `Infinity`\
  \ 将分别使元素滚动到最顶部/最底部。\n\n#### 不要从 CSS 中获取宽度/高度\n\n我们刚刚涵盖了 DOM 元素的几何属性，这些属性可以用于获取宽度、高度并计算距离。\n\
  \n但正如我们在样式和类 章节中所知，我们可以使用 `getComputedStyle` 读取 CSS 高和宽。\n\n那么，为什么不直接用 `getComputedStyle`\
  \ 来读取元素的宽度呢？\n\n```javascript\nlet elem = document.body;\n\nalert( getComputedStyle(elem).width\
  \ ); // 显示 elem 的 CSS 宽度\n```\n\n为什么我们应该使用几何属性呢？有两个原因：\n\n1.  首先，CSS `width/height`\
  \ 取决于另一个属性：`box-sizing`，它定义了什么是 CSS 宽高度。为了 CSS 的目的更改 `box-sizing` 可能会破坏此类 JavaScript\
  \ 代码。\n2.  其次，CSS `width/height` 可能是 `auto`，例如对于内联元素：\n\n```html\n<span id=\"elem\"\
  >Hello!</span>\n\n<script>\n  alert( getComputedStyle(elem).width ); // auto\n</script>\n\
  ```\n\n从 CSS 的角度来看，`width:auto` 是完全正常的，但在 JavaScript 中，我们需要一个精确的 `px` 尺寸以便在计算中使用。所以这里\
  \ CSS 的宽度是没用的。\n\n还有最后一个原因：滚动条。有时，在没有滚动条时运行良好的代码在有了滚动条后就会出现 Bug，因为在某些浏览器中，滚动条会占用内容的空间。因此内容实际可用宽度小于\
  \ CSS 宽度。而 `clientWidth/clientHeight` 考虑了这一点。\n\n……但使用 `getComputedStyle(elem).width`\
  \ 情况则不同。某些浏览器（例如 Chrome）返回减去滚动条后的真实内部宽度，而另一些浏览器（例如 Firefox）则返回 CSS 宽度（忽略滚动条）。这种跨浏览器差异就是我们不使用\
  \ `getComputedStyle` 而是依赖几何属性的原因。\n\n请注意，所描述的差异仅关于从 JavaScript 读取 `getComputedStyle(...).width`，在视觉上一切都是正确的。\n\
  \n## 总结\n\n元素具有以下几何属性：\n\n*   `offsetParent` —— 是最近的定位祖先或 `td`、`th`、`table`、`body`。\n\
  *   `offsetLeft/offsetTop` —— 相对于 `offsetParent` 左上边缘的坐标。\n*   `offsetWidth/offsetHeight`\
  \ —— 包含边界元素的“外部”宽度/高度。\n*   `clientLeft/clientTop` —— 从左上外角到内角的距离。对于从从左到右的操作系统，它们始终是左/右的宽度。\n\
  \n\n\n\n## 窗口宽度/高度\n\n要获取窗口的宽度和高度，我们可以使用 `document.documentElement` 的 `clientWidth/clientHeight`：\n\
  \n![](img/document-client-width-height.svg)而不是 `window.innerWidth/Height`\n\n浏览器也支持\
  \ `window.innerWidth/innerHeight` 属性。它们看起来正是我们想要的。。那么为什么不直接用它们呢？\n\n如果存在滚动条且占据了某些空间，`clientWidth/clientHeight`\
  \ 提供不包含滚动条的宽度/高度（即减去滚动条）。换句话说，它们返回的是文档可见部分的宽度/高度，供内容使用的空间。\n\n……而 `window.innerWidth/innerHeight`\
  \ 滚动条。\n\n如果存在滚动条且占据了某些空间，这两行代码将显示不同的值：\n\n```\nalert( window.innerWidth ); // 窗口全宽\n\
  alert( document.documentElement.clientWidth ); // 窗口宽度减去滚动条\n```\n\n在大多数情况下，我们需要*可用的*窗口宽度：用于绘制或放置某些元素。即：如果有滚动条，则位于其内部。因此，我们应该使用\
  \ `documentElement.clientHeight/Width`。\n\n### `DOCTYPE` 非常重要\n\n请注意：当 HTML 中没有\
  \ `<!DOCTYPE HTML>` 时，顶层几何属性的作用可能会略有不同。可能会出现奇怪的情况。\n\n在现代 HTML 中，我们应该始终编写 `DOCTYPE`。\n\
  \n## 文档宽度/高度\n\n理论上，由于根文档元素是 `document.documentElement` 且包含了所有内容，我们可以通过 `document.documentElement.scrollWidth/scrollHeight`\
  \ 测量文档的完整尺寸。\n\n在该元素上，对于整个页面，这些属性并没有按预期工作。在 Chrome/Safari/Opera 中，如果没有滚动，`documentElement.scrollHeight`\
  \ 甚至比 `documentElement.clientHeight` 还要小！听起来很荒谬，很奇怪对吧？\n\n为了可靠地获取整个文档的高度，我们应该取这些属性的最大值：\n\
  \n```\nlet scrollHeight = Math.max(\n  document.body.scrollHeight, document.documentElement.scrollHeight,\n\
  \  document.body.offsetHeight, document.documentElement.offsetHeight,\n  document.body.clientHeight,\
  \ document.documentElement.clientHeight\n);\n\nalert('完整文档高度（包含滚动出的部分）: ' + scrollHeight);\n\
  ```\n\n为什么呢？别问了。这些不一致性源于古代，而不是什么“智能”逻辑。\n\n## 获取当前滚动位置\n\nDOM 元素通过 `elem.scrollLeft/scrollTop`\
  \ 存储当前的滚动状态。\n\n对于文档滚动，`document.documentElement.scrollLeft/Top` 在大多数浏览器中有效，旧旧的基于\
  \ WebKit 的浏览器，如 Safari（bug [5991](https://bugs.webkit.org/show_bug.cgi?id=5991)），在那里我们应该使用\
  \ `document.body` 而不是 `document.documentElement`。\n\n幸运的是，我们完全不需要记住这些特性，因为滚动位置可以通过特殊的属性\
  \ `window.pageXOffset/pageYOffset` 获取：\n\n```\nalert('距离顶部的滚动位置: ' + window.pageYOffset);\n\
  alert('距离左侧的滚动位置: ' + window.pageXOffset);\n```\n\n这些属性是只读的。\n\n## 滚动：scrollTo,\
  \ scrollBy, scrollIntoView\n\n### 注意：\n\n要通过 JavaScript 滚动页面，其 DOM 必须已完全构建。\n\n\
  例如，如果我们尝试在 `<head>` 中的脚本中滚动页面，它将不起作用。\n\n普通元素可以通过更改 `scrollTop/scrollLeft` 来滚动。\n\
  \n我们也可以通过 `document.documentElement.scrollTop/Left` 对页面执行相同的操作（Safari 除外，应使用 `document.body.scrollTop/Left`）。\n\
  \n另一种方法是更简单、更通用的解决方案：特殊方法 [window.scrollBy(x,y)](https://developer.mozilla.org/en-US/docs/Web/API/Window/scrollBy)\
  \ 和 [window.scrollTo(pageX,pageY)](https://developer.mozilla.org/en-US/docs/Web/API/Window/scrollTo)。\n\
  \n*   `scrollBy(x,y)` 方法相对于其*当前位置*滚动页面。例如，`scrollBy(0,10)` 将页面向下滚动 `10px`。\n\n*\
  \   `scrollTo(pageX,pageY)` 方法将页面滚动到*绝对坐标*，使得可见部分的左上角相对于文档左上角的坐标为 `(pageX, pageY)`。这类似于设置\
  \ `scrollLeft/scrollTop`。\n\n    要滚动到最开始位置，我们可以使用 `scrollTo(0,0)`。\n\n这些方法在所有浏览器中的工作方式都是相同的。\n\
  \n### scrollIntoView\n\n为了完整起见，让我们再涵盖一个方法：[elem.scrollIntoView(top)](https://developer.mozilla.org/en-US/docs/Web/API/Element/scrollIntoView)。\n\
  \n调用 `elem.scrollIntoView(top)` 会滚动页面使 `elem` 可见。它接受一个参数：\n\n*   如果 `top=true`（默认值），则页面将滚动使\
  \ `elem` 出现在窗口顶部。元素的上边缘与窗口顶部对齐。\n\n*   如果 `top=false`，则页面将滚动使 `elem` 出现在底部。元素的下边缘与窗口底部对齐。\n\
  \n## 禁止滚动\n\n有时我们需要让文档变为“不可滚动”。例如，当我们需要用一个需要立即关注的大消息覆盖它时，我们希望访问者与该消息交互，而不是与文档交互。\n\
  \n要让文档不可滚动，只需设置 `document.body.style.overflow = \"hidden\"` 即可。页面将冻结。\n\n该方法的缺点是滚动条会消失。如果它之前占据了某些空间，那么内容会“跳动”。\n\
  \n## 总结\n\n### 几何结构：\n\n*   文档可见部分的宽度/高度：`document.documentElement.clientWidth/Height`\n\
  *   整个文档（包含滚动出的部分）的宽度/高度：\n\n```\nlet scrollHeight = Math.max(\n  document.body.scrollHeight,\
  \ document.documentElement.scrollHeight,\n  document.body.offsetHeight, document.documentElement.offsetHeight,\n\
  \  document.body.clientHeight, document.documentElement.clientHeight\n);\n```\n\n\
  ### 滚动：\n\n*   读取当前滚动：`window.pageYOffset/pageXOffset`\n*   改变当前滚动：\n\n    *   `window.scrollTo(pageX,pageY)`\
  \ —— 绝对坐标，\n\n    *   `window.scrollBy(x,y)` —— 相对于当前位置滚动，\n\n    *   `elem.scrollIntoView(top)`\
  \ —— 滚动使 `elem` 可见（与窗口对齐）。\n\n### 坐标\n\n为了移动元素，我们需要熟悉坐标。\n\n大多数 JavaScript 方法处理两种坐标系之一：\n\
  \n1.  **相对于窗口**：类似于 `position:fixed`，从顶部/左边缘计算。\n\n    *   我们将这些坐标命名为 `clientX/clientY`，命名的原因在我们之后学习事件属性时会变得清晰。\n\
  \n2.  **相对于文档**：类似于文档根元素的 `position:absolute`，从顶部/左边缘计算。\n\n    *   我们将它们命名为 `pageX/pageY`。\n\
  \n当页面滚动到最开始位置，使得窗口的左上角正对着文档的左上角时，这些坐标彼此相等。但在文档移动后，元素的窗口相对坐标会改变（因为元素跨过了窗口），而文档相对坐标保持不变。\n\
  \n在这张图中，我们取文档中的一点并展示它在滚动之前（左）和之后（右）的坐标：\n\n![](img/document-and-window-coordinates-scrolled.svg)\n\
  \n当文档滚动：\n\n*   `pageY` —— 文档相对坐标保持不变，是从文档顶部（现在已滚动出）计算的。\n*   `clientY` —— 窗口相对坐标发生了变化（箭头变短了），因为同一个点变得靠近窗口顶部。\n\
  \n#### 元素坐标：getBoundingClientRect\n\n\n\n\n\n方法 `elem.getBoundingClientRect()` 返回一个包含\
  \ `elem` 的最小矩形的窗口坐标，其结果以内置 [DOMRect](https://www.w3.org/TR/geometry-1/#domrect)\
  \ 类的对象形式返回。\n\n### 主要的 `DOMRect` 属性：\n\n* `x/y` – 矩形起点相对于窗口的 X/Y 坐标，\n* `width/height`\
  \ – 矩形的宽度/高度（可以是负数）。\n\n此外，还有一些派生属性：\n\n* `top/bottom` – 矩形顶部/底部边缘的 Y 坐标，\n* `left/right`\
  \ – 矩形左侧/右侧边缘的 X 坐标。\n\n以下是 `elem.getBoundingClientRect()` 输出的：\n\n![](img/coordinates.svg)\n\
  \n如你所示，`x/y` 和 `width/height` 完整描述了矩形。派生属性可以从它们轻松计算出来：\n\n* `left = x`\n* `top =\
  \ y`\n* `right = x + width`\n* `bottom = y + height`\n\n### 注意：\n\n* 坐标可以是小数，例如\
  \ `10.5`。这是正常现象，浏览器内部在计算时使用了小数。当我们将其设置为 `style.left/top` 时，不需要对其进行四舍五入。\n* 坐标可以是负数。例如，如果页面滚动使得\
  \ `elem` 现在位于窗口上方，那么 `elem.getBoundingClientRect().top` 就是负数。\n\n### 为什么需要派生属性？既然有了\
  \ `x/y`，为什么还需要 `top/left`？\n\n从数学角度来说，一个矩形通过其起点 `(x,y)` 和方向向量 `(width,height)` 唯一确定。因此，额外的派生属性是为了为了方便。\n\
  \n在技术上，`width/height` 有可能是负数，这允许产生“有方向的”矩形，例如用正确标记起点和终点来表示鼠标选择。\n\n负的 `width/height`\
  \ 值意味着矩形从其右下角开始，然后向左上方“生长”。\n\n这是一个具有负 `width` 和 `height` 的矩形（例如 `width=-200`，`height=-100`）：\n\
  \n![](img/coordinates-negative.svg)\n\n如你所示，在这种情况下，`left/top` 并不等于 `x/y`。\n\n但在实践中，`elem.getBoundingClientRect()`\
  \ 始终返回正的宽度/高度，我们在这里提到负的 `width/height` 仅是为了让你理解这些看似重复的属性实际上并不是重复的。\n\n### Internet\
  \ Explorer 和 Edge：不支持 `x/y`\n\n由于历史原因，Internet Explorer 和 Edge 不支持 `x/y` 属性。\n\n\
  因此我们可以编写一个 polyfill（在 `DomRect.prototype` 中添加 getter），或者直接使用 `top/left`，因为在 `width/height`\
  \ 为正的情况下（特别是在 `elem.getBoundingClientRect()` 的结果中），它们与 `x/y` 相同。\n\n### 坐标 right/bottom\
  \ 与 CSS 位置属性不同\n\n窗口相对坐标与 CSS 的 `position:fixed` 之间有明显的相似之处。\n\n但在 CSS 定位中，`right`\
  \ 属性意味着距离右边缘的距离，`bottom` 属性意味着距离底部边缘的距离。\n\n如果我们只看上面的图片，就会发现在 JavaScript 中并非如此。所有的窗口坐标都是从左上角开始计算的，包括这些坐标。\n\
  \n### `elementFromPoint(x, y)`\n\n调用 `document.elementFromPoint(x, y)` 返回窗口坐标 `(x,\
  \ y)` 处嵌套最深的元素。\n\n语法如下：\n\n```\nlet elem = document.elementFromPoint(x, y);\n```\n\
  \n例如，下面的代码将高亮并输出当前位于窗口中间的元素标签：\n\n```\nlet centerX = document.documentElement.clientWidth\
  \ / 2;\n```\n\n\n\n\n使用 JavaScript 找到箭头指向的各个角的窗口坐标。\n\n为了方便起见，文档中实现了一个小功能。点击任何地方都会显示该处的坐标。\n\
  \nindex.html.1.7.html\n\n你的代码应该使用 DOM 获取以下位置的窗口坐标：\n\n1. 左上外角（这很简单）。\n2. 右下外角（这也很简单）。\n\
  3. 左上内角（稍微有点难）。\n4. 右下内角（有若干种方法，选择其一即可）。\n\n你计算的坐标应该与鼠标点击返回的坐标相同。\n\n备注：如果元素具有其他尺寸或边框，代码也应该有效，不要绑定到任何固定值。\n\
  \n[打开任务的沙箱。](https://plnkr.co/edit/FevCzPVJHrJxhFpmSYnH?p=preview)\n\n前往解决方案 在元素附近显示提示，重要性：5\n\
  \n创建一个函数 `positionAt(anchor, position, elem)`，根据 `position` 将 `elem` 位于 `anchor`\
  \ 元素附近。\n\n`position` 必须是包含以下 3 个值之一的字符串：\n\n* `\"top\"` – 将 `elem` 放置在 `anchor`\
  \ 正上方\n* `\"right\"` – 将 `elem` 放置在 `anchor` 右侧\n* `\"bottom\"` – 将 `elem` 放置在 `anchor`\
  \ 正下方\n\n它被用于任务源码提供的函数 `showNote(anchor, position, html)`，该函数创建一个带有给定 `html` 的“提示”元素并将其显示在\
