  \n可以使用 `on<event>` 属性在 HTML 中设置处理器。例如，为 `click` 分配一个 `click` 处理器。\n\n可以使用 `on<event>`\
  \ 属性在 HTML 中设置处理器。例如，为 `click` 分配一个 `click` 处理器。\n\n（ ，例如：\n\n```\n<input type=\"\
  button\" onclick=\"alert('Click!') value=\"```\n\n<script>\n  function countRabbits()\
  \ {\n    for(let i=1; i<=3; i++) {\n      alert(\"Rabbit number \" + i);\n    }\n\
  \  }\n</script>\n\n<input type=\"button\" onclick=\"countabbits()\" value=\"Count\
  \ rabbits!\">\n```\n\ndbj6qb.html\n\n众所周知，HTML 属性名是不区分大小写的，所以 `ONCLICK` 和 `onClick`\
  \ 都有效……但通常属性使用小写：`onclick`。\n\n##### DOM 属性\n\n我们可以使用 DOM 属性 `on<event>` 设置处理器。例如\
  \ `onclick`：\n\n```\n<input id=\"elem\" type=\"button\" value=\"Click me\">\n<script>\n\
  \  elem.onclick = function() {\n    alert('Thank you');\n  };\n</script>\n```\n\n\
  cd7.html)\n\n如果使用 HTML 属性分配处理器，浏览器会读取它，从属性内容创建一个新函数并将其写入 DOM 属性。因此这种方法与之前的方法是相同的。\n\
  \n**处理器始终位于 DOM 属性中：HTML 属性只是初始化它的方法之一。**\n\n这两段代码的效果相同：\n\n1. 仅使用 HTML：\n```\n\
  <input type=\"button\" onclick=\"alert('Click!')\" value=\"Button\">\n```\n[gg3f5.html\n\
  \n2. HTML + JS：\n```\n<input type=\"button\" id=\"button\" value=\"Button\">\n<script>\n\
  \  button.onclick = function() {\n    alert('Click!');\n  };\n</script>\n```\nmx3.html\n\
  \n**由于只有一个 `onclick` 属性，我们无法分配多个事件处理器。**\n\n在下面的示例中，使用 JavaScript 添加处理器会覆盖现有的处理器：\n\
  \n```<input type=\"button\" id=\"elem\" onclick=\"alert('Before')\" value=\"Click\
  \ me\">\n<script>\n  elem.onclick = function() { // 覆盖现有的处理器\n    alert('After');\
  \ // 只会显示这个\n  };\n</script>\n```\n6nen5z.html\n\n顺便说，我们可以直接将现有的函数分配为处理器：\n\n```\n\
  function sayThanks() {\n  alert('Thanks!');\n}\n\nelem.onclick = sayThanks;\n```\n\
  \n要移除处理器——分配 `elem.onclick = null`。\n\n#### 访问元素：this\n\n处理器内部 `this` 的值是元素。即带有该处理器的元素。在下面的代码中，`button`\
  \ 使用 `this.innerHTML` 显示其内容：\n\n```\n<button onclick=\"alert(this.innerHTML)\">Click\
  \ me</button>\n```\ndsjunj.html\n\n\n\n\n\n如果我们添加了括号，`sayThanks()` – 它就是一个函数调用。因此，最后一行实际上获取了函数执行的结果，即\
  \ `undefined`（因为函数没有返回内容），并将其赋值给 `onclick`。这行不通。\n\n……另一方面，在 HTML 标记中我们确实需要括号：\n\
  \n```\n<input type=\"button\" id=\"button\" onclick=\"sayThanks()\">\n```\n\n这种区别很容易解释。当浏览器读取该属性时，它会根据内容创建一个带有函数体的处理函数：`sayThanks()`。\n\
  \n因此 HTML 标记生成了该属性：\n\n```\n button.onclick = function() {\n  sayThanks(); // 属性内容\n\
  };\n```\n\n### 使用函数，而不是字符串。\n\n赋值 `elem.onclick = \"alert(1)\"` 同样有效。出于兼容性考虑，这样做可行，但强烈不建议这样做。\n\
  \n### 不要用 `setAttribute` 设置处理程序。\n\n这样的调用将不起作用：\n\n```\n// 在 <body> 上点击将产生错误，\n\
  // 因为属性始终是字符串，函数会变成字符串\ndocument.body.setAttribute('onclick', function() { alert(1)\
  \ });\n```\n\n### DOM 属性区分大小写。\n\n将处理程序赋值给 `elem.onclick` 而不是 `elem.ONCLICK`，因为\
  \ DOM 属性是区分大小写的。\n\n### addEventListener\n\n上述分配处理程序的方法存在一个根本问题——我们无法为同一个事件分配多个处理程序。\n\
  \n例如，我们代码的一个部分想在点击时高亮按钮，而另一部分想显示一条消息。\n\n我们想为此此分配两个事件处理程序。但一个新的 DOM 属性会覆盖现有的属性：\n\
  \n```\ninput.onclick = function() { alert(1); }\n// ...\ninput.onclick = function()\
  \ { alert(2); } // 替换了之前的处理程序\n```\n\nWeb 标准开发者很久以前就理解了这一点，并建议使用特殊方法 `addEventListener`\
  \ 和 `removeEventListener` 另一种管理处理程序的方法。它们避免了此类问题。\n\n添加处理程序的语法：\n\n```\nelement.addEventListener(event,\
  \ handler[, options]);\n```\n\n`event`\n\n事件名称，例如 `\"click\"`。\n\n`handler`\n\n\
  处理程序函数。\n\n`options`\n\n一个额外的可选对象，包含以下属性：\n\n- `once`：如果为 `true`，则监听器在触发后会自动移除。\n\
  - `capture`：处理事件的阶段，将在章节 冒泡与捕获 中介绍。由于历史原因，`options` 也可以是 `false/true`，这与 `{capture:\
  \ false/true}` 。\n- `passive`：如果为 `true`，则处理程序将不会调用 `preventDefault()`，我们稍将在 浏览器默认行为\
  \ 中介绍。\n\n要移除处理程序，使用 `removeEventListener`：\n\n```\nelement.removeEventListener(event,\
  \ handler[, options]);\n```\n\n移除需要相同的函数\n\n要移除处理程序，我们应该传递与赋值时完全相同的函数。\n\n这样做是不通的：\n\
  \n```\nelem.addEventListener( \"click\" , () => alert('Thanks!'));\n// ....\nelem.removeEventListener(\
  \ \"click\", () => alert('Thanks!'));\n```\n\n处理程序不会被移除，因为 `removeEventListener`\
  \ 获取的是另一个函数——虽然代码相同，但这并不重要。\n\n正确的做法是：\n\n```\nfunction handler() {\n  alert( 'Thanks!'\
  \ );\n}\n\ninput.addEventListener(\"click\", handler);\n// ....\ninput.removeEventListener(\"\
  click\", handler);\n```\n\n请注意——如果我们不将函数存储在变量中，我们就无法移除它。没有办法可以“回读”由 `addEventListener`\
  \ 分配的处理程序。\n\n多次调用 `addEventListener` 允许添加多个处理程序，如下：\n\n```\n <input id=\"elem\"\
  \ type=\"button\" value=\"Click me\"/>\n\n<script>\n  function handler1() {\n  \
  \  alert('Thanks!');\n  };\n\n  function handler2() {\n    alert('Thanks again!');\n\
  \  }\n\n  elem.onclick = () => alert(\"Hello\");\n  elem.addEventListener(\"click\"\
  , handler1); // Thanks!\n  elem.addEventListener(\"click\", handler2); // Thanks\
  \ again!\n</script>\n```\n\n正如我们在上面的示例所示，我们可以同时使用 DOM 属性和 `addEventListener` 来设置处理程序。但通常我们只使用其中一种方法。\n\
  \n### 对于某些事件，处理程序仅在使用 `addEventListener` 有效\n\n某些事件无法通过 DOM 属性赋值。必须使用 `addEventListener`。\n\
  \n例如，`transitionend` 事件（CSS 动画结束）就是这样的。\n\n尝试下面的代码。在大多数浏览器中，只有第二个处理程序有效，第一个一个无效。\n\
  \n```\n <style>\n  input {\n    transition: width 1s;\n    width: 100px;\n  }\n\n\
  \  .wide {\n    width: 300px;\n  }\n</style>\n\n<input type=\"button\" id=\"elem\"\
  \ onclick=\"this.classList.toggle('wide')\" value=\"Click me\">\n\n<script>\n  elem.ontransitionend\
  \ = function() {\n    alert(\"DOM property\"); // 不生效\n  };\n\n  elem.addEventListener(\"\
  transitionend\", function() {\n    alert(\"addEventListener\"); // 动画结束时显示\n  });\n\
  </script>\n```\n\n### 事件对象\n\n为了正确处理事件，我们想要知道更多关于发生的情况。不仅是发生了什么，还有发生在哪里。\n\n当事件发生时，浏览器会创建一个事件对象并将其传递给处理程序。\n\
  \n`event.type`\n\n事件类型，例如 `\"click\"`。\n\n`event.currentTarget`\n\n处理事件的元素。\n\n\
  `event.clientX / event.clientY`\n\n相对于窗口的坐标，用于鼠标事件。\n\n事件对象也可以从 HTML 访问\n\n如果我们在\
  \ HTML 中分配处理程序，也可以这样使用 `event` 对象：\n\n```\n <input type=\"button\" onclick=\"alert(event.type)\"\
  \ value=\"Event type\">\n```\n\n3hx1nk.html\n\n这是可能的因为当浏览器读取属性时，它会创建一个这样的函数：`function(event)\
  \ { alert(event.type) }`。\n\n### 对象处理程序：handleEvent\n\n我们可以使用 `addEventListener`\
  \ 分配一个函数或一个对象作为事件处理程序。当事件发生时，它的 `handleEvent` 方法会被调用。\n\n例如：\n\n```\n<button id=\"\
  elem\">Click me</button>\n\n<script>\n  elem.addEventListener('click', {\n    handleEvent(event)\
  \ {\n      alert(event.type + \" at \" + event.currentTarget);\n    }\n  });\n</script>\n\
  ```\n\n正如我们看到的，当 `addEventListener` 接收对象作为处理程序时，它会在事件发生时调用 `object.handleEvent(event)`。\n\
  \n也可以使用类来实现：\n\n```\n <button id=\"elem\">Click me</button>\n\n<script>\n  class\
  \ Menu {\n    handleEvent(event) {\n      switch(event.type) {\n        case 'mousedown':\n\
  \          elem.innerHTML = \"Mouse button pressed\";\n          break;\n      \
  \  case 'mouseup':\n          elem.innerHTML += \"...and released.\";\n        \
  \  break;\n      }\n    }\n  }\n\n  let menu = new Menu();\n  elem.addEventListener('mousedown',\
  \ menu);\n  elem.addEventListener('mouseup', menu);\n</script>\n```\n\n这里同一个对象处理了两个事件。请注意，我们需要使用\
  \ `addEventListener` 显式设置要监听的事件。这里 `menu` 对象只接收 `mousedown` 和 `mouseup`，而不是其他类型的事件。\n\
  \n`handleEvent` 方法不需要自己完成所有工作。它反而可以调用其他特定事件的方法，如下：\n\n\n\n\n\n```html\n<button id=\"\
  elem\">Click me</button>\n\n<script>\n  class Menu {\n    handleEvent(event) {\n\
  \      // mousedown -> onMousedown\n      let method = 'on' + event.type[0].toUpperCase()\
  \ + event.type.slice(1);\n      thismethod;\n    }\n\n    onMousedown() {\n    \
  \  elem.innerHTML = \"Mouse button pressed\";\n    }\n\n    onMouseup() {\n    \
  \  elem.innerHTML += \"...and released.\";\n    }\n  }\n\n  let menu = new Menu();\n\
  \  elem.addEventListener('mousedown', menu);\n  elem.addEventListener('mouseup',\
  \ menu);\n</script>\n```\n\n现在事件处理程序被清晰地分离，这可能更容易维护。\n\n## 总结\n\n有 3 种分配事件处理器的方法：\n\
  \n1. HTML 属性：`onclick=\"...\"`。\n2. DOM 属性：`elem.onclick = function`。\n3. 方法：`elem.addEventListener(event,\
  \ handler[, phase])` 用于添加，`removeEventListener` 用于移除。\n\nHTML 属性很少使用，因为在 HTML 标签中间写\
  \ JavaScript 看起来有点很异和外兀。而且在里面无法编写大量代码。\n\nDOM 属性可以很好，但我们无法为某个特定事件分配多个处理程序。在很多情况下，这种限制并不紧要。\n\
  \n最后一种方法最灵活，但写起来最长。有少数事件只能通过它工作，例如 `transtionend` 和 `DOMContentLoaded`（将在后续介绍）。此外，`addEventListener`\
  \ 支持将对象作为事件处理器。在这种情况下，当事件发生时会调用对象的 `handleEvent` 方法。\n\n无论你如何分配处理器——它都会接收一个事件对象作为第一个参数。该对象包含了关于发生什么的详细信息。\n\
  \n我们将在后续章节中学习更多关于通用事件以及不同类型事件的知识。\n\n## 任务\n\n### 点击隐藏重要性: 5\n\n为 `button` 添加 JavaScript，使得在点击它时\
