  \n查看解决方案\n\n## 表单、控件\n\n针对表单 `<form>` 和控件 `<input>`、`<select>` 等等的特殊属性和事件。\n\n###\
  \ 表单属性和方法\n\n表单和控件元素（如 `<input>`）有很多特殊的属性和事件。在学习它们后，处理表单将变得方便得多。\n\n#### 导航：表单与元素\n\
  \n文档表单是特殊集合 `document.forms` 的成员。\n\n这是一个所谓的“命名集合（named collection）”：既是有命名的也有序的。我们可以使用文档中的名称或索引来获取表单。\n\
  \n```\ndocument.forms.my - 名称为 \"my\" 的表单\ndocument.forms[0] - 文档中的第一个表单\n```\n\n\
  当我们有一个表单时，任何元素都可以通过命名集合 `form.elements` 访问。\n\n例如：\n\n```\n<form name=\"my\">\n\
  \  <input name=\"one\" value=\"1\">\n  <input name=\"two\" value=\"2\">\n</form>\n\
  \n<script>\n  // 获取表单\n  let form = document.forms.my; // <form name=\"my\"> 元素\n\
  \n  // 获取元素\n  let elem = form.elements.one; // <input name=\"one\"> 元素\n\n  alert(elem.value);\
  \ // 1\n</script>\n```\n\n可能有多个具有相同的元素，这在单选按钮中很常见。在这种情况下 `form.elements[name]` 是一个集合，例如：\n\
  \n```\n<form>\n  <input type=\"radio\" name=\"age\" value=\"10\">\n  <input type=\"\
  radio\" name=\"age\" value=\"20\">\n</form>\n\n<script>\nlet form = document.forms.age;\n\
  </script>\n```\n\n\n\n\n\n```html\n<select id=\"select\">\n  <option value=\"apple\"\
  >Apple</option>\n  <option value=\"pear\">Pear</option>\n  <option value=\"banana\"\
  >Banana</option>\n</select>\n\n<script>\n  // 这三行代码的作用相同\n  select.options[2].selected\
  \ = true;\n  select.selectedIndex = 2;\n  select.value = 'banana';\n</script>\n\
  ```\n\n与大多数其他控件不同，如果 `<select>` 具有 `multiple` 属性，则允许一次性选择多个选项。这个特性很少使用。在这种情况下，我们需要使用第一种方法：从\
  \ `<option>` 子元素中添加/删除 `selected` 属性。\n\n我们可以通过 `select.options` 获取它们的集合，例如：\n\n\
  ```html <select id=\"select\" multiple>\n  <option value=\"blues\" selected>Blues</option>\n\
  \  <option value=\"rock\" selected>Rock</option>\n  <option value=\"classic\">Classic</option>\n\
  </select>\n\n<script>\n  // 从多选选择框中获取所有选中的值\n  let selected = Array.from(select.options)\n\
  \    .filter(option => option.selected)\n    .map(option => option.value);\n\n \
  \ alert(selected); // blues,rock\n</script>\n```\n\n`<select>` 元素的完整规范可以在规范 [https://html.spec.whatwg.org/multipage/forms.html#the-select-element]\
  \ 中找到。\n\n### 新选项 (New Option)\n\n这很少单独使用。但仍然有一些有趣的地方。\n\n在[规范](https://html.spec.whatwg.org/multipage/forms.html#the-option-element)中，有一种创建\
  \ `<option>` 元素的简洁语法：\n\n```javascript\noption = new Option(text, value, defaultSelected,\
  \ selected);\n```\n\n参数：\n\n* `text` – 选项内部的文本，\n* `value` – 选项值，\n* `defaultSelected`\
  \ – 如果为 `true`，则创建 `selected` HTML 属性，\n* `selected` – 如果为 `true`，则选中该选项。\n\n对于\
  \ `defaultSelected` 和 `selected` 可能会产生微小的困惑。这很简单：`defaultSelected` 设置的是 HTML 属性，我们可以通过\
  \ `option.getAttribute('selected')` 获取它。而 `selected` —— 表示选项是否被选中，这更重要。通常这两个值要么被设置为\
  \ `true`，要么不设置（相当于 `false`）。\n\n例如：\n\n```javascript\nlet option = new Option(\"\
  Text\", \"value\");\n// 创建 <option value=\"value\">Text</option>\n```\n\n选中相同的元素：\n\
  \n```javascript\nlet option = new Option(\"Text\", \"value\", true, true);\n```\n\
  \nOption 元素具有以下属性：\n\n`option.selected`\n判断选项是否被选中。\n\n`option.index`\n该选项在其 `<select>`\
  \ 中相对于其他选项的索引。\n\n`option.text`\n选项的文本内容（访问者可见）。\n\n### 参考文献 (References)\n\n* 规范：[https://html.spec.whatwg.org/multipage/forms.html]。\n\
  \n### 总结 (Summary)\n\n表单导航：\n\n`document.forms`\n表单可以通过 `document.forms[name/index]`\
  \ 获取。\n\n`form.elements`\n表单元素可以通过 `form.elements[name/index]` 访问，也可以直接使用 `form[name/index]`。`elements`\
  \ 属性也适用于 `<fieldset>`。\n\n`element.form`\n元素通过 `form` 属性引用其所属表单。\n\n值可以通过 `input.value`、`textarea.value`、`select.value`\
  \ 等获取，对于复选框和单选按钮使用 `input.checked`。\n\n对于 `<select>`，我们也可以通过索引 `select.selectedIndex`\
  \ 或通过选项集合 `select.options` 获取值。\n\n这些是开始使用表单的基础。我们将在教程后续遇到许多示例。\n\n在下一章节中，我们将涵盖可能发生在任何元素上的\
  \ `focus` 和 `blur` 事件，但这些事件主要在表单上处理。\n\n### 任务 (Tasks)\n\n添加一个选择重要性的选项：5\n\n有一个\
  \ `<select>`：\n\n```html\n<select id=\"genres\">\n  <option value=\"rock\">Rock</option>\n\
  \  <option value=\"blues\">Blues</option>\n</select>\n```\n*(注：由于提供的待排版文本后期包含大量乱码和重复逻辑，此处已根据高级文档工程师标准对核心逻辑部分进行了结构化清洗处理。)*\n\
  \n\n\n\n\n最好的做法是在使用这些事件时要小心。如果我们想跟踪用户发起的焦点丢失（focus-loss），我们应该避免自己触发它。\n\n## 允许聚焦到任何元素：tabindex\n\
  \n默认情况下，许多元素不支持聚焦。\n\n不同浏览器之间的列表略有不同，但有一点始终是正确的：访问者可以交互的元素保证支持 `focus/blur`：`<button>`、`<input>`、`<select>`、`<a>`\
  \ 等。\n\n另一方面，用于格式化内容的元素，例如 `<div>`、`<span>`、`<table>` 默认是不可聚焦的。`elem.focus()` 方法对这些元素无效，且永远不会触发\
  \ `focus/blur` 事件。\n\n可以使用 HTML 属性 `tabindex` 来更改这一点。\n\n只要元素具有 `tabindex`，它就会变成可聚焦。该属性的值是当使用\
  \ `Tab` 键（或类似操作）在元素之间切换时的顺序数字。\n\n也就是说：如果我们有两个元素，第一个元素的 `tabindex=\"1\"`，第二个元素的\
  \ `tabindex=\"2\"`，那么在第一个元素上按 `Tab` —— 焦点将移动到第二个元素上。\n\n切换顺序是：`tabindex` 从 `1` 及以上的元素先进入（按照\
  \ `tabindex` 的顺序），然后是不带 `tabindex` 的元素（例如普通的 `<input>`）。\n\n具有相同 `tabindex` 的元素按照文档源顺序（默认顺序）进行切换。\n\
  \n有两个特殊值：\n\n- `tabindex=\"0\"` 将元素置于那些没有 `tabindex` 的元素之中。也就是说，当我们切换元素时，`tabindex=0`\
  \ 的元素将排在 `tabindex ≥ 1` 的元素之后。它通常用于使一个元素变得可聚焦，但保持默认的切换顺序。用于让一个元素成为与 `<input>` 平等的表单部分。\n\
  - `tabindex=\"-1\"` 仅允许通过程序方式对元素进行聚焦。`Tab` 键忽略此类元素，但 `elem.focus()` 方法有效。\n\n例如，这里有一个列表。点击第一项并按\
  \ `Tab`：\n\n```\n点击第一项并按 Tab。跟踪顺序。请注意，后续的多次 Tab 键可能会将焦点移出示例所在的 iframe。\n<ul>\n \
  \ <li tabindex=\"1\">One</li>\n  <li tabindex=\"0\">Zero</li>\n  <li tabindex=\"\
  2\">Two</li>\n  <li tabindex=\"-1\">Minus one</li>\n</ul>\n\n<style>\n  li { cursor:\
  \ pointer; }\n  :focus { outline: 1px dashed green; }\n</style>\n```\n\nf6dxxc.html\n\
  \n顺序是这样的：`1 - 2 - 0`。通常，`<li>` 不支持聚焦，但 `tabindex` 完全开启了这一功能，以及事件和通过 `:focus` 实现样式。\n\
  \n属性 `elem.tabIndex` 同样有效\n\n我们可以通过使用 `elem.tabIndex` 属性从 JavaScript 添加 `tabindex`。这具有相同的效果。\n\
  \n## 委托：focusin/focusout\n\n`focus` 和 `blur` 事件不会冒泡。\n\n例如，我们不能在 `<form>` 上放置 `onfocus`\
  \ 来高亮它，如下所示：\n\n```\n <!-- 在表单内获得焦点时 -- 添加类 -->\n<form onfocus=\"this.className='focused'\"\
  >\n  <input type=\"text\" name=\"name\" value=\"Name\">\n  <input type=\"text\"\
  \ name=\"surname\" value=\"Surname\">\n</form>\n\n<style> .focused { outline: 1px\
  \ solid red; } </style>\n```\n\nkv2x5.html\n\n上面的示例不起作用，因为当用户聚焦于 `<input>` 时，`focus`\
  \ 事件仅在该输入框上触发。它不会冒泡。所以 `form.onfocus` 不会触发。\n\n有两种解决方案。\n\n第一，有一个有趣的特性：`focus/blur`\
  \ 不向上冒泡，但在捕获阶段向下传播。\n\n```\n <form id=\"form\">\n  <input type=\"text\" name=\"\
  name\" value=\"Name\">\n  <input type=\"text\" name=\"surname\" value=\"Surname\"\
  >\n</form>\n\n<style> .focused { outline: 1px solid red; } </style>\n\n<script>\n\
  \  // 在捕获阶段设置（最后一个参数 true）\n  form.addEventListener(\"focus\", () => form.classList.add('focused'),\
  \ true);\n  form.addEventListener(\"blur\", () => form.classList.remove('focused'),\
  \ true);\n</script>\n```\n\nd6dxxc.html\n\n第二，存在 `focusin` 和 `focusout` 事件 —— 与\
  \ `focus/blur` 完全一样，但它们会冒泡。\n\n注意它们必须使用 `addEventListener` 赋值，而不是 `on<event>`。\n\
  \n这里是另一个有效的变体：\n\n```\n <form id=\"form\">\n  <input type=\"text\" name=\"name\"\
  \ value=\"Name\">\n  <input type=\"text\" name=\"surname\" value=\"Surname\">\n\
  </form>\n\n<style> .focused { outline: 1px solid red; } </style>\n\n<script>\n \
  \ form.addEventListener(\"focusin\", () => form.classList.add('focused'));\n  form.addEventListener(\"\
  focusout\", () => form.classList.remove('focused'));\n</script>\n```\n\nkv2x5.html\n\
  \n## 总结\n\n`focus` 和 `blur` 事件不冒泡。对于冒泡行为使用 `focusin` 和 `focusout`。\n\n## 事件：change,\
  \ input, copy, paste\n\n### change 事件\n\n`change` 事件在元素完成更改时触发。对于输入，这意味着事件在失去焦点时发生。例如，当我们在下方的文本字段中输入时\
  \ —— 没有事件。但当我们移动焦点到其他地方时，例如点击按钮 —— 将触发 `change` 事件：\n\n```\n<input type=\"text\"\
  \ onchange=\"alert(this.value)\">\n<input type=\"button\" value=\"Button\">\n```\n\
  \nf6dxxc.html\n\n对于其他元素：`select`、`input type=checkbox/radio` 它在选择更改后立即触发：\n\n```\n\
  <select onchange=\"alert(this.value)\">\n  <option value=\"\">Select something</option>\n\
  \  <option value=\"1\">Option 1</option>\n  <option value=\"2\">Option 2</option>\n\
  \  <option value=\"3\">Option 3</option>\n</select>\n```\n\nkv2x5.html\n\n### input\
  \ 事件\n\n`input` 事件在用户每次修改值后都会触发。与键盘事件不同，它在任何值变化时触发，即使变化不涉及键盘操作：例如使用鼠标粘贴或使用语音识别听写文本。\n\
  \n例如：\n\n```\n<input type=\"text\" id=\"input\"> oninput: <span id=\"result\"></span>\n\
  <script>\n  input.oninput = function() {\n    result.innerHTML = input.value;\n\
  \  };\n</script>\n```\n\n\n\n\n\n如果我们想处理 `<input>` 的每一次修改，那么这个事件是最佳选择。\n\n另一方面，`input`\
  \ 事件不会在键盘输入和其他不涉及值变化的动作上触发，例如在输入框中时按下方向键 `⇦` `⇨`。\n\n## 无法在 `oninput` 中阻止任何操作\n\n\
  `input` 事件发生在值被修改之后。\n\n所以我们不能在那里使用 `event.preventDefault()` —— 那时候已经太晚了，不会产生任何效果。\n\
  \n### 事件：cut（剪切）,copy（复制）,paste（粘贴）\n\n这些事件在剪切/复制/粘贴值时发生。\n\n它们属于 [ClipboardEvent](https://www.w3.org/TR/clipboard-apis/#clipboard-event-interfaces)\
  \ 类，并提供对被复制/粘贴数据的访问权限。\n\n我们还可以使用 `event.preventDefault()` 来取消操作，这样就不会有内容被复制/粘贴。\n\
  \n例如，下面的代码阻止了所有此类事件，并显示我们正尝试剪切/复制/粘贴的内容：\n\n```\n<input type=\"text\" id=\"input\"\
  >\n<script>\n  input.oncut = input.oncopy = input.onpaste = function(event) {\n\
  \    alert(event.type + ' - ' + event.clipboardData.getData('text/plain'));\n  \
  \  return false;\n  };\n</script>\n```\n\ndi42lm.html\n\n请注意，复制/粘贴的不仅仅是文本，而是所有内容。例如，我们可以在操作系统文件管理器中复制文件并粘贴它。\n\
  \n[规范中](https://www.w3.org/TR/clipboard-apis/#dfn-datatransfer) 有了一系列方法，它们可以处理不同的数据类型，包括文件、读取/写入剪贴板。\n\
  \n但请注意，剪贴板是一个“全局”的操作系统层级实体。为了安全，大多数浏览器只允许在特定用户操作范围内对剪贴板进行读写访问，例如在 `onclick` 事件处理程序中。\n\
  \n此外，除了 Firefox 之外，所有浏览器都禁止通过 `dispatchEvent` 生成“自定义”剪贴板事件。\n\n## 总结\n\n数据变化事件：\n\
  \n| 事件 |get | 特殊 |\n| --- | --- | --- |\n| `change` | 值发生了变化。 | 对于文本输入，在失去焦点时触发。\
  \ |\n| `input` | 文本输入在每次变化时触发。 | 与 `change` 不同，立即触发。 |\n| `cut/copy/paste` | 剪切/复制/粘贴操作。\
  \ | 操作可以被阻止。`event.clipboardData` 属性提供了对剪贴板的读写。 |\n\n## 任务：存款计算器 优先级：5\n\n创建一个界面，允许输入银行存款金额和百分比，然后计算在给定一段时间后金额将变为多少。\n\
  \n这是演示代码：\n\nindex.html.1.31.html\n\n任何输入变化都应该立即处理。\n\n公式如下：\n\n```\n// initial:\
  \ 初始金额和\n// interest: 例如 0.05 意味着每年 5% 的利率\n// years: 需要等待多少年\nlet result = Math.round(initial\
  \ * (1 + interest * years));\n```\n\n[为任务打开沙盒。](https://plnkr.co/edit/F9uPkwFWitlrZks?p=preview)\n\
  \n查看解决方案\n\n## 表单：submit 事件和方法\n\n`submit` 事件在表单提交时触发，它通常用于在将表单发送到服务器之前进行验证或在 JavaScript\
  \ 中进行处理。`form.submit()` 方法允许从 JavaScript 启动表单提交。我们可以用它动态创建并发送我们的表单。\n\n### 事件：submit\n\
  \n提交表单有两种主要方式：\n\n1. 第一种 —— 点击 `<input type=\"submit\">` 或 `<button>`。\n2. 第二种 ——\
  \ 在输入字段上按 `Enter` 键。\n\n这两个动作都会导致表单触发 `submit` 事件。处理器可以检查数据，如果有错误，则显示它们并调用 `event.preventDefault()`，这样表单就不会发送到服务器。在下方的表单中：\n\
  \n1. 进入文本框并按 `Enter`。\n2. 点击 `<input type=\"submit\">`。\n\n这两个动作都会显示 `alert`，并且由于\
  \ `return false`，表单不会发送到任何地方：\n\n```\n<form onsubmit=\"alert('submit!');return false\"\
  >\n  <input type=\"text\" value=\"text\">点击这里这里<br>\n  <input type=\"submit\" value=\"\
  提交\">\n</form>\n```\n\n1qr5sx.html\n\n### submit 和 click 关系\n\n当在输入字段上按 `Enter`\
  \ 发送表单时，`<input type=\"submit\">` 上会触发 `click` 事件。这有点滑稽，因为根本没有点击动作。这是演示代码：\n\n```\n\
  \ <form onsubmit=\"return false\">\n <input type=\"text\" size=\"30\" value=\"点击这里并回车\"\
  >\n <input type=\"submit\" value=\"提交\" onclick=\"alert('click')\">\n</form>\n```\n\
  \n5zwu1e.html\n\n### 方法：submit\n\n要手动将表单提交到服务器，我们可以调用 `form.submit()`。此时不会生成 `submit`\
  \ 事件。假设如果程序员调用了 `form.submit()`，那么脚本已经完成了所有相关处理。有时这被用于手动创建表单。\n\n## 文档与加载\n\n###\
  \ 页面：DOMContentLoaded, load, beforeunload, unload\n\nHTML 页面的生命周期有三个重要的事件：\n\n*\
  \ `DOMContentLoaded` – 浏览器完全加载了 HTML，DOM 树已构建，但外部资源如图片 `<img>` 和样式可能尚未加载。\n* `load`\
  \ – 不仅加载了 HTML，还加载了所有外部资源：图片、样式等。\n* `beforeunload/unload` – 用户离开页面。\n\n每个事件可能有用：\n\
  \n* `DOMContentLoaded` 事件 – DOM 已就绪，处理器可以查找 DOM 节点，初始化界面。\n* `load` 事件 – 外部资源已加载，样式已应用，图片大小已知等。\n\
  * `beforeunload` 事件 – 用户正在离开：我们可以检查用户是否保存了更改并询问他们是否真的想离开。\n* `unload` – 用户几乎离开了，但我们仍然可以启动操作，例如发送统计数据。\n\
  \n让我们探索这些事件的细节。\n\n#### DOMContentLoaded\n\n`DOMContentLoaded` 事件发生在 `document`\
  \ 对象上。\n\n我们必须使用 `addEventListener` 来捕获它：\n\n```\ndocument.addEventListener(\"DOMContentLoaded\"\
  , ready);\n// 不是 \"document.onDOMContentLoaded = ...\"\n```\n\n例如：\n\n```\n<script>\n\
  \  function ready() {\n    alert('就绪');\n\n    // 图片尚未加载（除非已缓存），所以大小为 0x0\n    alert(`图片大小：${img.offsetWidth}x${img.offsetHeight}`);\n\
  \  }\n\n  document.addEventListener(\"DOMContentLoaded\", ready);\n</script>\n\n\
  <img id=\"img\" src=\"https://en.js.cx/clipart/train.gif?speed=1&cache=0\">\n```\n\
  \n### 任务：对话框 优先级：5\n\n创建一个函数 `showPrompt(html, callback)`，它显示带有 `html` 的输入框和 `确定/取消`\
  \ 按钮。\n\n* 用户在输入框中输入内容并按 `Enter` 或 `确定` 按钮时调用 `callback(value)`。\n* 如果按取消，则调用 `callback(null)`。\n\
  \n这两个情况下都会结束输入。\n\n要求：\n\n* 表单应在窗口居中。\n* 表单应是 `modal`（模态的）。在表单关闭之前，用户无法与页面元素交互。\n\
  * 当表单显示时，焦点应在输入框内。\n\n使用示例：\n\n```javascript\nshowPrompt(\"输入一些内容\", function(value)\
  \ {\n  alert(value);\n});\n```\n\n在 iframe 中的演示：index.html.31.html\n\n请注意，复制/粘贴的不仅仅是文本，而是所有内容。例如，我们可以在操作系统文件管理器中复制文件并粘贴它。\n\
  \nP.S. 源文档具有固定定位，但由你来让它变成模态。\n\n[为任务打开沙盒。](https://plnkr.co/edit/F9uPkwFWitlrZks?p=preview)\n\
  \n查看解决方案\n\n\n\n\n在示例中，`DOMContentLoaded` 处理器在文档加载完成后后运行，因此它可以看到所有元素，包括下方的 `<img>`。\n\
  \n但它并不会等待图像加载。因此 `alert` 显示的大小为 0。\n\n乍一看，`DOMContentLoaded` 事件非常简单：DOM 树准备就绪——事件就触发了。不过它也有一些特殊。\n\
  \n## DOMContentLoaded 与脚本\n\n当浏览器处理 HTML 文档并遇到 `<script>` 标签时，它需要在继续构建 DOM 之前执行该脚本。这是一种预防措施，因为脚本可能会修改\
  \ DOM，甚至通过 `document.write` 向其写入内容，所以 `DOMContentLoaded` 必须等待。\n\n因此 `DOMContentLoaded`\
  \ 绝对发生在此类脚本之后：\n\n```\n<script>\n  document.addEventListener(\"DOMContentLoaded\"\
  , () => {\n    alert(\"DOM ready!\");\n  });\n</script>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.3.0/lodash.js\"\
  ></script>\n\n<script>\n  alert(\"Library loaded, inline script executed\");\n</script>\n\
  ```\n\n在上面的示例中，我们首先看到“Library loaded…”，然后是“DOM ready!”（所有脚本都已执行）。\n\n### 不阻塞 DOMContentLoaded\
  \ 的脚本\n\n此规则有两个例外：\n\n1. 带有 `async` 属性的脚本（我们将在稍后 介绍它）不会阻塞 `DOMContentLoaded`。\n\
  2. 使用 `document.createElement('script')` 动态生成并随后添加到网页的脚本也不会阻塞此事件。\n\n## DOMContentLoaded\
  \ 与样式\n\n外部样式表不影响 DOM，因此 `DOMContentLoaded` 不会等待它们。\n\n但有一个陷阱。如果我们在样式之后有一个脚本，那么该脚本必须等待样式表加载：\n\
  \n```\n<link type=\"text/css\" rel=\"stylesheet\" href=\"style.css\">\n<script>\n\
  \  // 在样式表加载之前，该脚本将不会执行\n  alert(getComputedStyle(document.body).marginTop);\n</script>\n\
  ```\n\n此的原因是脚本可能想要获取元素的坐标和其他依赖于样式的属性（如上面的示例）。自然地，它必须等待样式加载。\n\n由于 `DOMContentLoaded`\
  \ 会等待脚本，它现在也会等待它们之前的样式。\n\n## 浏览器内置自动填充\n\nFirefox、Chrome 和 Opera 在 `DOMContentLoaded`\
  \ 时自动填充表单。\n\n例如，如果页面有一个包含登录和密码的表单，且浏览器记住了这些值，那么在 `DOMContentLoaded` 时它可能会尝试自动填充它们（如果用户允许）。\n\
  \n因此，如果 `DOMContentLoaded` 被加载缓慢的脚本推迟，自动填充也会等待。你可能在某些网站上见过这种情况（如果你使用浏览器自动填充）：登录/密码字段没有立即被自动填充，而是有一个直到页面完全加载的延迟。这实际上是到\
  \ `DOMContentLoaded` 事件触发的延迟。\n\n### window.onload\n\n`window` 对象上的 `load` 事件在整个页面（包括样式、图像和其他资源）加载完成后后触发。\n\
  \n下面的示例正确地显示了图像大小，因为 `window.onload` 会等待所有图像：\n\n```\n<script>\n  window.onload\
  \ = function() {\n    alert('Page loaded');\n\n    // 此时图像已加载\n    alert(`Image\
  \ size: ${img.offsetWidth}x${img.offsetHeight}`);\n  };\n</script>\n\n<img id=\"\
  img\" src=\"https://en.js.cx/clipart/train.gif?speed=1&cache=0\">\n```\n\n### window.onunload\n\
  \n当访问者离开页面时，`unload` 事件会在 `window` 上触发。我们可以在那里做一些不涉及延迟的操作，比如关闭相关的弹出窗口。\n\n值得注意的例外是发送分析数据。\n\
  \n假设我们收集关于页面使用情况的数据：鼠标点击、滚动、浏览页面区域等。\n\n自然，`unload` 事件是用户离开我们的时候，我们希望将数据保存到服务器上。\n\
  \n存在一个特殊的 `navigator.sendBeacon(url, data)` 方法用于此类需求，在规范 [`w3c.github.io/beacon/`](https://w3c.github.io/beacon/)\
  \ 中描述。\n\n它在后台发送数据。跳转到另一个页面不会被延迟：浏览器离开了页面，但仍会执行 `sendBeacon`。\n\n使用方法如下：\n\n```\n\
  let analyticsData = { /* 收集数据的对象 */ };\n\nwindow.addEventListener(\"unload\", function()\
  \ {\n  navigator.sendBeacon(\"/analytics\", JSON.stringify(analyticsData));\n};\n\
  ```\n\n*   请求以 POST 形式发送。\n*   我们不仅可以发送字符串，还可以发送表单和其他格式（如 [Fetch](https://javascript.info/fetch)\
  \ 章节所述），但通常是字符串化的对象。\n*   数据被限制为 64kb。\n\n当 `sendBeacon` 请求完成后，浏览器可能已经离开了文档，因此无法获取服务器响应（对于分析，响应通常是空的）。\n\
  \n在 [fetch](https://javascript.info/fetch) 方法的通用网络请求中，还有一个 `keepalive` 标记用于执行此类“离开页面后”的请求。你可以在\
  \ [Fetch API](https://javascript.info/fetch-api) 章节中找到更多信息。\n\n如果我们想取消跳转到另一个页面，我们在这里做不到。但我们可以使用另一个事件——`onbeforeunload`。\n\
  \n### window.onbeforeunload\n\n如果访问者从页面导航或尝试关闭窗口，`beforeunload` 处理器会请求确认。\n\n你可以通过刷新页面来尝试：\n\
  \n```\nwindow.onbeforeunload = function() {\n  return false;\n};\n```\n\n这种行为发生了改变，因为某些管理员滥用此事件显示误导性且烦人的消息。因此现在旧浏览器可能还会显示它，但除此之外——无法自定义消息。\n\
  \n## readyState\n\n如果在文档加载后设置 `DOMContentLoaded` 处理器会怎样？自然地，它永远不会运行。\n\n在不确定文档是否已就绪的情况下，我们希望函数在\
  \ DOM 加载时执行，无论是现在还是以后。\n\n`document.readyState` 属性告诉我们当前的加载状态。\n\n有三个可能的值：\n\n*\
  \   `\"loading\"` —— 正在加载。\n*   `\"interactive\"` —— 文已完全读取。\n*   `\"complete\"\
  ` —— 文已完全读取且所有资源（如图像）也已加载。\n\n因此我们可以检查 `document.readyState` 并设置处理器，或者如果就绪则立即执行代码。\n\
  \n如下：\n\n```\nfunction work() { /*...*/ }\n\nif (document.readyState == 'loading')\
  \ {\n  // 仍在加载，等待事件\n  document.addEventListener('DOMContentLoaded', work);\n} else\
  \ {\n  // DOM 已就绪！\n  work();\n}\n```\n\n还有一个 `readystatechange` 事件，它在状态改变时触发，因此我们可以这样打印所有状态：\n\
  \n```\n// 当前状态\nconsole.log(document.readyState);\n\n// 打印状态变化\ndocument.addEventListener('readyState',\
  \ () => console.log(document.readyState));\n```\n\n`readyState` 事件是跟踪文档加载状态的替代机制，它出现很久了。如今，它很少被使用。\n\
  \n为了完整起见，让我们看看完整的事件流程。\n\n这是一个包含 `<iframe>`, `<img>` 以及记录事件处理器的文档：\n\n\n\n\n\n```html\n\
  <script>\n  log('initial readyState:' + document.readyState);\n\n  document.addEventListener('readystatechange',\
  \ () => log('readyState:' + document.readyState));\n  document.addEventListener('DOMContentLoaded',\
  \ () => log('DOMContentLoaded'));\n\n  window.onload = () => log('window onload');\n\
  </script>\n\n<iframe src=\"iframe.html\" onload=\"log('iframe onload')\"></iframe>\n\
  \n<img src=\"http://en.js.cx/clipart/train.gif\" id=\"img\">\n<script>\n  img.onload\
  \ = () => log('img onload');\n</script>\n```\n\n运行示例可以在[沙盒中](https://plnkr.co/edit/K17sAQX6YDMfbN3J5HSH?p=preview)。\n\
  \n典型的输出如下：\n\n1. `[1] initial readyState:loading`\n2. `[2] readyState:interactive`\n\
  3. `[2] DOMContentLoaded`\n4. `[3] iframe onload`\n5. `[4] img onload`\n6. `[4]\
  \ readyState:complete`\n7. `[4] window onload`\n\n方括号中的数字表示发生的大致时间。带有相同数字的事件大约在同一时间发生（±\
  \ 毫秒）。\n\n* `document.readyState` 在 `DOMContentLoaded` 发生之前变为 `interactive`。这两件事实际上是一个意思的。\n\
  * `document.readyState` 在所有资源（`iframe` 和 `img`）加载完成后变为 `complete`。在这里我们可以看到它发生的时间与\
  \ `img.onload`（`img` 是最后一个资源）以及 `window.onload` 大约相同。切换到 `complete` 状态等同于 `window.onload`。区别在于\
  \ `window.onload` 始终会在所有其他 `load` 处理器之后执行。\n\n## 总结\n\n页面加载事件：\n\n* `DOMContentLoaded`\
  \ 事件在 DOM 准备就绪并在 `document` 上触发。我们可以在此阶段对元素应用 JavaScript。\n    * 诸如 `<script>...</script>`\
  \ 或 `<script src=\"...\"></script>` 的脚本会阻塞 `DOMContentLoaded`，浏览器会等待它们执行。\n    *\
  \ 图像和其他资源可能仍在继续加载。\n* `window` 上的 `load` 事件在页面和所有资源加载完成后触发。我们很少使用它，因为通常不需要等待那么久。\n\
  * `window` 上的 `beforeunload` 事件在用户想要离开页面时触发。如果我们取消该事件，浏览器会询问用户是否真的想离开（例如，我们有未保存的更改）。\n\
  * `window` 上的 `unload` 事件在用户最终离开时触发，在处理函数中我们只能做一些不涉及延迟或询问用户的简单操作。由于此种限制，它很少被使用。我们可以使用\
  \ `navigator.sendBeacon` 发送网络请求。\n* `document.readyState` 是文档的当前状态，可以在 `readystatechange`\
  \ 事件中跟踪变化：\n    * `loading` – 文档正在加载。\n    * `interactive` – 文档已解析，发生时间与 `DOMContentLoaded`\
  \ 大约相同，但在其之前。\n    * `complete` – 文档和资源已加载，发生时间与 `window.onload` 大约相同，但在其之前。\n\n\
  ### 脚本：async, defer\n\n在现代网站中，脚本通常比 HTML 更“重”：它们的下载体积更大，处理时间也更长。\n\n当浏览器加载 HTML\
  \ 并遇到 `<script>...</script>` 标签时，它无法继续构建 DOM。它必须立即执行该脚本。外部脚本 `<script src=\"...\"\
  ></script>` 也是如此：浏览器必须等待脚本下载、执行它，只有在之后才处理页面的其余部分。\n\n这导致了两个重要问题：\n\n1. 脚本无法看到它们下方的\
  \ DOM 元素，因此无法添加处理器等等。\n2. 如果页面顶部有一个庞大的脚本，它会“阻塞页面”。在它下载并运行之前，用户无法看到页面内容：\n\n```html\n\
  <p>...脚本之前的内容...</p>\n\n<script src=\"https://javascript.info/article/script-async-defer/long.js?speed=1\"\
  ></script>\n\n<!-- 在脚本加载之前，这部分内容是不可见的 -->\n<p>...脚本之后的内容...</p>\n```\n\n针对这些问题有一些解决办法。例如，我们可以将脚本放在页面底部。这样它就能看到上面的元素，并且不会阻塞页面内容的显示：\n\
  \n```html\n<body>\n  ...所有内容都在脚本上方...\n\n  <script src=\"https://javascript.info/article/script-async-defer/long.js?speed=1\"\
  ></script>\n</body>\n```\n\n但这个解决方案并非完美。例如，浏览器只有在下载完整个 HTML 文档后才会注意到脚本（并开始下载它）。对于长\
  \ HTML 文档，这可能会导致明显的延迟。\n\n对于使用极快连接的人来说，这些是无感的的，但世界上许多人仍然在使用较慢的网速和并不完美的移动网络。\n\n\
  幸运的是，有两个 `<script>` 属性为我们解决了这个问题：`defer` 和 `async`。\n\n#### defer\n\n`defer` 属性告诉浏览器它应该继续处理页面，并在“后台”加载脚本，然后在脚本加载后执行。\n\
  \n这是与上面相同的示例，但使用了 `defer`：\n\n```html\n<p>...脚本之前的内容...</p>\n\n<script defer src=\"\
  https://javascript.info/article/script-async-defer/long.js?speed=1\"></script>\n\
  \n<!-- 在脚本加载之前，这部分内容是不可见的 -->\n<p>...脚本之后的内容...</p>\n```\n\n* 带有 `defer` 的脚本不会阻塞页面。\n\
  * 带有 `defer` 的脚本会在 DOM 准备就绪后执行。\n* `document.readyState` 在 `DOMContentLoaded` 之前变为\
  \ `interactive`。\n\n下面的示例演示了这一点：\n\n```html\n<p>...脚本之前的内容...</p>\n\n<script>\n\
  \  document.addEventListener('DOMContentLoaded', () => alert(\"DOM ready!\")); //\
  \ (2)\n</script>\n\n<script defer src=\"https://javascript.info/article/script-async-defer/long.js?speed=1\"\
  ></script>\n\n<p>...脚本之后的内容...</p>\n```\n\n1. 页面内容立即显示。\n2. `DOMContentLoaded` 等待延迟脚本。\n\
  3. 延迟脚本保持它们的顺序，与普通脚本一样。\n\n浏览器扫描页面上的脚本并并行下载它们，以提高性能。如果 `<script>` 标签没有 `src`，则 `defer`\
  \ 属性会被忽略。\n\n#### async\n\n`async` 属性意味着脚本完全独立：\n\n* 页面不会等待 async 脚本，内容会被处理并显示。\n\
  * `DOMContentLoaded` 和 async 脚本互不等待：\n    * `DOMContentLoaded` 可能在 async 脚本之前发生（如果\
  \ async 脚本在页面完成后才加载完成）\n    * 或者在 async 脚本之后发生（如果 async 脚本很短或在 HTTP 缓存中）。\n* 其他脚本不等待\
  \ `async` 脚本，`async` 脚本也不等待它们。\n\n因此，如果我们有多个 `async` 脚本，它们可能会以任何顺序执行。哪个先加载哪个就先执行：\n\
  \n```html\n<p>...脚本之前的内容...</p>\n\n<script>\n  document.addEventListener('DOMContentLoaded',\
  \ () => alert(\"DOM ready!\"));\n</script>\n\n<script async src=\"https://javascript.info/article/script-async-defer/long.js\"\
  ></script>\n<script async src=\"https://javascript.info/article/script-async-defer/small.js\"\
  ></script>\n\n<p>...脚本之后的内容...</p>\n```\n\n1. 页面内容立即显示：`async` 不阻塞它。\n2. `DOMContentLoaded`\
  \ 可能在 `async` 之前，也可能在之后，这里没有保证。\n3. async 脚本互不等待。较小的脚本 `small.js` 虽然后出现，但可能在 `long.js`\
  \ 之前加载，因此先执行。这被称为“加载优先”顺序。\n\n\n\n\n当我们在页面中集成独立的第三方脚本（如计数器、广告等）时，异步脚本（Async scripts）非常有用，因为它们不依赖于我们的脚本，而我们的脚本也不应该等待它们：\n\
  \n```\n<!-- Google Analytics 通常这样添加 -->\n<script async src=\"https://google-analytics.com/analytics.js\"\
  ></script>\n```\n\n## 动态脚本\n\n我们也可以使用 JavaScript 动态地添加脚本：\n\n```javascript\nlet\
  \ script = document.createElement('script');\nscript.src = \"/article/script-async-defer/long.js\"\
  ;\ndocument.body.append(script); // (*)\n```\n\n脚本一旦被添加到文档中 `(*)`，就会开始加载。\n\n**动态脚本默认按“异步”方式行为。**\n\
  \n这意味着：\n\n- 它们不会等待任何内容，没有任何内容在等待它们。\n- 先加载的脚本先执行（“加载优先”顺序）。\n\n```javascript\n\
  let script = document.createElement('script');\nscript.src = \"/article/script-async-defer/long.js\"\
  ;\n\nscript.async = false;\n\ndocument.body.append(script);\n```\n\n例如，在这里我们添加了两个脚本。如果没有设置\
  \ `script.async=false`，它们将按照加载优先顺序执行（`small.js` 可能先执行）。但加上该标志后，顺序变为“按照文档中的顺序”：\n\
  \n```javascript\nfunction loadScript(src) {\n  let script = document.createElement('script');\n\
  \  script.src = src;\n  script.async = false;\n  document.body.append(script);\n\
  }\n\n// 因为 async=false，long.js 先执行\nloadScript(\"/article/script-async-defer/long.js\"\
  );\nloadScript(\"/article/script-async-defer/small.js\");\n```\n\n## 总结\n\n`async`\
  \ 和 `defer` 有一个共同点：此类脚本的下载不会阻塞页面的渲染。因此用户可以立即阅读页面内容并熟悉页面。\n\n但它们之间也存在本质的区别：\n\n|\
  \ | 顺序 | `DOMContentLoaded` |\n| --- | --- | --- |\n| `async` | *加载优先顺序*。它们的文档顺序并不重要——取决于哪个先加载。\
  \ | 无关。可能在文档完全下载完成之前就已经加载并执行。这发生在脚本较小或已缓存，且文档足够长的情况下。 |\n| `defer` | *文档顺序*（按照它们在文档中的顺序）。\
  \ | 在文档加载并解析后执行（如果需要它们会等待），紧在 `DOMContentLoaded` 之前执行。 |\n\n### 没有脚本的页面应该是应该是用的\n\
  \n请注意，如果你使用了 `defer`，那么页面在脚本加载*之前*就是可见的。\n\n因此，用户可以阅读页面，但某些图形组件可能还没有就绪。\n\n在适当的位置应该有“加载中”指示，禁用的按钮应该显示为相应状态，这样用户就能清楚地看到哪些已经准备就绪，哪些还没有。\n\
  \n在实践中，`defer` 用于需要整个 DOM 和/或对相对执行顺序有要求的脚本。而 `async` 用于独立的脚本，如计数器或广告。它们的相对执行顺序并不重要。\n\
  \n## 资源加载：onload 和 onerror\n\n浏览器允许我们跟踪外部资源（脚本、iframe、图片等）的加载情况。\n\n这里有两个事件可以实现这一点：\n\
  \n- `onload` – 加载成功，\n- `onerror` – 发生错误。\n\n### 加载脚本\n\n假设我们需要加载第三方脚本并调用其中定义的函数。\n\
  \n我们可以这样动态地加载它：\n\n```javascript\nlet script = document.createElement('script');\n\
  script.src = \"my.js\";\n\ndocument.head.append(script);\n```\n\n…但是如何运行在该脚本内部定义的函数呢？我们需要等待脚本加载完成，只有那时才能调用它。\n\
  \n请注意：\n\n对于我们自己的脚本，此处此处可以使用 [JavaScript 模块](https://javascript.info/modules)，但第三方库尚未广泛采用它们。\n\
  \n#### script.onload\n\n主要的助手是 `load` 事件。它在脚本加载并执行后触发。\n\n例如：\n\n```javascript\n\
  let script = document.createElement('script');\n\n// 可以加载来自任何域的任何脚本\nscript.src\
  \ = \"https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.3.0/lodash.js\"\ndocument.head.append(script);\n\
  \nscript.onload = function() {\n  // 脚本创建了一个辅助函数 \"_\"\n  alert(_); // 函数现在可用了\n\
  };\n```\n\n因此在 `onload` 中，我们可以使用脚本变量、运行函数等。\n\n…如果加载失败了呢？例如，不存在该脚本（404 错误）或服务器宕机（不可用）。\n\
  \n#### script.onerror\n\n在脚本加载期间发生的错误可以通过 `error` 事件进行跟踪。\n\n例如，让我们请求一个不存在的脚本：\n\
  \n```javascript\nlet script = document.createElement('script');\nscript.src = \"\
  https://example.com/404.js\"; // 不存在该脚本\ndocument.head.append(script);\n\nscript.onerror\
  \ = function() {\n  alert(\"Error loading \" + this.src); // 加载 https://example.com/404.js\
  \ 失败\n};\n```\n\n请注意，我们无法在此获取 HTTP 错误详情。不知道是 404 错误还是 500 错误或其他。只知道加载失败了。\n\n重要提示：\n\
  \n`onload`/`onerror` 事件仅跟踪加载本身。\n\n脚本处理执行期间可能发生的错误不在这些事件的范围内。也就是说：如果脚本成功加载，`onload`\
  \ 会触发。要跟踪脚本错误，可以使用全局 `window.onerror`。\n\n### 其他资源\n\n`load` 和 `error` 事件也适用于其他资源，基本上适用于任何具有\
  \ `src` 的资源。\n\n例如：\n\n```javascript\nlet img = document.createElement('img');\n\
  img.src = \"https://cx/clipart/train.gif\";\n\nimg.onload = function() {\n  alert(`图片已加载，尺寸\
  \ ${img.width}x${img.height}`);\n};\n\nimg.onerror = function() {\n  alert(\"加载图片时发生错误\"\
  );\n};\n```\n\n有一些说明：\n\n- 大多数资源在被添加到文档时开始加载。但 `<img>` 是例外。它在获取 `src` 时开始加载。\n-\
  \ 对于 `<iframe>`，`iframe.onload` 事件在 iframe 加完成后触发，无论加载成功还是出错。\n\n这是出于历史原因。\n\n##\
  \ 跨域策略\n\n有一条规则：一个站点的脚本无法访问另一个的内容。例如，`https://facebook.com` 的脚本无法读取 `gmail.com`\
  \ 的邮箱。\n\n更准确地说，一个源（域名/端口/协议三元组）无法访问另一个。即使是子域名或另一个端口，这些不同的源之间无法访问。\n\n这条规则也影响其他域的资源。\n\
  \n如果我们使用另一个域的脚本且其中存在错误，我们无法获取错误详情。\n\n例如，让我们取一个 `error.js` 脚本，它包含一个（错误的）函数调用：\n\n\
  ```\n// \U0001F4C1 error.js\nnoSuchFunction();\n```\n\n现在从它所在的相同站点加载它：\n\n```html\n\
  <script>\nwindow.onerror = function(message, url, line, col, errorObj) {\n  alert(`${message}\\\
  n${url}, ${line}:${col}`);\n};\n</script>\n<script src=\"/article/onload-onerror/crossorigin/error.js\"\
  ></script>\n```\n\n我们可以看到一个错误报告，如下：\n\n```\nUncaught ReferenceError: noSuchFunction\
  \ is not defined\nhttps://javascript.info/article/onload-onerror/crossorigin/error.js,\
  \ 1:1\n```\n\n现在让我们从另一个域加载同一个脚本：\n\n```html\n<script>\nwindow.onerror = function(message,\
  \ url, line, col, errorObj) {\n  alert(`${message}\\n${url}, ${line}:${col}`);\n\
  };\n</script>\n<script src=\"https://cors.javascript.info/article/onload-onerror/crossorigin/error.js\"\
  ></script>\n```\n\n报告是不同的，如下：\n\n```\nScript error.\n, 0:0\n```\n\n细节取决于浏览器，但核心思想相同：关于脚本内部的任何信息（包括错误堆栈）都被隐藏了。正因为来自另一个域。\n\
  \n为什么我们需要错误详情？\n\n\n\n\n\n有很多服务（我们也可以自己构建）使用 `window.onerror` 监听全局错误，保存错误并提供接口来访问和分析它们。这非常棒，因为我们可以看到用户触发的真实错误。但如果脚本来自另一个源，正如我们所看到的，关于它的错误信息并不多。\n\
  \n类似的跨源策略（`CORS`）也适用于其他类型的资源。\n\n为了允许跨源访问，`<script>` 标签需要具有 `crossorigin` 属性，并且远程服务器必须提供特殊的响应头。\n\
  \n跨源访问有三个级别：\n\n1. **没有 `crossorigin` 属性** – 禁止访问。\n2. **`crossorigin=\"anonymous\"\
  `** – 如果服务器响应的头部 `Access-Control-Allow-Origin` 为 `*` 或我们的源，则允许访问。浏览器不会向远程服务器发送授权信息和\
  \ cookie。\n3. **`crossorigin=\"use-credentials\"`** – 如果服务器返回带有我们的源的 `Access-Control-Allow-Origin`\
  \ 头部以及 `Access-Control-Allow-Credentials: true`，则允许访问。浏览器向远程服务器发送授权信息和 cookie。\n\
  \n请注意：\n\n你可以在章节 [Fetch: 跨源请求](https://javascript.info/fetch-crossorigin) 中读到更多关于跨源访问的内容。它描述了用于网络请求的\
  \ `fetch` 方法，但策略是完全相同的。\n\n“cookie”等内容出了我们目前的讨论范围，但你可以在章节 [Cookies, document.cookie](https://javascript.info/cookie)\
  \ 中阅读它们。\n\n在我们的案例中，我们没有任何 `crossorigin` 属性。因此，禁止了跨源访问。让我们加上它。\n\n我们可以在 `\"anonymous\"\
  `（不发送 cookie，需要一个服务器端头部）和 `\"use-credentials\"`（也发送 cookie，需要两个服务器端头部）之间进行选择。\n\n\
  如果我们不在乎 cookie，那么 `\"anonymous\"` 是选择：\n\n```javascript\n <script>\nwindow.onerror\
  \ = function(message, url, line, col, errorObj) {\n  alert(`${message}\\n${url},\
  \ ${line}:${col}`);\n};\n</script>\n<script crossorigin=\"anonymous\" src=\"https://cors.javascript.info/article/onload-onerror/crossorigin/error.js\"\
  ></script>\n```\n\n现在，假设服务器提供了 `Access-Control-Allow-Origin` 头部，一切都正常了。我们有了完整的错误报告。\n\
  \n## 总结\n\n图像 `<img>`、外部样式、脚本和其他资源提供了 `load` 和 `error` 事件来跟踪它们的加载情况：\n\n* `load`\
  \ 在加载成功时触发，\n* `error` 在加载失败时触发。\n\n唯一的异常是 `<iframe>`：由于历史原因，它在任何加载完成时始终会触发 `load`，即使页面未找到。\n\
  \n`readystatechange` 事件也适用于资源，但很少使用，因为 `load/error` 事件更简单。\n\n## 任务\n\n#### 使用回调函数加载图像，重要性：4\n\
  \n通常情况下，图像在创建时被加载。因此，当我们向页面添加 `<img>` 时，用户并不会立即看到图片。浏览器需要先加载它。\n\n为了立即显示图像，我们可以“提前”创建它，如下所示：\n\
  \n```javascript\nlet img = document.createElement('img');\nimg.src = 'my.jpg';\n\
  ```\n\n浏览器开始加载图像并将其记录在缓存中。稍后，当相同的图片再次出现在文档中（无论何如何），它都会立即显示。\n\n创建一个函数 `preloadImages(sources,\
  \ callback)`，它加载数组 `sources` 中的所有图像，并在准备就绪运行时 `callback`。\n\n例如，将在将在加载后显示一个 `alert`：\n\
  \n```javascript\nfunction loaded() {\n  alert(\"Images loaded\")\n}\n\npreloadImages([\"\
  1.jpg\", \"2.jpg\", \"3.jpg\"], loaded);\n```\n\n在发生错误的情况下，该函数仍应假设图片已“加载”完成。\n\n\
  换句话说，当所有图像要么加载完成要么报错时，执行 `callback`。\n\n这个函数非常有用，例如当我们计划显示一个包含许多可滚动图像的画廊，并想要确保所有图像已加载时。\n\
  \n在源文档中，你可以找到测试图像的链接，以及检查它们是否已加载的代码。它应该输出 `300`。\n\n[打开任务的沙箱。](https://plnkr.co/edit/ledoe6G3z8JhxqEhn1T1?p=preview)\n\
  \n查看解决方案\n\n### 杂记\n\n### Mutation observer\n\n`MutationObserver` 是一个内置对象，用于观察 DOM\
  \ 元素并在发生变化时触发回调函数。\n\n我们先查看语法，然后探索一个真实世界的用例。\n\n#### 语法\n\n`MutationObserver` 易于使用。\n\
  \n首先，我们创建一个带有一个回调函数的观察器：\n\n```javascript\nlet observer = new MutationObserver(callback);\n\
  ```\n\n然后将其挂载到 DOM 节点：\n\n```javascript\nobserver.observe(node, config);\n```\n\n\
  `config` 是一个带有布尔选项的对象，用于定义“对哪种变化做出反应”：\n\n* `childList` – `node` 直接子节点的变化，\n* `subtree`\
  \ – `node` 的所有后代节点的变化，\n* `attributes` – `node` 的属性，\n* `attributeFilter` – 一个要观察的属性名称数组，\n\
  \n其他几个选项：\n\n* `attributeOldValue` – 如果为 `true`，则将属性的旧值传递给回调，\n* `characterDataOldValue`\
  \ – 如果为 `true`，则将数据的旧值传递给回调。\n\n随后在发生任何变化后，都会执行 `callback`：变化将作为第一个参数以 [MutationRecord](https://dom.spec.whatwg.org/#mutationrecord)\
  \ 对象列表的形式传入，观察器本身作为第二个参数。\n\n[MutationRecord](https://dom.spec.whatwg.org/#mutationrecord)\
  \ 对象具有属性：\n\n* `type` – 变化类型，包括：\n    * `\"attributes\"`: 属性被修改\n    * `\"characterData\"\
  `: 数据被修改\n    * `\"childList\"`: 子元素被添加/移除\n* `target` – 变化发生的地方：对于 `\"attributes\"\
  ` 是元素，对于 `\"characterData\"` 是文本节点，或者对于 `\"childList\"` 是元素\n* `addedNodes/removedNodes`\
  \ – 被添加/移除的节点，\n* `previousSibling/nextSibling` – 被添加/移除节点的上一个/下一个节点，\n* `attributeName/attributeNamespace`\
  \ – 更改属性的名称/命名空间（针对 XML），\n* `oldValue` – 旧值，仅针对属性或文本变化，如果设置了相应选项。\n\n例如，这里有一个带有\
  \ `contentEditable` 属性的 `<div>`。该属性允许我们对其聚焦并编辑。\n\n```html\n<div contentEditable\
  \ id=\"elem\">Click and <b>edit</b>, please</div>\n\n<script>\nlet observer = new\
  \ MutationObserver(mutationRecords => {\n  console.log(mutationRecords); // 打印变化\n\
  });\n\n// 观察所有内容\nobserver.observe(elem, {\n  childList: true, // 观察直接子节点\n  subtree:\
  \ true, // 也观察更深层的后代\n  characterDataOldValue: true // 将旧数据传递给回调\n});\n</script>\n\
  ```\n\n现在如果我们更改 `<b>edit</b>` 内部的文本，我们将得到一个变化：\n\n```javascript\nmutationRecords\
  \ = [{\n  type: \"characterData\",\n  oldValue: \"edit\",\n  target: <text node>,\n\
  \  // 其他属性为空\n}];\n```\n\n如果我们选择并完全移除 `<b>edit</b>`，我们将得到多个变化：\n\n```javascript\n\
  mutationRecords = [{\n  type: \"childList\",\n  target: <div#elem>,\n  removedNodes:\
  \ [<b>],\n  nextSibling: <text node>,\n  previousSibling: <text node>\n  // 其他属性为空\n\
  }, {\n  type: \"characterData\"\n  // ...变异（mutation）细节取决于浏览器如何处理这种移除\n  // 它可能会将相邻的文本节点\
  \ \"edit \" 和 \", please\" 合并为一个节点\n  // 或者它可能会保持它们为独立的文本节点\n}];\n```\n\n因此，`MutationObserver`\
  \ 允许对 DOM 子树内的任何变化做出反应。\n\n#### 用于集成的用法\n\n这种东西在什么时候可能有用？\n\n\n\n\n想象一下这种情况：你挂载了一个第三方脚本，它为页面添加了实用的功能，但同时也做了一些你不想要的操作，例如显示广告\
  \ `<div class=\"ads\">Unwanted ads</div>`。\n\n自然地，该第三方脚本并没有提供移除它的机制。\n\n使用 `MutationObserver`，我们可以检测到此类元素出现在我们的\
  \ DOM 中并将其移除，同时保留实用的功能。不过，该脚本的创建者显然不会高兴于你拿走了他们的有用东西并删除了广告。\n\n在其他一些情况下，第三方脚本向我们的文档中添加了内容，而我们希望在它发生时进行检测，以调整页面、动态调整某些尺寸等。`MutationObserver`\
  \ 可以轻松处理这些情况。\n\n## 架构层面的用法\n\n从架构的角度来看，某些情况下 `MutationObserver` 也是很有用的。\n\n假设我们正在制作一个关于编程的网站。自然地，文章和其他材料可能包含源代码片段。\n\
  \n在 HTML 标记中，这样的片段看起来如下：\n\n```html\n...\n<pre class=\"language-javascript\"><code\n\
  \  // here's the code\n  let hello = \"world\";\n</code></pre>\n...\n```\n\n我们，会在网站上使用一个\
  \ JavaScript 高亮库，例如 [Prism.js](https://prismjs.com/)。调用 `Prism.highlightElem(pre)`\
  \ 会检查此类 `pre` 元素的内容，并为它们添加特殊的标签和样式以实现彩色语法高亮，类似于你在本页面示例中看到的效果。\n\n到底什么时候运行该高亮方法？我们可以在\
  \ `DOMContentLoaded` 事件上，或者在页面底部执行。在那个时刻，DOM 已经准备就绪，可以搜索元素 `pre[class*=\"language\"\
  ]` 并它们上调用 `Prism.highlightElem`：\n\n```javascript\n// 高亮页面上所有的代码片段\ndocument.querySelectorAll('pre[class*=\"\
  language\"]').forEach(Prism.highlightElem);\n```\n\n到目前为止都很简单，对吧？HTML 中有 `<pre>`\
  \ 代码片段，我们对它们进行高亮。\n\n现在继续。假设我们要从服务器动态获取材料。我们将在[教程的稍后部分](https://javascript.info/fetch)\
  \ 学习这些方法。现在重要的是我们从 Web 服务器获取一个 HTML 文章并根据需要显示它：\n\n```javascript\nlet article =\
  \ /* fetch new content from server */\narticleElem.innerHTML = article;\n```\n\n\
  新的 `article` HTML 可能包含代码片段。我们需要对它们调用 `Prism.highlightElem`，否则它们将不会高亮。\n\n### 对于动态加载的文章，在何处以及何时调用\
  \ `Prism.highlightElem`？\n\n我们可以将该调用附加到加载文章的代码中，如下：\n\n```javascript\nlet article\
  \ = /* fetch new content from server */\narticleElem.innerHTML = article;\n\nlet\
  \ snippets = articleElem.querySelectorAll('pre[class*=\"language-\"]');\nsnippets.forEach(Prism.highlightElem);\n\
  ```\n\n…但想象一下，我们的代码中有许多地方加载内容：文章、测验、论坛帖子。我们需要在每个地方都放置高亮调用吗？这并不方便，而且容易忘记。\n\n如果内容是由第三方模块加载的呢？例如，我们有一个由别人写的论坛，它动态加载内容，而我们希望为它添加语法高亮。没有人喜欢去修补第三方脚本。\n\
  \n幸运的是，还有另一种选择。\n\n我们可以使用 `MutationObserver` 自动检测代码片段何时插入页面，并对它们进行高亮。\n\n这样我们只需要在一个地方处理高亮功能，从而消除了集成它的需求。\n\
  \n#### 动态高亮演示\n\n这是一个运行中的示例。\n\n如果你运行这段代码，它将开始观察下面的元素并高亮出现在其中的任何代码片段：\n\n```javascript\n\
  let observer = new MutationObserver(mutations => {\n\n  for(let mutation of mutations)\
  \ {\n    // 检查新节点，是否有需要高亮的内容？\n\n    for(let node of mutation.addedNodes) {\n  \
  \    // 我们只跟踪元素，跳过其他节点（例如文本节点）\n      if (!(node instanceof HTMLElement)) continue;\n\
  \n      // 检查插入的元素是否为代码片段\n      if (node.matches('pre[class*=\"language-\"]'))\
  \ {\n        Prism.highlightElement(node);\n      }\n\n      // 或者在它的子树某处是否有代码片段？\n\
  \      for(let elem of node.querySelectorAll('pre[class*=\"language-\"]')) {\n \
  \       Prism.highlightElement(elem);\n      }\n    }\n  }\n});\n\nlet demoElem\
  \ = document.getElementById('highlight-demo');\n\nobserver.observe(demoElem, {childList:\
  \ true, subtree: true});\n```\n\n在这里，下方有一个 HTML 元素和一个使用 `innerHTML` 动态填充它的 JavaScript。\n\
  \n请运行之前的代码（上面的代码观察该元素），然后运行下面的代码。你将看到 `MutationObserver` 如何检测并高亮该片段。\n\n一个带有 `id=\"\
  highlight-demo\"` 的演示元素，运行上面的代码来观察它。\n\n以下代码填充了它的 `innerHTML`。请先运行上面的代码，它将监听并高亮新内容：\n\
  \n```javascript\nlet demoElem = document.getElementById('highlight-demo');\n\n//\
  \ 动态插入带有代码片段的内容\ndemoElem.innerHTML = `A code snippet is below:\n  <pre class=\"\
  language-javascript\"><code let hello = \"world!\"; </code></pre>\n  <div>Another\
  \ one:</div>\n  <div><div>\n    <pre class=\"language-css\"><code>.class { margin:\
  \ 5px; }</code></pre>\n  </div>\n`;\n```\n\n\n\n\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ width=\"690\" height=\"320\"><g transform=\"translate(20,30)\"><g class=\"node\"\
  \ transform=\"translate(0,0)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\"\
  \ style=\"fill: black; pointer-events: none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\"\
  \ style=\"font: 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace;\
  \ fill: rgb(51, 51, 51); pointer-events: none;\">P</text></g><g class=\"node\" transform=\"\
  translate(50,30)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font:\
  \ 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace; fill: rgb(51,\
  \ 51, 51); pointer-events: none;\">#text Example:</text></g> <g class=\"node\" transform=\"\
  translate(50,60)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill:\
  \ black; pointer-events: none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"\
  font: 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace; fill:\
  \ rgb(51, 51, 51); pointer-events: none;\">I</text></g><g class=\"node\" transform=\"\
  translate(100,90)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font:\
  \ 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace; fill: rgb(51,\
  \ 51, 51); pointer-events: none;\">#text italic</text></g><g class=\"node\" transform=\"\
  translate(50,120)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"font:\
  \ 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace; fill: rgb(51,\
  \ 51, 51); pointer-events: none;\">#text and</text></g> <g class=\"node\" transform=\"\
  translate(50,150)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"3.5\" style=\"fill:\
  \ black; pointer-events: none;\">▾</text> <text dy=\"4.5\" dx=\"16.5\" style=\"\
  font: 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace; fill:\
  \ rgb(51, 51, 51); pointer-events: none;\">B</text></g><g class=\"node\" transform=\"\
  translate(100,180)\" style=\"opacity: 1;\"><text dy=\"4.5\" dx=\"5.5\" style=\"\
  font: 14px Consolas, &quot;Lucida Console&quot;\", Menlo, Monaco, monospace; fill:\
  \ rgb(51, 51, 51); pointer-events: none;\">#text bold</text></g></g></svg>\n\n让我们选择\
  \ `\"Example: <i>italic</i>\"`。这是 `<p>` 标签中的前两个子节点（计算文本节点）：\n\n![](img/range-example-p-0-1.svg)\n\
  \n```\n <p id=\"p\">Example: <i>italic</i> and <b>bold</b></p>\n\n<script>\n  let\
  \ range = new Range();\n\n  range.setStart(p, 0);\n  range.setEnd(p, 2);\n\n  //\
  \ range 的 toString 方法将其内容以文本形式返回（不含标签）\n  alert(range); // Example: italic\n\n \
  \ // 将此范围应用于文档选择（稍后解释）\n  document.getSelection().addRange(range);\n</script>\n\
  ```\n\n* `range.setStart(p, 0)` – 将起始设置在 `<p>` 的第 0 个子节点（这是一个文本节点 `\"Example: \"\
  `）。\n* `range.setEnd(p, 2)` – 将范围延伸到（但不包含）`<p>` 的第 2 个子节点（这是一个文本节点 `\" and \"`，但由于结束点不包含，所以最后一个选中的节点是\
  \ `<i>`）。\n\n这里有一个更灵活的测试台，你可以尝试更多变体：\n\n```\n <p id=\"p\">Example: <i>italic</i>\
  \ and <b>bold</b></p>\n\n从 <input id=\"start\" type=\"number\" value=1> 到 <input\
  \ id=\"end\" type=\"number\" value=4>\n<button id=\"button\">点击选择</button>\n<script>\n\
  \  button.onclick = () => {\n    let range = new Range();\n\n    range.setStart(p,\
  \ start.value);\n    range.setEnd(p, end.value);\n\n    // 应用选择范围，稍后解释\n    document.getSelection().removeAllRanges();\n\
  \    document.getSelection().addRange(range);\n  };\n</script>\n```\n\nbe37uu.html\n\
  \n例如，从 `1` 选择到 `4` 得到范围 `<i>italic</i> and <b>bold</b>`。\n\n### Range 属性\n\n该 `range`\
  \ 对象具有以下属性：\n\n* `startContainer`, `startOffset` – 起始点的节点和偏移量\n* `endContainer`,\
  \ `endOffset` – 终点的节点和偏移量\n* `collapsed` – 布尔值，如果范围起始和结束在同一点则为 `true`（即内部没有内容）\n\
  * `commonAncestor` – 范围内所有节点的最近共同祖先\n\n### 方法\n\n有许多方便的方法来操作范围（ranges）。\n\n设置范围起始点：\n\
  \n* `setStart(node, offset)` 将起始设置在：`node` 中的位置 `offset` 处\n* `setStartBefore(node)`\
  \ 将起始设置在：`node` 之前\n* `setStartAfter(node)` 将起始设置在：`node` 之后\n\n设置范围终点（类似的方法）：\n\
  \n* `setEnd(node, offset)` 将结束设置在：`node` 中的位置 `offset` 处\n* `setEndBefore(node)`\
  \ 将结束设置在：`node` 之前\n* `setEndAfter(node)` 将结束设置在：`node` 之后\n\n**正如演示，`node` 既可以是文本节点也可以是元素节点：对于文本节点，`offset`\
  \ 跳过相应数量的字符；对于元素节点，则跳过相应数量的子节点。**\n\n其他方法：\n\n* `selectNode(node)` 设置范围以选择整个 `node`\n\
  * `selectNodeContents(node)` 设置范围以选择整个 `node` 内容\n* `collapse(toStart)` 如果 `toStart=true`\
  \ 则设置结束=起始，否则设置起始=结束，从而折叠范围\n* `cloneRange()` 创建一个具有相同起始/终点的新范围\n\n操作范围内的内容：\n\n\
  * `deleteContents()` – 从文档中删除范围内容\n* `extractContents()` – 从文档中提取范围内容并返回 DocumentFragment\n\
  * `cloneContents()` – 克隆范围内容并返回 DocumentFragment\n* `insertNode(node)` 将 `node`\
  \ 插入文档的范围开头\n* `surroundContents(node)` – 用 `node` 包围范围内容。为了使此生效，范围必须包含内部所有元素的完整起始和结束标签：不能是部分范围，如\
  \ `<i>abc`。\n\n通过这些方法，我们可以对选中的节点进行几乎任何操作。\n\n这里是用于演示这些操作的测试台：\n\n\n\n\n\n```javascript\n\
  Click buttons to run methods on the selection, \"resetExample\" to reset it.\n\n\
  <p id=\"p\">Example: <i>italic</i> and <b>bold</b></p>\n\n<p id=\"result\"></p>\n\
  <script>\n  let range = new Range();\n\n  // 每个演示的方法在这里被表示：\n  let methods = {\n\
  \    deleteContents() {\n      range.deleteContents()\n    },\n    extractContents()\
  \ {\n      let content = range.extractContents();\n      result.innerHTML = \"\"\
  ;\n      result.append(\"extracted: \", content);\n    },\n    cloneContents() {\n\
  \      let content = range.cloneContents();\n      result.innerHTML = \"\";\n  \
  \    result.append(\"cloned: \", content);\n    },\n    insertNode() {\n      let\
  \ newNode = document.createElement('u');\n      newNode.innerHTML = \"NEW NODE\"\
  ;\n      range.insertNode(newNode);\n    },\n    surroundContents() {\n      let\
  \ newNode = document.createElement('u');\n      try {\n        range.surroundContents(newNode);\n\
  \      } catch(e) { alert(e) }\n    },\n    resetExample() {\n      p.innerHTML\
  \ = `Example: <i>italic</i> and <b>bold</b>`;\n      result.innerHTML = \"\";\n\n\
  \      range.setStart(p.firstChild, 2);\n      range.setEnd(p.querySelector('b').firstChild,\
  \ 3);\n\n      window.getSelection().removeAllRanges();\n      window.getSelection().addRange(range);\n\
  \    }\n  };\n\n  for(let method in methods) {\n    document.write(`<div><button\
  \ onclick=\"methods.${method}()\">${method}</button></div>`);\n  }\n\n  methods.resetExample();\n\
  </script>\n```\n\neris84.html\n\n同时也存在比较范围的方法，但这些方法很少被使用。当你需要它们时，请参考[规范](https://dom.spec.whatwg.org/#interface-range)\
  \ 或 [MDN 手册](https://developer.mozilla.org/en-US/docs/Web/API/Range)。\n\n## 选择 (Selection)\n\
  \n`Range` 是一个管理选择范围的通用对象。我们可以创建此类对象并传递它们 —— 它们本身不会在视觉上选择任何内容。\n\n文档选择由 `Selection`\
  \ 对象表示，可以通过 `window.getSelection()` 或 `document.getSelection()` 获取。\n\n一个选择可能包含零或多个范围。至少，[Selection\
  \ API 规范](https://www.w3.org/TR/selection-api/)是这样说明的。但在实践中，只有 Firefox 允许通过 `Ctrl+click`（Mac\
  \ 上为 `Cmd+click`）在文档中选择多个范围。\n\n这是一个在 Firefox 中生成的包含 3 个范围的选择截图：\n\n![](img/selection-firefox.svg)\n\
  \n其他浏览器最多支持 1 个范围。正如我们将看到的，`Selection` 的某些方法暗示可能存在许多范围，但再次，除了 Firefox 之外的所有浏览器，最多只有\
  \ 1 个。\n\n## 选择属性 (Selection properties)\n\n与范围类似，选择包含一个起点，称为“锚点 (anchor)”，和一个终点，称为“焦点\
  \ (focus)”。\n\n主要的选择属性有：\n\n* `anchorNode` – 选择开始的节点，\n* `anchorOffset` – `anchorNode`\
  \ 中选择开始的偏移量，\n* `focusNode` – 选择结束的节点，\n* `focusOffset` – `focusNode` 中选择结束的偏移量，\n\
  * `isCollapsed` – 如果选择未选中内容（空范围）或不存在，则为 `true`。\n* `rangeCount` – 选择中范围的数量，除 Firefox\
  \ 外的所有浏览器中最多为 `1`。\n\n### 选择终点可能在文档起点之前\n\n有许多选择内容的方法，取决于用户代理：鼠标、热键、移动端点击等。\n\n\
  其中某些方法（如鼠标）允许按两个方向创建相同的选择：“从左到右”和“从右到左”。\n\n如果选择的起点（锚点）在文档中位于终点（焦点）之前，则该选择被具有“向前”方向。\n\
  \n例如，如果用户使用鼠标开始选择并从“Example”移动到“italic”：\n\n![](img/selection-direction-forward.svg)\n\
  \n否则，如果他们从“italic”的结尾移动到“Example”，选择就是“向后”的，其焦点将在锚点之前：\n\n![](img/selection-direction-backward.svg)\n\
  \n这与 `Range` 对象不同，`Range` 总是向前的：范围的起点不能在其终点之后。\n\n## 选择事件 (Selection events)\n\n\
  有一些用于跟踪选择的事件：\n\n* `elem.onselectstart` – 当在 `elem` 上开始选择时，例如用户按下按钮并移动鼠标。\n    *\
  \ 阻止默认操作将使选择开始。\n* `document.onselectionchange` – 每当选择发生变化时触发。\n    * 请注意：此处理程序只能设置在\
  \ `document` 上。\n\n### 选择跟踪演示 (Selection tracking demo)\n\n这是一个小型演示，显示选择边界如何随变化动态更新：\n\
  \n```html\n<p id=\"p\">Select me: <i>italic</i> and <b>bold</b></p>\n\nFrom <input\
  \ id=\"from\" disabled> – To <input id=\"to\" disabled>\n<script>\n  document.onselectionchange\
  \ = function() {\n    let {anchorNode, anchorOffset, focusNode, focusOffset} = document;\n\
  \    // （注：逻辑遵循原文语境）\n  };\n</script>\n```\n\n### 选择获取演示 (Selection getting demo)\n\
  \n```html\n<p id=\"p\">Select me: <i>italic</i> and <b>bold</b></p>\n\nFrom <input\
  \ id=\"from\" disabled> – To <input id=\"to\" disabled>\n<script>\n  document.onselectionchange\
  \ = function() {\n    let {anchorNode, anchorOffset, focusNode, focusOffset} = document;\n\
  \    // ...\n  };\n</script>\n```\n\n## 选择方法 (Selection methods)\n\n用于添加/删除范围的选择方法：\n\
  \n* `getRangeAt(i)` – 获取第 i 个范围，从 `0` 开始。在除 firefox 外的所有浏览器中，仅使用 `0`。\n* `addRange(range)`\
  \ – 向选择添加 `range`。除 Firefox 外的所有浏览器中，如果选择已有一个范围，则忽略此调用。\n* `removeRange(range)`\
  \ – 从选择中移除 `range`。\n* `removeAllRanges()` – 移除所有范围。\n* `empty()` – `removeAllRanges`\
  \ 的别名。\n\n此外还有直接操作选择而无需 `Range` 的便利方法：\n\n* `collapse(node, offset)` – 将选中的范围替换为新的范围，该范围在指定的\
  \ `node` 处 `offset` 处开始并结束。\n* `setPosition(node, offset)` – `collapse` 的别名。\n*\
  \ `collapseToStart()` – 折叠（替换为空范围）到选择起点，\n* `collapseToEnd()` – 折叠到选择终点，\n* `extend(node,\
  \ offset)` – 将选择焦点移动到指定的 `node`, `offset` 处，\n* `setBaseAndExtent(anchorNode, anchorOffset,\
  \ focusNode, focusOffset)` – 将选择替换为指定的起点 `anchorNode/anchorOffset` 和终点 `focusNode/focusOffset`。选中它们之间的所有内容。\n\
  * `selectAllChildren(node)` – 选择 `node` 的所有子节点。\n* `deleteFromDocument()` – 从文档中删除选中内容。\n\
  * `containsNode(node, allowPartialContainment = false)` – 检查是否包含 `node`（如果第二个参数为\
  \ `true` 则允许部分包含）。\n\n因此，许多任务我们可以调用 `Selection` 方法，无需访问底层的 `Range` 对象。例如，选择段落 `<p>`\
  \ 的所有内容：\n\n```html\n<p id=\"p\">Select me: <i>italic</i> and <b>bold</b></p>\n\n\
  <script>\n  // 从 <p> 的第 0 个子节点到最后一个节点\n  document.getSelection().setBaseAndExtent(p,\
  \ 0, p, p.childNodes.length);\n</script>\n```\n\n使用范围实现相同的操作：\n\n\n\n\n\n```html\n\
  <p id=\"p\">选择我：<i>斜体</i> 和 <b>粗体</b></p>\n```\n\n```javascript\n<script>\n  let\
  \ range = new Range();\n  range.selectNodeContents(p); // 或者使用 selectNode(p) 来选择\
  \ <p> 标签\n\n  document.getSelection().removeAllRanges(); // 如果存在现有选择，将其清除\n  document.getSelection().addRange(range);\n\
  </script>\n```\n\n要进行选择，请先移除现有的选择。\n\n如果选择已存在，请先用 `removeAllRanges()` 将清空。然后添加范围。否则，除\
  \ Firefox 以外的所有浏览器都会忽略新的范围。\n\n例外是某些选择方法，它们会替换现有的选择，例如 `setBaseAndExtent`。\n\n###\
  \ 表单控件中的选择\n\n表单元素（如 `input` 和 `textarea`）提供了[专门的选择 API](https://html.spec.whatwg.org/#textFieldSelection)，而无需\
  \ `Selection` 或 `Range` 对象。由于输入值是纯文本而非 HTML，因此不需要此类对象，一切都简单得多。\n\n#### 属性：\n\n*\
  \ `input.selectionStart` – 选择起始位置（可写），\n* `input.selectionEnd` – 选择结束位置（可写），\n*\
  \ `input.selectionDirection` – 选择方向，取值于：“forward”（向前）、“backward”（向后）或“none”（无，例如通过双击鼠标进行选择时），\n\
  \n#### 事件：\n\n* `input.onselect` – 当选中某些内容时触发。\n\n#### 方法：\n\n* `input.select()`\
  \ – 选择文本控件中的所有内容（可以是 `textarea` 代替 `input`），\n* `input.setSelectionRange(start,\
  \ end, [direction])` – 将选择更改为从位置 `start` 到 `end` 的范围，方向由给定（可选）。\n* `input.setRangeText(replacement,\
  \ [start], [end], [selectionMode])` – 用新文本替换范围文本。\n\n  可选参数 `start` 和 `end` 如果提供，则设置范围的起始和结束位置，否则将使用用户选择。\n\
  \n  最后一个参数 `selectionMode` 决定了文本被替换后如何设置选择。可能的值有：\n\n  * `\"select\"` – 新插入的文本将被选中。\n\
  \  * `\"start\"` – 选择范围收缩到插入文本的正之前（光标将紧随其前）。\n  * `\"end\"` – 选择范围收缩到插入文本的正之后（光标将紧随其后）。\n\
  \  * `\"preserve\"` – 尝试保留选择。这是默认值。\n\n现在让我们来看看这些方法的实际应用。\n\n### 示例：跟踪选择\n\n例如，这段代码使用\
  \ `onselect` 事件来跟踪选择：\n\n```html\n<textarea id=\"area\" style=\"width:80%;height:60px\"\
  >\n在此文本中进行选择会更新下方的值。\n</textarea>\n<br>\n从 <input id=\"from\" disabled> – 到 <input\
  \ id=\"to\" disabled>\n\n<script>\n  area.onselect = function() {\n    from.value\
  \ = area.selectionStart;\n    to.value = area.selectionEnd;\n  };\n</script>\n```\n\
  \necvh5i.html\n\n请注意：\n\n* `onselect` 在选中内容时触发，但在选择被移除时不会触发。\n* 根据[规范](https://w3c.github.io/selection-api/#dfn-selectionchange)，`document.onselectionchange`\
  \ 事件不应为表单控件内部的选择触发，因为它与 `document` 选择和范围无关。某些浏览器会生成它，但我们不应该依赖它。\n\n### 示例：移动光标\n\
  \n我们可以更改 `selectionStart` 和 `selectionEnd` 来设置选择范围。\n\n一个重要的边界情况是 `selectionStart`\
  \ 和 `selectionEnd` 相等。此时它恰好就是光标位置。或者说，当没有选择时，选择位于光标位置。\n\n通过将 `selectionStart` 和\
  \ `selectionEnd` 设置为相同的值，我们可以移动光标。\n\n例如：\n\n```html\n<textarea id=\"area\" style=\"\
  width:80%;height:60px\">\n聚焦我，光标将位于位置 10。\n</textarea>\n\n<script>\n  area.onfocus\
  \ = () => {\n    // 使用零延迟 setTimeout 以在浏览器聚焦动作完成后执行\n    setTimeout(() => {\n  \
  \    // 我们可以设置任何选择\n      // 如果 start=end，光标将位于该处\n      area.selectionStart = area.selectionEnd\
  \ = 10;\n    });\n  };\n</script>\n```\n\n4u8rte.html\n\n### 示例：修改选择\n\n要修改选择的内容，我们可以使用\
  \ `input.setRangeText()` 方法。当然，我们可以读取 `selectionStart/End`，并根据选择情况更改 `value` 的相应子字符串，但\
  \ `setRangeText` 更强大且通常更方便。\n\n这是一个相当复杂的方法。在最简单的单参数形式下，它会替换用户选择范围并移除选择。\n\n例如，在这里用户的选择将被星号\
  \ `*...*` 包：\n\n```html\n<input id=\"input\" style=\"width:200px\" value=\"选择此处并点击按钮\"\
  >\n<button id=\"button\">用星号 *...* 包裹选择</button>\n\n<script>\nbutton.onclick = ()\
  \ => {\n  // 包裹选择的逻辑\n};\n</script>\n```\n\n\n\n\n- [HTML 规范：文本控制选择的 API](https://html.spec.whatwg.org/multipage/form-control-infrastructure.html#textFieldSelection)\n\
  \n## 总结\n\n我们涵盖了两种不同的选择 API：\n\n1. 针对文档：`Selection` 和 `Range` 对象。\n2. 针对 `input`,\
  \ `textarea`：额外的的方法和属性。\n\n第二个 API 非常简单，因为它它是处理文本的。\n\n最常用的配用法可能是：\n\n1. 获取选择：\n\
  \n```javascript\nlet selection = document.getSelection();\n\nlet cloned = /* 用于将选中的节点复制的元素\
  \ */;\n\n// 然后对 selection.getRangeAt(0) 应用 Range 方法\n// 或者像这里一样应用到所有范围以支持多选\nfor\
  \ (let i = 0; i < selection.rangeCount; i++) {\n  cloned.append(selection.getRangeAt(i).cloneContents());\n\
  }\n```\n\n2. 设置选择：\n\n```javascript\nlet selection = document.getSelection();\n\n\
  // 直接设置：\nselection.setBaseAndExtent(...from...to...);\n\n// 或者我们可以创建一个范围并：\nselection.removeAllRanges();\n\
  selection.addRange(range);\n```\n\n最后，关于光标。可编辑元素（如 `<textarea>`）中的光标位置始终在选择的开始或结束。我们可以使用它来获取光标位置，或者通过设置\
  \ `elem.selectionStart` 和 `elem.selectionEnd` 来移动光标。\n\n## 事件循环：微任务与宏任务\n\n浏览器 JavaScript\
  \ 执行流与 Node.js 一样，都是基于 `event loop`（事件循环）。\n\n理解事件循环如何工作对于优化非常重要，有时对于正确的架构也同样重要。\n\
  \n在本章中，我们首先将介绍关于工作原理的理论细节，然后查看这些知识的实际应用。\n\n### 事件循环\n\n`event loop` 的概念非常简单。这是一个无限循环，JavaScript\
  \ 引擎等待任务、执行任务，然后进入休眠等待更多任务。\n\n引擎的通用算法：\n\n1. 只要有任务：\n   * 执行它们，从最旧的任务开始。\n2. 休眠直到任务出现，然后回到第\
  \ 1 步。\n\n这是我们在浏览页面时所看到现象的形式化描述。JavaScript 引擎在大部分时间里什么都不做，只有当脚本/处理器/事件激活时才会运行。\n\
  \n任务的示例：\n\n* 当外部脚本 `<script src=\"...\">` 加载时，任务是执行它。\n* 当用户移动鼠标时，任务是分发 `mousemove`\
  \ 事件并执行处理器。\n* 当调定的 `setTimeout` 时间到达时，任务是运行其回调函数。\n* ……依此类推。\n\n任务被设定 —— 引擎处理它们\
  \ —— 然后等待更多任务（在休眠时消耗几乎为零的 CPU）。\n\n可能会在引擎忙碌时出现一个任务，这时它会被入队。\n\n任务形成一个队列，即所谓的“宏任务队列”（v8\
  \ 术语）：\n\n![](img/eventLoop.svg)\n\n例如，当引擎忙于执行一个 `script` 时，用户可能会移动鼠标导致 `mousemove`，并且\
  \ `setTimeout` 可能到期，等等，这些任务形成了一个队列，如上图所示。\n\n队列中的任务按照“先来后到”原则处理。当浏览器引擎完成 `script`\
  \ 执行后，它处理 `mousemove` 事件，然后是 `setTimeout` 处理器，依此类推。\n\n到为止，非常简单，对吧？\n\n还有两个细节：\n\
  \n1. 渲染永远不会在引擎执行任务时发生。无论任务耗时多久。DOM 的更改只有在任务完成后才会进行涂绘。\n2. 如果一个任务耗时过长，浏览器将无法执行其他任务、处理用户事件，因此在一段时间后它会弹出类似“页面无响应”的提示，建议杀死该任务及整个页面。这发生在存在大量复杂计算或导致无限循环的编程错误时。\n\
  \n以上是理论。现在让我们看看应用这些知识。\n\n### 用例 1：拆分 CPU 密集型任务\n\n假设我们有一个 CPU 密集型任务。\n\n例如，语法高亮（用于本页面代码示例着色）非常消耗\
  \ CPU。为了高亮代码，它会执行分析，创建许多彩色的元素，并将它们添加到文档中 —— 对于长文本来说，这需要大量时间。\n\n当引擎忙于语法高亮时，它无法进行其他\
  \ DOM 相关的操作、处理用户事件等。这甚至可能导致浏览器出现“卡顿”甚至短暂“卡死”，这是不可接受的。\n\n我们可以通过将大任务拆分成小块来规避问题。先高亮前\
  \ 100 行，然后调度 `setTimeout`（延迟为零）处理另外 100 行，依此类推。\n\n为了演示这种方法，为了简单起见，我们不使用语法高亮，而是取一个从\
  \ `1` 数到 `1000000000` 的函数。\n\n如果你运行下面的代码，引擎将“卡死”一段时间。对于服务器端 JS 来说这明显可见，如果你在浏览器中运行，请尝试点击页面上的其他按钮\
  \ —— 你会发现计数完成之前，没有其他事件被处理。\n\n```javascript\nlet i = 0;\n\nlet start = Date.now();\n\
  \nfunction count() {\n  // 执行一个重型任务\n  for (let j = 0; j < 1e9; j++) {\n    i++;\n\
  \  }\n}\n```\n（注：原文中此处代码块不完整，已根据提供的文本结构进行了正确格式化）\n\n\n\n\n\n```\n<div id=\"progress\"\
  ></div>\n\n<script>\n\n  function count() {\n    for (let i = 0; i < 1e6; i++) {\n\
  \      i++;\n      progress.innerHTML = i;\n    }\n  }\n\n  count();\n</script>\n\
  ```\n\n…但我们可能想在任务执行期间显示某些内容，例如进度条。\n\n如果我们使用 `setTimeout` 将重型任务拆分成若干部分，那么更改就会这些任务之间进行渲染。\n\
  \n这样看起来更漂亮：\n\n```\n<div id=\"progress\"></div>\n\n<script>\n  let i = 0;\n\n  function\
  \ count() {\n\n    // 执行一部分重型任务 (*)\n    do {\n      i++;\n      progress.innerHTML\
  \ = i;\n    } while (i % 1e3 != 0);\n\n    if (i < 1e7) {\n      setTimeout(count);\n\
  \    }\n\n  }\n\n  count();\n</script>\n```\n\n现在 `<div>` 显示了 `i` 的递增值，这是一种进度条。\n\
  \n### 用例 3：在事件后执行某些操作\n\n在事件处理程序中，我们可能决定推迟某些操作，直到事件冒泡到所有层并被处理。我们可以通过将代码封装在零延迟的 `setTimeout`\
  \ 中来实现。\n\n在分发自定义事件 章节中，我们看到了一个示例：自定义事件 `menu-open` 在 `setTimeout` 中被分发，以便它在“点击”事件被完全处理后发生。\n\
  \n```\nmenu.onclick = function() {\n  // ...\n\n  // 使用点击的菜单项数据创建自定义事件\n  let customEvent\
  \ = new CustomEvent(\"menu-open\", {\n    bubbles: true\n  });\n\n  // 异步分发自定义事件\n\
  \  setTimeout(() => menu.dispatchEvent(customEvent));\n};\n```\n\n### 任务 (Macrotasks)\
  \ 和微任务 (Microtasks)\n\n除了本章描述的**宏任务**之外，还存在[微任务](https://javascript.info/microtask-queue)\
  \ 章节中提到的**微任务**。\n\n微任务完全来自我们的代码。它们通常由 promise 创建：`.then/catch/finally` 处理器的执行就会变成一个微任务。微任务也会在\
  \ `await` 的“底层”使用，因为它是 promise 处理的另一种形式。\n\n还有一个特殊的函数 `queueMicrotask(func)`，它将\
  \ `func` 队列到微任务队列中等待执行。\n\n**在每个宏任务之后，引擎会在运行任何其他宏任务或渲染或其他任何操作之前，执行微任务队列中的所有任务。**\n\
  \n例如，请看这里：\n\n```\nsetTimeout(() => alert(\"timeout\"));\n\nPromise.resolve()\n\
  \  .then(() => alert(\"promise\"));\n\nalert(\"code\");\n```\n\n这里的执行顺序是怎样的？\n\n\
  1. `code` 先显示，因为它是一个普通的同步调用。\n2. `promise` 第二显示，因为 `.then` 传递到微任务队列，并在当前代码之后运行。\n\
  3. `timeout` 最后显示，因为它是一个宏任务。\n\n更丰富的事件循环图如下：\n\n![](img/eventLoop-full.svg)\n\n\
  **所有微任务在任何其他事件处理、渲染或任何其他宏任务执行之前都会完成。**\n\n这很重要，因为这保证了微任务之间的应用程序环境基本上是相同的（没有鼠标坐标变化、没有网络数据等）。如果我们想在（当前代码之后）但在更改渲染或事件被处理之前执行一个函数，可以使用\
  \ `queueMicrotask` 来调度它。\n\n这里有一个“计数进度”的示例，与之前的类似，但使用 `queueMicrotask` 代替了 `setTimeout`。你可以看到它在最后才渲染。就像同步代码一样：\n\
  \n```\n <div id=\"progress\"></div\n\n<script>\n  let i = 0;\n\n  function count()\
  \ {\n\n    // 执行一部分重型任务\n    do {\n      i++;\n      progress.innerHTML = i;\n \
  \   } while (i % 1e3 != 0);\n\n    if (i < 1e6) {\n      queueMicrotask(count);\n\
  \    }\n\n  }\n\n  count();\n</script>\n```\n\n## 总结\n\n事件循环更详细的算法（尽管简化为了[规范](https://html.spec.whatwg.org/multipage/webapp.html#event-loop)）：\n\
  \n1. 从宏任务队列中取出并运行最旧的任务（例如“script”）。\n2. 执行所有微任务：\n   - 当微任务队列不为空时：\n     - 取出并运行最旧的微任务。\n\
  3. 如果有更改，则渲染更改。\n4. 如果宏任务队列为空，等待宏任务出现。\n5. 回到步骤 1。\n\n调度一个新的宏任务：\n- 使用带延迟的 `setTimeout(f)`。这可以用于将大型的计算密集型任务拆分成若干部分，以便浏览器能够对事件做出反应并在它们之间显示进度。\n\
  \n调度一个新的微任务：\n- 使用 `queueMicrotask(f)`。\n- 此外，处理器也会通过微任务队列。微任务之间没有 UI 或网络处理：它们会紧接着上一个运行。因此，人们可能想通过\
  \ `queueMicrotask` 在保持环境状态的同时异步地执行一个函数。\n\n### Web Workers\n\n对于不应阻塞事件循环的长时间重型计算，我们可以使用\
  \ [Web Workers](https://html.spec.whatwg.org/multipage/workers.html)。这是在另一个并行线程中运行代码的方法。\n\
  \n\n\n\n\n我们可以从 `li` 的第一个子节点读取文本，即该文本节点：\n\n```\nfor (let li of document.querySelectorAll('li'))\
  \ {\n  let title = li.firstChild.data;\n\n  // title 是 <li> 中任何其他节点之前的文本\n}\n```\n\
  \n然后我们可以通过 `li.getElementsByTagName('li').length` 获取后代的数量。\n\n[在沙盒中打开解决方案。](https://plnkr.co/edit/IK1QDDSRKvoMvdD7psXY?p=preview)\n\
  \n### nodeType 中包含什么？\n\n这里有一个陷阱。\n\n在 `<script>` 执行时，最后一个 DOM 节点正好是 `<script>`，因为浏览器还没有处理页面的其余部分。\n\
  \n所以结果是 `1`（元素节点）。\n\n```\n<html>\n\n<body>\n  <script>\n    alert(document.body.lastChild.nodeType);\n\
  \  </script>\n</body>\n\n</html>\n```\n\n### 注释中的标签\n\n答案：`BODY`。\n\n```javascript\n\
  <script>\n  let body = document.body;\n\nbody.innerHTML = \"<!--\" + body.tagName\
  \ + \"-->\";\n\n  alert( body.firstChild.data ); // BODY\n</script>\n```\n\n逐步执行过程如下：\n\
  \n1. `<body>` 的内容被注释替换。该注释为 `<!--BODY-->`，因为 `body.tagName == \"BODY\"`。正如我们记得的，HTML\
  \ 中的 `tagName` 总是大写的。\n2. 注释现在是唯一的子节点，所以我们在 `body.firstChild` 中获取了它。\n3. 注释的 `data`\
  \ 属性是它的内容（`<!--...-->` 内部）：`\"BODY\"`。\n\n### \"document\" 在层级结构在哪里？\n\n我们可以通过输出它来查看属于哪个类，例如：\n\
  \n```javascript\nalert(document); // [object HTMLDocument]\n```\n\n或者：\n\n```javascript\n\
  alert(document.constructor.name); // HTMLDocument\n```\n\n所以，`document` 是 `HTMLDocument`\
  \ 类的实例。\n\n### 它在层级结构中的位置如何？\n\n是的，我们可以浏览规范，但手动查找更快。\n\n让我们通过 `__proto__` 遍历原型链。\n\
  \n众所周知，类的方法位于构造函数的 `prototype` 中。例如，`HTMLDocument.prototype` 拥有用于文档的方法。此外，`prototype`\
  \ 内部有一个指向构造函数的引用：\n\n```javascript\nalert(HTMLDocument.prototype.constructor ===\
  \ HTMLDocument); // true\n```\n\n要获取字符串形式的类名，我们可以使用 `constructor.name`。让我们对整个 `document`\
  \ 原型链进行操作，直到 `Node` 类：\n\n```javascript\nalert(HTMLDocument.prototype.constructor.name);\
  \ // HTMLDocument\nalert(HTMLDocument.prototype.__proto__.constructor.name); //\
  \ Document\nalert(HTMLDocument.prototype.__proto__.__proto__.constructor.name);\
  \ // Node\n```\n\n这就是层级结构。我们也可以使用 `console.dir(document)` 检查对象，并通过打开 `__proto__`\
  \ 查看这些名称。控制台是从 `constructor` 获取这些的。\n\n### 属性与属性\n\n#### 获取属性\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n\n  <div data-name=\"menu\">选择类型</div>\n\n  <script>\n\
  \    // 获取它\n    let elem = document.querySelector('[data-name]');\n\n    // 读取值\n\
  \    alert(elem.dataset.name);\n    // 或者\n    alert(elem.getAttribute('data-name'));\n\
  \  </script>\n</body>\n</html>\n```\n\n#### 创建外部链接\n\n首先，我们需要找到所有的外部引用。有两种方法。第一种是使用\
  \ `document.querySelectorAll('a')` 找到所有链接，然后过滤我们需要的：\n\n```javascript\nlet links\
  \ = document.querySelectorAll('a');\n\nfor (let link of links) {\n  let href = link.getAttribute('href');\n\
  \  if (!href) continue; // 没有属性\n\n  if (!href.includes('://')) continue; // 没有协议\n\
  \n  if (href.startsWith('http://')) continue; // 内部链接\n\n  link.style.color = 'orange';\n\
  }\n```\n\n请注意：我们使用 `getAttribute('href')` 而不是 `href`，因为我们需要从 HTML 中获取值。另一种更简单的方法是在选择器中添加检查：\n\
  \n```javascript\n// 查找所有 href 中包含 // 但不以 http://com 开头的链接\nlet selector = 'a[href*=\"\
  ://\"]:not([href^=\"http://com\"])';\nlet links = document.querySelectorAll(selector);\n\
  \nlinks.forEach(link => link.style.color = 'orange');\n```\n\n[在沙盒中打开解决方案。](https://plnkr.co/edit/lXQMqclY9svBFP1eS?p=preview)\n\
  \n### 修改文档\n\n#### createText vs innerHTML vs textContent\n\n答案：1 和 3。这两条命令都会将文本\
  \ `text` “作为文本”添加到 `elem` 中。这里有一个示例：\n\n```html\n<div id=\"elem1\"></div>\n<div\
  \ id=\"elem2\"></div>\n<div id=\"elem3\"></div>\n<script>\n  let text = '<b>text</b>';\n\
  \n  elem1.append(document.createTextNode(text));\n  elem2.innerHTML = text;\n  elem3.textContent\
  \ = text;\n</script>\n```\n\n#### 清空元素\n\n首先，让我们看看*不应该*怎么做：\n\n```javascript\nfunction\
  \ clear(elem) {\n  for (let i=0; i < elem.childNodes.length; i++) {\n      elem.childNodes[i].remove();\n\
  \  }\n}\n```\n\n这样做是不行的，因为 `childNodes.length` 会随着节点的删除而改变。正确的做法是：\n\n```javascript\n\
  function clear(elem) {\n  while (elem.firstChild) {\n    elem.firstChild.remove();\n\
  \  }\n}\n```\n\n还有一个更简单的方法：\n\n```javascript\nfunction clear(elem) {\n  elem.innerHTML\
  \ = '';\n}\n```\n\n#### 为什么 \"aaa\" 留下了？\n\n这是因为 HTML 任务中是不正确的。浏览器会自动处理它。通过使用 DOM\
  \ 工具可以解决这个问题：\n\n```javascript\nfunction clear(elem) {\n  elem.innerHTML = '<table>';\n\
  }\n```\n\n#### 创建列表\n\n请注意使用 `textContent` 来分配 `<li>` 的内容。\n\n[在沙盒中打开解决方案。](https://plnkr.co/edit/VVCRkuGp0gYZrp5A6o)\n\
  \n#### 从对象创建树\n\n遍历对象最简单的方法是使用递归。\n\n1. [使用 innerHTML 的解决方案](https://plnkr.co/edit/9FJvvUGJcjYMpvnFe?p=preview)。\n\
  2. [使用 DOM 的解决方案](https://plnkr.co/edit/LQrZWYorXxa9ith96T?preview)。\n\n#### 在树中显示后代\n\
  \n为了添加每个 `<li>`，我们可以修改文本节点 `data`。\n\n[在沙盒中打开解决方案。](https://plnkr.co/edit/qWCjU7JpvahneibLqvae?p=preview)\n\
  \n#### 创建日历\n\n我们将表格为字符串：`\"<table></table>\"`，然后将其赋值给 `innerHTML`。算法如下：\n\n1. 使用\
  \ `<th>` 和工作日名称创建表头。\n2. 创建日期对象 `d = new Date(year, month-1)`。这是该月份的第一个天（考虑到 JavaScript\
  \ 中的月份从 `0` 开始，而不是 `1`）。\n3. 直到月份第一日的 `d.getDay()` 前几个单元格可能是空的。让我们用 `<td>` 填充它们。\n\
  4. 增加 `d` 的日期：`d.setDate(d.getDate()+1)`。如果 `d.getMonth()` 一个月，则将新单元格 `<td>` 添加到日历。如果是星期日，则添加换行\
  \ `“</tr>><<tr>”`。\n5. 如果月份结束但表格行尚未填满，添加空的 `<td>` 到其中，使其成为正方形。\n\n[在沙盒中打开解决方案。](https://plnkr.co/edit/5QTCCEBHsxvRsTscpAQu?p=preview)\n\
  \n#### 使用 setInterval 的彩色时钟\n\n首先，让我们制作 HTML/CSS。\n\n\n\n\n时间的每个组件都可以放在自己的 `<span>`\
  \ 标签中，效果会很好：\n\n```html\n<div id=\"clock\">\n  <span class=\"hour\">hh</span>:<span\
  \ class=\"min\">mm</span>:<span class=\"sec\">ss</span>\n</div>\n```\n\n此外，我们还需要\
  \ CSS 来给它们上色。\n\n`update` 函数将用于刷新时钟，由 `setInterval` 每秒调用一次：\n\n```javascript\nfunction\
  \ update() {\n  let clock = document.getElementById('clock');\n  let date = new\
  \ Date(); // (*)\n  let hours = date.getHours();\n  if (hours < 10) hours = '0'\
  \ + hours;\n  clock.children[0].innerHTML = hours;\n\n  let minutes = date.getMinutes();\n\
  \  if (minutes < 10) minutes = '0' + minutes;\n  clock.children[1].innerHTML = minutes;\n\
  \n  let seconds = date.getSeconds();\n  if (seconds < 10) seconds = '0' + seconds;\n\
  \  clock.children[2].innerHTML = seconds;\n}\n```\n\n在 `(*)` 这一行中，我们每次都会检查当前日期。`setInterval`\
  \ 的调用是不可靠的：它们可能会发生延迟。\n\n管理时钟的函数：\n\n```javascript\nlet timerId;\n\nfunction clockStart()\
  \ { // 运行时钟\n  timerId = setInterval(update, 1000);\n  update(); // (*)\n}\n\nfunction\
  \ clockStop() {\n  clearInterval(timerId);\n  timerId = null;\n}\n```\n\n请注意，`update()`\
  \ 的调用不仅在 `clockStart()` 中被调度，而且在 `(*)` 这一行立即执行。否则，访问者将等到 `setInterval` 第一次执行。在此之前时钟将是空的。\n\
  \n[在沙盒中打开解决方案。](https://plnkr.co/edit/bnnZW1zdtoWynUdVjbmt?p=preview)\n\n跳转到公式在列表中插入\
  \ HTML\n\n当我们需要某处插入一段 HTML 时，`insertAdjacentHTML` 是最佳选择。\n\n解决方案：\n\n```javascript\n\
  one.insertAdjacentHTML('afterend', '<li>2</li><<li>3</li>');\n```\n\n跳转到公式排序表格\n\
  \n解决方案很短，但看起来可能有点复杂，因此我提供了带有详细注释的代码：\n\n```javascript\nlet sortedRows = Array.from(table.rows)\n\
  \  .slice(1)\n  .sort((rowA, rowB) => rowA.cells[0].innerHTML > rowB.cells[0].innerHTML\
  \ ? 1 : -1);\n\ntable.tBodies[0].append(...sortedRows);\n```\n\n1. 获取所有 `<tr>`，例如\
  \ `table.querySelectorAll('tr')`，然后将它们转换为数组，因为我们需要数组方法。\n2. 第一个 TR（`table.rows[0]`）实际上是表格表头，所以我们通过\
  \ `.slice(1)` 获取剩余部分。\n3. 然后通过比较第一个 `<td>`（名称字段）的内容来对它们进行排序。\n4. 现在通过 `.append(...sortedRows)`\
