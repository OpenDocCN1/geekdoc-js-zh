  \n滚动\n\n无限页面\n\n我们可以通过 `document.documentElement.getBoundingClientRect()` 获取整个文档相对于窗口的坐标，`bottom`\
  \ 属性将是文档相对于窗口。\n\n例如，如果 HTML 文档的高度为 `2000px`，那么：\n\n```javascript\n// 当我们在页面顶部时\n\
  // 相对于窗口顶部 = 0\ndocument.documentElement.getBoundingClientRect().top = 0\n\n// 相对于窗口底部\
  \ = 2000\n// 文档很长，所以这可能在窗口底部\ndocument.documentElement.getBoundingClientRect().bottom\
  \ = 2000\n```\n\n如果我们向下滚动 `500px`，那么：\n\n```javascript\n// 文档顶部在窗口上方 500px\ndocument.documentElement.getBoundingClientRect().top\
  \ = -500\n\n// 文档底部更近了 500px\ndocument.documentElement.getBoundingClientRect().bottom\
  \ = 1500\n```\n\n当我们滚动到末尾时，假设窗口高度为 `600px`：\n\n```javascript\n// 文档顶部在窗口上方 1400px\n\
  document.documentElement.getBoundingClientRect().top = -1400\n\n// 文档底部在窗口下方 600px\n\
  document.documentElement.getBoundingClientRect().bottom = 600\n```\n\n请注意 `bottom`\
  \ 无法为 `0`，因为它从未到达窗口顶部。`bottom` 坐标的最低限制是窗口高度（我们假设它为 `600`），我们无法再向上滚动了。\n\n我们可以通过\
  \ `document.documentElement.clientHeight` 获取窗口高度。\n\n对于我们的任务，我们需要知道文档底部距离它没有超过 `100px`\
  \ 时（即：如果高度为 `600`，则为 `600-700px`）。\n\n所以这就是函数：\n\n\n\n\n```javascript\nfunction\
  \ populate() {\n  while(true) {\n    // document bottom\n    let windowRelativeBottom\
  \ = document.documentElement.getBoundingClientRect().bottom;\n\n    // 如果用户滚动得足够远\
  \ (距离底部小于 100px)\n    if (windowRelativeBottom < document.documentElement.clientHeight\
  \ + 100) {\n      // 添加更多数据\n      document.body.insertAdjacentHTML(\"beforeend\"\
  , `<p>Date: ${new Date()}</p>`);\n    }\n  }\n}\n```\n\n[在沙箱中打开解决方案。](https://plnkr.co/edit/XoK6l31aOAXjGrPrFR8a?p=preview)\n\
