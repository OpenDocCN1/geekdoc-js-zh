  \n查看解决方案\n\n## 冒泡与捕获\n\n让我们从一个示例开始。这个处理器被分配给 `div`，但如果你点击任何嵌套标签（如 `em` 或 `code`），它也会运行：\n\
  \n```html\n<div onclick=\"alert('The handler!')\">\n  <em>如果你点击了 EM，DIV 上的处理器就会运行。</em>\n\
  </div>\n```\n\nc25rsh.html\n\n这难道不有一点奇怪吗？为什么实际点击发生在 `em` 上，`div` 上的处理器会运行？\n\n###\
  \ 冒泡\n\n冒泡原理非常简单。**当事件在元素上发生时，它首先运行该元素上的处理器，然后是其父元素，一直向上到达祖先元素。**\n\n假设我们有 3 个嵌套元素\
  \ `FORM > DIV > P`，并且每个元素上都有一个处理器：\n\n<style>\n  body * {\n    margin: 10px;\n \
  \   border: 1px solid blue;\n  }\n</style>\n\n<form onclick=\"alert('form')\">FORM\n\
  \  <div onclick=\"alert('div')\">DIV\n    <p onclick=\"alert('p')\">P</p>\n  </div>\n\
  </form>\n```\n\ne38mxq.html\n\n点击内部的 `p` 首先运行 onclick：\n1. 在 `p` 上。\n2. 然后在外部的 `div`\
  \ 上。\n3. 然后在外部的 `form` 上。\n4. 一直向上直到 `document` 对象。\n\n![](img/event-bubbling.svg)\n\
  \n所以如果我们点击 `p`，我们会看到三个警框：`p` → `div` → `form`。这个过程被称为“冒泡”，因为事件像水泡一样从内部元素向上。*几乎*所有事件都会冒泡。短句中的关键词是“几乎”。例如，`focus`\
  \ 事件不冒泡。我们也会遇到其他例子。但仍然是例外而非规则，大多数事件都会冒泡。\n\n### event.target\n\n父元素上的处理器始终可以获取发生的详细信息。**引发事件的最深嵌套元素被称为目标元素，可以通过\
  \ `event.target` 获取。**\n\n注意与 `this`（=currentTarget）的区别：\n* `event.target` —— 是触发事件的“目标”元素，在冒泡过程中不会改变。\n\
  * `this` —— 是“当前”元素，即正在运行处理器的元素。\n\n例如，如果我们有一个单一处理器 `form.onclick`，那么它可以“捕获”表单内部所有的点击。无论点击发生在哪里，它都会冒泡到\
  \ `form` 并运行处理器。在 `form.onclick` 处理器中：\n* `this`（=currentTarget）是 `form` 元素，因为处理器运行在其上。\n\
  * `event.target` 是表单内被点击的实际元素。\n\n查看：\n[`plnkr.co/edit/yGpiv8mULETT5jjG?p=preview`](https://plnkr.co/edit/yGpiv8mULETT5jjG?p=preview)\n\
  \n`event.target` 可能等于 `this` —— 这发生在直接点击 `form` 元素时。\n\n### 停止冒泡\n\n冒泡事件从目标元素直接向上。通常它一直向上直到\
  \ `html`，然后到达 `document` 对象，某些事件甚至到达 `window`，调用路径上所有的处理器。\n\n但任何处理器都可能认为事件已完全处理并停止冒泡。该方法是\
  \ `event.stopPropagation()`。\n\n例如，在这里如果你点击 `<button>`，`body.onclick` 将不起作用：\n\n\
  ```html\n<body onclick=\"alert(`the bubbling doesn't reach here`)\">\n  <button\
  \ onclick=\"event.stopPropagation()\">Click me</button>\n</body>\n```\n\n5v4dhj.html\n\
  \nevent.stopImmediatePropagation()\n\n如果一个元素在单个事件上有多个事件处理器，那么即使其中一个停止了冒泡，其他的处理器仍然执行。\n\
  \n\n\n\n换句话说，`event.stopPropagation()` 会停止向上冒泡，但在当前元素上的所有其他处理器仍然会执行。\n\n要停止冒泡并防止当前元素上的处理器执行，有一个方法\
  \ `event.stopImmediatePropagation()`。在调用它之后，不再有其他其他处理器执行。\n\n如果没有必要，不要停止冒泡！\n\n\
  冒泡非常方便。如果没有真正的需求，不要停止它：它是显而易见且在架构上经过良好设计的。\n\n有时 `event.stopPropagation()` 会产生隐藏的陷阱，以后可能会变成问题。\n\
  \n例如：\n\n1.  我们创建了一个嵌套菜单。每个子菜单处理其元素的点击事件，并调用 `stopPropagation`，以便外层菜单不会触发。\n2. \
  \ 后来我们决定捕获整个窗口的点击事件，以跟踪用户的行为（人们点击哪里）。某些分析系统就是这样做。通常代码使用 `document.addEventListener('click'…)`\
  \ 来捕获所有点击。\n3.  我们的分析在被 `stopPropagation` 停止点击的区域将无法工作。遗憾的是，我们获得了一个“死区”。\n\n通常没有真的需要阻止冒泡。某些看似需要的任务可以通过其他方式解决。其中一种是使用自定义事件，我们稍后会介绍。此外，我们可以在一个处理器中将数据写入\
  \ `event` 对象并在另一个处理器中读取，这样我们就可以向父处理器传递有关下方处理的信息。\n\n### 捕获 (Capturing)\n\n事件处理的另一个阶段被称为“捕获”。它在实际代码中很少使用，但有时很有用。\n\
  \n标准的 [DOM Events](http://www.w3.org/TR/DOM-Level-3-Events/) 描述了事件传播的三个阶段：\n\n1.\
  \  捕获阶段 – 事件向下到达元素。\n2.  目标阶段 – 事件到达目标元素。\n3.  冒泡阶段 – 事件从元素向上冒泡。\n\n这里是表格内 `<td>`\
  \ 点击事件的示意图，取自规范：\n\n![](img/eventflow.svg)\n\n即：对于对 `<td>` 的点击，事件首先通过祖节点链向下到达元素（捕获阶段），然后到达目标并在那里触发（目标阶段），然后向上移动（冒泡阶段），在路途中调用处理器。\n\
  \n之前我们只讨论过冒泡，因为捕获阶段很少使用。通常它对我们来说是不可见的。\n\n使用 `on<event>` 属性、HTML 属性或使用两个参数的 `addEventListener(event,\
  \ handler)` 添加的处理器对捕获一无所知，它们只在第 2 和第 3 阶段阶段运行。\n\n要在捕获阶段捕获事件，我们需要将处理器的 `capture`\
  \ 选项设置为 `true`：\n\n```\nelem.addEventListener(..., {capture: true})\n// 或者，\"true\"\
  \ 是 {capture: true} 的别名\nelem.addEventListener(..., true)\n```\n\n`capture` 选项有两个可能的值：\n\
  \n*   如果它是 `false`（默认值），则处理器被设置在冒泡阶段。\n*   如果它是 `true`，则处理器被设置在捕获阶段。\n\n注意，虽然形式上有\
  \ 3 个阶段，但第 2 阶段（“目标阶段”：事件到达元素）并没有单独处理：捕获阶段和冒泡阶段的处理器都会在该阶段触发。\n\n让我们看看捕获和冒泡的运行：\n\
  \n```html\n<style>\n  body * {\n    margin: 10px;\n    border: 1px solid blue;\n\
  \  }\n</style>\n\n<form>FORM\n  <div>DIV\n    <p>P</p>\n  </div>\n</form>\n\n<script>\n\
  \  for(let elem of document.querySelectorAll('*')) {\n    elem.addEventListener(\"\
  click\", e => alert(`Capturing: ${elem.tagName}`), true);\n    elem.addEventListener(\"\
  click\", e => alert(`Bubbling: ${elem.tagName}`));\n  }\n</script>\n```\n\n62ezyp.html\n\
  \n该代码在文档中的每个元素上设置了点击处理器，以查看哪些在工作。\n\n如果你点击了 `<p>`，序列是：\n\n1.  `HTML` → `BODY` →\
  \ `FORM` → `DIV`（捕获阶段，第一个监听器）：\n2.  `P`（目标阶段，触发两次，因为我们设置了两个监听器：捕获和冒泡）\n3.  `DIV`\
  \ → `FORM` → `BODY` → `HTML`（冒泡阶段，第二个监听器）。\n\n有一个属性 `event.eventPhase` 告诉我们事件被捕获的阶段编号。但它很少被使用，因为我们通常在处理器中知道它了。\n\
  \n要移除处理器，`removeEventListener` 需要相同的阶段\n\n如果我们使用 `addEventListener(..., true)`，那么在\
  \ `removeEventListener(..., true)` 中也应该提到相同的阶段以正确移除处理器。\n\n#### 同一元素和同一阶段的监听器按其设置顺序执行\n\
  \n如果在同一元素上通过 `addEventListener` 在同一阶段分配了多个事件处理处理器，它们将按照它们被创建的相同顺序执行：\n\n```\nelem.addEventListener(\"\
  click\", e => alert(1)); // 保证第一个触发\nelem.addEventListener(\"click\", e => alert(2));\n\
  ```\n\n## 总结\n\n当事件发生时 – 发生地的最深嵌套元素被标记为“目标元素”（`event.target`）。\n\n*   然后事件从文档根节点向下移动到\
  \ `event.target`，在途中调用通过 `addEventListener(...., true)` 分配的处理器（`true` 是 `true` 的简写）。\n\
  *   然后事件从元素向上冒泡，在途中调用通过 `addEventListener(...., true)` 分配的处理器（`true` 是 `true` 的简写）。\n\
  \n注意，虽然形式上有 3 个阶段，但第 2 阶段（“目标阶段”：事件到达元素）并没有单独处理：捕获阶段和冒泡阶段的处理器都会在该阶段触发。\n\n### 事件委托\
  \ (Event delegation)\n\n捕获和冒泡允许我们实现一种最强大的处理模式之一，即事件委托。\n\n这种思路是，如果我们有很多以相似的方式处理的元素，与其为它们每一个元素分配一个处理器\
  \ – 我们在公共祖先元素上放置单个处理器。\n\n在处理器中，我们获得 `event.target`，查看事件实际发生的位置并进行处理。\n\n\n\n\n\n\
  代码如下：\n\n```javascript\n let selectedTd;\n\ntable.onclick = function(event) {\n\
  \  let target = event.target; // 点击了哪里？\n\n  if (target.tagName != 'TD') return;\
  \ // 不在 TD 上？那我们就不感兴趣了\n\n  highlight(target); // 高亮它\n};\n\nfunction highlight(td)\
  \ {\n  if (selectedTd) { // 如果存在已的高亮，则移除它\n    selectedTd.classList.remove('highlight');\n\
  \  }\n  selectedTd = td;\n  selectedTd.classList.add('highlight'); // 高亮新的 td\n\
  }\n```\n\n这样的代码不在乎表格中有多少单元格。我们可以随时动态添加/删除 `<td>`，高亮功能依然有效。\n\n尽管如此，它也有一个缺点。\n\n\
  点击事件可能没有发生在 `<td>` 上，而是在它的内部。\n\n在我们的情况下，如果查看 HTML 内部结构，可以看到 `<td>` 里面有嵌套的标签，例如\
  \ `<strong>`：\n\n```html\n <td>\n  <strong>Northwest</strong>\n  ...\n</td>\n```\n\
  \n自然地，如果点击发生在那个 `<strong>` 上，它就会成为 `event.target` 的值。\n\n![](img/bagua-bubble.svg)\n\
  \n在 `table.onclick` 处理函数中，我们应该获取这样的 `event.target`，并判断点击是否发生在 `<td>` 内部。\n\n这是改进后的代码：\n\
  \n```javascript\ntable.onclick = function(event) {\n  let td = event.target.closest('td');\
  \ // (1)\n\n  if (!td) return; // (2)\n\n  if (!table.contains(td)) return; // (3)\n\
  \n  highlight(td); // (4)\n};\n```\n\n### 解释：\n\n1. `elem.closest(selector)` 方法返回匹配选择器的最近的祖先元素。在我们的案例中，我们从源元素向上查找\
  \ `<td>`。\n2. 如果 `event.target` 不在任何 `<td>` 内部，则该调用将返回 `null`，我们不需要做任何操作。\n3. 在有嵌套表格的情况下，`event.target`\
  \ 可能是位于当前表格之外的 `<td>`。因此，我们需要检查它是否确实是*我们表格的* `<td>`。\n4. 如果是的话，就对其进行高亮。\n\n结果是，我们获得了一段快速高效的高亮代码，它不在乎表格中总共有多少个\
  \ `<td>`。\n\n### 委托示例：标记中的操作\n\n事件委托还有其他用途。\n\n假设我们想创建一个包含“保存”、“加载”、“搜索”等按钮的菜单。并且有一个带有\
  \ `save`、`load`、`search` 等方法的对象……该如何匹配它们呢？\n\n第一个想法可能是为每个按钮分配一个单独的处理函数。但有一个更优雅的解决方案。我们可以为整个菜单添加一个处理函数，并为按钮添加\
  \ `data-action` 属性，该属性的值包含要调用的方法名：\n\n```html\n <button data-action=\"save\">点击保存</button>\n\
  ```\n\n处理函数读取该属性并执行方法。查看这个运行示例：\n\n```html\n <div id=\"menu\">\n  <button data-action=\"\
  save\">保存</button>\n  <button data-action=\"load\">加载</button>\n  <button data-action=\"\
  search\">搜索</button>\n</div>\n\n<script>\n  class Menu {\n    constructor(elem)\
  \ {\n      this._elem = elem;\n      elem.onclick = this.onClick.bind(this); //\
  \ (*)\n    }\n\n    save() {\n      alert('saving');\n    }\n\n    load() {\n  \
  \    alert('loading');\n    }\n\n    search() {\n      alert('searching');\n   \
  \ }\n\n    onClick(event) {\n      let action = event.target.dataset.action;\n \
  \     if (action) {\n        this[action]();\n      }\n    };\n  }\n\n  new Menu(menu);\n\
  </script>\n```\n\n8b0sw4.html\n\n请注意，`this.onClick` 在 `(*)` 中绑定到了 `this`。这非常重要，否则它内部的\
  \ `this` 将引用 DOM 元素 (`elem`)，而不是 `Menu` 对象，而 `this[action]` 将不是我们想要的结果。\n\n那么，委托在这里带给我们我们什么优势呢？\n\
  \n* 我们不需要编写为每个按钮分配处理函数的代码。只需编写一个方法并将其放入标记中即可。\n* HTML 结构是灵活的，我们可以随时添加/删除按钮。\n\n\
  我们也可以使用类名 `.action-save`、`.action-load`，但使用 `data-action` 属性在语义上更好。我们也可以在 CSS 规则中使用它。\n\
  \n### “行为”模式\n\n我们还可以使用事件委托来*声明式地*为元素添加“行为”，使用特殊的属性和类。\n\n该模式包含两个部分：\n\n1. 我们为元素添加一个自定义属性来描述其行为。\n\
  2. 整个文档范围的处理函数会跟踪事件，如果事件发生在带有属性的元素上——则执行相应操作。\n\n#### 行为：计数器\n\n例如，这里 `data-counter`\
  \ 属性为按钮添加了“点击点击时增加值”的行为：\n\n```html\n计数器：<input type=\"button\" value=\"1\" data-counter>\n\
  再一个计数器：<input type=\"button\" value=\"2\" data-counter>\n\n<script>\n  document.addEventListener('click',\
  \ function(event) {\n    if (event.target.dataset.counter) {\n      event.target.value++;\n\
  \    }\n  });\n</script>\n```\n\n#### 行为：切换器\n\n另一个行为示例。点击 `data-toggle` 将显示/隐藏该元素：\n\
  \n```html\n <button data-toggle=\"subscribe-mail\">切换订阅</button>\n\n<form id=\"\
  subscribe-mail\" hidden>\n  您的邮箱：<input type=\"email\">\n</form>\n\n<script>\n \
  \ document.addEventListener('click', function(event) {\n    let id = event.target.dataset.toggleId;\n\
  \    if (!id) return;\n\n    let elem = document.getElementById(id);\n\n    elem.hidden\
  \ = !elem.hidden;\n  });\n</script>\n```\n\ngdluy8.html\n\n## 总结\n\n事件委托非常酷！它是处理\
  \ DOM 事件最有用的模式之一。\n\n它通常被用于为许多元素添加相同的处理逻辑，但不仅限于此。\n\n算法如下：\n\n1. 在容器上放置单个处理函数。\n\
  2. 在处理函数——检查源元素 `event.target`。\n3. 如果事件发生在我们感兴趣的元素内部，则处理该事件。\n\n优点：\n\n* 简化初始化并节省内存：不需要添加许多处理函数。\n\
  * 代码更少：当添加或删除元素时，不需要添加/移除处理函数。\n* DOM 修改：我们可以使用 `innerHTML` 等方法批量添加/删除元素。\n\n当然，委托也有其局限性：\n\
  \n* 首先，事件必须冒泡。某些事件不冒泡。此外，低级处理函数不应使用 `event.stopPropagation()`。\n* 第二，委托可能会增加 CPU\
  \ 负载，因为容器级处理函数会对容器内任何地方的事件做出反应，无论我们是否对其感兴趣。但通常这种负载是微不足道的，所以我们不考虑它。\n\n\n\n\n\nindex.html.1.17.html\n\
  \n# Requirements\n\n* 仅使用一个事件处理器（使用委托）\n* 点击节点标题外部（空白区域处）不应执行任何操作。\n\n[打开任务的沙盒。](https://plnkr.co/edit/1kpTqxARRfI7aDbxr22I?p=preview)\n\
  \n跳转解决方案\n\n## 可排序表格\n**重要性: 4**\n\n使表格变为可排序：点击 `<th>` 元素应按相应的列进行排序。\n\n每个 `<th>`\
  \ 都有一个属性指定类型，如下所示：\n\n```html\n <table id=\"grid\">\n  <thead>\n    <tr>\n     \
  \ <th data-type=\"number\">Age</th>\n      <th data-type=\"string\">Name</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>5</td>\n      <td>John</td>\n\
  \    </tr>\n    <tr>\n      <td>10</td>\n      <td>Ann</td>\n    </tr>\n    ...\n\
  \  </tbody>\n</table>\n```\n\n在上面的示例中，第一列是数字，第二列是字符串。排序函数应该根据类型处理排序。\n\n仅支持 `\"\
  string\"` 和 `\"number\"` 类型。\n\n工作示例如下：\n\nindex.html.1.18.html\n\nP.S. 表格可能很大，具有任意数量的行和列。\n\
  \n[打开任务的沙盒。](https://plnkr.co/edit/YTNCddGIpYHJjTqwB4lh?p=preview)\n\n跳转解决方案\n\n\
  ## 提示框行为\n**重要性: 5**\n\n编写用于提示框行为的 JS 代码。\n\n当鼠标悬停在带有 `data-tooltip` 的元素上时，提示框应显示在其上方，当离开时则隐藏。\n\
  \n带注释的 HTML 示例：\n\n```html\n<button data-tooltip=\"the tooltip is longer than the\
  \ element\">Short button</button>\n<button data-tooltip=\"HTML<br>tooltip\">One\
  \ more button</button>\n```\n\n工作效果应如下：\n\nindex.html.1.19.html\n\n在此任务中，我们假设所有带有\
  \ `data-tooltip` 的元素内部仅包含文本。目前暂无嵌套标签。\n\n详情：\n\n* 元素与提示框之间的距离应为 `5px`。\n* 如果可能，提示框应相对于元素居中显示。\n\
  * 提示框不应超出窗口边缘。通常它应该位于元素上方，但如果元素位于页面顶部没有空间显示提示框，则显示在元素下方。\n* 提示框内容在 `data-tooltip`\
  \ 属性中给出。它可以是任意 HTML。\n\n你需要这里的两个事件：\n\n* `mouseover` 在指针悬停在元素上时触发。\n* `mouseout`\
  \ 在指针离开元素时触发。\n\n请使用事件委托：在 `document` 上设置两个处理器，以跟踪所有来自带有 `data-tooltip` 元素的“进入”和“离开”操作，并在那里管理提示框。\n\
  \n实现该行为后，即使是不熟悉 JavaScript 的人也可以添加带注释的元素。\n\nP.S. 一时间只能显示一个提示框。\n\n[打开任务的沙盒。](https://plnkr.co/edit/8SL7GyF0ouoHlorhojQt?p=preview)\n\
  \n跳转解决方案\n\n### 浏览器默认操作\n\n许多事件会自动导致浏览器执行的某些操作。\n\n例如：\n\n* 点击链接 – 启动导航到其 URL。\n\
  * 点击表单提交按钮 – 启动向服务器的提交。\n* 在文本上按下鼠标按键并移动 – 选中文本。\n\n如果我们在 JavaScript 中处理了一个事件，我们可能不希望相应的浏览器行为发生，而是希望实现另一种行为。\n\
  \n### 防止浏览器行为\n\n有两种方法告诉浏览器我们不希望它执行操作：\n\n* 主要方法是使用 `event` 对象。有一个方法 `event.preventDefault()`。\n\
  * 如果处理器是使用 `on<event>` 分配的（而不是通过 `addEventListener`），那么返回 `false` 也同样有效。\n\n在下面的\
  \ HTML 中，点击链接不会导致导航，浏览器什么都不会做：\n\n```html\n<a href=\"/\" onclick=\"return false\"\
  >Click here</a>\nor\n<a href=\"/\" onclick=\"event.preventDefault()\">here</a>\n\
  ```\n\n5fkb4h.html\n\n在下一个示例中，我们将使用这种技术创建一个由 JavaScript 驱动的菜单。\n\n#### 从处理器返回 `false`\
  \ 是一个异常\n\n事件处理器的返回值通常会被忽略。\n\n唯一的异常是从使用 `on<event>` 分配的处理器中进行 `return false`。\n\
  \n在所有其他情况下，`return` 值都会被忽略。特别是，返回 `true` 是没有意义的。\n\n##### 示例：菜单\n\n考虑这样的网站菜单：\n\n\
  ```html\n<ul id=\"menu\" class=\"menu\">\n  <li><a href=\"/html\">HTML</a></li>\n\
  \  <li><a href=\"/javascript\">JavaScript</a></li>\n  <li><a href=\"/css\">CSS</a></li>\n\
  </ul>\n```\n\n（注：由于后续文本存在重复内容，已根据要求清理并仅翻译核心逻辑部分）\n\n\n\n\n默认情况下，浏览器在触发 `contextmenu`\
  \ 事件（右键点击）时会显示一个包含标准选项的上下文菜单。我们可以阻止它并显示自己的菜单，如下所示：\n\n```html\n<button>右键点击显示浏览器上下文菜单</button>\n\
  \n<button oncontextmenu=\"alert('Draw our menu'); return false\">\n  右键点击显示我们的自定义菜单\n\
  </button>\n```\n\nbr0cut.html\n\n现在，除了那个上下文菜单，我们还想实现一个全文档范围的上下文菜单。\n\n当右键时，应该显示最近的上下文菜单。\n\
  \n```html\n<p>右键点击此处显示文档上下文菜单</p>\n<button id=\"elem\">右键点击此处显示按钮上下文菜单</button>\n\
  \n<script>\n  elem.oncontextmenu = function(event) {\n    event.preventDefault();\n\
  \    alert(\"Button context menu\");\n  };\n\n  document.oncontextmenu = function(event)\
  \ {\n    event.preventDefault();\n    alert(\"Document context menu\");\n  };\n\
  </script>\n```\n\nfdjpce.html\n\n问题在于，当我们点击 `elem` 时，会得到两个菜单：按钮级别的菜单和（由于事件冒泡）文档级别的菜单。\n\
  \n如何修复它？解决方案之一是这样想：“当我们在按钮处理器中处理右键点击时，停止它的冒泡”，并使用 `event.stopPropagation()`：\n\n\
  ```html\n<p>右键点击显示文档菜单</p>\n<button id=\"elem\">右键点击显示按钮菜单（已用 event.stopPropagation\
  \ 修复）</button>\n\n<script>\n  elem.oncontextmenu = function(event) {\n    event.preventDefault();\n\
  \    event.stopPropagation();\n    alert(\"Button context menu\");\n  };\n\n  document.oncontextmenu\
  \ = function(event) {\n    event.preventDefault();\n    alert(\"Document context\
  \ menu\");\n  };\n</script>\n```\n\ng3fuxi.html\n\n现在按钮级菜单按预期工作了。但代价是巨大的。我们永远地拒绝让任何外部代码获取右键点击的信息，包括收集统计数据的计数器等。这非常不明智。\n\
  \n另一种替代方案是在 `document` 处理器中检查默认操作是否被阻止？如果是的话，说明事件已被处理，我们不需要对它做出反应。\n\n```html\n\
  <p>右键点击显示文档菜单（增加了对 event.defaultPrevented 的检查）</p>\n<button id=\"elem\">右键点击显示按钮菜单</button>\n\
  \n<script>\n  elem.oncontextmenu = function(event) {\n    event.preventDefault();\n\
  \    alert(\"Button context menu\");\n  };\n\n  document.oncontextmenu = function(event)\
  \ {\n    if (event.defaultPrevented) return;\n\n    event.preventDefault();\n  \
  \  alert(\"Document context menu\");\n  };\n</script>\n```\n\nbi2j48.html\n\n现在一切都正常工作。如果我们有嵌套元素，且每个元素都有自己的上下文菜单，那也可以工作。只需确保在每个\
  \ `contextmenu` 处理器中检查 `event.defaultPrevented` 即可。\n\n### `event.stopPropagation()`\
  \ 和 `event.preventDefault()`\n\n正如我们清楚看到的，`event.stopPropagation()` 和 `event.preventDefault()`（也称为\
  \ `return false`）是两个不同的东西。它们之间没有联系。\n\n### 嵌套上下文菜单架构\n\n还有实现嵌套上下文菜单的替代方法。其中之一是拥有一个全局对象，包含一个\
  \ `document.oncontextmenu` 的处理器，以及允许我们在其中存储其他处理器的方法。\n\n该对象将捕获任何右键点击，遍历存储的处理器并运行相应的一个。\n\
  \n但这样每个想要上下文菜单的代码都应该知道该对象，并使用它的帮助，而不是自己的 `contextmenu` 处理器。\n\n## 总结\n\n有很多默认的浏览器行为：\n\
  \n*   `mousedown` – 开始选择（移动鼠标进行选择）。\n*   `<input type=\"checkbox\">` 上的 `click`\
  \ – 选中/取消选中 `input`。\n*   `submit` – 点击 `<input type=\"submit\">` 或在表单字段内按 `Enter`\
  \ 键会触发此事件，浏览器随后提交表单。\n*   `keydown` – 按下键可能会向字段中添加字符或其他操作。\n*   `contextmenu` –\
  \ 在右键点击时发生事件，其动作是显示浏览器上下文菜单。\n*   ……还有更多……\n\n如果我们想通过 JavaScript 专门地处理事件，就可以阻止所有的默认行为。\n\
  \n要阻止默认行为——使用 `event.preventDefault()` 或 `return false`。第二种方法适用于赋值给 `on<event>`\
  \ 的处理器。\n\n`addEventListener` 的 `passive: true` 选项告诉浏览器该操作不会被阻止。这对于某些移动端事件有用，如 `touchstart`\
  \ 和 `touchmove`，可以告诉浏览器不应等待所有处理器执行完毕再进行滚动。\n\n如果默认操作被阻止，`event.defaultPrevented`\
  \ 的值将变为 `true`，否则为 `false`。\n\n### 保持语义化，不要滥用\n\n从技术上讲，通过阻止默认行为并添加 JavaScript，我们可以自定义任何元素的行为。例如，我们可以让链接\
  \ `<a>` 像按钮一样，让按钮 `<button>` 行为像链接（重定向到另一个 URL 等）。\n\n但我们通常应该保持语义含义。\n\n#### 为什么\
  \ \"return false\" 不起作用\n\n为什么 \"return false\" 不起作用？\n\n```html\n<script>\n  function\
  \ handler() {\n    alert( \"...\"\n  }\n</script>\n\n<a href=\"https://w3.org\"\
  \ onclick=\"handler()\">浏览器将跳转到 w3.org</a>\n```\n\n42bk.html\n\n点击时浏览器会跳转，但我们不希望这样。如何修复？\n\
  \n解决方案\n\n### 在元素中拦截链接\n\n在 `id=\"contents\"` 的元素中拦截链接，询问用户是否真的要离开。如果不跳转。如下：\n\n\
  [index.html.21.html]\n\n详情：\n\n*   元素内部 HTML 可能会被加载或重新生成，因此无法为所有链接设置处理器。使用事件委托。\n\
  *   内容可能包含嵌套标签。链接内部，如 `<a><i></i></a>`。\n\n[打开沙盒](https://plnkr.com/edit/JSysOJcSfXj4gEYe)\n\
  \n解决方案\n\n### 图片库\n\n图片库：\n\n创建一个图片库，通过点击缩略图来切换主图。如下：\n\n[index.html.22.html]\n\n\
  备注：使用事件委托。\n\n[打开沙盒](https://plnkr.com/edit/mT7xaupEGUywHIAgx05o)\n\n解决方案\n\n###\
  \ 分发自定义事件\n\n我们不仅可以分配处理器，还可以从 JavaScript 生成事件。\n\n自定义事件可以用于创建“图形组件”。例如，我们自己的 JS\
  \ 菜单的根元素可以触发事件，告知菜单的情况：`open`（菜单打开）、`select`（项目被选中）等。其他代码可以监听这些事件并观察菜单正在发生什么。\n\n\
  我们不仅可以为自己的目的发明完全完全的事件，还可以生成内置事件，例如 `click`、`mousedown` 等。这对于自动化测试很有帮助。\n\n#### Event\
  \ 构造函数\n\n内置事件类形成了一个层次结构，类似于 DOM 元素类。根节点是 [Event](http://www.w3.org/TR/dom/#event)\
  \ 类。\n\n我们可以这样创建 `Event` 对象：\n\n```javascript\nlet event = new Event(type[, options]);\n\
  ```\n\n参数：\n\n*   *type* – 事件类型，字符串，如 `\"click\"` 或我们自定义的如 `\"my-event\"`。\n\n\n\
  \n\n* `options` – 包含两个可选属性的对象：\n    * `bubbles: true/false` – 如果为 `true`，则事件会冒泡。\n\
  \    * `cancelable: true/false` – 如果为 `true`，则可以“默认行为”。稍后我们将看到这对于自定义事件意味着什么。\n\n\
  默认情况下，两者均为 `false`：`{bubbles: false, cancelable: false}`。\n\n## dispatchEvent\n\n\
  创建事件对象后，我们应该使用调用 `elem.dispatchEvent(event)` 在元素上“运行”它。\n\n然后，处理器会像处理普通浏览器事件一样对其做出反应。如果事件在创建时设置了\
  \ `bubbles` 标志，它就会冒泡。\n\n在下面的示例中，`click` 事件是在 JavaScript 中触发的。处理器的工作方式与点击按钮一样：\n\
  \n```\n<button id=\"elem\" onclick=\"alert('Click!');\">Autoclick</button>\n\n<script>\n\
  \  let event = new Event(\"click\");\n  elem.dispatchEvent(event);\n</script>\n\
  ```\n\n### event.isTrusted\n\n有一种方法可以区分“真实”的用户事件和脚本生成的事件。\n\n对于来自真实用户操作的事件，属性 `event.isTrusted`\
  \ 为 `true`；对于脚本生成的事件，为 `false`。\n\n### 冒泡示例\n\n我们可以创建一个名为 `\"hello\"` 的冒泡事件，并在 `document`\
  \ 上捕获它。\n\n我们只需要将 `bubbles` 设置为 `true`：\n\n``````\n<h1 id=\"elem\">Hello from the\
  \ script!</h1>\n\n<script>\n  // 在 document 上捕获...\n  document.addEventListener(\"\
  hello\", function(event) { // (1)\n    alert(\"Hello from \" + event.target.tagName);\
  \ // Hello from H1\n  });\n\n  // ...在 elem 上派发！\n  let event = new Event(\"hello\"\
  , {bubbles: true}); // (2)\n  elem.dispatchEvent(event);\n\n  // document 上的处理器将激活并显示消息。\n\
  \n</script>\n```\n\n注意：\n1. 我们应该为自定义事件使用 `addEventListener`，因为 `on<event>` 只存在于内置事件，`document.onhello`\
  \ 是不起的。\n2. 必须设置 `bubbles:true`，否则事件不会向上冒泡。\n\n内置事件（`click`）和自定义事件（`hello`）的冒泡机制是相同的。还有捕获和冒泡阶段。\n\
  \n### MouseEvent, KeyboardEvent 以及其他\n\n以下是来自 [UI Event 规范](https://www.w3.org/TR/uievents)\
  \ 的 UI 事件类简列表：\n* `UIEvent`\n* `FocusEvent`\n* `MouseEvent`\n* `WheelEvent`\n* `KeyboardEvent`\n\
  * …\n\n如果我们想创建此类事件，应该使用它们而不是 `new Event`。例如，`new MouseEvent(\"click\")`。\n\n正确的构造函数允许为该类型的事件指定标准属性。\n\
  \n例如鼠标事件的 `clientX/clientY`：\n\n```\n let event = new MouseEvent(\"click\", {\n\
  \  bubbles: true,\n  cancelable: true,\n  clientX: 100,\n  clientY: 100\n});\n\n\
  alert(event.clientX); // 100\n```\n\n请注意：通用的 `Event` 构造函数不支持这些。\n\n让我们尝试：\n\n```\n\
  \ let event = new Event(\"click\", {\n  bubbles: true, // 仅支持冒泡和取消\n  cancelable:\
  \ true, // 在 Event 构造函数内部有效\n  clientX: 100,\n  clientY: 100\n});\n\nalert(event.clientX);\
  \ // undefined，未知属性被忽略了！\n```\n\n技术上，我们可以通过在创建后直接赋值 `event.clientX=100` 来绕过这一点。所以这只是方便性和遵循规则的问题。浏览器生成的事件始终具有正确的类型。\n\
  \n不同 UI 事件的属性完整列表在规范中，例如 [MouseEvent](https://www.w3.org/TR/uievents/#mouseevent)。\n\
  \n### 自定义事件\n\n对于我们自己的、全新的事件类型（如 `\"hello\"`），我们应该使用 `new CustomEvent`。技术上，[CustomEvent](https://dom.spec.whatwg.org/#customevent)\
  \ 与 `Event` 相同，但有一个例外。\n\n在第二个参数（对象）中，我们可以添加一个额外的属性 `detail`，用于随事件传递的任何自定义信息。\n\n\
  例如：\n\n```\n <h1 id=\"elem\">Hello for John!</h1>\n\n<script>\n  // 额外的细节随事件传递给处理器\n\
  \  elem.addEventListener(\"hello\", function(event) {\n    alert(event.detail.name);\n\
  \  });\n\n  elem.dispatchEvent(new CustomEvent(\"hello\", {\n    detail: { name:\
  \ \"John\" }\n  }));\n</script>\n```\n\n`detail` 属性可以包含任何数据。技术上我们可以不需要它，因为我们可以在创建普通的\
  \ `new Event` 对象后向其内部赋值任何属性。但 `CustomEvent` 提供了这个特殊的 `detail` 字段，以避免与其他事件属性发生冲突。\n\
  \n此外，事件类描述了它是“什么种的事件”，如果事件是自定义的，那么我们应该使用 `CustomEvent` 以便明确它是什么。\n\n### event.preventDefault()\n\
  \n许多浏览器事件都有“默认行为”，例如导航到链接、开始选择等。\n\n对于新的自定义事件，肯定没有默认的浏览器行为，但派发的代码可以使用 `event.preventDefault()`。\n\
  \n\n\n\n现在 `dispatchEvent` 在当前代码执行完成后才会异步运行，包括 `mouse.onclick`，因此事件处理器是完全分离的。\n\n\
  输出顺序变为：1 → 2 → nested。\n\n## 总结\n\n要从代码生成事件，我们首先需要创建一个事件对象。\n\n通用的 `Event(name,\
  \ options)` 构造函数接受任意事件名称和一个包含两个属性的 `options` 对象：\n\n* 如果 `bubbles: true`，则事件应该冒泡。\n\
  * 如果 `cancelable: true`，则 `event.preventDefault()` 将有效。\n\n原生事件的其他构造函数（如 `MouseEvent`、`KeyboardEvent`\
  \ 等）接受特定于该事件类型的属性。例如，鼠标事件的 `clientX`。\n\n对于自定义事件，我们应该使用 `CustomEvent` 构造函数。它有一个名为\
  \ `detail` 的额外选项，我们应该将特定事件的数据赋值给它。然后所有处理器都可以通过 `event.detail` 访问它。\n\n尽管在技术上可以生成\
  \ `click` 或 `keydown` 等浏览器事件，但我们应该非常谨慎地使用。\n\n我们不应该生成浏览器事件，因为这是运行处理器的一种不规范的方法。在大多数情况下，这是一种糟糕的架构。\n\
  \n原生事件可能会被生成：\n\n* 作为一种粗陋的技巧（dirty hack），让第三方库以所需的方式工作，如果它们没有提供其他交互手段。\n* 用于自动化测试，在脚本中“点击按钮”并查看界面是否正确响应。\n\
  \n带有自定义名称的自定义事件通常是为了架构目的而生成的，用于信号菜单、滑块、轮播图等内部发生了什么。\n\n## UI 事件\n\n这里我们涵盖了大多数重要的用户界面事件以及如何处理它们。\n\
  \n### 鼠标事件基础\n\n在本章中，我们将深入了解鼠标事件及其属性的更多细节。\n\n请注意：此类事件可能不仅来自“鼠标设备”，还来自其他设备（如手机和平板电脑），在这些设备上为了兼容性是模拟的。\n\
  \n#### 鼠标事件类型\n\n我们可以将鼠标事件分为两类：“简单”和“复杂”\n\n##### 简单事件\n\n最常用的简单事件是：\n\n* `mousedown/mouseup`\n\
  \  在元素上点击/释放鼠标按键。\n* `mouseover/mouseout`\n  鼠标指针进入/离开元素。\n* `mousemove`\n  鼠标在元素上的任何移动都会触发该事件。\n\
  * `contextmenu`\n  当尝试打开上下文菜单时触发。在最情况下，这是在按下右鼠标键时发生的。尽管还有其他打开上下文菜单的方法（例如使用特殊的键盘键），所以它并不完全是鼠标事件。\n\
  \n……还有其他几种事件类型，我们稍后会介绍。\n\n##### 复杂事件\n\n* `click`\n  如果在同一个元素上使用了左鼠标键，则在 `mousedown`\
  \ 之后、`mouseup` 之后触发此事件。\n* `dblclick`\n  在元素上双击后触发。\n\n复杂事件由简单事件组成，因此理论上我们可以没有它们。但它们确实存在，这是件好事，因为它们很方便。\n\
  \n##### 事件顺序\n\n一个动作可能会触发多个事件。\n\n例如，点击首先在按下按钮时触发 `mousedown`，然后在释放按钮时触发 `mouseup`\
  \ 和 `click`。\n\n在单个动作启动多个事件的情况下，它们的顺序是固定的。也就是说，处理器按 `mousedown` → `mouseup` → `click`\
  \ 的顺序被调用。\n\n#### 获取按键：which\n\n与点击相关的事件始终具有 `which` 属性，允许获取精确的鼠标按键。\n\n它不用于 `click`\
  \ 和 `contextmenu` 事件，因为前者只发生在左键点击上，后者只发生在右键点击上。\n\n但如果我们跟踪 `mousedown` 和 `mouseup`，那么我们需要它，因为这些事件在任何按键上都会触发，所以\
  \ `which` 允许区分“右键按下”和“左键按下”。\n\n有三种可能的值：\n\n* `event.which == 1` – 左键\n* `event.which\
  \ == 2` – 中键\n* `event.which == 3` – 右键\n\n中键目前有些奇特，而且很少被使用。\n\n#### 修饰键：shift,\
  \ alt, ctrl 和 meta\n\n所有的鼠标事件都包含关于按下的修饰键的信息。\n\n事件属性：\n\n* `shiftKey`: `Shift`\n\
  * `altKey`: `Alt`（Mac 上为 `Opt`）\n* `ctrlKey`: `Ctrl`\n* `metaKey`: Mac 上为 `Cmd`\n\
  \n如果在事件期间按了相应的键，则它们为 `true`。\n\n例如，下面的按钮仅在 `Alt+Shift`+click 时有效：\n\n```\n<button\
  \ id=\"button\">Alt+Shift+Click on me!</button>\n\n<script>\n  button.onclick =\
  \ function(event) {\n    if (event.altKey && event.shiftKey) {\n      alert('Hooray!');\n\
  \    }\n  };\n</script>\n```\n\n84y059.html\n\n注意：在 Mac 上通常是 `Cmd` 而不是 `Ctrl`。\n\
  \n在 Windows 和 Linux 上有修饰键 `Alt`、`Shift` 和 `Ctrl`。在 Mac 上还有一个：`Cmd`，对应属性 `metaKey`。\n\
  \n在大多数应用程序中，当 Windows/Linux 使用 `Ctrl` 时，Mac 使用 `Cmd`。\n\n也就是说：Windows 用户按下 `Ctrl+Enter`\
  \ 或 `Ctrl+A` 的地方，Mac 用户会按下 `Cmd+Enter` 或 `Cmd+A`，以此此类推。\n\n\n\n\n\n```html\n <div\
  \ oncopy=\"alert('Copying forbidden!');return false\">\n  Dear user,\n  The copying\
  \ is forbidden for you.\n  If you know JS or HTML, then you can get everything from\
  \ the page source though.\n</div\n```\n\nghshrz.html\n\n如果你尝试复制 `<div>` 中的文本，将是起作用的，因为默认操作\
  \ `oncopy` 被阻止了。\n\n当然，用户可以访问页面的 HTML 源代码，并从那里获取内容，但并不是每个人都知道如何操作。\n\n## 总结\n\n\
  鼠标事件具有以下属性：\n\n- 按钮：`which`。\n- 修饰键（按下时为 `true`）：`altKey`, `ctrlKey`, `shiftKey`\
  \ 和 `metaKey` (Mac)。\n    - 如果你想处理 `Ctrl`，请不要忘记 Mac 用户，他们通常使用 `Cmd`，所以最好检查 `if (e.metaKey\
  \ || e.ctrlKey)`。\n- 相对于窗口的坐标：`clientX/clientY`。\n- 相对于文档坐标：`pageX/pageY`。\n\n`mousedown`\
  \ 的默认浏览器行为是文本选择，如果这对界面不友好，那么就应该阻止它。\n\n在下一章中，我们将看到更多关于指针移动后续事件的细节，以及如何追踪其下的元素变化。\n\
  \n## 任务\n\n可选择列表重要性：5\n\n创建一个元素是可选择的列表，就像文件管理器中的那样。\n\n- 点击列表元素只会选中该元素（添加类 `.selected`），并取消所有其他元素的选中。\n\
  - 如果在按住 `Ctrl`（Mac 为 `Cmd`）时进行点击，则元素上的选中状态会切换，但其他元素不会被修改。\n\n演示代码：\n\nindex.html.1.23.html\n\
  \nP.S. 对于此任务，我们可以假设列表项仅包含文本。没有嵌套标签。\n\nP.P.S. 在点击点击时阻止浏览器的原生文本选择。\n\n[点击此链接打开沙盒进行任务。](https://plnkr.co/edit/ISXVbwGPPZm9nufSBs7j?p=preview)\n\
  \n查看解决方案\n\n## 移动鼠标：mouseover/out, mouseenter/leave\n\n让我们深入了解关于鼠标在元素之间移动时发生的事件的细节。\n\
  \n### 事件 mouseover/mouseout, 以及 relatedTarget\n\n`mouseover` 事件在鼠标指针进入一个元素时触发，而\
  \ `mouseout` 则在指针离开时触发。\n\n![](img/mouseover-mouseout.svg)\n\n这些事件是特殊的，因为它们拥有 `relatedTarget`\
  \ 属性。该属性补充了 `target`。当鼠标离开一个元素进入另一个元素时，其中一个变为 `target`，另一个变为 `relatedTarget`。\n\n\
  对于 `mouseover`：\n\n- `event.target` – 鼠标进入的元素。\n- `event.relatedTarget` – 鼠标来源的元素（`relatedTarget`\
  \ → `target`）。\n\n对于 `mouseout`，情况则反过来：\n\n- `event.target` – 鼠标离开的元素。\n- `event.relatedTarget`\
  \ – 鼠标离开后进入的新元素（`target` → `relatedTarget`）。\n\n`relatedTarget` 可以为 `null`。\n\n\
  `relatedTarget` 属性可以为 `null`。\n\n这是正常的，意味着鼠标不是来自另一个元素，而是来自窗口外部。或者它离开了窗口。\n\n在代码中使用\
  \ `event.relatedTarget` 时，我们应该记住这种可能性。如果我们访问 `event.relatedTarget.tagName`，将会报错。\n\
  \n### 跳过元素\n\n`mousemove` 事件在鼠标移动时触发。但并不意味着每一个像素都会导致一个事件。\n\n浏览器会定期检查鼠标位置。如果发现有变化，就会触发事件。\n\
  \n这意味着，如果访问者移动鼠标非常快，某些 DOM 元素可能会被跳过：\n\n![](img/mouseover-mouseout-over-elems.svg)\n\
  \n如果鼠标如上图所示从 `#FROM` 元素快速移动到 `#TO`，那么中间的 `<div>` 元素（或部分）可能会被跳过。`mouseout` 事件可能会在\
  \ `#FROM` 上触发，然后立即在 `#TO` 上触发 `mouseover`。\n\n这对性能是有好处的，因为可能有很多中间元素。我们并不想处理每一个元素的进入和离开。\n\
  \n另一方面，我们应该记住，鼠标指针并没有“访问”沿途中所有的元素。它可以发生“跳跃”。\n\n特别是，指针可能会从窗口外直接跳转到页面中间。在这种情况下，`relatedTarget`\
  \ 是 `null`，因为它是来自“无”：\n\n![](img/mouseover-mouseout-from-outside.svg)\n\n如果触发了 `mouseover`，一定会有\
  \ `mouseout`\n\n在鼠标快速移动的情况下，中间的元素可能会被忽略，但有一点我们可以确定：如果指针“正式”进入了一个元素（生成了 `mouseover`\
  \ 事件），那么在离开它时我们总是得到 `mouseout`。\n\n### 进入子元素时触发 Mouseout\n\n`mouseout` 的一个重要特性——当指针从一个元素移动到它的后代时会触发，例如在该\
  \ HTML 中从 `#parent` 移动到 `#child`：\n\n```html\n<div id=\"parent\">\n  <div id=\"\
  child\">...</div>\n</div>\n```\n\n如果我们在 `#parent` 上然后深度移动到 `#child`，会在 `#parent`\
  \ 上触发 `mouseout`。\n\n![](img/mouseover-to-child.svg)\n\n这看起来可能很奇怪，但很容易解释。如果在离开父元素时有某些操作（例如在\
  \ `parent.mouseout` 中运行动画），当指针只是向下移动时我们通常不希望执行它。\n\n为了避免这种情况，我们可以在处理器中检查 `relatedTarget`，如果鼠标仍在元素内部，则忽略该事件。\n\
  \n或者，我们可以使用其他事件：`mouseenter` 和 `mouseleave`，我们现在将介绍它们，因为它们没有这些问题。\n\n### 事件 mouseenter\
  \ 和 mouseleave\n\n`mouseenter/mouseleave` 类似于 `mouseover/mouseout`。它们在指针进入/离开元素时触发。\n\
  \n但有两个重要的区别：\n\n1.  元素内部（即元素与其后代之间）的切换不会被计入。\n2.  `mouseenter/mouseleave` 事件不冒泡。\n\
  \n这些事件极其简单。\n\n当指针进入元素时——`mouseenter` 触发。指针在元素或其后代内部的位置并不重要。\n\n当指针离开元素时——`mouseleave`\
  \ 触发。\n\n### 事件委托\n\n`mouseenter/mouseleave` 非常简单易于使用。但它们不冒泡。因此我们无法对它们使用事件委托。\n\n\
  假设我们要处理表格单元格的鼠标进入/离开事件。那里有数百个单元格。\n\n自然的解决方案将是——在 `<table>` 上设置处理器并在那里处理事件。但 `mouseenter/mouseleave`\
  \ 不冒泡。所以，如果在 `<td>` 上发生了此类事件，那么只有该 `<td>` 上的处理器才能捕获到它。\n\n\n\n\n\n```javascript\n\
  // let's highlight an element under the pointer\ntable.onmouseover = function(event)\
  \ {\n  let target = event.target;\n  target.style.background = 'pink';\n};\n\ntable.onmouseout\
  \ = function(event) {\n  let target = event.target;\n  target.style.background =\
  \ '';\n};\n```\n\n在我们的案例中，想要处理表格单元格 `<td>` 之间的切换：进入单元格和离开单元格。其他的切换（例如单元格内部或在任何单元格之外）我们并不感兴趣。让我们把它们过滤掉。\n\
  \n我们可以采取以下操作：\n\n*   用一个变量记录当前被高亮的 `<td>`，我们称其为 `currentElem`。\n\n*   在 `mouseover`\
  \ 上 –如果我们仍然在当前 `<td>` 内部，则忽略该事件。\n\n*   在 `mouseout` 上 –如果我们没有离开当前 `<td>`，则忽略它。\n\
  \n这里是一个考虑了所有可能情况的代码示例：\n\n```javascript\n// 当前鼠标下方的 <td>（如果有的话）\nlet currentElem\
  \ = null;\n\ntable.onmouseover = function(event) {\n  // 在进入新元素之前，鼠标总是会离开上一个元素\n\
  \  // 如果 currentElem 已设置，说明我们没有离开之前的 <td>，\n  // 那是该元素内部的 mouseover，忽略该事件\n  if\
  \ (currentElem) return;\n\n  let target = event.target.closest('td');\n\n  // 我们没有移动到\
  \ <td> 内部 - 忽略\n  if (!target) return;\n\n  // 移动到了 <td>，但在我们的表格之外（在嵌套表格的情况下可能发生）\n\
  \  // 忽略\n  if (!table.contains(target)) return;\n\n  // 太棒了！进入了一个新的 <td>\n  currentElem\
  \ = target;\n  onEnter(currentElem);\n};\n\ntable.onmouseout = function(event) {\n\
  \  // 如果现在我们不在任何 <td> 内部，则忽略该事件\n  // 这可能是在表格内部移动，但离开了 <td>，\n  // 例如从 <tr> 移动到另一个\
  \ <tr>\n  if (!currentElem) return;\n\n  // 我们正在离开该元素 – 去到哪里了？也许是某个后代元素？\n  let\
  \ relatedTarget = event.relatedTarget;\n\n  while (relatedTarget) {\n    // 向上遍历父级链\
  \ – 如果我们仍然在 currentElem 内部\n    // 那就是内部切换 – 忽略它\n    if (relatedTarget == currentElem)\
  \ return;\n\n    relatedTarget = relatedTarget.parentNode;\n  }\n\n  // 我们真的离开了\
  \ <td>。\n  onLeave(currentElem);\n  currentElem = null;\n};\n\n// 处理进入/离开元素的任何函数\n\
  function onEnter(elem) {\n  elem.style.background = 'pink';\n\n  // 在 textarea 中显示\n\
  \  text.value += `over -> ${currentElem.tagName}.${currentElem.className}\\n`;\n\
  \  text.scrollTop = 1e6;\n}\n\nfunction onLeave(elem) {\n  elem.style.background\
  \ = '';\n\n  // 在 textarea 中显示\n  text.value += `out <- ${elem.tagName}.${elem.className}\\\
  n`;\n  text.scrollTop = 1e6;\n}\n```\n\n再次强调，重要的特性是：\n\n1.  它使用事件委托来处理表格内任何 `<td>`\
  \ 的进入/离开。所以它依赖于 `mouseover/out`，而不是不冒泡因此无法进行委托的 `mouseenter/leave`。\n\n2.  额外的事件（例如在\
  \ `<td>` 的后代元素之间移动）被过滤掉了，因此只有当指针离开或进入整个 `<td>` 时，`onEnter/Leave` 才会运行。\n\n## 总结\n\
  \n我们涵盖了事件 `mouseover`、`mouseout`、`mousemove`、`mouseenter` 和 `mouseleave`。\n\n这些点需要注意：\n\
  \n*   快速移动鼠标可能会跳过中间元素。\n\n*   事件 `mouseover/out` 具有有一个额外的属性：`relatedTarget`。它是我们离开/进入的元素，与\
  \ `target` 互补。\n\n即使当我们从父元素移动到子元素时，`mouseover/out` 事件也会触发。浏览器假设鼠标一次只能位于一个元素上 ——\
  \ 最深的那一个。\n\n`mouseenter/leave` 事件在这一方面不同：它们仅在鼠标整体进入和离开元素时触发。此外，它们是不冒泡的。\n\n## 任务\n\
  \n改进提示框行为，重要性：5\n\n编写 JavaScript，在带有 `data-tooltip` 属性的元素上显示提示框。该属性的值应成为提示框文本。\n\
  \n这类似于任务 提示框行为，但这里被标记的元素可以是嵌套的。显示最深嵌套的提示框。\n\n同一时间只能显示一个提示框。\n\n例如：\n\n```html\n\
  <div data-tooltip=\"这里 – 是房屋内部\" id=\"house\">\n  <div data-tooltip=\"这里 – 是屋顶\"\
  \ id=\"roof\"></</div>\n  ...\n  <a href=\"https://en.wikipedia.org/wiki/The_Three_Little_Pigs\"\
  \ data-tooltip=\"继续阅读…\">悬停在我身上</a>\n</div>\n```\n\niframe 中的结果为：\n\nindex.html.1.24.html\n\
  \n[打开该任务的沙箱。](https://plnkr.co/edit/1soSbaeZlyJ2nc)\n\n\n\n\n\n```javascript\nball.onmousedown\
  \ = function(event) { // (1) 开始进程\n\n  // (2) 准备移动: 设置绝对定位并通过 z-index 置顶层\n  ball.style.position\
  \ = 'absolute';\n  ball.style.zIndex = 1000;\n  // 将其移出任何当前父元素直接放入 body\n  // 以便使其相对于\
  \ body 进行定位\n  document.body.append(ball);\n  // ...并将该绝对定位的球放在指针下\n\n  moveAt(event.pageX,\
  \ event.pageY);\n\n  // 将球居中显示在 (pageX, pageY) 坐标处\n  function moveAt(pageX, pageY)\
  \ {\n    ball.style.left = pageX - ball.offsetWidth / 2 + 'px';\n    ball.style.top\
  \ = pageY - ball.offsetHeight / 2 + 'px';\n  }\n\n  function onMouseMove(event)\
  \ {\n    moveAt(event.pageX, event.pageY);\n  }\n\n  // (3) 在 mousemove 时移动球\n \
  \ document.addEventListener('mousemove', onMouseMove);\n\n  // (4) 松开球，移除不需要的处理器\n\
  \  ball.onmouseup = function() {\n    document.removeEventListener('mousemove',\
  \ onMouseMove);\n    ball.onmouseup = null;\n  };\n\n};\n```\n\n如果我们运行这段代码，会注意到一些奇怪的现象。在拖放开始时，球“分叉”了：我们开始拖拽它的“克隆体”。\n\
  \n这是因为浏览器自带了一套针对图像和其他某些元素的拖放机制，它会自动运行并与我们的逻辑冲突。\n\n要禁用它：\n\n```javascript\nball.ondragstart\
  \ = function() {\n  return false;\n};\n```\n\n现在一切都正常了。\n\n另一个重要方面是——我们在 `document`\
  \ 上监听 `mousemove`，而不是在 `ball` 上。初看之下，鼠标似乎一直在球的上方，我们可以把 `mousemove` 绑定在它上。\n\n但正如我们记得的，`mousemove`\
  \ 触发频繁，但并不是每个像素都会触发。因此，在快速移动后，指针可能会从球跳到文档中间的某个地方（甚至是窗口之外）。\n\n所以我们应该在 `document`\
  \ 上进行监听以捕获它。\n\n### 正确定位\n\n在上面的示例中，球总是移动到使其中心位于指针正下方：\n\n```javascript\nball.style.left\
  \ = pageX - ball.offsetWidth / 2 + 'px';\nball.style.top = pageY - ball.offsetHeight\
  \ / 2 + 'px';\n```\n\n这虽然不错，但有一个副作用。为了启动拖放，我们可以在球的任何地方点击 `mousedown`。但如果从边缘“抓取”它，球会突然“跳动”到鼠标指针正下方并居中。\n\
  \n如果我们能保持元素相对于指针的初始偏移量，效果会更好。\n\n例如，如果我们从球的边缘开始拖拽，那么指针在拖拽过程中应该一直保持在边缘上方。\n\n![](img/ball_shift.svg)\n\
  \n让我们更新算法：\n\n1.  当访问者按下按钮（`mousedown`）时——记住指针到球左上角的距离，并存储在变量 `shiftX/shiftY` 中。我们在拖拽期间保持该距离。\n\
  \n    为了获取这些偏移量，我们可以相减坐标：\n\n    ```javascript\n    // onmousedown\n    let shiftX\
  \ = event.clientX - ball.getBoundingClientRect().left;\n    let shiftY = event.clientY\
  \ - ball.getBoundingClientRect().top;\n    ```\n\n2.  然后在拖拽期间，我们让球相对于指针以相同的偏移量进行定位，如下：\n\
  \n    ```javascript\n     // onmousemove\n    // ball 的位置为:absolute\n    ball.style.left\
  \ = event.pageX - shiftX + 'px';\n    ball.style.top = event.pageY - shiftY + 'px';\n\
  \    ```\n\n带有更好定位的最终代码：\n\n```javascript\n ball.onmousedown = function(event) {\n\
  \n  let shiftX = event.clientX - ball.getBoundingClientRect().left;\n  let shiftY\
  \ = event.clientY - ball.getBoundingClientRect().top;\n\n  ball.style.position =\
  \ 'absolute';\n  ball.style.zIndex = 1000;\n  document.body.append(ball);\n\n  moveAt(event.pageX,\
  \ event.pageY);\n\n  // 在 (pageX, pageY) 坐标处移动球\n  // 并考虑了初始偏移量\n  function moveAt(pageX,\
  \ pageY) {\n    ball.style.left = pageX - shiftX + 'px';\n    ball.style.top = pageY\
  \ - shiftY + 'px';\n  }\n\n  function onMouseMove(event) {\n    moveAt(event.pageX,\
  \ event.pageY);\n  }\n\n  // 在 mousemove 时移动球\n  document.addEventListener('mousemove',\
  \ onMouseMove);\n\n  // 松开球，移除不需要的处理器\n  ball.onmouseup = function() {\n    document.removeEventListener('mousemove',\
  \ onMouseMove);\n    ball.onmouseup = null;\n  };\n\n};\n\nball.ondragstart = function()\
  \ {\n  return false;\n};\n```\n\n如果我们通过球的右下角拖拽它，区别会尤为明显。在之前的示例中，球会在指针下方发生“跳动”。现在，它会从当前位置流畅地跟随指针。\n\
  \n### 潜在的放置目标 (droppables)\n\n在之前的示例中，球可以被放置在“任何地方”停留。在现实生活中，我们通常取一个元素并将其放置到另一个元素上。例如，将“文件”放入“文件夹”中。\n\
  \n抽象地说，我们取一个可拖拽元素并将其放置在可放置元素上。我们需要知道：\n\n*   结束时元素放置在了哪里——以便执行相应的操作，\n*   并且最好知道我们正悬停在哪个可放置元素上——以便进行高亮。\n\
  \n问题在于，在我们拖拽时，可拖拽元素始终位于其他元素上方。因此事件会发生在它身上。我们在底层元素上设置的任何处理器都不会生效。例如，下面是两个 `div` 元素，红色在蓝色上面（完全覆盖）：\n\
  \n```html\n<style>\n  div {\n    width: 50px;\n    height: 50px;\n    position:\
  \ absolute;\n    top: 0;\n  }\n</style>\n<div style=\"background:blue\" onmouseover=\"\
  alert('永远无效')\"></</div>>\n<div style=\"background:red\" onmouseover=\"alert('在红色！')\"\
  ></</div>>\n```\n\ndbprt8.html\n\n有一个方法叫做 `document.elementFromPoint(clientX, clientY)`。它返回给定窗口相对元素（如果坐标超出窗口，则返回\
  \ `null`）。\n\n我们可以在任何鼠标事件处理器中使用它来检测指针下潜在的可放置元素，如下：\n\n```javascript\n// 在鼠标事件处理器中\n\
  ball.hidden = true; // 隐藏我们要拖拽的元素\n\nlet elemBelow = document.elementFromPoint(event.clientX,\
  \ event.clientY);\n// elemBelow 是球下方的元素，可能是可放置元素\n\nball.hidden = false;\n```\n\n\
  请注意：我们需要在调用 `(*)` 之前隐藏球。否则，坐标处通常有一个球，因为它是指针下方的顶部元素：`elemBelow=ball`。所以我们先隐藏它，然后立即显示。\n\
  \n我们可以使用这段代码来检查我们何时“悬停”在哪个元素上，并在放置发生时进行处理。\n\n用于寻找“可放置”元素的 `onMouseMove` 扩展代码：\n\
  \n\n\n\n```javascript\n// 我们现在正在飞过的潜在可投放区域\nlet currentDroppable = null;\n\nfunction\
  \ onMouseMove(event) {\n  moveAt(event.pageX, event.pageY);\n\n  ball.hidden = true;\n\
  \  let elemBelow = document.elementFromPoint(event.clientX, event.clientY);\n  ball.hidden\
  \ = false;\n\n  // mousemove 事件可能会在窗口外触发（当球被拖出屏幕时）\n  // 如果 clientX/clientY 出了窗口范围，则\
  \ elementFromPoint 返回 null\n  if (!elemBelow) return;\n\n  // 潜在的可投放区域被标记为类 \"droppable\"\
  （也可以是其他逻辑）\n  let droppableBelow = elemBelow.closest('.droppable');\n\n  if (currentDroppable\
  \ != droppableBelow) {\n    // 我们正在进入或移出...\n    // 注意：两个值都可能为 null\n    //   currentDroppable=null\
  \ 如果在此事件发生之前我们不在可投放区域上方（例如悬空空白处）\n    //   droppableBelow=null 如果在此事件发生期间我们现在不在可投放区域上方\n\
  \n    if (currentDroppable) {\n      // 处理“移出”可投放区域的逻辑（移除高亮）\n      leaveDroppable(currentDroppable);\n\
  \    }\n    currentDroppable = droppableBelow;\n    if (currentDroppable) {\n  \
  \    // 处理“进入”可投放区域的逻辑\n      enterDroppable(currentDroppable);\n    }\n  }\n}\n\
  ```\n\n在下面的示例中，当球被拖过球门时，球门会被高亮显示。\n\n[`plnkr.co/edit/VdbuAVBTO0X3sIR8o66m?p=preview`](https://plnkr.co/edit/VdbuAVBTO0X3sIR8o66m?p=preview)\n\
  \n现在我们在整个过程中都通过变量 `currentDroppable` 获取了我们正在飞过的当前“投放目标”，并可以使用它进行高亮或其他任何其他操作。\n\n\
  ## 总结\n\n我们考虑了一种基础的拖放（Drag’n’Drop）算法。\n\n关键组件：\n\n1. 事件流：`ball.mousedown` → `document.mousemove`\
  \ → `ball.mouseup`（不要取消原生的 `ondragstart`）。\n2. 在拖拽开始时——记住指针相对于元素的初始偏移：`shiftX/shiftY`\
  \ 并在拖拽期间保持它。\n3. 使用 `document.elementFromPoint` 检测指针下方的可投放元素。\n\n我们可以在此基础上构建出很多功能。\n\
  \n* 在 `mouseup` 时，我们可以在逻辑上完成投放：更改数据，移动元素位置。\n* 我们可以高亮我们正在飞过的元素。\n* 我们可以根据特定区域或方向限制拖拽。\n\
  * 我们可以对 `mousedown/up` 使用事件委托。一个检查 `event.target` 的大区域事件处理器可以管理成百上千元素的拖放。\n* 等以此此类推。\n\
  \n有一些框架在此基础上构建了架构：`DragZone`、`Droppable`、`Draggable` 以及其他类。它们大多数的操作都与上述描述的相似，所以现在应该很容易理解它们了。或者我们可以自己实现，如你所见，这非常容易，有时比适配第三方解决方案更容易。\n\
  \n## 任务\n\n滑动块（Slider）重要性：5\n\n创建一个滑动块：\n\nindex.html.1.26.html\n\n用鼠标拖动蓝色滑块并移动它。\n\
  \n重要细节：\n\n* 当按下鼠标按钮时，在拖拽过程中鼠标可能会经过滑动块上方或下方。滑动块仍然能够工作（对用户很方便）。\n* 如果鼠标快速向左或向右移动，滑块应该恰好停在边缘处。\n\
  \n[打开该任务的沙盒。](https://plnkr.co/edit/bp35SRJZ4mqXOix65TiL?p=preview)\n\n查看解决方案\n\n\
  在球场上拖动超级英雄重要性：5\n\n这个任务可以帮助你检查对拖放和 DOM 几个方面的理解。\n\n让所有类为 `draggable` 的元素都变为可拖拽的。就像章节中的球一样。\n\
  \n要求：\n\n* 使用事件委托来跟踪拖拽开始：在 `document` 上设置一个单一的 `mousedown` 事件处理器。\n* 如果元素被拖到窗口顶部/底部边缘——页面将向上或向下滚动以允许进一步拖拽。\n\
  * 没有水平滚动（这使得任务有点简单，添加它很容易的）。\n* 可拖拽元素或其部分永远不会离开窗口，即使在鼠标快速移动后也是如此。\n\n演示太大无法放入此处，所以这里是链接。\n\
  \n[在新窗口中打开演示](http://localhost:1339/task/drag-heroes/solution/)\n\n[打开该任务的沙盒。](https://plnkr.co/edit/CcSMqqrgDcrDlSENAMhq?p=preview)\n\
  \n查看解决方案\n\n键盘：keydown 和 keyup\n\n在进入键盘部分之前，请注意现代设备有其他“输入”方式。例如，人们使用语音识别（尤其是在移动设备上）或通过鼠标粘贴。\n\
  \n如果我们想跟踪任何 `<input>` 字段的输入，仅靠键盘事件是不够的。\n\n\n\n\n这里存在一个两难：在这样的监听器中，我们应该检查 `event.key`\
  \ 的值还是 `event.code` 的值？\n\n一方面，`event.key` 的值是一个字符，它会语言而改变。如果访问者在操作系统中有多种语言并在它们之间切换，同一个按键会产生不同的字符。因此，检查\
  \ `event.code` 是有意义的，因为它始终相同。\n\n如下所示：\n\n```javascript\ndocument.addEventListener('keydown',\
  \ function(event) {\n  if (event.code == 'KeyZ' && (event.ctrlKey || event.metaKey))\
  \ {\n    alert('Undo!')\n  }\n});\n```\n\n另一方面，`event.code` 也存在问题。对于不同的键盘布局，同一个按键可能有不同的字符。\n\
  \n例如，这里是美式布局（“QWERTY”）和德国布局（“QWERTZ”）（源自 Wikipedia）：\n\n![](img/us-layout.svg)![](img/german-layout.svg)\n\
  \n对于同一个按键，美式布局是“Z”，而德国布局是“Y”（字母交换了）。\n\n从字面上讲，对于使用德国布局的人，当他们按下 `Y` 时，`event.code`\
  \ 将等于 `KeyZ`。\n\n如果我们在代码中检查 `event.code == 'KeyZ'`，那么对于德国布局的用户，当他们按下 `Y` 时测试将会通过。\n\
  \n这听起来非常奇怪，但事实确实如此。[规范](https://www.w3.org/TR/uievents-code/#table-key-code-alphanumeric-writing-system)\
  \ 明确提到了这种行为。\n\n所以，`event.code` 可能会由于意外的布局匹配错误的字符。不同布局中的相同字母可能会映射到不同的物理按键，导致不同的代码。幸运的是，这只发生在几个代码上，例如\
  \ `keyA`、`keyQ`、`keyZ`（正如我们看到的），并且不会发生在如 `Shift` 等特殊键上。你可以在[规范](https://www.w3.org/TR/uievents-code/#table-key-code-alphanumeric-writing-system)中找到列表。\n\
  \n为了可靠地跟踪依赖布局的字符，`event.key` 可能是更好的方法。\n\n另一方面，`event.code` 的优点是始终保持不变，绑定到物理按键位置，即使访问者更改了语言也是如此。因此，依赖它的热键即使在语言切换的情况下也能良好。\n\
  \n我们需要处理依赖布局的按键吗？那么 `event.key` 是更好的选择。\n\n或者我们希望热键在语言切换后仍然有效？那么 `event.code` 可能更好。\n\
  \n### 自动重复 (Auto-repeat)\n\n如果一个按键被按下的时间足够长，它就会开始“自动重复”：`keydown` 会反复触发，然后当它释放时，我们最终获得\
  \ `keyup`。所以，出现多个 `keydown` 和单个 `keyup` 是正常的。\n\n对于由自动重复触发的事件，事件对象的 `event.repeat`\
  \ 属性被设置为 `true`。\n\n### 默认操作 (Default actions)\n\n默认操作各异，因为键盘可能会启动许多操作。\n\n例如：\n\
  \n*   字符出现在屏幕上（最明显的结果）。\n*   字符被删除（`Delete` 键）。\n*   页面滚动（`PageDown` 键）。\n*   浏览器打开“保存页面”对话框（`Ctrl+S`）\n\
  *   ……以此此类推。\n\n在 `keydown` 上阻止默认操作可以取消大部分操作，但基于操作系统的特殊键除外。例如，在 Windows 上 `Alt+F4`\
  \ 会关闭当前浏览器窗口。无法通过在 JavaScript 中阻止默认操作来停止它。\n\n例如，下面的 `<input>` 期望一个电话号码，因此它不接受数字、`+`、`()`\
  \ 或 `-` 以外的键：\n\n```javascript\n <script>\nfunction checkPhoneKey(key) {\n  return\
  \ (key >= '0' && key <= '9') || key == '+' || key == '(' || key == ')' || key ==\
  \ '-';\n}\n</script>\n<input onkeydown=\"return checkPhoneKey(event.key)\" placeholder=\"\
  Phone, please\" type=\"tel\">\n```\n\n6l3v1q.html\n\n请注意，特殊键如 `Backspace`、`Left`、`Right`、`Ctrl+V`\
  \ 在输入框中不起作用。这是严格过滤器 `checkPhoneKey` 的副作用。\n\n让我们稍微放宽一点：\n\n```javascript\n<script>\n\
  function checkPhoneKey(key) {\n  return (key >= '0' && key <= '9') || key == '+'\
  \ || key == '(' || key == ')' || key == '-' ||\n    key == 'ArrowLeft' || key ==\
  \ 'ArrowRight' || key == 'Delete' || key == 'Backspace';\n}\n</script>\n<input onkeydown=\"\
  return checkPhoneKey(event.key)\" placeholder=\"Phone, please\" type=\"tel\">\n\
  ```\n\n1d4rm7.html\n\n现在方向键和删除键工作良好。\n\n……但我们仍然可以使用鼠标和右键 + 粘贴来输入任何内容。因此过滤器不是 100%\
  \ 可靠的。我们可以随它，因为大多数时候它是有效的。或者另一种方法是跟踪 `input` 事件——它在任何修改后都会触发。在那里我们可以检查新值，并在无效时高亮/修改它。\n\
  \n### 遗留 (Legacy)\n\n过去曾有 `keypress` 事件、`keyCode`、`charCode`、`which`。\n\n### 总结\
  \ (Summary)\n\n按键总是生成键盘事件。\n\n键盘事件：\n\n*   `keydown` – 在按键时触发，\n*   `keyup` – 在释放按键时触发。\n\
  \n主要的键盘属性：\n\n*   `code` – 物理位置，\n*   `key` – 字符。\n\n### 任务 (Tasks)\n\n扩展热键：创建一个函数\
  \ `runOnKeys(func, code1, code2, ... coden)`，在同时按下代码为 `code1`、`code2`、…… `coden`\
  \ 的按键时运行 `func`。\n\n例如，下面的代码显示了当按下 `\"Q\"` 和 `\"W\"` 时显示 `alert`：\n\n```javascript\n\
  runOnKeys(\n  () => alert(\"Hello!\"),\n  \"KeyQ\",\n  \"KeyW\"\n);\n```\n\n[在新窗口中查看演示](http://localhost:1339/task/check-sync-keydown/solution/)\n\
