  \n跳转至解决方案\n\n### 修改文档\n\nDOM 修改是创建“动态”页面的关键。在这里我们将看到如何“动态”创建新元素并修改现有页面内容。\n\n####\
  \ 示例：显示消息\n\n让我们通过示例来演示。我们将在页面上添加一条比 `alert` 更好的消息。\n\n它看起来是这样：\n\n```html\n <style>\n\
  .alert {\n  padding: 15px;\n  border: 1px solid #d6e9c6;\n  border-radius: 4px;\n\
  \  color: #3c763d;\n  background-color: #dff0d8;\n}\n</style>\n\n<div class=\"alert\"\
  >\n  <strong>Hi there!</strong> You've read an important message.\n</div>\n```\n\
  \ndfo21z.html\n\n#### 创建元素\n\n看看如何创建一个新元素并将其添加到页面。\n\n```javascript\nlet div = document.createElement('div');\n\
  div.className = 'alert';\ndiv.innerHTML = '<strong>Hi there!</strong> You\\'ve read\
  \ an important message.';\ndocument.body.appendChild(div);\n```\n\n#### 创建文本节点\n\
  \n我们也可以使用 `document.createTextNode()` 创建文本节点。\n\n```javascript\nlet text = document.createTextNode('Hello\
  \ world');\ndocument.body.appendChild(text);\n```\n\n#### 插入元素\n\n要在特定位置插入元素，我们有几种方法：\n\
  \n*   `appendChild(node)` – 将节点作为父元素的最后一个节点添加。\n*   `prepend(node)` – 将节点作为父元素的第一个子节点添加。\n\
  *   `insertBefore(node, referenceNode)` – 在参考节点之前插入节点。\n*   `insertAdjacentHTML(position,\
  \ html)` – 将文本字符串解析为 HTML 并插入 DOM 中。\n\n例如，让我们使用 `insertAdjacentHTML` 配合 `beforeend`\
  \ 位置将 `alert` 消息添加到 `<body>` 的开头。\n\n\n\n\n\n```html\n<div id=\"div\"></</div>>\n\
  <script>\n  div.insertAdjacentHTML('beforebegin', '<p>Hello</p>');\n  div.insertAdjacentHTML('afterend',\
  \ '<p>Bye</p>');\n</script>\n```\n\n…会导致结果：\n\n```html\n<p>Hello</p>\n<div id=\"\
  div\"></</div>\n<p>Bye</p>\n```\n\n这就是我们如何向页面添加任意 HTML 的方法。\n\n这里是插入变体的插图：\n\n![](img/insert-adjacent.svg)\n\
  \n我们可以很容易地发现这与上一张图片的相似之处。插入点实际上是相同的，但这种方法插入的是 HTML。\n\n该方法有两个“兄弟”方法：\n\n*   `elem.insertAdjacentText(where,\
  \ text)` – 语法相同，但 `text` 字符串作为“文本”插入，而不是 HTML。\n*   `elem.insertAdjacentElement(where,\
  \ elem)` – 语法相同，但插入的是一个元素。\n\n它们的存在主要是为了让语法保持“统一”。在实践中，大多数时候只使用 `insertAdjacentHTML`。因为对于元素和文本，我们有\
  \ `append/prepend/before/after` 方法 —— 它们编写更短，并且可以插入节点/文本片段。\n\n这里是显示消息的另一种变体：\n\n\
  ```html\n<style>\n.alert {\n  padding: 15px;\n  border: 1px solid #d6e9c6;\n  border-radius:\
  \ 4px;\n  color: #3c763d;\n  background-color: #dff0d8;\n}\n</style>\n\n<script>\n\
  \  document.body.insertAdjacentHTML(\"afterbegin\", `<div class=\"alert\">\n   \
  \ <strong>Hi there!</strong> You've read an important message.\n  </div>`);\n</script>\n\
  ```\n\n### 移除节点\n\n要移除一个节点，有一个 `node.remove()` 方法。\n\n让我们让消息在秒钟后消失：\n\n```html\n\
  \ <style>\n.alert {\n  padding: 15px;\n  border: 1px solid #d6e9c6;\n  border-radius:\
  \ 4px;\n  color: #3c763d;\n  background-color: #dff0d8;\n}\n</style>\n\n<script>\n\
  \  let div = document.createElement('div');\n  div.className = \"alert\";\n  div.innerHTML\
  \ = \"<strong>Hi there!</strong> You've read an important message.\";\n\n  document.body.append(div);\n\
  \  setTimeout(() => div.remove(), 1000);\n</script>\n```\n\n请注意：如果我们想将一个元素移动到另一个地方\
  \ —— 不需要从旧位置将其移除。\n\n**所有插入方法都会自动将节点从旧位置移除。**\n\n例如，让我们交换两个元素：\n\n```html\n<div\
  \ id=\"first\">First</div>\n<div id=\"second\">Second</div>\n<script>\n  // 无需调用\
  \ remove\n  second.after(first); // 获取 #second 并在其之后插入 #first\n</script>\n```\n\n\
  ### 克隆节点：cloneNode\n\n如何再插入一条相似的消息？\n\n我们可以写一个函数并将代码放在其中。但另一种备选方案方法是克隆现有的 `div`\
  \ 并修改其内部的文本（如果需要）。\n\n有时当我们有一个很大的元素时，这种方法可能更快、更简单。\n\n*   调用 `elem.cloneNode(true)`\
  \ 会创建一个元素的“深”克隆 —— 包含所有属性和子元素。如果调用 `elem.cloneNode(false)`，则克隆时将不包含子元素。\n\n复制消息的示例：\n\
  \n```html\n <style>\n.alert {\n  padding: 15px;\n  border: 1px solid #d6e9c6;\n\
  \  border-radius: 4px;\n  color: #3c763d;\n  background-color: #dff0d8;\n}\n</style>\n\
  \n<div class=\"alert\" id=\"div\">\n  <strong>Hi there!</strong> You've read an\
  \ important message.\n</div>\n\n<script>\n  let div2 = div.cloneNode(true); // 克隆消息\n\
  \  div2.querySelector('strong').innerHTML = 'Bye there!'; // 修改克隆节点\n\n  div.after(div2);\
  \ // 在现有 div 之后显示克隆节点\n</script>\n```\n\n### 文档碎片 (DocumentFragment)\n\n`DocumentFragment`\
  \ 是一个特殊的 DOM 节点，作为节点列表的容器。\n\n我们可以将其他节点添加到它中，但当我们将其插入到某处时，它的内容会被直接插入进去。\n\n例如，下面的\
  \ `getListContent` 生成一个包含 `<li>` 项目的碎片，这些项目会被插入到 `<ul>` 中：\n\n```html\n <ul id=\"\
  ul\"></ul>\n\n<script>\nfunction getListContent() {\n  let fragment = new DocumentFragment();\n\
  \n  for(let i=1; i<=3; i++) {\n    let li = document.createElement('li');\n    li.append(i);\n\
  \    fragment.append(li);\n  }\n\n  return fragment;\n}\n\nul.append(getListContent());\
  \ // (*)\n</script>\n```\n\n请注意，在最后一行 `(*)` 我们添加了 `DocumentFragment`，但它会被“融合”，因此生成的结构将是：\n\
  \n```html\n<ul>\n  <li>1</li>\n  <li>2</li>\n  <li>3</li>\n</ul>\n```\n\n\n\n\n\n\
  也有它的优点。从技术上讲，当浏览器在读取（“解析”）传入的 HTML 时调用 `document.write` 并写入内容时，浏览器处理它的方式就像这些内容最初存在于\
  \ HTML 文本中一样。\n\n所以它的运行速度极快，因为不涉及`no DOM modification`。它会直接写入页面文本，而此时 DOM 尚未构建。\n\
  \n因此，如果我们需要在页面加载阶段动态向 HTML 中添加大量文本，并且对速度有严格刻，那么这种方法可能会有所帮助。但在实践中，这些需求很少同时出现。通常我们会在脚本中看到这种方法仅仅是因为它们太老旧了。\n\
  \n## 总结\n\n*   创建新节点的方法：\n    *   `document.createElement(tag)` – 创建一个给定标签的元素，\n\
  \    *   `document.createTextNode(value)` – 创建文本节点（很少使用），\n    *   `elem.cloneNode(deep)`\
  \ – 克隆该元素，如果 `deep==true` 则会克隆所有后代。\n*   插入和删除：\n    *   `node.append(...nodes or\
  \ strings)` – 插入到 `node` 的末尾，\n    *   `node.prepend(...nodes or strings)` – 插入到\
  \ `node` 的开头，\n    *   `node.before(...nodes or strings)` – 插入到 `node` 之前，\n   \
  \ *   `node.after(...nodes or strings)` – 插入到 `node` 之后，\n    *   `node.replaceWith(...nodes\
  \ or strings)` – 替换 `node`。\n    *   `node.remove()` – 删除 `node`。\n    文本字符串以“纯文本”的形式插入。\n\
  *   还有一些“老式”方法：\n    *   `parent.appendChild(node)`\n    *   `parent.insertBefore(node,\
  \ nextSibling)`\n    *   `parent.removeChild(node)`\n    *   `parent.replaceChild(newElem,\
  \ node)`\n    所有这些方法都返回 `node`。\n*   给定 `html` 中的某些 HTML，`elem.insertAdjacentHTML(where,\
  \ html)` 会根据 `where` 的值进行插入：\n    *   `\"beforebegin\"` – 在 `elem` 之前插入 `html`，\n\
  \    *   `\"afterbegin\"` – 在 `elem` 的开头插入 `html`，\n    *   `\"beforeend\"` – 在\
  \ `elem` 的末尾插入 `html`，\n    *   `\"afterend\"` – 在 `elem` 之后插入 `html`。\n    还有类似的方法\
  \ `elem.insertAdjacentText` 和 `elem.insertAdjacentElement`，它们分别用于插入文本字符串和元素，但很少被使用。\n\
  *   在页面加载完成前向页面追加 HTML：\n    *   `document.write(html)`\n    在页面加载后调用此方法会清空文档。多见于旧脚本。\n\
