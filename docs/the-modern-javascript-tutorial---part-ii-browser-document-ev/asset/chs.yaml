  \n跳转到公式 键盘驱动鼠标\n\n我们可以使用 `mouse.onclick` 来处理点击，并通过 `position:fixed` 让鼠标变为“可移动的”，然后使用\
  \ `mouse.onkeydown` 处理方向键。\n\n唯一的陷阱是 `keydown` 只在具有焦点的元素上触发。因此，我们需要为该元素添加 `tabindex`。由于禁止修改\
  \ HTML，我们可以使用 `mouse.tabIndex` 属性来实现。\n\nP.S. 我们也可以将 `mouse.onclick` 替换为 `mouse.onfocus`。\n\
