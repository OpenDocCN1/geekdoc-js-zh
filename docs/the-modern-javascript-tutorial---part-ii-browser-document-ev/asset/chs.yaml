  >`。\n\n前往解决方案 在内部显示提示（绝对定位），重要性：5\n\n扩展上一个任务 在元素附近显示提示（绝对定位）：让函数 `positionAt(anchor,\
  \ position, elem)` 将 `elem` 插入到 `anchor` 内部。\n\n`position` 的新值：\n\n* `top-out`,\
  \ `right-out`, `bottom-out` – 工作方式与之前相同，它们将 `elem` 插入 `anchor` 的上方/右侧/下方。\n* `top-in`,\
  \ `right-in`, `bottom-in` – 将 `elem` 插入到 `anchor` 内部：将其贴在上边缘/右边缘/下边缘。\n\n例如：\n\n\
  ```\n// 在上方显示提示\npositionAt(blockquote, \"top-out\", note);\n\n// 在内部上方显示提示\npositionAt(blockquote,\
  \ \"top-in\", note);\n```\n\n结果：\n\nindex.html.1.9.html\n\n源码部分请取任务 在元素附近显示提示（绝对定位）\
  \ 的解决方案。\n\n前往解决方案\n\n# 事件介绍\n\n介绍浏览器事件、事件属性和处理模式。\n\n### 浏览器事件介绍\n\n事件是某些事情已经发生的信号。所有\
  \ DOM 节点都会产生此类信号（但事件不仅限于 DOM）。\n\n以下是最常用的事件列表：\n\n**鼠标事件：**\n\n* `click` – 当鼠标点击元素时触发（触摸设备在轻触时触发）。\n\
  * `contextmenu` – 当鼠标在元素上右键点击时。\n* `mouseover` / `mouseout` – 当鼠标光标悬停 / 离开元素时。\n\
  * `mousedown` / `mouseup` – 当在元素上按下 / 释放鼠标键时。\n* `mousemove` – 当鼠标移动时。\n\n**表单元素事件：**\n\
  \n* `submit` – 当访问者提交 `<form>` 时。\n* `focus` – 当访问者聚焦元素时，例如 `<input>`。\n\n**键盘事件：**\n\
  \n* `keydown` 和 `keyup` – 当访问者按下然后释放按钮时。\n\n**文档事件：**\n\n* `DOMContentLoaded` –\
  \ 当 HTML 加载并处理、DOM 完全构建完成后。\n\n**CSS 事件：**\n\n* `transitionend` – 当 CSS 动画结束时。\n\
  \n还有许多其他事件。我们将在接下来的章节中详细介绍特定事件。\n\n#### 事件处理器\n\n为了对事件做出反应，我们可以分配处理器——一个在事件发生时运行的函数。处理器是在用户操作时运行\
  \ JavaScript 代码的一种。\n\n分配处理器有几种方法。让我们从最简单的开始。\n\n##### HTML 属性\n\n可以在 HTML 中通过名为\
