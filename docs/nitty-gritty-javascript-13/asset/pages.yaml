  md: '# Tag/Attribute


    | | 2.0 | 3.0 | 3.2 | 4.0 | Internet Explorer | Netscape |

    |---|---|---|---|---|---|---||

    | readonly | | | | X | 4.0 | | |

    | rows | X | X | X | X | 1.0 | 1.0 |

    | tabindex | | | | X | 4.0 | | |

    | wrap | | | | X | 4.0 | 2.0 |


    Defines a text field in a form.


    # accesskey


    You can use `accesskey` to define a shortcut for reaching the text field. Assign
    a single letter to the attribute. This will now be executed when you press this
    key together with the relevant shortcut-key. This key can vary, depending on which
    browser and operating system you use.


    # cols


    Specifies the text columns of the text field.


    # disabled


    This single attribute indicates that this form element has been temporarily deactivated.


    # name


    Specifies the name of the form element to enable it to be identified by scripts.
    The value of this attribute is also supplied when parsing the form.


    # readonly


    This single attribute specifies that the content of this form element cannot be
    changed by the reader-der of the page.


    # rows


    Specifies the text lines in the text field.


    # tabindex


    Specifies the tab index of the text field. Positive values represent the position
    of the field in the list of objects that can be activated with `Tab`. Negative
    values mean that the element does not occur in the tab index.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'wrap

    Specifies how the lines are to be wrapped.


    | Value | Meaning |

    |---|---|

    | off | The lines are wrapped just as they have been entered. Wrapping does not
    occur unless (8) is pressed. |

    | soft | The lines are wrapped in the display, but submitted in the form entered.
    |

    | hard | The lines are wrapped in the display and are sent to the script in the
    same way. |


