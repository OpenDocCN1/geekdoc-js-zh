  md: 'Dear Reader,


    The Internet continues to develop at a rapid pace. Modern homepages are no longer
    static sources of information and now offer genuine interactivity. Active Internet
    pages of this kind cannot be implemented by just using HTML, the main language
    in the World Wide Web. That’s why you have already taken a step in the right direction
    by buying this book on JavaScript.


    You will get to know the key principles of JavaScript programming and will be
    able to use the quick reference guide to extend your knowledge to expert level.
    Afterwards you can check out the tips and tricks section to find out how to get
    more information about JavaScript.


    At this point we would like to thank all those who contributed (in whatever way)
    to the creation of this book:


    Firstly, our thanks go to our editor at Addison-Wesley, Christina Gibbs, who pulled
    out all the stops to allow us more time to write this book.


    Thanks also to our parents and friends who hardly ever caught sight of us during
    the “white-hot” creative phase. We’re sorry but things will calm down again now
    promise!'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Last but not least, I (Ingo Dellwig) would like to thank the members of the
    Dortmund University Orchestra for being so thoughtful when I was immersed in my
    writing during our concert tour of Tuscany. Once again it was great fun touring
    with the orchestra.


    We hope that you enjoy this book and that you will find in it all the information
    you need about JavaScript.


    Elmar and Ingo Dellwig

    Werne, July 2000


