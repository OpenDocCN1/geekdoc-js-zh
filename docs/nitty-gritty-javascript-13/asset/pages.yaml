    # 1.1.2 Text editor


    Somchow we need to tell the computer how the JavaScript homepage is to look. All
    this requires is a simple text editor. For example, if you are using Windows as
    your operating system, you will already have the “Notepad” editor. You will find
    this in the ACCESSORIES program folder or under START / PROGRAMS / ACCESSORIES
    / EDITOR in Windows 95/98.


    6 REQUIREMENTS'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'If you prefer to use another editor, make sure you save your file as text only.
    In the case of a Word file saved in .doc format, format control characters are
    saved as well as in your HTML text. These cannot be handled by the browser and
    make the file useless for our purposes. Here''s an example:


    ```

    <HTML>

    <BODY>

    TEST

    </BODY>

    </HTML>

    ```


    This source text should eventually display the word TEST on the screen. The meaning
    of the various commands will be explained later. If you save this file in Word
    in .doc format, then the source text will look like this:


    ![](img/e34e97fd5b6c8c53a35b4a486b3caa85_22_0.png)


    **Figure 1.5** The source text is unrecognizable ...


    If we now look at the page in the browser, we will also see something very interesting,
    but this has nothing to do with the source text we have keyed in:'
  merge: -1
  pgno: 22
- img_proc: true
  md: '![](img/e34e97fd5b6c8c53a35b4a486b3caa85_23_0.png)


    # ### 1.6 ... this result is not very satisfactory either


    We will explain how to avoid mistakes like this later on. The important point
    for the moment is that you should choose a text editor that can save normal text
    without control characters.


    # ## 1.2 Crash course in HTML


    We have already told you that JavaScripts are embedded in an HTML file. For this
    reason we should quickly familiarize ourselves with the key terms in this language.


    HTML is extremely transparent. It simply involves writing text whose appearance
    is defined by tags. In addition you can also integrate images, tables and multimedia
    elements. Let''s get down to business.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# 1.2.1 Creating an HTML page


    Open your editor and create a new text file. Because you want the computer to
    interpret this file as an HTML page later on, we need to identify it in two ways.
    Firstly the text must begin with `<html>` and end with `</html>`.


    Because you are probably wondering what the brackets mean, we should tell you
    that you have just entered the first tag. In most cases there is a start tag and
    an end tag. The end tag differs from the start tag by a slash. The full text between
    the `<html>` tag and the `</html>` end tag is interpreted as HTML language. So,
    please please enter the following lines:


    ```

    <html>

    </html>

    ```


    You can now save this file so that it will be available on the hard disk. This
    is where the second identifier comes in, because all HTML files must end in .HTM
    or .HTML. Because not operating systems accept four characters after the dot,
    it is best to use the extension .HTML. Save the file under the name index.dex
    using your JS13 folder.


    Why did we call the file index? Simple: If there are several HTML files in a sub-folder,
    the browser will always select the file named index.htm if you do not specify
    another file name. If you called this file now, you wouldn''t see much believe
    up to now all the computer knows is that the content of the file is HTML.


    # 1.2.2 Head and body


    To bring a bit of life into your page it wouldn''t be a bad idea to enter some
    text. Before you start, there''s one more thing you should know: HTML pages can
    be divided into two parts. The first part is called the head and is indicated
    by the tag `<HEAD>`. Because the head encompasses an area, there is also a closing
    `<HEAD>`. Everything contained in the head of the HTML page will not be displayed
    directly on the page, but will make itself known in another way. For example,
    you should choose a title for your homepage. In most browsers, this is displayed
    in the title bar next to the browser name. The title is indicated by the marker
    `<TITLE>`.


    Because the page would be empty - after all the title does not appear on every
    page - and every head needs a body, we should add the marker `<body>`. Everything
    entered in the body usually appears on the page. This means you can add to your
    text.


    ```

    <html>

    <HEAD>

    <TITLE>TEST</TITLE>

    ```


    ![](img/e34e97fd5b6c8c53a35b4a486b3caa85_24_0.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '```

    </HEAD>

    <body>

    Test: OK

    </BODY>

    <HTML>

    ```


    Now we look at our results. Save this text again in index.htm and start your browser.
    It has become standard practice for the upper part of the browser to contain a
    text field "URL:, "Address: or "Go". This is where you enter the details of the
    page you want to see. Because your new HTML page is still on the hard disk, you
    can open it by entering file:///c:/js13/index.htm. Of course if you have chosen
    a different folder or drive during the preparations, you should change the command
    as necessary. Press Enter to confirm your entry. The following information will
    be displayed:


    ![](img/e34e97fd5b6c8c53a35b4a486b3caa85_25_0.png)


    Figure 1.7 The page header and the text displayed are exactly what we expected


    If the file is not displayed or you get an error then choose "Open" from the File
    menu and navigate to the file within the file browser. Alternatively, you can
    double-click on the document you have created to open it in your browser.


    You have now created and displayed your first HTML page. The layout still looks
    a bit meager. You could use what you have already learned to display texts in
    a browser, but still need a few important markers that can make the text easier
    to read. The first marker we''ll introduce is the <SCRIPT> tag. This is very useful
    for our purposes.'
  merge: -1
  pgno: 25
- img_proc: true
  md: "# 1.2.3 The <SCRIPT> tag\n\nScript languages are identified by the <SCRIPT>\
    \ tag. JavaScript is an example of a script language. That's why we use <SCRIPT>\
    \ to distinguish JavaScript text from HTML source code. Here's an example:\n\n\
    ```\n<HTML>\n<HEAD>\n  <SCRIPT LANGUAGE=\"JavaScript\">\n  <!--\n    function\
    \ testname(str) {\n      alert(\"Hello, \" + str + \"!\");\n    }\n  -->\n</SCRIPT>\n\
    </HEAD>\n<BODY>\n  Please enter your name:\n  <FORM>\n    <INPUT TYPE=\"text\"\
    \ NAME=\"name\"\nONBLUR=\"getname(this.value)\\ VALUE=\"\">\n  </FORM>\n</BODY>\n\
    </HTML>\n```\n\nSave this source text as query.htm and take a look at the result\
    \ in the browser:\n\n![](img/e34e97fd5b6c8c53a35b4a486b3caa85_26_0.png)\n\nEnter\
    \ your name in the input field and press (Tab). The following window appears:"
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/e34e97fd5b6c8c53a35b4a486b3caa85_27_0.png)


    # **Figure 1.9** The JavaScript has completed its task


    What we are getting at is the fact that it was the <SCRIPT LANGUAGE="JavaScript-\script>
    line that allowed us to use JavaScript. As we said before, other script languages
    can also be controlled with <SCRIPT>. The attribute LANGUAGE is needed to enable
    the browser to recognize which language is being used. Attributes can link values
    to tags. LANGUAGE is assigned the value "JavaScript". Because the attribute is
    within the tag, it is clear that it is written in JavaScript. We will not deal
    with the other tags and attributes in the source text or with the script itself
    at this point. Try to be patient. It is much more interesting at this point to
    find out what other attributes can be used in <SCRIPT>


    | Attribute Description |

    | CHARSET This attribute specifies which character set is used for the script.
    The standard setting is ISO-8859-1. |

    | DEFER This attribute occurs all by itself and therefore does not need to be
    assigned a value. If this attribute is set, the browser is notified that the script
    does not generate any on-screen data. |

    | EVENT This indicates the event script was written for. More about this later.
    |

    | FOR This specifies which element is linked to this event script. This will be
    explained later. |

    | LANGUAGE As explained, this attribute indicates the language used for the script.
    |

    | SRC An external data source can be accessed here. This can be useful if, lots
    of HTML files use the same script. |

    | TYPE This attribute indicates the MIME type of the source code. |


    # ****Table 1.2** The attributes of <SCRIPT>


