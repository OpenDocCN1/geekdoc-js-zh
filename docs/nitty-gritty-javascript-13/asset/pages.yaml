  md: '# 1.4.4 Data types and literals


    The following data types are known in JavaScript:


    +   - Numbers

    - Boolean values

    - Strings


    There are two different versions of all these data types: single values and objects.
    At this point we will concentrate on the values. Section 1.7 will deal with the
    objects in more detail.


    In the cases of numbers, no explicit distinction is made between integer values
    and decimal numbers. You do not need special notation to use whole numbers in
    your programs, so you can use the familiar decimal format. However, you can also
    use an alternative octal or hexadecimal format for numbers. To use these alternatives,
    you must follow a special syntax when writing numbers. For octal numbers this
    is indicated by a prefixed 0 (zero). An 0x (or 0X) prefix is used for hexadecimal
    numbers. Of course, octal numbers only allow you to enter numbers in the range
    0 to 7, while the decimal system allows numbers 0 to 9. Things are different in
    the hexadecimal system; numbers from 0 to 9 are permitted and letters from A to
    F (or a to f).


    | Decimal | Octal (prefix 0) | Hexadecimal (prefix 0x) |

    |---|---|--|

    | 0 | 00 | 0x0 |

    | 1 | 01 | 0x1 |

    | 2 | 02 | 0x2 |

    | 4 | 04 | 0x4 |

    | 8 | 010 | 0x8 |

    | 10 | 012 | 0xA |

    | 15 | 017 | 0xF |

    | 16 | 020 | 0x10 |

    | 20 | 024 | 0x14 |

    | 24 | 030 | 0x18 |

    | 255 | 0377 | 0xFF |


    **Table 1.5 Examples of decimal, octal and hexadecimal notation**


    The appendix contains a complete conversion table for all numbers from 0 to 255.


    Things are different for numbers containing decimal points. There are two different
    notations to choose from.'
