  md: '# 1.4.1 What is the point of variables?


    Variables are needed to save values you will want to use at a later stage. Because
    the value of a variable doesn''t tell you very much, we usually assign variable
    names that provide an intuitive linking to the type of value stored in these variables.


    Another advantage of well-chosen variable names is the fact that the source text
    can be made more meaningful. For example, the following source code doesn''t tell
    you much about the calculations involved:


    ```

    var noIdea

    var whoKnows

    noIdea = (whoKnows / 100) * 17.5

    ```


    Meaningful variable names would help you to see at a glance exactly what is being
    calculated, even after several years. Here are some examples of meaningful variable
    names:


    ```

    var vatItem

    var itemPrice

    vatItem = (itemPrice / 100) * 17.5

    ```


    The choice of these variable names means that the person reading the source code
    will immediately know what kind of calculation is being made.


    It is up to you whether you write your source code in a way that can be easily
    read by others or whether you prefer a more cryptic approach. All we can say at
    this point is that you will make life easier for yourself if you choose meaningful
    variable names. You will also make it easier to work in a team with other pro-grammers.


    # 1.4.2 Declaring and initializing variables


    There are two ways to declare a variable in JavaScript. You can simply assign
    a value to the variable:


    +   * x = 10


    or use the keyword var to indicate that a variable is now being declared:


    ```

    var x = 10

    ```


    The result of both declaration methods is the same: Variable x is assigned the
    value 10.


    To save space when defining variables and to define several variables in success-ion,
    you can use the following syntax:


    ```

    x = 10; y = 20;

    ```'
