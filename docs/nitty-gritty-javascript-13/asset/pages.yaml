  md: '# 2.2.1 escape()


    escape() returns a string which has been encoded suitable for use in form data.

    This function was implemented in core JavaScript 1.0.


    Syntax:


    ```

    escape("string")

    ```


    Example:


    ```

    escape("Drag&Drop is a great feature.")

    ```


    Returns the following string:

    "Drag%26Drop%20is%20a%20great%20feature."

    See also: unescape().


    # 2.2.2 eval()


    eval() evaluates the specified string as JavaScript and returns the result.

    This function was implemented in core JavaScript 1.0.


    Syntax:


    ```

    eval("string")

    ```


    Example 1:


    ```

    eval(new String("This is a string."))

    ```


    Returns the following result:

    This is a string.


    Example 2:


    ```

    eval("25+13")

    ```


    Returns the following result:

    38

    See also: Object.eval().


    # 2.2.3 Infinity


    Infinity represents an infinite numerical value.

    This property was implemented in core JavaScript 1.3.


    Syntax:


    ```

    Infinity

    ```'
