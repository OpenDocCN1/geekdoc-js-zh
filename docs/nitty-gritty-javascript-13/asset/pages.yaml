  md: '# Introduction


    This section will introduce you to the JavaScript language and also take a look
    at good programming practice. We will discuss some issues on the basis of examples
    and will provide you with a quick reference guide in the next section. This contains
    all the information you will need to develop complex JavaScripts. The third section
    contains additional suggestions and tips that will show you a few tricks for turning
    good JavaScript into something special.


    # 1.1 Requirements


    JavaScript is a programming language used in the Internet - or more precisely
    in the "World Wide Web" (WWW). This kind of script is usually embedded in an HTML
    text. "HTML" stands for "Hypertext Markup Language" and is the standard language
    used on the WWW. HTML files (and therefore JavaScript programs too) consist of
    normal text. This is why a simple text editor is all you need to program JavaScript.
    Naturally we also want to see the results of our work. For this we need a "WWW
    browser". Both programs must fulfill a number of requirements, as listed below.


    > **Tip** Because the files have to be stored somewhere and we don''t want to
    spend a long time searching around, please create a folder called "JS13" in your
    home directory. All JavaScript files will be stored here.


    # 1.1.1 Browsers


    Because no one would want to read HTML or JavaScript source text directly, the
    first thing we need is an interpreter. The program used for this is called a browser.
    This type of program reads the source text line-by-line and performs the in-'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'ructions contained there. Sometimes it''s just text that needs to be displayed,
    but it is becoming more common for images to be loaded and displayed. Another
    key function of the browser is to execute your command when you want to load another
    page as suggested by the current page. The browser also translates and runs JavaScript
    programs. In other words, it operates as a compiler for JavaScript.


    > > **Tip** You can download current browser versions from the Internet. For more
    information on this topic, please see Appendix C.


    There are lots of different browsers and their quality can vary. The most primitive
    of all is "LYNX". This is a purely text browser. In other words you cannot use
    it to display graphics. This program cannot handle JavaScript either. For this
    reason it is useless for our purposes. However, remember that there are some users
    out there who cannot use better browsers because these not run on old computers.
    These users will not be able to enjoy your scripts. We will point out some alternatives
    for these users in this book.


    ![](img/e34e97fd5b6c8c53a35b4a486b3caa85_19_0.png)


    **Figure 1.1** The oldest browser we could find is called LYNX


    Next on our list is Mosaic. Although this program can work with graphics, it is
    also unable to handle JavaScript.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/e34e97fd5b6c8c53a35b4a486b3caa85_20_0.png)


    Figure 1.2 Mosaic is also unsuitable for JavaScript programming


    For this reason we advise you to use either Netscape Navigator, Netscape communicator
    or Microsoft Internet Explorer. If you can get hold of a copy of Netscape Navigator
    4.06 or Internet Explorer 5.0 you will have everything you need to work through
    this book.


