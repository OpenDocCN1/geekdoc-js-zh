    # # Glossary


    This is a list of all the terms used in this book that may require further explanation.


    Address


    All services in the Internet are accessed by means of an address. This can have
    a variety of formats. An e-mail address might look like this: name@provider.com.
    A homepage is reached as: http://www.provider.com/


    Anchor


    The image or text you click on in order to reach a page indicated by the relevant
    link is called an anchor.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Attribute


    An attribute can be assigned to a tag in HTML and describes the properties of
    the element created in greater detail. For example, if you use <hr> to create
    a horizontal split bar, you can define the thickness of the line using the size
    attribute.


    ```

    <hr size=4>

    ```


    This command creates a much thicker line than <hr> on its own.


    # Body


    All data, images and other elements that are subsequently to appear in the browser
    window are listed in the body of an HTML file. The alignment and configuration
    of these elements is also defined here.


    # Browser


    A browser is a program that transforms HTML language into a graphical image and
    interprets the user''s entries. This enables the user to surf the Internet. The
    most commonly used browsers are Netscape Navigator and Microsoft Internet Explorer.


    # CGI


    CGI (Common Gateway Interface) is a standard that defines an interface between
    computers. It is used to define the transfer of data from so-called CGI scripts,
    for example.


    # Dedicated line


    A permanent link between two computers is called a dedicated line.


    # Download


    Downloading means transferring a file from another computer to your own system.


    # Dynamic HTML


    Dynamic HTML is an extension of HTML that allows you to program animations and
    lots of other elements with HTML.


    # Editor


    See Text editor.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# E-mail


    You can use the Internet to send mail. You simply specify the name of the recipient
    and write your message. In just a few minutes (sometimes even seconds) the recipient
    will have your letter as a file. This variant is much faster than normal mail
    and doesn''t even cost the price of a stamp. A letter like this is called e-mail.


    # FTP


    In the context of the Internet, FTP stands for "File Transfer Protocol". Computers
    communicate with each other in a variety of languages (protocols). This one was
    specially developed for exchanging data in the Internet. FTP allows you easy access
    to large file archives belonging to businesses, universities or other institutions.


    # Guest access


    Many service providers supply software to their subscribers. To ensure that this
    software can only be accessed by subscribers, a prompt appears requesting the
    user ID and the password when the connection is being set. Some data is also open
    to Internet users who are not subscribers. These people can log on under the name
    "Anonymous". In most cases there is no need to enter a password. In some cases
    the guest''s e-mail address is expected as the password. You will receive adequate
    advance warning of this.


    # Hard disk


    A computer stores both the operating system as well as other programs on a hard
    disk. This hardware is comparable with a floppy disk, but much faster and larger.


    # Hardware


    A computer''s hardware consists of the processor itself with all its cards, the
    monitor, the keyboard, the mouse, the printer and all the other devices connected
    to it.


    # Head


    The head of an HTML file contains the page title, among other things.


    # Homepage


    A homepage often consists of several files that can be viewed by any Internet
    user. A homepage is mostly written in HTML language and displayed using a browser
    program. Homepages contain information about individuals, businesses, universities
    and other institutions.


    # HTML


    HTML, or Hypertext Markup Language, was developed to make it as easy as possible
    to create webpages. It regulates the programming of links and simplifies the structure
    of tables, forms and lists. HTML even allows multimedia elements such as videos
    and music to be used.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# HTTP


    The Hypertext Transfer Protocol (HTTP) is used to transfer files based on HTML
    language. Home-pages are mostly transferred using this protocol.


    # Internet


    The Internet is a worldwide network of computers. Originally developed by the
    military to ensure a fully functional communication network even when some computers
    have failed. In the mean-time, it has also become an important medium for businesses
    and private individuals.


    # ISDN


    Telephone companies offer not normal analog telephone lines, but also digital
    ISDN lines. Here the voice is first transformed into digital patterns before being
    converted back into acoustic signals on the other side. Because programs and files
    are stored and transferred by digital means, ISDN is a fast option for data transfer.


    # Java


    Programs written in Java are transferred via the Internet and then run on your
    system. This-programming language was specially developed for the Internet.


    # Link


    A link is a connection between two Internet pages. If you activate a link on the
    current page, you will be taken to the target page.


    # Memory


    To store data you need memory. This can be main memory or hard disk capacity.


    # Modem


    You need a modem to send data over a telephone line. This hardware transforms
    data into acoustic signals. There is also a modem on the other side which performs
    the opposite procedure. A modem can therefore translate in both directions.


    # Network


    A network is a group of computers that exchange data with each other. The Internet
    is an enorm-ous network.


    # Operating system


    After it starts, every computer must call a basic program that tells it how to
    react to entries and how to address the hardware. This program is known as an
    operating system. The most commonly used versions are Windows 95/98/NT/2000, MS-DOS,
    OS/2, MacOS and Unix.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Pixel


    A pixel is the smallest point that can be shown on a screen. If you use a screen
    resolution of 800x600 pixels, you can display 480.000 pixels.


    # Protocol


    When data is transferred, some protocols can check whether all data has been received
    or whe-ther has been altered by interference during transmission.


    # Server


    A server is a computer that stores data in order to make it available to other
    systems in the net-work.


    # Service provider


    A service provider forms the link between the customer and the Internet. You dial
    into your ser-vice provider by modem or ISDN and the provider forwards all the
    data you call up to your com-puter.


    # Software


    All programs and data that can be stored are called software.


    # Source text


    The text describing an HTML file is called source text.


    # Special characters


    Special characters are all characters except A to Z and 0 to 9.


    # Surfing


    "Surfing" means switching from one Internet page to another.


    # Style sheet


    A style sheet is a template that can be called up in several HTML pages. This
    saves a lot of work because changes only need to be made to one file.


    # Tag


    An HTML file consists of normal text. To display other elements, you need to be
    able to differenti-ate these elements from the text. This is the purpose of tags.
    Tags appear in parentheses.


    # Telnet


    Telnet is a protocol that allows you to execute or control programs on other systems.
    This is a text-based protocol.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Text editor


    A text editor is used to create and alter text files. The “Notepad” program in
    Windows is an example.


    # Upload


    The opposite of downloading. In this case you transfer a file from your own computer
    to another one.


    # URL


    See Address.


    # VRML


    VRML stands for “Virtual Reality Modeling Language”. This can be used to represent
    virtual environments.


    # World Wide Web (WWW)


    The “World Wide Web” is probably the most interesting Internet service because
    all homepages can be found there.'
  merge: -1
  pgno: 294
