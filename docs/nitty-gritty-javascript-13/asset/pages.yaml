  md: '# # JavaScript

    Elmar Dellwig


    In this book you will find all you need to know how to handle JavaScript with
    confidence. Addison-Wesley Nitty Gritty JavaScript is designed to enable you to
    get to the heart of JavaScript via a clear and well-laid-format. You will learn
    dynamic web design from practical professional scripts that demonstrate the key
    functions of the various objects.


    Let''s get down to the nitty gritty of:


    +   - introduction to JavaScript

    - Crash course in HTML

    - Functions and Objects

    - Frames

    - Forms


    Addison-Wesley Nitty Gritty Programming Series provides the most important facts
    that you will need to know to get up and running in new programming topics quickly
    and when you have become proficient you can use it as an on-going reference book
    for all the fundamentals.


    Divided into 3 sections, this book provides everything you need to know to start
    programming in JavaScript.


    +   - Introduction – all the main topics you''ll need to begin working now.

    - Practical tips and tricks – find out how to put those important concepts into
    practice and get expert tips on how to improve your programming.

    - Reference section – all the necessary instructions and topics in one easy reference
    section so that you can refer back to the book again and again.


    Elmar Dellwig has been a computer enthusiast since the days of the C64 and is
    now an Information Technology tutor.


    ingo Dellwig is the founder of SPECTROsoftware, and produces homepages for companies
    for a variety of industries.


    # Nitty gritty n. the basic and most important facts, the essential substance
    or details.


    Visit us on the world wide web at

    www.it-minds.com


    Programming languages


