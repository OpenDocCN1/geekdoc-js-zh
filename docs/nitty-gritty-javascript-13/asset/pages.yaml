  md: 'In this case, the page would be divided into two columns. The width of the
    left column would be 20% of the full width of the browser window, while the right
    column would take up the remaining 80%. You can also specify the number of pixels
    directly. Another option is to use a relative specification in special syntax:


    ```

    <FRAMES ROWS=40,2,*>

    ```


    Three rows would be created in this example. The top one would be exactly 40 points
    high. The two bottom rows would share the rest of the screen in a ratio of 2:1:


    Each row or column must now be linked to an HTML page, otherwise you couldn''t
    display any content. That''s why you should insert the <FRAME> tag for each frame.
    The SRC attribute can be used to specify the file you want to appear in the frame.


    Just in case you''re a bit confused, let''s look at an example showing the options
    provided by a frame. First we need three files to display in the frames. For this
    you need to create three pages, a.htm, b.htm and c.htm, each of which should only
    display one letter. So the first page would look like this:


    ```

    <HTML>

    <HEAD>

    <TITLE>A</TITLE>

    </HEAD>

    <BODY>

    A

    </BODY>

    </HTML>

    ```


    For the other files you can simply replace the two As with Bs and Cs.


    We now need a page that can generate frames. We''ll just call it frame.htm:


    ```

    <HTML>

    <HEAD>

    <TITLE>Frames example</TITLE>

    </HEAD>

    <FRAMES ROWS=20%,80%>

    <FRAME SRC="a.htm">

    <FRAME SRC="b.htm">

    </FRAMES>

    </HTML>

    ```'
