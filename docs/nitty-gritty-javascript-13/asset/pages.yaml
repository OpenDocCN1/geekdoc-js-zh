  md: '# 2.2.9 parseInt()


    This transforms a string into an integer.

    This function was implemented in JavaScript 1.0.


    Syntax:


    ```

    parseInt(string[, base])

    ```


    Example:


    ```

    parseInt("F", 16)

    parseInt("17", 8)

    parseInt("15.99", 10)

    parseInt("15", 10)

    ```


    All of the examples above return the number 15. If a string that cannot be transformed,
    the function returns NaN.


