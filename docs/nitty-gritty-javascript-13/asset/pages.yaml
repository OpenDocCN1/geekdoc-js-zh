    # ## 1.10.2 Addressing specific frames


    Because the screen now contains several pages at the same time and all of these
    pages can contain links, you must remember a few things about links in a framed
    page.


    How is the browser to know which page is in which frame and to which page a link
    refers? It will always follow a simple rule because, unless otherwise specified,
    a new page appears in the frame in which the was activated. So if you insert the
    following link in the body of the a.htm page, the browser will display the c.htm
    file in the frame in which the a.htm page previously appeared.


    ```

    <HTML>

    <HEAD>

    <TITLE>A</TITLE>

    </HEAD>

    <BODY>

    <BR>

    <A HREF="c.htm">Go to page C.</A><BR>

    </BODY>

    </HTML>

    ```


    However, in many cases you will want to open a page in a different frame. This
