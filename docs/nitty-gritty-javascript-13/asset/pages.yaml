    # # C Form reference


    Because JavaScript controls form elements in most cases, we have compiled a short
    reference guide to the attributes of all form tags for you. The browser compatibility
    information is also important if you want to create compatible forms for several
    browsers.


    # ## C.1 <button>


    | TagAttribute | 2.0 | 3.0 | 3.2 | 4.0 | Internet Explorer | Netscape |

    |---|---|---|---|---|---|--|

    | <button> | | | | X | 4.0+ | |

    | accesskey | | | | X | 4.0+ | |

    | disabled | | | | X | 4.0+ | |

    | name | | | | X | 4.0+ | |

    | tabindex | | | | X | 4.0+ | |

