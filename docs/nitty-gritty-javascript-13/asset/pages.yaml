    This chapter contains scripts that you can use as a guideline when you start programming
    in JavaScript by yourself.


    > **Tip** The examples in this chapter are based on examples from the http://javascript.internet.com/
    website.


    # ##3.1 Cookies


    The following scripts save cookies (user data) locally on the hard disk.


    # ###3.1.1 Cookie for counter


    The following script creates a cookie that tells the user how often he has visited
    this page.


    ```

    <SCRIPT>

    function GetCookie(name) {

    var arg = name + "";

    var alen = arg.length;

    var clen = document.cookie.length;

    var i = 0;

    while (i < clen) {

    var j = i + alen;

    if (document.cookie.substring(i, j) == arg)

    return getCookie(j);

    i = document.cookie.indexOf("", i) + 1;

    }

    if (i == 0) break;

    ```'
