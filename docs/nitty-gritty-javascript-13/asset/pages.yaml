  md: '![](img/e34e97fd5b6c8c53a35b4a486b3caa85_44_0.png)


    Figure 1.14 Flowchart for an if query


    Example:


    ```

    if (x > y) document.write("x is greater than y");

    ```


    In this example, a check is made to show whether variable x is greater than variable
    y. If this is the case (in other words, the condition returns the value true),
    then document.write("x is greater than y") is executed. If x is not greater than
    y, then the document.write("x is greater than y") statement is simply skipped
    and the next command in the program is executed.


    If you want to execute more than one command after checking whether x is greater
    than y, you should enter all statements in parentheses following the if query.


    ```

    if (x > y) {

    document.write("x is greater than y");

    document.write("<BR> The value of x: " + x);

    document.write("<BR> The value of y: " + y);

    }

    ```


    If x is greater than y, then all commands in parentheses are executed. If x is
    not greater than y, then all statements in parentheses are skipped.


    We can also use the if query to make allowance for the fact that the condition
    of the if query may not be met. This is allow for where the else command is used,
    as shown below.'
