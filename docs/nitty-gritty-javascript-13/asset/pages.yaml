  md: '# accesskey


    You can use accesskey to define a shortcut for reaching the button. Assign a single
    letter to the attribute. This will now be executed when you press this key together
    with the relevant shortcut key. This key can vary, depending on which browser
    and operating system you use.


    # disabled


    This single attribute causes the button to be identified as inactive and suppresses
    the button''s function.


    # name


    Specifies the name of the button to enable it to be identified when transferred
    to scripts.


    # tabindex


    Specifies the tab index of the button. Positive values represent the position
    of the button in the list of objects that can be activated with. Negative values
    mean that the button does not occur in the tab index.


    # type


    This specifies which function the button is to perform in the form.


    | Value | Meaning |

    |---||

    | button | Defines the button as multifunctional. (A separate script is provided
    for the button.) |

    | reset | The button deletes the form. |

    | submit | The button submits the form data. |


    # value


    Specifies the value of the button to be transferred to the script when activated.


    # C.2 <fieldset>


    | Tag/Attribute | 2.0 | 3.0 | 3.2 | 4.0 | Internet Explorer | Netscape |

    |---|---|---|---|---|---||}{

    | <fieldset> | | | | X | 4.0B2 | |

    | align | | | | | 4.0 | |


    Groups together input elements from forms.'
  merge: -1
  pgno: 267
