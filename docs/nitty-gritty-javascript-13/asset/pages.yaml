    URL stands for the URL to be opened. windowName specifies the name of the new
    window and windowAttribute can contain several values from the following table
    separated by commas.


    | windowAttribute | Description |

    | alwaysLowered=yes|no | Always keeps the window in the background (yes/no). This
    attribute requires signed scripts. |

    | alwaysRaised=yes|no | Always keeps the window in the foreground (yes/no). This
    attribute requires signed scripts. |

    | dependent=yes|no | The window closes when the calling window is closed. (yes/no)
    |

    | directories=yes|no | Display the standard directory buttons in the browser (on/off).
    For example What''s new? |

    | height=pixel | Height in pixels. |

    | hotkeys=yes|no | Enable hotkeys (yes/no). |

    | inner=pixel | Height of the usable area in pixels. |

    | maxWidth=pixel | Width of the usable area in pixels. |

    | location=yes|no | Display the URL (on/off). |

    | menubar=yes|no | Menu bar (on/off). |

    | outerHeight=pixel | The height of the browser window in pixels. This attribute
    requires signed scripts. |

    | outerWidth=pixel | The width of the browser window in pixels. This attribute
    requires signed scripts. |

    | personalbar=yes|no | Bookmark bar (yes/no). |

    | resizable=yes|no | Is the user permitted to change the size of the window? (yes/no)
    |

    | screenX=pixel | The x position of the window in pixels. This attribute requires
    signed scripts. |

    | screenY=pixel | The y position of the window in pixels. This attribute requires
    signed scripts. |

    | scrollbars=yes|no | Scrollbars (on/off). |

    | status=yes|no | Status bar (on/off). |

    | title=yes|no | Window border and title bar (on/off). This attribute requires
