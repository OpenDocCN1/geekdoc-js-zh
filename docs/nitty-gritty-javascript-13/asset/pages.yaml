    | JavaScript 1.2 | Navigator 4.0–4.05 | Microsoft Internet Explorer 4.x |

    | JavaScript 1.3 | Navigator 4.06–4.73 | Microsoft Internet Explorer 5.x |


    Table 1.1 Which browsers support which JavaScript versions?


    INTRODUCTION 5'
