    # 1.4.5 Operators


    JavaScript has assignment, compare, arithmetic, bitwise, logical, string and special
    operators. One important thing about operators is the syntax. For example, let''s
    look at the increment operator (++). To increment a value before assignment, you
    use ++x (prefix); to increment the value after assignment, you write x++ (postfix).
    Let''s take a look at an example:


    ```

    var a, b, pref, postf;

    pre = 10;

    post = 10;

    a++pref;

    b=post++;

    ```


    pref and postf have value 10 to begin with. a++pref; just means: first increment
    by 1 and assign the result to a. a and pref therefore both have value 11 after
    the statement. b=post++; could therefore be translated as: assign to b the value
    of postf and increment postf by 1. Therefore the value of b after this statement
    is 10 and postf has the value 11.


    The following tables provide an overview of operators.'
