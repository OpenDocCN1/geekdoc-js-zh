  md: 'This tag sets the default font.


    <bdo>


    This tag stands for “bi-directional override”. It is used when an HTML document
    is to contain languages that read from left to right as well as languages that
    read from right to left.


    <bgsound>


    This tag allows you to play background music.


    <big>


    Text enclosed in <big> ... </big> appears in a larger font size.


    <blink>


    This tag is used to make the framed text block flash.


    <blockquote>


    This marks quotations. Quotations are usually indented both left and right.


    <body>


    This tag is responsible for structuring the HTML page at top level. All text and
    image elements should be enclosed by <body> ... </body> because global attributes
    are defined here that affect the whole HTML body.


    <br>


    This tag is used to force a line break.


    <button>


    This tag creates buttons in forms.


    # 3.3.4 C


    <caption>


    You can only use this tag within <table> ... </table>. This tag shares the same
    level as <tr>. It creates a table heading or caption for the entire width of the
    table.


    <center>


    This centers a text block together with all other HTML elements.


    <cite>'
