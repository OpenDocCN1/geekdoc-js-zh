  md: '# accesskey


    You can use accesskey to define a shortcut for reaching the form element. Assign
    a single letter to the attribute. This will now be executed when you press this
    key together with the relevant shortcut key. This key can vary, depending on which
    browser and operating system you use.


    # disabled


    This single attribute causes the form element to be identified as inactive and
    suppresses the element''s function.


    # height


    Specifies the height of the button in pixels.


    # name


    Specifies the name of the form element to enable it to be identified by scripts.
    The value of this attribute is also supplied when parsing the form.


    # tabindex


    Specifies the tab index of the form element. Positive values represent the position
    of the element in the list of objects that can be activated with (→). Negative
    values mean that the element does not occur in the tab index.


    # value


    Specifies the value returned to the script when this form has been activated.


    # width


    Specifies the width of the button in pixels.


