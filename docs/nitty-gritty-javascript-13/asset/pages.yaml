  md: '# 2.3 Event handlers


    This section contains all the information you will need to use event handlers.


    | Event | Event handler | Description |

    | --- | --- | --- |

    | Abort | onAbort | Executes JavaScript code if the user aborts an action. |

    | Blur | onBlur | Executes JavaScript code when an element in a form, window or
    frame loses focus. |

    | Change | onChange | Executes JavaScript code when a Select, Text or Textarea
    input fields focus and has its data changed. |

    | Click | onClick | Executes JavaScript code when the user clicks on an element
    in a form. |

    | DblClick | onDblClick | Executes JavaScript code when the user doubleclicks
    on an element in a form. |

    | DragDrop | onDragDrop | Executes JavaScript code when the user drags an object
    (a file, etc.) into the browser window and drops it. |

    | Error | onError | Executes JavaScript code when an error occurs while a document
    or image is loading. |

    | Focus | onFocus | Executes JavaScript code when an element is assigned focus.
    |

    | KeyDown | onKeyDown | Executes JavaScript code when the user presses down a
    key on the keyboard. |

    | KeyPress | onKeyPress | Executes JavaScript code when the user presses or holds
    down a key on the keyboard. |

    | KeyUp | onKeyUp | Executes JavaScript code when the user releases a key on the
    keyboard. |

    | Load | onLoad | Executes JavaScript code when the browser has finished loading
    a document or all the frames contained in a <FRAMSET> tag. |

    | MouseDown | onMouseDown | Executes JavaScript code when the user presses a mouse
    key. |

    | MouseMove | onMouseMove | Executes JavaScript code when the user moves the mouse.
    |

    | MouseOut | onMouseOut | Executes JavaScript code when the mouse cursor quits
    an area (image or link). The mouse cursor must have been inside the area prior
    to this. |'
