    # 1.10 Windows and frames


    Windows and frames? That''s right. The windows and frames that form an integral
    part of HTML earned a section to themselves in JavaScript. This is because they
    are the main area where JavaScript applications are used. Until now you have only
    been able to display one page at a time. It would, however, much more convenient
    if we could display several pages at once and move them about independently. That''s
    why frames were invented.


    # 1.10.1 Dividing a page into frames


    You must create three files in all when you want to divide a page into two frames.
    The first file defines the size and special features of the two frames. This page
    is called the frame generating page. The other two files are then loaded to the
    corresponding parts of the page. In other words each contains the contents of
    one frame.


    First lets look at the file responsible for the structure of the frame. An HTML
    file of this kind has a normal head, but does not need a body. Instead <FRAMESET>
    ... </FRAMESET> is inserted. This tells the browser that a frame is about to be
    defined.


    Because a frame can be divided horizontally or vertically, you should enter one
    of the following attributes in this tag: COLS or ROWS. COLS defines columns (horizontally
    separated frames) and ROWS defines rows (vertically separated frames).


    ```

    <FRAMESET COLS=20%, 80%>

    ```'
