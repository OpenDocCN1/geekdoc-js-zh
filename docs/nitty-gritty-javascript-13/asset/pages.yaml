    # 2.1.1 Anchor


    Anchor allows you to declare a text as a hypertext link within a document. Each
    object that was created with the HTML <A> tag and supports the NAME attribute
    or that was created using a String.anchor() method is stored in the document.anchors
    property. The following syntax is required to define an anchor object by means
    of the String.anchor() method:

    anyString.anchor(nameAttribute)


    If the Anchor object is also a link, then the object has an entry in both arrays.
    Anchor is implemented with effect from JavaScript 1.0 and the following additional
    properties were added in JavaScript 1.2: name, text, x and y (Table 2.1).'
