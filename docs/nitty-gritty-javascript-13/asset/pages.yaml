    This property was implemented in JavaScript 1.3.


    # 2.2.13 unescape()


    Transforms all characters in the specified string into normal ASCII characters
    and returns the resulting string. The string that is specified must contain a
    percentage symbol for each character to be transformed (%) as well as the hexadecimal
    value for the character from the ASCII table.

    This function was implemented in JavaScript 1.0.

    Syntax:

    uncapecape(string)


