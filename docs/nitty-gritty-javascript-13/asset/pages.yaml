  md: '# 3.3.2 A


    ```

    <a>

    ```


    The most important tag in HTML is <a> because (together with the attribute href)
    it defines a link to other HTML pages or other data. A text area or other object
    is defined as an anchor for the link.


    ```

    <abbr>

    ```


    This tag identifies abbreviations. This can be useful when using search engines
    for example.


    ```

    <acronym>

    ```


    This tag identifies acronyms. This can be useful when using search engines for
    example.


    ```

    <address>

    ```


    This tag is specially intended for framing addresses. The address is usually indented
    and displayed in italics.


    ```

    <applet>

    ```


    This tag allows you to incorporate Java applets. Browsers that support Java ignore
    all data enclosed by <applet> ... </applet> except for the <param> tag. In contrast,
    browsers that do not support Java ignore <applet> and the enclosed <param> tags.
    They display all other data contained in <applet> ... </applet>. The same applies
    if the Java applet causes an error and cannot be loaded.


    ```

    <a>

    ```


    You need this tag to create client-side image maps. You can create hot areas within
    these image maps.


    # 3.3.3 B


    ```

    <b>

    ```


    Text enclosed by <b> ... </b> appears in bold face.


    ```

    <base>

    ```


    This tag allows you to specify a basic default setting for href and target for
    all HTML elements on the page.


    ```

    <basefont>

    ```'
