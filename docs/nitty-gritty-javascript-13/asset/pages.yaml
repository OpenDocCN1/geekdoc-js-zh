  md: 'This marks quotations. This usually appear in italics.


    ```

    <code>

    ```


    You can use this tag to format source code. This is usually displayed in a non-portionate
    font.


    ```

    <col>

    ```


    This tag complements conventional tables. This is where you make table column
    settings. This tag is always contained within a <colgroup> ... </colgroup> configuration.
