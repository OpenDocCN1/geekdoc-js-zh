  md: '# 2.1.2 Applet


    An Applet object is defined by a normal HTML <APPLET> tag. JavaScript creates
    an entry in the document.applets[] array for every <APPLET> tag that it finds.
    To address the Applet object, you should assign a value to the NAME attribute
    of the <APPLET> tag when creating the object in HTML. You will now have no difficulty
    finding the Applet object you have just created in the array because all you have
    to do is search for the name.


    An Applet object inherits all properties defined in the public part of the Java
    applet.


    The same applies to the methods. All methods defined in the public part of the
    Java applet are inherited from the Applet object.


    Example:


    ```

    <APPLET CODE="Application.class" WIDTH=220 HEIGHT=100 NAME="myapplication" MAYSCRIPT></APPLET>

    ```


    The MAYSCRIPT attribute used in the example is needed to allow JavaScript to access
    the Java applet. If this attribute is not set, then an error occurs when you try
    to access the applet with JavaScript.


