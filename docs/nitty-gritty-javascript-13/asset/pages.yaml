    # 1.9 Forms with JavaScript


    If you have already created HTML forms in the past, the options for checking the
    data entered by users will no doubt have been frustrated by the fact that they
    were very limited. JavaScript''s event handler offers a unique opportunity for
    checking the basic correctness of the data (e.g. no letters in phone numbers,
    etc.) on the user''s computer before it is even sent. Normally this check can
    only be carried out with CGI scripts and requires a lot of network resources in
    many cases. This is because the form containing the incorrect data must first
    be sent by the user to the server and then checked for correctness before the
    user is prompted to re-enter the correct data. JavaScript enables the data entered
    to be checked on the user''s system, in other words before it is sent over the
    Internet, so that it only needs to be submitted once by the user.


    # 1.9.1 What is the point of forms?


    Forms have an important function in the WWW when it comes to communicating with
    the user. For example, forms are often used to allow users to register for particular
    activities or subscribe to particular offers.


    # 1.9.2 Creating forms


    Forms are created in the usual way using the normal commands available in HTML.


    ```

    <FORM

    ACTION="serverURL"

    ENctype="encryptionType"

    METHOD="GET" | "POST"

    NAME="formName"

    onReset="JavaScript code"

    ```'
