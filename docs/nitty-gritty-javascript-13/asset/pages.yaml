  md: 'align


    Specifies the horizontal alignment within the group.


    | Value | Meaning |

    |---|---|n| center | The contents are centered. |

    | left | The contents are aligned to the left. |

    | right | The contents are aligned to the right. |


    # C.3 <form>


    | Tag Attribute | 2.0 | 3.0 | 3.2 | 4.0 | Internet Explorer | Netscape |

    |---|---|---|---|---|---|---|n| <form> | X | X | X | | 1.0 | 1.0 |

    | accept | | | | X | | |

    | accept-charset | | | | | | |

    | action | X | X | X | | 1.0 | 1.0 |

    | autocomplete | | | | | 5.0 | | |

    | enctype | X | X | X | | 1.0 | 1.0 |

    | method | X | X | X | | 1.0 | 1.0 |

    | name | | | | | 3.0BI | 2.0 |

    | target | | | | X | 3.0AI | 2.0 |


    A form is created here. All form elements (for example <input>) are enclosed by
    <form> ... </form>.


    # accept


    Specifies the MIME formats that the form may send so that the script or server
    can react correctly. These formats are separated by commas.


    # accept-charset


    Specifies the character sets that the form may send. These are separated by commas.


    # action


    Specifies the address of the script or server that is to evaluate the form data.


    # autocomplete


    Switches the autocomplete function on (on) or off (off).'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# enctype


    Specifies the MIME media type in which the data is to be encrypted when sent.


    # method


    Specifies how the form is to send the data:


    | Value | Meaning |

    |---|---|

    | post | Here the data is sent directly to the script as a separate datastream.
    |

    | get | Here the data is appended to the URL and then transferred together with
    this to the target script. |


    # name


    This specifies the name of the form in order to address it by means of scripts
    and to alter it if necessary.


    # target


    This specifies the target frame in which the result data is to be displayed after
    the form data has been sent.


