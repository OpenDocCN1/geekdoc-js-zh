  md: '# 1.3 The basics of JavaScript


    This section will introduce you to JavaScript. It will explain how to write, save
    and run your first script. After this you will learn how to store data in variables
    and how to use these variables. But before we get carried away, let''s start with
    an example.


    # 1.3.1 Hello World!


    It is traditional for the first program in a new programming language to greet
    the world. That is what we are going to display the banner Hello World! on the
    screen. When you see these words displayed, you will have successfully generated
    and executed your first program. Let''s get to work


    Start your favorite text editor and enter the following lines.


    ```

    <HTML>

    <SCRIPT LANGUAGE="JavaScript">

    document.write("Hello World!");

    </SCRIPT>

    </HTML>

    ```


    As you already know, the <HTML> tag marks the HTML part of the document. To tell
    the browser that we have programmed a JavaScript, we must include the <SCRIPT>
    tag. The actual source text of the script appears between <SCRIPT> and </SCRIPT>.
    Because all we want to do is to insert the words Hello World into the HTML document
    by means of a JavaScript, we simply call the write function in the document class.
    We then later on will find out exactly what we mean by classes and functions.
    We''ll also look at the syntax in detail. For the moment, just take our word for
    it that the document.write("Hello World!"); line has precisely this effect.


    To see the result, we will have to save the script to the hard disk. If you haven''t
    done already, please create a folder named JS13 on your hard disk. Then save our
    first script in a file named HelloWorld.html.


    > Tip Remember that the source text must be saved in text format. If you save
    a script in Word format for example, additional control characters will be saved
    that will make an HTML file useless.


    ![](img/e34e97fd5b6c8c53a35b4a486b3caa85_28_0.png)'
