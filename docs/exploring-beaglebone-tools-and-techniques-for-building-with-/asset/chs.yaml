  \n## 注释\n\n# 第 4 章\n\n电子接口\n\n本章将介绍您需要正确且有效地将电子电路与 Beagle 板连接时所需的实用电子学知识。本章首先描述了一些有助于开发和调试电子电路的设备。接着提供了电路设计与分析的实用入门指南，鼓励您搭建电路并使用本章开头介绍的设备。然后讨论了可与\
  \ Beagle 板上的通用输入输出（GPIO）接口的典型分立元件，包括二极管、电容、晶体管、光耦合器、开关和逻辑门。最后，描述了模数转换（ADC）的重要原理，因为与\
  \ Beagle 板 ADC 接口需要这些知识。\n\n本章所需设备：\n\n*   本章所需元件（如需跟随操作）：完整列表见本章末尾。\n\n*   Digilent\
  \ Analog Discovery（版本 1 或 2）*或* 数字万用表、信号发生器和示波器。\n\n本章更多详细信息请访问[www.exploringbeaglebone.com/chapter4/](http://www.exploringbeaglebone.com/chapter4/)。\n\
  \n## 分析您的电路\n\n在为 Beagle 板开发电子电路时，拥有以下工具非常有用，这样您可以在将电路连接到板的输入/输出之前对其进行分析，以减少损坏板的风险。特别地，拥有数字万用表和混合信号示波器非常有用。\n\
  \n### 数字万用表\n\n数字万用表（DMM）是测量电路电压、电流和电阻/通断的宝贵工具。如果您还没有，请尽量购买具备以下功能的型号：\n\n*   **自动关机：**\
  \ 电池很容易浪费。\n\n*   **自动量程：** 能够选择不同的测量范围至关重要。中档万用表通常具有自动量程选择功能，可减少测量所需时间。\n\n*  \
  \ **通断测试：** 除非导体断开（或电阻过大），此功能应发出蜂鸣声。\n\n\n\n\n\n*   **真有效值读数：** 大多数低成本万用表采用平均值法计算交流（~）电流/电压。真有效值万用表通过真正的均方根（RMS）计算来处理读数，从而在读数时能够考虑波形失真。此功能对于分析相位控制设备、固态器件、电机驱动设备等非常有用。\n\
  *   **其他实用选项：** 这些选项并非严格必需，但很有帮助：背光显示屏、测量保持、大数字显示、更多有效数字、PC 连接（最好带光隔离）、温度探头和二极管测试。\n\
  *   **外壳：** 寻找质量良好的橡胶化塑料外壳。\n\n通常，上述大多数功能在中价位数字万用表（DMM）上都能找到，这些万用表具有较高的精度（1%或更好）、高输入阻抗（>10 MΩ）和良好的测量范围。高端万用表主要提供更快的测量速度和更高的测量精度；有些还可能提供测量电容、频率、使用红外传感器的温度、湿度以及晶体管增益等功能。一些最知名的品牌包括\
  \ Fluke、Tenma、Agilent、Extech 和 Klein Tools。\n\n### 示波器\n\n标准数字万用表为您提供了一种多功能工具，可以测量平均电压、电流和电阻。示波器通常只测量电压，但能让您看到电压随时间的变化。通常，您可以同时查看两个或多个在特定带宽和模拟采样数（内存）内捕获的电压波形。带宽定义了示波器能够准确测量的信号频率范围（通常到\
  \ 3 dB 点，即正弦波幅度比真实幅度低约 30%的频率点）。为了获得准确的结果，模拟采样数需要是带宽的倍数（您将在本章后面讨论奈奎斯特速率时了解原因）；对于现代示波器，这个值通常是带宽的四到五倍，因此一台\
  \ 25 MHz 的示波器应具有每秒 1 亿次采样或更高。带宽和模拟采样数对示波器成本的影响最大。\n\n市面上有几种低成本的双通道示波器，例如 Owon PDS5022S\
  \ 25 MHz（约 200 美元）、功能丰富的 Siglent SDS1022DL 25 MHz（约 325 美元）、Rigol DS1052 50 MHz（约\
  \ 325 美元）和 Owon SDS6062 60 MHz（约 349 美元）。随着带宽的增加，价格大幅上涨，300 MHz 的示波器价格约为 1500 美元。Agilent\
  \ 数字存储（DSOX）和混合信号（MSOX）系列示波器被视为中高端产品，价格从 3000 美元（100 MHz）到 16000 美元（1 GHz）不等。混合信号示波器还提供数字总线分析工具。\n\
  \n本书中所有电路均使用 Digilent Analog Discovery 2（带 Waveforms 软件，见图 4-1）进行测试。Analog Discovery（以及类似的\
  \ Analog Discovery 2）是一款适用于 Windows 环境的 USB 示波器、波形发生器、数字模式发生器和逻辑分析仪。最近发布的 Waveforms\
  \ 软件现已支持 Linux（包括 ARM）和 macOS。Analog Discovery 2 通常售价 279 美元。如果您刚开始学习或想重温电子技能，这款设备性价比极高。\n\
  \n![DWF 1 截图 – 任意波形发生器 1（上）和示波器（下），显示不同波形。](img/c04f001.jpg)\n\n**图 4-1****：** Waveforms\
  \ 应用程序生成信号并显示物理电路的响应\n\n本书中所有示波器图均使用 Analog Discovery 生成，因为所有示例都是通过实际电路实现的。该示波器仅限于两个通道，每个通道\
  \ 5 MHz，波形发生器和差分示波器的采样率均为每秒 5000 万次。因此，Analog Discovery 主要面向学生和学习者；不过，它也有助于您为下一台更昂贵的设备确定“必备”功能。\n\
  \n还有其他混合信号 USB 示波器，例如 PicoScopes，价格从 160 美元到 10000 美元不等（[`www.picotech.com`](http://www.picotech.com)），以及\
  \ BitScope DSO，价格从 150 美元到 1000 美元不等（[`www.bitscope.com`](http://www.bitscope.com)），支持\
  \ Linux。然而，基于当前 USB 示波器提供的功能集，一台带有 USB 逻辑分析仪的台式示波器可能是“性价比最高”的选择。\n\n## 基本电路原理\n\n\
  电子电路包含各种元件的组合，这些元件可分为无源元件和有源元件。有源元件（如晶体管）能够自适应地控制电流的流动，而无源元件（如电阻、电容、二极管）则不能。构建电路的挑战在于设计出合适元件的恰当组合。幸运的是，有一些电路分析方程可以帮助您。\n\
  \n### 电压、电流、电阻和欧姆定律\n\n您需要理解的最重要的方程是欧姆定律。其表述如下：\n\n![方程](img/c04-disp-0001.png)\n\
  \n其中：\n\n*   电压（*V*），单位为伏特（V），是迫使电流在电路中流动的势能差。用水类比来理解电压很有帮助：许多房屋的阁楼上有一个缓冲水箱，连接到屋内的水龙头。由于水箱的高度和重力作用，打开水龙头时水就会流出。如果水龙头与水箱顶部处于同一高度，则不会有水流出，因为没有势能。电压的行为与此类似；当元件（如电阻）一侧的电压高于另一侧时，电流就能流过该元件。\n\
  *   电流（*I*），单位为安培（A），是电荷的流动。继续用水类比，电流就是从水箱（高电位）流向水龙头（较低电位）的水流。请记住，水龙头仍然有电位，水会从水槽排水管流出，除非它处于地电位（GND）。为了理解电流的大小，当我们构建与\
  \ Beagle 板 GPIO 接口的电路时，它们通常仅提供或吸收约 5 mA，而 1 毫安等于千分之一安培。\n*   电阻（*R*），单位为欧姆（Ω），阻碍电荷的流动。电阻是一种通过消耗功率来减小电流的元件。它以线性方式工作，消耗的功率（单位为瓦特\
  \ W）由![公式](img/c04_i0001.png)给出，或者通过整合欧姆定律得到：![公式](img/c04_i0002.png)。功率以热量的形式耗散，所有电阻都有最大额定耗散功率。常见的金属膜或碳膜电阻通常耗散\
  \ 0.125 W 到 1 W，如果该值需要超过 3 W，价格会大幅上涨。最后用水类比，电阻就是水与管道之间的摩擦力，导致发热效应并减少水流。这种阻力可以通过增加水流经过的表面积（同时保持管道横截面积不变，例如在主水管内放置小管道）来增大。\n\
  \n\n\n\n举例来说，如果你需要购买一个电阻，用于在 5 V 电源下将电流限制在 100 mA，如图图 4-2(a)所示，你应该购买哪个电阻？电阻两端的电压降`V[R]`必须是\
  \ 5 V，因为它是电路中唯一的元件。由于![images](img/c04_i0003.png)，因此电阻的阻值应为![images](img/c04_i0004.png)，而该电阻消耗的功率可以使用任意通用公式![images](img/c04_i0005.png)计算得出，为\
  \ 0.5 W。\n\n![欧姆定律电路示例，包含一个电阻和一个标有 5V 的圆圈，圆圈内有一个由箭头组成的圆圈，标注为 IR = 100mA（左图）；以及分压器示例，包含两个电阻和一个标有\
  \ 5V 的圆圈（右图）。](img/c04f002.jpg)\n\n**图 4-2****：** (a) 欧姆定律电路示例，(b) 分压器示例\n\n购买一个通孔、固定阻值、1%公差（精度）的![images](img/c04_i0006.png)金属膜电阻，0.33 W\
  \ 规格的约需 0.10 美元，1 W 额定功率的约需 0.45 美元。你应当注意电路中使用的电阻的额定功率，因为额定功率不足的电阻可能会烧毁。一个 30 W\
  \ 的电阻售价 2.50 美元，并且会变得非常烫——并非所有电阻都生而平等！\n\n### 分压\n\n如果将图 4-2(a)中的电路修改为串联另一个电阻，如图图\
  \ 4-2(b)所示，会对电路产生什么影响？\n\n*   由于一个电阻接在另一个之后（它们串联），电流在电路中循环必须通过的总电阻是两个阻值之和：![images](img/c04_i0007.png)。\n\
  *   电源电压必须降落在两个电阻上，因此可以说![images](img/c04_i0008.png)。每个电阻上的电压降与该电阻的阻值成反比。这种电路称为*分压器*。\n\
  \n假设你想在纸上计算图 4-2(b)中`X`点的电压值，已知`R1` = 25 Ω，`R2` = 75 Ω。电路中的总电阻为![images](img/c04_i0009.png)，电阻上的总电压降必须为\
  \ 5 V；因此，利用欧姆定律，电路中流过的电流为`I = V/R` = 5 V/100 Ω = 50 mA。如果`R1`的阻值为 25 Ω，则![images](img/c04_i0010.png)上的电压降为，而![images](img/c04_i0011.png)上的电压降为。可以看到这些电压之和为\
  \ 5 V，从而遵循基尔霍夫电压定律，该定律指出串联电路中电压降之和等于施加的总电压。\n\n为了完整回答这个问题，在此电路中，`R1`上的电压降为 1.25 V，`R2`上的电压降为\
  \ 3.75 V，那么`X`点的电压是多少？要知道这一点，你必须相对于其他点来测量`X`！如果你相对于电源负极端子测量`X`，则电压降为图 4-2(b)中的`V[X]`，它与`R2`上的电压降相同，因此为\
  \ 3.75 V。然而，同样可以合理地问：“相对于电源正极端子，`X`点的电压是多少？”在这种情况下，它将是`R1`上电压降的负值（因为`X`相对于负极端子为\
  \ 3.75 V，而正极端子相对于负极端子为+5 V）；因此，相对于电源正极端子，`X`点的电压为−1.25 V。\n\n要计算图 4-2(b)中`V[X]`的值，分压规则可以概括如下：\n\
  \n![公式](img/c04-disp-0002.png)\n\n你可以使用此规则来确定电压`V[X]`，但遗憾的是，这种配置在实践中相当有限，因为连接到此电压源`V[X]`的电路本身很可能具有电阻（或负载）。这会改变分压电路的特性，从而改变电压`V[X]`。不过，大多数接在分压器之后的电路通常是具有非常高输入阻抗的输入电路，因此对`V[X]`的影响很小。\n\
  \n图 4-3(a)展示了一个可变电阻或电位器（pot），以及一个将其用作独立分压器的相关电路。引脚 1 和 3 之间的电阻是固定值，对于多圈电位器而言为 10 kΩ；然而，引脚\
  \ 3 与滑臂引脚（引脚 2）之间的电阻在 0 Ω到 10 kΩ之间变化。因此，如果引脚 2 和 3 之间的电阻为 2 kΩ，则引脚 1 和 2 之间的电阻将为\
  \ 10 kΩ − 2 kΩ = 8 kΩ。在这种情况下，输出电压`V[out]`将为 1 V，并且可以通过使用微调工具或螺丝刀转动电位器上的小螺丝，在 0 V\
  \ 到 5 V 之间变化。\n\n![图片由标题和周围文字描述。](img/c04f003.jpg)\n\n**图 4-3****：** (a) 电位器及使用可变电压源，(b)\
  \ 分流器示例\n\n### 分流\n\n如果将电路修改为如图图 4-3(b)所示，将两个电阻并联，则得到分流电路。电流将遵循最小电阻路径，因此如果`R1` =\
  \ 100 Ω，`R2` = 200 Ω，则更大比例的电流将流经`R1`。那么，这个比例是多少？在这种情况下，`R1`和`R2`两端的电压降均为 5 V。因此，电流`I[1]`将为`I\
  \ = V/R` = 5 V/100 Ω = 50 mA，而电流`I[2]`将为`I` = 5 V/200 Ω = 25 mA。因此，流经 100 Ω电阻的电流是流经\
  \ 200 Ω电阻的两倍。显然，电流偏爱最小电阻路径。\n\n基尔霍夫电流定律指出，流入一个节点的电流之和等于流出该节点的电流之和。这意味着`I[S] = I[1]\
  \ + I[2]` = 25 mA + 50 mA = 75 mA。分流规则可以一般性地表述如下：\n\n![公式](img/c04-disp-0003.png)，以及![公式](img/c04-disp-0004.png)\n\
  \n然而，这要求你知道进入节点的电流`I`（此处为`I[S]`）的值。要直接计算`I[S]`，你需要计算两个并联电阻的等效电阻（`R[T]`），其计算公式如下：\n\
  \n![公式](img/c04-disp-0005.png) 或 ![公式](img/c04-disp-0006.png)\n\n在图 4-3(b)中，该值为\
  \ 66.66 Ω；因此`I[S] = V/R` = 5 V/66.66 Ω = 75 mA，这与初始计算一致。\n\n电源提供的功率：![images](img/c04_i0012.png)\
  \ 这应等于![images](img/c04_i0013.png)和![images](img/c04_i0014.png)消耗的功率之和，总计 0.375 W，证实了能量守恒定律成立！\n\
  \n### 在面包板上实现电路\n\n面包板是原型电路开发的绝佳平台，并且与 Beagle 板完美配合。图 4-4 展示了一块面包板，描述了如何使用两条水平电源轨提供\
  \ 3.3 V 和 5 V 电源。Beagle 板上的 GPIO 排针通常是母头排针，这意味着你可以使用导线进行连接。\n\n![面包板示意图，带有 7408\
  \ IC（四路双输入与门），以及 3.3V 和 5V 电源轨。箭头指向桥接地线、地轨、芯片桥接中心轨、原型区域、放置不当的电阻等。](img/c04f004.jpg)\n\
  \n**图 4-4****：** 带有 7408 IC（四路双输入与门）的面包板\n\n\n\n像图 4-4 中那样的优质面包板（830 个连接点）价格约为 6\
  \ 到 10 美元。大型面包板（3220 个连接点）售价约 20 美元。以下是使用面包板的一些技巧：\n\n* 尽可能将 IC 的 1 号引脚放在左下角，这样便于调试电路。在施加压力并“咔嗒”按入到位之前，务必仔细将引脚与面包板孔对齐。另外，IC\
  \ 需要供电！\n* 断开导线与将其连接到 GND（本章后面讨论）是不同的。\n* 使用平头螺丝刀从两端缓慢地将 IC 从面包板上撬起，以避免弯曲 IC 的引脚。\n\
  * 注意不要将电阻和其他元件的两个引脚放在同一垂直导轨上，以免形成桥接。另外，在将电阻放入面包板之前，修剪其引线，因为过长的引线可能意外接触，导致电路调试困难。\n\
  * 瞬时按钮通常有四个引脚，两两相连；确保正确定向（使用 DMM 通断测试）。\n* 订书钉是极好的桥接工具！\n* 有些面包板的电源导轨有断开处；必要时需进行桥接。\n\
  * 面包板的连接点间距通常为 0.1 英寸（引脚间距），即公制 2.54 毫米。尽量购买具有相同间距的所有元件和连接器。对于 IC，选择 DIP/PDIP 封装（IC\
  \ 代码以 N 结尾）；对于其他元件，选择“通孔”形式。\n* 使用不同颜色的连接线表示特定含义——例如，红色代表 5 V，黑色代表 GND；这在调试电路时非常有帮助。实心\
  \ 22AWG 导线是理想的连接线，有多种不同颜色的绝缘层可供选择。也有预成型的跳线，但长导线会导致电路杂乱。选择不同颜色的连接线和优质剥线工具，才能实现最整洁、最稳定的面包板布局。\n\
  \n### 数字万用表与面包板\n\n在考虑一些规则后（参考图 4-6），测量电压、电流和电阻相当直接：\n\n* **直流电压**（DCV）的测量是与承受电压降的元件并联（即跨接）。万用表的黑表笔应插入\
  \ COM（公共）输入端。\n* **直流电流**（DCA）的测量是串联进行的，因此你需要“断开”电路中的连接，并将万用表像串联元件一样接入你正在测量电流的电路中。使用\
  \ COM 端的黑表笔和μAmA 输入端（或等效端）的红表笔。不要使用 10 A 无保险丝输入端。\n* **电阻**通常不能在电路中进行测量，因为其他电阻或元件会在测量中充当并联/串联负载。隔离该元件，将万用表红表笔插入\
  \ VΩ输入端，并将万用表设置为测量Ω。通断测试可以在断电的电路中合理有效地使用。\n\n![面包板示意图，展示了直流电压（并联导线）、直流电流（串联导线及错误导线位置）和电阻（错误导线位置及并联导线）的测量。](img/c04f006.jpg)\n\
  \n**图 4-6：** 测量电压、电流和电阻\n\n如果万用表无法工作，可能是内部保险丝烧断了。断开万用表表笔，打开万用表找到小型玻璃保险丝。如果你有另一块万用表，可以进行通断测试以判断保险丝是否烧断。用相同规格（或\
  \ PTC）的保险丝更换——不要使用市电保险丝！\n\n### 示例电路：电压调节\n\n现在你已经了解了原理，本节将讨论一个更复杂的电路，然后在后续章节中详细分析各个元件。不要在本节中搭建电路；它仅作为介绍互联元件概念的示例。\n\
  \n电压调节器是一种复杂但易于使用的器件，它接受变化的输入电压，并输出几乎与所接负载无关的恒定电压，且输出电压低于输入电压。电压调节器将输出电压维持在一定容差范围内，防止电压波动损坏下游电子设备。\n\
  \nBeagle 板具有先进的电源管理 IC（PMIC），可以在不同输出引脚上为不同设备提供不同电压等级。例如，有 5 V 输出、3.3 V 输出以及用于模数转换器的\
  \ 1.8 V 参考电压。你可以使用板上的 5 V 和 3.3 V 电源来驱动你的电路，但仅限于一定的电流供应限制内。如果 BBB 通过 5 V 插孔连接到直流电源，则\
  \ P9 排针（引脚 5 和 6）上的`VDD_5V`引脚可提供高达 1 A 的电流，而`DC_3.3V`引脚（引脚 3 和 4）可提供 250 mA 的电流。\n\
  \n如果你需要为驱动电机等应用抽取更大电流，可能需要使用像图 4-7 中那样的电压调节器。你可以直接在面包板上搭建，也可以从 SparkFun（[`www.sparkfun.com`](http://www.sparkfun.com)）购买“面包板电源棒\
  \ 5 V/3.3 V”，价格约 15 美元。\n\n![图片描述见标题及周围文字。](img/c04f007.jpg)\n\n**图 4-7：** (a) KA7805A/LM7805\
  \ 电压调节器，(b) 示例调节电路\n\n如图 4-7 所示，调节器左侧的引脚是电压供应输入。当输出 500 mA 电流时，KA7805/LM7805 电压调节器可接受\
  \ 8 V–20 V 的输入电压范围，并在右侧输出 4.8 V–5.2 V 范围内的电压。中间引脚应连接到地线导轨。电压调节器背面的铝板用于散热。其上的孔允许你安装散热器，从而实现高达\
  \ 1 A 的更大输出电流。\n\n驱动 KA7805/LM7805 电压调节器所需的最小输入电压约为 8 V。如果你的电源电压低于此值，则可以使用低压差（LDO）电压调节器，它仅需低至\
  \ 6 V 的电源即可驱动 5 V 调节器。图 4-7 中的实现电路包含以下附加元件，使其能够提供干净稳定的 5 V、1 A 电源：\n\n* 二极管确保如果电源极性接反（例如意外交换\
  \ 9 V 和 GND），电路免受损坏。像 1N4001（1 A 电源）这样的二极管成本非常低，但缺点是调节器前端的二极管上会有较小的正向压降（1 A 时约为\
  \ 1 V）。\n* 开关可用于接通或断开电路电源。滑动开关可使电路保持持续通电。\n* 正温度系数（PTC）可复位保险丝有助于防止过电流故障（如意外短路或元件故障）造成的损坏。PTC\
  \ 允许保持电流通过，仅产生很小的电阻（约 0.25 Ω）；但一旦超过更大的跳闸电流，电阻会迅速增大，类似于断路器。断电后，PTC 会冷却（几秒钟），并恢复跳闸前的特性。在此电路中，使用\
  \ 60R110 或等效的 Polyfuse 是合适的，因为它在最大 60 V 直流电压下具有 1.1 A 的保持电流和 2.2 A 的跳闸电流。\n* 0.33 μF\
  \ 电容器位于调节器的电源侧，0.1 μF 电容器位于调节器的输出侧。这些是数据手册中推荐的用于消除电源噪声（纹波抑制）的数值。电容器将在稍后讨论。\n\n\n\
  \n\n\nLED 和合适的限流电阻提供了一个指示灯，当电源供电时，该灯会清晰显示。\n\n## 分立元件\n\n前面的示例电路使用了许多分立元件来构建一个独立的电源电路。本节将更详细地讨论构成电源电路的元件类型。这些元件可应用于许多不同的电路设计，现在讨论它们很重要，因为其中许多元件用于设计\
  \ 第 6 章 中与 Beagle 板输入/输出接口的电路。\n\n### 二极管\n\n简单来说，二极管是一种分立半导体元件，允许电流单向通过，而反向则不能。顾名思义，“半”导体既不是导体也不是绝缘体。硅是一种半导体材料，但当它掺杂了磷等杂质时，会变得更有趣。这种负（n\
  \ 型）掺杂会在价带中产生一个弱束缚电子。它也可以进行正掺杂（p 型），使用硼等杂质在价带中产生一个空穴。当将一小块 p 型和 n 型掺杂的硅连接在一起时，就得到了一个\
  \ pn 结——一个二极管！n 型硅价带中的自由电子流向 p 型硅，形成一个耗尽层和一个电压势垒，必须克服这个势垒才能让电流流动。\n\n当二极管正向偏置时，它允许电流通过；当反向偏置时，没有电流能通过。当阳极（`+ve`）端的电压大于阴极（`-ve`）端的电压时，二极管处于正向偏置；然而，偏置还必须超过耗尽层势垒（膝点电压）才能让电流流动，对于硅二极管，这个电压通常在\
  \ 0.5 V 到 0.7 V 之间。如果通过在阴极施加比阳极更大的电压来使二极管反向偏置，那么几乎没有电流能通过（大约 1 nA）。然而，如果反向偏置电压不断增加，最终二极管会击穿，允许电流反向流动。如果电流很小，这不会损坏二极管——事实上，有一种特殊的二极管叫做齐纳二极管，它被设计成工作在这个击穿区域，并且可以配置成类似稳压器的行为。\n\
  \n1N4001 是一种低成本硅二极管，可用于一个简单电路（参见 图 4-8）来演示二极管的使用和行为。1N4001 的峰值反向击穿电压为 50 V。在该电路中，使用\
  \ Analog Discovery 的波形发生器施加一个从 +5 V 到 −5 V 交替的正弦波。当 `V[in]` 电压为正且超过膝点电压时，电流会流动，负载电阻\
  \ `V[load]` 上会有电压降，略低于 `V[in]`。二极管 `V[d]` 上有一个小的电压降，从示波器测量中可以看到这是 0.67 V，这在硅二极管的预期范围内。\n\
  \n![电路图由电压源、二极管和电阻组成 (a)，以及 DFW 1 – 示波器 1 – 缩放 1 的截图，显示一个正弦波与一条上升-下降曲线相交的图形 (b)。](img/c04f008.jpg)\n\
  \n**图 4-8****：** 1N4001 二极管在 5 V 交流电源和 1 kΩ 负载电阻下的电路与行为\n\n该二极管在 图 4-7 的电路中用作反极性保护器。从\
  \ 图 4-8 的图中可以清楚看出其有效性，因为当 `V[in]` 为负时，`V[load]` 为零。这是因为当二极管反向偏置时，电流无法通过。如果电压超过二极管的击穿电压，电流就会流动；但由于\
  \ 1N4001 的击穿电压为 50 V，在这种情况下不会发生。注意，图 4-8 的右下角显示了一个输出电压（*y* 轴）与输入电压（*x* 轴）的 XY 图。可以看到，对于负输入电压，输出电压为\
  \ 0，但一旦达到膝点电压（0.67 V），输出电压随输入电压线性增加。这个电路被称为*半波整流器*。可以将四个二极管连接成桥式结构来创建一个全波整流器。\n\n\
  ### 发光二极管\n\n发光二极管（LED）是一种基于半导体的光源，常用于各种设备中的状态指示灯。如今，高功率 LED 被用于汽车灯、电视背光，甚至取代白炽灯用于通用照明（例如家庭照明、交通灯等），主要是因为其寿命长且将电能转换为光输出的效率极高。LED\
  \ 提供有关电路的有用状态和调试信息，通常用于指示状态是真还是假。\n\n与二极管一样，LED 是有极性的。LED 的符号如 图 4-9 所示。要使 LED 发光，需要将阳极（+）连接到比阴极（−）更正极的电源，从而使二极管正向偏置。例如，阳极可以连接到\
  \ +3.3 V，阴极连接到 GND；但也要记住，将阳极连接到 0 V 而阴极连接到 −3.3 V 也能达到同样的效果。\n\n![图像由标题和周围文字描述。](img/c04f009.jpg)\n\
  \n**图 4-9****：** 一个 LED 示例以及驱动 LED 并使其具有适当正向电流和电压水平的电路\n\n图 4-9 展示了一个 LED，其一条腿比另一条长。较长的腿是阳极（+），较短的腿是阴极（−）。LED\
  \ 的塑料外壳还有一个平边，指示 LED 的阴极（−）腿。当 LED 在电路中且引脚已被剪短时，这个平边指示特别有用。\n\nLED 有特定的工作需求，由正向电压和正向电流定义。每个\
  \ LED 都不同，需要查阅 LED 的数据手册来确定这些值。LED 没有显著的电阻，因此如果直接将 LED 连接到 Beagle 板的 3.3 V 电源上，LED\
  \ 会像短路一样，导致大电流通过 LED，损坏它——但更重要的是，损坏你的板子！因此，为了在 LED 的极限范围内工作，需要一个串联电阻，称为*限流电阻*。仔细选择这个值，以最大化\
  \ LED 的光输出并保护电路。\n\n参考 图 4-9，如果你从 Beagle 板的 3.3 V 电源为 LED 供电，并且希望 LED 上的正向压降为 1.3 V，那么需要将\
  \ 2 V 的差值降在限流电阻上。LED 规格要求将电流限制在 9 mA，因此需要按如下方式计算限流电阻值：\n\n由于 *V* = *IR*，则 *R* =\
  \ *V*/*I* = 2 V / 0.009 A = 222 Ω\n\n因此，点亮 LED 的电路应如 图 4-9 所示。这里将一个 220 Ω 电阻与 LED\
  \ 串联。3.3 V 电源和电阻的组合驱动 9 mA 电流通过正向偏置的 LED；由于该电流在电阻上产生 2 V 压降，相应地，LED 上的正向压降为 1.3 V。请注意，如果连接到\
  \ BBB 的 `DC_3.3V` 输出，这是可以的，但*不*适用于 BBB 的 GPIO，因为 BBB 从 GPIO 引脚提供的最大电流约为 4–6 mA。稍后你将看到解决方案，并在\
  \ 第 6 章 中再次看到。\n\n\n\n\n另外值得一提的是，不应通过降低 LED 两端的电压来调暗 LED。LED 应被视为电流控制器件，驱动电流通过 LED\
  \ 会导致正向压降。因此，尝试用可变电压控制 LED 不会达到预期效果。要调暗 LED，可以使用脉冲宽度调制（PWM）信号，即快速开关 LED。例如，如果对 LED\
  \ 施加一个快速 PWM 信号，其中一半时间关闭、一半时间开启，那么 LED 看起来只会发出约一半正常工作条件下的光强。如果变化足够快，我们的眼睛不会察觉到单个变化；它们会平均明暗间隔，从而看到恒定但较暗的照明。\n\
  \n图 4-10 展示了不同占空比下的 PWM 方波信号。占空比是指信号高电平时间与低电平时间的百分比。在此示例中，高电平表示为 3.3 V 电压，低电平表示为\
  \ 0 V 电压。占空比为 0% 表示信号始终为低电平，占空比为 100% 表示信号始终为高电平。\n\n![电压随时间变化的图表，分别对应 25% 占空比（左）、50%\
  \ 占空比（中）和 75% 占空比（右），显示为粗、更粗、最粗的垂直条。](img/c04f010.jpg)\n\n**图 4-10****：** 脉冲宽度调制（PWM）信号的占空比\n\
  \nPWM 可用于控制 LED 的光强，也可用于控制直流电机的速度、伺服电机的位置以及更多应用。你将在第 6 章中看到这样一个示例，届时将使用 Beagle 板的内置\
  \ PWM 功能。\n\n重复信号（周期信号）的周期（`T`）是完成一个完整周期所需的时间。在图 4-10 的示例中，三种情况下信号的周期均为 4 ms。周期信号的频率（`f`）描述信号在给定时间内完成完整周期的次数。因此，对于周期为\
  \ 4 ms 的信号，它每秒循环 250 次（1/0.004），即 250 赫兹（Hz）。我们可以表述为 `f(Hz) = 1/T(s)` 或 `T(s) =\
  \ 1/f(Hz)`。一些高端数字万用表可以测量频率，但通常使用示波器来测量频率。PWM 信号需要以适合被控器件的频率进行切换；通常，电机控制的频率在 kHz\
  \ 范围内。\n\n### 平滑电容与去耦电容\n\n电容是一种无源电子元件，当两个绝缘板之间存在电压差时，可用于在两个绝缘板之间存储电能。能量存储在两个板之间的电场中，正电荷积聚在一个板上，负电荷积聚在另一个板上。当电压差被移除或降低时，电容会将其能量释放到连接的电路中。\n\
  \n例如，如果你修改图 4-8(a) 中的二极管电路，在负载电阻上并联一个 10 μF 的平滑电容，输出电压将如图 4-11 所示。当二极管正向偏置时，电容两端存在电位差，它会快速充电（同时电流也流过并联的负载电阻）。当二极管反向偏置时，没有外部电源在电容/电阻组合两端产生电位差，因此电容两端的电位（由于其电荷）会导致电流流过负载电阻，电容开始放电。这种变化的影响是，负载电阻两端的电压现在更加稳定，在\
  \ 2.758 V 和 4.222 V 之间变化（纹波电压为 1.464 V），而不是在 0 V 和 4.34 V 之间变化。\n\n![电路图包含电压源、二极管和电阻（左），以及\
  \ DWF 1 – 示波器 1 – 缩放 1 的截图，显示带有标记为 Vload 和 Vin 的相交曲线的图表（右）。](img/c04f011.jpg)\n\n\
  **图 4-11****：** 1N4001 二极管在 5 V 交流电源、1 kΩ 负载和并联 10 μF 电容下的电路与行为\n\n电容使用介电材料（如陶瓷、玻璃、纸或塑料）来绝缘两个带电板。两种常见的电容类型是陶瓷电容和电解电容。陶瓷电容体积小、成本低，但会随时间退化。电解电容可以存储更多能量，但也会随时间退化。玻璃、云母和钽电容通常更可靠，但价格昂贵得多。\n\
  \n图 4-12 展示了一个 100 nF（0.1 μF）的陶瓷电容和一个 47 μF 的电解电容。注意电解电容是有极性的，负极引线在电容表面用带子标记；与 LED\
  \ 类似，负极引线比正极引线短。\n\n![图像由标题和周围文字描述。](img/c04f012.jpg)\n\n**图 4-12****：** 陶瓷（无极性）和电解（有极性）电容，以及一个示例去耦电路\n\
  \n电容的编号相当直接；不幸的是，在陶瓷电容上，编号可能很小且难以辨认。\n\n*   第一个数字是电容值的第一位数字。\n*   第二个数字是电容值的第二位数字。\n\
  *   第三个数字是零的个数，电容值单位为 pF（皮法）。\n*   附加字母代表电容的容差和额定电压，但暂时可以忽略。\n\n因此，例如：\n\n*   104\
  \ = 100000 pF = 100 nF = 0.1 μF\n*   102 = 1,000 pF = 1 nF\n*   472 = 4,700 pF =\
  \ 4.7 nF\n\n前面介绍的稳压电路（参见图 4-7）使用了两个电容，通过充放电来抵消电源中的纹波。电容还可用于一种相关功能，称为*去耦*。\n\n耦合通常是电路中两个部分之间因共享电源连接而产生的不良关系。这种关系意味着，如果电路某一部分突然需要高功率，电源电压会略微下降，从而影响电路其他部分的供电电压。集成电路（IC）会在电源线上施加可变负载——实际上，快速变化的负载会导致其他\
  \ IC 的电源线上出现高频电压波动。随着电路中 IC 数量的增加，问题会变得更加复杂。\n\n小型电容，称为*去耦电容*，可以作为能量存储元件，消除因 IC\
  \ 负载变化而可能出现在电源线上的噪声信号。图 4-12 展示了一个示例电路，其中较大的 47 μF 电容滤除较低频率的变化，而 0.1 μF 电容滤除较高频率的噪声。理想情况下，0.1 μF\
  \ 电容的引线应尽可能短，以避免产生不良效应（与电感相关），从而限制其滤除最高频率的能力。即使是 Beagle 板上用于对 AM335x 的球栅阵列（BGA）引脚进行去耦的表面贴装电容，也会产生约\
  \ 1–2 nH 的小电感。因此，建议每两个电源球使用一个 0.1 μF 电容，并且走线（板级线路）必须“尽可能短”（Texas Instruments, 2011）。完整指南请参见\
  \ [`tiny.cc/beagle402`](http://tiny.cc/beagle402)。\n\n### 晶体管\n\n\n\n\n晶体管是 AM335x\
  \ 微处理器的核心组成部分之一，实际上几乎所有其他电子系统也是如此。简单来说，它们的功能可以是放大信号，或者根据需要打开或关闭信号。Beagle 板的 GPIO\
  \ 只能处理较小的电流，因此当我们需要将它们与需要更大电流才能运行的电子电路连接时，就需要借助晶体管。\n\n双极结型晶体管（BJT），通常简称为*晶体管*，是通过在\
  \ pn 结二极管上再添加一个掺杂层形成的，构成 p-n-p 或 n-p-n 型晶体管。还有其他类型的晶体管，例如场效应晶体管（FET），稍后会讨论。*双极*这个名称源于电流由电子和空穴共同承载的事实。它们有三个端子，第三个端子连接到夹层结构的中间层，该层非常窄，如图\
  \ 4-13 所示。\n\n![Image described by caption and surrounding text.](img/c04f013.jpg)\n\
  \n**图 4-13****：** 双极结型晶体管（BJT）\n\n图 4-13 展示了关于晶体管的大量信息，包括各端子的命名：基极（B）、集电极（C）和发射极（E）。尽管\
  \ BJT 晶体管主要有两种类型（NPN 和 PNP），但 NPN 晶体管是最常用的。实际上，本章中的所有晶体管示例都使用单一的 BC547 NPN 晶体管类型。\n\
  \nBC547 是一款 45 V、100 mA 的通用晶体管，常见、低成本，并采用带引线的 TO-92 封装。BC547 管脚的识别方法已在图 4-13 中给出，但请注意，这种顺序并非适用于所有晶体管——务必查阅数据手册！BC547\
  \ 的最大`V[CE]`（也称为`V[CEO]`）为 45 V，最大集电极电流（`I[C]`）为 100 mA。其典型直流电流增益（`h[FE]`）在 180\
  \ 到 520 之间，具体取决于所使用的分组（例如 A、B、C）。这些特性将在后续章节中解释。\n\n#### *晶体管作为开关*\n\n让我们分析图 4-13（最右侧示意图）中所示的\
  \ NPN 晶体管特性。如果基极-发射极结正向偏置，并且有少量电流进入基极（`I[B]`），晶体管的行为是：一个成比例但大得多的电流（![images](img/c04_i0015.png)）将被允许流入集电极端子，因为对于像\
  \ BC547 这样的晶体管，`h[FE]`的值在 180 到 520 之间。由于`I[B]`远小于`I[C]`，你也可以认为`I[E]`近似等于`I[C]`。\n\
  \n图 4-14 展示了 BJT 用作开关的示例。在(a)部分中，电压电平被选择为与 Beagle 板上可用的电压相匹配。基极电阻选择为 2.2 kΩ，以便基极电流较小（![images](img/c04_i0016.png)，约为\
  \ 1.2 mA）。集电极电阻较小，因此集电极电流将相当大（![images](img/c04_i0017.png)）。\n\n![Image described\
  \ by caption and surrounding text.](img/c04f014.jpg)\n\n**图 4-14****：** BJT 作为开关\n\
  \n图 4-14(b)展示了当 3.3 V 的输入电压施加到基极端子时发生的情况。较小的基极电流使晶体管表现为集电极与发射极之间的闭合开关（电阻非常低）。这意味着集电极-发射极之间的压降几乎为零，所有电压都降落在\
  \ 100 Ω的负载电阻上，导致电流通过发射极直接流向地。晶体管处于饱和状态，因为它无法通过更多电流。由于集电极-发射极之间几乎没有压降，输出电压`V[out]`将几乎为\
  \ 0 V。\n\n图 4-14(c)展示了当输入电压`V[in]` = 0 V 施加到基极端子且没有基极电流时发生的情况。晶体管表现为一个断开开关（电阻非常大）。没有电流能流过集电极-发射极结，因为该电流始终是基极电流的倍数，而基极电流为零；因此，几乎所有电压都降落在集电极-发射极之间。在这种情况下，输出`V[out]`可高达+5 V（不过，正如通过输出端子流过的`I[C]`所示，`V[out]`的确切值取决于`I[C]`的大小，因为任何流过\
  \ 100 Ω电阻的电流都会在其上产生压降）。\n\n因此，该开关的行为有点像反相器。如果输入电压为 0 V，输出电压为+5 V；如果输入电压为+3.3 V，输出电压将为\
  \ 0 V。你可以在图 4-15 中看到该电路的实际测量值，此时 3.3 V 的输入电压施加到基极端子。在此情况下，使用 Analog Discovery 波形发生器输出一个\
  \ 1 kHz 的方波，幅度为 1.65 V，偏移量为+1.65 V（形成 0 V 至 3.3 V 的方波信号），因此它看起来像一个 3.3 V 的电源每秒开启和关闭\
  \ 1000 次。该图中的所有测量值都是在输入为 3.3 V 时捕获的。基极-发射极结正向偏置，就像之前的二极管一样，其正向电压约为 0.7 V。基极-发射极之间的实际压降为\
  \ 0.83 V，因此基极电阻上的压降为 2.440 V。实际基极电流为 1.1 mA（![images](img/c04_i0018.png)）。该电流使晶体管导通，使其进入饱和状态，因此集电极-发射极之间的压降非常小（测量值为\
  \ 0.2 V）。因此，集电极电流为 49.8 mA（![images](img/c04_i0019.png)）。为了选择合适的基极电阻使 BJT 深度饱和，请使用以下实用公式：\n\
  \n![equation](img/c04-disp-0007.png) ![Left: Circuit diagram with 2 resistors labeled\
  \ 2.185kΩ and 96Ω, a ground, 3 downward arrows labeled IC, IB, and IE, etc. Right:\
  \ DWF 1 Oscilloscope 1 – Zoom 1 window displaying 2 square waves labeled IC = 49.8\
  \ and IB = 1.10 mA.](img/c04f015.jpg)\n\n**图 4-15****：** 晶体管作为开关（饱和）的实现，并确认所有关系成立^(1)\n\
  \n对于基极电源为 3.3 V、集电极电流为 50 mA 且最小增益`h[FE(min)]`为 100 的情况，![equation](img/c04_i0027.png)。\n\
  \n你可以在晶体管的数据手册中找到所有这些值。`V[BE(sat)]`通常以室温下`V[BE]`与`I[C]`的关系图形式提供，其中我们需要`I[C]`为 50 mA。对于\
  \ BC547，`V[BE(sat)]`的值在 0.6 V 到 0.95 V 之间，具体取决于集电极电流和室温。电阻值进一步除以 2，以确保晶体管深度饱和（最大化`I[C]`）。因此，在此情况下使用了\
  \ 2.2 kΩ电阻，因为它是最接近的常用标称值。\n\n\n\n\n为什么你应该关心比格犬板（Beagle boards）的这个特性？因为这些板子的 GPIO\
  \ 引脚只能提供或吸收非常小的电流，你可以将 GPIO 引脚连接到晶体管的基极，这样进入基极的小电流就能切换一个更大电流、电压范围更宽的电路。请记住，在图 4-15\
  \ 的示例中，1.1 mA 的电流能够切换 49.8 mA 的大电流（大了 45 倍，但仍低于 BC547 的 100 mA 限制）。将这种晶体管配置与比格犬板一起使用，通过选择合适的电阻值，可以让\
  \ GPIO 输出的 3.3 V、5 mA 电流安全地驱动高达 45 V、100 mA 的电流。\n\n使用晶体管驱动电路的一个限制是它们有最大开关频率。如果你将图\
  \ 4-16 中电路的输入信号频率提高到 500 kHz，输出会失真，尽管它仍然能从低电平切换到高电平。然而，将频率提高到 1 MHz 意味着受控电路将永远不会关断。\n\
  \n![两张截图，分别显示 500 kHz（左）和 1 MHz（右）的 BJT 开关频率，分别展示两个相交波形和两个分离波形。](img/c04f016.jpg)\n\
  \n**图 4-16****：** BJT 电路的频率响应（频率为 500 kHz 和 1 MHz）\n\n#### *场效应管作为开关*\n\n使用场效应管（FET）作为开关是比使用\
  \ BJT 更简单的替代方案。FET 与 BJT 的不同之处在于，负载电路中的电流是由控制输入端的电压而非电流控制的。因此，FET 被称为电压控制器件，而 BJT\
  \ 是电流控制器件。FET 的控制输入端称为*栅极*（G），受控电流在漏极（D）和源极（S）之间流动。\n\n图 4-17 说明了如何将 N 沟道 FET 用作开关。与\
  \ BJT 不同，控制电路中的电阻（1 MΩ）从输入端连接到 GND，这意味着会有非常小的电流（`I = V/R`）流向 GND，但栅极电压将与 `V[in]`\
  \ 电压相同。FET 的一个显著优势是几乎没有电流流入栅极控制输入端。然而，栅极上的电压控制着受控电流 `I[D]` 的导通与关断，在本例中该电流从漏极流向源极。\n\
  \n![BS270 FET 作为开关的三个电路图：BS270→ 开关导通、BS270→ 开关关断（从左到右）。](img/c04f017.jpg)\n\n**图\
  \ 4-17****：** 场效应管作为开关\n\n当输入电压为高电平（3.3 V）时，漏源电流会流动（`I[D]` = 50 mA），因此输出端的电压为 0.17 V；但当输入电压为低电平（0 V）时，没有漏源电流流动。与\
  \ BJT 类似，如果你测量漏极端的电压，当输入电压为低时输出电压（`V[out]`）为高，当输入电压为高时输出电压为低，不过“高”输出电压的实际值取决于后续电路所汲取的电流。\n\
  \n飞兆半导体 BS270 N 沟道增强型 FET 是一款低成本器件（约 0.10 美元），采用 TO-92 封装，能够在漏源电压高达 60 V 时提供高达 400 mA\
  \ 的连续漏极电流（`I[D]`）。然而，在栅极电压（`V[G]`）为 3.3 V 时，BS270 可以切换的最大漏极电流约为 130 mA。这使得它非常适合与比格犬板一起使用，因为\
  \ GPIO 电压在范围内，并且导通 FET 所需的电流约为 3 μA–6 μA，具体取决于所选的栅极电阻。使用 FET 作为开关的另一个特点是它能处理更高的开关频率，如图\
  \ 4-18 所示。请记住，在图 4-16 中，BJT 的开关波形在 1 MHz 时严重失真。从图 4-18 可以清楚地看出，FET 电路能够处理比 BJT 电路高得多的开关频率。\n\
  \n![两张窗口截图，显示 FET 电路的频率响应，开关频率分别设置为 1（左）和 5（右）MHz，均显示两个波形，标记为 ID (mA) 和 VG (V)。](img/c04f018.jpg)\n\
  \n**图 4-18****：** FET 电路的频率响应，开关频率设置为 1 MHz 和 5 MHz\n\nBS270 还带有一个大电流二极管，用于保护栅极免受反向感应电压浪涌的影响，这种浪涌可能在\
  \ FET 驱动直流电机时出现。\n\n如前所述，BS270 的一个小缺点是，在栅极电压为 3.3 V 时，它只能切换约 130 mA 的最大漏极电流。然而，栅极的高输入阻抗意味着你可以并联使用两个（甚至更多）BS270，从而在相同栅极电压下将最大电流加倍至约\
  \ 260 mA。此外，BS270 可用作功率 FET 的栅极驱动器，后者可以切换更大的电流。\n\n### 光耦合器/光隔离器\n\n光耦合器（或光隔离器）是小型、低成本的数字开关器件，用于将两个电路彼此隔离。如果你担心连接电路的设计问题可能从你的板子提供或吸收大电流，那么这对于你的比格犬板电路来说可能很重要。它们以低成本（约\
  \ 0.15 美元）的四引脚 DIP 封装形式提供。\n\n光耦合器使用一个靠近光电探测器晶体管的 LED 发射器，两者之间由硅胶穹顶内的绝缘薄膜隔开。当电流（`I[f]`）流过\
  \ LED 发射器引脚时，从 LED 照射到光电探测器晶体管上的光允许一个独立的电流（`I[c]`）流过光电探测器晶体管的集电极-发射极引脚（参见图 4-19）。当\
  \ LED 发射器关闭时，没有光照射到光电探测器晶体管上，因此几乎没有集电极-发射极电流（`I[c]`）。封装的一侧与另一侧之间没有电气连接，因为信号仅通过光传输，对于像\
  \ SFH617A 这样的光耦合器，可提供高达 5,300 `V[RMS]` 的电气隔离。你甚至可以将 PWM 与光耦合器一起使用，因为它是一个二进制开/关信号。\n\
  \n![光耦合器（617A）电路（左）以及捕获的输入和输出特性窗口，显示标记为 If 和 Ic 的波形（右）。](img/c04f019.jpg)\n\n**图\
  \ 4-19****：** 光耦合器（617A）电路及其捕获的输入和输出特性\n\n图 4-19 展示了一个示例光耦合器电路以及针对所选电阻和电压值得到的示波器迹线。这些值的选择与你在比格犬板上可能使用的值一致。选择\
  \ 470 Ω 的电阻值是为了让 3.3 V 输出能够驱动约 4.5 mA 的正向电流 `I[f]` 通过 LED 发射器。根据数据手册中的图 4，² 这导致二极管两端的正向电压约为\
  \ 1.15 V；![images](img/c04_i0021.png) 因此，电路使用最接近的标称值 470 Ω 搭建。\n\n\n\n\n\n示波器通过使用\
  \ Analog Discovery 的差分输入来测量已知电阻两端的电压，并利用两个数学通道除以电阻值，从而显示电流。在图 4-19 中，你可以看到 `I[f]`\
  \ 为 4.571 mA，`I[c]` 为 2.766 mA。两者差值的比例即为电流传输比（CTR），它随 `I[f]` 的大小和工作温度而变化。因此，在 4.571 mA\
  \ 时的电流传输比为 60.5%（![images](img/c04_i0022.png)），这与数据手册一致。上升时间和下降时间也与数据手册中的值一致：`t[r]`\
  \ = 4.6 µs，`t[f]` = 15 µs。这些值限制了开关频率。此外，如果你的电路需要实现高 CTR，可以使用内置达林顿晶体管配置的光耦，其 CTR\
  \ 可达 2000%（例如 6N138 或 HCPL2730）。最后，还有高线性度模拟光耦（例如 Avago 的 HCNR200）可用于对模拟信号进行电气隔离。\n\
  \n## 开关与按钮\n\n你可能需要使用的其他元件是开关和按钮。它们有多种形式：拨动开关、按钮开关、选择开关、接近开关、操纵杆、干簧管、压力开关、温度开关等。然而，它们都遵循相同的二进制原理：要么中断电流（断开），要么导通电流（闭合）。图\
  \ 4-20 展示了几种常见的开关类型，并概述了它们的一般连接方式。\n\n![SPDT 和 SPST 的示意图（左），以及瞬时按钮开关、滑动开关、微动开关、大电流瞬时按钮开关和船型开关的照片（右）。](img/c04f020.jpg)\n\
  \n**图 4-20****：** 各种开关及其配置\n\n瞬时按钮开关（SPST——单刀单掷），如图 4-20 所示，要么是常开（NO），要么是常闭（NC）。常开意味着你需要按下开关才能让电流通过，而常闭则意味着当你按下按钮时，电流不会通过。对于图示的特定按钮开关，引脚\
  \ 1 的两个触点始终相连，引脚 2 的两个触点也始终相连，而在你按下按钮的持续时间内，所有四个引脚都连接在一起。对于滑动开关（SPDT——单刀双掷），公共端（COM）根据滑动位置连接到引脚\
  \ 1 或引脚 2。对于微动开关和大电流按钮开关，当开关被按下时，COM 引脚连接到 NC；当开关被释放时，COM 引脚连接到 NO。最后，图示的船型开关通常带有一个\
  \ LED，当开关闭合时，LED 会点亮，将电源（VCC）引脚连接到电路（CCT）引脚。\n\n所有这些开关类型都存在机械开关抖动问题，当与像 Beagle 板这样的微处理器接口时，这可能会带来极大的麻烦。开关是机械装置，当它们被按下时，接触力会导致开关在接触点反复弹跳。弹跳持续时间很短（通常为毫秒级），但足以让开关向微处理器输入一系列信号。\n\
  \n图 4-21(a) 利用 Analog Discovery 示波器的上升/下降沿触发条件展示了实际中的抖动问题。将一个瞬时按钮开关与一个 10 kΩ 电阻串联在简单电路中，并测量电阻两端的电压。当开关接触时，输出突然变高，但随后开关从接触点弹回，电压再次下降。大约\
  \ 2 ms–3 ms（或更长时间）后，电压几乎完全稳定。不幸的是，这种微小抖动可能导致数字电路接收到错误的输入。例如，如果阈值为 3 V，则可能被读作 101010101，而不是更正确的\
  \ 000001111。\n\n![施密特触发电路以及原始开关电路（0.5 ms/格）、低通滤波（1 ms/格）和施密特触发器输出（1 ms/格）的波形截图。](img/c04f021.jpg)\n\
  \n**图 4-21****：** (a) 仅使用开关和 10 kΩ 电阻时的开关抖动；(b) 点 *B* 处的低通滤波输出；(c) 施密特触发电路；(d) 施密特触发电路在点\
  \ *C* 处的输出，与点 *A* 处的输入对比\n\n在微处理器接口中处理开关抖动有几种方法：\n\n- 可以添加一个由电阻-电容电路构成的低通滤波器，如图\
  \ 4-21(c) 所示，使用一个 1 μF 电容。不幸的是，这会导致输入延迟。如果检查时间基准，输入达到 1 V 大约需要 2 ms。此外，抖动条件可能会进一步延迟这一过程。这些值是根据\
  \ RC 时间常数 ![images](img/c04_i0023.png) 选择的，因此 ![images](img/c04_i0024.png) 是电容充电至约\
  \ 63.2% 或放电至约 36.8% 所需的时间。该值在图 4-21(b) 中标记为约 1.9 V。\n\n- 可以编写软件，使得在上升沿发生后延迟几毫秒，然后再读取“真实”状态。\n\
  \n- 对于滑动开关（SPDT），可以使用 SR 锁存器。\n\n- 对于瞬时按钮开关（SPST），可以使用施密特触发器（74HC14N），配合 RC 低通滤波器，如图\
  \ 4-21(c) 所示，下一节将讨论施密特触发器。\n\n#### 迟滞\n\n迟滞被设计到电子电路中，以避免快速开关，因为快速开关会磨损电路。施密特触发器表现出迟滞特性，这意味着其输出取决于当前输入以及先前输入的历史。这可以用一个在\
  \ 350 华氏度下烘烤蛋糕的烤箱例子来解释。\n\n- **无迟滞：** 加热元件将烤箱加热到 350°F。一旦达到 350°F，元件就会关闭。烤箱冷却到低于\
  \ 350°F，元件再次开启。快速开关！\n\n- **有迟滞：** 电路设计为将烤箱加热到 360°F，此时元件关闭。烤箱冷却，但设计为直到温度降至 340°F\
  \ 时才重新开启。开关不会很频繁，从而保护了烤箱，但烘烤温度的变化会更大。\n\n对于设计有迟滞的烤箱，在 350°F 时元件是*开启*还是*关闭*？这取决于输入的历史——如果烤箱正在加热，则*开启*；如果烤箱正在冷却，则*关闭*。\n\
  \n图 4-21(c) 中的施密特触发器表现出相同类型的行为。M74HC14 施密特触发器的 `V[T+]` 为 2.9 V，`V[T−]` 为 0.93 V（在\
  \ 5 V 输入下运行），这意味着上升输入电压必须达到 2.9 V 输出才会变为高电平，而下降输入电压必须降至 0.93 V 输出才会变为低电平。在此范围内的任何信号抖动都会被忽略。低通滤波器降低了高频抖动的可能性。响应如图\
  \ 4-21(d) 所示。注意时间基准为 1 ms/格，展示了输出信号有多么“干净”。该配置使用了一个上拉电阻，其必要性将在稍后讨论。\n\n## 逻辑门\n\n\
  \n\n\n布尔代数函数只有两种可能的结果：真或假，这使得它们非常适合用于构建描述电子电路（开或关，即高电平或低电平）的框架。逻辑门执行这些布尔代数函数和运算，构成了现代微处理器（如\
  \ AM335x）内部功能的基础。布尔值与二进制数不同。（二进制数是整数和小数的基 2 表示，而布尔值指的是一种只有两种可能值（真或假）的数据类型。）\n\n\
  通常情况下，你需要使用 Beagle 板的 GPIO 与不同类型的逻辑门和系统进行接口，以执行诸如门控输入或向移位寄存器发送数据等操作。逻辑门主要分为两类：\n\
  \n*   **组合逻辑：** 当前输出仅取决于当前输入（例如，与门、或门、译码器、多路复用器等）。\n*   **时序逻辑：** 当前输出取决于当前输入和先前输入。可以说它们具有不同的状态，给定输入的结果取决于它们所处的状态（例如，锁存器、触发器、存储器、计数器等）。\n\
  \n组合逻辑电路对于相同的输入集将提供相同的输出，无论输入应用的顺序如何。图 4-22 展示了核心组合逻辑门及其逻辑符号、真值表和 IC 编号。真值表提供了在应用所列输入时从门获得的输出。\n\
  \n![图片描述由标题和周围文字提供。](img/c04f022.jpg)\n\n**图 4-22****：** 通用逻辑门\n\nIC 有一个编号，描述其制造商、功能、逻辑系列和封装类型。例如，图\
  \ 4-23(a)中的 MM74HC08N，其制造商代码为 MM（飞兆半导体），是 7408（四路双输入与门），属于 HC（CMOS）逻辑系列，采用 N（塑料双列直插式封装）形式。\n\
  \n![左图：PDIP 照片，标注有 7408 四路 2 输入与门、引脚 1 等；TSSOP 照片，标注有 MPR083 电容式触摸传感器、引脚 1 等。右图：双负边沿触发\
  \ JK 触发器 DM74LS73AN 的电路图。](img/c04f023.jpg)\n\n**图 4-23****：** (a) IC 封装示例（按比例），以及(b)\
  \ JK 触发器\n\nIC 有不同的封装类型。图 4-23(a)按比例展示了 PDIP（塑料双列直插式封装）和一种小外形封装 TSSOP（薄型缩小小外形封装）。有许多类型：表面贴装、扁平封装、小外形封装、芯片级封装和球栅阵列（BGA）。订购\
  \ IC 时必须小心，确保你有能力使用它们。DIP/PDIP IC 非常适合在面包板上进行原型设计，因为它们具有 0.1 英寸的引脚间距。有适配板可用于将小外形封装转换为\
  \ 0.1 英寸引脚间距。不幸的是，BGA IC（如 AM335x SoC 和 OSD3358 SiP）需要复杂的设备进行焊接。\n\n目前可用的 IC 系列通常是晶体管-晶体管逻辑（TTL）（带低功耗肖特基（LS））或某种形式的互补金属氧化物半导体（CMOS）。表\
  \ 4-1 使用各自的数据手册比较了这两种 7408 IC 系列。*传播延迟*是对于逻辑门的所有可能输入，从输入值变化到输出值变化的最长延迟。该延迟限制了逻辑门的运行速度。\n\
  \n| **特性** | **SN74LS08N** | **SN74HC08N** |\n| --- | --- | --- |\n| 系列 | 德州仪器 TTL\
  \ PDIP 低功耗肖特基 (LS) | 德州仪器 CMOS PDIP 高速 CMOS (HC) |\n| `V[CC]` 电源电压 | 4.5 V 至 5.5 V（典型值\
  \ 5 V） | 2 V 至 6 V |\n| `V[IH]` 高电平输入电压 | 最小值 2 V | `V[CC]` 为 5 V 时最小值 = 3.5 V |\n\
  | `V[IL]` 低电平输入电压 | 最大值 0.8 V | `V[CC]` 为 5 V 时最大值 = 1.5 V |\n| 时间传播延迟 (`T[PD]`)\
  \ | 典型值 12 ns (*↑*) 17.5 ns (*↓*) | 典型值 8 ns (*↑↓*) |\n| 功耗（5 V 时） | 5 mW（最大值） |\
  \ 0.1 mW（最大值） |\n\n**表 4-1****：** 两种市售 TTL 和 CMOS IC（用于 7408 四路双输入与门 IC）的比较\n\n\
  图 4-24 展示了当`V[DD]` = 5 V 时，TTL 和 CMOS 逻辑门可接受的输入和输出电压电平。噪声容限是输出电压电平与输入电压电平之间的绝对差值。该噪声容限确保如果一个逻辑门的输出连接到第二个逻辑门的输入，噪声不会影响输入状态。CMOS\
  \ 逻辑系列的输入逻辑电平取决于电源电压`V[DD]`，其中高电平阈值为 0.7 × `V[DD]`，低电平阈值为 0.3 × `V[DD]`。从图 4-24\
  \ 中可以清楚地看出，行为存在差异。例如，如果输入电压为 2.5 V，则 TTL 门会将其感知为逻辑高电平，但 CMOS 门（在 5 V 下）会将其感知为未定义电平。此外，当`V[DD]`\
  \ = 3.3 V 时，CMOS 门的输出将提供足够的输出电压来触发 TTL 门的逻辑高输入，但无法触发`V[DD]` = 5.0 V 的 CMOS 门。\n\n\
  ![逻辑门输入和输出上的门信号电平图：TTL（左）和 5 V CMOS（右），标注有门输入、高电平噪声容限、低电平噪声容限等。](img/c04f024.jpg)\n\
  \n**图 4-24****：** 逻辑门输入和输出上的门信号电平 (a) TTL，以及 (b) 5 V CMOS\n\n高速 CMOS（HC）可以支持宽范围的电压电平，包括\
  \ Beagle 板的 3.3 V 输入/输出。GND 标签通常用于指示接地电源电压，而`V[EE]`常用于基于 BJT 的器件，`V[SS]`用于基于 FET\
  \ 的器件。传统上，`V[CC]`用作基于 BJT 器件的正电源电压标签，`V[DD]`用于基于 FET 的器件；然而，现在常见的是`V[CC]`同时用于两者。\n\
  \n图 4-23(b) 展示了一个时序逻辑电路，称为*JK 触发器*。JK 触发器是计数器等电路中的核心构建模块。它们与组合逻辑电路的不同之处在于，当前状态取决于当前输入和先前状态。从真值表中可以看出，如果输入为`J\
  \ = 0`且`K = 0`，则输出`Q[n]`的值将是上一个时间步的输出值（它表现为一位存储器）。时间步由时钟输入（CLK）定义，时钟输入是一个方波同步信号。Beagle\
  \ 板上也存在相同类型的定时信号——即时钟频率，1 GHz 的时钟每秒经历多达 1,000,000,000 个方波周期！\n\n#### *浮动输入*\n\n\
  使用数字逻辑电路时的一个常见错误是让未使用的逻辑门输入“浮动”或断开连接。芯片系列对此错误的结果有很大影响。对于 TTL 逻辑系列，这些输入将“浮动”为高电平，并且可以合理地预期被视为逻辑高输入。对于\
  \ TTL IC，最好将输入“绑定”（即连接）到地或电源电压，以便始终绝对确定输入上断言的逻辑电平。\n\n对于 CMOS 电路，输入对静电和电噪声可能产生的高电压非常敏感，也绝不应让其浮动。图\
  \ 4-25 给出了一个按图中所示接线的与门可能的输出。正确的结果显示在“所需 (A.B)”列中。\n\n\n\n\n\n![开关断开时输入意外悬空的与门电路图（左）以及\
  \ 7408 与门的 5 列表格，标注了开关 A 和 B、所需值（A·B）、TTL 输出和 CMOS 输出（右）](img/c04f025.jpg)\n\n**图\
  \ 4-25****：** 开关断开时输入意外悬空的与门\n\n未使用的 CMOS 输入如果悬空（介于`V[DD]`与 GND 之间），会因漏电流而逐渐充电，根据\
  \ IC 设计的不同，可能导致错误输入或通过产生直流电流（从`V[DD]`流向 GND）而浪费功耗。为解决此问题，可根据所需的输入状态使用上拉或下拉电阻（这些是阻值合适的普通电阻——其作用在于“上拉”或“下拉”），下一节将对此进行说明。\n\
  \n#### *上拉电阻与下拉电阻*\n\n为避免输入悬空，可以使用上拉或下拉电阻，如图 4-26 所示。如果希望开关断开时保证门电路的输入为低电平，则使用下拉电阻；如果希望开关断开时保证输入为高电平，则使用上拉电阻。\n\
  \n![使用下拉电阻（左）和上拉电阻（右）的电路图，用于确保开关不会造成输入悬空](img/c04f026.jpg)\n\n**图 4-26****：** 下拉电阻和上拉电阻，用于确保开关不会造成输入悬空\n\
  \n这些电阻很重要，因为当开关闭合时，如果省略电阻而直接用导线连接，开关会形成对地短路。下拉/上拉电阻的阻值也很重要：其值必须足够低，以便在开关断开时可靠地将输入拉低/拉高，但又必须足够高，以防止开关闭合时流过过大电流。理想逻辑门具有无限阻抗，任何电阻值（只要不是无穷大）都可行。然而，实际逻辑门存在漏电流，必须克服这种漏电。为最小化功耗，应选择能实际将输入拉低/拉高的最大阻值。3.3 kΩ–10 kΩ的电阻通常工作良好，但\
  \ 3.3 V 电压会分别驱动 1 mA–0.33 mA 的电流，并在开关闭合时分别消耗 3.3 mW–1 mW 的功率。对于对功耗敏感的应用，可以测试 50 kΩ或更大的电阻。\n\
  \nBeagle 板具有弱内部上拉和下拉电阻，可用于此目的。这将在第 6 章中讨论。另一个问题是输入对地存在一些杂散电容。在输入端添加电阻会形成一个 RC 低通滤波器，从而延迟输入信号。对于手动按钮来说，这并不重要，因为上述示例中的延迟约为\
  \ 0.1 µs，但可能会影响数字通信总线线路的速度。\n\n#### *集电极开路与漏极开路输出*\n\n到目前为止，本章中的所有 IC 都具有常规输出，即输出被驱动至接近\
  \ GND 或 IC 的电源电压（`V[CC]`）。如果连接到使用相同电压电平的其他 IC 或元件，则没有问题。然而，如果第一个 IC 的电源电压为 3.3 V，而需要驱动输出到电源电压为\
  \ 5 V 的 IC，则可能需要进行电平转换。\n\n许多 IC 提供集电极开路输出形式，这对于不同逻辑系列之间的接口以及电平转换特别有用。这是因为输出并非处于特定电压电平，而是连接到\
  \ IC 内部 NPN 晶体管的基极输入。IC 的输出是晶体管的“开路”集电极，而晶体管的发射极连接到 IC 的 GND。也可以在 IC 内部使用 FET（74HC03）代替\
  \ BJT（74LS01），虽然概念相同，但称为*漏极开路输出*。图 4-27 说明了这一概念，并给出了一个使用 74HC03（四路双输入漏极开路与非门）驱动\
  \ 5 V 电路的示例电路。漏极开路配置的优势在于 CMOS IC 支持 Beagle 板 GPIO 上可用的 3.3 V 电平。本质上，图 4-17 中使用的漏极电阻被放置在\
  \ IC 封装外部，如图 4-27 所示，本例中其阻值为 10 kΩ。\n\n![74HC03（四路双输入漏极开路与非门）电路图（左）、与非门真值表（中）以及\
  \ DWF 1-示波器 1-缩放 1 窗口显示方波（右）](img/c04f027.jpg)\n\n**图 4-27****：** 漏极开路电平转换示例\n\n\
  有趣的是，将一个输入端接高电平（或将两个输入端短接）的与非门行为类似于非门。事实上，与非门或或非门各自都能复制任何逻辑门的功能，因此它们被称为*通用门*。\n\n\
  集电极开路输出常用于将多个设备连接到总线上。在第 8 章描述 Beagle 板的 I²C 总线时，你将看到这一点。当查看 IC（如 74HC03）数据手册中的真值表时，你会看到字母`Z`用于表示输出（如图\
  \ 4-27 所示）。这意味着它是高阻抗输出，外部上拉电阻可以将输出拉至高电平。\n\n#### *门电路互连*\n\n为了创建有用的电路，逻辑门需要与其他逻辑门和元件互连。理解门电路的互连能力存在限制非常重要。\n\
  \n第一个限制是逻辑门提供或吸收电流的能力。当门电路输出为逻辑高电平时，它充当电流源，为相连的逻辑门或图 4-26 中所示的 LED 提供电流。如果门电路输出为逻辑低电平，则门电路充当电流吸收器，电流流入输出端。图\
  \ 4-28(a)通过在`V[CC]`与逻辑门输出之间放置一个限流电阻和一个 LED（LED 阴极连接到逻辑门输出）来演示这一点。当门电路输出为高电平时，没有电位差，LED\
  \ 熄灭；但当输出为低电平时，产生电位差，电流流过 LED 并被逻辑门输出吸收。根据 74HC08 的数据手册，其输出电流限制（`I[O]`）为±25 mA，意味着它可以提供或吸收\
  \ 25 mA 的电流。超过这些值会损坏 IC。\n\n![左图：输出端吸收电流，显示两个标有 A 和 B 的开关连接到与门（7408），以及交替的 10kΩ和\
  \ 220Ω等电阻。右图：TTL 扇出示例，与门 7408 带有 IOH 和 IIH 箭头](img/c04f028.jpg)\n\n**图 4-28****：**\
  \ (a) 输出端吸收电流，(b) TTL 扇出示例\n\n\n\n\n通常需要将单个（驱动）门的输出连接到多个其他门的输入。每个被连接的门都会消耗电流，从而限制了可连接门的总数。扇出是指连接到驱动门输出的门数量。如图\
  \ 4-28(b)所示，对于 TTL 电路，最大扇出取决于输出（`I[O]`）和输入电流（`I[I]`）在低电平状态（`I[OL(max)]/I[IL(max)]`）和高电平状态（`I[OH(max)]/I[IH(max)]`）下的需求值。取两者中较小的值，通常为\
  \ 10 或更大。集成电路的扇入是指其输入端的数量。对于 7408 芯片，它是二输入与门，因此扇入为 2。\n\nCMOS 门电路的输入电阻极大，几乎不消耗电流，因此具有较大的扇出能力（>50）；然而，每个输入都会增加一个小电容（`C[L]`\
  \ ≈ 3–10 pF），需要由前一级的输出进行充放电。扇出越大，驱动门上的容性负载就越大，从而延长传播延迟。例如，74HC08 的传播延迟（`t[pd]`）约为\
  \ 11 ns，输入电容（`C[I]`）为 3.5 pF（本例假设每个连接导致`t[pd] = RC =` 3.5 ns 的延迟）。如果一个 78HC08 驱动\
  \ 10 个其他类似的门，每个门增加 3.5 ns 的延迟，那么传播延迟将增加到![images](img/c04_i0025.png) ns，最大工作频率从\
  \ 91 MHz 降至 22 MHz。\n\n## 模数转换\n\nBeagle 板具有多个模数转换器（ADC）输入，可用于接收模拟信号并生成该信号的数字表示。这使我们能够连接多种不同类型的传感器，例如距离传感器、温度传感器、光照传感器等。但是，使用这些输入时必须小心，因为它们不应提供或吸收电流，因为传感器的模拟输出可能对输出端并联的任何额外负载非常敏感。要解决这个问题，首先需要了解运算放大器的工作原理。\n\
  \n模拟信号是连续信号，代表对某种物理现象的测量。例如，麦克风是一种模拟设备，通常称为换能器，可将声波转换为电信号，该信号根据声波幅度在−5 V 到+5 V 之间变化。模拟信号使用连续的值范围来表示信息，但如果想用\
  \ Beagle 板处理该信号，则需要信号的离散数字表示。这种表示在离散时间点进行采样，随后量化为离散的电压或电流值。例如，音频信号随时间变化；因此，为了对换能器信号进行采样以数字方式捕获人类语音（例如语音识别），需要注意两个因素：\n\
  \n*   **采样率：** 定义对信号进行采样的频率。显然，如果每隔一秒采样一次电压来创建离散数字样本，语音将无法辨认。\n\n*   **采样分辨率：**\
  \ 定义在信号采样时刻用于表示电压的数字表示的数量。显然，如果只有一位，则只能捕获信号是更接近+5 V 还是−5 V，同样语音信号将无法辨认。\n\n### 采样率\n\
  \n用离散形式完美表示连续信号需要无限量的数字数据。幸运的是，人类听觉的性能有限，因此我们可以限制需要离散化的数据量。例如，44.1 kHz 和 48 kHz\
  \ 是编码 MP3 文件时常用的数字音频采样率，这意味着如果使用前者，每秒需要存储 44,100 个换能器电压样本。采样率通常由保留信号特定频率内容的需求决定。例如，人类（尤其是儿童）可以听到频率约为\
  \ 20 Hz 至 20 kHz 的音频信号。奈奎斯特采样定理指出，采样频率必须至少是信号中最高频率分量的两倍。因此，如果要对音频信号进行采样，需要使用至少两倍于\
  \ 20 kHz 的采样率，即 40 kHz，这有助于解释 MP3 音频文件编码中使用的采样率大小（通常为每秒 44,100 个样本，即 44.1 kS/s）。\n\
  \n### 量化\n\nBeagle 板具有多个 12 位 ADC 输入，工作范围为 0–1.8 V，这意味着该采样分辨率有 2¹² = 4,096 种可能的离散表示（数字）。如果电压恰好为\
  \ 0 V，可以用十进制数 0 表示。如果电压恰好为 1.8 V，可以用数字 4,095 表示。那么，十进制数 1 代表多少电压？它是![images](img/c04_i0026.png)。因此，0\
  \ 到 4,095（共 4,096 个值）之间的每个十进制数代表约 0.44 mV 的步进。\n\n前面的音频采样示例也说明了 Beagle 板配置面临的一个挑战。如果传感器输出电压为−5\
  \ 到+5 V，或者更常见的 0 V 到+5 V，则需要将该范围调整为 0 到 1.8 V，以与 ADC 兼容。在第 6 章中，将探讨如何解决这个问题。第二个更复杂的问题是，我们不能从\
  \ Beagle 板的 ADC 电路提供或吸收电流，为了解决这个问题，需要引入一个早于数字计算机的强大概念，称为*运算放大器*。\n\n### 运算放大器\n\n\
  运算放大器（op-amp）由单个 IC（例如 LM741）内的多个 BJT 或 FET 组成。它们可用于创建多种有用的电路，其中一种将在第 9 章中用于正确连接模拟传感器。\n\
  \n#### *理想运算放大器*\n\n图 4-29(a)展示了一个理想运算放大器，置于无反馈（即开环）的基本电路中。运算放大器有两个输入端，同相输入端（+）和*反相*输入端（−），其输出与两者之差成正比，即`V[out]\
  \ = G(V[1] − V[2])`，其中`V[1]`和`V[2]`分别是这两个输入端的电压电平。理想运算放大器的一些特性包括：\n\n*   无限的开环增益`G`\n\
  \n*   无限的输入阻抗\n\n*   零输出阻抗\n\n![图片描述由标题和周围文字说明。](img/c04f029.jpg)\n\n**图 4-29****：**\
  \ (a) 理想运算放大器，以及 (b) 开环比较器示例\n\n\n\n没有实际运算放大器具有无限的开环增益，但电压增益在 200,000 到 30,000,000\
  \ 之间很常见。这样的增益可视为无穷大，这意味着理论上，即使输入端之间存在微小差异，也会导致完全不切实际的输出。例如，`V[1]` 和 `V[2]` 之间 1 V\
  \ 的差异将导致至少 200,000 V 的电压输出！如果真是这样，我现在就得对运算放大器的使用发出健康警告了！输出电压当然受电源电压限制（图 4-29(a)\
  \ 中的 `V[CC+]` 和 `V[CC−]`）。因此，如果你使用 Beagle 板为运算放大器提供 `V[CC+]` = +5 V 和 `V[CC−]` =\
  \ 0 V（GND），实际的最大输出大约在 0 V 到 5 V 范围内，具体取决于所使用的运算放大器。同样，实际运算放大器没有无限输入阻抗，但其范围在 250 kΩ\
  \ 到 2 MΩ 之间。这里使用术语 *阻抗* 而非 *电阻*，因为输入可能是交流而非仅直流电源。同样，零输出阻抗也是不可能的，但很可能 <100 Ω。\n\n\
  LM358 双运算放大器用于以下电路配置（[`www.ti.com/product/lm358`](http://www.ti.com/product/lm358)）。它是一个八引脚\
  \ PDIP 封装的 IC，包含两个运算放大器，典型开环差分电压增益为 100 dB，即电压增益为 100,000（`电压增益（dB）= 20 × log (V[out]/V[in])`）。该\
  \ IC 的一个优点是电源范围宽，在 3 V 到 32 V 之间，这意味着你可以使用 Beagle 板的 3.3 V 或 5 V 电源轨。LM358 在输出端通常可提供高达\
  \ 30 mA 的电流或吸收高达 20 mA 的电流。\n\n开环运算放大器的行为最好通过一个示例来解释，如图 4-29(b) 所示。注意，在这种情况下，输入连接到运算放大器的反相输入端（`−ve`），而非同相输入端（`+ve`），这意味着当\
  \ `V[in]` 低于参考电压时，`V[out]` 将为正。该电路使用 LM358 构建，电源为 `V[CC+]` = 5 V 和 `V[CC−]` = 0 V（GND）。使用一个\
  \ 100 kΩ 电位器来改变 `+ve` 输入端的电压。这个电压正是我们实际与输入电压进行比较的电压，因此该电路被称为 *比较器*。当 `−ve` 输入端的电压大于\
  \ `+ve` 输入端（即使只大一点点）时，输出将迅速向负方向饱和至 0 V。当 `−ve` 输入端的电压小于 `+ve` 输入端的电压时，输出 `V[out]`\
  \ 将立即向 `+ve` 方向饱和，达到该配置下由所施加的 `V[CC]` 值允许的最大值。\n\n该电路的实际输出如图 4-30(a) 所示。在此视图中，电位器被调节为在\
  \ `V+` 输入端提供 1.116 V 的电压。当 `V−` 低于该值时，输出 `V[out]` 饱和至最大正值。在本例中，该值为 3.816 V（LM358\
  \ 正饱和电压）。当 `V−` 大于 1.116 V 时，输出 `V[out]` 饱和至最低值，几乎为零（−2 mV）。注意这里发生的反相。\n\n![图片描述由标题和周围文本说明。](img/c04f030.jpg)\n\
  \n**图 4-30****：** 比较器电路的输出\n\n如果一切保持不变，但电位器被调节为给 `V+` 提供不同的值（本例中为 0.645 V），则输出将如图\
  \ 4-30(b) 所示，其中输出 `V[out]` 的占空比将不同。该比较器电路还可用于检测低电压情况——例如，如果电池的电压输出低于某个值，则点亮一个警告\
  \ LED。图 4-29(b) 中使用的电路示例可用于根据控制电压 `V+` 生成具有可控占空比的 PWM 信号。\n\n大的开环增益意味着运算放大器通常与反馈一起使用，反馈被引向运算放大器的负或正输入端。这种反馈为运算放大器开辟了极其广泛的其他应用。\n\
  \n#### *负反馈与电压跟随器*\n\n当将运算放大器的输出（`V[out]`）连接回反相输入端（`V−`）时，就形成了负反馈。当你向同相输入端（`V+`）施加一个电压（`V[in]`）并缓慢增加时，随着\
  \ `V[in]` 的增加，`V+` 和 `V−` 之间的差值也会增加；然而，输出电压也会根据 `G(V[1] − V[2])` 增加，并且这会反馈到 `V−`\
  \ 输入端，导致输出电压 `V[out]` 降低。本质上，运算放大器通过调整输出来试图使反相（`V−`）输入端的电压与同相（`V+`）输入端的电压相同。这一作用的影响是，`V[out]`\
  \ 的值被稳定为与 `V+` 上的 `V[in]` 电压相同；运算放大器的增益越高，这个差值就越接近零。\n\n这种作用本身对我们来说并不是很有用，除了设置输入电压所需的电流很小，而运算放大器可以在输出侧控制大得多的电流。由于负反馈使输出电压与输入电压相同，因此整个配置的增益为\
  \ 1。这种配置被称为 *电压跟随器* 或 *单位增益缓冲器*，如图 4-31 所示。这种配置很重要，因为它用于第 6 章 来保护 Beagle 板中的 ADC\
  \ 电路，并且还用于确保 ADC 参考电压不会因连接到电路而改变。\n\n![左图：电压跟随器运算放大器电路，包含标有 Vin、GND、V–、VCC–、VCC+、电压跟随器增益=1\
  \ 等部件。右图：LM358 电路图，包含标有 1OUT、1/N–、1/N+、GND、VCC、2OUT 等部件。](img/c04f031.jpg)\n\n**图\
  \ 4-31****：** 电压跟随器运算放大器电路\n\n#### *正反馈*\n\n负反馈是与运算放大器一起使用的最常见反馈类型，因为它具有稳定作用。正反馈配置的运算放大器是指输出返回到运算放大器的正同相输入端。在这种情况下，反馈信号支持输入信号。例如，通过将\
  \ `V[out]` 通过一个正反馈电阻连接到 `V+`，正反馈可用于为开环运算放大器比较器电路增加迟滞。这可用于减少比较器对输入信号噪声的响应。\n\n##\
  \ 总结建议\n\n本章涵盖了大量内容。最后，这里有一些关于使用电子元件和 Beagle 板的一般性建议：\n\n*   切勿让输入端悬空。在所有开关上使用上拉/下拉电阻。检查未使用的\
  \ IC 引脚是否需要接高/接低。\n\n*   确保电路中所有 GND 都已连接。\n\n*   记住以正确的电压水平为芯片供电。\n\n*   不要假设新的二极管、FET、BJT\
  \ 或逻辑门具有与之前使用的元件相同的引脚布局。\n\n*   就像编程一样，先构建一个简单电路，进行测试，然后再增加下一层复杂性。永远不要假设某个东西能工作！\n\
  \n*   不要让导线接头和鳄鱼夹连接处悬空，以免它们相互接触——面包板上的电阻也是如此。\n\n*   使用平头螺丝刀从面包板上取下 IC，因为很容易将 IC\
  \ 引脚弯曲到无法修复。\n\n*   CMOS IC 对静电敏感，因此用手指触摸可能会因身体上积累的静电而损坏它们。在触摸 IC 之前，先触摸电脑背面或某个接地的金属物体。\n\
  \n\n\n\n\n*   不要假设元件具有精确或一致的值——特别是晶体管的增益和电阻器的阻值范围。\n\n## 总结\n\n完成本章后，你应该能够做到以下几点：\n\
  \n*   描述电路运行的基本原理，在面包板上搭建电路，并测量电压和电流值\n*   在自己的电路设计中使用分立元件，如二极管、LED、晶体管和电容器\n* \
  \  使用晶体管和场效应管作为开关，控制比单独使用 Beagle 板输出所能处理的更高电流和电压信号\n*   互连并连接逻辑门，特别注意“悬空”输入引发的问题\n\
  *   描述模数转换的原理，并设计基本的运算放大器电路\n*   综合运用所有这些技能，构建对安全连接 Beagle 板 GPIO 至关重要的电路类型\n\n\
  ## 延伸阅读\n\n本章已列出供进一步阅读的文档和链接，但这里还有一些额外的参考资料：\n\n*   T. R. Kuphaldt，《电路教程》，一套关于电学和电子学的免费系列教材：[`www.ibiblio.org/kuphaldt/electricCircuits/`](http://www.ibiblio.org/kuphaldt/electricCircuits/)\n\
  *   All About Circuits：[`www.allaboutcircuits.com`](http://www.allaboutcircuits.com)\
  \ 提供了多种电子电路的优秀应用实例\n*   Electronics Club：[`www.electronicsclub.info`](http://www.electronicsclub.info)\
  \ 为初学者和参考提供电子项目\n*   Neil Storey，《电子学：系统方法》，第 5 版，纽约：Pearson，2013 年\n\n以下是本章使用的全部元件清单：\n\
  \n*   面包板\n*   二极管：1N4001，通用 LED\n*   晶体管：NPN：BC547，场效应管：BS270\n*   稳压器：KA7805/LM7805\n\
  *   PTC：60R110\n*   按钮和开关：通用单刀单掷和单刀双掷\n*   集成电路：74HC73N、74HC03N、74LS08N、74HC08N、74HC14、LM358N\n\
  *   电阻器：1 MΩ、2.2 kΩ、2×10 kΩ、50 kΩ、100 Ω、50 Ω、1 kΩ、470 Ω、220 Ω、100 kΩ 电位器\n*   电容器：10 μF、1 μF、0.33 μF、0.1 μF\n\
  *   光耦：SFH617A\n\n## 注意\n\n# 第 5 章\n\n实用的 Beagle 板编程\n\n本章介绍 Beagle 板的几种不同编程选项，包括脚本语言和编译语言。所有语言均提供了一个\
  \ LED 闪烁示例，以便你研究每种语言的结构和语法。同时讨论了每种语言的优缺点并给出了使用示例。随后，本章重点介绍 C/C++ 编程语言，阐述其原理以及为什么面向对象编程（OOP）对于开发可扩展的嵌入式系统应用是合适且必要的。最后，本章详细说明了如何通过\
  \ GNU C 库直接与 Linux 内核交互。由于一章只能触及该主题的表面，因此本章重点放在物理编程任务上，这些任务将在本书后续部分中反复用到。\n\n本章所需设备：\n\
  \n*   带有终端连接的 Beagle 板（参见第 2 章）\n*   桌面 Linux 安装（例如，虚拟机中的 Debian——参见第 3 章）\n\n##\
  \ 引言\n\n如第 3 章所述，嵌入式 Linux 本质上就是“嵌入式系统上的 Linux”。如果你喜欢的编程语言在 Linux 下可用，那么它很可能也适用于\
  \ Beagle 板。那么，你喜欢的语言是否适合为你的板子编程？这取决于你打算用板子做什么。你是要连接电子设备/模块吗？你计划编写丰富的用户界面吗？你打算为 Linux\
  \ 编写设备驱动程序吗？性能是否重要，还是你正在开发早期的预原型？这些问题的答案都会影响你选择哪种语言。在本章中，你将了解几种不同的语言，并概述每类语言的优缺点。阅读本章时，尽量不要只关注自己喜欢的语言，而是根据手头的任务选择正确的语言。\n\
  \n嵌入式系统编程与桌面计算机编程相比如何？以下是一些需要考虑的要点：\n\n*   你应该始终编写最清晰、最简洁且尽可能易于维护的代码，就像在桌面 PC 上一样。\n\
  *   在确定代码完整之前，不要进行优化。\n*   与在桌面计算机上编程相比，你通常需要更加注意资源的消耗方式。数据类型的大小很重要，正确传递数据也至关重要。你需要关注内存可用性、文件系统大小以及数据通信的可用性/带宽。\n\
  *   你通常需要了解底层硬件平台。它如何处理连接的硬件？有哪些数据总线可用？如何与操作系统和底层库交互？是否存在实时约束？\n\n在接下来的讨论中，假设你计划进行某种物理计算——即连接板上的不同输入或输出。因此，用于描述不同语言结构和语法的示例是一个简单的接口示例。在介绍语言本身之前，我们首先对\
  \ Beagle 平台上运行的不同语言进行简要的性能评估，以便将后续讨论置于上下文中。\n\n### 不同语言的性能\n\n哪种语言在 Beagle 平台上最好？嗯，这是一个非常情绪化且难以回答的问题。不同的语言在不同的基准测试和不同任务上表现更好。此外，用特定语言编写的程序可以针对该语言进行优化，以至于几乎无法辨认出原始代码。执行速度也并非总是重要因素；你可能更关心内存使用、代码的可移植性或快速应用更改的能力。\n\
  \n然而，如果你计划开发高速或实时的数值计算应用，那么性能可能是你选择编程语言的关键因素。此外，如果你打算学习一门新语言，并且未来可能开发算法密集型程序，那么牢记性能可能会很有用。\n\
  \n我们设置了一个简单的测试，以确定本章讨论的语言的 CPU 性能。该测试使用了来自 [`benchmarksgame.alioth.debian.org`](http://benchmarksgame.alioth.debian.org)\
  \ 的 *n*-体基准测试（太阳系行星的引力相互作用）代码。所有语言使用相同的算法，并且板子在所有情况下都处于相同状态。测试使用 500 万次迭代，以确保用于计时的脚本不需要高度精确。所有程序都给出了相同正确的结果，表明它们都正确运行并完成。该测试位于本书\
  \ Git 仓库的 `chp05/performance/` 目录中。请注意，你必须在板子上安装 Java 和其他语言才能运行所有测试。使用以下命令执行测试：\n\
  \n```\n/chp05/performance$ ./run\nRunning the Tests:\nThe C/C++ Code Example\n-0.169075164\
  \  -0.169083134\nIt took 34 seconds to run the C/C++ test …\nFinished Running the\
  \ Benchmarks \n```\n\n\n\n\n\n测试结果显示在表 5-1 中。第一列展示了 PocketBeagle 在其最高处理器频率 1 GHz\
  \ 下运行的结果。对于这个数值密集型应用，通用语言 C++在 34 秒内完成了任务。这个时间被加权为 1 个单位。因此，Java 完成相同任务所需时间是 C++的\
  \ 1.15 倍，高度优化的 Rust 比 C++更快，Node.js（用于 BoneScript）是 1.24 倍，Perl 是 26.8 倍，Python\
  \ 是 57 倍。括号内给出了以秒为单位的处理时长。当你横向查看各列时，可以看到这种性能表现相对一致，即使调整了处理器频率（将在下一节讨论）或使用了桌面级 i7\
  \ 64 位处理器也是如此。\n\n| **值** | **类型** | **POCKETBEAGLE¹ 在 1 GHZ** | **POCKETBEAGLE\
  \ 在 600  MHZ** | **INTEL 64 位 I7 DEBIAN PC²** |\n| --- | --- | --- | --- | --- |\n\
  | C++³ | 编译型 | 1.00× (34 s) | 1.00× (57 s) | 1.00× (0.641 s) |\n| C (gcc) | 编译型\
  \ | 0.95× (32 s) | 0.96× (55 s) | 0.97× (0.623s) |\n| Rust⁴ | 编译型 | 0.85× (29 s)\
  \ | 0.86× (49 s) | 0.66× (0.425 s) |\n| C++14 | 编译型 | 1.06× (36 s) | 1.07× (61 s)\
  \ | 0.95× (0.608 s) |\n| Haskell⁵ | 编译型 | 1.06× (36 s) | 1.05× (60 s) | 1.78× (1.141 s)\
  \ |\n| Java⁶ | JIT | 1.15× (39 s) | 1.16× (66 s) | 1.28× (0.818 s) |\n| Node.js⁷\
  \ | JIT | 1.24× (42 s) | 1.30× (74 s) | 1.67× (1.071 s) |\n| Mono C# | JIT | 1.50×\
  \ (51 s) | 1.53× (87.4 s) | 2.13× (1.363 s) |\n| Cython⁸ | 编译型 | 1.97× (67 s) |\
  \ 1.96× (112 s) | 1.19× (0.765 s) |\n| Lua⁹ | 解释型 | 6.41× (218 s) | 6.31× (360 s)\
  \ | 28.6× (18.304 s) |\n| Cython | 编译型 | 22.0× (751 s) | 22.1× (1262 s) | 55.8×\
  \ (35.742 s) |\n| Perl | 解释型 | 26.8× (910 s) | 20.3× (1156 s) | 59.6× (38.214 s)\
  \ |\n| Ruby¹⁰ | 解释型 | 34.2× (1162 s) | 31.0× (1770 s) | 46.0× (29.454 s) |\n| Python\
  \ | 解释型 | 57.0× (1937 s) | 58.2× (3318 s) | 98.3× (63.032 s) |\n\n**表 5-1****：**\
  \ 在[BeagleBoard.org](http://BeagleBoard.org) Debian Stretch 硬浮点镜像上，对*n*体算法进行 5,000,000\
  \ 次迭代的数值计算时间\n\n表 5-1 中的第二列指明了语言类型，其中*编译型*指原生编译语言，*JIT*指即时编译语言，*解释型*指由解释器执行的代码。这些语言类型的区别将在本章中详细描述，并不像表中呈现的那样泾渭分明。\n\
  \n所有程序在执行期间都使用了 98%到 99%的 CPU。Java、Node.js 和 Mono C#的相对性能令人印象深刻，因为它们的代码是动态编译（“即时编译”）的，这将在本章后面讨论。任何动态编译的延迟都已包含在计时中，因为测试脚本包含了以下\
  \ Bash 脚本代码来计算每个程序的执行时长：\n\n```\nDuration=\"5000000\"\necho -e \"\\nC++代码示例\"\n\
  T=\"$(date +%s%N)\"\n./n-body $Duration\nT=\"$(($(date +%s%N)-T))\"\nT=$((T/1000000))\n\
  echo \"运行 C++测试耗时 ${T} 毫秒\" \n```\n\nC++14 代码是 2014 年发布的 C++编程语言版本（需要 gcc 5+才能完全支持）。这将在本章后面再次讨论。该程序包含针对此\
  \ C++版本的优化，有趣的是，虽然此版本在桌面计算机上表现更好，但在 PocketBeagle 上却略逊一筹。Java 程序使用了`+AggressiveOpts`标志来启用性能优化，之所以使用它，是因为它不需要修改源代码。\n\
  \nPython 的结果特别差，这是由该问题的算法性质决定的。然而，基准测试（[`benchmarksgame.alioth.debian.org`](http://benchmarksgame.alioth.debian.org)）表明，对于从一般处理到算法密集型代码，其速度范围比优化后的\
  \ C++代码慢 9 到 100 倍。如果你熟悉 Python 并希望提高其性能，可以研究*Cython*，这是一个 Python 编译器，它会自动移除动态类型功能，并允许你直接从\
  \ Python 代码生成 C 代码。Cython 以及使用 C/C++扩展 Python 的内容将在本章末尾讨论。\n\n最后一列提供了相同代码在桌面计算机虚拟机上运行的结果。你可以看到，各应用程序的相对性能大致一致，但也要注意，C++程序在单个\
  \ i7 线程上的运行速度比在 1 GHz 的 PocketBeagle 上快 40 倍。我希望这能帮助你设定对标准 Beagle 板所能实现的数值处理类型的预期，尤其是在研究信号处理和计算机视觉等计算密集型应用时。\n\
  \n如前所述，这只是一个面向数值的基准测试，但它在一定程度上表明了每种语言应有的性能表现。关于语言性能的研究有很多；然而，Hundt（2011）的一项详细分析发现，在性能方面，“C++以很大优势胜出。但它也需要最广泛的调优工作，其中许多调优的复杂程度是普通程序员无法企及的。”\n\
  \n### 设置 CPU 频率\n\n在上一节中，Beagle 板的时钟频率在运行时被动态调整。[BeagleBoard.org](http://BeagleBoard.org)\
  \ Debian 镜像提供了多种*调控器*，可用于分析性能/功耗比。例如，如果你正在构建一个处理需求较低的电池供电 PocketBeagle 应用，可以降低时钟频率以节省电量。你可以通过输入以下命令来了解板的当前状态：\n\
  \n```\ndebian@ebb:~$ sudo apt install cpufrequtils\ndebian@ebb:~$ cpufreq-info\n\
  …  \n可用的 cpufreq 调控器：conservative, ondemand, userspace, \npowersave, performance,\
  \ schedutil\n 当前策略：频率应在 300 MHz 到 1000 MHz 之间。\n                  调控器\"performance\"\
  可决定在此范围内使用哪个速度。\n  当前 CPU 频率为 1000 MHz。\n  cpufreq 统计：300 MHz:0.00%, 600 MHz:0.00%,\
  \ 720 MHz:0.00%, \n  800 MHz:0.00%, 1000 MHz:100.00% \n```\n\n你可以看到不同的调控器可用，其配置文件名称分别为`conservative`、`ondemand`、`userspace`、`powersave`、`performance`和`schedutil`。要启用其中一个调控器，请输入以下命令：\n\
  \n```\ndebian@ebb:~$ sudo cpufreq-set -g ondemand\ndebian@ebb:~$ cpufreq-info\n\
  … 调控器\"ondemand\"可决定在此范围内使用哪个速度。\ndebian@ebb:~$ sudo cpufreq-set -f 600MHz\ndebian@ebb:~$\
  \ cpufreq-info\n… 当前 CPU 频率为 600 MHz。 \n```\n\n`ondemand`很有用，因为它能动态切换 CPU 频率。例如，如果当前\
  \ CPU 频率为 600 MHz，且调控器采样之间的平均 CPU 使用率高于阈值（称为`up_threshold`），则 CPU 频率将自动提高。你可以通过它们的\
  \ sysfs 条目来调整这些设置及其他设置。例如，要将 CPU 频率上升的阈值设置为 CPU 负载达到可用容量的 90%，请使用以下命令：\n\n\n\n\n\
  ```\ndebian@ebb:~$ sudo cpufreq-set -g ondemand\ndebian@ebb:~$ cd /sys/devices/system/cpu/cpufreq/ondemand/\n\
  debian@ebb:/sys/devices/system/cpu/cpufreq/ondemand$ ls\nignore_nice_load  min_sampling_rate\
  \  sampling_down_factor  up_threshold\nio_is_busy        powersave_bias     sampling_rate\n\
  debian@ebb: … /ondemand$ cat up_threshold\n95\ndebian@ebb: … /ondemand$ sudo sh\
  \ -c \"echo 90 > up_threshold\"\ndebian@ebb: … /ondemand$ cat up_threshold\n90 \n\
  ```\n\n如果你的板子上没有安装这些工具，你必须安装 `cpufrequtils` 包。在 Debian Stretch 上，默认的调控器是 `performance`，但你可以通过编辑\
  \ `/etc/init.d/` 中的 `cpufrequtils` 文件切换到 `ondemand`，如下所示：\n\n```\ndebian@ebb:~$\
  \ cd /etc/init.d\ndebian@ebb:/etc/init.d$ more cpufrequtils | grep GOVERNOR=\nGOVERNOR=\"\
  performance\"\ndebian@ebb:/etc/init.d$ sudo nano cpufrequtils\ndebian@ebb:/etc/init.d$\
  \ more cpufrequtils | grep GOVERNOR=\nGOVERNOR=\"ondemand\"\ndebian@ebb:/etc/init.d$\
  \ sudo reboot \n```\n\n## 脚本语言\n\n脚本语言是一种计算机编程语言，用于指定脚本文件，这些文件由运行时环境*直接解释*以执行任务。有许多可用的脚本语言，例如\
  \ Bash、Perl、Lua 和 Python，它们可用于自动化 Beagle 板上的任务执行，例如系统管理、交互，甚至与电子元件的接口。\n\n### 脚本语言选项\n\
  \n你应该为 Beagle 板选择哪种脚本语言？有很多强烈的意见，这是一个困难的话题，因为 Linux 用户往往有自己偏爱的脚本语言；然而，你应该选择功能适合当前任务的脚本语言。以下是一些示例：\n\
  \n*   **Bash 脚本：** 对于不需要高级编程结构的短脚本来说，这是一个很好的选择。本书中广泛使用 Bash 脚本来处理小型、定义明确的任务，例如上一节中的定时代码。你可以在\
  \ Bash 脚本中使用第 3 章中讨论的 Linux 命令。\n\n*   **Perl：** 对于解析文本文档或处理数据流的脚本来说，这是一个很好的选择。它使你能够编写直接的脚本，甚至支持面向对象编程（OOP）范式，这将在本章后面讨论。\n\
  \n*   **Lua：** 是一种快速且轻量级的脚本语言，由于其占用空间小，可用于嵌入式应用。*Lua* 支持面向对象编程（OOP）范式（使用表和函数）和动态类型，这将在稍后讨论。Lua\
  \ 在第 12 章中对 NodeMCU Wi-Fi 模块的编程起着重要作用。\n\n*   **Python：** 非常适合需要更复杂结构且可能在未来被构建或修改的脚本。Python\
  \ 支持 OOP 范式和动态类型，这将在稍后讨论。\n\n这四种脚本语言可用于 Beagle 标准 Debian 镜像。了解所有这些脚本语言会很有用，因为你可能会发现第三方工具或库使当前项目变得简单。本节简要概述了每种语言，包括一段简洁的代码，这些代码在每种语言中执行类似的功能。最后，讨论了一般脚本语言的优缺点。\n\
  \n在第 2 章中，描述了一种使用 Linux shell 命令更改板载 LED 状态的方法。可以打开或关闭 LED，甚至使其闪烁。例如，你可以使用以下命令：\n\
  \n```\nroot@ebb:/sys/class/leds/beaglebone:green:usr3# echo none > trigger\nroot@ebb:/sys/class/leds/beaglebone:green:usr3#\
  \ echo 1 > brightness\nroot@ebb:/sys/class/leds/beaglebone:green:usr3# echo 0 >\
  \ brightness \n```\n\n来打开和关闭用户 LED。本节将研究如何以结构化的编程形式完成相同的任务。\n\n### Bash\n\nBash\
  \ 脚本非常适合不需要高级编程结构的短脚本，而这正是这里要开发的应用程序。第一个程序利用 Linux 控制台命令（如 `echo` 和 `cat`）创建了清单\
  \ 5-1 中的简洁脚本，该脚本允许你通过命令行参数选择是打开、关闭 USR3 LED 还是将其置于闪烁模式。例如，通过调用 `./bashLED on` 使用此脚本将打开\
  \ USR3 LED。它还为你提供触发状态信息。\n\n```\n#!/bin/bash\nLED3_PATH=/sys/class/leds/beaglebone:green:usr3\n\
  \nfunction removeTrigger \n{\n  echo \"none\" >> \"$LED3_PATH/trigger\"\n}\n\necho\
  \ \"Starting the LED Bash Script\"\nif [ $# != 1 ]; then\n  echo \"There is an incorrect\
  \ number of arguments. Usage is:\"\n  echo -e \" bashLED Command \\n  where command\
  \ is one of \"\n  echo -e \"   on, off, flash or status  \\n e.g. bashLED on \"\n\
  \  exit 2\nfi\necho \"The LED Command that was passed is: $1\"\nif [ \"$1\" == \"\
  on\" ]; then\n  echo \"Turning the LED on\"\n  removeTrigger\n  echo \"1\" >> \"\
  $LED3_PATH/brightness\"\nelif [ \"$1\" == \"off\" ]; then\n  echo \"Turning the\
  \ LED off\"\n  removeTrigger\n  echo \"0\" >> \"$LED3_PATH/brightness\"\nelif [\
  \ \"$1\" == \"flash\" ]; then\n  echo \"Flashing the LED\"\n  removeTrigger\n  echo\
  \ \"timer\" >> \"$LED3_PATH/trigger\"\n  echo \"50\" >> \"$LED3_PATH/delay_on\"\n\
  \  echo \"50\" >> \"$LED3_PATH/delay_off\"\nelif [ \"$1\" == \"status\" ]; then\n\
  \  cat \"$LED3_PATH/trigger\";\nfi\necho \"End of the LED Bash Script\" \n```\n\n\
  **清单 5-1:** chp05/bashLED/bashLED\n\n该脚本位于目录 `/chp05/bashLED/` 中。如果你使用 `nano` 编辑器手动输入了脚本，那么该文件需要设置可执行标志才能执行（git\
  \ 仓库保留可执行标志）。因此，要允许所有用户执行此脚本，请使用以下命令：\n\n```\n/chp05/bashLED$ chmod ugo+x bashLED\
  \ \n```\n\n这个脚本内部发生了什么？首先，所有这些命令脚本都以一个 *sha-bang* `#!` 开头，后跟要使用的解释器的名称和位置，因此这里是\
  \ `#!/bin/bash`。该文件只是一个普通的文本文件，但 sha-bang 是一个*魔数*代码，用于通知操作系统该文件是可执行文件。接下来，脚本使用变量\
  \ `LED3_PATH` 定义了要更改状态的 LED 的路径。如果你想使用不同的用户 LED 或路径，可以轻松更改默认值。\n\n该脚本包含一个名为 `removeTrigger`\
  \ 的函数，主要是为了演示 Bash 脚本中函数的结构。该函数在脚本后面被调用。每个 `if` 都以 `fi` 结束。`if` 语句后的 `;` 终止该语句，并允许将\
  \ `then` 放在同一行。`elif` 关键字表示 `else if`，允许你在一个 `if` 块中进行多个比较。换行符 `\\n` 终止语句。\n\n第一个\
  \ `if` 语句确认传递给脚本的参数数量（`$#`）不等于 `1`。请记住，调用此脚本的正确形式是 `./bashLED on`。因此，`on` 将是传递的第一个用户参数（`$1`），并且总共有一个参数。如果没有参数，将显示正确的用法，并且脚本将以返回码\
  \ `2` 退出。该值与 Linux 系统命令一致，其中退出值 2 表示用法不正确。成功由返回值 `0` 表示，因此任何其他非零返回值通常表示脚本失败。\n\n\
  \n\n\n如果传入的参数是 `on`，则代码会显示一条消息；调用 `removeTrigger` 函数；并将字符串 `\"1\"` 写入 LED3 `/sys/`\
  \ 目录下的 `brightness` 文件。其余函数以与第 2 章相同的方式修改 USR3 LED 的值。你可以按如下方式执行脚本：\n\n```\ndebian@ebb:~/exploringbb/chp05/bashLED$\
  \ ./bashLED\n   There are no arguments. Usage is:\n   bashLED Command where command\
  \ is one of\n   on, off, flash or status e.g. bashLED on\ndebian@ebb:~/exploringbb/chp05/bashLED$\
  \ ./bashLED status\n   The LED Command that was passed is: status\n   none … mmc0\
  \ [timer] oneshot disk-activity …\ndebian@ebb:~/exploringbb/chp05/bashLED$ ./bashLED\
  \ on\nThe LED Command that was passed is: on\nTurning the LED on\ndebian@ebb:~/exploringbb/chp05/bashLED$\
  \ sudo ./bashLED flash\ndebian@ebb:~/exploringbb/chp05/bashLED$ ./bashLED off \n\
  ```\n\n请注意，只有在调用 flash 功能时，脚本前面才加了 `sudo` 前缀。这是因为 flash 功能启用了 LED 上的定时器状态，这会在目录中创建两个新的文件条目，名为\
  \ `delay_on` 和 `delay_off`。与该目录中的其他条目不同，这两个新条目不属于 `gpio` 组，因此用户 debian 没有写入权限。\n\
  \n```\ndebian@ebb:/sys/class/leds/beaglebone:green:usr3$ ls -l\n-rw-rw-r-- 1 root\
  \ gpio 4096 May 13 09:16 brightness\n-rw-r--r-- 1 root root 4096 May 13 17:42 delay_off\n\
  -rw-r--r-- 1 root root 4096 May 13 17:42 delay_on  … \n```\n\n出于安全原因，你不能在脚本上使用 setuid\
  \ 位来使其以 root 身份执行。如果用户对该脚本具有写入权限，并且其 setuid 位被设置为 root，那么他们就可以向脚本中注入任何他们想要的命令，从而获得对系统的*事实上*超级用户访问权限。有关\
  \ Bash 脚本编写的全面在线指南，请参阅 Mendel Cooper 的“高级 Bash 脚本编程指南”，网址为 [`www.tldp.org/LDP/abs/html/`](http://www.tldp.org/LDP/abs/html/)。\n\
  \n### Lua\n\nLua 是表 5-1 中性能最好的解释型语言，且优势明显。除了性能出色之外，Lua 还具有简洁直观的语法，初学者也能轻松上手。Lua\
  \ 解释器占用空间很小——大约 131 KB（`ls -lh /usr/bin/lua5.3`），因此非常适合低占用空间的嵌入式应用。例如，Lua 可以成功应用于第\
  \ 12 章中描述的超低成本（2–5 美元）ESP Wi-Fi 模块，尽管这些模块的内存分配有限。事实上，只要平台拥有 ANSI C 编译器，就可以为其构建 Lua\
  \ 解释器。不过，一个缺点是，与其他更通用的脚本语言（如 Python）相比，其标准函数库有些有限。你可以使用 `sudo apt install lua5.3`\
  \ 安装 Lua 解释器。\n\n代码清单 5-2 提供了一个 Lua 脚本，其结构与 Bash 脚本相同，因此无需详细讨论。\n\n```\n#!/usr/bin/lua5.3\n\
  local LED3_PATH = \"/sys/class/leds/beaglebone:green:usr3/\"\n\n-- Example function\
  \ to write a value to the GPIO\nfunction writeLED(directory, filename, value)\n\
  \   file = io.open(directory..filename, \"w\") -- append dir and file names\n  \
  \ file:write(value)                        -- write the value to the file\n   file:close()\n\
  end\n\nprint(\"Starting the Lua LED Program\")\nif arg[1]==nil then            \
  \             -- no argument provided?\n   print(\"This program requires a command\"\
  )\n   print(\"   usage is: ./luaLED.lua command\")\n   print(\"where command is\
  \ one of on, off, or status\")\n   do return end\nend\nif arg[1]==\"on\" then\n\
  \   print(\"Turning the LED on\")\n   writeLED(LED3_PATH, \"trigger\", \"none\"\
  )\n   os.execute(\"sleep 0.1\")\n   writeLED(LED3_PATH, \"brightness\", \"1\")\n\
  elseif arg[1]==\"off\" then\n   print(\"Turning the LED off\")\n   writeLED(LED3_PATH,\
  \ \"trigger\", \"none\")\n   os.execute(\"sleep 0.1\")\n   writeLED(LED3_PATH, \"\
  brightness\", \"0\")\nelseif arg[1]==\"status\" then\n   print(\"Getting the LED\
  \ status\")\n   file = io.open(LED3_PATH..\"brightness\", \"r\")\n   print(string.format(\"\
  The LED state is %s.\", file:read()))\n   file:close()\nelse\n   print(\"Invalid\
  \ command!\")\nend\nprint(\"End of the Lua LED Program\") \n```\n\n**代码清单 5-2:**\
  \ chp05/luaLED/luaLED.lua\n\n你可以像执行 `bashLED` 脚本一样执行此脚本（例如，`./luaLED.lua on` 或在\
  \ `/chp05/luaLED/` 目录下输入 `lua luaLED.lua on`），它将产生类似的输出。使用 Lua 时需要注意两点：字符串索引从 1\
  \ 开始，而不是 0；函数可以返回多个值，这与大多数语言不同。Lua 具有与 C/C++ 的简单接口，这意味着你可以在 Lua 中执行编译后的 C/C++ 代码，或者在\
  \ C/C++ 程序中将 Lua 用作解释器模块。有一个优秀的参考手册，网址为 [`www.lua.org/manual/`](http://www.lua.org/manual/)，以及一份六页的\
  \ Lua 摘要，网址为 [`tiny.cc/beagle501`](http://tiny.cc/beagle501)。\n\n### Perl\n\nPerl\
  \ 是一种功能丰富的脚本语言，可让你访问庞大的可重用模块库，并具有跨其他操作系统（包括 Windows）的可移植性。Perl 以其文本处理和正则表达式模块而闻名。在\
  \ 20 世纪 90 年代末，它是用于动态生成网页的服务器端脚本的流行语言。后来被 Java Servlet、Java Server Pages (JSP) 和\
  \ PHP 等技术所取代。该语言自 20 世纪 80 年代诞生以来不断发展，现在已支持 OOP 范式。Debian Linux 映像默认安装了 Perl 5（v5.24+）。代码清单\
  \ 5-3 提供了一个 Perl 示例片段，其结构与 Bash 脚本相同，因此无需详细讨论。除了语法之外，翻译成 Perl 后实际上变化很小。\n\n```\n\
  #!/usr/bin/perl\n$LED3_PATH = \"/sys/class/leds/beaglebone:green:usr3\";\n$command\
  \ = $ARGV[0];\n\n# Perl Write to LED3 function, the filename  $_[0] is the first\
  \ argument\n#   and the value to write is the second argument $_[1]\nsub writeLED3{\n\
  \  open(FILE, \">\" . $LED3_PATH . $_[0] )\n     or die \"Could not open the file,\
  \ $!\";\n  print FILE $_[1] ;\n  close(FILE);\n}\nsub removeTrigger{\n  writeLED3\
  \ ( \"/trigger\", \"none\");\n}\n\nprint \"Starting the LED Perl Script\\n\";\n\
  # 0 means that there is exactly one argument\nif ( $#ARGV != 0 ){\n  print \"There\
  \ are an incorrect number of arguments. Usage is:\\n\";\n  print \" bashLED Command,\
  \ where command is one of\\n\";\n  print \"   on, off, flash or status e.g. bashLED\
  \ on\\n\";\n  exit 2;\n}\nprint \"The LED Command that was passed is: \" . $command\
  \ . \"\\n\";\nif ( $command eq \"on\" ){\n  print \"Turning the LED on\\n\";\n \
  \ removeTrigger();\n  writeLED3 (\"/brightness\", \"1\");\n}\n…  //full listing\
  \ available in chp05/perlLED/perlLED.pl \n```\n\n**代码清单 5-3:** chp05/perlLED/perlLED.pl（片段）\n\
  \n代码中有几个小点值得注意。文件名上的 `<` 或 `>` 符号分别表示文件是以读取还是写入方式打开的；参数通过 `$ARGV[0…n]` 传递，参数个数可通过\
  \ `$#ARGV` 获取。打开文件、读取或写入、然后关闭文件，是将值写入 `/sys/` 所必需的；参数传递给子程序 `writeLED3`，并通过 `$_[0]`\
  \ 和 `$_[1]` 接收，这虽然不是最优雅的编程语法，但运行良好。要执行此代码，只需输入 `sudo ./perlLED.pl on`，因为 sha-bang\
  \ 标识了 Perl 解释器。你也可以通过输入 `perl perlLED.pl status` 来执行它。\n\n有关安装和使用 Perl 5 的入门好资源，请参阅\
  \ [`learn.perl.org`](http://learn.perl.org) 上的指南“学习 Perl”。\n\n### Python\n\n\n\n\
  \nPython 是一种动态且强类型的面向对象编程语言，设计初衷是易于学习和理解。*动态类型*意味着你无需将类型（例如整数、字符、字符串）与变量关联；相反，变量的值会“记住”自己的类型。因此，如果你创建一个变量\
  \ `x=5`，变量 `x` 的行为将如同整数；但如果你随后用 `x=\"test\"` 赋值，它就会表现得像字符串。*静态类型*语言（如 C/C++ 或 Java）不允许以这种方式（在同一作用域内）重新定义变量。*强类型*意味着将变量从一种类型转换为另一种类型需要显式转换。面向对象编程结构的优势将在本章后面讨论。Python\
  \ 默认安装在 BeagleBoard Debian 镜像中。用于闪烁 LED 的 Python 示例见清单 5-4。\n\n```\n#!/usr/bin/python\n\
  import sys\nLED3_PATH = \"/sys/class/leds/beaglebone:green:usr3\"\n\ndef writeLED\
  \ ( filename, value, path=LED3_PATH ):\n   \"This function writes the passed value\
  \ to the file in the path\"\n   fo = open( path + filename,\"w\")\n   fo.write(value)\n\
  \   fo.close()\n   return\n\ndef removeTrigger():\n   writeLED (filename=\"/trigger\"\
  , value=\"none\")\n   return\n\nprint \"Starting the LED Python Script\"\nif len(sys.argv)!=2:\n\
  \   print \"There are an incorrect number of arguments\"\n   print \"  usage is:\
  \  pythonLED.py command\"\n   print \"  where command is one of on, off, flash or\
  \ status.\"\n   sys.exit(2)\nif sys.argv[1]==\"on\":\n   print \"Turning the LED\
  \ on\"\n   removeTrigger()\n   writeLED (filename=\"/brightness\", value=\"1\")\n\
  elif sys.argv[1]==\"off\":\n   print \"Turning the LED off\"\n   removeTrigger()\n\
  \   writeLED (filename=\"/brightness\", value=\"0\")\nelif sys.argv[1]==\"flash\"\
  :\n   print \"Flashing the LED\"\n   writeLED (filename=\"/trigger\", value=\"timer\"\
  )\n   writeLED (filename=\"/delay_on\", value=\"50\")\n   writeLED (filename=\"\
  /delay_off\", value=\"50\")\nelif sys.argv[1]==\"status\":\n   print \"Getting the\
  \ LED trigger status\"\n   fo = open( LED3_PATH + \"/trigger\", \"r\")\n   print\
  \ fo.read()\n   fo.close()\nelse:\n   print \"Invalid Command!\"\nprint \"End of\
  \ Python Script\" \n```\n\n**清单 5-4:** chp05/pythonLED/pythonLED.py\n\n这段代码的格式很重要——事实上，Python\
  \ 通过将缩进作为结构元素来强制执行代码布局。例如，在 `if len(sys.argv)!=2:` 这一行之后，接下来的几行会“缩进”。如果你没有缩进其中一行——比如\
  \ `sys.exit(2)` 这一行——那么它就不会成为条件 `if` 语句的一部分，并且程序在此处总会退出。要执行此示例，请在 `pythonLED` 目录中输入以下内容：\n\
  \n```\ndebian@ebb:~/exploringbb/chp05/pythonLED$ sudo ./pythonLED.py flash\nFlashing\
  \ the LED\ndebian@ebb:~/exploringbb/chp05/pythonLED$ ./pythonLED.py status\n… [timer]\
  \ oneshot disk-activity ide-disk mtd nand-disk heartbeat … \n```\n\nPython 在 Beagle\
  \ 平台上因良好的教学原因而广受欢迎，但随着用户将注意力转向更高级的应用，性能缺陷就难以忽视了。本章最后讨论了如何使用 Cython 或将 Python 与 C/C++\
  \ 结合来显著提升 Python 的性能。然而，Cython 本身的复杂性应该促使你考虑直接使用 C/C++。\n\n为了结束关于脚本语言的讨论，Beagle\
  \ 平台上的应用有几种强有力的选择。表 5-2 列出了命令脚本语言在编译语言（稍后讨论）背景下的主要优缺点。\n\n| **优点** | **缺点** |\n\
  | --- | --- |\n| 非常适合自动化需要调用 Linux 命令的 Linux 系统管理任务。 | 对于复杂的数值或算法任务，性能较差。 |\n| 易于修改和适应变化。源代码始终存在，并且不需要复杂的工具链（参见第\
  \ 7 章）即可进行修改。通常，`nano` 是你唯一需要的工具。 | 通常，对数据结构、图形用户界面、套接字、线程等的编程支持相对较差/较慢。 |\n| 通常，编程语法和结构直观，与\
  \ C++ 和 Java 等语言相比更容易学习。 | 通常，对涉及多个用户开发模块或组件的复杂应用支持较差（Python 和 Perl 支持面向对象编程）。 |\n\
  | 通常，偶尔编程的人员可以快速完成编码解决方案。 | 代码是开放的。直接访问查看代码可能涉及知识产权或安全问题。 |\n|  | 缺乏开发工具（例如重构）。\
  \ |\n\n**表 5-2****:** 命令脚本语言的优缺点\n\n## 动态编译语言\n\n对于刚才讨论的解释型语言，源代码文本文件由用户传递给运行时解释器来“执行”，然后解释器逐行翻译或执行每一行代码。JavaScript\
  \ 和 Java 具有不同的生命周期，并且是截然不同的语言。\n\n### Beagle 板上的 JavaScript 和 Node.js\n\n如第 2 章中“Node.js、Cloud9\
  \ 和 BoneScript”一节所述，Node.js 是在服务器端运行的 JavaScript。JavaScript 本质上是一种解释型语言；然而，得益于 Google\
  \ 为其 Chrome 浏览器开发的 V8 引擎，Node.js 实际上在引擎加载 JavaScript 时将其编译为原生机器指令。这被称为*即时编译*（JIT）或*动态翻译*。正如本章开头所示，由于针对\
  \ ARMv7 平台的优化，Node.js 在数值计算任务上的性能对于解释型语言来说令人印象深刻。\n\n清单 5-5 是使用 JavaScript 编写的相同\
  \ LED 代码示例，并通过调用 `nodejs` 可执行文件来运行。\n\n```\n// Ignore the first two arguments (nodejs\
  \ and the program name)\nvar myArgs = process.argv.slice(2);\nvar LED3_PATH = \"\
  /sys/class/leds/beaglebone:green:usr3\"\n\nfunction writeLED( filename, value, path\
  \ ){\n  var fs = require('fs');\n  try {\n  // The next call must be syncronous,\
  \ otherwise the timer will not work\n     fs.writeFileSync(path+filename, value);\n\
  \  }\n  catch (err) {\n     console.log(\"The Write Failed to the File: \" + path+filename);\n\
  \  }\n}\n\nfunction removeTrigger(){\n   writeLED(\"/trigger\", \"none\", LED3_PATH);\n\
  }\n\nconsole.log(\"Starting the LED Node.js Program\");\nif (myArgs[0]==null){\n\
  \   console.log(\"There is an incorrect number of arguments.\");\n   console.log(\"\
  \  Usage is: nodejs nodejsLED.js command\");\n   console.log(\"  where command is\
  \ one of: on, off, flash or status.\");\n   process.exit(2);   //exits with the\
  \ error code 2 (incorrect usage)\n}\nswitch (myArgs[0]) {\n   case 'on':\n     \
  \ console.log(\"Turning the LED On\");\n      removeTrigger();\n      writeLED(\"\
  /brightness\", \"1\", LED3_PATH);\n      break;\n   case 'off':\n      console.log(\"\
  Turning the LED Off\");\n      removeTrigger();\n      writeLED(\"/brightness\"\
  , \"0\", LED3_PATH);\n      break;\n   case 'flash':\n      console.log(\"Making\
  \ the LED Flash\");\n      writeLED(\"/trigger\", \"timer\", LED3_PATH);\n     \
  \ writeLED(\"/delay_on\", \"50\", LED3_PATH);\n      writeLED(\"/delay_off\", \"\
  50\", LED3_PATH);\n      break;\n   case 'status':\n      console.log(\"Getting\
  \ the LED Status\");\n      fs = require('fs');\n      fs.readFile(LED3_PATH+\"\
  /trigger\", 'utf8', function (err, data) {\n         if (err) { return console.log(err);\
  \ }\n         console.log(data);\n      });\n      break;\n   default:\n      console.log(\"\
  Invalid Command\");\n}\nconsole.log(\"End of Node.js script\"); \n```\n\n**清单 5-5:**\
  \ chp05/nodejsLED/nodejsLED.js\n\n\n\n\n\n代码位于 `/chp05/nodejsLED/` 目录中，可以通过输入 `nodejs\
  \ nodejsLED.js [option]` 来执行。代码的结构与之前的示例相同，语法差异不大；然而，Node.js 与其他语言之间有一个主要区别：*函数是异步调用的*。到目前为止，所有讨论过的语言都遵循顺序执行模式。因此，当调用一个函数时，*程序计数器*（也称为*指令指针*）会进入该函数，直到函数执行完毕才会退出。例如，考虑如下代码：\n\
  \n```\nfunctionA();\nfunctionB(); \n```\n\n`functionA()` 被调用，`functionB()` 只有在 `functionA()`\
  \ 完全执行完毕后才会被调用。但在 Node.js 中并非如此！在 Node.js 中，`functionA()` 首先被调用，然后 Node.js 继续执行后续代码，包括进入\
  \ `functionB()`，而此时 `functionA()` 中的代码仍在执行。这给当前应用程序带来了一个严重的问题，特别是以下这段代码：\n\n```\n\
  case 'flash':\n      console.log(\"Making the LED Flash\");\n      writeLED(\"/trigger\"\
  , \"timer\", LED3_PATH);\n      writeLED(\"/delay_on\", \"50\", LED3_PATH);\n  \
  \    writeLED(\"/delay_off\", \"50\", LED3_PATH);\n      break; \n```\n\n第一次调用 `writeLED()`\
  \ 会设置 `sysfs` 文件系统（如第 2 章所述），使其包含新的 `delay_on` 和 `delay_off` 文件条目。然而，由于调用的异步特性，第一次\
  \ `writeLED()` 调用尚未完成文件系统的设置，接下来的两次 `writeLED()` 调用就已经执行了。这意味着找不到 `delay_on` 和 `delay_off`\
  \ 文件系统条目，导致写入它们的代码失败。你可以通过将程序顶部的调用从 `fs.writeFileSync(…)` 改为 `fs.writeFile(…)` 来测试这一点。\n\
  \n为了解决这个问题，你可以*同步化*（防止线程被中断）调用三个 `writeLED()` 函数的代码块，确保这些函数按顺序执行。或者，如本代码示例所示，你可以使用\
  \ Node.js 的 `writeFile()` 函数的一个特殊版本 `writeFileSync()`，以确保第一个修改文件系统的函数调用会阻止其他 `writeFileSync()`\
  \ 调用发生。\n\nNode.js 允许异步调用，因为这有助于确保代码保持“活跃”。例如，如果你执行一个数据库查询，你的代码可以在等待结果的同时做其他有用的事情。当结果可用时，会执行一个*回调函数*来处理接收到的数据。这种异步结构非常适合互联网连接的应用，在这些应用中，网站和\
  \ Web 服务会发布和请求数据，而响应何时到达（甚至是否到达）并不明确。Node.js 有一个*事件循环*来管理所有异步调用，根据需要为每个调用创建线程，并确保当异步调用完成其分配的任务时，回调函数被执行。Node.js\
  \ 将在第 11 章讨论物联网时再次提及。\n\n### Beagle 板上的 Java\n\n到目前为止，本章讨论的是*解释型语言*，这意味着源代码文件（文本文件）在运行时由解释器或动态翻译器执行。重要的是，代码以源代码形式存在，直到使用解释器执行的那一刻。\n\
  \n对于传统的*编译型语言*，源代码（文本文件）通过一组工具（我们暂时称之为*编译器*）直接翻译成特定平台的机器码。翻译发生在代码开发阶段；一旦编译完成，代码无需任何额外的运行时工具即可执行。\n\
  \nJava 是一种混合语言：你将 Java 代码写在源文件中，例如 `example.java`，这是一个普通的文本文件。Java 编译器（`javac`）编译并将此源代码翻译成\
  \ Java *虚拟机*（VM）的机器码指令（称为*字节码*）。常规编译代码在不同硬件架构之间不可移植，但字节码文件（`.class` 文件）可以在任何实现了\
  \ Java VM 的平台上执行。最初，Java VM 在运行时解释字节码文件；然而，最近 VM 采用动态翻译技术，在运行时将字节码转换为本地机器指令。\n\n\
  这种生命周期的主要优势在于编译后的字节码可以在不同平台之间移植，并且由于它被编译成通用的机器指令码，动态翻译成“真实”机器码的效率很高。与编译型语言相比，这种结构的缺点在于\
  \ VM 会给最终可执行文件的执行增加开销。\n\nJava 运行时环境（JRE）提供了 Java 虚拟机（JVM），但默认情况下并未安装在 Beagle Debian\
  \ 镜像中，因为安装后大约占用 177 MB。\n\n清单 5-6 提供了一个源代码示例，该示例也以字节码形式存在于 GitHub 仓库中。\n\n```\n\
  package exploringBB;\nimport java.io.*;\n\npublic class LEDExample {\n  private\
  \ static String LED3 = \"/sys/class/leds/beaglebone:green:usr3\";\n\n  private static\
  \ void writeLED(String fname, String value, String path){\n     try{\n        BufferedWriter\
  \ bw = new BufferedWriter(new FileWriter(path+fname));\n        bw.write(value);\n\
  \        bw.close();\n     }\n     catch(IOException e){\n        System.err.println(\"\
  Failed to access Sysfs: \" + fname);\n     }\n  }\n\n  private static void removeTrigger(){\n\
  \     writeLED(\"/trigger\", \"none\", LED3);\n  }\n\n  public static void main(String[]\
  \ args) {\n     System.out.println(\"Starting the LED Java Application\");\n   \
  \  if(args.length!=1) {\n        System.out.println(\"Incorrect number of arguments.\"\
  ); …\n        System.exit(2);\n     }\n     if(args[0].equalsIgnoreCase(\"On\")||args[0].equalsIgnoreCase(\"\
  Off\")){\n        System.out.println(\"Turning the LED \" + args[0]);\n        removeTrigger();\n\
  \        writeLED(\"/brightness\",args[0].equalsIgnoreCase(\"On\")?\"1\":\"0\",LED3);\n\
  \     }\n     …  // full code available in the repository directory\n  }\n} \n```\n\
  \n**清单 5-6：** chp05/javaLED/LEDExample.java（片段）\n\n该程序可以使用 `/chp05/javaLED/` 目录中的\
  \ `run` 脚本执行。你可以看到该类被放置在包目录 `exploringBB` 中。\n\n早期版本的 Java 计算性能较差；然而，较新的版本利用了运行时的动态翻译（即时编译，即\
  \ JIT 编译），并且如本章开头所示，其性能（包括动态翻译）比本地编译的 C++ 代码慢不到 15%，仅增加了少量内存开销。表 5-3 列出了在 Beagle\
  \ 平台上使用 Java 进行开发的一些优缺点。\n\n| **优点** | **缺点** |\n| --- | --- |\n| 代码可移植。在 PC 上编译的代码可以在任何\
  \ Beagle 板或其他嵌入式 Linux 平台上执行。 | 沙盒应用程序无法访问系统内存、寄存器或系统调用（除了通过 `/proc/` 或 Java 本地接口（`JNI`））。\
  \ |\n| 有大量可用的代码库，可以完全集成到你的项目中。 | 由于所需的环境变量，以 root 身份执行稍显困难。 |\n| 完全支持面向对象编程。 | 不适合脚本编写。\
  \ |\n| 可用于连接显示器的 Beagle 板上的用户界面应用程序开发。 | 计算性能尚可，但比优化的 C/C++ 程序慢。内存占用稍高。 |\n\n\n\n\
  \n| 对多线程的强力支持。 | 强类型且无无符号整数类型。 |\n| 使用垃圾收集器自动分配和释放内存，消除了内存泄漏的担忧。 | 如果部署到“涉及或控制硬件”的平台，则需要支付版税。¹¹\
  \ |\n\n**表 5-3：** Beagle 平台上 Java 的优缺点\n\n要在 Debian 下执行需要访问`/sys/`目录的 Java 应用程序，你需要让应用程序以\
  \ root 权限运行。不幸的是，由于你需要将字节码（`.class`）文件传递给 Java 虚拟机，你必须调用`sudo`并创建一个临时 shell，形式为`sudo\
  \ sh -c 'java myClass'`。可以使用以下命令执行应用程序：\n\n```\n…/chp05/javaLED$ sudo sh -c 'java\
  \ exploringBB.LEDExample Off'\nStarting the LED Java Application\nTurning the LED\
  \ Off\n…/chp05/javaLED$ sudo sh -c 'java exploringBB.LEDExample On'\nStarting the\
  \ LED Java Application\nTurning the LED On \n```\n\n## Beagle 板上的 C 和 C++\n\nC++是由\
  \ Bjarne Stroustrup 在贝尔实验室（现 AT&T 实验室）于 1983 年至 1985 年间开发的。它基于 C 语言（1972 年命名），而\
  \ C 语言是由 Dennis Ritchie 在 20 世纪 70 年代初（1969-1973）为 AT&T 的 UNIX 系统开发的。除了添加*面向对象*（OO）框架（最初称为“带类的\
  \ C”）之外，C++还通过添加更好的类型检查等特性改进了 C 语言。它迅速获得了广泛使用，这主要归功于它与 C 编程语言语法的相似性，以及它允许在可能的情况下使用现有的\
  \ C 代码。C++不是纯粹的 OO 语言，而是一种混合体，具有 OO 语言的组织结构，但保留了 C 的效率，例如类型化变量和指针。\n\n与 Java 不同，C++并非由某一家公司“拥有”。1998\
  \ 年，国际标准化组织（ISO）委员会通过了一项全球统一的语言规范，旨在消除各种 C++编译器之间的不一致性（Stroustrup, 1998）。这一标准化工作至今仍在继续，C++11\
  \ 于 2011 年获得 ISO 批准（gcc 4.7+支持标志`-std=c++11`），C++14 由 gcc 5 版本完全支持，而 C++17 的许多特性在\
  \ gcc 6 版本中得到支持（gcc 7 版本将提供更多）。在撰写本文时，当前 gcc 版本和可用特性的确切集合可以通过以下方式确定：\n\n```\ndebian@ebb:~/exploringbb/chp05/overview$\
  \ g++ -v\n…\ngcc version 6.3.0 20170516 (Debian 6.3.0-18+deb9u1)\ndebian@ebb:~/exploringbb/chp05/overview$\
  \ more version.cpp\n#include <iostream>\nint main(int argc, char** argv) {\n  std::cout\
  \ << __cplusplus << std::endl;\n  return 0;\n}\n…/chp05/overview$ g++ version.cpp\
  \ -o version\n…/chp05/overview$ ./version\n201402\n…/chp05/overview$ g++ -std=c++17\
  \ version.cpp -o version\n…/chp05/overview$ ./version\n201500 \n```\n\n虽然了解你的 gcc\
  \ 版本所提供的功能很重要，但 C++的许多较新特性对于在嵌入式设备上开发代码并非至关重要。\n\n为什么我在本书中比其他语言更详细地介绍 C 和 C++？\n\
  \n*   首先，我相信如果你能理解 C 和 C++的工作原理，那么你就能理解任何语言的工作原理。事实上，大多数编译器（Java 本地方法、Java 虚拟机、JavaScript）和解释器（Bash、Lua、Perl\
  \ 和 Python）都是用 C 编写的。\n\n*   在本章开头，描述了 C/C++相对于许多其他语言的显著性能优势（是的，仅通过一次随机测试就证明了！）。同样重要的是要记住，在\
  \ PocketBeagle 上以 1 GHz 运行的相同代码，比在 Intel i7-5820K（3.3 GHz）的仅一个线程（共 12 个）上运行的相同代码慢大约\
  \ 53 倍。\n\n*   第 16 章解释了如何开发 Linux 可加载内核模块（LKM），这需要对 C 编程语言有合理的掌握。本章后面提供了代码，演示了如何使用\
  \ GNU C 库（glibc）直接与 Linux 内核空间通信。\n\n*   本书中的许多应用程序示例，例如流式网络数据和图像处理，都使用 C++和一个名为\
  \ Qt 的全面 C++代码库。\n\n表 5-4 列出了在 Beagle 板上使用 C/C++的一些优缺点。下一节将回顾 C 和 C++编程的一些基础知识，以确保你具备本书其余章节所需的技能。在一本书的一章中不可能涵盖\
  \ C 和 C++编程的各个方面。本章末尾的“进一步阅读”部分将引导你阅读推荐文本。\n\n| **优点** | **缺点** |\n| --- | --- |\n\
  | 你可以直接在板上构建代码，也可以交叉编译代码。C/C++语言是 ISO 标准，不由单一供应商拥有。 | 编译后的代码不可移植。为你的 x86 桌面编译的代码无法在\
  \ Beagle 板的 ARM 处理器上运行。 |\n| C++完全支持过程式编程、OOP，并通过使用 STL（标准模板库）支持泛型。 | 许多人认为这些语言难以掌握。存在一种倾向，即需要先了解一切才能做任何事情。\
  \ |\n| 它提供了出色的计算性能，尤其是在优化后；然而，优化可能很困难，并且可能降低代码的可移植性。 | 指针的使用和可用的低级控制使代码容易发生内存泄漏。通过仔细编码可以避免这些问题，并且可以比动态内存管理方案更高效。\
  \ |\n| 可以使用第三方库在 Beagle 板上进行用户界面应用程序开发。诸如 Qt 和 Boost 之类的库为组件、网络等提供了广泛的额外资源。 | 默认情况下，C\
  \ 和 C++不支持图形用户界面、网络套接字等。需要第三方库。 |\n| 提供对 glibc 的低级访问，以便与 Linux 系统集成。程序可以`setuid`为\
  \ root。 | 不适合脚本编写（有一种 C shell，`csh`，其语法类似于 C）。也不适合 Web 开发。 |\n| Linux 内核是用 C 编写的，了解\
  \ C/C++可以帮助你编写设备驱动程序或为 Linux 内核开发做出贡献。 | C++试图涵盖从低级到高级的编程任务，但编写非常可扩展的企业或 Web 应用程序可能很困难。\
  \ |\n\n**表 5-4：** Beagle 板上 C/C++的优缺点\n\n下一节将回顾应用于 Beagle 板示例的核心原则。它旨在作为一个概述和一组参考示例，你可以反复查阅。它还侧重于导致我的学生遇到困难的主题，指出常见错误。另外，请记住，我的面向对象编程模块的课程笔记以及更多支持材料可在[`ee402.eeng.dcu.ie`](http://ee402.eeng.dcu.ie)上公开获取。\n\
  \n### C 和 C++语言概述\n\n以下示例可以使用 nano 编辑器编辑，并直接在 Beagle 板上使用默认安装的 gcc 和 g++编译器进行编译。代码位于目录`chp05/overview/`中。\n\
  \n在任何新语言中，你应该始终编写的第一个示例是“Hello World”。清单 5-7 和 5-8 分别提供了 C 和 C++代码，以便直接比较这两种语言。\n\
  \n```\n#include <stdio.h>\nint main(int argc, char *argv[]){\n   printf(\"Hello\
  \ World!\\n\");\n   return 0;\n} \n```\n\n**清单 5-7：** `chp05/overview/helloworld.c`\n\
  \n\n\n\n```\n#include<iostream>\nint main(int argc, char *argv[]){\n   std::cout\
  \ << \"Hello World!\" << std::endl;\n   return 0;\n} \n```\n\n**清单 5-8:** `chp05/overview/helloworld.cpp`\n\
  \n`#include` 调用是一个预处理指令，它在 C 语言中有效加载 `stdio.h` 文件（`/usr/include/stdio.h`）的内容，在 C++\
  \ 中加载 `iostream` 头文件（`/usr/include/c++/6/iostream`）的内容，并将代码复制粘贴到源文件中这个确切的位置。这些头文件包含函数原型，使编译器能够链接并理解诸如\
  \ `stdio.h` 中的 `printf()` 以及 `iostream` 中的 `cout` 等流函数的格式。这些函数的实际实现位于共享库依赖中。包含文件名周围的尖括号（`<\
  \ >`）表示这是一个标准包含，而不是用户自定义的 `include`（后者会使用双引号）。\n\n`main()` 函数是应用程序代码的起点。在你的应用程序中只能有一个名为\
  \ `main()` 的函数。`main()` 前面的 `int` 表示程序将向 shell 提示符返回一个数字。如前所述，通常用 `0` 表示成功完成，`2`\
  \ 表示无效使用，其他数字表示失败状态。在本例中，通过 `return 0` 这一行将该值返回给 shell 提示符。`main()` 函数默认会返回 `0`。请记住，你可以在\
  \ shell 提示符下使用 `echo $?` 查看最后返回的值。\n\n`main()` 函数的*参数*是 `int argc` 和 `char *argv[]`。正如你在脚本示例中看到的，shell\
  \ 可以向你的应用程序传递*参数*，提供参数数量（`argc`）和一个字符串数组（`*argv[]`）。在 C/C++ 中，第一个传递的参数是 `argv[0]`，它包含用于执行应用程序的名称和完整路径。\n\
  \nC 代码行 `printf(\"Hello World!\\n\");` 允许你向 Linux shell 写入内容，其中 `\\n` 表示换行。`printf()`\
  \ 函数为你提供了额外的格式化指令，用于输出数字、字符串等。请注意，每条语句都以分号结尾。\n\nC++ 代码行 `std::cout << \"Hello World!\"\
  \ << std::endl;` 与 `printf()` 函数一样输出字符串。在这里，`cout` 表示输出流，实际使用的函数是 `<<`，它被称为*输出流运算符*。语法将在后面讨论，但\
  \ `std::cout` 表示命名空间 `std` 中的输出流。`endl`（end line）表示与 `\\n` 相同。这看起来可能更冗长，但稍后在讨论 C++\
  \ 类时你会明白它的用处。这些程序可以通过输入以下命令直接在 Beagle 板上编译和执行：\n\n```\n…/chp05/overview$ gcc helloworld.c\
  \ -o helloworldc\n…/chp05/overview$ ./helloworldc\nHello World!\n…/chp05/overview$\
  \ g++ helloworld.cpp -o helloworldcpp\n…/chp05/overview$ ./helloworldcpp\nHello\
  \ World! \n```\n\nC 和 C++ 可执行文件的大小不同，这是因为使用了不同的头文件、输出函数以及确切的编译器。\n\n```\ndebian@ebb:~/exploringbb/chp05/overview$\
  \ ls -l helloworldc*\n-rwxr-xr-x 1 debian debian 8348 May 14 02:48 helloworldc\n\
  -rwxr-xr-x 1 debian debian 9152 May 14 02:48 helloworldcpp \n```\n\n#### *编译与链接*\n\
  \n你刚刚看到了如何构建 C 或 C++ 应用程序，但在前面的示例中有几个中间步骤并不明显，因为默认情况下中间阶段的输出不会被保留。图 5-1 展示了从预处理到链接的完整构建过程。\n\
  \n![流程图显示 3 个带标签的虚线框，箭头指向带阴影的框，标签分别为平台无关源代码、GNU CPP、临时处理后的源代码、C/C++ 编译器等（从上到下）。](img/c05f001.jpg)\n\
  \n**图 5-1****：**在 Beagle 板上构建 C/C++ 应用程序\n\n你可以自己执行图 5-1 中的步骤。以下是使用 `Helloworld.cpp`\
  \ 代码示例实际执行的步骤示例。可以按如下方式显式执行这些步骤，以便查看每个阶段的输出：\n\n```\ndebian@ebb:/tmp$ ls -l helloworld.cpp\n\
  -rw-r--r-- 1 debian debian 114 May 14 02:51 helloworld.cpp\ndebian@ebb:/tmp$ g++\
  \ -E helloworld.cpp > processed.cpp\ndebian@ebb:/tmp$ ls -l processed.cpp\n-rw-r--r--\
  \ 1 debian debian 641377 May 14 02:51 processed.cpp\ndebian@ebb:/tmp$ g++ -S processed.cpp\
  \ -o helloworld.s\ndebian@ebb:/tmp$ ls -l helloworld.s\n-rw-r--r-- 1 debian debian\
  \ 3161 May 14 02:52 helloworld.s\ndebian@ebb:/tmp$ g++ -c helloworld.s\ndebian@ebb:/tmp$\
  \ ls\nhelloworld.cpp     helloworld.o     helloworld.s    processed.cpp\ndebian@ebb:/tmp$\
  \ g++ helloworld.o -o helloworld\ndebian@ebb:/tmp$ ls -l helloworld\n-rwxr-xr-x\
  \ 1 debian debian 9148 May 14 02:53 helloworld\ndebian@ebb:/tmp$ ./helloworld\n\
  Hello World! \n```\n\n你可以通过输入 `less processed.cpp` 查看预处理后的文本格式输出，你会看到必要的头文件被粘贴到代码顶部。在文件底部你会找到你的代码。该文件被传递给\
  \ C/C++ 编译器，编译器验证代码并生成平台无关的汇编代码（`.s`）。你可以通过输入 `less helloworld.s` 查看此代码，如图 5-1 所示。\n\
  \n然后，这个 `.s` 文本文件被传递给汇编器，汇编器将平台无关的指令转换为 Beagle 板的二进制指令（`.o` 文件）。你可以使用板上的 `objdump`（对象文件转储）工具查看生成的汇编语言代码，输入\
  \ `objdump -D helloworld.o`，如图 5-1 所示。\n\n目标文件包含通用的二进制汇编代码，但尚未提供足够的信息以在板上执行。然而，在链接最终的可执行代码后，`helloworld`\
  \ 包含了与库（根据需要静态和动态）结合后的目标特定汇编语言代码——你可以再次对可执行文件使用 `objdump` 工具，结果如下：\n\n```\n…/chp05/overview$\
  \ objdump -d helloworldcpp | less\nhelloworldcpp:     file format elf32-littlearm\n\
  Disassembly of section .init:\n00000668 <_init>:\n 668:   e92d4008        push \
  \   {r3, lr}\n 66c:   eb00002f        bl      730 <call_weak_fn>\n 670:   e8bd8008\
  \        pop     {r3, pc}\n… \n```\n\n第一列是内存地址，每条指令之间步进 4 字节（32 位）（即 `66c` − `668`\
  \ = `4`）。第二列是该地址处的完整 4 字节指令。第三列和第四列是第二列的人类可读版本，描述了 4 字节指令的操作码和操作数。例如，地址 `668` 处的第一条指令是\
  \ `push`，它将 `r3`（ARM 处理器的 16 个 32 位寄存器之一，标记为 `r0-r15`）以及 `lr`（链接寄存器，`r14`）压入堆栈。\n\
  \n理解 ARM 指令本身就是另一本书的内容（参见 [`infocenter.arm.com`](http://infocenter.arm.com)）。然而，了解任何本地编译的代码，无论是否使用\
  \ OOP 范式，最终都会产生底层机器码，而机器码不支持动态类型、OOP 或任何此类高级结构，这一点很有用。事实上，无论你使用解释型语言还是编译型语言，代码最终都必须转换为机器码，才能在板的\
  \ ARM 处理器上执行。\n\n#### *编写最短的 C/C++ 程序*\n\n`HelloWorld` 示例是 C 或 C++ 中能编写的最短程序吗？不，清单\
  \ 5-9 是最短的有效 C 和 C++ 程序。\n\n```\nmain(){} \n```\n\n**清单 5-9:** `chp05/overview/short.c`\n\
  \n\n\n\n\n这是一个功能完整的 C 和 C++ 程序，编译无错误且运行完美，尽管没有输出。因此，在构建 C/C++ 程序时，不需要库；无需为 `main()`\
  \ 指定返回类型，因为它默认为 `int`；在 C++ 中 `main()` 函数默认返回 `0`，而在 C 中返回未定义的值（参见下面的 `echo $?`\
  \ 调用）；空函数也是有效的函数。该程序可以按如下方式编译为 C 或 C++ 程序：\n\n```\n…/chp05/overview$ gcc short.c\
  \ -o shortc\nshort.c:1:1: warning: return type defaults to 'int' …\n…/chp05/overview$\
  \ g++ short.c -o shortcpp\n…/chp05/overview$ ls -l shortc*\n-rwxr-xr-x 1 debian\
  \ debian 8276 May 14 03:10 shortc\n-rwxr-xr-x 1 debian debian 8292 May 14 03:10\
  \ shortcpp\n…/chp05/overview$ ./shortc\n…/chp05/overview$ echo $?\n0\n…/chp05/overview$\
  \ ./shortcpp\n…/chp05/overview$ echo $?\n0 \n```\n\n这是 C 和 C++ 最大的弱点之一。它假设你在编写任何代码之前就已经了解语言运作的所有细节。事实上，上述示例中的某些方面可能被程序员用来展示他们有多聪明，但实际上他们是在展示不良实践——让代码对不那么“专业”的程序员来说难以阅读。例如，如果你重写\
  \ `short.cpp` 中的 C++ 代码，加入注释和显式语句，创建 `short2.cpp`，然后使用 `-O3` 优化标志编译两者，输出如下：\n\n\
  ```\n…/chp05/overview$ more short.cpp\nmain(){}\n…/chp05/overview$ more short2.cpp\n\
  // A really useless program, but a program nevertheless\nint main(int argc, char\
  \ *argv[]){\n   return 0;\n}\n…/chp05/overview$ g++ -O3 short.cpp -o short01\n…/chp05/overview$\
  \ g++ -O3 short2.cpp -o short02\n…/chp05/overview$ ls -l short0*\n-rwxr-xr-x 1 debian\
  \ debian 8292 May 14 03:15 short01\n-rwxr-xr-x 1 debian debian 8292 May 14 03:15\
  \ short02 \n```\n\n注意，可执行文件大小完全相同！添加注释、显式返回语句、显式返回类型和显式参数对最终二进制应用程序的大小没有影响。然而，好处是代码的实际功能更容易被新手程序员理解。\n\
  \n#### *静态编译与动态编译*\n\n你可以使用 `-static` 标志进行构建，以静态链接库，而不是默认的与共享库动态链接的形式。这意味着编译器和链接器会将代码所需的所有库例程直接放入程序可执行文件中。\n\
  \n```\n…/chp05/overview$ g++ -O3 short.cpp -static -o short_static\n…/chp05/overview$\
  \ ls -l short_static\n-rwxr-xr-x 1 debian debian 448792 May 14 03:19 short_static\
  \ \n```\n\n很明显，程序可执行文件的大小从 8 KB 显著增长到 449 KB。这种形式的一个优点是，程序可以在未安装 C++ 标准库的 ARM 系统上执行。\n\
  \n对于动态链接，值得注意的是，你可以通过调用 `ldd` 来发现编译后的代码使用了哪些共享库依赖项。\n\n```\n…/chp05/overview$ ldd\
  \ shortcpp\nlinux-vdso.so.1 (0xbefcd000)\nlibstdc++.so.6 => /usr/lib/arm-linux-gnueabihf/libstdc++.so.6\
  \ (0xb6dcf000)\nlibm.so.6 => /lib/arm-linux-gnueabihf/libm.so.6 (0xb6d57000)\nlibgcc_s.so.1\
  \ => /lib/arm-linux-gnueabihf/libgcc_s.so.1 (0xb6d2e000)\nlibc.so.6 => /lib/arm-linux-gnueabihf/libc.so.6\
  \ (0xb6c40000)\n/lib/ld-linux-armhf.so.3 (0xb6eed000) \n```\n\n从输出中可以看出，Beagle 板\
  \ Debian 镜像上的 `g++` 编译器（以及 `glibc`）已被修补，默认支持生成硬浮点（`gnueabihf`）指令。这使得浮点数的代码执行速度比使用软浮点\
  \ ABI（应用程序二进制接口）在软件中模拟浮点支持（`gnueabi`）更快。\n\n#### *C/C++ 中的变量与运算符*\n\n*变量*是存储在为其预留的内存块中的数据项。变量的类型定义了预留的内存量及其行为方式（参见图\
  \ 5-2）。该图描述了清单 5-10 中代码示例 `sizeofvariables.c` 的输出。\n\n![在 32 位 Beagle 板上运行的变量内存分配，显示\
  \ 6 个带阴影的圆角方框，分别对应 f、e、d、c、b 和 a（从左到右），段内有字母数字标签，以及变量名、类型等箭头。](img/c05f002.jpg)\n\
  \n**图 5-2：** 在 32 位 Beagle 板上运行的变量内存分配\n\n清单 5-10 详细介绍了 C/C++ 中可用的各种变量。当你创建一个*局部变量*\
  \ `c` 时，会根据其类型在*栈*（预定的保留快速内存）上分配一个内存块/框。在本例中，`c` 是一个 `int` 值；因此，分配了四个字节（32 位）的内存来存储该值。假设\
  \ C/C++ 中的变量用任意值初始化；因此，在本例中 `c = 545;` 通过将数字 `545` 放入框中来替换该初始随机值。无论你在该框中存储数字 `0`\
  \ 还是 `2,147,483,647`，它仍然会占用 32 位内存！请注意，局部变量内存的顺序没有保证——在这个特定示例中，它恰好是线性的。\n\n```\n\
  #include<stdio.h>\n#include<stdbool.h>     //required for the C bool typedef\n\n\
  int main(){\n   double a = 3.14159;\n   float b = 25.0;\n   int c = 545;       \
  \  // note: variables are not = 0 by default!\n   long int d = 123;\n   char e =\
  \ 'A';\n   bool f = true;       // no need for definition in C++\n   printf(\"a\
  \ val %.4f & size %d bytes (@addr %p).\\n\", a, sizeof(a),&a);\n   printf(\"b val\
  \ %4.2f & size %d bytes (@addr %p).\\n\", b, sizeof(b),&b);\n   printf(\"c val %d\
  \ (oct %o, hex %x) & \" \\\n          \"size %d bytes (@addr %p).\\n\", c, c, c,\
  \ sizeof(c), &c);\n   printf(\"d val %d & size %d bytes (@addr %p).\\n\", d, sizeof(d),\
  \ &d);\n   printf(\"e val %c & size %d bytes (@addr %p).\\n\", e, sizeof(e), &e);\n\
  \   printf(\"f val %5d & size %d bytes (@addr %p).\\n\", f, sizeof(f), &f);\n} \n\
  ```\n\n**清单 5-10：** chp05/overview/sizeofvariables.c\n\n`sizeof(c)` 运算符返回变量类型的大小（以字节为单位）。在本例中，它将为\
  \ `int` 类型返回 `4`。`&c` 调用可以理解为“`c` 的*地址*”。它提供了存储变量 `c` 的第一个字节的地址，在本例中返回 `0xbe8d6688`。第一行的\
  \ `%.4f` 表示将浮点数显示到小数点后四位。在 PocketBeagle 上执行此程序会得到以下结果：\n\n```\n/chp05/overview$\
  \ ./sizeofvariables\na val 3.1416 & size 8 bytes (@addr 0xbe8d6690).\nb val 25.00\
  \ & size 4 bytes (@addr 0xbe8d668c).\nc val 545 (oct 1041, hex 221) & size 4 bytes\
  \ (@addr 0xbe8d6688).\nd val 123 & size 4 bytes (@addr 0xbe8d6684).\ne val A & size\
  \ 1 bytes (@addr 0xbe8d6683).\nf val     1 and size 1 bytes (@addr 0xbe8d6682).\
  \ \n```\n\nBeagle 板采用 32 位微处理器，因此使用四个字节来表示 `int` 类型。可以分配的最小内存单元是一个字节，因此，是的，你用一个字节来表示布尔值，而实际上它可以存储八个独立的布尔值。你可以使用运算符直接对变量进行操作。清单\
  \ 5-11 中的程序 `operators.c` 包含了一些在 C/C++ 中经常引起困难的地方：\n\n```\n#include<stdio.h>\n\n\
  int main(){\n   int a=1, b=2, c, d, e, g;\n   float f=9.9999;\n   c = ++a;\n   printf(\"\
  The value of c=%d and a=%d.\\n\", c, a);\n   d = b++;\n   printf(\"The value of\
  \ d=%d and b=%d.\\n\", d, b);\n   e = (int) f;\n   printf(\"The value of f=%.2f\
  \ and e=%d.\\n\", f, e);\n   g = 'A';\n   printf(\"The value of g=%d and g=%c.\\\
  n\", g, g);\n   return 0;\n} \n```\n\n**清单 5-11：** chp05/overview/operators.c\n\n\
  \n\n\n\n这将输出以下内容：\n\n```\n/chp05/overview$ ./operators\nThe value of c=2 and a=2.\n\
  The value of d=2 and b=3.\nThe value of f=10.00 and e=9.\nThe value of g=65 and\
  \ g=A. \n```\n\n在 `c=++a;` 这一行中，`a` 的值在赋值给左侧的 `c` 之前进行了前置递增。因此，`a` 在赋值给 `c` 之前增加到了\
  \ `2`，所以这一行等价于两行：`a=a+1; c=a;`。然而，在 `d=b++;` 这一行中，`b` 的值是后置递增的，等价于两行：`d=b; b=b+1;`。`d`\
  \ 被赋值为 `b` 的值（即 `2`），然后 `b` 的值才递增到 `3`。\n\n在 `e=(int)f;` 这一行中，使用了 C 风格的强制类型转换，将浮点数转换为整数值。实际上，当程序员使用强制类型转换时，他们是在通知编译器，他们知道将浮点数转换为\
  \ `int` 会损失精度（并且编译器会引入转换代码）。小数部分将被截断，因此 `9.9999` 被转换为 `e=9`，因为 `.9999` 被截断掉了。另一点需要注意的是，`printf(\"\
  %.2f\",f)` 将浮点变量显示为两位小数，这与四舍五入不同。\n\n在 `g='A'` 这一行中，`g` 被赋值为大写字母 A 的 ASCII 等效值，即\
  \ `65`。`printf(\"%d %c\",g, g);` 会根据使用的格式说明符显示 `g` 的 `int` 值（如果使用 `%d`）或 ASCII 字符值（如果使用\
  \ `%c`）。\n\n`const` 关键字可用于防止变量被修改。还有一个 `volatile` 关键字，用于通知编译器某个特定变量可能在其控制之外被修改，并且编译器不应对该值应用任何类型的优化。在\
  \ Beagle 板上，如果所讨论的变量与另一个进程或物理输入/输出共享，则此通知非常有用。\n\n在 C/C++ 中，可以使用 `typedef` 关键字定义自己的类型。例如，如果你不想在之前的\
  \ `sizeofvariables.c` 示例中包含头文件 `stdbool.h`，可以这样定义：\n\n```\ntypedef char bool;\n\
  #define true 1\n#define false 0 \n```\n\nC/C++ 编程中最常见且最容易被误解的错误可能出现在以下代码中：\n\n```\n\
  if (x=y){ \n   // 执行主体语句 Z\n} \n```\n\n主体语句 `Z` 何时会被执行？答案是当 `y` 不等于 `0` 时（`x` 的当前值无关紧要！）。错误在于在\
  \ `if` 语句中使用了单个 `=`（赋值）而不是 `==`（比较）。赋值运算符返回右侧的值，如果 `y` 不等于 `0`，该值会自动转换为 `true`。如果\
  \ `y` 等于零，则返回 `false`。Java 不允许这种错误，因为 `0` 和 `false` 之间以及 `1` 和 `true` 之间没有隐式转换。\n\
  \n#### C/C++ 中的指针\n\n指针是一种特殊类型的变量，它存储内存中另一个变量的地址——我们说指针“指向”该变量。代码清单 5-12 是一个代码示例，演示了如何创建指针\
  \ `p` 并使其指向变量 `y`。\n\n```\n#include<stdio.h>\n\nint main(){\n   int y = 1000;\n\
  \   int *p;\n   p = &y;\n   printf(\"The variable has value %d and the address %p.\\\
  n\", y, &y);\n   printf(\"The pointer stores %p and points at value %d.\\n\", p,\
  \ *p);\n   printf(\"The pointer has address %p and size %d.\\n\", &p, sizeof(p));\n\
  \   return 0;\n} \n```\n\n**代码清单 5-12:** chp05/overview/pointers.c\n\n编译并执行此代码后，将输出以下内容：\n\
  \n```\n/chp05/overview$ ./pointers\nThe variable has value 1000 and the address\
  \ 0xbede26bc.\nThe pointer stores 0xbede26bc and points at value 1000.\nThe pointer\
  \ has address 0xbede26b8 and size 4\\. \n```\n\n那么，这个示例中发生了什么？图 5-3 展示了内存位置和涉及的步骤。在步骤\
  \ 1 中，创建了变量 `y` 并赋初始值 `1000`。然后创建了一个指针 `p`，其解引用类型为 `int`。本质上，这意味着指针 `p` 被设置为指向 `int`\
  \ 值。在步骤 2 中，语句 `p = &y;` 表示“让 `p` 等于 `y` 的地址”，这将 `p` 的值设置为 32 位地址 `0xbede26bc`。现在我们说\
  \ `p` 指向 `y`。这两个步骤可以通过调用 `int *p = &y;` 合并（即创建一个解引用类型为 `int` 的指针 `p`，并将其赋值为 `y`\
  \ 的地址）。\n\n![由标题和周围文本描述。](img/c05f003.jpg)\n\n**图 5-3****:** Beagle 板上 C/C++ 指针的示例（使用\
  \ 32 位寻址）\n\n为什么指针需要解引用类型？举个例子，如果指针需要移动到数组中的下一个元素，那么它需要知道应该移动四个字节、八个字节还是其他大小。此外，在\
  \ C++ 中，你需要能够根据指针的类型来处理指针处的数据。代码清单 5-13 是另一个使用指针的示例，解释了意图上的简单错误如何导致严重问题。\n\n```\n\
  #include<stdio.h>\n\nint main(){\n   int y  = 1000, z;\n   int *p = &y;\n   printf(\"\
  The pointer  p has the value %d and address: %p\\n\", *p, p);\n   // 意图：让 z = 1000\
  \ + 5，并将 p 和 y 递增到 1001 —— 错误！！！\n   z = *p++ + 5;\n   printf(\"The pointer  p has\
  \ the value %d and address: %p\\n\", *p, p);\n   printf(\"The variable z has the\
  \ value %d\\n\", z);\n   return 0;\n} \n```\n\n**代码清单 5-13:** chp05/overview/pointers2.c\n\
  \n这将输出以下内容：\n\n```\ndebian@ebb:~/exploringbb/chp05/overview$ ./pointers2\nThe pointer\
  \  p has the value 1000 and address: 0xbeef357c\nThe pointer  p has the value 1005\
  \ and address: 0xbeef3580\nThe variable z has the value 1005 \n```\n\n在这个示例中，指针\
  \ `p` 的解引用类型为 `int`，并被设置为指向 `y` 的地址。在代码的这一点上，输出符合预期，因为 `p` 的“值”为 `1000`，“地址”为 `0xbeef357c`。在下一行，意图可能是将\
  \ `y` 的值后置递增 `1` 到 `1001`，并将 `z` 赋值为 `1005`（即在后置递增发生之前）。然而，可能与你的意图相反，`p` 现在的“值”为\
  \ `1005`，“地址”为 `0xbeef3580`。\n\n为什么会发生这种情况？在 C/C++ 中使用指针的难点之一在于理解 C/C++ 中的操作顺序，即所谓的运算符*优先级*。例如，如果你编写语句\n\
  \n```\nint x = 1 + 2 * 3; \n```\n\n`x` 的值会是多少？在这种情况下，它将是 7，因为在 C/C++ 中，乘法运算符的优先级高于加法运算符。类似地，代码清单\
  \ 5-13 中的问题在于你可能意图使用 `*p++` 来将 `p` 的“值”递增 `1`。\n\n\n\n\n\n在 C/C++ 中，后自增运算符（`p++`）的优先级高于解引用运算符（`*p`）。这意味着\
  \ `*p++` 实际上是对指针 `p` 的“地址”后自增一个 `int`（即 4 字节），但在自增之前，它先被解引用（本例中为 `1000`），因此该值被加到\
  \ `5` 上并赋值给 `z`（如第三行输出所示）。最令人担忧的是第二行输出，因为显然 `p` 现在“指向”了 `z`，而 `z` 恰好位于下一个地址——它实际上可能指向程序内存分配之外的地址。如果不使用第\
  \ 7 章中描述的调试工具，这类意图错误很难调试。要按你的意图修正代码，只需使用 `(*p)++`，这明确表示应该对 `p` 的“值”进行后自增 1，结果使 `p`\
  \ 的“值”为 `1001`，`z` 的值为 `1005`。如果应用此更改，指针 `p` 的地址将不会自增。\n\nC++ 中大约有 58 个运算符，分为 18\
  \ 个不同的主要优先级级别。即使你了解优先级表，也应该使用圆括号（`()`）来向其他用户明确表达语句中的意图，圆括号的优先级仅次于作用域解析（`::`）、自增（`++`）和自减（`--`）运算符。因此，你应该始终编写如下代码：\n\
  \n```\nint x = 1 + (2 * 3); \n```\n\n最后，关于 C 指针的话题，还有一种 *void 指针*，可以声明为 `void *p;`，这实际上表明指针\
  \ `p` 没有解引用类型，需要在后续阶段（参见 `/chp05/overview/void.c`）使用以下语法进行赋值：\n\n```\n int a = 5;\n\
  \   void *p = &a;\n   printf(\"p points at address %p and value %d\\n\", p, *((int\
  \ *)p)); \n```\n\n执行时，这段代码将输出类似以下内容：\n\n```\n The pointer p points at address 0xbea546c8\
  \ and value 5 \n```\n\n因此，可以将指针从一种解引用类型转换为另一种，而 *void 指针* 可能用于存储任何解引用类型的指针。在第 6\
  \ 章中，void 指针被用于开发增强型 GPIO 接口。\n\n#### *C 风格字符串*\n\nC 语言没有内置的字符串类型，而是使用以空字符（`\\0`）结尾的字符类型数组来表示字符串。有一个标准的\
  \ C 字符串库可以使用，如清单 5-14 所示。\n\n```\n#include<stdio.h>\n#include<string.h>\n#include<stdlib.h>\n\
  \nint main(){\n   char a[20] = \"hello \";    \n   char b[] = {'w','o','r','l','d','!','\\\
  0'};  // the \\0 is important \n\n   a[0]='H';                        // set the\
  \ first character to be H\n   char *c = strcat(a,b);           // join/concatenate\
  \ a and b\n   printf(\"The string c is: %s\\n\", c);\n   printf(\"The length of\
  \ c is: %d\\n\", strlen(c));  // call string length\n\n   // find and replace the\
  \ w with a W\n   char *p = strchr(c,'w');  // returns pointer to first 'w' char\n\
  \   *p = 'W';\n   printf(\"The string c is now: %s\\n\", c);\n\n   if (strcmp(\"\
  cat\", \"dog\")<=0){      // ==0 would be equal\n      printf(\"cat comes before\
  \ dog (lexiographically)\\n\");\n   }\n   //insert \"to the\" into middle of \"\
  Hello World!\" string - very messy!\n   char *d = \" to the\";\n   char *cd = malloc(strlen(c)\
  \ + strlen(d));\n   memcpy(cd, c, 5);\n   memcpy(cd+5, d, strlen(d));\n   memcpy(cd+5+strlen(d),\
  \ c+5, 6);\n   printf(\"The cd string is: %s\\n\", cd);\n\n   //tokenize cd string\
  \ using spaces\n   p = strtok(cd,\" \");\n   while(p!=NULL){\n      printf(\"Token:%s\\\
  n\", p);\n      p = strtok(NULL, \" \");\n   }\n   return 0;\n} \n```\n\n**清单 5-14:**\
  \ `chp05/overview/cstrings.c`\n\n代码由示例中的注释解释。执行时，这段代码将输出以下内容：\n\n```\n/chp05/overview$\
  \ ./cstrings\nThe string c is: Hello world!\nThe length of c is: 12\nThe string\
  \ c is now: Hello World!\ncat comes before dog (lexiographically)\nThe cd string\
  \ is: Hello to the World\nToken:Hello\nToken:to\nToken:the\nToken:World \n```\n\n\
  ### 用 C 语言实现 LED 闪烁应用\n\n现在你已经掌握了足够的 C 语言编程知识，可以看看如何用 C 语言编写 LED 闪烁应用。在清单 5-15 中，保留了与其他示例相同的结构。\n\
  \n```\n#include<stdio.h>\n#include<stdlib.h>\n#include<string.h>\n\n#define LED3_PATH\
  \ \"/sys/class/leds/beaglebone:green:usr3\"\n\nvoid writeLED(char filename[], char\
  \ value[]);  //function prototypes\nvoid removeTrigger();\n\nint main(int argc,\
  \ char* argv[]){\n   if(argc!=2){\n        printf(\"Usage is makeLEDC and one of:\\\
  n\");\n        printf(\"   on, off, flash or status\\n\");\n        printf(\" e.g.\
  \ makeLED flash\\n\");\n        return 2;\n   }\n   printf(\"Starting the makeLED\
  \ program\\n\");\n   printf(\"The current LED Path is: \" LED3_PATH \"\\n\");\n\n\
  \   // select whether command is on, off, flash or status\n   if(strcmp(argv[1],\"\
  on\")==0){\n        printf(\"Turning the LED on\\n\");\n        removeTrigger();\n\
  \        writeLED(\"/brightness\", \"1\");\n   }\n   else if (strcmp(argv[1],\"\
  off\")==0){\n        printf(\"Turning the LED off\\n\");\n        removeTrigger();\n\
  \        writeLED(\"/brightness\", \"0\");\n   }\n   else if (strcmp(argv[1],\"\
  flash\")==0){\n        printf(\"Flashing the LED\\n\");\n        writeLED(\"/trigger\"\
  , \"timer\");\n        writeLED(\"/delay_on\", \"50\");\n        writeLED(\"/delay_off\"\
  , \"50\");\n   }\n   else if (strcmp(argv[1],\"status\")==0){\n      FILE* fp; \
  \  // see writeLED function below for description\n      char  fullFileName[100];\n\
  \      char line[80];\n      sprintf(fullFileName, LED3_PATH \"/trigger\");\n  \
  \    fp = fopen(fullFileName, \"rt\"); //reading text this time\n      while (fgets(line,\
  \ 80, fp) != NULL){\n         printf(\"%s\", line);\n      }\n      fclose(fp);\n\
  \   }\n   else{\n        printf(\"Invalid command!\\n\");\n   }\n   printf(\"Finished\
  \ the makeLED Program\\n\");\n   return 0;\n}\n\nvoid writeLED(char filename[],\
  \ char value[]){\n   FILE* fp;   // create a file pointer fp\n   char  fullFileName[100];\
  \  // to store the path and filename\n   sprintf(fullFileName, LED3_PATH \"%s\"\
  , filename); // write path/name\n   fp = fopen(fullFileName, \"w+\"); // open file\
  \ for writing\n   fprintf(fp, \"%s\", value);  // send the value to the file\n \
  \  fclose(fp);  // close the file using the file pointer\n}\n\nvoid removeTrigger(){\n\
  \  writeLED(\"/trigger\", \"none\");\n} \n```\n\n**清单 5-15:** `chp05/makeLED/makeLED.c`\n\
  \n通过调用 `/chp05/makeLED/` 目录下的 `./build` 脚本来构建此程序，并使用 `./makeLEDC on`、`./makeLEDC\
  \ off` 等命令执行它。\n\n你之前唯一没有接触过的主题是 C 语言中的文件使用，但工作示例应该能通过 `writeLED()` 函数为你提供所需的信息。`FILE`\
  \ 指针 `fp` 指向一个文件描述，该描述标识了流、读写位置及其状态。文件通过 `stdio.h` 中定义的 `fopen()` 函数打开，该函数返回一个 FILE\
  \ 指针。在本例中，它以写入/更新（`w+`）模式打开。其他可选模式如下：读取（`r`）、写入（`w`）、追加（`a`）、读取/更新（`r+`）和追加/更新（`a+`）。如果你处理的是二进制文件，则需要在状态后附加\
  \ `b`——例如，`w+b` 会以更新（写入和读取）模式打开一个新的二进制文件。此外，`t` 可用于明确声明文件为文本格式。\n\n有关标准库中可用 C 函数的完整参考，请参见\
  \ [`www.cplusplus.com/reference/`](http://www.cplusplus.com/reference/)。\n\n###\
  \ C++ 中的 C 部分\n\n如前所述，C++ 语言建立在 C 语言之上，增加了对面向对象编程（OOP）类的支持；然而，当你开始进行一般的 C++ 编程时，还会立即发现其他一些差异。首先，你注意到的最大变化是输入/输出流的使用以及字符串的通用用法。\n\
  \n#### *C++ 中的第一个示例和字符串*\n\n\n\n\n\n清单 5-16 展示了使用 C++字符串库重写的字符串示例。\n\n```\n#include<iostream>\n\
  #include<sstream>    // 用于分割字符串\n//#include<cstring>  // 如果需要，C++中对应 C 头文件的等价物\n\
  using namespace std;\n\nint main(){\n   string a = \"hello \";\n   char temp[] =\
  \ {'w','o','r','l','d','!','\\0'};  // \\0 很重要！\n   string b(temp);\n\n   a[0]='H';\n\
  \   string c = a + b;\n   cout << \"字符串 c 是: \" << c << endl;\n   cout << \"c 的长度是:\
  \ \" << c.length() << endl;\n\n   int loc = c.find_first_of('w');\n   c.replace(loc,1,1,'W');\n\
  \   cout << \"现在字符串 c 是: \" << c << endl;\n\n   if (string(\"cat\")< string(\"dog\"\
  )){\n      cout << \"cat 在 dog 之前（按字典序）\\n\";\n   }\n   c.insert(5,\" to the\");\n\
  \   cout << \"现在字符串 c 是: \" << c << endl;\n\n   // 使用空格分割字符串 - 可以使用 Boost.Tokenizer\n\
  \   // 或 C++11 来改进语法。这次使用 stringstream。\n   stringstream ss;\n   ss << c;  // 将字符串\
  \ c 放入 stringstream\n   string token;\n   while(getline(ss, token, ' ')){\n    \
  \  cout << \"Token: \" << token << endl;\n   }\n   return 0;\n} \n```\n\n**清单 5-16:**\
  \ `chp05/overview/cppstrings.cpp`\n\n通过输入 `g++ cppstrings.cpp -o cppstrings` 来构建此代码。执行后，该代码的输出与\
  \ `cstrings.c` 示例相同。C++ 在某些方面更直观，但也有一些值得注意的地方。\n\n代码使用了 `iostream` 和 `sstream` 头文件，这些都是\
  \ C++ 头文件。如果你想使用 C 头文件，需要在名称前加上 *c*；因此，要使用 C 的 `string.h` 头文件，你应该使用 `#include<cstring>`。C++\
  \ 中有一个称为 *命名空间* 的概念，它允许程序员将函数或类限制在特定作用域内。在 C++ 中，所有标准库函数和类都限制在标准命名空间中。你可以通过使用 `std::string`\
  \ 来显式指定要使用 `std` 命名空间中的类。但这相当冗长。另一种方法是使用 `using namespace std;` 语句，它将整个命名空间引入你的代码。**不要**在\
  \ C++ 头文件中这样做，因为它会污染任何使用你头文件的人的命名空间。\n\n代码使用了 `cout`（标准输出流）和输出流运算符（`<<`）来显示字符串。还有等效的标准输入流（`cin`）和输入流运算符（`>>`）。输出流运算符“查看”其右侧并识别数据的类型。它会根据数据类型显示数据，因此无需像在\
  \ `printf()` 函数中那样使用 `%s`、`%d`、`%p` 等。`endl` 流操作函数会插入一个换行符并刷新流。\n\n在此示例中，字符串对象通过使用\
  \ `+` 来拼接两个字符串，使用 `<` 或 `==` 来比较两个字符串。这些运算符本质上是像 `append()` 和 `strcmp()` 这样的函数。在\
  \ C++ 中，你可以为自己的数据类型定义这些运算符的行为（运算符重载）。\n\n#### 按值传递、按指针传递和按引用传递\n\n正如你在代码示例中所见，函数使我们能够编写一段代码，该代码可以从代码中的不同位置多次调用。向函数传递值有三种主要方式。\n\
  \n*   **按值传递：** 这会创建一个新变量（以下代码示例中的 `val`），并将源变量（`a`）的值的一个副本存储在这个新变量中。对变量 `val` 的任何更改都不会影响源变量\
  \ `a`。如果你希望防止原始数据被修改，可以使用按值传递；但是，必须复制数据，如果你传递的是大型数据数组（如图像），那么复制将带来内存和计算成本。按值传递的替代方法是*按常量引用传递*。在以下示例中，`a`\
  \ 也作为第二个参数通过常量引用传递给函数，并作为值 `cr` 接收。可以在函数中读取 `cr` 的值，但不能修改它。\n\n*   **按指针传递：** 你可以传递指向源数据的指针。对指针（`ptr`）所指向值的任何修改都会影响源数据。调用函数时必须传递一个地址（`&b`——`b`\
  \ 的地址）。\n\n*   **按引用传递：** 在 C++ 中，你可以按引用传递值。函数通过使用 & 符号来确定参数是按值传递还是按引用传递。在以下示例中，`&ref`\
  \ 表示值 `c` 是按引用传递的。函数中对 `ref` 的任何修改都会影响 `c` 的值。\n\n以下是一个包含所有四种情况的函数（`passing.cpp`）：\n\
  \n```\nint afunction(int val, const int &cr, int *ptr, int &ref){\n   val+=cr;\n\
  // cr+=val; // 不允许，因为它是常量\n   *ptr+=10;\n   ref+=10;\n   return val;\n}\n\nint main(){\n\
  \   int a=100, b=200, c=300;\n   int ret;\n   ret = afunction(a, a, &b, c);\n  \
  \ cout << \"a 的值 = \" << a << endl;\n   cout << \"b 的值 = \" << b << endl;\n   cout\
  \ << \"c 的值 = \" << c << endl;\n   cout << \"返回值 = \" << ret << endl;\n   return\
  \ 0;\n} \n```\n\n执行后，此代码将产生以下输出：\n\n```\n/chp05/overview$ ./passing\na 的值 = 100\n\
  b 的值 = 210\nc 的值 = 310\n返回值 = 200 \n```\n\n如果你想在 C++ 中向函数传递一个值，并且该值将被函数修改，那么你可以通过指针或引用传递；但是，除非你传递的值可能为\
  \ `NULL`，或者你需要在函数中重新分配指针（例如，遍历数组），否则始终使用按引用传递。现在你已经准备好用 C++ 编写 LED 代码了！\n\n####\
  \ 使用 C++（非面向对象）闪烁 LED\n\nC++ 的 LED 闪烁代码位于 `/chp05/makeLED/` 目录下的 `makeLED.cpp` 中。由于大部分代码与\
  \ C 示例类似，此处不再重复。但值得展示以下片段，它使用 `fstream` 文件流类来打开文件。在这种情况下，输出流运算符（`<<`）将字符串发送到 `fstream`，其中\
  \ `c_str()` 方法将 C++ 的 `string` 作为 C 的 `string` 返回。\n\n```\nvoid writeLED(string\
  \ filename, string value){\n   fstream fs;\n   string path(LED3_PATH);\n   fs.open((path\
  \ + filename).c_str(), fstream::out);\n   fs << value;\n   fs.close();\n} \n```\n\
  \n### 编写多调用二进制文件\n\n多调用二进制文件可以在 Linux 中用于构建一个执行多项任务的单一应用程序（例如，Linux 中的 BusyBox 在一个可执行文件中提供了多个系统工具）。在\
  \ `chp05/makeLEDmulti/` 目录中有一个名为 `makeLEDmulti.cpp` 的示例，它使用第一个命令行参数根据调用的命令名称来切换应用程序的功能。此代码已修改，添加了一个小函数：\n\
  \n```\nbool endsWith(string const &in, string const &comp){\n   return (0==in.compare(in.length()-comp.length(),comp.length(),comp));\n\
  } \n```\n\n此函数检查 `in` 字符串是否*以* `comp` 字符串的内容*结尾*。这一点很重要，因为应用程序可能通过 `./flashled`\
  \ 或 `./chp05/makeLEDmulti/flashled` 调用，具体取决于其位置。切换比较如下所示：\n\n```\nif(endsWith(cmd,\"\
  onled\")){\n   cout << \"正在打开 LED\" << endl;\n   removeTrigger();\n   writeLED(\"\
  /brightness\", \"1\");\n} \n```\n\n如果在调用 `./build` 后列出目录中的文件，你将看到以下文件和符号链接：\n\n\n\
  \n\n```\ndebian@ebb:~/exploringbb/chp05/makeLEDmulti$ ls -l\n-rwxr-xr-x 1 debian\
  \ debian   542 May 13 00:14 build\nlrwxrwxrwx 1 debian debian    12 May 14 04:42\
  \ flashled -> makeLEDmulti\nlrwxrwxrwx 1 debian debian    12 May 14 04:42 ledstatus\
  \ -> makeLEDmulti\n-rwxr-xr-x 1 debian debian 15344 May 14 04:42 makeLEDmulti\n\
  -rw-r--r-- 1 debian debian  2474 May 13 00:14 makeLEDmulti.cpp\nlrwxrwxrwx 1 debian\
  \ debian    12 May 14 04:42 offled -> makeLEDmulti\nlrwxrwxrwx 1 debian debian \
  \   12 May 14 04:42 onled -> makeLEDmulti \n```\n\n这些符号链接中的每一个看起来都像是一个独立的命令，尽管它们都指向同一个可执行文件`makeLEDmulti`。`makeLEDmulti`解析`argv[0]`来确定使用了哪个符号链接。你可以在这里看到其效果，当这些符号链接被调用时：\n\
  \n```\ndebian@ebb:~/exploringbb/chp05/makeLEDmulti$ ./onled\nThe current LED Path\
  \ is: /sys/class/leds/beaglebone:green:usr3\n… Turning the LED on …\ndebian@ebb:~/exploringbb/chp05/makeLEDmulti$\
  \ ./ledstatus\n… Current trigger details:\n… [none] rc-feedback kbd-scrolllock …\
  \ \n```\n\n## 面向对象编程概述\n\n面向对象编程是一种编程方法，它允许将软件组织为对象的集合，这些对象包含数据和行为。与你到目前为止看到的函数式编程示例不同，你首先问的不是“它做什么？”而是“它是什么？”理论上，这意味着你的代码编写方式允许将来对功能进行更改，而无需重新设计代码结构。此外，它还意味着你可以将代码分解为模块，这些模块可以在未来的项目中由你和其他人重用。\n\
  \n以下讨论强调了在编写面向对象代码之前需要理解的几个核心概念。讨论使用伪代码，因为这些概念适用于所有支持 OOP 范式的语言，包括 C++、Python、Rust、Lua\
  \ 表、C#、Java、JavaScript、Perl、Ruby、OOHaskell 库等。\n\n### 类与对象\n\n想想电视的概念：你不需要拆开外壳就能使用它，因为前面板和遥控器上有控制按钮；即使它连接到游戏机，你仍然可以理解电视；购买时它已经完整，具有明确的外部要求，如电源和信号输入；而且你的电视不应该崩溃！在很多方面，这个描述抓住了类应该具备的特性。\n\
  \n`class`是一种描述。它应该描述一个定义良好的代码接口；代表一个清晰的概念；完整且有良好的文档；并且健壮，具有内置的错误检查。类描述由两个构建块组成。\n\
  \n*   **状态（或数据）：** 类的状态值。\n*   **方法（或行为）：** 类如何与其数据交互。方法名称通常包含一个动作动词（例如，`setX()`）。\n\
  \n例如，下面是一个说明性的`Television`类的伪代码（即不是真正的 C++代码）：\n\n```\nclass Television{\n   int\
  \ channelNumber;\n   bool on;\n   powerOn() { on = true; }\n   powerOff(){ on =\
  \ false;}\n   changeChannel(int x) { channelNumber = x; }\n}; \n```\n\n因此，示例`Television`类有两个状态和三个方法。这种结构的好处是，你将状态和方法紧密地绑定在一个类结构中。`powerOn()`方法在这个类之外没有任何意义。实际上，你可以在许多不同的类中编写`powerOn()`方法，而无需担心命名冲突。\n\
  \n`object`是类描述的实现——类的一个实例。继续类比，`Television`类是描述如何制造电视的蓝图，而`Television`对象则是这些计划在物理电视上的具体实现。在伪代码中，这种实现可能如下所示：\n\
  \n```\nvoid main(){\n   Television dereksTV();\n   Television johnsTV();\n   dereksTV.powerOn();\n\
  \   dereksTV.changeChannel(52);\n   johnsTV.powerOn();\n   johnsTV.changeChannel(1);\n\
  } \n```\n\n因此，`dereksTV`和`johnsTV`是`Television`类的对象。每个对象都有自己独立的状态，所以改变`dereksTV`的频道不会影响`johnsTV`。要调用方法，必须在其前面加上要调用的对象名称（例如，`johnsTV.powerOn()`）；在`johnsTV`对象上调用`changeChannel()`方法不会对`dereksTV`对象产生任何影响。\n\
  \n在本书中，类名通常以大写字母开头，例如`Television`，而对象通常以小写字母开头，例如`dereksTV`。这与许多语言（如 Java）中使用的命名约定一致。不幸的是，C++标准库类（例如`string`、`sstream`）并不遵循这一命名约定。\n\
  \n### 封装\n\n*封装*用于隐藏对象的内部机制。在物理电视的类比中，封装由保护内部电子系统的外壳提供。然而，你仍然有遥控器，它直接影响内部工作方式的功能。\n\
  \n在 OOP 中，你可以使用称为`private`的*访问说明符*关键字来决定哪些工作要隐藏（例如，电视电子设备），并使用访问说明符关键字`public`来决定哪些是*接口*（电视遥控器）的一部分。最佳实践是将类的状态始终设置为私有，这样你就可以控制它们如何被你设计的公共接口方法修改。例如，伪代码可能变成如下所示：\n\
  \n```\nclass Television{\n   private:\n      int channelNumber;\n      bool on;\n\
  \      remodulate_tuner();\n   public:\n      powerOn() { on = true; }\n      powerOff(){\
  \ on = false;}\n      changeChannel(int x) {\n         channelNumber = x; \n   \
  \      remodulate_tuner();\n      }\n}; \n```\n\n现在，`Television`类具有私有状态数据（`on`、`channelNumber`），这些数据仅受公共接口方法（`powerOn()`、`powerOff()`、`changeChannel()`）的影响，以及一个私有实现方法`remodulate_tuner()`，该方法不能从类外部调用。\n\
  \n这种方法有许多优点。首先，这个类的用户（另一个程序员）不需要理解`Television`类的内部工作原理；他们只需要理解公共接口。其次，`Television`类的作者可以修改和/或完善类的内部工作，而不会影响其他程序员的代码。\n\
  \n### 继承\n\n*继承*是 OOP 的一个特性，它允许从其他类描述构建类描述。人类一直在这样做；例如，如果有人问你，“鸭子是什么？”你可能会回答，“它是一种会游泳的鸟，它有扁嘴而不是喙。”这个描述相当准确，但它假设鸟的概念也被理解。重要的是，描述指出鸭子具有*额外行为*（游泳），但也具有*替换行为*（有扁嘴而不是喙）。你可以用伪代码粗略地编码如下：\n\
  \n```\nclass Bird{\n   public:\n     void fly();\n     void describe() { cout <<\
  \ \"Has a beak and can fly\"; }\n};\n\nclass Duck: public Bird{   // Duck IS-A Bird\n\
  \      Bill bill;\n   public:\n      void swim();\n      void describe() { cout\
  \ << \"Has a bill and can fly and swim\"; }\n};\n```\n\n在这种情况下，你可以创建一个`Duck`类的对象：\n\
  \n```\nint main(){\n   Duck d;        //creates the Duck instance object d\n   d.swim();\
  \      //specific to the Duck class\n   d.fly();       //inherited from the parent\
  \ Bird class\n   d.describe();  //describe() is inheritated and overridden in Duck\n\
  \                  //so, \"Has a bill and can fly and swim\" would appear\n} \n\
  ```\n\n\n\n\n这里的例子说明了为什么继承如此重要。你可以通过继承并扩展类描述（例如 `swim()`）来构建代码，或者继承父类并替换某个行为（例如\
  \ `describe()`）以提供更具体的实现——这被称为方法的*重写*，它是*多态*（多种形态）的一种形式。多态的另一种形式称为*重载*，这意味着同一个类中可以有多个同名方法，编译器通过不同的参数类型来区分它们。\n\
  \n你可以通过*IS-A*（是一个）测试来检查是否存在继承关系；例如，“鸭子是一种鸟”是成立的，但“鸟是一只鸭子”则不成立，因为并非所有鸟都是鸭子。这与*IS-A-PART-OF*（是……的一部分）关系形成对比；例如，“鸭嘴是鸭子的一部分”。IS-A-PART-OF\
  \ 关系表明鸭嘴是类的一个成员/状态。当类关系变得复杂时，使用这种简单的检查会很有用。\n\n你也可以对类的对象使用指针；例如，要动态分配两个 `Duck` 对象的内存，可以使用以下代码：\n\
  \n```\nint main(){\n   Duck *a = new Duck();\n   Bird *b = new Duck(); //父类指针可以指向子类对象\n\
  \   b->describe();        //实际上会描述一只鸭子（如果是虚函数）\n   //b->swim();          //不允许！Bird\
  \ 不知道 swim()\n} \n```\n\n有趣的是，`Bird` 指针 `b` 被允许指向一个 `Duck` 对象。由于 `Duck` 类是 `Bird`\
  \ 类的子类，`Bird` 指针能调用的所有方法都被 `Duck` 对象“知晓”。因此，可以调用 `describe()` 方法。箭头符号（`b->describe()`）只是\
  \ `(*b).describe()` 的一种更简洁写法。在这种情况下，`Bird` 指针 `b` 具有*静态类型* `Bird` 和*动态类型* `Duck`。\n\
  \n最后一点是，通过继承可以使用一个额外的访问说明符 `protected`。如果你希望在父类中创建一个方法或状态，使其对子类可用，但又不想公开，那么可以使用\
  \ `protected` 访问说明符。\n\n### 面向对象的 LED 闪烁代码\n\n现在，这些 OOP 概念可以应用于 Beagle 板上的实际 C++\
  \ 应用程序，方法是将面向功能的 C++ 代码重构为一个名为 `LED` 的类，该类包含状态和方法。与清单 5-17 中给出的代码的一个区别是，它允许你使用相同的面向对象代码控制四个用户\
  \ LED。因此，使用 LED 类，创建了四个不同的 LED 实例对象，每个对象控制板上的一个物理用户 LED。\n\n```\n#include<iostream>\n\
  #include<fstream>\n#include<string>\n#include<sstream>\nusing namespace std;\n\n\
  #define LED_PATH \"/sys/class/leds/beaglebone:green:usr\"\n\nclass LED{\n   private:\n\
  \      string path;\n      int number;\n      virtual void writeLED(string filename,\
  \ string value);\n      virtual void removeTrigger();\n   public:\n      LED(int\
  \ number);\n      virtual void turnOn();\n      virtual void turnOff();\n      virtual\
  \ void flash(string delayms);\n      virtual void outputState();\n      virtual\
  \ ~LED();\n};\n\nLED::LED(int number){\n   this->number = number;    // 将 number\
  \ 状态设置为传入的数字\n   // 下一部分使用 C++11（见第 7 章）的 to_string(number) 会更简单\n   ostringstream\
  \ s;          // 使用流来构造路径\n   s << LED_PATH << number;  // 将 LED 编号追加到 LED_PATH\n\
  \   path = string(s.str());   // 从流转换回字符串\n}\n\nvoid LED::writeLED(string filename,\
  \ string value){\n   ofstream fs;\n   fs.open((path + filename).c_str());\n   fs\
  \ << value;\n   fs.close();\n}\n\nvoid LED::removeTrigger(){\n   writeLED(\"/trigger\"\
  , \"none\");\n}\n\nvoid LED::turnOn(){\n   cout << \"打开 LED\" << number << \"。\"\
  \ << endl;\n   removeTrigger();\n   writeLED(\"/brightness\", \"1\");\n}\n\nvoid\
  \ LED::turnOff(){\n   cout << \"关闭 LED\" << number << \"。\" << endl;\n   removeTrigger();\n\
  \   writeLED(\"/brightness\", \"0\");\n}\n\nvoid LED::flash(string delayms = \"\
  50\"){\n   cout << \"使 LED\" << number << \"闪烁。\" << endl;\n   writeLED(\"/trigger\"\
  , \"timer\");\n   writeLED(\"/delay_on\", delayms);\n   writeLED(\"/delay_off\"\
  , delayms);\n}\n\nvoid LED::outputState(){\n   ifstream fs;\n   fs.open( (path +\
  \ \"/trigger\").c_str());\n   string line;\n   while(getline(fs,line)) cout << line\
  \ << endl;\n   fs.close();\n}\n\nLED::~LED(){   // 析构函数——当对象被销毁时调用\n   cout << \"\
  正在销毁路径为 \" << path << \" 的 LED\" << endl;\n}\n\nint main(int argc, char* argv[]){\n\
  \   if(argc!=2){\n        cout << \"用法是 makeLEDs <command>\" << endl;\n        cout\
  \ << \"  command 可以是以下之一：on, off, flash 或 status\" << endl;\n        cout << \"\
  \ 例如 makeLEDs flash\" << endl;\n   }\n   cout << \"启动 makeLEDs 程序\" << endl;\n \
  \  string cmd(argv[1]);\n\n   // 创建四个 LED 对象并将它们放入数组\n   LED leds[4] = { LED(0),\
  \ LED(1), LED(2), LED(3) };\n\n   // 对所有四个 LED 执行相同操作——易于修改！\n   for(int i=0; i<=3;\
  \ i++){\n      if(cmd==\"on\")leds[i].turnOn();\n      else if(cmd==\"off\")leds[i].turnOff();\n\
  \      else if(cmd==\"flash\")leds[i].flash(\"100\"); //默认是 \"50\"\n      else if(cmd==\"\
  status\")leds[i].outputState();\n      else{ cout << \"无效命令！\" << endl; }\n   }\n\
  \   cout << \"完成 makeLEDs 程序\" << endl;\n   return 0;\n} \n```\n\n**清单 5-17:** chp05/makeLEDOOP/makeLEDs.cpp\n\
  \n可以通过输入以下命令来构建和执行此代码：\n\n```\n/chp05/makeLEDOOP$ ./build\n/chp05/makeLEDOOP$ ./makeLEDs\
  \ status\n/chp05/makeLEDOOP$ sudo ./makeLEDs flash\n/chp05/makeLEDOOP$ sudo ./makeLEDs\
  \ off \n```\n\n在 `/chp05/` 目录中有脚本可以将 LED 恢复到标准状态，名为 `restoreLEDsBeagleBone` 和 `restoreLEDsPocketBeagle`：\n\
  \n```\n/chp05$ sudo ./restoreLEDsBeagleBone\n/chp05$ sudo ./restoreLEDsPocketBeagle\
  \ \n```\n\n此代码被构造为一个单独的 `LED` 类，其中包含路径和编号的私有状态，以及私有实现方法 `writeLED()` 和 `removeTrigger()`。这些状态和辅助方法在类外部不可访问。公共接口方法是\
  \ `turnOn()`、`turnOff()`、`flash()` 和 `outputState()`。还有两个公共方法。\n\n*   第一个是*构造函数*，它允许你初始化对象的状态。它通过\
  \ `LED led(0)` 调用，以创建编号为 `0` 的 `LED` 类的对象 `led`。这类似于你为 `int` 赋初始值的方式，例如 `int x =\
  \ 5;`。构造函数必须与类名相同（此处为 `LED`），并且不能返回任何内容，甚至不能返回 `void`。\n\n*   最后一个是*析构函数*（`~LED()`）。与构造函数一样，它必须与类名相同，并以波浪号（~）字符为前缀。当对象被销毁时，此方法会自动调用。当你运行代码示例时，可以看到这种情况发生。\n\
  \n关键字 `virtual` 也是新的。你可以将这个关键字理解为“允许在对象动态绑定时进行重写”。它应该始终存在（构造函数除外），除非你确定绝对不会有子类。移除\
  \ `virtual` 关键字会使代码性能略有提升。\n\n语法 `void LED::turnOn(){...}` 仅用于声明 `turnOn()` 方法是与\
  \ LED 类关联的方法。在一个 `.cpp` 文件中可以有多个类，并且两个类可能都有 `turnOn()` 方法；因此，显式关联允许你告知编译器正确的关系。我将此代码写在一个文件中，因为这是第一个示例。然而，你将在后面的示例中看到，更好的做法是将代码拆分为*头文件*（`.h`）和*实现文件*（`.cpp`）。\n\
  \n\n\n\n理想情况下，C++ 版本的 LED 闪烁代码布局此时已清晰明了。这种面向对象编程（OOP）版本的优点在于，当你希望提供额外功能与系统 LED 交互时，可以基于此结构进行扩展。在后续章节中，你将看到如何构建类似的结构来封装电子模块（如加速度计和温度传感器），以及如何利用\
  \ OOP 的封装特性，向与代码交互的程序员隐藏一些更复杂的计算。\n\n## 与 Linux 操作系统交互\n\n在第 3 章中，讨论了 Linux 目录结构，其中涉及的目录之一是\
  \ `/proc/` 目录——进程信息虚拟文件系统。它提供有关内核运行时状态的信息，并允许你向内核发送控制信息。实际上，它为你提供了一个从用户空间到内核空间的基于文件的接口。关于\
  \ `/proc/` 文件系统的 Linux 内核指南可参见 [`tiny.cc/beagle502`](http://tiny.cc/beagle502)。例如，如果你输入以下内容：\n\
  \n```\ndebian@ebb:/proc$ cat cpuinfo\nprocessor       : 0\nmodel name      : ARMv7\
  \ Processor rev 2 (v7l)\nBogoMIPS        : 995.32\nFeatures        : half thumb\
  \ fastmult vfp edsp thumbee neon vfpv3 tls vfpd32\nCPU implementer : 0x41\nCPU architecture:\
  \ 7\nCPU variant     : 0x3\nCPU part        : 0xc08\nCPU revision    : 2       …\
  \ \n```\n\n它会提供有关 CPU 的信息。尝试在同一目录下执行以下命令：`cat uptime`、`cat interrupts`、`cat version`。示例程序\
  \ `chp05/proc/readUptime.cpp` 提供了一个读取系统运行时间并计算系统空闲时间百分比的示例程序。\n\n许多 `/proc/` 条目可以被普通用户账户执行的程序读取；然而，许多条目只能由具有超级用户权限的程序写入。例如，`/proc/sys/kernel/`\
  \ 中的条目允许你在 Linux 内核运行时配置其参数。\n\n你需要小心 `/proc/` 中文件的一致性。Linux 内核提供了*原子*操作——即不可中断执行的指令。`/proc/`\
  \ 中的某些“文件”（如 `/proc/uptime`）是完全原子的，在读取时不会被中断；然而，其他文件（如 `/proc/net/tcp`）仅在文件的每一行内是原子的，这意味着文件在读取过程中会发生变化，因此简单地读取文件可能无法提供一致的快照。\n\
  \n### Glibc 与系统调用\n\nLinux GNU C 库 *glibc* 提供了大量系统调用的包装函数。它包含处理文件、信号、数学、进程、用户等功能。有关\
  \ GNU C 库的完整描述，请参见 [`tiny.cc/beagle503`](http://tiny.cc/beagle503)。\n\n调用 glibc\
  \ 函数比解析等效的 `/proc/` 条目要直接得多。清单 5-18 提供了一个 C++ 示例，该示例使用 glibc 的 `passwd` 结构来查找当前用户的信息。它还直接使用\
  \ `syscall()` 函数来确定用户 ID 并更改文件的访问权限——请参见清单中的注释。\n\n```\n#include<gnu/libc-version.h>\n\
  #include<sys/syscall.h>\n#include<sys/types.h>\n#include<pwd.h>\n#include<cstdlib>\n\
  #include<sys/stat.h>\n#include<iostream>\n#include<signal.h>\n#include<unistd.h>\n\
  using namespace std;\n\nint main(){\n   // 使用辅助函数获取系统信息：\n   cout << \"GNU libc\
  \ version is: \" << gnu_get_libc_version() << endl;\n\n   // 使用 glibc passwd 结构获取用户信息\
  \ - 未进行错误检查！：\n   struct passwd *pass = getpwuid(getuid());\n   cout << \"The current\
  \ user's login is: \" << pass->pw_name << endl;\n   cout << \"-> their full name\
  \ is: \" << pass->pw_gecos << endl;\n   cout << \"-> their user ID is: \" << pass->pw_uid\
  \ << endl;\n\n   // 可以使用 getenv() 函数获取环境变量\n   cout << \"The user's shell is: \"\
  \ << getenv(\"SHELL\") << endl;\n   cout << \"The user's path is: \"  << getenv(\"\
  PATH\") << endl;\n\n   // 一个示例系统调用，用于获取用户 ID -- 参见 sys/syscall.h\n   int uid = syscall(0xc7);\n\
  \   cout << \"Syscall gives their user ID as: \" << uid << endl;\n\n   // 直接调用 chmod\
  \ -- 输入 \"man 2 chmod\" 获取更多信息\n   int ret = chmod(\"test.txt\", 0666);\n   // 可以使用\
  \ syscall 执行相同操作\n   ret  = syscall(SYS_chmod, \"test.txt\", 0666);\n   return 0;\n\
  } \n```\n\n**清单 5-18:** `/exploringbb/chp05/syscall/glibcTest.cpp`\n\n可以按如下方式测试此代码，你可以看到程序更改了文件权限，并显示了当前用户的信息：\n\
  \n```\n…/chp05/syscall$ touch test.txt\n…/chp05/syscall$ chmod 644 test.txt\n…/chp05/syscall$\
  \ ls -l test.txt\n-rw-r--r-- 1 debian debian 0 May 15 03:40 test.txt\n…/chp05/syscall$\
  \ sudo usermod -c \"Exploring BeagleBone\" debian\n…/chp05/syscall$ g++ glibcTest.cpp\
  \ -o glibcTest\n…/chp05/syscall$ ./glibcTest\nGNU libc version is: 2.24\nThe current\
  \ user's login is: debian\n-> their full name is: Exploring BeagleBone\n-> their\
  \ user ID is: 1000\nThe user's shell is: /bin/bash\nThe user's path  is: /home/debian/bin:/usr/local/sbin:/usr/…\n\
  Syscall gives their user ID as: 1000\n…/chp05/syscall$ ls -l test.txt\n-rw-rw-rw-\
  \ 1 debian debian 0 May 15 03:40 test.txt \n```\n\nglibc 函数有很多，但 `syscall()` 函数需要特别关注。它使用你传递给函数的参数执行通用系统调用。第一个参数是系统调用号，定义在\
  \ `/sys/syscall.h` 中——你需要跟踪头文件包含链以找到定义。或者，你可以使用 [`syscalls.kernelgrok.com`](http://syscalls.kernelgrok.com)\
  \ 搜索定义（例如，搜索 `SYS_getuid`，你会看到寄存器 `eax` = `0xc7`，正如清单 5-18 中所用）。显然，使用 `SYS_getuid`\
  \ 更好。\n\n## 提高 Python 性能\n\n尽管 Python 很流行，但从表 5-1 可以清楚地看出，如果你将其用于某些嵌入式应用，可能需要增强性能。本节描述了两种解决性能问题的替代方法：研究\
  \ Cython，以及使用 Boost.Python 用 C/C++ 代码扩展 Python 的替代方法。\n\n无论采用哪种方法，第一步都是设置你的板子，以便构建\
  \ C/C++ 模块。为此，你需要安装与你正在使用的 Python 版本完全对应的 Python 开发包。请根据以下步骤调整本节的说明，使用你识别出的库版本：\n\
  \n```\ndebian@ebb:~$ python --version\nPython 2.7.13\ndebian@ebb:~$ python3 --version\n\
  Python 3.5.3\ndebian@ebb:~$ sudo apt install python3-dev\ndebian@ebb:~$ sudo apt\
  \ install python-dev\ndebian@ebb:~$ ls /usr/lib/arm-linux-gnueabihf/libpython*.so\n\
  /usr/lib/arm-linux-gnueabihf/libpython2.7.so\n/usr/lib/arm-linux-gnueabihf/libpython3.5m.so\
  \ \n```\n\n### Cython\n\nCython 是 Python 的优化编译器，也是一种用 C 风格功能扩展 Python 的语言。通常，Cython\
  \ 编译器使用你的 Python 代码生成高效的 C 共享库，然后你可以将其导入其他 Python 程序。然而，要充分利用 Cython，你必须调整 Python\
  \ 代码以使用 Cython 特定的语法。表 5-1 中性能最高的 Cython 条目（即 1.97 倍）位于 `/performance/cython_opt/nbody.pyx`。如果你检查代码，会看到使用了\
  \ `cdef` C 变量声明和各种变量类型（例如 `double`、`int`），这表明从基础 Python 版本（`/performance/n-body.py`）中移除了动态类型。\n\
  \n\n\n这里开发了一个简洁的示例，用于描述将 Python 代码改编为 Cython 代码的第一步。示例代码通过应用简单的数值积分方法，证明了 ![images](img/c05_i0001.png)\
  \ 的关系，如列表 5-19 所示。\n\n```\nfrom math import sin\ndef integrate_sin(a,b,N):\n   dx\
  \ = (b-a)/N\n   sum = 0\n   for i in range(0,N):\n      sum += sin(a+i*dx)\n   return\
  \ sum*dx \n```\n\n列表 5-19：`/chp05/cython/test.py`\n\n列表 5-19 中的代码可以直接在 Python 解释器中执行，如下所示（在\
  \ Python3 下使用 `exec(open(\"test.py\").read())`）：\n\n```\ndebian@ebb:~/exploringbb/chp05/cython$\
  \ python\nPython 2.7.13 (default, Nov 24 2017, 17:33:09)\n>>> from math import pi\n\
  >>> execfile('test.py')\n>>> integrate_sin(0,pi,1000)\n1.9999983550656624\n>>> integrate_sin(0,pi,1000000)\n\
  1.9999999999984077 \n```\n\n并且，可以引入计时器来评估其性能。\n\n```\n>>> import timeit\n>>> print(timeit.timeit(\"\
  integrate_sin(0,3.14159,1000000)\",setup →\n=\"from __main__ import integrate_sin\"\
  , number=10))\n66.1992490292\n>>> quit() \n```\n\n`timeit` 模块允许你确定函数调用的执行时长。在此示例中，PocketBeagle\
  \ 花费了 66 秒来评估函数 10 次，其中 `N` 等于 1,000,000。\n\n可以使用以下方法获取源代码中计算开销较大的动态 Python 行为的报告：\n\
  \n```\ndebian@ebb:~/exploringbb/chp05/cython$ sudo apt install cython\ndebian@ebb:~/exploringbb/chp05/cython$\
  \ cython -a test.py\ndebian@ebb:~/exploringbb/chp05/cython$ ls -l *.html\n-rw-r--r--\
  \ 1 debian debian 30610 May 17 01:27 test.html \n```\n\nHTML 报告中某一行上的黄色阴影越深，表明该行发生的动态行为程度越高。\n\
  \nCython 支持静态类型定义，这极大地提高了代码的性能。代码可以改编为列表 5-20 中的 `test.pyx`，其中显式定义了变量类型和返回类型。\n\n\
  ```\ncdef extern from \"math.h\":\n   double sin(double x)\n\ncpdef double integrate_sin(double\
  \ a, double b, int N):\n   cdef double dx, s\n   cdef int i\n   dx = (b-a)/N\n \
  \  sum = 0\n   for i in range(0,N):\n      sum += sin(a+i*dx)\n   return sum*dx\
  \ \n```\n\n列表 5-20：`/chp05/cython/test.pyx`\n\n还需要一个额外的配置文件 `setup.py`，如列表 5-21\
  \ 所示，以便 Cython 能够正确编译模块。\n\n```\nfrom distutils.core import setup\nfrom distutils.extension\
  \ import Extension\nfrom Cython.Distutils import build_ext\n\next_modules = [Extension(\"\
  test\", [\"test.pyx\"])]\nsetup(\n   name = 'random number sum application',\n \
  \  cmdclass = {'build_ext' : build_ext },\n   ext_modules = ext_modules\n) \n```\n\
  \n列表 5-21：`/chp05/cython/setup.py`\n\nPython 可以使用 `setup.py` 配置文件直接将 `test.pyx`\
  \ 文件构建为 C 代码（`test.c`），然后编译并链接以创建共享库（`test.so`）。该库代码可以直接在 Python 中执行，如下所示，执行时长为\
  \ 49 秒——性能有所提升。\n\n```\n…/chp05/cython$ python setup.py build_ext --inplace\nrunning\
  \ build_ext…\n…/chp05/cython$ ls\nbuild  setup.py  test.c  test.html  test.py  test.pyx\
  \  test.so\n…/chp05/cython$ python\nPython 2.7.13 (default, Nov 24 2017, 17:33:09)\n\
  >>> import timeit\n>>> print(timeit.timeit(\"test.integrate_sin(0,3.14159,1000000)\"\
  , →\nsetup=\"import test\",number=10))\n49.4493851662 \n```\n\nCython 在一定程度上解决了你在使用\
  \ Python 时可能遇到的性能问题；然而，为了效率而改编 Python 代码需要相当长的学习曲线，这里只是浅尝辄止。另一种方法是编写自定义的 C/C++ 代码模块来增强\
  \ Python 的功能，而不是使用 Cython。\n\n### Boost.Python\n\n另一种方法是使用一个名为 *Boost.Python* 的包装器来扩展\
  \ Python，该包装器将 C/C++ 和 Python 绑定在一起，本质上是对 Python/C API 的封装。此外，它简化了语法，并提供了对 C++ 对象的调用支持。你可以搜索最新版本，并使用以下步骤在你的板子上安装\
  \ Boost.Python（约 119 MB）：\n\n```\ndebian@ebb:~$ apt-cache search libboost-python\n\
  libboost-python-dev - Boost.Python Library development files (default version)\n\
  libboost-python1.62-dev - Boost.Python Library development files\nlibboost-python1.62.0\
  \ - Boost.Python Library\ndebian@ebb:~$ sudo apt install libboost-python1.62-dev\
  \ \n```\n\n可以开发一个 C++ 程序，如列表 5-22 所示，它使用 Boost.Python 库及其特殊的 `BOOST_PYTHON_MODULE(name)`\
  \ 宏来声明 Python 模块初始化函数——本质上替代了列表 5-21 中冗长的语法。\n\n```\n#include<string>\n#include<boost/python.hpp>\
  \           // .hpp convention for c++ headers\nusing namespace std;           \
  \      // just like cpp for source files\n\nnamespace exploringbb{             \
  \  // keep the global namespace clean\n\n   string hello(string name) {       //\
  \ e.g., returns \"Hello Derek!\"\n      return (\"Hello \" + name + \"!\");\n  \
  \ }\n\n   double integrate(double a, double b, int n) {     // same as before\n\
  \      double sum=0, dx = (b-a)/n;\n      for(int i=0; i<n; i++){  sum += sin((a+i)*dx);\
  \  }\n      return sum*dx;\n   }\n}\n\nBOOST_PYTHON_MODULE(ebb){             //\
  \ the module is called ebb\n   using namespace boost::python;     // require the\
  \ boost.python namespace\n   using namespace exploringbb;       // bring in custom\
  \ namespace\n   def(\"hello\", hello);               // make hello() visible to\
  \ Python\n   def(\"integrate\", integrate);       // make integrate() also visible\n\
  } \n```\n\n列表 5-22：`/chp05/boost/ebb.cpp`\n\n该代码可以像之前一样构建为共享库。确保在构建选项中包含 `boost_python`\
  \ 库。\n\n```\n…/chp05/boost$ g++ -O3 ebb.cpp -fPIC -shared -I/usr/include/ →\npython2.7/-lpython2.7\
  \ -lboost_python -o ebb.so\n…/chp05/boost$ ls -l *.so\n-rwxr-xr-x 1 debian debian\
  \ 30092 May 17 01:56 ebb.so \n```\n\n然后，该库可以被 Python 脚本使用，例如列表 5-23 中的脚本。\n\n```\n\
  #!/usr/bin/python\n# A Python program that calls C program code\nimport ebb\n\n\
  print \"Start of the Python program\"\nprint ebb.hello(\"Derek\")\nval = ebb.integrate(0,\
  \ 3.14159, 1000000)\nprint \"The integral result is: \", val\nprint \"End of the\
  \ Python program\" \n```\n\n列表 5-23：`/chp05/boost/test.py`\n\n列表 5-23 中的脚本可以执行，输出如下：\n\
  \n```\ndebian@ebb:~/exploringbb/chp05/boost$ ./test.py\nStart of the Python program\n\
  Hello Derek!\nThe integral result is:  1.99999999999\nEnd of the Python program\
  \ \n```\n\n该代码可以直接在 Python 中执行，如下所示，执行时长为 6.7 秒——性能显著提升。\n\n```\ndebian@ebb:~/exploringbb/chp05/boost$\
  \ python\n>>> import timeit\n>>> print(timeit.timeit(\"ebb.integrate(0, 3.14159,\
  \ →\n1000000)\",setup=\"import ebb\",number=10))\n6.69945406914 \n```\n\n尽管占用空间较大，但\
  \ Boost.Python 是集成 C/C++ 和 Python 代码的推荐方法，因为它性能优越、语法简洁，并且支持 C++ 类。更多详情请参见 [`tiny.cc/beagle504`](http://tiny.cc/beagle504)。\n\
  \n## 总结\n\n完成本章后，你应该能够：\n\n*   描述影响你在为 Beagle 平台构建应用程序时选择编程语言的众多问题\n\n*   在你的板子上编写基本的脚本语言程序代码，以与板载\
  \ LED 进行交互\n\n\n\n\n*   对比并区分脚本语言、混合型语言和编译型编程语言，以及它们在嵌入式 Linux 应用中的使用\n*   编写与 Beagle\
  \ 板载 LED 交互的 C 代码示例\n*   将 C 代码封装到 C++ 类中，以提供更好的程序结构\n*   编写能够与 Linux 操作系统命令交互的高级\
  \ C/C++ 代码\n*   编写可直接从 Python 调用的 C/C++ 模块\n\n## 延伸阅读\n\n本章大部分小节都包含指向相关网站的链接，供进一步阅读和参考。以下是与本章内容相关的一些编程书籍列表：\n\
