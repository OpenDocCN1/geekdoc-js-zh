  \ 通用音频串行端口——多通道音频串行端口（McASP），连接到 BeagleBone 上的 HDMI 帧缓冲器。 |\n\n**表 1-2****：**扩展排针上可用的功能\n\
  \n*   若干引脚连接到地。\n*   需要一些引脚来支持模拟输入（例如，1.8 V 参考电压）。\n*   一些引脚分配给 3.3 V 和 5 V 电压电源。\n\
  \n其余连接器可复用为多种不同功能，其中一些列于表 1-2 中。每种输入/输出类型的功能将在第 6 章和第 8 章中讨论。\n\n## Beagle 配件\n\n\
  大多数板卡（PocketBeagle 除外）都附带一根 USB 2.0 线缆（mini-USB 插头或 micro-USB 转 USB-A 插头），用于将 BeagleBone（通过\
  \ USB 客户端连接器）连接到台式计算机。板卡不附带 micro-SD 卡，特别是 PocketBeagle 需要您自行准备一张。BeagleBone 开箱即可启动，无需\
  \ SD 卡，因为 Linux 系统已预装在板载 eMMC 上。\n\n板卡可通过 HDMI 线缆连接显示器（BeagleBone Blue 和 PocketBeagle\
  \ 除外），但本书中的大多数示例假设板卡以无头模式使用——即不直接连接显示器，而是将板卡用作网络设备，与电子电路、USB 模块和无线传感器进行交互。\n\n###\
  \ 强烈推荐的配件\n\n建议您随板卡一起购买以下配件。如果您计划进行开发工作，那么最好拥有其中大部分配件。\n\n#### PocketBeagle 的排针\n\
  \n如果您计划将 PocketBeagle 与电子电路连接，那么首先要做的是为 P1/P2 扩展排针添加公针或母针排针，因为这些排针原本是未焊接的。根据您的应用，您可以使用两个\
  \ 2 × 18 的母排针（间距 2.54 mm/0.1 英寸）或可切割成 2 × 18 尺寸的分离式公排针（间距 2.54 mm/0.1 英寸），如图 1-6(a)所示。这些排针可以安装在\
  \ PocketBeagle 的顶部或底部；然而，当安装在顶部时，排针与 OSD3358 模块贴合不佳。底部还有一个有用的引脚标识键，如图 1-5 所示。令人惊讶的是，OSD3358\
  \ 模块的尺寸也使得板卡的元件面可以平放在工作台上。因此，我倾向于将排针安装在底部，如图 1-6(b)所示。\n\n![图片：(左) 母排针和公排针连接器；(右)\
  \ 将公排针焊接到板卡底部的 PocketBeagle。](img/c01f006.jpg)\n\n**图 1-6****：**(a) 母排针和公排针连接器；(b)\
  \ 将公排针焊接到板卡底部的 PocketBeagle\n\n根据我的经验，使用母排针比公排针更安全，因为当公排针以 2 × 18 阵列排列时，很容易意外短路两个相邻的公排针。而且，您只需用几根导线即可连接到母排针。\n\
  \n#### micro-SD 卡（用于启动或刷写 eMMC）\n\nmicro-SD 卡使您能够启动任何板卡，或将新的 Linux 镜像写入带有 eMMC 的板卡。如果您有\
  \ BeagleBone，那么在实验过程中意外损坏 Linux 文件系统时，这张卡就很重要，因为 micro-SD 卡可以让您使用“刷写器”配置来恢复系统。理想情况下，您应该准备两张专用的\
  \ SD 卡，一张用于启动镜像，一张用于刷写器配置。注意不要混淆它们！\n\n购买一张正品、有品牌的 micro-SD 卡，容量至少为 4 GB。理想情况下，您应该使用具有磨损均衡功能的\
  \ 8–64 GB micro-SD 卡。更大容量的 micro-SD 卡也可以使用，但可能成本过高——增加存储容量的替代方法包括使用 USB 存储设备。\n\n\
  您可能还需要一个 micro-SD 转 SD 适配器，以便在计算机的读卡器中使用。许多 micro-SD 卡都附带适配器，这比单独购买更便宜。micro-SD\
  \ 卡应为 Class 10 或更高等级，因为更快的读写速度尤其能节省您写入镜像的时间。空白 micro-SD 卡也可用于额外的文件系统存储（在第 3 章中讨论），因此卡容量越大越好。\n\
  \n#### 外部 5V 电源（用于外设）\n\n您可以直接通过台式机/笔记本电脑的 USB 连接，将板卡上的 USB 客户端连接器供电。对于入门来说，这完全没问题；然而，一旦您开始连接\
  \ Wi-Fi 适配器、USB 摄像头或板载显示器等配件，USB 提供的功率可能不足以满足您的配置。\n\n您可以购买一个直接插入电源插座的 5 V DC 稳压开关电源。其最小直流输出电流应为\
  \ 1 A。但如果可能，建议使用 2 A 电流的电源（2 A × 5 V = 10 W）。\n\n\n\n\nBeagleBone Blue 需要一款输出电流为\
  \ 3 A 的 12 V 直流电源。所有电源的 5 V 桶形连接器（直径 5.5 mm）均应为正极中心。\n\n#### 以太网线缆（用于有线 BBB 网络连接）\n\
  \nBeagle 板可以使用一种名为“USB 网络共享”的特殊网络模式，在板卡与桌面电脑之间创建虚拟网络；不过，如果你要将 BBB 连接到家庭网络，则可以使用\
  \ Cat5 网络跳线，通过其 RJ 45 10/100 以太网连接器将 BBB 接入网络。如果你计划同时使用多个 BBB，且网络稳定性对你的应用至关重要，可以考虑投资一个低成本的多端口交换机，将其放置在桌面电脑附近。\n\
  \n#### HDMI 线缆（用于连接显示器/电视）\n\n多款 Beagle 板都配有 HDMI 帧缓冲器和连接器，可以轻松连接到带有 HDMI 或 DVI\
  \ 连接器的显示器或电视。BBB 配备的是 micro-HDMI 插座（HDMI-D），因此请务必根据你的显示器/电视类型（通常为 HDMI-A 或 DVI-D）进行匹配。你可能需要的线缆是“HDMI-Micro-D\
  \ 插头转 HDMI-A 公头”。一根 1.8 m（6 ft.）的线缆价格不应超过 10 美元。购买时需注意——HDMI-C（mini-HDMI）连接器无法适配\
  \ BBB。\n\n或者，你也可以购买一个低成本的（3 美元）micro-HDMI（HDMI-D）插头转标准 HDMI（HDMI-A）插座适配器，或 micro-HDMI（HDMI-D）插头转\
  \ DVI-D 插座适配线缆。这些适配器可让你使用标准尺寸的 HDMI-A 连接器，或连接到 DVI-D 设备（参见图 1-8(a)）。\n\n![图片：（左）BBB\
  \ 连接 micro-HDMI 转 HDMI 适配器，再连接低成本 HDMI-A 转 DVI-D 线缆；（右）PocketBeagle 上的 USB OTG 连接器。](img/c01f008.jpg)\n\
  \n**图 1-8****：** (a) BBB 连接 micro-HDMI 转 HDMI 适配器，再连接低成本 HDMI-A 转 DVI-D 线缆；(b) PocketBeagle\
  \ 上的 USB OTG 连接器\n\n#### USB 转串口 UART TTL 3.3（用于故障排查）\n\n当板卡上的 Linux 系统出现问题时，USB\
  \ 转串口 UART TTL 串行线缆是一种非常实用的配件。它可以为你提供板卡的控制台接口，无需连接外部显示器和键盘。\n\n请确保购买 3.3 V 电平版本，并最好选购带有预装六路单向\
  \ 0.1 英寸母排针的版本，以便与 BeagleBone 或 PocketBeagle 配合使用。该线缆包含芯片组，需要在桌面电脑上安装驱动程序，以创建一个新的\
  \ COM 端口。如图 1-9(a) 所示的 FTDI TTL-232R-3V3 线缆工作良好且连接稳定（约 20 美元）。有关该适配器线缆的数据手册和软件驱动程序的“VCP”链接，请参见\
  \ [`tiny.cc/beagle106`](http://tiny.cc/beagle106)。市面上也有更便宜的替代品（0.60 美元），例如图 1-9(c)\
  \ 所示的 CH340G 芯片组设备，但请务必确保将电压选择器设置为 3.3 V。\n\n![图片：（左）USB 转 TTL 3.3 V 串行线缆；（中）其与\
  \ BBB 的连接；（右）低成本 USB 转 TTL 连接器。](img/c01f009.jpg)\n\n**图 1-9****：** (a) USB 转 TTL\
  \ 3.3 V 串行线缆；(b) 其与 BBB 的连接（连接线颜色为黑、棕、红、橙、黄、绿）；(c) 低成本 USB 转 TTL 连接器\n\n该线缆连接到 BeagleBone\
  \ 或 PocketBeagle 板上的串行 UART。使用常规 USB 5 V 电源为 Beagle 板供电后，按照表 1-3 所述以及图 1-9(b) 所示的方式连接线缆。\n\
  \n| **功能** | **FTDI 线缆** | **BEAGLEBONE** | **POCKETBEAGLE** |\n| --- | --- | ---\
  \ | --- |\n| 地线 | 黑色 GND 线 | J1 排针引脚 1 GND | P1 排针 GND |\n| TX→RX | 橙色发送线 | J1 排针引脚\
  \ 4 RXD | P1 排针 U0 RX |\n| RX←TX | 黄色接收线 | J1 排针引脚 5 TXD | P1 排针 U0 TX |\n\n**表\
  \ 1-3****：** 从 FTDI 线缆到 BeagleBone 或 PocketBeagle 板的串行调试连接\n\n请注意，扩展排针的详细说明见第 6\
  \ 章。如果你计划向 BeagleBone 刷写自己的镜像，或者你的板卡无法启动，我建议你购买其中一根线缆。该线缆的使用方法将在第 2 章和第 3 章中讨论。\n\
  \n### 可选配件\n\n以下各节介绍你可能需要的可选配件，具体取决于你正在开发的应用（参见图 1-10）。\n\n![图片：（左）USB Wi-Fi 适配器；（中）罗技\
  \ C920 摄像头；（右）Velleman USB 集线器（总线供电）。](img/c01f010.jpg)\n\n**图 1-10****：** (a) USB\
  \ Wi-Fi 适配器；(b) 罗技 C920 摄像头；(c) Velleman USB 集线器（总线供电）\n\n#### USB 集线器（用于将多个 USB\
  \ 设备连接到一个 USB 主机）\n\n如果你计划同时将多个 USB 设备连接到板卡，则需要一个 USB 集线器。USB 集线器分为总线供电和外部供电两种。外部供电的集线器更贵；不过，如果你要为多个功耗较高的适配器（尤其是\
  \ Wi-Fi）供电，则可能需要一个供电集线器。请务必在给 Beagle 板通电*之前*将 USB 集线器插入 Beagle 板的主机连接器。我尝试过不同品牌的\
  \ USB 集线器，它们都能正常工作，没有遇到问题。\n\n#### Micro-HDMI 转 VGA 适配器（用于 VGA 视频和音频）\n\n市面上有几种低成本的\
  \ micro-HDMI 转 VGA 适配器（例如在亚马逊或 eBay 上出售），用于将 HDMI 输出转换为 VGA 输出。除了提供 VGA 视频输出外，许多此类连接器还提供独立的\
  \ 3.5 mm 音频线路输出，如果你希望使用 BeagleBone 播放音频，而不需要电视、高端放大器或显示器，则可以使用该输出。此外，还有 USB 音频适配器，可提供高质量的播放和录音功能。这些适配器及其使用方法将在第\
  \ 14 章中介绍。\n\n#### Wi-Fi 适配器（用于无线网络）\n\nBeagleBone Wireless 板卡自带板载 Wi-Fi，但对于 BBB\
  \ 和 PocketBeagle，你可以使用 USB Wi-Fi 适配器。市面上有多种适配器可供选择，例如图 1-10(a) 中的那些；但并非所有适配器都能在\
  \ Linux 下工作。Linux 发行版和适配器内部的芯片组将决定成功的可能性。你可以在 [`tiny.cc/beagle107`](http://tiny.cc/beagle107)\
  \ 找到一份已验证可用的适配器列表。但请注意，制造商可能会在同一产品中更换芯片组，因此从列表中购买适配器并不能保证其一定可用。如果你能确认计划购买的适配器中的芯片组，并与列表进行比对，成功的可能性会更高。Wi-Fi\
  \ 配置和应用将在第 12 章中详细讨论，该章测试了一系列广泛可用的低成本适配器。\n\n#### USB 网络摄像头（用于图像采集和视频流传输）\n\n连接\
  \ USB 网络摄像头是一种将图像和视频采集集成到项目中的低成本方法。此外，利用 Video 4 Linux 和开源计算机视觉库（OpenCV）等 Linux\
  \ 库，你可以构建“视觉”应用。\n\n\n\n\n\n在第 14 章中，我们考察了不同的网络摄像头，但文本重点介绍了罗技 C920 网络摄像头在视频流应用中的使用（参见图\
  \ 1-10(b)）。这款摄像头价格相对较高（约 70 美元），但由于内置了 H.264/MPG-4 硬件编码，它能够在使用 Beagle 板时直接传输全高清视频。这大大减轻了主板的工作负载，使处理器可以用于其他任务。与\
  \ Wi-Fi 适配器类似，在购买摄像头用于特定目的之前，最好确认它在 Linux 下能否正常工作。我们将在第 14 章中介绍几种摄像头类型。\n\n####\
  \ USB 键盘和鼠标（用于通用计算）\n\n可以将 USB 键盘和鼠标分别连接到 USB 集线器，或者使用 2.4 GHz 无线键盘和鼠标组合。市面上有小型无线手持组合设备，例如\
  \ iPazzPort Wireless Mini、Rii i8 和 eSynic mini，它们都包含带集成触摸板的手持键盘。USB 蓝牙适配器对于将外设连接到主板也很有用。\n\
  \n## 扩展板\n\n扩展板是子板，可以连接到 BeagleBone 板上的 P8/P9 扩展排针，或 PocketBeagle 上的 P1/P2 扩展排针。由于这些板子的形状像超人披风一样包裹在\
  \ BBB 的 RJ45 以太网连接器周围，因此被称为*扩展板*（capes）。当扩展板彼此兼容时，你可以同时连接最多四个扩展板。\n\n有些扩展板使用了大量引脚。例如，你将在第\
  \ 13 章中看到 LCD4 扩展板。LCD4 扩展板使用了 P8 排针的 27 到 46 号引脚，以及部分模拟输入用于其按钮和电阻式触摸接口。如果你使用 eMMC\
  \ 启动 BBB，那么留给 GPIO 使用的引脚就很少了。此外，LCD 扩展板不会将排针延续下去。图 1-11 展示了该扩展板连接到 BBB 并运行标准 Debian\
  \ Linux 发行版时的两个视图。其他扩展板也会出现类似问题。\n\n![显示 LCD4 扩展板连接到 BeagleBone 板时的顶部和底部图像。](img/c01f011.jpg)\n\
  \n**图 1-11****：** LCD4 扩展板（顶部和底部视图）\n\n目前有超过 100 种扩展板可用于 BeagleBone 和 PocketBeagle\
  \ 板；你可以在[`www.beagleboard.org/cape`](http://www.beagleboard.org/cape)找到完整列表。以下是一些你可能在项目中会用到的示例扩展板：\n\
  \n*   LCD 扩展板有不同尺寸：7 英寸（800×480）、4 英寸（480×272）和 3 英寸（320×240），图 1-11 中展示的是 4 英寸版本。这些扩展板带有电阻式触摸屏，意味着你需要使用触控笔（或指甲）与屏幕交互。这与现代手机/平板电脑上的电容式触摸屏不同。Manga\
  \ Screen 2 是一款兼容 HDMI 的多点触控 LCD 屏幕替代品，有 4.8 英寸（720p）或 5.9 英寸（1080p）版本。参见[`tiny.cc/beagle108`](http://tiny.cc/beagle108)。\n\
  \n*   Adafruit Proto 扩展板，如图 1-12(a)所示，是一款低成本（约 10 美元）的裸板，你可以用它来将面包板设计转移到更稳固的平台。BeagleBone\
  \ 和 PocketBeagle 板还有多种其他面包板和原型扩展板可用。特别值得一提的是 BaconBits 扩展板（[`tiny.cc/beagle110`](http://tiny.cc/beagle110)），它为\
  \ PocketBeagle 增加了七段数码管、加速度计、LED、电位器、按钮和 USB 转串口桥接器。\n\n*   Replicape（179 美元）是一款令人印象深刻的开源\
  \ 3D 打印机扩展板，具有五个步进电机驱动器，支持微步进。更多信息请参见[`www.thing-printer.com`](http://www.thing-printer.com)。\n\
  \n![图片：（左）低成本 Adafruit Proto 扩展板，（右）合适的 Adafruit 外壳。](img/c01f012.jpg)\n\n**图 1-12****：**\
  \ (a) Proto 扩展板；(b) 合适的外壳\n\n在互连扩展板时，你必须注意兼容性。在[`tiny.cc/beagle109`](http://tiny.cc/beagle109)上有一张涵盖常见扩展板的兼容性表。上述列表只是很小的一部分。还有更多扩展板可用，并且随着时间的推移，很可能还会开发出更多的扩展板。\n\
  \n## 如何毁掉你的主板！\n\nBeagle 板是复杂而精密的设备，如果不小心使用，很容易损坏。如果你从 Arduino 等板子升级到 Beagle 平台，那么在连接为该平台构建的电路时必须格外小心。与\
  \ Arduino Uno 不同，主板上的微处理器无法更换——如果损坏了 SoC 或 SiP，你将需要购买一块新板！\n\n以下是你*绝对不要*做的事情：\n\n\
  *   不要通过拔掉电源插头/USB 电源来关闭主板。应通过软件关机（例如，按一次电源按钮）或按住电源按钮约八秒进行“硬”关机来正确关闭主板。这能使电源管理 IC（PMIC）正确关闭主板。如果需要通过断开电源来移除电源，请在按住复位按钮的同时进行操作，以降低系统功耗。\n\
  \n*   不要将通电的主板放在金属表面（例如铝制外壳的电脑）或带有散落/剪断的导线、电阻等的工作台上。如果短路了扩展排针上的引脚（或焊点），很容易损坏主板。你可以从\
  \ Adafruit 等供应商处购买外壳（参见图 1-12(b)）。或者，你也可以在主板上安装小型橡胶脚垫。\n\n*   不要连接从扩展排针提供/吸收超过极低电流的电路。许多排针引脚可提供的最大电流为\
  \ 4-6 mA，可吸收的最大电流为 8 mA。电源轨和地引脚可以提供和吸收更大的电流。Arduino 允许每个输入/输出引脚有 40 mA 的电流。这个问题将在第\
  \ 4 章和第 6 章中讨论。\n\n*   GPIO 引脚耐压 3.3 V（大多数 ADC 耐压 1.8 V）。不要连接以 5 V 供电的电路，否则会损坏主板。这在第\
  \ 4 章、第 6 章和第 8 章中讨论。\n\n*   不要在主板未通电时连接向扩展排针供电的电路。确保所有自供电的接口电路都通过 3.3 V 电源线或光耦进行门控。这在第\
  \ 6 章中讨论。\n\n以下是*始终*要遵循的两个步骤：\n\n*   仔细检查你正在使用的引脚编号。每个排针都有大量引脚，很容易插到排针连接器 17 而不是\
  \ 15。对于排针中间的连接，我总是数两遍——从左向上数和从右向下数。\n\n*   在连接你自己设计的复杂电路之前，详细阅读主板的 SRM 手册。\n\n如果你的主板坏了，而且*确实*是你的错，那么恐怕在你完成[`www.beagleboard.org/support`](http://www.beagleboard.org/support)上的所有检查后，你将不得不购买一块新板。如果*不是*你的错，那么请参阅\
  \ BBB/PocketBeagle SRM 手册和[`www.beagleboard.org/support`](http://www.beagleboard.org/support)网站，通过申请退货授权（RMA）编号将有缺陷的主板退回维修。\n\
  \n## 总结\n\n完成本章后，你应该能够做到以下几点：\n\n*   描述 Beagle 板的能力及其对不同项目类型的适用性\n\n\n\n\n\n*  \
  \ 获取有助于你使用 Beagle 平台的重要文档来源\n*   描述不同板卡上的主要硬件系统和子系统\n*   识别可购买的重要外设和配件，以增强板卡的功能\n\
  *   理解 Beagle 板作为物理计算设备的强大与复杂性\n*   了解保护板卡免受物理损坏的首要步骤\n\n## 支持\n\n本章前面列出了额外支持文档的主要来源。如果你在使用\
  \ Beagle 平台时遇到困难，且文档中未描述相关问题，则应使用以下两个资源：\n\n*   BeagleBoard Google 群组，可通过 [`groups.google.com/d/forum/beagleboard`](http://groups.google.com/d/forum/beagleboard)\
  \ 访问。在发布新问题前，请先阅读常见问题（FAQ）并搜索现有问题。\n*   可通过 [`www.beagleboard.org/chat`](http://www.beagleboard.org/chat)\
  \ 或直接加入 Beagle IRC 频道（在 [`irc.freenode.net`](http://irc.freenode.net) 上加入 `#beagle`）进行实时聊天，使用免费的\
  \ IRC 客户端，如 Linux 上的 X-Chat、Windows 上的 HexChat 或 macOS 上的 Colloquy。\n\n请记住，该群组和\
  \ IRC 频道中的成员是自愿抽出时间回答问题的社区成员。\n\n## 备注\n\n# 第 2 章\n\n## Beagle 软件\n\n本章将介绍 Linux\
  \ 操作系统以及可用于 Beagle 板卡的软件工具。本章旨在确保你能够连接到板卡并对其进行控制。通过本章的学习，你将能够按照逐步指南，在 Linux 终端窗口中使用\
  \ Linux shell 命令“闪烁”系统 LED。此外，本章还将介绍一个名为 `BoneScript` 的软件函数库，该库可与 Node.js 和 Cloud9\
  \ 集成开发环境配合使用，构建用于闪烁同一系统 LED 的代码。\n\n### 本章所需设备：\n\n*   任意 Beagle 板卡\n*   USB 线缆（通常为\
  \ USB A 公头转 mini 或 micro USB A 公头）\n*   Micro-SD 卡（4 GB 或更大；Class 10+）\n*   网络基础设施和线缆（可选）\n\
  \n本章的更多详细信息可在此处获取：\n\n[`www.exploringbeaglebone.com/chapter2/.`](http://www.exploringbeaglebone.com/chapter2/)\n\
  \n## Beagle 板上的 Linux\n\n*Linux 发行版* 是一种公开可用的 Linux 版本，附带一组软件程序和工具。有许多不同的 Linux\
  \ 发行版，通常专注于不同的应用。例如，高端服务器所有者可能会安装 Red Hat Enterprise、CentOS、Debian 或 OpenSUSE；桌面用户可能会安装\
  \ Ubuntu、Debian、Fedora 或 Linux Mint。列表无穷无尽，但所有发行版的核心都是共同的 Linux 内核，该内核由 Linus Torvalds\
  \ 于 1991 年构思并创建。\n\n在为嵌入式系统平台选择 Linux 发行版时，明智的做法是选择具有以下属性的发行版：\n\n*   发行版稳定且得到良好支持。\n\
  *   拥有良好的包管理器。\n*   发行版精简，适合嵌入式设备的低存储占用。\n*   针对你的特定设备有良好的社区支持。\n*   支持你想要连接的任何外设的设备驱动程序。\n\
  \n### Beagle 板的 Linux 发行版\n\n嵌入式系统平台有许多不同的 Linux 发行版，包括用于实时编程的昂贵专有版本。它们的核心都使用主线\
  \ Linux 内核，但每个发行版包含不同的工具和配置，从而带来截然不同的用户体验。Beagle 板社区使用的主要开源发行版包括 Debian、Ångström、Ubuntu\
  \ 和 Arch Linux。\n\n*Debian*（“Debbie 和 Ian”的缩写）是一个社区驱动的 Linux 发行版，强调开源开发。Debian 的开发没有商业组织参与；事实上，有一份正式的社会契约（[`tiny.cc/beagle201`](http://tiny.cc/beagle201)）声明\
  \ Debian 将完全保持自由（指软件自由）。本书中的许多实践步骤都使用 Debian 发行版；实际上，它被推荐为 Beagle 板的首选发行版，并且目前随新的\
  \ BeagleBone 板一起分发。此外，本书全程使用 Debian 作为 Linux 桌面计算机的发行版，因为它通过 Debian 交叉工具链（参见 [`wiki.debian.org/CrossToolchains`](http://wiki.debian.org/CrossToolchains)）为跨平台开发提供了出色的支持。目前，可从\
  \ [BeagleBoard.org](http://BeagleBoard.org) 网站下载不同版本的 Debian。\n\n*   *Debian Stretch\
  \ LXQt*，安装了轻量级 Qt 桌面（LXQt）环境。如果你将板卡连接到显示器或 LCD 面板，应使用此版本。\n*   *Debian Stretch IoT*，这是一个无头镜像，在\
  \ micro-SD 卡上占用空间更小，更重要的是，在 BeagleBone 的 eMMC 上占用空间也更小。\n\n*Ångström* 是一个稳定且精简的\
  \ Linux 发行版，广泛用于嵌入式系统。Ångström 背后的开发团队在定制嵌入式设备（如机顶盒、移动设备和网络设备）的 Linux 发行版方面经验丰富。令人印象深刻的是，Ångström\
  \ 可以缩减到只有几兆字节闪存存储的设备。Ångström 大量使用 *BusyBox*，这是一个多调用二进制文件（一个可执行文件可完成多项工作），用于创建 Linux\
  \ 系统上命令行工具的紧凑版本。我的许多 YouTube 视频都使用 Ångström，因为它在一段时间内是 BeagleBone 的主要发行版。\n\n*Ubuntu*\
  \ 与 Debian 关系密切；事实上，Ubuntu 网站（[`www.ubuntu.com`](http://www.ubuntu.com)）上这样描述：“Debian\
  \ 是 Ubuntu 赖以建立的基石。”Ubuntu 是最流行的桌面 Linux 发行版之一，主要因为它专注于让 Linux 对新用户更易用。它易于安装，拥有出色的桌面驱动程序支持，并且有针对\
  \ Beagle 板的二进制发行版。\n\n*Arch Linux* 是一个轻量级且灵活的 Linux 发行版，旨在“保持简单”，特别针对有能力的 Linux\
  \ 用户，让他们完全控制并负责系统配置。有针对 Beagle 板的预构建 Arch Linux 发行版；然而，与其他发行版相比，它目前对 Linux 新用户的支持较少（参见\
  \ [`www.archlinux.org`](http://www.archlinux.org)）。\n\n### 创建 Linux Micro-SD 卡镜像\n\
  \n设置 SD 卡以便用于启动 PocketBeagle 或其他 Beagle 板的最简单方法是从 [`beagleboard.org/latest-images`](http://beagleboard.org/latest-images)\
  \ 下载 Linux 发行版镜像文件（压缩为 `.xz` 格式的 `.img` 文件），然后使用镜像写入工具（如 Etcher（[`etcher.io`](http://etcher.io)））将其写入\
  \ SD 卡。Etcher 特别有用，因为它可以直接使用压缩镜像文件。该应用程序适用于 Windows、Mac 和 Linux 主机。\n\n## 与板卡通信\n\
  \n\n\n\n\n当你准备好尝试使用 Beagle 板时，首先要做的是用 USB 线将其连接到台式电脑。通电后，板子会以 USB 客户端模式连接到台式机。一旦连接并被识别，你的文件管理器（如\
  \ Windows 资源管理器）将显示板子 FAT 分区的内容，如图 2-1 所示。[BeagleBoard.org](http://BeagleBoard.org)\
  \ 团队编写了一份非常出色的 HTML 入门指南。你应该双击 `START.htm` 文件，在网页浏览器中查看该指南，如图 2-1 所示。\n\n![窗口显示文件管理器导航树中高亮显示的\
  \ BeagleBone 入门 (l:)。左侧面板中，START.htm 文件被高亮显示。](img/c02f001.jpg)\n\n**图 2-1****：**\
  \ `START.htm` 设置板子的指南（在 Windows 10 下运行）\n\n### 安装驱动程序\n\n按照图 2-1 所示指南中的步骤操作。使用最新的\
  \ Beagle 板 Linux 镜像，你通常不再需要为操作系统安装驱动程序。如果你使用的是较旧的镜像并需要安装驱动程序，请浏览到 `Drivers` 文件夹并安装正确的版本。一旦板子完全启动，你的台式电脑上应该会出现几个新设备。例如，你将拥有以下设备：\n\
  \n*   访问板子的 FAT 分区（如同 USB 存储密钥）。\n*   通过新的 Gadget Serial 驱动程序 COM 端口进行串行访问。\n* \
  \  一个 Linux USB 以太网/RNDIS 小工具（用于通过 USB 上网）。RNDIS 代表远程网络驱动程序接口规范。\n\n这些新设备可用于连接板子。当板子连接到你的电脑时，随着你逐步阅读指南，指南会高亮显示活动连接，如图\
  \ 2-2 所示。Linux 和 Mac 台式电脑的类似步骤可在启动指南中找到。\n\n![窗口截图，地址栏显示 beaglebord.org/static/beaglebon/latest/README.htm#step2，步骤\
  \ 1 和步骤 2 带有勾选标记。右侧是一个 4 列表格，显示默认 Wi-Fi 地址。](img/c02f002.jpg)\n\n**图 2-2****：**\
  \ `START.htm` 指南将高亮显示活动连接\n\n### 有线网络连接\n\n通过有线网络连接并与板子通信主要有三种方式，每种方式各有优缺点。第一种方式是使用\
  \ USB 上网，它通过一根 USB 线创建一个“私有”虚拟局域网。这种方法适用于所有 Beagle 板，但以下两种方式需要板子具备以太网适配器。第二种方式是使用常规以太网，第三种是使用以太网交叉线。通过网络连接板子对初学者来说可能是一个障碍。如果你在家工作并能控制自己的网络，通常很简单；然而，复杂的网络（如大学中的网络）可能包含多个有线和无线通信子网。在这种复杂网络中，路由限制可能使得通过常规以太网连接板子变得困难，甚至不可能。\n\
  \n#### USB 上网（所有板子）\n\n标准的 [BeagleBoard.org](http://BeagleBoard.org) Linux 发行版通过\
  \ Linux USB 以太网/RNDIS 小工具设备支持 USB 上网。对于新用户以及处于复杂网络基础设施中的用户来说，这可能是开始使用板子的最佳方式。这种设置只需要板子、一根\
  \ USB 线和一台台式电脑（最好具有管理员访问权限）。表 2-1 描述了 USB 上网连接板子的优缺点。\n\n| **优点** | **缺点** |\n|\
  \ --- | --- |\n| 为初学者提供稳定的网络设置。 | 除非付出大量努力，否则每台台式机只能连接一块板子。 |\n| 当你无法访问或控制网络基础设施硬件时，仍可将板子连接到互联网。\
  \ | 网络共享配置可能很困难，尤其是在 Macintosh 台式电脑上。还需要在板子的 Linux 操作系统上进行额外配置。 |\n| 通过 USB 由台式机供电。\
  \ | 台式机必须运行才能与互联网传输数据。 |\n\n**表 2-1****：** USB 上网的优缺点\n\n例如，如果你在 Windows 下完全安装了板子驱动程序，现在应该有一个新的网络连接（点击“开始”，输入“查看网络状态和任务”，然后选择“更改适配器设置”）。图\
  \ 2-3 显示了 Windows 下的典型网络连接窗口。在此例中，“以太网 3”是 Linux USB 以太网/RNDIS 小工具设备。台式电脑仍连接到你的常规局域网（本例中通过以太网\
  \ 2），该局域网提供对互联网的访问，同时还有一个仅包含台式电脑（例如 192.168.7.1）和你的板子（例如 192.168.7.2）的新私有局域网。你可以打开网页浏览器，在地址栏输入\
  \ 192.168.7.2（在 Mac/Linux 机器上为 192.168.6.2）连接到板子的 Web 服务器，如图 2-3 所示。\n\n![图片描述见标题和周围文字。](img/c02f003.jpg)\n\
  \n**图 2-3****：** 带有 USB 上网连接和网页浏览器连接的 Windows 网络连接\n\n此时，你可以使用网页浏览器连接到板子的 Web 服务器，从而拥有一个功能完整的私有网络；不过，你可能还希望板子能直接完全访问互联网，以便直接在板子上下载文件和更新\
  \ Linux 软件。为此，你需要共享主网络适配器，使来自板子的流量能够通过台式电脑路由到互联网。例如，在 Windows 下，请执行以下步骤：\n\n1. \
  \ 选择提供互联网访问的台式机/笔记本电脑网络适配器。右键单击它并选择“属性”。\n2.  在出现的对话框中（如图 2-4 左侧所示），单击顶部的“共享”选项卡，并启用“允许其他网络用户...”。\n\
  3.  在下拉列表中，选择你的私有局域网（例如，参照图 2-4，本例中为“以太网 3”）。单击“确定”。\n4.  右键单击私有局域网（例如以太网 3）并选择“属性”。\n\
  5.  双击“Internet 协议版本 4”。在此对话框中，选择“自动获得 IP 地址”并启用“自动获得 DNS 服务器地址”（参见图 2-4 右侧）。\n\
  6.  单击“确定”，然后“关闭”以保存配置。\n\n![图片描述见标题和周围文字。](img/c02f004.jpg)\n\n**图 2-4****：** 在\
  \ Windows 下配置网络连接共享属性\n\n在 macOS 下的步骤类似，通过 Apple 菜单 → 系统偏好设置 → 共享。如果一切顺利，此时你不会注意到任何差异，并且应该能够重新加载图\
  \ 2-3 中显示的网页。网络配置最终确定可能需要大约一分钟。请注意，最后两步的效果只有在打开与板子的终端连接时才能体现出来。\n\n#### 常规以太网（仅限\
  \ BBB 和 BeagleBoard）\n\n\n\n\n\n所谓“常规”以太网，是指像用有线连接台式电脑一样，将开发板连接到网络。对于 BeagleBone\
  \ Black（BBB）的家庭用户和高级用户而言，常规以太网可能是联网和连接开发板的最佳方案。表 2-2 列出了使用这种连接的优缺点。主要问题在于网络的复杂性——如果你了解自己的网络配置并能访问路由器设置，那么这无疑是最佳配置。如果你的网络路由器离台式电脑较远，可以使用一个小型网络交换机，价格仅需\
  \ 10 到 20 美元。或者，你也可以花 25 到 35 美元购买一个带有多端口路由器的无线接入点，这样就能集成 BeagleBone Black Wireless（BBBW）开发板。\n\
  \n| **优点** | **缺点** |\n| --- | --- |\n| 你可以完全控制 IP 地址设置以及动态/静态 IP 设置。 | 你可能需要网络基础设施的管理权限或相关知识。\
  \ |\n| 你可以将多个 BBB 连接并互连到同一个网络（包括无线设备）。 | BBB 需要电源（可以是市电适配器）。 |\n| BBB 无需台式电脑开机即可连接互联网。\
  \ | 如果网络结构复杂，初学者设置起来会更麻烦。 |\n\n**表 2-2****：** 常规以太网的优缺点\n\n这种配置的第一个挑战是在网络上找到你的 BBB。默认情况下，开发板配置为请求一个\
  \ `Dynamic Host Configuration Protocol`（DHCP）IP 地址。在家庭网络环境中，该服务通常由运行在集成调制解调器-防火墙-路由器-LAN（或类似配置）上的\
  \ DHCP 服务器提供，该设备将家庭网络连接到互联网服务提供商（ISP）。\n\n`DHCP servers` 会从一个地址池中动态分配 IP 地址，并设定一个固定时间间隔，称为\
  \ `lease time`（租约时间），该时间在 DHCP 配置中指定。当租约到期后，你的开发板下次连接到网络时会被分配一个不同的 IP 地址。这可能会令人沮丧，因为你可能需要在网络上重新搜索你的开发板。你可以将开发板的\
  \ IP 地址设置为 `static`（静态），这样每次连接时都会固定在同一地址。无线连接和静态 IP 连接将在第 12 章中讨论。\n\n有几种不同的方法可以找到开发板的动态\
  \ IP 地址。\n\n*   使用网页浏览器访问你的家庭路由器（通常地址为 `192.168.1.1`、`192.168.0.1` 或 `10.0.0.1`）。登录后，在“状态”等菜单下查找“DHCP\
  \ 表”。你应该能看到一个条目，详细列出了主机名为 `beaglebone` 的设备所分配的 IP 地址、物理 MAC 地址以及剩余租约时间。示例如下：\n\n\
  \    ```\n    租约表\n    IP 地址          MAC 地址        客户端主机名    注册信息\n    192.168.1.116\
  \   c8:a0:30:c0:6b:48  beaglebone     剩余 23:59:51 \n    ```\n\n*   使用端口扫描工具，例如 Linux\
  \ 下的 `nmap` 或 Windows 下可用的 `Zenmap` 图形界面版本（参见 [`tiny.cc/beagle202`](http://tiny.cc/beagle202)）。命令\
  \ `nmap -T4 -F 192.168.1.*` 将扫描子网上的设备。你需要查找一个通常开放五个端口的条目（例如，22 端口用于 SSH，53 端口用于\
  \ DNS，80 端口用于 [BeagleBoard.org](http://BeagleBoard.org) 网页指南，3000 端口用于 Cloud 9 IDE，8080\
  \ 端口用于 Apache 网络服务器）。该设备还应标识为 Texas Instruments。\n\n*   你可以通过串行 over USB 连接连接到开发板，然后输入\
  \ `ifconfig` 来查找 IP 地址。该地址是与 `eth0` 适配器关联的 `inet addr` 值。这一点稍后会讨论。\n\n一旦获得 IP 地址，你可以将其输入到网页浏览器的地址栏中（上例中为\
  \ `192.168.1.116`）来测试其有效性。浏览器应显示与图 2-3 相同的页面。\n\n#### 以太网交叉线（仅限 BBB 和 BeagleBoard）\n\
  \n以太网交叉线是一种经过修改的网线，可以使两个以太网设备直接连接，无需以太网交换机。它可以作为线缆或即插即用适配器购买。表 2-3 描述了这种连接类型的优缺点。\n\
  \n| **优点** | **缺点** |\n| --- | --- |\n| 当你无法使用网络基础设施硬件时，仍可连接到 BBB。 | 如果你的台式机只有一个网络适配器，你将失去互联网访问。最好与具有多个适配器的设备一起使用。\
  \ |\n| 如果台式机有两个网络适配器，BBB 可能可以访问互联网。 | BBB 仍需要电源（可以是市电适配器）。 |\n| 提供相当稳定的网络设置。 | 与通过\
  \ USB 共享互联网功能重复，因此建议先尝试那种方法。 |\n\n**表 2-3****：** 交叉线网络的优缺点\n\n大多数现代台式机具有自动交叉检测功能（Auto-MDIX），因此可以使用常规以太网线。Beagle\
  \ 开发板的网络接口也支持 Auto-MDIX；因此，当你无法使用网络基础设施时，可以使用这种连接类型。如果你的台式机有两个网络适配器（例如，带有有线和无线网络适配器的笔记本电脑），你可以通过桥接两个适配器轻松地与\
  \ BBB 共享互联网连接。例如，在 Windows 操作系统下需要执行以下步骤：\n\n1.  将一根常规（或交叉）以太网线的一端插入 BBB，另一端插入笔记本电脑的以太网接口。\n\
  \n2.  通过连接 USB 电源为 BBB 供电。\n\n3.  然后桥接两个网络连接——在 Windows 下点击“开始”，输入 `view network\
  \ status` 和任务，选择“更改适配器设置”，同时选中两个网络适配器（有线和无线），右键单击，然后选择“桥接”。一段时间后，两个连接应显示状态为“已启用，已桥接”，并出现一个网络桥接。\n\
  \n4.  重新启动 BBB。开发板重启后，它应该会直接从网络的 DHCP 服务器获取 IP 地址。\n\n然后，你可以使用下一节中描述的步骤，从网络上的任何位置（包括\
  \ PC/笔记本电脑本身）直接与 BBB 通信。这种连接类型在复杂的网络基础设施中（例如大学网络）特别有用，因为笔记本电脑可以使用分配的地址连接到 BBB。BBB\
  \ 也可以继续连接互联网。\n\n### 与开发板通信\n\n一旦开发板联网，接下来要做的就是与之通信。你可以通过 USB 串行连接、USB 转 TTL 或网络连接（如刚才讨论的）连接到\
  \ Beagle 开发板。网络连接应该是你的主要关注点，因为这种连接为开发板提供了完整的互联网访问。串行连接通常用作网络连接出现问题时的一种备用连接。因此，你可以跳过下一节，但此处提供的信息可作为问题出现时的参考。\n\
  \n#### 通过 USB 的串行连接\n\n\n\n\n如果你在前一节中为 Beagle 板安装了设备驱动程序，`Gadget Serial device`\
  \ 将允许你直接使用终端模拟程序连接到该板。当板靠近台式计算机并通过 USB 电缆连接时，串行连接尤其有用。当板上的网络配置或软件服务出现问题时，它通常是一种备用通信方法。\n\
  \n要通过串行连接连接到板，你需要一个终端程序。Windows 上有多个第三方应用程序可用，例如 RealTerm（[`realterm.sourceforge.io`](http://realterm.sourceforge.io)）和\
  \ PuTTY（[`www.putty.org`](http://www.putty.org)）。下一节也会用到 PuTTY。大多数桌面 Linux 发行版都包含一个终端程序（尝试\
  \ Ctrl+Alt+T 或使用 Alt+F2 并在 Debian 下输入 `gnome-terminal`）。macOS 默认包含一个终端模拟器（例如，输入\
  \ `screen/dev/tty.usbmodemfa133 115200`）。\n\n要通过 USB 串行连接连接到 Beagle 板，你需要了解一些信息。\n\
  \n*   **COM 端口号：** 你可以通过打开 Windows 设备管理器并在端口部分下查找来找到它。图 2-5 显示了一个设备管理器示例，其中 Gadget\
  \ Serial 设备被列为 COM3。这在不同的机器上会有所不同。\n\n*   **连接速度：** 默认情况下，你需要输入 `115,200` 波特率才能连接到板。\n\
  \n*   **其他终端应用程序可能需要的信息：** `数据位 = 8`；`停止位 = 1`；`奇偶校验 = 无`；以及 `流控制 = XON/XOFF`。\n\
  \n![图片由标题和周围文字描述。](img/c02f005.jpg)\n\n**图 2-5****：** Windows 设备管理器以及打开到板的 PuTTY\
  \ 串行连接\n\n使用会话名称保存配置，以便每次想要连接时都可以使用。单击“打开”，重要的是*当窗口出现时按 Enter 键*。连接到 Debian 时，你应该看到以下输出：\n\
  \n```\nDebian GNU/Linux 9 beaglebone ttyGS0\n\nBeagleBoard.org Debian Image 2018-03-05\n\
  Support/FAQ: http://elinux.org/Beagleboard:BeagleBoneBlack_Debian\ndefault username:password\
  \ is [debian:temppwd]\nbeaglebone login: debian\nPassword: temppwd\ndebian@beaglebone:~$\
  \ \n```\n\n这允许你使用用户名 `debian` 和密码 `temppwd` 登录。\n\n在 Linux 桌面计算机上，你可以安装 `screen`\
  \ 程序并使用以下命令连接到串行转 USB 设备：\n\n```\nmolloyd@debian:~$ sudo apt-get install screen\n\
  molloyd@debian:~$ screen /dev/ttyUSB0/ 115200 \n```\n\n#### 使用 USB 转 TTL 3.3V 电缆的串行连接\n\
  \n对于这种串行连接类型，你需要第 1 章中描述的专业电缆（或图 1-9(c) 中更便宜的替代品）。从 Windows 设备管理器中找到与名为 USB Serial\
  \ Port 的设备关联的 COM 端口。将电缆插入 P9 排针旁边的六针连接器（黑色引线连接到白点/J1），如图 1-9(a) 所示，或插入 PocketBeagle\
  \ 扩展排针，如图 1-9(b) 所示。\n\n然后你可以使用 PuTTY（`115,200` 波特率）打开串行连接，你将看到与之前相同的登录提示。但是，当你重新启动板时，你还会看到板启动时的完整控制台输出，它以以下内容开头（以\
  \ PocketBeagle 为例）：\n\n```\nU-Boot SPL 2018.01-00002-ge9ff418fb8 (Feb 20 2018 -\
  \ 20:14:57)\nTrying to boot from MMC1\nU-Boot 2018.01-00002-ge9ff418fb8 (Feb 20\
  \ 2018 - 20:14:57 -0600), \nBuild: jenkins-github_Bootloader-Builder-38\nCPU  :\
  \ AM335X-GP rev 2.1\nI2C:   ready\nDRAM:  512 MiB\n…\nModel: BeagleBoard.org PocketBeagle\n\
  … \n```\n\n这是最终的备用连接，因为它允许你查看启动过程中发生的情况，这将在下一章中描述。\n\n#### 通过安全外壳连接\n\n`安全外壳`（SSH）是一种有用的网络协议，用于网络设备之间的安全加密通信。你可以使用\
  \ SSH 终端客户端连接到在板端口 22 上运行的 SSH 服务器，这允许你执行以下操作：\n\n*   远程登录到板并执行命令\n\n*   使用 `SSH\
  \ 文件传输协议`（SFTP）向板传输文件或从板传输文件\n\n*   转发 X11 连接，这允许你执行虚拟网络计算（在第 13 章中介绍）\n\n默认情况下，BeagleBone\
  \ Linux 发行版运行一个绑定到端口 22 的 SSH 服务器（Debian 上为 `sshd`，Ångström 上为 `Dropbear`）。将 SSH\
  \ 服务器作为远程登录板的默认方法有几个优点。特别是，你可以使用路由器的端口转发功能将板的端口 22 开放到互联网。请确保在执行此操作之前为 root 用户帐户设置密码。然后，如果你知道板的\
  \ IP 地址，就可以从世界任何地方远程登录到你的板。大多数路由器支持一种称为 `动态 DNS` 的服务，该服务允许你的路由器将其最新地址注册到在线服务。然后，该在线服务将你选择的域名映射到\
  \ ISP 给你的最新 IP 地址。动态 DNS 服务通常有年度费用，它将为你提供一个形式为 [`MyBeagle.servicename.com`](http://MyBeagle.servicename.com)\
  \ 的地址。\n\n#### 使用 PuTTY 的安全外壳连接\n\n前面提到过 PuTTY（[`www.putty.org`](http://www.putty.org)）是一种通过串行转\
  \ USB 连接到板的方法。PuTTY 是一个免费的开源终端模拟器、串行控制台和 SSH 客户端，你也可以使用它通过网络连接到板。PuTTY 有一些有用的功能。\n\
  \n*   它支持串行和 SSH 连接。\n\n*   它安装了一个名为 `psftp` 的应用程序，使你能够从台式计算机通过网络向 Beagle 板传输文件或从\
  \ Beagle 板传输文件。\n\n*   它支持 SSH X11 转发，这在第 13 章中是必需的。\n\n图 2-6 显示了 PuTTY 配置设置。选择\
  \ SSH 作为连接类型，输入你的板的 IP 地址（`192.168.7.2` 或如果你使用互联网转 USB，则为 `192.168.6.2`），使用端口 22（默认），然后使用一个有用的名称保存会话以备将来使用。单击“打开”并使用你的用户名和密码登录。你可能会收到一个安全警报，警告中间人攻击，这在不安全的网络上可能是一个问题。接受指纹并继续。macOS\
  \ 和 Linux 用户可以使用类似的设置运行终端应用程序（例如，`ssh -X root@192.168.6.2`）。\n\n![PuTTY 配置设置，显示数据输入字段分别标记为\
  \ 192.168.7.2、22 和 BeagleBone 7.2，位于主机名、端口和已保存会话下，以及连接类型下选中的 SSH 单选按钮。](img/c02f006.jpg)\n\
  \n**图 2-6****：** Windows PC 上的 PuTTY SSH 配置设置，旁边是一个打开的 SSH 终端连接\n\n你将看到本章后面可以发出的基本\
  \ Linux 命令，但首先需要检查如何向板传输文件或从板传输文件。\n\n#### Chrome 应用：安全外壳客户端\n\nChrome 网络浏览器支持 Chrome\
  \ 扩展程序——这些应用程序的行为类似于本地安装（或原生）应用程序，但使用 HTML5、JavaScript 和 CSS 编写。其中许多应用程序使用 Google\
  \ 的 Native Client（NaCl，或 Salt！），这是一个沙箱，用于直接在网络浏览器中运行编译后的 C/C++ 应用程序，无论操作系统如何。NaCl\
  \ 的好处是应用程序可以达到接近原生的性能水平，因为它们可以包含使用低级指令的代码。\n\n\n\n有一个名为 *Secure Shell Extension*\
  \ 的实用 Chrome 扩展程序可用。在 Chrome 浏览器中打开一个新标签页，然后点击“应用”图标。前往 Chrome 网上应用店，搜索 *Secure\
  \ Shell*。安装完成后，再次点击“应用”图标时，它就会显示为 Secure Shell 应用。启动 Secure Shell 应用后，你需要按照图 2-6\
  \ 设置连接参数，应用界面将如图 2-7 所示。\n\n![图片描述由标题和周围文字提供。](img/c02f007.jpg)\n\n**图 2-7****：**\
  \ Secure Shell Chrome 扩展\n\n#### *通过 SSH 使用 PuTTY/`psftp` 传输文件*\n\nPuTTY 安装包还包含文件传输协议（FTP）支持，使你能够通过网络连接向开发板传输文件或从开发板接收文件。你可以在\
  \ Windows 开始菜单的命令文本框中输入 `psftp` 来启动 `psftp`（PuTTY 安全文件传输协议）应用。\n\n在 `psftp>` 提示符下，输入\
  \ `open debian@192.168.7.2`（例如，Windows PC 上通过 USB 联网的板卡地址）即可连接到开发板。此时，你的桌面电脑被称为*本地*机器，而\
  \ Beagle 板被称为*远程*机器。当你发出命令时，通常是在远程机器上执行。连接后，你会进入所使用的用户账户的主目录。因此，在 Debian 发行版中，如果你以用户\
  \ `debian` 身份连接，你会进入 `/home/Debian/` 目录。\n\n要将单个文件 `c:\\temp\\test.txt` 从本地桌面电脑传输到\
  \ Beagle 板，可以按照以下步骤操作：\n\n```\npsftp: no hostname specified; use \"open host.name\"\
  \ to connect\npsftp> open debian@192.168.7.2\nUsing username \"debian\".\nRemote\
  \ working directory is /home/debian\npsftp> lcd c:\\temp\nNew local directory is\
  \ c:\\temp\npsftp> mkdir test\nmkdir /home/debian/test: OK\npsftp> put test.txt\n\
  local:test.txt => remote:/home/debian/test.txt\npsftp> dir test.*\nListing directory\
  \ /home/debian\n-rw-r--r--    1 debian   debian          0 Apr  5 00:46 test.txt\
  \ \n```\n\n以 `l` 开头的命令表示针对本地机器执行的命令，例如 `lcd`（本地切换目录）或 `lpwd`（本地显示当前工作目录）。要传输单个文件，使用\
  \ `put` 命令，该命令将文件从本地机器传输到远程机器。`get` 命令则用于反向传输文件。要“put”或“get”多个文件，可以使用 `mput` 或 `mget`\
  \ 命令。如果忘记了某个命令，可以使用 `help`。\n\nWindows 上有免费的基于 GUI 的 SFTP 应用程序，例如 图 2-8 中显示的 WinSCP。你可以从\
  \ [`winscp.net`](http://winscp.net) 免费下载。其他替代方案包括 FileZilla（[`filezilla-project.org`](http://filezilla-project.org)）和\
  \ Cyberduck（[`cyberduck.io`](http://cyberduck.io)），它们支持 Windows 和 Mac。\n\n![用户 –\
  \ BeagleBone 7.2 – WinSCP 窗口，左侧（C:\\Users\\）和右侧（/home/deabian/）面板显示文件列表，包含类型和修改日期详情。](img/c02f008.jpg)\n\
  \n**图 2-8****：** 连接到 PocketBeagle 的 Windows 版 WinSCP SFTP 和 FTP 客户端\n\n如果你使用的是 Linux\
  \ 客户端机器，可以使用 `sftp` 命令代替 `psftp`。其他几乎所有内容都相同。SFTP 客户端应用程序也默认安装在 [BeagleBoard.org](http://BeagleBoard.org)\
  \ Linux 发行版中，因此你可以反转通信顺序，即让开发板充当客户端，另一台机器充当服务器。\n\n以下是一些关于 `psftp`/`sftp` 命令的有用提示和技巧：\n\
  \n*   `mget -r *` 将递归获取一个目录。如果你想要传输一个包含多个子文件夹的文件夹，这会很有用。`-r` 选项也可以用于 `get`、`put`\
  \ 和 `mput` 命令。\n*   `dir *.txt` 将应用过滤器，仅显示当前目录中的 `.txt` 文件。\n*   `mv` 可用于将远程机器上的文件/目录移动到远程机器上的新位置。\n\
  *   `reget` 可用于恢复被中断的下载。部分下载的文件必须存在于本地机器上。\n\n## 控制 Beagle 板\n\n至此，你应该能够使用 SSH 客户端应用程序与开发板通信，因此本节将介绍一些命令，用于你首次与这个\
  \ Linux SBC 进行交互。\n\n### 基本 Linux 命令\n\n当你首次通过 SSH 连接到开发板时，系统会提示你登录。在 Debian 下，你可以使用用户名\
  \ `debian` 和密码 `temppwd` 登录。\n\n```\nlogin as: debian\ndebian@192.168.7.2's password:\
  \ temppwd\nLinux beaglebone 4.9.82-ti-r102 #1 SMP PREEMPT Thu Feb 22 01:16:12 UTC\
  \ \n2018 armv7l The programs included with the Debian GNU/Linux system are \nfree\
  \ software; the exact distribution terms for each program are \ndescribed in the\
  \ individual files in /usr/share/doc/*/copyright.\nDebian GNU/Linux comes with ABSOLUTELY\
  \ NO WARRANTY, to the extent\npermitted by applicable law.\nLast login: Thu Apr\
  \  5 00:08:01 2018 from 192.168.7.1\ndebian@beaglebone:~$ \n```\n\n现在你已经连接到开发板，Linux\
  \ 终端已准备好接收你的命令。`$` 提示符表示你以普通用户账户登录（超级用户使用 `#` 提示符）。对于 Linux 新手来说，这一步可能相当令人望而生畏，因为不清楚有哪些命令可供使用。本节将为你提供足够的\
  \ Linux 技能，以便你能够应付。它作为带有示例的参考编写，以便你在需要帮助时可以回来查阅。其中一些命令在第 3 章中有更详细的描述。\n\n#### *第一步*\n\
  \n你可能想做的第一件事是确定你正在运行的 Linux 版本。当你在论坛上提问时，这会很有用。\n\n```\ndebian@beaglebone:~$ uname\
  \ -a\nLinux beaglebone 4.9.82-ti-r102 #1 SMP PREEMPT Thu Feb 22 01:16:12 UTC \n\
  2018 armv7l GNU/Linux\ndebian@beaglebone:~$ cat /etc/dogtag\nBeagleBoard.org Debian\
  \ Image 2018-03-05 \n```\n\n在这个例子中，使用的是 Linux 4.9.82，它是为 ARMv7 架构构建的，构建日期如上所列，并打包为\
  \ [BeagleBoard.org](http://BeagleBoard.org) 镜像，镜像日期在“dog tag”中列出。\n\nLinux 内核版本由\
  \ *X.Y.Z* 形式的数字描述。*X* 数字很少变化（3.0 版本于 2011 年发布，4.0 于 2015 年发布）。*Y* 值每年变化几次（4.8 于\
  \ 2016 年 10 月发布，4.9¹ 于 2016 年 12 月发布）。*Z* 值则定期变化。\n\n接下来，你可以使用 `passwd` 命令为 `debian`\
  \ 用户账户设置一个非默认密码。\n\n```\ndebian@beaglebone:~$ passwd\nChanging password for debian.\n\
  (current) UNIX password: temppwd\nEnter new UNIX password: newpasswd\nRetype new\
  \ UNIX password: newpasswd\npasswd: password updated successfully \n```\n\n表 2-4\
  \ 列出了其他有用的第一步命令。\n\n| **命令** | **描述** |\n| --- | --- |\n| `more /etc/issue` | 返回你正在使用的\
  \ Linux 发行版。 |\n| `ps -p $$` | 返回你当前使用的 shell（例如 `bash`）。 |\n| `whoami` | 返回你当前登录的用户名（例如\
  \ `debian`）。 |\n| `uptime` | 返回系统已运行的时间。 |\n| `top` | 列出所有正在运行的进程和程序。按 Ctrl+C 关闭视图。\
  \ |\n\n**表 2-4****：** Linux 中有用的初始命令\n\n#### *基本文件系统命令*\n\n\n\n\n\n本节介绍在 Linux 文件系统中移动和操作所需的基本命令。使用\
  \ Debian 和 Ubuntu 用户账户时，通常必须在某些命令的开头加上 `sudo` 一词。这是因为 `sudo` 是一个允许用户以超级用户的安全权限运行程序的程序。用户账户将在下一章讨论。目前，你需要的基本文件系统命令列在表\
  \ 2-5 中。\n\n| 名称 | 命令 | 选项及更多信息 | 示例 |\n| --- | --- | --- | --- |\n| 列出文件 | `ls`\
  \ | `-a` 显示所有文件（包括隐藏文件）。`-l` 显示长格式。`-R` 递归列出。`-r` 反向列出。`-t` 按最后修改时间排序。`-S` 按文件大小排序。`-h`\
  \ 以人类可读格式显示文件大小。 | `ls –al` |\n| 当前目录 | `pwd` | 打印工作目录。`-P` 打印物理位置。 | `pwd -P` |\n\
  | 切换目录 | `cd` | 切换目录。输入 `cd` 然后回车或 `cd ~/` 进入主目录。`cd /` 进入文件系统根目录。`cd ..` 返回上一级。\
  \ | `cd /home/debian` `cd /` |\n| 创建目录 | `mkdir` | 创建一个目录。 | `mkdir test` |\n| 删除文件或目录\
  \ | `rm` | 删除文件。`-r` 递归删除（用于目录）。`-d` 删除空目录。 | `rm bad.txt` `rm -r test` |\n| 复制文件或目录\
  \ | `cp` | `-r` 递归复制。`-u` 仅当源文件比目标文件新或目标文件不存在时复制。`-v` 详细输出（即显示过程）。 | `cp a.txt b.txt`\
  \ `cp -r test testa` |\n| 移动文件或目录 | `mv` | `-i` 覆盖前提示。移动目录不需要 `-r`。移动到同一目录相当于重命名。\
  \ | `mv a.txt c.txt` `mv test testb` |\n| 创建空文件 | `touch` | 创建空文件或更新已有文件的修改日期。 |\
  \ `touch d.txt` |\n| 查看文件内容 | `more` | 查看文件内容。按空格键翻到下一页。 | `more d.txt` |\n| 获取日历\
  \ | `cal` | 显示基于文本的日历。 | `cal 01 2019` |\n\n表 2-5：基本文件系统命令\n\n以上涵盖了基础知识，但还有更多内容！下一章将介绍文件所有权、权限、搜索、I/O\
  \ 重定向等。本节的目标是让你能够快速上手。表 2-6 介绍了一些在使用大多数 Linux shell 时能提高效率的快捷键。\n\n| 快捷键 | 说明 |\n\
  | --- | --- |\n| 上箭头（重复） | 显示你输入的上一条命令，重复按则显示更早的命令。 |\n| Tab 键 | 自动补全文件名、目录名甚至可执行命令名。例如，要切换到\
  \ Linux 的 `/tmp` 目录，可以输入 `cd /t` 然后按 Tab，它会自动补全为 `cd /tmp/`。如果有多个选项，再按一次 Tab 键会以列表形式显示所有选项。\
  \ |\n| Ctrl+A | 将光标移到当前行的开头。 |\n| Ctrl+E | 将光标移到当前行的末尾。 |\n| Ctrl+U | 清除到行首。按 Ctrl+E\
  \ 再按 Ctrl+U 可清除整行。 |\n| Ctrl+L | 清屏。 |\n| Ctrl+C | 终止当前正在运行的进程。 |\n| Ctrl+Z | 将当前进程放入后台。输入\
  \ `bg` 使其在后台继续运行，输入 `fg` 则将其调回前台。这将在下一章的“Linux 进程”部分讨论。 |\n\n表 2-6：一些节省时间的终端键盘快捷键\n\
  \n下面是一个示例，使用表 2-5 中的几个命令创建一个名为 `test` 的目录，并在其中创建一个空文本文件 `hello.txt`。然后将整个 `test`\
  \ 目录复制到 `/tmp` 目录（该目录位于 Linux 根目录下）。\n\n```\ndebian@beaglebone:~$ cd ~/\ndebian@beaglebone:~$\
  \ pwd\n/home/debian\ndebian@beaglebone:~$ mkdir test\ndebian@beaglebone:~$ cd test\n\
  debian@beaglebone:~/test$ touch hello.txt\ndebian@beaglebone:~/test$ ls\nhello.txt\n\
  debian@beaglebone:~/test$ cd ..\ndebian@beaglebone:~$ cp -r test /tmp\ndebian@beaglebone:~$\
  \ cd /tmp/test/\ndebian@beaglebone:/tmp/test$ ls -l\ntotal 0\n-rw-r--r-- 1 debian\
  \ debian 0 Apr  5 00:50 hello.txt \n```\n\n#### *环境变量*\n\n*环境变量* 是描述 Linux 环境配置的命名值，例如可执行文件的位置或默认编辑器。要了解你板子上设置的环境变量，可以执行\
  \ `env` 命令，它会列出你账户下的环境变量。以下是在 Debian IoT 镜像上调用 `env` 的结果：\n\n```\ndebian@beaglebone:~$\
  \ env\n…\nUSER=debian\nPWD=/home/debian\nHOME=/home/debian\nSSH_CLIENT=192.168.7.1\
  \ 6233 22\nSSH_TTY=/dev/pts/0\nPATH=/home/debian/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:\n\
  /sbin:/bin:/usr/local/games:/usr/games\n… \n```\n\n你可以按照以下示例查看和修改环境变量，该示例将 `temp`\
  \ 用户目录添加到 `PATH` 环境变量中：\n\n```\ndebian@beaglebone:~$ echo $PATH\n/home/debian/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin\n\
  :/sbin:/bin:/usr/local/games:/usr/games\ndebian@beaglebone:~$ export PATH=$PATH:~/temp\n\
  debian@beaglebone:~$ echo $PATH\n/home/debian/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin\n\
  :/sbin:/bin:/usr/local/games:/usr/games:/home/debian/temp \n```\n\n此更改在重启后会丢失。要永久设置环境变量，需要在\
  \ `sh`、`ksh` 或 `bash` shell 中修改 `.profile` 文件；在 `csh` 或 `tcsh` shell 中修改 `.login`\
  \ 文件。为此，你需要能够在 Linux 终端窗口中进行文件编辑。\n\n### 基本文件编辑\n\n有多种编辑器可用，但对于新用户来说，最容易上手的编辑器之一同时也是最强大的——*GNU\
  \ nano 编辑器*。你可以通过输入 `nano` 后跟现有或新文件名来启动编辑器；例如，输入 `nano hello.txt` 将显示图 2-9 中捕获的视图（在输入文本之后！）。输入\
  \ `nano -c hello.txt` 还会显示行号，这在调试程序代码时非常有用。你可以使用箭头键在窗口内自由移动，并在光标位置编辑或写入文本。你可以在编辑器窗口底部的栏上看到一些\
  \ nano 快捷键，但还有更多，其中一些列在表 2-7 中。\n\n![图片由标题和周围文字描述。](img/c02f009.jpg)\n\n图 2-9：在\
  \ PuTTY Linux 终端窗口中使用 GNU nano 编辑器编辑示例文件\n\n| 按键 | 命令 | 按键 | 命令 |\n| --- | --- |\
  \ --- | --- |\n| Ctrl+G | 帮助 | Ctrl+Y | 上一页 |\n| Ctrl+C | 取消 | Ctrl+_ 或 Ctrl+/ |\
  \ 跳转到行号 |\n| Ctrl+X | 退出（提示保存） | Alt+/ | 跳转到文件末尾 |\n| Ctrl+L | 启用长行换行 | Ctrl+6 |\
  \ 开始标记文本（然后用箭头键移动以高亮） |\n| Ctrl+O | 保存 | Ctrl+K 或 Alt+6 | 剪切标记的文本 |\n| 箭头键 | 移动光标\
  \ | Ctrl+U | 粘贴文本 |\n| Ctrl+A | 跳转到行首 | Ctrl+R | 插入另一个文件的内容（提示输入文件位置） |\n| Ctrl+E\
  \ | 跳转到行尾 | Ctrl+W | 搜索字符串 |\n| Ctrl+空格 | 下一个单词 | Alt+W | 查找下一个 |\n| Alt+空格 | 上一个单词\
  \ | Ctrl+D | 删除光标下的字符 |\n| Ctrl+V | 下一页 | Ctrl+K | 删除整行 |\n\n表 2-7：Nano 快捷键——快速参考\n\
  \n### 现在几点了？\n\n\n\n\n\n像这样一个简单的问题带来的困难超乎你的想象。如果你在 shell 提示符下输入 `date`，可能会得到如下结果：\n\
  \n```\ndebian@beaglebone:~$ date\nThu Apr  5 01:06:59 UTC 2018 \n```\n\n在这个例子中，即使开发板通过\
  \ USB 网络共享连接到台式电脑，日期也落后了几个月。不过，如果你通过“常规”以太网连接，日期和时间很可能是正确的。\n\n如果时间不对，为什么 [BeagleBoard.org](http://BeagleBoard.org)\
  \ 团队没有在你的开发板上设置时钟呢？答案是：他们做不到。与台式电脑不同，开发板上没有电池备份来确保 BIOS/UEFI 设置得以保留——事实上，根本没有 BIOS\
  \ 或 UEFI！这个话题将在下一章详细讨论，但目前你需要一种设置时间的方法，为此你可以使用网络时间协议（NTP）。NTP 是一种用于在计算机之间同步时钟的网络协议。如果你的开发板时间正确，那只是因为它从你的网络中获取了时间。在最近的\
  \ Debian 镜像中，这是由 `systemd` 特殊单元完成的。\n\n```\nroot@beaglebone:~# systemctl status\
  \ time-sync.target\n• time-sync.target - System Time Synchronized\n   Loaded: loaded\
  \ (/lib/systemd/system/time-sync.target; static; \n   vendor preset: enabled)\n\
  \   Active: active since Sun 2018-04-22 23:51:53 IST; 19min ago \n```\n\n如果时间不正确，很可能是你没有互联网连接。请参阅以下功能：“Internet-over-USB\
  \ Network Settings”。\n\n一旦时间正确，使用以下命令，它会提供一个基于文本的用户界面，允许你选择所在位置。在本例中，开发板现在设置为爱尔兰标准时间（IST）。\n\
  \n```\ndebian@beaglebone:~$ sudo dpkg-reconfigure tzdata\nCurrent default time zone:\
  \ 'Europe/Dublin'\nLocal time is now:      Mon Apr 23 00:06:21 IST 2018.\nUniversal\
  \ Time is now:  Sun Apr 22 23:06:21 UTC 2018\\. \n```\n\n### 包管理\n\n在本章开头，一个好的包管理器被列为合适\
  \ Linux 发行版的关键特性之一。*包管理器*是一组软件工具，用于自动化在 Linux 操作系统中安装、配置、升级和删除软件包的过程。不同的 Linux 发行版使用不同的包管理器：Ångström\
  \ 使用 *OPKG*，Ubuntu 和 Debian 使用基于 *DPKG*（Debian 包管理系统）的 *APT*（高级打包工具），而 Arch Linux\
  \ 使用 *Pacman*。每个都有其自己的使用语法，但操作方式大致相似。例如，表 2-8 中的第一行列出了使用不同管理器安装软件包的命令。该表还列出了其他可用的包管理命令。\n\
  \n| **命令** | **ÅNGSTRÖM** | **DEBIAN/UBUNTU** |\n| --- | --- | --- |\n| 安装一个软件包。\
  \ | `opkg install nano` | `sudo apt install nano` |\n| 更新软件包索引。 | `opkg update`\
  \ | `sudo apt update` |\n| 升级系统上的软件包。 | `opkg upgrade` | `sudo apt upgrade2` ² |\n\
  | nano 是否已安装？ | `opkg list-installed \\| grep nano` | `dpkg-query -l \\| grep nano`\
  \ |\n| 是否存在包含字符串 `nano` 的软件包？ | `opkg list \\| grep nano` | `apt search nano` |\n\
  | 获取关于某个软件包的更多信息。 | `opkg info nano` | `apt show nano` `apt policy nano` |\n| 获取帮助。\
  \ | `opkg` | `apt help` |\n| 将软件包下载到当前目录。 | `opkg download nano` | `apt download\
  \ nano` |\n| 删除一个软件包。 | `opkg remove nano` | `sudo apt remove nano` |\n| 清理旧软件包。\
  \ | 较复杂。搜索 `opkg-clean script`。 | `sudo apt autoremove` `sudo apt clean` |\n\n**表\
  \ 2-8****：** 常用包管理命令（以 nano 为例）\n\n你应该定期更新软件包列表（`sudo` 密码是你的 Debian 账户密码），使用 `apt\
  \ update` 命令。调用 `apt update` 会从文件 `/etc/apt/sources.list` 中指定的互联网位置下载软件包列表。这并不会安装新版本的软件，而是更新软件包列表及其依赖关系。\n\
  \n```\ndebian@beaglebone:~$ sudo apt update\n[sudo] password for debian:\nIgn:1\
  \ http://deb.debian.org/debian stretch InRelease\n…\nGet:14 http://repos.rcn-ee.com/debian\
  \ stretch/main armhf Packages [516 kB]\nFetched 10.7 MB in 11s (896 kB/s)\nReading\
  \ package lists… Done\nBuilding dependency tree\nReading state information… Done\n\
  75 packages can be upgraded. Run 'apt list --upgradable' to see them.\ndebian@beaglebone:~$\
  \ sudo apt list --upgradable\nListing… Done\napache2/stable 2.4.25-3+deb9u4 armhf\
  \ [upgradable from: 2.4.25-3+deb9u3]\n… \n```\n\n完成后，你可以使用 `apt upgrade` 命令自动下载并安装可用软件的最新版本。显然，你应该始终在\
  \ `apt upgrade` 之前执行 `apt update` 命令。请注意，其中一些步骤（尤其是升级）可能需要相当长的时间才能完成——甚至可能几个小时，具体取决于你的镜像的新旧程度和网络连接速度。\n\
  \nWavemon 是一个有用的工具，可用于配置 Wi-Fi 连接（参见第 12 章）。如果你执行该命令，你会看到该软件包尚未安装。\n\n```\ndebian@beaglebone:~$\
  \ wavemon\n-bash: wavemon: command not found \n```\n\n一旦确定了软件包名称，就可以使用特定平台（此处为 Debian）的包管理器来安装该软件包。\n\
  \n```\ndebian@beaglebone:~$ apt search wavemon\nSorting… Done … Full Text Search…\
  \ Done\nwavemon/stable 0.8.1-1 armhf\n Wireless Device Monitoring Application\n\
  debian@beaglebone:~$ sudo apt install wavemon\nReading package lists… Done\n…\n\
  Setting up wavemon (0.8.1-1) … \n```\n\n现在 `wavemon` 命令可以执行了，但不幸的是，在配置无线适配器之前它不会做任何事情（参见第\
  \ 12 章）。\n\n```\ndebian@beaglebone:~$ wavemon\nwavemon: no supported wireless interfaces\
  \ found! Check manpage for help. \n```\n\n### Beagle 专用命令\n\n有一些由 [BeagleBoard.org](http://BeagleBoard.org)\
  \ 社区开发的 Beagle 专用工具可用于配置你的开发板。这些工具简化了一些原本相当困难的任务。它们位于 `/opt/scripts/tools` 目录中，本节将对其进行描述。在使用这些工具之前，请检查你是否拥有最新版本。\n\
  \n```\ndebian@beaglebone:~$ cd /opt/scripts/tools/\ndebian@beaglebone:/opt/scripts/tools$\
  \ git pull || true\nAlready up-to-date.\ndebian@beaglebone:/opt/scripts/tools$ ls\n\
  beaglebone-black-eMMC-flasher.sh  grow_partition.sh     update_kernel.sh\ndevelopers\
  \                        init-eMMC-flasher.sh  version.sh\ndtc                 \
  \              non-mmc-rootfs        wm\neMMC                              readme.txt\n\
  graphics                          software \n```\n\n#### *扩展 SD 卡上的文件系统*\n\n如果你在容量大于\
  \ 4 GB 的 micro-SD 卡上安装了 [BeagleBoard.org](http://BeagleBoard.org) Linux 镜像，那么你应该扩展文件系统以使用完整的卡容量。在此示例中，PocketBeagle\
  \ 使用了一张 32 GB 的 micro-SD 卡，而 Debian IoT 镜像大小为 4 GB。使用 `lsblk` 工具（参见第 3 章），你可以看到大部分\
  \ SD 卡空间不可用，而 `df` 工具显示 Linux 分区已使用了 54%。\n\n```\ndebian@beaglebone:~$ lsblk\nNAME\
  \        MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT\nmmcblk0     179:0    0 29.8G  0 disk\n\
  └_mmcblk0p1 179:1    0  3.3G  0 part /\ndebian@beaglebone:~$ df -k\nFilesystem \
  \    1K-blocks    Used Available Use% Mounted on\nudev              219844     \
  \  0    219844   0% /dev\ntmpfs              49624    4972     44652  11% /run\n\
  /dev/mmcblk0p1   3357264 1684596   1482412  54% /\n… \n```\n\n\n\n\n你可以按如下方式使用分区扩容工具：\n\
  \n```\ndebian@beaglebone:/opt/scripts/tools$ sudo ./grow_partition.sh\nMedia: [/dev/mmcblk0]\n\
  sfdisk: 2.26.x or greater\nDisk /dev/mmcblk0: 29.8 GiB, 32010928128 bytes, 62521344\
  \ sectors\n…\ndebian@beaglebone:/opt/scripts/tools$ sudo reboot \n```\n\n重启后，通过使用\
  \ `lsblk` 工具可以清楚地看到 micro-SD 卡已完全可用。现在整个 SD 卡都已可用，可以安全地调用 `apt upgrade` 命令。\n\n\
  ```\ndebian@beaglebone:~$ lsblk\nNAME        MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT\n\
  mmcblk0     179:0    0 29.8G  0 disk\n└_mmcblk0p1 179:1    0 29.8G  0 part /\ndebian@beaglebone:~$\
  \ sudo apt upgrade\ndebian@beaglebone:~$ df -k\nFilesystem     1K-blocks    Used\
  \ Available Use% Mounted on\nudev              219332       0    219332   0% /dev\n\
  tmpfs              49520    5012     44508  11% /run\n/dev/mmcblk0p1  30707172 1953168\
  \  27455072   7% / \n```\n\n### 更新内核\n\n你也可以使用更新内核工具，将内核更新到 [BeagleBoard.org](http://BeagleBoard.org)\
  \ 提供的最新版本，操作如下：\n\n```\ndebian@beaglebone:~$ uname -a\nLinux beaglebone 4.9.82-ti-r102\
  \ #1 SMP PREEMPT Thu Feb 22 01:16:12 UTC 2018\narmv7l GNU/Linux\ndebian@beaglebone:~$\
  \ cd /opt/scripts/tools/\ndebian@beaglebone:/opt/scripts/tools$ sudo ./update_kernel.sh\n\
  …\nKernel version options:\n-----------------------------\nLTS44: --lts-4_4\nLTS49:\
  \ --lts-4_9\nLTS414: --lts-4_14\nSTABLE: --stable\nTESTING: --testing\ninfo:you\
  \ are running:[4.9.82-ti-r102],latest is:[4.9.88-ti-r111] updating…\ndebian@beaglebone:~$\
  \ sudo reboot\ndebian@beaglebone:~$ uname -a\nLinux beaglebone 4.9.88-ti-r111 #1\
  \ SMP PREEMPT Sun Apr 22 2018 armv7l GNU/Linux \n```\n\n重启开发板后，可以看到版本号已更新（本例中从 102\
  \ 更新到 111）。你也可以使用此工具从之前显示的选项中选择特定的内核。示例如下：\n\n```\n/opt/scripts/tools$ sudo ./update_kernel.sh\
  \ --ti-rt-channel --lts-4_14\n/opt/scripts/tools$ sudo reboot\ndebian@beaglebone:~$\
  \ uname -a\nLinux beaglebone 4.14.35-ti-rt-r44 #1 SMP PREEMPT RT Sun Apr 22 06:04:23\
  \ \n```\n\n### 与板载 LED 交互\n\n在本节中，你将学习如何更改 Beagle 板载用户 LED（即板上成组排列的四个蓝色 LED）的行为。每个\
  \ LED 都可以提供关于板子状态的信息。\n\n*   USR0 以心跳序列闪烁，表示板子处于活动状态。\n*   USR1 在 micro-SD 卡活动时闪烁。\n\
  *   USR2 根据 CPU 活动级别闪烁。\n*   USR3 在 eMMC 活动时闪烁（在 PocketBeagle 上默认设置为无操作）。\n\n你可以根据自己的需要更改这些\
  \ LED 的行为，但会暂时丢失这些有用的活动信息。\n\nSysfs 是一个虚拟文件系统，在较新的 Linux 内核中可用。它让你能够访问设备和驱动程序，而这些原本只能在受限的内核空间内访问。这个话题将在第\
  \ 6 章中详细讨论；不过，在此处简要探讨一下如何使用 sysfs 改变用户 LED 的行为机制会很有帮助。\n\n使用你的 SSH 客户端，连接到开发板并浏览到目录\
  \ `/sys/class/leds/`。输出如下：\n\n```\ndebian@beaglebone:~$ cd /sys/class/leds\ndebian@beaglebone:/sys/class/leds$\
  \ ls\nbeaglebone:green:usr0  beaglebone:green:usr2\nbeaglebone:green:usr1  beaglebone:green:usr3\
  \ \n```\n\n你可以看到四个（绿色！）LED 的 sysfs 映射——`usr0`、`usr1`、`usr2` 和 `usr3`。你可以切换目录来更改其中一个\
  \ LED 的属性——例如 `usr3`（使用 Tab 键减少输入）。\n\n```\ndebian@beaglebone:/sys/class/leds$ cd\
  \ beaglebone\\:green\\:usr3\ndebian@beaglebone:/sys/class/leds/beaglebone:green:usr3$\
  \ ls\nbrightness  device  max_brightness  power  subsystem  trigger  uevent \n```\n\
  \n这里你可以看到各种不同的文件条目，它们提供了更多信息并允许访问设置。请注意，本节使用了一些将在下一章详细解释的命令。\n\n你可以通过输入以下命令来确定 LED\
  \ 的当前状态：\n\n```\n/sys/class/leds/beaglebone:green:usr3$ cat trigger\n[none] rc-feedback\
  \ rfkill-any kbd-scrolllock kbd-numlock kbd-capslock \nkbd-kanalock kbd-shiftlock\
  \ kbd-altgrlock kbd-ctrllock kbd-altlock \nkbd-shiftllock kbd-shiftrlock kbd-ctrlllock\
  \ kbd-ctrlrlock usb-gadget \nusb-host mmc0 timer oneshot disk-activity ide-disk\
  \ mtd nand-disk \nheartbeat backlight gpio default-on panic \n```\n\n在这里你可以看到 USR3\
  \ LED 当前未配置任何特定功能（即 `[none]`）。如果你的板子上它恰好被配置了，你可以将其设置为 none，如下所示：\n\n```\n/sys/class/leds/beaglebone:green:usr3$\
  \ echo none > trigger \n```\n\n你可以使用以下命令完全打开或关闭 USR3 LED：\n\n```\n/sys/class/leds/beaglebone:green:usr3$\
  \ echo 1 > brightness\n/sys/class/leds/beaglebone:green:usr3$ echo 0 > brightness\
  \ \n```\n\n你甚至可以设置 LED 以你选择的时间间隔闪烁。如果仔细观察，你会注意到 sysfs 的动态特性。如果此时执行 `ls` 命令，目录将显示如下，但很快就会改变：\n\
  \n```\n/sys/class/leds/beaglebone:green:usr3$ ls\nbrightness  device  max_brightness\
  \  power  subsystem  trigger  uevent \n```\n\n要使 LED 闪烁，你需要将触发器设置为定时器模式，输入 `echo\
  \ timer > trigger`。你会看到 USR3 LED 以一秒的间隔闪烁。注意，在 `beaglebone:green:usr3` 目录中出现了新的\
  \ `delay_on` 和 `delay_off` 文件条目，如下所示：\n\n```\n/sys/class/leds/beaglebone:green:usr3$\
  \ echo timer > trigger\n/sys/class/leds/beaglebone:green:usr3$ ls\nbrightness  delay_on\
  \  max_brightness  subsystem  uevent\ndelay_off   device    power           trigger\
  \ \n```\n\nLED 闪烁定时器使用了这些新的 `delay_on` 时间和 `delay_off` 时间文件条目。你可以使用连接（catenate）命令来获取关于这些值的更多信息。示例如下：\n\
  \n```\n/sys/class/leds/beaglebone:green:usr3$ cat delay_on\n500 \n```\n\n这报告了以毫秒为单位的时间延迟。要使\
  \ USR3 LED 以 10 Hz 的频率闪烁（即亮 50 ms，灭 50 ms），你可以使用以下命令：\n\n```\ndebian@beaglebone:/sys/class/leds/beaglebone:green:usr3$\
  \ sudo -i\nroot@beaglebone:~# cd /sys/class/leds/beaglebone\\:green\\:usr3\nroot@beaglebone:/sys/class/leds/beaglebone:green:usr3#\
  \ echo 50 > delay_on\nroot@beaglebone:/sys/class/leds/beaglebone:green:usr3# echo\
  \ 50 > delay_off \n```\n\n你需要使用 root 账户来执行上述操作，因为 `delay_on` 和 `delay_off` 条目归 `root`\
  \ 所有。\n\n```\nroot@beaglebone:/sys/class/leds/beaglebone:green:usr3# ls -l delay*\n\
  -rw-r--r-- 1 root root 4096 Apr 24 02:08 delay_off\n-rw-r--r-- 1 root root 4096\
  \ Apr 24 02:07 delay_on \n```\n\n输入 `echo none > trigger` 会将 LED 恢复到 PocketBeagle\
  \ 上的默认状态，这会导致 `delay_on` 和 `delay_off` 文件条目消失。\n\n### 关机\n\n本节要讨论的最后一个问题是开发板的正确关机步骤，因为不正确的关机可能会损坏\
  \ ext4 文件系统，和/或由于文件系统检查而导致启动时间变长。以下是关于关机、重启和启动开发板的一些重要要点：\n\n*   输入 `sudo shutdown\
  \ -h now` 可以正确关闭开发板。你可以通过输入 `sudo shutdown -h +5` 将关机延迟五分钟。\n*   输入 `sudo reboot`\
  \ 将正确重置并重启开发板。\n*   你可以按一次电源按钮（参见图 1-4 和图 1-5）来“软”（即软件方式）正确关闭开发板。\n\n\n\n\n\n* \
  \  按住电源按钮约八秒钟可执行硬系统关机。除非主板死机且无法执行软关机，否则应避免此操作。\n\n*   按下电源按钮启动主板。尽量避免物理断开和重新连接电源插头或\
  \ USB 线。\n\n如果您的项目设计是封闭的，并且需要外部软关机，可以将外部按钮连接到扩展接头上的 GPIO 输入，并编写一个在启动时运行的 shell 脚本，用于轮询\
  \ GPIO 输入。如果检测到该输入，则可以直接调用`/sbin/shutdown -h now`。\n\n## Node.js、Cloud9 和 BoneScript\n\
  \n[BeagleBoard.org](http://BeagleBoard.org) Linux 发行版附带了一套技术，您可以使用这些技术快速开始在板上开发软件和硬件应用程序。这些技术包括\
  \ Node.js、Cloud9 和 BoneScript——*Node.js* 是一种编程语言，*Cloud9* 是一个在线软件集成开发环境（IDE），您可以在其中编写\
  \ Node.js 代码，而 *BoneScript* 是 Node.js 的一个代码库，允许您与 Beagle 板硬件进行交互。\n\n### Node.js\
  \ 简介\n\nNode.js 是一个用于构建网络应用的平台，它使用与 Google Chrome 网络浏览器相同的 JavaScript 引擎。JavaScript\
  \ 是一种常用于在网页中创建交互界面的编程语言。简单来说，Node.js 是服务器端的 JavaScript。其运行时环境和代码库使您无需浏览器，直接在 Linux\
  \ shell 提示符下运行 JavaScript 代码应用程序。\n\nNode.js 采用事件驱动、非阻塞输入/输出模型。事件驱动编程在用户界面编程中很常见。它本质上意味着程序的执行流程由用户操作或从其他线程/进程传递的消息驱动。有趣的是，它使用非阻塞\
  \ I/O，这意味着它适合与板上的输入/输出引脚接口，并与其他应用程序安全地共享资源。与所有新语言一样，您应该从一个“Hello World!”示例开始。清单\
  \ 2-1 将字符串“Hello World!”发送到标准输出（通常是 Linux 终端）。\n\n```\nconsole.log(\"Hello World!\"\
  ); \n```\n\n**清单 2-1:** `/chp02/HelloWorld.js`\n\n打开与板的 SSH 连接，创建一个目录来存放 `HelloWorld.js`\
  \ 文件，然后使用 nano 输入清单 1 中的代码。\n\n```\ndebian@beaglebone:~$ cd ~/\ndebian@beaglebone:~$\
  \ mkdir nodeTest\ndebian@beaglebone:~$ cd nodeTest/\ndebian@beaglebone:~/nodeTest$\
  \ nano HelloWorld.js \n```\n\n要执行此代码，请在包含 JavaScript 文件的目录中键入 `node HelloWorld.js`。您应该看到以下输出：\n\
  \n```\ndebian@beaglebone:~/nodeTest$ ls\nHelloWorld.js\ndebian@beaglebone:~/nodeTest$\
  \ node HelloWorld.js\nHello World! \n```\n\n这应该能让您了解如何为板编写 Node.js 程序。`node` 命令之所以有效，是因为\
  \ Node.js 运行时环境已预装在 [BeagleBoard.org](http://BeagleBoard.org) Linux 镜像中。\n\n清单 2-2\
  \ 提供了一个更复杂的 Node.js 示例。它创建了一个在板上端口 5050 运行的 Web 服务器，并提供一个简单的“Hello World!”消息。将程序代码写入同一个\
  \ `/nodeTest` 目录。\n\n```\n// A Simple Example Node.js Webserver Running on Port\
  \ 5050\nvar http = require('http');  // require the http module\nvar server = http.createServer(\n\
  \    function(req,res) {\n        res.writeHead(200, {'Content-Type': 'text/plain'});\n\
  \        res.end('Hello from the Beagle board!\\n');\n    });\nserver.listen(5050);\
  \     \nconsole.log('Beagle Web Server running at http://192.168.7.2:5050/'); \n\
  ```\n\n**清单 2-2:** `/chp02/SimpleWebServer.js`\n\n清单 2-2 中的示例代码首先引入 Node.js 的 `http`\
  \ 模块。然后调用 `http.createServer()` 方法，该方法返回一个 `http.Server` 对象。在 `http.Server` 对象上调用\
  \ `server.listen()` 方法，使服务器接受指定端口号（即 5050）上的连接。此方法是异步的，意味着它不必在下一行调用 `console.log()`\
  \ 方法之前完成。实际上，除非您在板上终止该进程，否则 `server.listen()` 方法将一直监听。当与端口 5050 建立连接时，服务器将调用监听函数\
  \ `function(req,res)`，并向其传递 HTTP 请求和响应引用的副本。在此例中，该函数以一条简短的纯文本消息作为响应。\n\n要执行此程序，请在包含源代码文件的目录中键入\
  \ `node SimpleWebServer.js`，您应该得到以下结果：\n\n```\ndebian@beaglebone:~/nodeTest$ ls\n\
  HelloWorld.js  SimpleWebServer.js\ndebian@beaglebone:~/nodeTest$ node SimpleWebServer.js\n\
  Beagle Web Server running at http://192.168.7.2:5050/ \n```\n\n输出表明服务器正在运行并监听端口\
  \ 5050。然后您可以打开一个 Web 浏览器并连接到这个简单的 Node.js Web 服务器，您将看到输出，如图 2-10 所示。您可以在 SSH 窗口中使用\
  \ Ctrl+C 终止 Web 服务器。\n\n![显示 IP 地址选项卡中 192.168.7.2:5050 的窗口截图。](img/c02f010.jpg)\n\
  \n**图 2-10****:** 连接到 Node.js Web 服务器\n\n### Cloud9 IDE 简介\n\n如果有一种方法可以将 Node.js\
  \ 代码的开发与执行环境集成在一起，那岂不是很好？这正是 Cloud9 IDE 的用武之地。Cloud9 集成开发环境（IDE）是一个令人印象深刻的基于 Web\
  \ 的编码平台，支持多种编程语言，包括 JavaScript 和 Node.js。它使您能够直接在 Web 浏览器中编写、运行和调试代码，而无需安装任何特定于操作系统的工具或应用程序。如果这还不够令人印象深刻，那么\
  \ Cloud9 服务的开销足够低，可以直接在 Beagle 板上运行，并且它已预装在 [BeagleBoard.org](http://BeagleBoard.org)\
  \ Linux 镜像中。\n\n要使用 Cloud9 IDE，请打开 Google Chrome 或 Firefox，并通过端口 3000 连接到板的地址。例如，使用地址栏打开\
  \ 192.168.7.2:3000，如图 2-11 所示。当您首次打开 Cloud9 时，它会提供出色的用户界面和控件介绍。\n\n![窗口展示了 cloud9\
  \ – Cloud9 选项卡，IP 地址标记为 192.168.7.2:3000/ide.html，并显示了导航树中的文件夹列表。右下角是 192.168.7.2:5050\
  \ 选项卡的截图。](img/c02f011.jpg)\n\n**图 2-11****:** 在 PocketBeagle 上运行的 Cloud9 IDE，执行\
  \ SimpleWebServer.js 示例\n\nCloud9 界面无需在桌面计算机上编写代码再传输到板，它可以直接将文件保存到板的 Linux 文件系统中，甚至可以直接执行它们。在图\
  \ 2-11 中，创建了一个新的 `.js` 文件，其中包含清单 2-2 中的代码。*您必须通过“文件 → 保存”来保存文件*。您可以单击“运行”按钮来执行应用程序。如果出现调试器窗口，请单击“继续”。您可以单击输出控制台中的超链接，应用程序输出将显示在出现的浏览器窗口中，如图\
  \ 2-11 所示。\n\n请记住，这个 `SimpleWebServer.js` 程序是在 Beagle 板本身上运行的。实际上，如果您通过 SSH 登录到板（或使用\
  \ Cloud9 的 `bash` 终端窗口）并执行以下命令（在第 3 章中描述），您可以看到应用程序进程正在运行，如下所示：\n\n\n\n\n\n```\n\
  debian@beaglebone:~# ps aux|grep SimpleWebServer\ndebian 2157 0.3 2.2 … node … \"\
  /var/lib/cloud9/EBB/SimpleWebServer.js\" … \n```\n\n在 Cloud9 IDE 中点击“停止”按钮将终止此进程。\n\
  \n### BoneScript 简介\n\nBoneScript 是一个为 Beagle 特定功能编写的库，由 [BeagleBoard.org](http://BeagleBoard.org)\
  \ 联合创始人 Jason Kridner 为 Node.js 开发。BoneScript 库提供了 Arduino 用户熟悉的输入/输出功能，但其优势在于它基于\
  \ Beagle 平台上运行的 Node.js 的网络能力。有关 BoneScript 及其功能的详细描述，请访问 [`beagleboard.org/support/bonescript`](http://beagleboard.org/support/bonescript)。\n\
  \n你可以使用 BoneScript 构建一个简单的应用程序来改变系统 LED 的状态。清单 2-3 中的代码通过 BoneScript 库每秒闪烁一次板载 `USR3`\
  \ LED。\n\n```\nvar b = require('bonescript'); // 使用 BoneScript\nvar LED3Pin = \"\
  USR3\";          // USR3 是 Beagle 板上的 D5\n\nb.pinMode(LED3Pin, b.OUTPUT);  // 将\
  \ LED3Pin 设置为输出\nvar isOn = false;              // isOn 是一个布尔标志\nsetInterval(toggleLED,\
  \ 500);   // 每半秒调用一次 toggleLED()\n\nfunction toggleLED(){\n   isOn = !isOn;    \
  \          // 每次调用时反转 isOn 状态\n   if (isOn) b.digitalWrite(LED3Pin, 1);  // 点亮 LED\n\
  \   else b.digitalWrite(LED3Pin, 0);       // 关闭 LED\n   console.log('LED On is:\
  \ ' + isOn);     // 输出状态\n} \n```\n\n**清单 2-3:** /chp02/BlinkLED3.js\n\n该程序需要 `bonescript`\
  \ 模块，在代码中简称为 `b`——例如，通过使用 `b.someMethod()`。因此，`b.pinMode()` 使用字符串字面量 `\"USR3\"`\
  \ 来标识要设置为输出模式的引脚。一个临时布尔值 `isOn` 用于在代码中保留 LED 的状态。Node.js 的异步全局函数 `setInterval()`\
  \ 被设置为每 500 毫秒调用一次 `toggleLED()` 回调函数。每次调用 `toggleLED()` 函数时，使用 NOT 运算符（即 `!true=false`\
  \ 和 `!false=true`）反转 `isOn` 布尔变量。如果 `isOn` 为 true，则将 LED 引脚置为高电平；如果为 false，则置为低电平，并将状态输出到控制台。\n\
  \n该程序可以直接在 Cloud9 IDE 中执行。但重要的是要记住，你仍然可以在 Linux 终端提示符下直接运行包含 BoneScript 库调用的程序。因此，例如，在\
  \ Beagle 板上的 Cloud9 位置执行 `BlinkLED3.js` 代码（如图 2-12 所示）也能完美运行，每秒闪烁一次 `USR3` LED。\n\
  \n```\ndebian@beaglebone:/var/lib/cloud9/EBB$ ls\nBlinkLED3.js  SimpleWebServer.js\n\
  debian@beaglebone:/var/lib/cloud9/EBB$ node BlinkLED3.js\nLED On is: true\nLED On\
  \ is: false\nLED On is: true\nLED On is: false …\n```\n\n![展示 Cloud9 的窗口 – Cloud9\
  \ 标签页，IP 地址标注为 192.168.7.2:3000/ide.html，右侧面板显示导航树中的文件夹列表以及 BlinkLED3.js 代码。](img/c02f012.jpg)\n\
  \n**图 2-12****:** 在 PocketBeagle 上运行的 Cloud9 IDE，执行 BoneScript 的 BlinkLED3.js 示例\n\
  \nBoneScript 对于系统的快速原型设计非常有用，特别是当这些系统涉及需要连接到互联网的电子设备时。然而，它并不适合高性能的大规模应用——本书后续章节将介绍用于此类应用的替代语言和方法。\n\
  \n## 本章小结\n\n完成本章后，你应该能够做到以下几点：\n\n*   使用网络连接（例如通过 USB 的互联网和常规以太网）从桌面计算机与 Beagle\
  \ 板通信\n\n*   使用备用串行连接（例如通过 USB 的串行连接或使用自定义 USB 转 TTL 3.3V 线缆）与板子通信\n\n*   使用简单的\
  \ Linux 命令与板子交互并控制它\n\n*   使用 Linux 终端执行基本的文件编辑\n\n*   管理 Linux 软件包并设置系统时间\n\n*\
  \   使用 Linux sysfs 影响板子硬件的状态\n\n*   安全地关闭和重启板子\n\n*   使用 Node.js、Cloud9 和 BoneScript\
  \ 编写与板子硬件交互的基本应用程序和代码\n\n## 延伸阅读\n\n本章提供了许多网站和文档的链接。以下附加链接提供了所涵盖主题的更多信息：\n\n*  \
