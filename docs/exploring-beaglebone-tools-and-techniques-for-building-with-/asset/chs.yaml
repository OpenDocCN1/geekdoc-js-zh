  766.  766\n767.  767\n\n# 引言\n\nBeagle 平台总能带来惊喜！随着智能手机的普及，人们很容易将“手持一台每秒能执行 20 亿条指令的计算机”视为理所当然——但能够修改如此小巧而强大设备的硬件和软件，使其适应自身需求并创造自己的发明，这本身就是一件令人惊叹的事情。更棒的是，你只需花费\
  \ 25 美元，就能以`PocketBeagle`的形式购买到一块开发板。\n\nBeagle 板本身过于复杂，不适合普通用户直接使用；正是这些板卡运行 Linux\
  \ 的能力，使得最终平台变得易于访问、适应性强且功能强大。Linux 与嵌入式系统相结合，为设备开发提供了便利，这些设备能够应对智能建筑、物联网（IoT）、机器人技术、智慧能源、智慧城市、人机交互（HCI）、信息物理系统、3D\
  \ 打印、智能制造、交互艺术、先进车辆系统以及更多应用领域的未来挑战。\n\n高级 Linux 软件与低级电子技术的集成，代表了嵌入式系统开发中的一次范式转变。你可以构建一个低级电子电路，然后仅用几条简短命令安装\
  \ Linux 网络服务器，从而通过互联网控制该电路，这堪称革命性。你可以轻松地将 Beagle 板用作通用 Linux 计算机，但更富挑战性和趣味性的是深入其内部，将其与你自行设计的电子电路完全连接——而这正是本书的用武之地！\n\
  \n本书应能广泛吸引发明家、创客、学生、企业家、黑客、艺术家、梦想家——简而言之，任何希望将嵌入式 Linux 的强大功能融入其产品、发明、创作或项目，并真正深入了解\
  \ Beagle 平台细节的人。这不是一本菜谱书——除少数例外，本书中演示的所有内容都经过详细解释，使您能够设计、构建和调试自己对这些概念的扩展。本书末尾也没有任何需要您购买指定组件和外设才能实现特定结果的大型设计项目。相反，本书旨在为您提供足够的背景知识和“幕后”技术细节，以激发并支持您自己的探索。\n\
  \n我坚信“做中学”，因此我使用低成本、广泛可用的硬件来呈现示例，以便您能跟随实践。通过这些动手示例，我详细描述了每一步的含义，这样当您替换自己的硬件组件、模块和外设时，就能调整本书内容以满足您的需求。至于那个宏伟的项目或发明——那就留给您和您的想象力了！\n\
  \n在撰写本书时，我设定了以下目标和目的：\n\n*   解释嵌入式 Linux 及其与电子电路的交互——带您从神秘走向精通！\n\n*   提供关于 Linux、电子技术和编程技能的深入信息和指导，这些技能是掌握该领域广泛而全面主题所必需的。\n\
  \n*   为书中每个主题创建一套实用的“Hello World”硬件和软件示例，涵盖从低级接口、通用输入输出（GPIO）、模数转换器（ADC）、总线、UART，到高级库（如\
  \ OpenCV、Qt），以及复杂而强大的主题（如使用 PRU-ICSS 进行实时接口和 Linux 内核编程）。\n\n*   确保每个电路和代码段都专门设计用于\
  \ Beagle 板。本书中的每个电路和代码示例均在 BeagleBone Black wireless 和 PocketBeagle 板上构建并测试。\n\n\
  *   利用“Hello World”示例构建一个代码库，供您在自己的 Beagle 项目中直接使用或改编。\n\n*   将所有代码以易于使用的形式发布在 GitHub\
  \ 上。\n\n*   为本书提供强大的数字内容支持，例如 DerekMolloyDCU YouTube 频道上的视频，以及自定义网站 [`www.exploringbeaglebone.com`](http://www.exploringbeaglebone.com)。\n\
  \n*   确保在本书结束时，您已拥有想象、创建和构建*高级* Beagle 板项目所需的一切。\n\n我撰写第二版是因为第一版《探索 BeagleBone》广受欢迎。本版的页数比第一版增加了\
  \ 20%以上，新增内容包括以下主要部分：\n\n*   全面覆盖新型 Beagle 板，特别侧重于 PocketBeagle 和 BeagleBone Black\
  \ wireless 板\n\n*   更新内容以反映 Linux 内核和操作系统的最新变化\n\n*   包含电子接口方法，例如使用光耦保护 I/O 引脚、CAN\
  \ 总线，以及使用外部 I/O 电路的更多接口应用示例\n\n*   使用外部从处理器进行实时接口的新工作，特别侧重于构建 I²C 数字传感器\n\n*   全面介绍新的物联网（IoT）全栈框架，重点介绍\
  \ MQTT 和与 Adafruit IO 的接口\n\n*   全面覆盖使用 Wi-Fi、蓝牙、NFC 和 ZigBee 等技术构建无线传感器网络\n\n*\
  \   完全重写 PRU-ICSS 章节，以反映德州仪器决定从 UIO 转向 Linux Remoteproc\n\n*   包含编写 Linux 可加载内核模块（LKM）的新工作\n\
  \n## 为什么选择 BeagleBone 和 PocketBeagle？\n\nBeagle 板是功能强大的单板计算机（SBC），虽然市场上还有其他 SBC，例如\
  \ Raspberry Pi 和 Intel NUC 板，但 Beagle 平台有一个关键区别——它生来就是为了被连接！例如，Beagle 板的微处理器封装甚至包含两个额外的片上微控制器，可用于实时接口——这是其他\
  \ Linux SBC 难以企及的领域。\n\n与大多数其他 SBC 不同，Beagle 板是完全开源硬件的。[BeagleBoard.org](http://BeagleBoard.org)\
  \ 基金会提供原理图源文件、硬件布局、完整的物料清单以及全面的技术参考手册，使您能够修改 Beagle 平台的设计并将其集成到自己的产品中。事实上，您甚至可以在\
  \ Upverter（[`www.upverter.com`](http://www.upverter.com)）上以知识共享-署名-相同方式共享许可协议（参见\
  \ [`tiny.cc/beagle001`](http://tiny.cc/beagle001) 获取完整原理图）分支硬件设计。如果您决定将最新发明推向市场，这将是一个有用的功能！\n\
  \n## 本书结构\n\n\n\n\n毫无疑问，本书中的一些主题相当复杂——Beagle 板本身就是复杂的设备！不过，你掌握这些设备所需的一切内容都包含在本书的三个主要部分中。\n\
  \n*   第一部分，“Beagle 板基础”\n*   第二部分，“接口、控制与通信”\n*   第三部分，“高级 Beagle 板系统”\n\n在本书的第一部分中，你将在第\
  \ 1 章和第 2 章中了解 Beagle 板平台的硬件和软件，随后通过以下三个入门章节获得更多知识：\n\n*   第 3 章，“探索嵌入式 Linux 系统”\n\
  *   第 4 章，“电子接口”\n*   第 5 章，“实用 Beagle 板编程”\n\n如果你是 Linux 专家、电子高手和/或软件大师，那么可以跳过这些入门章节；但对于其他人来说，你将找到一套简洁而详细的材料，确保你获得有效且安全地连接\
  \ Beagle 板所需的所有知识。\n\n本书的第二部分，第 6 章至第 10 章，提供了关于 Beagle 板 GPIO、模拟输入、总线（I²C、SPI、CAN\
  \ 总线）、UART 设备、USB 外设以及与从处理器实时接口的详细信息。你将学习如何配置交叉编译环境，以便构建大规模软件应用程序。这部分还描述了如何将硬件和软件结合起来，使你的板能够有效地与其物理环境进行交互。\n\
  \n本书的最后一部分，第 11 章至第 16 章，描述了 Beagle 板如何用于高级应用，例如物联网（IoT）；丰富的用户界面；图像、视频和音频；使用 PRU-ICSS\
  \ 进行实时接口；以及内核编程。在此过程中，你将接触到许多技术，包括 TCP/IP、ThingSpeak、Adafruit IO、PoE、Wi-Fi、蓝牙、Zigbee、RFID、MQTT、cron、Apache、PHP、电子邮件、IFTTT、VNC、GTK+、Qt、XML、JSON、多线程、客户端/服务器编程、V4L2、视频流、OpenCV、Boost、USB\
  \ 音频、蓝牙 A2DP、文本转语音和 Remoteproc。\n\n## 本书使用的约定\n\n本书包含大量源代码示例和片段，你可以用来构建自己的应用程序。代码和命令显示如下：\n\
  \n```\n这就是源代码的样子。\n```\n\n当在 Linux 终端中展示操作时，通常需要在单个示例中同时显示输入和输出。使用粗体来区分用户输入和输出。示例如下：\n\
