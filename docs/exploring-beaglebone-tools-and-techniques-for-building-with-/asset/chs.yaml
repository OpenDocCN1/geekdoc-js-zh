  \ PM: Cannot get wkup_m3_ipc handle\nrootfs: clean, 82338/239520 files, 481317/957440\
  \ blocks\n\nDebian GNU/Linux 9 beaglebone ttyS0\nBeagleBoard.org Debian Image 2018-03-05\n\
  Support/FAQ: http://elinux.org/Beagleboard:BeagleBoneBlack_Debian\ndefault username:password\
  \ is [debian:temppwd]\nbeaglebone login: \n```\n\n你可以看到初始硬件状态已设置，但大多数条目目前看起来相当神秘。以下是一些需要注意的重要点（如上述输出片段中突出显示的）：\n\
  \n*   首先加载 U-Boot SPL 第一阶段引导加载程序。\n\n*   接下来加载 U-Boot 第二阶段引导加载程序，然后提供完整的硬件描述。\n\n\
  *   检查 GPIO 以确定是从 eMMC 还是 SD 卡启动（例如，检查启动按钮是否按下）。\n\n*   加载并解析配置文件 `/boot/uEnv.txt`。\n\
  \n*   加载 Linux 内核版本（例如 `4.9.82-ti-r102`）。\n\n*   U-Boot 加载 U-Boot 叠加层以配置硬件（例如 HDMI、模数转换器）。\n\
  \n*   内核开始执行。\n\n\n\n\nBeagle 板的主配置文件是 `/boot/uEnv.txt`。你可以手动编辑此文件（例如，`sudo nano\
  \ /boot/uEnv.txt`），通过注释和取消注释行来启用/禁用硬件、提供 Linux 命令行参数以及使用 eMMC 烧录脚本。例如，下面是一个精简的配置文件：\n\
  \n```\ndebian@ebb:/boot$ more uEnv.txt\n#Docs: http://elinux.org/Beagleboard:U-boot_partitioning_layout_2.0\n\
  ###Master Enable\nenable_uboot_overlays=1\n\n###Custom Cape\n#dtb_overlay=/lib/firmware/<file8>.dtbo\n\
  ###\n###Disable auto loading of virtual capes (emmc/video/wireless/adc)\n#disable_uboot_overlay_emmc=1\n\
  #disable_uboot_overlay_video=1\n#disable_uboot_overlay_audio=1\n#disable_uboot_overlay_wireless=1\n\
  #disable_uboot_overlay_adc=1\n\n###Cape Universal Enable\nenable_uboot_cape_universal=1\n\
  \ncmdline=coherent_pool=1M net.ifnames=0 quiet\n\n##enable Generic eMMC Flasher:\n\
  ##make sure, these tools are installed: dosfstools rsync\n#cmdline=init=/opt/scripts/tools/eMMC/init-eMMC-flasher-v3.sh\
  \ \n```\n\n移除文件中最后一行的注释，即可调用一个脚本，用 SD 卡上的 Linux 镜像覆盖 BeagleBone 的 eMMC。\n\nDas U-Boot\
  \ 使用一个称为*设备树*（也称为*设备树二进制文件*）的板级配置文件，其中包含内核启动该板所需的板级特定信息。该文件包含了描述内存大小、时钟速度、板载设备等所有必要信息。这个设备树二进制文件（DTB），即*二进制文件*，是通过*设备树编译器*（`dtc`）从\
  \ DTS（源文件）创建的。该主题在第 6 章中详细描述，届时将探讨如何与 Beagle 板的 GPIO 进行接口。\n\n```\ndebian@ebb:/boot/dtbs/4.9.82-ti-r102$\
  \ ls -l *.dtb\n…\n-rw-r--r-- 1 root root  64035 Feb 22 01:26 am335x-boneblack.dtb\n\
  -rw-r--r-- 1 root root  66633 Feb 22 01:26 am335x-boneblack-wireless.dtb\n-rw-r--r--\
  \ 1 root root 137415 Feb 22 01:26 am335x-boneblue.dtb\n-rw-r--r-- 1 root root  61710\
  \ Feb 22 01:26 am335x-bonegreen.dtb\n…\n-rw-r--r-- 1 root root 132769 Feb 22 01:26\
  \ am335x-pocketbeagle.dtb\n… \n```\n\nDTS 的语法与以下摘录相同，其中详细说明了 BBB 上的四个用户 LED 引脚和两个\
  \ I²C 总线之一：\n\n```\nam33xx_pinmux: pinmux@44e10800 {\n   pinctrl-names = \"default\"\
  ;\n   pinctrl-0 = <&userled_pins>;\n\n   userled_pins: pinmux_userled_pins {\n \
  \     pinctrl-single,pins = <\n         0x54 0x07       /* gpmc_a5.gpio1_21, OUTPUT\
  \        | MODE7 */\n         0x58 0x17       /* gpmc_a6.gpio1_22, OUTPUT_PULLUP\
  \ | MODE7 */\n         0x5c 0x07       /* gpmc_a7.gpio1_23, OUTPUT        | MODE7\
  \ */\n         0x60 0x17       /* gpmc_a8.gpio1_24, OUTPUT_PULLUP | MODE7 */\n \
  \     >;\n    };\n    i2c0_pins: pinmux_i2c0_pins {\n       pinctrl-single,pins\
  \ = <\n          0x188 0x70      /* i2c0_sda, SLEWCTRL_SLOW | INPUT_PULLUP */\n\
  \          0x18c 0x70      /* i2c0_scl, SLEWCTRL_SLOW | INPUT_PULLUP */\n      \
  \ >;\n    }; …\n}; \n```\n\nLinux 4.*x*.*x* 的设备树源文件的完整描述可在本书的源代码发行版中的第 3 章目录中找到。你将在本章末尾看到如何下载此代码。该树结构将在第\
  \ 6 章中详细讨论，届时将把自定义电路与 Beagle 板进行接口。\n\n#### *内核空间与用户空间*\n\nLinux 内核运行在系统内存中称为*内核空间*的区域，而普通用户应用程序运行在系统内存中称为*用户空间*的区域。这两个空间之间的硬边界防止用户应用程序访问\
  \ Linux 内核所需的内存和资源。这有助于防止因编写不良的用户代码而导致 Linux 内核崩溃；同时，由于它阻止属于一个用户的应用程序干扰属于另一个用户的应用程序和资源，因此也提供了一定程度的安全性。\n\
  \nLinux 内核“拥有”并完全访问 Beagle 板上的所有物理内存和资源。因此，必须小心，只允许最稳定和最受信任的代码在内核空间中运行。你可以在图 3-2\
  \ 中看到架构和接口的图示，其中用户应用程序使用 GNU C 库（`glibc`）向内核的系统调用接口发出调用。然后，通过系统调用以受控的方式将内核服务提供给用户空间。\n\
  \n![标有“用户空间”（顶部）和“内核空间”（中间）的方框由双箭头连接，另一个双箭头连接内核空间和标有“物理硬件”（底部）的方框。](img/c03f002.jpg)\n\
  \n**图 3-2****：** Linux 用户空间和内核空间架构\n\n*内核模块*是一个包含二进制代码的目标文件，可以根据需要从内核中加载和卸载。在许多情况下，内核甚至可以在执行过程中加载和卸载模块，而无需重启板子。例如，如果你将\
  \ USB Wi-Fi 适配器插入板子，内核可以使用可加载内核模块（LKM）来利用该适配器。如果没有这种模块化能力，Linux 内核将变得极其庞大，因为它必须支持任何\
  \ Beagle 板上可能需要的所有驱动程序。而且，每次添加新硬件时，都必须重新构建内核。LKM 的一个缺点是必须为每个设备维护驱动程序文件。（本书通篇描述了与\
  \ LKM 的交互，你将在第 16 章中看到如何编写自己的 LKM。）\n\n如图 3-1 所述，引导加载程序阶段在内核被解压缩到内存后，将控制权传递给内核。然后内核挂载根文件系统。内核在引导过程中的最后一步是调用\
  \ `systemd init`（在带有 Debian Stretch 镜像的 Beagle 板上为 `/sbin/init`），这是启动的第一个用户空间进程，也是接下来要讨论的主题。\n\
  \n#### *systemd 系统与服务管理器*\n\n*系统与服务管理器*根据板子的当前状态（例如，启动、关闭）启动和停止服务（例如，Web 服务器、安全外壳\
  \ [SSH] 服务器）。*systemd* 系统与服务管理器是 Linux 中一个较新且有些争议的补充，旨在取代 System V（SysV）init 并保持向后兼容。SysV\
  \ init 的一个主要缺点是它串行启动任务，等待一个任务完成后再开始下一个，这可能导致较长的启动时间。systemd 系统在 Debian 9（Stretch）中默认启用。它并行启动系统服务，有助于缩短启动时间，尤其是在多核处理器（如\
  \ BeagleBoard X15）上。实际上，你可以使用以下命令显示启动时间（你可能会在用户空间进程完成之前就能登录）：\n\n```\ndebian@beaglebone:~$\
  \ systemctl --version\nsystemd 232 +PAM +AUDIT +SELINUX +IMA +APPARMOR +SMACK +SYSVINIT\n\
  +UTMP +LIBCRYPTSETUP +GCRYPT +GNUTLS +ACL +XZ +LZ4 +SECCOMP +BLKID\n+ELFUTILS +KMOD\
  \ +IDN\ndebian@beaglebone:~$ systemd-analyze time\nStartup finished in 15.638s (kernel)\
  \ + 45.405s (userspace) = 1min 1.044s \n```\n\n除了作为系统与服务管理器之外，systemd 还包含一个用于登录管理、日志记录、设备管理、时间同步等的软件包。systemd\
  \ 的批评者声称其开发项目遭受了“任务蔓延”，并且承担了超出其核心使命的开发工作。在某种程度上，这种使命的变化导致 systemd 成为 Linux 本身未来的核心，甚至可能剥夺了用户的选择权；然而，很明显\
  \ systemd 正被许多 Linux 发行版广泛采用，并且会继续存在。\n\n\n\n\n你可以使用 `systemctl` 命令来检查和控制 systemd\
  \ 的状态。如果不带参数调用，它会列出你板子上正在运行的所有服务（典型板子上可能有 100 多个服务在运行）。使用空格键翻页，使用 Q 键退出。\n\n```\n\
  debian@beaglebone:~$ systemctl\nUNIT                        LOAD   ACTIVE SUB  \
  \     DESCRIPTION\n-.mount                     loaded active mounted   Root Mount\n\
  apache2.service             loaded active running   The Apache HTTP Server\nbonescript-autorun.service\
  \  loaded active running   Bonescript autorun\nconnman.service             loaded\
  \ active running   Connection service\ncron.service                loaded active\
  \ running   Regular background …\ngetty@tty1.service          loaded active running\
  \   Getty on tty1\nserial-getty@ttyGS0.service loaded active running   Serial Getty\
  \ on ttyGS0\nserial-getty@ttyS0.service  loaded active running   Serial Getty on\
  \ ttyS0\nssh.service                 loaded active running   OpenBSD Secure Shell\n\
  … \n```\n\nsystemd 使用*服务文件*，这些文件带有 `.service` 扩展名，用于配置不同服务在启动、关闭、重载等时的行为；请参见 `/lib/systemd/system`\
  \ 目录。\n\nApache 服务在安装后默认运行。可以使用 systemd 系统来管理板子上的此类服务。例如，你可以通过以下步骤识别确切的服务名称并获取其状态：\n\
  \n```\ndebian@beaglebone:~$ systemctl list-units -t service | grep apache\napache2.service\
  \    loaded active running The Apache HTTP Server\ndebian@beaglebone:~$ systemctl\
  \ status apache2.service\n• apache2.service - The Apache HTTP Server\n   Loaded:\
  \ loaded (/lib/systemd/system/apache2.service; enabled; …\n   Active: active (running)\
  \ since Wed 2018-05-02 16:04:32 IST; 1h 41min ago\n  Process: 1029 ExecStart=/usr/sbin/apachectl\
  \ start\n Main PID: 1117 (apache2)\n    Tasks: 55 (limit: 4915)\n   CGroup: /system.slice/apache2.service\n\
  \           └_1117 /usr/sbin/apache2 -k start\n           └_1120 /usr/sbin/apache2\
  \ -k start\n           └_1122 /usr/sbin/apache2 -k start\nMay 02 16:04:28 beaglebone\
  \ systemd[1]: Starting The Apache HTTP Server…\nMay 02 16:04:32 beaglebone systemd[1]:\
  \ Started The Apache HTTP Server. \n```\n\n此时，你可以使用 Web 浏览器连接到板子的 8080 端口，验证 Apache\
  \ 服务器是否作为服务在板子上运行，如图 3-3 所示。\n\n![Beagle 板上运行的 Apache 服务器，窗口显示 Index of/ 标签页，IP\
  \ 地址标记为 192.168.7.2:8080。下方列出了名称、最后修改时间、大小和描述。](img/c03f003.jpg)\n\n**图 3-3****：**\
  \ Beagle 板上运行的 Apache 服务器\n\n你可以使用 `systemctl` 命令停止 `apache2` 服务，之后浏览器将显示“连接被拒绝”的消息。\n\
  \n```\ndebian@beaglebone:~$ sudo systemctl stop apache2\n[sudo] password for debian:\n\
  debian@beaglebone:~$ systemctl status apache2\n• apache2.service - The Apache HTTP\
  \ Server\n   Loaded: loaded (/lib/systemd/system/apache2.service; enabled; …\n \
  \  Active: inactive (dead) since Wed 2018-05-02 17:51:12 IST; 17s ago\n  Process:\
  \ 1969 ExecStop=/usr/sbin/apachectl stop\n  Process: 1029 ExecStart=/usr/sbin/apachectl\
  \ start\n Main PID: 1117 (code=exited, status=0/SUCCESS) \n```\n\n然后可以按如下方式重新启动服务：\n\
  \n```\ndebian@beaglebone:~$ sudo systemctl start apache2 \n```\n\n表 3-1 总结了 systemd\
  \ 命令，以 `apache2` 服务作为语法示例。其中许多命令需要使用 `sudo` 工具提升到超级用户权限，如下一节所述。\n\n| **命令** | **描述**\
  \ |\n| --- | --- |\n| `systemctl` | 列出所有正在运行的服务。 |\n| `systemctl start apache2`\
  \ | 启动一个服务。重启后不持久。 |\n| `systemctl stop apache2` | 停止一个服务。重启后不持久。 |\n| `systemctl\
  \ status apache2` | 显示服务状态。 |\n| `systemctl enable apache2` | 启用一个服务，使其在启动时运行。 |\n\
  | `systemctl disable apache2` | 禁用一个服务，使其不在启动时运行。 |\n| `systemctl is-enabled apache2`\
  \ | 显示系统服务是否在启动时运行。 |\n| `systemctl restart apache2` | 重启一个服务（先停止再启动）。 |\n| `systemctl\
  \ condrestart apache2` | 仅当服务正在运行时重启它。 |\n| `systemctl reload apache2` | 重新加载服务的配置文件而不停止它。\
  \ |\n| `journalctl –f` | 跟踪 systemd 日志文件。按 Ctrl+C 退出。 |\n| `sudo hostnamectl --static\
  \ set-hostname ebb` | 更改主机名。 |\n| `hostname` | 显示主机名。 |\n| `timedatectl` | 显示时间和时区信息。\
  \ |\n| `systemd-analyze time` | 显示启动时间。 |\n\n**表 3-1****：** 常用 systemd 命令\n\n*运行级别*描述了板子的当前状态，可用于控制\
  \ `init` 系统启动哪些进程或服务。在 SysV 下，有不同的运行级别，标识为 `0`（停机）、`1`（单用户模式）、`2` 到 `5`（多用户模式）、`6`（重启）和\
  \ `S`（启动）。当 `init` 进程开始时，运行级别从 `N`（无）开始。然后进入运行级别 `S` 以单用户模式初始化系统，最后进入一个多用户运行级别（`2`\
  \ 到 `5`）。要确定当前运行级别，请键入以下命令：\n\n```\ndebian@beaglebone:~$ who -r\n         run-level\
  \ 5  2018-05-02 16:05 \n```\n\n在这种情况下，板子运行在运行级别 `5`。你可以通过键入 `init` 后跟级别编号来更改运行级别。例如，你可以通过键入以下命令重启板子：\n\
  \n```\ndebian@beaglebone:~$ sudo hostnamectl --static set-hostname ebb\ndebian@beaglebone:~$\
  \ hostname\nebb \n```\n\n另外，编辑 `/etc/hosts` 文件，为 `ebb` 添加一个条目，否则在使用 `sudo` 命令时会收到“无法解析主机”的消息。\n\
  \n```\ndebian@beaglebone:~$ more /etc/hosts\n127.0.0.1       localhost\n127.0.1.1\
  \       beaglebone.localdomain  beaglebone  ebb\n…\ndebian@beaglebone:~$ sudo init\
  \ 6\n```\n\n如上所示，systemd 保留了与 SysV 运行级别及其编号的一些向后兼容性，因为之前的 SysV 命令在 systemd 下也能正常工作。然而，在\
  \ systemd 中使用运行级别被认为是一种过时的做法。相反，systemd 使用命名的*目标单元*，其中一些列在表 3-2 中，该表还包含了与 SysV 运行级别的指示性对应关系。你可以识别板子上的当前默认目标。\n\
  \n```\ndebian@ebb:~$ systemctl get-default\ngraphical.target \n```\n\n| **目标名称**\
  \ | **SysV** | **描述和示例用途** |\n| --- | --- | --- |\n| `poweroff.target` | 0 | 停止系统：所有服务进入关机状态\
  \ |\n| `rescue.target` | 1,S | 单用户模式：用于管理功能，如检查文件系统 |\n| `multi-user.target` | 2-4\
  \ | 常规多用户模式，无窗口显示 |\n| `graphical.target` | 5 | 常规多用户模式，带窗口显示 |\n| `reboot.target`\
  \ | 6 | 重启系统：所有服务进入重启状态 |\n| `emergency.target` | — | 仅在主控制台上提供紧急 shell |\n\n**表\
  \ 3-2****：** systemd 目标与 SysV 运行级别的对应关系\n\n这表明当前配置是让板子具有带窗口的显示。你还可以通过以下命令查看目标加载的单元列表：\n\
  \n\n\n\n\n```\ndebian@ebb:~$ systemctl list-units --type=target\nUNIT          \
  \        LOAD   ACTIVE SUB     DESCRIPTION\nbasic.target          loaded active\
  \ active  Basic System\ncryptsetup.target     loaded active active  Encrypted Volumes\n\
  getty.target          loaded active active  Login Prompts\ngraphical.target    \
  \  loaded active active  Graphical Interface\nlocal-fs-pre.target   loaded active\
  \ active  Local File Systems (Pre)\nlocal-fs.target       loaded active active \
  \ Local File Systems\nmulti-user.target     loaded active active  Multi-User System\n\
  … \n```\n\n如果你将开发板用作没有连接显示器的网络连接设备（即无头设备），那么运行窗口服务会浪费 CPU/内存资源。² 你可以通过以下调用切换到无头目标，此时\
  \ LXQt 窗口界面将不再存在，并且 `graphical.target` 条目将不再出现在单元列表中。\n\n```\ndebian@ebb:~$ sudo\
  \ systemctl isolate multi-user.target\ndebian@ebb:~$ who -r\n         run-level\
  \ 3  2018-05-02 16:18      last=5 \n```\n\n并且，你可以使用以下命令重新启用带显示器的图形界面：\n\n```\ndebian@ebb:~$\
  \ sudo systemctl isolate graphical.target\ndebian@ebb:~$ who -r\n         run-level\
  \ 5  2018-05-02 16:20      last=3 \n```\n\n最后，要设置开发板在启动时使用不同的默认运行级别（例如，用于无头显示），你可以使用以下命令：\n\
  \n```\ndebian@ebb:~$ sudo systemctl set-default multi-user.target\nCreated symlink\
  \ /etc/systemd/system/default.target →\n/lib/systemd/system/multi-user.target.\n\
  debian@ebb:~$ systemctl get-default\nmulti-user.target \n```\n\n重启后，窗口服务（如果存在）不会启动，并且对应的\
  \ SysV 运行级别显示为运行级别 `3`。\n\n## 管理 Linux 系统\n\n在本节中，你将基于第 2 章中描述的命令和工具，更详细地研究 Linux\
  \ 文件系统，以确保你对开发板拥有完全的管理控制权。\n\n### 超级用户\n\n在 Linux 系统上，系统管理员账户对所有命令和文件拥有最高级别的安全访问权限。通常，这个账户被称为\
  \ *root 账户* 或 *超级用户*。在 Debian 中，该用户账户的用户名为 `root`，但默认情况下通常是禁用的；不过，你可以通过从已登录 debian\
  \ 用户账户（用户名：`debian`，密码：`temppwd`）的 shell 中键入 `sudo passwd root` 来启用它。\n\n```\ndebian@ebb:~$\
  \ sudo passwd root\nEnter new UNIX password: myrootpassword\nRetype new UNIX password:\
  \ myrootpassword\npasswd: password updated successfully \n```\n\n建议在 Linux 系统上执行常规操作时，尽量避免以超级用户身份登录；但也要记住，在使用嵌入式\
  \ Linux 系统时，通常不会运行拥有数千个用户账户的服务器！在许多应用中，一个使用非默认密码的单一 root 用户账户可能就足够了。然而，使用非超级用户账户进行开发工作可以保护你免受自身误操作的影响——例如，意外删除文件系统。Debian\
  \ 中的 debian 用户账户经过精心配置，以简化与硬件的交互，使其能够用于本书中描述的大多数任务。然而，了解这个自定义用户账户是如何配置的以及它为何能如此良好地工作是很重要的。\n\
  \n在许多 Linux 发行版（包括 Debian）中，当你想要执行系统管理命令时，会使用一个名为 `sudo`（*超级用户执行*）的特殊工具。通常，该工具会提示你输入管理员密码，然后授权你在短时间内执行管理员操作，同时也会警告你“能力越大，责任越大”。Debian\
  \ 中的 debian 用户账户已配置为需要输入密码才能提升为超级用户。\n\n下一节将讨论用户账户管理，但如果你创建了一个新用户账户并希望使其能够使用 `sudo`\
  \ 工具，则必须使用 `visudo` 工具（以 root 身份登录时键入 `visudo`，或以 debian 身份登录时键入 `sudo visudo`）将该账户名称添加到\
  \ *sudoers 文件* `/etc/sudoers` 中。`/etc/sudoers` 文件的最后几行提供了 debian 用户账户的配置（使用 # 符号注释掉的行）。它通过设置一个名为\
  \ sudo 的组的属性来实现，而用户 debian 是该组的成员：\n\n```\ndebian@ebb:~$ sudo more /etc/sudoers\n\
  # User privilege specification\nroot      ALL=(ALL:ALL) ALL\n# Allow members of\
  \ group sudo to execute any command\n%sudo     ALL=(ALL:ALL) ALL   … \n```\n\n在此配置中，sudo\
  \ 组中的任何用户都被授予在所有（第一个 `ALL`）主机名上以任何用户（第二个 `ALL`）身份执行任何命令（第三个 `ALL`）的权限。`sudo` 工具运行良好，但它会使命令输出的重定向变得更加复杂，这将在本章后面体现。你可以按如下方式将用户添加到\
  \ sudo 组：\n\n```\ndebian@ebb:~$ sudo adduser debian sudo\nAdding user 'debian' to\
  \ group 'sudo' …\nAdding user debian to group sudo\nDone. \n```\n\nLinux 中还有另一个命令可以让你以替代用户身份运行\
  \ shell：`su`。键入 `su -`（等同于 `su - root`）会打开一个具有完全超级用户访问权限的新 shell，并且在启用 root 登录后，可以按如下方式使用：\n\
  \n```\ndebian@ebb:~$ su -\nPassword: mySuperSecretPassword\nroot@ebb:~# whoami\n\
  root\nroot@ebb:~# exit\nlogout\ndebian@ebb:~$ whoami\ndebian \n```\n\n除了这样做，你还可以通过\
  \ `sudo` 命令创建一个交互式 shell（`-i`），如下所示：\n\n```\ndebian@ebb:~$ sudo -i\nroot@ebb:~#\
  \ whoami\nroot \n```\n\n这意味着 shell 会读取登录特定的资源（例如 `.profile`）。`#` 提示符表示你已登录到超级用户账户。要重新禁用对开发板的\
  \ root 登录，你可以键入 `sudo passwd -l root`。\n\n### 系统管理\n\n*Linux 文件系统* 是一个用于在 Linux\
  \ 系统上组织文件的目录层次结构。本节将研究文件的所有权、符号链接的使用以及文件系统权限的概念。\n\n#### *Linux 文件系统*\n\nLinux 使用称为\
  \ *inode* 的数据结构来表示文件系统对象，如文件和目录。当在物理磁盘上创建 Linux *扩展*文件系统（例如 ext3/ext4）时，会创建一个 *inode\
  \ 表*。该表链接到该物理磁盘上每个文件和目录的 inode 数据结构。每个文件和目录的 inode 数据结构存储诸如权限属性、指向原始物理磁盘块位置的指针、时间戳和链接计数等信息。你可以通过执行根目录的列表\
  \ `ls -ail` 来查看这一点，其中 `-i` 使 `ls` 显示 inode 索引。你将看到 `/tmp` 目录条目如下：\n\n```\ndebian@ebb:~$\
  \ cd /\ndebian@ebb:/$ ls -ail | grep tmp\n41337 drwxrwxrwt  10 root root  4096 May\
  \  2 18:17 tmp \n```\n\n因此，`41337` 是 `/tmp` 目录的 *inode 索引*。如果你使用 `cd` 进入 `/tmp`\
  \ 目录，创建一个临时文件（`a.txt`），并执行 `ls -ail`，你将看到当前（`.`）目录具有相同的 inode 索引。\n\n```\ndebian@ebb:/$\
  \ cd tmp\ndebian@ebb:/tmp$ touch a.txt\ndebian@ebb:/tmp$ ls -ail\ntotal 40\n 41337\
  \ drwxrwxrwt 10 root   root   4096 May  2 18:36 .\n     2 drwxr-xr-x 21 root   root\
  \   4096 Apr 23 01:47 ..\n  1893 -rw-r--r--  1 debian debian    0 May  2 18:36 a.txt\
  \ \n```\n\n你还可以看到根目录（`.`）的 inode 索引为 2，而文本文件（`a.txt`）也有一个 inode 索引 1893。因此，你不能直接\
  \ `cd` 到一个 inode 索引，因为该 inode 索引可能不指向一个目录。\n\n\n\n\n\n图 3-4 展示了与在 Linux 下处理文件相关的\
  \ Linux 目录列表和文件权限。第一个字母表示文件类型——例如，该条目是（`d`）目录、（`l`）链接还是（`-`）普通文件。还有一些更不常见的文件类型：（`c`）字符特殊、（`b`）块特殊、（`p`）命名管道和（`s`）套接字。目录和普通文件无需进一步解释，但链接需要特别注意，如下所述。\n\
  \n![图片由标题和周围文字描述。](img/c03f004.jpg)\n\n**图 3-4****：** Linux 目录列表和文件权限\n\n#### *文件和目录的链接*\n\
  \nLinux 中有两种类型的链接：*软链接*和*硬链接*。软链接（或*符号链接*）是一个指向另一个文件或目录位置的文件。相反，硬链接直接链接到 inode 索引，但不能链接到目录。使用`ln\
  \ /path/to/file.txt linkname`创建链接。通过在调用中添加`-s`来创建符号链接。为了说明用法，以下示例创建了指向文件`/tmp/test.txt`的软链接和硬链接：\n\
  \n```\ndebian@ebb:~$ cd /tmp\ndebian@ebb:/tmp$ touch test.txt\ndebian@ebb:/tmp$\
  \ ln -s /tmp/test.txt softlink\ndebian@ebb:/tmp$ ln /tmp/test.txt hardlink\ndebian@ebb:/tmp$\
  \ ls -ail\ntotal 40\n 41337 drwxrwxrwt 10 root   root   4096 May  2 18:40 .\n  \
  \   2 drwxr-xr-x 21 root   root   4096 Apr 23 01:47 ..\n  2172 -rw-r--r--  2 debian\
  \ debian    0 May  2 18:40 hardlink\n  2268 lrwxrwxrwx  1 debian debian   13 May\
  \  2 18:40 softlink -> /tmp/test.txt\n  2172 -rw-r--r--  2 debian debian    0 May\
  \  2 18:40 test.txt \n```\n\n硬链接与`test.txt`文件具有相同的 inode 索引，你还可以看到在文件`test.txt`和`hardlink`条目前面（文件权限之后）有一个数字\
  \ 2。这是与该文件关联的硬链接数量。这是一个计数值，当创建名为`hardlink`的硬链接时，该值增加了 1。如果删除硬链接（例如使用`rm hardlink`），该计数器将递减回\
  \ 1。为了说明软链接和硬链接之间的区别，向`test.txt`文件中添加一些文本。\n\n```\ndebian@ebb:/tmp$ echo \"testing\
  \ links on the BB\" >> test.txt\ndebian@ebb:/tmp$ more hardlink\ntesting links on\
  \ the BB\ndebian@ebb:/tmp$ more softlink\ntesting links on the BB\ndebian@ebb:/tmp$\
  \ mkdir sub\ndebian@ebb:/tmp$ mv test.txt sub/\ndebian@ebb:/tmp$ more hardlink\n\
  testing links on the BB\ndebian@ebb:/tmp$ more softlink\nmore: stat of softlink\
  \ failed: No such file or directory \n```\n\n可以看到，当`test.txt`文件被移动到子目录时，软链接失效，但硬链接仍然正常工作。因此，当链接的文件被移动时，符号链接不会更新，但硬链接始终指向源文件，即使被移动或删除也是如此。为了说明最后一点，可以使用以下命令删除`test.txt`文件：\n\
  \n```\ndebian@ebb:/tmp$ rm sub/test.txt\ndebian@ebb:/tmp$ more hardlink\ntesting\
  \ links on the BB\ndebian@ebb:/tmp$ ls -ail hardlink\n2172 -rw-r--r-- 1 debian debian\
  \ 24 May  2 18:59 hardlink \n```\n\n然而，文件仍然存在！除非删除名为`hardlink`的硬链接，否则它不会被删除，从而将链接计数减为零。通过检查`hardlink`条目，可以看到当前计数为\
  \ 1。因此，如果一个文件的硬链接计数为零且没有被任何进程使用，它将被删除。实际上，文件名`test.txt`本身就是一个硬链接。请注意，不能跨不同文件系统创建硬链接，因为每个文件系统都有自己的\
  \ inode 索引表，从 1 开始。因此，inode 269（即`/tmp`目录的 inode 索引）在另一个文件系统上可能描述的是完全不同的内容。输入命令`man\
  \ ln`可以查看一个特别有用的链接指南。\n\n#### *用户和组*\n\nLinux 是一个多用户操作系统，它使用以下三个不同的类别来管理访问权限：\n\n\
  *   **用户：** 你可以在开发板上创建不同的用户账户。如果你想限制对进程和文件系统区域的访问，这很有用。`root`用户账户是 Debian 的超级用户，可以访问所有文件；因此，例如，如果服务器支持本地脚本，则从该账户或\
  \ debian 用户账户运行公共 Web 服务器可能不安全。\n\n*   **组：** 用户账户可以被标记为属于一个或多个组，每个组对不同资源（例如 GPIO、I²C\
  \ 总线）具有不同的访问级别。\n\n*   **其他：** 这包括系统中除文件所有者或权限中列出的组成员之外的所有用户。\n\n你可以在 Linux 终端创建用户。通过输入`more\
  \ /etc/group`可以查看完整的组列表。以下示例演示了如何在开发板上创建新用户账户并修改该账户的属性以满足你的需求。通过在 shell 提示符下输入`groups`可以列出用户所属的组。\n\
  \n```\ndebian@ebb:~$ groups\ndebian adm kmem dialout cdrom floppy audio dip video\
  \ plugdev\nusers systemd-journal i2c bluetooth netdev cloud9ide xenomai\nweston-launch\
  \ tisdk spi admin eqep pwm gpio \n```\n\n为了练习本章前面介绍的主题，以下示例使用 molloyd 用户账户执行。第一个示例演示了如何使用*ch*ange\
  \ *own*ership（更改所有者）命令`chown`更改文件的所有权，以及使用*ch*ange *gr*ou*p*（更改组）命令`chgrp`更改文件的组所有权。\n\
  \n为了使`sudo`工具在示例中正确调用，用户 molloyd 必须存在于 sudo 组中，用户`debian`和用户`molloyd`（来自上一个示例）都属于该组。\n\
  \n或者，你可以编辑`sudoers`文件，这可以通过 debian 用户账户执行`visudo`命令来实现。可以修改该文件以包含一个`molloyd`条目，如下所示：\n\
  \n```\ndebian@ebb:~$ sudo visudo\ndebian@ebb:~$ sudo tail -n 1 /etc/sudoers\nmolloyd\
  \ ALL=(ALL) ALL \n```\n\n现在，molloyd 用户账户可以执行`sudo`命令，并且必须输入其用户密码才能执行。\n\n#### *文件系统权限*\n\
  \n*文件系统权限*规定了每个权限类别对文件或目录的访问级别。*ch*ange *mod*e（更改模式）命令`chmod`允许用户更改文件系统对象的访问权限。你可以以相对方式指定权限。例如，`chmod\
  \ a+w test.txt`赋予所有用户对文件`test.txt`的写权限，但保持其他权限不变。你也可以以绝对方式应用权限。例如，`chmod a=r test.txt`将所有用户设置为仅对文件`test.txt`具有读权限。下一个示例演示了如何使用`chmod`命令修改文件的文件系统权限。\n\
  \n表 3-3 提供了`chown`和`chgrp`命令结构的示例。它还列出了一些用于处理用户、组和权限的示例命令。\n\n| **命令** | **描述**\
  \ |\n| --- | --- |\n| `chown molloyd a.txt`<br>`chown molloyd:users a.txt`<br>`chown\
  \ -Rh molloyd /tmp/test` | 更改文件所有者。<br>同时更改所有者和组。<br>递归更改`/tmp/test`的所有权。<br>`-h`影响符号链接而非引用的文件。\
  \ |\n| `chgrp users a.txt`<br>`chgrp -Rh users /tmp/test` | 更改文件的组所有权。<br>递归更改，`-h`与`chown`相同。\
  \ |\n| `chmod 600 a.txt`<br>`chmod ugo+rw a.txt`<br>`chmod a-w a.txt` | 更改权限（如图\
  \ 3-4 所示），使用户对文件具有读/写权限；组或其他用户无权限。<br>赋予用户、组和其他用户对`a.txt`的读/写权限。<br>移除所有用户的写权限。\
  \ |\n\n\n\n\n\n使用 `a` 移除所有用户的写入权限，其中 `a` 表示*所有*（用户、组和其他人的集合）。\n\n| `chmod ugo=rw\
  \ a.txt` | 将所有用户的权限设置为读/写。 |\n| --- | --- |\n| `umask` `umask -S` | 列出默认权限设置。使用\
  \ `-S` 以更可读的形式显示 umask。 |\n| `umask 022` `umask u=rwx,g=rx,o=rx` | 更改所有新创建文件和目录的默认权限。这里的两个\
  \ `umask` 命令是等效的。如果设置此掩码值并创建文件或目录，则目录的权限为 `drwxr-xr-x`，文件的权限为 `-rw-r--r--`。你可以在账户的\
  \ `.login` 文件中设置特定于用户的 `umask`。 |\n| `chmod u+s myexe` `chmod g+s myexe` | 设置一个称为\
  \ *setuid 位*（设置用户 ID 执行）和 *setgid 位*（设置组 ID 执行）的特殊位 `s`，它允许程序以其他登录用户的身份执行，但具有文件所有者或组的权限。例如，你可以使用它来允许某个特定程序以\
  \ root 用户账户的身份执行。如果文件不可执行，则显示大写 `S`，而不是小写 `s`。 |\n| `chmod 6750 myexe` `chmod u=rwxs,g=rxs,o=myexe`\
  \ | 以绝对方式设置 setuid 位。两个示例都会将 `myexe` 的权限设置为 `-rwsr-s---`，其中 setuid 和 setgid 位都已设置（注意\
  \ `myexe` 前的空格）。出于安全原因，setuid 位不能应用于 shell 脚本。 |\n| `stat /tmp/test.txt` | 提供文件或目录的有用文件系统状态信息，例如其物理设备和\
  \ inode 信息、最后访问时间以及修改/更改时间。 |\n\n**表 3-3****：** 处理用户、组和权限的命令\n\n以下是 表 3-3 中最后一项\
  \ `stat` 命令的示例：\n\n```\nmolloyd@ebb:/tmp$ stat /tmp/test.txt\n  File: /tmp/test.txt\n\
  \  Size: 0               Blocks: 0     IO Block: 4096   regular empty file\nDevice:\
  \ b301h/45825d    Inode: 2305   Links: 1\nAccess: (0644/-rw-r--r--)  Uid: (0/ root)\
  \   Gid: ( 0/ root)\nAccess: 2018-05-02 20:03:01.164235706 +0100\nModify: 2018-05-02\
  \ 20:03:01.164235706 +0100\nChange: 2018-05-02 20:03:35.020235710 +0100\n Birth:\
  \ - \n```\n\n请注意，Linux 中的每个文件都保留访问、修改和更改时间。你可以分别使用 `touch -a text.txt` 和 `touch\
  \ -m test.txt` 人为更新访问和修改时间（更改时间在两种情况下都会受到影响）。更改时间也会受到系统操作（如 `chmod`）的影响；修改时间受文件写入的影响；而访问时间理论上受文件读取的影响。然而，这种操作行为意味着读取文件会导致写入！Linux\
  \ 的这一特性会导致 BeagleBone 的 eMMC 或 SD 卡显著磨损，并导致 I/O 性能缺陷。因此，通常在启动 eMMC/SD 卡上使用 `/etc/fstab`\
  \ 配置文件中的挂载选项 `noatime` 来禁用文件访问时间特性（下一节将介绍）。请注意，还有一个类似的 `nodiratime` 选项，可用于仅禁用目录的访问时间更新；但是，`noatime`\
  \ 选项会同时禁用文件和目录的访问时间更新。你可以通过以下方式在 `/etc/fstab` 中看到启动分区上设置的 `noatime` 选项：\n\n```\n\
  molloyd@ebb:~$ more /etc/fstab | grep mmcblk\n/dev/mmcblk0p1  /  ext4  noatime,errors=remount-ro\
  \  0  1 \n```\n\n为了结束对 图 3-4 的讨论：图中的示例有 22 个指向该文件的硬链接。对于目录，这表示子目录的数量、父目录（`..`）和自身（`.`）。该条目由\
  \ root 拥有，并且属于 root 组。下一个条目 `4096` 是存储该目录中包含的文件元数据所需的大小（最小大小为一个扇区，通常为 4,096 字节）。\n\
  \n最后一点：如果你在根目录中执行目录列表 `ls -ld`，你将看到 `/tmp` 目录的权限中有一个 `t` 位。这称为 *粘滞位*，意味着仅拥有写入权限不足以删除文件。因此，在\
  \ `/tmp` 目录中，任何用户都可以创建文件，但任何用户都不能删除其他用户的文件。\n\n```\nmolloyd@ebb:~$ cd /\nmolloyd@ebb:/$\
  \ ls -dhl tmp\ndrwxrwxrwt 11 root root 4.0K May  2 20:32 tmp \n```\n\n`ls -dhl`\
  \ 命令列出（`d`）目录名称（而非其内容），并以（`h`）人类可读的文件大小和（`l`）长格式显示。\n\n#### *Linux 根目录*\n\n对于 Linux\
  \ 新手来说，探索 Linux 文件系统可能令人望而生畏。如果你在板上使用 `cd /` 进入顶级目录并输入 `ls`，你将得到如下形式的顶级目录结构：\n\n\
  ```\nmolloyd@ebb:/$ ls\nbbb-uEnv.txt  boot  etc  ID.txt  lost+found  mnt   opt \
  \ root\nsbin          sys   usr  bin     dev         home  lib  media\nnfs-uEnv.txt\
  \  proc  run  srv     tmp         var \n```\n\n这一切意味着什么？嗯，每个目录都有其作用，如果你理解了这些作用，你就能开始知道在哪里搜索所需的配置文件或二进制文件。表\
  \ 3-4 简要描述了每个顶级 Linux 子目录的内容。\n\n| **目录** | **描述** |\n| --- | --- |\n| `bin` | 包含所有用户使用的二进制可执行文件，默认情况下存在于\
  \ `PATH` 环境变量中。另一个目录 `/usr/bin` 包含非系统启动或修复核心的可执行文件。 |\n| `boot` | 包含用于启动板的文件。 |\n\
  | `dev` | 包含设备节点（链接到设备驱动程序）。 |\n| `etc` | 本地系统的配置文件。 |\n| `home` | 包含用户的主目录（例如 `/home/debian`）。\
  \ |\n| `lib` | 包含标准系统库。 |\n| `lost+found` | 运行 `fsck`（文件系统检查和修复）后，未链接的文件会显示在此处。如果\
  \ `lost+found` 目录被删除，`mklost+found` 命令会重新创建它。 |\n| `media` | 用于挂载可移动介质，例如 micro-SD\
  \ 卡。 |\n| `mnt` | 通常用于挂载临时文件系统。 |\n| `opt` | 安装第三方（非核心 Linux）可选软件的好地方。 |\n| `proc`\
  \ | 板上运行进程的虚拟文件表示。（例如，如果你 `cd /proc` 并输入 `cat iomem`，你可以看到一些内存映射地址。） |\n| `root`\
  \ | Debian Linux 发行版中 root 账户的主目录。（在其他几个发行版中，这是 `/home/root`。） |\n| `run` | 提供自上次启动以来运行系统的信息。\
  \ |\n| `sbin` | 包含用于 root 用户（超级用户）系统管理的可执行文件。 |\n| `srv` | 存储与 FTP、Web 服务器、rsync\
  \ 等相关的数据。 |\n| `sys` | 包含描述系统的虚拟文件系统。 |\n| `tmp` | 包含临时文件。 |\n| `usr` | 包含所有用户的程序，以及许多子目录，例如\
  \ `/usr/include`（C/C++ 头文件）、`/usr/lib`（C/C++ 库文件）、`/usr/src`（Linux 内核源代码）、`/usr/bin`（用户可执行文件）、`/usr/local`（类似于\
  \ `/usr`，但用于本地用户）和 `/usr/share`（用户之间共享的文件和媒体）。 |\n| `var` | 包含可变文件，例如系统日志。 |\n\n\
  **表 3-4****：** Linux 顶级目录\n\n#### *文件系统命令*\n\n除了用于处理文件系统上文件和目录的命令外，还有用于处理文件系统本身的命令。你应该首先检查的命令是\
  \ `df`（记住为 *d*isk *f*ree，磁盘空闲）和 `mount`。`df` 命令提供板上文件系统的概览。添加 `-T` 会列出文件系统类型。\n\n\
  \n\n\n\n```\nmolloyd@ebb:~$ df -T\nFilesystem     Type     1K-blocks    Used Available\
  \ Use% Mounted on\nudev           devtmpfs    219200       0    219200   0% /dev\n\
  tmpfs          tmpfs        49496    5604     43892  12% /run\n/dev/mmcblk0p1 ext4\
  \      30707172 2066088  27342152   8% /\ntmpfs          tmpfs       247476    \
  \   0    247476   0% /sys/fs/cgroup\n… \n```\n\n`df` 命令有助于判断磁盘空间是否不足；在此例中，可以看到根文件系统（`/`）使用了\
  \ 8%，还有 27.3 GB（来自 32 GB 的 SD 卡）可用于安装额外软件。此外还列出了几个临时文件系统（`tmpfs`）条目，它们实际上指向虚拟文件系统，这些虚拟文件系统映射到板载的\
  \ DDR 内存。（`/sys/fs/*` 条目将在第 8 章中详细讨论。）\n\n列出块设备的命令 `lsblk` 会以简洁的树状结构列出连接到板上的块设备，例如\
  \ SD 卡、USB 存储钥匙和 USB 读卡器（如果有的话）。如下输出所示，可以看到 `mmcblk0`（BeagleBone 上的启动 SD 卡）有一个分区\
  \ `p1`，它挂载在文件系统的根目录 `/` 上。在此例中，BeagleBone 上的 eMMC 显示为 `mmcblk1`，尽管板子是通过 SD 卡启动的：\n\
  \n```\nmolloyd@ebb:~$ lsblk\nNAME         MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT\n\
  mmcblk0      179:0    0 29.8G  0 disk\n└_mmcblk0p1  179:1    0 29.8G  0 part /\n\
  mmcblk1      179:8    0  3.7G  0 disk\n└_mmcblk1p1  179:9    0  3.7G  0 part\nmmcblk1boot0\
  \ 179:24   0    1M  1 disk\nmmcblk1boot1 179:32   0    1M  1 disk \n```\n\nUSB 端口（或\
  \ BeagleBone 上的 SD 卡）可用于扩展存储，这在捕获视频数据且 eMMC/系统 SD 卡容量不足时非常有用。你可以通过下面的示例测试 SD 卡的性能，以确保它们满足应用程序的需求。\n\
  \n使用不带参数的 `mount` 命令可以获取有关板上文件系统的更多信息。\n\n```\nmolloyd@ebb:~$ mount\n/dev/mmcblk0p1\
  \ on / type ext4 (rw,noatime,errors=remount-ro,data=ordered)\nsysfs on /sys type\
  \ sysfs (rw,nosuid,nodev,noexec,relatime)\nproc on /proc type proc (rw,nosuid,nodev,noexec,relatime)\
  \  … \n```\n\n如前所述，文件系统组织成以根目录 `/` 为根的单一树。输入 `cd /` 即可进入根目录。`mount` 命令用于将物理磁盘上的文件系统挂载到这棵树上。不同物理设备上的文件系统都可以挂载到该单一树中任意位置的命名点上。表\
  \ 3-5 描述了一些可用于管理文件系统的命令，随后是两个示例，演示如何利用 `mount` 命令完成重要的 Linux 系统管理任务。\n\n| **命令**\
  \ | **描述** |\n| --- | --- |\n| `du -h /opt` `du -hs /opt/*` `du -hc *.jpg` | 磁盘使用情况：查看目录树占用了多少空间。选项：（`-h`）人类可读形式，（`-s`）汇总，（`-c`）总计。最后一个命令查找当前目录中\
  \ JPG 格式文件的总大小。 |\n| `df -h` | 以（`-h`）人类可读形式显示系统磁盘空间。 |\n| `lsblk` | 列出块设备。 |\n\
  | `dd if=test.img of=/dev/sdX`<br>`dd if=/dev/sdX of=test.img` | 将镜像写入驱动器。`dd` 用于转换和复制文件，其中\
  \ `if` 是输入文件，`of` 是输出文件。在 Linux 下使用此命令将镜像写入 SD 卡。创建驱动器的镜像。通常在桌面 Linux 下使用以下形式：<br><br>`sudo\
  \ dd if=./BB*.img of=/dev/sdX`<br><br>其中 `/dev/sdX` 是 SD 卡读/写设备。 |\n| `cat /proc/partitions`\
  \ | 列出所有已注册的分区。 |\n| `mkfs /dev/sdX` | 创建 Linux 文件系统。还有 `mkfs.ext4`、`mkfs.vfat`。此操作会销毁设备上的数据。请非常小心地使用此命令！\
  \ |\n| `fdisk -l` | 注意：`fdisk` 可用于管理磁盘、创建分区、删除分区等。`fdisk -l` 显示所有现有分区。 |\n| `badblocks\
  \ /dev/mmcblkX` | 检查 SD 卡上的坏块。SD 卡具有磨损均衡控制器电路。如果出现错误，请更换新卡；不要使用 `fsck` 记录它们。以 root\
  \ 权限运行此命令，并注意运行需要一些时间。 |\n| `mount /media/store` | 如果分区列在 `/etc/fstab` 中，则挂载该分区。\
  \ |\n| `umount /media/store` | 卸载分区。如果该分区上有文件处于打开状态，系统会提示你。 |\n| `sudo apt install\
  \ tree` `tree ~/` | 安装 `tree` 命令，并使用它显示用户账户的目录结构。 |\n\n**表 3-5****：** 文件系统常用命令\n\
  \n## find 和 whereis\n\n`find` 命令用于在目录结构中搜索特定文件。它非常全面；输入 `man find` 可查看完整的选项列表。例如，使用以下调用在文件系统中查找\
  \ C++ 头文件 `iostream`（使用 `sudo` 可避免访问权限问题）：\n\n```\nmolloyd@ebb:/$ sudo find . -name\
  \ iostream*\n./usr/include/c++/6/iostream\n./usr/share/ti/cgt-pru/include/iostream\n\
  ./usr/share/ti/cgt-pru/lib/src/iostream\n./usr/share/ti/cgt-pru/lib/src/iostream.cpp\
  \ … \n```\n\n使用 `-iname` 代替 `-name` 可以忽略搜索名称中的大小写。\n\n以下示例分别查找 `/home/` 中在过去 24\
  \ 小时内修改过的文件，以及超过 24 小时前修改过的文件：\n\n```\nmolloyd@ebb:~$ echo \"Test file\" >> new.txt\n\
  molloyd@ebb:~$ sudo find /home -mtime -1\n/home/molloyd\n/home/molloyd/.bash_history\n\
  /home/molloyd/new.txt\nmolloyd@ebb:~$ sudo find /home -mtime +1\n/home/debian\n\
  /home/debian/.xsessionrc\n/home/debian/.bash_logout    … \n```\n\n此外，还可以使用访问时间（`-atime`）、大小（`-size`）、所有者（`-user`）、组（`-group`）和权限（`-perm`）。\n\
  \n`whereis` 命令则不同，它可以用于搜索程序的二进制可执行文件、源代码和手册页。\n\n```\nmolloyd@ebb:~$ whereis find\n\
  find: /usr/bin/find /usr/share/man/man1/find.1.gz /usr/share/info/find.info.gz \n\
  ```\n\n在此例中，二进制命令位于 `/usr/bin/`，手册页位于 `/usr/share/man/man1`（以 gzip 格式存储以节省空间）。\n\
  \n## more 或 less\n\n`more` 命令已经使用过多次，你可能已经了解了它的用途。它允许你一次一页地查看大文件或输出流。因此，要查看长文件，可以输入\
  \ `more filename`。例如，日志文件 `/var/log/messages` 包含内核输出消息。你可以通过输入 `more /var/log/messages`\
  \ 逐页查看该文件。不过，如果你希望保持显示简洁，可以使用 `-5` 将页面长度设置为五行。\n\n```\nmolloyd@ebb:~$ more -5 /var/log/messages\n\
  Apr 30 06:25:05 beaglebone liblogging-stdlog:  …\nApr 30 03:37:41 beaglebone kernel:\
  \ [    0.000000] Booting Linux …\nApr 30 03:37:41 beaglebone kernel: [    0.000000]\
  \ Linux version …\n--More--(0%) \n```\n\n你可以使用空格键翻页，按 Q 键退出。还有一个更强大的命令叫做 `less`，你也可以使用。\n\
  \n```\nmolloyd@ebb:~$ less /var/log/messages\n```\n\n`less` 命令通过键盘提供完全交互式的视图。选项太多，无法在此一一列举。例如，你可以使用箭头键上下移动。或者，使用空格键向下翻页，通过输入\
  \ `/` 来搜索字符串（例如，输入 `/usb` 查找与 USB 设备相关的消息），然后按 N 键跳转到下一个匹配项（或按 Shift+N 键跳转到上一个匹配项）。\n\
  \n最后，还有一个专门用于显示内核环形缓冲区的命令，它会以彩色标记格式化输出，只需调用以下命令即可：\n\n```\nmolloyd@ebb:~$ dmesg\
  \ \n```\n\n\n\n\n\n#### *SD 卡/eMMC 文件系统的可靠性*\n\n单板计算机（SBC）最可能发生故障的部件之一是其 SD 卡，更常见的叫法是多媒体卡（MMC），当它集成在\
  \ SBC 上时（如 BeagleBone 的情况），则称为嵌入式 MMC（eMMC）。基于 NAND 的闪存（如 MMC 中的闪存）容量大、成本低，但容易磨损，可能导致文件系统错误。\n\
  \nMMC 的高容量主要得益于多层单元（MLC）存储器的发展。与单层单元（SLC）存储器不同，单个存储单元中可以存储超过 1 位的数据。擦除存储单元所需的高电压会干扰相邻单元，因此\
  \ NAND 闪存以 1KB 到 4KB 的块为单位进行擦除。随着时间的推移，写入 NAND 闪存的过程会导致电子被捕获，从而降低设定状态与擦除状态之间的电导率差异。（关于高可靠性应用中\
  \ SLC 与 MLC 的讨论，请参见[`tiny.cc/beagle301`](http://tiny.cc/beagle301)。）MLC 使用不同的电荷水平和更高的电压，在单个单元中存储更多状态（商用\
  \ MLC 产品通常每个单元提供 4 到 16 种状态）。由于 SLC 只存储单一状态，因此在可靠性方面具有优势（通常为 60,000–100,000 次擦写周期），而\
  \ MLC 通常为 10,000 次。MMC 完全适用于日常应用，如数码摄影或安防摄像头录像；以每天整卡写入一次计算，10,000 次周期应能持续超过 27 年。\n\
  \n然而，嵌入式 Linux 设备会持续向 MMC 写入数据，例如在`/var/log/`中记录系统事件。如果您的板卡每天向日志文件写入 20 次，SD 卡的使用寿命可能低至\
  \ 8 个月。这些是保守数字，得益于*磨损均衡算法*，实际寿命可能长得多。MMC 在数据写入时采用磨损均衡，确保重写操作均匀分布在整个 MMC 介质上，从而避免因集中修改（如日志文件变更）导致\
  \ Linux 设备系统故障。\n\n对于您的 Beagle 板，请确保购买高品质的品牌 SD 卡。此外，SD 卡上未使用的空间越多越好，因为这会进一步增强磨损均衡性能。BeagleBone\
  \ 使用 eMMC 存储——本质上是一种芯片上的 MMC，其可靠性与 SD 卡相当。然而，eMMC 的一个重要优势是板卡制造商可以控制所用存储设备的质量和规格。最后，大多数消费级\
  \ SSD 也基于 MLC，而更昂贵的基于 SLC 的 SSD 通常保留给企业级服务器。\n\n对于需要更高可靠性的 Beagle 应用，可以使用 RAM 文件系统（`tmpfs`）来挂载`/tmp`目录、`/var/cache`目录以及日志文件（特别是`/var/log/apt`）。您可以通过编辑`/etc/fstab`文件，将所需目录挂载到内存中来实现这一点。例如，如果您的进程需要共享文件数据以进行数据交换，可以通过编辑`/etc/fstab`文件，将`/tmp`目录用作\
  \ RAM 文件系统（`tmpfs`），如下所示：\n\n```\nmolloyd@ebb:/etc$ sudo nano fstab\nmolloyd@ebb:/etc$\
  \ more fstab\n/dev/mmcblk0p1  /   ext4  noatime,errors=remount-ro  0  1\ndebugfs\
  \         /sys/kernel/debug  debugfs  defaults  0  0\ntempfs          /tmp   tempfs\
  \ size=100M  0  0\nmolloyd@ebb:/etc$ mkdir /tmp/swap\n然后可以使用 mount 命令应用这些设置：\nmolloyd@ebb:/etc$\
  \ sudo mount -a\n接着检查设置是否已应用：\nmolloyd@ebb:/etc$ mount\n…\ntmpfs on /tmp/swap type\
  \ tmpfs (rw,relatime,size=102400k) \n```\n\n根目录（`/`）默认以`noatime`属性挂载，这大大减少了写入次数并提高了\
  \ I/O 性能（如前文所述）。在可能的情况下，应对所有固态存储设备（例如 USB 存储密钥）应用此属性，但对于基于 RAM 的存储则非必需。\n\n请记住，写入`tmpfs`的任何数据在重启后都会丢失。因此，如果您将`tmpfs`用于`/var/log`，那么导致板卡崩溃的任何系统错误在重启后将不可见。您可以通过在之前配置的`/tmp/swap/`目录中创建一个文件并重启来验证这一点。\n\
  \n实际 RAM 分配会根据`tmpfs`磁盘上的文件使用情况而增减；因此，您可以相当慷慨地分配内存。以下是一个挂载了 100 MB `/tmp/swap/`\
  \ `tmpfs`的示例：\n\n```\nmolloyd@ebb:/tmp/swap$ cat /proc/meminfo | grep MemFree:\n\
  MemFree:          213404 kB\nmolloyd@ebb:/tmp/swap$ fallocate -l 50000000 test.txt\n\
  molloyd@ebb:/tmp/swap$ ls -l test.txt\n-rw-r--r-- 1 molloyd molloyd 50000000 May\
  \  4 12:30 test.txt\nmolloyd@ebb:/tmp/swap$ cat /proc/meminfo | grep MemFree:\n\
  MemFree:          164548 kB\nmolloyd@ebb:/tmp/swap$ rm test.txt\nmolloyd@ebb:/tmp/swap$\
  \ cat /proc/meminfo | grep MemFree:\nMemFree:          213296 kB \n```\n\n使用只读文件系统（例如\
  \ SquashFS 压缩文件系统）可以提高 SD 卡的使用寿命和文件系统的稳定性，但这需要大量工作，不适合本书中进行的原型开发类型。不过，在最终项目或产品部署中，如果系统稳定性至关重要，请记住这一点。\n\
  \n### Linux 命令\n\n当您在 Linux 终端中工作并输入诸如`date`之类的命令时，这些命令的输出会发送到标准输出。因此，输出会显示在您的终端窗口中。\n\
  \n#### *输出和输入重定向（`>`、`>>`和`<`）*\n\n可以使用重定向符号`>`和`>>`将输出重定向到文件。本章前面曾使用`>>`符号将文本添加到临时文件中。`>`符号可用于将输出发送到新文件。示例如下：\n\
  \n```\nmolloyd@ebb:/tmp$ date > a.txt\nmolloyd@ebb:/tmp$ more a.txt\nFri May  4\
  \ 12:33:32 IST 2018\nmolloyd@ebb:/tmp$ date > a.txt\nmolloyd@ebb:/tmp$ more a.txt\n\
  Fri May  4 12:33:45 IST 2018 \n```\n\n`>>`符号表示您想要追加到文件。以下示例说明了`>>`与新文件`a.txt`的用法：\n\
  \n```\nmolloyd@ebb:/tmp$ date >> a.txt\nmolloyd@ebb:/tmp$ more a.txt\nFri May  4\
  \ 12:33:45 IST 2018\nFri May  4 12:34:23 IST 2018 \n```\n\n使用`<`符号的标准输入工作方式类似。包含`-e`可以启用转义字符的解析，例如回车符（`\\\
  n`），这会将每种动物类型放在新的一行。\n\n```\nmolloyd@ebb:/tmp$ echo -e \"dog\\ncat\\nyak\\ncow\"\
  \ > animals.txt\nmolloyd@ebb:/tmp$ sort < animals.txt\ncat\ncow\ndog\nyak \n```\n\
  \n您可以组合输入和输出重定向操作。使用相同的`animals.txt`文件，可以执行如下操作：\n\n```\nmolloyd@ebb:/tmp$ sort\
  \ < animals.txt > sorted.txt\nmolloyd@ebb:/tmp$ more sorted.txt\ncat\ncow\ndog\n\
  yak \n```\n\n#### *管道（`|`和`tee`）*\n\n简单来说，*管道*（`|`）使您能够连接 Linux 命令。就像您将输出重定向到文件一样，您可以将一个命令的输出重定向到另一个命令的输入。例如，要列出根目录（从系统任意位置）并将输出发送（或*管道*）到`sort`命令，在其中以逆序（`-r`）列出，请使用以下命令：\n\
  \n```\nmolloyd@ebb:~$ ls / | sort -r\nvar\nusr\n…\nbin \n```\n\n\n\n\n\n你可以识别出 `/opt`\
  \ 目录中哪些用户安装占用了最多的磁盘空间：`du` 命令可以显示磁盘使用情况。传递参数 `-d1` 表示仅列出当前目录下一级子目录的大小，`-h` 表示以人类可读的形式显示数值。你可以将此输出通过管道传递给\
  \ `sort` 过滤命令，以进行反向数值排序（最大的在最上面）。因此，命令如下：\n\n```\nmolloyd@ebb:~$ du -d1 -h /opt\
  \ | sort -nr\n500K    /opt/backup\n198M    /opt\n98M     /opt/source\n75M     /opt/cloud9\n\
  25M     /opt/scripts \n```\n\n另一个有用的工具 `tee` 允许你将输出重定向到文件，同时将其传递给管道中的下一个命令（例如，存储并查看）。使用前面的例子，如果你希望将\
  \ `du` 的未排序输出保存到文件，但显示排序后的输出，可以输入以下命令：\n\n```\nmolloyd@ebb:~$ du -d1 -h /opt | tee\
  \ unsorted.txt | sort -nr\n500K    /opt/backup\n198M    /opt\n98M     /opt/source\n\
  75M     /opt/cloud9\n25M     /opt/scripts\nmolloyd@ebb:~$ more unsorted.txt\n500K\
  \    /opt/backup\n25M     /opt/scripts\n98M     /opt/source\n75M     /opt/cloud9\n\
  198M    /opt \n```\n\n你还可以使用 `tee` 将输出同时写入多个文件：\n\n```\nmolloyd@ebb:~$ du -d1 -h\
  \ /opt | tee 1.txt 2.txt 3.txt\n500K    /opt/backup\n…\nmolloyd@ebb:~$ ls\n1.txt\
  \  2.txt  3.txt  unsorted.txt \n```\n\n#### 过滤命令（从 sort 到 xargs）\n\n每个过滤命令都提供了一项有用的功能：\n\
  \n*   `sort`：该命令有多个选项：`-r` 反向排序，`-f` 忽略大小写，`-d` 使用字典排序并忽略标点，`-n` 进行数值排序，`-b` 忽略空白，`-i`\
  \ 忽略控制字符，`-u` 仅显示重复行一次，`-m` 将多个输入合并为一个输出。\n\n*   `wc`（单词计数）：计算流中的单词数、行数或字符数。示例如下：\n\
  \n    ```\n    molloyd@ebb:/tmp$ more animals.txt\n    dog\n    cat\n    yak\n \
  \   cow\n    molloyd@ebb:/tmp$ wc < animals.txt\n    4  4 16 \n    ```\n\n该命令返回结果：有\
  \ 4 行、4 个单词和 16 个字符（包括隐藏字符，例如回车符）。你可以通过行数（`-l`）、单词数（`-w`）和字符数（`-m`）分别选择这些值，而 `-c`\
  \ 则打印字节数（本例中也是 16）。\n\n*   `head`：该命令显示输入的前几行，当你有一个很长的文件或信息流，只想查看前几行时非常有用。默认显示前\
  \ 10 行。你可以使用 `-n` 选项指定行数。例如，要获取 `dmesg` 命令（显示内核消息缓冲区）输出的前两行，请使用以下命令：\n\n```\n molloyd@ebb:~$\
  \ dmesg | head -n2\n     [    0.000000] Booting Linux on physical CPU 0x0\n    \
  \ [    0.000000] Linux version 4.9.88-ti-rt-r111 … \n```\n\n*   `tail`：该命令与 `head`\
  \ 类似，但显示文件或流的最后几行。与 `dmesg` 结合使用可提供有用的输出，如下所示：\n\n```\n molloyd@ebb:~$ dmesg | tail\
  \ -n2\n     [  178.194805] pvrsrvkm: loading out-of-tree module taints kernel.\n\
  \     [  178.556171] [drm] Initialized pvr 1.14.3699939 20110701 on minor 0 \n```\n\
  \n*   `grep`：该命令使用文本和正则表达式解析行。你可以使用此命令通过选项过滤输出，包括忽略大小写（`-i`）、匹配五次后停止（`-m 5`）、静默模式（`-q`，找到匹配时退出并返回状态\
  \ 0）、指定模式（`-e`）、打印匹配计数（`-c`）、仅打印匹配文本（`-o`）以及列出包含匹配项的文件名（`-l`）。例如，以下命令检查 `dmesg`\
  \ 输出中前三个出现的字符串 `usb`，并使用 `-i` 忽略大小写：\n\n```\n molloyd@ebb:~$ dmesg | grep -i -m3\
  \ usb\n     [    0.809529] usbcore: registered new interface driver usbfs\n    \
  \ [    0.809622] usbcore: registered new interface driver hub\n     [    0.809795]\
  \ usbcore: registered new device driver usb \n```\n\n你可以组合管道。例如，通过使用 `head` 并仅显示\
  \ `grep` 输出的前两行，可以得到相同的输出。\n\n```\n molloyd@ebb:~$ dmesg | grep -i -m3 usb | head\
  \ -n2\n     [    0.809529] usbcore: registered new interface driver usbfs\n    \
  \ [    0.809622] usbcore: registered new interface driver hub \n```\n\n*   `xargs`：该命令允许你构建一个参数列表，用于调用另一个命令或工具。在以下示例中，一个包含三个字符串的文本文件\
  \ `args.txt` 被用来创建三个新文件。`cat` 的输出通过管道传递给 `xargs`，它将三个字符串作为参数传递给 `touch` 命令，从而创建三个新文件：`a.txt`、`b.txt`\
  \ 和 `c.txt`。\n\n    ```\n    molloyd@ebb:~$ echo \"a.txt b.txt c.txt\" > args.txt\n\
  \    molloyd@ebb:~$ cat args.txt | xargs touch\n    molloyd@ebb:~$ ls\n    args.txt\
  \  a.txt  b.txt  c.txt \n    ```\n\n其他有用的过滤命令包括 `awk`（用于编程任何类型的过滤器）、`fmt`（用于格式化文本）、`uniq`（用于查找唯一行）和\
  \ `sed`（用于操作流）。这些命令超出了本文的讨论范围；例如，`awk` 是一种完整的编程语言！表 3-6 描述了一些有用的管道命令，以帮助你了解如何使用它们。\n\
  \n| **命令** | **描述** |\n| --- | --- |\n| `apt list --installed \\| grep camera` |\
  \ 列出已安装的软件包，并搜索包含搜索字符串 camera 的软件包。本表中的每个命令都在单行中输入。 |\n| `ls -lt \\| head` | 按时间顺序显示当前目录中的文件。\
  \ |\n| `cat urls.txt \\| xargs wget` | 下载文本文件 `urls.txt` 中 URL 列出的文件。 |\n| `dmesg\
  \ \\| grep -c usb` | 统计 `dmesg` 输出中找到 `usb` 的次数。 |\n| `find . -name \"*.mp3\" \\\
  | grep -vi \"effects\" > /tmp/playlist.txt` | 在你的板子上搜索（例如，使用 `sudo` 从 `/` 运行）`.mp3`\
  \ 文件，忽略任何音效文件，以在 `/tmp` 中创建播放列表文件。 |\n\n**表 3-6：** 有用的管道示例\n\n#### echo 和 cat\n\n\
  `echo` 命令简单地将字符串、命令输出或值回显到标准输出。以下是一些示例：\n\n```\nmolloyd@ebb:~$ echo 'hello'\nhello\n\
  molloyd@ebb:~$ echo \"Today's date is $(date)\"\nToday's date is Fri May  4 13:45:36\
  \ IST 2018\nmolloyd@ebb:~$ echo $PATH\n/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games\
  \ \n```\n\n在第一种情况下，回显了一个简单的字符串。在第二种情况下，由于在 `echo` 调用中执行了一个命令，因此使用了 `\" \"`；最后一种情况回显了\
  \ `PATH` 环境变量。\n\n`echo` 命令还允许你使用 `$?` 查看命令的退出状态。示例如下：\n\n```\nmolloyd@ebb:~$ ls\n\
  args.txt  a.txt  b.txt  c.txt\nmolloyd@ebb:~$ echo $?\n0\nmolloyd@ebb:~$ ls /nosuchdirectory\n\
  ls: cannot access '/nosuchdirectory': No such file or directory\nmolloyd@ebb:~$\
  \ echo $?\n2 \n```\n\n显然，`ls` 的退出状态在成功调用时为 0，在无效参数时为 2。这在编写脚本以及从 `main()` 函数返回值的程序时非常有用。\n\
  \n`cat` 命令（连接）允许你在命令行中将两个文件连接在一起。以下示例使用 `echo` 创建两个文件：`a.txt` 和 `b.txt`；`cat` 将文件连接起来创建一个新文件\
  \ `c.txt`。如果你希望启用传递给 `echo` 的字符串中的转义字符解释，则需要使用 `-e`。\n\n```\nmolloyd@ebb:~$ echo\
  \ \"Hello\" > a.txt\nmolloyd@ebb:~$ echo -e \"from\\nthe\\nPocketBeagle\" > b.txt\n\
  molloyd@ebb:~$ cat a.txt b.txt > c.txt\nmolloyd@ebb:~$ more c.txt\nHello\nfrom\n\
  the\nPocketBeagle \n```\n\n#### diff\n\n\n\n\n\n`diff` 命令可以帮助你找出两个文件之间的差异。它提供基本的输出。\n\
  \n```\nmolloyd@ebb:~$ echo -e \"dog\\ncat\\nbird\" > list1.txt\nmolloyd@ebb:~$ echo\
  \ -e \"dog\\ncow\\nbird\" > list2.txt\nmolloyd@ebb:~$ diff list1.txt list2.txt\n\
  2c2\n< cat\n---\n> cow \n```\n\n输出中的 `2c2` 表示第一个文件的第 2 行 *c*hanged（更改）为第二个文件的第 2\
  \ 行，具体变化是 *cat* 变成了 *cow*。字符 `a` 表示追加（appended），`d` 表示删除（deleted）。要进行并排比较，可以使用以下命令：\n\
  \n```\nmolloyd@ebb:~$ diff -y -W30 list1.txt list2.txt\ndog             dog\ncat\
  \           | cow\nbird            bird \n```\n\n其中 `-y` 启用并排视图，`-W30` 将显示宽度设置为\
  \ 30 个字符列。\n\n如果你想要更直观（但也更具挑战性）的两个文件差异显示，可以使用 `vimdiff` 命令（通过 `sudo apt install\
  \ vim` 安装），它会使用 vim（Vi IMproved）文本编辑器显示文件的并排比较（输入 `vimdiff list1.txt list2.txt`，然后使用\
  \ VI 按键序列：按两次 `Escape : q !` 退出，或按 `Escape : w q` 保存更改并退出）。Vim 需要练习才能掌握按键序列。\n\n\
  #### `tar`\n\n`tar` 命令是一个归档工具，可以将文件和目录合并成一个文件（类似于未压缩的 zip 文件）。然后可以压缩该文件以节省空间。要归档并压缩一个文件目录（例如\
  \ `/tmp`），请使用以下命令：\n\n```\nmolloyd@ebb:~$ tar cvfz backup.tar.gz /tmp\nmolloyd@ebb:~$\
  \ ls -l backup.tar.gz\n-rw-r--r-- 1 molloyd molloyd 416 May  4 13:54 backup.tar.gz\
  \ \n```\n\n其中 `c` 表示新建归档，`v` 表示详细列出文件，`z` 表示用 gzip 压缩，`f` 表示后面跟归档文件名。你可能还会看到 `.tar.gz`\
  \ 表示为 `.tgz`。更多示例请参见表 3-7。\n\n| **命令** | **描述** |\n| --- | --- |\n| `tar cvfz name.tar.gz\
  \ /tmp` | 使用 gzip 格式压缩。 |\n| `tar cvfj name.tar.bz2 /tmp` | 使用 bzip2 压缩（通常耗时更长，但文件更小）。本表中的所有命令均在一行内输入。\
  \ |\n| `tar cvfJ name.tar.xz /tmp` | 使用 xz 文件格式压缩（用于 `.deb` 包文件）。 |\n| `tar xvf\
  \ name.tar.*` | 解压压缩文件（`x` 表示 e*x*tract，即提取）。它会自动检测压缩类型（例如 gzip、bz2）。 |\n| `tar\
  \ rvf name.tar filename` | 向归档中添加另一个文件。 |\n| `tar cfz name-$(date +%m%d%y).tar.gz\
  \ /dir/filename` | 创建带有当前日期的归档；适用于脚本和 cron 作业备份。注意 `date` 和 `+%m%d%y` 之间必须有一个空格。\
  \ |\n\n**表 3-7****：** 有用的 `tar` 命令\n\n#### `md5sum`\n\n`md5sum` 命令允许你检查哈希码，以验证文件在传输过程中未被恶意或意外损坏。在以下示例中，wavemon\
  \ 工具作为 `.deb` 包下载但未安装。可以使用 `md5sum` 命令生成 md5 校验和。\n\n```\nmolloyd@ebb:~$ sudo apt\
  \ download wavemon\nGet:1 http://deb.debian.org/debian stretch/main armhf wavemon\
  \ armhf\n0.8.1-1 [49.3 kB] Fetched 49.3 kB in 0s (247 kB/s)\nmolloyd@ebb:~$ ls -l\
  \ *.deb\n-rw-r--r-- 1 root root 49286 Jan  2  2017 wavemon_0.8.1-1_armhf.deb\nmolloyd@ebb:~$\
  \ md5sum wavemon_0.8.1-1_armhf.deb\n557728e1da32bb7f68b09099755c9ca3  wavemon_0.8.1-1_armhf.deb\
  \ \n```\n\n现在你可以将此校验和与官方校验和进行比对，以确保文件有效。不幸的是，在线查找单个包的校验和可能比较困难。如果 `wavemon` 已安装，校验和位于\
  \ `/var/lib/dpkg/info/wavemon.md5sums`。你可以在 Debian 下安装一个名为 `debsums` 的工具来检查文件及其组成部分的完整性。\n\
  \n```\nmolloyd@ebb:~$ sudo apt install debsums wavemon\nmolloyd@ebb:~$ debsums wavemon_0.8.1-1_armhf.deb\n\
  /usr/bin/wavemon                                                       OK\n…\n/usr/share/man/man5/wavemonrc.5.gz\
  \                                     OK\n/usr/share/menu/wavemon              \
  \                                  OK \n```\n\n如果你正在构建自己的包并希望分发，那么同时分发一个校验和文件会很有用，用户可以用它来验证下载的仓库。`md5sum`\
  \ 的替代方案是 `sha256sum`，其使用方法相同。\n\n```\nmolloyd@ebb:~$ sha256sum wavemon_0.8.1-1_armhf.deb\n\
  6536009848b1063e831d7d9aae70f6505e46e8ecc88e161f6bd7034ba11ae1dc \n```\n\n### Linux\
  \ 进程\n\n进程是在操作系统上运行的程序的一个实例。你需要能够管理板上运行的进程，理解前台和后台进程，并终止被锁定的进程。\n\n#### 如何控制 Linux\
  \ 进程\n\n`ps` 命令列出当前在板上运行的进程。输入 `ps` 会显示以下 PocketBeagle 正在运行两个用户进程：进程 ID（PID）为 1953\
  \ 的 `bash` shell，以及 PID 为 1968 的 `ps` 命令本身。每次运行 `ps` 时，其 PID 都不同，因为它每次都会运行到完成。\n\
  \n```\nmolloyd@ebb:~$ ps\n  PID TTY          TIME CMD\n 1953 pts/0    00:00:00 bash\n\
  \ 1968 pts/0    00:00:00 ps \n```\n\n要查看所有正在运行的进程，请使用 `ps ax`。在以下示例中，它被过滤以搜索字符串“apache”，从而发现板上运行的\
  \ `apache2` 进程的信息：\n\n```\nmolloyd@ebb:~$ ps ax | grep apache\n 1107 ?        Ss\
  \     0:00 /usr/sbin/apache2 -k start\n 1110 ?        Sl     0:00 /usr/sbin/apache2\
  \ -k start\n 1111 ?        Sl     0:00 /usr/sbin/apache2 -k start\n 1970 pts/0 \
  \   S+     0:00 grep apache \n```\n\n很明显，该服务运行了三个不同的进程，使其能够处理多个同时连接。在此示例中，所有线程当前都在等待事件完成（`S`），PID\
  \ 1107 是会话领导者（`Ss`），1110 和 1111 是其多线程克隆（`Sl`），而 1970 的 `grep` 进程位于前台组（`S+`）。如前所述，调用\
  \ `systemctl status apache2` 会提供有关 PocketBeagle 上运行的服务的信息——如果你执行该调用，你会看到进程 PID 与调用\
  \ `ps` 显示的 PID 相匹配。\n\n#### 前台和后台进程\n\nLinux 是一个多任务操作系统，允许你在使用前台运行的程序的同时，在后台运行进程。这个概念类似于窗口系统（例如\
  \ Windows、macOS）的行为。例如，当你使用网页浏览器时，桌面时钟会持续更新时间。\n\n在终端窗口中运行的应用程序也是如此。为了演示这一点，这里有一段简短的\
  \ C 代码，用于在 Linux 终端中每五秒显示一次“Hello World!”。具体工作原理将在第 5 章中介绍，但目前你可以将代码逐字输入到 molloyd\
  \ 用户主目录下名为 `HelloBeagle.c` 的文件中，使用 nano 文件编辑器，如下所示：\n\n```\nmolloyd@ebb:~$ nano\
  \ HelloBeagle.c\nmolloyd@ebb:~$ more HelloBeagle.c\n#include<unistd.h>\n#include<stdio.h>\n\
  int main(){\n   int x=0;\n   do{\n      printf(\"Hello Beagle!\\n\");\n      sleep(5);\n\
  \   }while(x++<50);\n   return 0;\n} \n```\n\n该程序有 50 次迭代，每次迭代显示一条消息并休眠五秒。将文件保存为\
  \ `HelloBeagle.c` 后，可以通过输入以下命令将其编译为可执行文件（`-o` 指定可执行文件名）：\n\n```\nmolloyd@ebb:~$\
  \ gcc HelloBeagle.c -o hello\nmolloyd@ebb:~$ ls -l hello\n-rwxr-xr-x 1 molloyd molloyd\
  \ 8384 May  4 16:26 hello \n```\n\n\n\n\n如果一切正常，你现在将拥有源文件和名为 `hello` 的可执行程序（注意可执行文件已设置\
  \ `x` 权限）。然后就可以运行它了。\n\n```\nmolloyd@ebb:~$ ./hello\nHello Beagle!\nHello Beagle!\n\
  ^C \n```\n\n它会每五秒持续输出这条消息；你可以使用 Ctrl+C 终止它。不过，如果你想在后台运行它，有两种选择。\n\n第一种方法是，不要用 Ctrl+C\
  \ 终止进程，而是使用 Ctrl+Z，然后在提示符下输入 `bg`（*b*ack*g*round，后台）命令。\n\n```\nmolloyd@ebb:~$ ./hello\n\
  Hello Beagle!\n^Z\n[1]+  Stopped                 ./hello\nmolloyd@ebb:~$ bg\n[1]+\
  \ ./hello &\nmolloyd@ebb:~$ Hello Beagle!\nHello Beagle!\nHello Beagle! \n```\n\n\
  当你按下 Ctrl+Z 时，输出中会显示 `^Z`。输入 `bg` 后，进程被置于后台并继续执行。事实上，你可以继续使用终端，但这会令人烦恼，因为每五秒就会显示一次“Hello\
  \ Beagle!”。你可以使用 `fg` 命令将该进程带回前台。\n\n```\nmolloyd@ebb:~$ fg\n./hello\nHello Beagle!\n\
  ^C\nmolloyd@ebb:~$ \n```\n\n当输入 Ctrl+C 时（显示为 `^C`），应用程序被终止。\n\n将应用程序置于后台的第二种方法是在应用程序名称后加上\
  \ `&` 符号来执行它。\n\n```\nmolloyd@ebb:~$ ./hello &\n[1] 1992\nmolloyd@ebb:~$ Hello Beagle!\n\
  Hello Beagle!\nHello Beagle! \n```\n\n在这种情况下，进程已被置于后台，PID 为 1992。要停止该进程，可以使用 `ps`\
  \ 命令加上这个 PID，或者通过 `ps` 命令查找 PID。\n\n```\nmolloyd@ebb:~$ ps |grep hello\n 1992 pts/0\
  \    00:00:00 hello\nmolloyd@ebb:~$ Hello Beagle! \n```\n\n要终止进程，请使用 `kill` 命令。\n\
  \n```\nmolloyd@ebb:~$ kill 1992\n[1]+  Terminated              ./hello \n```\n\n\
  你可以再次使用 `ps` 确认进程是否已终止。如果进程没有终止，可以使用 `-9` 参数来确保它终止！（例如 `kill -9 1992`）。另一个命令 `pkill`\
  \ 可以根据进程名称终止进程，因此在这种情况下，你可以按如下方式终止进程：\n\n```\nmolloyd@ebb:~$ pkill hello \n```\n\
  \n还有一个值得一提的命令是 `watch`，它会定期执行一个命令，并在终端上全屏显示结果。例如，要查看内核消息日志，请使用以下命令：\n\n```\nmolloyd@ebb:~$\
  \ watch dmesg \n```\n\n你可以使用 `-n` 后跟秒数来指定每次执行之间的时间间隔。理解 `watch` 的一个好方法是按如下方式执行它：\n\
  \n```\nmolloyd@ebb:~$ watch -n 1 ps a\nEvery 1.0s: ps a       ebb: Fri May  4 16:34:52\
  \ 2018\n  PID TTY      STAT   TIME COMMAND\n 1033 tty1     Ss+    0:00 /sbin/agetty\
  \ --noclear tty1 linux\n …\n 2018 pts/0    S+     0:00 watch -n 1 ps a\n 2046 pts/0\
  \    S+     0:00 watch -n 1 ps a\n 2047 pts/0    S+     0:00 sh -c ps a\n 2048 pts/0\
  \    R+     0:00 ps a \n```\n\n你会看到 `ps`、`sh` 和 `watch` 的 PID 每秒钟都在变化，这清楚地表明 `watch`\
  \ 实际上是通过 `sh -c` 将命令（`ps`）传递给一个新的 shell 来执行的。`watch` 在列表中出现两次的原因是它在执行 `ps a` 的那一刻临时生成了自身。\n\
  \n### 其他 Linux 主题\n\n在本书的这一部分，我已经介绍了在 Beagle 板上使用 Linux 的核心命令；然而，关于管理 Linux 系统的话题还有很多需要介绍。例如，如何配置\
  \ Wi-Fi 适配器？如何使用 `cron` 来调度任务？这些主题以及许多其他内容将在你阅读本书的过程中详细说明。例如，cron 任务将在第 11 章中，在物联网的背景下进行介绍。\n\
  \n## 使用 Git 进行版本控制\n\n简单来说，*Git* 是一个系统，它使你能够跟踪软件项目在开发过程中内容的变化。Git 由 Linus Torvalds\
  \ 设计，如今用于主线 Linux 内核的开发。Git 是一个非常有用的系统，理解它主要有两个原因：你可以在开发自己的软件时使用 Git，并且可以了解如何处理\
  \ Linux 内核源代码分发。在开发自己的软件时，Git 对于备份代码并将其重新部署到多个 Beagle 板特别有用。\n\nGit 是一个用于源代码控制管理的分布式版本控制系统（DVCS）。*版本控制系统*（VCS）跟踪和管理任何类型文档的更改。通常，被更改的文档会标有修订号和时间戳。可以比较修订版本，甚至可以回退到文档的旧版本。VCS\
  \ 有两种类型。\n\n*   **集中式：** 这类系统，如 Apache Subversion（SVN），基于项目只有一个“主”副本的原则工作。工作流程很简单：你从中央服务器拉取更改，进行修改，然后将更改提交回主副本。\n\
  \n*   **分布式：** 使用这类系统，如 Git 和 Selenic Mercurial，你不会拉取更改；相反，你会克隆整个仓库，包括其完整的历史记录。克隆的仓库与主副本一样完整，如果需要，甚至可以成为主副本。值得庆幸的是，按照今天的标准，文本文档和编程源代码不会占用太多磁盘空间。重要的是，DVCS\
  \ 模型并不阻止你拥有一个所有人都使用的中央主仓库；请查看 [`git.kernel.org`](http://git.kernel.org)。\n\nDVCS\
  \ 相对于 CVCS 的主要优势在于，你可以快速地在本地系统上提交和测试更改，而无需将它们推送到主副本；但是，当更改达到适当的质量水平时，可以将其推送。唯一显著的缺点是存储项目及其完整历史记录所需的磁盘空间量，这会随着时间的推移而增长。\n\
  \nGit 是一个专注于编程源代码控制和管理的 DVCS。它使你能够创建不影响原始版本的并行开发。你甚至可以回退到某个源代码文件的旧版本或整个项目的旧版本。项目及其相关文件和历史记录被称为*仓库*。这种能力在大型编程项目中特别有用，因为你可能会沿着一条最终不成功的开发路径前进。并行开发的功能对于多人同时处理同一个项目也很重要。\n\
  \nGit 是用 C 语言编写的，虽然它源于 Linux 内核代码开发中对版本控制工具的需求，但它也被许多其他开源项目使用，例如 Eclipse 和 Android。\n\
  \n理解 Git 最简单的方法是实际使用它。因此，下一节将以逐步指南的形式呈现。如果尚未安装 Git，可以使用 `sudo apt install git` 轻松安装，因此你应该能够直接在终端中按照步骤操作。本书使用\
  \ *GitHub* 作为提供源代码示例的远程仓库。除了将源代码推送到服务器之外，你可以在没有 GitHub 帐户的情况下完成本指南中的所有操作。GitHub\
  \ 提供免费的公共仓库帐户，但对私有仓库（例如那些需要保留知识产权的仓库）收费。\n\n### 基于实践的介绍\n\n在本指南中，我在 GitHub 上创建了一个名为\
  \ *test* 的仓库。最初，它只包含一个 `README.md` 文件，其中包含对“test”项目的简短描述。\n\n\n\n\n如图 3-5 所示，几乎所有操作都是本地操作。Git\
  \ 在存储每个文件之前都会对其执行校验和。校验和确保 Git 能够察觉在 Git 自身之外进行的任何修改，包括文件系统损坏。Git 使用 40 字符的哈希码作为校验和。这有助于\
  \ Git 跟踪本地仓库与远程仓库之间的变更，从而支持各种本地操作。\n\n![Git 工作流，左箭头标记为从远程仓库克隆到本地仓库、暂存区和工作目录，右箭头标记为从工作目录通过\
  \ commit –a 提交到本地仓库。](img/c03f005.jpg)\n\n**图 3-5****：** Git 基本工作流\n\n## 克隆仓库（`git\
  \ clone`）\n\n克隆仓库意味着在本地文件系统上复制仓库中的所有文件，以及该项目的变更历史。此操作只需执行一次。要克隆仓库，请执行命令 `git clone`\
  \ 后跟完整的仓库名称：\n\n```\nmolloyd@ebb:~$ cd ~/\nmolloyd@ebb:~$ git clone https://github.com/derekmolloy/test.git\n\
  Cloning into 'test'…\nremote: Counting objects: 20, done.\nremote: Total 20 (delta\
  \ 0), reused 0 (delta 0), pack-reused 20\nUnpacking objects: 100% (20/20), done.\
  \ \n```\n\n现在，你在 `/test/` 目录中拥有了 test 仓库的完整副本。你的仓库与 GitHub 服务器上的版本一样完整；如果你将其部署到网络、文件系统、其他\
  \ Git 服务器甚至不同的 GitHub 账户上，它都可以承担该仓库主版本的角色。虽然不需要中央服务器，但通常情况如此，因为它允许多个用户将源代码“签入”到已知的主仓库中。仓库创建在\
  \ `/test/` 目录中，当前包含以下内容：\n\n```\nmolloyd@ebb:~/test$ ls -al\ntotal 20\ndrwxr-xr-x\
  \ 3 molloyd molloyd 4096 May  4 23:18 .\ndrwxr-xr-x 4 molloyd molloyd 4096 May \
  \ 4 23:16 ..\ndrwxr-xr-x 8 molloyd molloyd 4096 May  4 23:16 .git\n-rw-r--r-- 1\
  \ molloyd molloyd    4 May  4 23:16 .gitignore\n-rw-r--r-- 1 molloyd molloyd   59\
  \ May  4 23:16 README.md \n```\n\n你可以看到在 GitHub 上初始化项目时创建的 `README.md` 文件；可以使用 `more`\
  \ 查看该文件的内容。该目录还包含一个隐藏的 `.git` 子目录，其中包含以下文件和目录：\n\n```\nmolloyd@ebb:~/test$ cd .git\n\
  molloyd@ebb:~/test/.git$ ls\nbranches  config   description  HEAD  hooks  index\
  \  info\nlogs      objects  packed-refs  refs \n```\n\n隐藏的 `.git` 文件夹包含仓库的所有信息，例如提交消息、日志和数据对象。例如，远程仓库的位置保存在\
  \ `config` 文件中。\n\n```\nmolloyd@ebb:~/test/.git$ more config | grep url\n      \
  \  url = https://github.com/derekmolloy/test.git \n```\n\n本章末尾的“延伸阅读”部分将引导你阅读一本关于\
  \ Git 的优秀书籍，该书可在线免费获取，详细描述了 `.git` 目录结构的性质。幸运的是，在接下来的讨论中，你无需修改 `.git` 目录结构，因为 Git\
  \ 命令会为你完成这些操作。\n\n## 查看状态（`git status`）\n\n现在仓库已存在，下一步是将一个新的文本文件添加到工作目录中，该文件将处于未跟踪状态。当你调用命令\
  \ `git status` 时，可以看到一条消息，指出存在“未跟踪的文件”。\n\n```\nmolloyd@ebb:~/test$ echo \"Just\
  \ some text\" > newfile.txt\nmolloyd@ebb:~/test$ git status\nOn branch master\n\
  Your branch is up-to-date with 'origin/master'.\nUntracked files:\n  (use \"git\
  \ add <file>…\" to include in what will be committed)\n        newfile.txt\nnothing\
  \ added to commit but untracked files present (use \"git add\" to track) \n```\n\
  \n下一步是将任何未跟踪的文件添加到暂存区。但是，如果你不想添加一组文件，也可以创建一个 `.gitignore` 文件来忽略这些文件。例如，如果你正在构建 C/C++\
  \ 项目，并且决定不添加中间 `.o` 文件，这将非常有用。以下是一个创建 `.gitignore` 文件以忽略 C/C++ `.o` 文件的示例：\n\n```\n\
  molloyd@ebb:~/test$ echo \"*.o\" > .gitignore\nmolloyd@ebb:~/test$ more .gitignore\n\
  *.o\nmolloyd@ebb:~/test$ touch testobject.o\nmolloyd@ebb:~/test$ git status\nOn\
  \ branch master\nYour branch is up-to-date with 'origin/master'.\nUntracked files:\n\
  \  (use \"git add <file>…\" to include in what will be committed)\n        newfile.txt\n\
  nothing added to commit but untracked files present (use \"git add\" to track) \n\
  ```\n\n在这种情况下，有两个文件未跟踪，但没有提到 `testobject.o` 文件，因为它被正确忽略了。请注意，`.gitignore` 文件本身是仓库的一部分，因此在克隆仓库时会保留，连同其修订历史等。\n\
  \n## 添加到暂存区（`git add`）\n\n现在可以通过输入 `git add` 将工作目录中的文件添加到暂存区。\n\n此命令会添加工作目录中的所有文件，但被忽略的文件除外。在此示例中，两个文件从工作目录添加到暂存区，然后可以使用以下命令显示仓库的状态：\n\
  \n```\nmolloyd@ebb:~/test$ git add .\nmolloyd@ebb:~/test$ git status\nOn branch\
  \ master\nYour branch is up-to-date with 'origin/master'.\nChanges to be committed:\n\
  \  (use \"git reset HEAD <file>…\" to unstage)\n       new file:   .gitignore\n\
  \       new file:   newfile.txt \n```\n\n要从暂存区删除（*r*e*m*ove）文件，请使用 `git rm somefile.ext`。\n\
  \n## 提交到本地仓库（`git commit`）\n\n将文件添加到暂存区后，你可以将更改从暂存区提交到本地 Git 仓库。首先，你可能需要添加你的姓名和电子邮件地址变量，以标识谁在提交更改。\n\
  \n```\nmolloyd@ebb:~/test$ git config --global user.name \"Derek Molloy\"\nmolloyd@ebb:~/test$\
  \ git config --global user.email \" derek@myemail.com\" \n```\n\n这些值针对你的 Linux 用户账户设置，因此下次登录时会保留。你可以通过输入\
  \ `more ~/.gitconfig` 来查看它们。\n\n要永久地将文件添加提交到本地 Git 仓库，请使用 `git commit` 命令。\n\n```\n\
  molloyd@ebb:~/test$ git commit -m \"Testing repository for BeagleBone\"\n[master\
  \ b2137ee] Testing repository for BeagleBone\n 2 files changed, 2 insertions(+)\n\
  \ create mode 100644 newfile.txt\n create mode 100644 .gitignore \n```\n\n更改会使用用户名进行标记，并且还需要一条消息。如果你想内联详细说明消息，请使用\
  \ `-m` 设置提交消息。\n\n## 推送到远程仓库（`git push`）\n\n要执行此步骤，你必须拥有自己的 GitHub 账户。`git push`\
  \ 命令将任何代码更新推送到远程仓库。你必须注册才能对远程仓库进行更改，以便应用更改。在 Git 2.0 中，采用了一种更保守的新方法，称为 *simple*，用于推送到远程仓库。默认情况下会选择它，但可以消除警告消息，并按如下方式执行推送（将用户详细信息和仓库名称替换为你自己的账户详细信息）：\n\
  \n```\nmolloyd@ebb:~/test$ git config --global push.default simple\nmolloyd@ebb:~/test$\
  \ git push\nUsername for 'https://github.com': derekmolloy\nPassword for 'https://derekmolloy@github.com':\
  \ mySuperSecretPassword\nCounting objects: 4, done.\nCompressing objects: 100% (2/2),\
  \ done.\nWriting objects: 100% (4/4), 350 bytes | 0 bytes/s, done.\nTotal 4 (delta\
  \ 0), reused 0 (delta 0)\nTo https://github.com/derekmolloy/test.git\n   61b6ee4..b2137ee\
  \  master -> master \n```\n\n\n\n代码推送到远程仓库后，你可以通过在任何机器的本地仓库目录中执行 `git pull` 命令，将更改拉取回本地仓库。\n\
  \n```\nmolloyd@ebb:~/test$ git pull\nAlready up-to-date. \n```\n\n在这个例子中，一切已经是最新状态。\n\
  \n### Git 分支\n\nGit 支持分支的概念，这使你能够在项目中处理多个不同版本的文件集。例如，要在项目中开发一个新功能（版本 2），同时维护当前版本（版本\
  \ 1）的代码，你可以创建一个新分支（版本 2）。对版本 2 所做的新功能和更改不会影响版本 1 中的代码。然后你可以轻松地在分支之间切换。\n\n#### 创建分支（`git\
  \ branch`）\n\n假设你想创建一个名为 `mybranch` 的新分支；你可以使用命令 `git branch mybranch` 来创建，然后使用\
  \ `git checkout mybranch` 切换到该分支，如下所示：\n\n```\nmolloyd@ebb:~/test$ git branch mybranch\n\
  molloyd@ebb:~/test$ git checkout mybranch\nSwitched to branch 'mybranch' \n```\n\
  \n现在，为了演示其工作原理，假设向仓库中添加了一个名为 `testmybranch.txt` 的临时文件。这可能是你项目的一个新代码文件。你可以看到分支的状态清楚地表明工作目录中包含一个未跟踪的文件。\n\
  \n```\nmolloyd@ebb:~/test$ touch testmybranch.txt\nmolloyd@ebb:~/test$ ls\nnewfile.txt\
  \  README.md  testmybranch.txt  testobject.o\nmolloyd@ebb:~/test$ git status\nOn\
  \ branch mybranch\nUntracked files:\n  (use \"git add <file>…\" to include in what\
  \ will be committed)\n        testmybranch.txt\nnothing added to commit but untracked\
  \ files present (use \"git add\" to track) \n```\n\n然后你可以使用相同的命令将这个新文件添加到分支的暂存区。\n\
  \n```\nmolloyd@ebb:~/test$ git add .\nmolloyd@ebb:~/test$ git status\nOn branch\
  \ mybranch\nChanges to be committed:\n  (use \"git reset HEAD <file>…\" to unstage)\n\
  \        new file:   testmybranch.txt \n```\n\n你可以将此更改提交到本地仓库的 `mybranch` 分支。此更改会影响\
  \ `mybranch` 分支，但对 master 分支没有影响。\n\n```\nmolloyd@ebb:~/test$ git commit -m \"Test\
  \ commit to mybranch\"\n[mybranch 63cae5f] Test commit to mybranch\n 1 file changed,\
  \ 0 insertions(+), 0 deletions(-)\n create mode 100644 testmybranch.txt\nmolloyd@ebb:~/test$\
  \ git status\nOn branch mybranch\nnothing to commit, working tree clean\nmolloyd@ebb:~/test$\
  \ ls\nnewfile.txt  README.md  testmybranch.txt  testobject.o \n```\n\n从上面的输出可以看出，文件\
  \ `testmybranch.txt` 已提交到本地仓库，并且你可以在目录中看到该文件。\n\n如果你现在使用 `git checkout master` 从\
  \ `mybranch` 分支切换到 master 分支，你会发现当请求目录列表时会发生一些有趣的事情。\n\n```\nmolloyd@ebb:~/test$\
  \ git checkout master\nSwitched to branch 'master'\nYour branch is up-to-date with\
  \ 'origin/master'.\nmolloyd@ebb:~/test$ ls\nnewfile.txt  README.md  testobject.o\
  \ \n```\n\n是的，文件 `testmybranch.txt` 从目录中消失了！它仍然存在，但以 blob 形式存在于 `.git/objects/`\
  \ 目录中。如果你返回该分支并列出目录，你会看到以下内容：\n\n```\nmolloyd@ebb:~/test$ git checkout mybranch\n\
  Switched to branch 'mybranch'\nmolloyd@ebb:~/test$ ls\nnewfile.txt  README.md  testmybranch.txt\
  \  testobject.o \n```\n\n文件现在重新出现。因此，你可以看到分支系统的集成程度有多高。此时，你可以回到 master 分支并对原始代码进行更改，而\
  \ `mybranch` 分支中的更改不会对 master 代码产生任何影响。即使你在同一个文件中更改代码，也不会影响 master 分支中的原始代码。\n\n\
  #### 合并分支（`git merge`）\n\n如果你想将 `mybranch` 分支中所做的更改应用到 master 项目中，该怎么办？你可以通过使用 `git\
  \ merge` 来实现。\n\n```\nmolloyd@ebb:~/test$ git checkout master\nSwitched to branch\
  \ 'master'\nYour branch is up-to-date with 'origin/master'.\nmolloyd@ebb:~/test$\
  \ git merge mybranch\nUpdating b2137ee..63cae5f\nFast-forward\n testmybranch.txt\
  \ | 0\n 1 file changed, 0 insertions(+), 0 deletions(-)\n create mode 100644 testmybranch.txt\n\
  molloyd@ebb:~/test$ git status\nOn branch master\nYour branch is ahead of 'origin/master'\
  \ by 1 commit.\n  (use \"git push\" to publish your local commits)\nnothing to commit,\
  \ working tree clean\nmolloyd@ebb:~/test$ ls\nnewfile.txt  README.md  testmybranch.txt\
  \  testobject.o \n```\n\n现在 `testmybranch.txt` 文件位于 master 分支中，并且对 master 中其他文档所做的任何更改都已应用。本地仓库现在比远程仓库领先一个提交，你可以使用\
  \ `git push` 来更新远程仓库。\n\n#### 删除分支（`git branch -d`）\n\n如果你想删除一个分支，请使用 `git branch\
  \ -d mybranch` 命令。\n\n```\nmolloyd@ebb:~/test$ git branch -d mybranch\nDeleted branch\
  \ mybranch (was 63cae5f).\nmolloyd@ebb:~/test$ ls\nnewfile.txt  README.md  testmybranch.txt\
  \  testobject.o \n```\n\n在这种情况下，文件 `testmybranch.txt` 仍然存在于 master 项目中——这是应该的，因为该分支已与\
  \ master 项目合并。如果在执行合并之前删除了该分支，该文件就会丢失。\n\n### 常用 Git 命令\n\n表 3-8 总结了主要的 Git 命令。至此，你已经了解了\
  \ Git 的核心用法。如果你直接在 Beagle 板上开发代码，Git 会非常有用，因为你可以轻松地将你的开发成果推送到远程仓库。这一功能在备份代码以及将代码重新部署到多个板子上时非常有用。\n\
  \n| **操作** | **描述** | **操作** | **描述** |\n| --- | --- | --- | --- |\n| `git clone`\
  \ | 从远程仓库克隆。 | `git rm` | 从暂存区删除文件或目录。 |\n| `git init` | 创建一个全新的仓库。 | `git mv` |\
  \ 在暂存区移动或重命名文件或文件夹。 |\n| `git pull` | 从主仓库合并更改。 | `git log` | 显示提交日志。项目历史记录。 |\n\
  | `git fetch` | 查找主仓库中已更改的内容（不合并）。 | `git tag` | 为提交命名（例如，版本 2）。 |\n| `git status`\
  \ | 显示项目状态。 | `git merge [name]` | 合并分支。 |\n| `git add` | 添加新文件或编辑现有文件。 | `git show`\
  \ | 获取当前或其他提交的详细信息。 |\n| `git diff` | 显示将要提交的差异。 | `git branch [name]` | 创建新分支。（使用\
  \ `-d` 删除。） |\n| `git commit` | 提交到仓库。 | `git checkout [name]` | 切换到不同的分支。 |\n|\
  \ `git push` | 将更改从本地仓库推送到远程仓库。 |  |  |\n\n**表 3-8****：**主要 Git 命令总结\n\n## 桌面虚拟化\n\
  \nBeagleBone 和 BeagleBoard 是功能强大的通用计算平台，但如果你计划构建 Linux 内核或进行跨平台开发（参见第 7 章），强烈建议使用基于\
  \ PC 的 Linux 安装。你可以使用单启动/双启动 Linux PC，或者如果你使用的是 Windows/Mac 原生系统，则应考虑桌面虚拟化。\n\n\
  桌面*虚拟化*使单台桌面计算机能够同时运行多个操作系统实例。它使用称为*虚拟机监控程序*的技术，该技术由硬件、固件和软件元素组成，用于创建和运行软件模拟的机器，称为*虚拟机*（VM）。如果你想在一台计算机上运行多个操作系统实例，VM\
  \ 提供了创建多启动配置的替代方案。\n\n\n\n\n在虚拟化技术中，通常存在两个或更多不同的操作系统实例。*宿主机*操作系统是物理机上最初安装的那个。然后使用虚拟机监控程序在虚拟机内创建一个*客户机*操作系统。图\
  \ 3-6 展示了一台运行 Windows 的宿主机桌面计算机，其窗口内运行着一个客户机 Debian 64 位 Linux Stretch 虚拟机。该 Debian\
  \ 安装有 Cairo-Dock 桌面界面。\n\n![图片描述见标题和周围文字。](img/c03f006.jpg)\n\n**图 3-6****：** VirtualBox\
  \ 在 Windows 宿主机上运行 Debian 9.4 作为客户机操作系统，并通过 SSH 会话连接到 PocketBeagle 板\n\n市面上有许多虚拟化产品，但大多数成本高昂、拥有专有许可证，并且对支持的客户机和宿主机操作系统类型有限制。两款最流行的\
  \ Linux 桌面虚拟化产品是 VMware Player 和 VirtualBox。VMware Player（[www.vmware.com/products/player/](http://www.vmware.com/products/player/)）供个人免费使用。VirtualBox（[www.virtualbox.org](http://www.virtualbox.org)）以\
  \ GNU GPLv2 许可证提供（某些功能在专有许可证下免费提供）。\n\n这两款产品都使用*托管型虚拟机监控程序*（类型 2）进行虚拟化，这意味着它们运行在常规操作系统内，使您可以同时使用两台机器。VirtualBox\
  \ 可在 Windows、macOS 和 Linux 机器上运行，并可用于托管 Linux、Windows 和 macOS 等客户机操作系统。目前，VMware\
  \ Player 不支持在 macOS 宿主机上安装；您需要购买名为 VMware Fusion 的产品。\n\n这两款产品功能强大，难以区分；不过，VirtualBox\
  \ 以 GPL 许可证发布，并支持一项名为*快照*的有用功能。通过用户界面，您可以拍摄客户机操作系统的快照并保存以供日后使用。例如，在对客户机操作系统进行重大配置更改之前拍摄快照，这样在出现问题时可以回滚到该配置。快照会存储虚拟机设置、虚拟磁盘内容的更改以及该时刻机器的内存状态。因此，当恢复快照时，虚拟机将从拍摄快照时的同一位置继续运行。\n\
  \n如果安装了 VirtualBox 增强功能，您可以在客户机和宿主机操作系统之间复制粘贴文本、共享目录，甚至动态调整窗口大小。本章的网页（[www.exploringbeaglebone.com/chapter3/](http://www.exploringbeaglebone.com/chapter3/)）提供了在\
  \ Windows 宿主机下安装 Linux 客户机操作系统的建议。\n\n## 本书代码\n\n现在您已经在 VirtualBox 下运行了桌面 Linux\
  \ 安装，或者正在运行常规的 Linux 桌面安装，您可以通过打开 Linux 终端会话/窗口并输入以下命令（在桌面机和 Beagle 板上）来下载本书讨论的所有源代码、脚本和文档：\n\
  \n```\nmolloyd@ebb:~$ sudo apt install git\nmolloyd@ebb:~$ git clone https://github.com/derekmolloy/exploringBB.git\n\
  Cloning into 'exploringBB' …\nmolloyd@ebb:~$ cd exploringBB/\nmolloyd@ebb:~/exploringBB$\
  \ ls\nchp02  chp05  chp08  chp10  chp12  chp14  extras   License.txt\nchp03  chp06\
  \  chp09  chp11  chp13  chp15  library  README.md \n```\n\n如果您想从 Windows 或 macOS\
  \ 下载代码，可以从[windows.github.com](http://windows.github.com)和[mac.github.com](http://mac.github.com)获取用于处理\
  \ GitHub 仓库的图形用户界面。\n\n## 总结\n\n完成本章后，您应该能够做到以下几点：\n\n*   描述嵌入式 Linux 系统的基本概念\n\n\
  *   描述嵌入式 Linux 设备（如 Beagle 板）如何启动 Linux 操作系统\n\n*   描述重要的 Linux 概念，如内核空间、用户空间以及使用\
  \ systemd 进行系统初始化\n\n*   在 Beagle 板上执行 Linux 系统管理任务\n\n*   有效使用 Linux 文件系统\n\n*\
  \   使用一系列 Linux 命令进行文件和进程管理\n\n*   使用 Git 管理自己的软件开发项目\n\n*   使用桌面虚拟化工具（如 VirtualBox）在桌面计算机宿主机操作系统上安装\
  \ Linux 发行版\n\n*   使用 Git 下载本书的源代码\n\n## 延伸阅读\n\n以下资料可帮助您进一步了解嵌入式 Linux、Linux 管理、Git\
