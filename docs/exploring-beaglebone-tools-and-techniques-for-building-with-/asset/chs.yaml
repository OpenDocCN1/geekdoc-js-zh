  PRU 有一个 `constants table`，其中包含一系列常用地址，这些地址常用于内存加载和存储操作。这减少了将内存指针加载到寄存器所需的时间。大多数常量是固定的，但有些可以通过\
  \ PRU 控制寄存器进行编程。常量表将在后续使用，以便 PRU 能够访问 PRU-ICSS 外部的常规 GPIO。\n\n### PRU 汇编指令集\n\n\
  PRU-ICSS 拥有一个相对较小的 RISC `instruction set architecture`（ISA），包含大约 45 条指令，可分为算术运算、逻辑运算、寄存器加载与存储以及程序流程控制。每条指令的简要说明见图\
  \ 15-7。每条指令的完整说明可在 *PRU-ICSS 参考指南* 中找到。\n\n![按算术运算、逻辑运算、寄存器加载与存储以及程序流程控制分类的 PRU\
  \ 指令集汇总表格插图。](img/c15f007.jpg)\n\n**图 15-7****：** PRU 指令集汇总\n\n图片信息来源于德州仪器（Texas\
  \ Instruments）\n\n指令由 `operation code`（`opcode`）和可变数量的操作数组成，其中第三个操作数通常可以是寄存器或 `immediate\
  \ value`（一个简单的数字或可求值为常量的表达式）。以下是一个示例：\n\n```\nADD REG1, REG2, OP(255) \n```\n\n\
  其中 `ADD` 是一个助记符，对应一个操作码（例如，ADD 对应 `0x01`），`REG1` 是目标寄存器，`REG2` 是源寄存器，`OP(255)` 可以是另一个寄存器字段或立即数——对于\
  \ ADD 操作，它必须为或求值为 `0[10]` 到 `255[10]` 范围内的值。以下是一些示例用法（参见 `chp15/pru/testASM/` 项目）：\n\
  \n```\n LDI32      r1, 0x25            ; 设置 r1 = 0x25 = 37（十进制）\n     LDI32   r2,\
  \ 4           ; 设置 r2 = 4（十进制）\n     ADD     r1, r1, 5       ; 设置 r1 = r1 + 5 =\
  \ 42（十进制）\n     ADD     r2, r2, 1<<4    ; 设置 r2 = r2 + 10000（二进制）= 20（十进制）\n   \
  \  ADD     r1, r2, r1.w0   ; 设置 r1 = r2 + r1.w0 = 20 + 42 = 62（十进制）\n     LDI32\
  \   r0, 0x00002000  ; 将 PRU1 数据 RAM1 基地址放入 r0\n     SBBO    &r1, r0, 4, 4   ; 将\
  \ r1 写入存储在 r0 中的地址\n                                    ; 偏移量 = 4 字节，数据大小 = 4 字节\
  \ \n```\n\n如果此示例在 PRU0 上运行，则 `r1` 的值（62[10] = `0x3e`）会被写入 PRU1 数据 RAM1，该 RAM 在 PRU1\
  \ 内存空间中的地址为 `0x00002000`，在 Linux 主机内存空间中的地址为 `0x4A302000`。该值写入时带有 4 字节的偏移量，因此它出现在\
  \ Linux 主机内存空间的地址 `0x4A302004` 处。当使用 4 字节偏移量时，此代码段不会覆盖 `0xEBBFEED2` 值（来自前一个示例）：\n\
  \n```\nroot@ebb:~# /home/debian/devmem2 0x4a302000\nValue at address 0x4A302000\
  \ (0xb6fd9000): 0xEBBFEED2\nroot@ebb:~# /home/debian/devmem2 0x4a302004\nValue at\
  \ address 0x4A302004 (0xb6f85004): 0x3E \n```\n\n## PRU-ICSS 应用\n\n在本节中，将开发几个示例应用来测试\
  \ PRU-ICSS 的性能，并说明如何构建与之交互的 Linux 主机应用。每个应用都会引入 PRU-ICSS 的额外特性，因此即使你不打算构建特定类型的应用，也请务必阅读每一个。\n\
  \n### PRU-ICSS 性能测试\n\n在第 6 章中，描述了一个测试，该测试评估了按下按钮时点亮 LED 的 Linux 用户空间 C/C++ 应用的性能。这里将介绍一组使用\
  \ PRU-ICSS 的类似测试。所有这些测试都使用图 15-2 中所示的电路。测试如下：\n\n*   `汇编按钮按下、LED 响应测试` 位于 `/chp15/pru/perfTestASM/`\
  \ 目录和清单 15-6 中。该测试旨在评估当代码用汇编语言编写时，PRU 对输入的最快响应。\n\n*   `C 语言按钮按下、LED 响应测试` 位于 `/chp15/pru/perfTest/`\
  \ 目录和清单 15-7 中。该测试旨在评估当代码用 C 编程语言编写时，PRU 对输入的最快响应。\n\n*   `高频 LED 闪烁测试` 位于 `/chp15/pru/blinkLED/`\
  \ 目录和清单 15-8 中。该测试旨在以 1 MHz 的频率稳定闪烁 LED。\n\n这些测试考验了 Analog Discovery（5 MHz，50 MSPS）的能力。采样值在图\
  \ 15-8 中以“x”标记表示，间隔为 10 ns（使用曲线拟合来显示输出）。尽管 Analog Discovery 存在不足，但这些图表仍能表明 PRU-ICSS\
  \ 的高性能能力。\n\n![按钮按下 LED 响应测试的截图，分别用（上）C 语言和（下）汇编语言编写，展示了 PRU-ICSS 的高性能能力。](img/c15f008.jpg)\n\
  \n**图 15-8****：** 按钮按下 LED 响应测试，分别用（a）C 语言和（b）汇编语言编写\n\n每个测试都是一个独立的项目及可执行二进制文件。每个代码清单中的注释描述了测试的执行方式。\n\
  \n```\n .cdecls \"perfTestContainer.c\"\n        .clink\n        .global start\n\
  start:\n        CLR     r30, r30.t5      ; 关闭 LED\n        WBS     r31, 3      \
  \     ; 等待位设置——即按钮按下\n        SET     r30, r30.t5      ; 设置输出位——打开 LED\n\n     \
  \   HALT \n```\n\n**清单 15-6：** `/chp15/pru/perfTestASM/perfTestASM.asm`\n\n\n\n\n\
  \n```\n#include <stdint.h>\n#include <pru_cfg.h>\n#include \"resource_table_empty.h\"\
  \n\nvolatile register uint32_t __R30;\nvolatile register uint32_t __R31;\n\nvoid\
  \ main(void) {\n   volatile uint32_t led, button;\n\n   // 使用 pru0_pru_r30_5 作为输出，即\
  \ 100000 或 0x0020\n   led = 0x0020;\n   // 使用 pru0_pru_r31_3 作为按钮，即 1000 或 0x0008\n\
  \   button = 0x0008;\n\n   // 关闭 LED\n   __R30 &= !led;\n\n   // 当按钮按下时停止循环\n  \
  \ while (!(__R31 && button)) {\n      // 什么都不做\n   }\n   // 打开 LED\n   __R30 ^=\
  \ led;\n\n   __halt();\n}\n```\n\n**清单 15-7:** `/chp15/pru/perfTest/perfTest.c`\n\
  \n```\n .cdecls \"main.c\"\n        .clink\n        .global START\n        .asg\
  \ \"48\",  DELAY        ; 需要计入控制逻辑\nSTART:\n        SET     r30, r30.t5\n      \
  \  LDI32   r0, DELAY\nDELAYON:\n        SUB     r0, r0, 1\n        QBNE    DELAYON,\
  \ r0, 0   ; 循环至 DELAYON，除非 REG0=0\nLEDOFF:\n        CLR     r30, r30.t5      ; 清除输出引脚（LED\
  \ 关闭）\n        LDI32   r0, DELAY        ; 将 REG0 重置为延迟长度\n\nDELAYOFF:\n        SUB\
  \     r0, r0, 1        ; REG0 减 1\n        QBNE    DELAYOFF, r0, 0  ; 循环至 DELAYOFF，除非\
  \ REG0=0\n        QBBC    START, r31, 3    ; 按钮是否按下？若未按下则循环\nEND:              \
  \               ; 通知调用程序已完成\n        HALT                     ; 暂停 PRU 程序\n```\n\
  \n**清单 15-8:** `/chp15/pru/perfTestLED/perfTestLED.asm`\n\n各项测试的结果如下：\n\n1.  对于纯汇编程序（清单\
  \ 15-7），LED 在按钮按下后约 39 ns 点亮（使用高分辨率示波器时为 31 ns）——参见图 15-8(b)。为了直观理解这个数值，在这段时间内，光脉冲在自由空间中大约传播了\
  \ 9 米（以 3×10⁸ m/s 计），而声音在空气中仅传播了百分之一毫米（海平面 340 m/s）。后者意味着，这种时间分辨率配合适当的声学传感器，使得 PRU-ICSS\
  \ 能够实现精确的距离测量。图 15-9(a) 使用更高带宽的示波器确认了 Analog Discovery 的测量结果。\n\n2.  对于 C 程序，LED\
  \ 在按钮按下后约 67 ns 点亮——参见图 15-8(a)。对于自动编译为汇编的代码来说，这是一个令人印象深刻的结果。\n\n3.  LED 测试（如图 15-9(b)\
  \ 所示）表明，每个 PRU 可用于以非常高的频率输出用户可配置的信号（注意，PRU-ICSS 还具有专用的时钟输出——例如 192 MHz 的 UART 时钟）。\n\
  \n![使用 20 MHz 示波器进行测量的图表：（左）按钮按下汇编测试，（右）LED 测试，闪烁频率为 1 MHz。](img/c15f009.jpg)\n\n\
  **图 15-9****：** 使用 20 MHz 示波器的测量结果：（a）按钮按下汇编测试，（b）LED 测试，闪烁频率为 1 MHz\n\n重要的是，这些测试均未对\
  \ Linux 主机造成显著的 CPU 或内存负载。要运行这些测试，请选择测试目录（`perfTest`、`perfTestASM` 或 `perfTestLED`），然后使用以下命令：\n\
  \n```\ndebian@ebb:…/chp15/pru/perfTestASM$ make\ndebian@ebb:…/chp15/pru/perfTestASM$\
  \ sudo make install_PRU0\n```\n\n### 利用常规 Linux GPIO\n\n每个 PRU 都连接到一个 OCP 主端口，如图\
  \ 15-1 所示，该端口允许访问 Linux 主机设备上的内存地址。此功能使 PRU 能够操纵第 6 章中使用的常规 GPIO 的状态。第一步是使用以下指令启用\
  \ OCP 主端口：\n\n```\nLBCO  &r0, C4, 4, 4  ; 将 SYSCFG 寄存器加载到 r0（使用 c4 常量地址）\nCLR  \
  \ r0,  r0, 4     ; 清除第 4 位（STANDBY_INIT）\nSBCO  &r0, C4, 4, 4  ; 将修改后的 r0 存回加载地址\n\
  ```\n\n这里，`c4` 指的是常量表中的第 4 项，即 PRU_ICSS CFG（本地）地址。因此，偏移量 4 指向 `SYSCFG` 寄存器。`CLR`\
  \ 指令将第 4 位（`STANDBY_INIT`）设置为 `0`，从而在将 `r0` 通过 `SBCO`（使用常量表偏移量的存储字节突发）指令写回 `SYSCFG`\
  \ 寄存器时启用 OCP 主端口。\n\n下一步是确定 GPIO 的显式 Linux 主机内存地址——这在第 6 章的“基于内存的 GPIO 切换”特性中有所描述。可以使用以下地址和偏移量定义\
  \ GPIO 组地址和状态：\n\n```\n.asg  0x44e07000, GPIO0     ; GPIO 组 0，参见 AM335x TRM\n.asg\
  \  0x4804c000, GPIO1     ; GPIO 组 1，表 2.2 外设映射\n.asg  0x481ac000, GPIO2     ; GPIO\
  \ 组 2，\n.asg  0x481ae000, GPIO3     ; GPIO 组 3，\n.asg  0x190, GPIO_CLRDATAOUT; 用于清除\
  \ GPIO 寄存器\n.asg  0x194, GPIO_SETDATAOUT; 用于设置 GPIO 寄存器\n.asg  0x138, GPIO_DATAIN\
  \    ; 用于读取 GPIO 寄存器\n.asg  1<<30, GPIO0_30       ; P9_11 gpio0[30] 输出 - 第 30 位\n\
  .asg  1<<31, GPIO0_31       ; P9_13 gpio0[31] 输入 - 第 31 位\n```\n\nPRU 代码如清单 15-9\
  \ 所示。它与清单 15-8 类似，不同之处在于 GPIO 地址必须加载到寄存器中并在位级别进行操作。此处未列出 C 代码，因为它与清单 15-2 类似。但完整项目可在\
  \ `/chp15/pru/ledFlashASM_OCP/` 仓库目录中找到。\n\n```\n; 该程序在 P9_11/P2.05 上闪烁 LED，直到按下连接到\
  \ P9_13/P2.07 的按钮。\n  .cdecls \"main.c\"\n  .clink\n  .global START\n  .asg  \"\
  5000000\",  DELAY\n  .asg  0x44e07000, GPIO0       ; GPIO 组 0，参见 AM335x TRM\n  .asg\
  \  0x4804c000, GPIO1       ; GPIO 组 1，表 2.2 外设映射\n  .asg  0x481ac000, GPIO2    \
  \   ; GPIO 组 2，\n  .asg  0x481ae000, GPIO3       ; GPIO 组 3，\n  .asg  0x190, GPIO_CLRDATAOUT\
  \  ; 用于清除 GPIO 寄存器\n  .asg  0x194, GPIO_SETDATAOUT  ; 用于设置 GPIO 寄存器\n  .asg  0x138,\
  \ GPIO_DATAIN      ; 用于读取 GPIO 寄存器\n  .asg  1<<30, GPIO0_30         ; P9_11/P2.05\
  \ gpio0[30] 输出 - 第 30 位\n  .asg  1<<31, GPIO0_31         ; P9_13/P2.07 gpio0[31]\
  \ 输入 - 第 31 位\n  .asg  32, PRU0_R31_VEC_VALID  ; 允许通知程序完成\n  .asg  3,  PRU_EVTOUT_0\
  \        ; 发送回的事件编号\n\nSTART:\n     ; 启用 OCP 主端口\n     LBCO    &r0, C4, 4, 4   \
  \ ; 将 SYSCFG 寄存器加载到 r0（使用 c4 常量地址）\n     CLR     r0,  r0, 4       ; 清除第 4 位（STANDBY_INIT）\n\
  \     SBCO    &r0, C4, 4, 4    ; 将修改后的 r0 存回加载地址\n\nMAINLOOP:\n     LDI32   r1,\
  \ (GPIO0|GPIO_SETDATAOUT)  ; 加载 GPIO 设置数据的地址到 r1\n     LDI32   r2, GPIO0_30    \
  \ ; 将 GPIO0_30 写入 r2\n     SBBO    &r2, r1, 0, 4    ; 将 r2 写入 r1 地址值 - LED 亮\n \
  \    LDI32    r0, DELAY        ; 将延迟长度存入 REG0\nDELAYON:\n     SUB     r0, r0, 1\n\
  \     QBNE    DELAYON, r0, 0   ; 循环至 DELAYON，除非 REG0=0\nLEDOFF:\n     LDI32   r1,\
  \ (GPIO0|GPIO_CLRDATAOUT) ; 加载 GPIO 清除数据的地址\n     LDI32   r2, GPIO0_30     ; 将 GPIO_30\
  \ 写入 r2\n     SBBO    &r2, r1, 0, 4    ; 将 r2 写入 r1 地址 - LED 灭\n     LDI32   r0,\
  \ DELAY        ; 将 REG0 重置为延迟长度\nDELAYOFF:\n     SUB     r0, r0, 1        ; REG0\
  \ 减 1\n     QBNE    DELAYOFF, r0, 0  ; 循环至 DELAYOFF，除非 REG0=0\n\n     LDI32   r5,\
  \ (GPIO0|GPIO_DATAIN)   ; 加载 DATAOUT 的读取地址\n     LBBO    &r6, r5, 0, 4    ; 将 r5\
  \ 处的值加载到 r6\n     QBBC    MAINLOOP, r6, 31 ; 按钮是否按下？若未按下则循环\nEND:              \
  \            ; 通知已完成\n     LDI32   R31, (PRU0_R31_VEC_VALID|PRU_EVTOUT_0)\n    \
  \   HALT                    ; 暂停 PRU 程序\n```\n\n**清单 15-9:** `/chp15/pru/ledFlashASM_OCP/ledFlashASM_OCP.asm`\n\
  \n\n\n\n有两个常规 GPIO 引脚：P9_11/P2.05（输出）和 P9_13/P2.07（输入）。P9_11/P2.05 引脚应连接到 FET 栅极输入，P9_13/P2.07\
  \ 应连接到按钮，如图 15-2 所述。在运行应用程序之前，请确保 GPIO 配置如下：\n\n```\nroot@ebb:~/PRU# config-pin\
  \ -a P9_11 out\nroot@ebb:~/PRU# config-pin -q P9_11\nP9_11 Mode: gpio Direction:\
  \ out Value: 0\nroot@ebb:~/PRU# config-pin -a P9_11 hi\nroot@ebb:~/PRU# config-pin\
  \ -a P9_11 lo\nroot@ebb:~/PRU# config-pin -q P9_13 in-\nP9_13 Mode: default Direction:\
  \ in Value: 0 \n```\n\n执行时，代码将输出类似于图 15-9(b) 所示的结果。\n\n```\n…/chp15/pru/ledFlashASM_OCP$\
  \ make\n…/chp15/pru/ledFlashASM_OCP$ sudo make install_PRU0 \n```\n\n### PRU PWM\
  \ 发生器\n\n如第 6 章所述，PWM 有许多应用，例如电机和照明控制，并且 Beagle 板卡上提供了硬件 PWM 支持，可直接从 Linux 用户空间访问。然而，sysfs\
  \ 在调整占空比时速度较慢，并且容易出现与常规 GPIO 相同的延迟问题。在下一节中，PWM 用于通过快速改变高频开关数字输出的占空比（随时间循环变化）来输出正弦波信号。在本节中，我们通过设置具有恒定占空比的方波来为这一应用做准备。\n\
  \n清单 15-10 是汇编代码的 Linux 容器代码。它还使用 `main()` 函数来传递 PWM 占空比百分比和延迟因子（即每个周期 100 个样本中每个样本应有多少条指令\
  \ × 5 ns）。清单 15-10 中的代码传递的值将产生一个占空比为 75%、周期约为 11 µs 的 PWM 信号（即每个周期 100 个样本 × 每个样本\
  \ 10 个延迟步长 × 每个延迟 2 条指令 × 每条指令 5 ns + 循环开销）。\n\n```\n#include <stdint.h>\n#include\
  \ <pru_cfg.h>\n#include <pru_ctrl.h>\n#include \"resource_table_empty.h\"\n\n#define\
  \ PRU0_DRAM   0x00000\nvolatile unsigned int *shared = (unsigned int *)(PRU0_DRAM);\n\
  \nextern void START(void);\n\nvoid main(void) {\n   // 将 PWM 百分比（0-100）和延迟因子复制到\
  \ PRU 内存中\n   shared[0] = 75;\n   // 延迟因子——将其写入内存中的下一个字位置（即 4 字节之后）\n   shared[1]\
  \ = 10;\n   START();\n} \n```\n\n**清单 15-10:** `/exploringbb/chp15/pru/pwm/main.c`\n\
  \n汇编代码如清单 15-11 所示。它包含一个主循环，该循环在每个信号周期循环一次，直到按下连接到 `r31.t3` 的按钮。主循环内部有两个嵌套循环。一个循环迭代信号为高电平的样本数，另一个循环迭代信号为低电平的样本数。嵌套迭代的总数为\
  \ 100，每次迭代都有一个用户可配置的延迟。\n\n```\n; 由 Derek Molloy 为 Exploring BeagleBone v2 编写\n\
  ; 该程序根据 0x00000000（百分比）和 0x00000004（延迟）中的值，将 PRU 用作 PWM 控制器\n  .cdecls \"main.c\"\
  \n  .clink\n  .global START\n  .asg  32, PRU0_R31_VEC_VALID  ; 允许通知程序完成\n  .asg\
  \  3,  PRU_EVTOUT_0        ; 发送回的事件编号\n\nSTART:\n        ; 将 C 程序设置的内存读取到寄存器中\n\
  \        ; r1 - 读取 PWM 高电平百分比（0-100）\n        LDI32   r0, 0x00000000     ; 加载内存地址\n\
  \        LBBO    &r1, r0, 0, 4      ; 将百分比值加载到 r1\n        ; r2 - 加载采样时间延迟\n   \
  \     LDI32   r0, 0x00000004     ; 加载内存地址\n        LBBO    &r2, r0, 0, 4      ;\
  \ 将步进延迟值加载到 r2\n        ; r3 - 信号为低电平的 PWM 百分比（100-r1）\n        LDI32   r3, 100\
  \            ; 将 100 加载到 r3\n        SUB     r3, r3, r1         ; 从 100 中减去 r1（高电平）\n\
  MAINLOOP:\n        MOV     r4, r1             ; 起始计数器为高电平步数\n        SET     r30,\
  \ r30.t5        ; 设置输出 P9_27/P2.34 为高电平\nSIGNAL_HIGH:\n        MOV     r0, r2  \
  \           ; 延迟步长 - 上面加载的 r2\nDELAY_HIGH:\n        SUB     r0, r0, 1          ;\
  \ 递减延迟循环计数器\n        QBNE    DELAY_HIGH, r0, 0  ; 重复直到步进延迟完成\n        SUB     r4,\
  \ r4, 1          ; 信号高电平持续了一个步进\n        QBNE    SIGNAL_HIGH, r4, 0 ; 重复直到信号高电平步数完成\n\
  \        ; 现在信号将变为低电平，持续 100%-r1% - 即 r3\n        MOV     r4, r3             ; 加载低电平步数\n\
  \        CLR     r30, r30.t5        ; 设置输出 P9_27/P2.34 为低电平\nSIGNAL_LOW:\n     \
  \   MOV     r0, r2             ; 延迟步长 - 上面加载的 r2\nDELAY_LOW:\n        SUB     r0,\
  \ r0, 1          ; 递减循环计数器\n        QBNE    DELAY_LOW, r0, 0   ; 重复直到步进延迟完成\n  \
  \      SUB     r4, r4, 1          ; 信号低电平持续了一个步进\n        QBNE    SIGNAL_LOW, r4,\
  \ 0  ; 重复直到信号低电平百分比完成\n\n        QBBS    END, r31, 3        ; 如果按下 P9_28/P2.30 上的按钮则退出\n\
  \        QBA     MAINLOOP           ; 否则永远循环\nEND:                             \
  \  ; 程序结束，发送回中断\n        LDI32   R31, (PRU0_R31_VEC_VALID|PRU_EVTOUT_0)\n      \
  \  HALT                       ; 暂停 PRU 程序 \n```\n\n**清单 15-11:** `/exploringbb/chp15/pru/pwm/pwm.asm`\n\
  \n电路连接如图 15-2 所示，本示例使用相同的引脚配置。电路的输出显示在图 15-10 中。在 P9_27/P2.34 输出引脚上添加了一个简单的低通滤波器，结果得到图\
  \ 15-2 中的“低通滤波输出”信号。在本示例中，RC 滤波器由一个连接到 P9_27/P2.34 的 4.7 kΩ 电阻和一个从电阻输出侧连接到 GND 的\
  \ 0.1 μF 电容组成（即*不是*直接连接在 P9_27/P2.34 和 GND 之间）。RC 滤波器产生一个时间平均输出，该输出代表占空比。例如，如果 PWM\
  \ 占空比为 75%，则 RC 滤波器的输出电压约为 0.75 × 3.3 V = 2.625 V，如图 15-10 所示。\n\n![PWM 发生器低通滤波输出的截图：（左）75%\
  \ 占空比和（右）25% 占空比。](img/c15f010.jpg)\n\n**图 15-10****：** PWM 发生器输出：（a）75% 占空比（~2.5V）和（b）25%\
  \ 占空比（0.8V）\n\n相同的示例在清单 15-12 中使用 C 代码构建，代码可能更容易理解。\n\n```\n#include <stdint.h>\n\
  #include <pru_cfg.h>\n#include \"resource_table_empty.h\"\n\n// 定义 PWM 频率的延迟因子\n\
  #define DELAYFACTOR 10\nvolatile register uint32_t __R30;\nvolatile register uint32_t\
  \ __R31;\n\nvoid main(void) {\n   volatile uint32_t gpio, button;\n   uint32_t percent,\
  \ count;\n\n   // 正半周期的 PWM 百分比（0-100）\n   percent = 75;\n   // 使用 pru0_pru_r30_5\
  \ 作为输出，即 100000 或 0x0020\n   gpio = 0x0020;\n   // 使用 pru0_pru_r31_3 作为按钮，即 1000\
  \ 或 0x0008\n   button = 0x0008;\n\n   // 当按钮按下时停止循环\n   while (!(__R31 && button))\
  \ {\n      for(count=0; count<100; count++) {\n         // 使用两次比较来均衡时序\n       \
  \  if(count<=percent) { __R30 |=  gpio;    }\n         if(count> percent) { __R30\
  \ &= (~gpio);  }\n         __delay_cycles(DELAYFACTOR);\n      }\n   }\n   __halt();\n\
  } \n```\n\n**清单 15-12:** `/exploringbb/chp15/pru/pwmC/pwmC.c`\n\n有趣的是，这个示例展示了在尝试保持精确时序的同时，用\
  \ C 语言为 PRU 编写代码所面临的挑战。例如，以下代码行：\n\n\n\n\n```\n if(count<=percent) { __R30 |=  gpio;\
  \   }\n         if(count> percent) { __R30 &= (~gpio); } \n```\n\n通常会被写成这样：\n\n\
  ```\n if(count<=percent) { __R30 |=  gpio;   }\n         else { __R30 &= (~gpio);\
  \  } \n```\n\n然而，在测试后一段代码时，时序并不一致，并且会产生一个与占空比成正比的偏差。通过使用两个 `if()` 语句，时序在整个占空比范围内得到了平衡。\n\
  \n图 15-11 展示了 PWM C 程序运行时的情形，其中使用高带宽示波器确认了 图 15-10 中观察到的一致性。\n\n![使用 PWM C 程序生成的\
  \ PWM 发生器输出波形图：（左）25% 占空比，（右）75% 占空比。](img/c15f011.jpg)\n\n**图 15-11****：** 使用 PWM\
  \ C 程序生成的 PWM 发生器输出：（a）25% 占空比，（b）75% 占空比\n\n### 一个 PRU 正弦波发生器\n\n上一节中的 PRU PWM\
  \ 发生器代码可以经过调整，在 GPIO 引脚上生成用户自定义的波形。这是通过快速随时间改变 PWM 信号占空比，并将输出通过低通滤波器来实现的。图 15-10\
  \ 展示了这样一个电路的输出，其中使用了一个 4.7 kΩ 电阻和一个 4.7 nF 电容来构成所需的低通滤波器。平滑效果实际上比之前的 RC 元件值持续时间更短。图\
  \ 15-12(a) 显示了占空比随时间变化的 PWM 信号。低通滤波后的输出显示在 图 15-12(b) 中，可以明显看出它很好地近似于正弦波形信号。完整项目位于\
  \ `chp15/pru/sineWave/` 目录下。\n\n![不同时基下用户自定义正弦波形输出图：（左）包含 PWM 信号，（右）仅低通输出。](img/c15f012.jpg)\n\
  \n**图 15-12****：** 不同时基下用户自定义正弦波形输出：（a）包含 PWM 信号，（b）仅低通输出\n\nPRU C 代码见清单 15-13。该代码的主要新颖之处在于生成了一组\
  \ 100 个值，代表正弦波的一个周期。正弦波周期的值被设计为振幅 50、偏移 +50，这样输出可以直接用作上一节描述的 PWM 发生器代码的占空比百分比值。\n\
  \n```\n#include <stdint.h>\n#include <pru_cfg.h>\n#include \"resource_table_empty.h\"\
  \n#include <math.h>\n\n// 定义 PWM 频率的延迟因子\n#define DELAYFACTOR 0\nvolatile register\
  \ uint32_t __R30;\nvolatile register uint32_t __R31;\n\nvoid main(void) {\n   volatile\
  \ uint32_t gpio, button;\n   uint32_t count, i;\n   uint32_t waveform[100];\n  \
  \ float gain = 50.0f;                   // 希望覆盖整个范围 0-99\n   float phase = 0.0f;\
  \                   // 相位可以改变\n   float bias = 50.0f;                   // 以 1.65V\
  \ 为中心，全范围\n   float freq = 2.0f * 3.14159f / 100.0f;\n   for (i=0; i<100; i++){\
  \                // 通用正弦波方程\n      waveform[i] = (unsigned int)(bias + (gain * sin((i\
  \ * freq) + phase)));\n   }\n   // 使用 pru0_pru_r30_5 作为输出，即 100000 或 0x0020\n  \
  \ gpio = 0x0020;\n   // 使用 pru0_pru_r31_3 作为按钮，即 1000 或 0x0008\n   button = 0x0008;\n\
  \n   // 当按钮按下时停止循环\n   while (!(__R31 && button)) {\n      for(i=0; i<100; i++){\n\
  \         for(count=0; count<100; count++){\n            // 使用两个比较来均衡时序\n      \
  \      if(count<=waveform[i]) { __R30 |=  gpio;    }\n            if(count> waveform[i])\
  \ { __R30 &= (~gpio); }\n            __delay_cycles(DELAYFACTOR);\n         }\n\
  \      }\n   }\n   __halt();\n} \n```\n\n**清单 15-13：** /exploringbb/chp15/pru/sineWave/sineWave.c\n\
  \n清单 15-13 中的 PRU 代码建立在清单 15-12 的 PWM 代码之上。主要区别在于增加了一个循环，为每个数据数组值加载一个 PWM 占空比。该代码可以输出传递给它的任何周期性波形，在此示例中，最大周期采样长度略低于\
  \ 8 KB（PRU0 RAM0）。可以改进代码以扩展此限制，或使用更少的指令进行迭代。然而，该代码证明了 PRU 可以利用其数字 GPIO 输出生成任意自定义模拟波形的原理。\n\
  \n### 一个超声波传感器应用\n\n如第 10 章所述，HC-SR04 是一种低成本（约 5 美元）的超声波传感器，可以利用声速确定到障碍物的距离。该传感器的测量范围约为\
  \ 1 英寸（2.5 厘米）到 13 英尺（4 米）。它是一个 5V 传感器，因此需要逻辑电平转换电路（如第 8 章末尾所述）。最终电路如图 15-13 所示。它使用了本章前面描述的相同引脚配置。\n\
  \n![低成本 HC-SR04 超声波距离传感器电路图，用于利用声速确定到障碍物的距离。](img/c15f013.jpg)\n\n**图 15-13****：**\
  \ HC-SR04 超声波距离传感器电路\n\n图 15-14 展示了与该传感器的交互方式。向传感器的“Trig”输入发送一个 10 µs 的触发脉冲；然后传感器在其“Echo”输出上响应一个脉冲，其宽度对应于障碍物的距离（大约\
  \ 150 µs 到 25 ms，如果范围内没有障碍物则为 38 ms）。\n\n![截图显示当向传感器的“Trig”输入发送 10 μs 触发脉冲时 HC-SR04\
  \ 的信号响应。](img/c15f014.jpg)\n\n**图 15-14****：** HC-SR04 的信号响应\n\nLinux 的非确定性特性意味着，使用常规\
  \ GPIO 直接从 Linux 用户空间使用该传感器会很困难。虽然有包含微控制器的 UART 版本传感器，但价格昂贵得多。事实上，这里提供的解决方案速度足够快，可以让您将十个或更多此类传感器连接到单个\
  \ PRU——可以向多个传感器同时发送单个触发信号，并且可以使用不同的增强型 GPIO 来测量每个传感器的响应信号。为此应用开发了汇编语言代码，结构如下：\n\n\
  1.  进行初始化以设置共享内存。\n\n2.  主循环开始。\n\n3.  向输出引脚发送一个脉冲。输出引脚（P9_27/P2.34）置高，代码延迟恰好 10\
  \ μs 后再置低。\n\n4.  然后轮询输入引脚（P9_28/P2.30），直到它变为高电平。此时，“宽度”定时器开始计数，直到输入引脚变为低电平。\n\n\
  5.  将宽度定时器值写入共享内存。主循环再次开始。\n\n项目代码位于目录 `/chp15/pru/ultrasonic/` 中。\n\n```\n#include\
  \ <stdint.h>\n#include <pru_cfg.h>\n#include <pru_ctrl.h>\n#include \"resource_table_empty.h\"\
  \n\n#define PRU0_DRAM   0x00000000\nvolatile unsigned int *shared = (unsigned int\
  \ *)(PRU0_DRAM);\n\nextern void START(void);\n\nvoid main(void) {\n   // 采样数量\n\
  \   shared[0] = 5000;\n   // 采样延迟（毫秒）\n   shared[1] = 2;\n   START();\n} \n```\n\
  \n**清单 15-14：** /exploringbb/chp15/pru/ultrasonic/main.c\n\nPRU 代码见清单 15-15。程序按描述循环，并在每次迭代时将当前值存储在内存中。\n\
  \n\n\n\n```\n; 为 Derek Molloy 的《Exploring BeagleBone v2》编写\n; 该程序将 PRU 用作超声波控制器，基于\n\
  ; 0x00000000（百分比）和 0x00000004（延迟）中的值\n  .cdecls \"main.c\"\n  .clink\n  .global\
  \ START\n  .asg  32, PRU0_R31_VEC_VALID  ; 允许通知程序完成\n  .asg  3,  PRU_EVTOUT_0  \
  \      ; 发送回的事件编号\n  .asg  1000, TRIGGER_COUNT     ;\n  .asg  100000, SAMPLE_DELAY_1MS\n\
  \n; 使用寄存器 0 进行所有临时存储（多次重用）\nSTART:\n   ; 读取要采样的样本数和采样间延迟\n   LDI32  r0, 0x00000000\
  \        ; 加载内存位置，样本数\n   LBBO   &r1, r0, 0, 4         ; 将值加载到内存中 - 保留 r1\n   ;\
  \ 读取采样延迟\n   LDI32  r0, 0x00000004        ; 采样延迟位于第二个 32 位中\n   LBBO   &r2, r0,\
  \ 0, 4         ; 采样延迟存储在 r2 中\n\nMAINLOOP:\n   LDI32  r0, TRIGGER_COUNT     ; 存储触发脉冲延迟的长度\n\
  \   SET    r30, r30.t5           ; 将触发信号置高\n\nTRIGGERING:                     ;\
  \ 延迟 10us\n   SUB    r0, r0, 1             ; 递减循环计数器\n   QBNE   TRIGGERING, r0,\
  \ 0     ; 除非为零，否则重复循环\n   CLR    r30, r30.t5           ; 10us 结束，将触发信号置低 - 脉冲已发送\n\
  \   ; 清除计数器并等待回波信号变高\n   LDI32  r3, 0                 ; r3 将存储回波脉冲宽度\n   WBS   \
  \ r31, 3                ; 等待直到回波信号变高\n\n   ; 开始计数（测量回波脉冲宽度）直到回波信号变低\nCOUNTING:\n\
  \   ADD    r3, r3, 1             ; 计数器加 1\n   QBBS   COUNTING, r31, 3      ; 如果回波信号仍为高，则循环\n\
  \   ; 此时回波信号已变低 - 将值写入共享内存\n   LDI32  r0, 0x00000008        ; 将结果写入此地址\n   SBBO\
  \   &r3, r0, 0, 4         ; 在此地址存储计数值\n   ; 又完成了一次采样迭代\n   SUB    r1, r1, 1    \
  \         ; 迭代次数减 1\n   MOV    r0, r2                ; 需要在采样之间延迟\n\nSAMPLEDELAY:\
  \                    ; 执行此循环 r2 次（每次延迟 1ms）\n   SUB    r0, r0, 1             ; 计数器减\
  \ 1\n   LDI32  r4, SAMPLE_DELAY_1MS  ; 将 1ms 延迟加载到 r4\n\nDELAY1MS:\n   SUB    r4,\
  \ r4, 1\n   QBNE   DELAY1MS, r4, 0       ; 持续直到 1ms 过去\n   QBNE   SAMPLEDELAY, r0,\
  \ 0    ; 除非为零，否则重复循环\n   QBNE   MAINLOOP, r1, 0       ; 如果迭代次数未完成，则循环\n\nEND:  \
  \                          ; 程序结束，发送回中断\n   LDI32  R31, (PRU0_R31_VEC_VALID|PRU_EVTOUT_0)\n\
  \   HALT                         ; 暂停 PRU 程序\n```\n\n**清单 15-15：** `/exploringbb/chp15/pru/ultrasonic/ultrasonic.asm`\n\
  \n清单 15-16 中的 C 代码是一个独立的 Linux 用户空间程序，它访问 PRU 内存地址 `0x4a30 0008` 并读取当前定时值。然后使用 `displayDistance()`\
  \ 函数将该值转换为等效的英寸和厘米距离。\n\n```\n#include <stdio.h>\n…\n#include <sys/mman.h>\n\n#define\
  \ MAP_SIZE 4096UL\n#define MAP_MASK (MAP_SIZE - 1)\n\nvoid displayDistance(unsigned\
  \ int raw_distance) {\n   float distin = ((float)raw_distance / (100 * 148));\n\
  \   float distcm = ((float)raw_distance / (100 * 58));\n   printf(\"距离为 %f 英寸（%f\
  \ 厘米）             \\r\", distin, distcm);\n}\n\nint main(int argc, char **argv)\
  \ {\n    int fd, i, j;\n    void *map_base, *virt_addr;\n    unsigned long read_result,\
  \ writeval;\n    unsigned int numberOutputSamples = 1;\n    off_t target = 0x4a300008;\n\
  \n    if((fd = open(\"/dev/mem\", O_RDWR | O_SYNC)) == -1){\n        printf(\"无法打开内存！\\\
  n\");\n        return -1;\n    }\n    fflush(stdout);\n    map_base = mmap(0, MAP_SIZE,\
  \ PROT_READ | PROT_WRITE, MAP_SHARED, \n                    fd, target& ~MAP_MASK);\n\
  \    if(map_base == (void *) -1) {\n       printf(\"无法映射基地址\\n\");\n       return\
  \ -1;\n    }\n    fflush(stdout);\n\n    for(j=0; j<1000; j++){\n       for(i=0;\
  \ i<numberOutputSamples; i++){\n           virt_addr = map_base + (target & MAP_MASK);\n\
  \           read_result = *((unsigned long *) virt_addr);\n           //printf(\"\
  地址 0x%X 处的值为：0x%X\\n\", target, read_result);\n           displayDistance((unsigned\
  \ int)read_result);\n           usleep(500000);\n       }\n       fflush(stdout);\n\
  \    }\n    if(munmap(map_base, MAP_SIZE) == -1) {\n       printf(\"无法取消映射内存\");\n\
  \       return -1;\n    }\n    close(fd);\n    return 0;\n} \n```\n\n**清单 15-16：**\
  \ `/exploringbb/chp15/pru/ultrasonic/readDistance.c`\n\n该代码示例可以使用构建脚本构建，执行时会产生以下输出：\n\
  \n```\ndebian@ebb:~/exploringbb/chp15/pru/ultrasonic$ make\ndebian@ebb:~/exploringbb/chp15/pru/ultrasonic$\
  \ sudo make install_PRU0\ndebian@ebb:~/exploringbb/chp15/pru/ultrasonic$ sudo ./readDistance\n\
  距离为 5.335135 英寸（13.551244 厘米）\n```\n\n程序输出在每次采样时更新在单个 shell 控制台行上。这持续到程序退出。信号输出显示在图\
  \ 15-15 中。本例中的采样率是可变的。如果需要，可以将其改为固定采样周期；但是，固定采样率必须考虑传感器在未检测到障碍物时返回的 38 ms 脉冲。\n\n\
  ![显示 HC-SR04 信号响应的截图，更新在单个 shell 控制台行上。](img/c15f015.jpg)\n\n**图 15-15****：** 超声波项目示例中\
  \ HC-SR04 的信号响应\n\n## 总结\n\n完成本章后，您应该能够做到以下几点：\n\n*   描述可在 Beagle 板上使用的实时内核和硬件解决方案\n\
  \n*   使用 PRU 调试器和德州仪器 PRU 代码生成工具（CGT）等工具进行 PRU-ICSS 应用开发\n\n*   编写一个 PRU 程序，使 LED\
  \ 闪烁，并使用 remoteproc 将其传输到 PRU-ICSS\n\n*   描述 PRU-ICSS 的重要特性，例如其结构、寄存器、内存寻址和汇编语言指令\n\
  \n*   编写一个与 Linux 主机应用程序共享内存的 PRU 程序\n\n*   编写一个与 Linux 主机空间中的常规 GPIO 接口的 PRU 程序\n\
  \n*   编写一个生成 PWM 信号并使其在 GPIO 引脚上输出用户定义的模拟波形的 PRU 程序\n\n*   将 PRU 应用于时间测量至关重要的传感器接口应用，例如与超声波距离传感器的接口\n\
  \n## 延伸阅读\n\n本章提供了许多网站和文档的链接。有关本章主题的更多链接和更多信息，请访问 [`www.exploringbeaglebone.com/chapter15/`](http://www.exploringbeaglebone.com/chapter15/)。\n\
  \n《BeagleBone Cookbook》的合著者 Mark A. Yoder 教授编写了《PRU Cookbook》，对于计划开发 PRU 应用程序的人来说，这是一个极好的资源。请参阅\
  \ [`markayoder.github.io/PRUCookbook/`](http://markayoder.github.io/PRUCookbook/)。\n\
  \nMark A.Yoder, Jason Kridner, *BeagleBone Cookbook: Software and Hardware Problems\
  \ and Solutions*, O'Reilly Media Inc., ISBN: 1491905395, 2015.\n\n# 第 16 章\n\n嵌入式内核编程\n\
  \n\n\n\n\n在本章中，你将学习如何在嵌入式设备（如 Beagle 板）上进行 Linux 内核编程。内核编程是一个高级主题，需要深入研究 Linux 内核的源代码；然而，本章以实用的逐步指南形式组织，专注于编写与通用输入/输出（GPIO）交互的\
  \ Linux 可加载内核模块（LKM）这一具体任务。第一个示例是一个简单的“Hello World”模块，可用于在板上建立 LKM 开发的配置。第二个 LKM\
  \ 示例介绍了中断服务例程（ISR），并将一个简单的 GPIO 按钮和 LED 电路与 Linux 内核空间连接起来。还提供了另外两个示例，分别介绍 `kobject`\
  \ 接口以及使用内核线程为板构建内核空间 `sysfs` 设备。通过本章的学习，你应该熟悉编写内核代码所需的步骤，并理解此类开发所涉及的编程约束。\n\n本章所需设备：\n\
  \n*   运行 Linux 4.x.x 或更高版本的 Beagle 板（任何型号）\n\n本章的更多详细信息请访问 [`www.exploringbeaglebone.com/chapter16/`](http://www.exploringbeaglebone.com/chapter16/)。\n\
  \n## 引言\n\n如第 3 章所述，可加载内核模块（LKM）是一种在运行时向 Linux 内核添加或移除代码的机制。LKM 非常适合设备驱动程序，使内核能够与硬件通信，而无需了解硬件的工作原理。如果没有这种模块化能力，Linux\
  \ 内核将会非常庞大，因为它必须支持板上可能需要的所有驱动程序。而且，每次添加新硬件或更新设备驱动程序时，都必须重新构建内核。LKM 的缺点是需要为每个设备维护驱动程序文件。LKM\
  \ 在运行时加载，但它们不在用户空间执行；它们本质上是内核的一部分。\n\n内核模块运行在内核空间，应用程序运行在用户空间，如图 16-1 所示。内核空间和用户空间各自拥有独立且不重叠的内存地址空间。这种方法确保在用户空间运行的应用程序无论硬件平台如何，都能获得一致的硬件视图。然后，通过系统调用以受控的方式将内核服务提供给用户空间。内核还通过使用保护级别（例如，超级用户与普通用户权限）防止各个用户空间应用程序相互冲突或访问受限资源。\n\
  \n![Linux 内核和用户空间架构的示意图，它们拥有各自独立且不重叠的内存地址空间。](img/c16f001.jpg)\n\n**图 16-1****：**\
  \ Linux 内核和用户空间架构\n\n### 为什么要编写内核模块？\n\n在嵌入式 Linux 下与电子电路交互时，你会接触到 `sysfs` 以及使用底层文件操作来与电子电路交互。这种方法可能看起来效率低下（尤其是如果你有传统嵌入式系统的经验）；然而，这些文件条目是内存映射的，其性能足以满足许多应用。如第\
  \ 6 章所述，通过使用 pthreads、回调函数和 `sys/poll.h`，可以在 Linux 用户空间内实现约三分之一毫秒的响应时间，且 CPU 开销可忽略不计。\n\
  \n第 6 章还描述了一种绕过 AM335x 上 Linux 内核的方法，即使用直接内存操作来控制 SoC 的输入和输出。不幸的是，这种方法意味着你的程序将无法移植到其他不使用\
  \ AM335x 的嵌入式 Linux 平台。此外，由于 Linux 内核不知道这种直接内存操作，你可能会产生资源冲突。\n\n另一种方法是使用支持中断的内核代码。然而，内核代码难以编写和调试。我的建议是，除非你确定没有其他可能的方法，否则应始终尝试在\
  \ Linux 用户空间中完成你的任务！\n\n### 可加载内核模块基础\n\n典型计算机程序的运行时生命周期相当简单：加载器为程序分配内存，并将程序与所需的共享库一起加载。然后从某个入口点（在\
  \ C/C++ 程序中通常由 `main()` 点标识）开始执行指令，执行语句，抛出异常，动态分配和释放内存，程序最终运行结束。程序退出时，操作系统将分配给程序的内存释放回堆内存池。\n\
  \n内核模块是用 C 语言编写的，但它们不是程序；首先，没有 `main()` 函数！一些关键区别在于内核模块：\n\n*   **不按顺序执行：** 内核模块使用其初始化函数注册自身以处理请求，该函数运行后终止。它可以处理的请求类型在模块代码中定义。这与图形用户界面（GUI）应用程序中常用的事件驱动编程模型非常相似。\n\
  \n*   **不会自动清理：** 分配给模块的任何资源必须在模块卸载时手动释放，否则它们可能直到系统重启才可用。\n\n*   **没有 `printf()`\
  \ 函数：** 内核代码无法访问为 Linux 用户空间编写的代码库。内核模块存在于内核空间并运行在其中，拥有自己的内存地址空间。内核空间和用户空间之间的接口被明确定义和控制。但是，有一个可用的\
  \ `printk()` 函数，可用于输出信息，这些信息可以在用户空间内查看。\n\n*   **可以被中断：** 内核模块在概念上一个难点是它们可以被多个不同的程序/进程同时使用。模块必须构建成在中断时具有一致且有效的行为。BeagleBoard\
  \ X15 具有多核处理器，这意味着你还必须考虑多个进程同时访问所涉及的问题。\n\n*   **具有更高的执行权限：** 通常，分配给内核模块的 CPU 周期比用户空间程序多。这听起来像是一个优势；但是，你必须小心，确保你的模块不会对系统的整体性能产生不利影响。\n\
  \n*   **不支持浮点运算：** 是内核代码使用陷阱从整数模式转换到浮点模式，以供用户空间应用程序使用。然而，在内核空间中执行这些陷阱很困难。另一种方法是手动保存和恢复浮点运算——这是一项最好避免的任务，应留给用户空间代码。\n\
  \n## 第一个 LKM 示例\n\n刚才描述的概念很多，需要消化，重要的是它们都要被处理，但不是在第一个示例中全部处理！清单 16-1 提供了第一个示例 LKM\
  \ 的代码。当没有提供内核参数时，代码使用 `printk()` 函数在内核日志中显示“Hello world!”。如果提供了参数“Derek”，则日志显示“Hello\
  \ Derek!”。清单 16-1 中的注释采用 Doxygen 格式（参见第 7 章），描述了每个语句的作用。代码清单之后有进一步的说明。\n\n\n\n\n\
  \n```\n/**\n * @file    hello.c\n * @author  Derek Molloy\n * @date    2018 年 9\
  \ 月 10 日\n * @version 0.1\n * @brief  一个入门级的“Hello World!”可加载内核模块（LKM），\n * 在模块加载和卸载时，可在\
  \ /var/log/kern.log 文件中显示一条消息。\n * 该模块在加载时可接受一个参数——名称，该名称会出现在内核日志文件中。\n*/\n\n#include\
  \ <linux/init.h>      // 用于标记函数的宏，例如 __init\n#include <linux/module.h>    // 加载\
  \ LKM 的核心头文件\n#include <linux/kernel.h>    // 包含内核类型、宏、函数\n\nMODULE_LICENSE(\"GPL\"\
  );       // 许可证类型（影响行为）\nMODULE_AUTHOR(\"Derek Molloy\");  // 作者，可通过 modinfo 查看\n\
  MODULE_DESCRIPTION(\"一个用于 Beagle 的简单 Linux LKM。\"); // 描述\nMODULE_VERSION(\"0.1\"\
  );       // 模块版本\n\nstatic char *name = \"world\"; // 示例 LKM 参数，默认值为 \"world\"\n\
  // 参数描述：charp = 字符指针，默认值为 \"world\"\nmodule_param(name, charp, S_IRUGO); // S_IRUGO\
  \ 表示可读但不可修改\nMODULE_PARM_DESC(name, \"要在 /var/log/kern.log 中显示的名称\");\n\n/** @brief\
  \ LKM 初始化函数\n * static 关键字将函数的作用域限制在此 C 文件内。\n * __init 宏表示对于内置驱动（非 LKM），该函数仅在初始化时使用，\n\
  \ * 之后可被丢弃并释放其内存。\n * @return 成功时返回 0  */\nstatic int __init helloEBB_init(void)\
  \ {\n   printk(KERN_INFO \"EBB: Hello %s from the Beagle LKM!\\n\", name);\n   return\
  \ 0;\n}\n\n/** @brief LKM 清理函数\n * 与初始化函数类似，也是 static 的。__exit 宏通知：\n * 如果此代码用于内置驱动（非\
  \ LKM），则不需要此函数。    */\nstatic void __exit helloEBB_exit(void) {\n   printk(KERN_INFO\
  \ \"EBB: Goodbye %s from the Beagle LKM!\\n\", name);\n}\n\n/** @brief 模块必须使用 linux/init.h\
  \ 中的 module_init() 和 module_exit() 宏，\n * 它们分别标识插入时的初始化函数和清理函数（如上所列）。    */\nmodule_init(helloEBB_init);\n\
  module_exit(helloEBB_exit); \n```\n\n**清单 16-1：** `/exploringbb/chp16/hello/hello.c`\n\
  \n除了清单 16-1 中注释描述的点之外，还有一些值得注意的额外要点。\n\n*   语句 `MODULE_LICENSE(\"GPL\")` 通过 `modinfo`\
  \ 提供有关你所开发模块的许可条款信息，从而允许你的 LKM 用户确保他们使用的是自由软件。由于内核是在 GPL 下发布的，你的许可证选择会影响内核对待你模块的方式。对于非\
  \ GPL 代码，你可以选择 `\"Proprietary\"`，但内核会被标记为“污染”，并出现警告。GPL 还有一些非污染的替代方案，例如 `\"GPL v2\"\
  `、`\"GPL and additional rights\"`、`\"Dual BSD/GPL\"`、`\"Dual MIT/GPL\"` 和 `\"Dual\
  \ MPL/GPL\"`。更多信息请参见 `linux/module.h`。\n\n*   `name`（`char *`）被声明为 `static`，并初始化为包含字符串\
  \ `\"world\"`。在内核模块中应避免使用全局变量；这比在应用程序编程中更为重要，因为全局变量在内核范围内是共享的。应使用 `static` 关键字将变量的作用域限制在模块内部。如果必须使用全局变量，请添加一个对你所编写模块唯一的前缀。\n\
  \n*   `module_param(name, type, permissions)` 宏有三个参数：`name`（向用户显示的参数名称以及模块中的变量名）、`type`（参数类型——即\
  \ `byte`、`int`、`uint`、`long`、`ulong`、`short`、`ushort`、`bool`、反布尔值 `invbool` 或字符指针\
  \ `charp` 之一）和 `permissions`（使用 sysfs 时对该参数的访问权限，稍后会介绍）。值为 `0` 会禁用该条目，而 `S_IRUGO`\
  \ 允许用户/组/其他人读取；请参见 [`tiny.cc/beagle1601`](http://tiny.cc/beagle1601) 上的 *访问权限模式位指南*。\n\
  \n*   模块中的函数可以任意命名（例如 `helloEBB_init()` 和 `helloEBB_exit()`）；但是，必须将相同的名称传递给清单 16-1\
  \ 末尾的特殊宏 `module_init()` 和 `module_exit()`。\n\n*   `printk()` 的用法与熟悉的 `printf()`\
  \ 函数类似，你可以从内核模块代码中的任何位置调用它。唯一显著的区别是，调用该函数时应指定一个日志级别。日志级别在 `linux/kern_levels.h`\
  \ 中定义为以下之一：`KERN_EMERG`、`KERN_ALERT`、`KERN_CRIT`、`KERN_ERR`、`KERN_WARNING`、`KERN_NOTICE`、`KERN_INFO`、`KERN_DEBUG`\
  \ 和 `KERN_DEFAULT`。该头文件通过 `linux/kernel.h` 头文件包含，而后者又通过 `linux/printk.h` 包含。\n\n\
  本质上，当加载此模块时，会执行 `helloEBB_init()` 函数；当卸载模块时，会执行 `helloEBB_exit()` 函数。\n\n### LKM\
  \ 的 Makefile\n\n构建内核模块需要一个 `Makefile` 文件；实际上，它是一个特殊的 kbuild Makefile。构建内核模块所需的 kbuild\
  \ Makefile 如清单 16-2 所示。（请记住，在 `Makefile` 文件中，对 `make` 的调用前面必须有一个 Tab 字符。）\n\n```\n\
  obj-m+=hello.o\n\nall:\n     make -C /lib/modules/$(shell uname -r)/build/ M=$(PWD)\
  \ modules\nclean:\n     make -C /lib/modules/$(shell uname -r)/build/ M=$(PWD) clean\
  \ \n```\n\n**清单 16-2：** `/exploringbb/chp16/hello/Makefile`\n\n`Makefile` 文件的第一行称为目标定义，它定义了要构建的模块（`hello.o`）。其语法出奇地复杂。例如，`obj-m`\
  \ 定义了一个可加载模块目标，而 `obj-y` 则表示一个内置对象目标。当模块由多个对象构建时，语法会变得更加复杂，但清单 16-2 足以构建此示例 LKM。\n\
  \n`Makefile` 文件的其余部分与常规 Makefile 类似。`$(shell uname -r)` 是一个有用的调用，用于返回当前内核构建版本；这确保了\
  \ Makefile 具有一定的可移植性。`-C` 选项在执行任何 make 任务之前将目录切换到内核目录。`M=$(PWD)` 变量赋值告诉 `make` 命令实际项目文件所在的位置。`modules`\
  \ 目标是外部内核模块的默认目标。另一个目标是 `modules_install`，它会安装模块。（`make` 命令必须以超级用户权限执行，并且需要指定模块安装路径。）\n\
  \n### 在 Beagle 板上构建 LKM\n\n得益于 [BeagleBoard.org](http://BeagleBoard.org) 基金会在维护内核版本和内核头文件方面所做的工作，在最新的\
  \ Debian Linux 镜像上构建 LKM 的过程非常简单。要构建 LKM，首先必须在板上安装 Linux 内核头文件。Linux 内核头文件是 C 头文件，定义了不同内核模块之间以及内核与用户空间之间的接口。这些头文件是构建外部\
  \ LKM 所必需的，并且它们必须与你要构建模块的内核版本相同。\n\n首先要做的是安装与设备或机器上的 Linux 内核发行版完全一致的 Linux 内核头文件。`uname`\
  \ 命令提供长描述（`-a` 表示全部）和内核发行版输出（`-r` 表示发行版），如下所示：\n\n```\ndebian@ebb:~$ uname -a\n\
  Linux ebb 4.14.67-ti-rt-r73 #1 SMP PREEMPT RT … armv7l GNU/Linux\ndebian@ebb:~$\
  \ uname -r\n4.14.67-ti-rt-r73 \n```\n\n内核发行版输出可用于搜索相应的 Linux 头文件：\n\n\n\n\n```\n\
  debian@ebb:~$ apt-cache search linux-headers-$(uname -r)\nlinux-headers-4.14.67-ti-rt-r73\
  \ - →\n Linux kernel headers for 4.14.67-ti-rt-r73 on armhf\ndebian@ebb:~$ sudo\
  \ apt install linux-headers-$(uname -r) \n```\n\n此时，头文件应安装在`/lib/modules/$(uname\
  \ -r)/build/`中，该目录很可能是一个指向`/usr/src/linux/$(uname -r)/`位置的符号链接。由于历史原因，通常还会在`/usr/src/linux/`处提供一个额外的符号链接。\n\
  \n```\ndebian@ebb:/usr/src$ ls -l\ndrwxr-xr-x 24 root root 4096 Sep 9 linux-headers-4.14.67-ti-rt-r73\n\
  …\ndebian@ebb:/lib/modules/4.14.67-ti-rt-r73$ ls -l build\nlrwxrwxrwx … build ->\
  \ /usr/src/linux-headers-4.14.67-ti-rt-r73 \n```\n\n一旦 Linux 内核头文件就位，你就可以使用清单 16-2\
  \ 中的`Makefile`文件来构建`hello` LKM。以下是一个示例：\n\n```\ndebian@ebb:~/exploringbb/chp16/hello$\
  \ make\nmake -C /lib/modules/4.14.67-ti-rt-r73/build/ →\n  M=/home/debian/exploringbb/chp16/hello\
  \ modules\nmake[1]: Entering dir '/usr/src/linux-headers-4.14.67-ti-rt-r73'\n  CC\
  \ [M]  /home/debian/exploringbb/chp16/hello/hello.o\n  Building modules, stage 2.\n\
  \  MODPOST 1 modules\n  CC      /home/debian/exploringbb/chp16/hello/hello.mod.o\n\
  \  LD [M]  /home/debian/exploringbb/chp16/hello/hello.ko\nmake[1]: Leaving dir '/usr/src/linux-headers-4.14.67-ti-rt-r73'\
  \ \n```\n\n此时，LKM 已在当前目录下创建，名称为`hello.ko`。请注意，此 LKM 只能在你的 Beagle 板上执行，并且仅适用于当前内核版本。接下来将提供如何测试此模块的说明。\n\
  \n```\ndebian@ebb:~/exploringbb/chp16/hello$ ls -l\ntotal 32\n-rw-r--r-- 1 debian\
  \ debian 2202 Sep 10 01:01 hello.c\n-rw-r--r-- 1 debian debian 4828 Sep 10 01:01\
  \ hello.ko\n-rw-r--r-- 1 debian debian  921 Sep 10 01:01 hello.mod.c\n-rw-r--r--\
  \ 1 debian debian 2340 Sep 10 01:01 hello.mod.o\n-rw-r--r-- 1 debian debian 3092\
  \ Sep 10 01:01 hello.o\n-rw-r--r-- 1 debian debian  154 Sep 10 01:00 Makefile\n\
  -rw-r--r-- 1 debian debian   53 Sep 10 01:01 modules.order\n-rw-r--r-- 1 debian\
  \ debian    0 Sep 10 01:01 Module.symvers \n```\n\n### 测试第一个 LKM 示例\n\n然后，可以通过将“Hello\
  \ World!” LKM 加载到内核中来在 Beagle 板上进行测试。同样，这些步骤需要超级用户权限：\n\n```\ndebian@ebb:~/exploringbb/chp16/hello$\
  \ sudo -i\nroot@ebb:~# cd /home/debian/exploringbb/chp16/hello\nroot@ebb:/home/debian/exploringbb/chp16/hello#\
  \ ls\nhello.c  hello.ko  hello.mod.c  hello.mod.o  hello.o  \nMakefile  modules.order\
  \  Module.symvers\nroot@ebb:/home/debian/exploringbb/chp16/hello# ls -l *.ko\n-rw-r--r--\
  \ 1 debian debian 4828 Sep 10 01:01 hello.ko \n```\n\n可以使用`insmod`程序将 LKM 加载到 Linux\
  \ 内核中：\n\n```\nroot@ebb:…/exploringbb/chp16/hello# insmod hello.ko\nroot@ebb:…/exploringbb/chp16/hello#\
  \ lsmod | grep hello\nModule                  Size  Used by\nhello             \
  \     16384  0 \n```\n\n你可以使用`modinfo`命令获取已加载 LKM 的信息，该命令会识别描述、作者以及 LKM 源代码定义的任何模块参数。\n\
  \n```\nroot@ebb:/home/debian/exploringbb/chp16/hello# modinfo hello.ko\nfilename:\
  \   /home/debian/exploringbb/chp16/hello/hello.ko\nversion:    0.1\ndescription:A\
  \ simple Linux LKM for the Beagle.\nauthor:     Derek Molloy\nlicense:    GPL\n\
  srcversion: B8B4B178374781B4A6AB86B\ndepends:\nname:       hello\nvermagic:   4.14.67-ti-rt-r73\
  \ SMP preempt mod_unload ARMv7 p2v8\nparm:       name: The name to display in /var/log/kern.log\
  \ (charp) \n```\n\n你可以看到内核版本被编译到模块中，并且任何模块参数都是可见的，例如本例中的`name`。\n\n可以使用`rmmod`程序从\
  \ Linux 内核中移除该模块。\n\n```\nroot@ebb:…/exploringbb/chp16/hello# rmmod hello.ko \n\
  ```\n\n你可以重复这些步骤，并实时查看内核日志中的输出，这是由于使用了清单 16-1 中的`printk()`函数。我建议你使用第二个终端窗口，在加载和卸载\
  \ LKM 时实时查看输出，如下所示：\n\n```\nroot@ebb:/var/log# tail -f kern.log\n…[328594.240926]\
  \ hello: loading out-of-tree module taints kernel.\n…[328594.247654] EBB: Hello\
  \ world from the Beagle LKM!\n…[328717.701464] EBB: Goodbye world from the Beagle\
  \ LKM! \n```\n\n```\ndebian@ebb:~$ dmesg | grep -i taint\n[328594.240926] hello:\
  \ loading out-of-tree module taints kernel\n[754433.963405] CPU:0 PID:6302 Comm:insmod\
  \ Tainted:G O 4.14.67\ndebian@ebb:~$ cat /proc/sys/kernel/tainted\n4608 \n```\n\n\
  该值是 4096（已加载外部树模块）和 512（发生内核警告）之和。内核污染值列表可在[`www.kernel.org/doc/Documentation/sysctl/kernel.txt`](http://www.kernel.org/doc/Documentation/sysctl/kernel.txt)找到。\n\
  \n#### *测试 LKM 参数*\n\n清单 16-1 中的代码包含一个自定义 LKM 参数，可以在加载模块时设置。以下是一个示例：\n\n```\nroot@ebb:…/chp16/hello#\
  \ insmod hello.ko name=Derek \n```\n\n如果此时查看`/var/log/kern.log`，会看到消息`Hello Derek`代替了`Hello\
  \ world`：\n\n```\nroot@ebb:…/exploringbb/chp16/hello# tail -f /var/log/kern.log\n\
  … [330060.720442] EBB: Hello Derek from the Beagle LKM! \n```\n\n不过，你也可以查看已加载内核模块的信息，如下所示：\n\
  \n```\nroot@ebb:/home/debian/exploringbb/chp16/hello# cd /proc\nroot@ebb:/proc#\
  \ cat modules | grep hello\nhello 16384 0 - Live 0xbf191000 (O) \n```\n\n这与`lsmod`命令提供的信息相同，但它还提供了已加载模块的当前内核内存偏移量，这对调试很有用。\n\
  \nLKM 在`/sys/module/`下也有一个条目，它允许你直接访问自定义参数的状态。以下是一个示例：\n\n```\nroot@ebb:/proc# cd\
  \ /sys/module\nroot@ebb:/sys/module# ls -l | grep hello\ndrwxr-xr-x 6 root root\
  \ 0 Sep 10 01:35 hello\nroot@ebb:/sys/module# cd hello/\nroot@ebb:/sys/module/hello#\
  \ ls\ncoresize  initsize   notes       refcnt    srcversion  uevent\nholders   initstate\
  \  parameters  sections  taint       version\nroot@ebb:/sys/module/hello# cat version\n\
  0.1\nroot@ebb:/sys/module/hello# cat taint\nO \n```\n\n版本值为 0.1，与清单 16-1 中的`MODULE_VERSION(\"\
  0.1\")`条目一致；污染值为`O`，与所选择的许可证`MODULE_LICENSE(\"GPL\")`一致。\n\n自定义参数值可以如下查看：\n\n```\n\
  root@ebb:/sys/module/hello# cd parameters/\nroot@ebb:/sys/module/hello/parameters#\
  \ ls -l\ntotal 0\n-r--r--r-- 1 root root 4096 Sep 10 01:38 name\nroot@ebb:/sys/module/hello/parameters#\
  \ cat name\nDerek \n```\n\n通过这个目录结构，你可以看到 name 变量的状态被显示出来。由于在定义模块参数时使用了`S_IRUGO`参数，读取该值不需要超级用户权限。可以将其配置为可写访问，但你的模块代码需要检测这种状态变化并做出相应处理。最后，你可以移除模块并观察输出。\n\
  \n```\nroot@ebb:/sys/module/hello/parameters# cd ~/\nroot@ebb:~# rmmod hello.ko\n\
  root@ebb:~# tail /var/log/kern.log -n 2\n… [330060.720442] EBB: Hello Derek from\
  \ the Beagle LKM!\n… [330255.806194] EBB: Goodbye Derek from the Beagle LKM! \n\
  ```\n\n在卸载 LKM 之前，务必离开与 LKM 相关的任何目录，否则，即使是简单的`ls`调用也可能导致内核恐慌。\n\n## 一个嵌入式 LKM 示例\n\
  \n\n\n现在你已经构建了第一个 LKM，就可以开发更复杂的设备驱动程序了。例如，请参阅本章网页中关于如何构建字符设备的内容。不过，本章剩余示例将重点介绍如何使用基于内核的\
  \ GPIO 代码将 LKM 代码与简单硬件电路连接。本章使用单个电路，如图 Figure 16-2(a) 所示。硬件配置与 第 6 章 中描述的用户空间 GPIO\
  \ 电路类似。\n\n![（左）用于测试 GPIO Linux 可加载内核模块的 LED 和按钮电路示意图。（右）显示 Linux 可加载内核模块性能输出的截图。](img/c16f002.jpg)\n\
  \n**图 16-2：** (a) 使用 BBB 和 PocketBeagle 测试 GPIO LKM 的 LED 和按钮电路，(b) LKM 性能结果（禁用软件消抖）\n\
  \n与 Linux 用户空间不同，Linux 内核空间完全支持中断。本节第一个示例演示了如何编写一个使用 GPIO 和中断的 LKM，以实现比用户空间更快的响应时间。我并不是建议你将所有\
  \ GPIO 代码都写在内核空间，但这些示例可能会为你提供灵感，让你在内核空间中执行一些离散任务；更高级的代码仍然可以在 Linux 用户空间中编写。\n\n\
  首先，通过将 GPIO60（P9_12/P2.8）设置为输出来测试 LED，并将 GPIO46（P8_16/P2.22）设置为输入来测试按钮，确保电路正常工作。\n\
  \n```\ndebian@ebb:/sys/class/gpio$ config-pin -q P9_12\nP9_12 Mode: default Direction:\
  \ out Value: 0\ndebian@ebb:/sys/class/gpio$ cd gpio60/\ndebian@ebb:/sys/class/gpio/gpio60$\
  \ echo out > direction\ndebian@ebb:/sys/class/gpio/gpio60$ echo 1 > value\ndebian@ebb:/sys/class/gpio/gpio60$\
  \ echo 0 > value\ndebian@ebb:/sys/class/gpio/gpio60$ cd ..\ndebian@ebb:/sys/class/gpio$\
  \ config-pin -q P8_16\nP8_16 Mode: default Direction: in Value: 0\ndebian@ebb:/sys/class/gpio$\
  \ cd gpio46\ndebian@ebb:/sys/class/gpio/gpio46$ cat value\n0\ndebian@ebb:/sys/class/gpio/gpio46$\
  \ cat value\n1 \n```\n\n有趣的是，在 Linux 内核空间中控制 GPIO 的步骤与之前类似。使用 `linux/gpio.h` 中描述的函数，可以轻松地从内核空间访问和控制\
  \ Linux GPIO。以下是包含此内核头文件后可用的一些最重要函数：\n\n```\n/usr/src/linux-headers-4.14.67-ti-rt-r73/include/linux$\
  \ more gpio.h\nstatic inline bool gpio_is_valid(int number)\nstatic inline int \
  \ gpio_request(unsigned gpio, const char *label)\nstatic inline int  gpio_direction_input(unsigned\
  \ gpio)\nstatic inline int  gpio_get_value(unsigned gpio)\nstatic inline int  gpio_direction_output(unsigned\
  \ gpio, int value)\nstatic inline int  gpio_set_debounce(unsigned gpio, unsigned\
  \ debounce)\nstatic inline int  gpio_sysfs_set_active_low(unsigned gpio, int value)\n\
  static inline void gpio_free(unsigned gpio)\nstatic inline int  gpio_to_irq(unsigned\
  \ gpio) \n```\n\n重要的是，你可以使用上表最后一个函数将中断请求（IRQ）与 GPIO 关联起来。IRQ 使你能够构建高效、高性能的代码，以检测输入状态的变化。\n\
  \n### 中断服务例程\n\n中断是从连接的硬件设备、软件应用程序或电路发送给微处理器的信号，用于指示发生了需要关注的事件。中断是高优先级条件；该术语本质上意味着“中断你当前正在做的事情，转而执行其他任务”。处理器暂停当前活动，保存当前状态，并执行中断处理函数，该函数也称为*中断服务例程*（ISR）。一旦处理函数运行完毕，处理器会重新加载之前的状态，并继续执行之前的活动。\n\
  \nLKM 驱动程序必须为中断注册一个处理函数，该函数定义了中断应执行的操作。在本示例中，处理函数名为 `ebb_gpio_irq_handler()`，其形式如下：\n\
  \n```\nstatic irq_handler_t ebb_gpio_irq_handler(unsigned int irq, \n   void *dev_id,\
  \ struct pt_regs *regs) {\n   // 中断应执行的操作\n   … } \n```\n\n然后，使用 `request_irq()`\
  \ 函数将此处理函数注册到中断请求（IRQ），如下所示：\n\n```\nresult = request_irq(irqNumber,         //\
  \ 中断号\n   (irq_handler_t) ebb_gpio_irq_handler,// 指向处理函数的指针\n   IRQF_TRIGGER_RISING,\
  \                 // 上升沿触发中断\n   \"ebb_gpio_handler\",                  // 用于标识所有者\n\
  \   NULL);                 // *dev_id 用于共享中断线，此处为 NULL \n```\n\n在 清单 16-3 的代码示例中，`irqNumber`\
  \ 通过使用与相应 GPIO 号关联的中断号自动确定。重要的是，GPIO 号并非中断号，但两者存在直接的一一映射关系。\n\n要撤销 IRQ 请求，还有 `free_irq()`\
  \ 函数。在本示例中，`free_irq()` 函数在 `ebb_gpio_exit()` 函数中调用，该函数在卸载 LKM 时被调用。\n\n在本示例中，使用一个简单的瞬时按钮（如图\
  \ Figure 16-2(a) 所示）在按钮按下的上升沿产生中断。也可以在下降沿产生中断。（完整的中断定义集可在 `/include/linux/interrupt.h`\
  \ 中找到。）这些标志可以通过按位或运算符组合，以精确控制中断配置。\n\n第一个 GPIO LKM 的完整源代码见 清单 16-3。清单中的注释描述了每个函数的作用。\n\
  \n\n\n\n```\n#include <linux/init.h>\n#include <linux/module.h>\n#include <linux/kernel.h>\n\
  #include <linux/gpio.h>                 // for the GPIO functions\n#include <linux/interrupt.h>\
  \            // for the IRQ code\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"Derek\
  \ Molloy\");\nMODULE_DESCRIPTION(\"A Button/LED test driver for the Beagle\");\n\
  MODULE_VERSION(\"0.1\");\n\nstatic unsigned int gpioLED = 60;       // P9_12/P2.8\
  \ (GPIO60)\nstatic unsigned int gpioButton = 46;    // P8_16/P2.22 (GPIO46)\nstatic\
  \ unsigned int irqNumber;          // share IRQ num within file\nstatic unsigned\
  \ int numberPresses = 0;  // store number of presses\nstatic bool         ledOn\
  \ = 0;          // used to invert state of LED\n\n// prototype for the custom IRQ\
  \ handler function, function below\nstatic irq_handler_t  ebb_gpio_irq_handler(unsigned\
  \ int irq, void\n                                    *dev_id, struct pt_regs *regs);\n\
  \n/** @brief The LKM initialization function */\nstatic int __init ebb_gpio_init(void){\n\
  \   int result = 0;\n   printk(KERN_INFO \"GPIO_TEST: Initializing the GPIO_TEST\
  \ LKM\\n\");\n   if (!gpio_is_valid(gpioLED)){\n      printk(KERN_INFO \"GPIO_TEST:\
  \ invalid LED GPIO\\n\");\n      return -ENODEV;\n   }\n   ledOn = true;\n   gpio_request(gpioLED,\
  \ \"sysfs\");          // request LED GPIO\n   gpio_direction_output(gpioLED, ledOn);\
  \   // set in output mode and on\n// gpio_set_value(gpioLED, ledOn);          //\
  \ not required\n   gpio_export(gpioLED, false);             // appears in /sys/class/gpio\n\
  \                                       // false prevents direction change\n   gpio_request(gpioButton,\
  \ \"sysfs\");       // set up gpioButton\n   gpio_direction_input(gpioButton); \
  \       // set up as input\n// gpio_set_debounce(gpioButton, 200);      // debounce\
  \ delay of 200ms\n   gpio_export(gpioButton, false);          // appears in /sys/class/gpio\n\
  \n   printk(KERN_INFO \"GPIO_TEST: button value is currently: %d\\n\",\n       \
  \   gpio_get_value(gpioButton));\n   irqNumber = gpio_to_irq(gpioButton);     //\
  \ map GPIO to IRQ number\n   printk(KERN_INFO \"GPIO_TEST: button mapped to IRQ:\
  \ %d\\n\", irqNumber);\n\n   // This next call requests an interrupt line\n   result\
  \ = request_irq(irqNumber,         // interrupt number requested\n            (irq_handler_t)\
  \ ebb_gpio_irq_handler, // handler function\n            IRQF_TRIGGER_RISING,  //\
  \ on rising edge (press, not release)\n            \"ebb_gpio_handler\",   // used\
  \ in /proc/interrupts\n            NULL);                // *dev_id for shared interrupt\
  \ lines\n   printk(KERN_INFO \"GPIO_TEST: IRQ request result is: %d\\n\", result);\n\
  \   return result;\n}\n\n/** @brief The LKM cleanup function  */\nstatic void __exit\
  \ ebb_gpio_exit(void){\n   printk(KERN_INFO \"GPIO_TEST: button value is currently:\
  \ %d\\n\",\n          gpio_get_value(gpioButton));\n   printk(KERN_INFO \"GPIO_TEST:\
  \ pressed %d times\\n\", numberPresses);\n   gpio_set_value(gpioLED, 0);    // turn\
  \ the LED off\n   gpio_unexport(gpioLED);        // unexport the LED GPIO\n   free_irq(irqNumber,\
  \ NULL);     // free the IRQ number, no *dev_id\n   gpio_unexport(gpioButton); \
  \    // unexport the Button GPIO\n   gpio_free(gpioLED);            // free the\
  \ LED GPIO\n   gpio_free(gpioButton);         // free the Button GPIO\n   printk(KERN_INFO\
  \ \"GPIO_TEST: Goodbye from the LKM!\\n\");\n}\n\n/** @brief The GPIO IRQ Handler\
  \ function\n * A custom interrupt handler that is attached to the GPIO. The same\n\
  \ * interrupt handler cannot be invoked concurrently as the line is\n * masked out\
  \ until the function is complete. This function is static\n * as it should not be\
  \ invoked directly from outside of this file.\n * @param irq    the IRQ number associated\
  \ with the GPIO\n * @param dev_id the *dev_id that is provided - used to identify\n\
  \ * which device caused the interrupt. Not used here.\n * @param regs   h/w specific\
  \ register values -used for debugging.\n * return returns IRQ_HANDLED if successful\
  \ - return IRQ_NONE otherwise.\n */\nstatic irq_handler_t ebb_gpio_irq_handler(unsigned\
  \ int irq,\n                        void *dev_id, struct pt_regs *regs){\n   ledOn\
  \ = !ledOn;                     // invert the LED state\n   gpio_set_value(gpioLED,\
  \ ledOn);     // set LED accordingly\n   printk(KERN_INFO \"GPIO_TEST: Interrupt!\
  \ (button is %d)\\n\",\n          gpio_get_value(gpioButton));\n   numberPresses++;\
  \                    // global counter\n   return (irq_handler_t) IRQ_HANDLED; //\
  \ announce IRQ handled\n} \n```\n\n**清单 16-3:** `…/chp16/gpio/gpio_test.c`\n\n清单\
  \ 16-3 中描述的 LKM 可以使用与第一个 LKM 示例相同的步骤进行构建和加载。\n\n```\ndebian@ebb:~/exploringbb/chp16/gpio$\
  \ ls -l\n-rw-r--r-- 1 debian debian 4608 Sep 14 01:58 gpio_test.c\n-rw-r--r-- 1\
  \ debian debian  158 Sep 14 01:53 Makefile\ndebian@ebb:~/exploringbb/chp16/gpio$\
  \ make\nmake -C /lib/modules/4.14.67-ti-rt-r73/build/ …\nmake[1]: Entering dir '/usr/src/linux-headers-4.14.67-ti-rt-r73'\n\
  \  CC [M]  /home/debian/exploringbb/chp16/gpio/gpio_test.o\n  Building modules,\
  \ stage 2.\n  MODPOST 1 modules\n  CC      /home/debian/exploringbb/chp16/gpio/gpio_test.mod.o\n\
  \  LD [M]  /home/debian/exploringbb/chp16/gpio/gpio_test.ko\nmake[1]: Leaving dir\
  \ '/usr/src/linux-headers-4.14.67-ti-rt-r73'\ndebian@ebb:~/exploringbb/chp16/gpio$\
  \ ls\ngpio_test.c   gpio_test.mod.c  gpio_test.o  modules.order\ngpio_test.ko  gpio_test.mod.o\
  \  Makefile     Module.symvers\ndebian@ebb:~/exploringbb/chp16/gpio$ sudo insmod\
  \ gpio_test.ko \n```\n\n然后，当按下按照图 16-2(a) 方式连接的物理瞬时按钮时，内核日志的反应如下：\n\n```\ndebian@ebb:~/exploringbb/chp16/gpio$\
  \ dmesg\n[678135.343606] GPIO_TEST: Initializing the GPIO_TEST LKM\n[678135.344229]\
  \ GPIO_TEST: button value is currently: 0\n[678135.344240] GPIO_TEST: button mapped\
  \ to IRQ: 109\n[678135.350039] GPIO_TEST: IRQ request result is: 0\n[678150.761332]\
  \ GPIO_TEST: Interrupt! (button is 1)\n[678150.905016] GPIO_TEST: Interrupt! (button\
  \ is 1) \n```\n\n此时，你可以查看 `/proc/interrupts` 条目，可以看到中断处理程序的名称为 `ebb_gpio_handler`，正如清单\
  \ 16-3 的代码中所配置的那样。你还可以看到与该 GPIO 关联的中断编号为 109，这与前面内核日志中输出的值一致。\n\n```\ndebian@ebb:/proc$\
  \ cat interrupts | grep 109:\n109:          8  4804c000.gpio  14 Edge    ebb_gpio_handler\
  \ \n```\n\n再次强调，需要注意的是，中断编号 109 并非 GPIO 编号，按钮的 GPIO 编号是 `GPIO46`（$PINS 14）。当模块被卸载时，日志输出如下：\n\
  \n```\ndebian@ebb:~/exploringbb/chp16/gpio$ sudo rmmod gpio_test\ndebian@ebb:~/exploringbb/chp16/gpio$\
  \ dmesg | tail -n 5\n[678151.485877] GPIO_TEST: Interrupt! (button is 1)\n[678151.486047]\
  \ GPIO_TEST: Interrupt! (button is 1)\n[678597.926764] GPIO_TEST: button value is\
  \ currently: 0\n[678597.926784] GPIO_TEST: pressed 6 times\n[678597.936407] GPIO_TEST:\
  \ Goodbye from the LKM! \n```\n\n### 性能\n\n该 LKM 的一个有用特性是，它允许你评估整个系统的响应时间（中断延迟时间）。按下瞬时按钮会导致\
  \ LED 状态反转；如果 LED 亮着，按下按钮时它会熄灭。为了测量这个延迟，使用了示波器，并将其配置为在按钮信号的上升沿触发。示波器提供了独立的时间测量，其输出显示在图\
  \ 16-2(b) 中。延迟大约为 90 µs。在重复测试中，该延迟在大约 80 µs 到 100 µs 之间变化。\n\n## 增强型按钮 GPIO 驱动 LKM\n\
  \n\n\n\n\n第三个示例在第二个示例的基础上构建了一个增强型 GPIO 驱动程序，允许用户通过 sysfs 配置 GPIO 按钮并与之交互。该模块可将 GPIO\
  \ 按钮映射到 Linux 用户空间，从而直接使用。解释该模块功能的最佳方式是通过一个用例示例。在此示例中，按钮连接到 GPIO46，加载 LKM 后，可按如下方式访问和操作：\n\
  \n```\ndebian@ebb:~/exploringbb/chp16/button$ sudo insmod button.ko\ndebian@ebb:~/exploringbb/chp16/button$\
  \ lsmod | grep button\nbutton                 16384  0\ndebian@ebb:~/exploringbb/chp16/button$\
  \ cd /sys/ebb/gpio46/\ndebian@ebb:/sys/ebb/gpio46$ ls -l\ntotal 0\n-r--r--r-- 1\
  \ root root 4096 Sep 14 23:09 diffTime\n-rw-rw-r-- 1 root root 4096 Sep 14 23:09\
  \ isDebounce\n-r--r--r-- 1 root root 4096 Sep 14 23:09 lastTime\n-r--r--r-- 1 root\
  \ root 4096 Sep 14 23:09 ledOn\n-rw-rw-r-- 1 root root 4096 Sep 14 23:09 numberPresses\n\
  debian@ebb:/sys/ebb/gpio46$ cat numberPresses\n0\ndebian@ebb:/sys/ebb/gpio46$ cat\
  \ numberPresses\n2\ndebian@ebb:/sys/ebb/gpio46$ cat ledOn\n1\ndebian@ebb:/sys/ebb/gpio46$\
  \ cat lastTime\n22:09:46:727954425\ndebian@ebb:/sys/ebb/gpio46$ cat diffTime\n0.226262367\n\
  debian@ebb:/sys/ebb/gpio46$ sudo sh -c \"echo 0 > isDebounce\"\ndebian@ebb:/sys/ebb/gpio46$\
  \ cat isDebounce\n0\ndebian@ebb:/sys/ebb/gpio46$ sudo sh -c \"echo 1 > isDebounce\"\
  \ndebian@ebb:/sys/ebb/gpio46$ cat isDebounce\n1 \n```\n\n尽管创建此 LKM 涉及复杂性，但用户界面非常直观，可由嵌入式系统上任何编程语言编写的可执行程序使用。Sysfs\
  \ 是一种基于内存的文件系统，提供了一种将内核数据结构、属性和链接导出到 Linux 用户空间的机制。支持 sysfs 运行的基础设施在很大程度上依赖于 kobject\
  \ 接口。\n\n### kobject 接口\n\nLinux 中的驱动模型使用了 kobject 抽象。要理解此模型，首先必须了解以下重要概念：¹\n\n\
  *   `kobject`：kobject 是一个结构体，包含名称、引用计数、类型、sysfs 表示以及指向父对象的指针（参见清单 16-4）。重要的是，kobject\
  \ 本身并无用处；相反，它们被嵌入到其他数据结构中，用于控制访问。这类似于面向对象概念中的通用顶级父类（例如 Java 中的 `Object` 类，或 Qt 中的\
  \ `QObject` 类）。\n\n*   `ktype`：ktype 是 kobject 所嵌入对象的类型。它控制对象创建和销毁时的行为。\n\n*   `kset`：kset\
  \ 是一组 kobject，这些 kobject 可以属于不同的 ktype。可以将 kobject 的 kset 视为一个 sysfs 目录，其中包含一组子目录（kobject）。\n\
  \n```\n#define KOBJ_NAME_LEN   20\n\nstruct kobject {\n    char               *k_name;\
  \    // kobject 名称指针（非 NULL）\n    char               name[KOBJ_NAME_LEN];  // 短内部名称\n\
  \    struct kref        kref;       // 引用计数\n    struct list_head   entry;     \
  \ // 链接到 kset 成员的链表\n    struct kobject     *parent;    // 父 kobject\n    struct\
  \ kset        *kset;      // kobject 可以是某个集合的成员\n    struct kobj_type   *ktype;\
  \     // kobj_type 描述对象类型\n    struct dentry      *dentry;    // sysfs 目录项\n}; \n\
  ```\n\n**清单 16-4：** kobject 结构体\n\n对于此示例 LKM，需要一个单一的 kobject，它映射到文件系统中的 `/sys/ebb/`。这个单一的\
  \ kobject 包含前面演示交互所需的所有属性（例如查看 `numberPresses` 条目）。在清单 16-5 中，通过使用 `kobject_create_and_add()`\
  \ 函数实现了这一点，如下所示：\n\n```\nstatic struct kobject *ebb_kobj; \nebb_kobj = kobject_create_and_add(\"\
  ebb\", kernel_kobj->parent); \n```\n\n`kernel_kobj` 指针提供了对 `/sys/kernel/` 的引用。如果去掉对\
  \ `->parent` 的调用，`ebb` 条目将被放置在 `/sys/kernel/ebb/` 下，但为了清晰起见，我将其放在了 `/sys/ebb/` 下；这并非最佳实践！（此外，`sysfs_create_dir()`\
  \ 也起到相同作用。）对于此示例 LKM，必须实现一组子系统特定的回调函数，以通过 sysfs 暴露其属性，这些函数的形式如下：\n\n```\nstatic\
  \ ssize_t dev_attribute_show(struct kobject *kobj, \n                   struct kobj_attribute\
  \ *attr, char *buf);\nstatic ssize_t dev_attribute_store(struct kobject *kobj, \n\
  \                   struct kobj_attribute *attr, char *buf); \n```\n\n当读取或写入 sysfs\
  \ 属性时，会分别调用 `_show` 和 `_store` 函数。`sysfs.h` 头文件定义了以下辅助宏，使定义属性更加简便：\n\n*   `__ATTR(_name,_mode,_show,_store)`：长格式版本。必须传递属性变量名\
  \ `_name`、访问模式 `_mode`（例如 `0664` 表示读写访问，但*其他用户*除外）、指向 show 函数的指针 `_show` 以及指向 store\
  \ 函数的指针 `_store`。\n\n*   `__ATTR_RO(_name)`：简写只读属性宏。必须传递属性变量名 `_name`，该宏将 `_mode`\
  \ 设置为 `0444`（只读），并将 `_show` 函数设置为 `_name_show`。\n\n*   `__ATTR_WO(_name)` 和 `__ATTR_RW(_name)`：只写和读写。\n\
  \n清单 16-5 提供了增强型 GPIO 按钮 LKM 的完整源代码。它可能看起来相当冗长，但你会发现这是因为包含大量注释和额外的 `printk()` 调用，以便在代码执行时准确了解发生了什么。此示例基于清单\
  \ 16-3 的工作构建；它还包含一个 LED，以便你可以在电路本身观察交互。\n\n\n\n\n\n```\n#include <linux/init.h>\n\
  #include <linux/module.h>\n#include <linux/kernel.h>\n#include <linux/gpio.h>  \
  \     // 需要 GPIO 函数\n#include <linux/interrupt.h>  // 需要 IRQ 代码\n#include <linux/kobject.h>\
  \    // 使用 kobject 实现 sysfs 绑定\n#include <linux/time.h>       // 使用时钟测量按键按下时间\n\
  #define  DEBOUNCE_TIME 200    // 默认消抖时间 -- 200ms\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"\
  Derek Molloy\");\nMODULE_DESCRIPTION(\"一个用于 Beagle 的简单 Linux GPIO 按键 LKM\");\nMODULE_VERSION(\"\
  0.1\");\n\nstatic bool isRising = 1;                 // 默认上升沿 IRQ 属性\nmodule_param(isRising,\
  \ bool, S_IRUGO);    // S_IRUGO 只读/不可修改\nMODULE_PARM_DESC(isRising, \" 上升沿 = 1（默认），下降沿\
  \ = 0\");\n\nstatic unsigned int gpioButton = 46;      // 默认 GPIO 为 46\nmodule_param(gpioButton,\
  \ uint, S_IRUGO);  // S_IRUGO 只读/不可修改\nMODULE_PARM_DESC(gpioButton, \" GPIO 按键编号（默认=46）\"\
  );\n\nstatic unsigned int gpioLED = 60;         // 默认 GPIO 为 60\nmodule_param(gpioLED,\
  \ uint, S_IRUGO);     // S_IRUGO 只读/不可修改\nMODULE_PARM_DESC(gpioLED, \" GPIO LED\
  \ 编号（默认=60）\");\n\nstatic char   gpioName[8] = \"gpioXXX\";    // 以 null 结尾的默认字符串\n\
  static int    irqNumber;                  // 用于共享 IRQ 编号\nstatic int    numberPresses\
  \ = 0;          // 存储按键按下次数\nstatic bool   ledOn = 0;                  // 用于反转 LED\
  \ 状态\nstatic bool   isDebounce = 1;             // 用于存储消抖状态\nstatic struct timespec\
  \ ts_last, ts_current, ts_diff;  // 纳秒精度\n\n// 自定义 IRQ 处理函数的函数原型\nstatic irq_handler_t\
  \  ebb_gpio_irq_handler(unsigned int irq,\n                                    \
  \ void *dev_id, struct pt_regs *regs);\n\n/** @brief 输出 numberPresses 变量的回调函数\n\
  \ *  @param kobj 出现在 sysfs 文件系统中的内核对象设备\n *  @param attr 指向 kobj_attribute 结构体的指针\n\
  \ *  @param buf 用于写入按键次数的缓冲区\n *  @return 返回写入缓冲区的总字符数\n */\nstatic ssize_t numberPresses_show(struct\
  \ kobject *kobj,\n                                  struct kobj_attribute *attr,\
  \ char *buf) {\n   return sprintf(buf, \"%d\\n\", numberPresses);\n}\n\n/** @brief\
  \ 读取 numberPresses 变量的回调函数 */\nstatic ssize_t numberPresses_store(struct kobject\
  \ *kobj, struct\n                    kobj_attribute *attr, const char *buf, size_t\
  \ count) {\n   sscanf(buf, \"%du\", &numberPresses);\n   return count;\n}\n\n/**\
  \ @brief 显示 LED 是开还是关 */\nstatic ssize_t ledOn_show(struct kobject *kobj, struct\
  \ kobj_attribute *attr,\n                          char *buf) {\n   return sprintf(buf,\
  \ \"%d\\n\", ledOn);\n}\n\n/** @brief 显示上次按键按下的时间 - 手动输出 */\nstatic ssize_t lastTime_show(struct\
  \ kobject *kobj,\n                             struct kobj_attribute *attr, char\
  \ *buf){\n   return sprintf(buf, \"%.2lu:%.2lu:%.2lu:%.9lu \\n\", (ts_last.tv_sec/3600)%24,\n\
  \          (ts_last.tv_sec/60) % 60, ts_last.tv_sec % 60, ts_last.tv_nsec );\n}\n\
  \n/** @brief 以秒.纳秒（9 位）形式显示时间差 */\nstatic ssize_t diffTime_show(struct kobject *kobj,\n\
  \                             struct kobj_attribute *attr, char *buf){\n   return\
  \ sprintf(buf, \"%lu.%.9lu\\n\", ts_diff.tv_sec, ts_diff.tv_nsec);\n}\n\n/** @brief\
  \ 显示按键消抖是开还是关 */\nstatic ssize_t isDebounce_show(struct kobject *kobj,\n       \
  \                        struct kobj_attribute *attr, char *buf){\n   return sprintf(buf,\
  \ \"%d\\n\", isDebounce);\n}\n\n/** @brief 存储并设置消抖状态 */\nstatic ssize_t isDebounce_store(struct\
  \ kobject *kobj, struct kobj_attribute\n                                *attr, const\
  \ char *buf, size_t count){\n   unsigned int temp;\n   sscanf(buf, \"%du\", &temp);\
  \       // 使用临时变量进行正确的 int->bool 转换\n   gpio_set_debounce(gpioButton,0);\n   isDebounce\
  \ = temp;\n   if(isDebounce) { gpio_set_debounce(gpioButton, DEBOUNCE_TIME);\n \
  \     printk(KERN_INFO \"EBB Button: 消抖开启\\n\");\n   }\n   else { gpio_set_debounce(gpioButton,\
  \ 0);  // 将消抖时间设置为 0\n      printk(KERN_INFO \"EBB Button: 消抖关闭\\n\");\n   }\n \
  \  return count;\n}\n\n/**  使用这些辅助宏来定义 kobj_attributes 的名称和访问级别。\n * kobj_attribute\
  \ 包含一个属性 attr（名称和模式）、show 和 store 函数指针。\n * count 变量与 numberPresses 变量关联，并使用上面的\
  \ numberPresses_show 和\n * numberPresses_store 函数以模式 0664 暴露。\n */\nstatic struct\
  \ kobj_attribute count_attr = __ATTR(numberPresses, 0664, →\n  numberPresses_show,\
  \ numberPresses_store);  \nstatic struct kobj_attribute debounce_attr = __ATTR(isDebounce,\
  \ 0664, →\n  isDebounce_show, isDebounce_store);\n\n/**  __ATTR_RO 宏定义了一个只读属性。无需指明函数名为\
  \ _show，但必须存在。\n * __ATTR_WO 可用于仅写属性（仅 Linux 3.11.x+）\n*/\nstatic struct kobj_attribute\
  \ ledon_attr = __ATTR_RO(ledOn);\nstatic struct kobj_attribute time_attr  = __ATTR_RO(lastTime);\n\
  static struct kobj_attribute diff_attr  = __ATTR_RO(diffTime);\n\n/**  ebb_attrs[]\
  \ 是一个属性数组，用于创建下面的属性组。\n * 使用 kobj_attribute 的 attr 属性来提取属性结构体。\n */\nstatic struct\
  \ attribute *ebb_attrs[] = {\n      &count_attr.attr,      // 按键按下次数\n      &ledon_attr.attr,\
  \      // LED 是开还是关？\n      &time_attr.attr,       // 按键按下时间（HH:MM:SS:NNNNNNNNN）\n\
  \      &diff_attr.attr,       // 最后两次按下之间的时间差\n      &debounce_attr.attr,   // 消抖状态是真还是假\n\
  \      NULL,\n};\n\n/**  属性组使用属性数组和一个名称，该名称暴露在 sysfs 中——在本例中为 gpio46，\n * 它将在下面的\
  \ ebb_button_init() 函数中使用加载模块时可传递的自定义内核参数自动定义。\n */\nstatic struct attribute_group\
  \ attr_group = {\n      .name  = gpioName,       // 在 ebb_button_init() 中生成的名称\n\
  \      .attrs = ebb_attrs,      // 上面定义的属性数组\n};\n\nstatic struct kobject *ebb_kobj;\n\
  \n/** @brief LKM 初始化函数 */\nstatic int __init ebb_button_init(void){\n   int result\
  \ = 0;\n   unsigned long IRQflags = IRQF_TRIGGER_RISING;\n   printk(KERN_INFO \"\
  EBB Button: 初始化按键 LKM\\n\");\n   sprintf(gpioName, \"gpio%d\", gpioButton);   //\
  \ 创建 /sys/ebb/gpio46\n\n   // 在 /sys/ebb 创建 kobject sysfs 条目\n   ebb_kobj = kobject_create_and_add(\"\
  ebb\", kernel_kobj->parent);\n   if(!ebb_kobj){\n      printk(KERN_ALERT \"EBB Button:\
  \ 创建 kobject 映射失败\\n\");\n      return -ENOMEM;\n   }\n   // 将属性添加到 /sys/ebb/，例如\
  \ /sys/ebb/gpio46/numberPresses\n   result = sysfs_create_group(ebb_kobj, &attr_group);\n\
  \   if(result) {\n      printk(KERN_ALERT \"EBB Button: 创建 sysfs 组失败\\n\");\n  \
  \    kobject_put(ebb_kobj);               // 清理并移除条目\n      return result;\n   }\n\
  \   getnstimeofday(&ts_last);                // 将上次时间设置为当前时间\n   ts_diff = timespec_sub(ts_last,\
  \ ts_last);  // 设置初始时间差为 0\n\n   // 设置 LED。它是输出模式的 GPIO，默认点亮\n   ledOn = true;\n\
  \   gpio_request(gpioLED, \"sysfs\");          // gpioLED 硬编码为 60\n   gpio_direction_output(gpioLED,\
  \ ledOn);   // 设置为输出模式\n   gpio_export(gpioLED, false);             // 出现在 /sys/class/gpio/\n\
  \   gpio_request(gpioButton, \"sysfs\");       // 设置 gpioButton\n   gpio_direction_input(gpioButton);\
  \        // 设置为输入\n   gpio_set_debounce(gpioButton, DEBOUNCE_TIME); // 对按键进行消抖\n\
  \   gpio_export(gpioButton, false);          // 出现在 /sys/class/gpio/\n   printk(KERN_INFO\
  \ \"EBB Button: 按键状态: %d\\n\",\n          gpio_get_value(gpioButton));\n   irqNumber\
  \ = gpio_to_irq(gpioButton);\n   printk(KERN_INFO \"EBB Button: 按键映射到 IRQ: %d\\\
  n\", irqNumber);\n   if(!isRising){                           // 如果内核参数 isRising=0\n\
  \      IRQflags = IRQF_TRIGGER_FALLING;      // 设置为下降沿触发\n   }\n   // 下一个调用请求一个中断线\n\
  \   result = request_irq(irqNumber,          // 中断编号\n                        (irq_handler_t)\
  \ ebb_gpio_irq_handler,\n                        IRQflags,           // 使用自定义内核参数\n\
  \                        \"ebb_button_handler\", // 用于 /proc/interrupts\n      \
  \                  NULL);              // 共享线的 *dev_id\n   return result;\n}\n\n\
  static void __exit ebb_button_exit(void){\n   printk(KERN_INFO \"EBB Button: 按键被按下了\
  \ %d 次\\n\",\n          numberPresses);\n   kobject_put(ebb_kobj);           //\
  \ 清理，移除 kobject sysfs 条目\n   gpio_set_value(gpioLED, 0);      // 关闭 LED，设备已卸载\n\
  \   gpio_unexport(gpioLED);          // 取消导出 LED GPIO\n   free_irq(irqNumber, NULL);\
  \       // 释放 IRQ 编号，此处不需要 *dev_id\n   gpio_unexport(gpioButton);       // 取消导出按键\
  \ GPIO\n   gpio_free(gpioLED);              // 释放 LED GPIO\n   gpio_free(gpioButton);\
  \           // 释放按键 GPIO\n   printk(KERN_INFO \"EBB Button: 再见，来自 EBB 按键 LKM！\\\
  n\");\n}\n\n/** @brief GPIO IRQ 处理函数\n *  这是一个自定义中断处理函数，连接到上面的 GPIO。\n *  同一个中断处理函数不能并发调用，因为中断线在函数完成之前被屏蔽。\n\
  \ *  该函数是静态的，不应从此文件外部直接调用。\n *  @param irq   与 GPIO 关联的 IRQ 编号——用于日志记录。\n *  @param\
  \ dev_id 提供的 *dev_id——可用于识别哪个设备引起了中断。\n *    本示例中未使用，传递 NULL。\n *  @param regs \
  \  硬件特定的寄存器值——仅用于调试。\n *  @return 成功返回 IRQ_HANDLED，否则返回 IRQ_NONE。\n */\nstatic irq_handler_t\
  \ ebb_gpio_irq_handler(unsigned int irq,\n                                     \
  \     void *dev_id, struct pt_regs *regs){\n   ledOn = !ledOn;                 \
  \  // 每次按键按下时反转 LED\n   gpio_set_value(gpioLED, ledOn);   // 相应地设置物理 LED\n   getnstimeofday(&ts_current);\
  \      // 获取当前时间作为 ts_current\n   ts_diff = timespec_sub(ts_current, ts_last); \
  \  // 计算时间差\n   ts_last = ts_current;             // 将当前时间存储为 ts_last\n   printk(KERN_INFO\
  \ \"EBB Button: 当前按键状态为: %d\\n\",\n                   gpio_get_value(gpioButton));\n\
  \   numberPresses++;                  // 统计按下次数\n   return (irq_handler_t) IRQ_HANDLED;\
  \  // 声明 IRQ 已正确处理\n}\n\n// 以下调用是必需的——它们标识初始化函数和清理函数（如上）。\nmodule_init(ebb_button_init);\n\
  module_exit(ebb_button_exit); \n```\n\n\n\n\n\n`清单 16-5:` … `/chp16/button/button.c`\n\
  \n`清单 16-5`中的代码由贯穿全文的注释描述；不过，还有几点值得提及。\n\n*   提供了三个模块参数，可在加载 LKM 时进行配置（`isRising`、`gpioButton`和`gpioLED`）。LKM\
  \ 参数的使用在第一个 LKM 示例中已有描述。这允许你为按键输入和 LED 输出定义不同的 GPIO；它们的 sysfs 挂载名称会自动调整。代码还支持下降沿中断，以替代默认的上升沿中断。\n\
  \n*   与 kobject 条目（`ebb`）关联的属性有五个。分别是`diffTime`、`isDebounce`、`lastTime`、`ledOn`和`numberPresses`。除`isDebounce`和`numberPresses`外（即可以设置为任意值，例如重置为`0`），它们都是只读的。\n\
  \n*   `ebb_gpio_irq_handler()`函数负责大部分计时工作。时钟时间被存储，每次处理中断时都会计算出两次按下之间的时间间隔。\n\n该模块可以以下降沿模式加载，并通过以下命令进行测试：\n\
  \n```\ndebian@ebb:~/exploringbb/chp16/button$ make\ndebian@ebb:~/exploringbb/chp16/button$\
  \ sudo insmod button.ko\ndebian@ebb:~/exploringbb/chp16/button$ lsmod | grep button\n\
  button                 16384  0\ndebian@ebb:~/exploringbb/chp16/button$ cd /sys/ebb\n\
  debian@ebb:/sys/ebb$ ls\ngpio46\ndebian@ebb:/sys/ebb$ cd gpio46/\ndebian@ebb:/sys/ebb/gpio46$\
  \ ls -l\n-r--r--r-- 1 root root 4096 Sep 14 23:03 diffTime\n-rw-rw-r-- 1 root root\
  \ 4096 Sep 14 23:03 isDebounce\n-r--r--r-- 1 root root 4096 Sep 14 23:03 lastTime\n\
  -r--r--r-- 1 root root 4096 Sep 14 23:03 ledOn\n-rw-rw-r-- 1 root root 4096 Sep\
  \ 14 23:03 numberPresses\ndebian@ebb:/sys/ebb/gpio46$ cat numberPresses\n0\ndebian@ebb:/sys/ebb/gpio46$\
  \ cat numberPresses\n2\ndebian@ebb:/sys/ebb/gpio46$ cat diffTime\n0.258064856\n\
  debian@ebb:/sys/ebb/gpio46$ cat lastTime\n22:03:08:843581297\ndebian@ebb:/sys/ebb/gpio46$\
  \ sudo sh -c \"echo 0 > numberPresses\"\ndebian@ebb:/sys/ebb/gpio46$ cat numberPresses\n\
  0\ndebian@ebb:/sys/ebb/gpio46$ cat numberPresses\n1\ndebian@ebb:/sys/ebb/gpio46$\
  \ cd ~/exploringbb/chp16/button/\ndebian@ebb:~/exploringbb/chp16/button$ sudo rmmod\
  \ button \n```\n\n注意`isDebounce`和`numberPresses`条目的权限（`0664`），这与`清单 16-5`中的程序代码直接相关。确保在卸载模块之前退出`/sys/ebb/`目录；否则，如果你执行诸如`ls`之类的操作，将会导致内核恐慌。\n\
  \n内核日志（`/var/log/kern.log`）中的同步输出如下：\n\n```\ndebian@ebb:~/exploringbb/chp16/button$\
  \ dmesg\n[752877.425661] EBB Button: Initializing the button LKM\n[752877.426364]\
  \ EBB Button: button state: 0\n[752877.426376] EBB Button: button mapped to IRQ:\
  \ 109\n[752908.518265] EBB Button: The button state is currently: 1\n[752908.776338]\
  \ EBB Button: The button state is currently: 1\n[752953.694400] EBB Button: The\
  \ button state is currently: 1\n[752972.465413] EBB Button: The button was pressed\
  \ 1 times\n[752972.473613] EBB Button: Goodbye from the EBB Button LKM! \n```\n\n\
  ## 增强型 LED GPIO 驱动 LKM\n\n本章最后一个示例是一个使用 LKM 控制 LED 的驱动程序。该示例旨在介绍内核线程（kthreads）的使用，这些线程可以在\
  \ LKM 中发生事件时启动。在本示例中，kthreads 用于以用户定义的间隔闪烁 LED。\n\n### 内核线程\n\n本示例代码的总体结构在`清单 16-6`中给出。这是\
  \ Linux 内核中一个相当不寻常的线程，因为我们需要一个特定的睡眠时间来获得一致的闪烁周期。通常通过调用`schedule()`将资源返回给 kthread\
  \ 调度器。\n\n调用`kthread_run()`与用户空间的 pthread 函数`pthread_create()`非常相似。（参见`第 6 章`中关于\
  \ POSIX 线程的部分。）`kthread_run()`调用需要一个指向线程函数的指针（本例中为`flash()`）、要发送给线程的数据（本例中为 NULL）以及线程的名称，该名称会显示在`top`或`ps`命令的输出中。`kthread_run()`函数返回一个`task_struct`，该结构在此\
  \ C 文件中的各个函数之间共享，作为`*task`。\n\n```\n#include <linux/kthread.h>\nstatic struct task_struct\
  \ *task;         // 指向线程任务的指针\n\nstatic int flash(void *arg) {\n   while(!kthread_should_stop()){\
  \        // kthread_stop()调用返回 true\n      set_current_state(TASK_RUNNING);   //\
  \ 暂时阻止睡眠\n      …                                // 状态更改指令（闪烁）\n      set_current_state(TASK_INTERRUPTIBLE);\
  \    // 睡眠但可被唤醒\n      msleep(…);                                // 毫秒级睡眠 \n   }\n\
  }\n\nstatic int __init ebb_LED_init(void) {\n   task = kthread_run(flash, NULL,\
  \ \"LED_flash_thread\");   // 启动 kthread\n   …\n}\n\nstatic void __exit ebb_LED_exit(void)\
  \ {\n   kthread_stop(task);                 // 停止 LED 闪烁 kthread\n   …\n} \n```\n\
  \n`清单 16-6:` kthread 实现概要\n\n最终的源代码在此处未给出，因为它较长且与`清单 16-5`类似，只是增加了线程代码。它位于`/chp16/LED/led.c`，其中的注释提供了所有任务集成的完整描述。不过，还有几点值得注意。\n\
  \n*   使用一个名为*modes*的枚举来定义三种可能的运行状态。当向 LKM 传递命令时，必须仔细解析数据以确保其有效且在范围内。在本示例中，字符串命令只能是三个值之一（`\"\
  on\"`、`\"off\"`或`\"flash\"`），并且周期值必须在`2`到`10000`（毫秒）之间。\n\n*   `kthread_should_stop()`返回一个`bool`值。当对\
  \ kthread 调用诸如`kthread_stop()`之类的函数时，该函数将唤醒并返回 true。这会导致 kthread 运行至完成，之后 kthread\
  \ 的返回值将由`kthread_stop()`函数返回。\n\n本示例可以按如下方式构建和执行，你可以通过将睡眠周期减少到 2 毫秒来增加闪烁频率，从而观察\
  \ CPU 负载，使用以下调用：\n\n```\ndebian@ebb:~/exploringbb/chp16/LED$ make\ndebian@ebb:~/exploringbb/chp16/LED$\
  \ sudo insmod led.ko\ndebian@ebb:~/exploringbb/chp16/LED$ lsmod | grep led\nled\
  \                    16384  0\ndebian@ebb:~/exploringbb/chp16/LED$ cd /sys/ebb/led60/\n\
  debian@ebb:/sys/ebb/led60$ ls -l\ntotal 0\n-rw-rw-r-- 1 root root 4096 Sep 14 23:29\
  \ blinkPeriod\n-rw-rw-r-- 1 root root 4096 Sep 14 23:29 mode\ndebian@ebb:/sys/ebb/led60$\
  \ cat blinkPeriod\n1000\ndebian@ebb:/sys/ebb/led60$ sudo sh -c \"echo 100 > blinkPeriod\"\
  \ndebian@ebb:/sys/ebb/led60$ cat blinkPeriod\n100 \n```\n\n该 LKM 的 CPU 负载非常低，当以\
  \ 2 毫秒的睡眠持续时间闪烁时，CPU 占用率约为 0.0%：\n\n```\ndebian@ebb:/sys/ebb/led60$ sudo sh -c \"\
  echo 2 > blinkPeriod\"\ndebian@ebb:/sys/ebb/led60$ ps aux | grep LED\nroot  6330\
  \ 0.0 0.0 0  0 ?  D  23:29 0:00 [LED_flash_thread]\ndebian@ebb:/sys/ebb/led60$ sudo\
  \ sh -c \"echo off > mode\"\ndebian@ebb:/sys/ebb/led60$ sudo sh -c \"echo on > mode\"\
  \ndebian@ebb:/sys/ebb/led60$ sudo sh -c \"echo flash > mode\"\ndebian@ebb:/sys/ebb/led60$\
  \ cd ~/exploringbb/chp16/LED/\ndebian@ebb:~/exploringbb/chp16/LED$ sudo rmmod led\
  \ \n```\n\n内核日志输出如下：\n\n```\n[754476.056631] EBB LED: Initializing the EBB LED LKM\n\
  [754476.063535] EBB LED: Thread has started running\n[754734.149136] EBB LED: Thread\
  \ has run to completion\n[754734.155086] EBB LED: Goodbye from the Beagle LED LKM!\
  \ \n```\n\n\n\n\n与 Linux 用户空间中的类似测试相比，这种方法的结果相当令人印象深刻。结果具有一致的约 50%占空比，且频率值的范围也非常一致。\n\
  \n## 结论\n\n请记住，内核本质上是一个程序——一个庞大而复杂的程序，但终究是一个程序。可以对内核代码进行修改、重新编译、重新部署，然后重启，这是一个相当漫长的过程。本章向你介绍了如何编写自己的\
  \ Linux 可加载内核模块，这允许你创建可以在运行时从内核加载和卸载的二进制代码。\n\n本章中提供的示例仅供学习之用。你不太可能需要编写 LKM 来直接控制按钮或\
  \ LED。例如，Linux 中提供了 GPIO 按键和 GPIO LED 驱动程序，为这类电路提供复杂的内核支持。然而，这些示例应该能为其他嵌入式 LKM 开发任务提供坚实的基础。\n\
  \n有关 Linux 下 GPIO 内核编程的更多信息，请参阅以下内容：\n\n*   用户空间的 GPIO Sysfs 接口：[`tiny.cc/beagle1602`](http://tiny.cc/beagle1602)\n\
  \n*   GPIO 接口（内核空间）：[`tiny.cc/beagle1603`](http://tiny.cc/beagle1603)\n\n*   *Linux\
  \ 内核开发*，Robert Love 著，Addison-Wesley Professional 出版社，第三版（2010 年 7 月 2 日），ISBN 978-0672329463\n\
  \n## 总结\n\n完成本章后，你应该能够做到以下几点：\n\n*   编写一个基本的 Linux 可加载内核模块（LKM），该模块可以接收内核参数\n\n\
