  \n## 注释\n\n# 第 3 章\n\n探索嵌入式 Linux 系统\n\n本章将向你介绍有效管理基于 Beagle 的嵌入式 Linux 系统所需的核心概念、命令和工具。本章的第一部分是描述性的，解释了嵌入式\
  \ Linux 的基础知识和 Linux 启动过程。之后，你将逐步学习如何管理 Linux 系统。对于这个练习，强烈建议你打开一个连接到板子的终端并跟随操作。接下来，本章介绍了\
  \ Git 源代码管理系统。这个主题很重要，因为本书中的源代码示例是通过 GitHub 分发的。还介绍了桌面虚拟化，它对于后续章节中的跨平台开发非常有用。本章最后描述了如何下载本书的源代码示例。\n\
  \n本章所需设备：\n\n*   任何带有终端连接的 Beagle 板，最好运行 Debian\n\n有关本章的更多详细信息，请访问 [`www.exploringbeaglebone.com/chapter3/`](http://www.exploringbeaglebone.com/chapter3/)。\n\
  \n## 嵌入式 Linux 简介\n\n首先，尽管本章标题中使用了“嵌入式 Linux”一词，但实际上并不存在所谓的嵌入式 Linux！并没有专门针对嵌入式系统的特殊\
  \ Linux 内核版本；它只是在嵌入式系统上运行的主线 Linux 内核。尽管如此，“嵌入式 Linux”一词已被广泛使用；因此，这里使用它来代替更准确的表述“嵌入式系统上的\
  \ Linux”。\n\n术语“嵌入式 Linux”中的“嵌入式”一词用于表示存在一个*嵌入式系统*，这个概念可以粗略地解释为某种具有集成软件的计算机硬件，专为特定应用而设计。这个概念与个人计算机（PC）形成对比，后者是一种通用计算设备，设计用于多种应用，如网页浏览、文字处理和游戏。嵌入式系统和通用计算设备之间的界限正在模糊。例如，BeagleBone\
  \ Black (BBB) 或 BeagleBoard 可以两者兼用，许多用户会将它们仅作为功能强大的通用计算设备来部署。然而，嵌入式系统具有一些显著特征。\n\
  \n*   它们往往具有特定且专用的应用。\n\n*   它们通常处理能力有限、内存和存储能力有限。\n\n*   它们通常是更大系统的一部分，可能连接到外部传感器或执行器。\n\
  \n*   它们通常扮演着可靠性至关重要的角色（例如，汽车、飞机和医疗设备中的控制器）。\n\n*   它们通常实时工作，其输出直接与当前输入相关（例如，控制系统）。\n\
  \n\n\n\n\n*   近年来，连接性已成为嵌入式系统的核心特性，使其成为物联网（IoT）的构建模块。\n\n嵌入式系统在日常生活中无处不在。例如自动售货机、家用电器、手机/智能手机、制造/装配线、电视、游戏机、汽车（如动力转向和倒车传感器）、网络交换机、路由器、无线接入点、音响系统、医疗监控设备、打印机、楼宇门禁、停车计时器、智能水/电表、手表、建筑工具、数码相机、显示器、平板电脑、电子阅读器、任何机器人设备、智能卡支付/门禁系统等等。\n\
  \n嵌入式 Linux 设备的迅猛发展，部分归功于智能手机技术的快速演进，这有助于降低基于 ARM 的处理器单价。ARM Holdings PLC 是一家英国公司，将其\
  \ ARM 处理器的知识产权授权给德州仪器（Beagle 板所用处理器的制造商），收取前期费用以及基于处理器售价的小额版税。\n\n### 嵌入式 Linux\
  \ 的优缺点\n\n嵌入式平台种类繁多，各有优缺点。有低成本嵌入式平台，批量价格低于 1 美元，例如 Microchip AVR 或 PIC 或德州仪器 MSP43x\
  \ 处理器；也有成本超过 150 美元的高端专用平台，例如多核数字信号处理器（DSP）。这些平台通常使用 C 和/或汇编语言编程，要求你在开发有用应用程序之前了解底层系统架构。嵌入式\
  \ Linux 为这些平台提供了一种替代方案，即无需深入了解底层架构即可开始构建应用程序。但是，如果你需要与电子模块或组件交互，则仍需具备一些相关知识。\n\n\
  以下是嵌入式 Linux 得以如此增长的一些原因：\n\n*   Linux 是一种高效且可扩展的操作系统（OS），可运行于从低成本消费类设备到昂贵的大型服务器等各种设备上。它经过多年发展，从计算机远不如今天强大的时代一路走来，但保留了许多高效特性。\n\
  *   已有大量开源程序和工具可供开发，可以轻松部署到嵌入式应用中。如果你的嵌入式应用需要 Web 服务器，你可以安装与 Linux 服务器上可能使用的相同服务器。\n\
  *   对于许多不同的外设和设备（从网络适配器到显示器），都有出色的开源支持。\n*   它是开源的，使用无需付费。\n*   内核和应用程序代码在全球如此多的设备上运行，以至于\
  \ bug 很少出现，且能被快速检测到。\n\n嵌入式 Linux 的一个缺点是，由于操作系统开销，它并不适合实时应用。因此，对于高精度、快速响应的应用（如模拟信号处理），嵌入式\
  \ Linux 可能不是完美的解决方案。然而，即使在实时应用中，它也常被用作专用实时传感器网络阵列的“中央智能”和控制接口（参见第 10 章）。此外，*实时操作系统*（RTOS）Linux\
  \ 方面也在不断开发，旨在以抢占方式使用 Linux，在需要时随时中断操作系统以维持实时进程。\n\n### Linux 是开源且免费的吗？\n\nLinux\
  \ 根据 *GNU* 通用公共许可证（GPL）发布，该许可证授予用户以任何方式使用和修改其代码的自由；因此，*免费*通常指的是“自由”而非“零成本”。事实上，一些最昂贵的\
  \ Linux 发行版正是针对嵌入式架构的。你可以在 [`www.gnu.org`](http://www.gnu.org) 找到 GPLv3 的快速指南，其中列出了每个用户应享有的四项自由（Smith,\
  \ 2013）。\n\n> *使用软件用于任何目的的自由*\n> *修改软件以满足你需求的自由*\n> *与朋友和邻居分享软件的自由*\n> *以及分享你所做修改的自由*\n\
  \n即使你使用的是“免费”下载的发行版，也可能需要付出大量努力来定制库和设备驱动程序，以适配你希望在产品开发中使用的特定组件和模块。\n\n### 启动 Beagle\
  \ 板\n\n当你启动台式计算机时，首先看到的应该是 *统一可扩展固件接口*（UEFI），它为基本输入/输出系统（BIOS）服务提供传统支持。启动屏幕显示系统信息，并提示你按某个键更改这些设置。UEFI\
  \ 测试硬件组件（如内存），然后加载操作系统，通常从固态硬盘（SSD）/硬盘加载。因此，当台式计算机通电时，UEFI/BIOS 执行以下步骤：\n\n1.  接管计算机处理器的控制权\n\
  2.  初始化并测试硬件组件\n3.  从 SSD/硬盘加载操作系统\n\nUEFI/BIOS 为操作系统与显示器及其他输入/输出外设（如鼠标/键盘和存储设备）的交互提供了一个抽象层。其设置存储在\
  \ NAND 闪存和电池供电的内存中——你可以在 PC 主板上看到一块支持实时系统时钟的小型纽扣电池。\n\n#### *引导加载程序*\n\n与大多数嵌入式\
  \ Linux 设备一样，Beagle 板默认没有 UEFI/BIOS 或电池供电的内存（第 8 章 中会在板上添加一个电池供电的实时时钟）。相反，它使用一组\
  \ *引导加载程序* 的组合。引导加载程序通常是小型程序，执行将板卡特定硬件与 Linux 操作系统连接起来的关键功能。引导加载程序执行以下操作：\n\n* \
  \  初始化控制器（内存、图形、I/O）\n*   为操作系统准备和分配系统内存\n*   定位操作系统并提供加载它的功能\n*   加载操作系统并将控制权移交给它\n\
  \nBeagle 板使用一个名为 `Das U-Boot`（“通用”引导加载程序）的开源 Linux 引导加载程序。它是利用对硬件描述的详细了解，为每个 Beagle\
  \ 板定制的，这些描述在板卡特定的软件补丁中提供。\n\n`/boot` 目录包含 Linux 内核以及启动板卡所需的其他文件。例如，在 PocketBeagle\
  \ 上（有两个不同的内核版本），你会看到如下目录列表：\n\n```\ndebian@beaglebone:/boot$ ls -l\n-rw-r--r-- 1\
  \ root root   159786 Apr 22 07:17 config-4.14.35-ti-rt-r44\n-rw-r--r-- 1 root root\
  \   163837 Apr 22 11:44 config-4.9.88-ti-rt-r111\ndrwxr-xr-x 6 root root     4096\
  \ Apr 25 01:14 dtbs\n-rw-r--r-- 1 root root  4468991 Apr 24 01:01 initrd.img-4.14.35-ti-rt-r44\n\
  -rw-r--r-- 1 root root  6523044 Apr 25 01:34 initrd.img-4.9.88-ti-rt-r111\n-rw-r--r--\
  \ 1 root root      492 Mar  5 13:11 SOC.sh\n-rw-r--r-- 1 root root  3634267 Apr\
  \ 22 07:17 System.map-4.14.35-ti-rt-r44\n-rw-r--r-- 1 root root  3939313 Apr 22\
  \ 11:44 System.map-4.9.88-ti-rt-r111\ndrwxr-xr-x 2 root root     4096 Mar  5 07:14\
  \ uboot\n-rw-r--r-- 1 root root     1882 Apr 25 01:26 uEnv.txt\n-rwxr-xr-x 1 root\
  \ root 10379776 Apr 22 07:17 vmlinuz-4.14.35-ti-rt-r44\n-rwxr-xr-x 1 root root 10070592\
  \ Apr 22 11:44 vmlinuz-4.9.88-ti-rt-r111 \n```\n\n这些文件具有以下功能：\n\n*   Linux 内核位于压缩的\
  \ `vmlinuz*` 文件中。\n*   初始 RAM 磁盘（内存中的文件系统）位于 `initrd*` 文件中，它创建一个临时根文件系统（称为 *早期用户空间*），用于识别硬件并加载启动“真正”文件系统所需的内核模块。\n\
  \n\n\n\n\n*   `uEnv.txt` 文件用于设置开发板的启动参数。你可以编辑此文件来设置自定义启动属性（例如，按照第 2 章所述设置烧录镜像）。\n\
  \n*   `System.map*` 文件提供了从内核特定构建代码到人类可读符号的调试映射，以便分析任何崩溃转储文件。此文件并非启动必需。\n\n*   `config*`\
  \ 文件列出了构建内核时所选的选项。它是人类可读的，并非启动必需。你可以输入 `more /boot/config-4.xxx` 查看构建配置。\n\n*  \
  \ `SOC.sh` 是一个脚本，包含引导加载程序升级时所需的引导加载程序信息。它是人类可读的，并非启动必需。\n\n*   `/boot/dtbs/` 目录包含多个子目录，其中存放了启动开发板所需的设备树二进制文件。每个子目录为特定的内核构建提供二进制文件。\n\
  \n图 3-1 展示了 Beagle 开发板上的启动过程，其中每个引导加载程序阶段由前一阶段的引导加载程序加载并调用。当复位向量被调用时，AM335x 中的*主程序加载器*开始执行。它从\
  \ eMMC/SD 卡加载名为 `MLO` 的*第一阶段引导加载程序*（也称为*第二阶段程序加载器*）。该加载程序初始化时钟和内存，并从 eMMC/SD 卡加载第二阶段引导加载程序\
  \ `u-boot.img`。`MLO`（约 92 KB）和 `u-boot.img`（约 420 KB）文件位于 SD 卡的原始区域中，该区域位于 Linux\
  \ ext4 分区之前。¹ 例如，当你调用 `lsblk` 时，会看到 ext4 分区从扇区 8,192（4,194,304 字节）开始，如下所示：\n\n![Beagle\
  \ 开发板上的完整启动序列，描绘了标记为 Texas Instruments Boot ROM（位于 AM335x 内部）、U-Boot SPL（位于 SD 卡\
  \ RAW 模式）、U-Boot（位于 SD 卡 RAW 模式的 u–boot.img）和 Linux 内核（位于 SD 卡/eMMC 的 Ext4 分区）的矩形（从上到下）。](img/c03f001.jpg)\n\
  \n**图 3-1****：** Beagle 开发板上的完整启动序列\n\n```\ndebian@beaglebone:/boot$ sudo fdisk\
  \ -l\nDisk /dev/mmcblk0: 29.8 GiB, 32010928128 bytes, 62521344 sectors\nUnits: sectors\
  \ of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\n\
  I/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type: dos\nDisk identifier:\
  \ 0xaf2e67c6\nDevice         Boot Start      End  Sectors  Size Id Type\n/dev/mmcblk0p1\
  \ *     8192 62521343 62513152 29.8G 83 Linux \n```\n\n这为存储这些文件提供了足够的空间。\n\n这种文件系统设计的优点是，意外删除这些关键文件的可能性很小。重要的是，`u-boot.img`\
  \ 和 `MLO` 文件是使用标准 U-Boot 发行版的修补版本构建的，该版本充分了解 Beagle 开发板的硬件描述。第二阶段引导加载程序（U-Boot）执行额外的初始化，然后加载并将控制权传递给\
  \ Linux 内核，该内核位于 ext4 分区的 `/boot/` 目录中。\n\n以下输出是使用第 1 章中介绍的 USB 转 UART TTL 3V3 串行线捕获的典型启动序列。该线连接到\
