  \n第三个改动由清单 13-8 中的 `createActions()` 方法实现，当类构造函数调用该方法时，它会创建 GUI 菜单。该方法向菜单添加了两个操作：退出项用于退出应用程序，设置项用于触发\
  \ `on_openSettings()` 槽的执行，该槽会打开服务器设置对话框。\n\n在这种架构中，Beagle 板无需更新应用程序的客户端 GUI。相反，它管理\
  \ TCP 套接字连接、处理字符串并从 ADC 输入读取数值。这些操作在 Beagle 板上的开销很低，因此它能够同时处理多个客户端请求。遗憾的是，第 11 章中给出的服务器代码无法处理多个*同时*请求；它只能按顺序处理请求，如果当前正忙，则会拒绝连接。\n\
  \n### 多线程服务器应用程序\n\n对于许多服务器应用程序来说，能够处理多个同时请求至关重要。例如，如果谷歌搜索引擎网页只能按顺序处理请求，那么可能会出现很长的排队队列和/或大量被拒绝的连接！图\
  \ 13-15 展示了在 BBB 上运行的多线程服务器应用程序与两个独立客户端应用程序同时通信时必须执行的步骤。步骤如下：\n\n1.  TCP 客户端 1 请求连接到\
  \ BBB TCP 服务器。它必须知道服务器的 IP 地址（或名称）和端口号。\n2.  BBB TCP 服务器创建一个新线程（连接处理程序 1），并将 TCP\
  \ 客户端的 IP 地址和端口号传递给它。BBB TCP 服务器立即开始监听新连接（在端口 5555 上）。然后，连接处理程序 1 线程与 TCP 客户端 1\
  \ 建立连接并开始通信。\n3.  TCP 客户端 2 请求连接到 BBB TCP 服务器。此时连接处理程序 1 线程正在与 TCP 客户端 1 通信，但 BBB\
  \ TCP 服务器也在监听连接。\n4.  BBB TCP 服务器创建一个新线程（连接处理程序 2），并将第二个 TCP 客户端的 IP 地址和端口号传递给它。BBB\
  \ TCP 服务器立即开始监听新连接。然后，连接处理程序 2 线程与 TCP 客户端 2 建立连接并开始通信。\n\n![说明在 BBB 上运行的多线程服务器应用程序与两个独立应用程序同时通信时必须执行的四个步骤的插图。](img/c13f015.jpg)\n\
  \n**图 13-15****:** BBB 上的多线程服务器\n\n\n\n\n\n此时，客户端/连接处理器对之间同时进行通信，而服务器主线程正在监听新连接。客户端/连接处理器的通信会话可能会持续很长时间——例如，用于\
  \ YouTube 或 Netflix 等视频流互联网服务。\n\n如果连接处理器对象未实现为线程，那么服务器必须等待客户端/连接处理器通信完成，才能再次监听新连接。按照所描述的结构，服务器仅在构建新的连接处理器线程对象时不可用。一旦对象创建完成，服务器便返回监听状态。客户端套接字连接具有可配置的超时限制（通常为秒级），因此服务器短暂的处理延迟不应导致连接被拒绝。\n\
  \nC++ 多线程客户端/服务器示例位于 `chp13/threadedclientserver` 目录中。`ConnectionHandler` 类中人为添加了五秒延迟，以确凿证明同时通信正在发生。例如，你可以在开发板上打开三个终端会话并启动服务器。\n\
  \n```\n~/exploringbb/chp13/threadedclientserver$ ls\nbuild  client  client.cpp \
  \ network  server  server.cpp\n~/exploringbb/chp13/threadedclientserver$ ./server\n\
  Starting EBB Server Example\nListening for a connection… \n```\n\n然后在下一个终端中启动 TCP\
  \ 客户端 1。\n\n```\n~/exploringbb/chp13/threadedclientserver$ ./client localhost\n\
  Starting EBB Client Example\nSending [Hello from the Client] \n```\n\n然后在最后一个终端中启动\
  \ TCP 客户端 2（要快——延迟只有五秒！）。\n\n```\n~/exploringbb/chp13/threadedclientserver$ ./client\
  \ localhost\nStarting EBB Client Example\nSending [Hello from the Client] \n```\n\
  \n第二个客户端能够在第一个客户端等待（人为延迟的）响应时连接成功，这一事实意味着服务器必须是多线程的。服务器的最终输出如下：\n\n```\n~/exploringbb/chp13/threadedclientserver$\
  \ ./server\nStarting EBB Server Example\nListening for a connection…\nReceived from\
  \ the client [Hello from the Client]\nSending back [The Server says thanks!]\n \
  \ but going asleep for 5 seconds first….\nReceived from the client [Hello from the\
  \ Client]\nSending back [The Server says thanks!]\n  but going asleep for 5 seconds\
  \ first…. \n```\n\n两个客户端将显示相同的最终输出。\n\n```\n~/exploringbb/chp13/threadedclientserver$\
  \ ./client localhost\nStarting EBB Client Example\nSending [Hello from the Client]\n\
  Received [The Server says thanks!]\nEnd of EBB Client Example \n```\n\n`ConnectionHandler`\
  \ 类的类定义见清单 13-9。该类结构稍显复杂，以便在创建类的对象时创建并启动一个线程。此代码可用作模板——只需重写 `threadLoop()` 实现即可。\n\
  \n```\nclass SocketServer;  // 类声明，由于循环引用问题\n                     // 以及 C/C++ 单一定义规则。\
  \ \nclass ConnectionHandler {\npublic:\n   // 构造函数期望一个指向调用它的服务器的引用，\n   // 以及传入的套接字和文件描述符\n\
  \   ConnectionHandler(SocketServer *server, sockaddr_in *in, int fd);\n   virtual\
  \ ~ConnectionHandler();\n   int  start();\n   void wait();\n   void stop() { this->running\
  \ = false; }  // 停止线程循环\n   virtual int send(std::string message);  // 向客户端发送消息\n\
  \   virtual std::string receive(int size);  // 接收消息\nprotected:\n   virtual void\
  \ threadLoop();     // 用户定义的线程循环\nprivate:\n   sockaddr_in  *client;          //\
  \ 客户端套接字句柄\n   int          clientSocketfd;   // 客户端套接字文件描述符\n   pthread_t    thread;\
  \           // 线程\n   SocketServer *parent;          // 服务器对象句柄\n   bool       \
  \  running;          // 线程是否正在运行（默认为 true）\n\n   // 静态方法，用于在创建对象时启动线程\n   static\
  \ void * threadHelper(void * handler){\n          ((ConnectionHandler *)handler)->threadLoop();\n\
  \          return NULL;\n   }\n}; \n```\n\n**清单 13-9:** `/chp13/threadedclientserver/network/ConnectionHandler.h`\n\
  \n### 多线程温度服务\n\n本节对上一节中的代码进行了修改，以创建清单 13-10 中的多线程温度服务，该代码位于 `chp13/threadedTemperatureServer/`\
  \ 目录中。你不太可能需要每隔几分之一秒就检查一次室温。因此，在此示例中，多线程方法有些大材小用。然而，这种结构对于流式传输数据的应用程序非常重要，因此了解它很有用。\n\
  \n```\nint ConnectionHandler::readAnalog(int number){ … // 与之前相同 }\n\nfloat ConnectionHandler::getTemperature(int\
  \ adc_value){ … // 与之前相同 }\n\nvoid ConnectionHandler::threadLoop(){\n          \
  \ cout << \"*** Created a Temperature Connection Handler threaded Function\" <<\
  \ endl;\n    string rec = this->receive(1024);\n    if (rec == \"getTemperature\"\
  ){\n       cout << \"Received from the client [\" << rec << \"]\" << endl;\n   \
  \    stringstream ss;\n       ss << \" { \\\"sample\\\": { \\\"temperature\\\" :\
  \ \";\n          ss <<  this->getTemperature(this->readAnalog(0)) << \" } } \";\
  \  //JSON 字符串\n       this->send(ss.str());\n       cout << \"Sent [\" << ss.str()\
  \ << \"]\" << endl;\n    }\n    else {\n       cout << \"Received from the client\
  \ [\" << rec << \"]\" << endl;\n       this->send(string(\"Unknown Command\"));\n\
  \    }\n    cout << \"*** End of the Temperature Connection Handler Function\" <<\
  \ endl;\n    this->parent->notifyHandlerDeath(this);\n} \n```\n\n**清单 13-10:** `/threadedTemperatureServer/network/ConnectionHandler.cpp`\n\
  \n温度服务器代码可以通过使用与服务器位于同一目录下的 `temperatureClientTest` CLI 测试应用程序进行测试，方法如下：\n\n```\n\
  …/chp13/threadedTemperatureServer$ ./temperatureServer\nStarting EBB Server Example\n\
  Listening for a connection… \n```\n\n然后在另一个终端中执行测试客户端。\n\n```\n…/…/threadedTemperatureServer$\
  \ ./temperatureClientTest localhost\nStarting EBB Temperature Client Test\nSending\
  \ [getTemperature]\nReceived [ { \"sample\": { \"temperature\" : 21.4551 } } ]\n\
  End of EBB Temperature Client Test \n```\n\n服务器的最终输出如下：\n\n```\n…/chp13/threadedTemperatureServer$\
  \ ./temperatureServer\nStarting EBB Server Example\nListening for a connection…\n\
  Starting the Connection Handler thread\n*** Created a Temperature Connection Handler\
  \ threaded Function\nReceived from the client [getTemperature]\nSent [ { \"sample\"\
  : { \"temperature\" : 21.4551 } } ]\n*** End of the Temperature Connection Handler\
  \ Function … \n```\n\n主机名 `localhost` 被解析为回环地址 127.0.0.1，这使得开发板能够与自身通信。如果客户端应用程序输出一个温度值（例如\
  \ 21.4551°C），则此测试成功，并且 Qt 胖客户端 GUI 应用程序也应能连接到服务器，如图 13-14 所示。\n\n#### *解析流数据*\n\n\
  在服务器和客户端之间发送数据的显而易见的方法是使用字节数据，并进行*编组*和*解组*数据值。这可以通过手动将数值数据转换为字符串值来实现；然而，手动转换容易产生解析错误，尤其是在通信复杂性增加时。解决此问题的一种方法是使用\
  \ XML 格式在客户端和服务器之间进行通信。例如，示例数据可以结构化为简单的 XML 消息格式。\n\n```\n<sample><temperature>21.4551</temperature></sample>\
  \ \n```\n\n\n\n\n\nQt 框架在 `QtXml` 模块中通过 `QXmlStreamReader` 类提供了对 XML 解析的完整支持。\n\n\
  另一种解决方案是使用 *JavaScript 对象表示法*（JSON），这也是一种人类可读的格式，常用于服务器与 Web 应用程序之间传输数据。你可能已经注意到，Qt\
  \ 温度客户端/服务器应用程序中的示例数据以 JSON 格式传输，如下所示：\n\n```\n{ \n   \"sample\": { \n      \"temperature\"\
  \ : 21.4551, \n   } \n} \n```\n\nQt 框架还通过 `QJsonDocument` 类提供了对 JSON 数据解析的完整支持。清单\
  \ 13-11 是 Qt 温度客户端应用程序中解析 JSON 数据格式并提取浮点温度值的代码片段。通过将字节数据转换为 `QJsonObject` 类的 `sample`\
  \ 对象，可以调用 `sample[\"name\"].toDouble()` 来获取数据值，其中 `name` 是要获取值的字符串名称。其他数据类型也有类似的函数，例如\
  \ `toInt()`、`toString()`、`toBool()` 和 `toArray()`。\n\n```\nint MainWindow::parseJSONData(QString\
  \ str){\n   QJsonDocument doc = QJsonDocument::fromJson(str.toUtf8());\n   QJsonObject\
  \ obj = doc.object();\n   QJsonObject sample = obj[\"sample\"].toObject();\n   this->curTemperature\
  \ = sample[\"temperature\"].toDouble();\n   cout << \"The temperature is \" << this->curTemperature\
  \ << endl;\n   return 0;\n} \n```\n\n**清单 13-11:** `/chp13/QtSocketsTemperature/mainwindow.cpp`（片段）\n\
  \n该框架非常灵活，可应用于 Beagle 板上的许多客户端/服务器应用程序。事实上，它甚至可以反过来使用，让 Beagle 板作为客户端，而桌面/服务器机器充当\
  \ TCP 服务器。无论如何，相同的多线程和数据交换原则都可以使用。\n\n### 胖客户端作为服务器\n\n在前面的示例中，Qt 胖客户端 GUI 应用程序使用服务器的\
  \ IP 地址（或主机名）和服务端口号发起与温度服务的连接。可以通过将 GUI 应用程序编程为服务器、Beagle 板编程为客户端来反转这种关系。显然，这种变化意味着\
  \ Beagle 板负责与 GUI 应用程序建立通信，因此它需要知道桌面计算机的 IP 地址和服务端口号。\n\n对于单客户端到单服务器的安排，选择哪个设备作为服务器并不那么重要。这个选择很可能通过决定哪一方最有可能发起连接来解决，然后将其选为客户端。事实上，可以在双方都构建客户端和服务器功能，但这会显著增加程序设计的复杂性。然而，对于单方到多方的关系，决策则更为清晰。例如，温度服务应用程序的设计使得许多客户端应用程序可以连接到一个服务器。在这种情况下，反转客户端/服务器关系将极其困难，因为\
  \ Beagle 板温度传感器必须设法识别每个 GUI 应用程序并推送温度读数。\n\n有些应用程序适合让 GUI 应用程序作为服务器，Beagle 板作为客户端。特别是当一个\
  \ GUI 应用程序负责聚合来自多个服务和/或 Beagle 板设备的传感器读数时，情况更是如此。图 13-16 展示了这样一个示例。在此示例中，BBB 通过\
  \ I²C 总线连接到 ADXL345 加速度计。BBB 将加速度计数据流式传输到 GUI 应用程序，该应用程序提供 ADXL345 俯仰角和翻滚角的“实时”图形显示。为简洁起见，此示例使用一个\
  \ BBB 客户端，但可以轻松调整为使用多个客户端，并显示多个 GUI 界面或对样本数据进行平均。\n\n![Qt 加速度计客户端/服务器应用程序的插图，该应用程序负责聚合来自多个服务和/或\
  \ Beagle 板设备的传感器读数。](img/c13f016.jpg)\n\n**图 13-16****:** Qt 加速度计客户端/服务器应用程序\n\n\
  在此示例中，Qt GUI 服务器应用程序上的控件*不用于输入*；相反，它们会根据 ADXL345 的俯仰角和翻滚角动态变化——GUI 应用程序上唯一的输入控件是退出按钮和菜单。当前的俯仰角和翻滚角各由三个\
  \ Qt 小部件描述：顶部的 `QDoubleSpinBox`，以 `double` 类型显示值；一个 `QDial`，当值从 −90° 变化到 +90° 时旋转（0°\
  \ 时拨盘指示器位于最顶部）；以及一个带刻度的 `QSlider`，从 −90° 滑动到 +90°（0° 是中心值）。此应用程序与之前的 Qt GUI 应用程序在多个方面有所不同。\n\
  \n*   BBB 是客户端，GUI 应用程序是服务器。\n\n*   BBB 发送连续的数据流，共 1000 个读数，每个读数每 50 毫秒发送一次。GUI\
  \ 显示即时更新，没有延迟问题（地理距离会产生影响）。\n\n*   GUI 应用程序是多线程的，以便保持“活跃”。创建一个线程对象来处理与客户端的通信，使主循环能够继续其角色。如果不使用线程，则无法通过单击退出按钮退出。\n\
  \n*   消息协议更加复杂，因为它使用 XML 数据进行通信。这个问题稍后会讨论。\n\nQt GUI 服务器应用程序位于 Git 仓库目录 `/chp13/QtSocketsAccelerometer`\
  \ 中，BBB 客户端应用程序位于目录 `/chp13/ADXL345Client` 中。清单 13-12 提供了用于与 ADXL345 传感器客户端通信的核心线程循环。以这种方式使用线程意味着代码结构可以轻松适应与多个客户端设备同时通信。\n\
  \n```\nvoid ServerThread::run(){                 // 主线程循环\n   QTcpSocket clientSocket;\
  \               // clientSocket 对象\n   this->running = true;                  //\
  \ 主线程循环布尔标志\n   if (!clientSocket.setSocketDescriptor(socketDescriptor)){ // 设置套接字\n\
  \      qDebug() << \"Failed to set up the Socket\";  // 调试输出\n   }\n   while(running){\
  \                        // 循环直到标志改变\n      if(!clientSocket.waitForReadyRead(1000)){\
  \ // 等待最多 1 秒\n          this->running = false;                // 失败 - 退出循环\n  \
  \    }\n      while(clientSocket.bytesAvailable()>0)    // 是否有可用字节？\n      {\n \
  \         int x = clientSocket.bytesAvailable();  // 有多少？\n          qDebug() <<\
  \ \"There are \" << x << \" bytes available\"; // 调试\n          char data[2000];\
  \                // 最多容纳 2000 字节\n          x = (qint64) clientSocket.read(&data[0],\
  \ (qint64) x);\n          data[x] = '\\0';                 // 添加空字符以便打印输出\n    \
  \      this->parse(&data[0]);          // 解析 XML 字符串\n      }\n   }\n   clientSocket.close();\
  \                  // 如果循环结束，关闭套接字\n   qDebug() << \"The client just disconnected\"\
  ;    // 调试输出\n} \n```\n\n**清单 13-12:** `/chp13/QtSocketsAccelerometer/serverthread.cpp`（片段）\n\
  \nQt GUI 服务器应用程序包含多个类，如图 13-17 所示。当应用程序执行时，会创建 `QMainWindow` 对象。其主要角色是更新 UI，它通过一个名为\
  \ `sampleConsume()` 的槽来执行此操作，该槽在数据发送到服务器时接收 `SensorSample` 类的对象。`SensorSample` 对象包含一个俯仰角值和一个翻滚角值，用于更新\
  \ UI 组件。\n\n\n\n\n\n![Qt 加速度计客户端/服务器应用程序程序的结构。当应用程序执行时，会创建 QMainWindow 对象。](img/c13f017.jpg)\n\
  \n**图 13-17****：** Qt 加速度计客户端/服务器应用程序结构\n\n当创建 `QMainWindow` 对象时，它会实例化一个 `AccelerometerServer`\
  \ 类（`QTcpServer` 的子类）的对象。该服务器对象等待传入连接；当收到连接时，它会创建一个 `ServerThread` 类（`QThread` 的子类）的对象。然后，`ServerThread`\
  \ 对象与 BBB ADXL345 客户端应用程序建立读写连接。客户端应用程序以 XML 形式发送加速度计数据，`ServerThread` 对象解析这些数据以创建\
  \ `SensorSample` 对象。如果数据解析成功，则会触发一个信号，将 `SensorSample` 对象传递给 `sampleConsume()` 槽。\n\
  \n#### *使用 XML 解析流数据*\n\n如前文讨论 JSON 时所述，在客户端和服务器之间来回发送字符串数据容易导致解析错误，尤其是在通信复杂度增加时。本示例使用\
  \ XML 格式在客户端和服务器之间进行通信。本示例使用简单的 XML 消息传递样本数据：\n\n```\n<sample><acc><pitch>4.4666</pitch><roll>-85.447</roll></acc></sample>\
  \ \n```\n\nQt 框架通过 `QtXml` 模块中的 `QXmlStreamReader` 类完全支持 XML 解析。它可以高效地将此类 XML 字符串转换为数据结构，具有以下优点：\n\
  \n*   如果数据流损坏（例如，通过搜索流中的下一个有效标签），可以从通信错误中恢复。\n\n*   具有人类可读的格式可以极大地帮助调试代码。\n\n* \
  \  可以向流中添加额外的标签，并且不会影响正在读取流的旧版应用程序。例如，可以在 `<sample>` 标签中引入新的 `<gyro> … </gyro>`\
  \ 标签，而不会阻止此应用程序运行。\n\n*   可以编写 DTD（文档类型定义）或 XML Schema 来描述 XML 的规则（例如，元素的嵌套和出现），以正式支持第三方通信。\n\
  \n缺点是额外的标签信息会增加要传输的数据量，并且处理 XML 会产生开销。清单 13-13 提供了此应用程序中用于解析从 BBB ADXL345 客户端应用程序发送的\
  \ XML 数据的源代码。\n\n```\nint ServerThread::parse(char *data){\n  QXmlStreamReader xml(data);\n\
  \  while(!xml.atEnd() && !xml.hasError()){\n    if((xml.tokenType()==QXmlStreamReader::StartElement)\
  \ &&    // found <sample>\n       (xml.name()==\"sample\")){\n      // this is a\
  \ data sample <sample> - need to loop until </sample>\n      float pitch = 0.0f,\
  \ roll = 0.0f;\n      xml.readNext();                                    // read\
  \ next token\n      while(!((xml.tokenType()==QXmlStreamReader::EndElement)&&  \
  \  // </sample>\n              (xml.name()==\"sample\"))){\n        qDebug() <<\
  \ \"Found a sample\";\n        if((xml.tokenType()==QXmlStreamReader::StartElement)\
  \       // <acc>\n                  &&(xml.name()==\"acc\")){\n          xml.readNext();\n\
  \          qDebug() << \"-- it has an acceleration element\";\n          while(!((xml.tokenType()==QXmlStreamReader::EndElement)\
  \  // </acc>\n                    &&(xml.name()==\"acc\"))){\n            if(xml.tokenType()\
  \ == QXmlStreamReader::StartElement){ // <pitch>\n              if(xml.name() ==\
  \ \"pitch\") {\n                QString temp = xml.readElementText();    // read\
  \ the value\n                pitch = (temp).toFloat();                // convert\
  \ to float\n              }\n              if(xml.name() == \"roll\") {        \
  \                   // <roll>\n                QString temp = xml.readElementText();\n\
  \                roll = (temp).toFloat();\n              }\n            }\n    \
  \        xml.readNext();\n          }\n        }\n        xml.readNext();\n    \
  \  }\n      SensorSample sample(pitch, roll);      // create a sample object and\n\
  \      emit sampleReceived(sample);           // emit it as a signal -- caught\n\
  \      }                                          // by a slot in mainWindow, which\n\
  \    xml.readNext();                          // updates the display widgets\n \
  \   }\n  return 0;\n} \n```\n\n**清单 13-13：** `/chp13/QtSocketsAccelerometer/serverthread.cpp`（片段）\n\
  \n另一种解决方案是再次使用 JSON 格式。相同的加速度计数据可以按如下 JSON 格式传输：\n\n```\n{\n    \"acc\": {\n   \
  \     \"pitch\": 32.55,\n        \"roll\": 65.55\n    }\n} \n```\n\n#### *Beagle\
  \ Board 客户端应用程序*\n\n在此应用程序示例中，更复杂的编程在 Qt GUI 服务器应用程序中，而不是在客户端中。事实上，客户端应用程序的代码（见清单\
  \ 13-14）相当简单。它使用了本书中开发的代码库，以及简单的字符串处理来构建传输的 XML 消息。\n\n```\n#include <iostream>\n\
  #include \"network/SocketClient.h\"               // using the EBB library\n#include\
  \ \"bus/I2CDevice.h\"                      // I2CDevice class see CHP8\n#include\
  \ \"sensor/ADXL345.h\"                     // ADXL345 see CHP8\n#include \"sstream\"\
  \                              // to format the string\n#include <unistd.h>    \
  \                         // for the usleep()\nusing namespace std;\nusing namespace\
  \ exploringBB;\n\nint main(int argc, char *argv[]){\n   if(argc!=2){\n      cout\
  \ << \"Usage:  accClient server_name\" << endl;\n      return 2;\n   }\n   cout\
  \ << \"Starting EBB ADXL345 Client Example\" << endl;\n   I2CDevice i2c(1,0x53);\
  \                       // the I2C device P9_19 P9_20\n   ADXL345 sensor(&i2c);\
  \                        // pass device to ADXL const.\n   sensor.setResolution(ADXL345::NORMAL);\
  \       // regular resolution\n   sensor.setRange(ADXL345::PLUSMINUS_4_G);     //\
  \ regular +/- 2G\n   SocketClient sc(argv[1], 4444);                  // server\
  \ addr and port number\n   sc.connectToServer();                        // connect\
  \ to the server\n   for(int i=0; i<1000; i++){                   // going to send\
  \ 1000 samples\n      stringstream ss;                              // use a stringstream\
  \ for msg.\n      sensor.readSensorState();                 // update the sensor\
  \ state\n      float pitch = sensor.getPitch();          // get pitch and roll\n\
  \      float roll = sensor.getRoll();            // structure as XML string\n  \
  \    ss << \"<sample><acc><pitch>\" << pitch << \"</pitch>\";\n      ss << \"<roll>\"\
  \ << roll << \"</roll></acc></sample>\";\n      cout << ss.str() << '\\xd';    \
  \                // print to output on one line\n      cout.flush();           \
  \                      // flush to update the display\n      sc.send(ss.str());\
  \                            // send the same str to server\n      usleep(50000);\
  \                            // 50ms between samples\n   }\n   cout << \"End of\
  \ EBB Client Example\" << endl;\n} \n```\n\n**清单 13-14：** `/exploringbb/chp13/ADXL345Client/accClient.cpp`\n\
  \n可以使用构建脚本构建代码，并通过提供服务器机器的地址（本例中为 192.168.7.1）来执行：\n\n```\ndebian@ebb:~/…/ADXL345Client$\
  \ ./accClient 192.168.7.1\nStarting EBB ADXL345 Client Example\n<sample><acc><pitch>0.493899</pitch><roll>0.493899</roll></acc></sample>\
  \ \n```\n\n显示在同一行上持续更新，同时将数据发送到服务器应用程序。使用 XML 消息和服务器线程意味着客户端应用程序可以停止并重新启动，而无需重新启动服务器应用程序。\n\
  \n## 总结\n\n完成本章后，您应该能够做到以下几点：\n\n\n\n\n\n*   将 Beagle 板配置为通用计算设备，并使用蓝牙外设进行控制\n*\
  \   获取用于 LCD 触摸屏显示应用的硬件\n*   使用虚拟网络计算（VNC）在 Beagle 板上远程执行图形用户界面（GUI）应用\n*   使用 GTK+和\
  \ Qt 框架构建直接在 Beagle 板上执行的丰富用户界面（UI）应用\n*   构建具有高级界面的 Qt 应用，这些界面与 Beagle 板上的硬件传感器交互\n\
  *   构建胖客户端远程 Qt 应用，通过 TCP 套接字与在 Beagle 板上执行的服务器通信\n*   增强 TCP 服务器代码以支持多线程，允许来自 TCP\
  \ 客户端应用的多个同时连接\n*   构建远程 Qt GUI 服务器应用，通过 TCP 套接字和 XML 与 Beagle 板上的客户端应用通信\n\n##\
  \ 延伸阅读\n\n以下附加链接提供了本章主题的更多信息：\n\n*   本章网页：[`www.exploringbeaglebone.com/chapter13`](http://www.exploringbeaglebone.com/chapter13)\n\
  *   GTK+2.0 核心文档：[`tiny.cc/beagle1302`](http://tiny.cc/beagle1302)\n*   Qt 信号与槽：[`tiny.cc/beagle1303`](http://tiny.cc/beagle1303)\n\
  \n## 注释\n\n# 第 14 章\n\n图像、视频和音频\n\n本章将 USB 外设连接到 Beagle 板，以便使用底层 Linux 驱动程序和 API\
  \ 捕获图像、视频和音频数据。本章介绍了可用于将捕获的视频和音频数据流式传输到互联网的 Linux 应用程序和工具。研究了开源计算机视觉（OpenCV）图像处理和计算机视觉方法，使\
  \ Beagle 板能够从捕获的图像数据的信息内容中推断出结论。描述了音频流的捕获和播放，以及蓝牙音频的使用。本章还涵盖了 Beagle 板上音频的一些应用，包括流式音频、网络电台和文本转语音。\n\
  \n本章所需设备：\n\n*   Beagle 板（最好带有 HDMI 和 USB 接口）\n*   Linux USB 摄像头（理想情况下为 Logitech\
  \ HD Pro C920）\n*   USB 音频和/或蓝牙适配器\n\n本章的更多资源可在[`www.exploringbeaglebone.com/chapter14/`](http://www.exploringbeaglebone.com/chapter14/)获取。\n\
  \n## 捕获图像和视频\n\n在本节中，Beagle 板被用作从 USB 摄像头捕获图像和视频数据并将数据保存到板载文件系统的平台。这对于机器人技术、家庭安全、家庭自动化和航空等\
  \ Beagle 板应用非常有用，尤其是在无法进行网络图像流式传输的情况下——例如，如果应用是无线的且远离无线网络。借助合适的外设，该板可以捕获高质量的视频流，并可异步查看。视频流的持续时间仅受板上可用存储空间的限制。（第\
  \ 3 章描述了在文件系统上挂载大容量 micro-SD 卡或 USB 存储设备的方法。）或者，视频可以流式传输到网络，这将在本章下一节中讨论。\n\n###\
  \ USB 摄像头\n\n本节主要关注 USB 摄像头，因为它们广泛可用，并且可以重复用作通用桌面外设。选择了 Logitech HD C270（26 美元）、HD\
  \ C310（30 美元）和 HD Pro C920（70 美元），如图 14-1 所示，因为它们是常见的 HD 摄像头，已知可在 Linux 下正常工作。实际上，在以下测试中，使用第\
  \ 1 章中显示的 USB 集线器将三个摄像头同时连接到 Beagle 板。这不是一个带电源的 USB 集线器，但在此情况下，板子连接到了 5V 2A 的电源。\n\
  \n![Logitech USB HD 摄像头型号 (a) C270, (b) C310, (c) C920 的图片](img/c14f001.jpg)\n\n\
  **图 14-1****：** Logitech USB HD 摄像头 (a) C270, (b) C310, (c) C920\n\n当三个 USB 摄像头通过\
  \ USB 集线器同时连接到板子时，“列出 USB 设备”工具提供以下输出：\n\n```\ndebian@ebb:~$ lsusb\nBus 001 Device\
  \ 002: ID 1a40:0201 Terminus Technology Inc. FE 2.1 7-port Hub\nBus 001 Device 001:\
  \ ID 1d6b:0002 Linux Foundation 2.0 root hub\nBus 002 Device 001: ID 1d6b:0002 Linux\
  \ Foundation 2.0 root hub\nBus 001 Device 003: ID 046d:082d Logitech, Inc. HD Pro\
  \ Webcam C920\nBus 001 Device 004: ID 046d:0825 Logitech, Inc. Webcam C270\nBus\
  \ 001 Device 005: ID 046d:081b Logitech, Inc. Webcam C310 \n```\n\n输出列出了摄像头的设备 ID、两个\
  \ USB 声卡适配器和一个蓝牙适配器。设备 ID 旁边列出了“Logitech”，这表明板上已经存在对这些设备的一定程度的 Linux 支持。如果不是这种情况，则必须从摄像头制造商处获取专有的\
  \ Linux 驱动程序。通常，这些驱动程序需要在摄像头使用之前构建并部署到板上。\n\n可以使用以下命令显示 USB 摄像头可用模式的完整信息：\n\n```\n\
  debian@ebb:~$ lsusb -v | less \n```\n\n此命令会产生详细且冗长的输出。此外，可以使用以下命令列出当前针对这些外设加载的可加载内核模块（LKM）：\n\
  \n```\ndebian@ebb:~$ lsmod\nModule                  Size  Used by\nsnd_usb_audio\
  \         184320  0\nuvcvideo               90112  0\nsnd_hwdep              20480\
  \  1 snd_usb_audio\nvideobuf2_vmalloc      16384  1 uvcvideo\nvideobuf2_memops \
  \      16384  1 videobuf2_vmalloc\nsnd_rawmidi            32768  1 snd_usbmidi_lib\n\
  videobuf2_v4l2         24576  1 uvcvideo\nvideobuf2_core         45056  2 uvcvideo,videobuf2_v4l2\
  \ … \n```\n\n`uvcvideo` LKM 支持符合 UVC（USB 视频类）标准的设备，例如连接的摄像头。`videobuf2_vmalloc`\
  \ LKM 是 Video4Linux 视频缓冲区的内存分配器。如果一切正常，应该会有新的视频和音频设备可用，可以使用以下命令列出：\n\n```\ndebian@ebb:~$\
  \ ls /dev/{vid,aud}*\n/dev/audio   /dev/audio2  /dev/video0  /dev/audio1  /dev/video2\n\
  /dev/audio3  /dev/video1 \n```\n\n设备`/dev/audio`映射到 HDMI 音频设备，仅当启用了 HDMI 虚拟 cape\
  \ 时才会出现。其他音频设备映射到 USB 音频适配器和 USB 摄像头。\n\n### Video4Linux2 (V4L2)\n\nVideo4Linux2\
  \ (V4L2) 是一个视频捕获驱动程序框架，与 Linux 内核紧密集成，并由`uvcvideo` LKM 支持。它为视频设备（如摄像头、PCI 视频捕获卡和电视（DVB-T/S）调谐卡/外设）提供驱动程序。V4L2\
  \ 主要通过以下类型的接口支持视频（和音频）设备：\n\n*   **视频捕获接口：** 用于从捕获设备（如摄像头、电视调谐器或视频捕获设备）捕获视频\n* \
  \  **视频输出接口：** 用于视频输出设备，例如视频传输设备或视频流设备\n*   **视频叠加接口：** 允许直接显示视频数据，无需 CPU 处理数据\n\
  *   **视频消隐间隔（VBI）接口：** 提供对模拟视频信号 VBI 期间传输的遗留数据（例如图文电视）的访问\n*   **无线电接口：** 提供对 AM/FM\
  \ 调谐器音频流的访问\n\nV4L2 支持多种类型的设备，简单来说，它很复杂！除了支持视频输入/输出外，V4L2 API 还具有用于编解码器和视频效果设备的存根，这些存根允许操作视频流数据。本节重点介绍使用\
  \ V4L2 从摄像头设备捕获视频数据，通过执行以下步骤（顺序不一定如此）：\n\n*   打开 V4L2 设备\n\n\n\n\n*   更改设备属性（例如，摄像头亮度）\n\
  *   商定数据格式和输入/输出方法\n*   执行数据传输\n*   关闭 V4L2 设备\n\nV4L2 的主要文档来源位于 [`www.kernel.org`](http://www.kernel.org)\
  \ 的 [`tiny.cc/beagle1402`](http://tiny.cc/beagle1402)，V4L2 API 规范可在 [`tiny.cc/beagle1403`](http://tiny.cc/beagle1403)\
  \ 获取。\n\n#### *图像捕获工具*\n\n第一步是安装 V4L2 开发库、抽象层、工具以及一个适用于 V4L2 兼容设备的简单网络摄像头应用程序。在安装系统库之前，务必更新软件包列表以获取最新软件包及其依赖关系的信息：\n\
  \n```\ndebian@ebb:~$ sudo apt-get update\ndebian@ebb:~$ apt-cache search v4l2\n\
  libv4l-dev - Collection of video4linux support libraries.. \n```\n\n然后，安装本节所需的软件包：\n\
  \n```\ndebian@ebb:~$ sudo apt-get install fswebcamgpicview libav-tools libv4l-dev\
  \ \n```\n\n接着，可以使用 `fswebcam` 应用程序测试连接的摄像头是否正常工作。这是一个功能强大且易于使用的应用程序，最佳使用方式是编写配置文件，如清单\
  \ 14-1 所示，其中包含选择设备、捕获分辨率、输出文件类型以及添加标题横幅的设置。甚至可以通过添加 `loop` 条目（指定帧捕获之间的时间间隔，以秒为单位）使其连续循环运行。\n\
  \n```\ndevice /dev/video0\ninput 0\nresolution 1280x720\nbottom-banner\nfont /usr/share/fonts/truetype/ttf-dejavu/DejaVuSans.ttf\n\
  title \"Exploring BeagleBone v2\"\ntimestamp \"%H:%M:%S %d/%m/%Y (%Z)\"\npng 0\n\
  save exploringBB.png \n```\n\n**清单 14-1:** `/exploringbb/chp14/fswebcam/fswebcam.conf`\n\
  \n通过在执行时传递配置文件名，可以使用这些设置配置 `fswebcam` 应用程序：\n\n```\n…/chp14/fswebcam$ ls\nfswebcam.conf\n\
  …/chp14/fswebcam$ sudo fswebcam -c fswebcam.conf\n--- Opening /dev/video0… Trying\
  \ source module v4l2…\n/dev/video0 opened. --- Capturing frame…  … \n```\n\n然后可以使用\
  \ `gpicview` 查看图像，这需要将显示器（例如 VNC 连接）连接到 Beagle 板：\n\n```\n…/chp14/fswebcam$ gpicview\
  \ exploringBB.png \n```\n\n这将产生类似于图 14-2(a) 的输出。图像数据已被修改，包含一个格式化的底部文本横幅，其中包含标题以及图像捕获的日期和时间。全分辨率捕获示例图像可在本章网页上获取。\n\
  \n![图片描述见标题。](img/c14f002.jpg)\n\n**图 14-2****:** (a) 通过 VNC 使用 `gpicview` 显示的 `fswebcam`\
  \ 网络摄像头捕获图像（1280 × 720）；(b) Cheese 应用程序显示一些可用的图像滤镜\n\n有趣的是，`fswebcam` 应用程序可以循环执行，并与\
  \ Apache Web 服务器（如第 11 章所述）结合，创建一个简单的网络摄像头，该摄像头使用一个链接到 Beagle 板文件系统上捕获图像文件的网页。\n\
  \n#### *Video4Linux2 工具*\n\nV4L2 提供了一组用户空间工具，可用于获取有关连接的 V4L2 兼容设备的信息。也可以使用这些用户空间工具更改摄像头设置；但是，执行的应用程序可能会被编程为覆盖此类更改。这些工具最重要的作用是验证连接的\
  \ V4L2 设备是否正常工作。可以使用以下命令列出可用的 V4L2 设备：\n\n```\ndebian@ebb:~$ v4l2-ctl --list-devices\n\
  HD Pro Webcam C920 (usb-musb-hdrc.1-1):    /dev/video0 \n```\n\n设备按连接到 USB 集线器的顺序显示。可以通过列出其模式来获取特定设备的信息（其中\
  \ `-d 0` 在此实例中指的是 HD Pro C920）。\n\n```\ndebian@ebb:~$ v4l2-ctl --all -d 0\nDriver\
  \ Info (not using libv4l2):\n        Driver name   : uvcvideo\n        Card type\
  \     : HD Pro Webcam C920\n        Bus info      : usb-musb-hdrc.1-1\n        Driver\
  \ version: 4.14.54\n        Capabilities  : 0x84200001 Video Capture Streaming \n\
  ```\n\n某些控件可用于配置摄像头，可以使用 `--list-ctrls` 选项访问这些控件，如下所示：\n\n```\ndebian@ebb:~$ v4l2-ctl\
  \ --list-ctrls -d 0\n brightness (int)  : min=0 max=255 step=1 default=128 value=128\n\
  \ contrast (int)    : min=0 max=255 step=1 default=128 value=128\n saturation (int)\
  \  : min=0 max=255 step=1 default=128 value=128\n white_balance_temperature_auto\
  \ (bool)   : default=1 value=1\n gain (int)        : min=0 max=255 step=1 default=0\
  \   value=255 … \n```\n\n对于 C920，其他控件包括白平衡、色温、锐度、背光补偿、曝光（自动或绝对）、对焦、变焦以及支持平移/倾斜。例如，要将设备\
  \ 0 的亮度更改为 100（当前为 128，如前面片段所示），可以使用以下命令：\n\n```\ndebian@ebb:~$ v4l2-ctl --set-ctrl=brightness=100\
  \ -d 0\ndebian@ebb:~$ v4l2-ctl --list-ctrls -d 0 | grep brightness\n brightness\
  \ (int)  : min=0 max=255 step=1 default=128 value=100 \n```\n\n还可以列出摄像头的模式。在这种情况下，有三种不同的视频捕获像素格式，带有\
  \ `fourcc` 色彩空间视频代码：`YUYV`（一种常见的广播格式，具有一个亮度通道和两个色度通道）、`H264`（一种常见的现代帧间视频压缩格式）和 `MJPG`（一种常见但较旧的仅帧内运动\
  \ JPEG 视频压缩格式）。使用以下命令获取列表：\n\n```\ndebian@ebb:~$ v4l2-ctl --list-formats -d 0\n\
  ioctl: VIDIOC_ENUM_FMT\n    Index       : 0                    Type  : Video Capture\n\
  \    Pixel Format: 'YUYV'               Name  : YUYV 4:2:2\n    Index       : 1\
  \                    Type  : Video Capture\n    Pixel Format: 'H264' (compressed)\
  \  Name  : H.264\n    Index       : 2                    Type  : Video Capture\n\
  \    Pixel Format: 'MJPG' (compressed)  Name  : Motion-JPEG \n```\n\nC270 和 C310\
  \ 摄像头没有 H.264 模式，但它们分别在索引 `0` 和 `1` 处具有 `YUYV` 和 `MJPG` 压缩像素格式。可以显式设置摄像头的分辨率和像素格式，如下所示：\n\
  \n```\n~$ v4l2-ctl --set-fmt-video=width=1920,height=1080,pixelformat=1 -d 0\n~$\
  \ v4l2-ctl --all -d 0\nDriver Info (not using libv4l2):\n        Driver name   :\
  \ uvcvideo\n        Card type     : HD Pro Webcam C920 \n        Bus info      :\
  \ usb-musb-hdrc.1-1\n        Driver version: 4.14.54       …\n        Capabilities\
  \  : 0x84000001     Video Capture    Streaming\nFormat Video Capture:\n        Width/Height\
  \  : 1920/1080      Pixel Format    : 'H264'\n        Field         : None     \
  \      Bytes per Line  : 3840\n        Size Image    : 4147200        Colorspace\
  \      : SRGB\nCrop Capability Video Capture:\n        Bounds        : Left 0, Top\
  \ 0, Width 1920, Height 1080\n        Default       : Left 0, Top 0, Width 1920,\
  \ Height 1080\n        Pixel Aspect  : 1/1\nVideo input : 0 (Camera 1: ok)\nStreaming\
  \ Parameters Video Capture:\n        Capabilities  : timeperframe   Frames per second:\
  \ 30.000 (30/1)\n        Read buffers  : 0              Priority: 2 \n```\n\n此输出提供了有用的状态信息，例如分辨率、视频帧图像大小、帧率等。\n\
  \n#### *编写 Video4Linux2 程序*\n\n\n\n\n\n与 Linux 中的其他设备（例如第 8 章中的 SPI）类似，可以通过调用文件\
  \ `open()` 打开视频设备的 `/dev/videoX` 文件系统条目来向其发送数据或从中接收数据。遗憾的是，这种方法无法提供视频设备所需的控制级别或性能。相反，需要使用低级输入/输出控制（`ioctl()`）调用来配置设备设置，并使用内存映射（`mmap()`）调用来执行图像帧内存复制，而不是采用逐字节的串行传输。\n\
  \nGit 仓库中的 `/chp14/v4l2/` 目录包含使用 V4L2 及其低级 `ioctl()` 调用来执行视频帧捕获和视频捕获任务的程序。\n\n*\
  \ `grabber.c`：使用 libv4l2 从网络摄像头将原始图像帧数据抓取到内存中。图像可以写入文件系统。\n* `capture.c`：将原始视频数据抓取到流或文件中。其速度足以用于实时视频捕获。\n\
  \n这些代码示例几乎完全基于 V4L2 项目团队提供的示例。代码过长，此处无法展示，但您可以在 Git 仓库中查看。要构建并执行这些代码示例，请使用以下步骤：\n\
  \n```\n~/exploringbb/chp14/v4l2$ sudo apt install libv4l-dev\n…/chp14/v4l2$ ls *.c\n\
  capture.c  grabber.c\n…/chp14/v4l2$ gcc -O2 -Wall `pkg-config --cflags --libs libv4l2`\
  \ →\n grabber.c -o grabber\n…/chp14/v4l2$ gcc -O2 -Wall `pkg-config --cflags --libs\
  \ libv4l2` →\n capture.c -o capture\n…/chp14/v4l2$ ./grabber\n…/chp14/v4l2$ ls *.ppm\n\
  grabber000.ppm  grabber005.ppm  grabber010.ppm  grabber015.ppm …\n…/chp14/v4l2$\
  \ gpicview grabber000.ppm \n```\n\n`.ppm` 文件格式描述了一种未压缩的彩色图像格式，gpicview 可以显示它。您可以使用\
  \ gpicview 上的“前进”按钮逐步浏览 20 个图像帧。要使用 `capture.c` 程序捕获数据，请使用以下选项中的一部分：\n\n```\n…/chp14/v4l2$\
  \ ./capture -h\nUsage: ./capture [options]\nVersion 1.3    Options:\n-d | --device\
  \ name   Video device name [/dev/video0] …\n-f | --format        Force format to\
  \ 640x480 YUYV\n-F | --formatH264    Force format to 1920x1080 H264\n-c | --count\
  \         Number of frames to grab [100] - use 0 for infinite\nExample usage: capture\
  \ -F -o -c 300 > output.raw\nCaptures 300 frames of H264 at 1920x1080\\. Use raw2mpg4\
  \ script to convert to mpg4 \n```\n\n如果您有 C920 摄像头，可以使用以下第一条命令捕获 100 帧 H.264 数据。然后使用第二条命令将\
  \ `.raw` 文件转换为 `.mp4` 文件格式，该格式可在桌面计算机上播放。\n\n```\n…/chp14/v4l2$ ./capture -d /dev/video0\
  \ -F -o -c 100 > output.raw\nForce Format 2\n…………………………………………………………….\n…/chp14/v4l2$\
  \ avconv -f h264 -i output.raw -vcodec copy output.mp4\n…/chp14/v4l2$ ls -l output*\n\
  -rw-r--r-- 1 debian debian 1355695 Sep  3 22:23 output.mp4\n-rw-r--r-- 1 debian\
  \ debian 1353801 Sep  3 22:23 output.raw \n```\n\n文件大小几乎相同，因为视频数据实际上是以原始 H.264 格式捕获的。转换使用\
  \ `avconv`（Libav）工具完成，该工具是 FFmpeg 项目的一个分支，在 Debian Linux 发行版中得到良好支持。`-vcodec copy`\
  \ 选项允许在不转码视频数据格式的情况下复制视频。\n\n`capture.c` 程序也可用于 C270 和 C310 等摄像头，这些摄像头没有硬件 H.264\
  \ 功能；但功能较为有限。\n\n```\n…$ v4l2-ctl --set-fmt-video=width=1280,height=720,pixelformat=1\
  \ -d 1\n…$ v4l2-ctl --all -d 1\nFormat Video Capture: Width/Height:1280/720   Pixel\
  \ Format:'MJPG'\n…/chp14/v4l2$ ./capture -d /dev/video1 -o -c 100 > output.raw\n\
  Force Format 0 ………………………………………………\n…/chp14/v4l2$ ls -l output.raw\n-rw-r--r-- 1\
  \ debian debian 4476448 Sep  3 01:58 output.raw\n…/chp14/v4l2$ avconv -f mjpeg -i\
  \ output.raw output.mp4\n…/chp14/v4l2$ ls -l output.mp4\n-rw-r--r-- 1 debian debian\
  \ 1456040 Sep  3 02:06 output.mp4 \n```\n\n在 Beagle 板上使用 avconv 进行真正的视频转换可能需要相当长的时间！在此示例中，您可以看到\
  \ H.264 视频文件比 MJPEG 文件占用空间小得多，因为它是一种更高效的帧间视频编码格式。\n\n## 流式视频\n\n可以使用 Beagle 板捕获并流式传输实时视频。Logitech\
  \ C920 特别适合此用途，因为它内置了 H.264 硬件编码器。原始的 1080p H.264 数据可以直接从摄像头流传递到网络流，无需转码，这意味着 Beagle\
  \ 板上的计算负载相当低。流式传输脚本位于 `/chp14/v4l2/` 仓库目录中。例如，清单 14-2 提供了一个脚本，用于通过 C920 网络摄像头将 H.264\
  \ 视频数据通过 UDP 发送到 IP 地址为 192.168.7.1 的桌面 PC。\n\n```\n#!/bin/bash\necho \"Video Streaming\
  \ for the Beaglebone - Exploring BeagleBone v2\"\nv4l2-ctl --set-fmt-video=width=1920,height=1080,pixelformat=1\n\
  v4l2-ctl --set-parm=15\n./capture -F -o -c300000|avconv -i - -vcodec copy -f rtp\
  \ rtp://192.168.7.1:8090/ \n```\n\n**清单 14-2:** /exploringbb/chp14/v4l2/streamVideo\n\
  \n该脚本将捕获程序的原始视频输出通过管道传递给 avconv 应用程序，avconv 使用 RTP 将原始数据“复制”到网络流。还有一个额外的脚本（`streamVideoMulti`）用于使用广播网络地址\
  \ `226.0.0.1` 将视频流多播到多个网络节点。我的 YouTube 频道上有一个完整视频详细描述了相关步骤：[`tiny.cc/beagle1404`](http://tiny.cc/beagle1404)。\n\
  \n您可以直接执行此脚本，但还必须从其输出中复制此处高亮显示的文本，并将其粘贴到一个新的文本文件中（您可以将此新文件命名为 `stream.sdp`），然后将其放置在您的主机上。\n\
  \n```\ndebian@ebb:~/exploringbb/chp14/v4l2$ ./streamVideo\nFrame rate set to 15.000\
  \ fps\nForce Format 2 …\nOutput #0, rtp, to 'rtp://192.168.7.1:8090/':\n  Metadata:\n\
  \    encoder         : Lavf57.56.101\n    Stream #0:0: Video: h264 (Constrained\
  \ Baseline), yuvj420p(pc, prog), \n    1920x1080 [SAR 1:1 DAR 16:9], q=2-31, 30\
  \ fps, 30 tbr, 90k tbn, 30 tbc\nSDP:\nv=0\no=- 0 0 IN IP4 127.0.0.1\ns=No Name\n\
  c=IN IP4 192.168.7.1\nt=0 0\na=tool:libavformat 57.56.101\nm=video 8090 RTP/AVP\
  \ 96\na=rtpmap:96 H264/90000\na=fmtp:96 packetization-mode=1; sprop-parameter-\n\
  sets=Z0JAKLtAPAES8uAokAAAAwAQAAADA8YEAALcbAAtx73vheEQjUA=,aM44gA==; \nprofile-level-id=424028\n\
  \nStream mapping:\n  Stream #0:0 -> #0:0 (copy)…\n  frame= 1120 fps= 34 q=-1.0 Lsize=13901kB\
  \ … bitrate=3052.5kbits/s \nvideo:13756kB audio:0kB subtitle:0kB other streams:0kB\
  \ … \n```\n\n然后，您可以使用 VLC 等媒体播放器打开此 `stream.sdp` 文件，随后将看到来自执行 `streamVideo` 脚本的\
  \ Beagle 板的实时视频流。\n\n可以构建一个自定义的 Qt 应用程序，在桌面计算机上接收视频流。这可以与第 11 章中的 Qt 客户端/服务器应用程序结合使用，以提供网络控制和对视频流的支持。更多详细信息请访问\
  \ [`tiny.cc/beagle1405`](http://tiny.cc/beagle1405)。\n\n可以使用第二个 Beagle 板来接收网络视频流；然而，它没有足够的能力实时将高清视频流渲染到显示器上。有趣的是，可以使用\
  \ Raspberry Pi 2/3 来捕获 UDP 流，并利用 Raspberry Pi 的 H.264 硬件解码器通过视频播放器显示它。例如，OMXplayer\
  \ 支持硬件解码，可以使用以下命令打开网络广播流：\n\n```\nmolloyd@raspberryPI$ omxplayer -o hdmi udp://226.0.0.1:123\
  \ \n```\n\nRaspberry Pi 可以解码 C920 视频流并实时显示在显示器上，尽管延迟程度会有所不同。\n\n## 图像处理与计算机视觉\n\n\
  \n\n\n\n一旦将 USB 摄像头或摄像头扩展板连接到 Beagle 板，就可以使用名为开源计算机视觉（OpenCV）的综合高级库来捕获图像并进行处理。OpenCV（[`www.opencv.org`](http://www.opencv.org)）提供了一个跨平台的函数库，用于计算机视觉，例如手势识别、运动理解、运动跟踪、增强现实和运动恢复结构。它还提供了用于人工神经网络、支持向量机、分类和决策树学习等应用的辅助库。OpenCV\
  \ 使用 C/C++ 编写，并针对实时应用进行了优化，包括对多核编程的支持。可以使用以下命令安装 OpenCV 库：\n\n```\ndebian@ebb ~\
  \ $ sudo apt install libopencv-dev \n```\n\n### 使用 OpenCV 进行图像处理\n\nOpenCV 支持 V4L2，并提供了一个用于捕获图像数据的高级接口，可以替代\
  \ `grabber.c` 程序。清单 14-3 是一个 OpenCV 应用程序，它从网络摄像头捕获数据，并使用一些简单的图像处理技术对其进行过滤。它执行的步骤如下：\n\
  \n1.  从网络摄像头捕获图像。\n2.  将图像转换为灰度形式。\n3.  对图像进行模糊处理以去除高频噪声。\n4.  检测图像中亮度急剧变化的区域。这是通过一种称为*边缘检测器*的图像处理算子实现的——本例中使用的是\
  \ Canny 边缘检测器。\n5.  将图像文件存储到 Beagle 板的文件系统中。\n\nOpenCV 使用一种文件命名约定，其中 `.hpp` 文件扩展名用于包含\
  \ C++ 代码的头文件。这种约定允许 C 版本的头文件（例如 `opencv.h`）与 C++ 头文件（例如 `opencv.hpp`）共存。由于 OpenCV\
  \ 混合了 C 和 C++ 代码，这是区分两者的一种合适方式。\n\n```\n#include<iostream>\n#include<opencv2/opencv.hpp>\
  \   // C++ OpenCV 包含文件\nusing namespace std;\nusing namespace cv;            //\
  \ 同时使用 cv 命名空间\n\nint main()\n{\n    VideoCapture capture(0);   // 从 /dev/video0\
  \ 捕获\n    cout << \"开始处理 - 捕获图像\" << endl;\n    // 设置 VideoCapture 对象中的任何属性\n  \
  \  capture.set(CV_CAP_PROP_FRAME_WIDTH,1280);   // 宽度（像素）\n    capture.set(CV_CAP_PROP_FRAME_HEIGHT,720);\
  \   // 高度（像素）\n    capture.set(CV_CAP_PROP_GAIN, 0);            // 启用自动增益\n    if(!capture.isOpened()){\
  \   // 连接到摄像头\n       cout << \"无法连接到摄像头。\" << endl;\n    }\n    Mat frame, gray,\
  \ edges;    // 原始图像、灰度图像和边缘图像\n    capture >> frame;          // 将图像捕获到 frame 中\n\
  \    if(frame.empty()){         // 捕获是否成功？\n       cout << \"捕获图像失败\" << endl;\n\
  \       return -1;\n    }\n    cout << \"处理中 - 执行图像处理\" << endl;\n    cvtColor(frame,\
  \ gray, CV_BGR2GRAY);     // 转换为灰度\n    blur(gray, edges, Size(3,3));          \
  \ // 使用 3x3 内核模糊图像\n    // 使用 Canny 边缘检测器，输出到同一图像\n    // 低阈值 = 10，高阈值 = 30，内核大小\
  \ = 3\n    Canny(edges, edges, 10, 30, 3);         // 运行 Canny 边缘检测器\n    cout <<\
  \ \"处理完成 - 保存图像\" << endl;\n\n    imwrite(\"capture.png\", frame);     // 存储原始图像\
  \ \n    imwrite(\"grayscale.png\", gray);    // 存储灰度图像\n    imwrite(\"edges.png\"\
  , edges);       // 存储处理后的边缘图像\n    return 0;\n} \n```\n\n**清单 14-3:** `/exploringbb/chp14/openCV/boneCV.cpp`\n\
  \n此示例可以按如下方式构建和执行，输出结果如图 14-3 所示：\n\n```\n…/chp14/openCV$ g++ -O2 `pkg-config --cflags\
  \ --libs opencv` →\n boneCV.cpp -o boneCV\n…/chp14/openCV$ ./boneCV\n开始处理 - 捕获图像\n\
  处理中 - 执行图像处理\n处理完成 - 保存图像\n…/chp14/openCV$ ls *.png\ncapture.png  edges.png  grayscale.png\
  \ \n…/chp14/openCV$ gpicview capture.png\n…/chp14/openCV$ gpicview edges.png \n\
  ```\n\n![图片由标题描述。](img/c14f003.jpg)\n\n**图 14-3****:** OpenCV 图像处理示例：(a) 网络摄像头图像；(b)\
  \ 边缘处理后的图像\n\n同一目录下的第二个示例应用程序可用于测试使用 OpenCV 进行图像处理的性能。在每次迭代中，它以 640 × 480 的分辨率捕获图像，将图像转换为灰度形式，并执行边缘检测操作。该程序执行\
  \ 100 次迭代，之后测量执行时间。\n\n```\ndebian@ebb:~/exploringbb/chp14/openCV$ ./boneCVtiming\n\
  处理 100 帧耗时 12.3263 秒\n每秒捕获和处理 8.11274 帧 \n```\n\n在此测试期间，应用程序使用了 95% 的 CPU 和 6% 的内存容量。\n\
  \n### 使用 OpenCV 进行计算机视觉\n\n图像处理涉及通过滤波器（例如平滑、对比度增强）或变换（例如缩放、旋转、拉伸）来操作图像，目的是增强甚至减少数字图像的信息内容。图像处理是*计算机视觉*中使用的工具之一，计算机视觉的目标通常是“理解”数字图像中的信息内容。\n\
  \n计算机视觉应用通常试图通过基于视觉数据进行推理、做出决策和采取行动来复制人类视觉的能力。例如，本节描述的 OpenCV 应用程序使用 BeagleBone\
  \ 处理图像数据，并应用计算机视觉技术来确定网络摄像头图像帧或图像文件中是否存在人脸。重要的是，该方法旨在进行人脸检测，而非人脸识别。人脸检测可用于安全和摄影等应用；然而，所需的处理具有显著的计算开销，不适合在\
  \ Beagle 板上实现高帧率。\n\n清单 14-4 提供了一个使用 OpenCV 进行人脸检测的计算机视觉应用示例。它使用基于 Haar 特征的级联分类器，该分类器利用相邻矩形图像区域的特征来识别感兴趣区域——例如，在人脸中，眼睛附近的区域比脸颊区域的强度更暗。可以利用这些观察结果来检测人脸。有用的是，OpenCV\
  \ 提供了一些用于检测人脸的编码规则，本示例中使用了这些规则。\n\n计算机视觉是一个完整的研究领域，在能够执行一些更复杂的操作之前，需要投入大量时间。“延伸阅读”部分提供了入门资源的链接。\n\
  \n\n\n\n\n```\n#include <iostream>\n#include <opencv2/highgui/highgui.hpp>\n#include\
  \ <opencv2/objdetect/objdetect.hpp>\n#include <opencv2/imgproc/imgproc.hpp>\nusing\
  \ namespace std;\nusing namespace cv;\n\nint main(int argc, char *args[])\n{\n \
  \  Mat frame;\n   VideoCapture *capture; //capture needs full scope of main(), using\
  \ ptr\n   cout << \"Starting face detection application\" << endl;\n   if(argc==2){\
  \  // loading image from a file\n      cout << \"Loading the image \" << args[1]\
  \ << endl;\n      frame = imread(args[1], CV_LOAD_IMAGE_COLOR);\n   }\n   else {\n\
  \      cout << \"Capturing from the webcam\" << endl;\n      capture = new VideoCapture(0);\n\
  \      // set any  properties in the VideoCapture object\n      capture->set(CV_CAP_PROP_FRAME_WIDTH,1280);\
  \   // width pixels\n      capture->set(CV_CAP_PROP_FRAME_HEIGHT,720);   // height\
  \ pixels\n      if(!capture->isOpened()){   // connect to the camera\n         cout\
  \ << \"Failed to connect to the camera.\" << endl;\n         return 1;\n      }\n\
  \      *capture >> frame;    // populate the frame with captured image\n      cout\
  \ << \"Successfully captured a frame.\" << endl;\n   }\n   if (!frame.data){\n \
  \     cout << \"Invalid image data… exiting!\" << endl;\n      return 1;\n   }\n\
  \   // loading the face classifier from a file (standard OpenCV example)\n   CascadeClassifier\
  \ faceCascade;\n   faceCascade.load(\"haarcascade_frontalface.xml\");\n\n   // faces\
  \ is a STL vector of faces - will store the detected faces\n   std::vector<Rect>\
  \ faces;\n   // detect objects in the scene using the classifier above (frame, \n\
  \   // faces, scale factor, min neighbors, flags, min size, max size)\n   faceCascade.detectMultiScale(frame,\
  \ faces, 1.1, 3,\n                      0 | CV_HAAR_SCALE_IMAGE, Size(50,50));\n\
  \   if(faces.size()==0){\n      cout << \"No faces detected!\" << endl;     // display\
  \ the image\n   }\n   // draw oval around the detected faces in the faces vector\n\
  \   for(int i=0; i<faces.size(); i++)\n   {\n      // Using the center point and\
  \ a rectangle to create an ellipse\n      Point cent(faces[i].x+faces[i].width*0.5,\
  \ \n                 faces[i].y+faces[i].height*0.5);\n      RotatedRect rect(cent,\
  \ Size(faces[i].width,faces[i].width),0);\n      // image, rectangle, color=green,\
  \ thickness=3, linetype=8\n      ellipse(frame, rect, Scalar(0,255,0), 3, 8);\n\
  \      cout << \"Face at: (\" << faces[i].x << \",\" <<faces[i].y << \")\" << endl;\n\
  \   }\n   imshow(\"EBB OpenCV face detection\", frame);  // display image results\n\
  \   imwrite(\"faceOutput.png\", frame);    // save image too\n   waitKey(0);   \
  \                       // dislay image until key press\n   return 0;\n} \n```\n\
  \n**清单 14-4:** `/exploringbb/chp14/openCV/face.cpp`\n\n人脸检测示例可通过以下命令构建并执行：\n\n```\n\
  …/chp14/openCV$ g++ -O2 `pkg-config --cflags --libs opencv` face.cpp -o face\n…/chp14/openCV$\
  \ ./face\nStarting face detection application\nCapturing from the webcam\nSuccessfully\
  \ captured a frame.\nFace at: (697,470)  Face at: (470,152)  Face at: (82,192) Face\
  \ at: (966,296)\n…/chp14/openCV$ ./face Lena.png\nStarting face detection application\n\
  Loading the image Lena.png\nFace at: (217,201) \n```\n\n执行后，会显示图 14-4(a) 中的图像（如果配置了\
  \ X Window 会话），并用椭圆标出图像中检测到的所有人脸。\n\n![图片描述见标题。](img/c14f004.jpg)\n\n**图 14-4****:**\
  \ (a) 使用 Lena 图像文件进行 OpenCV 人脸检测，(b) 运行中的 OpenCV3 示例\n\n在源代码仓库和 [`tiny.cc/beagle1408`](http://tiny.cc/beagle1408)\
  \ 上提供了大量 OpenCV3 示例。这些示例可以在 Beagle 板上按如下方式构建并执行：\n\n```\n…/chp14/openCV3$ g++ -O2\
  \ `pkg-config --cflags --libs opencv` edge.cpp -o edge\n…/chp14/openCV3$ ls\nbuild\
  \  edge  edge.cpp  fruits.jpg\n…/chp14/openCV3$ ./edge fruits.jpg \n```\n\n这将直接打开图\
  \ 14-4(b) 中的交互式阈值边缘检测窗口。\n\n### Boost\n\n与 OpenCV 类似，Boost（[`www.boost.org`](http://www.boost.org)）提供了一个全面的免费\
  \ C++ 源代码库，可用于 Beagle 板上的许多应用。其中包括多线程、数据结构、算法、正则表达式、内存管理、数学等库。可用的库范围过于广泛，无法在此详述，但完整列表可在\
  \ [`www.boost.org/doc/libs/`](http://www.boost.org/doc/libs/) 找到。可以使用以下命令在板上安装 Boost：\n\
  \n```\ndebian@ebb:~$ sudo apt install libboost-dev\n… Unpacking libboost-dev:armhf\
  \ (1.62.0.1) … \n```\n\n清单 14-5 提供了一个使用 Boost 库计算二维点之间几何距离的示例。\n\n```\n#include\
  \ <boost/geometry.hpp>\n#include <boost/geometry/geometries/point_xy.hpp>\nusing\
  \ namespace boost::geometry::model::d2;\n#include <iostream>\n\nint main(){\n  \
  \ point_xy<float> p1(1.0,2.0), p2(3.0,4.0);\n   float d = boost::geometry::distance(p1,p2);\n\
  \   std::cout << \"The distance between points is: \" << d << std::endl;\n   return\
  \ 0;\n} \n```\n\n**清单 14-5:** `/exploringbb/chp14/boost/testBoost.cpp`\n\n与 OpenCV\
  \ 类似，它使用 `.hpp` 扩展名形式，并大量使用 C++ 命名空间。上述代码可通过以下命令构建并执行：\n\n```\ndebian@ebb:~/exploringbb/chp14/boost$\
  \ g++ testBoost.cpp -o testBoost\ndebian@ebb:~/exploringbb/chp14/boost$ ./testBoost\n\
  Distance between points is: 2.82843 \n```\n\n## BeagleBone 音频\n\n在 Beagle 板上使用音频输入和输出有多种方法，包括：\n\
  \n*   **HDMI 音频：** 此输出在 BeagleBone 板上默认启用，允许通过 HDMI（而非 DVI）将音频信号发送到电视。\n\n*   **USB\
  \ 音频：** 可以将低成本 USB 适配器连接到 Beagle 板，这些适配器具有 Linux 驱动程序支持，用于音频输入/输出。此外，USB 摄像头可用作音频输入设备。\n\
  \n*   **蓝牙音频：** 可以使用兼容 Linux 的蓝牙适配器从外部蓝牙录音机/扬声器设备输入或输出音频。\n\n*   **多通道音频串行端口 (McASP)：**\
  \ 一些 Beagle 板具有用于 McASP 的排针，可用于连接支持 McASP 的音频编解码器（例如 TI TLV320AIC 系列）。这是一项复杂的任务，需要专有（通常为\
  \ SMT）组件。\n\n还可以使用内置 ADC 输入以低采样率捕获音频事件。例如，SparkFun 驻极体麦克风分线板 (BOB-09964) 可以通过运算放大器电路连接到\
  \ Beagle 板 ADC（在 GND 线上使用 10 kΩ 电位器），并用于冲击检测（例如敲门声）等任务。通过使用具有 SPI 接口的外部 ADC（例如低成本（3\
  \ 美元）的 MCP3008，它具有八个 10 位 ADC），可以改善此类麦克风电路的采样率。此外，TI ADS8326 16 位 250 kS/s SPI 输出可以连接到\
  \ PRU-ICSS，这在第 15 章中进行了描述。\n\n在本节中，将介绍最常用的方法以及使您能够执行基本音频输入/输出任务的软件。\n\n### 核心音频软件工具\n\
  \n本书本节使用了以下工具：\n\n*   **MPlayer：** 一个 Linux 电影播放器，内置了对音频设备的优化支持。它在 Beagle 板上作为 MP3\
  \ 音频流播放器表现良好。\n\n*   **ALSA 工具：** 包含用于配置和使用 ALSA（高级 Linux 声音架构）设备的工具。其中包括用于播放和录制音频流的\
  \ `aplay`/`arecord` 工具、用于控制音量的 `amixer` 工具以及 `speaker-test` 工具。\n\n\n\n\n\n*   **Libav：**\
  \ 包含用于处理多媒体数据的库和程序。特别地，`avconv` 是一个快速的音视频转换工具，也可用于从设备捕获音频数据或向网络传输数据（参见 [`libav.org/avconv.html`](http://libav.org/avconv.html)）。\n\
  \n要安装这些工具，请确保你的软件包列表是最新的，然后按如下方式安装：\n\n```\ndebian@ebb:~$ sudo apt-get update\n\
  debian@ebb:~$ sudo apt-get install mplayer alsa-utils libav-tools \n```\n\n### Beagle\
  \ 板的音频设备\n\n安装好核心软件后，下一步是使用连接到 Beagle 板的音频设备。本节以一个示例来说明，该示例中多个音频设备同时连接到 Beagle 板——HDMI\
  \ 音频接口、一个网络摄像头以及两个 USB 音频适配器。请记住，必须启用 HDMI 虚拟 cape 才能使用 HDMI 音频输出。\n\n#### HDMI\
  \ 和 USB 音频播放设备\n\n图 14-5(a) 展示了连接了三个 USB 设备的 USB 集线器——两个 USB 音频适配器和一个蓝牙适配器。当三个网络摄像头也连接到\
  \ Velleman USB 集线器时，调用 `lsusb` 会得到以下结果：\n\n```\nLinux ebb 4.14.54-ti-rt-r63 #1 SMP\
  \ PREEMPT RT …\ndebian@ebb:~$ lsusb\nBus 001 Device 005: ID 0d8c:013c C-Media Elec\
  \ CM108 Audio Controller\nBus 001 Device 004: ID 041e:30d3 Creative Tech, Sound\
  \ Blaster Play!\nBus 001 Device 006: ID 0a5c:2198 Broadcom Corp. Bluetooth 3.0 Device\n\
  Bus 001 Device 003: ID 046d:082d Logitech, Inc. HD Pro Webcam C920\nBus 001 Device\
  \ 002: ID 1a40:0201 Terminus TechFE 2.1 7-port Hub\nBus 001 Device 001: ID 1d6b:0002\
  \ Linux Foundation 2.0 root hub \n```\n\n![图片描述见标题。](img/c14f005.jpg)\n\n**图 14-5****：**\
  \ (a) 带有多个适配器的七端口 USB 集线器，(b) Sound Blaster 音频适配器；(c) Dynamode USB 音频适配器\n\n图 14-5(a)\
  \ 中的 USB 集线器不是有源集线器；然而，板子通过 5V 连接器使用 2A 电源供电，这提供了足够的电力来同时使用所有这些设备。Sound Blaster（20\
  \ 美元）和 Dynamode（5 美元）USB 适配器分别如图 14-5(b) 和 (c) 所示。这些适配器可以热插拔到板子上，在 Linux 运行期间，它们的\
  \ LKM 可以动态加载和卸载。\n\n当各种适配器连接到 Beagle 板时，你可以通过以下方式获取它们的信息：\n\n```\ndebian@ebb:~$\
  \ cat /proc/asound/pcm\n00-00: davinci-mcasp.0-i2s-hifi i2s-hifi-0 :  : playback\
  \ 1\n01-00: USB Audio : USB Audio : capture 1\n02-00: USB Audio : USB Audio : playback\
  \ 1 : capture 1\n03-00: USB Audio : USB Audio : playback 1 : capture 1 \n```\n\n\
  在这种情况下，HDMI 适配器仅支持播放，两个 USB 适配器支持播放和捕获，而 USB 网络摄像头仅支持捕获。另一种方法是使用 `aplay` 工具列出可用的播放设备。\n\
  \n```\ndebian@ebb:~$ aplay -l\n**** List of PLAYBACK Hardware Devices ****\ncard\
  \ 0: Black [TI BeagleBone Black], device 0: davinci-mcasp.0-i2s-hifi …\n  Subdevices:\
  \ 0/1\n  Subdevice #0: subdevice #0\ncard 2: U0x41e0x30d3 [USB Device 0x41e:0x30d3],\
  \ device 0: USB Audio …\n  Subdevices: 0/1\n  Subdevice #0: subdevice #0\ncard 3:\
  \ Device [USB PnP Sound Device], device 0: USB Audio …\n  Subdevices: 0/1\n  Subdevice\
  \ #0: subdevice #0 \n```\n\n一旦你识别出设备，就可以分别使用 `mplayer` 和 `aplay` 工具在 Dynamode 和\
  \ Creative Sound Blaster USB 适配器上播放音频文件，如下所示：\n\n```\n…/chp14/audio$ mplayer -ao\
  \ alsa:device=hw=2 320sample.mp3\n…/chp14/audio$ mplayer -ao alsa:device=hw=3 320sample.mp3\n\
  …/chp14/audio$ aplay -D plughw:2,0 cheering.wav \n```\n\nSound Blaster 适配器（声卡 2）的音质明显比\
  \ Dynamode 适配器（声卡 3）更丰富。不过，Dynamode 适配器就其价格而言音质不错，而且其手动音量控制功能也很实用。\n\nHDMI 设备适配器也可以使用，方法是将\
  \ Beagle 板直接连接到 HDMI 接收器或 HDMI 电视（或带有内置扬声器的显示器），或者使用 VGA 适配器将 HDMI 音频通道提取到 3.5 毫米立体声音频插孔。从后者设备中提取的音频质量可能差异很大，并且在没有播放音频流时可能会受到自动增益线路噪声的影响。\n\
  \n要测试输出设备，你可以使用 `speaker-test` 工具（其中 `-c2` 表示要测试两个声道）。\n\n```\n../chp14/audio$ speaker-test\
  \ -D plughw:2,0 -c2 \n```\n\nALSA 工具还为你提供了有关 USB 设备能力的详细信息。例如，`amixer` 可用于获取和设置适配器的可用属性。在\
  \ Sound Blaster 设备上使用 `amixer` 会提供其当前状态信息：\n\n```\ndebian@ebb:~/exploringbb/chp14/audio$\
  \ amixer -c 2\nSimple mixer control 'Speaker',0\n  Capabilities: pvolume pswitch\
  \ pswitch-joined\n  Playback channels: Front Left - Front Right\n  Limits: Playback\
  \ 0 - 151\n  Mono: Front Left: Playback 44 [29%] [-20.13dB] [on]\n  Front Right:\
  \ Playback 44 [29%] [-20.13dB] [on]\nSimple mixer control 'Mic',0\n  Capabilities:\
  \ pvolume pvolume-joined cvolume cvolume-joined pswitch \n    pswitch-joined cswitch\
  \ cswitch-joined\n  Playback channels: Mono       Capture channels: Mono\n  Limits:\
  \ Playback 0 - 32 Capture 0 - 16\n  Mono: Playback 23 [72%] [34.36dB] [off] Capture\
  \ 0 [0%] [0.00dB] [on]\nSimple mixer control 'Auto Gain Control',0\n  Capabilities:\
  \ pswitch pswitch-joined\n  Playback channels: Mono       Mono: Playback [on] \n\
  ```\n\n要获取其可用的控制设置，请使用以下命令：\n\n```\ndebian@ebb:~/exploringbb/chp14/audio$ amixer\
  \ -c 2 controls\nnumid=3,iface=MIXER,name='Mic Playback Switch'\nnumid=4,iface=MIXER,name='Mic\
  \ Playback Volume'\nnumid=7,iface=MIXER,name='Mic Capture Switch'\nnumid=8,iface=MIXER,name='Mic\
  \ Capture Volume' … \n```\n\n因此，要控制扬声器播放音量设置，你可以使用以下命令：\n\n```\n…$ amixer -c 2 cset\
  \ iface=MIXER,name='Speaker Playback Volume' 10,10\nnumid=6,iface=MIXER,name='Speaker\
  \ Playback Volume'\n  ; type=INTEGER,access=rw---R--,values=2,min=0,max=151,step=0\n\
  \  : values=10,10 | dBminmax-min=-28.37dB,max=-0.06dB \n```\n\n这会调整 Sound Blaster\
  \ USB 声卡扬声器输出的音量——`10,10` 是左右声道的音量百分比设置，因此 `0,30` 会关闭左声道并将右声道音量设置为 30%。\n\n####\
  \ 网络电台播放\n\n你可以使用相同的 `mplayer` 应用程序播放网络电台频道。例如，通过 [`www.internet-radio.com`](http://www.internet-radio.com)，你可以搜索自己喜欢的广播电台以确定其\
  \ IP 地址。然后，你可以使用以下命令将音频流传输到 USB 适配器：\n\n```\n…/chp14/audio$ mplayer -ao alsa:device=hw=2\
  \ http://178.18.137.246:80\nMPlayer 1.3.0 (Debian), built with gcc-6.2.1 (C) 2000-2016\
  \ MPlayer Team\ndo_connect: could not connect to socket\nconnect: No such file or\
  \ directory\nFailed to open LIRC support. You will not be able to use your remote\
  \ control.\nPlaying http://178.18.137.246:80.\nResolving 178.18.137.246 for AF_INET6…\n\
  Couldn't resolve name for AF_INET6: 178.18.137.246\nConnecting to server 178.18.137.246[178.18.137.246]:\
  \ 80…\nName   : Pinguin Radio           Genre  : Alternative\nWebsite: http://www.pinguinradio.com\n\
  Public : yes                     Bitrate: 320kbit/s\nCache size set to 320 Kbytes\
  \     Cache fill:  0.00% (0 bytes)\nICY Info: StreamTitle='Placebo & David Bowie\
  \  - Without You I'm Nothing \n';StreamUrl='http://www.pinguinradio.com';  … \n\
  ```\n\n\n\n\n\n该流在 BBB 上运行时，CPU 占用率为 10%，内存占用率为 5%，音质良好（无论你对音乐本身有何看法！）。实际上，使用多个音频输出设备，配置\
  \ Beagle 板同时连接多个网络广播流并将音频流传输到独立的音频适配器并不困难。\n\n#### 录制音频\n\nUSB 适配器和 USB 摄像头可用于将音频直接捕获到\
  \ Beagle 板的文件系统中。你可以使用 `arecord` 工具列出可用设备——例如，连接一个摄像头和两个 USB 音频适配器时：\n\n```\ndebian@ebb:~$\
  \ arecord -l\n**** List of CAPTURE Hardware Devices ****\ncard 1: C920 [HD Pro Webcam\
  \ C920], device 0: USB Audio [USB Audio]\n  Subdevices: 1/1    Subdevice #0: subdevice\
  \ #0\ncard 2: U0x41e0x30d3 [USB Device 0x41e:0x30d3], device 0: USB Audio …\n  Subdevices:\
  \ 1/1    Subdevice #0: subdevice #0\ncard 3: Device [USB PnP Sound Device], device\
  \ 0: USB Audio [USB Audio]\n  Subdevices: 1/1    Subdevice #0: subdevice #0 \n```\n\
  \n这些设备也会在以下 `/proc` 位置建立索引：\n\n```\ndebian@ebb:~$ cat /proc/asound/cards\n 0 [Black\
  \          ]: TI_BeagleBone_B - TI BeagleBone Black\n 1 [C920           ]: USB-Audio\
  \ - HD Pro Webcam C920\n 2 [U0x41e0x30d3   ]: USB-Audio - USB Device 0x41e:0x30d3\n\
  \ 3 [Device         ]: USB-Audio - USB PnP Sound Device \n```\n\n你可以使用 `arecord`\
  \ 工具和设备的地址，从每个音频捕获设备录制音频。有趣的是，当这些摄像头仅录制音频时，其 LED 指示灯不会亮起！\n\n```\ndebian@ebb:~/tmp$\
  \ arecord -f cd -D plughw:2,0 -d 20 test.wav\nRecording WAVE 'test.wav' : Signed\
  \ 16 bit Little Endian, Rate 44100 Hz \n```\n\n波形音频文件格式（WAV）存储未压缩的音频数据，这会迅速消耗你的文件存储空间。为避免这种情况，你可以使用\
  \ LAME MP3 编码器将 WAV 文件压缩为流行的 MP3 压缩格式，如下所示：\n\n```\ndebian@ebb:~$ sudo apt install\
  \ lame\ndebian@ebb:/tmp$ lame test.wav output.mp3\nLAME 3.99.5 32bits (http://lame.sf.net)\n\
  Using polyphase lowpass filter, transition band: 16538 Hz - 17071 Hz\nEncoding test.wav\
  \ to output.mp3\nEncoding as 44.1 kHz j-stereo MPEG-1 Layer III (11x) 128 kbps qval=3\n\
  \    Frame       | CPU time/estim | REAL time/estim | play/CPU | ETA\n   767/767(100%)|\
  \   0:09/    0:09|    0:09/    0:09|   2.1909x| 0:00 \n```\n\n在 BBB 上使用两个 USB 适配器分别进行了录音测试。使用\
  \ Zoom H1 手持录音机（[`www.zoom.co.jp`](http://www.zoom.co.jp)）录制我的声音。将 Zoom H1 的模拟立体声线路输出连接到每个适配器的模拟立体声线路输入，并按照以下步骤为每个适配器录制音频：\n\
  \n```\n…/audio/testMicrophone$ arecord -f cd -D plughw:2,0 -d 45 testX.wav\n…/chp14/audio/testMicrophone$\
  \ lame -b 128 testX.wav testX.mp3 \n```\n\nGit 仓库中还提供了音频的数字副本（即从 Zoom H1 数字拷贝的版本）以供比较。所有三个文件均以\
  \ 44.1 kS/sec 的采样率和 128 Kb/sec 的比特率编码。你可以通过地址 [`tiny.cc/beagle1407`](http://tiny.cc/beagle1407)\
  \ 在桌面电脑上直接播放这些文件。\n\n```\n…/chp14/audio/testMicrophone$ ls\nZoomH1DigitalSource.mp3\
  \  testCreative.mp3  testDynamode.mp3 \n```\n\n与原始数字音频数据相比，两个版本中都能听到线路噪声，但两个 USB\
  \ 音频适配器的录音质量没有显著差异。\n\n#### 音频网络流\n\n本章前面部分描述了使用 `avconv` 向网络传输视频流。同样，也可以使用同一应用程序在音频设备捕获音频时实时将其流式传输到网络。例如，以下命令将连接到地址\
  \ `2,0` 的设备上的音频通过 UDP 流式传输到桌面电脑（位于 192.168.7.1）：\n\n```\ndebian@ebb:/tmp$ avconv\
  \ -ac 1 -f alsa -i hw:2,0 -acodec libmp3lame →\n  -ab 32k -ac 1 -f mp3 udp://192.168.7.1:12345\n\
  ffmpeg version 3.2.12-1~deb9u1 Copyright (c) 2000-2018 the FFmpeg developers\n \
  \ built with gcc 6.3.0 (Debian 6.3.0-18+deb9u1) 20170516  …\nGuessed Channel Layout\
  \ for Input Stream #0.0 : mono\nInput #0, alsa, from 'hw:2,0':\n  Duration: N/A,\
  \ start: 1536103924.360745, bitrate: 768 kb/s\n    Stream #0:0: Audio: pcm_s16le,\
  \ 48000 Hz, mono, s16, 768 kb/s\nOutput #0, mp3, to 'udp://192.168.7.1:12345':\n\
  \  Metadata: TSSE : Lavf57.56.101\n    Stream #0:0: Audio: mp3 (libmp3lame), 48000\
  \ Hz, mono, s16p, 32 kb/s\n    Metadata: encoder : Lavc57.64.101 libmp3lame\nStream\
  \ mapping: Stream #0:0 -> #0:0 (pcm_s16le (native) -> mp3 (libmp3lame))\nPress [q]\
  \ to stop, [?] for help\nsize=      73kB time=00:00:18.52 bitrate=  32.1kbits/s\
  \ speed=0.993x \n```\n\n可以使用桌面播放器（如 VLC）打开网络 UDP 流。例如，在 VLC 中，选择“媒体”→“打开网络串流”，并将网络\
  \ URL 设置为：`udp://@:12345`。\n\n#### 蓝牙 A2DP 音频\n\n蓝牙适配器的使用首次在第 12 章中介绍，用于通用串行通信。在第\
  \ 13 章中再次使用它来连接外设到 BBB。这里，蓝牙同样可以与 Beagle 板配合使用——这次是与音频设备通信。\n\n蓝牙无线通信系统最常见的用途之一是将智能手机连接到车载音频系统或家庭娱乐中心。为此，蓝牙*高级音频分发配置文件*（A2DP）可用于将高质量立体声音频从媒体源流式传输到媒体接收端。*源设备*（SRC）充当数字音频流的来源（例如蓝牙耳机、智能手机媒体播放器），以压缩格式发送到*接收设备*（SNK）（例如蓝牙耳机、立体声接收器、车载接收器）。\n\
  \n当连接到 USB 蓝牙适配器时，Beagle 板可以配置为 A2DP 源或接收端。在此示例中，板被配置为源，连接到 Hi-Fi 系统和 Windows PC\
  \ 接收端。市面上有许多低成本的 A2DP 音频接收器，它们通过 3.5 mm 立体声插孔提供音频输出，可用于为 Hi-Fi 系统后期添加 A2DP 功能。然而，用作测试平台的索尼\
  \ Hi-Fi 系统内置了 A2DP 支持。\n\n将蓝牙适配器连接到板后，第一步是安装必要的软件包，配置它以支持 A2DP，并测试蓝牙音频接收端是否可见。\n\
  \n```\ndebian@ebb:~$ hcitool scan\nScanning …   40:E2:30:13:CA:09       HOMEOFFICE-PC\n\
  \               00:1D:BA:2E:BC:36       CMT-HX90BTR\n               00:21:04:F9:35:8E\
  \       S68H \n```\n\n板检测到了桌面 PC、一台三星设备以及索尼 Hi-Fi 系统（CMT-HX90BTR）。\n\n对于较新的 A2DP\
  \ 服务，还需要一个名为 PulseAudio 的额外 Linux 服务，这是一个后台进程，用于重新路由所有音频流。它旨在支持旧设备，并为网络音频（例如 VNC）提供支持。最新的\
  \ [BeagleBoard.org](http://BeagleBoard.org) Debian 镜像默认安装了 PulseAudio。它还提供了有用的用户界面工具，例如\
  \ `pavucontrol`，可以通过以下命令安装：\n\n```\ndebian@ebb:~$ sudo apt install pulseaudio pavucontrol\
  \ →\n pulseaudio-module-bluetooth\ndebian@ebb:~$ pulseaudio --version\npulseaudio\
  \ 10.0\ndebian@ebb:~$ pulseaudio --dump-modules \n```\n\nPulseAudio 可以按如下方式配置：\n\
  \n```\ndebian@ebb:/etc/pulse$ sudo nano default.pa \n```\n\n可以使用以下命令启动和停止该服务（注意：无需\
  \ `sudo`）：\n\n```\ndebian@ebb:~$ pulseaudio --kill\ndebian@ebb:~$ pulseaudio --start\
  \ \n```\n\n调试 PulseAudio 问题的最佳方法之一是终止服务，然后使用 `pulseaudio -v` 启动服务以获取详细输出。\n\n\n\n\
  \n\n一旦你确认 PulseAudio 工作正常，就可以在守护进程模式下运行它，并开始将开发板与蓝牙设备配对的过程。\n\n```\ndebian@ebb:~$\
  \ pulseaudio -D\ndebian@ebb:~$ sudo bluetoothctl\n[bluetooth]# scan on\nDiscovery\
  \ started …\n[CHG] Device 00:1D:BA:2E:BC:36 Name: CMT-HX90BTR\n[CHG] Device 00:1D:BA:2E:BC:36\
  \ Alias: CMT-HX90BTR\n[CHG] Device 00:1D:BA:2E:BC:36 LegacyPairing: yes \n```\n\n\
  然后，你可以使用以下命令连接到 SNK（你可能需要在两个设备上都输入一个代码 [例如 0000] 来完成第一步的配对）：\n\n```\n[bluetooth]#\
  \ pair 00:1D:BA:2E:BC:36\nAttempting to pair with 00:1D:BA:2E:BC:36\n[CHG] Device\
  \ 00:1D:BA:2E:BC:36 Connected: yes\n[CHG] Device 00:1D:BA:2E:BC:36 Paired: yes\n\
  [bluetooth]# trust 00:1D:BA:2E:BC:36\n[CHG] Device 00:1D:BA:2E:BC:36 Trusted: yes\n\
  Changing 00:1D:BA:2E:BC:36 trust succeeded\n[bluetooth]# paired-devices\nDevice\
  \ 00:1D:BA:2E:BC:36 CMT-HX90BTR\n[bluetooth]# info 00:1D:BA:2E:BC:36\nDevice 00:1D:BA:2E:BC:36\n\
  \        Name: CMT-HX90BTR      Alias: CMT-HX90BTR\n        Class: 0x240428    \
  \    Icon: audio-card\n        Paired: yes            Trusted: yes\n        Blocked:\
  \ no            Connected: no\n        LegacyPairing: yes     UUID: Audio Sink \
  \ …\n[bluetooth]# connect 00:1D:BA:2E:BC:36\nAttempting to connect to 00:1D:BA:2E:BC:36\n\
  [CHG] Device 00:1D:BA:2E:BC:36 Connected: yes\nConnection successful \n```\n\n现在，如果你使用\
  \ PulseAudio 声音配置工具 `pacmd`，你会看到蓝牙设备已经作为一个音频接收端可用。\n\n```\ndebian@ebb:~$ pacmd\n\
  Welcome to PulseAudio 10.0! Use \"help\" for usage information.\n>>> list-sinks\n\
  3 sink(s) available …\nindex: 2      name: <bluez_sink.00_1D_BA_2E_BC_36> …\n>>>\
  \ set-default-sink 2 \n```\n\n然后，你可以通过将 PulseAudio 作为设备来播放音频文件到蓝牙设备。\n\n```\ndebian@ebb:~/exploringbb/chp14/audio$\
  \ aplay -D pulse cheering.wav \nPlaying WAVE 'cheering.wav' : Unsigned 8 bit, Rate\
  \ 11025 Hz, Mono \n```\n\n### 文本转语音\n\n一旦你有一个正常工作的播放适配器连接到你的 Beagle 开发板，你就可以利用 Linux\
  \ 工具和在线服务来执行一些有趣的音频应用。其中一个应用是文本转语音（TTS）——可以使用 eSpeak、FestVox Festival 和 pico2wave\
  \ 等工具从文本生成音频。目前，pico2wave 必须从源码构建，但 eSpeak 和 Festival 在 Debian 发行版中以二进制形式提供。\n\n\
  你可以安装 eSpeak 并将其输出音频到 `aplay` 应用程序，如下所示：\n\n```\ndebian@ebb:~$ sudo apt install\
  \ espeak\ndebian@ebb:~$ espeak \"Hello Pocket Beagle\" --stdout | aplay -D plughw:2,0\n\
  Playing WAVE 'stdin' : Signed 16 bit Little Endian, Rate 22050 Hz, Mono \n```\n\n\
  你可以安装 Festival 并使用它将文本文件输出为 WAV 格式文件，如下所示：\n\n```\ndebian@ebb:~$ sudo apt install\
  \ festival festival-freebsoft-utils\ndebian@ebb:~$ nano hello.txt\ndebian@ebb:~$\
  \ more hello.txt \nHello Pocket Beagle\ndebian@ebb:~$ text2wave hello.txt -o hello.wav\n\
  debian@ebb:~$ ls -l *.wav\n-rw-r--r-- 1 debian debian 52528 Sep  5 02:05 hello.wav\n\
  debian@ebb:~$ aplay -D plughw:2,0 hello.wav\nPlaying WAVE 'hello.wav' : Signed 16\
  \ bit Little Endian, Rate 16000 Hz, Mono \n```\n\n文本可以通过管道传递给 `text2wave` 应用程序，如下所示：\n\
  \n```\ndebian@ebb:~$ echo 'Hello Beagle' | text2wave -o test.wav\ndebian@ebb:~$\
  \ aplay -D plughw:2,0 test.wav\nPlaying WAVE 'test.wav' : Signed 16 bit Little Endian,\
  \ Rate 16000 Hz, Mono \n```\n\nTTS 引擎可以集成到你自己的应用程序中。例如，你可以像下面这样使用二进制应用程序的输出（以 date\
  \ 应用程序为例）来提供动态语音输出：\n\n```\ndebian@ebb:~$ echo $(date +\"It is %M minutes past %l\
  \ %p\") | → \n   text2wave -o test.wav\ndebian@ebb:~$ aplay -D plughw:2,0 test.wav\n\
  Playing WAVE 'test.wav' : Signed 16 bit Little Endian, Rate 16000 Hz, Mono\ndebian@ebb:~$\
  \ lame test.wav test.mp3\ndebian@ebb:~$ mplayer -ao alsa:device=hw=2 test.mp3\n\
  debian@ebb:~$ ls -l test*\n-rw-r--r-- 1 debian debian  7992 Sep  5 02:09 test.mp3\n\
  -rw-r--r-- 1 debian debian     0 Apr  5 01:46 test.txt\n-rw-r--r-- 1 debian debian\
  \ 81966 Sep  5 02:08 test.wav \n```\n\n最后，还可以在 Beagle 开发板上安装 CMU Sphinx 语音识别工具包。与\
  \ Nuance 的 Dragon NaturallySpeaking 等商业产品相比，开源语音识别工具的训练难度众所周知。然而，投入一些时间后，PocketSphinx\
  \ 可以被训练出良好的效果。\n\n## 总结\n\n完成本章后，你应该能够做到以下几点：\n\n*   使用 USB 摄像头结合 Linux Video4Linux2\
  \ 驱动和 API，在 Beagle 开发板上捕获图像和视频数据。\n\n*   使用 Video4Linux2 工具获取视频捕获设备的信息并调整其属性。\n\n\
  *   使用 Linux 应用程序以及 UDP、多播和 RTP 流，将视频数据流式传输到互联网。\n\n*   使用 OpenCV 在嵌入式 Linux 设备上执行基本的图像处理。\n\
  \n*   使用 OpenCV 执行计算机视觉人脸检测任务。\n\n*   在 Beagle 开发板上使用 Boost C++ 库。\n\n*   使用 HDMI\
  \ 音频和 USB 音频适配器播放音频数据。音频数据可以是原始波形数据，也可以是来自开发板文件系统或网络电台流的压缩 MP3 数据。\n\n*   使用 USB\
  \ 音频适配器或摄像头录制音频数据。\n\n*   使用 UDP 将音频数据流式传输到互联网。\n\n*   将音频播放到蓝牙 A2DP 音频设备，例如高保真音响系统。\n\
  \n*   使用文本转语音（TTS）方法将 Beagle 开发板上执行的命令的文本输出转化为语音。\n\n## 延伸阅读\n\n本章提供了许多网站和文档的链接。关于这些主题的更多链接和进一步信息，请访问\
  \ [`www.exploringbeaglebone.com/chapter14/`](http://www.exploringbeaglebone.com/chapter14/)\
  \ 以及以下内容：\n\n*   Video4Linux2 核心文档：[`tiny.cc/beagle1402`](http://tiny.cc/beagle1402)\n\
  \n*   V4L2 API 规范：[`tiny.cc/beagle1403`](http://tiny.cc/beagle1403)\n\n*   Boost\
  \ C++ 库，Boris Schäling：[`theboostcpplibraries.com`](http://theboostcpplibraries.com)\n\
  \n*   计算机视觉级联分类：[`tiny.cc/beagle1409`](http://tiny.cc/beagle1409)\n\n*   CVonline：不断发展的、分布式的、非专有的在线计算机视觉汇编，网址为\
  \ [`tiny.cc/beagle1410`](http://tiny.cc/beagle1410)\n\n# 第 15 章\n\n使用 PRU-ICSS 进行实时接口\n\
  \nBeagle 开发板的 AM335x SoC 包含两个可编程实时单元（PRU），可用于某些实时操作，这也是本章的重点。本章首先通过输入和输出示例来帮助解释\
  \ PRU 及其包含的工业通信子系统（PRU-ICSS）的工作原理。AM335x 的实时能力通过两个应用进行演示——第一个在 GPIO 上生成自定义波形，第二个使用低成本的超声波距离传感器，该传感器需要精确的时序来传达与障碍物的距离。\n\
  \n本章所需设备：\n\n*   任意 Beagle 开发板\n\n*   LED、FET（例如 BS270）、按钮、电容和电阻\n\n*   示波器（可选但有用）\n\
  \n*   HC-SR04 超声波传感器和逻辑电平转换板\n\n本章的更多资源可在 [`www.exploringbeaglebone.com/chapter15/`](http://www.exploringbeaglebone.com/chapter15/)\
  \ 获取。\n\n## PRU-ICSS\n\nBeagle 开发板 AM335x SoC 上的可编程实时单元和工业通信子系统（PRU-ICSS）包含两个 32\
  \ 位 200 MHz RISC 内核，称为 PRU。这些 PRU 拥有自己的本地内存分配，但它们也可以使用 BeagleBone P8/P9 或 PocketBeagle\
  \ P1/P2 排针引脚，并与 Linux 主机设备共享内存。\n\n\n\n\n\nPRU-ICSS 是对通用嵌入式 Linux 平台的一个宝贵补充，因为它可以为具有硬实时约束的接口应用提供支持。需要注意的是，PRU-ICSS\
  \ 并非硬件加速器——它不能用于提升在 Linux 主机设备上执行的代码的通用性能。相反，它可以用于操作输入、输出和内存映射数据结构，以实现自定义通信接口（例如，简单的\
  \ I/O 操作、位敲击、SPI、UART）。例如，在本章中，PRU-ICSS 被用于通过精确测量 PWM 信号属性来连接超声波距离传感器。\n\n### PRU-ICSS\
  \ 架构\n\n图 15-1 概述了 PRU-ICSS 的架构。它包含两个独立的 32 位 RISC PRU 核心（PRU0 和 PRU1），每个核心拥有 8\
  \ KB 的程序存储器和 8 KB 的数据存储器。程序存储器存储每个 PRU 要执行的指令，数据存储器通常用于存储由程序指令操作的单个数据值或数据数组。PRU0\
  \ 使用 Data RAM0，PRU1 使用 Data RAM1；然而，每个 PRU 都可以访问另一个 PRU 的数据存储器，以及一个独立的 12 KB 通用共享存储器。\n\
  \n![PRU-ICSS 架构示意图：两个独立的 32 位 RISC PRU 核心（PRU0 和 PRU1），每个核心拥有 8 KB 程序存储器和 8 KB 数据存储器。](img/c15f001.jpg)\n\
  \n**图 15-1****：** PRU-ICSS 架构\n\n图片由德州仪器提供，针对 Beagle 板进行了定制\n\nAM335x 上可用的 PRU-ICSS\
  \ 子系统是第二代的 PRUSSv2，但并非所有特性都在 Beagle 板平台上可用。除了 PRU 核心和存储器块之外，最重要的模块如图 15-1 所示，包括以下内容：\n\
  \n*   **增强型 GPIO（EGP）：** PRU 子系统拥有一组特定的快速 GPIO，其中许多可通过 BBB 的 P8/P9 和 PocketBeagle\
  \ 的 P1/P2 排针访问。\n\n*   **OCP 主端口：** 便于访问外部 Linux 主机内存。例如，该模块还允许 PRU 操作第 6 章中使用的\
  \ GPIO 状态。\n\n*   **可选累加乘法器（MAC）：** 该模块可用于将两个 32 位操作数相乘，并产生一个 64 位结果。\n\n*   **中断控制器（INTC）：**\
  \ 中断控制器可用于通知每个 PRU 某个事件已发生，或通知主机设备事件（例如，PRU 可执行程序已运行完毕）。\n\n*   **暂存区（SPAD）：** 提供三个\
  \ 30 × 32 位寄存器组，在两个 PRU 核心之间共享。\n\n*   **UART0：** Beagle 板排针上提供了一个具有专用 192 MHz 时钟的\
  \ UART 设备。\n\n交换中央资源（SCR）将 PRU 连接到 PRU-ICSS 内部的其他资源。PRU 通过接口/OCP 主端口访问 AM335x 上的资源（例如，常规\
  \ GPIO）。PRU 也可以使用 Linux 主机内存；然而，其使用速度比使用 PRU 内存慢数倍，因为内存访问需要路由到 PRU-ICSS 外部，再通过 PRU-ICSS\
  \ 接口/OCP 从端口返回。\n\n### 远程处理器框架\n\nLinux 远程处理器框架 `remoteproc` 旨在允许异构多处理器 SoC（HMPSoC）以统一的方式控制各种远程/从处理器。AM335x\
  \ 是一个 HMPSoC，因为 PRU-ICSS 的硬件架构与 Arm Cortex-A8 主处理器不同。\n\n`remoteproc` 框架允许运行 Linux\
  \ 的主处理器通过操作系统设备绑定来控制从处理器。例如，通过在 Beagle 板上使用以下简单命令，您可以关闭、加载新固件并打开 PRU 设备：\n\n```\n\
  root@ebb:/sys/class/remoteproc/remoteproc1# echo 'stop' > state\nroot@ebb:/sys/class/remoteproc/remoteproc1#\
  \ cat state\noffline\nroot@ebb:…/remoteproc1# echo 'am335x-pru0-fw' > firmware\n\
  root@ebb:…/remoteproc1# echo 'start' > state\nroot@ebb:…/remoteproc1# cat state\n\
  running \n```\n\n在此示例中，控制的是 PRU0，并且从 `/lib/firmware/am335x-pru0-fw` 文件加载固件到 PRU\
  \ 中。您可以在运行时更改此文件，从而将新的二进制固件（目前必须是 ELF32 格式）加载到 PRU。在向设备写入新的 PRU 程序（即固件）之前，必须停止 PRU。\n\
  \n`remoteproc` 框架提供了高级特性，例如*远程处理器消息传递框架*（`rpmsg`），它允许内核驱动程序与处理器通信。每个 `rpmsg` 设备是一个通信通道，称为\
  \ `channel`，远程设备称为 `destination` `rpmsg` 地址。驱动程序监听一个通道，其中接收回调与一个唯一的地址值相关联。当消息到达时，由\
  \ `rpmsg core` 将其分派给已注册的驱动程序。\n\n### 重要文档\n\n以下列出了描述 PRU-ICSS 的最重要文档，也可在章节网页上找到：\n\
  \n*   **PRU-ICSS 参考指南：** 该文档是 PRU-ICSS 硬件的主要参考：[`tiny.cc/beagle1501`](http://tiny.cc/beagle1501)\n\
  \n*   **Linux 上的 PRU-ICSS 入门指南：** [`tiny.cc/beagle1502`](http://tiny.cc/beagle1502)\n\
  \n*   **PRU 调试器用户指南：** [`tiny.cc/beagle1503`](http://tiny.cc/beagle1503)\n\n*  \
  \ **远程处理器框架：** [`tiny.cc/beagle1504`](http://tiny.cc/beagle1504)\n\n*   **处理器消息传递框架：**\
  \ [`tiny.cc/beagle1505`](http://tiny.cc/beagle1505)\n\n本章中的描述会反复引用上述文档，因此手头备有这些文档会很有帮助。\n\
  \n## PRU-ICSS 的开发工具\n\n必须安装两个工具来构建和测试本章中描述的示例应用程序：PRU CGT 和 PRU 调试器。\n\n### PRU\
  \ 代码生成工具\n\n德州仪器于 2017 年 5 月发布了 PRU 代码生成工具（CGT）。这些开发工具完全支持远程处理器框架。\n\n*   *编译器*（`clpru`）接收\
  \ C/C++（C89/C99）源代码并生成汇编语言代码。\n\n*   *汇编器*（内置于 `clpru`）将汇编语言代码转换为机器目标（`.object`）文件。\n\
  \n*   *链接器*（`lnkpru`）将目标文件组合成一个可执行目标文件（`.out`）。这个可执行目标文件可以直接在 PRU 设备上执行。\n\n可以调用编译器，其一般用法如下：\n\
  \n```\nclpru [options][filenames][--run_linker[link_options] [object files]] \n\
  ```\n\n其中源文件名必须放在 `--run_linker` 选项之前，所有链接器选项必须放在此选项之后。在本章中，由于需要大量配置选项，`clpru` 是从\
  \ `Makefile` 文件中调用的。有关 CGT 的更多详细信息，请访问 [`tiny.cc/beagle1506`](http://tiny.cc/beagle1506)，有关编译器的详细信息，请访问\
  \ [`tiny.cc/beagle1507`](http://tiny.cc/beagle1507)。\n\n第一步是在您的 Beagle 板上安装编译器。浏览到\
  \ [`www.ti.com/tool/download/PRU-CGT-2-1/`](http://www.ti.com/tool/download/PRU-CGT-2-1/)\
  \ 并确定最新下载版本的链接。在撰写本文时，版本为 2.1.5，可以按如下方式安装：\n\n\n\n\n\n```\ndebian@ebb:~$ wget http://software-dl.ti.com/codegen/esd/cgt_publ\
  \ →\nic_sw/PRU/2.1.5/ti_cgt_pru_2.1.5_armlinuxa8hf_busybox_installer.sh\n…~$ chmod\
  \ ugo+x ti_cgt_pru_2.1.5_armlinuxa8hf_busybox_installer.sh\n…~$ sudo ./ti_cgt_pru_2.1.5_armlinuxa8hf_busybox_installer.sh\n\
  Installing PRU Code Generation tools version 2.1.5 into /\n  please wait, or press\
  \ CTRL-C to abort\nExtracting archive\nInstalling files\n[####################]\
  \ 100%\nInstalled successfully into /\ndebian@ebb:~$ clpru --compiler_revision\n\
  2.1.5\ndebian@ebb:~$ whereis clpru\nclpru: /usr/bin/clpru \n```\n\n### PRU 调试器\n\
  \nPRU 调试器 `prudebug`（[`sourceforge.net/projects/prudebug/`](http://sourceforge.net/projects/prudebug/)）是一款用于识别\
  \ PRU 程序代码问题的实用工具。它可以在单独的终端中运行，并在 PRU 程序暂停时用于查看寄存器。例如，它可以显示如下寄存器内容（请注意，`R00` 到 `R07`\
  \ 中不寻常的寄存器值来自本章的一个示例）：\n\n```\nroot@ebb:~# prudebug\nPRU Debugger v0.25\n(C)2011,\
  \ 2013 by Arctica Technologies.  All rights reserved.\nWritten by Steven Anderson\n\
  Using /dev/mem device.\nProcessor type          AM335x\nPRUSS memory address   \
  \ 0x4a300000\nPRUSS memory length     0x00040000\n   offsets below are in 32-bit\
  \ word addresses (not ARM byte addr)\n   PRU         Instruction    Data       \
  \  Ctrl\n   0           0x0000d000     0x00000000   0x00008800\n   1           0x0000e000\
  \     0x00000800   0x00009000\nPRU0> r\nRegister info for PRU0\n   Control register:\
  \ 0x00000001+\n    Reset PC:0x0000 STOPPED, FREE_RUN, COUNTER_DISABLED, NOT_SLEEPING,\
  \ \n    PROC_DISABLED   Program counter: 0x003b\n    Current instruction: HALT\n\
  \   R00: 0x00010008  R08: 0xd767338a  R16: 0x00000020  R24: 0x80000000\n   R01:\
  \ 0xebbfeed0  R09: 0xfcccfbf7  R17: 0xffffff50  R25: 0x733c6942\n   R02: 0xebbfeed1\
  \  R10: 0xbaff8256  R18: 0x00000403  R26: 0x3a8215cd\n   R03: 0xebbfeed2  R11: 0x43935b82\
  \  R19: 0x00091e38  R27: 0xaa7935e9\n   R04: 0xebbfeed3  R12: 0x5097debd  R20: 0xc0490000\
  \  R28: 0xff5fe5dd\n   R05: 0xebbfeed4  R13: 0xb3b7db2e  R21: 0x40490000  R29: 0xe6b79da6\n\
  \   R06: 0xebbfeed5  R14: 0x00000003  R22: 0x00000000  R30: 0x00000000\n   R07:\
  \ 0xebbfeed6  R15: 0x0000003b  R23: 0x00000000  R31: 0x00000000 \n```\n\nPRU 调试器还可用于将二进制文件加载到\
  \ PRU 中、显示指令/数据存储空间、反汇编指令存储空间，以及启动/暂停或单步执行 PRU。这非常有用，因为由于缺乏标准输出，调试在 PRU 上运行的程序十分困难。例如，你可以通过以下命令切换\
  \ PRU：\n\n```\nPRU0> pru 1\nActive PRU is PRU1\\. \n```\n\n或者，你可以显示 PRU 数据存储器中的当前值：\n\
  \n```\nPRU0> DD\nAbsolute addr = 0x0000, offset = 0x0000, Len = 16\n[0x0000] 0xebbfeed0\
  \ 0xebbfeed1 0x00000000 0x00000000\n[0x0004] 0x00000000 0x00000000 0x00000000 0x00000000\n\
  [0x0008] 0x00000000 0x00000000 0x00000000 0x00000000\n[0x000c] 0x00000000 0x00000000\
  \ 0x00000000 0x00000000 \n```\n\n使用 `Q` 退出调试器，`RESET` 重置当前 PRU，`SS` 单步执行，`G` 启动处理器，`BR`\
  \ 设置断点。在第一个 PRU 程序示例中，我们将很快再次用到调试器。\n\n## 使用 AM335x PRU-ICSS\n\n默认情况下，Beagle 板并未配置\
  \ PRU-ICSS；因此，你必须先启用它并测试其是否正常工作。\n\n### 为 Remoteproc 设置板子\n\nBeagle 板提供了虚拟 cape，可以让你轻松启用\
  \ PRU。`/boot/uEnv.txt` 配置文件允许你在两种 PRU 接口模型 `remoteproc` 和 `UIO` 之间进行选择。`UIO` 在本书第一版中使用，但在最新的内核版本中已不再支持。\n\
  \n按如下方式编辑 `/boot/uEnv.txt` 文件，取消注释 `pru_rproc` 行，并修改该行以识别当前运行内核版本的设备树二进制文件（`.dtbo`）。在我的情况下，我运行的是\
  \ Linux 4.14.67，因此我必须从 `/lib/firmware/` 目录中选择 `AM335X-PRU-RPROC-4-14-TI-00A0.dtbo`。\n\
  \n```\nroot@ebb:/boot# uname -r\n4.14.67-ti-rt-r73\nroot@ebb:/boot# ls /lib/firmware/AM335X-PRU*\n\
  /lib/firmware/AM335X-PRU-RPROC-4-14-TI-00A0.dtbo\n/lib/firmware/AM335X-PRU-RPROC-4-14-TI-PRUCAPE-00A0.dtbo\n\
  /lib/firmware/AM335X-PRU-RPROC-4-4-TI-00A0.dtbo\n…\n/lib/firmware/AM335X-PRU-UIO-00A0.dtbo\n\
  root@ebb:/boot# more uEnv.txt\n…\n###PRUSS OPTIONS\n###pru_rproc (4.4.x-ti kernel)\n\
  #uboot_overlay_pru=/lib/firmware/AM335X-PRU-RPROC-4-4-TI-00A0.dtbo\nuboot_overlay_pru=/lib/firmware/AM335X-PRU-RPROC-4-14-TI-00A0.dtbo\n\
  ###pru_uio (4.4.x-ti, 4.14.x-ti & mainline/bone kernel)\n#uboot_overlay_pru=/lib/firmware/AM335X-PRU-UIO-00A0.dtbo\n\
  … \n```\n\nPRU 引脚列在第 6 章的图 6-8 和图 6-9 中，它们以 `pr1_pru0_` 或 `pr1_pru1_` 为前缀。例如，图 6-9\
  \ 中的 `P9_27/P2.34` 可以在模式 6（`pr1_pru0_pru_r31_0`）下配置为 PRU 输入，在模式 5（`pr1_pru0_pru_r30_0`）下配置为输出。这种表示法稍后会介绍。不过，你会注意到许多\
  \ PRU 引脚，尤其是 BeagleBone P8 排针上的引脚，已经被 HDMI 占用。此时，你可能还需要编辑 `uEnv.txt` 文件以禁用视频虚拟 cape。\n\
  \n```\nroot@ebb:~$ more /boot/uEnv.txt\n…\n###Disable auto loading of virtual capes\
  \ (emmc/video/wireless/adc)\n#disable_uboot_overlay_emmc=1\ndisable_uboot_overlay_video=1\n\
  … \n```\n\n重启后，你可以使用 `dmesg` 命令检查因编辑 `uEnv.txt` 配置文件而产生的错误。例如，一个功能完整的 PRU-ICSS 会产生类似如下的启动信息：\n\
  \n```\nroot@ebb:~# dmesg |grep pru\n[  279.649950] pruss 4a300000.pruss: creating\
  \ PRU cores and →\nother child platform devices\n[  279.823196] remoteproc remoteproc1:\
  \ 4a334000.pru is available\n[  279.823424] pru-rproc 4a334000.pru: PRU rproc node\
  \ →\n/ocp/pruss_soc_bus@4a326004/pruss@0/pru@34000 probed successfully\n[  279.919415]\
  \ remoteproc remoteproc2: 4a338000.pru is available\n[  279.919695] pru-rproc 4a338000.pru:\
  \ PRU rproc node →\n/ocp/pruss_soc_bus@4a326004/pruss@0/pru@38000 probed successfully\
  \ \n```\n\n注意，`4a334000.pru`（PRU0）与 Linux `remoteproc1` 关联，`4a338000.pru`（PRU1）与\
  \ Linux `remoteproc2` 关联。调用 `lsmod` 也会列出相关的 LKM。\n\n```\ndebian@ebb:~$ lsmod|grep\
  \ pru\npruss_soc_bus          16384  0\npru_rproc              28672  0\npruss \
  \                 16384  1 pru_rproc\npruss_intc             20480  1 pru_rproc\
  \ \n```\n\n### 在 Linux 下测试 Remoteproc\n\nRemoteproc 绑定到 sysfs 下的多个位置，提供了一种直接的方式来加载固件并与各个\
  \ PRU 交互。加载后，PRU 应显示如下，其中 `0x4a334000` 是 PRU0 的地址，`0x4a338000` 是 PRU1 的地址。\n\n```\n\
  root@ebb:/sys/bus/platform/drivers/pru-rproc# ls -l\nlrwxrwxrwx 1 root root    0\
  \ Sep  6 05:54 4a334000.pru …\nlrwxrwxrwx 1 root root    0 Sep  6 05:54 4a338000.pru\
  \ …\nlrwxrwxrwx 1 root root    0 Sep  6 05:54 module …\n--w------- 1 root root 4096\
  \ Nov  3  2016 uevent\nroot@ebb:/sys/bus/platform/drivers/pru-rproc# cd 4a334000.pru\n\
  root@ebb:/sys/bus/platform/drivers/pru-rproc/4a334000.pru# ls\ndriver     driver_override\
  \  modalias  of_node  power  remoteproc  \nsubsystem  uevent \n```\n\n每个 PRU 都可以通过其\
  \ `/sys/kernel/debug/` 绑定进行控制。例如，以下调用显示了这些绑定的结构，其中 `remoteproc1` 绑定到 PRU0，`remoteproc2`\
  \ 绑定到 PRU1。`remoteproc0` 的条目与 Wakeup M3（CM3）remoteproc 驱动程序相关，该驱动程序帮助 AM33xx 系列设备中的\
  \ Cortex M3 协处理器处理低功耗任务——它在控制 PRU-ICSS 方面不起作用。\n\n\n\n\n```\nroot@ebb:/sys/kernel/debug/remoteproc#\
  \ ls\nremoteproc0  remoteproc1  remoteproc2\nroot@ebb:/sys/kernel/debug/remoteproc#\
  \ cd remoteproc1\nroot@ebb:/sys/kernel/debug/remoteproc/remoteproc1# ls -l\n-r--------\
  \ 1 root root 0 Sep  6 05:51 carveout_memories\n-r-------- 1 root root 0 Sep  6\
  \ 05:51 name\n-r-------- 1 root root 0 Sep  6 05:51 recovery\n-r-------- 1 root\
  \ root 0 Sep  6 05:51 regs\n-r-------- 1 root root 0 Sep  6 05:51 resource_table\n\
  -rw------- 1 root root 0 Sep  6 05:51 single_step \n```\n\n请注意，这提供了与本章前面 PRU 调试器输出一致的寄存器视图。\n\
  \n你还可以使用每个 PRU 的 `/sys/class/remoteproc/` 绑定来控制它，这允许你更新固件以及启动和停止每个 PRU。\n\n```\n\
  root@ebb:/sys/class/remoteproc# ls\nremoteproc0  remoteproc1  remoteproc2\nroot@ebb:/sys/class/remoteproc#\
  \ tree remoteproc1\nremoteproc1\n├└─ device -> ../../../4a334000.pru\n├└─ firmware\n\
  ├└─ power\n│  ├└─ async\n│  ├└─ autosuspend_delay_ms\n│  ├└─ control\n│  ├└─ runtime_active_kids\n\
  │  ├└─ runtime_active_time\n│  ├└─ runtime_enabled\n│  ├└─ runtime_status\n│  ├└─\
  \ runtime_suspended_time\n│  └└─ runtime_usage\n├└─ state\n├└─ subsystem -> ../../../../../../../../class/remoteproc\n\
  └└─ uevent \n```\n\n例如，要启动和停止 PRU，可以使用以下命令：\n\n```\nroot@ebb:/sys/class/remoteproc/remoteproc1#\
  \ echo 'stop' > state\nroot@ebb:/sys/class/remoteproc/remoteproc1# echo 'start'\
  \ > state\nroot@ebb:/sys/class/remoteproc/remoteproc1# echo 'start' > state\n-bash:\
  \ echo: write error: Device or resource busy \n```\n\nPRU 不能启动两次，如果你尝试这样做，或者在其运行时向设备写入固件，将会出现前面所示的错误。\n\
  \n## 第一个 PRU 示例\n\n本节开发了一个“Hello World”LED 闪烁应用程序，以便你快速上手 PRU-ICSS。后续章节将提供更详细的说明和更复杂的示例。\n\
  \n### PRU-ICSS 增强型 GPIO\n\n每个 PRU 都有一组具有增强功能的 GPIO，例如并行到串行转换。它们的内部信号名称遵循以下命名约定：`pr1_pru``X``_pru_r3``Y``_``Z`，其中\
  \ `X` 是 PRU 编号（0 或 1），`Y` 定义引脚是输入（1）还是输出（0），`Z` 是引脚编号（0–16）。例如，`pr1_pru0_pru_r30_5`\
  \ 是 PRU0 的输出 5，`pr1_pru0_pru_r31_3` 是 PRU0 的输入 3。\n\n在第 6 章中，图 6-8 和图 6-9 列出了 P8/P9\
  \ 和 P1/P2 排针上可用的增强型 GPIO 引脚。从这些图中可以清楚地看出，必须使用 `config-pin` 工具将引脚复用配置为 Mode5 或 Mode6，才能使用这些输入/输出。并非所有引脚都引出到\
  \ BeagleBone 的 P8/P9 排针或 PocketBeagle 的 P1/P2 排针上。\n\n图 15-2 展示了一个使用两个增强型 PRU 引脚的电路。本章的几个示例都使用了该电路。\n\
  \n![BBB 和 PocketBeagle 板上使用一个增强型 PRU 引脚作为输出、另一个增强型 PRU 引脚作为输入的 PRU0 电路图。](img/c15f002.jpg)\n\
  \n**图 15-2****：** BBB 和 PocketBeagle 板上使用 `pr1_pru0_pru_r30_5` 作为输出、`pr1_pru0_pru_r31_3`\
  \ 作为输入的 PRU0 示例电路\n\n必须将引脚配置为 PRU 模式。在本示例中，`P9_27`（或 PocketBeagle 上的 `P2.34`）必须配置为\
  \ PRU 输出，如下所示：\n\n```\ndebian@ebb:~$ config-pin -l P9_27\ndefault gpio gpio_pu gpio_pd\
  \ gpio_input qep pruout pruin\ndebian@ebb:~$ config-pin P9_27 pruout\ndebian@ebb:~$\
  \ config-pin -q P9_27\nP9_27 Mode: pruout \n```\n\n并且，`P9_28`（或 PocketBeagle 上的\
  \ `P2.30`）必须配置为 PRU 输入：\n\n```\ndebian@ebb:~$ config-pin -l P9_28\ndefault gpio\
  \ gpio_pu gpio_pd gpio_input spi_cs pwm pwm2 pruout pruin\ndebian@ebb:~$ config-pin\
  \ P9_28 in-\ndebian@ebb:~$ config-pin -q P9_28\nP9_28 Mode: gpio_pd Direction: in\
  \ Value: 0\ndebian@ebb:~$ config-pin P9_28 pruin\ndebian@ebb:~$ config-pin -q P9_28\n\
  P9_28 Mode: pruin \n```\n\n### 第一个 PRU 程序\n\n第一个 PRU 程序旨在闪烁连接到 `pr1_pru0_pru_r30_5`（`P9_27`/`P2.34`）的\
  \ LED，直到按下连接到 `pr1_pru0_pru_r31_3`（`P9_28`/`P2.30`）的按钮（参见图 15-2）。本示例以 C 语言和汇编语言形式提供。\n\
  \n#### *第一个 PRU 程序（C 语言）*\n\nPRU 程序的代码如清单 15-1 所示。这段 C 代码看起来与常规 C 代码略有不同，因为它不在 Linux\
  \ 用户空间执行，而是在 PRU 上执行。LED 由寄存器 `r30` 中的位 5 控制，该位以十六进制 `0x0000 0020`（即 `100000[2]`）访问。类似地，按钮由寄存器\
  \ `r31` 中的位 3 控制，该位以十六进制 `0x0000  0008`（即 `1000[2]`）访问。有关这些示例中执行的位运算的更多详细信息，请参阅第\
  \ 6 章中的“C/C++ 中的位操作”专题。\n\n```\n/* Source Modified by Derek Molloy for Exploring\
  \ BeagleBone Rev2\n * Based on the examples distributed by Texas Instruments  */\n\
  \n#include <stdint.h>\n#include <pru_cfg.h>\n#include \"resource_table_empty.h\"\
  \n\nvolatile register uint32_t __R30;   // output gpio register\nvolatile register\
  \ uint32_t __R31;   // input gpio register\n\nvoid main(void) {\n    volatile uint32_t\
  \ led, button;  // for bit identifiers\n\n    // Use pru0_pru_r30_5 as an output\
  \ i.e., 100000 or 0x0020\n    led = 0x0020;\n\n    // Use pru0_pru_r31_3 as a button\
  \ i.e., 1000 or 0x0008\n    button = 0x0008;\n\n    // Stop the loop when the button\
  \ is pressed\n    while (!(__R31 && button)) {    // while button bit not set\n\
  \       __R30 ^= led;            // invert/flash the LED bit\n       // delay for\
  \ approx. 0.25s (one quarter second)\n       __delay_cycles(50000000);\n    }\n\
  \    __halt();                   // end the program\n} \n```\n\n**清单 15-1：** `/exploringbb/chp15/pru/ledFlash/ledFlash.c`\n\
  \n清单 15-1 中的 C 程序放置在包含以下文件的项目目录中：\n\n*   `Makefile` 包含项目的所有构建选项。你可以调用 `make`、`make\
  \ clean` 来清除构建文件，以及 `make install_PRUx` 将二进制可执行文件部署到 PRU。\n\n*   `AM335x_PRU.cmd`\
  \ 是一个链接器命令文件，用于链接使用编译器构建的 PRU 程序。它包含 PRU 架构的内存映射和定义。\n\n*   `resource_table_empty.h`\
  \ 是 remoteproc 所需的，用于定义 PRU 内核所需的资源表。\n\n```\ndebian@ebb:~/exploringbb/chp15/pru/ledFlashC$\
  \ ls -l\n-rw-r--r-- 1 debian debian 3505 Sep  7 05:29 AM335x_PRU.cmd\n-rw-r--r--\
  \ 1 debian debian 2326 Sep 18 00:09 ledFlash.c\n-rw-r--r-- 1 debian debian 3616\
  \ Sep  7 05:29 Makefile\n-rw-r--r-- 1 debian debian 2789 Sep  7 05:29 resource_table_empty.h\
  \ \n```\n\n可以使用 `Makefile` 文件构建此项目，如下所示：\n\n\n\n\n```\n…/chp15/pru/ledFlashC$ make\n\
  Building project: ledFlashC\nBuilding file: ledFlash.c\nInvoking: PRU Compiler\n\
  /usr/bin/clpru --include_path=/usr/lib/ti/pru-software-support-package/include \n\
  --include_path=/usr/lib/ti/pru-software-support-package/include --\ninclude_path=/usr/lib/ti/pru-software-support-package/include/am335x\
  \ -v3 -O2 \n--display_error_number --endian=little --hardware_mac=on --obj_directory=gen\
  \ \n--pp_directory=gen -ppd -ppa -fe gen/ledFlash.object ledFlash.c\nBuilding target:\
  \ gen/ledFlashC.out\nInvoking: PRU Linker\n/usr/bin/clpru -v3 -O2 --display_error_number\
  \ --endian=little --hardware_mac=on \n--obj_directory=gen --pp_directory=gen -ppd\
  \ -ppa -z \n-i/usr/lib/ti/pru-software-support-package/lib \n-i/usr/lib/ti/pru-software-support-package/include\
  \ --reread_libs \n--warn_sections --stack_size=0x100 --heap_size=0x100 -o gen/ledFlashC.out\
  \ \ngen/ledFlash.object -mgen/ledFlashC.map ./AM335x_PRU.cmd --library=libc.a \n\
  --library=/usr/lib/ti/pru-software-support-package/lib/rpmsg_lib.lib\n<Linking>\n\
  Finished building target: gen/ledFlashC.out\nOutput files can be found in the \"\
  gen\" directory\nFinished building project: ledFlashC \n```\n\n然后使用 `make install_PRU0`\
  \ 部署到 PRU0：\n\n```\n…/chp15/pru/ledFlashC$ sudo make install_PRU0\nStopping current\
  \ PRU0 application (/sys/class/remoteproc/remoteproc1)\nStop…  Installing firmware…\
  \ Deploying firmware…\nam335x-pru0-fw… Starting new PRU0 application… Start \n```\n\
  \n实际上，这个 `Makefile` 在 `gen/` 目录下构建了一个二进制文件 `ledFlashC.out`，然后将其复制到 `/lib/firmware/am335x-pru0-fw`（因此需要超级用户权限）。按照本章前面描述的方式，PRU0\
  \ 被停止，固件文件被写入 PRU0 程序存储器，然后重新启动。\n\n```\n…/chp15/pru/ledFlashC$ cd gen\n…/chp15/pru/ledFlashC/gen$\
  \ ls\nledFlashC.map  ledFlashC.out  ledFlash.object  ledFlash.pp\n…/chp15/pru/ledFlashC/gen$\
  \ ls -l ledFlashC.out\n-rw-r--r-- 1 debian debian 32284 Sep 18 01:15 ledFlashC.out\n\
  …/chp15/pru/ledFlashC/gen$ cd ..\n…/chp15/pru/ledFlashC$ ls -l /lib/firmware/am335x-pru0-fw\n\
  -rw-r--r-- 1 root root 32284 Sep 18 01:14 /lib/firmware/am335x-pru0-fw \n```\n\n\
  #### *第一个 PRU 汇编程序*\n\n也可以用汇编语言编写这个程序，在设计时序关键型程序时，汇编语言有时更直接。汇编代码的扩展名为 `.asm`，但你仍然需要一个\
  \ C 容器程序，例如清单 15-2 中提供的程序。\n\n```\n#include <stdint.h>\n#include <pru_cfg.h>\n#include\
  \ \"resource_table_empty.h\"\n\n// the function is defined in ledFlashASM.asm in\
  \ same dir\n// declaration is here, definition is linked to the .asm\n\nextern void\
  \ start(void);  // not defined here, but in the .asm\n\nvoid main(void) {\n   START();\
  \               // call START in ledFlashASM.asm  \n} \n```\n\n**清单 15-2:** `/exploringbb/chp15/pru/ledFlashASM/main.c`\n\
  \n项目 `ledFlashASM.asm` 中的 LED 闪烁代码使用了清单 15-3 中的原始汇编代码。LED 亮 50 ms，然后灭 50 ms，这意味着\
  \ LED 将以 10 Hz（即每秒 10 次）的频率闪烁，结果如图 15-4 所示。\n\n![显示 LED 以 10 Hz 频率闪烁输出的截图，LED 亮\
  \ 50 ms 后灭 50 ms。](img/c15f004.jpg)\n\n**图 15-4****:** 以 10 Hz 频率干净地闪烁 LED\n\n```\n\
  \ .cdecls \"main.c\"\n        .clink\n        .global START\n        .asg \"5000000\"\
  ,  DELAY   ; hard define the DELAY\nSTART:\n        SET     r30, r30.t5      ; set\
  \ the output LED pin (LED on)\n        LDI32   r0, DELAY        ; load the delay\
  \ value into REG0\nDELAYON:\n        SUB     r0, r0, 1        ; subtract 1 from\
  \ the REG0 value\n        QBNE    DELAYON, r0, 0   ; loop to DELAYON, unless REG0=0\n\
  LEDOFF:\n        CLR     r30, r30.t5      ; clear the output pin (LED off)\n   \
  \     LDI32   r0, DELAY        ; Reset REG0 to the length of the delay\nDELAYOFF:\n\
  \        SUB     r0, r0, 1        ; decrement REG0 by 1\n        QBNE    DELAYOFF,\
  \ r0, 0  ; loop to DELAYOFF, unless REG0=0\n        QBBC    START, r31, 3    ; is\
  \ the button pressed? If not, loop\nEND:\n        HALT                     ; halt\
  \ the pru program \n```\n\n**清单 15-3:** `/exploringbb/chp15/pru/ledFlashASM/ledFlashASM.asm`\n\
  \n关于可用汇编语言指令的详细信息将在本章后面提供，但清单 15-3 中使用的重要指令如下：\n\n*   `SET r30.t5`：将寄存器 30 的第 5\
  \ 位设置为高电平。REG30 用于将 PRU0 GPIO 引脚设置为高电平。第 5 位专门控制 `pr1_pru0_pru_r30_5` 引脚输出。\n\n\
  *   `LDI32 r0, DELAY`：将 32 位延迟值（即 5,000,000）加载到寄存器 REG0 中。这里使用寄存器，就像在 C 语言中使用变量一样。汇编操作在寄存器上执行。\n\
  \n*   `DELAYON`：用户定义的标签，代码可以跳转到该标签。\n\n*   `SUB r0, r0, 1`：从 REG0 中减去 `1`，并将结果存储回\
  \ REG0。这本质上等同于代码 `REG0 = REG0 - 1`。\n\n*   `QBNE DELAYON, r0, 0`：如果 REG0 不等于 0，则执行快速分支。这创建了一个循环，将这两条指令循环执行\
  \ 5,000,000 次（正好耗时 50 ms！）。\n\n*   `CLR r30, r30.t5`：清除寄存器 30 的第 5 位，将输出设置为低电平并关闭\
  \ LED。\n\n*   `QBBC START, r31.t3`：如果 `r31.t3` 位被清除（即 `0`），则快速跳转到 `START`。REG31\
  \ 是输入寄存器，用于读取输入状态——`t3` 是第 3 位，连接到 `pr1_pru0_pru_r31_3` 引脚。由于按键输入引脚配置为启用下拉电阻，未按下时返回\
  \ `0`，按下时返回 `1`。如果按键未按下，程序将无限循环，持续闪烁 LED。当程序执行到此时首次检测到按键处于按下状态，则程序继续执行下一行。\n\n*\
  \   程序最后调用 `HALT` 结束。\n\n可以使用 `make` 命令构建此程序，然后按如下方式部署到您选择的 PRU：\n\n```\n…/chp15/pru/ledFlashASM$\
  \ make\n…/chp15/pru/ledFlashASM$ sudo make install_PRU0 \n```\n\n这将在 `gen/` 目录下生成文件\
  \ `ledFlashASM.out`。\n\n每次执行程序时，LED 将以 10 Hz 的频率闪烁，直到按下按键。该应用程序的一个令人印象深刻的特点是输出信号的规律性，当电路连接到示波器时可以观察到这一点。图\
  \ 15-4 展示了输出和频率测量结果，从测量结果可以清楚地看出，该信号没有受到第 6 章中类似电路所影响的抖动问题。此外，该程序运行时几乎没有 Linux 开销。\n\
  \n## PRU-ICSS 详解\n\n有一个可用的工作示例很有帮助，但 PRU-ICSS 的某些功能必须更详细地介绍，以确保您可以编写基于上述示例的自己的应用程序。\n\
  \n### 寄存器\n\n在前面的示例中，一个寄存器（REG0）被用作存储和递减时间延迟的内存位置。`寄存器`提供了访问数据的最快方式——汇编指令应用于寄存器，并在单个时钟周期内完成。然而，每个\
  \ PRU 内核有 32 个寄存器（0–31）。寄存器 REG1 到 REG29 是通用寄存器，而 REG30 和 REG31 是专用寄存器，REG0 用于索引（或作为通用寄存器）。需要注意的是，对于微控制器来说，30\
  \ 个通用寄存器是一个相当充裕的数量，因为这些寄存器可以重复使用。例如，在前面的 PRU 程序中，两个延迟都使用单个寄存器完成。\n\n\n\n\n寄存器值是\
  \ 32 位变量，可通过后缀表示法访问，如图 15-5 所示。在前文展示的代码清单 15-3 中，使用`r30.t5`访问`REG30`的第 5 位。共有三种后缀。\n\
  \n*   字 `.w``n`（其中`n`为 0…2）\n*   字节 `.b``n`（其中`n`为 0…3）\n*   位 `.t``n`（其中`n`为 0…31）\n\
  \n![32 位变量的 PRU 寄存器位域表示法示意图。](img/c15f005.jpg)\n\n**图 15-5****：** PRU 寄存器位域表示法\n\
  \n需要注意的是，共有三个字索引——`w1`偏移了 8 位，因此与`w0`和`w2`的内容各有一半重叠。图 15-5 还提供了一些用法示例——例如，`r2.w1.b1`请求字\
  \ 1 的字节 1，长度为 8 位（即`r2`的第 16 至 23 位）。这等价于请求`r2.b2`（8 位），但*不*等价于`r2.w2`，后者起始地址相同但长度为\
  \ 16 位。非法寄存器调用的示例包括`r2.w2.b2`、`r2.t4.b1`、`r2.w1.t16`和`r2.b0.b0`。\n\n`REG31`被称为`PRU\
  \ 事件/状态寄存器`（`r31`）。这是一个特别复杂的寄存器，其行为因写入或读取而异。写入`REG31`时，它提供了一种向中断控制器（INTC）发送输出事件的机制。通过将事件编号（0\
  \ 至 31）写入五个最低有效位（`PRU_VEC[4:0]`）并将第 5 位（`PRU_VEC_VALID`）置高，即可向 Linux 主机发送一个输出事件。\n\
  \n读取`REG31`时，它提供增强型 GPIO 输入的状态。例如，在代码清单 15-3 中，`QBBC START, r31.t3`这一行从`REG31`读取第\
  \ 3 位，以判断按钮是否处于按下状态。本质上，它读取了连接到第 3 位的 GPIO 的状态。\n\n`REG30`由 PRU 用于设置增强型 GPIO 输出。例如，在代码清单\
  \ 15-3 中，`SET r30.t5`这一行用于将`REG30`的第 5 位置高。这进而导致关联的 GPIO 输出点亮 LED。\n\n### 本地与全局内存\n\
  \nPRU 拥有通用本地内存，PRU 程序可使用它来存储和检索数据。由于此本地 PRU 内存被映射到 Linux 主机上的全局地址空间，因此它也可用于在 PRU\
  \ 程序与运行于 Linux 主机上的程序之间共享数据。图 15-6 展示了内存映射。\n\n![PRU-ICSS 内存地址映射示意图，映射到 Linux 主机上的全局地址空间。](img/c15f006.jpg)\n\
  \n**图 15-6****：** PRU-ICSS 内存地址映射\n\n图片根据德州仪器提供的数据创建\n\n需要注意的是，PRU 内存空间之间存在细微差异。PRU0\
  \ 在地址`0x0000 0000`访问其主内存（Data RAM0），PRU1 也在地址`0x0000 0000`访问其主内存（Data RAM1）。然而，每个\
  \ PRU 还可以在地址`0x0000 2000`访问另一个 PRU 的数据 RAM。此外，两个 PRU 可在本地地址`0x0001 0000`使用 12 KB\
  \ 的共享内存。PRU 内核也可以使用全局内存映射，但由于访问需通过 OCP 从端口路由（参见图 15-1），因此存在延迟。\n\n代码清单 15-4 是一个简短的\
  \ C 程序，它使用 PRU0 将七个 32 位值写入三个不同的内存位置：PRU0 内存、PRU1 内存和共享 PRU 内存。每个内存位置的地址如图 15-6\
  \ 所示。所选值易于识别，即`0xEBBFEEDx`。\n\n```\n#include <stdint.h>\n#include <pru_cfg.h>\n\
  #include \"resource_table_empty.h\"\n\n#define PRU0_DRAM  0x00000000\nvolatile uint32_t\
  \ *pru0Mem = (unsigned int *) PRU0_DRAM;\n#define PRU1_DRAM  0x00002000\nvolatile\
  \ uint32_t *pru1Mem = (unsigned int *) PRU1_DRAM;\n#define SHARE_MEM  0x00010000\n\
  volatile uint32_t *shared =  (unsigned int *) SHARE_MEM;\n\nextern void start(void);\n\
  \nvoid main(void) {\n   pru0Mem[0] = 0xEBBFEED0;\n   pru0Mem[1] = 0xEBBFEED1;\n\
  \   pru1Mem[0] = 0xEBBFEED2;\n   pru1Mem[1] = 0xEBBFEED3;\n   shared[0]  = 0xEBBFEED4;\n\
  \   shared[1]  = 0xEBBFEED5;\n   shared[2]  = 0xEBBFEED6;\n   start();\n} \n```\n\
  \n**代码清单 15-4：** `/exploringbb/chp15/pru/pruTest/pruTest.c`\n\n代码清单 15-5 中的代码是一个\
  \ PRU 程序，由代码清单 15-4 中对`start()`的调用启动。该汇编程序简单地将不同内存位置的值加载到寄存器`r1`至`r7`中。寄存器`r0`用作临时寄存器，存储要加载的地址值。\n\
  \n```\n .cdecls \"pruTest.c\"\n   .clink\n        .global start\nstart:\n   LDI32\
  \   r0, 0x00000000   ; 将 PRU0 地址加载到 r0\n   LBBO    &r1, r0, 0, 4    ; 将 r0 处的值 EBBFEED0\
  \ 加载到 r1\n   LDI32   r0, 0x00000004   ; 将下一个 PRU0 地址加载到 r0\n   LBBO    &r2, r0,\
  \ 0, 4    ; 将 EBBFEED1 加载到 r2\n\n   LDI32   r0, 0x00002000   ; 将 PRU1 地址加载到 r0\n\
  \   LBBO    &r3, r0, 0, 4    ; 将 r0 处的值 EBBFEED2 加载到 r3\n   LDI32   r0, 0x00002004\
  \   ; 将下一个 PRU1 地址加载到 r0\n   LBBO    &r4, r0, 0, 4    ; 将 EBBFEED3 加载到 r4\n\n  \
  \ LDI32   r0, 0x00010000   ; 将共享地址加载到 r0\n   LBBO    &r5, r0, 0, 4    ; 将 EBBFEED4\
  \ 加载到 r5\n   LDI32   r0, 0x00010004   ; 将下一个共享地址加载到 r0\n   LBBO    &r6, r0, 0, 4\
  \    ; 将 EBBFEED5 加载到 r6\n   LDI32   r0, 0x00010008   ; 将下一个共享地址加载到 r0\n   LBBO\
  \    &r7, r0, 0, 4    ; 将 EBBFEED6 加载到 r7\n\n   HALT \n```\n\n**代码清单 15-5：** `/exploringbb/chp15/pru/pruTest/pruTest.asm`\n\
  \n该项目可通过以下命令构建并执行：\n\n```\ndebian@ebb:~/exploringbb/chp15/pru/pruTest$ make\ndebian@ebb:~/exploringbb/chp15/pru/pruTest$\
  \ sudo make install_PRU0 \n```\n\n执行此代码后，您可以使用`devmem2`工具和图 15-6 中的地址映射从 Linux 用户空间访问内存地址，结果如下：\n\
