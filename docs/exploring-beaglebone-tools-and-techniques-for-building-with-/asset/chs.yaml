  \ 桥 | 高端 DSP 和实时接口应用，包括 eSATA 和 USB3 |\n\n**表 1-1****：** 近期 Beagle 板卡的高级对比\n\n###\
  \ Beagle 硬件\n\n图 1-3、1-4 和 1-5 详细展示了 BBB 和 PocketBeagle 板卡的核心系统。第一组标注（1 到 8）标识并描述了\
  \ BBB 上的关键系统。BBB 上的微处理器是德州仪器 Sitara AM335x Cortex A8 ARM 微处理器²。它是一种精简指令集计算（RISC）处理器，因此在\
  \ 1,000 MHz 频率下，该处理器每秒执行 20 亿条指令（MIPS）。处理器在空闲时功耗约为 1W，在重负载处理时约为 2.3 W。\n\n![表格插图，列出了\
