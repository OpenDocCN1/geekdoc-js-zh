  \n该代码可以在 Beagle 板上从 Qt Creator 内部执行，也可以手动从终端窗口执行，如下所示：\n\n```\nmolloyd@desktop:~$\
  \ ssh -XC debian@192.168.7.2\ndebian@ebb:~$ cd ~/exploringbb/chp13/QtTemperature/\n\
  debian@ebb:~/exploringbb/chp13/QtTemperature$ ./Temperature \n```\n\n## 远程 UI 应用程序开发\n\
  \n在第 11 章中，介绍了一个 C++客户端/服务器应用程序，该程序可用于两台不同机器（或同一台机器）上运行的两个进程之间通过 TCP 套接字进行直接互通信。这些机器可以位于同一个物理/无线网络中，甚至可以位于不同的大洲。直接套接字通信要求程序员自行构建互通信协议。这虽然增加了编程开销，但也带来了高效的通信，其速度仅受网络速度的限制。\n\
  \n在本节中，我们将 Qt 温度传感器 GUI 应用程序的功能与 C++客户端/服务器应用程序（来自第 11 章）相结合。这使得我们可以创建一个胖客户端 GUI\
  \ 温度应用程序，该程序能够与运行在 Beagle 板上的温度服务进行互通信。温度服务服务器代码在第 11 章的基础上进行了增强，使其支持多线程。这一改动使得多个客户端应用程序可以同时连接到服务器。其架构如图\
  \ 13-13 所示。\n\n![Qt 胖客户端 GUI 温度应用程序客户端/服务器架构示意图，该架构可与 Beagle 板上的温度服务进行互通信。](img/c13f013.jpg)\n\
  \n**图 13-13****：** Qt 胖客户端 GUI 应用程序客户端/服务器架构\n\nQt GUI 应用程序的完整源代码位于`chp13/QtSocketsTemperature`目录中，服务器源代码位于`chp13/threadedTemperatureServer`目录中。\n\
  \n### 胖客户端 Qt GUI 应用程序\n\n在本节中，我们对本章前面介绍的 Qt 温度传感器 GUI 应用程序进行修改，使其具备“互联网功能”。这一改动意味着应用程序不必在\
  \ Beagle 板上运行；相反，GUI 应用程序可以在桌面机器上运行，并通过 TCP 套接字与板载传感器进行通信。为实现这一目标，我们对 GUI 应用程序代码进行了以下修改：\n\
  \n1.  在应用程序中添加了一个新的对话框窗口，用于输入服务器 IP 地址、服务端口号和读取刷新频率。该对话框如图 13-14 所示。\n\n2.  GUI\
  \ 应用程序不再从 Beagle 板 ADC 读取数据，而是打开一个 TCP 套接字并与 Beagle 板服务器应用程序通信。客户端应用程序向服务器发送字符串`\"\
  getTemperature\"`。服务器被编程为响应温度值，该温度值从连接到 ADC 输入的 TMP36 传感器读取。温度以 JSON 格式编码。\n\n3.\
  \  在应用程序 UI 上启用了一个菜单，可用于打开服务器设置对话框或退出应用程序。也可以使用相应的快捷键`Ctrl+S`和`Ctrl+X`。\n\n![菜单和服务器设置对话框窗口的截图，用于输入服务器\
  \ IP 地址、服务端口号和读取刷新频率。](img/c13f014.jpg)\n\n**图 13-14****：** 菜单和服务器设置对话框\n\n\n\n\n\
