  \ 1 GHz AM335x，带两个 32 位 PRU | 双核 1.5 GHz ARM A15、C66 DSP 内核、双核 ARM M4 和四个 PRU |\n\
  | **内存** | 512 MB DDR3 | 512 MB DDR3 | 512 MB DDR3 | 512 MB DDR3 | 2 GB DDR3 |\n\
