  \ 1 章中的链接 2）。如果本书出版后链接地址发生变化，别名将更新。\n\n本书使用了若干特性来标识内容特别重要或存在额外信息的情况。\n\n## 你需要准备什么\n\
  \n理想情况下，你应该在开始阅读本书之前拥有一块 Beagle 板，以便跟随文中的众多示例进行操作。如果你还没有板子，建议在订购前先阅读第 1 章。目前，该板由\
  \ CircuitCo 和 Embest 两家公司生产——两家制造商生产的板子与本书中的设计和操作兼容。你可以从美国的在线商店（如 Adafruit Industries、Digi-Key、Mouser、SparkFun\
  \ 和 Jameco Electronics）购买其中一款板子。国际上的商店（如 Farnell、Radionics、Watterott 和 Tigal）也有售。\n\
  \n第 1 章提供了 Beagle 平台推荐和可选配件的完整列表。此外，每章都包含如果你想跟随文本操作所需的电子元件和模块列表。本书网站提供了这些元件获取途径的详细信息。\n\
  \n## 勘误\n\n我已非常努力地确保本书没有错误；但总有可能遗漏某些内容。每章的网页上都有完整的勘误表，可在配套网站上找到。如果你在文本或源代码示例中发现任何错误，请通过配套网站发送错误信息，以便我更新网页勘误表和代码仓库中的源代码示例，我将不胜感激。\n\
  \n## 数字内容与源代码\n\n本书的主要配套网站是 [`www.exploringbeaglebone.com`](http://www.exploringbeaglebone.com)。它包含视频、源代码示例以及进一步阅读的链接。每章都有独立的网页。万一该网站不可用，你可以在\
  \ [`www.wiley.com/go/exploringbeaglebone2e`](http://www.wiley.com/go/exploringbeaglebone2e)\
  \ 找到代码。\n\n所有源代码均可通过 GitHub 获取，你可以使用一条命令将代码下载到你的 Beagle 板上。你也可以在线轻松查看代码，网址为 [`tiny.cc/beagle002`](http://tiny.cc/beagle002)。将源代码下载到你的板子非常简单，只需在\
  \ Linux shell 提示符下输入以下命令：\n\n```\ndebian@ebb:$ git clone https://github.com/derekmolloy/exploringbb.git\n\
  ```\n\n如果你从未使用过 Git，不用担心——第 3 章会详细解释。现在，开始冒险吧！\n\n# 第一部分\n\nBeagle 板基础\n\n## 本部分内容\n\
  \n*   **第 1 章：** Beagle 硬件平台\n*   **第 2 章：** Beagle 软件\n*   **第 3 章：** 探索嵌入式 Linux\
  \ 系统\n*   **第 4 章：** 电子接口\n*   **第 5 章：** 实用 Beagle 板编程\n\n# 第 1 章\n\nBeagle 硬件平台\n\
  \n在本章中，你将了解 BeagleBone 平台硬件及其变体板。本章特别关注 BeagleBone 和 PocketBeagle 板，以及这些板的各种子系统和物理输入/输出。此外，本章还列出了有助于开发你自己的基于\
  \ Beagle 项目的配件。到本章结束时，你应该能够体会到这个计算平台的强大与复杂性。你还应该了解保护你的板子免受物理损坏的首要步骤。\n\n## 板子简介\n\
  \n\n\n\nBeagle 板是紧凑、低成本、开源的 Linux 计算平台，可用于构建将高级软件与低级电子电路对接的复杂应用。这些平台非常适合利用 Linux\
  \ 的强大与自由，同时结合对输入/输出引脚和总线的直接访问，从而与电子元件、模块和 USB 设备进行交互的原型项目和产品设计。以下是单板计算机（SBC）的一些特性：\n\
  \n*   它们功能强大，搭载的处理器每秒可执行多达 20 亿条指令。\n*   它们价格相对低廉，根据所选板卡不同，售价低至 25 至 90 美元。\n* \
  \  它们支持多种电子设备的标准接口。\n*   它们功耗低，运行功耗在 1 W（空闲）到 2.3 W（峰值）之间。\n*   它们可通过子板和 USB 设备进行扩展。\n\
  *   它们得到了庞大的创新者和爱好者社区的强力支持。\n*   它们是开源硬件，并支持用于商业和非商业应用的开源软件工具。\n\nBeagleBone 和 PocketBeagle\
  \ 板运行 Linux 操作系统，这意味着你可以直接使用许多开源软件库和应用程序。开源软件驱动的可用性还使你能够将 USB 摄像头、键盘和 Wi-Fi 适配器等设备与你的项目对接，而无需寻找专有替代品。因此，你可以访问由才华横溢的开源社区构建的全面代码库；但重要的是要记住，这些代码通常不附带任何形式的保修或保证。如果出现问题，你需要依靠社区的良好意愿来解决。当然，你也可以自己修复问题并将解决方案公开。\n\
  \n![(a) BeagleBone Black Wireless 板、(b) PocketBeagle 板和 (c) Adafruit PCB Ruler 板的图片。](img/c01f001.jpg)\n\
  \n**图 1-1****：** (a) BeagleBone Black Wireless，(b) PocketBeagle，以及 (c) 用于相对尺寸参考的\
  \ Adafruit PCB Ruler\n\n[`BeagleBoard.org`](http://BeagleBoard.org) 基金会是一家美国非营利组织，旨在提供开源硬件和软件方面的嵌入式系统教育。在过去十年中，该基金会开发了高质量的板卡，这些板卡在开源社区中以其详细的文档、广泛的支持以及在创意原型与商业产品设计之间搭建的坚实桥梁而闻名。\n\
  \n这些平台板卡由高性能微处理器集成在印刷电路板（PCB）上，并配合丰富的软件生态系统构成。物理 PCB 并非完整产品，而是一个原型参考设计，你可以用它来构建完整产品。它是一个开源硬件平台，意味着你可以直接下载并在自己的产品设计中使用\
  \ BeagleBone 或 PocketBeagle 的硬件原理图和布局。事实上，尽管这些板卡功能强大，但它们并未完全暴露德州仪器 Sitara AM335x\
  \ 系统级芯片（SoC）的所有特性和接口。\n\n最近的 BeagleBone 和 PocketBeagle 板采用了 Octavo Systems 的系统级封装（SiP），该封装将\
  \ Sitara AM335x 处理器、DDR 内存、电源管理功能以及所有必要的无源元件集成到单个球栅阵列（BGA）封装中，如图 1-1 所示。这种 SiP 设计方法极大地简化了基于\
  \ AM335x 处理器平台的板卡电路布局，并使得 PocketBeagle 的小尺寸成为可能。如果你决定将设计商业化，应牢记这种方法，因为它可能将最终产品的上市时间缩短数月。\n\
  \nBeagle 平台的一个令人印象深刻的特点是，板卡功能可以通过称为 *capes* 的子板进行扩展，这些子板连接到扩展排针（图 1-1(a) 中的两排黑色\
  \ 2×23 连接器，或图 1-1(b) 中未焊接的 2×18 排针）。你可以设计自己的 capes，并使用这些排针将其牢固地连接到板卡上。此外，许多 capes\
  \ 可供购买，用于扩展板卡的功能。本章稍后将介绍其中一些示例。\n\n前五款 BeagleBone PCB 由 Gerald Coley 设计，他是 [BeagleBoard.org](http://BeagleBoard.org)\
  \ 基金会的联合创始人，现任 Embedded Product Design（[`www.emprodesign.net`](http://www.emprodesign.net)）总裁。过去几年中，这些板卡及其部分\
  \ capes 由 CircuitCo（[`www.circuitco.com`](http://www.circuitco.com)）、Element14（[`www.element14.com`](http://www.element14.com)）及其子公司\
  \ Embest（[`www.embest-tech.com`](http://www.embest-tech.com)）制造。因此，当你购买 Beagle 板时，并非直接从\
  \ [BeagleBoard.org](http://BeagleBoard.org) 基金会购买；相反，该基金会是开发者与用户社区的焦点。\n\n### 谁应该使用\
  \ Beagle 平台\n\n任何希望将工程概念转化为真实交互式电子产品、项目、原型或艺术作品的人都应考虑使用 Beagle 平台。话虽如此，将高级软件与低级电子电路集成并非易事。然而，实现的难度取决于项目所需的复杂程度。\n\
  \n[BeagleBoard.org](http://BeagleBoard.org) 社区正在努力确保其平台能够被所有有兴趣将其集成到项目中的人所使用，无论他们是学生、创客、艺术家还是爱好者。工具和软件开发环境，例如\
  \ Jason Kridner（BeagleBoard.org 联合创始人）的 BoneScript Node.js 库以及 Cloud9 集成开发环境（IDE），使用户能够直接在能够控制电子硬件的\
  \ Web 浏览器中编写和构建代码。BoneScript 库将在第 2 章中介绍。\n\n对于具备电子或计算知识的高级用户，Beagle 平台支持额外的开发和定制，以满足特定项目需求。同样，这种定制并非易事：你可能是电子专家，但高级软件编程和/或\
  \ Linux 操作系统可能会让你感到困难。或者，你可能是编程大师，但从未连接过 LED！本书旨在满足所有类型的用户，为每种读者提供足够的 Linux、电子和软件知识，确保无论你之前的经验水平如何，都能高效工作。\n\
  \n### 何时使用 Beagle 板\n\nBeagle 板非常适合在任何类型的项目中集成高级软件和低级电子电路。无论你是计划构建自动化家庭管理系统、机器人、智能显示器、传感器网络、自动售货机，还是联网的交互式艺术作品，这些板卡都具备足够的处理能力，能够实现你对嵌入式设备的任何想象。\n\
  \n\n\n\n与更传统的嵌入式系统（如 Arduino、PIC 和 AVR 微控制器）相比，最大的优势在于你可以在项目中利用 Linux 操作系统。例如，如果你使用\
  \ BeagleBone 构建了一个家庭自动化系统，然后决定将某些信息发布到互联网上，只需安装一个 Web 服务器即可。接着，你可以使用服务器端脚本或你喜欢的编程语言与家庭自动化系统交互，捕获并共享信息。或者，你的项目可能需要安全的远程访问。在这种情况下，你可以通过\
  \ Linux 命令`sudo apt install sshd`（这些命令将在第 2 章中介绍）轻松安装安全外壳（SSH）服务器。这可能会为你节省数周的开发工作。此外，你可以放心，同样的软件正在全球数百万台机器上安全运行。Linux\
  \ 还为你提供了许多 USB 外设和适配器的设备驱动程序支持，使你能够将摄像头、Wi-Fi 适配器和其他低成本消费类外设直接连接到你的平台，而无需进行复杂和/或昂贵的软件驱动程序开发。如果你要将嵌入式系统连接到互联网或显示器（例如触摸屏或显示器），你应该首先考虑像\
  \ Beagle 板这样的 Linux SBC，而不是其他选项。\n\n### 何时不应使用 Beagle 板\n\nLinux 操作系统并非为实时或可预测处理而设计。因此，在确定性处理任务（例如精确地每百万分之一秒采样一次传感器）中使用该操作系统会面临重大挑战。因此，在默认状态下，Beagle\
  \ 板并不是实时系统应用的理想平台。虽然存在复杂的实时版本 Linux，但它们目前针对的是有经验的 Linux 开发者。然而，与许多其他 Linux SBC 不同，BeagleBone\
  \ 确实有一个板载解决方案，可以在一定程度上解决这个接口问题。在 AM335x SoC 内部，有两个板载微控制器，称为*可编程实时单元*（PRU），可以编程用于实时接口应用。这是一个高级主题，将在第\
  \ 15 章中描述。\n\n对于实时采样和控制任务（例如 TI MSP430 或 SimpleLink 有线和无线 MCU），有低成本的专用解决方案可用，这些可能更适合实时接口。同样重要的是要记住，你可以通过电气总线（例如\
  \ I²C、UART、CAN 总线和以太网）将此类实时微控制器与 Beagle 板互连，并让 Linux SBC 充当分布式控制系统的中央处理器。这是物联网（IoT）中的一个重要概念，将在第\
  \ 10 章、第 11 章和第 12 章中详细描述。\n\nBeagle 平台难以胜任的第二种应用类型是播放或处理高清视频。软件解码和播放编码视频流的处理开销巨大，超出了\
  \ BeagleBone 在高清视频分辨率下的能力。树莓派（[`www.raspberrypi.org`](http://www.raspberrypi.org)）板具有此能力，因为其\
  \ Broadcom BCM2835/7 处理器专为多媒体应用设计，并且具有 H.264/MPG-4 解码器和编码器的硬件实现。对于运行 Kodi 家庭媒体中心（[`kodi.tv`](http://kodi.tv)）等应用，你最好购买树莓派\
  \ 3（Model B+）。此外，你当然应该购买我的书《探索树莓派》，同样来自 Wiley 迷你系列！\n\n如果你的目标是开发嵌入式 Linux 图像处理或计算机视觉平台，那么你应该考虑\
  \ Xilinx Zynq 平台（[`tiny.cc/beagle102`](http://tiny.cc/beagle102)），因为它集成了基于 ARM 的处理器，可以运行\
  \ Linux，同时具备 FPGA 的硬件可编程性。这使得计算密集型但可并行化的图像处理功能可以从 Linux 内核卸载到可编程逻辑硬件上。像 PYNQ、ZYBO\
  \ 或 Arty Z7 这样的板子是可用的，但请注意它们是复杂的设备。\n\n对于将 Linux 与电子电路接口，很难有比 Beagle 板更好的选择，因为其输入/输出范围、平台的开放性以及可用文档的质量都是无与伦比的。\n\
  \n## BeagleBone 文档\n\n本书将我开发 Beagle 平台的经验与嵌入式 Linux、软件开发和通用电子学的背景资料相结合，创建了使用该平台构建的深入指南。然而，一本书不可能涵盖所有内容，因此我避免了重复本节中列出的关键文档和网站中的信息。支持文档的第一个起点始终是：\n\
  \n*   **[BeagleBoard.org](http://BeagleBoard.org)网站：** 该网站提供该平台的主要支持，包括软件指南、社区链接和下载，以支持你的开发。在[`www.beagleboard.org`](http://www.beagleboard.org)上可以找到优秀的“入门”指南和博客。\n\
  \n关于 BeagleBone 平台有大量文档可用，但最重要的文档如下：\n\n*   **Sitara AM335x ARM Cortex-A8 技术参考手册（TRM）：**\
  \ ¹ Beagle 板的关键组件是其德州仪器 SoC，该文档包含你可能想知道的关于 AM335x 内部工作原理的一切。它是一个复杂的设备，这反映在 AM3358\
  \ TRM 的长度上——5113 页！如果你需要了解 BeagleBone 或 PocketBeagle 上微处理器内部工作原理或设备配置的某些内容，答案很可能就在该文档中。我在本书中引用了\
  \ TRM 中的表格，以便你能够熟悉其中的语言。该文档和 SoC 的数据表可从[`www.ti.com/product/am3358`](http://www.ti.com/product/am3358)免费获取。\n\
  \n*   **PocketBeagle 系统参考手册（SRM）：** 这是一个实时维基文档，描述了 PocketBeagle 硬件。由 BeagleBoard\
  \ 社区维护：[`tiny.cc/beagle103`](http://tiny.cc/beagle103)。\n\n*   **BeagleBone Black\
  \ 系统参考手册（SRM）：** 这是描述 BeagleBone Black 硬件的核心文档。可在[`tiny.cc/beagle104`](http://tiny.cc/beagle104)获取。\n\
  \n还有一些关键网站可以支持你在此平台上的学习，它们结合了教程、讨论论坛、示例代码库、Linux 发行版和项目创意，以激发你的创造力。以下是一些重要网站：\n\n\
  *   **本书网站：** [`www.exploringbeaglebone.com`](http://www.exploringbeaglebone.com)\n\
  \n*   **我的个人博客：** [`www.derekmolloy.ie`](http://www.derekmolloy.ie)\n\n*   **[eLinux.org](http://eLinux.org)维基：**\
  \ [`www.elinux.org`](http://www.elinux.org)\n\n*   **Linux 基金会：** [`www.linuxfoundation.org`](http://www.linuxfoundation.org)\n\
  \nBeagle 平台软件的入门介绍在第 2 章中。本章的其余部分将讨论物理板子，解释可用的功能，总结 SRM，并提供一些你可能想连接到板子的外设和扩展板类型的示例。\n\
  \n## Beagle 硬件\n\n\n\n\n\nBeagle 板卡的核心是德州仪器 Sitara AM335x Cortex A8 ARM 微处理器。虽然本书重点介绍\
  \ BeagleBone 和 PocketBeagle，但 [BeagleBoard.org](http://BeagleBoard.org) 还开发了其他板卡，包括\
  \ BeagleBoard、BeagleBoard XM 和 Arduino Tre（BeagleBoard 与 Arduino 合二为一的板卡）。下一节将详细讨论\
  \ BeagleBone 和 PocketBeagle，但这里先按历史顺序列出不同板卡的一些概要信息：\n\n*   **（2008 年）BeagleBoard（125\
  \ 美元）：** 首款支持高清视频的开源 ARM 开发板。它搭载 720 MHz ARM A8 处理器，但无板载以太网。\n*   **（2010 年）BeagleBoard\
  \ xM（149 美元）：** 与 BeagleBoard 类似，但采用 1 GHz ARM（AM37x）处理器、512 MB 内存、四个 USB 端口并支持以太网。尽管新款\
  \ BeagleBone 板卡价格低廉，但 BeagleBoard xM 因其用于数字信号处理（DSP）应用的 C64+TMDSP 内核而广受欢迎。\n*  \
  \ **（2011 年）BeagleBone（89 美元）：** 比 BeagleBoard 更小巧。它搭载 720 MHz 处理器、256 MB 内存、支持以太网、具备低级输入/输出（例如模数转换器），但无板载视频支持。\n\
  *   **（2013 年）BeagleBone Black（45–55 美元）：** 该板卡增强了 BeagleBone，配备 1 GHz 处理器、512 MB\
  \ DDR3 内存、以太网、eMMC 存储和 HDMI 视频支持。\n*   **（2014-2018 年）BeagleBone Green、BeagleBone\
  \ Enhanced、BeagleBone Black Wireless**、**BeagleBone Blue Wireless 和 PocketBeagle（25–90\
  \ 美元）：** 这些变体板卡基本基于 BeagleBone Black 平台。\n*   **（2017 年）BeagleBoard X15（270 美元）：**\
  \ 基于 Sitara AM5728 的高性能 BeagleBoard，配备双核 1.5 GHz ARM Corex-A15 处理器，集成 C66x DSP、ARM\
  \ Cortex-M4 实时处理器和 PRU（[`tiny.cc/beagle105`](http://tiny.cc/beagle105)）。\n\n本书重点介绍\
  \ BeagleBone 和 PocketBeagle 板卡，主要是因为与其他产品相比，它们的功能集和价格点更具优势；不过，本书中的大部分讨论内容普遍适用于所有平台。\n\
  \n### BeagleBone 版本\n\n如前所述，BeagleBone 有多个版本可用，如 图 1-2 所示，特别是较旧的 BeagleBone White（或简称\
  \ BeagleBone）、BeagleBone Black（BBB）以及无线版本。所有板卡都采用小尺寸设计，可以整齐地放入 Altoids 薄荷糖铁盒中；事实上，PocketBeagle\
  \ 甚至可以放入一个微型的 Altoids Smalls 铁盒中。\n\n![图片：(a) 采用 Octavo OSD3358 SiP 的 BeagleBone\
  \ Blue，(b) 采用 AM335x SoC 的原始 BeagleBone White。](img/c01f002.jpg)\n\n**图 1-2****：**\
  \ (a) 采用 Octavo OSD3358 SiP 的 BeagleBone Blue，(b) 采用 AM335x SoC 的原始 BeagleBone White\n\
  \n为了实现如此小的外形尺寸，BeagleBone 上的组件密集排列，并采用六层 PCB 来实现互连。例如，BeagleBone Black 平台上使用的 AM335x（ZCZ）处理器具有\
  \ 324 个引脚的球栅阵列，球间距为 0.80 mm。\n\n表 1-1 列出了当前 Beagle 板卡之间的主要相似点和差异。显而易见的选择因素是价格和网络连接选项。\n\
  \n*   非无线版 BBB 具有以太网连接，这对于板卡充当网络桥接路由器（例如用于 6LoWPAN 应用）的场景特别有用。\n*   当需要无线网络时，BBB\
  \ Wireless 在可能需要视频的移动连接嵌入式应用中表现出色，而 BeagleBone Blue 则擅长与电机接口的移动任务，适用于机器人和自动化等应用。\n\
  *   当成本、尺寸和重量成为项目的重要考虑因素时，PocketBeagle 特别有用。尽管没有板载无线连接，但可以根据特定项目添加和定制。例如，您可以通过将模块连接到板卡的\
  \ USB 或 UART 接口，为项目添加 Wi-Fi、蓝牙或基于 802.15.4 的通信。有趣的是，PocketBeagle 的底面没有组件，这意味着它可以齐平安装在载板印刷电路板（PCB）上。\n\
