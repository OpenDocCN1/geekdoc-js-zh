  \n# 关于作者\n\n\n\n\n\n**德里克·莫洛伊博士**是爱尔兰都柏林城市大学工程与计算学院电子工程系的副教授。他在本科和研究生阶段讲授嵌入式系统面向对象编程、数字与模拟电子学以及连接嵌入式系统等课程。他的研究贡献主要集中在计算机与机器视觉、嵌入式系统、3D\
  \ 图形/可视化以及电子学习领域。\n\n德里克制作了一个广受欢迎的 YouTube 视频系列，已向数百万人介绍了嵌入式 Linux 和数字电子学主题。2013\
  \ 年，他推出了个人网站/博客，每天有数千人访问，该网站整合了他的 YouTube 视频、支持材料、源代码和用户讨论。2015 年，他出版了关于 BeagleBone\
  \ 平台的第一版书籍《探索 BeagleBone》，并于 2016 年 6 月推出了《探索树莓派》。这两本书因其深度和易读性而广受好评。\n\n德里克曾多次获得教学与学习奖项。他是\
  \ 2012 年爱尔兰学习技术协会（ILTA）全国教学创新奖的得主。该奖项表彰他在本科工程教育中采用“做中学”的方法，该方法利用了电子套件和在线视频内容。2012\
  \ 年，由于学生和同行的热烈提名，他还获得了都柏林城市大学校长卓越教学与学习奖。这种“做中学”的方法在他的书中得到了充分体现。\n\n您可以在他的个人网站[`www.derekmolloy.ie`](http://www.derekmolloy.ie)上了解更多关于德里克、他的工作以及其他出版物的信息。\n\
  \n# 关于技术编辑\n\n**玛西娅·K·威尔伯**是一名技术传播顾问，专注于半导体领域，尤其是工业物联网（IIoT）。玛西娅拥有计算机科学、技术传播和信息技术学位。作为铜管\
  \ Linux 用户组的临时主席，她深度参与东谷创客社区，定期领导树莓派、BeagleBone、香蕉派/Pro 和 ESP8266 项目，包括家庭自动化、游戏主机、监控、网络、多媒体及其他“派趣”项目。\n\
  \n除了动手制作，她还志愿帮助受灾地区获取公共领域内容，使学生能够继续学习。作为娱乐，她以 Linux Respin（一款备份和发行版定制工具）的首席 Debian\
  \ 开发者身份服务社区。\n\n# 致谢\n\n再次感谢约翰·威利父子公司的每一位成员在本项目中的卓越工作：感谢吉姆·米纳特尔鼓励我承担本书的修订工作，并支持深化学习型书籍的改进；感谢德文·刘易斯指导项目推进，并在本书开发过程中提供专业支持和帮助；感谢项目编辑阿达奥比·奥比·图尔顿以最高效的方式推动项目完成——第三次与如此出色且娴熟的编辑合作真是莫大的荣幸；感谢文字编辑金·温普塞特将本书翻译成可读的美式英语；感谢制作编辑巴拉特·库马尔·拉贾塞卡兰整合所有内容，打造出最终的精美成品。感谢技术编辑玛西娅·威尔伯对本书技术内容的仔细审阅和建设性反馈。继续感谢我以往作品的技术编辑汤姆·贝特卡、罗伯特·朱（微软）和杰森·克里德纳（BeagleBoard.org\
  \ 基金会），本书的编写基于他们的建议。还要感谢凯茜·威克斯（德州仪器）在本书开发过程中提供的建议和支持。\n\n持续感谢成千上万花时间在我的 YouTube\
  \ 视频、博客和网站文章上留言的人们。我始终珍视你们的反馈、建议和评论——它们对我所有书籍主题的开发帮助极大。\n\n都柏林城市大学电子工程系是一个极好的工作场所，这主要归功于其团队精神以及对严谨、创新和易学工程教育的承诺。再次感谢系里所有同事在本书开发过程中给予的支持、鼓励和包容。特别感谢诺埃尔·墨菲和康纳·布伦南在我再次沉浸于写作时分担了系里的行政工作。再次感谢我的兄弟大卫·莫洛伊提供的专业软件建议和支持。感谢詹妮弗·布鲁顿、马丁·科利尔、帕斯卡·朗代、米歇尔·普林格尔、罗伯特·萨德莱尔、罗南·斯卡夫和约翰·惠兰在我撰写各本书籍过程中持续提供的专业知识、支持和建议。\n\
