  \ more build \n#!/bin/bash\ng++ DCMotorApp.cpp ../../library/libEBBLibrary.so -o\
  \ DCApp -I \"../../library\"\ndebian@ebb:~/exploringbb/chp09/dcmotor$ ./build \n\
