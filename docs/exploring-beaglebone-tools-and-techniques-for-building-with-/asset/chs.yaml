  \ 13-5 和 13-6 中代码的具体性质由注释描述。然而，完全理解代码最清晰的方法是编辑它并查看编辑带来的影响。你不需要温度传感器来执行代码，但在没有传感器的情况下，温度显示将固定在\
  \ 25°C。\n\n![展示 UI 组件与在列表 13-5 中声明并在列表 13-6 中定义的关联槽之间关系的示意图。](img/c13f012.jpg)\n\
