  md: '# # CHAPTER 2

    Getting Started with AIR Development


    This chapter discusses how to get started developing applications for the Adobe
    Integrated Runtime using HTML and JavaScript. It covers:


    +   * Installing Adobe AIR

    * Configuring the Adobe AIR SDK and command-line tools

    * Creating your first AIR application

    * Testing AIR applications

    * Packaging and deploying AIR applications


    Once you have completed this chapter, your environment for developing AIR applications
    should be correctly configured, and you should have an solid understanding of
    how to begin to build, test, and deploy AIR applications.


    # ## What Do You Need to Develop AIR Applications?


    There are a number of required items needed in order to begin developing AIR applications.


    # ### Adobe Integrated Runtime Beta


    The AIR Beta is required to test application icons, as well as deployment of AIR
    applications. The Beta runtime can be downloaded for free from:


    http://www.adobe.com/go/air'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Adobe AIR SDK


    The Adobe AIR SDK contains command-line tools, sample files, and other resources
    to make developing AIR applications easier. In particular, we will be using the
    command-line tools included in the SDK (ADL and ADT), which will allow us to test
    and package our AIR applications from virtually any development environment.


    You can download the AIR SDK for free from:

    http://www.adobe.com/go/air


    # HTML/JavaScript IDE or Editor


    Building AIR applications with HTML and JavaScript requires that you have a way
    to create the HTML and JavaScript files. You can use any tool that supports creating
    and editing text files (such as VIM or Notepad), although it''s recommended that
    you use a tool that has richer support for working with HTML and JavaScript files,
    such as Adobe Dreamweaver, Panic''s Coda, or Aptana.


    # Supported Operating System


    While it is possible to develop and package AIR applications on virtually any
    operating system (including Linux), you can test and deploy the application only
    on operating systems supported by Adobe AIR.


    The supported operating systems for the Beta are:


    +   - Windows XP SP2

    - Windows Vista Home Ultimate Edition

    - Mac OS 10.4.8 and 10.4.9 (Intel and PowerPC)


    Adobe AIR will support additional versions of Mac and Windows for the 1.0 release,
    and Linux shortly after the 1.0 release.'
  merge: -1
