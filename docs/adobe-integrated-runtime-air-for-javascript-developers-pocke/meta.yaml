  mdcn: "\n## 浏览目录\n\n## 问题\n\n应用程序需求要求你允许用户选择一个用于存储数据的目录。\n\n## 解决方案\n\n使用 `File.browseForDirectory()`\
    \ API 提示用户选择目录。\n\n## 讨论\n\n`File.browseForDirectory()` API 创建一个原生对话框，允许用户选择目录。该方法接受一个必需的字符串参数，该参数将用于向用户提供有关所选目录用途的额外信息。\n\
