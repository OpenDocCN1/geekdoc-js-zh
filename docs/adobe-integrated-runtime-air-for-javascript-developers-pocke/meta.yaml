- md: "APIs via the runtime property and the complete API package path, it can lead\
    \ to very verbose code.\n\nIn order to make it easier to use some of the more\
    \ common AIR and Flash Player APIs from within JavaScript, Adobe has created a\
    \ JavaScript include file, named AIRAliases.js. This file, which can be found\
    \ in the frameworks directory of the SDK, provides aliases for commonly used APIs\
    \ to make them more convenient to use from within JavaScript.\n\nTo use the aliases\
    \ file, copy it from the SDK to your application directory (make sure to also\
    \ package it in your AIR file). You then include it within your application using\
    \ the script tag in each HTML document that you want to leverage the aliases in.\n\
    \nFor example, let's look at the earlier example that writes a file to the desktop,\
    \ but uses the JavaScript aliases provided in the AIRAliases.js file instead of\
    \ typing out the complete package paths:\n\n```\n<script src=\"AIRAliases.js\"\
    ></script>\n\n<script type=\"text/javascript\">\n    function writeFile()\n  \
    \  {\n        var desktop = air.File.desktopDirectory;\n        var file = desktop.resolve(\"\
    output.txt\");\n        var fileStream = new air.FileStream();\n        fileStream.open(file,\
    \ air.FileMode.WRITE);\n        fileStream.writeUTFBytes(\"Hello World\");\n \
    \       fileStream.close();\n    }\n</script>\n```\n\nFirst, notice that the code\
    \ is much less verbose. This is because instead of having to reference APIs via\
    \ window.runtime and then their complete package path, we can use the aliases\
    \ within the include file.\n\nFor example, this reduces:\n\n```\nvar desktop =\
    \ window.runtime.flash.filesystem.File.desktopDirectory;\n```\n\nto:\n\n```\n\
    var desktop = air.File.desktopDirectory;\n```\n\nSecond, the AIR and Flash Player\
    \ APIs are placed in a namespace called air. If you open the AIRAliases.js file,\
    \ you can see how the aliases actually work. For example, here is the code that\
    \ sets up the File API aliases:\n\n```\nvar air; if (!air) air = {};\n\n// file\n\
    air.File = window.runtime.flash.filesystem.File;\nair.FileStream = window.runtime.flash.filesystem.FileStream;\n\
    air.FileMode = window.runtime.flash.filesystem.FileMode;\n```\n\nTo see a complete\
    \ list of APIs included, open up the *AIRAliases.js* file with a text editor.\
    \ While not all APIs are included, you can easily add additional APIs by following\
    \ the existing examples in the file.\n\n## Leveraging Compiled ActionScript Libraries\n\
    \nNot only can AIR applications leverage Flash Player APIs directly from JavaScript,\
    \ they can also access compiled ActionScript 3 libraries from within JavaScript.\n\
    \nIn addition to loading external JavaScript files, the HTML script tag within\
    \ an AIR application also has support for loading compiled ActionScript 3 libraries\
    \ and providing access to the ActionScript classes included within the file. Once\
    \ the SWF is loaded, the APIs can be referenced in the same manner as the AIR\
    \ and Flash Player APIs are referenced via the API package path and API name.\n\
    \n> TIP\n\nThis technique works only with ActionScript 3 libraries.\n\nLet's look\
    \ at an example. Included in the Adobe AIR SDK is a SWF that contains the ActionScript\
    \ 3 Adobe AIR service connectivity API. While this example won't show how to use\
    \ that API, it will show how to access those APIs from within JavaScript.\n\n\
    > TIP\n\nAn example of how to use the Service Connectivity API is provided in\
    \ the cookbook section of Chapter 4.\n\nIn order for the example to work, you\
    \ must copy the *frameworks/servicemonitor.swf* file from the AIR SDK to your\
    \ application directory.\n\nAny classes and APIs available within the compiled\
    \ SWF will be made available via the window.runtime property. The API we want\
    \ to reference is in a class named ServiceMonitor in the air.net package.\n\n\
    Here's the code:\n\n```\n<script src=\"servicemonitor.swf\"></script>\n\n<script>\n\
    \    function onAppLoad()\n    {\n        var monitor = new runtime.air.net.ServiceMonitor();\n\
    \    }\n</script>\n```\n\nThis is a very simple example that shows how to load\
    \ compiled ActionScript libraries, and then access them from JavaScript. In this\
    \ case, we include the *servicemonitor.swf* file via the HTML script tag. This\
    \ file contains the compiled ActionScript 3 APIs for the air.net.ServiceMonitor\
    \ class.\n\nUsing this technique allows you to leverage third party ActionScript\
    \ APIs from within AIR applications via JavaScript.\n\n> TIP\n\nMost ActionScript\
    \ 3 libraries are distributed as zip-based SWC files. In order to use the libraries\
    \ within JavaScript, change the extension of the library from SWC to ZIP, unzip\
    \ them using a zip program, and then remove the library's SWF file contained within\
    \ the SWC.\n\nYou can then include the SWF within your application in the same\
    \ manner as demonstrated earlier.\n\nAt this point, you should have a good understanding\
    \ of the HTML and JavaScript environments within the Adobe Integrated Runtime,\
    \ as well as how to leverage AIR, Flash Player and third-party ActionScript 3\
    \ APIs directly from JavaScript. The rest of the book will use this knowledge\
    \ to show how to accomplish specific tasks from HTML and JavaScript applications\
    \ running within Adobe AIR.\n\n## AIR Mini-Cookbook\n\nThis chapter describes\
    \ solutions to common tasks when developing AIR applications. The solutions in\
    \ this chapter illustrate many concepts used in AIR application development, and\
    \ provide working HTML and JavaScript code that can be leveraged within your application.\n\
    \n> **NOTE**\n\nAll examples in this chapter assume you are using the `AIRAliases.js`\
    \ file.\n\n## Application Chrome\n\n### Adding Custom Controls\n\n**Problem**\n\
    \nYou want to create custom window chrome for your application and need the ability\
    \ for the user to close and minimize the application.\n\n**Solution**\n\nUse native\
    \ window APIs within Adobe AIR to hook up, minimize, and close button functionality.\n\
    \n### Discussion\n\nWhile Adobe AIR allows developers to completely define and\
    \ customize the application’s window chrome, it is important to remember that\
    \ the application is responsible for every type of windowing event that might\
    \ normally occur. This means connecting the various visual elements with their\
    \ respective operating system events.\n\nThe NativeWindow instance that represents\
    \ the main application window is not directly accessible from inside the main\
    \ HTML DOM. Using AIR APIs, an application can traverse outside of the HTML control,\
    \ out to the Stage, and get a reference to its NativeWindow instance. Once a reference\
    \ to the native window has been obtained, the appropriate methods can be called\
    \ to trigger the operating-system specific event (or vice versa). In the case\
    \ of being able to minimize the window, the application can use NativeWindow.minimize()\
    \ and NativeWindow.close() in the case of closing:\n\n```\nwindow.htmlControl.stage.window.minimize();\n\
    window.htmlControl.stage.window.close();\n```\n\nThe NativeWindow.close() event\
    \ does not necessarily terminate the application. If only one application window\
    \ is available, the application will terminate. If there are multiple windows,\
    \ they will close until only one window remains. Closing the last window terminates\
    \ the application.\n\n### application.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    utf-8\" ?>\n<application\n    xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\
    \n    appId=\"com.adobe.demo.html.CustomChrome\"\n    version=\"1.0 Beta\">\n\n\
    \    <name>Custom Chrome</name>\n    <title>Custom Chrome</title>\n\n    <rootContent\n\
    \        visible=\"true\"\n        transparent=\"true\"\n        systemChrome=\"\
    none\"\n        width=\"206\"\n        height=\"206\">\n        custom.html\n\
    \    </rootContent>\n\n</application>\n```\n\n### index.html\n\n```html\n<html>\n\
    <head>\n\n<title>Custom Window Controls</title>\n\n<style>\nbody {\n    background-image:\
    \ url( 'custom-chrome.gif' );\n    font-family: Verdana, Geneva, Arial, Helvetica,\
    \ sans-serif;\n    font-size: 12px;\n}\n\n#closer {\n    position: absolute;\n\
    \    width: 70px;\n    left: 68px;\n    top: 105px;\n}\n\n#minimize {\n    position:\
    \ absolute;\n    width: 70px;\n    left: 68px;\n    top: 75px;\n}\n\ntextarea\
    \ {\n    position: absolute;\n    left: 8px;\n    right: 8px;\n    bottom: 8px;\n\
    \    top: 36px;\n    border-color: #B3B3B3;\n}\n```"
