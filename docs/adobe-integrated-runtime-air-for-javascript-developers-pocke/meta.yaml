    ## 文件选择器\n\n## 浏览文件\n\n**问题**\n\n应用程序需要提示用户使用原生对话框从本地系统中选择一个要打开的文件。\n\n**解决方案**\n\
    \n`File` 类允许应用程序提示用户从本地系统中选择一个或多个特定类型的文件。\n\n**讨论**\n\n`File` 类提供了多种浏览方法，可以为指定的操作呈现原生对话框。对于浏览单个要打开的文件，合适的方法是\
    \ `File.browseForOpen()`。此方法接受一个必需的字符串参数作为对话框标题，以及一个可选的 `FileFilter` 对象数组。\n\n\
    `FileFilter` 对象允许应用程序过滤原生对话框中可查看的文件。此参数默认为 null，这允许用户选择他们通常有权访问的任何文件（即非隐藏文件）。应用程序可以根据需要提供任意数量的过滤器，方法是将多个\
    \ `FileFilter` 对象放入一个数组中，并将该数组作为第二个参数传递给 `File.browseForOpen();`\n\n**提示**\n如果您想使用\
    \ FileFilter 对象，必须使用来自 Flash 运行时的 Array 类，而不是 JavaScript 的 Array 类。\n\nFile 类上的所有浏览方法都不是静态的，因此，必须首先有一个对有效\
    \ File 对象的现有引用。当对话框显示时，该 File 对象引用所代表的目录将被默认选中：\n\n```javascript\nvar file = air.File.documentsDirectory;\n\
    var filters = new window.runtime.Array();\n\nfilters.push( new FileFilter( \"\
    Image Files\", \"*.jpg\" ) );\nfile.browseForOpen( file, filters );\n```\n\n当用户完成文件选择后，Adobe\
    \ AIR 将在发出请求的应用程序中触发一个事件。为了捕获该事件，应用程序必须事先注册一个事件监听器。触发的事件是 `Event.SELECT`，并将一个\
    \ `Event` 对象传递给处理程序：\n\n```javascript\nvar file = air.File.documentsDirectory;\n\
    var filters = new window.runtime.Array();\n\nfilters.push( new air.FileFilter(\
    \ \"Image Files\", \"*.jpg\" ) );\n\nfile.addEventListener( air.Event.SELECT,\
    \ doSelect );\nfile.browseForOpen( file, filters );\n\nfunction doSelect( event\
    \ )\n{\n    alert( file.nativePath );\n}\n```\n\n发送给处理程序的 `Event` 对象有一个有用的属性是\
    \ \"target\"，它包含对触发事件的 `File` 对象的引用。对话框操作本身没有返回值可以赋给一个 `File` 对象，因为触发事件的对象现在将持有对用户所选目录的引用。为此，持有一个类级别的或全局的\
    \ `File` 对象引用，甚至复用它，可能是有益的：\n\n```html\n<html>\n<head>\n<title>浏览文件</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n<script>\nvar\
    \ file = null;\n\nfunction doLoad()\n{\n    file = air.File.documentsDirectory;\n\
    \    file.addEventListener( air.Event.SELECT, doSelect );\n    \n    document.getElementById(\
    \ \"btnBrowse\" ).\n    addEventListener( \"click\", doBrowse );\n}\n\nfunction\
    \ doBrowse()\n{\n    var filters = new window.runtime.Array();\n    \n    filters.push(\
    \ new air.FileFilter( \"Image Files\", \"*.jpg\" ) );\n    file.browseForOpen(\
    \ \"选择照片\", filters );\n}\n\nfunction doSelect( event )\n{\n    var elem = document.createElement(\
    \ \"div\" );\n    \n    elem.innerText = file.nativePath;\n    document.body.appendChild(\
    \ elem );\n}\n</script>\n</head>\n<body onload=\"doLoad()\">\n\n<input id=\"btnBrowse\"\
    \ type=\"button\" value=\"浏览\" />\n\n</body>\n</html>\n```\n\n## 浏览多个文件\n\n**问题**\n\
    \n应用程序需要提示用户使用原生对话框从本地系统中选择多个文件。\n\n**解决方案**\n\n使用 `File.browseForOpenMultiple()`\
    \ API 向用户显示一个对话框，允许他们选择多个文件。\n\n**讨论**\n\n使用 `File` 类打开单个文件与打开多个文件的方式基本相同。在允许用户选择多个文件的情况下，合适的方法是\
    \ `File.browseForOpenMultiple()`。`File.browseForOpenMultiple()` 方法接受的两个参数与 `File.browseForOpen()`\
    \ 方法相同：一个用于对话框标题的字符串，以及一个 `FileFilter` 对象数组。\n\n一旦用户从对话框中选择了文件，就会广播 `FileListEvent.SELECT_MULTIPLE`\
    \ 事件。发送给处理程序的事件对象将是 `FileListEvent` 类型。`FileListEvent` 类包含一个 \"files\" 属性，该属性将是一个\
    \ `File` 对象数组，代表用户选择的文件：\n\n```javascript\nvar file = air.File.documentsDirectory;\n\
    \nfile.addEventListener( air.FileListEvent.SELECT_MULTIPLE,\ndoSelect );\n\nfunction\
    \ doSelect( event )\n{\n    for( var f = 0; f < event.files.length; f++ )\n  \
    \  {\n        ...\n    }\n}\n```\n\n以下是完整代码：\n\n```html\n<html>\n<head>\n\n<title>浏览多个文件</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\">\n</script>\n\n<script>\n\
    var file = null;\n\nfunction doLoad()\n{\n    file = air.File.documentsDirectory;\n\
    \    file.addEventListener( air.FileListEvent.SELECT_MULTIPLE,\n             \
    \              doSelect );\n\n    document.getElementById( \"btnBrowse\" ).\n\
    addEventListener( \"click\", doBrowse );\n}\n\nfunction doBrowse()\n{\n    var\
    \ filters = new window.runtime.Array();\n\n    filters.push( new air.FileFilter(\
    \ \"Image Files\", \"*.jpg\" ) );\n    file.browseForOpenMultiple( \"选择照片\", filters\
    \ );\n}\n\nfunction doSelect( event )\n{\n    var elem = null;\n    var name =\
    \ null;\n    var size = null;\n\n    for( var f = 0; f < event.files.length; f++\
    \ )\n    {\n        name = event.files[f].name;\n        size = Math.ceil( event.files[f].size\
    \ / 1000 );\n\n        elem = document.createElement( \"div\" );\n        elem.innerText\
    \ = name + \" (\" + size + \" KB)\";\n\n        document.body.appendChild( elem\
    \ );\n    }\n}\n</script>\n</head>\n<body onload=\"doLoad()\">\n\n<input id=\"\
    btnBrowse\" type=\"button\" value=\"浏览\" />\n\n</body>\n</html>\n```\n\n98 | 第四章：AIR\
