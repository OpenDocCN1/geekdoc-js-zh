    同样需要注意的是，AIR 的 Beta 1 版本并未包含全部功能，许多重要的 AIR 功能尚未被实现，和/或未包含在此构建版本中。


    以下是 Adobe AIR Beta 1 中包含的部分功能列表：


    -   Mac 支持（OS X 10.4.8 及以上版本；Intel 和 PPC 架构）

    -   Windows 支持（Windows XP 和 Windows Vista Home Ultimate 版）

    -   文件 I/O API

    -   SQLite 嵌入式数据库

    -   Flash Player 9 的全部功能，包括完整的网络协议栈

    -   窗口 API

    -   命令行工具（ADL 和 ADT）

    -   在 Flash 内容中嵌入 HTML

    -   顶级 HTML 应用程序

    -   ActionScript/JavaScript 脚本桥接

    -   Flex Builder 和 Flex 框架对 AIR 应用程序创作的支持

    -   应用程序命令行参数

    -   拖放支持

    -   丰富的剪贴板访问

    -   原生菜单 API（Beta 版中仅限 Mac）

    -   服务连接 API

    -   文件类型关联

    -   应用程序图标

    -   PDF 支持


    以下是计划在 Adobe AIR 1.0 中包含、但未包含在 Beta 1 中的功能的局部列表：


    -   右键单击和上下文菜单控制

    -   系统通知

    -   在 HTML 应用程序中嵌入 Flash 内容

    -   对更多版本 Microsoft Windows 的支持


    我们将重点介绍已知在未来构建版本中可能会更改的任何功能。


    ## Beta 版本意味着什么


    如前一节所述，Adobe AIR Beta 1 构建版本功能尚不完整，其中一些功能仅部分实现。因此，特定功能的实现或任何特定功能的可用性在 Beta 构建版本和
    1.0 版本之间可能会发生变化。


    这也适用于本书中的信息。本书是在 Beta 1 构建版本最终定稿的同时编写的，因此在本书完成与 Beta 构建版本最终定稿之间，某些 API 或功能可能已经发生变化的情况是可能的。这在
    API 名称方面尤其如此。如果某些内容未能像本书所述那样正常工作，请务必查阅在线文档，该文档将始终提供有关 Beta 1 API 的最新信息。


    您可以在以下地址找到有关 AIR 的最新信息和文档：


    ```

    http://www.adobe.com/go/air

    ```


    ## 本书的目标读者


    我们希望这本书适合您，但为了确保万无一失，让我们讨论一下我们所做的假设，以及本书所针对的开发者类型。


    ### 本书基于哪些假设？


    本书假设读者至少对使用 HTML 和 JavaScript 创建基于 HTML 的 Web 应用程序和内容有基本的熟悉。


    您应该熟悉 Web 技术，例如 HTML、JavaScript、Ajax 和 CSS，以及通用的 Web 开发概念。


    ### 本书适合谁


    本书适用于有兴趣利用 HTML 和 JavaScript 通过 Adobe AIR 构建和部署桌面应用程序的开发者。如果您没有任何使用 HTML 和 JavaScript
    开发的经验，那么我们建议您花一些时间熟悉这些技术。


    ### 本书不适合谁


    虽然可以使用 AIR 的 Beta 1 版本创建基于 Flash 和 Flex 的应用程序，但本书不会详细介绍以 Flash 和 Flex 为重点的 AIR
    应用程序开发。如果您是 Flash 或 Flex 开发者，并且有兴趣构建 AIR 应用程序，那么本书可以为您提供 AIR 及其功能的良好入门和概述，但您应该查阅
    AIR 网站上提供的 AIR 文档和文章，以获取更多以 Flash/Flex 为重点的讨论。您可能还想查看由 O''Reilly 出版的 *Adobe Apollo
    for Flex Developers Pocket Guide*，该书提供了以 Flex 为重点的 AIR 概述。


    ## 本书的结构


    本书包含以下章节和附录：


    第 1 章，*Adobe 集成运行时 (AIR) 简介*

    提供了 AIR 是什么以及它所针对的应用程序类型的概述。


    第 2 章，*AIR 开发入门*

    涵盖了启动 AIR 开发的提示，以及创建您的第一个 AIR 应用程序的步骤。


    第 3 章，*在 AIR 中使用 JavaScript 和 HTML*

    概述了 AIR 中的 HTML 和 JavaScript 运行时环境，并介绍了如何使用 JavaScript 来访问 AIR 功能和 API。


    第 4 章，*AIR 微型手册*

    以 O''Reilly Cookbook 的格式，提供了在 AIR 应用程序内完成常见任务的提示和技巧。


    附录 A，*AIR 命令行工具*

    列出了 AIR 特有的命令行工具及其使用选项。


    附录 B，*AIR JavaScript 别名*

    列出了 Adobe AIR API 的 JavaScript 别名


    ### 如何使用本书


    您既可以将本书作为 Adobe AIR 的入门和概述，也可以将其作为开始 AIR 应用程序开发的分步指南。虽然直接跳到特定部分可能很诱人，但强烈建议您至少阅读前两章，这两章提供了
    AIR 的概述，并讨论了如何设置开发环境以构建 AIR 应用程序。


    这将使您更容易随后深入了解您感兴趣的 AIR 功能的特定领域。


    一旦您通读了本书并了解了如何使用 HTML 和 JavaScript 构建 AIR 应用程序的基础知识，那么您可以将本书用作参考，在需要了解如何解决特定问题时参考特定章节。特别是，Cookbook
    部分在您开发 AIR 应用程序时应证明非常有用。


    最后，本书只是 AIR 的入门，没有涵盖其包含的所有功能和功能。它的目的是补充，而不是替代，Adobe 提供的广泛而深入的 AIR 文档。请务必探索 AIR
    文档，以确保您熟悉本书未涵盖的所有 API 和功能。


    ## 本书中使用的约定


    本书中使用了以下排版约定：


    **纯文本**

    表示菜单标题、菜单选项、菜单按钮和键盘快捷键（例如 Alt 和 Ctrl）。


    *斜体*

    表示新术语、URL、电子邮件地址、文件名、文件扩展名、路径名、目录和 Unix 实用程序。


    `等宽字体`

    表示命令、选项、开关、变量、属性、键、函数、类型、类、命名空间、方法、模块、属性、参数、值、对象、事件、事件处理程序、XML 标签、HTML 标签、宏、文件内容或命令的输出。


    **等宽粗体**

    显示用户应按字面意思输入的命令或其他文本。


    *等宽斜体*

    显示应替换为用户提供的值的文本。


    ## 许可和代码示例


    本作品，包括所有文本和代码示例，均根据知识共享署名-非商业性使用-相同方式共享 3.0 许可证进行许可。


