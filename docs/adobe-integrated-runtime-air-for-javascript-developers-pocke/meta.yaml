    \    directory.addEventListener( air.Event.SELECT,\n                         \
    \      doSelect );\n\n    document.getElementById( \"btnBrowse\" ).\naddEventListener(\
    \ \"click\", doBrowse );\n}\n\nfunction doSelect( event )\n{\n    var files =\
    \ directory.listDirectory();\n    var elem = null;\n    var name = null;\n   \
    \ var mod = null;\n    var size = null;\n\n    for( var f = 0; f < files.length;\
    \ f++ )\n    {\n        name = files[f].name;\n\n        mod = files[f].modificationDate;\n\
    \        mod = ( mod.month + 1 ) + \"/\" +\n              mod.date + \"/\" +\n\
    \              mod.fullYear;\n\n        size = Math.ceil( files[f].size / 1000\
    \ ) + \" KB\";\n\n        elem = document.createElement( \"div\" );\n        elem.innerText\
    \ = name + \" 是 \" +\n    size + \"，最后修改于 \" +\n    mod;\n\n        document.body.appendChild(\
    \ elem );\n    }\n}\n</script>\n</head>\n<body onload=\"doLoad()\">\n\n<input\
