    # APPENDIX A


    # AIR Command-Line Tools


    The AIR SDK provides the following command-line tools:


    +   **ADL**

    Use this tool to launch and test an AIR application without having to install
    it.


    **ADT**

    Use this tool to package an AIR application into a redistributable AIR file.


    This Appendix lists the options for each of the command-line tools.


    For an example of using these tools, see Chapter 2.


    # ADL


    ADL is a command-line tool that launches an AIR application, based on its application
    descriptor file, without requiring that the application be installed. This is
    useful for testing and debugging the application.


    Typically, you want to call the ADL tool passing one parameter: the path to the
    application descriptor file (the application .xml file):


    ```

    adl application.xml

    ```


    The full syntax of the ADL command is:


    ```

    adl ( -runtime <path-to-runtime-dir> )? <path-to-app-xml>

    <path-to-root-dir>? ( -- ... )?

    ```'
- md: "Table A-1 provides a description of the command-line arguments for ADL.\n\n\
    Table A-1. ADL command-line arguments\n\n| Option | Description |\n|---|---|\n\
    | -runtime | Optional argument that specifies the directory that contains the\
    \ AIR runtime that should be used. |\n| path-app-xml | The application descriptor\
    \ file for the application that should be launched. |\n| path-to-root-dir | Optional\
    \ argument that specifies the directory that contains the application descriptor\
    \ file |\n| -- | Any arguments specified after this argument will be passed to\
    \ the application as startup/command-line arguments, and can be accessed from\
    \ the application via the InvokeEvent |\n\n## ADT\n\nADT is a command-line tool\
    \ that packages AIR applications into redistributable AIR files. AIR can then\
    \ install the AIR application from that AIR file.\n\nTypically, you want to call\
    \ the ADT tool in the following way:\n\n```\nadt -package HelloWorld.air application.xml\
    \ HelloWorld.swf\n```\n\nIn this example, the ADT tool creates an AIR file named\
    \ *HelloWorld.air* based on the *application.xml* application descriptor file.\n\
    \nThe syntax of the ADT command is:\n\n```\nadt -package <air-file> <app-xml>\
    \ <fileOrDir>* ( -C <dir> <fileOrDir>+ )*\n```\n\nTable A-2 shows the command-line\
    \ options for ADT.\n\nTable A-2. Command-line options for ADT\n\n| Option | Description\
    \ |\n| :--- | :--- |\n| -package | The first argument must be -package. |\n| air-file\
    \ | The relative or absolute path to the AIR to be created by ADT. |\n| app-xml\
    \ | The relative or absolute path to the application descriptor file for the application.\
    \ |\n| fileOrDir | One or more file or directory names identifying other files\
    \ to be included in the package. Each successive file or directory name should\
    \ be separated by a space. If a directory name is specified, then all of the files\
    \ in that directory and its subdirectories will be included. However, files that\
    \ are marked hidden in the file system will be ignored. If any of the files listed\
    \ is the same as the file specified in the <app-xml> parameter, then it will be\
    \ ignored; it will not be added to the package file a second time. These files\
    \ and directories will be copied into the application install directory when the\
    \ application is installed. |\n| -C <dir> | This changes the root directory path\
    \ for subsequent files or directories listed in the command line. |\n\n## APPENDIX\
