    # 前言


    本书提供了对 Adobe 集成运行时 (AIR) 公开 Beta 1 版本应用开发的快速入门介绍。AIR 在 Beta 版之前以其代号 Apollo 被人所知，是
    Adobe 正在开发的一个新的跨平台桌面应用程序运行时。虽然 Adobe AIR 允许基于 Flash 和 HTML 的应用开发，但本书专注于使用 HTML
    和 JavaScript 构建 AIR 应用程序。


    本书概述了 Adobe AIR，展示了如何设置你的开发环境，并讨论了新的 AIR 功能和 API。读完本书后，你应该对 AIR 是什么以及如何为其构建 HTML
    和 JavaScript 应用程序有一个很好的理解。


    ## AIR 运行时命名约定


    Adobe AIR 允许开发人员利用众多 Web 技术将 Web 应用程序部署到桌面。实际上，技术如此之多，以至于很难全部记住。表 P-1 列出了本书中使用的术语，并对每个术语进行了定义：


    ## 表 P-1. AIR 运行时命名约定


    | 名称 | 含义 |

    | --- | --- |

    | Adobe 集成运行时 (AIR) | 支持运行 AIR 应用程序的跨平台桌面运行时。 |

    | AIR 应用程序 | 在 Adobe AIR 之上运行的，使用 Flash、HTML 和/或 PDF 构建的应用程序。 |

    | Flash | 包含在 SWF 9 文件格式中，可在 Flash Player 或 AIR 中运行的任何内容。 |

    | ActionScript | 用于编程 Flash 内容的基于 ECMAScript 的编程语言。除非另有说明，本书中所有对 ActionScript
    的引用均指 ActionScript 3。 |

    | HTML | 用于创建和布局网页的标准基于 Web 的标记语言。 |

    | JavaScript | 用于编程 HTML 应用程序中内容的基于 Web 的 ECMAScript 实现。 |

    | PDF | 便携式文档格式的缩写，一种允许电子文档无缝分发和显示的技术。 |

    | Flex 框架 | 一个基于 XML 和 ActionScript 的框架，旨在使开发基于 Flash 的富 Internet 应用程序变得简单。 |

    | Flex Builder | 一个基于 Eclipse 的 IDE，用于使用 Flex 和 ActionScript 构建基于 Flash 的富 Internet
    应用程序。 |


    ## 本书涵盖内容


    本书概述了 Adobe AIR，展示了如何设置你的开发环境以开始构建应用程序，概述了 AIR 中的 HTML 和 JavaScript 引擎，并展示了如何在
    AIR 中执行许多常见的编程任务。


    一般来说，Beta 构建版本中已有的功能和特性相对稳定，不应发生根本性变化（尽管可能会根据开发人员的反馈进行微调）。围绕未实现功能和特性的任何讨论细节则更具不确定性，并可能在未来的构建版本中发生变化。

