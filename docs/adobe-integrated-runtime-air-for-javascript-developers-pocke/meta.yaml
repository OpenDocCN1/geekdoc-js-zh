    on WebKit.


    # ### Open project


    Adobe knew from the very beginning that it did not want to create and maintain
    its own HTML rendering engine. Not only would this be an immense amount of work,
    but it would also make it difficult for developers, who would then have to become
    familiar with all of the quirks of yet another HTML engine.


    WebKit provides Adobe AIR with a full-featured HTML engine that is under continuous
    development by a robust development community that includes individual developers
    as well as large companies such as Nokia and Apple. This allows Adobe to focus
    on bug fixes and features, and also means that Adobe can actively contribute back
    to WebKit, while also taking advantage of the contributions made by other members
    of the WebKit project.'
  - '[PAGE 66]


    # Proven technology that web developers know


    As discussed earlier, one of the biggest problems with complex web application
    development is ensuring that content works consistently across browsers. While
    something may work perfectly in Firefox on the Mac, it may completely fail in
    Internet Explorer on Windows. Because of this, testing and debugging browser-based
    content can be a nightmare for developers.


    Adobe wanted to ensure that developers were already familiar with the HTML engine
    used within Adobe AIR, so they did not have to learn all of the quirks and bugs
    of a new engine. Since Safari (which is built on top of WebKit) is the default
    browser for Mac OS X (and is also available on Windows), developers should be
    familiar with developing for WebKit.


    # Minimum effect on AIR runtime size


    The target size for Adobe AIR is between 5 and 9 MB. The WebKit code base was
    well-written and organized and has had a minimal impact on the final AIR runtime.


    # Proven ability to run on mobile devices


    While the first release of Adobe AIR runs only on personal computers, the long-term
    vision is to extend Adobe AIR from the desktop to cell phones and other devices.
    WebKit has a proven ability to run on such devices and has been ported to cell
    phones by both Nokia and Apple.


    # JavaScript Within AIR


    Adobe AIR has full support for JavaScript within HTML content. JavaScript 1.5,
    which corresponds to ECMA-262 is supported.


    The JavaScript engine is implemented via WebKit, and works the same as it does
    within WebKit-based browsers. In addition'
  - '[PAGE 67]


    to having access to the HTML DOM, JavaScript can also access AIR and Flash Player
    APIs directly via the window. runtime property. This will be discussed in more
    detail later.


    TIP


    For an in-depth introduction and discussion of JavaScript, check out JavaScript:
    the Definitive Guide: 5th Edition, published by O''Reilly: http://www.oreilly.com/catalog/jscript5/


    # AIR Implementation of Functionality


    HTML and JavaScript functionality is consistent with that found in other WebKit-based
    projects and browsers, such as Apple''s Safari browser. When exploring documentation
    on HTML engine / browser functionality, you can use references to the Safari browser
    as an indicator of the functionality available within the HTML environment within
    AIR.


    However, because the HTML engine is running in a runtime, and not a browser, there
    are a few differences that are useful to understand before beginning development
    with HTML and JavaScript within Adobe AIR.


    # Cookies


    The Adobe Integrated Runtime has full support for setting and getting cookies
    from HTML-based content. Cookie support is implemented via the operating system''s
    networking stack. This means that AIR applications can share cookies set by any
    browser or application that also leverage the operating system stack.


    For example. AIR applications can share cookies set through Internet Explorer
    on Windows, and Safari on Mac, as they both also use the operating system''s cookie
    storage functionality. Firefox implements its own cookie storage and thus'
  - '[PAGE 68]


    cookies set within Firefox cannot be shared with AIR applications.


    > **TIP**


    In addition to cookies, AIR applications have a number of other APIs that can
    be used for persistent data, including the file API, as well as the embedded database
    API.


    # Windowing


    # Windows


    You can create new windows via JavaScript just as you can within the browser.


    ```

    myWindow = window.open("Window.html", "myWindow", "height=400,width=400");

    ```


    However, the runtime property which provides access to AIR and Flash Player APIs
    is not automatically available within the new window. In order to make it available,
    you must explicitly place it within the scope of the new window like so:


    ```

    window.runtime = window.opener.runtime;

    ```


    > **TIP**


    Full support of native windows is not available within the Beta. Only APIs available
    from JavaScript have been implemented.


    # Dialogs


    HTML dialogs are also supported within AIR applications, although not all have
    been implemented within the Beta.


    | Dialog | Supported in Beta |

    |---|---|

    | alert | yes |

    | confirm | yes |

    | prompt | no |'
  - "[PAGE 69]\n\nIn addition, the file-browsing dialog created via:\n\n```\n<input\
    \ type=\"file\" />\n```\n\nis not currently supported within the Beta.\n\nAny\
    \ dialogs not currently supported in the Beta, will be supported in the 1.0 release.\n\
    \n# XMLHttpRequest and Ajax\n\nThe `XMLHttpRequest` object, which enables the\
    \ use of Ajax techniques for sending and loading data, is completely supported\
    \ within AIR applications.\n\nOne advantage to developing Ajax applications within\
    \ Adobe AIR versus the browser, is that because you have a consistent runtime\
    \ to target across operating systems, you do not have to worry about cross-browser,\
    \ platform inconsistencies in how the API is implemented.\n\nThe primary benefit\
    \ of this is that you have to write only one version of the code.\n\nHere's a\
    \ simple example of an XMLHttpRequest object call within an AIR application that\
    \ works regardless of which operating system the application is running on:\n\n\
    ```\n<script type=\"text/javascript\">\n    var xmlhttp;\n    function appLoad()\n\
    \    {\n        //replace with URL to resource being loaded\n        var url =\
    \ \"http://www.mikechambers.com/blog/\";\n        xmlhttp = new XMLHttpRequest();\n\
    \        xmlhttp.open(\"GET\", url, true);\n\n        xmlhttp.onreadystatechange=function(){\n\
    \            if (xmlhttp.readyState==4)\n            {\n                runtime.trace(xmlhttp.responseText);\n\
    \            }\n        }\n    }</script>\n```"
  - '[PAGE 70]


    ```

    xmlhttp.send(null)

    }

    </script>

    ```


    When called, this function uses the XMLHttpRequest object to load the specified
    URL and prints its contents out to the command line. The main thing to note in
    this example is that because the runtime is known and it is consistent across
    operating systems, you do not have to detect the existence of—or differences in—the
    implementation of XMLHttpRequest as you would when deploying in the browser.


    Both synchronous and asynchronous XMLHttpRequest calls are supported, as is loading
    data across domains.


    # URI Schemes


    Working with Universal Resource Identifiers (URIs) within HTML content in AIR
    applications is largely the same as working with URIs within the browser. This
    section gives a quick overview of working with URIs within HTML content in AIR
    applications, and introduces some new URIs made available by the runtime.


    # Supported URI schemes


    Adobe AIR provides support for the most common URI schemes available within the
    browser (Table 3-1).'
  - '[PAGE 71]


    # Table 3-1. Supported URI schemes


    | URI scheme | Description |

    |---|---|

    | http:// | URI that points to a resource accessed via the standard HTTP protocol.
    This is fully supported within Adobe AIR. |

    | https:// | URI that points to a resource accessed via a protocol encrypted with
    SSL/TLS. This is fully supported within Adobe AIR. |

    | file:// | URI that points to a resource on the local or a networked file system.
    |

    | ftp:// | URI that points to a resource accessed with the FTP protocol. In the
    Adobe AIR Beta, requests for files will work correctly, while requests for directories
    return an empty page with no directory listing. |


    # Unsupported URI schemes


    In the Beta build of Adobe AIR, the commonly used *mailto://* and *feed://* URI
    schemes are not available.


    At the time that the book was written, it had not yet been determined whether
    and/or how these URI schemes would be available for the 1.0 release.


    # AIR URI Schemes


    Adobe AIR provides a number of additional URIs that make it easy to reference
    files and content within specific areas of the users system (Table 3-2).


    # Table 3-2. Adobe AIR URI schemes


    | URI | Description |

    |---|---|

    | *app-resource:/* | Provides a reference to the root content directory of the
    application. This should be used when referencing content included within the
    AIR file. |

    | *app-storage:/* | Provides a reference to an application-specific storage area
    on the user''s system. This area is useful for storing user-specific application
    settings and content. |


    Here is a simple example of the app-resource AIR URI:


    `app-resource:/foo/test.html`


    This references a file name *test.html* in the *foo* directory that was installed
    with the application.'
- md: "## Relative URLs\n\nYou're not restricted to using just absolute URLs within\
    \ AIR applications. You can also use relative URLs, but it is important to remember\
    \ that relative URLs within AIR applications are relative to the application,\
    \ and not to a server (as they would be when doing traditional browser-based client/server\
    \ development).\n\nRelative URLs will be relative to the root of the application,\
    \ and will resolve to the `app-resource:/` URI.\n\nFor example:\n\n```\n<img src=\"\
    foo/image.png\" />\n```\n\nwill resolve to:\n\n```\n<img src=\"app-resource:/foo/image.png\"\
    \ />\n```\n\nYou should keep this in mind when moving web and browser-based content\
    \ and code into an AIR application.\n\n## Security\n\nThis section discusses a\
    \ number of differences in the security model implementations in the Adobe AIR,\
    \ versus that in the browser.\n\n### Security Context\n\nContent installed within\
    \ the application runs under the security context of the application. This means\
    \ that it has access to all of the Adobe AIR APIs and functionality.\n\nRemote\
    \ content loaded into the application is run under a web security context, and\
    \ as such does not have access to the Adobe AIR APIs and functionality, or to\
    \ the expanded privileges to which application content has access.\n\nFor example,\
    \ content loaded into the application via:\n\n`app-resource://foo.html`\n\nhas\
    \ full access to the AIR APIs. However, content loaded using HTTP, like so:\n\n\
    `http://www.yourdomain.com/foo.html`\n\nruns in a web security context, and does\
    \ not have access to AIR APIs.\n\nContent in the application install directory\
    \ falls under the application security context. Content in the application storage\
    \ directory (`app-storage:/`) falls under the web security context (Table 3-3).\n\
    \n*Table 3-3. Application and web security contexts*\n\n| URL data loaded from\
    \ | Has access to AIR APIs? |\n| :--- | :--- |\n| `app-resource://foo.html` |\
    \ Yes |\n| `app-storage://foo.html` | No |\n| `http://www.anydomain.com/foo.html`\
    \ | No |\n| `https://www.anydomain.com/foo.html` | No |\n| `file://C/foo.html`\
    \ | No |\n| `ftp://www.anydomain.com/foo.html` | No |\n\nBecause of this, content\
    \ downloaded from third party sources and domains should always be placed in the\
    \ `app-storage:/` directory, and not in the `app-resource:/` directory in order\
    \ to prevent inadvertent elevation of security context and privileges.\n\n###\
    \ Cross domain data loading\n\nThe Adobe Integrated Runtime does not enforce cross\
    \ domain data loading restrictions for application content. Among other things,\
    \ this allows the loading of data across domains using the `XMLHttpRequest` object.\n\
    \nCross domain data loading restrictions are enforced for non-privileged web content.\n\
    \n### Using JavaScript Frameworks\n\nBecause the HTML environment within the Adobe\
    \ Integrated Runtime has full support for JavaScript, you can use virtually any\
    \ JavaScript framework to build your application. However, when using frameworks,\
    \ there are a couple of things to keep in mind:\n\n- The framework should be included\
    \ within your application's AIR file, in order to ensure that it is available\
    \ offline.\n- If the framework expects to load resources from a central server,\
    \ you may have to test to make sure that relative URLs continue to work.\n- While\
    \ it is possible to load the framework from the network at runtime, this can lead\
    \ to slower application startup performance, as well as an inability for the application\
    \ to work when offline.\n\nYou can find a number of HTML-based AIR applications\
    \ and their source built using the EXT-JS framework from the Adobe Labs AIR site\
    \ at:\n\nhttp://www.adobe.com/go/airwiki\n\n> **TIP**\n\nYou can find more information\
    \ on the EXT-JS framework at http://extjs.com/.\n\n### Accessing AIR APIs from\
    \ JavaScript\n\nIn addition to the standard JavaScript and HTML DOM APIs, JavaScript\
    \ code running within the application context in an AIR application can also take\
    \ advantage of APIs provided by the runtime, as well as Flash Player APIs and\
    \ even ActionScript 3 libraries. This greatly extends the capabilities of JavaScript\
    \ over the APIs available in the browser, and includes functionality such as:\n\
    \n- Playing sounds\n- Manipulating images and bitmaps\n- Reading and writing files\
    \ to and from the local file system\n- Creating, controlling and manipulating\
    \ native windows\n- Making direct socket connections (both binary and text based)\n\
    - Accessing the clipboard\n- Leveraging an embedded database to store data\n\n\
    > **TIP**\n\nYou can find examples of how to leverage these features in the cookbook\
    \ section in Chapter 4.\n\nThis section discusses how to leverage AIR and Flash\
    \ Player APIs from JavaScript, as well as how to load and leverage compiled ActionScript\
    \ libraries from within JavaScript.\n\n## Accessing AIR and Flash Player APIs\n\
    \nMost AIR and Flash Player APIs are contained within packages (similar to how\
    \ many JavaScript frameworks leverage namespaces and packages). This helps organize\
    \ the APIs, and also reduces the possibility of naming conflicts. When accessing\
    \ AIR and Flash Player APIs directly from JavaScript, you must do so via their\
    \ complete package path and name.\n\nAs discussed earlier, all AIR and Flash Player\
    \ APIs are made available via the `window.runtime` property. The `runtime` property\
    \ is at the root of the runtime environment, and all APIs are relative to this\
    \ root.\n\nFor example, to access an API which is not contained within a package,\
    \ such as `trace()` you reference it directly from the `runtime` property, like\
    \ so:\n\n```\nwindow.runtime.trace(\"foo\");\n```\n\nHowever, if you want to access\
    \ an API that is contained within a package, you must prepend the package path\
    \ to the API. For example, to access the amount of memory currently used by the\
    \ application, you can call the `totalMemory` Flash Player property that is in\
    \ the `flash.system.System` class. To call this API from JavaScript:\n\n```\n\
    var mem = window.runtime.flash.system.System.totalMemory;\n```\n\nThis also applies\
    \ when creating new instances of an API class from within JavaScript:\n\n```\n\
    var file = new window.runtime.flash.filesystem.File();\n```\n\nThis code creates\
    \ a new `File` instance that can be used to work with the file system.\n\nHere\
    \ is a complete example that shows how to write a file named `output.txt` to the\
    \ user's desktop:\n\n```\n//call a static property\nvar desktop = window.runtime.flash.filesystem.File.desktopDirectory;\n\
    //call a function on an instance of a class\nvar file = desktop.resolve(\"output.txt\"\
    );\n\n//create a new instance of a class using new\nvar fileStream = new window.runtime.flash.filesystem.FileStream();\n\
    \n    //call a function, passing arguments\n    fileStream.open(file, window.runtime.flash.filesystem.FileMode.WRITE);\n\
    \n    fileStream.writeUTFBytes(\"Hello World\");\n    fileStream.close();\n```\n\
    \nDon’t worry too much about what the code is doing in this example, but rather\
    \ focus on how the AIR APIs are called from JavaScript.\n\nThis allows you to\
    \ leverage virtually any AIR or Flash Player API from within JavaScript.\n\n>\
    \ **TIP**\n\nDownload JavaScript specific language references for AIR from the\
    \ Adobe web site at: http://www.adobe.com/go/air.\n\nBy remembering how to use\
    \ the package structure to call APIs, you can leverage all AIR, Flash Player and\
    \ ActionScript APIs even if JavaScript-specific documentation is not provided.\n\
    \n## Working with AIR and Flash Player Events\n\nMany of the AIR and Flash Player\
    \ APIs make extensive use of events. Event handling in ActionScript-based APIs\
    \ is based on the W3C DOM Level 3 event model. This is similar to the W3C DOM\
    \ Level 2 event model available within JavaScript, but is very different from\
    \ the callback mechanism often deployed in JavaScript.\n\nIn order to be notified\
    \ when an event from an AIR or Flash Player API occurs, you must register to listen\
    \ for it. The best way to understand this is to look at an example. The following\
    \ example registers for a NETWORK_CHANGE event that is broadcast by the Shell\
    \ class:\n\n```\nfunction onNetworkChange(event)\n{\n    runtime.trace(\"Network\
    \ status changed\");\n}\n\nfunction onAppLoad()\n{\n    window.runtime.flash.system.Shell.shell.addEventListener(\n\
    \        window.runtime.flash.events.Event.NETWORK_CHANGE,\n        onNetworkChange);\n\
    }\n```\n\nAs you can see from the example, you register for events broadcast by\
    \ a class instance by calling the `addEventListener` function on the class instance.\
    \ This API requires two arguments.\n\nThe first argument is the event name of\
    \ the event being broadcast. For all AIR and Flash Player APIs, there will be\
    \ a constant for the event name, which you can find in the documentation.\n\n\
    The second argument is a reference to the function that will handle the event.\
    \ In this case, the function is named `onNetworkChange`. Looking at the function,\
    \ you can see that it is passed an argument with information about the event.\
    \ Again, all AIR and Flash Player APIs will pass an object to the event handler\
    \ function, which provides information about the event. You can find the exact\
    \ type of event object passed to the handler, and the information it provides,\
    \ by referencing the API documentation.\n\n## Using AIRAliases.js\n\nAs the previous\
    \ examples show, being able to leverage AIR and Flash Player APIs from directly\
    \ within JavaScript can be very powerful. However, because you must reference\
    \ the"
  mdcn: "\n## 相对 URL\n\n在 AIR 应用程序中，您不仅可以使用绝对 URL。您也可以使用相对 URL，但重要的是要记住，AIR 应用程序中的相对\
    \ URL 是相对于应用程序本身的，而不是相对于服务器（正如在传统的基于浏览器的客户端/服务器开发中那样）。\n\n相对 URL 将相对于应用程序的根目录，并将解析为\
    \ `app-resource:/` URI。\n\n例如：\n\n```\n<img src=\"foo/image.png\" />\n```\n\n\
    将解析为：\n\n```\n<img src=\"app-resource:/foo/image.png\" />\n```\n\n在将基于 Web 和浏览器的内容及代码迁移到\
    \ AIR 应用程序时，您应牢记这一点。\n\n## 安全性\n\n本节讨论 Adobe AIR 中的安模型实现与浏览器中的安模型实现之间的若干差异。\n\n\
    ### 安全上下文\n\n在应用程序内安装的内容在应用程序的安全上下文中运行。这意味着它可以访问所有 Adobe AIR API 和功能。\n\n加载到应用程序中的远程内容在\
    \ Web 安全上下文中运行，因此无法访问 Adobe AIR API 和功能，也无法访问应用程序内容所具有的扩展权限。\n\n例如，通过以下方式加载到应用程序中的内容：\n\
    \n`app-resource://foo.html`\n\n拥有对 AIR API 的完全访问权限。但是，使用 HTTP 加载的内容，如下所示：\n\n\
    `http://www.yourdomain.com/foo.html`\n\n在 Web 安全上下文中运行，无法访问 AIR API。\n\n位于应用程序安装目录中的内容属于应用程序安全上下文。位于应用程序存储目录（`app-storage:/`）中的内容属于\
    \ Web 安全上下文（表 3-3）。\n\n*表 3-3. 应用程序和 Web 安全上下文*\n\n| 加载 URL 数据的来源 | 是否有权访问 AIR\
    \ API？ |\n| :--- | :--- |\n| `app-resource://foo.html` | 是 |\n| `app-storage://foo.html`\
    \ | 否 |\n| `http://www.anydomain.com/foo.html` | 否 |\n| `https://www.anydomain.com/foo.html`\
    \ | 否 |\n| `file://C/foo.html` | 否 |\n| `ftp://www.anydomain.com/foo.html` | 否\
    \ |\n\n因此，从第三方来源和域下载的内容应始终放置在 `app-storage:/` 目录中，而不是 `app-resource:/` 目录中，以防止无意中提升安全上下文和权限。\n\
    \n### 跨域数据加载\n\nAdobe Integrated Runtime 不对应用程序内容强制执行跨域数据加载限制。除其他外，这允许使用 `XMLHttpRequest`\
    \ 对象跨域加载数据。\n\n非特权 Web 内容会强制执行跨域数据加载限制。\n\n### 使用 JavaScript 框架\n\n由于 Adobe Integrated\
    \ Runtime 中的 HTML 环境完全支持 JavaScript，您几乎可以使用任何 JavaScript 框架来构建应用程序。但是，在使用框架时，有几点需要记住：\n\
    \n- 框架应包含在您的应用程序的 AIR 文件中，以确保在离线时可用。\n- 如果框架需要从中央服务器加载资源，您可能需要进行测试以确保相对 URL 仍然有效。\n\
    - 虽然可以在运行时从网络加载框架，但这可能导致应用程序启动性能较慢，以及在离线时无法工作。\n\n您可以从 Adobe Labs AIR 网站找到许多基于\
    \ HTML 的 AIR 应用程序及其使用 EXT-JS 框架构建的源代码：\n\nhttp://www.adobe.com/go/airwiki\n\n\
    > **提示**\n\n您可以在 http://extjs.com/ 找到有关 EXT-JS 框架的更多信息。\n\n### 从 JavaScript 访问\
    \ AIR API\n\n除了标准的 JavaScript 和 HTML DOM API 之外，在 AIR 应用程序的应用程序上下文中运行的 JavaScript\
    \ 代码还可以利用运行时提供的 API，以及 Flash Player API，甚至 ActionScript 3 库。这极大地扩展了 JavaScript\
    \ 相对于浏览器中可用 API 的能力，包括诸如：\n\n- 播放声音\n- 操作图像和位图\n- 在本地文件系统上读写文件\n- 创建、控制和操作原生窗口\n\
    - 进行直接套接字连接（二进制和基于文本）\n- 访问剪贴板\n- 利用嵌入式数据库存储数据\n\n> **提示**\n\n您可以在第 4 章的实践部分找到如何利用这些功能的示例。\n\
    \n本节讨论如何从 JavaScript 中利用 AIR 和 Flash Player API，以及如何从 JavaScript 中加载和利用已编译的 ActionScript\
    \ 库。\n\n## 访问 AIR 和 Flash Player API\n\n大多数 AIR 和 Flash Player API 都包含在包中（类似于许多\
    \ JavaScript 框架利用命名空间和包的方式）。这有助于组织 API，并减少命名冲突的可能性。当从 JavaScript 直接访问 AIR 和 Flash\
    \ Player API 时，必须通过其完整的包路径和名称进行访问。\n\n如前所述，所有 AIR 和 Flash Player API 都通过 `window.runtime`\
    \ 属性提供。`runtime` 属性位于运行时环境的根部，所有 API 都相对于此根目录。\n\n例如，要访问不包含在包中的 API，如 `trace()`，您直接从\
    \ `runtime` 属性引用它，如下所示：\n\n```\nwindow.runtime.trace(\"foo\");\n```\n\n但是，如果您想访问包含在包中的\
    \ API，必须将包路径前置到 API。例如，要访问应用程序当前使用的内存量，您可以调用 `flash.system.System` 类中的 `totalMemory`\
    \ Flash Player 属性。要从 JavaScript 调用此 API：\n\n```\nvar mem = window.runtime.flash.system.System.totalMemory;\n\
    ```\n\n这同样适用于从 JavaScript 中创建新的 API 类实例：\n\n```\nvar file = new window.runtime.flash.filesystem.File();\n\
    ```\n\n此代码创建一个新的 `File` 实例，可用于处理文件系统。\n\n以下是一个完整示例，展示如何将名为 `output.txt` 的文件写入用户桌面：\n\
    \n```\n//call a static property\nvar desktop = window.runtime.flash.filesystem.File.desktopDirectory;\n\
    //call a function on an instance of a class\nvar file = desktop.resolve(\"output.txt\"\
    );\n\n//create a new instance of a class using new\nvar fileStream = new window.runtime.flash.filesystem.FileStream();\n\
    \n    //call a function, passing arguments\n    fileStream.open(file, window.runtime.flash.filesystem.FileMode.WRITE);\n\
    \n    fileStream.writeUTFBytes(\"Hello World\");\n    fileStream.close();\n```\n\
    \n不要过于担心此示例中代码的功能，而是关注如何从 JavaScript 调用 AIR API。\n\n这使您能够从 JavaScript 中利用几乎任何\
    \ AIR 或 Flash Player API。\n\n> **提示**\n\n从 Adobe 网站下载 AIR 的 JavaScript 专用语言参考：http://www.adobe.com/go/air。\n\
    \n通过记住如何使用包结构调用 API，即使没有提供 JavaScript 特定文档，您也可以利用所有 AIR、Flash Player 和 ActionScript\
    \ API。\n\n## 处理 AIR 和 Flash Player 事件\n\n许多 AIR 和 Flash Player API 广泛使用事件。基于 ActionScript\
    \ 的 API 中的事件处理基于 W3C DOM Level 3 事件模型。这类似于 JavaScript 中可用的 W3C DOM Level 2 事件模型，但与\
    \ JavaScript 中经常采用的回调机制非常不同。\n\n为了在 AIR 或 Flash Player API 的事件发生时得到通知，您必须注册监听它。理解这一点的最佳方式是查看一个示例。以下示例注册了一个由\
    \ Shell 类广播的 NETWORK_CHANGE 事件：\n\n```\nfunction onNetworkChange(event)\n{\n \
