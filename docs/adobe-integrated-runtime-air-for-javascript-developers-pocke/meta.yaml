    ## Loading Data from an XML File\n\n### Problem\n\nYou want to read XML data from\
    \ a local file using common JavaScript techniques, and be able to manipulate the\
    \ DOM not just the character data.\n\n### Solution\n\nReading a local XML document\
    \ for the data can occur using the `XMLHttpRequest` object, and by using a `File`\
    \ object reference as the URI endpoint as opposed to a web address.\n\n### Discussion\n\
    \nMost JavaScript libraries, and virtually every data-oriented Ajax application\
    \ uses the `XMLHttpRequest` object to load data. This is a common means to accessing\
    \ data from the client without refreshing the page, and is core to Ajax development\
    \ techniques. Adobe AIR includes support for the `XMLHttpRequest` object, which\
    \ can be used for data access.\n\nThe `XMLHttpRequest.open()` method expects three\
    \ arguments. The first argument is the HTTP method to be used for the call, which\
    \ is commonly GET or POST. The third argument tells the object whether or not\
    \ it should make the request asynchronously. The challenge in an AIR application\
    \ is the second argument that tells the object where to get its data:\n\n`XMLHttpRequest.open(\
    \ \"GET\", \"myData.xml\", true );`\n\nThis URI endpoint generally points to a\
    \ remote server. This can still happen in an application that is online, but as\
    \ AIR applications can also work offline, the endpoint needs to be pointed to\
    \ a local resource. Rather than pass an endpoint to a remote server, a File reference\
    \ can be provided:\n\n```\nvar file = air.File.applicationStorageDirectory.resolve(\n\
    \"myData.xml\" );\nvar xml = new XMLHttpRequest();\n\nxml.onreadystatechange =\
    \ function()\n{\n    if( xml.readyState == 4 )\n    {\n        // Work with data\n\
    \    }\n}\n\nxml.open( \"GET\", file.url, true );\nxml.send( null );\n```\n\n\
    The key distinction to make for this example is the use of the File.url property,\
    \ which the XMLHttpRequest object understands and uses to access the appropriate\
    \ data. Using this approach results in a traditional DOM that can be used to traverse\
    \ and manipulate the XML data in the file. Additionally, this approach can be\
    \ used with common JavaScript libraries.\n\n### Given\n\n```\n<rolodex>\n    <contact>\n\
    \        <first>Kevin</first>\n        <last>Hoyt</last>\n    </contact>\n   \
    \ ...\n</rolodex>\n```\n\n### Example\n\n```\n<html>\n<head>\n\n<title>XML File\
    \ Access</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\">\n</script>\n\
    <script>\nvar file = null;\nvar xml = null;\n\nfunction doLoad()\n{\n    file\
    \ = air.File.applicationResourceDirectory;\n    file = file.resolve( \"rolodex.xml\"\
    \ );\n\n    xml = new XMLHttpRequest();\n\n    xml.onreadystatechange = function()\n\
    \    {\n        var elem = null;\n        var first = null;\n        var last\
    \ = null;\n        var rolodex = null;\n\n        if( xml.readyState == 4 )\n\
    \        {\n            rolodex = xml.responseXML.documentElement.getElementsByTagName(\
    \ \"contact\" );\n\n            for( var c = 0; c < rolodex.length; c++ )\n  \
    \          {\n                first = rolodex[c].getElementsByTagName( \"first\"\
    \ )[0].textContent;\n                last = rolodex[c].getElementsByTagName( \"\
    last\" )[0].textContent;\n\n                elem = document.createElement( \"\
    div\" );\n                elem.innerText = first + \" \" + last;\n           \
    \     document.body.appendChild( elem );\n            }\n        }\n    }\n\n\
    \    xml.open( \"GET\", file.url, true );\n    xml.send( null );\n}\n</script>\n\
    \n</head>\n<body onload=\"doLoad()\">\n\n</body>\n</html>\n```\n\n## Creating\
    \ a Temporary File\n\n### Problem\n\nAn application needs to store transient information\
    \ during file processing, and cannot assume that adequate memory exists to store\
    \ the data in memory.\n\n### Solution\n\nCreating temporary files with File.createTempFile()\
    \ is an ideal means to store transient information while relieving the overhead\
    \ of additional memory.\n\n### Discussion\n\nThe File class contains a static\
    \ File.createTempFile() method which can be used to establish a temporary file.\
    \ The temporary file is created at a destination determined by the operating system.\
    \ Temporary files are also automatically given a unique name to avoid collision\
    \ with other files that may be present:\n\n```\nvar temp = air.File.createTempFile();\n\
    ```\n\nOnce a temporary file has been created, the other File and FileStream methods\
    \ may be used as in processing a known file at a known location:\n\n```\nvar stream\
    \ = new air.FileStream();\n\nstream.open( temp, air.FileMode.WRITE );\nstream.writeMultiByte(\
    \ \"Hello\", air.File.systemCharset );\nstream.close();\n```\n\nThe File.moveTo()\
    \ and File.moveToAsync() can be used after the fact, should you decide that it\
    \ is necessary to keep the temporary file for later reference. Both move methods\
    \ take two arguments. The first argument is a File reference to the destination\
    \ location. The second argument is a Boolean value which controls overwriting\
    \ any existing file. If the second argument is set to false, and a collision occurs,\
    \ the application throws an error:\n\n```\nvar move = air.File.applicationResourceDirectory.resolve(\
    \ \"temp.txt\" );\n\ntry\n{\n    temp.moveTo( move, false );\n}\ncatch( ioe )\n\
    {\n    alert( \"Can't move file:\\n\" + ioe.message );\n}\n```\n\nThe JavaScript\
    \ try/catch block will receive an error object of type IOError. The IOError class\
    \ has numerous properties available that can be used for further evaluation. The\
    \ exception in the previous code snippet raises the error message that is generated\
    \ by Adobe AIR:\n\n```\n<html>\n<head>\n<title>Temporary File</title>\n<script\
    \ type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\n<script>\nfunction\
    \ doLoad()\n{\n    var stream = new air.FileStream();\n    var temp = air.File.createTempFile();\n\
    \    var move = air.File.applicationResourceDirectory.resolve( \"temp.txt\" );\n\
    \    \n    stream.open( temp, air.FileMode.WRITE );\n    stream.writeMultiByte(\
    \ \"Hello\", air.File.systemCharset );\n    stream.close();\n    \n    try\n \
    \   {\n        temp.moveTo( move, false );\n    }\n    catch( ioe )\n    {\n \
    \       alert( \"Could not move temporary file:\\n\" + ioe.message );\n    }\n\
    }\n</script>\n</head>\n<body onload=\"doLoad()\">\n</body>\n</html>\n```\n\n##\
    \ Iterate the Contents of a Directory\n\n### Problem\n\nThe application is required\
    \ to display information about a directory as part of the user interface.\n\n\
    ### Solution\n\nUse the File.browseForDirectory API to prompt the user to select\
    \ a directory, and then use the File.listDirectory API to iterate through the\
    \ contents of the directory.\n\n### Discussion\n\nThe File class provides numerous\
    \ properties that can be used to get specific information about files on disk.\
    \ There are also two methods on the File class that pertain to getting a directory\
    \ list. The first is the File.browseForDirectory(), which can be used to prompt\
    \ the user to select a directory using the native dialog. The second is the File.listDirectory()\
    \ method, which will return an array of File objects for the currently referenced\
    \ directory.\n\nBefore prompting the user to select a directory using the native\
    \ dialog, the application needs to establish and register an event handler for\
    \ Event.SELECT. The Event.target"
