- img_proc: true
  md: '# Setting the MIME type


    One thing to watch out for when distributing AIR files for download from a web
    server, is to ensure that the MIME type is set correctly on the server. If the
    MIME type is not set correctly, web browsers may treat an AIR file as a zip file
    (and in the process rename it), or may display the raw bytes of the AIR file in
    the browser, instead of downloading it to the user''s system.


    The correct MIME type for an AIR file is:


    ```

    application/vnd.adobe.air-application-installer-package+zip

    ```


    For example, to set the MIME type for the Apache server, you would add the following
    line to your Apache configuration file:


    ```

    AddType application/vnd.adobe.air-application-installer-package+zip .air

    ```


    Check the documentation for your web server for specific instruction on how to
    set the MIME type.


    At this point, you have all of the basic knowledge of how to develop, test and
    deploy AIR applications, and are ready to begin to use the AIR APIs to build more
    full-featured and advanced applications.'
  merge: -1
  pgno: 63
