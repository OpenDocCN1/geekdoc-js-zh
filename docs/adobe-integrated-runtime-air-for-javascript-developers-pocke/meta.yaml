    \   air.trace( data ); // Hello Bob\n}\n</script>\n\n</head>\n<body onload=\"\
    init()\">\n</body>\n</html>\n```\n\n# # Uploading a File in the Background\n\n\
    ## Problem\nThe application user has created numerous files offline, and you now\
    \ want to send those to the server without blocking the user from doing any additional\
    \ work.\n\n## Solution\nThe File class in Adobe AIR provides an upload() method\
    \ that is designed specifically for this purpose, without having to create and\
    \ manage HTML forms.\n\n## Discussion\nThe File.upload() method can upload files\
    \ via HTTP/S to a server for additional processing. The upload takes places just\
    \ like a traditional multipart file upload from an HTML form, but without the\
    \ need to manipulate forms on the client. The upload process also takes place\
    \ asynchronously in the background, allowing the application to continue processing\
    \ without interruption."
- md: "## TIP\n\nThe implementation of the receiving server is beyond the scope of\
    \ this example. There are numerous technologies, and tutorials for these technologies,\
    \ that elegantly handle file upload. You're encouraged to investigate your options.\n\
    \nThe primary events that are useful are `ProgressEvent.PROGRESS` and `Event.COMPLETE`.\
    \ These events handle notifying the application of upload progress, and when an\
    \ individual upload is complete, respectively:\n\n```\nvar file =\nnew air.File.documentsDirectory.resolve(\
    \ \"myImage.jpg\" );\n\nfile.addEventListener( air.ProgressEvent.PROGRESS,\ndoProgress\
    \ );\nfile.addEventListener( air.Event.COMPLETE, doComplete );\n```\n\nThe `ProgressEvent`\
    \ contains various properties that can help in reflecting upload progress in the\
    \ user interface. The most notable of these properties are `ProgressEvent.bytesLoaded`\
    \ and `ProgressEvent.bytesTotal`, which show how much of the file has been uploaded\
    \ and the total size of the file. The `Event.COMPLETE` is broadcast once the upload\
    \ is complete.\n\nTo start the upload, you first need a valid `File` object that\
    \ points to a resource on disk.\n\nOnce a valid file reference is established,\
    \ developers will want to call the `File.upload()` method. The `File.upload()`\
    \ method can take three arguments, the first of which is a `URLRequest` object\
    \ that contains information about where the file should be sent. The `URLRequest`\
    \ object can also contain additional data to be passed to the receiving server.\
    \ This additional data manifests itself as HTML form fields might during a traditional\
    \ multipart file upload:\n\n```\nvar request = new air.URLRequest( \"http://www.mydomain.com/upload\"\
    \ );\nfile.upload( request, \"image\", false );\n```\n\nThe second argument provided\
    \ to the `File.upload()` method call is the name of the form field that contains\
    \ the file data.\n\nThe third argument is a Boolean value that tells the upload\
    \ process if it should try a test before sending the actual file. The test upload\
    \ will POST approximately 10KB of data to the endpoint to see if the endpoint\
    \ responds. If the service monitoring capabilities of the Adobe Integrated Runtime\
    \ are not being used, this is a good way to check for potential failure of the\
    \ process.\n\n> **TIP**\n> More than one great web application has been caught\
    \ by this subtlety before. If the server is expecting the file data outright,\
    \ then a test upload will almost assuredly cause an error. If you intend to use\
    \ the test facility, be sure that your server code is prepared to handle the scenario.\n\
    \n```\nfunction doProgress( event )\n{\n    var pct = Math.ceil( ( event.bytesLoaded\
    \ / event.bytesTotal ) * 100 );\n    document.getElementById( \"progress\" ).innerText\
    \ = pct + \"%\";\n}\n```\n\nThe `Event.COMPLETE` event is relatively straightforward\
    \ in that it signals the completion of the upload process. This is a good place\
    \ to perform any file system maintenance that might otherwise need to be accomplished\
    \ by the application. An example would be removing the just-uploaded file from\
    \ the local disk to free up space. Another task that might be accomplished in\
    \ the `Event.COMPLETE` handler is to start the upload of subsequent files:\n\n\
    ```\n<html>\n<head>\n<title>Background Upload</title>\n<script type=\"text/javascript\"\
    \ src=\"AIRAliases.js\">\n</script>\n<script>\nvar file = null;\n\nfunction doComplete()\n\
    {\n    document.getElementById( \"txtProgress\" ).style.\n        visibility =\
    \ \"hidden\";\n    document.getElementById( \"txtProgress\" ).innerText =\n  \
    \                                  \"Uploading... 0%\";\n\n    document.getElementById(\
    \ \"btnUpload\" ).disabled =\n                                    null;\n}\n\n\
    function doLoad()\n{\n    file = air.File.documentsDirectory;\n    file.addEventListener(\
    \ air.Event.SELECT, doSelect );\n    file.addEventListener( air.ProgressEvent.PROGRESS,\n\
    \                                    doProgress );\n    file.addEventListener(\
    \ air.Event.COMPLETE, doComplete\n                                    );\n\n \
    \   document.getElementById( \"btnUpload\" ).\n                              \
    \      addEventListener( \"click\", doUpload );\n}\n\nfunction doProgress( event\
    \ )\n{\n    var loaded = event.bytesLoaded;\n    var total = event.bytesTotal;\n\
    \    var pct = Math.ceil( ( loaded / total ) * 100 );\n\n    document.getElementById(\
    \ \"txtProgress\" ).innerText =\n                                    \"Uploading...\
    \ \" + pct.toString() + \"%\";\n}\n\nfunction doSelect()\n{\n    var request =\n\
    \        new air.URLRequest( \"http://www.ketnerlake.com/work/\n             \
    \                               watcher/upload.cfm\" );\n\n    document.getElementById(\
    \ \"btnUpload\" ).disabled =\n                                    \"disabled\"\
    ;\n    document.getElementById( \"txtProgress\" ).style.\n                   \
    \                 visibility = \"visible\";\n}\n\nfile.upload( request, \"image\"\
    , false );\n}\n\nfunction doUpload()\n{\n    file.browseForOpen( \"Select File\"\
    \ );\n}\n</script>\n\n</head>\n<body onload=\"doLoad()\">\n\n<input id=\"btnUpload\"\
    \ type=\"button\" value=\"Upload\" />\n\n<div id=\"txtProgress\" style=\"visibility:\
    \ hidden\">\nUploading... 0%</div>\n\n</body>\n</html>\n```\n\n## Sound\n\n###\
    \ Playing a Sound\n\n#### Problem\n\nYou need to play a sound in your application.\n\
    \n#### Solution\n\nUse the Sound API within AIR to play an MP3 file.\n\n#### Discussion\n\
    \nAIR includes complete support for accessing Flash Player APIs from JavaScript.\
    \ This includes the Sound class that can be used to play local or remote MP3 files.\n\
    \nPlaying a sound is simple, and requires two main steps:\n\n1. Create a URLRequest\
    \ instance that references the local or remote sound.\n2. Pass the URLRequest\
    \ to the Sound instance, and play it.\n\nHere is the relevant code snippet:\n\n\
    ```\nvar soundPath =\n    new air.URLRequest(\"app-resource:/sound.mp3\");\nvar\
    \ s = new air.Sound();\n    s.load(soundPath);\n    s.play();\n```\n\nFirst, we\
    \ create a URLRequest that points to the location of the MP3 file we will play.\
    \ In this case, we use an app-resource URI that references the sound.mp3 file\
    \ contained in the application install directory. You can also use any valid URI,\
    \ including both file and http URIs:\n\n```\nvar soundPath =\n    new air.URLRequest(\"\
    app-resource:/sound.mp3\");\n```\n\nWe then create an instance of the Sound class,\
    \ pass the reference to the MP3 path, and then call play:\n\n```\nvar s = new\
    \ air.Sound();\n    s.load(soundPath);\n    s.play();\n```\n\nHere is the complete\
    \ example with a play button:\n\n```\n<html>\n<head>\n    <script src=\"AIRAliases.js\"\
    \ />\n    <script type=\"text/javascript\">\n        function playSound()\n  \
    \      {\n            var soundPath =\n                new air.URLRequest(\"app-resource:/sound.mp3\"\
    );\n            var s = new air.Sound();\n                s.load(soundPath);\n\
    \                s.play();\n        }\n    </script>\n</head>\n<body>\n    <input\
    \ type=\"button\" value=\"Play\" onClick=\"playSound()\">\n</body>\n</html>\n\
    ```\n\nAt this point, you should have a solid understanding of Adobe AIR, how\
    \ to build AIR applications, and work with AIR APIs. Make sure to check the resources\
    \ listed in the Preface to learn more advanced Adobe AIR development techniques.\n\
    \n## APPENDIX A\n\n### AIR Command-Line Tools\n\nThe AIR SDK provides the following\
    \ command-line tools:\n\n-   **ADL**\n    Use this tool to launch and test an\
    \ AIR application without having to install it.\n\n-   **ADT**\n    Use this tool\
    \ to package an AIR application into a redistributable AIR file.\n\nThis Appendix\
    \ lists the options for each of the command-line tools.\n\nFor an example of using\
    \ these tools, see Chapter 2.\n\n### ADL\n\nADL is a command-line tool that launches\
    \ an AIR application, based on its application descriptor file, without requiring\
    \ that the application be installed. This is useful for testing and debugging\
    \ the application.\n\nTypically, you want to call the ADL tool passing one parameter:\
    \ the path to the application descriptor file (the application .xml file):\n\n\
    ```\nadl application.xml\n```\n\nThe full syntax of the ADL command is:\n\n```\n\
    adl ( -runtime <path-to-runtime-dir> )? <path-to-app-xml>\n<path-to-root-dir>?\
    \ ( -- ... )?\n```"
  mdcn: "\n## 提示\n\n接收服务器的实现超出了本示例的范围。有许多技术及其教程可以优雅地处理文件上传。我们鼓励您研究您的可用选项。\n\n主要有用的事件是\
    \ `ProgressEvent.PROGRESS` 和 `Event.COMPLETE`。这两个事件分别负责通知应用程序上传进度，以及单个文件上传何时完成：\n\
    \n```\nvar file =\nnew air.File.documentsDirectory.resolve( \"myImage.jpg\" );\n\
    \nfile.addEventListener( air.ProgressEvent.PROGRESS,\ndoProgress );\nfile.addEventListener(\
    \ air.Event.COMPLETE, doComplete );\n```\n\n`ProgressEvent` 包含多个属性，有助于在用户界面中反映上传进度。其中最值得注意的属性是\
    \ `ProgressEvent.bytesLoaded` 和 `ProgressEvent.bytesTotal`，它们分别显示已上传的文件大小和文件总大小。`Event.COMPLETE`\
    \ 在上传完成后广播。\n\n要开始上传，您首先需要一个指向磁盘上资源的有效 `File` 对象。\n\n一旦建立了有效的文件引用，开发人员就需要调用 `File.upload()`\
    \ 方法。`File.upload()` 方法可以接受三个参数，其中第一个是包含文件应发送到何处信息的 `URLRequest` 对象。`URLRequest`\
    \ 对象还可以包含传递给接收服务器的附加数据。这些附加数据在传统多部分文件上传中体现为 HTML 表单字段：\n\n```\nvar request = new\
    \ air.URLRequest( \"http://www.mydomain.com/upload\" );\nfile.upload( request,\
    \ \"image\", false );\n```\n\n传递给 `File.upload()` 方法调用的第二个参数是包含文件数据的表单字段的名称。\n\
    \n第三个参数是一个布尔值，它告诉上传过程在发送实际文件之前是否应该尝试进行测试。测试上传将向端点 POST 大约 10KB 的数据，以查看端点是否响应。如果不使用\
    \ Adobe 集成运行时的服务监控功能，这是检查过程中潜在故障的好方法。\n\n> **提示**\n> 以前有许多优秀的网络应用程序被这种微妙之处所困扰。如果服务器期望直接接收文件数据，那么测试上传几乎肯定会导致错误。如果您打算使用测试功能，请确保您的服务器代码准备好处理这种情况。\n\
    \n```\nfunction doProgress( event )\n{\n    var pct = Math.ceil( ( event.bytesLoaded\
    \ / event.bytesTotal ) * 100 );\n    document.getElementById( \"progress\" ).innerText\
    \ = pct + \"%\";\n}\n```\n\n`Event.COMPLETE` 事件相对简单，因为它表示上传过程的完成。这是执行任何可能需要由应用程序完成的文件系统维护工作的好地方。例如，从本地磁盘删除刚刚上传的文件以释放空间。在\
    \ `Event.COMPLETE` 处理程序中可能完成的另一个任务是开始上传后续文件：\n\n```\n<html>\n<head>\n<title>Background\
    \ Upload</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\">\n</script>\n\
    <script>\nvar file = null;\n\nfunction doComplete()\n{\n    document.getElementById(\
    \ \"txtProgress\" ).style.\n        visibility = \"hidden\";\n    document.getElementById(\
    \ \"txtProgress\" ).innerText =\n                                    \"Uploading...\
    \ 0%\";\n\n    document.getElementById( \"btnUpload\" ).disabled =\n         \
    \                           null;\n}\n\nfunction doLoad()\n{\n    file = air.File.documentsDirectory;\n\
    \    file.addEventListener( air.Event.SELECT, doSelect );\n    file.addEventListener(\
    \ air.ProgressEvent.PROGRESS,\n                                    doProgress\
    \ );\n    file.addEventListener( air.Event.COMPLETE, doComplete\n            \
    \                        );\n\n    document.getElementById( \"btnUpload\" ).\n\
    \                                    addEventListener( \"click\", doUpload );\n\
    }\n\nfunction doProgress( event )\n{\n    var loaded = event.bytesLoaded;\n  \
    \  var total = event.bytesTotal;\n    var pct = Math.ceil( ( loaded / total )\
    \ * 100 );\n\n    document.getElementById( \"txtProgress\" ).innerText =\n   \
    \                                 \"Uploading... \" + pct.toString() + \"%\";\n\
    }\n\nfunction doSelect()\n{\n    var request =\n        new air.URLRequest( \"\
    http://www.ketnerlake.com/work/\n                                            watcher/upload.cfm\"\
    \ );\n\n    document.getElementById( \"btnUpload\" ).disabled =\n            \
    \                        \"disabled\";\n    document.getElementById( \"txtProgress\"\
    \ ).style.\n                                    visibility = \"visible\";\n}\n\
    \nfile.upload( request, \"image\", false );\n}\n\nfunction doUpload()\n{\n   \
    \ file.browseForOpen( \"Select File\" );\n}\n</script>\n\n</head>\n<body onload=\"\
    doLoad()\">\n\n<input id=\"btnUpload\" type=\"button\" value=\"Upload\" />\n\n\
    <div id=\"txtProgress\" style=\"visibility: hidden\">\nUploading... 0%</div>\n\
    \n</body>\n</html>\n```\n\n## 声音\n\n### 播放声音\n\n#### 问题\n\n您需要在应用程序中播放声音。\n\n\
    #### 解决方案\n\n使用 AIR 中的 Sound API 播放 MP3 文件。\n\n#### 讨论\n\nAIR 完全支持从 JavaScript\
    \ 访问 Flash Player API。这包括可用于播放本地或远程 MP3 文件的 Sound 类。\n\n播放声音很简单，主要需要两个步骤：\n\n\
    1.  创建一个引用本地或远程声音的 URLRequest 实例。\n2.  将 URLRequest 传递给 Sound 实例，然后播放它。\n\n以下是相关的代码片段：\n\
    \n```\nvar soundPath =\n    new air.URLRequest(\"app-resource:/sound.mp3\");\n\
    var s = new air.Sound();\n    s.load(soundPath);\n    s.play();\n```\n\n首先，我们创建一个指向我们将要播放的\
    \ MP3 文件位置的 URLRequest。在这个例子中，我们使用一个 app-resource URI，它引用了包含在应用程序安装目录中的 sound.mp3\
    \ 文件。您也可以使用任何有效的 URI，包括文件和 http URI：\n\n```\nvar soundPath =\n    new air.URLRequest(\"\
    app-resource:/sound.mp3\");\n```\n\n然后我们创建一个 Sound 类的实例，传递 MP3 路径的引用，然后调用 play：\n\
    \n```\nvar s = new air.Sound();\n    s.load(soundPath);\n    s.play();\n```\n\n\
    这是一个带有播放按钮的完整示例：\n\n```\n<html>\n<head>\n    <script src=\"AIRAliases.js\" />\n\
    \    <script type=\"text/javascript\">\n        function playSound()\n       \
    \ {\n            var soundPath =\n                new air.URLRequest(\"app-resource:/sound.mp3\"\
    );\n            var s = new air.Sound();\n                s.load(soundPath);\n\
    \                s.play();\n        }\n    </script>\n</head>\n<body>\n    <input\
    \ type=\"button\" value=\"Play\" onClick=\"playSound()\">\n</body>\n</html>\n\
    ```\n\n至此，您应该对 Adobe AIR、如何构建 AIR 应用程序以及如何使用 AIR API 有了扎实的理解。请务必查看前言中列出的资源，以学习更高级的\
    \ Adobe AIR 开发技术。\n\n## 附录 A\n\n### AIR 命令行工具\n\nAIR SDK 提供了以下命令行工具：\n\n-   **ADL**\n\
    \    使用此工具启动和测试 AIR 应用程序，而无需安装它。\n\n-   **ADT**\n    使用此工具将 AIR 应用程序打包为可重新分发的\
    \ AIR 文件。\n\n本附录列出了每个命令行工具的选项。\n\n有关使用这些工具的示例，请参见第 2 章。\n\n### ADL\n\nADL 是一个命令行工具，它基于\
    \ AIR 应用程序的描述符文件启动 AIR 应用程序，而无需安装该应用程序。这对于测试和调试应用程序非常有用。\n\n通常，您希望调用 ADL 工具并传递一个参数：应用程序描述符文件（应用程序\
    \ .xml 文件）的路径：\n\n```\nadl application.xml\n```\n\nADL 命令的完整语法是：\n\n```\nadl (\
    \ -runtime <path-to-runtime-dir> )? <path-to-app-xml>\n<path-to-root-dir>? ( --\
    \ ... )?\n```\n"
