  md: "you send data to a persistent socket endpoint and receive data from it in real\
    \ time. You do not need to create a new Socket instance for each set of data sent\
    \ to the same endpoint. The connection can be kept alive for the entire conversation\
    \ between your client and the service to which you're connecting. This is the\
    \ typical flow when using the Socket API:\n\n+   1. Create a connection to the\
    \ endpoint\n2. Listen for notification of connection success or failure\n3. Queue\
    \ data that will be sent to the endpoint\n4. Send the data to the endpoint\n5.\
    \ Listen for data incoming from the endpoint\n6. Repeat steps 3 through 5\n7.\
    \ Close the connection\n\nThe first step is to create a connection to the socket\
