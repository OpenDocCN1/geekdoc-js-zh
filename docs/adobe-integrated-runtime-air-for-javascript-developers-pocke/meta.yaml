    \ 与窗口本身一样大（包括边框）。`Stage.stageWidth` 和 `Stage.stageHeight` 会使控件大小适应可查看区域。\n\n`Stage`\
    \ 也是将控件添加以显示（称为显示列表）的地方，并负责其内部内容如何定位和调整大小。对于大多数应用程序，这意味着将 `Stage.scaleMode` 设置为\
    \ `StageScaleMode.NO_SCALE`，将 `Stage.align` 设置为 `StageAlign.TOP_LEFT`。调用 `Stage.addChild()`\
    \ 会将 `HTMLControl` 添加到可查看区域。使用这种方法，可以在单个窗口中拥有多个 `HTMLControl` 控件：\n\n```javascript\n\
