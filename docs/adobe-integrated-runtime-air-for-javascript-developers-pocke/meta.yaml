    # Accessing AIR APIs from JavaScript


    In addition to the standard JavaScript and HTML DOM APIs, JavaScript code running
    within the application context in an AIR application can also take advantage of
    APIs provided by the runtime, as well as Flash Player APIs and even ActionScript
    3 libraries. This greatly extends the capabilities of JavaScript over the APIs
