- md: "## Windowing\n\n## Creating a New Window\n\n**Problem**\nYou need to display\
    \ an additional window into which additional content can be loaded.\n\n**Solution**\n\
    Basic windows can be generated and maintained in a similar fashion as traditional\
    \ HTML content using the `window.open()` method.\n\n**Discussion**\nThe JavaScript\
    \ `window.open()` method invokes a new window similar to the way it would when\
    \ used in the browser. Content that gets loaded into the new window can come from\
    \ a local file, or URL endpoint. Similar to windows created using JavaScript in\
    \ the browser, there is finite control over the window itself. The window properties\
    \ that can be controlled are width, height, scrollbars, and resizable.\n\n```javascript\n\
    var login = window.open( \"login.html\", \"login\", \"width = 300, height = 200\"\
    \ );\n```\n\nA native window is a better choice when additional control over the\
    \ new window is required. Native windows expose virtually the entire functionality\
    \ of the operating system such as minimize/maximize, always in front, full screen\
    \ and even removal of system chrome altogether. The drawback to using native windows\
    \ is that there is substantially more work because all events must be monitored\
    \ and managed explicitly.\n\n> **TIP**\nThe `window.opener` property that is commonly\
    \ used in JavaScript to refer from a new window to the parent (creating) window\
    \ can also be used.\n\n```html\n<html>\n<head>\n\n<title>Basic Window</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\n<script>\n\
    function doLoad()\n{\n    document.getElementById(\"btnLogin\").addEventListener(\"\
    click\", doLogin);\n}\n\nfunction doLogin()\n{\n    var login = window.open(\"\
    Login.html\", null, \"width=270, height=150\");\n}\n</script>\n\n</head>\n<body\
    \ onload=\"doLoad()\">\n\n<input id=\"btnLogin\" type=\"button\" value=\"Login\"\
    \ />\n\n</body>\n</html>\n```\n\nLogin.html\n\n```html\n<html>\n<head>\n\n<title>Login</title>\n\
    \n</head>\n<body>\n\n<table>\n    <tr>\n        <td>Email:</td>\n        <td><input\
    \ name=\"email\" /></td>\n    </tr>\n    <tr>\n        <td>Password:</td>\n  \
    \      <td><input name=\"password\" /></td>\n    </tr>\n    <tr>\n        <td\
    \ colspan=\"2\" align=\"right\">\n            <input type=\"button\" value=\"\
    Sign In\" />\n        </td>\n    </tr>\n</table>\n\n</body>\n</html>\n```\n\n\
    ## Creating a New Native Window\n\n**Problem**\n\nYou need to display an additional\
    \ window into which additional content can be loaded, and you need to be able\
    \ to fine tune how the new window appears.\n\n**Solution**\n\nThe `NativeWindow`\
    \ class provides the foundation for creating and managing new windows that require\
    \ a high degree of customization and control.\n\n**Discussion**\n\nNative windows\
    \ make an excellent choice for creating and managing new windows that require\
    \ a high degree of customization. You may want the application to hide the minimize/maximize\
    \ buttons. You may also want to control window z-ordering, or force a particular\
    \ window to always stay on top. The `NativeWindow` class offers control over these\
    \ aspects of a window and more.\n\nThe `NativeWindow` constructor takes two arguments;\
    \ a Boolean specifying whether or not the window is initially visible, and a `NativeWindowInitOptions`\
    \ object which controls aspects of the window such as whether or not it is resizable,\
    \ or even if it has any system chrome at all. The `NativeWindowInitOptions` constructor\
    \ takes no arguments:\n\n```javascript\nvar options = new air.NativeWindowInitOptions();\n\
    var login = null;\n\noptions.minimizable = false;\noptions.maximizable = false;\n\
    options.resizable = false;\n\nlogin = new air.NativeWindow( false, options );\n\
    ```\n\nNot all the options an application may make use of appear as initialization\
    \ options. Additional options that may be controlled on an instance of `NativeWindow`\
    \ itself include the window title, whether or not it is always in front, and window\
    \ sizing and positioning.\n\n> **TIP**\nIf you intend to manage the initial window\
    \ size manually, it is best to start with an invisible window. Creating a native\
    \ window and then changing its positioning and layout in the same block of code\
    \ results in a quick flicker of the window as it is initially painted and then\
    \ relocated and resized.\n\nWhen using the `NativeWindow` class, you have absolute\
    \ control over its appearance, behavior and content. If the window is to be resized,\
    \ the operating system will merely provide for the handles and resizing operations.\
    \ The size, position, content, and layout of the window itself must be controlled\
    \ by the application. Depending on how the application needs to handle resizing,\
    \ the `NativeWindowBoundsEvent.RESIZE` or `NativeWindowBoundsEvent.RESIZING` events\
    \ may be used:\n\n```javascript\nlogin.title = \"Login\";\nlogin.alwaysInFront\
    \ = false;\nlogin.bounds = new window.runtime.flash.geom.Rectangle(\n    ( air.Capabilities.screenResolutionX\
    \ - 270 ) / 2,\n    ( air.Capabilities.screenResolutionY - 150 ) / 2,\n    270,\n\
    \    150 );\nlogin.visible = true;\n```\n\nA native window initially has no content\
    \ outside of the runtime. Unlike the JavaScript `window.open()` method, an application\
    \ cannot simply specify a URL for the content to be displayed. The window is so\
    \ raw that an application must first add an `HTMLControl` to the window, size\
    \ it, and tell it what content to load. The `HTMLControl` constructor takes no\
    \ arguments, exposes properties for width and height, and exposes an `HTMLControl.load()`\
    \ method which can be used to load external content:\n\n```javascript\nvar control\
    \ = new window.runtime.flash.html.HTMLControl();\nvar page = air.File.applicationResourceDirectory.resolve(\
    \ \"login.html\" );\n\ncontrol.width = login.stage.stageWidth;\ncontrol.height\
    \ = login.stage.stageHeight;\ncontrol.load( new air.URLRequest( page.url ) );\n\
    ```\n\nThe `NativeWindow.stage` property represents a `Stage` object and is used\
    \ to determine the viewable area for sizing the `HTMLControl`. Using `NativeWindow.width`\
    \ or `NativeWindow.height` for the `HTMLControl` sizing would have resulted in\
    \ an `HTMLControl` as large as the window itself (including chrome). `Stage.stageWidth`\
    \ and `Stage.stageHeight` will size the control to fit the viewable area.\n\n\
    The `Stage` is also where controls will get added for display (called the display\
    \ list), and is responsible for how the content inside of it will be positioned\
    \ and sized. For most applications this means setting `Stage.scaleMode` to `StageScaleMode.NO_SCALE`\
    \ and `Stage.align` to `StageAlign.TOP_LEFT`. Calling `Stage.addChild()` will\
    \ add the `HTMLControl` to the viewable area. Using this approach, it is possible\
    \ to have multiple `HTMLControl` controls in one single window:\n\n```javascript\n\
    win.stage.scaleMode = window.runtime.flash.display.StageScaleMode.NO_SCALE;\n\
    win.stage.align = window.runtime.flash.display.StageAlign.TOP_LEFT;\nwin.stage.addChild(\
    \ control );\n```\n\n> **TIP**\nIt is likely that knowledge of the `Stage` class\
    \ and the display list will be abstracted into more useful high-level classes\
    \ in a later release.\n\n```html\n<html>\n<head>\n\n<title>Native Window</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\n<script>\n\
    var Rectangle = window.runtime.flash.geom.Rectangle;\n\nvar control = null;\n\
    var win = null;\n\nfunction doLoad()\n{\n    document.getElementById(\"btnLogin\"\
    ).addEventListener(\"click\", doLogin);\n}\n\nfunction doLogin()\n{\n    var options\
    \ = new air.NativeWindowInitOptions();\n    var login = air.File.applicationResourceDirectory.resolve(\"\
    login.html\");\n\n    options.minimizable = false;\n    options.maximizable =\
    \ false;\n    options.resizable = false;\n\n    win = new air.NativeWindow(false,\
    \ options);\n    win.title = \"Login\";\n    win.alwaysInFront = true;\n    win.bounds\
    \ = new Rectangle(\n        (air.Capabilities.screenResolutionX - 270) / 2,\n\
    \        (air.Capabilities.screenResolutionY - 150) / 2,\n        270,\n     \
    \   150);\n    win.visible = true;\n```"
  mdcn: "\n## 窗口管理\n\n## 创建新窗口\n\n**问题**\n你需要显示一个额外的窗口，以便加载其他内容。\n\n**解决方案**\n基本窗口可以通过类似传统HTML内容的方式生成和维护，使用\
    \ `window.open()` 方法。\n\n**讨论**\nJavaScript 的 `window.open()` 方法调用新窗口的方式类似于在浏览器中使用的方式。加载到新窗口的内容可以来自本地文件或URL端点。与在浏览器中使用JavaScript创建的窗口类似，对窗口本身的控制是有限的。可以控制的窗口属性包括宽度、高度、滚动条和可调整大小。\n\
    \n```javascript\nvar login = window.open( \"login.html\", \"login\", \"width =\
    \ 300, height = 200\" );\n```\n\n当需要对新窗口进行额外控制时，原生窗口是更好的选择。原生窗口几乎暴露了操作系统的全部功能，例如最小化/最大化、始终置前、全屏，甚至完全移除系统边框。使用原生窗口的缺点是工作量会显著增加，因为所有事件都必须被显式地监控和管理。\n\
    \n> **提示**\n在JavaScript中常用于从新窗口引用父窗口（创建窗口）的 `window.opener` 属性也可以使用。\n\n```html\n\
    <html>\n<head>\n\n<title>基本窗口</title>\n<script type=\"text/javascript\" src=\"\
    AIRAliases.js\"></script>\n\n<script>\nfunction doLoad()\n{\n    document.getElementById(\"\
    btnLogin\").addEventListener(\"click\", doLogin);\n}\n\nfunction doLogin()\n{\n\
    \    var login = window.open(\"Login.html\", null, \"width=270, height=150\");\n\
    }\n</script>\n\n</head>\n<body onload=\"doLoad()\">\n\n<input id=\"btnLogin\"\
    \ type=\"button\" value=\"登录\" />\n\n</body>\n</html>\n```\n\nLogin.html\n\n```html\n\
    <html>\n<head>\n\n<title>登录</title>\n\n</head>\n<body>\n\n<table>\n    <tr>\n\
    \        <td>电子邮件：</td>\n        <td><input name=\"email\" /></td>\n    </tr>\n\
    \    <tr>\n        <td>密码：</td>\n        <td><input name=\"password\" /></td>\n\
    \    </tr>\n    <tr>\n        <td colspan=\"2\" align=\"right\">\n           \
    \ <input type=\"button\" value=\"登录\" />\n        </td>\n    </tr>\n</table>\n\
    \n</body>\n</html>\n```\n\n## 创建新原生窗口\n\n**问题**\n你需要显示一个额外的窗口，以便加载其他内容，并且需要能够精细调整新窗口的显示方式。\n\
    \n**解决方案**\n`NativeWindow` 类为创建和管理需要高度定制化和控制的新窗口提供了基础。\n\n**讨论**\n原生窗口是创建和管理需要高度定制化新窗口的绝佳选择。你可能希望应用程序隐藏最小化/最大化按钮。你还可能想控制窗口的Z轴顺序，或强制某个窗口始终在最前面。`NativeWindow`\
    \ 类提供了对这些窗口方面及更多功能的控制。\n\n`NativeWindow` 构造函数接受两个参数；一个布尔值指定窗口最初是否可见，以及一个 `NativeWindowInitOptions`\
    \ 对象，该对象控制窗口的方面，例如是否可调整大小，甚至是否具有任何系统边框。`NativeWindowInitOptions` 构造函数不接受参数：\n\n\
    ```javascript\nvar options = new air.NativeWindowInitOptions();\nvar login = null;\n\
    \noptions.minimizable = false;\noptions.maximizable = false;\noptions.resizable\
    \ = false;\n\nlogin = new air.NativeWindow( false, options );\n```\n\n应用程序可能使用的所有选项并非都作为初始化选项出现。在\
    \ `NativeWindow` 实例本身上可以控制的附加选项包括窗口标题、是否始终在前面以及窗口的大小和位置。\n\n> **提示**\n如果你打算手动管理初始窗口大小，最好从一个不可见的窗口开始。创建一个原生窗口，然后在同一个代码块中更改其位置和布局，会导致窗口在初始绘制后快速闪烁，因为它被重新定位和调整大小。\n\
    \n使用 `NativeWindow` 类时，你可以完全控制其外观、行为和内容。如果窗口需要调整大小，操作系统仅提供调整大小的句柄和操作。窗口本身的大小、位置、内容和布局必须由应用程序控制。根据应用程序处理调整大小的方式，可以使用\
    \ `NativeWindowBoundsEvent.RESIZE` 或 `NativeWindowBoundsEvent.RESIZING` 事件：\n\n\
    ```javascript\nlogin.title = \"登录\";\nlogin.alwaysInFront = false;\nlogin.bounds\
    \ = new window.runtime.flash.geom.Rectangle(\n    ( air.Capabilities.screenResolutionX\
    \ - 270 ) / 2,\n    ( air.Capabilities.screenResolutionY - 150 ) / 2,\n    270,\n\
    \    150 );\nlogin.visible = true;\n```\n\n原生窗口最初在运行时之外没有任何内容。与JavaScript的 `window.open()`\
    \ 方法不同，应用程序不能简单地指定一个URL来显示内容。窗口是如此原始，以至于应用程序必须首先向窗口添加一个 `HTMLControl`，调整其大小，并告诉它要加载什么内容。`HTMLControl`\
    \ 构造函数不接受参数，暴露了宽度和高度属性，并暴露了一个 `HTMLControl.load()` 方法，该方法可用于加载外部内容：\n\n```javascript\n\
    var control = new window.runtime.flash.html.HTMLControl();\nvar page = air.File.applicationResourceDirectory.resolve(\
    \ \"login.html\" );\n\ncontrol.width = login.stage.stageWidth;\ncontrol.height\
