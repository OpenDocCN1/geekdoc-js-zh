    >\n</body>\n</html>\n```\n\n# Creating Full-Screen Windows\n\n## Problem\n\nFor\
    \ the purpose of enabling more viewing space or enabling additional interactions,\
    \ your application needs to be able to run using the full screen.\n\n## Solution\n\
    \nThe NativeWindow class provides the foundation for creating transparent and\
    \ full screen.\n\n## Discussion\n\nThe differences between using NativeWindow\
    \ for full-screen display, and using NativeWindow for custom windows, is an additional\
    \ initialization option and setting the window to fill the screen. To remove any\
    \ OS-specific windowing chrome, use the NativeWindowInitOptions.systemChrome property.\
    \ The NativeWindowInitOptions.systemChrome should be set to one of the four string\
    \ constants (Table 4-1) found in the NativeWindowSystemChrome class.\n\n### Table\
    \ 4-1. String constants in NativeWindowSystemChrome\n\n| String constant | Description\
    \ |\n| --- | --- |\n| NativeWindowSystemChrome.STANDARD | This is the default\
    \ for NativeWindow and reflects the window chrome used on the specific operating\
    \ system. |\n| NativeWindowSystemChrome.UTILITY | Utility chrome is best suited\
    \ for related windows that will be present for an extended amount of time such\
    \ as tool panels. |\n| NativeWindowSystemChrome.NONE | Indicates that no chrome\
    \ should be present, and requires that the application handle all traditional\
    \ windowing tasks. |\n| NativeWindowSystemChrome.ALTERNATE | Not implemented for\
    \ the Adobe AIR Beta. |\n\nTo create a full-screen window without any chrome,\
    \ the NativeWindowInitOptions.systemChrome property should be set to NativeWindowSystemChrome.NONE.\
    \ The application can then subsequently call the NativeWindow.maximize() method,\
    \ or set NativeWindow.bounds directly. The NativeWindow.bounds property takes\
    \ a flash.geom.Rectangle object which specifies horizontal and vertical origination,\
    \ as well as width and height. Either approach fills the viewable screen with\
    \ the newly created native window.\n\n```\nvar options = new air.NativeWindowInitOptions();\n\
    var login = null;\n\noptions.minimizable = false;\noptions.maximizable = false;\n\
    options.resizable = false;\noptions.systemChrome = air.NativeWindowSystemChrome.NONE;\n\
    \nlogin = new air.NativeWindow( false, options );\nlogin.maximize();\n```\n\n\
    ## TIP\n\nIf you find yourself confronted with an application that doesn't shut\
    \ down, but whose visible windows are all closed, then you're probably dealing\
    \ with one of a few different challenges. The first is that you never set a size\
    \ on a NativeWindow. The second is that you never set a NativeWindow to visible.\
    \ The most common is that you used NativeWindowSystemChrome.NONE, but never added\
    \ any content.\n\n# File API\n\n## Writing Text to a File from a String\n\n**Problem**\n\
    A user has made changes to textual content in the application, which the user\
    \ wants to save to disk for offline access.\n\n**Solution**\nWriting text can\
    \ be accomplished through the File and FileStream classes that are part of AIR.\n\
    \n**Discussion**\nBefore any reading or writing takes place to disk, a reference\
    \ to a file or directory must first exist in the application. A file reference\
    \ can be established in a number of ways, including programmatic manipulation\
    \ and user selection. Both of these are accomplished by using the File class.\
    \ The File class also contains static properties that point to common locations\
    \ on the operating system. These locations include the desktop directory, user\
    \ directory and documents directory:\n\n```\nvar file =\n    air.File.applicationStorageDirectory.resolve(\
    \ \"myFile.txt\" );\n```\n\nThe call to File.resolve() creates a reference to\
    \ a file named myFile.txt located in the application storage directory. Once a\
    \ reference has been established, it can be used in file IO operations. Note that\
    \ this doesn't actually create the file at this point.\n\nPhysically reading and\
    \ writing to disk is available using the FileStream class. The FileStream class\
    \ does not take any arguments in its constructor:\n\n```\nvar stream = new air.FileStream();\n\
    ```\n\nWith the file reference available, and a FileStream object instantiated,\
    \ the process of writing data to disk can take place. The type of data that can\
    \ be written may be anything from binary, to text, to value objects. These can\
    \ all be accessed by using the respective FileStream method for that operation.\n\
    \nThe first step in writing a file is to open it using the FileStream.open() method.\
    \ The FileStream.open() method takes two arguments. The first argument is the\
    \ file reference created earlier that will be the destination of the output. The\
    \ second argument is the type of access the application will need to the file.\
    \ In the case of writing data to a file, the FileMode.WRITE static property will\
    \ be most common. A second possibility is FileMode.APPEND, depending on the application\
    \ requirements:\n\n```\nstream.open( file, air.FileMode.WRITE );\n```\n\nWhen\
    \ writing text, an application should use FileStream.writeMultiByte() to ensure\
    \ that data is written with the correct encoding. The FileStream.writeMultiByte()\
    \ method takes two arguments. The first argument is the String object (text) that\
    \ will be written to disk. The second argument is the character set to be used.\
    \ The most common character set is that which the operating system is using, which\
    \ is available on the File class as File.systemCharset:\n\n```\nstream.writeMultiByte(\
    \ document.getElementById( \"txtNote\" ).value, air.File.systemCharset );\n```\n\
    \nOnce the text has been written to the file, it is important to close the file\
    \ to avoid any corruption or blocking of access from other applications. Closing\
    \ a file is accomplished using the FileStream.close() method.\n\n> XML data is\
    \ already in textual format and, as such, can be written to disk using these same\
    \ series of steps. If the application uses the XMLHttpRequest object, then using\
    \ the myXml.responseText property alone may be adequate for most situations.\n\
    \n```html\n<html>\n<head>\n\n<title>Write Text</title>\n<script type=\"text/javascript\"\
    \ src=\"AIRAliases.js\"></script>\n\n<script>\nfunction doLoad()\n{\n    document.getElementById(\
    \ \"btnSave\" ).addEventListener( \"click\", doSave );\n}\n\nfunction doSave()\n\
    {\n    var file =\n    air.File.applicationResourceDirectory.resolve( \"note.txt\"\
    \ );\n    var stream = new air.FileStream();\n\n    stream.open( file, air.FileMode.WRITE\
    \ );\n    stream.writeMultiByte( document.getElementById( \"txtNote\" ).value,\
    \ air.File.systemCharset );\n    stream.close();\n}\n</script>\n</head>\n<body\
    \ onload=\"doLoad()\">\n    <textarea id=\"txtNote\"></textarea>\n    <input id=\"\
    btnSave\" type=\"button\" value=\"Save\" />\n</body>\n</html>\n```"
