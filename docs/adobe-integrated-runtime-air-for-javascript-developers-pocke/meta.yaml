    \ dropListener( event )\n{\n    alert( event.dataTransfer.getData( \"text/plain\"\
    \ ) );\n// Adobe\n}\n```\n\nWhen a user is dragging an item from one application\
    \ to another, or from one location in your application to another, you may want\
    \ to indicate to the user which operations (copy, link, or move) are available.\
    \ By using the effectAllowed and dropEffect properties of the dataTransfer object\
    \ you can specify which operations are allowed. The system then uses the application\
    \ to determine what actions a user can perform during the drag operation. The\
    \ list of available values for these properties can be determined by reading the\
    \ documentation referenced above.\n\nWhen starting a drag, the effectAllowed property\
    \ tells the system what operations the source element supports. The dropEffect\
    \ property specifies the operation that the current target receiving the drag\
    \ event supports. The system then uses the information about what effects both\
    \ the source and destination target support and displays that to the user.\n\n\
    # TIP\n\nThe current AIR Beta on Adobe Labs has a few limitations. First, specifying\
    \ custom drag images and snapshots is not supported. Also, only two MIME types\
    \ are available for transfer: text/plain, and text/uri-list. Last, the types array\
    \ on the dataTransfer is not accessible on the dataTransfer object. Support for\
    \ these features will be added for AIR Version 1.0."
