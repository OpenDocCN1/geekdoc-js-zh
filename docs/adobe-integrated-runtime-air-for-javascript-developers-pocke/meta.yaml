    # Preface


    This book provides a quick introduction to developing applications for the public
    Beta 1 build of the Adobe Integrated Runtime (AIR). AIR, which prior to the Beta
    was referred to by its code name, Apollo, is a new cross-platform desktop application
    runtime being developed by Adobe. While Adobe AIR allows both Flash- and HTML-based
    application development, this book focuses on building AIR applications using
    HTML and JavaScript.


    The book gives an overview of Adobe AIR, shows how to set up your development
    environment, and discusses new AIR functionality and APIs. Once you have finished
    reading this book, you should have a good understanding of what AIR is as well
    as how to build HTML and JavaScript applications for it.


    ## AIR Runtime Naming Conventions


    Adobe AIR allows developers to leverage a number of web technologies to deploy
    web applications to the desktop. Indeed, there are so many technologies, that
    it can be difficult to keep track of them all. Table P-1 lists the terms used
    in the book, and defines each one:


    ## Table P-1. AIR runtime naming conventions


    | Name | Meaning |

    | --- | --- |

    | Adobe Integrated Runtime (AIR) | The cross-platform desktop runtime that enables
    the running of AIR applications. |

    | AIR Application | An application built with Flash, HTML and/or PDF that runs
    on top of Adobe AIR. |

    | Flash | Any content contained within a SWF 9 file format that runs in the Flash
    Player or AIR. |

    | ActionScript | The ECMAScript-based programming language used to program Flash
    content. Unless otherwise noted, all references to ActionScript in this book refer
    to ActionScript 3. |

    | HTML | Standard web-based markup language used to create and layout web pages.
    |

    | JavaScript | Web-based implementation of ECMAScript used to program content
    within HTML applications. |

    | PDF | Short for Portable Document Format, a technology that allows for seamless
    distribution and display of electronic documents. |

    | Flex Framework | An XML and ActionScript-based Framework designed to make developing
    Flash-based rich Internet applications easy. |

    | Flex Builder | An Eclipse-based IDE used to build Flash-based rich Internet
    applications using Flex and ActionScript. |


    ## What This Book Covers


    This book gives a general overview of Adobe AIR, shows how to set up your development
    environment to start building applications, provides an overview of the HTML and
    JavaScript engines within AIR, and shows how to perform a number of common programming
    tasks within AIR.


    As a general rule, features and functionality already in the Beta build are relatively
    stable and should not change radically (although they may be tweaked based on
    developer feedback). Any details discussed around unimplemented features and functionality
    are much more tentative and may change in future builds.'
