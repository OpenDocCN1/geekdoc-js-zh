    ## AIR 实用技巧\n\n本章描述了开发 AIR 应用程序时常见任务的解决方案。本章中的解决方案阐述了 AIR 应用程序开发中使用的许多概念，并提供了可在你的应用程序中利用的、可工作的\
    \ HTML 和 JavaScript 代码。\n\n> **注意**\n\n本章中的所有示例都假设你正在使用 `AIRAliases.js` 文件。\n\n\
    ## 应用程序外观\n\n### 添加自定义控件\n\n**问题**\n\n你想为你的应用程序创建自定义的窗口外观，并需要用户能够关闭和最小化应用程序。\n\
    \n**解决方案**\n\n使用 Adobe AIR 中的原生窗口 API 来连接最小化和关闭按钮的功能。\n\n### 讨论\n\n虽然 Adobe AIR\
    \ 允许开发者完全定义和自定义应用程序的窗口外观，但重要的是要记住，应用程序负责处理通常可能发生的所有类型的窗口事件。这意味着需要将各个视觉元素与其相应的操作系统事件连接起来。\n\
    \n代表主应用程序窗口的 `NativeWindow` 实例无法直接从主 HTML DOM 内部访问。使用 AIR API，应用程序可以遍历 HTML 控件外部，到达\
    \ Stage，并获取其 `NativeWindow` 实例的引用。一旦获得了原生窗口的引用，就可以调用相应的方法来触发操作系统特定的事件（反之亦然）。对于能够最小化窗口的情况，应用程序可以使用\
    \ `NativeWindow.minimize()`；对于关闭窗口的情况，则可以使用 `NativeWindow.close()`：\n\n```\nwindow.htmlControl.stage.window.minimize();\n\
    window.htmlControl.stage.window.close();\n```\n\n`NativeWindow.close()` 事件并不一定会终止应用程序。如果只有一个应用程序窗口可用，应用程序将终止。如果有多个窗口，它们将关闭，直到只剩一个窗口。关闭最后一个窗口将终止应用程序。\n\
    \n### application.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n\
    <application\n    xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n    appId=\"\
    com.adobe.demo.html.CustomChrome\"\n    version=\"1.0 Beta\">\n\n    <name>Custom\
    \ Chrome</name>\n    <title>Custom Chrome</title>\n\n    <rootContent\n      \
    \  visible=\"true\"\n        transparent=\"true\"\n        systemChrome=\"none\"\
    \n        width=\"206\"\n        height=\"206\">\n        custom.html\n    </rootContent>\n\
    \n</application>\n```\n\n### index.html\n\n```html\n<html>\n<head>\n\n<title>Custom\
    \ Window Controls</title>\n\n<style>\nbody {\n    background-image: url( 'custom-chrome.gif'\
    \ );\n    font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;\n    font-size:\
    \ 12px;\n}\n\n#closer {\n    position: absolute;\n    width: 70px;\n    left:\
    \ 68px;\n    top: 105px;\n}\n\n#minimize {\n    position: absolute;\n    width:\
    \ 70px;\n    left: 68px;\n    top: 75px;\n}\n\ntextarea {\n    position: absolute;\n\
    \    left: 8px;\n    right: 8px;\n    bottom: 8px;\n    top: 36px;\n    border-color:\
    \ #B3B3B3;\n}\n```\n"
