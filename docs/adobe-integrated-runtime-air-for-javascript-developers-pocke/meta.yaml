  - '[PAGE 163]


    Table A-1 provides a description of the command-line arguments for ADL.


    Table A-1. ADL command-line arguments


    | Option | Description |

    |---|---|

    | -runtime | Optional argument that specifies the directory that contains the
    AIR runtime that should be used. |

    | path-app-xml | The application descriptor file for the application that should
    be launched. |

    | path-to-root-dir | Optional argument that specifies the directory that contains
    the application descriptor file |

    | -- | Any arguments specified after this argument will be passed to the application
    as startup/command-line arguments, and can be accessed from the application via
    the InvokeEvent |


    # ADT


    ADT is a command-line tool that packages AIR applications into redistributable
    AIR files. AIR can then install the AIR application from that AIR file.


    Typically, you want to call the ADT tool in the following way:


    ```

    adt -package HelloWorld.air application.xml HelloWorld.swf

    ```


    In this example, the ADT tool creates an AIR file named *HelloWorld.air* based
    on the *application.xml* application descriptor file.


    The syntax of the ADT command is:


    ```

    adt -package <air-file> <app-xml> <fileOrDir>* ( -C <dir> <fileOrDir>+ )*

    ```'
  - '[PAGE 164]


    Table A-2 shows the command-line options for ADT.


    # Table A-2. Command-line options for ADT


    | Option | Description |

    | :--- | :--- |

    | -package | The first argument must be -package. |

    | air-file | The relative or absolute path to the AIR to be created by ADT. |

    | app-xml | The relative or absolute path to the application descriptor file for
    the application. |

    | fileOrDir | One or more file or directory names identifying other files to be
    included in the package. Each successive file or directory name should be separated
    by a space.

    If a directory name is specified, then all of the files in that directory and
    its subdirectories will be included. However, files that are marked hidden in
    the file system will be ignored.

    If any of the files listed is the same as the file specified in the <app-xml>
    parameter, then it will be ignored; it will not be added to the package file a
    second time.

    These files and directories will be copied into the application install directory
    when the application is installed. |

    | -C <dir> | This changes the root directory path for subsequent files or directories
    listed in the command line. |'
