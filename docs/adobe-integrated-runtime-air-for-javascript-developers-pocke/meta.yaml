    +   1. Create a new folder called `AIRHelloWorld`.

    2. Inside of this folder, create two new files called `AIRHelloWorld.html` and
    `AIRHelloWorld.xml`.

    3. Open each of these files using your favorite text or HTML editor/IDE.


    # Understanding application descriptor files


    The application descriptor file is an XML file required for each AIR application.
    It provides general metadata (such as application name and description) to Adobe
    AIR, as well as information on how the application should be run. This includes
    specifying the root application file for the application and the window mode that
    the initial application window should use.


    First, let’s look at the entire application descriptor file (`AIRHelloWorld.xml`)
    for our application, and then we will go into more detail on each item within
    the file.


    > **TIP**


    You can find a sample application descriptor file in the AIR SDK in the templates
    folder.'
- md: "## Open AIRHelloWorld.xml and type in the following text:\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<application xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\
    \n             appId=\"com.oreilly.AIRHelloWorld\"\n             version=\"1.0\"\
    >\n\n    <name>AIRHelloWorld</name>\n    <title>AIRHelloWorld Installer</title>\n\
    \    <description>Simple Hello World Example\n        using HTML</description>\n\
    \    <copyright></copyright>\n\n    <rootContent systemChrome=\"standard\"\n \
    \                transparent=\"false\" visible=\"true\">\n        ApolloHelloWorld.html</rootContent>\n\
    \n</application>\n```\n\nThe content should be pretty self-explanatory, but let's\
    \ go through it line by line to understand what is going on.\n\n```xml\n<application\
    \ xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n             appId=\"\
    com.oreilly.AIRHelloWorld\"\n             version=\"1.0\">\n```\n\nThere are two\
    \ items worth pointing out here. First, the namespace definition:\n\n```xml\n\
    xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n```\n\nThis specifies the\
    \ build of Adobe AIR that the application targets. In this case, it specifies\
    \ 1.0.M4, which is the public Beta.\n\nThe appId property is important, and specifies\
    \ a unique ID for the AIR application. Adobe AIR uses this ID to determine one\
    \ application from another.\n\nAs you can see, it uses the reverse domain format,\
    \ which you may be familiar with from some programming languages such as Java,\
    \ ActionScript, and some JavaScript frameworks. You can create your own ID using\
    \ your domain name and application name.\n\nThe next section of elements specify\
    \ general metadata about the application:\n\n```xml\n<name>AIRHelloWorld</name>\n\
    <title>AIRHelloWorld Installer</title>\n<description>Simple Hello World Example\
    \ using HTML</description>\n<copyright></copyright>\n```\n\n| Element | Description\
    \ |\n| :--- | :--- |\n| name | The name of the application. This is the name that\
    \ will be exposed to the operating system and user. |\n| title | The title that\
    \ will be used for the application installer. |\n| description | A human readable\
    \ description of the application that will be presented to the user during the\
    \ installation process. |\n| copyright | Optional. Allows the specification of\
    \ Copyright information about the application. |\n\nThe next element is the `rootContent`\
    \ tag, which tells Adobe AIR which application file is the main root content of\
    \ the application:\n\n```xml\n<rootContent systemChrome=\"standard\" transparent=\"\
    false\" visible=\"true\">ApolloHelloWorld.html</rootContent>\n```\n\nThe value\
    \ of the element should point to the main root file of the application, which,\
    \ in this case, is an HTML file.\n\n> **TIP**\n\nThe application descriptor file\
    \ and root content file must be in the same folder.\n\nThe `rootContent` element\
    \ has a number of attributes that specify the initial window parameters and chrome\
    \ of the application when it is first launched.\n\n| Element | Description |\n\
    | :--- | :--- |\n| systemChrome | The type of systemChrome that the application\
    \ should use (\"standard\" or \"none\"). |\n| transparent | Whether the application\
    \ background should be transparent. If systemChrome is set to standard, this property\
    \ is true. |\n| visible | Whether the application is visible when it is first\
    \ launched. This is useful if your application needs to perform some complex initialization\
    \ before displaying the UI to the user. |\n\nFor our example, we will use the\
    \ operating system's window chrome.\n\nThis is all that is required for the application\
    \ descriptor file for our application. At this point, we are ready to create the\
    \ main HTML file for our application.\n\n## Creating the root application file\n\
    \nThe root application file is the main file for the application that will be\
    \ loaded when the application is launched. This file can be either a compiled\
    \ Flash file (SWF) or an HTML file.\n\nFor this chapter, we will create a very\
    \ simple HTML file in order to ensure that our development environment is configured\
    \ correctly. We will cover more advanced AIR API usage in Chapters 3 and 4.\n\n\
    ```html\n<html>\n<head>\n    <title>AIRHelloWorld</title>\n    <script>\n    \
    \    function init()\n        {\n            runtime.trace(\"init function called\"\
    );\n        }\n    </script>\n</head>\n<body onload=\"init()\">\n    <div align=\"\
    center\">Hello World</div>\n</body>\n</html>\n```\n\nAs you can see, this is a\
    \ very basic HTML file that displays “Hello World” and calls a JavaScript function\
    \ once the file has loaded and initialized.\n\nThere are a couple of lines worth\
    \ pointing out:\n\n```html\n<body onload=\"init()\">\n```\n\nWe just use the standard\
    \ onload event on the body element to get an entry point for JavaScript into our\
    \ application:\n\n```javascript\n<script>\n    function init()\n    {\n      \
    \  ...\n    }\n</script>\n```\n\nWe then use a standard JavaScript function to\
    \ capture the onload event.\n\n## Accessing AIR APIs\n\nLooking at the init JavaScript\
    \ function, you’ll see some code you may not be familiar with:\n\n```javascript\n\
    runtime.trace(\"init function called\");\n```\n\nThis is the only AIR-specific\
    \ code/markup in the entire application. The `runtime` property is a property\
    \ placed on the `window` object by Adobe AIR which provides an entry point into\
    \ the Adobe AIR engine and APIs. The `trace` function is a top-level AIR API which\
    \ takes a string, and prints it out to the command line (when the application\
    \ is launched via the command line).\n\nAll access to AIR-specific APIs (including\
    \ Flash Player APIs) are accessed from JavaScript via the `runtime` property.\
    \ We will cover this in more detail throughout the rest of the book.\n\nChecking\
    \ for the existence of the runtime property is a simple way to determine whether\
    \ your HTML and JavaScript application is running within Adobe AIR.\n\n```javascript\n\
    if(window.runtime)\n{\n    //running within AIR\n}\n```\n\nNow that we have created\
    \ both the application descriptor file, as well as the root HTML application file,\
    \ we are ready to run and test our application within the runtime.\n\n## Testing\
    \ the Application\n\nWhile there are a number of HTML IDEs (such as Dreamweaver)\
    \ that are adding support for launching and testing AIR applications directly\
    \ from within the IDE, we will focus on launching and testing AIR applications\
    \ using the ADL command-line tool included within the SDK. This will provide a\
    \ solid basis for an understanding of what is going on. It will also provides\
    \ the most flexibility in integrating the development process with other IDEs,\
    \ editors and work-flows.\n\n## Using ADL to Launch the Application\n\nThe first\
    \ step in testing the application is to run it as an AIR application to make sure\
    \ that:\n\n- There are no errors in the application descriptor file\n- The application\
    \ launches\n- The HTML renders correctly\n- The JavaScript code functions as expected\n\
    \nWhile we could package up the entire application and then install it, this would\
    \ be tedious, and make it difficult to quickly iterate on and test new versions.\
    \ Luckily, the Adobe AIR SDK provides a command-line tool called ADL, which allows\
    \ you to launch an AIR application without having to first install it.\n\nIn order\
    \ to test our application:\n\n1. Open a Terminal window (on Mac) or a Console\
    \ window (on Windows).\n2. Change to the directory that contains the *AIRHelloWorld.html*\
    \ and *AIRHelloWorld.xml* files.\n3. Run ADL with the following command, passing\
    \ in the name of the application descriptor file:\n   `adl AIRHelloWorld.xml`\n\
    \nThis should launch your application within the standard system chrome of your\
    \ operating system.\n\n![](img/a312eae733f8dd0e40d674223b63428e_56_0.png)\n\n\
    Figure 2-2. AIRHelloWorld application running from ADL on Mac OS X\n\nIf the application\
    \ does not launch correctly, or if you get an error, check the following:\n\n\
    - Make sure you have configured the SDK correctly, so that the ADL tool can be\
    \ found.\n- Make sure that you are running the ADL command from the same directory\
    \ that contains the *AIRHelloWorld.xml* file.\n- Make sure that your application\
    \ descriptor file contains well-formed XML.\n- Make sure the information in the\
    \ application descriptor file is correct. Pay particular attention to the application\
    \ attributes and the rootContent value.\n- Make sure that the *AIRHelloWorld.html*\
    \ and *AIRHelloWorld.xml* files are in the same directory.\n\nOnce you have fixed\
    \ any issues, and your application is running correctly, you can explore how to\
    \ get information from the application at runtime.\n\n## Capturing Output from\
    \ the Application at Runtime\n\nWhen running applications from the command line\
    \ via ADL, there are a number of ways to get runtime information and debugging\
    \ information from the application.\n\n### Runtime JavaScript errors\n\nAny runtime\
    \ errors that arise from JavaScript execution while an AIR application launched\
    \ via ADL is running will be output to ADL’s standard out.\n\nLet’s modify our\
    \ application to cause it to generate a JavaScript runtime error. Change the contents\
    \ of *AIRHelloWorld.html* to:\n\n```html\n<html>\n<head>\n    <title>AIRHelloWorld</title>\n\
    \    <script>\n```"
  mdcn: "\n## 打开 AIRHelloWorld.xml 并输入以下文本：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<application xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n\
    \             appId=\"com.oreilly.AIRHelloWorld\"\n             version=\"1.0\"\
    >\n\n    <name>AIRHelloWorld</name>\n    <title>AIRHelloWorld Installer</title>\n\
    \    <description>Simple Hello World Example\n        using HTML</description>\n\
    \    <copyright></copyright>\n\n    <rootContent systemChrome=\"standard\"\n \
    \                transparent=\"false\" visible=\"true\">\n        ApolloHelloWorld.html</rootContent>\n\
    \n</application>\n```\n\n这段内容的含义应该不言自明，但让我们逐行分析一下，以了解具体发生了什么。\n\n```xml\n<application\
    \ xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n             appId=\"\
    com.oreilly.AIRHelloWorld\"\n             version=\"1.0\">\n```\n\n这里有两点值得指出。首先，命名空间定义：\n\
    \n```xml\nxmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n```\n\n这指定了应用程序所针对的\
    \ Adobe AIR 版本。在此例中，它指定的是 1.0.M4，即公开 Beta 版。\n\n`appId` 属性很重要，它为 AIR 应用程序指定了一个唯一标识符。Adobe\
    \ AIR 使用此 ID 来区分不同的应用程序。\n\n如你所见，它使用了反向域名格式，你可能在 Java、ActionScript 和一些 JavaScript\
    \ 框架等编程语言中对此有所了解。你可以使用自己的域名和应用程序名称来创建自己的 ID。\n\n接下来的元素部分指定了应用程序的一般元数据：\n\n```xml\n\
    <name>AIRHelloWorld</name>\n<title>AIRHelloWorld Installer</title>\n<description>Simple\
    \ Hello World Example using HTML</description>\n<copyright></copyright>\n```\n\
    \n| 元素 | 描述 |\n| :--- | :--- |\n| name | 应用程序的名称。这是将暴露给操作系统和用户的名称。 |\n| title\
    \ | 将用于应用程序安装程序的标题。 |\n| description | 应用程序的可读描述，将在安装过程中呈现给用户。 |\n| copyright\
    \ | 可选。允许指定应用程序的版权信息。 |\n\n下一个元素是 `rootContent` 标签，它告诉 Adobe AIR 哪个应用程序文件是应用程序的主根内容：\n\
    \n```xml\n<rootContent systemChrome=\"standard\" transparent=\"false\" visible=\"\
    true\">ApolloHelloWorld.html</rootContent>\n```\n\n该元素的值应指向应用程序的主根文件，在本例中是一个 HTML\
    \ 文件。\n\n> **提示**\n\n应用程序描述符文件和根内容文件必须位于同一文件夹中。\n\n`rootContent` 元素具有多个属性，用于指定应用程序首次启动时的初始窗口参数和外观。\n\
    \n| 元素 | 描述 |\n| :--- | :--- |\n| systemChrome | 应用程序应使用的系统外观类型（“standard” 或 “none”）。\
    \ |\n| transparent | 应用程序背景是否应透明。如果 `systemChrome` 设置为 `standard`，则此属性为 `true`。\
    \ |\n| visible | 应用程序在首次启动时是否可见。如果您的应用程序需要在向用户显示 UI 之前执行一些复杂的初始化，这会很有用。 |\n\n\
    对于我们的示例，我们将使用操作系统的窗口外观。\n\n这就是我们的应用程序描述符文件所需的全部内容。至此，我们已准备好创建应用程序的主 HTML 文件。\n\
    \n## 创建根应用程序文件\n\n根应用程序文件是应用程序启动时将加载的主文件。此文件可以是已编译的 Flash 文件（SWF），也可以是 HTML 文件。\n\
    \n在本章中，我们将创建一个非常简单的 HTML 文件，以确保我们的开发环境配置正确。我们将在第 3 章和第 4 章介绍更高级的 AIR API 用法。\n\
    \n```html\n<html>\n<head>\n    <title>AIRHelloWorld</title>\n    <script>\n  \
    \      function init()\n        {\n            runtime.trace(\"init function called\"\
    );\n        }\n    </script>\n</head>\n<body onload=\"init()\">\n    <div align=\"\
    center\">Hello World</div>\n</body>\n</html>\n```\n\n如你所见，这是一个非常基础的 HTML 文件，显示\
    \ “Hello World”，并在文件加载并初始化后调用一个 JavaScript 函数。\n\n有几行代码值得指出：\n\n```html\n<body\
    \ onload=\"init()\">\n```\n\n我们只是在 `body` 元素上使用标准的 `onload` 事件，作为 JavaScript 进入应用程序的入口点：\n\
    \n```javascript\n<script>\n    function init()\n    {\n        ...\n    }\n</script>\n\
    ```\n\n然后我们使用一个标准的 JavaScript 函数来捕获 `onload` 事件。\n\n## 访问 AIR API\n\n查看 `init`\
    \ JavaScript 函数，你会看到一些你可能不熟悉的代码：\n\n```javascript\nruntime.trace(\"init function\
    \ called\");\n```\n\n这是整个应用程序中唯一的 AIR 特定代码/标记。`runtime` 属性是 Adobe AIR 放置在 `window`\
    \ 对象上的一个属性，它提供了进入 Adobe AIR 引擎和 API 的入口点。`trace` 函数是一个顶层的 AIR API，它接收一个字符串，并将其输出到命令行（当通过命令行启动应用程序时）。\n\
    \n所有对 AIR 特定 API（包括 Flash Player API）的访问都是通过 JavaScript 中的 `runtime` 属性进行的。我们将在本书的后续部分更详细地介绍这一点。\n\
    \n检查 `runtime` 属性是否存在是判断你的 HTML 和 JavaScript 应用程序是否在 Adobe AIR 内运行的一种简单方法。\n\n\
    ```javascript\nif(window.runtime)\n{\n    // 在 AIR 内运行\n}\n```\n\n现在我们已经创建了应用程序描述符文件和根\
    \ HTML 应用程序文件，我们已准备好在运行时中运行和测试我们的应用程序。\n\n## 测试应用程序\n\n虽然有越来越多的 HTML IDE（如 Dreamweaver）正在添加对直接从\
    \ IDE 内启动和测试 AIR 应用程序的支持，但我们将重点介绍如何使用 SDK 中包含的 ADL 命令行工具来启动和测试 AIR 应用程序。这将为理解其工作原理提供坚实的基础，并且在将开发流程与其他\
    \ IDE、编辑器和工作流集成时，它也能提供最大的灵活性。\n\n## 使用 ADL 启动应用程序\n\n测试应用程序的第一步是将其作为 AIR 应用程序运行，以确保：\n\
    \n- 应用程序描述符文件中没有错误\n- 应用程序能够启动\n- HTML 能够正确渲染\n- JavaScript 代码能按预期工作\n\n虽然我们可以打包整个应用程序然后安装它，但这会很繁琐，并且难以快速迭代和测试新版本。幸运的是，Adobe\
    \ AIR SDK 提供了一个名为 ADL 的命令行工具，它允许你无需先安装即可启动 AIR 应用程序。\n\n为了测试我们的应用程序：\n\n1. 打开终端窗口（在\
    \ Mac 上）或控制台窗口（在 Windows 上）。\n2. 切换到包含 *AIRHelloWorld.html* 和 *AIRHelloWorld.xml*\
    \ 文件的目录。\n3. 使用以下命令运行 ADL，并传入应用程序描述符文件的名称：\n   `adl AIRHelloWorld.xml`\n\n这应该会在你的操作系统标准窗口外观中启动你的应用程序。\n\
    \n![](img/a312eae733f8dd0e40d674223b63428e_56_0.png)\n\n图 2-2. 在 Mac OS X 上通过\
    \ ADL 运行的 AIRHelloWorld 应用程序\n\n如果应用程序未能正确启动，或者你遇到错误，请检查以下几点：\n\n- 确保你已正确配置 SDK，以便可以找到\
    \ ADL 工具。\n- 确保你是在包含 *AIRHelloWorld.xml* 文件的同一目录中运行 ADL 命令。\n- 确保你的应用程序描述符文件包含格式正确的\
    \ XML。\n- 确保应用程序描述符文件中的信息正确。特别注意应用程序属性和 `rootContent` 值。\n- 确保 *AIRHelloWorld.html*\
    \ 和 *AIRHelloWorld.xml* 文件位于同一目录中。\n\n一旦你修复了任何问题，并且应用程序运行正确，你就可以探索如何在运行时从应用程序获取信息。\n\
    \n## 在运行时捕获应用程序的输出\n\n当通过 ADL 从命令行运行应用程序时，有多种方法可以从应用程序获取运行时信息和调试信息。\n\n### 运行时\
    \ JavaScript 错误\n\n当通过 ADL 启动的 AIR 应用程序运行时，JavaScript 执行过程中出现的任何运行时错误都将输出到 ADL\
    \ 的标准输出。\n\n让我们修改应用程序以使其产生一个 JavaScript 运行时错误。将 *AIRHelloWorld.html* 的内容更改为：\n\
    \n```html\n<html>\n<head>\n    <title>AIRHelloWorld</title>\n    <script>\n```\n"
