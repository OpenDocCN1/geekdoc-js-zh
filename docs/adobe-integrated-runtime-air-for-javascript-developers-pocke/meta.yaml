- md: "# Synchronously Reading Text from a File\n\nYou want to read the contents of\
    \ a small text file into your application.\n\nUse the various file APIs provided\
    \ by Adobe AIR to locate, open, and read text files.\n\nSmall files that contain\
    \ text content can be read using the `FileStream.open()` method. This method opens\
    \ a file synchronously for reading. Synchronous access requires less code, but\
    \ also blocks any additional user input until the data has been read. When using\
    \ asynchronous access, additional user input is not blocked, but event handlers\
    \ must be registered, which results in more code overhead.\n\n> **TIP**\n\nWhile\
    \ accessing XML files as text is possible, the result of this approach is a document\
    \ object that can't be readily manipulated. Accessing an XML file for use as a\
    \ data source is often more easily handled using XMLHttpRequest or wrapper functionality\
    \ offered by most JavaScript libraries.\n\nThe steps for synchronously reading\
    \ a file are almost always the same:\n\n1.  Get a File reference\n2.  Create a\
    \ FileStream object\n3.  Open the stream for synchronous access\n4.  Call the\
    \ appropriate FileStream read methods\n5.  Close the file\n\nThe first step to\
    \ reading a text file is to get a reference to the resource on disk. Establishing\
    \ a reference can be accomplished by programmatically designating a path using\
    \ the appropriate property on the File object such as `File.applicationStorageDirectory`.\
    \ Calling `File.resolve()` will also be required when using this approach as the\
    \ static File class properties always return a directory:\n\n```javascript\nvar\
    \ file =\n    air.File.applicationStorageDirectory.resolve( \"myfile.txt\" );\n\
    ```\n\nThe FileStream class has an empty constructor and can be instantiated anywhere\
    \ in your application. The file reference just established is used during the\
    \ physical process of opening the file. The mode for which the file is going to\
    \ be opened must also be specified.\n\nThe FileMode object serves no other purpose\
    \ but to provide constants for the types of file access that can be performed.\
    \ These operations are `FileMode.READ`, `FileMode.WRITE`, `FileMode.UPDATE`, and\
    \ `FileMode.APPEND`:\n\n```javascript\nvar stream = new air.FileStream();\nstream.open(\
    \ file, air.FileMode.READ );\n```\n\nThere are three FileStream methods that can\
    \ be used to read character data from a file. The `FileStream.readUTF()` and `FileStream.readUTFBytes()`\
    \ methods are specifically tuned for UTF data.\n\nIf this is the target format\
    \ of the data for the application, then these methods should be used directly.\
    \ In the case of other character sets, the `FileStream.readMultiBytes()` method\
    \ can be used to specify the target format. Additional character sets are specified\
    \ in the form of a string such as “us-ascii”. There is also a convenience property\
    \ on the File object to use the default system character set, `File.systemCharset`.\n\
    \nThe number of bytes to be read also needs to be specified in the case of `FileStream.readUTFBytes()`\
    \ and `FileStream.readMultiBytes()`. This sizing will depend largely on the requirements\
    \ of the application. In the cases where reading the entire file is required,\
    \ the number of bytes that are available to be read can be found on the `FileStream.bytesAvailable`\
    \ property:\n\n```javascript\nvar data =\n    stream.readMultiBytes( stream.bytesAvailable,\n\
    \                           air.File.systemCharset );\n```\n\nOnce the contents\
    \ of a file have been read, it is important to close the file. This operation\
    \ will allow other applications to access the file:\n\n```javascript\nstream.close();\n\
    ```\n\nAlthough a demonstrable amount of flexibility has been provided by Adobe\
    \ AIR, the actual process in its entirety is considerably concise. This brevity\
    \ is provided when performing synchronous data access operations. Synchronous\
    \ file access should be reserved for smaller files regardless of reading or writing\
    \ character or binary data:\n\n```html\n<html>\n<head>\n<title>Synchronous File\
    \ Access</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\
    <script>\nvar file = null;\nvar stream = null;\n\nfunction doLoad()\n{\n    var\
    \ data = null;\n\n    file = air.File.applicationStorageDirectory.resolve(\n \
    \       \"myFile.txt\" );\n\n    stream = new air.FileStream();\n    stream.open(\
    \ file, air.FileMode.READ );\n    data = stream.readMultiByte( stream.bytesAvailable,\n\
    \        air.File.systemCharset );\n    stream.close();\n\n    document.getElementById(\
    \ \"editor\" ).value = data;\n}\n</script>\n\n</head>\n<body onload=\"doLoad()\"\
    >\n\n<textarea id=\"editor\"></textarea>\n\n</body>\n</html>\n```\n\n# Asynchronously\
    \ Reading Text from a File\n\n**Problem**\nYou want to read a large amount of\
    \ text into your application.\n\n**Solution**\nUse asynchronous file APIs to load\
    \ the text, ensuring application execution is not blocked while the file is being\
    \ loaded.\n\n**Discussion**\nFiles containing a large amount of data should be\
    \ read using the `FileStream.openAsync()` method. This method opens a file asynchronously\
    \ for reading or writing and won't block additional user input. Asynchronous file\
    \ operations achieve this goal by raising events during processing. The result\
    \ is that event listeners must be created and registered on the FileStream object.\n\
    \nThe steps for asynchronously reading a file are almost always the same:\n\n\
    1.  Get a File reference\n2.  Create a FileStream object\n3.  Create event handlers\
    \ for processing data\n4.  Add event listeners for asynchronous operations\n5.\
    \  Open the stream for asynchronous access\n6.  Close the file\n\nThe first step\
    \ to reading a text file is to get a reference to the resource on disk. Establishing\
    \ a reference can be accomplished by programmatically designating a path using\
    \ the appropriate property on the File object such as `File.applicationStorageDirectory`:\n\
    \n```javascript\nvar file =\n    air.File.applicationStorageDirectory.resolve(\
    \ \"myfile.txt\" );\n```\n\nA FileStream instance is necessary in order to read\
    \ or write to the file:\n\n```javascript\nstream = new air.FileStream();\n```\n\
    \nBefore registering event handlers on a FileStream object, those handlers will\
    \ need to be created. The events that are triggered by file IO operations using\
    \ the FileStream class will always pass an event object as an argument. The properties\
    \ on the event object will depend on the type of event being raised. This object\
    \ can be helpful in determining the target FileStream object, how much data is\
    \ available for reading, how much data is waiting to be written, and so on:\n\n\
    ```javascript\nfunction doProgress( event )\n{\n    // Read all the data that\
    \ is currently available\n    var data = stream.readMultiByte( stream.\n    bytesAvailable,\
    \ air.File.systemCharset );\n\n    // Append the most recent content\n    document.getElementById(\"\
    editor\").value += data;\n\n    // Close the file after the entire contents have\
    \ been read\n    if( event.bytesLoaded == event.bytesTotal )\n    {\n        stream.close();\n\
    \    }\n}\n```\n\nRegistering for events takes place using the `addEventListener()`\
    \ API:\n\n```javascript\nstream.addEventListener( air.ProgressEvent.PROGRESS,\n\
    doProgress );\n```\n\nOpening a stream for asynchronous access is accomplished\
    \ using the `FileStream.openAsync()`. The `FileStream.openAsync()` method takes\
    \ two arguments that specify the file being accessed and the type of access being\
    \ performed.\n\nThe FileMode object serves no other purpose but to provide constants\
    \ for the types of file access that can be performed. These operations are `FileMode.READ`,\
    \ `FileMode.WRITE`, `FileMode.UPDATE`, and `FileMode.APPEND`:\n\n```javascript\n\
    stream.openAsync( file, air.FileMode.READ );\n```\n\nAs soon as the file is opened\
    \ and new data is available in the stream, the `ProgressEvent.PROGRESS` event\
    \ is triggered. Depending on the size of the file, as well as machine and network\
    \ characteristics, not all the bytes may be read in a single pass. In many cases,\
    \ additional read operations take place, raising a `ProgressEvent.PROGRESS` event\
    \ for each iteration.\n\nOnce all of the data has been read from the file, an\
    \ `Event.COMPLETE` event is broadcast.\n\nOnce the file has been read, it is important\
    \ to close the file stream in order to ensure that other applications can access\
    \ it:\n\n```javascript\nstream.close();\n```"
  mdcn: "\n# 从文件同步读取文本\n\n你需要将一个小文本文件的内容读取到应用程序中。\n\n使用 Adobe AIR 提供的各种文件 API 来定位、打开和读取文本文件。\n\
    \n包含文本内容的小文件可以使用 `FileStream.open()` 方法来读取。此方法以同步方式打开文件进行读取。同步访问需要较少的代码，但在数据读取完成之前会阻塞任何额外的用户输入。使用异步访问时，不会阻塞额外的用户输入，但必须注册事件处理程序，这会导致更多的代码开销。\n\
    \n> **提示**\n\n虽然可以将 XML 文件作为文本来访问，但此方法的结果是一个无法直接操作的文档对象。将 XML 文件用作数据源时，通常使用 XMLHttpRequest\
    \ 或大多数 JavaScript 库提供的包装功能来处理会更容易。\n\n同步读取文件的步骤几乎总是相同的：\n\n1.  获取一个 File 引用\n\
    2.  创建一个 FileStream 对象\n3.  以同步访问方式打开流\n4.  调用适当的 FileStream 读取方法\n5.  关闭文件\n\n\
    读取文本文件的第一步是获取磁盘上资源的引用。可以通过在 File 对象上使用适当的属性（如 `File.applicationStorageDirectory`）以编程方式指定路径来建立引用。使用此方法时还需要调用\
    \ `File.resolve()`，因为静态 File 类属性总是返回一个目录：\n\n```javascript\nvar file =\n    air.File.applicationStorageDirectory.resolve(\
    \ \"myfile.txt\" );\n```\n\nFileStream 类有一个空构造函数，可以在应用程序中的任何位置实例化。刚刚建立的文件引用在打开文件的物理过程中使用。还必须指定文件将以何种模式打开。\n\
    \nFileMode 对象除了为可执行的文件访问类型提供常量外，没有其他用途。这些操作是 `FileMode.READ`、`FileMode.WRITE`、`FileMode.UPDATE`\
    \ 和 `FileMode.APPEND`：\n\n```javascript\nvar stream = new air.FileStream();\n\
    stream.open( file, air.FileMode.READ );\n```\n\n有三个 FileStream 方法可用于从文件中读取字符数据。`FileStream.readUTF()`\
    \ 和 `FileStream.readUTFBytes()` 方法是专门为 UTF 数据调整的。\n\n如果这是应用程序的数据目标格式，则应直接使用这些方法。对于其他字符集，可以使用\
    \ `FileStream.readMultiBytes()` 方法来指定目标格式。其他字符集以字符串形式指定，例如 “us-ascii”。File 对象上还有一个便捷属性可用于使用默认系统字符集，即\
    \ `File.systemCharset`。\n\n在使用 `FileStream.readUTFBytes()` 和 `FileStream.readMultiBytes()`\
    \ 的情况下，还需要指定要读取的字节数。此大小主要取决于应用程序的要求。在需要读取整个文件的情况下，可通过 `FileStream.bytesAvailable`\
    \ 属性找到可读取的字节数：\n\n```javascript\nvar data =\n    stream.readMultiBytes( stream.bytesAvailable,\n\
    \                           air.File.systemCharset );\n```\n\n一旦文件内容被读取完毕，关闭文件就很重要。此操作将允许其他应用程序访问该文件：\n\
    \n```javascript\nstream.close();\n```\n\n尽管 Adobe AIR 提供了相当大的灵活性，但整个实际过程相当简洁。这种简洁性是在执行同步数据访问操作时提供的。无论读取字符数据还是二进制数据，同步文件访问都应保留给较小的文件使用：\n\
    \n```html\n<html>\n<head>\n<title>Synchronous File Access</title>\n<script type=\"\
    text/javascript\" src=\"AIRAliases.js\"></script>\n<script>\nvar file = null;\n\
    var stream = null;\n\nfunction doLoad()\n{\n    var data = null;\n\n    file =\
    \ air.File.applicationStorageDirectory.resolve(\n        \"myFile.txt\" );\n\n\
    \    stream = new air.FileStream();\n    stream.open( file, air.FileMode.READ\
    \ );\n    data = stream.readMultiByte( stream.bytesAvailable,\n        air.File.systemCharset\
    \ );\n    stream.close();\n\n    document.getElementById( \"editor\" ).value =\
    \ data;\n}\n</script>\n\n</head>\n<body onload=\"doLoad()\">\n\n<textarea id=\"\
    editor\"></textarea>\n\n</body>\n</html>\n```\n\n# 从文件异步读取文本\n\n**问题**\n你想将大量文本读取到应用程序中。\n\
    \n**解决方案**\n使用异步文件 API 来加载文本，确保在文件加载过程中应用程序执行不会被阻塞。\n\n**讨论**\n包含大量数据的文件应使用 `FileStream.openAsync()`\
    \ 方法读取。此方法以异步方式打开文件进行读取或写入，并且不会阻塞额外的用户输入。异步文件操作通过在处理过程中引发事件来实现此目标。其结果是必须在 FileStream\
    \ 对象上创建并注册事件监听器。\n\n异步读取文件的步骤几乎总是相同的：\n\n1.  获取一个 File 引用\n2.  创建一个 FileStream\
    \ 对象\n3.  创建用于处理数据的事件处理程序\n4.  为异步操作添加事件监听器\n5.  以异步访问方式打开流\n6.  关闭文件\n\n读取文本文件的第一步是获取磁盘上资源的引用。可以通过在\
    \ File 对象上使用适当的属性（如 `File.applicationStorageDirectory`）以编程方式指定路径来建立引用：\n\n```javascript\n\
    var file =\n    air.File.applicationStorageDirectory.resolve( \"myfile.txt\" );\n\
    ```\n\n需要一个 FileStream 实例来读取或写入文件：\n\n```javascript\nstream = new air.FileStream();\n\
    ```\n\n在 FileStream 对象上注册事件处理程序之前，需要先创建这些处理程序。使用 FileStream 类的文件 IO 操作触发的事件总是会传递一个事件对象作为参数。事件对象上的属性取决于引发的事件类型。此对象有助于确定目标\
    \ FileStream 对象、有多少数据可供读取、有多少数据等待写入等：\n\n```javascript\nfunction doProgress( event\
    \ )\n{\n    // Read all the data that is currently available\n    var data = stream.readMultiByte(\
    \ stream.\n    bytesAvailable, air.File.systemCharset );\n\n    // Append the\
    \ most recent content\n    document.getElementById(\"editor\").value += data;\n\
    \n    // Close the file after the entire contents have been read\n    if( event.bytesLoaded\
    \ == event.bytesTotal )\n    {\n        stream.close();\n    }\n}\n```\n\n注册事件使用\
    \ `addEventListener()` API：\n\n```javascript\nstream.addEventListener( air.ProgressEvent.PROGRESS,\n\
    doProgress );\n```\n\n以异步访问方式打开流是通过 `FileStream.openAsync()` 完成的。`FileStream.openAsync()`\
    \ 方法接受两个参数，分别指定要访问的文件和执行的访问类型。\n\nFileMode 对象除了为可执行的文件访问类型提供常量外，没有其他用途。这些操作是 `FileMode.READ`、`FileMode.WRITE`、`FileMode.UPDATE`\
    \ 和 `FileMode.APPEND`：\n\n```javascript\nstream.openAsync( file, air.FileMode.READ\
    \ );\n```\n\n一旦文件被打开并且流中有新的数据可用，`ProgressEvent.PROGRESS` 事件就会被触发。根据文件的大小以及机器和网络特性，可能无法在一次读取中读取所有字节。在许多情况下，会发生额外的读取操作，每次迭代都会引发一个\
    \ `ProgressEvent.PROGRESS` 事件。\n\n一旦从文件中读取了所有数据，就会广播一个 `Event.COMPLETE` 事件。\n\n\
    一旦文件被读取完毕，关闭文件流就很重要，以确保其他应用程序可以访问它：\n\n```javascript\nstream.close();\n```\n"
