  md: '# TIP


    Adobe AIR''s support for drag and drop is based on the WebKit implementation.
    You can find more information on this at: http://developer.apple.com/documentation/AppleApplications/Conceptual/SafariJSProgTopics/Tasks/DragAndDrop.html.


    # Discussion


    One of the benefits of developing for the desktop is providing users with a more
    integrated experience when interacting with multiple applications. One of the
    most frequently used user gestures is to drag and drop files, data, and other
    elements between applications and the desktop and between the applications themselves.


    This example will demonstrate how you can accept text being dragged into your
    application and also support dragging text out. It will also show you how to modify
    the drag effect in order to demonstrate for the user what type of drag operations
    he can perform with the element he is dragging.


    There are two flows that are important to consider when using drag and drop operations
    in HTML. First we will examine the flow for HTML elements that want to allow themselves
    to be dragged by users:


    +   1. Element specifies that it is available for drag operations.

    2. User selects the item and starts dragging it.

    3. Element receives an ondragstart event and sets the data which will be transferred
    and also specifies which drag operations are supported.

    4. Element receives ondrag events while the element is being dragged.

    5. User drops the item being dragged and the initiating element receives an ondragend
    event.'
  merge: -1
  pgno: 130
- img_proc: true
  md: "The typical flow for HTML elements that want to receive drop operations are\
    \ as follows:\n\n+   1. User drags an item over the element listening for drop\
    \ events.\n2. Element receives an ondragenter event and specifies which drop operations\
    \ are available.\n3. Element receives ondragover operations continuously as the\
    \ item is dragged over the element.\n4. The user drops the item and the receiving\
    \ element receives an ondrop event.\n5. If the user moves the dragged item outside\
    \ the boundaries of the listening element, it will receive an ondragleave event.\n\
    \nUsers can, by default, drag text elements and URLs. To disable this functionality,\
    \ use the -khtml-user-drag:none style. To override the default data type that\
    \ is being specified, use the -khtml-user-drag:element style and specify listeners\
    \ for the drag events as specified previously.\n\nTo manipulate the data that\
    \ is being transferred between applications, use the dataTransfer object that\
    \ is attached to the event dispatched during drag operations. The dataTransfer\
    \ object has two methods, getData and setData. The setData method takes two parameters,\
    \ the MIME type and the string of data that conforms to that type. The setData\
    \ method can be called multiple times and allows you to store multiple data types.\
    \ For example, if you wanted to specify a \"text/plain\" type and a \"text/uri-list\"\
    \ type, you would do the following:\n\n```\nfunction dropStartListener( event\
    \ )\n{\n    event.dataTransfer.setData( \"text/plain\", \"Adobe\" );\n    event.dataTransfer.setData(\
    \ \"text/uri-list\",\n                                 \"http://www.adobe.com\"\
    \ );\n}\n```"
