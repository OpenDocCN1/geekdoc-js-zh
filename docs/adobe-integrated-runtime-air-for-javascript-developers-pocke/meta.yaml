    \ win.stage.addChild( control );\n}\n</script>\n</head>\n<body onload=\"doLoad()\"\
    >\n</body>\n</html>\n```\n\n# 创建全屏窗口\n\n## 问题\n\n为了提供更多的显示空间或支持额外的交互，你的应用程序需要能够以全屏模式运行。\n\
    \n## 解决方案\n\n`NativeWindow` 类为创建透明和全屏窗口提供了基础。\n\n## 讨论\n\n使用 `NativeWindow` 进行全屏显示与用于自定义窗口的主要区别在于需要额外的初始化选项以及将窗口设置为填充屏幕。要移除任何操作系统特定的窗口界面，请使用\
    \ `NativeWindowInitOptions.systemChrome` 属性。应将 `NativeWindowInitOptions.systemChrome`\
    \ 设置为 `NativeWindowSystemChrome` 类中的四个字符串常量之一（表 4-1）。\n\n### 表 4-1. NativeWindowSystemChrome\
    \ 中的字符串常量\n\n| 字符串常量 | 描述 |\n| --- | --- |\n| `NativeWindowSystemChrome.STANDARD`\
    \ | 这是 `NativeWindow` 的默认值，反映了特定操作系统上使用的窗口界面。 |\n| `NativeWindowSystemChrome.UTILITY`\
    \ | 实用工具界面最适合需要长时间保持打开的相关窗口，例如工具面板。 |\n| `NativeWindowSystemChrome.NONE` | 表示不应有任何界面，并要求应用程序处理所有传统的窗口任务。\
    \ |\n| `NativeWindowSystemChrome.ALTERNATE` | 在 Adobe AIR Beta 版中未实现。 |\n\n要创建没有任何界面的全屏窗口，应将\
    \ `NativeWindowInitOptions.systemChrome` 属性设置为 `NativeWindowSystemChrome.NONE`。然后，应用程序可以调用\
    \ `NativeWindow.maximize()` 方法，或直接设置 `NativeWindow.bounds`。`NativeWindow.bounds`\
    \ 属性接受一个 `flash.geom.Rectangle` 对象，该对象指定了水平和垂直原点，以及宽度和高度。任一方法都会用新创建的原生窗口填充可见屏幕。\n\
    \n```\nvar options = new air.NativeWindowInitOptions();\nvar login = null;\n\n\
    options.minimizable = false;\noptions.maximizable = false;\noptions.resizable\
    \ = false;\noptions.systemChrome = air.NativeWindowSystemChrome.NONE;\n\nlogin\
    \ = new air.NativeWindow( false, options );\nlogin.maximize();\n```\n\n## 提示\n\
    \n如果你遇到一个应用程序无法关闭，但其所有可见窗口都已关闭的情况，那么你可能面临几种不同的挑战。第一种是你从未为 `NativeWindow` 设置大小。第二种是你从未将\
    \ `NativeWindow` 设置为可见。最常见的情况是你使用了 `NativeWindowSystemChrome.NONE`，但从未添加任何内容。\n\
    \n# 文件 API\n\n## 从字符串将文本写入文件\n\n**问题**\n用户已在应用程序中修改了文本内容，并希望将其保存到磁盘以供离线访问。\n\n\
    **解决方案**\n文本写入可以通过 AIR 中的 `File` 和 `FileStream` 类来完成。\n\n**讨论**\n在对磁盘进行任何读写操作之前，应用程序中必须先存在对文件或目录的引用。文件引用可以通过多种方式建立，包括程序化操作和用户选择。这两种方式都使用\
    \ `File` 类来完成。`File` 类还包含指向操作系统常见位置的静态属性。这些位置包括桌面目录、用户目录和文档目录：\n\n```\nvar file\
    \ =\n    air.File.applicationStorageDirectory.resolve( \"myFile.txt\" );\n```\n\
    \n对 `File.resolve()` 的调用会创建一个对位于应用程序存储目录中名为 `myFile.txt` 的文件的引用。一旦建立了引用，就可以在文件\
    \ IO 操作中使用它。请注意，此时文件实际上并未被创建。\n\n使用 `FileStream` 类可以进行实际的磁盘读写操作。`FileStream` 类在其构造函数中不接受任何参数：\n\
    \n```\nvar stream = new air.FileStream();\n```\n\n有了可用的文件引用和实例化的 `FileStream`\
    \ 对象，就可以开始将数据写入磁盘的过程。可写入的数据类型可以是二进制、文本或值对象等任何类型。所有这些都可以通过使用相应的 `FileStream` 方法来访问。\n\
    \n写入文件的第一步是使用 `FileStream.open()` 方法打开它。`FileStream.open()` 方法接受两个参数。第一个参数是先前创建的文件引用，它将是输出的目标。第二个参数是应用程序需要对该文件的访问类型。在将数据写入文件的情况下，`FileMode.WRITE`\
    \ 静态属性最常用。根据应用程序需求，也可以使用 `FileMode.APPEND`：\n\n```\nstream.open( file, air.FileMode.WRITE\
    \ );\n```\n\n写入文本时，应用程序应使用 `FileStream.writeMultiByte()` 以确保使用正确的编码写入数据。`FileStream.writeMultiByte()`\
    \ 方法接受两个参数。第一个参数是要写入磁盘的 `String` 对象（文本）。第二个参数是要使用的字符集。最常见的字符集是操作系统正在使用的字符集，可通过\
    \ `File` 类的 `File.systemCharset` 属性获取：\n\n```\nstream.writeMultiByte( document.getElementById(\
    \ \"txtNote\" ).value, air.File.systemCharset );\n```\n\n将文本写入文件后，关闭文件非常重要，以避免损坏或阻止其他应用程序访问。使用\
    \ `FileStream.close()` 方法可以关闭文件。\n\n> XML 数据本身已经是文本格式，因此可以使用相同的步骤写入磁盘。如果应用程序使用\
    \ `XMLHttpRequest` 对象，那么在大多数情况下仅使用 `myXml.responseText` 属性可能就足够了。\n\n```html\n\
    <html>\n<head>\n\n<title>写入文本</title>\n<script type=\"text/javascript\" src=\"\
    AIRAliases.js\"></script>\n\n<script>\nfunction doLoad()\n{\n    document.getElementById(\
    \ \"btnSave\" ).addEventListener( \"click\", doSave );\n}\n\nfunction doSave()\n\
    {\n    var file =\n    air.File.applicationResourceDirectory.resolve( \"note.txt\"\
    \ );\n    var stream = new air.FileStream();\n\n    stream.open( file, air.FileMode.WRITE\
    \ );\n    stream.writeMultiByte( document.getElementById( \"txtNote\" ).value,\
    \ air.File.systemCharset );\n    stream.close();\n}\n</script>\n</head>\n<body\
    \ onload=\"doLoad()\">\n    <textarea id=\"txtNote\"></textarea>\n    <input id=\"\
    btnSave\" type=\"button\" value=\"保存\" />\n</body>\n</html>\n```\n"
