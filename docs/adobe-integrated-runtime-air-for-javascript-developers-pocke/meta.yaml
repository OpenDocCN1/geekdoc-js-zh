    # Service and Server Monitoring


    # Monitoring Connectivity to an HTTP Server


    **Problem**

    Your application needs to monitor and determine whether a specific HTTP server
    can be reached.


    **Solution**

    Use the URLMonitor class to detect network state changes in HTTP/S endpoints.


    **Discussion**

    Service monitor classes work through event notification and subsequent polling
    of the designated endpoint. Service monitoring is not part of the Adobe Integrated
    Runtime (AIR) directly, and needs to be added before it can be used.


    The classes for service monitoring are contained in the *servicemonitor.swf* file
    which can be found in the “frameworks” directory of the AIR SDK. This file should
    be copied into the application project folder, and can be included through the
    use of the HTML SCRIPT tag. The *servicemonitor.swf* file also needs to be included
    in the packaged AIR application.


    ```

    <script src="servicemonitor.swf"></script>

    ```


    The URLMonitor class takes a single argument in the constructor, an instance of
    the URLRequest class. The URLRequest'
