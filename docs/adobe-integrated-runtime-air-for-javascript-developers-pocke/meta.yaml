  - "[PAGE 135]\n\nCurrently, when working with a local database from AIR, all transactions\
    \ are asynchronous. This configuration allows the user interface to continue to\
    \ respond while the database is processing in the background. To monitor database\
    \ activity, an application must create and register for the events in which it\
    \ is interested.\n\n# Connecting to a Database\n\n# Problem\n\nYou need to connect\
    \ to a local database prior to working with the schema or altering data.\n\n#\
    \ Solution\n\nCreating and connecting to a database can be accomplished using\
    \ the single `SqlConnection.open()` method.\n\n# Discussion\n\nSQLite stores all\
    \ database information in a single file on disk. This means that before an application\
    \ can access a database, it must first have a reference to the file. A single\
    \ application might choose to access any number of database files. Databases are\
    \ managed through the `SQLConnection` datatype in the AIR API.\n\nObtaining a\
    \ reference to the database file can be done through the `File.resolve()` method,\
    \ which takes a single argument: the name of the file that will be referenced.\
    \ Files that do not yet exist can have a reference, and the `File.exists` property\
    \ returns a Boolean to determine that file’s presence on disk:\n\n```\nvar db\
    \ = new air.SQLConnection();\nvar file =\n  air.File.applicationStorageDirectory.resolve(\
    \ \"mycrm.db\" );\n```"
