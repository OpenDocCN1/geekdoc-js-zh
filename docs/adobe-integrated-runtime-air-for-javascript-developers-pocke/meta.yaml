  md: '# Creating the Application Files


    Every AIR application contains a minimum of two files. The first file is the root
    content file. This is the main HTML or SWF file for the application, and is the
    file that will be displayed/executed when the application first starts up.


    The second file is called the application descriptor file, which is an XML file
    that provides metadata to Adobe AIR about the application.


    Let’s create these files for our application:


    +   1. Create a new folder called `AIRHelloWorld`.

    2. Inside of this folder, create two new files called `AIRHelloWorld.html` and
    `AIRHelloWorld.xml`.

    3. Open each of these files using your favorite text or HTML editor/IDE.


    # Understanding application descriptor files


    The application descriptor file is an XML file required for each AIR application.
    It provides general metadata (such as application name and description) to Adobe
    AIR, as well as information on how the application should be run. This includes
    specifying the root application file for the application and the window mode that
    the initial application window should use.


    First, let’s look at the entire application descriptor file (`AIRHelloWorld.xml`)
    for our application, and then we will go into more detail on each item within
    the file.


    > **TIP**


    You can find a sample application descriptor file in the AIR SDK in the templates
    folder.'
  merge: -1
  pgno: 50
- img_proc: true
  md: "Open AIRHelloWorld.xml and type in the following text:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<application xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\
    \n             appId=\"com.oreilly.AIRHelloWorld\"\n             version=\"1.0\"\
    >\n\n    <name>AIRHelloWorld</name>\n    <title>AIRHelloWorld Installer</title>\n\
    \    <description>Simple Hello World Example\n        using HTML</description>\n\
    \    <copyright></copyright>\n\n    <rootContent systemChrome=\"standard\"\n \
    \                transparent=\"false\" visible=\"true\">\n        ApolloHelloWorld.html</rootContent>\n\
    \n</application>\n```\n\nThe content should be pretty self-explanatory, but let's\
    \ go through it line by line to understand what is going on.\n\n```\n<application\
    \ xmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\n             appId=\"\
    com.oreilly.\"\n             version=\"1.0\">\n```\n\nThere are two items worth\
    \ pointing our here. First, the namespace definition:\n\n```\nxmlns=\"http://ns.adobe.com/air/application/1.0.M4\"\
    \n```\n\nThis specifies the build of Adobe AIR that the application targets. In\
    \ this case, it specifies 1.0.M4, which is the public Beta.\n\nThe appId property\
    \ is important, and specifies a unique ID for the AIR application. Adobe AIR uses\
    \ this ID to determine one application from another.\n\nAs you can see, it uses\
    \ the reverse domain format, which you may be familiar with from some programming\
    \ languages such as Java, ActionScript, and some JavaScript frameworks. You can\
    \ create your own ID using your domain name and application name."
  merge: -1
