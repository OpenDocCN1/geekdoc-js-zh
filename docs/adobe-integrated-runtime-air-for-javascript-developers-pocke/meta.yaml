    \ handler will be added before the send method is called. Within this handler\
    \ we will save the data that is located in the responseText property of the XMLHttpRequest\
    \ instance to a known location on the local file system for retrieval in subsequent\
    \ requests. Reading and writing text to the local system is covered elsewhere\
    \ in the book, and therefore we won’t cover it in detail here:\n\n```\nxml.onreadystatechange\
