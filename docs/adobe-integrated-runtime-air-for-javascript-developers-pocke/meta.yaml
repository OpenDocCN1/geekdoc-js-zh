    # Creating Full-Screen Windows\n\n# Problem\n\nFor the purpose of enabling more\
    \ viewing space or enabling additional interactions, your application needs to\
    \ be able to run using the full screen.\n\n# Solution\n\nThe NativeWindow class\
    \ provides the foundation for creating transparent and full screen.\n\n# Discussion\n\
    \nThe differences between using NativeWindow for full-screen display, and using\
    \ NativeWindow for custom windows, is an additional initialization option and\
    \ setting the window to fill the screen. To remove any OS-specific windowing chrome,\
    \ use the NativeWindowInitOptions.systemChrome property. The NativeWindowInitOptions.systemChrome\
    \ should be set to one of the four string constants (Table 4-1) found in the NativeWindowSystemChrome\
    \ class."
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Table 4-1. String constants in NativeWindowSystemChrome


    | String constant | Description |

    | --- | --- |

    | NativeWindowSystemChrome.STANDARD | This is the default for NativeWindow and
    reflects the window chrome used on the specific operating system. |

    | NativeWindowSystemChrome.UTILITY | Utility chrome is best suited for related
    windows that will be present for an extended amount of time such as tool panels.
    |

    | NativeWindowSystemChrome.NONE | Indicates that no chrome should be present,
    and requires that the application handle all traditional windowing tasks. |

    | NativeWindowSystemChrome.ALTERNATE | Not implemented for the Adobe AIR Beta.
    |


    To create a full-screen window without any chrome, the NativeWindowInitOptions.systemChrome
    property should be set to NativeWindowSystemChrome.NONE. The application can then
    subsequently call the NativeWindow.maximize() method, or set NativeWindow.bounds
    directly. The NativeWindow.bounds property takes a flash.geom.Rectangle object
    which specifies horizontal and vertical origination, as well as width and height.
    Either approach fills the viewable screen with the newly created native window.


    ```

    var options = new air.NativeWindowInitOptions();

    var login = null;


    options.minimizable = false;

    options.maximizable = false;

    options.resizable = false;

    options.systemChrome = air.NativeWindowSystemChrome.NONE;


    login = new air.NativeWindow( false, options );

    login.maximize();

    ```'
