    # Relative URLs


    You''re not restricted to using just absolute URLs within AIR applications. You
    can also use relative URLs, but it is important to remember that relative URLs
    within AIR applications are relative to the application, and not to a server (as
    they would be when doing traditional browser-based client/server development).


    Relative URLs will be relative to the root of the application, and will resolve
    to the app-resource:/ URI.


    For example:


    ```

    <img src="foo/image.png" />

    ```


    will resolve to:


    ```

    <img src="app-resource:/foo/image.png" />

    ```


    You should keep this in mind when moving web and browser-based content and code
    into an AIR application.


    # Security


    This section discusses a number of differences in the security model implementations
    in the Adobe AIR, versus that in the browser.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# # Security Context


    Content installed within the application runs under the security context of the
    application. This means that it has access to all of the Adobe AIR APIs and functionality.


    Remote content loaded into the application is run under a web security content,
    and as such does not have access to the Adobe AIR APIs and functionality, or to
    the expanded privileges to which application content has access.


    For example, content loaded into the application via:


    `app-resource://foo.html`


    has full access to the AIR APIs. However, content loaded using HTTP, like so:


    `http://www.yourdomain.com/foo.html`


    runs in a web security context, and does not have access to AIR APIs.


    Content in the application install directory falls under the application security
    context. Content in the application storage directory (`app-storage:/`) falls
    under the web security context (Table 3-3).


    *Table 3-3. Application and web security contexts*


    | URL data loaded from | Has access to AIR APIs? |

    | :--- | :--- |

    | `app-resource://foo.html` | Yes |

    | `app-storage://foo.html` | No |

    | `http://www.anydomain.com/foo.html` | No |

    | `https://www.anydomain.com/foo.html` | No |

    | `file://C/foo.html` | No |

    | `ftp://www.anydomain.com/foo.html` | No |'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Because of this, content downloaded from third party sources and domains should
    always be placed in the `app-storage:/` directory, and not in the `app-resource:/`
    directory in order to prevent inadvertent elevation of security context and privileges.


    # Cross domain data loading


    The Adobe Integrated Runtime does not enforce cross domain data loading restrictions
    for application content. Among other things, this allows the loading of data across
    domains using the `XMLHttpRequest` object.


    Cross domain data loading restrictions are enforced for non-privileged web content.


    # Using JavaScript Frameworks


    Because the HTML environment within the Adobe Integrated Runtime has full support
    for JavaScript, you can use virtually any JavaScript framework to build your application.
    However, when using frameworks, there are a couple of things to keep in mind:


    +   - The framework should be included within your application''s AIR file, in
    order to ensure that it is available offline.

    - If the framework expects to load resources from a central server, you may have
    to test to make sure that relative URLs continue to work.

    - While it is possible to load the framework from the network at runtime, this
    can lead to slower application startup performance, as well as an inability for
    the application to work when offline.


    You can find a number of HTML-based AIR applications and their source built using
    the EXT-JS framework from the Adobe Labs AIR site at:


    http://www.adobe.com/go/airwiki'
