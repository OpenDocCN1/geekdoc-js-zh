- md: "## Browse for a Directory\n\n## Problem\n\nApplication requirements dictate\
    \ that you allow users to select a directory in which they will store data.\n\n\
    ## Solution\n\nUse the File.browseForDirectory() API to prompt the user to select\
    \ a directory.\n\n## Discussion\n\nThe File.browseForDirectory() API creates a\
    \ native dialog box that allows users to select a directory. The method takes\
    \ a required String argument, which will be used to provide additional information\
    \ to the user about the purpose of the selected directory.\n\nWhen a directory\
    \ selection has been made, Adobe AIR will raise an event in the issuing application.\
    \ In order to catch that event, the application must have first registered an\
    \ event listener. The event that gets raised is Event.SELECT, and an event object\
    \ will be passed to the handler:\n\n```\nvar file = air.File.applicationStorageDirectory;\n\
    \nfile.addEventListener( air.Event.SELECT, doSelect );\nfile.browseForDirectory(\
    \ \"Where do you want to store your photos?\" );\n\nfunction doSelect( event )\n\
    {\n    alert( file.nativePath );\n}\n```\n\nA useful property of the event object\
    \ that is sent to the handler is the target property that contains a reference\
    \ to the originating File object. There is nothing returned from the dialog operation\
    \ to be assigned to a File object, as the originating object will now hold a reference\
    \ to the directory selected by the user. For this purpose, it may be beneficial\
    \ to have a class or global reference to the File object, and even to reuse it:\n\
    \n```\n<html>\n<head>\n\n<title>Select Directory</title>\n<script type=\"text/javascript\"\
    \ src=\"AIRAliases.js\"></script>\n\n<script>\nvar file = null;\n\nfunction doLoad()\n\
    {\n    file = air.File.documentsDirectory;\n    file.addEventListener( air.Event.SELECT,\
    \ doSelect );\n\n    document.getElementById( \"btnBrowse\" ).\n    addEventListener(\
    \ \"click\", doBrowse );\n}\n\nfunction doBrowse()\n{\n    file.browseForDirectory(\
    \ \"Where do you want to put your photos?\" );\n}\n\nfunction doSelect()\n{\n\
    \    var elem = document.createElement( \"div\" );\n\n    elem.innerText = file.nativePath;\n\
    \    document.body.appendChild( elem );\n}\n</script>\n\n</head>\n<body onload=\"\
    doLoad()\">\n\n<input id=\"btnBrowse\" type=\"button\" value=\"Browse\" />\n\n\
    </body>\n</html>\n```\n\n## Service and Server Monitoring\n\n### Monitoring Connectivity\
    \ to an HTTP Server\n\n**Problem**\nYour application needs to monitor and determine\
    \ whether a specific HTTP server can be reached.\n\n**Solution**\nUse the URLMonitor\
    \ class to detect network state changes in HTTP/S endpoints.\n\n**Discussion**\n\
    Service monitor classes work through event notification and subsequent polling\
    \ of the designated endpoint. Service monitoring is not part of the Adobe Integrated\
    \ Runtime (AIR) directly, and needs to be added before it can be used.\n\nThe\
    \ classes for service monitoring are contained in the *servicemonitor.swf* file\
    \ which can be found in the “frameworks” directory of the AIR SDK. This file should\
    \ be copied into the application project folder, and can be included through the\
    \ use of the HTML SCRIPT tag. The *servicemonitor.swf* file also needs to be included\
    \ in the packaged AIR application.\n\n```\n<script src=\"servicemonitor.swf\"\
    ></script>\n```\n\nThe URLMonitor class takes a single argument in the constructor,\
    \ an instance of the URLRequest class. The URLRequest constructor takes a String\
    \ that represents the URL service endpoint to query. The URLRequest class also\
    \ contains information about how to query the endpoint (i.e. GET, POST), and any\
    \ additional data that should be passed to the server:\n\n```\nvar request = air.URLRequest(\
    \ \"http://www.adobe.com\" ) ;\nvar monitor = new window.runtime.air.net.URLMonitor(\
    \ request );\n```\n\nThe URLMonitor class will raise a StatusEvent.STATUS event\
    \ when the network state changes. Once the event handler has been registered,\
    \ the URLMonitor instance can be told to start watching for network start changes:\n\
    \n```\nmonitor.addEventListener( air.StatusEvent.STATUS, doStatus );\nmonitor.start();\n\
    ```\n\nAfter a network change has been propagated as an event, the URLMonitor.available\
    \ property on the originating URLMonitor instance can be used to check for the\
    \ presence of a connection. The URLMonitor.available property returns a Boolean\
    \ value that reflects the state of the network. As it is necessary to query the\
    \ originating URLMonitor instance for network availability, the object should\
    \ be declared in a scope that is accessible across the application:\n\n```\n<html>\n\
    <head>\n\n<title>HTTP Monitor</title>\n<script type=\"text/javascript\" src=\"\
    AIRAliases.js\"></script>\n<script src=\"servicemonitor.swf\"></script>\n\n<script>\n\
    var monitor = null;\n\nfunction doLoad()\n{\n    var request = new air.URLRequest(\
    \ \"http://www.adobe.com\" );\n    \n    monitor = new window.runtime.air.net.URLMonitor(\
    \ request );\n    monitor.addEventListener( air.StatusEvent.STATUS, doStatus );\n\
    \    monitor.start();\n}\n\nfunction doStatus( event )\n{\n    var elem = document.createElement(\
    \ \"div\" );\n\n    elem.innerText = monitor.available;\n\n    document.body.appendChild(\
    \ elem );\n}\n</script>\n\n</head>\n<body onload=\"doLoad()\">\n\n</body>\n</html>\n\
    ```\n\n### Monitoring Connectivity to a Jabber Server\n\n**Problem**\nA Jabber\
    \ chat client is required to reflect network presence in the user interface, but\
    \ the endpoint is a Jabber server on a specific port and not HTTP/S.\n\n**Solution**\n\
    Use the SocketMonitor class to detect network state changes against TCP/IP socket\
    \ endpoints.\n\n**Discussion**\nThe service monitoring API is not built into Adobe\
    \ AIR directly, and needs to be added before it can be used. The _servicemonitor.swf_\
    \ file, which is included in the Adobe AIR SDK, must be included as an application\
    \ resource and included via an HTML SCRIPT tag:\n\n```\n<script src=\"servicemonitor.swf\"\
    ></script>\n```\n\nThe SocketMonitor class takes two arguments in the constructor:\
    \ a String that represents the host endpoint, and a port on which the server is\
    \ listening:\n\n```\nvar host = \"im.mydomain.com\";\nvar port = 5220;\nvar monitor\
    \ = new window.runtime.air.net.SocketMonitor( host, port );\n```\n\nThe SocketMonitor\
    \ class will raise a StatusEvent.STATUS event when the network state changes.\
    \ Once the event handler has been registered, calling the SocketMonitor.start()\
    \ method will start watching the network for changes:\n\n```\nmonitor.addEventListener(\
    \ air.StatusEvent.STATUS, doStatus );\nmonitor.start();\n```\n\nAfter a network\
    \ change has been propagated as an event, the SocketMonitor.available property\
    \ on the originating SocketMonitor instance can be used to check for the presence\
    \ of a connection. The SocketMonitor.available property returns a Boolean value\
    \ that reflects the state of the network. As a best practice, the SocketMonitor\
    \ object should be declared in a scope that is accessible across the application\
    \ and referenced directly during event handling:\n\n```\n<html>\n<head>\n\n<title>Socket\
    \ Monitor</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\
    <script src=\"servicemonitor.swf\"></script>\n\n<script>\nvar monitor = null;\n\
    \nfunction doLoad()\n{\n    monitor = new window.runtime.air.net.SocketMonitor(\
    \ \"im.mydomain.com\", 5220 );\n    monitor.addEventListener( air.StatusEvent.STATUS,\
