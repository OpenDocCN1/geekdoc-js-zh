    # File Pickers


    # Browse for a File


    **Problem**


    An application needs to prompt the user to select a file to open from the local
    system using a native dialog.


    **Solution**


    The `File` class allows an application to prompt the user to select one or more
    files of a specific type from the local system.


    **Discussion**


    The `File` class provides numerous browse methods that present the native dialog
    for the specified operation. In the case of browsing for a single file to open,
    the appropriate method is `File.browseForOpen()`. This method takes a required
    string argument for the title of the dialog box, and an optional Array of `FileFilter`
    objects.


    `FileFilter` objects allow an application to filter the viewable files in the
    native dialog box. This argument is null by default, which allows the user to
    select any file to which they would normally have access (i.e., not hidden files).
    An application can provide as many filters as necessary, by placing multiple `FileFilter`
    objects in an Array and passing that Array as the second argument to `File.browseForOpen();`'
