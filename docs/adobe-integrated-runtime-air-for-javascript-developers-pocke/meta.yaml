- img_proc: true
  md: 'The next section of elements specify general metadata about the application:


    ```

    <name>AIRHelloWorld</name>

    <title>AIRHelloWorld Installer</title>

    <description>Simple Hello World Example using HTML</description>

    <copyright></copyright>

    ```


    | Element | Description |

    | :--- | :--- |

    | name | The name of the application. This is the name that will be exposed to
    the operating system and user. |

    | title | The title that will be used for the application installer. |

    | description | A human readable description of the application that will be presented
    to the user during the installation process. |

    | copyright | Optional. Allows the specification of Copyright information about
    the application. |


    The next element is the `rootContent` tag, which tells Adobe AIR which application
    file is the main root content of the application:


    ```

    <rootContent systemChrome="standard" transparent="false" visible="true">ApolloHelloWorld.html</rootContent>

    ```


    The value of the element should point to the main root file of the application,
    which, in this case, is an HTML file.


    > **TIP**


    The application descriptor file and root content file must be in the same folder.


    The `rootContent` element has a number of attributes that specify the initial
    window parameters and chrome of the application when it is first launched.'
  merge: -1
  pgno: 52
- img_proc: true
  md: "| Element | Description |\n| :--- | :--- |\n| systemChrome | The type of systemChrome\
    \ that the application should use (\"standard\" or \"none\"). |\n| transparent\
    \ | Whether the application background should be transparent. If systemChrome\
    \ is set to standard, this property is true. |\n| visible | Whether the application\
    \ is visible when it is first launched. This is useful if your application needs\
    \ to perform some complex initialization before displaying the UI to the user.\
    \ |\n\nFor our example, we will use the operating system's window chrome.\n\n\
    This is all that is required for the application descriptor file for our application.\
