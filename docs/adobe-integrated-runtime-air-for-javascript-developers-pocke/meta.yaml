    \ ActionScript APIs are available to JavaScript within Adobe AIR applications.\n\
    \nOf course, the Flex 2 RIA framework is built on top of ActionScript 3, which\
    \ means that you can take advantage of all of the features and functionality that\
    \ Flex offers in order to build Adobe AIR applications.\n\n## Primary Document\
    \ Technologies\n\nDocument technologies within Adobe AIR refer to technologies\
    \ that can be used for the rendering of and interaction with electronic documents.\n\
    \nPDF and HTML are the primary document technologies available within Adobe AIR.\n\
    \n## PDF\n\nThe Portable Document Format (PDF) is the web standard for delivering\
    \ and displaying electronic documents on the Web.\n\nPDF functionality requires\
    \ that Adobe Reader version 8.1 be installed on the user's computer. If Adobe\
    \ Reader 8.1 is installed, then Adobe AIR applications will be able to take full\
    \ advantage of all of the features that reader also exposes when running within\
    \ a web browser.\n\n## HTML\n\nHTML was originally designed as a document technology,\
    \ and today it provides rich and robust control over content and text layout and\
    \ styling. HTML can be used as a document technology within Adobe AIR—both within\
    \ an existing HTML application as well as within a Flash-based application.\n\n\
    ## What Does an Adobe AIR Application Contain?\n\nNow that we know what technologies\
    \ are available to applications running on top of the Adobe Integrated Runtime\
    \ (see Figure 1-1), let's look at how those technologies can be combined to build\
    \ an Adobe AIR application.\n\nApplications can consist of the following combinations\
    \ of technologies:\n\n- HTML/JavaScript only\n- HTML/JavaScript-based with Flash\
    \ content\n- Flash only (including Flex)\n- Flash-based with HTML content\n- All\
    \ combinations can leverage PDF content\n\n> **TIP**\n> Flash content within HTML\
    \ is not implemented in the public beta of Adobe AIR, although it will be available\
    \ in the 1.0 release.\n\n![](img/a312eae733f8dd0e40d674223b63428e_32_0.png)\n\n\
    ## Technology Integration and Script Bridging\n\nBecause WebKit and the Flash\
    \ Player are both included within the runtime, they are integrated together on\
    \ a very low level. For example, when HTML is included within Flash content, it's\
    \ actually rendered via the Flash display pipeline, which, among other things,\
    \ means that anything that you can do to a bitmap within Flash (blur, rotate,\
    \ transform, etc.) you can also do to HTML.\n\nThis low-level integration also\
    \ applies to the script engines within Adobe AIR that run ActionScript and JavaScript.\
    \ Adobe AIR provides script bridging between the two languages and environments,\
    \ which makes the following possible:\n\n- JavaScript code can call AIR, Flash\
    \ Player and ActionScript APIs\n- ActionScript code can call JavaScript APIs\n\
    - ActionScript code can directly manipulate the HTML DOM\n- Event registration\
    \ both ways between JavaScript and ActionScript\n\nNote that the script bridging\
    \ is \"pass by reference.\" So when passing an object instance from JavaScript\
    \ to ActionScript (or vice versa), changes to that instance in one environment\
    \ will affect the instance in the other environment. Among other things, this\
    \ makes it possible to instantiate and use Flash Player APIs directly from JavaScript,\
    \ or to register and listen for events.\n\nThis low-level script bridging between\
    \ the two environments makes it very easy for developers to create applications\
    \ that are a combination of both HTML and Flash.\n\n> **TIP**\n> Accessing ActionScript\
    \ and Adobe AIR APIs from JavaScript is covered in more detail in Chapter 3.\n\
    \nThe end result of all of this is that if you are a web developer using HTML\
    \ and JavaScript, then you already have all of the skills necessary to build an\
    \ Adobe AIR application.\n\n## Adobe AIR Functionality\n\nIf Adobe AIR did not\
    \ provide additional functionality and APIs and simply allowed web applications\
    \ to run on the desktop, it would not be quite as compelling. Fortunately, Adobe\
    \ AIR provides a rich set of programming APIs, as well as close integration with\
    \ the desktop that allows developers to build applications that take advantage\
    \ of the fact that they're running on the user's desktop.\n\n## Adobe AIR Programming\
    \ APIs\n\nIn addition to all of the functionality and APIs already offered by\
    \ the Flash Player and WebKit engine, Adobe AIR provides additional functionality\
    \ and APIs.\n\n> **TIP**\n> Adobe AIR APIs are available to both ActionScript\
    \ and JavaScript.\n\nSome of the new functionality includes, but is not limited\
    \ to:\n\n- Complete file I/O API\n- Complete native windowing API\n- Complete\
    \ native menuing API (Mac only in beta)\n- Online/Offline APIs to detect when\
    \ service connectivity has changed\n- Complete control over application chrome\n\
    - Local storage/settings APIs\n- System notification APIs that tie into OS-specific\
    \ notification mechanisms (not implemented in Beta)\n- Application update APIs\n\
    - SQLite embedded database\n\nNote that functionality may be implemented directly\
    \ within the Adobe Integrated Runtime or on the framework layer (in Flex and JavaScript),\
    \ or by using a combination of both.\n\n## Adobe AIR Desktop Integration\n\nAs\
    \ discussed earlier, applications deployed via the browser cannot always support\
    \ the same user interactions as desktop applications. This leads to applications\
    \ that can be cumbersome for the user to interact with, as they do not allow the\
    \ type of application interactions with which users are familiar.\n\nBecause an\
    \ Adobe AIR application is a desktop application, it's able to provide the type\
    \ of application interactions and experience that users expect from an application.\
    \ This functionality includes, but is not limited to:\n\n- Appropriate install/uninstall\
    \ rituals\n- Desktop install touch-points (such as shortcuts)\n- Rich drag-and-drop\
    \ support:\n    - Between operating system and Adobe AIR applications\n    - Between\
    \ Adobe AIR applications\n    - Between native applications and Adobe AIR applications\n\
    - Rich clipboard support\n- System notifications\n- Native icons\n\nOnce installed,\
    \ an Adobe AIR application is just another native application, which means that\
    \ the operating system and users can interact with it in the same as any other\
    \ application. For example, things such as OS-level application pre-fetching and\
    \ application switching work the same with Adobe AIR applications as they do with\
    \ native applications.\n\nThe goal is that the end user does not need to know\
    \ they are running an Adobe AIR application in order to be able to use it. They\
    \ should be able to interact with an Adobe AIR application in the same way that\
    \ they interact with any other application running on the desktop.\n\n## Security\n\
    \nAll of this talk of APIs and desktop functionality brings up an important question:\
    \ what about security? Because Adobe AIR applications have access to local resources,\
    \ couldn’t they theoretically do something harmful?\n\nFirst, it is important\
    \ to note that Adobe AIR runs on top of the operating system’s security layer.\
    \ It does not provide any way to get around or subvert this security. This is\
    \ important, because it means Adobe AIR applications can work only within the\
    \ permissions given to it by the operating system—and all current and any new\
    \ security capabilities that the OS implements.\n\nIn order to run an Adobe AIR\
    \ application, a user must download the application to the desktop, go through\
    \ an install ritual, and then launch the application. This is an experience very\
    \ similar to downloading and installing a desktop application. The similarity\
    \ is not an accident. Adobe AIR applications run in a fundamentally different\
    \ security context than applications that run within a browser. It is a security\
    \ context closer to that of a native application than a web application.\n\nTo\
    \ enable safe browsing, the browser security model limits all I/O capabilities\
    \ of web applications. This includes restricting their ability to work with local\
    \ resources, limiting what network resources are accessible, and constraining\
    \ its user interface. The browser only allows applications to connect with data\
    \ that is associated with (usually, provided by) a server located on a single\
    \ web domain. In addition, the browser provides a trusted UI for users to understand\
    \ the origin of the application and control the state of the application. This\
    \ model is sufficient for applications that are connected to a single service\
    \ provider and rely on that service for data synchronization and storage."
  mdcn: "\n不仅所有现有的Flash Player API在Adobe AIR中都可用，其中一些API还得到了扩展和/或增强。Flash Player提供给Adobe\
    \ AIR的部分功能包括：\n\n-   即时编译的ActionScript引擎，确保应用性能迅捷\n-   完整的网络协议栈，涵盖HTTP、RTMP，以及二进制套接字和XML套接字\n\
    -   完全基于矢量的渲染引擎与绘图API\n-   广泛的多媒体支持，包括位图、矢量图、音频和视频\n\n> **提示**\n> 在Adobe AIR应用程序中，JavaScript可以访问Flash\
    \ Player和ActionScript API。\n\n当然，Flex 2 RIA框架是建立在ActionScript 3之上的，这意味着你可以利用Flex提供的所有特性和功能来构建Adobe\
    \ AIR应用程序。\n\n## 主要文档技术\n\nAdobe AIR中的文档技术指的是可用于渲染电子文档以及与之交互的技术。\n\nPDF和HTML是Adobe\
    \ AIR中可用的主要文档技术。\n\n## PDF\n\n可移植文档格式（PDF）是用于在网络上交付和显示电子文档的Web标准。\n\nPDF功能要求用户的计算机上安装Adobe\
    \ Reader 8.1。如果已安装Adobe Reader 8.1，Adobe AIR应用程序将能够充分利用该阅读器在Web浏览器中运行时所暴露的所有功能。\n\
    \n## HTML\n\nHTML最初被设计为一种文档技术，如今它为内容、文本布局和样式提供了丰富而强大的控制。HTML可以在Adobe AIR中作为文档技术使用——既可以在现有的HTML应用程序中使用，也可以在基于Flash的应用程序中使用。\n\
    \n## Adobe AIR应用程序包含什么？\n\n既然我们已经了解了运行在Adobe Integrated Runtime之上的应用程序可用哪些技术（参见图1-1），让我们来看看如何将这些技术组合起来构建Adobe\
    \ AIR应用程序。\n\n应用程序可以由以下技术组合构成：\n\n-   仅HTML/JavaScript\n-   基于HTML/JavaScript，但包含Flash内容\n\
    -   仅Flash（包括Flex）\n-   基于Flash，但包含HTML内容\n-   所有组合都可以利用PDF内容\n\n> **提示**\n> 在Adobe\
    \ AIR的公开测试版中，HTML中的Flash内容尚未实现，但在1.0版本中将会提供。\n\n![](img/a312eae733f8dd0e40d674223b63428e_32_0.png)\n\
    \n## 技术集成与脚本桥接\n\n由于WebKit和Flash Player都包含在运行时中，它们在非常底层的层面进行了集成。例如，当HTML被包含在Flash内容中时，它实际上是通过Flash显示管道进行渲染的，这意味着你可以对Flash中的位图执行的任何操作（模糊、旋转、变换等）也可以对HTML执行。\n\
    \n这种底层集成同样适用于Adobe AIR中运行ActionScript和JavaScript的脚本引擎。Adobe AIR在两种语言和环境之间提供了脚本桥接，使得以下操作成为可能：\n\
    \n-   JavaScript代码可以调用AIR、Flash Player和ActionScript API\n-   ActionScript代码可以调用JavaScript\
    \ API\n-   ActionScript代码可以直接操作HTML DOM\n-   JavaScript和ActionScript之间的双向事件注册\n\
    \n请注意，脚本桥接是“按引用传递”的。因此，当从JavaScript向ActionScript（或反之）传递一个对象实例时，在一个环境中对该实例所做的更改会影响另一个环境中的实例。这使得从JavaScript直接实例化和使用Flash\
    \ Player API，或者注册和监听事件成为可能。\n\n这两种环境之间的底层脚本桥接使得开发者可以轻松创建结合了HTML和Flash的应用程序。\n\n\
    > **提示**\n> 从JavaScript访问ActionScript和Adobe AIR API将在第3章中更详细地介绍。\n\n所有这些最终结果是，如果你是一位使用HTML和JavaScript的Web开发者，那么你已经具备了构建Adobe\
    \ AIR应用程序所需的所有技能。\n\n## Adobe AIR功能\n\n如果Adobe AIR没有提供额外的功能和API，只是允许Web应用程序在桌面上运行，那它的吸引力就不会那么大。幸运的是，Adobe\
    \ AIR提供了一套丰富的编程API，以及与桌面的紧密集成，允许开发者构建能够利用其在用户桌面上运行这一事实的应用程序。\n\n## Adobe AIR编程API\n\
    \n除了Flash Player和WebKit引擎提供的所有功能和API外，AdobeAIR还提供了额外的功能和API。\n\n> **提示**\n> Adobe\
    \ AIR API可供ActionScript和JavaScript使用。\n\n一些新功能包括，但不限于：\n\n-   完整的文件I/O API\n-\
    \   完整的原生窗口API\n-   完整的原生菜单API（测试版中仅限Mac）\n-   在线/离线API，用于检测服务连接性何时发生变化\n-   对应用程序界面的完全控制\n\
    -   本地存储/设置API\n-   与操作系统特定通知机制关联的系统通知API（在测试版中未实现）\n-   应用程序更新API\n-   SQLite嵌入式数据库\n\
    \n请注意，功能可以直接在Adobe Integrated Runtime内实现，或在框架层（Flex和JavaScript）中实现，或通过两者的组合实现。\n\
    \n## Adobe AIR桌面集成\n\n如前所述，通过浏览器部署的应用程序并不总是能够支持与桌面应用程序相同的用户交互。这导致应用程序可能对用户来说操作繁琐，因为它们不允许用户习惯的那种应用程序交互方式。\n\
    \n因为Adobe AIR应用程序是桌面应用程序，它能够提供用户期望从应用程序中获得的那种交互和体验。此功能包括，但不限于：\n\n-   适当的安装/卸载流程\n\
    -   桌面安装接触点（如快捷方式）\n-   丰富的拖放支持：\n    -   在操作系统和Adobe AIR应用程序之间\n    -   在Adobe\
    \ AIR应用程序之间\n    -   在原生应用程序和Adobe AIR应用程序之间\n-   丰富的剪贴板支持\n-   系统通知\n-   原生图标\n\
    \n一旦安装，Adobe AIR应用程序就只是另一个原生应用程序，这意味着操作系统和用户可以像与任何其他应用程序交互一样与其交互。例如，操作系统级别的应用程序预取和应用程序切换等功能，对于Adobe\
    \ AIR应用程序和原生应用程序的工作方式是相同的。\n\n目标是最终用户不需要知道他们正在运行Adobe AIR应用程序就能使用它。他们应该能够以与交互桌面上任何其他应用程序相同的方式与Adobe\
    \ AIR应用程序进行交互。\n\n## 安全性\n\n所有这些关于API和桌面功能的讨论引出了一个重要问题：安全性怎么办？由于Adobe AIR应用程序可以访问本地资源，理论上它们是否可能做一些有害的事情？\n\
    \n首先，需要注意的是Adobe AIR运行在操作系统安全层之上。它没有提供任何绕过或破坏此安全机制的方法。这很重要，因为它意味着Adobe AIR应用程序只能在其被操作系统授予的权限范围内运行——包括操作系统实现的所有现有和新的安全能力。\n\
    \n要运行Adobe AIR应用程序，用户必须将应用程序下载到桌面，经历一个安装流程，然后启动该应用程序。这是一种非常类似于下载和安装桌面应用程序的体验。这种相似性并非偶然。Adobe\
    \ AIR应用程序运行的安全上下文与在浏览器中运行的应用程序有着根本的不同。它更接近原生应用程序的安全上下文，而不是Web应用程序。\n\n为了实现安全浏览，浏览器安全模型限制了Web应用程序的所有I/O能力。这包括限制它们处理本地资源的能力，限制可访问的网络资源，以及约束其用户界面。浏览器只允许应用程序连接与位于单个Web域上的服务器相关联（通常由该服务器提供）的数据。此外，浏览器提供了一个可信的UI，让用户了解应用程序的来源并控制应用程序的状态。此模型足以满足连接到单个服务提供商并依赖该服务进行数据同步和存储的应用程序。\n"
