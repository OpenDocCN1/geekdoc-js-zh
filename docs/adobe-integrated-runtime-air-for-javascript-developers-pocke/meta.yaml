- md: "## Uninstalling Pre-Beta Versions of Adobe AIR\n\nIf you have previously installed\
    \ an earlier version of Adobe AIR (formerly referred to as Apollo), you need to\
    \ uninstall those versions before installing the Beta version.\n\n### Uninstalling\
    \ on Windows\n\n1.  In the Windows Start menu, select Settings → Control Panel.\n\
    2.  Select the Add or Remove Programs control panel.\n3.  Select Adobe Apollo\
    \ 1.0 Alpha1 to uninstall the Apollo runtime.\n4.  Click the Change/Remove button.\n\
    \n### Uninstalling on Mac\n\n1.  Delete the /Library/Frameworks/Adobe Apollo.framework\
    \ directory.\n2.  Delete the /Library/Receipts/Adobe Apollo.pkg file.\n3.  Empty\
    \ the Trash.\n\nOnce you have done this, you are ready to install the Beta runtime.\n\
    \n## Installing Adobe AIR\n\nWhile it is not necessary to have Adobe AIR installed\
    \ on your computer in order to develop and test AIR applications, it is useful\
    \ to have in order to try other AIR applications and to test your final application’s\
    \ deployment and packaging.\n\nInstalling the runtime is simple, and requires\
    \ downloading and running the Adobe Integrated Runtime Installer.\n\n1.  Download\
    \ AIR Installer from http://www.adobe.com/go/air\n2.  Launch the installer. On\
    \ a Mac, you must first mount the .dmg file, which contains the installer.\n3.\
    \  Follow the installation instructions.\n\nAs Adobe AIR is simply a runtime and\
    \ not an application that can be launched, the easiest way to confirm that it\
    \ is installed correctly is to try installing an AIR application.\n\nYou can do\
    \ this by either downloading an AIR application and installing it, or following\
    \ the instructions later in the chapter to build a simple AIR application.\n\n\
    > **TIP**\n\nYou can download sample AIR applications from Adobe's web site at:\
    \ http://www.adobe.com/go/air.\n\n## Uninstalling Adobe AIR Beta\n\nThe process\
    \ for uninstalling Adobe AIR is different depending on the operating system that\
    \ you are running on.\n\n### Uninstalling on Mac\n\nThe Adobe AIR installer places\
    \ an uninstall application on the user's system when it is installed. To uninstall\
    \ the Adobe Integrated Runtime, launch the uninstaller named *Adobe AIR Uninstaller*\
    \ which can be found in the `/Users/<User>/Applications` directory (where `<User>`\
    \ is your system user account name).\n\n### Uninstalling on Windows\n\nOn Windows,\
    \ you can uninstall Adobe AIR the same way that you uninstall any other application.\
    \ Just select the Adobe Integrated Runtime in the add/remove programs section\
    \ of the control panel.\n\n## Setting Up the AIR SDK and Command-Line Tools\n\n\
    The Adobe AIR SDK Beta contains tools, samples, and code that makes it easier\
    \ to develop, test and deploy applications.\n\nIn particular, it contains two\
    \ command-line tools that we will use:\n\n| Tool | Description |\n|------|-------------|\n\
    | ADL | This is used to launch and test an AIR application without having to first\
    \ install it. |\n| ADT | This is used to package an AIR application for distribution.\
    \ |\n\n## Installing the SDK\n\nIn order to ease development, you should place\
    \ the path to these files within your system's path. This will allow you to execute\
    \ the tools from anywhere on your system.\n\nThe command line tools are located\
    \ in the bin directory within the SDK.\n\n1.  Download the AIR SDK Beta from http://www.adobe.com/go/air.\n\
    2.  Open the SDK\n    a.  On Windows, uncompressed the ZIP archive.\n    b.  On\
    \ Mac, mount the .dmg file.\n3.  Copy the contents of the SDK to your system (we\
    \ will refer to this location as `<SDK_Path>`).\n\n> **TIP**\n\nIn order to run\
    \ the command-line tools, you need to copy only the *bin* and *runtime* directories\
    \ from the SDK.\nIt's important that the *bin* and *runtime* directories within\
    \ the SDK maintain their relative paths to each other.\n\n4.  At this point, you\
    \ should have at least the following two directories: `<SDK_Path>/bin` and `<SDK_Path>/runtime`.\
    \ The ADL and ADT command-line tools are located in the bin directory.\n\n###\
    \ Placing the Command-Line Tools Within the System Path\n\nAll that's left is\
    \ to place the `<SDK_Path>/bin` directory into your system path, so that you can\
    \ execute the command line applications from anywhere on your system.\nThe instructions\
    \ for this are different depending on whether you are on a Mac- or Windows-based\
    \ system.\n\n#### Windows\n\n1.  Open the System Properties dialog box and click\
    \ the Advanced tab. You can find this in the System settings in the Control Panel.\n\
    2.  Click the Environment Variables button.\n3.  Select the PATH entry and then\
    \ click the Edit button. Add the path to the *bin* directory to the end of the\
    \ current variable value, separating it from previous values with a semicolon:\
    \ `;<SDK_Path>/bin`\n    Figure 2-1 shows the process.\n4.  Click OK to close\
    \ the panels.\n\n![](img/a312eae733f8dd0e40d674223b63428e_47_0.png)\n\n*Figure\
    \ 2-1. Placing command-line tools in the system path on Windows*\n\nIn order to\
    \ test the installation, open a new Windows Console (Start → Run → Console), and\
    \ type:\n\n```\nadt\n```\n\nIf you get an error that the file cannot be found,\
    \ then check the following things:\n\n-   Make sure that the *bin* and *runtime*\
    \ directories are included in the `<SDK_Path>` directory\n-   Make sure that you\
    \ included the path to `<SDK_Path>` directory correctly in the PATH environment\
    \ variable.\n-   Make sure that you opened a new Console window before running\
    \ the command.\n\n#### Mac\n\nThere are a number of ways to add the path to the\
    \ AIR SDK to your system path, depending on which shell you are using, and how\
    \ you specify user environment variables.\n\nThe instructions below show how to\
    \ modify your path environment variable if you are using the bash shell.\n\n1.\
    \  Open the Terminal program (/Applications/Utilities/Terminal)\n2.  Make sure\
    \ you're in your home directory by typing `cd` and pressing enter.\n3.  We need\
    \ to check to see if one of two files are present. Run the following command `ls\
    \ -la`\n4.  Look for a file named either `.profile` or `.bashrc`.\n5.  If you\
    \ have neither the `.profile` or `.bashrc` file, then create the `.profile` file\
    \ with the following command:\n    `touch .profile`\n6.  Open the `.profile` or\
    \ `.bashrc` file with a text editor.\n7.  Look for a line that looks similar to\
    \ this:\n    `export PATH=$PATH:/usr/local/bin`\n8.  Add the path to the `<SDK_Path>/bin`\
    \ directory to the end of this line. For example, if `<SDK_Path>/bin` is at `/airsdk/bin`,\
    \ the export path should look something like this:\n    `export PATH=$PATH:/usr/local/bin;/airsdk/bin`\n\
    \    making sure to separate the entries with a colon.\n9.  If the file is empty,\
    \ add the following line:\n    `export PATH=$PATH:/airsdk/bin`\n10. Save and close\
    \ the file.\n11. Run the following command to load the new settings source, *.profile*\
    \ (or *.bashrc*, if that is the file you edited).\n12. You can confirm that the\
    \ new settings have taken effect by typing `echo $PATH` and pressing Enter. Make\
    \ sure that the `<SDK_Path>/bin` path is included in the output.\n13. In order\
    \ to test the installation, open a Terminal window and type **adt**.\n\n```\n\
    Too few arguments.\nUsage: adt -package air_file app_xml [ file_or_dir | -C dir\
    \ file_or_dir ... ] ...\n```\n\nmeaning that the tools are configured correctly.\n\
    \nIf you get an error that the file cannot be found, then check the following\
    \ things:\n\n-   Make sure the *bin* and *runtime* directories are included in\
    \ the `<SDK_Path>` directory.\n-   Make sure you included the path to `<SDK_Path>/bin`\
    \ correctly in the PATH environment variable.\n-   Make sure you either opened\
    \ a new Terminal window, or ran *source* on your configuration file.\n\n## Creating\
    \ a Simple AIR Application with HTML and JavaScript\n\nNow that you have installed\
    \ and configured Adobe AIR and the Adobe AIR SDK Betas, we are ready to build\
    \ our first AIR application.\n\nWe will build a very simple \"hello world\" example.\
    \ Once you have built and tested the application, your development environment\
    \ will be set up and ready to build more complex and functional AIR applications.\n\
    \n### Creating the Application Files\n\nEvery AIR application contains a minimum\
    \ of two files. The first file is the root content file. This is the main HTML\
    \ or SWF file for the application, and is the file that will be displayed/executed\
    \ when the application first starts up.\n\nThe second file is called the application\
    \ descriptor file, which is an XML file that provides metadata to Adobe AIR about\
    \ the application.\n\nLet’s create these files for our application:\n\n1.  Create\
    \ a new folder called `AIRHelloWorld`.\n2.  Inside of this folder, create two\
    \ new files called `AIRHelloWorld.html` and `AIRHelloWorld.xml`.\n3.  Open each\
    \ of these files using your favorite text or HTML editor/IDE.\n\n### Understanding\
    \ application descriptor files\n\nThe application descriptor file is an XML file\
    \ required for each AIR application. It provides general metadata (such as application\
    \ name and description) to Adobe AIR, as well as information on how the application\
    \ should be run. This includes specifying the root application file for the application\
    \ and the window mode that the initial application window should use.\n\nFirst,\
    \ let’s look at the entire application descriptor file (`AIRHelloWorld.xml`) for\
    \ our application, and then we will go into more detail on each item within the\
    \ file.\n\n> **TIP**\n\nYou can find a sample application descriptor file in the\
    \ AIR SDK in the templates folder."
  mdcn: "\n## 卸载 Adobe AIR 预测试版本\n\n如果您之前安装过早期版本的 Adobe AIR（以前称为 Apollo），您需要在安装 Beta\
    \ 版本之前卸载这些版本。\n\n### 在 Windows 上卸载\n\n1.  在 Windows 开始菜单中，选择“设置” → “控制面板”。\n2.\
    \  选择“添加或删除程序”控制面板。\n3.  选择 Adobe Apollo 1.0 Alpha1 以卸载 Apollo 运行时。\n4.  单击“更改/删除”按钮。\n\
    \n### 在 Mac 上卸载\n\n1.  删除 `/Library/Frameworks/Adobe Apollo.framework` 目录。\n2.\
    \  删除 `/Library/Receipts/Adobe Apollo.pkg` 文件。\n3.  清空废纸篓。\n\n完成以上操作后，您就可以安装 Beta\
    \ 运行时了。\n\n## 安装 Adobe AIR\n\n虽然开发和测试 AIR 应用程序并不需要在计算机上安装 Adobe AIR，但安装它对于尝试其他\
    \ AIR 应用程序以及测试最终应用程序的部署和打包非常有用。\n\n安装运行时很简单，只需下载并运行 Adobe Integrated Runtime 安装程序即可。\n\
    \n1.  从 http://www.adobe.com/go/air 下载 AIR 安装程序。\n2.  启动安装程序。在 Mac 上，您必须首先挂载包含安装程序的\
    \ .dmg 文件。\n3.  按照安装说明进行操作。\n\n由于 Adobe AIR 仅仅是一个运行时，而不是一个可以启动的应用程序，因此确认其是否正确安装的最简单方法是尝试安装一个\
    \ AIR 应用程序。\n\n您可以通过下载并安装一个 AIR 应用程序，或者按照本章后面的说明来构建一个简单的 AIR 应用程序来完成此操作。\n\n>\
    \ **提示**\n\n您可以从 Adobe 的网站下载示例 AIR 应用程序：http://www.adobe.com/go/air。\n\n## 卸载\
    \ Adobe AIR Beta\n\n卸载 Adobe AIR 的过程因您运行的操作系统而异。\n\n### 在 Mac 上卸载\n\nAdobe AIR\
    \ 安装程序在安装时会在用户系统上放置一个卸载应用程序。要卸载 Adobe Integrated Runtime，请启动名为 *Adobe AIR Uninstaller*\
    \ 的卸载程序，该程序可在 `/Users/<User>/Applications` 目录中找到（其中 `<User>` 是您的系统用户帐户名称）。\n\n\
    ### 在 Windows 上卸载\n\n在 Windows 上，您可以像卸载任何其他应用程序一样卸载 Adobe AIR。只需在控制面板的添加/删除程序部分中选择\
    \ Adobe Integrated Runtime 即可。\n\n## 设置 AIR SDK 和命令行工具\n\nAdobe AIR SDK Beta 包含使开发、测试和部署应用程序更容易的工具、示例和代码。\n\
    \n特别是，它包含我们将使用的两个命令行工具：\n\n| 工具 | 描述 |\n|------|-------------|\n| ADL | 用于启动和测试\
    \ AIR 应用程序，而无需先安装它。 |\n| ADT | 用于将 AIR 应用程序打包以进行分发。 |\n\n## 安装 SDK\n\n为了简化开发，您应将这些文件的路径放置在系统的\
    \ path 中。这将允许您从系统上的任何位置执行这些工具。\n\n命令行工具位于 SDK 的 bin 目录中。\n\n1.  从 http://www.adobe.com/go/air\
    \ 下载 AIR SDK Beta。\n2.  打开 SDK\n    a.  在 Windows 上，解压缩 ZIP 存档。\n    b.  在 Mac\
    \ 上，挂载 .dmg 文件。\n3.  将 SDK 的内容复制到您的系统（我们将此位置称为 `<SDK_Path>`）。\n\n> **提示**\n\n\
    要运行命令行工具，您只需从 SDK 复制 *bin* 和 *runtime* 目录即可。\n确保 SDK 内的 *bin* 和 *runtime* 目录保持彼此之间的相对路径非常重要。\n\
    \n4.  此时，您应该至少拥有以下两个目录：`<SDK_Path>/bin` 和 `<SDK_Path>/runtime`。ADL 和 ADT 命令行工具位于\
    \ bin 目录中。\n\n### 将命令行工具放入系统路径中\n\n剩下的就是将 `<SDK_Path>/bin` 目录放入您的系统路径中，以便您可以从系统上的任何位置执行命令行应用程序。\n\
    此说明因您使用的是 Mac 还是 Windows 系统而异。\n\n#### Windows\n\n1.  打开“系统属性”对话框并单击“高级”选项卡。您可以在控制面板的“系统”设置中找到它。\n\
    2.  单击“环境变量”按钮。\n3.  选择 PATH 条目，然后单击“编辑”按钮。将 *bin* 目录的路径添加到当前变量值的末尾，并用分号将其与之前的值分开：`;<SDK_Path>/bin`\n\
    \    图 2-1 显示了该过程。\n4.  单击“确定”关闭面板。\n\n![](img/a312eae733f8dd0e40d674223b63428e_47_0.png)\n\
    \n*图 2-1. 在 Windows 上将命令行工具放入系统路径*\n\n要测试安装，请打开一个新的 Windows 控制台（开始 → 运行 → 控制台），然后输入：\n\
    \n```\nadt\n```\n\n如果收到找不到文件的错误，请检查以下内容：\n\n-   确保 `<SDK_Path>` 目录中包含 *bin* 和\
    \ *runtime* 目录。\n-   确保您在 PATH 环境变量中正确包含了 `<SDK_Path>` 目录的路径。\n-   确保在运行命令之前打开了一个新的控制台窗口。\n\
    \n#### Mac\n\n有多种方法可以将 AIR SDK 的路径添加到您的系统路径中，具体取决于您使用的 shell 以及指定用户环境变量的方式。\n\n\
    以下说明展示了如果您使用的是 bash shell，如何修改您的 path 环境变量。\n\n1.  打开终端程序（/Applications/Utilities/Terminal）\n\
    2.  输入 `cd` 并按回车键，确保您处于主目录中。\n3.  我们需要检查是否存在以下两个文件之一。运行命令 `ls -la`\n4.  查找名为 `.profile`\
    \ 或 `.bashrc` 的文件。\n5.  如果您没有 `.profile` 或 `.bashrc` 文件，则使用以下命令创建 `.profile` 文件：\n\
    \    `touch .profile`\n6.  使用文本编辑器打开 `.profile` 或 `.bashrc` 文件。\n7.  查找类似于以下内容的一行：\n\
    \    `export PATH=$PATH:/usr/local/bin`\n8.  将 `<SDK_Path>/bin` 目录的路径添加到此行的末尾。例如，如果\
    \ `<SDK_Path>/bin` 位于 `/airsdk/bin`，则 export path 应如下所示：\n    `export PATH=$PATH:/usr/local/bin;/airsdk/bin`\n\
    \    确保条目之间用冒号分隔。\n9.  如果文件为空，请添加以下行：\n    `export PATH=$PATH:/airsdk/bin`\n10.\
    \ 保存并关闭文件。\n11. 运行以下命令以加载新的设置源，*.profile*（或者如果您编辑的是 *.bashrc*，则加载该文件）。\n12. 您可以通过输入\
    \ `echo $PATH` 并按 Enter 键来确认新设置已生效。确保输出中包含 `<SDK_Path>/bin` 路径。\n13. 要测试安装，请打开一个终端窗口并输入\
    \ **adt**。\n\n```\nToo few arguments.\nUsage: adt -package air_file app_xml [\
    \ file_or_dir | -C dir file_or_dir ... ] ...\n```\n\n这意味着工具已正确配置。\n\n如果收到找不到文件的错误，请检查以下内容：\n\
    \n-   确保 `<SDK_Path>` 目录中包含 *bin* 和 *runtime* 目录。\n-   确保您在 PATH 环境变量中正确包含了 `<SDK_Path>/bin`\
    \ 的路径。\n-   确保您打开了一个新的终端窗口，或者在配置文件上运行了 *source* 命令。\n\n## 使用 HTML 和 JavaScript\
    \ 创建简单的 AIR 应用程序\n\n现在您已经安装并配置了 Adobe AIR 和 Adobe AIR SDK Beta，我们就可以构建我们的第一个 AIR\
    \ 应用程序了。\n\n我们将构建一个非常简单的“hello world”示例。一旦您构建并测试了应用程序，您的开发环境就将设置完毕，可以构建更复杂、功能更丰富的\
    \ AIR 应用程序了。\n\n### 创建应用程序文件\n\n每个 AIR 应用程序至少包含两个文件。第一个文件是根内容文件。这是应用程序的主 HTML\
    \ 或 SWF 文件，是应用程序首次启动时将显示/执行的文件。\n\n第二个文件称为应用程序描述符文件，它是一个 XML 文件，为 Adobe AIR 提供有关应用程序的元数据。\n\
    \n让我们为我们的应用程序创建这些文件：\n\n1.  创建一个名为 `AIRHelloWorld` 的新文件夹。\n2.  在此文件夹内，创建两个新文件，分别名为\
    \ `AIRHelloWorld.html` 和 `AIRHelloWorld.xml`。\n3.  使用您喜欢的文本或 HTML 编辑器/IDE 打开这些文件中的每一个。\n\
    \n### 理解应用程序描述符文件\n\n应用程序描述符文件是每个 AIR 应用程序必需的 XML 文件。它为 Adobe AIR 提供有关应用程序的通用元数据（例如应用程序名称和描述），以及有关应如何运行应用程序的信息。这包括指定应用程序的根应用程序文件以及初始应用程序窗口应使用的窗口模式。\n\
    \n首先，让我们查看整个应用程序描述符文件（`AIRHelloWorld.xml`），然后我们将详细介绍文件中的每个项目。\n\n> **提示**\n\n\
    您可以在 AIR SDK 的 templates 文件夹中找到示例应用程序描述符文件。\n"
