    # Synchronously Reading Text from a File


    You want to read the contents of a small text file into your application.


    Use the various file APIs provided by Adobe AIR to locate, open, and read text
    files.


    Small files that contain text content can be read using the FileStream.open()
    method. This method opens a file synchronously for reading. Synchronous access
    requires less code, but also blocks any additional user input until the data has
    been read. When using asynchronous access, additional user input is not blocked,
    but event handlers must be registered, which results in more code overhead.


    > **TIP**


    While accessing XML files as text is possible, the result of this approach is
    a document object that can''t be readily manipulated. Accessing an XML file for
