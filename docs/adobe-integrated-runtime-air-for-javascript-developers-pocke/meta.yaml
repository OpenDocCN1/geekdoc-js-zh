    {\n    directory.browseForDirectory( \"Select a directory of files:\" )\n}\n\n\
    function doLoad()\n{\n    directory = air.File.documentsDirectory;\n    directory.addEventListener(\
    \ air.Event.SELECT,\n                               doSelect );\n\n    document.getElementById(\
    \ \"btnBrowse\" ).\naddEventListener( \"click\", doBrowse );\n}\n\nfunction doSelect(\
    \ event )\n{\n    var files = directory.listDirectory();\n    var elem = null;\n\
    \    var name = null;\n    var mod = null;\n    var size = null;\n\n    for( var\
    \ f = 0; f < files.length; f++ )\n    {\n        name = files[f].name;\n\n   \
    \     mod = files[f].modificationDate;\n        mod = ( mod.month + 1 ) + \"/\"\
    \ +\n              mod.date + \"/\" +\n              mod.fullYear;\n\n       \
    \ size = Math.ceil( files[f].size / 1000 ) + \" KB\";\n\n        elem = document.createElement(\
    \ \"div\" );\n        elem.innerText = name + \" is \" +\n    size + \" and was\
    \ last modified on \" +\n    mod;\n\n        document.body.appendChild( elem );\n\
    \    }\n}\n</script>\n</head>\n<body onload=\"doLoad()\">\n\n<input id=\"btnBrowse\"\
    \ type=\"button\" value=\"Browse\" />\n\n</body>\n</html>\n```\n\n## File Pickers\n\
    \n## Browse for a File\n\n**Problem**\n\nAn application needs to prompt the user\
    \ to select a file to open from the local system using a native dialog.\n\n**Solution**\n\
    \nThe `File` class allows an application to prompt the user to select one or more\
    \ files of a specific type from the local system.\n\n**Discussion**\n\nThe `File`\
    \ class provides numerous browse methods that present the native dialog for the\
    \ specified operation. In the case of browsing for a single file to open, the\
    \ appropriate method is `File.browseForOpen()`. This method takes a required string\
    \ argument for the title of the dialog box, and an optional Array of `FileFilter`\
    \ objects.\n\n`FileFilter` objects allow an application to filter the viewable\
    \ files in the native dialog box. This argument is null by default, which allows\
    \ the user to select any file to which they would normally have access (i.e.,\
    \ not hidden files). An application can provide as many filters as necessary,\
    \ by placing multiple `FileFilter` objects in an Array and passing that Array\
    \ as the second argument to `File.browseForOpen();`\n\n**TIP**\nIf you want to\
    \ use the FileFilter object, you must use the Array class from the Flash runtime,\
    \ not the JavaScript Array class.\n\nNone of the browse methods on the File class\
    \ are static, and as such, an existing reference to a valid File object must first\
    \ be available. The directory represented by that File object reference will be\
    \ selected by default when the dialog is displayed:\n\n```javascript\nvar file\
    \ = air.File.documentsDirectory;\nvar filters = new window.runtime.Array();\n\n\
    filters.push( new FileFilter( \"Image Files\", \"*.jpg\" ) );\nfile.browseForOpen(\
    \ file, filters );\n```\n\nWhen a file selection has been made, Adobe AIR will\
    \ raise an event in the issuing application. In order to catch that event, the\
    \ application must have first registered an event listener. The event that gets\
    \ raised is `Event.SELECT`, and an `Event` object will be passed to the handler:\n\
    \n```javascript\nvar file = air.File.documentsDirectory;\nvar filters = new window.runtime.Array();\n\
    \nfilters.push( new air.FileFilter( \"Image Files\", \"*.jpg\" ) );\n\nfile.addEventListener(\
    \ air.Event.SELECT, doSelect );\nfile.browseForOpen( file, filters );\n\nfunction\
    \ doSelect( event )\n{\n    alert( file.nativePath );\n}\n```\n\nA useful property\
    \ of the `Event` object that is sent to the handler is the \"target,\" which contains\
    \ a reference to the originating `File` object. There is nothing returned from\
    \ the dialog operation to be assigned to a `File` object, as the originating object\
    \ will now hold a reference to the directory selected by the user. For this purpose,\
    \ it may be beneficial to have a class or global reference to the `File` object,\
    \ and even to reuse it:\n\n```html\n<html>\n<head>\n<title>Browse for a File</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n<script>\nvar\
    \ file = null;\n\nfunction doLoad()\n{\n    file = air.File.documentsDirectory;\n\
    \    file.addEventListener( air.Event.SELECT, doSelect );\n    \n    document.getElementById(\
    \ \"btnBrowse\" ).\n    addEventListener( \"click\", doBrowse );\n}\n\nfunction\
    \ doBrowse()\n{\n    var filters = new window.runtime.Array();\n    \n    filters.push(\
    \ new air.FileFilter( \"Image Files\", \"*.jpg\" ) );\n    file.browseForOpen(\
    \ \"Select Photo\", filters );\n}\n\nfunction doSelect( event )\n{\n    var elem\
    \ = document.createElement( \"div\" );\n    \n    elem.innerText = file.nativePath;\n\
    \    document.body.appendChild( elem );\n}\n</script>\n</head>\n<body onload=\"\
    doLoad()\">\n\n<input id=\"btnBrowse\" type=\"button\" value=\"Browse\" />\n\n\
    </body>\n</html>\n```\n\n## Browse for Multiple Files\n\n**Problem**\n\nAn application\
    \ needs to prompt the user to select multiple files from the local system using\
    \ the native dialog.\n\n**Solution**\n\nUse the `File.browseForOpenMultiple()`\
    \ API to prompt the user with a dialog box that will allow them to select multiple\
    \ files.\n\n**Discussion**\n\nThe use of the `File` class to open a single file\
    \ is predominantly the same as using the `File` class to open multiple files.\
    \ In the case of allowing the user to select multiple files, the appropriate method\
    \ to use is `File.browseForOpenMultiple()`. The `File.browseForOpenMultiple()`\
    \ method takes the same two arguments that the `File.browseForOpen()` method takes:\
    \ a String to be used in the title of the dialog, and an Array of `FileFilter`\
    \ objects.\n\nOnce the user has selected the files from the dialog, the `FileListEvent.SELECT_MULTIPLE`\
    \ will be broadcast. The event object that is sent to the handler will be of type\
    \ `FileListEvent`. The `FileListEvent` class contains a \"files\" property, which\
    \ will be an Array of `File` objects representing the files that the user selected:\n\
    \n```javascript\nvar file = air.File.documentsDirectory;\n\nfile.addEventListener(\
    \ air.FileListEvent.SELECT_MULTIPLE,\ndoSelect );\n\nfunction doSelect( event\
    \ )\n{\n    for( var f = 0; f < event.files.length; f++ )\n    {\n        ...\n\
    \    }\n}\n```\n\nHere is the complete code:\n\n```html\n<html>\n<head>\n\n<title>Browse\
    \ for Multiple Files</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\"\
    >\n</script>\n\n<script>\nvar file = null;\n\nfunction doLoad()\n{\n    file =\
    \ air.File.documentsDirectory;\n    file.addEventListener( air.FileListEvent.SELECT_MULTIPLE,\n\
    \                           doSelect );\n\n    document.getElementById( \"btnBrowse\"\
    \ ).\naddEventListener( \"click\", doBrowse );\n}\n\nfunction doBrowse()\n{\n\
    \    var filters = new window.runtime.Array();\n\n    filters.push( new air.FileFilter(\
    \ \"Image Files\", \"*.jpg\" ) );\n    file.browseForOpenMultiple( \"Select Photos\"\
    , filters );\n}\n\nfunction doSelect( event )\n{\n    var elem = null;\n    var\
    \ name = null;\n    var size = null;\n\n    for( var f = 0; f < event.files.length;\
    \ f++ )\n    {\n        name = event.files[f].name;\n        size = Math.ceil(\
    \ event.files[f].size / 1000 );\n\n        elem = document.createElement( \"div\"\
    \ );\n        elem.innerText = name + \" (\" + size + \" KB)\";\n\n        document.body.appendChild(\
    \ elem );\n    }\n}\n</script>\n</head>\n<body onload=\"doLoad()\">\n\n<input\
    \ id=\"btnBrowse\" type=\"button\" value=\"Browse\" />\n\n</body>\n</html>\n```\n\
