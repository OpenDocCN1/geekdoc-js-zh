    \n# Drag and Drop\n\n# Using Drag and Drop from HTML\n\n**Problem**\n\nYou want\
    \ to allow users to drag files, images, text, and other data types into and out\
    \ HTML-based AIR applications.\n\n**Solution**\n\nBy using Adobe AIR's Drag and\
