    To view a copy of this license, visit http://creativecommons.org/licenses/by-nc-sa/3.0/;
    or, (b) send a letter to Creative Commons, 543 Howard Street, 5th Floor, San Francisco,
    California, 94105, USA.


    You can find more information on Creative Commons at http://www.creativecommons.org.


    ## Support and More Information


    ### Accessing the Book Online


    You can always find the latest information about this book, as well as download
    a free electronic version of it from the book''s web site at:


    http://www.adobe.com/go/airjavascriptpocketguide


    ## Online AIR Resources


    Although AIR is a new technology, there are already a number of resources where
    you can find more information on AIR and Rich Internet Application (RIA) development.


    ### Official AIR site


    Primary web site for information, downloads, and documentation on AIR:

    http://www.adobe.com/go/air


    ### AIR Developer FAQ


    Official AIR FAQ, answering common questions about AIR development:

    http://www.adobe.com/go/airfaq


    ### AIR Developer Center


    Developer Center with articles, information, and resources on developing applications
    for AIR:

    http://www.adobe.com/go/airdevcenter


    ### AIR API Reference


    AIR JavaScript API Reference:

    http://www.adobe.com/go/airapi


    ### AIR Documentation


    Complete AIR documentation:

    http://www.adobe.com/go/airdocs


    ### AIR Forum


    Official Adobe forum for discussing developing applications for AIR:

    http://www.adobe.com/go/airforums'
