- img_proc: true
  md: '# Packaging and Deploying the AIR Application


    Now that we understand how to build, test and debug an AIR application, we are
    ready to create an AIR file which will allow us to deploy and distribute our application.


    # What Is an AIR File?


    An AIR file is a zip-based application distribution package that is used to distribute
    AIR applications. It contains all of the files necessary to install and run an
    AIR application, and is used by the Adobe Integrated Runtime to create and install
    an AIR application onto the user’s system.


    The AIR file is created by the ADT command line tool included in the AIR SDK and
    is used to distribute the application to other users.


    > **TIP**

    AIR files require that Adobe AIR already be installed on the user’s system.

    ADL will be able to also create OS-specific native installers that will be able
    to first install Adobe AIR and then install the AIR application for systems where
    Adobe AIR is not already installed.

    This functionality is not yet implemented in the public Beta.


    An AIR file requires a minimum of two files, the application descriptor file,
    and a root application file. However, you can also include other files, icons,
    directories, and assets that will be bundled with the AIR file, and installed
    alongside your application. These files will then be available to the application
    at runtime.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Creating an AIR File Using ADT


    The ADT command-line tool included in the Adobe AIR SDK is used to create AIR
    files. Its usage format is:


    ```

    adl -package AIRFILENAME FILESTOINCLUDE

    ```


    To create an AIR file for our application:


    +   1. Open a terminal (Mac OS X) or Console (Windows) window.

    2. Change to the directory which contains AIRHelloWorld.html and AIRHelloWorld.xml.

    3. Run the following command:


    ```

    adt -package AIRHelloWorld.air AIRHelloWorld.xml AIRHelloWorld.html

    ```


    This should create a file named AIRHelloWorld.air in the same directory. If the
    file is not created, or if you receive any errors:


    +   - Make sure you have configured the SDK correctly in order to ensure that
    the ADT tool can be found.

    - Make sure that you are running the ADT command from the same directory that
    contains the AIRHelloWorld.xml file.

    - Make sure that your application descriptor file contains well formed XML.

    - Make sure the information in the application descriptor file is correct. Pay
    particular attention to the application attributes, and the rootContent value.

    - Make sure that the AIRHelloWorld.html and AIRHelloWorld.xml files are in the
    same directory


    # Testing the AIR File


    Now that we have created the AIR file for our application, the only step left
    is to test the AIR file and make sure it installs correctly.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Testing the AIR file requires trying to install it onto the system, and then
    launching it:


    +   1. Switch to the directory that contains the AIR file in Windows Explorer
    (Windows) or the Finder (Mac OS X).

    2. Double-click the AIR file.

    3. Follow the instructions in the install dialog box.

    4. On the last screen of the install dialog box, make sure Run Application is
    checked.


    You application should launch and run.


    If it does not launch, or if you receive an error, check the following:


    +   1. Make sure that you have correctly installed the Beta version of Adobe AIR.

    2. Make sure that there were no errors when you created the AIR file via ADL.

    3. Make sure that you have uninstalled any previous versions of Adobe AIR.


    Once you have confirmed that the application is installed and runs correctly,
    you can relaunch it by clicking its icon. The default shortcut location varies,
    depending on your operating system:


    | System | Shortcut |

    |---|---|

    | Mac OS X | /Users/<USERNAME>/Applications |

    | Windows | Start Menu → Programs → <APPLICATION NAME> |


    # Deploying the AIR File


    Once you have successfully created and packaged your AIR application, all that
    is left is to distribute the application. This is done by distributing the AIR
    file, either via the web, or directly via CD-ROM or other distribution mechanisms.'
  merge: -1
