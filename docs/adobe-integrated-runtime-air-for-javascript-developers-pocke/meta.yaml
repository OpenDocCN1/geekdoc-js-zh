    \ is running.\n\nSolution\nRegister for the InvokeEvent, and capture command line\
    \ arguments passed into your application.\n\nDiscussion\nWhenever an application\
    \ is started, or an application is called from the command line while it is running,\
    \ an InvokeEvent will be broadcast. The event handler for this is passed information\
    \ about the event, including any arguments passed to the application on the command\
