  - "[PAGE 79]\n\nAPIs via the runtime property and the complete API package path,\
    \ it can lead to very verbose code.\n\nIn order to make it easier to use some\
    \ of the more common AIR and Flash Player APIs from within JavaScript, Adobe has\
    \ created a JavaScript include file, named AIRAliases.js. This file, which can\
    \ be found in the frameworks directory of the SDK, provides aliases for commonly\
    \ used APIs to make them more convenient to use from within JavaScript.\n\nTo\
    \ use the aliases file, copy it from the SDK to your application directory (make\
    \ sure to also package it in your AIR file). You then include it within your application\
    \ using the script tag in each HTML document that you want to leverage the aliases\
    \ in.\n\nFor example, let's look at the earlier example that writes a file to\
    \ the desktop, but uses the JavaScript aliases provided in the AIRAliases.js file\
    \ instead of typing out the complete package paths:\n\n```\n<script src=\"AIRAliases.js\"\
    ></script>\n\n<script type=\"text/javascript\">\n    function writeFile()\n  \
    \  {\n        var desktop = air.File.desktopDirectory;\n        var file = desktop.resolve(\"\
    output.txt\");\n        var fileStream = new air.FileStream();\n        fileStream.open(file,\
    \ air.FileMode.WRITE);\n        fileStream.writeUTFBytes(\"Hello World\");\n \
    \       fileStream.close();\n    }\n</script>\n```\n\nFirst, notice that the code\
    \ is much less verbose. This is because instead of having to reference APIs via\
    \ window.runtime and then their complete package path, we can use the aliases\
    \ within the include file."
  - '[PAGE 80]


