    \n</body>\n</html>\n```\n\n# Sound\n\n# Playing a Sound\n\n# Problem\n\nYou need\
    \ to play a sound in your application.\n\n# Solution\n\nUse the Sound API within\
    \ AIR to play an MP3 file.\n\n# Discussion\n\nAIR includes complete support for\
    \ accessing Flash Player APIs from JavaScript. This includes the Sound class that\
    \ can be used to play local or remote MP3 files.\n\nPlaying a sound is simple,\
    \ and requires two main steps:\n\n+   1. Create a URLRequest instance that references\
    \ the local or remote sound.\n2. Pass the URLRequest to the Sound instance, and\
    \ play it."
  - "[PAGE 159]\n\nHere is the relevant code snippet:\n\n```\nvar soundPath =\n  \
    \  new air.URLRequest(\"app-resource:/sound.mp3\");\nvar s = new air.Sound();\n\
    \    s.load(soundPath);\n    s.play();\n```\n\nFirst, we create a URLRequest that\
    \ points to the location of the MP3 file we will play. In this case, we use an\
    \ app-resource URI that references the sound.mp3 file contained in the application\
    \ install directory. You can also use any valid URI, including both file and http\
    \ URIs:\n\n```\nvar soundPath =\n    new air.URLRequest(\"app-resource:/sound.mp3\"\
    );\n```\n\nWe then create an instance of the Sound class, pass the reference to\
    \ the MP3 path, and then call play:\n\n```\nvar s = new air.Sound();\n    s.load(soundPath);\n\
    \    s.play();\n```\n\nHere is the complete example with a play button:\n\n```\n\
    <html>\n<head>\n    <script src=\"AIRAliases.js\" />\n    <script type=\"text/javascript\"\
    >\n        function playSound()\n        {\n            var soundPath =\n    \
    \            new air.URLRequest(\"app-resource:/sound.mp3\");\n            var\
    \ s = new air.Sound();\n                s.load(soundPath);\n                s.play();\n\
    \        }\n    </script>\n</head>\n<body>\n    <input type=\"button\" value=\"\
    Play\" onClick=\"playSound()\">\n</body>\n</html>\n```"
