- md: "## Storing Data in a Database\n\n## Problem\n\nAn application needs to store\
    \ user-provided data in a relational database on disk.\n\n## Solution\n\nSQL92\
    \ INSERT statements can be created and executed using the SQLStatement class.\n\
    \n## Discussion\n\nGiven a valid database file with the appropriate schema created,\
    \ SQL92 statements can be executed using the SQLStatement object. The same SQLStatement\
    \ object can be reused to execute multiple statements. When reusing the same SQLStatement,\
    \ it's important to differentiate what type of statement has just been executed.\
    \ There are various means to accomplish listening for the different actions.\n\
    \n```javascript\nfunction doSave()\n{\n    var first = document.getElementById(\
    \ \"txtFirst\" ).value;\n    var last = document.getElementById( \"txtLast\" ).value;\n\
    \n    stmt.text = \"INSERT INTO contact VALUES ( \" +\n        \"NULL, \" +\n\
    \        \"'\" + first + \"', \" +\n        \"'\" + last + \"' )\";\n    stmt.execute();\n\
    }\n```\n\nOne approach is to assign different event handlers for the different\
    \ statements that will be executed. (Don't forget to remove the old handlers.)\
    \ Another approach is to specify different responder objects that have been created\
    \ with the specific statement in mind. The approach used in this example is a\
    \ basic state machine that tracks what type of statement has just been executed:\n\
    \n```javascript\nvar NONE = -1;\nvar CREATE_SCHEMA = 0;\nvar INSERT_DATA = 1;\n\
    \nvar state = NONE;\n\nvar stmt = new air.SQLStatement();\n\n// Other database\
    \ creation and configuration\n\nfunction doSave()\n{\n    var first = document.getElementById(\
    \ \"txtFirst\" ).value;\n    var last = document.getElementById( \"txtLast\" ).value;\n\
    \n    stmt.text = \"INSERT INTO contact VALUES ( \" +\n        \"NULL, \" +\n\
    \        \"'\" + first + \"', \" +\n        \"'\" + last + \"' )\";\n\n    //\
    \ Track state\n    state = INSERT_DATA;\n    stmt.execute();\n}\n```\n\nAfter\
    \ successfully executing a database statement, the SQLResultEvent.RESULT event\
    \ will be triggered. If an error occurs, the SQLStatusEvent.STATUS event will\
    \ be raised. By tracking the state, the method designed to handle the result can\
    \ determine the appropriate action(s) to take. In the case of inserting new data,\
    \ this may be user notification and updating of the user interface:\n\n```html\n\
    <html>\n<head>\n\n<title>Storing Database Data</title>\n<script type=\"text/javascript\"\
    \ src=\"AIRAliases.js\"></script>\n\n<script>\nvar db = null;\nvar stmt = null;\n\
    \nvar NONE = -1;\nvar CREATE_SCHEMA = 0;\nvar INSERT_DATA = 1;\n\nvar state =\
    \ NONE;\n\nfunction doDbOpen( event )\n{\n    stmt = new air.SQLStatement();\n\
    \    stmt.addEventListener( air.SQLErrorEvent.ERROR,\n                       \
    \    doStmtError );\n    stmt.addEventListener( air.SQLEvent.RESULT,\n       \
    \                    doStmtResult );\n\n    stmt.sqlConnection = db;\n    stmt.text\
    \ = \"CREATE TABLE IF NOT EXISTS contact ( \" +\n                \"id INTEGER\
    \ PRIMARY KEY AUTOINCREMENT, \" +\n                \"first TEXT, \" +\n      \
    \          \"last TEXT );\";\n\n    state = CREATE_SCHEMA;\n    stmt.execute();\n\
    }\n\nfunction doLoad()\n{\n    var file =\n        air.File.applicationResourceDirectory.resolve(\
    \ \"crm.db\" );\n\n    db = new air.SQLConnection();\n    db.addEventListener(\
    \ air.SQLEvent.OPEN, doDbOpen );\n    db.open( file, true );\n\n    document.getElementById(\
    \ \"btnSave\" ).\n        addEventListener( \"click\", doSave );\n}\n\nfunction\
    \ doSave()\n{\n    var first = document.getElementById( \"txtFirst\" ).value;\n\
    \    var last = document.getElementById( \"txtLast\" ).value;\n\n    stmt.text\
    \ = \"INSERT INTO contact VALUES ( \" +\n                \"NULL, \" +\n      \
    \          \"'\" + first + \"', \" +\n                \"'\" + last + \"' )\";\n\
    \n    state = INSERT_DATA;\n    stmt.execute();\n}\n\nfunction doStmtResult( event\
    \ )\n{\n    switch( state )\n    {\n        case CREATE_SCHEMA:\n            alert(\
    \ \"The database table has been created.\" );\n            state = NONE;\n   \
    \         break;\n        case INSERT_DATA:\n            document.getElementById(\
    \ \"txtFirst\" ).value = \"\";\n            document.getElementById( \"txtLast\"\
    \ ).value = \"\";\n\n            alert( \"A new record has been stored.\" );\n\
    \    }\n}\n\nfunction doStmtError( event )\n{\n    alert( \"There has been a problem\
    \ executing a statement:\\n\" + event.error.message );\n}\n\nfunction doUnload()\n\
    {\n    db.close();\n}\n</script>\n\n</head>\n<body onload=\"doLoad()\" onunload=\"\
    doUnload()\">\n\n<div>\n    First name: <input id=\"txtFirst\" type=\"text\" />\n\
    </div>\n<div>\n    Last name: <input id=\"txtLast\" type=\"text\" />\n</div>\n\
    <div>\n    <input id=\"btnSave\" type=\"button\" value=\"Save\" />\n</div>\n\n\
    </body>\n</html>\n```\n\n## Accessing Database Data\n\n## Problem\n\nYou need\
    \ to generate a tabular display of data from the embedded database.\n\n## Solution\n\
    \nDatabase data can be queried using SQL92 and the SQLStatement class.\n\n## Discussion\n\
    \nTraditional SELECT statements can be run using a SQLStatement object that has\
    \ been referenced against an existing database. A successful execution of the\
    \ SELECT statement invokes the registered SQLResultEvent.RESULT event handler.\
    \ That event handler will get a SQLResultEvent object which contains the result\
    \ data:\n\n```javascript\nfunction doStmtResult( event )\n{\n    var elem = null;\n\
    \    var results = stmt.getResult();\n\n    if( results.data != null )\n    {\n\
    \        for( var c = 0; c < results.data.length; c++ )\n        {\n         \
    \   elem = document.createElement( \"div\" );\n            elem.innerText = results.data[c].first\
    \ + \" \" + results.data[c].last;\n\n            document.body.appendChild( elem\
    \ );\n        }\n    }\n}\n```\n\n**TIP**\nThis snippet forgoes much of the state\
    \ management, event registration and database connectivity covered in other sections.\
    \ Please review that content, or the example at the end of this section, for complete\
    \ coverage of the topic.\n\nTo get any result data, the SQLStatement.getResult()\
    \ is called, which returns a SQLResult object. The SQLResult.data property is\
    \ an Array of the results, if any. The SQLResult.data Array will contain Object\
    \ instances whose properties match the names of the columns used in the query.\
    \ This Array can be used to iterate over the results of a query.\n\nIf the database\
    \ table that is being queried has no data, or the statement did not return any\
    \ data, the SQLResult.data property will be null:\n\n```html\n<html>\n<head>\n\
    <title>Accessing Database Data</title>\n<script type=\"text/javascript\" src=\"\
    AIRAliases.js\">\n</script>\n<script>\nvar db = null;\nvar stmt = null;\n\nvar\
    \ NONE = -1;\nvar CREATE_SCHEMA = 0;\nvar SELECT_DATA = 1;\n\nvar state = NONE;\n\
    \nfunction doDbOpen( event )\n{\n    stmt = new air.SQLStatement();\n    stmt.addEventListener(\
    \ air.SQLErrorEvent.ERROR,\n                           doStmtError );\n    stmt.addEventListener(\
    \ air.SQLResultEvent.RESULT,\n                           doStmtResult );\n\n \
    \   stmt.sqlConnection = db;\n    stmt.text = \"CREATE TABLE IF NOT EXISTS contact\
    \ ( \" +\n                \"id INTEGER PRIMARY KEY AUTOINCREMENT, \" +\n     \
    \           \"first TEXT, \" +\n                \"last TEXT )\";\n\n    state\
    \ = CREATE_SCHEMA;\n    stmt.execute();\n}\n\nfunction doLoad()\n{\n    var file\
    \ =\n        air.File.applicationResourceDirectory.resolve( \"crm.db\" );\n\n\
    \    db = new air.SQLConnection();\n    db.addEventListener( air.SQLEvent.OPEN,\
    \ doDbOpen );\n    db.open( file, true );\n}\n\nfunction doStmtResult( event )\n\
    {\n    var elem = null;\n    var result = null;\n\n    switch( state )\n    {\n\
    \        case CREATE_SCHEMA:\n            stmt.text = \"SELECT * FROM contact\"\
    ;\n\n            state = SELECT_DATA;\n            stmt.execute();\n\n       \
    \     break;\n\n        case SELECT_DATA:\n            result = stmt.getResult();\n\
    \n            if( result.data != null )\n            {\n                for( var\
    \ c = 0; c < result.data.length; c++ )\n                {\n                  \
    \  elem = document.createElement( \"div\" );\n                    elem.innerText\
    \ = result.data[c].first +\n                    \" \" + result.data[c].last;\n\
    \n                    document.body.appendChild( elem );\n                }\n\
    \            }\n\n            state = NONE;\n            break;\n\n        default:\n\
    \            state = NONE;\n            break;\n    }\n}\n</script>\n</head>\n\
    <body onload=\"doLoad()\" onunload=\"doUnload()\">\n\n<div id=\"results\"></div>\n\
    \n</body>\n</html>\n```"
  mdcn: "\n## 在数据库中存储数据\n\n## 问题\n\n一个应用程序需要将用户提供的数据存储在磁盘上的关系型数据库中。\n\n## 解决方案\n\n\
    可以使用 `SQLStatement` 类来创建和执行 SQL92 `INSERT` 语句。\n\n## 讨论\n\n给定一个具有适当模式（schema）的可用数据库文件，可以使用\
    \ `SQLStatement` 对象执行 SQL92 语句。同一个 `SQLStatement` 对象可以被重用来执行多个语句。在重用同一个 `SQLStatement`\
    \ 时，区分刚刚执行的是哪种类型的语句非常重要。有多种方法可以用来监听不同的操作。\n\n```javascript\nfunction doSave()\n\
    {\n    var first = document.getElementById( \"txtFirst\" ).value;\n    var last\
    \ = document.getElementById( \"txtLast\" ).value;\n\n    stmt.text = \"INSERT\
    \ INTO contact VALUES ( \" +\n        \"NULL, \" +\n        \"'\" + first + \"\
    ', \" +\n        \"'\" + last + \"' )\";\n    stmt.execute();\n}\n```\n\n一种方法是为即将执行的不同语句分配不同的事件处理程序。（别忘了移除旧的处理程序。）另一种方法是指定针对特定语句创建的不同响应对象。本示例中使用的方法是一个基本的状态机，它跟踪刚刚执行的是哪种类型的语句：\n\
    \n```javascript\nvar NONE = -1;\nvar CREATE_SCHEMA = 0;\nvar INSERT_DATA = 1;\n\
    \nvar state = NONE;\n\nvar stmt = new air.SQLStatement();\n\n// 其他数据库创建和配置\n\n\
    function doSave()\n{\n    var first = document.getElementById( \"txtFirst\" ).value;\n\
    \    var last = document.getElementById( \"txtLast\" ).value;\n\n    stmt.text\
    \ = \"INSERT INTO contact VALUES ( \" +\n        \"NULL, \" +\n        \"'\" +\
    \ first + \"', \" +\n        \"'\" + last + \"' )\";\n\n    // 跟踪状态\n    state\
    \ = INSERT_DATA;\n    stmt.execute();\n}\n```\n\n在成功执行数据库语句后，将触发 `SQLResultEvent.RESULT`\
    \ 事件。如果发生错误，则会引发 `SQLStatusEvent.STATUS` 事件。通过跟踪状态，设计用于处理结果的方法可以确定要采取的适当操作。在插入新数据的情况下，这可能是通知用户和更新用户界面：\n\
    \n```html\n<html>\n<head>\n\n<title>存储数据库数据</title>\n<script type=\"text/javascript\"\
    \ src=\"AIRAliases.js\"></script>\n\n<script>\nvar db = null;\nvar stmt = null;\n\
    \nvar NONE = -1;\nvar CREATE_SCHEMA = 0;\nvar INSERT_DATA = 1;\n\nvar state =\
    \ NONE;\n\nfunction doDbOpen( event )\n{\n    stmt = new air.SQLStatement();\n\
    \    stmt.addEventListener( air.SQLErrorEvent.ERROR,\n                       \
    \    doStmtError );\n    stmt.addEventListener( air.SQLEvent.RESULT,\n       \
    \                    doStmtResult );\n\n    stmt.sqlConnection = db;\n    stmt.text\
    \ = \"CREATE TABLE IF NOT EXISTS contact ( \" +\n                \"id INTEGER\
    \ PRIMARY KEY AUTOINCREMENT, \" +\n                \"first TEXT, \" +\n      \
    \          \"last TEXT );\";\n\n    state = CREATE_SCHEMA;\n    stmt.execute();\n\
    }\n\nfunction doLoad()\n{\n    var file =\n        air.File.applicationResourceDirectory.resolve(\
    \ \"crm.db\" );\n\n    db = new air.SQLConnection();\n    db.addEventListener(\
    \ air.SQLEvent.OPEN, doDbOpen );\n    db.open( file, true );\n\n    document.getElementById(\
    \ \"btnSave\" ).\n        addEventListener( \"click\", doSave );\n}\n\nfunction\
    \ doSave()\n{\n    var first = document.getElementById( \"txtFirst\" ).value;\n\
    \    var last = document.getElementById( \"txtLast\" ).value;\n\n    stmt.text\
    \ = \"INSERT INTO contact VALUES ( \" +\n                \"NULL, \" +\n      \
    \          \"'\" + first + \"', \" +\n                \"'\" + last + \"' )\";\n\
    \n    state = INSERT_DATA;\n    stmt.execute();\n}\n\nfunction doStmtResult( event\
    \ )\n{\n    switch( state )\n    {\n        case CREATE_SCHEMA:\n            alert(\
    \ \"数据库表已创建。\" );\n            state = NONE;\n            break;\n        case\
    \ INSERT_DATA:\n            document.getElementById( \"txtFirst\" ).value = \"\
    \";\n            document.getElementById( \"txtLast\" ).value = \"\";\n\n    \
    \        alert( \"新记录已存储。\" );\n    }\n}\n\nfunction doStmtError( event )\n{\n\
    \    alert( \"执行语句时出现问题：\\n\" + event.error.message );\n}\n\nfunction doUnload()\n\
    {\n    db.close();\n}\n</script>\n\n</head>\n<body onload=\"doLoad()\" onunload=\"\
    doUnload()\">\n\n<div>\n    名：<input id=\"txtFirst\" type=\"text\" />\n</div>\n\
    <div>\n    姓：<input id=\"txtLast\" type=\"text\" />\n</div>\n<div>\n    <input\
    \ id=\"btnSave\" type=\"button\" value=\"保存\" />\n</div>\n\n</body>\n</html>\n\
    ```\n\n## 访问数据库数据\n\n## 问题\n\n你需要从嵌入式数据库生成数据的表格显示。\n\n## 解决方案\n\n可以使用 SQL92 和\
    \ `SQLStatement` 类来查询数据库数据。\n\n## 讨论\n\n可以使用已引用现有数据库的 `SQLStatement` 对象来运行传统的\
    \ `SELECT` 语句。成功执行 `SELECT` 语句会调用已注册的 `SQLResultEvent.RESULT` 事件处理程序。该事件处理程序将获取一个包含结果数据的\
    \ `SQLResultEvent` 对象：\n\n```javascript\nfunction doStmtResult( event )\n{\n \
    \   var elem = null;\n    var results = stmt.getResult();\n\n    if( results.data\
    \ != null )\n    {\n        for( var c = 0; c < results.data.length; c++ )\n \
    \       {\n            elem = document.createElement( \"div\" );\n           \
    \ elem.innerText = results.data[c].first + \" \" + results.data[c].last;\n\n \
    \           document.body.appendChild( elem );\n        }\n    }\n}\n```\n\n**提示**\n\
    此代码片段省略了其他章节中介绍的大量状态管理、事件注册和数据库连接内容。请查看那些内容，或本节末尾的示例，以完整了解该主题。\n\n要获取任何结果数据，需调用\
    \ `SQLStatement.getResult()`，它返回一个 `SQLResult` 对象。`SQLResult.data` 属性是结果（如果有的话）的数组（Array）。`SQLResult.data`\
    \ 数组将包含其属性与查询中使用的列名相匹配的 `Object` 实例。可以使用此数组来迭代查询的结果。\n\n如果被查询的数据库表没有数据，或者语句没有返回任何数据，`SQLResult.data`\
    \ 属性将为 `null`：\n\n```html\n<html>\n<head>\n<title>访问数据库数据</title>\n<script type=\"\
    text/javascript\" src=\"AIRAliases.js\">\n</script>\n<script>\nvar db = null;\n\
    var stmt = null;\n\nvar NONE = -1;\nvar CREATE_SCHEMA = 0;\nvar SELECT_DATA =\
    \ 1;\n\nvar state = NONE;\n\nfunction doDbOpen( event )\n{\n    stmt = new air.SQLStatement();\n\
    \    stmt.addEventListener( air.SQLErrorEvent.ERROR,\n                       \
    \    doStmtError );\n    stmt.addEventListener( air.SQLResultEvent.RESULT,\n \
    \                          doStmtResult );\n\n    stmt.sqlConnection = db;\n \
    \   stmt.text = \"CREATE TABLE IF NOT EXISTS contact ( \" +\n                \"\
    id INTEGER PRIMARY KEY AUTOINCREMENT, \" +\n                \"first TEXT, \" +\n\
    \                \"last TEXT )\";\n\n    state = CREATE_SCHEMA;\n    stmt.execute();\n\
    }\n\nfunction doLoad()\n{\n    var file =\n        air.File.applicationResourceDirectory.resolve(\
    \ \"crm.db\" );\n\n    db = new air.SQLConnection();\n    db.addEventListener(\
    \ air.SQLEvent.OPEN, doDbOpen );\n    db.open( file, true );\n}\n\nfunction doStmtResult(\
    \ event )\n{\n    var elem = null;\n    var result = null;\n\n    switch( state\
    \ )\n    {\n        case CREATE_SCHEMA:\n            stmt.text = \"SELECT * FROM\
    \ contact\";\n\n            state = SELECT_DATA;\n            stmt.execute();\n\
    \n            break;\n\n        case SELECT_DATA:\n            result = stmt.getResult();\n\
    \n            if( result.data != null )\n            {\n                for( var\
    \ c = 0; c < result.data.length; c++ )\n                {\n                  \
    \  elem = document.createElement( \"div\" );\n                    elem.innerText\
    \ = result.data[c].first +\n                    \" \" + result.data[c].last;\n\
    \n                    document.body.appendChild( elem );\n                }\n\
    \            }\n\n            state = NONE;\n            break;\n\n        default:\n\
    \            state = NONE;\n            break;\n    }\n}\n</script>\n</head>\n\
    <body onload=\"doLoad()\" onunload=\"doUnload()\">\n\n<div id=\"results\"></div>\n\
