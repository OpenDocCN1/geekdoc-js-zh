  md: "Here is the relevant code snippet:\n\n```\nvar soundPath =\n    new air.URLRequest(\"\
    app-resource:/sound.mp3\");\nvar s = new air.Sound();\n    s.load(soundPath);\n\
    \    s.play();\n```\n\nFirst, we create a URLRequest that points to the location\
    \ of the MP3 file we will play. In this case, we use an app-resource URI that\
    \ references the sound.mp3 file contained in the application install directory.\
    \ You can also use any valid URI, including both file and http URIs:\n\n```\n\
    var soundPath =\n    new air.URLRequest(\"app-resource:/sound.mp3\");\n```\n\n\
    We then create an instance of the Sound class, pass the reference to the MP3 path,\
    \ and then call play:\n\n```\nvar s = new air.Sound();\n    s.load(soundPath);\n\
    \    s.play();\n```\n\nHere is the complete example with a play button:\n\n```\n\
