  md: '# # Uninstalling Pre-Beta Versions of Adobe AIR


    If you have previously installed an earlier version of Adobe AIR (formerly referred
    to as Apollo), you need to uninstall those versions before installing the Beta
    version.


    # ## Uninstalling on Windows


    +   1. In the Windows Start menu, select Settings → Control Panel.

    2. Select the Add or Remove Programs control panel.

    3. Select Adobe Apollo 1.0 Alpha1 to uninstall the Apollo runtime.

    4. Click the Change/Remove button.


    # ## Uninstalling on Mac


    +   1. Delete the /Library/Frameworks/Adobe Apollo.framework directory.

    2. Delete the /Library/Receipts/Adobe Apollo.pkg file.

    3. Empty the Trash.


    Once you have done this, you are ready to install the Beta runtime.


    # # Installing Adobe AIR


    While it is not necessary to have Adobe AIR installed on your computer in order
    to develop and test AIR applications, it is useful to have in order to try other
    AIR applications and to test your final application’s deployment and packaging.'
