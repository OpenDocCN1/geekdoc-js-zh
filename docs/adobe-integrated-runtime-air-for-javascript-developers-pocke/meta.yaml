    \ New Native Window\n\n**Problem**\n\nYou need to display an additional window\
    \ into which additional content can be loaded, and you need to be able to fine\
    \ tune how the new window appears.\n\n**Solution**\n\nThe `NativeWindow` class\
    \ provides the foundation for creating and managing new windows that require a\
    \ high degree of customization and control.\n\n**Discussion**\n\nNative windows\
    \ make an excellent choice for creating and managing new windows that require\
    \ a high degree of customization. You may want the application to hide the minimize/maximize\
    \ buttons. You may also want to control window z-ordering, or force a particular\
    \ window to always stay on top. The `NativeWindow` class offers control over these\
    \ aspects of a window and more.\n\nThe `NativeWindow` constructor takes two arguments;\
    \ a Boolean specifying whether or not the window is initially visible, and a `NativeWindowInitOptions`\
    \ object which controls aspects of the window such as whether or not it is resizable,\
    \ or even if it has any system chrome at all. The `NativeWindowInitOptions` constructor\
    \ takes no arguments:"
