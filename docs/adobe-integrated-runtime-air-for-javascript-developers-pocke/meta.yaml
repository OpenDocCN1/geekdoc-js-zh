    # Packaging and Deploying the AIR Application


    Now that we understand how to build, test and debug an AIR application, we are
    ready to create an AIR file which will allow us to deploy and distribute our application.


    # What Is an AIR File?


    An AIR file is a zip-based application distribution package that is used to distribute
    AIR applications. It contains all of the files necessary to install and run an
    AIR application, and is used by the Adobe Integrated Runtime to create and install
    an AIR application onto the user’s system.


    The AIR file is created by the ADT command line tool included in the AIR SDK and
    is used to distribute the application to other users.


    > **TIP**

    AIR files require that Adobe AIR already be installed on the user’s system.

    ADL will be able to also create OS-specific native installers that will be able
    to first install Adobe AIR and then install the AIR application for systems where
    Adobe AIR is not already installed.

    This functionality is not yet implemented in the public Beta.


    An AIR file requires a minimum of two files, the application descriptor file,
    and a root application file. However, you can also include other files, icons,
    directories, and assets that will be bundled with the AIR file, and installed
    alongside your application. These files will then be available to the application
    at runtime.'
  - '[PAGE 61]


    # Creating an AIR File Using ADT


    The ADT command-line tool included in the Adobe AIR SDK is used to create AIR
    files. Its usage format is:


    ```

    adl -package AIRFILENAME FILESTOINCLUDE

    ```


    To create an AIR file for our application:


    +   1. Open a terminal (Mac OS X) or Console (Windows) window.

    2. Change to the directory which contains AIRHelloWorld.html and AIRHelloWorld.xml.

    3. Run the following command:


    ```

    adt -package AIRHelloWorld.air AIRHelloWorld.xml AIRHelloWorld.html

    ```


    This should create a file named AIRHelloWorld.air in the same directory. If the
    file is not created, or if you receive any errors:


    +   - Make sure you have configured the SDK correctly in order to ensure that
    the ADT tool can be found.

    - Make sure that you are running the ADT command from the same directory that
    contains the AIRHelloWorld.xml file.

    - Make sure that your application descriptor file contains well formed XML.

    - Make sure the information in the application descriptor file is correct. Pay
    particular attention to the application attributes, and the rootContent value.

    - Make sure that the AIRHelloWorld.html and AIRHelloWorld.xml files are in the
    same directory


    # Testing the AIR File


    Now that we have created the AIR file for our application, the only step left
    is to test the AIR file and make sure it installs correctly.'
  - '[PAGE 62]


    Testing the AIR file requires trying to install it onto the system, and then launching
    it:


    +   1. Switch to the directory that contains the AIR file in Windows Explorer
    (Windows) or the Finder (Mac OS X).

    2. Double-click the AIR file.

    3. Follow the instructions in the install dialog box.

    4. On the last screen of the install dialog box, make sure Run Application is
    checked.


    You application should launch and run.


    If it does not launch, or if you receive an error, check the following:


    +   1. Make sure that you have correctly installed the Beta version of Adobe AIR.

    2. Make sure that there were no errors when you created the AIR file via ADL.

    3. Make sure that you have uninstalled any previous versions of Adobe AIR.


    Once you have confirmed that the application is installed and runs correctly,
    you can relaunch it by clicking its icon. The default shortcut location varies,
    depending on your operating system:


    | System | Shortcut |

    |---|---|

    | Mac OS X | /Users/<USERNAME>/Applications |

    | Windows | Start Menu → Programs → <APPLICATION NAME> |


    # Deploying the AIR File


    Once you have successfully created and packaged your AIR application, all that
    is left is to distribute the application. This is done by distributing the AIR
    file, either via the web, or directly via CD-ROM or other distribution mechanisms.'
  - '[PAGE 63]


    # Setting the MIME type


    One thing to watch out for when distributing AIR files for download from a web
    server, is to ensure that the MIME type is set correctly on the server. If the
    MIME type is not set correctly, web browsers may treat an AIR file as a zip file
    (and in the process rename it), or may display the raw bytes of the AIR file in
    the browser, instead of downloading it to the user''s system.


    The correct MIME type for an AIR file is:


    ```

    application/vnd.adobe.air-application-installer-package+zip

    ```


    For example, to set the MIME type for the Apache server, you would add the following
    line to your Apache configuration file:


    ```

    AddType application/vnd.adobe.air-application-installer-package+zip .air

    ```


    Check the documentation for your web server for specific instruction on how to
    set the MIME type.


    At this point, you have all of the basic knowledge of how to develop, test and
    deploy AIR applications, and are ready to begin to use the AIR APIs to build more
    full-featured and advanced applications.'
  - '[PAGE 64]


    # CHAPTER 3

    # Working with JavaScript and HTML Within AIR


    This chapter provides an in-depth overview of the HTML and JavaScript environments
    within the Adobe Integrated Runtime. It discusses:


    +   - The use of the open source WebKit HTML-rendering engine within Adobe AIR

    - JavaScript functionality within Adobe AIR

    - AIR-specific implementations of functionality

    - Working with AIR, Flash Player and ActionScript APIs from JavaScript


    Once you have completed this chapter, you should have a solid understanding of
    the HTML and JavaScript environments within Adobe AIR. You should also understand
    how to work with AIR and ActionScript APIs within HTML and JavaScript-based applications.


    # ## WebKit Within the Adobe Integrated Runtime


    Adobe AIR leverages the open source WebKit-rendering engine to add support for
    rendering HTML content to the runtime.


    In addition to HTML rendering, WebKit also provides support for associated web
    technologies, such as:


    +   - JavaScript

    - XMLHttpRequest'
- md: "## Why WebKit?\n\nAdobe spent a considerable amount of time researching which\
    \ HTML engine to use within Adobe AIR and used a number of criteria that ultimately\
    \ led them to settle on WebKit.\n\n### Open project\n\nAdobe knew from the very\
    \ beginning that it did not want to create and maintain its own HTML rendering\
    \ engine. Not only would this be an immense amount of work, but it would also\
    \ make it difficult for developers, who would then have to become familiar with\
    \ all of the quirks of yet another HTML engine.\n\nWebKit provides Adobe AIR with\
    \ a full-featured HTML engine that is under continuous development by a robust\
    \ development community that includes individual developers as well as large companies\
    \ such as Nokia and Apple. This allows Adobe to focus on bug fixes and features,\
    \ and also means that Adobe can actively contribute back to WebKit, while also\
    \ taking advantage of the contributions made by other members of the WebKit project.\n\
    \n### Proven technology that web developers know\n\nAs discussed earlier, one\
    \ of the biggest problems with complex web application development is ensuring\
    \ that content works consistently across browsers. While something may work perfectly\
    \ in Firefox on the Mac, it may completely fail in Internet Explorer on Windows.\
    \ Because of this, testing and debugging browser-based content can be a nightmare\
    \ for developers.\n\nAdobe wanted to ensure that developers were already familiar\
    \ with the HTML engine used within Adobe AIR, so they did not have to learn all\
    \ of the quirks and bugs of a new engine. Since Safari (which is built on top\
    \ of WebKit) is the default browser for Mac OS X (and is also available on Windows),\
    \ developers should be familiar with developing for WebKit.\n\n### Minimum effect\
    \ on AIR runtime size\n\nThe target size for Adobe AIR is between 5 and 9 MB.\
    \ The WebKit code base was well-written and organized and has had a minimal impact\
    \ on the final AIR runtime.\n\n### Proven ability to run on mobile devices\n\n\
    While the first release of Adobe AIR runs only on personal computers, the long-term\
    \ vision is to extend Adobe AIR from the desktop to cell phones and other devices.\
    \ WebKit has a proven ability to run on such devices and has been ported to cell\
    \ phones by both Nokia and Apple.\n\n## JavaScript Within AIR\n\nAdobe AIR has\
    \ full support for JavaScript within HTML content. JavaScript 1.5, which corresponds\
    \ to ECMA-262 is supported.\n\nThe JavaScript engine is implemented via WebKit,\
    \ and works the same as it does within WebKit-based browsers. In addition to having\
    \ access to the HTML DOM, JavaScript can also access AIR and Flash Player APIs\
    \ directly via the `window.runtime` property. This will be discussed in more detail\
    \ later.\n\n> **TIP**\n> For an in-depth introduction and discussion of JavaScript,\
    \ check out *JavaScript: the Definitive Guide: 5th Edition*, published by O'Reilly:\
    \ http://www.oreilly.com/catalog/jscript5/\n\n## AIR Implementation of Functionality\n\
    \nHTML and JavaScript functionality is consistent with that found in other WebKit-based\
    \ projects and browsers, such as Apple's Safari browser. When exploring documentation\
    \ on HTML engine / browser functionality, you can use references to the Safari\
    \ browser as an indicator of the functionality available within the HTML environment\
    \ within AIR.\n\nHowever, because the HTML engine is running in a runtime, and\
    \ not a browser, there are a few differences that are useful to understand before\
    \ beginning development with HTML and JavaScript within Adobe AIR.\n\n### Cookies\n\
    \nThe Adobe Integrated Runtime has full support for setting and getting cookies\
    \ from HTML-based content. Cookie support is implemented via the operating system's\
    \ networking stack. This means that AIR applications can share cookies set by\
    \ any browser or application that also leverage the operating system stack.\n\n\
    For example, AIR applications can share cookies set through Internet Explorer\
    \ on Windows, and Safari on Mac, as they both also use the operating system's\
    \ cookie storage functionality. Firefox implements its own cookie storage and\
    \ thus cookies set within Firefox cannot be shared with AIR applications.\n\n\
    > **TIP**\n> In addition to cookies, AIR applications have a number of other APIs\
    \ that can be used for persistent data, including the file API, as well as the\
    \ embedded database API.\n\n### Windowing\n\n#### Windows\n\nYou can create new\
    \ windows via JavaScript just as you can within the browser.\n\n```javascript\n\
    myWindow = window.open(\"Window.html\", \"myWindow\", \"height=400,width=400\"\
    );\n```\n\nHowever, the `runtime` property which provides access to AIR and Flash\
    \ Player APIs is not automatically available within the new window. In order to\
    \ make it available, you must explicitly place it within the scope of the new\
    \ window like so:\n\n```javascript\nwindow.runtime = window.opener.runtime;\n\
    ```\n\n> **TIP**\n> Full support of native windows is not available within the\
    \ Beta. Only APIs available from JavaScript have been implemented.\n\n#### Dialogs\n\
    \nHTML dialogs are also supported within AIR applications, although not all have\
    \ been implemented within the Beta.\n\n| Dialog | Supported in Beta |\n|---|---|\n\
    | alert | yes |\n| confirm | yes |\n| prompt | no |\n\nIn addition, the file-browsing\
    \ dialog created via:\n\n```html\n<input type=\"file\" />\n```\n\nis not currently\
    \ supported within the Beta.\n\nAny dialogs not currently supported in the Beta,\
    \ will be supported in the 1.0 release.\n\n### XMLHttpRequest and Ajax\n\nThe\
    \ `XMLHttpRequest` object, which enables the use of Ajax techniques for sending\
    \ and loading data, is completely supported within AIR applications.\n\nOne advantage\
    \ to developing Ajax applications within Adobe AIR versus the browser, is that\
    \ because you have a consistent runtime to target across operating systems, you\
    \ do not have to worry about cross-browser, platform inconsistencies in how the\
    \ API is implemented.\n\nThe primary benefit of this is that you have to write\
    \ only one version of the code.\n\nHere's a simple example of an XMLHttpRequest\
    \ object call within an AIR application that works regardless of which operating\
    \ system the application is running on:\n\n```html\n<script type=\"text/javascript\"\
    >\n    var xmlhttp;\n    function appLoad()\n    {\n        //replace with URL\
    \ to resource being loaded\n        var url = \"http://www.mikechambers.com/blog/\"\
    ;\n        xmlhttp = new XMLHttpRequest();\n        xmlhttp.open(\"GET\", url,\
    \ true);\n\n        xmlhttp.onreadystatechange=function(){\n            if (xmlhttp.readyState==4)\n\
    \            {\n                runtime.trace(xmlhttp.responseText);\n       \
    \     }\n        }\n        xmlhttp.send(null);\n    }\n</script>\n```\n\nWhen\
    \ called, this function uses the XMLHttpRequest object to load the specified URL\
    \ and prints its contents out to the command line. The main thing to note in this\
    \ example is that because the runtime is known and it is consistent across operating\
    \ systems, you do not have to detect the existence of—or differences in—the implementation\
    \ of XMLHttpRequest as you would when deploying in the browser.\n\nBoth synchronous\
    \ and asynchronous XMLHttpRequest calls are supported, as is loading data across\
    \ domains.\n\n### URI Schemes\n\nWorking with Universal Resource Identifiers (URIs)\
    \ within HTML content in AIR applications is largely the same as working with\
    \ URIs within the browser. This section gives a quick overview of working with\
    \ URIs within HTML content in AIR applications, and introduces some new URIs made\
    \ available by the runtime.\n\n#### Supported URI schemes\n\nAdobe AIR provides\
    \ support for the most common URI schemes available within the browser (Table\
    \ 3-1).\n\n**Table 3-1. Supported URI schemes**\n\n| URI scheme | Description\
    \ |\n|---|---|\n| http:// | URI that points to a resource accessed via the standard\
    \ HTTP protocol. This is fully supported within Adobe AIR. |\n| https:// | URI\
    \ that points to a resource accessed via a protocol encrypted with SSL/TLS. This\
    \ is fully supported within Adobe AIR. |\n| file:// | URI that points to a resource\
    \ on the local or a networked file system. |\n| ftp:// | URI that points to a\
    \ resource accessed with the FTP protocol. In the Adobe AIR Beta, requests for\
    \ files will work correctly, while requests for directories return an empty page\
    \ with no directory listing. |\n\n#### Unsupported URI schemes\n\nIn the Beta\
    \ build of Adobe AIR, the commonly used `mailto://` and `feed://` URI schemes\
    \ are not available.\n\nAt the time that the book was written, it had not yet\
    \ been determined whether and/or how these URI schemes would be available for\
    \ the 1.0 release.\n\n#### AIR URI Schemes\n\nAdobe AIR provides a number of additional\
    \ URIs that make it easy to reference files and content within specific areas\
    \ of the user's system (Table 3-2).\n\n**Table 3-2. Adobe AIR URI schemes**\n\n\
    | URI | Description |\n|---|---|\n| app-resource:/ | Provides a reference to the\
    \ root content directory of the application. This should be used when referencing\
    \ content included within the AIR file. |\n| app-storage:/ | Provides a reference\
    \ to an application-specific storage area on the user's system. This area is useful\
    \ for storing user-specific application settings and content. |\n\nHere is a simple\
    \ example of the `app-resource` AIR URI:\n\n```\napp-resource:/foo/test.html\n\
    ```\n\nThis references a file named `test.html` in the `foo` directory that was\
    \ installed with the application."
  mdcn: "\n## 为何选择 WebKit？\n\nAdobe 投入了大量时间研究在 Adobe AIR 中应使用哪种 HTML 引擎，并综合多项标准，最终决定采用\
    \ WebKit。\n\n### 开源项目\n\nAdobe 从一开始就知道，他们不想创建并维护自己的 HTML 渲染引擎。这不仅工作量巨大，还会给开发者带来麻烦，因为他们需要熟悉另一个\
    \ HTML 引擎的所有特性。\n\nWebKit 为 Adobe AIR 提供了一个功能齐全的 HTML 引擎，它由一个强大的开发社区持续开发，该社区包括个人开发者以及诺基亚和苹果等大公司。这使得\
    \ Adobe 能够专注于修复错误和添加功能，同时也意味着 Adobe 可以积极地向 WebKit 贡献代码，同时利用 WebKit 项目其他成员的贡献。\n\
    \n### Web 开发者熟知的成熟技术\n\n如前所述，复杂 Web 应用开发面临的最大问题之一，是确保内容在不同浏览器中表现一致。某些功能在 Mac 上的\
    \ Firefox 中可能运行完美，但在 Windows 上的 Internet Explorer 中可能完全失效。因此，测试和调试基于浏览器的内容对开发者来说可能是一场噩梦。\n\
    \nAdobe 希望确保开发者已经熟悉 Adobe AIR 中使用的 HTML 引擎，这样他们就无需学习新引擎的所有特性和错误。由于 Safari（基于 WebKit\
    \ 构建）是 Mac OS X 的默认浏览器（也可在 Windows 上使用），开发者应该熟悉针对 WebKit 进行开发。\n\n### 对 AIR 运行时大小影响最小\n\
    \nAdobe AIR 的目标大小在 5 到 9 MB 之间。WebKit 代码库编写精良、组织有序，对最终的 AIR 运行时大小影响最小。\n\n###\
    \ 已证明的移动设备运行能力\n\n虽然 Adobe AIR 的首个版本仅在个人计算机上运行，但其长期愿景是将 Adobe AIR 从桌面扩展到手机和其他设备。WebKit\
    \ 已被证明能够在这些设备上运行，并且已被诺基亚和苹果移植到手机上。\n\n## AIR 中的 JavaScript\n\nAdobe AIR 对 HTML\
    \ 内容中的 JavaScript 提供了完全支持。支持对应于 ECMA-262 的 JavaScript 1.5。\n\nJavaScript 引擎通过\
    \ WebKit 实现，其工作方式与在基于 WebKit 的浏览器中相同。除了可以访问 HTML DOM，JavaScript 还可以直接通过 `window.runtime`\
    \ 属性访问 AIR 和 Flash Player 的 API。稍后将对此进行更详细的讨论。\n\n> **提示**\n> 如需深入了解和探讨 JavaScript，请参阅\
    \ O'Reilly 出版的《JavaScript权威指南（第5版）》：http://www.oreilly.com/catalog/jscript5/\n\
    \n## AIR 的功能实现\n\nHTML 和 JavaScript 的功能与其他基于 WebKit 的项目和浏览器（例如苹果的 Safari 浏览器）一致。在查阅关于\
    \ HTML 引擎/浏览器功能的文档时，可以将 Safari 浏览器作为 AIR 中 HTML 环境可用功能的参考。\n\n然而，由于 HTML 引擎运行在运行时而非浏览器中，在开始使用\
    \ Adobe AIR 中的 HTML 和 JavaScript 进行开发之前，了解一些差异会很有帮助。\n\n### Cookie\n\nAdobe 集成运行时完全支持从基于\
    \ HTML 的内容中设置和获取 Cookie。Cookie 支持通过操作系统的网络栈实现。这意味着 AIR 应用程序可以共享由任何同样利用操作系统栈的浏览器或应用程序设置的\
    \ Cookie。\n\n例如，AIR 应用程序可以共享通过 Windows 上的 Internet Explorer 和 Mac 上的 Safari 设置的\
    \ Cookie，因为它们都使用操作系统的 Cookie 存储功能。Firefox 实现了自己的 Cookie 存储，因此在 Firefox 中设置的 Cookie\
    \ 无法与 AIR 应用程序共享。\n\n> **提示**\n> 除了 Cookie，AIR 应用程序还有许多其他可用于持久化数据的 API，包括文件 API\
    \ 以及嵌入式数据库 API。\n\n### 窗口\n\n#### 窗口\n\n你可以像在浏览器中一样，通过 JavaScript 创建新窗口。\n\n```javascript\n\
    myWindow = window.open(\"Window.html\", \"myWindow\", \"height=400,width=400\"\
    );\n```\n\n但是，提供对 AIR 和 Flash Player API 访问权限的 `runtime` 属性在新窗口中并非自动可用。为了使其可用，你必须像这样显式地将其放置在新窗口的作用域内：\n\
    \n```javascript\nwindow.runtime = window.opener.runtime;\n```\n\n> **提示**\n> Beta\
    \ 版本中尚不完全支持原生窗口。仅实现了从 JavaScript 可用的 API。\n\n#### 对话框\n\nAIR 应用程序也支持 HTML 对话框，但\
    \ Beta 版本中并未全部实现。\n\n| 对话框 | Beta 版中是否支持 |\n|---|---|\n| alert | 是 |\n| confirm\
    \ | 是 |\n| prompt | 否 |\n\n此外，通过以下方式创建的文件浏览对话框：\n\n```html\n<input type=\"file\"\
    \ />\n```\n\n在 Beta 版本中目前不受支持。\n\nBeta 版本中目前不支持的任何对话框，都将在 1.0 版本中得到支持。\n\n###\
    \ XMLHttpRequest 和 Ajax\n\n`XMLHttpRequest` 对象支持在 AIR 应用程序中使用 Ajax 技术发送和加载数据，得到了完全支持。\n\
    \n在 Adobe AIR 中开发 Ajax 应用程序相对于在浏览器中开发的一个优势是，由于你有一个跨操作系统一致的目标运行时，你不必担心 API 实现中的跨浏览器、跨平台不一致问题。\n\
    \n主要好处是，你只需编写一个版本的代码。\n\n以下是 AIR 应用程序中 XMLHttpRequest 对象调用的简单示例，无论应用程序运行在哪个操作系统上都能正常工作：\n\
    \n```html\n<script type=\"text/javascript\">\n    var xmlhttp;\n    function appLoad()\n\
    \    {\n        //替换为要加载的资源的 URL\n        var url = \"http://www.mikechambers.com/blog/\"\
    ;\n        xmlhttp = new XMLHttpRequest();\n        xmlhttp.open(\"GET\", url,\
    \ true);\n\n        xmlhttp.onreadystatechange=function(){\n            if (xmlhttp.readyState==4)\n\
    \            {\n                runtime.trace(xmlhttp.responseText);\n       \
    \     }\n        }\n        xmlhttp.send(null);\n    }\n</script>\n```\n\n调用时，此函数使用\
    \ XMLHttpRequest 对象加载指定的 URL 并将其内容打印到命令行。此示例中需要注意的主要一点是，由于运行时是已知的且跨操作系统一致，你不必像在浏览器中部署时那样检测\
    \ XMLHttpRequest 的存在或实现差异。\n\n同步和异步 XMLHttpRequest 调用都受支持，跨域加载数据也受支持。\n\n### URI\
    \ 方案\n\n在 AIR 应用程序的 HTML 内容中处理通用资源标识符（URI）与在浏览器中处理 URI 大致相同。本节简要概述了在 AIR 应用程序的\
    \ HTML 内容中处理 URI 的方法，并介绍了一些由运行时提供的新 URI。\n\n#### 支持的 URI 方案\n\nAdobe AIR 支持浏览器中最常见的\
    \ URI 方案（表 3-1）。\n\n**表 3-1. 支持的 URI 方案**\n\n| URI 方案 | 描述 |\n|---|---|\n| http://\
    \ | 指向通过标准 HTTP 协议访问的资源的 URI。在 Adobe AIR 中完全支持。 |\n| https:// | 指向通过 SSL/TLS 加密协议访问的资源的\
    \ URI。在 Adobe AIR 中完全支持。 |\n| file:// | 指向本地或网络文件系统上资源的 URI。 |\n| ftp:// | 指向通过\
    \ FTP 协议访问的资源的 URI。在 Adobe AIR Beta 中，对文件的请求将正常工作，而对目录的请求将返回一个没有目录列表的空页面。 |\n\n\
    #### 不支持的 URI 方案\n\n在 Adobe AIR 的 Beta 构建版本中，常用的 `mailto://` 和 `feed://` URI 方案不可用。\n\
    \n在撰写本书时，尚未确定这些 URI 方案是否以及如何在 1.0 版本中提供。\n\n#### AIR URI 方案\n\nAdobe AIR 提供了多个额外的\
    \ URI，便于引用用户系统中特定区域的文件和内容（表 3-2）。\n\n**表 3-2. Adobe AIR URI 方案**\n\n| URI | 描述\
    \ |\n|---|---|\n| app-resource:/ | 提供对应用程序根内容目录的引用。在引用 AIR 文件中包含的内容时应使用此 URI。\
    \ |\n| app-storage:/ | 提供对用户系统上特定于应用程序的存储区域的引用。此区域可用于存储特定于用户的应用程序设置和内容。 |\n\n\
    以下是 `app-resource` AIR URI 的简单示例：\n\n```\napp-resource:/foo/test.html\n```\n\n\
    这引用了安装在应用程序中的 `foo` 目录下名为 `test.html` 的文件。\n"
