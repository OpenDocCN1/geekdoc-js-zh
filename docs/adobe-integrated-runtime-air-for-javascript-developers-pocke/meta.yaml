- img_proc: true
  md: '# # Preface


    This book provides a quick introduction to developing applications for the public
    Beta 1 build of the Adobe Integrated Runtime (AIR). AIR, which prior to the Beta
    was referred to by its code name, Apollo, is a new cross-platform desktop application
    runtime being developed by Adobe. While Adobe AIR allows both Flash- and HTML-based
    application development, this book focuses on building AIR applications using
    HTML and JavaScript.


    The book gives an overview of Adobe AIR, shows how to set up your development
    environment, and discusses new AIR functionality and APIs. Once you have finished
    reading this book, you should have a good understanding of what AIR is as well
    as how to build HTML and JavaScript applications for it.


    # ## AIR Runtime Naming Conventions


    Adobe AIR allows developers to leverage a number of web technologies to deploy
    web applications to the desktop. Indeed, there are so many technologies, that
    it can be difficult to keep track of them all. Table P-1 lists the terms used
    in the book, and defines each one:'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Table P-1. AIR runtime naming conventions


    | Name | Meaning |

    | --- | --- |

    | Adobe Integrated Runtime (AIR) | The cross-platform desktop runtime that enables
    the running of AIR applications. |

    | AIR Application | An application built with Flash, HTML and/or PDF that runs
    on top of Adobe AIR. |

    | Flash | Any content contained within a SWF 9 file format that runs in the Flash
    Player or AIR. |

    | ActionScript | The ECMAScript-based programming language used to program Flash
    content. Unless otherwise noted, all references to ActionScript in this book refer
    to ActionScript 3. |

    | HTML | Standard web-based markup language used to create and layout web pages.
    |

    | JavaScript | Web-based implementation of ECMAScript used to program content
    within HTML applications. |

    | PDF | Short for Portable Document Format, a technology that allows for seamless
    distribution and display of electronic documents. |

    | Flex Framework | An XML and ActionScript-based Framework designed to make developing
    Flash-based rich Internet applications easy. |

    | Flex Builder | An Eclipse-based IDE used to build Flash-based rich Internet
    applications using Flex and ActionScript. |


    # What This Book Covers


    This book gives a general overview of Adobe AIR, shows how to set up your development
    environment to start building applications, provides an overview of the HTML and
    JavaScript engines within AIR, and shows how to perform a number of common programming
    tasks within AIR.


    As a general rule, features and functionality already in the Beta build are relatively
    stable and should not change radically (although they may be tweaked based on
    developer feedback). Any details discussed around unimplemented features and functionality
    are much more tentative and may change in future builds.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'It is also important to note that the Beta 1 build of AIR is not feature complete,
    and a number of significant AIR features have not been implemented and/or included
    in the build.


    The following is a partial list of features and functionality included in the
    Adobe AIR Beta 1:


    +   - Mac support (OS X 10.4.8 and above; Intel and PPC)

    - Windows support (Windows XP and Windows Vista Home Ultimate Edition)

    - File I/O API

    - SQLite embedded database

    - All functionality within Flash Player 9, including complete network stack

    - Windowing APIs

    - Command-line tools (ADL and ADT)

    - HTML within Flash content

    - Top-level HTML applications

    - ActionScript/JavaScript script bridging

    - Flex Builder and Flex Framework support for authoring AIR application

    - Application command-line arguments

    - Drag and drop support

    - Rich Clipboard access

    - Native Menu API (Mac-only in Beta)

    - Service Connectivity API

    - File type association

    - Application icons

    - PDF support'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Here is partial list of features planned for Adobe AIR 1.0,

    which are not included in Beta 1:


    +   * Right-click and contextual menu control

    * System notifications

    * Flash content within HTML applications

    * Support for additional versions of Microsoft Windows


    We will highlight any features that we know may change in

    future builds.


    # What Beta Means


    As discussed in the previous section, the Adobe AIR Beta 1

    build is not feature complete, and some of the features are

    only partially implemented. Thus, the implementation of

    specific features or availability of any particular feature is

    subject to change between the Beta build and 1.0 release.


    This also applies to the information within this book. The

    book was written at the same time that the Beta 1 build was

    being finalized and thus it is possible that some of the APIs

    or features may have changed between the time the book was

    completed and the time that the Beta build was finalized.

    This is particularly the case with API names. If something

    isn''t working as the book suggests it should, make sure to

    check the online documentation, which will always have the

    latest information on the Beta 1 APIs.


    You can find the latest information and documentation on

    AIR at:


    ```

    http://www.adobe.com/go/air

    ```'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Audience for This Book


    We hope this book is for you, but just to be sure, let''s discuss some of the
    assumptions that we made, as well as what type of developers the book targets.


    # What Does This Book Assume?


    The book assumes that the reader has at least a basic familiarity with creating
    HTML based web applications and content using HTML and JavaScript.


    You should be familiar with web technologies such as HTML, JavaScript, Ajax, and
    CSS, as well as general web development concepts.


    # Who This Book Is For


    This book is for developers interested in leveraging HTML and JavaScript to build
    and deploy applications to the desktop via the Adobe AIR. If you don''t have any
    experience with developing with HTML and JavaScript, then we suggest that you
    spend some time getting up to speed on these technologies.


    # Who This Book Is Not For


    While it is possible to create Flash and Flex-based applications with Beta 1 of
    AIR, this book does not go into any detail on Flash and Flex-focused AIR application
    development. If you are a Flash or Flex developer interested in building AIR applications,
    then this book can provide a good introduction and overview of AIR and its functionality,
    but you should view the AIR documentation and articles available from the AIR
    web site for a more Flash/Flex-focused discussion. You may also want to check
    out the *Adobe Apollo for Flex Developers Pocket Guide*, published by O''Reilly,
    which gives a Flex-focused overview of AIR.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# How This Book Is Organized


    This book contains the following chapters and appendixes:


    Chapter 1, *Introduction to the Adobe Integrated Runtime (AIR)*

    Provides a general overview of what AIR is, and the types of applications it targets.


    Chapter 2, *Getting Started with AIR Development*

    Covers tips on starting your AIR development, and the steps for creating your
    first AIR application.


    Chapter 3, *Working with JavaScript and HTML Within AIR*

    Gives an overview of the HTML and JavaScript runtime environments within AIR,
    and provides an introduction to using JavaScript to access AIR functionality and
    APIs.


    Chapter 4, *AIR Mini-Cookbook*

    Provides tips and tricks for accomplishing common tasks within AIR applications,
    presented in the O''Reilly Cookbook format.


    Appendix A, *AIR Command-Line Tools*

    Lists AIR-specific command-line tools and their usage options.


    Appendix B, *AIR JavaScript Aliases*

    Lists JavaScript Aliases to Adobe AIR APIs


    # How to Use This Book


    You can use this book both as an introduction to and overview of Adobe AIR, as
    well as a step-by-step guide to getting started with AIR application development.
    While it may be tempting to jump ahead to specific sections, it is strongly suggested
    that you at least read the first two chapters, which provide an overview of AIR,
    and discuss how to set up your development environment for building AIR applications.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'This will make it much easier to then jump into the specific areas of AIR functionality
    that interest you.


    Once you have read through the book and understand the basics of how to build
    an AIR application with HTML and JavaScript, then you can use the book as a reference,
    referring to specific sections when you need to know how to tackle a specific
    problem. In particular, the Cookbook sections should prove useful as you develop
    AIR applications.


    Finally, this book is just an introduction to AIR and does not cover all of the
    features and functionality included within it. It is meant to complement, but
    not replace, the extensive and in-depth documentation on AIR provided by Adobe.
    Make sure to explore the AIR documentation in order to make sure you’re familiar
    with all of the APIs and functionality not covered in this book.


    # Conventions Used in This Book


    The following typographical conventions are used in this book:


    **Plain text**

    Indicates menu titles, menu options, menu buttons, and keyboard accelerators (such
    as Alt and Ctrl).


    *Italic*

    Indicates new terms, URLs, email addresses, filenames, file extensions, pathnames,
    directories, and Unix utilities.


    `Constant width`

    Indicates commands, options, switches, variables, attributes, keys, functions,
