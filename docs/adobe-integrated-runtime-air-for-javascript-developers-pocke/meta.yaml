    \ a statement:\\n\" + event.error.message);\n}\n\nfunction doUnload() {\n    db.close();\n\
    }\n</script>\n</head>\n<body onload=\"doLoad()\" onunload=\"doUnload()\">\n</body>\n\
    </html>\n\n## Command-Line Arguments\n\n### Capturing Command-Line Arguments\n\
    \n**Problem**\n\nYou need to capture command-line arguments sent to your application—either\
    \ at application startup, or while the application is running.\n\n**Solution**\n\
    \nRegister for the InvokeEvent, and capture command line arguments passed into\
    \ your application.\n\n**Discussion**\n\nWhenever an application is started, or\
    \ an application is called from the command line while it is running, an InvokeEvent\
    \ will be broadcast. The event handler for this is passed information about the\
    \ event, including any arguments passed to the application on the command line.\n\
    \nYou should register for the InvokeEvent during your application’s initialization\
    \ phase, in order to ensure that the event is captured when the application is\
    \ initially launched.\n\nYou can register for the event from the shell singleton\
    \ like so:\n\n```\nfunction init()\n{\n    air.Shell.shell.addEventListener(air.InvokeEvent.INVOKE,\n\
    \                                     onInvoke);\n}\n```\n\nThis registers the\
    \ onInvoke function as a handler for the InvokeEvent. The handler is passed an\
    \ instance of the InvokeEvent object, which contains a property named arguments\
    \ which is an Array of Strings of any arguments passed to the application:\n\n\
    ```\nfunction onInvoke(event)\n{\n    air.trace(\"onInvoke : \" + event.arguments);\n\
    }\n```\n\nWhen testing your application via ADL, you can pass in command line\
    \ arguments by using the -- argument. For example:\n\n```\nadl InvokeExample.xml\
    \ -- foo \"bim bam\"\n```\n\nThis would pass in two arguments to the application\
    \ “foo” and “bim bam.”\n\nThe complete example follows; it listens for the InvokeEvent,\
    \ and prints out to the included textarea html control, as well as the command\
    \ line via air.trace():\n\n```\n<html>\n<head>\n\n    <script src=\"AIRAliases.js\"\
    \ />\n    <script type=\"text/javascript\">\n\n        function onInvoke(event)\n\
    \        {\n            air.trace(\"onInvoke : \" + event.arguments);\n      \
    \      var field = document.getElementById(\"outputField\");\n            field.value\
    \ += \"Invoke : \" + event.arguments + \"\\n\";\n        }\n\n        function\
    \ init()\n        {\n            air.Shell.shell.addEventListener(air.InvokeEvent.INVOKE,\
    \ onInvoke);\n        }\n\n    </script>\n\n</head>\n\n<body onload=\"init()\"\
    >\n    <textarea rows=\"8\" cols=\"40\" id=\"outputfield\">\n    </textarea>\n\
    </body>\n</html>\n```\n\n## Networking\n\n### Communicating on a Socket\n\n**Problem**\n\
    \nYou would like to communicate with a server using a protocol that is not directly\
    \ supported by Adobe AIR (for example, communicate with an FTP server).\n\n**Solution**\n\
    \nUse the Socket class in the AIR API to send binary or text data to the server\
    \ and register for events that will alert you to incoming data from the server.\n\
    \n**Discussion**\n\nWhen communicating using protocols other than those directly\
    \ supported by Adobe AIR, you may need to use the Socket API. The Socket API is\
    \ an asynchronous API that lets you send data to a persistent socket endpoint\
    \ and receive data from it in real time. You do not need to create a new Socket\
    \ instance for each set of data sent to the same endpoint. The connection can\
    \ be kept alive for the entire conversation between your client and the service\
    \ to which you're connecting. This is the typical flow when using the Socket API:\n\
    \n1. Create a connection to the endpoint\n2. Listen for notification of connection\
    \ success or failure\n3. Queue data that will be sent to the endpoint\n4. Send\
    \ the data to the endpoint\n5. Listen for data incoming from the endpoint\n6.\
    \ Repeat steps 3 through 5\n7. Close the connection\n\nThe first step is to create\
    \ a connection to the socket endpoint that consists of a host and a port number.\
    \ For example, to connect to an endpoint the host might be 'foo.com' and the port\
    \ number might be 5555. Create the instance of the Socket class and connect to\
    \ the endpoint using that information. At this time, we will also set up our listeners\
    \ to listen for the different events that the Socket can dispatch:\n\n```\nvar\
    \ socket = new air.Socket();\nsocket.addEventListener( air.Event.CONNECT, onSocketOpen\
    \ );\nsocket.addEventListener( air.ProgressEvent.SOCKET_DATA, onSocketData );\n\
    socket.connect( 'foo.com', 5555 );\n```\n\nWe will also need to create the functions\
    \ to handle the events we subscribed for. The first event is the air.Event.CONNECT\
    \ event. This event will tell us when the socket has been initiated and communication\
    \ with the service behind the endpoint is possible. In this example, we are sending\
    \ the bytes of a UTF-8 encoded string to the service:\n\n```\nfunction onSocketOpen(\
    \ event )\n{\n    // This queues up the binary representation of the\n    // string\
    \ 'Bob' in UTF-8 format to be sent to the\n    // endpoint.\n    socket.writeUTFBytes(\
    \ \"Bob\" );\n\n    // Send the actual bytes to the server and clear\n    // the\
    \ stream. We then wait for data to be sent\n    // back to us.\n    socket.flush();\n\
    }\n```\n\nThe air.ProgressEvent.SOCKET_DATA event is dispatched whenever data\
    \ is received. The service we are connecting to uses a simple protocol: we send\
    \ a UTF-8 encoded string and it returns a UTF-8 encoded string. This makes accessing\
    \ the data sent back to us very simple. To access this data, we measure the total\
    \ bytes of data available on the Socket and read that many bytes as a UTF-8 encoded\
    \ string using the read.readUTFBytes( ) method of the Socket class.\n\n```\nfunction\
    \ onSocketData( event )\n{\n    var data =\n        socket.readUTFBytes( socket.bytesAvailable\
    \ );\n    air.trace( data ); // Hello Bob\n}\n```\n\nIn our example, the protocol\
    \ of communication was just a single string. In some cases, depending on the service\
    \ with which you're communicating, you may need to send and receive other data\
    \ types. The Socket class provides methods for reading and writing many data types,\
    \ such as ints, Booleans, floats, etc. For example, if we were talking with a\
    \ fictional service that required us to send a Boolean followed by an int, our\
    \ onSocketOpen function in the above example could look like this:\n\n```\nfunction\
    \ onSocketOpen( event )\n{\n    // First send the boolean\n    socket.writeBoolean(\
    \ true );\n    // Now send an int\n    socket.writeInt( 10 );\n    // Now we send\
    \ the bytes to the service and\n    // clear the buffer.\n    socket.flush();\n\
    }\n```\n\nThis example provides a baseline of functionality that can be expanded\
    \ upon to speak to many different protocols. The only current limitation is that\
    \ there is not currently an SSL Socket implementation in AIR. For secure communication\
    \ you will be limited to HTTPS:\n\n```\n<html>\n<head>\n<title>Communicating on\
    \ a Socket</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\
    \n<script>\nvar socket = null;\n\nfunction init()\n{\n    socket = new air.Socket();\n\
    \n    // Create our listeners which tell us when the Socket\n    // is open and\
    \ when we receive data from our service.\n    socket.addEventListener( air.Event.CONNECT,\
    \ onSocketOpen );\n    socket.addEventListener( air.ProgressEvent.SOCKET_DATA,\n\
    \                              onSocketData );\n\n    // Connect to our service,\
    \ which is located at host foo.com\n    // using port 5555.\n    socket.connect(\
    \ 'foo.com', 5555 );\n}\n\nfunction onSocketOpen( event )\n{\n    // This queues\
    \ up the binary representation of the\n    // string 'Bob' in UTF-8 format to\
    \ be sent to the\n    // endpoint.\n    socket.writeUTFBytes( \"Bob\" );\n\n \
    \   // Send the actual bytes to the server and clear\n    // the stream. We then\
    \ wait for data to be sent\n    // back to us.\n    socket.flush();\n}\n\nfunction\
    \ onSocketData( event )\n{\n    var data = socket.readUTFBytes( socket.bytesAvailable\
    \ );\n    air.trace( data ); // Hello Bob\n}\n</script>\n\n</head>\n<body onload=\"\
    init()\">\n</body>\n</html>\n```\n\n132 | Chapter 4: AIR Mini-Cookbook\n\n###\
    \ Uploading a File in the Background\n\n**Problem**\n\nThe application user has\
    \ created numerous files offline, and you now want to send those to the server\
    \ without blocking the user from doing any additional work.\n\n**Solution**\n\n\
    The File class in Adobe AIR provides an upload() method that is designed specifically\
    \ for this purpose, without having to create and manage HTML forms.\n\n**Discussion**\n\
    \nThe File.upload() method can upload files via HTTP/S to a server for additional\
    \ processing. The upload takes places just like a traditional multipart file upload\
    \ from an HTML form, but without the need to manipulate forms on the client. The\
    \ upload process also takes place asynchronously in the background, allowing the\
    \ application to continue processing without interruption."
  mdcn: "\nfunction doStmtError(event) {\n    alert(\"执行语句时出现问题：\\n\" + event.error.message);\n\
    }\n\nfunction doUnload() {\n    db.close();\n}\n</script>\n</head>\n<body onload=\"\
    doLoad()\" onunload=\"doUnload()\">\n</body>\n</html>\n\n## 命令行参数\n\n### 捕获命令行参数\n\
    \n**问题**\n\n你需要捕获发送到应用程序的命令行参数——无论是在应用程序启动时，还是在应用程序运行期间。\n\n**解决方案**\n\n注册 `InvokeEvent`\
    \ 事件，并捕获传递到应用程序的命令行参数。\n\n**讨论**\n\n每当应用程序启动时，或者在应用程序运行期间从命令行调用该应用程序时，都会广播一个 `InvokeEvent`。该事件的事件处理函数会接收到有关事件的信息，包括通过命令行传递给应用程序的任何参数。\n\
    \n你应该在应用程序初始化阶段注册 `InvokeEvent`，以确保在应用程序最初启动时能够捕获该事件。\n\n你可以像这样从 shell 单例中注册该事件：\n\
    \n```\nfunction init()\n{\n    air.Shell.shell.addEventListener(air.InvokeEvent.INVOKE,\n\
    \                                     onInvoke);\n}\n```\n\n这会将 `onInvoke` 函数注册为\
    \ `InvokeEvent` 的处理函数。该处理函数会接收到一个 `InvokeEvent` 对象实例，该实例包含一个名为 `arguments` 的属性，它是一个字符串数组，包含传递给应用程序的所有参数：\n\
    \n```\nfunction onInvoke(event)\n{\n    air.trace(\"onInvoke : \" + event.arguments);\n\
    }\n```\n\n通过 ADL 测试应用程序时，你可以使用 `--` 参数来传递命令行参数。例如：\n\n```\nadl InvokeExample.xml\
    \ -- foo \"bim bam\"\n```\n\n这将向应用程序传递两个参数 \"foo\" 和 \"bim bam\"。\n\n完整示例如下；它监听\
    \ `InvokeEvent` 事件，并将结果输出到包含的 textarea HTML 控件以及通过 `air.trace()` 输出到命令行：\n\n```\n\
    <html>\n<head>\n\n    <script src=\"AIRAliases.js\" />\n    <script type=\"text/javascript\"\
    >\n\n        function onInvoke(event)\n        {\n            air.trace(\"onInvoke\
    \ : \" + event.arguments);\n            var field = document.getElementById(\"\
    outputField\");\n            field.value += \"Invoke : \" + event.arguments +\
    \ \"\\n\";\n        }\n\n        function init()\n        {\n            air.Shell.shell.addEventListener(air.InvokeEvent.INVOKE,\
    \ onInvoke);\n        }\n\n    </script>\n\n</head>\n\n<body onload=\"init()\"\
    >\n    <textarea rows=\"8\" cols=\"40\" id=\"outputfield\">\n    </textarea>\n\
    </body>\n</html>\n```\n\n## 网络\n\n### 在套接字上通信\n\n**问题**\n\n你希望使用 Adobe AIR 未直接支持的协议（例如，与\
    \ FTP 服务器通信）与服务器进行通信。\n\n**解决方案**\n\n使用 AIR API 中的 `Socket` 类向服务器发送二进制或文本数据，并注册事件以在收到服务器数据时得到通知。\n\
    \n**讨论**\n\n当使用 Adobe AIR 未直接支持的协议进行通信时，你可能需要使用 Socket API。Socket API 是一个异步 API，允许你向一个持久套接字端点发送数据，并实时接收来自该端点的数据。你不需要为发送到同一端点的每组数据创建一个新的\
    \ `Socket` 实例。在整个对话过程中，连接可以保持活动状态。使用 Socket API 的典型流程如下：\n\n1.  创建到端点的连接\n2. \
    \ 监听连接成功或失败的通知\n3.  将要发送到端点的数据加入队列\n4.  将数据发送到端点\n5.  监听从端点传入的数据\n6.  重复步骤 3 到\
    \ 5\n7.  关闭连接\n\n第一步是创建到包含主机和端口号的套接字端点的连接。例如，要连接到一个端点，主机可能是 'foo.com'，端口号可能是 5555。创建\
    \ `Socket` 类的实例并使用该信息连接到端点。此时，我们还需要设置监听器来监听 `Socket` 可能派发的不同事件：\n\n```\nvar socket\
    \ = new air.Socket();\nsocket.addEventListener( air.Event.CONNECT, onSocketOpen\
    \ );\nsocket.addEventListener( air.ProgressEvent.SOCKET_DATA, onSocketData );\n\
    socket.connect( 'foo.com', 5555 );\n```\n\n我们还需要创建处理订阅事件的函数。第一个事件是 `air.Event.CONNECT`\
    \ 事件。该事件将告诉我们套接字何时已启动，以及何时可以与端点背后的服务进行通信。在本例中，我们向服务发送 UTF-8 编码字符串的字节：\n\n```\n\
    function onSocketOpen( event )\n{\n    // 这会将 UTF-8 格式的字符串 'Bob' 的\n    // 二进制表示形式排队等待发送到端点。\n\
    \    socket.writeUTFBytes( \"Bob\" );\n\n    // 将实际的字节发送到服务器并清空\n    // 流。然后我们等待数据发回给我们。\n\
    \    socket.flush();\n}\n```\n\n当收到数据时，会派发 `air.ProgressEvent.SOCKET_DATA` 事件。我们连接的服务使用一个简单的协议：我们发送一个\
    \ UTF-8 编码的字符串，它返回一个 UTF-8 编码的字符串。这使得访问发回给我们的数据非常简单。要访问此数据，我们测量 `Socket` 上可用数据的总字节数，并使用\
    \ `Socket` 类的 `read.readUTFBytes()` 方法将这些字节作为 UTF-8 编码字符串读取。\n\n```\nfunction\
    \ onSocketData( event )\n{\n    var data =\n        socket.readUTFBytes( socket.bytesAvailable\
    \ );\n    air.trace( data ); // Hello Bob\n}\n```\n\n在我们的示例中，通信协议只是一个简单的字符串。在某些情况下，根据你通信的服务，你可能需要发送和接收其他数据类型。`Socket`\
    \ 类提供了读取和写入多种数据类型的方法，例如整数、布尔值、浮点数等。例如，如果我们与一个需要我们发送一个布尔值后跟一个整数的虚构服务通信，我们上面示例中的\
    \ `onSocketOpen` 函数可以像这样：\n\n```\nfunction onSocketOpen( event )\n{\n    // 首先发送布尔值\n\
    \    socket.writeBoolean( true );\n    // 现在发送一个整数\n    socket.writeInt( 10 );\n\
    \    // 现在我们将字节发送到服务并\n    // 清空缓冲区。\n    socket.flush();\n}\n```\n\n此示例提供了功能基线，可以在此基础上扩展以与许多不同的协议通信。目前唯一的限制是\
    \ AIR 中没有 SSL Socket 实现。对于安全通信，你将只能使用 HTTPS：\n\n```\n<html>\n<head>\n<title>在套接字上通信</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\n<script>\n\
    var socket = null;\n\nfunction init()\n{\n    socket = new air.Socket();\n\n \
    \   // 创建监听器，它们会告诉我们套接字\n    // 何时打开以及何时从我们的服务接收到数据。\n    socket.addEventListener(\
    \ air.Event.CONNECT, onSocketOpen );\n    socket.addEventListener( air.ProgressEvent.SOCKET_DATA,\n\
    \                              onSocketData );\n\n    // 连接到我们的服务，该服务位于主机 foo.com\n\
    \    // 使用端口 5555。\n    socket.connect( 'foo.com', 5555 );\n}\n\nfunction onSocketOpen(\
    \ event )\n{\n    // 这会将 UTF-8 格式的字符串 'Bob' 的\n    // 二进制表示形式排队等待发送到端点。\n    socket.writeUTFBytes(\
    \ \"Bob\" );\n\n    // 将实际的字节发送到服务器并清空\n    // 流。然后我们等待数据发回给我们。\n    socket.flush();\n\
    }\n\nfunction onSocketData( event )\n{\n    var data = socket.readUTFBytes( socket.bytesAvailable\
    \ );\n    air.trace( data ); // Hello Bob\n}\n</script>\n\n</head>\n<body onload=\"\
    init()\">\n</body>\n</html>\n```\n\n132 | 第 4 章：AIR 迷你食谱\n\n### 在后台上传文件\n\n**问题**\n\
    \n应用程序用户已离线创建了大量文件，现在你希望将这些文件发送到服务器，同时不阻塞用户进行任何其他工作。\n\n**解决方案**\n\nAdobe AIR\
    \ 中的 `File` 类提供了一个专门为此目的设计的 `upload()` 方法，无需创建和管理 HTML 表单。\n\n**讨论**\n\n`File.upload()`\
    \ 方法可以通过 HTTP/S 将文件上传到服务器进行进一步处理。上传过程就像传统的 HTML 表单多部分文件上传一样，但无需在客户端操作表单。上传过程也在后台异步进行，允许应用程序在不中断的情况下继续处理。\n"
