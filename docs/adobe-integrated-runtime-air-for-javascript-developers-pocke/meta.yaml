    \ and read that many bytes as a UTF-8 encoded string using the read.readUTFBytes(\
    \ ) method of the Socket class.\n\n```\nfunction onSocketData( event )\n{\n  \
    \  var data =\n        socket.readUTFBytes( socket.bytesAvailable );\n    air.trace(\
    \ data ); // Hello Bob\n}\n```\n\nIn our example, the protocol of communication\
    \ was just a single string. In some cases, depending on the service with which\
    \ you're communicating, you may need to send and receive other data types. The\
    \ Socket class provides methods for reading and writing many data types, such\
    \ as ints, Booleans, floats, etc. For example, if we were talking with a fictional\
    \ service that required us to send a Boolean followed by an int, our onSocketOpen\
    \ function in the above example could look like this:\n\n```\nfunction onSocketOpen(\
    \ event )\n{\n    // First send the boolean\n    socket.writeBoolean( true );\n\
    \    // Now send an int\n    socket.writeInt( 10 );\n```"
