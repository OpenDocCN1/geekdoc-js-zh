    # Adobe® Integrated Runtime (AIR) for JavaScript Developers Pocket Guide


    Written by members of the Adobe Integrated Runtime (AIR) product team, this is
    the official guide to the beta release of Adobe''s new cross-platform desktop
    runtime, previously known by its code name Apollo.


    This book explains how you can use AIR to build and deploy HTML and JavaScript-based
    web applications to the desktop, using all of the tools and technologies with
    which you are already familiar. This book provides everything you need to understand
    AIR, and to get started developing applications for the desktop right away.


    Topics include:


    - What AIR is, and the problems this runtime aims to solve

    - How to set up your development environment

    - How to create your first app using HTML and JavaScript

    - The HTML and JavaScript environments within AIR

    - How to do common tasks, presented in the easy-to-use O''Reilly Cookbook format


    This book also includes a guide to AIR packages, classes and command line tools.
    Once you understand the basics of building an HTML- and JavaScript-based AIR applications,
    this pocket guide makes an ideal reference for tackling specific problems. Welcome
    to the revolution!


    Mike Chambers, senior product manager for developer relations for AIR, has spent
    the last 8 years building applications that target the Flash runtime. Daniel Dura
    and Kevin Hoyt are both Platform Evangelists at Adobe focusing on AIR and Flash.


    US $14.99

    CAN $19.99

    ISBN-10: 0-596-51519-7

    ISBN-13: 978-0-596-51519-5


    www.oreilly.com

