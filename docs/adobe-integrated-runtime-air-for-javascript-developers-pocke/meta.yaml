    </body>\n</html>\n```\n\n## Drag and Drop\n\n### Using Drag and Drop from HTML\n\
    \n**Problem**\n\nYou want to allow users to drag files, images, text, and other\
    \ data types into and out of HTML-based AIR applications.\n\n**Solution**\n\n\
    By using Adobe AIR's Drag and Drop implementation in JavaScript, developers can\
    \ react to drag and drop operations that occur on HTML DOM objects.\n\n### TIP\n\
    \nAdobe AIR's support for drag and drop is based on the WebKit implementation.\
    \ You can find more information on this at: http://developer.apple.com/documentation/AppleApplications/Conceptual/SafariJSProgTopics/Tasks/DragAndDrop.html.\n\
    \n### Discussion\n\nOne of the benefits of developing for the desktop is providing\
    \ users with a more integrated experience when interacting with multiple applications.\
    \ One of the most frequently used user gestures is to drag and drop files, data,\
    \ and other elements between applications and the desktop and between the applications\
    \ themselves.\n\nThis example will demonstrate how you can accept text being dragged\
    \ into your application and also support dragging text out. It will also show\
    \ you how to modify the drag effect in order to demonstrate for the user what\
    \ type of drag operations he can perform with the element he is dragging.\n\n\
    There are two flows that are important to consider when using drag and drop operations\
    \ in HTML. First we will examine the flow for HTML elements that want to allow\
    \ themselves to be dragged by users:\n\n1.  Element specifies that it is available\
    \ for drag operations.\n2.  User selects the item and starts dragging it.\n3.\
    \  Element receives an ondragstart event and sets the data which will be transferred\
    \ and also specifies which drag operations are supported.\n4.  Element receives\
    \ ondrag events while the element is being dragged.\n5.  User drops the item being\
    \ dragged and the initiating element receives an ondragend event.\n\nThe typical\
    \ flow for HTML elements that want to receive drop operations are as follows:\n\
    \n1.  User drags an item over the element listening for drop events.\n2.  Element\
    \ receives an ondragenter event and specifies which drop operations are available.\n\
    3.  Element receives ondragover operations continuously as the item is dragged\
    \ over the element.\n4.  The user drops the item and the receiving element receives\
    \ an ondrop event.\n5.  If the user moves the dragged item outside the boundaries\
    \ of the listening element, it will receive an ondragleave event.\n\nUsers can,\
    \ by default, drag text elements and URLs. To disable this functionality, use\
    \ the -khtml-user-drag:none style. To override the default data type that is being\
    \ specified, use the -khtml-user-drag:element style and specify listeners for\
    \ the drag events as specified previously.\n\nTo manipulate the data that is being\
    \ transferred between applications, use the dataTransfer object that is attached\
    \ to the event dispatched during drag operations. The dataTransfer object has\
    \ two methods, getData and setData. The setData method takes two parameters, the\
    \ MIME type and the string of data that conforms to that type. The setData method\
    \ can be called multiple times and allows you to store multiple data types. For\
    \ example, if you wanted to specify a \"text/plain\" type and a \"text/uri-list\"\
    \ type, you would do the following:\n\n```\nfunction dropStartListener( event\
    \ )\n{\n    event.dataTransfer.setData( \"text/plain\", \"Adobe\" );\n    event.dataTransfer.setData(\
    \ \"text/uri-list\",\n                                 \"http://www.adobe.com\"\
    \ );\n}\n```\n\nIf setData is called for a MIME type that already exists on the\
    \ element being dragged, that data will be overwritten. Retrieving data from an\
    \ element that is being dragged can occur only within an ondrop event handler.\
    \ The getData method takes a MIME type as its only parameter and returns the value\
    \ of the MIME type if it exists on the element being dragged. For example:\n\n\
    ```\nfunction dropListener( event )\n{\n    alert( event.dataTransfer.getData(\
    \ \"text/plain\" ) );\n// Adobe\n}\n```\n\nWhen a user is dragging an item from\
    \ one application to another, or from one location in your application to another,\
    \ you may want to indicate to the user which operations (copy, link, or move)\
    \ are available. By using the effectAllowed and dropEffect properties of the dataTransfer\
    \ object you can specify which operations are allowed. The system then uses the\
    \ application to determine what actions a user can perform during the drag operation.\
    \ The list of available values for these properties can be determined by reading\
    \ the documentation referenced above.\n\nWhen starting a drag, the effectAllowed\
    \ property tells the system what operations the source element supports. The dropEffect\
    \ property specifies the operation that the current target receiving the drag\
    \ event supports. The system then uses the information about what effects both\
    \ the source and destination target support and displays that to the user.\n\n\
    ### TIP\n\nThe current AIR Beta on Adobe Labs has a few limitations. First, specifying\
    \ custom drag images and snapshots is not supported. Also, only two MIME types\
    \ are available for transfer: text/plain, and text/uri-list. Last, the types array\
    \ on the dataTransfer is not accessible on the dataTransfer object. Support for\
    \ these features will be added for AIR Version 1.0."
  mdcn: "\n一旦在 `open` 方法中指定了这些参数，我们就会调用 `send` 方法。`send` 方法接受一个参数，该参数包含随请求一起发送的内容。在我们的示例中，我们不会随请求发送任何数据：\n\
    \n```\nvar xml = new XMLHttpRequest();\nxml.open( \"GET\", \"http://www.foo.com/data.xml\"\
    , true );\nxml.send( null );\n```\n\n由于我们是异步加载数据，因此需要为响应创建一个处理程序，该处理程序会在服务器数据加载完成后被调用。这个处理程序需要在调用\
    \ `send` 方法之前添加。在此处理程序中，我们将 `XMLHttpRequest` 实例的 `responseText` 属性中的数据保存到本地文件系统上的已知位置，以便后续请求时检索。关于在本地系统上读写文本的内容，本书其他地方有介绍，因此这里不详细说明：\n\
    \n```\nxml.onreadystatechange = function()\n{\n    if( xml.readyState == 4 ) //\
    \ 请求已完成\n    {\n        // 将数据写入本地系统\n        var file =\n            air.File.applicationStorageDirectory.resolve(\"\
    data.xml\");\n        var fileStream = new air.FileStream();\n        fileStream.open(\
    \ file, air.FileMode.WRITE );\n        fileStream.writeMultiByte( xml.responseText\
    \ ,\n                                  air.File.systemCharset );\n        fileStream.close();\n\
    \    }\n}\n```\n\n在每次请求数据之前，我们需要检查 `data.xml` 文件是否存在。如果存在，我们就不需要使用 `XMLHttpRequest`\
    \ 对象来加载文件，而是可以使用 File API 从磁盘加载它。这允许我们即使在用户当前不在线的情况下也能加载数据：\n\n```\nvar data =\
    \ null;\nvar file = air.File.applicationStorageDirectory.\n    resolve(\"data.xml\"\
    );\n```\n\n```\nif( file.exists )\n{\n    var fileStream = new air.FileStream();\n\
    \    fileStream.open( file, air.FileMode.READ );\n    data =\n    fileStream.readMultiByte(\
    \ fileStream.bytesAvailable,\n                            air.File.systemCharset\
    \ );\n    fileStream.close();\n}\nelse\n{\n    // 通过 XMLHttpRequest 读取数据并将其\n\
    \    // 写入文件系统\n}\n```\n\n以下是完整示例：\n\n```\n<html>\n<head>\n    <title>为离线使用缓存资源</title>\n\
    \    <script src=\"AIRAliases.js\"></script>\n    <script>\n\n        var file\
    \ =\n        air.File.applicationStorageDirectory.resolve(\"data.xml\");\n\n \
    \       function onLoad()\n        {\n            if( file.exists )\n        \
    \    {\n                var fileStream = new air.FileStream();\n             \
    \   fileStream.open( file, air.FileMode.READ );\n                document.getElementById(\
    \ \"dataText\" ).value =\n                    fileStream.readMultiByte(\n    \
    \                    fileStream.bytesAvailable,\n                        air.File.systemCharset\
    \ );\n                fileStream.close();\n            }\n            else\n \
    \           {\n                var xml = new XMLHttpRequest();\n             \
    \   xml.open( \"GET\",\n                         \"http://www.foo.com/data.xml\"\
    , true );\n\n                xml.onreadystatechange = function()\n           \
    \     {\n                    if( xml.readyState == 4 ) // 请求已完成\n            \
    \        {\n                        var file = air.File.applicationStorageDirectory.resolve(\"\
    data.xml\");\n                        var fileStream = new air.FileStream();\n\
    \                        fileStream.open( file, air.FileMode.WRITE );\n      \
    \                  fileStream.writeMultiByte( xml.responseText , air.File.systemCharset\
    \ );\n                        fileStream.close();\n                        document.getElementById(\
    \ \"dataText\" ).value = xml.responseText;\n                    }\n          \
    \      }\n\n                xml.send( null );\n            }\n        }\n    </script>\n\
    </head>\n<body onLoad=\"onLoad()\">\n    <textarea id=\"dataText\"></textarea>\n\
    </body>\n</html>\n```\n\n## 拖放\n\n### 在 HTML 中使用拖放\n\n**问题**\n\n您希望允许用户将文件、图像、文本和其他数据类型拖入和拖出基于\
    \ HTML 的 AIR 应用程序。\n\n**解决方案**\n\n通过在 JavaScript 中使用 Adobe AIR 的拖放实现，开发人员可以响应发生在\
    \ HTML DOM 对象上的拖放操作。\n\n### 提示\n\nAdobe AIR 对拖放的支持基于 WebKit 的实现。您可以在以下网址找到更多信息：http://developer.apple.com/documentation/AppleApplications/Conceptual/SafariJSProgTopics/Tasks/DragAndDrop.html。\n\
    \n### 讨论\n\n为桌面端开发的好处之一是为用户提供与多个应用程序交互时更集成的体验。最常用的手势之一是在应用程序与桌面之间以及应用程序之间拖放文件、数据和其他元素。\n\
    \n本示例将演示如何接受拖入应用程序的文本，并支持将文本拖出。它还将向您展示如何修改拖放效果，以向用户展示他可以对正在拖动的元素执行何种类型的拖放操作。\n\
    \n在 HTML 中使用拖放操作时，需要考虑两个重要的流程。首先，我们将研究希望允许被用户拖动的 HTML 元素的流程：\n\n1.  元素指定它可用于拖放操作。\n\
    2.  用户选择该项目并开始拖动它。\n3.  元素收到 `ondragstart` 事件，并设置将要传输的数据，同时指定支持哪些拖放操作。\n4.  在元素被拖动时，元素会持续收到\
    \ `ondrag` 事件。\n5.  用户放下正在拖动的项目，发起拖动的元素会收到 `ondragend` 事件。\n\n希望接收拖放操作的 HTML 元素的典型流程如下：\n\
    \n1.  用户将项目拖动到监听拖放事件的元素上方。\n2.  元素收到 `ondragenter` 事件，并指定哪些拖放操作是可用的。\n3.  当项目被拖动到元素上方时，元素会持续收到\
    \ `ondragover` 事件。\n4.  用户放下项目，接收元素会收到 `ondrop` 事件。\n5.  如果用户将拖动的项目移出监听元素的边界，它会收到\
    \ `ondragleave` 事件。\n\n默认情况下，用户可以拖动文本元素和 URL。要禁用此功能，请使用 `-khtml-user-drag:none`\
    \ 样式。要覆盖默认指定的数据类型，请使用 `-khtml-user-drag:element` 样式，并按前述方式为拖动事件指定监听器。\n\n要操作应用程序之间传输的数据，请使用附加在拖放操作期间分发的事件上的\
    \ `dataTransfer` 对象。`dataTransfer` 对象有两个方法：`getData` 和 `setData`。`setData` 方法接受两个参数：MIME\
    \ 类型和符合该类型的数据字符串。`setData` 方法可以多次调用，允许您存储多种数据类型。例如，如果您想指定一个 `\"text/plain\"` 类型和一个\
    \ `\"text/uri-list\"` 类型，您可以这样做：\n\n```\nfunction dropStartListener( event )\n\
    {\n    event.dataTransfer.setData( \"text/plain\", \"Adobe\" );\n    event.dataTransfer.setData(\
    \ \"text/uri-list\",\n                                 \"http://www.adobe.com\"\
    \ );\n}\n```\n\n如果对正在拖动的元素上已存在的 MIME 类型调用 `setData`，该数据将被覆盖。从正在拖动的元素中检索数据只能在 `ondrop`\
    \ 事件处理程序中进行。`getData` 方法接受一个 MIME 类型作为其唯一参数，并返回该 MIME 类型在正在拖动的元素上的值（如果存在）。例如：\n\
    \n```\nfunction dropListener( event )\n{\n    alert( event.dataTransfer.getData(\
    \ \"text/plain\" ) );\n// Adobe\n}\n```\n\n当用户将项目从一个应用程序拖到另一个应用程序，或从应用程序中的一个位置拖到另一个位置时，您可能希望向用户指示哪些操作（复制、链接或移动）是可用的。通过使用\
    \ `dataTransfer` 对象的 `effectAllowed` 和 `dropEffect` 属性，您可以指定允许哪些操作。系统随后会使用应用程序来确定用户在拖放操作期间可以执行哪些操作。这些属性的可用值列表可以通过阅读上述参考文档来确定。\n\
    \n开始拖动时，`effectAllowed` 属性告诉系统源元素支持哪些操作。`dropEffect` 属性指定接收拖放事件的当前目标支持的操作。系统随后会根据源元素和目标元素都支持的效果信息向用户显示。\n\
    \n### 提示\n\nAdobe Labs 上当前的 AIR Beta 版有一些限制。首先，不支持指定自定义拖动图像和快照。其次，只有两种 MIME 类型可用于传输：`text/plain`\
    \ 和 `text/uri-list`。最后，`dataTransfer` 上的 `types` 数组在 `dataTransfer` 对象上不可访问。这些功能的支持将在\
    \ AIR 1.0 版本中添加。\n"
