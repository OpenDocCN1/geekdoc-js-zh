  - '[PAGE 91]


    A native window initially has no content outside of the runtime. Unlike the JavaScript
    window.open() method, an application cannot simply specify a URL for the content
    to be displayed. The window is so raw that an application must first add an HTMLControl
    to the window, size it, and tell it what content to load. The HTMLControl constructor
    takes no arguments, exposes properties for width and height, and exposes an HTMLControl.load()
    method which can be used to load external content:


    ```

    var control = new window.runtime.flash.html.HTMLControl();

    var page = air.File.applicationResourceDirectory.resolve( "login.html" );


    control.width = login.stage.stageWidth;

    control.height = login.stage.stageHeight;

    control.load( new air.URLRequest( page.url ) );

    ```


    The NativeWindow.stage property represents a Stage object and is used to determine
    the viewable area for sizing the HTMLControl. Using NativeWindow.width or NativeWindow.height
    for the HTMLControl sizing would have resulted in an HTMLControl as large as the
    window itself (including chrome). Stage.stageWidth and Stage.stageHeight will
    size the control to fit the viewable area.


    The Stage is also where controls will get added for display (called the display
    list), and is responsible for how the content inside of it will be positioned
    and sized. For most applications this means setting Stage.scaleMode to StageScaleMode.NO_SCALE
    and Stage.align to StageAlign.TOP_LEFT. Calling Stage.addChild() will add the
    HTMLControl to the viewable area. Using this approach, it is possible to have
    multiple HTMLControl controls in one single window:


    ```

    win.stage.scaleMode = window.runtime.flash.display.StageScaleMode.NO_SCALE;

    win.stage.align = window.runtime.flash.display.StageAlign.TOP_LEFT;

    win.stage.addChild( control );

    ```'
