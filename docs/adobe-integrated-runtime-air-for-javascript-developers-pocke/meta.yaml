  md: 'Adobe AIR provides a function to make it possible to send information from
    the application to standard out at runtime.


    # runtime.trace


    As we touched on earlier in the chapter, Adobe AIR provides a mechanism for sending
    Strings from JavaScript to the command line.


    The trace function on the runtime property takes a string, which will then be
    output to ADL’s standard out. Here is an example of its usage:


    ```

    runtime.trace("This will be sent to standard out");

    ```


    This can be useful for tracking information about the state of the application
    without having to interrupt the execution of the program.


    Any non-String objects passed to trace will have their toString() function called.
    The JavaScript Object object provides a default toString() implementation, although
    some classes (such as Array) implement more context-sensitive toString() functions.


    Here is an example of tracing an Array that contains various data types:


    ```

    var a = ["a", 1, {foo:"bar"}];

    runtime.trace(a);

    ```


    This will result in the following output on the command line from ADL:


    ```

    a,1,[object Object]

    ```


    Of course, you can implement your own toString() method on your custom JavaScript
    classes, or override toString() functions on existing classes in order to provide
    more class-specific output.'
