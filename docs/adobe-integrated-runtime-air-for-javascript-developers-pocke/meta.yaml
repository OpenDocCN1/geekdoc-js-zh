- md: "## Embedded Database\n\nAdobe AIR includes an embedded SQLite database which\
    \ can be leveraged by AIR applications. SQLite is a compact open source database\
    \ that supports ACID transactions, requires zero-configuration, implements most\
    \ of SQL92, and supports strings and BLOBs up to 2GB in size. All database information\
    \ is stored in a single file on disk, and can be freely shared between machines,\
    \ even if they have different byte orders.\n\n> **TIP**: You can find more information\
    \ about SQLite on the project web site at: http://www.sqlite.org.\n\nCurrently,\
    \ when working with a local database from AIR, all transactions are asynchronous.\
    \ This configuration allows the user interface to continue to respond while the\
    \ database is processing in the background. To monitor database activity, an application\
    \ must create and register for the events in which it is interested.\n\n## Connecting\
    \ to a Database\n\n### Problem\n\nYou need to connect to a local database prior\
    \ to working with the schema or altering data.\n\n### Solution\n\nCreating and\
    \ connecting to a database can be accomplished using the single `SqlConnection.open()`\
    \ method.\n\n### Discussion\n\nSQLite stores all database information in a single\
    \ file on disk. This means that before an application can access a database, it\
    \ must first have a reference to the file. A single application might choose to\
    \ access any number of database files. Databases are managed through the `SQLConnection`\
    \ datatype in the AIR API.\n\nObtaining a reference to the database file can be\
    \ done through the `File.resolve()` method, which takes a single argument: the\
    \ name of the file that will be referenced. Files that do not yet exist can have\
    \ a reference, and the `File.exists` property returns a Boolean to determine that\
    \ file’s presence on disk:\n\n```javascript\nvar db = new air.SQLConnection();\n\
    var file =\n  air.File.applicationStorageDirectory.resolve( \"mycrm.db\" );\n\
    ```\n\nDatabase transactions happen asynchronously, which means an application\
    \ must first create and register a handler for the events in which it is interested.\
    \ In the case of establishing a connection to a database, the SQLEvent.OPEN event\
    \ will be monitored. Among various other properties, the SQLEvent.type property\
    \ can be used to determine the status of the database.\n\n```javascript\ndb.addEventListener(\
    \ air.SQLEvent.OPEN, doDbOpen );\n\nfunction doDbOpen( event )\n{\n    alert(\
    \ \"Connected\" );\n}\n```\n\nCalling the SQLConnection.open() method can take\
    \ a number of different arguments. The most common arguments are the file reference\
    \ to the database, and a Boolean value indicating whether the database should\
    \ be created if it does not already exist. This simultaneously creates the database\
    \ if it does not exist, and then establishes a connection to the database:\n\n\
    ```javascript\ndb.open( file, true );\n```\n\nWhile the database will close automatically\
    \ when the application exists, developers should consider calling SQLConnection.close()\
    \ during the onload event. The SQLConnection.close() method takes no arguments.\
    \ Taking the time to manually close the database at the termination of the application\
    \ helps ensure that data is not accidentally corrupted, and helps to maintain\
    \ best practices:\n\n```html\n<html>\n<head>\n\n<title>Connecting to a Database</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\">\n</script>\n\n<script>\n\
    var db = new air.SQLConnection();\n\nfunction doDbOpen( event )\n{\n    alert(\
    \ \"You are now connected to the database.\" );\n}\n\nfunction doLoad()\n{\n \
    \   var file =\n    air.File.applicationResourceDirectory.resolve( \"crm.db\"\
    \ );\n\n    db.addEventListener( air.SQLEvent.OPEN, doDbOpen );\n    db.open(\
    \ file, true );\n}\n\nfunction doUnload()\n{\n    db.close();\n}\n</script>\n\n\
    </head>\n<body onload=\"doLoad();\" onunload=\"doUnload()\">\n\n</body>\n</html>\n\
    ```\n\n## Creating Database Tables\n\n### Problem\n\nAn application has a specific\
    \ schema it needs to provide for data storage.\n\n### Solution\n\nDatabase schema\
    \ can be created using the SQLStatement class using SQL92.\n\n### Discussion\n\
    \nOnce a database file has been created and a connection to the database has been\
    \ established, the next likely step will be to create any required schema. This\
    \ can be accomplished using SQL92 in conjunction with the SQLStatement class.\
    \ The SQLStatement class executes commands against a specified database.\n\nAs\
    \ database transactions all happen asynchronously, the best place to check for\
    \ any required schema—or to create it—is in the handler for the SQLEvent.OPEN\
    \ event. At this point, the application can be assured a connection against which\
    \ statements can be executed. Along the same lines, event handlers must also be\
    \ registered on the SQLStatement instance:\n\n```javascript\nvar stmt = new air.SQLStatement();\n\
    \nstmt.addEventListener( air.SQLErrorEvent.ERROR,\n    doStmtError );\nstmt.addEventListener(\
    \ air.SQLEvent.RESULT, doStmtResult );\n```\n\nWhen applied to a SQLStatement\
    \ object, the SQLErrorEvent.ERROR event is called when there has been an error\
    \ while executing a SQLStatement.next() or SQLStatement.execute() method. Conversely,\
    \ the SQLEvent.RESULT event is called when results are returned from the database.\
    \ This usually indicates a successful execution:\n\n```javascript\nfunction doStmtError(\
    \ event )\n{\n    alert( \"There has been a problem executing the statement\"\
    \ );\n}\n\nfunction doStmtResult( event )\n{\n    alert( \"The database table\
    \ has been created.\" );\n}\n```\n\nIn order to execute a SQL statement, a SQLConnection\
    \ instance against which to execute must be established. A SQLConnection instance\
    \ can be assigned to the SQLStatement.sqlConnection property. The SQLStatement.text\
    \ property is then assigned any SQL that needs to be executed. Finally, the SQLStatement.execute()\
    \ method is called:\n\n```javascript\nstmt.sqlConnection = db;\nstmt.text = \"\
    CREATE TABLE IF NOT EXISTS contact ( \" +\n    \"id INTEGER PRIMARY KEY AUTOINCREMENT,\
    \ \" +\n    \"first TEXT, \" +\n    \"last TEXT )\";\nstmt.execute();\n```\n\n\
    In this case, a CREATE TABLE statement has been applied to the database. Additional\
    \ types of SQL statements, such as SELECT, INSERT, UPDATE, and DELETE are executed\
    \ in the same manner. The SQLStatement.execute() method can take two optional\
    \ arguments: the number of rows to prefetch, and a responder object to handle\
    \ events.\n\nThe prefetch option defaults to -1, which indicates that all rows\
    \ should be returned. The responder object can be a custom object designed to\
    \ handle any status or result events that take place during execution. The default\
    \ responder is null in this case, as event handlers have been registered with\
    \ the SQLStatement object directly:\n\n```html\n<html>\n<head>\n\n<title>Creating\
    \ Database Tables</title>\n<script type=\"text/javascript\" src=\"AIRAliases.js\"\
    ></script>\n\n<script>\nvar db = null;\nvar stmt = null\n\nfunction doDbOpen(\
    \ event )\n{\n    stmt = new air.SQLStatement();\n    stmt.addEventListener( air.SQLErrorEvent.ERROR,\
    \ doStmtError );\n    stmt.addEventListener( air.SQLEvent.RESULT, doStmtResult\
    \ );\n\n    stmt.sqlConnection = db;\n    stmt.text = \"CREATE TABLE IF NOT EXISTS\
    \ contact ( \" +\n                \"id INTEGER PRIMARY KEY AUTOINCREMENT, \" +\n\
    \                \"first TEXT, \" +\n                \"last TEXT )\";\n\n    stmt.execute();\n\
    }\n```"
  mdcn: "\n## 嵌入式数据库\n\nAdobe AIR 包含一个嵌入式 SQLite 数据库，可供 AIR 应用程序利用。SQLite 是一个紧凑的开源数据库，支持\
    \ ACID 事务，需要零配置，实现了大部分 SQL92 标准，并支持最大 2GB 的字符串和 BLOB 数据。所有数据库信息都存储在磁盘上的一个单一文件中，并且可以在不同字节序的机器之间自由共享。\n\
    \n> **提示**：你可以在项目网站上找到更多关于 SQLite 的信息，网址为：http://www.sqlite.org。\n\n目前，当从 AIR\
    \ 使用本地数据库时，所有事务都是异步执行的。这种配置允许用户界面在后台处理数据库时继续响应。要监控数据库活动，应用程序必须创建并注册其感兴趣的事件。\n\n\
    ## 连接到数据库\n\n### 问题\n\n在处理模式或修改数据之前，你需要连接到本地数据库。\n\n### 解决方案\n\n可以使用单一的 `SqlConnection.open()`\
    \ 方法来创建和连接数据库。\n\n### 讨论\n\nSQLite 将所有数据库信息存储在磁盘上的一个单一文件中。这意味着在应用程序访问数据库之前，它必须首先拥有该文件的引用。单个应用程序可以选择访问任意数量的数据库文件。数据库通过\
    \ AIR API 中的 `SQLConnection` 数据类型进行管理。\n\n可以通过 `File.resolve()` 方法获取数据库文件的引用，该方法接受一个参数：将被引用的文件名。尚不存在的文件也可以拥有引用，并且\
    \ `File.exists` 属性返回一个布尔值来确定该文件是否存在于磁盘上：\n\n```javascript\nvar db = new air.SQLConnection();\n\
    var file =\n  air.File.applicationStorageDirectory.resolve( \"mycrm.db\" );\n\
    ```\n\n数据库事务是异步发生的，这意味着应用程序必须首先为其感兴趣的事件创建并注册一个处理程序。在建立与数据库连接的情况下，将监控 SQLEvent.OPEN\
    \ 事件。在各种其他属性中，SQLEvent.type 属性可用于确定数据库的状态。\n\n```javascript\ndb.addEventListener(\
    \ air.SQLEvent.OPEN, doDbOpen );\n\nfunction doDbOpen( event )\n{\n    alert(\
    \ \"Connected\" );\n}\n```\n\n调用 SQLConnection.open() 方法可以接受多个不同的参数。最常见的参数是数据库的文件引用，以及一个布尔值，指示如果数据库尚不存在是否应该创建它。这会在数据库不存在时同时创建数据库，然后建立与数据库的连接：\n\
    \n```javascript\ndb.open( file, true );\n```\n\n虽然数据库会在应用程序退出时自动关闭，但开发者应考虑在 onload\
    \ 事件期间调用 SQLConnection.close()。SQLConnection.close() 方法不接受参数。在应用程序终止时花时间手动关闭数据库有助于确保数据不会意外损坏，并有助于保持最佳实践：\n\
    \n```html\n<html>\n<head>\n\n<title>连接到数据库</title>\n<script type=\"text/javascript\"\
    \ src=\"AIRAliases.js\">\n</script>\n\n<script>\nvar db = new air.SQLConnection();\n\
    \nfunction doDbOpen( event )\n{\n    alert( \"您现在已连接到数据库。\" );\n}\n\nfunction\
    \ doLoad()\n{\n    var file =\n    air.File.applicationResourceDirectory.resolve(\
    \ \"crm.db\" );\n\n    db.addEventListener( air.SQLEvent.OPEN, doDbOpen );\n \
    \   db.open( file, true );\n}\n\nfunction doUnload()\n{\n    db.close();\n}\n\
    </script>\n\n</head>\n<body onload=\"doLoad();\" onunload=\"doUnload()\">\n\n\
    </body>\n</html>\n```\n\n## 创建数据库表\n\n### 问题\n\n应用程序有一个需要为数据存储提供的特定模式。\n\n###\
    \ 解决方案\n\n可以使用 SQLStatement 类和 SQL92 来创建数据库模式。\n\n### 讨论\n\n一旦创建了数据库文件并建立了与数据库的连接，下一个可能的步骤将是创建任何所需的模式。这可以使用\
    \ SQL92 结合 SQLStatement 类来完成。SQLStatement 类针对指定数据库执行命令。\n\n由于所有数据库事务都是异步发生的，因此检查或创建任何所需模式的最佳位置是在\
    \ SQLEvent.OPEN 事件的处理程序中。此时，应用程序可以确保存在可以执行语句的连接。同样，事件处理程序也必须在 SQLStatement 实例上注册：\n\
    \n```javascript\nvar stmt = new air.SQLStatement();\n\nstmt.addEventListener(\
    \ air.SQLErrorEvent.ERROR,\n    doStmtError );\nstmt.addEventListener( air.SQLEvent.RESULT,\
    \ doStmtResult );\n```\n\n当应用于 SQLStatement 对象时，SQLErrorEvent.ERROR 事件在执行 SQLStatement.next()\
    \ 或 SQLStatement.execute() 方法发生错误时被调用。相反，SQLEvent.RESULT 事件在从数据库返回结果时被调用。这通常表示执行成功：\n\
    \n```javascript\nfunction doStmtError( event )\n{\n    alert( \"执行语句时出现问题\" );\n\
    }\n\nfunction doStmtResult( event )\n{\n    alert( \"数据库表已创建。\" );\n}\n```\n\n\
    为了执行 SQL 语句，必须建立一个要执行的 SQLConnection 实例。SQLConnection 实例可以分配给 SQLStatement.sqlConnection\
    \ 属性。然后将 SQLStatement.text 属性分配给需要执行的任何 SQL。最后，调用 SQLStatement.execute() 方法：\n\
    \n```javascript\nstmt.sqlConnection = db;\nstmt.text = \"CREATE TABLE IF NOT EXISTS\
    \ contact ( \" +\n    \"id INTEGER PRIMARY KEY AUTOINCREMENT, \" +\n    \"first\
    \ TEXT, \" +\n    \"last TEXT )\";\nstmt.execute();\n```\n\n在这个例子中，一个 CREATE TABLE\
    \ 语句已应用于数据库。其他类型的 SQL 语句，如 SELECT、INSERT、UPDATE 和 DELETE，也以相同的方式执行。SQLStatement.execute()\
    \ 方法可以接受两个可选参数：要预取的行数，以及一个用于处理事件的响应者对象。\n\n预取选项默认为 -1，表示应返回所有行。响应者对象可以是一个自定义对象，旨在处理执行期间发生的任何状态或结果事件。在这种情况下，默认响应者为\
    \ null，因为事件处理程序已直接在 SQLStatement 对象上注册：\n\n```html\n<html>\n<head>\n\n<title>创建数据库表</title>\n\
    <script type=\"text/javascript\" src=\"AIRAliases.js\"></script>\n\n<script>\n\
    var db = null;\nvar stmt = null\n\nfunction doDbOpen( event )\n{\n    stmt = new\
    \ air.SQLStatement();\n    stmt.addEventListener( air.SQLErrorEvent.ERROR, doStmtError\
    \ );\n    stmt.addEventListener( air.SQLEvent.RESULT, doStmtResult );\n\n    stmt.sqlConnection\
    \ = db;\n    stmt.text = \"CREATE TABLE IF NOT EXISTS contact ( \" +\n       \
    \         \"id INTEGER PRIMARY KEY AUTOINCREMENT, \" +\n                \"first\
    \ TEXT, \" +\n                \"last TEXT )\";\n\n    stmt.execute();\n}\n```\n"
