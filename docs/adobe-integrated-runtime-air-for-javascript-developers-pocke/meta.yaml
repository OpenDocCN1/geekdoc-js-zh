    # 第 1 章


    ## Adobe 集成运行时 (AIR) 简介


    Adobe 集成运行时 (AIR) 是 Adobe 开发的一个跨平台桌面运行时，它允许 Web 开发人员使用 Web 技术构建和部署富 Internet 应用程序和
    Web 应用程序到桌面。


    > **提示**

    >

    > 在公开测试版发布之前，Adobe 集成运行时 (AIR) 在公开场合以其代号 Apollo 被提及。


    为了更好地理解 Adobe AIR 的功能以及它试图解决的问题，首先了解一下 Web 应用程序（相对较短的）历史是有用的。


    ## Web 应用程序简史


    在过去的几年里，应用程序从桌面迁移到 Web 浏览器的趋势正在加速。这受到多种因素的驱动，包括：


    - 互联网作为通信媒介的增长

    - Web 应用程序部署的相对简便性

    - 通过浏览器针对多种操作系统的能力

    - 高级客户端技术的成熟，例如浏览器和 Flash Player 运行时


    1


    早期的 Web 应用程序主要使用 HTML 和 JavaScript 构建，在很大程度上严重依赖于客户端/服务器交互和页面刷新。这种页面刷新模型与浏览器最初设计的基于文档的隐喻一致，但在显示应用程序时提供了相对较差的用户体验。


    然而，随着 Flash Player 运行时的成熟，以及最近浏览器中 Ajax 类型功能的出现，开发人员开始能够摆脱基于页面的应用程序流程。开发人员开始能够通过浏览器提供更丰富的应用程序体验。在
    2002 年 3 月的一份白皮书中，Macromedia 创造了“富 Internet 应用程序”（RIA）一词，来描述浏览器中这些新型应用程序，它们“融合了内容、应用程序逻辑和通信……使互联网更易于使用和更令人愉悦。”这些应用程序提供了更丰富、更类似桌面的体验，同时仍然保留了
    Web 的核心跨平台特性：


    Internet 应用程序关乎覆盖范围。Web 的承诺是内容和应用程序无处不在，无论平台或设备如何。富客户端必须拥抱并支持所有流行的桌面操作系统，以及最广泛的新兴设备平台，例如智能手机、PDA、机顶盒、游戏机和
    Internet 设备。


    ### 提示


    您可以在以下网址找到完整的白皮书和关于 RIA 的更多信息：http://download.macromedia.com/pub/flash/whitepapers/richclient.pdf


    该论文继续列出了一些定义 RIA 的特性：


    - 为执行代码、内容和通信提供高效、高性能的运行时。

    - 将内容、通信和应用程序接口集成到一个通用环境中。

