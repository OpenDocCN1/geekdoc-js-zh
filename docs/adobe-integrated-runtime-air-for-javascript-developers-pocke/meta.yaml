    the Flash runtime. During that time, he has worked with numerous technologies
    including Flash, Generator, .NET, Central, Flex, and Ajax. He is currently the
    senior product manager for developer relations for Adobe AIR. He has written and
    spoken extensively on Flash and rich Internet application development and is coauthor
    of *Adobe Apollo for Flex Developers Pocket Guide*, *Flash Enabled: Flash Design
    and Development for Devices*, and *Generator and Flash Demystified*.


    Mike received his Masters in International Economics and European Studies from
    the John Hopkins School of Advanced International Studies (SAIS) in 1998.


    When he is not programming, Mike can be found playing Halo, trying to recover
    from his World of Warcraft addiction, or hanging out with his two daughters, Isabel
    and Aubrey and wife Cathy.


    Mike maintains a weblog at http://www.mikechambers.com/blog/.


    ## Daniel Dura


    Currently based in San Francisco, California, Daniel Dura is a Platform Evangelist
    at Adobe focusing on Apollo and Flash. Before joining Macromedia (which merged
    with Adobe in 2005), Daniel and his brother Josh founded Dura Media LLC, a rich
    Internet application development company based in Dallas, Texas. While at Adobe,
    he was a member of the Central and Flex teams, as well as a Product Manager for
    Developer Relations.


    Daniel has given presentations on Flash, Apollo, and Flex all over the world at
    user group meetings, conferences, and pretty much anywhere someone is willing
    to listen. Outside of his day job, he enjoys general aviation and is well on his
    way to earning his private pilot license.


    ## Kevin Hoyt


    Kevin Hoyt is a Platform Evangelist with Adobe Systems, Inc. who likes moving,
    breaking, blurring and jumping over the lines of conventional technology. He seeks
    out every opportunity to congregate with other like-minded developers, and explore
    ways to escape any lines that form a box. Pushing the envelope of what technology
    can do, and how people perceive and interact with it, is his passion.


    A frequent traveler, Kevin can generally be found deep in code while speaking
    with customers, at conferences, in front of user groups, or anywhere else they
    will give him time in front of an audience. The rest of the time he enjoys spending
    with his family at home in Parker, CO and indulging his photography habit.


    This current chapter in Kevin''s career started when he accepted a job with Allaire
    Corporation, circa 2000, with focus on ColdFusion and JRun. Allaire was purchased
    by Macromedia, Inc. in 2001, where he was able to unleash the latent designer
    within and help promote the value of rich Internet applications. Adobe acquired
    Macromedia in 2005, and Kevin now finds himself helping the company and its customers
    make sense of the increasingly large stable of products.


    ## Acknowledgments


    The authors would like to thank Mark Nichoson from Adobe and Steve Weiss, Philip
    Dangler, and Michele Filshie from O''Reilly for helping make the book possible
    in an incredibly short amount of time. We would also like to thank Adrian Ludwig,
    Laurel Reitman, Chris Brichford, Lucas Adamski, Rob Dixon and Jeff Swartz, all
    from Adobe, for input and work on the book.


    Thank you to everyone on the AIR team for all of the dedication and hard work
    in getting a 1.0 runtime out the door.


    # CHAPTER 1


    ## Introduction to the Adobe Integrated Runtime (AIR)


    The Adobe Integrated Runtime (AIR) is a cross-platform desktop runtime being developed
    by Adobe that allows web developers to use web technologies to build and deploy
    Rich Internet Applications and web applications to the desktop.


    > **TIP**

    >

    > Prior to the public beta release, the Adobe Integrated Runtime (AIR) was referred
    to in public by its code name of Apollo.


    In order to better understand what Adobe AIR enables, and which problems it tries
    to address, it is useful to first take a look at the (relatively short) history
    of web applications.


    ## A Short History of Web Applications


    Over the past couple of years, there has been an accelerating trend of applications
    moving from the desktop to the web browser. This has been driven by a number of
    factors, which include:


    - Growth of the Internet as a communication medium

    - Relative ease of deployment of web applications

    - Ability to target multiple operating systems via the browser

    - Maturity of higher-level client technologies, such as the browser and the Flash
    Player runtime


    1


    Early web applications were built primarily with HTML and JavaScript, which, for
    the most part, relied heavily on client/ server interactions and page refreshes.
    This page refresh model was consistent with the document-based metaphor for which
    the browser was originally designed, but provided a relatively poor user experience
    when displaying applications.


    With the maturation of the Flash Player runtime, however, and more recently Ajax-type
    functionality in the browser, it became possible for developers to begin breaking
    away from page-based application flows. Developers began to be able to offer richer
    application experiences via the browser. In a whitepaper from March 2002, Macromedia
    coined the term rich Internet application (RIA), to describe these new types of
    applications in browsers, which “blend content, application logic and communications...to
    make the Internet more usable and enjoyable.” These applications provided richer,
    more desktop-like experiences, while still retaining the core cross-platform nature
    of the Web:


    Internet applications are all about reach. The promise of the web is one of content
    and applications anywhere, regardless of the platform or device. Rich clients
    must embrace and support all popular desktop operating systems, as well as the
    broadest range of emerging device platforms such as smart phones, PDAs, set-top
    boxes, game consoles, and Internet appliances.


    ### TIP


    You can find the complete whitepaper and more information on RIAs at: http://download.macromedia.com/pub/flash/whitepapers/richclient.pdf


    The paper goes on to list some features that define RIAs:


    - Provide an efficient, high-performance runtime for executing code, content,
    and communications.

    - Integrate content, communications, and application interfaces into a common
    environment.'
