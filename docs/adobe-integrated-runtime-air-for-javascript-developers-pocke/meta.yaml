    \ the options an application may make use of appear as initialization options.\
    \ Additional options that may be controlled on an instance of NativeWindow itself\
    \ include the window title, whether or not it is always in front, and window sizing\
    \ and positioning.\n\n> TIP\n\nIf you intend to manage the initial window size\
    \ manually, it is best to start with an invisible window. Creating a native window\
    \ and then changing its positioning and layout in the same block of code results\
    \ in a quick flicker of the window as it is initially painted and then relocated\
    \ and resized.\n\nWhen using the NativeWindow class, you have absolute control\
