    # Use the &lt;html:file&gt; Tag


    The &lt;html&gt; tag we''ll take a look at in this module is &lt;html:file&gt;.
    You use this control to upload files to the server; the significant attributes
    of this tag appear in Table 6-20.

    In this module''s project, we''ll upload a file and display its text in the Results
    page. Here''s how you create a file control with a property named file—note that
    to upload files, you set the &lt:form&gt; tag''s method attribute to POST and
    enctype attribute to "multipart/form-data":


    ```

    <html:form action="ch06_02.do" method="POST" enctype="multipart/form-data">


    ```


    ```

    <h2>File Controls:</h2>

    <html:file property="file" />

    ```


    The file''s contents are stored using a Form object named file, so we''ll create
    the file property this way in the form bean:'
  merge: -1
