  md: '# Ask the Expert


    **Q**: Is there any other way to pass data from a web page to Struts?


    **A**: You can, if you prefer, set the page context attribute that holds the data
    a Struts tag will use in a web page''s JSP code. Here''s an example:


    ```

    <% taglib uri="/tags/struts-logic" prefix="logic" %>

    <%@ taglib uri="/tags/struts-html" prefix="html" %>

    <HTML>

    <HEAD>

    <TITLE>Select a Topping</TITLE>

    </HEAD>

    <BODY>

    <h1>Select a Topping</h1>

    %

    String[] toppings = new String[]{"Pepperoni", "Sausage", "Ham", "Olives"};\pageContext.setAttribute("toppings",
    toppings);%

    <logic:iterate id="toppings1" name="toppings">

    Topping: <%= toppings1 %>

    <BR>

    </logic:iterate>

    </body>

    </HTML>

    ```


    If you prefer, you can even use Struts tags like `<logic:notPresent>` with your
    own tags, in this case we''re checking if the **toppings** attribute needs to
    be created before creating ourselves:


    ```

    <@ taglib uri="/tags/struts-logic" prefix="logic" %>

    <%@ taglib prefix="ch08" uri="WEB-INF/ch08_11.tld" %>

    <HTML>

    <HEAD>

    <TITLE>Creating Cooperating Tags</TITLE>

    </HEAD>

    <BODY>

    ```'
