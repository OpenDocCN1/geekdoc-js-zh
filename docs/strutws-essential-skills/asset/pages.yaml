  md: "# Module 5: Using Actions\n\nNow the user module operates in its own space,\
    \ with its own configuration file, structs-config-user.xml. Say that you have\
    \ an action in the default Struts module that you want to delegate to the user\
    \ module. You could set up an action in the default module like this, using the\
    \ org.apache.struts.actions.SwitchAction class:\n\n```\n<action\n  path=\"result\"\
    \n  type=\"org.apache.struts.actions.SwitchAction\" />\n```\n\nThen you could\
    \ set up an action, ch05_13, like this in the default module:\n\n```\n<action\
    \ path=\"ch05_13\"\n  type=\"ch05.ch05_13\"\n  name=\"ch05_03\"\n  input=\"/ch05_01.jsp\"\
    >\n  <forward name=\"success\"\n    path=\"result.do?page=/ch05_14.do&amp;pref=/user\"\
    \ />\n</action>\n```\n\nWhat is the \"result.do?page=/ch05_14.do&amp;pref=/user\"\
    \ all about? When the user navigates to \"ch05_14.do\", the action is forwarded\
    \ to the request action, with the page attribute set to \"user\". This causes\
    \ the request to be switched to ch05_14.do in the user module. To make switching\
    \ operation work work, you have to define the action ch05_14.do in the user module's\
    \ configuration file, struts-user.xml.\n\n# Use Struts 1.2\n\nAll the code in\
    \ this module is up to speed with the early release version of Struts 1.2 as of\
    \ this writing. Of course, if you start validation to your code using ActionError\
    \ and ActionErrors objects, it'll be a different story. In that case, switch to\
    \ ActionMessage and ActionMessages.\n\n# Module 5 Mastery Check\n\n+   1. What's\
    \ the full name of the Struts Action class?\n   A. java.servlet.action.Action\n\
    \   B. java.servlet.struts.action.Action\n   C. org.struts.action.Action\n   D.\
    \ org.apache.struts.action.Action"
