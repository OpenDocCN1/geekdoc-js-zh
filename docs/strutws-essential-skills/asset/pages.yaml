  md: "To put the Struts HTML tags to work, you set up the struts-html tag library\
    \ like this in\nweb.xml:\n\n```\n<taglib>\n  <taglib-uri>/tags/struts-html</taglib-uri>\n\
    \  <taglib-location>/WEB-INF/struts-html.tld</taglib-location>\n</taglib>\n```\n\
    \nYou also add struts-html.tld to your WEB-INF. Because the Java support for this\n\
    custom JSP tag library is in struts.jar, all remains is to use the %%@taglib%>\
    \ directive\nat the beginning of your JSPs:\n\n```\n%@ taglib uri=\"/tags/struts-html\"\
    \ prefix=\"html\">\n```\n\nNow you're free to use the Struts HTML tags like <button>\
    \ to create HTML button\ncontrols. Each of these tags supports attributes, and\
    \ we'll list the significant ones for each\nelement in this module. Some attributes\
    \ are common to all tags that display visible HTML\ncontrols (e.g., <button> but\
    \ not <form>), as the events which you see in\nTable 6-2. For example, assign\
    \ the onclick attribute name of the JavaScript event\nhandler that you want to\
    \ use to handle click events for the control, the onblur attribute to\nhand case\
    \ where the control loses the input focus, and so on.\n\n| Attribute | Description\
    \ |\n| onblur | JavaScript event handler to run when this element loses the focus\
    \ |\n| onchange | JavaScript event handler to run when this element loses the\
    \ focus and its value has been changed |\n| onclick | JavaScript event handler\
    \ to run when this element is clicked |\n| onblblclick | JavaScript event handler\
    \ to run when this element is double-clicked |\n| onfocus | JavaScript event handler\
    \ to run when this element gets the focus |\n| onkeydown | JavaScript event handler\
    \ to run when this element has the focus and a key is pressed |\n| onkeypress\
    \ | JavaScript event handler to run when this element has the focus and a key\
    \ is pressed and then released |\n| onkeyup | JavaScript event handler to run\
    \ when this element has the focus and a key is pressed |\n| onmousedown | JavaScript\
    \ event handler to run when this element is under the mouse and a mouse button\
    \ is pressed |\n| onmousemove | JavaScript event handler to run when this element\
    \ is under the mouse and the pointer is moved |\n| onmouseout | JavaScript event\
    \ handler to run when the painter is moved outside the element |\n| onmouseover\
    \ | JavaScript event handler to run when the painter is moved inside the element\
    \ |\n| onmouseup | JavaScript event handler to run when this element is under\
    \ the mouse pointer and a mouse button is released |\n\nTable 6-2 The Struts <html>\
    \ Tags’ Event Attributes"
  merge: -1
