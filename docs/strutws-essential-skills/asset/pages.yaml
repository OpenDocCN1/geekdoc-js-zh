    ch04_03\"\n  input=\"/ch04_01.jsp\">\n\n<exception key=\"error.BadPassword\"\n\
    \  type=\"app.BadPassword\"\n  path=\"/login.jsp\"\n className=\"ch05.ExceptionHandler\"\
    \ />\n\n<forward name=\"success\" path=\"/ch04_05.jsp\" />\n</action>\n```\n\n\
