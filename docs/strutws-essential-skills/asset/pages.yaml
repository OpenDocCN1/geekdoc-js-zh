    # Use the <logic:forward> and <logic:redirect> Tags


    The <logic:forward> tag lets you forward to an action forward, and the <logic:redirect>
    tag lets you redirect the browser to a new URL. You can see the significant attributes
    for <logic:forward> in Table 7-9 and for <logic:redirect> in Table 7-10. Note
    that for the <logic:redirect> tag, you must specify exactly one of the forward
    attribute, the href or the page attribute.


