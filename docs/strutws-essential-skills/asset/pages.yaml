  md: "# 138 Module 5: Using Actions...\n\nTo complete the execute method in this\
    \ example's ProcessAction class, we'll read the text property of the action form\
    \ sent to you and pass it on to the Success page. Here's what that looks like:\n\
    \n```\npublic class ProcessAction extends Action {\n    public ActionForward execute(ActionMapping\
    \ mapping,\n                               ActionForm form,\n                \
    \               HttpServletRequest request,\n                               HttpServletResponse\
    \ response,\n                               throws java.lang.Exception {\n\n \
    \       String text = null;\n        String target = new String(\"success\");\n\
    \n        if (form != null) {\n            DataForm dataForm = (DataForm)form;\n\
    \            text = dataForm.getText();\n        }\n\n        return (mapping.findForward(target));\n\
    \    }\n}\n```\n\nPassing control to the success forward in the action's execute\
    \ method makes the servlet check the action's mapping to find the success forward\
    \ corresponds to results.jsp. You can access the text property in the dataForm\
    \ and write that text to the Results page, like this:\n\n```\n<@taglib uri=\"\
    /tags/struts-bean\" prefix=\"bean\" %>\n<html>\n<head>\n    <title>A Results page</title>\n\
    </head>\n<body>\n    <h1>Reading User Input</h1>\n    You typed: <bean:write name=\"\
    dataForm\" property=\"text\"/>\n</body>\n</html>\n```\n\nThat's for working with\
    \ a standard action. In this module: ForwardAction, IncludeAction, DispatchAction,\
    \ LookupDispatchAction, and Switch Action. Just as standard actions are based\
    \ on the org.apache.struts.action.Action class, each of these actions is a subclass\
    \ of the Struts Class."
