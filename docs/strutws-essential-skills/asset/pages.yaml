  md: "# index.jsp\n\nWhen you open some Struts applications, you navigate directly\
    \ to a particular page to get things started. That's how we'll write most of the\
    \ applications in this book. However, there's another way of opening a Struts\
    \ application as well, where you don't have to specify a specific document. All\
    \ you have to do is navigate to a subdirectory of the webapps directory.\n\nThat's\
    \ the struts-blank application you. It relies on a default index.jsp page that\
    \ the browser will open automatically and will redirect the browser to a page\
    \ inside the application itself. The index.jsp file does that with a forward named\
    \ welcome we use using Struts `<logic:redirect>` custom tag like this one in this\
    \ book:\n\n```\n<%%@taglib uri=\"/tags/struts-logic\" prefix=\"logic\" %>\n<logic:redirect\
    \ forward=\"welcome\"/>\n```\n\n```\n---\nRedirect default requests to Welcome\
    \ global ActionForward.\nBy using a redirect, the user-agent will change address\
    \ to match the path of our Welcome ActionForward.\n--\n```\n\n# struts-config.xml\n\
    \nYou can set up a forward like this with a <forward> element inside the <global-forwards>\
    \ element in struts-config.xml. In the struts-blank application, this entry means\
    \ that the <logic:redirect> tag in index.jsp is processed by Tomcat, it will be\
    \ expanded into a redirection header to Welcome.do:\n\n```\n<global-forwards>\n\
    <!-- Default forward to \"Welcome\" action -->\n<!-- Demonstrates using index.jsp\
