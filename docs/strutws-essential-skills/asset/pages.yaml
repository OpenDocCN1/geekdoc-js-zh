  md: '# Struts; Essential Skills... 135


    Usually, the form passed to you in the execute method is an object you create
    yourself, so its methods and fields are up to you. On the other hand, the HttpServletRequest
    and HttpServletResponse objects passed to this method are the standard request
    and response objects passed from the browser (handled in servlet code the doGet,
    doPost and/or service methods). That means you can access the data you entered
    into the HTML form with the request object''s getParameter method. In this example,
    you could read the text from the text field you like this:


    String text = request.getParameter("text");


    The request and response objects give you all that you''d normally get from these
    objects in servlet code. For example, you can get access to the current session
    in an action, like this:


    ```

    HttpSession session = request.getSession();

    ```


    If you wanted, you could even recover the current action mapping, which is stored
    in a request attribute named MAPPING_KEY, like this:


    ```

    ActionMapping mapping = (ActionMapping) request.getAttribute(MAPPING_KEY);

    ```


    For that matter, you could even recover the action form from the request object
    because the action form is stored as a request attribute as well, making it easy
    to pass between the components of a Struts application. Action forms are stored
    in attributes of the same name, so here''s how you could recover the action form
    from the request object if you wanted to:


    ```

    ActionForm form = request.getAttribute(mapping.getName());

    ```


