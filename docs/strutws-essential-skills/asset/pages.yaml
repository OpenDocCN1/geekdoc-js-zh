  md: '# Module 4: Working with Models and ActionForms


    This module is about working with models and action forms. Up to this point, the
    projects we''ve developed haven''t used a model to handle any data crunching,
    but we''re going to change that now.


    We''ll also look at working with action forms in this module. We''ve already used
    action forms by actions, but there''s more action forms than we''ve seen so far.
    In this module, we''ll learn how to fill HTML controls with data from an action
    form, even the first time a web page is displayed, meaning we won''t have to create
    our own custom JSP tags to store HTML controls with data, as we did in Module
    3.


    We''ll also see how to use the action form **validate** method to validate data.
    Up to this point, we''ve validated the data they''re sent, using the **validate**
    method. In this way, we''ll be able to move the task of validating data from the
    action to the action form, and since the action''s task is to handle data, that''s
    appropriate.


    Some applications use dozens of properties in action forms, and sometimes developers
    rebel against having to set all property methods in a Java action class. For reason,
    it''s possible not to set up an action form **DynaActionForm** entirely in struts-config.xml—no
    Java code needed—using the Struts DynaActionForm class. We''ll learn how to use
    this class in this module. As long as we just want to set up a simple property
    for each data item in a form and don''t try to do anything complex, the DynaFormComponent
    class can save a great deal of time.


    We''ll see how to work with this class and convert to handle dynamic forms in
    this module as well.


    We''ll begin adding a model to our applications for some behind-the-scenes data
    crunching.


    # 4.1 Work with Models


    As you recall, Struts applications closely mirror the MVC (Model-View-Controller)
    architecture. We''ve discussed the view and the controller aspects of Struts applications
    in some depth; it''s time to add the model. As an example, we''ll use a model
    to do a little data crunching—nothing too involved, just converting a string to
    uppercase.


    We can see our application in Figure 4-1.


    After the user enters text to capitalize and clicks the Convert button, the application
    sends that text to its model, which returns the capitalized text. The resulting
    capitalized text is displayed in the Results page, as shown in Figure 4-2.'
