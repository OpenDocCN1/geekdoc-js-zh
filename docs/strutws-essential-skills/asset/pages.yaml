  md: "# 298 Module 10: The Tiles Framework\n\nCRITICAL SKILL\n\n# 10.3 Use the another\
    \ <definition> Tag\n\nThere’s another way of working with Tiles besides the <tiles:insert>\
    \ element directly—you can use Tiles definitions. Definitions are useful because\
    \ you can use them simply by referring to them by name, as well as extending them\
    \ as we’re going to see.\n\nAs an example, we’ll create a new Tiles page, ch10_03.jsp,\
    \ where we replace the <tiles:insert> element with <tiles:definition>, specifying\
    \ the layout page with the page attribute:\n\n```\n<@ taglib uri=\"WEB-INF/struts-tiles.tld\
    \ prefix=\"tiles\" %>\n\n<tiles:definition id=\"theDefinition page=\"Layout.jsp\"\
    >\n  <tiles:put name=\"title\" value=\"My first page\" />\n  <tiles:put name=\"\
    header\" value=\"header.jsp\" />\n  <tiles:put name=\"footer\" value=\"footer.jsp\"\
    \ />\n  <tiles:put name=\"menu\" value=\"menu.jsp\" />\n  <tiles:put name=\"body\"\
    \ value=\"body.jsp\" />\n</tiles:definition>\n```\n\nWhat we’ve done is to create\
    \ a new Tiles definition named theDefinition. This definition corresponds exactly\
    \ to what we created in our first example, ch10_01.jsp, with the same layout,\
    \ header, footer, and so on.\n\nAfter you created a Tiles definition, you can\
    \ use the beanName attribute of the <tiles:insert> element to put that definition\
    \ to work. Here’s what that looks like in ch10_03.jsp:\n\n```\n<@ taglib uri=\"\
    WEB-INF/struts-tiles.tld prefix=\"tiles\" %>\n\n<tiles:definition id=\"theDefinition\
    \ page=\"Layout.jsp\">\n  <tiles:put name=\"title\" value=\"My first page\" />\n\
    \  <tiles:put name=\"header\" value=\"header.jsp\" />\n  <tiles:put name=\"footer\"\
    \ value=\"footer.jsp\" />\n  <tiles:put name=\"menu\" value=\"menu.jsp\" />\n\
    \  <tiles:put name=\"body\" value=\"body.jsp\" />\n</tiles:definition>\n\n<tiles:insert\
    \ beanName=\"theDefinition flush=\"true\" />\n```\n\nThe Results page looks just\
    \ the same as you see in Figure 10-1—all’s changed is that we’ve used a new definition\
    \ to achieve the same results. You can see the attributes of the <tiles:definition>\
    \ element in Table 10-6."
  merge: -1
