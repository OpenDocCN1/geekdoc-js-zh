- img_proc: true
  md: "private FormFile file;\n\n```\npublic FormFile getFile() {\n    return file;\n\
    }\n```\n\n```\npublic void setFile(FormFile file) {\n    this.file = file;\n}\n\
    ```\n\nTo extract the text of the uploaded file from the **file** object, we'll\
    \ create a helper method **getFileText** in the form bean:\n\n```\npublic String\
    \ getFileText() {\n    ByteArrayOutputStream byteStream = new ByteArrayOutputStream();\n\
    \    InputStream input = file.getInputStream();\n\n    byte[] dataBuffer = new\
    \ byte[4096];\n    int numberBytes = 0;\n    while ((numberBytes = input.read(dataBuffer,\
    \ 0, 4096)) != -1) {\n        byteStream.write(dataBuffer, 0, numberBytes);\n\
    \    }\n    String fileText = new String(byteStream.toByteArray());\n    input.close();\n\
    } catch (IOException e) {\n    return null;\n}\n    return fileText;\n}\n```\n\
    \nWe can display the file's text in the Results page calling this helper method\
    \ way:\n\n```\n<h2>The file's text:</h2>\n<bean:write name=\"ch06_03\" property=\"\
    fileText\"/>\n```\n\nYou can see how it looks out in Figure 6-9, where we're using\
    \ the File control to upload the project's action, ch06_02.java.\n\nThe Results\
    \ pages display the text of ch06_02.jsp, as you see in Figure 6-10."
