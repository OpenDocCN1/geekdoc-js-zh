    # CRITICAL SKILL

    9.4 Handle Bytes


    To demand that the value entered into a field be a valid byte, we can use the
    standard **byte** rule. To make this field required, we can use the **required**
    rule. In our Welcome page, we give the name **byte** to the field that contains
    a byte value:


    ```

    <html:form action="ch09_02">

    <bean:message key="ch09_03.byte.text"/>

    &nbsp;

    &nbsp;

    &nbsp;

    <html:text property="byte" size="15" maxLength="15"/>

    <br>

    <br>

    ```


    To constrain legal values for this field, you create a rule for the **byte** field
    in the **ch09_03** bean with the <field> element, setting the property attribute
    to the name of the property you want to constrain:


    ```

    <form name="ch09_03">

    <field property="byte">

    .

    .

    </field>

    ```'
