  md: "# Ask the Expert\n\n**Q:** Didn't I see in Table 5-1 that the <action> element\
    \ has a forward attribute? Does that do the same thing as using the org.apache.struts.actions.ForwardAction\
    \ class?\n\n**A:** Yes, you can use the forward attribute of the <action> element\
    \ instead of the ForwardAction class to create an action that will forward control\
    \ to a new URL. Here's what that might look like:\n\n```\n<action\n  path=\"ch05.02\"\
    \n  type=\"ch05.05_02\"\n  forward=\"ch05_03\"\n</action>\n```\n\n# ## Progress\
    \ Check\n\n+   1. How do you set up a global forward accessible from any action\
    \ in struts-config.xml?\n2. What Struts class do you use to create a forward action?\n\
    \nBefore leaving the topic of forwarding, it's also worth mentioning that the\
    \ redirect attribute of the <forward> element redirects the browser rather than\
    \ simply forwarding the request to a new URL:\n\n```\n<forward name=\"success\"\
    \ path=\"results.jsp\" redirect=\"true\"/>\n```\n\nSo what's the difference between\
    \ a forward and a redirect? A forward simply forwards the current request object\
    \ from the browser to a new URL, but a redirect creates an entirely new request\
    \ object before transferring to the new URL."
