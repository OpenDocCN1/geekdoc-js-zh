  md: "To use a standard rule or rules, we assign a comma-delimited list of rules\
    \ to the depends\nattribute of the <field> element like this, where we're using\
    \ standard byte and required\nrules:\n\n```\n<form name=\"ch09_03\">\n  <field\
    \ property=\"byte\"\n    depends=\"required,byte\">\n  .\n</field>\n```\n\nIf\
    \ the user entered not a value that can be stored as a byte, the error message\n\
    errors.byte will be displayed; that message looks like this in application.properties:\n\
    \nerrors.byte={0} must be a byte.\n\nTo fill a value for the {0} parameter, we\
    \ use an element <arg0> inside\nthe <field> element. In this case, we'll use the\
    \ label text for the byte field that's displayed\nthe Welcome page. Label text\
    \ is ch09_03.byte.text, as we've defined earlier in this\nmodule in application.properties:\n\
    \nch09_03.byte.text=A byte\n\nHere how we set the {0} parameter to ch09_03.byte.text\
    \ in the rule we're creating using\nthe <arg0> element's key attribute (to set\
    \ a second parameter's value, you'd use <arg1>\nelement, a third, <arg2>, and\
    \ so on:\n\n```\n<form name=\"ch09_03\">\n  <field property=\"byte\"\n    depends=\"\
    required,byte\">\n    <arg0 key=\"ch09_03.byte.text\"/>\n</field>\n```\n\nThat's\
    \ if, if the user omits this field, this application will display an error in\
    \ the\nWelcome page, as shown in Figure 9-3. (We're going to add the tags necessary\
    \ to do this to\nthe Welcome page later in this.)\n\nIf the user enters a value\
    \ that won't fit into a byte, the error message reflects that, as shown\nin Figure\
    \ 9-4."
