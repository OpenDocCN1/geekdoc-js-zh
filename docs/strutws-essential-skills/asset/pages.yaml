    # Scripting Elements


    JSP has three scripting elements:


    +   * Scriptlets The most general of all scripting elements; scriptlets can contain
    Java code.


    +   * Declarations Declare a variable or a method you can use in Java code.


    +   * Expressions Contain a variable expression that the server evaluates. The
    result of the expressions is inserted into the web page.


    Of these, scriptlets are the most general, and they can hold general Java code.
    You enclose scriptlets with the markup <% and %>.. We used a scriptlet to display
    text in our first JSP example: <% out.println("No worries."); %>. This scriptlet
    contained only a single Java statement, there''s no limit to the number of statements
    you can have—which is what makes scriptlets the most general of all the JSP scripting
    elements. In fact, scriptlets are what many JSP programmers think when they think
    of JSP.


    You also use JSP declarations. A declaration can declare anything you can declare
    in Java: variables, methods, classes, and so on. You can declare data items in
    scriptlets, such as variables, but you can''t declare types or methods—for that,
    you need a declaration. You enclose declarations with the markup <% %>. Here''s
    an example; the following code declares the variable message in a declaration
    (note that simple variables like this can also be declared in scriptlets):


    ```

    <HTML>

    <HEAD>

    <TITLE>A JSP Example</TITLE>

    </HEAD>


    <BODY>

    <% String msg = "No worries."; %>

    </BODY>

    </HTML>

    ```


    1. The out object.


    2. Scripting elements, comments, directives, and actions.'
