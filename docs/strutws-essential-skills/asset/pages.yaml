  md: '# The Parts of Eclipse


    Most developers think of Eclipse as a Java IDE, and when you download Eclipse,
    you get the Java IDE (this is the Java Development Toolkit, the JDT) and the Plug-in
    Development Environment (the PDE, which lets you develop Eclipse plug-ins) with
    it.


    As already mentioned, however, Eclipse considers itself a universal tool platform.
    The JDT is itself an addition to Eclipse; in fact, it''s an Eclipse plug-in. Eclipse
    is really the Eclipse platform, and the platform provides support for other tools.
    These tools are implemented as plug-ins, so the platform only needs be a small
    software package.


    The Eclipse platform is made up of several components: the platform kernel, the
    workbench, the workspace, the team component, and the help component.


    # The Platform Kernel


    The Eclipse kernel gets everything started and loads the plug-ins used by the
    platform. This is the component that runs when you start Eclipse, and it loads
    the other plug-ins that perform tasks such as displaying the visual IDE, which
    is done by the Eclipse workbench.


    # The Eclipse Workbench


    The workbench is what you see in Figure 11-1. This is the essential graphical
    interface you work with when you use Eclipse. It comes with toolbars and menus
    built in, and its job is to present those items and the internal windows you see
    in Figure 11-1. It''s the workbench that displays the welcome message you see
    in figure. On the other hand, when you start working with Java, the JDT takes
    over.


    # The Eclipse Workspace


    The workspace component manages your resources, such as files, for you. When you
    work with code in Eclipse, you work with projects. Each project has its own folder
    in the Eclipse workspace. Eclipse projects can contain many folders, each with
    subfolders.


    The workbench component manages all the resources in a project, and includes maintaining
    a history of all the changes to those resources so you can undo them as you want.
    The workspace will inform the various Eclipse plug-ins of those changes.


    The resources in the workspace are held in a directory named workspace. The fact
    that each Eclipse project has its own folder in directory makes things easier
    when you install a new version of Eclipse you can migrate old projects to the
    new version just by copying over your folders (you can use the Eclipse File |
    Import menu item).


    When we develop a Struts application, your Java code will be stored in the Eclipse
    workspace, and the generated .class files will automatically be stored in the
    appropriate Tomcat directory. You can link to and open files that are not in the
    Eclipse workspace but are important to your project, such as web.xml, as we''re
    going to see in this module.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# The Team Component


    The Eclipse team component lets you share code with others in a team environment.
    If you''ve ever been part of a corporate programming team, you know all about
    version control. Program code is checked into or out of a repository as needed
    so that the changes to software can be tracked. The idea here is to avoid changes
    made by team members so that changes do not overlap or obliterate each other as
    various teams work on different versions of the code at the same time.


    This component acts like a Concurrent Versions System (CVS) client that interacts
    with a CVS server. You''ll need a CVS server to make this work; such servers are
    available for free on the Internet.


    # The Help Component


    As its name implies, the help component built into Eclipse provides help. Actually,
    it''s an extensible documentation system. Besides the help files that come with
    Eclipse, Eclipse plug-ins, which extend Eclipse, can provide HTML-based documentation
    that the help component makes available to the user.


    That''s it for the components built into the Eclipse platform. There''s one more
    set of concepts to master before starting work with Eclipse: views, editors, and
    perspectives.


    # 11.2 Use Eclipse Views, Editors, and Perspectives


    With any IDE, Eclipse presents you with many windows. Some of these windows are
    called views, because they give you a view into your project''s resources or your
    data. For example, one view, called the Package Explorer, displays the Java packages
    and classes in your project. Another view lets navigate between projects.


    Also, in any IDE where space is at a premium, views are often stacked. You can
    access various views by clicking the tabs that will appear along the edges of
    the stack.


    Besides views, there''s a special kind of window that appears in the Eclipse workbench,
    and whenever you use Eclipse to open a document or other resources, they''ll be
    in an editor. Eclipse will use the correct kind of editor for the document you''ve
    opened—for example, a plain text editor for text files, or a source code editor
    from the JDT for a Java source code file.


    The central space where editors, which can be stacked just as views, can appear
    in Figure 11-1, displaying the welcome message you see in that figure. You can
    close an editor by clicking the X button in its tab. If you have too many editors
    to conveniently navigate between them using tabs, you can use the Window | Switch
    to Editor menu item (CTRL-F6).'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'You don''t usually select the views and editors that appear at a particular
    time. Instead, you use collections of editors and views called perspectives. For
    example, when you debug, you use the Debug perspective, which displays the code
    you''re working on using special debug editors, other views you keep track of
    breakpoints, immediate values, and so on. When you develop Java code, you use
    the Java perspective, which displays stacked Java source code editors that support
    syntax checking and highlighting, and other views, such as the Console view, which
    displays your applications to the console, and the Package Explorer, which lets
    you navigate between the packages and classes in your project.


    That is to say, perspectives are predefined collections of views and editors that
    appear automatically when you perform certain tasks. For example, when you create
    a Java project, Eclipse will open the Java perspective by default. When you run
    an application with the Run | Debug menu items, the Debug perspective opens by
    itself.


    You can customize perspectives, adding and removing views and editors, using the
    Window | Customize Perspective menu item.


    The JDT supports a number of perspectives associated with Java development—for
    example, the Java perspective itself, which is used for Java development, and
    the Debug perspective, which is specially designed to debug Java applications.


    At this point, we''re ready to speed up on the concepts we''ll need to use Eclipse,
    so that''s what we''re going to do now. Our purpose here will be to create a working
    Struts project using Eclipse.


    # Create a Struts Application with Eclipse


    In this module, we''re going to pick the HTML controls project from Module 6 as
    our project, with the files renamed for this module. The idea here will be to
    translate that project into an Eclipse project. Here are the files we''ll be using:


    +   - ch11_01.jsp HTML controls page

    - Ch11_02.java The action

    - Ch11_03.java The action form

    - ch11_04.jsp The Results page


    These are the files we''ll develop and install using Eclipse. When you first start
    Eclipse, you''ll see the Resource perspective, which is the default perspective
    that appears in Figure 11-1. To work with Struts, you''ll need to create a new
    project.'
  merge: -1
