  md: "# Using Action Classes\n\nBy now, we're familiar with the basics of using actions\
    \ in Struts applications. Such applications start with some kind of Welcome page,\
    \ such as this one asks the user to enter some data in a text field named text.\
    \ The form in the page names action—in this case, Process:\n\n```\n<@ taglib uri=\"\
    tags/struts-html\" prefix=\"html\" %>\n<html>\n<head>\n<title>Enter the data</title>\n\
    </head>\n<body>\n  <html:form action=\"Process\">\n    Please enter the data:\
    \ <html:text property=\"text\" />\n    <html:submit />\n  </html:form>\n</body>\n\
    </html>\n```\n\nIn an action element, the Process action might be tied to the\
    \ dataForm action form:\n\n```\n<action-mappings>\n<action\n  path=\"/Process\"\
    \n  type=\"ProcessAction\"\n  name=\"dataForm\"\n  input=\"index.jsp\">\n  <forward\
    \ name=\"success\" path=\"/results.jsp\"/>\n  <forward name=\"failure\" path=\"\
    /index.jsp\"/>\n</action>\n</action-mappings>\n```\n\nThe dataForm action form\
    \ is tied to a Java class in a <form-beans> element:\n\n```\n<form-beans>\n<form-bean\
    \ name=\"dataForm\"\n  type=\"dataForm\"/>\n</form-beans>\n```"
