  md: "<ch08:createToppings> tag supplies its data using an attribute named toppings.\
    \ Struts\nstore beans using attributes that have the same names as the beans,\
    \ so you can get the\nsame results using our <ch08:createToppings> tag and the\
    \ <logic:iterate> tag, like this:\n\n```\n<@ taglib uri=\"/tags/struts-logic\"\
    \ prefix=\"logic\" %>\n<%@ taglib prefix=\"ch08\" uri=\"WEB-INF/ch08_11.tlld\"\
    \ %>\n<HTML>\n<HEAD>\n  <TITLE>Creating Cooperating Tags</TITLE>\n</HEAD>\n<BODY>\n\
    \  <h1>Creating Cooperating Tags</h1>\n  <ch08:createToppings/>\n  <logic:iterate\
    \ id=\"toppings1\" name=\"toppings\">\n    <BR>\n  </logic:iterate>\n</BODY>\n\
    </HTML>\n```\n\nFor that matter, if you wanted to display the toppings in a <select>\
    \ control that stores user\nselections in a request parameter named userToppings,\
    \ you could use our <ch08:createToppings>\ntag and the Struts <html:select> and\
    \ <html:options>, like this:\n\n```\n<@ taglib uri=\"/tags/struts-logic\" prefix=\"\
    logic\" %>\n<%@ taglib uri=\"/tags/struts-html\" prefix=\"html\" %>\n<%@ taglib\
    \ prefix=\"ch08\" uri=\"WEB-INF/ch08_11.tlld\" %>\n<HTML>\n<HEAD>\n  <TITLE>Creating\
    \ Cooperating Tags</TITLE>\n</HEAD>\n<BODY>\n  <h1>Creating Cooperating Tags</h1>\n\
    \  <ch08:createToppings/>\n  <html:select property=\"userToppings\">\n    <html:options\
    \ name=\"toppings\"/>\n  </html:select>\n</BODY>\n</HTML>\n```\n\nWe've use custom\
    \ tags to fetch data to Struts in The Struts Café project, and now we\nknow how\
    \ to create custom tags like those."
