  md: '# Ask the Expert


    **Q:** I want to set a cookie in my action''s code, not in a JSP page. How can
    I do that?


    **A:** You can use the **response** object, passed to you in the action''s **execute**
    method like this: `Cookie cookie1 = new Cookie("name", "text"); response.addCookie(cookie1);`


    Now that the **messageCookie** object is available, we can use the **Cookie**
    class''s **getValue** to read the value of the cookie (i.e., the text "Hello!")
    and display that in the Results page, like this:


    ```

    <h2></h2>

    <bean:cookie id="messageCookie" name="message"/>

    <% messageCookie.getValue() %>

    <BR/>

    ```


    You can see this at work in the Results page in Figure 7-6, where the cookie''s
    text has been retrieved.


    # Use the <bean:define> Tag


    This tag creates a new scripting variable, by name of this tag''s **id** attribute.
    You can create a new variable directly, or create it using a value from a bean.
    Here are the options:


    +   - Use the **name** attribute. The created scripting variable will be of the
    type of the retrieved bean property.

    - Use the **value** attribute. The created scripting variable will be of type
    `java.lang.String`, set to the value of this attribute.

    - Use body content. The created scripting variable will be of type `java.lang.String`,
    set to the value of the nested body content.


    You can see the attributes for this tag in Table 7-13.

    We''ll use **<bean:define>** in the **<bean>** example project to create a variable
    **variable** that holds the value of the text property (which holds the text entered
    in the Welcome page):


    ```

    <h2></h2>

    <bean:define id="variable" name="ch07_07" property="text"/>

    <% variable %>

    <BR/>

    ```'
