  md: '# Struts. Essential. Skills... 295


    Here''s what ch10_02.jsp looks like—note the new body of this page is now list.jsp,

    not body.jsp:


    ```

    <@taglib uri="WEB-INF/struts-tiles.tld" prefix="tiles" %>


    <tiles:insert page="Layout.jsp" flush="true">

    <tiles:put name="title" value="UsingList" />

    <tiles:put name="header" value="header.jsp" />

    <tiles:put name="footer" value="footer.jsp" />

    <tiles:put name="menu" value="menu.jsp" />

    <tiles:put name="body" value="list.jsp" />

    </tiles:insert>

    ```


    In list.jsp, we''ll create two lists, ItemList0 and itemList, using <tiles:putList>.
    In each <tiles:putList>, we add each element using <tiles:add>. We also set an
    attribute namedColumns to the number of columns we want, and we''re using a new
    layout here, columnsLayout.jsp (each of the tiles we''re inserting, page0.jsp
    to7.jsp, which contains text like "Page 0", "Page 1", and as you see in Figure
    10-3):


    ```

    <@taglib uri="WEB-INF/struts-tiles.tld" prefix="tiles" %>

    <tiles:insert page="columnsLayout.jsp" flush="true">

    <tiles:put name="numberColumns" value="2" />

    <tiles:putList name="itemList0">

    <tiles:add value="page0.jsp" />

    <tiles:add value="page1.jsp" />

    <tiles:add value="page2.jsp" />

    <tiles:add value="page3.jsp" />

    </tiles:putList>

    <tiles:putList name="itemList1">

    <tiles:add value="page4.jsp" />

    <tiles:add value="page5.jsp" />

    <tiles:add value="page6.jsp" />

    <tiles:add value="page7.jsp" />

    </tiles:putList>

    </tiles:insert>

    ```


    The <tiles:putList> element has only one attribute, name, which holds the name
    of the list you''re creating. On the other hand, the <tiles:add> element has a
    number of attributes, as you see in Table 10-4.


    In columnsLayout.jsp, we will recover the number of columns from the numberColumns
    attribute, storing that value in a JSP-accessible variable numberColumnsString
    using the <tiles:useAttribute> element. Its''s purpose is exactly that—to store
    the value of a Tiles attribute in a JSP-accessible variable.


    ![](img/ddb251719fa14da343089d5b1e93d441_322_0.png)'
