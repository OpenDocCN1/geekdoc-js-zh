  md: "# 340 Module 1.1: Using Eclipse with Struts\n\nWe will set a few properties,\
    \ bin and src, to stand for the output and source folders, respectively. We'll\
    \ also use the build.compiler property to specify that Ant should use the java\
    \ compiler that comes with Eclipse, org.eclipse.jdt.JDTCompilerAdapter:\n\n```\n\
    <xml version=\"1.0\" encoding=\"UTF-8\"\n<project name=\"ch11\" default=\"Main\
    \ Build\" basdir=\">\\n  <property name=\"bin\" location=\"D:\\tomcat\\jakarta-tomcat-5.0.19\\\
    webapps\\ch11\\WEB-INF\\classes\"/>\n  <property name=\"src\" location=\\.//>\n\
    \  <property name=\"build.compiler\" value=\"org.eclipse.jdt.core.JDTCompilerAdapter\"\
    />\n```\n\nThe Main Build will depend on two other tasks, Initialize, Compile,\
    \ which will do the actual compilation of our .java files. We indicate this dependency\
    \ with the depends attribute, which means Ant will execute the Initialize and\
    \ Compile tasks when you execute the Main Build:\n\n```\n<xml version=\"1.0\"\
    \ encoding=\"UTF-8\"\n<project name=\"ch11\" default=\"Main Build\" basdir=\"\
    >\\n  <property name=\"bin\" location=\"D:\\tomcat\\jakarta-tomcat-5.0.19\\webapps\\\
    ch11\\WEB-INF\\classes\"/>\n  <property name=\"src\" location=\\.//>\n  <property\
    \ name=\"build.compiler\" value=\"org.eclipse.jdt.core.JDTCompilerAdapter\"/>\n\
    ```\n\n```\n<target name=\"Main Build\" depends=\"Initialize, Compile\">\n  <echo\
    \ message=\"Using Ant\"/>\n</target>\n```\n\nThe Initialize target, we'll delete\
    \ the output directory and re-create it with the Ant in order to make sure no\
    \ old resources are retained. The Compile target uses the Ant <javac> element\
    \ to compile our .java files and deploy them to the webapps/ch11/WEB-INF/classes\
    \ directory:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"\n<project name=\"\
    ch11\" default=\"Main Build\" basdir=\">\\n  <property name=\"bin\" location=\"\
    D:\\tomcat\\jakarta-tomcat-5.0.19\\webapps\\ch11\\WEB-INF\\classes\"/>\n  <property\
    \ name=\"src\" location=\\.//>\n  <property name=\"build.compiler\" value=\"org.eclipse.jdt.core.JDTCompilerAdapter\"\
    />\n```"
