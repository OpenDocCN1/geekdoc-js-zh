  md: '# Module 1: Creating Web Applications


    # Why "Struts"?


    What about the origin of the name Struts? Contrary to what a lot of people think,
    the term "Struts" isn''t an acronym. It''s intended to stand for the struts that
    you can use as underpinnings for construction projects—in this case, for constructing
    web applications. Struts was originally created by a team of developers and released
    in June 2000 as Struts 1. The primary developer was Craig R. McClanahan, who has
    also been the main developer behind some editions of Tomcat, with the web server
    we''re going to use with this book; McClanahan is also the lead developer on Sun''s
    Java Web Services Developer Pack.


    Originally, applications were built in an ad hoc manner, with data mixed in the
    HTML to present an interface to the user. That kind of programming, as we see
    in the next module, is now Model 1 programming. Struts'' job is to implement Model
    2 programming, in which you use the building blocks discussed in this module:
    JSPs, JavaBeans, and servlets. In a Struts application, a servlet acts as the
    controller of the application, delegating user requests as needed. JSPs handle
    the user interface, called the view, and JavaBeans the so-called model, which
    is where the hardcore data handling goes on. You use Model 2 programming when
    you want to create more than a simple web application, and Struts'' genius is
    to provide a framework that implements a well-defined way to create Model 2 applications.


    The current Struts version is 1.1; we''ll also get a look at the upcoming Struts
    1.2.


    # What Creates and Maintains Struts?


    Struts is an open source framework, whose source code is available freely, and
    you can even modify it if you want. It''s hosted by the Apache Software Foundation
    (ASF), as are some of the other products we''ll need, like the Tomcat web server
    and the Ant build tool. You can get Struts for free from http://jakarta.apache.org/struts/;
    just click the links in the Download section on the left. In particular, we''ll
    use the Binaries link in the next module to download the prebuilt version of Struts.
    Click the Source link if you want to build Struts yourself.


    ![](img/ddb251719fa14da343089d5b1e93d441_31_0.png)


    All software produced by the Apache Software Foundation is licensed according
    to the terms of Apache License, currently in version 2, which you can find at
    http://www.apache.org/licenses/LICENSE-2.0. The license makes it clear that you
    don''t have to pay to get Struts or to use it. The license is friendly to businesses
    as well; you can use Struts in commercial projects.


    ![](img/ddb251719fa14da343089d5b1e93d441_31_1.png)


    You''re going to need Java to run Tomcat. If you don''t have Java installed, you
    can get it for free from http://java.sun.com/j2se/1.4/install.html.'
