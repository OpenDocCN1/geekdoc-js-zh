    After declaring this variable, you can use it in a scriptlet. For example, here’s
    how you can display the text in message in a web page:


    ```

    <HTML>

    <HEAD>

    <TITLE>A JSP Example</TITLE>

    </HEAD>


    <BODY>

    <% String msg = "No worries."; %>

    <%= out.println(message); %>

    </BODY>

    </HTML>

    ```


    A JSP expression is any Java code fragment that can be evaluated to yield a value.
    For example, the expression 2 + 2 yields a value of 4, the expression 4–10 yields
    30, and so on. In JSP, you can surround a Java’s expression in the tags <%= %>..
    The expression’s value is inserted into the web page as by the server.


    Here’s an example; if we had stored "No worries." in a variable named message
    we could insert that string into the web page simply by using the variable as
    an expression this way:


    ```

    <HTML>

    <HEAD>

    <TITLE>A JSP Example</TITLE>

    </HEAD>


    <BODY>

    <% String message = "No worries."; %>

    <%= message %>

    </BODY>

    </HTML>

    ```


    That expressions like this must result in a single value when they’re evaluated.


