    # Ask the Expert


    > Q: Can you initialize the values of properties set up in a DynaActionForm struts-config.xml?


    > A: As of Struts 1.1, the DynaActionForm reset method does not initialize property
    values as specified in <form-property> elements in struts-config.xml. If we want
    to initialize our properties, we must subclass the DynaActionForm class and write
    our reset method. We can also override the initialize method inside the subclass
    to do the same thing. However, now that we''re writing our action form in Java
    again, we''ve lost most of the advantages of using a DynaActionForm.


    # Use Struts 1.2


    Using a DynaActionForm is completely compatible with Struts 1.2 (at least this
    point in the Struts 1.2 beta cycle). This project compiles and works just fine
    using Struts 1.2.'
