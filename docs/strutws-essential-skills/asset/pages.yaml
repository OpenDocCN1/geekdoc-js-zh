  md: '# Use the <bean:parameter> Tag


    The <bean:parameter> tag gives you access to request object parameters. These
    are the parameters that hold data from the HTML controls that you can access with
    the getParameters method in Java code. You can see the attributes for this <bean>
    tag in Table 7-16.


    For example, the text field in the <bean> sample project is named text in the
    Welcome page:


    ```

    <html:form action="ch07_06.do">

    <h2>Enter your data:</h2>

    <html:text property="text"/>

    ```


    We recover the text in the text field with a <bean:parameter> element, storing
    data in a variable named text. We''ll display the value in that variable in the
    Results page this way:


    ```

    <h2>The parameter data:</h2>

    <bean:parameter id="text" name="text"/>

    <% text %>

    <BR>

    ```


    You can see the results in Figure 7-7, where as you see, the data from the text
    parameter - "No worries", was recovered from the request object and displayed.


    | Attribute Name | Description |

    |---|---|

    | id | The name of the scripting variable that will be created with the value
    of the specified request parameter. This attribute is required. |

    | multiple | If any value is assigned to this attribute, creates a call to HttpServletRequest].getParameterValues
    and returns as type String[]. By default, HttpServlet.getParameter is called,
    and the parameter is returned as type String. |

    | name | The name of the request parameter whose value, or values, is to be retrieved.
    This attribute is required. |

    | value | The default value to return if no parameter with the specified name
    was found. |


    Table 7-16 The Struts <bean:parameter> Tag Attributes'
