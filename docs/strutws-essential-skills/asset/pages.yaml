  md: '# 338 Module 11: Using Eclipse with Struts


    And that''s it—we''ve installed a Struts project in Eclipse, edited project files,
    built the project, and now run. As you can see, there''s plenty of value here.
    Not only does Eclipse centralize all project files and opening them in an editor
    easy, but it also catches syntax errors, suggests solutions, and for the compiled
    code in the correct Tomcat directs.


    # CRITICAL SKILL 11.9 Connect Eclipse to Ant


    Your Struts deployment may need what Eclipse can give you, however. There are
    other options, as well; for example, a great tool for compiling and deploying
    Struts projects is Ant, the Java build tool. Ant lets you perform remote, FTP-based
    deployments, create .jar files, and more. Ant is available as a stand-alone tool,
    but because Ant is popular, Eclipse comes with it built. All we have to do is
    to add an Ant build file, build.xml, to our project and set the classpath that
    Ant will use in Eclipse. To include include servlet-api.jar and struts.jar, select
    Window | Preferences | Ant | Runtime and click the Classpath tab. Click the Add
    JARs button, navigate and select servlet-api.jar and struts.jar in webapps/ch1/WEB-INF/lib,
    and click Open, adding these files to the classpath as you see in Figure 11-17.


    ![](img/ddb251719fa14da343089d5b1e93d441_365_0.png)


    Figure 11-17 Adding .jar files for Ant'
