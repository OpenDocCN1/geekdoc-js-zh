  md: 'its its price and discount, and so on. The model doesn''t know anything about
    the view of the controller. The model is often implemented using JavaBeans.


    +   - The view implements the presentation of data to the user. The view takes
    the data supplied to it (usually from the controller) and displays it. The designers
    of the view need to know HTML, but they don''t need to know anything about the
    logic implemented in the model. The view is often implemented in JSP.


    +   - The controller oversees the model and view by reacting to the data the user
    sends. It accepts input from the user, calls the appropriate bean methods in the
    model, and sends data to the view for presentation. The controller is often implemented
    as a servlet.


    In other words, a Model 2 application can use all programming techniques reviewed
    in Module 1—a servlet controller, a JavaBean model, and a JSP view. This will
    be the basis of your Struts applications.


    Struts applications are built using an architecture that is very close to Model
    2 architecture, but there''s some terminology you need to learn. That''s coming
    up next.


    # Understand How Struts Works


    The hardest part of learning how Struts works is understanding the flow of control
    through a Struts application. There are a number of new terms here—ActionServlet,
    ActionForm, ActionMapping, and so on—and it''s crucial that you master them. Because
    there''s a lot to absorb here, we''ll go through the whole control flow a number
    of times, first in overview here, then with working examples in code. You might
    have to come back and read this description a number of times as we progress,
    but don''t give up; once you know how these concepts work, you''ve won the battle.


    We''ll take a look at how a typical Struts application works in overview, starting
    with a Welcome page and ending with a results page. There are many ways to build
    Struts applications, but this will give you a good start.


    # Ask the Expert


    Q: Is the MVC architecture right for every web application?


    A: No. If you''re writing something simple, you probably don''t need the explicit
    code separation involved in writing the different components—model, view, and
    controller—involved in an MVC application. The MVC advantages come into play principally
    in large applications.'
