    true\" />\n```\n\nThis new definition, **tilesExtendedDefinition**, builds on\
    \ our previous **tilesDefinition** definition. Here's how tilesDefinitionDefinition\
    \ looks in tiles-definition.xml:\n\n```\n<definition name=\"tilesDefinition\"\
    \ path=\"/Layout.jsp\">\n  <put name=\"title\" value=\"Using Definitions\" />\n\
    \  <put name=\"header\" value=\"/header.jsp\" />\n  <put name=\"footer\" value=\"\
