    choose their lunch. You can see this application at navigating to http://localhost:8080/ch03/ch03_01.jsp,
    where users can order various items, as shown in Figure 3-3.


    When a user clicks the Place Order button, the order is summarized, as shown in
    Figure 3-4.


    You can base this example on the struts-blank application if you like, but there''s
    no need to do that since we''ve developed the code from scratch. Up to this point,
    we''ve used the struts-blank application as a skeleton for our work, which meant
    that the Struts files were already installed in the directories we needed them
    in. To create an application from scratch, copy the Struts files like this:


    +   - Copy the Struts copies-*.jar from the Struts distribution into the WEB-INF/lib
    directory of your web application.


    +   - Copy the Struts files.jar from the Struts distribution into the WEB-INF/lib
    directory of your web application.


    +   - Copy all of the Struts files-*.tld from the Struts distribution into the
    WEB-INF directory of your web application.


