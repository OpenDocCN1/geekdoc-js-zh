    \nThe next step is to create the layout we're going to use, Layout.jsp.\n\n# #\
    \ Creating the Layout\n\nIn ch10_01.jsp, we \"put\" the value of several attributes,\
    \ as setting the attribute we've named header to \"header.jsp\". We also set the\
    \ attribute title to the text \"Using Tiles\". Layout.jsp acts like a template\
    \ you can insert tiles into, and in this case, we're going to use an HTML tag\
    \ to arrange those tiles.\n\nTo start, we recover the value of the attribute we've\
    \ named title in ch10_01.jsp, which holds the text we want in the Results page's\
    \ title. You can do that with the <tiles:getAsAsString> element like this:\n\n\
    ```\n<% taglib uri=\"WEB-INF/struts-tiles.tld\" prefix=\"tiles\" %>\n\n<html>\n\
    <head>\n    <title><tiles:getAsAsString name=\"title\"/></title>\n</head>\n.\n\
    .\n</body>\n\n</html>\n```\n\nThe <tiles:getAsAsString> element recovers the value\
    \ of the attribute you specify and inserts it into the template as you direct—in\
    \ this case, the title text for the Results page. You can also use the <tiles:insert>\
    \ element to insert the pages—that is, the tiles—we want to display. Here's how\
    \ we insert the header, footer, menu, and body, using an HTML table:"
