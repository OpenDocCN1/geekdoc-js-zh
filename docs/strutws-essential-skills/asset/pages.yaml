  md: "# Struts: Essential Skills 243\n\nIn our project, we will create a cooperating\
    \ tag to go with our <ch08:iterator> tag, which will create the toppings page\
    \ context attribute. This cooperating tag will be called <ch08:createToppings>.\
    \ In web Module 3 we can use custom tags like <ch08:createToppings> to store data\
    \ in attributes that Struts tags like <logic:iterate>, but we have never seen\
    \ how to create custom tags to do until now.\n\nHere's how we'll use this tag,\
    \ <ch08:createToppings>, in a new JSP page, ch08_10.jsp: all you have to do is\
    \ use <ch08:createToppings> in a web page to store data in the toppings attribute,\
    \ and then the <ch08:iterator> can recover the data from that attribute:\n\n```\n\
    <@ taglib prefix=\"ch08\" uri=\"WEB-INF/ch08_11.tld\" %>\n<HTML>\n<HEAD>\n<TITLE>Creating\
    \ Cooperating Tags</TITLE>\n</HEAD>\n<BODY>\n<h1>Creating Cooperating Tags</h1>\n\
    <ch08:createToppings/>\n<ch08:iterator>\nToppings:\n</ch08:iterator>\n</BODY>\n\
    </HTML>\n```\n\nYou also have to add this tag to the .tld file:\n\n```\n<xml version=\"\
    1.0\" encoding=\"ISO-8859-1\"?>\n<!DOCTYPE taglib PUBLIC\n  \"--//Sun Microsystems,\
    \ Inc.//DTD JSP Tag Library 1.2//EN\"\n  \"http://java.sun.com/dtd/web-jsptaglibrary_1_2.dtd\"\
    >\n<taglib>\n  <tlib-version>1.0</tlib-version>\n  <jsp-version>1.2</jsp-version>\n\
