  md: "You can access error messages in an application.properties by key, as well\
    \ as giving (optional) definitions of the following message keys:\n\n+   - errors.header\
    \ Header text for the error message list. Usually, this text will end with <ul>\n\
    \n+   - errors.footer Footer text after the error messages list. Usually, this\
    \ text will begin with </ul>\n\n+   - errors.prefix Text that will be added before\
    \ each error in the list.\n\n+   - errors.suffix Text that will be added after\
    \ each error in the list.\n\nFor example, if you want to make sure the user enters\
    \ text into the text field, you can use code like in the action:\n\n```\nActionErrors\
    \ actionerrors = new ActionErrors();\n\nch06_03 dataForm = (ch06_03) form;\n\n\
    String text = dataForm.getText();\nif(text.trim().equals(\"\")) {\n    actionerrors.add(ActionErrors.GLOBAL_ERROR,\
    \ new\n    ActionError(\"error.notext\"));\n}\n\nif(actionerrors.size() != 0)\
    \ {\n    saveErrors(request, actionerrors);\n    return new ActionForward(mapping.getInput());\n\
    }\n```\n\nWe'll add these keys to application.properties:\n\n```\nerror.notext=Please\
    \ enter some text.\nerrors.footer=</ul>\nerrors.header=<ul>\nerrors.prefix=<li><font\
    \ color=\"red\">\nerrors.suffix=</li></font>\nerrors.footer=</ul>\n```\n\nYou\
    \ can see the results in Figure 6-3 if the user didn't enter anything into the\
    \ text field."
