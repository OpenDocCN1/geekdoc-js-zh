    # Directives


    JSP directives let you give directions to the server on how a page should be processed.
    There are three directives in JSP; we''ll see them throughout the book, but here''s
    an overview:


    +   - page Lets you configure one JSP page, such as when its output is HTML or
    XML.

    - include Lets include another page or resource in a JSP page.

    - taglib Lets use a set of custom tags as defined in a tag library.


    You use the special markup %@ and %%% with directives. For example, to create
    a page directive, you use the keyword "page" like this: %@ page ... %>

    To get an idea of what directives can do, we''ll take a look at the page directive.
    In our example, we are specifying that we want to make the output of the page
    XML not the default HTML, want to import java.sql so your Java code can use, and
    if there are any errors, the server should pass them to an error page, error.html.
    You can do add all attributes of the page directive. Here''s how that:


    ```

    <@ page error="error.jsp" language="java"

    contentType="application/xml" import="java.sql.*" %>

    <html>

    <HEAD>

    ..

    ```


    It''s important to note that if you use the page directive, it must come at the
    very beginning of the page.


