  md: "# 24 Module 1: Creating Web Applications\n\nThe doGetGet() method handles data\
    \ sent to the servlet when an HTML form has its METHOD attribute set to GET, which\
    \ is the default. You can also use the doPost() method, which handles the case\
    \ when an HTML form has its METHOD attribute set to POST. Or you can use the service()\
    \ method, which handles both GET and POST methods.\n\nIn the doGetGet() method,\
    \ we indicate that our response, which is to be sent back to the browser, is going\
    \ to be in HTML. To send HTML back to the browser, we'll create a PrintWriter\
    \ object named out in the code. In JSP, the out object already exists as soon\
    \ as the JSP starts executing, but in servlets you may explicitly create it:\n\
    \n```\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    ```\n\n```\npublic class ch01_08 extends HttpServlet {\n    public void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n    throws IOException, ServletException\
    \ {\n        response.setContentType(\"text/html\");\n        PrintWriter out\
    \ = response.getWriter();\n    }\n}\n```\n\nTo send HTML back to the browser,\
    \ you can use the out object's println() method. Here's how that works in java.io:\n\
    \n```\nimport java.io.*;\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    ```\n\n```\npublic class ch01_08 extends HttpServlet {\n    public void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n    throws IOException, ServletException\
    \ {\n        response.setContentType(\"text/html\");\n        PrintWriter out\
    \ = response.getWriter();\n        out.println(\"<HTML>\");\n    }\\}\n```"
