  md: "# Handle Credit Cards\n\nThere's a **creditCard** rule to check if the value\
    \ entered is a legal credit card number.\nHere's how we use that rule in this\
    \ module's project:\n\n```\n<field property=\"creditCard\"\n  depends=\"creditCard\"\
    \n  <arg0 key=\"ch09_03.creditCard.text\"/>\n</field>\n```\n\nThis rule simply\
    \ checks credit card numbers by checking whether the number satisfies\nal algorithm\
    \ for valid credit card numbers.\n\n# Handle Masks\n\nOne very powerful validation\
    \ rule is **mask**, which lets you use regular expressions to validate\ntext.\
    \ Although their syntax is the scope of this book, regular expressions let you\
    \ specify\nexactly how text strings should read—whether they be all text, contain\
    \ punctuation,\nletters, digits, and so on. In the project for this module, we\
    \ ask the user to enter their city in a\nfield named **city** in the Welcome page.\
    \ To make sure that field contains only lowercase\nand/or uppercase letters, we\
    \ can use the simple regular expression ^a-zA-Z]*$ (^ corresponds\nto the beginning\
    \ of a line of text, and the character set [a-zA-Z]* stands) Here's what that\
    \ looks like in validation.xml,\nusing the **mask** variable with the **mask**\
    \ standard rule:\n\n```\n<field property=\"city\"\n  depends=\"mask\"\n  <arg0\
    \ key=\"ch09_03.city.text\"/>\n  <var>\n    <var-name>mask</var-name>\n    <var-value>^[a-zA-Z]*$</var-value>\n\
    \  </var>\n</field>\n```"
  merge: -1
  pgno: 300
- img_proc: true
  md: "# 274 Module 9: The Struts Validator Framework\n\nCRITICAL SKILL\n\n# 9.15\
    \ Validate Using Constants\n\nIt's also possible to create named constants in\
    \ validation.xml. For example, to check codes, you might create a constant named\
    \ zip corresponding to a regular expression that can check for five-digit zip\
    \ code. You can create a global constant in an element named <global> under the\
    \ <form-validation> element, like this:\n\n```\n<form-validation>\n<global>\n\
    \  <constant>\n    <constant-name>zip</constant-name>\n    <constant-value>\\\
    d{5}\\d*$</constant-value>\n  </constant>\n</global>\n```\n\nOr, you can create\
    \ a local constant in a <fieldset> element:\n\n```\n<fieldset>\n  <constant-name>zip</constant-name>\n\
    \  <constant-value>\\d{5}\\d*$</constant-value>\n</fieldset>\n<form name=\"ch09_03\"\
    >\n</form>\n```\n\nYou can now refer to that constant in your rules like this,\
    \ where you're using the zip constant in a rule to ensure the zip field from the\
    \ Welcome page contains valid five-digit zips:\n\n```\n<field property=\"zip\"\
    \n  depends=\"mask\">\n  <arg key=\"ch09_03.zip.text\"/>\n  <var>\n    <var-name>mask</var-name>\n\
    \    <var-value>${zip}</var-value>\n  </var>\n</field>\n```"
  merge: -1
