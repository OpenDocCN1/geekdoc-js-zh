  md: "# Struts: Essential Skills 147\n\n```\npublic ActionForward green(ActionMapping\
    \ mapping,\nActionForm,\nHttpServletRequest request,\nHttpServletResponse response)\n\
    throws IOException, ServletException {\n    System.out.println(\"Go.\");\n   \
    \ return mapping.findForward(\"success\");\n}\n```\n\nHow does Struts know which\
    \ method to call? In the <action> element, we declare a parameter named **method:**\n\
    \n```\n<action path=\"/ch05.ch05_05\"\ntype=\"ch05.ch05_05\"\nname=\"method\"\n\
    parameter=\"method\"\ninput=\"/ch05.ch05.jsp\">\n    <forward name=\"success\"\
    \ path=\"/ch05_08.jsp\"/>\n</action>\n```\n\nWe connect this action to an action\
    \ form named **ch05.ch05_06:**\n\n```\n<form-bean name=\"ch05.ch05_06\"\ntype=\"\
    ch05.ch05_06\"/>\n```\n\nThe **method** property of the action form will hold\
    \ the name of the method that Struts is supposed to call in the action class.\
    \ Here's the code for the action form, **ch05_06**, looks like:\n\n```\npackage\
    \ ch05;\nimport org.apache.struts.action.ActionForm;\n\npublic class ch05_06 extends\
    \ ActionForm {\n\n    private String method = \"\";\n\n    public String getMethod()\
    \ {\n        return method;\n    }\n\n    public void setMethod(String method)\
    \ {\n        this.method = method;\n    }\n}\n```"
