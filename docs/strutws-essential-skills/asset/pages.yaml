    This connects this servlet to the URL *do, so when we submit our form''s data
    to Data.do, the action servlet will get that data and know it''s supposed to forward
    that data to the Data action. How does it find the Java code that corresponds
    to that action?


    # # ActionMappings


    With the action servlet, actions make up the controller in Struts applications.
    As discussed, the controller is broken into two parts: the action servlet comes
    built into Struts, and the actions that you customize yourself.


    At this point in our application, the action servlet knows it''s supposed to send
    the data from your HTML form to the action named Data. An is a Java object based
    on the org.apache.struts.action.Action class, and the action needs needs to call
    the action''s execute method to pass all the data it needed to. How does it know
    where to find the action object? It checks the action-mappings element in the
    struts-config.xml file.


    ![](img/ddb251719fa14da343089d5b1e93d441_65_0.png)


    The struts-config.xml file doesn''t have to have that; you can set any name you
    want as long as you use that name in the config initialization parameter for the
    action servlet in web.xml.


    As we''ve seen, the action servlet is set up in web.xml. When it loads, the action
    servlet reads in another configuration file, struts-config.xml. This file tells
    how you''ve set up your application, in particular, the <action-mappings> element
    in struts-config.xml tells the action servlet where it finds the actions to pass
    data on.


    The <action-mappings> element contains <action> elements, for each action you''ve
    created. To set up an action named Data, you might set an <action> element''s
    path attribute to name. To give the name of the Java class that implements this
    action, you can use the type attribute. For example, to indicate that the Data
    action is supported by the ch02.DataAction class (which the action servlet will
    look for in your applications WEB-INF/classes directory), your <action> element
    might look like this:'
  merge: -1
