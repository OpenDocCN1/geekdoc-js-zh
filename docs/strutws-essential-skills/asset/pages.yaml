  md: "# CRITICAL SKILL 9.17 Use DynaActionForm Objects and Validation\n\nWhat if\
    \ you wanted to perform validation when using a DynaActionForm instead of a standard\
    \ form bean? As you saw, you can convert a bean's code to use the Validator framework\
    \ if you use the ValidatorForm class instead of the Action class. But what about\
    \ DynaActionForm objects?\nIt turns out that this is easier than you might think;\
    \ all you have to use the DynaValidatorForm class instead of the DynaActionForm\
    \ class. Here's how that might look in struts-config.xml.\n\n```\n<form-bean\n\
    \  name=\"logonForm\"\n  type=\"org.apache.struts.action.DynaValidatorForm\"\n\
    \  <form-property>\n    name=\"username\"\n    type=\"java.lang.String\"/>\n \
    \ <form-property>\n    name=\"password\"\n    type=\"java.lang.String\"/>\n```\n\
    \nBefore, you connect the Validator framework to Struts by creating a new plug-in\
    \ using the org.apache.struts.validator.ValidatorPlugin class and associating\
    \ the files validation.xml and validator-rules.xml with the plug-in. You can find\
    \ the fields of the DynaActionForm class in Table 9-4 and its methods in Table\
    \ 9-5.\n\n| Field | Means |\n| --- | --- |\n| private static org.apache.commons.logging.Log\
    \ log | Logging instance variable |\n| protected int page | Indicates the current\
    \ page of a multipage form |\n| protected org.apache.commons.validator.ValidatorResults\
    \ validatorResults | Results returned from the validation |\n\nTable 9-4 The Fields\
    \ of the DynaActionForm Class"
