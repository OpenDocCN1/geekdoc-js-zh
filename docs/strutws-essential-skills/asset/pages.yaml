    # 6.2 Use the <<html>:form> Tag


    To work with HTML controls, you need to enclose them in an HTML <form> element.
    You can do that with the <html:form> custom JSP tag in Struts. The significant
    attributes of this tag appear in Table 6-5.


    > CAUTION Although <html:form> tag is used to support name, type, and scope attributes,
    they''re deprecated now. The preferred usage is to allow the appropriate values
    to be determined automatically from the corresponding ActionMapping.


    | Attribute Name | Description |

    | --- | --- |

    | action | The URL which this form will be submitted. |

    | enctype | The content encoding to be submitted this form, if the method is POST.
    |

    | focus | The field name to which initial focus will be assigned with a JavaScript
    function. |

    | method | The HTTP method that will be used to submit this request (GET, POST).
    Defaults to POST. |

    | name | Deprecated. Formerly the bean name, but these days, the bean name is
    determined from the ActionMapping. |


    Table 6-5 The Struts <<html>:form> Tag''s Significant Attributes'
