- img_proc: true
  md: "# Struts: Essential Skills 299\n\n| Attribute Name | Description |\n|---|---|\n\
    | id | The name of the newly created definition bean. This attribute is required.\
    \ |\n| scope | The scope of the newly defined bean. The default is page scope.\
    \ |\n| template | Same as page. |\n| page | A string representing the URI of a\
    \ template JSP page. |\n| role | If the user is in the specified role, the tag\
    \ is taken into account; otherwise, the tag is ignored. |\n| extends | Name of\
    \ a parent definition that is used as the base for this new definition. |\n\n\
    Table 10-6 The <tiles:definition> Attributes\n\n# Progress Check\n\n+   1. What\
    \ attribute do you use to specify the layout page in <tiles:definition>?\n2. What\
    \ attribute do you use in <tiles:definition> to specify the definition you want\
    \ to use?\n\nBesides creating a definition in a JSP file, you can also store Tiles\
    \ definitions in XML documents, and it's more usual to do that.\n\n# 10.4 Use\
    \ XML-Based Definitions\n\nAs you recall, we connected a file named tiles-definitions.xml\
    \ to the Tiles plug-in in struts-config.xml:\n\n```\n<plug-in className=\"org.apache.struts.tiles.TilesPlugin\"\
    >\n  <set-property property=\"definitions-config\"\n    value=\"/WEB-INF/tiles-definitions.xml\"\
    \ />\n  <set-property property=\"moduleAware\" value=\"true\" />\n</plug-in>\n\
    ```\n\nThis document, tiles-definitions.xml, contains an element named <tiles:definition>.\
    \ We can place our definition, which we'll name tilesDefinition here, inside that\
    \ element. Doing\n\n+   1. template\n2. beanName"
