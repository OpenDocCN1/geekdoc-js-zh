  md: '# Overload Definitions


    CRITICAL SKILL


    Say that you wanted to change some aspect of a Tiles definition—for example, you
    might want to use a different header file than that specified in the definition.
    To see how that would work, take a look at ch10_05.jsp, where we''re doing exactly
    that—replacing the header used in our definition tilesDefinition.


    In ch10_05.jsp, we use the tilesDefinition definition:


    ```

    <%@ taglib uri="/WEB-INF/struts-tiles.tld" prefix="tiles" %>

    <tiles:insert definition="tilesDefinition" flush="true" />


    </tiles:insert>

    ```


    But we also change some aspects of the definition by overloading them with new
    <tiles:put> elements. In particular, we will change the tiles text and the JSP
    page used as the header:


    ```

    <%@ taglib uri="/WEB-INF/struts-tiles.tld" prefix="tiles" %>

    <tiles:insert definition="tilesDefinition" flush="true" />

    <tiles:put name="title" value="Overloading Definitions" />

    <tiles:put name="header" value="overloadedHeader.jsp" />

    </tiles:insert>

    ```


    Here''s the new header file, overloadedHeader.jsp looks like: <center><h1>Overloading
    Definitions</h1></center>


    You can see the results in Figure 10-4, in both the header text and title bar
    text, which display the text “Overloading Definitions”.


    # Progress Check


    +   1. What Tiles element do you use to overload a definition?

    2. How do you indicate which attribute you''re overloading in the Tiles element''s
    the answer to the previous question?'
