    Now the server will store the Tiles tags definitions in struts-tiles.tld, which
    comes with Struts 1.1 and we will store them in WEB-INF. The .tld file connects
    the Tiles tags to classes found in struts.jar. For example, this is how the Tiles
    <tiles:insert> element is tied to the class org.apache.struts.taglib.tiles.InsertTag
    and its various attributes in struts-tiles.tld:


    ```

    <?xml version="1.0" encoding="UTF-8?>

