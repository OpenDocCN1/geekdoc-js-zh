  md: '# The Welcome Page


    Struts applications often start with a Welcome page, which is often index.jsp
    (the default JSP page that will be opened when you browse to a directory on the
    server if no other file is specified and no index.html is present). As so, the
    welcome page may contain HTML controls, such as text fields, check boxes, and
    so on, that the user can enter data into. When the user clicks the Submit button,
    that is supposed to go back to your Struts application''s controller.


    In Struts, the controller is made up of an action servlet (an ActionServlet object)
    and an action object or objects. User request are sent to the action servlet,
    which delegates requests to the action object or objects for further processing.
    It''s done this instead of using a single servlet for the controller because the
    action servlet comes built into Struts and you don''t usually modify it. Instead,
    modify the Action objects that handle requests sent to them from the action servlet.


    So how do you make the data in the HTML controls in the Welcome page (or any other
    page) goes back to the action servlet (and then is sent on to the correct action
    object)? There are six custom JSP libraries that Struts 1.1, and you use them
    in JSPs to handle tasks like this for you. In this case, you use the html library
    to create a custom HTML form that will send its data back to the action servlet.
    You start the Welcome page, index.jsp, with a JSP <%@taglib %> directive to add
    support for the html tag library:


    ```

    <@taglib uri="/tags/struts-html" prefix="html" %>

    ```


    You''re able to create an HTML form to hold HTML controls using the <html:form>
    custom tag. You can set the action attribute of this form to the name of the action
    the action servlet should forward the form''s data to:


    ```

    <@taglib uri="/tags/struts-html" prefix="html" %>

    ```


    ```

    <html:form action="Data">

    Please click the button:

    <html:submit />

    </html:form>

    ```


    Note also the <html:submit /> element here, which creates a Submit button. There
    are <html:xxxx> tags for the various HTML controls, such as <html:text>, to create
    an HTML text field and so on.'
