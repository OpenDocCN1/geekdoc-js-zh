    This is useful because it means you can use relative URLs from now on. JSP like
    this can be copied to other directories before being executed, which can break
    relative URLs. Using the <html:base> tag resets the base URL to the current URL
    for use in all relative URLs, as we''ll discuss later in this book.


    Next, Welcome.jsp uses the <logic:notPresent> tag to make sure the org.apache.struts.action.MESSAGE
    bean is present for use in the servlet context; if not, the application''s resources
    haven''t been loaded, and Welcome.jsp displays an error:


    ```

    <@ tag uri="/tags/struts-bean" prefix="bean" %>

    <%@ tag uri="/tags/struts-html" prefix="html" %>

    <%@ tag uri="/tags/struts-logic" prefix="logic" %>


    <html:html locale="true">

    <head>

    <title><html:bean name="message.title"/></title>

    <html:base/>

    </head>

    <body bgcolor="white">\n

    <logic:notPresent name="org.apache.struts.action.MESSAGE" scope="application">

    <font color="red">

    ERROR: Application resources not loaded -- check servlet container

    logs for error messages.

    </font>

    </logic:notPresent>

    ```


    Error messages like this are usually stored in application.properties, but this
    is an exception—clearly, if the resources haven''t been loaded, you can''t access
    an error from them.


    Finally, Welcome.jsp displays the welcome message''s header and the message itself:


