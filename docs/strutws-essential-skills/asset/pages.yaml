  md: '# 226 Module 8: Creating Custom Tags.


    As you know, much of working with Struts revolves around working with custom JSP
    tags. In addition to the tags that come built into Struts, that often means creating
    your own custom tags to augment what Struts provides.


    For example, in the Struts Cafe project in Module 3 we saw how custom JSP tags
    can feed data by setting attributes that the Struts tags can use. Here''s what
    it looked like, where we used two of our own custom tags, ch03:items/ and to pass
    data to the <logic:iterate and <html:select> Struts tags:


    ```

    <@ taglib uri="/tags/struts-bean" prefix="bean" %>

    <%@ taglib uri="/tags/struts-html" prefix="html" %>

    <%@ taglib uri="/tags/struts-logic" prefix="logic" %>

    <%@ taglib uri="/tags/ch03" prefix="ch03" %>

    ```


    ```

    <HTML>

    <HEAD>

    <TITLE>The Struts Cafe</TITLE>

    </HEAD>


    <BODY>

    <h1>The Struts Cafe</h1>

    <html:errors/>

    <ch03:items/>

    <ch03:toppings/>

    <html:form action="ch03_04.do">

    <TABLE>

    <TR>

    <TD ALIGN="LEFT" VALIGN="TOP">

    <bean:message key="toppings"/>

    <BR>

    <logic:iterate id="toppings1" name="toppings">

    <html:multibox property="toppings">

    </html:multibox>

    <= toppings1 %>

    <BR>

    </logic:iterate>

    </TD>

    <TD ALIGN="LEFT" VALIGN="TOP">

    <bean:message key="items"/>

    <BR>

    <html:select property="items">

    <html:options name="items"/>

    </html:select>

