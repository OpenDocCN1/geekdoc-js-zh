  md: '# 284 Module 10: The Tiles Framework


    Another big aspect of Struts programming that you should know about is an acronym
    that you can construct the Tiles framework. Like the name Struts, Tiles is not
    an acronym—the idea that you can construct the appearance of application pages
    using “tiles” that you construct yourself. All you need to do is create a template
    that lays out the appearance of a page as you want, and then tell the Tiles framework
    what tiles you want to include. Each tile is just a web page in its own right,
    and they’ll be inserted where you want them.


    This connects well with Struts because the pages you arrange with Tiles can be
    Struts-aware, containing forms that connect to various actions. Also, as we’ll
    see at the end of this module, you can use a Tiles definition (corresponding to
    a Tiles layout) as a Struts action forward. Tiles interfaces so well with Struts
    that it’s included in the Struts 1.1 struts.jar file, which means the Java support
    is already there for you to use.


    There are other mechanisms to include pages in a template page like this, such
    as the <jsp:include> action. But Tiles has more to offer; lets you specify the
    format of the final page by specifically including headers, footers, and other
    page elements. You can see an example page built with Tiles in Figure 10-1, with
    these elements showing.


    So does the Tiles framework work?


    ![](img/ddb251719fa14da343089d5b1e93d441_311_0.png)


    Figure 10-1 A page created using the Tiles framework'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# # Working with Tiles


    The Tiles framework depends on you first creating a layout template and then individual
    tiles that will be placed in various places in the template. The idea is that
    this model promotes reusability, as well as internationalization of your pages.
    If the only thing that changes between the 500 web pages on your site is the individual''s
    body and you want to keep the header, footer, and a navigation menu for each page,
    Tiles can help you out.


    To use Tiles, you create a layout page, often using HTML tags or Cascading Style
    Sheet (CSS) styles to arrange elements where you want. The tile pages you create
    will be inserted into that layout. Although you''re free to lay out your pages
    as you want them using Tiles, you typically use Tiles to construct a page using
    these common four page elements (as we have in Figure 10-2):


    +   - **Header** Text and graphics that appear at the top of the Results page.

    - **Footer** Text and graphics that appear at the bottom of the Results page.

    - **Menu** A set of navigation hyperlinks, usually appearing to the left of the
    Results page''s body, as you see in Figure 10-1.

    - **Body** The page''s content, sandwiched between the header and footer vertically
    and placed to the right of the menu.


    For example, here''s what ch10_01.jsp, which you see in Figure 10-1, looks like
    (we''ll have this web page apart in few pages


    ```

    <%@taglib uri="WEB-INF/struts-tiles.tld" prefix="tiles" %>


    <tiles:insert page="Layout.jsp" flush="true">

    <tiles:put name="title" value="Using Tiles" />

    <tiles:put name="header" value="header.jsp" />

    <tiles:put name="footer" value="footer.jsp" />

    <tiles:put name="menu" value="menu.jsp" />

    <tiles:put name="body" value="body.jsp" />

    </tiles:insert>

    ```


    ![](img/ddb251719fa14da343089d5b1e93d441_312_0.png)


    Figure 10-2 Tiles elements'
  merge: -1
  pgno: 312
- img_proc: true
  md: "# 286 Module: 10: The Tiles Framework\n\nYou can see what's going on here—we\
    \ specify the layout page we want to insert items into the <tiles:insert> element,\
    \ which contains <tiles:put> elements that set attributes we've given names to\
    \ title, header, footer, and so on to various values. In the layout page, we'll\
    \ be able to recover those attributes and assemble our Results page (we'll use\
    \ an HTML table to arrange the various items we want to display).\n\n# Installing\
    \ Tiles\n\nHow do you actually get Struts working? The Tiles .class files you\
    \ need come built into the Struts 1.1 struts jar file, like the Validator framework,\
    \ you have to install Tiles as a plug-in in struts-config.xml. Here's what that\
    \ looks like—in this case, we're connecting a file named tiles-definitions.xml\
    \ to the Tiles plug-in to hold template definitions (these definitions can appear\
    \ in .jsp pages or in XML documents, as we're going to):\n\n```\n<struts-config>\n\
    ```\n\n```\n<plugin-in className=\"org.apache.struts.tiles.TilesPlugin>\n  <set-property\
    \ property=\"definitions-config\"\n    value=\"/WEB-INF/tiles-definitions.xml\"\
    \ />\n  <set-property property=\"moduleAware\" value=\"true\" />\n</plugin-in>\n\
    ```\n\n```\n</struts-config>\n```\n\nAs is apparent in ch10_01.jsp, which uses\
    \ the <tiles:insert> element and <tiles:put> elements, Tiles is based on custom\
    \ JSP tags. You can see in the %@ taglib directive at the top of ch10_01.jsp,\
    \ the .tld file for these tags is struts-tiles.tld:\n\n```\n%@ taglib uri=\"WEB-INF/struts-tiles.tld\"\
    \ prefix=\"tiles\"%>\n```\n\nTo register struts-tiles.tld with the server, you\
    \ add a <taglib> element to web.xml, just as you do for the Struts tag libraries\
    \ (such as struts-html.tld and so on), like:\n\n```\n<web-app>\n```\n\n```\n<taglib>\n\
    \  <taglib-uri>/WEB-INF/struts-tiles.tld</taglib-uri>\n  <taglib-location>/WEB-INF/struts-tiles.tld</taglib-location>\n\
    </taglib>\n```"
