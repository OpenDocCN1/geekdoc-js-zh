    annotations, and they’re ignored by the web server. In JSP, you enclose the text
    in a comment between the tags <%- and --. Here’s an example in this case, the
    code includes the comment “Now print the message.” to this JSP example:


    ```

    <HTML>

    <HEAD>

    <TITLE>A JSP Example</TITLE>

    </HEAD>

    ```'
