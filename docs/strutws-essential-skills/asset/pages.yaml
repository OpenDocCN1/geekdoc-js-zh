  md: "# Struts: Essential Skills\n\nCRITICAL SKILL\n\n# 5.2 Use ForwardAction\n\n\
    The org.apache.struts.actions.ForwardAction class lets you set up an action that\
    \ forwards to a new URL automatically. In other words, instead of passing control\
    \ to a Java action class that you've written, actions that use the ForwardAction\
    \ class are simply designed to let you forward to a new URL.\n\nWe're already\
    \ seen an example of the ForwardAction class work in the struts-blank Module 2\
    \ (not to be confused with the ActionForward class, objects that return from the\
    \ execute method). In that application, the Welcome page, index.jsp, was designed\
    \ to forward the user immediately to the actual Welcome page, Welcome.jsp. The\
    \ index.jsp file was defined with a forward welcome:\n\n```\n<%@ taglib uri=\"\
    /tags/struts-logic\" prefix=\"logic %>\n<logic:redirect forward=\"welcome\"/>\n\
    ```\n\nIn struts-config.xml, you can define local forwards for each action with\
    \ <forward> elements inside <action>. You can also define global forwards with\
    \ <global-forward> element (which is a child of the <struts-config> element, <action-mappings>\
    \ and <global-exceptions>), and that's how the struts-blank application connects\
    \ the welcome to an action named Welcome.do:\n\n```\n<global-forwards>\n  <!--\
    \ Default forward to \"Welcome\" action -->\n  <!-- Demonstrates using index.jsp\
    \ to forward -->\n  <forward\n    name=\"welcome\"\n    path=\"/Welcome.do\"/>\n\
    </global-forwards>\n```\n\nThe Welcome.do action is actually a ForwardAction to\
    \ the real Welcome page, Welcome.jsp. Here is how it works in the <action> element:\n\
    \n```\n<action-mappings>\n  <!-- Default \"Welcome\" action -->\n  <!-- Forwards\
    \ to Welcome.jsp -->\n  <action\n    path=\"/Welcome\"\n    type=\"org.apache.struts.actions.ForwardAction\"\
    \n    parameter=\"/pages/Welcome.jsp\"/>\n</action-mappings>\n```\n\nIf you set\
    \ up an action with the org.apache.struts.actions.ForwardAction class, that action\
    \ will forward control to the URL given by the <action> element's parameter attribute.\n\
    \n139\n\nUsing Actions"
