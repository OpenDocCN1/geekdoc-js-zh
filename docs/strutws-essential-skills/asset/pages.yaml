  md: '# 204 Module 7: The Struts <logic> and <bean> Tags


    CRITICAL SKILL


    # 7.5 Use the <logic:match> and <logic:notMatch> Tags


    <logic:match> and <logic:notMatch> tags let you search text for matches. Specifically,
    <logic:match> lets you search the text in a variable by providing a string; if
    your string is found inside the variable''s text (matching either the text or
    a substring in that), the body of the <logic:match> element is included in the
    result document; <logic:notMatch> works in reverse; the body of the element is
    included if the match is not found. You can see the significant attributes for
    this tags in Table 7-6.


    In the <logic> sample project for this module, where the user enters the text
    “6", we''ll check that with <logic:match> and <logic:notMatch>, first checking
    for the text “6” and for the text “9":


    ```

    <h2>Using &lt;logic:match&gt;/h2>

    <logic:match name="ch07_03" property="text" value="6">

    Results: Match

    </logic:match>

    ```


    ```

    <h2>Using &lt;logic:notMatch name="ch07_03" property="number" value="9&gt;/h2>

    <logic:notMatch name="ch07_03" property="number" value="9">

    Results: No Match

    </logic:notMatch>

    ```


    | Attribute Name | Description |

    | --- | --- |

    | cookie | The cookie value you want to match. |

    | header | The header whose value you want to match (in this case, the match is
    case-insensitive). |

    | location | If not used, a match between the variable and the value can be at
    any position in the variable. If used, the match must occur at the specified location
    (start or end) of the variable. |

    | name | If property is not used, this is the variable to be matched. If used,
    this is the bean property you''re matching. |

    | parameter | The variable to be matched is the value of the request parameter
    specified by this attribute (or the first value if there are multiple values).
    |

    | property | The property of a bean match. |

    | scope | The bean scope (defaults to any scope). |

    | value | The constant value which is to be matched as a substring of the specified
    variable. This attribute is required. |


    Table 7-6 The Struts <logic:match> and <logic:notMatch> Tag Attributes'
