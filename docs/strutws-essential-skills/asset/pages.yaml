  md: '# Module 11: Using Eclipse with Struts


    As you progress with Struts and develop larger projects, working with the Java
    command-line compiler, jacavac, becomes more and more cumbersome. Even with small
    Java projects, Java can be very finicky—you might forget to add a semicolon at
    the end of a line or to declare a variable or something, and jacavac can suddenly
    reel off pages of errors. When your Struts applications become large, managing
    many files in different locations and working on the code can become very difficult
    if you''re doing it all by hand.


    A Integrated Development Environment (IDE) is the answer, and in this module we''ll
    discuss using the most popular (and free) one: Eclipse. Using Eclipse can make
    Struts development far easier, as we will see in this module, where we''ll develop
    a Struts application using Eclipse. Eclipse lets you automate the entire build
    process, reducing the whole thing to a single menu item selection. And Eclipse
    can not only pinpoint problems before you compile your code, but also suggest
    solutions. Struts applications involve many files, and one of the biggest advantages
    of using an IDE like Eclipse is that so access to all those files. They''re all
    listed in a single window, and you don''t have to worry about specifying paths
    seven levels deep; you can simply double-click to open them.


    Eclipse is the premiere IDE these days; you can see it in Figure 11-1. Eclipse
    can act as an IDE for many languages (Eclipse calls itself a universal platform),
    from C to Cobol, but it''s most widely used with Java. It comes with Java tools
    and the Java IDE built in, although you can load plug-ins for other languages
    as well.


    ![](img/ddb251719fa14da343089d5b1e93d441_339_0.png)


    Figure 11-1 Eclipse'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'Eclipse is free. That doesn''t make it cheap, however—at least, not cheap to
    create. A major player behind Eclipse is IBM, which has reportedly spent $40 million
    to develop it. The first version, 1.0, came out in November 2001, and it''s undergoing
    changes ever since.


    Eclipse is now an open source project. It is still largely under IBM''s development,
    but it''s part of a software consortium named eclipse.org. You can see the consortium''s
    web page, www.eclipse.org, in Figure 11-2.


    The Eclipse consortium now contains more than 45 members, including such as Borland,
    IBM, MERANT, QNX Software Systems, Rational Software3, Red Hat, SuSE, Sybase,
    Hitachi, Oracle, Hewlett Packard, Intel, and others.


    Eclipse is actually a project that has three subparts:


    +   - The Eclipse platform itself, which forms the backbone of the whole application

    - The Java Development Toolkit (JDT), led by Erich Gamma

    - The Plug-in Development Environment (PDE), which lets you develop your own tools
    for

    Eclipse, called plug-ins.


    You can learn more about these subprojects at http://www.eclipse.org/eclipse/.


    ![](img/ddb251719fa14da343089d5b1e93d441_340_0.png)


    Figure 11-2 The Eclipse consortium web page'
  merge: -1
