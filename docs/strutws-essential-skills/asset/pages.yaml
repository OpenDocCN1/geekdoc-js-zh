  md: "# Create Iterating Tags\n\nAs an example, say that you want to display a list\
    \ of pizza toppings in a web page as a list, like this:\n\n+   - Topping: Pepperoni\n\
    - Topping: Sausage\n- Topping: Ed\n- Topping: Olives\n\nWe'll create an iterating\
    \ tag. `<ch08:iterator>`, to display this list; by getting to the Java roots of\
    \ iterating tags, you'll have more control than just using the Struts `<logic:iterate>`\
    \ tag. The Welcome page for this new project, ch08_07.jsp, looks like the following—note\
    \ that you place the text that will be iterated in each repetition (“Topping:”\
    \ here) in the body of the `<ch08:iterator>` element:\n\n```\n<ch08:iterator>\n\
    Topping:\n</ch08:iterator>\n```\n\nYou can hardcode the names of the toppings\
    \ you want to display in Java code, but it's usually better to store them in the\
    \ page that'll display them directly where the Java code get access to them, allowing\
    \ you to use the same Java code across hundreds of different pages. For example,\
    \ you might store the toppings in a page context attribute using the JSP `pageContext`\
    \ built-in object, communicating those toppings to the Java code.\n\nHere's how\
    \ you can add the toppings as a `String` array to the page context under the name\
    \ in a new taglib project, ch08_07.jsp:\n\n```\n<@ taglib prefix=\"ch08\" uri=\"\
    WEB-INF/ch08_08.tld\" %>\n<HTML>\n<HEAD>\n  <TITLE>Creating Iterating Tags</TITLE>\n\
    </HEAD>\n<BODY>\n  <h1>Creating Iterating Tags</h1>\n  String[] toppings = new\
    \ String[]{\"Pepperoni\", \"Sausage\", \"Ham\", \"Olives\" };\n  pageContext.setAttribute(\"\
    toppings\", toppings);\n  <ch08:iterator>\n    Topping:\n  </ch08:iterator>\n\
    </BODY>\n</HTML>\n```"
  merge: -1
