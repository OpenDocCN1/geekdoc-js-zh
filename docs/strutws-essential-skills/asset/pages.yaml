  md: "# What About Exceptions?\n\nNote that the execute method can throw exceptions:\n\
    \n```\npublic ActionForward execute(ActionMapping mapping,\n    ActionForm form,\n\
    \    HttpServletRequest request,\n    HttpServletResponse response)\nthrows java.lang.Exception\
    \ {\n    .\n    .\n}\n```\n\nIn struts-config.xml, you can use global and local\
    \ exception handlers to handle the thrown exceptions. For example, say you wanted\
    \ to catch an application-defined exception named app.BadPassword, which extends\
    \ the java.lang.Exception class. You could define a global exception handler for\
    \ this exception in the <global-exceptions> element in struts-config.xml. Other\
    \ elements we're already familiar with, such as <action-mappings> or <form-beans>\
    \ in struts-config.xml, the <global-exceptions> element is a child of the <struts-config>\
    \ element. Here's what that would look like, where we're indicating that the page\
    \ that should handle this error.BadPassword in application.properties:\n\n```\n\
    <struts-config>\n    .\n    <global-exceptions>\n        <exception\n        \
    \    key=\"error.BadPassword\"\n            type=\"app.BadPassword\"\n       \
    \     path=\"/login.jsp\"/>\n    </global-exceptions>\n    .\n</struts-config>\n\
    ```\n\nIn login.jsp, you can use <html:errors /> or <html:messages /> to display\
    \ the message corresponding to the key error.BadPassword. You also have direct\
    \ access to the JSP exception object in your JSP code that page, which will hold\
    \ the app.BadPassword object."
  merge: -1
  pgno: 163
