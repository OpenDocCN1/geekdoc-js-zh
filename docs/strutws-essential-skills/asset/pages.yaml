    In this module, we are going to discuss how to create custom JSP tags. In the
    real world, Struts applications are often mixes of your own custom tags and those
    built into Struts. For that reason, creating your own JSP tags that work with
    Struts is a fundamental skill for Struts programmers, and we''re going to develop
    that skill in this module. It''s a skill that many experienced JSP/servlet programmers
    lack, but as you start working with Struts, it''s an important one to pick up.


    CRITICAL SKILL UP


    Creating Custom Tags


    # Use a Text-Inserting Tag


    Our first example is to give a simple project where we create a tag that will
    insert some text ("This text is from the custom tag.") into a results page. Here
    is how we''ll use this tag, which we''ll call <ch08:message/>, in the Welcome
    page, ch08_01.jsp:


    ```

    <%@ taglib prefix="ch08" uri="WEB-INF/ch08_02.tld" %>

    <HTML>

    <HEAD>

    <TITLE>Inserting Text With Custom Tags</TITLE>

    </HEAD>

    <BODY>

    <h1>Inserting Text With Custom Tags</h1>

    <ch08:message />

    </BODY>

    </HTML>

    ```


    The <%@ taglib %> JSP directive here, which connects the prefix for our custom
    tags, ch08 in this module, with the tag library definition file, ch08_02.tld.
    There are various ways to make this connection, including using a <taglib> element
    in web.xml like this in Module 3, and as Struts tag libraries it do:


    ```

    <taglib>

    <taglib-uri>ch08/taglib-uri>

    <taglib-location>WEB-INF/ch08.tld</taglib-location>

    </taglib>

    ```'
