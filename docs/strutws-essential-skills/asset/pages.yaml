  md: "# 116 Module 4: Working with Models and ActionForms\n\nIn this method, we check\
    \ the data entered by the user and add an ActionError object (ActionMessage object\
    \ in Struts 1.2) to an ActionErrors collection for each error. We can also access\
    \ error messages from the application.properties file from inside the action form's\
    \ code as we see here, where we use the message error.notext.\n\n```\npublic ActionErrors\
    \ validate(ActionMapping mapping, HttpServletRequest request) {\n    ActionErrors\
    \ actionerrors = new ActionErrors();\n\n    if(text.trim().equals(\"\")) {\n \
    \       actionerrors.add(ActionErrors.GLOBAL_ERROR, new ActionError(\"error.notext\"\
    ));\n    }\n\n}\n```\n\nThen we return the ActionErrors collection from this method.\
    \ If this collection contains any ActionError objects, the action servlet will\
    \ send the corresponding error messages back to the browser. Here's how the validate\
    \ method works in this project's action form:\n\n```\npackage ch04;\nimport org.apache.struts.action.*;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \npublic class ch04_08 extends ActionForm {\n\n    private String text = \"\"\
    ;\n\n    public String getText() {\n        return text;\n    }\n\n    public\
    \ void setText(String text) {\n        this.text = text;\n    }\n\n    public\
    \ void reset(ActionMapping mapping, HttpServletRequest request) {\n        this.text\
    \ = \"Enter your text here.\";\n    }\n}\n```"
