    The most significant method is the **execute** method, which we''ll now look at
    in detail.


    # The execute Method


    The **execute** method is passed these objects:


    ```

    public ActionForward execute(ActionMapping mapping,

    ActionForm form,

    HttpServletRequest request,

    HttpServletResponse response)

    throws java.lang.Exception {


    n

    }

    ```


    You''ve seen the **ActionMapping** object before and used its **findForward**
    method to determine where to find the view. As listed here, **ActionMapping**
    objects actually have four methods, including the useful **getInputForward**,
    which forwards to the page given in the action mapping as the input page:


    +   - **Exception findException(java.lang.Class type)** Finds and returns the
    ExceptionConfig instance defining how exceptions of the specified type should
    be handled.

    - **ActionForward findForward(java.lang.String name)** Finds and returns the ForwardConfig
    instance defining how forwarding to the specified logical name should be handled.

    - **java.lang.String[] findForwards** Returns the logical names of all locally
    defined forwards for this mapping.

    - **ActionForward getInputForward** Creates (if necessary) and returns the ActionForward
    that corresponds to the input property of this Action.


    > TIP: Also note that you can get a **String** array of all forwards in this action''s
    mapping using the **getForwards** method.


