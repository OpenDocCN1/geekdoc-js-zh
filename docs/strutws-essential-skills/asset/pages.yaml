    **Table 10-2** The <tiles:insert> Attributes


    To insert the tiles in Layout.jsp, we''ll use <tiles:insert> elements inside the
    <tiles:insert> element. In each <tiles:put> element, we specify the name of the
    tile we want to insert and its value—for example, the body of the Results page
    will be inserted from the page body. In this way, we are creating what is called
    attributes in Tiles and assigning each value:


    ```

    <taglib uri="WEB-INF/struts-tiles.tld" prefix="tiles" %>

    <tiles:insert page="Layout.jsp" flush="true">

    <tiles:put name="title" value="Using Tiles" />

    <tiles:put name="header" value="header.jsp" />

    <tiles:put name="footer" value="footer.jsp" />

    <tiles:put name="menu" value="menu.jsp" />

    <tiles:put name="body" value="body.jsp" />

    </tiles:insert>

    ```


    You can see the <tiles:put> attributes in Table 10-3.'
