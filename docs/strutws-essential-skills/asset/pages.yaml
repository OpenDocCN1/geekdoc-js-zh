  md: '# Introduction


    Welcome to Struts: Essential Skills. This book is designed to be as accessible
    and complete as it is possible for a first book on Struts to be. It puts Struts
    to work in depth, pushing the envelope and working with allied standards as well.
    The best way to learn like Struts is by example, and this is an example-oriented
    book.

    There aren''t many topics that are gaining popularity as fast as Struts these
    days. More and more Web applications are being built using Struts. With Struts,
    you have a great deal of control over how those applications work because you
    have a framework that you can plug components into.

    You''re getting into Struts at the right time—the excitement level is high and
    new developments appear frequently. This book tries to be true to that spirit
    and capture much of the excitement and power of Struts as possible.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Who Is this Book For?


    This book is for you if you want to develop the power that Struts applications
    are capable of. What you''ll see here lets you take control of the server side
    of things. If you already know how to handle JSP and servlet programming and want
    to go on to the next step in creating Web applications, then this is the book
    for you.


    To use this book profitably, you''ll need to be acquainted with Java, JavaServer
    Pages (JSP), servlets, and HTML. We''ll review the skills you need in this book
    in Module 1. If you don''t feel comfortable with the level of discussion there,
    it''s a good idea to take a look at an introductory JSP/servlet book before pressing
    on. Check out JSP: A Beginner''s Guide (McGraw-Hill/Osborne, 2001) for more information.


    # What''s Inside?


    This book is filled with examples, seeing a working example is the best way to
    learn Struts; there''s nothing like seeing it work for yourself. Here are a few
    of the topics we cover:


    +   - The parts of a Struts application

    - Model/View/Controller architecture

    - Accepting user input, processing it, and displaying results

    - Storing data in beans

    - Passing bean data to views

    - Handling exceptions

    - Understanding struts-config.xml

    - Creating Struts forms in the view

    - The ActionForm class

    - Handling errors

    - Connecting to beans and action servlets

    - Message resources

    - Property files'
  merge: -1
