  md: "# Use IncludeAction\n\nAnother popular class is the org.apache.struts.actions.IncludeAction\
    \ class. This action class was designed to let you work with legacy code, including\
    \ older documents in Struts applications. Here's an example. Say that you have\
    \ some legacy code you want to incorporate in a Struts application, such as ch05_01.jsp,\
    \ which uses the JSP tag <jsp:getProperty> to read the property text of a bean\
    \ named ch05_02:\n\n```\n<HTML>\n<HEAD>\n  <TITLE>Using a Bean</TITLE>\n</HEAD>\n\
    <BODY>\n  <h1>Using a Bean</h1>\n\n  The bean says: <jsp:getProperty name=\"ch05_02\"\
    \ property=\"text\" />\n\n</BODY>\n</HTML>\n```\n\nThis JSP doesn't use any Struts\
    \ support, but you can still include it in a Struts application. We'll start by\
    \ creating the ch05_02 action form, connecting it to the ch05.ch05_02 class:\n\
    \n```\n<form-bean name=\"ch05_02\"\n  type=\"ch05.ch05_02\"/>\n```\n\nAnd the\
    \ ch05.ch05_02 class will support the text property, like this:\n\n```\npackage\
    \ ch05;\nimport org.apache.struts.action.ActionForm;\n\npublic class ch05_02 extends\
    \ ActionForm\n{\n  private String text = \"\";\n\n  public String getText()\n\
    {\n    return text;\n  }\n}\n```"
