  md: '# 214 Module 7: The Struts.<logic>. and <bean> Tags...


    # CRITICAL SKILL 7.9 Use the <bean:cookie> Tag


    You can use the <bean:cookie> tag to recover (not set) the value of a cookie.
    The value will be a single value or multiple values, depending on the multiple
    attribute. The return value will be stored in a page scope attribute of type Cookie
    (if multiple is not used) or Cookie[] (if multiple is used). You can see the attributes
    for this tag in Table 7-12.


    To see how this works, we will create a cookie message in the Welcome page in
    the JSP code. This cookie will last for a day and will hold the text "Hello":


    ```

    <%

    Cookie cookie = new Cookie("message", "Hello!");

    cookie.setMaxAge(24 * 60);

    response.addCookie(cookie);

    %>

    ```


    Now that we''ve installed the cookie, we can use a <bean:cookie> element to read
    it. It creates a Cookie object named messageCookie holding our cookie in the response
    page:


    ```

    <h2>The cookie data:</h2>

    <bean:cookie id="messageCookie" name="message"/>

    ```


    | Attribute Name | Description |

    | id | The name of the scripting variable that will be made available with the
    value of the specified request cookie. This attribute is required. |

    | multiple | Causes all matching cookies to be accumulated and stored into a bean
    of type Cookie[]. If not used, the first value for the specified cookie will be
    stored as a value of type Cookie. |

    | name | Specifies the name of the cookie whose value, or values, is to be retrieved.
    This attribute is required. |

    | value | The default cookie value to return if no cookie with the specified name
    was found. |


    Table 7-12 The Struts <bean:cookie> Tag Attributes'
