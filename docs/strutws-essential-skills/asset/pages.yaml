  md: '# Struts: Essential Skills 339


    The version of Ant in Eclipse will be able to find the jar files it needs for
    our import statements. The next step is to create the Ant build file.


    To create the build file, use the Eclipse File | New menu item and create a new
    file named build.xml (Eclipse has a built-in editor, so although it doesn''t open
    general XML files by default, it will open build.xml with syntax highlighting).
    Eclipse will add that file to the project and give it an icon in the Package Explorer
    with a small ant, as shown in the Package Explorer at left in Figure 11-18.


    The build.xml file starts with an XML declaration and a <project> document element.
    Ant files are based on targets, and our target will be called "Main Build",


    ```

    <?xml version="1.0" encoding="UTF-8"?>n<project name="ch11" default="Main Build"
    basedir=\.">

    ```


    ![](img/ddb251719fa14da343089d5b1e93d441_366_0.png)


    Figure 11-18 Ant''s build.xml file'
