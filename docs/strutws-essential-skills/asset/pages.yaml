  md: "# Handle Shorts\n\nThe short rule lets us make sure that the value the user\
    \ enters into a short integer. We can handle it easily in validation.xml; for\
    \ example, here's how we specify that the value entered into the Welcome page's\
    \ short field must be a valid short integer:\n\n```\n<field property=\"short\"\
    \n  depends=\"short\">\n  <arg key=\"ch09_03.short.text\"/>\n</field>\n```\n\n\
    # Handle Integers\n\nThe integer rule makes sure that the entered value will fit\
    \ into an integer. Here's how we enforce that rule for the Welcome page's integer\
    \ field:\n\n```\n<field property=\"integer\"\n  depends=\"integer\">\n  <arg key=\"\
    ch09_03.integer.text\"/>\n</field>\n```\n\nWhat if you want to restrict the value\
    \ of the integer to a certain range? That's coming up next.\n\n# Handle Integer\
    \ Ranges\n\nTo restrict the value of an integer to a certain range, we can use\
    \ the intRange rule, which we add to the rules checking our integer field:\n\n\
    ```\n<field property=\"integer\"\n  depends=\"integer,intRange\">\n```\n\nHow\
    \ do you restrict allowed integers to a certain range, say 15 to 25? Rules like\
    \ intRange have variables associated with them, and in this case variables are\
    \ named max and min. You can set the values of the min and max variables with\
    \ <var> elements, which contain the"
  merge: -1
  pgno: 296
- img_proc: true
  md: "name of the variable in <var-name> elements and the value you're assigning\
    \ the variable in <var-value> elements. To set min to 15 and max to 25, you'd\
    \ do this:\n\n```\n<field property=\"integer\">\n  depends=\"integer,intRange\"\
    >\n  <arg0 key=\"ch09_03.integer.text/>\n  <arg1 name=\"intRange\" key=\"${var.min}\"\
    \ resource=\"false\"/>\n  <arg2 name=\"intRange\" key=\"${var.max}\" resource=\"\
    false\"/>\n  <var>\n    <var-name>min</var-name>\n    <var-value>15</var-value>\n\
    \  </var>\n  <var>\n    <var-name>max</var-name>\n    <var-value>25</var-value>\n\
    \  </var>\n</field>\n```\n\nThe error message for range errors takes two parameters,\
    \ corresponding to min and max, like this:\n\nerrors.range={0} is not in the range\
    \ {1} through {2}.\n\nSet the {1} and {2} parameters using the values of min and\
    \ max, we can use <arg1> and <arg2> elements, setting the name attribute to intRange\
    \ to indicate what error we're creating parameters for, the key value to the value\
    \ of min or max, and the resource attribute to false to indicate that Struts shouldn't\
    \ search application.properties for these values:\n\n```\n<field property=\"integer\"\
    >\n  depends=\"integer,intRange\">\n  <arg0 key=\"ch09_03.integer.text/>\n  <arg1\
    \ name=\"intRange\" key=\"${var.min}\" resource=\"false\"/>\n  <arg2 name=\"intRange\"\
    \ key=\"${var.max}\" resource=\"false\"/>\n  <var>\n    <var-name>min</var-name>\n\
    \    <var-value>15</var-value>\n  </var>\n  <var>\n    <var-name>max</var-name>\n\
    \    <var-value>25</var-value>\n  </var>\n</field>\n```\n\nNow when the user enters\
    \ a value outside allowed range, they'll see an error like the one that appears\
    \ in Figure 9-5."
