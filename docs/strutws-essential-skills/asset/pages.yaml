  md: "# Ask the Expert\n\nQ: Is there any other way to pass data from a web page\
    \ to an action besides relying on the form bean?\n\nA: There sure is. Because\
    \ you passed a request object in the action's execute method, you can use object's\
    \ getParameter method to read data from the web page (like: text = request.getParameter(\"\
    text\")); However, because Struts is set up to pass beans back and forth between\
    \ the various components of an application, it usually makes sense to stick with\
    \ the bean's way of containing data.\n\nNow you can access the text property in\
    \ the dataForm and write text to the Results page, like this:\n\n```\n<%@taglib\
    \ uri=\"/tags/struts-bean\" prefix=\"bean\" %>\n<html>\n<head>\n  <title>A Results\
    \ page</title>\n</head>\n<body>\n  <h1>Reading User Input</h1>\n  You typed: <bean:write\
    \ name=\"dataForm\" property=\"text\"/>\n</body>\n</html>\n```\n\nThat's it. When\
    \ the users enter their names and clicks Submit, name appears in the Results page.\n\
    We've completed the basics of Struts programming with examples that built gradually\
    \ from the ground up, and you're now prepared to tackle a full Struts application.\
    \ We'll do that next.\n\n# Progress Check\n\n+   1. What do you need to do to\
    \ the form variable passed to the execute method before accessing your data?\n\
    2. What do you have to do to pass a form bean from an action to a Results page?\n\
    \n1. You first cast it to the type of your form bean rather than the generic ActionForm\
    \ class.\n2. Nothing; the form bean will be accessible from the Results page already.\
    \ All you have to do is to forward to that page."
