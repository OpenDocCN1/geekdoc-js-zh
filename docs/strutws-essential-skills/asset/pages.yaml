    # The ActionServlet


    The action servlet is indeed a servlet; it''s an object of the org.apache.struts.action

    .ActionServlet class, which extends the standard javax.servlet.HttpServlet class.
    Servlets

    are configured in web.xml in the WEB-INF directory with <servlet> and <servlet-mapping>

    elements as we discussed in Module 1.


    In web.xml, the action servlet is given the name action, and it''s set up like
    this in the

    <servlet> element—note that any initialization parameters here set values the
    action

    servlet will need, such as the name of the configuration file, struts-config.xml,
    which we''ll

    use soon:


    ```

    <servlet>

    <servlet-name>action</servlet-name>

    <servlet-class>org.apache.struts.ActionServlet</servlet-class>

    <init-param>

    <param-name>config</param-name>

    <param-value>/WEB-INF/struts-config.xml</param-value>

    </init-param>

    <init-param>

    <param-name>debug</param-name>

    <param-value>2</param-value>

    </init-param>

    <init-param>

    <param-name>detail</param-name>

    <param-value>2</param-value>

    </init-param>

    <load-on-startup>2</load-on-startup>

    </servlet>

    ```'
