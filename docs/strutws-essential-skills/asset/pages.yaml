  md: "As an example, we'll implement the toppings array as a scripting variable using\
    \ the <ch08:createToppings> tag. When you do, that array will become available\
    \ in your JSP code automatically. To create this new scripting variable, you declare\
    \ it in the .tdld file\n\n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n\
    <!DOCTYPE taglib PUBLIC\n  \"//SunSystems, Inc.//DTD JSP Tag Library 1.2//EN\"\
    \n  \"http://java.sun.com/dtd/web-jstaglibrary_1_2.dtd*>\n<taglib>\n<taglib-version>1.0</taglib-version>\n\
    <jsp-version>1.2</jsp-version>\n<short-name>CustomTags</short-name>\n<description>Example\
    \ tags.</description>\n<tag>\n<name>iterator</name>\n<tag-class>ch08.ch08_09</tag-class>\n\
    </tag>\n<tag>\n<name>createToppings</name>\n<tag-class>ch08.ch08_12</tag-class>\n\
    <variable>\n<name-given>toppings</name-given>\n<variable-class>java.lang.String\
    \ []</variable-class>\n<declare>true</declare>\n<scope>AT_END</scope>\n</variable>\n\
    </tag>\n</taglib>\n```\n\nNow the toppings variable will be filled automatically\
    \ with the toppings array by the <ch08:createToppings> tag, and you can access\
    \ it directly in your JSP code. The results appear in Figure 8-5, where you can\
    \ see how easy it is to pass data from custom tags to JSP code.\n\nThat completes\
    \ our discussion of creating custom tags for use in Struts applications. Struts\
    \ applications often use custom tags to make life easier for the developer and\
    \ to allow for easy code reuse. With custom tags, you can augment the resources\
    \ Struts gives you in its own custom tags."
