  md: "# 288 Module 10: The Tiles Framework\n\n| Tag Name | Description |\n| --- |\
    \ --- |\n| insert | Inserts a tile into a template. |\n| definition | Creates\
    \ a tile template definition. |\n| put | Puts an attribute into the template context.\
    \ |\n| putList | Declares a list that will be passed as an attribute to the tile\
    \ context. |\n| add | Adds an element to the enclosing list. Just like \"put,\"\
    \ for lists. |\n| get | Gets the content from request scope that was stored by\
    \ a put tag. |\n| getAsString | Retrieves the value of the specified attribute.\
    \ |\n| useAttribute | Uses attribute value inside a page as a JSP-accessible variable.\
    \ |\n| importAttribute | Imports a attribute. |\n| initComponentDefinitions |\
    \ Initializes the Tiles definitions factory. |\n| Table 10-1 | The Tiles Tags\
    \ |\n\nYou can see the Tiles tags in Table 10-1.\nThat installs Tiles. How about\
    \ putting it to work?\n\n> CRITICAL SKILL 10.1\n\n# Create a Basic Page\n\nAs\
    \ our first example, we're going to create the page you in Figure 10-1, ch10_01.jsp.\
    \ We'll start with a <tiles:insert> element, which lets you insert tiles into\
    \ a layout page. In this case, we're going to insert our tiles into a page named\
    \ Layout.jsp using <tiles:insert> and the page attribute (setting the flush attribute\
    \ to \"true\") means the current page's output stream be flushed:\n\n```\n<@ taglib\
    \ uri=\"WEB-INF/struts-tiles.tld\" prefix=\"tiles\" %>\n```\n\n```\n<tiles:insert\
    \ page=Layout.jsp flush=\"true\">\n  \n</tiles:insert>\n```\n\nYou can see the\
    \ attributes of the <tiles:insert> element in Table 10-2."
