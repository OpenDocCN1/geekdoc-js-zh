  md: "# Struts: Essential Skills 137\n\nYou can also make this local exception—that\
    \ is, local to the current action. You do that simply by using the <exception>\
    \ element inside the <action> element, like this:\n\n```\n<action path=\"/ch04_02\"\
    \n  type=\"ch04.ch04_02\"\n  name=\"ch04_03\"\n  input=\"/ch04_01.jsp\">\n\n<exception\
    \ key=\"error.BadPassword\"\n  type=\"app.BadPassword\"\n  path=\"/login.jsp\"\
    \ />\n\n<forward name=\"success\" path=\"/ch04_05.jsp\" />\n</action>\n```\n\n\
    You can use your own exception handler instead of the standard org.apache struts.action.ExceptionHandler\
    \ class. You specify your own exception handler by the <exception> element's className\
