    3.1 Read User Input


    In the previous module, we created an application that displayed a Submit button
    that the user could click to see a message, "No worries." We''ll extend that to
    accept user input and use a form bean to hold that data. You can see this application
    by navigating to http://localhost:8080/ch03, as shown in Figure 3-1. The application
    asks the user to enter their name, as you see in the figure.


    When the users enter their name and click the Submit button, that name is sent
    to our action via a form bean. The action reads and forwards it on to the Results
    page, which displays the name as shown in Figure 3-2.


    The example we created in the previous module was a good start. Now it''s time
    to extend that example to handle data using a form bean. Let''s take a look at
    how this works. If you want to follow along, copy over the webapps/ch02 folder
    to webapps/ch03; we''ll be renaming the ch02 package as ch03.


