  md: "# Struts: Essential Skills 105\n\n# Ask the Expert\n\n**Q:** Does a Struts\
    \ application need a model?\n\n**A:** No, but in larger applications, it’s hard\
    \ to avoid it. The controller is made up of the action servlet and the action(s),\
    \ and its function is, as its name implies, to control the flow of the action.\
    \ The work that the application does—the guts of the program—shouldn’t go into\
    \ the controller, except in relatively simple applications. The model is for behind-the-scenes\
    \ work, applying business rules, looking up data, launching worker threads to\
    \ perform involved calculations, and more.\n\nStruts came about in the first place\
    \ to handle larger web applications by providing a framework for those applications.\
    \ It’s easy to write programs in an ad hoc manner, but when it comes to trying\
    \ to track down errors, you’ll be out of luck if the presentation logic is mixed\
    \ in the program’s logic. For anything more substantial, move the application’s\
    \ logic to the model.\n\nWorking with Models and ActionForms\n\n# Struts 1.2\n\
    \nBecause we developed the code for the model ourselves, there’s very little that\
    \ has to be upgraded to work with Struts 1.2 in this project. The only changes\
    \ to make are in the action, where we need to replace ActionError and ActionErrors\
    \ with ActionMessage and ActionMessages:\n\n```\npackage ch04.io;\n```\n\n```\n\
    import java.*;\nimport java.util.*;\nimport ch04.ch04_03;\nimport ch04.ch04_04;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    import javax.servlet.ServletException;\nimport org.apache.struts.action.*;\n```\n\
    \n```\npublic class ch04_02 extends Action\n{\n    public ActionForward execute(ActionMapping\
    \ mapping,\n        ActionForm form,\",\n```"
