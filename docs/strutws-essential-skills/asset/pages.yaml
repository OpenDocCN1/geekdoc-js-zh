  md: '# What Do You Need?


    Besides a familiarity with JSP, servlets, Java, and HTML, you''ll need some software
    to work with this book. The good news is that the software is available for free
    on the Internet. As it''s needed, you''ll see where to download the software for
    this book. We''re going to use Java, the Tomcat Web server, and Struts itself
    (including Struts 1.1 and early release versions of 1.2, as we will use the Validator
    and Tiles frameworks that now come with Struts). In Module 11, we''ll use the
    Eclipse Java Integrated Development Environment to make Struts development easier.


    All of this software is available for free; all you need to have to get it is
    a Web browser and connection to the Internet.


    # Where to Download the Code for this Book


    The code in this book is available for download on the McGraw-Hill/Osborne web
    site at www.osborne.com. All the code examples have been tested by both the author
    and the tech editor, using different machines. Installing the examples so you
    can use them with Tomcat is easy—a look at the readme.txt file that comes with
    the downloadable code.


    # Conventions Used in this Book


    There are some conventions used in this book that you should know about:


    +   - Terms that I wish to emphasize in text appear in boldface.

    - You find Notes and Tips filled with useful information.

    - When an example is being developed step by step, you''ll see the newly added
    section of code displayed in bold to distinguish it from what''s already there,
    like this:


    ```

    package ch03;

    public class DataAction extends Action {

    public ActionForward execute(ActionMapping mapping,

    ActionForm form,

    HttpServletRequest request,

    HttpServletResponse response)

    throws IOException, ServletException (

    ```'
