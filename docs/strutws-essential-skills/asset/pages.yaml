  md: "# 158 Module 6: The Struts <html> Tags.\n\nHis module is all about using the\
    \ Struts <html> custom JSP tags to create HTML elements in JSP pages. There are\
    \ many such tags in Struts, as shown in Table 6-1, and we're going to put many\
    \ of them to work in this module.\n\n| Tag Name | Does This |\n|---|---|\n base\
    \ | Creates an HTML <base> element |\n| button | Creates a Button Input field\
    \ |\n| cancel | Creates a Cancel button |\n| checkbox | Creates a Checkbox Input\
    \ field |\n| errors | Displays a set of error messages |\n| file | Creates a File\
    \ Select Input field |\n| form | Creates an Input form |\n| frame | Creates an\
    \ HTML frame element |\n| hidden | Creates a hidden field |\n| html | Creates\
    \ an HTML <html> element |\n| image | Creates an input tag of type \"image\" |\n\
    | img | Creates an HTML img tag |\n| javascript | Creates JavaScript validation\
    \ (on the rules loaded by the ValidatorPlugin) |\n| link | Creates an HTML anchor\
    \ or hyperlink |\n| messages | Displays a set of messages |\n| multibox | Creates\
    \ a Checkbox Input field |\n| option | Creates a Select option |\n| options |\
    \ Creates a collection of Select options |\n| optionsCollection | Creates a collection\
    \ of Select options |\n| password | Creates a Password Input field |\n| radio\
    \ | Creates a Radio Button Input field |\n| reset | Creates a Reset Button Input\
    \ field |\n| rewrite | Creates a URI |\n| select | Creates a select element |\n\
    | submit | Creates a Submit button |\n| text | Creates an input field of Type\
    \ text |\n| textarea | Creates a text area |\n| html | Creates HTML tags as XHTML\
    \ |\n\n**Table 6-1** The Struts <html> Tags"
