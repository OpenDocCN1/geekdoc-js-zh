  md: '# 194 Module 7: The Struts <logic> and <bean> Tags


    This module is all about using the Struts <logic> and <bean> custom JSP applications.
    We''ve already seen a few of these tags throughout the book, but there are many
    more to come. We''ll start with the <logic> tags.


    # <logic> Tags


    You can see the <logic> tags in Table 7-1, and we''re going to put them to work
    in this module. Most of them function as tests, conditionally including the contents
    of the <logic> element in the output. For example, you can use the <logic:equal>
    tag to check if a variable (such as a bean property) holds a particular value.
    If so, the body of the <logic:equal> element will be included in the document
    you''re sending to the browser, but if not, the body of the element will not be
    included. Others let you do things as loop over a collection of items, such as
    <logic:iterate>.


    | Tag Name | Description |

    |---|---|n| empty | Include the body content of this element if the indicated
    variable is either null or an empty string. |

    | equal | Include the body content of this element if the indicated variable is
    equal to the value you specify. |

    | forward | Forward control to the page specified by an ActionForward entry. |

    | greaterEqual | Include the body content of this element if the indicated variable
    is greater than equal to the value you specify. |

    | greaterThan | Include the body content of this element if the indicated variable
    is greater than the value you specify. |

    | iterate | Repeat the nested body content of this tag over a specified collection.
    |

    | lessEqual | Include the body content of this element if the indicated variable
    is greater than equal to the value you specify. |

    | lessThan | Include the body content of this element if the indicated variable
    is less than the value you specify. |

    | match | Include the body content of this element if the value you specify is
    an appropriate substring of the indicated variable. |

    | messagesNotPresent | Include the body content of this element if the specified
    message is not present in this request. |

    | messagesPresent | Include the body content of this element if the specified
    message is present in this request. |

    | notEmpty | Include the body content of this element if the indicated variable
    is neither null nor an empty string nor an empty java.util.Collection. |


    Table 7-1 The Struts <logic> Tags'
