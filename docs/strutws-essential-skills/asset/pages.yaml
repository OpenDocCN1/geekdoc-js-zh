  md: "# 142 Module 5: Using Actions\n\n```\npublic void setText(String text) {\n\
    \    this.text = text;\n}\n```\n\nIn this Struts application, we'll use an action\
    \ named ch05_04 and a Welcome page named ch05_03.jsp. Here's what the <action>\
    \ element for this action looks like (note that we're using org.apache.struts.actions.IncludeAction\
    \ as the type of action, which means we won't have to write the action ourselves):\n\
    \n```\n<action path=\"/org.apache.struts.actions.IncludeAction\" parameter=\"\
    /ch05_01.jsp\" scope=\"request\" name=\"ch05_02\" input=\"/ch05_03.jsp\">\n</action>\n\
    ```\n\nThe URL you use in the parameter attribute is the resource that will be\
    \ included by org.apache.struts.actions.IncludeAction; in this case, that's our\
    \ legacy code, ch05_01.jsp. Here's the Welcome page this Struts application uses,\
    \ ch05_03.jsp, asking the user to enter some text:\n\n```\n<% taglib uri=\"/tags/struts-bean\"\
    \ prefix=\"bean\" %>\n<% taglib uri=\"/tags/struts-html\" prefix=\"html\" %>\n\
    ```\n\n```\n<HTML>\n<HEAD>\n<TITLE>Using Include Actions</TITLE>\n</HEAD>\n<BODY>\n\
    <h1>Using Include Actions</h1>\n<html:form action=\"ch05_04.do\">\nEnter some\
    \ text\n<html:text property=\"text\"/>\n<html:submit value=\"Submit\"/>\n</html:form>\n\
    </BODY>\n</HTML>\n```\n\nThat completes the application. The Welcome page, ch05_03.jsp,\
    \ appears in Figure 5-1."
