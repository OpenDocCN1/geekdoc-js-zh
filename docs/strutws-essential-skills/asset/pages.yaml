  md: '# Module 1: Creating Web Applications


    Welcome to Struts, the dynamic application framework that''s taken the online
    Java community by storm. Java programming has been online for years with Java
    Pages (JSP) and servlets—in fact, as long as Java applets—but not until now, until
    Struts, it has been possible to create such powerful web applications. We''ve
    come far from the days of simple web pages that displayed a guestbook or online
    mail; today, web applications are being created that demand thousands of lines
    of code. To create extended applications like that, you need something more substantial
    than the hoc programming that was used to pass master. You need an application
    framework designed to host larger applications, and that framework is Struts.


    When you start developing web applications beyond the most basic, it helps to
    have a well-defined framework for your application. We are going to see how that
    works in this book. We''ll start in this module with an overview of Struts and
    then review the foundation that will be essential for the chapters where we put
    Struts to work. That foundation is built on three pillars of Java programming:
    JSP, JavaBeans, and Java servlets. We''ll get up to speed on all three topics
    in this module; this module is intended primarily to make sure we have the skills
    we need under our belt.


    If you already confident of your JSP/servlets skills, feel free to skip this module.
    On the other hand, if this module leaves you behind, it might be a good idea to
    take a look at JSP/servlets book before going on, we''ll need the foundation built
    in this module before pressing on. We''ll start with an overview of Struts itself.


    # All About Struts


    Take a look at Figure 1-1; that''s a Struts web application in detail to ensure
    you have a solid understanding of the structure of a Struts application is doing.
    For now, note what this web application is doing; it''s using HTML controls (check
