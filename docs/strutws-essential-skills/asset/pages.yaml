  md: "# 148 Module 5: Using Actions\n\nIn the Welcome page, ch05_07jsp, we'll set\
    \ up the <select> control that displays the actions that may be chosen and store\
    \ them in the action form's method property, like this:\n\n```\n<@ taglib uri=\"\
    /tags/struts-bean\" prefix=\"bean\" %>\n<@ taglib uri=\"/tags/struts-html\" prefix=\"\
    html\" %>\n\n<HTML>\n  <HEAD>\n    <TITLE>Select an action to dispatch</TITLE>\n\
    \  </HEAD>\n  <BODY>\n    <H1>Select an action to dispatch</H1>\n    <html:form\
    \ action=\"ch05_05.do\">\n      <html:select property=\"method\">\n        <html:option\
    \ value=\"red\">Red</html:option>\n        <html:option value=\"yellow\">Yellow</html:option>\n\
    \        <html:option value=\"green\">Green</html:option>\n      </html:select>\n\
    \      <BR>\n      <BR>\n      <BR>\n      <html:submit />\n    </html:form>\n\
    \  </BODY>\n</HTML>\n```\n\nStruts is able to determine method to call using the\
    \ method property. When the user selects the Green option, as shown in Figures\
