  md: '# Use the <logic:iterate> Tag


    The <logic:iterate> element repeats the body content of this tag for every element
    of a collection, which must be an Iterator (including ArrayList and Vector) a
    Collection, a Map (including HashMap, Hashtable, and TreeMap), or an array. You
    can see the significant attributes for these tags in Table 7-8.


    We''ve already seen this tag in Modules 3 and 6. In Module 6, we used it to iterate
    over properties like `multipleSelect`, which hold an array of strings corresponding
    to the choices the user made in a <select> control:


    ```

    <h2>The select control selections:</h2>

    <logic:iterate id="select1" name="ch06_03" property="multipleSelect">

    <%= select1 %>

    <BR>

    </logic:iterate>

    <BR>

    ```


    | Attribute Name | Description |

    |---|---|

    | collection | The collection to be iterated over. |

    | id | The name of a page scope containing the current element of the collection
    on each iteration. This attribute is required. |

    | indexid | The name of a page scope bean that will contain the current index
    of the collection on each iteration. |

    | length | The maximum number of entries to be iterated through this page. |

    | name | The name of the bean containing the collection to be iterated (if property
    is not specified), or the bean whose getter method returns the collection to be
    iterated (if property is specified). |

    | offset | The zero-relative index of the starting point at which entries the
    collection will be iterated. |

    | property | The name of the bean whose getter method returns the collection you
    want to use. |

    | scope | The bean scope (defaults to any scope). |

    | type | Java class name of the element to be exposed through the JSP bean named
    from the id attribute. |


    Table 7-8 The Struts <logic:iterate> Tag Attributes'
