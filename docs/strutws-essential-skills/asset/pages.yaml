- img_proc: true
  md: "# Module 8: Creating Custom Tags\n\nThat sets up the Welcome page and stores\
    \ the toppings we're going to display in a page\ncontext attribute. To connect\
    \ that page to the Java code, we'll need a .jsp file, ch08_08.jsp:\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<!DOCTYPE tag PUBLIC\n  \"//Sun Microsystems,\
    \ Inc//DTD JSP Tag Library 1.2//EN\"\n  \"http://java.sun.com/dtd/jsp-jstaglibrary_1_2.dtd\"\
    >\n<taglib>\n  <lib-version>1.0</lib-version>\n  <jsp-version>1.2</jsp-version>\n\
    \  <short-name>CustomTags</short-name>\n  <description>Example tags.</description>\n\
    \  <tag>\n    <name>iterator</name>\n    <tag-class>ch08.ch08_09</tag-class>\n\
    \  </tag>\n</taglib>\n```\n\nHow do you get access to the toppings in the Java\
    \ code? You can use the pageContext\nobject's getAttribute method to get the array\
    \ of toppings set in this project's Welcome page.\nWe'll do that as JSP in the\
    \ doStartTag\nmethod (note that this class is based on the TagSupport class, not\
    \ the IterationTag interface,\nbecause TagSupport already implements IterationTag):\n\
    \n```\npackage ch08;\n\nimport javax.servlet.jsp.*;\nimport javax.servlet.jsp.tagxtag.*;\n\
    \npublic class ch08_09 extends TagSupport {\n  private String[] toppings = null;\n\
    \n  public int doStartTag() {\n    toppings = (String[]) pageContext.getAttribute(\"\
    toppings\");\n    return EVAL_BODY_INCLUDE;\n  }\n}\n```\n\nPassing using page\
    \ context attributes like this is a lot easier than using attributes if\nyou've\
    \ got a number of values to pass. How do you actually display these multiple values\
    \ in\nthe Results web page? You can use the IterationTag's afterBody method, which"
  merge: -1
  pgno: 267
- img_proc: true
  md: "is called after the body has been evaluated (recall that the body of this element\
    \ displays the text Topping: in the web page each iteration).\n\nIn the doAfterBody\
    \ method, you can return the constant EVAL_BODY_AGAIN to make the body of the\
    \ element evaluated again. On the other hand, if you return the constant SKIP_BODY,\
    \ the JSP framework will no longer iterate over the body.\n\nTo iterate the correct\
    \ number of times, we'll create a counter named iterationCounter that will keep\
    \ track of iterations. Here's how that looks in doAfterBody:\n\n```\npackage ch08;\n\
    ```\n\n```\nimport javax.servlet.jsp.tagext.*;nimport javax.servlet.jsp.tagext.*;\n\
    ```\n\n```\npublic class ch08_09 extends TagSupport {\n    private int iterationCounter\
