  md: '# Module 6: The Struts &lt;html&gt; Tags


    CRITICAL SKILL


    # 6.10 Use the &lt;html:button&gt; Tag


    The &lt;html:button&gt; tag creates an HTML button with the &lt;button&gt; tag.
    Handling this control is a little different from the others in this module, because
    buttons do not store data in the same way text fields or areas do. Instead, buttons
    usually make some action happen, so they''re usually connected to JavaScript functions.
    The significant attributes of this tag appear in Table 6-13.


    Here''s how we create the button in this project—we''re going to use this button
    with a JavaScript function, so although we''ll assign a property to it (as is
    required), we won''t use that property:


    ```

    <h2>Buttons:</h2>

    <html:button onclick="clicker() value="Click Me" property="text"/>

    <br>

    ```


    Here''s the HTML created:


    ```

    <h2>Buttons:</h2>

    <input type="button" name="text" value="Click Me" onclick="clicker()"

    <br>

    ```


    | Attribute Name | Description |

    | --- | --- |

    | accesskey | The keyboard character used to transfer the focus to this element.
    |

    | alt | The alternate text for this element. |

    | altKey | The message resources key of the alternate text for this element. |

    | disabled | Set to true if this input field should be disabled. |

