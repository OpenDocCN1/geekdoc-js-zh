  md: "# <h1>Creating Cooperating Tags</h1>\n\n```\n<logic:notPresent name=\"toppings\"\
    >\n<ch08:createToppings/>\n</logic:notPresent>\n<ch08:iterator>\n  Topping:\n\
    </ch08:iterator>\n</BODY>\n</html>\n```\n\nWe'll take a look at one more custom\
    \ tag project in this module: creating scripting variables using custom tags.\n\
    \n# Use Custom Tags That Create Variables\n\n`<ch08:createToppings/>` element\
    \ creates a page attribute named toppings that holds the toppings array. You can\
    \ access that array in JSP code like, using the getAttribute method:\n\n```\n\
    <% taglib prefix=\"ch08\" uri=\"WEB-INF/ch08_11.tld %>\n<HTML>\n<HEAD>\n  <TITLE>Getting\
    \ the Toppings</TITLE>\n</HEAD>\n<BODY>\n  <H1>Getting the Toppings</H1>\n  <ch08:createToppings/>\n\
    \  <%n    String[] toppings = (String [])\n    pageContext.getAttribute(\"toppings\"\
    );\n\n    for (int loopIndex = 0; loopIndex < toppings.length; loopIndex++) {\n\
    \      out.println(\"Topping: \" + toppings[loopIndex] + \"<BR>\">\");\n    }\n\
    \  %>\n</BODY>\n</html>\n```\n\nThere's an easier way to do this. You can modify\
    \ the `ch08:createToppings` tag so that it'll create the toppings as a scripting\
    \ variable in JSP code directly, which means you can use that array in this ch08_13.jsp\
    \ (note that no getAttribute call is needed):\n\n```\n<% taglib prefix=\"ch08\"\
    \ uri=\"WEB-INF/ch08_15.tld %>\n<HTML>\n```"
