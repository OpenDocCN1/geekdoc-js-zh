  md: '# 34 Module 2: Struts Essentials


    This module puts Struts to work for us. We''ll get an overview of Struts in this
    module and write an example. The Struts learning curve is a steep one, and the
    skills discussed are all essential. We''ll start with an overview of the inspiration
    behind Struts: the Model-View-Controller architecture. Then we''ll get a skeleton
    Struts application working, and finally, we''ll implement a working, fleshed out
    Struts application.


    CRITICAL SKILL


    # 2.1 Use MVC Architecture


    In the previous module, we used servlets, JSPs, and JavaBeans, and you can build
    applications using these components. However, most such applications end up somewhat
    ad hoc, and as web applications grow larger and more involved, a better overall
    plan is needed. We''ll start this module with an overview of how the ad hoc application,
    called Model 1 Architecture works and moves on to Model 2.


    # Model 1 Architecture


    Small web applications are typically built using Model 1 programming architecture.
    In a Java-based Model 1 application, you might use a JSP that calls a few JavaBeans
    to implement the application''s logic. For example, you might present an online
    order form to the user and use JSPs to display items to the user and allow the
    user to search for additional items, move to new items, and so. You can also use
    beans to calculate prices with shipping and tax.


    In this case, the JSPs do everything but handle the actual logic used in the beans
    to calculate shipping costs and tax. That''s as far as it goes, where Java code
    and HTML are intermixed, JSPs don''t work well for extensive programming. Servlets
    are a better choice when it comes to straight Java programming, but they are not
    useful for displaying a user interface. So what''s the best way of creating larger
    applications—with JSPs, servlets, or JavaBeans? The answer is with all three.


    # Model 2 Architecture


    Model 2 architecture is very similar to what is called Model View Controller (MVC)
    architecture. Here, the controller (often a servlet) oversees the whole application,
    interacting with the user and calling code in the model (often JavaBeans) to handle
    the internal logic and business rules, and then sending the results to presentation
    code, the view (often JSPs), which displays data to the user. Here''s an overview
    of these three components:


    +   The model implements the functionality, such as “business rules” of the application.
    This is the core code that does the internal work, such as checking if an item
    is in stock,'
