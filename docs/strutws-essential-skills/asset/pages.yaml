  md: "# 122    Module 4: Working with Models and ActionForms\n\nTo set the value\
    \ of a property, we can call a DynaActionForm object's set method. Here's how\
    \ that works in this project's action, ch04_11.java, where we recover the text\
    \ user wants to capitalize, convert it to uppercase, store it in the action form\
    \ again, and forward to the Results page:\n\n```\npackage ch04;\n```\n\n```\n\
    import java.io.*;\nimport java.util.*;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\nimport javax.servlet.ServletExceptionException;\n\
    import org.apache.struts.action.*;\n```\n\n```\npublic class ch04_11 extends Action\
    \ {\n\n    public ActionForward execute(ActionMapping mapping,\nActionForm form,\n\
    HttpServletRequest request,\nHttpServletResponse response)\nthrows IOException,\
    \ ServletException {\n\n        DynaActionForm textForm = (DynaActionForm) form;\n\
    \n        String text = (String) textForm.get(\"text\");\n\n        textForm.set(\"\
    text\", text.toUpperCase());\n\n        return mapping.findForward(\"success\"\
    );\n\n}}\n```\n\nThat's all we need; now we can recover the value of the text\
    \ property in the Results page, ch04_13.jsp, and display that value:\n\n```\n\
    <@ taglib uri=\"/tags/struts-bean\" prefix=\"bean\" %>\n```\n\n```\n<HTML>\n<HEAD>\n\
    \    <TITLE>Here's the Result</TITLE>\n</HEAD>\n\nBODY>\n```"
