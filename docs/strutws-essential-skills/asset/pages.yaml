  md: "# Module 4: Working with ActionForms\n\n# Creating the Model\n\nIn Struts applications,\
    \ the code for the model is up to us; there's no Struts ActionModel class or anything\
    \ like that to base our model's class on. When writing the model, we just write\
    \ the utility methods we want to call. For example, the model in this project,\
    \ ch04_04.java, has a process method, which takes a string, capitalizes it, and\
    \ returns the result. Here's the code:\n\n```\npackage class ch04_04\n{\n    public\
    \ String process(String text)\n    {\n        return text.toUpperCase();\n   \
    \ }\n}\n```\n\nThat's all we need for the model in this project. After the model\
    \ capitalizes the text, that text is stored in the action form. The Results page\
    \ reads the newly capitalized text and displays it:\n\n```\n<@ taglib uri=\"/tags/struts-bean\"\
    \ prefix=\"bean\" %>\n\n<HTML>\n    <HEAD>\n        <TITLE>Here's the Result</TITLE>\n\
    \    </HEAD>\n\n    <BODY>\n        <h1>Here's the Result</h1>\n        <bean:message\
    \ key=\"tocaps\"/>\n        <bean:write name=\"ch04_03\" property=\"text\"/>\n\
    \    </BODY>\n</HTML>\n```\n\nNow when the user enters text to be capitalized,\
    \ that text is passed to the model, which does the work. The text is re-inserted\
    \ into the form bean and displayed in the Results page. Although this example\
    \ was a simple one because we don't need anything special to create a model in\
    \ a Struts application, it let us add a model to a Struts application."
