  md: "The action ch04_11 is connected to an action form named ch04_12 in the <action>\
    \ element:\n\n```\n<action path=\"/ch04_11\"\n    type=\"ch04.ch04_11\"\n    name=\"\
    ch04_12\"\n    input=\"/ch04_10.jsp\">\n    <forward name=\"success\" path=\"\
    /ch04_13.jsp\"/>\n</action>\n```\n\nSo how do we set up the action form to use\
    \ the DynaActionForm class? We do that by specifying the org.apache.struts.action.DynaActionForm\
    \ class as the type of our action form. Here's how that works in struts-config.xml\
    \ as we create the ch04_12 action form:\n\n```\n<form-bean\n    name=\"ch04_12\"\
    \n    type=\"org.apache.struts.action.DynaActionForm\">\n\n</form-bean>\n```\n\
    \nWe also include a <form-property> element for each property we want to recover\
    \ from the HTML form, which is the text property here:\n\n```\n<form-bean\n  \
    \  name=\"ch04_12\"\n    type=\"org.apache.struts.action.DynaActionForm\">\n \
    \   <form-property>\n        name=\"text\"\n        type=\"java.lang.String/>\n\
    </form-bean>\n```\n\nThat's all we need to create the action form. We use this\
    \ action form a little differently than we would use a Java-based object. When\
    \ the form is passed to the action, we cast it as a DynaActionForm object. Then\
    \ we use the get method to recover properties from it. For example, here's how\
    \ we'd recover the value of the text property:\n\n```\nDynaActionForm textForm\
