  md: "# 228 Module 8: Creating Custom Tags\n\nBut there is an easier way to do this\
    \ that doesn't involve specially editing web.xml: you can simply give the URL\
    \ of the .tld file directly in the <%@ taglib %>. Because this way is easier,\
    \ it's more commonly used than the technique that requires you to edit web.xml,\
    \ and that's what we'll do in this module:\n\n```\n<@ taglib prefix=\"ch08\" uri=\"\
    WEB-INF/ch08_02.tld\" %>\n```\n\nThis lets the server find the .tld file for the\
    \ custom tag <ch08:message>, which is ch08_02.tld. On the other hand, you still\
