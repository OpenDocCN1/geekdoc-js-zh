  md: 'n this module, we''re going to get control of Struts actions. The action is
    part of the controller in a Struts application, along with the action servlet.
    We''ve already seen actions at work, but there''s a lot more to story. We''re
    going to look not only at standard actions in this module, but also at other types
    available, such as ForwardAction, IncludeAction, DispatchAction, LookupDispatchAction,
    and SwitchAction. These are the customizable part of the controller in a Struts
    application. Writing them means you don''t have to subclass the action servlet
    to make your action do what you want. Instead, extend an action class as org.apache.struts.action.Action
    to create your own.


    Actions let you validate your data, extract data from an action form, and interact
    with business logic in the model, and forward results to the view. There are two
    components to actions: the <action> element in struts-config.xml and the Java
    class that supports the action in code. We''ll look at the <action> element first.


    # Use the <action> Element


    We''ve used the <action> element extensively already, here''s an example:


    ```

    <action path="ch04_02">

    type="ch04.ch04_02"

    name="ch04_03"

    <forward name="success" path="ch04_05.jsp"/>

    </action>

    ```


    You''ve gotten familiar with the <action> element''s attributes in this case,
    but there are some you haven''t seen yet. All the <action> element''s attributes
    appear in Table 5-1.


    For example, the <action> element''s scope attribute, which can be set to request
    session, indicates the scope Struts will find the action form for the action.
    If true (default), the validate attribute tells the action servlet to call the
    action''s validate method before passing data on to the action:


    ```

    <action

    path="ch05_02"

    type="ch05.ch05_02"

    name="ch05_03"

    validate="true"

    </action>

    ```'
