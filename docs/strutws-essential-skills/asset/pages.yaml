    </global-forwards>\n```\n\nIn other words, the browser will navigate to Welcome.do,\
    \ which the action servlet will interpret as a request for the welcome action.\
    \ That action is defined in struts-config.xml\n\n```\n<action-mappings>\n<action\n\
