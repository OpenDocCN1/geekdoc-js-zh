  md: "# 300 Module 10: The Tiles Framework\n\nthis is similar to the previous project,\
    \ where we created a definition in a JSP page, but this time you can omit the\
    \ **tiles**: prefix:\n\n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n\
    \n<!DOCTYPE tiles-definitions PUBLIC\n  \"//Apache Software Foundation//DTD Tiles\
    \ Configuration 1.1//EN\"\n  \"http://jakarta.apache.org/struts/dtds/tiles-config_1_1.dtd\"\
    >\n\n<tiles-definitions>\n  <definition name=\"tilesDefinition\" template=\"Layout.jsp\"\
    >\n    <put name=\"title\" value=\"Using Definitions\" />\n    <put name=\"header\"\
    \ value=\"header.jsp\" />\n    <put name=\"footer\" value=\"footer.jsp\" />\n\
    \    <put name=\"menu\" value=\"menu.jsp\" />\n    <put name=\"body\" value=\"\
    body.jsp\" />\n  </definition>\n</tiles-definitions>\n```\n\nNow we've created\
    \ this new definition, **tilesDefinition**, we can refer to it in JSP files. Here's\
    \ how that works in ch10_04.jsp, where we're putting this definition to work with\
    \ the **<tiles:insert>** element:\n<%@ taglib uri=\"WEB-INF/struts-tiles.tld\"\
    \ prefix=\"tiles\" %>\n<tiles:insert definition=\"tilesDefinition\" flush=\"true\"\
    \ />\n\nThe results in this project are just the same as you see in our first\
    \ project in this module, which appears in Figure 10-1.\n\n# Progress Check\n\n\
    +   1. What property do you set in struts-config.xml to connect a Tiles XML definition\
    \ document to the Tiles plug-in?\n2. What XML element do you place <definition>\
    \ elements inside of a Tiles XML document?\n\nYou can do more with definitions:\
    \ you can overload them as well.\n\n+   1. definitions-config\n2. <tiles-definitions>"
