  md: "# 314 Module 11: Using Eclipse with Struts\n\n# CRITICAL SKILL 11.1 Download\
    \ and Install Eclipse\n\nGetting your own copy of Eclipse is not hard. It's available\
    \ for free—just go to www.eclipse.org/downloads and select one of the download\
    \ mirrors available on that page. You'll be presented with a list of the available\
    \ downloads of types:\n\n+   - Release builds These versions are for general use.\
    \ Most often, when you download Eclipse, you'll use one of the release versions.\
    \ These builds have been well tested, and the chance of coming across serious\
    \ bugs is minimal.\n- Stable builds These versions are like beta versions. A stable\
    \ build is a step along the way towards a release version. It's considered relatively\
    \ stable, but there may be problems. New features are often available here.\n\
    - Integration builds These versions consist of components that have been tested,\
    \ and their operation may still have some problems. If things work out, an integration\
    \ build may be elevated to a stable version.\n- Nightly builds These are the most\
    \ experimental of all available Eclipse versions. They're created nightly, without\
    \ any guarantee that things will work as you expect. Experience with these builds\
    \ indicates that they can have serious problems.\n\nSelect the most recent release\
    \ version of Eclipse for your operating system and click the link to download\
    \ it.\n\nTo install Eclipse, just unzip or untar it depending on what operating\
    \ system you have, and you'll find an executable file, ready to run. You start\
    \ Eclipse by running the executable, such as eclipse.exe. When you start it the\
    \ first time, it may ask you to wait until it completes the installation, which\
    \ does not take long (Eclipse is creating the workspace directories it'll be using).\
    \ Note that Eclipse is Java-based, so you have to have Java on your machine to\
    \ run it.\n\n![](img/ddb251719fa14da343089d5b1e93d441_341_0.png)\n\n# Progress\
    \ Check\n\n+   1. What versions of Eclipse are the most ready for general use?\n\
    \n+   2. What versions of Eclipse are the most experimental?\n\nBefore working\
    \ with Eclipse, you have to understand how it creates Java projects. \n\n+   1.\
    \ Release builds\n2. Nightly builds"
