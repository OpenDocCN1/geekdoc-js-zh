  md: "# Display Errors\n\nAt this point, we've seen how to connect validation rules\
    \ to the contents of various Welcome page fields. So how do we display a list\
    \ of errors in the Welcome page if there's been a problem?\n\nError text is handled\
    \ as messages with the Validator framework. That means we can use the Struts `<logic:messagesPresent>`\
    \ tag in the Welcome page to see if any messages are present. If so, we'll display\
    \ the header text for the list of errors, setting up the error list with a `<ul>`\
    \ unordered list:\n\n```\n<logic:messagesPresent>\n  <bean:message key=\"errors.header/>\n\
    \  <ul>\n```\n\nWe recover the various possible errors one by one. For example,\
    \ to recover and display the error for the byte field, if there is an error, use\
    \ these elements:\n\n```\n<html:messages id=\"error\" property=\"byte\">\n  <bean:write\
    \ name=\"error\"/></li>\n</html:messages>\n```\n\nHere's what you should add to\
    \ the Welcome page to display the list of errors returned by the Validator framework.\
    \ The `<html:form>` element that holds the controls that appear in the Welcome\
    \ page follows this:\n\n```\n<@ taglib uri=\"WEB-INF/struts-bean.tld\" prefix=\"\
    bean\" %>\n<%@ taglib uri=\"WEB-INF/struts-html.tld\" prefix=\"html\" %>\n<%@\
    \ taglib uri=\"WEB-INF/struts-logic.tld\" prefix=\"logic\" %>\n\n<html:html>\n\
    <head>\n  <title>Using the Struts Validator</title>\n</html:base/>\n\n<body>\n\
    \  <h1>Using the Struts Validator</h1>\n\n<logic:messagesPresent>\n  <bean:message\
    \ key=\"errors.header\"/>\n```"
  merge: -1
