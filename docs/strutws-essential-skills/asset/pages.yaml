    \ how does it actually send that data? Data will vary for each web application,\
    \ it's not easy to set things up so that a few values are always passed to the\
    \ action.\n\nStruts is designed so that the action servlet sends data to an action\
    \ using a JavaBean object. You write that bean object, an ActionForm object, to\
    \ have a read/write property for every piece of data in the HTML form. For example,\
    \ if you had an HTML text field named text in your HTML form, the corresponding\
    \ bean would have a property named setText the action servlet calls to store the\
    \ text from the text field. The action servlet passes that bean to the action,\
    \ which can call the bean's getText method to recover that data.\n\nHere's how\
    \ using passing data on to an action in the <action> element's name attribute\
    \ inside the <action-mappings> element. For example, we might make that name dataForm:action-mappings\n\
    \n```\n<action-mappings>\n<action\n    path=\"/Data\"\n    type=\"ch02.DataAction\"\
    \n    name=\"dataForm\"\n    input=\"/index.jsp\">\n</action>\n</action-mappings>\n\
