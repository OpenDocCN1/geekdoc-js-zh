  md: '# Use the <logic:lessEqual> and <logic:lessThan> Tags


    <logic:lessEqual> and <logic:lessThan> tags also perform comparisons, as their
    names indicate. The body of the <logic:lessEqual> element is included in the output
    if the variable you''re comparing is less than equal to a constant value, and
    the body of the <logic:lessThan> element is included if the value you''re comparing
    is less than the constant value. You can see the significant attributes for these
    tags in Table 7-5.


    In the project for this module, we''ll compare the value user entered, 6 in this
    case, to the positive integer 8 using these two tags, like this:


    ```

    <h2>Using &lt;logic:lessEqual name="ch07_03" property="number" value="8">

    <logic:lessEqual name="ch07_03" property="number" value="8">

    Results: Less than or equal

    </logic:lessEqual>

    <BR>

    ```


    ```

    <h2>Using &lt;logic:lessThan name="ch07_03" property="number" value="&8&gt;"</h2>

    <logic:lessThan name="ch07_03" property="number" value="8">

    Results: Less than

    </logic:lessThan>

    <BR>

    ```


    You can see the results in Figure 7-3, where we discover that 6 is indeed less
    8.


    | Attribute Name | Description |

    |---|---|n| cookie | The cookie value you want to compare. |

    | header | The header value you want to compare (in this case, the comparison
    is case-insensitive). |

    | name | If property is not used, this bean is the variable to be compared. If
    you use property, this is the bean property you''re comparing. |

    | parameter | The variable to be compared is the value of the request parameter
    specified by this attribute (or the first value if there are multiple values).
    |

    | property | The property of a bean to compare. |

    | scope | The bean scope (defaults to any scope). |

    | value | The constant value to which the variable will be compared. This attribute
    is required. |


    Table 7-5 The Struts <logic:lessEqual> and <logic:lessThan> Tag Attributes'
