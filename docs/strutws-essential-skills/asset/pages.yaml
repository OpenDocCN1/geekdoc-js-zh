  md: "Another common task for action forms is to validate data. We've been letting\
    \ the action do that far, but it often makes more sense for the action form, which\
    \ is in charge of holding that data, to check the user's data instead.\n\n# Validating\
    \ Data with the Action Form\n\nUp to now, we've validated the data user entered\
    \ in the action forms ourselves. If there were errors, we saved them and forwarded\
    \ them on to the input page (which we've been setting to the Welcome page in the\
    \ action mapping):\n\n```\nString text = textForm.getText();\n\nif(text.trim().equals(\"\
    \")) {\n    actionerrors.add(ActionErrors.GLOBAL_ERROR, new\n    ActionError(\"\
    error.notext\"));\n}\n\nif(actionerrors.size() != 0) {\n    saveErrors(request,\
    \ actionerrors);\n    return new ActionForward(mapping.getInput());\n}\n```\n\n\
    However, action forms are also set up to handle this task, and we don't need to\
    \ perform any explicit forwarding ourselves if we let our action form validate\
    \ our data. To implement validation in our action form, override the validate\
    \ method. The action servlet will call our action form's validate method, and\
    \ if there are errors, it'll display them in our input page automatically (if\
    \ we used <html:errors/> Struts element)—the action isn't ever called. Here's\
    \ how to set up this method. It's passed the action mapping and the request object\
    \ and returns an ActionErrors collection (ActionMessages in Struts 1.2):\n\n```\n\
    public ActionErrors validate(ActionMapping mapping, HttpServletRequest\n    request)\n\
    {\n\n```"
