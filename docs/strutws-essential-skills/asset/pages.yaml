  md: "# 296 Module 10: The Tiles Framework\n\n| Attribute Name | Description |\n\
    |---|---|\n| beanName | Name of the bean used as the value. |\n| beanProperty\
    \ | Bean property name. |\n| beanScope | Scope that searched for the bean. |\n\
    | content | The element value; can be a string or an object. Same as **value**.\
    \ |\n| direct | If *true*, content is printed directly; if *false* (the default),\
    \ content is included. |\n| role | If the user is in the specified region, the\
    \ tag is taken into account; otherwise, the tag is ignored. |\n| type | Content\
    \ type (set: *string, page, template,* or instance). |\n| value | The element\
    \ value; can be a string or object. |\n\n**Table 10-4** The <tiles:add> Attributes\n\
    \nWhen we know how many columns there are, we can loop over each column in JSP\
    \ code, inserting each it in the Results page. When we loop over each column of\
    \ tiles, we'll use a new layout, internalLayout.jsp, to lay out each column, this\
    \ like in columnsLayout.jsp:\n\n```\n<% page import=\"org.apache.struts.tiles.ComponentContext\"\
    \ %>\n<%@ taglib uri=\"WEB-INF/struts-tiles.tld\" prefix=\"tiles\" %>\n\n<tiles:useAttribute\
    \ id=\"numberColumnsString\" name=\"numberColumns\" className=\"java.lang.String\"\
    \ />\n\n<table>\n<tr>\n<%-- \nint number = Integer.parseInt(numberColumnsString);\n\
    ComponentContext context = ComponentContext.getContext(request);\nfor (int intLoopIndex\
    \ = 0; intLoopIndex < number; intLoopIndex++) {\njava.util.List listObject = \n\
    (java.util.List)context.getAttribute(\"itemList\" + \nintLoopIndex);\npageContext.setAttribute(\"\
    list\", listObject);\n}\n%>\n<td>\n<tiles:insert page=\"internalLayout.jsp\" flush=\"\
    true\">\n<tiles:put name=\"itemList\" beanName=\"list\" beanScope=\"page\" />\n\
    </tiles:insert>\n</td>\n<%-- %>\n</tr>\n</table>\n```"
