  md: '# Module 9: The Struts Validator Framework


    Up to this point, we''ve been handling user-data validation ourselves by writing
    customized code in either the action or form code. That means we''ve been responsible
    for reading form properties and validating data ourselves.


    However, there''s another mechanism that Struts offers to perform validation:
    the Validator framework. This mechanism is about seeing that framework at work.
    There are all kinds of built-in validation rules in this framework, and once you
    connect your data to it, it''ll handle your data validation automatically.


    We''ll start with the application in Figure 9-1. This application lets us enter
    various values of various data types, as shown in the figure.


    When you click the Submit button, the data entered is displayed in the application''s
    Results page, as shown in Figure 9-2. We''re going to implement data validation
    using this project and all the data types shown in the figure.


    ![](img/ddb251719fa14da343089d5b1e93d441_281_0.png)'
