  md: "# 26 Module 1: Creating Web Applications.........................\n\nThere's\
    \ one more step, however; we should still register the new servlet with Tomcat\
    \ in a file named web.xml file, the deployment descriptor. This XML document goes\
    \ into the ch01/WEB-INF directory, and it tells Tomcat to look for the servlet's\
    \ code when needed. This document begins with a standard heading and a <web-app>\
    \ element, which we will start to create a web application.\n\nIn our web application,\
    \ we will start by registering the ch01_08 servlet with a <servlet>\n\n```\nelement:\n\
    n?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<!DOCTYPE app PUBLIC \"-//Sun\
    \ Microsystems, Inc.////DTD Web Application 2.3//EN\"\n     \"http://java.sun.com/dtd/web_app_2_3.dtd\"\
    >\n<web-app>\n  <servlet>\n    <servlet-name>ch01_08</servlet-name>\n    <servlet-class>ch01_08</servlet-class>\n\
    \  </servlet>\n</web-app>\n```\n\nThis ties the selector to the ch01_08.class\
    \ file. We also map the URL pattern ch01_08 to this servlet so the server knows\
    \ when we want use ch01_08 in an URL. You can do that with a <servlet-mapping>\
    \ element this way:\n\n```\n?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<!DOCTYPE\
    \ app PUBLIC \"-//Sun Microsystems, Inc.////DTD Web Application 2.3//EN\"\n  \
    \   \"http://java.sun.com/dtd/web_app_2_3.dtd\">\n<web-app>\n  <servlet>\n   \
    \ <servlet-name>ch01_08</servlet-name>\n    <servlet-class>ch01_08</servlet-class>\n\
    \  </servlet>\n\n  <servlet-mapping>\n    <servlet-name>ch01_08</servlet-name>\n\
    \    <url-pattern>/ch01_08</url-pattern>\n  </servlet-mapping>\n</web-app>\n```\n\
    \nThat's it; web.xml is complete. Now, place web.xml into webapps/ch01/WEB-INF,\
