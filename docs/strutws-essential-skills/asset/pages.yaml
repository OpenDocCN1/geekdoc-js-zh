  md: "# Module 4: Working with Models and Actions\n\nNote that we can send request\
    \ objects or even the entire servlet context and all its attributes (the method\
    \ getServletContext to get the servlet context) to the model well. In modern web\
    \ applications, the model itself can be very involved, acting as a middle tier\
    \ for a database application, perhaps connecting to remote data on other servers.\
    \ Separating the rest of the code so it can do its thing without overlapping the\
    \ rest of the application's code is good programming practice.\n\nCRITICAL SKILL\n\
    \n# 4 Work with Action Forms\n\nWe've used action forms to get our code working\
    \ already, but there's more to discuss, starting with the question of why action\
    \ forms exist at all—why aren't they just simple beans that hold the data as passed\
    \ to us from an HTML form?\n\nThere are a number of answers to this question.\
    \ First, action forms are not just transfer data back and forth between the browser\
    \ and Struts actions. When the data the user entered into an HTML form is passed\
    \ to the action servlet, that data is stored in the action form and passed to\
    \ an action. If, however, we use checkboxes in the HTML form and leave one or\
    \ more unchecked, the browser won't send any data back for the unchecked checkboxes,\
    \ which means that a faithful representation of what the browser sends us in a\
    \ bean would omit anything for those check boxes. The action servlet, however,\
    \ does better than that, setting the properties corresponding to the unchecked\
    \ checkboxes to false.\n\nThere's also validate method built into action forms\
    \ that the action servlet will call automatically to check the data sent from\
    \ the browser. If it doesn't validate, the action servlet loads the requisite\
    \ error messages and sends them back to the user.\n\nIn addition, the data back\
    \ from the browser is simply in string form because it's using the HTTP protocol.\
    \ The action servlet does somewhat better than that: it can assign both String\
    \ and Boolean values to action form properties. We can also add methods to the\
    \ action form to convert properties to other types strings and Booleans ourselves.\n\
    \nFor example, if the user entered in the previous project is an integer, we can\
    \ use the action form as a type converter to get and set value in numerical format.\
    \ Here's what that looks like, when we are gettingNumber and setNumber properties\
    \ to the action form:\n\n```\npackage org.apache.struts.action.ActionForm;\n\n\
    public class ch04_03 extends ActionForm {\n\n    private String text = \"\"\n\n\
    \    public String getText()\n```"
