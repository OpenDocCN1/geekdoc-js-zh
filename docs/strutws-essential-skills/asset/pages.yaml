  md: "# 248 Module 8: Creating Custom Tags\n\n```\n<HEAD>\n<TITLE>Custom Tags and\
    \ Variables</TITLE>\n</HEAD>\n<BODY>\n<h1>Custom Tags and Variables</h1>\n<ch08:createToppings/>\n\
    %\nfor(int loop = 0; loop < toppings.length; loop++)\n{\n    out.println(\"*Topping:\
    \ \" + toppings[loop] + \"<BR>\");\n}\\%\n</BODY>\n</html>\n```\n\nScripting variables\
    \ make it easy to send data from custom tags to JSP code and without the use of\
    \ pageContext attributes. To support a scripting variable, use the <variable>\
    \ element in a .tld file. The <variable> element supports the child elements you\
    \ see in Table 8-6. Note that you need to use at least the <name-given> element\
    \ or the <name-from-attribute> element.\n\n| Element | Does This |\n| --- | ---\
    \ |\n| <declare> | Specifies if the variable refers to a new object. Set to true\
    \ (default) or false. |\n| <name-from-attribute> | Sets the name of an attribute\
    \ whose value will give the name of the variable. |\n| <name-given> | Gives a\
    \ variable name. |\n| <scope> | Specifies the scope of the scripting variable:\
    \ AT_BEGIN means start tag to end of page, AT_END means end tag to end of page,\
    \ NESTED means between start tag and end tag. NESTED is the default. |\n| <variable-class>\
    \ | Specifies the name of the class of the variable. The default is java.lang.String.\
    \ |\n\n# Table 8-6 Child Elements of the <variable> Element"
  merge: -1
  pgno: 275
