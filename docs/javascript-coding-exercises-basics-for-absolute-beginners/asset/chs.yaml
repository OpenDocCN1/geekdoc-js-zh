  </head>\n<body>\n</body>\n</html>\n```\n\n### JavaScript 代码\n```javascript\nfunction\
  \ start_spec_str(str)\n{\n  if (str.length < 4) {\n    return false;\n  }\n  front\
  \ = str.substring(0, 4);\n  if (front == 'Java') {\n    return true;\n  }\n  else\
  \ {\n    return false;\n  }\n}\nconsole.log(start_spec_str(\"JavaScript\"));\nconsole.log(start_spec_str(\"\
  Java\"));\nconsole.log(start_spec_str(\"Python\"));\n```\n\n### 输出:\ntrue\ntrue\n\
  false\n\n## 查找最 100 的值\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
