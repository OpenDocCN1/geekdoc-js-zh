  \ 代码\n```javascript\nfunction near_100(x, y) {\n  if (x != y) {\n    x1 = Math.abs(x\
  \ - 100);\n    y1 = Math.abs(y - 100);\n    if (x1 < y1) {\n      return x;\n  \
