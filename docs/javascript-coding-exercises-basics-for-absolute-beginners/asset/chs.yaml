  ```\n\n### 输出\n2,4\n\n## JavaScript: 获取数据类型\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\" />\n<title>检测 JavaScript 数据类型</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n### JavaScript 代码\n```javascript\nfunction\
  \ detect_data_type(value)\n{\n  var dtypes = [Function, RegExp, Number, String,\
  \ Boolean, Object], x, len;\n  if (typeof value === \"object\" || typeof value ===\
  \ \"function\") {\n    for (x = 0, len = dtypes.length; x < len; x++) {\n      if\
  \ (value instanceof dtypes[x]) {\n        return dtypes[x];\n      }\n    }\n  }\n\
  \  return typeof value;\n}\nconsole.log(detect_data_type(12));\nconsole.log(detect_data_type('w3resource'));\n\
  console.log(detect_data_type(false));\n```\n\n### 输出\nnumber\nstring\nBoolean\n\n\
