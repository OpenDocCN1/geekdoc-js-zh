  \n### 输出:\ntrue\ntrue\nfalse\nfalse\n\n## 闰年检查\n\n### HTML 代码\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<meta charset=\"utf-8\" />\n<title>查找闰年</title>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n### JavaScript 代码\n```javascript\nfunction leapyear(year)\n\
  {\n  return (year % 100 === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\nconsole.log(leapyear(2016));\n\
  console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
  console.log(leapyear(100));\n```\n\n### 输出\ntrue\ntrue\nfalse\nfalse\nfalse\n\n\
  ## 字符串以 'Java' 开头 - 检查\n\n### 否则为 false\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
