  Python\"))`\n\n### 输出：\ntrue\ntrue\nfalse\n\n## 温度转换\n\n![](img/image00077.jpeg)\n\
  \n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
