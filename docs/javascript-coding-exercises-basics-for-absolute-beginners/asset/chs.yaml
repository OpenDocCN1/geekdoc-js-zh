  \ Development Tutorial'));\n```\n### 输出\n```\nDevelopment\n```\n\n---\n\n## 检查数字是否为质数\n\
  \n![](img/image0066.jpeg)\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
