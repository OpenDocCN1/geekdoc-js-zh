  ```\n### 输出\n```\navarip\nJ\nH\n```\n\n---\n\n## 第一个非重复字符\n\n### HTML 代码\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>查找第一个重复的字符</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n![](img/image0063.jpeg)\n\n### JAVASCRIPT\
  \ 代码\n```javascript\nfunction find_FirstRepeatedChar(str) {\n  var arra1 = str.split('');\n\
  \  var result = '';\n  var ctr = 0;\n  for (var x = 0; x < arra1.length; x++) {\n\
  \    ctr = 0;\n    for (var y = 0; y < arra1.length; y++) {\n      if (arra1[x]\
  \ === arra1[y]) {\n        ctr += 1;\n      }\n    }\n    if (ctr < 2) {\n     \
  \ result = arra1[x];\n      break;\n    }\n  }\n  return result;\n}\nconsole.log(find_FirstRepeatedChar('abacdd'));\n\
  ```\n### 输出\n```\ne\n```\n\n---\n\n## 统计字符串中的元音数量\n\n![](img/image0064.jpeg)\n\n\
