  ![](img/image0065.jpeg)\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <title>查找字符串中的最长单词</title>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction find_longest_word(str)\
  \ {\n  var array1 = str.match(/\\w[a-z]{0,}/gi);\n  var result = array1[0];\n  for(var\
