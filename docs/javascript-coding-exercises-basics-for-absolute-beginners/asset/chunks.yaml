    \ and division\n- String starts with 'Java' - Check\n- Convert temperatures\n\n\
    ---\n\n# Hours and minutes\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n</head>\n<body>\n</body>\n</html>\n```\n![](Images/image00058.jpeg)\n\n###\
    \ JAVASCRIPT CODE\n```javascript\nfunction time_convert(num)\n{\n  var hours =\
    \ Math.floor(num / 60); \n  var minutes = num % 60;\n  return hours + \":\" +\
    \ minutes;      \n}\nconsole.log(time_convert(71));\nconsole.log(time_convert(450));\n\
    console.log(time_convert(1441));\n```\n\n### OUTPUT\n```\n1:11\n7:30\n24:1\n```\n\
    \n---\n\n# Count vowels\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>JavaScript program to count the number of vowels in a given string.</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n```javascript\n\
    function vowel_Count(str)\n{\n  return str.replace(/[^aeiou]/g, \"\").length;\n\
    }\nconsole.log(vowel_Count(\"Python\"));\nconsole.log(vowel_Count(\"html.com\"\
    ));\n```\n### Output\n```\n1\n5\n```\n\n---\n\n# Capitalize The First Letter Of\
    \ Each Word Of Given String\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n</head>\n<body>\n</body>\n</html>\n```\n![](Images/image0059.jpeg)\n\n### JAVASCRIPT\
    \ CODE\n```javascript\nfunction capital_letter(str)\n{\n  str = str.split(\" \"\
    );\n  for (var i = 0, x = str.length; i < x; i++) {\n    str[i] = str[i][0].toUpperCase()\
    \ + str[i].substr(1);\n  }\n  return str.join(\" \");\n}\n```\n### OUTPUT\n![](Images/image0060.jpeg)\
    \ (Images/image0061.jpeg)\n\n---\n\n# Concatenate two strings Except their first\
    \ character\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
    \ charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>JavaScript program to concatenate strings except their first character.</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n```javascript\n\
    function concatenate(str1, str2) {\n  str1 = str1.substring(1, str1.length);\n\
    \  str2 = str2.substring(1, str2.length);\n  return str1 + str2;\n}\nconsole.log(concatenate(\"\
    PHP\",\"JS\"));\nconsole.log(concatenate(\"A\",\"B\"));\nconsole.log(concatenate(\"\
    AA\",\"BB\"));\n```\n### Output\n```\nHPS\nAB\nAB\n```\n\n---\n\n# Create a new\
    \ string\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
    utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\">\n</head>\n\
    <body>\n</body>\n</html>\n```\n![](Images/image0062.jpeg)\n\n### JAVASCRIPT CODE\n\
    ```javascript\nfunction without_first_end(str) {\n  return str.substring(1, str.length\
    \ - 1);\n}\nconsole.log(without_first_end('JavaScript'));\nconsole.log(without_first_end('JS'));\n\
    console.log(without_first_end('PHP'));\n```\n### Output\n```\navarip\nJ\nH\n```\n\
    \n---\n\n# First not repeated character\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>find the first repeated character.</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n![](Images/image0063.jpeg)\n\n### JAVASCRIPT\
    \ CODE\n```javascript\nfunction find_FirstRepeatedChar(str) {\n  var arra1 = str.split('');\n\
    \  var result = '';\n  var ctr = 0;\n  for (var x = 0; x < arra1.length; x++)\
    \ {\n    ctr = 0;\n    for (var y = 0; y < arra1.length; y++) {\n      if (arra1[x]\
    \ === arra1[y]) {\n        ctr += 1;\n      }\n    }\n    if (ctr < 2) {\n   \
    \   result = arra1[x];\n      break;\n    }\n  }\n  return result;\n}\nconsole.log(find_FirstRepeatedChar('abacdd'));\n\
    ```\n### OUTPUT\n```\ne\n```\n\n---\n\n# Counts the number of vowels within a\
    \ string\n\n![](Images/image0064.jpeg)\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Counts the number of vowels\
    \ within a string</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
    \ CODE\n```javascript\nfunction vowel_count(str1) {\n  var vowel_list = 'aeiouAEU';\n\
    \  var vcount = 0;\n  for (var x = 0; x < str1.length; x++) {\n    if (vowel_list.indexOf(str1[x])\
    \ !== -1) {\n      vcount += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"\
    The quick brown fox\"));\n```\n### OUTPUT\n```\n5\n```\n\n---\n\n# Find the longest\
    \ word within a string\n\n![](Images/image0065.jpeg)\n\n### HTML CODE\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Find the\
    \ longest word within a string</title>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \n### JAVASCRIPT CODE\n```javascript\nfunction find_longest_word(str) {\n  var\
