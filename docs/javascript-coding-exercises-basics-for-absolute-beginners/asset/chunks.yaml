    \ FOR ABSOLUTE BEGINNERS\n### GUIDE FOR EXAMS AND INTERVIEWS\n**J NEWMAN**\n\n\
    **Table of Contents**\n- Hours and minutes\n- Count vowels\n- Capitalize The First\
