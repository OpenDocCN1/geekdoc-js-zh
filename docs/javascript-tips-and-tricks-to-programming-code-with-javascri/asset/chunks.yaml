    Although Nw.js broke into the scene much earlier and is considered older, it looks
    like Electron is growing at an explosive rate, while nw.js is growing at a monotonous
    linear rate.


    ![nw.js vs electron](d2d_images/image005.png)


    While Electron is pretty new, it is used by several established organizations
    like Slack, Microsoft (Visual Studio Code), WordPress, and Sencha. But with the
    ease of use that Electron’s has, the network and community grew very fast. This
    wave of popularity is very likely to go on into 2017, thus enabling Electron to
    become the framework of choice for desktop and web app development.


    ## Mobile App Framework Showdown: React Native vs. Ionic


    When Reactive Native came out, it was predicted that it would take over and charts
    the course of mobile development with web technologies since it can be used to
    develop cross-platform apps natively. So is 2017 the year of React Native? There
    might be some expectations to that through this graph:


    ![react native vs ionic](d2d_images/image008.png)


    At this moment, React Native has not yet released any updated software as it is
    still at version `0.26`. Whether or not it will become mainstream in 2017 depends
    largely on developer’s patience to deal with app-development changes that needs
    refactoring the whole codebase together with other issues.


    Therefore, let’s take a look at the approximate npm downloads of React Native
    vs Ionic:


    ![react native vs ionic](d2d_images/image021.png)


    From the graph, it seems that React Native is on track to overtake ionic as the
    framework of choice for cross-platform mobile development using web technologies.


    In terms of the job market, React Native is also becoming more in-demand than
    Ionic:


    [![react native vs ionic](d2d_images/image010.png)](http://www.indeed.com/jobtrends/q-react-native-q-ionic.html)


    A quick search on job postings, show that at least 75 job postings are looking
    for developers with ionic skills whereas 65 job postings are looking for developers
    with React skills. This shows that there is an increasing surge of the familiarity
    with React Native that will most likely be a huge push to any up and coming developers
    going forward 2017.


    ## The Future of Web API: GraphQL vs REST


    Soon after Facebook mentioned that they were open-sourcing GraphQL, plenty of
    JavaScript developers jumped onto the hype train earlier on in 2016, especially
    since Facebook turned into the Apple of JavaScript when it came to open source
    projects.


    ![graphql](d2d_images/image018.png)


    GraphQL was aiming to sort of replace REST APIs, but considering how ubiquitous
    REST APIs are, this is an unlikely scenario:


    ![rest vs graphql](d2d_images/image006.png)


    GraphQL would do well with REST APIs, but it will definitely not replace REST
    as some developers thought it would have. Even more to do with this is that GraphQL
    is relatively new and linked with Facebook Relay, so there aren’t any learning
    resources or best practices for programmers and developers to pick the skill up
    elsewhere. With that said, 2017 is still too early for GraphQL to be going mainstream
    despite the strong hype it has now.


    ## JavaScript Trends Conclusion


    In conclusion, the community of JavaScript moves and changes at a fast pace, keeping
    up with any upcoming trends and in line with mainstream technology which means
    more support, relevance, and resources. Based on the trends discussed in this
    chapter, JavaScript developers should equip themselves with Redux & React and
    also with other familiar functional programming such as `TypeScript`. Not only
    that, having experience with React Native and Electron will definitely give upcoming
    programmers a lot more push and credibility in a job search.


