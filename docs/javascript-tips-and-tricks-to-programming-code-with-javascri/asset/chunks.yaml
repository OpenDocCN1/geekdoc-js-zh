    Meteor 没能取得主流成功的原因是随着时间推移不断出现的隐藏复杂性，特别是在涉及生产环境时。Meteor 尽管募集了大量资金，但它并没有像 `React`
    和 `AngularJS` 那样拥有庞大工程师团队领先科技企业支持。尽管 `AngularJS` 有很多问题，但它有 Google 支撑；相比之下，Meteor
    被认为一种投资风险，因为它是一个兼顾后端和前端开发的框架。为了充分利用部署的便利性，Meteor 还需要进行托管。


    目前 Meteor 不理想的另一点是，许多开发者并不喜欢 `MongoDB`，而 Mongo 正恰是 Meteor 的默认数据库。在 2017 年，Meteor
    可能仍然仅仅是一个不错的选择，因为更多开发者可能会在等待更可靠的证据，证明 Meteor 可用于大型、更复杂的应用程序开发。不言说，Meteor 在未来的
    2016 年甚至 2017 年可能仍将保持小众地位。大多数专业开发者将等待任何关于它能开发大型、复杂应用的证据。


    ## ES6 终于到来


    JavaScript 开发者在 2016 年及未来的 2017 年要做的事情之一，是确保他们所有的应用都符合 ES2015 标准。但与其他许多技术应用和编程语言的复杂问题一样，我们面临着
    `Babel` 与 `TypeScript` 问题。


    `Babel` 主要将 ES6 代码翻译为 ES5，而 `TypeScript` 实际上是 JavaScript 的超集，它为 JavaScript 增加了必要的但可选的静态类型，然后将所有内容编译为纯
    JavaScript。`Babel` 和 `TypeScript` 的创建目的完全不同，因此不具有可比性。


    由 Facebook 开发的 `Babel` 支持 `Flow`，后者也为 JavaScript 增加了静态类型检查。使用 `Babel` 更有意义，因为你可以连续使用两者。`Babel`
    也是第一个帮助桥接 ES5 和 ES6 应用程序差异的工具。


    另一方面，`TypeScript` 只支持 ES6，因此在进步性方面次于 `Babel`。查看 GitHub Stars 数，`Babel` 似乎是最受欢迎的转编译器。`React`
    开发者也倾向于使用 `Babel` + `Webpack` 的组合。


    ![`s3.amazonaws.com/codementor_content/2016-May/babel_vs_typescript.png`](img/image012.png)


    尽管关注度很高，`TypeScript` 似乎要可行得多，有时甚至是更优的选择，特别是当你寻找一种能让你的 JavaScript 代码库更易于管理的解决方案时。JavaScript
    一直以难以阅读而闻名，由于其弱类型检查系统，使其调试更加困难。因此在支持方面，`TypeScript` 拥有比 `Flow` 更多的追随者。


    ![`s3.amazonaws.com/codementor_content/2016-May/so_staticjs.png`](img/image016.png)


    下面的图显示了 Google 趋势中 `TypeScript` 热度的增长。


    ![`s3.amazonaws.com/codementor_content/2016-May/es6.png`](img/image001.png)


    `TypeScript` 可能流行的另一个原因是由于 `Angular2`，但仅仅因为 JavaScript 应用受到更多关注，并不是导致 `TypeScript`
    流行的主要原因。


    虽然 `Redux` 让测试变得简单得多，但 `TypeScript` 让代码库变得容易维护得多。此外，Google、Facebook 和微软正合作为 JavaScript
    增加静态类型，从而为 ECMAScript 铺平道路。


    与此同时，Google 放弃了 `AtScript` 和 `AngularJS`，转而采用微软的 `TypeScript`。另一方面，Facebook 的
    `Flow` 并没有 `TypeScript` 那样的社区人气。


    这表明静态类型 JavaScript 是一个活跃且不断增长的趋势，即使是 JavaScript 的否定者也会认可，而 `TypeScript` 是最可靠的解决方案。


    ## 函数式编程走向主流


    许多函数式编程平台已经进入主流编程，但最近，“函数式编程模型”引起了大量关注，特别是随着复杂 Web 应用的兴。


    ![image](img/scene_break.png)


    ![`s3.amazonaws.com/codementor_content/2016-May/hn-fp.png`](img/image013.png)


    `Scala` 回归想要拥抱函数式编程的后端开发者青睐语言。然而，Facebook 的 `React` 则鼓励前端 JavaScript 开发者使用实用的方法进行
    UI 开发。


    对于函数式编程的正面反馈越来越多，看起来它将在 2017 年成为主流。在此时，前端 Web 开发正处于响应式和函数式编程的前沿。


    因此，`React`+`Redux` 方案对于那些习惯面向对象编程的人来说，是最受青的入门级解决方案。换句话说，`React` 只需要开发者对 UI 采用函数式方法，而
    `Redux` 主要是一个鼓励使用实用方法处理数据的系统。其他事情都通过 OOP 风格完成。


    ## RxJS


    但对于那些仍然想坚持完全函数式响应式编程（被认为是“真正的” FRP）并且仍然想使用 JavaScript 的人，`RxJS` 是一个必须学习的技能。`RxJS`
    是 JavaScript 的响应式扩展，可以取代 `Flux` 架构。对于简单的小应用，这可能大得其实，但事实上，它为通过复杂处理流的 Web 应用构建了强大的基础。


    Netflix 使用 `RxJS`，而 `Angular2` 也依赖 `RxJS`。由微软开发的 `RxJS` 与 `TypeScript` 配合得非常好，因此开发者可以预期
    `RxJS` 将继续改进。


    然而，学习 `RxJS` 是一个完全不同的领域。它陡峭的学习曲线让大多数开发者放弃在 JavaScript 中进行任何 FRP，转而学习与 JavaScript
    兼容的其他函数式编程语言。


    ![`s3.amazonaws.com/codementor_content/2016-May/frp_gtrend.png`](img/image022.png)


    ![image](img/scene_break.png)


    开发者选择替代 `RxJS` 使用的一些兼容语言是 `ClojureScript` 和 `Elm`。然而，所有程序的增长和人气与 `Redux`+`React`
    相比都相形见绌。


    ![`s3.amazonaws.com/codementor_content/2016-May/frp_with_redux.png`](img/image023.png)


    ![image](img/scene_break.png)


    事实考虑到函数式编程如何完美解决现代 Web 开发中的问题，人们必须承认函数式编程范式及其等概念将作为 JavaScript 开发者需要掌握和学习的技能生存。


    ## 桌面框架对决：Nw.js vs. Electron


    如今许多数据需要从各种平台（如桌面和移动端）同步数据。然而，许多服务大多数作为 Web 应用启动，然后被转换为桌面应用以增强用户体验。这样做是因为 Web
    应用开发要快得多且更于更新。此外，用户也可以立即尝试 Web 应用，而无需安装其他任何东西。


    过去的开发者如果想使用 Web 技术创建桌面应用的前端 UI，受限于使用 `CEF`。这不是一个容易的过程，而且应用程序本身并不是真正的跨平台兼容。尽管如此，`Node.js`
    让桌面框架的跨平台应用变得更简单。使用 Web 技术开发桌面应用的趋势从 2014 年开始兴起。


    因此，让我们来看看这两个项目的 GitHub Stars 历史：


    ![nwjs vs electron](img/image004.png)


