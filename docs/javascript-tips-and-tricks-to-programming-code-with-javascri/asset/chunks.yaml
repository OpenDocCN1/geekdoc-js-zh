  trans: "\n\n## 数组与单元素的单一处理方法\n\n与其编写单独的方法来处理数组和单个元素参数，你也可以编写函数使其能够同时处理这两者。你只需要先将所有内容合并到一个数组中。`Array.concat`\
    \ 可以接受数组或单个元素。\n\n```javascript\nfunction printUpperCase(words) {\n  var elements\
    \ = [].concat(words || []);\n  for (var i = 0; i < elements.length; i++) {\n \
    \   console.log(elements[i].toUpperCase());\n  }\n}\n```\n\n`printUpperCase` 现在已准备好接收单个节点或节点数组作为参数。它还避免了在未传递参数时可能抛出的\
    \ `TypeError`。\n\n```javascript\nprintUpperCase(\"cactus\"); // => CACTUS\nprintUpperCase([\"\
    cactus\", \"bear\", \"potato\"]); // => CACTUS, BEAR, POTATO\n```\n\n## 测量 JavaScript\
    \ 代码块的性能\n\n为了快速测量 JavaScript 代码块的性能，我们可以使用控制台函数，如 [console.time(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimabel)\
    \ 和 [console.timeEnd(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimeendlabel)\n\
    \n```javascript\nconsole.time(\"Array initialize\");\nvar arr = new Array(100),len\
    \ = arr.length,i;\nfor (i = 0; i < len; i++) {\n  arr[i] = new Object();\n};\n\
    console.timeEnd(\"Array initialize\"); // 输出: Array initialize: 0.711ms\n```\n\
    \n## 提升 (Hoisting)\n\n提升将帮助你管理函数作用域。变量声明和函数会被提升到顶部，而变量的定义则不会。\n\n```javascript\n\
    function doTheThing() {\n  // ReferenceError: notDeclared is not defined\n  console.log(notDeclared);\
    \ // 输出: undefined\n  console.log(definedLater);\n  var definedLater;\n  definedLater\
    \ = 'I am defined!' // 输出: 'I am defined!'\n  console.log(definedLater); // 输出:\
    \ undefined\n  console.log(definedSimulateneously);\n  var definedSimulateneously\
    \ = 'I am defined!' // 输出: 'I am defined!'\n  console.log(definedSimulateneously);\
    \ // 输出: 'I did it!'\n}\ndoSomethingElse();\nfunction doSomethingElse(){\n  console.log('I\
    \ did it!');\n}\n// TypeError: undefined is not a function\nfunctionVar();\nvar\
    \ functionVar = function(){\n  console.log('I did it!');\n}\n```\n\n# 第 5 章：\n\
    \n## 未来需要掌握的 JavaScript 技能\n\n无论你是否喜欢，作为一名程序员或 Web 或 App 开发者，你都需要学习 JavaScript。它被认为是未来的计算机语言，仅仅是因为它是\
    \ Web 和 App 开发不可或缺的一部分。\n\n尽管 JavaScript 非常常见，但它非常复杂，尤其是当趋势不断变化时，随之而来的是随之产生的混乱。尽管如此，JavaScript\
    \ 领域正在不断改进，随着技术的演进，JavaScript 的旧问题得到了解决，毫无疑问会有新问题踵而至。\n\n如果你是 2016 年的新开发者，你学习\
    \ JavaScript 的意愿和能力将有助于你职业生涯的成功，以及你作为程序员/编码员/黑客或开发者的技能。\n\n那么，程序员未来应该关注 JavaScript\
    \ 开发的哪些趋势？在本章中，我们将看看编程语言世界中将变得流行的各种事物。\n\n## React & Redux\n\n在 2015 年，React 获得了关注，特别是当\
    \ 2014 年结束时，越来越多的程序员开始抱怨 `AngularJS` 框架。`Angular 2` 将无法与 `Angular 1` 同时运行的消息传出，让\
    \ Angular 社区的境地更加糟糕。React 在 2016 年填补了这一空白。\n\n根据互联网存档的截图进行估计。也许更具说明力的指标是 `react`、`angular`\
    \ 和 `Angular2` 包的 npm 下载次数：\n\n![angularjs vs react](http://www.npmtrends.com/react-vs-angular)\n\
    \n在过去的一年里，React 从 JavaScript 社区中获得的关注比 `AngularJS` 多。所以，如果你查看上面的图表，你可能在好奇 8 月之后发生了什么？它显示\
    \ `React` 的 npm 下载量激增，并确切显示了 `React` 的 GitHub Star 数在何时追上 `AngularJS` 的 Star。\n\
    \n这种变化归功于 Dan Abramov 在 `ReactEurope2015` 大会上创建的 `Redux`。`Redux` 有一个简单的 flux 实现，说服了许多程序员是时候采用唯一一的\
    \ React 了。\n\n在 `Redux` 出现之前，React 处于动荡中，因为人们正试图弄清楚如何执行执行“Flux”架构。从那时起，出现了许多实现，虽然它们并不坏，但并没有完全解决让大多数\
    \ JavaScript 开发者警惕的问题。\n\n尽管有通用的渲染以及 `React` 及其虚拟 DOM 的广受赞誉，程序员们在项目中使用它时仍然非常谨慎。尽管如此，越来越多的人开始使用\
    \ `Redux` 并发现它让运行在 JavaScript 上的应用测试和调试变得简单得多。从那时起，`Redux` 从 Flux 脱颖而出成为真正的赢。`React`\
    \ 和 `Redux` 绝对是 2016 年最热门的趋势，而且看起来在 2017 年也不会消失，就前端“框架”而言。\n\n## 其他关注的框架\n\n其他框架可能会进入这一领域，虽然它们并不完全对等，但这里是对现有框架的总体概述。再次，事情可能会随技术而改变。今年不理想的在明年可能会变成顶尖的。\n\
    \n### Angular2\n\n许多非技术公司将研究 Angular 2，特别是使用微软框架的企业。`Angular 2` 是由 Google 和微软合作开发的，旨在让\
    \ JavaScript 语言更易管理。去年微软积极推行 .NET，因为它开源了许多元素，并努力让微软工具对开发者可用。重写后，团队希望解决 `Angular\
    \ 1` 应用的任何升级问题，到目前为止性能非常出色。`Angular2` 的开发是为了支持 Web 组件，根据 Google 的说法，它是 Web 开发的未来。尽管\
    \ Angular 团队投入精力帮助开发者正确从 `Angular 1` 迁移到 `Angular 2`，`Angular` 社区对 Angular 的发展方向持有不同意见。这种重写也让\
    \ `React` 得以发展和成熟，随着其社区日益增长。由于由于，程序员怀疑 `Angular 2` 会像 `Angular 1` 那样成功。然而，正如上面提到的，技术可能会变化，所以\
    \ `Angular 2` 在 2017 年可能有增长空间。`Angular2` 仍然被认为是 React 应用的替代方案。\n\n### Meteor\n\
    \n另一个值得关注的趋势是 Meteor，它一直拥有稳定的下载量和 GitHub Star。它与 `React` 和 `Angular` 集成良好，并具有许多巧妙的功能。作为一个轻量级的全栈\
    \ JavaScript 框架，开发者发现 Meteor 框架非常好用。Meteor 一直作为实用的初学者框架，也非常适合原型制作。\n\n"
