    to the hidden complexities that keep cropping up over time particularly when production
    is concerned. Meteor, despite having raised loads of money, isn’t backed by a
    leading tech enterprise with a broad pool of engineers, like what `React` & `AngularJS`.
    Notwithstanding the fact that `AngularJS` has plenty of issues and yet is backed
    up by Google, Meteor, on the other hand, is considered an investment risk as it’s
    a framework for both the backend and frontend development. To get the most out
    of the deployment ease, Meteor would also need to be hosted.


    Another thing that isn’t working for Meteor at the moment is that many developers
    aren’t big fans of the `MongoDB` and well, Mongo is Meteor’s default database.
    Meteor will remain a nice though for 2017 since more developers will likely wait
    for more reliable evidence that Meteor can be used for large and more complex
    application development. Needless to say, Meteor will likely remain niche going
    forward in 2016 or even 2017. Most professional developers will wait for any evidence
    that it can be used for developing large, complex applications.


    ## ES6 At Last


    One of the things that JavaScript developers do in 2016 moving forward 2017 is
    to ensure that all their apps are ES2015 compliant. But like many other complications
    with tech apps and programming language, we have the `Babel` vs. `TypeScript`
    issue.


    `Babel` mostly translates the ES6 code to ES5 whereas `TypeScript` is really a
    superset of JavaScript that adds necessary but optional static typing to JavaScript
    and then compiles all of this to plain JavaScript as well. `Babel` and `TypeScript`
    have been created with totally different purposes and therefore not comparable.


    `Babel`, developed by Facebook, supports `Flow` which also adds in the static
    type-checking for JavaScript. Using `Babel` makes a little bit more sense since
    you can use both consecutively. `Babel` was also the first to helped bridge the
    difference between ES5 and ES6 applications.


    `TypeScript` on the other hand only supports ES6, thus playing second fiddle to
    `Babel` when it comes to progressiveness. Checking in with the GitHub stars, it
    looks like `Babel` is the most preferred transpiler. `React` developers also prefer
    to use the `Babel` + `Webpack` combo.


    ![https://s3.amazonaws.com/codementor_content/2016-May/babel_vs_typescript.png](d2d_images/image012.png)


    Despite the stars, `TypeScript` seems to be a lot more viable and sometimes and
    even preferred choice especially if you are looking for a solution to make your
    JavaScript codebase much more manageable. JavaScript has always been known to
    be a difficult to read language making it even more difficult to debug, due to
    its weak type-checking system. So in terms of support, `TypeScript` has enjoyed
    a larger following than `Flow`.


    ![https://s3.amazonaws.com/codementor_content/2016-May/so_staticjs.png](d2d_images/image016.png)


    The graph below shows the Google Trends Graph showing the growth of interest for
    `TypeScript`.


    ![https://s3.amazonaws.com/codementor_content/2016-May/es6.png](d2d_images/image001.png)


    Another reason that `TypeScript` could be getting popular is because of `Angular2`,
    but just because JavaScript apps get larger focus, that isn’t the contributing
    reason of why `TypeScript` becomes popular.


    While `Redux` has made testing much easier, `TypeScript` makes codebase a lot
    easier to maintain. Apart from this, Google, Facebook, and Microsoft are collaborating
    to add on static typing to JavaScript and thus paving the way to EMCAScript.


    At the same time, Google dropped `AtScript` and `AngularJS` in favor for `TypeScript`
    by Microsoft. `Flow` by Facebook, on the other hand, doesn’t have the same community
    popularity as `TypeScript`.


    This goes to show that statically typed JavaScript is an active and growing trend
    that even JavaScript non-believers will approve of where is `TypeScript` is the
    most solid solution.


    ## Functional Programming is Becoming Mainstream


    Plenty of functional programming platforms have been making their way into mainstream
    programming but very recently, the ‘functional programming model’ has gained plenty
    of attention especially with the rise of complex web apps.


    ![image](d2d_images/scene_break.png)


    ![https://s3.amazonaws.com/codementor_content/2016-May/hn-fp.png](d2d_images/image013.png)


    `Scala` is coming back as a favored language among backend developers who want
    to embrace functional programming. However, Facebook’s `React`, on the other hand,
    has encouraged front-end JavaScript developers to take on UI development using
    a practical approach.


    More and more positive feedback is coming in for functional programming, and it
    looks like it will become mainstream in 2017. At this point of time, front-end
    web development is taking the forefront in reactive and functional programming.


    So the `React`+`Redux` agenda is really the most sought after beginner-friendly
    solution for those that are comfortable with programming that is object-oriented.
    In other words, `React` only needs developers to take a functional approach to
    UI whereas `Redux` is mostly a system that encourages a practical approach to
    handling data. All other things are done in the OOP-style.


    ## RxJS


    But for those who still want to go on track with the full-on functional reactive
    programming, which is considered the ‘true’ FRP and still want to use JavaScript,
    then `RxJS` is a necessary skill to learn. `RxJS` is an extension of JavaScript
    that is reactive that can be used to replace the `Flux` architecture. It may sound
    like overkill for simple and small apps but in truth, it builds a powerful foundation
    for web applications that will go through a complicated stream of processing.


    Netflix uses `RxJS` while `Angular2` also relies on `RxJS`. Developed by Microsoft,
    `RxJS` works incredibly well with `TypeScript` thus developers can expect that
    `RxJS` will continue to be improved.


    Learning `RxJS` though is an entirely different arena. It has a steep learning
    curve that make most developers give up on doing any FRP in JavaScript and pick
    up other functional programming languages that are compatible with JavaScript.


    ![https://s3.amazonaws.com/codementor_content/2016-May/frp_gtrend.png](d2d_images/image022.png)


    ![image](d2d_images/scene_break.png)


    Some of the compatible programming that developers choose to use instead of `RxJS`
    is `ClojureScript` and `Elm`. However all these program’s growth and popularity
    pales in comparison with `Redux`+`React`.


    ![https://s3.amazonaws.com/codementor_content/2016-May/frp_with_redux.png](d2d_images/image023.png)


    ![image](d2d_images/scene_break.png)


    The thing is, looking at how functional programming fits perfectly with addressing
    modern issues in web development, one has to agree that functional programming
    paradigm and its equivalent concepts will stick around as a necessary skill that
    JavaScript developers will need to harness and learn.


    ## Desktop Framework Showdown: Nw.js vs. Electron


    Plenty of data nowadays requires synchronizing data from various platforms such
    a desktop and mobile. However, many services mostly start out as web apps before
    they are converted as desktop apps for enhanced user-experience. It is done this
    way because web app developments are a lot faster and more easily updated. Above
    all, users can also try out web apps more instantly without having to install
    anything else.


    Developers in the past were confined to using `CEF` if they wanted to use web
    technologies to create front-end UI for desktop apps. Not an easy process and
    the apps themselves weren’t truly cross-platform compatible. Though that, `Node.js`
    has made cross-platform apps easier for desktop frameworks. The shift of using
    web technologies for desktop app development began to rise starting 2014.


    Thus, let’s take a look at the GitHub Star history for both projects:


    ![nwjs vs electron](d2d_images/image004.png)

