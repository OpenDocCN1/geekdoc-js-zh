    Simple Tricks to Help You


    Learn JavaScript Faster


    Oftentimes when anyone is on the path of learning JavaScript or any coding skill,
    they often experience some of these issues:


    -  Confusing concepts


    -  Time and motivation to learn


    -  Easy to forget codes


    -  Tooling landscape keeps changing


    In this chapter, we are going to look at conquering these challenges with some
    mind tricks that can help you learn the JavaScript landscape faster, making you
    a more productive coder.


    TIP 1: CREATE A ROADMAP OF WHAT YOU WANT TO LEARN


    Let’s face it- there are plenty of frameworks to use and new coders are always
    at the crossroads of which to start off with first. Instead of researching which
    frameworks to start on, one of the best ways to overcome this would be to create
    your roadmap of learning what you need to know.


    For example, if you want to become a front-end developer, then your roadmap could
    look like this:


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image017.png)


    HTML and CSS are the most basic coding knowledge you need to know before you proceed
    to learn other things. Then you can move on to JavaScript and jQuery. Once you
    have created your roadmap, it’ll make it easier for you to focus on what is essential
    first so you don’t waste time and effort.


    TIP 2: TAKE YOUR TIME


    Wanting to understand coding quickly will be one of the harmful things that can
    halt your progress of learning coding and JavaScript.


    Attempting to skim something and then moving on to the next issue at hand will
    only make you forget things even more. You’ll forget what you read the first time,
    go back to it and read it to refresh your memory and then move on. By this time,
    you’d have forgotten something else entirely. This cycle will keep repeating,
    and then you’ll find yourself discouraged. To prevent this from happening, you
    can do this:


    -  Limit the amount of coding to a particular task. Learn one thing at a time


    -  Practice what you’ve learned


    By learning and practicing your coding skills, you’ll find that it is a lot easier
    to remember things and absorb them as you go on learning new things.  This process
    may seem longer, but practice does make it perfect.


    TIP 3: PRACTICE WITH THE RIGHT MINDSET


    Remember this: if you try to take shortcuts in your JavaScript practice, you will
    only end up taking a longer time to learn it. Yes practicing is boring and repetitive
    but here are some ways to make it exciting:


    Try treating each new concept in JavaScript like a new toy, car or iPhone or even
    a new dress. You are excited to try it, especially when it’s new and you use it
    several times. Apply something cool with the concept that you’ve just learned;
    surprise yourself and show your friends your new skill.


    With a slightly more playful approach to learning new things, you can have fun
    while learning. You’ll also find that you remember these concepts longer and you
    learn a lot faster.


    TIP 4: COMPARTMENTALIZING YOUR TIME


    Finding time to practice coding can be difficult. However, the same people who
    code are also heavy social media users, often spending time on YouTube and Facebook,
    Reddit or even Wikipedia. Whether or not you are like this, there are valuable
    lessons to be learned from using social media.


    The fact that we all spend so much time on Facebook even if all we just wanted
    to do was just to look at one notification says a lot. We get sucked into Facebook
    because one thing leads to another and because you constantly have people updating
    their status and walls and your news feed always have something new to see.


    Using this same psychology, you can use this to your advantage in learning code.
    Instead of committing several hours of learning codes, you can just tell yourself
    that you will commit to 15 whole minutes without any disturbance.


    Then look at Facebook, take a little break.


    Then come back again and do another 15 minutes.


    But, this technique can only work if stay focused to your goal, and not allow
    Facebook or anything other suck you into, and make you totally forget what you
    were doing.


    TIP 5: GIVE YOURSELF TIME


    There’s a saying that goes if you take your time to think slowly, you’ll learn
    a lot faster. Coding needs time. You need time to understand it. Otherwise, you’ll
    only get more confused. Take your time to figure out what it is that you are trying
    to learn. Explain it to someone if you have to. Take your time to go through each
    step, and each line of code before you figure it all in one go.


    TIP 6: WRITE IN PLAIN LANGUAGE


    Coding can be incredibly complex. If what you are reading becomes too complicated
    or unfamiliar, then try writing it out in simple terms- or in any way that you
    can understand it first. That way, you can figure out what it is that you want
    to code before actually writing it.


    This will enable you to code much easily the next time around, and you’ll also
    be faster at writing your codes because you wouldn’t need to stop and think with
    each line of code. You’ll also be able to spot bugs even before you code them
    in.


    BOTTOM LINE


    Many of these tips can make you learn JavaScript easily and at a faster rate.
    The truth is, you would be able to apply these tips to learn any sort of lesson
    you need to.


