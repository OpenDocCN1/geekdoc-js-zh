    你也可以对上述操作都不做，允许用户通过它的命名空间访问你的库。\n\n代码：\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n```javascript\n// AngryUserAgent 模块\n// 拥有 UserAgent 命名空间的权限\n(function AngryUserAgent(UserAgent)\
    \ {\n  // 创建新方法 .toAngryString()\n  UserAgent.prototype.toAngryString = function()\
    \ {\n    return this.toString().toUpperCase();\n  };\n})(UserAgent);\n\n// 应用代码\n\
    var userAgent = new UserAgent;\n\n// ...\n// EVILCORPBROWSER/1.2 (X11; LINUX;\
    \ EN-US) BLINK/20420101\nuserAgent.toAngryString();\n```\n\n同样，这允许你覆盖方法。\n\n```javascript\n\
    // AngryUserAgent 模块\n(function AngryUserAgent(UserAgent) {\n  // 存储旧的 .toString()\
    \ 方法以备后用\n  var _toString = UserAgent.prototype.toString;\n  // 覆盖 .toString()\n\
    \  UserAgent.prototype.toString = function() {\n    return _toString.call(this).toUpperCase();\n\
    \  };\n})(UserAgent);\n\nvar userAgent = new UserAgent;\n\n// ...\n// EVILCORPBROWSER/1.2\
    \ (X11; LINUX; EN-US) BLINK/20420101\nuserAgent.toString();\n```\n\n––––––––\n\
    \n![image](img/scene_break.png)\n\n在这种情况下，允许用户访问库的命名空间也意味着你对插件和扩展的定义控制力更小。\n\n\
    为了让扩展遵循某些约定，你需要编写文档。\n\n### 测试\n\n对于测试驱动开发，大纲是必不可少的。换句话说，这是在你编写实际库之前，以测试的形式写下功能和标准的时间。\n\
    \n如果你的测试显示某功能行为符合预期，并且你在将其写入库中之前就已经写下了它，那么这种策略被称为行为驱动开发。\n\n如果你的测试覆盖了库的每一个方面，并且你的代码通过了所有这些测试，那么你就可以安全地说你的库运行良好。\n\
    \n你可以使用的其他测试框架还有：\n\n[使用 Mocha 和 Chai 测试你的 JavaScript](http://www.sitepoint.com/unit-test-javascript-mocha-chai/)\
    \ 由 Jani Hartikainen 编写，你可以在 Mocha 中编写单元测试。\n\n[使用 Jasmine、Travis 和 Karma 测试 JavaScript](http://www.sitepoint.com/testing-javascript-jasmine-travis-karma/)\
    \ 由 Tim Evko 编写，向你展示如何与另一个名为 Jasmine 的框架协调地设置测试流水线。\n\n下面是 Tim Severien 提供的另一个你可以尝试的大纲。他为他的库使用了\
    \ Jasmine 测试，看起来像这样：\n\n代码：\n\n```javascript\ndescribe('Basic usage', function\
    \ () {\n  it('should generate a single product', function () {\n    // 创建单个产品\n\
    \    var product = new UserAgent.Product('EvilCorpBrowser', '1.2');\n  });\n\n\
    \  it('should combine several products', function () {\n    var userAgent = new\
    \ UserAgent;\n    // 创建并添加产品\n    var application = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\n  });\n\n  it('should update products correctly', function () {\n \
    \   var userAgent = new UserAgent;\n    // 创建并添加产品\n    var application = new\
    \ UserAgent.Product('EvilCorpBrowser', '1.2');\n  });\n});\n```\n\n"
- fmt: "\nAPI documentation is also an essential part of documentation as it will\
    \ tell users how exactly to use your library. Other good additions would be examples\
    \ as well as tutorials. This can take up some time so you can do this as your\
    \ library development is on-going.\n\n## Meta-tasks\n\nUsers will also want to\
    \ make changes to your library and this is usually in the form of a contribution\
    \ but some may want to create a custom build only for private use. For these users,\
    \ you can include documentation for meta-tasks that include a list of commands\
    \ to build the library, run testing, generate and convert or download data.\n\n\
    ## Contribution\n\nContributions are great especially when you open-source your\
    \ library. Another documentation you can add in is to guide contributors to explain\
    \ the steps in making a contribution to the library and what kind of criteria\
    \ should they fill before making a contribution. This will make your review process\
    \ easier to accept contributions that can actively upgrade and enhance your library.\n\
    \n## License\n\nLicenses are important too. Include licenses so everyone knows\
    \ what material is copyrighted. [ChooseALicense.com](http://choosealicense.com/)\
    \ is recommended as an excellent resource for acquiring a license without any\
    \ legal advisor. Save your chosen license as text in a `LICENSE.txt` file format\
    \ in your project’s root.\n\n## Adding Versions/Releases to Your Git Repository\n\
    \nVersioning is necessary for a good library. The current standard for version\
    \ naming is via the `SemVer`, short for [Semantic Versioning](http://semver.org/).\
    \ This version comprises three numbers to indicate different changes for major,\
    \ minor and patch. If you do have a git repository, you can also add in version\
    \ numbers. Consider the snapshots of your repository or `Tags`. To create a tag,\
    \ open its terminal and do the following:\n\n```bash\ngit tag -a [version] -m\
    \ [version message]\n```\n\n```bash\ngit tag -a v1.2.0 -m \"Awesome Library v1.2.0\"\
    \n```\n\nGitHub for example provides a comprehensive view of all your versions\
    \ as well as download links for each one of them.\n\n### Publishing to Common\
    \ Repositories\n\n### npm\n\nMost programming languages are equipped with package\
    \ managers or they at least have a third party package manager that enables users\
    \ to pull in specific libraries for that specific programming language. For example,\
    \ PHP’s manager is [Composer](http://www.sitepoint.com/mastering-composer-tips-tricks/)\
    \ and Ruby on Rails is [RubyGems](https://rubygems.org/). For a standalone JavaScript\
    \ engine such as Node.js you have [npm](https://www.npmjs.com/). By default, your\
    \ `npm` package will be available publicly. But you also have the option of publishing\
    \ the following:\n\n- [private packages](https://www.npmjs.com/npm/private-packages)\n\
    - [set up a private registry](https://docs.npmjs.com/misc/registry#can-i-run-my-own-private-registry)\
    \ \n- [completely avoid publishing](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-the-official-registry-its-private)\n\
    \nHowever, should you decide to publish your package, then you need the `package.json`\
    \ file. You can do this manually or use an interactive wizard for thisit-or-use\
    \ an interactive wizard for this. To begin this wizard, start by typing:\n\n```bash\n\
    npm init\n```\n\nThe `version` property should match your git tag. Include the\
    \ `README.md` file as well. Just like GitHub, `npm` uses that for the page presenting\
    \ your package.\n\nOnce done, publish your package by typing:\n\n```bash\nnpm\
    \ publish\n```\n\nThat’s it! You have successfully published your `npm` package.\n\
    \n### Bower\n\nAnother useful package manager called Bower surfaced a few years\
    \ ago. This is a package manager designed for the web. Here, you can find all\
    \ major front-end asserts. The only thing is, your library will benefit from using\
    \ Bower to publish your package is if your library set up to be browser-compatible.\n\
    \n`npm` packages are primarily for JavaScript and many front-end packages still\
    \ use npm but Bower is still fundamentally popular so go ahead and publish using\
    \ Bower too.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\nTo generate\
    \ a `bower.json` file, type:\n\n```bash\nbower init\n```\n\nJust like `npm init`,\
    \ the instructions are self-explanatory. Finally, to publish your package:\n\n\
    ```bash\nbower register awesomelib [https://github.com/you/awesomelib]\n```\n\n\
    ––––––––\n\n![image](d2d_images/scene_break.png)\n\nNow you have your library\
    \ available for everyone to use in their Node projects or on the web!\n\n## Conclusion\n\
    \nRemember that your code development is the library. Make sure your library solves\
    \ a problem, it is convenient and easy to use and above all stable. This will\
    \ ensure that you and many other developers who use it are happy.\n\nThe tasks\
    \ explained above are easily automated such as running tests and creating tags,\
    \ updating your versions and publishing your packages.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Chapter 4:\n\n![image](d2d_images/chapter_title_below.png)\n\n# JavaScript\
    \ Tips & Tricks\n\nto Keep and Remember\n\nIn this chapter, we will look into\
    \ some short and useful tips related to improving your JavaScript skills and enhancing\
    \ your code writing.\n\n| USING === Instead of == | The `==` (or `!=`) operator\
    \ performs an automatic type conversion if needed. The `===` (or `!==`) operator\
    \ will not perform any conversion. |\n| :--- | :--- |\n| charAt() Shorthand |\
    \ To do this, you can utilize the `eval()` function however this bracket notation\
    \ technique is much simpler than an evaluation: `\"myString\"[0]; // Returns 'm'`\
    \ |\n| Strings convert to Numbers | The fastest and easiest ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29))\
    \ way to do this would be using the `+` (plus) operator. `var one = '1'; var numberOne\
    \ = +one; // Number 1`. You can also use the `-` (minus) operator which type-converts\
    \ the value into number but also negates it. `var one = '1'; var negativeNumberOne\
    \ = -one; // Number -1` |\n| Truthy/falsy values converted to boolean | You can\
    \ convert a Truthy or Falsy value to true boolean with `!!`. `!!\"\" // false\
    \ !!0 // false !!null // false !!NaN // false!!\"hello\" // true !!1 // true !![]\
    \ // true` |\n| Using JSON.Stringify | Let’s say there is an object with properties\
    \ “prop1”, “prop2”, “prop3”. Additional params can be passed to `JSON.stringify`\
    \ to selectively write properties of the object to string like: `var obj = {'prop1':\
    \ 'value1','prop2': 'value2','prop3': 'value3'}; var selectedProperties = ['prop1',\
    \ 'prop2']; var str = JSON.stringify(obj, selectedProperties); // str {\"prop1\"\
    :\"value1\",\"prop2\":\"value2\"}` The `str` will contain only info on selected\
    \ properties. Instead of array we can pass a function also. `function selectedProperties(key,\
    \ val) { the first val will be the entire object, key is empty string if (!key)\
    \ {return val;} if (key === 'prop1' || key === 'prop2') {return val;} return;}`\
    \ The last optional param it takes is to modify the way it writes the object to\
    \ string. `var str = JSON.stringify(obj, selectedProperties, '\\t\\t'); /* str\
    \ output with double tabs in every line.{\"prop1\": \"value1\",\"prop2\": \"value2\"\
    }*/` |\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n"
  raw: 'API documentation is also an essential part of documentation as it will tell
    users how exactly to use your library. Other good additions would be examples
    as well as tutorials. This can take up some time so you can do this as you library
    development is on-going.


    Meta-tasks


    Users will also want to make changes to your library and this is usually in the
    form of a contribution but some may want to create a custom build only for private
    use. For these users, you can include documentation for meta-tasks that include
    a list of commands to build the  library, run testing, generate and convert or
    download data.


    Contribution


    Contributions are great especially when you open-source your library. Another
    documentation you can add in is to guide contributors to explain the steps in
    making a contribution to the library and what kind of criteria should they fill
    before making a contribution. This will make your review process easier to accept
    contributions that can actively upgrade and enhance your library.


    License


    Licenses are important too. Include licenses so everyone knows what material is
    copyrighted. [ChooseALicense.com](http://choosealicense.com/) is recommended as
    an excellent resource for acquiring a license without any legal advisor. Save
    your chosen license as text in a LICENSE.txt file format in your project’s root.


    Adding Versions/Releases to Your Git Repository


    Versioning is necessary for a good library. The current standard for version naming
    is via the SemVer, short for [Semantic Versioning](http://semver.org/). This version
    comprises three numbers to indicate different changes for major, minor and patch.
    If you do have a git repository, you can also add in version numbers. Consider
    the snapshots of your repository or Tags. To create a tag, open its terminal and
    do the following:


    # git tag -a [version] -m [version message]


    git tag -a v1.2.0 -m "Awesome Library v1.2.0"


    GitHub for example provides a comprehensive view of all your versions as well
    as download links for each one of them.


    ### Publishing to Common Repositories


    npm


    Most programming languages are equipped with package managers or they at least
    have a third party package manager that enables users to pull in specific libraries
    for that specific programming language. For example, PHP’s manager is [Composer](http://www.sitepoint.com/mastering-composer-tips-tricks/) and
    Ruby on Rails is [RubyGems](https://rubygems.org/). For a standalone JavaScript
    engine such as Node.js you have [npm](https://www.npmjs.com/). By default, your
    npm package will be available publicly. But you also have the option of publishing
    the following:


    - [private packages](https://www.npmjs.com/npm/private-packages)


    - [set up a private registry](https://docs.npmjs.com/misc/registry#can-i-run-my-own-private-registry) 


    - [completely avoid publishing](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-the-official-registry-its-private)


    However, should you decide to publish your package, then you need the package.json
    file. You can do this manually or use an interactive wizard for this. To begin
    this wizard, start by typing:


    npm init 


    The version property should match your git tag. Include the README.md file as
    well. Just like GitHub, npm uses that for the page presenting your package.


    Once done, publish your package by typing:


    npm publish


    That’s it! You have successfully published your npm package.


    Bower


    Another useful package manager called Bower surfaced a few years ago. This is
    a package manager designed for the web. Here, you can find all major front-end
    asserts. The only thing is, your library will benefit from using Bower to publish
    your package is if your library set up to be browser-compatible.


    npm packages are primarily for JavaScript and many front-end packages still use
    npm but Bower is still fundamentally popular so go ahead and publish using Bower
    too.


    ––––––––


    ![image](d2d_images/scene_break.png)


    To generate a bower.json file, type:


    bower init


    Just like npm init, the instructions are self-explanatory. Finally, to publish
    your package:


    bower register awesomelib [https://github.com/you/awesomelib](https://github.com/you/awesomelib)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Now you have your library available for everyone to use in their Node projects
    or on the web!


    ## Conclusion


    Remember that your code development is the library. Make sure your library solves
    a problem, it is convenient and easy to use and above all stable. This will ensure
    that you and many other developers who use it are happy.


    The tasks explained above are easily automated such as running tests and creating
    tags, updating your versions and publishing your packages.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 4:


    ![image](d2d_images/chapter_title_below.png)


    JavaScript Tips & Tricks


    to Keep and Remember


    In this chapter, we will look into some short and useful tips related to improving
    your JavaScript skills and enhancing your code writing.


    | USING === Instead of == | The == (or !=) operator performs an automatic type
    conversion if needed. The === (or !==) operator will not perform any conversion.What
    it will do is compare the value and the type, which could be considered faster
    ([jsPref](http://jsperf.com/strictcompare)) than ==.[10] == 10 // is true[10]
    === 10  // is false''10'' ==  10  // is true''10'' === 10  // is false[]  == 
    0  // is true[]  === 0  // is false''''   ==  false  // is true but true == "a"
    is false''''  === false  // is false |


    | charAt() Shorthand | To do this, you can utilize the eval() function however
    this bracket notation shorthand technique is much simpler than an evaluationLonghand:"myString".charAt(0);Shorthand:"myString"[0];
    // Returns ''m'' |


    ––––––––


    ![image](d2d_images/scene_break.png)


    | Strings convert to Numbers | The fastest and easiest ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29))
    way to do this would be using the + (plus) operator.var one = ''1'';var numberOne
    = +one; // Number 1You can also use the - (minus) operator which type-converts
    the value into number but also negates it.var one = ''1'';var negativeNumberOne
    = -one; // Number -1 |


    | Truthy/falsy values converted to boolean | You can convert a Truthy or Falsy
    value to true boolean with ‘!!’ !!"" // false!!0 // false!!null // false!!undefined
    // false!!NaN // false!!"hello" // true!!1 // true!!{} // true!![] // true |


    | Using JSON.Stringify | Let’s say there is an object with properties “prop1”,
    “prop2”, “prop3”. Additional params can be passed to JSON.stringify to selectively
    write properties of the object to string like:var obj = {''prop1'': ''value1'',''prop2'':
    ''value2'',''prop3'': ''value3''};var selectedProperties = [''prop1'', ''prop2''];var
    str = JSON.stringify(obj, selectedProperties);// str// {"prop1":"value1","prop2":"value2"}The “str”will
    contain only info on selected properties only. Instead of array we can pass a
    function also.function selectedProperties(key, val) {// the first val will be
    the entire object, key is empty stringif (!key) {return val;}if (key === ''prop1''
    &#124;&#124; key === ''prop2'') {return val;}return;}The last optional param it
    takes is to modify the way it writes the object to string.var str = JSON.stringify(obj,
    selectedProperties, ''\t\t'');/* str output with double tabs in every line.{"prop1":
    "value1","prop2": "value2"}*/ |'
