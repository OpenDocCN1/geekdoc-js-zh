    \ '-');\n\n// Run-time configuration using a public property\n\nuserAgent.commentSeparator\
    \ = '-';\n```\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\nCertain methods\
    \ are exposed intentionally to interact with an instance (getters) such as to\
