    Callbacks are also sometimes accepted and passed using public methods and it often
    used to run user-codes after an asynchronous task.


    var userAgent = new UserAgent;


    userAgent.doAsyncThing(function asyncThingDone() {


    // Run code after async thing is done


    });


    Events have a huge potential in JavaScript libraries. Slightly similar to callbacks,
    they have a slight difference where adding event handlers do not cause trigger
    actions. Events are also used to indicate certain events and can provide additional
    information to the user as well as return a specific value for the library to
    correspond with.


    Code:


    var userAgent = new UserAgent;


    // Validate a product on addition


    userAgent.on(''product.add'', function onProductAdd(e, product) {


    var shouldAddProduct = product.toString().length < 5;


    // Tell the library to add the product or not


    return shouldAddProduct;


    });


    ––––––––


    ![image](d2d_images/scene_break.png)


    You may also enable your users to extend your own library. In order to do this,
    you need to make available your public method or property so that users can populate
