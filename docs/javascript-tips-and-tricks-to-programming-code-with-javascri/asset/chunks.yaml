    # Chapter 5:


    ![image](d2d_images/chapter_title_below.png)


    JavaScript Skills to Know Moving Forward


    Whether you like it or not, as a programmer or web or app developer, you need
    to learn JavaScript. It is considered the computer language of the future simply
    because it is an integral part of web ad app development.


    As common as it is, JavaScript is pretty complicated especially when trends keep
    changing and with that, comes the ensuing chaos. Despite all that, things are
    improving in the JavaScript landscape, and with technology evolving, old problems
    with JavaScript are fixed, no doubt with new ones coming in.


    If you are a new developer in 2016, your willingness and ability to learn JavaScript
    will definitely contribute to the success of your career and your skills as a
    programmer/coder/hacker or developer.


    So what are the trends of JavaScript development should programmers work on going
    forward?


    In this chapter, we will look at the various things that will go big in the programming
    language world.


    React & Redux


    In 2015, React gained traction especially when more and more programmers started
    complaining about the AngularJS framework as 2014 came to an end. The fact that
    news broke out that Angular 2 will be unsuitable to run with Angular 1 made it
    even worse for the Angular community. React came in and closed this gap in 2016.


    ![github star growth](d2d_images/image009.png)


    Estimates based on screenshots from the internet archive. Perhaps a more telling
    pointer would be the npm download count for react, angular, and Angular2 packages:


    [![angularjs vs react](d2d_images/image015.png)](http://www.npmtrends.com/react-vs-angular)


    For the past year, React has been getting more traction from the JavaScript community
    than AngularJS has. So if you look at the graph above, you are probably wondering
    what happened after August? It shows that npm downloads for React have surged
    significantly and it also shows exactly when GitHub stars for React being to catch
    up with AngularJS’s stars.


    The change is due to Redux, created by Dan Abramov during the ReactEurope2015
    conference. Redux had a simple flux implementation that convinced many programmers
    that it was time to adopt the one and only React.


    Before the materialization of Redux, React was turbulent as people were trying
    to figure out how to best execute the ‘Flux’ architecture. Since then, many other
    implementations begin surfacing, and while they aren’t bad, they weren’t exactly
    solving any issues that made most JavaScript developers wary.


    In spite of the universal rendering and the gold stars for React and its virtual
    DOM, programmers were still cautious about using it in their projects. Despite
    this, more and more people started using Redux and realized it makes testing and
    debugging apps running on JavaScript a lot easier. From then on, Redux rose from
    the Flux are the real winner.


    React, and Redux definitely is the hottest trend for 2016, and it doesn’t look
    like it’ll fade away come 2017, regarding front-end ‘framework’ JavaScript. Netflix,
    Yahoo!, and Dropbox have all adopted React into their tech arsenal, giving it
    a confidence boost. Even so, Facebook’s Relay looks like a prospective contender
    in 2017\.


    Other Frameworks of Interest


    Other frameworks may come into the foray and while they aren’t comparable but
    here’s a general overview of what other frameworks are out there. Again, things
    may change with anything regarding technology. What may not work so well this
    year might end up becoming top of the league the next year.


    Without further ado, here are some other frameworks to look into.


    Angular2


    Plenty of non-tech companies will be looking into using Angular 2 especially businesses
    that use Microsoft''s.NET framework. Angular 2, developed through a partnership
    between Google and Microsoft was designed to make JavaScript a more manageable
    language.


    Microsoft themselves were pushing for the.NET aggressively last year as it open-sourced
    quite some elements and strove to make Microsoft tools more accessible to developers.
    After the rewrite, the teams hope to fix any sort of escalating issues with the
    Angular 1 apps, and performance so far has been stellar. Angular2 has been developed
    to support web components, and according to Google, it is the future for web development.
    The AngularJS community though has differing opinions about the direction that
    Angular is taking- all this despite the efforts the Angular team has been investing
    in helping developers transition properly from Angular 1 to Angular 2\.


    This rewrite has also allowed React to develop and mature as with its community
    growing larger each day. Because of this, programmers are skeptical that Angular
    2 will be as successful as Angular 1. However, as mentioned above, things can
    change in the tech world so it could be Angular 2 will have room to grow in 2017\.
    Angular2 is still preferred as an alternative to the React app.


    Meteor


    Another upcoming trend to look out for is Meteor, which has been enjoying steady
    downloads and GitHub stars. It integrates well with React and Angular and has
    plenty of nifty features. As a lightweight, full-stack JavaScript framework, developers
    are finding the Meteor framework a pleasure to work with. Meteor, always known
    as a solid beginner framework is great for prototyping as well.'
