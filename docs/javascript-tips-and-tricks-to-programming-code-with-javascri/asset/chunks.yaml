  trans: "\n\nAPI 文档是文档中不可或缺的一部分，因为它会告诉用户具体如何使用你的库。其他很好的补充内容还有示例和教程。这可能会花费一些时间，因此你可以在库开发的过程中进行这些。\n\
    \n## 元任务 (Meta-tasks)\n\n用户还可能想要对你的库进行更改，这通常以贡献的形式出现，但某些人可能想要仅供私下使用的自定义构建。对于这些用户，你可以包含关于元任务的文档，其中包含构建库、运行测试、生成、转换或下载数据的命令列表。\n\
    \n## 贡献 (Contribution)\n\n贡献是非常棒的，尤其是当你开源你的库时。你可以添加的另一个文档是引导贡献者解释向库提交贡献的步骤，以及在提交贡献之前应该满足哪些标准。这将使你的审核过程更容易接受能够积极升级和增强你的库的贡献。\n\
    \n## 许可证 (License)\n\n许可证同样重要。包含许可证，以便每个人都知道哪些材料受版权保护。[ChooseALicense.com](http://choosealicense.com/)\
    \ 是一个在没有法律顾问的情况下获取许可证的优秀资源。将你选择的许可证以文本格式保存为项目根目录下的 `LICENSE.txt` 文件。\n\n## 向 Git\
    \ 仓库中添加版本/发布\n\n版本控制对于一个良好的库来说是必要的。目前的版本命名标准是通过 `SemVer`，即 [Semantic Versioning](http://semver.org/)（语义化）的写。该版本由三个数字组成，表示主版本、次版本和补丁的不同更改。如果你有\
    \ git 仓库，也可以添加版本号。考虑你仓库的快照或 `Tags`。要创建一个标签，打开终端并执行以下操作：\n\n```bash\ngit tag -a\
    \ [version] -m [version message]\n```\n\n```bash\ngit tag -a v1.2.0 -m \"Awesome\
    \ Library v1.2.0\"\n```\n\n例如，GitHub 提供了你所有版本的综合视图，以及每个版本的下载链接。\n\n### 发布到公共仓库\n\
    \n### npm\n\n大多数编程语言都配备了包管理器，或者它们至少有一个第三方包管理器，允许用户拉取特定编程语言的特定库。例如，PHP 的管理器是 [Composer](http://www.sitepoint.com/mastering-composer-tips-tricks/)，Ruby\
    \ on Rails 的是 [RubyGems](https://rubygems.org/)。对于像 Node.js 这样的独立 JavaScript 引擎，你有\
    \ [npm](https://www.npmjs.com/)。默认情况下，你的 `npm` 包将公开可用。你也可以选择发布以下：\n\n- [私有包](https://www.npmjs.com/npm/private-packages)\n\
    - [设置私有仓库](https://docs.npmjs.com/misc/registry#can-i-run-my-own-private-registry)\
    \ \n- [完全避免发布](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-the-official-registry-its-private)\n\
    \n然而，如果你决定发布你的包，那么你需要一个 `package.json` 文件。你可以手动执行此操作，或使用交互式向导完成。要启动此向导，首先输入：\n\
    \n```bash\nnpm init\n```\n\n`version` 属性应该与你的 git tag 匹配。包含 `README.md` 文件。就像\
    \ GitHub 一样，`npm` 使用它作为展示你包的页面。\n\n完成后，通过输入以下命令发布你的包：\n\n```bash\nnpm publish\n\
    ```\n\n大喜！你已成功发布了你的 `npm` 包。\n\n### Bower\n\n另一个名为 Bower 的实用包管理器几年前出现了。这是一个专为网页设计的包管理器。在这里，你可以找到所有主要的前端资源。唯一的是，如果你的库被设置为兼容浏览器，那么使用\
    \ Bower 发布你的包将会从中获益。\n\n`npm` 包主要用于 JavaScript，许多前端包仍然在使用 npm，但 Bower 从根本上说仍然流行，所以也去使用\
    \ Bower 发布吧。\n\n––––––––\n\n![image](img/scene_break.png)\n\n要生成 `bower.json`\
    \ 文件，输入：\n\n```bash\nbower init\n```\n\n就像 `npm init` 一样，指令是自言自语的。最后，发布你的包：\n\n\
    ```bash\nbower register awesomelib [https://github.com/you/awesomelib]\n```\n\n\
    ––––––––\n\n![image](img/scene_break.png)\n\n现在，你的库可以供大家在他们的 Node 项目或网页上使用了！\n\
    \n## 结论\n\n记住，你的代码开发就是库。确保你的库解决了问题，它是方便易用的，最重要的是它是稳定的。这将确保你和许多使用它的开发者都能感到开心。\n\
    \n上面解释的任务可以很容易自动化，例如运行测试和创建标签、更新版本以及发布你的包。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 4 章：\n\n![image](img/chapter_title_below.png)\n\n# JavaScript 技巧与窍门\n\n\
    保持与记忆\n\n在本章中，我们将介绍一些与提高 JavaScript 技能和增强代码写作相关的短小实用技巧。\n\n| 使用 === 代替 == | `==`（或\
    \ `!=`）运算符在需要时会执行自动类型转换。`===`（或 `!==`）运算符不会执行任何转换。 |\n| :--- | :--- |\n| charAt()\
    \ 简写 | 实现这一点，你可以利用 `eval()` 函数，但括号表示法比评估要简单得多：`\"myString\"[0]; // 返回 'm'` |\n\
    | 字符串转换为数字 | 最快且最简单的 ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29))\
    \ 方法是使用 `+`（加）运算符。`var one = '1'; var numberOne = +one; // 数字 1` 你也可以使用 `-`（减）运算符，它会将值转换为数字并取反。`var\
    \ one = '1'; var negativeNumberOne = -one; // 数字 -1` |\n| 真假值转换为布尔 | 你可以使用 `!!`\
    \ 将真值或假值转换为布尔值。`!!\"\" // false !!0 // false !!null // false !!NaN // false!!\"\
    hello\" // true !!1 // true !![] // true` |\n| 使用 JSON.Stringify | 假设有一个具有“prop1”、“prop2”、“prop3”的对象。可以向\
    \ `stringify` 传递额外的参数以选择性地将对象的属性写入字符串，例如：`var obj = {'prop1': 'value1','prop2':\
    \ 'value2','prop3': 'value3'}; var selectedProperties = ['prop1', 'prop2']; var\
    \ str = JSON.stringify(obj, selectedProperties); // str {\"prop1\":\"value1\"\
    ,\"prop2\":\"value2\"}` `str` 将仅包含所选属性的信息。我们也可以传递函数。`function selectedProperties(key,\
    \ val) { 第一个 val 将是整个对象，如果 key 为空字符串则 (!key) {return val;} 如果 (key === 'prop1'\
    \ || key === 'prop2') {return val;} return;}` 最后一个可选参数是修改它将对象写入字符串的方式。`var str\
    \ = JSON.stringify(obj, selectedProperties, '\\t\\t'); /* str 输出在每行都有双制表符。{\"\
    prop1\": \"value1\",\"prop2\": \"value2\"}*/` |\n\n"
- fmt: "\n## Single Method for Arrays and Writing Single Element\n\nInstead of writing\
    \ separate methods to hold an array and a single element parameter, you can write\
    \ functions so that they can handle both. You just have to concat everything into\
    \ an array first. `Array.concat` will accept an array or a single element.\n\n\
    ```javascript\nfunction printUpperCase(words) {\n  var elements = [].concat(words\
    \ || []);\n  for (var i = 0; i < elements.length; i++) {\n    console.log(elements[i].toUpperCase());\n\
    \  }\n}\n```\n\n`printUpperCase` is now ready to accept a single node or an array\
    \ of nodes as its parameter. It also avoids the potential `TypeError` that would\
    \ be thrown if no parameter was passed.\n\n```javascript\nprintUpperCase(\"cactus\"\
    ); // => CACTUS\nprintUpperCase([\"cactus\", \"bear\", \"potato\"]); // => CACTUS,\
    \ BEAR, POTATO\n```\n\n## Measure performance for a JavaScript Block\n\nFor quickly\
    \ measuring performance of a JavaScript block, we can use the console functions\
    \ like `[console.time(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimabel)`\
    \ and `[console.timeEnd(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimeendlabel)`\n\
    \n```javascript\nconsole.time(\"Array initialize\");\nvar arr = new Array(100),len\
    \ = arr.length,i;\nfor (i = 0; i < len; i++) {\n  arr[i] = new Object();\n};\n\
    console.timeEnd(\"Array initialize\"); // Outputs: Array initialize: 0.711ms\n\
    ```\n\n## Hoisting\n\nHoisting will help you manage your function scope. Variable\
    \ declarations and functions are hoisted to the top where as variable definitions\
    \ are not.\n\n```javascript\nfunction doTheThing() {\n  // ReferenceError: notDeclared\
    \ is not defined\n  console.log(notDeclared); // Outputs: undefined\n  console.log(definedLater);\n\
    \  var definedLater;\n  definedLater = 'I am defined!' // Outputs: 'I am defined!'\n\
    \  console.log(definedLater); // Outputs: undefined\n  console.log(definedSimulateneously);\n\
    \  var definedSimulateneously = 'I am defined!' // Outputs: 'I am defined!'\n\
    \  console.log(definedSimulateneously); // Outputs: 'I did it!'\n}\ndoSomethingElse();\n\
    function doSomethingElse(){\n  console.log('I did it!');\n}\n// TypeError: undefined\
    \ is not a function\nfunctionVar();\nvar functionVar = function(){\n  console.log('I\
    \ did it!');\n}\n```\n\n# Chapter 5:\n\n## JavaScript Skills to Know Moving Forward\n\
    \nWhether you like it or not, as a programmer or web or app developer, you need\
