    In this case, giving users access to your library’s namespace also gives you less
    control over how plugins and extensions are defined.


    To allow for extensions to follow some certain convention, you need to write documentation.


    Testing


    For test-driven development, an outline is essential. In other words, this is
    the time when you write down the features and criteria in the form of tests, even
    before you write down the actual library.


    If your test show you that a feature behaves like it was supposed to, and you
    write it down before writing it in your library, then this strategy is called
    behavior-driven development.


    If your tests cover every aspect of your library then and if your code surpasses
    all these tests, then you can safely say that your library is working well.


    Other testing frameworks that you can use are:


    [Unit Test Your JavaScript Using Mocha and Chai](http://www.sitepoint.com/unit-test-javascript-mocha-chai/)
    by Jani Hartikainen, where you can write unit tests in Mocha.


    [Testing JavaScript with Jasmine, Travis, and Karma](http://www.sitepoint.com/testing-javascript-jasmine-travis-karma/)
    by Tim Evko shows you how to set up a testing pipeline coherently with another
    framework called Jasmine.


    Below mentioned is another outline that you can try by Tim Severien. He has used
    a Jasmine test for his library and it looks something like this.


    Code:


    describe(''Basic usage'', function () {


    it(''should generate a single product'', function () {


    // Create a single product


    var product = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


    product.setComment(''X11'', ''Linux'', ''en-us'');


    expect(product.toString())


    .toBe(''EvilCorpBrowser/1.2 (X11; Linux; en-us)'');


    });


    it(''should combine several products'', function () {


    var userAgent = new UserAgent;


    // Create and add first product


    var application = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


    application.setComment(''X11'', ''Linux'', ''en-us'');


    userAgent.addProduct(application);


    // Create and add second product


    var engine = new UserAgent.Product(''Blink'', ''20420101'');


    userAgent.addProduct(engine);


    expect(userAgent.toString())


    .toBe(''EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101'');


    });


    it(''should update products correctly'', function () {


    var userAgent = new UserAgent;


    // Create and add first product


    var application = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


    application.setComment(''X11'', ''Linux'', ''en-us'');


    userAgent.addProduct(application);


    // Update first product


    application.setComment(''X11'', ''Linux'', ''nl-nl'');


    expect(userAgent.toString())


    .toBe(''EvilCorpBrowser/1.2 (X11; Linux; nl-nl)'');


    });


    });


    ––––––––


    ![image](d2d_images/scene_break.png)


    Once you have done your testing and you are completely satisfied with the API
    design for your first library version, then you can start thinking about the site’s
    architecture and how exactly will your library be used.


    Module Loader Compatibility


    Not many developers use module loaders, and this is entirely up to you too. However,
    you need to be aware that some developers that use your library might choose to
    use a module loader, so you need to make your library compatible with this feature.


    You can choose some of the popular module loaders such as AMD, RequireJS, and
    CommonJS. If choosing between these functions is hard for you, you can also try
    Universal Module Definition (UMD) which is aimed at supporting several types of
    module loaders.


    To make your library UMD compatible, you can also find some variations such as
    the UMD GitHub repository. Begin to create your library by using one of these
    templates. Another tip is to use Babel to compile ES5 combined with Babel’s UMD
    plugin if you choose to use ES2015 import/export syntax function. This way, you
    can use ES2015 in your projects as well as produce a library that can be used
    by all kinds of developers using various modules.


    Documentation


    You need to start your documentation with basic information such as your project
    name as well as a short description of what it is about. This will help others
    understand what your library is meant to do and whether using your library is
    a good choice for them. You can also include a little bit more information on
    things such as scope and goals so users are better informed. Your roadmap can
    also be included so users know what they can expect in the future in your library
    development and how they can also contribute to it.


