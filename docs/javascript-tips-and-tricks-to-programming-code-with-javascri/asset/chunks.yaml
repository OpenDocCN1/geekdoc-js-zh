    # Chapter 3: Tips and Tricks to Design and Build Your Own JavaScript Library


    ![image](d2d_images/chapter_title_below.png)


    JavaScript Library you say?


    No, it doesn’t contain books. It does, however, include packaged codes that web
    designers, developers, and programmers can use in their projects that will save
    time and effort. In other words, you do not need to reinvent the wheel when you
    want to apply the same package of codes to deliver the same kind of effect on
    different websites and programs.


    ## So what makes a JavaScript Library?


    Here are a few distinct features of a JavaScript Library:


    - It has one file or several files in a single folder

    - Its coding must be maintained separately and remain as-is when you use it to
    implement a project

    - It should allow the user to set project-specific behavior or configuration


    In this chapter, we will talk about why you should build a JavaScript library
    and how they are built- in the simplest ways possible.


    ## Why build your own JavaScript Library?


    Firstly, it makes things convenient for programmers and web developers alike,
    especially if you code and develop plenty of programs, websites, and web applications.
    Having a library with existing codes makes your job easier and saves you time
    since you do not need to keep digging up old projects from some obscure folder
    in your hard drive. All you just need to is pull it out of your library. You have
    a convenient place to store all your codes; you have a place to fragment all your
    applications and keep them all in an easier to maintain location.


    Essentially, any code that makes your work easier and which can be reused is a
    great component to be added to the library. One such good example is `jQuery`.
    `jQuery`’s `API` is a more simplified DOM API. Back when cross-browser DOM manipulation
    was difficult, `jQuery` was essential.


    And if an open-source venture becomes increasingly popular, more developers use
    it, and it will eventually encourage more developers to join in and assist with
    this venture by contributing to the code and submitting issues that will help
    make it easier to manipulate. This contribution will benefit the library and all
    other experiments that depend on it.


    Popular open-source projects can also lead to fantastic opportunities for developers
    alike. A tech firm or any organization may be impressed by the quality of a developer’s
    work, and they will be offered a job. It could also mean that a company will provide
    a developer to collaborate on a project or get them to integrate their project
    into an application of their own.


    But for most developers or coders, having their own library is a hobby; one that
    enables them to write multiple codes and help others and contribute to the process.


    ## Your Goals and Scope of Work


    Before you set out writing your codes, you need to be clear on what your goals
    are for this library. With this, it will help you keep focused on what problems
    you encounter and how to solve them with your library.


    Your primary goal is also to make your library easy to use. Essentially, the simpler
    your `API`, the easier it will be for anyone to use your library.


    So ask yourself- what problems does your library solve and how can you solve it?
    Will you utilize codes from someone else’s library or will you write everything
    yourself?


    In chapter 1, we discussed creating a roadmap. This roadmap for your library will
    be one of the techniques you use in any other code development you set out to
    do.


    ### A Roadmap for your library:


    - List out the features you want in your library

    - Make these features minimum and practical

    - Create milestones for each feature


    What you are doing with the roadmap is setting goals for each function, essentially
    breaking your project into manageable sizes so it is easier to accomplish and
    the process of creating it is a lot more enjoyable. It’ll also keep you sane and
    focused.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## Your Library API Design


    When creating your library, think of yourself as the end-user. By putting yourself
    as the user, you will work towards a user-centric design.


    ### Testing Your API


    The best way to test the quality of your `API` is to use it for your projects.
    What you can do is to substitute the application code with your library and see
    if the result it gives covers all the features you want.


    Here is one example of what User-Agent library outline would look like:


    ```javascript

    // Start with empty UserAgent

    var userAgent = new UserAgent();


    // Create and add first product: EvilCorpBrowser/1.2 (X11; Linux; en-us)

    var application = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');

    application.setComment(''X11'', ''Linux'', ''en-us'');

    userAgent.addProduct(application);


    // Create and add second product: Blink/2042010

    var engine = new UserAgent.Product(''Blink'', ''2042010'');

    userAgent.addProduct(engine);


    // EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/2042010

    userAgent.toString();


    // Make some more changes to engine

    engine.setComment(''Hello World'');


    // EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/2042010 (Hello World)

    userAgent.toString();

    ```


    ––––––––


    ![image](d2d_images/scene_break.png)


    Depending on how complex your library is, you also need to give some thought to
    structuring. One way to do this is to utilize design patterns to structure your
    library as well as overcome any technical issues you may experience along the
    way.


    Structuring also reduces the risk of re-aligning huge parts when you are adding
    new features to your library.


    ## Flexibility and Customization


    A cool thing about most JavaScript libraries out there is its flexibility. However,
    many developers face problems when deciding what they can and cannot customize.
    One of this is `chart.js` and `D3.js`.


    Both elements are great libraries to visualize data. If you need more control
    over your graphics, then the `D3.js` is what you want. If you want something that
    is easy to create yet give you different types of built-in charts, then `Chart.js`
    is the one to use.


    There are three ways that you can give your user control over your library:


    1-  Configuration

    2-  Exposing public methods

    3-  Callbacks & events

