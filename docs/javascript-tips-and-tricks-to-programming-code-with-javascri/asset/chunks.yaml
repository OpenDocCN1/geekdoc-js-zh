    \ 2016, your willingness and ability to learn JavaScript will definitely contribute\
    \ to the success of your career and your skills as a programmer/coder/hacker or\
    \ developer.\n\nSo what are the trends of JavaScript development should programmers\
    \ work on going forward? In this chapter, we will look at the various things that\
    \ will go big in the programming language world.\n\n## React & Redux\n\nIn 2015,\
    \ React gained traction especially when more and more programmers started complaining\
    \ about the `AngularJS` framework as 2014 came to an end. The fact that news broke\
    \ out that `Angular 2` will be unsuitable to run with `Angular 1` made it even\
    \ worse for the Angular community. React came in and closed this gap in 2016.\n\
    \nEstimates based on screenshots from the internet archive. Perhaps a more telling\
    \ pointer would be the npm download count for `react`, `angular`, and `Angular2`\
    \ packages:\n\n[![angularjs vs react](d2d_images/image015.png)](http://www.npmtrends.com/react-vs-angular)\n\
    \nFor the past year, React has been getting more traction from the JavaScript\
    \ community than `AngularJS` has. So if you look at the graph above, you are probably\
    \ wondering what happened after August? It shows that npm downloads for `React`\
    \ have surged significantly and it also shows exactly when GitHub stars for `React`\
    \ being to catch up with `AngularJS`’s stars.\n\nThe change is due to `Redux`,\
    \ created by Dan Abramov during the `ReactEurope2015` conference. `Redux` had\
    \ a simple flux implementation that convinced many programmers that it was time\
    \ to adopt the one and only React.\n\nBefore the materialization of `Redux`, React\
    \ was turbulent as people were trying to figure out how to best execute the ‘Flux’\
    \ architecture. Since then, many other implementations begin surfacing, and while\
    \ they aren’t bad, they weren’t exactly solving any issues that made most JavaScript\
    \ developers wary.\n\nIn spite of the universal rendering and the gold stars for\
    \ `React` and its virtual DOM, programmers were still cautious about using it\
    \ in their projects. Despite this, more and more people started using `Redux`\
    \ and realized it makes testing and debugging apps running on JavaScript a lot\
    \ easier. From then on, `Redux` rose from the Flux are the real winner. `React`,\
