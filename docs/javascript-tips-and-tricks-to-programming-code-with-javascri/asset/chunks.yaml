    尽管 Nw.js 出现得早得多并被认为更老，但看起来 Electron 正在以爆炸性的速度增长，而 nw.js 则在以单调的线性速度增长。


    ![nw.js vs electron](img/image005.png)


    虽然 Electron 还很新，但它已经被 Slack、微软（Visual Studio Code）、WordPress 和 Sencha 等多家成熟机构使用。但由于
    Electron 易易用性，其网络和社区增长得非常快。这股热潮可能会持续到 2017 年，从而使 Electron 成为桌面和 Web 应用开发的首选框架。


    ## 移动应用框架对决：React Native vs Ionic


    当 React Native 出世时，人们预测它将接管市场，并利用 Web 技术规划移动开发的路线，因为它可以用于开发原生跨平台应用。那么 2017 年是
    React Native 的年吗？通过这张图表，可能会产生一些预期：


    ![react native vs ionic](img/image008.png)


    目前，React Native 尚未发布任何更新软件，其版本仍停留在 `0.26`。它是否会在 2017 年成为主流，很大程度上取决于开发者对处理应用开发变化的耐心，这些变化可能需要同时重构整个代码库以及处理其他问题。


    因此，让我们来看 React Native 与 Ionic 的近似 npm 下载量：


    ![react native vs ionic](img/image021.png)


    从图表来看，React Native 有望超越 Ionic，成为使用 Web 技术进行跨平台移动应用开发的首选框架。


    在求职市场方面，React Native 的需求也正变得比 Ionic 更大：


    ![react native vs ionic](http://www.indeed.com/jobtrends/q-react-native-q-ionic.html)


    对职位招聘的快速搜索显示，至少有 75 份招聘正在寻找具备 Ionic 技能的开发者，而 65 份招聘正在寻找具备 React 技能的开发者。这表明对 React
    Native 的熟悉度正日益激增，这可能会对 2017 年之后任何新颖的开发者提供巨大的推动力。


    ## Web API 的未来：GraphQL vs REST


    在 Facebook 提到他们将开源 GraphQL 后不久，许多 JavaScript 开发者在 2016 年早期就跟上了这一热潮，尤其是考虑到 Facebook
    在开源项目方面已变为了 JavaScript 界的“苹果公司”。


    ![graphql](img/image018.png)


    GraphQL 旨在取代 REST APIs，但考虑到 REST APIs 是多么无处不在，这种可能性较小：


    ![rest vs graphql](img/image006.png)


    GraphQL 与 REST APIs 配合得很好，但它绝对不会像某些开发者认为的那样取代 REST。更进一步的是，GraphQL 相对较新，且与 Facebook
    Relay 关联，因此程序员和开发者在其他地方没有足够的可以掌握该技能的学习资源或最佳实践。尽管如此，尽管 GraphQL 现在有很强的炒作，但 2017
    年对于它成为主流仍然为过早。


    ## JavaScript 趋势总结


    结论是，JavaScript 社区移动和变化非常快，跟上任何即将到来的趋势并与主流技术保持一致，这意味着更多的支持、相关性和资源。根据本章讨论的趋势，JavaScript
    开发者应该让自己配备 Redux & React，以及其他熟悉的函数式编程语言，如 `TypeScript`。不仅如此，拥有 React Native 和
    Electron 的经验无疑将为未来的程序员求职时提供更多推动力和信誉。


