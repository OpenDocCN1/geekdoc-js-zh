    | VisibilityToggle() | Plug-in to toggle the visibility of an object |

    | ZoomToggle() | Plug-in to toggle the zoom state of an object |

    | Chain() | Plug-in to start a chain of calls executing |


    # How It Works


    This function first checks the state of id1 and id2''s ZO_Flag property. If either
    is true, a zoom is already in operation on an object, the function returns, like:


    ```

    if (id1).ZO_Flag || O(id2).ZO_Flag return

    ```


    Next, long strings are created as variables to keep the code tidy and stop any
    lines wrapping around. They are also efficient used twice. These are the assignments:


    ```

    var swap = "ChainThis(VisibilityToggle("#1"))"

    var fast = "ZoomToggle(\#1'', #2, #3, #4, #0)"

    var slow = "ZoomToggle(\#1'', #2, #3, #4, #5, #0)"

    ```


    The variable swap is assigned a string suitable for enabling the VisibilityToggle()
    plug-in to be used in a chain (by implementing it using the ChainThis() plug-in).
    The strings fast and slow contain strings to place calls to the ZoomToggle() plug-in,
    one of them taking 1 millisecond (and therefore virtually instantaneously) and
    the other taking a specified time. The #1, #2, and so on which strings are variable
    or value place holders. When these strings are passed to the InsVars() plug-in,
    these place holders are replaced by the values or also passed to it.


    The final call in the plug-in is the Chain() plug-in, passing it a sequence of
    commands, which are all passed through the InsVars plug-in to combine the strings
    with the variables, like:


    # Chain(Array {


    ```

    InsVars(slow, id1, w, h, msecs / 2, pad),

    InsVars(fast, id2, w, h, pad),

    InsVars(swap, id2,),

    InsVars(slow, id2, w, msecs / 2, pad),

    InsVars(swap, id1),

    InsVars(fast, id1, w, h, pad)

    )

    ```


    I have spaced out the code into columns so that you can clearly see the values
    being passed. The sequence of commands performs the following steps:


    +   1. **Zoom id1 over half the time in msecs** This performs the first half of
    the flip animation.

    2. **Zoom id2 over the course of 1 millisecond** This ensures that id2 is quickly
    zoomed down so that it can be zoomed shortly at normal speed.'
