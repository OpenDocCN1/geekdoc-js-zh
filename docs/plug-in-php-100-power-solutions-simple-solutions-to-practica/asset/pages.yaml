  md: '# 258 Plug-In JavaScript: 100 Power Solutions


    This chapter provides you with a wide range of plug-ins offering text manipulation
    features. For example, you can enable text scrolling, either to the left or right,
    and you can choose how many times the scroll should repeat and its speed. There
    are also typewriter and “matrix” effects to make text appear and disappear, as
    well as color fading, flying text into position, and even ripple effects for drawing
    attention to important text.


    ![](img/faacab81da20861e0f8059a56e67dfa4_287_0.png)


    TextScroll()

    With this plug-in, you can scroll selected text either left or right at a speed
    of your choosing and for a set number of times. Figure 9-1 shows two phrases.
    The top one is scrolling over the course of three seconds, and the bottom is scrolling
    over a period of one second.


    # About the Plug-in


    This plug-in takes an object that contains text and then scrolls it. It requires
    the following arguments:


    +   - An object, object ID, or array of objects and/or object IDs

    - dir The direction of scrolling, ''left'' or ''right''

    - number The number of times to repeat the scroll, with 0 indicating infinite
    repeats

    - msecs The number of milliseconds a full scroll should take


    # Variables, Arrays, and Functions


    | j | Local variable for iterating through id if it is an array |

    | copy | Local copy of the HTML contents if |

    | len | Local variable containing the length of copy |

    | freq | Local variable containing the period in milliseconds between each call
    to DoTextScroll() |

    | ctrl1, ctr2 | Local counters for counting the characters in a string and the
    number of scroll iterations |

    | iid | Local variable returned from the call to setInterval(), to be used when
    calling clearInterval() |

    | innerText | Property of id in non-Firefox browsers containing the object''s
    text |

    | textContent | Property of id in Firefox browsers containing the object''s text
    |

    | TS_Flag | Property of id that is true when a scroll is progress progress on
    |

    | LT | Global variable with the value ''left'' |

    | Math.round() | Function to turn a floating point number into an integer |

    | substr() | Function to return a substring |

    | setInterval() | Function start repeating interrupts |

    | clearInterval() | Function to stop repeating interrupts |

    | DoTextScroll() | Subfunction to perform the text scrolling |

    | Html() | Plug-in to return the HTML content of an object |'
