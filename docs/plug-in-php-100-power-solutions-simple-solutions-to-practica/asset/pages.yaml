  md: '# Chapter 11: Cookies, Ajax, and Security 323


    # Variables, Arrays, and Functions


    | date | Local variable containing a new date object |

    | expires | Local variable containing the expiry time and date |

    | start | Local variable set to point to the start of cookie data |

    | end | Local variable set to point to the end of cookie data |

    | document.cookie | The cookie property of the document for using the cookie |

    | toGMTString() | Function to convert a date to Greenwich Mean Time |

    | Date() | Function to return a new date object |

    | setTime() | Function to set a time |

    | getTime() | Function to return a time |

    | indexOf() | Function to return the location of one string within another |

    | substring() | Function to return a portion of a string |

    | escape() | Function to encode a string to a format suitable for transferring
    over the internet |

    | unescape() | Function to decode an escaped string |


    # How It Works


    This program is in three parts. The first is executed when the action argument
    contains the value ''save''. It creates a new Date object and sets it to the current
    time and date, like this:


    ```

    var date = new Date()

    date.setTime(date.getTime() + seconds * 1000)

    ```


    # Saving a Cookie


    The expires variable is given the value to make the cookie expire in seconds,
    the path variable is assigned the path on the server to which the cookie applies,
    the domain and secure attributes are added (if they have values), and the cookie
    is set by assigning these values to document.cookie, as follows:


    ```

    var expires = seconds ? ''expires='' + date.toGMTString() : ''''

    path = path ? ''path='' + path : ''''

    domain = domain ? ''domain='' + domain : ''''

    secure = secure ? ''secure='' + secure : ''''

    document.cookie = name + ''='' + escape(value) + '' '' + expires + path

    ```


    # Reading a Cookie


    In the next section, a cookie is read back from the computer, starting by checking
    whether or not there are any existing cookies on the computer; if there are not,
    the value false is returned:


    ```

    if (!document.cookie.length) return false

    ```'
