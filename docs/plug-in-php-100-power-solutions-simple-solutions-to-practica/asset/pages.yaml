  md: '# Chapter 6: Movement and Animation


    # The DoDoDeflate() Subfunction


    Once initialized by the main part of the plug-in, the DoDoDeflate() function is
    called

    very INTERVAL milliseconds, and each time shrinks the object a little more, like
    this:


    ```

    if (w) ResizeWidth(id, stepw * O(id).DF_Count)

    if (h) ResizeHeight(id, stepw * O(id).DF_Count

    ```


    These two lines calculate the new width and height of id and whether to resize
    or

    both.

    Next, a check is made to see if this was the final resize and whether the animation
    can

    now stop. This is done by checking the value of DF_Count, which is decremented
    after each

    frame of animation.


    # When the Animation Is Finished


    If the DF_Count property is less than 1, the animation has completed and the DF_Flag

    property of id is set to false to indicate that there is no deoperation running

    Finally, the width and/ height of the dimension(s) being reset to zero to complete

    transition.

    In the final lines of the plug-in, the clearInterval() function is called to prevent\any
    further interrupts. Each callback function contained in CB is evaluated with the
    eval()

    but only if the argument CB (explained in Chapter 7) has a value. The code for

    these actions is follows:


    ```

    O(id).DF_Count-- < 1

    (

    (id).DF_Flag = false


    if (w) ResizeWidth(id, 0)

    if (h) ResizeHeight(id, 0)


    clearInterval(O(id).DF_ID)

    if (typeof CB != UNDEFINED) eval (CB)

    ```


    > The double-hyphen--) operator following DF_Count is a handy way of telling JavaScript

    decrement the variable, but only after its current value has been used in the
    if () statement,

    saving an extra line of code.


    # How To Use It


    Using deflate() is a great way to make an object disappear smoothly and is much
    more

    than just hiding it or out it. Here''s some example code illustrating the three

    types of effects supported by this plug-in:


    ```

    <span id=''d''>Mouse Me</</span>


    <img id=''p1'' src=''photo1.jpg'' />

    <img id=''p2'' src=''photo2.jpg'' />

    <img id=''p3'' src=''photo3.jpg'' />

    ```'
