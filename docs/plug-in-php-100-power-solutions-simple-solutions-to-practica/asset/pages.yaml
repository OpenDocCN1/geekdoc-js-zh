  md: "# How It Works\n\nThis plug-in starts by calling itself recursively if id is\
    \ an array, passing each element to be\nprocessed individually, like this:\n\n\
    ```\nif (id instanceof Array) {\n  for (var j = 0 ; j < id.length ; ++j)\n   \
    \ ResizeTextarea(id[j], min, max)\n  return\n}\n```\n\nNext, if min or max have\
    \ not been passed values, they are assigned defaults of 0 and\n100 lines, respectively:\n\
    \n```\nmin = min ? min : 0\nmax = max ? max : 100\n```\n\nFinally, in the setup\
    \ section, the onmouseup and onkeyup events of id are assigned to\nt DoResizeTextarea\
    \ () function:\n\n```\nO(id).onmouseup = DoResizeTextarea\nO(id).onkeyup = DoResizeTextarea\n\
    ```\n\n# The DoResizeTextarea() Subsection\n\nThis function contains just two\
    \ loops (). The first continuously increases the\nrow of rows that id has until\
    \ either the text in the textarea is fully visible, or the\nmaximum number of\
    \ rows in the argument max is reached:\n\n```\nwhile (O(id).scrollHeight > O(id).clientHeight\
    \ && O(id).rows < min)\n++O(id).rows\n```\n\nThe second() loop performs the inverse,\
    \ reducing the height of the textarea so\nthat it is only large as the text contains\
    \ or until it reaches the minimum height\nin the argument min:\n\n```\nwhile (O(id).scrollHeight\
    \ < O(id).clientHeight && O(id).rows > min)\n--O(id).rows\n```\n\n> Note While\
    \ expanding and reducing the textarea seems to work fine on most major\nbrowsers,\
    \ once the clientHeight property in Firefox has increased it doesn't seem to\n\
    reduce it back down again if text is deleted, the textarea will net shrink. If\
    \ you can think of\nway to get Firefox to reduce as well as increase a textarea\
    \ according to the text within it, please\nlet me know the website."
