    On the other hand, it can represent the actual object itself, like this:


    ```

    myvariable = O(''outerdiv'')

    ```


    The former contains simply the string of characters comprising ''outerdiv'', while
    the latter is an object. Because the job of O() is to return the object referred
    to by the string'
