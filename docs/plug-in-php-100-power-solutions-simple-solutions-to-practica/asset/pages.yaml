    \ to click the OK button to close the alert time it is called. What's more, it\
    \ locks up the browser because the alert() function prevents you from doing anything\
    \ else (even closing the browser) until you have clicked OK, and even then the\
    \ alert will pop up, and again, and forever.\n\n> Because the problem of alert()\
    \ potentially taking a browser if placed within a loop, this book includes an\
    \ alternate function called Alert() (with an upper case A) which you may prefer\
    \ to use. It does not lock the browser and has other benefits too. For further\
    \ details, please refer to Chapter 13.\n\n# The Plug-in\n\n```\nfunction CaptureKeyboard(e)\n\
    {\n  if (BROWSER == 'IE')\n  {\n    KEY_PRESS = FromCode(window.event.keyCode)\n\
