  md: '# Chapter 1: Making the Best Use of These Plug-ins


    # Including All the Plug-ins


    The easiest (and recommended) way for you to use these plug-ins is to load them
    all into a web page as a complete set, which you can do with the following command,
    assuming you saved the file PJ.js into the current folder:


    ```

    <script type="text/javascript" src="PJ.js"></script>

    ```


    In fact, by all modern browsers assume that scripts will be JavaScript, so you
    can use the following form, which omits the type=parameter:


    ```

    <script src="PJ.js"></script>

    ```


    Or, if you have PJ.js located elsewhere, such as in the root folder, you change
    the command slightly to include the path, like:


    ```

    <script src="PJ.js"></script>

    ```


    Alternatively, if you use a specific folder for your JavaScript files, such as
    scripts, you use this command:


    ```

    <script src="scripts/PJ.js"></script>

    ```


    And the compressed version of the file, PJsmall.js, can be included instead, like
    this:


    ```

    <script src="scripts/PJsmall.js"></script>

    ```


    Immediately following the line that includes the file, you need to add a second
    line as follows, which will initialize the plug-ins, for you:


    ```

    <script> Initialize()</script>

    ```


    The benefits of using this are that you only need to add a couple of lines to
    your web pages to access all the plug-ins, and there is only one file to change
    when you modify any plug-ins. Also, at around 60KB for the raw JavaScript file,
    it doesn''t take very long to load or consume bandwidth.


    What''s, as already mentioned, you can choose to use the compressed version of
    the file, called PJsmall.js, which is half the size and can be found in the zip
    file with PJ.js. The only difference between the two files is that the larger
    one has all the functions shown in plain text there are easy to see and edit,
    and the small version is tightly compressed and not easy to understand if you
    view it. Regardless of this difference, both work identically to each other.


    # Including Single Plug-ins


    All of the plug-ins included in this book are tightly integrated with each other,
    and as you progress through the book you''ll see how later plug-ins rely more
    and on earlier units, until you reach the point where plug-ins that would normally
    require dozens of lines of code only take a handful of lines because they can
    draw on the wealth of features provided by other plug-ins.'
