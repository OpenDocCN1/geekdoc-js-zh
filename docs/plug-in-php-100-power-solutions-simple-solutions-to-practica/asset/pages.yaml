  md: "# 376 Plug-In JavaScript: 100 Power Solutions\n\nWith everything prepared,\
    \ the final command in the setup section starts the repeating interrupts to the\
    \ DoCurTrail() function:\n\n```\nCT_ID = setInterval(DoCurTrail, length)\n```\n\
    \n# The DoCurTrail() Subfunction\n\nThis function performs the moving of all the\
    \ trail images, which it manages with a for() loop, which with the first command\
    \ moves the image for the current iteration to its new position:\n\n```\nfor (var\
    \ j = 0; j < 10; ++j)\n  Goto(c + j, O(c + j).X + 2, O(c + j).Y + 2)\n```\n\n\
    For example, if j has the value 5, the ID calculated with the expression c + j\
    \ is manipulated, which is 'CT_5'. The number 2 in the code places the images\
    \ down and to the right by two pixels.\n\nNext, the zIndex of the image is set\
    \ to the maximum zIndex so far plus 1, to ensure that it will display on top of\
    \ all other elements:\n\n```\nS(c + j).zIndex = ZINDEX + 1\n```\n\nIf the image\
    \ is set to display directly under the mouse pointer, the image is hidden. If\
    \ it wasn't hidden, the user could not click a link because a trail image would\
    \ be between the mouse pointer and the clickable underneath it:\n\n```\nif (O(c\
    \ + j).X == MOUSE_X && O(c + j).Y == MOUSE_Y) Hide(c + j)\n```\n\nOtherwise, the\
    \ image is moved away from the mouse pointer, it is shown:\n\n```\nelse Show(c\
    \ + j)\n```\n\nNext, as long as j has a value greater than 0 (and therefore is\
    \ indexing the nine trail images above the first), the image location of the image\
    \ behind the current one is set to that of the current image:\n\n```\nif (j >\
    \ 0)\n  O(c + (j - 1)).X = O(c + j).X\n  O(c + (j - 1)).Y = O(c + j).Y\n```\n\n\
    Finally, the highest numbered image (with the ID 'CT_9') is either set to the\
    \ current mouse location, or off screen, to a position well off the start of the\
    \ screen (with the values 12 and 20 representing the width and height of the mouse\
    \ pointer:\n\n```\nO(c + 9).X = MOUSE_X < (w - 12) ? MOUSE_X : -9999\nO(c + 9).Y\
    \ = MOUSE_Y < (h - 20) ? MOUSE_Y : -9999\n```"
