    # Variables, Arrays, and Functions


    | nocache | Local variable assigned a random string to prevent caching |

    | ajax | Local variable assigned an Ajax object |

    | CreateAjaxObject() | Plug-in to return a new Ajax object |

    | open() | Method of ajax for opening a request |

    | send() | Method of ajax for sending a request |

    | Math.random() | Function to return a random number |


    # How It Works


    This plug-in uses the GET method to communicate with a server, which passes data
    in the tail of the URL a query string. However, browser caching will often interfere
    with repeated requests of this type, serving only the cached data from previous
    requests. Therefore, the variable nocache is created and assigned a random string
    to ensure that no two calls will be the same:


    ```

    var nocache = ''nocache'' + Math.random() * 1000000


    Next, the variable ajax is assigned the new Ajax object returned by calling

    CreateAjaxObject(), and if the result is not (meaning the call was unsuccessful)

    a value of false is returned:


    var ajax = CreateAjaxObject(id)

    if (ajax) return false

    ```


    If execution reaches this point, the Ajax object was successfully created, so
    the open method of ajax is called, passing the string ''GET'' for the type of
    request. This is followed by a string comprising the URL to be passed in, the
    arguments supplied in args, the nocache string created, and the value true to
    tell the browser to make an asynchronous call (a value of false would tell it
    to make a synchronous call


    ```

    ajax.open(''GET'', url + ''?'' + args + nocache, true)


    Finally, the call is made and the value true is returned to indicate success:

    ajax.send(null)

    return true

    ```


