    The variable j iterates through each element in the headings array and checks
    each one''s associated contents object POUp property. If true or 1, the contents
    object is currently popped up, the heading is compared with this, which refers
    to the current heading that was either clicked or the mouse passed over. If they
    match, they are the same and nothing happens the currently selected contents object
    will be set to a popped up state a couple of lines in the code.


    However, if the contents object that has been found to be popped up is different
    from the current heading''s contents object, it is the one that previously popped
    up, so it is popped down with a call to PopDown(). The time setting used here
    is from the argument msecsl.


    Finally, the currently selected contents object is set to a popped up state (if
    it isn''t already popped up), like this:


    ```

    if (!this.FO_C.POUp)

    PopUp(this.FO_C, type, w, msecs2, interruptible)

    ```


    This pop-up action is given its own time setting in msecs2 so that different effects
    can be achieved by using different values for msecsl and msecs2.


    # How To Use It


    There are two main ways to use this plug-in. The first is within an accordion
    or folding menu, and the other is to separate out the headings from the contents
    to have the contents object in a different place. The first is most suited being
    operated by mouse clicks, as the transitions occur, new elements could pass under
    the mouse cursor, and if wellknown were used, unwanted selections be driven by
