  md: "# Chapter 12: Forms and Validation 355\n\nNext, each argument is processed\
    \ through the CleanupString() plug-in to ensure that they are in the formats required:\n\
    \n```\nnumber = CleanupString(number, true, false, true, true)\nmonth = CleanupString(month,\
    \ true, false, true, true)\nyear = CleanupString(year, true, false, true, true)\n\
    ```\n\nAfter this, the variable left is assigned the first 4 digits of number,\
    \ clen is set to the card number's length, and checksum is initialized to 0:\n\
    \n```\nvar left = number.substr(0, 4)\nvar clen = number.length\nvar checksum\
    \ = 0\n```\n\nNext, several if() statements check that left contains a valid sequence\
    \ that matches a known brand of credit card, and if it does, the card number clen\
    \ is correct for the card type. If left doesn't match a known card, or it matches\
    \ one but clen is the wrong length, the plug-in returns false to indicate that\
    \ the card didn't verify.\n\nIf initial tests are passed, the card's checksum\
    \ is then calculated using an algorithm invented by IBM scientist Hans Peter Luh\
    \ (for further details see en.wikipedia.org/wiki/Luhn_algorithm), like this:\n\
    \n```\nfor (var j = 1 - (clen % 2); j < clen; j += 2)\n  if (j < clen) checksum\
    \ += number[j] * 1\n\nfor (j = clen % 2; j < clen; j += 2)\n  if (j < clen)\n\
    \    d = number[j] * 2\n    checksum += d < 10 ? d : 9\n```\n\nFinally, the result\
    \ is looked and compared to the values supplied to the plug-in, so that even if\
    \ the card has validated this, the plug-in will still return false if the card\
    \ has expired:\n\n```\nvar date = new Date())\ndate.setTime(date.getTime())\n\
    if (year.length == 4) year = year.substr(2, 2)\n```\n\n```\nif (year > 50) return\
    \ false\nelse if (year < (date.getFullYear() - 2000)) return false\nelse if ((date.getMonth()\
    \ + 1) > month) return false\nelse return true\n```"
