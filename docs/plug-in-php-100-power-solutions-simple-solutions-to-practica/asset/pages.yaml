  md: "# 44 Plug-In JavaScript: 100 Solutions\n\n# Variables, Arrays, and Functions\n\
    \n| e | The event passed to the function by browsers other than Internet Explorer.\
    \ Either e.charCode or e.keyCode contains the value of the key pressed. |\n| window.event\
    \ | Internet Explorer uses the window.event property instead of an event passed\
    \ as an argument. The keyCode contains the value of the key pressed. |\n| BROWSER\
    \ | Global variable used to determine the browser. |\n| KEY_PRESS | Global variable\
    \ assigned to be the value of the keypress. |\n| fromCharCode() | JavaScript function\
    \ to convert Unicode to characters. |\n| FromKeyCode() | Plugin to return the\
    \ value of a key or if it is one of many special characters such as 'Esc', 'Home',\
    \ and so on. |\n\n# How It Works\n\nThis function works depending on whether you\
    \ are using Internet Explorer or not. If you are, it looks up the keypress in\
    \ window.event.keyCode and passes it through the FromCharCode(), which will assign\
    \ a sign if the key was a special one such as 'PageUp', 'Backspace', and so on.\
    \ Then, if the value is still a number (that is, it hasn't been substituted for\
    \ a special key), the JavaScript fromCharCode() function converts from its Unicode\
    \ to an actual value so that, if for example, the key is pressed, then the value\
    \ 'e' is returned.\n\nOn Non-Internet browsers, both e.charCode and e.keyCode\
    \ are checked for a value because the events document.onkeydown and document.onkeypress\
    \ are captured by this function. Special keys already referred to, combining both\
    \ into the same function makes sense. So, if e.charCode has a value, it is passed\
    \ through the JavaScript fromCharCode() function to convert it to Unicode. Or,\
    \ if a special key was pressed, so its value is passed through the FromCharCode()\
    \ plugin-to look up the key name.\n\nIn either case, the result is that KEY_PRESS\
    \ will contain a letter, punctuation symbol, the name of a special key, or simply\
    \ a key number if it is one of the others. No keyboard buffering to, for example,\
    \ create strings of input, as only the last key pressed is saved. However, its\
    \ quite possible to create an input function using this if you need it.\n\nFinally,\
    \ a true is returned to allow further processing of the event by the browser.\n\
    \n# How To Use It\n\nUsing this plugin is as simple as referencing the global\
    \ variable, KEY_PRESS, which it maintains. The following is a simple example that\
    \ continuously updates the contents of a div with the value of the key pressed:\n\
    \n```\n<div id='output'></</div>\n\n<script>\nwindow.onload = function() {\n \
    \ setInterval(simpleInterrupt, INTERVAL)\n```"
