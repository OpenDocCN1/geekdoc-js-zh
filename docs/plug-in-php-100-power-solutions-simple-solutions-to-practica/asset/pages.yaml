    # 93 ValidatePassword()


    To help your users pick more secure passwords, you may wish to require them to
    be of a certain format, such as including upper- and lowercase characters, as
    well as digits and punctuation. With this plug-in, you can choose any or all of
    these and the plug-in will return true or false, depending on whether the user
    has satisfied your requirements. In Figure 12-5 the password that has been entered
    has not verified.


    # About the Plug-in


    This plug-in takes a password string and returns it true or false, depending on
    whether it satisfies the conditions also as arguments. It requires the following
    arguments:


    +   * pass The password to validate

    * min The minimum password length

