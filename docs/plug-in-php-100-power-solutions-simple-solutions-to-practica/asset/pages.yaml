    |---|---|---|---|--|

    | CallBack() | Fade() | Hide() | Show() | Zoom() |

    | ChainThis() | FadeBetween() | FadeToggle() | Slide() | ZoomDown() |

    | Deflate() | FadeIn() | Pause() | SlideBetween() | ZoomRestore() |

    | DeflateBetween() | FadeOut() | Reflate() | WaitKey() | ZoomToggle() |


    **Table 7-1** The Plug-ins That Support Chaining to Other Plug-in via a callback.


    Table 7-2 lists the plug-ins that can be chained by another plug-in via a callback.
    You should not include any other plug-in within a chain sequence (unless you use
    the ChainThis() plug-in, discussed later), as they will not call any remaining
    plug-ins in a chain, so sequence may be interrupted. However, you can always include
    your own plug-ins in a chain if you place a call to NextChain() after the final
    instruction has executed.


    > *Caution* Never attempt to insert any of the Chain(), Repeat(), or While() plug-ins
    into a chain or you''ll get "out of memory," recursion, and possibly other errors.
    These functions can only be used for creating chains that do not contain calls
    to themselves.


    The NextChain() and Callback() plug-ins are generally not expected to be called
    directly, although you can do so using the information that follows.


