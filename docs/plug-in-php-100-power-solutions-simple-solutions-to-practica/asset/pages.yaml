  md: "# GetLastKey()\n\nThis plug-in returns the value of whatever the last keypress\
    \ was and resets the stored value to the empty string to indicate that the key\
    \ value has been retrieved. Figure 3-7 shows a simple input function created using\
    \ this plug-in.\n\n# About the Plug-in\n\nThis plug-in doesn't take any arguments\
    \ and returns the value of the most recently pressed key (if any).\n\n# Variables,\
    \ Arrays, and Functions\n\n| k | Local string variable that holds the value of\
    \ KEY_PRESS before resetting and returning k |\n\n# How It Works\n\nThis plug-in\
    \ assigns the value in KEY_PRESS, the global variable that contains the last key\
    \ pressed, to the local variable k. It then resets KEY_PRESS to the empty string\
    \ to show that the value has been read. Finally, the contents of k is returned.\
    \ If there was no keypress, the empty string is returned.\n\n# How To Use It\n\
    \nThis plug-in can call with no arguments and will return either a letter, number,\
    \ punctuation symbol, or a special key. If the key was none of these, then its\
    \ code is returned.\n\nYou can use this to create a very simple input function,\
    \ like this:\n\nWhat is your name? <b><span>id='name'></span></b>\n\n```\nwindow.onload\
    \ = function() {\n  input('name')\n\nfunction input(id) {\n    var interrupt =\
    \ setInterval(simpleInterrupt, INTERVAL)\n}\n```\n\n![](img/faacab81da20861e0f8059a56e67dfa4_77_0.png)"
