    This plug-in also takes advantage of the S() plug-in''s capability to manage arrays
    of objects and/or object IDs, single objects, or object IDs. It makes two calls:
    one to the object''s style.left property to the value in x with the suffix ''px''
    appended, as is required by the rules of CSS, and the other to do the same with
    the style.top property using the value in y.


    # How To Use It


    To use this plug-in make sure that an object is movable by first issuing a command
    as this (using the global variable REL, which contains the string ''relative''):


    Position(''advertdiv'', REL)'
