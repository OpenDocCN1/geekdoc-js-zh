    What is happening here is the same as what the code in the While() plug-in does.
    It first the evaluation and if it is true it sends all the statements it has been
    passed to the Chain() plug-in. Then it sends all of the preceding statements,
    so when the first sequence has finished executing, the if statement and associated
    calls will come once again and will be passed once over the While() plug to deal
    with.


    The next time around, if expr evaluates to false, the() plug-in will. But if it
    evaluates to true, all the statements are sent to Chain(), followed by the code
    required to start over again. And so the process continues, going round and until
    expr evaluates to false, if ever occurs.


