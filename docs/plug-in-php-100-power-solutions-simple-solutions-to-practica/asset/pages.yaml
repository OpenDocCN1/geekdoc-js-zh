    \ |\n| substr() | Function to return a substring |\n\n# How It Works\n\nThis plug-in\
    \ starts by using j to iterate through id if it is an array and recursively calling\
    \ itself to individually process each element:\n\n```\nif (id instanceof Array)\
    \ {\n  for (var j = 0; j < id.length; ++++) {\n    TextRipple(id[j], number, msecs)\n\
    \  }\n  return\n}\n```\n\nNext, the TR_Flag property of id is checked. If it is\
    \ true, a ripple is already in progress on the object and it returns. Otherwise,\
    \ the property is given the value true to indicate that a ripple is running on\
    \ id, like this:\n\n```\nif (O(id).TR_Flag) return\n O(id).TR_Flag = true\n```\n\
    \nAfter that, the local variable html is given a copy of the HTML content of id;\
    \ len is set to its length; freq is assigned the time in milliseconds each call\
    \ to DoTextRipple() that the ripple is running while msecs milliseconds; two counters,\
    \ ctrl and ctrl2, are initialized; and setInterval() is called to setting up interrupts\
    \ to the DoTextRipple() subfunction every freq milliseconds, like this:\n\n```\n\
    var html = Html(id)\nvar len = html.length\nvar freq = msecs / len\nvar ctrl =\
    \ 0\nvar ctrl2 = 0\nvar id = setInterval(DoTextRipple, freq)\n```\n\nThe variable\
    \ id is given the value returned by setInterval(), which will be used later when\
    \ clearInterval() is called.\n\n# The DoTextRipple() Subfunction\n\nThis function\
    \ starts off by assigning the left hand part of html, prior to any font size changes,\
    \ with ctrl indexing the point at which the fonts will be manipulated:\n\n```\n\
    var temp = html.substr(0, ctrl)\n```"
