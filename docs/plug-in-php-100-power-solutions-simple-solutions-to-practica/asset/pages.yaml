  md: '# Chapter 7: Chaining and Interaction 205


    ```

    var t = H(id) - showing

    var u = Math.min(t, msecs / INTERVAL)

    var x = o? w * o : offset

    var y = TP ? -t : h + t

    var s = t / u

    ```


    # Setting Up the Events


    The final lines of code in the setup section move id to the location x,y; store
    a copy of each the HS_X and HS_Y properties; and set up the mouseover and mouseout
    events to call the SlideIn() and SlideOut() functions, respectively:


    ```

    GoTo(id, x, y)

    O(id).HS_X = x

    O(id).HS_Y = y

    O(id).mouseover = SlideIn

    O(id).mouseout = SlideOut

    ```


    # The SlideIn() SubFunction


    The job of this is to slide the object into view when the mouse passes over any
    part of it. The first thing is to cancel any previously regular interrupts (for
    instance, if the object was in the process of sliding out) with a call to clearInterval(),
    and then it sets up a new regular interrupt to the DoSlideIn() sub-function, like
    this:


    ```

    O(id).HS_ID clearInterval(O(id).HS_ID)

    O(id).HS_ID = setInterval(SlideIn, INTERVAL)

    ```


    This sub-function is where all the animation takes place. First, though, to make
    use of smaller, more manageable variable names, ox and oy are the values in the
    HS_X and HS_Y properties of id. These are the location of the top left of id:


    ```

    var ox = O(id).HS_X

    var oy = O(id).HS_Y

    ```


    A nest of if... else statements test for whether the edge being used is the top,
    bottom, left, or right by checking the argument against the global variables TP,
    BM, LT, and RT. Then, as long as id has to move, the value of either ox or oy
    is incremented or decremented by the step value in s. Otherwise, if there is no
    movement to make, the clearInterval() function is called to stop the interrupts,
    like this:


    ```

    if (where == TP && oy < 0) oy = Math.min(0, oy + s)

    else if (where == BM && oy > h) oy = Math.max(h, oy - s)

    else if (where == LT && ox < 0) ox = Math.min(0, ox + s)

    else if (where == RT && ox > w) ox = Math.max(w, ox - s)

    else clearInterval(O(id).HS_ID)

    ```'
