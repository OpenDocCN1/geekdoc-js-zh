    # O()


    The O() is the most fundamental of the plug-ins provided in this book and is used
    by almost all the others. In its simplest it replaces the long-winding JavaScript
    function getById(), which takes the string argument supplied to it and returns
    the HTML DOM (Document Object Model) object that has assigned that ID. The letter
    O is short for the word Object since the main purpose of this function is to retrieve
    an object or modify its properties.


    # About the Plug-In


    This plug-in takes one and two optional arguments as follows:


    +   - id This can be a string containing the ID of an object, an object, or an
    array containing several objects and/or object IDs. If none of the optional arguments
    are also provided then the function returns the object or objects represented
    by id. there are optional arguments then the purpose of the function changes to
    assign the value to the property in property of the object (or objects) in id.

    - property This optional string argument can contain the name of a property belonging
    to the object (or objects) in id that requires modifying

    - value If this optional argument is set it represents the value to be assigned
    to the property in property of the object (or objects) in both. Both property
    and value arguments must have values, otherwise () will simply return the object
    (or) objects in id.


    # Variables, Arrays, and Functions


    | | |

    | tmp [] | Array holding the result of processing the id array |

    | j | Integer loop variable for indexing into id |

    | UNDEF | Global string variable with the value ''undefined'' |

