    ```

    PreventAction(db, ''both'', false)

    db.onmousedown = ''''

    db.onmouseup = ''''

    ```


    # The StartTE() Subfunction


    This function checks the flag variable to see whether touch control has already
    been enabled. If it has, false is returned; otherwise, copies of the mouse cursor
    position are placed in temporary variables to compare later to see if the document
    should be scrolled, like this:


    ```

    var oldmousex = MOUSE_X

    var oldmouse = MOUSE_Y

    var tempousex = MOUSE_X

    var tempousey = MOUSE_Y

    ```


    Next, flag is set to true to indicate that touch control has been enabled, and
    setInterval() is called to set up repeating interrupts to DoTE():


    ```

    flag = true

    iid = setInterval(DoTE, 10)

    ```


    # The DoTE() Sub-function


    This function checks whether the mouse button is currently held down and is within
    the bounds of the browser, like this:


    ```

    if (MOUSE_DOWN && MOUSE_IN)

    ```


    If the mouse button is neither down nor within the browser’s bounds, the StopTE()
    subfunction is called to release the current scroll. Otherwise, a test is to see
    whether the mouse has moved from the position that was stored in the variables
    tempousex and tempousey when StartTE() was first called:


    ```

    if (MOUSE_X != tempousex || MOUSE_Y != tempousey)

    ```


    If the mouse has moved, tempousex and tempousey are updated to the new mouse location,
    like this:


    ```

    tempousex = MOUSE_X

    tempousey = MOUSE_Y

    ```


    Next, the window is scrolled by the difference between the current mouse location
    and the one that was stored in oldmouse and oldmouse when StartTE() was first
    called, like this:


    ```

    window.scrollBy(oldmouse - MOUSE_X, oldmouse - MOUSE_Y)

    ```'
