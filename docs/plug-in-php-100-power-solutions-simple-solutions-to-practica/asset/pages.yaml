  md: "# Plug-In JavaScript: 100 Power Solutions\n\nThe Px() function performs the\
    \ inverse, adding the 'px' suffix to a value. This is useful when you need to\
    \ add 'px' to an object's property that needs to know you are working in pixels.\
    \ For example, the style.width property can be used to set the width of an object,\
    \ but it needs to 'px' added to it. To save you having to do this you can make\
    \ the following call instead:\n\n```\nS(id).left = Px(135)\n```\n\nThis command\
    \ evaluates the S() function to set the width of the object referred to by id\
    \ to 135 pixels, since Px(135) evaluates to the string '135px'.\nHere's an example\
    \ of how you might use these plug-ins:\n\n```\n<div id='square'>I'm a square</div>\n\
    ```\n\n```\n<script>\nwindow.onload = function() {\n  S('square').width      \
    \    = Px(100)\n  S('square').height         = Px(100)\n  S('square').backgroundColor\
    \ = 'yellow'\n}\n</script>\n```\n\n```\nalert('The pair returned for the value\
    \ of 'square' is: \" + S('square').width + '\\nAfter using NoPx() this becomes:\
    \ \" + NoPx(S('square').width))');\n```\n\nThe HTML section contains a single\
    \ div element with some text. The <script> section the div is resized to 100 pixels\
    \ by 100, using the Px() function to create the values. The background is also\
    \ set to yellow so you can see the square.\nAfter this there's a call to the JavaScript\
    \ alert() function in which the value of the object's width style property is\
    \ displayed ('100px'), and that value is passed through the NoPx() function and\
    \ replayed. This time it is the number 100.\n\n# The Plug-ins\n\n```\nfunction\
    \ NoPx(value) {\n  return value.replace(/px/, '') * 1\n}\n```\n\n```\nfunction\
    \ Px(value) {\n  return value + 'px'\n}\n```\n\n# X() and Y(Y)\n\nThis pair of\
    \ similar functions returns an object's exact horizontal or vertical offset from\
