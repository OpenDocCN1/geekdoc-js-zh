  md: "# SAVE HUNDREDS OF HOURS\n PROGRAMMING TIME!\n\nThese handy guides are packed\
    \ with ready-to-run plug-ins you can use right away to create dynamic Web content.\
    \ Every plug-in offers a full working solution for a result you can achieve immediately,\
    \ using complete code you simply drop into your own programs. Valuable customization\
    \ tips are also included in these practical resources.\n\nRobin Nixon is a developer\
    \ and freelance technical writer who has published more than 500 articles in magazines\
    \ such as PC Plus, PCW, Web User, .net, PC Advisor, and PC Answers.\n\n![](img/faacab81da20861e0f8059a56e67dfa4_3_0.png)\n\
    \n![](img/faacab81da20861e0f8059a56e67dfa4_3_1.png)\n\n![](img/faacab81da20861e0f8059a56e67dfa4_3_2.png)\n\
    \nAvailable everywhere computer books are sold, in print and ebook formats.\n\n\
    Learn more. Do more.\nMPROFESSIONAL.COM"
