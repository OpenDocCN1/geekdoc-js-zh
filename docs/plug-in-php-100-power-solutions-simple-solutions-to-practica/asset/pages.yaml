    # Variables, Arrays, and Functions


    | | |

    |---| j | Local variable for indexing id if it is an array |

    | stepval | Local variable used in the calculation of the amount of opacity to
    change in frame of animation |

    | INTERVAL | Global variable with a default value of 30—the number of milliseconds
    between each call to the interrupt |

    | FA_Flag | Property of id that is set to true if a fade is in progress, otherwise
    it is false |

    | FA_Start | Property of id assigned the value of start |

    | FA_End | Property of id assigned the value of end |

    | FA_Level | Property of id containing the current opacity level |

    | FA_Step | Property of id containing the amount by which to change the opacity
    in each step |

    | FA_Int | Property of id containing the value passed in the interrupt argument
    |

    | Fadeout | Property of id used by the FadeToggle() plug-in: true if it has been
    faded out, or false if it has been faded in |

    | FA_IID | Property of id containing the value returned by setInterval()— value
    is used by clearInterval() to turn off the DoFade() interrupt attached to id |

    | DoFade() | Plug-in callback called EVERY milliseconds until the fade is completed
    or interrupted—this function updates the opacity of it each time it is called
    |

    | Opacity() | Plug-in to change the opacity of an object or array of objects |

    | Math.abs() | Function to return an absolute value from a number that may be
    positive or negative |

    | Math.max() | Function to return the largest of two values |

    | Math.min() | Function to return the smallest of two values |

    | setInterval() | Function to start periodic interrupt calls to another function
    |

    | clearInterval() | Function to stop the interrupts started by SetInterval() |


    # How It Works


    This is the reality of simple plug-ins. At most 50 lines of code it''s short,
    don''t be put off by it; the coding is straightforward, and you''ve seen many
    of its parts before. If you can work through this plug-in, you''ll be able to
    follow them all.

    This works by using interrupts to change the opacity of an object by a small amount
    each time (which is how all the transition and animation plug-ins in this book
    work). To do this, the plug-in comes in two parts: the first part prepares all
    variables and initiates the interrupts, and the second part receives the interrupt
    calls and performs the incremental opacity changes.'
