  md: "# 244 Plug-In JavaScript: 100 Solutions\n\nThe width and height have a pixel\
    \ added to the edge boundary, in some browsers where there might otherwise be\
    \ an anomaly at, which could cause the rollover to cycle rapidly.\n\nThe final\
    \ three lines of the main setup hide ro2 so that only ro1 is visible, both ro1\
    \ and ro2 are relative to their enclosing object at an offset of 0,0, so that\
    \ they are on top of each other. Finally, an onmouseover event attaches the DoRoll()\
    \ function to the mouseover event of ro1, as follows:\n\n```\nHide(ro2)\nLocate(a,\
    \ REL, 0, 0)\n(ro1).mouseover = DoRoll\n```\n\n# The DoRoll() Function\n\nThis\
    \ function swaps the two objects' visibility properties so that ro2 becomes visible\
    \ and ro1 hidden. It then sets up a repeating interrupt to call the RollCheck()\
    \ sub-function every INTERVAL milliseconds, like this:\n\n```\nHideToggle(a)\n\
    var id = setInterval(RollCheck, INTERVAL)\n```\n\nThe local variable id gives\
    \ the value returned by setInterval(), which will later be used by clearInterval()\
    \ to cancel the repeating interrupts.\n\n# The RollCheck() Sub-subfunction\n\n\
    This function simply checks whether the mouse has moved out of the space occupied\
    \ by the objects. If it has, it swaps the two objects back that ro1 is visible\
    \ and ro2 is again hidden. It then cancels the repeating interrupts with a clear\
    \ clearInterval(), like this:\n\n```\nif (MOUSE_X < x || MOUSE_X > x + w ||\n\
    MOUSE_Y < y || MOUSE_Y > y + h)\n{\n  HideToggle(a)\n  clearInterval(id)\n}\n\
    ```\n\n# Why Not Use onmouseout instead of RollCheck?\n\nAs I would like to use\
    \ onmouseout instead of RollCheck(), it's not possible to do so on an object that\
    \ contains many different items passing the mouse cursor between these items will\
    \ trigger an unwanted onmouseout event. Therefore the simplest, and also 100%\
    \ reliable solution, is to check whether the mouse has moved out of the area and\
