  md: "# Chapter 5: Visibility 109\n\n# A Standard Formula\n\nThe preceding formula\
    \ is how almost all the animations and transitions in this book work. They take\
    \ the value in milliseconds that you supply for their duration, then they divide\
    \ that by the interval (usually 30 milliseconds), and finally divide the distance\
    \ between the start and end points of the animation by the timing value, to find\
    \ out the amount of animation needs to move on each step, as shown in the following\
    \ statement:\n\n```\nvar stepval = Math.abs(start - end) / (msecs / INTERVAL)\n\
    ```\n\n# If a Fade Is Already in Progress\n\nThis plug-in is designed so that\
    \ you can force it to proceed until it has finished, or you can allow it to be\
    \ interrupted (but only by Fade() on the same object). This is so that you can\
    \ cancel or mouseout routines that will interrupt it you move your mouse again\
    \ before the transition completes. That way, a partially faded object can be faded\
    \ back to its start point if you take the mouse away.\n\nAlternatively, sometimes\
    \ you may need to display an uninterrupted animation on the screen and maybe even\
    \ a few after. You have the option to choose either by setting the interruptible\
    \ argument to true if a fade can be interrupted, or if it cannot. You can also\
    \ use 1 and 0 for these values you prefer.\n\nThe next section of code dechecks\
    \ whether a fade is already in progress. If it is, the code checks whether the\
    \ FA_Int property of id is set (to see whether an interrupt is allowed). If it\
    \ isn't, the function immediately exits it cannot be interrupted. Otherwise, the\
    \ clearInterval() is called to end the currently repeating animations, and the\
    \ object's new FA_Start property is set to the current value in FA_Fade.\n\n>\
    \ Note assigning new properties to objects is a technique used throughout this\
    \ book. It's a convenient way of using some object-oriented aspects of JavaScript.\n\
    \nThe next section of code checks whether a fade is already in progress. If it\
    \ is, the code checks whether the FA_Int property of id is set (to see whether\
    \ an interrupt is allowed). If it isn't, the function immediately exits it cannot\
    \ be interrupted. Otherwise, the clearInterval() is called to end the currently\
    \ repeating animations, and the object's new FA_Start property is set to the current\
    \ value in FA_Fade.\n\nThis primes the new fade to start where the previous one\
    \ (that was cancelled) left off, which means the new fade will ignore the start\
    \ value that was passed. This override ensures a very smooth and natural flow\
    \ between the two transitions. The following code performs this:\n\n```\nif (O(id).FA_Flag)\
    \ {\n  if (O(id).FA_Int) return\n  clearInterval(O(id).FA_IID)\n  O(id).FA_Start\
    \ = O(id).FA_Level\n}\n```\n\n# If a Fade Is Not in Progress\n\nIf a fade isn't\
    \ already in progress, the new property FA_Start is assigned the value in start\
    \ so that the remaining code can use this value to know where the fade started\
    \ from."
