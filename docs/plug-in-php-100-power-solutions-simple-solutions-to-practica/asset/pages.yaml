  md: '# Chapter 13: Solutions to Common Problems


    # TouchEnable()


    Interest in touch screen really picked up momentum with Apple''s release of the
    iPad in the spring of 2010, so I couldn''t resist adding another 101st plug-in
    to this collection. Here''s final plug-in, which allows you to touch-enable a
    web page. Figure 13-8 shows a copy of the web page for Plug-in PHP, a companion
    to this one, in which a small frame has been attached to the browser window with
    links to touch-enable-on and off.


    # About the Plug-In


    This plug-in changes the mouse click action so that a click and drag operation
    becomes a scroll operation, up, down, left, and right simply by touching the screen
    and moving your finger (or a stylus), also by using an iPhone, iPad, Android phone,
    or other touch device. It requires the following argument:


    +   * If it is true, touch enabling is on; otherwise, it is turned off


    ![](img/faacab81da20861e0f8059a56e67dfa4_408_0.png)


    FIGURE 13-8 With this plug-in you can touch-enable your web pages.'
