    Math.max() to ensure the pop-up stays in bounds, like this:


    ```

    var r = browser - border + SCROLL_X

    var b = browser - border + SCROLL_Y

    x = Math.max(0, Math.min(x, r))

    y = Math.max(0, Math.min(y, b))

    ```


