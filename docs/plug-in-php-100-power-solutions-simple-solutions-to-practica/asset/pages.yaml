    for (var j = 0; j < calls.length; ++j)

    temp = '''' + calls[j].replace(/"/g, "\\"") + ''"''

    ```


    Each round the value in calls[j] is extracted, the replace() function is used
    to escape double quotes, changing them from " to \". Because a double quote is
    also added to the start and end of each string section (followed by a comma),
    any double quotes that appear inside the strings are not escaped will clash with
    the outside quotes and a syntax error, in the way that the following statement
    would fail:


    ```

