    \ following:\n\n```\n<div id='moveme'>Move Me</div>\n\n<script>\nwindow.onload\
    \ = function() {\n  S('moveme').backgroundColor = 'red'\n  S('moveme').color =\
    \ 'white'\n  Position('moveme', REL = Px(100)\n}\n</script>\n```\n\nThis example\
    \ creates a div 'moveme', which is set to white text on a red background, and\
    \ then the Position() plug-in gives it a 'relative' position. Finally, its style.left\
    \ property is set to 100 using the Px() plug-in, which offsets it horizontally\
    \ from its parent object by 100 pixels.\n\nAs the difference in location change\
    \ between divs that use 'absolute' and 'relative' style positions, you also need\
    \ to take into account the fact that a div with an 'absolute' style position is\
    \ automatically shrunk to fit its contents, whereas one with a 'relative' style\
    \ position will retain its previous width which, by default, extends to the right\
    \ edge of its containing object. If you use a span instead, it will always shrink\
    \ to fit its contents, regardless of or how it is positioned.\n\n# The Plug-in\n\
    \n```\nfunction Position(id, type)\n{\n  S(id, 'position', type)\n}\n```\n\n#\
