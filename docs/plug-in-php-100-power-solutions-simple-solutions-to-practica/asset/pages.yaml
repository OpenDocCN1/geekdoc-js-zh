  md: '# 14 Plug-In JavaScript: 100 Solutions


    The great thing about JavaScript is that it could have been designed purely as
    a alone scripting language and it would still have been very useful. But the developers
    did something that would form the future of the Web, which to link it to the HTML
    Document Object Model (DOM), a way of defining an HTML document in a structured
    way that then can be accessed by languages such as JavaScript and Microsoft''s
    VBScript (although does not cover the layer in this).


    Whenever you do something dynamic on a web page, like graphics zooming out when
    you click up the mouse or menus sliding according to your selections, this is
    usually accomplished using JavaScript, which offers functionality not elsewhere
    except by Flash or Java apps—whose scope is limited to the page which they are
    embedded.


    And speaking of Java, you may be forgiven that JavaScript is connected to the
    Java programming language, in fact, it has little to do with it; JavaScript was
    given the name as a market to play in or on the popularity of the Java language.
    Because of this, some people refer to JavaScript as ECMAScript, but since that
    doesn''t roll off the tongue, it will take over as JavaScript''s most popular
    name.


    Anyway, once you have the DOM and a chance to access it, you can do anything with
    a web page, such as easily add new paragraphs; change focus and select text; replace
    images; play sounds, effects, and more.


    When adding Cascading Style Sheets (CSS) to the mixture you can apply styles to
    a page, completely changing the way it looks, without altering the HTML. Actually,
    CSS has something in common with JavaScript in that settings can apply dynamic
    effect on elements to change their color and other properties when the mouse passes
    over them (as you''ll see implemented in some of the plug-ins).


    Therefore the plug-ins use both CSS and JavaScript to achieve the required functionality
    in the simplest and easiest way possible. But in order to understand what is going
    on in many of the plug-ins, it''s important that you first have a grounding in
    the DOM and CSS.


    > Tip You may be experienced with programming in JavaScript and using CSS and
    the DOM. If so, you may wish to skip through this chapter for a quick refresher
    on the subject. But if you are relatively new to JavaScript I recommend you familiarize
    yourself with the contents of this chapter, because the plug-ins we use are built
    on the principles discussed.


    # The Document Object Model (DOM)


    The Document Object Model (DOM) separates the different parts of an HTML document
    into a hierarchy of discrete objects, each having its own properties and methods.
    Methods that can do anything with an object, while properties are attributes of
    an object such as the value it holds in the case of a text object, or width and
    height in case of an image, and so on.


    The outermost object possible is the window object, which is the current window,
    tab, or popped up window. Underneath is the document object, of which there can
    be more than one (as several documents loaded into different frames a page). Inside
    a document there are other objects such as the head and body of a page.'
  merge: -1
