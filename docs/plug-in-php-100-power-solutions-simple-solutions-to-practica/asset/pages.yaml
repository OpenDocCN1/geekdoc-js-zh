    | SL_Int | New property assigned to id: true if the previous call to this plug-in
    is uninterruptible |

    | SL_IID | New property assigned to id with which repeating interrupts can be
    stopped |

    | INTERVAL | Global variable with the value 30 |

    | Distance() | Subfunction to calculate the distance between two locations |

    | DoSlide() | Subfunction for performing the slide animation |

    | GoTo() | Plug-in to move an object to a new location |

    | setInterval() | Function to set another function to be called repeatedly |

    | clearInterval() | Function to stop the interrupts created by setInterval() |


    # How It Works


    The first section of test codes for the existence of the SL_Flag property of id.
    If it has a value of true (or) then on a slide the id is already in progress.
    This is the statement used:


    ```

    if (O(id).SL_Flag)

    ```


    Next, the property of id, SL_Int is tested. If it is false then the previous call
    to Slide() for this id set to indicate that the function cannot be interrupted,
    so the function returns.

    Otherwise, interrupting the plug-in is allowed, so the current slide is stopped
    by calling clearInterval(), passing the SL_IID property of id, as returned by
    SetInterval().

    The code to do this is:


    ```

    if (O(id).FL_Int) return

    else clearInterval(O(id).SL_IID)

    ```


    Next, because the plug-in has been interrupted, it''s necessary to allow the interrupting
    slide to come from wherever the previous one was halted. What''s more, because
    the coordinates of the halted object will not be the start coordinates passed
    to the interrupting'
