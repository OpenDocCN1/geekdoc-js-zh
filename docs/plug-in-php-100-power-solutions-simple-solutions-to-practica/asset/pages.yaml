  md: '# 70 Plug-In JavaScript: 100 Power Solutions


    About the Plug-In

    Plug-in requires a decimal number to be passed to it, and then it returns number
    in the form of a hexadecimal string. It requires this argument:


    +   - n A decimal number to be converted to hexadecimal


    # Variables, Arrays, and Functions


    | to.toString() | JavaScript function for converting a number to a string |


    How It Works

    Plug-in uses two code segments combined into a single statement. The first segment
    looks like:


    ```

    n < 16 ? ''0'' : ''''

    ```


    This is known as a ternary expression, in which n < 16 is an initial test. The
    ? symbol indicates that if the result of the test is true then the value following
    the ? should be returned. Otherwise the value following the : should be returned.
    In this example, that means values of n that are lower than 16 will return the
    string ''0'' being returned, while values of n that are 16 and above result in
    '''' being returned.

    The reason for this is that this plug-in will mostly be used by code that want
    to create color triplets for setting a color. These triplets are made up three
    groups of two hexadecimal characters, each for hexadecimal FF (26 decimal) shades
    of the colors green and blue. For example, FF0088 means the intensity values for
    the given color should be FF 00 green and 88 blue, in hexadecimal. Therefore,
    going back to the code segment, if n is less than 16 it becomes a single digit
    in hexadecimal (a number between 0 and F), and in such cases a 0 is added to pad
    the number to the required digits.

    Having padded the number with a 0 (if necessary), the number n is passed to the
    JavaScript toString() function with an argument of 16, which this code segment:


    ```

    n.toString(16)

    ```


    This tells it to convert the number to base 16, which is hexadecimal. The results
    of the two segments are concatenated and returned. When you put both pieces of
    code they look like this:


    ```

    return (n < 16 ? ''0'' : '''') + n.toString(16)

    ```


    How To Use It

    To convert a decimal number to hexadecimal, pass it to the DecHex() plug-in, like
    this:


    ```

    alert(''The decimal number 173 in hexadecimal is '' + DecHex(173))

    ```'
