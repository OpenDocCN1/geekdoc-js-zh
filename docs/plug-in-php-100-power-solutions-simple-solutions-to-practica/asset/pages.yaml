    BWMove Subfunction

    The job of this function is to prepare the pop-up for being dragged around. First,
    the pop-up is brought to the front with a call to BWToFront() and the mouse cursor
    is changed to the operating system''s icon for moving a window, like this:


    ```

    BWToFront().cursor = ''move''

    ```


    Next, it makes copies of the current difference between the top left corner of
    the pop-up and the current mouse position, placing them in xoffset and yoffset,
    and setInterval is called to repeat interrupts to the BWMove() sub-function every
    10 milliseconds to allow the object to be dragged out, as follows:


    ```

    var xoffset = MOUSE_X - X(id)

    var yoffset = MOUSE_Y - Y(id)

    var iid = setInterval(BWMove, 10)

    ```


