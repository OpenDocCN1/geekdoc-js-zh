    to the style subjet of the object (or objects) in id that requires modifying.

    * value If this optional argument is set represents the value to be assigned to
    property in property of the style subjet of the object (or objects) in id. Both
    the property and value arguments must have values, otherwise S() will simply return
    the style subjet of the object (or objects) in id.


