    +   - **bounds** If, the pop-up is forced to stay within the browser window, otherwise
    it may be moved off the edges


    +   - **type** The type of transition when popping the pop-up up or down, either
    ''fade'', ''inflate'', ''zoom'', or ''instant''


    +   - **w&h** If type is either ''inflate'' or ''zoom'', w and h specify which
    dimension(s) will be modified, otherwise these values will be ignored


    +   - **msecs** The number of milliseconds a pop-up or pop-down should take (unless
    type is ''instant'')


    +   - **interruptible** If true, the pop-up can be interrupted by a pop-down call
    during its pop-transition


    # Variables, Arrays, and Functions


    | browser, browser | Local variables containing the width and height of the browser
    |

    | borderw, borderh | Local variables containing the widths of the left and right
    and bottom borders of the pop-up |

    | popup, popup | Local variables containing the width and height of the pop-up
    |

    | xoffset, yoffset | Local variables of the BWMove() subfunction containing the
    differences between the pop-up location and the current mouse positions |

    | x, y | Local variables of the DoMove() subfunction containing the differences
    between the current and set mouse positions |

