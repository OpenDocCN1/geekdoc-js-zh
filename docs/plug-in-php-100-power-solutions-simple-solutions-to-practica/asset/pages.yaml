  md: '# Plug-In JavaScript: 100 Power Solutions


    Finally, the object is moved to the new location in ox and oy, and the HS_X and
    HS_Y properties are assigned these values, as follows:


    ```

    GoTo(id, ox, oy)

    O(id).HS_X = ox

    O(id).HS_Y = oy

    ```


    # The SlideOut() Subfunction


    The job of this function is to slide the object away again when the mouse passes
    out of it. The first thing it does is cancel any previously running regular interrupts
    (for instance, if the object was in the process of sliding in) with clearInterval().
    Then it sets up a new regular interrupt to the SlideOut() sub-function, like this:


    ```

    if (O(id).HS_IID) clearInterval(O(id).HS_IID)

    O(id).HS_IID = setInterval(DoSlideOut, INTERVAL)

    ```


    As with the similar DoSlide(), copies of the properties used are first placed
    in shorter variable names, like this:


    ```

    var ox = O(id).HS_X

    var oy = O(id).HS_Y

    ```


    Then, if the movement hasn''t been completed, the values of ox and oy are modified
    as necessary depending upon which edge is used; otherwise the repeating interrupt
    is cancelled, as follows:


    ```

    if (where == TP & oy > y) oy = Math.max(y, oy - s)

    else if (where == BM & oy < y) oy = Math.min(y, oy + s)

    else if (where == LT & ox > x) ox = Math.max(x, ox - s)

    else if (where == BT & ox < x) ox = Math.max(x, ox + s)

    clearInterval(O(id).HS_IID)

    ```


    Finally, the object is moved to the new location in ox and oy, and the HS_X and
    HS_Y properties are assigned these values, as follows:


    ```

    GoTo(id, ox, oy)

    O(id).HS_X = ox

    O(id).HS_Y = oy

    ```


    > Note HoverSlide() is one of the more complicated plug-ins, but it creates great
    effects, so it''s worth reading the explanation through a few times if things
    aren''t clear first.


    # How To Use It


    To use the HoverSlide() plug-in, you pass an object and then tell it where the
    object should be placed (out of the ''top'', ''bottom'', ''left'', or ''right''
    edges), wherever on the edge to place it, how much of the object to show sliding,
    and the speed of the sliding animation in milliseconds, in these examples:


    ```

    HoverSlide(''myobject'', ''top'', ''$50'', 60, 1000)

    HoverSlide(''myobject2'', ''right'', 15, 20, 1000)

    ```'
