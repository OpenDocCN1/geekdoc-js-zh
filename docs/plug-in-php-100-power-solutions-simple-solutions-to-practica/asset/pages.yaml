  md: "# 132 Plug-In JavaScript: 100 Power Solutions\n\ncall, it's necessary to ensure\
    \ that the interrupting call moves at the same speed as the one specified in the\
    \ call.\n\nFor example, if the call to Slide() specifies an animation time of\
    \ 1000 milliseconds, but it interrupts another slide and discovers that the object\
    \ is now only one third of the distance from the destination (instead of the 100\
    \ percent it have been if this was the first Slide() call on the object), then\
    \ the new slide should only take one-third of 1000 milliseconds to move, or 333\
    \ milliseconds.\n\n# Using the Pythagorean Theorem\n\nTo calculate the new distance\
    \ to travel, and, to determine the speed of the new slide, the plug-in uses the\
    \ Pythagorean theorem, which states that on a right angled triangle, the volume\
    \ of the square of the hypotenuse is equal to the sum of the squares of the other\
    \ two sides.\n\nThis works because you draw a line between any two points, on\
    \ a two-dimensional surface such as a browser, you draw a horizontal line from\
    \ one point and a vertical line from the other so that they meet each other at\
    \ a single coordinate to create a right angled triangle, with the longest edge\
    \ connecting the two locations.\n\nTherefore, using the Pythagorean theorem, the\
    \ distance between the requested start and ends is determined by passing the results\
    \ of tox - fry and toy - fry to the subfunction Distance(), like this:\n\n```\n\
    var len = Distance(tox - fry, toy - fry)\n```\n\nThe Distance() function looks\
    \ like this:\n\n```\nfunction Distance(x, y) {\n  x = Math.max(1, x)\n  y = Math.max(1,\
    \ y)\n  return Math.round(Math.sqrt(Math.abs(x * x) + Math.abs(y * y)))\n}\n```\n\
    \nThe variable x is the length of one side of the triangle, while y is the length\
    \ of the other side. If either value is 0, then it is changed to 1, otherwise\
    \ division-by-zero errors may occur.\n\nEach value is multiplied by itself to\
    \ determine the volumes of the squares, and they are converted to absolute values,\
    \ which could be negative numbers. These figures are added together to give their\
    \ combined volume, which is also the volume of the square on the long side of\
    \ the triangle.\n\nFinally, to discover the length of the triangle's longest edge,\
    \ the square root of this volume is returned—the distance in pixels between the\
    \ locations frx,fry and toy.\n\nWith the new distance in len, the values of tox\
    \ and fry are overwritten with the actual coordinates of the object, looking them\
    \ up with the X() and Y() plug-ins using the following code. The plug-in will\
    \ use this new start location, overriding the one passed to it by the calling\
    \ code:\n\n```\nfrx = X(id)\nfry = Y(id)\n```"
