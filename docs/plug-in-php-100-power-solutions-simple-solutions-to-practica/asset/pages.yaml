  md: "# Chapter 3: The Core plug-ins 51\n\nTo provide these features, by the browser\
    \ supports, either the ondragstart or onselectstart event of the object in id\
    \ (or events the value type is 'both') is assigned an inline, anonymous function\
    \ that returns the value false, which has the effect of cancelling any further\
    \ action.\n\nIf the event is not recognized, the onmowned event for the object\
    \ in id is caught and return false. This is not a great solution because it prevents\
    \ other onmowned events from being attached, but it does have the effect of preventing\
    \ the event from occurring.\n\nIn the case of Mozilla-based browsers such as Firefox,\
    \ the special property MozUserSelect to prevent text from being selected, or 'text'\
    \ to re-enable it. It is necessary because these browsers will not use the onselectstart\
    \ event, and using this property is less intrusive than capturing the onmowned\
    \ event.\n\n# How To Use It\n\nTo prevent the copying and pasting of the contents\
    \ of a div, you can attach this function to its onselectstart event, like this:\n\
    \n```\nPreventAction('mydiv', 'select', true)\n```\n\nIf a user tries to select\
    \ any text, this plug-in stops the event before it can get going. This is not\
    \ a relatively easy way to prevent copying text from your web pages, but it helps\
    \ prevent text from being inadvertently highlighted when you are using the mouse\
    \ to drag items.\n\nYou can also use it to prevent any event from being dragged\
    \ in the browser or dragged and elsewhere, like this:\n\n```\nPreventAction('myfig',\
    \ 'drag', true)\n```\n\nHere's some code that illustrates these of uses:\n\n```\n\
    <img id='gif' src='il.gif' />\nThe image cannot be dragged.\n<span id='text'>And\
    \ this text is unselectable</span>\n```\n\n```\n<script>\nwindow.onload = function\
    \ () {\n  PreventAction('gif', 'drag', true);\n  PreventAction('text', 'select',\
    \ true);\n}\n</script>\n```\n\nIn the HTML section of the example, a GIF with\
    \ the name il.gif is displayed and the ID of 'gif'. It is followed by some regular\
    \ text and with the ID of 'text'.\n\nBelow that, in the <scripts section, the\
    \ GIF image has its drag property disabled, and the span is made unselectable.\
    \ If you try either of these actions they will fail. However, Internet Explorer\
    \ will allow you to continue the selection within the span if you commence a select\
    \ from outside the span. You can work around this bug by setting the whole document\
    \ as unselectable, like this:\n\n```\nPreventAction(document.body, 'select', true)\n\
    ```"
