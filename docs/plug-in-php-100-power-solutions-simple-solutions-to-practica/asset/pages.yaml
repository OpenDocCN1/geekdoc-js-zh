  md: '# 74 Plug-In JavaScript: 100 Power Solutions


    The previous chapter concentrated on providing a basic subset of core functionality.
    This one does the same, but there are enough plug-ins in the collection now that
    we can start to create some interesting effects, including resizing and repositioning
    objects.


    # 19 ResizeWidth()


    When creating dynamic web pages you will often need to change the dimensions of
    objects. You might do this to emphasize a section by enlarging it, you may allow
    the contents of a page to be rearranged by the user, or you might wish to open
    up elements as forms or light boxes, and so forth.


    With this plug-in, you can resize the width of any object that has a width property,
    as the example div shown in Figure 4-1, which has its width resized to 300 pixels.


    # About the Plug-in


    This plug-in changes the width of an object. It requires the following arguments:


    +   * The ID of an object or the object itself. You can also pass an array of
    objects and/or object IDs.

    * The new width for the object. If id is an array, all the objects referred to
    are set to this width.


    # Variables, Arrays, and Functions


    | | Local integer loop variable |

    | overflow | The object''s style.overflow property |

    | width | The object''s style.width property |

    | HID | Global string variable with value ''hidden'' |

    | Px() | Plug-in to add the suffix ''px'' |


    # How It Works


    This plug-in also offers the multifunction of the O() and S() plug-ins, in which
    you can pass either ID of an object or the object itself, and you can even pass
    an array of IDs and/or change them all at the same time.


    ![](img/faacab81da20861e0f8059a56e67dfa4_103_0.png)


    FIGURE 4-1 Resizing the width of an object'
