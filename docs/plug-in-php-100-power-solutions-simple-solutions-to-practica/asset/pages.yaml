    # How It Works


    This function tracks .onmousemove events and accesses either the e value passed
    to it in browsers other than Internet Explorer, or in Internet Explorer, it accesses
    the window.event property. Using these values it sets the value of the global
    variables MOUSE_X and MOUSE_Y to the X and Y coordinates of the mouse pointer.

    The scrollLeft scrollTop properties of document.documentElement are also accessed
    in Internet Explorer to determine the amount of horizontal and vertical scroll.
    These values are placed in the global variables SCROLL_X and SCROLL_Y. In browsers
    other than Internet Explorer, SCROLL_X and SCROLL_Y are given values based on
    the pageOffset and pageOffsetY properties of window.

    The true is returned to ensure the event is acted on by browser.


