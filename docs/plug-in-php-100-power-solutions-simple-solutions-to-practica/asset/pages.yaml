  md: "# Plug-In JavaScript: 100 Power Solutions\n\nNext, each character in html that\
    \ will have its font changed is processed within a for() loop that the outside\
    \ characters of the group are the smallest, the ones just in them are larger,\
    \ and the largest one is in the center, as follows:\n\n```\nvar j = 0; j < 7;\
    \ ++++)\ntemp += InsVars(\"font size='#+j+'#2c/font\",\n    4 - Math.abs(j - 3),\
    \ html.substr(ctrl + j, 1));\n```\n\nThe part that determines this 4 - Math.abs(j\
    \ - 3), which for the value 0 through 6 of j, gives the following font size values\
    \ (because the Math.abs() function makes all negative numbers: 1, 2, 3, 4, 2,\
    \ 1).\n\nOnce all the font sizes have been calculated and stored in temp using\
    \ the InsVars() plug-in is to insert the values into a string containing <font\
    \ size=...> statements, the innerHTML property of id is assigned this string to\
    \ display it, along with the remaining, unchanged portion of html:\n\n```\nHtml(id,\
    \ temp + html.substr(ctrl + j));\n```\n\nAn if() statement then increments ctrl\
    \ and checks whether it equals the value in len. If so, the animation has finished\
    \ and the following code is executed:\n\n```\nif (++ctrl == len)\n{\n    if (ctrl\
    \ == number)\n{\n        if (O(id).innerText == html)\n        else O(id).textContent\
    \ = html\n\n        O(id).TR_Flag = false\n        clearInterval(id)\n    }\n\
    }\n```\n\nIf the ripple is finished, ctrl is reset and if() statement checks whether\
    \ there are more repeats of the interrupting effect, like:\n\n```\nctrl = 0\n\
    ```\n\nIf the repeats have finished, the value in html is saved back into id as\
    \ text, not HTML (Otherwise, unwanted HTML tags would be added by the browser--the\
    \ time for saving HTML to the property is only when the font sizes are being changed).\n\
    \nNext, the TR_Flag property is set to false to indicate that all ripples have\
    \ completed, and the clearInterval() function is called to stop any future calls\
    \ to the subfunction, passing the value previously stored iniid.\n\nThe function\
    \ returns but will be called up in freq milliseconds if there are still outstanding\
