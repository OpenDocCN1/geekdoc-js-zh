  md: '# Chapter 10: Audio and Visual Effects 293


    # The DismissLB() Subfunction


    This function is called whenever id is clicked. The first thing it does is the
    frame''s opacity back down to 0 and its background color from col2 back to col1,
    like this:


    ```

    Fade(''LB_DIV'', opacity, 0, msecs)

    ColorFade(''LB_DIV'', col2, coll, ''back'', msecs, 1)

    ```


    At the same time, a chain is created to perform three actions in sequence: first,
    fade out id; second, hide id and third, restore scrollbars to document.body, as
    follows:


    Chain(Array(


    ```

    InsVars(''FadeOut Array(''#1'', ''LB_DIV''), #2, 0''), id, msecs)

    InsVars(''Hide Array(''#1'', ''LB_DIV''))'', id)

    S(document.body, ''overflow'', ''auto'')

    ```


    # How To Use It


    To use this link, you need to have an image (or any other object) already prepared.
    Most likely you will also set its style.display attribute to ''none'' so it is
    not visible in the web page, like this:


    ```

    <img id=''photo'' src=''photo6.jpg'' border=''1'' style=''display:none''>

    ```


    Next you can attach the link-in to an event such as an click or onmouseover to
    pop the object in a light box. Here''s an example that you can enable:


    ```

    <button id=''link'' type=''button''>Click Me</button>

    <img id=''photo'' src=''photo6.jpg'' border=''1'' style=''display:none''>

    ```


    ```

    <script>

    window.onload = function () {

    {

    O(''link'').onclick = function () {

    {

    Lightbox(''photo'', ''#888888'', ''000000'', 80, 50, 1)

    }

    }

    </script>

    ```


    The HTML section of this example creates a link to the anonymous inline function,
    along with an image object with the ID ''photo''. The <script> section simply
    contains the function that you can call the Lightbox() plug-in.


    When a light box is in use, none of the elements underneath clickable (or have
    onerror events) will work until the light box is removed. This is because the
    div object it creates covers the entire browser window and has a higher zIndex
    value than everything else the light box contains, which makes it especially useful
    when you wish to force the user to focus on one thing, such as entering log-details
    or accepting notification of an error, and so on.'
