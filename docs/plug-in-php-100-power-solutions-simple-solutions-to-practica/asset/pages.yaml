- img_proc: true
  md: '# About the Author


    Robin Nixon has worked with and written about computers since the early 1980s
    (his first computer was a Tandy TRS 80 Model 1 with a massive 4KB of RAM!). Since
    then, he has written in excess of 500 articles for many of the U.K.’s top computer
    magazines. Plug-in JavaScript is his sixth book.


    Robin lives on the southeast coast of England with his wife Julie, who is a trained
    nurse, and five children. He also finds time to foster three disabled children
    and works full time from home as a technical author.


    # Also by Robin Nixon


    +   * The PC Companion, Sigma Press, 1993, ISBN 978-150585138

    * Theing Advanced User Guide, Sigma Press, 1993, ISBN 978-150585152

    * Learning PHP, MySQL, and JavaScript, O’Reilly, 2009, ISBN 978-0596157135

    * Ubuntu: Up and Running, O’Reilly, 2010, ISBN 978-0596804848

    * Plug-in PHP, McGraw-Hill Professional, 2010, ISBN 978-0071666596


    # About the Technical Editor


    Alan Solis has more than 30 years experience designing, writing, and maintaining
    software for companies ranging from small start-ups to large corporations. He
    currently designs and maintains websites and web applications using PHP, JavaScript,
    Java, and various databases.


    In his spare time, Alan enjoys creative writing and is a published short story
    and poetry author. Alan lives in the San Jose, California area with his wife,
    Cheryl.'
