    # How It Works


    This-plugin makes four different calls in turn because various browsers approach
    the subject of opacity in different ways. Fortunately, the none of the methods
    clash with each other, so a lot of if...then code is not necessary.


    The first line for most browsers (as Opera, Google Chrome, and recent versions
    of Apple Safari) looks like this:


    ```

    S(id, ''opacity'', percent / 100)

