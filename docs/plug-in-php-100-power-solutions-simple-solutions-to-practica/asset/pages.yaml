  md: '# Plug-In JavaScript: 100 Power Solutions


    Otherwise, the cookie is looked up by setting the variable start to point to the
    string containing the value in name followed by =, using a call to indexOf().
    If it is not found, a value of -1 is returned, so the value false is returned
    by the plug-in:


    ```

    var start = document.cookie.indexOf(name + ''='')

    if (start == -1) return false

    ```


    If both these tests pass, then the cookie has been found, so start is set to the
    portion of the cookie string directly after the name and sign:


    ```

    start += name.length + 1

    ```


    The variable end is then set to the end of the string by finding the character
    ; that terminates all cookie strings by the last one:


    ```

    var end = document.cookie.indexOf('';'');

    ```


    If it is not found, it means this was the last cookie and it is the end of the
    string. The following line of code returns the location of the following ,, or
    the end of the string and places it back in end:


    ```

    end = (end == -1) ? document.cookie.length : end

    ```


    Finally, the cookie value is returned:


    ```

    return unescape(document.cookie.substring(start, end))

    ```


    # Erasing Cookie


    The code erase makes a use of a recursive call by passing the cookie name and
    a value of an empty string, along with one minute in the past, back to itself
    with an action argument of ''save'':


    ```

    ProcessCookie(''save'', name, '''', -60)

    ```


    # To Use It


    To use this-plugin, put the action in the action argument, which should be a value
    of ''save'', ''read'', or ''erase'', and then pass the cookie''s ''password''
    to the value ''mypass'' and any other values needed.


    For example, set the cookie ''password'' to the value ''mypass'' with an expiry
    date of one hour from now, then you would use the following:


    ```

    ProcessCookie(''save'', ''password'', ''mypass'', 60 * 60, ''//'')

    ```


    Once a cookie has set, you can read it back like this:


    ```

    value = ProcessCookie(''read'', ''password'', '''', '''', ''/ ''/'')

    ```


    Or, you can delete a cookie like this:


    ```

    ProcessCookie(''erase'', ''password'', '''', '''', ''/'')

    ```'
