    # About the Plug-In


    The plug-in requires a pair of arrays of heading and contents objects and then
    displays a folding menu based on the styles and actions that you supply. It takes
    the following arguments:


    +   - **headings** An array of objects and/or object IDs

    - **contents** An array of objects and/or object IDs

    - **action** The menu action type, either ''hover'' or ''click''

    - **type** The type of transitions to use, or 1, one out of ''fade'', ''inflate'',
    ''zoom'', or ''instant''

    - **multi** If type is ''inflate'' or ''zoom'', these arguments specify the width,
    height, or dimensions will be modified during transitions

    - **mssecs11** The transition time in milliseconds of popping down

    - **mssecs2** The transition time in milliseconds of popping up

    - **interruptible** If true or 1, the PopUp() and PopDown() plug-in is interrupted
    by another call on the same id


    # Variables, Arrays, and Functions


    | j | Local variable for iterating through the headings array |

    |---||

    | PO_C | Property of each heading containing the object in the contents array
    which it refers |

    | PO_IsUp | Property of object in the contents array, which is false when an object
    is popped down, otherwise the object is popped up |

    | cursor | Property of each heading''s style object used for changing the mouse
    pointer when over the heading |'
