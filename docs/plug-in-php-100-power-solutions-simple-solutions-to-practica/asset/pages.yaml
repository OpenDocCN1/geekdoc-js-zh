  md: "# 234 Plug-In JavaScript: 100 Power Solutions\n\n### The ContextUp() Subfunction\n\
    The purpose of this subsection is to react to a right-click event on id. The first\
    \ thing it\ndoes, though, is check whether it can go ahead by examining the state\
    \ of flags created by the\n(), PopDown(), Fade(), Deflate(), and Reflate() plug-ins,\
    \ like this:\n\n```\nif (O(contents).PO_IsUp ||\n    O(contents).FA_Flag ||\n\
    \    O(contents).DF_Flag) return false\n```\n\nIf any of these is true, then either\
    \ contents is already popped up, or one of the\ntransition types is already in\
    \ action on contents, so the plug-returns.\nIf the plug can proceed, it sets the\
    \ local variables x and y to the current\ncoordinates of the mouse cursor and\
    \ moves the popped down contents to that location\na a call to Goto(). It calls\
    \ PopUp() to pop it, like this:\n\n```\nvar x = MOUSE_X\nvar y = MOUSE_Y\nGoTo(contents,\
    \ x, y)\nPopUp(contents, type, w, h, msecs, 1)\n```\n\nNext, it's necessary to\
    \ ensure that any objects that have been created or had their zIndex\nproperty\
    \ changed since the contents div was created will not appear in front of it, so\
    \ the\nobject's zindex property is set to the value in ZINDEX plus index. ZINDEX\
    \ is the global variable\nthat tracks the highest zindex so far used by an object,\
    \ adding 1 to this value\nenures that contents will appear on top of every other\
    \ object in the browser. Here's the\nstatement that does this:\n\n```\nS(contents).zIndex\
    \ = ZINDEX + 1\n```\n\nThe plug-needs a way to determine whether the mouse has\
    \ moved out of the area\noccupied by contents, and therefore it needs to be popped\
    \ down. You might think\nat attaching to the onmousemove event of contents would\
    \ do the trick, but sadly,\nit won't work so reliably and in all. The reason for\
    \ this is if you include a form input or\n elements within contents, when the\
    \ mouse passes over them the browser will\nthink it has passed out of the contents\
    \ object and prematurely trigger the\nommouseout event.\n\nTherefore, it is necessary\
    \ to track the position of the mouse and pop the object\nif it moves out of the\
    \ object's bounds. To do this, a repeating interrupt is created to call\nu the\
    \ subfunction ContextDown() every INTERVAL milliseconds to see whether the\nmouse\
    \ is still inside the object, as follows:\n\n```\nO(id).zIndex = setInterval(ContextDown,\
    \ INTERVAL)\n```\n\nFinally, the return statement returns a value of false to\
    \ tell the browser to cancel\npulling up the standard right-click menu:\n\n```\n\
    return false\n```"
