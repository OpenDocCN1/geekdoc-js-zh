  md: '# 98 Plug-In JavaScript: 100 Solutions


    Any of the most impressive effects you''ll see on websites are also the simplest.
    A smooth fade from one image to another is often far more beautiful than other
    wipe or dissolve transformations. Likewise, instantly revealing or hiding an object,
    when done well, is clean and easy on the eye.

    This chapter focuses on these types of effects, ranging from the visibility (or
    invisibility) of an object to fading in and out, fading between objects, and so
    on. The plug-ins in this chapter also provide the basic functionality required
    by later plug-ins—particularly the menu and navigating plug-ins in Chapter 8.


    # 31 Invisible()


    To into this chapter, we''ll begin with a few short and sweet plug-ins that every
    JavaScript programmer needs in their toolkit. The first one is Invisible(), which
    makes an object disappear from a web page while the space it occupies remains,
    as opposed to hiding an object which collapses and causes elements around it to
    assume its space (see Plug-In 40, Hide() for effect).

    Figure 5-1 shows a span with "You see me...” followed by some plain text not in
    a div that reads "and soon you won''.\ An alert has been raised to show these
    elements before the call to Invisible() is made. Figure 5-2 shows what happens
    after clicking the alert: the shaded text in the span is invisible, but the other
    text snippet remains in place, demonstrating that the span is still there, but
    not visible.


    # About the Plug-In


    This plug-in makes an object invisible while retaining the object''s position
    and dimensions. It requires the following argument:


    +   - id An object, object ID, or an array of objects and/ object IDs


    # Variables, Arrays, and Functions


    | visibility | The style.visibility property of the object(s) |

    | HID | Global variable with the value ''hidden'' |


    ![](img/faacab81da20861e0f8059a56e67dfa4_127_0.png)


    FIGURE 5-1 The shaded area a span set to disappear when the alert is clicked.'
