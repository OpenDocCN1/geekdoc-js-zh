  md: '# GetWindowWidth()


    There are many reasons to need the know of the browser window, the most obvious
    of this is so that you can determine which objects you can display where in a
    dynamically generated website. This plug-in gives you that exact information,
    as shown by the alert box in Figure 4-7. It also takes into account scroll bars
    that might reduce the available width.


    # About the Plug-In


    This function will tell you the width of the browser window to the nearest pixel.
    It doesn’t require any arguments and returns the width as an integer.


    # Variables, Arrays, and Functions


    | de | Local object copy of document.documentElement |

    |---|---|

    | BROWSER | Global variable containing the browser name |

    | barwidth | Local integer variable set if a vertical scroll bar exists |

    | scrollHeight | de.scrollHeight property |

    | client | de.clientHeight property |

    | innerWidth | window.innerWidth property |

    | clientWidth | de.clientWidth and document.body.clientWidth properties |


    # How It Works


    This-in first copies the document.documentElement object into de to provide a
    much shorter name, reducing the amount of code to enter. Next, if the browser
    is not Explorer as determined by the value in the global variable BROWSER, then
    the local variable barwidth is set to 17 if the value in de.scrollHeight is greater
    than that in de.clientHeight.


    ![](img/faacab81da20861e0f8059a56e67dfa4_113_0.png)


    FIGURE 4-7 Determining the available width of the browser window'
  merge: -1
  pgno: 113
- img_proc: true
  md: "# Chapter 4: Location and Dimensions 85\n\nThe de.scrollHeight value is bigger\
    \ when there is more web below the bottom that can be scrolled to. In that case,\
    \ there will be a scroll bar, which is given the value of 17, which is the default\
    \ width of scrollbars in all browsers. This value is subtracted from the full\
    \ window width and the result is returned.\n\nOtherwise, as is often the case\
    \ if the browser is Internet Explorer, the code simply returns the value of whichever\
    \ has a value, de.clientWidth or document.body.clientWidth (allowing for strict\
    \ or quirks mode). This value already takes into account any scroll bar, so for\
    \ no code is returned.\n\n# How To Use It\n\nTo use this plug-in, simply call\
    \ it and use the value returned, as in the following example, which passes the\
    \ returned value to an alert ( ) statement, where it is displayed:\n\n```\n<script>\n\
    window.onload = function() {\n  alert('This browser has a window width of: ' +\
    \ GetWindowWidth())\n}\n</script>\n```\n\n# The Plug-in\n\n```\nfunction GetWindowWidth()\
    \ {\n  var de = document.documentElement\n  if (BROWSER != 'IE') {\n    var barwidth\
    \ = de.scrollHeight > de.clientHeight ? 17 : 0\n    return window.innerWidth -\
    \ barwidth\n  }\n  return de.clientWidth || document.body.clientWidth\n}\n```\n\
    \n# GetWindowHeight()\n\nThis is the companion plug-in to GetWindowWidth(). It\
    \ returns the height of the browser window, bearing in mind any scroll bars. In\
    \ Figure 4-8 the height of the usable area of this browser has been determined\
    \ by this plug-in to be 124 pixels.\n\n# About the Plug-in\n\nThis plug-in takes\
    \ no arguments and returns the height of the current window, taking any scroll\
    \ bars into account."
