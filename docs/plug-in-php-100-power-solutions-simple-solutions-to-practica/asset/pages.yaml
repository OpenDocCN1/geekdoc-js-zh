  md: "# Chapter 3: The Core Plug-ins 49\n\n```\nfunction simpleInterrupt() {\n  var\
    \ k = GetLastKey()\n\n  if (k == 'Enter') {\n    k = '';\n    clearInterval(interrupt)\n\
    \  }\n  O(id).innerHTML += k\n  }\n</script>\n```\n\nTo make this, a span is created\
    \ in the input which will be placed. The JavaScript code makes a call to a new\
    \ function called input(), passing the ID of the span. The input() function then\
    \ sets up a repeating interrupt using setInterval() to the subsection simpleInterrupt().\n\
    \nThe simpleInterrupt() function then calls GetLastKey() each time it is called.\
    \ If the user has pressed the Enter key and k is assigned the value '. ' (a period),\
    \ and the interrupt is disabled by clearInterval(), with the interrupt ID appended\
    \ to it.\n\nFinally, the innerHTML property of the object id has the latest key\
    \ value appended to it. If the value is the empty string, then nothing is appended.\n\
    \nAll your code to do then is look at the end of the string to see if it is the\
    \ period character to indicate that the user has pressed the string. Your code\
    \ removes that character and uses the remainder of it. Alternatively, you can\
    \ use a different kind of input marker. Whatever you do, if you want to create\
    \ an input routine rather than a ready-made one such as <input type='text'> tag,\
    \ you have to go through all these switches and roundarounds of driven calls,\
    \ because that's how JavaScript works.\n\nFor a bit of fun, if you set the input\
    \ something hidden rather than in a span, you can check for a sequence of characters\
    \ to be entered—like entering cheat codes into a game—or a recognizable sequence\
    \ is, you can trigger a bonus feature.\n\n# The Plug-in\n\n```\nfunction GetLastKey()\
    \ {\n  var k = KEY_PRESS\n  KEY_PRESS = '';\n  return k\n}\n```\n\n![](img/faacab81da20861e0f8059a56e67dfa4_78_0.png)\n\
