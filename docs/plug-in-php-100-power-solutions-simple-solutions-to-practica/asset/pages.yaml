    # Changing the Opacity


    The last thing this subfunction does is call the Opacity() plug-in to set the
    current opacity, with this line of code:


    ```

    Opacity(id, O(id).FA_Level)

    ```


    If clearInterval() has been called, then that''s the end of it; otherwise, INTERVAL
    milliseconds later DoFade() will get called again, and a slightly different value
    for FA_Level will be computed and passed to the Opacity() plug-in, until the transition
    has finished.


    > Note We spent a lot of time going over this particular plug-in because of the
    other animation and transition plug-ins work in a similar fashion. Once you understand
    this one, you will easily see how the others work.


    # How To Use It


    To make an object fade, you would use a command as this:


    ```

    Fade(''object'', 100, 0, 1000, 0)

    ```


    This will fade the object starting out with full opacity down to being totally
    transparent, over the course of one second. The final argument of 0 prevents the
    fade from being interrupted.

    You can also embed calls to this plug-in within HTML, like this:


    ```

    <a href="http://abc.com" onmouseover="Fade(''object'', 75, 100, 500, 1)">My Link</a>

