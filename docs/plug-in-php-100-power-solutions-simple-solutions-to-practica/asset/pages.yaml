  md: '# Introduction XXII


    feature—because the chances are that the module you need (or one very similar)
    can be found in this book as a plug-in. Even if it isn''t, because each and every
    one is broken down into component parts and explained in detail, you can cherry-pick
    code segments from different plug-ins to build your own.


    # About the Plug-ins


    All this book''s plug-ins are ready to run and can be typed in (if you don''t
    have Internet access) or downloaded from pluginjavascript.com, where they are
    stored as a complete collection in a single file.


    When you visit the website, you can navigate through the plug-ins by chapter and
    view the JavaScript code highlighted in color for clarity. From there, you can
    copy, paste, or download the plug-ins directly to your computer.


    # What Is and Not Included


    Although the first aim of this book is to provide newcomers to JavaScript with
    a comprehensive resource of functions and routines to draw on, it has a secondary
    goal, which is to help you move up to the next level and build your programming
    toolkit. Therefore, all the plug-ins are thoroughly documented and explained in
    detail, and advice is given on ways to improve and extend them, as well as how
    to adapt them to your requirements.


    While this isn''t a programming manual or a teaching guide, I do hope that reading
    through the explanations, rather than just including the plug-ins in your projects,
    you will pick up a few tips and tricks that many programmers take years to discover,
    and by osmosis you learn more about the JavaScript programming language.


    # Plug-in License


    You are free to use any of the plug-ins in this book in your own projects, and
    you may modify them as necessary without attributing this book—although if you
    do give credit, it will always be appreciated.


    However, you may not sell, give away, or otherwise distribute the plug-ins themselves
    in any manner, whether printed or in electronic format, without the written permission
    of the publisher.


    # Companion Website


    A companion website (pluginjavascript.com) accompanies this book, where all 100
    plug-ins are available to download, along with example code for you to experiment
    with.


    The best is used in conjunction with this book. As you read a chapter, call it
    up on the website, and you can view each plug-in onscreen with color-highlighted
    syntax. This makes it very easy to see the structure of each.


    Then, when you wish, you can click a link to copy and paste code right into your
    own programs. Or, if you prefer, you can download all the plug-ins to your computer
    and from transfer them to your own website.'
