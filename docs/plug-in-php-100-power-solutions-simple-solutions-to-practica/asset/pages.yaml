    \n```\n<script>\nwindow.onload = function() {\n  ColorFade('t', '#ffff', '#0000ff',\
    \ 'text', 2000, 0)\n  ColorFade('t', '#00ff00', '#ffff', 'back', 2000, 0)\n}\n\
    O('m').mouseover = function () { fade('#000000', '#0088ff'); }\nO('m').mouseout\
    \ = function () { fade('#0088ff', '#000000'); }\n\n  ColorFade('m', a, b, 'text',\
    \ 200, 1)\n}\n</script>\n```\n\nThe text contains two spans with the IDs 't' and\
    \ 'm'. In the <script> section, the first two commands set both the background\
    \ and text colors of 't' to transition between yellow (#ffff00) and blue (#0000ff).\
