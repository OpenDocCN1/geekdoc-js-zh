  md: '# 340 Plug-In JavaScript: 100 Power Solutions


    Form validation is something you must do on your web server to ensure that you
    receive the data that is required and remove any attempts at hacking or compromising
    your server or the data on it. However, it is very helpful to your users if you
    also provide validation directly in the browser. For example, it can be particularly
    helpful to provide extra assistance when a user is filling in a form to save if
    it fails validation at the server. It cuts down on bandwidth usage and keeps the
    optimum number of concurrent users on the server. This chapter includes plug-ins
    to provide extra hints for blank fields that must be filled out, to provide the
    ability to resize text areas if a user types more than the expected amount of
    text, to check that e-mail addresses and passwords are valid, to clean up input
    strings, and to check that credit card number checks validates.


    # Plugin 90 FieldPrompt()


    When a form has not been entered, there''s a large area of white space that isn''t
    being used. With this plug-in you can display a prompt in the field that disappears
    as soon as the user starts typing into it. Figure 12-1 shows two empty input fields
    containing prompts that were created using this plug-in, in a similar way to the
    new HTML5 `placeholder` feature.


    # About the Plug-In


    This plug-in takes a form input object, and if it is blank, displays a prompt
    of your choosing. It requires the following arguments:


    +   * id An object or object ID—cannot be an array

    * prompt The prompt to display

    * inputcolor The color to use for displaying user input

    * promptcolor The color in which to display the font

    * promptstyle The font style to use for the prompt, as ‘italic’


    Figure 12-1

    This plug-in provides additional information to your users.


    ![](img/faacab81da20861e0f8059a56e67dfa4_369_0.png)'
