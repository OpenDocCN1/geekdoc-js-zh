    # How It Works


    This plug-in assigns the length of the password to len and initializes valid with
    the true value, which it will retain if it passes the tests to determine its validity:


    ```

    var len = pass.length

    var valid = true

    ```


    Next, pass is checked to ensure it is within the lengths required by the min and
    max arguments, and valid is assigned the value false if not:


    ```

    if (len < min || len > max) valid = false

    ```


    The following tests are made only if the argument they work from is true or has
    the value 1. For example, the following statement returns false if the argument
    upper is true or 1 and there is not at least one uppercase letter in pass:


    ```

    else if (upper && /[A-Z]/.test(pass)) valid = false

    ```


    The following three statements are the same for lowercase, digits, and punctuation(nonalphanumericcharacters):


    ```

    else if (lower && /[a-z]/.test(pass)) valid = false

    else if (dig && /[0-9]/.test(pass)) valid = false

    else if (punct && /[^a-zA-Z0-9]/.test(pass)) valid = false

    ```


    If pass meets all tests, valid will retain its initial value of true, which is
    then returned; otherwise, one of the tests will set valid to false, and that value
    will be returned:


    ```

    return valid

    ```


