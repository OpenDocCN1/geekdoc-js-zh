    This example creates three divs and simulated lists in them using <a> tags—in
    the real world you use each object has a unique ID. The &rsquo; HTML entity creates
    pairs of right brackets.

    In the script section, the ID array is populated with the object names and the
    Hide() function makes them invisible so they display only when the menus have
    been created—and you shouldn''t see them jump around. It also helps to hide any
    content that might make some browsers return a value that makes room for a horizontal
    scroll bar, ensuring that everything centers correctly.


    After resizing the objects, setting style positions, and assigning their colors,
    it''s then to show the objects again with Show(). In fact, you must do so in order
    for the plug-in to be able to look up their dimensions. Finally, the HoverSlideMenu
    plug-in is called and the scroll menus are displayed.'
