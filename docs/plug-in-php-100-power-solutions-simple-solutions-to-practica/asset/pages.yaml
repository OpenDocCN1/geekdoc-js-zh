    # About the Plug-in


    Each time this plug-in is called, the object or objects passed to it change their
    visibility to the opposite state. It requires the following argument:


    +   - id An object, object ID, or an array of objects and/or object IDs


    # Variables, Arrays, and Functions


    | j | Local integer for indexing id if it is an array |

    | visibility | The object''s style.visibility property |

    | HID | Global variable with the value ''hidden'' |

    | VIS | Global variable with the value ''visible'' |


    # How It Works


    Plug-in uses the recursive trick that many others use to handle arrays of and/
    object IDs, as well as single objects. It does this using the instanceof operator
    to test whether id is array. If it is, the array is iterated through the local
    variable j in a for loop, individually calling the function recursively for each
    element of the array. Once it does, the function returns.


    If id is not array, the S() plug-in, along with the inverse value of the object''s
    style.visibility property, this is achieved using the following ternary expression,
    along with the two variables HID and VIS, which stand for ''hidden'' and ''visible'':


    ```

    S(id).visibility = (S(id).visibility == HID) ? VIS : HID

    ```


    In plain English, this statement equates to ''If the current value of the object''s
    visibility property is ''hidden'', return the value ''visible''; otherwise return
    the value ''hidden''. Everything after the first equals and before the question
    mark is the test. The value immediately following it is the one to return if the
    result is true, and the final value is to be returned if the result is false.


    All this has the effect of applying the opposite state of the visibility property
    to the object.


    # How To Use It


    You can call this plug-in from within JavaScript, like this:


    ```

    VisibilityToggle(''myobject'')

    ```


    Or you can pass an array of objects, like this:


    ```

    ids = Array(''firstobj'', ''secondobj'', ''thirdobj'')

    VisibilityToggle(ids)

    ```


    Alternatively, you can incorporate the call within an HTML statement, as in the
    following two lines of HTML that cause the text in the span ''toggle'' to switch'
