  md: 'The id FA_Level is also set to start because that is the property that will
    be manipulated to track the opacity level on each interrupt. These statements
    are placed within an else segment, like this:


    ```

    {

    O(id).FA_Start = start

    O(id).FA_Level = start

    }

    ```


    # The Remaining Assignments


    In the final lines of the setup portion of this plug-in, a few other properties
    of it have to be assigned, as follows:


    ```

    O(id).FA_Flag = true

    O(id).FA_End = end

    O(id).FA_Int = interruptible

    ```


    The first line sets the object''s FA_Flag to true, and this is used in other parts
    of the code to decide whether or not the plug-in can enter (reentered). The second
    line makes a copy of the end value in the new property FA_End, and last assigns
    the value in interruptible to the property FA_Int.


    Next, the amount by which change the opacity has to be stored in FA_Step. This
    is either stepal if the opacity is to increase, or -step if it will be decreasing,
    determined by this line:


    ```

    O(id).FA_Step = end > O(id).FA_Start ? stepval : -step

    ```


    # Assisting the FadeToggle() Plug-in


    The FadeToggle() plug-in, which is covered later in this chapter, needs a way
    to know whether an object has been faded in or out. To give this information,
    the new property of id, is set to true if the object is being faded out, or false
    if it is fading in, like this:


    ```

    O(id).Fadeout = end < O(id).FA_Start ? true : false

    ```


    # Initiating the Interrupts


    The last line of the setup portion of the plug-in sets the repeating interrupts
    in the following way:


    ```

    O(id).FA_IID = setInterval(DoFade, INTERVAL)

    ```


    This starts off a repeating interrupt that will call the DoFade() function every
    INTERVAL milliseconds. The value returned by calling setInterval() is saved in
    the new property of FA_IID, as is needed later when it''s time to cancel the interrupts.'
