  md: '# 2 Plug-In JavaScript: 100 Solutions


    Because JavaScript is supported by all major browsers, you might think that setting
    yourself as a JavaScript programmer is as easy as having a text editor and a web
    browser. Well, you could get by with those, but there''s actually a lot more to
    it if you want to produce code efficiently, quickly, and with the minimum of bugs.


    First of all, although JavaScript is available on almost all web browsers it varies
    slightly between them and the way it implements certain features. This means that
    you need to be able to test your code on all the main browsers to ensure that
    it works correctly in all cases. You really need to have access to a Windows computer,
    because recent versions of Internet Explorer (IE) are available only for that
    operating system.


    # Downloading and Installing Web Browsers


    Table 1-1 lists the few major browsers I recommend and their Internet download
    locations. While all of them can be installed on a Windows PC, some are not available
    for Mac OS or Linux. The web pages at these URLs are smart and offer the correct
    version to download according to your operating system, if available.


    Before proceeding with this book I recommend that ensure you have installed all
    of these browsers on your computer as you can. If you''re running any version
    of Windows XP onward, you will be able to install all of them, but on other operating
    systems it''s not quite easy. For example, because of IE the Mac was made many
    years ago since IE version6, you can install the major browsers on Mac OS except
    for Microsoft Internet Explorer. And, although it''s possible to use the windows
    applications interface on a Mac and run Internet Explorer IE, I have found it
    to be a tedious process with inconsistent results, and therefore wouldn''t suggest
    you rely on those websites that take screenshots of a web page in different browsers,
    because they can''t tell you whether the mouse, keyboard, and other features are
    working well, or even at all.


    Instead, your best option is either to perform a dual install of Windows alongside
    Mac OS, or ensure you have access to a Windows PC. After all, unless you intend
    to develop only for Mac computers, people using a Windows operating system will
    be represent by the majority of your users.


    As for Linux, it does not have access to Internet Explorer, there is no version
    of Safari either, although the other browsers do come in Linux flavors. And, with
    OS X, while various solutions exist that incorporate Wine for running Internet
    Explorer, they seem to work only with some distributions and not others, so it
    can be a bit of a minefield trying to find a bulletproof way to run Windows browsers
    on Linux.


