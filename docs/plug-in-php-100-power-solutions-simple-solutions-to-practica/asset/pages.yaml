  md: '# 232 Plug-In JavaScript: 100 Power Solutions


    # ContextMenu()


    With this plug-in, you can replace the standard mouse right-click menu with your
    own. Much more than a way to block casual users from viewing the source of the
    page, the ContextMenu plug-in lets you create entire entries of HTML and pop them
    up at the cursor position when the user clicks the right mouse button. In Figure
    8-7, a simple menu for a hardware store has popped up with a right-click.


    # About the Plug-In


    This plug-in requires an object that, when right-clicked, should pop up a menu,
    which you also pass to. It takes the following arguments:


    +   * An object to which the right-click should be attached—generally, you will
    attach to the document object, but you can be more specific and attach different
    context menus (arrays of objects that are not supported)

    * An object containing the menu to be displayed

    * The type of effect for popping the menu up and down, out of ''fade'', ''inflate'',
    ''zoom'', or ''instant''

    * If applicable and this argument is true or 1, the object''s width will be modified
    during the transition

    * If applicable and this argument is true or 1, the object''s height will be modified
    during the transition

    * The number of milliseconds the pop-up transition should take


    Figure 8-7nNow you can create your right-click menus.


    ![](img/faacab81da20861e0f8059a56e67dfa4_261_0.png)'
