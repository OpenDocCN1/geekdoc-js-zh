    # PopUp()


    This is the partner-plug-in for PopDown(). With it, you can pop an object that
    has previously popped down. Figure 8-3 extends the one in the PopDown() plug-in
    by providing four spans, which you can pass the mouse over and out to pop an object
    down and back up again.


    The Plug-in

    This plug-in takes an object and restores its state using a variety of styles.
    It requires the following arguments:


    +   - An object or object ID or an array of objects and/or object IDs

    - The type of pop-up, out of ''fade'', ''inflate'', ''zoom'', or ''instant''

    - If true or 1, the width of the object (where applicable) will expand

    - If true or 1, the height of the object (where applicable) will expand

    - msecs The milliseconds of the transition should take, except for the type ''instant'',
    which uses no timing

    - interruptible If true or 1, the plug-in can be interrupted with another call
    on the same object


    # Variables, Arrays, and Functions


    | j | Local variable for iterating id if it is an array |

    | PO_IsUp | Property of id that is false if it is popped down, otherwise it is
    popped up |

    | FadeIn() | Plug-in to fade in an object over time |

    | Reflate() | Plug-in to expand an object''s dimensions over time |

    | ZoomRestore() | Plug-in to zoom an object around its center point |

    | Hide() | Plug-in to show an object that has been hidden |

    | InsVars() | Plug-in to insert values into a string |


    Figure 8-3

    With this plug-in you can pop objects up again.


