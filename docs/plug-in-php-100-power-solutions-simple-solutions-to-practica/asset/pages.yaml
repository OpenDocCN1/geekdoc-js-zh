  md: '# Chapter 8: Menus and Navigation 249


    However, when I set up an Internet radio station in the 1990s, I used pop-ups
    to get effect by implementing them as an audio player console so that people could
    listen to the radio while they continued to surf in the main browser window. Perhaps
    partly to the novelty, of the website''s visitors kept these pop-ups open for
    long periods as they listened to ours.


    Even they have a bad name nowadays, pop-ups have plenty of sensible uses, such
    as providing alerts and instant message notifications, for example. This plugin
    provides a versatile in-browser pop-up that''s more user friendly than opening
    a new browser pop-up which will only get blocked. It also gives the user full
    control, as it can be moved around the browser and is easily dismissible.


    With this plugin, you can ask a user for their login details, display private
    messages from another user in a forum, provide a selection of options, and so
    on. Or, in Figure 8-12, you can pop up a window to provide further details when
    a user clicks a link. The great thing about it is that the user has full control.
    You can keep the window raised and moved it to reveal any content it was covering,
    or can simply close it.


    # About the Plug-In


    This plugin creates an in-browser pop-up window that can be moved by the user
    and also popped back again. It requires the following arguments:


    +   - An object or object ID identifying the main container—this may not be an
    array

    -* headerid An object or object ID identifying the draggable header

    -* closeid An object or object ID identifying the close button

    -* &y The top left coordinates of the pop-up


    | Figure 8-12 |

    | Creating an browser pop-up window |


    ![](img/faacab81da20861e0f8059a56e67dfa4_278_0.png)'
