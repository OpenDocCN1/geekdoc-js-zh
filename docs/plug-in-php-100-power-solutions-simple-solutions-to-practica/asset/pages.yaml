  md: '# Plug-In JavaScript: 100 Power Solutions


    ![](img/faacab81da20861e0f8059a56e67dfa4_95_0.png)


    Figure 3-15

    Plug-in makes it easy to insert values into strings.


    This example JavaScript looks like this:


    ```

    ```javascript

    alert(InsVars("The product of #1 and #2 is #3",", 6, 7, 6 * 7));

    ```

    ```


    # Variables, Arrays, and Functions


    | tmp | Local variable containing the string to process |

    | arguments | Array of arguments passed to the plug-in |

    | replace() | JavaScript function to replace strings in a string |

    | RegExp() | JavaScript function to create a regular expression |


    # How It Works


    This plug-in makes use of the handy fact JavaScript passes an array to every function
    that is called. This array is arguments, and each element of it is one of the
    values that has been passed to the function.


    Therefore, the first element is extracted and placed in tmp, a local variable.
    This is the string in which to make the variable substitutions, like this:


    ```

    var tmp = arguments[0]

    ```


    Then a for() loop is used to iterate through each remaining element. If there
    is a substring with ''#1'' within the string tmp, the value is inserted in its
    place. The same happens for ''#2'', ''#3'', and any number of similar substitutions,
    with each being replaced by the next in line of values passed to the plug-in,
    like this:


    ```

    tmp = tmp.replace(new RegExp(''#'' + j, ''g''), arguments[j])

    ```


    To allow one value to be inserted in many places in a string, a global replace
    is enabled by using the RegExp() object to create a new regular expression with
    the value ''g'' supplied to indicate a global search and/or replace.


    Finally, the modified tmp string is returned.


    # How To Use It


    To insert values into a string using InsVars(), you call it up in the following
    manner:


    ```

    string = InsVars("The product of #1 and #2 is #3", 6, 7, 6 * 7)

    ```'
