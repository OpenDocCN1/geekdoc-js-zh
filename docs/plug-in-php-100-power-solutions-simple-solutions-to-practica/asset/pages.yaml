    # The Slideshow() Subfunction


    The job of this function is to transition a fade between two images and initiate
    an interrupt to call itself again when the next transition is due (unless it is
    cancelled).


    The first thing this function does is load the image with the current value in
    the images array, as indexed by index. The first time it calls this, nothing happens
    since the same image has already been loaded. However, on all future transitions
    it has the effect of taking the picture that is being displayed in the second
    image and duplicating it in the first, so that they show the same picture:


    ```

    O(''SS_IMG1'').src = images[index]

    ```


    Since both images are the same picture, it is safe to set the first one to fully
    visible and the second one to invisible, like:


    ```

    Opacity(''SS_IMG1'', 100)

    Opacity(''SS_IMG2'', 0)

    ```


    Having made this swap, the index variable is incremented to point to the next
    picture in the slide show, and if it becomes larger than the number of images
    in the images array, it is reset to 0 (using the ++ operator) to start again at
    the beginning, as follows:


    ```

    index = ++index % len

