  md: '# Chapter 5: Visibility


    # # TheDoFade() Subfunction


    This function is a subfunction of Fade() and is known as a private method or private
    function. Functions share all the local variables of the parent function, so there''s
    no need to pass them as arguments, and they can only be used by the parent function,
    they don''t clutter up the namespace.


    This makes them ideal to use interrupt or event driven functions, which is exactly
    what I have done in this plug-in. Every INTERVAL milliseconds (30 by default),
    DoFade() is called by JavaScript. It has one main job, is to change the opacity
    of id by a little. The following line is the one that changes for this:


    ```

    O(id).FA_Level += O(id).FA_Step

    ```


    This adds the value of the FA_Step property of id to its FA_Level property. If
    FA_Step is positive, the value is added, but if it is negative it is subtracted
    (for example 100 + -3 is 97, because the first + ignored).


    # # If Final Opacity Has Been Reached


    Having derived this new value, it is time to check whether it is the final value,
    and so the animation is completed. The code to do is slightly verbose:


    ```

    O(id).FA_Level >= Math.max(O(id).FA_Start, O(id).FA_End) ||

    O(id).FA_Level <= Math.min(O(id).FA_Start, O(id).FA_End)

    ```


    Essentially, it checks whether the current opacity of FA_Level has reached the
    final value (in FA_End). If it is greater or (less than, in the case of decreasing)
    the final value, the following code is executed:


    ```

    O(id).FA_Level = O(id).FA_End

    O(id).FA_Flag = false

    clearInterval(O(id).FA_IID)

    ```


    In this section, the value of FA_Level is set to the exact value in FA_End. This
    one final frame of animation is always required to ensure the correct final opacity
    is reached.


    After this FA_Flag property of id is set to false that the fade has finished.
    This is immediately followed by a call to clearInterval() with the value that
    was saved in the FA_IID property. This cancels further interrupts.


    # # The CB Argument


    The final statement in this { } is as follows:


    ```

    if (typeof cb != UNDEF) eval(cb)

    ```


    It checks the argument passed in CB (if any) and uses the eval() function to evaluate
    it. This type of procedure is called callback and by calling the plugin-in. In
    a nutshell, now that this plug-in has completed running, this allows any plug-ins
    to be chained to follow this one to their execution. However, this happens only
    if the argument has a value.'
