  md: "# 16 Plug-In JavaScript: 100 Solutions\n\nRemembering these two sections of\
    \ HTML are part of the same document, we bring them together inside an `<html>`\
    \ tag, like this:\n\n```\n<html>\n<head>\n  <meta name=\"robots\" content=\"index,\
    \ follow\" />\n  <title>Hello</title>\n</head>\n<body>\n  <a href=\"http://google.com\"\
    >Visit Google</a>\n  <form id=\"login\" method=\"post\" action=\"program.php\"\
    >\n    <input id=\"name\" type=\"text\" name=\"username\" value=\"fred\" />\n\
    \    <input type=\"submit\" />\n  </form>\n  <img src=\"photos/vacations/cancun/phototill.jpg\"\
    \ />\n</body>\n</html>\n```\n\nOf course, we can look quite different from this,\
    \ but it should follow the same form. Even though modern browsers are very forgiving\
    \ and allow you to omit many things, such as the opening and closing tags, I don't\
    \ recommend you do this, because one day you might want to convert your page to\
    \ XHTML, which is a lot stricter. It's always a good idea to close every tag and\
    \ make sure you do in the right order. For example, you shouldn't close a document\
    \ by issuing `<html>` followed by `</body>` because the proper nesting of tags\
    \ would be broken.\n\nFor the same reason, you should also get into the habit\
    \ of closing any tags that do not have a closing `<img src=\" />`, which does\
    \ not have a matching `</img>` tag, and therefore requires a / character right\
    \ before the `>` in order to properly close it. In the same way `<br>` becomes\
    \ `<br />`, and so on.\n\nYou should also remember that again tags must have either\
    \ single or double quotation marks for XHTML compatible, though nearly all browsers\
