  md: "# Plug-In JavaScript: 100 Power Solutions\n\nLet's start with the first if()\
    \ section of code. There's nothing unusual here; it simply passes back to the\
    \ same function recursively to deal with an element at a time if it's an array:\n\
    \n```\nif (id instanceof Array)\n{\n  for (var j = 0; j < id.length; ++j)\n  \
    \  Fade(id[j], start, msecs, interruptible, CB)\n  return\n}\n```\n\nAfter that,\
    \ the local variable stepval is created, like:\nstepval = Math.abs(start - end)\
    \ / (msecs / INTERVAL)\n\nIts value is calculated by finding the difference between\
    \ the start and end opacity values; that is, it subtracts one from the other and\
    \ passes the result through the Math.abs() function. this gives a positive integer\
    \ representing the difference, like this:\n\n```\nMath.abs(start - end)\n```\n\
    \nThen the length of time the fade takes, has been passed as a value in milliseconds\
    \ in the variable msecs, is divided by INTERVAL, which is the number of milliseconds\
    \ between each frame of the transition (30 by default). The code for that is simple:\n\
    \n```\nmsecs / INTERVAL\n```\n\nThe first value (the start and end difference)\
    \ is then divided by the second (the timing) and assigned to the variable stepval.\n\
    \n# A Specific Case\n\nLet's see what this calculation comes out by assuming that\
    \ start has a value of 0\n\n```\nMath.abs(0 - 100) / (1000 / 30)\n```\n\nThe calculation\
    \ comes to 100 / (1000 / 30), and the answer is the value 3 . In terms of this\
    \ code, that means, if the following three things are true:\n\n+   1. The interrupt\
    \ is to take place once every 30 milliseconds,\n2. You want to animate to 1000\
    \ milliseconds,\n3. There are 100 levels of opacity,\n\nThen the distance between\
    \ each level of opacity should be 3. In other words, to smoothly fade from a value\
    \ of 0 to 100 over the course of 1 second, there will be 33.33 steps, separated\
    \ by 3 levels of opacity."
