    # When the Pad Argument is True


    If the pad argument is zero, the calling code of this plug-in will pad out as
    it changes dimensions so that it will retain the overall size, and therefore,
    elements resting against it will also stay aligned where they are. Without this
    setting, the width and height of id changes, any objects surrounding will move
    about to take the new dimensions into account. The following line of code calls
    the ZoomPad() function to create the padding:


    ```

    if (pad > 0) ZoomPad(Math.max(fromw, tow),

    Math.max(fromh, toh), O(id).ZO_W, O(id).ZO_H)

    ```


    This finds the maximum width and height that the object will be out of its start
    and end values of fromw, tow, fromh, and toh, by using the Math.max() function.
    The object will then have its padding adjusted so that it is growing to larger,
    or if the resizing can grow, padding is added around it, and as the object reduces,
    more padding is added to make up for the reduction in size. The overall result
    is when pad is greater than zero, id will always have the overall dimensions (when
    you add its width and height to its padding).


    Otherwise, if pad has a value of -1, id is moved to keep it centered (if pad is-1,
    no padding is required and no moving of id is).


    # If This Class has Been Called by the DockBar()-Plug-in


    Next, there''s an interest of code used only by the DockBar() plug-in, covered
    in Chapter 8. It looks like this:


    ```

    else if (O(id).DB_Parent)

    ToGoEdge(O(id).DB_Parent, O(id).DB_Where, 50)

    ```


    This code examines the DB_Parent property of id. If it is true, the plug-in has
    been called from DockBar(), in which case the GetEdge() plug-in from Chapter 4
    is called to keep id up the edges to which it has been assigned by the value in
    the DB_Where property.


    If this plug-in isn''t being used as part of the DockBar() plug-in, then it''s
    necessary to keep id centered (unless the pad argument is -1, in which case centering
    is disabled). Of course, if id has not been lifted from the page by making it
    an ''absolute'', ''relative'', or position style property, then any attempt to
    change its location will be ignored (in which case the best way to keep the object
    centered is to set pad to true).'
