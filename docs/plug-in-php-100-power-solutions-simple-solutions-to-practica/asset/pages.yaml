  md: '# Plug-In JavaScript: 100 Power Solutions


    FIGURE 3-8

    The image and the second sentence cannot be dragged


    ![](img/faacab81da20861e0f8059a56e67dfa4_79_0.png)


    section of text that is being selected, while the second sentence is not selectable.
    The GIF image is draggable.


    # About the Plug-in


    This plug-in takes three arguments, and depending on whether, it prevents or enables
    events to occur. The arguments are as follows:


    +   - **id** The ID of object, such as a div or span of HTML, or any other object

    - **type** This argument can have one of three string values: ''drag'', ''select'',
    or ''both''. If the value is ''drag'', the object referred to by id either be
    prevented from being dragged or allowed to be dragged, depending on the value
    of offseason. If it is ''select'', then the selection of text will be prevented
    or allowed, depending on the value of offseason. If it is ''both'', then these
    events will be prevented or allowed.

    - **onoff** This argument should be either true or false; alternatively, the values
    1 or 0 are acceptable. The values true or 1 mean the event (or events) in the
    variable type are prevented. If offseason is false or 0 then the event (or events)
    are allowed.


    # Variables, Arrays, and Functions


    | ondragstart | Event of the object passed in id |

    |---||

    | onselectstart | Event of the object passed in id |

    | onmousedown | Event of the object passed in id |

    | MozUserSelect | Property of the object passed in id (only used by Mozilla-based
    browsers as Firefox) |


    # How It Works


    The plug-code is divided into two main sections. In the first, the drag event
    of the object referenced by id is managed, while the second half is for handling
    the id''s select event. Each of these halves is again split into two parts. In
    the first half of each, the events it handles are prevented, while the second
    half is for re-enabling an event after it has been disabled.'
