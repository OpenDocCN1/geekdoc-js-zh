  md: '# Plug-In JavaScript: 100 Power Solutions


    ### 3-6

    This plug-in returns meaningful values for key codes.


    ![](img/faacab81da20861e0f8059a56e67dfa4_75_0.png)


    # About the Plug-in


    This plug-in takes a key code as an argument and returns a string representing
    the special key that was pressed, or the code if no such key was pressed.


    # Variables, Arrays, and Functions


    | c | Key code passed to the function and return it if it does not represent a
    special key |


    # How It Works


    This function uses a switch() statement to test the value of c and return various
    strings if it matches values. If none of values match, then it is returned.


    # How To Use It


    Generally this plug-in will be called for you by the CaptureKeyboard() plug-in.
    However, you may have an application for which you''d rather return the strings,
    or you''d rather return different names. In these cases, feel free to modify the
    plug-in to your requirements.


    For example, if you detect the keypress by pressing the SHIFT key, you might want
    to return an empty string instead of the string ''SHIFT''. That way, when the
    user presses the SHIFT key followed by the M key, for example, you will only see
    the value ''M'' and not ''SHIFT'' followed by ''M''.


    The reason I''ve gone to the bother of trapping these special keys is, although
    there are already useful input features built into JavaScript, these plug-ins
    allow you to, for example, set up various special keys to move objects around
    the screen or perform particular functions the moment a key is pressed.'
