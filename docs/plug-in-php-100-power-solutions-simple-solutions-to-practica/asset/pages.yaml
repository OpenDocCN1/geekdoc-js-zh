  md: '# Chapter 5: Visibility 105


    This simple takes the value in percent, divides it by 100, and applies it to the
    style opacity property of id. Of course, if id is an array, all its elements will
    have property updated.


    However, Mozilla browsers such as Firefox have their own property for this function,
    the following line of code performs the equivalent by changing the style. MozOpacity
    property. Likewise, the third line for Safari browsers that use the old rendering
    engine (before Webkit was introduced) and therefore require the style HtmlOpacity
    property changed.


    Finally, Microsoft chose a more complicated approach and includes opacity as part
    of their nonstandard filters and transitions group of features. The object''s
    filter property is set in the following manner (for setting of 25 percent, for
    example):


    ```

    S(id).filter = ''alpha (opacity = 25)''

    ```


    However, because you need to take into account the fact that id could be an array,
    the following version of it is called, with both the property and setting values
    passed to the S() plug-in:


    ```

    S(id, ''filter'', ''alpha (opacity = 25)''

    ```


    Also, rather than a numeric value, a string has to be assigned to the filter property,
    which requires construction. So, in order to place the value in percent in the
    string, the following code is used (employ the InsVars() plug-in from Chapter
    3):


    ```

    S(id, ''filter'', InsVars("alpha opacity = ''#1''"), percent);

    ```


    # How To Use It


    To change an opacity, just pass it along with the object or its ID (or an array
    of objects and/or IDs). You can use a JavaScript command like this:


    ```

    Opacity(''fadeddiv'', 64)

    ```


    Or, you can embed the code within HTML, as in the following example, which creates
    three clickable buttons:


    ```

    <input type=''submit'' value=''25 percent'' onclick=''Opacity(this, 25)'' />

    <input type=''submit'' value=''50 percent'' onclick=''Opacity(this, 50)'' />

    <input type=''submit'' value=''75 percent'' onclick=''Opacity(this, 75)'' />

    ```


    When clicked, the different buttons will change their opacity by the assigned
    amount (25 percent, 50 percent, or 75 percent, respectively). Notice that none
    of these HTML elements have been assigned IDs because the keyword this has been
    passed to the Opacity() plug-in, thus taking advantage of that plug-in (like most
    of them) will accept either an object ID or an object. The this keyword directly
    passes the calling object to the function, which is why no ID name is required.'
