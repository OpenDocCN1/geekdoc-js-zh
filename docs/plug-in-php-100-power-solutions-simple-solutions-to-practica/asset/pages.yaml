  md: "# Chapter 13: Solutions to Common Problems 375\n\n| Position() | Plug-in to\
    \ set the style position property of an object |\n| Opacity() | Plug-in to set\
    \ the opacity of an object |\n| GetFixedWidth() | Plug-in to return the width\
    \ of the browser |\n| GetWindowHeight() | Plug-in to return the height of the\
    \ browser |\n| createElement() | Function to create a new HTML element |\n| setAttribute()\
    \ | Function to set an attribute of an object |\n| appendChild() | Function to\
    \ attach a child object to an object |\n| setInterval() | Function to start repeating\
    \ interrupts to another function |\n| clearInterval() | Function to stop repeating\
    \ interrupts |\n\nHow It Works\nTo start with this, plug-in saves the width and\
    \ height of the browser in w and h and sets c to the string 'TT_', which will\
    \ be used when assigning IDs to the image objects that were created:\n\n```\n\
    var w = GetWindowWidth()\nvar h = GetWindowHeight()\nvar c = 'TT_'\n```\n\nNext,\
    \ if it is not 1 or 2, any repeating interrupts are cancelled, and the plug-in\
    \ returns, which turns off the mouse trails:\n\n```\nif (!state) return clearInterval(CT_IID)\n\
    ```\n\nAt the next line of code, if no object has the ID 'TT_0', it means the\
    \ first time the plug-in has called, so all the image objects are created and\
    \ set to style positions of 'absolute' (so that they can be moved about). In addition,\
    \ their opacity is set to different levels so the ones farthest away from the\
    \ mouse cursor are faded, the images loaded from the URL supplied in image, and\
    \ the X and Y properties of each image are assigned values of -9999 to place them\
    \ well off screen, as follows:\n\n```\nif (IO('TT_0.')) {\n  for (var j = 0; j\
    \ < 10; ++j) {\n    var newimg = document.createElement('img')\n    newimg.setAttribute('id',\
    \ c + j)\n    document.body.appendChild(newimg)\n    Position(newimg, ABS)\n \
    \   Opacity(newimg, (j + 1) * 9)\n    newimg.src = image\n    O(c + j).X = -9999\n\
    \    O(c + j).Y = -9999\n  }\n}\n```"
  merge: -1
  pgno: 404
