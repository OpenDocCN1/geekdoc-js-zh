    # Determining the Movement Distance for Each Step


    Next, the plug-in computes the distance between the start and end positions (whether
    as originally requested by the calling code, or modified due to interrupting a
    previous slide) and divides the horizontal and vertical differences into the number
    of steps required to make the animation for the number of milliseconds specified
    in msecs (which could be the original value, or a new value computed from interrupting
    a previous slide). The following code calculates these steps:


    ```

    var stepx = (tox - frx) / (msecs / INTERVAL)

    var stepy = (toy - fry) / (msecs / INTERVAL)

    ```


    To explain how two lines of code work, I have determined that the value in INTERVAL
    (which is 30 by default) is the optimal time in milliseconds between animation
    frames. Therefore, the following calculation calculates the number of steps required
    to make an animation last msecs milliseconds (if each step happens every INTERVAL
    milliseconds):


    ```

    (msecs / INTERVAL)

    ```


    > TIP Always ensure you pass the msecs argument a value greater than zero because
    this plug-in (and all of the animation and transition plug-ins) does not check
    for having a value of zero, which will cause errors and halt the animation.'
