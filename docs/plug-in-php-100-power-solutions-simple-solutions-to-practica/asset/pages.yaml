  md: '# Introduction


    JavaScript is the free language built into all modern browsers including Internet
    Explorer, Firefox, Safari, Opera, and Chrome. It is the power behind dynamic HTML
    and the Ajax environment used for Web 2.0 websites such as Facebook, Flickr, Gmail,
    and many others. Plug-in JavaScript is aimed squarely at people who have learned
    basic HTML (and perhaps a little CSS (and JavaScript) and are interested in doing
    more. For example, you may wish to create more dynamic menu systems, provide mouse
    hover effects, or support Ajax functionality. In this book you will be shown how
    to do all these things and much more using very simple JavaScript and it is never
    assumed that you know anything about a solution. Instead, you are taken each example
    step by step with the explanations included, so there is no need to look up anything
    elsewhere; every solution is complete and applicable immediately.


    Where possible the book purposefully ignores more advanced JavaScript techniques
    such as object oriented programming (even they sometimes be more powerful) to
    make it easy for you to understand all the plug-ins. Not using these advanced
    techniques doesn''t mean the plug-ins are any less useful; rather, they may simply
    take a few extra lines of code to achieve the same result, which will generally
    run as fast as most code.


    The book can be dipped into required because each chapter is itself contained—when
    you have a particular problem to solve, you can refer to the relevant chapter
    and it will be all that you need.


    # About JavaScript


    The JavaScript programming language is already over 15 years old and is more popular
    than ever. Written by Brendan Eich at Netscape and previously known by names Mocha
    and LiveScript, JavaScript was first incorporated into the Netscape Navigator
    browser in 1995, the time that Netscape added support for Sun''s Java technology.


    JavaScript is a quite different language from Java, as part of a marketing deal
    between Netscape and Sun Microsystems, it was given its name to benefit from the
    general buzz surrounding the Java language. To justify this naming, all Java keywords
    are reserved in JavaScript, its standard library follows Java''s naming conventions,
    and its Math and Date objects are based on Java 1 classes. the trademark “JavaScript”
    now belongs to Oracle Corporation—but the similarities end there.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Plug-in JavaScript: 100 Power Solutions


    Microsoft''s version, called JScript, was released a year later as a component
    of Internet Explorer 3 and, as you might, it differed in several important respects,
    making it less 100 percent compatible with JavaScript. Unfortunately, remains
    true to this day, as you will see in several of these plug-ins that work differently
    depending on which browser they find themselves running.


    Unlike languages used for creating websites, such as Perl, PHP, and Ruby, JavaScript
    runs within the web browser, but not on a server. This makes it the perfect tool
    for creating dynamic web pages because it can modify HTML elements in real time.
    In addition data is transferred between a web server and web browser scenes, without
    the user being aware of it.


    As you will learn in Chapter 2, JavaScript''s great power lies in its ability
    to access HTML Document Object Model (DOM), in which every element on a web page
    can be individually addressed (reading or modifying its value), and elements can
    also be created and deleted on the fly, as layered over each other and moved.
    You can go so far as treat a web browser as a blank canvas and build applications
    and arcade games from scratch using JavaScript and the DOM (although doing takes
    some quite advanced programming skills).


    Because Oracle owns the trademark to its name, JavaScript has officially been
    known as ECMAScript ever since the language was submitted to ECMA, the European
    Computer Manufacturers Association (a nonprofit standards organization).


    # JavaScript Frameworks


    With recent steps towards standardization, different browser developers implement
    JavaScript in slightly different ways, giving rise to the plethora of JavaScript
    frameworks now available such as jQuery, YUI, MooTools, and so on. These technologies
    handle all the inconsistencies for you, providing a set of functions you can call
    without worrying about browser differences.


    The plug-ins in this book provide much of the functionality of these frameworks
    without actually constructing a framework. Procedural programming techniques make
    them easy to use and understand their workings. And, the plug-ins are also interconnected
    and draw on each other''s features, it''s possible to just a single plug-in and
    its dependencies on a page. On the other hand, with many frameworks it''s quite
    difficult to extract the functions you need.


    Although only around 25Kb for the compressed file containing all the plug-ins,
    the additional tiny amount of bandwidth used you probably never want or need to
    extract just a few functions: you can simply drop a link to the file in any web
    page to access all the plug-ins.


    # This Book Provides


    This book provides 100 ready-to-go plug-ins you can draw on, usually with a single,
    simple case. Of course, because all projects are different, I provide only the
    bones needed and leave layout and styling to the absolute minimum. This leaves
    you to insert the functions into your programs and then tailor them to your exact
    requirements.


    The types of plug-ins offered offer quick and simple solutions to a wide range
    of problems, allowing you to avoid reinventing the wheel each time you need a
    new'
  merge: -1
