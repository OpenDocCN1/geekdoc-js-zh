    \n# CreateAjaxObject()\n\nAjax is the power behind the vastly improved user interaction\
    \ of Web 2.0. It stands for Asynchronous JavaScript and XML, which is really a\
    \ contrived acronym for a background call to a web server. Using this plug-in,\
    \ you can easily create a new Ajax object that can be used to send and request\
    \ information from and from a web server in the background, without the user being\
    \ aware of it.\n\nUnlike the past, when a POST or GET stopped action in the browser\
    \ until it completed, with Ajax the browser handles the request without disrupting\
    \ the web application.\n\nFigure 11-2 shows a simple HTML file that has been fetched\
    \ from the web server and inserted into a div, using this plug-in in connection\
    \ with the next one, GetAjaxRequest().\n\n![](img/faacab81da20861e0f8059a56e67dfa4_355_0.png)"
