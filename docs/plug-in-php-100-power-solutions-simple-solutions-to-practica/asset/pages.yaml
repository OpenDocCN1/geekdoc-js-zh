    to be moved anywhere within the document. Next, the setInterval() function is
    called to start repeating interrupts the DoFlyIn() subsection every INTERVAL milliseconds.
    The result of calling the function is saved in iid to be used when clearInterval()
    is:


    ```

    Position(id, ABS)

    var id = setInterval(DoFlyIn, INTERVAL)

    ```


    # The DoFlyIn() Subfunction


    This function uses the GoTo() plug-move to id to each location in the animation,
    like this:


    ```

    GoTo(id, fromx * xstep, count, fromy * ystep * count)

    ```


    An if statement checks count to see whether there is a value greater than or equal
    to msecs / INTERVAL. If it does, the fly-in has finished and the following code
    is executed, but whether it does or not equal value, count is incremented after
    the test is, like this:


    ```

    if (count >= msecs / INTERVAL)

    {

    ```


    If the fly-in has finished, the ID_Flag property of id is set to false to indicate
    this, GoTo() is called to ensure that id is placed at exactly the correct location
    (because xstep and ystep will be floating points and the final values calculated
    using them could be off by a pixel or two). The repeating interrupts are stopped
    with a call to clearInterval(), like this:


    ```

    O(id).ID_Flag = false

    GoTo(id, tox, toy)

    clearInterval(iid)

    ```


    The function returns then, and if the fly-in hasn''t yet finished, it will be
    called again in INTERVAL milliseconds, and so on until the animation has completed.


    # How To Use It


    To use this plug-in, insert an object and specify where you wish the object to
    fly in by providing relative horizontal and vertical coordinates in the next two
    arguments. You also have to tell the plug-in how long the animation should take
    in milliseconds.'
