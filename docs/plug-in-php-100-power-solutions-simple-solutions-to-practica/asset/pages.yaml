    # Variables, Arrays, and Functions


    | opacity | The style.opacity property as used by most browsers |

    |---|---|n| MozOpacity | The version of the opacity property used by Mozilla-based
    browsers as Firefox |

    | KhtmlOpacity | The version of the opacity property used on older versions of
