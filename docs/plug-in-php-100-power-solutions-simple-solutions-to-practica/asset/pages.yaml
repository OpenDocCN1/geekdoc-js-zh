    # How To Use It


    This plug-in has two distinct modes. In the first it returns an object referred
    to by ID string, while in the second it updates an object''s property with a new
    value. In either case, if the object is passed to the plugin (instead of its ID
    name) then the object is accessed directly, there''s no need to look it up.


    Furthermore, in both lookup and setting modes you can pass an array of objects
    and/or ID names. If you are looking up, the plug-in returns an array. If you are
    setting properties, all the objects have the specified property set to the given
    value, and those values are returned.


    However, the value returned by the plug-in is only of use when looking up an object,
    such as the following, which are just four of the countless ways of using the
    plug-in:


    ```

    objectname = O()(''mydiv'')

    O(''copyrightspan'').innerHTML = ''&copy;2011''

    background = O()(''menu'').style.backgroundColor

    O(''menu'').style.color = ''yellow''

    ```


    When you are assigning a value to one or more properties, in the following, the
    returned value will simply be that of the assigned value, which is not that useful
    to you, except perhaps when you are debugging code:


    ```

    O(object, ''innerHTML''), ''h1Heading Text</h1>''

    O(Array(''first'', ''second''), ''mouseover'', ''mousehandler'')

    ```


    As you will see throughout this book, the O() plug-in is used in a variety of
    ways and will soon get thinking of it as the main way to access individual elements
    in a webpage.


    > NOTE Well known JavaScript frameworks, such as jQuery, Script.acul, Prototype,
    and many others, use of a similar function to O(), but they usually call it $.
    Some add even more functionality to it than there is in the O() plug-in, which
