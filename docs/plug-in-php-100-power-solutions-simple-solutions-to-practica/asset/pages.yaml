  md: '# Chapter 13: Solutions to Common Problems 371


    After that, various style sets based on these values are applied to the new div,
    and the contents of the tip argument are placed in its innerHTML property, as
    follows:


    ```

    S(tt).fontFamily      = font

    S(tt).fontSize       = size

    S(tt).padding        = ''3px 5px 3px 5px''

    S(tt).color           = textc

    S(tt).backgroundColor = backc

    S(tt).borderColor     = bordc

    S(tt).borderStyle     = bstyle

    S(tt).borderWidth    = Px (width)

