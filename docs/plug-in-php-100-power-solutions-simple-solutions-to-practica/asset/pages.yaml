- img_proc: true
  md: '# Chapter 3: The Core plug-ins 37


    whether or not a mouse is being pressed anywhere in the browser window by simply
    looking at this variable, which has a value of true if down; otherwise it is set
    to false.


    +   - MOUSE_IN In a similar fashion, the document.onmouseout and document.mouseover
    events are captured, and this global variable is set to true when the mouse pointer
    is within the bounds of the browser window; otherwise it is set to false.

    - MOUSE_X and MOUSE_Y This pair of global variables is constantly updated by the
    CaptureMouse() plug-in (the one following one), which is attached to the document.onmousemove
    event. Therefore, you can reference these variables at any time to determine the
    position of the mouse pointer.

    - SCROLL_X and SCROLL_Y These variables are also kept updated by the CaptureMouse()
    plug-in. They are continuously updated with values representing the amount by
    which the browser has scrolled in both vertical and horizontal directions.

    - KEY_PRESS This variable is updated by the CaptureKeyboard() plug-in, which captures
    the document.keydown and document.keypress events and sets the variable on the
    key that was pressed.

    - ZINDEX This variable starts with a default value of 1,000. It is used to plug-in
    the zindex property of objects it uses. This is the depth at which it will be
    displayed on the screen, with lower or negative numbers behind hidden and positive
    numbers. For example, ContextMenu() plug-in in Chapter 8, which opens a drop-down
    element when you right-click; uses this value to ensure that the element appears
    in front of all other elements. Also, the BrowserWindow() plug-in (also in Chapter
    8), which creates in-browser, movable pop-windows, sets windows that are clicked
    to be of ZINDEX +1, to ensure they come to the front.

    - CHAIN_CALLS Some of the plug-ins have the ability to be chained together so
    that they run consecutively, one starting after the previous has finished. Normally,
    JavaScript doesn''t allow such behavior, and if you call a function that, for
    example, sets up an interrupt to perform an animation, function will return immediately
    to the calling code without waiting for the sequence of interrupts to complete.
    This is exactly the behavior normally required, as it allows others to happen
    at the same time. But some of these plug-ins work better when they are chained,
    which is achieved by placing a sequence of functions in the CHAIN_CALLS array
    so that each function, the next in the chain can be called. The only reasons you
    might want to access this array are to determine if (and how many) functions are
    queued up, or possibly to empty the array to cancel all queued functions.

    - INTERVAL After many hours of experimentation on all the major browsers across
    a range of computers and operating systems, I have derived a value of 30 milliseconds
    being the optimal time to allow between interrupt calls, because some shorter
    functions complete under 10 milliseconds, while others may take 20 or more, but
    none should take longer than 30 milliseconds. Therefore, I have'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'set the global variable INTERVAL to 30. This fixed value is required for timing
    purposes, so that all the interrupt functions in this book can ensure they take
    exactly the number of milliseconds passed to them. If JavaScript speeds up over
    the next few years, as they inevitably do, this allows you to optimize these plug-ins
    and draw the limit of this to 25, 15, or even fewer milliseconds, as computers
    get faster and JavaScript interpreters improve. This will not speed up the plug-ins,
    but it will allow animations to have extra steps between the first and last frame,
    making the transitions smoother.


    # Global String Variables


    After these first ten global variables, a further ten string variables are defined.
    These are UND, HID, VIS, ABS, FIX, REL, STA, INH, TP, BM, LT and RT, and in order
    they show the strings ''hidden'', ''visible'', ''absolute'', ''fixed'', ''relative'',
    ''static'', ''top'', ''bottom'', ''left'' and ''right''.


    Although they are not essential, I created these variables because of which they
    are referred frequently by the plug-ins, and this helps to keep the code compact.
    It also serves to make the listings in this book narrow, so that lines that previously
    wrapped around now display on a single line. Additionally, they help to make the
    code more readable, as you refer back to this section if you forget the values
    of any of them.


    # Determining the Current Browser


    Because JavaScript varies in its implementation between different developers,
    you sometimes need to know which browser you are dealing with. So, in conjunction
    with the subfunction NavCheck(), the next lines of code will set the global variable
    BROWSER to one out of the following strings, Android, depending on the browser
    used: IE, ''Opera'', ''Chrome'', ''iPod'', ''iPhone'', ''iPad'', ''Android'',
    ''Safari'', ''Firefox'', and ''UNKNOWN''. You can then refer to this variable
    in the same way that some of the plug-ins do in order to offer different browsers.
    When ''Firefox'' is returned it means a browser running on the Gecko engine is
    in use, which includes other browsers than Firefox.


    # Attaching Functions to Events


    Much of the functionality of these plug-ins rests on the capturing of built-in
    browser events, as is by the remaining seven lines of code. The first three CaptureMouse()
    function to the document .onmousemove event, and the CaptureKeyboard() function
    to the document .onkeydown and .onkeypress events. These plug-ins are documented
    in their own sections, but it suffices to say that they are called each time one
    of these occurs and they keep the global variable KEY_PRESS updated.


    The final four lines attach functions that are so small that I have created them
    as anonymous, inline functions. All they do capture the document .onmousemove,
    document .onmouseover, document .onmouseup, document .onmousedown, keeping the
    global variables MOUSE_IN and MOUSE_DOWN updated.'
