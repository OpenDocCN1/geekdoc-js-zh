    # JavaScript and Semicolons


    There are JavaScript programmers who always place a semicolon at the end of every
    statement, but it''s not necessary to do so because JavaScript interpreters either
    accept a semicolon or a new line as the marker for a statement.


    However, if you wish to have more than one statement in a line, you must use a
    semicolon between them. In this book I try to avoid this to keep the code readable
    as possible.


    On the other hand, using semicolons everywhere makes your JavaScript code more
    easily convertible to languages such as PHP and C, which require them. But it''s
    up to you whether or not you use them.


    > Tip Some programs that work with JavaScript directly to help find bugs or optimize
    or reduce your code will not work unless you have placed a semicolon after every
    single statement. If you will be using any of these you''ll save a lot of time
    by getting into the habit of using semicolons right away.


    # Summary


    If this is all new to you, you should now have a very big picture of how JavaScript,
    CSS, and the DOM relate to each other. This will help you understand the plug-in
    documentation in the following chapters. In them, I provide all the information
    you need to effectively use the plug-ins on your own pages, as well as how to
    modify and improve them for your own purposes.'
