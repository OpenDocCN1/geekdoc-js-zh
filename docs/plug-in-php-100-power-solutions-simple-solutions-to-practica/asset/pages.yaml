    \ O(id).innerText = matrix\nelse O(id).textContent = matrix\nvar iid = setInterval(DomMatrixToText,\
    \ freq)\n```\n\n# The DomMatrixToText() Subfunction\n\nThis function does the\
    \ revealing by using a for() loop each time it is called to replace 20 characters\
    \ in the string matrix with the correct values. This is sufficient to change only\
    \ for each sort, so that the transition will take secs milliseconds, as follows:\n\
    \n```\nfor j = 0; j < len / 20; ++j {\n  var k = Math.floor(Math.random() * len)\n\
    \  matrix = matrix.substr(0, k) + html[k] + matrix.substr(k + 1)}\n```\n\nThe\
    \ value of 20 was defined by performing several tests with strings of different\
    \ sizes and timing them. It's not an exact value, so you might find you want to\
    \ tweak it. The new value in matrix is then assigned to the correct property of\
    \ id to display it:\n\n```\nif (O(id).innerText O(id).innerText = matrix\nelse\
    \ O(id).textContent = matrix\n```\n\nFinally, the count variable is incremented\
    \ when an if() statement. If the value is the same as INTERVAL, the MT_Flag property\
    \ of id is set to false to indicate that the transition is over. Its innerHTML\
    \ property is restored to its original value, and the repeating interrupts are\
