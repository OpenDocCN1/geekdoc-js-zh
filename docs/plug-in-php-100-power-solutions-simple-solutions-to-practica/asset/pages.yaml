  md: "# Chapter 2: JavaScript, CSS, and the DOM 15\n\nWithin the head there can be\
    \ other objects as the title and meta objects, while the body object can contain\
    \ numerous objects, including HTML tags as headings, anchors, forms, and so forth.\n\
    \nFigure 2-1 shows the DOM of an example document, with the title “Hello” and\
    \ a meta tag in the head section and three HTML elements (a link, a form, and\
    \ an image) in the body section.\n\nOf course the simplest of web pages has more\
    \ structure than outlined in this figure, but it serves to show how the DOM works:\
    \ starting from the very outside of the DOM is the window, inside which there’s\
    \ a single document (although more are allowed), and within the various elements\
    \ or objects, which connect to each other.\n\nThe only one of the items in the\
    \ figure that is a property is the string “Hello”, which is the property of the\
    \ title object. All the other items are objects or object names. If the figure\
    \ were to extend further down, the property for the meta might be found to be\
    \ “robots” and the URL property for the a href=\"google.com\", and so on. Representing\
