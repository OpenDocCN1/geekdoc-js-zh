  md: '# Chapter 2: JavaScript, CSS, and the DOM 19


    You can also include a style sheet using the HTML <link> tag, as follows:


    ```

    <link rel="stylesheet" type="text/css" href="/css/styles.css" />

    ```


    This has the same exact effect as the @import directive, except that the <link>
    tag is not a valid style directive, and so cannot be used from within one style
    to pull in another—and, therefore, should not be placed within a <style>...</style>
    tags. You can use multiple @import directives within your CSS to include external
    style sheets, you can also use many <link> statements as you like in your HTML.


    There''s also nothing stopping you from using external style sheets and overriding
    certain styles for the current page by inserting style sheets, either with <style>...</style>
    tags or directly within HTML, like this (which results in italic blue text within
    the tags):


    ```

    <div style="font-style:italic; color:blue;">Hello</div>

    ```


    A better solution is to change the HTML by assigning a class value, as follows:


    ```

    <div class="blue">Hello</div>

    ```


    Then you can use the following style setting, inside the div, or in the page header
    or within an external style sheet referring to the class:


    ```

    .blue { font-style:italic; color:blue; }

    ```


    Of course, if you use another style inside the div, then any attributes that are
    the same will override those of the div styling. In the case of the <h1> tag that
    was styled earlier, the color of red is what was assigned. The other .blue attribute
    of italic text will stay unaltered—rendering in the Arial font "Hello" as shown
    as Figure 2-3, except that it will be changed to italic.


    Properly explaining CSS would easily fill a large book, so these are the bare
    basics you need to know in order to understand what is going on in the plug-ins.
    If you are interested in learning more about the subjects of XHTML and CSS in
    depth, I recommend the book HTML & XHTML: The Complete Reference, by Thomas A.
    Powell (McGraw-Hill/Professional, 2003).


    # Accessing Styles in JavaScript


    Using JavaScript you can change on the fly the many styles you can define using
    CSS. This is possible because the CSS attributes are DOM object properties. For
    example, here is how you use CSS to set an attribute for a particular ID:


