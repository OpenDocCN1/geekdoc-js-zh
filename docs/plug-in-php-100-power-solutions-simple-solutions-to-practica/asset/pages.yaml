  md: '# 382 Plug-In JavaScript: 100 Power Solutions


    This causes oldmouse and oldmousey to retain the location of the mouse when the
    mouse button was clicked, and when click is compared to the current mouse location
    to determine the amount by which the document body should be scrolled.


    However, the variables tempmouse and tempmousey are used only to see whether the
    mouse has moved since the last interrupt to the DOTE() sub-function and to decide
    whether a scroll is required. The scrolling is relative to the values stored in
    oldmouse and oldmousey, not those in tempmouse and tempmousey.


    # The StopTE() Subfunction


    This function simply sets the flag variable to false to indicate that a scroll
    is not currently in operation and clears the intervals. The document will not
    scroll until the mouse button is held down once—the same action as touching a
    touch screen.


    # How To Use It


    To use this plug-in, call it up with a value of 1 or 0, like this:


    TouchEvent(1)


    To turn off again, call it with a value of 0 or false, like this:


    TouchEvent(0)


    The following example shows how you can enable and off controls for this feature
    in a web page, in a similar way to the one shown in Figure 1-3:


    ```

    <div id=''''><font size=''2'' face=''Verdana''>

    This page has been &lt;TouchEvent(1)&gt;.&amp;

    <a href="javascript:TouchEvent()&gt;Activate&lt;/a&gt; &#38;

    title="on touchscroll control&gt;Deactivate&lt;/a&gt; &#38;

    <a href="javascript:TouchEvent(''enabled'', 1, 1, 1000)\&gt;FadeOut(''enabled'',
    1000)\&gt;title="Remove this panel&lt;/a&gt;&lt;/font>

    <br /><font size=''2'' face=''Verdana''>

    When activated you can touch anything to scroll this page

    using a touch screen/&gt;</div>

    ```


    ```

    <script>

    Locate(''enabled'', ''fixed'', 0, -100)

    S(''enabled'').backgroundColor = ''#eeeeaa''

    S(''enabled'').padding = ''2px 5px 2px 5px''

    S(''enabled'').border = ''dotted black 1px''

    Opacity(''enabled'', 0)

    GoToEdge(''enabled'', ''top'', 50)

    FadeIn(''enabled'', 1000)

    </script>

    ```


    Just add this code to any existing web page that is long enough to require scrolling.'
