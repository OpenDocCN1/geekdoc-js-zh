  md: "# 180 Plug-In JavaScript: 100 Solutions\n\nfirst one out when using the JavaScript\
    \ push() and pop() functions, they would come out in the reverse order if the\
    \ elements were pushed to the array the order they were encountered. Therefore,\
    \ the calls array is traversed from start to end, pushing each element into CHAIN_CALLS,\
    \ like this:\n\n```\nfunction Chain(calls)\n{\n  for (var j = calls.length; j\
    \ >= 0; --j)\n    if (calls[j])\n      CHAIN_CALLS.push(calls[j]);\n\nNextChain()\n\
    }\n```\n\nThe first line is the one that iterates backward through the calls array.\
    \ The second checks that there is something stored in that element, and if there,\
    \ the third pushes it onto the CHAIN_CALLS global array.\nFinally, NextChain()\
    \ (discussed next) is called to start executing the chain.\n\n> NOTE The push()\
    \ and pop() JavaScript functions create what is known as a LIFO stack, which stands\
    \ for Last In First Out. With such a system the most recently pushed element is\
