    # Managing Ajax


    Ajax stands for Asynchronous JavaScript and XML, but the name is really a misnomer
    because Ajax is far more than an XML handling technology. It is, in fact, the
    heart of all the modern 2.0 websites that exchange information between the web
    browser and server in the background, without the user being aware.


    To do this, a server side language is required, and perhaps most popular is the
    PHP scripting Language. So, although this isn''t bout about Ajax and PHP, inevitably
    many of the plug-ins make use of these technologies and, if you wish to test them
    on your development computer, you''ll need to install a web server and PHP. You
    don''t have to do this if you don''t intend to use any of the Ajax plug-ins, which
    are clearly marked as such; but if you do, don''t worry; it is quite simple.


    It is simple because the developers of PHP have released an all-in-one application
    called Zend Server Community Edition (CE) that includes all of PHP, Apache web
    server and a MySQL database. You can download from the following URL:


