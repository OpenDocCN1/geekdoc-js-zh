  md: "# Chapter 1: Making the Best Use of These plug-ins\n\ncredited in the source\
    \ code. Please include a note to say that I have permission to post your code\
    \ online and in future editions of this book or, sadly, I will not be able to\
    \ use it.\n\n# Waiting Until the Web Page Has Loaded\n\nQuite often, and particularly\
    \ on longer pages, you will not want your JavaScript to run until all elements\
    \ in a page have loaded. One reason is that the graphics you'll be using may not\
    \ be ready, or the contents of objects such as divs and spans may not be available\
    \ for manipulation.\n\nAlso, some browsers will return incorrect values when a\
    \ page hasn't loaded yet. For example, if you request the width of the browser\
    \ too early you might get a value that doesn't include the vertical scroll bar,\
    \ and therefore you might find it hidden by a scroll bar.\n\nSome browsers don't\
    \ return a useful value. For instance, when asked for the location of an object\
    \ prior to a page loading, Internet Explorer will always return the coordinates\
    \ 0,0.\n\nTherefore, you will usually need to place all your JavaScript within\
    \ the body of the following function:\n\n```\n<script>\nwindow.onload = function()\
    \ {\n  // Your code and all functions goes here...\n}\n</script>\n```\n\nThis\
    \ means that your code will not get executed until the very last item has loaded\
    \ into the page and has fully rendered. If you get into the habit of enclosing\
    \ all your code within this function, you'll ensure that all objects accessed\
    \ by it are available and avoid error messages initially unsightly web pages.\n\
    \nBy the although, you could move the call to Initialize() here than in the <head>\
    \ of a web page, I don't recommend it. Initialize() doesn't rely on any elements\
    \ of the web page since it interacts with the browser to create global variables\
    \ and attach functions to keyboard and mouse events, so you don't need to move\
    \ it here. Also, placing the call to Initialize() right next to the command that\
    \ loads the plug-ins is sensible, you can't have one without the other.\n\n> On\
    \ busy pages, a long initial delay can be quite annoying because various elements\
    \ will be simply loaded in and displayed where they lie within the HTML--only\
    \ reaching their final destinations and dimensions. The first solution to this\
    \ is to ensure that you are using a CSS (Cascading Style Sheet) more on that in\
    \ Chapter 2) that is loaded at the start. This will help your page layout to form\
    \ correctly on the fly. Another trick is to use zero values to the width and height\
    \ of objects that you don't want the user to see until later, using standard HTML\
    \ width= and height=keywords (accepted by tables, images, and other objects).\
    \ Then, once your code is called after the page has fully loaded, you can give\
    \ these objects their correct dimensions. Or you use an element's style argument\
    \ to make it invisible, like style='display:none', and then change the property\
    \ to visible when you are ready to display it."
