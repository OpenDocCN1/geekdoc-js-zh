  md: '# 88 Plug-In JavaScript: 100 Solutions


    # Variables, Arrays, and Functions


    | j | Local integer for indexing if is an array |

    | width | Local variable containing the width of the browser, less than that id
    |

    | height | Local variable containing the height of the browser, less than that
    id |

    | amount | Local variable containing percent as a center |

    | TP, BM, LT and RT | Global variables with the values ''top'', ''bottom'', ''left'',
    and ''right'' |

    | GetWidth() | |-in to return the browser width |

    | GetWindowHeight() | Plug-in to return the browser height |

    | W() | Plug-in to return the width of an object |

    | H() | Plug-in to return the height of an object |

    | GoTo() | Plug-in to move an object to a new location |


    # How It Works


    Like others, this plug-in supports the passing of an object, an object ID, or
    an array of objects/or object IDs. This is managed by the if() section, which
    determines whether id is an array using the `instanceof` operator. If it is, then
    element of the array is recursively passed to the same function, with the als
    of values and percent. After all have been passed, the function returns.


    After this three local variables width, height, and amount are assigned values
    representing the amount of width and height in the browser (after the width and
    height are taken into account). This is done by fetching the width and height
    of the browser using the GetWidth() and GetWindowHeight() and subtracting the
    object''s width from one and its height from the other, as determined by W() and
    H().


    The variable amount is percent/100 so it can be used as a multiplier. For example,
    percent has a value of 40, dividing it by 100 gives the value of 0.40, which will
    then be multiplied by any number to reduce 40 percent of its original value. In
    this case, the multiplier determines how far the object should edge the specified
    area.


    Next, a switch() statement tests for the four argument values where are ''top'',
    ''bottom'', ''left'', or ''right''. The shorthand global variables of TP, BM,
    LT, and RT are used in place of these values to make the code shorter and clearer.
    A break command ends each subsection of the switch() statement except for the
    final one, where it is not required program flow will continue to the next line
    down anyway.


    Depending on which of the four values has been passed in where, the local variables
    x and y are set to align the object in right up to the specified edge. This is
    also displayed at a position between 0 and 100 percent along (or down), according
    to the value in percent. Finally, a call to GoTo() is made to move the object
    to the new location.


    There are many uses for this plug-in; in particular is a dock bar, similar to
    the one used at the bottom of the screen on the Apple OS operating system, with
    a row or column of expanding and collapsing columns. Plug-in 66, DockBar() provides
    exactly this functionality, for any web page.'
