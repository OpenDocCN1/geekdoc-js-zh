  \ 函数并传递已选择的文件。`handleFiles` 函数是脚本的核心，它首先设置了关键的默认值。这些默认值包括允许的最大文件数、每个文件的最大大小，以及一个用于匹配图像\
  \ MIME 类型的正则表达式。限制文件大小和文件数量是为了防止客户端浏览器内存过载，因为处理将在客户端机器的内存中进行。在本食谱中，你将循环遍历文件，这将创建多个同时运行的\
