  \n在本食谱中，你将探索 `FileReader` 提供的最后一个事件处理器之一的 `onprogress`。`onprogress` 事件处理器提供了读取文件的进度通知，并可向用户显示状态。`onprogress`\
  \ 事件处理器包含三个属性：`lengthComputable`、`loaded` 和 `total`。`lengthComputable` 属性是一个布尔标记，标记\
  \ `loaded` 和 `total` 属性可用。`loaded` 属性是读入内存的字节数，而 `total` 是要读取的总字节数。通过将 `progress.loaded`\
