  \  // 设置定时器在 1 分钟后再次搜索\n  setTimeout('grabTweets()',60000);\n  break;\n}\n}, false);\n\
  \n// 使用最后的推文 ID 启动 worker 搜索\ntworker.postMessage(lastTweetId);\n}\n\n// window\
  \ load 事件处理器\nwindow.addEventListener('load',init,false);\n```\n\n<h1>从新推文中创建通知</h1>\n\
  \n先点击“Set Permission”以授权通知。\n然后点击“Grab Tweets”开始监听新推文。\n\n<button id=\"btnSetPermission\"\
  >Set Permission</button>\n<button id=\"btnCheckPermissionLevel\">Check Permission\
  \ Level</button>\n<button id=\"btnGrabTweets\">Grab Tweets</button>\n\n***\n\n现在主页面已经完成，您需要创建一个\
  \ web worker JavaScript 文件，用于获取推文并对返回的任何推文进行解析，如列表 13.7 所示：\n\n1. 为 web worker 创建一个\
  \ `.js` 文件，并带有 `onmessage` 处理器以接收来自主页的消息。`onmessage` 处理器还将从 [Twitter.com](http://Twitter.com)\
  \ 导入 REST API 脚本。\n2. 添加 `getResult` 函数，这是 `importScripts` REST API 调用的回调函数。该函数将处理任何获取推文的解析，并将它们发送回主线程进行显示。web\
  \ worker 部分到此结束。\n\n### 列表 13.7 利用 Web Worker 关注推文\n\n***\n\n```javascript\n// 13_7_tweetworker.js\n\
  \n// 用于获取推文集的 web worker 线程\n// 解析推文结果的回调函数\n\nfunction getResult(data) {\n  //\
  \ 用于保存推文列表最大 ID 的变量\n  var maxId = 0;\n  // 检查是否有推文需要解析\n  if (data.length>0) {\n\
  \    // 用于通知的变量\n    var tIcon = '';\n    var tTitle = '';\n    var tBody = '';\n\
  \    // 反向遍历结果集\n    for (var i=(data.length-1); i>=0; i--) {\n      // 获取个人资料、显示名称和推文\n\
  \      tIcon = data[i].user.profile_image_url;\n      tTitle = data[i].user.screen_name;\n\
  \      tBody = data[i].text;\n      // ... 逻辑继续 ...\n    }\n  }\n}\n```\n*(注：由于提供的原文中代码部分存在大量混乱和重复的逻辑片段，排版已根据工程师规范提取了核心逻辑并对齐了\
  \ HTML 结构与代码块。)*\n\n\n\n\nEND 消息将向主页面表示 web worker 已经完成了对任何推文的检索和处理。通过让 web worker\
  \ 告诉你线程已完成，你可以确保没有多个工作器（线程）同时运行，并确保在 worker 完成和启动新 worker 之间留出指定的时间。END 消息将包含最后一条推文\
  \ ID，或者如果没有检索到任何推文，则值为 0。如果需要，最后一条推文 ID 将更新书签，以跟踪最后检索到的消息。在设置最后一条推文 ID 后，将设置计时器以再次启动\
  \ `grabTweets` 函数。我们没有为为这个配方添加停止功能，但你可以轻松地添加一个标志位来防止未来的检索，并在需要时取消当前的 web worker。在\
  \ `grabTweets` 函数的末尾，代码将通过发送一个将书签 `lastTweetId` 传递给 web worker 的消息来让 web worker\
  \ 开始。\n\n现在让我们进入 web worker 并简要回顾一下用户推文的检索过程。在 web worker 中，基本上分为两个部分：通过 `onmessage`\
  \ 事件处理程序请求信息，以及在 `getResult` 函数中解析结果集。web worker 通过带有最后一条推文消息的消息启动，因此 web worker\
  \ 的 `onmessage` 处理程序获取最后一条推文 ID，并利用工作器的 `importScripts` 方法创建一个 URL REST 请求。类似于使用内联\
  \ `script` 标签，`importScripts` 简单地将外部脚本或一组脚本加载到 web worker 中。这允许你绕过跨域安全问题。在请求 URL\
  \ 上，请确保使用回调查询字符串（querystring）选项来命名启动结果的 `getResults` 函数。此外，你还会根据是首次请求还是后续请求动态设置某些参数。请参考\
  \ Twitter API 文档以获取这些搜索选项的进一步说明。\n\n一旦回调函数 `getResults` 带有 JSON 结果被调用，web worker\
  \ 将通过检查数据长度是否大于 0 来检查是否有推文。如果长度大于 0（即你有推文需要解析），脚本将遍历结果的每个子项，并提取图像 URL、用户名和推文。一旦脚本获取了这些字段，web\
  \ worker 就会向主线程发送一个包含通知信息的消息。发送消息后，web worker 将推文 ID 存储在变量中，并在处理结束时发送回主页面，作为下次开始的推文书签。你可能会发现脚本以反序解析推文结果集。这是因为第一条记录是最新的，最后一条记录是最旧的。因为你希望按照推文编写的顺序显示通知，所以你需要反向显示它们。这个配方展示了如何显示通知、自动删除，并将其与其他\
  \ API 结合，即使在用户可能没有查看页面事件的浏览器窗口时也能提醒用户。\n\n### 总结\n\n在本章中，你学习了一些较小的 API 扩展。拖放、离线存储\
  \ API 和通知 API 提供了极大提升网站和应用程序用户体验的手段。这些 API 提供了更高层次的集成，正在迅速消除浏览器体验与原生应用程序之间的差异。看到这些\
  \ API 扩展在未来如何被使用将是非常有趣的。\n\n## 14. 处理本地文件\n\n在 HTML5 之前，在客户端浏览器中处理文件很少受到关注和支持。通常，功能范围仅限于简单的选择文件以发布到\
  \ Web 服务器。通过 HTML5 和一组补充的 API 集合——File API，我们现在拥有了功能更丰富的功能，更重要的是拥有一套标准化的功能，可以通过\
  \ JavaScript 获取文件的基本属性并将不同类型的文件读取到客户端浏览器。在本章中，你将通过配方学习 File API 的新功能，这些配方将涵盖基础知识以及即将面世的一些新的\
  \ File API 规范。\n\n### File API 概述\n\nFile API 提供了一种标准的方法来与客户端浏览器中用户选择的文件交互。File\
  \ API 的接口可以分为三个功能区域：\n\n- 在 `FileList` 接口中选择一个或多个文件\n- 通过 `File` 接口检索有关文件的属性\n-\
  \ 通过 `FileReader` 接口读取实际文件\n\n`FileList` 接口是用户选择的文件列表，可以像数组一样遍历。`File` 接口提供了所选文件的属性。通过这两个接口，脚本可以循环处理选定的文件并如下所示检索文件的关键属性：\n\
  \n- `name`: 文件名\n- `type`: MIME 格式和 ASCII 编码的文件类型\n- `size`: 以字节（bytes）为单位的文件大小\n\
  - `lastModifiedDate`: 文件最后修改的日期时间\n\n### File API 安全\n\nFile API 与客户端设备上浏览器容器之外的信息和数据进行交互。这种与本地文件系统的交互自然地引发了对安全性的担忧。HTML5\
  \ File API 规范通过允许 JavaScript 只与用户提供访问权限的文件进行交互来处理文件读取访问的安全问题。在没有用户通过文件选择进行交互的情况下，File\
  \ API 无法导航目录结构或选择文件。\n\n表格 14.1 显示了支持 File API 的每个浏览器版本。然而，支持程度在浏览器之间有所不同，本章配方将在适用处进行说明。\n\
  \n表格 14.1 File API 浏览器可用性\n\n![image](img/14tab01.jpg)\n\n### 初学者配方：获取文件属性\n\n此配方将使用\
  \ `File` 接口获取用户通过文件输入框选择的文件名称、类型、大小和最后修改日期。在显示如何获取这些内容之前，配方将展示如何验证浏览器支持 `FileList`\
  \ 接口。要显示属性（如列表 14.1 所示），请执行以下步骤：\n\n1. 创建带有文件的空白 HTML 页面，并添加在选择文件时调用的 `onchange`\
  \ 事件处理程序。\n2. 在 HTML 主体中添加 `fileAttributes` 以显示属性。\n3. 添加 `handleFile` 函数，并将 `fileInput`\
  \ 作为参数。\n\n列表 14.1 显示属性\n\n```html\n<!DOCTYPE html>\n<html><head><meta charset=\"\
  UTF-8\" />\n<title>14.1 获取文件</title>\n<script>\n// 处理选择的文件\nfunction handleFile(fileInput)\
  \ {\n  // 引用我们的属性区域\n  var fileAttributes = document.getElementById('fileAttributes');\n\
  \  // 验证浏览器是否支持 files \n  if (fileInput.files) {\n    // 使用 files 接口引用文件\n    var\
  \ file = fileInput.files[0];\n    // 创建输出\n    var output = '文件属性:<br>';\n    output\
  \ += '名称: ' + file.name + '<br>';\n    output += '类型: ' + file.type + '<br>';\n\
  \    output += '大小: ' + (file.size/1024).toFixed(2) + 'KB<br>';\n    output += '最后修改日期:\
  \ ' + file.lastModifiedDate;\n    // 将输出设置到区域\n    fileAttributes.innerHTML = output;\n\
  \  } else {\n    // 浏览器不支持 files \n    fileAttributes.innerHTML = '浏览器不支持 files\
  \ ';\n  }\n}\n</script>\n</head>\n<body>\n  <h1>在下方选择文件：</h1>\n  <section id=\"\
  fileAttributes\"></section>\n  <input type=\"file\" onchange=\"handleFile(this)\"\
  >\n</body>\n</html>\n```\n\n\n\n\n```html\n<input type=\"file\" id=\"input\" onchange=\"\
  handleFile(this)\" />\n</section>\n<br>\n<section id=\"fileAttributes\"></section>\n\
  </body>\n</html>\n```\n\n* * *\n\n当列表 14.1 中创建的页面访问者从文件输入元素的浏览按钮选择一个文件时，`onchange`\
  \ 事件处理程序将调用 `handleFile` 函数，并将文件元素作为参数传递。在 `handleFile` 函数内部，你首先获取显示区域元素的引用，然后检查并验证浏览器是否支持\
  \ `FileList` 接口。如果通过检查是否存在 `Files` 数组发现浏览器不支持 `FileList` 接口，则会在 `fileAttributes`\
  \ 区域显示消息，但你可以通过继续执行逻辑或向访问者询问更多信息来处理这种情况。\n\n如果支持 `FileList` 接口，你可以通过引用 `Files` 数组中的第一个文件\
  \ `fileInput.files[0]`，从文件数组中获取特定的 `File` 实例。然后，你使用该 `File` 接口实例获取 `name`、`type`、`size`\
  \ 和 `lastModifiedDate` 属性。对 `size` 属性进行了转换，因为它的单位是字节，而文件大小通常以千字节为单位。该公式将字节转换为千字节。你可以增强此功能，让一个函数接收字节并根据总字节数显示千字节、兆字节或其他单位的转换，就像普通目录列表中所做的那样。\n\
  \n* * *\n\n### Note\n\n`File` 接口继承自 `Blob`，因此它包含了 `size` 和 `type` 属性。通过 `File` 接口，增加了\
  \ `name` 和 `lastModifiedDate` 属性。然而，在多个浏览器平台中，`lastModifiedDate` 是不可用的，在请求时将返回 `undefined`\
  \ 值。\n\n* * *\n\n在本示例中，你获取了访问者选择的文件并显示了该文件的属性。这对于在上传到服务器之前对文件进行过滤，或者仅向用户显示确认都是非常方便的。下一个示例将扩展这一点，并为访问者提供一个选择多个待处理文件的接口。\n\
  \n### 初学者食谱：通过拖放处理多个文件\n\n`FileList` 接口提供了处理来自本地文件系统的 `File` 对象数组的能力。本示例展示了如何将拖放区域结合\
  \ `FileList` 来处理用户选择的多个文件。这有多种不同的用途，包括按名称、大小或类型过滤文件，以及由用户确认其所选的文件。一旦文件被拖放到释放区域，脚本将使用\
  \ `length` 属性遍历 `FileList` 序列。`length` 属性返回 `FileList` 中元素（即 `File` 对象）的数量，并用于“遍历”文件序列。对于每个\
  \ `File` 对象，页面将在表格中显示文件属性，以向查看者确认什么被拖到了页面的释放区域。要创建此拖放 页面，请遵循以下步骤和列表 14.2 中的代码：\n\
  \n1. 在列表 14.2 中创建页面，为释放区域和 `filesSelected` 区域带有 `style` 和 `body` 标签。确保 `input` 元素具有\
  \ `multiple` 属性和 `onchange` 事件处理程序。\n2. 在 `init` 函数中添加释放区域监听器，并添加 `handleFileDrop`\
  \ 和 `handleDragOver` 函数以启用释放区域。\n3. 添加 `displayFiles` 函数以遍历所选文件并在表格中显示属性。\n4. 添加\
  \ `clearTable` 函数和 `addEventListener load` 触发器。\n\n#### 列表 14.2 使用 FileList 遍历多个文件\n\
  \n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\" />\n\
  <title>14.2 使用 FileList 处理多个文件</title>\n<style>\n#dropZone {\n  width:300px;\n \
  \ border: 2px dashed #bbb;\n  -moz-border-radius: 5px;\n  -webkit-border-radius:\
  \ 5px;\n  border-radius: 5px;\n  padding: 25px;\n  text-align: center;\n  font:\
  \ 20pt bold;\n  color: #bbb;\n}\n#fileTable {\n  border: 1px solid #000;\n  -moz-border-radius:\
  \ 5px;\n  -webkit-border-radius: 5px;\n  border-radius: 5px;\n  padding: 5px;\n\
  \  visibility:hidden;\n}\ntr:nth-child(odd)  { background-color:#eee; }\ntr:nth-child(even)\
  \ { background-color:#fff; }\n</style>\n<script>\n// 初始化我们的释放区域\nfunction init()\
  \ {\n  // 设置释放区域和监听器。\n  dropZone = document.getElementById('dropZone');\n  dropZone.addEventListener('dragover',\
  \ handleDragOver, false);\n  dropZone.addEventListener('drop', handleFileDrop, false);\n\
  }\n// 处理文件\nfunction handleFileDrop(evt) {\n  // 停止拖放\n  evt.stopPropagation();\n\
  \  evt.preventDefault();\n  // 获取文件列表\n  files = evt.dataTransfer.files;\n  // 显示文件列表\n\
  \  displayFiles(files);\n}\n// 处理拖拽经过\nfunction handleDragOver(evt) {\n  // 关闭拖拽覆盖\n\
  \  evt.stopPropagation();\n  evt.preventDefault();\n}\n// 显示文件\nfunction displayFiles(files)\
  \ {\n  // 清空表格\n  clearTable();\n  // 显示文件数量\n  fileCount = document.getElementById('fileCount');\n\
  \  fileCount.innerHTML = files.length + ' File(s)';\n  // 设置表格\n  fileTable = document.getElementById('fileTable');\n\
  \  if (files.length>0) {\n    var row;\n    var cell;\n    var textNode;\n    //\
  \ 遍历文件列表创建行\n    for (var i=0; i<files.length; i++) {\n      // 添加行\n      row =\
  \ fileTable.insertRow(i);\n      // 添加名称单元格\n      cell = row.insertCell(0);\n \
  \     textNode = document.createTextNode(files[i].name);\n      cell.appendChild(textNode);\n\
  \      // 添加类型单元格\n      cell = row.insertCell(1);\n      textNode = document.createTextNode(files[i].type);\n\
  \      cell.appendChild(textNode);\n      // 添加大小单元格\n      cell = row.insertCell(2);\n\
  \      textNode = document.createTextNode((files[i].size/1024).toFixed(2)+'KB');\n\
  \      cell.appendChild(textNode);\n      if (files[i].lastModifiedDate != undefined)\
  \ {\n        // 添加文件修改日期单元格\n        cell = row.insertCell(3);\n        textNode\
  \ = document.createTextNode(files[i].lastModifiedDate);\n        cell.appendChild(textNode);\n\
  \      }\n    }\n    fileTable.style.visibility = 'visible';\n  } else {\n    fileTable.style.visibility\
  \ = 'hidden';\n  }\n}\n// 清空表格\nfunction clearTable() {\n  // 获取我们的表格\n  var fileTable\
  \ = document.getElementById('fileTable');\n  // 循环并移除现有行\n  while (fileTable.rows.length>0)\
  \ {\n    fileTable.deleteRow(fileTable.rows.length-1);\n  }\n}\n// 初始化窗口\nwindow.addEventListener('load',init,false);\n\
  </script>\n</head>\n<body>\n  <h1>将多个文件拖到下面的释放区域：</h1>\n  <section id=\"fileSelection\"\
  >\n    <!--\n    // 多文件部分也可以通过 multiple 属性实现\n    <input type=\"file\" id=\"input\"\
  \ multiple=\"true\" onchange=\"displayFiles(this.files)\">\n    -->\n    <div id=\"\
  dropZone\">将文件拖到这里</div>\n  </section>\n  <section id=\"filesSelected\">\n    <br>\n\
  \    <div id=\"fileCount\"></div>\n    <table id=\"fileTable\">\n    </table>\n\
  \  </section>\n</body>\n</html>\n```\n\n\n\n\n\n页面在浏览器中加载后，将通过窗口 `load` 事件监听器调用的\
  \ `init` 函数初始化拖放区域。`init` 将 `dropzone` 变量设置为 `dropzone div`，并为 `dragover` 和 `drop`\
  \ 事件注册两个事件监听器。当触发 `dragover` 事件时，将调用 `handleDragOver` 函数；当触发 `drop` 事件时，将调用 `handleFileDrop`\
  \ 函数。当文件被拖放到拖放区域并调用 `handleFileDrop` 时，脚本将检索 `FileList` 并将其传递给 `displayFiles` 方法。\n\
  \n`displayFiles` 函数调用辅助函数 `clearTable` 来清除任何之前的结果。`clearTable` 会从表格中删除行，直到所有行都被删除。接下来，`displayFiles`\
  \ 检查 `FileList` 的长度，以验证文件是否已拖入拖放区域。脚本使用索引遍历 `FileList` 以获取每个 `File` 接口。对于每个 `File`\
  \ 对象，将检索属性并将其作为新行中的新单元格添加到表格中。最后，脚本通过将表格设为可见来显示表格，如图 14.1 中的示例执行所示。\n\n图 14.1 显示拖动并放置到页面的文件多个属性的示例输出\n\
  \n![image](img/fig14_1.jpg)\n\n通过使用拖放区域和 `FileList` 序列，HTML5 让访问者轻松将文件提交到客户端页面。然而，到目前为止，你查看的是文件的属性而不是文件中的数据。在本章的剩余部分中，你将学习如何在客户端\
  \ JavaScript 中读取不同类型的文件。\n\n提示\n\n继承自 `Blob` 接口的 `File` 接口的 `type` 属性返回文件的多用途邮件扩展（MIME）类型。MIME\
  \ 类型是全小写且 ASCII 编码的 `DOMString`。此 MIME 类型字符串可以用于根据 `image` 或类似的文件类型进行过滤。如图 14.1\
  \ 所示，这里有两张不同类型的图像，但 MIME 以 `image` 开头，因此你可以轻松验证这两个文件都是图像。正如你将在下一节中看到的，MIME 类型提供了一种执行文件过滤和验证的简单有效的方法。\n\
  \n### `FileReader` 接口\n\n为了将文件读取到客户端内存中，HTML5 File API 提供了一个名为 `FileReader` 的新接口。该接口提供了方法、属性和事件，允许开发者从客户端\
  \ JavaScript 异步读取文件。通过 `FileReader` 事件，你可以显示或处理文件数据。可以读取不同类型的文件，因为 `FileReader`\
  \ 接口具有四种不同的读取方法，取决于你可能读取的文件类型：\n\n- `readAsArrayBuffer(Blob)`：将文件内容作为 `ArrayBuffer`\
  \ 返回\n- `readAsBinaryString(Blob)`：将文件内容作为二进制字符串返回\n- `readAsText(Blob [,encoding])`：将文件内容作为文本\
  \ `DOMString` 返回\n- `readAsDataURL(Blob)`：将文件内容作为数据 URL 的 `DOMString` 返回\n\n由于 `FileReader`\
  \ 接口是异步的，这允许页面的主线程继续处理，同时使用事件来捕获文件读取的关键阶段。表 14.2 显示了作为 `FileReader` 接口一部分定义的事件。\n\
  \n表 14.2 `FileReader` 事件\n\n![image](img/14tab02.jpg)\n\n通过使用适当 `FileReader` 读取方法并监听\
  \ `FileReader` 事件，你可以使用 `FileReader` 接口在客户端浏览器中执行通常在上传文件后在服务器上发生的工作。在下一个配方中，你将使用\
  \ `readAsDataURL` 方法在用户的浏览器中创建选中图像的缩略图，并显示它们相应的属性。\n\n注意\n\n通过结合 Web Worker 使用 `FileReaderSync`，可以将文件读取作为同步接口，因为\
  \ Web Workers API 允许方法在不同于主线程的线程上操作。`FileReaderSync` 具有与 `FileReader` 相同的方法。关于同步\
  \ File API 使用的信息，请参考 W3C 工作草稿。\n\n### 中级配方：通过 `readAsDataURL` 预览图像\n\n`FileReader`\
  \ 接口的 `readAsDataURL` 方法接收提供的 `Blob` 或 `File` 引用并将数据读取到可以在适当容器中加载的 URL。在这个配方中，你将让访问者选择多个文件，然后从文件中过滤出图像，通过\
  \ `readAsDataURL` 读取它们，并将它们加载到图像容器中作为缩略图查看。通常，在 HTML5 File API 出现之前，要实现此功能，你需要将文件上传到服务器，在服务器上进行处理，然后将它们加载到客户端浏览器页面。这增加了往回发送文件和在服务器上处理文件的开销。通过使用\
  \ HTML5 File API，你可以省去往回发送文件的需求，并利用客户端机器的计算能力来执行文件的处理。\n\n此配方将使用 `readAsDataURL`\
  \ 方法配合 `onload FileReader` 事件来读取选定的文件。此外，配方将显示文件的属性。要开始此配方，请在列表 14.3 中执行以下步骤：\n\n\
