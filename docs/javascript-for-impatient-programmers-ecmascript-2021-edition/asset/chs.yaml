  \n### 45.5.1 默认情况下，正则表达式在字符串的任何位置匹配\n\n### 45.5.2 `regExp.test(str)`：是否存在匹配？ ^([ES3])\n\
  \n### 45.5.3 `str.search(regExp)`：匹配的索引在何？ ^([ES3])\n\n### 45.5.4 `regExp.exec(str)`：捕获组\
  \ ^([ES3])\n\n### 45.5.5 `str.match(regExp)`：获取所有分组 0 的捕获 ^([ES3])\n\n### 45.5.6\
