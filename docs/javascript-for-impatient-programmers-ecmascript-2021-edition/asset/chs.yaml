  *   5.7 演进中的 JavaScript：不要破坏 Web\n\n## 5.1 JavaScript 是如何创建的\n\nJavaScript 是 1995\
  \ 年 5 月在 10 天内由 Brendan Eich 创建的。Eich 在 Netscape 工作，并为他们的浏览器 `Netscape Navigator`\
  \ 实现了 JavaScript。\n\n当时的想法是，客户端 Web 的主要交互部分将用 Java 实现。JavaScript 被设计为这些部分的胶水语言，并让\
  \ HTML 稍微具有一些交互性。考虑到它辅助 Java 的角色，JavaScript 必须看起来像 Java。这排除了 Perl、Python、TCL 等其他现有解决方案。\n\
  \n最初，JavaScript 的名称更改了几次：\n\n*   它的代号是 `Mocha`。\n*   在 Netscape Navigator 2.0 beta\
  \ 版中（1995 年 9 月），它被称为 `LiveScript`。\n*   在 Netscape Navigator 2.0 beta 3 中（1995\
  \ 年 12 月），它获得了最终名称 `JavaScript`。\n\n## 5.2 JavaScript 标准化\n\nJavaScript 有两个标准：\n\
  \n*   ECMA-262 由 Ecma International 托管。它是主标准。\n*   ISO/IEC 16262 由国际标准化组织 (ISO)\
  \ 和国际电工委员会 (IEC) 托管。这是一个次要标准。\n\n这些标准描述的语言被称为 `ECMAScript`，而不是 `JavaScript`。选择另一个名称是因为\
  \ Sun（现为 Oracle）拥有后者名称的商标。“ECMAScript”中的“ECMA”源于托管主标准的组织。\n\n该组织的原始名称是 `ECMA`，是\
  \ `European Computer Manufacturers Association`（欧洲计算机制造商协会）的缩写。后来更改为 `Ecma International`（其中“Ecma”是一个专有名词，而不是缩写），因为该组织的活动已经扩展到欧洲以外。最初的全大写缩写解释了\
  \ ECMAScript 的拼写。\n\n在原则上，JavaScript 和 ECMAScript 指的是同一个意思。有时会做出如下区分：\n\n*   `JavaScript`\
  \ 一术指的是语言本身及其实现。\n*   `ECMAScript` 一术指的是语言标准和版本。\n\n因此，`ECMAScript 6` 是语言的一个版本。\n\
  \n## 5.3 ECMAScript 时间线\n\n这是 ECMAScript 的简要时间线：\n\n*   ECMAScript 1 (1997 年 6 月)：标准的第一个版本。\n\
  *   ECMAScript 2 (1998 年 6 月)：为了保持 ECMA-262 与 ISO 标准同步。\n*   ECMAScript 3 (1999\
  \ 年 12 月)：增加了许多核心特性——正则表达式、更好的字符串处理、新的控制语句 do-while、switch、try/catch 异常处理。\n*  \
  \ ECMAScript 4 (2008 年 7 月放弃)：本是一个巨大的升级（带有静态类型、模块、命名空间等），但由于目标过大，导致了语言维护者的分歧。\n\
  *   ECMAScript 5 (2009 年 12 月)：带来了微小的改进——一些标准库功能和严格模式。\n*   ECMAScript 5.1 (2011\
  \ 年 6 月)：为了保持 Ecma 和 ISO 标准同步的另一个微小更新。\n*   ECMAScript 6 (2015 年 6 月)：一次大型更新，实现了\
  \ ECMAScript 4 的许多承诺。这是第一个根据发布年份命名的正式名称 `ECMAScript 2015` 版本。\n*   ECMAScript 2016\
  \ (2016 年 6 月)：第一个年度版本。较短的发布周期导致相比大型 ES6 新特性较少。\n*   ECMAScript 2017 (2017 年 6 月)：第二个年度版本。\n\
  *   随后的 ECMAScript 版本（ES2018 等）始终在 6 月通过。\n\n## 5.4 Ecma 技术委员会 39 (TC39)\n\nTC39\
  \ 是演进 JavaScript 的委员会。严格来说，成员是公司：Adobe、Apple、Facebook、Google、Microsoft、Mozilla、Opera、Twitter\
  \ 等。也就是说，通常是竞争对手的公司为了语言的利益共同努力。\n\n每两个月，TC39 会举行成员代表和受邀专家参加的会议。会议记录公开在 [GitHub 仓库](https://github.com/tc39/tc39-notes/)\
  \ 中。\n\n\n\n\n\n## 5.5 TC39 流程\n\n随着 ECMAScript 6 的出现，当时发布流程中的两个问题变得显而易见：\n\n* 如果发布之间的时间间隔过长，那么早期就绪的功能必须等待很长时间才能发布。而晚期就绪的功能则面临为了赶期限而仓发布的风险。\n\
  * 特性通常在实现和使用很久以前设计好了。因此，与实现和使用相关的设计缺陷发现得太晚。\n\n针对这些问题，TC39 建立了新的 `TC39 流程`：\n\n\
  * ECMAScript 特性独立设计，并经过多个阶段，从阶段 0（“草案”）开始，到阶段 4（“完成”）结束。\n* 特别后期阶段需要原型实现和真实世界的测试，导致了设计与实现之间的反馈循环。\n\
  * ECMAScript 版本每年发布一次，包含所有在发布截止日期之前达到阶段 4 的功能。\n\n结果是：更小、增量式的发布，其功能已经经过了现场测试。图 1\
  \ 展示了 TC39 流程。\n\n![](img/file8.svg)\n\n图 1：每个 ECMAScript 特性提案都会经过 0 到 4 编号的阶段。`Champions`\
  \ 是支持特性作者的 TC39 成员。Test 262 是一套检查 JavaScript 引擎是否符合语言规范的测试套。\n\nES2016 是第一个根据 TC39\
  \ 流程设计的 ECMAScript 版本。\n\n### 5.5.1 提示：按单个特性和阶段来思考，而不是 ECMAScript 版本\n\n在 ES6 及其之前的版本中，最常见的做法是根据\
  \ ECMAScript 版本来考虑 JavaScript——例如，“这个浏览器支持 ES6 吗？”\n\n从 ES2016 开始，最好按单个特性来思考：一旦某个特性达到阶段\
  \ 4，你就可以安全地使用它（如果你的目标目标 JavaScript 引擎支持它的话）。你不需要等到下一个 ECMAScript 发布。\n\n## 5.6 FAQ：TC39\
  \ 流程\n\n### 5.6.1 [我最喜欢的提议特性] 进展如何？\n\n如果你想知道各种提议特性处于什么阶段，请查阅 [GitHub 仓库 `proposals`](https://github.com/tc39/proposals)。\n\
  \n### 5.6.2 有 ECMAScript 特性的正式列表吗？\n\n有的，TC39 仓库列出了[已完成提案](https://github.com/tc39/proposals/blob/master/finished-proposals.md)，并提到了它们是在哪些\
  \ ECMAScript 版本中引入的。\n\n## 5.7 演化的 JavaScript：不要破坏网页偶尔会出现一个想法是通过删除旧特性和缺陷来清理 JavaScript。虽然这个想法的吸引力显而易见，但它有巨大的副作用。\n\
  \n假设我们创建了一个不后兼容的新 JavaScript 版本并修复了它所有的缺陷。结果，我们将遇到以下问题：\n\n* JavaScript 引擎变得臃肿：它们需要同时支持旧版本新版本。IDE\
  \ 和构建工具也是如此。\n* 程序员需要知道并意识到版本之间的差异。\n* 你可以将所有现有代码迁移到新版本（这可能需要大量工作）。或者你可以混合版本，这样重构就会变得更困难，因为你无法在版本之间移动代码。\n\
  * 你必须以某种方式为每段代码（无论是文件还是嵌入网页的代码）指定它是哪个版本。任何可能的解决方案都有优缺点。例如，`strict mode` 是 ES5 的一个稍微干净的版本。它没有想象中那样流行的原因之一是：通过文件或函数开头的指令来开启太麻烦了。\n\
  \n那么解决方案是什么？我们能既要鱼又要网子吗？为 ES6 选取的方法被称为“单一 JavaScript”：\n\n* 新版本始终向后兼容（但偶尔会有微小调整，几乎不是为了清理）。\n\
  * 旧特性不会被删除或修复。相反，会引入它们的更好版本。一个例子是通过 `let` 声明变量——它是 `var` 的改进版本。\n* 如果语言的某些方面发生了更改，它是在新构造内部进行的。也就是说，你选择开启。例如，`yield`\
  \ 仅在生成器（ES6 引入）内部是一个关键字。而且模块和类（均在 ES6 引入）中的所有代码都隐式处于严格模式。\n\n![](img/file7.svg)\
  \ 练习\n\n查看测验。\n\n# 6 新的 JavaScript 特性\n\n* 6.1 ECMAScript 2021 新特性\n* 6.2 ECMAScript\
  \ 2020 新特性\n* 6.3 ECMAScript 2019 新特性\n* 6.4 ECMAScript 2018 新特性\n* 6.5 ECMAScript\
  \ 2017 新特性\n* 6.6 ECMAScript 2016 新特性\n* 6.7 本章来源\n\nECMAScript 6 (ES2015) 是一次重大的发布，特性多到无法列出。后续发布中的新内容如下所示，按时间倒序排列。\n\
  \n## 6.1 ECMAScript 2021 新特性\n\nES2021 的特性集尚未最终确定。这些是已经达到阶段 4 并几乎会被包含的提案：\n\n* ``String.prototype.replaceAll()``\n\
  * ``Promise.any()``\n* `WeakRefs`（超出本书范围，参见[提案](https://github.com/tc39/proposal-weakrefs)）\n\
  * 逻辑赋值运算符\n* 下划线 (`_`) 作为 数字字面量 和 bigint 字面量 中的分隔符\n\n## 6.2 ECMAScript 2020 新特性\n\
  \n以下特性被添加到了 ECMAScript 2020 中：\n\n* ``String.prototype.matchAll()``\n* 通过 ``import()`\
  \ 进行的动态导入\n* Bigints – 任意精度整数\n* ``Promise.allSettled()``\n* `globalThis`\n* `for-in`\
  \ 机制（超出本书范围，参见[提案](https://github.com/tc39/proposal-for-in-order)）\n* 属性访问和方法调用的可选链\n\
  * 空值合并运算符 (``??``](ch017.xhtml_nullish-coalescing-operator)\n* ``import.meta`\n\
  * 命名空间重导出:\n```javascript\nexport * as ns from \"mod\";\n```\n\n## 6.3 ECMAScript\
  \ 2019 新特性\n\n以下特性被添加到了 ECMAScript 2019 中：\n\n* 可选的 `catch` 绑定\n* ``Symbol.prototype.description`\n\
  * ``Object.fromEntries()``\n* 字符串方法：``trimStart()`` 和 ``trimEnd()``\n* 数组方法：``flatMap()``\
  \ 和 ``flat()``\n\n这些新的 ES2019 特性超出了本书范围：\n\n* JSON 超集（参见 [2ality 博客文章](https://2ality.com/2019/01/json-superset.html)）\n\
  * `Function.prototype.toString()` 修订（参见 [2ality 博客文章](https://2ality.com/2016/08/function-prototype-tostring.html)）\n\
  * 良好的 `JSON.stringify()`（参见 [2ality 博客文章](https://2ality.com/2019/01/well-formed-stringify.html)）\n\
  \n\n\n\n\n* `RegExp` 命名捕获组\n* 剩余属性（解构）, 展开到对象字面量\n* `RegExp` 反向后行查找断言\n* `RegExp`\
  \ Unicode 属性转义符\n* `Promise.prototype.finally()`\n* 异步迭代\n\n## 6.5 ECMAScript 2017\
  \ 的新特性\n\n以下特性在 ECMAScript 2017 中新增的特性：\n\n* `Object.values()`, `Object.entries()`\n\
  * 字符串填充：`.padStart()`](#ch023.xhtml_String.prototype.padStart) 和 `.padEnd()`](#ch023.xhtml_String.prototype.padEnd)\n\
  * `Object.getOwnPropertyDescriptors()`（超出本书范围，请参阅[“深度 JavaScript”](https://exploringjs.com/deep-js/ch_property-attributes-intro.html#Object.getOwnPropertyDescriptors))\n\
  * 函数参数列表和调用中的末尾逗号\n* 异步函数\n* 共享内存和原子操作（超出本书范围，请参阅[提案](https://github.com/tc39/ecmascript_sharedmem))\n\
  \n## 6.6 ECMAScript 2016 的新特性\n\n以下特性在 ECMAScript 2016 中新增的特性：\n\n* `Array.prototype.includes()`\n\
  * 幂运算符 (`**`)](#ch019.xhtml_binary-arithmetic-operators)\n\n## 6.7 本章来源\n\nECMAScript\
