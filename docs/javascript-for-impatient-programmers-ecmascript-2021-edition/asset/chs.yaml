  \n## 29.14 Polyfills（垫填充）：模拟原生平台特性（高级）\n\n### 29.14.1 本节的来源\n\n## 29.1 概述：ECMAScript\
  \ 模块的语法\n\n```javascript\n// 命名导出\nexport function f() {}\nexport const one = 1;\n\
  export {foo, b as bar};\n\n// 默认导出\nexport default function() {} // 带有可选名称的声明（恰好有一个值）\n\
  export default 123;\n// 从另一个模块重新导出\nexport {foo, b as bar} from './some-module.mjs';\n\
  export * from './some-module.mjs';\nexport * as ns from './some-module.mjs'; //\
  \ ES2020\n```\n\n### 29.1.2 导入\n\n```javascript\n// 命名导入\nimport {foo, b as b} from\
  \ './some-module.mjs';\n// 命名空间导入\nimport * as someModule from './some-module.mjs';\n\
  // 默认导入\nimport someModule from './some-module.mjs';\n// 组合：\nimport someModule,\
  \ * as someModule from './some-module.mjs';\nimport someModule, {foo, b as b} from\
  \ './some-module.mjs';\n// 空导入（用于具有副作用的模块）\nimport './some-module.mjs';\n```\n\n\
  ## 29.2 JavaScript 源代码格式\n\nJavaScript 模块的格局非常多样：ES6 引入了内置模块，但在此之前的源代码格式仍然存在。理解后者有助于理解前者，因此让我们来研究。接下来的章节描述了交付源代码的以下方式：\n\
  \n*   `Scripts`（脚本）是浏览器在全局作用域中运行的代码片段。它们是模块的前身。\n*   `CommonJS modules`（CommonJS\
  \ 模块）是一种主要用于服务器端（例如通过 `Node.js`）的模块格式。\n*   `AMD modules`（AMD 模块）是一种主要用于浏览器的模块格式。\n\
  *   `ECMAScript modules`（ES 模块）是 JavaScript 内置的模块格式。它取代了所有以前的格式。\n\n表 18 提供了这些代码格式的概述。注意，对于\
  \ CommonJS 模块和 ECMAScript 模块，通常使用两种文件名扩展名。哪一个取决于你想要如何使用文件。细节将在本章后面的部分给出。\n\n表 18：交付\
  \ JavaScript 源代码的方式。\n\n| 运行环境 | 加载方式 | 文件扩展名 |\n| --- | --- | --- | --- |\n| Script\
  \ | 浏览器 | async | `.js` |\n| CommonJS module | 服务器 | sync | `.js .cjs` |\n| AMD\
  \ module | 浏览器 | async | `.js` |\n| ECMAScript module | 浏览器和服务器 | async | `.js .mjs`\
  \ |\n\n### 29.2.1 内置模块之前的代码是用 ECMAScript 5 编写的\n\n在进入内置模块（随 ES6 引入）之前，看到的所有代码都将用\
  \ ES5 编写。其他包括：\n\n*   ES5 没有 `const` 和 `let`，只有 `var`。\n*   ES5 没有箭头函数，只有函数表达式。\n\
  \n## 29.3 在我们拥有模块之前，我们拥有脚本\n\n最初，浏览器只有 `scripts`（脚本）——在全局作用域中执行的代码段。例如，考虑一个通过以下\
  \ HTML 加载脚本文件的 HTML 文件：\n\n```html\n<script src=\"other-module1.js\"></script>\n\
  <script src=\"other-module2.js\"></script>\n<script src=\"my-module.js\"></script>\n\
  ```\n\n主文件是 `my-module.js`，在其中模拟了一个模块：\n\n```javascript\nvar myModule = (function\
  \ () { // 立即调用函数表达式 Open IIFE\n  // 导入（通过全局变量）\n  var imported1 = otherModule1;\n\
  \  var imported2 = otherModule2;\n  // 主体\n  function internalFunc() {\n    imported1();\n\
  \  }\n  function exportedFunc() {\n    imported2();\n  }\n  // 导出（赋值给全局变量 `myModule`）\n\
  \  return {\n    exportedFunc: exportedFunc\n  };\n})(); // 关闭 IIFE Close IIFE\n\
  ```\n\n`myModule` 是一个全局变量，赋值为立即调用函数表达式的结果。该函数表达式开始于第一行，在最后一行被调用。这种封装代码片段的方法被称为*立即调用表达式*（IIFE，由\
  \ Ben Alman 命名）。注意我们以特定方式使用了 IIFE：在结束时，我们挑选要导出的内容并通过对象字面量返回。这被称为*揭示模块模式*（由 Christian\
  \ Heilmann 命名）。\n\n这种模拟模块的方法存在几个问题：\n\n*   脚本文件中的库通过全局变量导出和导入功能，存在命名冲突风险。\n*   依赖关系没有显式声明，脚本没有内置方法来加载其所依赖的脚本。因此，网页必须不仅加载页面所需的脚本，还要加载这些脚本的依赖项、依赖项的依赖项等。而且它必须按照正确的顺序进行加载！\n\
  \n## 29.4 ES6 之前创建的模块系统\n\n在 ECMAScript 6 之前，JavaScript 没有内置模块。因此，使用了语言灵活的语法在语言*内部*实现了自定义模块系统。两种流行的系统是：\n\
  \n\n\n\n\n### 29.4.1 服务端：CommonJS 模块\n\n原始 CommonJS 模块标准是为服务器和桌面平台设计的。它是原始 Node.js\
  \ 模块系统的基础，并在那里获得了极大的普及。这种普及得益于 Node 的 `npm` 包管理器以及允许在客户端使用 Node 模块的工具（`browserify`、`webpack`\
  \ 等）。\n\n从现在起，`CommonJS module` 指的是该标准的 Node.js 版本（带有一些额外功能）。这是一个 CommonJS 模块的示例：\n\
  \n```\n[](#cb607-1)// Imports\n[](#cb607-2)var importedFunc1 = require('./other-module1.js').importedFunc1;\n\
  [](#cb607-3)var importedFunc2 = require('./other-module2.js').importedFunc2;\n[](#cb607-4)\n\
  [](#cb607-5)// Body\n[](#cb607-6)function internalFunc() {\n[](#cb607-7)  // ···\n\
  [](#cb607-8)}\n[](#cb607-9)function exportedFunc() {\n[](#cb607-10)  importedFunc1();\n\
  [](#cb607-11)  importedFunc2();\n[](#cb607-12)  internalFunc();\n[](#cb607-13)}\n\
  [](#cb607-14)\n[](#cb607-15)// Exports\n[](#cb607-16)module.exports = {\n[](#cb607-17)\
  \  exportedFunc: exportedFunc,\n[](#cb607-18)};\n```\n\nCommonJS 的特征如下：\n\n- 为服务器设计。\n\
  - 模块被设计为`synchronously`加载（导入者在被导入模块加载和执行时会等待）。\n- 语法简洁。\n\n### 29.4.2 客户端：AMD（异步模块定义）模块\n\
  \nAMD 模块格式的创建是为了比 CommonJS 格式在浏览器中更易使用。它最流行的实现是 [RequireJS](https://requirejs.org)。以下是一个\
  \ AMD 模块的示例。\n\n```\n[](#cb608-1)define(['./other-module1.js', './other-module2.js'],\n\
  [](#cb608-2)  function (otherModule1, otherModule2) {\n[](#cb608-3)    var importedFunc1\
  \ = otherModule1.importedFunc1;\n[](#cb608-4)    var importedFunc2 = otherModule2.importedFunc2;\n\
  [](#cb608-5)\n[](#cb608-6)    function internalFunc() {\n[](#cb608-7)      // ···\n\
  [](#cb608-8)    }\n[](#cb608-9)    function exportedFunc() {\n[](#cb608-10)    \
  \  importedFunc1();\n[](#cb608-11)      importedFunc2();\n[](#cb608-12)      internalFunc();\n\
  [](#cb608-13)    }\n[](#cb608-14) \n[](#cb608-15)    return {\n[](#cb608-16)   \
  \   exportedFunc: exportedFunc,\n[](#cb608-17)    };\n[](#cb608-18)  });\n```\n\n\
  AMD 的特征如下：\n\n- 为浏览器设计。\n- 模块被设计为`asynchronously`加载。这是浏览器的一项关键需求，因为代码无法等待模块完成下载。一旦模块可用，它就必须被通知。\n\
  - 语法稍微复杂一些。\n\n优点是，AMD 模块可以直接执行。与此相反，CommonJS 模块必须在部署之前进行编译，或者必须动态生成并评估自定义源代码（想象使用\
  \ `eval()`）。这在 Web 上并不总是被允许的。\n\n### 29.4.3 JavaScript 模块的特征\n\n观察 CommonJS 和 AMD，可以发现\
  \ JavaScript 模块系统之间的相似之处：\n\n- 每个文件有一个模块。\n- 这样的文件基本上是一段被执行的代码：\n    - 局部作用域：代码在本地的“模块作用域”中执行。因此，默认情况下，在其中声明的所有变量、函数和类都是内部的，而不是全局的。\n\
  \    - 导出（Exports）：如果你想导出任何声明的实体，必须显式地将其标记为导出。\n    - 导入（Imports）：每个模块都可以从其他模块导入导出的实体。这些其他模块通过`module\
  \ specifiers`（通常是路径，有时是完整的 URL）进行标识。\n- 模块是`singletons`：即使一个模块被导入多次，也只存在一个“实例”。\n\
  - 不使用全局变量。相反，模块指定符充当全局 ID。\n\n## 29.5 ECMAScript 模块\n\n`ECMAScript modules`（`ES\
  \ modules` 或 `ESM`）是在 ES6 中引入的。它们延续了 JavaScript 模块的传统并具有上述的所有特征。此外：\n\n- 与 CommonJS\
  \ 相比，ES 模块共享简洁的语法和对循环依赖的支持。\n- 与 AMD 相比，ES 模块共享为异步加载设计的特点。\n\nES 模块还具有新的优势：\n\n\
  - 语法比 CommonJS 的更加简洁。\n- 模块具有`static` 结构（运行时无法更改）。这有助于静态检查、优化导入的访问、死代码消除等。\n- 对循环导入的支持是完全透明的。\n\
  \n这是一个 ES 模块语法的示例：\n\n```\n[](#cb609-1)import {importedFunc1} from './other-module1.mjs';\n\
  [](#cb609-2)import {importedFunc2} from './other-module2.mjs';\n[](#cb609-3)\n[](#cb609-4)function\
  \ internalFunc() {\n[](#cb609-5)  ···\n[](#cb609-6)}\n[](#cb609-7)\n[](#cb609-8)export\
  \ function exportedFunc() {\n[](#cb609-9)  importedFunc1();\n[](#cb609-10)  importedFunc2();\n\
  [](#cb609-11)  internalFunc();\n[](#cb609-12)}\n```\n\n从现在起，“模块”意味着“ECMAScript 模块”。\n\
  \n### 29.5.1 ES 模块：语法、语义、加载器 API\n\nES 模块的完整标准包含以下部分：\n\n1. 语法（代码如何编写）：什么是模块？导入和导出是如何声明的？等等。\n\
  2. 语义（代码如何执行）：变量绑定是如何导出的？导入是如何与导出连接的？等等。\n3. 用于配置模块加载的程序加载器 API。\n\n部分 1 和 2 是在\
  \ ES6 中引入的。部分 3 的工作正在进行中。\n\n## 29.6 命名导出和导入\n\n### 29.6.1 命名导出\n\n每个模块可以有零或多个`named\
  \ exports`（命名导出）。\n\n例如，考虑两个文件：\n\n```\nlib/my-math.mjs\nmain.mjs\n```\n\n模块 `my-math.mjs`\
  \ 有两个命名导出：`square` 和 `LIGHTSPEED`。\n\n```\n[](#cb611-1)// 未导出，模块私有\n[](#cb611-2)function\
  \ times(a, b) {\n[](#cb611-3)  return a * b;\n[](#cb611-4)}\n[](#cb611-5)export\
  \ function square(x) {\n[](#cb611-6)  return times(x, x);\n[](#cb611-7)}\n[](#cb611-8)export\
  \ const LIGHTSPEED = 299792458;\n```\n\n要导出某些内容，我们在声明前面加上 `export` 关键字。未导出的实体是模块私有的。\n\
  \n### 29.6.2 命名导入\n\n模块 `main.mjs` 有一个命名导入，`square`：\n\n```\n[](#cb612-1)import\
  \ {square} from './lib/my-math.mjs';\n[](#cb612-2)assert.equal(square(3), 9);\n\
  ```\n\n它也可以重命名它的导入：\n\n```\n[](#cb613-1)import {square as sq} from './lib/my-math.mjs';\n\
  [](#cb613-2)assert.equal(sq(3), 9);\n```\n\n#### 29.6.2.1 语法陷阱：命名导入不是解构\n\n命名导入和解构看起来非常相似：\n\
  \n```\n[](#cb614-1)import {foo} from './bar.mjs'; // \n[](#cb614-2)const {foo} =\
  \ require('./bar.mjs'); // 解构\n```\n\n但它们很大不同：\n\n- 导入保持与导出连接。\n- 你可以在解构模式中再次进行解构，但导入中的\
  \ `{}` 不能嵌套。\n- 重命名语法不同：\n\n    ```\n    [](#cb615-1)import {foo as f} from './bar.mjs';\
  \ // 导入\n    [](#cb615-2)const {foo: f} = require('./bar.mjs'); // 解构\n    ```\n\
  \n    原理：解构看起来类似于对象字面量（包括嵌套），而导入引发了重命名的想法。\n\n![](img/file6.svg) **练习：命名导出**\n\n\
  `exercises/modules/export_named_test.mjs`\n\n### 29.6.3 命名空间导入\n\n*Namespace imports*\
  \ 是命名导入的替代方案。如果我们命名空间导入一个模块，它将变成一个属性为命名导出的对象。如果我们使用命名空间导入，`main.mjs` 如下：\n\n```\n\
  [](#cb616-1)import * as myMath from './lib/my-math.mjs';\n[](#cb616-2)assert.equal(myMath.square(3),\
  \ 9);\n[](#cb616-3)\n[](#cb616-4)assert.deepEqual(Object.keys(myMath), ['LIGHTSPEED',\
  \ 'square']);\n```\n\n### 29.6.4 命名导出样式：内联与子句（高级）\n\n我们目前看到的命名导出样式是*内联*的：通过在声明前加上\
  \ `export` 关键字来导出实体。\n\n\n\n\n但我们也可以使用独立的 `export clauses`。例如，`lib/my-math.mjs`\
  \ 使用导出句后的样子如下：\n\n```\nfunction times(a, b) {\n  return a * b;\n}\nfunction square(x)\
  \ {\n  return times(x, x);\n}\nconst LIGHTSPEED = 299792458;\n\nexport { square,\
  \ LIGHTSPEED }; // 这里有分号！\n```\n\n通过导出句，我们可以在导出前进行重命名，并在内部使用不同的名称：\n\n```javascript\n\
  function times(a, b) {\n  return a * b;\n}\nfunction sq(x) {\n  return times(x,\
  \ x);\n}\nconst LS = 299792458;\n\nexport {\n  sq as square,\n  LS as LIGHTSPEED,\
  \ // 末尾逗号是可选的\n};\n```\n\n## 29.7 默认导出与导入\n\n每个模块最多有一个 `default export`。其核心思想是模块本身*就是*默认出的值。\n\
  \n![](img/file2.svg) **避免混合使用命名导出和默认导出**\n\n一个模块可以同时拥有命名导出和默认导出，但通常每个模块只坚持一种导出样式会更好。\n\
  \n作为默认导出的示例，考虑以下两个文件：\n\n```\nmy-func.mjs\nmain.mjs\n```\n\n模块 `my-func.mjs` 有一个默认导出：\n\
  \n```javascript\nconst GREETING = 'Hello!';\nexport default function () {\n  return\
  \ GREETING;\n}\n```\n\n模块 `main.mjs` 默认导入了导出的函数：\n\n```javascript\nimport myFunc\
  \ from './my-func.mjs';\nassert.equal(myFunc(), 'Hello!');\n```\n\n注意语法上的区别：命名导入周围的大括号表示我们正在进入模块*内部*，而默认导入获取的*就是*模块本身。\n\
  \n![](img/file3.svg) **默认导出的用例有哪些？**\n\n默认导出的最常见用例是模块只包含单个函数或单个类。\n\n### 29.7.1\
  \ 默认导出的两种样式\n\n执行默认导出有两种样式。\n\n首先，你可以使用 `export default` 对现有的声明进行标记：\n\n```javascript\n\
  export default function foo() {} // 没有分号！\nexport default class Bar {} // 没有分号！\n\
  ```\n\n其次，你可以直接默认导出值。在这种样式下，`export default` 本身非常像一个声明。\n\n```javascript\nexport\
  \ default 'abc';\nexport default foo();\nexport default /^xyz$/;\nexport default\
  \ 5 * 7;\nexport default { no: false, yes: true };\n```\n\n#### 29.7.1.1 为什么会有两种默认导出样式？\n\
  \n原因是 `export default` 不能用于标记 `const`：`const` 可能会定义多个值，但 `export default` 恰好需要一个值。考虑以下假设代码：\n\
  \n```javascript\n// 这不是合法的 JavaScript！\nexport default const foo = 1, bar = 2, baz\
  \ = 3;\n```\n\n使用这段代码，你无法知道这三个值中的哪是默认导出。\n\n![](img/file6.svg) **练习：默认导出**\n\n`exercises/modules/export_default_test.mjs`\n\
  \n### 29.7.2 作为命名导出的默认导出（进阶）\n\n在内部，默认导出仅仅是一个名为 `default` 的命名导出。作为示例，考虑之前带有默认导出的模块\
  \ `my-func.mjs`：\n\n```javascript\nconst GREETING = 'Hello!';\nexport default function\
  \ () {\n  return GREETING;\n}\n```\n\n以下模块 `my-func2.mjs` 等效于上一个模块：\n\n```javascript\n\
  const GREETING = 'Hello!';\nfunction greet() {\n  return GREETING;\n}\n\nexport\
  \ {\n  greet as default,\n};\n```\n\n对于导入，我们可以使用普通的默认导入：\n\n```javascript\nimport\
  \ myFunc from './my-func2.mjs';\nassert.equal(myFunc(), 'Hello!');\n```\n\n或者我们可以使用命名导入：\n\
  \n```javascript\nimport {default as myFunc} from './my-func2.mjs';\nassert.equal(myFunc(),\
  \ 'Hello!');\n```\n\n默认导出也可以通过命名空间导入的属性 `.default` 使用：\n\n```javascript\nimport\
  \ * as mf from './my-func2.mjs';\nassert.equal(mf.default(), 'Hello!');\n```\n\n\
  ![](img/file3.svg) **`default` 不是一个变量名吗？**\n\n`export default` 不能用于标记 `const`：`const`\
  \ 可能会定义多个值，但 `export default` 恰好需要一个值。考虑以下假设代码：\n\n```javascript\n// 这不是合法的 JavaScript！\n\
  export default const foo = 1, bar = 2, baz = 3;\n```\n\n使用这段代码，你无法知道这三个值中的哪是默认导出。\n\
  \n## 29.8 关于导出和导入的更多细节\n\n### 29.8.1 导入是导出的视图\n\n到目前为止，我们直观地使用了导入和导出，一切似乎都运行良好。但现在是时候仔细观察导入和导出之间真实的关系。考虑以下两个文件：\n\
  \n```\ncounter.mjs\nmain.mjs\n```\n\n`counter.mjs` 导出一个变量和一个函数：\n\n```javascript\n\
  export counter = 3;\nexport function incCounter() {\n  counter++;\n}\n```\n\n`main.mjs`\
  \ 默认导入了两者。当我们使用 `incCounter()` 时，我们发现 `counter` 是实时的：\n\n```javascript\nimport {\
  \ counter, incCounter } from './counter.mjs';\nassert.equal(counter, 3);\nincCounter();\n\
  assert.equal(counter, 4);\n```\n\n注意，由于 `counter` 是实时的，我们可以修改 `counter++`。\n\n###\
  \ 29.8.2 ESM 对循环导入的透明支持（进阶）\n\nESM 透明地支持循环导入。为了理解如何实现，考虑以下示例：7 显示了模块的有向图。在这种情况下，P\
  \ 导入 M 就是循环。\n\n![](img/file16.svg)\n\n图 7：模块导入模块的有向图：M 导入 N 和 O，等。\n\n解析后，这些模块分两个阶段进行设置：\n\
  \n- **实例化 (Instantiation)**：访问每个模块，并将其导入连接到其导出。在父模块实例化之前，其所有子模块必须先实例化。\n- **评估 (Evaluation)**：执行模块体。再次，子模块先于父模块进行评估。\n\
  \n这种方法能够正确处理循环导入，这归功于 ES 模块的两个特性：\n\n- 由于 ES 模块的静态结构，导出在解析后就已经已知。这使得在子模块 M 之前实例化\
  \ P 可能的：P 已经查找 M 的导出。\n- 当 P 被评估时，M 尚未被评估。然而，P 中的实体已经可以引用来自 M 的导入。它们只是还不能使用它们，因为导入的值会在稍后填充。\n\
  \n    导入的稍后填充之所以可行，是因为它们是导出的“实时不可变视图”。\n\n## 29.9 npm 包\n\n*npm 软件注册表*（npm software\
  \ registry）是 Node.js 和 浏览器 JavaScript 库和应用程序的主流发布方式。它通过 *npm 包管理器*（npm package manager，简称\
  \ *npm*）进行管理。软件以所谓的*包*（packages）的形式发布。包是一个包含任意文件的目录，顶层包含一个描述包的 `package.json` 文件。例如，当\
  \ npm 在 `my-package/` 目录内创建一个空包时，你会得到这个 `package.json`：\n\n\n\n\n\n```json\n{\n\
  \  \"name\": \"my-package\",\n  \"version\": \"1.0.0\",\n  \"description\": \"\"\
  ,\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"Error:\
  \ no test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\": \"\
  \",\n  \"license\": \"ISC\"\n}\n```\n\n这些属性中的包含简单的元数据：\n\n*   `name` 指定此包的名称。一旦上传到\
  \ npm 注册表，就可以通过 `npm install my-package` 安装。\n\n*   `version` 用于版本管理，并遵循[语义化版本](https://semver.org)，包含三个数字：\n\
  \    *   主版本（Major version）：当发生不兼容的 API 更改时增加。\n    *   次要版本（Minor version）：当以后兼容的方式添加功能时增加。\n\
  \    *   补丁版本（Patch version）：当进行向后兼容的更改时增加。\n\n*   `description`、`keywords`、`author`\
  \ 让人更容易找到包。\n\n*   `license` 阐明你可以如何使用此包。\n\n其他属性启用高级配置：\n\n*   `main`：指定“是”该包的模块（在本章稍后部分解释）。\n\
  \n*   `scripts`：你可以通过 `npm run` 执行的命令。例如，可以通过 `npm run test` 执行脚本 `test`。\n\n欲需关于\
  \ `package.json` 的更多信息，请参阅[npm 文档](https://docs.npmjs.com/files/package.json)。\n\
  \n### 29.9.1 包安装在 `node_modules/` 目录内部\n\nnpm 总是将包安装在 `node_modules` 目录中。通常有很多这样的目录。npm\
  \ 使用哪一个取决于当前所在的目录。例如，如果我们在 `/tmp/a/b/` 目录内，npm 会尝试在当前目录、其父目录、父目录的父目录等处查找 `node_modules`。换句话说，它搜索以下位置的*链*：\n\
  \n*   `/tmp/a/b/node_modules`\n*   `/tmp/a/node_modules`\n*   `/tmp/node_modules`\n\
  \n在安装包 `some-pkg` 时，npm 使用最近的 `node_modules`。例如，如果我们在 `/tmp/a/b/` 内部且该目录下存在 `node_modules`，那么\
  \ npm 将将包放在该目录中：\n\n```\n/tmp/a/b/node_modules/some-pkg/\n```\n\n在导入模块时，我们可以使用特殊的模块标识符告诉\
  \ Node.js 我们想从一个已安装的包导入它。具体工作原理将在稍后解释。现在，请考虑以下示例：\n\n```javascript\n// /home/jane/proj/main.mjs\n\
  import * as theModule from 'the-package/the-module.mjs';\n```\n\n为了找到 `the-module.mjs`（Node.js\
  \ 优先为 ES 模块使用 `.mjs` 扩展名），Node.js 会向上遍历 `node_module` 链并搜索以下位置：\n\n*   `/home/jane/proj/node_modules/the-package/the-module.mjs`\n\
  *   `/home/jane/node_modules/the-package/the-module.mjs`\n*   `/home/node_modules/the-package/the-module.mjs`\n\
  \n### 29.9.2 为什么 npm 可以用于安装前端库？\n\n在 `node_modules` 目录中查找已安装的模块仅支持 Node.js。那么为什么我们也可以用\
  \ npm 安装浏览器的库呢？\n\n这是通过打包工具）。因此，我们避免使用驼峰命名，以便“本地”文件的名称与 npm 包保持一致。仅使用小写字母还可以最大限度地减少大小敏感文件系统与不敏感文件系统之间的冲突：前者区分字母相同但大小写不同的文件；后者则不。\n\
  \n*   将短横线命名的文件名转换为驼峰命名的 JavaScript 变量名有的规则。由于我们命名命名空间的方式，这些规则同时适用于命名空间导入和默认导入。\n\
  \n我也喜欢下划线命名（underscore-cased）的模块文件名，因为你可以直接将这些名称用于命名空间导入（无需任何转换）：\n\n```javascript\n\
  import * as my_module from './my_module.mjs';\n```\n\n但这种风格对于默认导入不起：我喜欢对命名空间对象使用下划线，但它对于函数等并不是一个好的选择。\n\
  \n## 29.11 模块标识符\n\n*模块标识符*（Module specifiers）是标识模块的字符串。它们在浏览器和 Node.js 中的工作略有不同。在查看差异之前，我们需要了解不同类型的模块标识符。\n\
  \n### 29.11.1 模块标识符分类\n\n在 ES 模块中，我们区分以下类型的标识符。这些类别源自 CommonJS 模块。\n\n*   相对路径：以点开头。例如：\n\
  \    ```javascript\n    './some/other/module.mjs'\n    '../../lib/counter.mjs'\n\
  \    ```\n\n*   绝对路径：以斜杠开头。示例：\n    ```javascript\n    '/home/jane/file-tools.mjs'\n\
  \    ```\n\n*   URL：包含协议（技术上讲，路径也是 URL）。例如：\n    ```javascript\n    'https://example.com/some-module.mjs'\n\
  \    'file:///home/john/tmp/main.mjs'\n    ```\n\n*   裸路径（Bare path）：不以点、斜杠或协议开头，由不带扩展名的文件名组成。例如：\n\
  \    ```javascript\n    'lodash'\n    'the-package'\n    ```\n\n*   深度导入路径：以裸路径开头并包含至少一个斜杠。示例：\n\
  \    ```javascript\n    'the-package/dist/the-module.mjs'\n    ```\n\n### 29.11.2\
  \ 浏览器中的 ES 模块标识符\n\n浏览器处理标识符的方式：\n\n*   相对路径、绝对路径和 URL 按预期工作。它们都必须指向真实文件（对比 CommonJS\
  \ 允许省略文件名扩展名）。\n\n*   模块的文件扩展名并不重要，只要它们以 `text/javascript` 内容类型提供。\n\n*   裸路径将如何被处理尚不明确。你可能可能通过查找表将其映射到其他标识符。\n\
  \n注意，打包工具](#ch049.xhtml_bundler）如 webpack 将模块合并为更少的文件，对标识符通常比浏览器宽松。这是因为它们在构建/编译时（而不是运行时）运行，并且可以通过遍历文件系统来搜索文件。\n\
  \n### 29.11.3 Node.js 上的 ES 模块标识符\n\nNode.js 处理标识符的方式：\n\n*   相对路径像在 浏览器中一样解析——相对于当前模块的路径。\n\
  \n*   目前不支持绝对路径。作为替代方案，你可以使用以 `file:///` 开头的 URL。你可以通过 `url.pathToFileURL` 创建此类\
  \ URL。\n\n*   URL 标识符仅支持 `file:` 协议。\n\n*   裸路径被解释为包名，并相对于最近的 `node_modules` 目录解析。加载哪个模块通过查看\
  \ `package.json` 中的 `\"main\"` 属性决定（类似于 CommonJS）。\n\n*   深度导入路径也相对于最近的 `node_modules`\
  \ 目录解析。它们包含文件名，因此始终明确指的是哪个模块。\n\n\n\n\n\n所有的标识符除裸路径（bare paths）外都必须引用实际文件。这意味着，ESM\
  \ 不支持以下 CommonJS 特：\n\n- CommonJS 会自动添加缺失的文件扩展名。\n- 如果存在带有 `\"main\"` 属性的 `dir/package.json`，CommonJS\
  \ 可以导入目录 `dir`。\n- 如果存在模块 `dir/index.js`，CommonJS 可以导入目录 `dir`。\n\n所有内置 Node.js\
  \ 模块都可以通过裸路径访问并具有具名的 ESM 导出——例如：\n\n```\nimport * as assert from 'assert/strict';\n\
  import * as path from 'path';\n\nassert.equal(\n  path.join('a/b/c', '../d'), 'a/b/d');\n\
  );\n```\n\n### 29.11.3.1 Node.js 中的文件名扩展名\n\nNode.js 支持以下默认文件名扩展名：\n\n- `.mjs` 用于\
  \ ES 模块\n- `.cjs` 用于 CommonJS 模块\n\n扩展名 `.js` 代表 ESM 或 CommonJS。具体是哪一种通过“最近”的 `package.json`（在当前目录、父目录等）进行配置。以这种方式使用\
  \ `package.json` 与包是无关的。\n\n在该 `package.json` 中，有一个属性为 `\"type\"`，它有两个设置：\n\n- `\"\
  commonjs\"`（默认值）：扩展名为 `.js` 或没有扩展名的文件被解释为 CommonJS 模块。\n- `\"module\"`：扩展名为 `.js`\
  \ 或没有扩展名的文件被解释为 ESM 模块。\n\n### 29.11.3.2 将非文件源代码解释为 CommonJS 或 ESM\n\n并不是所有由 Node.js\
  \ 执行的代码都来自文件。你还可以通过 `stdin`、`--eval` 和 `--print`发送代码。命令行选项 `--input-type` 允许你指定如何解释此类代码：\n\
  \n- 作为 CommonJS（默认）：`--input-type=commonjs`\n- 作为 ESM：`--input-type=module`\n\n\
  ## 29.12 通过 `import()` 动态加载模块 [ES2020]\n\n到目前，导入模块唯一的方法是通过 `import` 语句。该语句具有几个局限性：\n\
  \n- 你必须在模块的顶层使用它。也就是说，例如，你不能在块（block）内部导入某些内容。\n- 模块标识符始终是固定的。也就是说，你不能根据条件更改导入的内容。你不能动态组装标识符。\n\
  \n`import()` 运算符改变了这一点。让我们来看一个它的使用示例。\n\n### 29.12.1 示例：动态加载模块\n\n考虑以下文件：\n\n```\n\
  lib/my-math.mjs\nmain1.mjs\nmain2.mjs\n```\n\n我们已经看到过模块 `my-math.mjs`：\n\n```\n\
  // 未导出，模块内部私有\nfunction times(a, b) {\n  return a * b;\n}\nexport function square(x)\
  \ {\n  return times(x, x);\n}\nexport const LIGHTSPEED = 299792458;\n```\n\n这是在\
  \ `main1.mjs` 中使用 `import()` 的样子：\n\n```\nconst dir = './lib/';\nconst moduleSpecifier\
  \ = dir + 'my-math.mjs';\n\nfunction loadConstant() {\n  return import(moduleSpecifier)\n\
  \  .then(myMath => {\n    const result = myMath.LIGHTSPEED;\n    assert.equal(result,\
  \ 299792458);\n    return result;\n  });\n}\n```\n\n`.then()` 方法是 `Promises` 的一部分，是一种处理异步结果的机制，将在本书后续章节\
  \ 中介绍。\n\n这段代码中有两点在以前是不可能的：\n\n- 我们在函数内部导入（而不是在顶层）。\n- 模块标识符来自变量。\n\n接下来，我们将在 `main2.mjs`\
  \ 中实现完全相同的功能，但通过所谓的*异步函数*（async function），它为 Promises 提供了更好的语法。\n\n```\nconst dir\
  \ = './lib/';\nconst moduleSpecifier = dir + 'my-math.mjs';\n\nasync function loadConstant()\
  \ {\n  const myMath = await import(moduleSpecifier);\n  const result = myMath.LIGHTSPEED;\n\
  \  assert.equal(result, 299792458);\n  return result;\n}\n```\n\n`.then()` 方法是 `Promises`\
  \ 的一部分，是一种处理异步结果的机制，将在本书后续章节 中介绍。\n\n这段代码中有两点在以前是不可能的：\n\n- 我们在函数内部导入（而不是在顶层）。\n\
  - 模块标识符来自变量。\n\n\n\n\n\n[Node.js 模块 `url`](https://nodejs.org/api/url.html) 提供了两个用于在\
  \ `file:` URL 和路径之间转换的函数：\n\n*   `fileURLToPath(url: URL|string): string`\n    将\
  \ `file:` URL 转换为路径。\n*   `pathToFileURL(path: string): URL`\n    将路径转换为 `file:`\
  \ URL。\n\n如果你需要一个可以在本地文件系统中使用的路径，那么 `URL` 实例的属性 `.pathname` 并不总是可靠的：\n\n```\nassert.equal(\n\
  \  new URL('file:///tmp/with%20space.txt').pathname,\n  '/tmp/with%20space.txt');\n\
  ```\n\n因此，使用 `fileURLToPath()` 更好：\n\n```\nimport * as url from 'url';\nassert.equal(\n\
  \  url.fileURLToPath('file:///tmp/with%20space.txt'),\n  '/tmp/with space.txt');\
  \ // Unix 上的结果\n```\n\n同样地，`pathToFileURL()` 的功能不仅仅是在绝对路径前加上 `'file://'`。\n\n##\
  \ 29.14 Polyfills：模拟原生 Web 平台特性（高级）\n\n![](img/file5.svg) **后端也有 polyfills**\n\n\
  这一节关于前端开发和 Web 浏览器，但类似的思想也适用于后端开发。\n\n`Polyfills` 帮助解决我们在 JavaScript 开发 Web 应用时面临的一个冲突：\n\
  \n*   一方面，我们想使用现代 Web 平台特性，让应用变得更好和/或让开发更简单。\n*   另一方面，应用应该在尽可能多的浏览器上运行。\n\n假设有一个\
  \ 平台特性 `X`：\n\n*   `X` 的 `polyfill` 是一段代码。如果它在一个已经内置支持 `X` 的平台上执行，它将什么都不做。否则，它会在该平台上提供该特性的。在后一种情况下，被\
  \ polyfill 的特性（在很大程度上）原生实现无异。为了实现这一点，polyfill 通常会进行全局更改。例如，它可能会修改全局数据或配置全局模块加载器。Polyfills\
  \ 通常被封装为模块。\n    *   术语 [`polyfill`](https://remysharp.com/2010/10/08/what-is-a-polyfill)\
  \ 由 Remy Sharp 提出的。\n*   `speculative polyfill` 是针对提议中的 Web 平台特性（尚未标准化）的 polyfill。\n\
  \    *   替代术语：`prollyfill`\n*   `X` 的 `replica` 是一个在本地复制 `X` 的 API 和功能的库。此类库独立于\
  \ `X` 的原生（且全局的）实现。\n    *   `Replica` 是本节引入的新术语。替代术语：`ponyfill`\n*   还有 `shim` 这个术语，但它没有全球公认的定义。它的意思通常与\
  \ `polyfill` 相同。\n\n每当我们的 Web 应用启动时，它必须首先执行所有可能在处处不可用的特性的 polyfills。之后，我们可以确定这些特性是原生可用的。\n\
  \n### 29.14.1 本节来源\n\n*   “什么是 Polyfill ，作者 Remy Sharp\n*   `replica` 术语的灵感：[拉斯维加斯的埃菲尔铁塔](https://en.wikipedia.org/wiki/Paris_Las_Vegas)\n\
  *   关于“polyfill”及相关术语的有用澄清：[“Polyfills 与 Web 的演进”](https://www.w3.org/2001/tag/doc/polyfills/)。Andrew\
