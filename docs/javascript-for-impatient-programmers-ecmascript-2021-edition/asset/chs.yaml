  * * *\n\n在本章中，我们将审视 JavaScript 的优点和缺点。\n\n![](img/file0.svg) **“ECMAScript 6”和“ES6”指的是\
  \ JavaScript 的版本**\n\nECMAScript 是语言标准的名称；数字指的是该标准版本的号。如需更多信息，请参阅 §5.2 “标准化 JavaScript”。\n\
  \n## 3.1 JavaScript 的缺点\n\n在程序员中，JavaScript 并不总是受到欢迎。原因之一是它有很多怪癖（quirks）。其中某些只是处理事情的不寻方式，另一些则被认为是\
  \ Bug。无论如何，学习*为什么* JavaScript 要那样做，有助于处理这些怪癖并接受 JavaScript（甚至可能喜欢它）。希望本书在这方面有所帮助。\n\
  \n此外，许多传统的怪癖现在已经消除了。例如：\n\n* 传统上，JavaScript 变量不是块级作用的。ES6 引入了 `let` 和 `const`，允许你声明块级作用的变量。\n\
  * 在 ES6 之前，通过 `function` 和 `.prototype` 实现对象工厂和继承非常笨。ES6 引入了类（classes），为这些机制提供了更方便的语法。\n\
  * 传统上，JavaScript 没有内置模块。ES6 在语言中添加了它们。\n\n最后，JavaScript 的标准库很有限，但是：\n\n* 有[计划](https://github.com/tc39/proposal-javascript-standard-library)\
  \ 添加更多功能。\n* 通过 [npm 软件注册表](https://www.npmjs.com) 可以轻松获取许多库。\n\n## 3.2 JavaScript\
  \ 的优点\n\n好的方面，JavaScript 提供了许多优势。\n\n### 3.2.1 社区\n\nJavaScript 的流行意味着它拥有良好的支持和文档记录。每当你用\
  \ JavaScript 创建任何东西时，你都可以认为会有很多人（潜在地）感兴趣。如果你需要，你还可以从大量的 JavaScript 程序员池中招聘。\n\n\
  没有单一实体控制 JavaScript —— 它由 TC39 演进，这是一个由许多组织组成的委员会。该语言通过开放的过程进行演进，鼓励公众提供反馈。\n\n###\
  \ 3.2.2 实用性\n\n通过 JavaScript，你可以为许多客户端平台编写应用。以下是一些示例技术：\n\n* [渐进式 Web 应用](https://developers.google.com/web/progressive-web-apps/)\
  \ 可以在 Android 和许多桌面操作系统上原生安装。\n* [Electron](https://electronjs.org) 允许你构建跨平台桌面应用。\n\
  * [React Native](https://facebook.github.io/react-native/) 让你为 iOS 和 Android 编写原生用户界面的应用。\n\
  * [Node.js](https://nodejs.org/) 为编写 shell 脚本提供了广泛支持（此外作为 Web 服务器平台）。\n\n许多服务器平台和服务支持\
  \ JavaScript ——例如：\n\n* Node.js（以下许多服务基于 Node.js 或支持其 API）\n* ZEIT Now\n* Microsoft\
  \ Azure Functions\n* AWS Lambda\n* Google Cloud Functions\n\n有许多数据技术可用于 JavaScript：许多数据库支持它，并且存在中间层（如\
  \ GraphQL）。此外，标准数据格式 JSON（JavaScript 对象表示） 基于 JavaScript 并由其标准库支持。\n\n最后，JavaScript\
  \ 的许多（如果不是大多数）工具都是用 JavaScript 编写的。这包括 IDE、构建工具等。因此，你安装它们的方式与安装库相同，并可以使用 JavaScript\
  \ 对它们进行自定义。\n\n### 3.2.3 语言\n\n* 可以通过 JavaScript 宇宙中的事实标准 [npm 软件注册表](https://www.npmjs.com)\
  \ 获取许多库。\n* 如果你对“纯原生”JavaScript 不满意，那么添加更多功能相对容易：\n    * 你可以通过 [Babel](https://babeljs.io)\
  \ 将未来和现代语言特性编译为当前及过去版本的 JavaScript。\n    * 你可以通过 [TypeScript](https://www.typescriptlang.org)\
  \ 和 [Flow](https://flow.org) 添加静态类型。\n    * 你可以使用 ReasonML，它本质上是带有 JavaScript 语法的\
  \ OCaml。它可以被编译为 JavaScript 或原生代码。\n* 语言非常灵活：它是动态的，并同时支持面向对象编程和函数式编程。\n* 对于这种动态语言来说，JavaScript\
  \ 变得异常快。\n    * 每当它不够快时，你可以切换到 WebAssembly，它是内置在大多数 JavaScript 引擎中的通用虚拟机。它可以以近乎原生的速度运行静态代码。\n\
  \n## 3.3 JavaScript 的优缺点：创新\n\nJavaScript 生态系统中充满了创新：实现用户界面的新方法、优化交付的新方法等。优点是你会不断学到新东西；缺点是不断的变化可能会让人精疲力竭。幸运的是，最近速度放慢了：所有的\
  \ ES6（这是语言的一次重大现代化）正在定型，某些工具和工作流也是如此。\n\n![](img/file7.svg) **测验**\n\n查看测验应用。\n\n\
  # 4 JavaScript 的本质（额外内容）\n\n* * *\n\n* 4.1 JavaScript 的影响\n* 4.2 JavaScript 的本质\n\
  \    * 4.2.1 JavaScript 经常静默失败\n* 4.3 入门 JavaScript 的提示\n\n* * *\n\n## 4.1 JavaScript\
  \ 的影响\n\n当 JavaScript 在 1995 年创建时，它受到了多种编程语言的影响：\n\n* JavaScript 的语法很大程度上基于 Java。\n\
  * JavaScript 的原型继承灵感来自 Self。\n* 闭包（Closures）和环境借自 Scheme。\n* AWK 影响了 JavaScript\
  \ 的函数（包括 `function` 关键字）。\n* JavaScript 的字符串、数组和正则表达式参考了 Perl。\n* HyperTalk 启发了通过浏览器的\
  \ `onclick` 事件处理。\n\n随着 ECMAScript 6，新的影响引入了 JavaScript：\n\n* 生成器（Generators）借自\
  \ Python。\n* 箭头函数的语法来自 CoffeeScript。\n* C++ 贡献了 `const` 关键字。\n* 解构赋值（Destructuring）受到\
  \ Lisp *解构绑定*（destructuring bind）的启发。\n* 模板字面量（Template literals）来自 E 语言（在其中被称为准字面量）。\n\
  \n## 4.2 JavaScript 的本质\n\n这些是该语言的一些特征：\n\n* 它的语法属于 C 语言族的一部分（大括号等）。\n* 它是一门动态语言：大多数对象可以在运行时以各种方式更改，可以直接创建对象等。\n\
  \n\n\n\n\n*   它是一门动态类型语言：变量没有固定的静态类型，你可以给给定的（可变）变量赋值任何值。\n*   它具有函数式编程特性：一等函数、闭包、通过\
  \ `bind()` 实现的部分应用等。\n*   它具有面向对象的特性：可变状态、对象、继承、类等。\n*   它经常会静默失败：详情请见下一小节。\n* \
  \  它是以源代码形式部署的。但这些源代码通常经过了 `minified` 处理（重写以占用更少的空间）。并且有[二进制源码格式的计划](https://github.com/tc39/proposal-binary-ast)。\n\
  *   JavaScript 是 Web 平台的一部分——它是内置在 浏览器中的语言。但它也被用于其他地方——例如在 Node.js 中用于服务器端以及 Shell\
  \ 脚本。\n*   JavaScript 引擎通常会在底层优化效率较低的语言机制。例如，在原则上，JavaScript 的 `Arrays` 是字典。但在底层，如果数组具有连续索引，引擎会以连续的方式存储\
  \ `Arrays`。\n\n### 4.2.1 JavaScript 经常会静默失败\n\nJavaScript 经常会静默失败。让我们来看两个例子。\n\n\
  第一个例子：如果运算符的操作数没有合适的类型，它们将根据需要进行转换。\n\n```\n> '3' * '5'\n15\n```\n\n第二个例子：如果算术运算失败，你得到的是一个错误值，而不是异常。\n\
  \n```\n> 1 / 0\nInfinity\n```\n\n静默失败的原因是历史性的：JavaScript 在 ECMAScript 3 之前没有异常机制。从那时起，设计者们一直试图避免静默失败。\n\
  \n### 4.3 入门 JavaScript 的技巧\n\n以下是一些帮助你开始学习 JavaScript 的技巧：\n\n*   花点时间真正了解这门语言。传统的\
  \ C 风格语法隐藏了这是一门非常不常规的语言。要特别学习它的怪癖以及背后的原理。这样你将能更好地理解和欣赏这门语言。\n    *   除了细节，本书还教授了简单的经验规则以确保安全——例如，“始终使用\
  \ `===` 来判断两个值是否相等，永远不要使用 `==`。”\n*   语言工具让使用 JavaScript 变得更容易。例如：\n    *   你可以通过\
  \ [TypeScript](https://www.typescriptlang.org) 或 [Flow](https://flow.org) 对 JavaScript\
  \ 进行静态类型化。\n    *   你可以通过如 [ESLint](https://eslint.org) 之类的 linter 检查问题和反模式。\n \
  \   *   你可以通过如 [Prettier](https://prettier.io) 的代码格式化工具自动格式化代码。\n*   与社区接触：\n  \
  \  *   Twitter 在 JavaScript 程序员中非常流行。作为一种处于口语和书面语之间的交流方式，它非常适合交换知识。\n    *   许多城市定期举办免费聚会，人们聚集在一起学习与\
  \ JavaScript 相关的主题。\n    *   JavaScript 大议是与其他 JavaScript 程序员见面的另一种方便方式。\n*   阅读书籍和博客。网上有大量的免费资料！\n\
