  \ ** 2)\n    2\n    ```\n\n* `Math.log1p(x: number): number` ^([ES6])\n    返回 `Math.log(1\
  \ + x)`。`Math.expm1()` 的逆函数。极小的数字（接近 0 的分数）具有更高的精度。因此，每当 `.log()` 的参数接近 1 时，你可以为此函数提供更精确的参数。\n\
  \n* `Math.log10(x: number): number` ^([ES6])\n    返回以 10 为底的 `x` 对数。`10 ** x` 的逆函数。\n\
