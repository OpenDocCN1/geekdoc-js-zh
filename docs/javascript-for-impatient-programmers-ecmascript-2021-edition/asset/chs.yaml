  \n![](img/file7.svg) **测试：基础**\n\n## 18.19 精度与表示的结论\n\n在执行算术运算时需要考虑舍入误差。\n\n![](img/file7.svg)\
  \ **测试：基础**\n\n\n\n\n精确计算小数的唯一方法是在内部切换到 10 进制。对于许多编程语言来说，2 进制是默认的，而 10 进制是一个选项。例如，Java\
  \ 有 [`BigDecimal`](https://docs.oracle.com/javase/8/docs/api/java/math/BigDecimal.html)\
  \ 类，而 Python 有 [`decimal`](https://docs.python.org/3/library/decimal.html) 模块。目前有计划在\
  \ JavaScript 中添加类似的功能：[ECMAScript 提案“Decimal”](https://github.com/tc39/proposals/blob/master/stage-0-proposals.md)\
  \ 目前处于第 0 阶段。\n\n## 18.9 JavaScript 中的整数\n\n整数是不带小数部分的普通（浮点）数字：\n\n```\n> 1 ===\
  \ 1.0\ntrue\n> Number.isInteger(1.0)\ntrue\n```\n\n在这一节中，我们将查看一些处理这些伪整数的工具。JavaScript\
  \ 还支持 `bigints，它们是真正的整数。\n\n### 18.9.1 转换为整数\n\n将数字转换为整数推荐的方法是使用 `Math` 对象中的一种舍入方法：\n\
  \n*   `Math.floor(n)`：返回最大的整数 `i` ≤ `n`\n\n    ```\n    > Math.floor(2.1)\n    2\n\
  \    > Math.floor(2.9)\n    2\n    ```\n\n*   `Math.ceil(n)`：返回最小的整数 `i` ≥ `n`\n\
  \n    ```\n    > Math.ceil(2.1)\n    3\n    > Math.ceil(2.9)\n    3\n    ```\n\n\
  *   `Math.round(n)`：返回“接近”`n` 的整数，其中 `.5` 进舍入——例如：\n\n    ```\n    > Math.round(2.4)\n\
  \    2\n    > Math.round(2.5)\n    3\n    ```\n\n*   `Math.trunc(n)`：移除 `n` 的任何小数部分（小数点后的部分），将其转换为整数。\n\
  \n    ```\n    > Math.trunc(2.1)\n    2\n    > Math.trunc(2.9)\n    2\n    ```\n\
  \n有关舍入的更多信息，请参阅 §19.3 “Rounding”。\n\n### 18.9.2 JavaScript 中整数的范围\n\n这些是 JavaScript\
  \ 中重要的整数范围：\n\n*   **安全整数：**可以被 JavaScript “安全地”表示（关于其含义，将在下一个小节中详细介绍）\n\n    *\
  \   精度：53 位加一个符号位\n    *   范围：(−2⁵³, 2⁵³)\n\n*   **数组索引**\n\n    *   精度：32 位，无符号\n\
  \    *   范围：[0, 2³²−1)（不包括最大长度）\n    *   类型数组（Typed Arrays）具有更大的 53 位范围（安全且无符号）\n\
  \n*   **位运算符**（按位或等）\n\n    *   精度：32 位\n    *   无符号右移（`>>>`）的范围：无符号，[0, 2³²)\n\
  \    *   所有其他位运算符的范围：有符号，[−2³¹, 2³¹)\n\n### 18.9.3 安全整数\n\n这是 JavaScript 中*安全*的整数范围（53\
  \ 位加一个符号位）：\n\n> [–2⁵³–1, 2⁵³–1]\n\n如果一个整数由恰好一个 JavaScript 数字表示，则它是*安全*的。由于 JavaScript\
  \ 数字被编码为一个分数乘以 2 的幂次，更高的整数也可以被表示，但它们之间会存在间隙。\n\n例如（18014398509481984 是 2⁵⁴）：\n\n\
  ```\n> 18014398509481984\n18014398509481984\n> 18014398509481985\n18014398509481984\n\
  > 18014398509481986\n18014398509481984\n> 18014398509481987\n18014398509481988\n\
  ```\n\n以下 `Number` 的属性有助于判断一个整数是否是安全的：\n\n```\nassert.equal(Number.MAX_SAFE_INTEGER,\
  \ (2 ** 53) - 1);\nassert.equal(Number.MIN_SAFE_INTEGER, -Number.MAX_SAFE_INTEGER);\n\
  assert.equal(Number.isSafeInteger(5), true);\nassert.equal(Number.isSafeInteger('5'),\
  \ false);\nassert.equal(Number.isSafeInteger(5.1), false);\nassert.equal(Number.isSafeInteger(Number.MAX_SAFE_INTEGER),\
  \ true);\nassert.equal(Number.isSafeInteger(Number.MAX_SAFE_INTEGER+1), false);\n\
  ```\n\n![](img/file6.svg) **练习：检测安全整数**\n\n`exercises/numbers-math/is_safe_integer_test.mjs`\n\
  \n#### 18.9.3.1 安全计算\n\n让我们看看涉及不安全整数的计算。\n\n以下结果是不正确且安全的，尽管它的两个操作数都是安全的：\n\n```\n\
  > 9007199254740990 + 3\n9007199254740992\n```\n\n以下结果是安全的，但不正确的。第一个操作数是不安全的；第二个操作数是安全的：\n\
  \n```\n> 9007199254740995 - 10\n9007199254740986\n```\n\n因此，表达式 `a op b` 的结果是正确的当且仅当：\n\
  \n```\nisSafeInteger(a) && isSafeInteger(b) && isSafeInteger(a op b)\n```\n\n也就是说，两个操作数和结果都必须是。\n\
  \n## 18.10 位运算符\n\n### 18.10.1 在内部，位运算符与 32 位整数工作\n\n在内部，JavaScript 的位运算符与 32 位整数工作。它们按照以下步骤产生结果：\n\
  \n*   输入（JavaScript 数字）：1–2 个操作数首先被转换为 JavaScript 数字（64 位浮点数），然后转换为 32 位整数。\n* \
  \  计算（32 位整数）：实际操作处理 32 位整数并产生一个 32 位整数。\n*   输出（JavaScript 数字）：在返回结果之前，它会被转换回 JavaScript\
  \ 数字。\n\n#### 18.10.1.1 操作数和结果的类型\n\n对于每个位运算符，这里提到了操作数和结果的类型。\n\n| 类型 | 说明 | 范围\
  \ |\n| --- | --- | --- |\n| Int32 | 有符号 32 位整数 | [−2³¹, 2³¹) |\n| Uint32 | 无符号 32\
  \ 位整数 | [0, 2³²) |\n\n考虑到位运算符，它们只与 32 位整数工作。\n\n#### 18.10.1.2 将 JavaScript 数字显示为\
  \ 32 位整数\n\n在探索位运算符时，将 JavaScript 数字显示为 32 位整数是有帮助的：\n\n```\n> ~0b100\n'11111111111111111111111111111011'\n\
  ```\n\n### 18.10.2 按位取反\n\n表 9：按位取反。\n\n| 操作 | 名称 | 类型签名 |\n| --- | --- | --- |\n\
  | `~num` | 按位取反，*反码* | Int32 → Int32 |\n\n按位取反会反转其操作数的每个二进制位。这种所谓的*反码*在某些操作中类似于负数。例如，将一个整数与其反码相加，的结果始终是\
  \ `-1`：\n\n```\n> 4 + ~4\n-1\n> -1 + ~-1\n-1\n```\n\n### 18.10.3 二进制位运算符\n\n表 10：二进制位运算符。\n\
  \n| 操作 | 名称 | 类型签名 |\n| --- | --- | --- |\n| `num1 & num2` | 按位与 | Int32 × Int32\
  \ → Int32 |\n| `num1 | num2` | 按位或 | Int32 × Int32 → Int32 |\n| `num1 ^ num2` |\
  \ 按位异或 | Int32 × Int32 → Int32 |\n\n二进制位运算符组合其操作数的位来产生结果：\n\n```\n> (0b1010 & 0b0011).toString(2).padStart(4,\
  \ '0')\n'0010'\n> (0b1010 | 0b0011).toString(2).padStart(4, '0')\n'1011'\n> (0b1010\
  \ ^ 0b0011).toString(2).padStart(4, '0')\n'1001'\n```\n\n### 18.10.4 位移运算符\n\n表\
  \ 11：位移运算符。\n\n| 操作 | 名称 | 类型签名 |\n| --- | --- | --- |\n| `num << count` | 左移 |\
  \ Int32 × Uint32 → Int32 |\n| `num >> count` | 有符号右移 | Int32 × Uint32 → Int32 |\n\
  | `num >>> count` | 无符号右移 | Uint32 × Uint32 → Uint32 |\n\n移位运算符将二进制位向左或向右移动。\n\n\
  \n\n\n\n```\n> (0b10 << 1).toString(2)\n'100'\n```\n\n`>>` 保留最高位，`>>>` 则不保留：\n\n\
  ```\n> b32(0b100000000000000000000000000000010 >> 1)\n'11000000000000000000000000000001'\n\
  > b32(0b100000000000000000000000000000010 >>> 1)\n'01000000000000000000000000000001'\n\
  ```\n\n### 18.10.5��`b32()`：用二进制表示法显示无符号 32 位整数\n\n我们现在已经使用了几次 `b32()`。以下是它的实现代码：\n\
  \n```\n/**\n * 返回一个表示 n 的 32 位无符号整数的字符串，\n * 使用二进制表示法。\n */\nfunction b32(n) {\n\
  \  // >>> 确保最高位不被解释为符号位\n  return (n >>> 0).toString(2).padStart(32, '0');\n}\n\
  assert.equal(\n  b32(6),\n  '00000000000000000000000000000110');\n```\n\n`n >>>\
  \ 0` 意味着我们将 `n` 右移了 0 位。因此，从原理上说 `>>>` 运算符什么都没做，但它仍然会将 `n` 强制转换为无符号 32 位整数：\n\n\
  ```\n> 12 >>> 0\n12\n> -12 >>> 0\n4294967284\n> (2**32 + 1) >>> 0\n1\n```\n\n##\
  \ 18.11 快速参考：数字\n\n### 18.11.1 数字的全局函数\n\nJavaScript 提供了以下四个数字的全局函数：\n\n* `isFinite()`\n\
  * `isNaN()`\n* `parseFloat()`\n* `parseInt()`\n\n然而，使用 `Number` 的对应方法（如 `Number.isFinite()`\
  \ 等）更好，因为它们的陷阱更少。它们是在 ES6 中引入的，并在下文中讨论。\n\n### 18.11.2 `Number` 的静态属性\n\n* `.EPSILON:\
  \ number` [ES6]\n\n    1 与下一个可表示浮点数之间的差值。通常情况下，[机器精度](https://en.wikipedia.org/wiki/Machine_epsilon)\
  \ 为浮点运算中的舍入误差提供了上限。\n    * 大约：$2.2204460492503130847263316 \\times 10^{-16}$\n\n\
  * `.MAX_SAFE_INTEGER: number` [ES6]\n    JavaScript 可以表示的最大整数（$2^{53}-1$）。\n\n*\
  \ `.MAX_VALUE: number` [ES1]\n    最大的正有限数。\n    * 大约：$1.7976931348623157 \\times\
  \ 10^{308}$\n\n* `.MIN_SAFE_INTEGER: number` [ES6]\n    JavaScript 可以表示的最小整数（$-2^{53}+1$）。\n\
  \n* `.MIN_VALUE: number` [ES1]\n    最小的正数。大约为 $5 \\times 10^{-324}$。\n\n* `.NaN:\
  \ number` [ES1]\n    与全局变量 `NaN` 相同。\n\n* `.NEGATIVE_INFINITY: number` [ES1]\n \
  \   与 `-POSITIVE_INFINITY` 相同。\n\n* `.POSITIVE_INFINITY: number` [ES1]\n    与全局变量\
  \ `Infinity` 相同。\n\n### 18.11.3 `Number` 的静态方法\n\n* `.isFinite(num: number): boolean`\
  \ [ES6]\n    如果 `num` 是实际数字（既不是 `Infinity` 也不是 `NaN`），则返回 `true`。\n\n```\n> Number.isFinite(Infinity)\n\
  false\n> Number.isFinite(-Infinity)\nfalse\n> Number.isFinite(NaN)\nfalse\n> Number.isFinite(123)\n\
  true\n```\n\n* `.isInteger(num: number): boolean` [ES6]\n    如果 `num` 是一个数字且没有小数部分，则返回\
  \ `true`。\n\n```\n> Number.isInteger(-17)\ntrue\n> Number.isInteger(33)\ntrue\n\
  > Number.isInteger(33.1)\nfalse\n> Number.isInteger('33')\nfalse\n> Number.isInteger(Infinity)\n\
  false\n```\n\n* `.isNaN(num: number): boolean` [ES6]\n    如果 `num` 的值为 `NaN`，则返回\
  \ `true`：\n\n```\n> Number.isNaN(NaN)\ntrue\n> Number.isNaN(123)\nfalse\n> Number.isNaN('abc')\n\
  false\n```\n\n* `.isSafeInteger(num: number): boolean` [ES6]\n    如果 `num` 是一个数字且无歧地表示一个整数，则返回\
  \ `true`。\n\n* `.parseFloat(str: string): number` [ES6]\n    将其参数强制转换为字符串并解析为浮点数。对于字符串转数字，`Number()`（它会忽略开头和结尾空格）通常是\
  \ `Number.parseFloat()`（它只忽略开头空格并可能隐藏问题）更好的选择。\n\n```\n> Number.parseFloat(' 123.4')\n\
  123.4\n> Number(' 123.4')\nNaN\n```\n\n* `.parseInt(str: string, radix=10): number`\
  \ [ES6]\n    将其参数强制转换为字符串并解析为整数，忽略开头空格和末尾字符：\n\n```\n> Number.parseInt('  123')\n\
  123\n```\n\n    参数 `radix` 指定了要解析数字的基数：\n\n```\n> Number.parseInt('101', 2)\n5\n\
  > Number.parseInt('FF', 16)\n255\n```\n\n    不要使用此方法将数字转换为整数：强制转换为字符串效率很低。而且在第一个非数字字符之前停止并不是移除数字小数部分的良好算法。这里有一个出错的例子：\n\
  \n```\n> Number.parseInt(1e21, 10) // 错误\n1\n```\n\n    最好使用 `Math` 的一个舍入函数将数字转换为整数：\n\
  \n```\n> Math.trunc(1e21) // 正确\n1e+21\n```\n\n### 18.11.4 `Number.prototype` 的方法\n\
  \n（`Number.prototype` 是数字方法存储的地方。）\n\n* `.toExponential(fractionDigits?: number):\
  \ string` [ES3]\n    返回一个通过指数计数法表示数字的字符串。通过 `fractionDigits`，我们可以指定与指数相乘的数字应该显示多少位数（默认显示尽可能多的位数）。\n\
  \n    示例：数字太小，无法通过 `.toString()` 获取正指数。\n\n```\n> 1234.toString()\n'1234'\n\n> 1234.toExponential()\
  \ // 3 个小数位\n'1.234e+3'\n> 1234.toExponential(3)\n'1.234e+3'\n```\n\n    示例：通过 `.toString()`\
  \ 不足以获取负指数。\n\n```\n> 0.003.toString()\n'0.003'\n> 0.003.toExponential()\n'3e-3'\n\
  ```\n\n* `.toFixed(fractionDigits=0): string` [ES5]\n    返回数字的无指数表示法，保留到 `fractionDigits`\
  \ 位。\n\n```\n> 0.000012.toString() // 带指数\n'1.2e-5'\n\n> 0.000012.toFixed(10)\n\
  '0.0000120000'\n> 0.000012.toFixed()\n'0'\n```\n\n    如果数字为 $10^{21}$ 或更大，即使是 `.toFixed()`\
  \ 也会使用指数：\n\n```\n> (10 ** 21).toFixed()\n'1e+21'\n```\n\n* `.toPrecision(precision?:\
  \ number): string` [ES3]\n    类似于 `.toString()`，但 `precision` 指定了显示多少位数。如果缺少 `precision`，则使用\
  \ `.toString()`。\n\n```\n> 1234.toPrecision(3) // 需要指数计数法\n'1.2e+3'\n\n> 1234.toPrecision(4)\n\
  '1234'\n\n> 1234.toPrecision(5)\n'1234.0'\n\n> 1.234.toPrecision(3)\n'1.23'\n```\n\
  \n* `.toString(radix=10): string` [ES1]\n    返回数字的字符串表示。默认情况下，我们得到 10 进制结果：\n\n\
  ```\n> 123.456.toString()\n'123.456'\n```\n\n    如果我们希望数字有不同的基，可以通过 `radix` 指定：\n\
  \n```\n> 4.toString(2) // 二进制（基 2）\n'100'\n> 4.5.toString(2)\n'100.1'\n\n> 255.toString(16)\
  \ // 十六进制（基 16）\n'ff'\n> 255.66796875.toString(16)\n'ff.ab'\n```\n\n    `parseInt()`\
  \ 提供了相反操作：它将包含给定基数的整数（无小数！）的字符串转换为数字。\n\n```\n> parseInt('kf12oi', 36)\n1234567890\n\
  ```\n\n### 18.11.5 来源\n\n* Wikipedia\n* [TypeScript 内置类型定义](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
