  \ 进行替换\n\n### 45.5.9 处理正则表达式的其他方法\n\n## 45.6 标志 `/g` 和 `/y`以及属性 `.lastIndex`（进阶）\n\
  \n### 45.6.1 标志 `/g` 和 `/y`\n\n### 45.6.2 方法具体是如何受 `/g` 和 `/y` 影响的？\n\n### 45.6.3\
  \ `/g` 和 `/y` 的四个陷阱及处理方法\n\n### 45.6.4 `.lastIndex` 的用例：从给定索引开始匹配\n\n### 45.6.5\
  \ `.lastIndex` 的缺点\n\n### 45.6.6 总结：`.global` (`/g`) 和 `.sticky` (`/y`)\n\n## 45.7\
  \ 处理正则表达式的技术\n\n### 45.7.1 为正则表达式对任意文本转义\n\n### 45.7.2 匹配所有内容或无匹配\n\n---\n\n**特性可用性**\n\
  \n除非另有说明，每个正则表达式特性自 ES3 以来均可用。\n\n## 45.1 创建正则表达式\n\n### 45.1.1 字面量与构造函数\n\n创建正则表达式的两种主要方式为：\n\
  \n*   字面量：静态编译（在加载时）。\n\n    ```javascript\n    /abc/ui\n    ```\n\n*   构造函数：动态编译（在运行时）。\n\
  \n    ```javascript\n    new RegExp('abc', 'ui')\n    ```\n\n两个正则表达式都有相同的两个部分：\n\
  \n*   主体 `abc` – 实际的正则表达式。\n\n*   标志 `u` 和 `i`。`Flags` 配置了如何解释模式。例如，`i` 启用不区分大小写的匹配。可用标志列表将在本章后面给出。\n\
  \n### 45.1.2 隆隆与非破坏性修改正则表达式\n\n构造函数 `RegExp()` 有两种变体：\n\n*   `new RegExp(pattern\
  \ : string, flags = '')` ^([ES3])\n\n    根据 `pattern` 指定创建一个新的正则表达式。如果 `flags` 为空，则不设置任何标志。\n\
  \n*   `new RegExp(regExpObject, flags = '')` ^([ES3])\n\n    通过复制 `regExpObject`\
  \ 创建一个新的正则表达式。如果提供了 `flags`，则将其应用到新表达式上。\n\n## 45.2 语法\n\n### 45.2.1 语法字符\n\n在顶层，以下*语法字符*是特殊的。它们通过在前面加上反斜杠（`\\\
  `）来进行转义。\n\n```javascript\n^ $ . + ? ( ) [ ] { } |\n```\n\n在正则表达式字面量中，我们必须转义斜杠：\n\
  \n```javascript\n/\\//\n```\n\n在 `RegExp()` 的参数中，我们不需要转义斜杠：\n\n```javascript\nnew\
  \ RegExp('/')\n```\n\n### 45.2.2 基础原子\n\n*原子*是正则表达式的基本构建单元。\n\n*   *模式字符*是除语法字符*之外*的所有字符。它们匹配自身。`..`\
  \ 匹配任何字符。我们可以使用标志 `/s` (`dotAll`) 来控制点号是否匹配行终止符。\n\n*   *字符类转义*（每个转义匹配一个固定字符）：\n\
  \n    *   控制转义（针对少数控制字符）：\n\n        *   `\\f`: 分页符 (FF)\n\n        *   `\\n`: 换符\
  \ (LF)\n\n        *   `\\r`: 回车符 (CR)\n\n        *   `\\t`: 制表符\n\n        *   `\\\
  v`: 垂直表符\n\n    *   任意控制字符：`\\cA` (Ctrl-A), …, `\\cZ` (Ctrl-Z)\n\n    *   Unicode\
  \ 编码单元：`\\u00E4`\n\n    *   Unicode 码点（需要标志 `/u`）：`\\u{1F4D}`\n\n*   *字符类转义*（每个转义匹配一组字符中的其中一个）：\n\
  \n    *   `\\d`: 数字（等同于 `[0-9]`）\n\n        *   `\\D`: 非数字\n\n    *   `\\w`: “单词”字符（等同于\
  \ `[A-Za-z0-9_]`，与编程语言中的标识符相关）\n\n        *   `\\W`: 非单词字符\n\n    *   `\\s`: 空白（空格、制表符、行终止符等）\n\
  \n        *   `\\S`: 非空白\n\n    *   *Unicode 属性转义* ^([ES2018]): `\\p{White_Space}`,\
  \ `\\P{White_Space}` 等。\n\n        *   需要标志 `/u`。\n\n        *   在下一个小节中描述。\n\n\
  ### 45.2.3 Unicode 属性转义 ^([ES2018])\n\n#### 45.2.3.1 Unicode 字符属性\n\n\n\n\n\n在 Unicode\
  \ 标准中，每个字符都有 `properties` —— 描述字符的元数据。属性在定义字符的性质方面起着重要作用。引用 [Unicode 标准，第 3.3 节，D3](http://www.unicode.org/versions/Unicode9.0.0/ch03.pdf)：\n\
  \n> 字符的语义由其标识、规范化属性和行为决定。\n\n以下是属性的几个示例：\n\n*   `Name`：唯一名称，由大写字母、数字、连字符和空格组成——例如：\n\
  \n    *   A: `Name = LATIN CAPITAL LETTER A`\n    *   `\U0001F642`: `Name = SLIGHTLY\
  \ SMILING FACE`\n\n*   `General_Category`：对字符进行分类——例如：\n\n    *   x: `General_Category\
  \ = Lowercase_Letter`\n    *   $: `General_Category = Currency_Symbol`\n\n*   `White_Space`：用于标记不可见的间距字符，如空格、制表符和换行符——例如：\n\
  \n    *   `\\t`: `White_Space = True`\n    *   π: `White_Space = False`\n\n*   `Age`：引入该字符的\
  \ Unicode 标准版本——例如：欧元符号 € 是在 Unicode 标准 2.1 版本中添加的。\n\n    *   €: `Age = 2.1`\n\n\
  *   `Block`：连续码点范围。区块（Blocks）不重叠，且名称是唯一的。例如：\n\n    *   S: `Block = Basic_Latin`\
  \ (范围 `U+0000..U+007F`)\n    *   `\U0001F642`: `Block = Emoticons` (范围 `U+1F600..U+1F64F`)\n\
  \n*   `Script`：由一个或多个写入系统使用的字符集合。\n\n    *   某些脚本支持多种写入系统。例如，拉丁脚本支持英语、法语、德语、拉丁语等写入系统。\n\
  \    *   某些语言可以使用多种备选写入系统编写，这些系统由多个脚本支持。例如，土耳其在 20 世纪初过渡到拉丁脚本之前曾使用阿拉伯脚本。\n    *\
  \   示例：\n\n        *   α: `Script = Greek`\n        *   Д: `Script = Cyrillic`\n\
  \n### 45.2.3.2 Unicode 属性转义\n\nUnicode 属性转义符的格式如下：\n\n1.  `\\p{prop=value}`：匹配所有属性\
  \ `prop` 值为 `value` 的字符。\n2.  `\\P{prop=value}`：匹配所有属性 `prop` 值不为 `value` 的字符。\n\
  3.  `\\p{bin_prop}`：匹配所有二进制属性 `bin_prop` 为 `True` 的字符。\n4.  `\\P{bin_prop}`：匹配所有二进制属性\
  \ `bin_prop` 为 `False` 的字符。\n\n注释：\n\n*   只有在设置了标志 `/u` 的情况下，我们才能使用 Unicode 属性转义。如果没有\
  \ `/u`，`\\p` 等同于 `p`。\n*   当属性为 `General_Category` 时，形式 (3) 和 (4) 可以作为简写形式使用。例如，以下两个转义符是等效的：\n\
  \n```\n\\p{Lowercase_Letter}\n\\p{General_Category=Lowercase_Letter}\n```\n\n示例：\n\
  \n*   检查空白字符：\n\n```\n> /^\\p{White_Space}+$/u.test('\\t \\n\\r')\ntrue\n```\n\n\
  *   检查希腊字母：\n\n```\n> /^\\p{Script=Greek}+$/u.test('μετά')\ntrue\n```\n\n*   删除任何字母：\n\
  \n```\n> '1π2ü3é4'.replace(/\\p{Letter}/ug, '')\n'1234'\n```\n\n*   删除小写字母：\n\n\
  ```\n> 'AbCdEf'.replace(/\\p{Lowercase_Letter}/ug, '')\n'ACE'\n```\n\n延伸阅读：\n\n\
  *   Unicode 属性及其值的列表：[“Unicode 标准附件 #44: Unicode 字符数据库”](https://unicode.org/reports/tr44/#Properties)（编辑：Mark\
  \ Davis, Laurențiu Iancu, Ken Whistler）\n\n### 45.2.4 字符类\n\n`字符类`（character class）在方括号内包裹`类范围`（class\
  \ ranges）。类范围指定了一个字符集：\n\n*   `[«class ranges»]`：匹配集合中的任何字符。\n*   `[^«class ranges»]`：匹配不在集合中的任何字符。\n\
  \n类范围的规则：\n\n*   非语法字符代表其自身：`[abc]`\n*   只有以下四个字符是特殊的，且必须通过斜杠进行转义：\n\n    `^ \\\
  \ - ]`\n\n    *   `^` 仅在位于开头时需要转义。\n    *   `-` 在位于开头或结尾时不需要转义。\n*   字符转义（`\\n`,\
  \ `\\u{1F44D}` 等）具有通常含义。\n    *   注意：`\\b` 代表退格符。在正则表达式的其它地方，它匹配单词边界。\n*   字符类转义（`\\\
  d`, `\\p{White_Space}` 等）具有通常含义。\n*   字符范围通过连字符指定：`[a-z]`\n\n### 45.2.5 分组\n\n*\
  \   位置捕获组：`(#+)`\n    *   反向引用：`\\1`, `\\2` 等。\n*   命名捕获组 `^([ES2018])`: `(?<hashes>#+)`\n\
  \    *   反向引用：`\\k<hashes>`\n*   非捕获组：`(?:#+)`\n\n### 45.2.6 量词\n\n默认情况下，所有以下量词都是**贪婪**的（它们匹配尽可能多的字符）：\n\
  \n*   `?`：匹配零次或一次\n*   `*`：匹配零次或多次\n*   `+`：匹配一次或多次\n*   `{n}`：匹配 `n` 次\n*   `{n,}`：匹配\
  \ `n` 次或更多\n*   `{n,m}`：匹配至少 `n` 次，最多 `m` 次。\n\n要使它们变为**懒惰**（即匹配尽可能少的字符），请在它们后面加上问号（`?`）：\n\
  \n```\n> /\".*\"/.exec('\"abc\"def\"')[0]  // 贪婪\n'\"abc\"def\"'\n> /\".*?\"/.exec('\"\
  abc\"def\"')[0] // 懒惰\n'\"abc\"'\n```\n\n### 45.2.7 断言\n\n*   `^` 仅匹配输入的开头\n*  \
  \ `$` 仅匹配输入的结尾\n*   `\\b` 仅匹配单词边界\n    *   `\\B` 仅在不在单词边界时匹配\n\n#### 45.2.7.1 前瞻断言\n\
  \n**正向瞻断言**：`(?=«pattern»)` 如果 `pattern` 匹配后续内容，则匹配。\n\n示例：后续跟随 `X` 的小写字母序列。\n\n\
  ```\n> 'abcX def'.match(/[a-z]+(?=X)/g)\n[ 'abc' ]\n```\n\n注意 `X` 本身不是匹配的一部分。\n\n\
  **负向瞻断言**：`(??!«pattern»)` 如果 `pattern` 不匹配后续内容，则匹配。\n\n示例：后续不是 `X` 的小写字母序列。\n\n\
  ```\n> 'abc def'.match(/[a-z]+(?!X)/g)\n[ 'abc' ]\n```\n\n#### 45.2.7.2 后行断言\n\n\
  （注：此处原文未提供内容，根据逻辑通常如下）\n\n**正向后行断言**：`(?<=«pattern»)` 如果 `pattern` 匹配前置内容，则匹配。\n\
  \n**负向后行断言**：`(?<!«pattern»)` 如果 `pattern` 不匹配前置内容，则匹配。\n\n### 45.2.8 析取 (`|`）\n\
  \n注意：`|` 的优先级较低。必要时使用分组：\n\n*   `^aa|zz$`：匹配以 `aa` 开头或以 `zz` 结尾的字符串。\n*   `^(aa|zz)$`：匹配字符串\
  \ `'aa'` 或 `'zz'`。\n*   `^a(a|z)z$`：匹配字符串 `'aaz'` 或 `'azz'`。\n\n## 45.3 标志\n\nJavaScript\
  \ 支持正则表达式标志：\n\n| 字面标志 | 属性名称 | ES | 描述 |\n| --- | --- | --- | --- |\n| `g` | `global`\
  \ | ES3 | 多次匹配 |\n| `i` | `ignoreCase` | ES3 | 不区分大小写 |\n| `m` | `multiline` | ES3\
  \ | `^` 和 `$` 匹配行 |\n| `s` | `dotAll` | ES2018 | 点号匹配换行符 |\n| `u` | `unicode` |\
  \ ES6 | Unicode 模式（推荐） |\n| `y` | `sticky` | ES6 | 匹配间无字符 |\n\n以下是 JavaScript 支持的正则表达式标志（见表\
  \ 21):\n\n*   `/g` (`.global`）：根本上改变了以下方法的工作方式。\n\n    *   `RegExp.prototype.test()`\n\
  \    *   `RegExp.prototype.exec()`\n    *   `String.prototype.match()`\n\n    具体说明请见\
  \ [§45.6.1 “标志 `/g` 和 `/y`”]。简而言之，没有 `/g`，这些方法只考虑输入字符串中正则表达式的第一个匹配。有了 `/g`，它们会考虑所有匹配项。\n\
  \n*   `/i` (`.ignoreCase`）：开启不区分大小写的匹配：\n\n\n\n\n\n```\n> /a/.test('A')\nfalse\n\
  > /a/i.test('A')\ntrue\n```\n\n*   `/m` (`.multiline`): 如果开启此标志，`^` 匹配每行的开头，`$`\
  \ 匹配每行的结尾。如果未开启，`^` 匹配整个输入字符串的开头，`$` 匹配整个输入字符串的结尾。\n\n```javascript\n> 'a1\\na2\\\
  na3'.match(/^a./gm)\n[ 'a1', 'a2', 'a3' ]\n> 'a1\\na2\\na3'.match(/^a./g)\n[ 'a1'\
  \ ]\n```\n\n*   `/u` (`.unicode`): 此标志为正则表达式开启 Unicode 模式。该模式将在下一个小节中详细解释。\n\n*\
  \   `/y` (`.sticky`): 此标志主要在与 `/g` 结合使用时才有意义。当两者都开启时，任何匹配都必须紧跟上一个匹配（即它必须从正则表达式对象的\
  \ `.lastIndex` 索引开始）。因此，第一个匹配必须位于索引 0。\n\n```javascript\n> 'a1a2 a3'.match(/a./gy)\n\
  [ 'a1', 'a2' ]\n> '_a1a2 a3'.match(/a./gy) // 第一个匹配必须位于索引 0\nnull\n\n> 'a1a2 a3'.match(/a./g)\n\
  [ 'a1', 'a2', 'a3' ]\n> '_a1a2 a3'.match(/a./g)\n[ 'a1', 'a2', 'a3' ]\n```\n\n`/y`\
  \ 的主要用例是分词（在解析期间）。\n\n*   `/s` (`.dotAll`): 默认情况下，点号 `.` 不匹配行终止符。开启此标志后，它可以匹配：\n\
  \n```javascript\n> /./.test('\\n')\nfalse\n> /./s.test('\\n')\ntrue\n```\n\n如果不支持\
  \ `/s` 的替代方案：使用 `[^]` 代替点号。\n\n```javascript\n> /[^]/.test('\\n')\ntrue\n```\n\n\
  ### 45.3.1 标志：通过 `/u` 开启 Unicode 模式\n\n`/u` 标志为正则表达式开启了一种特殊的 Unicode 模式。该模式启用了若干功能：\n\
  \n*   在模式中，我们可以使用 Unicode 代码点转义（如 `\\u{1F42A}`）来指定字符。代码单元转义（如 `\\u03B1`）只有四个十六进制数字（对应基本多语言平面）。\n\
  \n*   在模式中，我们可以使用 Unicode 属性转义（如 `\\p{White_Space}`）。\n\n*   许多转义字符现在被禁止了。例如：`\\\
  a \\- \\:`\n\n模式字符始终匹配其本身：\n\n```javascript\n> /pa-:/.test('pa-:')\ntrue\n```\n\n\
  在没有 `/u` 的情况下，某些模式字符在用反斜杠转义后仍然会匹配其本身：\n\n```javascript\n> /\\p\\a\\-\\:/.test('pa-:')\n\
  true\n```\n\n使用 `/u` 时：\n\n*   `\\p` 开始一个 Unicode 属性转义。\n*   剩余的“自匹配”转义被禁止了。结果是它们现在可以用于未来的新功能。\n\
  \n*   匹配的原子单位是 Unicode 字符（代码点），而不是 JavaScript 字符（代码单元）。\n\n接下来的小节将详细解释最后一项。它们使用以下\
  \ Unicode 字符来解释何时原子单位是 Unicode 字符，以及何时是 JavaScript 字符：\n\n```javascript\nconst codePoint\
  \ = '\U0001F642';\nconst codeUnits = '\\uD83D\\uDE42'; // UTF-16\nassert.equal(codePoint,\
  \ codeUnits); // 相同的字符串！\n```\n\n我仅切换 `\U0001F642` 和 `\\uD83D\\uDE42`，是为了说明 JavaScript\
  \ 是如何看待事物的。两者都是等价的，可以在字符串和正则表达式中互换使用。\n\n#### 45.3.1.1 结果：我们可以将 Unicode 字符放入字符类中\n\
  \n使用 `/u`，`\U0001F642` 的两个代码单元被视为单个字符：\n\n```javascript\n> /^[\U0001F642]$/u.test('\U0001F642\
  ')\ntrue\n```\n\n在没有 `/u` 的情况下，`\U0001F642` 被视为两个字符：\n\n```javascript\n> /^[\\uD83D\\\
  uDE42]$/.test('\\uD83D\\uDE42')\nfalse\n> /^[\\uD83D\\uDE42]$/.test('\\uDE42')\n\
  true\n```\n\n注意 `^` 和 `$` 要求输入字符串是单个字符。这就是为什么第一个结果是 `false` 的原因。\n\n#### 45.3.1.2\
  \ 结果：点运算符（`.`）匹配 Unicode 字符，而不是 JavaScript 字符\n\n使用 `/u`，点运算符匹配 Unicode 字符：\n\n\
  ```javascript\n> '\U0001F642'.match(/./gu).length\n1\n```\n\n`.match()` 加上 `/g`\
  \ 返回一个包含正则表达式所有匹配的数组。\n\n在没有 `/u` 的情况下，点运算符匹配 JavaScript 字符：\n\n```javascript\n\
  > '\\uD83D\\uDE80'.match(/./g).length\n2\n```\n\n#### 45.3.1.3 结果：量词作用于 Unicode\
  \ 字符，而不是 JavaScript 字符\n\n使用 `/u`，量词作用于整个前面的 Unicode 字符：\n\n```javascript\n> /^\U0001F642\
  {3}$/u.test('\U0001F642\U0001F642\U0001F642')\ntrue\n```\n\n在没有 `/u` 的情况下，量词仅作用于前面的\
  \ JavaScript 字符：\n\n```javascript\n> /^\\uD83D\\uDE80{3}$/.test('\\uD83D\\uDE80\\\
  uDE80\\uDE80')\ntrue\n```\n\n## 45.4 正则表达式对象的属性\n\n值得注意的是：\n\n*   严格来说，只有 `.lastIndex`\
  \ 是真正的实例属性。所有其他属性都是通过 getter 实现的。\n*   因此，`.lastIndex` 是唯一的可变属性。所有其他属性都是只读的。如果我们想更改它们，需要复制正则表达式（详情请参\
  \ [§45.1.2 “克隆和非破坏性修改正则表达式”）。\n\n### 45.4.1 属性属性的标志\n\n每个正则表达式标志以属性的形式存在，具有更长、更具描述性的名称：\n\
  \n```javascript\n> /a/i.ignoreCase\ntrue\n> /a/.ignoreCase\nfalse\n```\n\n这是标志属性的完整列表：\n\
  \n*   `.dotAll` (`/s`)\n*   `.global` (`/g`)\n*   `.ignoreCase` (`/i`)\n*   `.multiline`\
  \ (`/m`)\n*   `.sticky` (`/y`)\n*   `.unicode` (`/u`)\n\n### 45.4.2 其他属性\n\n每个正则表达式还有以下属性：\n\
  \n*   `.source` (ES3): 正则表达式模式\n```javascript\n> /abc/ig.source\n'abc'\n```\n\n\
  *   `.flags` (ES6): 正则表达式的标志\n```javascript\n> /abc/ig.flags\n'gi'\n```\n\n*   `.lastIndex`\
  \ (ES3): 在开启标志 `/g` 时使用。详情请参阅 [§45.6 “g 和 y 标志”。\n\n## 45.5 处理表达式的方法\n\n### 45.5.1\
  \ 默认情况下，正则表达式在任何地方匹配\n\n默认情况下，正则表达式在字符串的任何地方进行匹配：\n\n```javascript\n> /a/.test('baaa')\n\
  true\n```\n\n我们可以通过使用 `^` 或标志 `/y` 来改变这一点：\n\n```javascript\n> /^a/.test('baaa')\n\
  false\n> /^a/.test('abaaa')\ntrue\n```\n\n### 45.5.2 `test(str)`：是否存在匹配？\n\n如果 `regExp`\
  \ 匹配 `str`，`test()` 方法返回 `true`：\n\n```javascript\n> /a/.test('baaa')\ntrue\n> /a/.test('bbbb')\n\
  false\n```\n\n我们通常应该避免使用 `/g` 标志。如果使用它，我们通常无法每次调用该方法时都得到相同的结果：\n\n```javascript\n\
  const r = /a/g;\n> r.test('aab')\ntrue\n> r.test('aab')\ntrue\n> r.test('aab')\n\
  false\n```\n\n结果由于 `/a` 在字符串中有两个匹配。`test()` 会跟踪 `lastIndex`。在找到所有这些项后，`.test()`\
  \ 返回 `false`。\n\n### 45.5.3 `search(regExp)`：匹配的索引是多少？\n\n字符串方法 `.search()` 返回 `str`\
  \ 中与 `regExp` 匹配的第一个索引：\n\n```javascript\n> '_abc_'.search(/abc/)\n1\n> 'main.mjs'.search(/\\\
  .mjs$/)\n4\n```\n\n### 45.5.4 `exec(str)`：捕获组\n\n#### 45.5.4.1 获取第一个匹配的匹配对象\n\n\
  在没有标志 `/g` 的情况下，`.exec()` 返回 `regExp` 在 `str` 中第一个匹配的捕获：\n\n```javascript\nassert.deepEqual(\n\
  \  /(a+)b/.exec('ab aab'),\n  {\n    0: 'ab',\n    1: 'a',\n    index: 0,\n    input:\
  \ 'ab aab',\n    groups: undefined\n  }\n);\n```\n\n结果是一个包含以下属性的*匹配对象*：\n\n*   `[0]`:正则表达式匹配的完整子字符串\n\
  *   `[1]`: 位置组 1 的捕获（依此类推）\n*   `.index`: 匹配发生在哪里？\n*   `.input`: 用于匹配的字符串\n*  \
  \ `.groups`: 命名组的捕获\n\n#### 45.5.4.2 命名捕获组 (ES2018)\n\n之前的示例包含一个单独的位置捕获组。下面的示例演示了命名组：\n\
  \n\n\n\n\n```javascript\nassert.deepEqual(\n  /(?<as>a+)b/.exec('ab aab'),\n  {\n\
  \    0: 'ab',\n    1: 'a',\n    index: 0,\n    input: 'ab aab',\n    groups: { as:\
  \ 'a' },\n  }\n);\n```\n\n在 `.exec()` 的结果中，我们可以看到命名组也是位置分组——它的捕获存在了两次：\n\n- 一次作为位置捕获（属性\
  \ `'1'`）。\n- 另一次作为命名捕获（属性 `groups.as`）。\n\n#### 45.5.4.3 遍历所有匹配项\n\n![](img/file2.svg)\
  \ **获取所有匹配项的更好替代方案：`str.matchAll(regExp)` [ES2020]**\n\n从 ECMAScript 2020 开始，JavaScript\
  \ 有了另一种获取所有匹配项的方法：`str.matchAll(regExp)`。这个方法更容易使用，且局限性更少。\n\n如果我们想获取正则表达式的所有匹配项（而不仅仅是第一个），我们需要开启\
  \ `/g` 标志。然后我们可以多次调用 `.exec()`，每次获取一个匹配项。在最后一次匹配之后，`.exec()` 返回 `null`。\n\n```\n\
  > const regExp = /(a+)b/g;\n> regExp.exec('ab aab')\n{ 0: 'ab', 1: 'a', index: 0,\
  \ input: 'ab aab', groups: undefined }\n> regExp.exec('ab aab')\n{ 0: 'aab', 1:\
  \ 'aa', index: 3, input: 'ab aab', groups: undefined }\n> regExp.exec('ab aab')\n\
  null\n```\n\n因此，我们可以按照如下方式遍历所有匹配项：\n\n```javascript\nconst regExp = /(a+)b/g;\n\
  const str = 'ab aab';\n\nlet match;\n// 通过真值判断检查 null\n// 替代方案：while ((match = regExp.exec(str))\
  \ !== null)\nwhile (match = regExp.exec(str)) {\n  console.log(match[1]);\n}\n//\
  \ 输出:\n// 'a'\n// 'aa'\n```\n\n![](img/file4.svg) **在共享带有 `/g` 的正则表达式时要小心！**\n\n\
  共享带有 `/g` 的正则表达式会有一些陷阱，这些陷将在后文中解释。\n\n![](img/file6.svg) **练习：通过 `.exec()` 提取引号文本**\n\
  \n`exercises/regexps/extract_quoted_test.mjs`\n\n### 45.5.5 `str.match(regExp)`：获取所有分组\
  \ 0 捕获 ^([ES3])\n\n如果没有 `/g`，`.match()` 的工作方式类似于 `.exec()`——它返回单个匹配对象。\n\n如果带有 `/g`，`.match()`\
  \ 返回 `str` 中所有匹配 `regExp` 的子字符串：\n\n```javascript\n> 'ab aab'.match(/(a+)b/g)\n\
  [ 'ab', 'aab' ]\n```\n\n如果没有匹配项，`.match()` 返回 `null`：\n\n```javascript\n> 'xyz'.match(/(a+)b/g)\n\
  null\n```\n\n我们可以使用空值合并运算符 (`??`) 来保护自己免受 `null` 的影响：\n\n```javascript\nconst numberOfMatches\
  \ = (str.match(regExp) ?? []).length;\n```\n\n### 45.5.6 `str.matchAll(regExp)`：获取关于所有匹配对象的迭代器\
  \ ^([ES2020])\n\n这是 `.matchAll()` 的调用方式：\n\n```javascript\nconst matchIterable =\
  \ str.matchAll(regExp);\n```\n\n给定一个字符串和一个正则表达式，`.matchAll()` 返回一个关于所有匹配项对象的迭代器。\n\
  \n我们还可以使用展开运算符 (`...`) 将可迭代器转换为数组：\n\n```javascript\n> [...'-a-a-a'.matchAll(/-(a)/ug)]\n\
  [\n  { 0:'-a', 1:'a', index: 0, input: '-a-a-a', groups: undefined },\n  { 0:'-a',\
  \ 1:'a', index: 2, input: '-a-a-a', groups: undefined },\n  { 0:'-a', 1:'a', index:\
  \ 4, input: '-a-a-a', groups: undefined },\n]\n```\n\n必须设置标志 `/g`：\n\n```javascript>\
  \ [...'-a-a-a'.matchAll(/-(a)/u)]\nTypeError: String.prototype.matchAll called with\
  \ a non-global\nRegExp argument\n```\n\n`.matchAll()` 不受 `regExp.lastIndex` 的影响，也不会改变它。\n\
  \n#### 45.5.6.1 实现 `.matchAll()`\n\n`.matchAll()` 可以通过 `.exec()` 实现如下：\n\n```javascript\n\
  function* matchAll(str, regExp) {\n  if (!regExp.global) {\n    throw new TypeError('Flag\
  \ /g must be set!');\n  }\n  const localCopy = new RegExp(regExp, regExp.flags);\n\
  \  let match;\n  while (match = localCopy.exec(str)) {\n    yield match;\n  }\n\
  }\n```\n\n创建本地副本确保了两个点：\n\n- `regex.lastIndex` 不会被改变。\n- `localCopy.lastIndex` 为零。\n\
  \n使用 `matchAll()`：\n\n```javascript\nconst str = \"fee fum\";\nconst regex = /(e)/g;\n\
  for (const match of str.matchAll(regex)) {\n  console.log(match[1]);\n}\n// 输出:\n\
  // 'e'\n// 'e'\n// 'e'\n```\n\n### 45.5.7 `regExp.exec()` vs `str.match()` vs `str.matchAll()`\n\
  \n下表总结了它们的工作原理：\n\n| 搜索目标 | 字符串 | 不带 `/g` 的 RegExp | 带有 `/g` 的 RegExp |\n| :---\
  \ | :--- | :--- | :--- |\n| `.exec()` | 匹配对象 | 匹配对象 | 顺序返回匹配对象 |\n| `.match()` |\
  \ 所有子字符串 | 匹配对象 | 子字符串数组 |\n| `.matchAll()` | TypeError | TypeError | 匹配对象的迭代器 |\n\
  \n### 45.5.8 使用 `str.replace()` 和 `str.replaceAll()` 进行替换\n\n这两个方法都有两个参数：\n\n- `searchValue`\
  \ 可以是：\n    - 字符串\n    - 正则表达式\n\n- `replacementValue` 可以是：\n    - 字符串：字符 `$` 具有特殊含义并允许我们插入分组\n\
  \    - 函数：计算用于替换的字符串\n\n这两种方法的区别如下：\n\n- `.replace()` 替换字符串或不带 `/g` 的正则表达式的第一次出现处。\n\
  - `.replaceAll()` 替换字符串或带有 `/g` 的正则表达式的所有出现处。\n\n#### 45.5.8.1 `str.replace(searchValue,\
  \ replacementValue)` ^([ES3])\n\n`.replace()` 的操作受其第一个参数 `searchValue` 的影响：\n\n\
  - 不带 `/g` 的正则表达式：替换此正则表达式的首次匹配。\n\n  ```javascript\n  > 'aaa'.replace(/a/, 'x')\n\
  \  'xaa'\n  ```\n\n- 字符串：替换此字符串的第一次出现（该字符串被字面解释，而不是正则表达式）。\n\n  ```javascript\n\
  \  > 'aaa'.replace('a', 'x')\n  'xaa'\n  ```\n\n- 带有 `/g` 的正则表达式：替换此正则表达式的所有匹配项。\n\
  \n  ```javascript\n  > 'aaa'.replace(/a/g, 'x')\n  'xxx'\n  ```\n\n建议：如果可以使用 `.replaceAll()`，在这种情况下最好使用该方法——它的目的是替换多次出现处。\n\
  \n如果我们想替换字符串的每个出现处，有两个选项：\n\n- 我们可以使用 `.replaceAll()`（在 ES2021 中引入）。\n- 在本章的后后部分，我们将遇到工具函数\
  \ `escapeForRegExp()`，它将帮助我们将字符串转换为可以多次匹配该字符串的正则表达式（例如，`'*'` 变为 `/\\*/g`）。\n\n####\
  \ 45.5.8.2 `str.replaceAll(searchValue, replacementValue)` ^([ES2021])\n\n`.replaceAll()`\
  \ 的操作受其第一个参数 `searchValue` 的影响：\n\n- 带有 `/g` 的正则表达式：替换此正则表达式的所有匹配项。\n\n  ```javascript\n\
  \  > 'aaa'.replaceAll(/a/g, 'x')\n  'xxx'\n  ```\n\n- 字符串：替换此字符串的所有出现处。\n\n  ```javascript\n\
  \  > 'aaa'.replaceAll('a', 'x')\n  'xxx'\n  ```\n\n\n\n\n\n```\n> 'aaa'.replaceAll('a',\
  \ 'x')\n'xxx'\n```\n\n- 不带 `/g` 的正则表达式：：会抛出 `TypeError`（因为 `.replaceAll()` 的目的是替换所有出现项）。\n\
  \n```\n> 'aaa'.replaceAll(/a/, 'x')\nTypeError: String.prototype.replaceAll called\
  \ with\na non-global RegExp argument\n```\n\n#### 45.5.8.3 `.replace()` 和 `.replaceAll()`\
  \ 的参数 `replacementValue`\n\n到目前为止，我们只使用过简单字符串作为 `replacementValue` 参数，但它可以实现更多功能。如果它的值是：\n\
  \n字体 字符串，则匹配项将用该字符串替换。字符 `$` 具有特殊含义，允许我们插入捕获组的内容等（详情请参阅后文）。\n- 一个函数，则匹配项将用通过该函数计算出的字符串进行替换。\n\
  \n#### 45.5.8.4 `replacementValue` 是字符串\n\n如果替换值是一个字符串，美元符号 `$` 有特殊含义——它会插入正则表达式匹配到的文本：\n\
  \n| 文本 | 结果 |\n| --- | --- |\n| `$$` | 单个 `$` |\n| `$&` | 完整匹配项 |\n| `` $` `` |\
  \ 匹配前的文本 |\n| `$'` | 匹配后的文本 |\n| `$n` | 位置组 `n` 的捕获 (`n` > 0) |\n| `$<name>` | 命名组\
  \ `name` 的捕获 ^([ES2018]) |\n\n示例：在匹配子字符串之前、内部和之后插入文本。\n\n```\n> 'a1 a2'.replaceAll(/a/g,\
  \ \"($`|$&|$')\")\n'(|a|1 a2)1 (a1 |a|2)2'\n```\n\n示例：插入位置组的捕获。\n\n```\n> const\
  \ regExp = /^([A-Za-z]+): (.*)$/ug;\n> 'first: Jane'.replaceAll(regExp, 'KEY: $1,\
  \ VALUE: $2')\n'KEY: first, VALUE: Jane'\n```\n\n示例：插入命名组的捕获。\n\n```\n> const regExp\
  \ = /^(?<key>[A-Za-z]+): (?<value>.*)$/ug;\n> 'first: Jane'.replaceAll(regExp, 'KEY:\
  \ $<key>, VALUE: $<value>')\n'KEY: first, VALUE: Jane'\n```\n\n![](img/file6.svg)\
  \ 练习：通过 `.replace()` 和命名组更改引号\n\n`exercises/regexps/change_quotes_test.mjs`\n\n\
  #### 45.5.8.5 `replacementValue` 是函数\n\n如果替换值是一个函数，我们可以计算每次替换的内容。在下面的示例中，我们将找到的每个非负整数乘以\
  \ 2。\n\n```\nassert.equal(\n  '3 cats and 4 dogs'.replaceAll(/[0-9]+/g, (all) =>\
  \ 2 * Number(all)),\n  '6 cats and 8 dogs'\n);\n```\n\n替换函数接收以下参数。注意它们与匹配对象（match\
  \ objects）是多么相似。这些参数都是位置参数，但我包含了人们可能如何命名它们：\n\n- `all`: 完整匹配\n- `g1`: 位置组 1 的捕获\n\
  - 等此类推\n- `index`: 匹配发生在哪里？\n- `input`: 正在其中替换的字符串\n- `groups` ^([ES2018]): 命名组的捕获（一个对象）\n\
  \n### 45.5.9 处理正则表达式的其他方法\n\n`String.prototype.split()` 在字符串章节 中有所描述。`String.prototype.split()`\
  \ 的第一个参数可以是字符串或正则表达式。如果是后者，组的捕获将出现在结果中：\n\n```\n> 'a:b : c'.split(':')\n[ 'a', 'b\
  \ ', ' c' ]\n> 'a:b : c'.split(/ *: */)\n[ 'a', 'b', 'c' ]\n> 'a:b : c'.split(/(\
  \ *):( *)/)\n[ 'a', '', '', 'b', ' ', ' ', 'c' ]\n```\n\n## 45.6 标志 `/g` 和 `/y`，以及属性\
  \ `.lastIndex`（进阶）\n\n在本节中，我们将检查 RegExp 标志 `/g` 和 `/y` 是如何工作的，以及它们如何依赖正则表达式的属性 `.lastIndex`。我们还将发现一个\
  \ `.lastIndex` 的有趣用例，你可能会让你感到惊讶。\n\n### 45.6.1 标志 `/g` 和 `/y`\n\n每个方法对 `/g` 和 `/y`\
  \ 的反应都不同；这给了我们一个大致的印象：\n\n- `/g` (`.global`, ES3): 标准表达式应该在字符串的任何地方多次匹配。\n- `/y`\
  \ (`.sticky`, ES6): 字符串中的任何匹配都应该紧跟在上一个匹配之后（匹配项“粘”在一起）。\n\n如果正则表达式既没有 `/g` 标志也没有\
  \ `/y` 标志，则匹配只发生一次并从开始开始。\n\n使用 `/g` 或 `/y` 时，匹配是相对于输入字符串内部的“当前位置”进行的。该位置存储在正则表达式属性\
  \ `.lastIndex` 中。\n\n有三组与正则表达式相关的方法：\n\n1. 字符串方法 `.search(regExp)` 和 `.split(regExp)`\
  \ 完全忽略了 `/g` 和 `/y`（因此也忽略 `.lastIndex`）。\n2. `RegExp` 方法 `.exec(str)` 和 `.test(str)`\
  \ 在设置了 `/g` 或 `/y` 时会以两种方式发生变化。\n    首先，我们通过重复调用该方法获取多次匹配。每次调用都会返回另一个结果（匹配对象或 `true`）或一个“结果结束”的值（`null`\
  \ 或 `false`）。\n    其次，正则表达式属性 `.lastIndex` 用于遍历输入字符串。一方面，`.lastIndex` 决定了匹配开始的位置：\n\
  \    - `/g` 意味着匹配必须从 `.lastIndex` 或之后开始。\n    - `/y` 意味着匹配必须正好从 `.lastIndex` 开始。也就是说，正则表达式的开头锚定在\
  \ `.lastIndex` 上。\n    注意 `^` 和 `$` 继续像往常一样工作：它们将匹配锚定在输入字符串的开头或结尾，除非设置了 `.multiline`。此时它们锚定在行的开头或结尾。\n\
  \    另一方面，`.lastIndex` 被设置为上一次匹配的最后一个索引加 1。\n3. 所有其他方法受影响的情况如下：\n    - `/g` 导致多次匹配。\n\
  \    - `/y` 导致必须在 `.lastIndex` 开始的单次匹配。\n    - `/yg` 导致没有间隙的多次匹配。\n\n这是一个初步概述。接下来的章节将进入更多细节。\n\
  \n### 45.6.2 方法具体是如何受到 `/g` 和 `/y` 影响的？\n\n#### 45.6.2.1 `regExp.exec(str)` [ES3]\n\
  \n如果没有 `/g` 和 `/y`，`.exec()` 会忽略 `.lastIndex` 并始终为第一个匹配返回匹配对象：\n\n```\n> const re\
  \ = /#/; re.lastIndex = 1;\n> [re.exec('##-#'), re.lastIndex]\n[{ 0: '#', index:\
  \ 0, input: '##-#' }, 1]\n> [re.exec('##-#'), re.lastIndex]\n[{ 0: '#', index: 0,\
  \ input: '##-#' }, 1]\n```\n\n有了 `/g`，匹配必须从 `.lastIndex` 或之后开始。`.lastIndex` 会更新。如果没有匹配，则返回\
  \ `null`。\n\n```\n> const re = /#/g; re.lastIndex = 1;\n> [re.exec('##-#'), re.lastIndex]\n\
  [{ 0: '#', index: 1, input: '##-#' }, 2]\n> [re.exec('##-#'), re.lastIndex]\n[{\
  \ 0: '#', index: 3, input: '##-#' }, 4]\n> [re.exec('##-#'), re.lastIndex]\n[null,\
  \ 0]\n```\n\n有了 `/y`，匹配必须正好从 `.lastIndex` 开始。`.lastIndex` 会更新。如果没有匹配，则返回 `null`。\n\
  \n```\n> const re = /#/y; re.lastIndex = 1;\n> [re.exec('##-#'), re.lastIndex]\n\
  [{ 0: '#', index: 1, input: '##-#' }, 2]\n> [re.exec('##-#'), re.lastIndex]\n[null,\
  \ 0]\n```\n\n有了 `/yg`，`.exec()` 的行为与 `/y` 相同。\n\n#### 45.6.2.2 `regExp.test(str)`\
  \ [ES3]\n\n该方法的行为与 `.exec()` 相同，但不是返回匹配对象，而是返回 `true`；不是返回 `null`，而是返回 `false`。\n\
  \n例如，如果没有 `/g` 或 `/y`，结果总是 `true`：\n\n```\n> const re = /#/; re.lastIndex = 1;\n\
  > [re.test('##-#'), re.lastIndex]\n[true, 1]\n> [re.test('##-#'), re.lastIndex]\n\
  [true, 1]\n```\n\n有了 `/g`，有两次匹配：\n\n```\n> const re = /#/g; re.lastIndex = 1;\n\
  > [re.test('##-#'), re.lastIndex]\n[true, 2]\n> [re.test('##-#'), re.lastIndex]\n\
  [true, 4]\n> [re.test('##-#'), re.lastIndex]\n[false, 0]\n```\n\n有了 `/y`，只有一次匹配：\n\
  \n```\n> const re = /#/y; re.lastIndex = 1;\n> [re.test('##-#'), re.lastIndex]\n\
  [true, 2]\n> [re.test('##-#'), re.lastIndex]\n[false, 0]\n```\n\n有了 `/yg`，`.test()`\
  \ 的行为与 `/y` 相同。\n\n#### 45.6.2.3 `str.match(regExp)` [ES3]\n\n如果没有 `/g`，`.match()`\
  \ 的工作类似于 `.exec()`。在没有 `/y` 时：\n\n```\n> const re = /#/; re.lastIndex = 1;\n> ['##-#'.match(re),\
  \ re.lastIndex]\n[{ 0: '#', index: 0, input: '##-#' }, 1]\n> ['##-#'.match(re),\
  \ re.lastIndex]\n[{ 0: '#', index: 0, input: '##-#' }, 1]\n```\n\n或者带有 `/y` 时：\n\
  \n\n\n\n\n```\n> const re = /#/y; re.lastIndex = 1;\n> ['##-#'.match(re), re.lastIndex]\n\
  [{ 0: '#', index: 1, input: '##-#' }, 2]\n> ['##-#'.match(re), re.lastIndex]\n[null,\
  \ 0]\n```\n\n使用 `/g` 时，我们在一个 `Array` 中获取所有匹配项（组 0）。`.lastIndex`会被忽略并重置为零。\n\n```\n\
  > const re = /#/g; re.lastIndex = 1;\n> '##-#'.match(re)\n['#', '#', '#']\n> re.lastIndex\n\
  0\n```\n\n`/yg` 的工作方式类似于 `/g`，但匹配项之间之间有间隙：\n\n```\n> const re = /#/yg; re.lastIndex\
  \ = 1;\n> '##-#'.match(re)\n['#', '#']\n> re.lastIndex\n0\n```\n\n#### 45.6.2.4\
  \ `str.matchAll(regExp)` [ES2020]\n\n如果未设置 `/g`，`.matchAll()` 会抛出异常：\n\n```\n> const\
  \ re = /#/y; re.lastIndex = 1;\n> '##-#'.matchAll(re)\nTypeError: String.prototype.matchAll\
  \ called with\na non-global RegExp argument\n```\n\n如果设置了 `/g`，匹配从 `.lastIndex`\
  \ 开始，且该属性不会改变：\n\n```\n> const re = /#/g; re.lastIndex = 1;\n> [...'##-#'.matchAll(re)]\n\
  [\n  { 0: '#', index: 1, input: '##-#' },\n  { 0: '#', index: 3, input: '##-#' },\n\
  ]\n> re.lastIndex\n1\n```\n\n如果设置了 `/yg`，行为与 `/g` 相同，但匹配项之间没有间隙：\n\n```\n> const\
  \ re = /#/yg; re.lastIndex = 1;\n> [...'##-#'.matchAll(re)]\n[\n  { 0: '#', index:\
  \ 1, input: '##-#' },\n]\n> re.lastIndex\n1\n```\n\n#### 45.6.2.5 `str.replace(regExp,\
  \ str)` [ES3]\n\n没有 `/g` 和 `/y` 时，只替换第一个出现处：\n\n```\n> const re = /#/; re.lastIndex\
  \ = 1;\n> '##-#'.replace(re, 'x')\n'x#-#'\n> re.lastIndex\n1\n```\n\n使用 `/g` 时，所有的出现处都会被替换。`.lastIndex`\
  \ 被忽略但重置为零。\n\n```\n> const re = /#/g; re.lastIndex = 1;\n> '##-#'.replace(re, 'x')\n\
  'xx-x'\n> re.lastIndex\n0\n```\n\n使用 `/y` 时，只替换位于 `.lastIndex` 处的（第一个）出现处。`.lastIndex`\
  \ 会更新。\n\n```\n> const re = /#/y; re.lastIndex = 1;\n> '##-#'.replace(re, 'x')\n\
  '#x-#'\n> re.lastIndex\n2\n```\n\n`/yg` 的工作方式类似于 `/g`，但不允许匹配项之间存在间隙：\n\n```\n> const\
  \ re = /#/yg; re.lastIndex = 1;\n> '##-#'.replace(re, 'x')\n'xx-#'\n> re.lastIndex\n\
  0\n```\n\n#### 45.6.2.6 `str.replaceAll(regExp, str)` [ES2021]\n\n`.replaceAll()`\
  \ 的工作类似于 `.replace()`，但如果未设置 `/g` 则会抛出异常：\n\n```\n> const re = /#/y; re.lastIndex\
  \ = 1;\n> '##-#'.replaceAll(re, 'x')\nTypeError: String.prototype.replaceAll called\n\
  with a non-global RegExp argument\n```\n\n### 45.6.3 `/g` 和 `/y` 的四个陷阱以及处理方法\n\n\
  我们将首先查看 `/g` 和 `/y` 的四个陷阱，然后查看处理这些陷阱的方法。\n\n#### 45.6.3.1 陷阱 1：我们无法内联带有 `/g` 或 `/y`\
  \ 的正则表达式\n\n带有 `/g` 的正则表达式不能内联。例如，在下面的 `while` 循环中，正则表达式在每次检查条件时都会重新创建。因此，它的 `.lastIndex`\
  \ 始终为零，循环永远不会结束。\n\n```javascript\nlet matchObj;\n// 死循环\nwhile (matchObj = /a+/g.exec('bbbaabaaa'))\
  \ {\n  console.log(matchObj[0]);\n}\n```\n\n使用 `/y` 时，问题是一样的。\n\n#### 45.6.3.2 陷阱\
  \ 2：移除 `/g` 或 `/y` 会破坏代码\n\n如果代码期望一个带有 `/g` 的正则表达式并且对 `.exec()` 或 `.test()` 的结果进行循环，那么不带\
  \ `/g` 的正则表达式会导致死循环：\n\n```javascript\nfunction collectMatches(regExp, str) {\n\
  \  const matches = [];\n  let matchObj;\n  // 死循环\n  while (matchObj = regExp.exec(str))\
  \ {\n    matches.push(matchObj[0]);\n  }\n  return matches;\n}\ncollectMatches(/a+/,\
  \ 'bbbaabaaa'); // 缺少标记 /g\n```\n\n为什么会有死循环？因为 `.exec()` 总是返回第一个结果（一个匹配对象），而永远不返回\
  \ `null`。\n\n使用 `/y` 时，问题是一样的。\n\n#### 45.6.3.3 陷阱 3：添加 `/g` 或 `/y` 会破坏代码\n\n对于\
  \ `.test()`，另一个注意事项：它受 `.lastIndex` 的影响。因此，如果我们想精确地检查一次正则表达式是否匹配字符串，那么正则表达式不能有 `/g`。否则，我们每次调用\
  \ `.test()` 通常都会得到不同的结果：\n\n```\n> const regExp = /^X/g;\n> [regExp.test('Xa'),\
  \ regExp.lastIndex]\n[ true, 1 ]\n> [regExp.test('Xa'), regExp.lastIndex]\n[ false,\
  \ 0 ]\n> [regExp.test('Xa'), regExp.lastIndex]\n[ true, 1 ]\n```\n\n第一次调用产生匹配并更新\
  \ `.lastIndex`。第二次调用未找到匹配并将 `.lastIndex` 重置为零。\n\n如果我们专门为 `.test()` 创建一个正则表达式，我们可能不会添加\
  \ `/g`。但是，如果我们对同一个正则表达式进行替换和测试，遇到 `/g` 的概率就会增加。\n\n再次，这个问题在 `/y` 中也存在：\n\n```\n\
  > const regExp = /^X/y;\n> regExp.test('Xa')\ntrue\n> regExp.test('Xa')\nfalse\n\
  > regExp.test('Xa')\ntrue\n```\n\n#### 45.6.3.4 陷阱 4：如果 `.lastIndex` 不为零，代码可能会产生意外结果\n\
  \n考虑到所有受 `.lastIndex` 影响的正则表达式，我们必须确保在开始时 `.lastIndex` 为零。否则，可能会得到意外的结果：\n\n```javascript\n\
  function count(regExp, str) {\n  let count = 0;\n  while (regExp.test(str)) {\n\
  \    count++;\n  }\n  return count;\n}\nconst myRegExp = /a/g;\nmyRegExp.lastIndex\
  \ = 4; // 应该是 3（等等，逻辑取决于输入）\n```\n\n通常，新创建的正则表达式中 `.lastIndex` 为零，我们不会像刚才那样改变它。但如果我们使用了它，`.lastIndex`\
  \ 最终可能不为零。\n\n#### 45.6.3.5 如何避免 `/g` 和 `/y` 的陷阱\n\n作为处理 `/g` 和 `.lastIndex` 的示例，我们重新审视\
  \ `count()`。我们如何防止正则表达式崩溃？让我们来看三种方法。\n\n##### 45.6.3.5.1 抛出异常\n\n首先，如果未设置 `/g` 或\
  \ `.lastIndex` 不为零，我们可以抛出异常：\n\n```javascript\nfunction countMatches(regExp, str)\
  \ {\n  if (!regExp.global) {\n    throw new Error('Flag /g of regExp must be set');\n\
  \  }\n  if (regExp.lastIndex !== 0) {\n    throw new Error('lastIndex must be zero');\n\
  \  }\n  let count = 0;\n  while (regExp.test(str)) {\n    count++;\n  }\n  return\
  \ count;\n}\n```\n\n##### 45.6.3.5.2 克隆正则表达式\n\n其次，我们可以克隆参数。这样做的好额外处是 `regExp` 不会改变。\n\
  \n```javascript\nfunction countMatches(regExp, str) {\n  const cloneFlags = regExp.flags\
  \ + (regExp.global ? '' : 'g');\n  const clone = new RegExp(regExp, cloneFlags);\n\
  \  let count = 0;\n  while (clone.test(str)) {\n    count++;\n  }\n  return count;\n\
  }\n```\n\n##### 45.6.3.5.3 使用不受 .lastIndex 或标记影响的操作\n\n若干正则表达式操作不受 `.lastIndex`\
  \ 或标记的影响。例如，当存在 `/g` 时，`.match()` 会忽略 `.lastIndex`：\n\n```javascript\nfunction countMatches(regExp,\
  \ str) {\n  if (!regExp.global) {\n    throw new Error('Flag /g of regExp must be\
  \ set');\n  }\n  return (str.match(regExp) ?? []).length;\n}\nconst myRegExp = /a/g;\n\
  myRegExp.lastIndex = 4;\nassert.equal(countMatches(myRegExp, 'babaa'), 3); // OK！\n\
  ```\n\n在这里，即使我们没有检查或修复 `.lastIndex`，`countMatches()` 也能工作。\n\n### 45.6.4 `.lastIndex`\
  \ 的用例：从给定索引开始匹配\n\n\n\n\n\n除了存储状态，`.lastIndex` 还可以用于从指定的索引开始匹配。本节将描述如何实现。\n\n####\
  \ 示例：检查正则表达式是否在指定索引处匹配\n\n由于 `.test()` 受 `/y` 和 `.lastIndex` 的影响，我们可以用它来检查正则表达式\
  \ `regExp` 是否在指定的 `index` 匹配字符串 `str`：\n\n```javascript\nfunction matchesStringAt(regExp,\
  \ str, index) {\n  if (!regExp.sticky) {\n    throw new Error('Flag /y of regExp\
  \ must be set');\n  }\n  regExp.lastIndex = index;\n  return regExp.test(str);\n\
  }\nassert.equal(\n  matchesStringAt(/x+/y, 'aaxxx', 0), false);\nassert.equal(\n\
  \  matchesStringAt(/x+/y, 'aaxxx', 2), true);\n```\n\n由于 `/y`，`regExp` 被锚定到 `.lastIndex`。\n\
  \n注意，我们不能使用断言 `^`，因为它会将 `regExp` 锚定到输入字符串的开头。\n\n#### 示例：从指定索引开始查找匹配的位置\n\n`.search()`\
  \ 允许我们找到正则表达式匹配的位置：\n\n```javascript\n> '#--#'.search(/#/)\n0\n```\n\n遗憾的是，我们无法改变\
  \ `.search()` 开始查找匹配的位置。作为一种替代方案，我们可以使用 `.exec()` 进行搜索：\n\n```javascript\nfunction\
  \ searchAt(regExp, str, index) {\n  if (!regExp.global && !regExp.sticky) {\n  \
  \  throw new Error('Either flag /g or flag /y of regExp must be set');\n  }\n  regExp.lastIndex\
  \ = index;\n  const match = regExp.exec(str);\n  if (match) {\n    return match.index;\n\
  \  } else {\n    return -1;\n  }\n}\n\nassert.equal(\n  searchAt(/#/g, '#--#', 0),\
  \ 0);\nassert.equal(\n  searchAt(/#/g, '#--#', 1), 3);\n```\n\n#### 示例：替换指定索引处的出现项\n\
  \n当不使用 `/g` 且使用 `/y` 时，`.replace()` 会执行一次替换——如果在 `.lastIndex` 处有匹配：\n\n```javascript\n\
  function replaceOnceAt(str, regExp, replacement, index) {\n  if (!(regExp.sticky\
  \ && !regExp.global)) {\n    throw new Error('Flag /y must be set, flag /g must\
  \ not be set');\n  }\n  regExp.lastIndex = index;\n  return str.replace(regExp,\
  \ replacement);\n}\nassert.equal(\n  replaceOnceAt('aa aaaa a', /a+/y, 'X', 0),\
  \ 'X aaaa a');\nassert.equal(\n  replaceOnceAt('aa aaaa a', /a+/y, 'X', 3), 'aa\
  \ X a');\nassert.equal(\n  replaceOnceAt('aa aaaa a', /a+/y, 'X', 8), 'aa aaaa X');\n\
  ```\n\n### .lastIndex 的缺点\n\n正则表达式属性 `.lastIndex` 有两个显著缺点：\n\n- 它使正则表达式变得有状态的：\n\
  \    - 我们现在必须留意正则表达式的状态以及如何共享它们。\n    - 对于许多用例，我们无法无法通过冻结（freezing）来使其变为不可变。\n-\
  \ 对 `.lastIndex` 的支持在不同的正则表达式操作之间是不一致的。\n\n相反，`.lastIndex` 也为我们提供了额外的有用功能：我们可以规定匹配应该开始的位置（针对某些操作）。\n\
  \n### 总结：`.global` (`/g`) 和 `.sticky` (`/y`)\n\n以下方法完全不受 `/g` 和 `/y` 的影响：\n\n- `String.prototype.search()`\n\
  - `String.prototype.split()`\n\n下表解释了其余与正则表达式相关的方法如何受到这两个标志的影响：\n\n| | `/` | `/g`\
  \ | `/y` | `/yg` |\n| :--- | :--- | :--- | :--- | :--- |\n| `r.exec(s)` | `{i:0}`\
  \ | `{i:1}` | `{i:1}` | `{i:1}` |\n| | `.lI` unch | `.lI` upd | `.lI` upd | `.lI`\
  \ upd |\n| `r.test(s)` | `true` | `true` | `true` | `true` |\n| | `.lI` unch | `.lI`\
  \ upd | `.lI` upd | `.lI` upd |\n| `s.match(r)` | `{i:0}` | `[\"#\",\"#\",\"#\"\
  ]` | `{i:1}` | `[\"#\",\"#\"]` |\n| | `.lI` unch | `.lI` reset | `.lI` upd | `.lI`\
  \ reset |\n| `s.matchAll(r)` | `TypeError` | `[{i:1}, {i:3}]` | `TypeError` | `[{i:1}]`\
  \ |\n| | | `.lI` unch | | `.lI` unch |\n| `s.replace(r, 'x')` | `\"x#-\"` | `\"\
  xx-x\"` | `\"#x-\"\"` | `\"xx-#\"` |\n| | | `.lI` unch | `.lI` reset | `.lI` upd\
  \ | `.lI` reset |\n| `s.replaceAll(r, 'x')` | `TypeError` | `\"xx-x\"` | `TypeError`\
  \ | `\"xx-#\"` |\n| | | |lI` reset | | `.lI` reset |\n\n变量：\n\n```javascript\nconst\
  \ r = /#/; r.lastIndex = 1;\nconst s = '##-#';\n```\n\n缩写：\n\n- `{i:2}`：属性 `.index`\
  \ 值为 `2` 的匹配对象\n- `.lI` upd：`.lastIndex` 更新\n- `.lI` reset：`.lastIndex` 重置为零\n-\
  \ `.lI` unch：`.lastIndex` 不变\n\n上表是通过一个 [Node.js 脚本](https://gist.github.com/rauschma/5c90e6c19923611521a61e199d8cb15b)\
  \ 生成的。\n\n###正则表达式技巧\n\n#### 为正则表达式转义任意文本\n\n以下函数可以转义任意文本：\n\n```javascript\nfunction\
  \ escapeRegExp(string) {\n  return string.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\\
  $&');\n}\n```\n\n#### 匹配所有或空\n\n有时，我们需要一个匹配所有或空的正则表达式，例如默认值。\n\n- 匹配所有：`(?:)`\n\
  \  空非捕获分组 `(?:)` 匹配所有内容。\n\n- 匹配空：`^`\n  `^` 仅匹配字符串开头。点号会跳过第一个字符。\n\n\n\n\n\n##\
  \ 46.5.3 创建日期的其他方法\n\n## 46.6 Getters 和 setters\n\n### 46.6.1 时间单位的 getters 和 setters\n\
  \n## 46.7 将日期转换为字符串\n\n### 46.7.1 包含时间的字符串\n\n### 46.7.2 包含日期的字符串\n\n### 46.7.3\
  \ 包含日期和时间的字符串\n\n### 46.7.4 其他方法\n\n本章描述了 JavaScript 用于日期的 API —— `Date` 类。\n\n\
  ## 46.1 最佳实践：避免使用内置的 `Date`\n\nJavaScript 的 `Date` API 使用起来非常繁琐。因此，对于任何与日期相关的操作，最好依赖第三方库。流行的库包括：\n\
  \n* [Moment.js](https://momentjs.com)\n* [Day.js](https://github.com/iamkun/dayjs)\n\
  * [Luxon](https://moment.github.io/luxon/)\n* [js-joda](https://js-joda.github.io/js-joda/)\n\
  * [date-fns](https://github.com/date-fns/date-fns)\n\n请参考博客文章[“为什么你不应该使用 Moment.js……”](https://inventi.studio/en/blog/why-you-shouldnt-use-moment-js)\
  \ 来了解这些库的优缺点。\n\n此外，TC39 正在为 JavaScript 开发一个新的日期 API：[`temporal`](https://github.com/maggiepint/proposal-temporal)。\n\
  \n### 46.1.1 在日期库中需要关注的特性\n\n有两点需要记住：\n\n* `Tree-shaking`（摇树优化）可以显著减小库的大小。这项技术仅向\
  \ Web 服务器部署那些在某些地方被导入的导出。函数比类更易进行摇树优化。\n\n* 对时区的支持：如后文所述，`Date` 不支持时区，这引入了许多陷阱并是一个主要的弱点。请确保你的日期库支持时区。\n\
  \n## 46.2 时间标准\n\n### 46.2.1 背景：UTC vs. Z vs. GMT\n\nUTC、Z 和 GMT 是指定时间的几种方式，它们相似但有细微差别：\n\
  \n* UTC（协调世界时）是所有时区所依据的时间标准。时区是相对于 UTC 指定的。也就是说，没有任何国家或地区将 UTC 作为其本地时区。\n\n* Z（祖鲁时区）是一种军事时区，通常在航空和军事领域用作\
  \ UTC+0 的别名。\n\n* GMT（格林维治标准时间）是某些欧洲和非洲国家使用的时区。它是 UTC 加上零小时，因此其其时间与 UTC 相同。\n\n\
  来源：\n\n* [“GMT 和 UTC 的区别”](https://www.timeanddate.com/time/gmt-utc-time.html) 来自\
  \ TimeAndDate.com\n* [“Z – 祖鲁时区（军事时间）”](https://www.timeanddate.com/time/zones/z)\
  \ 来自 TimeAndDate.com\n\n### 46.2.2 日期不支持时区\n\n日期支持以下时间标准：\n\n* 本地时区（取决于当前位置）\n*\
  \ UTC\n* 时间偏移（相对于 UTC）\n\n根据操作，只有部分选项可用。例如，在将日期转换为字符串或提取如日期等时间单位时，你只能在本地时区和 UTC\
  \ 之间进行选择。\n\n日期在内部以 UTC 形式存储。在从本地时区转换或反之时，必要的偏移量是通过日期确定的。在下面的示例中，本地时区是 Europe/Paris：\n\
  \n```\n// CEST (欧洲夏令时间)\nassert.equal(\n  new Date('2122-06-29').getTimezoneOffset(),\
  \ -120);\n\n// CET (欧洲标准时间)\nassert.equal(\n  new Date('2122-12-29').getTimezoneOffset(),\
  \ -60);\n```\n\n每当你创建或转换日期时，你都需要注意正在使用的时间标准——例如：`new Date()` 使用本地时区，而 `.toISOString()`\
  \ 使用 UTC。\n\n```\n> new Date(2077, 0, 27).toISOString()\n'2077-01-26T23:00:00.000Z'\n\
  ```\n\n日期将 0 解释为 1 月。在本地时区的日期是 27 号，但在 UTC 中是 26 号。\n\n记录每个操作支持的时间标准\n\n在本章的剩余部分中，每个操作都注明了支持的时间标准。\n\
  \n#### 46.2.2.1 无法指定时区的缺点\n\n无法指定时区有两个缺点：\n\n* 它导致无法支持多个时区。\n* 它可能导致特定区域的 bug。例如，上一个示例根据执行位置的不同产生不同的结果。为了安全起见：\n\
  \n    * 尽可能使用基于 UTC 的操作\n    * 在解析字符串时使用 `Z` 或时间偏移（更多信息见下一节）。\n\n## 46.3 背景：日期时间格式\
  \ (ISO)\n\n日期-时间格式描述了：\n\n* 以下方法接受的字符串：\n    * `Date.parse()`\n    * `new Date()`\n\
  * 以下方法返回的（总是长格式）：\n    * `Date.prototype.toISOString()`\n\n以下是 `.toISOString()`\
  \ 返回的日期时间字符串示例：\n\n```\n'2033-05-28T15:59:59.123Z'\n```\n\n日期时间格式具有以下结构：\n\n* 日期格式：Y=年；M=月；D=日\n\
  \    ```\n    YYYY-MM-DD\n    YYYY-MM\n    YYYY\n    ```\n\n* 时间格式：T=分隔符（字符串 `'T'`）；H=小时；m=分钟；s=秒和毫秒；Z=祖鲁时区（字符串\
  \ `'Z'`）\n    ```\n    THH:mm:ss.sss\n    THH:mm:ss.sssZ\n\n    THH:mm:ss\n    THH:mm:ssZ\n\
  \    ```\n\n* 日期时间格式：`YYYY-MM-DD` 紧接 `THH:mm:ss.sss`。\n\n### 46.3.1 提示：附加 `Z` 使日期解析具有确定性\n\
  \n如果你在字符串末尾添加 `Z`，日期解析在不同位置就不会产生不同的结果：\n\n* 没有 `Z`：输入为 1 月 27 日（本地时区），输出为 1 月 26\
  \ 日（UTC）。\n    ```\n    > new Date('2077-01-27T00:00').toISOString()\n    '2077-01-26T23:00:00.000Z'\n\
  \    ```\n\n* 有 `Z`：输入为 1 月 27 日。\n    ```\n    > new Date('2077-01-27T00:00Z').toISOString()\n\
  \    '2077-01-27T00:00:00.000Z'\n    ```\n\n## 46.4 时间值\n\n`time value`（时间值）通过自\
  \ UTC 1970 年 1 月 1 日 00:00:00 以来的毫秒数来表示日期。\n\n时间值可用于创建 Date：\n\n```\nconst timeValue\
  \ = 0;\nassert.equal(\n  new Date(timeValue).toISOString(),\n  '1970-01-01T00:00:00.000Z');\n\
  ```\n\n将 Date 强制转换为数字会返回其时间值：\n\n```\n> Number(new Date(123))\n123\n```\n\n操作符会将操作数转换为数字。因此，你可以使用这些运算符来比较\
  \ Date：\n\n```\nassert.equal(\n  new Date('1972-05-03') < new Date('2001-12-23'),\
  \ true);\n\n// 内部：\nassert.equal(73699200000 < 1009065600000, true);\n```\n\n###\
  \ 46.4.1 创建时间值\n\n以下方法创建时间值：\n\n* `Date.now(): number` (UTC)\n    返回当前时间的时间值。\n\
  * `Date.parse(dateTimeStr: string): number` (本地时区、UTC、时间偏移)\n    解析 `dateTimeStr`\
  \ 并返回对应的时间值。\n* `Date.UTC(year, month, date?, hours?, minutes?, seconds?, milliseconds?):\
  \ number` (UTC)\n    返回指定 UTC 日期时间的值。\n\n### 46.4.2 获取和设置时间值\n\n* `Date.prototype.getTime():\
  \ number` (UTC)\n    返回对应 Date 的时间值。\n* `Date.prototype.setTime(timeValue)` (UTC)\n\
  \    将 `this` 设置为由 `timeValue` 编码的日期。\n\n\n\n\n\n`new Date(year: number, month:\
  \ number, date?: number, hours?: number, minutes?: number, seconds?: number, milliseconds?:\
  \ number)` (本地时区)\n\n其中两个参数存在陷阱：\n\n- 对于 `month`，0 代表 1 月，1 代表 2 月，以此此类推。\n- 如果\
  \ 0 ≤ `year` ≤ 99，则会加上 1900 年：\n\n```javascript\n> new Date(12, 1, 22, 19, 11).getFullYear()\n\
  1912\n```\n\n这就是为什么在这一章的其他地方，我们避免使用时间单位 `year` 并始终使用 `fullYear`。但在这种情况下，我们别无选择。\n\
  \n示例：\n\n```javascript\n> new Date(2077,0,27, 21,49).toISOString() // CET (UTC+1)\n\
  '2077-01-27T20:49:00.000Z'\n```\n\n注意，输入的小时 (21) 与输出的小时 (20) 不同。前者指的是本地时区，后者指的是\
  \ UTC。\n\n### 46.5.2 从字符串解析日期\n\n`new Date(dateTimeStr: string)` (本地时区, UTC, 时间偏移)\n\
  \n如果结尾有 `Z`，则使用 UTC：\n\n```javascript\n> new Date('2077-01-27T00:00Z').toISOString()\n\
  '2077-01-27T00:00:00.000Z'\n```\n\n如果结尾没有 `Z` 或时间偏移，则使用本地时区：\n\n```javascript\n\
  > new Date('2077-01-27T00:00').toISOString() // CET (UTC+1)\n'2077-01-26T23:00:00.000Z'\n\
  ```\n\n如果字符串仅包含日期，它被解释为 UTC：\n\n```javascript\n> new Date('2077-01-27').toISOString()\n\
  '2077-01-27T00:00:00.000Z'\n```\n\n### 46.5.3 创建日期的其他方法\n\n- `new Date(timeValue:\
  \ number)` (UTC)\n\n```javascript\n> new Date(0).toISOString()\n'1970-01-01T00:00:00.000Z'\n\
  ```\n\n- `new Date()` (UTC)\n\n同于 `new Date(Date.now())`。\n\n## 46.6 Getter 和 setter\n\
  \n### 46.6.1 时间单位的 getter 和 setter\n\n日期具有时间单位的 getter 和 setter——例如：\n\n- `Date.prototype.getFullYear()`\n\
  - `Date.prototype.setFullYear(num)`\n\n这些 getter 和 setter 遵循以下模式：\n\n- 本地时区：\n \
  \   - `Date.prototype.get«Unit»()`\n    - `Date.prototype.set«Unit»(num)`\n- UTC:\n\
  \    - `Date.prototype.getUTC«Unit»()`\n    - `Date.prototype.setUTC«Unit»(num)`\n\
  \n这些是支持的时间单位：\n\n- 日期 (Date)\n    - `FullYear`\n    - `Month`: 月份 (0–11)。**陷阱：**\
  \ 0 是 1 月，等等。\n    - `Date`: 月的几 (1–31)\n    - `Day` (仅限 getter): 星期 (0–6, 0 是周日)\n\
  - 时间 (Time)\n    - `Hours`: 小时 (0–23)\n    - `Minutes`: 分钟 (0–59)\n    - `Seconds`:\
  \ 秒 (0–59)\n    - `Milliseconds`: 毫秒 (0–999)\n\n还有一个 getter 不符合上述的模式：\n\n- `Date.prototype.getTimezoneOffset()`\n\
  \n返回本地时区与 UTC 之间的时间差（分钟分钟）。例如，对于 Europe/Paris，它返回 `-120` (CEST，中欧夏令时间) 或 `-60` (CET，中欧时间)：\n\
  \n```javascript\n> new Date('2122-06-29').getTimezoneOffset()\n-120\n> new Date('2122-12-29').getTimezoneOffset()\n\
  -60\n```\n\n## 46.7 将日期转换为字符串\n\n示例日期：\n\n```javascript\nconst d = new Date(0);\n\
  ```\n\n### 46.7.1 包含时间的字符串\n\n- `Date.prototype.toTimeString()` (本地时区)\n\n```javascript\n\
  > d.toTimeString()\n'01:00:00 GMT+0100 (Central European Standard Time)'\n```\n\n\
  ### 46.7.2 包含日期的字符串\n\n- `Date.prototype.toDateString()` (本地时区)\n\n```javascript\n\
  > d.toDateString()\n'Thu Jan 01 1970'\n```\n\n### 46.7.3 包含日期和时间的字符串\n\n- `Date.prototype.toString()`\
  \ (本地时区)\n\n```javascript\n> d.toString()\n'Thu Jan 01 1970 01:00:00 GMT+0100 (Central\
  \ European Standard Time)'\n```\n\n- `Date.prototype.toUTCString()` (UTC)\n\n```javascript\n\
  > d.toUTCString()\n'Thu, 01 Jan 1970 00:00:00 GMT'\n```\n\n- `Date.prototype.toISOString()`\
  \ (UTC)\n\n```javascript\n> d.toISOString()\n'1970-01-01T00:00:00.000Z'\n```\n\n\
  ### 46.7.4 其他方法\n\n以下三个方法并不真正属于 ECMAScript 标准，而是属于 [ECMAScript 国际化 API](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl)。该\
  \ API 提供了许多格式化日期的功能（包括对时区的支持），但不用于解析。\n\n- `Date.prototype.toLocaleTimeString()`\n\
  - `Date.prototype.toLocaleDateString()`\n- `Date.prototype.toLocaleString()`\n\n\
  ![](img/file6.svg) **练习：创建一个日期字符串**\n\n`exercises/dates/create_date_string_test.mjs`\n\
  \n# 47 创建和解析 JSON (`JSON`)\n\n* * *\n\n- 47.1 [JSON 的发现与标准化]\n    - 47.1.1 [JSON\
  \ 的语法是冻结]\n- 47.2 [JSON 语法]\n- 47.3 [使用 JSON API]\n    - 47.3.1 `JSON.stringify(data,\
  \ replacer?, space?)`\n    - 47.3.2 `JSON.parse(text, reviver?)`\n    - 47.3.3 [示例：在\
  \ JSON 之间转换]\n- 47.4 [自定义字符串化和解析（高级）]\n    - 47.4.1 [`.stringfy()`：指定要字符串化的对象属性]\n\
  \    - 47.4.2 `.stringify()` 和 `.parse()`：值访问器\n    - 47.4.3 [示例：访问值]\n    - 47.4.4 [示例：访问值]\n\
  \    - 47.4.5 [示例：解析值]\n- 47.5 [常见问题]\n    - 47.5.1 [为什么 JSON 不支持注释？]\n\n\n\n\n\n\
  - `null`（但不是 `undefined`）\n- 布尔值\n- 数字（排除 `NaN`、`+Infinity`、`-Infinity`）\n- 字符串（必须使用双引号）\n\
  \n因此，你无法在 JSON 中）直接表示循环结构。\n\n## 47.3 使用 `JSON` API\n\n全局命名空间对象 `JSON` 包含了用于处理 JSON\
  \ 数据的方法。\n\n### 47.3.1 `JSON.stringify(data, replacer?, space?)`\n\n`.stringify()`\
  \ 将 JavaScript 的 `data` 转换为 JSON 字符串。在本节中，我们忽略了参数 `replacer`；它在 [§47.4 “自定义字符串化和解析”]\
  \ 中进行了详细解释。\n\n#### 47.3.1.1 结果：单行文本\n\n如果你只提供第一个参数，`.stringify()` 将返回单行文本：\n\n\
  ```\nassert.equal(\n  JSON.stringify({foo: ['a', 'b']}),\n  '{\"foo\":[\"a\",\"\
  b\"]}'\n```\n\n#### 47.3.1.2 结果：带缩进的多行\n\n如果你为 `space` 提供一个非负整数，`.stringify()` 将返回多行，并根据嵌套层级缩进\
  \ `space` 个空格：\n\n```\nassert.equal(\n  JSON.stringify({foo: ['a', 'b']}, null,\
  \ 2),\n  '{\n  \"foo\": [\n    \"a\",\n    \"b\"\n  ]\n}');\n```\n\n#### 47.3.1.3\
  \ JavaScript 数据字符串化的细节\n\n**原始值：**\n\n- 支持的原始值会被字符串化为：\n\n```\n> JSON.stringify('abc')\n\
  '\"abc\"'\n> JSON.stringify(123)\n'123'\n> JSON.stringify(null)\n'null'\n```\n\n\
  - 不支持的数字：`'null'`\n\n```\n> JSON.stringify(NaN)\n'null'\n> JSON.stringify(Infinity)\n\
  'null'\n```\n\n- Bigints：`TypeError`\n\n```\n> JSON.stringify(123n)\nTypeError:\
  \ Do not know how to serialize a BigInt\n```\n\n- 其他不支持的原始值不会被字符串化；它们的结果为 `undefined`：\n\
  \n```\n> JSON.stringify(undefined)\nundefined\n> JSON.stringify(Symbol())\nundefined\n\
  ```\n\n**对象：**\n\n- 如果对象具有 `.toJSON()` 方法，则该方法的的结果会被字符串化：\n\n```\n> JSON.stringify({toJSON:\
  \ () => true})\n'true'\n```\n\n- Date 对象拥有 `.toJSON()` 方法，返回一个字符串：\n\n```\n> JSON.stringify(new\
  \ Date(1999, 11, 31, 23, 0, 0))\n'\"1999-11-31T23:00:00.000Z\"'\n```\n\n- 包装过的原始值会被解箱并字符串化：\n\
  \n```\n> JSON.stringify(new Boolean(true))\n'true'\n> JSON.stringify(new Number(123))\n\
  '123'\n```\n\n- 数组会被字符串化为数组字面量。不支持的数组元素会被字符串化为 `null`：\n\n```\n> JSON.stringify([undefined,\
  \ 123, Symbol()])\n'[null,123]'\n```\n\n- 除了函数外的所有其他对象都会字符串化为对象字面量。带有不支持值的属性会被省略：\n\
  \n```\n> JSON.stringify({a: Symbol(), b: true})\n'{\"b\":true}'\n```\n\n- 函数不会被字符串化：\n\
  \n```\n> JSON.stringify(() => {})\nundefined\n```\n\n### 47.3.2 `JSON.parse(text,\
  \ reviver?)`\n\n`.parse()` 将 JSON `text` 转换为 JavaScript 值。在本节中，我们忽略了参数 `reviver`；它在\
  \ [§47.4 “自定义字符串化和解析”] 中进行了解释。\n\n这是一个使用 `.parse()` 的示例：\n\n```\n> JSON.parse('{\"\
  foo\":[\"a\",\"b\"]')\n{ foo: ['a', 'b'] }\n```\n\n### 47.3.3 示例：与 JSON 转换\n\n以下类实现了从\
  \ JSON（行 A）到 JSON（行 B）的转换：\n\n```javascript\nclass Point {\n  static fromJson(jsonObj)\
  \ { // (A)\n    return new Point(jsonObj.x, jsonObj.y);\n  }\n\n  constructor(x,\
  \ y) {\n    this.x = x;\n    this.y = y;\n  }\n\n  toJSON() { // (B)\n    return\
  \ {x: this.x, y: this.y};\n  }\n}\n```\n\n- 将 JSON 转换为 point：我们使用静态方法 `Point.fromJson()`\
  \ 解析 JSON 并创建 `Point` 实例。\n\n```javascript\nassert.deepEqual(\n  Point.fromJson(JSON.parse('{\"\
  x\":3,\"y\":5}')),\n  new Point(3, 5)\n);\n```\n\n- 将 point 转换为 JSON：`JSON.stringify()`\
  \ 内部调用了之前提到的 `.toJSON()`。\n\n```javascript\nassert.equal(\n  JSON.stringify(new\
  \ Point(3, 5)),\n  '{\"x\":3,\"y\":5}'\n);\n```\n\n**练习：对象与 JSON 的转换**\n\n`exercises/json/to_from_json_test.mjs`\n\
  \n## 47.4 自定义字符串化和解析（高级）\n\n字符串化和解析可以如下进行自定义：\n\n- `JSON.stringify(data, replacer?,\
  \ space?)`\n  可选参数 `replacer` 包含：\n  - 一个属性名称数组。如果 `data` 中的值被字符串化为对象字面量，则只考虑这些属性。所有其他属性都被忽略。\n\
  \  - 一个访问者（value visitor），一个可以在字符串化之前转换 JavaScript 函数。\n\n- `JSON.parse(text, reviver?)`\n\
  \  可选参数 `reviver` 包含一个可以在返回之前转换解析 JSON 数据的访问者。\n\n### 47.4.1 `.stringify()`：指定要字符串化的对象属性\n\
  \n如果 `.stringify()` 的第二个参数是数组，则只有其中提到的对象属性会被包含在结果中：\n\n```javascript\nconst obj\
  \ = {\n  a: 1,\n  b: {\n    c: 2,\n    d: 3,\n  }\n};\nassert.equal(\n  JSON.stringify(obj,\
  \ ['b', 'c']),\n  '{\"b\":{\"c\":2}}');\n```\n\n### 47.4.2 `.stringify()` 和 `.parse()`：访问者\n\
  \n我所说的访问者是一个转换 JavaScript 数据的函数：\n\n- `JSON.stringify()` 让其参数 `replacer` 中的访问者在字符串化之前转换\
  \ JavaScript 数据。\n- `JSON.parse()` 让其参数 `reviver` 中的访问者在返回之前转换解析后的 JSON 数据。\n\n\
  在本节中，JavaScript 数据被视为一个值树。如果数据是原子的，它就是一个只有一个根的树。树中的所有值都会一个接一个传递给访问者。根据访问者的返回值，当前值会被省略、更改或保留。\n\
  \n访问者具有以下类型签名：\n\n```\ntype ValueVisitor = (key: string, value: any) => any;\n```\n\
  \n参数为：\n\n- `value`：当前值。\n- `this`：当前值的父级。根值 `r` 的父级是 `{'': r}`。\n  - 注意：`this`\
  \ 是一个隐式参数，仅当访问者为普通函数时可用。\n- `key`：当前值在其父级中的键或索引。根值的键是 `''`。\n\n访问者可以返回：\n\n- `value`：意味着没有任何变化。\n\
  - 一个不同的值 `x`：导致输出树中的 `value` 被替换为 `x`。\n- `undefined`：导致输出树中的 `value` 被省略。\n\n###\
  \ 47.4.3 示例：访问值\n\n以下代码展示了访问者看到值的顺序：\n\n\n\n\n\n```javascript\nconst log = [];\n\
  function valueVisitor(key, value) {\n  log.push({this: this, key, value});\n  return\
  \ value; // no change\n}\n\nconst root = {\n  a: 1,\n  b: {\n    c: 2,\n    d: 3,\n\
  \  }\n};\nJSON.stringify(root, valueVisitor);\nassert.deepEqual(log, [\n  { this:\
  \ { '': root }, key: '',  value: root   },\n  { this: root        , key: 'a', value:\
  \ 1      },\n  { this: root        , key: 'b', value: root.b },\n  { this: root.b\
  \      , key: 'c', value: 2      },\n  { this: root.b      , key: 'd', value: 3\
  \      },\n]);\n```\n\n如我们所示，`JSON.stringify()` 的替换函数（replacer）是从自上下访问值的（先根优先，叶子节点最后）。这种方向的原理是我们正在将\
  \ JavaScript 值转换为 JSON 值。而单个 JavaScript 对象可能会展开成一个与 JSON 兼容值的树。\n\n相比之下，`JSON.parse()`\
  \ 的还原函数（reviver）是从自下上访问值的（叶子节点优先，根最后）。这种方向的原理是我们正在将 JSON 值组装成 JavaScript 值。因此，我们需要在转换整体之前先转换部分。\n\
  \n### 47.4.4 示例：对不支持的值进行序列化\n\n`JSON.stringify()` 对正则表达式对象没有特殊支持——它像对待普通对象一样对它们进行序列化：\n\
  \n```javascript\nconst obj = {\n  name: 'abc',\n  regex: /abc/ui,\n};\nassert.equal(\n\
  \  JSON.stringify(obj),\n  '{\"name\":\"abc\",\"regex\":{}}');\n```\n\n我们可以通过替换函数来修复这个问题：\n\
  \n```javascript\nfunction replacer(key, value) {\n  if (value instanceof RegExp)\
  \ {\n    return {\n      __type__: 'RegExp',\n      source: value.source,\n    \
  \  flags: value.flags,\n    };\n  } else {\n    return value; // no change\n  }\n\
  }\nassert.equal(\nJSON.stringify(obj, replacer, 2),\n`{\n \"name\": \"abc\",\n \"\
  regex\": {\n \"__type__\": \"RegExp\",\n \"source\": \"abc\",\n \"flags\": \"iu\"\
  \n }\n}`);\n```\n\n### 47.4.5 示例：解析不支持的值\n\n为了解析上一节中的结果，我们需要一个还原函数：\n\n```javascript\n\
  function reviver(key, value) {\n  // 非常简单的检查\n  if (value && value.__type__ ===\
  \ 'RegExp') {\n    return new RegExp(value.source, value.flags);\n  } else {\n \
  \   return value;\n  }\n}\nconst str = `{\n \"name\": \"abc\",\n \"regex\": {\n\
  \ \"__type__\": \"RegExp\",\n \"source\": \"abc\",\n \"flags\": \"iu\"\n }\n}`;\n\
  assert.deepEqual(\n  JSON.parse(str, reviver),\n  {\n    name: 'abc',\n    regex:\
  \ /abc/ui,\n  });\n```\n\n## 47.5 常见问题解答\n\n### 47.5.1 为什么 JSON 不支持注释？\n\nDouglas\
  \ Crockford 在 [2012 年的一篇文章](https://archive.google.com/web/2019030824153/) 中解释了原因：我删除了注释，是因为人们利用它们来存放指令。我看到人们将注释用于解析、插入等操作，这违背了\
  \ JSON 数据的初衷。\n\n\n\n\n\n*   渐进式 Web 应用（Progressive web apps）：`progressive web apps`\
  \ 背后的核心思想是为 Web 应用提供传统只有原生应用才具备的功能——例如：在移动和桌面操作系统上的原生安装；离线运行；向用户显示通知。Google 发布了一份[清单](https://developers.google.com/web/progressive-web-apps/checklist)，详细说明了什么让一个\
  \ Web 应用变得“渐进式”。最低要求是：\n\n*   应用必须通过 `HTTPS` 提供服务（而不是不安全的 `HTTP`）。\n\n*   应用必须有一个\
  \ `Web App Manifest file`（Web 应用清单文件），用于指定元数据，如应用名称和图标（通常具有多个分辨率）。还必须存在图标文件（文件）。\n\
  \n*   应用必须有一个 `service worker`：它是应用的基础层，运行在后台的独立进程中（独立于 Web 页面）。它的职责之一是在没有互联网连接时保持应用运行。除此外，还有两种机制帮助它实现这一点：它是一个本地代理，负责应用程序所有的\
  \ Web 资源请求；它还可以访问浏览器缓存。因此，在最初缓存了所有关键资源后，它可以使用缓存来满足应用离线时的请求。`service worker` 的其他功能包括在后台同步数据；接收服务器发送的推送消息；以及上述的向用户显示通知。\n\
  \n学习 Web 开发（包括 JavaScript 及其他内容）的一个极佳资源是 [MDN Web Docs](https://developer.mozilla.org/en-US/docs/Learn)。\n\
  \n### 48.2.1 关注 WebAssembly (Wasm)!\n\n[WebAssembly](https://webassembly.org) 是一种内置在大多数\
  \ JavaScript 引擎中的通用虚拟机。你将获得如下的工作分分配：\n\n*   JavaScript 用于动态、高层次的代码。\n\n*   WebAssembly\
  \ 用于静态、低层次的代码。\n\n对于静态代码，WebAssembly 速度非常快：C/C++ 代码编译为 WebAssembly 后，其速度大约是编译为原生（[源码](https://arxiv.org/abs/1901.09056)）的相同代码的\
  \ 50%。用例包括支持新的视频格式、机器学习、游戏等。\n\nWebAssembly 作为各种语言的编译目标效果良好。这这意味着 JavaScript 将被编译为\
  \ WebAssembly 或被另一种语言取代吗？\n\n#### 48.2.1.1 JavaScript 会被编译为 WebAssembly 吗？\n\nJavaScript\
  \ 引擎对 JavaScript 高度动态的特性进行了许多优化。如果你想将 JavaScript 编译为 WebAssembly，你就必须在 WebAssembly\
  \ 之上实现这些优化。结果将比当前的引擎更慢，并且拥有相似的代码库。因此，你不会从中获得任何收益。\n\n#### 48.2.1.2 JavaScript 会被另一种语言取代吗？\n\
  \nWebAssembly 是否意味着 JavaScript 即将被另一种语言取代？WebAssembly 的确让在 浏览器中支持 JavaScript 以外的语言变得更容易。但这些语言在该平台上仍面临着若干挑战：\n\
  \n*   所有的浏览器 API 都基于 JavaScript。\n\n*   其他语言的运行时（标准库等）会产生额外的内存开销，而 JavaScript 的运行时已经内置在\
  \ Web 浏览器中。\n\n*   JavaScript 家为人知，拥有许多库和工具等。\n\n此外，WebAssembly 生态系统的许多部分（例如调试）仍在开发中。\n\
  \n对于动态代码，JavaScript 相对较快。因此，在可预未来，它可能仍然是高层次代码最受欢迎的选择。对于低层次代码，将更多静态语言（如 `Rust`）编译为\
  \ WebAssembly 是一个非常吸引人的选项。\n\n鉴于它只是一个虚拟机，关于 WebAssembly 有实际学习意义的知识并不多。但值得关注它在 Web\
  \ 开发中不断演变的角色。它也作为一种独立的虚拟机而变得流行；例如，受 [WebAssembly System Interface](https://github.com/WebAssembly/WASI)\
  \ 支持。\n\n### 48.3 示例：基于工具的 JavaScript 工作流\n\n![](img/file36.svg)\n\n图 27：一个经典的、非常简单的\
  \ Web 应用：一个 HTML 文件引用一个 JavaScript 文件 `code.js`，后者赋予前者交互性。`code.js` 使用库 `library.js`，该库也必须由\
  \ HTML 文件加载。\n\n图 27 描绘了一个经典的 Web 应用——当时 Web 开发尚未那么复杂（无论利有弊）：\n\n*   `index.html`\
  \ 包含了包含在 Web 浏览器中打开的 HTML 文件。\n\n*   `code.js` 包含了由 `index.html` 加载并使用的 JavaScript\
  \ 代码。\n\n*   该代码依赖于库 `library.js`，这是一个手动下载并放在 `code.js` 旁的文件。它通过全局变量访问。注意，HTML 文件需要为\
  \ `code.js` 加载依赖 `library.js`。`code.js` 无法自己做到。\n\n从那时起，JavaScript 工作流变得更加复杂。图 28\
  \ 显示了这样的工作流——一个基于 JavaScript 打包器 `webpack` 的流。\n\n![](img/file37.svg)\n\n图 28：这是使用打包器\
  \ `webpack` 开发 Web 应用时的工作流。我们的 Web 应用由多个模块组成。我们告诉 `webpack` 从哪一个开始执行（所谓的*入口点*）。然后它分析入口点的导入、导入的导入等，以确定运行应用需要哪些代码。所有这些代码都被放在一个单一脚本文件中。\n\
  \n让我们检查一下涉及此工作流的组件（数据、工具、技术）：\n\n*   应用本身由多个用 `TypeScript` 编写的模块组成——`TypeScript`\
  \ 是 JavaScript 的静态类型超集。每个文件都是一个 ECMAScript 模块，加上静态类型注解。\n\n*   应用使用的库现在通过 npm 包管理器\
  \ 下载并安装。它还透明地处理*间接依赖*——如果此包依赖于其他包，等等。\n\n*   所有的 `TypeScript` 文件都通过 `loader`（`webpack`\
  \ 的插件）编译为纯 JS。\n\n*   工具 `webpack` 将所有纯 JavaScript 文件合并成一个 JavaScript 脚本文件。这个过程被称为*打包*（bundling）。进行打包有两个原因：\n\
  \n*   在 Web 浏览器中，下载单个文件通常更快。\n\n*   在打包过程中，你可以执行各种优化，例如忽略掉未使用的代码。\n\n基本结构仍然相同：HTML\
  \ 文件通过 `<script>` 元素加载 JavaScript 脚本文件。但是：\n\n*   代码现在是模块化的，而无需 HTML 文件感知这些模块的存在。\n\
  \n*   `bundle.js` 只包含运行应用所需的代码（相对于 `library.js` 的全部内容）。\n\n*   我们使用包管理器来安装代码依赖的库。\n\
  \n*   库不再通过全局变量访问，而是通过 ES 模块规范符访问。\n\n在现代浏览器中，你还可以将包作为模块交付（而不是脚本文件）。\n\n\n\n\n\n\
  ## 代码压缩工具 (Minifiers)\n\n压缩工具将 JavaScript 编译为等效且更小（即字符更少）的 JavaScript。它通过重命名变量、移除注释、删除空白等等。\n\
  \n例如，给定以下输入：\n\n```javascript\nlet numberOfOccurrences = 5;\nif (Math.random())\
  \ {\n  // Math.random() is not zero\n  numberOfOccurrences++\n}\n```\n\n压缩工具可能会产生：\n\
  \n```javascript\nlet a=5;Math.random()&&a++;\n```\n\n流行的压缩工具包括：[UglifyJS](http://lisperator.net/uglifyjs/),\
  \ [babel-minify](https://github.com/babel/minify), [Terser](https://github.com/terser-js/terser)\
  \ 以及 [Closure Compiler](https://developers.google.com/closure/compiler/)。\n\n##\
  \ 打处理器 (Bundlers)\n\n编译并优化 JavaScript 应用的代码。打包器的输入是许多文件——所有的应用程序代码及其使用的库。打包器合并这些输入文件以生成更少的文件（在考虑导入的情况下，这往往能提高性能）。\n\
  \n打包器通过 `tree-shaking` 等技术最小化输出尺寸。Tree-shaking 是死代码消除的一种形式：只有在某些地方导入的导出会被放入输出中。在打包时执行转译和压缩等步骤也是常见的。所有这些工具和构建步骤通常通过称为任务运行器（类似于\
  \ Unix 中的“make”）的进行协调。它们有：\n\n- 专用任务运行器：`grunt`、`broccoli` 等。\n- 可作为简单任务运行器的工具：`npm`（通过其脚本）和\
  \ `webpack`（通过插件）。\n\n流行的打包器包括 `browserify`、`Rollup` 和 `Parcel`。\n\n## 静态检查 (Static\
  \ checking)\n\n静态检查意味着分析源代码（而不运行）。它可以用于检测各种问题。工具包括：\n\n- Linter (检查器)：检查源代码是否存在问题模式、未使用变量等。如果你正在学习这种语言，Linter\
  \ 特别有用，因为它们会指出你是否做错了什么。流行的 Linter 包括 `JSLint`、`JSHint`、`eslint`。\n- 代码风格检查：检查代码格式是否正确。考虑缩进、括号后的空格、逗号后的空格等。例如：`JSCS`（JavaScript\
  \ 样式检查器）。\n- 代码格式化器：根据你可以自定义的规则自动为你的代码格式化。例如：`Prettier`。\n- 类型检查器：为 JavaScript 添加静态检查。流行的类型检查器：`TypeScript`（它也是一个转译器）、`Flow`。\n\
  \n## 测试 (Testing)\n\nJavaScript 有许多测试框架——例如：\n\n- 单元测试：`Jasmine`、`Mocha`、`Jest`、`Karma`。\n\
  - 集成测试：`Jenkins`、`Travis CI`。\n- 用户界面测试：`CasperJS`、`Nightwatch.js`、`TestCafe`。\n\
  \n## 包管理器 (Package managers)\n\nJavaScript 最流行的包管理器是 `npm`。它最初作为 `Node.js` 的包管理器，但已成为客户端\
  \ Web 开发和各类工具的主流。`npm` 有替代方案，但它们以不同程度上基于 `npm` 的软件注册表：\n\n- `Yarn` 是对 `npm` 的不同实现；它首创的一些功能现在已被\
  \ `npm` 支持。\n- `pnpm` 专注于在本地安装包时节省空间。\n\n## 库 (Libraries)\n\n- 各类辅助函数：`lodash`（最初基于\
  \ `Underscore.js` 库）是 JavaScript 最流行的通用辅助库之一。\n- 数据结构：以下是许多库中的两个示例\n    - `Immutable.js`\
  \ 为 JavaScript 提供了不可变数据结构。\n    - `Immer` 是 `Immutable.js` 一个非常有趣的轻量级替代方案。它也不会修改所操作的数据，而是与普通对象和\
  \ `Arrays` 一工作。\n- 日期库：JavaScript 对日期的内置支持有限且充满陷阱。关于日期的章节列出了你可以使用的替代库。\n- 国际化：在此领域，ECMAScript\
  \ 标准库由 ECMAScript 国际化 API (ECMA-402) 补充。它通过全局变量 `Intl` 访问，并适用于大多数浏览器。\n- 实现和访问服务：以下是许多流行的方案：\n\
  \    - `REST`（表现状态转换）是一种流行的服务方案，基于 `HTTP(S)`。\n    - `GraphQL` 更复杂（例如，它可以合并多个数据源）并支持查询语言。\n\
