  \    ```\n\n* `Math.expm1(x: number): number` ^([ES6])\n    返回 `Math.exp(x)-1`。`Math.log1p()`\
  \ 的逆函数。极小的数字（接近 0 的分数）具有更高的精度。因此，每当 `.exp()` 返回接近 1 的值时，此函数返回更精确的值。\n\n* `Math.log(x:\
  \ number): number` ^([ES1])\n    返回 `x` 的自然对数（以 `e`，即欧数为底）。`Math.exp()` 的逆函数。\n\
