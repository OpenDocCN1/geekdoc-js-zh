  \n* `Math.SQRT1_2: number` ^([ES1])\n    1/2 的平方根，约等于 0.7071067811865476。\n\n* `Math.SQRT2:\
  \ number` ^([ES1])\n    2 的平方根，约等于 1.4142135623730951。\n\n## 19.2 指数、根号、对数\n\n*\
  \ `Math.cbrt(x: number): number` ^([ES6])\n    返回 `x` 的立方根。\n    ```\n    > Math.cbrt(8)\n\
