  \ bigints?\n    *   20.9.2 为什么不像处理 bigints 那样增加数字的精度？\n\n* * *\n\n在本章中，我们将介绍 bigints，它们是随需增长的*整数*。\n\
  \n20.1 为什么使用 bigints?\n\n在 ECMAScript 2020 之前，JavaScript 的 `number` 类型使用 IEEE 754\
  \ 双精度浮点数表示。这意味着它能够安全表示的整数范围是 $-2^{53}$ 到 $2^{53}-1$。超出此范围的整数表示可能会丢失精度。bigints 的引入为了解决这个问题，允许表示任意精度的整数。\n\
  \n20.2 Bigints\n\n`bigint` 是一种新的原始类型，用于表示任意精度的整数。你可以通过在整数末尾添加 `n` 或使用 `BigInt()`\
  \ 函数来创建它：\n\n```javascript\nlet a = 10n;\nlet b = BigInt(100);\n```\n\n`typeof`\
  \ 操作对 bigints 会返回 `'bigint'`，例如：\n\n```javascript\ntypeof 10n // 'bigint'\ntypeof\
  \ BigInt(100); // 'bigint'\n```\n\nBigints 能够与整数进行运算，例如：\n\n```javascript\n10n +\
  \ 2n // 12n\n10n * 2n // 20n\n10n / 2n // 5n\n```\n\n但是，bigints 不能与数字类型混合运算，例如：\n\
  \n```javascript\n10n + 2 // TypeError: Cannot mix bigint and other types\n```\n\n\
  20.2.1 整数突破 53 位限制\n\n由于 `number` 类型使用双精度浮点数，其能够表示的安全整数范围是 $-2^{53}$ 到 $2^{53}-1$。这个范围可以通过\
  \ `Number` 的常量获取：\n\n```javascript\nNumber.MAX_SAFE_INTEGER // 9007199254740991\n\
  Number.MIN_SAFE_INTEGER // -9007199254740991\n```\n\n超出此范围的整数在表示可能会丢失精度。例如：\n\n\
  ```javascript\n9007199254740991 + 1 // 9007199254740992\n9007199254740991 + 2 //\
  \ 9007199254740992 (结果不准确)\n```\n\nbigints 解决了这个问题，它们可以表示任意精度的整数：\n\n```javascript\n\
  9007199254740991n + 1n // 9007199254740992n\n9007199254740991n + 2n // 9007199254740993n\n\
  ```\n\n20.2.2 示例：使用 bigints\n\n这是一个使用 bigints 计算质质数的函数示例：\n\n```javascript\n/**\n\
  \ 接收一个 bigint 参数并返回 bigint\n */\nfunction nthPrime(nth) {\n  if (typeof nth !==\
  \ 'bigint') {\n    throw new TypeError();\n  }\n  function isPrime(p) {\n    for\
  \ (let i = 2n; i < p; i++) {\n      if (p % i === 0n) return false;\n    }\n   \
  \ return true;\n  }\n  for (let i = 2n; ; i++) {\n    if (isPrime(i)) {\n      if\
  \ (--nth === 0n) return i;\n    }\n  }\n}\nassert.deepEqual(\n  [1n, 2n, 3n, 4n,\
  \ 5n].map(nth => nthPrime(nth)),\n  [2n, 3n, 5n, 7n, 11n]\n);\n```\n\n20.3 Bigint\
  \ 字面量\n\n和数字字面量一样，bigint 字面量支持多种进制：\n\n*   十进制：`123n`\n*   十六进制：`0xFFn`\n*   二进制：`0b1101n`\n\
  *   八进制：`0o777n`\n\n负 bigint 通过前一元减运算符产生：\n\n20.4 为 bigints 重用数字运算符（重载）\n\nbigints\
  \ 支持大多数与数字类型相同的运算符。\n\n20.4.1 算术运算符\n\nbigints 支持以下算术运算符：\n\n```javascript\n10n\
  \ + 2n // 12n\n10n - 2n // 8n\n10n * 2n // 20n\n10n / 2n // 5n\n```\n\n注意：bigint\
  \ 除法会执行整数除法（截断取整）。\n\n20.4.2 比较运算符\n\nbigints 支持所有比较运算符：\n\n```javascript\n10n >\
  \ 2n // true\n10n < 2n // false\n10n >= 2n // true\n```\n\n20.4.3 位运算运算符\n\nbigints\
  \ 支持位运算运算符：\n\n```javascript\n10n & 2n // 2n\n10n | 2n // 10n\n10n ^ 2n // 8\n```\n\
  \n20.4.4 松相等 (`==`) 和不等于 (`!=`)\n\nbigints 与数字进行松相等比较始终返回 `false`：\n\n```javascript\n\
  10n == 10 // false\n10n != 10 // true\n```\n\n20.4.5 严格相等 (`===`) 和不等于 (`!==`)\n\
  \nbigints 与数字进行严格相等比较始终返回 `false`：\n\n```javascript\n10n === 10 // false\n10n !==\
  \ 10 // true\n```\n\n20.5 包装构造函数 `BigInt`\n\n`BigInt` 可以作为构造函数也可以作为函数使用。\n\n20.5.1\
  \ 作为构造函数和函数的 `BigInt`\n\n作为构造函数使用时，它返回一个新的 `BigInt` 对象：\n\n```javascript\nnew BigInt(10);\
  \ // 10n\n```\n\n作为函数使用时，它返回一个 `bigint` Primitive 值：\n\n```javascript\nBigInt(10);\
  \ // 10n\n```\n\n20.5.2 `BigInt.prototype.*` 方法\n\n`BigInt.prototype` 目前没有任何方法。\n\
  \n20.5.3 `BigInt.*` 方法\n\n`BigInt` 提供了一些静态方法：\n\n*   `BigInt.asIntN(bits, value)`\n\
  *   `BigInt.asUintN(bits, value)`\n*   `BigInt.from(value)`\n\n20.5.4 类型转换与 64 位整数\n\
  \n你可以将 bigint 转换为字符串或数字：\n\n```javascript\nString(10n); // \"10\"\nNumber(10n);\
  \ // 10\n```\n\n如果 bigint 超过了数字类型的安全整数范围，`Number()` 会导致精度丢失。\n\n20.6 将 bigints 转换为其他原始类型\n\
  \n你可以将 bigint 转换为布尔值或字符串：\n\n```javascript\nBoolean(10n); // true\nBoolean(0n);\
  \ // false\nString(10n); // \"10\"\n```\n\n20.7 针对 64 位值的 TypedArrays 和 DataView\
  \ 操作\n\nJavaScript 提供了 `BigInt64Array` 和 `BigUint64Array` 来处理 64 位整数：\n\n```javascript\n\
  let arr = new BigInt64Array([1n, 2n, 3n]);\n```\n\n20.8 Bigints 和 JSON\n\nbigints\
  \ 不能直接被 `JSON.stringify` 序列化。\n\n20.8.1 bigints 字符串化\n\n`JSON.stringify({ a: 10n\
  \ })` 会抛出 `TypeError`。为了解决这个问题，你需要手动将 bigint 转换为字符串：\n\n```javascript\nJSON.stringify({\
  \ a: 10n.toString() }); // '{\"a\":\"10\"}'\n```\n\n20.8.2 解析 bigints\n\n在解析 JSON\
  \ 时，你需要手动将字符串转回 bigint：\n\n```javascript\nJSON.parse('{\"a\":\"10\"}', (key, value)\
  \ => BigInt(value)); // 10n\n```\n\n20.9 常见：Bigints\n\n20.9.1 如何决定何时使用数字，何时使用 bigints?\n\
  \n如果你需要处理超过 $2^{53}-1$ 的整数，请使用 `bigint`。如果你需要浮点数运算，请继续使用 `number`。\n\n20.9.2 为什么不像处理\
  \ bigints 那样增加数字的精度？\n\n`number` 类型是为 IEEE 754 浮点数设计的，增加精度会改变其底层实现和性能。\n\n\n\n\n\
  \n```javascript\n[](#cb345-1)const priceInCents = 123_000_00; // 123 万美元\n```\n\n\
  与数字字面量一样，有两个限制条件适用：\n\n-   我们只能在两个数字之间放置下划线。\n-   我们连续最多只能使用一个下划线。\n\n## 20.4 为\
  \ bigints 重用数字运算符（重载）\n\n对于大多数运算符，我们是不允许混合使用 `bigints` 和 `numbers` 的。如果这样做，则会抛出异常：\n\
  \n```\n> 2n + 1\nTypeError: Cannot mix BigInt and other types, use explicit conversions\n\
  ```\n\n此该规则的原因是，没有通用的方法可以将 `number` 和 `bigint` 转换为共同类型：`numbers` 无法表示超过 53 位的 `bigints`，而\
  \ `bigints` 无法表示分数。因此，异常会警告我们可能存在可能导致意外结果的拼写错误。\n\n例如，以下表达式的结果应该是 `9007199254740993n`\
  \ 还是 `9007199254740992`？\n\n```\n[](#cb347-1)2**53 + 1n\n```\n\n同样，也不清楚以下表达式的结果应该是什么：\n\
  \n```\n[](#cb348-1)2n**53n * 3.3\n```\n\n### 20.4.1 算术运算符\n\n二进制 `+`、二进制 `-`、`*`、`**`\
  \ 的工作符合预期：\n\n```\n> 7n * 3n\n21n\n```\n\n混合 `bigints` 和 `strings` 是允许的：\n\n```\n\
  > 6n + ' apples'\n'6 apples'\n```\n\n`/`、`%` 向零取整（类似于 `Math.trunc()`）：\n\n```\n\
  > 1n / 2n\n0n\n```\n\n一元 `-` 的工作符合预期：\n\n```\n> -(-64n)\n64n\n```\n\n`bigints` 不支持一元\
  \ `+`，因为许多代码依赖于它将操作数强制转换为 `number`：\n\n```\n> +23n\nTypeError: Cannot convert a\
  \ BigInt value to a number\n```\n\n### 20.4.2 排序运算符\n\n排序运算符 `<`, `>`, `>=`, `<=`\
  \ 的工作符合预期：\n\n```\n> 17n <= 17n\ntrue\n> 3n > -1n\ntrue\n```\n\n比较 `bigints` 和 `numbers`\
  \ 不存在任何风险。因此，我们可以混合使用 `bigints` 和 `numbers`：\n\n```\n> 3n > -1\ntrue\n```\n\n###\
  \ 20.4.3 位运算符\n\n#### 20.4.3.1 数字的位运算符\n\n位运算符将 `numbers` 解释为 32 位整数。这些整数要么是无符号的要么是有符号的。如果是有符号的，整数的负值是其`补码`（将一个整数与其补码相加——在忽略溢出的情况下会产生零）：\n\
  \n```\n> 2**32-1 >> 0\n-1\n```\n\n由于这些整数具有固定的大小，它们的最高位表示符号：\n\n```\n> 2**31 >> 0\
  \ // 最高位为 1\n-2147483648\n> 2**31 - 1 >> 0 // 最高位为 0\n2147483647\n```\n\n#### 20.4.3.2 bigints\
  \ 的位运算符\n\n对于 `bigints`，位运算符将负号解释为无限补码——例如：\n\n-   `-1` 是 `···111111`（1 向左无限延伸）\n\
  -   `-2` 是 `···111110`\n-   `-3` 是 `···111101`\n-   `-4` 是 `···111100`\n\n也就是说，负号更多像是一个外部标志，而不是表示为实际的位。\n\
  \n#### 20.4.3.3 位取反 (`~`)\n\n\n\n位取反 (`~`) 会反转所有位：\n\n```\n> ~0b10n\n-3n\n> ~0n\n\
  -1n\n> ~-2n\n1n\n```\n\n#### 20.4.3.4 二进制位运算符 (`&`, `|`, `^`)\n\n将二进制位运算符应用于 `bigints`\
  \ 的工作方式与应用于 `numbers` 类似：\n\n```\n> (0b1010n |  0b0111n).toString(2)\n'1111'\n>\
  \ (0b1010n &  0b0111n).toString(2)\n'10'\n\n> (0b1010n | -1n).toString(2)\n'-1'\n\
  > (0b1010n & -1n).toString(2)\n'1010'\n```\n\n#### 20.4.3.5 有符号位移运算符 (`<<` 和 `>>`)\n\
  \n`bigints` 的有符号位移运算符保留数字的符号：\n\n```\n> 2n << 1n\n4n\n> -2n << 1n\n-4n\n\n> 2n >>\
  \ 1n\n1n\n> -2n >> 1n\n-1n\n```\n\n#### 20.4.3.6 无符号右移运算符 (`>>>`)\n\n`bigints` 没有无符号右移运算符：\n\
  \n```\n> 2n >>> 1\nTypeError: BigInt does not support unsigned right shift\n```\n\
  \n\n\n\n\n* (1) `bigints` 不支持一元 `+` 运算符，因为许多代码依赖于它将操作数转换为数字。\n\n## 20.7 针对 64 位值的\
  \ TypedArrays 和 DataView 操作\n\n得益于 `bigints`，`Typed Arrays`（类型数组）和 `DataViews` 现在可以支持\
  \ 64 位值：\n\n* Typed Array 构造函数：\n    * `BigInt64Array`\n    * `BigUint64Array`\n\
  * DataView 方法：\n    * `DataView.prototype.getBigInt64()`\n    * `DataView.prototype.setBigInt64()`\n\
  \    * `DataView.prototype.getBigUint64()`\n    * `DataView.prototype.setBigUint64()`\n\
  \n## 20.8 Bigints 与 JSON\n\nJSON 标准是固定的，不会改变。优点是旧的 JSON 解析代码永远不会过时。缺点是 JSON 无法扩展以包含\
  \ `bigints`。\n\n将 `bigints` 序列化为字符串会抛出异常：\n\n```\n> JSON.stringify(123n)\nTypeError:\
  \ Do not know how to serialize a BigInt\n> JSON.stringify([123n])\nTypeError: Do\
  \ not know how to serialize a BigInt\n```\n\n### 20.8.1 序列化 bigints\n\n因此，我们最好的选择是将\
  \ `bigints` 存储在字符串中：\n\n```\nconst bigintPrefix = '[[bigint]]';\n\nfunction bigintReplacer(_key,\
  \ value) {\n  if (typeof value === 'bigint') {\n    return bigintPrefix + value;\n\
  \  }\n  return value;\n}\n\nconst data = { value: 9007199254740993n };\nassert.equal(\n\
  \  JSON.stringify(data, bigintReplacer),\n  '{\"value\":\"[[bigint]]9007199254740993\"\
  }'\n);\n```\n\n### 20.8.2 解析 bigints\n\n以下代码展示了如何解析类似上一个示例中产生的字符串。\n\n```\nfunction\
  \ bigintReviver(_key, value) {\n  if (typeof value === 'string' && value.startsWith(bigintPrefix))\
  \ {\n    return BigInt(value.slice(bigintPrefix.length));\n  }\n  return value;\n\
  }\n\nconst str = '{\"value\":\"[[bigint]]9007199254740993\"}';\nassert.deepEqual(\n\
  \  JSON.parse(str, bigintReviver),\n  { value: 9007199254740993n }\n);\n```\n\n\
  ## 20.9 常见问题：Bigints\n\n### 20.9.1 如何决定何时使用 numbers，何时使用 bigints？\n\n我的建议是：\n\n\
  * 使用 `numbers` 处理最多 53 位位的值以及 `Array` 索引。理由：它们已经无处不在，并且被大多数引擎高效处理（特别是当它们能放入 31 位时）。应用场景包括：\n\
  \    * `Array.prototype.forEach()`\n    * `Array.prototype.entries()`\n* 使用 `bigints`\
  \ 处理大数值：如果你的无小数数值无法放入 53 位，你别无选择迁移到 `bigints`。\n\n所有现有的 Web API 仅返回和接受 `numbers`，并且将根据具体情况升级到\
  \ `bigint`。\n\n### 20.9.2 为什么不直接像处理 bigint 那样增加 numbers 的精度？\n\n理论上可以将 `number`\
  \ 分为 `integer`（整数）和 `double`（双精度浮点），但这会给语言增加许多新的复杂性（多个仅限整数运算符等）。我在[一个 Gist](https://gist.github.com/rauschma/13d48d1c49615ce2396ce7c9e45d4cd1)\
  \ 中概述了后果。\n\n***\n\n**致谢:**\n\n* 感谢 Daniel Ehrenberg 审阅此内容的早期版本。\n* 感谢 Dan Callahan\
  \ 审阅此内容的早期版本。\n\n# 21 Unicode – 简要介绍（高级）\n\n***\n\n* 21.1 代码点 (Code points) 与代码单元\
  \ (code units)\n    * 21.1.1 代码点\n    * 21.1.2 编码 Unicode 代码点：UTF-32, UTF-16, UTF-8\n\
  * 21.2 Web 开发中使用的编码：UTF-16 和 UTF-8\n    * 21.2.1 源代码内部：UTF-16\n    * 21.2.2 字符串：UTF-16\n\
  \    * 21.2.3 文件中的源码：UTF-8\n* 21.3 字形簇 (Grapheme clusters) – 真正的字符\n\n***\n\nUnicode\
  \ 是世界上大多数文字系统中用于表示和管理文本的标准。几乎所有处理文本的现代软件都支持 Unicode。该标准由 Unicode 协会维护。标准每年发布一个新版本（包含新的\
  \ emoji 等）。Unicode 1.0.0 版本于 1991 年 10 月发布。\n\n## 21.1 代码点与代码单元\n\n理解 Unicode 有两个概念至关重要：\n\
  \n* `Code points`（代码点）代表 Unicode 字符的数字。\n* `Code units`（代码单元）是编码 `code points` 的数字，用于存储或传输\
  \ Unicode 文本。一个或多个 `code units` 编码单个 `code point`。每个 `code unit` 的大小相同，这取决于所使用的\
  \ `encoding format`（编码格式）。\n\n### 21.1.1 代码点\n\nUnicode 的第一个版本使用了 16 位的 `code points`。自那以后，字符数量增加了，`code\
  \ points` 被划分为：\n\n* 平面 0：**基础语言平面 (BMP)**，`0x0000–xFFFF`\n    * 包含了现代语言。\n* 平面\
  \ 1：补充语言平面 (SMP)，`0x10000–1FFFF`\n    * 支持 emoji。\n* 平面 2：补充字形平面 (SIP)，`0x20000–3FFFF`\n\
  \    * 包含中日韩语。\n* 平面 3–13：未分配\n* 平面 14：特殊平面 (SSP)，`0xE0000–0FFFF`\n    * 包含标签。\n\
  * 平面 15–16：私用区域 (PUA A/B)，`0xF0000–0FFFF`\n    * 由 Unicode 协会之外分配。\n\n`code units`\
  \ 16 位被称为** astral 平面**。让我们查看几个 `code points`：\n\n```\n> 'A'.codePointAt(0).toString(16)\n\
  '41'\n> 'ü'.codePointAt(0).toString(16)\n'fc'\n> 'π'.codePointAt(0).toString(16)\n\
  '3c0'\n> '\U0001F642'.codePointAt(0).toString(16)\n'1f642'\n```\n\n`code points`\
  \ 的十六进制数字告诉我们前三个位于平面 0，而 emoji 位于平面 1。\n\n### 21.1.2 编码 Unicode 代码点：UTF-32, UTF-16,\
  \ UTF-8\n\n编码 `code points` 的主要方式有三种转换格式（UTFs）：`UTF-32`、`UTF-16` `UTF-8`。每个格式结尾的数字表示其\
  \ `code units` 的大小（位）。\n\n#### 21.1.2.1 UTF-32 (Unicode 格式 32)\n\n`UTF-32` 使用 32\
  \ 位存储 `code units`，导致每个 `code point` 对应一个 `code unit`。这种格式是唯一的*固定长度编码*；所有其他格式都使用不同数量的\
  \ `code units` 来编码单个 `code point`。\n\n#### 21.1.2.2 UTF-16 (Unicode 格式 16)\n\n`UTF-16`\
  \ 使用 16 位的 `code units`。它按如下编码 `code points`：\n\n* BMP（Unicode 的前 16 位）存储在单个 `code\
  \ units` 中。\n* astral 平面：BMP 包含 0x10_000 `code points`。由于 Unicode 总共有 0x110_000\
  \ `code points`，我们还需要编码剩余的 0x100_000 `code points`（20 位）。BMP 有两个未分配的 `code points`\
  \ 范围提供了必要的存储：\n    * 高位 10 位（前导代理*）：`0xD800-0xDBFF`\n    * 低位 10 位（尾随代理*）：`0xDC00-0xDFFF`\n\
  \n换句话说，两个十六进制数字贡献了 8 位。但只有当 BMP 以以下数字对开头时，我们才能使用这 8 位：\n\n* D8, D9, DA, DB\n* DC,\
  \ DD, DE, DF\n\n\n\n\n\n对于每个代理（surrogate），我们有 4 个对供选择，这就是剩余 2 个位数的来源。\n\n因此，每个 `UTF-16`\
  \ 编码单元始终是高位代理（leading surrogate）、低位代理（trailing surrogate），或者编码一个 BMP 代码点。\n\n以下是两个\
  \ UTF-16 编码代码点的示例：\n\n* 代码点 `0x03C0` (`π`) 位于 BMP 中，因此可以用一个的 `UTF-16` 编码单元表示：`0x03C0`。\n\
  * 代码点 `0x1F642` (`\U0001F642`) 位于星际平面（astral plane），由两个编码单元表示：`0xD83D` 和 `0xDE42`。\n\
  \n## 21.1.2.3 UTF-8 (Unicode 转换格式 8-bit)\n\nUTF-8 使用 8 位编码单元。它使用 1–4 个编码单元来编码一个代码点：\n\
  \n| 代码点 | 编码单元 |\n| --- | --- |\n| 0000–007F | `0bbbbbbb` (7 bits) |\n| 0080–07FF\
  \ | `110bbbbb, 10bbbbbb` (5+6 bits) |\n| 0800–FFFF | `1110bbbb, 10bbbbbb, 10bbbbbb`\
  \ (4+6+6 bits) |\n| 10000–1FFFFF | `11110bbb, 10bbbbbb, 10bbbbbb, 10bbbbbb` (3+6+6+6\
  \ bits) |\n\n注意：\n\n* 每个编码单元的位前缀告诉我们：\n    * 它是编码单元序列中的第一个吗？如果是，后面将有多少个编码单元？\n \
  \   * 它是编码单元序列中的第二个或后续吗？\n* `0000–007F` 范围内的字符映射与 ASCII 相同，这使得它与旧软件具有一定程度的向后兼容性。\n\
  \n三个示例：\n\n| 字符 | 代码点 | 编码单元 |\n| --- | --- | --- |\n| A | `0x0041` | `01000001`\
  \ |\n| π | `0x03C0` | `11001111, 10000000` |\n| \U0001F642 | `0x1F642` | `11110000,\
  \ 10011111, 10011001, 10000010` |\n\n## 21.2 Web 开发中使用的编码：UTF-16 和 UTF-8\n\nWeb\
  \ 开发中使用的 Unicode 编码格式是：`UTF-16` 和 `UTF-8`。\n\n### 21.2.1 源代码内部：UTF-16\n\nECMAScript\
  \ 规范在内部将源代码表示为 `UTF-16`。\n\n### 21.2.2 字符串：UTF-16\n\nJavaScript 字符串中的字符基于 `UTF-16`\
  \ 编码单元：\n\n```\n> const smiley = '\U0001F642';\n> smiley.length\n2\n> smiley ===\
  \ '\\uD83D\\uDE42' // code units\ntrue\n```\n\n有关 Unicode 和字符串的更多信息，请参阅 §22.6 “文本原子：Unicode\
  \ 字符、JavaScript 字符、字形簇”。\n\n### 21.2.3 文件中的源代码：UTF-8\n\n现在 HTML 和 JavaScript 几乎总是编码为\
  \ `UTF-8`。\n\n例如，现在 HTML 文件通常这样开始的：\n\n```\n[](#cb377-1)<!doctype html>\n[](#cb377-2)<html>\n\
  [](#cb377-3)<head>\n[](#cb377-4)  <meta charset=\"UTF-8\">\n[](#cb377-5)···\n```\n\
  \n对于在 浏览器中加载的 HTML 模块，[标准编码](https://html.spec.whatwg.org/multipage/webappapis.html#fetch-a-single-module-script)也是\
  \ `UTF-8`。\n\n## 21.3 字形簇（Grapheme clusters）—— 真正的字符\n\n一旦考虑到世界上许多文字系统，“字符”的概念就会变得异常复杂。\n\
  \n一方面，有由代码点表示的 Unicode 字符。\n\n另一方面，有字形簇（grapheme clusters）。字形簇与屏幕或纸张上显示的符号最为对应。它被定义为“一个水平可分割的文本单元”。因此，[Unicode\
  \ 文文档](https://unicode.org/reports/tr29/#Grapheme_Cluster_Boundaries) 也称其为“用户感知字符”。编码一个字形簇需要一个或多个代码点字符。\n\
  \n例如，天那加语的 *kshi* 是由 4 个代码点编码的。我们使用扩展运算符（`...`）将字符串拆分为一个包含代码点字符的 `Array`（详细信息，请参阅\
  \ §22.6.1 “处理代码点”）：\n\n> ![将天纳加语 kshi 的字形簇拆分为代码点字符。](img/file14.png)\n\n旗帜 Emoji\
  \ 也是字形簇，由两个代码点字符组成——例如，日本旗：\n\n> ![将旗帜 Emoji 拆分为代码点字符。](img/file15.png)\n\n![](img/file1.svg)\
  \ **关于字形簇的更多信息**\n\n有关更多信息，请参阅 Manish Goregaokar 写的[停止给代码点赋予意义”](https://manishearth.github.io/blog/2017/01/14/stop-ascribing-meaning-to-unicode-code-points/)。\n\
  \n![](img/file7.svg) **测验**\n\n查看测验应用。\n\n# 22 字符串\n\n* *\n\n* 22.1 普通字符串字面量\n \
  \   * 22.1.1 转义\n    * 22.2 访问字符和代码点\n    * 22.2.1 访问 JavaScript 字符\n    * 22.2.2\
  \ 通过 `for-of` 和扩展运算符访问 Unicode 代码点字符\n    * 22.3 通过 `+` 拼接字符串\n    * 22.4 转换为字符串\n\
  \    * 22.4.1 字符串对象\n    * 22.4.2 自定义对象\n    * 22.4.3 另一种值的方式\n    * 22.5 比较字符串\n\
  \    * 22.6 文本原子：Unicode 字符、JavaScript 字符、字形簇\n    * 22.6.1 处理代码点\n    * 22.6.2\
  \ 处理单元\n    * 22.6.3 ASCII\n    * 22.6.4 字形簇\n    * 22.6.5 快速引用\n    * 22.6.6 数值值\n\
  \    * 22.6.7 运算符\n    * 22.6.8 查找与匹配\n    * 22.6.9 提取\n    * 22.6.10 组合\n    *\
  \ 22.6.11 转换\n    * 22.6.12 来源\n\n## 22.1 普通字符串字面量\n\n字符串是 JavaScript 中的原始值且是不可变的。这意味着，字符串相关的操作总是产生新字符串，而不会改变现有的字符串。\n\
  \n普通字符串字面量由单引号或双引号分隔：\n\n```\n[](#cb378-1)const str1 = 'abc';\n[](#cb378-2)const\
  \ str2 = \"abc\";\n[](#cb378-3)assert.equal(str1, str2);\n```\n\n单引号使用得更多，因为它更容易提到\
  \ HTML（HTML 倾向于使用双引号）。\n\n下一章](#ch24.xhtml_template-literals）将介绍*模板字符串*，它们提供了：\n\
  \n* 字符串插值\n* 多行\n* 原始字符串字面量（反斜杠无特殊含义）\n\n### 22.1.1 转义\n\n反斜杠允许我们创建特殊字符：\n\n* Unix\
  \ 换行：`'\\n'`\n* Windows 换行：`'\\r\\n'`\n* 制表符：`'\\t'`\n* 反斜杠：` `'\\\\'`\n\n反斜杠还允许我们在字符串字面量内部使用该字面量的分隔符：\n\
  \n```\n[](#cb379-1)assert.equal(\n[](#cb379-2)  'She said: \"Let\\'s go!\"',\n[](#cb379-3)\
  \  \"She said: \\\"Let's go!\");\n```\n\n\n\n\n通过 `for-of` 或扩展运算符（`...`）遍历字符串访问的是\
  \ Unicode 码点（code point）字符。每个码点字符由 1–2 个 JavaScript 字符编码。更多信息，请参阅 §22.6 “文本原子：Unicode\
  \ 字符、JavaScript 字符、字素簇”。\n\n以下是我们如何通过 `for-of` 遍历字符串的码点字符：\n\n```javascript\nfor\
  \ (const ch of 'x\U0001F642y') {\n  console.log(ch);\n}\n// 输出:\n// 'x'\n// '\U0001F642\
  '\n// 'y'\n```\n\n以下是我们如何通过扩展运算符将字符串转换为码点字符的 `Array`：\n\n```javascript\nassert.deepEqual([...'x\U0001F642\
  y'], ['x', '\U0001F642', 'y']);\n```\n\n## 22.3 通过 `+` 进行字符串拼接\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```javascript\nassert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果我们需要逐部分组装字符串，赋值运算符\
  \ `+=` 非常好用：\n\n```javascript\nlet str = ''; // 必须是 `let`！\nstr += 'Say it';\nstr\
  \ += ' one more';\nstr += ' time';\n\nassert.equal(str, 'Say it one more time');\n\
  ```\n\n![](img/file5.svg) 通过 `+` 拼接是高效的\n\n使用 `+` 组装字符串非常高效，因为大多数 JavaScript 引擎在内部对其进行了优化。\n\
  \n![](img/file6.svg) 练习：拼接字符串\n\n`exercises/strings/concat_string_array_test.mjs`\n\
  \n## 22.4 转换为字符串\n\n将值 `x` 转换为字符串有三种方法：\n\n* `String(x)`\n* `''+x`\n* `x.toString()`（对\
  \ `undefined` 和 `null` 不起）\n\n建议：使用具有描述性且安全的 `String()`。\n\n示例：\n\n```javascript\n\
  assert.equal(String(undefined), 'undefined');\nassert.equal(String(null), 'null');\n\
  assert.equal(String(false), 'false');\nassert.equal(String(true), 'true');\nassert.equal(String(123.45),\
  \ '123.45');\n```\n\n布尔值的陷阱：如果我们通过 `String()` 将布尔值转换为字符串，通常无法通过 `Boolean()` 将其转回：\n\
  \n```javascript\n> String(false)\n'false'\n> Boolean('false')\ntrue\n```\n\n只有空字符串会让\
  \ `Boolean()` 返回 `false`。\n\n### 22.4.1 对象的字符串化\n\n普通对象有一个默认的字符串表示，并不有用：\n\n```javascript\n\
  > String({a: 1})\n'[object Object]'\n```\n\n数组有更好的字符串表示，但它仍然隐藏了大量信息：\n\n```javascript\n\
  > String(['a', 'b'])\n'a,b'\n> String(['a', ['b']])\n'a,b'\n\n> String([1, 2])\n\
  '1,2'\n> String(['1', '2'])\n'1,2'\n\n> String([true])\n'true'\n> String(['true'])\n\
  'true'\n> String(true)\n'true'\n```\n\n字符串化函数会返回其源代码：\n\n```javascript\n> String(function\
  \ f() {return 4})\n'function f() {return 4}'\n```\n\n### 22.4.2 自定义对象的字符串化\n\n我们可以通过实现\
  \ `toString()` 方法来覆盖内置的对象字符串化方式：\n\n```javascript\nconst obj = {\n  toString() {\n\
  \    return 'hello';\n  }\n};\n\nassert.equal(String(obj), 'hello');\n```\n\n###\
  \ 22.4.3 值的字符串化的另一种方法\n\nJSON 数据格式是 JavaScript 值的文本表示。因此，`JSON.stringify()`(#ch048.xhtml_JSON.stringify)\
  \ 也可以用于将值转换为字符串：\n\n```javascript\n> JSON.stringify({a: 1})\n'{\"a\":1}'\n> JSON.stringify(['a',\
  \ ['b']])\n'[\"a\",[\"b\"]]\n```\n\n需要是 JSON 仅支持 `null`、`booleans`、`numbers`、`strings`\
  \ 和 `Arrays`（它始终将其处理为像对象字面量创建的）。提示：第三个参数允许我们切换多行输出并指定缩进——例如：\n\n```javascript\n\
  console.log(JSON.stringify({first: 'Jane', last: 'Doe'}, null, 2));\n```\n\n此语句产生以下输出：\n\
  \n```json\n{\n  \"first\": \"Jane\",\n  \"last\": \"Doe\"\n}\n```\n\n## 22.5 比较字符串\n\
  \n可以通过以下运算符比较字符串：\n\n`< <= >=`\n\n有一个重要的注意事项需要考虑：这些运算符根据 JavaScript 字符的数值值进行比较。这意味着\
  \ JavaScript 用于字符串的顺序与字典中使用的不同：\n\n```javascript\n> 'A' < 'B' // true\n> 'a' < 'B'\
  \ // false\n> 'ä' < 'b' // false\n```\n\n正确比较文本超出了本书的范围。它通过 ECMAScript 国际化 API (`Intl`)(https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Intl）支持。\n\
  \n## 22.6 文本原子：Unicode 字符、JavaScript 字符、字素簇\n\n快速回顾 `Unicode – 简介介绍`：\n\n* Unicode\
  \ 字符由 `码点（code points）` 表示——范围为 21 位的数字。\n* 在 JavaScript 字符串中，Unicode 通过基于 UTF-16\
  \ 编码的 `码单元（code units）` 实现。每个码单元是一个 16 位的数字。编码单个码点需要一到两个码单元。\n* 因此，每个 JavaScript\
  \ 字符都由一个码单元表示。在 JavaScript 标准库中，码单元也称为 `字符代码（char codes）`。它们确实如此：JavaScript 字符的数字。\n\
  * `字素簇（Grapheme clusters）`（`用户感知字符`）是在屏幕或纸上显示的书写符号。需要一个或多个 Unicode 字符来编码单个字素簇。\n\
  \n以下代码演示了单个 Unicode 字符包含一个或两个 JavaScript 字符。我们通过 `.length` 计数后者：\n\n```javascript\n\
  assert.equal('abc'.length, 3); // 3 个 Unicode 字符，3 个 JavaScript 字符\nassert.equal('\U0001F642\
  '.length, 2); // 1 个 Unicode 字符，2 个 JavaScript 字符\n```\n\n下表总结了我们探索的概念：\n\n| 实体\
  \ | 数值表示 | 大小 | 编码方式 |\n| --- | --- | --- | --- |\n| 字素簇 | | | 1+ 码点 |\n| Unicode\
  \ 字符 | 码点 | 21 位 | 1–2 码单元 |\n| JavaScript 字符 | UTF-16 码单元 | 16 位 | |\n\n### 22.6.1\
  \ 码点工作\n\n让我们探索 JavaScript 处理码点的工具。\n\n`Unicode 码点转义（Unicode code point escape）`\
  \ 允许我们以十六进制指定码点（1–5 位）。它产生一个或两个 JavaScript 字符。\n\n```javascript\n> '\\u{1F642}'\n\
  '\U0001F642'\n```\n\nUnicode 转义序列\n\n在 ECMAScript 语言规范中，`Unicode 码点转义` 和 `Unicode\
  \ 码单元转义`（我们稍后会遇到）被称为 `Unicode 转义序列`。\n\n`String.fromCodePoint()` 将单个码点转换为 1–2 个\
  \ JavaScript 字符：\n\n```javascript\n> String.fromCodePoint(0x1F642)\n'\U0001F642\
  '\n```\n\n`.codePointAt()` 将 1–2 个 JavaScript 字符转换为单个码点：\n\n```javascript\n> '\U0001F642\
  '.codePointAt(0).toString(16)\n'1f642'\n```\n\n我们可以*迭代*字符串，访问 Unicode 字符（而不是 JavaScript\
  \ 字符）。迭代将在本书后面介绍（ch033.xhtml_ch_sync-iteration）。一种迭代方法是通过 `for-of` 循环：\n\n```javascript\n\
  const str = '\U0001F642a';\nassert.equal(str.length, 3);\n\nfor (const codePointChar\
  \ of str) {\n  console.log(codePointChar);\n}\n// 输出:\n// '\U0001F642'\n// 'a'\n\
  ```\n\n扩展（`...`）到数组字面量（ch034.xhtml-spreading-into-array-literals）也基于迭代并访问 Unicode\
  \ 字符：\n\n```javascript\n> [...'\U0001F642a']\n[ '\U0001F642', 'a' ]\n```\n\n这成为计数\
  \ Unicode 字符的良好工具：\n\n```javascript\n> [...'\U0001F642a'].length\n2\n> '\U0001F642\
  a'.length\n3\n```\n\n### 22.6.2 码单元（字符代码）工作\n\n字符串的索引和长度基于 JavaScript 字符（通过 UTF-16\
  \ 码单元表示）。\n\n要以十六进制指定码单元，我们可以使用恰好四个十六进制位的*Unicode 码单元转义（Unicode code unit escape）*。\n\
  \n\n\n\n\n```\n> '\\uD83D\\uDE42'\n'\U0001F642'\n```\n\n我们可以使用 `String.fromCharCode()`。`Char\
  \ code` 是标准库中 `code unit`（代码单元）的名称：\n\n```\n> String.fromCharCode(0xD83D) + String.fromCharCode(0xDE42)\n\
  '\U0001F642'\n```\n\n要获取字符的字符码，使用 `.charCodeAt()`：\n\n```\n> '\U0001F642'.charCodeAt(0).toString(16)\n\
  'd83d'\n```\n\n### 22.6.3 ASCII 转义\n\n如果字符的码点（code point）小于 256，我们可以通过带有恰好两个十六进制数字的\
  \ `ASCII escape` 来引用它：\n\n```\n> 'He\\x6C\\xCo'\n'Hello'\n```\n\n（ASCII 转义的正式名称是\
  \ `Hexadecimal escape sequences` [十六进制转义序列 – 它是第一个使用十六进制数的转义。）\n\n### 22.6.4 注意事项：字符簇（grapheme\
  \ clusters）\n\n在处理可能用任何人类语言编写的文本时，最好在字符簇的边界处进行分割，而不是在 Unicode 字符的边界处。\n\nTC39 正在开发\
  \ [`Intl.Segmenter`](https://github.com/tc39/proposal-intl-segmenter)，这是 ECMAScript\
  \ 国际化 API 的一项提案，用于支持 Unicode 分段（沿字符簇边界、单词边界、句子边界等）。\n\n在该提案成为标准之前，我们可以使用现有的几个库之一（请在网上搜索“JavaScript\
  \ grapheme”）。\n\n## 22.7 快速参考：字符串\n\n字符串是不可变的；没有任何字符串方法会修改其字符串本身。\n\n### 22.7.1\
  \ 转换为字符串\n\n表 [14]](#ch023.xhtml_tbl:converting-to-string) 描述了如何将各种值转换为字符串。\n\n\
  表 14：将值转换为字符串。\n\n| `x` | `String(x)` |\n| --- | --- |\n| `undefined` | `'undefined'`\
  \ |\n| `null` | `'null'` |\n| boolean | `false` `→` `'false'`, `true` `→` `'true'`\
  \ |\n| number | 示例：`123` `→` `'123'` |\n| bigint | 示例：`123n` `→` `'123'` |\n| string\
  \ | `x`（输入，保持不变） |\n| symbol | 示例：`Symbol('abc')` `→` `'Symbol(abc)'` |\n| object\
  \ | 可配置，例如通过 `toString()` |\n\n### 22.7.2 字符的数值值\n\n*   **Char code（字符码）：** 用数字表示一个\
  \ JavaScript 字符。JavaScript 中 `Unicode code unit` 的名称。\n    *   大小：16 位，无符号\n   \
  \ *   将数字转换为字符：`String.fromCharCode()` ^([ES1])\n    *   将字符转换为数字：字符串方法 `.charCodeAt()`\
  \ ^([ES1])\n*   **Code point（码点）：** 用数字表示一个 Unicode 字符。\n    *   大小：21 位，无符号（17\
  \ 个平面，每个平面 16 位）\n    *   将数字转换为字符：`String.fromCodePoint()` ^([ES6])\n    *   将字符转换为数字：字符串方法\
  \ `.codePointAt()` ^([ES6])\n\n### 22.7.3 字符串运算符\n\n```javascript\n// 通过 [] 访问字符\n\
  []\nconst str = 'abc';\nassert.equal(str[1], 'b');\n// 通过 + 拼接字符串\nassert.equal('a'\
  \ + 'b' + 'c', 'abc');\nassert.equal('take ' + 3 + ' oranges', 'take 3 oranges');\n\
  ```\n\n### 22.7.4 `String.prototype`:查找与匹配\n\n（`String.prototype` 是存储字符串方法的地方。）\n\
  \n*   `.endsWith(searchString: string, endPos=this.length): boolean` ^([ES6])\n\
  \    如果字符串的长度为 `endPos` 时以 `searchString` 结尾，则返回 `true`。否则返回 `false`。\n    ```\n\
  \    > 'foo.txt'.endsWith('.txt')\n    true\n    > 'abcde'.endsWith('cd', 4)\n \
  \   true\n    ```\n*   `.includes(searchString: string, startPos=0): boolean` ^([ES6])\n\
  \    如果字符串包含 `searchString` 则返回 `true`，否则返回 `false`。搜索从 `startPos` 开始。\n    ```\n\
  \    > 'abc'.includes('b')\n    true\n    > 'abc'.includes('b', 2)\n    false\n\
  \    ```\n*   `.indexOf(searchString: string, minIndex=0): number` ^([ES1])\n  \
  \  返回 `searchString` 在字符串中出现的最低索引，否则返回 `-1`。任何返回的索引将是 `minIndex` 或更高。\n    ```\n\
  \    > 'abab'.indexOf('a')\n    0\n    > 'abab'.indexOf('a', 1)\n    2\n    > 'abab'.indexOf('c')\n\
  \    -1\n    ```\n*   `.lastIndexOf(searchString: string, maxIndex=Infinity): number`\
  \ ^([ES1])\n    返回 `searchString` 在字符串中出现的最高索引，否则返回 `-1`。任何返回的索引将是 `maxIndex` 或更低。\n\
  \    ```\n    > 'abab'.lastIndexOf('ab', 2)\n    2\n    > 'abab'.lastIndexOf('ab',\
  \ 1)\n    0\n    > 'abab'.lastIndexOf('ab')\n    2\n    ```\n*   `.match(regExp:\
  \ string | RegExp): RegExpMatchArray | null` ^([ES3])\n    如果 `regExp` 是一个没有设置 `/g`\
  \ 标志的正则表达式，则 `.match()` 返回 `regExp` 在字符串中的第一个匹配项。如果没有匹配项，则返回 `null`。如果 `regExp`\
  \ 是字符串，则在执行上述步骤之前，它被用于创建一个正则表达式（类似于 `new RegExp()` 的参数）。\n    结果具有以下类型：\n    ```javascript\n\
  \    interface RegExpMatchArray extends Array<string> {\n      index: number;\n\
  \      input: string;\n      groups: undefined | {\n        [key: string]: string\n\
  \      };\n    }\n    ```\n    编号的捕获组变为数组的索引（这就是为什么该类型扩展了 `Array`）。命名捕获组 (#ch046.xhtml_named-capture-groups)（ES2018）变为\
  \ `.groups` 的属性。在这种模式下，`.match()` 的工作方式类似于 `RegExp.prototype.exec()`。\n    示例：\n\
  \    ```\n    > 'ababb'.match(/a(b+)/)\n    { 0: 'ab', 1: 'b', index: 0, input:\
  \ 'ababb', groups: undefined }\n    > 'ababb'.match(/a(?<foo>b+)/)\n    { 0: 'ab',\
  \ 1: 'b', index: 0, input: 'ababb', groups: { foo: 'b' } }\n    > 'abab'.match(/x/)\n\
  \    null\n    ```\n*   `.match(regExp: RegExp): string[] | null` ^([ES3])\n   \
  \ 如果 `regExp` 的 `/g` 标志被设置，`.match()` 返回一个包含匹配项的数组，或者如果没有匹配项则返回 `null`。\n    ```\n\
  \    > 'ababb'.match(/a(b+)/g)\n    [ 'ab' ]\n    > 'ababb'.match(/a(?<foo>b+)/g)\n\
  \    [ 'ab' ]\n    > 'abab'.match(/x/g)\n    null\n    ```\n*   `.search(regExp:\
  \ string | RegExp): number` ^([ES3])\n    返回 `regExp` 在字符串中出现的索引。如果 `regExp` 是字符串，则被用于创建一个正则表达式（类似于\
  \ `new RegExp()` 的参数）。\n    ```\n    > 'a2b'.search(/[0-9])\n    1\n    > 'a2b'.search('[0-9]')\n\
  \    1\n    ```\n*   `.startsWith(searchString: string, startPos=0): boolean` ^([ES6])\n\
  \    如果 `searchString` 出现在字符串的 `startPos` 位置，则返回 `true`。否则返回 `false`。\n    ```\n\
  \    > '.gitignore'.startsWith('.')\n    true\n    > 'abcde'.startsWith('bc', 1)\n\
  \    true\n    ```\n\n### 22.7.5 `String.prototype`:提取\n\n*   `.slice(start=0, end=this.length):\
  \ string` ^([ES3])\n    返回从索引 `start` 开始（包含）索引 `end` 的子字符串。如果索引为负数，则会加上 `.length`（`-1`\
  \ 变为 `this.length-1`）。\n    ```\n    > 'abc'.slice(1, 3)\n    'bc'\n    > 'abc'.slice(1)\n\
  \    'bc'\n    > 'abc'.slice(-2)\n    'bc'\n    ```\n*   `.split(separator: string\
  \ | RegExp, limit?: number): string[]` ^([ES3])\n    将字符串分割为子字符串数组——分隔符之间的字符串。分隔符可以是字符串：\n\
  \    ```\n    > 'a | b | c'.split('|')\n    [ 'a ', ' b ', ' c' ]\n    ```\n   \
  \ 也可以是正则表达式：\n    ```\n    > 'a : b : c'.split(/ *: */)\n    [ 'a', 'b', 'c' ]\n\
  \    > 'a : b : c'.split(/( *):( *)\n    [ 'a', ' ', ' ', 'b', ' ', ' ', 'c' ]\n\
  \    ```\n    最后一个调用演示了正则表达式组捕获变为返回数组的元素。\n    **警告：`.split('')` 将字符串分割为 JavaScript\
  \ 字符。** 这在处理星际 Unicode 字符（编码为两个 JavaScript 字符）时效果不好。例如表情符号是星际字符：\n    ```\n    >\
  \ '\U0001F642X\U0001F642'.split('')\n    [ '\\uD83D', '\\uDE42', 'X', '\\uD83D',\
  \ '\\uDE42' ]\n    ```\n    相反，使用扩展运算符更好：\n    ```\n    > [...'\U0001F642X\U0001F642\
  ']\n    [ '\U0001F642', 'X', '\U0001F642' ]\n    ```\n*   `.substring(start: number,\
  \ end=this.length): string` ^([ES1])\n\n\n\n\n\n使用 `.slice()` 代替此方法。`.substring()`\
  \ 在旧版引擎中的实现并不一致，且不支持负索引。\n\n### 22.7.6 `String.prototype`: 组合\n\n* `.concat(...strings:\
  \ string[]): string` ([ES3])\n\n  返回字符串与 `strings` 的拼接结果。`'a'.concat('b')` 等同于 `'a'+'b'`。后者更为流行。\n\
  \n```\n> 'ab'.concat('cd', 'ef', 'gh')\n'abcdefgh'\n```\n\n* `.padEnd(len: number,\
  \ fillString=' '): string` ([ES2017])\n\n  在字符串末尾添加 `fillString` 的（片段），直到其达到指定的长度\
  \ `len`。如果长度已经达到或超过 `len`，则直接返回，不进行任何更改。\n\n```\n> '#'.padEnd(2)\n'# '\n> 'abc'.padEnd(2)\n\
  'abc'\n> '#'.padEnd(5, 'abc')\n'#abca'\n```\n\n* `.padStart(len: number, fillString='\
  \ '): string` ([ES2017])\n\n  在字符串开头添加 `fillString` 的（片段），直到其达到指定的长度 `len`。如果长度已经达到或超过\
  \ `len`，则直接返回，不进行任何更改。\n\n```\n> '#'.padStart(2)\n' #'\n> 'abc'.padStart(2)\n'abc'\n\
  > '#'.padStart(5, 'abc')\n'abca#'\n```\n\n* `.repeat(count=0): string` ([ES6])\n\
  \n  返回拼接 `count` 次后的字符串。\n\n```\n> '*'.repeat()\n''\n> '*'.repeat(3)\n'***'\n```\n\
  \n### 22.7.7 `String.prototype`: 转换\n\n* `.normalize(form: 'NFC'|'NFD'|'NFKC'|'NFKD'\
  \ = 'NFC'): string` ([ES6])\n\n  根据 [Unicode 规范化形式](https://unicode.org/reports/tr15/)\
  \ 规范化字符串。\n\n* [1 of 2] `.replaceAll(searchValue: string | RegExp, replaceValue:\
  \ string): string` ([ES2021])\n\n  ![](img/file2.svg) 如果无法使用 `.replaceAll()` 怎么办\n\
  \n  如果你的目标平台不支持 `.replaceAll()`，可以使用 `.replace()` 代替。具体详见 [§45.5.8.1 “`str.replace(searchValue,\
  \ replacementValue)` ([ES3])](#ch046.xhtml_String.prototype.replace)”。\n\n  将所有匹配\
  \ `searchValue` 的替换为 `replaceValue`。如果 `searchValue` 是一个不带 `/g` 标志的正则表达式，则会抛出 `TypeError`。\n\
  \n```\n> 'x.x.'.replaceAll('.', '#')\n'x#x#'\n> 'x.x.'.replaceAll(/./g, '#')\n'####'\n\
  > 'x.x.'.replaceAll(/./, '#')\nTypeError: String.prototype.replaceAll called with\n\
  a non-global RegExp argument\n```\n\n  `replaceValue` 中的特殊字符有：\n\n  * `$$`: 变为 `$`\n\
  \  * `$n`: 变为编号分组 `n` 的捕获内容（遗憾的是，$0` 代表字符串 `'$0'`，它不代表整个匹配项）\n  * `$&`: 变为整个匹配项\n\
  \  * `` $` ``: 变为匹配项之前的所有\n  * `$'`: 变为匹配项之后的所有\n\n  示例：\n\n```\n> 'a 1995-12 b'.replaceAll(/([0-9]{4})-([0-9]{2})/g,\
  \ '|$2|')\n'a |12| b'\n> 'a 1995-12 b'.replaceAll(/([0-9]{4})-([0-9]{2})/g, '|$&|')\n\
  'a |1995-12| b'\n> 'a 1995-12 b'.replaceAll(/([0-9]{4})-([0-9]{2})/g, '|$`|')\n\
  'a |a | b'\n```\n\n  同样支持命名捕获组 (ES2018)：\n\n  * `$<name>`: 变为命名分组 `name` 的捕获内容\n\
  \n  示例：\n\n```\n[](#cb428-1)assert.equal(\n[](#cb428-2)  'a 1995-12 b'.replaceAll(\n\
  [](#cb428-3)    /(?<year>[0-9]{4})-(?<month>[0-9]{2})/g, '|$<month>|'),\n[](#cb428-4)\
  \  'a |12| b');\n```\n\n* [2 of 2] `.replaceAll(searchValue: string | RegExp, replacer:\
  \ (...args: any[]) => string): string` ([ES2021])\n\n  如果第二个参数是函数，则匹配项将被该函数返回的字符串替换。其参数\
  \ `args` 为：\n\n  * `matched: string`. 整个匹配项\n  * `g1: string|undefined`. 编号分组 1\
  \ 的捕获内容\n  * `g2: string|undefined`. 编号分组 2 的捕获内容\n  * （等等）\n  * `offset: number`.\
  \ 匹配项在输入字符串中的位置？\n  * `input: string`. 整个输入字符串\n\n```\n[](#cb429-1)const regexp\
  \ = /([0-9]{4})-([0-9]{2})/g;\n[](#cb429-2)const replacer = (all, year, month) =>\
  \ '|' + all + '|';\n[](#cb429-3)assert.equal(\n[](#cb429-4)  'a 1995-12 b'.replaceAll(regexp,\
  \ replacer),\n[](#cb429-5)  'a |1995-12| b');\n```\n\n  同样支持命名捕获组 (ES2018)。如果有，则会在末尾添加参数：...\n\
  \n### 22.7.8 `Sources`\n\n* [TypeScript 内置类型定义](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
  * [MDN Web Docs](https://developer.mozilla.org/en-US/docs/Web)\n* [ECMAScript 语言规范](https://tc39.github.io/ecma62/)\n\
  \n![](img/file6.svg) **练习：使用字符串方法**\n\n`exercises/strings/remove_extension_test.mjs`\n\
  \n![](img/file7.svg) **测验**\n\n参见测验应用。\n\n\n\n\n\n```markdown\n## 23.7 多行模板字量与缩进\n\
  \n### 23.7.1 修复：用于取消缩进的模板标签\n\n### 23.7.2 修复：`.trim()`\n\n## 23.8 通过模板字量进行简单的模板化\n\
  \n### 23.8.1 一个更复杂的示例\n\n### 23.8.2 简单的 HTML 转义\n\n***\n\n在我们深入研究 `template literal`（模板字量）和\
  \ `tagged template`（标签模板）这两个特性之前，让我们先检查一下 `template` 一词的多种含义。\n\n## 23.1 消除歧：“template”\n\
  \n尽管以下三者的名称中都包含 `template`，且看起来相似，但它们有显著的区别：\n\n*   `text template`（文本模板）是从数据到文本的函数。它经常用于\
  \ Web 开发，并且通常通过文本文件定义。例如，以下文本为 [Handlebars](https://handlebarsjs.com) 库定义了一个模板：\n\
  \n```html\n<div class=\"entry\"> own  <h1>{{title}}</h1>\n  <div class=\"body\"\
  >\n    {{body}}\n  </div>\n</div\n```\n\n这个模板有两个空位需要填充：`title` 和 `body`。它的用法如下：\n\
  \n```javascript\n// 第一步：获取模板文本，例如从文本文件获取。\nconst tmplFunc = Handlebars.compile(TMPL_TEXT);\
  \ // 编译字符串\nconst data = {title: 'My page', body: 'Welcome to my page!'};\nconst\
  \ html = tmplFunc(data);\n```\n\n*   `template literal`（模板字量）类似于字符串字量，但它具有额外的功能——例如插值。它由反引号分隔：\n\
  \n```javascript\nconst num = 5;\nassert.equal(`Count: ${num}!`, 'Count: 5!');\n\
  ```\n\n*   从语法上讲，`tagged template`（标签模板）是一个跟在函数（或者更准确地说，是一个求值为为函数的表达式）后面的模板字量。这会导致函数被调用。它的参数源自模板字量的内容。\n\
  \n```javascript\nconst getArgs = (...args) => args;\nassert.deepEqual(\n  getArgs`Count:\
  \ ${5}!`,\n  [['Count: ', '!'], 5] );\n```\n\n注意，`getArgs()` 同时接收字面量的文本和通过 `${}`\
  \ 插值的数据。\n\n## 23.2 模板字量\n\n与普通的字符串字量相比，模板字量有两个新特性。\n\n首先，它支持 `string interpolation`（字符串插值）：如果我们在\
  \ `${}` 内部放入一个动态计算的值，它会被转换为字符串并插入到由该字量返回返回的字符串中。\n\n```javascript\nconst MAX = 100;\n\
  function doSomeWork(x) {\n  if (x > MAX) {\n    throw new Error(`At most ${MAX}\
  \ allowed: ${x}!`);\n  }\n  // ···\n}\nassert.throws(\n  () => doSomeWork(101),\n\
  \  {message: 'At most 100 allowed: 101!'});\n```\n\n其次，模板字量可以跨行：\n\n```javascript\n\
  const str = `this is\na text with\nmultiple lines`;\n```\n\n模板字量总是产生字符串。\n\n## 23.3\
  \ 标签模板\n\n行 A 中的表达式是一个 `tagged template`。它等同于调用 `tagFunc()`，并传入行 B 数组中列出的参数。\n\n\
  ```javascript\nfunction tagFunc(...args) {\n  return args;\n}\n\nconst setting =\
  \ 'dark mode';\nconst value = true;\n\nassert.deepEqual(\n  tagFunc`Setting ${setting}\
  \ is ${value}!`, // (A)\n  [['Setting ', ' is ', '!'], 'dark mode', true] // (B)\n\
  );\n```\n\n第一个反引号之前的函数被称为 `tag function`（标签函数）。它的参数是：\n\n*   `Template strings`（模板字符串，第一个参数）：一个包含插值\
  \ `${}` 周围文本片段的数组。\n\n    *   在示例中：`['Setting ', ' is ', '!']`\n\n*   `Substitutions`（剩余参数）：插值。\n\
  \n    *   在示例中：`'dark mode'` 和 `true`\n\n字量的静态（固定）部分（模板字符串）与动态部分（插值）分开。\n\n标签函数可以返回任意值。\n\
  \n### 23.3.1 熟化（cooked）与原始（raw）字符串\n\n到目前为止，我们只见过 `cooked` 模板字符串。但标签函数可以得到两种：\n\n\
  *   `cooked` 解释，其中反斜杠具有特殊含义。例如，`\\t` 产生制表符。\n*   `raw` 解释，其中反斜杠没有特殊含义。例如，`\\t` 产生一个反斜杠。\n\
  \n第一个参数的 `raw` 属性允许访问此内容。\n\n```javascript\nfunction cookedRaw(templateStrings,\
  \ ...substitutions) {\n  return {\n    cooked: templateStrings,\n    raw: templateStrings.raw,\n\
  \    substitutions: substitutions\n  };\n}\nassert.deepEqual(\n  cookedRaw`\\tab${stst}`,\n\
  \  {\n    cooked: ['tab'],\n    raw: ['\\\\tab'],\n    substitutions: []\n  }\n\
  );\n```\n\n标签模板中也使用了 Unicode 点（`\\u{1F62}`）、Unicode 单元转义（`\\u3A9`）和 ASCII 转义（`\\\
  x52`）：\n\n```javascript\nassert.deepEqual(\n  cookedRaw`\\u{54}\\u0065\\x78`,\n\
  \  {\n    cooked: ['Text'],\n    raw: ['\\\\u{54}\\\\u0065\\\\x78'],\n    substitutions:\
  \ []\n  }\n);\n```\n\n如果这些转义的语法不正确，相应的 cooked 字符串为 `undefined`，而原始版本则是原样的：\n\n```javascript\n\
  assert.deepEqual(\n  cookedRaw`\\uu\\xx ${1} after`,\n  {\n    cooked: [undefined,\
  \ ' after'],\n    raw: ['\\\\uu\\\\xx after'],\n    substitutions: [1]\n  }\n);\n\
  ```\n\n错误的转义会在模板字量和字符串字量产生语法错误。为什么 JavaScript 对标签模板处理不同？它允许我们将标签模板用于无法放入字符串字量的文本——例如：\n\
  \n```javascript\nwindowsPath`C:\\uuu\\xxx\\111`\nlatex`\\unicode`\n```\n\n## 23.4\
  \ 标签模板示例（通过库提供）\n\n标签模板非常适合嵌入语言（所谓的*领域特定语言*）。我们将继续看几个示例。\n\n### 23.4.1 标签函数库：lit-html\n\
  \n[lit-html](https://github.com/Polymer/lit-html) 是一个基于标签模板的模板化库，被[前端框架 Polymer](https://www.polymer-project.org/)\
  \ 使用：\n\n```javascript\nimport {html, render} from 'lit-html';\n\nconst template\
  \ = (items) => html`\n<ul>\n  ${\n    repeat(items,\n      (item) => item.id,\n\
  \      (item, index) => html`<li>${index}. ${item.name}</li>>`\n    )\n  }\n</ul>`;\n\
  ```\n\n`repeat()` 是用于循环的自定义函数。它的第二个参数为第三个参数返回的值产生唯一键。注意该参数所使用的嵌套标签模板。\n\n### 23.4.2\
  \ 标签函数库：re-template-tag\n```\n\n\n\n\n\n[re-template-tag](https://github.com/rauschma/re-template-tag)\
  \ 是一个用于组合正则表达式的简单库。带有 `re` 标记的模板会生成正则表达式。其主要优势是我们可以通过 `${}`（行 A）对正则表达式和普通文本进行插值：\n\
  \n```javascript\nconst RE_YEAR = re`(?<year>[0-9]{4})`;\nconst RE_MONTH = re`(?<month>[0-9]{2})`;\n\
  const RE_DAY = re`(?<day>[0-9]{2})`;\nconst RE_DATE = re`/${RE_YEAR}-${RE_MONTH}-${RE_DAY}/u`;\
  \ // (A)\n\nconst match = RE_DATE.exec('2017-01-27');\nassert.equal(match.groups.year,\
  \ '2017');\n```\n\n### 23.4.3 标签函数库：graphql-tag\n\n[graphql-tag ](https://github.com/apollographql/graphql-tag)\
  \ 让我们通过标签模板创建 GraphQL 查询：\n\n```javascript\nimport gql from 'graphql-tag';\n\nconst\
  \ query = gql`\n {\n  user(id: 5) {\n    firstName\n    lastName\n  }\n } `;\n```\n\
  \n此外，还有插件用于在 Babel、TypeScript 等环境中预编译此类查询。\n\n## 23.5 原始字符串字面量 (Raw string literals)\n\
  \n原始字符串字面量是通过标签函数 `String.raw` 实现的。在这种字符串字面量中，反斜杠没有任何特殊作用（如转义字符等）：\n\n```javascript\n\
  assert.equal(String.raw`\\back`, '\\\\back');\n```\n\n当数据包含反斜杠时这非常有帮助——例如包含正则表达式的字符串：\n\
  \n```javascript\nconst regex1 = /^\\./;\nconst regex2 = new RegExp('^\\\\.');\n\
  const regex3 = new RegExp(String.raw`^\\.`);\n```\n\n这三个正则表达式是等价的。在普通字符串字面量中，我们必须写两次反斜杠来对该字面量进行转义。而在原始字符串字面量中，不需要这样做。\n\
  \n原始字符串字面量也用于指定 Windows 文件路径：\n\n```javascript\nconst WIN_PATH = String.raw`C:\\\
  foo\\bar`;\nassert.equal(WIN_PATH, 'C:\\\\foo\\\\bar');\n```\n\n## 23.6 (高级)\n\n\
  所有剩余章节均为高级内容\n\n## 23.7 多行模板字面量与缩进\n\n如果我们在模板字面量放入多行文本，两个目标会产生冲突：一方面，模板字面量应该缩进以适应源代码结构；另一方面，其内容的行应该从最左侧列开始。\n\
  \n例如：\n\n```javascript\nfunction div(text) {\n  return `\n <div>\n  ${text}\n</div>\n\
  \ `;\n}\nconsole.log('Output:');\nconsole.log(\n  div('Hello!')\n  // 将空格替换为中间点:\n\
  \  .replace(/ /g, '·')\n  // 将 \\n 替换为 #\\n:\n  .replace(/\\n/g, '#\\n')\n);\n```\n\
  \n由于缩进，模板字面量可以很好地嵌入源代码中。遗憾的是，输出也是缩进的。而且我们不希望开头有一个换行符，结尾有一个换行符加两个空格。\n\n```\nOutput:\n\
  #\n····<div>#\n····Hello!#\n····</div>#\n··\n```\n\n有两种修复方法：通过标签模板或通过对模板字面量结果进行\
  \ `trim()`。\n\n### 23.7.1 修复：用于取消缩进的模板标签\n\n第一种修复方法是使用自定义模板标签来移除不需要的空白字符。它利用初始换行符后的第一行来确定文本开始的列数，并缩短所有的缩进。它还移除了最开头的换行符和末尾的缩进。其中一个模板标签是\
  \ Desmond Brand 开发的 [`dedent`](https://github.com/dmnd/dedent)：\n\n```javascript\n\
  import dedent from 'dedent';\nfunction divDedented(text) {\n  return dedent`\n<<div>>\n\
  \  ${text}\n</div>\n `.replace(/\\n/g, '#\\n');\n}\nconsole.log('Output:');\nconsole.log(divDedented('Hello!'));\n\
  ```\n\n这一次，输出没有缩进：\n\n```\nOutput:\n<div>#\n  Hello!#\n</div>\n```\n\n### 23.7.2\
  \ 修复：`.trim()`\n\n第二种修复方法更快，但也更“粗暴”：\n\n```javascript\nfunction divDedented(text)\
  \ {\n  return `\n<<div>\n  ${text}\n</div>\n `.trim().replace(/\\n/g, '#\\n');\n\
  }\nconsole.log('Output:');\nconsole.log(divDedented('Hello!'));\n```\n\n字符串方法 `.trim()`\
  \ 移除了开头和结尾的多余空白字符，但内容本身必须从最左侧列开始。这种方案的优点是不需要自定义标签函数。缺点是它看起来很难看。输出与 `dedent` 相同：\n\
  \n```\nOutput:\n<div>#\n  </div>\n```\n\n## 23.8 通过模板字面量进行简单的模板化\n\n虽然模板字面量看起来像文本，但并不清楚如何使用它们进行模板化——例如：\n\
  \n```javascript\nconst tmpl = (data) => ` ${data}!\n```\n\n### 23.8.1 一个更复杂的示例\n\
  \n作为一个更复杂的例子，我们想要获取一个数组并生成一个表格。这是：\n\n```javascript\nconst addresses = [\n  { first:\
  \ 'Jane', last: 'Doe' },\n  { first: 'Bob', last: 'Smith' },\n  { first: 'Alice',\
  \ last: 'Brown' }\n];\n\nconst tmpl = (addrs) => `\n<table>\n${addrs.map((addr)\
  \ => `\n<tr><td>${escapeHtml(addr.first)}</td><td>${escapeHtml(addr.last)}</td></tr>\n\
  `).join('')}\n</table>`.trim();\n```\n\n让我们传入地址调用 `tmpl()` 并打印结果：\n\n```javascript\n\
  tmpl(addresses);\n```\n\n输出是：\n\n```\n<table>\n<tr><td>Jane</td><td>Doe</td></tr>\n\
  <tr><td>Bob</td><td>Smith</td></tr>\n<tr><td>Alice</td><td>Brown</td></tr>\n</table>\n\
  ```\n\n### 23.8.2 简单的 HTML 转义 (HTML-escaping)\n\n以下函数对纯文本进行转 HTML 转义处理，以使其在 HTML\
  \ 中正确显示：\n\n```javascript\nfunction escapeHtml(str) {\n  return str\n    .replace(/&/g,\
  \ '&amp;') // 首先处理符号\n    .replace(/>/g, '&gt;')\n    .replace(/</g, '&lt;')\n \
  \   .replace(/\"/g, '&quot;')\n    .replace(/'/g, '&#39;')\n    .replace(/`/g, '&#96;')\n\
  \    ;\n}\nassert.equal(escapeHtml('Rock & Roll'), 'Rock &amp; Roll');\nassert.equal(escapeHtml('<blank>'),\
  \ '&lt;blank&gt;');\n```\n\n\n\n\n\n![](img/file6.svg) **练习：HTML 模板填充**\n\n带有额外挑战的练习：`exercises/template-literals/templating_test.mjs`\n\
  \n![](img/file7.svg) **测验**\n\n查看测验应用。\n\n# 24 符号\n\n***\n\n* 24.1 符号是原始类型，但也像对象\n\
  \    * 24.1.1 符号是原始值\n    * 24.1.2 符号也像对象\n* 24.2 符号的描述\n* 24.3 符号的用例\n    * 24.3.1\
  \ 作为常量值的符号\n    * 24.3.2 作为唯一属性键的符号\n* 24.4 公开符号\n* 24.5 符号的转换\n\n***\n\n## 24.1\
  \ 符号是原始类型，但也像对象\n\n符号是通过工厂函数 `Symbol()` 创建的原始值：\n\n```javascript\nconst mySymbol\
  \ = Symbol('mySymbol');\n```\n\n该参数是可选的，用于提供一个描述，主要用于调试。\n\n### 24.1.1 符号是原始值\n\n\
  符号是原始值：\n\n* 它们必须通过 `typeof` 进行分类：\n\n    ```javascript\n    const sym = Symbol();\n\
  \    assert.equal(typeof sym, 'symbol');\n    ```\n\n* 它们可以作为对象的属性键：\n\n    ```javascript\n\
  \    const obj = {\n      [sym]: 123,\n    };\n    ```\n\n### 24.1.2 符号也像对象\n\n\
  尽管符号是原始类型，但它们也像对象，因为通过 `Symbol()` 创建的每个值都是唯一的，并且不通过值进行比较：\n\n```javascript\n> Symbol()\
  \ === Symbol()\nfalse\n```\n\n在符号出现之前，如果我们需要唯一的值（仅等于其自身），对象是最佳选择：\n\n```javascript\n\
  const string1 = 'abc';\nconst string2 = 'abc';\nassert.equal(\n  string1 === string2,\
  \ true); // 非唯一\n\nconst object1 = {};\nconst object2 = {};\nassert.equal(\n  object1\
  \ === object2, false); // 唯一\n\nconst symbol1 = Symbol();\nconst symbol2 = Symbol();\n\
  assert.equal(\n  symbol1 === symbol2, false); // 唯一\n```\n\n## 24.2 符号的描述\n\n我们传递给符号工厂函数的参数为创建的符号提供了描述：\n\
  \n```javascript\nconst mySymbol = Symbol('mySymbol');\n```\n\n可以通过两种方式访问描述。\n\n\
  首先，它是 `.toString()` 返回的字符串的一部分：\n\n```javascript\nassert.equal(mySymbol.toString(),\
  \ 'Symbol(mySymbol)');\n```\n\n其次，自 ES2019 起，我们可以通过属性 `.description` 获取描述：\n\n```javascript\n\
  assert.equal(mySymbol.description, 'mySymbol');\n```\n\n## 24.3 符号的用例\n\n符号的主要用例是：\n\
  \n* 常量值\n* 唯一属性键\n\n### 24.3.1 作为常量值的符号\n\n假设你想创建代表红、橙、黄、绿、蓝、紫颜色的常量。实现此的一种简单方法是使用字符串：\n\
  \n```javascript\nconst COLOR_BLUE = 'Blue';\n```\n\n优点是记录该常量会产生有用的输出。缺点是存在将无关值误认为颜色的风险，因为两个内容相同的字符串被认为认为是相等的：\n\
  \n```javascript\nconst MOOD_BLUE = 'Blue';\nassert.equal(COLOR_BLUE, MOOD_BLUE);\n\
  ```\n\n我们可以通过符号解决这个问题：\n\n```javascript\nconst COLOR_BLUE = Symbol('Blue');\nconst\
  \ MOOD_BLUE = Symbol('Blue');\n\nassert.notEqual(COLOR_BLUE, MOOD_BLUE);\n```\n\n\
  让我们使用符号值型常量来实现一个函数：\n\n```javascript\nconst COLOR_RED    = Symbol('Red');\nconst\
  \ COLOR_ORANGE = Symbol('Orange');\nconst COLOR_YELLOW = Symbol('Yellow');\nconst\
  \ COLOR_GREEN  = Symbol('Green');\nconst COLOR_BLUE   = Symbol('Blue');\nconst COLOR_VIOLET\
  \ = Symbol('Violet');\n\nfunction getComplement(color) {\n  switch (color) {\n \
  \   case COLOR_RED: return COLOR_GREEN;\n    case COLOR_ORANGE: return COLOR_BLUE;\n\
  \    case COLOR_YELLOW: return COLOR_VIOLET;\n    case COLOR_GREEN: return COLOR_RED;\n\
  \    case COLOR_BLUE: return COLOR_ORANGE;\n    case COLOR_VIOLET: return COLOR_YELLOW;\n\
  \    default: throw new Error('Unknown color: '+color);\n  }\n}\nassert.equal(getComplement(COLOR_YELLOW),\
  \ COLOR_VIOLET);\n```\n\n### 24.3.2 作为唯一属性键的符号\n\n属性键用于两个级别：\n\n* 属性键用于基础层——它们解决了点计算问题。例如，标准的\
  \ ECMAScript 方法 `.toString()`：\n\n    ```javascript\n    const point = {\n     \
  \ x: 7,\n      y: 4,\n      toString() {\n        return `(${this.x}, ${this.y})`;\n\
  \      },\n    };\n    assert.equal(String(point), '(7, 4)');\n    ```\n\n* 元级别是元级别属性——它与领域问题无关。例如，标准方法\
  \ `.toJSON()`：\n\n    ```javascript\n    const point = {\n      x: 7,\n      y:\
  \ 4,\n      toJSON() {\n        return [this.x, this.y];\n      },\n    };\n   \
  \ assert.equal(JSON.stringify(point), '[7,4]');\n    ```\n\n程序的基础层和元级别必须保持独立：基础层属性键不应与元级别属性键发生冲突。\n\
  \n如果我们使用名称（字符串）作为属性键，我们将面临两个挑战：\n\n1. 当语言刚被创建时，它可以使用任何想要的元级别名称。基础层代码被迫避免这些名称。然而，当已经存在大量基础层代码时，元级别名称就无法自由选择了。\n\
  2. 我们可以引入命名规则来区分基础层和元级别。例如，Python 使用双下划线标记元级别名称：`__init__`、`__iter__`、`__hash__`\
  \ 等。但是，语言的元级别名称和库的元级别名称仍然存在相同的命名空间中并可能冲突。\n\n以下是 JavaScript 中此类问题的例子：\n\n* 在 2018\
  \ 年 5 月，Array 方法 `.flatten()` 必须重命名为 `.flat()`，因为之前的名称已被库使用（[来源](https://github.com/tc39/proposal-flatMap/commit/093eacc7fe0906e70f7626bf6c7d6e9dfc53cce9)）。\n\
  \n\n\n\n\n在 2020 年 11 月，`Array` 方法 `.item()` 被重命名为 `.at()`，因为原来的名称已被某个库使用（[来源](https://github.com/tc39/proposal-relative-indexing-method#web-incompatibility-history)）。\n\
  \n用作属性键 Symbol 在这里提供了帮助：每个 `symbol` 都是唯一的，且 `symbol` 键永远不会与其他字符串或 `symbol` 键冲突。\n\
  \n### 24.3.2.1 示例：带有元级别方法的库\n\n作为一个示例，假设我们正在编写一个库，如果对象实现了一个特殊方法，则对其进行不同的处理。以下是为此类方法定义属性键并在对象中实现它的写法：\n\
  \n```javascript\nconst specialMethod = Symbol('specialMethod');\nconst obj = {\n\
  \  _id: 'kf12oi',\n  [specialMethod]() { // (A)\n    return this._id;\n  }\n};\n\
  assert.equal(obj[specialMethod](), 'kf12oi');\n```\n\n行 A 中的方括号允许我们指定该方法必须具有键 `specialMethod`。更多细节请参见\
  \ §30.6.2 “计算属性键”。\n\n## 24.4 公共已知符号\n\n在 ECMAScript 中扮演特殊作用的符号被称为*公开已知符号*。示例包括：\n\
  \n*   `Symbol.iterator`：使对象变为*可迭代的*。它是返回迭代器的方法的键。关于此主题的更多信息，请参见 §32 “同步迭代”。\n\n\
  *   `Symbol.hasInstance`：自定义 `instanceof` 的工作方式。如果一个对象实现了一个带有该键的方法，它就可以用于该运算符的右侧。例如：\n\
  \n```javascript\nconst PrimitiveNull = {\n  Symbol.hasInstance {\n    return x ===\
  \ null;\n  }\n};\nassert.equal(null instanceof PrimitiveNull, true);\n```\n\n* \
  \  `Symbol.toStringTag`：影响默认的 `.toString()` 方法。\n\n```javascript\n> String({})\n\
  '[object Object]'\n> String({ [Symbol.toStringTag]: 'is no money' })\n'[object is\
  \ no money]'\n```\n\n注意：通常重写 `.toString()` 更好。\n\n![](img/file.svg) **练习：公开已知符号**\n\
  \n*   `Symbol.toStringTag`: `exercises/symbols/to_string_tag_test.mjs`\n\n*   `Symbol.hasInstance`:\
  \ `exercises/symbols/has_instance_test.mjs`\n\n## 24.5 转换符号\n\n如果将 `sym` 转换为另一种原始类型会发生什么？表\
  \ 15 提供了答案。\n\n表 15：将符号转换为其他原始类型的结果。\n\n| 转换为 | 显式转换 | 强制转换（隐式转换） |\n| --- | ---\
  \ | --- |\n| boolean | `Boolean(sym)` → `OK` | `!sym` → `OK` |\n| number | `Number(sym)`\
  \ → `TypeError` | `sym*2` → `TypeError` |\n| string | `String(sym)` → `OK` | `''+sym`\
  \ → `TypeError` |\n| | | `sym.toString()` → `OK` | `` `${sym}` `` → `TypeError`\
  \ |\n\n符号的一个关键陷阱是当将其转换为其他内容时抛出异常的方式。这背后的逻辑是什么？首先，转换为数字永远没有意义，应该应该警告。其次，将符号转换为字符串对于输出确实很有用。但警告无意中将符号转换为字符串（这是另一种类型的属性）也是有意义的：\n\
  \n```javascript\nconst obj = {};\nconst sym = Symbol();\nassert.throws(() => { obj[sym]\
  \ = true }, { message: 'Cannot convert a Symbol value to string' });\n```\n\n缺点是异常使得处理符号变得变得复杂。当你通过加号运算符组合字符串时，必须显式转换符号：\n\
  \n```javascript\nconst mySymbol = Symbol('mySymbol');\n> 'Symbol used: ' + mySymbol\n\
  TypeError: Cannot convert a Symbol value to string\n> 'Symbol used: ' + String(mySymbol)\n\
  'Symbol used: Symbol(mySymbol)'\n```\n\n![](img/file7.svg) **测验**\n\n查看测试应用。\n\n\
  # 25 控制流语句\n\n* *\n*   25.1 控制循环：`break` 和 `continue`](#ch026.xhtml_controlling-loops-and-continue)\n\
  \    *   25.1.1 `break`](#ch026.xhtml_break)\n    *   25.1.2 `break` 加上标签：离开任何语句](#ch026.xhtml_labels)\n\
  \    *   25.1.3 `continue`](#ch026.xhtml_continue)\n*   25.2 控制流语句的条件](#ch026.xhtml_conditions-of-flow-statements)\n\
  *   25.3 `if` 语句 [ES1]](#ch026.xhtml_if)\n    *   25.3.1 `if` 语句的语法](#ch026.xhtml_the-syntax-of-if-statements)\n\
  *   25.4 `switch` 语句 [ES3]](#ch026.xhtml_switch)\n    *   25.4.1 `switch` 语句的第一个示例](#ch026.xhtml_a-first-example-of-switch-statement)\n\
  \    *   25.4.2 不要忘记 `return` 或 `break`](#ch026.xhtml_dont-forget-to-return-or-break)\n\
  \    *   25.4.3 空的 case 子句](#ch026.xhtml_empty-case-clauses)\n    *   25.4.4 通过\
  \ `default` 子句检查非法值](#ch026.xhtml_checking-for-illegal-values-via-a-default-clause)\n\
  *   25.5 `while` 循环 [ES1]](#ch026.xhtml_while)\n    *   25.5.1 `while` 循环示例](#ch026.xhtml_examples-of-while-loops)\n\
  *   25.6 `do-while` 循环 [ES3]](#ch026.xhtml_do-while)\n*   25.7 `for` 循环 [ES1]](#ch026.xhtml_for)\n\
  \    *   25.7.1 `for` 循环示例](#ch026.xhtml_examples-of-for-loops)\n*   25.8 `for-of`\
  \ 循环 [ES6]](#ch026.xhtml_for-of)\n    *   25.8.1 `const`: `for-of` vs. `for`](#ch026.xhtml_const-for-of-vs.-for)\n\
  \    *   25.8.2 遍历可迭代对象](#ch026.xhtml_iterating-over-iterables)\n    *   25.8.3\
  \ 遍历数组的[索引, 元素]对](#ch026.xhtml_for-of-iterating-index-element)\n*   25.9 `for-await-of`\
  \ 循环 [ES2018]](#ch026.xhtml_for-await-of)\n*   25.10 `for-in` 循环 [ES1]](#ch026.xhtml_for-in)\n\
  *   25.11 循环建议](#ch026.xhtml_recomendations-for-looping)\n\n\n\n\n\n```javascript\n\
  function findSuffix(stringArray, suffix) {\n  let result;\n  search_block: {\n \
  \   for (const str of stringArray) {\n      if (str.endsWith(suffix)) {\n      \
  \  // Success:\n        result = str;\n        break search_block; // (A)\n    \
  \  }\n    } // for\n    // Failure:\n    result = '(Untitled)'; // (B)\n  } // search_block\n\
  \n  return { suffix, result };\n    // Same as: {suffix: suffix, result: result}\n\
  }\nassert.deepEqual(\n  findSuffix(['notes.txt', 'index.html'], '.html'),\n  { suffix:\
  \ '.html', result: 'index.html' }\n);\nassert.deepEqual(\n  findSuffix(['notes.txt',\
  \ 'index.html'], '.mjs'),\n  { suffix: '.mjs', result: '(Untitled)' }\n);\n```\n\
  \n### 25.1.3 `continue`\n\n`continue` 仅在 `while`、`do-while`、`for`、`for-of`、`for-await-of`\
  \ 和 `for-in` 内部有效。它会立即离开当前的循环迭代并继续下一次——例如：\n\n```javascript\nconst lines = [\n \
  \ 'Normal line',\n  '# Comment',\n  'Another normal line',\n];\nfor (const line\
  \ of lines) {\n  if (line.startsWith('#')) continue;\n  console.log(line);\n}\n\
  // 输出:\n// 'Normal line'\n// 'Another normal line'\n```\n\n## 25.2 控制流语句的条件\n\n\
  `if`、`while` 和 `do-while` 的条件在原则上是布尔值。然而，条件只需要是*真值*（truthy，即转换为布尔值时为 `true`）即可被接受。换句话说，以下两个控制流语句是等价的：\n\
  \n```javascript\nif (value) {}\nif (Boolean(value) === true) {}\n```\n\n这是所有*假值*（falsy\
  \ values）的列表：\n\n*   `undefined`, `null`\n*   `false`\n*   `0`, `NaN`\n*   `0n`\n\
  *   `''`\n\n所有其他值均为真值。更多信息，请参阅 [§17.2 “假值与真值”]。\n\n## 25.3 `if` 语句\n\n这是两个简单的 `if`\
  \ 语句：一个只有一个“那么”（then）分支，另一个同时包含“那么”分支和“否则”（else）分支：\n\n```javascript\nif (cond)\
  \ {\n  // then 分支\n}\n\nif (cond) {\n  // then 分支\n} else {\n  // else 分支\n}\n```\n\
  \n除了块之外，`else` 后面也可以接另一个 `if` 语句：\n\n```javascript\nif (cond1) {\n  // ···\n} else\
  \ if (cond2) {\n  // ···\n}\n\nif (cond1) {\n  // ···\n} else if (cond2) {\n  //\
  \ ···\n} else {\n  // ···\n}\n```\n\n你可以使用更多的 `else if` 来继续这个链链。\n\n### 25.3.1 `if`\
  \ 语句的语法\n\n`if` 语句的通用语法为：\n\n```\nif (cond) then_statement\nelse else_statement\n\
  ```\n\n到目前，`then_statement` 一直是一个块，但我们可以使用任何语句。该语句必须以分号结束：\n\n```javascript\nif\
  \ (true) console.log('Yes'); else console.log('No');\n```\n\n这意味着 `else if` 并不是一个独立的构造结构；它仅仅是一个\
  \ `if` 语句，其 `else_statement` 是另一个 `if` 语句。\n\n## 25.4 `switch` 语句\n\n`switch` 语句如下：\n\
  \n```\nswitch (switch_expression) {\n  switch_body\n}\n```\n\n`switch` 的体由零或多个 `case`\
  \ 子句组成：\n\n```\ncase case_expression:\n  statements\n```\n\n以及一个可选的 `default` 子句：\n\
  \n```\ndefault:\n  statements\n```\n\n`switch` 的执行方式如下：\n\n*   它评估 `switch_expression`。\n\
  *   跳转到第一个表达式与 `switch_expression` 结果相同的 `case` 子句。\n*   否则，如果没有这样的子句，它跳转到 `default`\
  \ 子句。\n*   再次否则，如果没有 `default` 子句，则什么都不做。\n\n### 25.4.1 `switch` 语句的第一个示例\n\n让我们来看一个例子：以下函数将\
  \ 1–7 的数字转换为星期几的名称。\n\n```javascript\nfunction dayOfThe(num) {\n  switch (num) {\n\
  \    case 1:\n      return 'Monday';\n    case 2:\n      return 'Tuesday';\n   \
  \ case 3:\n      return 'Wednesday';\n    case 4:\n      return 'Thursday';\n  \
  \  case 5:\n      return 'Friday';\n    case 6:\n      return 'Saturday';\n    case\
  \ 7:\n      return 'Sunday';\n  }\n}\nassert.equal(dayOfThe(5), 'Friday');\n```\n\
  \n### 25.4.2 不要忘记 `return` 或 `break`！\n\n在 `case` 子句的末尾，执行会继续到下一个 `case` 子句，除非我们使用了\
  \ `return` 或 `break`——例如：\n\n```javascript\nfunction englishToFrench(english) {\n\
  \  let french;\n  switch (english) {\n    case 'hello':\n      french = 'bonjour';\n\
  \    case 'goodbye':\n      french = 'au revoir';\n  }\n  return french;\n}\n//\
  \ 结果本应该是 'bonjour'!\nassert.equal(englishToFrench('hello'), 'au revoir');\n```\n\
  \n也就是说，我们对 `dayOfThe()` 的实现之所以有效是因为使用了 `return`。我们可以通过使用 `break` 来修复 `englishToFrench()`：\n\
  \n```javascript\nfunction englishToFrench(english) {\n  let french;\n  switch (english)\
  \ {\n    case 'hello':\n      french = 'bonjour';\n      break;\n    case 'goodbye':\n\
  \      french = 'au revoir';\n      break;\n  }\n  return french;\n}\nassert.equal(englishToFrench('hello'),\
  \ 'bonjour'); // ok\n```\n\n### 25.4.3 空的 case 子句\n\n`case` 子句的语句可以省略，这实际上允许我们在每个\
  \ `case` 子句中使用多个 `case` 表达式：\n\n```javascript\nfunction isDay(name) {\n  switch\
  \ (name) {\n    case 'Monday':\n    case 'Tuesday':\n    case 'Wednesday':\n   \
  \ case 'Thursday':\n    case 'Friday':\n      return true;\n    case 'Saturday':\n\
  \    case 'Sunday':\n      return false;\n  }\n}\nassert.equal(isDay('Wednesday'),\
