  ### 4. **子子类化（下一章）：** 子类（`subclass`）与其父类（`superclass`）之间的关系也基于原型继承。\n\n![](img/file17.svg)\n\
  \n图 8：本书通过四个步骤介绍了 JavaScript 中的面向对象编程。\n\n## 30.1 什么是对象？\n\n在 JavaScript 中：\n\n\
  * 对象是一组 `properties`（键值对）。\n* 属性键（property key）可以是字符串或 `symbol`。\n\n### 30.1.1 对象的角色：记录\
  \ vs. 字典\n\n对象在 JavaScript 中扮演着两种角色：\n\n* **记录（Records）**：作为记录的对象具有固定数量的属性，其键在开发时是已知的。它们的属性的值可以是不同的类型。\n\
  * **字典（Dictionaries）**：作为字典的对象具有可变的属性，其键在开发时是未知的。它们的所有值具有相同的类型。\n\n这些角色影响了本章对对象的解释方式：\n\
  \n* 首先，我们将探索作为记录的对象。尽管属性键在底层是字符串或符号，在本章的这部分中，它们对我们来说将是固定的标识符。\n* 随后，我们将探索作为字典的对象。注意，`Maps``。它列出属性键：\n\
  \n```\n> Object.keys({a:1, b:2})\n[ 'a', 'b' ]\n```\n\n### 30.2.2 对象字面量：属性值简写\n\n\
  当属性的值通过变量名定义，且该名称与键相同时，我们可以省略键。\n\n```\nfunction createPoint(x, y) {\n  return {x,\
  \ y};\n}\nassert.deepEqual(\n  createPoint(9, 2),\n  { x: 9, y: 2 }\n);\n```\n\n\
  ### 30.2.3 获取属性\n\n这是我们 `get`（读取）属性的方法（行 A）：\n\n```\nconst jane = {\n  first: 'Jane',\n\
  \  last: 'Doe',\n};\n\n// 获取属性 .first\nassert.equal(jane.first, 'Jane'); // (A)\n\
  ```\n\n获取未知属性会产生 `undefined`：\n\n```\nassert.equal(jane.unknownProperty, undefined);\n\
  ```\n\n### 30.2.4 设置属性\n\n这是我们 `set`（写入）属性的方法：\n\n```\nconst obj = {\n  prop: 1,\n\
  };\nassert.equal(obj.prop, 1);\nobj.prop = 2; // (A)\nassert.equal(obj.prop, 2);\n\
  ```\n\n我们刚刚通过设置更改了现有属性。如果设置设置一个未知属性，我们就会创建一个新条目：\n\n```\nconst obj = {}; // 空对象\n\
  assert.deepEqual(\n  Object.keys(obj), []);\n\nobj.unknownProperty = 'abc';\nassert.deepEqual(\n\
  \  Object.keys(obj), ['unknownProperty']);\n```\n\n### 30.2.5 对象字面量：方法\n\n以下代码展示了如何通过对象字面量创建方法\
  \ `.says()`：\n\n```javascript\nconst jane = {\n  first: 'Jane', // 数据属性\n  says(text)\
  \ {   // 方法\n    return `${this.first} says “${text}”`;\n  },\n};\n```在调用 `jane.says('hello')`\
  \ 时，`jane` 是方法的*接收者*，`this` 是代表接收者的特殊变量。\n\n### 30.2.6 对象字面量：访问器\n\nJavaScript 中有两种类型的访问器：\n\
  \n* `getter` 是一个类似于方法的实体。\n* `setter` 是一个类似于方法的实体。\n\n#### 30.2.6.1 Getters\n\n\
  getter 是通过在方法定义前加上 `get` 来创建的：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n\
  \  last: 'Doe',\n  get() {\n    return `${this.first} ${this.last}`;\n  },\n};\n\
  assert.equal(jane.full, 'Jane Doe');\n```\n\n#### 30.2.6.2 Setters\n\nsetter 是通过在方法定义前加上\
  \ `set` 来创建的：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n  last: 'Doe',\n\
  \  set full(fullName) {\n    const parts = fullName.split(' ');\n    this.first\
  \ = parts[0];\n    this.last = parts[1];\n  },\n};\n```\n\n### 6.svg **通过对象字面量创建对象**\n\
  \n## 30.3 展开到对象字面量 (`...`) [ES018]\n\n在函数调用内部中，展开（`...`）将[*迭代*对象](ch33.xhtml_sync-iteration）的迭代值转换为参数。\n\
  \n在对象字面量内部，*展开属性*（spread property）将另一个对象的属性添加到当前对象中：\n\n```javascript\n> const obj\
  \ = {foo: 1, bar: 2};\n> {...obj, baz: 3}\n{ foo: 1, bar: 2, baz: 3 }\n```\n\n如果属性键冲突，最后提到的属性“胜出”：\n\
  \n```javascript\n> const obj = {foo: 1, bar: 2, baz: 3};\n> {...obj, foo: true}\n\
  { foo: true, bar: 2, baz: 3 }\n> {foo: true, ...obj}\n{ foo: 1, bar: 2, baz: 3 }\n\
  ```\n\n所有值都是可以展开的，甚至是 `undefined` 和 `null`：\n\n```javascript\n> {...undefined}\n\
  {}\n> {...null}\n{}\n> {...123}\n{}\n> {...'abc'}\n{ '0': 'a', '1': 'b', '2': 'c'\
  \ }\n> {...['a', 'b']}\n{ '0': 'a', '1': 'b' }\n```\n\n字符串和数组的属性 `.length` 对这种操作是隐藏的（它不是*可枚举的*；参见\
  \ [§30.8.3 “属性属性和属性描述符 [ES5]”`](ch31.xhtml_property-attributes）获取更多信息）。\n\n### 30.3.1\
  \ 展开用：复制对象\n\n我们可以使用展开创建对象 `original` 的副本：\n\n```javascript\nconst copy = {...original};\n\
  ```\n\n注意 —— 复制是*浅拷贝*的：`copy` 是一个新对象，包含了 `original` 所有属性（键值对）的副本。但如果属性值是对象，那么这些对象本身并没有被复制；它们在\
  \ `original` 和 `copy` 之间共享。\n\n\n\n\n\n```javascript\nconst original = { a: 1, b:\
  \ {foo: true} };\nconst copy = {...original};\n```\n\n`copy` 的第一层确实是拷贝：如果我们更改了该层上的任何属性，不会影响原始对象：\n\
  \n```javascript\ncopy.a = 2;\nassert.deepEqual(\n  original, { a: 1, b: {foo: true}\
  \ }); // 没有变化\n```\n\n然而，更深层次的并没有拷贝。例如，`.b` 的值在 `original` 和 `copy` 之间共享。在副本中修改\
  \ `.b` 也会改变原始对象中的。\n\n```javascript\ncopy.b.foo = false;\nassert.deepEqual(\n  original,\
  \ { a: 1, b: {foo: false} });\n```\n\n![](img/file4.svg) `JavaScript 没有内置对深拷贝的支持`\n\
  \n对象的*深拷贝*（即所有层级都被复制）在通用情况下是臭名的难以实现。因此，JavaScript 目前没有内置这样的操作操作。如果我们需要这样的操作，就必须自己实现它。\n\
  \n### 30.3.2 展开运算符的用例：缺失属性的默认值\n\n如果我们代码的输入是一个带有数据的对象，我们可以通过指定默认值来使属性可选，当这些属性缺失时使用这些默认值。实现这一目标的技术之一是使用一个属性包含默认值的对象。在下面的示例中，该对象是\
  \ `DEFAULTS`：\n\n```javascript\nconst DEFAULTS = {foo: 'a', bar: 'b'};\nconst providedData\
  \ = {foo: 1};\nconst allData = {...DEFAULTS, ...providedData};\nassert.deepEqual(allData,\
  \ {foo: 1, bar: 'b'});\n```\n\n结果对象 `allData` 是通过拷贝 `DEFAULTS` 并用 `providedData`\
  \ 的属性覆盖其属性创建的。\n\n但我们不需要一个对象来指定默认值；我们也可以在对象字面量内部单独指定它们：\n\n```javascript\nconst\
  \ providedData = {foo: 1};\nconst allData = {foo: 'a', bar: 'b', ...providedData};\n\
  assert.deepEqual(allData, {foo: 1, bar: 'b'});\n```\n\n### 30.3.3 展开运算符的用例：非破坏性更改属性\n\
  \n到目前为止，我们遇到了一种更改对象属性 `.foo` 的方法：我们*设置*它（A 行）并改变了对象。也就是说，这种更改属性的方法是*破坏性的*。\n\n```javascript\n\
  const obj = {foo: 'a', bar: 'b'};\nobj.foo = 1; // (A)\nassert.deepEqual(obj, {foo:\
  \ 1, bar: 'b'});\n```\n\n通过展开运算符，我们可以*非破坏性地*改变 `.foo`——我们创建了 `obj` 的副本，其中 `.foo`\
  \ 有不同的值：\n\n```javascript\nconst obj = {foo: 'a', bar: 'b'};\nconst updatedObj =\
  \ {...obj, foo: 1};\nassert.deepEqual(updatedObj, {foo: 1, bar: 'b'});\n```\n\n\
  ![](img/file6.svg) `练习：通过展开运算符非破坏性地更新属性（固定键）`\n\n`exercises/single-objects/update_name_test.mjs`\n\
  \n## 30.4 方法和特殊变量 `this`\n\n### 30.4.1 方法是值为函数的属性\n\n让我们重新回到用于介绍方法的示例：\n\n```javascript\n\
  const jane = {\n  first: 'Jane',\n  says(text) {\n    return `${this.first} says\
  \ “${text}”`;\n  },\n};\n```\n\n令人惊讶的是，方法是函数：\n\n```javascript\nassert.equal(typeof\
  \ jane.says, 'function');\n```\n\n这是为什么？我们在[关于可调用值的章节]中学习过，普通函数扮演着多个角色。`方法` 是其中一个角色之一。因此，在底层，`jane`\
  \ 看起来大致如下。\n\n```javascript\nconst jane = {\n  first: 'Jane',\n  says: function\
  \ (text) {\n    return `${this.first} says “${text}”`;\n  },\n};\n```\n\n### 30.4.2\
  \ 特殊变量 `this`\n\n考虑以下代码：\n\n```javascript\nconst obj = {\n  someMethod(x, y) {\n\
  \    assert.equal(this, obj); // (A)\n    assert.equal(x, 'a');\n    assert.equal(y,\
  \ 'b');\n  }\n};\nobj.someMethod('a', 'b'); // (B)\n```\n\n在 B 行，`obj` 是方法调用的*接收者*。它被传递给存储在\
  \ `obj` 中的函数。\n\n### 30.4.3 方法和 `call`\n\n回方法是将 `this` 作为参数的函数。在之前的示例中，`this` 被这样调用：\n\
  \n```javascript\nobj.someMethod('a', 'b')\n```\n\n顺带提一下，这意味着实际上有两个不同的运算符：\n1. 用于属性的：`.prop`\n\
  2. 用于调用的：`.call()`\n\n它们之所以不同是因为 (2) 为 `this` 指定了值。\n\n### 30.4.4 方法和 `bind`\n\n\
  `bind()` 是另一个方法。在下面的示例中，我们使用：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n\
  \  says(text) {\n    return `${this.first} says “${text}”`;\n  },\n};\n```\n\n我们将\
  \ `jane.says` 提取到变量 `func`：\n\n```javascript\nconst func = jane.says;\nfunc('hello');\
  \ // 报错！\n```\n\n在 B 行中，`obj` 是方法调用的*接收者*。它被传递给存储在 `obj` 中的函数。\n\n由于 `this` 是被这样调用的：\n\
  \n```javascript\njane.says.call(undefined)\n```\n\n这会导致报错，因为 `this` 是 `undefined`。\n\
  \n```javascript\njane.says.call(undefined)\n{\n  name: 'TypeError',\n  message:\
  \ \"Cannot read property 'first' of undefined\"\n}\n```\n\n我们如何修复它？我们需要使用 `.bind()`\
  \ 来提取方法：\n\n```javascript\nconst func2 = jane.says.bind(jane);\nassert.equal(func2('hello'),\
  \ 'Jane says “hello”');\n```\n\n`bind()` 确保在调用 `func()` 时 `this` 始终是 `jane`。\n\n\
  我们也可以使用箭头函数提取方法：\n\n```javascript\nconst func3 = text => jane.says(text);\nassert.equal(func3('hello'),\
  \ 'Jane says “hello”');\n```\n\n### 30.4.5 提取方法的陷阱\n\n我们现在对函数有了一些了解，准备好查看涉及 `this`\
  \ 的最大陷阱：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n  says(text) {\n  \
  \  return `${this.first} says “${text}”`;\n  },\n};\n```\n\n如果我们把 `jane.says` 提取到变量\
  \ `func`：\n\n```javascript\nconst func = jane.says;\nfunc('hello'); // 报错！\n```\n\
  \n这等同于：\n\n```javascript\njane.says.call(undefined)\n```\n\n在 A 行调用报错，因为 `this`\
  \ 是 `undefined`。\n\n```javascript\njane.says.call(undefined)\n{\n  name: 'TypeError',\n\
  \  message: \"Cannot read property 'first' of undefined\"\n}\n```\n\n我们如何修复它？我们需要使用\
  \ `.bind()` 来提取方法：\n\n```javascript\nconst func2 = jane.says.bind(jane);\nassert.equal(func2('hello'),\
  \ 'Jane says “hello”');\n```\n\n### 30.4.5.1 示例：提取方法\n\n以下是实际 Web 开发中可能会看到的代码简化版本：\n\
  \n```javascript\nclass ClickHandler {\n  constructor(id, elem) {\n    this.id =\
  \ id;\n    elem.addEventListener('click', this.handleClick); // (A)\n  }\n  handleClick(event)\
  \ {\n    alert('Clicked ' + this.id);\n  }\n}\n```\n\n在 A 行，我们没有正确提取方法 `.handleClick()`。相反，我们应该这样做：\n\
  \n```javascript\nelem.addEventListener('click', this.handleClick.bind(this));\n\
  ```\n\n### 30.4.5.2 如何避免提取方法的陷阱\n\n\n\n\n\n唉，没有简单的方法可以规避提取方法的陷阱：每当我们提取一个方法时，都必须小心并正确地处理——例如，通过绑定\
  \ `this` 或使用箭头函数。\n\n![](img/file6.svg) **练习：提取方法**\n\n`exercises/single-objects/method_extraction_exrc.mjs`\n\
  \n### 30.4.6 `this` 陷阱：意外遮蔽 `this`\n\n![](img/file2.svg) **意外遮蔽 `this` 只对普通函数是一个问题**\n\
  \n箭头函数不会遮蔽 `this`。\n\n考虑以下问题：我们在普通函数内部时无法无法周围作用域的 `this`，因为普通函数有自己的 `this`。换句话说，内部作用域的变量隐藏了外部作用域的变量。这被称为`shadowing`遮蔽）。以下代码是一个示例：\n\
  \n```javascript\nconst prefixer = {\n  prefix: '==> ',\n  prefixStringArray(stringArray)\
  \ {\n    return stringArray.map(\n      function (x) {\n        return this.prefix\
  \ + x; // (A)\n      });\n  },\n};\nassert.throws(\n  () => prefixer.prefixStringArray(['a',\
  \ 'b']),\n  /^TypeError: Cannot read property 'prefix' of undefined$/\n);\n```\n\
  \n在 A 行中，我们想要访问 `.prefixStringArray()` 的 `this`。但我们不能，因为周围的普通函数有自己的 `this`，它遮蔽了（阻止了访问）方法的\
  \ `this`。由于回调函数是以函数方式调用的，前面的 `this` 的值为 `undefined`。这解释了错误信息。\n\n解决这个问题最简单的方法是使用箭头函数，它没有自己的\
  \ `this`，因此不会遮蔽任何内容：\n\n```javascript\nconst prefixer = {\n  prefix: '==> ',\n \
  \ prefixStringArray(stringArray) {\n    return stringArray.map(\n      (x) => {\n\
  \        return this.prefix + x;\n      });\n  },\n};\nassert.deepEqual(\n  prefixer.prefixStringArray(['a',\
  \ 'b']),\n  ['==> a', '==> b']\n);\n```\n\n我们也可以将 `this` 存储在一个不同的变量中（A 行），这样它就不会被遮蔽：\n\
  \n```javascript\nprefixStringArray(stringArray) {\n  const that = this; // (A)\n\
  \  return stringArray.map(\n    function (x) {\n      return that.prefix + x;\n\
  \    });\n},\n```\n\n另一种选项是通过 `.bind()` 为回调指定一个固定的 `this`（A 行）：\n\n```javascript\n\
  prefixStringArray(stringArray) {\n  return stringArray.map(\n    function (x) {\n\
  \      return this.prefix + x;\n    }.bind(this)); // (A)\n  ),\n},\n```\n\n最后，`.map()`\
  \ 允许我们为 `this` 指定一个值（A 行），在调用回调时会使用该值：\n\n```javascript\nprefixStringArray(stringArray)\
  \ {\n  return stringArray.map(\n    function (x) {\n      return this.prefix + x;\n\
  \    },\n    this); // (A)\n  ),\n},\n```\n\n#### 30.4.6.1 避免意外遮蔽 `this` 的陷阱\n\n\
  如果你遵循“建议：优先使用专门的函数而非普通函数”中的建议，就可以避免意外遮蔽 `this` 的陷阱。总结如下：\n\n- 使用箭头函数作为匿名内联函数。它们没有将\
  \ `this` 作为隐式参数，且不会遮蔽它。\n- 对于命名的独立函数，你可以使用箭头函数或函数声明。如果你使用后者，请确保函数体中没有提到 `this`。\n\
  \n### 30.4.7 `this` 在各种上下文中的值（高级）\n\n`this` 的值是什么？在可调用实体内部，`this` 的值取决于该可调用实体是如何调用的以及哪种可调用实体：\n\
  \n- 函数调用：\n  - 普通函数：`this === undefined`（严格模式下）\n  - 箭头函数：`this` 与周围作用域相同（词法 `this`）\n\
  - 方法调用：`this` 是调用的接收者\n- `new`：`this` 指向新创建实例\n\n我们可以在所有顶层作用域中访问 `this`：\n\n- `<script>`\
  \ 元素：`this === global`\n- ECMAScript 模块：`this === undefined`\n- CommonJS 模块：`this\
  \ === module.exports`\n\n**提示：在顶层作用域中假设 `this` 不存在**\n我喜欢这样做，因为顶层的 `this` 令人困惑且很少用。\n\
  \n## 30.5 用于属性访问和方法调用的可选链 [ES2020]（高级）\n\n存在以下类型的可选链：\n\n```javascript\nobj?.prop\
  \ // 静态属性访问\nobj?.[expr] // 动态属性访问\nfunc?.(arg0, arg1) // 函数或调用\n```\n\n大致思路是：\n\
  \n- 如果问号之前的值既不是 `undefined` 也不是 `null`，则执行问号之后的操作。\n- 否则返回 `undefined`。\n\n### 30.5.1\
  \ 示例：可选属性访问\n\n考虑以下数据：\n\n```javascript\nconst persons = [\n  {\n    surname: 'Zoe',\n\
  \    address: {\n      name: 'Sesame Street',\n      number: '123',\n    },\n  },\n\
  \  {\n    surname: 'Mariner',\n  },\n  {\n    surname: 'Carmen',\n    address: {\n\
  \    },\n  },\n];\n```\n\n我们可以使用可选链来安全地提取街道名称：\n\n```javascript\nconst streetNames\
  \ = persons.map(\n  p => p.address?.street?.name\n);\nassert.deepEqual(\n  streetNames,\
  \ ['Sesame Street', undefined, undefined]\n);\n```\n\n#### 30.5.1.1 通过空值合并运算符处理默认值\n\
  \n空值合并运算符允许我们使用默认值 `'(no name)'` 代替 `undefined`：\n\n```javascript\nconst streetNames\
  \ = persons.map(\n  p => p.address?.street?.name ?? '(no name)'\n);\nassert.deepEqual(\n\
  \  streetNames, ['Sesame Street', '(no name)', '(no name)']\n);\n```\n\n### 30.5.2\
  \ 运算符详细说明（高级）\n\n#### 30.5.2.1 可选静态属性访问\n\n以下两个表达式等价：\n\n```javascript\no?.prop\n\
  (o !== undefined && o !== null) ? o.prop : undefined\n```\n\n示例：\n\n```javascript\n\
  assert.equal(undefined?.prop, undefined);\nassert.equal(null?.prop, undefined);\n\
  assert.equal({prop:1}?.prop, 1);\n```\n\n#### 30.5.2.2 可选动态属性访问\n\n以下两个表达式等价：\n\n\
  ```javascript\no?.[expr]\n(o !== undefined && o !== null) ? o[expr] : undefined\n\
  ```\n\n示例：\n\n```javascript\nconst key = 'prop';\nassert.equal(undefined?.[key],\
  \ undefined);\nassert.equal(null?.[key], undefined);\nassert.equal({prop:1}?.[key],\
  \ 1);\n```\n\n#### 30.5.2.3 可选函数或方法调用\n\n以下两个表达式等价：\n\n```javascript\nf?.(arg0,\
  \ arg1)\n(f !== undefined && f !== null) ? f(arg0, arg1) : undefined\n```\n\n示例：\n\
  \n```javascript\nassert.equal(undefined?.(123), undefined);\nassert.equal(null?.(123),\
  \ undefined);\nassert.equal(String?.(123), '123');\n```\n\n注意，如果该运算符的左侧不可调用，则它会产生错误：\n\
  \n```javascript\nassert.throws(\n  () => true?.(123),\n  TypeError\n);\n```\n\n\n\
  \n\n为什么？这种设计的目的是运算符只容忍故意的遗漏。一个不可调用的值（`undefined` 和 `null` 除外）可能是一个错误，应该被报告而不是被规避。\n\
  \n### 30.5.3 短路逻辑（高级）\n\n在属性访问和函数/方法调用的链中，一旦第一个可选运算符在其左侧遇到 `undefined` 或 `null`，评估就会停止：\n\
  \n```javascript\nfunction isInvoked(obj) {\n  let invoked = false;\n  obj?.a.b.m(invoked\
  \ = true);\n  return invoked;\n}\n\nassert.equal(\n  isInvoked({a: {b: {m() {}}}}),\
  \ true);\n\n// ?. 的左侧是 undefined\n// 赋值操作没有执行\nassert.equal(\n  isInvoked(undefined),\
  \ false);\n```\n\n这种行为与普通的运算符/函数不同，JavaScript 总是会在评估运算符/函数之前评估所有的操作数/参数。这被称为`短路逻辑`。其他短路运算符还有：\n\
  \n* `a && b`\n* `a || b`\n* `c ? t : e`\n\n### 30.5.4 常见问题\n\n#### 30.5.4.1 为什么\
  \ `o?.[x]` 和 `f?.()` 中有点？\n\n以下两个可选运算符的语法并不理想：\n\n```javascript\nobj?.[«expr»] \
  \         // 更好：obj?[«expr»]\nfunc?.(«arg0», «arg1») // 更好：func?(«arg0», «arg1»)\n\
  ```\n\n唉，这种不那么优雅的语法是必要的，因为要将理想语法（第一个表达式）与条件运算符（第二个表达式）区分开太复杂了：\n\n```javascript\n\
  obj?['a', 'b', 'c'].map(x => x+x)\nobj ? ['a', 'b', 'c'].map(x => x+x) : []\n```\n\
  \n#### 30.5.4.2 为什么 `null?.prop` 评估结果是 `undefined` 而不是 `null`？\n\n`?.` 运算符主要关注的是它的右侧：属性\
  \ `.prop` 是否存在？如果不存在，则提前停止。因此，保留关于其左侧的信息很少用。然而，只拥有一个“提前终止”值确实简化了问题。\n\n### 30.6\
  \ 对象作为字典（高级）\n\n对象作为记录时效果最好。但在 ES6 之前，JavaScript 没有用于字典的数据结构（ES6 引入了 Maps）。因此，必须使用对象作为字典，这带来了一个巨大的限制：键必须是字符串（symbol\
  \ 也是 ES6 引入的）。\n\n我们首先查看与字典相关但对对象作为记录也有用的对象特性。本节最后关于如何实际将对象作为字典的提示（剧透：如果可以，请使用 `Maps`）。\n\
  \n### 30.6.1 任意固定字符串作为属性键\n\n到目前为止，我们一直将对象作为记录。属性键是固定的标记，必须是有效的标识符，并在内部转换为字符串：\n\
  \n```javascript\nconst obj = {\n  mustBeAnIdentifier: 123,\n};\n\n// 获取属性\nassert.equal(obj.mustBeAnIdentifier,\
  \ 123);\n\n// 设置属性\nobj.mustBeAnIdentifier = 'abc';\nassert.equal(obj.mustBeAnIdentifier,\
  \ 'abc');\n```\n\n下一步，我们将突破属性键的限制：在本节中，我们将使用任意固定字符串作为键。在下一个子节中，我们将动态计算键。\n\n有两种技术允许我们使用任意字符串作为属性键。\n\
  \n首先，当通过对象字面量创建属性键时，我们可以对属性键加引号（使用单引号或双引号）：\n\n```javascript\nconst obj = {\n  'Can\
  \ be any string!': 123,\n};\n```\n\n其次，在获取或设置属性时，我们可以使用带有字符串的方括号：\n\n```javascript\n\
  // 获取属性\nassert.equal(obj['Can be any string!'], 123);\n\n// 设置属性\nobj['Can be any\
  \ string!'] = 'abc';\nassert.equal(obj['Can be any string!'], 'abc');\n```\n\n我们也可以将这些技术应用于方法：\n\
  \n```javascript\nconst obj = {\n  'A nice method'() {\n    return 'Yes!';\n  },\n\
  };\n\nassert.equal(obj['A nice method'](), 'Yes!');\n```\n\n### 30.6.2 计算属性键\n\n\
  到目前为止，属性键一直是对象字面量内部的固定字符串。在本节中，我们学习如何动态计算属性键。这使我们能够使用任意字符串或 symbol。\n\n对象字面量中动态计算属性键的语法灵感来源于动态访问属性。也就是说，我们可以使用方括号来包裹表达式：\n\
  \n```javascript\nconst obj = {\n  ['Hello world!']: true,\n  ['f'+'o'+'o']: 123,\n\
  \  [Symbol.toStringTag]: 'Goodbye', // (A)\n};\n\nassert.equal(obj['Hello world!'],\
  \ true);\nassert.equal(obj.foo, 123);\nassert.equal(obj[Symbol.toStringTag], 'Goodbye');\n\
  ```\n\n计算键的主要用场景是使用 symbol 作为属性键（行 A）。\n\n注意，用于获取和设置属性的方括号运算符支持任意表达式：\n\n```javascript\n\
  assert.equal(obj['f'+'o'+'o'], 123);\nassert.equal(obj['==> foo'.slice(-3)], 123);\n\
  ```\n\n方法也可以有计算属性键：\n\n```javascript\nconst methodKey = Symbol();\nconst obj = {\n\
  \  [methodKey]() {\n    return 'Yes!';\n  },\n};\n\nassert.equal(obj[methodKey](),\
  \ 'Yes!');\n```\n\n在本章的剩余部分中，我们将再次使用固定属性键（因为它们在语法上更方便）。但所有特性也适用于任意字符串和 symbol。\n\
  \n**练习：通过扩展非破坏性地更新属性（计算键）**\n\n`exercises/single-objects/update_property_test.mjs`\n\
  \n### 30.6.3 `in` 运算符：是否存在给定键的属性？\n\n`in` 运算符检查对象是否具有给定键的属性：\n\n```javascript\n\
  const obj = {\n  foo: 'abc',\n  bar: false,\n};\n\nassert.equal('foo' in obj, true);\n\
  assert.equal('unknownKey' in obj, false);\n```\n\n#### 30.6.3.1 通过真值检查检查属性是否存在\n\
  \n我们也可以使用真值检查来判断属性是否存在：\n\n```javascript\nassert.equal(obj.foo ? 'exists' : 'does\
  \ not exist', 'exists');\nassert.equal(obj.unknownKey ? 'exists' : 'does not exist',\
  \ 'does not exist');\n```\n\n之前的检查之所以有效是因为 `obj.foo` 是真值，并且读取缺失的属性会返回 `undefined`（它是假值）。\n\
  \n然而，有一个重要的注意事项：如果属性存在但值为假值（`undefined`、`null`、`false`、`0`、`\"\"` 等），真值检查将失败：\n\n\
  ```javascript\nassert.equal(obj.bar ? 'exists' : 'does not exist', 'does not exist');\
  \ // 应该是：'exists'\n```\n\n### 30.6.4 删除属性\n\n我们可以通过 `delete` 运算符删除属性：\n\n```javascript\n\
  const obj = {\n  foo: 123,\n};\nassert.deepEqual(Object.keys(obj), ['foo']);\n\n\
  delete obj.foo;\n\nassert.deepEqual(Object.keys(obj), []);\n```\n\n### 30.6.5 列出属性键\n\
  \n表 19：列出*自有*（非继承的）属性键的标准库方法。它们都返回包含字符串和/或 symbol 的数组。\n\n|  | enumerable | non-e.\
  \ | string | symbol |\n| --- | --- | --- | --- | --- |\n| `Object.keys()` | `✔`\
  \ | | `✔` |  |\n| `Object.getOwnPropertyNames()` | `✔` | `✔` | `✔` |  |\n| `Object.getOwnPropertySymbols()`\
  \ | `✔` | `✔` |    | `✔` |\n| `Reflect.ownKeys()` | `✔` | `✔` | `✔` | `✔` |\n\n\n\
  \n\n\n`tbl. [19]` 中的每个方法都会返回一个包含参数自身属性键的 `Array`。在方法名称中，我们可以看到以下区别：\n\n- `property\
  \ key`（属性键）可以是字符串或 `symbol`。\n- `property name`（属性名）是值为字符串的 `property key`。\n- `property\
  \ symbol`（属性符号）是值为 `symbol` 的 `property key`。\n\n下一节将描述 `enumerable`（可枚举性）术语，并演示每种方法。\n\
  \n### 30.6.5.1 可枚举性\n\n`Enumerability`（可枚举性）是属性的一个 `attribute`。不可枚举属性会被某些操作忽略——例如\
  \ `Object.keys()` 和扩展属性操作。默认情况下，大多数属性都是可枚举的。接下来的示例展示了如何更改这一点。它还演示了列出属性键的不同方式。\n\n\
  ```javascript\nconst enumerableSymbolKey = Symbol('enumerableSymbolKey');\nconst\
  \ nonEnumSymbolKey = Symbol('nonEnumSymbolKey');\n\n// 我们通过对象字面量创建可枚举属性\nconst obj\
  \ = {\n  enumerableStringKey: 1,\n  [enumerableSymbolKey]: 2,\n}\n\n// 对于不可枚举属性，我们需要更强大的工具\n\
  Object.defineProperties(obj, {\n  nonEnumStringKey: {\n    value: 3,\n    enumerable:\
  \ false,\n  },\n  [nonEnumSymbolKey]: {\n    value: 4,\n    enumerable: false,\n\
  \  },\n});\n\nassert.deepEqual(\n  Object.keys(obj),\n  [ 'enumerableStringKey'\
  \ ]);\nassert.deepEqual(\n  Object.getOwnPropertyNames(obj),\n  [ 'enumerableStringKey',\
  \ 'nonEnumStringKey' ]);\nassert.deepEqual(\n  Object.getOwnPropertySymbols(obj),\n\
  \  [ enumerableSymbolKey, nonEnumSymbolKey ]);\nassert.deepEqual(\n  Reflect.ownKeys(obj),\n\
  \  [\n    'enumerableStringKey', 'nonEnumStringKey',\n    enumerableSymbolKey, nonEnumSymbolKey,\n\
  \  ]);\n```\n\n`Object.defineProperties()` 将在本章稍后部分解释。\n\n### 30.6.6 通过 `Object.values()`\
  \ 列出属性值\n\n`Object.values()` 列出对象中所有可枚举属性的值：\n\n```javascript\nconst obj = {foo:\
  \ 1, bar: 2};\nassert.deepEqual(\n  Object.values(obj),\n  [1, 2]);\n```\n\n###\
  \ 30.6.7 通过 `Object.entries()` 列出属性项 [ES2017]\n\n`Object.entries()` 列出可枚举属性的键值对。每个对都被编码为一个包含两个元素的\
  \ `Array`：\n\n```javascript\nconst obj = {foo: 1, bar: 2};\nassert.deepEqual(\n\
  \  Object.entries(obj),\n  [\n    ['foo', 1],\n    ['bar', 2],\n  ]);\n```\n\n**练习：`Object.entries()`**\n\
  \n`exercises/single-objects/find_key_test.mjs`\n\n### 30.6.8 属性按确定顺序列出\n\n对象的自身的（非继承）属性始终按照以下顺序列出：\n\
  \n1. 包含整数索引的字符串键属性：按升序。\n2. 剩余的字符串键属性：按照它们被添加的顺序。\n3. 符号键属性：按照它们被添加的顺序。\n\n下面的示例演示了如何根据这些规则对属性键进行排序：\n\
  \n```javascript\n> Object.keys({b:0,a:0, 10:0,2:0})\n[ '2', '10', 'b', 'a' ]\n```\n\
  \n**属性顺序**\n\nECMAScript 规范详细描述了属性是如何排序的。\n\n### 30.6.9 通过 `Object.fromEntries()`\
  \ 组装对象 [2019]\n\n给定一个包含 `[key, value]` 对的迭代器，`Object.fromEntries()` 会创建一个对象：\n\n\
  ```javascript\nassert.deepEqual(\n  Object.fromEntries(['foo',1], ['bar',2]]),\n\
  \  {\n    foo: 1,\n    bar: 2,\n  });\n```\n\n`Object.fromEntries()` 是 `Object.entries()`\
  \ 的相反操作。为了演示这两者，我们接下来的小节中使用它们来实现 `Underscore` 库中的两个函数。\n\n#### 30.6.9.1 示例：`pick(object,\
  \ ...keys)`\n\n`pick` 返回 `object` 的拷贝，该拷贝仅包含那些键作为参数列出的属性：\n\n```javascript\nconst\
  \ address = {\n  street: 'Evergreen Terrace',\n  number: '742',\n  city: 'Springfield',\n\
  \  state: 'NT',\n  zip: '49007',\n};\nassert.deepEqual(\n  pick(address, 'street',\
  \ 'number'),\n  {\n    street: 'Evergreen Terrace',\n    number: '742',\n  }\n);\n\
  ```\n\n我们可以如下实现 `pick()`：\n\n```javascript\nfunction pick(object, ...keys) {\n \
  \ const filteredEntries = Object.entries(object)\n    .filter(([key, _value]) =>\
  \ keys.includes(key));\n  return Object.fromEntries(filteredEntries);\n}\n```\n\n\
  #### 30.6.9.2 示例：`invert(object)`\n\n`invert` 返回 `object` 的拷贝，其中所有属性的键和值都交换了了：\n\
  \n```javascript\nassert.deepEqual(\n  invert({a: 1, b: 2, c: 3}),\n  {1: 'a', 2:\
  \ 'b', 3: 'c'}\n);\n```\n\n我们可以这样实现 `invert()`：\n\n```javascript\nfunction invert(object)\
  \ {\n  const reversedEntries = Object.entries(object)\n    .map(([key, value]) =>\
  \ [value, key]);\n  return Object.fromEntries(reversedEntries);\n}\n```\n\n####\
  \ 30.6.9.3 `Object.fromEntries()` 的简单实现\n\n以下函数是 `Object.fromEntries()` 的简化版本：\n\
  \n```javascript\nfunction fromEntries(iterable) {\n  const result = {};\n  for (const\
  \ [key, value] of iterable) {\n    let coercedKey;\n    if (typeof key === 'string'\
  \ || typeof key === 'symbol') {\n      coercedKey = key;\n    } else {\n      coercedKey\
  \ = String(key);\n    }\n    result[coercedKey] = value;\n  }\n  return result;\n\
  }\n```\n\n**练习：`Object.entries()` 和 `Object.fromEntries()`**\n\n`exercises/single-objects/omit_properties_test.mjs`\n\
  \n### 30.6.10 使用对象作为字典的陷阱\n\n如果我们使用普通对象（通过对象字面量创建）作为字典，我们必须注意两个陷阱。\n\n第一个陷阱是 `in`\
  \ 运算符也会找到继承的属性：\n\n```javascript\nconst dict = {};\nassert.equal('toString' in dict,\
  \ true);\n```\n\n我们希望 `dict` 被视为空，但 `in` 运算符检测到了它从其原型 `Object.prototype` 继承的属性。\n\
  \n第二个陷阱是我们无法使用属性键 `__proto__`，因为它具有特殊功能（它设置对象的原型）：\n\n```javascript\nconst dict\
  \ = {};\ndict['__proto__'] = 123;\n// 没有属性被添加到 dict 中：\nassert.deepEqual(Object.keys(dict),\
  \ []);\n```\n\n\n\n\n\n```javascript\nconst dict = Object.create(null); // no prototype\n\
  \nassert.equal('toString' in dict, false); // (A)\n\ndict['__proto__'] = 123;\n\
  assert.deepEqual(Object.keys(dict), ['__proto__']);\n```\n\n我们避开了这两个陷阱：\n\n*   首先，没有原型的对象不会继承任何属性（第\
  \ A 行）。\n*   其次，在现代 JavaScript 中，`__proto__` 是通过 `Object.prototype` 实现的。这意味着如果 `Object.prototype`\
  \ 不在原型链中，它就会被禁用。\n\n![](img/file6.svg) **练习：使用对象作为字典**\n\n`exercises/single-objects/simple_dict_test.mjs`\n\
  \n## 30.7 标准方法（高级）\n\n`Object.prototype` 定义了几个标准方法，可以通过重写这些方法来配置语言处理对象的方式。其中两个重要的是：\n\
  \n*   `.toString()`\n*   `.valueOf()`\n\n### 30.7.1 `.toString()`\n\n`.toString()`\
  \ 决定了对象如何转换为字符串：\n\n```\n> String({toString() { return 'Hello!' }})\n'Hello!'\n\
  > String({})\n'[object Object]'\n```\n\n### 30.7.2 `.valueOf()`\n\n`.valueOf()`\
  \ 决定了对象如何转换为数字：\n\n```\n> Number({valueOf() { return 123 }})\n123\n> Number({})\n\
  NaN\n```\n\n## 30.8 高级主题\n\n以下小节对几个高级主题进行了简要概述。\n\n### 30.8.1 `Object.assign()`\
  \ [ES6]\n\n`Object.assign()` 是工具方法：\n\n```javascript\nObject.assign(target, source_1,\
  \ source_2, ···)\n```\n\n该表达式将 `source_1` 的所有属性赋值给 `target`，然后是 `source_2` 的属性，以此此类推。最后，它返回\
  \ `target` ——例如：\n\n```javascript\nconst target = { foo: 1 };\n\nconst result =\
  \ Object.assign(\n  target,\n  {bar: 2},\n  {baz: 3, bar: 4});\n\nassert.deepEqual(\n\
  \  result, { foo: 1, bar: 4, baz: 3 }); // target 被修改并返回了：\nassert.equal(result,\
  \ target);\n```\n\n`Object.assign()` 的用场景与扩展属性（spread properties）类似。在某种意义上，它是破坏性地展开。\n\
  \n### 30.8.2 冻结对象 [ES5]\n\n`Object.freeze(obj)` 使 `obj` 变得完全不可变：我们无法更改属性、添加属性或更改其原型\
  \ ——例如：\n\n```javascript\nconst frozen = Object.freeze({ x: 2, y: 5 });\nassert.throws(\n\
  \  () => { frozen.x = 7 },\n  {\n    name: 'TypeError',\n    message: /^Cannot assign\
  \ to read only property 'x'/,\n  });\n```\n\n有一个注意事项：`Object.freeze(obj)` 是浅冻结的。也就是说，只有\
  \ `obj` 本身的属性被冻结了，存储在属性中的对象则不会。\n\n![](img/file1.svg) **更多信息**\n\n有关冻结和其他锁定对象的更多信息，请参阅\
  \ [*Deep JavaScript*](https://exploringjs.com/deep-js/ch_protecting-objects.html)。\n\
  \n### 30.8.3 属性特性和属性描述符 [ES5]\n\n就像对象由属性组成一样，属性是由*特性*组成的。属性的值只是若干特性中的之一。其他的包括：\n\
  \n*   `writable`：是否可以更改属性的值？\n*   `enumerable`：属性是否会被 `Object.keys()`、扩展操作等考虑在内？\n\
  \n当我们使用处理属性特性的操作时，属性是通过*属性描述符*（property descriptors）来指定的：即每个属性都代表一个特性的对象。例如，以下是读取属性\
  \ `obj.foo` 特性的方法：\n\n```javascript\nconst obj = { foo: 123 };\nassert.deepEqual(\n\
  \  Object.getOwnPropertyDescriptor(obj, 'foo'),\n  {\n    value: 123,\n    writable:\
  \ true,\n    enumerable: true,\n    configurable: true,\n  });\n```\n\n而以下是设置属性\
  \ `obj.bar` 特性的方法：\n\n```javascript\nconst obj = {\n  foo: 1,\n  bar: 2,\n};\n\n\
  assert.deepEqual(Object.keys(obj), ['foo', 'bar']);\n\n// 从 Object.keys() 中隐藏属性\
  \ `bar`\nObject.defineProperty(obj, 'bar', {\n  enumerable: false,\n});\n```\n\n\
  \n\n原型（Prototype）是 JavaScript 唯一的继承机制：每个对象都有一个原型，原型要么是`null`要么是一个对象。在后者的情况下，该对象会继承原型的所有属性。\n\
  \n在对象字面量中，可以通过特殊属性 `__proto__` 设置原型：\n\n```\n[](#cb747-1)const proto = {\n[](#cb747-2)\
  \  protoProp: 'a',\n[](#cb747-3)};\n[](#cb747-4)const obj = {\n[](#cb747-5)  __proto__:\
  \ proto,\n[](#cb747-6)  objProp: 'b',\n[](#cb747-7)};\n[](#cb747-8)\n[](#cb747-9)//\
  \ obj 继承了 .protoProp:\n[](#cb747-10)assert.equal(obj.protoProp, 'a');\n[](#cb747-11)assert.equal('protoProp'\
  \ in obj, true);\n```\n\n考虑到原型对象本身也可以拥有原型，我们得到了一个对象链——所谓的*原型链*（prototype chain）。这意味着继承带给我们一种印象，认为我们正在处理单个对象，但实际上我们处理的是对象链。\n\
  \n图 10 显示了 `obj` 的原型链是什么像。\n\n![](img/file19.svg)\n\n图 10：`obj` 启动了一个对象链，该链通过 `proto`\
  \ 和其他对象继续下去。\n\n未继承的属性被称为*自身属性*（own properties）。`obj` 拥有一个自身属性，`.objProp`。\n\n###\
  \ 31.1.1 JavaScript 的操作：所有属性 vs 自身属性\n\n某些操作会考虑所有属性（自身的和继承的）——例如，获取属性：\n\n```\n\
  > const obj = { foo: 1 };\n> typeof obj.foo // 自身\n'number'\n> typeof obj.toString\
  \ // 继承\n'function'\n```\n\n其他操作只考虑自身属性——例如，`Object.keys()`：\n\n```\n> Object.keys(obj)\n\
  [ 'foo' ]\n```\n\n继续阅读另一个也只考虑自身属性的操作：设置属性。\n\n### 31.1.2 陷阱：只有原型链的第一个成员被修改\n\n原型链中一个反直觉的方面是，通过对象设置任何属性（即使是继承的属性）只会改变该对象本身——永远不会改变其中一个原型。\n\
  \n考虑以下对象 `obj`：\n\n```\n[](#cb750-1)const proto = {\n[](#cb750-2)  protoProp: 'a',\n\
  [](#cb750-3)};\n[](#cb750-4)const obj = {\n[](#cb750-5)  __proto__: proto,\n[](#cb750-6)\
  \  objProp: 'b',\n[](#cb750-7)};\n```\n\n在接下来的代码段中，我们设置了继承的属性 `obj.protoProp`（行\
  \ A）。这通过创建一个自身属性来“改变”了它：当读取 `obj.protoProp` 时，会先找到自身属性，其值会覆盖继承属性的值。\n\n```\n[](#cb751-1)//\
  \ 起初，obj 拥有一个自身属性\n[](#cb751-2)assert.deepEqual(Object.keys(obj), ['objProp']);\n\
  [](#cb751-3)\n[](#cb751-4)obj.protoProp = 'x'; // (A)\n[](#cb751-5)\n[](#cb751-6)//\
  \ 我们创建了一个新的自身属性：\n[](#cb751-7)assert.deepEqual(Object.keys(obj), ['objProp', 'protoProp']);\n\
  [](#cb751-8)\n[](#cb751-9)// 继承的属性未 way：\n[](#cb751-10)assert.equal(proto.protoProp,\
  \ 'a');\n[](#cb751-11)// 自身属性覆盖了继承属性：\n[](#cb751-12)assert.equal(obj.protoProp,\
  \ 'x');\n```\n\n`obj` 的原型链如图 11 所示。\n\n![](img/file20.svg)\n\n图 11：`obj` 的自身属性 `.protoProp`\
  \ 覆盖了来自 `proto` 的属性。\n\n### 31.1.3 原型技巧（进阶）\n\n#### 31.1.3.1 最佳实践：除对象字面量外，避免使用伪属性\
  \ `__proto__`\n\n正如我们稍后将在 #ch032.xhtml) 中看到的，并不是所有对象都具有它。然而，对象字面量中的 `__proto__`\
  \ 是不同的。它是内置功能且始终可用。\n\n推荐的获取和设置原型的方法有：\n\n*   获取原型最佳方法是通过以下方法：\n    ```\n    Object.getPrototypeOf(obj)\n\
  \    ```\n*   设置原型最佳方法是在创建对象时——通过对象字面量中的 `__proto__` 或通过：\n    ```\n    Object.create(proto)\n\
  \    ```\n\n如果你必须这样做，可以使用 `Object.setPrototypeOf()` 修改现有对象的原型。可能会影响性能。\n\n这些功能的使用方式：\n\
  \n```\n[const proto1 = {};\n[](#cb754-2)const proto2 = {};\n[](#cb754-3)const obj\
  \ = Object.create(proto1);\n[](#cb754-4)assert.equal(Object.getPrototypeOf(obj),\
  \ proto1);\n[](#cb754-5)Object.setPrototypeOf(obj, proto2);\n[](#cb754-6)assert.equal(Object.getPrototypeOf(obj),\
  \ proto2);\n```\n\n#### 31.1.3.2 检查：一个对象是另一个对象的原型？\n\n到目前为止，“`p` 是 `o` 的原型”一直意味着“`p`\
  \ 是 `o` 的直接原型”。但它可以被松散使用，意味着 `p` 在 `o` 的原型链中。这种松散的关系可以通过以下方式检查：\n\n```\na.isPrototypeOf(b)\n\
  ```\n\n例如：\n\n```\n[](#cb756-1)a = {};\n[](#cb756-2)b = {__proto__: a};\n[](#cb756-3)c\
  \ = {__proto__: b};\n[](#cb756-4)assert.equal(a.isPrototypeOf(b), true);\n[](#cb756-5)assert.equal(a.isPrototypeOf(c),\
  \ true);\n[](#cb756-6)assert.equal(b.isPrototypeOf(a), false);\n[](#cb756-7)assert.equal(c.isPrototypeOf(a),\
  \ false);\n```\n\n### 31.1.4 通过原型共享数据\n\n我们之前处理过代表人的 `jane` 和 `tarzan` 两个对象。它们都有两个方法。我们如何避免重复方法呢？\n\
  \n考虑以下：\n\n```\n[](#cb757-1)const PersonProto = {\n[](#cb757-2)  describe() {\n\
  [](#cb757-3)    return 'Person named '+this.name;\n[](#cb757-4)  },\n[](#cb757-5)};const\
  \ jane = {\n[](#cb757-6)  __proto__: PersonProto,\n[](#cb757-7)  name: 'Jane',\n\
  [](#cb757-8)};const tarzan = {\n[](#cb757-9)  __proto__: PersonProto,\n[](#cb757-10)\
  \  name: 'Tarzan',\n[](#cb757-11)};\n```\n\n原型的名称反映了 `jane` 和 `tarzan` 都是人。\n\n\
  ![](img/file21.svg)\n\n图 12：`jane` 和 `tarzan` 通过它们的共同原型 `PersonProto` 共享方法 `.describe()`。\n\
  \n图 12 展示了三个对象是如何连接的：底部的对象现在包含了 `jane` 和 `tarzan` 特有的属性。顶部的对象包含了它们共享的属性。\n\n当你进行方法调用\
  \ `jane.describe()` 时，`this` 指向该方法调用的接收者 `jane`（图表的左下角）。这就是为什么方法仍然有效。`tarzan.describe()`\
  \ 的原理类似。\n\n```\n[](#cb759-1)assert.equal(jane.describe(), 'Person named Jane');\n\
  [](#cb759-2)assert.equal(tarzan.describe(), 'Person named Tarzan');\n```\n\n## 31.2\
  \ 类\n\n我们现在准备好处理类了，类本质上是设置原型链的紧凑语法。在底层，JavaScript 的类是非传统的的。但在你与它们工作时很少看到这一点。对于使用过其他面向对象编程语言的人来说，它们应该很熟悉。\n\
  \n### 31.2.1 人的类\n\n我们之前处理过代表人的 `jane` 和 `tarzan` 单个对象。让我们使用类声明来实现对象的工厂：\n\n```javascript\n\
  [](#cb760-1)class Person {\n[](#cb760-2)  constructor(name) {\n[](#cb760-3)    this.name\
  \ = name;\n[](#cb760-4)  }\n[](#cb760-5)  describe() {\n[](#cb760-6)    return 'Person\
  \ named '+this.name;\n[](#cb760-7)  }\n[](#cb760-8)}\n```\n\n\n\n\n`jane` 和 `tarzan`\
  \ 现在可以通过 `new Person()` 创建了：\n\n```javascript\nconst jane = new Person('Jane');\n\
  assert.equal(jane.name, 'Jane');\nassert.equal(jane.describe(), 'Person named Jane');\n\
  \nconst tarzan = new Person('Tarzan');\nassert.equal(tarzan.name, 'Tarzan');\nassert.equal(tarzan.describe(),\
  \ 'Person named Tarzan');\n```\n\n`Person` 类有两个方法：\n\n*   普通方法 `.describe()`\n*\
  \   特殊方法 `.constructor()`，它在创建完新实例后被直接调用，并初始化该实例。它接收传递给 `new` 运算符的参数（跟在类名之后）。如果你不需要任何参数来设置新实例，可以省略构造函数。\n\
  \n### 31.2.1.1 类表达式\n\n有两种类的 `class definitions`（定义类的方式）：\n\n*   `class declarations`（类声明），我们在上一节中见过。\n\
  *   `class expressions`（类表达式），我们接下来将看到。\n\n类表达式可以是匿名的，也可以是具名的：\n\n```javascript\n\
  // 匿名类表达式\nconst Person = class { ... };\n\n// 具名类表达式\nconst Person = class MyClass\
  \ { ... };\n```\n\n具名类表达式的名称与具名函数表达式的名字 类似。\n\n这是对类的初步了解。我们将很快探索更多特性，但首先我们得学习类的内部原理。\n\
  \n### 31.2.2 类的底层原理\n\n类的底层涉及很多操作。让我们看看 `jane` 的结构图（见图 13）。\n\n![](img/file22.svg)\n\
  \n图 13：`Person` 类拥有 `.prototype` 属性，该属性指向一个对象，它是 `Person` 所有实例的原型。`jane` 就是其中一个实例。\n\
  \n`Person` 类的主要目的是在右侧建立原型链（`jane`，然后是 `Person.prototype`）。有趣的是，类 `Person` 内部的两个构造（`.constructor`\
  \ 和 `.describe()`）都是为 `Person.prototype` 创建了属性，而不是为 `Person`。\n\n这种略显奇异的方法是为了向后兼容：在类出现之前，`constructor\
  \ functions`（普通函数，通过 `new` 运算符调用）经常被用作对象的工厂。类在很大程度上是构造函数的更好语法，因此保持了与旧代码兼容。这解释了为什么类是函数：\n\
  \n```javascript\n> typeof Person\n'function'\n```\n\n在本书中，我交叉使用 `constructor (function)`\
  \ 和 `class` 这两个术语。\n\n混淆 `.__proto__` 和 `.prototype` 是很容易的。希望图 13 能清楚它们之间的区别：\n\n\
  *   `.__proto__` 是用于访问对象原型的伪属性。\n*   `.prototype` 是一个普通属性，它的特殊之处仅仅是因为 `new` 运算符使用它的方式。这个名字并不理想：`Person.prototype`\
  \ 并不指向 `Person` 本身的原型，而是指向所有 `Person` 实例的原型。\n\n### 31.2.2.1 `Person.prototype.constructor`（进阶）\n\
  \n图 13 中有一个细节我们尚未查看：`Person.prototype.constructor` 指回了 `Person`：\n\n```javascript\n\
  > Person.prototype.constructor === Person\ntrue\n```\n\n这种设置也是为了向后兼容。但它有两个额外的处。\n\
  \n首先，类的每个实例都继承了属性 `.constructor`。因此，给定一个实例，你可以用它来创建“相似”的对象：\n\n```javascript\nconst\
  \ jane = new Person('Jane');\n\nconst cheeta = new jane.constructor('Cheeta');\n\
  // cheeta 也是 Person 的一个实例\n// (instanceof 运算符稍后解释)\nassert.equal(cheeta instanceof\
  \ Person, true);\n```\n\n其次，你可以获取创建给定实例的类名：\n\n```javascript\nconst tarzan = new\
  \ Person('Tarzan');\n\nassert.equal(tarzan.constructor.name, 'Person');\n```\n\n\
  ### 31.2.3 类定义：原型属性\n\n在类类声明体中的所有构造都会创建 `Foo.prototype` 的属性。\n\n```javascript\n\
  class Foo {\n  constructor(prop) {\n    this.prop = prop;\n  }\n  protoMethod()\
  \ {\n    return 'protoMethod';\n  }\n  get protoGetter() {\n    return 'protoGetter';\n\
  \  }\n}\n```\n\n让我们按顺序检查它们：\n\n*   `.constructor()` 在创建 `Foo` 的新实例后被调用，用于设置该实例。\n\
  *   `.protoMethod()` 是普通方法。它存储在 `Foo.prototype` 中。\n*   `.protoGetter` 是存储在 `Foo.prototype`\
  \ 中的 getter。\n\n下面的交互使用了类 `Foo`：\n\n```javascript\n> const foo = new Foo(123);\n\
  > foo.prop\n123\n\n> foo.protoMethod()\n'protoMethod'\n> foo.protoGetter\n'protoGetter'\n\
  ```\n\n### 31.2.4 类定义：静态属性\n\n在类类声明体中的所有构造都会创建所谓的 `static` 属性——`Bar` 自身的属性。\n\n\
  ```javascript\nclass Bar {\n  static staticMethod() {\n    return 'staticMethod';\n\
  \  }\n  static get staticGetter() {\n    return 'staticGetter';\n  }\n}\n```\n\n\
  静态方法和静态 getter 的用法如下：\n\n```javascript\n> Bar.staticMethod()\n'staticMethod'\n>\
  \ Bar.staticGetter\n'staticGetter'\n```\n\n### 31.2.5 `instanceof` 运算符\n\n`instanceof`\
  \ 运算符告诉你一个值是否是给定类的实例：\n\n```javascript\n> new Person('Jane') instanceof Person\n\
  true\n> ({}) instanceof Person\nfalse\n> ({}) instanceof Object\ntrue\n> [] instanceof\
  \ Array\ntrue\n```\n\n在我们学习了子类化后，将在之后 详细探索 `instanceof` 运算符。\n\n### 31.2.6 为什么我推荐类\n\
  \n我推荐使用类的原因如下：\n\n*   类是对象创建和继承的通用标准，现在被框架（React, Angular, Ember 等）被广泛支持。这是对以前方式的改进，以前每个框架都有自己的继承库。\n\
  *   它们有助于 IDE 和类型检查器等工具工作，并并在那里开启新功能。\n*   如果你是从其他语言转向 JavaScript 并习惯了类，那么你可以更快地上手。\n\
  *   JavaScript 引擎优化了它们。也就是说，使用类的代码几乎总是比使用自定义继承库的代码快。\n*   你可以对内置构造函数（如 `Error`）进行子类。\n\
  \n这并不意味着类是完美的：\n\n*   存在过度继承的风险。\n*   存在在类中放置过多功能的风险（而某些功能通常被放在函数中）。\n*   它们在表面和底层的运行原理完全不同。换句话说，语法和语义之间存在脱节。有两个例子：\n\
  \n    *   在类 `C` 内部定义方法会在对象 `C.prototype` 中创建一个一个方法。\n    *   类是函数。\n\n产生这种脱节的动机是向后兼容。坦率地说，这种脱节在实践中很少引起问题；如果你顺应类所装的样子来做，通常是没有问题的。\n\
  \n![](img/file6.svg) **练习：编写一个类**\n\n`exercises/proto-chains-classes/point_class_test.mjs`\n\
  \n## 31.3 类的私有数据\n\n本节描述了从外部隐藏对象部分数据的技术。我们在类的语文中讨论它们，但它们也适用于直接创建的对象（例如通过对象字面量创建）。\n\
  \n### 31.3.1 私有数据：命名约定\n\n\n\n\n第一种技术通过在属性名称前加上下划线来使属性变为私有。这并不能任何方式保护该属性；它只是向外部信号：“你不需要知道这个属性。”\n\
  \n在下面的代码中，属性 `._counter` 和 `._action` 是私有的。\n\n```javascript\nclass Countdown {\n\
  \  constructor(counter, action) {\n    this._counter = counter;\n    this._action\
  \ = action;\n  }\n  dec() {\n    this._counter--;\n    if (this._counter === 0)\
  \ {\n      this._action();\n    }\n  }\n}\n\n// 这两个属性并不是真正的私有：\nassert.deepEqual(\n\
  \  Object.keys(new Countdown()),\n  ['_counter', '_action']);\n```\n\n使用这种技术，你无法获得任何保护，而且私有名称可能会冲突。好的一处是它很容易使用。\n\
  \n### 31.3.2 私有数据：WeakMaps\n\n另一种技术是使用 `WeakMaps`。具体工作原理在 WeakMaps 章节 中进行了解释。以下是预览：\n\
  \n```javascript\nconst _counter = new WeakMap();\nconst _action = new WeakMap();\n\
  \nclass Countdown {\n  constructor(counter, action) {\n    _counter.set(this, counter);\n\
  \    _action.set(this, action);\n  }\n  dec() {\n    let counter = _counter.get(this);\n\
  \    counter--;\n    _counter.set(this, counter);\n    if (counter === 0) {\n  \
  \    _action.get(this)();\n    }\n  }\n}\n\n// 这两个伪属性是真正的私有：\nassert.deepEqual(\n\
  \  Object.keys(new Countdown()),\n  []);\n```\n\n这种技术可以提供免受外部访问的高度保护，而且不会发生任何名称冲突。但它的使用也更复杂。\n\
  \n### 31.3.3 私有数据的更多技术\n\n本书解释了类中私有数据最重要的技术。可能很快就会有内置支持。详情请参阅 ECMAScript 提议 [“类公共实例字段\
  \ & 私有实例字段”](https://github.com/tc39/proposal-class-fields)。\n\n额外的几种技术在 [*探索 ES6*](https://exploringjs.com/es6/ch_classes.html#sec_private-data-for-classes)\
  \ 中有所介绍。\n\n## 31.4 子类\n\n类也可以子类（“扩展”）现有类。例如，下面的类 `Employee` 子类了 `Person`：\n\n```javascript\n\
  class Person {\n  constructor(name) {\n    this.name = name;\n  }\n  describe()\
  \ {\n    return `Person named ${this.name}`;\n  }\n  static logNames(persons) {\n\
  \    for (const person of persons) {\n      console.log(person.name);\n    }\n \
  \ }\n}\n\nclass Employee extends Person {\n  constructor(name, title) {\n    super(name);\n\
  \    this.title = title;\n  }\n  describe() {\n    return super.describe() +\n \
  \     ` (${this.title})`;\n  }\n}\n\nconst jane = new Employee('Jane', 'CTO');\n\
  assert.equal(\n  jane.describe(),\n  'Person named Jane (CTO)');\n```\n\n两点注释：\n\
  \n*   在 `.constructor()` 方法内部，你必须在访问 `this` 之前通过 `super()` 调用超构造函数。这是因为在调用超构造函数之前\
  \ `this` 并不存在（这种现象是类特有的）。\n*   静态方法也会被继承。例如，`Employee` 继承了静态方法 `.logNames()`。\n\
  ```\n\n\n\n只有当 `Object.prototype` 在一个对象的原型链中时，该对象才是 `Object` 的实例。通过各种字面量创建的大多数都是\
  \ `Object` 的实例：\n\n```\n> ({}) instanceof Object\ntrue\n> (() => {}) instanceof\
  \ Object\ntrue\n> /abc/ug instanceof Object\ntrue\n```\n\n没有原型的对象不是 `Object` 的实例：\n\
  \n```javascript\n> ({ __proto__: null }) instanceof Object\nfalse```\n\n`Object.prototype`\
  \ 结束了大多数原型链。它的原型是 `null`，这意味着它也不是 `Object` 的实例：\n\n```javascript\n> Object.prototype\
  \ instanceof Object\nfalse\n```\n\n### 31.4.3.5 伪属性 `.__proto__` 究竟是如何工作的？\n\n伪属性\
  \ `.__proto__` 是通过 `Object` 类通过 getter 和 setter 实现的。它的实现方式可能如下：\n\n```javascript\n\
  class Object {\n  get __proto__() {\n    return Object.getPrototypeOf(this);\n \
  \ }\n  set __proto__(other) {\n    Object.setPrototypeOf(this, other);\n  }\n  //\
  \ ···\n}\n```\n\n这意味着你可以通过创建一个在原型链中不包含 `Object.prototype` 的对象来关闭 `.__proto__`（参见前一节）：\n\
  \n```javascript\n> '__proto__' in {}\ntrue\n> '__proto__' in { __proto__: null }\n\
  false\n```\n\n### 31.4.4 分派方法调用与直接方法调用（高级）\n\n让我们检 true 类中的方法调用是如何工作的。我们重新回顾早之前的\
  \ `jane`：\n\n```javascript\nclass Person {\n  constructor(name) {\n    this.name\
  \ = name;\n  }\n  describe() {\n    return 'Person named '+this.name;\n  }\n}\n\
  const jane = new Person('Jane');\n```\n\n图 17 有一个带有 `jane` 原型链的图。\n\n![](img/file26.svg)\n\
  \n图 17：`jane` 的原型链从 `jane` 开始，继续到 `Person.prototype`。\n\n普通的方法调用是*分派的*（dispatched）——方法调用\
  \ `jane.describe()` 分两个步骤完成：\n\n*   **分派**（Dispatch）：在 `jane` 的原型链中，找到键为 `'describe'`\
  \ 的第一个属性并获取其值。\n\n    ```javascript\n    const func = jane.describe;\n    ```\n\n\
  *   **调用**（Call）：调用该值，同时将 `this` 设置为 `jane`。\n\n    ```javascript\n    func.call(jane);\n\
  \    ```\n\n这种动态查找并调用方法的方法被称为*动态分派*（dynamic dispatch）。\n\n你可以*直接*进行相同的方法调用，而无需经过分派：\n\
  \n```javascript\nPerson.prototype.describe.call(jane)\n```\n\n这一次，我们通过 `Person.prototype.describe`\
  \ 直接指向该方法，而不在原型链中搜索它。我们还通过 `.call()` 以不同的方式指定了 `this`。\n\n注意，`this` 始终指向原型链的起点。这使得\
  \ `.describe()` 能够访问 `.name`。\n\n#### 31.4.4.1 借用方法\n\n当你处理 `Object.prototype` 的方法时，直接方法调用变得变得非常有用。例如，`Object.prototype.hasOwnProperty(k)`\
  \ 检查 `this` 是否拥有键为 `k` 的非继承属性：\n\n```javascript\n> const obj = { foo: 123 };\n>\
  \ obj.hasOwnProperty('foo')\ntrue\n> obj.hasOwnProperty('bar')\nfalse\n```\n\n然而，在对象的原型链中，可能存在另一个键为\
  \ `'hasOwnProperty'` 的属性，它覆盖了 `Object.prototype` 中的方法。这时，分派的方法调用将无法工作：\n\n```javascript\n\
  > const obj = { hasOwnProperty: true };\n> obj.hasOwnProperty('bar')\nTypeError:\
  \ obj.hasOwnProperty is not a function\n```\n\n解决方法是使用直接方法调用：\n\n```javascript\n\
  > Object.prototype.hasOwnProperty.call(obj, 'bar')\nfalse\n> Object.prototype.hasOwnProperty.call(obj,\
  \ 'hasOwnProperty')\ntrue\n```\n\n这种直接方法调用通常简写为如下：\n\n```javascript\n> ({}).hasOwnProperty.call(obj,\
  \ 'bar')\nfalse\n> ({}).hasOwnProperty.call(obj, 'hasOwnProperty')\ntrue\n```\n\n\
  这种模式看起来可能效率低下，但大多数引擎都对这种模式进行了优化，因此性能不应该是问题。\n\n### 31.4.5 混入类（高级）\n\nJavaScript\
  \ 的类系统仅支持*单继承*。也就是说，每个类最多有一个超类。绕过这一限制的方法是通过一种称为*混入类*（mixin classes，简写：*mixins*）的技术。\n\
  \n主意是：假设我们想让类 `C` 继承两个超类 `S1` 和 `S2`。那是*多重继承*，JavaScript 并不支持。\n\n我们的解决方法是将 `S1`\
  \ 和 `S2` 转换为*混入*，即子类的工厂：\n\n```javascript\nconst S1 = (Sup) => class extends Sup\
  \ { /*···*/ };\nconst S2 = (Sup) => class extends Sup { /*···*/ };\n```\n\n这两个函数每一个都返回一个扩展给定超类\
  \ `Sup` 的类。我们如下创建类 `C`：\n\n```javascript\nclass C extends S2(S1(Object)) {\n  /*···*/\n\
  }\n```\n\n现在我们有一个类 `C`，它继承自类 `S2`，`S2` 继承自类 `S1`，`S1` 继承自 `Object`（大多数类都是隐式这样做的）。\n\
  \n#### 31.4.5.1 示例：用于品牌管理的混入\n\n我们实现了一个混入 `Branded`，它拥有了用于设置和获取对象品牌的辅助方法：\n\n```javascript\n\
  const Branded = (Sup) => class extends Sup {\n  setBrand(brand) {\n    this._brand\
  \ = brand;\n    return this;\n  }\n  getBrand() {\n    return this._brand;\n  }\n\
  };\n```\n\n我们使用这个混入为类 `Car` 实现品牌管理：\n\n```javascript\nclass Car extends Branded(Object)\
  \ {\n  constructor(model) {\n    super();\n    this._model = model;\n  }\n  toString()\
  \ {\n    return `${this.getBrand()} ${this._model}`;\n  }\n}\n```\n\n```javascript\n\
  const car = new Car('Corolla');\ncar.setBrand('Toyota');\nconsole.log(car.toString());\
  \ // Toyota Corolla\n```\n\n#### 31.4.5.2 混入的优势\n\n混入让我们从单继承的限制中解放：\n\n*   同一个类可以被多个混入使用。\n\
  *   同一个混入可以被多个类使用。\n\n### 31.5 FAQ：对象\n\n#### 31.5.1 为什么对象会保留插入顺序？\n\n原则上，对象是无序的。属性排序的主要目的是为了确保列出条目、键或值的的操作是确定性的。这有助于，例如在测试中。\n\
  \n![](img/file7.svg) **测试**\n\n参见测验应用。\n\n\n\n\n\n-   **数据消费者：** 另一方面，你有一整类构造和算法，它们只需要*顺序地*访问其输入：一次处理一个值，直到所有值都被访问完毕。示例包括\
  \ `for-of` 循环和展开到函数调用中（通过 `...`）。\n\n迭代协议通过 `Iterable` 接口连接了这两组数据：数据源通过“它”顺序交付内容；数据消费者通过“它”获取输入。\n\
  \n![](img/file27.svg)\n\n图 18：如 `for-of` 循环等数据消费者使用了 `Iterable` 接口。如 `Arrays` 等数据源实现了该接口。\n\
  \n图 18 展示了迭代是如何工作的：数据消费者使用 `Iterable` 接口；数据源实现它。\n\n![](img/file5.svg) **JavaScript\
  \ 实现接口的方式**\n\n在 JavaScript 中，如果一个对象拥有该接口所描述的所有方法，则它就实现了该接口。本章提到的接口仅存在于 ECMAScript\
  \ 规范中。\n\n数据源和消费者都从这种安排中获益：\n\n- 如果你开发了一个新的数据结构，你只需要实现 `Iterable`，一组工具就可以立即应用到它上。\n\
  - 如果你编写使用迭代的代码，它会自动与许多数据源配合。\n\n## 32.2 核心迭代构造：可迭代对象和迭代器\n\n两个角色（由接口描述）构成了迭代的核心（图\
  \ 19）：\n\n-   *可迭代对象*（iterable）是一个可以顺序遍历内容的的对象。\n-   *迭代器*（iterator）是用于遍历的指针。\n\n\
  ![](img/file28.svg)\n\n图 19：迭代有两个主要接口：`Iterable` 和 `Iterator`。前者有一个方法可以返回后者。\n\n\
  这些是用于迭代协议接口的类型定义（使用 TypeScript 语法）：\n\n```\ninterface Iterable<T> {\n  [Symbol.iterator]()\
  \ : Iterator<T>;\n}\n\ninterface Iterator<T> {\n  next() : IteratorResult<T>;\n\
  }\n\ninterface IteratorResult<T> {\n  value: T;\n  done: boolean;\n}\n```\n\n接口的用法如下：\n\
  \n-   你通过键为 `Symbol.iterator` 的方法向 `Iterable` 索要迭代器。\n-   `Iterator` 通过其方法 `.next()`\
  \ 返回迭代的值。\n-   值不是直接返回的，而是被封装在具有两个属性的对象中：\n    -   `.value` 是迭代的值。\n    -   `.done`\
  \ 表示是否已到达迭代结束。在最后一个迭代值之后它为 `true`，在此之前为 `false`。\n\n## 32.3 手动迭代\n\n这是一个使用迭代协议的示例：\n\
  \n```\nconst iterable = ['a', 'b'];\n\n// 可迭代对象是迭代器的工厂：\nconst iterator = iterable[Symbol.iterator]();\n\
  \n// 不断调用 .next() 直到 .done 为 true：\nassert.deepEqual(\n  iterator.next(), { value:\
  \ 'a', done: false });\nassert.deepEqual(\n  iterator.next(), { value: 'b', done:\
  \ false });\nassert.deepEqual(\n  iterator.next(), { value: undefined, done: true\
  \ });\n```\n\n### 32.3.1 通过 `while` 遍历可迭代对象\n\n以下代码演示了如何使用 `while` 循环遍历可迭代对象：\n\n\
  ```\nfunction logAll(iterable) {\n  const iterator = iterable[Symbol.iterator]();\n\
  \  while (true) {\n    const {value, done} = iterator.next();\n    if (done) break;\n\
  \    console.log(value);\n  }\n}\nlogAll(['a', 'b']);\n// 输出：\n// 'a'\n// 'b'\n\
  ```\n\n![](img/file6.svg) **练习：手动使用迭代**\n\n## 32.4 实践中的迭代\n\n我们已经看到了如何手动使用迭代，但它很繁琐。\n\
  \n### 32.4.1 遍历数组\n\n`Arrays` 是可迭代的。通过 `for-of` 循环：\n\n```javascript\nconst myArray\
  \ = ['a', 'b', 'c'];\nfor (const x of myArray) {\n  console.log(x);\n}\n// 输出：\n\
  // 'a'\n// 'b'\n// 'c'\n```\n\n### 32.4.2 解构\n\n使用解构：\n\n```javascript\nassert.deepEqual(\n\
  \  iterator.next(), { value: 'a', done: false });\nassert.deepEqual(\n  iterator.next(),\
  \ { value: 'b', done: false });\nassert.deepEqual(\n  iterator.next(), { value:\
  \ undefined, done: true });\n```\n\n### 32.4.3 遍历 Set\n\n`Set` 是可迭代的。\n\n```javascript\n\
  const mySet = new Set(['a', 'b']);\nfor (const x of mySet) {\n  console.log(x);\n\
  }\n// 输出：\n// 'a'\n// 'b'\n```\n\n### 32.4.4 遍历 Map\n\n`Map` 是可迭代的。\n\n```javascript\n\
  const myMap = new Map([['a', 1], ['b', 2]]);\nfor (const [key, value] of myMap)\
  \ {\n  console.log(key, value);\n}\n// 输出：\n// 'a' 1\n// 'b' 2\n```\n\n解构\n\n```javascript\n\
  assert.deepEqual(\n  iterator.next(), { value: 'a', done: false });\nassert.deepEqual(\n\
  \  iterator.next(), { value: 'b', done: false });\nassert.deepEqual(\n  iterator.next(),\
  \ { value: undefined, done: true });\n```\n\n## 32.5 快速引用\n\n### 32.5.1 可迭代源\n\n\
  以下内置源是可迭代的：\n\n-   数组\n-   字符串\n-   Map\n\n遍历对象的属性需要 `Object.keys()` 或 `Object.entries()`\
  \ 等辅助方法。\n\n### 32.5.2 迭代构造\n\n- `for-of`：\n```javascript\nconst myArray = ['a',\
  \ 'b', 'c'];\nfor (const x of myArray) {\n  console.log(x);\n}\n```\n\n- `Array.from()`：\n\
  ```javascript\nconst arr = Array.from(['a', 'b', 'c']);\n```\n\n- 展开运算符 `...`：\n\
  ```javascript\nconst arr = [...['a', 'b', 'c']];\n```\n\n- `reduce()`：\n```javascript\n\
  const sum = ['a', 'b', 'c'].reduce((acc, curr) => acc + curr, 0);\n```\n\n- `forEach()`：\n\
  ```javascript\n['a', 'b', 'c'].forEach((x) => {\n  console.log(x);\n});\n```\n\n\
