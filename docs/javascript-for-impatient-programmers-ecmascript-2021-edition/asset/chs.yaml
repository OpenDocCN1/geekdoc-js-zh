  \ 文档记录了浏览器支持哪些特性（包括 JavaScript 语言特性）。\n\n## 7.3 我可以在哪里查到计划中的 JavaScript 特性？\n\n\
  请参阅以下来源：\n\n* §5.5 “TC39 流程 描述了如何规划即将推出的特性。\n* §5.6 “常见问题：TC39 流程 回答了关于即将特性的各种问题。\n\
  \n## 7.4 为什么 JavaScript 经常会静默失败？\n\nJavaScript 经常静默失败。让我们两个例子。\n\n第一个例子：如果操作符的操作数没有合适的类型，它们将根据需要进行转换。\n\
  \n```\n> '3' * '5'\n15\n```\n\n第二个例子：如果算术计算失败，你得到的是错误值，而不是异常。\n\n```\n> 1 / 0\n\
  Infinity\n```\n\n静默失败的原因是历史性的：JavaScript 直到 ECMAScript 3 才有了异常。从那时起，设计者一直试图避免静默失败。\n\
  \n## 7.5 为什么我们不能通过移除特殊习用和过时特性来清理 JavaScript？\n\n这个问题在 §5.7 “演进 JavaScript：不破坏 Web”\
  \ 中回答。\n\n## 7.6 我如何快速尝试一段 JavaScript 代码？\n\n§10.1 “尝试 JavaScript 代码”\n\n# 8 使用\
  \ JavaScript：概览\n\n* * *\n\n在本章中，我想勾勒出一个整体蓝图：你在这书中学习了什么，它是如何融入整体格局的？\n\n## 8.1 你在书中学习了什么？\n\
  \n本书教授 JavaScript 语言。它专注于语言本身，但会偶而介绍一下可以使用 JavaScript 的两个平台：\n\n* 浏览器\n* Node.js\n\
  \nNode.js 对 Web 开发非常重要，体现在以下三个方面：\n\n* 你可以使用它编写服务端软件。\n* 你还可以用它编写命令行软件（类似于 Unix\
  \ Shell）。\n* Node 的软件仓库 `npm` 已成为安装工具（如编译器和构建工具）以及库的主流方式——即使对于客户端开发也是如此。\n\n## 8.2\
  \ 浏览器和 Node.js 的结构\n\n![](img/file9.svg)\n\n图 2：JavaScript 平台 *浏览器* 和 *Node.js*\
  \ 的结构。API 和平台 API 托管在包含 JavaScript 引擎和特定的“核心”的基础层之上。\n\n* 基础层由 引擎和特定的“核心”功能组成。\n\
  * 有两个 API 托管在其之上：标准库是 JavaScript 的一部分。平台 API 也可用——例如：\n    * 在浏览器中，如果你想进行任何与用户界面的操作（响应鼠标点击等），你需要使用平台\
  \ API。\n    * 在 Node.js 中，平台 API 允许读写文件、通过 HTTP 下载数据等。\n\n8.3 JavaScript 参考\n\n\
  当你对 JavaScript 有疑问时，网页搜索通常会有帮助。我推荐以下在线资源：\n\n* [MDN Web Docs](https://developer.mozilla.org/en-US/)：涵盖各种网络技术，如\
  \ CSS、HTML、JavaScript 等。极佳的参考。\n* [Node.js Docs](https://nodejs.org/en/docs/）：记录了\
  \ Node.js API。\n* [ExploringJS.com](https://exploringjs.com)：我关于 JavaScript 的书籍比本书更详细，并且可以免费阅读。你可以按\
  \ ECMAScript 版本查找特性：\n    * ES1–ES5：[*Speaking JavaScript*](http://speakingjs.com/)\n\
  \    * ES6：[*Exploring ES6*](https://exploringjs.com/es6.html)\n\n\n\n\n\n* ES2016–ES2017:\
  \ [*探索 ES2016 和 ES2017*](https://exploringjs.com/es2016-es2017.html)\n* 等\n\n##\
