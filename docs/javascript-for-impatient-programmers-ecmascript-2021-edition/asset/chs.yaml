  \n### 25.8.1 `const`: `for-of` vs. `for`\n\n注意在 `for-of` 循环中我们可以使用 `const`。迭代变量对于每次迭代仍然可以是不同的（它在迭代期间不能改变）。将其想象为每次在新的作用域中执行的新的\
  \ `const` 声明。相比之下，在 `for` 循环中，如果值发生变化，我们必须通过 `let` 或 `var` 声明变量。\n\n### 25.8.2 Iterating\
  \ over iterables\n\n如前所述，`for-of` 适用于任何迭代器，而不仅仅是 `Arrays` —— 例如 `Sets`：\n\n```javascript\n\
