  \ [ES2021]\n## 42.8.4 `Promise.allSettled()` [ES2020]\n\n***\n\n在本章中，我们将探索 Promises，另一种交付异步结果的模式。\n\
  \n![](img/file0.svg) **推荐阅读**\n\n本章基于上一章关于 JavaScript 异步编程的背景知识构建。\n\n## 42.1 使用\
  \ Promise 的基础\n\nPromise 是一种异步交付结果的模式。\n\n### 42.1.1 使用基于 Promise 的函数\n\n以下代码是使用基于\
  \ Promise 的函数 `addAsync()` 的示例（稍后将显示实现）：\n\n```\naddAsync(3, 4)\n  .then(result\
  \ => { // 成功\n    assert.equal(result, 7);\n  })\n  .catch(error => { // 失败\n  \
  \  assert.fail(error);\n  });\n```\n\nPromise 类似于事件模式：有一个对象（一个 `Promise`），我们在其中注册回调：\n\
  \n* 方法 `.then()` 注册处理结果的回调。\n* 方法 `.catch()` 注册处理错误的回调。\n\n基于 Promise 的函数返回一个 Promise，并在其完成时发送一个结果或错误。与事件模式相比，Promise\
  \ 针对一次性结果进行了优化：\n\n* 结果（或错误）会被缓存，因此在结果（或错误）发送之前或之后注册回调都没有关系。\n* 我们可以链式调用 Promise\
  \ 方法 `.then()` 和 `.catch()`，因为它们都返回 Promise。这有助于调用多个函数。更多内容请见后文。\n\n### 42.1.2 什么是\
  \ Promise？\n\n什么是 Promise？有两种看待它的方式：\n\n* 从一方面来看，它是最终将交付的最终结果的占位符或容器。\n* 从另一个方面来看，它是一个我们可以对其注册监听器的对象。\n\
  \n### 42.1.3 实现一个 Promise\n\n这是一个基于 Promise 的函数实现，用于相两个数字 `x` 和 `y`：\n\n```\nfunction\
  \ addAsync(x, y) {\n  return new Promise(\n    (resolve, reject) => { // (A)\n \
  \     if (x === undefined || y === undefined) {\n        reject(new Error('Must\
  \ provide parameters'));\n      } else {\n        resolve(x + y);\n      }\n   \
  \ });\n}\n```\n\n`addAsync()` 立即调用 `Promise` 构造函数。该函数的实际实现位于传递构造函数的回调中（A 行）。该回调提供了两个函数：\n\
  \n* `resolve` 用于交付结果（成功情况）。\n* `reject` 用于交付错误（失败情况）。\n\n### 42.1.4 Promise 的状态\n\
  \n![](img/file31.svg)\n\n图 22：Promise 可以处于三种状态之一：等待中（pending）、已完成（fulfilled）或已拒绝（rejected）。如果\
  \ Promise 处于最终（非等待）状态，则被称为已终结（settled）。\n\n图 22 描述了 Promise 可能处于三个状态。Promise 专注于一次性结果，并保护我们免受竞态条件的影响（注册太早或太晚）：\n\
  \n* 如果我们过早注册 `.then()` 回调或 `.catch()` 回调，一旦 Promise 终结就会收到通知。\n* 一旦 Promise 终结，终结值（结果或错误）就会被缓存。因此，如果在终结后调用\
  \ `.then()` 或 `.catch()`，它们将接收缓存的值。\n\n此外，一旦 Promise 终结，它的状态和终结值就不能再改变。这有助于使代码具有可预测性，并强制了\
  \ Promise 的一次性本质。\n\n![](img/file5.svg) **某些 Promise 永远不会终结**\n\nPromise 有可能永远不会终结。例如：\n\
  \n```\nnew Promise(() => {})\n```\n\n### 42.1.5 `Promise.resolve()`：创建一个带有给定值且已完成的\
  \ Promise\n\n`Promise.resolve(x)` 创建一个带有 `x` 的已完成的 Promise：\n\n```\nPromise.resolve(123)\n\
  \  .then(x => {\n    assert.equal(x, 123);\n  });\n```\n\n如果参数已经是 Promise，则按原样返回：\n\
  \n```\nconst abcPromise = Promise.resolve('abc');\nassert.equal(\n  Promise.resolve(abcPromise),\n\
  \  abcPromise);\n```\n\n因此，给定任意值 `x`，我们可以使用 `Promise.resolve(x)` 来确保我们有一个 Promise。\n\
  \n注意名称是 `resolve` 而不是 `fulfill`，因为如果其参数是一个拒绝的 Promise，`.resolve()` 将返回一个拒绝的 Promise。\n\
  \n### 42.1.6 `Promise.reject()`：创建一个带有给定值且已拒绝的 Promise\n\n`Promise.reject(err)`\
  \ 创建一个带有 `err` 的已拒绝 Promise：\n\n```\nconst myError = new Error('My error!');\nPromise.reject(myError)\n\
  \  .catch(err => {\n    assert.equal(err, myError);\n  });\n```\n\n### 42.1.7 在\
  \ `.then()` 回调中返回和抛出\n\n`.then()` 处理 Promise 的完成。它还返回一个新的全新的 Promise。该 Promise 如何终结取决于回调内部发生了什么。让我们来看三种常见情况。\n\
  \n#### 42.1.7.1 返回非 Promise 值\n\n首先，回调可以返回一个非 Promise 值（A 行）。因此，`.then()` 返回的 Promise\
  \ 将用该值完成（如 B 行所示的检查）：\n\n```\nPromise.resolve('abc')\n  .then(str => {\n    return\
  \ str + str; // (A)\n  })\n  .then(str2 => {\n    assert.equal(str2, 'abcabc');\
  \ // (B)\n  });\n```\n\n#### 42.1.7.2 返回一个 Promise\n\n\n\n\n其次，回调函数可以返回一个 Promise\
  \ `p`（A 行）。因此，`p` “变成” `.then()` 返回的内容。换句话说：`.then()` 已经返回的 Promise 实际上被 `p` 替换了。\n\
  \n```\n[](#cb1139-1)Promise.resolve('abc')\n[](#cb1139-2)  .then(str => {\n[](#cb1139-3)\
  \    return Promise.resolve(123); // (A)\n[](#cb1139-4)  })\n[](#cb1139-5)  .then(num\
  \ => {\n[](#cb1139-6)    assert.equal(num, 123);\n[](#cb1139-7)  });\n```\n\n为什么这样做很有用？我们可以返回一个基于\
  \ Promise 的操作的结果，并通过“扁平化”（非嵌套）的 `.then()` 处理其完成值。对比一下：\n\n```\n[](#cb1140-1)//扁平化\n\
  [](#cb1140-2)asyncFunc1()\n[](#cb1140-3)  .then(result1 => {\n[](#cb1140-4)    /*···*/\n\
  [](#cb1140-5)    return asyncFunc2();\n[](#cb1140-6)  })\n[](#cb1140-7)  .then(result2\
  \ => {\n[](#cb1140-8)    /*···*/\n[](#cb1140-9)  });\n[](#cb1140-10)\n[](#cb1140-11)//嵌套\n\
  [](#cb1140-12)asyncFunc1()\n[](#cb1140-13)  .then(result1 => {\n[](#cb1140-14) \
  \   /*···*/\n[](#cb1140-15)    asyncFunc2()\n[](#cb1140-16)    .then(result2 =>\
  \ {\n[](#cb1140-17)      /*···*/\n[](#cb1140-18)    });\n[](#cb1140-19)  });\n```\n\
  \n#### 42.1.7.3 抛出异常\n\n第三，回调函数可以抛出异常。因此，`.then()` 返回的 Promise 将因该异常被拒绝（rejected）。这意味着同步错误被转换成了异步错误。\n\
  \n```\n[](#cb1141-1)const myError = new Error('My error!');\n[](#cb1141-2)Promise.resolve('abc')\n\
  [](#cb1141-3)  .then(str => {\n[](#cb1141-4)    throw myError;\n[](#cb1141-5)  })\n\
  [](#cb1141-6)  .catch(err => {\n[](#cb1141-7)    assert.equal(err, myError);\n[](#cb1141-8)\
  \  });\n```\n\n### 42.1.8 `.catch()` 及其回调\n\n`.then()` 和 `.catch()` 的区别在于后者是由拒绝（rejections）触发的，而不是完成（fulfillments）。然而，两种方法都以相同的方式将其回调的操作转换为\
  \ Promise。例如，在下面的代码中，A 行 `.catch()` 回调的返回值变成一个完成值：\n\n```\n[](#cb1142-1)const err\
  \ = new Error();\n[](#cb1142-2)Promise.reject(err)\n[](#cb1142-3)  .catch(e => {\n\
  [](#cb1142-4)    assert.equal(e, err);\n[](#cb1142-5)    // 出些问题了，使用默认值\n[](#cb1142-6)\
  \    return 'default value'; // (A)\n[](#cb1142-7)  })\n[](#cb1142-8)  .then(str\
  \ => {\n[](#cb1142-9)    assert.equal(str, 'default value');\n[](#cb1142-10});\n\
  ```\n\n### 42.1.9 方法链式调用\n\n`.then()` 和 `.catch()` 总是返回 Promise。这使我们能够创建任意的方法调用链：\n\
  \n```\n[](#cb1143-1)function myAsyncFunc() {\n[](#cb1143-2)  return asyncFunc1()\
  \ // (A)\n[](#cb1143-3)    .then(result1 => {\n[](#cb1143-4)      // ···\n[](#cb1143-5)\
  \      return asyncFunc2(); // 一个 Promise\n[](#cb1143-6)    })\n[](#cb1143-7)  \
  \  .then(result2 => {\n[](#cb1143-8)      // ···\n[](#cb1143-9)      return result2\
  \ ?? '(Empty)'; // 不是 Promise\n[](#cb1143-10)    })\n[](#cb1143-11)    .then(result3\
  \ => {\n[](#cb1143-12)      // ···\n[](#cb1143-13)      return asyncFunc4(); //\
  \ 一个 Promise\n[](#cb1143-14)    });\n}\n```\n\n由于链式调用，A 行中的 `return` 返回的是最后一个 `.then()`\
  \ 的结果。在某种意义上，`.then()` 是分号（`;`）的异步版本：\n\n*   `.then()` 按顺序执行两个异步操作。\n*   分号按顺序执行两个同步操作。\n\
  \n我们还可以将 `.catch()` 加入其中，并让它同时处理多个来源：\n\n```\n[](#cb1144-1)asyncFunc1()\n[](#cb1144-2)\
  \  .then(result1 => {\n[](#cb1144-3)    // ···\n[](#cb1144-4)    return asyncFunction2();\n\
  [](#cb1144-5)  })\n[](#cb1144-6)  .then(result2 => {\n[](#cb1144-7)    // ···\n\
  [](#cb1144-8)  })\n[](#cb1144-9)  .catch(error => {\n[](#cb1144-10)    // 失败：处理\
  \ asyncFunc1(), asyncFunc2() 的错误以及之前回调中抛出的（同步）异常\n[](#cb1144-11)    });\n```\n\n\
  ### 42.1.10 `.finally()` [ES2018]\n\nPromise 方法 `.finally()` 经常如下使用：\n\n```javascript\n\
  [](#cb1145-1)somePromise\n[](#cb1145-2)  .then((result) => {\n[](#cb1145-3)    //\
  \ ···\n[](#cb1145-4)  })\n[](#cb1145-5)  .catch((error) => {\n[](#cb1145-6)    //\
  \ ···\n[](#cb1145-7)  })\n[](#cb1145-8)  .finally(() => {\n[](#cb1145-9)    // ···\n\
  [](#cb1145-10)  });\n```\n\n`.finally()` 回调总是执行的——独立于 `somePromise` 以及 `.then()`\
  \ 或 `.catch()` 返回的值。相比之下：\n\n*   `.then()` 回调仅在 `somePromise` 完成时执行。\n*   `.catch()`\
  \ 回调仅在满足以下条件时执行：\n    *   `somePromise` 被拒绝；\n    *   或者 `.then()` 回调返回了一个被拒绝的 Promise；\n\
  \    *   或者 `.then()` 回调抛出了异常。\n\n`.finally()` 忽略其回调的返回值，并直接传递调用之前已存在的状态（settlement）：\n\
  \n```\n[](#cb1146-1)Promise.resolve(123)\n[](#cb1146-2)  .finally(() => {})\n[](#cb1146-3)\
  \  .then((result) => {\n[](#cb1146-4)    assert.equal(result, 123);\n[](#cb1146-5)\
  \  })\n```\n\n如果 `.finally()` 回调抛出了异常，返回的 Promise 将被拒绝：\n\n```javascript\n[](#cb1147-1)Promise.resolve('error')\n\
  [](#cb1147-2)  .finally(() => {\n[](#cb1147-3)    throw new Error('finally error');\n\
  [](#cb1147-4)  })\n[](#cb1147-5)  .then(result => {\n[](#cb1147-6)    // 这将不会运行\n\
  [](#cb1147-7)  })\n[](#cb1147-8)  .catch(error => {\n[](#cb1147-9)    assert.equal(error.message,\
  \ 'finally error');\n[](#cb1147-10)  });\n```\n\n等待，`.finally()` 子句类似于同步分号：用例如下：\n\
  \n```javascript\n[](#cb1148-1)let connection;\ndb.open()\n[](#cb1148-2)  .then(conn\
  \ => {\n[](#cb1148-3)    connection = conn;\n[](#cb1148-4)  })\n[](#cb1148-5)  .finally(()\
  \ => {\n[](#cb1148-6)    connection.close();\n[](#cb1148-7)  }); // 用例：清理资源\n```\n\
  \n\n\n\n*   基于 `Promise` 的函数和方法的类型签名更加清晰：如果一个函数是基于回调（callback）的，那么某些参数是关于输入的，而结尾的一个或两个回调是关于输出的。使用\
  \ `Promises`，所有与输出相关的逻辑都通过返回值来处理。\n*   链式调用异步处理步骤更加方便。\n*   `Promises` 同时处理异步错误（通过拒绝\
  \ `rejections`）和同步错误：在 `new Promise()`、`.then()` 和 `.catch()` 的回调函数内部，异常会被转换为拒绝（converted\
  \ to `rejections`）。相比之下，如果我们使用回调来处理异步操作，异常通常不会被我们自动处理；我们必须手动处理。\n*   `Promises`\
  \ 是一个单一的标准，正在逐渐取代许多个互不兼容的替代方案。例如，在 `Node.js` 中，许多函数现在都提供了基于 `Promise` 的版本。新的浏览器异步\
  \ API 通常也是基于 `Promise` 的。\n\n`Promises` 的最大优势之一在于是不直接与它们交互：它们是 `async functions`\
  \ 的基础，`async functions` 是一种用于执行异步计算的看起来像同步的语法。异步函数将在下一章中介绍。\n\n## 42.2 示例\n\n看到\
  \ `Promises` 的实际运行有助于理解它们。让我们来看示例。\n\n### 42.2.1 Node.js: 异步读取文件\n\n考虑以下包含 JSON\
  \ 数据 的文本文件 `person.json`：\n\n```\n{\n  \"first\": \"Jane\",\n  \"last\": \"Doe\"\
  \n}\n```\n\n让我们来看两个版本的代码，它们用于读取该文件并将其解析为对象。首先是基于回调的版本。其次是基于 `Promise` 的版本。\n\n####\
  \ 42.2.1.1 回调版本\n\n以下代码读取该文件的内容并转换为 JavaScript 对象。它基于 `Node.js` 风格的回调：\n\n```\n\
