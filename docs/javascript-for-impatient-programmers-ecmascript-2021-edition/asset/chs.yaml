  \ 的静态方法\n    * 34.5.3 `ArrayBuffer` 的属性\n* 34.6 快速参考：类型数组\n    * 34.6.1 `TypedArray<T>`\
  \ 的静态方法\n    * 34.6.2 `TypedArray<T>` 的属性\n    * 34.6.3 `new TypedArray<T>()`\n\
  \    * 34.6.4 类型数组与普通数组的转换方法\n    * 34.6.5 `TypedArray<T>` 的原型方法\n* 34.7 快速参考：DataViews\n\
  \    * 34.7.1 `new DataView()`\n    * 34.7.2 `DataView` 的属性\n\n\n\n\n```javascript\n\
  // Argument: Typed Array or Array-like object\nconst ta1 = new Uint8Array([0, 1,\
  \ 2]);\n\nconst ta2 = Uint8Array.of(0, 1, 2);\n\nconst ta3 = new Uint8Array(3);\
  \ // length of Typed Array\nta3[0] = 0;\nta3[1] = 1;\nta3[2] = 2;\n\nassert.deepEqual(ta1,\
  \ ta2);\nassert.deepEqual(ta1, ta3);\n```\n\n### 34.1.3.2 封装的 ArrayBuffer\n\n```javascript\n\
  const typedArray = new Int16Array(2); // 2 elements\nassert.equal(typedArray.length,\
  \ 2);\n\nassert.deepEqual(\n  typedArray.buffer, new ArrayBuffer(4)); // 4 bytes\n\
  ```\n\n### 34.1.3.3 获取和设置元素\n\n```javascript\nconst typedArray = new Int16Array(2);\n\
  \nassert.equal(typedArray[1], 0); // initialized with 0\ntypedArray[1] = 72;\nassert.equal(typedArray[1],\
  \ 72);\n```\n\n### 34.1.4 使用 DataViews\n\n这是 DataViews 的用法方式：\n\n```javascript\n\
  const dataView = new DataView(new ArrayBuffer(4));\nassert.equal(dataView.getInt16(0),\
  \ 0);\nassert.equal(dataView.getUint8(0), 0);\ndataView.setUint8(0, 5);\n```\n\n\
  ## 34.2 元素类型\n\n表 20：Typed Array API 支持的元素类型。\n\n| Element | Typed Array | 字节 |\
  \ 说明 | |\n| --- | --- | --- | --- | --- |\n| `Int8` | `Int8Array` | 1 | 8 位有符号整数\
  \ | ES6 |\n| `Uint8` | `Uint8Array` | 1 | 8 位无符号整数 | ES6 |\n| `Uint8C` | `Uint8ClampedArray`\
  \ | 1 | 8 位无符号整数 | ES6 |\n| | | | (限幅转换) | ES6 |\n| `Int16` | `Int16Array` | 2 |\
  \ 16 位有符号整数 | ES6 |\n| `Uint16` | `Uint16Array` | 2 | 16 位无符号整数 | ES6 |\n| `Int32`\
  \ | `Int32Array` | 4 | 32 位有符号整数 | ES6 |\n| `Uint32` | `Uint32Array` | 4 | 32 位无符号整数\
  \ | ES6 |\n| `BigInt64` | `BigInt64Array` | 8 | 64 位有符号整数 | ES2020 |\n| `BigUint64`\
  \ | `BigUint64Array` | 8 | 64 位无符号整数 | ES2020 |\n| `Float32` | `Float32Array` |\
  \ 4 | 32 位浮点数 | ES6 |\n| `Float64` | `Float64Array` | 8 | 64 位浮点数 | ES6 |\n\n表 20\
  \ 列出了可用的元素类型。这些类型（例如 `Int32`）出现在两个位置：\n\n* 在 Typed Arrays 中，它们指定了元素的类型。例如，所有 `Int32Array`\
  \ 元素的类型都是 `Int32`。元素类型是 Typed Arrays 之间唯一不同的之处。\n* 在 DataViews 中，当你使用如 `.getInt32()`\
  \ 和 `.setInt32()` 等方法时，它们是你访问其 ArrayBuffers 的透镜。\n\n元素类型 `Uint8C` 是特殊的：它不被 `DataView`\
  \ 支持，仅为了启用 `Uint8ClampedArray` 而存在。这种 Typed Array 被 `canvas` 元素使用（它取代了 `CanvasPixelArray`），在其他情况下应避免使用。`Uint8C`\
  \ 和 `Uint8` 唯一区别在于溢出和欠流的处理方式（在下一节中解释）。\n\nTyped Arrays 和 Array Buffers 使用数字和 bigints\
  \ 来导入和导出值：\n\n* `BigInt64` 和 `BigUint64` 类型通过 bigints 处理。例如，setter 接受 bigints，getter\
  \ 返回 bigints。\n* 所有其他元素类型都通过数字处理。\n\n### 34.2.1 处理溢出和欠流\n\n通常，当一个值超出元素类型的范围时，会使用取模运算将其转换为范围内的值。对于有符号和无符号整数，这意味着：\n\
  \n* 最大值加 1 转换为最小值值（无符号整数为 0）。\n* 最小值减 1 转换为最大值。\n\n以下函数有助于说明转换是如何运作的：\n\n```javascript\n\
  function setAndGet(typedArray, value) {\n  typedArray[0] = value;\n  return typedArray[0];\n\
  }\n```\n\n无符号 8 位整数的取模转换：\n\n```javascript\nconst uint8 = new Uint8Array(1);\n\n\
  // 范围内的最大值\nassert.equal(setAndGet(uint8, 255), 255);\n// 溢出\nassert.equal(setAndGet(uint8,\
  \ 256), 0);\n\n// 范围内的最小值\nassert.equal(setAndGet(uint8, 0), 0);\n// 欠流\nassert.equal(setAndGet(uint8,\
  \ -1), 255);\n```\n\n有符号 8 位整数的取模转换：\n\n```javascript\nconst int8 = new Int8Array(1);\n\
  \n// 范围内的最大值\nassert.equal(setAndGet(int8, 127), 127);\n// 溢出\nassert.equal(setAndGet(int8,\
  \ 128), -128);\n\n// 范围内的最小值\nassert.equal(setAndGet(int8, -128), -128);\n// 欠流\n\
  assert.equal(setAndGet(int8, -129), 127);\n```\n\n限幅转换（Clamped conversion）则不同：\n\
  \n* 所有欠流的值都被转换为最小值。\n* 所有溢出的值都被转换为最大值。\n\n```javascript\nconst uint8c = new Uint8ClampedArray(1);\n\
  \n// 范围内的最大值\nassert.equal(setAndGet(uint8c, 255), 255);\n// 溢出\nassert.equal(setAndGet(uint8c,\
  \ 256), 255);\n// 范围内的最小值\nassert.equal(setAndGet(uint8c, 0), 0);\n// 欠流\nassert.equal(setAndGet(uint8c,\
  \ -1), 255);\n```\n\n### 34.2.2 字节序\n\n每当一个类型（如 `Uint16`）被存储为多个字节时，*字节序*（endianness）就变得重要：\n\
  \n* 大端序（Big endian）：高字节在前。例如，`Uint16` 值 0x4321 被存储为两个字节——0x43，然后是 0x21。\n* 小端序（Little\
  \ endian）：低字节在前。例如，`Uint16` 值 0x4321 被存储为两个字节——0x21，然后是 0x43。\n\n字节序通常按架构固定，，并且在原生\
  \ API 中保持一致。DataViews 满足了这一用例，并允许你在获取或设置时指定字节序。\n\n[引用维基百科关于字节序](https://en.wikipedia.org/wiki/Endianness)：\n\
  \n* 大端序表示在数据网络中最常见；Internet 协议中的字段（如 IPv4、IPv6、TCP、UDP）按大端序传输。出于这个原因，大端序也被称为网络字节序。\n\
  * 小端序存储在微处理器中很流行，部分由于英特尔公司对微处理器设计产生了重大影响。\n\n其他排序也是可能的。它们被通称为*中端序*（middle-endian）或*混合端序*（mixed-endian）。\n\
  \n## 34.3 关于 Typed Arrays 的更多信息\n\n在本节中，`ElementTypeArray` 代表 `Int8Array`、`Uint8Array`\
  \ 等。`ElementType` 代表 `Int8`、`Uint8` 等。\n\n### 34.3.1 静态方法 `ElementTypeArray.from()`\n\
  \n该方法的签名为：\n\n```typescript\n.from<S>(\n  source: Iterable<S>|ArrayLike<S>,\n  mapfn?:\
  \ S => ElementType, thisArg?: any\n)\n  : «ElementType»Array\n```\n\n`.from()` 将\
  \ `source` 转换为 `this` 的实例（Typed Array）。\n\n例如，普通数组是可迭代的，可以使用此方法进行转换：\n\n```javascript\n\
  assert.deepEqual(\n  Uint16Array.from([0, 1, 2]),\n  Uint16Array.of(0, 1, 2));\n\
  ```\n\nTyped Arrays 也是可迭代的：\n\n```javascript\nassert.deepEqual(\n  Uint16Array.from(Uint8Array.of(0,\
  \ 1, 2)),\n  Uint16Array.of(0, 1, 2));\n```\n\n`source` 也可以是*类数组对象*：\n\n\n\n\n\n\
  ```javascript\nassert.deepEqual(\n  Uint16Array.from({0:0, 1:1, 2:2, length: 3}),\n\
  \  Uint16Array.of(0, 1, 2));\n```\n\n可选的 `mapfn` 允许你在 `source` 的元素成为结果的元素之前对其进行转换。为什么要一次性完成\
  \ `mapping`（映射）和 `conversion`（转换）这两个步骤呢？与通过 `.map()` 分别映射相比，它有两个优势：\n\n1. 不需要中间的\
  \ `Array` 或 `Typed Array`。\n2. 在不同精度的 `Typed Arrays` 之间进行转换时，出错的概率更低。\n\n继续阅读以获取第二个优势的解释。\n\
  \n### 34.3.1.1 陷阱：在 Typed Array 类型之间转换时进行映射\n\n静态方法 `.from()` 可以可选地同时进行映射并在 `Typed\
  \ Array types` 之间进行转换。使用该方法时出错概率更低。\n\n为了了解为什么如此，让我们先将一个 `Typed Array` 转换为精度更高的\
  \ `Typed Array`。如果我们使用 `.from()` 进行映射，结果将是自动正确的。否则，你必须先转换再进行映射。\n\n```javascript\n\
  const typedArray = Int8Array.of(127, 126, 125);\nassert.deepEqual(\n  Int16Array.from(typedArray,\
  \ x => x * 2),\n  Int16Array.of(254, 252, 250));\n\nassert.deepEqual(\n  Int16Array.from(typedArray).map(x\
  \ => x * 2),\n  Int16Array.of(254, 252, 250)); // OK\nassert.deepEqual(\n  Int16Array.from(typedArray.map(x\
  \ => x * 2)),\n  Int16Array.of(-2, -4, -6)); // wrong\n```\n\n如果我们从一个 `Typed Array`\
  \ 转换为精度更低的 `Typed Array`，通过 `.from()` 进行映射会产生正确的结果。否则，我们必须先映射再转换。\n\n```javascript\n\
  assert.deepEqual(\n  Int8Array.from(Int16Array.of(254, 252, 250), x => x / 2),\n\
  \  Int8Array.of(127, 126, 125));\n\nassert.deepEqual(\n  Int8Array.from(Int16Array.of(254,\
  \ 252, 250).map(x => x / 2)),\n  Int8Array.of(127, 126, 125)); // OK\nassert.deepEqual(\n\
  \  Int8Array.from(Int16Array.of(254, 252, 250)).map(x => x / 2),\n  Int8Array.of(-1,\
  \ -2, -3)); // wrong\n```\n\n问题在于，如果通过 `.map()` 进行映射，那么输入类型和输出类型是相同的。相比之下，`.from()`\
  \ 从任意输入类型转换为你通过其接收者指定的输出类型。\n\n### 34.3.2 Typed Arrays 是可迭代的\n\n`Typed Arrays` 是\
  \ `iterable`（可迭代的）。这意味着你可以使用 `for-of` 循环和其他基于迭代的机制：\n\n```javascript\nconst ui8\
  \ = Uint8Array.of(0, 1, 2);\nfor (const byte of ui8) {\n  console.log(byte);\n}\n\
  // 输出:\n// 0\n// 1\n// 2\n```\n\n`ArrayBuffers` 和 `DataViews` 不是可迭代的。\n\n### 34.3.3\
  \ Typed Arrays 与普通 Arrays\n\n`Typed Arrays` 与普通 `Arrays` 非常相似：它们有 `.length` 属性，可以通过括号运算符\
  \ `[]` 访问元素，并且拥有大多数标准的 `Array` 方法。它们与普通 `Arrays` 的不同之处如下：\n\n* `Typed Arrays` 拥有缓冲区（buffers）。`Typed\
  \ Array` `ta` 的元素并不存储在 `ta` 中，而是存储在关联的 `ArrayBuffer` 中，可以通过 `ta.buffer` 访问：\n\n\
  \    ```javascript\n    const ta = new Uint16Array(2); // 2 个元素\n    assert.deepEqual(\n\
  \      ta.buffer, new ArrayBuffer(4)); // 4 字节\n    ```\n\n* `Typed Arrays` 用零初始化：\n\
  \n    * `new Array(4)` 创建了一个没有任何元素的普通 `Array`。它只有四个 *空位*（小于 `.length` 且没有关联元素的索引）。\n\
  \    * `new Uint8Array(4)` 创建了一个 `Typed Array`，其四个元素均为 0。\n\n    ```javascript\n\
  \    assert.deepEqual(new Uint8Array(4), Uint8Array.of(0, 0, 0, 0));\n    ```\n\n\
  * `Typed Array` 的所有元素都具有相同的类型：\n\n    * 设置元素会将值转换为该类型。\n\n        ```javascript\n\
  \        const ta = new Uint8Array(1);\n        ta[0] = 257;\n        assert.equal(ta[0],\
  \ 1); // 257 % 256 (溢出)\n        ta[0] = '2';\n        assert.equal(ta[0], 2);\n\
  \        ```\n\n    * 获取元素返回数字或大整数。\n\n        ```javascript\n        const ta =\
  \ new Uint8Array(1);\n        assert.equal(ta[0], 0);\n        ```\n\n* `Typed Array`\
  \ 的 `.length` 派生自其 `ArrayBuffer` 且不会改变（除非切换到 `Array`）。\n普通 `Arrays` 可以有空位；`Typed\
  \ Arrays` 不能。\n\n### 34.3.4 Typed Arrays 与普通 Arrays 之间的转换\n\n将普通 `Array` 转换为 `Typed\
  \ Array`，你可以将其传递给 `Typed Array` 构造函数或使用 `Array.from()`（接受可迭代对象）。例如：\n\n```javascript\n\
  const ta1 = new Uint8Array([0, 1]);\nconst ta2 = Uint8Array.from([0, 1]);\nassert.deepEqual(ta1,\
  \ ta2);\n```\n\n将 `Typed Array` 转换为普通 `Array`，可以使用展开运算符或 `Array.from()`（因为 `Typed\
  \ Arrays` 是可迭代的）：\n\n```javascript\nassert.deepEqual(Uint8Array.of(0, 1), [0, 1]);\n\
  ```\n\n### 34.3.5 Typed Arrays 的合并\n\n`Typed Arrays` 没有像 `Arrays` 那样的 `.concat()`\
  \ 方法。解决方法是使用 `.set()`：\n\n```javascript\nfunction concatenate(resultConstructor,\
  \ ...arrays) {\n  let totalLength = 0;\n  for (const arr of arrays) {\n    totalLength\
  \ += arr.length;\n  }\n  const result = new resultConstructor(totalLength);\n  let\
  \ offset = 0;\n  for (const arr of arrays) {\n    result.set(arr, offset);\n   \
  \ offset += arr.length;\n  }\n  return result;\n}\n```\n\n### 34.4 \n\n为了准备引用 `ArrayBuffers`、`Typed\
  \ Arrays` 和 `DataViews`，我们需要学习索引和偏移量之间的区别：\n\n* 括号运算符 `[]` 的索引：只能使用非负索引（从 0 开始）。\n\
  \n    在普通 `Arrays` 中，向负索引写入会创建属性：\n\n    ```javascript\n    const arr = [6, 7];\n\
  \    arr[-1] = 5;\n    assert.deepEqual(Object.keys(arr), ['0', '1', '-1']);\n \
  \   ```\n\n    在 `Typed Arrays` 中，向负索引写入会被忽略：\n\n    ```javascript\n    const tarr\
  \ = Uint8Array.of(6, 7);\n    tarr[-1] = 5;\n    assert.deepEqual(Object.keys(tarr),\
  \ ['0', '1']);\n    ```\n\n* `ArrayBuffers`、`Typed Arrays` 和 `DataViews` 方法的索引：每个索引可以是负的。如果是负的，它将加上对象的长度以产生实际索引。因此，`-1`\
  \ 指最后一个元素，`-2` 指倒第二个元素，以此此类推。普通 `Arrays` 的方法也相同相同。\n\n    ```javascript\n    const\
  \ ui8 = Uint8Array.of(0, 1, 2);\n    assert.deepEqual(ui8.slice(-1), Uint8Array.of(2));\n\
  \    ```\n\n* 传递给 `Typed Arrays` 和 `DataViews` 方法的偏移量：必须是非负的 —— 例如：\n\n\n\n\n\n\
  ```javascript\nconst dataView = new DataView(new ArrayBuffer(4));\nassert.throws(\n\
  \  () => dataView.getUint8(-1),\n  {\n    name: 'RangeError',\n    message: 'Offset\
  \ is outside the bounds of the DataView',\n  }\n);\n```\n\n一个参数是索引（index）还是偏移量（offset）只能通过查看文档来确定；没有简单的规则。\n\
  \n## 34.5 快速参考：ArrayBuffers\n\n`ArrayBuffers` 存储二进制数据，旨在通过 `Typed Arrays`（类型数组）和\
  \ `DataViews` 进行访问。\n\n### 34.5.1 `new ArrayBuffer()`\n\n该构造函数的类型签为：\n\n```javascript\n\
  new ArrayBuffer(length: number)\n```\n\n通过 `new` 调用此构造函数会创建一个容量为 `length` 字节的实例。每个字节的初始值均为\
  \ 0。\n\n你不能更改 `ArrayBuffer` 的长度；只能创建一个不同长度的新 `ArrayBuffer`。\n\n### 34.5.2 `ArrayBuffer`\
  \ 的静态方法\n\n* `ArrayBuffer.isView(arg: any)`\n\n  如果 `arg` 是一个对象且是 `ArrayBuffer`\
  \ 的视图（即它是一个 `Typed Array` 或 `DataView`），则返回 `true`。\n\n### 34.5.3 `ArrayBuffer.prototype`\
  \ 的属性\n\n* `get .byteLength(): number`\n\n  返回此 `ArrayBuffer` 的容量（单位为字节）。\n\n* `.slice(startIndex:\
  \ number, endIndex=this.byteLength)`\n\n  创建一个新的 `ArrayBuffer`，其中包含该 `ArrayBuffer`\
  \ 中索引大于或等于 `startIndex` 且小于 `endIndex` 的字节。`start` 和 `endIndex` 可以为负数（参见 §34.4 “快速参考：索引\
  \ vs 偏移量”）。\n\n## 34.6 快速参考：Typed Arrays\n\n各种 `Typed Array` 对象的属性分两个步骤介绍：\n\n1.\
  \ `TypedArray`：首先，我们查看所有 `Typed Array` 类的抽象父类（在章节开头的类图中显示）。我将该父类称为 `TypedArray`，但无法从\
  \ JavaScript 直接访问。`TypedArray.prototype` 包含了所有 `Typed Arrays` 的方法。\n\n2. `«ElementType»Array`：具体的\
  \ `Typed Array` 类被称为 `Uint8Array`、`Int16Array`、`Float32Array` 等。这些是你通过 `new`、`.of`\
  \ 和 `.from()` 使用的类。\n\n### 34.6.1 `TypedArray<T>` 的静态方法\n\n所有静态 `TypedArray` 方法都被其子类（`Uint8Array`\
  \ 等）继承。`TypedArray` 是抽象的。因此，你始终通过子类使用这些方法，因为子类是具体的并且可以拥有直接实例。\n\n* `.from<S>(source:\
  \ Iterable<S>|ArrayLike<S>, mapfn?: S => T, thisArg?: any) : instanceof this`\n\n\
  \  将可迭代对象（包括 `Arrays` 和 `Typed Arrays`）或类数组对象,\n    Uint16Array.of(0, 1, 2));\n\
  \  ```\n\n  可选的 `mapfn` 允许你在 `source` 的元素成为结果元素之前对其进行转换。\n\n  ```javascript\n  assert.deepEqual(\n\
  \    Int16Array.from(Int8Array.of(127, 126, 125), x => x * 2),\n    Int16Array.of(254,\
  \ 252, 250));\n  ```\n\n* `.of(...items: bigint[]): instanceof this` (`BigInt64Array`,\
  \ `BigUint64Array`)\n\n* `.of(...items: number[]): instanceof this` (所有其他 Typed\
  \ Arrays)\n\n  创建一个 `this` 的新实例，其元素为 `items`（被强制转换为元素类型）。\n\n  ```javascript\n \
  \ assert.deepEqual(\n    Int16Array.of(-1234, 5, 67),\n    new Int16Array([-1234,\
  \ 5, 67]) );\n  ```\n\n### 34.6.2 `TypedArray<T>.prototype` 的属性\n\n`Typed Array`\
  \ 方法接受的索引可以是负数（它们的工作方式类似于传统的 `Array` 方法）。偏移量必须是非负的。详情，请参见 §34.4 “快速参考：索引 vs 偏移量”)。\n\
  \n#### 34.6.2.1 Typed Arrays 特有属性\n\n以下属性 `Typed Arrays` 特有；普通的 `Arrays` 不具备：\n\n\
  * `get .buffer(): ArrayBuffer`\n\n  返回支持此 `Typed Array` 的缓冲区。\n\n* `get .length():\
  \ number`\n\n  返回此 `Typed Array` 缓冲区的元素长度。\n\n* `get .byteLength(): number`\n\n\
  \  返回此 `Typed Array` 缓冲区的大小（单位为字节）。\n\n* `get .byteOffset(): number`\n\n  返回此 `Typed\
  \ Array` 在其 `ArrayBuffer` 内部“起始”的偏移量。\n\n* `.set(typedArray: TypedArray, offset=0):\
  \ void`\n\n* `.set(arrayLike: ArrayLike<bigint>, offset=0): void` (`BigInt64Array`,\
  \ `BigUint64Array`)\n\n* `.set(arrayLike: ArrayLike<number>, offset=0): void` (所有其他\
  \ Typed Arrays)\n\n  将第一个参数的所有元素拷贝到此 `Typed Array`。参数中索引为 0 的元素被写入此 `Typed Array`\
  \ 的索引 `offset` 处（依此类推）。关于类数组对象的更多信息，请参阅 §33.4 “类数组对象”。\n\n* `.subarray(startIndex=0,\
  \ endIndex=this.length): TypedArray<T>`\n\n  返回一个新的 `Typed Array`，它与此 `Typed Array`\
  \ 具有相同的缓冲区，但范围（通常）较小。如果 `startIndex` 是负的，则结果 `Typed Array` 的第一个元素是 `this[startIndex]`。\n\
  \n#### 34.6.2.2 Array 方法\n\n以下方法与 `Arrays` 的方法基本相同：\n\n* `.slice(start=0, end=this.length):\
  \ T[]`\n\n* `.entries(): Iterable<[number, T]>`\n\n* `.every(value: T, index: number,\
  \ array: TypedArray<T>) => boolean, thisArg?: any`\n\n* `.fill(value: T, start=0,\
  \ end=this.length): this`\n\n* `.keys(): Iterable<number>`\n\n* `.forEach(value:\
  \ T, index: number, array: TypedArray<T>) => void, thisArg?: any`\n\n* `.values():\
  \ Iterable<T>`\n\n以下方法**不**等同于 `Arrays` 方法：\n\n* `.copyWithin(target: number, start:\
  \ number, end=this.length): this`\n\n* `.sort(compareFunc?: (a: T, b: T) => number):\
  \ this`\n\n```)\n\n关于这些方法如何工作，请参阅 §33.12.3 “Array<T>.prototype` 的方法”。\n\n### 34.6.3 `new\
  \ «ElementType»Array()`\n\n每个 Typed Array 构造函数的名称都遵循 `«ElementType»Array` 模式，其中\
  \ `«ElementType»` 是开头表格中的元素类型之一。这意味着有 11 个 Typed Arrays 构造函数：\n\n* `Float32Array`,\
  \ `Float64Array`\n\n* `Int8Array`, `Int16Array`, `Int32Array`, `BigInt64Array`\n\
  \n* `Uint8Array`, `Uint8ClampedArray`, `Uint16Array`, `Uint32Array`, `BigUint64Array`\n\
  \n\n\n\n\n每个构造函数都有四个重载版本 – 它的行为取决于接收的参数数量以及这些的类型：\n\n*   `new «ElementType»Array(buffer:\
  \ ArrayBuffer, byteOffset=0, length=0)`\n\n    创建一个新的 `«ElementType»Array`，其缓冲区为\
  \ `buffer`。它从给定的 `byteOffset` 开始访问缓冲区，并具有给定的 `length`。注意，`length` 统计的是类型数组的元素个数（每个元素\
  \ 1–8 字节），而不是字节数。\n\n*   `new «ElementType»Array(length=0)`\n\n    创建一个具有给定 `length`\
  \ 和相应缓冲器的 `«ElementType»Array`。缓冲区以字节为单位的大小为：\n\n    ```\n    length * «ElementType»Array.BYTES_PER_ELEMENT\n\
  \    ```\n\n*   `new «ElementType»Array(source: TypedArray)`\n\n    创建一个 `«ElementType»Array`\
  \ 的新实例，其元素的值与 `source` 的元素值相同，但会被强制转换为 `ElementType`。\n\n*   `new «ElementType»Array(source:\
  \ ArrayLike<bigint>)` (`BigInt64Array`, `BigUint64Array`)\n\n*   `new «ElementType»Array(source:\
  \ ArrayLike<number>)` (所有其他类型数组)\n\n    创建一个 `«ElementType»Array` 的新实例，其元素的值与 `source`\
  \ 的元素值相同，但会被强制转换为 `ElementType`。有关关于类数组对象的更多信息，请参阅 §33.4 “类数组对象”。\n\n### 34.6.4\
  \ `«ElementType»Array` 的静态属性\n\n*   `«ElementType»Array.BYTES_PER_ELEMENT: number`\n\
  \n    计算存储单个元素需要多少个字节：\n\n    ```\n    > Uint8Array.BYTES_PER_ELEMENT\n    1\n \
  \   > Int16Array.BYTES_PER_ELEMENT\n    2\n    > Float64Array.BYTES_PER_ELEMENT\n\
  \    8\n    ```\n\n### 34.6.5 `«ElementType»Array.prototype` 的属性\n\n*   `.BYTES_PER_ELEMENT:\
  \ number`\n\n    与 `«ElementType»Array.BYTES_PER_ELEMENT` 相同。\n\n## 34.7 快速参考：DataViews\n\
  \n### 34.7.1 `new DataView()`\n\n*   `new DataView(buffer: ArrayBuffer, byteOffset=0,\
  \ byteLength=buffer.byteLength-byteOffset)`\n\n    创建一个新的 `DataView`，其数据存储在 ArrayBuffer\
  \ `buffer` 中。默认情况下，新的 `DataView` 可以访问整个 `buffer`。最后两个参数允许你更改此行为。\n\n### 34.7.2 `DataView.prototype`\
  \ 的属性\n\n在本节的剩余部分中，`«ElementType»` 指：\n\n*   `Int8`, `Int16`, `Int32`, `BigInt64`\n\
  \n*   `Uint8`, `Uint16`, `Uint32`, `BigUint64`\n\n*   `Float32`, `Float64`\n\n这些是\
  \ `DataView.prototype` 的属性：\n\n*   `get .buffer(): ArrayBuffer`\n\n    返回此 DataView\
  \ 的 ArrayBuffer。\n\n*   `get .byteLength(): number`\n\n    返回此 DataView 可以访问的字节数。\n\
  \n*   `get .byteOffset(): number`\n\n    返回此 DataView 从缓冲区中的哪个偏移量开始访问字节。\n\n*  \
  \ `.get«ElementType»(byteOffset: number, littleEndian=false): bigint` (`BigInt64`,\
  \ `BigUint64`)\n\n*   `.get«ElementType»(byteOffset: number, littleEndian=false):\
  \ number` (所有其他元素类型)\n\n    从此 DataView 的缓冲区中读取值。\n\n*   `.set«ElementType»(byteOffset:\
  \ number, value: bigint, littleEndian=false): void` (`BigInt64`, `BigUint64`)\n\n\
  *   `.set«ElementType»(byteOffset: number, value: number, littleEndian=false): void`\
  \ (所有其他元素类型)\n\n    将 `value` 写入此 DataView 的缓冲区。\n\n# 35 Maps (`Map`)\n\n* * *\n\
  \n*   35.1 使用 Maps\n\n    * 35.1.1 创建 Maps\n\n    * 35.1.2 拷贝 Maps\n\n    * 35.1.3\
  \ 处理单个条目\n\n    * 35.1.4 确定 Map 的大小并清空\n\n    * 35.1.5 获取 Map 的键和值\n\n    * 35.1.6\
  \ 获取 Map 的条目\n\n    * 35.1.7 按插入顺序列出：条目、键、值\n\n    * 35.1.8 在 Maps 和对象之间转换\n\n*\
  \   35.2 示例：计数字符\n\n*   35.3 关于 Maps 键的更多细节（高级）\n\n    * 35.3.1 哪些键被认为是等等的？\n\n\
  *   35.4 缺失的 Map 操作\n\n    * 35.4.1 映射和过滤 Maps\n\n    * 35.4.2 合并 Maps\n\n*   35.5\
  \ 快速参考：`Map<K,V>``\n\n    * 35.5.1 构造函数\n\n    * 35.5.2 `Map<K,V>.prototype`: 处理单个条目\n\
  \n    * 35.5.3 `Map<K,V>.prototype`: 处理所有条目\n\n    * 35.5.4 `Map<K,V>.prototype`:\
  \ 迭代和循环\n\n    * 35.5.5 本节的来源\n\n*   35.6 FAQ：Maps\n\n    * [35.6.1 我什么时候应该使用 Map，我是否应该使用对象？]\n\
  \n    在 ES6 之前，JavaScript 还没有用于字典的数据结构。ES6 引入了 `Map`，它是基于值的字典。单个键值映射被称为一个条目（entry）。\n\
  \n    ## 35.1 使用 Maps\n\n    `Map` 实例将键映射到值。\n\n    ### 35.1.1 创建 Maps\n\n    创建\
  \ Maps 有三种常见方法：\n\n    首先，你可以使用构造函数创建一个空的 Map：\n\n    ```\n    const emptyMap =\
  \ new Map();\n    assert.equal(emptyMap.size, 0);\n    ```\n\n    其次，你可以向构造函数传递一个键值“对”的可迭代器（例如，数组）：\n\
  \n    ```\n    const map = new Map([\n      [1, 'one'],\n      [2, 'two'],\n   \
  \   [3, 'three']\n    ]);\n    ```\n\n    第三，`.set()` 方法向 Map 添加条目，并且可以链式调用：\n\n\
  \    ```\n    const map = new Map()\n      .set(1, 'one')\n      .set(2, 'two')\n\
  \      .set(3, 'three');\n    ```\n\n    ### 35.1.2 拷贝 Maps\n\n    正如我们之后看到的，Maps\
  \ 也是键值对的可迭代器。因此，你可以使用构造函数创建一个 Map 的拷贝。该拷贝是浅的：键和值是相同的；它们没有被复制。\n\n    ```\n    const\
  \ original = new Map()\n      .set(false, 'no')\n      .set(true, 'yes');\n    const\
  \ copy = new Map(original);\n    assert.deepEqual(original, copy);\n    ```\n\n\
  \    ### 35.1.3 处理单个条目\n\n    `.set()` 和 `.get()` 用于写入和读取值（给定键）。\n\n    ```\n  \
  \  const map = new Map();\n    map.set('foo', 123);\n    assert.equal(map.get('foo'),\
  \ 123);\n    // 未知键：\n    assert.equal(map.get('bar'), undefined);\n    // 如果条目缺失，使用默认值\
  \ ''：\n    assert.equal(map.get('bar') ?? '', '');\n    ```\n\n    `.has()` 检查 Map\
  \ 是否具有给定键的条目。`.delete()` 删除条目。\n\n\n\n\n\n```javascript\nconst map = new Map([['foo',\
  \ 123]]);\nassert.equal(map.has('foo'), true);\nassert.equal(map.delete('foo'),\
  \ true)\nassert.equal(map.has('foo'), false)\n```\n\n### 35.1.4 获取 Map 的大小并清空\n\n\
  `.size` 包含 `Map` 中的条目数量。`.clear()` 移除 `Map` 的所有条目。\n\n```javascript\nconst map =\
  \ new Map()\n  .set('foo', true)\n  .set('bar', false);\n\nassert.equal(map.size,\
  \ 2)\nmap.clear();\nassert.equal(map.size, 0)\n```\n\n### 35.1.5 获取 Map 的键和值\n\n\
  `.keys()` 返回包含 `Map` 键的可迭代器：\n\n```javascript\nconst map = new Map()\n  .set(false,\
  \ 'no')\n  .set(true, 'yes');\n\nfor (const key of map.keys()) {\n  console.log(key);\n\
  }\n// 输出:\n// false\n// true\n```\n\n我们可以使用扩展运算符（`...`）将 `.keys()` 返回的可迭代器转换为 `Array`：\n\
  \n```javascript\nassert.deepEqual(\n  [...map.keys()], \n  [false, true]);\n```\n\
  \n`.values()` 的工作方式与 `.keys()` ，但针对的是值而不是键。\n\n### 35.1.6 获取 Map 的条目\n\n`.entries()`\
  \ 返回包含 `Map` 条目的的可迭代器：\n\n```javascript\nconst map = new Map()\n  .set(false, 'no')\n\
  \  .set(true, 'yes');\n\nfor (const entry of map.entries()) {\n  console.log(entry);\n\
  }\n// 输出:\n// [false, 'no']\n// [true, 'yes']\n```\n\n扩展运算符（`...`）将 `.entries()`\
  \ 返回的可迭代器转换为 `Array`：\n\n```javascript\nassert.deepEqual(\n  [...map.entries()],\
  \ \n  [[false, 'no'], [true, 'yes']]);\n```\n\nMap 实例也是条目的可迭代器。在下面的代码中，我们使用解构赋值来访问\
  \ `map` 的键和值：\n\n```javascript\nfor (const [key, value] of map) {\n  console.log(key,\
  \ value);\n}\n// 输出:\n// false, 'no'\n// true, 'yes'\n```\n\n### 35.1.7 按插入顺序列出：条目、键、值\n\
  \nMap 会记录条目创建的顺序，并在列出条目、键或值时遵循该顺序：\n\n```javascript\nconst map1 = new Map([\n  ['a',\
  \ 1],\n  ['b', 2],\n]);\nassert.deepEqual(\n  [...map1.keys()], ['a', 'b']);\n\n\
  const map2 = new Map([\n  ['b', 2],\n  ['a', 1],\n]);\nassert.deepEqual(\n  [...map2.keys()],\
  \ ['b', 'a']);\n```\n\n### 35.1.8 在 Map 和对象之间转换\n\n只要 `Map` 仅使用字符串和符号作为键，你就可以将其转换为对象（通过\
  \ `Object.fromEntries()`）：\n\n```javascript\nconst map = new Map([\n  ['a', 1],\n\
  \  ['b', 2],\n]);\nconst obj = Object.fromEntries(map);\nassert.deepEqual(\n  obj,\
  \ {a: 1, b: 2});\n```\n\n你也可以将具有字符串或符号键的对象转换为 `Map`（通过 `Object.entries()`）：\n\n\
  ```javascript\nconst obj = {\n  a: 1,\n  b: 2,\n};\nconst map = new Map(Object.entries(obj));\n\
  assert.deepEqual(\n  map, new Map([['a', 1], ['b', 2]]));\n```\n\n## 35.2 示例：统计字符\n\
  \n`countChars()` 返回一个字符映射到出现次数的 `Map`。\n\n```javascript\nfunction countChars(chars)\
  \ {\n  const charCounts = new Map();\n  for (let ch of chars) {\n    ch = ch.toLowerCase();\n\
  \    const prevCount = charCounts.get(ch) ?? 0;\n    charCounts.set(ch, prevCount\
  \ + 1);\n  }\n  return charCounts;\n}\nconst result = countChars('AaBbccc');\nassert.deepEqual(\n\
  \  [...result], \n  ['a', 2], ['b', 2], ['c', 3]);\n```\n\n## 35.3 关于键的一些细节\n\n\
  任何值都可以作为键，即使是对象：\n\n```javascript\nconst map = new Map();\nconst KEY1 = {};\nconst\
  \ KEY2 = {};\nmap.set(KEY1, 'hello');\nmap.set(KEY2, 'world');\nmap.get(KEY1); //\
  \ 'hello'\nmap.get(KEY2); // 'world'\n```\n\n### 35.3.1 哪些键是等的？\n\n大多数 Map 操作通过\
  \ [SameValueZero 算法](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Equality_comparison#samevalue)\
  \ 检查是否相等，该算法认为 `NaN` 与自身相等：\n\n```javascript\nconst map = new Map();\nmap.set(NaN,\
  \ 1);\nmap.get(NaN); // 1\n```\n\n### 35.3.2 对象相等\n\n只有当两个对象指向同一个对象引用时，它们才是等的：\n\
  \n```javascript\nconst map = new Map();\nmap.set({}, 1);\nmap.get({}); // undefined\n\
  ```\n\n## 35.4 映射与过滤\n\nMap 没有 `.map()` 或 `.filter()` 方法，这就是为什么我们必须：\n\n1.  将 Map\
  \ 转换为数组。\n2.  对数组进行映射或过滤。\n3.  将结果转换回 Map。\n\n让我们使用以下示例：\n\n```javascript\nconst\
  \ map = new Map()\n  .set(1, 'a')\n  .set(2, 'b')\n  .set(3, 'c');\n\nconst mappedMap\
  \ = new Map([...map].map(([k, v]) => [k, '_' + v]));\nassert.deepEqual(mappedMap.get(1),\
  \ '_a');\n\nconst filteredMap = new Map([...map].filter(([k, v]) => k < 3));\nassert.deepEqual(filteredMap.size,\
  \ 2);\n```\n\n\n\n\n如果你没有提供参数 `entries`，则会创建一个空的 `Map`。如果你提供了一个包含 `[key, value]`\
  \ 对的可迭代对象，则这些对将作为条目添加到 `Map` 中。例如：\n\n```javascript\nconst map = new Map([\n  [\
  \ 1, 'one' ],\n  [ 2, 'two' ],\n  [ 3, 'three' ], // 末尾逗号会被忽略\n]);\n```\n\n### 35.5.2\
  \ `Map<K,V>.prototype`: 处理单个条目\n\n* `.get(key: K): V`\n\n返回 `key` 在此 `Map` 中映射的\
  \ `value`。如果 `Map` 中不存在键 `key`，则返回 `undefined`。\n\n```javascript\nconst map = new\
  \ Map([[1, 'one'], [2, 'two']]);\nassert.equal(map.get(1), 'one');\nassert.equal(map.get(5),\
  \ undefined);\n```\n\n* `.set(key: K, value: V): this`\n\n将给定的 `key` 映射到给定的 `value`。如果已经存在键为\
  \ `key` 的条目，则对其进行更新。否则，创建一个新条目。此方法返回 `this`，这意味着你可以对其进行链式调用。\n\n```javascript\n\
  const map = new Map([[1, 'one'], [2, 'two']]);\nmap.set(1, 'ONE!')\n   .set(3, 'THREE!');\n\
  assert.deepEqual(\n  [...map.entries()],\n  [[1, 'ONE!'], [2, 'two'], [3, 'THREE!]]\n\
  );\n```\n\n* `.has(key: K): boolean`\n\n返回给定的 `key` 是否存在于此 `Map` 中。\n\n```javascript\n\
  const map = new Map([[1, 'one'], [2, 'two']]);\nassert.equal(map.has(1), true);\
  \ // key \nassert.equal(map.has(5), false); // key 不\n```\n\n* `.delete(key: K):\
  \ boolean`\n\n如果存在键为 `key` 的条目，则将其移除并返回 `true`。否则，什么都不会发生并返回 `false`。\n\n```javascript\n\
  const map = new Map([[1, 'one'], [2, 'two']]);\nassert.equal(map.delete(1), true);\n\
  assert.equal(map.delete(5), false); // 什么都没有发生\nassert.deepEqual(\n  [...map.entries()],\n\
  \  [[2, 'two']]\n);\n```\n\n### 35.5.3 `Map<K,V>.prototype`: 处理所有条目\n\n* `get .size:\
  \ number`\n\n返回此 `Map` 拥有的条目数量。\n\n```javascript\nconst map = new Map([[1, 'one'],\
  \ [2, 'two']]);\nassert.equal(map.size, 2);\n```\n\n* `.clear(): void`\n\n从此 `Map`\
  \ 中移除所有条目。\n\n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\nassert.equal(map.size,\
  \ 2);\nmap.clear();\nassert.equal(map.size, 0);\n```\n\n### 35.5.4 `Map<K,V>.prototype`:\
  \ 迭代与循环\n\n迭代和循环都按照条目被添加到 `Map` 的顺序进行。\n\n* `.entries(): Iterable<[K,V]>`\n\n返回一个可迭代对象，其中包含此\
  \ `Map` 中每个条目的一个 `[key, value]` 对。这些对是长度为 2 的数组。\n\n```javascript\nconst map = new\
  \ Map([[1, 'one'], [2, 'two']]);\nfor (const entry of map.entries()) {\n  console.log(entry);\n\
  }\n// 输出:\n// [1, 'one']\n// [2, 'two']\n```\n\n* `.forEach(callback: (value: V,\
  \ key: K, theMap: Map<K,V>) => void, thisArg?: any): void`\n\n第一个参数是一个回调函数，它会为此\
  \ `Map` 中的每个条目调用一次。如果提供了 `thisArg`，则在每次调用时 `this` 都被设置为它。否则，`this` 被设置为 `undefined`。\n\
  \n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\nmap.forEach((value,\
  \ key) => console.log(value, key));\n// 输出:\n// 'one', 1\n// 'two', 2\n```\n\n*\
  \ `.keys(): Iterable<K>`\n\n返回此 `Map` 中所有键的可迭代对象。\n\n```javascript\nconst map =\
  \ new Map([[1, 'one'], [2, 'two']]);\nfor (const key of map.keys()) {\n  console.log(key);\n\
  }\n// 输出:\n// 1\n// 2\n```\n\n* `.values(): Iterable<V>`\n\n返回此 `Map` 中所有值的可迭代对象。\n\
  \n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\n// 为了简洁起见省略了逻辑\n\
  ```\n\n* `Symbol.iterator: Iterable<[K,V]>`\n\n返回一个用于遍历 map 条目的迭代器。\n\n\n\n\n\n\
  接下来的两个章节将详细介绍其含义。\n\n## 36.1 `WeakMap` 是黑盒\n\n无法检查 `WeakMap` 内部的内容：\n\n* 例如，你无法对键、值或条目进行迭代或循环。你无法计算其大小（size）。\n\
  * 此外，你无法清空 `WeakMap` —— 你必须创建一个新的实例。\n\n这些限制实现了一种安全属性。引用 [Mark Miller](https://github.com/tc39/tc39-notes/blob/master/meetings/2014-11/nov-19.md#412-should-weakmapweakset-have-a-clear-method-markm)\
  \ 的话：\n\n> 从 weakmap/键值对到值的映射只能由同时拥有 weakmap 和键的人观察或影响。如果有了 `clear()` 方法，仅拥有 `WeakMap`\
  \ 的人也将能够影响 `WeakMap-and-key-to-value`。\n\n## 36.2 `WeakMap` 的键是弱引用的\n\n`WeakMap`\
  \ 的键被认为是弱引用的：通常情况下，如果一个对象引用另一个对象，那么只要前者存在，后者对象就无法被垃圾回收。在 `WeakMap` 中，情况不同：如果一个对象是键且没有被其他地方引用，那么即使\
  \ `WeakMap` 仍然存在，它也可以被垃圾回收。这也导致相应的条目被移除（但没有办法观察到）。\n\n### 36.2.1 所有 `WeakMap` 键必须是对象\n\
  \n所有 `WeakMap` 的键都必须是对象。如果你使用原始值，将会报错：\n\n```\n> const wm = new WeakMap();\n> wm.set(123,\
  \ 'test')\nTypeError: Invalid value used as weak map key\n```\n\n如果使用原始值作为键，`WeakMaps`\
  \ 将不再是黑盒了。但考虑到原始值永远不会被垃圾回收，你无法从弱引用键中获益，直接使用普通的 `Map` 即可。\n\n### 36.2.2 用例：为对象附加值\n\
  \n这是 `WeakMaps` 的主要用例：你可以使用它们将值外部附加到对象上——例如：\n\n```\nconst wm = new WeakMap();\n\
  {\n  const obj = {};\n  wm.set(obj, 'attachedValue'); // (A)\n}\n// (B)\n```\n\n\
  在行 A 中，我们将一个值附加到 `obj`。在行 B 中，即使 `wm` 仍然存在，`obj` 也可以被垃圾回收。这种为对象附加值的技巧等同于将对象的属性存储在外部。如果\
  \ `wm` 是一个属性，之前的代码如下：\n\n```\n{\n  const obj = {};\n  obj.wm = 'attachedValue';\n\
  }\n```\n\n## 36.3 示例\n\n### 36.3.1 通过 `WeakMaps` 缓存计算结果\n\n通过 `WeakMaps`，你可以将之前计算过的结果与对象关联，而无需担心内存管理。以下函数\
  \ `countOwnKeys()` 就是示例：它在 `WeakMap` `cache` 中缓存了之前的结果。\n\n```\nconst cache = new\
  \ WeakMap();\nfunction countOwnKeys(obj) {\n  if (cache.has(obj)) {\n    return\
  \ [cache.get(obj), 'cached'];\n  } else {\n    const count = Object.keys(obj).length;\n\
  \    cache.set(obj, count);\n    return [count, 'computed'];\n  }\n}\n```\n\n如果对一个对象\
  \ `obj` 使用此函数，你可以看到结果仅在第一次调用时被计算，而第二次调用则使用缓存值：\n\n```\n> const obj = { foo: 1, bar:\
  \ 2};\n> countOwnKeys(obj)\n[2, 'computed']\n> countOwnKeys(obj)\n[2, 'cached']\n\
  ```\n\n### 36.3.2 在 `WeakMaps` 中保留私有数据\n\n在以下代码中，`WeakMaps` `_counter` 和 `_action`\
  \ 用于存储 `Countdown` 实例虚拟属性的值：\n\n```\nconst _counter = new WeakMap();\nconst _action\
  \ = new WeakMap();\n\nclass Countdown {\n  constructor(counter, action) {\n    _counter.set(this,\
  \ counter);\n    _action.set(this, action);\n  }\n  dec() {\n    let counter = _counter.get(this);\n\
  \    counter--;\n    _counter.set(this, counter);\n    if (counter === 0) {\n  \
  \    _action.get(this)();\n    }\n  }\n}\n\n// 这两个伪属性是真正的私有的：\nassert.deepEqual(\n\
  \  Object.keys(new Countdown()),\n  []);\n```\n\n这是 `Countdown` 的用法方式：\n\n```javascript\n\
  let invoked = false;\n\nconst cd = new Countdown(3, () => invoked = true);\n\ncd.dec();\
  \ assert.equal(invoked, false);\ncd.dec(); assert.equal(invoked, false);\ncd.dec();\
  \ assert.equal(invoked, true);\n```\n\n**练习：用于私有数据的 WeakMaps**\n\n`exercises/weakmaps/weakmaps_private_data_test.mjs`\n\
  \n## 36.4 `WeakMap` API\n\n`WeakMap` 的构造函数和四个方法的工作方式与它们的 `Map` 等等方法相同：\n\n* `new\
  \ WeakMap()`\n* `set(key, value)`\n* `get(key)`\n* `has(key)`\n* `delete(key)`\n\
  \n(注意：`WeakMap` 没有 `clear()` 方法。)\n\n\n\n\n\n其次，你可以将一个迭代器（例如，`Array`）传递给构造函数。迭代出的值将成为新\
  \ `Set` 的元素：\n\n```javascript\nconst set = new Set(['red', 'green', 'blue']);\n\
  ```\n\n第三，`.add()` 方法向 `Set` 添加元素，并且支持链式调用：\n\n```javascript\nconst set = new Set()\n\
  set.add('red')\nset.add('green')\nset.add('blue');\n```\n\n### 37.1.2 添加、删除、检查成员身份\n\
  \n`.add()` 向 `Set` 添加一个元素。\n\n```javascript\nconst set = new Set();\nset.add('red');\n\
  ```\n\n`.has()` 检查一个元素是否是 `Set` 的成员。\n\n```javascript\nassert.equal(set.has('red'),\
  \ true);\n```\n\n`.delete()` 从 `Set` 中删除一个元素。\n\n```javascript\nassert.equal(set.delete('red'),\
  \ true); // 有删除操作\nassert.equal(set.has('red'), false);\n```\n\n### 37.1.3 确定 Set\
  \ 的大小并清空\n\n###`.size` 包含 `Set` 中的元素数量。\n\n```javascript\nconst set = new Set()\n\
  \  .add('foo')\n  .add('bar');\nassert.equal(set.size, 2)\n```\n\n`.clear()` 移除\
  \ `Set` 的所有元素。\n\n```javascript\nset.clear();\nassert.equal(set.size, 0)\n```\n\n\
  ### 37.1.4 遍历 Sets\n\n`Sets` 是可迭代的，`for-of` 循环正如你预期的那样工作：\n\n```javascript\nconst\
  \ set = new Set(['red', 'green', 'blue']);\nfor (const x of set) {\n  console.log(x);\n\
  }\n// 输出：\n// 'red'\n// 'green'\n// 'blue'\n```\n\n如你所见，Sets 保留了`插入顺序`。也就是说，元素始终按照它们被添加的顺序进行迭代。\n\
  \n鉴于 `Sets` 是可迭代的，你可以使用扩展运算符 (`...`) 将它们转换为 `Arrays`：\n\n```javascript\nconst set\
  \ = new Set(['red', 'green', 'blue']);\nconst arr = [...set]; // ['red', 'green',\
  \ 'blue']\n```\n\n## 37.2 使用 Sets 的示例\n\n### 37.2.1 从 Array 中移除重复项\n\n将 `Array`\
  \ 转换为 `Set` 再转换回 `Array`，可以移除 `Array` 中的重复项：\n\n```javascript\nassert.deepEqual(\n\
  \  [...new Set([1, 2, 1, 2, 3, 3, 3])],\n  [1, 2, 3]);\n```\n\n### 37.2.2 创建 Unicode\
  \ 字符（代码点）的集合\n\n字符串是可迭代的，因此可以作为 `new Set()` 的参数：\n\n```javascript\nassert.deepEqual(\n\
  \  new Set('abc'),\n  new Set(['a', 'b', 'c']));\n```\n\n## 37.3 哪些 Set 元素被认为是等等的？\n\
  \n与 `Map` 键一样，`Set` 元素的比较方式类似于 `===`，不同之处是 `NaN` 等于它自己。\n\n```javascript\nconst\
  \ set = new Set([NaN, NaN, NaN]);\nset.size\n1\nset.has(NaN)\ntrue\n```\n\n与 `===`\
  \ 一样，两个不同的对象永远不会被认为是等的（目前没有办法改变这一点）：\n\n```javascript\nconst set = new Set();\n\n\
  set.add({});\nset.size\n1\n\nset.add({});\nset.size\n2\n```\n\n## 37.4 缺失的 Set 操作\n\
  \nSets 缺少几个常用操作。此类操作通常可以通过以下方式实现：\n\n* 通过扩展到 `Array 字面量量` 将输入的 `Sets` 转换为 `Arrays`。\n\
  * 在 `Arrays` 上执行该操作。\n* 将结果转换为 `Set` 并返回。\n\n### 37.4.1 并集 (`a` ∪ `b`)\n\n计算两个 `Sets`\
  \ `a` 和 `b` 的并集意味着创建一个包含 `a` 和 `b` 所有元素的 `Set`。\n\n```javascript\nconst a = new\
  \ Set([1,2,3]);\nconst b = new Set([4,3,2]);\n// 使用扩展运算符拼接两个迭代器\nconst union = new\
  \ Set([...a, ...b]);\n\nassert.deepEqual([...union], [1, 2, 3, 4]);\n```\n\n###\
  \ 37.4.2 交集 (`a` ∩ `b`)\n\n计算两个 `Sets` `a` 和 `b` 的交集意味着创建一个包含 `a` 中同时也在 `b` 中的元素的\
  \ `Set`。\n\n```javascript\nconst a = new Set([1,2,3]);\nconst b = new Set([4,3,2]);\n\
  const intersection = new Set(\n  [...a].filter(x => b.has(x)));\n\nassert.deepEqual([...intersection],\
  \ [2, 3]);\n```\n\n### 37.4.3 差集 (`a` \\ `b`)\n\n计算两个 `Sets` `a` 和 `b` 的差集意味着创建一个包含\
  \ `a` 中不在 `b` 中的元素的 `Set`。此操作有时称为*减法* (−)。\n\n```javascript\nconst a = new Set([1,2,3]);\n\
  const b = new Set([4,3,2]);\nconst difference = new Set(\n  [...a].filter(x => !b.has(x)));\n\
  \nassert.deepEqual([...difference], [1]);\n```\n\n### 37.4.4 对 Sets 进行映射\n\nSets\
  \ 没有 `.map()` 方法。但我们可以借用 `Arrays` 拥有的：\n\n```javascript\nconst set = new Set([1,\
  \ 2, 3]);\nconst mappedSet = new Set([...set].map(x => x * 2));\n\n// 将 mappedSet\
  \ 转换为 Array 以检查内部内容\nassert.deepEqual([...mappedSet], [2, 4, 6]);\n```\n\n### 37.4.5\
  \ 过滤 Sets\n\n我们不能直接 `.filter()` `Sets`，所以我们需要使用对应的 `Array` 方法：\n\n```javascript\n\
  const set = new Set([1, 2, 3, 4, 5]);\nconst filteredSet = new Set([...set].filter(x\
  \ => x === 2));\n```\n\n## 37.5 参考：`Set`\n\n### 37.5.1 构造函数\n\n`new Set(iterable<T>?)`:\
  \ 如果不提供参数，则创建一个空的 `Set`。如果提供了，则添加这些值。\n\n```javascript\nconst set = new Set(['red',\
  \ 'green']);\n```\n\n### 37.5.2 `Set<T>.prototype`\n\n`.add(value: T)`: 将 `value`\
  \ 添加到此 `Set`。该方法返回 `this`，可以链式调用。\n\n```javascript\nconst set = new Set();\nset.add('red').add('green');\n\
  ```\n\n`.delete(value: T)`: 从此 `Set` 中移除 `value`。如果删除了内容则返回 `true`，否则返回 `false`。\n\
  \n```javascript\nconst set = new Set(['red', 'green']);\nset.delete('red'); // true\n\
  ```\n\n`.has(value: T)`: 检查 `value` 是否在此 `Set` 中。\n\n```javascript\nconst set =\
  \ new Set(['red', 'green']);\nset.has('red'); // true\n```\n\n`.size`: 返回此 `Set`\
  \ 中元素的数量。\n\n```javascript\nconst set = new Set(['red', 'green', 'blue']);\nset.size\
  \ // 3\n```\n\n`.clear()`: 移除此 `Set` 中的所有元素。\n\n```javascript\nconst set = new Set(['red',\
  \ 'green']);\nset.clear();\n```\n\n### 37.5.4 迭代和循环\n\n`.values(): Iterable<T>`:\
  \ 返回此 `Set` 中所有元素的迭代器。\n\n```javascript\nconst set = new Set(['red', 'green']);\n\
  for (const x of set.values()) {\n  console.log(x);\n}\n```\n\n`[Symbol.iterator]():\
  \ Iterable<T>`: `Sets` 的默认迭代方式。与 `.values()` 相同。\n\n```javascript\nconst set = new\
  \ Set(['red', 'green']);\nfor (const x of set) {\n  console.log(x);\n}\n```\n\n\n\
  \n\n\n*   `.forEach(callback: (value: T, key: T, theSet: Set<T>) => void, thisArg?:\
  \ any): void` ([ES6])\n\n    将此 Set 的每个元素传递给 `callback()`。`value` 和 `key` 都包含当前元素。引入这种冗余是为了让该\
  \ `callback` 的类型签名与 `Map.prototype.forEach()` 的 `callback` 相同。\n\n    你可以通过 `thisArg`\
  \ 指定 `callback` 的 `this` 值。如果省略它，`this` 将为 `undefined`。\n\n```\nconst set = new\
  \ Set(['red', 'green']);\nset.forEach(x => console.log(x));\n// Output:\n// 'red'\n\
  // 'green'\n```\n\n### 37.5.5 与 `Map` 的对称性\n\n以下两个方法的存在是为了让 Sets 和 Maps 具有相似的接口。每个\
  \ Set 元素的处理方式就像它是一个 Map 条目，其键和值都是该元素本身。\n\n*   `Set.prototype.entries(): Iterable<[T,T]>`\
  \ ([ES6])\n*   `Set.prototype.keys(): Iterable<T>` ([ES6])\n\n`.entries()` 允许你将\
  \ Set 转换为 Map：\n\n```\nconst set = new Set(['a', 'b', 'c']);\nconst map = new Map(set.entries());\n\
  assert.deepEqual(\n  [...map.entries()],\n  [['a','a'], ['b','b'], ['c','c']]);\n\
  ```\n\n## 37.6 FAQ：Sets\n\n### 37.6.1 为什么 Sets 有 `.size` 属性而 Arrays 有 `.length`？\n\
  \n该问题的答案请参见 [§35.6.4 “为什么 Maps 有 `.size` 属性而 Arrays 有 `.length`？”]。\n\n![](img/file7.svg)\
  \ **测试题**\n\n查看[测试应用]。\n\n# 38 WeakSets (`WeakSet`) (进阶)\n\n* * *\n\n*   38.1 [示例：标记对象可以安全地在方法中使用]\n\
  *   38.2 [WeakSet API]\n\n* * *\n\nWeakSets 与 Sets 类似，区别在于：\n\n*   它们可以持有对象，而不会阻止这些对象被垃圾回收。\n\
  *   它们是黑盒：只有当我们同时拥有 WeakSet 和一个值时，才能从 WeakSet 中获取任何数据。支持的方法只有 `.add()`、`.delete()`\
  \ 和 `.has()`。请参考[作为黑盒的 WeakMaps]章节了解 WeakSets 不允许迭代、循环和清空的原因。\n\n由于无法遍历它们的元素，WeakSets\
  \ 的用例并不多。但它们确实允许我们标记对象。\n\n## 38.1 示例：标记对象可以安全地在方法中使用\n\n以下代码演示了类如何确保其方法仅应用于由它创建的实例（基于\
  \ [Domenic Denicola 的代码]):\n\n```javascript\nconst instancesOfSafeClass = new WeakSet();\n\
  \nclass SafeClass {\n  constructor() {\n    instancesOfSafeClass.add(this);\n  }\n\
  \n  method() {\n    if (!instancesOfSafeClass.has(this)) {\n      throw new TypeError('Incompatible\
  \ object!');\n    }\n  }\n}\n\nconst safeInstance = new SafeClass();\nsafeInstance.method();\
  \ // 正常\n\nassert.throws(\n  () => {\n    const obj = {};\n    SafeClass.prototype.method.call(obj);\
  \ // 抛出异常\n  },\n  TypeError\n);\n```\n\n## 38.2 WeakSet API\n\n构造函数和三个方法的工作方式与[它们对应的\
  \ Set 等效方法] 相同：\n\n*   `new WeakSet<T>(values?: Iterable<T>)` ([ES6])\n*   `.add(value:\
  \ T): this` ([ES6])\n*   `.delete(value: T): boolean` ([ES6])\n*   `.has(value:\
  \ T): boolean` ([ES6])\n\n# 39 解构\n\n* * *\n\n*   39.1 [解构初初体验]\n*   39.2 [构造 vs\
  \ 提取]\n*   39.3 [我们哪里进行解构?]\n*   39.4 [对象解构]\n    *   39.4.1 [属性值简写]\n    *   39.4.2\
  \ [剩余属性]\n    *   39.4.3 [语法陷阱：通过对象解构赋值]\n*   39.5 [数组解构]\n    *   39.5.1 [数组解构适用于任何迭代器]\n\
  \    *   39.5.2 [剩余元素]\n*   39.6 [解构示例]\n    *   39.6.1 [数组解构：交换变量值]\n    *   39.6.2\
  \ [数组解构：返回数组的操作]\n    *   39.6.3 [对象解构：多返回值]\n*   39.7 [如果模式部分没有匹配到任何内容会发生什么?]\n\
  \    *   39.7.1 [对象解构与缺失属性]\n\n### 39.1 解构初初体验\n\n使用普通赋值，你一次只提取一条数据——例如：\n\n```javascript\n\
  const arr = ['a', 'b', 'c'];\nconst x = arr[0];\nconst y = arr[1];\n```\n\n使用解构，你可以通过数据中的模式同时提取多条数据。上一个代码中的等号左侧就是一种位置。在以下代码中，方括号是一个解构模式：\n\
  \n```javascript\nconst arr = ['a', 'b', 'c'];\nconst [x, y] = arr; // (A)\nassert.equal(x,\
  \ 'a');\nassert.equal(y, 'b');\n```\n\n这段代码与上一个代码的效果相同。注意模式比数据“小”：我们只提取了我们需要的内容。\n\
  \n## 39.2 构造 vs 提取\n\n为了理解什么是解构，请考虑 JavaScript 有两种相反的操作：\n\n*   你可以构造复合数据，例如通过设置属性和对象字面量。\n\
  *   你可以从复合数据中提取数据，例如通过获取属性。\n\n构造数据的方式如下：\n\n```javascript\n// 构造：一次一个属性\nconst\
  \ jane1 = {};\njane1.first = 'Jane';\njane1.last = 'Doe';\n\n// 构造：多个属性\nconst jane2\
  \ = {\n  first: 'Jane',\n  last: 'Doe',\n};\n```\n\n``assert.deepEqual(jane1, jane2);`\n\
  \n### 39.3 我们哪里进行解构?\n\n## 39.4 对象解构\n\n#### 39.4.1 属性值简写\n\n#### 39.4.2 剩余属性\n\n\
  #### 39.4.3 语法陷阱：通过对象解构赋值\n\n## 39.5 数组解构\n\n#### 39.5.1 数组解构适用于任何迭代器\n\n#### 39.5.2\
  \ 剩余元素\n\n### 39.6 解构示例\n\n#### 39.6.1 数组解构：交换变量值\n\n#### 39.6.2 数组解构：返回数组的操作\n\n\
  #### 39.6.3 对象解构：多返回值\n\n### 39.7 如果模式部分没有匹配到任何内容会发生什么?\n\n#### 39.7.1 对象解构与缺失属性\n\
  \n\n\n\n提取数据如下：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n  last: 'Doe',\n\
  };\n\n// 提取：一次提取一个属性\nconst f1 = jane.first;\nconst l1 = jane.last;\nassert.equal(f1,\
  \ 'Jane');\nassert.equal(l1, 'Doe');\n\n// 提取：多个属性（新特性！）\nconst {first: f2, last:\
  \ l2} = jane; // (A)\nassert.equal(f2, 'Jane');\nassert.equal(l2, 'Doe');\n```\n\
  \n行 A 中的操作是新的：我们声明了两个变量 `f2` 和 `l2`，并通过解构赋值（多值提取）来初始化它们。\n\n行 A 的后续部分是一个解构模式：\n\n\
  ```javascript\n{first: f2, last: l2}\n```\n\n解构模式在语法上与用于多值构建的字面量相似。但它们出现在接收数据的地方（例如赋值的左侧），而不是创建数据的地方（例如赋值的右侧）。\n\
  \n## 39.3 可以在哪里进行解构？\n\n解构模式可以用于“数据汇聚点位置”，例如：\n\n*   变量声明：\n\n    ```javascript\n\
  \    const [a] = ['x'];\n    assert.equal(a, 'x');\n\n    let [b] = ['y'];\n   \
  \ assert.equal(b, 'y');\n    ```\n\n*   赋值：\n\n    ```javascript\n    let b;\n \
  \   [b] = ['z'];\n    assert.equal(b, 'z');\n    ```\n\n*   参数定义：\n\n    ```javascript\n\
  \    const f = ([x]) => x;\n    assert.equal(f(['a']), 'a');\n    ```\n\n注意，变量声明包括\
  \ `for-of` 循环中的 `const` 和 `let` 声明：\n\n```javascript\nconst arr = ['a', 'b'];\n\
  for (const [index, element] of arr.entries()) {\n  console.log(index, element);\n\
  }\n// 输出:\n// 0 'a'\n// 1 'b'\n```\n\n在接下来的两个章节中，我们将深入探讨两种类型的解构：对象解构和数组解构。\n\n##\
  \ 39.4 对象解构\n\n对象解构允许你通过看起来像对象字面量的模式来批量提取属性值：\n\n```javascript\nconst address =\
  \ {\n  street: 'Evergreen Terrace',\n  number: '742',\n  city: 'Springfield',\n\
  \  state: 'NT',\n  zip: '49007',\n};\nconst {street: s, city: c } = address;\nassert.equal(s,\
  \ 'Evergreen Terrace');\nassert.equal(c, 'Springfield');\n```\n\n你可以将该模式看作是覆盖在数据之上的透明片：模式\
  \ `'street'` 在数据中有一个匹配项。因此，数据值 `'Evergreen Terrace'` 被赋值给模式 `s`。\n\n你也可以对原始值进行对象解构：\n\
  \n```javascript\nconst {length: len} = 'abc';\nassert.equal(len, 3);\n```\n\n还可以对数组进行对象解构：\n\
  \n```javascript\nconst {0:x, 2:y} = ['a', 'b', 'c'];\nassert.equal(x, 'a');\nassert.equal(y,\
  \ 'c');\n```\n\n为什么这可以通？数组索引也是属性。\n\n### 39.4.1 属性值简写\n\n对象字面量支持属性值简写，因此对象模式也是如此：\n\
  \n```javascript\nconst {street, city } = address;\nassert.equal(street, 'Evergreen\
  \ Terrace');\nassert.equal(city, 'Springfield');\n```\n\n**练习：对象解构**\n\n`exercises/destructuring/object_destructuring`\n\
  \n### 39.4.2 剩余属性\n\n对象字面量可以有剩余属性。在模式中也可以有剩余属性（必须放在最后）：\n\n```javascript\nconst\
  \ obj = {a: 1, b: 2, c: 3};\nconst {a: propValue, ...remaining} = obj; // (A)\n\
  assert.equal(propValue, 1);\nassert.deepEqual(remaining, {b:2, c:3});\n```\n\n`remaining`\
  \ 变量包含了未解构的属性。\n\n### 39.4.3 语法陷阱：通过对象赋值\n\n如果在赋值中使用对象解构，会遇到由于歧义引起的问题——JavaScript\
  \ 会认为你正在开启一个代码块：\n\n```javascript\nlet prop;\nassert.throws(\n  () => {prop} = {prop:\
  \ 'hello'},\n  {\n    name: 'SyntaxError',\n    message: \"Unexpected token '='\"\
  ,\n  }\n);\n```\n\n**为什么用 eval()?**\n\n`eval()` 延迟了解析（以及 `SyntaxError`），直到 `assert.throws()`\
  \ 执行。如果我们不使用，代码在解析时就会报错，`assert.throws()` 根本不会执行。\n\n解决方法是将整个赋值放在括号中：\n\n```javascript\n\
  let prop;\n({prop} = {prop: 'hello'});\n```\n\n## 39.5 数组解构\n\n数组解构允许你通过看起来像数组字面量的模式来批量提取值：\n\
  \n```javascript\nconst [x, y] = ['a', 'b'];\nassert.equal(x, 'a');\n```\n\n你可以通过在模式中使用空位来跳过元素：\n\
  \n```javascript\nconst [, y] = ['a', 'b', 'c']; // (A)\nassert.equal(y, 'b');\n\
  ```\n\n数组模式的第一个元素是空位。\n\n### 39.5.1 数组解构适用于任何迭代器\n\n数组解构可以应用于任何迭代值，而不仅仅是数组：\n\n\
  ```javascript\nconst mySet = new Set().add('a').add('b').add('c');\nconst [first,\
  \ second] = mySet;\n```\n\n### 39.5.2 返回数组的操作\n\n当操作返回数组时，数组解构非常有用，例如正则表达式的 `.exec()`\
  \ 方法：\n\n```javascript\n// 跳过索引 0 的元素（整个匹配项）：\nconst [, year, month, day] =\n  /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/\n\
  \  .exec('2999-12-31');\nassert.equal(year, '2999');\nassert.equal(month, '12');\n\
  assert.equal(day, '31');\n```\n\n## 39.6 解构的示例\n\n### 39.6.1 数组解构：交换变量值\n\n你可以使用数组解构来交换两个变量的值，而不需要临时变量：\n\
  \n```javascript\nlet x = 'a';\nlet y = 'b';\n[x,y] = [y,x]; // 交换\nassert.equal(x,\
  \ 'b');\nassert.equal(y, 'a');\n```\n\n\n\n\n如果函数返回多个值——要么被封装为 `Array`，要么被封装为一个对象——那么解构就会非常有用。\n\
  \n考虑一个在 `Array` 中查找元素的 `findElement()` 函数：\n\n```javascript\nfindElement(array,\
  \ (value, index) => «boolean expression»)\n```\n\n它的第二个参数是一个函数，接收元素的 `value` 和 `index`，并返回一个布尔值，指示该元素是否为调用者寻找元素。\n\
  \n我们现在面临一个困境：`findElement()` 应该返回找到的元素的值还是索引？一种解决方案是创建两个独立的函数，但这会导致代码重复，因为这两个函数会非常相似。\n\
  \n以下实现通过返回一个包含找到的元素的 `index` 和 `value` 的对象，避免了重复：\n\n```javascript\nfunction findElement(arr,\
  \ predicate) {\n  for (let index=0; index < arr.length; index++) {\n    const value\
  \ = arr[index];\n    if (predicate(value)) {\n      // 我们找到了某些东西：\n      return\
  \ { value, index };\n    }\n  }\n  // 我们没有找到任何东西：\n  return { value: undefined,\
  \ index: -1 };\n}\n```\n\n解构帮助我们处理 `findElement()` 的结果：\n\n```javascript\nconst\
  \ arr = [7, 8, 6];\nconst {value, index} = findElement(arr, x => x % 2 === 0);\n\
  assert.equal(value, 8);\nassert.equal(index, 1);\n```\n\n由于我们处理的是属性键，提及 `value`\
  \ 和 `index` 的顺序并不重要：\n\n```javascript\nconst {index, value} = findElement(arr, x\
  \ => x % 2 === 0);\n```\n\n关键点在于，如果我们只对两个结果中的一个感兴趣，解构同样好用：\n\n```javascript\nconst\
  \ arr = [7, 8, 6];\nconst {value} = findElement(arr, x => x % 2 === 0);\nassert.equal(value,\
  \ 8);\n\nconst {index} = findElement(arr, x => x % 2 === 0);\nassert.equal(index,\
  \ 1);\n```\n\n所有这些便利性的结合使得这种处理多个返回值的方法变得非常灵活。\n\n## 39.7 如果模式部分没有匹配到任何内容会怎样？\n\n\
  如果模式的一部分没有匹配项会发生什么？与你使用非批运算符时的情况相同：你会得到 `undefined`。\n\n### 39.7.1 对象解构和缺失属性\n\n\
  如果对象模式中的属性在右侧没有匹配，你将得到 `undefined`：\n\n```javascript\nconst {prop: p} = {};\nassert.equal(p,\
  \ undefined);\n```\n\n### 39.7.2 数组解构和缺失元素\n\n如果 `Array` 模式中的元素在右侧没有匹配，你将得到 `undefined`：\n\
  \n```javascript\nconst [x] = [];\nassert.equal(x, undefined);\n```\n\n## 39.8 哪些值不能解构？\n\
  \n### 39.8.1 你不能对 `undefined` 和 `null` 进行对象解构\n\n对象解构仅在要解构的值为 `undefined` 或 `null`\
  \ 时失败。也就是说，每当通过点操作符访问属性失败时，它就会失败。\n\n```javascript\nconst {prop} = undefined\nTypeError:\
  \ Cannot destructure property 'prop' of 'undefined'\nit is undefined.\n\nconst {prop}\
  \ = null\nTypeError: Cannot destructure property 'prop' of 'null'\nit is null.\n\
  ```\n\n### 39.8.2 你不能对不可迭代值进行数组解构\n\n数组解构要求解构的值是可迭代的。因此，你不能对 `undefined` 和 `null`\
  \ 进行数组解构。你不能对不可迭代的对象进行数组解构：\n\n```javascript\nconst [x] = {}\nTypeError: {} is not\
  \ iterable\n```\n\n## 39.9 （高级）\n\n剩余的所有章节都是高级内容。\n\n## 39.10 默认值\n\n通常，如果模式没有匹配项，对应的变量将被设置为\
  \ `undefined`：\n\n```javascript\nconst {prop: p} = {};\nassert.equal(p, undefined);\n\
  ```\n\n如果你想使用不同的值，需要指定一个默认值（通过 `=`）：\n\n```javascript\nconst {prop: p = 123} = {};\
  \ // (A)\nassert.equal(p, 123);\n```\n\n在行 A 中，我们指定 `p` 的默认值为 `123`。之所以使用该默认值是因为我们要解构的数据没有名为\
  \ `prop` 的属性。\n\n### 39.10.1 数组解构中的默认值\n\n在这里，变量 `x` 和 `y` 分配了两个默认值，因为在被解构的 `Array`\
  \ 中不存在对应的元素：\n\n```javascript\nconst [x=1, y=2] = [];\nassert.equal(x, 1);\nassert.equal(y,\
  \ 2);\n```\n\n`Array` 模式中第一个元素的默认值为 `1`；第二个元素的默认值为 `2`。\n\n### 39.10.2 对象解构中的默认值\n\
  \n你也可以为对象解构指定默认值：\n\n```javascript\nconst {first='', last=''} = {};\nassert.equal(f,\
  \ '');\nassert.equal(l, '');\n```\n\n在被解构的对象中，属性键 `first` 和属性键 `last` 都不存在。因此，使用了默认值。\n\
  \n使用属性简写，这段代码变得更简单：\n\n```javascript\nconst {first='', last=''} = {};\nassert.equal(first,\
  \ '');\nassert.equal(last, '');\n```\n\n## 39.11 参数定义与解构相似\n\n考虑到我们在本章中学到的知识，参数定义与\
  \ `Array` 模式有许多共同点（剩余元素、默认值等）。事实上，以下两个函数声明是等效的：\n\n```javascript\nfunction f1(pattern1,\
  \ pattern2) {\n  // ...\n}\nfunction f2(...args) {\n  const [pattern1, pattern2]\
  \ = args;\n  // ...\n}\n```\n\n## 39.12 嵌套解构\n\n到目前为止，我们只在解构模式内部使用变量作为赋值目标（数据汇）。但你也可以将模式作为赋值目标，这允许你嵌套任意深度的模式：\n\
  \n```javascript\nconst arr = [\n  { first: 'Jane', last: 'Bond' },\n  { first: 'Lars',\
  \ last: 'Croft' },\n];\nconst [, {first}] = arr;\nassert.equal(first, 'Lars');\n\
  ```\n\n在行 A 的 `Array` 模式内部，索引 1 处有一个嵌套的对象模式。嵌套模式可能会难以理解，因此最好适节使用。\n\n# 40 同步生成器（高级）\n\
  \n\n\n\n\n* 40.4.3 [外部迭代 (拉取)]\n* 40.5 [生成器的高级特性]\n\n## 40.1 什么是同步生成器？\n\n同步生成器是函数定义和方法定义的特殊版本，它们始终返回同步迭代器：\n\
  \n```javascript\n// 生成器函数声明\nfunction* genFunc1() { /*···*/ }\n\n// 生成器函数表达式\nconst\
  \ genFunc2 = function* () { /*···*/ };\n\n// 对象字面量中的生成器方法定义\nconst obj = {\n  *\
  \ generatorMethod() {\n    // ···\n  }\n};\n\n// 类定义中的生成器方法定义\n// (类声明或类表达式)\nclass\
  \ MyClass {\n  * generatorMethod() {\n    // ···\n  }\n}\n```\n\n星号 (`*`) 将函数和方法标记为生成器：\n\
  \n* 函数：伪关键字 `function*` 是关键字 `function` 和星号的组合。\n* 方法：`*` 是一个修饰符（类似于 `static` 和\
  \ `get`）。\n\n### 40.1.1 生成器函数返回迭代器并通过 `yield` 填充它们\n\n如果你调用一个生成器函数，它会返回一个迭代器（实际上是一个可迭代的迭代器）。生成器通过\
  \ `yield` 运算符填充该迭代器：\n\n```javascript\nfunction* genFunc1() {\n  yield 'a';\n  yield\
  \ 'b';\n}\n\nconst iterable = genFunc1();\n// 将迭代器转换为数组，以检查内部内容：\nassert.deepEqual([...iterable],\
  \ ['a', 'b']);\n\n// 你也可以使用 for-of 循环\nfor (const x of genFunc1()) {\n  console.log(x);\n\
  }\n// 输出：\n// 'a'\n// 'b'\n```\n\n### 40.1.2 yield 会暂停生成器函数\n\n使用生成器函数涉及以下步骤：\n\n\
  * 调用该函数会返回一个迭代器 `iter`（它也是可迭代的）。\n* 重复迭代 `iter` 会反复调用 `iter.next()`。每次调用，我们都会跳转到生成器函数的体内，直到遇到一个返回值的\
  \ `yield`。\n\n因此，`yield` 的作用不仅仅仅仅是向迭代器添加值——它还会暂停并退出生成器函数：\n\n* 类似于 `return`，`yield`\
  \ 会退出函数体并返回一个值（通过 `.next()`）。\n* 与 `return` 不同，如果重复调用（`.next()`），执行将直接从 `yield`\
  \ 之后的地方继续。\n\n让我们通过以下这个生成器函数来检查这意味着什么。\n\n```javascript\nlet location = 0;\nfunction*\
  \ genFunc2() {\n  location = 1; yield 'a';\n  location = 2; yield 'b';\n  location\
  \ = 3;\n}\n```\n\n为了使用 `genFunc2()`，我们必须先创建迭代器/迭代对象 `iter`。此时 `genFunc2()` 暂停在函数体“之前”。\n\
  \n```javascript\nconst iter = genFunc2();\n// genFunc2() 现在暂停在函数体“之前”：\nassert.equal(location,\
  \ 0);\n```\n\n`iter` 迭代协议 (#ch033.xhtml_ch_sync-iteration)。因此，我们通过 `iter.next()`\
  \ 控制 `genFunc2()` 的执行。调用该方法会恢复暂停的 `genFunc2()` 并执行它，直到遇到 `yield`。然后执行暂停，`.next()`\
  \ 返回 `yield` 的操作数：\n\n```javascript\nassert.deepEqual(\n  iter.next(), {value: 'a',\
  \ done: false});\n// genFunc2() 现在暂停在第一个 yield 之后：\nassert.equal(location, 1);\n\
  ```\n\n注意，产出的值 `'a'` 被封装在一个对象中，这是迭代器始终递送其值的方式。\n\n我们再次调用 `iter.next()`，执行从我们之前暂停的地方继续。当我们遇到第二个\
  \ `yield` 时，`genFunc2()` 暂停，`.next()` 返回产出的值 'b'。\n\n```javascript\nassert.deepEqual(\n\
  \  iter.next(), {value: 'b', done: false});\n// genFunc2() 现在暂停在第二个 yield 之后：\n\
  assert.equal(location, 2);\n```\n\n我们再次调用一次 `iter.next()`，执行一直持续直到它离开 `genFunc2()`\
  \ 的体：\n\n```javascript\nassert.deepEqual(\n  iter.next(), {value: undefined, done:\
  \ true});\n// 我们已经到达了 genFunc2() 的结束：\nassert.equal(location, 3);\n```\n\n这一次，`.next()`\
  \ 结果的 `.done` 属性为 `true`，这意味着迭代器已完成。\n\n### 40.1.3 为什么 yield 要暂停执行？\n\n`yield` 暂停执行有什么好处？为什么它不简单地像\
  \ Array 方法 `.push()` 那样工作并填充迭代器而不暂停呢？\n\n由于暂停机制，生成器提供了协程的许多特性（想象成协作多任务的进程）。例如，当你请求迭代器的下一个值时，该值是按需计算（懒加载）的。以下生成器函数演示了这意味着。\n\
  \n```javascript\nfunction* genLines() {\n  yield 'A line';\n  yield 'Another line';\n\
  \  yield 'Last line';\n}\n\nfunction* numberLines(lineIterable) {\n  let lineNumber\
  \ = 1;\n  for (const line of lineIterable) {\n    yield lineNumber + ': ' + line;\n\
  \    lineNumber++;\n  }\n}\n```\n\n注意 `numberLines()` 中的 `yield` 出现在 `for` 循环内部。`yield`\
  \ 可以用于循环内部，但不能在回调内部（更多信息见后文）。\n\n让我们结合这两个生成器来产生可迭代对象 `numberedLines`：\n\n```javascript\n\
  const numberedLines = numberLines(genLines());\nassert.deepEqual(\n  numberedLines.next(),\
  \ {value: '1: A line', done: false});\nassert.deepEqual(\n  numberedLines.next(),\
  \ {value: '2: Another line', done: false});\n```\n\n在这里使用生成器的关键优势是一切都是增量运行的：通过 `numberedLines.next()`，我们只向\
  \ `numberLines()` 请求一个带编号的行。反过来，它向 `genLines()` 请求一个不带编号的行。\n\n这种增量机制会继续起，例如，如果\
  \ `genLines()` 从一个大文件中读取行：如果我们向 `numberLines()` 请求一个带编号的行，只要 `genLines()` 读取了第一行，我们就能得到。\n\
  \n如果没有生成器，`genLines()` 将首先读取所有行并返回它们。然后 `numberLines()` 会为所有行编号并返回它们。因此，我们必须等待更长时间才能得到第一行。\n\
  \n### 40.1.4 示例：对迭代器进行映射\n\n以下函数 `mapIter()` 类似于 Array 方法 `.map()`，但它返回的是可迭代对象而不是数组，并且按需产生结果。\n\
  \n```javascript\nfunction* mapIter(iterable, func) {\n  let index = 0;\n  for (const\
  \ x of iterable) {\n    yield func(x, index);\n    index++;\n  }\n}\n\nconst iterable\
  \ = mapIter(['a', 'b'], x => x + x);\nassert.deepEqual([...iterable], ['aa', 'bb']);\n\
  ```\n\n\n\n\n\n`yield` 只能在生成器内部直接工作——到目前为止，我们还没有看到将 `yield` 委托给另一个函数或方法的方法\n\n让我们先来看哪些是*不生效*的：在下面的示例中，我们希望\
  \ `foo()` 调用 `bar()`，以便后者为前者产出两个值。遗憾的是，简单的方法失败了：\n\n```javascript\nfunction* bar()\
  \ {\n  yield 'a';\n  yield 'b';\n}\nfunction* foo() {\n  // 如果我们调用 `bar()`，什么都不会发生：\n\
  \  bar();\n}\nassert.deepEqual(\n  [...foo()], []);\n```\n\n为什么这不起作用？函数调用 `bar()`\
  \ 返回了一个可迭代对象，而我们忽略了它。\n\n我们想要的是让 `foo()` 产出 `bar()` 产生的所有值。这正是 `yield*` 运算符的作用：\n\
  \n```javascript\nfunction* bar() {\n  yield 'a';\n  yield 'b';\n}\nfunction* foo()\
  \ {\n  yield* bar();\n}\nassert.deepEqual(\n  [...foo()], ['a', 'b']);\n```\n\n\
  换句话说，之前的 `foo()` 大约等同于：\n\n```javascript\nfunction* foo() {\n  for (const x of bar())\
  \ {\n    yield x;\n  }\n}\n```\n\n注意 `yield*` 适用于任何可迭代对象：\n\n```javascript\nfunction*\
  \ gen() {\n  yield* [1, 2];\n}\nassert.deepEqual(\n  [...gen()], [1, 2]);\n```\n\
  \n## 40.2.2 示例：遍历树结构\n\n`yield*` 允许我们在生成器中进行递归调用，这在遍历递归数据结构（如树）时非常有用。以以下二叉树数据结构为例：\n\
  \n```javascript\nclass BinaryTree {\n  constructor(value, left=null, right=null)\
  \ {\n    this.value = value;\n    this.left = left;\n    this.right = right;\n \
  \ }\n\n  /** 前序遍历：父节点在子节点之前 */\n  *[Symbol.iterator]() {\n    yield this.value;\n\
  \    if (this.left) {\n      // 等同于 yield* this.left[Symbol.iterator]()\n      yield*\
  \ this.left;\n    }\n    if (this.right) {\n      yield* this.right;\n    }\n  }\n\
  }\n```\n\n方法 `[Symbol.iterator]()` 添加了迭代迭代的支持，这意味着我们可以使用 `for-of` 循环来遍历 `BinaryTree`\
  \ 的实例：\n\n```javascript\nconst tree = new BinaryTree('a',\n  new BinaryTree('b',\n\
  \    new BinaryTree('c'),\n    new BinaryTree('d')),\n  new BinaryTree('e'));\n\n\
  for (const x of tree) {\n  console.log(x);\n}\n// 输出：\n// 'a'\n// 'b'\n// 'c'\n\
  // 'd'\n// 'e'\n```\n\n**练习：遍历嵌套数组**\n\n`exercises/sync-generators/iter_nested_arrays_test.mjs`\n\
  \n## 40.3 背景：外部迭代 vs 内部迭代\n\n在准备下一节之前，我们需要学习两种遍历对象“内部”值的不同风格：\n\n*   **外部迭代（拉取 pull）**：你的代码通过迭代协议向对象请求值。例如，`for-of`\
  \ 循环基于 JavaScript 的迭代协议：\n\n    ```javascript\n    for (const x of ['a', 'b']) {\n\
  \      console.log(x);\n    }\n    // 输出：\n    // 'a'\n    // 'b'\n    ```\n\n*\
  \   **内部迭代（推送 push）**：你将回调函数传递给对象的方法，该方法将值传递给回调函数。例如，数组有 `.forEach()` 方法：\n\n  \
  \  ```javascript\n    ['a', 'b'].forEach((x) => {\n      console.log(x);\n    });\n\
  \    // 输出：\n    // 'a'\n    // 'b'\n    ```\n\n下一节包含了这两种风格的示例。\n\n## 40.4 生成器的用例：复用遍历\n\
  \n生成器的一个重要用例是提取和复用遍历。\n\n### 40.4.1 需要复用的遍历\n\n作为一个示例，考虑以下函数，它遍历文件树并记录它们的路径（它使用\
  \ https://nodejs.org/en/docs/ 的 Node.js API 来实现这一点）：\n\n```javascript\nfunction\
  \ logPaths(dir) {\n  for (const fileName of fs.readdirSync(dir)) {\n    const filePath\
  \ = path.resolve(dir, fileName);\n    console.log(filePath);\n    const stats =\
  \ fs.statSync(filePath);\n    if (stats.isDirectory()) {\n      logPaths(filePath);\
  \ // 递归调用\n    }\n  }\n}\n```\n\n考虑以下目录：\n\n```\nmydir/\n    a.txt\n    b.txt\n\
  \    subdir/\n        c.txt\n```\n\n让我们记录 `mydir/` 内部的路径：\n\n```javascript\nlogPaths('mydir');\n\
  // 输出：\n// 'mydir/a.txt'\n// 'mydir/b.txt'\n// 'mydir/subdir'\n// 'mydir/subdir/c.txt'\n\
  ```\n\n### 40.4.2 内部迭代（推送）\n\n复用遍历的一种方法是通过*内部迭代*：每个值都被传递给回调函数。\n\n```javascript\n\
  function visitPaths(dir, callback) {\n  for (const fileName of fs.readdirSync(dir))\
  \ {\n    const filePath = path.resolve(dir, fileName);\n    callback(filePath);\n\
  \    const stats = fs.statSync(filePath);\n    if (stats.isDirectory()) {\n    \
  \  visitPaths(filePath, callback);\n    }\n  }\n}\nconst paths = [];\nvisitPaths('mydir',\
  \ p => paths.push(p));\nassert.deepEqual(\n  paths,\n  ['mydir/a.txt',\n    'mydir/b.txt',\n\
  \    'mydir/subdir',\n    'mydir/subdir/c.txt']);\n```\n\n### 40.4.3 外部迭代（拉取）\n\n\
  复用遍历的另一种方法是通过*外部迭代*：我们可以写一个产出所有值的生成器。\n\n```javascript\nfunction* iterPaths(dir)\
  \ {\n  for (const fileName of fs.readdirSync(dir)) {\n    const filePath = path.resolve(dir,\
  \ fileName);\n    yield filePath; // (A)\n    const stats = fs.statSync(filePath);\n\
  \    if (stats.isDirectory()) {\n      yield* iterPaths(filePath);\n    }\n  }\n\
  }\nconst paths = [...iterPaths('mydir')];\n```\n\n\n\n\n- 41.2 调用堆栈\n- 41.3 事件循环\n\
  - 41.4 如何避免阻塞 JavaScript 进程\n    - 41.4.1 浏览用户界面可能会阻塞\n    - 41.4.2 我们如何避免阻塞浏览器？\n\
  \    - 41.4.3 适时休息\n    - 41.4.4 执行到完成语义\n- 41.5 传递异步结果的模式\n    - 41.5.1 通过事件传递异步结果\n\
  \    - 41.5.2 通过回调函数传递异步结果\n- 41.6 异步代码：缺点\n- 41.7 资源\n\n本章解释了 JavaScript 异步编程的基础知识。\n\
  \n## 41.1 JavaScript 异步编程路线图\n\n本节节为 JavaScript 异步编程的内容提供了路线图。\n\n![](img/file0.svg)\
  \ **不要担心细节！**\n\n如果你还没有理解所有内容，不要担心。这只是对即将出现内容的快速预览。\n\n### 41.1.1 同步函数\n\n普通函数是`同步的`：调用者会等待被调用者完成计算。行\
  \ A 中的 `divideSync()` 是一个同步函数调用：\n\n```\nfunction main() {\n  try {\n    const result\
  \ = divideSync(12, 3); // (A)\n    assert.equal(result, 4);\n  } catch (err) {\n\
  \    assert.fail(err);\n  }\n}\n```\n\n### 41.1.2 JavaScript 在单进程中顺序执行任务\n\n默认情况下，JavaScript\
  \ 的 `tasks` 是在单进程中顺序执行的函数。它们看起来如下：\n\n```\nwhile (true) {\n  const task = taskQueue.dequeue();\n\
  \  task(); // 运行任务\n}\n```\n\n这个循环也被称为`event loop`（事件循环），因为事件（如点击鼠标）会将任务添加到队列中。\n\
  \n由于这种协作式多任务的风格，我们不希望某个任务在等待从服务器返回的结果时，会阻塞其他任务的执行。下一个小节将探讨如何处理这种情况。\n\n### 41.1.3\
  \ 基于回调的异步函数\n\n如果 `divide()` 需要服务器来计算结果呢？那么结果应该以不同的方式传递：调用者不应该（同步地）等待结果准备就绪；当结果准备好，应该（异步地）通知它。异步传递结果的一种方法是给\
  \ `divide()` 传递回调函数，它使用该函数来通知调用者。\n\n```\nfunction main() {\n  divideCallback(12,\
  \ 3,\n    (err, result) => {\n      if (err) {\n        assert.fail(err);\n    \
  \  } else {\n        assert.equal(result, 4);\n      }\n    });\n}\n```\n\n当发生异步函数调用时：\n\
  \n```\ndivideCallback(x, y, callback)\n```\n\n会发生以下步骤：\n\n* `divideCallback()` 向服务器发送请求。\n\
  \n* 然后，当前任务 `main()` 完成，可以执行其他任务。\n\n* 当服务器的响应到达时，它可能是：\n\n    * 一个错误 `err`：则将下一个任务添加到队列中。\n\
  \n      ```\n      taskQueue.enqueue(() => callback(err));\n      ```\n\n    * 一个结果\
  \ `r`：则将下一个任务添加到队列中。\n\n      ```\n      taskQueue.enqueue(() => callback(null,\
  \ r));\n      ```\n\n### 41.1.4 基于 Promise 的异步函数\n\nPromise 包含两个方面：\n\n* 一种让处理回调变得更简单的标准模式。\n\
  \n* 构建 `async functions`（下一节的主题）的机制。\n\n调用一个基于 Promise 的函数如下：\n\n```\nfunction main()\
  \ {\n  dividePromise(12, 3)\n    .then(result => assert.equal(result, 4))\n    .catch(err\
  \ => assert.fail(err));\n}\n```\n\n### 41.1.5 Async 函数\n\n看待 async 函数的一种方式是将其视为基于\
  \ Promise 代码的更好语法：\n\n```javascript\nasync function main() {\n  try {\n    const\
  \ result = await dividePromise(12, 3); // (A)\n    assert.equal(result, 4);\n  }\
  \ catch (err) {\n    assert.fail(err);\n  }\n}\n```\n\n我们在行 A 中调用的 `dividePromise()`\
  \ 与上一节中的基于 Promise 的函数相同。但现在我们有了看起来像同步的语法来处理该调用。`await` 只能在特殊函数内部，即 `async function`（注意关键字\
  \ `function` 前的 `async`）中使用。`await` 会暂停当前的异步函数并从中返回。一旦等待的结果就绪，函数的执行将从上次停止的地方继续。\n\
  \n### 41.1.6 下一步\n\n* 在本章中，我们将看到同步函数是如何工作的。\n* 本章通过回调涵盖了异步性。\n* 接下来的章节将涵盖 `Promises`\
  \ 和 `async functions`。\n* 本系列章节将以异步迭代结束。\n\n## 41.2 调用堆栈\n\n每当一个函数调用另一个函数时，我们需要记住在后者完成后返回到哪里。这通常通过堆栈完成——调用者将要返回的位置推入栈中。\n\
  \n这是一个发生了多次调用的示例：\n\n```\nfunction h(z) {\n  const error = new Error();\n  console.log(error.stack);\n\
  }\nfunction g(y) {\n  h(y + 1);\n}\nfunction f(x) {\n  g(x + 1);\n}\nf(3);\n// 完成\n\
  ```\n\n最初在运行这段代码之前，调用堆栈是空的。在第 11 行执行函数调用 `f(3)` 后，堆栈有一个条目：\n\n* 第 12 行（顶层作用域）\n\n\
  在第 9 行执行函数调用 `g(x + 1)` 后，堆栈有两个条目：\n\n* 第 10 行（在 `f()` 中）\n* 第 12 行（顶层作用域）\n\n在第\
  \ 6 行执行函数调用 `h(y + 1)` 后，堆栈有三个条目：\n\n* 第 7 行（在 `g()` 中）\n* 第 10 行（在 `f()` 中）\n*\
  \ 第 12 行（顶层作用域）\n\n在第 3 行记录 `error` 会产生如下输出：\n\n```\nDEBUG\n```\n\n```\nError: \n\
  \    at h (file://demos/async-js/stack_trace.mjs:2:17)\n    at g (file://demos/async-js/stack_trace.mjs:6:3)\n\
  \    at f (file://demos/async-js/stack_trace.mjs:9:3)\n    at file://demos/async-js/stack_trace.mjs:11:1\n\
  ```\n\n这就是 `Error` 对象创建位置的所谓*堆栈轨迹*（stack trace）。请注意它记录的是调用发生的位置，而不是返回位置。在第 2 行创建异常是另一个调用。这就是为什么堆栈轨迹包含了\
  \ `h()` 内部的位置。\n\n\n\n\n在第 3 行之后，每个函数都会终止，并且每次都会从调用栈中移除顶部项。当函数 `f` 执行完成后，我们回到了顶层作用域，栈为空。当代码片段结束时，这相当于一个隐式的\
  \ `return`。如果我们认为代码片段是一个正在执行的任务，那么带有空调用栈的返回意味着任务的结束。\n\n## 41.3 事件循环\n\n默认情况下，JavaScript\
  \ 在单进程中运行——是在 Web 浏览器还是 Node.js 中都是。所谓的 `event loop` 顺序执行该进程内部 `tasks`（代码段）。事件循环如图\
  \ 21 所示。\n\n![](img/file30.svg)\n\n图 21：`Task sources` 向 `task queue` 添加要运行的代码，并由\
  \ `event loop` 清空该队列。\n\n有两个部分访问任务队列：\n\n*   `Task sources` 向队列添加任务。其中某些源与 JavaScript\
  \ 进程并发运行。例如，一个任务源负责用户界面事件：如果用户点击了某个地方并且注册了点击监听器，那么该监听器的调用将被添加到任务队列中。\n\n*   `event\
  \ loop` 在 JavaScript 进程内部持续运行。在每次循环迭代中，它从队列中取出一个任务（如果队列为空，它会等待直到不为空）并执行它。当调用栈为空并存在\
  \ `return` 时，该任务完成。控制权返回给事件循环，它随后从队列中检索下一个任务并执行它。以此此类推。\n\n以下 JavaScript 代码是事件循环的近似表示：\n\
  \n```\nwhile (true) {\n  const task = taskQueue.dequeue();\n  task(); // run task\n\
  }\n```\n\n## 41.4 如何避免阻塞 JavaScript 进程\n\n### 41.4.1 浏览器的用户界面可能会阻塞\n\n浏览器的许多用户界面机制也运行在\
  \ JavaScript 进程中（作为任务）。因此，长时间运行的 JavaScript 代码可能会阻塞用户界面。让我们来看一个演示这一点的网页。你有两种方式可以尝试该页面：\n\
  \n*   你可以[在线运行它](http://rauschma.github.io/async-examples/blocking.html)。\n*   你可以在包含练习的仓库中打开以下文件：`demos/async-js/blocking.html`\n\
  \n以下 HTML 是该页面的用户界面：\n\n```\n<a id=\"block\" href=\"\">Block</a>\n<div id=\"statusMessage\"\
  ></div>\n<button>Click me!</button>\n```\n\n其原理是当你点击“Block”，将通过 JavaScript 执行一个长时间运行的循环。在循环期间，你无法点击按钮，因为浏览器/JavaScript\
  \ 进程被阻塞了。\n\n简化版的 JavaScript 代码看起来如下：\n\n```\ndocument.getElementById('block')\n\
  \  .addEventListener('click', doBlock); // (A)\n\nfunction doBlock(event) {\n  //\
  \ ···\n  displayStatus('Blocking...');\n  // ···\n  sleep(5000); // (B)\n  displayStatus('Done');\n\
  }\n\nfunction sleep(milliseconds) {\n  const start = Date.now();\n  while ((Date.now()\
  \ - start) < milliseconds);\n}\nfunction displayStatus(status) {\n  document.getElementById('statusMessage')\n\
  \    .textContent = status;\n}\n```\n\n这些是代码的关键部分：\n\n*   A 行：我们告诉浏览器每当 ID 为 `block`\
  \ 的 HTML 元素被点击时，调用 `doBlock()`。\n*   `doBlock()` 显示状态信息，然后调用 `sleep()` 来阻塞 JavaScript\
  \ 进程 5000 毫秒（B 行）。\n*   `sleep()` 通过循环直到足够的时间通过来阻塞 JavaScript 进程。\n*   `displayStatus()`\
  \ 在 ID 为 `statusMessage` 的 `<div>` 内部显示状态消息。\n\n### 41.4.2 我们如何避免阻塞浏览器？\n\n有几种方法可以防止长时间运行的操作阻塞浏览器：\n\
  \n*   操作可以异步 `asynchronously` 交付结果：某些操作（如下载）可以与 JavaScript 进程并发执行。触发此类操作的 JavaScript\
  \ 代码注册一个回调函数，一旦操作完成，该回调将带结果被调用。调用通过任务队列处理。这种交付结果风格被称为`异步`，因为调用者不需要等待结果准备就绪。普通的函数调用同步地交付结果。\n\
  *   在单独的进程中执行长时间计算：这可以通过所谓的 `Web Workers` 实现。Web Workers 是与主进程并发运行的重量级进程。它们每一个都有自己的运行时环境（全局变量等）。它们是完全隔离的，必须通过消息传递进行通信。更多信息请参阅\
  \ [MDN web docs](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API)。\n\
  *   在长时间计算期间进行休息。下一小节将解释如何做到。\n\n### 41.4.3 休息\n\n以下全局函数在延迟 `ms` 毫秒后执行其参数 `callback`（类型签名已简化——`setTimeout()`\
  \ 具有更多功能）：\n\n```\nfunction setTimeout(callback: () => void, ms: number): any\n\
  ```\n\n该函数返回一个 `handle`（ID），可以通过以下全局函数来 `clear` 定时（取消回调的执行）：\n\n```\nfunction clearTimeout(handle?:\
  \ any): void\n```\n\n`setTimeout()` 在浏览器和 Node.js 中均可用。下一小节将展示它的实际应用。\n\n![](img/file2.svg)\
  \ **`setTimeout()` 让任务得以休息**\n\n查看 `setTimeout()` 的另一种方式是当前任务休息，并在稍后通过回调继续。\n\n\
  ### 41.4.4 运行到完成语义\n\nJavaScript 对任务提供了一种保证：\n\n> 每个任务在执行下一个任务之前总是完成的（“运行到完成”）。\n\
  \n因此，任务不需要担心它们的数据在处理过程中被更改（*并发修改*）。这简化了 JavaScript 的编程。\n\n以下示例演示了这一保证：\n\n```\n\
  console.log('start');\nsetTimeout(() => {\n  console.log('callback');\n}, 0);\n\
  console.log('end');\n\n// 输出:\n// 'start'\n// 'end'\n// 'callback'\n```\n\n`setTimeout()`\
  \ 将其参数放入任务队列。因此，该参数将在当前代码段（任务）完全完成后的某个时间执行。\n\n参数 `ms` 仅指定任务何时被放入队列，而不是它确切何时运行。它甚至可能永远不会运行——例如，如果队列中它之前有一个永远不会终止的任务。这解释了为什么之前的代码在参数\
  \ `ms` 为 `0` 的情况下在 `'callback'` 之前记录了 `'end'`。\n\n## 41.5 交付异步结果的模式\n\n为了避免在等待长时间运行的操作完成时阻塞主进程，JavaScript\
  \ 通常异步地交付结果。以下是实现此目标的三种流行模式：\n\n*   事件 (Events)\n*   回调 (Callbacks)\n*   承诺 (Promises)\n\
  \n前两种模式将在接下来的两个小节中解释。Promises 将在下一章 中解释。\n\n### 41.5.1 通过事件交付异步结果\n\n作为模式的事件工作方式如下：\n\
  \n*   它们被用于异步交付值。\n*   它们执行零次或多次。\n*   该模式中有三个角色：\n    *   `event`（对象）承载要交付的数据。\n\
  \    *   `event listener`（事件监听器）是一个通过参数接收事件的函数。\n    *   `event source`（事件源）发送事件并允许你注册事件监听器。\n\
  \n\n\n\n这种模式在 JavaScript 世界中存在多种变体。接下来我们将看三个例子。\n\n### 41.5.1.1 事件：IndexedDB\n\n\
  IndexedDB 是内置在网页浏览器中的数据库。以下是使用它的示例：\n\n```\nconst openRequest = indexedDB.open('MyDatabase',\
  \ 1); // (A)\n\nopenRequest.onsuccess = (event) => {\n  const db = event.target.result;\n\
  \  // ···\n};\n\nopenRequest.onerror = (error) => {\n  console.error(error);\n};\n\
  ```\n\n`indexedDB` 调用操作的方式与众寻常：\n\n*   每个操作都有一个关联的方法用于创建请求对象。例如，在 A 行中，操作是“open”，方法是\
  \ `.open()`，而请求对象是 `openRequest`。\n*   操作的参数是通过请求对象提供的，而不是通过方法的入参数提供的。例如，事件监听器（函数）存储在属性\
  \ `.onsuccess` 和 `.onerror` 中。\n*   操作的调用是通过该方法（在 A 行中）被添加到任务队列的。也就是说，我们在操作被添加到队列之后才对其进行配置。在这里，只有运行到完成（run-to-completion）语义让我们免于竞态条件的影响，并确保操作在当前代码段执行后运行。\n\
  \n### 41.5.1.2 事件：XMLHttpRequest\n\n`XMLHttpRequest` API 允许我们在网页浏览器内部进行下载。这就是我们下载文件\
  \ `http://example.com/textfile.txt` 的方式：\n\n```\nconst xhr = new XMLHttpRequest();\
  \ // (A)\nxhr.open('GET', 'http://example.com/textfile.txt'); // (B)\nxhr.onload\
  \ = () => { // (C)\n  if (xhr.status == 200) {\n    processData(xhr.responseText);\n\
  \  } else {\n    assert.fail(new Error(xhr.statusText));\n  }\n};\nxhr.onerror =\
  \ () => { // (D)\n  assert.fail(new Error('Network error'));\n};\nxhr.send(); //\
  \ (E)\n\nfunction processData(str) {\n  assert.equal(str, 'Content of textfile.txt\\\
  n');\n}\n```\n\n使用这个 API，我们首先创建一个请求对象（A 行），然后对其进行配置，最后激活它（E 行）。配置包括：\n\n*   指定使用哪种\
  \ HTTP 请求方法（B 行）：`GET`、`POST`、`PUT` 等。\n*   注册一个监听器（C 行），如果可以下载内容，该监听器会被通知。在监听器内部，我们仍然需要判断下载的内容包含了我们请求的数据还是通知我们了错误。注意，部分结果数据是通过请求对象\
  \ `xhr` 传递。（我不喜欢这种输入和输出数据混合的方式。）\n*   注册一个监听器（D 行），如果发生网络错误，该监听器会被通知。\n\n### 41.5.1.3\
  \ 事件：DOM\n\n我们已经从 [§41.4.1 “浏览器的用户界面可能会阻塞”]中见过 DOM 事件的操作。以下代码也处理了 `click` 事件：\n\n\
  ```\nconst element = document.getElementById('my-link'); // (A)\nelement.addEventListener('click',\
  \ clickListener); // (B)\n\nfunction clickListener(event) {\n  event.preventDefault();\
  \ // (C)\n  console.log(event.shiftKey); // (D)\n}\n```\n\n我们首先请求浏览器获取 ID 为 `'my-link'`\
  \ 的 HTML 元素（A 行）。然后我们为所有 `click` 事件添加监听器（B 行）。在监听器中，我们首先告诉浏览器不要执行其默认操作（C 行）——跳转到链接的目标。然后，如果当前按下\
  \ shift 键，我们将其记录到控制台（D 行）。\n\n### 41.5.2 通过回调传递异步结果\n\n回调是处理异步结果的另一种模式。它们仅用于一次性结果处理，并且具有比事件更简洁的优点。\n\
  \n例如，考虑一个函数 `readFile()`，它读取一个文本文件并异步返回其内容。如果 `readFile()` 使用 Node.js 风格的回调，调用方式如下：\n\
  \n```javascript\nreadFile('some-file.txt', {encoding: 'utf8'},\n  (error, data)\
  \ => {\n    if (error) {\n      assert.fail(error);\n      return;\n    }\n    assert.equal(data,\
  \ 'The content of some-file.txt\\n');\n  });\n```\n\n有一个回调可以同时处理成功和失败。如果第一个参数不是\
  \ `null`，那么...\n\n\n\n\n\n# 42.3 错误处理：不要混用拒绝和异常\n# 42.4 基于 Promise 的函数同步开始，异步终结\n\
