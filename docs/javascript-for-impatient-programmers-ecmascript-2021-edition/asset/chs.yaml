  \ 类型转换（类型间的自动转换)\n\n在本章中，我们将检查 JavaScript 有哪些类型的值。\n\n![](img/file0.svg) **辅助工具：`===`**\n\
  \n在本章中，我们将偶尔使用严格相等运算符。如果 `a` 和 `b` 相等，则 `a === b` 结果为 `true`。其具体含义在 §15.4.2 “严格相等\
  \ (`===`)” 中解释。\n\n14.1 什么是类型？\n\n在本章中，我们将检查 JavaScript 有哪些类型的值。\n\n![](img/file0.svg)\
  \ **辅助工具：`===`**\n\n在本章中，我们将偶尔使用严格相等运算符。如果 `a` 和 `b` 相等，则 `a === b` 结果为 `true`。其具体含义在\
  \ §15.4.2 “严格相等 (`===`)” 中解释。\n\n14.2 JavaScript 的类型层次结构\n\n在本章中，我们将检查 JavaScript\
  \ 有哪些类型的值。\n\n![](img/file0.svg) **辅助工具：`===`**\n\n在本章中，我们将偶尔使用严格相等运算符。如果 `a` 和\
  \ `b` 相等，则 `a === b` 结果为 `true`。其具体含义在 §15.4.2 “严格相等 (`===`)” 中解释。\n\n\n\n\n```\n\
  [](#cb139-1)let str = 'abc';\n[](#cb139-2)assert.equal(str.length, 3);\n[](#cb139-3)assert.throws(\n\
  [](#cb139-4)  () => { str.length = 1 },\n[](#cb139-5)  /^TypeError: Cannot assign\
  \ to read only property 'length'//\n[](#cb139-6));\n```\n\n### 14.4.1.2 基本类型按值传递\n\
  \n基本类型是`按值传递的`：变量（包括参数）存储基本类型的内容。当将基本类型值赋值给变量或将其作为参数传递给函数时，其内容会被复制。\n\n```\n[](#cb140-1)let\
  \ x = 123;\n[](#cb140-2)let y = x;\n[](#cb140-3)assert.equal(y, 123);\n```\n\n###\
  \ 14.4.1.3 基本类型按值比较\n\n基本类型是`按值比较的`：当比较两个基本类型值时，我们比较它们的内容。\n\n```\n[](#cb141-1)assert.equal(123\
  \ === 123, true);\n[](#cb141-2)assert.equal('abc' === 'abc', true);\n```\n\n要了解这种比较方式的特殊之处，请继续阅读并了解对象是如何比较的。\n\
  \n## 14.4.2 对象\n\n对象在 [§30 “单个对象”]]以及后续章节中会有详细介绍。在这里，我们主要关注它们与基本类型值的区别。\n\n让我们先探索创建对象的两种常见方式：\n\
  \n*   对象字面量：\n\n    ```\n[](#cb142-1)const obj = {\n[](#cb142-2)  first: 'Jane',\n\
  [](#cb142-3)  last: 'Doe',\n[](#cb142-4)};\n    ```\n\n    对象字面量以大括号 `{}` 开始和结束。它创建了一个具有两个属性的对象。第一个属性的键为\
  \ `'first'`（一个字符串），值为 `'Jane'`。第二个属性的键为 `'last'`，值为 `'Doe'`。有关对象字面量的更多信息，请参考 [§30.2.1\
  \ “对象字面量：属性”]。\n\n*   数组字面量：\n\n    ```\n[](#cb143-1)const fruits = ['strawberry',\
  \ 'apple'];\n    ```\n\n    数组字面量以方括号 `[]` 开始和结束。它创建了一个包含两个元素的 `Array`：`'strawberry'`\
  \ 和 `'apple'`。有关数组字面量的更多信息，请参考 [§33.2.1 “创建、读取、写入数组”]。\n\n### 14.4.2.1 对象默认是可变的\n\
  \n默认情况下，你可以自由地更改、添加和删除对象的属性：\n\n```\n[](#cb144-1)const obj = {};\n[](#cb144-2)\n\
  [](#cb144-3)obj.count = 2; // 添加一个属性\n[](#cb144-4)assert.equal(obj.count, 2);\n\
  [](#cb144-5)\n[](#cb144-6)obj.count = 3; // 修改一个属性\n[](#cb144-7)assert.equal(obj.count,\
  \ 3);\n```\n\n### 14.4.2.2 对象按身份传递\n\n对象是`按身份传递的`（我的术语）：变量（包括参数）存储对象的`身份`（identities）。\n\
  \n对象的身份就像指向`堆`（heap）上对象实际数据的指针（或透明引用，想象成 JavaScript 引擎的共享主内存）。\n\n当将对象赋值给变量或将其作为参数传递给函数时，它的身份会被复制。每个对象字面量都会在堆上创建一个新的对象并返回其身份。\n\
  \n```\n[](#cb145-1)const a = {}; // 新的空对象\n[](#cb145-2)// 将 `a` 中的身份传递给 `b`:\n[](#cb145-3)const\
  \ b = a;\n[](#cb145-4)\n[](#cb145-5)// 现在 `a` 和 `b` 指向同一个对象\n[](#cb145-6)// (它们“共享”那个对象):\n\
  [](#cb145-7)assert.equal(a === b, true);\n[](#cb145-8)\n[](#cb145-9)// 修改 `a` 也会改变\
  \ `b`:\n[](#cb145-10)a.name = 'Tessa';\n[](#cb145-11)assert.equal(b.name, 'Tessa');\n\
  ```\n\nJavaScript 使用`垃圾回收`来自动管理内存：\n\n```\n[](#cb146-1)let obj = { prop: 'value'\
  \ };\n[](#cb146-2)obj = {};\n```\n\n现在 `obj` 的旧值 `{ prop: 'value' }` 是`垃圾`（不再使用）。JavaScript\
  \ 会在某个时间自动对其进行`垃圾回收`（将其从内存中移除），如果空闲内存足够，可能永远不会执行。\n\n![](img/file5.svg) **详情：按身份传递**\n\
  \n\n\n\n\n*   `Number.prototype` 为数字提供了属性——例如，方法 `.toString()`：\n\n```\n[](#cb154-1)assert.equal((123).toString,\
  \ Number.prototype.toString);\n```\n\n*   `Number` 是一个用于数字工具函数的命名空间/容器对象——例如：\n\n\
  ```\n[](#cb155-1)assert.equal(Number.isInteger(123), true);\n```\n\n*   最后，你也可以将\
  \ `Number` 作为类来创建数字对象。这些对象与真实的数字不同，应该避免使用。\n\n```\n[](#cb156-1)assert.notEqual(new\
  \ Number(123), 123);\n[](#cb156-2)assert.equal(new Number(123).valueOf(), 123);\n\
  ```\n\n#### 14.6.1.1 包装原始值\n\n与原始类型相关的构造函数也称为`包装类型`（wrapper types），因为它们提供了将原始值转换为对象的规范方法。在此过程中，原始值被“包装”在对象内部中。\n\
  \n```\n[](#cb157-1)const prim = true;\n[](#cb157-2)assert.equal(typeof prim, 'boolean');\n\
  [](#cb157-3)assert.equal(prim instanceof Boolean, false);\n[](#cb157-4)\n[](#cb157-5)const\
  \ wrapped = Object(prim);\n[](#cb157-6)assert.equal(typeof wrapped, 'object');\n\
  [](#cb157-7)assert.equal(wrapped instanceof Boolean, true);\n[](#cb157-8)\n[](#cb157-9)assert.equal(wrapped.valueOf(),\
  \ prim); // 解包\n```\n\n包装在实践中很少使用，但它在语言规范内部被内部使用，用于为原始值提供属性。\n\n## 14.7 类型之间的转换\n\
  \n在 JavaScript 中，值转换为其他类型的方法有两种方式：\n\n*   显式转换：通过如 `String()` 等函数。\n\n*   `强制转换`（Coercion，自动转换）：当操作接收到无法处理的操作数/参数时发生。\n\
  \n### 14.7.1 类型之间的显式转换\n\n与原始类型相关的函数显式地将值转换为该类型：\n\n```\n> Boolean(0)\nfalse\n>\
  \ Number('123')\n123\n> String(123)\n'123'\n```\n\n你也可以使用 `Object()` 将值转换为对象：\n\n\
  ```\n> typeof Object(123)\n'object'\n```\n\n下表详细描述了这种转换是如何工作原理：\n\n| `x` | `Object(x)`\
  \ |\n| --- | --- |\n| `undefined` | `{}` |\n| `null` | `{}` |\n| boolean | `new\
  \ Boolean(x)` |\n| number | `new Number(x)` |\n| bigint | `BigInt` 的实例（`new` 会抛出\
  \ `TypeError`） |\n| string | `new String(x)` |\n| symbol | `Symbol` 的实例（`new` 会抛出\
  \ `TypeError`） |\n| object | `x` |\n\n### 14.7.2 强制转换（类型之间的自动转换）\n\n对于许多操作，如果操作数/参数的类型不匹配，JavaScript\
  \ 会自动转换它们。这种自动转换被称为`强制转换`（coercion）。\n\n例如，乘法运算符会将其操作数强制转换为数字：\n\n```\n> '7' * '3'\n\
  21\n```\n\n许多内置函数也会进行强制转换。例如，`parseInt()` 将其参数强制转换为字符串（解析在遇到第一个非数字字符时停止）：\n\n```\n\
  > parseInt(123.45)\n123\n```\n\n![](img/file6.svg) **练习：将值转换为原始值**\n\n`exercises/values/conversion_exrc.mjs`\n\
  \n![](img/file7.svg) **测验**\n\n查看测验应用。\n\n# 15 运算符\n\n* 15.1 理解运算符\n    * 15.1.1\
  \ 运算符将其操作数强制转换为适当类型\n    * 15.1.2 大多数运算符仅与原始值工作\n* 15.2 加法运算符 (`+`)\n* 15.3 赋值运算符\n\
  \    * 15.3.1 普通赋值运算符\n    * 15.3.2 复合赋值运算符\n* 15.4 相等性：`==` vs. `===`\n    * 15.4.1\
  \ 松散相等 (`==` 和 `!=`)\n    * 15.4.2 严格相等 (`===` 和 `!==`)\n    * 15.4.3 建议：始终使用全相等\n\
  \    * 15.4.4 比 `===` 更严格的：`Object.is()`\n* 15.5 顺序运算符\n* 15.6 其他各种运算符\n    * 15.6.1\
  \ 逗号运算符\n    * 15.6.2 `void` 运算符\n\n## 15.1 理解运算符\n\nJavaScript 的运算符可能看起来很古怪。根据以下规则：\n\
  \n*   运算符将其操作数强制转换为适当类型\n*   大多数运算符仅与值工作\n\n### 15.1.1 运算符将其操作数强制转换为适当类型\n\n首先，让我们来看乘法运算符。它将操作数强制转换为数字：\n\
  \n```\n> '7' * '3'\n21\n```\n\n接下来，它强制转换为字符串：\n\n```\n[](#cb157-1)const prim = true;\n\
  [](#cb157-2)assert.equal(typeof prim, 'boolean');\n[](#cb157-3)assert.equal(prim\
  \ instanceof Boolean, false);\n[](#cb157-4)\n[](#cb157-5)const wrapped = Object(prim);\n\
  [](#cb157-6)assert.equal(typeof wrapped, 'object');\n[](#cb157-7)assert.equal(wrapped\
  \ instanceof Boolean, true);\n[](#cb157-8)\n[](#cb157-9)assert.equal(wrapped.valueOf(),\
  \ prim); // 解包\n```\n\n等等，让我们来看赋值运算符：\n\n```\n[](#cb154-1)assert.equal((123).toString,\
  \ Number.prototype.toString);\n```\n\n接下来，让我们来看命名空间对象：\n\n```\n[](#cb155-1)assert.equal(Number.isInteger(123),\
  \ true);\n```\n\n等等，让我们来看类：\n\n````\n[](#cb156-1)assert.notEqual(new Number(123),\
  \ 123);\n[](#cb156-2)assert.equal(new Number(123).valueOf(), 123);\n```\n\n### 15.1.2 大多数运算符仅与原始值工作\n\
  \n等等，让我们来看赋值运算符：\n\n```\n[](#cb154-1)assert.equal((123).toString, Number.prototype.toString);\n\
  ```\n\n接下来，让我们来看命名空间对象：\n\n```\n[](#cb155-1)assert.equal(Number.isInteger(123),\
  \ true);\n```\n\n等等，让我们来看类：\n\n```\n[](#cb156-1)assert.notEqual(new Number(123),\
  \ 123);\n[](#cb156-2)assert.equal(new Number(123).valueOf(), 123);\n```\n\n## 15.2 加法运算符\
  \ (`+`)\n\n加法运算符的工作原理如下：\n\n*   首先，它将操作数转换为原始值。然后它切换到两种模式之一：\n\n    *   字符串模式：如果其中一个原始值是字符串，则将另一个转换为字符串，拼接两个字符串并返回结果。\n\
  \n    *   数字模式：否则，它将两个操作数转换为数字，将它们相加并返回结果。\n\n字符串模式允许我们使用 `+` 来组装字符串：\n\n```\n>\
  \ 'There are ' + 3 + ' items'\n'There are 3 items'\n```\n\n数字模式意味着如果两个操作数都不是字符串（或变为字符串的对象），则所有内容都将强制转换为数字：\n\
  \n```\n> 4 + true\n5\n```\n\n`Number(true)` 为 `1`。\n\n## 15.3 赋值运算符\n\n### 15.3.1 普通赋值运算符\n\
  \n普通赋值运算符用于更改存储位置：\n\n```\n[](#cb169-1)x = value; // 赋值给已声明变量\n[](#cb169-2)obj.propKey\
  \ = value; // 赋值给属性\n[](#cb169-3)arr[index] = value; // 赋值给数组元素\n```\n\n变量声明中的初始化器也可以视为赋值的形式：\n\
  \n```\n[](#cb170-1)const x = value;\n[](#cb170-2)let y = value;\n```\n\n### 15.3.2 复合赋值运算符\n\
  \nJavaScript 支持以下赋值运算符：\n\n*   算术赋值运算符：`+= -= *= /= %=`\n\n    *   `+=` 也可以用于字符串拼接\n\
  \n    *   后期引入：`**=`\n\n*   位运算赋值运算符：`&= ^= |=`\n\n*   位移赋值运算符：`<<= >>= >>>=`\n\n\
  *   逻辑赋值运算符：`||= &&= ??=`\n\n\n\n\n\n为什么 `a ||= b` 等价于以下表达式？\n\n> `a || (a = b)`\n\
  \n为什么不是这个表达式呢？\n\n> `a = a || b`\n\n前者表达式具有短路特性的好处：只有当 `a` 结果为 `false` 时，才会执行赋值操作。因此，只有在必要时才会执行赋值。相比之下，后者表达式总是执行赋值。\n\
  \n关于 `??=` 的更多信息，请参阅第 16.4.5 节“空值赋值运算符 (`??=`)](#ch017.xhtml_nullish-coalescing-assignment-operator)。\n\
  \n### 15.3.2.2 剩余的复合赋值运算符\n\n对于除 `|| && ??` 以外的运算符 `op`，以下两种赋值方式是等价的：\n\n```\nmyvar\
  \ op= value\nmyvar = myvar op value\n```\n\n例如，如果 `op` 是 `+`，那么我们得到了运算符 `+=`，其工作方式如下：\n\
  \n```\nlet str = '';\nstr += '<b>>';\nstr += 'Hello!';\nstr += '</body>';\nassert.equal(str,\
  \ '<b>Hello!</b>');\n```\n\n## 15.4 等于：`==` vs. `===`\n\nJavaScript 有两种等于运算符：松散相等\
  \ (`==`) 和严格相等 (`===`)。建议始终使用后者。\n\n![](img/file5.svg) **`==` 和 `===` 的其他名称**\n\n\
  * `==` 也称为双等等号（double equals）。它在语言规范中的正式名称是[抽象相等比较](https://tc39.github.io/ecma262/#sec-abstract-equality-comparison)。\n\
  * `===` 也称为三等等号（triple equals）。\n\n### 15.4.1 松散相等 (`==` 和 `!=`）\n\n松散相等是 JavaScript\
  \ 的奇异特性之一。它经常会对操作数进行类型转换。其中一些转换是有意义的：\n\n```\n> '123' == 123\ntrue\n> false == 0\n\
  true\n```\n\n另一些则没那么：\n\n```\n> '' == 0\ntrue\n```\n\n如果（并且仅当！）另一个操作数是原始类型，则对象会被转换为原始类型：\n\
  \n```\n> [1, 2, 3] == '1,2,3'\ntrue\n> ['1', '2', '3'] == '1,2,3'\ntrue\n```\n\n\
  如果两个操作数都是对象，那么只有当它们是同一个对象时它们才相等：\n\n```\n> [1, 2, 3] == ['1', '2', '3']\nfalse\n\
  > [1, 2, 3] == [1, 2, 3]\nfalse\n\n> const arr = [1, 2, 3];\n> arr == arr\ntrue\n\
  ```\n\n最后，`==` 将 `undefined` 和 `null` 视为相等的：\n\n```\n> undefined == null\ntrue\n\
  ```\n\n### 15.4.2 严格相等 (`===` 和 `!==`）\n\n严格相等绝不会进行类型转换。两个值只有在具有相同类型时才相等。让我们重新回顾一下之前与\
  \ `==` 运算符的交互，看看 `===` 运算符做了什么：\n\n```\n> false === 0\nfalse\n> '123' === 123\n\
  false\n```\n\n对象只有在另一个值是同一个对象时才与该值相等：\n\n```\n> [1, 2, 3] === '1,2,3'\nfalse\n>\
  \ ['1', '2', '3'] === '1,2,3'\nfalse\n\n> [1, 2, 3] === ['1', '2', '3']\nfalse\n\
  > [1, 2, 3] === [1, 2, 3]\nfalse\n\n> const arr = [1, 2, 3];\n> arr === arr\ntrue\n\
  ```\n\n`===` 运算符不认为 `undefined` 和 `null` 是相等的：\n\n```\n> undefined === null\nfalse\n\
  ```\n\n### 15.4.3 建议：始终使用严格相等\n\n我建议始终使用 `===`。它让你的代码更易理解，并让你免于去思考 `==` 的奇异特性。\n\
  \n让我们看看 `==` 的两个用例以及我建议的的做法。\n\n#### 15.4.3.1 `==` 的用例：与数字或字符串比较\n\n`==` 让你通过单次比较检查值\
  \ `x` 是否为数字，或者是该数字的字符串形式：\n\n```\nif (x == 123) {\n  // x 是 123 或者 '123'\n}\n```\n\
  \n我更倾向于以下两种替代方案之一：\n\n```\nif (x === 123 || x === '123') ···\nif (Number(x) ===\
  \ 123) ···\n```\n\n你也可以在遇到 `x` 时将其转换为数字。\n\n#### 15.4.3.2 `==` 的用例：与 `undefined`\
  \ 或 `null` 比较\n\n`==` 的另一个用例是检查值 `x` 是否为 `undefined` 或 `null`：\n\n```\nif (x ==\
  \ null) {\n  // x 是 null 或 undefined\n}\n```\n\n这段代码的问题在于，你无法确定某人是故意这样写，还是他们写错了（本本想写\
  \ `===`）。\n\n我更倾向于以下两种：\n\n```\nif (x === undefined || x === null) ···\nif (!x)\
  \ ···\n```\n\n第二种替代方案的缺点是它接受 `undefined` 和 `null` 以外的值，但这是 JavaScript 中一种非常成熟的模式（将在基于真值的检查中解释）。\n\
  \n以下三个条件大致等价：\n\n```\nif (x != null) ···\nif (x !== undefined && x !== null) ···\n\
  if (x) ···\n```\n\n### 15.4.4 比 `===` 更严格的：`Object.is()`\n\n`Object.is()` 方法比较两个值：\n\
  \n```\n> Object.is(123, 123)\ntrue\n> Object.is(123, '23')\nfalse\n```\n\n它比 `===`\
  \ 更加严格。例如，它认为 `NaN`（数字的错误值\ntrue\n> NaN === NaN\nfalse\n```\n\n这有时有用。例如，你可以用它来实现数组方法\
  \ `indexOf()` 的改进版本：\n\n```javascript\nconst myIndexOf = (arr, elem) => {\n  return\
  \ arr.findIndex(x => Object.is(x, elem));\n};\n```\n\n`myIndexOf()` 可以在数组中找到 `NaN`，而\
  \ `indexOf()` 则不能：\n\n```\n> myIndexOf([0,NaN,2], NaN)\n1\n> [0,NaN,2].indexOf(NaN)\n\
  -1\n```\n\n结果 `-1` 意味着 `indexOf()` 未在数组中找到它的参数。\n\n## 15.5 比较运算符\n\n表 3：JavaScript\
  \ 的比较运算符。\n\n| 运算符 | 名称 |\n| --- | --- |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` |\
  \ 大于 |\n| `>=` | 大于等于 |\n\nJavaScript 的比较运算符（表 3）同时适用于数字和字符串：\n\n```\n> 5 >= 2\n\
  true\n> 'bar' < 'foo'\ntrue\n```\n\n`<=` 和 `>=` 基于严格相等。\n\n![](img/file4.svg) **比较运算符在人类语言中效果并不佳**\n\
  \n比较运算符在比较人类语言的文本时效果不好，例如当涉及大小写或重音时。细节将在比较字符串中解释。\n\n## 15.6 其他各种运算符\n\n以下运算符在本书的其他部分已有所介绍：\n\
  \n* 针对布尔值、数字、字符串、对象的运算符\n* 用于默认值的空值合并运算符 (`??`)](#ch017.xhtml_nullish-coalescing-operator)\n\
  \n接下来的两个小节将讨论两个很少使用的运算符。\n\n### 15.6.1 逗号运算符\n\n逗号运算符有两个操作数，它求值这两个值并返回第二个：\n\n```\n\
  > 'a', 'b'\n'b'\n```\n\n关于该运算符的更多信息，请参阅 [Speaking JavaScript](http://speakingjs.com/es5/ch09.html#comma_operator)。\n\
  \n### 15.6.2 `void` 运算符\n\n`void` 运算符求值其操作数并返回 `undefined`：\n\n```\n> void (3 +\
  \ 2)\nundefined\n```\n\n关于该运算符的更多信息，请参阅 [Speaking JavaScript](http://speakingjs.com/es5/ch09.html#void_operator)。\n\
  \n![](img/file7.svg) **测验**\n\n查看测验应用。\n\n# 16 非值 `undefined` 和 `null`\n\n* 16.1\
  \ `undefined` vs. `null`\n* 16.2 `undefined` 和 `null` 的出现\n    * 16.2.1 `undefined`\
  \ 的出现\n    * 16.2.2 `null` 的出现\n* 16.3 检查 `undefined` 或 `null`\n* 16.4 [用于默认值的空值合并运算符\
  \ (`??`) [ES2020]](#ch017.xhtml_nullish-coalescing-operator)\n    * 16.4.1 示例：计数匹配\n\
  \    * 16.4.2 示例：为属性指定默认值\n\n\n\n\n\n### 16.4.3 使用解构赋值设置默认值\n### 16.4.4 旧版方法：使用逻辑或\
  \ (`||`) 设置默认值\n### 16.4.5 空值合并赋值运算符 (`??=`)\n## 16.5 `undefined` 和 `null` 没有属性\n\
  ## 16.6 `undefined` 和 `null` 的历史\n\n许多编程语言都只有一种名为 `null` 的“非值”。它表示变量当前没有指向任何对象——例如，当它尚未被初始化时。\n\
  \n与此相反，JavaScript 有两个这样的值：`undefined` 和 `null`。\n\n## 16.1 `undefined` vs. `null`\n\
  \n这两个值非常相似，且通常可以互换使用。因此，它们的区别非常细微。语言本身做出了以下区分：\n\n- `undefined` 意味着“未初始化”（例如，变量）或“不存在”（例如，对象的属性）。\n\
  - `null` 意味着“有意地空缺任何对象值”（引自[语言规范](https://tc39.github.io/ecma262/#sec-null-value)）。\n\
  \n程序员可能会做出如下区分：\n\n- `undefined` 是语言中使用的非值（当某些内容未初始化等时）。\n- `null` 意味着“显式关闭”。也就是说，它有助于实现一种既包含有意义的值又包含代表“无意义值”的元值的类型。这种类型在函数式编程中被称为*option\
  \ type*或可选类型或[maybe type](https://en.wikipedia.org/wiki/Option_type)。\n\n## 16.2\
  \ `undefined` 和 `null` 的出现\n\n以下子节描述了 `undefined` 和 `null` 在语言中出现的地方。我们将遇到几种机制，这些机制将在本书后面的部分进行详细解释。\n\
  \n### 16.2.1 `undefined` 的出现\n\n未初始化的变量 `myVar`：\n\n```javascript\nlet myVar;\n\
  assert.equal(myVar, undefined);\n```\n\n未提供参数 `x`：\n\n```javascript\nfunction func(x)\
  \ {\n  return x;\n}\nassert.equal(func(), undefined);\n```\n\n属性 `.unknownProp`\
  \ 缺失：\n\n```javascript\nconst obj = {};\nassert.equal(obj.unknownProp, undefined);\n\
  ```\n\n如果我们没有通过 `return` 语句显式地指定函数的返回值，JavaScript 会为我们返回 `undefined`：\n\n```javascript\n\
  function func() {}\nassert.equal(func(), undefined);\n```\n\n### 16.2.2 `null` 的出现\n\
  \n对象的原型要么是一个对象，要么在原型链的末端是 `null`。`Object.prototype` 没有原型：\n\n```javascript\n> Object.getPrototypeOf(Object.prototype)\n\
  null\n```\n\n如果我们对字符串（如 `'x'`）匹配正则表达式（如 `/a/`），我们要么会得到一个包含包含匹配数据的对象（如果匹配成功），要么会得到\
  \ `null`（如果匹配失败）：\n\n```javascript\n> /a/.exec('x')\nnull\n```\n\n[JSON 数据格式] 不支持\
  \ `undefined`，只支持 `null`：\n\n```javascript\n> JSON.stringify({a: undefined, b: null})\n\
  '{\"b\":null}'\n```\n\n## 16.3 检查 `undefined` 或 `null`\n\n检查其中之一：\n\n```javascript\n\
  if (x === null) ...\nif (x === undefined) ...\n```\n\n`x` 是否有值？\n\n```javascript\n\
  if (x !== undefined && x !== null) {\n  // ...\n}\nif (x) { // 是真值吗？\n  // x 不是\
  \ undefined, null, false, 0, NaN, ''\n}\n```\n\n`x` 是否是 `undefined` 或 `null`？\n\n\
  ```javascript\nif (x === undefined || x === null) {\n  // ...\n}\nif (!x) { // 是假值吗？\n\
  \  // x 是 undefined, null, false, 0, NaN, ''\n}\n```\n\n*Truthy*（真值）意味着“强制转换为布尔值时为\
  \ true”。*Falsy*（假值）意味着“强制转换为布尔值时为 false”。这两个概念在 17.2 节“假值和真值”中有详细的解释。\n\n## 16.4\
  \ 用于默认值的空值合并运算符 (`??`) \n\n有时我们接收到一个值，但只想在当它为 `null` 或 `undefined` 时才使用它。否则，我们想使用默认值作为回退。我们可以通过*空值合并运算符*\
  \ (`??`) 来实现：\n\n```javascript\nconst valueUse = receivedValue ?? defaultValue;\n\
  ```\n\n以下两个表达式是等价的：\n\n```javascript\na ?? b\na !== undefined && a !== null ? a\
  \ : b\n```\n\n### 16.4.1 示例：计算匹配项\n\n以下代码展示了一个真实世界的示例：\n\n```javascript\nfunction\
  \ countMatches(regex, str) {\n  const matchResult = str.match(regex); // null 或\
  \ Array\n  return (matchResult ?? []).length;\n}\nassert.equal(countMatches(/a/g,\
  \ 'ababa'), 3);\nassert.equal(countMatches(/b/g, 'ababa'), 2);\nassert.equal(countMatches(/x/g,\
  \ 'ababa'), 0);\n```\n\n如果 `regex` 在 `str` 中有一个或多个匹配项，`.match()` 返回一个数组。如果没有匹配项，遗憾的是它会返回\
  \ `null`（而不是空数组）。我们通过 `??` 运算符修复了这个问题。\n\n我们也可以使用可选链：\n\n```javascript\nreturn matchResult?.length\
  \ ?? 0;\n```\n\n### 16.4.2 示例：为属性指定默认值\n\n```javascript\nfunction getTitle(fileDesc)\
  \ {\n  return fileDesc.title ?? '(Untitled)';\n}\nconst files = [\n  {path: 'index.html',\
  \ title: 'Home'},\n  {path: 'tmp.html'},\n];\nassert.deepEqual(files.map(f => getTitle(f)),\
  \ ['Home', '(Untitled)']);\n```\n\n### 16.4.3 使用解构赋值设置默认值\n\n在某些情况下，解构赋值也可以用于设置默认值——例如：\n\
  \n```javascript\nfunction getTitle(fileDesc) {\n  const {title = '(Untitled)'} =\
  \ fileDesc;\n  return title;\n}\n```\n\n### 16.4.4 旧版方法：使用逻辑或 (`||`) 设置默认值\n\n在\
  \ ECMAScript 2020 和空值合并运算符出现之前，逻辑或被用于设置默认值。这有一个缺点。\n\n`||` 对于 `undefined` 和 `null`\
  \ 的表现符合预期：\n\n```javascript\n> undefined || 'default'\n'default'\n> null || 'default'\n\
  'default'\n```\n\n但它也会对所有所有假值返回默认值——例如：\n\n```javascript\n> false || 'default'\n\
  'default'\n> 0 || 'default'\n'default'\n> 0n || 'default'\n'default'\n> '' || 'default'\n\
  'default'\n```\n\n对比 `??` 的工作方式：\n\n```javascript\n> undefined ?? 'default'\n'default'\n\
  > null ?? 'default'\n'default'\n\n> false ?? 'default'\nfalse\n> 0 ?? 'default'\n\
  0\n> 0n ?? 'default'\n0n\n> '' ?? 'default'\n''\n```\n\n### 16.4.5 空值合并赋值运算符 (`??=`)\n\
  \n`??=` 是一个逻辑赋值运算符。以下两个表达式大致等价：\n\n```javascript\na ??= b\na ?? (a = b)\n```\n\n\
  这意味着 `??=` 是短路的：只有当 `a` 为 `undefined` 或 `null` 时才会进行赋值。\n\n#### 16.4.5.1 示例：使用 `??=`\
  \ 添加缺失的属性\n\n\n\n\n\n```javascript\nconst books = [\n  {\n    isbn: '123',\n  },\n\
  \  {\n    title: 'ECMAScript Language Specification',\n    isbn: '456',\n  },\n\
  ];\n\n// Add property .title where it’s missing\nfor (const book of books) {\n \
  \ book.title ??= '(Untitled)';\n}\n\nassert.deepEqual(\n  books,\n  [\n    {\n \
  \     isbn: '123',\n      title: '(Untitled)',\n    },\n    {\n      title: 'ECMAScript\
  \ Language Specification',\n      isbn: '456',\n    },\n  ]);\n```\n\n## 16.5 `undefined`\
  \ 和 `null` 没有属性\n\n`undefined` 和 `null` 是 JavaScript 中仅两个在尝试读取其属性时会抛出异常的值。为了探索这一现象，让我们使用以下函数，它读取（“获取”）属性\
  \ `.foo` 并返回结果。\n\n```javascript\nfunction getFoo(x) {\n  return x.foo;\n}\n```\n\
  \n如果我们对 `getFoo()` 应用于各种值，可以发现它只对 `undefined` 和 `null` 失败：\n\n```javascript\n> getFoo(undefined)\n\
  TypeError: Cannot read property 'foo' of undefined\n> getFoo(null)\nTypeError: Cannot\
  \ read property 'foo' of null\n\n> getFoo(true)\nundefined\n> getFoo({})\nundefined\n\
  ```\n\n## 16.6 `undefined` 和 `null` 的历史\n\n在 Java 中（它启发了 JavaScript 的许多方面），初始化值取决于变量的静态类型：\n\
  \n- 对象类型的变量被初始化为 `null`。\n- 每个原始类型都有自己的初始化值。例如，`int` 变量被初始化为 `0`。\n\n在 JavaScript\
  \ 中，每个变量都可以同时持有对象值和原始类型值。因此，如果 `null` 意味着“不是对象”，那么 JavaScript 也需要一个“既不是对象也不是原始类型值”的初始化值。这个初始化值就是\
  \ `undefined`。\n\n**测试**\n\n参见测验应用。\n\n# 17 布尔值\n\n* 17.1 转换为布尔值\n* 17.2 假值和真值值\n\
  \    * 17.2.1 检查真值性或假值性\n* 17.3 基于真值的存在性检查\n    * 17.3.1 陷阱：基于真值的存在性检查是不精确的\n  \
  \  * 17.3.2 用例：是否提供了参数？\n    * 17.3.3 用例：属性是否存在？\n* 17.4 条件运算符 (`? :`)\n* 17.5 二元逻辑运算符：与\
  \ (`x && y`)，或 (`x || y`)\n    * 17.5.1 值保留\n    * 17.5.2 短路机制\n    * 17.5.3 逻辑与\
  \ (`x && y`)\n    * 17.5.4 逻辑或 (`||`)\n* 17.6 逻辑非 (`!`)\n\n原始类型 `boolean` 包含两个值——`false`\
  \ 和 `true`：\n\n```javascript\n> typeof false\n'boolean'\n> typeof true\n'boolean'\n\
  ```\n\n## 17.1 转换为布尔值\n\n**“转换为 [类型]”的含义**\n\n“转换为 [类型]”是将任意值转换为类型为 [类型] 的值的简写。\n\
  \n将任意值 `x` 转换为布尔值的三种方法：\n\n- `Boolean(x)`\n  最具描述性；推荐。\n- `x ? true : false`\n \
  \ 使用条件运算符（在本章后续](#ch018.xhtml_conditional-operator) 解释）。\n- `!!x`\n  使用逻辑非运算符 (`!`)。该运算符将其操作数强制转换为布尔值。应用第二次以获得非取反的结果。\n\
  \n表 4 描述了如何将各种值转换为布尔值。\n\n表 4：将值转换为布尔值。\n\n| `x` | `Boolean(x)` |\n| --- | --- |\n\
  | `undefined` | `false` |\n| `null` | `false` |\n| boolean | `x` (无变化) |\n| number\
  \ | `0` → `false`, `NaN` → `false` |\n|  | 其他数字 → `true` |\n| bigint | `0` → `false`\
  \ |\n|  | 其他数字 → `true` |\n| string | `''` → `false` |\n|  | 其他字符串 → `true` |\n\
  | symbol | `true` |\n| object | 始终 `true` |\n\n## 17.2 假值和真值值\n\n在检查 `if` 语句、`while`\
  \ 循环或 `do-while` 循环的条件时，JavaScript 的工作与你预期的不同。例如，以下条件：\n\n```javascript\nif (value)\
  \ {}\n```\n\n在许多语言中，这等同于：\n\n```javascript\nif (value !== undefined) {}\n```\n\n\
  但在 JavaScript 中，它等同于：\n\n```javascript\nif (value) {}\n```\n\n如果 `value` 为假（falsy），`if`\
  \ 语句体将被跳过。这种检查非常常见，以至于被称为：\n\n- 如果一个值在转换为布尔值时为 `true`，则称为*真值 (truthy)*。\n- 如果一个值在转换为布尔值时为\
  \ `false`，则称为*假值 (falsy)*。\n\n查阅表 4，我们可以列出假值的列表：\n\n- `undefined`\n- `null`\n- `0`\n\
  - `NaN`\n- `0n` (bigint)\n- `''` (string)\n\n其他值（包括对象）都是真值：\n\n```javascript\n>\
  \ Boolean('abc')\ntrue\n> Boolean([])\ntrue\n> Boolean({})\n```\n\n### 17.2.1 检查真值性或假值性\n\
  \n```javascript\nif (x) {\n} else {\n  // ···\n}\nconst result = x ? 'truthy' :\
  \ 'falsy';\n```\n\n最后一行使用的条件运算符将在后续 解释。\n\n**练习：真值**\n\n`exercises/booleans/truthiness_ex.js`\n\
  \n## 17.3 基于真值的存在性检查\n\n在 JavaScript 中，如果你读取不存在（例如缺失的参数或属性），通常会得到 `undefined`。在这种情况下，存在性检查等同于与\
  \ `undefined` 进行比较。例如，以下代码检查 `obj` 是否拥有 `.prop`：\n\n```javascript\nif (obj.prop\
  \ !== undefined) {\n  // obj 有 .prop\n}\n```\n\n由于 `undefined` 是假值，我们可以将其简化为：\n\n\
  ```javascript\nif (obj.prop) {\n  // obj 有 .prop\n}\n```\n\n### 17.3.1 陷阱：基于真值的存在性检查是不精确的\n\
  \n基于真值的存在性检查有一个陷阱：它们并不精确。考虑之前的示例：\n\n```javascript\nif (obj.prop) {\n  // obj 有\
  \ .prop\n}\n```\n\n如果 `obj.prop` 缺失（在这种情况下，JavaScript 返回 `undefined`），`if` 语句体将被跳过。\n\
  \n然而，如果满足以下情况也会被跳过：\n\n- `obj.prop` 为 `undefined`。\n- `obj.prop` 为任何其他假值（`null`、`0`\
  \ 等）。\n\n在实践中这很少引起问题，但你必须意识到这个陷阱。\n\n### 17.3.2 用例：是否提供了参数？\n\n真值检查通常用于判断函数的调用者是否提供了参数：\n\
  \n```javascript\nfunction func(x) {\n  if (!x) {\n    throw new Error('缺少参数 x');\n\
  \  }\n  // ···\n}\n```\n\n\n\n\n优点是，这种模式已经成熟且简洁。它能正确地为 `undefined` 和 `null` 抛出错误。\n\
  \n缺点是，存在前面提到的陷阱：代码也会对所有其他假值（falsy values）抛出错误。\n\n另一种方法是检查 `undefined`：\n\n```javascript\n\
  if (x === undefined) {\n  throw new Error('Missing parameter x');\n}\n```\n\n###\
  \ 17.3.3 用例：属性是否存在？\n\n真值检查也经常用于判断属性是否存在：\n\n```javascript\nfunction readFile(fileDesc)\
  \ {\n  if (!fileDesc.path) {\n    throw new Error('Missing property: .path');\n\
  \  }\n  // ···\n}\nreadFile({ path: 'foo.txt' }); // 无错误\n```\n\n这种模式同样成熟的，并且具有通常的警告：它不仅在属性缺失时抛出错误，当属性存在但具有任何假值时也会抛出错误。\n\
  \n如果你真的想检查属性是否存在，你必须使用 `in` 运算符：\n\n```javascript\nif (! ('path' in fileDesc)) {\n\
  \  throw new Error('Missing property: .path');\n}\n```\n\n### 17.4 条件运算符 (`? :`)\n\
  \n条件运算符是 `if` 语句的表达式版本。它的语法是：\n\n```\n«condition» ? «thenExpression» : «elseExpression»\n\
  ```\n\n它的求值如下：\n\n- 如果 `condition` 为真值（truthy），求值并返回 `thenExpression`。\n- 否则，求值并返回\
  \ `elseExpression`。\n\n条件运算符也被三元运算符，因为它有三个操作数。\n\n示例：\n\n```javascript\n> true ?\
  \ 'yes' : 'no'\n'yes'\n> false ? 'yes' : 'no'\n'no'\n> '' ? 'yes' : 'no'\n'no'\n\
  ```\n\n以下代码演示了无论通过条件选择了“then”还是“else”分支，只有被选中的那个分支会被求值。另一个分支不会执行。\n\n```javascript\n\
  const x = (true ? console.log('then') : console.log('else'));\n// 输出:\n// 'then'\n\
  ```\n\n### 17.5 二元逻辑运算符：与 (`x && y`)，或 (`x || y`)\n\n二元逻辑运算符 `&&` 和 `||` 具有值保留（value-preserving）和短路（short-circuiting）的特性。\n\
  \n#### 17.5.1 值保留\n\n值保留意味着操作数被解释为布尔值，但返回时保持不变：\n\n```javascript\n> 12 || 'hello'\n\
  12\n> 0 || 'hello'\n'hello'\n```\n\n#### 17.5.2 短路\n\n短路意味着如果第一个操作数已经决定了结果，那么第二个操作数就不会被求值。另一个延迟求值操作数的运算符是条件运算符。通常，所有操作数都会执行操作之前求值。\n\
  \n例如，逻辑与 (`&&`) 如果第一个操作数为假值，则不会求值第二个操作数：\n\n```javascript\nconst x = false && console.log('hello');\n\
  // 无输出\n```\n\n如果第一个操作数为真值，则执行 `console.log()`：\n\n```javascript\nconst x = true\
  \ && console.log('hello');\n// 输出:\n// 'hello'\n```\n\n#### 17.5.3 逻辑与 (`x && y`)\n\
  \n表达式 `a && b` (“`a` 与 `b`”)的求值如下：\n\n1. 求值 `a`。\n2. 结果是假值吗？返回它。\n3. 否则，求值 `b` 并返回结果。\n\
  \n换句话说，以下两个表达式等价：\n\n```javascript\na && b\n!a ? a : b\n```\n\n示例：\n\n```javascript\n\
  > false && true\nfalse\n> false && 'abc'\nfalse\n\n> true && false\nfalse\n> true\
  \ && 'abc'\n'abc'\n\n> '' && 'abc'\n''\n```\n\n#### 17.5.4 逻辑或 (`||`)\n\n表达式 `a\
  \ || b` (“`a` 或 `b`”)的求值如下：\n\n1. 求值 `a`。\n2. 结果是真值吗？返回它。\n3. 否则，求值 `b` 并返回结果。\n\
  \n换句话说，以下两个表达式等价：\n\n```javascript\na || b\na ? a : b\n```\n\n示例：\n\n```javascript\n\
  > true || false\ntrue\n> true || 'abc'\ntrue\n> false || true\ntrue\n> false ||\
  \ 'abc'\n'abc'\n> 'abc' || 'def'\n'abc'\n```\n\n##### 17.5.4.1 逻辑或 (`||`) 的旧用例\n\
  \nECMAScript 2020 引入了空值合并运算符 (`??`) 来处理默认值。在此之前，逻辑或被用于此处：\n\n```javascript\nconst\
  \ valueToUse = receivedValue || defaultValue;\n```\n\n更多关于 `??` 的信息请参阅空值合并运算符 (`??`)\
  \ 以及在这种情况下 `||` 的缺点。\n\n### 17.6 逻辑非 (`!`)\n\n表达式 `!x` (“非 `x`”)的求值如下：\n\n1. 求值\
  \ `x`。\n2. 它是真值吗？返回 `false`。\n3. 否则，返回 `true`。\n\n示例：\n\n```javascript\n> !false\n\
  true\n> !true\nfalse\n> !0\ntrue\n> !123\nfalse\n> !''\ntrue\n> !'abc'\nfalse\n\
  ```\n\n# 18 数字\n\n- 18.1 用于浮点数和整数的数字\n- 18.2 数字字面量\n    - 18.2.1 整数字面量\n    - 18.2.2\
  \ 浮点数字面量\n    - 18.2.3 整数字面量的陷阱\n    - 18.2.4 数字字面量中的下划线 (`_`) \n- 18.3 算术运算符\n\
  \    - 18.3.1 二元算术运算符\n    - 18.3.2 一元加 (`+`) 和负 (`-`)\n    - 18.3.3 自增 (`++`) 和自减\
  \ (`--`)\n- 18.4 转换为数字\n- 18.5 错误值\n    - 18.5.1 错误值：`NaN`\n    - 18.5.2 错误值：`Infinity`\n\
  - 18.6 数字精度：小心小数\n- 18.7 (高级)\n- 18.8 背景：浮点精度\n    - 18.8.1 浮点数的简化表示\n- 18.9 JavaScript\
  \ 中的整数\n    - 18.9.1 转换为整数\n    - 18.9.2 JavaScript 中的整数范围\n    - 18.9.3 安全整数\n\
  - 18.10 位运算运算符\n    - 18.10.1 内部，位运算运算符对 32 位整数进行操作\n    - 18.10.2 位取反\n    - 18.10.3\
  \ 二元位运算运算符\n    - 18.10.4 位移运算符\n    - 18.10.5 `b32()`：以二进制表示显示无符号 32 位整数\n- 18.11\
  \ 快速参考：数字\n    - 18.11.1 数字的全局函数\n    - 18.11.2 `Number` 的静态属性\n    - 18.11.3 `Number`\
  \ 的静态方法\n    - 18.11.4 `Number.prototype` 的方法\n    - 18.11.5 来源\n\n* * *\n\nJavaScript\
  \ 有两种数值：\n\n\n\n\n\n- `Numbers` 是 64 位浮点数，也用于较小的整数（范围在正/负 53 位之间）。\n- `Bigints`\
  \ 表示任意精度的整数。\n\n本章介绍数字。`Bigints` 将在本书的后部分 进行介绍。\n\n## 18.1 同时用于浮点数和整数的数字\n\nJavaScript\
  \ 中用 `number` 类型同时用于整数和浮点数：\n\n```\n98\n123.45\n```\n\n然而，所有的数字都是 `doubles`（双精度），即根据\
  \ `浮点运算 IEEE 标准` (IEEE 754) 实现的 64 位浮点数。\n\n整数仅仅是不不带小数部分的浮点数：\n\n```javascript\n\
  > 98 === 98.0\ntrue\n```\n\n请注意，在底层，大多数 JavaScript 引擎通常能够使用真实的整数，从而获得所有相关的性能和存储大小优势。\n\
  \n## 18.2 数字字面量\n\n让我们来看一下数字的字面量。\n\n### 18.2.1 整数字面量\n\n几种 `整数字面量` 让我们以不同的基数表示整数：\n\
  \n```\n// 二进制（底 2）\nassert.equal(0b11, 3); // ES6\n// 八进制（底 8）\nassert.equal(0o10,\
  \ 8); // ES6\n// 十进制（底 10）\nassert.equal(35, 35);\n// 十进制（底 16）\nassert.equal(0xE7,\
  \ 231);\n```\n\n### 18.2.2 浮点数字面量\n\n浮点数只能以 10 进制表示。\n\n分数：\n\n```javascript\n>\
  \ 35.0\n35\n```\n\n指数：`eN` 表示 ×10^N\n\n```javascript\n> 3e2\n300\n> 3e-2\n0.03\n\
  > 0.3e2\n30\n```\n\n### 18.2.3 语法陷阱：整数字面量的属性\n\n访问整数字面量的属性包含一个陷阱：如果整数字面量后面紧跟着一个点，那么这个点将被解释为小数点：\n\
  \n```javascript\n7.toString(); // 语法错误\n```\n\n有四种方法可以绕过这个陷阱：\n\n```javascript\n\
  7.0.toString()\n(7).toString()\n7..toString()\n7 .toString()  // 点前有空格\n```\n\n\
  ### 18.2.4 下划线（`_`）作为数字字面量的分隔符 [ES2021]\n\n将数字分组以使长数字更具可读性是一项长期传统。例如：\n\n- 1825\
  \ 年，伦敦有 1,335,000 人口。\n- 地球到太阳的距离为 149,600,000 公里。\n\n从 ES2021 开始，我们可以在数字字面量中使用下划线作为分隔符：\n\
  \n```javascript\nconst inhabitantsOfLondon = 1_335_000;\nconst distanceEarthSunInKm\
  \ = 149_600_000;\n```\n\n在其他基数中，分组也很重要：\n\n```javascript\nconst fileSystemPermission\
  \ = 0b111_111_000;\nconst bytes = 0b1111_1011011011_11110000_00001101;\nconst words\
  \ = 0xFAB_F00D;\n```\n\n我们也可以在分数和指数中使用分隔符：\n\n```javascript\nconst massOfElectronInKg\
  \ = 9.109_383_56e-31;\nconst trillionInShortScale = 1e1_2;\n```\n\n#### 18.2.4.1\
  \ 我们可以在哪里放置分隔符？\n\n分隔符的位置有以下限制：\n\n- 分隔符不能放在小数点之后。\n- 分隔符不能放在数字的开头或结尾。\n- 分隔符不能连续出现。\n\
  \n（注：由于原文在分隔符位置的描述中存在无意义的乱码和重复文本，此处根据技术逻辑进行了清理和意翻译）\n\n\n\n\n\n| 类型 | 结果 |\n| :---\
  \ | :--- |\n| `boolean` | `false` `→` `+0`, `true` `→` `1` |\n| `number` | `x` (无变化)\
  \ |\n| `bigint` | 抛 `TypeError` |\n| `string` | `''` `→` `+0` |\n| | 其他 `→` 解析为数字，忽略前后的空白\
  \ |\n| `symbol` | 抛 `TypeError` |\n| `object` | 可配置（例如，通过 `.valueOf()`） |\n\n###\
  \ 示例：\n\n```javascript\nassert.equal(Number(123.45), 123.45);\nassert.equal(Number(''),\
  \ 0);\nassert.equal(Number('\\n 123.45 \\t'), 123.45);\nassert.equal(Number('xyz'),\
  \ NaN);\n```\n\n对象如何转换为数字是可以配置的——例如，通过重写 `.valueOf()`：\n\n```javascript\n> Number({\
  \ valueOf() { return 123 } })\n123\n```\n\n![](img/file6.svg) **练习：转换为数字**\n\n`exercises/numbers-math/parse_number_test.mjs`\n\
  \n## 18.5 错误值\n\n当发生错误时会返回两个数字值：\n\n* `NaN`\n* `Infinity`\n\n### 18.5.1 错误值：`NaN`\n\
  \n`NaN` 是“not a number”（不是数字）的缩写。讽刺的是，JavaScript 认为它是一个数字：\n\n```javascript\n> typeof\
  \ NaN\n'number'\n```\n\n#### 什么时候返回 `NaN`？\n\n如果数字无法被解析，则返回 `NaN`：\n\n```javascript\n\
  > Number('$$$')\nNaN\n> Number(undefined)\nNaN\n```\n\n如果无法执行操作，则返回 `NaN`：\n\n```javascript\n\
  > Math.log(-1)\nNaN\n> Math.sqrt(-1)\nNaN\n```\n\n如果操作的操作数或参数为 `NaN`（为了传播错误），则返回\
  \ `NaN`：\n\n```javascript\n> NaN - 3\nNaN\n> 7 ** NaN\nNaN\n```\n\n#### 18.5.1.1\
  \ 检查 `NaN`\n\n`NaN` 是 JavaScript 中唯一不严格等于自身的值：\n\n```javascript\nconst n = NaN;\n\
  assert.equal(n === n, false);\n```\n\n这里是检查一个值 `x` 是否为 `NaN` 的几种方法：\n\n```javascript\n\
  const x = NaN;\nassert.equal(Number.isNaN(x), true); // 优先\nassert.equal(Object.is(x,\
  \ NaN), true);\nassert.equal(x !== x, true);\n```\n\n在最后一行中，我们使用比较的特性来检测 `NaN`。\n\
  \n#### 18.5.1.2 在数组中查找 `NaN`\n\n某些 `Array` 方法无法找到 `NaN`：\n\n```javascript\n> [NaN].indexOf(NaN)\n\
  -1\n```\n\n其他方法可以：\n\n```javascript\n> [NaN].includes(NaN)\ntrue\n> [NaN].findIndex(x\
  \ => Number.isNaN(x))\n0\n> [NaN].find(x => Number.isNaN(x))\nNaN\n```\n\n遗憾的是，没有简单的经验法则。我们必须检查每个方法是如何处理\
  \ `NaN` 的。\n\n### 18.5.2 错误值：`Infinity`\n\n什么时候返回错误值 `Infinity`？\n\n如果数字太大，则返回 `Infinity`：\n\
  \n```javascript\n> Math.pow(2, 1023)\n8.98846567431158e+307\n> Math.pow(2, 1024)\n\
  Infinity\n```\n\n如果存在除以零，则返回 `Infinity`：\n\n```javascript\n> 5 / 0\nInfinity\n>\
  \ -5 / 0\n-Infinity\n```\n\n#### 18.5.2.1 `Infinity` 作为默认值\n\n`Infinity` 大于所有其他数字（`NaN`\
  \ 之外），使其成为良好的默认值：\n\n```javascript\nfunction findMinimum(numbers) {\n  let min =\
  \ Infinity;\n  for (const n of numbers) {\n    if (n < min) min = n;\n  }\n  return\
  \ min;\n}\nassert.equal(findMinimum([5, -1, 2]), -1);\nassert.equal(findMinimum([]),\
  \ Infinity);\n```\n\n#### 18.5.2.2 检查 `Infinity`\n\n这里是检查一个值 `x` 是否为 `Infinity`\
  \ 的两种常用方法：\n\n```javascript\nconst x = Infinity;\nassert.equal(x === Infinity, true);\n\
  assert.equal(Number.isFinite(x), false);\n```\n\n![](img/file6.svg) **练习：比较数字**\n\
  \n`exercises/numbers-math/find_max_test.mjs`\n\n## 18.6 数字的精度：小心处理小数\n\n在内部，JavaScript\
  \ 浮点数用基 2 表示（根据 IEEE 754）。这意味着小数（基 10）并不总是能被表示：\n\n```javascript\n> 0.1 + 0.2\n\
  0.30000000000000004\n> 0.1 * 3\n0.30000000000000004\n```\n\n因此，在执行算术运算时需要考虑舍入误差。\n\
  \n![](img/file7.svg) **测试：基础**\n\n## 18.7 进：舍入误差\n\n在执行算术运算时需要考虑舍入误差。\n\n![](img/file7.svg)\
