  \ JavaScript 特性？\n\n本书通常会提到某项特性是属于 ECMAScript 5（旧浏览器要求）还是较新版本。有关更详细的信息（包括 ES5 之前的版本），网上有几个很好的兼容性表：\n\
  \n* [各种引擎的 ECMAScript 兼容性表](http://kangax.github.io/compat-table/es5/)（由 [kangax](https://twitter.com/kangax),\
  \ [webbedspace](https://twitter.com/webbedspace), [zloirock](https://twitter.com/zloirock)\
  \ 维护）\n* [Node.js 兼容性表](https://node.green)（由 [William Kapke](https://twitter.com/williamkapke)\
  \ 提供）\n* Mozilla 的 [MDN Web Docs](https://developer.mozilla.org/en-US/docs/Web/JavaScript)\
