  \ 语法概述\n\n这是对 JavaScript 语法的首次概览。如果某些内容现在还不理解，不要担心，它们将在本书的后部分进行更详细的解释。\n\n此概述并不是详尽的，它侧重于核心内容。\n\
  \n### 9.1.1 基本构造结构\n\n### 9.1.1.1 注释\n\n```\n[](#cb6-1)// 单行注释\n[](#cb6-2)\n[](#cb6-3)/*\n\
  [](#cb6-4)\n[](#cb6-5)\n[](#cb6-6)*/\n```\n\n### 9.1.1.2 原始值\n\n**布尔值：**\n```\n\
  [](#cb7-1)true\n[](#cb7-2)false\n```\n\n**数字：**\n```\n[](#cb8-1)1.4\n[](#cb8-2)123\n\
  ```\n\n**大整数 (Bigints):**\n```\n[](#cb9-1)1n\n[](#cb9-2)4n\n```\n\n**字符串：**\n```\n\
  [](#cb10-1)'abc'\n[](#cb10-2)\"abc\"\n[](#cb10-3)`abc`\n```\n\n### 9.1.1.3 断言\n\n\
  `assertion`（断言）描述了结果应该是什么样的，如果结果不则抛出异常。例如，下面的 `assert.equal(7 + 1, 8)` 是有效的：\n\n\
  ```\n[](#cb11-1)assert.equal(7 + 1, 8);\n```\n\n`assert.equal()` 是一个接收两个参数的方法：实际结果和预期结果。它是断言\
  \ API 的一部分。\n\n`assert.deepEqual()` 对对象进行深度比较。\n\n### 9.1.1.4 打印到控制台\n\n打印到标准输出或\
  \ Node.js：\n```\n[](#cb12-1)console.log('Hello!');\n[](#cb12-2)\n```\n\n打印到标准错误输出：\n\
  ```\n[](#cb12-3)console.error('Something went!');\n```\n\n### 9.1.1.5 运算符\n\n```\n\
  [](#cb13-1)true\n[](#cb13-2)false\n```\n**与 (And)**\n```\n[](#cb13-3)true && false\n\
  ```\n**或 (Or)**\n```\n[](#cb13-4)true || false\n```\n**数字**\n```\n[](#cb13-5)3 +\
  \ 4\n[](#cb13-6)3 - 4\n[](#cb13-7)3 * 4\n[](#cb13-8)3 / 4\n```\n**大整数**\n```\n[](#cb13-9)3n\
  \ + 4n\n[](#cb13-10)3n - 4n\n[](#cb13-11)3n * 4n\n[](#cb13-12)3n / 4n\n```\n**字符串**\n\
  ```\n[](#cb13-13)'abc' + 'b'\n[](#cb13-14)\"ab\"\n[](#cb13-15)`abc`\n```\n**比较**\n\
  ```\n[](#cb13-16)3 < 4\n[](#cb13-17)3 <= 4\n[](#cb13-18)3 > 4\n[](#cb13-19)3 >=\
  \ 4\n[](#cb13-20)3 === 4\n[](#cb13-21)3 !== 4\n[](#cb13-22)'abc' === 'abc'\n[](#cb13-23)'abc'\
  \ !== 'def'\n```\nJavaScript 也有 `==` 比较。我建议使用严格相等。\n\n### 9.1.1.6 声明变量\n\n`const`\
  \ 创建*不可变的绑定*：变量必须立即初始化，之后不能重新赋值。但是，值本身可能是可变的。也就是说，`const` 并使值不可变。\n\n```\n[](#cb14-1)const\
  \ x = 8; // 会导致 TypeError\n```\n\n`let` 创建*可变的变量绑定*：\n```\n[](#cb15-1)let y;\n[](#cb15-4)y\
  \ = 5;\n```\n声明并初始化 `z`：\n```\n[](#cb15-8)let z = 5;\n```\n\n### 9.1.1.7 普通函数声明\n\
  \n```\n[](#cb16-1)function add1(a, b) {\n[](#cb16-3)  return a + b;\n}\n[](#cb16-6)assert.equal(add1(5,\
  \ 2), 7);\n```\n\n### 9.1.1.8 箭头函数表达式\n\n箭头函数表达式特别用于函数调用和方法调用的参数：\n\n```\n[](#cb17-1)const\
  \ add2 = (a, b) => { return a + b };\n[](#cb17-3)assert.equal(add2(5, 2), 7);\n\
  ```\n\n等同于 `add2`：\n```javascript\n[](#cb17-6)const add3 = (a, b) => a + b;\n```\n\
  \n之前的代码包含两个箭头函数（*表达式*和*语句*术语将在本章//主体为代码块的箭头函数\n(a, b) => { return a + b }\n[](#cb18-4)//主体为表达式的箭头函数\n\
  (a, b) => a + b\n```\n\n### 9.1.1.9 纯对象\n\n\n\n\n\n```javascript\n// 通过对象字面量创建一个普通对象\n\
  const obj = {\n  first: 'Jane', // 属性\n  last: 'Doe', // 属性\n  getFullName() { //\
  \ 属性（方法）\n    return this.first + ' ' + this.last;\n  },\n};\n\n// 获取属性值\nassert.equal(obj.first,\
  \ 'Jane');\n// 设置属性值\nobj.first = 'Janey';\n\n// 调用方法\nassert.equal(obj.getFullName(),\
  \ 'Janey Doe');\n```\n\n### 9.1.1.10 数组 (Arrays)\n\n```javascript\n// 通过数组字面量创建数组\n\
  const arr = ['a', 'b', 'c'];\nassert.equal(arr.length, 3);\n\n// 获取数组元素\nassert.equal(arr[1],\
  \ 'b');\n// 设置数组元素\narr[1] = 'β';\n\n// 向数组添加元素:\narr.push('d');\n\nassert.deepEqual(\n\
  \  arr, ['a', 'β', 'c', 'd']);\n```\n\n### 9.1.1.11 控制流语句 (Control flow statements)\n\
  \n条件语句：\n\n```javascript\nif (x < 0) {\n  x = -x;\n}\n```\n\n`for-of` 循环：\n\n```javascript\n\
  const arr = ['a', 'b'];\nfor (const element of arr) {\n  console.log(element);\n\
  }\n// 输出:\n// 'a'\n// 'b'\n```\n\n### 9.1.2 模块 (Modules)\n\n每个模块都是单独的文件。考虑以下包含模块的两个文件：\n\
  \n```\nfile-tools.mjs\nmain.mjs\n```\n\n`file-tools.mjs` 中的模块导出了它的函数 `isTextFilePath()`：\n\
  \n```javascript\nexport function isTextFilePath(filePath) {\n  return filePath.endsWith('.txt');\n\
  }\n```\n\n`main.mjs` 中的模块导入了整个模块 `path` 和函数 `isTextFilePath()`：\n\n```javascript\n\
  // 将整个模块作为命名空间对象 `path` 导入\nimport * as path from 'path';\n// 导入 file-tools.mjs\
  \ 中的单个导出\nimport {isTextFilePath} from './file-tools.mjs';\n```\n\n### 9.1.3 类 (Classes)\n\
  \n```javascript\nclass Person {\n  constructor(name) {\n    this.name = name;\n\
  \  }\n  describe() {\n    return `Person named ${this.name}`;\n  }\n  static logNames(persons)\
  \ {\n    for (const person of persons) {\n      console.log(person.name);\n    }\n\
  \  }\n}\n\nclass Employee extends Person {\n  constructor(name, title) {\n    super(name);\n\
  \    this.title = title;\n  }\n  describe() {\n    return super.describe() +\n \
  \     ` (${this.title})`;\n  }\n}\n\nconst jane = new Employee('Jane', 'CTO');\n\
  assert.equal(\n  jane.describe(),\n  'Person named Jane (CTO)');\n```\n\n### 9.1.4\
  \ 异常处理 (Exception handling)\n\n```javascript\nfunction throwsException() {\n  throw\
  \ new Error('Problem!');\n}\nfunction catchesException() {\n  try {\n    throwsException();\n\
  \  } catch (err) {\n    assert.ok(err instanceof Error);\n    assert.equal(err.message,\
  \ 'Problem!');\n  }\n}\n```\n\n注意：\n\n*   `try-finally` 和 `try-catch` 也被支持。\n* \
  \  我们可以抛出任何值，但堆栈跟踪等功能仅支持 `Error` 及其子类。\n\n### 9.1.5 法定的变量名和属性名 (Legal variable and\
  \ property names)\n\n变量名和属性名的语法范畴被称为*标识符* (identifier)。\n\n标识符允许包含字符：\n\n*   Unicode\
  \ 字母：`A–Z`, `a–z`（等）\n*   `$`, `_`\n*   Unicode 数字：`0–9`（等）\n    *   变量名不能以数字开头\n\
  \n某些单词在 JavaScript 中有特殊含义并且是*保留字* (reserved)。例如：`if`、`true`、`const`。\n\n保留字不能用变量名：\n\
  \n```javascript\nconst if = 123; // SyntaxError: 意外的标记\n```\n\n但它们允许作为属性名：\n\n```javascript\n\
  const obj = { if: 123 };\nobj.if\n```\n\n### 9.1.6 命名风格 (Casing styles)\n\n连接单词的常用命名风格有：\n\
  \n*   驼峰式 (Camel case)：`threeConcatenatedWords`\n*   下划线式（也称为 *snake case*）：`three_concatenated_words`\n\
  *   斜线式（也称为 *kebab case*）：`three-concatenated-words`\n\n### 9.1.7 名字的大小写 (Capitalization\
  \ of names)\n\n通常情况下，JavaScript 使用驼峰式，常量除外。\n\n小写：\n\n*   函数、变量：`myFunction`\n*\
  \   方法：`obj.myMethod`\n*   CSS：\n    *   CSS 实体：`special-class`\n    *   对应的 JavaScript\
  \ 变量：`specialClass`\n\n大写：\n\n*   类：`MyClass`\n*   常量：`MY_CONSTANT`\n    *   常量通常也使用驼峰式：`myConstant`\n\
  \n### 9.1.8 更多命名约定 (More naming conventions)\n\n以下命名约定在 JavaScript 中很流行。\n\n如果参数名以下划线开头（或就是下划线），则意味着该参数未未使用——例如：\n\
  \n```javascript\narr.map((_x, i) => i)\n```\n\n如果对象的属性名以下划线开头，则该属性被认为是私有的：\n\n```javascript\n\
  class ValueWrapper {\n  constructor(value) {\n    this._value = value;\n  }\n}\n\
  ```\n\n### 9.1.9 分号应该放在哪里？(Where to put semicolons?)\n\n位于语句末：\n\n```javascript\n\
  const x = 123;\nfunc();\n```\n\n但如果该语句以大括号结尾，则不需要：\n\n```javascript\nwhile (false)\
  \ {\n  // ...\n} // 不需要分号\n\nfunction func() {\n  // ...\n} // 不需要分号\n```\n\n然而，在这样的语句后添加分号并不是语法错误——它会被解释为空空语句：\n\
  \n```javascript\n// 函数声明后跟一个空语句：\nfunction func() {\n  // ...\n};\n```\n\n**测验：基础级**\
  \ \n\n查看测验应用。\n\n## 9.2 (进阶)\n\n本章剩余的所有章节都是进阶内容\n\n## 9.3 标识符 (Identifiers)\n\n\
  ### 9.3.1 有效的标识符（变量名等）\n\n第一个字符：\n\n*   Unicode 字母（包括带变音的字符如 `é` 和 `ü` 以及非拉丁字母，如\
  \ `α`）\n*   `$`\n*   `_`\n\n后续字符：\n\n*   合法的第一个字符\n*   Unicode 数字（包括阿拉伯数字）\n*  \
  \ 其他 Unicode 标记和标点符号\n\n示例：\n\n```javascript\nconst ε = 0.0001;\nconst строка =\
  \ '';\nlet _tmp = 0;\nconst $foo2 = true;\n```\n\n### 9.3.2 保留字 (Reserved words)\n\
  \n保留字不能作为变量名，但可以作为属性名。\n\n所有的 JavaScript *关键字* (keywords) 都是保留字：\n\n> `await` `break`\
  \ `case` `catch` `class` `const` `continue` `debugger` `default` `delete` `do` `else`\
  \ `export` `extends` `finally` `for` `function` `if` `import` `in` `instanceof`\
  \ `let` `new` `return` `static` `super` `switch` `this` `throw` `try` `typeof` `var`\
  \ `void` `while` `with` `yield`\n\n以下标记也是关键字，但目前未在语言中使用：\n\n> `enum` `implements`\
  \ `package` `protected` `interface` `private` `public`\n\n以下字面量 (literals) 是保留字：\n\
  \n> `true` `false` `null`\n\n从技术上说这些单词并不是保留字，但你也应该避免使用它们，因为它们实际上是关键字：\n\n> `Infinity`\
  \ `NaN` `undefined` `async`\n\n\n\n\n\n![](img/file5.svg) **我们假定只有语句和表达式**\n\n为了简单起见，我们假设\
  \ JavaScript 中只有语句和表达式。\n\n### 9.4.1 语句 (Statements)\n\n`statement`（语句）是可以执行并完成某种操作的代码段。例如，`if`\
  \ 就是一个语句：\n\n```\nlet myStr;\nif (myBool) {\n  myStr = 'Yes';\n} else {\n  myStr\
  \ = 'No';\n}\n```\n\n另一个语句的例子：函数声明。\n\n```\nfunction twice(x) {\n  return x + x;\n\
  }\n```\n\n### 9.4.2 表达式 (Expressions)\n\n`expression`（表达式）是可以被*求值*并产生一个值的代码。例如，括号之间的代码就是一个表达式：\n\
  \n```\nlet myStr = (myBool ? 'Yes' : 'No');\n```\n\n在括号之间使用的运算符 `? :` 称为*三元运算符*。它是\
  \ `if` 语句的表达式版本。\n\n让我们看更多表达式的例子。我们输入表达式，REPL 会为我们求出值：\n\n```\n> 'ab' + 'cd'\n'abcd'\n\
  > Number('123')\n123\n> true || false\ntrue\n```\n\n### 9.4.3 哪里允许使用什么？\n\nJavaScript\
  \ 源代码中的当前位置决定了你被允许使用何种语法结构：\n\n*   函数的体体必须是一系列语句：\n\n```\nfunction max(x, y) {\n\
  \  if (x > y) {\n    return x;\n  } else {\n    return y;\n  }\n}\n```\n\n*   函数调用或方法调用的参数必须是表达式：\n\
  \n```\nconsole.log('ab' + 'cd', Number('123'));\n```\n\n然而，表达式可以作为语句使用。这时它们被称为*表达式语句*（expression\
  \ statements）。相反情况则不然：当上下文需要表达式时，你不能使用语句。\n\n下面的代码证明任何表达式 `bar()` 既可以是表达式也可以是语句——取决于上下文：\n\
  \n```\nfunction f() {\n  console.log(bar()); // bar() 是表达式\n  bar(); // bar(); 是（表达式）语句\
  \ \n}\n```\n\n## 9.5 歧义语法 (Ambiguous syntax)\n\nJavaScript 有几种在语法上存在歧义的编程结构：相同的语法根据其是在语句上下文中还是表达式上下文中使用的，会有不同的解释。本节将探讨这种现象以及它导致的陷阱。\n\
  \n### 9.5.1 相同语法：函数声明和函数表达式\n\n`function declaration`（函数声明）是一个语句：\n\n```\nfunction\
  \ id(x) {\n  return x;\n}\n```\n\n`function expression`（函数表达式）是一个表达式（`=` 左的右侧）：\n\
  \n```\nconst id = function(x) {\n  return x;\n};\n```\n\n### 9.5.2 相同语法：对象字面量和块\n\
  \n在下面的代码中，`{}` 是一个*对象字面量*：创建一个空对象的表达式。\n\n```\nconst obj = {};\n```\n\n这是一个空代码块（语句）：\n\
  \n```\n{}\n```\n\n### 9.5.3 消除歧义 (Disambiguation)\n\n歧义只在语句上下文中才会成为问题：如果 JavaScript\
  \ 解析器遇到歧义语法，它不知道那是一个普通语句还是一个表达式。例如：\n\n*   如果语句以 `function` 开头：它是函数声明还是函数表达式？\n\
  *   如果语句以 `{` 开头：它是对象字面量还是代码块？\n\n为了消除歧义，以 `function` 或 `{` 开头的语句永远不会被解释为表达式。如果你想让一个表达式语句以这些标记之一开头，你必须将它包裹在括号中：\n\
  \n```\n(function (x) { console.log(x) })('abc');\n// 输出:\n'abc'\n```\n\n在这段代码中：\n\
  \n1.  我们首先通过函数表达式创建一个函数：\n\n```\nfunction (x) { console.log(x) }\n```\n\n2.  然后我们调用该函数：`('abc')`\n\
  \n(1) 所示的代码片段之所以被解释为表达式，是因为我们将其包裹在了括号中。如果不这样做，我们将得到一个语法错误，因为那时 JavaScript 期望一个函数声明，并抱怨缺少名称。此外，你不能在函数声明之后紧跟一个函数调用。\n\
  \n在书的后面，我们将看到更多由语法歧义引起的陷阱：\n\n*   通过对象解构进行赋值\n*   从箭头函数中返回对象字面量\n\n## 9.6 分号 (Semicolons)\n\
  \n### 9.6.1 分号的经验法则\n\n每个语句都以分号结束：\n\n```\nconst x = 3;\nsomeFunction('abc');\n\
  i++;\n```\n\n但以块结尾的语句除外：\n\n```\nfunction foo() {\n  // ...\n}\nif (y > 0) {\n \
  \ // ...\n}\n```\n\n以下情况稍显复杂：\n\n```\nconst func = () => {}; // 分号！\n```\n\n整个 `const`\
  \ 声明（一个语句）以分号结束，但在它内部有一个箭头函数。也就是说，不是语句以大括号结尾的，而是嵌入的函数表达式。这就是为什么结尾有一个分号。\n\n### 9.6.2\
  \ 分号：控制语句\n\n控制语句的体本身是一个语句。例如，这是 `while` 循环的语法：\n\n```\nwhile (condition)\n  statement\n\
  ```\n\n体可以是一个单一语句：\n\n```\nwhile (a > 0) a--;\n```\n\n但块也是语句，因此是控制语句合法的体：\n\n```\n\
  while (a > 0) {\n  a--;\n}\n```\n\n如果你想让循环有一个空体，你的第一个选择是空语句（仅仅是一个分号）：\n\n```\nwhile(processNextItem()\
  \ > 0);\n```\n\n你的第二个选择是空块：\n\n```\nwhile(processNextItem() > 0) {}\n```\n\n## 9.7\
  \ 自动分号插入 (ASI)\n\n虽然我建议始终写分号，但在 JavaScript 中大多数分号都是可选的。使这成为可能的机制被称为*自动分号插入*（automatic\
  \ semicolon insertion, ASI）。在某种程度上，它纠正了语法错误。\n\nASI 的工作原理如下。语句的解析持续直到遇到以下情况之一：\n\
  \n*   分号\n*   行终止符跟随非法标记\n\n换句话说，ASI 可以被视为在换行处插入分号。接下来的小节将介绍 ASI 的陷阱。\n\n### 9.7.1\
  \ 意外触发的 ASI\n\nASI 的好消息是——如果你不依赖它并始终写分号——你只需要注意一个陷阱。那就是：JavaScript 禁止在某些标记之后换行。\
  \ 如果你确实插入了换行符，分号也会被插入。\n\n这种情况下在实践中意义最大的标记是 `return`。考虑以下代码：\n\n```\nreturn\n{\n\
  \  first: 'jane'\n};\n```\n\n这段代码被解析为：\n\n```\nreturn;\n{\n  first: 'jane';\n}\n\
  ;\n```\n\n即：\n\n*   没有操作数的返回语句：`return;`\n*   代码块开始：`{`\n*   带有标签 `first:` 的表达式语句\
  \ `'jane';`\n*   代码块结束：`}`\n*   空语句：`;`\n\nJavaScript 为什么要这样做？它防止在 `return` 之后的行意外返回值。\n\
  \n### 9.7.2 意外未触发的 ASI\n\n在某些情况下，ASI 在你认为它应该触发时并没有触发。这让不喜欢分号的人的生活更加复杂，因为他们需要注意这些情况。以下是三个例子。还有更多。\n\
  \n**例子 1：意外的函数调用。**\n\n```\na = b + c\n(d + e).print()\n```\n\n解析为：\n\n```\na =\
  \ b + c(d + e).print();\n```\n\n**例子 2：意外的除法。**\n\n\n\n\n\n```\n[](#cb61-1)a = b\n\
  [](#cb61-2)/hi/g.exec(c).map(d)\n```\n\n解析为：\n\n```\n[](#cb62-1)a = b / hi / g.exec(c).map(d);\n\
  ```\n\n**示例 3：** 意外的属性访问。\n\n```\n[](#cb63-1)someFunction()\n[](#cb63-2)['ul', 'ol'].map(x\
  \ => x + x)\n```\n\n执行如下：\n\n```\n[](#cb64-1)const propKey = ('ul','ol'); // 逗号运算符\n\
  [](#cb64-2)assert.equal(propKey, 'ol');\n[](#cb64-3)\n[](#cb64-4)someFunction()[propKey].map(x\
  \ => x + x);\n```\n\n## 9.8 分号：最佳实践\n\n我建议你始终编写分号：\n\n- 我喜欢分号为代码带来的视觉结构——你可以清晰地看到语句何时结束。\n\
  - 需要记住的规则更少。\n- 大多数 JavaScript 程序员都使用分号。\n\n然而，也有许多人不喜欢分号带来的视觉杂乱。如果你也是其中之一：不写分号的代码\
  \ `is` 是合法的。我建议你使用工具来帮助避免错误。以下是两个示例：\n\n- 自动代码格式化工具 [Prettier](https://prettier.io)\
  \ 可以配置为不使用分号。它随后会自动修复问题。例如，如果它遇到以方括号开头的行，会在该行前加上一个分号。\n- 静态检查工具 [ESLint](https://eslint.org)\
  \ 有一条[规则](https://eslint.org/docs/rules/semi)，可以让你指定偏好的样式（始终始终使用分号或尽可能少地使用分号），并在关键问题发出警告。\n\
  \n## 9.9 严格模式 vs. 松散模式\n\n从 ECMAScript 5 开始，JavaScript 有两种可执行模式：\n\n- 普通的“松散模式”（sloppy\
  \ mode）是脚本的默认模式（作为模块的前身且受浏览器支持的代码片段）。\n- 严格模式（strict mode）是模块和类的默认模式，并可以在脚本中开启（如何开启将在后文解释）。在此模式下，消除了普通模式的几个陷阱，并会抛出更多异常。\n\
  \n在现代 JavaScript 代码中很少遇到松散模式，它们几乎总是位于模块中。在书中，我假设严格模式始终开启开启。\n\n### 9.9.1 开启严格模式\n\
  \n在脚本文件和 CommonJS 模块中，通过在第一行放置以下代码为整个文件开启严格模式：\n\n```\n[](#cb65-1)'use strict';\n\
  ```\n\n这个“指令”的之处在于，5 之前的 ECMAScript 版本会直接忽略它：它是一个无操作的表达式语句。\n\n你也可以为单个函数开启严格模式：\n\
  \n```\n[](#cb66-1)function functionInStrictMode() {\n[](#cb66-2)  'use strict';\n\
  [](#cb66-3)}\n```\n\n### 9.9.2 严格模式的改进\n\n让我们看看严格模式比松散模式更好的三件事。在本节中，所有代码片段都在松散模式下执行。\n\
  \n#### 9.9.2.1 松散模式陷阱：修改未声明的变量会创建全局变量\n\n在非严格模式下，修改未声明的变量会创建一个全局变量。\n\n```\n[](#cb67-1)function\
  \ sloppyFunc() {\n[](#cb67-2)  undeclaredVar1 = 123;\n[](#cb67-3)}\n[](#cb67-4)sloppyFunc();\n\
  [](#cb67-5)// 创建了全局变量 `undeclaredVar1`:\n[](#cb67-6)assert.equal(undeclaredVar1,\
  \ 123);\n```\n\n严格模式处理得更好，会抛出 `ReferenceError`。这使得检测拼写错误更容易。\n\n```\n[](#cb68-1)function\
  \ strictFunc() {\n[](#cb68-2)  'use strict';\n[](#cb68-3)  undeclaredVar2 = 123;\n\
  [](#cb68-4)}\n[](#cb68-5)assert.throws(\n[](#cb68-6)  () => strictFunc(),\n[](#cb68-7)\
  \  {\n[](#cb68-8)    name: 'ReferenceError',\n[](#cb68-9)    message: 'undeclaredVar2\
  \ is not defined',\n[](#cb68-10)  });\n```\n\n`assert.throws()` 表示其第一个参数（一个函数）在调用时会抛出\
  \ `ReferenceError`。\n\n#### 9.9.2.2 函数声明在严格模式下是块作用域，松散模式下是函数作用域\n\n在严格模式下，通过函数声明创建的变量只存在于最内层的嵌套块中：\n\
  \n```\n[](#cb69-1)function strictFunc() {\n[](#cb69-2)  'use strict';\n[](#cb69-3)\
  \  {\n[](#cb69-4)    function foo() { return 123 }\n[](#cb69-5)  }\n[](#cb69-6)\
  \  return foo(); // ReferenceError\n[](#cb69-7)}\n[](#cb69-8)assert.throws(\n[](#cb69-9)\
  \  () => strictFunc(),\n[](#cb69-10)  {\n[](#cb69-11)    name: 'ReferenceError',\n\
  [](#cb69-12)    message: 'foo is not defined',\n[](#cb69-13)  });\n```\n\n在松散模式下，函数声明是函数作用域：\n\
  \n```\n[](#cb70-1)function sloppyFunc() {\n[](#cb70-2)  {\n[](#cb70-3)    function\
  \ foo() { return 123 }\n[](#cb70-4)  }\n[](#cb70-5)  return foo(); // 正常\n[](#cb70-6)}\n\
  [](#cb70-7)assert.equal(sloppyFunc(), 123);\n```\n\n#### 9.9.2.3 松散模式在修改只读属性时不抛出异常\n\
  \n在严格模式下，以下代码将抛出 `ReferenceError`：\n\n```javascript\nconst obj = { a: 1 };\nobj.a\
  \ = 2;\n```\n\n在松散模式下，这将静默失败：\n\n```javascript\nvar obj = { a: 1 };\nobj.a = 2;\n\
  ```\n\n\n\n\n\n![](img/file0.svg) **阅读：REPL 交互**\n\n我偶尔会通过 REPL 交互来演示 JavaScript。此外，我还会使用大于符号（`>`）来标记输入——例如：\n\
  \n```\n> 3 + 5\n8\n```\n\n### 10.1.3 其他选项\n\n其他选项包括：\n\n*   有很多 Web 应用程序让你可以在 浏览器中实验\
  \ JavaScript —— 例如，[Babel 的 REPL](https://babeljs.io/repl)。\n*   还有用于运行 JavaScript\
  \ 的原生应用和 IDE 插件。\n\n![](img/file4.svg) **控制台通常在非严格模式下运行**\n\n在现代 JavaScript 中，大多数代码（例如模块）都是在严格模式中执行的。然而，控制台通常在非严格模式下运行。因此，当你使用控制台执行本书中的代码时，可能会偶尔得到略有不同的结果。\n\
  \n## 10.2 `console.*` API：打印数据及更多功能\n\n在浏览器中，控制台是你可以调出的、通常是隐藏的内容。对于 Node.js，控制台是\
  \ Node.js 当前正在运行的终端。\n\n完整的 `console.*` API 文档可以在 [MDN Web 文档](https://developer.mozilla.org/en-US/docs/Web/API/console)\
  \ 和 [Node.js 网站](https://nodejs.org/api/console.html)上找到。它不是 JavaScript 语言标准的一部分，但浏览器和\
  \ Node.js 都支持它的许多功能。\n\n在本章中，我们只查看以下两种打印数据的方法（“打印”意味着在控制台中显示）：\n\n*   `console.log()`\n\
  *   `console.error()`\n\n### 10.2.1 打印值：`console.log()` (stdout)\n\n该操作有两个变体：\n\n\
  ```\n[](#cb74-1)console.log(...values: any[]): void\n[](#cb74-2)console.log(pattern:\
  \ string, ...values: any[]): void\n```\n\n#### 10.2.1.1 打印多个值\n\n第一个变体在控制台上打印（值的文本表示形式）值：\n\
  \n```\n[](#cb75-1)console.log('abc', 123, true);\n[](#cb75-2)// 输出:\n[](#cb75-3)//\
  \ abc 123 true\n```\n\n在最后，`console.log()` 总是打印一个换行符。因此，如果你带零参数调用它，它只会打印一个换行符。\n\
  \n#### 10.2.1.2 打印带替换的字符串\n\n第二个变体执行字符串替换：\n\n```\n[](#cb76-1)console.log('Test:\
  \ %s %j', 123, 'abc');\n[](#cb76-2)// 输出:\n[](#cb76-3)// Test: 123 \"abc\"\n```\n\
  \n这些是你可以用于替换的一些指令：\n\n*   `%s` 将相应的值转换为字符串并将其插入。\n\n    ```\n    [](#cb77-1)console.log('%s\
  \ %s', 'abc', 123);\n    [](#cb77-2)// 输出:\n    [](#cb77-3)// abc 123\n    ```\n\
  \n*   `%o` 插入对象的字符串表示。\n\n    ```\n    [](#cb78-1)console.log('%o', {foo: 123, bar:\
  \ 'abc'});\n    [](#cb78-2)// 输出:\n    [](#cb78-3)// { foo: 123, bar: 'abc' }\n\
  \    ```\n\n*   `%j` 将值转换为 JSON 字符串并将其插入。\n\n    ```\n    [](#cb79-1)console.log('%j',\
  \ {foo: 123, bar: 'abc'});\n    [](#cb79-2)// 输出:\n    [](#cb79-3)// {\"foo\":123,\"\
  bar\":\"abc\"}\n    ```\n\n*   `%%` 插入单个 `%`。\n\n    ```\n    [](#cb80-1)console.log('%s%%',\
  \ 99);\n    [](#cb80-2)// 输出:\n    [](#cb80-3)// 99%\n    ```\n\n### 10.2.2 打印错误信息：`console.error()`\
  \ (stderr)\n\n`console.error()` 的工作与 `console.log()` 相同，但它记录的内容被视为错误信息。对于 Node.js，这意味着在\
  \ Unix 上输出将到 stderr 而不是 stdout。\n\n### 10.2.3 通过 `JSON.stringify()` 打印嵌套对象\n\n`JSON.stringify()`\
  \ 偶尔对于打印嵌套对象很有用：\n\n```\n[](#cb81-1)console.log(JSON.stringify({first: 'Jane', last:\
  \ 'Doe'}, null, 2));\n```\n\n输出：\n\n```\n{\n  \"first\": \"Jane\",\n  \"last\":\
  \ \"Doe\"\n}\n```\n\n# 11 断言 API\n\n*   11.1 软件开发中的断言\n*   11.2 断言在书中是如何被使用的\n \
  \   *   11.2.1 通过断言在代码示例中记录结果\n    *   11.2.2 通过断言实现测试驱动练习\n    *   11.3 普通比较与深层比较\n\
  \    *   11.4 断言 模块的快速参考\n\n## 11.1 软件开发中的断言\n\n在软件开发中，断言是关于值的必须正确的陈述。如果它们不成立，就会抛出异常。Node.js\
  \ 支持通过[严格模式](https://nodejs.org/api/assert.html#strict_mode) 的 `assert` 使用断言——例如：\n\
  \n```\n[](#cb83-1)import * as assert from 'assert/strict';\n```\n\n## 11.2 断言在书中是如何被使用的\n\
  \n在本书中，断言通过以下两种方式使用：通过断言在代码示例中记录结果以及通过断言实现测试驱动练习。\n\n### 11.2.1 通过断言在代码示例中记录结果\n\
  \n在代码示例中，断言表达了预期的结果。例如，下面的函数：\n\n```\n[](#cb84-1)function id(x) {\n  return x;\n\
  }\n```\n\n我们可以通过断言展示它：\n\n```\n[](#cb85-1)assert.equal(id('abc'), 'abc');\n```\n\
  \n使用断言的动机是：\n\n*   你可以精确地指定预期内容。\n*   代码示例可以被自动测试。\n\n### 11.2.2 通过断言实现测试驱动练习\n\n\
  书中的练习是通过测试框架驱动的。下面是这样的测试示例：\n\n```\n[](#cb86-1)test('First exercise', () => {\n\
  \  assert.equal(id('world'), 'Hello world!');\n  assert.equal(id('Jane'), 'Hello\
  \ Jane!');\n  assert.equal(id('John'), 'Hello John!');\n  assert.equal(id(''), 'Hello\
  \ !');\n});\n```\n\n更多信息，请参阅 12 “测验与练习`。\n\n\n\n\n可选的最后一个参数 `message` 可用于解释断言的内容。如果断言失败，该消息将用于设置并抛出\
  \ `AssertionError`。\n\n```javascript\nlet e;\ntry {\n  const x = 3;\n  assert.equal(x,\
  \ 8, 'x must be equal to 8')\n} catch (err) {\n  assert.equal(\n    String(err),\n\
  \    'AssertionError [ERR_ASSERTION]: x must be equal to 8');\n}\n```\n\n### 11.4.2\
  \ 深度等性\n\n*   `function deepEqual(actual: any, expected: any, message?: string):\
  \ void`\n\n    `actual` 必须与 `expected` 深度相等。如果不相等，则抛出 `AssertionError`。\n\n```javascript\n\
  assert.deepEqual([1,2,3], [1,2,3]);\nassert.deepEqual([], []);\n\n// 相比于 .equal()，对象仅与其自身相等：\n\
  assert.notEqual([], []);\n```\n\n*   `function notDeepEqual(actual: any, expected:\
  \ any, message?: string): void`\n\n    `actual` 不得与 `expected` 深度相等。如果相等，则抛出 `AssertionError`。\n\
  \n```javascript\nassert.notDeepEqual([1,2,3], [1,2]);\n```\n\n### 11.4.3 预期异常\n\n\
  如果你想（或预期）接收异常，则需要 `throws()`：此函数会调用其第一个参数（即函数 `block`），并仅在它抛出异常时执行成功。额外的参数可用于指定该异常的特征。\n\
  \n*   `function throws(block: Function, message?: string): void`\n\n```javascript\n\
  assert.throws(\n  () => {\n    null.prop;\n  }\n);\n```\n\n*   `function throws(block:\
  \ Function, error: Function, message?: string): void`\n\n```javascript\nassert.throws(\n\
  \  () => {\n    null.prop;\n  },\n  TypeError\n);\n```\n\n*   `function throws(block:\
  \ Function, error: RegExp, message?: string): void`\n\n```javascript\nassert.throws(\n\
  \  () => {\n    null.prop;\n  },\n  /^TypeError: Cannot read property 'prop' of\
  \ null$/\n);\n```\n\n*   `function throws(block: Function, error: Object, message?:\
  \ string): void`\n\n```javascript\nassert.throws(\n  () => {\n    null.prop;\n \
  \ },\n  {\n    name: 'TypeError',\n    message: `Cannot read property 'prop' of\
  \ null`,\n  }\n);\n```\n\n### 11.4.4 另一个工具函数\n\n*   `function fail(message: string\
  \ | Error): never`\n\n    调用时始终会抛出 `AssertionError`。这在单元测试中偶尔有用。\n\n```javascript\n\
  try {\n  functionThatShouldThrow();\n  assert.fail();\n} catch (_) {\n  // 成功\n\
  }\n```\n\n![](img/file7.svg) **测试**\n\n查看 测验应用。\n\n# 12 开始测验与练习\n\n*   12.1 测验\n\
  *   12.2 练习\n    *   12.2.1 安装练习\n    *   12.2.2 运行练习\n*   12.3 JavaScript 中的单元测试\n\
  \    *   12.3.1 典型测试\n    *   12.3.2 Mocha 中的异步测试\n\n在大多数章节中，都有测验和练习。这些是付费功能，但提供了预览。本章介绍了如何开始使用它们。\n\
  \n## 12.1 测验\n\n安装：\n\n*   下载并解压 `impatient-quiz.zip`\n\n运行测验应用：\n\n*   在浏览器中打开\
  \ `impatient-quiz/index.html`\n*   你将看到所有测验的目录。\n\n## 12.2 练习\n\n### 12.2.1 安装练习\n\
  \n安装练习：\n\n*   下载并解压 `impatient-code.zip`\n*   遵循 `README.txt` 中的说明\n\n### 12.2.2\
  \ 运行练习\n\n*   练习在书中通过路径引用。\n    *   例如：`exercises/quizzes-exercises/first_module_test.mjs`\n\
  *   在每个文件中：\n    *   第一行包含运行练习的命令。\n    *   后续行描述了你需要做什么。\n\n## 12.3 JavaScript\
  \ 中的单元测试\n\n书中所有的练习都是通过测试框架 [Mocha](https://mochajs.org) 运行的测试。本节简要介绍。\n\n### 12.3.1\
  \ 典型测试\n\n典型的测试代码分为两部分：\n\n*   第一部分：被测试的代码。\n*   第二部分：对代码的测试。\n\n以以下两个文件为例：\n\n\
  *   `id.mjs`（被测试的代码）\n*   `id_test.mjs`（测试）\n\n#### 12.3.1.1 第一部分：：代码\n\n代码本身位于\
  \ `id.mjs` 中：\n\n```javascript\nexport function id(x) {\n  return x;\n}\n```\n\n\
  #### 12.3.1.2 第二部分：测试\n\n该测试文件的核心是 `id_test.mjs`：\n\n```javascript\nimport * as\
  \ assert from 'assert';\nimport {id} from './id.mjs';\n\ntest('My test', () => {\n\
  \  assert.equal(id(4), 2);\n});\n```\n\n\n\n\n\n```javascript\nfunction divideCallback(x,\
  \ y, callback) {\n  if (y === 0) {\n    callback(new Error('Division by zero'));\n\
  \  } else {\n    callback(null, x / y);\n  }\n}\n```\n\n### 12.3.2.2��通过 Promise\
  \ 实现异步化\n\n如果测试返回一个 `Promise`，Mocha 会切换到基于 Promise 的异步处理。如果 `Promise` 已完成（fulfilled），则认为测试成功；如果\
  \ `Promise` 被拒绝（rejected）或处理时间超过超时时间，则测试失败。\n\n```javascript\ntest('dividePromise\
  \ 1', t => {\n  return dividePromise(8, 4)\n  .then(result => {\n    assert.strictEqual(result,\
  \ 2);\n  });\n});\n```\n\n`dividePromise()` 的实现如下：\n\n```javascript\nfunction dividePromise(x,\
  \ y) {\n  return new Promise((resolve, reject) => {\n    if (y === 0) {\n      reject(new\
  \ Error('Division by zero'));\n    } else {\n      resolve(x / y);\n    }\n  });\n\
  }\n```\n\n### 12.3.2.3��将 Async 函数作为测试“主体”\n\nAsync 函数始终返回 `Promises`。因此，`async`\
  \ 函数是实现异步测试的一种方便方式。以下代码与之前的示例等效。\n\n```javascript\ntest('dividePromise 2', async\
  \ t => {\n  const result = await dividePromise(8, 4);\n  assert.strictEqual(result,\
  \ 2);\n  // 不需要显式返回！\n});\n```\n\n我们不需要显式返回任何内容：隐式返回的 `undefined` 用于完成该 `async`\
  \ 函数返回的 `Promise`。如果测试代码抛出异常，`async` 函数将处理拒绝返回的 `Promise`。\n\n# 13 变量与赋值\n\n###\
  \ 13.1��`let`\n\n### 13.2��`const`\n\n#### 13.2.1��`const` 与不可变性\n\n#### 13.2.2��`const`\
  \ 与循环\n\n### 13.3��在 `const` 和 `let` 之间做选择\n\n### 13.4��变量的作用域\n\n#### 13.4.1��变量遮蔽\n\
  \n### 13.5��（进阶）\n\n### 13.6��术语：静态 vs. 动态\n\n#### 13.6.1��静态现象：变量的作用域\n\n#### 13.6.2��动态现象：函数调用\n\
  \n### 13.7��全局变量与全局对象\n\n#### 13.7.1��`globalThis` [ES2020]\n\n### 13.8��声明：作用域与激活\n\
  \n#### 13.8.1��`const` 和 `let`：暂性死区\n\n#### 13.8.2��函数声明与早期激活\n\n#### 13.8.3��类声明不会提早激活\n\
  \n#### 13.8.4��`var`：提升（部分早期提升）\n\n### 13.9��闭包\n\n#### 13.9.1��绑定变量 vs. 自由变量\n\n\
  #### 13.9.2��什么是闭包？\n\n#### 13.9.3��示例：递增器工厂\n\n#### 13.9.4��闭包的使用场景\n\n这些是 JavaScript\
  \ 声明变量的主要方式：\n\n* `let` 声明可变变量。\n* `const` 声明常量（不可变变量）。\n\n在 ES6 之前，还有 `var`。但它有许多怪癖，因此最好避免使用。你可以在《《\
  \ JavaScript》中阅读更多关于它的信息。\n\n## 13.1��`let`\n\n通过 `let` 声明的变量是可变的：\n\n```javascript\n\
  let i;\ni = 0;\ni = i + 1;\nassert.equal(i, 1);\n```\n\n你也可以同时进行声明和赋值：\n\n```javascript\n\
  let i = 0;\n```\n\n## 13.2��`const`\n\n通过 `const` 声明的变量是不可变的。你必须始终初始化：\n\n```javascript\n\
  const i = 0; // 必须初始化\nassert.throws(\n  () => { i = i + 1 },\n  {\n    name: 'TypeError',\n\
  \    message: 'Assignment to constant variable.',\n  }\n);\n```\n\n### 13.2.1��`const`\
  \ 与不可变性\n\n在 JavaScript 中，`const` 仅意味着绑定（变量名与变量值之间的关联）是不可变的。值本身可能是可变的，例如下面示例中的 `obj`。\n\
  \n```javascript\nconst obj = { prop: 0 };\n// 允许：修改 obj 的属性\nobj.prop = obj.prop\
  \ + 1;\nassert.equal(obj.prop, 1);\n// 不允许：给 obj 赋值\nassert.throws(\n  () => { obj\
  \ = {} },\n  {\n    name: 'TypeError',\n    message: 'Assignment to constant variable.',\n\
  \  }\n);\n```\n\n### 13.2.2��`const` 与循环\n\n你可以在 `for-of` 循环中使用 `const`，其中每次迭代都会创建一个新的绑定：\n\
  \n```javascript\nconst arr = ['hello', 'world'];\nfor (const elem of arr) {\n  console.log(elem);\n\
  }\n// 输出：\n// 'hello'\n// 'world'\n```\n\n但在普通的 `for` 循环中，你必须使用 `let`：\n\n```javascript\n\
  const arr = ['hello', 'world'];\nfor (let i=0; i<arr.length; i++) {\n  const elem\
  \ = arr[i];\n  console.log(elem);\n}\n```\n\n## 13.3��在 `const` 和 `let` 之间做选择\n\n\
  我建议遵循以下规则来选择 `const` 和 `let`：\n\n* `const` 表示绑定不可变，且变量不会改变其值。优先使用它。\n* `let` 表示变量的值会改变。只有在你无法使用\
  \ `const` 时才使用它。\n\n**练习：`const`**\n\n`exercises/variables-assignment/const_exrc.mjs`\n\
  \n## 13.4��变量的作用域\n\n变量的`作用域`是可以访问它的程序区域。考虑以下代码：\n\n```javascript\n{ // 作用域 A：访问\
  \ x\n  const x = 0;\n  assert.equal(x, 0);\n  { // 作用域 B：访问 x, y\n    const y =\
  \ 1;\n    assert.equal(x, 0);\n    assert.equal(y, 1);\n    { // 作用域 C：访问 x, y,\
  \ z\n      const z = 2;\n      assert.equal(x, 0);\n      assert.equal(y, 1);\n\
  \      assert.equal(z, 2);\n    }\n  }\n}\n// 外部：无法访问 x, y, z\nassert.throws(\n\
  \  () => console.log(x),\n  {\n    name: 'ReferenceError',\n    message: 'x is not\
  \ defined',\n  }\n);\n```\n\n* 作用域 A 是 `x` 的 *(直接)作用域*。\n* 作用域 B 和 C 是作用域 A 的 *内部作用域*。\n\
  * 作用域 A 是作用域 B 和 C 的 *外部作用域*。\n\n每个变量在其直接作用域以及嵌套在该作用内的所有作用域中都是可用的。\n\n通过 `const`\
  \ 和 `let` 声明的变量被称为*块级作用域*，因为它们的作用域始终是最内层的块。\n\n### 13.4.1��变量遮蔽\n\n\n\n\n\n```javascript\n\
  assert.throws(\n  () => {\n    eval('let x = 1; let x = 2;');\n  },\n  {\n    name:\
  \ 'SyntaxError',\n    message: \"Identifier 'x' has already been declared\",\n \
  \ }\n);\n```\n\n![](img/file5.svg) **为什么使用 `eval()`？**\n\n`eval()`` 延迟了解析（因此延迟了\
  \ `SyntaxError`），直到 `assert.throws()` 的回调被执行。如果不使用它，在解析这段代码时就会报错，导致 `assert.throws()`\
  \ 甚至不会执行。\n\n然而，你可以在块中嵌套并使用与块外部相同的变量名 `x`：\n\n```javascript\nconst x = 1;\nassert.equal(x,\
  \ 1);\n{\n  const x = 2;\n  assert.equal(x, 2);\n}\nassert.equal(x, 1);\n```\n\n\
  在块内部，内部的 `x` 是唯一可以访问的同名变量。内部的 `x` 被称为*遮蔽*（shadow）了外部的 `x`。一旦离开该块，就可以再次访问旧值。\n\n\
  ![](img/file7.svg) **测验：基础**\n\n查看测验应用。\n\n## 13.5 (高级)\n\n所有剩余章节均为高级内容。\n\n## 13.6\
  \ 术语：静态与 动态\n\n这两个形容词描述了编程语言中的现象：\n\n* *静态*（Static）意味着某些内容与源代码有关，并且可以在不执行代码的情况下确定。\n\
  * *动态*（Dynamic）意味着在运行时。\n\n让我们来看这两个术语的示例。\n\n### 13.6.1 静态现象：变量的作用域\n\n变量作用域是一种静态现象。考虑以下代码：\n\
  \n```javascript\nfunction f() {\n  const x = 3;\n  // ···\n}\n```\n\n`x` 是*静态*（或*词法*）作用域的。这意味着它的作用域是固定的，不会在运行时改变。\n\
  \n变量作用域形成了一棵静态树（通过静态嵌套）。\n\n### 13.6.2 动态现象：函数调用\n\n函数调用是一种动态现象。考虑以下代码：\n\n```javascript\n\
  function g(x) {}\nfunction h(y) {\n  if (Math.random()) g(y); // (A)\n}\n```\n\n\
  行 A 中的函数调用是否发生，只能在运行时决定。\n\n函数调用形成了一棵动态树（通过动态调用）。\n\n## 13.7 全局变量与全局对象\n\nJavaScript\
  \ 的变量作用域是嵌套的。它们形成了一棵树：\n\n* 最外层的作用域是树的根。\n* 直接包含在该作用域内的作用域是根的节点。\n* 以此类推。\n\n根也被称为*全局作用域*（global\
  \ scope）。在 Web 浏览器中，唯一直接处于该作用域的地方是脚本的顶层。全局作用域的变量被称为*全局变量*，并且随处可访问。全局变量有两种：\n\n*\
  \ *全局声明变量*（Global declarative variables）是普通变量。\n    * 它们只能在脚本顶层通过 `const`、`let`\
  \ 和 `class` 声明来创建。\n* *全局对象变量*（Global object variables）存储在所谓*全局对象*的属性中。\n    * 它们在脚本顶层通过\
  \ `var` 和函数声明创建。\n    * 可以通过全局变量 `globalThis` 访问全局对象。它可以用于创建、读取和删除全局对象变量。\n    *\
  \ 除外，全局对象变量的用法与普通变量一样。\n\n下面的 HTML 片段演示了 `globalThis` 和两种全局变量。\n\n```html\n<script>\n\
  \  const declarativeVariable = 'd';\n  var objectVariable = 'o';\n</script>\n<script>\n\
  \  // 所有脚本共享同一个顶层作用域：\n  console.log(declarativeVariable); // 'd'\n  console.log(objectVariable);\
  \ // 'o'\n\n  // 并不是所有的声明都会创建全局对象的属性：\n  console.log(declarativeVariable); // undefined\n\
  \  console.log(objectVariable); // 'o'\n</script>\n```\n\n\n\n\n\n`import` 的描述参见\
  \ §29.5 “ECMAScript modules”。接下来的章节将更详细地描述其他构造。\n\n### 13.8.1 `const` 和 `let`：暂时性死区\n\
  \n对于 JavaScript，TC39 需要决定在直接作用域内、在声明之前访问一个常量会发生什么：\n\n```\n[](#cb122-1){\n[](#cb122-2)\
  \  console.log(x); // 这里会发生什么？\n[](#cb122-3)  const x;\n[](#cb122-4)}\n```\n\n一些可能的方法有：\n\
  \n1. 在当前作用域周围的作用域中解析名称。\n2. 获取 `undefined`。\n3. 产生错误。\n\n方法 1 被拒绝了，因为语言中没有这种方法的先例。因此，这对于\
  \ JavaScript 程序员来说是不直观的。\n\n方法 2 被拒绝了，因为这样 `x` 将不再是一个常量——它在声明前后的值是不同的。\n\n`let`\
  \ 与 `const` 采用了相同的方法 3，因此它们的工作方式相似，便于在它们之间切换。\n\n从进入变量的作用域到执行其声明之间的时间被称为该变量的`暂时性死区`（temporal\
  \ dead zone，TDZ）：\n\n* 在这段时间内，变量被认为尚未初始化（就像它拥有一个特殊值一样）。\n* 如果你访问未初始化的变量，将得到一个 `ReferenceError`。\n\
  * 一旦到达变量声明，变量将被设置为初始化器值（通过赋值符号指定）或 `undefined`——如果没有初始化器。\n\n以下代码说明了暂时性死区：\n\n```\n\
  [](#cb123-1)if (true) { // 进入 `tmp` 的作用域，TDZ 开始\n[](#cb123-2)  // `tmp` 是未初始化的：\n\
  [](#cb123-3)  assert.throws(() => (tmp = 'abc'), ReferenceError);\n[](#cb123-4)\
  \  assert.throws(() => console.log(tmp), ReferenceError);\n[](#cb123-5)\n[](#cb123-6)\
  \  let tmp; // TDZ 结束\n[](#cb123-7)  assert.equal(tmp, undefined);\n[](#cb123-8)}\n\
  ```\n\n下一个示例显示了暂时性死区真的是`暂时性的`（与时间有关）：\n\n```\n[](#cb124-1)if (true) { // 进入 `myVar`\
  \ 的作用域，TDZ 开始\n[](#cb124-2)  const func = () => {\n[](#cb124-3)    console.log(myVar);\
  \ // 后执行\n[](#cb124-4)  };\n[](#cb124-5)\n[](#cb124-6)  // 我们处于 TDZ 之中：\n[](#cb124-7)\
  \  // 访问 `myVar` 会导致 `ReferenceError`\n[](#cb124-8)\n[](#cb124-9)  let myVar = 3;\
  \ // TDZ 结束\n[](#cb124-10)  func(); // OK，在 TDZ 外部调用\n[](#cb124-11)}\n```\n\n尽管\
  \ `func()` 位于 `myVar` 声明之前并使用了该变量，但我们仍然调用 `func()`。但我们必须等到 `myVar` 的暂时性死区结束。\n\n\
  ### 13.8.2 函数声明和早期激活\n\n![](img/file0.svg) 关于函数的更多信息\n\n在这一节中，我们正在使用函数——在我们还没有机会正确学习它们之前。希望一切仍然通顺的。每当不通顺时，请参\
  \ §27 “可调用值”。\n\n函数声明在进入其作用域时总是会被执行，无论它位于该作用域内的什么位置。这使得你可以在声明之前之前调用函数 `foo()`：\n\
  \n```\n[](#cb125-1)assert.equal(foo(), 123); // OK\n[](#cb125-2)function foo() {\
  \ return 123; }\n```\n\n`foo()` 的早期激活意味着之前的代码等同于：\n\n```\n[](#cb126-1)function foo()\
  \ { return 123; }\n[](#cb126-2)assert.equal(foo(), 123);\n```\n\n如果你通过 `const` 或\
  \ `let` 声明函数，它就不会被早期激活。在下面的示例中，你只能在声明后使用 `bar()`。\n\n```\n[](#cb127-1)assert.throws(\n\
  [](#cb127-2)  () => bar(), // 声明前\n[](#cb127-3)  ReferenceError);\n[](#cb127-4)\n\
  [](#cb127-5)const bar = () => { return 123; };\n[](#cb127-6)assert.equal(bar(),\
  \ 123); // 声明后\n```\n\n#### 13.8.2.1 提前提前调用\n\n即使函数 `g()` 没有早期激活，只要我们遵循以下规则：`f()`\
  \ 必须在 `g()` 声明之后调用，就可以在同一作用域内由前面的函数 `f()` 调用。\n\n```\n[](#cb128-1)const f = () =>\
  \ g();\n[](#cb128-2)const g = () => 123;\n[](#cb128-3)// 我们在 g() 声明后调用 f()\n[](#cb128-4)assert.equal(f(),\
  \ 123);\n```\n\n模块的函数通常在执行完毕后被调用。因此，在模块中很少需要担心函数的顺序。最后，注意早期激活：进入作用域时，先执行所有的声明。\n\
  \n#### 13.8.2.2 早期激活的陷阱\n\n如果你依赖早期激活在声明之前调用函数，那么需要注意它是早期激活的。\n\n```\n[](#cb129-1)funcDecl();\n\
  [](#cb129-2)const MY_STR = 'abc';\n[](#cb129-3)function funcDecl() {\n[](#cb129-4)\
  \  assert.throws(\n[](#cb129-5)    () => MY_STR,\n[](#cb129-6)    ReferenceError);\n\
  [](#cb129-7)}\n```\n\n如果你在 `MY_STR` 声明之后调用 `funcDecl()`，问题就会消失。\n\n#### 13.8.2.3\
  \ 早期激活的优缺点\n\n我们已经看到早期激活有陷阱，而且可以在不使用它的情况下获得它的大部分好处。因此，避免早期激活更好。但我对此并不坚持，如提到的，使用函数声明是因为我喜欢它们的语法。\n\
  \n### 13.8.3 类声明没有早期激活\n\n尽管它们在某些方面与函数声明相似，但类声明并没有早期激活：\n\n```\n[](#cb130-1)assert.throws(\n\
  [](#cb130-2)  () => new MyClass(),\n[](#cb130-3)  ReferenceError);\n[](#cb130-4)class\
  \ MyClass {}\n[](#cb130-5)assert.equal(new MyClass() instanceof MyClass, true);\n\
  ```\n\n为什么这样？考虑下面的类声明：\n\n```\n[](#cb131-1)class MyClass extends Object\n```\n\n\
  `extends` 的操作数是一个表达式。因此，你可以这样做：\n\n```\n[](#cb132-1)const identity = x => x;\n[](#cb132-2)class\
  \ MyClass extends identity {}\n```\n\n评估这样的表达式必须在提到它的位置进行。否则会引起混乱。这解释了为什么类声明没有早期激活。\n\
  \n### 13.8.4 `var`：提升（部分早期激活）\n\n`var` 是一种旧的声明方式，早于 `const` 和 `let`（现在更推荐它们）。考虑下面的\
  \ `var` 声明：\n\n```\n[](#cb133-1)var x = 123;\n```\n\n这个声明包含两个部分：\n\n* 声明 `var x`：`var`\
  \ 变量的作用域是内层函数，而不是大多数其他声明那样的块。这种变量在作用域开始时就已经激活，并初始化为 `undefined`。\n* 赋值 `x = 123`：赋值始终在原处执行。\n\
  \n以下代码演示了 `var` 的影响：\n\n```\n[](#cb134-1)function f() {\n[](#cb134-2)  // 部分早期激活：\n\
  [](#cb134-3)  assert.equal(x, undefined);\n[](#cb134-4)  if (true) {\n[](#cb134-5)\
  \    var x = 123;\n[](#cb134-6)    // 赋值在原处执行：\n[](#cb134-7)    assert.equal(x,\
  \ 123);\n[](#cb134-8)  }\n[](#cb134-9)  // 作用域是函数，而不是块：\n[](#cb134-10)  assert.equal(x,\
  \ 123);\n[](#cb134-11)}\n```\n\n## 13.9 闭包\n\n在探索闭包之前，我们需要学习绑定变量和自由变量。\n\n### 13.9.1\
  \ 绑定变量与自由变量\n\n每个作用域有一组提到的变量。在这些变量中我们区分：\n\n* `绑定变量`在作用域内声明。它们是参数和局部变量。\n* `自由变量`在外部声明。它们也被称为`非局部变量`。\n\
  \n考虑下面的代码：\n\n```\n[](#cb135-1)function func(x) {\n[](#cb135-2)  const y = 123;\n\
  [](#cb135-3)  console.log(z);\n[](#cb135-4)}\n```\n\n\n\n\n在 `func()` 的体中，`x` 和\
  \ `y` 是绑定变量。`z` 是一个自由变量。\n\n### 13.9.2 什么是闭包？\n\n那么什么是闭包呢？\n\n> *闭包*是一个函数加上一个对在其“出生地”存在的变量的连接。\n\
  \n保持这种连接的意义何在？它为函数的自由变量提供了值——例如：\n\n```javascript\nfunction funcFactory(value) {\n\
  \  return () => {\n    return value;\n  };\n}\n\nconst func = funcFactory('abc');\n\
  assert.equal(func(), 'abc'); // (A)\n```\n\n`funcFactory` 返回一个赋值给 `func` 的闭包。由于\
  \ `func` 拥有到其出生地变量的连接，因此当它在第 A 行被调用时，它仍然可以访问自由变量 `value`（尽管它“逃逸”了它的作用域）。\n\n![](img/file2.svg)\
  \ **JavaScript 中的所有函数都是闭包**\n\nJavaScript 通过闭包支持静态作用域。因此，每个函数都是闭包。\n\n### 13.9.3 示例：一个自增器工厂\n\
  \n以下函数返回*自增器*（我刚刚起起的名称）。自增器是一个内部存储一个数字的函数。当它被调用时，它通过将参数加上数字来更新该数字并返回新值。\n\n```javascript\n\
  function createInc(startValue) {\n  return (step) => { // (A)\n    startValue +=\
  \ step;\n    return startValue;\n  };\n}\nconst inc = createInc(5);\nassert.equal(inc(2),\
  \ 7);\n```\n\n我们可以看到第 A 行创建的函数在自由变量 `startValue` 中保留它的内部数字。这一次，我们不仅是从出生作用域读取，还利用它来存储我们会修改的且跨越函数调持续存在的数据。\n\
  \n我们可以通过局部变量在出生作用域中创建更多的存储槽：\n\n```javascript\nfunction createInc(startValue) {\n\
  \  let index = -1;\n  return (step) => {\n    startValue += step;\n    index++;\n\
  \    return [index, startValue];\n  };\n}\n\nconst inc = createInc(5);\nassert.deepEqual(inc(2),\
  \ [0, 7]);\nassert.deepEqual(inc(2), [1, 9]);\nassert.deepEqual(inc(2), [2, 11]);\n\
  ```\n\n### 13.9.4 闭包的用例\n\n闭包有什么用？\n\n*   首先，它们是静态作用域的实现。因此，它们为回调函数提供了上下文数据。\n*\
  \   它们也可以被函数用于存储跨越函数调持续持续的状态。`createInc()` 就是这样一个例子。\n*   它们还可以为对象提供私有数据（通过字面量或类产生）。关于其如何工作的细节在\
  \ [*探索 ES6*](https://exploringjs.com/es6/ch_classes.html#_private-data-via-constructor-environments)\
  \ 中解释。\n\n![](img/file7.svg) **测验：高级**\n\n查看测试应用。\n\n# 14 值\n\n*   14.1 什么是类型？\n\
