  \    } else {\n      // 成功\n      try { // (B)\n        const obj = JSON.parse(text);\
  \ // (C)\n        assert.deepEqual(obj, {\n          first: 'Jane',\n          last:\
  \ 'Doe',\n        });\n      } catch (e) {\n        // 无效 JSON\n        assert.fail(e);\n\
  \      }\n    }\n  });\n```\n\n（注：原文示例中存在逻辑重复和格式混乱，翻译时保持其原始结构）\n\n#### 42.2.1.2\
  \ 基于 Promise 的版本\n\n以下代码读取该文件的内容并将其转换为 JavaScript 对象。它基于 `Promise` 的版本：\n\n```\n\
  // 示例：基于 Promise 的实现逻辑\nfs.readFilePromise('person.json').then(text => {\n    const\
  \ obj = JSON.parse(text);\n    assert.deepEqual(obj, {\n      first: 'Jane',\n \
  \     last: 'Doe',\n    });\n  }).catch(err => {\n    assert.fail(err);\n  });\n\
  ```\n\n（注：原文提供的源文本在 42.2.1.1 之后存在大量重复和乱码化描述，以上翻译基于核心语义）\n\n\n\n\n\n```\nfetch('http://example.com/textfile.txt')\n\
  \  .then(response => response.text())\n  .then(text => {\n    assert.equal(text,\
  \ 'Content of textfile.txt\\n');\n  });\n```\n\n![](img/file6.svg) **练习：使用 fetch\
  \ API**\n\n`exercises/promises/fetch_json_test.mjs`\n\n## 42.3 错误处理：不要混合拒绝（rejections）和异常（exceptions）\n\
  \n实现函数和方法的规则：\n\n> 不要将（异步）拒绝和（同步）异常混合用用。\n\n这使得我们的同步和异步代码更具可预测性且也更简单，因为我们可以始终专注于一种单一的错误处理机制。\n\
  \n对于基于 Promise 的函数和方法，该规则意味着它们不应该抛出异常。遗憾的是，很容易不小心出错——例如：\n\n```javascript\n// 不要这样做\n\
  function asyncFunc() {\n  doSomethingSync(); // (A)\n  return doSomethingAsync()\n\
  \    .then(result => {\n      // ···\n    });\n}\n```\n\n问题在于，如果在第 A 行抛出异常，那么 `asyncFunc()`\
  \ 将抛出异常。该函数的调用者只期望得到拒绝，而没有准备好处理异常。我们三种方法可以修复这个问题。\n\n我们可以将整个函数体封装在 `try-catch` 语句中，并在抛出异常时返回一个拒绝的\
  \ Promise：\n\n```javascript\n// 方案 1\nfunction asyncFunc() {\n  try {\n    doSomethingSync();\n\
  \    return doSomethingAsync()\n      .then(result => {\n        // ···\n      });\n\
  \  } catch (err) {\n    return Promise.reject(err);\n  }\n}\n```\n\n鉴于 `.then()`会将异常转换为拒绝，我们可以在\
  \ `.then()` 回调内部执行 `doSomethingSync()`。为了做到，我们通过 `Promise.resolve()` 启动 Promise\
  \ 链。我们忽略该初始 Promise 的履行值 `undefined`。\n\n```javascript\n// 方案 2\nfunction asyncFunc()\
  \ {\n  return Promise.resolve()\n    .then(() => {\n      doSomethingSync();\n \
  \     return doSomethingAsync();\n    })\n    .then(result => {\n      // ···\n\
  \    });\n}\n```\n\n最后，`new Promise()` 也会将异常转换为拒绝。因此，使用这个构造函数与之前的方案类似：\n\n```javascript\n\
  // 方案 3\nfunction asyncFunc() {\n  return new Promise((resolve, reject) => {\n \
  \     doSomethingSync();\n      resolve(doSomethingAsync());\n    })\n    .then(result\
  \ => {\n      // ···\n    });\n}\n```\n\n## 42.4 基于 Promise 的函数同步启动，异步稳定\n\n大多数基于\
  \ Promise 的函数执行方式如下：\n\n*   它们的执行立即开始，是同步的（在当前任务中）。\n*   但它们返回的 Promise 保证是异步稳定的（在稍后的任务中）——如果会稳定的话。\n\
  \n下面的代码演示了这一点：\n\n```javascript\nfunction asyncFunc() {\n  console.log('asyncFunc');\n\
  \  return new Promise(\n    (resolve, _reject) => {\n      console.log('new Promise()');\n\
  \      resolve();\n    });\n}\nconsole.log('START');\nasyncFunc()\n  .then(() =>\
  \ {\n    console.log('.then()'); // (A)\n  });\nconsole.log('END');\n\n// 输出:\n\
  // 'START'\n// 'asyncFunc'\n// 'new Promise()'\n// 'END'\n// '.then()'\n```\n\n\n\
  \n\n\n```javascript\nfunction timesTwoAsync(x) {\n  return new Promise(resolve =>\
  \ resolve(x * 2));\n}\nconst arr = [1, 2, 3];\nconst promiseArr = arr.map(timesTwoAsync);\n\
  Promise.all(promiseArr)\n  .then(result => {\n    assert.deepEqual(result, [2, 4,\
  \ 6]);\n  });\n```\n\n#### 42.5.2.2 一个更真实的 `.map()` 示例\n\n接下来，我们将使用 `.map()` 和 `Promise.all()`\
  \ 从网络下载文本文件。为了实现这一点，我们需要下面的工具函数：\n\n```javascript\nfunction downloadText(url) {\n\
  \  return fetch(url)\n    .then((response) => { // (A)\n      if (!response.ok)\
  \ { // (B)\n        throw new Error(response.statusText);\n      }\n      return\
  \ response.text(); // (C)\n    });\n}\n```\n\n`downloadText()` 使用基于 Promise 的 [fetch\
  \ API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch) 将文本文件下载为字符串：\n\
  \n-   首先，它异步获取一个 `response`（第 A 行）。\n-   `response.ok`（第 B 行）检查是否存在如“文件未找到”之类的错误。\n\
  -   如果没有错误，我们使用 `.text()`（第 C 行）将文件内容作为字符串获取出来。\n\n在接下来的示例中，我们下载了两个文本文件：\n\n```javascript\n\
  const urls = [\n  'http://example.com/first.txt',\n  'http://example.com/second.txt',\n\
  ];\n\nconst promises = urls.map(\n  url => downloadText(url));\n\nPromise.all(promises)\n\
  \  .then(\n    (arr) => assert.deepEqual(\n      arr, ['First!', 'Second!']\n  \
  \  ));\n```\n\n#### 42.5.2.3 `Promise.all()` 的简单实现\n\n这是 `Promise.all()` 的简化实现（例如，它没有执行任何安全检查）：\n\
  \n```javascript\nfunction all(iterable) {\n  return new Promise((resolve, reject)\
  \ => {\n    let index = 0;\n    for (const promise of iterable) {\n      // 捕获 `index`\
  \ 的当前值\n      const currentIndex = index;\n      promise.then(\n        (value)\
  \ => {\n          if (anErrorOccurred) return;\n          result[currentIndex] =\
  \ value;\n          elementCount++;\n          if (elementCount === result.length)\
  \ {\n            resolve(result);\n          }\n        },\n        (err) => {\n\
  \          if (anErrorOccurred) return;\n          anErrorOccurred = true;\n   \
  \       reject(err);\n        });\n      index++;\n    }\n    if (index === 0) {\n\
  \      resolve([]);\n      return;\n    }\n    let elementCount = 0;\n    let anErrorOccurred\
  \ = false;\n    const result = new Array(index);\n  });\n}\n```\n\n### 42.5.3 `Promise.race()`\n\
  \n这是 `Promise.race()` 的类型签名：\n\n```typescript\nPromise.race<T>(promises: Iterable<Promise<T>>):\
  \ Promise<T>\n```\n\n`Promise.race()` 返回一个 Promise `q`，一旦 `promises` 中的第一个 Promise\
  \ `p` 状态确定，`q` 就会状态确定。`q` 与 `p` 具有相同的状态值。\n\n在接下来的演示中，已完成的 Promise（第 A 行）的状态发生在被拒绝的\
  \ Promise（第 B 行）确定之前。因此，结果也是完成的（第 C 行）。\n\n```javascript\nconst promises = [\n \
  \ new Promise((resolve, reject) =>\n    setTimeout(() => resolve('result'), 100)),\
  \ // (A)\n  new Promise((resolve, reject) =>\n    setTimeout(() => reject('ERROR'),\
  \ 200)), // (B)\n];\nPromise.race(promises)\n  .then((result) => assert.equal( //\
  \ (C)\n    result, 'result'));\n```\n\n在下一个演示中，拒绝会先发生：\n\n```javascript\nconst promises\
  \ = [\n  new Promise((resolve, reject) =>\n    setTimeout(() => resolve('result'),\
  \ 200)),\n  new Promise((resolve, reject) =>\n    setTimeout(() => reject('ERROR'),\
  \ 100)),\n];\nPromise.race(promises)\n  .then((result) => assert.equal(\n    result,\
  \ 'result'))\n  .catch(err => assert.deepEqual(err, new Error('Operation out')));\n\
  ```\n\n\n\n\n\n这是 `Promise.any()` 的类型签名：\n\n```javascript\nPromise.any<T>(promises:\
  \ Iterable<Promise<T>>): Promise<T>\n```\n\n`Promise.any()` 返回一个 Promise `p`。它的状态状态取决于参数\
  \ `promises`（该参数指向一个 Promise 迭代器）：\n\n*   当且当第一个 Promise 被履行（fulfilled）时，`p` 将以该\
  \ Promise 的值解析（resolved）。\n*   如果所有的 Promise 都被拒绝（rejected），则 `p` 将被 `AggregateError`\
  \ 实例所拒绝，该实例包含了所有的拒绝值。\n\n这是 `AggregateError` 的类型签名（省略了部分成员）：\n\n```javascript\n\
  class AggregateError {\n  constructor(errors: Iterable<any>, message: string);\n\
  \  get errors(): Array<any>;\n  get message(): string;\n}\n```\n\n图 25 展示了 `Promise.any()`\
  \ 的工作原理。\n\n![](img/file34.svg)\n\n图 25：Promise 组合器 `Promise.any()`。\n\n### 42.5.4.1\
  \ 前两个示例\n\n当其中一个 Promise 被履行时，发生的情况如下：\n\n```javascript\nconst promises = [\n  Promise.reject('ERROR\
  \ A'),\n  Promise.reject('ERROR B'),\n  Promise.resolve('result'),\n];\nPromise.any(promises)\n\
  \  .then((result) => assert.equal(\n    result, 'result'\n  ));\n```\n\n当所有的 Promise\
  \ 都被拒绝时，发生的情况如下：\n\n```javascript\nconst promises = [\n  Promise.reject('ERROR A'),\n\
  \  Promise.reject('ERROR B'),\n  Promise.reject('ERROR C'),\n];\nPromise.any(promises)\n\
  \  .catch((aggregateError) => assert.deepEqual(\n    aggregateError.errors,\n  \
  \  ['ERROR A', 'ERROR B', 'ERROR C']\n  ));\n```\n\n### 42.5.4.2 `Promise.any()`\
  \ vs. `Promise.all()`\n\n`Promise.any()` 和 `Promise.all()` 有两种比较方式：\n\n*   它们是互反的：\n\
  \    *   `Promise.all()`：第一个输入的拒绝会导致结果 Promise 被拒绝，或者其履行值是一个包含所有输入履行值的数组。\n    *\
  \   `Promise.any()`：第一个输入的履行会导致结果 Promise 被履行，或者其拒绝值是一个包含所有输入拒绝值的数组。\n*   它们关注点不同：\n\
  \    *   `Promise.all()` 关注的是*所有*履行。相反的情况（至少一个拒绝）会导致拒绝。\n    *   `Promise.any()`\
  \ 关注的是第一个履行。相反的情况（全为拒绝）会导致拒绝。\n\n### 42.5.4.3 `Promise.any()` vs. `Promise.race()`\n\
  \n`Promise.any()` 和 `Promise.race()` 也有关系，但它们关注点不同：\n\n*   `Promise.race()` 关注的是状态定型（settlements）。最先状态定型的\
  \ Promise 会“赢了”。换句话说：我们想知道第一个结束的异步计算。\n*   `Promise.any()` 关注的是履行（fulfillments）。第一个被履行的\
  \ Promise “赢了”。换句话说：我们想知道第一个成功的异步计算。\n\n`.race()` 的主要——相对少见的用例是为 Promise 设置超时。`.any()`\
  \ 的用例则广泛得多。我们接下来来看它们。\n\n### 42.5.4.4 `Promise.any()` 的用例\n\n如果我们有多个异步计算，并且对对第一个成功的感兴趣，就会使用\
  \ `Promise.any()`。在某种程度上，我们让计算相互竞争，并使用最快的那一个。\n\n以下代码展示了在下载资源时的应用：\n\n```javascript\n\
  const resource = await Promise.any([\n  fetch('http://example.com/first.txt')\n\
  \    .then(response => response.text()),\n  fetch('http://example.com/second.txt')\n\
  \    .then(response => response.text()),\n]);\n```\n\n同样的模式允许我们使用下载速度更快的模块：\n\n\
  ```javascript\nconst lodash = await Promise.any([\n  import('https://primary.example.com/lodash'),\n\
  \  import('https://secondary.example.com/lodash'),\n]);\n```\n\n作为对比，如果备用服务器仅作为回退（以防主服务器失败），我们将使用如下代码：\n\
  \n```javascript\nlet lodash;\ntry {\n  lodash = await import('https://primary.example.com/lodash');\n\
  } catch {\n  lodash = await import('https://secondary.example.com/lodash');\n}\n\
  ```\n\n### 42.5.4.5 如何实现 `Promise.any()`？\n\n`Promise.any()` 的简单实现基本上是 `Promise.all()`\
  \ 实现的镜像版本。\n\n### 42.5.5 `Promise.allSettled()` [ES2020]\n\n这次的类型签名稍微复杂一些。你可以直接跳到第一个演示，它应该更容易理解。\n\
  \n`Promise.allSettled()` 的类型签名：\n\n```javascript\nPromise.allSettled<T>(promises:\
  \ Iterable<Promise<T>>)\n  : Promise<Array<SettlementObject<T>>>\n```\n\n它返回一个 Promise，其数组的元素具有以下类型签名：\n\
  \n```javascript\ntype SettlementObject<T> = FulfillmentObject<T> | RejectionObject;\n\
  \ninterface FulfillmentObject<T> {\n  status: 'fulfilled';\n  value: T;\n}\n\ninterface\
  \ RejectionObject {\n  status: 'rejected';\n  reason: unknown;\n}\n```\n\n`Promise.allSettled()`\
  \ 返回一个 Promise `out`。当所有的 `promises` 都状态定型后，`out` 将被一个数组填充。该数组的每个元素 `e` 对应于 `promises`\
  \ 中的一个 Promise `p`：\n\n*   如果 `p` 被值 `v` 履行，则 `e` 为：\n  ```javascript\n  { status:\
  \ 'fulfilled', value:  v }\n  ```\n*   如果 `p` 被值 `r` 拒绝，则 `e` 为：\n  ```javascript\n\
  \  { status: 'rejected',  reason: r }\n  ```\n\n除非在遍历 `promises` 时发生错误，否则输出 Promise\
  \ `out` 永远不会被拒绝。\n\n图 26 展示了 `Promise.allSettled()` 的工作原理。\n\n![](img/file35.svg)\n\
  \n图 26：Promise 组合器 `Promise.allSettled()`。\n\n#### 42.5.5.1 `Promise.allSettled()`\
  \ 的第一个演示\n\n这是一个关于 `Promise.allSettled()` 如何工作的快速演示：\n\n```javascript\nPromise.allSettled([\n\
  \  Promise.resolve('a'),\n  Promise.reject('b')\n]).then(arr => assert.deepEqual(arr,\
  \ [\n  { status: 'fulfilled', value: 'a' },\n  { status: 'rejected', reason: 'b'\
  \ }\n]));\n```\n\n#### 42.5.5.2 `Promise.allSettled()` 的较长示例\n\n下一个示例类似于.map()`\
  \ 加上 `Promise.all()` 的示例（我们借用了其中的 `downloadText()` 函数）：我们正在下载多个文件，其 URL 存储在一个数组中。然而，这次我们不想在出现错误时停止，而是想继续。`Promise.allSettled()`\
  \ 允许我们这样做：\n\n```javascript\nconst urls = [\n  'http://example.com/exists.txt',\n\
  \  'http://example.com/missing.txt',\n];\nconst result = Promise.allSettled(\n \
  \ urls.map(u => downloadText(u)));\nresult.then(\n  arr => assert.deepEqual(\n \
  \   arr, [\n      { status: 'fulfilled', value: 'Hello!' },\n      { status: 'rejected',\
  \ reason: new Error('Not Found') },\n    ]\n  ));\n```\n\n#### 42.5.5.3 `Promise.allSettled()`\
  \ 的简单实现\n\n这是 `Promise.allSettled()` 的简化实现（例如，它没有执行安全检查）：\n\n\n\n\n\n```javascript\n\
  function allSettled(iterable) {\n  return new Promise((resolve, reject) => {\n \
  \   function addElementToResult(i, elem) {\n      result[i] = elem;\n      elementCount++;\n\
  \      if (elementCount === result.length) {\n        resolve(result);\n      }\n\
  \    }\n\n    let index = 0;\n    for (const promise of iterable) {\n      // Capture\
  \ the current value of `index`\n      const currentIndex = index;\n      promise.then(\n\
  \        (value) => addElementToResult(\n          currentIndex, {\n           \
  \ status: 'fulfilled',\n            value\n          }),\n        (reason) => addElementToResult(\n\
  \          currentIndex, {\n            status: 'rejected',\n            reason\n\
  \          }));\n      index++;\n    }\n    if (index === 0) {\n      resolve([]);\n\
  \      return;\n    }\n    let elementCount = 0;\n    const result = new Array(index);\n\
  \  });\n}\n```\n\n### 42.5.6 短路（进阶）\n\n对于 `Promise` 组合器，*短路*意味着输出的 `Promise` 提前完成（settled）——即在所有输入\
  \ `Promises` 完成状态改变之前。以下组合器支持短路：\n\n* `Promise.all()`：一旦有一个输入 `Promise` 被拒绝（rejected），输出的\
  \ `Promise` 就会被拒绝。\n* `Promise.race()`：一旦有一个输入 `Promise` 完成状态改变（settled），输出的 `Promise`\
  \ 就会完成。\n* `Promise.any()`：一旦有一个输入 `Promise` 成功（fulfilled），输出的 `Promise` 就会完成。\n\
  \n再次强调，提前完成并不意味着被忽略的 `Promises` 后面的操作停止了。它仅仅意味着它们的完成状态被忽略了。\n\n## 42.6 并发与 `Promise.all()`（进阶）\n\
  \n### 42.6.1 顺序执行 vs. 并发执行\n\n考虑以下代码：\n\n```javascript\nconst asyncFunc1 = () =>\
  \ Promise.resolve('one');\nconst asyncFunc2 = () => Promise.resolve('two');\n\n\
  asyncFunc1()\n  .then(result1 => {\n    assert.equal(result1, 'one');\n    return\
  \ asyncFunc2();\n  })\n  .then(result2 => {\n    assert.equal(result2, 'two');\n\
  \  });\n```\n\n以这种方式使用 `.then()` 会*顺序地*执行基于 `Promise` 的函数：只有在 `asyncFunc1()` 的结果完成状态改变后，才会执行\
  \ `asyncFunc2()`。\n\n`Promise.all()` 有助于更并发地执行基于 `Promise` 的函数：\n\n```javascript\n\
  Promise.all([asyncFunc1(), asyncFunc2()])\n  .then(arr => {\n    assert.deepEqual(arr,\
  \ ['one', 'two']);\n  });\n```\n\n### 42.6.2 并发提示：关注操作何时开始\n\n判断异步代码有多大“并发”的提示：关注异步操作何时开始，而不是关注它们的\
  \ `Promises` 是如何处理的。\n\n例如，以下每个函数都在并发执行 `asyncFunc1()` 和 `asyncFunc2()`，因为它们几乎在同一时间启动。\n\
  \n```javascript\nfunction concurrentAll() {\n  return Promise.all([asyncFunc1(),\
  \ asyncFunc2()]);\n}\nfunction concurrentThen() {\n  const p1 = asyncFunc1();\n\
  \  const p2 = asyncFunc2();\n  return p1.then(r1 => p2.then(r2 => [r1, r2]));\n\
  }\n```\n\n相反，以下两个函数都是顺序执行 `asyncFunc1()` 和 `asyncFunc2()` 的：只有在 `asyncFunc1()` 的\
  \ `Promise` 成功后，才会调用 `asyncFunc2()`。\n\n```javascript\nfunction sequentialThen()\
  \ {\n  return asyncFunc1()\n    .then(r1 => asyncFunc2()\n      .then(r2 => [r1,\
  \ r2]));\n}\nfunction sequentialAll() {\n  const p1 = asyncFunc1();\n  const p2\
  \ = p1.then(() => asyncFunc2());\n  return Promise.all([p1, p2]);\n}\n```\n\n###\
  \ 42.6.3 `Promise.all()` 是分支合并（fork-join）\n\n`Promise.all()` 与“分叉合并”（fork join）模式有松散的关系。让我们回顾一下之前遇到过的一个例子：\n\
  \n```javascript\nPromise.all([\n  // (A) 分叉 (fork)\n  downloadText('http://example.com/first.txt'),\n\
  \  downloadText('http://example.com/second.txt')\n])\n// (B) 合并 (join)\n.then(arr\
  \ => assert.deepEqual(arr, ['First!', 'Second!']));\n```\n\n* 分叉 (Fork)：在 A 行中，我们正在分叉两个异步计算并并发执行它们。\n\
  * 合并 (Join)：在 B 行中，一旦所有计算完成，我们将这些计算合并到一个单一的“线程”中。\n\n## 42.7 链式调用技巧\n\n本节提供了链式调用\
  \ `Promises` 的提示。\n\n### 42.7.1 链式错误：丢失尾部\n\n问题：\n\n```javascript\nfunction foo()\
  \ {\n  const promise = asyncFunc();\n  promise.then(result => {\n    // ···\n  });\n\
  }\n```\n\n计算是从 `asyncFunc()` 返回的 `Promise` 开始的。随后，通过 `.then()` 创建了另一个 `Promise`。`foo()`\
  \ 返回了前者，但应该返回后者。以下是修复方法：\n\n```javascript\nfunction foo() {\n  const promise = asyncFunc();\n\
  \  return promise.then(result => {\n    // ···\n  });\n}\n```\n\n### 42.7.2 链式错误：嵌套\n\
  \n问题：\n\n```javascript\nasyncFunc1()\n  .then(result1 => {\n    return asyncFunc2()\n\
  \      .then(result2 => { // (A)\n        // ···\n      });\n  });\n```\n\nA 行的\
  \ `.then()` 是嵌套的。扁坦结构会更好：\n\n```javascript\nasyncFunc1()\n  .then(result1 => {\n\
  \    return asyncFunc2();\n  })\n  .then(result2 => {\n    // ···\n  });\n```\n\n\
  ### 42.7.3 链式错误：不必要的嵌套\n\n这是另一个可以避免的嵌套示例：\n\n```javascript\nasyncFunc1()\n  .then(result1\
  \ => {\n    if (result1 < 0) {\n      return asyncFuncA()\n        .then(resultA\
  \ => 'Result: ' + resultA);\n    } else {\n      return asyncFuncB()\n        .then(resultB\
  \ => 'Result: ' + resultB);\n    }\n  });\n```\n\n我们可以再次获得扁坦的结构：\n\n```javascript\n\
  asyncFunc1()\n  .then(result1 => {\n    return result1 < 0 ? asyncFuncA() : asyncFuncB();\n\
  \  })\n  .then(resultAB => {\n    return 'Result: ' + resultAB;\n  });\n```\n\n\
  ### 42.7.4 并不是所有嵌套都是坏\n\n在以下代码中，我们实际上从嵌套中获益：\n\n```javascript\ndb.open()\n  .then(connection\
  \ => { // (A)\n    return connection.select({ name: 'Jane' })\n      .then(result\
  \ => { // (B)\n        // 处理结果\n        // 使用 `connection` 进行更多查询\n      })\n  \
  \    // ···\n      .finally(() => {\n        connection.close(); // (C)\n      });\n\
  \  })\n```\n\n我们在 A 行接收到一个异步结果。在 B 行中，我们通过嵌套以便在回调函数和 C 行中访问变量 `connection`。\n\n\
  ### 42.7.5 链式错误：创建了 Promise 而不是链式调用\n\n问题：\n\n\n\n\n\n```javascript\n// 不要这样做\n\
  class Model {\n  insertInto(db) {\n    return new Promise((resolve, reject) => {\
  \ // (A)\n      db.insert(this.fields)\n        .then(resultCode => {\n        \
  \  this.notifyObservers({event: 'created', model: this});\n          resolve(resultCode);\n\
  \        }).catch(err => {\n          reject(err);\n        })\n    });\n  }\n \
  \ // ...\n}\n```\n\n在第 `A` 行中，我们正在创建一个 `Promise` 来交付 `db.insert()` 的结果。这种写法是不必要的冗长，并且可以被简化：\n\
  \n```javascript\nclass Model {\n  insertInto(db) {\n    return db.insert(this.fields)\n\
  \      .then(resultCode => {\n        this.notifyObservers({event: 'created', model:\
  \ this});\n        return resultCode;\n      });\n  }\n  // ...\n}\n```\n\n核心思想是我们不需要创建一个\
  \ `Promise`；我们可以直接返回 `.then()` 调用产生的结果。另一个额外的好处是，我们不需要捕获并重新拒绝 `db.insert()` 的失败。我们只需将其将其拒绝状态传递给\
  \ `.insertInto()` 的调用者即可。\n\n## 42.8 快速参考：Promise 组合器函数\n\n除非另有说明，这些功能是在 ECMAScript\
  \ 6 中引入的（即 `Promises` 被添加到语言中的时期）。\n\n术语表：\n\n*   **短路 (Short-circuiting)**：在某些情况下，输出的\
  \ `Promise` 可以提前完成（在所有输入 `Promise` 完成之前）。后文将提供关于其工作原理的更多信息。\n\n### 42.8.1 `Promise.all()`\n\
  \n```typescript\nPromise.all<T>(promises: Iterable<Promise<T>>)\n  : Promise<Array<T>>\n\
  ```\n\n*   `P` 的**完成 (Fulfillment)**：如果所有输入的 `Promise` 都完成。\n    *   值：包含所有输入 `Promise`\
  \ 完成值的数组\n*   `P` 的**拒绝 (Rejection)**：如果其中一个输入的 `Promise` 被拒绝。\n    *   值：输入 `Promise`\
  \ 的拒绝值\n    *   短路：是\n    *   用例：处理 `Arrays`（拒绝会终止）\n\n### 42.8.2 `Promise.race()`\n\
  \n```typescript\nPromise.race<T>(promises: Iterable<Promise<T>>)\n  : Promise<T>\n\
  ```\n\n*   `P` 的**状态改变 (Settlement)**：如果第一个输入的 `Promise` 状态改变。\n    *   值：该输入 `Promise`\
  \ 的状态值\n    *   短路：是\n    *   用例：对多个 `Promises` 中的第一个状态改变做出反应\n\n### 42.8.3 `Promise.any()`\
  \ [ES2021]\n\n```typescript\nPromise.any<T>(promises: Iterable<Promise<T>>): Promise<T>\n\
  ```\n\n*   `P` 的**完成 (Fulfillment)**：如果有一个输入的 `Promise` 完成。\n    *   值：该输入 `Promise`\
  \ 的完成值\n*   `P` 的**拒绝 (Rejection)**：如果所有输入的 `Promise` 都被拒绝。\n    *   值：包含所有输入 `Promise`\
  \ 拒绝值的 `AggregateError`。\n    *   短路：是\n    *   用例：在多个异步计算中，我们只对第一个成功的感兴趣。也就是说，我们正在尝试几种方法，最快的方法应该获胜。\n\
  \n这是 `AggregateError` 的类型签名（省略了部分成员）：\n\n```javascript\nclass AggregateError {\n\
  \  constructor(errors: Iterable<any>, message: string);\n  get errors(): Array<any>;\n\
  \  get message(): string;\n}\n```\n\n### 42.8.4 `Promise.allSettled()` [ES2020]\n\
  \n```typescript\nPromise.allSettled<T>(promises: Iterable<Promise<T>>)\n  : Promise<Array<SettlementObject<T>>>\n\
  ```\n\n*   `P` 的**完成 (Fulfillment)**：如果所有输入的 `Promise` 都已状态改变。\n    *   值：包含每个输入\
  \ `Promise` 对应的 `settlement object` 的数组。`settlement object` 包含了类型和状态值。\n*   `P`\
  \ 的**拒绝 (Rejection)**：如果在遍历输入 `Promises` 时发生错误。\n    *   短路：否\n    *   用例：处理 `Arrays`（拒绝不会终止）\n\
  \n这是 `SettlementObject` 的类型签名：\n\n```typescript\ntype SettlementObject<T> = FulfillmentObject<T>\
  \ | RejectionObject;\ninterface FulfillmentObject<T> {\n  status: 'fulfilled';\n\
  \  value: T;\n}\ninterface RejectionObject {\n  status: 'rejected';\n  reason: unknown;\n\
  }\n```\n\n# 43 异步函数\n\n简单来说，*async functions*为使用 `Promises` 的代码提供了更好的语法。因此，为了使用异步函数，我们应该理解\
  \ `Promises`。它们在上一节中已经过。\n\n### 43.1 异步函数：基础\n\n*   43.1.1 `Async constructs`\n\n\
  ### 43.2 从异步函数中返回\n\n*   43.2.1 异步函数总是返回 `Promises`\n*   43.2.2 返回的 `Promises` 不会被包装\n\
  *   43.2.3 执行异步函数：同步开始，异步状态改变（高级）\n\n### 43.3 `await`：与 `Promises` 协作\n\n*   43.3.1 `await`\
  \ 与完成的 `Promises`\n*   43.3.2 `await` 与被拒绝的 `Promises`\n*   43.3.3 `await` 是浅层的（我们不能在回调函数中使用它）\n\
  \n### 43.4 （高级）\n\n### 43.5 立即调用的异步箭头函数\n\n### 43.6 并发与 `await`\n\n*   43.6.1 `await`：顺序执行异步函数\n\
  *   43.6.2 `await`：并发执行异步函数\n\n### 43.7 异步函数的提示\n\n*   43.7.1 如果我们“触发后就不不管”，则不需要\
  \ `await`\n*   43.7.2 `await` 并忽略结果有时是有意义的\n\n考虑以下异步函数：\n\n```javascript\nasync\
  \ function fetchJsonAsync(url) {\n  try {\n    const request = await fetch(url);\
  \ // async\n    const text = await request.text(); // async\n    return JSON.parse(text);\
  \ // sync\n  } catch (error) {\n    assert.fail(error);\n  }\n}\n```\n\n之前的看起来像同步的代码等同于直接使用\
  \ `Promises` 的以下代码：\n\n```javascript\nfunction fetchJsonPromises(url) {\n  return\
  \ fetch(url) // async\n    .then(request => request.text()) // async\n    .then(text\
  \ => JSON.parse(text)) // sync\n    .catch(error => {\n      assert.fail(error);\n\
  \    });\n}\n```\n\n\n\n\n\n- 任何抛出的异常都将用于拒绝 Promise。\n\n`fetchJsonAsync()` 和 `fetchJsonViaPromises()`\
  \ 的调用方式完全相同，如下：\n\n```\n[](#cb1218-1)fetchJsonAsync('http://example.com/person.json')\n\
  [](#cb1218-2).then(obj => {\n[](#cb1218-3)  assert.deepEqual(obj, {\n[](#cb1218-4)\
  \    first: 'Jane',\n[](#cb1218-5)    last: 'Doe',\n[](#cb1218-6)  });\n[](#cb1218-7)});\n\
  ```\n\n![](img/file5.svg) 异步函数与直接使用 Promise 的函数一样是基于 Promise\n\n**异步函数与直接使用 Promise\
  \ 的函数一样是基于 Promise 的**\n\n从外部来看，几乎无法区分 `async` 函数与返回 `Promise` 的函数之间的区别。\n\n###\
  \ 43.1.1 异步构造结构\n\nJavaScript 拥有以下同步可调用实体的异步版本。它们的角色总是真正的函数或方法。\n\n```\n[](#cb1219-1)//\
  \ 异步函数声明\n[](#cb1219-2)async function func1() {}\n[](#cb1219-4)// 异步函数表达式\n[](#cb1219-5)const\
  \ func2 = async function () {};\n[](#cb1219-7)// 异步箭头函数\n[](#cb1219-8)const func3\
  \ = async () => {};\n[](#cb1219-10)// 对象字面量中的异步方法定义\n[](#cb1219-11)const obj = {\
  \ async m() {} };\n[](#cb1219-13)// 类中的异步方法定义\n[](#cb1219-14)class MyClass { async\
  \ m() {} }\n```\n\n#### 异步函数 (Asynchronous functions) 与 async 函数 (async functions)\n\
  \n`asynchronous function` 和 `async function` 之间的区别虽然细微，但很重要：\n\n- `asynchronous\
  \ function`（异步函数）是指任何异步交付结果的函数——例如基于回调的函数或基于 `Promise` 的函数。\n- `async function`\
  \ 是通过特殊语法定义的，涉及 `async` 和 `await` 关键字。由于这些关键字，它也被称为 `async/await`。`async` 函数基于 `Promises`，因此它们也是异步函数（这听起来有点困惑）。\n\
  \n## 43.2 从异步函数中返回\n\n### 43.2.1 异步函数总是返回 Promise\n\n每个 `async` 函数总是返回一个 `Promise`。在\
  \ `async` 函数内部，我们通过 `return`（A 行）来完成结果：\n\n```\n[](#cb1220-1)async function asyncFunc()\
  \ {\n[](#cb1220-2)  return 123; // (A)\n}\n[](#cb1220-4)asyncFunc()\n[](#cb1220-5).then(result\
  \ => {\n[](#cb1220-7)  assert.equal(result, 123);\n});\n```\n\n和往常一样，如果我们没有显式地返回任何内容，系统会为我们返回\
  \ `undefined`：\n\n```\n[](#cb1221-1)async function asyncFunc() {\n}\n[](#cb1221-3)asyncFunc()\n\
  [](#cb1221-4).then(result => {\n[](#cb1221-6)  assert.equal(result, undefined);\n\
  });\n```\n\n我们通过 `throw`（A 行）来拒绝结果：\n\n```\n[](#cb1222-1)async function asyncFunc()\
  \ {\n[](#cb1222-2)  throw new Error('Problem!'); // (A)\n}\n[](#cb1222-4)asyncFunc()\n\
  [](#cb1222-5).catch(err => {\n[](#cb1222-7)  assert.deepEqual(err, new Error('Problem!'));\n\
  });\n```\n\n### 43.2.2 返回的 Promise 不会被包装\n\n如果从 `async` 函数中返回一个 `Promise` `p`，那么\
  \ `p` 将成为函数的结果（或者说，结果“锁定”在 `p` 上，并且行为与它完全相同）。也就是说，该 `Promise` 不会被包装在另一个 `Promise`\
  \ 中。\n\n```\n[](#cb1223-1)async function asyncFunc() {\n[](#cb1223-2)  return Promise.resolve('abc');\n\
  }\n[](#cb1223-4)asyncFunc()\n[](#cb1223-5).then(result => assert.equal(result, 'abc'));\n\
  ```\n\n记住，任何 `Promise` `q` 在以下情况下会被类似地处理：\n\n- `new Promise((resolve, reject) =>\
  \ { ... })` 内部的 `resolve(q)`\n- `.then(result => { ... })` 内部的 `return q`\n- `.catch(err\
  \ => { ... })` 内部的 `return q`\n\n### 43.2.3 执行异步函数：同步开始，异步结算（进阶）\n\n`async` 函数的执行方式如下：\n\
  \n- 当 `async` 函数启动时，会创建结果对应的 `Promise` `p`。\n- 然后执行函数体。执行有两种离开离开体的方式：\n    - 执行在结算\
  \ `p` 的同时**永久地**离开主体：\n        - `return` 完成 `p`。\n        - `throw` 拒绝 `p`。\n \
  \   - 执行也可以通过 `await` 等待另一个 `Promise` `q` 的结算时**临时地**离开主体。`async` 函数被暂停，执行离开它。一旦\
  \ `q` 结算，执行就会恢复。\n- 在执行第一次离开主体（无论是永久还是临时）后，会返回 `Promise` `p`。\n\n注意，结果 `p` 结算的通知是异步发生的，正如\
  \ `Promise` 一一情况如此。\n\n以下代码演示了 `async` 函数是同步启动的（A 行），然后当前任务完成（C 行），最后结果 `Promise`\
  \ 异步结算（B 行）。\n\n```\n[](#cb1224-1)async function asyncFunc() {\n[](#cb1224-2)  console.log('asyncFunc()\
  \ starts'); // (A)\n[](#cb1224-3)  return 'abc';\n}\n[](#cb1224-5)asyncFunc().\n\
  [](#cb1224-6)then(x => { // (B)\n[](#cb1224-7)  console.log(`Resolved: ${x}`);\n\
  });\n[](#cb1224-9)console.log('Task finished'); // (C)\n```\n\n## 43.3 `await`：与\
  \ Promise 操作\n\n`await` 运算符只能在 `async` 函数内部使用；它决定了 `Promise` 的处理方式：\n\n- 当 `async`\
  \ 函数启动时，会创建结果对应的 `Promise` `p`。\n- 然后执行函数体。执行有两种离开主体的方式：\n    - 执行在结算 `p` 的同时**永久地**离开主体：\n\
  \        - `return` 完成 `p`。\n        - `throw` 拒绝 `p`。\n    - 执行也可以通过 `await` 等待另一个\
  \ `Promise` `q` 的结算时**临时地**离开主体。`async` 函数被暂停，执行离开它。一旦 `q` 结算，执行就会恢复。\n- 在执行第一次离开主体（无论是永久还是临时）后，会返回\
  \ `Promise` `p`。\n\n### 43.3.1 `await` 与已完成的 Promise\n\n如果其操作数是一个已完成的 `Promise`，`await`\
  \ 将返回其完成值：\n\n```javascript\n[](#cb1225-1)assert.equal(await Promise.resolve('yes'),\
  \ 'yes!');\n```\n\n也允许非 Promise 值，它们会直接被传递（同步地）：\n\n```javascript\n[](#cb1226-1)assert.equal(await\
  \ 'yes!', 'yes!');\n```\n\n### 43.3.2 `await` 与被拒绝的 Promise\n\n如果其操作数是一个被被拒绝的 `Promise`，`await`\
  \ 将抛出拒绝值：\n\n```javascript\n[](#cb1227-1)try {\n[](#cb1227-2)  await Promise.reject(new\
  \ Error());\n[](#cb1227-3)  assert.fail(); // 我们永远进不到这里\n} catch (e) {\n[](#cb1227-5)\
  \  assert.equal(e instanceof Error, true);\n}\n```\n\n![](img/file6.svg) 练习：通过异步函数\
  \ Fetch API\n\n`exercises/async-functions/fetch_json_test.mjs`\n\n### 43.3.3 `await`\
  \ 是浅层的（我们无法在回调中使用它）\n\n如果我们在 `async` 函数内部并想通过 `await` 暂停它，我们必须在该函数内部这样做；我们无法在嵌套函数（如回调）内部使用。也就是说，暂停是浅层的。\n\
  \n例如，以下代码无法执行：\n\n```javascript\n[](#cb1228-1)async function downloadContent(urls)\
  \ {\n[](#cb1228-2)  return urls.map((url) => {\n[](#cb1228-3)    return await httpGet(url);\
  \ // 语法错误！\n[](#cb1228-4)  });\n}\n```\n\n原因是普通箭头函数体内部不允许 `await`。\n\n好，让我们试试异步箭头函数：\n\
  \n```javascript\n[](#cb1229-1)async function downloadContent(urls) {\n[](#cb1229-2)\
  \  return urls.map(async (url) => {\n[](#cb1229-3)    return await httpGet(url);\n\
  \  });\n}\n```\n\n遗憾，这样也不行：`.map()`（因此 `downloadContent()`）返回的是一个包含 Promise 的数组，而不是包含（未拆包）值的数组。\n\
  \n\n\n\n一种可能的解决方案是使用 `Promise.all()` 来解开所有的 Promises：\n\n```javascript\nasync function\
  \ downloadContent(urls) {\n  const promiseArray = urls.map(async (url) => {\n  \
  \  return await httpGet(url); // (A)\n  });\n  return await Promise.all(promiseArray);\n\
  }\n```\n\n这段代码可以改进吗？可以的：在行 A 中，我们通过 `await` 解开了一个 Promise，但紧接着又通过 `return` 将其重新封装。如果我们省略\
  \ `await`，我们甚至不需要使用 async 箭头函数：\n\n```javascript\nasync function downloadContent(urls)\
  \ {\n  const promiseArray = urls.map(\n    url => httpGet(url));\n  return await\
  \ Promise.all(promiseArray); // (B)\n}\n```\n\n出于同样的原因，我们也可以在行 B 中省略 `await`。\n\n\
  ![](img/file6.svg) **练习：异步映射和过滤**\n\n`exercises/async-functions/map_async_test.mjs`\n\
  \n## 43.4 （进阶）\n\n剩余的所有章节均为高级内容。\n\n## 43.5 立即调用的异步箭头函数\n\n如果我们在异步函数之外需要 `await`，可以立即调用一个异步箭头函数：\n\
  \n```javascript\n(async () => { // 开始\n  const promise = Promise.resolve('abc');\n\
  \  const value = await promise;\n  assert.equal(value, 'abc');\n})(); // 结束\n```\n\
  \n立即调用的异步箭头函数的结果是一个 Promise：\n\n```javascript\nconst promise = (async () => 123)();\n\
  promise.then(x => assert.equal(x, 123));\n```\n\n立即调用的异步箭头函数用场景是在模块的顶层使用 `await`（例如通过\
  \ `fetch()` 下载数据）。\n\n## 43.6 并发与 `await`\n\n在接下来的两个子节中，我们将使用辅助函数 `paused()`：\n\n\
  ```javascript\n/**\n * 在 `ms` 毫秒后解析\n */\nfunction delay(ms) {\n  return new Promise((resolve,\
  \ _reject) => {\n    setTimeout(resolve, ms);\n  });\n}\nasync function paused(id)\
  \ {\n  console.log('START ' + id);\n  await delay(10); // 暂停\n  console.log('END\
  \ ' + id);\n  return id;\n}\n```\n\n### 43.6.1 `await`：顺序执行异步函数\n\n如果我们在多个异步函数的调用前加上\
  \ `await`，那么这些函数将按顺序执行：\n\n```javascript\nasync function sequentialAwait() {\n \
  \ const result1 = await paused('first');\n  assert.equal(result1, 'first');\n  \n\
  \  const result2 = await paused('second');\n  assert.equal(result2, 'second');\n\
  }\n\n// 输出：\n// 'START first'\n// 'END first'\n// 'START second'\n// 'END second'\n\
  ```\n\n也就是说，`paused('second')` 只在 `paused('first')` 完全完成后后才会开始。\n\n### 43.6.2 `await`：并发执行异步函数\n\
  \n如果我们想并发运行多个函数，可以使用工具方法 `Promise.all()`：\n\n```javascript\nasync function concurrentPromiseAll()\
  \ {\n  const result = await Promise.all([\n    paused('first'), paused('second')\n\
  \  ]);\n  assert.deepEqual(result, ['first', 'second']);\n}\n// 输出：\n// 'START first'\n\
  // 'START second'\n// 'END first'\n// 'END second'\n```\n\n在这里，两个异步函数是同时启动的。一旦两者都稳定，`await`\
  \ 会给我们返回一个结果数组，或者如果其中一个 Promise 被拒绝，则抛出一个异常。回顾 42.6 “并发提示：关注开始”，重要的是我们何时开始一个基于 Promise\
  \ 的计算；而不是我们如何处理它的结果。因此，以下代码与上一个代码一样是“并发”的：\n\n```javascript\nasync function concurrentAwait()\
  \ {\n  const resultPromise1 = paused('first');\n  const resultPromise2 = paused('second');\n\
  \  assert.equal(await resultPromise1, 'first');\n  assert.equal(await resultPromise2,\
  \ 'second');\n}\n// 输出：\n// 'START first'\n// 'START second'\n// 'END first'\n//\
  \ 'END second'\n```\n\n## 43.7 使用异步函数的技巧\n\n### 43.7.1 如果“只发不收”，我们就不需要 `await`\n\
  \n在处理基于 Promise 的函数时，不需要 `await`；只有当我们想要暂停并等待返回的 Promise 稳定时才需要它。如果我们只想启动一个异步操作，那么就不需要：\n\
  \n```javascript\nasync function asyncFunc() {\n  const writer = openFile('someFile.txt');\n\
  \  writer.write('hello'); // 不等待\n  writer.write('world'); // 不等待\n  await writer.close();\
  \ // 等待文件关闭\n}\n```\n\n在这段代码中，我们没有 `await` `.write()`，因为我们不在乎它何时完成。然而，我们希望等待直到 `.close()`\
  \ 完成。\n\n注意：每次调用 `.write()` 都是同步启动的。这防止了竞态条件。\n\n### 43.7.2 使用 `await` 并忽略结果是有意义的\n\
  \n有时使用 `await` 即使忽略它的结果也是有意义的，例如：\n\n```javascript\nawait longRunningAsyncOperation();\n\
  console.log('Done!');\n```\n\n在这里，我们使用 `await` 来等待一个长时间运行的异步操作。这确保了日志记录是在该操作完成*之后*真正发生的。\n\
  \n## 44 异步迭代\n\n### 44.1 基础异步迭代\n\n#### 44.1.1 协议：异步迭代\n\n#### 44.1.2 直接使用异步迭代\n\
  \n#### 44.1.3 通过 `for-await-of` 使用异步迭代\n\n### 44.2 异步生成器\n\n#### 44.2.1 示例：通过异步生成器创建异步迭代器\n\
  \n#### 44.2.2 示例：将同步迭代器转换为异步迭代器\n\n#### 44.2.3 示例：将异步迭代器转换为数组\n\n#### 44.2.4 示例：转换异步迭代器\n\
  \n#### 44.2.5 示例：对异步迭代器进行映射\n\n### 44.3 对 Node.js 流进行异步迭代\n\n### 44.3.1 Node.js\
  \ 流：通过回调 (push) 异步化\n\n### 44.3.2 Node.js 流：通过异步迭代 (pull) 异步化\n\n### 44.3.3 示例：从块到行\n\
  \n* * *\n\n![](img/file0.svg) **必要知识**\n\n对于本章，你应该熟悉：\n\n*   [Promises]\n\n*   [异步函数]\n\
  \n\n\n\n\n```javascript\ninterface Iterable<T> {\n  [Symbol.iterator]() : Iterator<T>;\n\
  }\ninterface Iterator<T> {\n  next() : IteratorResult<T>;\n}\ninterface IteratorResult<T>\
  \ {\n  value: T;\n  done: boolean;\n}\n```\n\n* `Iterable` 是一种可以通过迭代访问其内容的数据结构。它是迭代器的工厂。\n\
  * `Iterator` 是迭代结果的工厂，我们通过调用 `.next()` 方法来获取结果。\n* 每一个 `IterationResult` 包含被迭代的\
  \ `.value` 和一个布尔值 `.done`，后者在最后一个元素之后为 `true`，在此之前为 `false`。\n\n对于异步迭代协议，我们只想改变一点：由\
  \ `.next()` 产生的值应该是异步交付的。有两种可以想象的方案：\n\n* `.value` 可以包含一个 `Promise<T>`。\n* `.next()`\
  \ 可以返回 `Promise<IteratorResult<T>>`。\n\n换句话说，问题在于是将仅仅值还是将整个迭代器结果包装在 Promise 中。\n\
  \n必须是后者，因为当 `.next()` 返回结果时，它开始了一个异步计算。该计算是否产生值或信号迭代的结束，只有在它完成后才能确定。因此，`.done` 和\
  \ `.value` 都需要被包装在 Promise 中。\n\n异步迭代的接口如下。\n\n```javascript\ninterface AsyncIterable<T>\
  \ {\n  [Symbol.asyncIterator]() : AsyncIterator<T>;\n}\ninterface AsyncIterator<T>\
  \ {\n  next() : Promise<IteratorResult<T>>; // (A)\n}\ninterface IteratorResult<T>\
  \ {\n  value: T;\n  done: boolean;\n}\n```\n\n与同步接口的唯一区别是 `.next()` 的返回类型（A 行）。\n\
  \n### 44.1.2 直接使用异步迭代\n\n以下代码直接使用了异步迭代协议：\n\n```javascript\nconst asyncIterable\
  \ = syncToAsyncIterable(['a', 'b']); // (A)\nconst asyncIterator = asyncIterable[Symbol.asyncIterator]();\n\
  \n// 调用 .next() 直到 .done 为 true：\nasyncIterator.next() // (B)\n.then(iteratorResult\
  \ => {\n  assert.deepEqual(\n    iteratorResult,\n    { value: 'a', done: false\
  \ });\n  return asyncIterator.next(); // (C)\n})\n.then(iteratorResult => {\n  assert.deepEqual(\n\
  \    iteratorResult,\n    { value: 'b', done: false });\n  return asyncIterator.next();\
  \ // (D)\n})\n.then(iteratorResult => {\n  assert.deepEqual(\n    iteratorResult,\n\
  \     { value: undefined, done: true });\n});\n```\n\n在 A 行中，我们针对值 `'a'` 和 `'b'`\
  \ 创建了一个异步可迭代器。我们将看到一个 `'a'` 和 `'b'` 之上的异步可迭代器。我们将调用 `.next()` 直到 `.done` 为真：\n\n\
  我们可以简化这段代码，使用 `await` 来处理异步迭代。在 B 行中，我们调用 `.next()`，在 C 行和 D 行中，我们使用了异步迭代的逻辑。使用\
  \ `await` 来处理异步迭代：\n\n```javascript\nconst asyncIterable = syncToAsyncIterable(['a',\
  \ 'b']);\nconst asyncIterator = asyncIterable[Symbol.asyncIterator]();\n\n// 调用\
  \ .next() 直到 .done 为 true：\nconst result1 = await asyncIterator.next();\nassert.deepEqual(result1,\
  \ { value: 'a', done: false });\n\nconst result2 = await asyncIterator.next();\n\
  assert.deepEqual(result2, { value: 'b', done: false });\n\nconst result3 = await\
  \ asyncIterator.next();\nassert.deepEqual(result3, { value: undefined, done: true\
  \ });\n```\n\n\n\n\n\n以下异步生成器将同步可迭代转换为转换为异步可迭代。它实现了我们之前过的函数 `syncToAsyncIterable()`。\n\
  \n```javascript\nasync function* syncToAsyncIterable(syncIterable) {\n  for (const\
  \ elem of syncIterable) {\n    yield elem;\n  }\n}\n```\n\n注意：在此情况下，输入是同步的（不需要 `await`）。\n\
  \n### 44.2.3 示例：将异步可迭代转换为数组 (Array)\n\n以下函数是之前练习的解决方案。它将异步可迭代转换为一个 `Array`（类似于扩展操作，但针对的是异步可迭代而非同步可迭代）。\n\
  \n```javascript\nasync function asyncIterableToArray(asyncIterable) {\n  const result\
  \ = [];\n  for await (const value of asyncIterable) {\n    result.push(value);\n\
  \  }\n  return result;\n}\n```\n\n注意，在这种情况下我们无法使用异步生成器：我们通过 `for-await-of` 获取输入，并返回一个封装在\
  \ `Promise` 中的 `Array`。后者的要求排除了异步生成器的使用。\n\n这是对 `asyncIterableToArray()` 的测试：\n\n\
  ```javascript\nasync function* createAsyncIterable() {\n  yield 'a';\n  yield 'b';\n\
  }\nconst asyncIterable = createAsyncIterable();\nassert.deepEqual(\n  await asyncIterableToArray(asyncIterable),\
  \ // (A)\n  ['a', 'b']\n);\n```\n\n注意 A 行中的 `await`，它是为了解包 `asyncIterableToArray()`\
  \ 返回的 `Promise`。为了让 `await` 起作用，这段代码必须在异步函数内部运行。\n\n### 44.2.4 示例：转换异步可迭代\n\n让我们实现一个异步生成器，通过转换现有的异步可迭代来产生一个新的异步可迭代。\n\
  \n```javascript\nasync function* timesTwo(asyncNumbers) {\n  for await (const x\
  \ of asyncNumbers) {\n    yield x * 2;\n  }\n}\n```\n\n为了测试此函数，我们使用了上一节中的 `asyncIterableToArray()`。\n\
  \n```javascript\nasync function* createAsyncIterable() {\n  for (let i=1; i<=3;\
  \ i++) {\n    yield i;\n  }\n}\nassert.deepEqual(\n  await asyncIterableToArray(timesTwo(createAsyncIterable())),\n\
  \  [2, 4, 6]\n);\n```\n\n![](img/file6.svg) **练习：异步生成器**\n\n警告：我们很快就会在本章看到此练习的解答。\n\
  \n- `exercises/async-iteration/number_lines_test.mjs`\n\n### 44.2.5 示例：在异步可迭代上进行映射\
  \ (map)\n\n复习一下，对同步可迭代进行映射的方法：\n\n```javascript\nfunction* mapSync(iterable, func)\
  \ {\n  let index = 0;\n  for (const x of iterable) {\n    yield func(x, index);\n\
  \    index++;\n  }\n}\nconst syncIterable = mapSync(['a', 'b', 'c'], s => s.repeat(3));\n\
  assert.deepEqual(\n  [...syncIterable],\n  ['aaa', 'bbb', 'ccc']\n);\n```\n\n异步版本如下：\n\
  \n```javascript\nasync function* mapAsync(asyncIterable, func) { // (A)\n  let index\
  \ = 0;\n  for await (const x of asyncIterable) { // (B)\n    yield func(x, index);\n\
  \    index++;\n  }\n}\n```\n\n注意同步实现和异步实现是多么相似。唯一的两个差异是 A 行的 `async` 和 B 行的 `await`。这好比从同步函数转变为异步函数——我们只需要添加关键字\
  \ `async` 和偶尔的 `await`。\n\n为了测试 `mapAsync()`，我们使用了辅助函数 `asyncIterableToArray()`\
  \ (在本章稍早之前显示过）：\n\n```javascript\nasync function* createAsyncIterable() {\n  yield\
  \ 'a';\n  yield 'b';\n}\nconst mapped = mapAsync(\n  createAsyncIterable(), s =>\
  \ s.repeat(3));\nassert.deepEqual(\n  await asyncIterableToArray(mapped), // (A)\n\
  \  ['aaa', 'bbb']\n);\n```\n\n再次，我们使用 `await` 来解包 `Promise`（A 行），这段代码必须在异步函数内部运行。\n\
  \n![](img/file6.svg) **练习：`filterAsyncIter()`**\n\n`exercises/async-iteration/filter_async_iter_test.mjs`\n\
  \n## 44.3 对 Node.js 流的异步迭代\n\n### 44.3.1 Node.js 流：通过回调 (push) 实现异步\n\n传统上，从 Node.js\
  \ 流中异步读取数据是通过回调完成的：\n\n```javascript\nfunction main(inputFilePath) {\n  const readStream\
  \ = fs.createReadStream(inputFilePath,\n    { encoding: 'utf8', highWaterMark: 1024\
  \ });\n  readStream.on('data', (chunk) => {\n    console.log('>>> '+chunk);\n  });\n\
  \  readStream.on('end', () => {\n    console.log('### DONE ###');\n  });\n}\n```\n\
  \n也就是说，由流来控制并向读者推送数据。\n\n### 44.3.2 Node.js 流：通过异步迭代 (pull) 实现异步\n\n从 Node.js 10\
  \ 开始，我们也可以使用异步迭代从流中读取数据：\n\n```javascript\nasync function main(inputFilePath) {\n\
  \  const readStream = fs.createReadStream(inputFilePath,\n    { encoding: 'utf8',\
  \ highWaterMark: 1024 });\n  for await (const chunk of readStream) {\n    console.log('>>>\
  \ '+chunk);\n  }\n  console.log('### DONE ###');\n}\n```\n\n这一次，由读者控制并从流中拉取数据。\n\
  \n### 44.3.3 示例：从块 (chunks) 到行 (lines)\n\nNode.js 流迭代的是数据的*块*（任意长度的片段）。以下异步生成器将基于块的异步可迭代转换为行的异步可迭代：\n\
  \n```javascript\n/**\n * 参数：块的异步可迭代（字符串）\n * 结果：行的异步可迭代（包含换行符）\n */\nasync function*\
  \ chunksToLines(chunksAsync) {\n  let previous = '';\n  for await (const chunk of\
  \ chunksAsync) { // 输入\n    previous += chunk;\n    let eolIndex;\n    while ((eolIndex\
  \ = previous.indexOf('\\n')) >= 0) {\n      // 行包含换行符（Windows 的 '\\r\\n' 或 Unix\
  \ 的 '\\n'）\n      const line = previous.slice(0, eolIndex+1);\n      yield line;\
  \ // 输出\n      previous = previous.slice(eolIndex+1);\n    }\n  }\n  if (previous.length\
  \ > 0) {\n    yield previous;\n  }\n}\n```\n\n让我们将 `chunksToLines()` 应用于块异步可迭代（由\
  \ `chunkIterable()` 产生）：\n\n```javascript\nasync function* chunkIterable() {\n \
  \ yield 'First\\nSec';\n  yield 'ond\\nThird\\nF';\n  yield 'ourth';\n}\nconst linesIterable\
  \ = chunksToLines(chunkIterable());\nassert.deepEqual(\n  await asyncIterableToArray(linesIterable),\n\
  \  [\n    'First\\n',\n    'Second\\n',\n    'Third\\n',\n    'Fourth',\n  ]\n);\n\
  ```\n\n\n\n\n\n```javascript\nasync function* numberLines(linesAsync) {\n  let lineNumber\
  \ = 1;\n  for await (const line of linesAsync) {\n    yield lineNumber + ': ' +\
  \ line;\n    lineNumber++;\n  }\n}\nconst numberedLines = numberLines(chunksToLines(chunkIterable()));\n\
  assert.deepEqual(\n  await asyncIterableToArray(numberedLines),\n  [\n    '1: First\\\
  n',\n    '2: Second\\n',\n    '3: Third\\n',\n    '4: Fourth',\n  ]);\n```\n\n#\
