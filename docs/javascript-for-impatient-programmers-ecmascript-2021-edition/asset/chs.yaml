  \n* * *\n\n本章介绍了 JavaScript 如何处理异常。\n\n**为什么 JavaScript 不经常抛出异常？**\n\nJavaScript\
  \ 直到 ES3 才支持异常。这解释了为什么该语言及其标准库对异常的使用非常谨慎。\n\n\n\n\n\n```javascript\nfunction readProfiles(filePaths)\
  \ {\n  const profiles = [];\n  for (const filePath of filePaths) {\n    try {\n\
  \      const profile = readOneProfile(filePath);\n      profiles.push(profile);\n\
  \    } catch (err) { // (A)\n      console.log('Error in: '+filePath, err);\n  \
  \  }\n  }\n}\nfunction readOneProfile(filePath) {\n  const profile = new Profile();\n\
  \  const file = openFile(filePath);\n  // ··· (Read the data in `file` into `profile`)\n\
  \  return profile;\n}\nfunction openFile(filePath) {\n  if (!fs.existsSync(filePath))\
  \ {\n    throw new Error('Could not find file '+filePath); // (B)\n  }\n  // ···\
  \ (Open the file whose path is `filePath`)\n}\n```\n\n让我们看看 B 行发生了了什么：发生了一个错误，但处理该问题的最佳位置不是当前位置，而是\
  \ A 行。在那里，我们可以跳过当前文件并继续处理下一个。\n\n因此：\n\n- 在 B 行中，我们使用 `throw` 语句来指示发生了问题。\n- 在 A\
  \ 行中，我们使用 `try-catch` 语句来处理该问题。\n\n当我们执行 `throw` 时，以下结构处于激活状态：\n\n```\nreadProfiles(···)\n\
  \  for (const filePath of filePaths)\n    try\n      readOneProfile(···)\n     \
  \   openFile(···)\n          if (!fs.existsSync(filePath))\n            throw\n\
  ```\n\n`throw` 会逐个退出嵌套结构，直到遇到 `try` 语句。执行将在该 `try` 语句的 `catch` 子句中继续。\n\n## 26.2\
  \ `throw`\n\n这是 `throw` 语句的语法：\n\n```javascript\nthrow «value»;\n```\n\n任何值都可以被抛出，但最好抛出\
  \ `Error` 实例或其子类的实例。\n\n```javascript\nthrow new Error('Problem!');\n```\n\n###\
  \ 26.2.1 创建错误对象的选项\n\n- 使用类 `Error`。在 JavaScript 中，这比在更静态的语言中限制少，因为我们可以在实例上添加自己的属性：\n\
  \n  ```javascript\n  const err = new Error('Could not find the file');\n  err.filePath\
  \ = filePath;\n  throw err;\n  ```\n\n- 使用 JavaScript 的 `Error` 子类之一（这些在后文列出）。\n\
  \n- `Error` 子类化：\n\n  ```javascript\n  class MyError extends Error {\n}\n  function\
  \ func() {\n    throw new MyError('Problem!');\n  }\n  assert.throws(\n    () =>\
  \ func(),\n    MyError);\n  ```\n\n## 26.3 `try` 语句\n\n`try` 语句的最完整版本如下：\n\n```javascript\n\
  try {\n  «try_statements»\n} catch (error) {\n  «catch_statements»\n} finally {\n\
  \  «finally_statements»\n}\n```\n\n我们可以如下组合这些子句：\n\n- `try-catch`\n- `try-finally`\n\
  - `try-catch-finally`\n\n### 26.3.1 `try` 块\n\n`try` 块可以被视为语句的主体。这是执行常规代码的地方。\n\n\
  ### 26.3.2 `catch` 子句\n\n如果异常到达 `try` 块，它将被赋值给 `catch` 子句的参数，并执行该子句中的代码。接下来，执行将在\
  \ `try` 语句后正常继续。如果发生以下情况，可能会改变：\n\n- 在 `catch` 块内部存在 `return`、`break` 或 `throw`。\n\
  - 存在 `finally` 子句（它在 `try` 语句结束之前总是执行）。\n\n下面的代码演示了 A 行抛出的值确实在 B 行被捕获。\n\n```javascript\n\
  const errorObject = new Error();\nfunction func() {\n  throw errorObject; // (A)\n\
  }\n\ntry {\n  func();\n} catch (err) { // (B)\n  assert.equal(err, errorObject);\n\
  }\n```\n\n#### 26.3.2.1 省略 `catch` 绑定\n\n从 ECMAScript 2019 开始，如果我们对抛出的值感兴趣，可以省略\
  \ `catch` 参数：\n\n```javascript\ntry {\n  // ···\n} catch {\n  // ···\n}\n```\n\n\
  这偶尔可能有用用。例如，Node.js 提供了 [`assert.throws`](https://nodejs.org/api/assert.html#assert_throws_fn)\
  \ 来检查是否抛出了错误。它可以这样实现：\n\n```javascript\nfunction throws(func) {\n  try {\n    func();\n\
  \  } catch {\n    throw new Error('didn’t throw!');\n  }\n}\n```\n\n然而，一个更完整的 `throw`\
  \ 实现会有一个 `catch`，例如检查它的类型。\n\n### 26.3.3 `finally` 子句\n\n`finally` 子句在 `try` 语句结束时总是执行，无论\
  \ `try` 块或 `catch` 子句发生了什么。让我们看看 `finally` 的一个常见用例：我们创建了一个资源并在完成后销毁它。\n\n```javascript\n\
  const resource = create();\ntry {\n  // ...\n} finally {\n  resource.destroy();\n\
  }\n```\n\n#### 26.3.3.1 `finally` 总是执行\n\n即使：\n\n```javascript\nlet finallyExecuted\
  \ = false;\nassert.throws(\n  () => {\n    try {\n      throw new Error(); // (A)\n\
  \    } finally {\n      finallyExecuted = true;\n    }\n  },\n  Error\n);\nassert.equal(finallyExecuted,\
  \ true);\n```\n\n即使存在 `return` 语句（A 行）：\n\n```javascript\nlet finallyExecuted =\
  \ false;\nfunction func() {\n  try {\n    return; // A\n  } finally {\n    finallyExecuted\
  \ = true;\n  }\n}\nfunc();\nassert.equal(finallyExecuted, true);\n```\n\n## 26.4\
  \ 错误类\n\n`Error` 是所有内置错误类的父类。它具有以下子类（我引用了[ECMAScript 规范](https://tc39.github.io/ecma262/#sec-native-error-types-used-in-standard)）：\n\
  \n- `RangeError`：表示值不在允许范围内。\n- `ReferenceError`：指示检测到无效引用值。\n- `SyntaxError`：指示发生了解析错误。\n\
  - `TypeError`：用于指示操作失败，当没有其他 *NativeError* 对象能指示失败原因时。\n- `URIError`：指示其中一个全局 URI\
  \ 处理函数以与其定义不兼容的方式使用。\n\n### 26.4.1 错误对象的属性\n\n考虑 `err`，一个 `Error` 实例：\n\n```javascript\n\
  const err = new Error('Hello!');\nassert.equal(String(err), 'Error: Hello!');\n\
  ```\n\n`err` 的两个属性特别有用：\n\n- `.message`：仅包含错误消息。\n\n  ```javascript\n  assert.equal(err.message,\
  \ 'Hello!');\n  ```\n\n- `.stack`：包含堆栈跟踪。所有主流浏览器都支持。\n\n  ```javascript\n  assert.equal(\n\
  \    err.stack,\n    `Error: Hello!\n    at file://ch_exception-handling.mjs:1:13`\n\
  \  `.trim());\n  ```\n\n\n\n\n\n# 27 可调用值\n\n## 27.1 函数的种类\n\nJavaScript 有两类函数：\n\
  \n*   普通函数可以承担多种角色：\n    *   普通函数\n    *   方法\n    *   构造函数\n*   特殊化函数只能承担其中一种角色——例如：\n\
  \    *   箭头函数只能是普通函数。\n    *   方法只能是方法。\n    *   类（class）只能是构造函数。\n\n特殊化函数是在 ECMAScript\
  \ 6 中被引入语言的。继续阅读以了解这些所有内容的具体含义。\n\n## 27.2 普通函数\n\n以下代码展示了实现（大致）相同内容的两种方式：创建一个普通函数。\n\
  \n```\n[](#cb534-1)// 函数声明（一条语句）\n[](#cb534-2)function ordinary1(a, b, c) {\n[](#cb534-3)\
  \  // ···\n[](#cb534-4)}\n[](#cb534-5)\n[](#cb534-6)// const 匿名（无名）函数表达式\n[](#cb534-7)const\
  \ plus = function (a, b, c) {\n[](#cb534-8)  return a + b + c;\n[](#cb534-9)}\n\
  ```\n\n在本章中，我们将研究可以被调用的 JavaScript 值：函数、方法和类。\n\n### 27.2.1 具名函数表达式（进阶）\n\n到目前为止，我们只见过匿名函数表达式——它们没有名称：\n\
  \n```\n[](#cb535-1)const funcExpr = function (a, b) {\n[](#cb535-2)  // ···\n[](#cb535-3)}\n\
  ```\n但也有具名函数表达式：\n\n```\n[](#cb536-1)const funcExpr = function myName(a, b) {\n\
  [](#cb536-2)  // ···\n[](#cb536-3)}\n```\n`myName` 仅在函数内部可访问。该函数可以独立于它被赋值的变量来引用自身（用于递归）：\n\
  \n```\n[](#cb537-1)const funcExpr = function myName() {\n[](#cb537-2)  if (condition)\
  \ {\n[](#cb537-3)    return myName();\n[](#cb537-4)  }\n[](#cb537-5)}\n```\n即使它们被赋值给变量，它们也有名称：\n\
  \n```\n[](#cb538-1)const funcExpr = function func() {\n[](#cb538-2)  // ···\n[](#cb538-3)}\n\
  ```\n注意，函数声明总是带有名称：\n\n```\n[](#cb539-1)function funcDecl() {\n[](#cb539-2)  //\
  \ ···\n[](#cb539-3)}\n```\n函数拥有名称的一个益处是，名称会在堆栈追踪（stack traces）中显示。\n\n### 27.2.2\
  \ 术语：函数定义和函数表达式\n\n*函数定义*（function definition）是创建函数的语法：\n\n*   函数声明（一条语句）\n*   函数表达式\n\
  \n函数声明产生普通函数。函数表达式产生普通函数或特殊化函数：\n\n*   普通函数（我们已经遇到过的）\n*   特殊化函数（我们稍后会查看）：箭头函数（它们总是表达式）\n\
  \n虽然函数声明在 JavaScript 中仍然流行，但函数表达式几乎总是箭头函数。\n\n### 27.2.3 函数声明的组成部分\n\n让我们通过以下示例检查函数声明的各个。大部分术语也适用于函数表达式。\n\
  \n```\n[](#cb540-1)function add(x, y) {\n[](#cb540-2)  return x + y;\n[](#cb540-3)}\n\
  ```\n\n*   `add` 是函数声明的*名称*（name）。\n*   `add(x, y)` 是函数声明的*头部*（head）。\n*   `x` 和\
  \ `y` 是*参数*（parameters）。\n*   花括号（`{` 和 `}`）及其之间的所有内容是函数声明的*体*（body）。\n*   `return`\
  \ 语句显式地从函数返回一个值。\n\n#### 27.2.3.1 参数列表中的尾逗号\n\nJavaScript 一直允许并忽略数组字面量（Array literals）中的尾逗号。自\
  \ ES5 起，它们在对象字面量中也是允许的。自 ES2017 起，我们可以在参数列表（声明和调用）中添加尾逗号：\n\n```\n[](#cb541-1)//\
  \ 声明\n[](#cb541-2)function retrieveData(\n[](#cb541-3)  contentText,\n[](#cb541-4)\
  \  keyword,\n[](#cb541-5)  {unique, ignoreCase, pageSize}, // 尾逗号\n[](#cb541-6))\
  \ {\n[](#cb541-7)  // ···\n[](#cb541-8)}\n\n// 调用\n[](#cb541-10)retrieveData(\n\
  [](#cb541-11)  '',\n[](#cb541-12)  null,\n[](#cb541-13)  {ignoreCase: true, pageSize:\
  \ 10}, // 尾逗号\n[](#cb541-14));\n```\n\n### 27.2.4 普通函数承担的角色\n\n考虑上一节中的函数声明：\n\n\
  ```\n[](#cb542-1)function add(x, y) {\n[](#cb542-2)  return x + y;\n[](#cb542-3)}\n\
  ```\n\n\n\n\n\n此函数声明创建了一个名为 `add` 的普通函数。作为一个普通函数，`add()` 可以承担三种角色：\n\n*   普通函数（Real\
  \ function）：通过函数调用执行。\n\n    ```\n    [](#cb543-1)assert.equal(add(2, 1), 3);\n\
  \    ```\n\n*   方法（Method）：存储在属性中，通过方法调用执行。\n\n    ```\n    [](#cb544-1)const obj\
  \ = { addAsMethod: add };\n    [](#cb544-2)assert.equal(obj.addAsMethod(2, 4), 6);\
  \ // (A)\n    ```\n\n    在 A 行中，`obj` 是方法调用的*接收者*（receiver）。\n\n*   构造函数（Constructor\
  \ function）：通过 `new` 执行。\n\n    ```\n    [](#cb545-1)const inst = new add();\n \
  \   [](#cb545-2)assert.equal(inst instanceof add, true);\n    ```\n\n    顺带一提，构造函数（包括类）的名称通常以大写字母开头。\n\
  \n### 27.2.5 术语：实体 vs 语法 vs. 角色（高级）\n\n`syntax`（语法）、`entity`（实体）和 `role`（角色）概念之间的区别非常微妙，通常并不重要。但我想提高你对这些的敏锐度：\n\
  \n*   `entity`（实体）是“存在”于内存中的 JavaScript 特性。普通函数就是一个实体。\n\n    *   实体包括：普通函数、箭头函数、方法和类。\n\
  \n*   `syntax`（语法）是我们用来创建实体的代码。函数声明和匿名函数表达式都是 `syntax`。它们都创建了被称为普通函数的实体。\n\n   \
  \ *   `syntax` 包括：函数声明和匿名函数表达式。产生箭头函数的 `syntax` 也称为 `arrow functions`。方法和类也是如此。\n\
  \n*   `role`（角色）描述了我们如何使用实体。`普通函数`实体可以承担`普通函数`的角色、`方法`的角色，或`类`的角色。`箭头函数`实体也可以承担`普通函数`的角色。\n\
  \n    *   函数的角色有：普通函数、方法和构造函数。\n\n许多其他编程语言只有一个承担 `普通函数` 角色的实体。这时它们可以使用 `function`\
  \ 这个词同时指代角色和实体。\n\n## 27.3 专用函数\n\n专用函数是普通函数的单用途版本。它们中的每一个都专门负责单一的角色：\n\n*   `箭头函数`的目的是成为一个普通函数：\n\
  \n    ```\n    [](#cb546-1)const arrow = () => {\n    [](#cb546-2)  return 123;\n\
  \    [](#cb546-3)};\n    [](#cb546-4)assert.equal(arrow(), 123);\n    ```\n\n* \
  \  `方法`的目的是成为一个方法：\n\n    ```\n    [](#cb547-1)const obj = {\n    [](#cb547-2) \
  \ myMethod() {\n    [](#cb547-3)    return 'abc';\n    [](#cb547-4)  }\n    [](#cb547-5)};\n\
  \    [](#cb547-6)assert.equal(obj.myMethod(), 'abc');\n    ```\n\n*   `类`的目的是成为一个构造函数：\n\
  \n    ```\n    [](#cb548-1)class MyClass {\n    [](#cb548-2)  /* ··· */\n    [](#cb548-3)}\n\
  \    [](#cb548-4)const inst = new MyClass();\n    ```\n\n除了语法更简洁之外，每种专用函数还支持新特性，使得它们工作起来比普通函数更出色。\n\
  \n*   很快会解释箭头函数。\n\n*   方法将在单个对象的章节中解释。\n\n*   类将在类的章节中解释。\n\n表 16 列出了普通函数和专用函数的各项。\n\
  \n表 16：四种函数的各项能力。如果单元格值在括号内，则意味着某种局限性。特殊变量 `this` 将将在 27.3.3 “方法、普通函数和箭头函数中的特殊变量\
  \ `this``](ch028.xhtml_this-in-callables)”节中解释。\n\n| | 函数调用 | 方法调用 | 构造函数调用 |\n\
  | --- | --- | --- | --- |\n| 普通函数 | (`this === undefined`) | `✔` | `✔` |\n| 箭头函数\
  \ | `✔` | (作用域 `this`) | `✘` |\n| 方法 | (`this === undefined`) | `✔` | `✘` |\n| 类\
  \ | `✘` | `✘` | `✔` |\n\n### 27.3.1 专用函数仍然是函数\n\n需要注意的是，箭头函数、方法和类仍然被归类为函数：\n\n```\n\
  > (() => {}) instanceof Function\ntrue\n> ({ method() {} }.method) instanceof Function\n\
  true\n> (class SomeClass {}) instanceof Function\ntrue\n```\n\n### 27.3.2 箭头函数\n\
  \n箭头函数添加到 JavaScript 有两个：\n\n1.  提供一种更简洁创建函数的方式。\n2.  由于作用域 `this`，它们作为回调函数工作效果更好。\n\
  \n让我们先检查箭头函数的语法，然后是 `this` 是如何工作的。\n\n#### 27.3.2.1 箭头函数的语法\n\n如果你想让箭头函数的体是一个对象字面量，你必须将字面量放在括号中：\n\
  \n```\n[](#cb556-1)const func1 = () => ({a: 1});\nassert.deepEqual(func1(), {a:\
  \ 1});\n```\n\n如果你不这样做，JavaScript 会认为箭头函数有一个不返回任何内容的块：\n\n```\n[](#cb557-1)const\
  \ func2 = () => {a: 1};\nassert.deepEqual(func2(), undefined);\n```\n\n在第二个示例中，`{a:\
  \ 1}` 被解释为带有标签 `a` 和表达式 `1` 的块。由于没有显式的 `return` 语句，块体返回 `undefined`。\n\n#### 27.3.2.2\
  \ 从箭头函数返回对象字面量\n\n这个陷阱是由语法歧义引起的：对象字面量和代码块具有相同的语法。我们使用括号告诉 JavaScript 身体是一个表达式（对象）而不是语句（块）。\n\
  \n在将箭头函数作为方法传递时，这非常方便：\n\n```\n[](#cb553-1)[1,2,3].map(x => x+1);\n```\n\n上一个示例展示了箭头函数的一个优势。如果我们使用函数执行相同任务，代码会更冗长：\n\
  \n```\n[](#cb555-1)[1,2,3].map(function (x) { return x+1 });\n```\n\n### 27.3.3\
  \ 方法、普通函数和箭头函数中的特殊变量 `this`\n\n![](img/file0.svg) 特殊变量 `this` 是一种面向对象的特性\n\n我们在这里查看特殊变量\
  \ `this`是为了理解为什么箭头函数比普通函数更好。\n\n但这个特性只在面向对象的编程中重要，并在 30.4 “方法和特殊变量 `this`](ch031.xhtml_methods-and-this)”中有深入介绍。因此，如果你还没有完全理解它，请担心。\n\
  \n在方法内部，特殊变量 `this` 让我们能够访问接收者——接收方法调用的对象：\n\n```\n[](#cb558-1)const obj = {\n[](#cb558-2)\
  \  myMethod() {\n[](#cb558-3)    assert.equal(this, obj);\n[](#cb558-4)  }\n[](#cb558-5)};\n\
  [](#cb558-6)obj.myMethod();\n```\n\n普通函数可以是方法，因此也具有隐式参数 `this`：\n\n```\n[](#cb559-1)const\
  \ obj = {\n[](#cb559-2)  myMethod: function () {\n[](#cb559-3)    assert.equal(this,\
  \ obj);\n[](#cb559-4)  }\n[](#cb559-5)};\n[](#cb559-6)obj.myMethod();\n```\n\n\n\
  \n\n\n当我们把普通函数作为实函数使用时，`this` 甚至是一个隐式参数。此时它的值为 `undefined`（在严格模式中）：\n\n```javascript\n\
  function ordinaryFunc() {\n  assert.equal(this, undefined);\n}\nordinaryFunc();\n\
  ```\n\n这意味着，作为实函数使用的普通函数无法访问周围方法的 `this`（行 A）。相比之下，箭头函数没有作为隐式参数的 `this`。它们像对待其他任何变量一样对待\
  \ `this`，因此可以访问周围方法的 `this`（行 B）：\n\n```javascript\nconst jill = {\n  name: 'Jill',\n\
  \  someMethod() {\n    function ordinaryFunc() {\n      assert.throws(\n       \
  \ () => this.name, // (A)\n        /^TypeError: Cannot read property 'name' of undefined$/\n\
  \      );\n    }\n    ordinaryFunc();\n\n    const arrowFunc = () => {\n      assert.equal(this.name,\
  \ 'Jill'); // (B)\n    };\n    arrowFunc();\n  },\n};\njill.someMethod();\n```\n\
  \n在代码中，我们可以观察到处理 `this` 的两种方式：\n\n*   动态 `this`：在行 A 中，我们尝试从一个普通函数访问 `.someMethod()`\
  \ 的 `this`。在那里，它被函数自身的 `this` 覆盖（shadowed），而该值是 `undefined`（由函数调用填充）。由于普通函数通过（动态）函数或方法调用接收其\
  \ `this`，因此它们的 `this` 被称为“动态的”。\n*   词法 `this`：在行 B 中，我们再次尝试访问 `.someMethod()` 的\
  \ `this`。这次我们成功了，因为箭头函数没有自己的 `this`。`this` 是通过词法作用域解析的，就像其他任何其他变量一样。这就是为什么箭头函数的\
  \ `this` 被称为“词法化的”。\n\n### 27.3.4 建议：优先使用专用函数而非普通函数\n\n通常情况下，你应该优先使用专用函数而非普通函数，特别是类和方法。\n\
  \n当涉及到实函数时，箭头函数和普通函数之间的选择就没有那么明确了：\n\n*   对于匿名内联函数表达式，箭头函数是明显的获胜者，因为它们的语法简洁，且没有将\
  \ `this` 作为隐式参数：\n\n    ```javascript\n    const twiceOrdinary = [1, 2, 3].map(function\
  \ (x) {return x * 2});\n    const twiceArrow = [1, 2, 3].map(x => x * 2);\n    ```\n\
  \n*   对于独立的具名函数声明，箭头函数仍然受益于词法 `this`。但函数声明（产生普通函数）具有良好的语法，而且早期激活有时也很有用（参见 §13.8\
  \ “声明：作用域与激活”）。如果 `this` 没有出现在普通函数的函数体中，那么将其作为实函数使用也没有坏处。静态检查工具 `ESLint` 可以在我们错误执行此操作时，通过[内置规则](https://eslint.org/docs/rules/no-invalid-this)\
  \ 在开发期间我们。\n\n    ```javascript\n    function timesOrdinary(x, y) {\n      return\
  \ x * y;\n    }\n    const timesArrow = (x, y) => {\n      return x * y;\n    };\n\
  \    ```\n\n## 27.4 总结：可调用值的类型\n\n![](img/file0.svg) **本节涉及后续内容**\n\n本节主要作为当前及后续章节的参考。如果你没有理解所有内容，请担心。\n\
  \n到目前为止，我们看到的所有（实）函数和方法都是：\n\n*   单结果\n*   同步\n\n后续章节将涵盖其他编程模式：\n\n*   `Iteration`（迭代）将对象视为数据容器（所谓的\
  \ `iterables`），并提供了一种获取其内部内容的标准化方法。如果函数或方法返回一个迭代器，它将返回多个值。\n*   `Asynchronous programming`（异步编程）处理长时间的计算。当计算完成时你会收到通知，并在期间可以做其他事情。异步交付单个结果的标准模式被称为\
  \ `Promise`。\n\n这些模式可以组合——例如，存在同步迭代器和异步迭代器。\n\n几种新类型的函数和方法有助于某些模式的组合：\n\n*   `Async\
  \ functions`（异步函数）帮助实现返回 `Promises` 的函数。还有 `async methods`（异步方法）。\n*   `Synchronous\
  \ generator functions`（同步生成器函数）帮助实现返回同步迭代器的函数。还有 `synchronous generator methods`（同步生成器方法）。\n\
  *   `Asynchronous generator functions`（异步生成器函数）帮助实现返回异步迭代器的函数。还有 `asynchronous generator\
  \ methods`（异步生成器方法）。\n\n这给我们留下了 4 类（2 × 2）函数和方法：\n\n*   同步 vs 异步\n*   生成器 vs. 单结果\n\
  \n表 17 提供了创建这 4 类函数和方法的语法概述。\n\n表 17：创建函数和方法的语法。最后一列指定了实体产生多少个值。\n\n| | | **Result**\
  \ | **#** | |\n| --- | --- | --- | --- | --- |\n| **Sync function（同步函数）** | **Sync\
  \ method（同步方法）** | | | |\n| `function f() {}` | `{ m() {} }` | value | 1 |\n| `f\
  \ = function () {}` | | | | |\n| `f = () => {}` | | | | |\n| **Sync generator function（同步生成器函数）**\
  \ | **Sync gen. method（同步生成器方法）** | | | |\n| `function* f() {}` | `{ * m() {} }`\
  \ | iterable | 0+ |\n| `f = function* () {}` | | | | |\n| **Async function（异步函数）**\
  \ | **Async method（异步方法）** | | | |\n| `async function f() {}` | `{ async m() {}\
  \ }` | Promise | 1 |\n| `f = async function () {}` | | | | |\n| `f = async () =>\
  \ {}` | | | | |\n| **Async generator function（异步生成器函数）** | **Async gen. method（异步生成器方法）**\
  \ | | | |\n| `async function* f() {}` | `{ async * m() {} }` | async iterable |\
  \ 0+ |\n| `f = async function* () {}` | | | | |\n\n## 27.5 从函数和方法返回返回值\n\n（本节提到的所有内容适用于函数和方法。）\n\
  \n`return` 语句显式地从函数返回一个值：\n\n```javascript\nfunction func() {\n  return 123;\n}\n\
  ```\n\n另一个示例：\n\n```javascript\nfunction boolToYesNo(bool) {\n  if (bool) {\n  \
  \  return 'Yes';\n  } else {\n    return 'No';\n  }\n}\nassert.equal(boolToYesNo(true),\
  \ 'Yes');\nassert.equal(boolToYesNo(false), 'No');\n```\n\n如果在函数结束时没有返回任何内容，JavaScript\
  \ 会为你返回 `undefined`：\n\n```javascript\nfunction noReturn() {\n  // 没有显式返回\n}\nassert.equal(noReturn(),\
  \ undefined);\n```\n\n## 27.6 参数处理\n\n### 27.6.1 术语：parameters vs. ...arguments\n\
  \n`parameter` 和 `argument` 术语基本上意思相同。如果你愿意，可以进行如下区分：\n\n*   `Parameters`（参数）是函数定义的一部分。它们也称为形式参数或形式参数。\n\
  *   `Arguments`（参数）是函数调用的一部分。它们也称为实际参数或实际参数。\n\n### 27.6.2 术语：callback\n\n`callback`（回调）或\
  \ `callback function`（回调函数）是作为函数或方法调用参数的函数。\n\n以下是回调的示例：\n\n```javascript\nconst\
  \ myArray = ['a', 'b'];\nconst callback = (x) => console.log(x);\nmyArray.forEach(callback);\n\
  \n// 输出：\n// 'a'\n// 'b'\n```\n\n### 27.6.3 参数过多或不足\n\n如果函数调用提供的参数数量与函数定义预期的数量不符，JavaScript\
  \ 不会报错：\n\n*   多余的参数会被忽略。\n*   缺失的参数将被设置为 `undefined`。\n\n例如：\n\n\n\n\n\n```\nfunction\
  \ foo(x, y) {\n  return [x, y];\n}\n\n// 参数过多：\nassert.deepEqual(foo('a', 'b', 'c'),\
  \ ['a', 'b']);\n\n// 预期的参数数量：\nassert.deepEqual(foo('a', 'b'), ['a', 'b']);\n\n\
  // 参数过少：\nassert.deepEqual(foo('a'), ['a', undefined]);\n```\n\n### 27.6.4 参数默认值\n\
  \n参数默认值指定了在未提供参数时应使用的值——例如：\n\n```javascript\nfunction f(x, y=0) {\n  return [x,\
  \ y];\n}\nassert.deepEqual(f(1), [1, 0]);\nassert.deepEqual(f(), [undefined, 0]);\n\
  ```\n\n`undefined` 也会触发默认值：\n\n```javascript\nassert.deepEqual(\n  f(undefined,\
  \ undefined),\n  [undefined, 0]);\n```\n\n### 27.6.5 剩余参数 (Rest parameters)\n\n\
  剩余参数通过在标识符前加上三个点（`...`）来声明。在函数或方法调用期间，它会接收一个包含所有剩余参数的 Array。如果末尾没有额外的参数，它将是一个空 Array——例如：\n\
  \n```javascript\nfunction f(x, ...y) {\n  return [x, y];\n}\nassert.deepEqual(\n\
  \  f('a', 'b', 'c'),\n  ['a', ['b', 'c']]);\nassert.deepEqual(\n  f(),\n  [undefined,\
  \ []]);\n```\n\n#### 27.6.5.1 通过剩余参数强制限制参数数量\n\n你可以使用剩余参数来强制执行特定数量的参数。例如函数：\n\n\
  ```javascript\nfunction createPoint(x, y) {\n  return {x, y};\n    // 等同于 {x: x,\
  \ y: y}\n}\n```\n\n这是我们如何强制调用者始终提供两个参数：\n\n```javascript\nfunction createPoint(...args)\
  \ {\n  if (args.length !== 2) {\n    throw new Error('Please provide exactly 2 arguments!');\n\
  \  }\n  const [x, y] = args; // (A)\n  return {x, y};\n}\n```\n\n在 A 行中，我们通过 `destructuring`（解构）访问\
  \ `args` 的元素。\n\n### 27.6.6 命名参数 (Named parameters)\n\n当有人调用函数时，调用者提供的参数会被分配给被调用者的参数。执行这种映射的常用方法有两种：\n\
  \n1. 位置参数：如果参数的位置相同，则将参数分配给相应的参数。仅使用位置参数的函数调用如下：\n\n   ```javascript\n   selectEntries(3,\
  \ 20, 2)\n   ```\n\n2. 命名参数：如果参数的名称相同，则将参数分配给相应的参数。JavaScript 没有命名参数，但你可以模拟它们。例如，这是一个仅使用（模拟的）命名参数的函数调用：\n\
  \n   ```javascript\n   selectEntries({start: 3, end: 20, step: 2})\n   ```\n\n命名参数有几个优点：\n\
  \n* 它们使代码更具自解释性，因为每个参数都有一个描述性的标签。对比一下 `selectEntries()` 的两个版本：使用第二种方法要更容易看出发生了什么。\n\
  \n* 参数的顺序并不重要（只要名字正确即可）。\n\n* 处理多个可选参数更加方便：调用者可以轻松地提供所有可选参数的任何子集，而无需担心省略了哪些参数（使用位置参数时，你必须用\
  \ `undefined` 填充前面的可选参数）。\n\n### 27.6.7 模拟命名参数\n\nJavaScript 没有真正的命名参数。模拟它们的官方方法是通过对象字面量实现的：\n\
  \n```javascript\nfunction selectEntries({start=0, end=-1, step=1}) {\n  return {start,\
  \ end, step};\n}\n```\n\n该函数使用 `destructuring` 来访问其单一参数的属性。它使用的模式是以下内容的缩写：\n\n```javascript\n\
  {start=0, end=-1, step=1}\n```\n\n这种解构模式适用于对象字面量：\n\n```javascript\n> selectEntries({})\n\
  { start: 0, end: -1, step: 1 }\n```\n\n但如果在不带任何参数的情况下调用函数，它将不起：\n\n```javascript\n\
  > selectEntries()\nTypeError: Cannot read property 'start' of undefined\n```\n\n\
  你可以通过为整个模式提供一个默认值来修复此问题。这个默认值与简单定义中的默认值工作原理相同：如果参数缺失了。\n\n```javascript\nfunction\
  \ selectEntries({start=0, end=-1, step=1} = {}) {\n  return {start, end, step};\n\
  }\nassert.deepEqual(\n  selectEntries(),\n  { start: 0, end: -1, step: 1 });\n```\n\
  \n### 27.6.8 展开 (`...`) 到函数调用中\n\n如果你在函数调用的参数前加上三个点（`...`），那么就会对其进行展开。这意味着该参数必须是一个\
  \ `iterable` 对象，并且迭代值将成为参数。换句话说，单个参数被扩展为多个参数——例如：\n\n```javascript\nfunction func(x,\
  \ y) {\n  console.log(x);\n  console.log(y);\n}\nconst someIterable = ['a', 'b'];\n\
  func(...someIterable); // 等同于 func('a', 'b')\n// 输出：\n// 'a'\n// 'b'\n```\n\n展开和剩余参数使用相同的语法（`...`），但它们的作用相反：\n\
  \n* 剩余参数用于定义函数或方法。它们将参数收集到 `Arrays` 中。\n* 展开参数用于调用函数或方法。它们将可迭代对象转换为参数。\n\n#### 27.6.8.1\
  \ 示例：展开到 `Math.max()`\n\n`Math.max()` 返回其零或多个参数中最大的一个。遗憾的是，它不能用于 Array，但展开为我们提供了解决方法：\n\
  \n```javascript\n> Math.max(-1, 5, 11, 3)\n> Math.max([...[-1, 5, 11, 3])\n> Math.max(-1,\
  \ ...[-5, 11], 3)\n```\n\n#### 27.6.8.2 示例：展开到 `Array.prototype.push()`\n\n同样，Array\
  \ 方法 `.push()` 破坏性地将其零或多个参数添加到其 Array 的末尾。JavaScript 没有用于破坏性地将一个 Array 追加到另一个 Array\
  \ 方法。再次，展开拯救了我们：\n\n```javascript\nconst arr1 = ['a', 'b'];\nconst arr2 = ['c',\
  \ 'd'];\narr1.push(...arr2);\nassert.deepEqual(arr1, ['a', 'b', 'c', 'd']);\n```\n\
  \n**练习：参数处理**\n\n* 位置参数：`exercises/callables/positional_parameters_test.mjs`\n*\
  \ 命名参数：`exercises/callables/named_parameters_test.mjs`\n\n## 27.7 函数的方法：`.call()`,\
  \ `.apply()`, `.bind()`\n\n函数是对象，并拥有方法。在本节中，我们将查看其中三个方法：`.call()`、`.apply()` 和 `.bind()`。\n\
  \n### 27.7.1 函数方法 `.call()`\n\n每个函数 `someFunc` 都有如下如下的方法：\n\n```javascript\nsomeFunc.call(thisValue,\
  \ arg1, arg2, arg3);\n```\n\n这种方法调用松散等同于以下函数调用：\n\n```javascript\nsomeFunc(arg1,\
  \ arg2, arg3);\n```\n\n然而，通过 `.call()`，我们还可以为隐式参数 `this` 指定值。\n\n以下代码演示了 `.call()`\
  \ 的用法：\n\n```javascript\nfunction func(x, y) {\n  return [this, x, y];\n}\nassert.deepEqual(\n\
  \  func.call('hello', 'a', 'b'),\n  ['hello', 'a', 'b']);\n```\n\n正如我们之前见过的，如果我们直接调用普通函数，其\
  \ `this` 是 `undefined`：\n\n```javascript\nassert.deepEqual(\n  func('a', 'b'),\n\
  \  [undefined, 'a', 'b']);\n```\n\n因此，之前的函数调用等同于：\n\n\n\n\n\n```javascript\nassert.deepEqual(\n\
  \  func.call(undefined, 'a', 'b'),\n  [undefined, 'a', 'b']);\n```\n\n在箭头函数中，通过\
  \ `.call()` 提供的 `this` 值会被忽略。\n\n### 27.7.2 函数方法 `.apply()`\n\n每个函数 `someFunc` 均拥有以下方法：\n\
  \n```javascript\nsomeFunc.apply(thisValue, [arg1, arg2, arg3]);\n```\n\n此方法的调用松散等同于以下函数调用（使用了参数展开运算符）：\n\
  \n```javascript\nsomeFunc(...[arg1, arg2, arg3]);\n```\n\n然而，通过 `.apply()`，我们也可以为隐式参数\
  \ `this` 指定值。\n\n以下代码演示了 `.apply()` 的用法：\n\n```javascript\nfunction func(x, y) {\n\
  \  return [this, x, y];\n}\n\nconst args = ['a', 'b'];\nassert.deepEqual(\n  func.apply('hello',\
  \ args),\n  ['hello', 'a', 'b']);\n```\n\n### 27.7.3 函数方法 `.bind()`\n\n`.bind()`\
  \ 是函数对象的另一个方法。该方法的调用方式如下：\n\n```javascript\nconst boundFunc = someFunc.bind(thisValue,\
  \ arg1, arg2);\n```\n\n`.bind()` 返回一个新函数 `boundFunc()`。调用该函数会触发 `someFunc()`，其 `this`\
  \ 被设置为 `thisValue`，并传入这些参数：`arg1`、`arg2`，随后是 `boundFunc()` 自身的参数。\n\n也就是说，以下两个函数调用是等价的：\n\
  \n```javascript\nboundFunc('a', 'b')\nsomeFunc.call(thisValue, arg1, arg2, 'a',\
  \ 'b')\n```\n\n#### 27.7.3.1 .bind() 的替代方案\n\n预填充 `this` 和参数的另一种方法是通过箭头函数实现：\n\n\
  ```javascript\nconst boundFunc2 = (...args) =>\n  someFunc.call(thisValue, arg1,\
  \ arg2, ...args);\n```\n\n#### 27.7.3.2 .bind() 的实现\n\n考虑到前面的章节，`.bind()` 可以如下实现为一个真实的函数：\n\
  \n```javascript\nfunction bind(func, thisValue, ...boundArgs) {\n  return (...args)\
  \ =>\n    func.call(thisValue, ...boundArgs, ...args);\n}\n```\n\n#### 27.7.3.3\
  \ 示例：绑定一个真实函数\n\n对真实函数使用 `.bind()` 有些不直观，因为我们必须为 `this` 提供值。鉴于在函数调用期间它是 `undefined`，因此通常将其设置为\
  \ `undefined` 或 `null`。\n\n在下面的示例中，我们创建了 `add8()`，这是一个只有一个参数的函数，并将 `add()` 的第一个参数绑定为\
  \ `8`。\n\n```javascript\nfunction add(x, y) {\n  return x + y;\n}\n\nconst add8\
  \ = add.bind(undefined, 8);\nassert.equal(add8(1), 9);\n```\n\n**测验**\n\n参见测验应用。\n\
  \n# 28 动态评估代码：`eval()`、`new Function()`（高级）\n\n* 28.1 `eval()`\n* 28.2 `new Function()`\n\
  * 28.3 建议\n\n在本章中，我们将介绍两种动态评估代码的方法：`eval()` 和 `new Function()`。\n\n## 28.1 `eval()`\n\
  \n给定一个包含 JavaScript 代码的字符串 `str`，`eval(str)` 会评估该代码并返回结果：\n\n```javascript\n> eval('2\
  \ ** 4')\n16\n```\n\n调用 `eval()` 有两种方式：\n\n* *直接地*，通过函数调用。此时其参数中的代码将在当前作用域内进行评估。\n\
  * *间接地*，不通过函数调用。此时它将在全局作用域内评估代码。\n\n“不通过函数调用”意味着“任何看起来与 `eval(···)` 的形式”：\n\n* `eval.call(undefined,\
  \ '···')`\n* `(0, eval)('···')`（使用逗号运算符）\n* `globalThis.eval('···')`\n* `const e\
  \ = eval; e('···')`\n* 等。\n\n以下代码说明了差异：\n\n```javascript\nglobalThis.myVariable\
  \ = 'global';\nfunction func() {\n  const myVariable = 'local';\n\n  // 直接 eval\n\
  \  assert.equal(eval('myVariable'), 'local');\n\n  // 间接 eval\n  assert.equal(eval.call(undefined,\
  \ 'myVariable'), 'global');\n}\n```\n`globalThis.myVariable` 为 'global'。\n\n## 28.2\
  \ `new Function()`\n\n给定一个包含 JavaScript 代码的字符串 `str`，`new Function(str)` 会创建一个代表该代码的新函数对象。\n\
  \n```javascript\nconst add = new Function('a', 'b', 'return a + b');\nadd(2, 3);\
  \ // 5\n```\n\n传递给 `new Function` 的参数是参数的名称，最后一个参数是函数体。\n\n## 28.3 建议\n\n* 避免使用\
  \ `eval()`，因为它可能存在安全风险且运行速度缓慢。\n* 仅在必要时使用 `new Function()`，例如动态生成代码时。\n\n\n\n\n\n\
