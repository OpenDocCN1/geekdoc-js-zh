  \   奖励：`exercises/control-flow/is_object_via_switch_test.mjs`\n\n## 25.5 `while`\
  \ 循环\n\n`while` 循环具有如下语法：\n\n```\nwhile (condition) {\n  statements\n}\n```\n\n\
  在每次循环迭代之前，`while` 会评估 `condition`：\n\n*   如果结果为假值，循环结束。\n*   如果结果为真值，则再执行一次 `while`\
  \ 体。\n\n### 25.5.1 `while` 循环的示例\n\n\n\n\n\n以下代码使用了 `while` 循环。在每次循环迭代中，它通过 `.shift()`\
  \ 移除 `arr` 的第一个元素并将其打印。\n\n```javascript\nconst arr = ['a', 'b', 'c'];\nwhile (arr.length\
  \ > 0) {\n  const elem = arr.shift(); // remove first element\n  console.log(elem);\n\
  }\n// Output:\n// 'a'\n// 'b'\n// 'c'\n```\n\n如果条件始终求值为为 `true`，那么 `while` 就是一个无限循环：\n\
  \n```javascript\nwhile (true) {\n  if (Math.random() === 0) break;\n}\n```\n\n##\
  \ 25.6 `do-while` loops [ES3]\n\n`do-while` 循环的工作方式与 `while` 非常相似，但它是在每次循环迭代*之后*检查条件，而不是之前。\n\
  \n```javascript\nlet input;\ndo {\n  input = prompt('Enter text:');\n  console.log(input);\n\
  } while (input !== ':q');\n```\n\n`prompt()` 是一个在 Web 浏览器中可用的全局函数。它提示用户输入文本并返回该文本。\n\
  \n## 25.7 `for` loops [ES1]\n\n`for` 循环具有以下语法：\n\n```javascript\nfor («initialization»;\
  \ «condition»; «post_iteration») {\n  «statements»\n}\n```\n\n第一行是循环的*头部*（head），控制循环*体*（body，循环的剩余部分）执行的频率。它包含三个部分，每个部分都是可选的：\n\
  \n*   `initialization`：为循环设置变量等。在这里通过 `let` 或 `const` 声明的变量仅在循环内部存在。\n*   `condition`：此条件在每次循环迭代前被检查。如果它为假（falsy），则停止循环。\n\
  *   `post_iteration`：这段代码在每次循环迭代后执行。\n\n因此，`for` 循环大致等同于以下 `while` 循环：\n\n```javascript\n\
  «initialization»\nwhile («condition») {\n  «statements»\n  «post_iteration»\n}\n\
  ```\n\n### 25.7.1 Examples of `for` loops\n\n作为一个示例，这是如何通过 `for` 循环从零计数到二：\n\n```javascript\n\
  for (let i=0; i<3; i++) {\n  console.log(i);\n}\n// Output:\n// 0\n// 1\n// 2\n\
  ```\n\n这是如何通过 `for` 循环打印 `Array` 的内容：\n\n```javascript\nconst arr = ['a', 'b', 'c'];\n\
  for (let i=0; i<arr.length; i++) {\n  console.log(arr[i]);\n}\n// Output:\n// 'a'\n\
