  \  if (Math.random() === 0) break;\n}\n```\n\n## 25.8 `for-of` loops [ES6]\n\n`for-of`\
  \ 循环遍历任何*迭代器*（iterable）——一种支持*迭代协议*（iteration protocol）的数据容器。每个迭代值都存储在变量中，如头部所示：\n\
