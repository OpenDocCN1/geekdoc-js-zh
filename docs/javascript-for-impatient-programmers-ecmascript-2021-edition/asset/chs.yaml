  \ 'b', 'c'];\nfor (const [index, elem] of arr.entries()) {\n  console.log(`${index}\
  \ -> ${elem}`);\n}\n// Output:\n// '0 -> a'\n// '1 -> b'\n// '2 -> c'\n```\n\n通过\
  \ `[index, element]`，我们正在使用*解构*（destructuring）来访问 `Array` 元素。\n\n**练习: `for-of`**\n\
