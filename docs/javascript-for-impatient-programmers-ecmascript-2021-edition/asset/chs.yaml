  \n## 33.12 快速参考：`Array<T>`\n\n### 33.12.1 `new Array()`\n\n### 33.12.2 `Array` 的静态方法\n\
  \n### 33.12.3 `Array<T>.prototype` 的方法\n\n### 33.12.4 来源\n\n## 33.1 数组在 JavaScript\
  \ 中的两个角色\n\n数组扮演两个角色：\n\n- 元组（Tuples）：作为元组的数组具有固定数量的索引元素。每个元素可以是不同的类型。\n- 序列（Sequences）：作为序列的数组具有可数量的索引元素。每个元素具有相同的类型。\n\
  \n在实践中，这两个角色通常是混合使用的。值得注意的是，作为序列的数组非常灵活，你可以将其用作（传统的）数组、栈和队列（见后文）。\n\n## 33.2 基础数组操作\n\
  \n### 33.2.1 创建、读取、写入数组\n\n创建数组的最佳方式是通过 `Array` 字面量：\n\n```javascript\nconst arr\
  \ = ['a', 'b', 'c'];\n```\n\n数组字面量以方括号 `[]` 开始和结束。它创建了一个包含三个元素的数组：`'a'`、`'b'` 和\
  \ `'c'`。数组字面量末尾的逗号会被忽略：\n\n```javascript\nconst arr = [\n  'a',\n  'b',\n  'c',\n\
  ];\n```\n\n读取数组元素，在方括号中放入索引（索引从 0 开始）：\n\n```javascript\nconst arr = ['a', 'b',\
  \ 'c'];\nassert.equal(arr[0], 'a');\n```\n\n修改数组元素，通过索引给数组赋值：\n\n```javascript\n\
  const arr = ['a', 'b', 'c'];\narr[0] = 'x';\nassert.deepEqual(arr, ['x', 'b', 'c']);\n\
  ```\n\n数组索引的范围是 32 位（不包括最大长度）：`[0, 2³²-1]`\n\n### 33.2.2 数组的 `.length`\n\n每个数组都有\
  \ `.length` 属性，可以用于读取和修改数组中的元素数量。数组的长度总是最高索引加一：\n\n```javascript\nconst arr = ['a',\
  \ 'b'];\narr.length // 2\n```\n\n如果你在长度索引处向数组写入，则会追加一个元素：\n\n```javascript\narr[arr.length]\
  \ = 'c';\narr // ['a', 'b', 'c']\narr.length // 3\n```\n\n另一种（破坏性地）追加元素的方法是通过数组方法\
  \ `.push()`：\n\n```javascript\narr.push('d');\narr // ['a', 'b', 'c', 'd']\n```\n\
  \n如果你设置 `.length`，则是通过移除元素来修剪数组：\n\n```javascript\narr.length = 1;\narr // ['a']\n\
  ```\n\n### 33.2.3 清空数组\n\n要清空（为空）数组，你可以将其 `.length` 设置为零：\n\n```javascript\nconst\
  \ arr = ['a', 'b', 'c'];\narr.length = 0;\nassert.deepEqual(arr, []);\n```\n\n或者你可以将一个新的空数组赋值给存储该数组的变量：\n\
  \n```javascript\nlet arr = ['a', 'b', 'c'];\narr = [];\nassert.deepEqual(arr, []);\n\
  ```\n\n后一种方法的优点是不会影响指向同一数组的其他位置。然而，如果你确实想为所有人重置一个共享数组，那么你需要前一种方法。\n\n**练习：通过 `.push()`\
  \ 移除空行**\n`exercises/arrays/remove_empty_lines_push_test.mjs`\n\n### 33.2.4 展开到数组字面量\
  \ [ES6]\n\n在数组字面量内部，*展开元素*（spread element）由三个点 (`...`）后跟一个表达式组成。结果是该表达式被求值并进行迭代。每个迭代后的值都变成额外的数组元素——例如：\n\
  \n```javascript\nconst iterable = ['b', 'c'];\n['a', ...iterable, 'd'] // ['a',\
  \ 'b', 'c', 'd']\n```\n\n这意味着我们可以使用展开来创建数组的副本：\n\n```javascript\nconst original\
  \ = ['a', 'b', 'c'];\nconst copy = [...original];\n```\n\n展开也方便将数组（以及其他迭代器）合并到数组中：\n\
  \n```javascript\nconst arr1 = ['a', 'b'];\nconst arr2 = ['c', 'd'];\nconst concatenated\
  \ = [...arr1, ...arr2, 'e'];\nassert.deepEqual(concatenated, ['a', 'b', 'c', 'd',\
  \ 'e']);\n```\n\n由于展开使用了迭代，它只有在值是可迭代的时才有效：\n\n```javascript\n[...'abc'] // 字符串是迭代的\
  \ ['a', 'b', 'c']\n[...123] // TypeError: number 123 is not iterable\n[...undefined]\
  \ // TypeError: undefined is not iterable\n```\n\n**展开到数组字面量是浅拷贝**\n\n与展开到对象字面量类似，展开到数组字面量创建的是*浅*拷贝。也就是说，嵌套数组不会被复制。\n\
  \n### 33.2.5 数组：列出索引和条目 [ES6]\n\n方法 `.keys()` 列出数组的索引：\n\n\n\n\n\n```javascript\n\
  const arr = ['a', 'b'];\nassert.deepEqual(\n  [...arr.keys()], // (A)\n  [0, 1]);\n\
  ```\n\n`.keys()` 返回一个可迭代对象。在行 A 中，我们通过扩展操作获取了一个 `Array`。\n\n列出数组索引与列出属性不同。前者产生数字；后者产生字符串化的数字（此外还有非索引属性键）：\n\
  \n```javascript\nconst arr = ['a', 'b'];\narr.prop = true;\n\nassert.deepEqual(\n\
  \  Object.keys(arr),\n  ['0', '1', 'prop']);\n```\n\n方法 `.entries()` 将 `Array` 的内容列为\
  \ `[index, element]` 键值对：\n\n```javascript\nconst arr = ['a', 'b'];\nassert.deepEqual(\n\
  \  [...arr.entries()],\n  [[0, 'a'], [1, 'b']]);\n```\n\n### 33.2.6 一个值是 Array 吗？\n\
  \n以下是检查一个值是否为 `Array` 的两种方法：\n\n```javascript\n> [] instanceof Array\ntrue\n> Array.isArray([])\n\
  true\n```\n\n`instanceof` 通常没有问题。如果一个值可能来自另一个*realm*（作用域），你需要使用 `Array.isArray()`。粗来说，一个\
  \ realm 是 JavaScript 全局作用域的实例。某些 realm 之间是隔离的（例如浏览器中的 [Web Workers]），但也存在可以在其之间移动数据的\
  \ realm —— 例如浏览器中的同源 iframe。`x instanceof Array` 检查 `x` 的原型链，因此，如果 `x` 是一个来自另一个\
  \ realm 的 `Array`，则它将返回 `false`。\n\n`typeof` 将 `Arrays` 归类为对象：\n\n```javascript\n\
  > typeof []\n'object'\n```\n\n## 33.3 for-of 与数组 [ES6]\n\n我们已经遇到过 `for-of` 循环。本节简要回顾如何使用它来处理\
  \ `Arrays`。\n\n### 33.3.1 for-of: 遍历元素\n\n以下 `for-of` 循环遍历 `Array` 的元素：\n\n```javascript\n\
  for (const element of ['a', 'b']) {\n  console.log(element);\n}\n// 输出:\n// 'a'\n\
  // 'b'\n```\n\n### 33.3.2 for-of: 遍历索引\n\n此 `for-of` 循环遍历 `Array` 的索引：\n\n```javascript\n\
  for (const element of ['a', 'b'].keys()) {\n  console.log(element);\n}\n// 输出:\n\
  // 0\n// 1\n```\n\n### 33.3.3 for-of: 遍历 [index, element] 键对\n\n以下 `for-of` 循环遍历\
  \ `[index, element]` 键对。解构（后文会描述）为我们提供了方便的语法，在 `for-of` 头部设置 `index` 和 `element`。\n\
  \n```javascript\nfor (const [index, element] of ['a', 'b'].entries()) {\n  console.log(index,\
  \ element);\n}\n// 输出:\n// 0, 'a'\n// 1, 'b'\n```\n\n## 33.4 类数组对象 (Array-like objects)\n\
  \n某些适用于 `Arrays` 的操作只需要最少条件：值必须是*类数组*的（Array-like）。类类数组值是一个具有以下属性的对象：\n\n* `.length`:\
  \ 存储类数组对象的长度。\n* `[0]`: 存储索引为 0 的元素（依此类推）。注意，如果你使用数字作为属性名，它们始终会被强制转换为字符串。因此，`[0]`\
  \ 获取键为 `'0'` 的属性值。\n\n例如，`Array.from()` 接受类数组对象并将其转换为 `Arrays`：\n\n```javascript\n\
  // 如果你省略了 .length，它会被解释为 0\nassert.deepEqual(\n  Array.from({}),\n  []);\n\nassert.deepEqual(\n\
  \  Array.from({length:2, 0:'a', 1:'b'}),\n  [ 'a', 'b' ]);\n```\n\n类数组对象的 TypeScript\
  \ 接口为：\n\n```typescript\ninterface ArrayLike<T> {\n  length: number;\n  [n: number]:\
  \ T;\n}\n```\n\n**在现代 JavaScript 中，类数组对象是相对稀少的**\n\n类数组对象在 ES6 之前很常见；现在你并不经常看到它们。\n\
  \n## 33.5 将可迭代值和类数组值转换为数组\n\n将可迭代值和类数组值转换为 `Arrays` 有两种常用方法：扩展操作和 `Array.from()`。\n\
  \n### 33.5.1 通过扩展操作 (`...`) 将可迭代对象转换为数组\n\n在数组字面量内部，通过 `...` 扩展可以将任何可迭代对象转换为一系列\
  \ `Array` 元素。例如：\n\n```javascript\n// 从网页浏览器的 DOM 获取一个类数组集合\nconst domCollection\
  \ = document.querySelectorAll('a');\n\n#### 遗憾的是，集合缺少许多 Array 方法\nassert.equal('map'\
  \ in domCollection, false);\n\n// 解决方案：将其转换为数组\nconst arr = [...domCollection];\n\
  assert.deepEqual(\n  arr.map(x => x.href),\n  ['https://2ality.com', 'https://exploringjs.com']);\n\
  ```\n\n转换之所以有效，是因为 DOM 集合是可迭代的。\n\n### 33.5.2 通过 Array.from() 将可迭代对象和类数组对象转换为数组（高级）\n\
  \n`Array.from()` 可以以两种模式使用。\n\n#### 33.5.2.1 Array.from() 的模式 1：转换\n\n第一种模式具有以下类型签名：\n\
  \n```javascript\n.from<T>(iterable: Iterable<T> | ArrayLike<T>): T[]\n```\n\n`Iterable`\
  \ 接口在同步迭代章节中显示。`ArrayLike` 接口在本章较早之前出现过。\n\n通过单个参数，`Array.from()` 将任何可迭代或类数组的对象转换为\
  \ `Array`：\n\n```javascript\n> Array.from(new Set(['a', 'b']))\n[ 'a', 'b' ]\n>\
  \ Array.from({length: 2, 0:'a', 1:'b'})\n[ 'a', 'b' ]\n```\n\n#### 33.5.2.2 Array.from()\
  \ 的模式 2：转换与映射\n\n`Array.from()` 的第二种模式涉及两个参数：\n\n```javascript\n.from<T>(iterable:\
  \ Iterable<T> | ArrayLike<T>, mapFn?: (value: T, index: number) => any, thisArg?:\
  \ any): T[]\n```\n等待，提供的用于模式 2 的文本片段是：\n```javascript\n.from<T>(iterable: Iterable<T>\
  \ | ArrayLike<T>): T[]\n```\n（注：源文本为模式 2 提供了一个不完整的签名，但我将遵循代码段提供的逻辑）。\n\n实际上，查看提供的文本：\n\
  （此处省略重复）\n\n在此模式下，`Array.from()` 执行以下操作：\n* 它遍历 `iterable`。\n* 它对每个值调用 `mapFunc`。可选的\
  \ `thisArg` 指定了 `mapFunc` 的 `this` 指向。\n* 它将结果收集在一个新的 `Array` 中并返回它。\n\n这是一个示例：\n\
  ```javascript\n> Array.from(new Set(['a', 'b']), x => x)\n[ 'aa', 'bb' ]\n```\n\n\
  ## 33.6 创建和填充数组\n\n创建 `Array` 的最佳方法是通过数组字面量。然而，你并不总是可以使用它：`Array` 可能会太大，你可能在开发期间不知道它的长度，或者你可能想保持其长度的灵活。这时，我推荐以下创建和填充数组的技术。\n\
  \n### 33.6.1 你是否需要创建一个稍后填充的空数组？\n\n```javascript\n> new Array(3)\n[ , ,]\n```\n\n\
  注意结果包含*空洞*（空位）：数组字面量中的最后一个逗号总是被忽略的。\n\n### 33.6.2 你是否需要创建一个填充了原始值的数组？\n\n```javascript\n\
  > new Array(3).fill(0)\n[0, 0, 0]\n```\n\n警告：如果你对 `.fill()` 使用对象，那么每个 `Array` 元素将引用该对象（共享它）。\n\
  \n```javascript\nconst arr = new Array(3).fill({});\narr[0].prop = true;\nassert.deepEqual(\n\
  \  arr, [\n    {prop: true},\n    {prop: true},\n    {prop: true},\n  ]);\n```\n\
  \n下一节将如何修复这个问题。\n\n### 33.6.3 你是否需要创建一个填充了对象的数组？\n\n```javascript\n> Array.from({length:\
  \ 3}, () => (}))\n[{}, {}, {}]\n```\n\n### 33.6.4 你是否需要创建一个整数范围？\n\n```javascript\n\
  function createRange(start, end) {\n  return Array.from({length: end-start}, (_,\
  \ i) => i+start);\n}\nassert.deepEqual(\n  createRange(2, 5),\n  [2, 3, 4]);\n```\n\
  \n这里是另一种创建从零开始的整数范围的略显黑奇的技巧：\n\n\n\n\n\n```\n[](#cb851-1)/** 返回一个迭代器 */\n[](#cb851-2)function\
  \ createRange(end) {\n[](#cb851-3)  return new Array(end).keys();\n[](#cb851-4)}\n\
  assert.deepEqual(\n[](#cb851-6)  [...createRange(4)],\n[](#cb851-7)  [0, 1, 2, 3]);\n\
  ```\n\n这之所以有效是因为 `.keys()` 将空位 视为 `undefined` 元素并列出它们的索引。\n\n### 33.6.5 如果元素全是整数或全浮点数，请使用类型数组\n\
  \n如果你正在处理整数或浮点数的 `Arrays`，可以考虑类型数组，它们是专门为此目的而创建的。\n\n## 33.7 多维数组\n\nJavaScript\
  \ 没有真正的多维 `Arrays`；你需要求助于元素为 `Arrays` 的 `Arrays`：\n\n```\n[](#cb852-1)function initMultiArray(...dimensions)\
  \ {\n[](#cb852-2)  function initMultiArrayRec(dimIndex) {\n[](#cb852-3)    if (dimIndex\
  \ >= dimensions.length) {\n[](#cb852-4)      return 0;\n[](#cb852-5)    } else {\n\
  [](#cb852-6)      const dim = dimensions[dimIndex];\n[](#cb852-7)      const arr\
  \ = [];\n[](#cb852-8)      for (let i=0; i<dim; i++) {\n[](#cb852-9)        arr.push(initMultiArrayRec(dimIndex+1));\n\
  [](#cb852-10)      }\n[](#cb852-11)      return arr;\n[](#cb852-12)    }\n[](#cb852-13)\
  \  }\n[](#cb852-14)  return initMultiArrayRec(0);\n[](#cb852-15)}\n\n[](#cb852-17)const\
  \ arr = initMultiArray(4, 3, 2);\n[](#cb852-18)arr[3][2][1] = 'X'; // 每个维度的最后一个元素\n\
  [](#cb852-19)assert.deepEqual(arr, \n[  [ [ 0, 0 ], [ 0, 0 ], [ 0, 0 ] ],\n[](#cb852-21)\
  \  [ [ 0, 0 ], [ 0, 0 ], [ 0, 0 ] ],\n[](#cb852-22)  [ [ 0, 0 ], [ 0, 0 ], [ 0,\
  \ 0 ] ],\n[](#cb852-23)  [ [ 0, 0 ], [ 0, 0 ], [ 0, 'X' ] ],\n[](#cb852-24)]);\n\
  ```\n\n## 33.8 更多数组特性（高级）\n\n在本节中，我们将查看你在处理 `Arrays` 时并不经常遇到的现象。\n\n### 33.8.1 数组索引是（略微特殊的）属性键\n\
  \n你可能可能认为 `Array` 元素是特殊的，因为你是通过数字访问它们的。但用于执行此操作的方括号运算符 `[]` 与访问属性时使用的运算符是相同的。它会将任何值（非\
  \ symbol 类型）转换为字符串。因此，`Array` 元素是（几乎是）普通的属性（A 行），你使用数字还是字符串作为索引并不重要（B 行和 C 行）：\n\
  \n```\n[](#cb853-1)const arr = ['a', 'b'];\n[](#cb853-2)arr.prop = 123;\n[](#cb853-3)assert.deepEqual(\n\
  [](#cb853-4)  Object.keys(arr),\n[](#cb853-5)  ['0', '1', 'prop']); // (A)\n\n[](#cb853-7)assert.equal(arr[0],\
  \ 'a');  // (B)\n[](#cb853-8)assert.equal(arr['0'], 'a'); // (C)\n```\n\n为了让事情变得更加困惑，这仅仅是语言规范定义的方式（如果说是\
  \ JavaScript 的理论）。大多数 JavaScript 引擎在底层进行了优化，并确实使用实际整数来访问 `Array` 元素（如果说是 JavaScript\
  \ 的实践）。\n\n用于 `Array` 元素的属性键（字符串！）被称为[索引](https://tc39.github.io/ecma262/#integer-index)。如果一个字符串\
  \ `str` 转换为 32 位无符号整数再转回来后得到原始值，则它是一个索引。公式表示为：\n\n```\nToString(ToUint32(str)) ===\
  \ str\n```\n\n#### 33.8.1.1 列出索引\n\n列出属性键时，索引会被特殊处理 —— 它们始终在前，并像数字一样排序（`'2'` 在 `'10'`\
  \ 之前）：\n\n```\n[](#cb855-1)const arr = [];\n[](#cb855-2)arr.prop = true;\n[](#cb855-3)arr[1]\
  \ = 'b';\n[](#cb855-4)arr[0] = 'a';\n\n[](#cb855-6)assert.deepEqual(\n[](#cb855-7)\
  \  Object.keys(arr),\n[](#cb855-8)  ['0', '1', 'prop']);\n```\n\n注意 `.length`、`.entries()`\
  \ 和 `.keys()` 将 `Array` 索引视为数字并忽略非索引属性：\n\n```\n[](#cb856-1)assert.equal(arr.length,\
  \ 2);\n[](#cb856-2)assert.deepEqual(\n[](#cb856-3)  [...arr.keys()], [0, 1]);\n\
  [](#cb856-4)assert.deepEqual(\n[](#cb856-5)  [...arr.entries()], [[0, 1]]);\n```\n\
  \n### 33.8.2 稀疏数组\n\n如果 `Array` 具有空位（未赋值值的索引），则稀疏数组。\n\n```\n[](#cb857-1)const arr\
  \ = [1, , 3];\n[](#cb857-2)console.log(arr.length); // 3\n[](#cb857-3)console.log(1\
  \ in arr); // false\n[](#cb857-4)console.log(arr[1]); // undefined\n```\n\n空位可以通过几种方式创建：\n\
  \n1. **数组字面量**：`[1, , 3]`\n2. **赋值给高索引**：`arr[5] = 1`\n3. **`delete` 运算符**：`delete\
  \ arr[1]`\n4. **Array 构造函数**：`new Array(3)`\n\n不同方法处理空位的方式不同：\n\n- `forEach`、`map`、`filter`\
  \ 跳过空位。\n- `join`、`entries`、`values` 将空位视为 `undefined`。\n- 扩展运算符 `...` 和 `Array.from()`\
  \ 将空位转换为 `undefined`。\n\n### 33.8.3 Array.prototype.hasOwnProperty()\n\n`hasOwnProperty()`\
  \ 方法返回一个布尔值，指示对象是否拥有该属性。\n\n```\n[](#cb858-1)const arr = [1, , 3];\n[](#cb858-2)arr.hasOwnProperty(1);\
  \ // false\n```\n\n### 33.8.4 Array.prototype.slice()\n\n`slice()` 方法将 `Array` 的部分浅拷贝到一个新的\
  \ `Array` 对象中。\n\n```\n[](#cb859-1)const arr = [1, , 3];\n[](#cb859-2)arr.slice(0,\
  \ 2); // [1, undefined]\n```\n\n### 33.8.5 Array.prototype.splice()\n\n`splice()`\
  \ 方法通过删除或添加新元素来更改数组的内容。\n\n```\n[](#cb860-1)const arr = [1, 2, 3];\n[](#cb860-2)arr.splice(1,\
  \ 1, 4, 5); // 删除索引 1 处的元素，插入 4 和 5\n[](#cb860-3)arr; // [1, 4, 5, 3]\n```\n\n###\
  \ 33.8.6 Array.prototype.sort()\n\n`sort()` 方法就地排序 `Array` 的元素并返回排序后的数组。默认，它将元素视为字符串。\n\
  \n```\n[](#cb861-1)const arr = [1, 10, 2];\n[](#cb861-2)arr.sort((a, b) => a - b);\
  \ // [1, 2, 10]\n```\n\n### 33.8.7 Array.prototype.reverse()\n\n`reverse()` 方法就地反转元素的顺序并返回反转后的数组。\n\
  \n```\n[](#cb862-1)const arr = [1, 2, 3];\n[](#cb862-2)arr.reverse(); // [3, 2,\
  \ 1]\n```\n\n### 33.8.8 Array.prototype.indexOf()\n\n`indexOf()` 方法返回给定元素在数组中找到的索引，如果不存在则返回\
  \ -1。\n\n```\n[](#cb863-1)const arr = [1, 2, 3];\n[](#cb863-2)arr.indexOf(2); //\
  \ 1\n[](#cb863-3)arr.indexOf(4); // -1\n```\n\n### 33.8.9 Array.prototype.includes()\n\
  \n如果 `Array` 包含某个元素，`includes()` 返回 `true`，否则返回 `false`。\n\n```\n[](#cb864-1)const\
  \ arr = [1, 2, 3];\n[](#cb864-2)arr.includes(2); // true\n[](#cb864-3)arr.includes(4);\
  \ // false\n```\n\n### 33.8.10 Array.prototype.find()\n\n`find()` 方法返回数组中找到的满足测试函数的第一个值。\n\
  \n```\n[](#cb865-1)const arr = [1, 12, 51, 23];\n[](#cb865-2)arr.find(element =>\
  \ element > 10); // 12\n```\n\n### 33.8.11 Array.prototype.findIndex()\n\n`findIndex()`\
  \ 方法返回数组中找到的满足测试函数的索引。\n\n```\n[](#cb866-1)const arr = [1, 12, 51, 23];\n[](#cb866-2)arr.findIndex(element\
  \ => element > 10); // 1\n```\n\n### 33.8.12 Array.prototype.every()\n\n`every()`\
  \ 方法测试数组中的所有元素是否通过由函数实现的测试。\n\n```\n[](#cb867-1)const arr = [1, 2, 3];\n[](#cb867-2)arr.every(element\
  \ => element > 0); // true\n[](#cb867-3)arr.every(element => element > 1); // false\n\
  ```\n\n### 33.8.13 Array.prototype.some()\n\n`some()` 方法测试数组中至少有一个元素通过了由函数实现的测试。\n\
  \n```\n[](#cb868-1)const arr = [1, 2, 3];\n[](#cb868-2)arr.some(element => element\
  \ > 2); // true\n[](#cb868-3)arr.some(element => element > 4); // false\n```\n\n\
  ### 33.8.14 Array.prototype.filter()\n\n`filter()` 方法创建一个新数组，其中包含数组中所有通过函数实现的测试的元素。\n\
  \n```\n[](#cb869-1)const arr = [1, 12, 51, 23];\n[](#cb869-2)arr.filter(element\
  \ => element > 10); // [12, 51, 23]\n```\n\n### 33.8.15 Array.prototype.reduce()\n\
  \n`reduce()` 方法在数组的每个元素上执行用户提供的回调函数，产生单个输出值。\n\n```\n[](#cb870-1)const arr = [1,\
  \ 2, 3];\n[](#cb870-2)arr.reduce((accumulator, current) => accumulator + current,\
  \ 0); // 6\n```\n\n### 33.8.16 Array.prototype.reduceRight()\n\n`reduceRight()`\
  \ 方法从右向左对数组的每个元素执行用户提供的回调函数，产生单个输出值。\n\n```\n[](#cb871-1)const arr = [1, 2, 3];\n\
  [](#cb871-2)arr.reduceRight((accumulator, current) => accumulator + current, 0);\
  \ // 6\n```\n\n### 33.8.17 Array.prototype.concat()\n\n`concat()` 方法合并两个或多个数组。返回一个新的数组，不改变现有数组。\n\
  \n```\n[](#cb872-1)const arr = [1, 2];\n[](#cb872-2)const arr2 = [3, 4];\n[](#cb872-3)arr1.concat(arr2);\
  \ // [1, 2, 3, 4]\n```\n\n### 33.8.18 Array.prototype.join()\n\n`join()` 方法通过连接数组的所有元素创建一个字符串。\n\
  \n```\n[](#cb873-1)const arr = [1, 2, 3];\n[](#cb873-2)arr.join(\"-\"); // \"1-2-3\"\
  \n```\n\n### 33.8.19 Array.prototype.toString()\n\n`toString()` 方法返回 `Array` 的字符串表示。\n\
  \n```\n[](#cb874-1)const arr = [1, 2, 3];\n[](#cb874-2)arr.toString(); // \"1,2,3\"\
  \n```\n\n### 33.8.20 Array.prototype.flat()\n\n`flat()` 方法根据指定的深度将子数组元素递归地合并到一个新数组中。\n\
  \n```\n[](#cb875-1)const arr = [1, 2, [3, 4]];\n[](#cb875-2)arr.flat(); // [1, 2,\
  \ 3, 4]\n```\n\n### 33.8.21 Array.prototype.flatMap()\n\n`flatMap()` 方法等同于调用 `map()`\
  \ 后调用深度为 1 的 `flat()`。\n\n```\n[](#cb876-1)const arr = [1, 2, 3, 4];\n[](#cb876-2)arr.flatMap(x\
  \ => [x, x]); // [1, 1, 2, 2, 3, 3, 4, 4]\n```\n\n### 33.8.22 Array.prototype.fill()\n\
  \n`fill()` 方法用静态值填充数组中的元素。\n\n```\n[](#cb877-1)const arr = [1, 2, 3];\n[](#cb877-2)arr.fill(0);\
  \ // [0, 0, 0]\n```\n\n### 33.8.23 Array.prototype.findLast()\n\n`findLast()` 方法返回数组中最后一个满足测试函数的元素。\n\
  \n```\n[](#cb878-1)const arr = [1, 12, 51, 23];\n[](#cb878-2)arr.findLast(element\
  \ => element > 10); // 23\n```\n\n### 33.8.24 Array.prototype.findIndexLast()\n\n\
  `findIndexLast()` 方法返回数组中最后一个满足测试函数的索引。\n\n```\n[](#cb879-1)const arr = [1, 12,\
  \ 51, 23];\n[](#cb879-2)arr.findIndexLast(element => element > 10); // 3\n```\n\n\
  ### 33.8.25 Array.prototype.copyWithin()\n\n`copyWithin()` 方法将数组的一个部分浅拷贝到同一数组的另一部分。\n\
  \n```\n[](#cb880-1)const arr = [1, 2, 3, 4, 5];\n[](#cb880-2)arr.copyWithin(0, 3);\
  \ // [4, 5, 3, 4, 5]\n```\n\n\n\n\n\n```javascript\nconst arr1 = ['a', 'b'];\nassert.deepEqual(\n\
  \  ['x', 'y', ...arr1], // prepend single elements\n  ['x', 'y', 'a', 'b']);\nassert.deepEqual(arr1,\
  \ ['a', 'b']); // unchanged!\n\nconst arr2 = ['a', 'b'];\nassert.deepEqual(\n  [...['x',\
  \ 'y'], ...arr2], // prepend Array\n  ['x', 'y', 'a', 'b']);\nassert.deepEqual(arr2,\
  \ ['a', 'b']); // unchanged!\n```\n\n### 33.9.2 添加元素和数组\n\n在以下代码中，我们通过破坏性方式将单个元素添加到\
  \ `arr1`，并将一个 `Array` 添加到 `arr2`：\n\n```javascript\nconst arr1 = ['a', 'b'];\narr1.push('x',\
  \ 'y'); // append single elements\nassert.deepEqual(arr1, ['a', 'b', 'x', 'y']);\n\
  \nconst arr2 = ['a', 'b'];\narr2.push(...['x', 'y']); // append Array\nassert.deepEqual(arr2,\
  \ ['a', 'b', 'x', 'y']);\n```\n\n展开操作允许我们将一个 `Array` 推入 `arr2`。\n\n非破坏性添加通过扩展元素来完成：\n\
  \n```javascript\nconst arr1 = ['a', 'b'];\nassert.deepEqual(\n  [...arr1, 'x', 'y'],\
  \ // append single elements\n  ['a', 'b', 'x', 'y']);\nassert.deepEqual(arr1, ['a',\
  \ 'b']); // unchanged!\n\nconst arr2 = ['a', 'b'];\nassert.deepEqual(\n  [...arr2,\
  \ ...['x', 'y']], // append Array\n  ['a', 'b', 'x', 'y']);\nassert.deepEqual(arr2,\
  \ ['a', 'b']); // unchanged!\n```\n\n### 33.9.3 移除元素\n\n以下是移除数组元素的种破坏性方式：\n\n```javascript\n\
  // 破坏性地移除第一个元素：\nconst arr1 = ['a', 'b', 'c'];\nassert.equal(arr1.shift(), 'a');\n\
  assert.deepEqual(arr1, ['b', 'c']);\n\n// 破坏性地移除最后一个元素：\nconst arr2 = ['a', 'b',\
  \ 'c'];\nassert.equal(arr2.pop(), 'c');\nassert.deepEqual(arr2, ['a', 'b']);\n\n\
  // 在任何位置移除一个或多个元素：\nconst arr3 = ['a', 'b', 'c', 'd'];\nassert.deepEqual(arr3.splice(1,\
  \ 2), ['b', 'c']);\nassert.deepEqual(arr3, ['a', 'd']);\n```\n\n`.splice()` 在本章末尾快速参考中有更详细的介绍。\n\
  \n通过剩余元素进行解构允许你非破坏性地从 `Array` 开始移除元素（解构将在稍后 介绍）。\n\n```javascript\nconst arr1 =\
  \ ['a', 'b', 'c'];\n// 忽略第一个元素，提取剩余元素\nconst [, ...arr2] = arr1;\n\nassert.deepEqual(arr2,\
  \ ['b', 'c']);\nassert.deepEqual(arr1, ['a', 'b', 'c']); // unchanged!\n```\n\n\
  遗憾的是，剩余元素必须位于 `Array` 的最后位置。因此，你只能将其用于提取。\n\n练习：通过数组实现队列\n`exercises/arrays/queue_via_array.js`\n\
  \n## 33.10 方法：迭代与转换 (`.find()`, `.map()`, `.filter()`)\n\n在本节中，我们将查看用于迭代和转换 `Arrays`的方法。\n\
  \n### 33.10.1 回调函数\n\n所有的迭代和转换方法都使用回调函数。前者将所有值传递给回调函数；后者询问如何进行转换。这些回调函数的签名如下：\n\n\
  `(value: T, index: number, array: T)`\n\n也就是说，`callback` 接收三个参数：\n* `value` 是最重要的，当前正在处理的迭代值。\n\
  * `index` 可以额外告知迭代值的索引。\n* `array` 指向方法调用的接收者。`callback` 预期的返回值取决于它传递给哪个方法：\n\n\
  * `.map()` 用其 `callback` 返回的值填充结果。\n* `.find()` 返回 `callback` 返回真值的第一个元素（如果找不到则返回\
  \ `undefined`）。\n\n### 33.10.2 `.map()`\n\n`Array.prototype.map()` 的类型为：\n\n```typescript\n\
  map<U>(callback: (value: T, index: number, array: T[]) => U, thisValue?: any): U[]\n\
  ```\n\n`.map()` 和 `.flatMap()` 都接受一个 `callback` 作为参数，该回调控制输入 `Array` 如何被转换：\n\n\
  * 使用 `.map()`，每个输入元素被转换成恰好一个输出元素。也就是说，`callback` 返回一个单一值。\n* 使用 `.flatMap()`，每个输入元素被转换成零或多个输出元素。也就是说，`callback`\
  \ 返回一个值数组（它也可以返回非数组值，但这种情况很少见）。\n\n这是 `.flatMap()` 的实际用法：\n\n```javascript\n['a',\
  \ 'b', 'c'].flatMap(x => [x,x]) // ['a', 'a', 'b', 'b', 'c', 'c']\n['a', 'b', 'c'].flatMap(x\
  \ => [x])   // ['a', 'b', 'c']\n['a', 'b', 'c'].flatMap(x => [])     // []\n```\n\
  \n#### 33.10.4.1 简单实现\n\n你可以如下所示实现 `.flatMap()`。注意：此实现比内置版本简单，例如，它执行了更多的检查。\n\n\
  ```javascript\nfunction flatMap(arr, mapFunc) {\n  const result = [];\n  for (const\
  \ [index, elem] of arr.entries()) {\n    const x = mapFunc(elem, index, arr);\n\
  \    // 我们允许 mapFunc() 返回非数组\n    if (Array.isArray(x)) {\n      result.push(...x);\n\
  \    } else {\n      result.push(x);\n    }\n  }\n  return result;\n}\n```\n\n`.flatMap()`\
  \ 有什么用？让我们来看看用例吧！\n\n#### 33.10.4.2 用例：同时进行过滤和映射\n\n\n\n\n\nArray 方法 `.map()` 的结果长度与其被调用的\
  \ Array 长度相同。这意味着，它的回调函数无法跳过不感兴趣的 Array 元素。`.flatMap()` 能够做到这一点，这种能力在接下来的示例中非常用用。\n\
  \n我们将使用以下函数 `processArray()` 来创建一个 Array，然后通过 `.flatMap()` 对其进行过滤（filter）和映射（map）：\n\
  \n\n\n```javascript\nfunction processArray(arr, callback) {\n  return arr.map(x\
  \ => {\n    try {\n      return { value: callback(x) };\n    } catch (e) {\n   \
  \   return { error: e };\n    }\n  });\n}\n```\n\n接下来，我们通过 `processArray()` 创建一个名为\
  \ `results` 的 Array：\n\n```javascript\nconst results = processArray([1, -5, 6],\
  \ throwIfNegative);\nassert.deepEqual(results, [\n  { value: 1 },\n  { error: new\
  \ Error('Illegal value: -5') },\n  { value: 6 },\n]);\n\nfunction throwIfNegative(value)\
  \ {\n  if (value < 0) {\n    throw new Error('Illegal value: '+value);\n  }\n  return\
  \ value;\n}\n```\n\n现在我们可以使用 `.flatMap()` 从 `results` 中仅提取值或仅提取错误：\n\n```javascript\n\
  const values = results.flatMap(\n  result => result.value ? [result.value] : []);\n\
  assert.deepEqual(values, [1, 6]);\n\nconst errors = results.flatMap(\n  result =>\
  \ result.error ? [result.error] : []);\nassert.deepEqual(errors, [new Error('Illegal\
  \ value: -5')]);\n```\n\n### 33.10.4.3 用例：映射到多个值\n\nArray 方法 `.map()` 将每个输入的 Array\
  \ 元素映射到一个输出元素。但如果我们想将其映射到多个输出元素呢？\n\n这在下面的示例中就变得必要了：\n\n```javascript\n> stringsToCodePoints(['many',\
  \ 'a', 'moon'])\n['m', 'a', 'n', 'y', 'a', 'm', 'o', 'o', 'n']\n```\n\n我们想要将字符串\
  \ Array 转换为 Unicode 字符 Array（码点）。以下函数通过 `.flatMap()` 实现了这一点：\n\n```javascript\n\
  function stringsToCodePoints(strs) {\n  return strs.flatMap(str => [...str]);\n\
  }\n```\n\n![](img/file6.svg) **练习：`.flatMap()`**\n\n* `exercises/arrays/convert_to_numbers_test.mjs`\n\
  * `exercises/arrays/replace_objects_test.mjs`\n\n### 33.10.5 `.filter()`：只保留部分元素\n\
  \nArray 方法 `.filter()` 返回一个 Array，收集所有回调函数返回真值（truthy）的元素。\n\n例如：\n\n```javascript\n\
  > [-1, 2, 5, -7, 6].filter(x => x >= 0)\n[ 2, 5, 6 ]\n> ['a', 'b', 'c', 'd'].filter((_x,i)\
  \ => (i%2)===0)\n[ 'a', 'c' ]\n```\n\n`.filter()` 可以按如下实现：\n\n```javascript\nfunction\
  \ filter(arr, filterFunc) {\n  const result = [];\n  for (const [i, x] of arr.entries())\
  \ {\n    if (filterFunc(x, i, arr)) {\n      result.push(x);\n    }\n  }\n  return\
  \ result;\n}\n```\n\n![](img/file6.svg) **练习：通过 `.filter()` 空行**\n\n`exercises/arrays/remove_empty_lines_filter_test.mjs`\n\
  \n### 33.10.6 `.reduce()`：从 Array 派生值（进阶）\n\n方法 `.reduce()` 是一个计算 Array `arr` “摘要”的强力工具。摘要可以是任何类型的值：\n\
  \n* 数字。例如，`arr` 所有元素的和。\n* 一个 Array。例如，`arr` 的拷贝，其中每个元素都是原始元素的两倍。\n* 等。\n\n`reduce`\
  \ 在函数式编程中也被称为 `foldl`（左折叠），并在那里非常流行。注意事项是它可能会让代码难以理解。\n\n`.reduce()` 具有以下类型签名（在\
  \ `Array<T>` 内部）：\n\n```javascript\n.reduce<U>(\n  callback: (accumulator: U, element:\
  \ T, index: number, array: T[]) => U,\n  init?: U)\n  : U\n```\n\n`T` 是 Array 元素的类型，`U`\
  \ 是摘要的类型。两者可能相同也可能不同。`accumulator` 只是“摘要”的另一个名称。\n\n为了计算 Array `arr` 的摘要，`.reduce()`\
  \ 将所有的 Array 元素逐传入 `callback`：\n\n```javascript\naccumulator_0 = callback(init,\
  \ arr[0]);\naccumulator_1 = callback(accumulator_0, arr[1]);\naccumulator_2 = callback(accumulator_1,\
  \ arr[2]);\n```\n\n`.reduce()` 将摘要（存储在 `accumulator` 中）与下一个元素结合。`.reduce()` 的结果是回调函数\
  \ 访问所有元素后的最终积累器。换句话说，`.reduce()` 被称为“折叠”（fold）。\n\n#### 33.10.6.1 用例：数字求和\n\n让我们来看一个\
  \ `.reduce()` 的运行示例：\n\n```javascript\nfunction addAll(arr) {\n  const startSum\
  \ = 0;\n  const callback = (sum, element) => sum + element;\n  return arr.reduce(callback,\
  \ startSum);\n}\nassert.equal(addAll([1, 2, 3]), 6);\n```\n\n或者，我们可以通过 `for` 循环实现\
  \ `addAll()`：\n\n```javascript\nfunction addAll(arr) {\n  let sum = 0;\n  for (const\
  \ element of arr) {\n    sum = sum + element;\n  }\n  return sum;\n}\n```\n\n很难说这两种实现中哪种更好：基于\
  \ `.reduce()` 的实现更简洁，而基于 `for` 的实现可能更容易理解——特别是当你不熟悉函数式编程时。\n\n### 33.10.6.2 示例：通过\
  \ `.reduce()` 查找索引\n\n以下函数是 Array 方法 `.indexOf()` 的实现。它返回 `searchValue` 在 `arr`\
  \ 中首次出现的索引：\n\n```javascript\nconst NOT_FOUND = -1;\nfunction indexOf(arr, searchValue)\
  \ {\n  return arr.reduce(\n    (result, elem, index) => {\n      if (result !==\
  \ NOT_FOUND) {\n        // 我们已经找到了东西：不要改变任何\n        return result;\n      } else\
  \ if (elem === searchValue) {\n        return index;\n      } else {\n        return\
  \ NOT_FOUND;\n      }\n    },\n    NOT_FOUND);\n}\nassert.equal(indexOf(['a', 'b',\
  \ 'c'], 'b'), 1);\nassert.equal(indexOf(['a', 'b', 'c'], 'x'), -1);\n```\n\n`.reduce()`\
  \ 的局限性之一是你无法提前结束（在 `for` 循环中，你可以 `break`）。在这里，一旦找到结果，我们也立即返回。\n\n#### 33.10.6.3\
  \ 示例：双倍 Array 元素\n\n函数 `double(arr)` 返回 `inArr` 的拷贝，其所有元素都乘以 2：\n\n\n\n\n```javascript\n\
  function double(inArr) {\n  return inArr.reduce(\n    (outArr, element) => {\n \
  \     outArr.push(element * 2);\n      return outArr;\n    },\n    []);\n}\nassert.deepEqual(\n\
  \  double([1, 2, 3]),\n  [2, 4, 6]);\n```\n\nWe modify the initial value `[]` by\
  \ pushing into it. A non-destructive, functional version of `double()` looks as\
  \ follows:\n\n```javascript\nfunction double(inArr) {\n  return inArr.reduce(\n\
  \    (outArr, element) => {\n      // Don’t change `outArr`, return a fresh Array\n\
  \      return [...outArr, element * 2];\n    },\n    []);\n}\nassert.deepEqual(\n\
  \  double([1, 2, 3]),\n  [2, 4, 6]);\n```\n\nThis version is more elegant but also\
  \ slower and uses more memory.![](img/file6.svg) **Exercises: `.reduce()`**\n\n\
  * `map()` via `.reduce()`: `exercises/arrays/map_reduce_test.mjs`\n* `filter()`\
  \ via `.reduce()`: `exercises/arrays/filter_reduce_test.mjs`\n* `countMatches()`\
  \ via `.reduce()`: `exercises/arrays/count_matches_reduce_test.mjs`\n\n## 33.11\
  \ `.sort()`: sorting Arrays\n\n`.sort()` has the following definition:\n\n```typescript\n\
  sort(compareFunc?: (a: T, b: T) => number): this\n```\n\nBy default, `.sort()` sorts\
  \ string representations of the elements. These are compared via the `<` operator\
  \ lexicographically (the first characters are most significant). You can see that\
  \ when sorting numbers:\n\n```javascript\n> [200, 3, 10].sort()\n[10, 200, 3]\n\
  ```\n\nWhen sorting strings, you need to be aware that they are compared according\
  \ to their unit values (char codes):\n\n```javascript\n> ['pie', 'cookie', 'éclair',\
  \ 'Pie', 'Éclair'].sort()\n['Cookie', 'Éclair', 'éclair', 'cookie', 'pie']\n```\n\
  \nAs you can see, all uppercase letters come before all lowercase letters, which\
  \ come before accented letters. Use `Intl`, [the JavaScript internationalization\
  \ API](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Intl),\
  \ if you want proper sorting for languages.\n\nNote that `.sort()` sorts in place;\
  \ it changes and returns its receiver:\n\n```javascript\n> arr = ['a', 'c', 'b'];\n\
  > arr.sort() === arr\ntrue\n> arr\n['a', 'b', 'c']\n```\n\n### 33.11.1 Customizing\
  \ the sort order\n\nYou can customize sort order via the `compareFunc` parameter,\
  \ which must return a number that is:\n\n* negative if `a < b`\n* zero if `a ===\
  \ b`\n* positive if `a > b`\n\n![](img/file2.svg) **Tip for remembering these rules**\n\
  \nA negative number is less than zero (etc.).\n\n### 33.11.2 Sorting numbers\n\n\
  You can use this helper function to sort numbers:\n\n```javascript\nfunction compareNumbers(a,\
  \ b) {\n  if (a < b) {\n    return -1;\n  } else if (a === b) {\n    return 0;\n\
  \  } else {\n    return 1;\n  }\n}\nassert.deepEqual(\n  [200, 3, 10].sort(compareNumbers),\n\
  \  [3, 10, 200]);\n```\n\nThe following is a quick and dirty alternative:\n\n```javascript\n\
  > [200, 3, 10].sort((a, b) => a - b)\n[3, 10, 200]\n```\n\nThe downsides of this\
  \ approach are:\n\n* It is cryptic.\n* There is risk of numeric overflow or underflow\
  \ if `a-b` becomes a large positive or negative number.\n\n### 33.11.3 Sorting objects\n\
  \nYou also need to use a compare function if you want to sort objects. For example,\
  \ the following code shows how to sort objects by age:\n\n```javascript\nconst arr\
  \ = [{age: 200}, {age: 3}, {age: 10}];\narr.sort((obj1, obj2) => obj1.age - obj2.age),\n\
  [{ age: 3 }, { age: 10 }, { age: 200 }];\n```\n\n![](img/file6.svg) **Exercise:\
  \ Sorting objects by name**\n\n`exercises/arrays/sort_objects.mjs`\n\n## 33.12 Quick\
  \ reference: `Array<T>`\n\nLegend:\n\n* `R`: method does not change the Array (non-destructive).\n\
  * `W`: method changes the Array (destructive).\n\n### 33.12.1 `new Array()`\n\n\
  `new Array(n)` creates an Array of length `n` that contains holes: Trailing commas\
  \ are always ignored. Therefore: number of commas = holes `assert.deepEqual(new\
  \ Array(3), [,,]);`.\n\n`new Array()` creates an empty Array. However, I recommend\
  \ always using `[]` instead.\n\n### 33.12.2 Static methods of `Array`\n\n* `Array.from<T>(iterable:\
  \ Iterable<T> | ArrayLike<T>): T[]`\nConverts an iterable or Array-like object to\
  \ an Array. Optionally, the input values can be translated via `mapFunc` before\
  \ they are added to the output Array.\nExamples:\n\n```javascript\n> Array.from(['a',\
  \ 'b']) // iterable\n['a', 'b']\n> Array.from({length: 2, 0:'a', 1:'b'}) // Array-like\
  \ object\n['a', 'b']\n```\n\n* `Array.of<T>(...items: T): T[]`\nThis static method\
  \ is mainly useful for subclasses of `Array`, where it serves as a custom Array\
  \ literal:\n\n```javascript\nclass MyArray extends Array {}\nassert.equal(MyArray.of('a',\
  \ 'b') instanceof MyArray, true);\n```\n\n### 33.12.3 Methods of `Array<T>.prototype`\n\
  \n* `.concat(...items: Array<T[] | T>): T[]`\nReturns a new Array that is the concatenation\
  \ of the receiver and all `items`. Non-Array parameters (such as `'b'` in the following\
  \ example) are treated as if they were Arrays with single elements.\n\n```javascript\n\
  > ['a'].concat('b', ['c', 'd'])\n['a', 'b', 'c', 'd']\n```\n\n* `.copyWithin(target:\
  \ number, start: number, end=this.length): this`\nCopies the elements whose indices\
  \ range from (including) `start` to (excluding) `end` to indices starting with `target`.\
  \ Overlapping is handled correctly.\n\n```javascript\n> ['a', 'b', 'c', 'd'].copyWithin(0,\
  \ 2)\n['c', 'd']\n```\n\nIf `start` or `end` is negative, then `.length` is added\
  \ to it.\n\n* `.entries(): Iterable<[number, T]>`\nReturns an iterable over `[index,\
  \ element]` pairs.\n\n```javascript\n> Array.from(['a', 'b'].entries())\n[[0, 'a'],\
  \ [1, 'b']]\n```\n\n* `.every(callback: (value: T, index: number, array: Array<T>)\
  \ => boolean, thisArg?: any): boolean`\nReturns `true` if `callback` returns a truthy\
  \ value for every element. Otherwise, it returns `false`. It stops as soon as it\
  \ receives a falsy value. This method corresponds to universal quantification (“for\
  \ all”, `∀`) in mathematics.\n\n```javascript\n> [1, 2, 3].every(x => x > 0)\ntrue\n\
  > [1, -2, 3].every(x => x > 0)\nfalse\n```\n\nRelated method: `.some()` (“exists”).\n\
  \n* `.fill(value: T, start=0, end=this.length): this`\nAssigns `value` to every\
  \ index between (including) `start` and (excluding) `end`.\n\n```javascript\n> [0,\
  \ 1, 2].fill('a')\n['a', 'a', 'a']\n```\n\nCaveat: Don’t use this method to fill\
  \ an Array with an object `obj`; then each element will refer to `obj` (sharing\
  \ it). In this case, it’s better to use `Array.from()`.\n\n* `.filter(callback:\
  \ (value: T, index: number, array: Array<T>) => any, thisArg?: any): T[]`\nReturns\
  \ an Array with only those elements for which `callback` returns a truthy value.\n\
  \n```javascript\n> [1, -2, 3].filter(x => x > 0)\n[1, 3]\n```\n\n* `.find(predicate:\
  \ (value: T, index: number, obj: T[]) => boolean, thisArg?: any): T | undefined`\n\
  The result is the first element for which `predicate` returns a truthy value. If\
  \ there is no such element, the result is `undefined`.\n\n```javascript\n> [1, -2,\
  \ 3].find(x => x < 0)\n-2\n> [1, 2, 3].find(x => x < 0)\nundefined\n```\n\n* `.findIndex(predicate:\
  \ (value: T, index: number, obj: T[]) => boolean, thisArg?: any): number`\n\n\n\n\
  \n\n结果是第一个让 `predicate` 返回真值的元素的索引。如果没有这样的元素，结果为 `-1`。\n\n```\n> [1, -2, 3].findIndex(x\
  \ => x < 0)\n1\n> [1, 2, 3].findIndex(x => x < 0)\n-1\n```\n\n*   `.flat(depth =\
  \ 1): any[]` ^([R, ES2019])\n\n    “平坦化”一个数组：它会进入输入数组内部嵌套的数组，并创建一个副本，将所有在 `depth`\
  \ 层或更深层找到的值都移动到顶层。\n\n```\n> [ 1,2, [3,4], [[5,6]] ].flat(0) // no change\n[ 1,\
  \ 2, [3,4], [[5,6]] ]\n\n> [ 1,2, [3,4], [[5,6]] ].flat(1)\n[1, 2, 3, 4, [5,6]]\n\
  \n> [ 1,2, [3,4], [[5,6]] ].flat(2)\n[1, 2, 3, 4, 5, 6]\n```\n\n*   `.flatMap<U>(callback:\
  \ (value: T, index: number, array: T[]) => U|Array<U>, thisValue?: any): U[]` ^([R,\
  \ ES2019])\n\n    结果通过对原始数组的每个元素调用 `callback()` 并拼接其返回的数组产生。\n\n```\n> ['a', 'b',\
  \ 'c'].flatMap(x => [x,x])\n[ 'a', 'a', 'b', 'b', 'c', 'c' ]\n> ['a', 'b', 'c'].flatMap(x\
  \ => [x])\n[ 'a', 'b', 'c' ]\n> ['a', 'b', 'c'].flatMap(x => [])\n[]\n```\n\n* \
  \  `.forEach(callback: (value: T, index: number, array: Array<T>) => void, thisArg?:\
  \ any): void` ^([R, ES5])\n\n    为每个元素调用 `callback`。\n\n```\n[](#cb917-1)['a', 'b'].forEach((x,\
  \ i) => console.log(x, i))\n[](#cb917-2)\n[](#cb917-3)// Output:\n[](#cb917-4)//\
  \ 'a', 0\n[](#cb917-5)// 'b', 1\n```\n\n    `for-of` 循环通常是更好的选择：它更快，支持 `break` 并且可以遍历任意迭代器。\n\
  \n*   `.includes(searchElement: T, fromIndex=0): boolean` ^([R, ES2016])\n\n   \
  \ 如果接收者拥有值为 `searchElement` 的元素，则返回 `true`，否则返回 `false`。搜索从索引 `fromIndex` 开始。\n\n\
  ```\n> [0, 1, 2].includes(1)\ntrue\n> [0, 1, 2].includes(5)\nfalse\n```\n\n*   `.indexOf(searchElement:\
  \ T, fromIndex=0): number` ^([R, ES5])\n\n    返回第一个严格等于 `searchElement` 的元素的索引。如果没有这样的元素，则返回\
  \ `-1`。从索引 `fromIndex` 开始搜索，依次访问更高的索引。\n\n```\n> ['a', 'b', 'a'].indexOf('a')\n\
  0\n> ['a', 'b', 'a'].indexOf('a', 1)\n2\n> ['a', 'b', 'a'].indexOf('c')\n-1\n```\n\
  \n*   `.join(separator = ','): string` ^([R, ES1])\n\n    通过拼接所有元素的字符串表示来创建一个字符串，并用\
  \ `separator` 分隔它们。\n\n```\n> ['a', 'b', 'c'].join('##')\n'a##b##c'\n> ['a', 'b',\
  \ 'c'].join()\n'a,b,c'\n```\n\n*   `.keys(): Iterable<number>` ^([R, ES6])\n\n \
  \   返回关于接收者键的迭代器。\n\n```\n> [...['a', 'b'].keys()]\n[ 0, 1 ]\n```\n\n*   `.lastIndexOf(searchElement:\
  \ T, fromIndex=this.length-1): number` ^([R, ES5])\n\n    返回最后一个严格等于 `searchElement`\
  \ 的元素的索引。如果没有这样的元素，则返回 `-1`。从索引 `fromIndex` 开始搜索，依次访问较低的索引。\n\n```\n> ['a', 'b',\
  \ 'a'].lastIndexOf('a')\n2\n> ['a', 'b', 'a'].lastIndexOf('a', 1)\n0\n> ['a', 'b',\
  \ 'a'].lastIndexOf('c')\n-1\n```\n\n*   `.map<U>(mapFunc: (value: T, index: number,\
  \ array: Array<T>) => U, thisArg?: any): U[]` ^([R, ES5])\n\n    返回一个新数组，其中每个元素都是将\
  \ `mapFunc` 应用于接收者对应元素的结果。\n\n```\n> [1, 2, 3].map(x => x * 2)\n[ 2, 4, 6 ]\n> ['a',\
  \ 'b', 'c'].map((x, i) => i)\n[ 0, 1, 2 ]\n```\n\n*   `.pop(): T | undefined` ^([W,\
  \ ES3])\n\n    移除并返回接收者的最后一个元素。`shift()` 的相反操作。\n\n```\n> arr = ['a', 'b', 'c'];\n\
  > arr.pop()\n'c'\n> arr\n[ 'a', 'b' ]\n```\n\n*   `.shift(): T | undefined` ^([W,\
  \ ES3])\n\n    移除并返回接收者的第一个元素。`pop()` 的相反操作。\n\n```\n> arr = ['a', 'b', 'c'];\n\
  > arr.shift()\n'a'\n> arr\n[ 'b', 'c' ]\n```\n\n*   `.push(...items: T): number`\
  \ ^([R, ES3])\n\n    在数组末尾添加一个多个元素并返回数组的新长度。\n\n```\n> arr = ['a', 'b'];\n> arr.push('c',\
  \ 'd')\n4\n> arr\n[ 'a', 'b', 'c', 'd' ]\n```\n\n*   `.slice(start=0, end=this.length):\
  \ T[]` ^([R, ES3])\n\n    返回接收者在 `start` 和 `end` 之间的元素的浅拷贝。\n\n```\n> ['a', 'b',\
  \ 'c', 'd'].slice(1, 3)\n[ 'b', 'c' ]\n> ['a', 'b', 'c', 'd'].slice(-2)\n[ 'c',\
  \ 'd' ]\n```\n\n*   `.splice(start, deleteCount, ...items: T): T[]` ^([R, ES5])\n\
  \n    通过删除现有元素和插入新元素来改变数组的内容。返回被删除元素的数组。\n\n```\n> arr = ['a', 'b', 'c', 'd'];\n\
  > arr.splice(1, 2, 'e', 'f')\n[ 'b', 'c' ]\n> arr\n[ 'a', 'e', 'f', 'd' ]\n```\n\
  \n*   `.reverse(): this` ^([W, ES3])\n\n    原地反转数组并返回数组的引用。\n\n```\n> arr = ['a',\
  \ 'b', 'c'];\n> arr.reverse()\n[ 'c', 'b', 'a' ]\n```\n\n*   `.some(callback: (value:\
  \ T, index: number, array: T) => boolean, thisArg?: any): boolean` ^([R, ES5])\n\
  \n    如果 `callback` 对至少一个元素返回真值，则返回 `true`。否则返回 `false`。它在接收到真值时就会停止。\n\n```\n>\
  \ [1, 2, 3].some(x => x < 0)\nfalse\n> [1, -2, 3].some(x => x < 0)\ntrue\n```\n\n\
  *   `.every(callback: (value: T, index: number, array: T) => boolean, thisArg?:\
  \ any): boolean` ^([R, ES5])\n\n    如果 `callback` 对数组中的所有元素都返回真值，则返回 `true`。否则返回\
  \ `false`。\n\n```\n> [1, 2, 3].every(x => x > 0)\ntrue\n> [1, 2, 3].every(x => x\
  \ > 1)\nfalse\n```\n\n*   `.filter(callback: (value: T, index: number, array: T)\
  \ => boolean, thisArg?: any): T[]` ^([R, ES5])\n\n    返回一个包含通过提供函数测试的新数组。\n\n```\n\
  > [1, 2, 3, 4].filter(x => x > 2)\n[ 3, 4 ]\n```\n\n*   `.forEach(callback: (value:\
  \ T, index: number, array: T) => void, thisArg?: any): void` ^([R, ES5])\n\n   \
  \ 为数组每个元素执行一次提供的函数。\n\n```\n['a', 'b'].forEach((x, i) => console.log(x, i))\n\"\
  a\" 0\n\"b\" 1\n```\n\n*   `.find(callback: (value: T, index: number, array: T)\
  \ => boolean, thisArg?: any): T | undefined` ^([R, ES6])\n\n    返回数组中满足提供的测试函数的第一个元素。如果没有找到值，则返回\
  \ `undefined`。\n\n```\n> [1, 2, 3].find(x => x > 2)\n3\n> [1, 2, 3].find(x => x\
  \ > 5)\nundefined\n```\n\n*   `.findIndex(callback: (value: T, index: number, array:\
  \ T) => boolean, thisArg?: any): number` ^([R, ES6])\n\n    返回数组中满足提供的测试函数的第一个元素的索引。如果没有找到元素，则返回\
  \ `-1`。\n\n```\n> [1, 2, 3].findIndex(x => x > 2)\n2\n> [1, 2, 3].findIndex(x =>\
  \ x > 5)\n-1\n```\n\n*   `.flatMap(callback: (value: T, index: number, array: T)\
  \ => U|Array<U>, thisArg?: any): U[]` ^([R, ES2019])\n\n    结果通过对原始数组的每个元素调用 `callback()`\
  \ 并拼接其返回的数组产生。\n\n```\n> ['a', 'b', 'c'].flatMap(x => [x,x])\n[ 'a', 'a', 'b', 'b',\
  \ 'c', 'c' ]\n```\n\n*   `.join(separator = ','): string` ^([R, ES1])\n\n    通过拼接所有元素的字符串表示来创建一个字符串，并用\
  \ `separator` 分隔它们。\n\n```\n> ['a', 'b', 'c'].join('##')\n'a##b##c'\n> ['a', 'b',\
  \ 'c'].join()\n'a,b,c'\n```\n\n*   `.keys(): Iterable<number>` ^([R, ES6])\n\n \
  \   返回关于接收者键的迭代器。\n\n```\n> [...['a', 'b'].keys()]\n[ 0, 1 ]\n```\n\n*   `.lastIndexOf(searchElement:\
  \ T, fromIndex=this.length-1): number` ^([R, ES5])\n\n    返回最后一个严格等于 `searchElement`\
  \ 的元素的索引。如果没有这样的元素，则返回 `-1`。从索引 `fromIndex` 开始搜索，依次访问较低的索引。\n\n```\n> ['a', 'b',\
  \ 'a'].lastIndexOf('a')\n2\n> ['a', 'b', 'a'].lastIndexOf('a', 1)\n0\n```\n\n* \
  \  `.map<U>(mapFunc: (value: T, index: number, array: Array<T>) => U, thisArg?:\
  \ any): U[]` ^([R, ES5])\n\n    返回一个新数组，其中每个元素都是将 `mapFunc` 应用于接收者对应元素的结果。\n\n```\n\
  > [1, 2, 3].map(x => x * 2)\n[ 2, 4, 6 ]\n> ['a', 'b', 'c'].map((x, i) => i)\n[\
  \ 0, 1, 2 ]\n```\n\n\n\n\n自 ECMAScript 2019 起，排序被保证是稳定的：如果元素在排序时被认为是相等的，那么排序不会改变这些元素的顺序（它们彼此之间）。\n\
  \n*   `.splice(start: number, deleteCount=this.length-start, ...items: T[]): T[]`\
  \ ^([W, ES3])\n\n  在索引 `start` 处，它删除了 `deleteCount` 个元素并插入 `items`。它返回被删除的元素。\n\n\
  ```\n> const arr = ['a', 'b', 'c', 'd'];\n> arr.splice(1, 2, 'x', 'y')\n[ 'b', 'c'\
  \ ]\n> arr\n[ 'a', 'x', 'y', 'd' ]\n```\n\n`start` 可以为负数，且如果是负数，则会加到 `.length`：\n\
  \n```\n> ['a', 'b', 'c'].splice(-2, 2)\n[ 'b', 'c' ]\n```\n\n*   `.toString(): string`\
  \ ^([R, ES1])\n\n  通过 `String()` 将所有元素转换为字符串，并将它们用逗号分隔后拼接，返回结果。\n\n```\n> [1, 2,\
  \ 3].toString()\n'1,2,3'\n> ['1', '2', '3'].toString()\n'1,2,3'\n> [].toString()\n\
  ''\n```\n\n*   `.unshift(...items: T[]): number` ^([W, ES3])\n\n  在接收者的开头插入 `items`\
  \ 并在修改后返回其长度。\n\n```\n> const arr = ['c', 'd'];\n> arr.unshift('e', 'f')\n4\n> arr\n\
  [ 'e', 'f', 'c', 'd' ]\n```\n\n*   `.values(): Iterable<T>` ^([R, ES6])\n\n  返回一个关于接收者值的迭代器。\n\
  \n```\n> [...['a', 'b'].values()]\n[ 'a', 'b' ]\n```\n\n### 33.12.4 来源\n\n*   [TypeScript\
