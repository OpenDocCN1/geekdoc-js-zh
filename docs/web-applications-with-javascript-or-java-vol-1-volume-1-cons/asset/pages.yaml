  md: '# 5.1 Classes with Properties and Methods


    In a UML class diagram, a class has a name (shown in the first compartment of
    the class rectangle), and it may have properties (shown in the second compartment)
    and methods (shown in the third compartment). Properties and methods may be described
    without details.The following diagrams illustrate these options using the example
    of a class books or Book for describing books as information objects.


    A class can be expressed in UML by just providing its name, without any further
    detail, like so


    ```

    books

    ```


    This option is useful for making sketches and overview diagrams. Using an ordinary
    English name like books makes the class diagram more readable for nontech-savvy
    people.


    A more informative description of a class is obtained by listing its properties,
    possibly without any further detail, like in the following example:


    | books |

    | isbn | title | year |


    For, better understanding the meaning of properties and for being able to code
    a class in an OO programming language, we need to know the range of each property,
    which is the type of its values. The range of a property can be either a primitive
    datatype or another class.


    In the following diagram we use general implementation-agnostic datatype names
    (like "Integer"), for which a specific programming language may have specific
    names (like "int" in Java). Notice that we use a common naming convention of giving
    classes a capitalized singular (mixed-case) name like Book (or LearningUnit).
    This allows saying that "an instance of a class C is a C(object)", like "an instance
    of Book is a book object".


    | Book |

    | isbn: String (id) |

    | title: String |

    | year: Integer |


    Notice how the standard identifier attribute isbn is marked with the keyword id
    appended to the property declaration in curly braces. This is the UML syntax for
    defining several kinds of property constraints discussed in the next chapter.'
