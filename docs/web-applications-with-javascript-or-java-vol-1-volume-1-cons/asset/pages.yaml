  md: '# 5 Information Modeling


    UML


    The Unified Modeling Language (UML¹), created in the mid-1990s, is an industry
    standard that defines a set of modeling languages for making various kinds of
    models and diagrams in support of object-oriented process analysis and software
    design. Its core languages are Class Diagrams for information/data modeling, and
    Sequence Diagrams, Activity Diagrams and State Diagrams (or State Charts) for
    process/behavior modeling.


    UML class diagrams provide a visual syntax for expressing UML class models, which
    can be used both at the abstract level of conceptual modeling for requirements
    engineering and at the more detailed level of design modeling for designing the
    model classes of an app. Their main building blocks are class rectangles and association
    lines.


    A class rectangle has one, two or three compartments, containing the name of the
    class, its properties, and methods. The purpose of a class is to classify objects
    and define its properties and the methods that can be invoked on.


    RDF and OWL


    The Resource Description Framework (RDF²) has been defined by the W3C in 2004
    as a logical formalism that allows (1) formalizing information models in the form
    of RDF vocabularies, and (2) representing propositional information (e.g., meta-data)
    on the Web. The core of a UML class model can be expressed as an RDF vocabulary.
    However, many types of integrity constraints cannot be expressed in RDF. The W3C
    has therefore defined an extension of RDF, called the Web Ontology Language (OWL³),
    which allows to formalize the core logic (classes, properties and integrity constraints)
    of a UML class model in the form of an ontology.


    An association line connects two class rectangles. The purpose of an association
    is to classify relationships (links) between objects. While UML classes have a
    direct counterpart in the class concepts of object-oriented programming (OOP)
    languages, UML associations do not have to understand for developers. Only in
    the special case of a unidirectional association there is a direct OOP counterpart:
    a reference property for the objects that are linked to a given object by the
    association.


    From a logical point of view, a class model defines a vocabulary, or language,
    for expressing various types of statements about objects. The knowledge representation
    languages RDF and OWL allow to formalize the vocabularies defined by class models
    and the statements made when instantiating their classes by creating objects.
    In this way, help to understand the semantics of information models.'
  merge: -1
  pgno: 108
