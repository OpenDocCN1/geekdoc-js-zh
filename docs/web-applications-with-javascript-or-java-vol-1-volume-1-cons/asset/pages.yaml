    book.isbn, book.title, book.year)}\"/>\n</div>\n</h:form>\n<ui:define>\n</ui:composition>\n\
    </html>\n```\n\nIn this template, a single selection list (that is, a single-select\
    \ HTML element) was created with the help of the JSF element h:selectOne, where\
    \ the selection list items (the HTML option elements) are defined by the JSF elements:\
    \ selectItem or f:selectItems. The value attribute of h:selectOne binds to the\
    \ value of the selected item (or element). The selection list is populated with\
    \ book records with the help of a f:selectItems bound to bookCtrl.books. The attributes\
    \ itemLabel and itemValue define the option elements' text and value.\n\nIn the\
    \ view, when the user selects a book from the selection list, the form fields\
    \ are filled with the (ISBN, title and year) properties of the selected book.\
    \ While the ISBN is immediately available in the view (on the front-end) as the\
    \ value of the selected option, the values of the title and year properties have\
    \ to be fetched from the back-end database. This can be done with the help of\
    \ the JSF ajax, which sends an HTTP request message for invoking a remote method,\
    \ bookCtrl.refreshObject, on the back-end using XHR. This method manages the managed\
    \ bean, and updates its title and year properties with the values retrieved from\
    \ the database. The code is the following:\n\n```\npublic class BookController\
    \ {\n\npublic void refreshObject(Book book) {\n  Book foundBook = Book.retrieve(em,\
    \ book.getIsbn());\n  book.setTitle(foundBook.getTitle());\n  book.setYear(foundBook.getYear());\n\
    }\n\n```\n\nTo enforce a refresh of the HTML form after the user's selection,\
    \ such that it displays the values of isbn, title and year, the f:ajax element\
    \ allows specifying form fields to be updated with the render attribute, in our\
    \ case, render=\"isbn title\".\n\nFinally, the h:commandButton element is used\
    \ for invoking the update action method of the BookController with the parameters\
    \ isbn, title and year, for making the changes persistent."
