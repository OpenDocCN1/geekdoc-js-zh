  md: '# # 1 A Quick Tour of the Foundations of Web Apps


    If you are already familiar with HTML, XML and JavaScript, you may skip this chapter
    and immediately start developing a minimal web application by going to the next
    chapter.


    # ## 1.1 The Wide Web (WWW)


    After the Internet had been established in the 1980s, Tim Berners-Lee developed
    the idea and the first implementation of the WWW in 1989 at the European research
    institution CERN in Geneva, Switzerland. The WWW (or, simply, “the Web”) is based
    on Internet technologies TCP/IP (the Internet Protocol) and DNS (the Domain Name
    System). Initially,


    +   - The Hypertext Transfer Protocol (HTTP),

    - The Hypertext Markup Language (HTML), and

    - web server programs, acting as HTTP servers, as well as ''user agents'' (such
    browsers), acting as HTTP clients.


    Later, further important technology components have been added to this set of
    web technologies:


    +   - the page/document language Cascading Style Sheets (CSS) in 1995,

    - the web programming language JavaScript in 1995,

    - the Extensible Markup Language (XML), as the basis of web formats (like SVG
    and RDF/XML), in 1998,

    - the XML-based Scalable Vector Graphics (SVG) format in 2001,

    - the Resource Description Framework (RDF) for knowledge representation on the
    Web in 2004.


    # ## 1.2 HTML and XML


    HTML allows to mark up (or) the structure of a human-readable web document or
    web user interface, while XML allows to mark up the structure of all kinds of
    documents, data files and messages, whether they are human-readable or not. XML
    can also be used as the basis for defining a version of HTML that is called XHTML.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.2.1 XML documents


    XML provides a syntax for expressing structured information in the form of an
    XML document with nested elements and their attributes. The specific elements
    and attributes used in an XML document can come from any vocabulary, such as public
    standards or (private) user-defined XML formats. XML is used for specifying


    +   - document formats, as HTML5, the Scalable Vector Graphics (SVG) format or
    the DocBook format,

    - data interchange file formats, as the Mathematical Markup Language (MathML)
    or the Universal Business Language (UBL),

    - message formats, as the web service message format SOAP


    # 1.2.2 Unicode and UTF-8


    XML is based on Unicode, which is a platform-independent character set that includes
    almost all characters from most of the world''s script languages including Hindi,
    Burmese and Gaelic. Each character is assigned a unique integer code in the range
    between 0 and 1,114,111. For example, the Greek letter π has the code 960, so
    it can be inserted in an XML document as π using the XML entity syntax.

    Unicode includes legacy character sets like ASCII and ISO-8859-1 (Latin-1) as
    subsets.


    The default encoding of an XML document is UTF-8, which uses only a single byte
    for ASCII characters, but three bytes for less common characters.


    Almost all Unicode characters are legal in a well-formed XML document. Illegal
    characters are the control characters with code 0 through 31, except for the carriage
    return, line feed and tab. It is dangerous to copy text from another (non-XML)
    text to an XML document (often, the form feed character creates a problem).


    # 1.2.3 XML namespaces


    Generally, namespaces help to avoid name conflicts. They allow to reuse the same
    (local) name in different namespace contexts. Many computational languages have
    some form of namespace concept, for instance, java and PHP.


    XML namespaces are identified with the help of a namespace URI, such as the SVG
    namespace URI "http://www.w3.org/2000/svg", which is associated with a namespace
    prefix, such as svg. Such a namespace represents a collection of names, for both
    elements and attributes, and allows namespace-qualified names'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'of the form prefix:name, such as svg:circle as a namespace-qualified name for
    SVG circle elements.


    A default namespace is declared in the start tag of an element in the following
    way:


    ```

    <html xmlns="http://www.w3.org/1999/xhtml">

    ```


    This example shows the start tag of the HTML root element, in which the XHTML
    namespace is declared as the default namespace.


    The following example shows an SVG namespace declaration for an svg element embedded
    in an HTML document:


    ```

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    </head>

    <body>

    <figure>

    <figcaption>Figure 1: A blue circle</figcaption>

    <svg xmlns:svg="http://www.w3.org/2000/svg">

    <svg:circle cx="100" cy="100" r="50" fill="blue"/>

    </svg:svg>

    </figure>

    </body>

    </html>

    ```


    # 1.2.4 Correct XML documents


    XML defines two syntactic correctness criteria. An XML document must be well-formed,
    and if it is based on a grammar (or schema), then it must also be valid with respect
    to that grammar, or in other words, satisfy all rules of the grammar.


    An XML document is called well-formed, if it satisfies the following syntactic
    conditions:


    +   1. There be exactly one root element.

    2. Each element has a start tag and an end tag; however, empty elements can be
    closed as <phone/> instead of <phone></phone>n3. Tags don''t overlap. For instance,
