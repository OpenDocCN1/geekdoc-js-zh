  md: '# 13.1 Boolean Values


    Boolean attributes, like isSmoker, can only have one of two possible values: true
    or false, which are sometimes more naturally expressed with yes or no. In the
    model code, Boolean attributes are treated like primitive datatype attributes,
    since all programming languages support Boolean as a primitive datatype attributes.


    For rendering a Boolean attribute in a user interface, there are several options
    that have to to

    The simplest solution is by using a checkbox field. Alternatively, a selection-list
    with the two options true and false (yes or no), or a corresponding radio button
    group with two radio buttons, could be used.


    In an HTML form, a checkbox field is implemented with an input element of type
    checkbox. For assigning the value of the checkbox field to the Boolean attribute,
    the field''s checked attribute has to be used, as shown in the following example
    where we have a checkbox field in an HTML form:


    ```

    <form id="Person">

    <p><label>

    is Smoker: <input type="checkbox" name="isSmoker />

    </label></p>

    </form>

    ```


    In JavaScript, the checkbox field is accessed via its name, and the Boolean attribute
    is assigned by reading the field''s checked attribute (instead of its value attribute),
    like so:


    ```

