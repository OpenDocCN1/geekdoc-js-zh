    public String SelectItem() getPublicationFormsItems() {...}\n}\n```\n\nNotice\
    \ the new methods in the last code block, getPublicationFormsValues and getPublicationFormsItems,\
    \ which are used for handling enumeration attributes in the UI. We discuss each\
    \ of them in the following subsections.\n\n# 12.3.3 Define a converter for serializing\
    \ enumeration attribute values\n\nA JPA attribute converter is a Java class that\
    \ implements the Converter interface with methods convertToDatabaseColumn and\
    \ convertEntityAttribute. For the otherAvailableLanguages attribute, we define\
    \ the following converter class:\n\n```\n@Converter\npublic class OtherAvailableLanguagesConverter\
    \ implements\n    AttributeConverter<Set<LanguageEL>, String> {\n    @Override\n\
    \    public String convertToDatabaseColumn(Set<LanguageEL> attrValue) {\n    \
    \    JSONArray jsonArr = new JSONArray(attrValue);\n        return jsonArr.toString();\n\
    \    }\n    @Override\n    public Set<LanguageEL> convertEntityAttribute(String\
    \ colValue) {\n        Set<LanguageEL> result = new HashSet<LanguageEL>();\n \
    \       try {\n            JSONArray jsonArr = new JSONArray(colValue);\n    \
    \        for (int i = 0, length = jsonArr.length(); i < length; i++) {\n     \
    \           result.add(LanguageEL.valueOf(jsonArr.getString(i)));\n          \
    \  }\n        } catch (JSONException e) {\n            e.printStackTrace();\n\
    \        }\n        return result;\n    }\n}\n```"
