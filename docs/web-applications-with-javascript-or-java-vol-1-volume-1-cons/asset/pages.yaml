    To store the new object, the persist method of the given ''entity manager'' is
    invoked. It is responsible for creating the corresponding SQL INSERT statement
    and executing it.


    # 4.3.3 Retrieving all Book instances


    The instances of an entity class, such as Book, are retrieved from the database
    with the help of a query expressed in the Java Persistence Query Language (JPQL¹).
    These queries are similar to SQL queries. We use class names instead of table
    names, property names instead of column names, and object instances of row variables.


    In the Book.retrieve method, a query asking for all Book instances is created,
    and then this query is executed by query.getResultList() as assigning its answer
    to the List variable books:


    ```

    public static List<Book> retrieveAll( EntityManager em) {

    Query query = em.createQuery("SELECT b FROM Book b", Book.class);

    List<Book> books = query.getResultList();

    return books;

    }

    ```


    # 4.3.4 Updating a Book instance


    To update an Book instance, we first need to retrieve it from the database by
    using em.find, and then set those attributes the value of which has changed:


    ```

    public static void update( EntityManager em,

    UserTransaction ut, String isbn, String title,

    int year) throws Exception {

    ut.begin();

    Book book = em.find(Book.class, isbn);

    if (!title.equals(book.getTitle())) book.setTitle( title );

    }

    ```


