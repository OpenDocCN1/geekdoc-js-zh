  md: '# 2 More on JavaScript


    # 2.1 JavaScript Basics


    In this summary we try to take all important points of the classical JavaScript
    summary^1 by Douglas Crockford^2 into consideration.


    # 2.1.1 Types and data literals in JavaScript


    JavaScript has three primitive datatypes: string, number and boolean, and we can
    test if a variable v holds a value of such a type with the help of the JS operator
    typeof as, for instance, in typeof v === "number"


    There are five reference types: Object, Array, Function, Date and RegExp. Arrays,
    functions, dates and regular expressions are special types of objects, conceptually,
    dates and regular expressions are primitive values, and have to be implemented
    in the function of wrapper objects.


    The types of variables, array elements, function parameters and return values
    are not declared and normally checked by JavaScript engines. Type conversion (casting)
    is performed automatically.


    The value of a variable may be a string, a number, or a boolean;


    +   - data value: a string, a number, or a boolean;

    - object reference: either referencing an ordinary object, or an array, function,
    date, or regular expression;

    - the special value null, which is typically used as a default value for initializing
    an object value;

    - the special value undefined, which is the implicit initial value of all variables
    that have been declared, but not initialized.


    A string is a sequence of Unicode characters. String literals, like "Hello world!",
    ''A3F0'', or the empty string '''', are enclosed in single or double quotes. Two
    strings can be concatenated with the + operator, and checked for equality with
    the triple equality operator:


    ```

    if (firstName + lastName) === "JamesBond") ...

    ```


    The number of characters of a string can be obtained by using the length attribute
    to a string:


    ```

    console.log("Hello world!".length); // 12

    ```'
