    is based on the principle of separation of concerns and on the fundamental insight
    that the **model** is the foundation for all other parts of an application, in
    particular for the user interface. Consequently, if the MVC approach does not
    provide a precise definition of what a ‘model’ is, we can consider it to be a
    **model-based** approach.


