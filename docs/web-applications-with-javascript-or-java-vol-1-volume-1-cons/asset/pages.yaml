    \ is used in the setUserInterface method of both the updateBook and the deleteBook\
    \ cases.\n\nChecking the constraints in the user interface (UI) on user input\
    \ is important for providing immediate feedback to the user. But it is not safe\
    \ enough to perform constraint validation only in the UI, because this could be\
    \ circumvented in a distributed web application where we use the browsers of a\
    \ front-end device while the application's data is managed by a back-end component\
    \ on a remote server. Consequently we need multiple constraint validation, first\
    \ in the UI (or change) and on form submission, and subsequently in the model\
    \ layer before saving/sending data to the persistent data store. And in an application\
    \ based on a DBMS we may also use a third round of validation before persistent\
    \ storage by using the validation mechanisms of the DBMS. This is a must, when\
    \ the application's database is shared with other apps.\n\nOur proposed solution\
    \ to this multiple validation problem is to keep the constraint validation code\
    \ in special check functions in the model classes and invoke these functions in\
    \ the UI on user input and on form submission, as well as in the create and update\
    \ data management methods of the model class via the setters. Notice that referential\
    \ integrity constraints (and other relationship constraints) may also be violated\
