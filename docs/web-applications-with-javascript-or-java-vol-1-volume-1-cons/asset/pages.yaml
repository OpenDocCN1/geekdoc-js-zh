  md: '# Part I Getting Started


    In this first part of the book we provide a brief introduction to the Web and
    show how to build


    +   1. a simple front-end web app using plain JavaScript and local storage,

    2. a simple back-end web app using Java with JSF, JPA and a MySQL/MariaDB data-base.


    We also provide brief introductions to information modeling and to software application
    architectures.


    The minimal examples of data management apps discussed in this part of the book
    only include a minimum of the overall functionality required for a complete app.
    They take care of only one object type (“books”) and support the four standard
    data management use cases (Create/Retrieve/Update/Delete), but they need to be
    extended by adding further important parts of an app''s overall functionality.'
