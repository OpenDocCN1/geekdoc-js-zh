  md: "# 9 Implementing Constraint Validation in a Java EE Web App\n\nWe only provide\
    \ an overview of the methods. For more details, see Chapter 4.\n\n# 9.4.3 Checking\
    \ uniqueness constraints\n\nFor duplicating Book records we have to check that\
    \ the isbn values are unique. At the level of the database, this is already checked\
    \ since the isbn column is the primary key, and the DBMS makes sure that its values\
    \ are unique. However, we would like to check this in our Java app before the\
    \ data is passed to the DBMS. Unfortunately, there is no Bean Validation annotation\
    \ for this purpose, and it is not clear how to do this with a custom validation\
    \ annotation. Therefore we need to write a static method, Book.checkIsbnAid, for\
    \ checking a value for the isbn attribute is unique. This method can then be called\
    \ by the controller for validating any isbn attribute value before creating a\
    \ new Book record.\n\n```\npublic static void checkIsbnAid(EntityManager em, String\
    \ isbn)\nthrows UniquenessConstraintViolation,\nMandatoryValueConstraintViolation\
    \ {\n    if (isbn == null) {\n        throw new MandatoryValueConstraintViolation(\n\
    \            \"An ISBN is required!\");\n    } else {\n        Book book = Book.retrieve(em,\
    \ isbn);\n        // book was found, uniqueness constraint validation failed\n\
    \        if (book != null) {\n            throw new UniquenessConstraintViolation(\n\
    \                \"There is already a book record with this ISBN!\");\n      \
    \  }\n    }\n}\n```\n\nThe method throws a UniquenessConstraintViolation exception\
    \ in case that a Book record was found for the given ISBN value. The exception\
    \ can then be caught and a corresponding error message displayed in the UI. In\
    \ the sequel of this chapter we show how to define the validator method and inform\
    \ JS facelets that it must be used to validate the isbn form input.\n\nNotice\
    \ that in this case we also need to check the isbn value and reject null values,\
    \ because the @NotNull validation triggers only later, when the isbn property\
    \ of the Book is set, thus at this point we could get NullPointerException, from\
    \ the Book.retrieve method."
