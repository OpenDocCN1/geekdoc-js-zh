  md: '# #13 Special Datatypes


    In an app, we have to deal with various types of attributes. While many of them
    have a standard datatype, like Integer or String, as their range, some of them
    may have special datatypes by their range. For instance, the Universal Business
    Language (UBL), is an industry standard defining document formats for electronic
    commerce, defines a large set of business datatypes including the following.


    | UBL Data Type | Description |

    |---|---|

    | Date Time | One calendar day according to the Gregorian calendar. An instance
    of time that occurs every day. |

    | DateTime | A particular point in the progression of time, together with relevant
    supplementary information. |

    | Percent | Numeric information that is assigned or determined by calculation,
    counting, or sequencing and expressed as a percentage. |

    | Amount | A number of monetary units specified using a given unit of currency
    |


    The SemanticWiki uses the following semantic datatypes.


    | SemanticWiki Data Type | Description |

    |---|---|

    | Geographic coordinate Monolingual text | Holds coordinates describing geographic
    locations To associate a text value with a specific language code |

    | Quantity Record | Holds values that describe quantities, containing both a number
    and a unit Allows saving compound values that consist of a short list of values
    with fixed type and order |

    | Email | Holds e-addresses |

    | URL | Holds URIs, and URLs |

    | Telephone number | Holds international telephone numbers based on the RFC 3962*


    We discuss several important cases of special datatypes and how to deal with them
    in the model code and in the HTML user interface code. The following class diagram
    illustrates examples of attributes having a special datatype as their range.


    In C++ and C# programming communities, special datatypes like string patterns
    and variants are also called "semantic types" (see, e.g., Gibson2016 and Perdeck2015).


    +   1. https://www.semantic-mediawiki.org/wiki/Help:List_of_datatypes

    2. https://tools.ietf.org/html/rfc3966

    3. http://stackoverflow.com/a/39417034/2795909

    4. https://www.codeproject.com/Articles/860646/Introducing-Semantic-Types-in-Net


    https://doi.org/10.1515/9783110499957-03'
