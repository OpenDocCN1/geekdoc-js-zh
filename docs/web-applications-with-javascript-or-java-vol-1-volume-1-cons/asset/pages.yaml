    # 13.3 Special Numeric Data Types


    # 13.3.1 Positive and non-negative integers attributes


    Since it is common to have positive or non-negative integer attributes, it''s
    preferable to use predefined datatypes, like PositiveInteger and NonNegativeInteger,
    as their range in an information design model, instead of defining them with the
    range Integer and adding a corresponding interval constraint.


    In a (JavaScript or Java) class definition, these attributes have to be implemented
    as integer-valued attributes with an interval constraint. It is, however, desirable
    to have built-in support for them, like in the data/document format language XML
    Schema.


    # 13.3.2 The unit interval


    Certain attributes, e.g., when representing probabilities, have the unit interval
    [0,1], or one of its open variants, as their range. They can be implemented as
    decimal-value attributes with an interval constraint. But having a corresponding
    predefined datatype, like UnitInterval, is preferable.


    # 13.3.3 Percentages


    The values of certain attributes represent percentages, which are decimal numbers
    that have to be divided by 100 for obtaining the numeric value represented by
    them. In a user interface, the value of a percentage attribute is shown with a
    % suffix, similar to quantity attributes shown with a unit suffix. For supporting
    percentage attributes, a special predefined datatype like Percent is needed.


    > 8 https://gist.github.com/729294'
