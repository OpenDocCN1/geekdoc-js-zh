    | isbn : String |

    | title : String |

    | year : Integer |


    Figure 3.1 The object type Book.


    The following table shows a sample data population for the model class Book:


    **Table 3.1** A collection of book objects represented as a table


    | ISBN | Title | Year |

    | --- | --- | --- |

    | 006251587X | Weaving the Web | 2000 |

    | 0465026567 | Gödel, Escher, Bach | 1999 |

    | 0465030793 | I Am A Strange Loop | 2008 |


    What do we need for a data management app? There are four standard use cases,
    which have to be supported by the app:


    +   1. **Create** a new book record by allowing the user to enter the data of
    a book that is to be added to the collection of stored book records.

    2. **Retrieve** (or read) all books from the data store and show them in the form
    of a list.

    3. **Update** the data of a book record.

    4. **Delete** a book record.


    These four standard use cases, and the corresponding data management operations,
    are often summarized with the acronym CRUD.


    For entering data with the help of the keyboard and the screen of our computer,
    we use HTML forms, which provide the user interface technology for web applications.


    For maintaining a collection of persistent data objects, we need a storage technology
    that allows to keep data objects in persistent records on a secondary storage
    device, such as a hard-disk or a solid state disk. Modern web browsers provide
    two'
