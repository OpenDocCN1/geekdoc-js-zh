    \ 161\n\n```\nCREATE TABLE IF NOT EXISTS items (\nitem varchar(10) NOT NULL PRIMARY\
    \ KEY,\nquantity int(11) NOT NULL\n)\n```\n\n# 9.2 Bean Validation annotations\n\
    \nIn the Java EE Bean Validation' approach, Java runtime validation can be defined\
    \ in the form of bean validation annotations placed on a property, method, or\
    \ class.\n\n# 9.1 Bean Validation annotations for properties\n\n| Constraint Type\
    \ | Annotations | Examples |\n| --- | --- | --- |\n| String Length Constraints\
    \ | @Size | @Size(min=8, max=80) String message; |\n| Cardinality Constraints\
    \ (for arrays, collections and maps) | @Size | @Size(min=2, max=3) List<Member>\
    \ coChairs; |\n| Mandatory Value Constraints | @NotNull | @NotNull String name\
    \ |\n| Range Constraints for numeric attributes | @Digits | @Digits(integer=6,\
    \ fraction=2) Decimal price; |\n| Interval Constraints for integer-valued attributes\
    \ | @Min @Max | @Min(5) int teamSize |\n| Interval Constraints for decimal-valued\
    \ attributes | @DecimalMin @DecimalMax | @DecimalMax(\"30.00\") double voltage\
    \ |\n| Pattern Constraints | @Pattern | @Pattern(regexp=\"\\\\\\d(10)\\\\\b\"\
    ) String isbn; |\n\nIn addition, there are annotations that require a value to\
    \ be in the future (@Future) or in the past (@Past).\n\nAll Bean Validation annotations\
    \ have an optional message attribute for defining a custom error. In the following,\
    \ we add two @NotNull annotations with messages, a @Size and a @Min annotation\
    \ to the JPA constraint annotations. The @NotNull annotations constrain the itemCode\
    \ and the quantity attributes to be mandatory, while the @Min annotation constrains\
    \ the quantity attribute to have a minimum value of 0:\n\n```\n@Entity(name=\"\
    items\")\npublic class Item {\n  @Column(length=8)\n  @NotNull(message=\"An item\
    \ code is required\")\n```\n\n1 http://docs.oracle.com/javaee/7/tutorial/doc/bean-validation001.htm#GIRCZ"
