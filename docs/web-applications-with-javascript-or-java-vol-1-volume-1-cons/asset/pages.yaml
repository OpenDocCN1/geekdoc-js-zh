- img_proc: true
  md: '# 6 Application Architecture


    In both cases, the JavaScript code of the front-end app is loaded together with
    its start page. While using local data storage (with JavaScript''s localStorage
    or indexedDB APIs) does not require any connection to the Internet after the loading
    of the app, using cloud storage via HTTP messaging with the XMLHttpRequest API
    does require an Internet connection.


    Typically, not necessarily, a front-end web is an app where everything work is
    performed by the back-end component, including data validation and user interface
    page creation. It does not have any front-end component, except the HTML-forms,
    and possibly JS-rendered, user interface pages sent to the user''s front-end computer
    for being rendered by a web browser.


    A back-end web app is a web app where essentially all work is performed by the
    back-end component,


    One important task of the controller, especially in back-end apps, routing: mapping
    incoming HTTP request to a use case of the app, typically represented by a method
    of a class, that either the corresponding user interface is provided in the form
    of a web page or the request represents the form submission, which can be directly
    processed.


    Today, with NodeJS, we have the option to deploy the JavaScript components of
    our app either on the back-end or on the front-end, or both. In the future, by
    WebAssembly, the same options may also be available to other programming languages.
    Web apps that run the same JavaScript code on both the back-end and front-end
    have been called "universal" (or "isomorphic"). This is especially useful for
    data validation code because in a responsive constraint validation approach, as
    discussed in Chapter 7, we validate user data immediately upon the user interface,
    but we also validate it on the back-end before save. Modern JavaScript allows
    truly distributed attributes.


    The two diagrams shown in Figure 6.3 illustrate the distinction between the traditional
    back-end web app architecture and the new architecture of a (truly) distributed
    web app.


    ![](img/42f1421051423f5b9e022255ae58c362_131_0.png)


    Figure 6.3 Architectures for back-end and distributed web apps'
  merge: -1
