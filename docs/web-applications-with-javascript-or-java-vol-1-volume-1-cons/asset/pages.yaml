  md: "# 2.2.2 JavaScript's LocalStorage API\n\nFor a front-end app, we need to be\
    \ able to store data persistently for this purpose: the front-end device. Modern\
    \ web browsers provide two technologies for this: the simpler one is called Local\
    \ Storage, and the more powerful one is called IndexedDB^21. For simplicity, we\
    \ use the Local Storage API in our example app.\n\nA Local Storage database is\
    \ created per browser and per origin, which is defined by the combination of protocol\
    \ and domain name. For instance, http://example.com and http://www.example.com\
    \ are different origins because they have different main names, while https://www.example.com\
    \ and https://www.example.com are different origins because of their different\
    \ protocols (HTTP versus HTTPS).\n\nThe Local Storage database managed by the\
    \ browser and associated with an app (via its origin) is exposed as the built-in\
    \ JavaScript object localStorage with the methods getItem, removeItem and clear.\
    \ However, instead of invoking getItem and setItem, it is more convenient to handle\
    \ localStorage as a map, writing to it by assigning a value to a key as in localStorage[\"\
    id\"] = 2901465, and retrieving data by reading the map as in var id = localStorage[\"\
    id\\]. The following example shows how to create an entity table and save its\
    \ serialization to LocalStorage\n\n```\nvar persons = {};\npersons[\"2901465\"\
    ] = {id: 2901465, name:\"Tom\"};\npersons[\"3305579\"] = {id: 3305579, name:\"\
    Su\"};\npersons[\"6492003\"] = {id: 6492003, name:\"Pete\"};\nntry {\n  localStorage[\"\
    personTable\"] = JSON.stringify(persons);\n} catch (e) {\n  alert(\"Error when\
    \ writing to LocalStorage\\n\" + e);\n}\n```\n\nNotice that we have used the predefined\
    \ method JSON.stringify for serializing the entity table into a string that is\
    \ assigned as the value of the LocalStorage key \"personTable\". We can retrieve\
    \ the table with the help of the de-deserialization method JSON.parse in the following\
    \ way:\n\n```\nvar persons = {};\ntry {\n  persons = JSON.parse(localStorage[\"\
    personTable\"]);\n} catch (e) {\n  alert(\"Error when reading from LocalStorage\\\
    n\" + e);\n}\n```"
  merge: -1
