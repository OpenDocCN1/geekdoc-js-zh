  md: '# 2 Storing Database Tables with JavaScript''s localStorage


    In most apps, we have some form of data management where data is represented in
    tables that rows correspond to objects, and the table schema corresponds to the
    objects'' type. When building a front-end web app with JavaScript, the simplest
    approach for persistent data storage is JavaScript''s localStorage API, which
    provides a simple key-value database, but does not support database tables. So,
    the question is: how can we store and retrieve tables with Local Storage?


    We show how to represent database tables in JavaScript in the form of (what we
    call) entity tables, and how to store these tables in Local Storage.


    # 2.2.1 Entity Tables


    The JavaScript Object Notation (JSON)¹ defines a concise syntax for JavaScript
    array literals (lists) and JavaScript object literals (maps):


    +   - Lists are expressed as comma-separated lists of data literals enclosed in
    brackets: `["penguin", "arctis", "snow"]`

    - Maps are expressed as comma-separated lists of key-value slots enclosed in curly
    braces: `{"id": 2901465, "my phone number":"0049.30.227109"}`

    - A record is a special type of map where the keys are JavaScript identifiers²,
    so they need not to be enclosed in quotation marks in JavaScript code. For example,
    id: 2901465, phone:"0049.30.227109" is a record. The value of a property in a
    record, or the value associated with a key in map, may be a simple data literal,
    or an array literal, or another object literal as: `{"tags":["penguin","arctis"],\photographer":{"last":"Wagner","first":"Gerd"}}


    An entity table contains a set of records (or table rows) such that each record
    represents an object with a standard identifier property slot. Consequently, an
    entity table can be represented as a map of records whose the keys of the map
    are the corresponding records, and are illustrated by the following example:


    | Key | Value |

    |---|---|

    | 006251587X | {id":"006251587X","title":"Weaving the Web","year:2000} |

    | 0465026567 | {id":"0465026567","title":"Gödel, Escher, Bach","year:1999} |

    | 0465030793 | {id":"0465030793","title":"I Am A Strange Loop","year:2008} |


    > ¹⁹ https://developer.mozilla.org/en/JavaScript/Reference/Global_Objects/JSON

    ²⁰ https://moreoff.in/js-variables'
  merge: -1
