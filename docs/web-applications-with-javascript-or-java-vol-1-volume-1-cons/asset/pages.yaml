  md: '7. Type parameters: Classes and complex data structures (such as lists) can
    be defined with the help of type parameters. See, for instance, the generics tutorial⁵
    by Oracle.


    8. Java programs must be compiled before they can be executed.

    9. Speed: Java is about twice as fast as optimized JavaScript.


    In Java, visibility levels are used to define the possible levels of access:


    Table 4.2 Java Visibility Level


    | Class | Package | Subclass | World |

    | --- | --- | --- | --- |

    | public | y | | y |

    | protected | y | | n |

    | no modifier | y | | n |

    | private | y | n | n | n |


    Normally, properties are defined as private, that they can only be assigned with
    a public setter, which allows to control, and possibly log, any change of the
    property value. Unfortunately, Java does not allow to protect only, but not read
    access. Therefore, we have to define getters with setters, even if they are not
    needed.


    A Java bean class (or, simply, bean) is a Java class with a parameter-free constructor
    where all have a get and set method (also called "getter" and "setter”). A Java
    bean is an object created with the help of a bean class.


    A JPA entity class (or, simply, entity class) is a Java bean class with @Entity
    annotation, mapping it to EE environment (as provided by the Tomcat PLUS web server)
    will take care of the persistent storage of its instances.


    JPA is a Java API for persistent data in Java applications. It uses the Persistence
    Query Language (JQL), a platform-independent object-oriented query language based
    on SQL. JQL expressions look very similar to SQL queries, which are executed in
    the context of JPA entity objects.


    JSF is a specification for building component-based user interfaces for web applications.
    Its current version, JSF 2, by default, uses Faceslets as its technology. By contrast,
    JSF 1 uses JavaServer Pages (JSP) as its default view technology.


    A JSF facelet is an XML-based template that combines static UI content items with
    data variables for generating XHTML user interface.


