  md: "# 12.3 Write the Model Code 213\n\nFR (\"French\");\nES (\"Spanish\");\n\n\
    ```\nprivate final String label;\nprivate LanguageEL (String label) {this.label\
    \ = label;}\npublic String getLabel() { return this.label;}\n\n```\n\n# 12.3.2\
    \ Code the JPA entity class\n\nThe entity class Book is coded with the help of\
    \ JPA annotations for class attributes, as well as the setter and getter methods\
    \ of every class attribute.\n\n```\n@Entity@Table(name=\"books\")\n@ViewScoped(name=\"\
