    # 10.3.3 Enumerations in JavaScript


    In JavaScript, we can define an enumeration as a special JS object having a property
    for each enumeration literal such that the property''s name is the enumeration
    literal''s name (the enumeration label or in upper case) and its value is the
    corresponding enumeration index. One approach for implementing this is using the
    Object.defineProperties method:


    ```

    var BookCategoryEL = null;

    Object.defineProperties(BookCategoryEL, {

    NOVEL: {value: 1, writable: false},

    BIOGRAPHY: {value: 2, writable: false},

    TEXTBOOK: {value: 3, writable: false},

    OTHER: {value: 4, writable: false},

    MAX: {value: 4, writable: false},

    labels: {value:["novel", "biography", "textbook", "other"],

    writable: false}

    });

    ```


    This definition allows using the enumeration literals BookCategoryEL.NOVEL, BookCategoryEL.BIOGRAPHY,
    standing for the enumeration indices 1, 2, 3 and 4, in program statements. Notice
    how this definition takes care of the enumeration literals like BookCategoryEL.NOVEL
    are constants, the value of which cannot be changed during program execution.
    This is achieved with the help of the property descriptor writable: false in the
    Object.defineProperties statement.


    We can also use a more generic approach and define a meta-class Enumeration in
    the form of special JS objects:


    ```

    function Enumeration(enumLabels) {

    var i=0, LBL="";

    this.MAX = enumLabels.length;

    this.labels = enumLabels;

    // generate the enum literals as capitalized keys/properties

    for (i=1; i <= enumLabels.length; i++) {

    LBL = enumLabels[i-1].toUpperCase();

    this[LBL] = i;

    }

    // prevent any runtime change to the enumeration

    Object.freeze(this);

    }

    ```'
