  md: '# 4.1 Java Basics 59


    What do we need for a data management app? There are four standard us cases, which
    have to be supported by the app:


    +   1. **Create** a new book record by allowing the user to enter the data of
    a book that is be added to the collection of stored book records.

    2. **Retrieve** (or read) all books from the data store and show them in the form
    of a list.

    3. **Update** the data of a book record.

    4. **Delete** a book record.


    The four standard use cases, and the corresponding data management operations,
    are often summarized with the help of the keyboard and the screen of our computer,

    For entering data with the help of us **HTML forms**, which provide the **user
    interface** technology for web applications.


    For any data management app, we need a technology that allows to store data in
    persistent records on a secondary storage device, such as a hard-disk or a solid
    state disk. JPA allows using any great number of different storage technologies,
    including many SQL database management systems (DBMS) such as Oracle, MySQL and
    PostgreSQL. We don''t have to change the application code for switching from one
    technology to another. Adding the right driver implementation to our Java runtime
    environment, properly setting up the DBMS and changing the database access configuration
    is in general all we need to do. In our example application, we explain how to
    set up the JPA configuration for MySQL.


    # 4.1 Java Basics


    Compared to JavaScript, what is different in Java? We list a few observations:


    +   1. **No program without a class**: Any Java program must include at least
    one class.

    2. **Java is strongly typed**: Properties, parameters and variables must be declared
    to be of some type.

    3. **No global variables, global procedures**: In Java, variables, procedures
    and functions must be defined in the context of a class, which provides their
    name space.

    4. **Arrays are static**: Arrays have a fixed size, which cannot be changed at
    runtime.

    5. **No object without a class**: For creating an object, a class has to be used
    (or defined for)

    - defining the properties of the object''s slots

    - defining the methods and functions that can be applied to the object (and all
    other objects instantiating the class)

    6. Classes, properties and methods are defined with a **visibility** level (`public`,
    protected or `private`), which restricts their accessibility.'
