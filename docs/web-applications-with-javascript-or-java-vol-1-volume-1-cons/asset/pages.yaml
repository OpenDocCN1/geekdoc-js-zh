  md: '# 7.2.11 Beyond property constraints


    So far, we have only discussed how to define and check property constraints. However,
    in certain cases there may also be integrity constraints that do not just depend
    on the value of a particular property, but rather on


    +   1. the value of several properties of a particular object (object-level constraints),

    2. the value of a property before and its value after a change attempt (dynamic
    constraints),

    3. the set of all instances of a particular object (type-level constraints),

    4. the set of all instances of several object types.


    OCL

    The Object Constraint Language (OCL) was defined in 1997 as a formal logic language
    for expressing integrity constraints in UML version 1.1. Later, it was extended
    for allowing to define also (1) expressions for defining derived properties, and
    (2) preconditions and postconditions for operations, in a class model.


    In a class model, property constraints can be expressed through the property declaration
    in a class rectangle (typically with keywords, such as id, max, etc.). For pressing
    more complex constraints, such as object-level or type-level constraints, we can
    attach an invariant declaration to the class rectangle(s) concerned and express
    the constraint either in (unambiguous) English or the Object Constraint Language
    (OCL). A simple example of an object-level constraint expressed as an OCL variant
    is shown in Figure 7.1.


    | Author |

    |---||

    | person[1]: Integer {id} |

    | name[1]: String |

    | dateBirth[1]: Date |

    | dateDeath[0..1]: Date |


    ```

    {invariant

    {dateDeath >= dateBirth}

    ```


    Figure 7.1 An example of an object-level constraint


    A general approach for implementing object-level constraint validation consists
    of taking the following steps:


    +   1. Choose a fixed name for an object-level constraint validation function,
    such as validate.

    2. For any class that needs object-level constraint validation, define a validate
    function returning either a ConstraintViolation or a NoConstraintViolation object.

    3. Call this function, if it exists, for the given model class,'
