  md: '| books |

    |---||

    | isbn |

    | title |

    | year |


    Taking this conceptual model as a starting point, we have to make a number of
    de-sign decisions for obtaining an information design model:

    1. What are the ranges of the properties isbn, title and year?

    2. Which property is the standard identifier (ID) attribute?

    3. Which constraints should be deined?

    4. Which methods/functions should be part of the design?


    The result of this design phase is a design model like the following:


    | Book |

    |---||

    |isbn : String (id) |

    |title : String |

    |year : Integer |

    |checkISBN() : String |


    It is important to understand that such a design model provides an implementation-agnostic
    (platform-independent) computational design, that is, it does not use any concept
    or syntax of any programming language or technology. Therefore, the same design
    model can be used for different platform-specific implementation models for different
    programming languages or technologies, such as for a Java- or PHP-based framework,
    or for a plain JavaScript approach.

    Based on the design model, replacing the platform-independent datatype names with
    JavaScript-specific datatypes, and by adding "setter" methods, we obtain the following
    JavaScript implementation model, which we prefer to call a JavaScript class model:


    | Book |

    |---||

    |isbn : string (id) |

    |title : string |

    |year : number(int) |

    |checkISBN() : string |

    |setISBN(in : string) |

    |setTitle(in : string) |

    |setType(in t string) |

    |setYear(in : number(int)) |


    Note that in this model, we have the JavaScript string number, and we have added
    the methods setISBN, setTitle and setYear. These “setter” methods are supposed
    to be used for setting a property to a new value, instead of directly assigning
    the value to the property.'
