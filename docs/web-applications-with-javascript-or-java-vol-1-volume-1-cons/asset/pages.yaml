    # 10.1.3 Record enumerations


    A record enumeration defines a record type with a unique field designated to provide
    the enumeration literals, and a fixed list of records of that type. In general,
    a record is defined by a set of field definitions (in the form of primitive datatype
    attributes), such that one of the unique fields is defined to be the enumeration
    literal field, and a set of operation definitions.


    Unfortunately, record enumerations, as the most general form of an enumeration
    datatype, are not supported by the current version of UML (2.5) where the general
    form of an enumeration is defined as a special kind of datatype (with optional
    field and operation definitions) having an additional list of unique strings as
    enumeration literals (shown in a fourth compartment). The UML definition neither
    allows designating one of the unique fields as the enumeration literal field,
    nor does it allow pop an enumeration with records.


