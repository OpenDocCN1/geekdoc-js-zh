  md: '# 8.10 Practice Projects — 155


    More movie data can be found on the IMDb website¹⁰.


    # 8.10.2 Project 2 – Validate country data


    The purpose of the app to be built is managing information about countries. The
    app deals with just one object type: `Country`, as depicted in the following class-diagram.


    | Country |

    | name[1]: NonEmptyString(3,50) (id) |

    | population[1]: PositiveInteger |

    | lifeExpectancy[1]: PositiveDecimal(max:100) |

    | militaryExpenditure[0..1]: Percentage |


    In this model, the following constraints are expressed:


    +   1. Due to the fact that the `name` attribute is declared to be the standard
    identifier of `Country`, it is **mandatory** and **unique**.

    2. The `name` attribute has a **string length constraint** requiring its values
    to have at least 3 and at most 50 characters.

    3. The `population` attribute is **mandatory**, as indicated by the multiplicity
    expression [1] appended to the attribute name.

    4. The `lifeExpectancy` attribute is also **mandatory** and has an **interval
    constraint**; its values must be less than or equal to 100.


    Notice that the `militaryExpenditure` attribute is not mandatory, but *optional*,
    as indicated by its multiplicity expression [0..1].

    In addition to the constraints described in this list, there are the implicit
    range constraints defined by assigning the datatypes `NonEmptyString` to `name`,
    `PositiveInteger` to `population`, `PositiveDecimal` to `lifeExpectancy` and `Percentage`
    to `militaryExpenditure` (hint: a percentage value is a number between 0 and 100).
    In our plain JavaScript approach, all these property constraints are coded in
    the model class within property-specific `check` functions.

    You can use the sample data shown in the following table for testing your app.'
