  md: '# 5.4 Excursion: Formalizing Information Models with RDF and OWL 99


    ![](img/42f1421051423f5b9e022255ae58c362_116_0.png)


    In an RDF graph, nodes with an elliptic shape represent “resources” (like properties
    and classes), and arrows represent relationships defined by a property. Each between
    two nodes represents a statement (also called “triple”). For instance the rdf:range
    between year and xs:int represents the statement that the range of property year
    is the XML Schema datatype xs:int, where xs is a namespace prefix for the XML
    Schema namespace.


    Notice that RDF has the predefined meta-classes rdf:Class and rdf:Property, used
    to define classes and their properties with the help of the predefined property
    rdf:type. For instance the rdf:type arrow between year and rdf:Property Property
    represents the statement that year is of rdf:Property, that is, it is defined
    to be an RDF property.


    RDF graphs are a formalism for theoretical purposes. They can be used for illustrating
