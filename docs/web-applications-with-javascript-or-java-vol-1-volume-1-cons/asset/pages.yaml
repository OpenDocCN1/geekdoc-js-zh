  md: "# 206 11 Implementing Enumeration Attributes in a Plain JS Web App\n\ntion\
    \ sub-elements of the select. If the attribute is rendered as a radio button group,\
    \ we can enforce a choice, and thus the mandatory value constraint, in the create\
    \ case by setting the checked attribute of the first radio button to true and\
    \ not allowing the user to uncheck a button. In this way, if the user doesn't\
    \ check any button, the first one is the default choice.\n\nIn the case of an\
    \ optional-valued enumeration attribute rendered as a single-selection list, we\
    \ need to include an empty or void option (e.g., in the form of a string like\
    \ “-”). If the attribute is rendered as a radio button group, we do not check\
    \ any button initially and need to allow the user to uncheck a button with a mouse\
    \ click in a click listener.\n\nIn the case of a multi-valued enumeration attribute\
    \ like publicationForms rendered as a multi-selection list or checkbox group,\
    \ we need to check if the user has chosen at least one option. Whenever the user\
    \ selects or unselects an option in a select element, a change event is raised\
    \ by the browser, so we can implement the responsive mandatory constraint validation\
    \ as an listener for change events on the select element, testing if selectOptions\
    \ is empty. If the attribute is rendered as a checkbox group, we need an event\
    \ listener for click events when the fieldset's value is non-empty, as in the\
    \ following example code fragment:\n\n```\nsetupInterface: function () {\n   \
    \ // check mandatory value constraint for checkbox group\npubFormsfieldsetEl.addEventListener(\"\
    click\", function () {\n        var val = pubFormsfieldset[0].getAttribute(\"\
    data-value\");\n        formEl.publicationForms[0].setCustomValidity(\n      \
    \      (!val || Array.isArray(val) && val.length === 0) ?\n            \"At least\
    \ one publication form must be selected!\" : \"\"\n        );\n    });\nn}\n```\n\
    \nNotice that the HTML5 constraint validation API does not allow to indicate a\
    \ constraint violation on a fieldset element (as the container element of a checkbox\
    \ widget). As a workaround, we use the first checkbox element of the publicationForms\
    \ choice widget, which can be accessed with formEl.publicationForms[0], for invoking\
    \ the setCustomValidity method that indicates a constraint violation if its argument\
    \ is a non-empty (message) string."
