  md: '# 1.2.5 The evolution of HTML


    The World-Wide Web Committee (W3C) has developed the following important versions
    of HTML:

    - 1997: HTML 4 as an SGML-based language,

    - 2000: XHTML 1 as an XML-based clean-up of HTML 4,

    - 2014: (XHTML) 5 in cooperation (and competition) with the WHAT working group³
    sponsored by browser vendors.


    As the inventor of the Web, Tim Berners-Lee developed a first version of HTML⁴
    in 1990. A few years later, in 1995, Tim Berners-Lee and Dan Connolly wrote the
    HTML² standard, which captured the common use of HTML elements at that time. In
    the following years, HTML has been used and gradually extended by a growing community
    of every WWW adopter. This evolution of HTML, which has led to a messy set of
    elements and attributes (called “tag soup”), has been mainly controlled by browser
    vendors and their competition with each other. The development of an attempt by
    the W3C to clean up this mess, it neglected HTML’s functionality towards a wider
    user interface, which was the focus of the WHAT working group⁶ led by Ian Hickson
    can be considered the mastermind and main author of HTML 5 and many of its accompanying
    JavaScript APIs that made HTML for mobile apps.


    HTML was originally designed as a structure description language, and not as a
    presentation description language. HTML4 has a lot of purely presentational elements
    such as font. XHTML has been taking HTML back to its roots, dropping presentational
    elements and defining a simple and clear syntax, in support of the goals of


    +   - device independence,

    - accessibility, and

    - usability.


    We adopt the symbolic equation HTML = HTML5 = XHTML

    stating that when we say “HTML” or “HTML5”, we actually mean XHTML because we
    prefer the syntax of XML documents over the liberal and confusing HTML4-style
    syntax that is also allowed by HTML5.


