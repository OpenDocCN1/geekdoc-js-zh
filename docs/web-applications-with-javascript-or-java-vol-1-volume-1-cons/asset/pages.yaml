  md: "# 4.7 Step 6 – Implement the Update Use Case — 79\n\n```\n#{b.year}\n</h:column>\n\
    </h:dataTable>\n</ui:define>\n</ui:composition>\n</html>\n```\n\nThe ui:composition\
    \ element specifies which template is applied (i.e. templates=/WEB-INF/page.xhtml)\
    \ and which view block (<ui:define name=\"main\">) is replaced by this facelet\
    \ at runtime.\nThe h:dataTable element defines a table view for records of data,\
    \ which are then rendered as an HTML table. The value attribute defines a variable\
    \ data binding to a record collection, while the var attribute defines a variable\
    \ for iteratively accessing records from this collection. The expression provided\
    \ in the value attribute specifies the getter (getter: getBooks) as defined in\
    \ the controller class UserController. In this particular case it is sufficient\
    \ to define the getBooks method since there is no need for a books property in\
    \ the controller. In any case, value does not allow to invoke a method, so we\
    \ cannot call getBooks directly. Instead we have to use the (possibly virtual)\
    \ property books, which internally evaluates to a call of getBooks without checking\
    \ if a books property exists.\n\nThe h:button element allows to create redirects.\
    \ The value of the outcome attribute specifies a name of a facetlet file (omitting\
    \ the .xhtml extension), such that, in the example, the file name is index.xhtml.\n\
    \n# 4.7 Step 6 – Implement the Update Use Case\n\nLike for Create, for the Update\
