    # 3 Why is Java a Good Choice for Building Web Apps?


    2017, and for many years to come, the enterprise software platform Java Enterprise
    Edition (Java EE), which bundles the Java language together with a number of libraries
    for enterprise software systems, the most important programming platform for information
    technologies, including all kinds of software applications. Its strong points
    mainly result from the fact that it is very mature:


    +   1. It has a rich ecosystem, including a large number of libraries, frameworks
    and tools;


    +   2. Java code executes faster than scripting languages, like Python, PHP, NodeJS
    or Ruby;


    +   3. Java web applications can be scaled, e.g., by using distributed database
    transactions and cluster technologies;


    +   4. It provides a lot of advanced security technologies.


    # 4 Comparing Java with JavaScript


    As opposed to java, JavaScript is relatively easy to learn. One reason for this
    is the need of explicit type definitions for variables, parameters and return
    values in Java, which are not needed in JavaScript.


    Both Java and JavaScript are "object-oriented" programming languages, but JavaScript
    is even more "object-oriented" than Java, which is rather "class-oriented". There
    is no explicit class concept in JavaScript. Classes have to be defined in the
    realm of special objects. However, objects can be created without instantiating
    a class, and properties as methods can be defined for specific objects independently
    of any class definition.


    At run time, properties and methods can be added to, or removed from, any object
    and class. While JavaScript classes can be redefined at runtime, immediately af-'
