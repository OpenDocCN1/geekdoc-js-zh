  md: "# 216 — 12 Implementing Enumeration Attributes in a Java EE Web App\n\nAn attribute\
    \ converter class needs to be annotated with @Converter. In our example, the convertToDatabaseColumn\
    \ method is responsible to convert the entity attribute value (e.g., otherAvailableLanguages)\
    \ to a JSON array which is stored in the database as a String.\n\nThe convertToEntityAttribute\
    \ method is responsible for de-serializing a table column's value to the corresponding\
    \ entity attribute value. In our example, this means to map the JSON string to\
    \ a Java Set of enumeration literals of LanguageEL.\n\nThe code shows the custom\
    \ attribute converter class for the otherAvailableLanguages attribute. The attribute\
    \ converter class for the publicationForms attribute is defined in the same way.\n\
    \n# 12.3.4 Code the enumeration attributes setter\n\nBoth for single-valued and\
    \ for multi-valued enumeration attributes an ordinary setter is defined. In the\
    \ case of a multi-valued enumeration attribute, this setter assigns an entire\
