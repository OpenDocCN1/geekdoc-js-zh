    about that attribute. If the validation fails, we expect to see the form content
    with the error messages. To get the expected result, we need to use the annotation
    @ViewScoped for the class pl.m.Book instead of @RequestScoped, our bean instance
    referenced by the book variable is initialized with a new value on every request,
    implying that the expression #{book.isbn} evaluates to null and the ISBN value
    is not displayed. The @ViewScoped annotation specifies that the entity bean is
    as long as the view it lives, so the ISBN value stored by the book is available
    during this time and it can be displayed in view.


    By contrast, h:inputText elements in HTML input elements which are part of the
    form submission content, so the response contains the already values because these
    values are known in this case. This consideration shows that it is important to
    choose the right bean scope.


