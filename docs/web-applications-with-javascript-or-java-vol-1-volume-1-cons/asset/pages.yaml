  md: '# 4 Building a Minimal Web App with Java EE in Seven Steps


    In this chapter, we show how to build a simple Java EE application using the Java
    Persistence API (JPA) for object-to-storage mapping and Java Server Faces (JSF)
    as the user interface (or "view") technology. Such an application requires a web
    server that supports Java EE specifications Java Servlets, Java Expression Language
    (EL), JPA and JSF, as the open source web server Tomcat/TomEE (pronounced "Tommy").
    In addition to the Java code executed on the back-end that runs the TomEE server,
    a Java EE app consists of HTML, CSS and possibly some auxiliary JavaScript code
    that is executed by a web browser running on the user''s front-end computer. Essentially
    all data processing is performed on the back-end, and the front-end only renders
    the user interface, classifies Java EE applications as back-end web apps.


    We show how to develop, deploy and run a simple example using the TomEE server,
    which is Apache Tomcat extended by adding basic Java EE features providing an
    execution environment for light-weight Java EE apps. We assume that you have already
    installed the TomEE Plume server and MySQL.


    The purpose of our example app is to manage information about books. For simplicity,
    we deal with a single object type Book, as depicted in Figure 4.1.


    ![](img/42f1421051423f5b9e022255ae58c362_75_0.png)


    The following table shows sample data population for the model class Book.


    | ISBN | Title | Year |

    | --- | --- | --- |

    | 006251587X | Weaving the Web | 2000 |

    | 0465026567 | G"del, Escher, Bach | 1999 |

    | 0465030793 | I Am A Strange Loop | 2008 |


    Table 4.1 Sample data about books


    +   1 http://tomeee.apache/apache-tomeee.html

    2 http://tomeee.apache/apache-tomeee.html

    3 http://www.mysql/

    4 http://web-engineering.org/Java/JpaFsApp/Setup-Backend-for-JPA-and-JSF-Web-Applications


    https://doi.org/10.1515/9783110499957-004'
