    \ we create the application structure. There are many ways to do this, like for\
    \ example to use Eclipse development environment (and create and configure a Dynamic\
    \ Web Project). In this chapter we show how to do it manually, so there is no\
    \ need to use special tools. For your convenience we also provide an ANT script\
    \ for a download link, allowing to automatically create the folder structure of\
    \ the web application, compile it to a Web Archive (WAR) file and deploy it to\
    \ a Tomcat server for execution. The application structure (which is compatible\
    \ with the Dynamic Web Project structure of Eclipse, so it can be imported into\
