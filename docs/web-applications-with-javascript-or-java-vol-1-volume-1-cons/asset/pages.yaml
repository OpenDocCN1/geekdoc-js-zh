  md: '# M


    MathML


    An open standard for representing mathematical expressions, either in data interchange
    or for rendering them within pages.


    MIME


    A MIME type (also called "media type" or "content type") refers to a keyword string
    set along with a file for identifying its content type. For example, a sound file
    might be labeled audio/ogg, or an image file image/png.


    MVC (Model-View-Controller)


    MVC is a general architecture metaphor emphasizing the principle of concerns,
    mainly between the model and the view, and considering the model as the most fundamental
    part of an app. In MVC frameworks, "M", "V" and "C" are defined in different ways.
    Often the term "model" denotes the app’s data sources, while the "view" denotes
    the app’s code for the user interface, which is based on CSS-styled HTML forms
    and DOM elements, and the "controller" typically denotes the glue that is in charge
    of mediating between the view and model.


    # O


    OCL (Object-Constraint Language)


    The OCL is a formal logic language for expressing integrity constraints, mainly
    in UML class models. It also allows defining expressions for defining derived
    properties, and defining preconditions and postconditions for operations, in a
    class model.


    OOP (Object-Oriented Programming)


    OOP is a programming paradigm based on the concepts of objects and classes instantiated
    by objects. Classes are like blueprints for objects: they define their properties
    and the methods/functions that can be applied to them. A higher-level character
    of OOP is inheritance in class hierarchies: a subclass inherits the features (properties,
    methods and constraints) of its superclass.


    OWL (Web Ontology Language)


    OWL is formal logic language for knowledge representation on the Web. It allows
    defining vocabularies (mainly classes with properties) and supports many types
    of integrity constraints on them. OWL is the basis for performing automated inferences,
    such as checking the consistency of an OWL vocabulary. Vocabularies, or data models,
    can be converted to OWL vocabularies and then checked for consistency.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# P


    PNG (Portable Network Graphics) Polyfill PNG is an open (non-proprietary) graphics
    file format that supports lossless data compression. A polyfill is a piece of
    JavaScript code for emulating a standard JavaScript method in a browser, which
    does not support the method.


    # R


    RDF (Resource Description Framework) RDF is a W3C language for representing machine-readable
    propositional information on the Web.


    # S


    SGML (Standard Generalized Markup Language) SGML is an ISO specification for defining
    markup languages. HTML4 has been defined with SGML. XML is a simplified successor
    of SGML. HTML5 is no longer SGML-based and has its own parsing rules. SVG (Scalable
    Vector Graphics) SVG is a 2D vector format based on XML. SVG can be styled with
    CSS and made interactive using JavaScript. HTML5 allows direct embedding of SVG
    content in an HTML document.


    Slot A slot is a name-value pair. In an object of an object-oriented program (for
    instance, in a Java object), a slot normally is a property-value pair. But in
    a JavaScript object, a slot may also consist of a method name and a method body
    or it may be a key-value pair of a map.


    # U


    Unicode A platform-independent character set that includes almost all characters
    from most of the world''s script languages including Hindi, Burmese and Gaelic.
    Each character is assigned a unique integer code in the range between 0 and 1,114,111.
    For example, the Greek letter π has the code 960. Unicode includes legacy character
    sets like ASCII and ISO-8859-1 (Latin-) as subsets.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'XML is based on Unicode. Consequently, the Greek letter π (with code 960) can
    be inserted in an XML document as π using the XML entity syntax. The default encoding
    of Unicode characters in an XML document is UTF-8, which uses only a single byte
    for ASCII characters, but three bytes for less common characters.


    +   - **URI (Uniform Resource Identifier)


    URI is either a Uniform Resource Locator (URL) or a Uniform Resource Name (URN).


    +   - **URN (Uniform Resource Locator)


    URL is a resource name that contains a web address for locating the resource on
    the Web.


    +   - **UML (Unified Modeling Language)


    The UML is an industry standard that defines a setting of modeling languages for
    various kinds of models and diagrams in support of object-oriented problem analysis
    and software design. Its core languages are Class Diagrams for information/data
    modeling, and Sequence Diagrams, Activity Diagrams and State Diagrams (or State
    Charts) for process/behavior modeling.


    +   - URN (Uniform Resource Name)


    URN refers to a resource without specifying its location.


    +   - User Agent


    A agent is a front-end web client program such as a web browser.


    # # W


    +   - WebM


    WebM is an open (royalty-free) video format supported by Google Chrome and Mozilla
    Firefox, but not by Microsoft Explorer and Apple Safari.


    +   - WHATWG (Web Hypertext Application Technology Working Group)


    The WHATWG was established in 2004 by former employees of Apple, Mozilla, and
    Opera who have been unhappy with the slow progress of web technology standardization
    due to W3C''s choice to focus on the standardization of XHTML2. Led by Ian Hick,
    they developed HTML5 and related JavaScript APIs in competition and collaboration
    with the W3C.


    +   - WWW (World Wide Web)


    The WWW (or, simply, the “Web") is a huge client-server network based on HTTP,
    HTML and XML, where web browsers (and other ‘user agents’), acting as HTTP clients,
    access web server programs, acting as HTTP servers.


    +   - W3C (World Wide Consortium)


    The W3C is an international organization in charge of developing and maintaining
    web standards.'
  merge: -1
  pgno: 267
