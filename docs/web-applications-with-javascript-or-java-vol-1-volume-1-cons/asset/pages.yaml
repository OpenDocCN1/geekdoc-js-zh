  md: '# 10 Enumerations and Enumeration Attributes


    +   1. simple enumerations define a list of self-explanatory enumeration labels;

    2. code lists define a list of code/label pairs.

    3. record enumerations consist of a list of records, so they are defined like
    classes with simple attributes defining the record fields.


    These three forms of enumerations are discussed in more detail below.

    Notice that, since enumerations are used as the range of enumeration attributes,
    they are considered as datatypes.

    Enumerations may have further features. For instance, we may want to be able to
    define a new enumeration by extending an existing enumeration. In programming
    languages and in other computational languages, enumerations are implemented in
    different ways. Also see the Wikipedia article on enumerations¹.


