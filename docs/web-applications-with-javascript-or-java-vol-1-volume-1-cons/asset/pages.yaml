  md: "# 76 Building a Minimal Web App with Java EE in Seven Steps\n\nData binding\
    \ refers to the binding of model class properties to form (input or output) fields.\
    \ For instance, in the following facet code fragment, the property book.isbn is\
    \ bound to the input field \"isbn\":\n\n```\n<h:outputLabel for=\"isbn\" value=\"\
    ISBN\">\n<h:inputText id=\"isbn\" value=\"#{book.isbn}\" />\n</h:outputLabel>\n\
    ```\n\nIn JSF, the inputText elements of a form, the id attribute is used with\
    \ a given value, e.g., id=\"isbn\". The rendered HTML5 elements have both, the\
    \ id and the name attributes, which are obtained by using the form id and element\
    \ values separated by a comma, i.e., id=\"createBookForm:isbn\" and name=\"createBookForm:isbn\"\
    \n\nWe can also see a first example of an expression in the Java Expression Language\
    \ (EL), where an expression starts with # and is enclosed in brackets, like #{expression}.\
    \ Such an expression allows reading the value of a property of, invoking a method\
    \ on, a Java bean or a context object. The value of the expression is assigned\
    \ to the value attribute of the generated HTML element. The example in our JSF\
    \ code above is the expression #{book.isbn}, which retrieves the value of isbn\
    \ property of the book bean.\n\nAction binding refers to the binding of method\
    \ invocation expressions to actionable UI elements, where the invoked methods\
    \ are controller action methods, and the actionable UI elements form buttons.\
    \ For instance, in the following facet code fragment, the method invocation expression\
    \ bookCtrl.create(...) is bound to the form's submit button:\n\n```\n<h:commandButton\
    \ value=\"Create\"\naction=\"#{book.create( book.isbn, book.title, book.year)}\"\
    \ />\n```\n\nAfter discussing data binding and action binding, it's time to look\
    \ at the complete code of the facet:\n\n```\n<DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \nxmlns:ui=\"_\" xmlns:h=\"_\" xmlns:p=\"_\">\n<ui:composition template=\"WEB-INF/templates/page.xml\"\
    >\n<ui:define name=\"headerTitle\">\n<h1>Create a new book record</h1>\n\n</ui:define>\n\
    <ui:define name=\"main\">\n<h:form id=\"createBookForm\">\n<div><h:outputLabel\
    \ for=\"isbn\" value=\"ISBN: \n<h:inputText id=\"isbn\" value=\"#{book.isbn}\"\
    \ />\n</h:outputLabel></div>\n<div><h:outputLabel for=\"title\" value=\"Title:\
    \ \n<h:inputText id=\"title\" value=\"#{book.title}\" />\n</h:outputLabel></div>\n\
    </h:form>\n</ui:define>\n</ui:composition>\n```"
