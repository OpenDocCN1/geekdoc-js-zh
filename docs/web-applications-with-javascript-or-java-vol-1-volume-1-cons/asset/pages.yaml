    The main author of HTML5, Hickson, has proposed an alternative general annotation
    language, called microdata, with the goal to simplify RDFa and remedy its usability
    issues (in particular, by dropping its use of XML namespaces). Despite the unfortunate
    choice of using different names for the same annotation concepts (like “itemprop”
