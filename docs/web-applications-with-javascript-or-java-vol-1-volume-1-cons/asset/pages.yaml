    Any code pattern for defining classes in JavaScript should satisfy five requirements.
    First of all, (1) it should allow to define a class name, a set of (instance-level)
    properties, preferably with the option to keep them ''private'', a set of (instance-level)
    methods, and a set of class-level properties and methods. It''s desirable that
    properties be defined with a range/type, and with other meta-data, such as constraints.
    There should also be two introspection features: (2) an is-of-predicate that can
    be used for checking if an object is a direct or indirect instance of a class,
    and (3) an instance-level property for retrieving the direct type of an object.
    In addition, it is desirable to have three introspection features for retrieving
    the direct type of a class, and finally, there are two inheritance mechanisms:
    (4) property inheritance and (5) method inheritance. In addition, it is desirable
    to have support for multiple inheritance and multiple classifications, for allowing
    objects to play several roles at the same time by instantiating role classes.


