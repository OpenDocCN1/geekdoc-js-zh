  md: "# 4.3.1 Storing Book objects in a database table\n\nThe instances of our class\
    \ Book are Java objects representing \"entities\" (or business objects), which\
    \ can be serialized, or in other words, converted to records (or rows) of a database\
    \ table, as shown in Table 4.1.\n\nSQL\n\nThe Structured Query Language (SQL),\
    \ created in the early 1970s by Donald D. Chamberlin and Raymond F. Boyce, is\
    \ an ISO standard that is based on the Relational Database model of Edgar F. Codd\
    \ and defines\n\n+   - Data Definition Language (based on CREATE TABLE statements)\
    \ for creating databases containing primitive data;\n- Data Manipulation Language\
    \ (based on INSERT, UPDATE and DELETE statements) for creating, updating and deleting\
    \ the contents of database tables;\n- Query Language (based on SELECT statements)\
    \ for retrieving the information stored in database-tables.\n\nSQL is widely used\
    \ in Database Management Systems (DBMSs) and in programming languages for persistent\
    \ data storage. Despite the existence of the SQL standard, each DBMS has its own\
    \ dialect of SQL. Consequently, SQL code is in practice not completely portable\
    \ among different DBMSs without adjustments.\n\nThe data technology used in our\
    \ example app is MySQL, and the SQL code to create the database table books is\
    \ the following:\n\n```\nCREATE TABLE IF NOT EXISTS books (\n  isbn VARCHAR(10)\
    \ NOT NULL PRIMARY KEY,\n  title VARCHAR(128),\n  year SMALLINT\n);\n```\n\nWhile\
    \ it is also possible to create the database schema manually with the help of\
    \ CREATE TABLE statements such as the one above), we show below how the database\
    \ schema can be automatically generated by JPA. In both cases, the database setup,\
    \ including a user account and the associated rights (create, update, etc), must\
    \ be done manually before the JPA application can connect to.\n\n# 4.3.2 Creating\
    \ a new Book instance and storing it\n\nThe Book.create method takes care of creating\
    \ a new Book instance and saving it to a database with the help of an 'entity\
    \ manager':"
