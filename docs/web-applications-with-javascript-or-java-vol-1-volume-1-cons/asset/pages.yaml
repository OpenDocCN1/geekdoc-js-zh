  md: "# 14 Derived Properties\n\nIn certain cases, a property may have the only purpose\
    \ to provide some information that is computed from other information items. For\
    \ such a derived property, there is no point to allow the user entering a value\
    \ for it. Examples of derived properties of a class Person are the attributes\
    \ age and initials. The value of age is computed on demand from the value of the\
    \ attribute dateOfBirth and the current year. The value of initials is computed\
    \ from the values of the attributes firstName and lastName.\n\nUnlike the case\
    \ of standard properties, the value of a derived property cannot be set by the\
    \ user. Rather, it is computed from the values of other properties. Consequently,\
    \ it does not have a setter, but only a getter method.\n\n# 14.1 Virtual Derived\
    \ Properties\n\nWhen the value of a derived property is computed on demand, only\
    \ by its getter performing its computation, the derived property is called virtual.\
    \ The value of such a virtual property is not stored. When using JavaScript/s\
    \ get set methods in an ES6 class definition, this means that we define a get\
    \ method for age, but no internal property like _age, and no set method:\n\n```\n\
    var Person = class {\n  // assign default values to mandatory properties\n  this.name\
    \ = \"\"; // string (non-empty)\n  this.dateOfBirth = 0; // Date\n  // is invoked\
    \ with a non-empty slots argument?\n  if (typeof slots === \"object\" &&\n   \
    \ Object.keys(slots).length > 0) {\n      // assign properties by invoking implicit\
    \ setters\n      this.name = slots.name;\n      this.dateOfBirth = slots.dateOfBirth;\n\
    \    }\n}\n\n  get name () { return this.name; }\n  set name (n) { this.name =\
    \ n; }\n  get dateOfBirth () { return this.dateOfBirth; }\n  set dateOfBirth (d)\
    \ { this._dateOfBirth = d; }\n  get age () {\n    var today = new Date();\n  \
    \  return today.getFullYear() - this.dateOfBirth.getFullYear();\n  }\n}\n```"
  merge: -1
  pgno: 260
- img_proc: true
  md: "# 14.2 Derived Properties\n\nIf the value of a derived property is computed\
    \ whenever there is a change in the value of one of the properties on which it\
    \ depends, the derived property is called materialized. The value of such a materialized\
    \ property is stored, and the getter simply retrieves this stored value. When\
    \ using JavaScript's get/set methods in an ES6 class definition, this means that\
    \ we define a get method for initials retrieving the value of the internal attribute\
    \ _initials, but no set method. The computation of the materialized derived property's\
    \ value is performed in the setters of the attributes on which it depends, in\
    \ the following example:\n\n```\nvar Person = class {\n  constructor (slots) {\n\
    \    // assign default values to mandatory properties\n    this._firstName = \"\
    \"; // string (non-empty)\n    this._lastName = \"\"; // string (non-empty)\n\
    \    this._initials = \"\"; // string (non-empty)\n    // is constructor invoked\
    \ with non-empty slots argument?\n    if (typeof slots === \"Object\" &&\n   \
    \     Object.keys(slots).length > 0) {\n        // assign properties by invoking\
    \ implicit setters\n        this._firstName = slots.firstName;\n        this._lastName\
    \ = slots.lastName;\n    }\n  }\n\n  get firstName () { return this._firstName;\
    \ }\n  set firstName (f) {\n    this._firstName = f;\n    this._initials = this._firstName.charAt(0)\
    \ + this._lastName.charAt(0);\n  }\n\n  get lastName () { return this._lastName;\
    \ }\n  set lastName (l) {\n    this._lastName = l;\n    this._initials = this._firstName.charAt(0)\
    \ + this._lastName.charAt(0);\n  }\n\n  get initials () { return this._initials;\
    \ }\n};\n```\n\nNotice that the computation of the initials of a person is performed\
    \ in the setters of firstName and lastName, whenever these attributes are initialized\
    \ or changed."
  merge: -1
  pgno: 261
- img_proc: true
  md: "# 14.3 Dealing with Derived Properties in the User Interface\n\nSince derived\
    \ properties are not set by user input, there are no input, but only output fields\
    \ for them in a user interface. This is illustrated in the following example of\
    \ an HTML form:\n\n```\n<form id=\"Person\">\n  <label>First name: <input name=\"\
    firstName\" type=\"text\"/></label>\n  <label>Last name: <input name=\"lastName\"\
    \ type=\"text\"/></label>\n  <label>Initials: <output name=\"initials\"/></label>\n\
    \  <label>Date of birth:\n    <input name=\"dateBirth\" type=\"date\"/></label>\n\
    \  <label>Age: <output name=\"age\"/></label>\n</form>\n```"
  merge: -1
