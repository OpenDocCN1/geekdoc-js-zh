    b. in the model class, before save, both in the create and in the update method.


    Constraints affecting two or more model classes could be defined in the form of
    static methods (in a model layer method library) that are invoked from the object-level
    validation methods of the affected model classes.


    # 7.3 Responsive Validation


    This problem is well-known from classical web applications where the front-end
    component submits the user input data via HTML form submission to a back-end component
    running on a remote web server. This back-end component validates the data and
    returns the validation results in the form of a set of error messages to the front-end.
    Only then, several seconds later, and in the hard-to-digest form of a bulk message,
    does the user get the validation feedback. This approach is no longer acceptable
    today. Rather, in a responsive validation approach, the user should get immediate
    validation feedback on each single data input. Technically, this can be achieved
    with the help of event handlers for the user interface input or change.


    Responsive validation requires a data validation mechanism in the user interface
    (UI), such as the UI, the jQuery Validation Plugin() can be used as a (non-HTML5-based)
    form validation API.


    The HTML5 validation API essentially provides new types of input fields (such
    as number or date) and a set of new attributes for form control elements for the
    purpose of supporting validation performed by the browser. By using the validation
    attributes (like required, min, max and pattern) defining constraints in the UI,
    they are not really useful in a general approach where constraints are only checked,
    but not defined, in the UI.


    Consequently, we use only two methods of the HTML5 validation API for validating
    constraints in the HTML5-based user interface of our app. The first of them, setCustomValidity,
    allows to mark a form field as either valid or invalid by assigning either an
    empty string or a non-empty (constraint violation) message string.


    The second method, checkValidity, is invoked on a form before user input data
    is committed or saved (instance with form submission). It tests, if all fields
    have a valid value. For having the browser automatically displaying any


