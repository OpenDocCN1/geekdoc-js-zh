    fecting all objects that instantiate the class, Java classes cannot be redefined
    in such a way.


    JavaScript allows defining methods that are specific for an object, independently
    of its class. The methods of a Java object are defined for its class, it is not
    possible to define object-specific methods.


    JavaScript has better support for functional programming. For instance, it supports
    "closures", which are function execution contexts. Java only supports a limited
    version of anonymous classes and "lambdas".


    # 5 Good Programs Are: Effective, Robust, Efficient and Maintainable


    ... observed by Nick Gonzalez¹. A good program is effective: it solves the problem
    it is supposed to solve. A good program must not crash when it receives inputs
    from users: it is robust. Good programs are efficient: they do the job it is supposed
    to quickly. Since the requirements for a program may change over time, a good
    program should be maintainable, so it can be modified easily when requirements
    change. A program can only be maintainable, if its code is written in a clear
    manner.


    > Any damn fool can write code that a computer can understand, the trick is to
    write code that humans can understand. (Martin Fowler in The Program Refner²)


    Code is often "unnecessarily complicated, convoluted, disorganized, and stitched
    together with disdain", as observed in a post by Santiago L. Valdarrama³ who recommends
    using comments when necessary, only to explain things that can''t be clear enough,
    but rather make your code reveal its intention through the use of better names,
    proper structure, and correct indentation.


