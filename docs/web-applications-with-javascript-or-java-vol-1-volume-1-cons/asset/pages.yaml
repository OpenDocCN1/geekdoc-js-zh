    ```


    A closer look shows that it is sufficient to use the @PersistenceContext annotation
    and provide a unitName (see the next section) for obtaining an EntityManager instance
    at runtime. Also, obtaining a UserTransaction is as simple as using the @Resource
    annotation for the transaction reference property ut. Not only that the required
    code is short and simple, but if the database type is changed (e.g. when we switch
    from MySQL to an Oracle database), the code remains the same.


