  md: '# 2.1 JavaScript Basics 15


    All numeric data values are represented in 64-bit floating point format with an
    optional exponent (like the numeric literal 3.1e10). There is no explicit type
    distinction between integers and floating points. If a numeric expression cannot
    be evaluated to a number, its value is set to NaN (“not a number”), which can
    be tested with the built-predicate isNaN(expr).


    Unfortunately, a built-in function, Number.isInteger, for testing if a number
    is an integer has only been introduced in ES6, so a polyfill is needed for using
    it in browsers that do not support it. For making sure a numeric value is an integer,
    or a string representing a number is converted to an integer, one has to apply
    the predefined function parseInt; a string representing a decimal number can be
    converted to this with parseFloat. For converting a number to a string, the best
    method is using String(n).


    There are two Boolean literals, true and false, and the Boolean operators are
    the exclamation mark ! for NOT, the double ampersand && for AND, and the double
    bar || for OR. When a non-Boolean value is used in a condition, or as an operand
    of a Boolean expression, it is implicitly converted to a Boolean value according
    to the following rules: The empty string, the literal 0, as well as undefined
    and null, are mapped to false, and all other values are mapped to true. This conversion
    can be performed explicitly with the help of the double operation operation, like
    in the equality test !undefined === false, which evaluates to true.


    In addition to strings, numbers and Boolean values, also dates and times are important
    types of primitive values, although they are not implemented as primitive values,
    in the form of wrapper objects instantiating Date. Notice that Date objects do
    in fact, not really dates but rather date-times represented internally as the
    number of milliseconds since January 1, 1970 UTC. For converting the internal
    value of a Date object to a human-readable string, we have several options. The
    two most important are using either the standard format of ISO/date-time strings
    of the form “2015–01–27”, or localized formats of date/time strings in these examples.
    When x instanceof Date, x.toISOString() provides the ISO date/time string, and
    Given any date string, ds is ISO or localized, new Date(ds) creates a corresponding
    object date.


    For testing the equality (or inequality) of two primitive values, uses the triple
    equality symbol == (and !===) instead of the double equality symbol == (and !=).
    Otherwise, for instance, the number 2 would be the same as the string “2”, since
    the condition (2 == "2") evaluates to true in JavaScript.


