  md: '# 154 8 Implementing Constraint Validation in a Plain JS Web App


    assumption that all the data can be kept in main memory. Persistent data storage
    is implemented with JavaScript''s Local API.


    The app deals with just one object type: Movie, as depicted in the following class
    diagram.


    | Movie |

    | movid[1]: PositiveInteger(id) |

    | title[1]: NonEmptyString(120) |

    | releaseDate[0..1]: Date |


    ```

    «invariant>

    [releaseDate] >= 1895-releaseDate

    ```


    In this model, the constraints have been expressed:


    +   - Due to the fact that the movieId attribute is declared to be the standard
    identifier of Movie, and it is mandatory and unique.

    - The title attribute is mandatory, as indicated by its multiplicity expression
    [1], and has string length constraint requiring its values to have at most 120
    characters.

    - The releaseDate attribute has an interval constraint: it must be greater than
    or equal to 1895–12–28.


    Note that the releaseDate attribute is not mandatory, but optional, as indicated
    by its multiplicity expression [0.1].


    In addition to the constraints described in this list, there are the implicit
    range constraints defined by assigning the datatype PositiveInteger to movieId,
    NonEmptyString, and Date to releaseDate. In our plain JavaScript approach, all
    these properties are coded in the model class within proper-specific check functions.


