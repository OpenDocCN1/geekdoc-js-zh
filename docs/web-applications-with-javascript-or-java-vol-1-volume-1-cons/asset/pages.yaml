    # 8.1 Introduction


    The minimal JavaScript front-end application that we have discussed in Chapter
    3 has been limited to support the minimum functionality of a data management app
    only. For instance, it did not take care of preventing the user from entering
    valid data into the database. In this app’ we show how to express integrity constraints
    in a JavaScript model class, and how to perform constraint validation in both
    the model of the app and in the user interface built with HTML5¹.


    We show how perform responsive validation with the HTML5 form validation API².
    Since using the new HTML5 input field types and validation attributes (like required,
    min, max and pattern) implies defining constraints in the UI, they are not really
    useful in a best-practice approach where constraints are only checked, but not
