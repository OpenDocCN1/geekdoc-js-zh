  md: 'The rounding mode property values 0.3 have the following meaning:


    | Value | Description | Java BigDecimal equivalent |

    |---|---||

    | 0 | Rounds towards zero. i.e. truncate, no rounding. | ROUND_DOWN |

    | 1 | Rounds towards nearest neighbour. Equidistant, rounds away from zero. |
    ROUND_HALF_UP |

    | 2 | Rounds towards nearest neighbour. Equidistant, rounds towards even neighbour.
    | ROUND_HALF_EVEN |

    | 3 | Rounds away from zero. | ROUND_UP |


    In Java, we can use the built-in datatype class BigDecimal¹¹ for arbitrary-precision
    calculations. For instance, the precise result of the subtraction 0.3–0.1 is obtained
    in the following way:


    ```

    import java.math.BigDecimal;

    BigDecimal x = new BigDecimal("0.3");

    BigDecimal y = new BigDecimal("0.2");

    BigDecimal result = x.subtract( y );

    ```


    The maximum number of decimal places, called scale in Java, is either set implicitly
    by the constructor argument or explicitly with


    ```

    x.setScale( 2 );

    ```


    A scale and rounding mode can be set for each operation by providing either a
    scale value and a RoundingMode enumeration or a MathContext object. They should
    be set at least for the critical operations divide and pow (with negative exponent),
    as illustrated by the following example:


    ```

    BigDecimal x = new BigDecimal("2");

    BigDecimal y = new BigDecimal("3");

    BigDecimal result = x.divide(y, 10, RoundingMode.ROUND_HALF_UP);

    ```


    In this example, the value of the result variable is 0.66666666667.


