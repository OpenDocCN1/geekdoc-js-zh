  md: '# # 10 Enumerations and Enumeration Attributes


    # ## 10.1 Enumerations


    In all application domains, there are string-valued attributes with a fixed list
    of possible values. These attributes are called *enumeration attributes*, and
    the fixed value lists defining their profile string values are called *enumerations*.
    For instance, when we have to manage data about people, we often need to include
    information about their gender. The possible values of a *gender* attribute may
    be restricted to one of the *enumeration labels* "male", "female" and "undetermined",
    or to one of the *enumeration codes* "M", "F" and "U". Whenever we deal with these,
    we also need to have their corresponding labels, at least in a legend explaining
    the meaning of each code.


    Instead of using the enumeration values as the internal values of enumeration,
    it is preferable to use a simplified internal representation, such as the positive
    integers 1, 2, 3, etc., which enumerate the possible values. However, since these
    integers do not reveal their meaning (which is indicated by the enumeration label)
    in program code, for readability we may use special constants, called *enumeration
    literals*, such as `M` or `M`, prefixed by the name of the enumeration like `this.gender
    = GenderEL`. Notice that we follow the convention that the names of enumeration
    literals are written upper case, and that we also use the convention to suffix
    the name of an enumeration datatype with `"EL"` (that we can recognize from the
    name `GenderEL` ( is a "enumeration literal")).


    There are also enumerations having records as their instances, such that one of
    the record fields provides the name of the enumeration literals. An example of
    such enumeration is the following list of *measurement*:


    Table 10.1 Representing an enumeration of records as a table


    | Unit Symbol | Unit Name | Dimension |

    |---|---|---|

    | m | meter | length |

    | kg | kilogram | mass |

    | g | gram | mass |

    | s | second | time |

    | ms | milisecond | time |


    Notice that both the "Unit Symbol" and the "Unit Name" fields are unique, either
    of them could be used for the name of the enumeration literals.


    In summary, we can distinguish between the following three forms of enumerations:'
