  md: '# 5.2 Connecting Classes with Associations


    Whenever an app has to manage the data of more than one object type, it is very
    lik- ly there are associations between some of them. For instance, in the following
    class diagram, there is an association between publishers and books and an as-
    situation between books and people as authors.


    | publishers | published books | authored books | authors | people |

    | --- | --- | --- | --- | --- |

    | name | isbn | | | name |

    | address | 1 | title | * | * | date of birth |

    | | | year | * | date of death |


    An association between two classes can be read in both directions. The association
    between publishers and books associates


    +   1. the books by published by a publisher with this publisher, as indicated
    by the as- sation name published books,

    2. inversely (from right to left), the publisher of a book with this with.


    The association between books and people as authors associates


    +   1. the authors of a book with this book, as indicated by the association end
    name authors,

    2. inversely (from right to left), the books authored by a person with this person,
    as indicated by the association end name authored books.


    As will be discussed in Volume 2, associations are characterized by multiplicity
    con- which restrict the possibilities of how many objects of the associated class
    can be linked to an object of the given class. In our example, we have a one-to-many
    association between publishers and books and a many-to-many association be- tween
    books and people.


    For keeping things simple, we only include one object type and no association
    in the apps discussed in this volume of the book. In Volume 2, we will discuss
    how to model associations and how to implement them.


    # 5.3 From a Conceptual Model via a Design Model to Class Models


    In a new development project, we start our analysis and modeling effort with making
    a conceptual information model. This type of model is also called domain model
    since it describes the entities of a given (real-world) problem domain, and does
    not model software entities.


    Recall the conceptual information model for books obtained as the result of the
    inception phase:'
