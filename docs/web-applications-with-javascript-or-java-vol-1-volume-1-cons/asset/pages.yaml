  md: "# 168 9 Implementing Constraint Validation in a Java EE Web App\n\n**Note:**\
    \ The EntityExistsException is part of the javax.persistence-package (i.e. javax.persistence.EntityExistsException).\
    \ TomEE uses the Apache OpenJPA implementation of the JPA API, which makes the\
    \ EntityExistsException class (and other exceptions classes) part of the org.apache.jpa.persistence\
    \ package. Therefore, using this exception with our code, requires to import org.apache.persistence.EntityExistsException\
    \ instead of import javax.persistence.EntityExistsException as well as adding\
    \ the openjpa-xxx.jar (located in the lib subfolder of the TomEE installation\
    \ folder) of the Java class path for being able to have the code compiled with\
    \ Eclipse or other IDE tools.\n\n# 9.4.5 Requiring non-empty strings\n\nNormally\
    \ a mandatory string-valued attribute, as title, requires a non-empty string,\
    \ which is expressed in our model by the range NonEmptyString. For treating strings\
    \ as no value, the context path javax.faces.INTERPRET_EMPTY_STRING_SUBMITTED_VALUES_AS_NULL\
    \ must be set to true in web.xml:\n\n```\n<context-param>\n  <param-name>\n  \
    \  javax.faces.INTERPRET_EMPTY_STRING_SUBMITTED_VALUES_AS_NULL\n  </param-name>\n\
    \  <param-value>true</param-value>\n</context-param>\n```\n\n# 9.5 Write the View\
    \ Code\n\nAfter we have defined the constraints in the Java EE model layer and\
    \ the database layer, we need to take care of validation in the user interface.\
    \ In particular, we need to make sure that the user gets informed about issues\
    \ by rendering visual indicators and informative validation error messages.\n\n\
    # 9.5.1 Validation in the Create use case\n\nThe WebContent/views/books/create.xhtml\
    \ file contains the JSF facet code for creating a new Book record. Now we use\
    \ the JSF validator attribute for performing the uniqueness validation and JSF\
    \ message elements for displaying validation error messages.\n\n4 http://openjpa.apache.org/"
