  md: '# Glossary


    CRUD CRUD is an acronym for Create, Read/Retrieve, Update, Delete, which denote
    the four basic data management operations to be performed by any software application.


    CSS (Cascading Style Sheets) CSS is used for defining the presentation style of
    web pages telling the browser how to render their HTML (or XML) contents: using
    which layout of content elements, fonts and text styles, which colors, backgrounds,
    and animations. Normally, these settings are made in a separate CSS file that
    is associated with an HTML file via a special link element in the HTML''s head
    element.


    DOM (Document Object Model) The DOM is an abstract API for retrieving and modifying
    nodes and elements of HTML or XML documents. All web programming languages have
    DOM bindings that realize the DOM.


    DNS (Domain Name System) The DNS translates user-friendly domain names to IP addresses
    that allows to locate a host computer on the Internet.


    ES (ECMAScript) A standard for JavaScript defined by the industry organization
    “Ecma International”.


    XML (Extensible Markup Language) XML allows to make the structure of all kinds
    of documents, data files and messages in a machine-readable way. XML may also
    be human-readable, if the tag names are self-explaining. XML is based on Unicode.
    SVG and MathML are based on XML, and there is an XML-based version of HTML.


    XML provides a syntax for expressing structured information in the form of an
    XML document with elements and their attributes. The specific elements and attributes
    used in an XML document can come from any vocabulary, such as public standards
    or user-defined XML formats.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# H


    HTML (Hypertext Markup Language) HTML allows marking up (or describing) the structure
    of a human-readable web document or web user interface. The XML-based version
    of HTML, which is called "XHTML5", provides a simpler and cleaner syntax compared
    to traditional HTML.


    HTTP (Hypertext Transfer Protocol) HTTP is a stateless request/response protocol
    based on the Internet technologies TCP/IP and DNS, using human-readable text messages
    for the communication between web clients and web servers. The main purpose of
    HTTP has been to allow fetching web documents identified by URLs from a web browser,
    and invoking the operations of a back-end web program from an HTML form executed
    by a web browser. More recently, HTTP is increasingly used for providing web APIs
    and web services.


    # I


    IANA stands for Internet Assigned Numbers Authority, which is a subsidiary of
    ICANN responsible for names and numbers used by Internet protocols.


    ICANN ICANN stands for Internet Corporation of Assigned Names and Numbers, which
    is an international nonprofit organization that maintains the domain name system.


    IndexedDB A JavaScript API for indexed data storage managed by browsers. Indexing
    allows high-performance searching. Like many SQL DBMS, IndexedDB supports database
    transactions.


    I18N A set of best practices that help to adapt products to any target language
    and culture. It deals with multiple character sets, units of measure, keyboard
    layouts, time and date formats, and text directions.


    # J


    JSON stands for JavaScript Object Notation, which is a data-interchange format
    following the JavaScript syntax for object literals. Many programming languages
    support JSON as a light-weight alternative to XML.'
  merge: -1
  pgno: 264
