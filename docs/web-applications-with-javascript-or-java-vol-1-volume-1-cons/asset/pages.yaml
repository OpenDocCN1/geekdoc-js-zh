    \ = parseInt(formEl.year.value);\n```\n\nOne important question is: should we\
    \ take care of de-serialization: in the “view” (before the value is passed to\
    \ the “model” layer), or in the “model”? Since attribute type ranges are a business\
    \ concern, and the business logic of an app is supposed to be encapsulated in\
    \ the “model”, de-serialization should be performed in the “model” layer, and\
    \ not in the “view\".\n\n# 3.10.5 Implicit versus explicit form field labels\n\
    \nThe explicit labeling of form fields requires to add an id value to the input\
    \ element and a for-reference to its label element in the following example:\n\
    \n```\n<div>\n  <label for=\"isbn\">ISBN:</label>\n  <input id=\"isbn\" name=\"\
    isbn\" />\n</div>\n```\n\nThis technique for associating a label with a form field\
    \ is getting quite inconvenient when we have many form fields on a page because\
    \ they don't conflict with any of the id values of other elements on the same\
    \ page. it's therefore preferable to use an approach, called implicit labeling,\
    \ where these id references are not needed. In this approach, the input element\
    \ is a child element of its label element, as in\n\n```\n<div>\n  <label>ISBN:\
    \ <input name=\"isbn\" /></label>\n</div>\n```\n\nHaving input elements as children\
    \ of their label elements doesn't seem very logical. Rather, one would expect\
    \ the label to be a child of an input element. But that's the way it is defined\
    \ in HTML5.\n\nA small disadvantage of using implicit labels may be the lack of\
    \ support by certain CSS libraries. In following parts of this tutorial, we will\
    \ use our own CSS styling for implicit form fields."
