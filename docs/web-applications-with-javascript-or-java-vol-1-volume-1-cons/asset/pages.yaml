  md: '# 52 — Building a Minimal Web App with Plain JS in Seven Steps


    # 3.10 Points of Attention


    # 3.10.1 Catching invalid data


    The app discussed in this chapter is limited to support the minimum functionality
    of a data management app only. It does not take care of preventing users from
    entering invalid data into the app’s database. In Chapter 8, we show how to express
    integrity constraints in a model class, and how to perform data validation both
    in the model/storage code of the app and in the HTML5-based user interface.


    # 3.10.2 Database size and memory management


    Note that in this chapter, we have made the assumption that all application data
    can be loaded into main memory (like all book data is loaded into the map Book.instances).
    This approach only works in the case of local data storage of smaller databases,
    with not more than 2 MB of data, roughly corresponding to 10 tables with an average
    population of 1000 rows, each having an average size of 200 Bytes. When larger
    databases are to be managed, or when data is stored remote-ly, it is no longer
    possible to load the entire population of all tables into main memory, and here
    we use a technique where only parts of the content are loaded.


    # 3.10.3 Boilerplate code


    Another issue with the do-it-yourself code of this example app is the boilerplate
    code needed per model class for the data storage management methods add, retrieve,
    update, and destroy. While it is good to write this code a few times for learning
    app development, you don’t want to write it again and later when you work on real
    projects. In Volume 2, we present an approach how to put these methods in a generic
    form in a meta-class, such that they can be reused in all model classes of an
    app.


    # 3.10.4 Serializing and de-serializing attribute values


    Serializing an attribute value means to convert it to a suitable string value.
    For standard types, such as numbers, a standard serialization is provided by the
    prede-conversion function String. When a string, like “13” or “yes”, represents
    the value of a non-string-valued attribute, it has to be de-serialized, that is,
    converted to the range type of the attribute, before it is assigned to the attribute.
    This is the situation, for instance, when a user has entered a value in a form
    input field for an integer-valued attribute. The value of the form field is of
    type string,'
