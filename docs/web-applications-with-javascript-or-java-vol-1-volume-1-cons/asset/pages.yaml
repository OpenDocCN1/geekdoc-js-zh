  md: "# 202 11 Implementing Enumeration Attributes in a Plain JS Web App\n\n# 11.5.6\
    \ Data management operations\n\nThere are only two new issues in the data management\
    \ operations compared to the validation app:\n\n+   1. We have to make sure the\
    \ `util.cloneObject` method, which is used in `Book.update`, takes care of copying\
    \ array-valued attributes, which we didn't have before (in the validation app).\
    \ In the `Book.update` method we now have to check if the values of array-valued\
    \ attributes have changed, which requires to test if two arrays are equal or not.\
    \ For readability, we add an array equality test to `Array.prototype.browserShims.js`,\
    \ like so:\n```javascript\nArray.prototype.isEqualTo = function (a2) {\n  return\
    \ (this.length === a2.length) && this.every(function ( el, i) {\n    return el\
    \ === a2[i];\n  });\n}\n```\n\nThis allows us to express these tests in the following\
    \ way:\n```javascript\nif (book.publicationForms.isEqualTo( slots.publicationForms))\
