    # 3.9 Possible Variations and Extensions


    # 3.9.1 Using IndexedDB as an Alternative to LocalStorage


    Instead of using the Local Storage API, the IndexedDB API could be used for locally
    storing the application data. With Local Storage you have only one database (which
    you may have to share with other apps from the same domain) and there is no support
    for database tables (which we have worked around this limitation in our approach).
    With IndexedDB you can set up a specific database for your app, and you can define
    database tables, ''object stores'', which may have indexes for accessing records
    with the help of an indexed attribute instead of the standard identifier attribute.
    Also, since IndexedDB supports larger databases, its access methods are asynchronous
    and can be invoked in the context of a database transaction.


    Alternatively, for remotely storing the application data with the help of a web
    API one can either use a back-end solution component or a cloud storage service.
    The remote storage approach allows managing larger databases and supports multi-user
    apps.


