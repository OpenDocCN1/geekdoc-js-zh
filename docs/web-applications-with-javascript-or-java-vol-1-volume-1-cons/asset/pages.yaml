  md: '# X


    XHR (XML HTTP Request) The XML HTTP Request (XHR) API allows a JavaScript program
    to exchange HTTP messages with back-end programs. It can be used for retrieving/submitting
    information from/to a back-end program without submitting HTML forms. XHR-based
    approaches have been subsumed under the acronym “AJAX” in the past.'
  merge: -1
