  md: '# #7 Integrity Constraints and Data Validation


    # ## 7.1 Introduction


    For detecting non-admissible and inconsistent data and for preventing such data
    to be added to an application''s database, we need to define suitable integrity
    constraints that can be used by the application''s data validation mechanisms
    for catching these cases of flawed data. Integrity constraints are logical conditions
    that must be satisfied by the data entered by a user and stored in the application''s
    database.


    For instance, if an application is managing data about persons including their
    birth dates and their death dates, we must make sure that for any person record
    with a death date, this date is not before person''s birth date.


    Since integrity maintenance is fundamental in database management, the data definition
    part of the relational database language SQL supports the definition of integrity
    constraints in various forms. On one hand, however there is hardly any support
    for integrity constraints and data validation in common programming languages
    such as PHP, Java, C# or JavaScript. It is important to take a systematic approach
    to constraint validation in web application engineering, choosing an application
    development framework that provides sufficient support for it.


    Unfortunately, many web development frameworks do not provide sufficient support
    for defining integrity constraints and performing data validation. Integrity constraints
    should be defined in one (central) place in the app, and then be used for configuring
    the user interface and for validating data in different parts of the app, such
    as the user interface and in the database. In terms of usability, the goals should
    be:


    +   1. To prevent the user from entering invalid data in the user interface (UI)
    by limiting the input options, if possible.


    +   2. To detect and reject invalid input as early as possible by performing constraint
    validation in the UI for those widgets where invalid input cannot be prevented
    by limiting the input options.


    +   3. To prevent that invalid data pollutes the app''s main memory state and
    persistent database by performing constraint validation also in the model layer
    and in the database.


    HTML5 provides support for validating user input in an HTML-forms based user interface
    (UI). Here, the goal is to provide immediate feedback to the user whenever invalid
    data has been entered into a form field. This UI mechanism of responsive validation
    is an important feature of modern web applications. In traditional web applications,
    the back-end component validates the data and returns the results in the form
    of a set of error messages to the front-end. Only then, after several seconds,
    in the hard-to-digest form of a bulk message, does the user get the validation
    feedback.'
