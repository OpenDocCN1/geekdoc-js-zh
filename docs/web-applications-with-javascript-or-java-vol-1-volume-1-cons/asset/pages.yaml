  md: "# 12 Implementing Enumeration Attributes in a Java EE Web App\n\n# 12.2 Make\
    \ an Entity Class Model\n\nUsing the information design model shown in Figure\
    \ 10.2 above as the starting point, we make an entity class model, essentially\
    \ adding getters/setters, constraint annotations and CRUD methods, as explained\
    \ before:\n\n| Entity Book |\n| --- |\n| +get/set-isbn : String @Id, @NotNull,\
    \ @Pattern(\"\\\\d{10,13}\") |\n| +get/set-title : String @NotNull, @Size(max=50)\
    \ |\n| +get/set-language : LanguageEL (@NotNull) |\n| +get/set-otherAvailableLanguages\
    \ : List<LanguageEL> |\n| +get/set-category : BookCategoryEL (@NotNull) |\n| +get/set-publicationForms\
    \ : List<PublicationFormEL> (@Size(min=1)) |\n| +toString() |\n| +checkIsbnAid(em\
    \ : EntityManager, isbn : String) |\n| +retrieveIn(em : EntityManager): List<Book>\
    \ |\n| +create() |\n| +update(in) |\n| +delete(in) |\n\nFigure 12.1 A JPA class\
    \ model for the object type Book\n\n# 12.3 Write the Code Model\n\n# 12.3.1 Code\
    \ the enumerations\n\nSimple enumerations, like BookCategoryEL and PublicationFormEL,\
    \ are coded in the following way with the help of Java's enum construct:\n\n```\n\
    public enum BookCategoryEL {\n    NOVEL,\n    BIOGRAPHY,\n    TEXTBOOK,\n    OTHER;\n\
    }\n```\n\nNotice how the enumeration literals are defined with capitalized names\
    \ in a comma-separated list.\n\nFor a code list, like LanguageEL, where each enumeration\
    \ instance consists of a code and a label, we use the codes as enumeration lists\
    \ and define an attribute label for storing the labels, as well as a private constructor\
    \ that allows enumeration instances consisting of a code and a label. This is\
    \ possible in Java, an enum is a special kind of class. Each entry in the list\
    \ of enumeration literals, such as EN(\"English\"), represents an invocation of\
    \ the enum's constructor:\n\n```\npublic enum LanguageEL {\n    EN(\"English\"\
    ),\n    DE(\"German\"),|\n```"
