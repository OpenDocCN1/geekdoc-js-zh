    For instance, after creating an object f = new Foo(), it holds that Object.getPrototypeOf(f),
    which is the same as f.__proto__, equals to Foo. Consequently, changes to the
    slots of Foo.__prototype affect all objects that were created with new Foo().
    While every object has a __proto property slot, only objects constructed with
    new have a constructor property slot.


