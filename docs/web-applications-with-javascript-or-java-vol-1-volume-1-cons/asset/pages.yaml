  md: "# #12 Implementing Enumeration Attributes in a Java EE Web App\n\nIn this chapter,\
    \ we show how to build a back-end web application with enumeration attributes,\
    \ using Java JPA and JSF. In addition to the topic of enumeration attributes,\
    \ we also show how to deal with multi-valued attributes.\n\n# ##12.1 New Issues\n\
    \nCompared to the Validation App discussed in Chapter 9 we have to deal with the\
    \ following new issues:\n\n+   1. Enumeration datatypes have to be defined in\
    \ a suitable way as part of the model code.\n2. Enumeration attributes have to\
    \ be defined in model classes and handled in the user interface with the help\
    \ of suitable choice widgets.\n\nIn terms of coding, the new issues are:\n\n+\
    \   1. In the model code we have to take care of\n   a. enumerations to be defined\
    \ in the form of Java enum classes;\n   b. single-valued enumeration attributes,\
    \ like Book::originalLanguage, requiring the JPA annotation @Enumerated for defining\
    \ the conversion between Java enumeration literals and corresponding database\
    \ table column values;\n   c. multi-valued enumeration attributes, like Book::publicationForms,\
    \ requiring the JPA annotation @Convert with suitable arguments defining a JPA\
    \ custom converter for (de-)serializing collections of Java enumeration\n   d.\
    \ extending the methods Book.create, and Book.update that we take care of the\
    \ enumeration attributes.\n2. In the user interface we have to take care of\n\
    \   a. adding new table columns in retrieveAndAll.xhtml;\n   b. adding suitable\
    \ choice widgets in create.xhtml and upate.xhtml;\n   c. rendering multi-valued\
    \ enumeration attributes in the table view of retrieveAndAll.xhtml and in the\
    \ choice widgets of create.xhtml and update.xhtml (with the help of an array of\
    \ JSF SelectItems, consisting of an enumeration value and its label)."
