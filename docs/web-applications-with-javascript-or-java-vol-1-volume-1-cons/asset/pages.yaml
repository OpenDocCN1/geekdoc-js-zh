  md: '# 13.4 Calendar Dates and Times


    Both JavaScript and Java have a built-in Date class that actually does not represent
    calendar dates, but rather timestamps (or date-times) in the specific form of
    the number of milliseconds since 1 January, 1970 UTC.


    # 13.4.1 Using JavaScript''s Date class


    JavaScript''s Date class allows to represent Gregorian calendar timestamps in
    the interval of +/- 100 Million days or approximately 285,000 years either forward
    or backward, from 01 January, 1970 UTC.


    A JS date-time can be created in several ways:


    ```

    var dateTimeManOnMoon = new Date(1969, 7, 20);

    var firstDateManOnMoon = new Date("1969-07-20");

    var firstTimeManOnMoon = new Date (1969, 7, 20, 18, 0);

    var firstTimeManOnMoon = new Date("1969-07-20T20:18:00");

    ```


    A timestamp with the current date and time can be created in the following way:


    ```

    var currentDate = new Date();

    ```


    Assume that the Book class defined above has an additional attribute publicationDate,
    the values of which have to be included in HTML tables and forms. While date/time
    information have need to be formatted as a human-readable form on web pages, in
    localized form based on the settings of the user''s browser, it''s not a good
    idea to store date/time values in this form in a database. Rather we use instances
    of the predefined JavaScript class Date for representing date/time values internally
    and for storing them. The predefined functions toString() and toLocaleString()
    can be used for turning Date values into ISO standard date/time strings of the
    form "2015-01-27", or to localized date/time strings like "27.1.2015" (for simplicity,
    we have omitted the time part in these strings.


    In summary, date/time values may be expressed in three different formats:


    +   1. Internally, for storage and computations, is a Date value.

    2. Internally, for annotating localized date/time strings, or, for displaying
    a date/time value in a standard format, as an ISO standard date/time string, e.g.,
    with the help of toString().

    3. Externally, for displaying a date/time value in a localized form, as a localized
    date/time string, e.g., with the help of toLocaleString().


    Since the calendar arithmetic and calendar date manipulation functionality is
    limited, using a library like date-fns may be helpful for doing more advanced
    calendar computations.


