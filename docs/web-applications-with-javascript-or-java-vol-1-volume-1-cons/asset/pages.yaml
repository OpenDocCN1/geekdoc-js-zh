  md: '# 4.4 Step 3 – Configure the App 73


    Note that the h namespace must be defined once again in footer.xhtml if it has
    already been defined in page.xhtml. In the footer template component, we define
    the "Back to main menu" operation, which is going to be injected into each page
    that uses this template. The main region is dynamic, and will be replaced with
    the content generated by a facelet template.


    JSF is using the following namespaces:

    xmlns:ui="http://java.sun.com/jsf/facelets" for the JSF Tag Library providing
    templating elements (like ui:insert for specifying the region of a template where
    to inject the facelet content)


    xmlns:h="http://java.sun.com/jsf/html" for the JSF HTML Tag Library versions of
    HTML, which are mapped to HTML elements. For example h:inputText, which is mapped
    to an HTML input element.


    xmlns:f="http://java.sun.com/jsf/core" for the JSF Core Tag Library providing
    custom actions that are independent of any particular renderer. For example, f:actionListener
    can be used to define a Java method that is executed when the user clicks a button.


    xmlns:p="http://xmlns.jp.com/jsf/xpath" for using HTML attributes in JSF elements
    and passing them through the generated HTML. For example


    xmlns:c="http://java.sun.com/jsf/jstl" for the JSTL Tag Library providing all
    kinds of features, like dealing with loops and defining variables. For example,
    we can use <c:set var="isbn" value="#{isbn}\/> to create a variable name isbn
    which can be used in the view code for conditional expressions.


    xmlns:f="http://java.sun.com/jsf/jstl/functions" for the JSTL Functions Library
    providing utility functions, such as string convertions. For example, we can use
    fn:toUpperCase to convert a string to its uppercase representation.


