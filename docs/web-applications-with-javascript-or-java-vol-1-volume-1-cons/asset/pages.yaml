  md: "# 9.4.4 Dealing with model-related exceptions\n\nThe Book.checkISBN method\
    \ discussed in the previous sub-section is designed to be used in combination\
    \ with a controller so the user gets an error message when trying to duplicate\
    \ a Book record (i.e., if the isbn value is already used in an existing record).\
    \ However, if the Book.create method is used directly (i.e. by any piece of code,\
    \ where the uniqueness is not performed by calling Book.checkISBNAsId), then uniqueness\
    \ validation may fail. Lets have a look on the Book.create code:\n\n```\npublic\
    \ static void create(EntityManager em, UserTransaction ut,\n    String isbn, String\
    \ title, int year)\n    throws UnsupportedException, SystemException,\n    IllegalStateException,\
    \ SecurityException,\n    HeuristicMixedException, HeuristicRollbackException,\n\
    \    RollbackException, EntityExistsException {\n    Book book = new Book(isbn,\
    \ title, year);\n    em.persist(book);\n    ut.commit();\n}\n```\n\nThe method\
    \ may throw a number of exceptions when trying to run the persist or the commit\
    \ code. One of the exceptions (i.e. EntityExistsException) is thrown by the ut.commit.\
    \ The method calls Book.create may catch this exception and perform specific actions,\
    \ such as rolling back the transaction. In our case, the Book.create is called\
    \ by the create action performed to show the exception stack trace in the BookController\
    \ class, and as well as the ut.rollback which takes care of cancelling any database\
    \ change performed by the current transaction. The rest of the exceptions are\
    \ caught by their super class (i.e. Exception) and the exception stack trace is\
    \ displayed in the console.\n\n```\npublic String create(String isbn, String title,\
    \ int year) {\n    try {\n        Book.create(em, ut, isbn, title, year);\n  \
    \  } catch (EntityExistsException e) {\n        try {\n            ut.rollback();\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \        e.printStackTrace();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
    \    }\n    return \"create\";\n}\n```"
