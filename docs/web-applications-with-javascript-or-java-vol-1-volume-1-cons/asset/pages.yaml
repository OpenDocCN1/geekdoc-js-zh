  md: '# 8.9.2 Configuring the UI for preventing invalid user input


    Some of the new HTML5 input field types (like number, date or color) are intended
    to allow web browsers rendering corresponding input elements in the form of UI
    widgets (like date or color pickers) that limit the user''s input options such
    that only valid input is possible. In terms of usability, it''s preferable to
    prevent users from entering invalid data instead of allowing it to enter and only
    then checking its validity and reporting errors. Unfortunately, and this is quite
    disappointing, many browsers do, in 2017, still not have reasonable widget implementations
    for these HTML5 input field types yet.


