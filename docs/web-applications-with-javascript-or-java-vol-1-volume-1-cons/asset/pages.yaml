  md: '# 2.1.5 Array lists


    A JS array represents, in fact, the logical data structure of an array list, which
    is a list where each list item can be accessed via an index number (like the elements
    of an array). Using the term ''array'' without saying ''JS array'' creates a terminological
    ambiguity. For simplicity, we will sometimes say ''array'' instead of ''JS array''.


    A variable may be initialized with a JS array literal:


    ```

    var a = [1,2,3];

    ```


    Because they are array lists, JS arrays can grow dynamically: it is possible to
    use indexes that are greater than the length of the array. For instance, after
    the array variable initialization, the array held by the variable a has a length
    3, but still we can assign a fifth element array in


    ```

    a[4] = 7;

    ```


    The contents of an array a are processed with the help of a standard for loop
    with a counter variable counting from the first array index 0 to the last array
    index, which is a.length-1:


    ```

    for (i=0; i < a.length; i++) { ... }

    ```


    Since arrays are special types of objects, we sometimes need a method for finding
    out if a variable represents an array by applying the predefined predicate isArray
    in Array.isArray( a). For adding a new element to an array, we append it to the
    array using the push operation in:


    ```

    a.push(newElement);

    ```


    For deleting an element at position i from an array a, we use the predefined array
    method splice in:


    ```

    a.splice(i, 1);

    ```


    For searching a value v in an array a, we can use the predefined array method
    indexOf, which returns the position, if found, or -1, otherwise as in:


    ```

    (a.indexOf(v) > -1) ...

    ```


    For looping over an array a, we have two options: either a for loop, or the array
    looping method阵. In any case, we can use a for loop:


    ```

    var i=0;

    for (i=0; i < a.length; i++) {

    console.log( a[i]);

    }

    ```'
