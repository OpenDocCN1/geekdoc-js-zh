  md: '# 9.3 Make an Entity Class Model


    Using the information design model shown in Figure 7.2 as the starting point,
    we make an Entity class model with getters/setters and corresponding Java datatypes.


    ![](img/42f1421051423f5b9e022255ae58c362_180_0.png)


    Figure 9.1 Drawing an Entity class model from an information design model


    The Entity class model shown on the right hand side in Figure 9.1 defines getters
    and setters for all properties and the property constraint annotations:

    1. Using @Id and @NotNull, the isbn attribute is declared to be a standard identifier,
    implying that it is mandatory and unique.

    2. Using @Pattern("\d{10}\b"), the isbn attribute has a pattern constraint requiring
    its values to match the ISBN-10 format (simplified to the case of 10-digit strings).

    3. Using @NotNull and @Size(max=50), the title attribute is mandatory and has
    a length maximum constraint of at most 50 characters.

    4. Using @NotNull, @Min(1459) and the custom annotation @UpToNextYear, the year
    attribute is mandatory and has an interval constraint, of a special form where
    the maximum is fixed, but provided by a custom annotation implementing the calendar
    arithmetic function nextYear().


    Since there are no predefined Bean Validation annotation for the uniqueness of
    an ID value provided when creating a new entity object, we define a static method
    checkisbnAsld that can be invoked in the controlling method when creating a new
    entity object.


    In addition, the entity class model defines the static CRUD data management methods
    retrieveAll, create, update and delete.'
