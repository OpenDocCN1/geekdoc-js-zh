  md: '# 3 Building a Minimal Web App with Plain JS in Seven Steps


    In addition to defining the model class in the form of a constructor function,
    we also define the items in the Book.js file:


    +   1. A class-level property Book.instances representing the collection of all
    Book instances managed by the application in the form of an entity table.

    2. A class-level method Book.retrieveAll for loading all managed Book instances
    from the persistent data store.

    3. A class-level method Book.saveAll for saving all managed Book instances to
    the persistent data store.

    4. A class-level method Book.add for creating a new Book instance.

    5. A class-level method Book.update for updating an existing Book instance.

    6. A class-level method Book.destroy for deleting a Book instance.

    7. A class-level method Book.createTestData for creating a few example book records
    to be used as test data.

    8. A class-level method Book.clearData for clearing the book datastore.


