  md: '# 6.5 Deployment Architectures


    ![](img/42f1421051423f5b9e022255ae58c362_130_0.png)


    In many MVC web application frameworks, the model is tightly coupled with the
    underlying data storage technology, often via an object-relational mapping (ORM)
    approach mapping classes to tables and objects to table rows. This tight coupling
    makes classes dependent on a specific database technology or even on corresponding
    database tables. It therefore violates the onion principle, since the model is
    the most fundamental part of an app, so it must not depend on any other part.


    # 6.5 Deployment Architectures


    In addition to an information architecture and a code base organization architecture
    (like MVC), we also have the cross-cutting issue of how to distribute the different
    parts of an app when it is deployed, so we also need a deployment architecture.


    Traditionally, most parts of a web app have been executed on back-end comput,
    while only its HTML/CSS user interface code has been executed on the front-end
    (or client) side, within a web browser. With the rise of modern JavaScript, we
    have the option to replace traditional back-end web apps with JavaScript front-end
    apps, where most parts of the app are executed within a web browser on a front-end
    device. Such a front-end web app may use local storage or a (remote) cloud storage
    service, as illustrated by the two architecture diagrams shown in Figure 6.2.


    ![](img/42f1421051423f5b9e022255ae58c362_130_1.png)


    Figure 6.2 Architectures for front-end web apps'
