- img_proc: true
  md: 'In a UML diagram, the derivation of a property can be specified by an OCL derive
    expression that evaluates the value of the derived property for a given object.
    In the case of a property being the inverse of another property, specified by
    the constraint expression (inverse of anotherProperty) appended to the property
    declaration, the derivation expression is implied. In our example, for any club
    member m, it evaluates to the committee c such that c.chair = m. In OCL, this
    derivation would be executed per committee object


    ```

    context ClubMember::chainedCommittee: Committee

    drive:

    if Committee.allInstances().exists(c | c.chair = self) then c

    ```


    There are two ways to realize the derivation of a property: it may be derived
    on a read-time computation of its value, or it may be derived on update via an
    update-time computation performed whenever one of the variables in the derivation
    expression (typically, another property) changes its value. The latter case responds
    to a materialized view in a database. While a reference property that is derived
    on read may not guarantee efficient navigation, because the on-read computation
    may create unacceptable latencies, a reference property that is derived on update
    provides efficient navigation.


    When we designate an inverse reference property as derived by prefixing its name
    with a slash (/), we indicate that it is derived on update. For instance, the
    property /chainedCommittee in the example above is derived on update.


    In the case of a derived reference property, we have to deal with life-cycle dependencies
    between the affected model classes requiring special change management mechanisms
    based on the functionality of the represented association (either one-to-one,
    many-to-one or many-to-many).


    In our example of the derived inverse reference property ClubMember::chainedCommittee,
    which is single-valued and optional, this means


    +   1. whenever a new committee object is created (with a mandatory chair assignment),
    the corresponding ClubMember::chainedCommittee property has to be assigned accordingly;

    2. whenever the chair property is updated (that is, a new chair is assigned to
    a committee), the corresponding ClubMember::chainedCommittee property has to be
    unset for the club member who was the previous chair and set for the one being
    the new chair;

    3. whenever a committee object is destroyed, the corresponding ClubMember::chainedCommittee
    property has to be unset.'
