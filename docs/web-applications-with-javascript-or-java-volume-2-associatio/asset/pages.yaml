  md: '+   1. We have declared the segmentation of Person into Employee and Author
    to be disjoint and complete, that is, any person is either an employee or an author.
    Since Java does not support multiple classification, we cannot implement an overlapping
    segmentation, as needed when modeling roles, with Java.

    2. We turned Person into an abstract class (indicated by its name written in italics),
    which means that it cannot have direct instances, but only indirect ones via its
    subclasses Employee and Author. This technical design is compatible with the fact
    that any Person is an Employee or Author (or both), and consequently there is
    no need for any object to instantiate directly.


