    # 1.7.1 The Basic Elimination Procedure


    The starting point of our restricted association elimination procedure is an information
    design model with various kinds of unidirectional associations, such as the model
    shown in Figure 1.6 above. If the model still contains any non-directional associations,
    we have to turn them into directional ones by making a decision on the ownership
    of their ends, as discussed in Section 1.5.


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source class having


    +   1. the same name as the association end, if there is any, otherwise it is
    set to the name of the target class (possibly pluralized), if the reference property
    is multi-valued);

    2. the target class as its range;

    3. the multiplicity as the target association end,

    4. a uniqueness constraint if the unidirectional association is inverse functional.


