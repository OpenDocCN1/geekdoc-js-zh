    # 4.4.4 Code Getters and Setters


    Code the setter operations as (instance-level) methods. The setters only assign
    values and do not perform any validation, since the property constraints are only
    checked before save by the Java EE execution environment. The getters simply return
    the actual values of properties.


    # 4.4.5 Implement a Deletion Policy


    For any reference property, we have to choose and implement a deletion policy
    for taking care of the corresponding object destruction dependency in the delete
    method of the reference property’s range class. In our case, we have to choose
    between


    +   1. deleting all books published by the deleted publisher;

    2. dropping from all books published by the deleted publisher reference to the
    deleted publisher.


    We choose the second policy, which can only be used if the case of an optional
    reference property such as book.publisher. This is shown in the following code
    of the Publisher.delete method where all book entities concerned the property
    publisher is cleared.


    ```

    public static void delete(EntityManager em, UserTransaction ut,

    throws Exception {

    ut.begin();

    Publisher publisher = em.find(Publisher.class, name);

    // // find All Books which has this publisher

    Query query = em.createQuery("SELECT b FROM Book b WHERE b.publisher.name = :name");

    query.setParameter("name", name);

    }

    ```'
