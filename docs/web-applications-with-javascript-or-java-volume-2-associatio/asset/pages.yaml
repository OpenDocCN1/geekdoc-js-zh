  md: "# 3 Implementing Unidirectional Non-Functional Associations with Plain JS\n\
    \nA unidirectional non-functional association is either one-to-many or many-to-many.\
    \ In both cases such an association is represented, or implemented, with the help\
    \ of a multi-valued reference property.\nIn this chapter, we show\n\n+   1. how\
    \ to derive a JS class model from an OO class model with multi-valued reference\
