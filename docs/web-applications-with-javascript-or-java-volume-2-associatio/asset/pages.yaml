    When using the JPA Single Table Inheritance technique for a class hierarchy, the
    @Inheritance annotation (e.g. Book in our example) must be set for the superclass
    it provides the strategy parameter with the value InheritanceType.SINGLE_TABLE.
    The @DiscriminatorColumn annotation specifies the name of the column storing the
    values between different types of subclasses (Textbook and Biography, in our example).


    Unfortunately, we cannot use our BookCategoryEL enumeration for defining the type
    of the column, because Java expressions like BookCategoryEL.TEXTBOOK.name() are
    not constant, so a Java compiler exception is thrown. Instead, we use DiscriminatorType.STRING.
    The @DiscriminatorValue specifies a unique value to be stored in the discriminator
    column of rows representing an instance of the given class.


    Further, we define subclasses Textbook and Biography:


    ```

    @Entity(name="textbooks")

    @DiscriminatorValue(value="TEXTBOOK")

    @ManagedBean(name="textbook") @ViewScoped

    public class Textbook extends Book (

    @Column( nullable=false) @NotNull(

    message="A subject area value is required")

    String subjectArea;

    constructors, set, get and other methods

    )

    ```


    Textbook and Biography are subclasses of Book, so we define them with extends.
    For each subclass, we add a @DiscriminatorValue annotation with a value from the
    BookCategoryEL enumeration.


