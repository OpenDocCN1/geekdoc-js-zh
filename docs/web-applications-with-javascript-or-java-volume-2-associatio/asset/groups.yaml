    \ (manyToMany, mappedBy=\"authors\") |\n| +checkPersonId(in pld : Integer, em\
    \ : EntityManager) : ConstraintViolation |\n| +toString(): String |\n| +...()\
    \ |\n\n![](img/1a8b608b42ede8e4d7e1a974745ae019_116_0.png)\n\n## 9.2 Write the\
    \ Model\n\nThe Java Entity model class can be directly coded for getting the model\
    \ layer code of our Java back-end app.\n\n### 9.2.1 New Issues\n\nCompared to\
    \ the unidirectional association app discussed before, we have to deal with a\
    \ number of new technical issues:\n\n- 1. In the model code you now have to take\
    \ care of maintaining the derived inverse reference properties by maintaining\
    \ the derived (sets) of inverse references that form the values of a derived inverse\
    \ reference property. In particular:\n  1. whenever the value of a single-valued\
    \ master reference property is initialized or updated with the help of a setter\
    \ (such as assigning a reference to an Publisher instance p to p.publisher for\
    \ a Book instance), an inverse reference has to be assigned or added to the corresponding\
    \ value of the derived inverse reference property (such as adding b to p.publishedBooks);\
    \ when the value of the master reference property is updated and the inverse reference\
    \ property is multi-valued, the obsolete inverse reference to the previous value\
    \ of the single-valued master reference property has to be deleted;\n  2. whenever\
    \ the value of an optional single-valued master reference property is unset (eg.\
    \ by assigning null to b.publisher for a Book instance), the inverse reference\
    \ has to be removed from the corresponding value of the derived inverse reference\
    \ property (such as removing b from p.publishedBooks); if the derived inverse\
    \ reference property is multi-valued, otherwise the corresponding value of the\
    \ derived inverse reference property has to be unset or updated;\n  3. whenever\
    \ a reference is added to the value of a multi-valued master reference property\
    \ with the help of an add method (such as adding an Author reference to b.authors\
    \ for a Book instance), an inverse reference has to be assigned or added to the\
    \ corresponding value of the derived inverse reference property (such as adding\
    \ b to p.publishedBooks);\n  4. whenever a reference is removed from the value\
    \ of a multi-valued master reference property with the help of a remove method\
    \ (such as removing an Author reference from b.authors for a Book instance), an\
    \ inverse reference has to be assigned or removed from the corresponding value\
    \ of the derived inverse reference property.\n\n### 9.2.2 Summary\n\n- 1. In the\
    \ model code you now have to take care of maintaining the derived inverse reference\
    \ properties by maintaining the derived (sets) of inverse references that form\
    \ the values of a derived inverse reference property.\n- 2. The Java Entity model\
    \ class can be directly coded for getting the model layer code of our Java back-end\
    \ app.\n- 3. Compared to the unidirectional association app discussed before,\
    \ we have to deal with a number of new technical issues:\n- 4. For any reference\
    \ property designated as the inverse of (inverse of...) another reference property,\
    \ replace it with a {mappedBy=\"...\"} property modifier.\n- 5. Create the required\
    \ property constraint operations.\n- 6. Create an add, and a remove operation\
    \ for each multi-valued property.\n- 7. This leads to the following Java Entity\
    \ class: (refer to the tables above)\n- 8. For any reference property designated\
    \ as the inverse of (inverse of...) another reference property, replace it with\
    \ a {mappedBy=\"...\"} property modifier.\n\n### 9.2.3 Code Each Class of the\
    \ Java Entity\n\nIn the Publisher class, we add the publishedBooks property and\
    \ use the @OneToMany annotation corresponding to ManyToOne:\n\n```java\n@Entity\n\
    public class Publisher {\n  ..\n  @OneToMany(fetch=FetchType.EAGER, mappedBy=\"\
    publisher\")\n  private Set<Book> publishedBooks;\n}\n```\n\nThe mappedBy parameter\
    \ of the @OneToMany annotation specifies the property name in the Book class:\n\
    \n```java\n@Entity\npublic class Book {\n  ..\n  @ManyToOne(fetch=FetchType.EAGER)\n\
    \  @JoinColumn(name=\"PUBLISHER_ID\")\n  private Publisher publisher;\n}\n```\n\
    \nIn the Author class we add the authoredBooks property with the @ManyToMany annotation\
    \ corresponding toToMany:\n\n```java\n@Entity\npublic class Author {\n  ..\n \
    \ @ManyToMany(fetch=FetchType.EAGER, mappedBy=\"authors\")\n  private Set<Book>\
    \ authoredBooks;\n}\n```\n\nThe mappedBy attribute of the @ManyToMany authoredBooks\
    \ property of the Author class specifies the name of the inverse property in the\
    \ Book class:\n\n```java\n@Entity\npublic class Book {\n  ..\n  @ManyToMany(fetch=FetchType.EAGER)\n\
    \  @JoinTable(\n    name=\"books_authors\",\n    joinColumns = @JoinColumn(name=\"\
    BOOK_ID\"),\n    inverseJoinColumns = @JoinColumn(name=\"AUTHOR_ID\")\n  )\n \
    \ private Set<Author> authors;\n}\n```\n\n### 9.2.4 Code the Setter Operations\n\
    \nAny setter for a reference property that is coupled to a derived inverse reference\
    \ property (implementing a bidirectional association), now also needs to assign/add/remove\
    \ inverse references/from to the corresponding value (set) of the inverse property.\
    \ An example of such a setter is the following setPublisher method:\n\n```java\n\
    public class Book {\n  ...\n  public void setPublisher(Publisher publisher) {\n\
    \    // remove the book reference from publisher.publishedBooks\n    if (this.publisher\
    \ != null) {\n      this.publisher.removePublishedBook(this);\n    }\n    // add\
    \ the book to publisher.publishedBooks\n    if (publisher != null) {\n      publisher.addPublishedBook(this);\n\
    \    }\n    this.publisher = publisher;\n  }\n}\n```\n\n### 9.2.5 Code the Add\
    \ and Remove Operations\n\nFor any multi-valued reference property that is coupled\
    \ to a derived inverse reference property, both the add and the remove method\
    \ also have to assign/add/remove corresponding references to/from (the value set\
    \ of) the inverse property.\n"
