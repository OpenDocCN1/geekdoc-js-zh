    >\n    <h:column>\n      <f:facet name=\"header\">Publisher</f:facet>\n      #{b.publisher.name}\n\
    \    </h:column>\n    <h:column>\n      <f:facet name=\"header\">Authors</f:facet>\n\
    \      #{b.authorNames}\n    </h:column>\n  </h:dataTable>\n<h:button value=\"\
    Back\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\nRecall that\
    \ using b.authorNames results in invoking a method named getAuthor on the given\
    \ object.\n\n### 5.5.2 Allow Selecting Associated Objects in Create\n\nFor allowing\
    \ to select multiple authors to be associated with a book in the create book use\
    \ case, a multiple selection list (a select element with multiple=\"multiple\"\
    ) as shown in the facet color below, is populated with the instances of the associated\
