- md: "\n## 28 Implementing Unidirectional Functional Associations with Plain JS\n\
    \n```js\nif (publisher || publisher_id) {\n  this.publisher = publisher || publisher_id;\n\
    }\n...\n}\n```\n\nNote that the Book constructor can be invoked either with object\
    \ references authors or with ID references authorIdRefs and publisher_id. This\
    \ approach makes using the Book constructor more flexible and more robust.\n\n\
    ## 2.5.3 Code the Property Checks\n\nTake care that all constraints of a property\
    \ as specified in the JS class model are properly coded in its check function,\
    \ as explained in Chapter 8 of Volume 1. Recall that constraint violation (or\
    \ validation error) classes are defined in the file lib/errorTypes.js.\nFor instance,\
    \ for the Publisher.checkName function we obtain the following code:\n\n```js\n\
    class Publisher {\n  static checkName(n) {\n    if (n === undefined) {\n     \
    \ return new NoConstraintViolation(); // not mandatory\n    } else {\n      if\
    \ (typeof n !== \"string\" || n.trim() === \"\") {\n        return new RangeConstraintViolation(\n\
    \          \"The name must be a non-empty string!\"\n        );\n      } else\
    \ {\n        return new NoConstraintViolation();\n      }\n    }\n  }\n  static\
    \ checkNameAsId(n) { .. }\n}\n```\n\nNotice that, since the name attribute is\
    \ the standard ID attribute of Publisher, we only check syntactic mandatory constraints\
    \ in checkName, and check the mandatory value and uniqueness constraints in checkNameAsId,\
    \ which invokes checkName:\n\n```js\nstatic checkNameAsId(n) {\n  var validationResult\
    \ = Publisher.checkName(n);\n  if ((validationResult instanceof NoConstraintViolation)\
    \ {\n    if (n === undefined) {\n      return new MandatoryValueConstraintViolation(\n\
    \        \"A publisher name is required!\");\n    } else if (Publisher.instances[n])\
    \ {\n      validationResult = new UniquenessConstraintViolation(\n        \"There\
    \ is already a publisher record with this name!\");\n    } else {\n      validationResult\
    \ = new NoConstraintViolation();\n    }\n  }\n}\n```\n\nIf we have to deal with\
    \ ID references (foreign keys) in other classes, we need to provide a further\
    \ check, called checkNameAsIdRef, for checking the referential integrity constraint:\n\
    \n```js\nstatic checkNameAsIdRef(n) {\n  var validationResult = Publisher.checkName(n);\n\
    \  if ((validationResult instanceof NoConstraintViolation) &&\n    n !== undefined)\
    \ {\n    if (!Publisher.instances[n]) {\n      validationResult = new ReferentialIntegrityConstraintViolation(\n\
    \        \"There is no publisher record with this name!\");\n    }\n  }\n  return\
    \ validationResult;\n}\n```\n\nThe condition !Publisher.instances[n] checks if\
    \ there is no publisher object with the given name n, and then creates a validationResult\
    \ object as an instance of the exception class ReferentialIntegrityConstraintViolation.\
    \ The Book.checkAsRef function is called by the Book.checkPublisher function:\n\
    \n```js\nclass Book {\n  ..\n  static checkPublisher(publisher_id) {\n    var\
    \ validationResult = null;\n    if (publisher_id === undefined || publisher_id\
    \ === \"\") {\n      validationResult = new NoConstraintViolation(); // optional\n\
    \    } else {\n      // invoke foreign key constraint check\n      validationResult\
    \ = Publisher.checkNameAsIdRef(publisher_id);\n    }\n    return validationResult;\n\
    \  }\n  \n}\n```\n\n## 2.5.4 Code the Property Setters\n\nIn the setters, the\
    \ corresponding check function is called and the property is only set, if the\
    \ check does not detect constraint violation. In the case of a reference property,\
    \ we allow invoking the setter with an object reference or an ID reference. The\
    \ resulting ambiguity is resolved by testing if the argument provided in the invocation\
    \ of the setter is an object or not. For instance, the publisher setter is coded\
    \ in the following way:\n\n```js\nclass Book {\n  ..\n  set publisher(p) {\n \
    \   if (!p) // unset publisher\n      delete this._publisher;\n    } else {\n\
    \      // p can be an ID reference or an object reference\n      publisher_id\
    \ = (typeof p===\"object\") ? p.name : p;\n      const validationResult = Book.checkPublisher(publisher_id);\n\
    \      if (validationResult instanceof NoConstraintViolation) {\n        // create\
    \ the new publisher reference\n        this._publisher = Publisher.instances[publisher_id];\n\
    \      } else {\n        throw validationResult;\n      }\n    }\n  }\n}\n```\n\
    \n## 2.5.5 Choose and Implement a Deletion\n\nFor any reference property, we have\
    \ to choose and implement one of the two deletion policies discussed in Section\
    \ 2.2. Assuming that books existentially depend on publishers, we choose the first\
    \ option. This is shown in the following code of the destroy method where the\
    \ property is cleared:\n\n```js\ndestroy = function (name) {\n  for (let key in\
    \ Book.instances) {\n    const book = Book.instances[key];\n    if (book.publisher\
    \ === name) {\n      delete book.publisher; // delete slot\n      console.log(\"\
    Book \" + key + \" updated.\");\n    }\n  }\n  delete Publisher.instances[name];\n\
    \  console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\nNote that the\
    \ deletion of publisher is performed in a sequential scan through all objects,\
    \ which may be inefficient when there are many of them.\n\n## 2.5.6 Serialization\
    \ and Object-Storage Mapping\n\nIn the case of a property, the serialization function\
    \ toString() has to show human-readable identifier of the referred object, like\
    \ this.publisher.name:\n\n```js\ntoString() {\n  var bookStr = `Book: ${this.isbn},\
    \ title: ${this.title}, year: ${this.year}`;\n  if (this.publisher) bookStr +=\
    \ `, publisher: ${this.publisher.name}`;\n  return bookStr;\n}\n```\n\nThe object-to-storage\
    \ conversion, from untyped record objects with ID references to typed objects\
    \ with object references, is performed by the toRecord() function:\n\n```js\n\
    toRecord() {\n  var rec = {};\n  for (let p of Object.keys(this)) {\n    // copy\
    \ only property with underscore prefix\n    if (p.charAt(0) === \"_\") {\n   \
    \   switch (p) {\n        case \"_publisher\":\n          // convert object reference\
    \ to ID reference\n          if (this._publisher) rec.publisher_id = this._publisher.name;\n\
    \          break;\n        default:\n          // remove underscore prefix\n \
    \         rec[p.substr(1)] = this[p];\n      }\n    }\n  }\n  return rec;\n}\n\
    ```\n\n## 2.6 Code the View and Controller\n\nThe user interface (UI) consists\
    \ of a start page index.html that allows navigating to data management pages,\
    \ for each object type (in our example, books.html and publishers.html). Each\
    \ of these data management pages contains 5 sections: a Manage section, Manage\
    \ books, with a menu for choosing a CRUD use case, and a section for each CRUD\
    \ use case, like Retrieve/list books, Create book, Update book and Delete book,\
    \ such that only one of them is displayed at any time (for instance, by setting\
    \ the CSS property display:none for all others).\n\n### 2.6.1 Initialize the App\n\
    \nFor initializing a data use case, the required data (for instance, all publisher\
    \ and book records) have to be loaded from persistent storage. This is performed\
    \ in a controller procedure as pl.c.books.manage.initialize in c/books.js with\
    \ the following code:\n\n```js\npl.c.books.manage = {\n  initialize: function\
    \ () {\n    Publisher.retrieveAll();\n    Book.retrieveAll();\n    pl.v.books.manage.setUserInterface();\n\
    \  }\n}\n```\n\nThe initialize method for managing book data first loads the publishers\
    \ table and the books table since the book data management UI needs to show their\
    \ data. Then the book data management menu is rendered by calling the setUpInterface\
    \ procedure.\n\n### 2.6.2 Showing Associated Objects in Retrieve/List All\n\n\
    In our example, we have only one reference property, Book::publisher, which is\
    \ functional and optional. For showing information about the optional publisher\
    \ of a book in the Retrieve/list all use case, the corresponding cell in the HTML\
    \ table is filled with the name of the publisher, if there is any:\n"
  mdcn: "\n\n## 28 使用原生 JS 实现单向函数关联\n\n```js\nif (publisher || publisher_id) {\n \
    \ this.publisher = publisher || publisher_id;\n}\n...\n}\n```\n\n注意，`Book` 构造函数既可以使用对象引用\
    \ `authors`，也可以使用 ID 引用 `authorIdRefs` 和 `publisher_id` 调用。这种方法使得 `Book` 构造函数的使用更加灵活且更加健壮。\n\
    \n## 2.5.3 编写属性检查\n\n确保 JS 类模型中指定的所有属性约束都已在它的检查函数中正确编写，正如第一卷第 8 节所解释的。记住，约束违反（或验证错误）类定义在\
    \ `lib/errorTypes.js` 文件中。\n例如，对于 `Publisher.checkName` 函数，我们得到以下代码：\n\n```js\n\
    class Publisher {\n  static checkName(n) {\n    if (n === undefined) {\n     \
    \ return new NoConstraintViolation(); // 非强制\n    } else {\n      if (typeof n\
    \ !== \"string\" || n.trim() === \"\") {\n        return new RangeConstraintViolation(\n\
    \          \"The name must be a non-empty string!\"\n        );\n      } else\
    \ {\n        return new NoConstraintViolation();\n      }\n    }\n  }\n  static\
    \ checkNameAsId(n) { .. }\n}\n```\n\n注意，由于名称属性是 `Publisher` 的标准 ID 属性，我们只在 `checkName`\
    \ 中检查语法强制约束，并在 `checkNameAsId` 中检查强制值和唯一性约束，后者会调用 `checkName`：\n\n```js\nstatic\
    \ checkNameAsId(n) {\n  var validationResult = Publisher.checkName(n);\n  if ((validationResult\
    \ instanceof NoConstraintViolation) {\n    if (n === undefined) {\n      return\
    \ new MandatoryValueConstraintViolation(\n        \"A publisher name is required!\"\
    );\n    } else if (Publisher.instances[n]) {\n      validationResult = new UniquenessConstraintViolation(\n\
    \        \"There is already a publisher record with this name!\");\n    } else\
    \ {\n      validationResult = new NoConstraintViolation();\n    }\n  }\n}\n```\n\
    \n如果我们需要在其他类中处理 ID 引用（外键），我们需要提供进一步的检查，称为 `checkNameAsIdRef`，用于检查引用完整性约束：\n\n\
    ```js\nstatic checkNameAsIdRef(n) {\n  var validationResult = Publisher.checkName(n);\n\
    \  if ((validationResult instanceof NoConstraintViolation) &&\n    n !== undefined)\
    \ {\n    if (!Publisher.instances[n]) {\n      validationResult = new ReferentialIntegrityConstraintViolation(\n\
    \        \"There is no publisher record with this name!\");\n    }\n  }\n  return\
    \ validationResult;\n}\n```\n\n条件 `!Publisher.instances[n]` 检查是否存在具有给定名称 `n` 的出版者对象，然后创建一个异常类\
    \ `ReferentialIntegrityConstraintViolation` 的实例作为 `validationResult` 对象。`Book.checkAsRef`\
    \ 函数由 `Book.checkPublisher` 函数调用：\n\n```js\nclass Book {\n  ..\n  static checkPublisher(publisher_id)\
    \ {\n    var validationResult = null;\n    if (publisher_id === undefined || publisher_id\
    \ === \"\") {\n      validationResult = new NoConstraintViolation(); // 可选\n \
    \   } else {\n      // 调用外键约束检查\n      validationResult = Publisher.checkNameAsIdRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  \n}\n```\n\n## 2.5.4 编写属性设置器 (Setters)\n\
    \n在 setter 中，会调用相应的检查函数，并且当检查未检测到约束违反时，才会设置属性。对于引用属性，我们允许使用对象引用或 ID 引用调用 setter。产生的歧义通过测试在\
    \ setter 调用中提供的参数是否为对象来解决。例如，`publisher` 设置器的代码编码方式如下：\n\n```js\nclass Book {\n\
    \  ..\n  set publisher(p) {\n    if (!p) // 取消出版者\n      delete this._publisher;\n\
    \    } else {\n      // p 可以是 ID 引用或对象引用\n      publisher_id = (typeof p===\"\
    object\") ? p.name : p;\n      const validationResult = Book.checkPublisher(publisher_id);\n\
    \      if (validationResult instanceof NoConstraintViolation) {\n        // 创建新的出版者引用\n\
    \        this._publisher = Publisher.instances[publisher_id];\n      } else {\n\
    \        throw validationResult;\n      }\n    }\n  }\n}\n```\n\n## 2.5.5 选择并实现删除策略\n\
    \n对于任何引用属性，我们必须在第 2.2 节讨论的两种删除策略中选择并实现一种。假设书籍在存在上依赖于出版者，我们选择第一个选项。在下面的 `destroy`\
    \ 方法代码中，该属性被清除：\n\n```js\ndestroy = function (name) {\n  for (let key in Book.instances)\
    \ {\n    const book = Book.instances[key];\n    if (book.publisher === name) {\n\
    \      delete book.publisher; // 删除槽位\n      console.log(\"Book \" + key + \"\
    \ updated.\");\n    }\n  }\n  delete Publisher.instances[name];\n  console.log(\"\
    Publisher \" + name + \" deleted.\");\n};\n```\n\n注意，出版者的删除是通过对所有对象的顺序扫描完成，当对象很多时，这可能效率低下。\n\
    \n## 2.5.6 序列化与对象存储映射\n\n对于属性，序列化函数 `toString()` 必须显示被引用对象的可读标识符，例如 `this.publisher.name`：\n\
    \n```js\ntoString() {\n  var bookStr = `Book: ${this.isbn}, title: ${this.title},\
    \ year: ${this.year}`;\n  if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n\
    \  return bookStr;\n}\n```\n\n从带有 ID 引用的无类型记录对象到带有对象引用的类型对象的对象存储转换，通过 `toRecord()`\
    \ 函数完成：\n\n```js\ntoRecord() {\n  var rec = {};\n  for (let p of Object.keys(this))\
    \ {\n    // 只拷贝带下划线前头的属性\n    if (p.charAt(0) === \"_\") {\n      switch (p) {\n\
