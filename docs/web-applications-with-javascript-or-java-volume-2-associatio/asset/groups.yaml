- md: "\n## 4.5 The View and Controller Layers 61\n\n### 4.5.1 Initialize the App\n\
    \nSince the code runs in a Tomcat container, the initialization is made internally\
    \ by the container.\n\n### 4.5.2 Show Information About Associated Objects in\
    \ Retrieve/List All\n\nIn our example we have only one reference property, Book::publisher,\
    \ which is functional. For showing information about the optional publisher of\
    \ a book in the retrievelist all books we use, the corresponding column in the\
    \ HTML table is filled with the names of publishers, there is any:\n\n```xml\n\
    <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h:dataTable value=\"#{bookctrl.books}\" var=\"b\">\n  ..\n  <h:column>\n\
    \    <f:facet name=\"header\">Publisher</f:facet>\n    #{b.publisher.name}\n \
    \ </h:column>\n</h:dataTable>\n  <h:button value=\"Main menu\" outcome=\"index\"\
    \ />\n</ui:define>\n</ui:composition>\n```\n\nNotice the cascade call used in\
    \ the #{b.publisher.name} JSF expression, accessing the property name of the publisher\
    \ which is a property of the book instance b.\n\n### 4.5.3 Allow Selecting Associated\
    \ Objects in Create and Update\n\nIn this section, we discuss how to create and\
    \ update an object which has reference properties, such as a Book object with\
    \ the reference property publisher.\n\n### 4.5.3.1 Create the Object-to-String\
    \ Converter\n\nHTML requires string or number values to populate forms. In our\
    \ case, the property publisher of the Book class is an object reference. JSF allows\
    \ converting objects to strings and vice versa by means of converters, which are\
    \ classes annotated with @FacesConverter implementing the javax.faces.convert\
    \ interface:\n\n```java\n@FacesConverter(value=\"pl.m.converter.PublisherConverter\"\
    )\npublic class PublisherConverter implements Converter {\n    @Override\n   \
    \ public Object getObject(FacesContext context, UIComponent component, String\
    \ value) {\n        PublisherController ac = FacesContext\n            .getCurrentInstance()\n\
    \            .getApplication()\n            .evaluateExpressionGet(context, \"\
    #{publisherCtrl}\",\n                PublisherController.class);\n        EntityManager\
    \ em = ac.getEntityManager();\n        if (value == null) return null;\n     \
    \   else return em.find(Publisher.class, value);\n    }\n    @Override\n    public\
    \ String getAsString(FacesContext context,\n        UIComponent component, Object\
    \ value) {\n        if (value == null) return null;\n        else if (value instanceof\
    \ Publisher) {\n            return ((Publisher) value).getName();\n        }\n\
    \        else return null;\n    }\n}\n```\n\nA converter defines two methods:\
    \ getObject and getString, which are responsible for the two conversions. For\
    \ being able to retrieve an object from a database we need an EntityManager, which\
    \ can be obtained from a controller (e.g., the managed bean publisherCtrl). The\
    \ controller can be obtained via the FacesContext singleton.\n\n```java\nPublisherController\
    \ ac = FacesContext.getCurrentInstance()\n    .getApplication()\n    .evaluateExpressionGet(\
    \ context, \"#{publisherCtrl}\",\n        PublisherController.class);\n```\n\n\
    ## 4.5 The View and Controller Layers 63\n\nIn addition, we need to add a getEntityManager\
    \ method in the controller class as follows:\n\n```java\n@Bean(name=\"publisherCtrl\"\
    ) @SessionScoped\npublic class PublisherContext {\n    @PersistenceContext(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource()\n    UserTransaction\
    \ ut;\n\n    public EntityManager getEntityManager() {\n        return this.em;\n\
    \    }\n}\n```\n\nJSF needs to compare two publisher instances, when the publisher\
    \ list has to auto-select the current publisher, in the update book use case.\
    \ For this reason, the Publisher model class needs to implement the equals method.\
    \ In our case, two publishers are \"one and the same\", if the values of their\
    \ name property are equal:\n\n```java\n@Override\npublic boolean equals(Object\
    \ obj) {\n    if (obj instanceof Publisher) {\n        Publisher publisher = (Publisher)\
    \ obj;\n        return this.name.equals(publisher.name);\n    } else return false;\n\
    }\n```\n\n### 4.5.3.2 Write the View Code\n\nTo allow selection of objects which\
    \ have to be associated with the currently edited object from the create and update\
    \ use cases, an HTML selection list (a select element) is populated with the instances\
    \ of the associated object type with the help of a h:selectOneMenu. The create.xhtml\
    \ file in the folder WebContent/views/books/ is updated as follows:\n\n```xml\n\
    <ui:composition template=\"WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\"\
    >\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"publisher\" value=\"Publisher:\"\
    \ />\n<h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\">\n<h:selectItem\
    \ value=\"\"\n```\n\nThe converter is specified by the f:converter element and\
    \ its associated @ConverterId attribute. The value of this attribute must be the\
    \ same as the one specified by the value attribute of the annotation @FacesConverter\
    \ used when the converter class is defined, e.g.,\n\n```java\n@FacesConverter(\
    \ value = \"pl.m.converter.PublisherConverter\")\n```\n\nIn general, the converter's\
    \ local name can be used (e.g., PublisherConverter), or the fully qualified name,\
    \ if there are conflicts (e.g., pl.m.converter.PublisherConverter). We recommend\
    \ using the fully qualified name in all cases. The #{publisherCtrl.publishers}\
    \ expression results in calling the getPublishers method of Publisher class:\n\
    \n```java\npublic List<Publisher> getPublishers() {\n    return em.retrieveAll();\n\
    }\n```\n\n## 4.5 The View and Controller Layers 65\n\nThe creation of the book\
    \ is obtained by using the h:commandButton. It results in calling the create method\
    \ of Controller class:\n\n```java\npublic String create(String isbn, String title,\
    \ Integer year, Publisher publisher) {\n  try {\n    FacesContext facesContext\
    \ = FacesContext.getCurrentInstance();\n    facesContext.getExternalContext().remove(\"\
    book\");\n    ut.commit();\n  } catch (Exception e) {\n    ut.rollback();\n  \
    \  e.printStackTrace();\n  } catch (Exception e) {\n    e.printStackTrace();\n\
    \  }\n  return \"create\";\n}\n```\n\nThe code for update book case is very similar,\
    \ the only important difference is the addition of the select element (i.e., using\
    \ h:selectMenu) for allowing to select the book:\n\n```xml\n<ui:composition template=\"\
    WEB-INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n<h:form id=\"updateBookForm\"\
    \ styleClass=\"pure-form pure-form-aligned\">\n<h:panelGrid columns=\"3\">\n<h:outputLabel\
    \ for=\"selectBook\" value=\"Select book:\" />\n<h:selectOneMenu id=\"selectBook\"\
    \ value=\"#{book.isbn}\">\n  <f:selectItem value=\"\" itemLabel=\"-\" />\n  <h:selectItems\
    \ value=\"#{bookCtrl.books}\" var=\"b\"\n    itemValue=\"#{b.isbn}\" itemLabel=\"\
    #{b.title}\" />\n  <f:ajax listener=\"#{bookCtrl.refreshObject(book)}\"\n    render=\"\
    isbn\"/>\n</f:selectOneMenu>\n</h:panelGrid>\n<h:commandButton value=\"Update\"\
    \ action=\"#{bookCtrl.update(book.isbn, book.title, book.year, book.publisher)}\"\
    \ />\n</h:form>\n<h:message for=\"selectBook\"/>\n</ui:define>\n</ui:composition>\n\
    ```\n\n## 5 Unidirectional Non-Functional Associations with Java EE 82\n\nA unidirectional\
    \ non-functional association is either one-to-many or many-to-many. In both cases\
    \ such an association is represented with the help of a multi-valued reference\
    \ property.\n\nIn this chapter, we show\n\n- 1. how to derive a Java Entity class\
    \ model from an OO class model with multi-valued reference properties representing\
    \ unidirectional non-functional associations,\n- 2. how to code the Java Entity\
    \ class model in the form of entity classes (implementing model classes),\n- 3.\
    \ how to write the view and controller code based on the model.\n\n### 5.1 Implementing\
    \ Multi-Valued Reference Properties in Java\n\nA multi-valued reference property,\
    \ as Book::authors, allows storing a collection of internal references to objects\
    \ of some type, such as references to Author objects. When creating a new type\
    \ of Book, the constructor function needs to have a parameter for providing a\
    \ suitable value for this property. In general, the value can be a set of internal\
    \ object references or of ID references. With JPA, we use object references:\n\
    \n```java\n@Entity(name=\"books\")\n@ManagedBean(name=\"book\")\n@ViewScoped\n\
    public class Book {\n\n    private Set<Author> authors;\n\n    public Book() {\
    \ // required by JPA @Entity annotation!\n    public Book(String isbn, String\
    \ title, Integer year, Publisher publisher, Set<Author> authors) { . . }\n\n \
    \   public Set<Author> getAuthors() { return this.authors; }\n    public void\
    \ setAuthors(Set<Author> authors) { this.authors = authors; }\n}\n```\n"
  mdcn: "\n\n## 4.5 视图与控制器层 61\n\n### 4.5.1 初始化应用\n\n由于代码在 Tomcat 容器中运行，因此初始化是由容器内部完成的。\n\
    \n### 4.5.2 在检索/列出所有中显示关联对象的信息\n\n在我们的示例中，我们有一个引用属性 `Book::publisher`，它是功能性的。为了在列出所有书籍的检索结果列表中显示书籍可选的出版者信息，我们在\
    \ HTML 表格的相应列中填充了出版者的名称，如下：\n\n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:dataTable value=\"#{bookctrl.books}\" var=\"\
    b\">\n  ..\n  <h:column>\n    <f:facet name=\"header\">Publisher</f:facet>\n \
    \   #{b.publisher.name}\n  </h:column>\n</h:dataTable>\n  <h:button value=\"Main\
    \ menu\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\n注意在 `${b.publisher.name}`\
    \ JSF 表达式中使用的级联调用，它访问了出版者的属性名，而出版者是书籍实例 `b` 的一个属性。\n\n### 4.5.3 在创建和更新中允许选择关联对象\n\
    \n在本节中，我们将讨论如何创建和更新具有引用属性的对象，例如带有引用属性 `publisher` 的 `Book` 对象。\n\n### 4.5.3.1\
    \ 创建对象到字符串的转换器\n\nHTML 需要字符串或数字值来填充表单。在我们的情况下，`Book` 类的 `publisher` 属性是一个对象引用。JSF\
    \ 允许通过转换器（Converters）将对象转换为字符串反反亦然，转换器是带有 `@FacesConverter` 注解并实现 `javax.faces.convert`\
    \ 接口的类：\n\n```java\n@FacesConverter(value=\"pl.m.converter.PublisherConverter\"\
    )\npublic class PublisherConverter implements Converter {\n    @Override\n   \
    \ public Object getObject(FacesContext context, UIComponent component, String\
    \ value) {\n        PublisherController ac = FacesContext\n            .getCurrentInstance()\n\
    \            .getApplication()\n            .evaluateExpressionGet(context, \"\
    #{publisherCtrl}\",\n                PublisherController.class);\n        EntityManager\
    \ em = ac.getEntityManager();\n        if (value == null) return null;\n     \
    \   else return em.find(Publisher.class, value);\n    }\n    @Override\n    public\
    \ String getAsString(FacesContext context,\n        UIComponent component, Object\
    \ value) {\n        if (value == null) return null;\n        else if (value instanceof\
    \ Publisher) {\n            return ((Publisher) value).getName();\n        }\n\
    \        else return null;\n    }\n}\n```\n\n转换器定义了两个方法：`getObject` 和 `getString`，它们负责两种转换。为了能够从数据库中检索对象，我们需要一个\
    \ `EntityManager`，它可以从控制器获取（例如，托管的 Bean `publisherCtrl`）。控制器可以通过 `FacesContext`\
    \ 单例获取。\n\n```java\nPublisherController ac = FacesContext.getCurrentInstance()\n\
    \    .getApplication()\n    .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n        PublisherController.class);\n```\n\n## 4.5 视图与控制器层 63\n\n此外，我们需要在控制器类中添加一个\
    \ `getEntityManager` 方法，如下所示：\n\n```java\n@Bean(name=\"publisherCtrl\") @SessionScoped\n\
    public class PublisherContext {\n    @PersistenceContext(unitName=\"UnidirAssocApp\"\
    )\n    private EntityManager em;\n    @Resource()\n    UserTransaction ut;\n\n\
    \    public EntityManager getEntityManager() {\n        return this.em;\n    }\n\
    }\n```\n\n在更新书籍的用例中，当出版者列表需要自动选择当前出版者时，JSF 需要比较两个出版者实例。因此，`Publisher` 模型类需要实现\
    \ `equals` 方法。在我们的情况下，如果两个出版者的 `name` 属性值相等，则它们是“同一个”：\n\n```java\n@Override\n\
    public boolean equals(Object obj) {\n    if (obj instanceof Publisher) {\n   \
    \     Publisher publisher = (Publisher) obj;\n        return this.name.equals(publisher.name);\n\
    \    } else return false;\n}\n```\n\n### 4.5.3.2 编写视图代码\n\n为了在创建和更新用例中允许选择与当前编辑对象关联的对象，通过\
    \ `h:selectOneMenu` 在一个 HTML 选择列表（`select` 元素）中填充关联对象类型的实例。`WebContent/views/books/`\
    \ 文件夹下的 `create.xhtml` 文件更新如下：\n\n```xml\n<ui:composition template=\"WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"publisher\"\
    \ value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n<h:selectItem value=\"\"\n```\n\n转换器由 `f:converter` 元素及其关联的 `@ConverterId`\
    \ 属性指定。该属性的值必须与定义转换器类时使用的 `@FacesConverter` 注解的 `value` 属性指定的**相同，例如：\n\n```java\n\
    @FacesConverter( value = \"pl.m.converter.PublisherConverter\")\n```\n\n通常情况下，可以使用转换器的本地名称（例如\
    \ `PublisherConverter`），或者存在冲突时使用全限定名（例如 `pl.m.converter.PublisherConverter`）。我们建议在所有情况下都使用全限定名。`${publisherCtrl.publishers}`\
    \ 表达式的结果是调用 `Publisher` 类的 `getPublishers` 方法：\n\n```java\npublic List<Publisher>\
    \ getPublishers() {\n    return em.retrieveAll();\n}\n```\n\n## 4.5 视图与控制器层 65\n\
    \n书籍的创建通过使用 `h:commandButton` 实现。它的结果是调用控制器类的 `create` 方法：\n\n```java\npublic\
    \ String create(String isbn, String title, Integer year, Publisher publisher)\
    \ {\n  try {\n    FacesContext facesContext = FacesContext.getCurrentInstance();\n\
    \    facesContext.getExternalContext().remove(\"book\");\n    ut.commit();\n \
    \ } catch (Exception e) {\n    ut.rollback();\n    e.printStackTrace();\n  } catch\
    \ (Exception e) {\n    e.printStackTrace();\n  }\n  return \"create\";\n}\n```\n\
    \n更新书籍的代码非常相似，唯一的区别是增加了选择元素（使用 `h:selectOneMenu`）以便选择书籍：\n\n```xml\n<ui:composition\
    \ template=\"WEB-INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n<h:form\
    \ id=\"updateBookForm\" styleClass=\"pure-form pure-form-aligned\">\n<h:panelGrid\
    \ columns=\"3\">\n<h:outputLabel for=\"selectBook\" value=\"Select book:\" />\n\
    <h:selectOneMenu id=\"selectBook\" value=\"#{book.isbn}\">\n  <f:selectItem value=\"\
    \" itemLabel=\"-\" />\n  <h:selectItems value=\"#{bookCtrl.books}\" var=\"b\"\n\
    \    itemValue=\"#{b.isbn}\" itemLabel=\"#{b.title}\" />\n  <f:ajax listener=\"\
    #{bookCtrl.refreshObject(book)}\"\n    render=\"isbn\"/>\n</h:selectOneMenu>\n\
    </h:panelGrid>\n<h:commandButton value=\"Update\" action=\"#{bookCtrl.update(book.isbn,\
    \ book.title, book.year, book.publisher)}\" />\n</h:form>\n<h:message for=\"selectBook\"\
    />\n</ui:define>\n</ui:composition>\n```\n\n## 5 使用 Java EE 的单向功能关联 82\n\n单向功能关联是一一对多或多多。两种情况下，这种关联都通过多值引用属性来表示。在本章中，我们将展示：\n\
    \n- 1. 如何从具有表示单向功能关联的多值引用属性的 OO 类模型推导出 Java 实体模型；\n- 2. 如何以实体类的形式编写 Java 实体模型（实现模型类）；\n\
    - 3. 基于模型编写视图和控制器代码。\n\n### 5.1 在 Java 中实现多值引用属性\n\n多值引用属性如 `Book::authors` 允许存储某些类型的内部引用集合，例如对\
    \ `Author` 对象的引用。创建新的 `Book` 类型时，构造函数需要一个参数来为该属性提供合适的值。通常，该值可以是内部对象引用或 ID 引用。使用\
    \ JPA 时我们使用对象引用：\n\n```java\n@Entity(name=\"books\")\n@ManagedBean(name=\"book\"\
    )\n@ViewScoped\npublic class Book {\n\n    private Set<Author> authors;\n\n  \
    \  public Book() { // JPA @Entity 注解需要的！\n    public Book(String isbn, String\
    \ title, Integer year, Publisher publisher, Set<Author> authors) { . . }\n\n \
    \   public Set<Author> getAuthors() { return this.authors; }\n    public void\
    \ setAuthors(Set<Author> authors) { this.authors = authors; }\n}\n```\n\n"
