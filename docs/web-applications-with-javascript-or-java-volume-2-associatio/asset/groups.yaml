    \n美国国会控制号：2020948051\n\n德国国家图书馆提供的书目信息\n德国国家图书馆将本书列入德国国家书目：dnb.de。\n© 2021 Walter\
    \ de Gruyter GmbH, 柏林/波士顿\n封面图片：monsitj\n排版：Integra Software Services Pvt. Ltd.\n\
    装订：CPI GmbH, Leck\n\nwww.degruyter.com\n\n致读者\n\n# 前言\n\n这套两卷本展示了如何基于模型的方法设计并实现\
    \ Web 应用，这两个最相关的平台是 JavaScript 和 Java。通过 UML 类图设计并实现：\n1. JavaScript 前端应用，使用浏览器提供的本地存储技术；\n\
    2. Java 后端应用，使用 Server Faces (JSF) 作为用户界面技术，使用 Java Persistence API (JPA) 进行对象映射，以及\
    \ MySQL/MariaDB 数据库系统。\n\n本书的重点是关于以下基础管理的通用概念和技术：\n- 完整性约束和数据验证，\n- 枚举和属性，\n-\
    \ 类型之间的双向关联，\n- 类层次结构中的子类型继承。\n\n前两个问题在本卷中讨论，后两个在第二卷中讨论。我们假设读者熟悉 HTML 和至少一种面向对象的语言，如\
    \ C++、Java 或 C#。此外，我们假设读者对 JavaScript 有一定了解，并兴趣学习。本书可用于计算机科学或相关专业的 Web 开发课程；JavaScript\
    \ 开发者学习 Java；Java 开发者学习 JavaScript；以及 JavaScript 和 Java（以及 C#）开发者学习 JavaScript\
    \ 或 Java 进行面向对象的编程。书中提供了从我们的服务器下载的六示例应用的完整源代码。\n\n#目录\n\n前言 — VII\n图列表 — XIII\n\
