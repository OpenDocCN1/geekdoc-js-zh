    ## 1.9 多值引用属性的集合类型 15


    ## 1.8 在用户界面中渲染引用属性


    CRUD 数据管理用户界面（UI）中用于数据输入和输出的组件通常对应应用程序模型类中定义的属性。我们必须区分对应（各种类型）属性的（各种种类）输入字段，以及对应枚举属性或引用属性的选择小部件（如选择列表）。在
    UI 中使用选择控件而非输入字段来表示引用属性，可以防止用户输入无效的 ID 引用，从而维护引用完整性。


    通常情况下，单值引用属性可以渲染为 UI 中的单选列表，无论对象如何填充引用属性的范围，我们都从中选出一个特定的选项。如果引用属性范围的基数足够小（例如不大于
    7），那么我们可以使用单选按钮组来代替选择列表。


    多值引用属性可以渲染为 UI 中的多选列表。然而，一旦有许多（例如超过 20 个）不同的选项可供选择，HTML 对应的多选控件就变得不再真正好用，因为读者的选择在视觉上太分散了。在只有少数（例如少于
    7 个）选项的特殊情况下，我们也可以使用复选框组代替列表。但对于 UI 中包含引用属性范围类中所有关联对象的通用情况，我们需要开发一种特殊的 UI 小部件，允许向已选对象列表添加（并删除）对象。


    这种多选小部件由以下部分组成：


    - 1. 一个包含（关联）对象的 `html` 列表元素，其中每个列表项包含一个用于删除对象的按钮；

    - 2. 一个单选控件，结合按钮，允许从多值引用属性的范围中添加新对象。


    ### 1.9 多值属性的集合类型


    默认情况下，非功能关联将目标类的一组实例关联到源类的任何实例，这意味着多值引用属性的集合值是集合（sets）。但在某些情况下，非功能关联的端是有序的，因此引用属性的集合值表现为有序集合。


    在以下示例中，关联端 `publishedBooks` 是无序的，而关联端 `authors` 是有序的，因为书籍作者的顺序是有意义的。注意在类图中，有序的关联端被标记为
    `{ordered}`。


    ## 16 1 引用属性单向关联


    | 出版社 | 已出版书籍 | 作者 (有序) | 作者 |

    | --- | --- | --- | --- |

    | name : String {id} | isbn : String {id} | personId : Integer {id} | |

    | address : String | title : String | | name : String |

    | | year : Integer | | |


    有序的关联不应表示任何基于目标类属性的排序。在我们的示例中，这意味着书籍作者的顺序例如不应该代表他们的字母顺序，而应该代表某种无法通过 `Author` 属性获取的信息。事实上的确实如此，因为它代表了某种重要性，这种重要性无法通过任何属性来表达。


    注意信息设计模型中的有序关联端只是一种便利功能，因为有序关联始终可以通过向关联的目标类添加一个或多个属性来转换为无序关联，使得这些属性的值可以用于排序。有序关联允许使用更简洁的信息模型和更高效的实现，而无需借助辅助属性来显式地进行排序。


    多值引用属性的两种重要集合类型是集合（sets），而使用包（bags，多集合）和序列（有序多集合）作为多值引用属性的集合类型时，该类型为包（或序列），这可以在类图中通过关联端或属性修饰符的
    `{nonunique}`（或 `ordered, nonunique`）注解来表示。


    注意，使用列表（如 JS 数组或 Java 接口类型 `List`）作为多值引用属性的范围是非常常见的，无论是有序还是无序属性。


