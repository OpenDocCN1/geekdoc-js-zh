    关联消除程序的起点是一个包含各种单向关联的信息设计模型，如图 1.6 所示的模型。如果模型仍然包含非方向性关联，我们需要通过对所有所有权做出决策来将其转换为方向性关联。连接源与目标类的单向关联将被替换源类中对应的引用属性，该属性具有：


