  - "[PAGE 88]\n\nviolation exception is raised, and the author cannot be deleted.\
    \ We have two possibilities for dealing with this situation:\n\n+   1. delete\
    \ all books (co-)authored by the deleted author;\n2. drop from all books (co-)authored\
    \ by the deleted author the reference to the deleted author.\n\nWe go for the\
    \ second option. This is shown in the following code of the Author.delete method:\n\
    \n```\npublic static void delete(EntityManager em, UserTransaction ut,\nInteger\
    \ personId) throws Exception {\nut.begin();\nAuthor author = em.find(Author.class,\
    \ personId);\n// Find all books of this author\nQuery query = em.createQuery(\"\
    SELECT DISTINCT b FROM b \" +\n\"INNER JOIN b a WHERE a.personId = :personId\"\
    );\nquery.setParameter(\"personId\", personId);\nList<Book> books = query.getResultList();\n\
    // Remove the author reference from the books' authors list\nfor (Book b : books)\
    \ {\n b.getAuthors().remove(author);\n}\n// Delete the author record (table row)\n\
    em.remove(author);\nut.commit();\n}\n```\n\nEssentially, the delete operation\
    \ consists of three steps:\n\n+   1. Create a JPQL query which selects all books\
    \ of this author (since this is a unidirectional association from books to authors,\
    \ the books of an author are not accessible from an author).\n2. For every found\
    \ book referencing this author, we have to remove the author reference from its\
    \ authors list.\n3. Finally, delete the author record.\n\n# 5.4.4 Serialization\
    \ and De-Serialization\n\nIn Java EE, the serialization from objects to corresponding\
    \ database records as well as the de-serialization from database records to objects\
    \ are performed automatically by the Java EE execution environment based on JPA\
    \ annotations and converter classes for custom conversions."
- md: "\n## 5.5 Write the User Interface Code\n\n### 5.5.1 Show Information About\
    \ Associated Objects in Retrieve/List All\n\nFor showing information about the\
    \ authors of a book in the retrieve/list all use case, the corresponding cell\
    \ in the HTML table has to be filled with a list of the names of all authors.\
    \ For this, we implement a method in the Book class which returns the serialized\
    \ list of author names (the form, authorName_1, authorName_2, ..., authorName_n);\n\
    \n```java\npublic String getAuthorNames() {\n  String result = \"\"\n  int i =\
    \ 0, n = 0;\n  if ( this.authors!= null) {\n    n = this.authors.size();\n   \
    \ for ( Author author : this.authors) {\n      result += author.getName();\n \
    \     if (i< n-1) {\n        result += \",\";\n      }\n      i++;\n    }\n  }\n\
    \  return result;\n}\n```\n\nIn the file retrieveAndList.xhtml in the folder WebContent/views/books/,\
    \ this method is invoked in the JSF expression of the \"Authors\" column:\n\n\
    ```xml\n<ui:composition template=\"WEB-INF/templates/page.xhtml\">\n<ui:define\
