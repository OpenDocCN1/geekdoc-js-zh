    \n### 10.1.2 组合 (Composition)\n\n关于部分-整体关联中聚合和组合概念的区别，竟然存在如此多的困惑，真是令人惊讶。主要问题在于一种广泛的误解（即使在专家软件开发者和\
    \ UML 作者之间也是如此），即认为组合的概念意味着整体与其部分之间存在生命周期依赖关系，导致部分离开整体就无法存在。但这种观点忽略了一个事实：也存在不可共享部分的部分-整体关联，在这种情况下，部分可以被分离并在整体销毁后幸存。\n\
    \n在规范文档中，“组合”一词的定义一直暗示了不可共享的部分，但并不清楚什么是“组合”的定义性特征，哪些仅仅是可选特征。即使在 UML 2.5 版本（截至\
