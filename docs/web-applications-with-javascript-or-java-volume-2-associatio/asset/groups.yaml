- md: "\n## 13.3 Case Study 2: Implementing a Class Hierarchy\n\nWhenever a class\
    \ hierarchy is more complex, we cannot simply eliminate it, but have to implement\
    \ it (1) in the app's model code, (2) in the underlying database and (3) in its\
    \ user interface.\n\nThe starting point for our case study is the design model\
    \ shown in Figure 12.8 above. In the following sections, we derive a JS class\
    \ model and a JS entity model from the design model. The entity table model is\
    \ used as a design for the object-to-storage mapping that we need for storing\
    \ the objects of our app with the browsers; Local storage technology.\n\n### 13.3.1\
    \ Make a JS Class Model\n\nWe design the model classes of our example app with\
    \ the help of a JS class model that we derive from the design model by essentially\
    \ leaving the generalization rows as we are and just adding get/set methods and\
    \ static check functions to each class. However, in the case of our example, it\
    \ is natural to apply the Class Hierarchy Merge design pattern (discussed in Section\
    \ 12.6) to the single-subclass segmentation of Employee for simplifying the class\
    \ model by eliminating the Manager subclass. This leads to the model shown in\
    \ Figure 13.2. Notice that a Person may be an Employee or an Author or both.\n\
    \n| Person |\n| «get/set» personid: Integer (id) |\n| «get/set» name: String |\n\
    | checkPerson(in id string) : ConstraintViolation |\n| checkPersonAsid(in id :\
    \ string, in type) : ConstraintViolation |\n| checkName(in n : string) : ConstraintViolation\
    \ |\n\n| Author |\n| «get/set» biography : string |\n| checkBiography(in b : string)\
    \ : ConstraintViolation |\n\n| Employee | enumeration |\n| «get/set» empno[1]\
    \ : number (unique) | EmployeeCategoryEL |\n| «get/set» category[0.1] : EmployeeCategoryEL\
    \ | MANAGER |\n| «get/set» department(in n : string) | |\n| checkEmpno(in n :\
    \ number) : ConstraintViolation |\n| checkCategory(in c : number) : ConstraintViolation\
    \ |\n| checkDepartment(in d : string) : ConstraintViolation |\n\nFigure 13.2:\
    \ The JS class model of the Person class hierarchy.\n\n### 13.3.2 Make a JS Entity\
    \ Model\n\nSince we use the browsers' Local Storage as the persistent storage\
    \ for our example app, we have to deal with simple key-value storage. For each\
    \ design model class with singular (capitalized) name, we use its pluralized lowercase\
    \ name as the corresponding table and as a key that its associated value is obtained\
    \ by serializing the object collection with the help of JSON.stringify. We design\
    \ a set of suitable JS entity tables in the form of JS entity model that we derive\
    \ from the design model. We have to make certain choices how to organize our data\
    \ and how to derive a corresponding entity model. The first choice concerns using\
    \ Single Table Inheritance (STI), Table per Class Inheritance (TCI) or Joined\
    \ Tables Inheritance (JTI) approach which are introduced in Section 12.7. In the\
    \ STI approach, segmentation (or entire hierarchy) is represented with a single\
    \ table containing columns for all attributes of classes involved, which are shown\
    \ in the example model of Figure 13.3.\n\n| «entity table» | category |\n|---|---|\n\
    | personid[1]: number (pkey) | 1 = Author |\n| name[1]: string | 2 = Employee\
    \ |\n| empno[0]: number (unique) | 3 = Manager |\n| biography[0]: string | |\n\
    | department[0]: string | |\n\nFigure 13.3: An STI model of the Person class hierarchy.\n\
    \nSince the given segmentation is not disjoint, a multi-valued enumeration attribute\
    \ categories is used for representing the information to which subclass belongs.\
    \ Using the STI approach is feasible for the given example since the role hierarchy\
    \ does not have many levels and the subclasses do not add many attributes. But\
    \ in a more realistic example, we would have more attributes in the subclasses\
    \ of the role hierarchy. The STI approach is not really an option for representing\
    \ a multi-level role hierarchy. However we may choose it for representing the\
    \ single-segment class hierarchy Manager-is-superclass-of-Employee. For simplicity,\
    \ and because the browsers' Local Storage does not support foreign keys as required\
    \ by JTI, we choose the TCI approach where we obtain a table for each class of\
    \ the Person segmentation without foreign keys. Our choices result in the model\
    \ shown in Figure 13.4, which has been derived from the design shown in Figure\
    \ 12.8 by:\n\n1. Merging the Manager subclass into its superclass Employee according\
    \ to the Class Hierarchy Merge design pattern described in Section 12.6.\n2. Replacing\
    \ the standard ID modifier {id} of the personId attribute of Person, Author and\
    \ Employee with {pkey} for indicating that the attribute is a primary key.\n3.\
    \ Replacing singular (capitalized) class names (Person, Author and Employee) in\
    \ pluralized lowercase table names (people, authors and employees).\n4. Adding\
    \ the {JS entity table>} stereotype to all class rectangles (people, authors and\
    \ employees).\n5. Replacing platform-independent datatype names with JS datatype\
    \ names.\n6. Dropping all generalization/inheritance arrows and adding all attributes\
    \ of supertables (personId and name) to their subtables (authors and employees).\n\
    \n| JS entity table> | people |\n|---|---|\n| personid : number (pkey) |\n| name\
    \ : string |\n\n| JS entity table> | authors |\n|---|---|\n| personid : number\
    \ (pkey) |\n| name : string |\n| biography : string |\n\n| JS entity table> |\
    \ employees |\n|---|---|\n| personid[1]: number (pkey) |\n| name[1]: string |\n\
    | empNo[1]: number (unique) |\n| category[0..1]: number |\n| department[0..1]:\
    \ string |\n\n| category: | 1 = Manager |\n\nFigure 13.4: A TCI of the Person\
    \ class hierarchy.\n\nIn the case of the JTI approach, in addition to the steps\
    \ 1–5 above, we would:\n\n1. Copy the primary key column (personId) of the root\
    \ table (people) to all subtables (authors and employees).\n2. Replace the generalization\
    \ arrows with «fkey» stereotyped dependency arrows (representing foreign key dependencies)\
    \ that are annotated at their source end with the name of the subtable's primary\
    \ key (here: personId).\n\n### 13.3.3 New Issues\n\nCompared to the model of our\
    \ first case study, shown in Figure 13.1 above, we have to deal with a number\
    \ of new issues in the **model code:**\n\n1. Defining the subclass relationships\
    \ between Employee and Person, as well as between Author and Person, using the\
    \ JS keyword extends discussed in Section 13.1.\n2. When loading the instances\
    \ of the root class (Person.instances) from persistent storage (Person.retrieve()),\
    \ we load (1) the records of the table representing the root class (people) for\
    \ creating its direct instances and (2) also the records of all other tables representing\
    \ its subclasses (authors and employees) for creating their direct instances,\
    \ also adding their object references for the root class population (to Person.instances).\
    \ In this way, the root class population does not only contain direct instances,\
    \ but all instances.\n3. When saving the instances of Employee and Author as records\
    \ of the JS entity tables employees and to persistent storage in Employee.saveAll\
    \ and Author.saveAll (Invoked in pl.v.employees.manage and pl.v.authors.manage),\
    \ we also save the instances of Person as records of the person table.\n\n###\
    \ 13.3.4 Code Model Classes of the JS Class Model\n\nThe JS class model shown\
    \ in Figure 13.2 above can be directly coded for getting the code of the classes\
    \ Person, Employee and Author as well as for the enumeration type EmployeeCategoryEL.\n\
    \n#### 13.3.4.1 Defining Subtype Relationships\n\nWe define the subtype relationships\
    \ between Employee and Person, as well as between Author and Person, with extends.\
    \ For instance, in m/Employee.js we define:\n\n```\nEmployeeCategoryEL = new Enumeration([\"\
    Manager\"]);\n\nclass Employee extends Person {\n  constructor ({personId, name,\
    \ empNo, category, department}) {\n    super({personId, name});\n    this.empNo\
    \ = empNo;\n    if (category) this.category = category;\n    if (department) this.department\
    \ = department;\n  }\n}\n```\n"
  mdcn: "\n\n## 13.3 案例研究 2：实现类层次结构\n\n当类层次变得复杂时，我们无法简单地消除它，而必须 (1) 在应用模型代码中 (2) 在底层数据库以及\
