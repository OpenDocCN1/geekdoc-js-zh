    \ retrieving the instances of a class hierarchy's root class (in our example,\
    \ Person) from a persistent data store organized according to the TCI approach,\
    \ we have to retrieve not only its direct instances from the table representing\
    \ the root class (people), but also all indirect instances from all tables representing\
    \ its subclasses (employees and authors), as shown in the following code:\n\n\
    ```\nPerson.retrieve = function () {\n  var people={}, employees={}, authors={};\n\
    \  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"{}\";\n  if (!localStorage[\"\
    employees\"]) localStorage[\"employees\"] = \"{}\";\n  if (!localStorage[\"people\"\
    ]) localStorage[\"people\"] = \"{}\";\n  try {\n    people = JSON.parse(localStorage[\"\
    people\"]);\n    employees = JSON.parse(localStorage[\"employees\"]);\n    authors\
    \ = JSON.parse(localStorage[\"authors\"]);\n  } catch (e) {\n    console.log(\"\
    Error when retrieving from LocalStorage\\n\" + e);\n  }\n  for (let key of Object.keys(authors))\
    \ {\n    try { // convert record to (typed) object\n      Author.instances[key]\
    \ = new Author(authors[key]);\n      // create superclass extension\n      Person.instances[key]\
    \ = Author.instances[key];\n    } catch (e) {\n      console.log(`${e.constructor.name}\
