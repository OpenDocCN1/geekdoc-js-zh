    Figure 12.11: A MCI table model representing the Person roles hierarchy.


    A MCI table model can be derived from the information design model by performing
    the following steps:

    1. Replacing the standard ID property modifier {id} in all classes with {pkey}
    for indicating that the standard ID property is a *primary key*.

    2. Replacing the singular (capitalized) class names (*Person, Author, etc.*) with
    plural lowercase table names (*people, authors, etc.*), and replacing camel case
    properties (*personId* and *empNo*) with lowercase underscore-separated for columns
    (*person_id* and *emp_no*).

    3. Adding a «table» stereotype to all class rectangles.

    4. Replacing the platform-independent datatype names with SQL datatype names.

    5. Dropping all generalization/inheritance arrows and adding all columns of supertables
    (such as *person_id* and *name* from *people*) to their subtables (authors and
    employees).


    Each table would only be populated with rows corresponding to the direct instances
    of the represented class. An example of an admissible population for this model
    is the following:


    | people | name |

    | :--- | :--- |

    | personId | |

    | 1003 | Tom Daniels |


    | authors |

    | person_id | name | biography |

    | :--- | :--- | :--- |

    | 1001 | Harry Wagner | Born in Boston, MA, in 1956, . . . |

    | 1077 | Immanuel Kant | Immanuel Kant (1724–1804) was a German philosopher .
    . . |'
