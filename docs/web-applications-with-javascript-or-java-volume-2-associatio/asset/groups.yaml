    ## 词汇表


    ### CRUD

    CRUD 是 *Create, Read, Update, Delete*（创建、读取、更新、删除）的缩写，表示任何软件应用程序执行的四个基本管理操作。


    ### 级联样式表

    CSS 用于定义网页的呈现样式，通过告诉浏览器如何渲染其内容、字体、背景和动画。通常，这些设置是在单独的 CSS 文件中完成，并通过 HTML head 部分中的特殊链接与之关联。


    ### 文档对象模型

    DOM 是一个用于检索和修改节点及 HTML 元素的抽象 API。所有编程语言都有实现 DOM 的 DOM 绑定（bindings）。


    ### 域名系统

    DNS 将用户易于操作的域名翻译为 IP 地址，以便在互联网上定位主机。


    ### ECMAScript

    由行业组织国际规范化组织（Ecma International）定义的 JavaScript 标准。


    ### 可扩展标记语言

    XML 允许以机器可读的方式对各种数据文件和消息的结构进行标记。XML 也可以是人类可读且自解释的。XML 基于 Unicode。XML 提供了一种语法，用于以带有*元素*和*属性*的
    XML 文档形式表示结构化信息。XML 文档中使用的特定元素和属性可以来自任何词汇表或用户定义的格式。


    ### 超文本标记语言

    HTML 允许对人类可读的网络界面的结构进行标记（或描述）。基于 XML 的 HTML 版本被称为 "XHTML"，与传统的 HTML 相比，它提供了更简洁的语法。


    ### 超文本传输协议

    HTTP 是一种基于 TCP/IP 技术的无状态请求响应协议，用于客户端和 Web 服务器之间的通信。HTTP 的主要目的是允许通过 URL 获取标识的网页文档。最近，HTTP
    越来越多用于提供 Web API 和 Web 服务。


    ### IANA

    IANA 代表互联网分配编号机构（Internet Assigned Numbers），是 ICANN 的分支，负责名称和数字。


    ### ICANN

    ICANN 代表互联网名称与数字机构（Internet Corporation for Assigned Names and Numbers），是一个维护域名系统的国际非营利组织。


    ### IndexedDB

    由浏览器管理的索引数据存储 JavaScript API。索引允许高性能搜索。像许多 SQL 数据库管理系统（DBMS）一样，IndexedDB 支持数据库事务。一组帮助产品适应任何目标语言和文化的最佳实践。它处理多种字符集、单位、键盘布局、时间和日期格式以及文本方向。


    ### I18N

    JSON 代表 JavaScript 对象表示法（JavaScript Object Notation），这是一种遵循 JavaScript 对象字面量语法的数据交换格式。许多编程语言支持
    JSON 作为 XML 的轻量级替代方案。


    ### MathML

    一种用于表示数学表达式的开放标准，无论是用于数据交换还是在网页内渲染它们。


    ### MIME

    MIME 类型（也称为“媒体类型”或“内容类型”）是随文件发送的关键字字符串，指示其内容类型。例如，音频文件可能标记为 `audio/ogg`，或者图像文件标记为
    `image/png`。


    ### 模型-视图-控制器

    MVC 是一种通用架构比喻，强调关注点分离原则（主要是模型和视图之间），并将模型视为应用最基础的部分。在 MVC 框架中，“M""V" 和 "C" 以不同的方式定义。通常，“模型”指的是应用的数据源，而“视图”表示用于用户界面的代码（基于
    CSS 样式的 HTML 表单和 DOM 事件），而“控制器”通常指负责在视图和模型之间调调的胶水代码。


    ### 对象约束语言

    OCL 是一种用于表示完整性约束的正式逻辑语言，主要用于 UML 类模型。它还允许定义派生表达式以定义派生属性，并为类模型中的操作定义前提条件和后置条件。


    ### 对象面向编程

    OOP 是一种基于对象概念和由对象实例化的编程范式。类类似于对象的蓝图：它们定义了属性以及可以应用于对象的方法/函数。OOP 的一个高级特性是类层次结构中的继承：子类继承其父类的特征（属性、方法和约束）。


    ### Web 本体语言

    OWL 是一种用于 Web 知识表示的正式逻辑语言。它允许定义词汇表（主要是带有属性的类），并支持对它们表示许多类型的完整性约束。OWL 是执行自动推理的基础，例如检查
    OWL 词汇表的一致性。以 UML 类模型形式定义的词汇表或数据模型可以转换为 OWL 然后检查其一致性。


    ### 便携网络图形

    PNG 是一种支持无损数据压缩的开放（非专有）图形文件格式。


    ### Polyfill（填充方案）

    Polyfill 是用于在浏览器中模拟标准 JavaScript 方法的 代码。


    ### 资源描述框架

    RDF 是 W3C 一种用于 Web 上表示机器可读信息的语言。


    ### 标准通用标记

    SGML 是定义标记语言的 ISO 规范。HTML4 是使用 SGML 定义的。XML 是 SGML 的简化继任者。


    ### 可缩矢量图形

    SVG 是一种基于 XML 的 2D 图像格式，可以使用 CSS 样式并进行交互。HTML5 允许在 HTML 文档中直接嵌入 SVG。


    ### Slot

    槽是一个键值对。在对象中它通常是属性值对。在 JavaScript 对象中，槽也可以由方法名和方法体组成。


    ### Unicode

    一种跨平台的字符集，包含了世界上大多数脚本语言的几乎字符。每个字符都被分配了一个 0 到 1,114,111 之间的唯一整数代码。例如，希腊字母 π 的代码是
    960。Unicode  ASCII 和 ISO-8859-1 (Latin-1) 等子集。XML 基于 Unicode。因此，XML 文档中的 Unicode
    编码是 UTF-8，它对 ASCII 字符仅使用一个字节，对不常用的字符使用三个字节。


    ### 统一资源标识符

    URI 是统一资源定位符 (URL) 或统一资源名称 (URN)。


    ### 统一资源定位符

    URL 是一种资源名称，包含用于在 Web 上定位该资源的 Web 地址。


    ### 用户代理

    用户代理是一种前端 Web 客户端程序，例如 Web 浏览器。


    ###### 超文本应用技术工作组

    WHATWG 是于 2004 年由 Apple、Mozilla 和 Opera 的前员工成立的，他们对 W3C 专注于 XHTML2 标准化导致 Web 技术标准进展缓慢感到不满。由
    Ian Hickson 领导，在与 W3C 的竞争与合作中开发了 HTML5 及相关的 JavaScript API。


