    \n最后一个问题（即从类的所有实例列表中选择一组关联对象）无法通过 HTML select 控件解决，因为其用性较差。当可选选项超过阈值（由屏幕上无需滚动可见的选项数量定义）时，多选元素将变得不可用，必须使用替代的**多选组件**。\n\
    \n## 3.4 代码实现模型\n\n注意，为了简单起见，我们没有在示例应用程序的代码中包含 JS 类模型中显示的所有约束验证检查代码。\n\n### 3.4.1\
