    ## 1.9 Collection Types for Multi-Valued Reference Properties 15


    ## 1.8 Rendering Reference Properties in the User Interface


    The widgets used for data input and output in a CRUD data management user interface
    (UI) normally correspond to properties defined in a model class of an app. We
    have to distinguish between (various types of) input fields corresponding to (various
    kinds of) attributes, and choice widgets (such as selection lists) corresponding
    to enumeration attributes or reference properties. Representing reference properties
    in the UI with select controls, instead of input fields, prevents the user from
    entering invalid ID references, so it takes care of referential integrity.


    In general, a single-valued reference property can be rendered as a single-selection
    list in the UI, no matter how objects populate the reference property''s range,
    from which one specific choice is to be made. If the cardinality of the reference
    property''s range is sufficiently small (say, not greater than 7), then we can
    use a radio button group instead of a selection list.


    A multi-valued reference property can be rendered as a multiple-selection list
    in the UI. However, the corresponding multiple-select control of HTML is not really
    usable as soon as there are many (say, more than 20) different options to choose
    from because why the reader chooses is visually too scattered. In the special
    case of having only a few (say, not than 7) options, we can also use a checkbox
    group instead of a list. But for the general case of having in the UI containing
    all associated objects from the reference property''s range class, we need to
    develop a special UI widget that allows to add (and remove) objects to (from)
    list of chosen objects.


    Such a multiple-choice widget consists of:


    - 1. an html list element containing the (associated) objects, where each list
    item contains a button for removing the object;

    - 2. a single-select control that, in combination with a button, allows to add
    a new object from the range of multi-valued reference property.


    ### 1.9 Collection Types for Multi-Valued Properties


    By default, a non-functional association associates a set of instances of the
    target class to any instance of the source class, which means that the collection
    values of multi-valued reference property are sets. However, there are also cases,
    where a non-functional association end is ordered and, consequently, the collection
    values of reference property take the form of ordered sets.


    In the following example, association end publishedBooks is not ordered, while
    the association end authors is ordered since the order of the authors of a book
    is meaningful. Notice that in class diagram, an ordered association end is marked
    with {ordered}.


    ## 16 1 Reference Properties Unidirectional Associations


    | Publisher | published Books | authors (ordered) | Author |

    | --- | --- | --- | --- |

    | name : String {id} | isbn : String {id} | personId : Integer {id} | |

    | address : String | title : String | | name : String |

    | | year : Integer | | |An ordered association should not represent any ordering
    based on the properties of the target class. In our example, this implies that
    the ordering of the authors of a book should, for example, not represent their
    alphabetical ordering, but rather it should represent information that is not
    available via the properties of Author. This is, indeed the case, since it represents
    some sort of significance, which is not expressed by any property.


    Notice that ordered association ends in information design models are just a convenience
    feature, because an ordered association can always be transformed into an unordered
    one by adding one or more attributes to the association''s target class, such
    that these attributes values can be used for the ordering. Ordered association
    allows a more concise information model, and a efficient implementation, by not
    requiring to make the ordering explicit with the help of auxiliary attributes.


    The two important types of collections for multi-valued reference properties are
    sets, while use cases for bags (multi-sets) and sequences (ordered multi-sets)
    as the collection type of multi-valued reference property is bag (or sequence),
    this can be expressed in the class diagram with the help of the annotation {nonunique}
    (or ordered, nonunique}) in the annotation of the association end or property
    modifier.


    Notice, that it is quite common to use lists (such as JS arrays or the Java interface
    type List) as the range of multi-valued reference properties, both for ordered
    and unordered properties.


