    # # 2 Implementing Unidirectional Functional Associations with Plain JS


    A unidirectional functional association is either one-to-one or many-to-one. In
    both cases such an association is represented, or implemented, with the help of
    a single-valued reference property.


    In this chapter, we show


    +   1. how to derive a JS class model from an OO class model with single-valued
    reference properties representing unidirectional functional associations,

    2. how to code the JS class model in the form of plain JavaScript model classes,

    3. how to write the view and controller code based on the model code.


    Before we show how to derive a JS class model and code it in JavaScript, we first
    introduce a few new elements of the JavaScript language, which we are going to
    use throughout the JavaScript code discussed in this book.


    # ## 2.1 New JavaScript Elements


    In this section, we present the most important new language elements introduced
    to JavaScript by ECMAScript 2015+ (that is, 2015+16+17+18+19+20+…).


    # ### 2.1.1 Block-Scope Variable Declarations with let and const


    ES5 did not allowing variables the scope of which is a block delimited by pair
    of curly braces,{ and }, or defined by a for loop. Rather, all variables declared
    with var, even if declared within a block, have either a function scope or the
    global scope. The new feature of block-scope variable declarations with let and
    const allows locals variables with a finer-grained scope, which helps avoiding
    unintended duplications and leads to more modular code.


    There is one meaning difference between let and const. Variables declared with
    const are frozen or immutable, and in this sense constant, while let variables
    are not it. It is preferable to use const for all variables that are not supposed
    to change their values. Otherwise, or if this is not clear, one should declare
    the variable with let if it is a block-scoped variable, or with var if it is a
    global or function-scoped variable.'
