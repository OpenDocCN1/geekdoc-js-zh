  - "[PAGE 178]\n\n# 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 163\n\n# 14.2.3.1 Summary\n\n+   1. Code the enumeration type (to be used\
    \ in the facelets).\n2. Code the model classes and add the corresponding JPA annotations\
    \ for class hierarchy.\n\nThese steps are discussed in more detail in the following\
    \ sections.\n\n# 14.2.3.2 Code the Enumeration Type BookCategoryEL\n\nThe enumeration\
    \ type BookCategoryEL is coded as a Java enum, providing enumeration literals\
    \ as well (human-readable) labels:\n\n```\npublic enum BookCategoryEL {\n    TEXTBOOK(\"\
    TextBook\"), BIOGRAPHY(\"Biography\");\n    private final String label;\n\n  \
    \  private BookCategoryEL(String label) {\n        this.label = label;\n    }\n\
    \    public String getLabel() {return this.label;}\n}\n```\n\n# 14.2.3.2.1 Code\
    \ the Model Classes\n\nWe code the model classes Book, Textbook and Biography\
    \ in the form of Java Entity classes using suitable JPA annotations:\n\n```\n\
    @Entity@Table(name=\"books\")\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    @DiscriminatorColumn(name=\"category\",ndiscriminatorType=DiscriminatorType.STRING,\
    \ length=16)\n@DiscriminatorValue(value=\"BOOK\")\n@ManagedBean public class Book\
    \ {\n    @Column(length=10)\n    @NotNull(message=\"An ISBN is required!\")\n\
    \    @Pattern(regex=\"\\\\b\\d{9}(\\\\d|X)\\\\\b\",\nmessage=\"The ISBN must be\
    \ a ..\")\n    private String isbn;\n    @Column(nullable=false)@NotNull(message=\"\
    A title is required!\")\n    private String title;\n    @Column(nullable=false)@NotNull(message=\"\
    A year is required!\")\n    @UpToNextYear\n```"
- md: "\n# 164 14 Subtyping with Java EE\n\n```\n@Min(value=1459, message=\"The year\
    \ must not be before 1459!\")\nprivate Integer year;\nconstructors, set, get and\
    \ other methods\n...\n```\n\nWhen using the JPA Single Table Inheritance technique\
    \ for a class hierarchy, the @Inheritance annotation (e.g. Book in our example)\
    \ must be set for the superclass it provides the strategy parameter with the value\
    \ InheritanceType.SINGLE_TABLE. The @DiscriminatorColumn annotation specifies\
    \ the name of the column storing the values between different types of subclasses\
    \ (Textbook and Biography, in our example).\n\nUnfortunately, we cannot use our\
    \ BookCategoryEL enumeration for defining the type of the column, because Java\
    \ expressions like BookCategoryEL.TEXTBOOK.name() are not constant, so a Java\
    \ compiler exception is thrown. Instead, we use DiscriminatorType.STRING. The\
    \ @DiscriminatorValue specifies a unique value to be stored in the discriminator\
    \ column of rows representing an instance of the given class.\n\nFurther, we define\
    \ subclasses Textbook and Biography:\n\n```\n@Entity(name=\"textbooks\")\n@DiscriminatorValue(value=\"\
    TEXTBOOK\")\n@ManagedBean(name=\"textbook\") @ViewScoped\npublic class Textbook\
    \ extends Book (\n@Column( nullable=false) @NotNull(\nmessage=\"A subject area\
    \ value is required\")\nString subjectArea;\nconstructors, set, get and other\
    \ methods\n)\n```\n\nTextbook and Biography are subclasses of Book, so we define\
    \ them with extends. For each subclass, we add a @DiscriminatorValue annotation\
    \ with a value from the BookCategoryEL enumeration.\n\n## 14.2.4 STI Database\
    \ Schema\n\nAs a result of the annotation\n\n```\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 165\n\nonly one database table is used for representing a class hierarchy.\
    \ This table contains the columns corresponding to all the properties of the classes\
    \ from the hierarchy plus the discriminator column. In our example, the books\
    \ table contains the following columns: isbn, title, year, subjectArea, about\
    \ and category. The simplified corrected SQL-DDL code used to generate the books\
    \ table for our application is shown below:\n\n```sql\nCREATE TABLE IF NOT EXISTS\
    \ `books` {\n  `ISBN` varchar(10) NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n\
    \  `YEAR` int(11) NOT NULL,\n  `SUBJECTAREA` varchar(255) DEFAULT NULL,\n  `ABOUT`\
    \ varchar(255) DEFAULT NULL,\n  `category` varchar(16) DEFAULT NULL\n}\n```\n\n\
    ## 14.2.5 Write the View And Controller Code\n\nThe user interface (UI) consists\
    \ of a start page that allows navigating to the data management pages (in our\
    \ example, to index.xhtml in the folder WebContent/views/books/). Such a data\
    \ management page contains four sections: retrieve/list books, create book, update\
    \ book and delete book.\n\n### 14.2.5.1 Summary\n\nWe have to take care of handling\
    \ the category discriminator and the subjectArea and segment properties both in\
    \ the “List all books” use case as well as in the “Create book” and “Update book”\
    \ use cases\n\n- 1. Adding a segment information column (“Special type”) to the\
    \ display table of the Retrieve/List All use case in retrieveGetAll.xhtml in the\
    \ folder WebContent/views/books/\n- 2. Adding a “Special type” select control,\
    \ and corresponding form fields for all segment properties, in the forms of the\
    \ “Create book” and “Update book” use cases in create.xhtml and update.xhtml in\
    \ the folder WebContent/views/books/. Segment property fields are only displayed,\
    \ and their validation occurs only when a corresponding book category has been\
    \ selected.\n\n### 14.2.5.2 Add a Segment Information Column in Retrieve/List\
    \ All\n\nWe add a \"Special type\" column to the display table of the \"List all\
    \ books\" use case in books.html:\n\n```xml\n<h:dataTable value=\"#{bookController.books}\"\
    \ var=\"b\">\n  <h:column>\n    <f:facet name=\"header\">Special type</f:facet>\n\
    \    #{b.getClass().getSimpleName() != 'Book' ? b.getClass().getSimpleName() :\
    \ ''}\n  </h:column>\n</h:dataTable>\n```\n\nA conditional expression is used\
    \ to check if the Java bean name is Book, in which case we don't show it, or if\
    \ it is something else (e.g. Textbook or Biography), and then it is shown. This\
    \ expression also shows how you can/call Java bean methods, not only custom methods.\n\
    \n### 14.2.5.3 Add a \"Special Type\" Select Control in Create and Update\n\n\
    In use cases, we need to allow selecting a special category of books ('textbook'\
    \ or 'biography') with the help of a select control in a panel grid element:\n\
    \n```xml\n<h:panelGrid id=\"bookPanel\" columns=\"3\">\n  <h:outputText value=\"\
    Special type:\" />\n  <h:selectOneMenu id=\"bookType\" value=\"#{viewScope.bookType}\"\
    >\n    <f:selectItem label=\"--\" />\n    <f:selectItems value=\"#{book.itemTypes}\"\
    \ />\n    <f:ajax event=\"change\" execute=\"@this\" render=\"textbookBookPanel\
    \ biographyBookPanel standardBookPanel\"/>\n  </h:selectOneMenu>\n  <h:message\
    \ for=\"bookType\" errorClass=\"error\" />\n</h:panelGrid>\n```\n\nIn the select\
    \ control, three alternative panel groups are referenced:\n\n- 1. A \"standardPanel\"\
    :\n<h:panelGroup id=\"standardBookPanel\">\n  <h:commandButton value=\"Create\"\
    \ action=\"#{bookController.create(book.isbn, title, year, category)}\" />\n</h:panelGroup>\n\
    - 2. A \"textbookPanel\":\n<h:panelGroup id=\"textbookBookPanel\">\n  <h:commandButton\
    \ value=\"Create\" action=\"#{bookController.create(book.isbn, title, year, subjectArea)}\"\
    \ />\n</h:panelGroup>\n- 3. A \"biographyPanel\":\n<h:panelGroup id=\"biographyBookPanel\"\
    >\n  <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn,\
    \ title, year, about)}\" />\n</h:panelGroup>\n"
  mdcn: "\n\n[content]\n\n# 164 14 Java EE 中的子类型\n\n```\n@Min(value=1459, message=\"\
    The year must not be before 1459!\")\nprivate Integer year;\nconstructors, set,\
    \ get and other methods\n...\n```\n\n当使用 JPA 单表继承（Single Table Inheritance）技术处理类层次结构时，必须为父类设置\
    \ `@Inheritance` 注解（例如我们示例中的 Book），并将 `strategy` 参数设置为 `InheritanceType.SINGLE_TABLE`。`@DiscriminatorColumn`\
    \ 注解指定了存储不同子类类型（在我们的示例中为 Textbook 和 Biography）之间数值的列名。\n\n遗憾的是，我们无法使用 `BookCategoryEL`\
    \ 枚举来定义列的类型，因为像 `BookCategoryEL.TEXTBOOK.name()` 这样的 Java表达式不是常量，会抛出 Java 编译器异常。相反，我们使用\
    \ `DiscriminatorType.STRING`。`@DiscriminatorValue` 指定了要存储在代表给定类实例的行的判别器列中的唯一值。\n\
    \n此外，我们定义了子类 `Textbook` 和 `Biography`：\n\n```\n@Entity(name=\"textbooks\")\n@DiscriminatorValue(value=\"\
    TEXTBOOK\")\n@ManagedBean(name=\"textbook\") @ViewScoped\npublic class Textbook\
    \ extends Book (\n@Column( nullable=false) @NotNull(\nmessage=\"A subject area\
    \ value is required\")\nString subjectArea;\nconstructors, set, get and other\
    \ methods\n)\n```\n\n`Textbook` 和 `Biography` 是 `Book` 的子类，因此我们使用 `extends` 来定义它们。对于每个子类，我们都添加了\
    \ `@DiscriminatorValue` 注解，其值来自 `BookCategoryEL` 枚举。\n\n## 14.2.4 STI 数据库模式\n\n\
    由于注解：\n\n```\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n```\n\n## 14.2\
    \ 案例研究 1：使用单继承实现类层次结构 — 165\n\n仅使用一个数据库表来表示类层次结构。该表包含了层次结构中所有类属性对应的列，加上判别器列。在我们的示例中，`books`\
    \ 表包含以下列：isbn、title、year、subjectArea、about 和 category。用于为我们的应用程序生成 books 表的简化修正\
    \ SQL-DDL 代码所示：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` {\n  `ISBN` varchar(10)\
    \ NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT NULL,\n  `SUBJECTAREA`\
    \ varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255) DEFAULT NULL,\n  `category`\
    \ varchar(16) DEFAULT NULL\n}\n```\n\n## 14.2.5 视图和控制器代码\n\n用户界面（UI）包含一个起始页面，允许导航到数据管理页面（在我们的示例中，位于\
    \ WebContent/views/books/ 文件夹下的 index.xhtml）。此类数据管理页面包含四个部分：检索/列出书籍、创建书籍、更新书籍和删除书籍。\n\
    \n### 14.2.5.1 总结\n\n在“列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中，我们必须处理类别判别器以及 subjectArea 和\
    \ segment 属性\n\n- 1. 在 WebContent/views/books/ 文件夹下的 `retrieveGetAll.xhtml` 中，“检索/列出所有”用例的显示表中添加段信息列（“特殊类型”）。\n\
    - 2. 在 WebContent/views/books/ 文件夹下的 `create.xhtml` 和 `update.xhtml` 中，“创建书籍”和“更新书籍”用例的表单中添加“特殊类型”选择控件以及所有\
    \ segment 属性相应的表单字段。segment 属性字段仅在选择了相应的书籍类别时才会显示并进行验证。\n\n### 14.2.5.2 在检索/列出所有中添加段信息列\n\
    \n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加了“特殊类型”列：\n\n```xml\n<h:dataTable value=\"\
    #{bookController.books}\" var=\"b\">\n  <h:column>\n    <f:facet name=\"header\"\
    >Special type</f:facet>\n    #{b.getClass().getSimpleName() != 'Book' ? b.getClass().getSimpleName()\
    \ : ''}\n  </h:column>\n</h:dataTable>\n```\n\n检查 Java Bean 是否为 Book，如果是则不显示；如果是其他（例如\
    \ Textbook 或 Biography），则显示。该表达式还展示了你可以如何调用 Java Bean 方法，而不仅仅是自定义方法。\n\n### 14.2.5.3\
    \ 在创建和更新中添加“特殊类型”选择控件\n\n在用例中，我们需要通过面板网格元素中的选择控件来选择特殊类型的书籍（'textbook' 或 'biography'）：\n\
    \n```xml\n<h:panelGrid id=\"bookPanel\" columns=\"3\">\n  <h:outputText value=\"\
    Special type:\" />\n  <h:selectOneMenu id=\"bookType\" value=\"#{viewScope.bookType}\"\
    >\n    <f:selectItem label=\"--\" />\n    <f:selectItems value=\"#{book.itemTypes}\"\
    \ />\n    <f:ajax event=\"change\" execute=\"@this\" render=\"textbookBookPanel\
    \ biographyBookPanel standardBookPanel\"/>\n  </h:selectOneMenu>\n  <h:message\
    \ for=\"bookType\" errorClass=\"error\" />\n</h:panelGrid>\n```\n\n在选择控件中引用了三个备用面板：\n\
    \n- 1. “标准面板”：\n<h:panelGroup id=\"standardBookPanel\">\n  <h:commandButton value=\"\
    Create\" action=\"#{bookController.create(book.isbn, title, year, category)}\"\
    \ />\n</h:panelGroup>\n- 2. “教科面板”：\n<h:panelGroup id=\"textbookBookPanel\">\n\
    \  <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn,\
    \ title, year, subjectArea)}\" />\n</h:panelGroup>\n- 3. “传记面板”：\n<h:panelGroup\
    \ id=\"biographyBookPanel\">\n  <h:commandButton value=\"Create\" action=\"#{bookController.create(book.isbn,\
    \ title, year, about)}\" />\n</h:panelGroup>\n\n"
