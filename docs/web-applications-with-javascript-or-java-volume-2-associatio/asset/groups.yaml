    \n## 2.7 Quiz Questions\n\n### 2.7.1 Question 1: JS Class Model\n\nWhich is the\
    \ correct JS class model for the Committee class derived from the given OO class\
    \ model?\n\n| Committee | ClubMember |\n| :--- | :--- |\n| name : String (id)\
    \ | memberid : Integer (id) |\n| chair : ClubMember | firstName : String |\n\n\
    Select one:\n\n- 1. O\n\n| Committee |\n| :--- |\n| «set/set> name : string (id)\
    \ |\n| «set/set> chair : ClubMember |\n| checkName(in n : string) : ConstraintViolation\
    \ |\n| checkChair(in c : ClubMember) : ConstraintViolation |\n| toString() : string\
    \ |\n| toRecord() : Object |\n\n- 2. O\n\n| Committee |\n| :--- |\n| <get/set>\
    \ name : string (id) |\n| <get/set> chair : ClubMember |\n| checkName(in n : string)\
    \ : ConstraintViolation |\n| checkNameAsId(in n : string) : ConstraintViolation\
    \ |\n| checkChair(in c : ClubMember) : ConstraintViolation |\n| toString() : string\
    \ |\n| toRecord() : Object |\n\n- 3. O\n\n| Committee |\n| :--- |\n| <get/set>\
    \ name : string (id) |\n| <get/set> chair : ClubMember |\n| checkName(in n : string)\
    \ : ConstraintViolation |\n| checkNameAsId(in n : string) : ConstraintViolation\
    \ |\n| checkChair(in c : ClubMember) : ConstraintViolation |\n| toString() : string\
    \ |\n| toRecord() : Object |\n\n## 2.7 Quiz Questions — 37\n\n# 3 Implementing\
    \ Unidirectional Associations with Plain JS\n\nA unidirectional nonfunctional\
    \ association is either one-to-many or many-to-many. In this chapter, we show:\n\
    \n- 1. how to derive a JS class model from an OO class model with multi-valued\
    \ reference properties,\n- 2. how to code the JS model based on unidirectional\
    \ associations,\n- 3. how to write the view and controller based on these.\n\n\
    ## 3.1 Implementing Multi-Valued Reference Properties\n\nA multi-valued reference\
    \ property, such as the property `authors`, a collection of references to some\
    \ type. When creating a new object of `Book`, the constructor needs to have a\
    \ parameter for providing internal object references or ID references, as shown\
    \ in the following example:\n\n```javascript\nclass Book {\n  constructor({isbn,\
    \ title, year, authors, authorIdRefs, publisher, publisher_id}) {\n    this.isbn\
    \ = isbn;\n    this.title = title;\n    this.year = year;\n    // assign object\
    \ reference or ID reference\n    this.authors = authors || authorIdRefs;\n   \
    \ if (publisher || publisher_id) this.publisher = publisher || publisher_id;\n\
    \  }\n}\n```\n\nNotice that the constructor's parameter is expected to contain\
    \ either authors or authorIdRefs. The JavaScript expression `authors || authorIdRefs`,\
    \ using the disjunction operator `||`, evaluates to a map authors, if there is\
    \ a slot with name authors, or to an array authorIdRefs, otherwise. We handle\
    \ the resulting ambiguity in the property setter by checking the type of the argument\
    \ as shown in the following code:\n\n```javascript\nset authors (a) {\n  this._authors\
    \ = {};\n  if (Array.isArray(a)) { // array of IdRefs\n    for (let idRef of a)\
    \ {\n      this.addAuthor(idRef);\n    }\n  } else // map of IdRefs to object\
    \ references\n    for (let idRef of Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n\
    \    }\n  }\n}\n```\n\n## 3.2 Make a JS Class Model\n\nIn JS, a collection-valued\
    \ reference property can be implemented in two ways:\n\n1. having an array list\
    \ (JS array) of object references as its value,\n2. having a map as its value,\
    \ that the values of the object's standard ID attribute are the keys, which are\
    \ mapped to internal object references.\n\nWe prefer using maps for set-valued\
    \ reference properties since they guarantee that each element is unique, while\
    \ with an array we would have to prevent duplicate elements. Also, an element\
    \ of a map can be easily deleted (with the help of the delete operator), while\
    \ this requires more effort in the case of an array. However, for implementing\
    \ ordered (or nonunique) association ends corresponding to ordered-collection-valued\
    \ (or bag/sequence-valued) reference properties, we use JS arrays.\n\nOur starting\
    \ point for making a JS class model is the following OO class model:\n\n| Book\
    \ | Publisher |\n| :--- | :--- |\n| isbn[1]: String (id) | name : String (id)\
    \ |\n| title[1]: String | address : String |\n| year[1]: Integer | |\n| publisher[0..1]:\
    \ Publisher | |\n| authors[*]: Author | |\n| | personid: Integer (id) |\n| | name:\
    \ String |\n"
