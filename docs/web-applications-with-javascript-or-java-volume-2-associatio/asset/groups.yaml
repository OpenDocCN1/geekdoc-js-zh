    \ 方法和静态检查函数。然而，在我们的示例中，将**类层次合并**设计模式（在 12.6 节讨论）应用于 Employee 的单子类分段，通过消除 Manager\
    \ 子类来简化类模型是自然而。这导致了图 13.2 所示的模型。注意，Person 可能是 Employee、Author 或两者皆是。\n\n| Person\
    \ |\n| :--- |\n| «get/set» personid: Integer (id) |\n| «get/set» name: String\
    \ |\n| checkPerson(in id string) : ConstraintViolation |\n| checkPersonAsid(in\
    \ id : string, in type) : ConstraintViolation |\n| checkName(in n : string) :\
    \ ConstraintViolation |\n\n| Author |\n| :--- |\n| «get/set» biography : string\
