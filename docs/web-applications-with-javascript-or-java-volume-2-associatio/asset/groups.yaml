    \ 注解的 `mappedBy` 参数指定 `Book` 类中的属性名：\n\n```java\n@Entity\npublic class Book {\n\
    \  ..\n  @ManyToOne(fetch=FetchType.EAGER)\n  @JoinColumn(name=\"PUBLISHER_ID\"\
    )\n  private Publisher publisher;\n}\n```\n\n在 `Author` 类中，我们添加带有 `@ManyToMany`\
    \ 注解的 `authoredBooks` 属性：\n\n```java\n@Entity\npublic class Author {\n  ..\n \
    \ @ManyToMany(fetch=FetchType.EAGER, mappedBy=\"authors\")\n  private Set<Book>\
    \ authoredBooks;\n}\n```\n\n`Author` 类中 `@ManyToMany` 属性的 `mappedBy` 属性指定 `Book`\
    \ 类中的反向属性名：\n\n### 9.2.4 编写 Setter 操作\n\n任何耦合到派生反向属性的引用属性的 setter（实现双向关联），现在还需要对反向属性的对应值（集合）进行赋值/添加/移除反向引用。这种\
    \ setter 的一个示例是下面的 `setPublisher` 方法：\n\n```java\npublic class Book {\n  ...\n\
    \  public void setPublisher(Publisher publisher) {\n    // 从 publisher.publishedBooks\
    \ 中移除书籍引用\n    if (this.publisher != null) {\n      this.publisher.removePublishedBook(this);\n\
    \    }\n    // 将书籍添加到 publisher.publishedBooks\n    if (publisher != null) {\n\
    \      publisher.addPublishedBook(this);\n    }\n    this.publisher = publisher;\n\
    \  }\n}\n```\n\n### 9.2.5 编写添加和移除操作\n\n对于任何耦合到派生反向属性的多值引用属性，其 `add` 和 `remove`\
    \ 方法都必须对反向属性的值集合进行赋值/添加/移除相应的反向引用。\n\n"
