    \nGerd Wagner and Mircea Diaconescu\n\n# Web Applications with Javascript or Java\n\
    \nVolume 2:\nAssociations and Class Hierarchies\n\nDE GRUYTER\nOLDENBOURG\n\n\
    # Authors\n\nProf. Dr. Gerd Wagner\nBTU Cottbus-Senftenberg\nFachgebiet Internettechnologie\n\
