- md: "\n## 13.3.4.2 Loading the Instances of the Root Class Person\n\nWhen retrieving\
    \ the instances of a class hierarchy's root class (in our example, Person) from\
    \ a persistent data store organized according to the TCI approach, we have to\
    \ retrieve not only its direct instances from the table representing the root\
    \ class (people), but also all indirect instances from all tables representing\
    \ its subclasses (employees and authors), as shown in the following code:\n\n\
    ```javascript\nPerson.retrieve = function () {\n  var people={}, employees={},\
    \ authors={};\n  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"\
    {}\";\n  if (!localStorage[\"employees\"]) localStorage[\"employees\"] = \"{}\"\
    ;\n  if (!localStorage[\"people\"]) localStorage[\"people\"] = \"{}\";\n  try\
    \ {\n    people = JSON.parse(localStorage[\"people\"]);\n    employees = JSON.parse(localStorage[\"\
    employees\"]);\n    authors = JSON.parse(localStorage[\"authors\"]);\n  } catch\
    \ (e) {\n    console.log(\"Error when retrieving from LocalStorage\\n\" + e);\n\
    \  }\n  for (let key of Object.keys(authors)) {\n    try { // convert record to\
    \ (typed) object\n      Author.instances[key] = new Author(authors[key]);\n  \
    \    // create superclass extension\n      Person.instances[key] = Author.instances[key];\n\
    \    } catch (e) {\n      console.log(`${e.constructor.name} while deserializing`\
    \ + `author ${key}: ${e.message}`);\n    }\n  }\n};\n```\n\nEach record of the\
    \ authors table is retrieved and converted to an Author object, a reference to\
    \ which is copied to Person. Also the records of the employees table are processed\
    \ in this way, while the records of the people table are simply retrieved and\
    \ converted to Person objects:\n\n```javascript\nPerson.retrieveAll = function\
    \ () {\n  ...\n  for (let key of Object.keys(employees)) {\n  }\n  for (let key\
    \ of Object.keys(people)) {\n    try // convert record to (typed) object\n   \
    \   Person.instances[key] = new Person(people[key]);\n    } catch (e) {\n    \
    \  console.log(`${e.constructor.name} while deserializing ` +\n        `${key}:\
    \ ${e.message}`);\n    }\n  }\n}\n```\n\n## 13.3.4.3 Saving the Supertable when\
    \ Saving a Subtable\n\nSince the app's data is kept in main memory as long as\
    \ the app is running (which is long as the app's webpage is kept open in the browser),\
    \ the data has to be saved to persistent storage when the app is exited (e.g.,\
    \ by closing its browser tab). When saving the instances of Employee and Author\
    \ to persistent storage in pl.v.employees.manage.exit and pl.v.authors.manage.exit,\
    \ we also save the direct instances of Person (as records of the people table).\
    \ This is necessary because changes to Employee or Author instances may imply\
    \ changes of Person.instances.\n\nFor instance, for Employee data management,\
    \ we define in v/employees.js:\n\n```javascript\npl.v.employees.manage = {\n \
    \ exit: function () {\n    Employee.saveAll();\n    Person.saveAll();\n  },\n\
    \  ..\n```\n\n## 14 Subtyping with Java EE\n\nIn this chapter, we explain two\
    \ case studies based on fragments of the information model of our running example,\
    \ the Public Library app. In the first case study, in Figure 12.1, we consider\
    \ the single-level class hierarchy with root Book having foreign dependencies.\
    \ which is an incomplete disjoint segmentation. We use the Single Table Inheritance\
    \ approach for mapping this class hierarchy to a single database table.\n\nIn\
    \ the second case study, we consider the multi-level class hierarchy consisting\
    \ of the Person roles Employee, Manager and Author, shown in Figure 12.8. We use\
    \ the Joined Table Inheritance approach for mapping this class hierarchy to a\
    \ set of database tables that are related with each other via foreign key dependencies.\n\
    \nIn both cases we show:\n\n- 1. how to derive a Java Entity class model,\n2.\
    \ how to code the Java Entity class model in the form of Java Entity classes,\n\
    3. how to write the view and controller code based on the model code.\n\n## 14.1\
    \ Subtyping in Java\n\nJava provides built-in support for subtyping with its extends\
    \ keyword, but it does not support multiple inheritance. Consider the following\
