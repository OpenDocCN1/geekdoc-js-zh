- md: "\n# 14.3 Case Study 2: Implement a Class Hierarchy with Joined Table Inheritance\n\
    \nThe starting point for our case study is the design model shown in Figure 12.8\
    \ above. In the following sections, we show how to eliminate the Manager class\
    \ by using the Class Merge design pattern and how to implement the Person hierarchy\
    \ and use Joined, Multiple Table Inheritance storage with the help of JPA framework.\n\
    \n## 14.3.1 Make the Java Entity class model\n\nWe design the model classes of\
    \ our example app with the help of a Java Entity model that we derive from the\
    \ design model by essentially leaving the generalization rows as they are and\
    \ just adding getters and setters to each class. However, the case of our example\
    \ app, it is natural to apply the Class Hierarchy Merge design pattern to the\
    \ segmentation of Employee for simplifying the data model by eliminating the Manager\
    \ subclass. This leads to the model shown in Figure 14.2 below. We have also made\
    \ two technical decisions:\n\n| Java Entity |\n| :--- |\n| Person |\n| <get/set>\
    \ personId : Integer (id) |\n| <get/set> name : String |\n| checkPersonIdAsId(in\
    \ id : String, in type) : ConstraintViolation |\n\n| Java Entity |\n| :--- |\n\
    | Employee |\n| <get/set> empNo[1] : integer (unique) |\n| <get/set> type(0.1]\
    \ : EmployeeType |\n| <get/set> department(0.1) : String |\n| checkUniqueEmployeeNo(in\
    \ n : Integer) : ConstraintViolation |\n| toString() : String |\n| create(in pid\
    \ : Integer, in n : String, t : EmployeeType, d : String) |\n| retrieveAll() :\
    \ Employee[]* |\n| --() |\n\n| Java Entity |\n| :--- |\n| Author |\n| <get/set>\
    \ biography : String |\n| toString() : String |\n| create(in pid : Integer, in\
    \ name : String, in bio : String) |\n| retrieveAll() : Author* |\n| --() |\n\n\
    (disjoint, complete)\n\nFigure 14.2: The Java Entity class model of the Person\
    \ class hierarchy.\n\n- 1. We have declared the segmentation of Person into Employee\
    \ and Author to be disjoint and complete, that is, any person is either an employee\
    \ or an author. Since Java does not support multiple classification, we cannot\
    \ implement an overlapping segmentation, as needed when modeling roles, with Java.\n\
    - 2. We turned Person into an abstract class (indicated by its name in italics),\
    \ which means it cannot have direct instances, but only indirect ones via its\
    \ subclasses Employee and Author. This technical design is compatible with the\
    \ fact that any Person is Employee or Author (or both), and consequently there\
    \ is no need for any object to instantiate.\n\n## 14.3.2 New Issues\n\nCompared\
    \ to the model of our case study, shown in Figure 14.1, we have to define the\
    \ relationships between Employee and Person as well as between Author and Person,\
    \ using JPA annotations. In the UI we have to take care of:\n\n- 1. Adding the\
    \ views (in folders WebContent/views/authors and WebContent/views/employees) and\
    \ controller classes (AuthController and EmployeeController) for the corresponding\
    \ Author and Employee model.\n- 2. Deal with Manager case by adding a \"Special\
    \ type\" select, in the forms of \"Create\" and \"Update\" cases in WebContent/views/create.xhtml\
    \ and WebContent/views/update.xhtml. Segment property fields (i.e., department\
    \ in our example) are only displayed, and their validation is performed when a\
    \ corresponding employee type has been selected.\n\n## 14.3.3 Code the Classes\
    \ of the Java Entity Model\n\nThe Java class model shown in Figure 14.2 above\
    \ is coded using JavaBeans for Employee and Author as well as the Employee type\
    \ enumeration.\n\n### 14.3.3.1 Define the Relationships\n\nWe define the relationships\
    \ between Employee and Person as well as between Author and Person using JPA annotations.\
    \ At first we create the Person class as shown below:\n\n```java\n@Entity\n@Table(name=\"\
    persons\")\n@Inheritance(strategy=InheritanceType.JOINED)\n@DiscriminatorColumn(name=\"\
    category\", discriminatorType=DiscriminatorType.STRING, length=16)\npublic abstract\
    \ class Person {\n    @Id @NotNull(message=\"A person ID is required!\")\n   \
    \ private Integer personId;\n    @NotNull(message=\"A name is required!\") @Column(nullable=false)\n\
    \    private String name;\n}\n```\n\nComparing with the hierarchy shown in Case\
    \ 1, the @Inheritance annotation defines strategy=InheritanceType.JOINED. This\
    \ means, for every class in the inheritance hierarchy, a database table is used.\
    \ The @DiscriminatorColumn(name=\"category\") specifies the column in the corresponding\
    \ table (i.e., persons) of the top hierarchy class (i.e., Person) which stores\
    \ the discriminator value used to identify the type of each entry.\n\nNotice that\
    \ the Java class Person is declared abstract, which means it can't be initialized;\
    \ instead we can initialize subclasses derived from it (i.e., Employee and Author).\
    \ This also means we don't declare @DiscriminatorValue because no instance of\
    \ Person is stored in the database table.\n\nFurther, we define the Author class\
    \ as follows:\n\n```java\n@Entity\n@Table(name=\"authors\")\n@DiscriminatorValue(value=\"\
    AUTHOR\")\n@ManagedBean(name=\"author\") @ViewScoped\npublic class Author extends\
    \ Person {\n    @NotNull(message=\"A biography is required!\")\n    private String\
    \ biography;\n}\n```\n\nThe Author class inherits Person, therefore the get and\
    \ set methods corresponding to personId and name properties are available. The\
    \ @DiscriminatorValue(value=\"AUTHOR\") specifies the column of the category table\
    \ stores the value AUTHOR for every entry which comes from persisting an Author\
    \ instance.\n\nFinally, we define the Employee class:\n\n```java\n@Entity\n@Table(name=\"\
    employees\")\n@DiscriminatorValue(value=\"EMPLOYEE\")\n@ManagedBean(name=\"employee\"\
    ) @ViewScoped\npublic class Employee extends Person {\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"An employee ID is required!\")\n    private Integer empno;\n\
    \    @Column(nullable=false, length=32)\n    @Enumerated(EnumType.STRING)\n  \
    \  private EmployeeType type;\n    @Column(nullable=true, length=64)\n    private\
    \ String department;\n}\n```\n\nNotice the type property used to identify the\
    \ Employee type, such as Manager. Its values are defined by the EmployeeType enumeration.\n\
    \n### 14.3.3.2 Database Schema for Joined Table Hierarchy\n\nAs a result of the\
    \ annotation\n\n```java\n@Inheritance(strategy = InheritanceType.JOINED)\n```\n\
    for each class in the inheritance hierarchy, one database table is created. The\
    \ corresponding SQL-DDL scripts by JPA to create the persons, authors and employees\
    \ tables are shown below:\n\n```sql\nCREATE TABLE IF NOT EXISTS persons (\n  \
    \  PERSONID int(11) NOT NULL,\n    category varchar(16) DEFAULT NULL,\n    NAME\
    \ varchar(255) NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS authors (\n    PERSONID\
    \ int(11) NOT NULL,\n    BIOGRAPHY varchar(255) DEFAULT NULL\n);\nADD CONSTRAINT\
    \ FK_authors_PERSONID FOREIGN KEY (PERSONID) REFERENCES persons (PERSONID);\n\n\
    CREATE TABLE IF NOT EXISTS employees (\n    PERSONID int(11) NOT NULL,\n    DEPARTMENT\
    \ varchar(64) DEFAULT NULL,\n    EMPNO int(11) NOT NULL,\n    TYPE varchar(32)\
    \ DEFAULT NULL\n);\nADD CONSTRAINT FK_employees_PERSONID FOREIGN KEY (PERSONID)\
    \ REFERENCES persons (PERSONID);\n```\n\nAs we can see, every table contains the\
    \ direct properties defined by the corresponding bean class. Additionally, the\
    \ authors and employees tables are correlated with a foreign key constraint for\
    \ the PERSONID column referring to the PERSONID column from the persons table.\n\
    \n## 14.3.4 Write the View and Controller Code\n\nIn the user interface, for every\
    \ bean class, we have a controller class which contains the create, update and\
    \ delete CRUD methods. The PersonController class is defined as abstract and contains\
    \ the checkPersonId method, which is common to all subclasses. The AuthController\
    \ and EmployeeController inherit the PersonController.\n\nFor every non-abstract\
    \ entity class in the inheritance hierarchy we define a set of views corresponding\
    \ to CRUD operations. For example, in the case of Author we have the files retrieveAll.xhtml,\
    \ create.xhtml, update.xhtml, and delete.xhtml in the folder WebContent/views/authors/.\
    \ In the case of Employee, the Retrieve/List Employees use cases to display the\
    \ Special type of employee column:\n\n```xml\n<column>\n    <f:facet name=\"header\"\
    >Special type of employee</f:facet>\n    #{e.type == null ? e.type.concat(\" \"\
    ).concat(e.department).concat(\" department\") : \"\"}\n</column>\n```\n"
  mdcn: "\n\n# 14.3 案例研究 2：使用连接表继承实现类层次结构\n\n我们案例研究的起点是图 12.8 所示的设计模型。在接下来的章节中，我们将展示如何使用“类合并”（Class\
