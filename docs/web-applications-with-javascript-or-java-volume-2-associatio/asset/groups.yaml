    \    publisher_id:formE.selectPublisher.value\n\n  // 验证所有表单控件并显示错误消息\n  formE.isbn.setCustomValidity(\n\
    \    Book.checkIsbnAsId(slots.isbn).message);\n  /* ..（title 和 year 同） */\n  //\
    \ 仅当所有表单字段有效时才保存输入数据\n  if (formE.checkValidity()) {\n    Book.add(slots);\n \
    \ }\n```\n\n`setupUserInterface` 代码在“更新”用例中是类似的。\n\n## 2.7 练习题\n\n### 2.7 练习题\
    \ 1：类模型\n\n对于多值引用属性，以下哪项是给定类模型派生的 JS 类？\n\n| Committee |\n| :--- |\n| 1. O |\n\
    | 2. O |\n| 3. O |\n\n### 2.7 练习题 2：使用 `||` 运算符\n\n选择以下项项：\n\n| Committee |\n\
    | :--- |\n| 1. O |\n| 2. O |\n| 3. O |\n\n## 2.7 练习题 — 37\n\n# 3 使用原生 JS 实现单向关联\n\
    \n单向关联要么一对多（one-to-many），或者是多对多（many-to-many）。在本章中，我们将展示：\n\n- 1. 如何从多值引用属性的 OO\
    \ 模型推导出 JS 类，\n- 2. 如何基于单向关联编写模型，\n- 3. 如何基于这些编写视图和控制器\n\n## 3.1 实现多值引用属性\n\n\
    多值引用属性，例如 `authors`，是对某些类型的集合。在创建 `Book` 的新对象时，构造函数需要一个提供内部对象引用或 ID 引用的参数，如下所示：\n\
    \n```javascript\nclass Book {\n  constructor({isbn, title, year, authors, authorRefs,\
    \ publisher, publisher_id}) {\n    this.isbn = isbn;\n    this.title = title;\n\
    \    this.year = year;\n    // 分配对象引用或 ID引用\n    this.authors = authors || authorRefs;\n\
    \    if (publisher || publisher_id) this.publisher = publisher || publisher_id;\n\
    \  }\n}\n```\n\n注意构造函数的参数包含 `authors` 或 `authorRefs`。JavaScript 表达式 `authors ||\
    \ authorRefs` 使用逻辑或运算符 `||`，在存在 `authors` 时返回一个 map，否则返回数组 `authorRefs`。我们在属性\
    \ setter 中处理这种歧义，如下代码所示：\n\n```javascript\nset authors (a) {\n  this._authors\
    \ = {};\n  if (Array.isArray(a)) { // IDRefs 的数组\n    for (let idRef of a) {\n\
    \      this.addAuthor(idRef);\n    }\n  } else // IDRefs 到对象引用的 map\n    for (let\
    \ idRef of Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n\
    ```\n\n## 3.2 创建 JS 类模型\n\n在 JS 中，集合值引用属性可以通过两种方式实现：\n\n1. 使用对象引用列表（JS 数组）作为其值；\n\
    2. 使用 map 作为其值，将对象的标准 ID 属性作为键映射到内部对象引用。\n\n我们倾向于使用 map 来处理集合值属性，因为它们保证了每个元素的唯一性，而在数组中我们必须防止重复元素。此外，map\
    \ 的元素可以被删除（借助 `delete` 运算符），而在数组的情况下这需要更多努力。然而，对于对应有序集合值（或包/序列值）引用属性的有序（或非唯一）关联端，我们使用\
    \ JS 数组。\n\n创建 JS 类模型的起点是以下 OO 类模型：\n\n| Book | Publisher |\n| :--- | :--- |\n\
    | isbn[1]: String (id) | name : String (id) |\n| title[1]: String | address :\
    \ String |\n| year[1]: Integer | |\n| publisher[0..1]: Publisher | |\n| authors[*]:\
    \ Author | |\n| | personid: Integer (id) |\n| | name: String |\n\n"
