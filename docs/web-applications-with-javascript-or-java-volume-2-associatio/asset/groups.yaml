    | lastName : String |\n| Student |\n| studNo : Integer |\n\nFirst, we define the\
    \ superclass Person. Then, we define the subclass Student and its subtype relationship\
    \ to Person by means of the extends keyword:\n\n```java\npublic class Person {\n\
    \    private String firstName;\n    private String lastName;\n    ..\n}\npublic\
    \ class Student extends Person {\n    private int studentNo;\npublic Student(String\
    \ first, String last, int studNo) {\n    super(firstName, lastName);\n    this.setStudNo(studNo);\n\
    }\n```\n\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Table\
    \ Inheritance\n\nNote that in the Student class, we define a constructor with\
    \ all the parameters required to create an instance of Student. In this subclass\
