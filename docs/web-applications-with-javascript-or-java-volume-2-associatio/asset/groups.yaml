    \ parts and those with *inseparable* parts.\n\n### 10.1.1 Aggregation\n\nAn aggregation\
    \ is a special form of a part-whole association, where the parts of a whole can\
    \ be shared with other wholes. For instance, we can model an aggregation between\
    \ the classes DegreeProgram and Course, as shown in the following diagram, since\
    \ a course is part of a degree program and a course can be shared among two or\
    \ more degree programs (e.g. an engineering degree could share a C programming\
    \ course with a computer science degree).\n\n| DegreeProgram | Course |\n| :---\
    \ | :--- |\n| name : String * | id : String * |\n\nHowever, the concept of an\
