    ## 12.4 子类型化与继承


    在对对象类型进行特化时，我们为新添加的子类型定义额外的特征。在许多情况下，这些额外的特征是更具体的属性。例如，在 TextBook（教科）特化 Book（书籍）的情况下，我们定义了额外的属性
    subjectArea（学科）。在某些编程语言中（如 Java），要求子类型必须继承超类型。


    然而，我们也可以在不定义额外的属性或操作/方法的情况下，通过定义额外的约束来特化对象类型。


    ## 12.2 通过泛化引入超类型


    我们通过图 12.2 所示示例说明泛化。


    | Employee | | | Author |

    | :--- | :--- | :--- | :--- |

    | employeeNo : Integer (id) | | | authorId[1] : Integer (id) |

    | name : String | | isbn : String (id) | name[1] : String |

    | dateBirth : Date | | title : String | dateBirth : Date |

    | salary : Decimal | | year : Integer | dateDeath[0..1] : Date |

    | * | | * | biography[1] : Text |

    | Publisher | Book | authored | |

    | name : String (id) | Books | Books | |

    | address : String | 0.1 | * |


    **图 12.2：** 对象类型 Employee 和 Author 共享几个属性。


    在添加类型 Employee 后，我们注意到 Employee 和 Author 共享许多属性，这是因为员工和作者都是人，而成为员工和成为作者是人扮演的角色。因此，我们可以通过添加一个共同超类型
    Person 来对这两个对象类型进行泛化，如图 12.3 的图表所示。


    在泛化两个或多个对象类型时，我们将它们共享的特征移动到新添加的超类型中并在那里进行集中管理。在 Employee 和 Author 的情况下，这组共享特征包括属性
    name、dateBirth 和 dateDeath。通常情况下，共享特征可能包括属性、关联和约束。


    注意，由于在信息设计模型中，每个顶层类都需要一个标准的标识符，因此在新的类 Person 中，我们声明了标准标识符属性 personId，它被所有子类继承。因此，我们必须重新考虑在泛化之前在子类中声明为标准标识符的属性。在
    Employee 的情况下，我们将属性 employeeNo 声明为标准标识符。由于员工是一个重要的业务信息项，即使它不再是标准标识符，我们也必须保留它。因为它是一个替代标识符（“键”），我们使用约束关键字
    `key` 为其定义了一个*唯一性*（uniqueness）约束。


    在 Author 的情况下，我们将属性 authorId 声明为标准标识符。假设该属性代表的是纯技术性的而非业务信息项，我们舍弃了它，因为它不再需要作为作者的标识符。因此，我们得到了一个模型，该模型允许员工号或
    personId 值来识别员工，并通过 personId 来识别作者。


    我们考虑原始示例模型的以下扩展，如图 12.4 所示：

    1. 将 Book 分为 TextBook 和 Biography 的不相交（但不完全）的划分；

    2. 将 Person 分为 Author 和 Employee 的重叠且不完全的划分，并由 Manager 进一步特化。


    ## 12.3 内涵与扩展


    对象类型的*内涵*（intention）由其特征集定义，包括属性、关联、约束和操作。


    对象类型的*扩展*（extension）是所有实例化该对象类型的对象集合。对象类型的扩展也称为其*实例*（population）。


    | Employee | Person |

    | :--- | :--- |

    | employeeNo: Integer (key) | personid[1]: Integer (id) |

    | salary : Decimal | name[1]: String |

    | | dateOfBirth[1]: Date |

    | | dateOfDeath[0..1]: Date |

    | * | |

    | 0..1 | |


    | Publisher | Books | Author |

    | :--- | :--- | :--- |

    | name: String (id) | isbn: String (id) | biography: Text |

    | address: String | title: String | |

    | | year: Integer | |

    | 0.1 * | * | |


    | managed | Books |

    | :--- | :--- |

    | Publisher | 0.1 |


    | TextBook | Biography |

    | :--- | :--- |

    | subjectArea: String | about: String |


    | Manager |

    | :--- |

    | 1 |


    **图 12.4：** 具有两个类层次结构的信息模型。


    我们存在以下对偶性：虽然超类型的所有特征都包含在其子类的内涵或特征集之中（内涵性），但子类型的所有实例都包含在超类型的扩展中（外延性）。由于内涵/扩展的对偶性，我们可以通过两种方式特化给定的类型：

    - **通过扩展类型的内涵**（例如在子类中添加特征）。

    - **通过限制类型的扩展**（例如添加约束）。


    典型的面向对象语言（如 Java）仅支持第一种可能性（扩展类型），而 XML Schema 也支持第二种（限制类型）。


    ## 12.4 类型层次结构


    *类型层次结构*（或类层次结构）由两个或更多类型组成，其中一个是*根*（root），而所有其他类型都至少有一个超类型。层次结构最简单的情况（只有一层）被称为泛化。默认情况下，每当划分没有任何注释时，它都是（不完全的、不相交的）。在类图中，我们可以通过在泛化箭头上标注来表示这些约束。例如，对
    Vehicle 的划分 `{complete, disjoint}` 表示它是一个完全不相交的划分。否则，它被称为重叠的。


    信息模型可以包含任意数量的类层次结构。


    ## 12.5 种类与角色


    为了理解自然语言语句和信息模型中对象类型和子类型的不同类别，我们可以根据 Giancarlo Guizzardi 在其对象分类理论中区分类性（sortal）和非类性（non-sortal），以及刚性（rigid）和非刚性（non-rigid）对象类型。


    如果一个对象类型的实例具有统一的标识，则它就是类性的。这种条件定义了两个实例在相同的情况下共有的属性（或属性集）。Person 是类性对象的示例，因为它的所有实例（人）都可以与出生（何时、对谁）相关的属性来识别。Book
    是非类性对象类型的示例，因为它包含了以不同方式识别的实例（例如教科书和自出版小说）。


    如果一个对象类型的实例不会因为消失或改变身份而停止存在，那么它就是刚性的。Person 是刚性类型的示例，而 Employee 不是刚性的。如果所有子类都是刚性的，则该划分被称为刚性的。


    种类（kind）是类性对象类型。Textbook 和 Person 是类的示例。角色（role）是类性对象类型，用于对与类型 O 的实例参与（特定类型 A）关系的种类
    K 的实例进行分类。注意，R 是 K 的非刚性子类型，因为其实例在不再与类型 O 的实例参与类型 A的关系时并没有停止存在。


    例如，Employee 是角色的示例，因为它是一个类性对象类型，用于对与 Enterprise 类型实例参与雇用关系的 Person 实例进行分类。


    ## 12.6 类层次结构合并模式


    考虑上述图 12.1 所示设计模型的简单类层次结构，显示了 Book 类的不相交划分。在这种情况下，每当只有一层（或有几层）子类型且每个类型仅有一个（或几个）额外属性时，可以通过将所有子类的属性合并到扩展版本中来重构类层次结构。


