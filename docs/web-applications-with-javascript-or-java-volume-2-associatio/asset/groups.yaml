    \ array of IdRefs\n    for (let idRef of a) {\n      this.addAuthor(idRef);\n\
    \    }\n  } else // map of IdRefs to object references\n    for (let idRef of\
    \ Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n+\
    \   In JS, a collection-valued reference property can be implemented in two ways:\n\
    1. having an array list (JS array) of object references as its value,\n2. having\
    \ a map as its value, that the values of the object's standard ID attribute are\
    \ the keys, which are mapped to internal JS object references.\n\nWe prefer using\
    \ maps for set-valued reference properties since they\nguarantee that each element\
    \ is unique, while with an array we would have to prevent\nduplicate elements.\
    \ Also, an element of a map can be easily deleted (with the help of\nthe delete\
    \ operator), while this requires more effort in the case of an array. However,\n\
    for implementing ordered (or nonunique) association ends corresponding to ordered-\n\
    collection-valued (or bag/sequence-valued) reference properties, we use JS arrays.\n\
    \n# 3.2 Make a JS Class Model\n\nOur starting point for making a JS class model\
    \ is the following OO class model:\n\n| Book | Publisher |\n| isbn[1]: String\
    \ (id) | name : String (id) |\n| title[1]: String | address : String |\n| year[1]:\
    \ Integer | |\n| publisher[0..1]: Publisher | |\n| authors[*]: Author | Author\
    \ |\n| | personid: Integer (id) |\n| | name: String |"
- md: "\n## 4.3 Implementing Unidirectional Non-Functional Associations with Plain\
    \ JS\n\nThis model contains, in addition to the single-valued reference property\
    \ Book::publisher representing the unidirectional many-to-one association Book-hasPublisher,\
    \ the multi-valued reference property Book::authors representing the unidirectional\
    \ many-to-many association Book-hasAuthor.\n\nFor deriving a JS class from the\
    \ OO class model we have to follow the same steps as in Section 2.3 and, in addition,\
    \ we have to take care of multi-valued reference properties, such as Book::authors;\
    \ for which we:\n\n- 1. create a class-level check operation, such as checkAuthor,\
    \ which is responsible for checking the corresponding referential integrity constraint\
    \ for the references to be added to the property's collection;\n- 2. create an\
    \ add operation, such as addAuthor, for adding a reference to the collection;\n\
    - 3. create a remove operation, such as removeAuthor, for removing a reference\
    \ from the collection.\n\nThis leads to the following JS class model:\n\n| Book\
    \ | Publisher |\n|---|---|\n| |get/set::isbn(string) | |get/set::name: string\
    \ (id) |\n| |get/set::title(string) | |get/set::address(string) |\n| |get/set::year(integer)\
    \ | |checkName(n: string) : ConstraintViolation |\n| |get/set::publisher(0..1]:\
    \ Publisher | |checkNameAuthor(n: string) : ConstraintViolation |\n| |get/set::authors[1]:\
    \ Author | |checkNameAidRef(n: string) : ConstraintViolation |\n| |checkISBN(isbn:\
    \ string) : ConstraintViolation | |checkAddress(address: string) : ConstraintViolation\
    \ |\n| |checkISNAidRef(isbn: string) : ConstraintViolation | |toString() : string\
    \ |\n| |checkTitle(title: string) : ConstraintViolation | |toRecord() : Object\
    \ |\n| |checkYear(year: integer) : ConstraintViolation | |Author |\n| |checkAuthor(id)\
    \ | | |\n| |checkPublisher(publisher) : ConstraintViolation | | |\n| |checkAuthor(author:\
    \ author) : ConstraintViolation | | |\n| |addAuthor(author: author) | |get/set::authorId:\
    \ number(int) (id) |\n| |removeAuthor(author: author) | |get/set::name: string\
    \ |\n| |toString() : string | |checkAuthorAid(aid: number(int)) : ConstraintViolation\
    \ |\n| |toRecord() : Object | |checkAuthorAidRef(aid: number(int)) : ConstraintViolation\
    \ |\n| | | | |checkName(aid: number(int); n: string) : ConstraintViolation |\n\
    | | | | |toString() : string |\n| | | | |toRecord() : Object |\n\n## 3.3 New Issues\n\
    \nIn dealing with a functional association, as discussed in the previous chapter,\
    \ we have to deal with the following new issues:\n\n- 1. In the model code we\
    \ have to take care of multi-valued reference properties that require implementing:\n\
    - 1. an **add** and a **remove** method, such as addAuthor and removeAuthor, as\
    \ well as a **setter** method for assigning a set of object references with the\
    \ help of the add method, possibly converting ID references to object references;\
    \ three methods may need to check *cardinality constraints*, if there are any;\n\
    - 2. a class-level *check* operation, such as checkAuthor, which has to invoke\
    \ the corresponding check `AsIdRef` method of the property’s range class for checking\
    \ the property’s *implicit integrity constraint*;\n- 3. converting a collection\
    \ of object references to a collection of ID references in the object-to-storage\
    \ function `toRecord`.\n- 2. In the **user interface** (\"view”) code we now have\
    \ to care of:\n- 1. showing information about a set of associated objects in the\
    \ property’s column of the table view of the *Retrieve/list* list all use case;\
    \ the simplest approach is showing a comma-separated list of ID references, possibly\
    \ with corresponding names; alternatively, HTML lists can be rendered in the property’s\
    \ table data cells;\n- 2. allowing to select a set of associated objects from\
    \ a list of all instances of the property’s range class in the **Create** and\
    \ **Update** cases.\n\nThe last issue, allowing to select a set of associated\
    \ objects from a list of all instances of class, can not be solved with the help\
    \ of an HTML select control because of its poor usability. Whenever the selectable\
    \ options is greater than a threshold (defined by the number of options that can\
    \ be seen on the screen without scrolling), the multiple-select element is not\
    \ usable, and an alternative **multiple-choice widget** has to be used.\n\n##\
    \ 3.4 Code the Model\n\nNotice that, for simplicity, we do not include the code\
    \ for all constraint validation checks shown in the JS class model in the code\
    \ of the example app.\n\n### 3.4.1 Summary\n\nCode each class of the JS class\
    \ model as an ES2015 class with implicit getters and setters:\n\n- 1. Code the\
    \ property checks in the form of class-level ('static') methods. Take care that\
    \ all constraints of a property specified in the JS class model are properly coded\
    \ in the property checks.\n- 2. For each single-valued property, code the specified\
    \ getter and setter such that in each setter, the corresponding property check\
    \ is invoked and the property is only set/unset, if the check does not detect\
    \ any constraint violation.\n- 3. For each multi-valued property, code add its\
    \ add and remove operations, as well as the get/set operations:\n- 1. Code the\
    \ setter so it invokes the property checks.\n- 2. Write the serialization function\
    \ `toString()` and `toRecord()`.\n- 3. Take care of deletion in the `destroy`\
    \ method.\n\nThese steps are discussed in detail in the following.\n\n### 3.4.2\
    \ Code the Add and Remove Operations\n\nFor the multi-valued property Book::authors,\
    \ we need to code the operations addAuthor and removeAuthor. Both operations accept\
    \ one parameter denoting the author by ID (integer) or by object reference. The\
    \ code of addAuthor is as follows:\n\n```javascript\naddAuthor (a) {\n  // can\
    \ be ID reference or object reference\n  const author_id = (typeof a == \"object\"\
    ) ? parseInt(a ) : a.authorId;\n  const validationResult = Book.checkAuthor (\
    \ author_id);\n  if (author_id && validationResult instanceof ConstraintViolation)\
    \ {\n    // add the author reference\n    let key = String(author_id);\n    this._authors[key]\
    \ = Author.instances[key];\n  } else {\n    throw validationResult;\n  }\n}\n\
    ```\n\nIn the removeAuthor method, the author reference is first checked, and\
    \ if no constraint violation is detected, the corresponding entry in the map is\
    \ deleted:\n\n```javascript\nremoveAuthor (a) {\n  // can be ID reference or object\
    \ reference\n  const author_id = (typeof a == \"object\") ? parseInt(a ) : a.authorId;\n\
    \  const validationResult = Book.checkAuthor ( author_id);\n  if (validationResult\
    \ instanceof ConstraintViolation) {\n    // delete the author reference\n    delete\
    \ this._authors[author_id];\n  } else {\n    throw validationResult;\n  }\n}\n\
    ```\n\nFor assigning an array of ID references, or a map of object references,\
    \ to the property Book::authors, the setter adds one by one with the help of addAuthor:\n\
    \n```javascript\nset authors (a) {\n  this._authors = {};\n  if (Array.isArray(a))\
    \ { // array of IdRefs\n    for (let idRef of a) {\n      this.addAuthor(idRef);\n\
    \    }\n  } else { // map of IdRefs to object references\n    for (let idRef of\
    \ Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n###\
    \ 3.4.3 Choose and Implement a Deletion Policy\n\nFor the reference property Book::authors,\
    \ we have to choose and implement a deletion policy in the destroy method of the\
    \ Author class. We have to choose between:\n\n- 1. deleting all books (co)-authored\
    \ by the deleted author (reflecting the logic of Existential Dependency);\n- 2.\
    \ dropping from all books (co)-authored by the deleted author the reference to\
    \ the deleted author (reflecting the logic of Existential Independence).\n\nFor\
    \ simplicity, we use the second option. This is shown in the following code of\
    \ the static Author.destroy method for all concerned book objects the author reference\
    \ book.authors[authorKey] is dropped:\n\n```javascript\nAuthor.destroy = function\
    \ (authorId) {\n  const author = Author.instances[authorId];\n  // delete all\
    \ dependent book records\n  for (let isbn of Object.keys(Book.instances)) {\n\
    \    let book = Book.instances[isbn];\n    if (book.authors[authorId]) delete\
    \ book.authors[authorId];\n  }\n}\n```\n"
