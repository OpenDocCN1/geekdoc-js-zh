    \    pl.v.books.manage.setUserInterface();\n  }\n}\n```\n\n书籍数据的初始化方法首先加载出版者表和书籍表，因为书籍管理\
    \ UI 需要显示这些数据。然后通过调用 `setUpInterface` 程序来渲染书籍管理菜单。\n\n### 2.6.2 在列出所有中显示关联对象\n\
    \n在我们的示例中，我们只有一个引用属性 `Book::publisher`，它是函数性的且可选的。为了在“列出所有书籍”用例中显示书籍可选的出版者信息，HTML\
    \ 表格中相应的单元格将填充出版者的名称（如果有的话）：\n\n"
