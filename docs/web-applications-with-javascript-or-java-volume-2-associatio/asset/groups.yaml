    \ Person {\n    @Column(nullable=false)\n    @NotNull(message=\"An employee ID\
    \ is required!\")\n    private Integer empno;\n    @Enumerated(EnumType.STRING)\n\
    \    @Column(nullable=false, length=32)\n    private EmployeeType type;\n    private\
    \ String department;\n}\n```\n\n注意用于识别员工类型 `Manager` 类型的 `type` 属性，其值由 `EmployeeType`\
    \ 枚举定义。\n\n### 14.3.3.2 连接表层次结构的数据库模式\n\n由于使用了注解\n\n```java\n@Inheritance(strategy=InheritanceType.JOINED)\n\
    ```\n\n继承层次结构中的每个类都会创建一个数据库表。用于 JPA 创建 `persons`、`authors` 和 `employees` 表的对应\
