    (category="Biography") IFF ABOUT IS NULL))

    ```


    **Figure 12.9:** An SQL model with a single table.


    It is a common approach to add a special *discriminator column* for representing
    the category of each row corresponding to the subclass instantiated by the object.
    A column would normally be string-valued, but constrained to one of the names
    of subclasses. The DBMS supports enumerations, it could be enumeration-valued.
    We use the same *category* name for the discriminator column, in the case of our
    class hierarchy example, has a frozen value since the textbook-biography segmentation
    is rigid.


    Based on the category of book, we have to enforce that if and only if it is "TextBook",
    its subjectArea has a value, and if and only if it is "Biography", attribute about
    has a value. This implied constraint is expressed in the invariant attached to
    the Book table in the class diagram above, where the logical operator ''IFF''
    represents the logical equivalence operator ''if and only if''. It needs to be
    implemented in the database, e.g., with an SQL CHECK clause or with SQL triggers.


    When the given segmentation is disjoint, a single-valued enumeration category
    is used for representing the information to which subclass instance belongs. Otherwise,
    if it is non-disjoint, a multi-valued enumeration category is used for representing
    the information to which subclass instance belongs. Such an attribute can be implemented
    in SQL by defining a string-valued column for representing a set of enumeration
    codes or labels as corresponding concatenations.


    Consider the class hierarchy in Figure 12.8 above. With only additional attributes
    defined in the subclasses Employee, Manager and Author, this class hierarchy can
    be mapped with the STI approach, as shown in the SQL table Figure 12.10.


    | people |

