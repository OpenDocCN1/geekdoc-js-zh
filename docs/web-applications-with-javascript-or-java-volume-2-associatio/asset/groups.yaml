  mdcn: "\n\n## 13.3.4.2 加载根类 Person 的实例\n\n当我们从按照 TCI 方法组织的持久化数据存储中检索类层次结构中的根类（在我们的示例中为\
    \ Person）的实例时，我们不仅需要从代表根类的表（people）中检索其直接实例，还需要从代表其所有子类的所有表（employees 和 authors）中检索所有间接实例，如下所示：\n\
    \n```javascript\nPerson.retrieve = function () {\n  var people={}, employees={},\
    \ authors={};\n  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"\
    {}\";\n  if (!localStorage[\"employees\"]) localStorage[\"employees\"] = \"{}\"\
    ;\n  if (!localStorage[\"people\"]) localStorage[\"people\"] = \"{}\";\n  try\
    \ {\n    people = JSON.parse(localStorage[\"people\"]);\n    employees = JSON.parse(localStorage[\"\
    employees\"]);\n    authors = JSON.parse(localStorage[\"authors\"]);\n  } catch\
    \ (e) {\n    console.log(\"Error when retrieving from LocalStorage\\n\" + e);\n\
    \  }\n  for (let key of Object.keys(authors)) {\n    try { // 将记录转换为（类型化的）对象\n\
    \      Author.instances[key] = new Author(authors[key]);\n      // 创建父类扩展\n  \
    \    Person.instances[key] = Author.instances[key];\n    } catch (e) {\n     \
    \ console.log(`${e.constructor.name} while deserializing` + `author ${key}: ${e.message}`);\n\
    \    }\n  }\n};\n```\n\nauthors 表中的每条记录都被检索并转换为 Author 对象，并将其引用复制到 Person 中。同样，employees\
    \ 表的记录也以这种方式处理，而 people 表的记录仅被检索并转换为 Person 对象：\n\n```javascript\nPerson.retrieveAll\
    \ = function () {\n  ...\n  for (let key of Object.keys(employees)) {\n  }\n \
    \ for (let key of Object.keys(people)) {\n    try // 将记录转换为（类型化的）对象\n      Person.instances[key]\
    \ = new Person(people[key]);\n    } catch (e) {\n      console.log(`${e.constructor.name}\
    \ while deserializing ` +\n        `${key}: ${e.message}`);\n    }\n  }\n}\n```\n\
    \n## 13.3.4.3 在保存子表时保存超表\n\n由于应用程序在运行期间数据保存在主内存中（只要浏览器网页保持打开），因此当应用程序退出时（例如通过关闭浏览器标签页），必须将数据保存到持久化存储中。在\
    \ pl.v.employees.manage.exit 和 pl.v.authors.manage.exit 将 Employee 和 Author 实例保存到持久化存储时，我们也保存\
    \ Person 的直接实例（作为 people 表的记录）。这是必要的，因为 Employee 或 Author 实例的变化可能意味着 Person.instances\
    \ 的变化。\n\n例如，对于 Employee 数据管理，我们在 v/employees.js 中定义了：\n\n```javascript\npl.v.employees.manage\
    \ = {\n  exit: function () {\n    Employee.saveAll();\n    Person.saveAll();\n\
    \  },\n  ..\n```\n\n## 14 使用 Java EE 进行子类型\n\n在本章中，我们将基于我们运行示例（公共图书馆应用）的信息模型片段，解释两个案例研究。在第一个案例研究（图\
    \ 12.1）中，我们考虑了根类 Book 具有外键依赖的单级类层次结构，这是一个不完全的不相交分段。我们使用单表继承（Single Table Inheritance）方法将此类层次结构映射到单个数据库表。\n\
    \n在第二个案例研究中，我们考虑了由 Person 角色 Employee、Manager 和 Author 组成的多级类层次结构，如图 12.8 所示。我们使用连接继承（Joined\
    \ Table Inheritance）方法将此类层次结构映射到一组通过外键依赖相互关联的数据库表。\n\n在这两种情况下，我们展示了：\n\n- 1. 如何推导出\
    \ Java Entity 类模型，\n2. 如何以 Java Entity 类的形式编写 Java Entity 类模型，\n3. 如何基于模型代码编写视图和控制器代码。\n\
    \n## 14.1 Java 中的子类型\n\nJava 通过其 `extends` 关键字为子类型提供了内置支持，但它不支持多继承。考虑以下信息设计模型：\n\
    \n| Person |\n| :--- |\n| firstName : String |\n| lastName : String |\n| Student\
    \ |\n| studNo : Integer |\n\n首先，我们定义父类 Person。然后，我们通过 `extends` 关键字定义子类 Student\
    \ 及其与 Person 的子类型关系：\n\n```java\npublic class Person {\n    private String firstName;\n\
    \    private String lastName;\n    ..\n}\npublic class Student extends Person\
    \ {\n    private int studentNo;\npublic Student(String first, String last, int\
    \ studNo) {\n    super(firstName, lastName);\n    this.setStudNo(studNo);\n}\n\
    ```\n\n## 14.2 案例研究 1：使用单表继承实现类层次结构\n\n注意在 Student 类中，我们定义了一个包含创建 Student 实例所需所有参数的构造函数。在这个子类构造函数中，我们使用\
    \ `super` 调用父类 Person 的构造函数。\n\n14.2 案例研究 1：使用单表继承实现类层次结构\n\n在示例中，我们实现了图 12.1\
    \ 所示的 Book 层次结构。Java Entity 类是此推导出的。\n\n### 14.2.1 构建 Java Entity 模型\n\n回想我们通过以下方式从\
    \ OO 模型获取 Java 类：\n1. 将所有成员设为私有（private），\n2. 使用 Java 类，\n3. 添加公共的 getter 和 setter，\n\
    4. 添加 toString 函数，\n5. 添加创建、更新、删除的静态方法。\n\n### 14.2.2 新问题\n\n我们必须处理许多问题：\n\n-\
    \ 1. 编写模型中使用的枚举类型（BookCategoryEL）。\n2. 在 UI 代码中，我们必须处理：\n   - 1. 为数据库添加特殊列。\n\
    \   - 2. 在 UI 代码中，我们必须处理：\n     - 1. 仅分段字段。\n     - 2. 使用特殊的控件进行选择。\n     - 3.\
    \ 在满足特定条件时显示字段。\n\n### 14.2.3 编写 Java Entity 模型的类\n\nJava Entity 类模型可以直接为我们的 Java\
    \ 后端类编写代码。\n\n"
