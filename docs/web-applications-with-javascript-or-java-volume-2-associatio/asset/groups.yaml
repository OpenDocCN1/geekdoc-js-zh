    | :--- | :--- |

    | name : String (id) | isbn : String (id) |

    | address : String | title : String |

    | 0.1 * | year : Integer |


    Figure 1.6: The Publisher-Book information design model with a non-functional
    (multi-valued) reference property representing a unidirectional non-functional
    association.


    We may also have to deal with a non-functional (multi-valued) reference property
    representing a unidirectional non-functional association. For instance, the unidirectional
    many-to-many association between Book and Author shown in Figure 1.7 below, models
    a multi-valued (non-functional) reference property authors.


    | Publisher | |

    | :--- | :--- |

    | Book | name: String (id) |

    | isbn : String (id) | address: String |

    | title : String | |

    | year : Integer | |

    | Author | personId: Integer (id) |

    | | name: String |


    Figure 1.7: The Publisher-Book-Author information design model with two unidirectional
    associations.


    ## 1.7 Eliminating Unidirectional Associations


    Since classical OO programming languages do not support associations as first
    class citizens, but only classes and reference properties representing unidirectional
    associations, we have to eliminate all explicit associations from general information
    design models for obtaining OO class.


    ### 1.7.1 The Basic Elimination Procedure


    The starting point of our restricted association elimination procedure is an information
    design model with various kinds of unidirectional associations, such as the model
    shown in Figure 1.6 above. If the model still contains any non-directional associations,
    we have to turn them into directional ones by making a decision on the ownership
    of their ends, as discussed in Section 1.5.


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source class having


    - 1. the same name as the association end, if there is any, otherwise it is set
    to the name of the target class (possibly pluralized), if the reference property
    is multi-valued);

    - 2. the target class as its range;

    - 3. the multiplicity as the association end,

    - 4. a uniqueness constraint if the unidirectional association is inverse functional.


    This replacement procedure is illustrated for the case of a unidirectional one-to-one
    association in Figure 1.8, where the uniqueness constraint of the reference property
    is expressed by the {key} modifier.


    ## 12.1 Reference Properties and Unidirectional Associations


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | 0.1 | 1 |


    | Committee | ClubMember |

    | name : String | chairedCommittee[0..1] : Committee {key} |


    Figure 1.8: Turning a functional association end into a reference property.


    For the case of a unidirectional one-to-many association, Figure 1.9 provides
    an illustration of the association elimination procedure. Here, the non-functional
    association end at the target class Point is turned into a corresponding reference
    property with name points obtained as the pluralized form of the target class
    name.


