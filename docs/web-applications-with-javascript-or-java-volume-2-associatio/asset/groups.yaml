    ## Glossary


    ### CRUD

    CRUD is an acronym for *Create, Read, Update, Delete*, which denote the four basic
    management operations performed by any software application.


    ### Cascading Style Sheets

    CSS is used for defining the presentation style of web pages by telling the browser
    how to render their content, fonts, backgrounds, and animations. Normally these
    settings are made in a separate CSS file associated with a special link in the
    HTML head.


    ### Document Object Model

    The DOM is an abstract API for retrieving and modifying nodes and HTML elements.
    All programming languages have DOM bindings that realize the DOM.


    ### Domain Name System

    The DNS translates user-friendly domain names to IP addresses that allow to locate
    a host on the Internet.


    ### ECMAScript

    A standard for JavaScript defined by the industry organization Ecma International.


    ### Extensible Markup Language

    XML allows marking up the structure of all kinds of data files and messages in
    a machine-readable way. XML may also be human-readable, self-explaining. XML is
    based on Unicode. XML provides a syntax for expressing structured information
    in the form of an XML document with *elements* and *attributes*. The specific
    elements and attributes used in an XML document can come from any vocabulary or
    user-defined formats.


    ### Hypertext Markup Language

    HTML allows marking up (or describing) the structure of a human-readable web interface.
    The XML-based version of HTML, which is called "XHTML", provides a simpler and
    cleaner syntax compared to traditional HTML.


    ### Hypertext Transfer Protocol

    HTTP is a stateless request/response protocol based on TCP/IP technologies for
    communication between clients and web servers. The main purpose of HTTP has been
    to allow fetching web documents identified by URLs. More recently, HTTP is increasingly
    used for providing web APIs and web services.


    ### IANA

    IANA stands for Internet Assigned Numbers, which is a subsidiary of ICANN responsible
    for names and numbers.


    ### ICANN

    ICANN stands for Internet Corporation for Assigned Names and Numbers, which is
    an international nonprofit organization that maintains the domain name system.


    ### IndexedDB

    A JavaScript API for indexed data storage managed by browsers. Indexing allows
    high-performance searching. Like many SQL DBMS, IndexedDB supports database transactions.
    A set of best practices that help adapt products to any target language and culture.
    It deals with multiple character sets, units of measure, keyboard layouts, time
    and date formats, and text directions.


    ### I18N

    JSON stands for JavaScript Object Notation, which is a data-interchange format
    following the JavaScript syntax for object literals. Many programming languages
    support JSON as a lightweight alternative to XML.


    ### MathML

    An open standard for representing mathematical expressions, either in data interchange
    or for rendering them within webpages.


    ### MIME

    A MIME type (also called "media type" or "content type") is a keyword string sent
    along with a file indicating its content type. For example, a sound file might
    be labeled audio/ogg, or an image file image/png.


    ### Model-View-Controller

    MVC is a general architecture metaphor emphasizing the principle of separation
    of concerns, mainly between the model and the view, and considering the model
    as the most fundamental part of an app. In MVC frameworks, "M", "V" and "C" are
    defined in different ways. Often the term "model" refers to the app''s data sources,
    while the "view" denotes the app''s code for the user interface, which is based
    on CSS-styled HTML forms and DOM events, and the "controller" typically denotes
    the (glue) code that is in charge of mediating between the view and the model.


    ### Object Constraint Language

    The OCL is a formal logic language for expressing integrity constraints, mainly
    in UML class models. It also allows defining derivation expressions for defining
    derived properties, and defining preconditions and postconditions for operations
    in a class model.


    ### Object-Oriented Programming

    OOP is a programming paradigm based on the concepts of objects and classes instantiated
    by objects. Classes are like blueprints for objects: they define their properties
    and the methods/functions that can be applied to them. A higher-level characteristic
    of OOP is inheritance in class hierarchies: a subclass inherits the features (properties,
    methods and constraints) of its superclass.


    ### Web Ontology Language

    OWL is formal logic language for knowledge representation on the Web. It allows
    defining vocabularies (mainly classes with properties) and supports expressing
    many types of integrity constraints on them. OWL is the basis for performing automated
    inferences, such as checking the consistency of an OWL vocabulary. Vocabularies,
    or data models, defined in the form of UML class models can be converted to OWL
    and then checked for consistency.


    ### Portable Network Graphics

    PNG is an open (non-proprietary) graphics file format that supports lossless data
    compression.


    ### Polyfill

    A polyfill is a piece of JavaScript code for emulating a standard JavaScript method
    in a browser.


    ### Resource Description Framework

    RDF is a W3C language for representing machine-readable information on the Web.


    ### Standard Generalized Markup

    SGML is an ISO specification for defining markup languages. HTML4 has been defined
    with SGML. XML is a simplified successor of SGML.


    ### Scalable Vector Graphics

    SVG is a 2D image format based on XML that can be styled with CSS and make interactive.
    HTML5 allows direct embedding of SVG content in an HTML document.


    ### Slot

    A slot is a name-value pair. In an object it is normally a property-value pair.
    In a JavaScript object, a slot may also consist of a method name and method body.


    ### Unicode

    A platform-independent character set that includes almost all characters from
    most of the world''s script languages. Each character is assigned a unique integer
    code in the range between 0 and 1,114,111. For example, the Greek letter π has
    the code 960. Unicode includes legacy character sets like ASCII and ISO-8859-1
    (Latin-1) as subsets. XML is based on Unicode. Consequently, the encoding of Unicode
    characters in an XML document is UTF-8, which uses only a single byte for ASCII
    characters, but three bytes for less common characters.


    ### Uniform Resource Identifier

    A URI is either a Uniform Resource Locator (URL) or a Uniform Resource Name (URN).


    ### Uniform Resource Locator

    A URL is a resource name that contains a web address for locating the resource
    on the Web.


    ### User Agent

    A user agent is a front-end web client program such as a web browser.


    ###### Web Hypertext Application Technology Working Group

    The WHATWG was established in 2004 by former employees of Apple, Mozilla, and
    Opera who have been unhappy with the slow progress of web technology standardization
