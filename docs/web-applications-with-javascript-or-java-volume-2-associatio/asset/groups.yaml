- md: "\n## 13 Subtyping with Plain JS\n\n### 13.2.3.2 Code the Enumeration Type BookCategoryEL\n\
    \nThe enumeration type BookCategoryEL is coded with the help of our library meta-class\
    \ Enumeration at the beginning of the Book.js model class file in the following\
    \ way:\n\n```javascript\nBookCategoryEL = new Enumeration([ \"Textbook\", \"Biography\"\
    \ ]);\n```\n\n### 13.2.3.3 Code the Model Class Book\n\nWe code the model class\
    \ Book in the form of an ES2015 class definition where the category attribute\
    \ as well as the segment attributes subjectArea and about are optional, with getters,\
    \ setters and static check functions for all properties:\n\n```javascript\nclass\
    \ Book {\n  constructor(isbn, title, year, category, subjectArea, about) {\n \
    \   this.isbn = isbn;\n    this.title = title;\n    this.year = year;\n    //\
    \ optional properties\n    if (category) this.category = category;\n    if (subjectArea)\
    \ this.subjectArea = subjectArea;\n    if (about) this.about = about;\n  }\n \
    \ get isbn() { . . }\n  static checkIsbn(isbn) { . . }\n  static checkIsbnAsId(isbn)\
    \ { . . }\n  set isbn(isbn) { . . }\n  get title() { . . }\n  static checkTitle(t)\
    \ { . . }\n  set title(t) { . . }\n  get year() { . . }\n  static checkYear(y)\
    \ { . . }\n  set year(y) { . . }\n  get category() { . . }\n  static checkCategory(c)\
    \ { . . }\n  set category(c) { . . }\n  get subjectArea() { . . }\n  static checkSubjectArea(sA,\
    \ cat) { . . }\n  set subjectArea(s) { . . }\n  get about() { . . }\n  static\
    \ checkAbout(a, cat) {. . . }\n  set about(a) { . . }\n}\n```\n\nNote that the\
    \ constructor function is defined with a single record parameter using the ES2015\
    \ feature of function parameter destructuring.\nWe code the checkCategory and\
    \ setCategory methods for the category attribute in the following way:\n\n```javascript\n\
    static checkCategory(c) {\n  if (c === undefined || c === \"\") {\n    return\
    \ new NoConstraintViolation(); // category is optional\n  } else if (!util.isIntegerOrIntegerString(c)\
    \ || parseInt(c) < 1 ||\n    parseInt(c) > BookCategory.MAX) {\n    return new\
    \ RangeConstraintViolation(\n      \"Invalid value for category: \" + c);\n  }\
    \ else {\n    return new NoConstraintViolation();\n  }\n}\nset category(c) {\n\
    \  var validationResult = null;\n  if (this.category) { // already set/assigned\n\
    \    validationResult = new FrozenConstraintViolation(\n      \"The category cannot\
    \ be changed!\");\n  } else {\n    validationResult = Book.checkCategory(c);\n\
    \  }\n  if (validationResult instanceof NoConstraintViolation) {\n    this._category\
    \ = parseInt(c);\n  } else {\n    throw validationResult;\n  }\n}\n```\n\nWhile\
    \ the getters for segment properties (in this example: subjectArea and about)\
    \ follow the standard pattern, their checks and setters have to make sure that\
    \ the property applies to the category of the instance being checked. This is\
    \ achieved by checking a combination of a property value and a category, as in\
    \ the following example:\n\n```javascript\nstatic checkSubjectArea(SA, c) {\n\
    \  if (c === BookCategoryEL.TEXTBOOK && !sA) {\n    return new MandatoryValueConstraintViolation(\n\
    \      \"A subject area must be provided for a textbook!\");\n  } else if (c !=\
    \ BookCategoryEL.TEXTBOOK && !sA) {\n    return new ConstraintViolation(\"A subject\
    \ area must not \" +\n      \"be provided if the book is not a textbook!\");\n\
    \  } else if (SA && (typeof(SA) != \"String\" || SA.trim() === \"\")) {\n    return\
    \ new RangeConstraintViolation(\n      \"The subject area must be a non-empty\
    \ string!\");\n  } else {\n    return new ConstraintViolation();\n  }\n}\n```\n\
    \nIn the serialization function toString, we serialize the category attribute\
    \ and the segment properties in a switch statement:\n\n```javascript\ntoString()\
    \ {\n  var bookStr = \"Book{ ISBN:\" + this.isbn + \", title:\" +\n    this.title\
    \ + \", year:\" + this.year;\n  switch (this.category) {\n    case BookCategoryEL.TEXTBOOK:\n\
    \      bookStr += \", textbook subject area:\" + this.subjectArea;\n      break;\n\
    \    case BookCategoryEL.BIOGRAPHY:\n      bookStr += \", biography about:\" +\
    \ this.about;\n      break;\n  }\n  return bookStr + \"}\";\n}\n```\n\nIn the\
    \ update method of a model class, we only set a property if it is updated, that\
    \ is, if there is a corresponding argument slot with a value that is different\
    \ from the old property value. In the special case of a category attribute with\
    \ a Frozen Value Constraint, we need to make sure it can only be updated, along\
    \ with an accompanying set of segment properties, if it has not yet been assigned.\
    \ Then, in the book update method, we perform the special test if book.category\
    \ === undefined for handling the special case of an initial assignment, while\
    \ we handle updates of the segment properties subjectArea in a more standard way:\n\
    \n```javascript\nBook.update = function ({isbn, title, year,\n  category, subjectArea,\
    \ about}) {\n  const book = Book.instances[isbn],\n  objectBeforeUpdate = util.clone(book);\n\
    \  var noConstraintViolation=true, updatedProperties=[];\n  try {\n    if (category\
    \ && book.category !== category) {\n      book.category = category;\n      updatedProperties.push(\"\
    category\");\n    } else if (category === undefined && \"category\" in book) {\n\
    \      throw new FrozenConstraintViolation(\n        \"The book cannot be unset!\"\
    );\n    }\n    if (subjectArea && book.subjectArea !== subjectArea) {\n      book.subjectArea\
    \ = subjectArea;\n      updatedProperties.push(\"subjectArea\");\n    }\n    if\
    \ (about && book.about !== about) {\n      book.about = about;\n      updatedProperties.push(\"\
    about\");\n    }\n  } catch (e) {\n  }\n};\n```\n\n## 13.2 Case Study 1: Eliminating\
    \ a Class Hierarchy\n\n### 13.2.4 Write the View and Controller\n\nThe app's user\
    \ interface (UI) consists of a start page that allows navigating to data management\
    \ pages (in our example, books.html). Such a data management page contains sections:\
    \ manage books, list and retrieve all books, create book, update book and delete\
    \ book, such that only one of them is displayed at any time (by setting the CSS\
    \ property display:none for others).\n\n### 13.2.4.1 Summary\n\nWe take care of\
    \ handling the category attribute and the segment properties subjectArea and about\
    \ in the \"Retrieve and list all books\" use case as well as in the \"Create book\"\
    \ and \"Update book\" use cases by:\n\n- Adding a segment information column (with\
    \ heading \"Category\") to the display table of the \"Retrieve and list all books\"\
    \ use case in books.html.\n- Adding a \"Category\" selection field, and input\
    \ fields for all segment properties, in the forms of the \"Create book\" and \"\
    Update book\" use cases in books.html. The fields for segment properties are only\
    \ displayed, when a corresponding book category has been selected.\n\n### 13.2.4.2\
    \ Add a Segment Information Column in Retrieve/List All\n\nWe add a \"Special\"\
    \ category to the display table of the \"List all books\" use case in books.html:\n\
    \n```html\n<table id=\"books\">\n  <head>\n    <tr>\n      <th>ISBN</th>\n   \
    \   <th>Title</th>\n      <th>Year</th>\n      <th>Category</th>\n    </tr>\n\
    \  </head>\n  <tbody></tbody>\n</table>\n```\n\nA book without a special category\
    \ will have an empty table cell in this column, for all other books their category\
    \ will be shown in this column, with category-specific information. This requires\
    \ a corresponding switch statement in pl.v.retrieveAndListAll.setupInterface in\
    \ the view/books.js file:\n\n```javascript\nif (book.category) {\n  switch (book.category)\
    \ {\n    case BookCategoryEL.TEXTBOOK:\n      row.insertCell(-1).textContent =\
    \ book.subjectArea + \" textbook\";\n      break;\n    case BookCategoryEL.BIOGRAPHY:\n\
    \      row.insertCell(-1).textContent = \"Biography about \" + book.about;\n \
    \     break;\n  }\n}\n```\n\n### 13.2.4.3 Add a Category Selection Field in Create\
    \ and Update\n\nIn both cases, we need to allow selecting a category of book ('textbook'\
    \ or 'biography') with the help of a selection field, as shown in the following\
    \ HTML fragment:\n\n```html\n<div class=\"field\">\n  <label>Category: <select\
    \ name=\"category\"></select></label>\n</div>\n<div class=\"field\">\n  <label>Subject\
    \ area: <input type=\"text\" name=\"subjectArea\" /></label>\n</div>\n<div class=\"\
    field\">\n  <label>About: <input type=\"text\" name=\"about\" /></label>\n</div>\n\
    ```\n\nNote that we have added \"Textbook\" and \"Biography\" as additional values\
    \ of the class attribute of the segment field container elements. This supports\
    \ the rendering and un-rendering of \"Textbook\" and \"Biography\" fields, depending\
    \ on the value of the category attribute.\n\nIn the handleCategorySelectEventHandler,\
    \ segment property form fields are only displayed, with pl.v.app.displaySegmentFields,\
    \ when a corresponding book category has been selected.\n\n```javascript\npl.v.books.handleCategorySelectChangeEvent\
    \ = function (e) {\n  var formEl = e.currentTarget.form,\n  categoryIndexStr =\
    \ formEl.category.value;\n  if (categoryIndexStr) {\n    pl.v.app.displaySegmentFields(formEl,\
    \ BookCategoryEL.labels,\n    parseInt(categoryIndexStr) + 1);\n  } else {\n \
    \   pl.v.app.undisplayAllSegmentFields(formEl, BookCategoryEL.labels);\n  }\n\
    }\n```\n\nRecall that the category selection list contains a no-selection option\
    \ \"\" with the empty string as its return value, and a list of options formed\
    \ by the labels of BookCategoryEL.labels such that their value is the corresponding\
    \ array index (starting with 0) as a string. Consequently, the variable categoryIndexStr\
    \ has either the value \"\" (empty string) or one of \"1\", \"2\", etc.\n"
  mdcn: "\n\n## 13 使用纯 JS 实现子类型化\n\n### 13.2.3.2 编写枚举类型 BookCategoryEL\n\n枚举类型 `BookCategoryEL`\
    \ 在 `Book.js` 模型类文件的开头，通过我们的库元类 `Enumeration` 按照以下方式进行编码：\n\n```javascript\nBookCategoryEL\
    \ = new Enumeration([ \"Textbook\", \"Biography\" ]);\n```\n\n### 13.2.3.3 编写模型类\
    \ Book\n\n我们以 ES2015 类定义的形式编写了模型类 `Book`，其中 `category` 属性以及分段属性 `subjectArea`\
    \ 和 `about` 是可选的，并为所有属性提供了 getter、setter 和静态检查函数：\n\n```javascript\nclass Book\
    \ {\n  constructor(isbn, title, year, category, subjectArea, about) {\n    this.isbn\
    \ = isbn;\n    this.title = title;\n    this.year = year;\n    // 可选属性\n    if\
    \ (category) this.category = category;\n    if (subjectArea) this.subjectArea\
    \ = subjectArea;\n    if (about) this.about = about;\n  }\n  get isbn() { . .\
    \ }\n  static checkIsbn(isbn) { . . }\n  static checkIsbnAsId(isbn) { . . }\n\
    \  set isbn(isbn) { . . }\n  get title() { . . }\n  static checkTitle(t) { . .\
    \ }\n  set title(t) { . . }\n  get year() { . . }\n  static checkYear(y) { . .\
    \ }\n  set year(y) { . . }\n  get category() { . . }\n  static checkCategory(c)\
    \ { . . }\n  set category(c) { . . }\n  get subjectArea() { . . }\n  static checkSubjectArea(sA,\
    \ cat) { . . }\n  set subjectArea(s) { . . }\n  get about() { . . }\n  static\
    \ checkAbout(a, cat) {. . . }\n  set about(a) { . . }\n}\n```\n\n注意，构造函数使用 ES2015\
    \ 的函数参数解构功能定义了一个单一记录参数。\n我们按照以下方式为 `category` 属性编写了 `checkCategory` 和 `setCategory`\
    \ 方法：\n\n```javascript\nstatic checkCategory(c) {\n  if (c === undefined || c\
    \ === \"\") {\n    return new NoConstraintViolation(); // category 是可选的\n  } else\
    \ if (!util.isIntegerOrIntegerString(c) || parseInt(c) < 1 ||\n    parseInt(c)\
    \ > BookCategory.MAX) {\n    return new RangeConstraintViolation(\n      \"Invalid\
    \ value for category: \" + c);\n  } else {\n    return new NoConstraintViolation();\n\
    \  }\n}\nset category(c) {\n  var validationResult = null;\n  if (this.category)\
    \ { // 已设置/赋值\n    validationResult = new FrozenConstraintViolation(\n      \"\
    The category cannot be changed!\");\n  } else {\n    validationResult = Book.checkCategory(c);\n\
    \  }\n  if (validationResult instanceof NoConstraintViolation) {\n    this._category\
    \ = parseInt(c);\n  } else {\n    throw validationResult;\n  }\n}\n```\n\n虽然分段属性（在本例中为`subjectArea`\
    \ 和 `about`）的 getter 遵循标准模式，但它们的检查和 setter 必须确保该属性适用于正在检查的实例的类别。这是通过检查属性值和类别的组合来实现的，如下例：\n\
    \n```javascript\nstatic checkSubjectArea(SA, c) {\n  if (c === BookCategoryEL.TEXTBOOK\
    \ && !sA) {\n    return new MandatoryValueConstraintViolation(\n      \"A subject\
    \ area must be provided for a textbook!\");\n  } else if (c != BookCategoryEL.TEXTBOOK\
    \ && !sA) {\n    return new ConstraintViolation(\"A subject area must not \" +\n\
    \      \"be provided if the book is not a textbook!\");\n  } else if (SA && (typeof(SA)\
    \ != \"String\" || SA.trim() === \"\")) {\n    return new RangeConstraintViolation(\n\
    \      \"The subject area must be a non-empty string!\");\n  } else {\n    return\
    \ new ConstraintViolation();\n  }\n}\n```\n\n在序列化函数 `toString` 中，我们在 `switch`\
    \ 语句中序列化 `category` 属性和分段属性：\n\n```javascript\ntoString() {\n  var bookStr = \"\
    Book{ ISBN:\" + this.isbn + \", title:\" +\n    this.title + \", year:\" + this.year;\n\
    \  switch (this.category) {\n    case BookCategoryEL.TEXTBOOK:\n      bookStr\
    \ += \", textbook subject area:\" + this.subjectArea;\n      break;\n    case\
    \ BookCategoryEL.BIOGRAPHY:\n      bookStr += \", biography about:\" + this.about;\n\
    \      break;\n  }\n  return bookStr + \"}\";\n}\n```\n\n在模型类的 `update` 方法中，我们只在属性被更新时才进行设置，即存在对应的参数槽且其值与旧属性值不同。对于带有冻结值约束（Frozen\
    \ Value Constraint）的 `category` 属性的特殊情况，我们需要确保只有在尚未赋值的情况下才能连同相应的一组分段属性进行更新。然后，在书籍更新方法中，我们执行\
    \ `book.category === undefined` 的特殊测试以处理初始赋值的特殊情况，而我们以更标准的方式处理分段属性 `subjectArea`\
    \ 的更新：\n\n```javascript\nBook.update = function ({isbn, title, year,\n  category,\
    \ subjectArea, about}) {\n  const book = Book.instances[isbn],\n  objectBeforeUpdate\
    \ = util.clone(book);\n  var noConstraintViolation=true, updatedProperties=[];\n\
    \  try {\n    if (category && book.category !== category) {\n      book.category\
    \ = category;\n      updatedProperties.push(\"category\");\n    } else if (category\
    \ === undefined && \"category\" in book) {\n      throw new FrozenConstraintViolation(\n\
    \        \"The book cannot be unset!\");\n    }\n    if (subjectArea && book.subjectArea\
    \ !== subjectArea) {\n      book.subjectArea = subjectArea;\n      updatedProperties.push(\"\
    subjectArea\");\n    }\n    if (about && book.about !== about) {\n      book.about\
    \ = about;\n      updatedProperties.push(\"about\");\n    }\n  } catch (e) {\n\
    \  }\n};\n```\n\n## 13.2 案例研究 1：消除类层次结构\n\n### 13.2.4 编写视图和控制器\n\n应用程序的用户界面（UI）包含一个起始页面，允许导航到数据管理页面（在示例中为\
    \ `books.html`）。此类数据管理页面包含多个部分：管理书籍、列出并检索所有书籍、创建书籍、更新书籍和删除书籍，使得任何时间只显示其中一个（通过对其他部分设置\
    \ CSS 属性 `display:none`）。\n\n### 13.2.4.1 总结\n\n我们在“检索并列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中处理\
    \ `category` 属性以及分段属性 `subjectArea` 和 `about`，方法如下：\n\n- 在 `books.html` 的“检索并列出所有书籍”用例的显示表中添加一个分段信息列（标题为“Category”）。\n\
    - 在 `books.html` 的“创建书籍”和“更新书籍”用例的表单中添加一个“Category”选择字段以及所有分段属性的输入字段。分段属性字段仅在选择了相应的书籍类别时才会显示。\n\
    \n### 13.2.4.2 在“检索/列出所有”中添加分段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加了一个“Special”类别：\n\
    \n```html\n<table id=\"books\">\n  <head>\n    <tr>\n      <th>ISBN</th>\n   \
    \   <th>Title</th>\n      <th>Year</th>\n      <th>Category</th>\n    </tr>\n\
    \  </head>\n  <tbody></tbody>\n</table>\n```\n\n没有特殊类别的书籍在该列将为空单元格，而对于其他书籍，将显示其类别。这需要在\
    \ `view/books.js` 的 `retrieveAndListAll` 中对应的 `switch` 语句：\n\n```javascript\n\
    if (book.category) {\n  switch (book.category) {\n    case BookCategoryEL.TEXTBOOK:\n\
    \      row.insertCell(-1).textContent = book.subjectArea + \" textbook\";\n  \
    \    break;\n    case BookCategoryEL.BIOGRAPHY:\n      row.insertCell(-1).textContent\
    \ = \"Biography about \" + book.about;\n      break;\n  }\n}\n```\n\n### 13.2.4.3\
    \ 在创建和更新中添加类别选择字段\n\n在两种情况下，我们都需要通过选择字段允许选择书籍类别（'textbook' 或 'biography'），如下 HTML\
    \ 片段所示：\n\n```html\n<div class=\"field\">\n  <label>Category: <select name=\"\
    category\"></select></label>\n</div>\n<div class=\"field\">\n  <label>Subject\
    \ area: <input type=\"text\" name=\"subjectArea\"/></label>\n</div>\n<div class=\"\
    field\">\n  <label>About: <input type=\"text\" name=\"about\"/></label>\n</div>\n\
    ```\n\n注意，我们在分段字段容器元素的 `class` 属性中添加了“Textbook”和“Biography”作为额外值。这根据 `category`\
    \ 属性的值支持“Textbook”和“Biography”字段的渲染和取消渲染。\n\n在 `handleCategorySelectEventHandler`\
    \ 中，当选择了相应的书籍类别时，通过 `pl.v.app.displaySegmentFields` 显示分段属性表单。\n\n```javascript\n\
    pl.v.books.handleCategorySelectChangeEvent = function (e) {\n  var formEl = e.currentTarget.form,\n\
    \  categoryIndexStr = formEl.category.value;\n  if (categoryIndexStr) {\n    pl.v.app.displaySegmentFields(formEl,\
    \ BookCategoryEL.labels,\n    parseInt(categoryIndexStr) + 1);\n  } else {\n \
    \   pl.v.app.undisplayAllSegmentFields(formEl, BookCategoryEL.labels);\n  }\n\
    }\n```\n\n"
