    \ aggregation varies by application area and modeler”.\n\nThe *multiplicity* of\
    \ an aggregation’s association end at the whole side may be any number (*) because\
    \ a part may belong to, or *shared* among, any number of wholes.\n\n### 10.1.2\
    \ Composition\n\nIt's amazing how much confusion exists about the distinction\
    \ between the part-whole association concepts aggregation and composition. The\
    \ main problem is the widespread misunderstanding (even among expert software\
    \ developers and among authors of UML) that the concept of composition implies\
    \ a life-cycle dependency between the whole and its parts that the parts cannot\
