    <rdf:domain rdf:resource="#Student"/>

    <rdf:range rdf:resource="#xsd:string"/>

    <rdf:type rdf:resource="owl:FunctionalProperty"/>

    </DatatypeProperty>

    ```


    为了更好的易用性，OWL 允许在类定义中定义类的属性，并以函数属性作为默认情况。


    ## 12.7.4 使用 SQL 数据库表表示类层次结构


    标准 DBMS 在表的行中存储信息（对象），这些行在关系型数据库系统中被构想为集合关系。关系型数据库语言 SQL 用于定义、填充、更新和查询此类数据库。但也有更简单的数据存储技术允许以行的形式存储数据，但它们不支持
    SQL。特别是键值存储系统（例如 JavaScript 的 Local Storage API），允许将 JS 实体的序列化内容（实体记录的映射）存储为与表键关联的字符串值。


    虽然 SQL 的经典版本（SQL92）不支持子类型和继承，但这在 SQL99 中已经改变。然而，SQL99 中与子类型相关的语言元素仅在某些 DBMS 中实现，例如在开源
    PostgreSQL 中。因此，在设计一个可以使用各种框架通过 SQL DBMS（包括较弱的技术，如 MySQL 和 SQLite）实现的模型时，我们无法使用
    SQL99 的子类型功能，而必须通过普通表和外键依赖在数据库设计模型中建模继承层次结构。这种从类层次结构到关系表（以及反之）的映射是对象关系映射（ObjectRelational-Mapping）框架的工作，例如
    JPA 提供程序（如 Hibernate）、Microsoft 的 Entity Framework 或 Rails 框架的 Active Record 方法。


    用数据库表表示类层次结构本质上有三种替代方法：


    - 1 **单表继承 (STI)** 是最简单的方法，整个类层次结构由单个表表示，该表包含根类及其所有子类的所有属性的列，并以根类的命名。

    - 2 **每类表继承 (TCI)** 是一种方法，层次结构中的每个类由一个相应的表表示，该表包含继承属性的列，重复了表示其父类的表的列。

    - 3 **连接表继承 (JTI)** 是一种更具逻辑的方法，每个子类由一个相应的表（子表）表示，该表通过主键引用父类的主键连接到表示其父类的表（父表），使得子类的（继承）属性不表示为子表中的列。


    注意，STI 方法与上面 12.6 节讨论的类层次结构合并设计模式紧密相关。当此设计模式已应用于设计模型中，或者设计模型已根据此设计模式进行了重构时，相关的类层次结构（其子类）在设计中已被消除，因此在应用模型层中也以类定义的形式进行了编码，因此不再需要将类层次结构映射到单表。否则，设计模型包含一个类层次结构，该结构在应用模型层用相应的类层次结构实现，并将借助
    STI 方法映射到数据库表。


    我们通过两个简单的示例来说说明这些方法的使用。第一个示例是 Book 类层次结构，如上图 12.1 所示。第二个示例是 Person 角色 Employee、Manager
    和 Author 的类层次结构，如下图 12.8 中的类图所示。


    ## 12.7.4.1 单表继承


    考虑上图 12.1 所示的单级类层次结构，它是类 Book 的不完全不交分，作为 MVC 应用的模型类的设计。在这种情况下，每当我们有一个只有一个级（或少数几级）子类型的模型类层次结构，且每个子类型都有少量额外属性时，最好使用
    STI。我们建模一个包含所有属性列的单表，其中表示分段子类额外属性的列（“分段属性”）是可选的，如图 12.9 中的 SQL 表模型所示。


    | Person | |

    | :--- | :--- |

    | personid : Integer (id) | |

    | name : String | |

    | Employee | Author |

    | empNo : integer (key) | biography : String |

    | Manager | |

    | department : String | |


    **图 12.8:** 一个带有 Person 角色层次结构的信息设计模型。


    ```sql

    isbn[1] : VARCHAR (pkey)

    title[1] : VARCHAR

    year[1] : INTEGER

    category[0..1] : VARCHAR ("TextBook","Biography") (frozen)

    ubject_area[0..1] : VARCHAR

    about[0..1] : VARCHAR


    invariant

    ((category="TextBook") IFF subject_area

    (category="Biography") IFF NULL))

    ```


    **图 12.9:** 使用单表的 SQL 模型。


    一种常用方法是添加一个特殊的*鉴别列 (discriminator column)* 来表示每行对应的子类类别。该列通常是字符串值，但约束为子类的名称之一。DBMS
    支持枚举，它可以是枚举值。我们使用 *category* 名称作为鉴别列，在我们的类层次结构示例中，由于教科书分段是固定的，它具有一个固定值。


    基于 book 的类别，我们必须强制当且仅当它是 "TextBook" 时，其 subjectArea 有值，且当且仅当它是 "Biography" 时，about
    属性有值。这种隐含约束在上述类图的 Book 表中表示，其中逻辑运算符 IFF 表示逻辑等。它需要在数据库中实现，例如通过 SQL CHECK 子或 SQL
    触发器。


    当给定的分段是不交的时，使用单值枚举类别来表示实例所属的类。否则，如果它不是交的，则使用多值枚举类别来表示实例所属的类。这种属性可以通过在 SQL 中定义一个字符串值列来表示枚举代码或标签的集合。


    考虑图 12.8 中的类层次结构。在 Employee、Manager 和 Author 子类中仅定义了额外属性，此类层次结构可以使用 STI 方法映射，如
    SQL 表 12.10 所示。


    | people |

    | :--- |

    | person_id[1] : INTEGER (pkey) |

    | name[1] : VARCHAR |

    | categories[*] : VARCHAR ("Employee", "Manager", "Author") |

    | emp_no[0..1] : INTEGER (unique) |

    | biography[0..1] : VARCHAR |

    | department[0..1] : VARCHAR |


    > ("Employee" IN categories IFF NOTNULL(emp_no)) AND ("Manager" IN categories
    IFF NOTNULL(emp_no)) AND NOTNULL(department) AND ("Author" IN categories IFF NOTNULL(biography))


    **图 12.10:** 表示 Person 角色层次结构的 STI 表。


    注意，现在鉴别列 categories 是多值的，因为 Person 的分段是不交的，而是重叠的，这意味着一个 Person 对象可能属于多个类别。同样注意，由于角色分段（如
    Employee、Manager、Author）不是固定的，鉴别列 categories 没有固定值约束。


