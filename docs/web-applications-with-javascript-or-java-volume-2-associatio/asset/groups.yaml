    6.1 Assign a Director and Actors to a Movie — 79\n6.2 Assign Cities and a Capital\
    \ to a Country, and Members to Organization — 80\n\n7 Bidirectional Associations\
    \ — 83\n7.1 Inverse Reference Properties — 83\n7.2 Making an OO Class Model —\
