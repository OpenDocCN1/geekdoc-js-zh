    # 7 Bidirectional Associations


    In the case of a derived inverse reference property that is multi-valued while
    its inverse property is single-valued (like Publisher::publishedBooks in Figure
    7.4 below being derived from Book::publisher), the life cycle dependencies imply
    that


    - 1. whenever a ''base object'' (such as a book) is created, the corresponding
    inverse property to be updated by adding a reference to the new base object to
    its value set (adding a reference to the new object to Publisher::publishedBooks);

    - 2. whenever the base property is updated (e.g., a new publisher is assigned
    to a book), the corresponding inverse property (in our example, Publisher::publishedBooks)
    has to be updated as well as removing the old reference from its value set and
    adding the new one;

    - 3. whenever a base object (such as a book) is destroyed, the corresponding inverse
    property to be updated by removing the base object from its value set (like removing
    a reference to the object to be destroyed by Publisher::publishedBooks).


    Notice that from a purely computational point of view, we are free to choose either
    of the two mutually inverse reference properties (like Book::authors and Author::authored)
    to be the master. however, in many cases, associations represent asymmetrical
    ontological existence dictate which of the two mutually inverse properties is
    the master. For instance, the authorship association between the classes Book
    and Author represents an ontological existence dependency of books on their authors.
    A book existentially depends on its author(s), while an author does not existentially
    depend on any of her books. Consequently, the corresponding object lifecycle dependency
    between Book and Author implies that their bidirectional association is maintained
    by maintaining Author references in Book::authors as Author::authoredBooks is
    the natural choice of master property, the slave property, which is derived from
    Book::authors.


    # 7.2 Making an OO Class Model


    Since classical OO programming languages do not support explicit associations
    as first class citizens, but only classes with reference properties representing
    implicit associations, we have to eliminate all explicit associations for obtaining
    an OO class model.


    ### 7.2.1 The Basic Property


    The starting point of our association elimination procedure is an information
    design model with various kinds of unidirectional and bidirectional associations,
    such as the model shown in Figure 7.1. If the model still contains any non-directed
    associations, we first have to turn them into directed ones by making a decision
    on the ownership of their ends, which is typically based on navigability requirements.


    Notice that both associations in the Publisher-Book-Author information design
    model, publisher-publishedBooks and authored-authors (or Authorship), are bidirectional
    as indicated by the ownership dots at association ends. For eliminating all explicit
    associations from an information design model, we have to perform the following
    steps:


    - 1. Eliminate unidirectional associations, connecting a source with a target
    class, by replacing them with a reference property in the source class such that
    the target class is its range.

    - 2. Eliminate bidirectional associations by replacing them with a pair of mutually
    inverse reference properties.


    ### 7.2.2 How to Eliminate Unidirectional Associations


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source class having the target
    class as its range. Its multiplicity is the same as the multiplicity of the target
    association end. Its name is the name of the association end, if there is any,
    otherwise it is set to the name of the target class (possibly pluralized, if the
    reference property is multi-valued).


    ### 7.2.3 How to Eliminate Bidirectional Associations


    A bidirectional association, as the authorship association between the classes
    Book and Author in the model shown in Figure 7.1 above, is replaced with a pair
    of mutually inverse reference properties, as Book::authors and Author::authoredBooks.
    Since both reference properties represent the same information (the same set of
    binary relationships), it''s an option to consider one of them “master” and the
    other one “slave", which is derived from the master. We discuss the two cases
    of one-to-one and a many-to-many association


    - 1. In the case of a bidirectional one-to-one association, which leads to a pair
    of mutually inverse single-valued reference properties, in each of the two associated
    classes. Since both of them essentially represent the same information (the collection
    of links/relationships), one has to choose which of them is considered the master
    property, such that the other is the slave property, which is derived from the
    master property by inversion. In the class diagram, the slave property is designated
    as a derived property that is automatically updated whenever 1) a new master object
    is created, 2) the master reference property is updated, or 3) a master object
    is destroyed. This transformation is illustrated in Figure 7.2.


    | Committee | ClubMember |

    |---|---|

    | name : String | 0..1 | 1 |


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_103_0.png)


    | Committee | ClubMember |

    |---|---|

    | name : String | chair : ClubMember | /chairedCommittee[0..1] : Committee (inverse
    of chair) |


    **Figure 7.2:** Turn a bidirectional one-to-one association into a master-slave
    pair of mutually inverse single-valued reference properties.


    - 2. A bidirectional many-to-many association is mapped to a pair of mutually
    inverse multi-valued reference properties, in each of the two classes participating
    in the association. Again, in one of the classes, the multi-valued reference property
    representing the (inverse) association is designated as a *derived property* that
    is automatically updated whenever the corresponding property in the other class
    (where the association is maintained) is updated. The transformation is illustrated
    in Figure 7.3.


    | Book | Author |

    |---|---|

    | isbn : String (id) * | personid : Integer (id) |

    | title : String | name : String |


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_103_1.png)


    | Book | Author |

    |---|---|

    | isbn[1] : String (id) | personID[1] : Integer (id) |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | /chairedBooks[*] : Book (inverse of chair) |


    **Figure 7.3:** Turn a bidirectional many-to-many association into a master-slave
    pair of mutually inverse multi-valued reference properties.


    ### 7.2.4 The OO Class Model


    After replacing both bidirectional associations with reference properties, we
    obtain the OO class model shown in 7.4.


    | Book | Publisher |

    | --- | --- |

    | isbn[1]: String {id} | name[1]: String {id} |

    | title[1]: String | adress[1]: String |

    | year[1]: Integer | /publishedBooks[*]: Book (inverse of publisher) |

    | publisher[0..1]: Publisher | Author |

    | authors[*]: Author | personId[1]: integer (id) |

    | | name[1]: String |

    | | /authoredBooks[*]: Book (inverse of author) |


    Figure 7.4: The OO class model with pairs of mutually inverse reference properties.


    Since books are entities that essentially depend on and possibly on publishers,
    and not the other way around, it''s natural to maintain the master references
    in publisher and author objects derived (or ''slave'') data. Therefore, we define
    publishedBooks and authoredBooks as derived reference properties, which is indicated
    by their slash prefix in the OO class model.


    The meaning of this OO class model can be illustrated by a sample data population
    for the three model classes involved:


    | Publisher | Address | Published books |

    | --- | --- | --- |

    | Bantam Books | New York, USA | 0553345842 |

    | Basic Books | New York, USA | 0465030793 |


    | Book | Title | Year | Authors | Publisher |

    | --- | --- | --- | --- | --- |

    | 0553345842 | The Mind''s I | 1982 | 1, 2 | Bantam Books |

    | 1463794762 | The Critique of Pure Reason | 2011 | 3 | |

    | 1928565379 | The Critique of Practical Reason | 2009 | 3 | |

    | 0465030793 | I Am A Strange Loop | 2000 | 2 | Basic Books |

