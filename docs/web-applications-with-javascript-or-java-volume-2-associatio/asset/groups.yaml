  - "[PAGE 38]\n\n# 2.2 Implementing Single-Valued Reference Properties — 23\n\n```\n\
    this.year = year;\n```\n\n```\n...\n}\n}\n```\n\nA single-valued reference property,\
    \ such as the property publisher of the object type Book, allows storing internal\
    \ references to objects of another type, such as Publisher. When creating a new\
    \ object, the constructor function needs to have a parameter for allowing a suitable\
    \ value to the reference property. In a typed programming language, such as Java,\
    \ we would have to take a decision if this value is expected to be an (internal)\
    \ object reference or an (external) ID reference. In JavaScript, however, we can\
    \ take a more flexible approach and allow using either of them, as shown in the\
    \ following example:\n\n```\nclass Book {\n  constructor ({isbn, title, year,\n\
    \    publisher, publisher_id}) {\n    ...\n    // assign object reference or ID\
    \ reference\n    if (publisher || publisher_id) {\n      this.publisher = publisher\
    \ || publisher_id;\n    }\n  }\n}\n```\n\nNote that the record parameter's publisher\
    \ field represents a JS object reference while its publisher_id field represents\
    \ an ID reference. In JavaScript, we can use a disjunctive expression like expr1\
    \ || expr2 for getting the value of the first expression, if it is defined (and\
    \ not 0), or else the value of the second expression. We handle the resulting\
    \ ambiguity in the property setter by checking the type of the argument as shown\
    \ in the following code fragment:\n\n```\nset publisher(p) {\n  var publisher_id\
    \ = \"\";\n  // p can be an ID reference or an object reference\n  publisher_id\
    \ = (typeof p===\"object\") ? p : p.name;\n  ...\n  this._publisher = Publisher.instances[publisher_id];\n\
    }\n```"
