    # 7 双向关联


    当一个派生的反向引用属性是多值的，而其对应的属性是单值的时（如下图 7.4 中的 `Publisher::publishedBooks` 由 `Book::publisher`
    派生），其生命周期依赖关系意味着：


    - 1. 每当创建一个“基对象”（如书籍）时，都需要更新对应的反向属性，即向其值集中添加一个指向新基对象的引用（向 `Publisher::publishedBooks`
    中添加指向新对象的对象的引用）；

    - 2. 每当基属性更新时（例如，为书籍分配了新的出版社），对应的反向属性（在我们的示例中为 `Publisher::publishedBooks`）也必须更新，即从其值集中移除旧引用并添加新引用；

    - 3. 每当一个基对象（如书籍）被销毁时，都需要更新对应的反向属性，即从其值集中移除该基对象（如从 `Publisher::publishedBooks`
    中移除指向待销毁对象的引用）。


    注意，从纯计算的角度来看，我们可以自由选择两个互反的引用属性（如 `Book::authors` 和 `Author::authored`）中的一个作为主。然而，在许多情况下，关联代表了不对称的本体论存在，这决定了两个互反属性中哪一个是主。例如，`Book`
    和 `Author` 类之间的作者关系关联代表了书籍对其作者的本体论存在依赖。书籍在存在上依赖于其作者，而作者并不在存在上依赖于她的任何书籍。因此，`Book`
    和 `Author` 之间对应的对象生命周期依赖意味着，它们的双向关联通过在 `Book::authors` 中维护 `Author` 引用来维持，因为 `Author::authoredBooks`
    是自然的主属性选择，而它是从 `Book::authors` 派生的从生属性。


    # 7.2 构建 OO 类模型


    由于经典的 OO 语言不支持将显式关联作为一等公民，而仅支持通过引用属性表示隐式关联的类，我们必须消除所有显式关联以获取 OO 类模型。


    ### 7.2.1 基础属性


    我们消除关联过程的起点是一个包含各种单向和双向关联的信息设计模型，如图 7.1 所示的模型模型。如果模型中仍包含任何非定向关联，我们首先必须通过对其端点的所有权做出决策将其转换为定向关联，这通常基于可导航性。


    注意，在 `Publisher-Book-Author` 信息设计模型中的两个关联 `publisher-publishedBooks` 和 `authored-authors`（或
    `Authorship`）都是双向的，正如关联端点的所有权点所示。为了从信息设计模型中消除所有显式关联，我们必须执行以下步骤：


    - 1. 消除连接源类与目标类的单向关联，通过将其替换为源类中的引用属性，使目标类成为其范围（range）。

    - 2. 通过将双向关联替换为一对互反的引用属性来消除这些关联。


    ### 7.2.2 如何消除单向关联


    连接源类与目标类的单向关联被替换为源类中对应的引用属性，该属性的范围是目标类。其多重性与目标关联端的多重性相同。它的名称是关联端的名称（如果有的话），否则它被设置为目标类的名称（如果引用属性是多值的，则可能使用复数形式）。


    ### 7.2.3 如何消除双向关联


    双向关联（如上图 7.1 模型中 `Book` 和 `Author` 类之间的作者关联）被替换为一对互反的引用属性，如 `Book::authors` 和
    `Author::authoredBooks`。由于两个引用属性表示相同的信息（相同的二元关系集合），因此考虑将其中一个作为“主”，另一个作为“从”（后者由主属性派生）。我们讨论一对一关联和多对多关联的两种情况：


    - 1. 在双向一对一关联的情况下，这会在两个关联类中的每个类产生一对互反的单值引用属性。由于两者本质上代表相同的信息（链接/关系的集合），必须选择其中一个视为主属性，而另一个是从属性，该从属性通过反转由主属性派生。在类图中，从属性被指定为派生属性，每当发生以下情况时：1)
    创建新的主对象时，2) 更新主引用属性时，或 3) 主对象被销毁时，它会自动更新。这种转换如图 7.2 所示。


    | Committee | ClubMember |

    |---|---|

    | name : String | 0..1 | 1 |


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_103_0.png)


    | Committee | ClubMember |

    |---|---|

    | name : String | chair : ClubMember | /chairedCommittee[0..1] : Committee (inverse
    of chair) |


    **图 7.2:** 将双向一对一关联转换为主从对的互反单值引用属性。


    - 2. 双向多对多关联被映射为两个参与类中的一对互反的多值引用属性。再次，在其中一个类中，代表（反向）关联的属性被指定为派生属性，每当另一个类的对应属性更新时，它会自动更新。转换如图
    7.3 所示。


    | Book | Author |

    |---|---|

    | name : String (id) | person : String |

    | title : String |


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_103_1.png)


    | Book | Author |

    |---|---|

    | isbn[1] : String (id) | personId[1] : Integer (id) |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | /authoredBooks[*] : Book |


    **图 7.3:** 将双向多对多关联转换为主从对的多值引用属性。


    ### 7.2.4 OO 类模型


    将两个双向关联替换为引用属性后，我们得到了 7.4 所示的 OO 类模型。


    | Book | Publisher |

    | --- | --- |

    | isbn[1]: String {id} | name[1]: String {id} |

    | title[1]: String | adress[1]: String |

    | year[1]: Integer | /publishedBooks[*]: Book (inverse of publisher) |

    | publisher[0..1]: Publisher | Author |

    | authors[*]: Author | personId[1]: integer (id) |

    | | name[1]: String |

    | | /authoredBooks[*]: Book (inverse of author) |


    图 7.4: 具有互反引用属性对的 OO 类模型。


    由于书籍本质上依赖于且可能依赖出版社，反之则不然，因此在出版社和作者对象中维护派生（或“从生”）主引用是自然的。因此，我们将 `publishedBooks`
    和 `authoredBooks` 定义为派生引用属性，这在 OO 类模型中通过斜杠前缀指示。


    该 OO 类模型的意义可以通过涉及的三个模型类的示例数据来说来说：


    | Publisher | Address | Published books |

    | --- | --- | --- |

    | Bantam Books | New York, USA | 0553345842 |

    | Basic Books | New York, USA | 0465030793 |


    | Book | Title | Year | Authors | Publisher |

    | --- | --- | --- | --- | --- |

    | 0553345842 | The Mind''s I | 1982 | 1, 2 | Bantam Books |

    | 1463794762 | The Critique of Pure Reason | 2011 | 3 | |

    | 1928565379 | The Critique of Practical Reason | 2009 | 3 | |

    | 0465030793 | I Am A Strange Loop | 2000 | 2 | Basic Books |


