    \ Initializing Mojarra [some library versions and paths are shown here!] for context\
    \ \"subtypingapp\"。最后，通过浏览器打开：\n\n```text\nhttp://localhost:8080/UnidirectionalAssociationApp/views/app/index.xhtml\n\
    ```\n\n## 5.7 集合有序集合作为属性值\n\n回想集合（Set）是无序且元素唯一的集合，而列表（List）可以包含相同的元素。\n\n当关联排序时，例如\
    \ `Book::authors`（如图 5.1 所示），这意味着相应属性的范围需要是有序类型，例如 Java 接口 `SortedSet` 和 `List`。\n\
    \n| Book | authored | Author |\n| :--- | :--- | :--- |\n| isbn : String | * |\
    \ personid: Integer name: String |\n| title : String | * | |\n| year : Integer\
    \ | * | (ordered) |\n\n图 5.1：集合值属性 authored 和有序的 authors\n\n理论上，集合值属性应该定义为 `Set<T>`，例如将\
    \ `Set<Book>` 定义为 `Author::authored` 的范围，而有序集合值属性应该定义为 `SortedSet<T>`，例如将 `SortedSet<Author>`\
    \ 定义为 `Book::authors` 的范围。Java 接口通常由 `HashSet` 实现，而 `SortedSet` 通常由 `TreeSet`\
    \ 实现。\n\n然而，如果不担心重复元素，集合值和有序集合值属性都可以定义为泛型接口类型 `List<T>` 作为其范围，该类型通常由 `ArrayList`\
    \ 实现。\n\n当主要的用例是将元素添加到集合并在随后遍历它们时，最佳选择是使用 `ArrayList` 实现 `List`，它比 `LinkedList`\
