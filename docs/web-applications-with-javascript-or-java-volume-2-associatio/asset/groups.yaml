- md: "\n# 13 Subtyping with Plain JS\n\nIn this chapter, we first explain the general\
    \ approach to constructor-based subtyping in JavaScript before presenting two\
    \ case studies based on fragments of the information model of our running example,\
    \ the Public Library app, shown above.\n\nIn the first case study, we consider\
    \ the single-level hierarchy with root Book shown in Figure 12.1, which is an\
    \ incomplete rigid segmentation. We use the Class Hierarchy Merge design pattern\
    \ for ref-oring this simple class hierarchy to a single class that can be mapped\
    \ to a persistent database table.\n\nIn the second case study, we consider the\
    \ multi-level hierarchy consisting of the Person roles Employee, Manager and Author,\
    \ shown in Figure 12.8. The segmentation of Person into Employee and Author does\
    \ not have any constraints, which means it is complete, overlapping (non-disjoint)\
    \ and non-rigid.\n\nWe use the Class Hierarchy Merge design pattern for the simple\
    \ Manager-is-Employee sub-hierarchy, and the Joined Inheritance approach for mapping\
    \ the Employee-and-Author-is-a-Person class hierarchy to a set of three databases\
    \ that are related with each other via foreign key dependencies.\n\nIn both case\
    \ studies we showed\n\n- 1. how to derive a JS class model, and a corresponding\
    \ entity table model, from the information design model,\n- 2. how to code the\
    \ JS class model in the form of JS classes,\n- 3. how to write the view and controller\
    \ code based on the model code.\n\n# 13.1 Subtyping with Constructor-Based Classes\n\
    \nBefore the version ES2015, JavaScript did not have an explicit class concept\
    \ and subtyping was not directly supported, so it had to be implemented with the\
    \ help of certain code patterns providing two inheritance mechanisms: (1) inheritance\
    \ of properties and (2) inheritance of methods.\n\nAs we have explained in Chapter\
    \ 1 of Volume 1, classes can be defined in two alternative ways: constructor-based\
    \ and factory-based. Both approaches have their own way of implementing inheritance.\n\
    \nWe summarize the ES2015 code pattern for defining a superclass and a subclass\
    \ in a constructor-based single-inheritance class hierarchy with the help of the\
    \ following example:\n\n| Person |\n| --- |\n| firstName : String |\n| lastName\
    \ : String |\n\n| Student |\n| studNo : Integer |\n\nThen, we define a base class,\
    \ Person, with two properties, firstName and lastName, defined with getters and\
    \ setters:\n\n```\nclass Person {\n  constructor ({first, last}) {\n    // assign\
    \ properties by invoking their setters\n    this.firstName = first;\n    this.lastName\
    \ = last;\n  }\n\n  getFirstName () {return this._firstName};\n  setFirstName\
    \ (f) {\n    . . . // check constraints\n    this._firstName = f;\n  }\n\n  getLastName\
    \ () {return this._lastName};\n  setLastName (l) {\n    . . . // check constraints\n\
    \    this._lastName = l;\n  }\n}\n```\n\nThen, we define a subclass, Student,\
    \ with one additional property, studNo:\n\n```javascript\nclass Student extends\
    \ Person {\n  constructor ({first, last, studNo}) {\n    // invoke constructor\
    \ of superclass\n    super(first, last);\n    // assign additional properties\n\
    \    this.studNo = studNo;\n  }\n\n  get studNo () {return this._studNo;}\n  set\
    \ studNo (sn) {\n    // check constraints\n    this._studNo = sn;\n  }\n}\n```\n\
    \nNotice how the constructor of the superclass is invoked: with super({first,\
    \ last}).\n\n# 13.2 Case Study: Eliminating a Class Hierarchy\n\nSimple class\
    \ hierarchies can be eliminated by applying the Class Hierarchy Merge design pattern.\
    \ The starting point for our case study is the simple class hierarchy shown in\
    \ the information design model of Figure 12.1 above, representing a disjoint (but\
    \ incomplete) rigid segmentation of Book into Textbook and Biography. This model\
    \ is first simplified by applying the Class Hierarchy Merge design pattern, resulting\
    \ in the following model:\n\n| isbn[1] : String (id) | <<enumeration> |\n| title[1]\
    \ : String | BookTypeEL |\n| year[1] : Integer | TextBook |\n| category[0..1]\
    \ : BookTypeEL(frozen) | Biography |\n| subjectArea[0..1] : String | |\n| about[0..1]\
    \ : String | |\n\n```js\n<<invariant>\n{{category=\"TextBook\" IF NOT subjectArea=undefined)\
    \ AND\n(category=\"Biography\" IF NOT about=undefined))\n```\n\nWe now derive\
    \ a JS class model from this design model.\n\n# 13.2.1 Make the JS Class Model\n\
    \nWe make the JS class model in 3 steps:\n\n- 1. Replace the platform-independent\
    \ datatypes (used as the ranges of attributes and parameters) with JS datatypes.\
    \ This includes the case of enumeration-valued attributes, such as category, which\
    \ are turned into number-valued attributes restricted to the enumeration integers\
    \ of the underlying enumeration type.\n\nDecorate all properties with a «get/set»\
    \ stereotype for indicating that they have implicit getters and setters.\n\nAdd\
    \ property check functions, as described in Chapter 8 of Volume 1. The checkCategory\
    \ function, as well as the checks of the segment properties need special consideration\
    \ according to their implied semantics. In particular, a segment-property check\
    \ function must ensure that the property can only be assigned if the category\
    \ attribute has a value representing the corresponding segment. We explain this\
    \ validation semantics in detail below when we discuss how the JS class model\
    \ is coded.\n\nThis leads to the JS class model shown in Figure 13.1, where the\
    \ class-level (‘static’) methods are updated:\n\n| Book | «enumeration» |\n| :---\
    \ | :--- |\n| «get/set> isbn[1] : string | BookCategoryEL |\n| «get/set> title[1]\
    \ : string | TEXTBOOK |\n| «get/set> year[1] : number | BIOGRAPHY |\n| «get/set>\
    \ category[0] : number (from BookCategory, frozen) | |\n| «get/set> subjectArea[0]\
    \ : string | |\n| checkIsbn(in isbn : string; string) : ConstraintViolation |\n\
    | checkIsbn(in isbn : string; string) : ConstraintViolation |\n| checkTitle(in\
    \ title : string) : ConstraintViolation |\n| checkYear(in year : number) : ConstraintViolation\
    \ |\n| checkCategory(in type : number) : ConstraintViolation |\n| checkSubjectArea(in\
    \ subjectArea : string) : ConstraintViolation |\n| checkAbout(in about : string)\
    \ : ConstraintViolation |\n\nFigure 13.1: The JS class model of the merged Book\
    \ class hierarchy.\n\n# 13.2.2 New Issues\n\nCompared to the enumeration discussed\
    \ in Chapter 11 of Volume 1, we have to deal with a number of new issues:\n\n\
    - 1. In the model code we have to take care of:\n  a. Adding the constraint violation\
    \ class FrozenValueConstraintViolation errorTypes.js.\n- 2. Coding the enumeration\
    \ type to be used as the range of the category attribute BookCategoryEL in our\
    \ example.\n- 3. Coding the checkCategory function for the category attribute.\
    \ In our example this attribute is optional, due to the fact that the segment\
    \ is incomplete. If the segmentation, to which the Class Hierarchy Merge pattern\
    \ is applied, is complete, then the category attribute is mandatory.\n- 4. Coding\
    \ the check functions for all segment properties such that they take the category\
    \ as a second parameter for being able to test the segment property concerned\
    \ to a given instance.\n- 5. Refining the serialization function toString() by\
    \ adding a category case distinction (switch) statement for serializing only the\
    \ segment properties that apply to the given category.\n- 6. Implementing the\
    \ Frozen Value Constraint for the category attribute in Books.update by updating\
    \ the category of a book only if it has not yet defined. This means it cannot\
    \ be updated anymore as soon as it has been defined.\n- 2. In the UI code we have\
    \ to care:\n  - 1. Adding a \"Special type\" (or \"Category\") column to display\
    \ the table of the \"List all books\" use case in books.html. A book without a\
    \ special category will have an empty table cell, while for all books their category\
    \ will be shown in this cell, along with other segment-specific attribute values.\
    \ This requires a corresponding switch statement in pl.books.retrieveAndListData.setupInterface\
    \ in the .js code file.\n  - 2. Adding a \"Special type\" choice widget (typically,\
    \ a selection list), and responding form fields for all segment properties, in\
    \ the forms of \"Create book\" and \"Update book\" use cases in books.html. Segment\
    \ property fields are only displayed when a corresponding book category has been\
    \ selected. Such an approach of rendering specific form fields only on certain\
    \ conditions is sometimes called dynamic forms.\n\n# 13.2.3 Code the Model Classes\
    \ of the JS Class Model\n\nThe JS class model can be directly coded for getting\
    \ the code of the model classes of our JS front-end app.\n\n# 13.2.3.1 Summary\n\
    \n- 1. Code the enumeration type BookCategoryEL to be used as the range of the\
    \ category attribute with the help of the meta-class Enumeration, as explained\
    \ in Chapter 11 of Volume 1.\n- 2. Code the model class Book in the form of a\
    \ JS class definition with get and set methods as well as static check functions.\n\
    \nThese steps are discussed in more detail in the following sections.\n"
  mdcn: "\n\n# 13 使用原生 JS 进行子类型化\n\n在本章中，我们首先将解释 JavaScript 中基于构造函数的子类型化的通用方法，然后根据上文所示的运行示例——公共图书馆应用（Public\
    \ Library app）的信息模型片段介绍两个案例研究。\n\n在第一个案例研究中，我们考虑了图 12.1 所示的以 `Book` 为根的单级层次结构，这是一个不完整的刚性划分。我们使用“类层次结构合并”（Class\
    \ Hierarchy Merge）设计模式将这个简单的类层次结构重构为一个可以映射到持久化数据库表的单一类。\n\n在第二个案例研究中，我们考虑了图 12.8\
    \ 所示的由 `Person` 角色 `Employee`、`Manager` 和 `Author` 组成的多级层次结构。将 `Person` 划分为 `Employee`\
    \ 和 `Author` 没有任何约束，这意味着它是完整的、重叠的（非互斥）且非刚性的。\n\n对于简单的 `Manager-is-Employee` 子层次结构，我们使用“类层次结构合并”设计模式；而对于，使用“连接继承”（Joined\
    \ Inheritance）方法将 `Employee-and-Author-is-a-Person` 类层次结构映射到三个通过外键依赖相互关联的数据库。\n\
    \n在两个案例研究中，我们展示了：\n\n- 1. 如何从信息设计模型推导出 JS 类模型以及相应的实体表模型；\n- 2. 如何以 JS 类的形式编写 JS\
    \ 类模型；\n- 3. 如何基于模型代码编写视图和控制器代码。\n\n# 13.1 基于构造函数的类的子类型化\n\n在 ES2015 版本之前，JavaScript\
    \ 并没有显式的类（class）概念，且不支持支持子类型化，因此必须借助某些代码模式的来实现，这些模式提供了两种继承机制：(1) 属性继承和 (2) 方法继承。\n\
    \n正如我们在第一卷第 1 章中解释过的，类可以通过两种替代方式定义：基于构造函数的和基于工厂的。这两种方法都有它们实现继承的方式。\n\n我们通过以下示例总结了使用\
    \ ES2015 代码模式，在基于构造函数的单继承类层次结构中定义父类和子类的代码：\n\n| Person |\n| --- |\n| firstName\
    \ : String |\n| lastName : String |\n\n| Student |\n| studNo : Integer |\n\n然后，我们定义一个基类\
    \ `Person`，带有两个属性 `firstName` 和 `lastName`，并通过 getter 和 setter 定义它们：\n\n```\n\
    class Person {\n  constructor ({first, last}) {\n    // 通过调用 setter 赋值属性\n   \
    \ this.firstName = first;\n    this.lastName = last;\n  }\n\n  getFirstName ()\
    \ {return this._firstName};\n  setFirstName (f) {\n    . . . // 检查约束\n    this._firstName\
    \ = f;\n  }\n\n  getLastName () {return this._lastName};\n  setLastName (l) {\n\
    \    . . . // 检查约束\n    this._lastName = l;\n  }\n}\n```\n\n然后，我们定义一个子类 `Student`，带有一个额外的属性\
    \ `studNo`：\n\n```javascript\nclass Student extends Person {\n  constructor ({first,\
    \ last, studNo}) {\n    // 调用父类的构造函数\n    super(first, last);\n    // 赋值额外属性\n\
    \    this.studNo = studNo;\n  }\n\n  get studNo () {return this._studNo;}\n  set\
    \ studNo (sn) {\n    // 检查约束\n    this._studNo = sn;\n  }\n}\n```\n\n注意父类构造函数是如何调用的：使用\
    \ `super({first, last})`。\n\n# 13.2 案例研究：消除类层次结构\n\n可以通过应用“类层次结构合并”设计模式消除简单的类层次结构。我们案例研究的起点是图\
    \ 12.1 信息设计模型所示的简单类层次结构，它代表了 `Book` 划分为 `Textbook` 和 `Biography` 的互斥（但不完整）刚性划分。该模型首先通过应用类层次结构合并设计模式进行简化，得到了以下模型：\n\
    \n| isbn[1] : String (id) | <<enumeration> |\n| title[1] : String | BookTypeEL\
    \ |\n| year[1] : Integer | TextBook |\n| category[0..1] : BookTypeEL(frozen) |\
    \ Biography |\n| subjectArea[0..1] : String | |\n| about[0..1] : String | |\n\n\
    ```js\n<<invariant>\n{{category=\"TextBook\" IF NOT subjectArea=undefined) AND\n\
    (category=\"Biography\" IF NOT about=undefined))\n```\n\n我们现在从这个设计模型推导出一个 JS 类模型。\n\
    \n# 13.2.1 构建 JS 类模型\n\n我们分 3 步构建 JS 类模型：\n\n- 1. 将平台无关的数据类型（用属性和参数的范围）替换为 JS\
    \ 数据类型。这包括枚举值属性的情况，例如 `category`，它们被转换为数值型属性，并被限制在底层枚举类型的枚举整数范围内。\n\n  为所有属性装饰\
    \ `«get/set»` 刻画类型（stereotype），以指示它们具有隐式的 getter 和 setter。\n\n  如第一卷第 8 章所述，添加属性检查函数。`checkCategory`\
    \ 函数以及对分段属性的检查需要根据其隐含的语义进行特殊考虑。特别是，分段属性检查函数必须确保，只有当 `category` 属性具有代表相应分段的值时，才能为该属性赋值。我们将在下文讨论如何编写\
    \ JS 类模型时，详细解释这种验证语义。\n\n  这导致了图 13.1 所示的 JS 类模型，其中类级（'static'）方法方法得到了更新：\n\n\
    | Book | «enumeration» |\n| :--- | :--- |\n| «get/set> isbn[1] : string | BookCategoryEL\
    \ |\n| «get/set> title[1] : string | TEXTBOOK |\n| «get/set> year[1] : number\
    \ | BIOGRAPHY |\n| «get/set> category[0..1] : number (frozen) | | |\n| «get/set>\
    \ subjectArea[0..1] : string | |\n| «get/set> about[0..1] : string | |\n\n图 13.1：合并后的类层次结构的\
    \ JS 类模型。\n\n# 13.2.2 新问题\n\n与在第一卷第 11 章讨论的枚举相比，我们需要处理许多新问题：\n\n- 1. 在模型代码中，我们需要处理：\n\
    \  a. 添加 `FrozenValueConstraint` 约束违反类。\n  2. 编写作为 `category` 属性范围的枚举类型 `BookCategoryEL`。\n\
    \  3. 编写 `category` 属性的 `checkCategory` 函数。在我们的示例中，由于划分是不完整的，该属性是可选的。如果应用类层次结构合并模式的划分是完整的，那么该属性是强制性的。\n\
    \  4. 编写所有分段属性的检查函数，使其接受 `category` 作为第二个参数，以便测试给定实例的相关分段属性。\n  5. 通过添加分类分支（switch）语句来完善\
    \ `toString()` 函数，仅序列化适用于给定分类的分段属性。\n  6. 在 `Books.update` 中为 `category` 属性实现冻结值约束（Frozen\
    \ Value Constraint），在尚未定义时更新类别。这意味着一旦定义，就无法再次更新。\n  2. 在 UI 代码中，我们需要考虑：\n  - 1.\
    \ 在 `books.html` 的“列所有书籍”用例表格中添加“特殊类型”（或“类别”）列。没有特殊类别的书籍表格单元格将为空，而对于所有书籍，将在单元格中显示其类别以及其他分段属性值。这需要在\
    \ .js 代码文件的 `pl.books.retrieveAndListData.setupInterface` 中编写相应的切换语句。\n  - 2.\
    \ 在 `books.html` 的“创建书籍”和“更新书籍”用例表单中添加“特殊类型”选择控件（通常是选择列表）以及响应式分段属性表单。只有在选择了相应的书籍类别时，才会显示分段属性字段。这种根据特定条件渲染特定表单字段的方法被称为动态表单。\n\
    \n# 13.2.3 编写 JS 类模型的模型类\n\n可以直接编写 JS 类模型以获取我们 JS 前端应用的模型类代码。\n\n# 13.2.3.1 总结\n\
    \n- 1. 如第一卷第 11 章所示，借助元类 `Enumeration` 编写作为 `category` 属性范围的枚举类型 `BookCategoryEL`。\n\
    - 2. 以 JS 类定义的形式编写 `Book` 模型类，带有 getter 和 setter 方法以及静态检查函数。\n\n这些步骤将在后续章节中进行更详细的讨论。\n\
    \n"
