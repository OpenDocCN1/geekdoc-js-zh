    # 第一部分：关联


    我们拥有的三个示例应用在讨论中已经涵盖了三种功能类型。单向关联的通常只管理一个对象类型。然而，在模型视图控制器（MVC）架构中，它们以各种方式相互关联。在软件工程中，它们并没有得到良好的支持。


    关联是信息模型的重要元素。软件框架通常需要以适当的方式来实现它们。


    关联存在两种重要的区别，它们是相互独立的：


    1. 功能性关联与非功能性（多对多）关联。

    2. 单向关联与双向关联。


    功能性关联在数学中对应于函数（function），而多对多关联在数学中对应于关系（relation）。


    单向关联在 OO 建模和编程中对应于引用属性，而双向关联对应于一对互为反值的引用属性。


    # 1 引用属性与单向关联


    定义在对象类型或类上的属性，如果其值是对另一个对象或相同类型对象的引用，则被称为引用属性。例如，图1.1 所示的委员会（Committee）有一个引用属性
    `chair`，其值指向俱乐部成员（ClubMember）对象。


    单向关联在 OO 建模和编程中对应于引用属性，而双向关联对应于一对互为反值的引用属性。


    在数学中，关联抽象地形式化为元组的集合，称为关系。在实体关系（ER）建模（这是信息系统和软件工程中的经典信息建模方法）中，对象被称为实体（entity），关联被称为关系类型（relationship
    type）。统一建模语言（UML）包含了用于信息建模类图。在 UML 中，对象类型被称为类（class），个体关系被称为链接（link）。这些术语总结如下所示：


    | 我们的首选术语 | UML | ER 图 | 数学 |

    | :--- | :--- | :--- | :--- |

    | 对象 (object) | object | entity | individual |

    | 对象类型 (class) | class | entity type | unary relation |

    | 关系 (relationship) | link | relationship | tuple |

    | 关联 (association) | association | relationship type | relation |

    | 功能性关联 | | 1:1, 1:N | function |


    我们首先讨论引用属性，它们在无关联类模型中隐含地表示了双向关联。


    ## 1.1 引用与引用属性


    引用可以是*人类可读的*或*内部对象引用*。人类可读引用是指人类中使用的标识符，例如天体的唯一名称、书籍的 ISBN 以及公司员工的编号。内部对象引用是指
    OOP 对象的内存地址，为访问主内存中的对象提供了高效机制。


    某些语言（如 SQL 和 XML）只支持人类可读引用，不支持内部引用。在 SQL 中，人类可读引用被称为外键（foreign keys），它们所引用的标识符被称为主键（primary
    keys）。在 XML 中，人类可读引用被称为 ID 引用（ID references），对应的属性类型是 IDREF。


    OO 程序中的对象可以通过人类可读引用（例如整数代码）或内部对象引用来引用，后者更有于高效访问主内存中的对象。


