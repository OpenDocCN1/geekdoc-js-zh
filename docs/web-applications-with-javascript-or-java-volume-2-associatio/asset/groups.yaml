    \ `, ${this.publisher.name}`;\n  return bookStr + \", authors: \" +\n    Object.keys(this.authors).join(\"\
    ,\") + `;`;\n}\n```\n\n`Book::toRecord()` 函数需要序列化对象的所有属性槽（slots）。这通过删除下划线前缀来获取相应的记录字段名：\n\
    \n```javascript\ntoRecord() {\n  var rec = {};\n  for (let p of Object.keys(this))\
    \ {\n    // 只拷贝带有下划线前缀的属性槽\n    if (p.charAt(0) !== \"_\") continue;\n    switch\
