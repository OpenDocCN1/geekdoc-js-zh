    by G. Bellekenens. In addition to this defining characteristic of a composition
    (to have exclusive, or non-shareable, parts), a composition may also come with
    a life-cycle dependency between the composite and its components. In fact, there
    are two kinds of such dependencies:


    +   Whenever a composite must be attached to a composite, or in other words, when
    it has a mandatory composite, as expressed by the "exactly one" multiplicity at
    the composite side of the composition line, then it must be re-used (in or re-attached
    to) another composite, or destroyed, when its current composite is destroyed.
    This is exemplified by the composition between Person and Heart, shown in the
    diagram below. A heart is destroyed or transplanted to another person, when its
    owner has died.'
  - '[PAGE 130]


    2. Whenever a component must not be detached from its composite, or in other words,
    when it is inseparable, then, and only then, the component has to be destroyed,
    when its composite is destroyed. An example of a composition with inseparable
    parts is the composition between Person and Brain.


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_130_0.png)


    In summary, the life-cycle dependency created by inseparable parts only applies
    to specific cases of composition, but not in general. It is, therefore, not a
    defining characteristic. The UML spec states: "A part may be removed from a composite
    before the composite instance is deleted, and thus not deleted as part of the
    composite instance.


    When such a life-cycle dependency applies, it represents a special form of Existential
    Dependency, which implies the CASCADE deletion discussed in Section 1.2.


    In the example of a Car-Engine composition, as shown in the following diagram,
    it''s clearly the case that the engine can be detached from the car before the
    car is destroyed, in which case the engine is not destroyed and can be re-used.
    This is implied by the zero or one multiplicity at the composite side of the composition
    line.


    | Car | Engine |

    | licenseNo : String | id : String |

    | color : String 0.1 0.1 | cylinderCapacity : Decimal |


    The multiplicity of a composition''s association at the composite side is either
    1 or 0..1, depending on if components have a mandatory composite or not. Of course,
    the fact that a component is inseparable implies that it has a mandatory composite,
    and consequently the composite''s multiplicity must be 1.


