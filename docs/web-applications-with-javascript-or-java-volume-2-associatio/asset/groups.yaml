    \ |\n\n图 13.2：Person 类层次结构的 JS 类模型。\n\n### 13.3.2 构建 JS 实体模型\n\n由于我们使用浏览器的 Local\
    \ Storage 作为示例应用的持久化存储，我们必须处理简单的键值存储。对于每个具有单数（大写）名称的设计模型类，我们使用其复数小写名称作为对应的表，并作为一个键，通过\
    \ `JSON.stringify` 序列化对象集合来获取其关联值。我们从设计模型推导出一组合适的 JS 实体表，形式为 JS 实体模型。我们必须对如何组织数据以及如何推导出实体模型做出某些选择。选择是使用单表继承\
    \ (STI)、每类继承 (TCI) 或连接表继承 (JTI) 方法，后者在 12.7 节中引入。在 STI 方法中，分段（或整个层次结构）用一个包含所有类属性的单表表示，如图\
    \ 13.3 所示。\n\n| «entity table» | category |\n| :--- | :--- |\n| personid[1]: number\
    \ (pkey) | 1 = Author |\n| name[1]: string | 2 = Employee |\n| empno[0]: number\
    \ (unique) | 3 = Manager |\n| biography[0]: string | |\n| department[0]: string\
    \ | |\n\n图 13.3：Person 类层次结构的 STI 模型。\n\n由于给定的分段是不相交的，使用多值枚举属性来表示子类所属的信息。对于给定的示例，使用\
    \ STI 方法是可行的，因为该层次结构层级不多，且子类没有添加许多属性。但在更真实的示例中，层次结构的子类会有更多属性。对于多级层次结构，STI 方法并不是一个选择。但我们可以选择它来表示“Manager\
