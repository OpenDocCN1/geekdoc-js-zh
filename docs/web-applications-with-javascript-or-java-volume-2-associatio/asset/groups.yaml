    **Figure 12.4:** An information model with two class hierarchies.


    We have the following duality: while all features of a supertype are included
    in the intentions, or feature sets, of its subtypes (intensional), all instances
    of a subtype are included in the extensions of supertypes (extensional). Due to
    the intention/extension duality we can specialize a given type in two ways:

    - **By extending the type’s intention** (such as adding features in subtype).

    - **By restricting the type’s extension** (such as adding a constraint).


    Typical OO languages, such as Java, only support the first possibility (extending
    a type), while XML Schema also support the second (restricting a type).


    ## 12.4 Type Hierarch


    A *type hierarchy* (or class hierarchy) consists of two or more types, one of
    them the *root*, and all others having at least one supertype. The simplest case
    of a hierarchy, which has only one level, is called generalization. By default,
    whenever a segmentation does not have any annotation, it is (incomplete, disjoint).
    In a class diagram, we can express these constraints by annotating the generalization
    arrow with braces. For instance, the segmentation of Vehicle with {complete, disjoint}
    indicates that it is a partition. Otherwise, it is called overlapping.


    An information model may contain any number of class hierarchies.


    ## 12.5 Kinds and Roles


    In order to understand the different categories of object types and subtypes in
    natural language statements and in information models, we can distinguish between
    sortal and non-sortal, and between rigid and non-rigid object types, as presented
    by Giancarlo Guizzardi in his theory of object categories.


    An object type is sortal if it has a uniform identity for its instances. Such
    a condition defines the property (or set of properties) that no two instances
    have common without being the same. An example of a sortal object is Person since
    all its instances (people) are identifiable by a set of properties related to
    their birth (born when, and to whom). Book is an example of a non-sortal object
    type because it contains instances (e.g., textbooks and self-published novels)
    that are identified in different ways.


    An object type is rigid if its instances cannot cease to be of that type ceasing
    to exist (or altering their identity). Person is an example of a rigid type, while
    Employee is not rigid. A segmentation is called rigid if all subclasses are rigid.


    A kind is a sortal object type. Examples of kinds are Textbook and Person. A role
    is a sortal object type classifying instances of a kind K that participate in
    a relationship (of a certain type A) with an instance of type O. Notice that R
    is a non-rigid subtype of K since its instances do not cease to exist when they
    happen to cease instantiating because they no longer participate in a relationship
    of type A with an instance of type O.


    For instance, Employee is an example of a role since it is a sortal object type
    classifying instances of Person that participate in an employment relationship
    with an instance of type Enterprise.


