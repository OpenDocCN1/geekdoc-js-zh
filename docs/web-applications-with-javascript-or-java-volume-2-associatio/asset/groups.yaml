    ECMAScript


    Extensible Markup Language


    A standard for JavaScript defined by the industry organization "Ecma International".
    XML allows to mark up the structure of all kinds of documents, data files and
    messages in a machine-readable way. XML may also be human-readable, if the tag
    names are used self-explaining. XML is based on Unicode. SVG and MathML are based
    on XML, and there is an XML-based version of HTML.


    XML provides a syntax for expressing structured information in the form of an
    *XML document* with *elements* and *attributes*. The specific elements and attributes
    used in an XML document can come from any vocabulary, such as public standards
    or user-defined XML formats.'
