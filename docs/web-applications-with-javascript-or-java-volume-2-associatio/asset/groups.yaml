    包含没有关联所有权点的信息设计模型作为关系型数据库设计模型是可以接受的，但作为 OOP 语言的设计模型它是不完整的。


    例如，图 1.4 的模型提供了一个关系型数据库设计，包含两个实体表：`committees` 和 `clubmembers`，以及一个独立的一对一关系表 `committee_clubmember_as_chair`。它没有提供
    Java 类的设计，因为它没有指定如何通过引用属性来实现该关联。


    将非方向向关联的信息设计模型（不包含任何关联所有权点）转换为所有关联均为单向或双向的信息设计模型，有三种方案：我们可以在关联的任一末端或两个末端放置一个或多个所有权点。这三个方案中的每一个都定义了通过引用属性表示或实现关联的不同方法。因此，对于上述图
