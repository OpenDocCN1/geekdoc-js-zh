    # 12 Subtyping and Inheritance


    The concept of a subtype, or subclass, is a fundamental concept in natural language,
    mathematics, and informatics. For instance, in English, we say that a bird is
    an animal, or the class of all birds is a subclass of the class of all animals.
    In linguistics, the noun “bird” is a hyponym of the noun “animal”.


    An object type may be specialized by subtypes (for instance, Bird by Parrot) or
    generalized by subtypes (for instance, Bird and Mammal are generalized by Animal).
    Specialization and generalization are two sides of the same coin.


    A subtype inherits all from its supertypes. When a subtype inherits attributes,
    associations and constraints from a supertype, this means that features need not
    be repeatedly rendered for the subtype in the class diagram, but the reader of
    the diagram has to understand that all features of a subtype also apply to its
    subtypes.


    When an object type has more than one direct supertype, we have a case of multiple
    inheritance, which is common in conceptual modeling, but prohibited in many object-oriented
    programming languages, such as Java and C#, which only class hierarchies with
    a unique direct supertype for each type.


    # 12.1 Introducing Subtypes by Specialization


    A new object type may be introduced by specialization whenever it represents a
    special case of another object type. We illustrate this for example model where
    we capture text books and biographies as special cases of books. This means that
    text books and biographies also have an ISBN, a title and a publishing year, but
    in addition they have further features such as the attribute subjectArea for text
    books and the attribute for biographies. Consequently, in Figure 12.1, we introduce
    the object types Textbook and Biography by specializing the object type Book,
    that is, as subtypes of Book.


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_138_0.png)'
- md: '

    ## 124 12 Subtyping and Inheritance


    When specializing an object type, we define additional features for the newly
    added subtype. In many cases, these additional features are more specific properties.
    For instance, in the case of TextBook specializing Book, we define the additional
    attribute subjectArea. In some programming languages, such as in Java, it is required
    that the subtype extends the supertype.


    However, we can also specialize an object type without defining additional properties
    or operations/methods, but by defining additional constraints.


    ## 12.2 Introducing Supertypes by Generalization


    We illustrate generalization with the example shown in Figure 12.2.


    | Employee | | | Author |

    | :--- | :--- | :--- | :--- |

    | employeeNo : Integer (id) | | | authorId[1] : Integer (id) |

    | name : String | | isbn : String (id) | name[1] : String |

    | dateBirth : Date | | title : String | dateBirth : Date |

    | salary : Decimal | | year : Integer | dateDeath[0..1] : Date |

    | * | | * | biography[1] : Text |

    | Publisher | Book | authored | |

    | name : String (id) | Books | Books | |

    | address : String | 0.1 | * |


    **Figure 12.2:** The object types Employee and Author share several attributes.


    After adding the type Employee we notice that Employee and Author share a number
    of attributes due to the fact that both employees and authors are people, and
    being an employee as well as being an author are roles played by people. So, we
    may generalize these two object types by adding a joint supertype Person, as shown
    in the diagram of Figure 12.3.


    When generalizing two or more object types, we move those features that are shared
    by them to the newly added supertype where they are centralized. In the case of
    Employee and Author, this set of shared features consists of the attributes name,
    dateBirth and dateDeath. In general, shared features may include attributes, associations
    and constraints.


    Notice that since in an information design model, each top-level class needs to
    have a standard identifier, in the new class Person we have declared the standard
    identifier attribute personId, which is inherited by all subclasses. Therefore,
    we have to reconsider the attributes that had been declared to be standard identifiers
    in the subclasses before the generalization. In the case of Employee, we had declared
    the attribute employeeNo as a standard identifier. Since the employee is an important
    business information item, we have to keep this, even if it is no longer the standard
    identifier. Because it is an alternative identifier (a "Key"), we define a *uniqueness*
    constraint for it with the constraint keyword key.


    In the case of Author, we had declared the attribute authorId as a standard identifier.
    Assuming this attribute represents a purely technical, rather than business, information
    item, we dropped it, since it''s no longer needed as an identifier for authors.
    Consequently, we ended up with a model which allows to identify employees either
    by their employee number or by their personId value, and to identify authors by
    their personId.


    We consider the following extension of our original example model, shown in Figure
    12.4:

    1. the disjoint (but incomplete) segmentation of Book into TextBook and Biography,

    2. the overlapping and incomplete segmentation of Person into Author and Employee,
    which is further specialized by Manager.


    ## 12.3 Intention versus Extension


    The *intention* of an object type is defined by the set of its features, including
    attributes, associations, constraints and operations.


    The *extension* of an object type is the set of all objects instantiating the
    object type. The extension of an object type is also called its *population*.


