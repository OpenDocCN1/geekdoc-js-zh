- md: "\n## 4.4.2 Code Each Class of the Entity Model\n\nEach class of the Java Entity\
    \ class model is coded as an annotated bean class with name C having a default\
    \ constructor (no parameters) and a constructor with entity creation parameters.\n\
    \nFor instance, the Book class from the Entity class model is coded in the following-way:\n\
    \n```java\n@Entity( name=\"books\")\n@ViewScoped Bean(name=\"book\")\npublic class\
    \ Book {\n    @Id @NotNull(message=\"An ISBN is required!\")\n    private String\
    \ isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"A title is required!\"\
    )\n    private String title;\n    @Column(nullable=false)\n    @NotNull(message=\"\
    A year is required!\")\n    private Integer year;\n    @ManyToOne( fetch=FetchType.EAGER)\n\
    \    private Publisher publisher;\n\n    public Book() {}\n    public Book(String\
    \ isbn, String title,\n        Integer year, Publisher publisher) {\n        this.setIsbn(isbn);\n\
    \        this.setTitle(title);\n        this.setYear(year);\n        this.setPublisher(publisher);\n\
    \    }\n    ... // getters, setters, etc.\n}\n```\n\nThe @ManyToMany annotation\
    \ on the publisher is used for specifying the functionality type of the association\
    \ Book has Publisher publisher since it holds that a book has one publisher and\
    \ a publisher has many books. This annotation also allows to specify a fetch type\
    \ with the parameter fetching one of the following possible values:\n\n- FetchType.EAGER,\
    \ implying that a retrieval of an entity includes retrieval of the associated\
    \ entity referenced by the entity with this property. In our example, this means\
    \ that when a Book entity is retrieved, the Publisher entity referenced by the\
    \ book's publisher property is also retrieved. This behavior is very useful and\
    \ it should be used whenever the data to be retrieved can be handled in main memory.\n\
    \n- FetchType.LAZY, implying that referenced entities are not automatically retrieved\
    \ with a referencing entity. In our example, this means that the referenced Publisher\
    \ entity is not retrieved with a referencing Book entity, leaving the value of\
    \ the publisher property set to null. With this fetching behavior, referenced\
    \ entity has been retrieved separately by invoking the reference property's getter\
    \ in the context of a transaction (in our example by invoking getPublisher).\n\
    \nIn the case of a single-valued reference property (representing a functional\
    \ association) annotated with @OneToOne or @ManyToOne, the default value is FetchType.EAGER,\
    \ so referenced entities are fetched together with referencing entities, while\
    \ in the case of a non-functional association (with either @OneToMany or @ManyToMany),\
    \ the default value is FetchType.LAZY, so referenced entities are not fetched\
    \ together with referencing entities, but have to be retrieved separately, needed.\n\
    \nAs a result of JPA annotations, the following SQL table creation statement for\
    \ creating the tables is generated:\n\n```sql\nCREATE TABLE IF NOT EXISTS `books`\
    \ (\n`ISBN` varchar(10) NOT NULL,\n`TITLE` varchar(255) NOT NULL,\n`YEAR` int(11)\
    \ NOT NULL,\n`PUBLISHER_NAME` varchar(255) DEFAULT NULL\nFOREIGN KEY (`PUBLISHER_NAME`)\
    \ REFERENCES `publishers` (`NAME`)\n);\n```\n\n## 4.4.3 Code the Constraints\n\
    \nTake care that all property constraints specified in the entity class model\
    \ are properly coded using suitable Bean Validation annotations. For instance,\
    \ for the attribute name, we have to use the JPA annotation @Id for specifying\
    \ that the attribute corresponds to the primary key column of the database table\
    \ to which the entity class is mapped, and the Bean Validation annotation @NotNull\
    \ for defining a mandatory value constraint that is checked before an entity is\
    \ saved to the database.\n\nIn the case of the address attribute, we have to define\
    \ a mandatory value constraint in two forms: with the JPA annotation @Column(nullable=false)\
    \ for the corresponding table column, and with the Bean Validation annotation\
    \ @NotNull for the attribute.\n\n```java\n@Id @NotNull(message=\"A name is required!\"\
    )\nprivate String name;\n```\n\n```java\n@Column(nullable=False)\n@NotNull(message=\"\
    An address is required!\")\nprivate String address;\n```\n\nNotice that, unfortunately,\
    \ the current Java EE technology requires defining the same constraint twice,\
    \ once for the database in the form of a JPA annotation, and for the Java app\
    \ in the form of a Bean Validation annotation.\n\n## 4.4.4 Code Getters and Setters\n\
    \nCode the setter operations as (instance-level) methods. The setters only assign\
    \ values and do not perform any validation, since the property constraints are\
    \ only checked before save by the Java EE execution environment. The getters simply\
    \ return the actual values of properties.\n\n## 4.4.5 Implement a Deletion Policy\n\
    \nFor any reference property, we have to choose and implement a deletion policy\
    \ for taking care of the corresponding object destruction dependency in the delete\
    \ method of the reference property’s range class. In our case, we have to choose\
    \ between\n\n1. deleting all books published by the deleted publisher;\n2. dropping\
    \ from all books published by the deleted publisher reference to the deleted publisher.\n\
    \nWe choose the second policy, which can only be used if the case of an optional\
    \ reference property such as book.publisher. This is shown in the following code\
    \ of the Publisher.delete method where all book entities concerned the property\
    \ publisher is cleared.\n\n```java\npublic static void delete(EntityManager em,\
    \ UserTransaction ut) throws Exception {\n    ut.begin();\n    Publisher publisher\
    \ = em.find(Publisher.class, name);\n    // // find All Books which has this publisher\n\
    \    Query query = em.createQuery(\"SELECT b FROM Book b WHERE b.publisher.name\
    \ = :name\");\n    query.setParameter(\"name\", name);\n    List<Book> books =\
    \ query.getResultList();\n    for (Book b : books) {\n        b.setPublisher(null);\n\
    \    }\n    em.remove(publisher);\n    ut.commit();\n}\n```\n\nThe method loops\
    \ through all entities referencing the publisher and sets its property to null.\n\
    \n## 4.4.6 Serialization and De-Serialization\n\nBased on JPA annotations, together\
    \ with suitable converter classes when needed, serialization (from Java objects\
    \ to table rows) as well as the corresponding de-serialization (from table columns\
    \ to Java objects) are performed automatically.\n\n## 4.5 The View and Controller\
    \ Layers\n\nThe user interface (UI) consists of a start page navigating to the\
    \ data management pages and one UI page for each object type and data management\
    \ case. All UI pages are defined in the form of JSF view files in subfolders of\
    \ WebContent. We create the Main page index.xhtml in the subfolder WebContent/views/app\
    \ with the following content:\n\n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \n      xmlns:ui=\"http://java.sun.com/jsf/face\"\n      xmlns:f=\"http://java.sun.com/jsf/core\"\
    >\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h2>Public Library</h2>\n<h:button value=\"Manage publishers\" outcome=\"\
    /views/publishers/index\" />\n<h:button value=\"Manage books\" outcome=\"/views/books/index\"\
    \ />\n<h:form>\n  <h:commandButton value=\"Clear database\" action=\"#{appCtrl.clearData()}\"\
    \ />\n  <h:commandButton value=\"CreateTest data\" action=\"#{appCtrl.createTestData()}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n</html>\n```\n\nIt creates the\
    \ menu buttons which provide the corresponding views for each of the management\
    \ pages. Additionally, we need to create a corresponding AppController class which\
    \ is responsible for the creation and deletion of the test data. The controller\
    \ is used to combine code of the Publisher.createTestData and Book.clearData and\
    \ Publisher.clearData methods as follows:\n\n```java\n@ManagedBean(name=\"appCtrl\"\
    ) @SessionScoped\npublic class AppController {\n    @PersistenceContext(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource\n    UserTransaction\
    \ ut;\n\n    public String clearData() {\n        try {\n            Book.clearData(em,\
    \ ut);\n            Publisher.clearData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n\n    public String createTestData() {\n        try {\n            Publisher.createTestData(em,\
    \ ut);\n            Book.createTestData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n}\n```\n\nThe deletion of Book and Publisher data must be done in a particular\
    \ order for avoiding referential integrity violations (books have to be deleted\
    \ first, before their publishers are deleted).\n"
  mdcn: "\n\n## 4.4.2 为实体模型中的每个类编码\n\nJava 实体类模型中的每个类都被编码为一个带有注解的 Bean 类，名称为 C，它有一个默认构造函数（无参数）以及一个带有实体创建参数的构造函数。\n\
    \n例如，实体类模型中的 `Book` 类按以下方式编码：\n\n```java\n@Entity( name=\"books\")\n@ViewScoped\
    \ Bean(name=\"book\")\npublic class Book {\n    @Id @NotNull(message=\"An ISBN\
    \ is required!\")\n    private String isbn;\n    @Column(nullable=false)\n   \
    \ @NotNull(message=\"A title is required!\")\n    private String title;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"A year is required!\")\n    private Integer year;\n  \
    \  @ManyToOne( fetch=FetchType.EAGER)\n    private Publisher publisher;\n\n  \
    \  public Book() {}\n    public Book(String isbn, String title,\n        Integer\
    \ year, Publisher publisher) {\n        this.setIsbn(isbn);\n        this.setTitle(title);\n\
    \        this.setYear(year);\n        this.setPublisher(publisher);\n    }\n \
    \   ... // getters, setters, etc.\n}\n```\n\n在 `publisher` 上的 `@ManyToMany` 注解用于指定\
    \ `Book` 与 `Publisher publisher` 关联的功能类型，因为它认为一本书有一个出版社，而一个出版社有许多本书。该注解还允许通过参数\
    \ `fetching` 指定获取类型，该参数取值可以是以下可能值之一：\n\n- `FetchType.EAGER`，意味着获取一个实体包括获取由该实体属性引用的关联实体。在我们的示例中，这意味着当获取一个\
    \ `Book` 实体时，由书的 `publisher` 属性引用的 `Publisher` 实体也会被获取。这种行为非常有用，每当要获取的数据可以在主内存中处理时都应该使用它。\n\
    \n- `FetchType.LAZY`，意味着引用的实体不会随着引用实体一起自动获取。在我们的示例中，这意味着引用的 `Publisher` 实体不会随着引用的\
    \ `Book` 实体一起获取，导致 `publisher` 属性的值被设置为 `null`。通过这种获取行为，引用的实体是在事务上下文中调用引用属性的 getter\
    \ 方法（在我们的示例中是通过调用 `getPublisher`）单独获取的。\n\n在带有 `@OneToOne` 或 `@ManyToOne` 注解的单值引用属性（代表功能性关联）的情况下，默认值为\
    \ `FetchType.EAGER`，因此引用的实体与引用实体一起获取；而在非功能性关联（使用 `@OneToMany` 或 `@ManyToMany`）的情况下，默认值为\
    \ `FetchType.LAZY`，因此引用的实体不会与引用实体一起获取，而需要在需要时单独获取。\n\n作为 JPA 注解的结果，生成了用于创建表的以下\
    \ SQL 表创建语句：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n`ISBN` varchar(10)\
    \ NOT NULL,\n`TITLE` varchar(255) NOT NULL,\n`YEAR` int(11) NOT NULL,\n`PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL\nFOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers`\
    \ (`NAME`)\n);\n```\n\n## 4.4.3 为约束编码\n\n请确保实体类模型中指定的所有属性约束都已使用合适的 Bean Validation\
    \ 注解进行了正确编码。例如，对于属性名称，我们必须使用 JPA 注解 `@Id` 来指定该属性对应于实体类所映射的数据库表的主键，并使用 Bean Validation\
    \ 注解 `@NotNull` 来定义强制性值约束，该约束在实体保存到数据库之前会进行检查。\n\n在 `address` 属性的情况下，我们必须以两种形式定义强制性值约束：使用\
    \ JPA 注解 `@Column(nullable=false)` 对应相应的表列，以及使用 Bean Validation 注解 `@NotNull`\
    \ 对应属性。\n\n```java\n@Id @NotNull(message=\"A name is required!\")\nprivate String\
    \ name;\n```\n\n```java\n@Column(nullable=False)\n@NotNull(message=\"An address\
    \ is required!\")\nprivate String address;\n```\n\n注意到，遗憾的是，目前的 Java EE 技术需要定义两次相同的约束：一次是以\
    \ JPA 注解的形式针对数据库，另一次是以 Bean Validation 注解的形式针对 Java 应用程序。\n\n## 4.4.4 为 Getter\
    \ 和 Setter 编码\n\n将 setter 操作编码为（实例级）方法。setters 只负责赋值，不执行任何验证，因为属性约束仅由 Java EE\
    \ 执行环境在保存之前进行检查。getters 简单地返回属性的实际值。\n\n## 4.4.5 实现删除策略\n\n对于任何引用属性，我们必须选择并实现删除策略，以处理引用属性范围类中删除方法对应的对象销毁依赖。在我们的案例中，我们必须在以下两者之间选择：\n\
    \n1. 删除所有由已删除出版社出版的书；\n2. 从所有由已删除出版社的书中删除对已删除出版社的引用。\n\n我们选择第二种策略，该策略仅适用于可选引用属性的情况（如\
    \ `book.publisher`）。这在 `Publisher.delete` 方法的后续代码中所示，其中所有涉及 `publisher` 属性的 `book`\
    \ 实体都被清除了。\n\n```java\npublic static void delete(EntityManager em, UserTransaction\
    \ ut) throws Exception {\n    ut.begin();\n    Publisher publisher = em.find(Publisher.class,\
    \ name);\n    // // 找到所有拥有此出版社的书\n    Query query = em.createQuery(\"SELECT b\
    \ FROM Book b WHERE b.publisher.name = :name\");\n    query.setParameter(\"name\"\
    , name);\n    List<Book> books = query.getResultList();\n    for (Book b : books)\
    \ {\n        b.setPublisher(null);\n    }\n    em.remove(publisher);\n    ut.commit();\n\
    }\n```\n\n该方法遍历所有引用出版社的实体并将其属性设置为 `null`。\n\n## 4.4.6 序列化与反序列化\n\n基于 JPA 注解，序列化（从\
    \ Java 对象到表行）以及反序列化（从表列到 Java 对象）会自动执行。\n\n## 4.5 视图与控制器层\n\n用户界面（UI）由导航到数据管理页面的首页以及每个对象类型的\
    \ UI 页面组成。所有的 UI 页面以 JSF 文件的形式定义在 Content 的 子目录下。我们在 WebContent/views/app 创建主页\
    \ index.xhtml，内容如下：\n\n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \n      xmlns:ui=\"http://java.sun.com/jsf/face\"\n      xmlns:f=\"http://java.sun.com/jsf/core\"\
    >\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h2>公共图书馆</h2>\n<h:button value=\"管理出版社\" outcome=\"/views/publishers/index\"\
    \ />\n<h:button value=\"管理书籍\" outcome=\"/views/books/index\" />\n<h:form>\n \
    \ <h:commandButton value=\"清除数据库\" action=\"#{appCtrl.clearData()}\" />\n  <h:commandButton\
    \ value=\"创建测试数据\" action=\"#{appCtrl.createTestData()}\" />\n</h:form>\n</ui:define>\n\
    </ui:composition>\n</html>\n```\n\n它创建了菜单按钮，为每个管理页面提供相应的视图。此外，我们需要创建一个相应的 AppController\
    \ 类，它负责测试数据的创建和删除。该控制器用于整合 `Publisher.createTestData`、`Book.clearData` 以及 `Publisher.clearData`\
    \ 方法如下：\n\n```java\n@ManagedBean(name=\"appCtrl\") @SessionScoped\npublic class\
    \ AppController {\n    @PersistenceContext(unitName=\"UnidirAssocApp\")\n    private\
    \ EntityManager em;\n    @Resource\n    UserTransaction ut;\n\n    public String\
    \ clearData() {\n        try {\n            Book.clearData(em, ut);\n        \
    \    Publisher.clearData(em, ut);\n        } catch (Exception e) {\n         \
    \   e.printStackTrace();\n        }\n        return \"index\";\n    }\n\n    public\
    \ String createTestData() {\n        try {\n            Publisher.createTestData(em,\
    \ ut);\n            Book.createTestData(em, ut);\n        } catch (Exception e)\
    \ {\n            e.printStackTrace();\n        }\n        return \"index\";\n\
    \    }\n}\n```\n\n删除 Book 和 Publisher 数据必须按照特定顺序进行，以避免违反引用完整性约束（必须先删除书籍，然后再删除它们的出版社）。\n\
    \n"
