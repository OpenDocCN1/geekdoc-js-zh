    \ columns=\"3\">\n<h:outputLabel for=\"authors\" value=\"Authors\"/>\n<h:selectManyListBox\
    \ id=\"authors\" value=\"#{book.authors}\">\n<f:selectItems items=\"#{authorController.authors}\"\
    \ var=\"a\"\nitemLabel=\"#{a.name}\" itemValue=\"#{a}\" />\n<f:converter converterId=\"\
