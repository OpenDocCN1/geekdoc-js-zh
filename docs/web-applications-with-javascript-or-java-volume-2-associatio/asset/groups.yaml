    e-ISBN (EPUB) 978-3-11-049756-4\n\nLibrary of Congress Control Number: 2020948051\n\
    \nBibliographic information published by the Deutsche Nationalbibliothek\nThe\
    \ Deutsche Nationalbibliothek lists this publication in the Deutsche Nationalbibliografie;\
    \ detailed data are available on the Internet at http://dnb.dnb.de.\n\n© 2021\
    \ Walter de Gruyter GmbH, Berlin/Boston\nCover image: monsitj/Stock/thinkstock\n\
    Typesetting: Integra Software Services Pvt. Ltd.\nPrinting and binding: CPI books\
    \ GmbH, Leck\n\nwww.degruyter.com\n\nTo Our Families.\n\n# Foreword\n\nThis two-volume\
    \ book shows how to design and implement web applications with a model-based approach,\
    \ the two most relevant platforms for web development: JavaScript and Java. Web\
    \ apps are designed with the help of information models in UML class diagrams\
    \ and implemented as:\n\n1. JavaScript front-ends, using one of the two local\
    \ storage technologies offered by browsers;\n2. Java back-end apps, using Server\
    \ Faces (JSF) as the user interface technology, Java Persistence API (JPA) for\
    \ object-to-storage mapping, and MySQL/MariaDB database system.\n\nThe focus of\
    \ the book is general concepts and techniques concerning the fundamental management\
    \ issues of:\n- integrity constraints and data validation,\n- enumerations and\
    \ attributes,\n- bidirectional associations between object types,\n- subtyping\
    \ and inheritance in class hierarchies.\n\nThe first two issues are discussed\
    \ in Volume 1, while the last two are discussed in Volume 2. We assume that the\
    \ reader is already familiar with HTML and at least one object-oriented programming\
    \ language, such as C++, Java, PHP or C#. In addition, we assume that the reader\
    \ has some familiarity with JavaScript, is interested to learn more. The book\
    \ can be used in web development courses for students of Computer Science or related\
    \ disciplines; \n- by JavaScript developers for learning Java;\n- by Java developers\
    \ for learning JavaScript;\n- by JavaScript and Java (and PHP/C#) developers for\
    \ learning object-oriented (OO) programming with JavaScript or Java. The book\
    \ comes with the complete source code of six example apps you can run or download\
    \ from our server.\n\n# Contents\n\nForeword — VII\nList of Figures — XIII\nList\
    \ of Tables — XV\n\n# Part I: Associations\n\n1 Reference Properties and Unidirectional\
    \ Associations — 3\n1.1 References and Properties — 4\n1.2 Referential Integrity\
    \ — 6\n1.3 Modeling Reference Properties as Unidirectional Associations — 6\n\
    1.4 Representing Unidirectional Associations as Reference — 8\n1.5 Adding Directionality\
    \ to a Non-Directed Association — 9\n1.6 Running Example — 10\n1.7 Eliminating\
    \ Unidirectional Associations — 11\n1.8 Rendering Reference Properties in the\
    \ User Interface — 15\n1.9 Collection Types for Multi-Valued Reference Properties\
    \ — 15\n1.10 Questions — 16\n\n2 Implementing Unidirectional Associations with\
