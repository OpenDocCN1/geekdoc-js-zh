    \ book.title, book.publisher, book.authors)}\" />\n</h:form>\n<h:button value=\"\
    Back\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\nRemember\
    \ that we have to add the equals method for the Author model class. In our case,\
