    | :--- | :--- |

    | 1..3.* | x : Integer

    y : Integer |


    | Polygon | Point |

    | points[3..] : Point | x : Integer

    y : Integer |


    Figure 1.9: Turning a non-functional association end into a multi-valued reference
    property.


    ### 1.7.2 Eliminating Associations from the Design Model


    In the case of our running example, the Publisher-Book-Author information design
    model, we have to replace both unidirectional associations with suitable reference
    properties. In the first step, we replace the many-to-one association Book-has-Publisher
    in the model of Figure 1.6 with a functional reference property publisher in the
    class Book, resulting in the OO class model shown in Figure 1.10:


