    - manyToMany to the reference property Book::authors\n- manyToMany to the derived\
    \ property Author::/authoredBooks\n\n- For any reference property designated as\
    \ the inverse of (inverse of...) another reference property, replace it with a\
    \ {mappedBy=\"...\"} property modifier.\n\n- Create the required property constraint\
