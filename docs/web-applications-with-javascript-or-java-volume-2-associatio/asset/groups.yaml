    \n# 3.6 How to Run the App and Get the Code\n\nYou can run the app from our server\
    \ and download it as a ZIP archive file.\n\n# 3.7 Points of Attention\n\nWe have\
    \ still included the repetitive code structures (called boilerplate code) in the\
    \ model layer per class and per property for constraint validation (checks and\
    \ setters) and per class for the data storage management methods add, update,\
    \ and destroy. While it is good to write this code a few times for learning app\
    \ development, you don't want to write it again and again when you work on real\
    \ projects. For avoiding repetitive boilerplate code, generic forms of these methods\
    \ are needed, such that they can be reused in all model classes of an app. For\
    \ instance, the cLASSjs library provides such an approach.\n\n# 4 Implementing\
    \ Unidirectional Functional Associations with Java EE\n\nA unidirectional functional\
    \ association is either one-to-one or many-to-one. In both cases such an association\
    \ is represented, or implemented, with the help of a single-valued reference property.\n\
    \nIn this chapter, we show:\n\n- 1. how to derive a data model in the form of\
    \ a Java Entity class model from an OO class model with single-valued reference\
    \ properties representing unidirectional functional associations,\n- 2. how to\
    \ code the Java Entity class model in the form of entity classes (implementing\
    \ model classes),\n- 3. how to write the view and controller code based on the\
    \ entity classes.\n\n# 4.1 Implementing Single-Valued Reference Properties in\
    \ Java\n\nA single-valued reference property, such as the publisher of the object\
    \ type Book, allows storing internal references to objects of another type, such\
    \ as Publisher. When creating a new object, the constructor needs to have a parameter\
    \ for allowing to assign a suitable value to the reference property. In a typed\
    \ programming language, the constructor needs to have a parameter for allowing\
    \ to assign a suitable value to the reference property.\n\n```java\n@Entity\n\
    @Table(name=\"books\")\npublic class Book {\n\n    private String isbn;\n    private\
    \ String title;\n    private Integer year;\n    private Publisher publisher;\n\
    \n    public Book() {}\n\n    public Book(String isbn, String title, Integer year,\
    \ Publisher publisher) {\n        this.isbn = isbn;\n        this.title = title;\n\
    \        this.year = year;\n        this.publisher = publisher;\n    }\n\n   \
    \ public String getIsbn() { return isbn; }\n    public void setIsbn(String isbn)\
    \ { this.isbn = isbn; }\n    public String getTitle() { return title; }\n    public\
    \ void setTitle(String title) { this.title = title; }\n    public Integer getYear()\
    \ { return year; }\n    public void setYear(Integer year) { this.year = year;\
