    );\nADD CONSTRAINT FK_employees_PERSONID FOREIGN KEY (PERSONID) REFERENCES persons\
    \ (PERSONID);\n```\n\n可见，每个表都包含对应类定义的直接属性。此外，authors 表和 employees 表通过外键约束关联到 `persons`\
    \ 表的 `PERSONID` 列。\n\n## 14.3.4 编写视图和控制器代码\n\n在用户界面中，对于每个 bean 类，我们都有一个包含创建、更新和删除\
