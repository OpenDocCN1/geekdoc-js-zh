    图 12.11：表示人角色层次结构的 MCI（多表继承）表模型。


    可以通过以下步骤从信息设计模型推导出 MCI 模型：

    1. 将所有类中的标准 ID 属性修饰符 {id} 替换为 {pkey}以指示标准 ID 属性是*主键*。

    2. 将单数（大写字母）类名（*Person, Author, 等*）替换为复数小写表名（*people, authors, 等*），并将驼峰命名属性（*personId*
    和 *empNo*）替换为小写下划线分隔的列（*person_id* 和 *emp_no*）。

    3. 为所有类矩形添加 «table»立体类型。

    4. 将平台无关的数据类型名称替换为 SQL 数据类型名称。

    5. 移除所有泛化/继承箭头，并将父表的所有列（例如来自 people 的 *person_id* 和 *name*）添加到到它们的子表（authors 和
    employees）中。


    每个表将只填充与所表示类的直接实例对应的行。该模型的一个可接受数据示例如下：


    | people | name |

    | :--- | :--- |

    | personId | |

    | 1003 | Tom Daniels |


    | authors |

    | person_id | name | biography |

    | :--- | :--- | :--- |

    | 1001 | Harry Wagner | 1956年出生于马萨诸塞州波士顿 . . . |

    | 1077 | Immanuel Kant | 曼努埃·康德（1724–1804）是一位德国哲学家 . . . |


    | person_id | name | emp_no |

    |---|---|--|

    | 1001 | Harry Wagner | 21035 |


    | person_id | name | emp_no | department |

    |---|---|---|--|

    | 1002 | Peter Boss | 23107 | Sales |


    **TCI 方法的优点：** (1) 从其元素（类）的角度来看，给定的类层次结构被显式表示。(2) 当给定类层次结构的片段互不相交时，TCI 是内存高效且无冗余的存储。


    **缺点：** (1) TCI 方法未能忠实表示原始类层次结构中表达的子类型关系。特别是对于任何代表子类实例（员工、经理或作者）的行，没有信息表明它代表了父类实例（人）。因此，TCI
    模式没有告知有关所表示的子类型关系；相反，这些保留在应用程序类模型中的元数据与数据库解耦了。(2) TCI 方法需要重复列定义，这是一种模式冗余。(3) 每当片段子类发生重叠时，TCI
    方法可能会导致数据冗余。在我们的示例中，作者也可以是员工，因此对于重叠中的任何人，我们需要对表示父类属性的所有列进行重复数据存储（在我们的示例中，这仅涉及属性名）。


    ### 12.7.4.3 关联表（Joined Tables）


    为了避免在片段重叠时出现 TCI 的数据冗余问题，可以使用如下所示的 SQL 表模型的 JTI 方法。该模型通过将其主键列同时定义为引用其主键的外键，将表示子类的表与表示父类的表连接起来。注意外键以带有
    «fkey»立体类型的的形式可视化，并在源表侧标注外键列名。


    ![img/1a8b60b42ede8e4d7e1a745ae019_155.png]


    表示人角色层次结构的 JTI 表模型。


    该模型的一个可接受数据示例如下：


    | person_id | name |

    | :--- | :--- |

    | 1001 | Harry Wagner |

    | 1002 | Peter Boss |

    | 1003 | Tom Daniels |

    | 1077 | Immanuel Kant |


    | person_id | name | biography |

    | :--- | :--- | :--- |

    | 1001 | Harry Wagner | 1956年出生于马萨诸塞州波士顿 . . . |

    | 1077 | Immanuel Kant | 曼努埃·康德（1724–1804）是一位德国哲学家 . . . |


    | person_id | name | emp_no |

    |---|---|--|

    | 1001 | Harry Wagner | 21035 |

    | 1002 | Peter Boss | 23107 |


    | person_id | name | emp_no | department |

    |---|---|---|--|

    | 1002 | Peter Boss | 23107 | Sales |


    **JTI 方法的优点：** (1) 子类型关系和类层次结构被显式保留。(2) 避免了片段重叠时的数据冗余问题。


    **缺点：** (1) JTI 方法的主要缺点是查询子类需要连接表，这可能会产生性能问题。


    '
