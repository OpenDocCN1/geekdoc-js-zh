    \ String (id) |\n| |get/set>-title[1]: String |\n| |get/set>-year[1]: Integer\
    \ |\n| |get/set>-publisher[0..1]: Publisher (manyToOne) |\n| |get/set>-authors[*]:\
    \ Author (manyToMany) |\n| +checkAuthorId(in isbn : String) : ConstraintViolation\
    \ |\n| +addAuthor(in author : Author) |\n| +removeAuthor(in author : Author) |\n\
    | +toString(): String |\n| +...() |\n\n| Java Entity Author |\n|---|--- |\n| |get/set>-personId[1]:\
