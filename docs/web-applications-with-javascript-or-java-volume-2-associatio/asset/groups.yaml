    ## 1.10.1 问题 1：“一对一”的含义


    说一个关联是“一对一”意味着什么？

    这意味着它是（选择单项）：


    - 1. O 双向的

    - 2. O 既是函数性的也是全覆盖的

    - 3. O 函数性的

    - 4. O 既是函数性的也是反函数性的


    ## 1.10.2 问题 2：何时检查引用完整性


    对于对于域类为 C、范围类为 D 的引用属性 p，其引用完整性约束在以下任何情况下必须检查（选择一项或多项）：


    - 1. 一个类型 C 的对象被销毁。

    - 2. 某个类型 C 对象的 p 值被更改。

    - 3. 创建了一个类型 C 的对象。

    - 4. 一个类型 D 的对象被销毁。

    - 5. 创建了一个类型 D 的对象。


    ## 1.10.3 问题 3：“函数性”的含义


    单向关联是函数性的，当且仅当（选择单项）：


    - 1. O 源类的每个对象最多链接目标类的一个对象。

    - 2. O 目标类的每个对象至少链接源类的一个一个对象。

    - 3. O 源类的每个对象至少链接目标类的一个对象。

    - 4. O 源类的每个对象恰好链接目标类的一个对象。


    ## 1.10.4 问题 4：对象销毁依赖


    假设我们有一个类型 B 对象，具有标准标识属性 id，以及一个类型 A 对象，具有一个引用 B::id 的 引用属性 b_id。进一步，假设有一个 b.id
    = 11 的类型 B 对象和一个 a.b_id = 11 的类型 A 对象。以下哪些陈是正确的？选择一项或多项：


    - 1. 当对象 a 中的 ID 引用未被分配（在 JS 中将 a.b_id 设置为 undefined，在 Java 中设为 null）且没有其他对象引用
    b 时，对象 b 可以被销毁。

    - 2. 只有在 b 之前已经被销毁的情况下，对象 a 才能被销毁。

    - 3. 当对象 a 中的 ID 引用被重置为另一个类型 B 的对象时（例如通过设置 a.b_id = 7），且没有其他对象引用 b 时，对象 b 可以被销毁。

    - 4. 在 a 之前已经被销毁的情况下，对象 b 可以被销毁。


    ## 1.10.5 问题 5：单值引用属性的渲染


    关于**单值引用属性 p** 以及它如何通过合适的表单控件在 Web 用户界面中进行渲染，以下哪些陈述是正确的？选择一项或多项：


    - 使用 type="text" 的 *input* 控件可以获得适当的渲染。

    - 如果 *p* 范围的基数不大于 7，可以通过复选按钮组进行渲染。

    - 如果 *p* 范围的基数不大于 7，可以通过单选按钮组进行渲染。

    - 它可以通过单选控件进行渲染。


    ## 1.10.6 问题 6：表达功能类型


    可以使用哪种“x-to-y”形式的术语（其中 x,y 表示“一个”或“多个”）来表达一个关联既不是函数性的也不是反函数性的？


    答案：\__________________


    ## 2 使用原生 JS 实现单向函数性关联


    单向函数性关联要么一对一，要么多对一。在这两种情况下，这种关联都通过单值引用属性表示或实现。


    在本章中，我们将展示：


    - 1. 如何从具有表示单向函数性关联的单值引用属性的 OO 类模型导出 JS 类模型，

    - 2. 如何以原生 JavaScript 模型类的形式编写 JS 类模型，

    - 3. 如何基于模型代码编写视图和控制器代码。


    在展示如何推导 JS 类模型并用 JavaScript 编写它之前，我们首先介绍 JavaScript 语言的几个新元素，我们将在书中讨论的 JavaScript
    代码中使用它们。


    ## 2.1 新的 JavaScript 元素


    在本节中，我们介绍由 ECMAScript 2015+ 引入 JavaScript 的重要新语言元素（即 2015+16+17+18+19+20+……）。


    ### 2.1.1 使用 let 和 const 进行块作用域变量声明


    ES5 不允许作用域为大括号 { } 定义的块或由 for 循环定义的块的变量。相反，所有用 var 声明的变量即使在块内声明，也具有函数作用域或全局作用域。使用
    let 和 const 进行块作用域声明的新功能允许局部变量具有细粒度的作用域，这有助于避免无意重复并使代码更具模块化。


    let 和 const 之间有一个含义上的区别。用 const 声明的变量是冻结或不可变，，在这个意义上是常量，而 let 变量不是。对于所有不应改变值的变量，最好使用
    const。否则，或者如果不清楚，如果是块作用域变量，应该用 let 声明，如果是全局或函数作用域变量，则用 var 声明。


    ### 2.1.2 箭头函数


    与经典的 JS 函数相比，箭头函数（带有 =>）提供了更简洁的函数表达式语法，允许从词法作用域捕获 `this`，并且没有自己的 `this` 绑定。


