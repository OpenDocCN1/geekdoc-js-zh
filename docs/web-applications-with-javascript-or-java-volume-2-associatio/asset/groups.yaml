    +   1. Code each class of the Java Entity class model as a corresponding entity
    class.

    2. Code an (id) property modifier with the JPA annotation @Id.

    3. Code any property modifier denoting the functionality of a reference property,
    such as (ManyToOne), with the corresponding JPA annotation, such as @ManyToOne.

    4. Code the integrity constraints specified in the model with the help of Java
    Bean Validation annotations (or custom validation annotations).

    5. Code the getters and setters as well as the add and remove methods for valued
    properties.

    6. Code the create, retrieve, update and delete storage management operations
    as class-level methods.

    7. Take care of the inverse relation management in the create and update methods.


    These steps are discussed in more detail in the following sections.


