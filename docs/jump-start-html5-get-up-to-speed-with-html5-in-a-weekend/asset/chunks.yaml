  trans: "\n\n在本短章节中，我们将学习如何编写代码，告诉浏览器在不支持 `canvas` 渲染时应该如何处理。\n\n## 创建替代内容\n\n处理用户浏览器可能不支持\
    \ `canvas` 这种情况的最佳方法是在 `<canvas>` 标签内放置替代内容。这样可以避免用户在无法看到本应显示的内容时产生困惑。\n\n你可以使用\
    \ `img` 标签、解释性文本或任何你认为对该替代内容必要的 HTML 标签。例如：\n\n```html\n<canvas id=\"MyCanvas\"\
    \ width=\"150\" height=\"300\">\n  <img src=\"http://yoursite.com/locationofimage.jpg\"\
    \ \n  alt=\"浏览器不支持此功能\" />\n</canvas>\n```\n\n如果浏览器支持 `canvas`，则 `img` 标签以及 `<canvas>`\
    \ 和 `</canvas>` 标签之间的任何内容都将被忽略，且不会显示在文档中。\n\n你希望回退内容有多用用取决于你的决定；你可以提供指向用户最新版本浏览器的链接，或者添加一个框架，允许你使用不同的技术（如\
    \ `SVG` 或 `Flash`）显示内容。\n\n你也可以在 JavaScript 中使用 `getContext` 方法来检查对 `canvas` 的支持，例如：\n\
    \n```javascript\nfunction supports_canvas() {\n  return !!document.createElement('canvas').getContext;\n\
    }\n```\n\n或者，你可以在现有元素上使用 `getContext` 方法：\n\n```javascript\nvar canvas = document.createElement(\"\
    MyCanvas\");\nif (!canvas.getContext || !canvas.getContext(\"2d\")) {\n    alert(\"\
    抱歉 - 不支持 canvas.\");\n}\nelse {\n    // 开始绘制\n    var ctx = canvas.getContext('2d');\n\
    }\n```\n\n# 第 15 章\n\n### Canvas & SVG: Canvas 渐变\n\n使用 HTML5 `canvas`，你不再局限于纯色，而是可以使用渐变来填充矩形和圆形等形状。你可以使用两种类型的渐变：\n\
    \n```javascript\n// 创建线性渐变\ncreateLinearGradient(x,y,x1,y1)\n```\n\n![线性渐变示例](img/gradient_example_1.png)\n\
    \n图 15.1. 线性渐变示例\n\n```javascript\n// 创建径向渐变\ncreateRadialGradient(x,y,r,x1,y1,r1)\n\
    ```\n\n![径向渐变示例](img/radial_gradient_2.png)\n\n图 15.2. 径向渐变示例\n\n让我们从创建一个线性渐变开始（画布上下文\
    \ `ctx` 已定义定义）：\n\n```javascript\n// 创建线性渐变\nvar grd = ctx.createLinearGradient(0,0,400,0);\n\
    grd.addColorStop(0,\"blue\");\ngrd.addColorStop(1,\"yellow\");\n\n// 使用渐变填充\n\
    ctx.fillStyle = grd;\nctx.fillRect(40,20,300,160);\n```\n\n结果所示图 15.3。\n\n![我们的蓝黄色线性渐变](img/canvasGRADIENTBY.png)\n\
    \n图 15.3. 我们的蓝黄色线性渐变\n\n第一行 `var grd = ctx.createLinearGradient(0,0,400,0);` 创建了一个\
    \ `CanvasGradient` 对象，它定义了两个组坐标 (x1,y1,x2,y2) 之间的渐变。这些坐标决定了渐变的大小和方向。在示例中，我们使用从\
    \ (0,0) 到 (400,0)，产生了一个宽度为 400 像素的水平渐变。如果我们的框更宽，最后一种颜色将相应延伸。\n\n如果我们需要一个 300px\
    \ 的垂直渐变，可以使用：\n\n```javascript\nvar grd = ctx.createLinearGradient(0,0,0,300);\n\
    ```\n\n在 100x100px 空间内的 45 度对角渐变定义为：\n\n```javascript\nvar grd = ctx.createLinearGradient(0,0,100,100);\n\
    ```\n\n我们现在可以使用 `addColorStop` 方法设置该渐变中某些**颜色停止点**（color stop）的颜色值。该方法接收两个值：\n\
    \n*   介于 `0`（线性渐变最左端）和 `1`（渐变最右端）之间的停止值\n*   一种颜色\n\n我们在停止值为 0（或坐标 (0,0)）处使用了\
    \ `\"blue\"`，在停止值为 1（或坐标 (400,0)）处使用了 `\"yellow\"`。浏览器使用这些值定义从蓝色到黄色的平滑颜色渐变。\n\n\
    你可以添加任意数量的渐变停止点。例如，在停止值为 0.5 处添加 `\"red\"` 颜色停止点将创建一个从蓝色到中间（200px）红色再到黄色黄色平滑渐变。\n\
    \n## 径向渐变\n\n现在让我们来看径向渐变：\n\n```javascript\n// 创建径向渐变\nvar grd = ctx.createRadialGradient(150,100,10,180,120,200);\n\
    grd.addColorStop(0,\"blue\");\ngrd.addColorStop(1,\"yellow\");\n\n// 使用渐变填充\n\
    ctx.fillStyle = grd;\nctx.fillRect(0,0,300,150);\n```\n\n`createRadialGradient`\
    \ 的参数是：\n\n*   起始圆的 x 和 y 坐标\n*   起始圆的半径\n*   结束圆的 x 和 y 坐标\n*   结束圆的半径\n\n结果所示图\
    \ 15.3。\n\n"
- fmt: "\nIn order to then draw the video to `canvas`, you'll need to add a handler\
    \ for the video's `onplay` event, which copies the current video frame.\n\n```\n\
    var canvas = document.getElementById('MyCanvas')\nvar ctx = canvas.getContext('2d');\n\
    \n// set canvas dimensions to same as video\nvideo.onplay = function() {\n   \
    \ canvas.width = video.videoWidth;\n    canvas.height = video.videoHeight;\n \
    \   draw();\n};\n\n// copy frame to canvas\nfunction draw() {\n    if(video.paused\
    \ || video.ended) return false;\n    ctx.drawImage(video, 0, 0);\n    setTimeout(draw,\
    \ 20);\n}\n\n// start video playback\nvideo.play();\n```\n\n# Chapter 17\n\n##\
    \ Canvas & SVG: An Introduction to SVG\n\nSVG stands for `Scalable Vector Graphics`.\
    \ It allows you to create graphics using the XML markup language. SVG's been around\
    \ for quite some time and is supported by the majority of browsers. Unlike Canvas,\
    \ it's not intended for pixel manipulation. It allows you to create scalable graphics\
    \ and, as it's `resolution independent`, it's ideal for use on projects that are\
    \ likely to be used on a variety of screen resolutions and sizes. For example,\
    \ SVG is ideal for sites using Responsive Web Design (RWD).\n\nIn fact, the use\
    \ of SVG in RWD is so obvious, you have to wonder why some websites are redesigned\
    \ using traditional images. SVG also displays perfectly on retina and other high-resolution\
    \ screens. As resolutions get better, it's likely they'll be more widely used.\n\
    \nSVG uses an accessible DOM node-based API and is perfect for those with a good\
    \ understanding of HTML, CSS, and some JavaScript. You can style it using CSS\
    \ and make it interactive with JavaScript, and for those that aren't overly familiar\
    \ with JavaScript, there are plenty of libraries around to help.\n\nAs with any\
    \ web technology, SVG is ever changing but many of its features are available\
    \ for animations, transforms, gradients, filter effects, and much more. It works\
    \ in all modern browsers—you can check compatibility at [caniuse.com](http://caniuse.com/svg).\n\
    \n## Why Use SVG Instead of JPEG, PNG, or GIF?\n\nThere are two types of graphics\
    \ that can be used in computing: `bitmap` and `vector`. Bitmaps, such as JPEG,\
    \ PNG and GIF, are also known as `raster graphics` and are composed of individual\
    \ pixels with differing colors. Vector graphics like SVG, on the other hand, define\
    \ paths and points; they can be resized and retain their quality. This makes them\
    \ ideal for web uses such as:\n\n* logos\n* banners\n* signage\n* illustrations\n\
    * line art\n\nSVG images have a few inherent advantages over bitmap images:\n\n\
    * Since SVG images are comprised of text, they are often more accessible and search\
    \ engine-friendly than bitmap images.\n* Vectors can also be placed over other\
    \ objects and made translucent, so the object below remains visible.\n* Graphics\
    \ created using SVG can be edited with relative ease, and SVG can be used in conjunction\
    \ with CSS in order to style the output. This isn't something that's currently\
    \ achievable with traditional bitmap images.\n* SVG images are normally smaller\
    \ in terms of file size than bitma.\n\nHowever, while they do have many advantages,\
    \ like many things in life, vector images are not a perfect solution for every\
    \ application. For example, it's unlikely that you'd be able to produce realistic-looking\
    \ photos with vectors.\n\nYou can embed SVG in standard HTML documents, and SVG\
    \ can be created using any text editor. However, you may prefer to use Adobe Illustrator\
    \ or [InkScape](http://inkscape.org/download/?lang=en) (an open source vector\
    \ graphics editor) to create your SVG images.\n\nNow that you know what SVG is\
    \ all about, let's get down to the good stuff: learning how to use it.\n\n## Getting\
    \ Started\n\nTo get started, you can just use a bare bones HTML5 page and drop\
    \ inline-SVG code right into it. Let's start with an SVG image of a red circle:\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n  <h1>A red circle:</h1>\n\n  <!--\
    \ inline SVG -->\n  <svg width=\"200\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n    <circle id=\"redcircle\" cx=\"100\" cy=\"100\" r=\"100\" fill=\"red\" />\n\
    \  </svg>\n\n</body>\n</html>\n```\n\nSave the file and open it in your browser\
    \ and you should see a page with a red circle which is titled \"A red circle:\"\
    .\n\nThe SVG section is delimited by the `svg` tag, which defines dimensions of\
    \ 200x200px for the image on the page.\n\nTry altering some of the code yourself.\
    \ The `circle` element specifies the shape that we want to draw with various attributes.\
    \ The `cx` and `cy` attributes define the circle's center in relation to the drawing\
    \ area; the `r` attribute gives the circle's radius. This means that the diameter\
    \ (width) of the circle will appear as twice the value you've set as the radius.\n\
    \nYou can also add a border around the circle\n\n```html\n<circle id=\"redcircle\"\
    \ cx=\"100\" cy=\"100\" r=\"100\" \nstroke=\"black\" stroke-width=\"1\" fill=\"\
    red\"/>\n```\n\n### Other Shapes\n\nAs well as a circle, it's a simple matter\
    \ to create other shapes by appending appropriate tags within the `svg` block:\n\
    \n* **line**—Creates a simple line\n    ```html\n    <line x1=\"25\" y1=\"150\"\
    \ x2=\"300\" y2=\"150\" \n    stroke=\"#F00\" stroke-width=\"5\" />\n    ```\n\
    \    ![A line](figures/Lines.png)\n    Figure 17.1. A line\n\n* **polyline**—Defines\
    \ shapes built from multiple line definitions\n    ```html\n    <polyline points=\"\
    0,40 40,40 40,80 80,80 80,120 120,120 120,160\"\n    stroke=\"#F00\" stroke-width=\"\
    5\" fill=\"#FFF\" />\n    ```\n    ![A polyline](figures/Polylines.png)\n    Figure\
    \ 17.2. A polyline\n\n* **rect**—Creates a rectangle\n    ```html\n    <rect width=\"\
    300\" height=\"100\" fill=\"#F00\" />\n    ```\n    ![A rectangle](figures/rectangles.png)\n\
    \    Figure 17.3. A rectangle\n\n* **ellipse**—Creates an ellipse\n    ```html\n\
    \    <ellipse cx=\"300\" cy=\"80\" rx=\"100\" ry=\"50\" fill=\"#F00\"/>\n    ```\n\
    \    ![Ellipse](figures/ellipses.png)\n    Figure 17.4. Ellipse\n\n* **polygon**—Creates\
    \ a polygon\n    ```html\n    <polygon points=\"200,10 250,190 160,210\"\n   \
    \ stroke=\"#000\" stroke-width=\"1\" fill=\"#F00\" />\n    ```\n    ![A (polygon)\
    \ triangle](figures/Polygontriangle.png)\n    Figure 17.5. A (polygon) triangle\n\
    \nPolygons define a series of x and y co-ordinates in the `points` attribute.\
    \ This allows you to create complex shapes with any number of sides.\n\n```html\n\
    <polygon points=\"100,10 40,180 190,60 10,60 160,10\" \nstroke=\"#000\" stroke-width=\"\
    1\" fill=\"pink\" />\n```\n![A star](figures/Polygonstar.png)\nFigure 17.6. A\
    \ star\n\n* **path**—Allows for the definition of arbitrary paths\nThe `path`\
    \ element allows you to created drawings using special commands. These can be\
    \ upper or lowercase, which apply absolute and relative positioning. It looks\
    \ complex and there are many options so please refer to [this SitePoint tutorial](http://www.sitepoint.com/svg-path/)\
    \ for more information.\n\nAll the above shapes can be made using `paths`. The\
    \ code below creates a segmented circle using paths and, as you can see in [Figure\
    \ 17.7](#ch17.html_piechart \"Figure 17.7. Paths\"), this is perfect for creating\
    \ pie charts and similar graphics.\n\n```html\n<path d=\"M300,200 h-150 a150,150\
    \ 0 1,0 150,-150 z\"\nfill=\"pink\" stroke=\"red\" stroke-width=\"3\"/>\n<path\
    \ d=\"M275,175 v-150 a150,150 0 0,0 -150,150 z\"\nfill=\"purple\" stroke=\"red\"\
    \ stroke-width=\"3\"/>\n```\n![Paths](figures/Paths.png)\nFigure 17.7. Paths\n\
    \n## Gradients and Patterns\n\nAs with canvas, SVG enables you to paint or stroke\
    \ shapes using gradients and patterns. This is achieved by creating special gradient\
    \ tags such as `linearGradient` and `radialGradient` within a `defs` section of\
    \ the SVG. Other elements can then refer to these by name and reuse them on any\
    \ shape.\n\nTo add a linear gradient to the circle within the `svg`:\n\n```html\n\
    <!-- define gradient -->\n<defs>\n  <linearGradient id=\"MyGradient\">\n    <stop\
    \ offset=\"10%\" stop-color=\"yellow\" />\n    <stop offset=\"90%\" stop-color=\"\
    blue\" />\n  </linearGradient>\n</defs>\n\n<!-- use gradient in a circle -->\n\
    <circle cx=\"100\" cy=\"100\" r=\"100\" fill=\"url(#MyGradient)\" />\n```\n"
