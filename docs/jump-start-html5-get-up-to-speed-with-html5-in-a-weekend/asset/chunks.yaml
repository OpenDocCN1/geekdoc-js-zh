  trans: "\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <svg width=\"1200\" height=\"\
    500\"\n  xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n\n  <!--三次贝塞尔曲线\
    \ -->\n    <path id=\"cubic1\" d=\"M 100 350 c 150 -300 150 -300 300 0\"\n\tstroke=\"\
    red\" stroke-width=\"5\" fill=\"none\"/>\n    <path id=\"cubic2\" d=\"M 450 350\
    \ c 200 -300 100 -300 300 0\"\n\tstroke=\"red\" stroke-width=\"5\" fill=\"none\"\
    />\n    <path id=\"cubic3\" d=\"M 800 350 c 100 -300 200 -300 300 0\"\n\tstroke=\"\
    red\" stroke-width=\"5\" fill=\"none\"/>\n\n  <!-- 显示控制点 -->\n    <g stroke=\"\
    blue\" stroke-width=\"3\" fill=\"blue\">\n\n      <!-- 左侧曲线 -->\n      <circle\
    \ cx=\"250\" cy=\"50\" r=\"3\"/>\n\n      <!-- 中间曲线控制点 -->\n      <circle cx=\"\
    650\" cy=\"50\" r=\"3\"/>\n      <circle cx=\"550\" cy=\"50\" r=\"3\"/>\n\n  \
    \    <!-- 右侧曲线控制点 -->\n      <circle cx=\"900\" cy=\"50\" r=\"3\"/>\n      <circle\
    \ cx=\"1000\" cy=\"50\" r=\"3\"/>\n\n    </g>\n\n  <!-- 文本 -->\n    <g font-size=\"\
    30\" font=\"sans-serif\" \n\tfill=\"red\" stroke=\"none\" text-anchor=\"middle\"\
    >\n\n    <text x=\"250\" y=\"50\" dy=\"-10\">\n    两个控制点\n    </text>\n\n    <text\
    \ x=\"650\" y=\"50\" dy=\"-10\">\n    CP1\n    </text>\n    <text x=\"550\" y=\"\
    50\" dy=\"-10\">\n    CP2\n    </text>\n\n    <text x=\"900\" y=\"50\" dy=\"-10\"\
    >\n    CP2\n    </text>\n    <text x=\"1000\" y=\"50\" dy=\"-10\">\n    CP1\n\
    \    </text>\n\n    </g>\n\n  </svg>\n</body>\n</html>\n```\n\n这将产生如图 19.2 所示的输出。\n\
    \n![一条三次贝塞尔曲线](img/Cubic.png)\n\n图 19.2. 三次贝塞尔曲线\n\n让我们检查一下第三条曲线：\n\n```html\n\
    <path id=\"cubic3\" d=\"M 800 350 c 100 -300 200 -300 300 0\"\nstroke=\"red\"\
    \ stroke-width=\"5\" fill=\"none\"/>\n```\n\n`d` 属性指示解析器移动到坐标 (800,350)。'c' 定义了三个相对于\
    \ (800,350) 的后续坐标。第一个是起始控制点 (100,-300)——等于绝对位置 (900,50)。第二个是结束控制点 (200,-300)——等于绝对位置\
    \ (1000,50)。第三个是曲线在 (300,0) 处的终点——等于绝对位置 (1100,350)。\n\n或者，我们可以使用大写的 'C' 指令来使用绝对坐标引用而不是相对坐标引用。\n\
    \n还有简写形式 'S'（绝对）和 's'（相对）指令。它们接受两个坐标：结束控制点和终点本身。起始控制点被认为与结束控制点相同。\n\n这些命令可以根据控制点的位置来改变三次贝塞尔曲线的形状。可以试着玩一下，不要只在同一个浏览器窗口中查看结果，尝试调整它们的大小，在你的平板电脑或智能手机上查看它们，并惊讶于\
    \ SVG 如何完美地处理缩放。\n\n幸运的是，有工具可以帮助你定义曲线指令。SitePoint 的 Craig Buckler 创建了[二次贝塞尔曲线工具](http://blogs.sitepointstatic.com/examples/tech/svg-curves/quadratic-curve.html)和[三次贝塞尔曲线工具](http://blogs.sitepointstatic.com/examples/tech/svg-curves/cubic-curve.html)，它们允许你移动控制点并复制/粘贴生成的\
    \ SVG 代码。\n\n在下一章 中，我们将查看过滤器。\n\n# 第 20 章\n\nCanvas & SVG: SVG 过滤器效果\n\n你可以在 SVG\
    \ 中使用**过滤器效果**。如果你使用任何图形设计或照片处理包，那么你几乎肯定以前遇到过过滤器。SVG 中的过滤器包括：\n\n* `feBlend`\n\
    * `feColorMatrix`\n* `feComponentTransfer`\n* `feComposite`\n* `feConvolveMatrix`\n\
    * `feDiffuseLighting`\n* `feDisplacementMap`\n* `feFlood`\n* `feGaussianBlur`\n\
    * `feImage`\n* `feMerge`\n* `feMorphology`\n* `feOffset`\n* `feSpecularLighting`\n\
    * `feTile`\n* `feTurbulence`\n* `feDistantLight`\n* `fePointLight`\n* `feSpotLight`\n\
    \n如果你用过图像编辑软件，你可能很熟悉过滤器的作用。本质上，它们对图像应用各种效果，如边框、模糊、软焦等。从本质上，将过滤器元素视为 Web 图像处理的一种形式。过滤器元素可以在大多数现代浏览器中使用，但\
    \ Blackberry 浏览器除外。关于过滤器可以做什么的示例，请查看微软的上手教程：[SVG 过滤器效果](http://ie.microsoft.com/testdrive/graphics/hands-on-css3/hands-on_svg-filter-effects.htm)。\n\
    \n## 使用过滤器效果\n\n特别是如果你是过滤器的新手，最好一次测试一个过滤器，否则你可能会得到看起来非常奇怪的图像。要要全面了解过滤器，请查看 [SVG\
    \ 过滤器](http://example.com/SVG/Filters) 页面。\n\n以下是 `feGaussianBlur` 过滤器的示例，如图 20.1\
    \ 所示。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <svg xmlns=\"http://www.w3.org/2000/svg\"\
    \ version=\"1.1\">\n    <defs>\n      <filter id=\"f1\">\n        <feGaussianBlur\
    \ stdDeviation=\"14\"/>\n      </filter>\n    </defs>\n\n    <circle cx=\"200\"\
    \ cy=\"200\" r=\"200\" stroke=\"red\" stroke-width=\"5\" fill=\"gold\" filter=\"\
    url(#f1)\" />\n  </svg>\n</body>\n</html>\n```\n\n![应用模糊的圆](img/GaussianBlur.png)\n\
    \n图 20.1. 带圆\n\n### 玩转过滤器\n\n正如你所见，你必须给过滤器一个 ID，以便稍在圆中指定：`filter=\"url(#f1)\"\
    `。与此过滤器相关的参数是 `stdDeviation`；它控制模糊程度。例如，如果你将 `stdDeviation` 设置为 `1`，你将得到极少的模糊。然而，如果你将其设置为（例如）200，那么它就会创建一个几乎透明的模糊效果。\n\
    \n![一个非常模糊的圆](img/stdDeviation.png)\n\n图 20.2. 一个非常模糊的圆\n\n如果你应用较低的值，那么模糊效果就不会那么明显，并且允许描边看起来是橙色的，如图\
    \ 20.3 所示。\n\n让我们尝试组合过滤器效果。我们将使用 `feOffset` 过滤器创建一个投影阴影；这是通过获取相关图像或元素并在 x-y 平面上移动它来实现。我们将使用\
    \ `feBlend` 和 `feOffset` 元素，它们将创建一个与原始图像偏移的重复图像，从而产生一个图像位于另一个图像后面的效果，如图 20.4 所示。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <svg xmlns=\"http://www.w3.org/2000/svg\"\
    \ version=\"1.1\">\n    <defs>\n      <filter id=\"f1\" x=\"0\" y=\"0\" width=\"\
    200%\" height=\"200%\">\n        <feOffset result=\"offOut\" dx=\"25\" dy=\"20\"\
    \ />\n        <feBlend in=\"SourceGraphic\" in2=\"offOut\" mode=\"normal\" />\n\
    \      </filter>\n    </defs>\n\n    <polygon points=\"220,10 300,210 170,250\
    \ 123,234\" fill=\"blue\"\n     stroke=\"purple\" stroke-width=\"3\" filter=\"\
    url(#f1)\" />\n\n  </svg>\n</body>\n</html>\n```\n\n![使用多个过滤器](img/Filtermulti.png)\n\
    \n图 20.4. 使用多个过滤器\n\n过滤器可以帮助创建出的效果。例如，如果我们对上面应用 `feGaussianBlur`，你就可以模糊背景图像以创建某种\
    \ 3D 的效果。\n\n"
- fmt: "\n### Note: Filter Future\n\nSVG filter technology is coming to CSS3 so you'll\
    \ be able to apply effects to any HTML element.\n\n# Chapter 21\n\n## Canvas &\
    \ SVG: Canvas or SVG?\n\nAs we've seen, both `canvas` and `SVG` can do similar\
    \ things. So how do you decide which to use?\n\nFirstly, let's look at how each\
    \ one is defined:\n\n* `SVG` is short for `Scalable Vector Graphics` and is a\
    \ language that's used to describe graphics in `XML`.\n* `Canvas`, on the other\
    \ hand, is a way of drawing graphics on the fly using `JavaScript`.\n\nNow that\
    \ really doesn't tell you a great deal about the differences between them and\
    \ how they can each be used, so let's look at it in a little more depth. In `SVG`,\
    \ drawn shapes are remembered as `objects` and therefore, if the attributes of\
    \ that object change, the browser can then re-render the shape automatically.\
    \ However, as `canvas` elements are drawn pixel-by-pixel, then any changes that\
    \ are made will require the entire scene to be redrawn.\n\nAll elements of `SVG`\
    \ are available in the `DOM`, so you can easily attach `JavaScript` event handlers\
    \ to them. For the most part, the project will dictate which element you use,\
    \ so it's worth giving it some thought at the planning stage.\n\nBear in mind\
    \ that `SVG` is fully scalable, unlike `canvas`, and so `SVG` may very well be\
    \ a better choice if you're designing a responsive site that has graphics that\
    \ need to scale.\n\n## Creation Languages\n\nTo create images on a `canvas` element\
    \ you have one choice: `JavaScript`. Those who understand the language will have\
    \ a head start, but it's still necessary to learn the drawing APIs. However, animating\
    \ `canvas` images is incredibly fast; you can draw and animate hundreds of items\
    \ every second because the element is not constrained by the number of items being\
    \ shown. This makes it ideal for action games.\n\n`SVG` files are `XML`—which\
    \ is simply structured text. They can be pre-prepared in a vector graphics package\
    \ such as `Illustrator` or `Inkscape`, or you can dynamically create them on the\
    \ server using any language: `Node.js`, `PHP`, `Ruby`, `Python`, `C#`, `Java`,\
    \ `BASIC`, `Cobol` etc.\n\nYou can also create and manipulate `SVG` on the client\
    \ using `JavaScript` with a familiar `DOM` and event-handling API. It's rarely\
    \ necessary to re-draw the whole image because objects remain addressable. Unfortunately,\
    \ this is far slower than moving bitmaps on `canvas`. `SVG` may be ideal for an\
    \ animated bar chart, but not necessarily suitable for fast-moving action games.\n\
    \n## Typical Uses\n\nIn general, `SVG` is ideal for:\n\n* static images, especially\
    \ within responsive and fluid layouts\n* images which can be resized to any dimension\
    \ without losing quality\n* projects which benefit from `DOM` methods to attach\
    \ events and manipulate objects\n* projects which create images server-side\n\
    * projects where accessibility and SEO are important\n\n`Canvas` is ideal for:\n\
    \n* bitmap images, editing photographs or any operation which requires pixel-level\
    \ manipulation\n* images which must be created and animated on-the-fly\n* graphically-intense\
    \ applications, such as games\n\nSometimes, there will not be an obvious best\
    \ solution and either technology can be used. Remember neither is mutually exclusive;\
    \ you can use both `canvas` and `SVG` on the same page at the same time, e.g.\
    \ multiple animated `canvas` elements over a static `SVG` background. The only\
    \ limit is your imagination.\n\nI hope you've enjoyed this book and are ready\
    \ to get started with some awesome examples of your own.\n\nThanks for reading,\
    \ and have fun with `canvas` and `SVG`!\n\n# Chapter 22\n\n## Offline Apps: Detecting\
    \ When the User Is Connected\n\nPerhaps the hardest part of building an app that\
    \ works offline is actually determining when the user is offline.\n\nIn this chapter,\
    \ we’ll cover the `ononline` and `onoffline` events of the `window` object and\
    \ the `window.navigator.onLine` property. We’ll also talk about their limits as\
    \ well as an alternative way to test for connectivity.\n\n## Determining Whether\
    \ the User Is Online\n\nThe `window.navigator.onLine` property tells us whether\
    \ or not the user is connected to a network. It returns a Boolean `true` or `false`\
    \ value:\n\n```\nif(navigator.onLine){\n    console.log('We are connected!');\n\
    } else {\n    console.log('We don't have connectivity.');\n}\n```\n\nWe can use\
    \ this property with other offline APIs to determine when and whether to store\
    \ data locally. Then we can sync it with a server once we have connectivity again.\n\
    \nAnytime the value of `navigator.onLine` changes, it fires one of two events:\n\
    \n* `offline`: when the value of `navigator.onLine` would be `false`\n* `online`:\
    \ when the value of `navigator.onLine` would be `true`\n\nWe can listen for these\
    \ events, of course, and take action when one is fired.\n\n## Listening for Changes\
    \ in Connectivity State\n\nIn Firefox, Internet Explorer 9+, and Safari, the `online`\
    \ and `offline` events are fired on the `document.body` object. In Chrome and\
    \ Opera 15+, however, they are fired on the `window` object.\n\nThe good news\
    \ is that even when fired on the `document.body`, these `online` and `offline`\
    \ events “bubble up” to the `window` object. This means we can listen for events\
    \ fired there instead of setting event listeners or handlers for both.\n\nThere\
    \ are two options in listening for our `online` and `offline` events. We can use\
    \ the event attributes `onoffline` and `ononline`, as shown here:\n\n```\n window.ononline\
    \ = function(){\n    // Alert the user that connectivity is back.\n    // Or sync\
    \ local data with server data.\n }\n\n window.onoffline = function(){\n    //\
    \ Alert the user that connectivity was lost.\n    // Or just save data locally.\n\
    \ }\n```\n\nOr we can use the `addEventListener` method and listen for the `online`\
    \ or `offline` event:\n\n```\nwindow.addEventListener('offline', offlineHandler);\n\
    window.addEventListener('online', onlineHandler);\n```\n\nThe `addEventListener`\
    \ method requires two parameters: the event we want to listen for, and the function\
    \ to invoke ― known as callback ― when the event occurs.\n\nFor compatibility\
    \ with some older versions of Firefox (<6.0) and Opera (<11.6), you will need\
    \ to add a third parameter. This parameter tells the browser whether to use event\
    \ capture or bubbling. A value of `true` means that events should be captured.\
    \ A `false` value means that events should bubble. In general, you should set\
    \ it to `false`.\n\nModern browsers use event bubbling by default, making the\
    \ third parameter optional in those browsers. If you’d like to know more about\
    \ bubbling versus capture, read Peter-Paul Koch’s 2006 article, “Event order.”\n\
    \n### Online and Offline Events in Internet Explorer 8\n\nThe exception to this\
    \ rule is Internet Explorer 8. IE8 fires `online` and `offline` events at the\
    \ `document.body` object, but they do not bubble. What’s more, Internet Explorer\
    \ doesn’t support `addEventListener()`. You’ll need to use the `attachEvent()`\
    \ method instead, or a polyfill that smooths over the differences.\n\nThat said,\
    \ the only component of offline applications that Internet Explorer 8 supports\
    \ is web storage (which we’ll cover in Chapter 24). Internet Explorer 8 does have\
    \ some vendor-specific storage features, but in the interest of promoting web\
    \ standards and shortening the length and complexity of this book, we will not\
    \ cover them here.\n\n## Limitations of `navigator.onLine`\n\nHere’s the downside\
    \ of `navigator.onLine`: it’s unreliable. What’s more, it works differently depending\
    \ on the browser and operating system.\n\nChrome, Safari, Opera 15+, and Internet\
    \ Explorer 9+ can detect when the user has lost connectivity with the network.\
    \ Losing or turning off a Wi-Fi connection will trigger an `offline` event in\
    \ those browsers. Reconnecting will trigger an `online` event. The value of `navigator.onLine`\
    \ will be `true` if connected to the Internet, and `false` if it is not.\n"
