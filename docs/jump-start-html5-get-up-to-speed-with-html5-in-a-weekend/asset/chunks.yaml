  trans: "\n\n在我们开始讨论 HTML5 的多媒体元素之前，让我们先聊聊准备媒体文件。虽然我们现在可以在大多数浏览器中使用原生的 HTML5 元素，但我们（尚）无法在每个浏览器中使用相同的文件。我们在介绍中提到过这一点，但进行更详细的解释是必要的。我已经尽力公正地描述了这一点。\n\
    \n那么，为什么我们不能在每个浏览器中使用相同的文件呢？简短回答是：文件格式。\n\n## 编解码器对决\n\n详细的回答是：浏览器厂商尚未对网络音频和视频达成统一的格式。\n\
    \n当多媒体首次添加到 HTML5 规范时，音频的 `Ogg—Vorbis` 和视频的 `Theora` 被提为标准的默认格式。`Ogg` 规范被认为是公有领域。它的大多数工具都有开源许可。它被认为是没有专利的，且不侵犯其他专利。出于这些原因，它似乎是默认解码器的一个相当不错的选择。\n\
    \n一些浏览器厂商（主要是苹果和诺基亚）不同意选择 `Ogg`，并断然不支持它。他们担心的问题之一是不确定的专利格局。毕竟，仅仅因为 `Ogg` **被认为**不侵权，并不意味着它真的不侵权。此外，`Ogg`\
    \ 缺乏如 `H.264` 视频格式强大的硬件支持。\n\n提到 `H.264` 视频，苹果和诺基亚将其作为首选视频格式。`H.264` 受到硬件软件的广泛支持，特别是在移动端。事实上，今天网络上大部分视频都依赖它。然而，`H.264`\
    \ 是所谓的“受限”格式：它是一种专利格式。在你的软件中添加 `H.264` 支持需要支付高昂的版税费用。Opera 和 Mozilla（`Firefox`\
    \ 的开发者）对此望而却步。两者都拒绝在自己的浏览器中添加 `H.264` 支持。\n\n值得的是，Google 在其 `Chrome` 浏览器中支持 `H.264`\
    \ 和 `Ogg`。但作为 `Chrome` 底层的开源代码库 `Chromium` 缺乏 `H.264` 支持。微软在很大程度上避开了争端，但随后也选择了\
    \ `H.264`。\n\n我应该在这里提到，`H.264` 是一种视频编解码器，这很大程度上就是争议所在。音频格式的争议较少，部分原因是因为可选的实在太多了。\n\
    \n话虽如此：在 2009 年，规范作者删除了编解码器要求。浏览器厂商实现了他们想要的编解码器。结果是我们必须以多种格式编码我们的音频和视频。至于所有那些糟糕的细节和愤怒的帖子，可以翻阅大约\
    \ 2009 年中左右的 [WHATWG 邮件列表存档](http://lists.w3.org/Archives/Public/public-whatwg-archive/)。\n\
    \n## 现状\n\n自从从 HTML5 中删除了编解码器要求以来，浏览器领域发生了一些细微变化。`Mozilla` 和 `Opera` 现在支持 `H.264`，但**仅当**硬件或第三方软件提供访问权限时支持——例如在\
    \ Android 设备上。\n\n一种新格式——`WebM` 也加入了这一战。`WebM` 由 Google 赞助，是 `VP8` 和 `VP9` 视频编解码器的容器格式。不出所料，Google\
    \ 的 `Chrome` 原生支持 `WebM`。`Opera` 从版本 `10.60` 开始也支持，`Firefox` 从版本 `4.0` 开始也支持（尽管此时仅支持\
    \ `VP8` 编解码器）。`Internet Explorer` 不原生支持 `WebM`，但如果安装了第三方软件就可以支持。苹果的 `Safari` 仍然支持\
    \ `H.264`。\n\n至少，我们需要将视频文件编码为两种格式：`H.264` 和 `WebM`。对于音频文件，使用 `MP3` 和 `WebM`。这些格式在目前使用的浏览器中支持最广泛。为了支持\
    \ `Firefox 3` 或 `Opera 10.50` 用户，使用 `Ogg — Theora`（视频）和 `Ogg Vorbis`（音频）编码你的文件。\n\
    \n幸运的是我们，基础的媒体转码很容易，而且有免费的开源工具可以完成工作。在本章中，我们将讨论其中两个：命令行工具 [FFmpeg](http://ffmpeg.org/)\
    \ 和图形用户界面 [Miro Video Converter](http://www.mirovideoconverter.com/)。\n\n### 注意：警惕托管成本\n\
    \n以多种格式存储多个文件可能会影响你的托管成本，特别是随着存储视频数量的增加。请检查你的网络托管和存储计划的详情。\n\n## 使用 Miro Video\
    \ Converter 转换文件\n\nMiro Video Converter 为 `FFmpeg`（开源、命令行媒体转换工具）提供了一个图形用户界面。它没有\
    \ `FFmpeg` 灵活。但如果命令行让你感到不适，它也更容易使用。\n\n要使用 `Miro` 转换文件，请将其添加到队列。你可以通过将文件拖入应用程序中来实现。或者点击“Choose\
    \ File”（选择文件）并导航到它。你可以向队列中添加多个文件。`Miro` 将按顺序处理它们。一旦文件排好队，我们就可以选择导出格式。\n\n![OS\
    \ X 版 Miro Video Converter 的转换队列](img/file-queue-in-miro.png)\n\n图 6.1. OS X 版\
    \ Miro Video Converter 的转换队列\n\nMiro 提供了许多针对特定设备的系列预设。使用 `Apple > Apple Universal`\
    \ 预设是支持 `H.264` 浏览器的良好选择。对于 `WebM` 和 `Ogg`，请查看 `Format` 菜单。\n\n在设置菜单（右侧的齿轮图标）下，你还会看到创建缩略图、调整视频大小或调整宽高比的选项。再次点击齿轮图标返回主界面。\n\
    \n![Miro Video Converter 中的设置面板](img/miro-settings.png)\n\n图 6.2. Miro Video Converter\
    \ 中的设置面板\n\n一旦你选择了格式并（可选地）调整了设置，点击屏幕底部的绿色按钮开始转码。\n\n![我们可以转换！当我们选定输出格式后 Miro 的样子](img/convert-file-miro.png)\n\
    \n图 6.3. 我们可以转换！当我们选定输出格式后 Miro 的样子\n\nMiro Video Converter 将你转换后的文件输出到输出文件夹。它的位置随操作系统而异，但你可以在设置菜单中找到链接。\n\
    \n## 使用 FFmpeg 转换媒体\n\n如果你想要更多的灵活性，请尝试使用 `FFmpeg`。它是开源的，主要用于 Linux 系统。但通过 `FFmpeg`\
    \ 网站提供 Mac OS X 和 Windows 的二进制文件。如果你正在使用 Mac，还可以使用 Homebrew 或 Macports 安装 `FFmpeg`。\n\
    \n`FFmpeg` 支持几十种格式，包括我们网络所需的：`Ogg Vorbis` 和 `Theora`、`MPEG-3`、`MPEG-4/H.264` 以及\
    \ `WebM`。你也可以用它来导出静态帧，这对于生成海报图像很有帮助。\n\n让我们看看使用 `FFmpeg` 将视频从 QuickTime (.mov)\
    \ 转换为 `WebM` 需要什么。导航到存放要转换文件的目录。然后打开终端窗口。\n\n`FFmpeg` 转换非常直接。一个简单的版本如下。\n\n```bash\n\
    ffmpeg -i /path/to/input.file /path/to/output.file \n```\n\n`FFmpeg` 将根据输出文件的扩展名确定使用哪种编解码器。\n\
    \n在这种情况下，我们的文件名为 `tracy-sings.mov`。要将其转换为 `WebM`，我们将输入：\n\n```bash\nffmpeg -i\
    \ tracy-sings.mov tracy-sings.webm\n```\n\n就是这样。你的终端窗口将充满有关输入输出文件的各种细节。\n\n###\
    \ 注意：使用 FFmpeg 二进制文件\n\n如果你使用的是 `FFmpeg` 二进制文件，可能还需要包含 `FFmpeg` 的路径（例如：`/usr/local/ffmpeg`）。\n\
    \n![FFmpeg 转换过程演示](img/ffmpeg-output.png)\n\n图 6.4. FFmpeg 转换过程演示\n\n几刻之后，你将获得请求输出格式的转码文件。\n\
    \n### 调整视频大小\n\n提供 1080p（通常为 1920 像素 x 1080 像素）视频的文件可能比你在网上需要的大。`FFmpeg` 也包含了缩放或调整视频大小的工具。实现此目的的方法之一是使用\
    \ `FFmpeg` 的缩放过滤器。\n\n让我们尝试将电影缩放到较小的 720p（1280 像素 x 720 像素）分辨率。我们还将将其转码为 `WebM`。\n\
    \n```bash\nffmpeg -i tracy-sings.mov -vf scale=-1:720 tracy-sings-720p.webm\n\
    ```\n\n"
- fmt: "\nWhat's new here is the `-vf` flag, which is a flag indicating we'd like\
    \ to use a filter. That's followed by our filter name (`scale`) and our desired\
    \ ratio (width:height). Though we could specify both dimensions, here we've used\
    \ `-1` instead. This indicates to `FFmpeg` that we want to preserve our aspect\
    \ ratio as it scales. As in our previous example, the last part of our command\
    \ is the output file name and extension.\n\n### Using FFmpeg to Generate a Poster\
    \ Image\n\nFFmpeg isn't limited to media conversions. We can also use it to export\
    \ frames from video files. This will come in handy when we discuss adding a poster\
    \ image to our videos. The basic command follows this pattern:\n\n```\nffmpeg\
    \ -ss 30 -t 2 -i /path/to/input.file -r 1 \n/path/to/output-%02d.jpg\n```\n\n\
    This example involves a few more command line flags than our previous ones. So\
    \ let's run through it.\n\nThe `-ss` flag instructs `FFmpeg` to seek the specified\
    \ position, as expressed in seconds. In this case, we'll start exporting frames\
    \ from 30 seconds into our video.\n\nNext is the `-t` flag or duration, or how\
    \ many seconds of video we'd like to extract as images. In this case, we'll capture\
    \ two seconds worth of frames. As you may have guessed by now the `-i` flag stands\
    \ for \"input,\" and we use it to specify our source file.\n\nThe `-r` flag sets\
    \ the frame rate, or number of frames per second in our video export. In this\
    \ case, it's 1 frame per second. This means we'll end up with two stills from\
    \ this video, one for each second specified by the `-t` flag. If we used a higher\
    \ frame rate, such as 24 frames per second, we'd extract 24 images.\n\nFinally,\
    \ we need to tell `FFmpeg` where to put the files. The `%02d` is a place holder\
    \ or wildcard of sorts. It tells `FFmpeg` to name our images in sequential order,\
    \ padding to 2 digits long where necessary. In this case, our images would be\
    \ named `output-01.jpg`, `output-02.jpg` and so on. If we used `%03d`, our files\
    \ would be named `output-001.jpg`, `output-002.jpg` instead.\n\n### Using a Hosted\
    \ Service\n\nMiro Video Converter and `FFmpeg` are great for audio and video that\
    \ you want to host yourself. But there are a few services that offer hosting and\
    \ transcoding. [Archive.org](http://archive.org/details/movies) offers free hosting\
    \ and transcoding for audio and video works released under a Creative Commons\
    \ license or to the public domain. [Vid.ly](http://m.vid.ly/), [Viddler](https://www.viddler.com/),\
    \ and [Zencoder](http://zencoder.com/en/) are three paid options, and also provide\
    \ configurable players. Details and pricing vary.\n\n### Quality Versus File Size\n\
    \nThis chapter isn't a comprehensive look at Miro Video Converter, `FFmpeg`, or\
    \ optimizing media for the web. But it will get you started.\n\nYou should, however,\
    \ consider bitrate and frames per second (FPS) for your audio and video files.\
    \ There are few hard-and-fast guidelines here. Which values you choose will depend\
    \ your ― and your audience's ― tolerance for quality versus file size, bandwidth\
    \ consumption and download times.\n\nPopular video sites such as [YouTube](https://support.google.com/youtube/answer/1722171),\
    \ [Vimeo](http://vimeo.com/help/compression), and [Dailymotion](http://www.dailymotion.com/upload/faq)\
    \ offer some guidance for compressing media. Use `FFmpeg` to make these adjustments.\
    \ Your best bet is to start with these guides and experiment with different rates\
    \ until you strike the right balance.\n\nNow that you know have some tools for\
    \ converting media, let's talk about how to add it to your page.\n\n# Chapter\
    \ 7\n\n## Multimedia: Using Native HTML5 Audio\n\nIn this chapter, we'll cover\
    \ the `audio` element and its attributes. Though we're focusing on the `audio`\
    \ element, keep in mind that most of these attributes also apply to `video`. In\
    \ fact, it's possible to use the `audio` element to play video files and the `video`\
    \ element to play audio files. The main difference is that the `video` element\
    \ will display an image track if it is available; `audio` never will.\n\n## The\
    \ `audio` Element\n\nAdding audio to your web page is super simple. Use the `<audio>`\
    \ tag. At a minimum, it requires a `src` attribute, which is the path to and name\
    \ of the media file. Audio elements also require a closing `</audio>` tag. Using\
    \ your text editor, create a new HTML file, and add the snippet below, changing\
    \ the value of `src` to point to your media file. Save it as audio.html, then\
    \ open it in your browser.\n\n```\n<audio src=\"/path/to/media.file\"></audio>\n\
    ```\n\nYou should see and hear absolutely nothing. By default, the `audio` and\
    \ `video` elements lack controls and load in an idle state.\n\nIn order to expose\
    \ a player interface to our users, we'll need to add the `controls` attribute.\n\
    \n```\n<audio src=\"/path/to/media.file\" controls></audio>\n```\n\nThe `controls`\
    \ attribute is an example of an empty attribute. For empty attributes, its presence\
    \ or absence determines whether the attribute value is true or false. It's actually\
    \ the equivalent of typing `controls=\"\"` with an empty string for a value. If\
    \ you're using HTML5's stricter XHTML syntax, you should use `controls=\"\"` or\
    \ `controls=\"controls\"` instead of the empty attribute.\n\nAdding the `controls`\
    \ attribute will give us visible play/pause, volume, and thumb head controls.\
    \ What those default controls look like depends on the browser, as does the ability\
    \ to style them with CSS.\n\n### Note: With JavaScript Disabled\n\nWhen the user\
    \ has disabled JavaScript, the browser will expose a media controls user interface,\
    \ regardless of the value of the `controls` attribute.\n\n![Default audio players\
    \ in (from top to bottom) Internet Explorer 11, Chrome 30, Firefox 27, and Safari\
    \ 6.0.5](figures/audio-controls.png)\n\nFigure 7.1. Default audio players in (from\
    \ top to bottom) Internet Explorer 11, Chrome 30, Firefox 27, and Safari 6.0.5\n\
    \nSome browsers browsers expose what's known as a \"Shadow DOM,\" or a way of\
    \ targeting specific components with CSS. Support for a Shadow DOM varies from\
    \ browser to browser, so you'll need to consult each browser's documentation.\n\
    \nA more flexible approach is to build our own player. As we'll see later in this\
    \ book, we can also control appearance using the multimedia API, CSS, and JavaScript.\n\
    \n## The `autoplay` Attribute\n\nWe can choose to play our media as soon as it\
    \ loads by adding the `autoplay` attribute. Like `controls`, `autoplay` is an\
    \ empty attribute.\n\n```\n<audio src=\"/path/to/media.file\" autoplay></audio>\n\
    ```\n\nIn your audio.html file, replace `controls` with `autoplay` and reload\
    \ the page. Notice that our audio file starts playing right away, but also notice\
    \ that there isn't a way to stop playback. If we want to allow the user to control\
    \ this media, we'll need to include them both, as shown below.\n\n```\n<audio\
    \ src=\"/path/to/media.file\" autoplay controls></audio>\n```\n\nBe considerate\
    \ of your users and think carefully before using the `autoplay` attribute. Auto-playing\
    \ media consumes bandwidth both for you and your users. Media files can \"clog\
    \ the pipes,\" so to speak, for users with limited bandwidth. For users who also\
    \ have metered bandwidth, auto-playing media literally costs money. And many users\
    \ just find it plain annoying. In most cases, user-initiated media is the better\
    \ way to go.\n\n### Looping Media\n\nPerhaps you want to use some atmospheric\
    \ audio to set a mood for your web site. In that case, you may want your media\
    \ to repeat automatically, without intervention from the user. This is where the\
    \ `loop` attribute comes in handy. When present, the media will \"rewind\" itself\
    \ at the end, and play from the beginning.\n\n```\n<audio src=\"/path/to/media.file\"\
    \ autoplay controls loop></audio>\n```\n\n### Muting Media\n\nHTML5 offers the\
    \ ability to silence the audio output of a media file with the `muted` attribute.\
    \ The media file will still be downloaded. The progress bar and time will continue\
    \ to update. But the browser will not output any sound.\n\n```\n<audio src=\"\
    /path/to/media.file\" controls muted></audio>\n```\n"
