  trans: "\n\n### 注意：为什么 Workers 无法访问 DOM\n\n浏览器（以及 `DOM`）在单线程上运行。这是因为你的代码可能会阻止其他操作，例如点击链接。多线程可能会破坏这种机制。此外，`DOM`\
    \ 不是线程安全的。由于这些原因，`Worker` 线程无法访问 `DOM`——但这并不会阻止你的 Workers 修改主页面内容。你可以始终将结果传回给父脚本，并让\
    \ UI 线程更新 `DOM` 内容。我将在本章最后向你演示如何操作。\n\n在进入更高级的功能之前，只有一个最后一个问题：如何关闭线程。要终止线程，只需在主脚本中调用\
    \ `worker.terminate()`，或在 worker 内部调用 `self.close()`。\n\n## 更高级的 Workers\n\n###\
    \ 内联 Workers (Inline Workers)\n\n每个人都喜欢随手处理事情。由于 Web Workers 运行在独立的上下文中，`Worker`\
    \ 构造函数期望一个指定运行外部脚本文件的 URI。但如果你想做得非常快，可以通过 `blobs` 动态创建内联 Workers。看下面的代码：\n\n```\n\
    var blob = new Blob([\"onmessage = function(e) {\nself.postMessage(e.data); });\n\
    \nvar worker = new Worker(window.URL.createObjectURL(blob));\n\nworker.addEventListener('message',\
    \ function(e){\n  alert('Got same Message: '+e.data+' from worker');\n},false);\n\
    \nworker.postMessage('Good Morning Worker!!');\n```\n\n在此段代码中，我们在 `Blob` 中编写了\
    \ Worker 的内容。`window.URL.createObjectURL` 本质上创建了一个 URI（例如，`blob:null/027b645d-be05-4f14-8866-e52604777608`），引用了\
    \ Worker 的内容，该 URI 被传递给 `Worker` 构造函数。然后我们像照常一样进行。\n\n由于将所有 Worker 内容放入 `Blob`\
    \ 构造函数中不方便，我们也可以选择将所有 Worker 代码放在父 HTML 内部的一个单独 `script` 标签中。那么在运行时，我们将该内容传递给\
    \ `Blob` 构造函数。\n\n在下面的示例中，我们在父 HTML 页面本身中编写 Worker。一旦 Worker 启动，它将每秒执行一次函数并将当前时间返回给主线程。主线程随后将用时间更新\
    \ `div`（记得我们讨论过更新 DOM 吗？）：\n\n`parentPage.html`\n\n```\n<!DOCTYPE html>\n<html\n\
    <head>\n<!-- \n  以下脚本不会被 JavaScript 引擎解析，\n  因为它的 type 属性\n-->\n<script type=\"\
    text/javascript-worker\" id=\"jsworker\">\n\n  setInterval(function(){\n    postMessage(getTime());\n\
    \  }, 1000);\n\n  function getTime(){\n    var d = new Date();\n    return d.getHours()+\"\
    :\"+d.getMinutes()+\":\"+d.getSeconds();\n  }\n\n</script>\n\n<script>\n  var\
    \ blobURI = new Blob(\n    [document.querySelector(\"#jsworker\").textContent]\n\
    \  );\n\n  var worker=new Worker(window.URL.createObjectURL(blobURI));\n\n  worker.addEventListener('message',function(e){\n\
    \    document.getElementById('currTime').textContent=e.data;\n  },false);\n\n\
    \  worker.postMessage();\n</script>\n</head>\n<body>\n<div id=\"currTime\"></</div>\n\
    </body>\n</html>\n```\n\n这段代码非常浅显易懂。一旦 Worker 启动，我们会注册一个每秒执行一次并返回当前时间的函数。主线程会获取相同的数据并更新\
    \ `DOM`。此外，`#currTime` 可以被缓存以提高性能。\n\n如果你正在创建许多 blob URL，在完成后释放它们是一个良好的习惯（我建议避免创建过多的\
    \ blob URL）：\n\n```\nwindow.URL.revokeObjectURL(blobURI); // 释放资源\n```\n\n###\
    \ 在 Worker 内部创建子 Worker (Subworkers)\n\n在你的 Worker 文件中，你可以进一步创建并使用子 worker。过程是相同的。主要的优势是你可以将任务分配在许多线程之间。子\
    \ worker 的 URI 是相对于其父脚本的位置解析的，而不是主 HTML 文档。这样做是为了让每个 Worker 都能清晰地管理其依赖项。\n\n###\
    \ 在 Workers 中使用外部脚本\n\n你的 Workers 可以访问 `importScripts()` 函数，让它们能够轻松导入外部脚本。下面的代码显示了如何这样做：\n\
    \n```\n// 导入单个脚本\nimportScripts('external.js');\n\n// 导入 2 个脚本文件\nimportScripts('external1.js','external2.js');\n\
    ```\n\n### 注意：URI 相对于 Worker\n\n当你从 Worker 导入外部脚本时，脚本的 URI 是相对于 Worker 文件位置解析的，而不是主\
    \ HTML 文档。\n\n## 安全性考虑\n\nWeb Worker API 遵循同源策略（same-origin principle）。这意味着 `Worker()`\
    \ 的参数必须与调用页面的源相同。\n\n例如，如果我的调用页面位于 `http://xyz.com/callingPage.html`，那么 Worker\
    \ 不能位于 `http://somethingelse.com/worker.js`。只要 Worker 的位置以 `http://xyz.com` 开头，就是允许的。同样，`http`\
    \ 页面不能产生位置以 `https://` 开头的 Worker。\n\n图 27.2 显示了 Chrome 在尝试跨越源限制时抛出的错误：\n\n![Chrome\
    \ 中的跨源错误](img/sameorigin.png)\n\n图 27.2. Chrome 中的跨源错误\n\n如果你尝试在本地访问文件（通过 `file://`\
    \ 协议），某些浏览器可能会抛出安全异常。如果你收到了任何此类异常，只需将文件放在本地服务器中并使用以下地址访问：`http://localhost/project/somepage.html`。\n\
    \n## 旧版浏览器的 Polyfill (填充)\n\n如果浏览器不支持 Web Workers API 怎么办？有多种 polyfill 可以模拟 Web\
    \ Workers 的行为来支持旧浏览器。[Github 上的 Modernizr 页面](https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-browser-Polyfills#web-workers)\
    \ 列出了此类 polyfill 的列表，但长时间运行在这些实现中可能会失败。在这种情况下，可能通过 Ajax 将某些处理交给服务器。\n\n## 结论\n\
    \nWeb Workers 因其多线程特性为你提供了巨大的性能提升。所有现代浏览器（包括 IE10 及以上版本）都支持 Web Workers。\n\n以下是一些你可以尝试实现的用例：\n\
    \n- 在后台进行[轮轮](http://techoctave.com/c7/posts/60-simple-long-polling-example-with-javascript-and-jquery)\
    \ 并通知用户有新更新\n- 预取并缓存内容\n- 在后台执行计算密集型任务和长时间循环\n- 一个在后台持续运行的拼写检查器\n\n# 第 28 章\n\n\
    Geolocation API 提供了一种获取用户精确位置的简单方法。例如，你可以创建一个根据用户的当前位置为其提供个性化建议的应用程序。你还可以在地图上绘制他们的位置以显示导航详情。\n\
    \n在本章中，我将为你概述 Geolocation API，并展示如何使用它来创建神奇的基于位置的 HTML5 应用。\n\n## 接触表面 (Hitting\
    \ the Surface)\n\n在使用该 API 之前，让我们先确保浏览器支持它：\n\n```\nif (navigator.geolocation)\
    \ {\n  // 执行一些很棒的事情\n}\nelse {\n  // 提供备用内容\n}\n```\n\n可以通过 `Modernizr` 实现相同的检查：\n\
    \n```\nif (Modernizr.geolocation) {\n  // 执行一些很棒的事情\n}\nelse {\n  // 提供备用内容\n\
    }\n```\n\n使用以下代码获取用户的实际位置：\n\n"
- fmt: "\n```\nnavigator.geolocation.getCurrentPosition\n(success_callback,error_callback);\n\
    \n function success_callback(position) {\n      console.log(\"Hey, there you are\
    \ at Longitude:\"\n      +position.coords.longitude+\"and latitude:\"\n      +position.coords.latitude);\n\
    \ }\n\n function error_callback(error) {\n    var msg=\"\";\n     switch(error.code){\n\
    \        case 1:\n            msg=\"Permission denied by user\"; \n          \
    \  break;\n        case 2:\n            msg=\"Position unavailable\";\n      \
    \      break;\n        case 3:\n            msg=\"Request Timed out\";\n     \
    \       break;\n    }\n    console.log(\"Oh snap!! Error logged: \"+msg);\n }\
    \ \n```\n\nThe function `getCurrentPosition()` is asynchronous in nature. It means\
    \ the function returns immediately, and tries to obtain the location of the user\
    \ asynchronously. As soon as location information is retrieved, the success callback\
    \ is executed. A `position` object is also passed to the callback. All the data\
    \ related to the user'scurrent position is encapsulated in that object.\n\nThe\
    \ following properties are available inside the `position` object:\n\n* `coords.latitude`:\
    \ latitude of the position\n* `coords.longitude`: longitude of the position\n\
    * `coords.accuracy`: informs the developer how accurate the location information\
    \ is (this result is in meters)\n* `coords.altitude`: the current altitude in\
    \ meters\n* `coords.altitudeAccuracy`: used to establish the accuracy of the altitude\
    \ given (previous point)\n* `coords.heading`: the direction in which the user\
    \ is heading\n* `coords.speed`: the speed of the end user (device) in meters per\
    \ second\n* `timestamp`: the timestamp indicating when the position is recorded\n\
    \nYou may not need all the information contained in the position object. In most\
    \ cases, all you’ll ever need are the first three properties, as those are sufficient\
    \ to plot a user’s position on the map.\n\nThe next point to note is that you\
    \ should handle any error gracefully. When your app tries to retrieve the location,\
    \ the browser asks the user if the requesting page should be allowed to access\
    \ the user’s location. If the user denies permission, the error callback (see\
    \ the previous piece of code) is called and an `error` object is passed. The `code`\
    \ property indicates the type of error that has occurred. There could also be\
    \ an error because the request timed out.\n\nNow let’s see what else you can do\
    \ with `getCurrentPosition()`. This function takes an optional third parameter,\
    \ `PositionOptions`, which is a JavaScript object representing additional options.\
    \ The available properties are:\n\n1. `enableHighAccuracy`: If this is set `true`,\
    \ it will instruct the hosting device to provide the best possible location details.\
    \ If the device is a smartphone, it may use GPS to provide highly accurate information.\n\
    2. `timeout`: this essentially indicates how many milliseconds you want to wait\
    \ to obtain a position. For example, if you set the value to 5,000 milliseconds\
    \ and the app is unable to detect the current position of the user within that\
    \ interval, it will fail with an error.\n3. `maximumAge`: this property indicates\
    \ if you want the device to cache the last known location. Let’s assume the device\
    \ detects the current location of the user at 5.00 p.m. One minute later (at 5.01\
    \ p.m.), your app again calls `getCurrentPosition()` with `maximumAge` of 100,000\
    \ (means 100 seconds). Since the device knows where the user was 60 seconds ago\
    \ and this is less than the `maximumAge` property, it will answer back with that\
    \ last known location. This is useful if you’re satisfied with a previously known\
    \ location rather than firing a new request for the current position (conserving\
    \ battery life in many cases). It’s like saying “hey device, give me your current\
    \ position, and I don’t mind if that position is x milliseconds old.” Note that\
    \ a value of `0` indicates no caching should be done.\n\nThe following snippet\
    \ demonstrates using `PositionOptions`:\n\n```\nnavigator.geolocation.getCurrentPosition(\n\
    \  success_callback, \n  error_callback, \n  {enableHighAccuracy: true, timeout:\
    \ 35000, maximumAge: 60000}\n);\n```\n\n## Continuously Monitoring Position\n\n\
    If you want to monitor the user’s position continuously, `getCurrentPosition()`\
    \ will fail to work for you; instead, you should use `watchPosition()`. Both functions\
    \ have the same signatures but they differ in the way they work.\n\nIn the case\
    \ of `watchPosition()`, the success callback is called every time the user’s position\
    \ changes. Yes, it’s that good! If your app needs to plot the user’s location\
    \ on the map as the user moves, this is the best way to do it. You don’t even\
    \ have to bother about when the position changes. The API takes care of that for\
    \ you and executes your callback at the appropriate time.\n\nThe following code\
    \ demonstrates the use of `watchPosition()`:\n\n```\nvar watchId;\nfunction startWatchingPosition()\
    \ {\n  watchId=navigator.geolocation.watchPosition(plotPosition);\n}\n\nfunction\
    \ plotPosition(position){\n  console.log(\n    'got position: Latitude='+\n  \
    \  position.coords.latitude+\n    ', longitude='+\n    position.coords.longitude\n\
    \  );\n\n  // your code to update the position on map\n}\n\nfunction stopWatchingPosition(){\n\
    \  navigator.geolocation.clearPosition(watchId);\n}\n```\n\nHere, the callback\
    \ `plotPosition()` will be called every time a new location is retrieved. Note\
    \ that the `watchPosition()` function returns a number that you can store and\
    \ later use with `clearPosition()` to stop monitoring; it works much like `setInterval()`\
    \ and `clearInterval()`.\n\n### Tip: Fast-moving Users\n\nIf the user is moving\
    \ very fast, the callback may execute frequently and slow down the system. Some\
    \ `event throttling` may be necessary to reduce the number of times our callback\
    \ runs. There is a [small JavaScript library](https://github.com/heyman/geolocation-throttle)\
    \ designed by Jonatan Heyman that reduces the number of callbacks we receive from\
    \ `watchPosition()`.\n\n## Accuracy of Geolocation\n\nGeolocation accuracy may\
    \ be important to your app. As discussed, you can always choose to enable high\
    \ location accuracy using `PositionOptions.enableHighAccuracy`. But that’s just\
    \ hinting to the device to use a little more power so as to return a more accurate\
    \ position. The device may silently disregard it. In many situations, the location\
    \ retrieved may not be accurate enough or even be wrong. And sometimes the user\
    \ may have no interest in the retrieved location. In those cases, you may want\
    \ to allow the users to override the location.\n\n## Conclusion\n\nThe Geolocation\
    \ API is a great tool for the developer who wants to build cool location-based\
    \ applications that give real-time feedback to the users; however, you should\
    \ remember that the user always has a choice. As mentioned, the user has to explicitly\
    \ grant permission to your application for you to actually access the location.\
    \ In those cases, you should be ready with alternative content.\n\nHere are a\
    \ few small projects you can try to implement on your own:\n\n* Detect your position\
    \ and plot it on a Google Map.\n* Continuously monitor your own position and plot\
    \ them on the map.\n* Detect the position of a user and show them theaters nearby.\n\
    * Let your users check in at different places and plot these on a map to later\
    \ show them the places they visited that day.\n\n# Chapter 29\n\n## APIs: Server\
    \ Sent Events\n\n**Server Sent Events** is an API by which browsers receive push\
    \ notification from servers through the HTTP connection. Once a connection is\
    \ established, the server can send updates to the client periodically as new data\
    \ is available. In other words, a client subscribes to the events generated on\
    \ the server side. Once a particular event occurs, the server sends a notification\
    \ to the client. With Server Sent Events (SSEs), you can create rich applications\
    \ that provide real-time updates to the browser without significant HTTP overhead.\n\
    \nIn this chapter, we’ll discuss the concepts behind SSEs and learn how to use\
    \ them to build real-time HTML5 apps.\n"
