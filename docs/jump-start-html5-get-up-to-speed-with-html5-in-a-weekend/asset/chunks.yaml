  trans: "\n\n所有的视频文件都具有 `intrinsic`（固有）的宽度和高度。固有尺寸是文件的“自然”或默认高度和宽度。例如，一个视频文件的宽度为\
    \ 640 像素，高度为 480 像素。然而，我们可以使用 `width` 和 `height` 属性告诉浏览器在我们的文档布局中限制视频播放器的大小。例如所示。\n\
    \n```html\n<video src=\"/path/to/media.file\" controls width=\"427\" height=\"\
    240\">\n</video>\n```\n\n这将我们的视频限制在一个 427 像素宽、 240 像素高的框内。 视频文件本身将保留其尺寸。但它将在我们定义的空间内显示，如图\
    \ 8.2 所示。\n\n![我们将视频设置为宽 427 像素、高 240 像素。Google Chrome 窗口宽度为 640 像素。图像来自 Blender\
    \ Foundation 提供的“Big Buck Bunny”，bigbuckbunny.org](img/resized-video-chrome.png)\n\
    \n图 8.2. 我们将视频设置为宽 427 像素、高 240 像素。Google Chrome 窗口宽度为 640 像素。图像来自 Blender Foundation\
    \ 提供的“Big Buck Bunny”，bigbuckbunny.org\n\n在没有宽度或高度的情况下，HTML5 视频播放器的默认大小为 300 像素宽、\
    \ 150 像素高。一旦浏览器能够确定视频的固有尺寸，它就会调整元素的大小。如果你使用的 `preload` 值为 `auto` 或 `metadata`，这将在视频加载时发生。如果你使用的\
    \ `preload` 值为 `none`，它将在用户开始播放时发生。\n\n![当 preload 属性设置为 none 时，Opera 16 中的默认视频播放器](img/default-video-opera.png)\n\
    \n图 8.3. 当 `preload` 属性设置为 `none` 时，Opera 16 中的默认视频播放器\n\n这与 `img` 元素的工作方式类似。当我们不指定元素框的大小时，框将扩展以适应内容。设置高度和宽度可以防止这种情况的发生。\n\
    \n在上面的示例中，我们指定了像素值，但也可以使用百分比值。让我们将上面示例中的值改为百分比。\n\n```html\n<video src=\"/path/to/media.file\"\
    \ controls \nwidth=\"100%\" height=\"100%\">\n</video>\n```\n\n现在，我们的视频元素尺寸将相对于其容器元素的高度和/或宽度进行伸或缩小。\n\
    \n设置 `width` 和 `height` 属性并不是控制 `video` 元素大小唯一方法。我们可以使用 CSS，如下所示。\n\n```css\n\
    video {\n    width: 427px;\n    height: 240px;\n}\n```\n\n在这里我们使用了 `video` 元素选择器，这意味着这些样式将应用于我们文档和网站上的每个视频。在大括号之间，我们添加了\
    \ `width` 属性以及值为 `427px`（或 427 像素）的值以及值为 `240px` 的 `height` 属性。与 HTML 属性一样，我们不受限于像素值。我们也可以使用百分比或\
    \ CSS 允许的任何其他长度值。\n\n如果你使用 CSS，请记住这些值将优先于 HTML 中的任何 `width` 和 `height` 属性。如果你不熟悉\
    \ CSS，Louis Lazaris 写的 SitePoint 书籍 [Jump Start CSS](http://www.sitepoint.com/store/jump-start-css/)\
    \ 将帮助你快速上手。\n\n### 百比高度\n\n使用百分比值 `height` 是复杂的。它只在父元素的高度也被显式设置时才有效。例如，如果视频的父元素是\
    \ `body` 元素，你需要使用 CSS 来指定它的高度，如下所示。\n\n```css\nbody {\n    height: 100%;\n}\n\
    ```\n\n现在，你的 `video` 元素将随着 `body` 元素一起扩展高度。然而，这里有一个注意事项。虽然你的*视频元素*的宽高比例会改变，但视频本身的宽高比例不会改变。当\
    \ `video` 元素的宽高比例与视频本身不同时，你会在视频图像周围留出额外的空间，如图 8.4 所示。\n\n![视频顶部和底部的橙色条是视频元素宽高比例与视频文件宽高比例之间的差异](img/video-percentage-height.png)\n\
    \n图 8.4. 视频顶部和底部的橙色条是视频元素宽高比例与视频文件宽高比例之间的差异\n\n由于这个原因，通常使用百分比值宽度并让浏览器自动调整高度会更省心。\n\
    \n```css\nvideo {\n    width: 800px;\n    height: auto;\n}\n```\n\n### 设置封面（Poster\
    \ Image）\n\n如果你对 `preload` 使用 `auto` 或 `metadata`，你的视频将加载第一帧。但如果你使用了 `none`，访问只会看到占位符。我们可以做得更好。让我们使用\
    \ `poster` 属性指定图像。\n\n```html\n<video src=\"/path/to/media.file\" controls width=\"\
    427\" height=\"240\" poster=\"/path/to/poster.image\">\n</video>\n```\n\n`poster`\
    \ 属性的值必须是图像文件的 URL。它将在没有视频数据可用时显示。它旨在代表视频，但也可以很容易是公司 Logo 或简单的标题。在第 6 章 中，我们提到如何使用\
    \ FFmpeg 从视频中提取图像，你可以将其用于封面帧。但你也可以拍摄普通的截图并使用图像编辑器对其进行编辑。\n\n#### 封面尺寸与 `video`\
    \ 元素尺寸\n\n封面图像具有固有尺寸，就像视频文件一样。最初，`video` 元素的尺寸将匹配封面图像的宽高。一旦浏览器知道了视频的尺寸，它就会调整元素的大小以匹配。为了防止这种情况，请：\n\
    \n1. 确保你的封面图像与视频具有相同的宽高；或\n\n2. 使用属性或 CSS 为 `video` 元素指定高度和宽度。\n\n几乎任何图像格式都适用于封面，包括\
    \ SVG。大多数浏览器会将图像限制在视频元素的尺寸内（如果已设置），如果没有设置，则会扩展到 SVG 文件的大小。\n\n![大多数浏览器会将 SVG 封面的尺寸限制在视频元素内。图像来自\
    \ Openclipart 的 Michele Brami](img/svg-poster-img-chrome.png)\n\n图 8.5. 大多数浏览器会将\
    \ SVG 封面的尺寸限制在视频元素内。图像来自 Openclipart 的 Michele Brami\n\nInternet Explorer 则恰恰相反。当视频元素缺少高度和宽度时，它会将封面限制在默认的\
    \ 300x150 尺寸。如果设置了*尺寸，SVG 图像将扩展到其完整的固有尺寸。\n\n![当视频元素设置了高宽时，Internet Explorer 不限制\
    \ SVG 封面。图像来自 Openclipart 的 Michele Brami](img/svg-poster-img-ie.png)\n\n图 8.6.\
    \ 当视频元素设置了高宽时，Internet Explorer 不限制 SVG 封面。图像来自 Openclipart 的 Michele Brami\n\n\
    为了解决这个问题，请使 SVG 文件的固有尺寸比 `video` 元素的高度和宽度小。\n\n### 到目前为止我们学到的内容\n\n"
- fmt: "\nUp to this point in the book we've covered the `audio` and `video` elements,\
    \ and most of their important attributes. But what you may have noticed is that\
    \ your `audio` and `video` examples did not work in every browser. If you used\
    \ `MP3` and `M4V` files, for example, your examples didn't work in Opera 16.\n\
    \nAs we discussed in [Chapter 6](#ch01.html \"Chapter 1Basics: What is HTML5?\"\
    ), browser vendors haven't yet agreed to support a standard file format. That\
    \ means we need to serve our media files in multiple formats. But how can we do\
    \ that when the `video` and `audio` elements only support a single `src` attribute?\n\
    \nWell the answer is that we can't, exactly. But we can use multiple `source`\
    \ elements to supply multiple source files. Each browser will download the file\
    \ format that it can most likely play. We'll discuss cross-browser video in our\
    \ [next chapter](#ch09.html \"Chapter 9Multimedia: The source Element\").\n\n\
    # Chapter 9: Multimedia: The `source` Element\n\nUp until this chapter, we've\
    \ discussed using the `audio` and `video` elements with a single `src` attribute.\
    \ You may have noticed that this only works part of the time, in some browsers,\
    \ depending on the format of your file. For true, cross-browser multimedia that\
    \ works across browsers, you'll need to use multiple `source` elements, and multiple\
    \ source files.\n\nWe'll use `video` elements for the examples in this chapter,\
    \ but most of what we'll discuss also applies to the `audio` element. In order\
    \ to serve multiple sources, you'll need to have your media available in multiple\
    \ formats. Refer to [Chapter 6](#ch06.html \"Chapter 6Multimedia: Preparing Your\
    \ Media\") for a couple of ways to do this.\n\n## The `source` Element\n\nThe\
    \ `source` element lets us specify multiple, alternative media files for a multimedia\
    \ element. It's not an element that stands on its own; it must be used as the\
    \ child of an `audio` or `video` element. Place your `source` tags between the\
    \ start and end tags for the `audio` or `video` elements.\n\n```\n<video controls>\n\
    \  <source src=\"/path/to/video.h264.m4v\">\n  <source src=\"/path/to/video.webm\"\
    >\n</video>\n```\n\nThe `source` tag requires a `src` attribute whose value is\
    \ the path and name of a multimedia file. Ideally, when you specify multiple sources,\
    \ the browser should detect and select the file it is capable of playing. The\
    \ current reality is slightly messier.\n\nIn Chrome, Firefox, and Internet Explorer,\
    \ the browser will attempt to download the first source file specified. If it\
    \ can't play that format, it will try the next file specified, and so on, until\
    \ it finds a file in a format that it's capable of playing.\n\nBoth Safari 6 (and\
    \ older) and Opera 15 do the same, except when the value of `preload` is `none`.\
    \ When `preload=\"none\"`, these browsers will attempt to download the first file,\
    \ and fail if it proves to be incompatible. To prevent this, either:\n\n1. Set\
    \ the `preload` attribute to `metadata` or `auto`; or\n2. Specify the MIME type\
    \ using the `type` attribute.\n\nSafari 7 no longer suffers from this bug.\n\n\
    ## Format Hinting With the `type` Attribute\n\nSpecifying a MIME type using the\
    \ `type` attribute will keep your browser from running a format compatibility\
    \ check for each `source` element. It's especially important for browsers in which\
    \ that process is broken. Rather than executing a download-check-repeat sequence,\
    \ browsers will use the `type` attribute to select the file that it's capable\
    \ of playing. Let's add `type` attributes to our `<source>` elements from above.\n\
    \n```\n<video controls>\n  <source src=\"/path/to/video.h264.m4v\" type=\"video/mp4\"\
    >\n  <source src=\"/path/to/video.webm\" type=\"video/webm\">\n</video>\n```\n\
    \nThe value of a `type` attribute must be a valid MIME type that matches the format\
    \ of the file in question. For MPEG4/H.264 files, that will be `video/mp4`. For\
    \ audio MPEG-4 files, use `audio/mp4`. The MIME type for MP3 files should be `audio/mpeg`.\
    \ For Ogg files use `video/ogg` or `audio/ogg`. For WebM, the preferred MIME type\
    \ is `video/webm`.\n\nYou may also want to specify the codec used to encode your\
    \ media file. Most file formats are actually just containers for a variety of\
    \ encoding formats. For example, an Ogg audio file may actually be encoded using\
    \ the Vorbis, FLAC, or Speex codecs. An MPEG-4 file may be Xvid and H.264. Including\
    \ a codec is optional, but offers more specific information to the browser. To\
    \ include codecs, add a `codec` parameter to the value of the `type` attribute.\n\
    \n```\n<source src=\"/path/to/video.ogv\" \ntype=\"video/ogg; codecs='theora,\
    \ vorbis'\">\n```\n\nNote that the value of our `codecs` parameter is enclosed\
    \ in single quotes. This is because it's part of a value that's wrapped in double\
    \ quotes. We could also invert our quotes; that is, enclose the entire value of\
    \ `type` in single quotes, while using `double` quotes for the value of our `codecs`\
    \ parameter.\n\nUsing a `codec` isn't strictly necessary. It's just as easy to\
    \ leave it out, particularly if you're not exactly sure what codec your file is\
    \ using.\n\n### Troubleshooting Media Problems\n\nNow perhaps you've done all\
    \ of this—your paths are correct, your file formats are correct—and your video\
    \ or audio still doesn't work. A couple of things could be wrong.\n\nCheck that\
    \ your server is sending the correct `Content-type` response header for the file\
    \ type. Many servers will send unknown file types with a `Content-type: text/html`\
    \ or `Content-type: application/octet-stream` header. You'll need to add proper\
    \ header support for each file format to your server or directory configuration\
    \ file. These header values should be the same as the MIME types we discussed\
    \ above. Consult the documentation for your server or contact your web hosting\
    \ support team for more.\n\nIf that doesn't work, you may have to re-encode your\
    \ file. When you do, make sure that you're using a codec that your target browser\
    \ supports. (Consult the browser's documentation.)\n\n## Responsive Video With\
    \ the `media` Attribute\n\nThe `source` element can be used to serve files of\
    \ different formats. But it can also be used to serve different videos based on\
    \ screen or device features. You can do this with the `media` attribute.\n\nThe\
    \ `media` attribute accepts a media query for a value. A media query consists\
    \ of a CSS media type (such as print, TV, or screen) and a media feature to test\
    \ against. For a full explanation of media queries and how they work, consult\
    \ the [Media Queries](http://www.w3.org/TR/css3-mediaqueries/) specification from\
    \ the World Wide Web Consortium. Here, we’ll just take a look at an example using\
    \ aspect ratios.\n\n### Serving Videos With Different Aspect Ratios\n\nOne of\
    \ the media or device features we can test against is the aspect ratio. Media\
    \ queries allow us to test `aspect-ratio` and `device-aspect-ratio`. The former\
    \ tests the aspect ratio of the document content—typically the document window.\
    \ The latter tests the aspect ratio of the device screen. Sometimes these are\
    \ the same. But they're often different. In either case, we can test the condition\
    \ and serve a different video based on the results.\n\nHere we are serving the\
    \ same video content using two different files to serve a 1080p video for screens\
    \ that can accommodate that resolution, and a 720p video for screens that can\
    \ accommodate that lower resolution.\n\n```\n<video controls>\n  <source src=\"\
    /path/to/video.1080p.m4v\" type=\"video/mp4\" \n  media=\"screen and (device-aspect-ratio:\
    \ 1920/1080)\">\n  <source src=\"/path/to/video.720p.m4v\" type=\"video/mp4\"\
    \ \n  media=\"screen and (device-aspect-ratio: 1280/720)\">\n  <source src=\"\
    /path/to/video.1080p.webm\" type=\"video/webm\" \n  media=\"screen and (device-aspect-ratio:\
    \ 1920/1080)\">\n  <source src=\"/path/to/video.720p.webm\" type=\"video/webm\"\
    \ \n  media=\"screen and (device-aspect-ratio: 1280/720)\">\n</video>\n```\n"
