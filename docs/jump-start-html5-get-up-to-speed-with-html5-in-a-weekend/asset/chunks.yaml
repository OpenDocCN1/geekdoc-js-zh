  trans: "\n\n```\nnavigator.geolocation.getCurrentPosition\n(success_callback,error_callback);\n\
    \n function success_callback(position) {\n      console.log(\"Hey, there you are\
    \ at Longitude:\"\n      +position.coords.longitude+\"and latitude:\"\n      +position.coords.latitude);\n\
    \ }\n\n function error_callback(error) {\n    var msg=\"\";\n     switch(error.code){\n\
    \        case 1:\n            msg=\"Permission denied by user\"; \n          \
    \  break;\n        case 2:\n            msg=\"Position unavailable\";\n      \
    \      break;\n        case 3:\n            msg=\"Request Timed out\";\n     \
    \       break;\n    }\n    console.log(\"Oh snap!! Error logged: \"+msg);\n }\
    \ \n```\n\n`getCurrentPosition()` 函数在本质上是异步的。这意味着该函数会立即返回，并尝试异步获取用户的位置。一旦检索到位置信息，就会执行成功回调函数。一个\
    \ `position` 对象也会传递给回调函数。与用户当前位置相关的所有数据都封装在该对象中。\n\n在 `position` 对象内部可以使用以下属性：\n\
    \n* `coords.latitude`: 位置的纬度\n* `coords.longitude`: 位置的经度\n* `coords.accuracy`:\
    \ 开发者位置信息的准确程度（该结果单位为米）\n* `coords.altitude`: 当前海拔（单位为米）\n* `coords.altitudeAccuracy`:\
    \ 用于建立所给高度（前述一点）的准确性\n* `coords.heading`: 用户移动的方向\n* `coords.speed`: 终端用户（设备）的速度（单位为米/秒）\n\
    * `timestamp`: 指示记录位置的时间戳\n\n你可能不需要 `position` 对象中包含的所有信息。在大多数情况下，你需要的只是前三个属性，因为这些属性足够在地图上绘制用户的位置了。\n\
    \n下一个需要注意的点是，你应该优雅地处理任何错误。当你的应用尝试检索位置时，浏览器会询问用户是否允许请求页面访问用户的位置。如果用户拒绝权限，就会调用错误回调函数（参见上文代码）并传递一个\
    \ `error` 对象。`code` 属性指示发生的错误类型。也可能因为请求超时导致错误。\n\n现在让我们看看还可以用 `getCurrentPosition()`\
    \ 做些什么。该函数接受一个可选的第三参数 `PositionOptions`，这是一个代表额外选项的 JavaScript 对象。可用属性如下：\n\n\
    1. `enableHighAccuracy`: 如果将其设置为 `true`，它将指示托管设备提供尽可能的位置细节。如果设备是智能手机，它可能会使用 GPS\
    \ 提供高精度的信息。\n2. `timeout`: 这本质上表示你想要等待多少毫秒来获取位置。例如，如果你将值设置为 5,000 毫秒，而应用在该间隔内无法检测到用户的当前位置，它将报错并失败。\n\
    3. `maximumAge`: 此属性指示你是否希望设备缓存最后已知的位置。假设设备在下午 5:00 检测到用户的当前位置。一分钟后（下午 5:01），你的应用再次调用\
    \ `getCurrentPosition()` 并并将 `maximumAge` 设置为 100,000（意味着 100 秒）。由于设备知道用户 60 秒前在哪里，而这小于\
    \ `maximumAge` 属性的值，它将返回那个最后已知的位置。如果你对之前已知的位置满意，而不是为当前位置发送新请求，那么这很有用（在很多情况下可以节省电量）。这就像是在说：“嘿设备，给我你的当前位置，我不介意这个位置是\
    \ x 毫秒之前的。”注意，值为 `0` 表示不进行缓存。\n\n以下代码段演示了如何使用 `PositionOptions`：\n\n```\nnavigator.geolocation.getCurrentPosition(\n\
    \  success_callback, \n  error_callback, \n  {enableHighAccuracy: true, timeout:\
    \ 35000, maximumAge: 60000}\n);\n```\n\n## 持续监控位置\n\n如果你想持续监控用户的位置，`getCurrentPosition()`\
    \ 将无法满足需求；相反，你应该使用 `watchPosition()`。这两个函数具有相同的签名，但工作方式有所不同。\n\n对于 `watchPosition()`，每当用户的位置发生时，就会调用成功回调函数。是的，就是这么棒！如果你的应用需要在用户移动时在地图上绘制其位置，这是实现的最佳方法。你甚至不需要担心位置何时变化。API\
    \ 会为你处理这些，并在适当的时间执行你的回调。\n\n以下代码演示了 `watchPosition()` 的用法：\n\n```\nvar watchId;\n\
    function startWatchingPosition() {\n  watchId=navigator.geolocation.watchPosition(plotPosition);\n\
    }\n\nfunction plotPosition(position){\n  console.log(\n    'got position: Latitude='+\n\
    \    position.coords.latitude+\n    ', longitude='+\n    position.coords.longitude\n\
    \  );\n\n  // 你在地图上更新位置的代码\n}\n\nfunction stopWatchingPosition(){\n  navigator.geolocation.clearPosition(watchId);\n\
    }\n```\n\n在这里，回调函数 `plotPosition()` 每每次获取到新位置时被调用。注意 `watchPosition()` 函数返回一个数字，你可以将其存储并在稍后使用\
    \ `clearPosition()` 停止监控；它的工作方式非常类似于 `setInterval()` 和 `clearInterval()`。\n\n\
    ### 提示：快速移动的用户\n\n如果用户移动非常快，回调可能会频繁执行并减慢系统。可能需要进行某些“事件节流（event throttling）”以减少回调运行的次数。有一个由\
    \ Jonatan Heyman 设计的[小型 JavaScript 库](https://github.com/heyman/geolocation-throttle)，它可以减少我们从\
    \ `watchPosition()` 接收到的回调次数。\n\n## 地位的准确性\n\n地理位的准确性可能对你的应用很重要。正如所讨论的，你始终可以通过\
    \ `PositionOptions.enableHighAccuracy` 来启用高位置准确度。但这只是提示设备多消耗一点功率以返回更准确的位置。设备可能会默默忽略它。在许多情况下，检索到的位置可能不够准确，甚至可能是错误的。有时用户可能对检索到的位置并不感兴趣。在这些情况下，你可能希望允许用户覆盖位置。\n\
    \n## 结论\n\nGeolocation API 是对于想要构建能够向用户提供实时反馈的酷炫位置应用的开发者来说一个非常棒的工具；然而，你应该记住用户始终拥有选择权。正如提到的，用户必须明确授予你的应用权限，你才能访问位置。在这些情况下，你应该准备好备选方案。\n\
    \n这里是一些你可以尝试自己实现的小项目：\n\n* 检测你的位置并绘制在 Google 地图上。\n* 持续监控你自己的位置并将其绘制在地图上。\n* 检测用户的位置并显示附近的剧院。\n\
    * 让你的用户在不同地点打卡并将这些地点绘制在地图上，稍后向他们展示当天去过的地方。\n\n"
- fmt: "\nBefore moving any further, it’s important to understand the need for this\
    \ API. To explain, let me first ask you a question: how would you design a real-time\
    \ app that continuously updates the browser with new data if there were no Server\
    \ Sent Events API? Well, you could always follow the traditional approach of long\
    \ polling through `setInterval()`/`setTimeout()` and a little bit of Ajax. In\
    \ this case, a callback executes after a specified time interval and polls the\
    \ server to check if new data is available. If data is available. it's loaded\
    \ asynchronously and the page is updated with new content.\n\nThe main problem\
    \ with this approach is the overhead associated with making multiple HTTP requests.\
    \ That’s where SSEs come to rescue. With SSEs, the server can push updates to\
    \ the browser as they’re made available through a single unidirectional connection.\
    \ And even if the connection drops, the client can reconnect with the server automatically\
    \ and continue receiving updates.\n\nKeep in mind that SSEs are best suited for\
    \ applications that require unidirectional connection. For example, the server\
    \ may obtain latest stock quotes periodically and send the updates to the browser,\
    \ but the browser doesn’t communicate back to the server, it just consumes the\
    \ data sent by server. If you want a bi-directional connection, you’ll need to\
    \ use Web Sockets, which are covered in the next chapter.\n\nOkay, enough talking.\
    \ Let’s code!\n\n## The API\n\nHere’s some example code showing the use of SSEs:\n\
    \n```\nif (!!window.EventSource) {\n  var eventsource=new EventSource('source.php');\n\
    \  eventsource.addEventListener('message',function(event) {\n    document.getElementById(\"\
    container\").innerHTML = event.data;\n  }, false);\n}\nelse{\n    // fallback\
    \ to long polling\n}\n```\n\n### Note: Using Modernizr\n\nNote that we’re checking\
    \ for browser support of SSEs. The same check can be achieved using Modernizr:\n\
    \n```\nif (Modernizr.eventsource) {\n  // proceed further\n}\nelse{\n  // fallback\
    \ to long polling\n}\n```\n\nTo use SSEs, you just call the `EventSource` constructor,\
    \ passing the source URL. The source may be any back-end script that produces\
    \ new data in real time. Here I have used a PHP script (`source.php`), but any\
    \ server-side technology that supports SSEs can be used.\n\nYou can then attach\
    \ event listeners to the `eventsource` object. The `message` event is fired whenever\
    \ the server pushes some data to the browser and the corresponding callback is\
    \ executed. The callback accepts an `event` object and its `data` property contains\
    \ our data from the server. Once you have the data, you can perform tasks such\
    \ as updating a part of the page with new information automatically in real time.\n\
    \nYou can be aware of when the connection opens and when an error occurs, as follows:\n\
    \n```\neventsource.addEventListener('open', function(event) {\n  // connection\
    \ to the source opened\n},false);\n\neventsource.addEventListener('error', function(event)\
    \ {\n  // Bummer!! an error occurred\n},false);\n```\n\n## The `EventStream` Format\n\
    \nThere needs to be something in your server’s response to help the browser identify\
    \ the response as a Server Sent Event. When the server sends the data to the client,\
    \ the `Content-Type` response header has to be set to `text/event-stream`. The\
    \ content of the server’s response should be in the following format:\n\n```\n\
    data: the data sent by server \\n\\n\n```\n\n`data:` marks the start of the data.\
    \ `\\n\\n` marks the end of the stream.\n\n### Note: `\\n` is the Carriage Return\
    \ Character\n\nYou should note that the `\\n` used above is the carriage return\
    \ character, not simply a backslash and an `n`.\n\nWhile this works for single-line\
    \ updates, in most cases we’ll want our response to be multiline. In that case,\
    \ the data should be formatted as follows:\n\n```\ndata: This is the first line\
    \ \\n\ndata: Now it's the second line \\n\\n\n```\n\nAfter receiving this stream,\
    \ client-side `event.data` will have both the lines separated by `\\n`. You can\
    \ remove these carriage returns from the stream as follows:\n\n```\nconsole.log(e.data.split('\\\
    n').join(' '));\n```\n\n## How About a Little JSON?\n\nIn most real-world apps,\
    \ sending a JSON response can be convenient. You can send the response this way:\n\
    \n```\ndata: {generator: \"server\", message: \"Simple Test Message\"}\\n\\n\n\
    ```\n\nNow in your JavaScript, you can access the data in the `onmessage` callback\
    \ quite simply:\n\n```\nvar parsedData = JSON.parse(event.data);\nconsole.log(\n\
    \  \"Received from \" + parsedData.generator +\n  \" and the message is: \" +\
    \ parsedData.message\n);\n```\n\n## Associating an Event ID\n\nYou can associate\
    \ an event `id` with the data you are sending as follows:\n\n```\nid: 100\\n\n\
    data: Hey, how are you doing?\\n\\n\n```\n\nAssociating an event `id` can be beneficial\
    \ because the browser tracks the last event fired. This `id` becomes a unique\
    \ identifier for the event. In case of any dropped connection, when the browser\
    \ reconnects to the server it will include an HTTP header `Last-Event-Id` in the\
    \ request. On the server side, you can check the presence of the `Last-Event-Id`\
    \ header. If it’s present, you can try to send only those events to the browser\
    \ that have `event id` greater than the `Last-Event-Id` header value. In this\
    \ way, the browser can consume the missed events.\n\n## Creating Your Own Events\n\
    \nOne of the most crucial aspects of SSEs is being able to name your events. In\
    \ a sports app, you can use a particular event name for sending score updates\
    \ and another for sending other information related to the game. To do that, you\
    \ have to register callbacks for each of those events on the client side. Here’s\
    \ an example:\n\nResponse from server:\n\n```\nevent: score \\n\ndata:  Some score!!\
    \ \\n\\n\nevent: other \\n\ndata:  Some other game update\\n\\n\n```\n\nClient-side\
    \ JavaScript:\n\n```\nvar eventsource=new EventSource('source.php');\n\n// our\
    \ custom event\neventsource.addEventListener('score',function(e) { \n  // proceed\
    \ with your logic\n  console.log(e.data);\n}, false);\n\n//another custom event\n\
    eventsource.addEventListener('other',function(e) {\n  // proceed in a different\
    \ way\n  console.log(e.data);\n}, false);\n```\n\nHaving different event names\
    \ allows your JavaScript code to handle each event in a separate way, and keeps\
    \ your code clean and maintainable.\n\n## Handling Reconnection Timeout\n\nThe\
    \ connection between the browser and server may drop any time. If that happens,\
    \ the browser will automatically try to reconnect to the server by default after\
    \ roughly five seconds and continue receiving updates; however, you can control\
    \ this timeout. The following response from the server specifies how many milliseconds\
    \ the browser should wait before attempting to reconnect to the server in case\
    \ of disconnection:\n\n```\nretry: 15000 \\n\ndata: The usual data \\n\\n\n```\n\
    \nThe `retry` value is in milliseconds and should be specified once when the first\
    \ event is fired. You can set it to a larger value if your app does not produce\
    \ new content rapidly and it’s okay if the browser reconnects after a longer interval.\
    \ The benefit is that it may reduce the overhead of unnecessary HTTP requests.\n\
    \n## Closing a Connection\n\nWe always reach this part in almost every API; when\
    \ resources are no longer needed and it’s better to release them. So, how do you\
    \ close an event stream? Write the following and you’ll no longer receive updates\
    \ from the source:\n\n```\neventsource.close(); //closes the event stream\n```\n\
    \n## A Sample Event Source\n\nTo finish with, how about some Chuck Norris jokes?\
    \ Let’s create a simple `EventSource` that will randomly fetch a joke and push\
    \ it to our HTML page. Here’s a simple PHP script that pushes the new data:\n\n\
    *source.php*\n\n```\n<?php\nheader('Content-Type: text/event-stream');\nheader('Cache-Control:\
    \ no-cache'); \nob_implicit_flush(true);\nob_end_flush();\nwhile (true) {\n  sleep(2);\n\
    \  $curl=curl_init('http://api.icndb.com/jokes/random');\n  curl_setopt($curl,\
    \ CURLOPT_RETURNTRANSFER, true);\n  $result=curl_exec($curl);\n  echo \"data:$result\\\
    n\\n\";\n}\n?>\n```\n\n### Note: Some Notes on the PHP Script\n"
