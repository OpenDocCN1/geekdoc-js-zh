  trans: "\n\n### 提示：targetOrigin\n\n将 `targetOrigin` 视为告诉浏览器消息可以发送到哪个源的方式。你也可以将 `\"\
    *\"` 作为 `targetOrigin`。正如你可能猜到的，`*` 是一个通配符，表示消息可以发送到任何源的文档。但使用通配符意味着通过允许消息发送到任何源来削弱你的安全系统。我建议将精确的源作为第二个参数传递给\
    \ `postMessage()`，而不是使用通配符。\n\n现在我们需要在 `child.html` 中接收消息并采取适当的操作。以下是修改后的 `child.html`：\n\
    \n`child.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>一个提供随机图片的页面</title>\n\
    </head>\n<body>\n\n  <div id=\"container\">\n    <img\n      src=\"http://randomimage.setgetgo.com/get.php?key=2323232\"\
    \n      id=\"image\"\n    />\n  </div>\n\n  <script>\n    window.addEventListener('message',\
    \ messageReceiver, false);\n\n    function messageReceiver(event) {\n\n      //\
    \ 源是否可以信任？\n      if (event.origin != 'http://localhost') return;\n\n      document.getElementById('image').src\
    \ =\n      \"http://randomimage.setgetgo.com/get.php?key=\" + event.data;\n\n\
    \      console.log(\n        'source=' + event.source +\n        ', data=' + event.data\
    \ +\n        ', origin=' + event.origin\n      );\n\n    }\n  </script>\n\n</body>\n\
    </html>\n```\n\n首先，我们为 `message` 事件绑定了一个回调函数。每当 `parent.html` 向 `child.html` 发送消息时，该回调函数就会执行。第一步也是重要的一步是检查你收到的消息是否来自预期的源。在为\
    \ `message` 事件添加事件监听器后，你可以接收来自任何源的文档的消息。因此，建议始终在回调函数中放置一个检查，以确保消息来自受信任的源。\n\n\
    接下来，我们从 `event.data` 中获取消息。我们用于随机图片的这个特定 API 每次都需要一个不同的随机数，这样生成的图片才是唯一的。这就是为什么我们在点击按钮时（在\
    \ `parent.html` 中）生成一个随机数，并将其作为消息传递给 `child.html`。在 `child.html` 中，我们仅需借助随机数构建一个新的图片\
    \ URL 并更新图片的 `src`。结果是，我们每次从主页面点击刷新按钮时，都能看到一张新图片。\n\n### 注意：发送回执消息\n\n如果你想向 `parent.html`\
    \ 发回消息，你可以在 `child.html` 的事件监听器中随时使用 `event.source.postMessage()`。因此，你还需要在父页面准备一个事件处理器。\n\
    \n## 检测文档的就绪状态\n\n大多数情况下，你会向嵌入在页面中的 iframe 发送消息。但很多时候，你可能还需要从页面打开一个新窗口并向其发送消息。在这种情况下，请确保打开的窗口已完全加载。在打开的窗口内部，为\
    \ `DOMContentLoaded` 事件绑定一个回调函数，并在该函数向父窗口发送消息，指示当前窗口已完全加载。\n\n### 提示：获取引用\n\n\
    在 `DOMContentLoaded` 事件监听器中（打开的窗口内），你可以通过访问 `event.currentTarget.opener` 获取窗口的引用，并像往常一样对其调用\
    \ `postMessage()`。Tiffany Brown 在[一篇优秀的教程中](http://dev.opera.com/articles/view/window-postmessage-messagechannel/#whenisdocready)解释了如何实现这一点。\n\
    \n## 结论\n\n这是跨文档消息 API（Cross-document Messaging API）的概述。通过使用此 API，两个跨源文档可以安全地交换数据。由于\
    \ DOM 没有直接暴露，现在页面已经可以直接操作第三方文档了。\n\n跨文档消息 API 确实赋予了你更多力量。但正如你所知，能力越大，责任越大！如果你未能正确使用此\
    \ API，可能会导致你的网站暴露在各种安全风险之中。因此，正如本章所讨论的，在接收跨文档消息时你应该非常非常小心，以避免安全风险。同样，在使用 `window.postMessage()`\
    \ 发送消息时，不要使用 `*` 作为 `targetOrigin`。相反，请提供一个有效的源名称。\n\n虽然无法详细涵盖该 API 的每一个细节，但本章为你提供了一个基础。你现在应该能够自己进行各种实验了。为了进一步阅读，我强烈推荐以下资源：\n\
    \n* [Mozilla 开发者网络 (MDN)](https://developer.mozilla.org/en-US/docs/Web/API/Window.postMessage)\n\
    * [W3C 规范。](http://www.w3.org/TR/webmessaging/)\n\n到此，我们对五个最重要且实用的 HTML5 API 的之旅结束了。希望你发现这本书是对这些强大技术的实用介绍。请去查看我在每一章末尾分享的示例项目想法；我也鼓励你发挥创意，思考一些其他良好的用例。\n\
    \n祝编码愉快！\n\n"
