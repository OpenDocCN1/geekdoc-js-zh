    Chrome and Opera 15 support all but `datetime`. Safari as of version 6.0.5, Firefox
    as of version 25, and Internet Explorer as of version 10 do not support any of
    these types.


    #### `input type="color"`


    With the `color` input type, we can add a native color picker control to our applications.
