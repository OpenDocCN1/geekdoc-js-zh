  trans: "\n\n- `key`:包含保存到存储区域的键名\n- `oldValue`:包含该键的旧值，如果是第一次设置具有该键的项，则为 `null`\n\
    - `newValue`:包含操作期间添加的新值\n- `url`:包含引发此项更改的页面 URL\n- `storageArea`:指示受更新影响的存储对象―`localStorage`\
    \ 或 `sessionsStorage`\n\n通过这些属性，你可以更新界面或向用户通报操作状态。在这种情况下，我们将使用 `location.reload()`\
    \ 静默地刷新其他标签页/窗口中的页面。\n\n```\nfunction storagehandler(event){\n    location.reload();\n\
    }\n```\n\n现在，我们的列表在所有标签页中都是更新过的。\n\n### 跨浏览器的存储事件\n\n存储事件有点复杂，且在大多数浏览器中的工作方式可能与你预期的不同。`storage`\
    \ 事件并不是在*当前*窗口或标签页中触发，而应该是在共享相同存储区域的*其他窗口和标签页*中触发。假设用户在两个标签页中打开了 `http://ourexamplesite.com/buy-a-ticket`。如果他们在第一个标签页中采取了更新存储区域的操作，那么\
    \ `storage` 事件将应该在第二个标签页中触发。\n\nChrome、Firefox、Opera 和 Safari 符合 Web 存储规范，而 Internet\
    \ Explorer 则不。相反，Internet Explorer 会在每次更改（包括当前窗口）时在每个窗口中触发 `storage` 事件。\n\n目前没有一种良好且无需黑科技（hack-free）的方法来解决这个问题。目前，重新加载应用程序―如我们上面所做的―是跨浏览器的最佳选择。\n\
    \n### 注意：IE 的非标准 `remainingSpace` \n\nInternet Explorer 在其 `localStorage` 对象上包含一个非标准的\
    \ `remainingSpace` 属性。我们可以根据 `localStorage.remainingSpace` 是否为 `undefined` 来区别地处理存储事件。不过，这种方法存在风险；微软可能会在不修复存储事件\
    \ Bug 的情况下移除 `remainingSpace` 属性。\n\n### 确定哪个方法触发了存储事件\n\n没有简单的方法可以确定是 `setItem()`、`removeItem()`\
    \ 还是 `clear()` 中的哪一个触发了存储事件。但有一种方法：检查事件属性。\n\n如果 `storage` 事件是由调用 `localStorage.clear()`\
    \ 引起的，那么该对象的 `key`、`oldValue` 和 `newValue` 属性都为 `null`。如果是 `removeItem()` 触发的，`oldValue`\
    \ 将匹配被删除的值，且 `newValue` 属性将为 `null`。如果 `newValue` 不是 `null`，那么可以确定 `setItem()`\
    \ 是被调的方法。\n\n## 存储数组和对象\n\n正如本章前面提到的，Web 存储键和数组必须是字符串。如果你尝试保存对象或数组，浏览器会将它们转换为字符串。这可能会导致意想不到的结果。首先，让我们来看保存数组：\n\
    \n```\nvar arrayOfAnimals = ['cat','dog','hamster','mouse','frog','rabbit'];\n\
    \nlocalStorage.setItem('animals', arrayOfAnimals);\n\nconsole.log(localStorage.animals[0])\n\
    ```\n\n如果我们查看 Web 存储检查器，可以看到我们的动物列表已保存到 `localStorage` 中，如图 24.3 所示。\n\n![在 Safari\
    \ 开发者工具中以字符串保存到 Web 存储的数组](img/localstorage-arrays.png)\n\n图 24.3. 在 Safari 开发者工具中以字符串保存到\
    \ Web 存储的数组\n\n但如果你尝试读取该数组的第一个项，你会发现第一个项是字母 `C`，而不是我们数组中的 `cat`。相反，它被转换为了逗号分隔的字符串。\n\
    \n同样，当对象被转换为字符串时，它会变成 `[object Object]`。你丢失了所有的属性和值，如图 24.4 所示。\n\n![在 Safari\
    \ 开发者工具中将对象保存到 Web 存储的结果](img/localstorage-objects.png)\n\n图 24.4. 在 Safari 开发者工具中将对象保存到\
    \ Web 存储的结果\n\n为了防止这种情况发生，请使用原生 `JSON.stringify()` 方法在保存之前将你的对象和数组转换为字符串：\n\n\
    ```\nvar foodcouples = {\n  'ham':'cheese',\n  'peanut_butter':'jelly',\n  'eggs':'toast'\n\
    }\n\nlocalStorage.setItem(\n  'foodpairs_string',\n  JSON.stringify(foodcouples)\n\
    );\n```\n\n使用 `JSON.stringify()` 将*序列化*数组和对象。它们会被转换为特殊格式的字符串，其中包含索引或属性及其值，如图 24.5\
    \ 将对象保存到 Web 存储\")所示。\n\n![在 Safari 开发者工具中使用 JSON.stringify() 将对象保存到 Web 存储](img/localstorage-objects2.png)\n\
    \n图 24.5. 在 Safari 开发者工具中使用 `JSON.stringify()` 将对象保存到 Web 存储\n\n要检索这些值，请使用 `JSON.parse()`\
    \ 将其转换回 JavaScript 对象或数组。提醒一下：`JSON.parse()` 和 `JSON.stringify()` 可能会影响应用程序的性能。请谨慎使用，特别是在获取和设置项时。\n\
    \n```\n try {\n    localStorage.setItem('keyname',value);\n    return true;\n\
    } catch (error) {\n    // 也可以更新 UI。\n    console.log(error.message); \n}\n```\n\
    \n## Web 存储的局限性\n\nWeb 存储有两个局限性：性能和容量。\n\nWeb 存储是*同步的*。读取和写入会立即添加到 JavaScript\
    \ 处理队列中。在引擎完成对存储区域的写入或读取之前，队列中的其他任务不会完成。对于小数据，这通常不是问题。但对于大数据或大量的写入操作，就会有问题。\n\n\
    Web 存储还有大小限制。如果你的应用程序达到了该限制，浏览器将抛出 `DOMException` 错误。使用 `try-catch` 语句来捕获并处理此错误。在支持的浏览器中，你还可以使用\
    \ `window.onerror`（或使用 `addEventListener` 和 `error` 事件）：\n\n限制取决于浏览器和版本。Web 存储规范建议每个源初始大小为\
    \ 5MB。然而，Safari 目前允许每个源存储 2.5MB 数据。Chrome、Internet Explorer 和 Opera 15+ 目前存储 5MB\
    \ 数据。Firefox 默认存储 5MB，但用户可以在 `about:config` 菜单中调整此限制。旧版本的 Opera（12 及以下）会提示用户提高存储限制。\n\
    \n好消息是，这些值可能会增加。坏消息是，大多数浏览器未能向应用程序暴露可用的存储空间量。\n\n现在我们已经涵盖了 Web 存储的细节，让我们来看 Web\
    \ 数据库：IndexedDB。\n\n# 第 25 章：离线应用：使用客户端数据库存储数据\n\nWeb 存储（`localStorage` 和 `sessionStorage`）对于像待办事项这样的小量数据很好，但它是非结构化数据存储。你可以存储键和值，但无法轻松搜索值。数据没有按照特定方式组织或排序，此外，5MB\
    \ 的存储限制对于某些应用程序来说太小了。\n\n对于大量的结构化搜索数据，我们需要另一个选项：Web 数据库。Web SQL 和 IndexedDB 等\
    \ Web 数据库提供了 Web 存储限制的替代，让我们能够创建真正的离线应用。\n\n## 客户端数据库现状\n\n遗憾的是，这听起来并不简单。浏览器在支持客户端数据库方面分为三个阵营：\n\
    \n- 同时支持 IndexedDB 和 Web SQL (Chrome, Opera 15+)\n- 仅支持 IndexedDB (Firefox, Internet\
    \ Explorer 10+)\n- 仅支持 Web SQL (Safari)\n\n"
- fmt: "\nIndexedDB is a bit of a nonstarter if you plan to support mobile browsers.\
    \ Safari for iOS and Opera Mobile 11-12 support Web SQL exclusively; same for\
    \ the older versions of Android and Blackberry browsers.\n\nIf you want your application\
    \ to be available across desktop browsers, you’re about halfway there with Web\
    \ SQL. It’s available in Safari, Chrome, and Opera 15+, but Firefox and Internet\
    \ Explorer 10+ have no plans to add support.\n\nHere’s the thing: the World Wide\
    \ Web Consortium has stopped work on the Web SQL specification. As a result, there\
    \ is a risk that browsers will drop Web SQL support, or that further development\
    \ will proceed in nonstandard ways. Relying on it is risky, so for that reason\
    \ we will focus on IndexedDB in this chapter, and use a polyfill to support Safari\
    \ and older versions of Opera.\n\nThe bright side is that there are a few JavaScript\
    \ polyfills and libraries available to bridge the gap between Web SQL and IndexedDB.\
    \ [Lawnchair](http://brian.io/lawnchair/) supports both, and will use `localStorage`\
    \ if you prefer. There’s also [PouchDB,](http://pouchdb.com/) which uses its own\
    \ API to smooth over the differences between Web SQL and Indexed DB. PouchDB also\
    \ supports synchronization with a CouchDB server, though CouchDB isn’t necessary\
    \ for building an app with PouchDB.\n\nIn this chapter, we’ll focus on IndexedDB,\
    \ and use [IndexedDBShim](http://nparashuram.com/IndexedDBShim/) for other browsers.\n\
    \n## About IndexedDB\n\nIndexedDB is a schema-less, transactional, key-value store\
    \ database. Data within an IndexedDB database lacks the rigid, normalized table\
    \ structure as you might find with MySQL or PostgresSQL. Instead, each record\
    \ has a key and each value is an object. It’s a client-side “NoSQL” database that’s\
    \ more akin to CouchDB or MongoDB. Objects may have any number of properties.\
    \ For example, in a to-do list application, some objects may have a `tags` property\
    \ and some may not, as evident in [Figure 25.1](#ch25.html_tags \"Figure 25.1.\
    \ Objects with and without a tags property\").\n\n![Objects with and without a\
    \ tags property](figures/schema-free.png)\n\nFigure 25.1. Objects with and without\
    \ a `tags` property\n\nTwo objects in the same database can even have completely\
    \ different properties. Usually, we’ll want to use a naming convention for our\
    \ object property names.\n\nIndexedDB is also **transactional**. If any part of\
    \ the read or write operation fails, the database will roll back to the previous\
    \ state. These operations are known as **transactions**, and must take place inside\
    \ a callback function. This helps to ensure data integrity.\n\nIndexedDB has two\
    \ APIs: synchronous and asynchronous. In the synchronous API, methods return results\
    \ once the operation is complete. This API can only be used with [Web Workers](http://en.wikipedia.org/wiki/Web_worker),\
    \ where synchronous operations won't block the rest of the application. There\
    \ is no browser support for the synchronous API at the time of writing.\n\nIn\
    \ this chapter, we’ll cover the asynchronous API. In this mode, operations return\
    \ results immediately without blocking the calling thread. Asynchronous API support\
    \ is available in every browser that supports IndexedDB.\n\nExamples in this book\
    \ use the latest version of the [IndexedDB](http://www.w3.org/TR/IndexedDB/) specification.\
    \ Older versions of IndexedDB in Chrome (23 and earlier) and Firefox (16 and earlier)\
    \ required a vendor prefix. These experimental versions had several inconsistencies\
    \ between them, which have been largely worked out through the specification process.\
    \ Since the standardized API has been available for several versions in both Firefox\
    \ and Chrome, and is available in Internet Explorer 10+, we won’t bother with\
    \ older versions.\n\n### Note: Inspecting IndexedDB Records\n\nIf you’d like to\
    \ inspect your IndexedDB records, use Chrome or Opera 15+. These browsers currently\
    \ have the best tools for inspecting IndexedDB object stores. With IndexedDBShim,\
    \ you can use Safari’s Inspector to view this data in Web SQL, but it won’t be\
    \ structured in quite the same way. Internet Explorer offers an [IDBExplorer package](http://ie.microsoft.com/testdrive/HTML5/newyearslist/IDBExplorer.zip)\
    \ for debugging IndexedDB, but it lacks native support in its developer tools.\
    \ Firefox developer tools are yet to support database inspections.\n\nNow, let’s\
    \ look at the concepts of IndexedDB by creating a journaling application to record\
    \ diary entries.\n\n## Setting up Our HTML\n\nBefore we dive into IndexedDB, let’s\
    \ build a very simple interface for our journaling application:\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en-us\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>IndexedDB\
    \ Journal</title>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\"\
    >\n</head>\n<body>\n<form>\n  <p>\n    <label for=\"tags\">How would you like\
    \ to tag this entry?</label>\n    <input type=\"text\" name=\"tags\" id=\"tags\"\
    \ value=\"\" required>\n    <span class=\"note\">(Optional. Separate tags with\
    \ a comma.)</span>\n  </p>\n  <p>\n    <label for=\"entry\">What happened today?</label>\n\
    \    <textarea id=\"entry\" name=\"entry\" cols=\"30\" rows=\"12\" required>\n\
    \    </textarea>\n    <button type=\"submit\" id=\"submit\">Save entry</button>\n\
    \  </p>\n</form>\n\n <section id=\"allentries\" class=\"hidden\">\n  <h1>View\
    \ all entries</h1>\n </section>\n\n<script src=\"js/IndexedDBShim.min.js\"></script>\n\
    <script src=\"js/journal.js\"></script>\n</body>\n</html>\n```\n\nThis gives us\
    \ a very simple interface consisting of two form fields and a Save entry button,\
    \ as shown in [Figure 25.2](#ch25.html_journal \"Figure 25.2. Our simple journal\
    \ interface as shown in Firefox.). We've also added a view that displays all entries\
    \ after we've saved our latest one. A production-ready version of this application\
    \ might have a few more screens, but for this demo this is fine.\n\n![Our simple\
    \ journal interface as shown in Firefox.](figures/journal-ui.png)\n\nFigure 25.2.\
    \ Our simple journal interface as shown in Firefox.\n\n## Creating a Database\n\
    \nTo create a database, use the `open()` method. It accepts two arguments: the\
    \ name of your database and an optional integer value that sets the version of\
    \ the database:\n\n```\nvar idb = indexedDB.open('myIDBJournal',1);\n```\n\nYour\
    \ database name may be any string value, including the empty string (`''`). The\
    \ name just ties the database to the origin. As with `localStorage`, IndexedDB\
    \ databases can only be read to—or written to by—scripts that share its origin.\
    \ Remember that an origin consists of the scheme (such as `http://` or `https://`),\
    \ the hostname, and port number). These must match exactly, meaning that a database\
    \ created at `http://example.com` can't be accessed by scripts at `http://api.example.com`\
    \ and vice versa.\n\nVersion numbers can be any integer from 1 to 2^53 (that’s\
    \ 9,007,199,254,740,991). Floats, or decimal values, won’t work. Floats will be\
    \ converted to integers. For example, 2.2 becomes 2 and 0.8 becomes 0 (and throws\
    \ a `TypeError`). If you don’t include a version number, the browser will use\
    \ 1.\n\nIf the `open` operation is successful, the browser will fire a `success`\
    \ event. We can use the `onsuccess` callback to perform transactions or, as we’ve\
    \ done here, use it to assign our database object to a global variable:\n\n```\n\
    // initialize the variable.\nvar databaseObj;\nidb.onsuccess = function(successEvent){\n\
    \    // set its value.\n    databaseObj = successEvent.target.result;\n}\n```\n\
    \nAs with all DOM events, our `successEvent` object contains a `target` property.\
    \ In this case, the target is our `open` request transaction. The `target` property\
    \ is also an object, and contains a `result` property, which is the result of\
    \ our transaction. In this case, the value of `result` is our database.\n\nThis\
    \ is a really important point to understand. *Every transaction requires an `onsuccess`\
    \ handler*. The results of that transaction will always be a child property of\
    \ the target object, which is a property of the event object (`event.target.result`).\n"
