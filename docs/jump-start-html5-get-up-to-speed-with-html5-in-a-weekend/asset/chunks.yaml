  trans: "\n只需确保将 Modernizr 脚本加载到 `<head>` 区域即可。这是因为 `HTML5 Shiv`（用于在 IE9 之前的浏览器中启用\
    \ HTML5 元素的样式设置）必须在 body 加载之前执行。此外，如果你使用了 Modernizr 特定的 CSS 类，如果脚本没有加载在 `<head>`\
    \ 中，可能会遇到 [FOUC（无样式内容闪烁)](http://en.wikipedia.org/wiki/Flash_of_unstyled_content)。\n\
    \n现在，假设你想检测浏览器对 Web Workers 的支持。以下代码片段可以完成此操作：\n\n```\nif(Modernizr.webworkers){\n\
    \    //继续后续操作\n}\nelse{\n    //不支持 web workers\n}\n```\n\n所以，如果浏览器支持 `webworkers`，`Modernizr.webworkers`\
    \ 属性将为 `true`。对于所有其他功能都有类似的测试。我们将在本书中使用 Modernizr 来检查浏览器的兼容性。\n\n## 环境搭建\n\n要创建\
    \ HTML5 应用，你实际上只需要你喜欢的文本编辑器和浏览器。但为了使用某些 API，如服务器发送事件（Server-sent Events）和 WebSocket，你需要一个服务器。因此，我要求你在机器上安装\
    \ [WAMP](http://www.wampserver.com/en/) 或 [XAMPP](http://www.apachefriends.org/en/xampp.html)，以便我们能够轻松创建一个本地服务器来尝试各种功能。如果你已经搭建好了服务器，就可以开始了。\n\
    \n在本章中，我们讨论了书中涵盖的 API 列表，并学习了如何检测浏览器对每个 HTML5 特的支持。我们还简要讨论了每个 API 的用途，并最后搭建了开发环境。\n\
    \n我知道你已经等不及要大干一场了。既然你已经了解了所有基础知识，让我们开始 HTML5 API 世界之旅，Web Workers 是第一个访问的地方。\n\
    \n# 第 27 章：API：Web Workers\n\n每个 HTML5 应用都是用 JavaScript 编写的，但 HTML5 应用唯一且最主要的限制是浏览器的\
    \ JavaScript 运行时本质上是单线程的。你们可能有人会说，过去曾使用 `setTimeout`、`setInterval` 以及我们最喜欢的 `XMLHttpRequest`\
    \ 等函数运行过异步任务。但实际上，这些函数只是异步的，而不是并发的。事实上，所有的 JavaScript 任务都是顺序执行并相应队列的。Web Workers\
    \ 为我们提供了一个多线程环境，多个线程可以并行执行，从而提供真正的并发。\n\n在本章中，我们将首先讨论 Web Workers 的用途和使用方法，然后查看其一些限制性和安全考虑因素。\n\
    \n## 简介与用法\n\nWeb Worker API 允许我们编写应用程序，其中计算密集型脚本可以在后台运行，而不阻塞主 UI 线程。结果，由于主线程阻塞导致的无响应脚本对话框——如图\
    \ 27.1 所示——可以成为过去。\n\n![无响应的脚本消息](img/unresponsive-script.png)\n\n图 27.1. 无响应的脚本消息\n\
    \nWeb Workers 有两种：专用线程（dedicated workers）和共享线程（shared workers）。主要的区别在于可见性。专用线程可以从创建它的父脚本访问，但共享线程可以从相同源的任何脚本访问。共享线程对浏览器的支持有限：Chrome\
    \ 4.0+、Safari 5.0+ 和 Opera 10.6+。Firefox 和 IE 都不支持共享线程。\n\n我们将在书中讨论专用线程，因为那可能是你最可能用到的。\n\
    \n### 注意：检测支持\n\n在继续之前，我只想确保你已经检测了浏览器对 Web Workers 的支持。在上一章中，我展示了一个使用原生 JavaScript\
    \ 和 Modernizr 检测 Web Workers 支持的示例，所以我们在这里跳过重复部分。\n\n要使用 Web Workers，你只需要调用 `Worker`\
    \ 构造函数并传递 Worker 脚本的 URI 即可\n\n```\nvar worker=new Worker('myworker.js');\n```\n\
    \n### 注意：Worker 脚本路径\n\n请注意，Worker 脚本路径必须与父脚本具有相同源，并且相对于父脚本的位置。\n\n这里，`myworker.js`\
    \ 是需要在后台执行的 Worker 脚本。要与 Worker 通信，你只需要在 `worker` 对象上调用 `postMessage` 并传递消息（如果有）：\n\
    \n```\n// 在不带任何消息的情况下启动 worker\nworker.postMessage();\n\n// 传递消息并启动 worker\nworker.postMessage('嘿，你准备好开始工作了吗？');\n\
    ```\n\n但通信不必是单向的。我们的 Worker 也可以回复！为了接收从 Worker 发送的消息，我们在 `worker` 对象上附加一个事件监听器，如下：\n\
    \n```\n// 注册回调函数\nworker.addEventListener('message',function(e){\n  alert('收到来自\
    \ worker 的消息，'+e.data);\n},false);\n```\n\n处理函数还会接收一个 `message` 事件对象。该对象有一个名为\
    \ `data` 的属性，包含了发送的实际消息。因此在上面的代码中，我们访问了 `e.data` 属性来检索由 Worker 发送的数据。\n\n那么在主脚本中作为参数传递给\
    \ `postMessage()` 的消息会发生什么呢？嗯，它会被传递到 Worker 脚本，在 Worker 端可以通过注册相同的事件监听器来获取。以下代码片段显示了如何操作：\n\
    \n*myworker.js*\n\n```\n// 从 worker 发送\nself.addEventListener('message',function(e){\n\
    \  postMessage('我按照你说的做了！');\n},false);\n```\n\n### 警告：Workers 是沙箱化的\n\nWorkers\
    \ 运行在沙箱环境中。这意味着它们无法访问普通脚本可以访问的所有内容。例如，在之前的代码中如果你使用 `window` 而不是 `self` 就会出问题。Workers\
    \ 也无法访问 DOM。原因稍后。\n\n发生错误时，`onerror` 回调会被调用。以下回调应在父脚本中注册：\n\n```\n// 注册 error\
    \ 回调\nworker.addEventListener('error',function(e) {\n  console.log(\n    '错误发生在\
    \ '+e.filename+' 行 '+e.lineno\n  );\n},false);\n```\n\n### 传递 JSON 数据\n\nWeb Workers\
    \ 只能传递一个参数；但是，该参数可以是包含多个项目的复杂对象。让我们修改代码来传递 JSON 数据：\n\n*parentScript.js*\n\n```javascript\n\
    var worker=new Worker('myworker.js');\n\nworker.addEventListener('message',function(e){\n\
    \  alert('收到来自 '+e.data.answerer+' 的回答：'+e.data.answer);\n},false);\n\nworker.postMessage({'question':'你好吗？','askedBy':'父脚本'});\n\
    ```\n\n*myworker.js*\n\n```javascript\nself.addEventListener('message', function(e)\
    \ {\n\n  console.log(\n    '问题：' + e.data.question + \n    '问者：'+e.data.askedBy\n\
    \   );\n\n  self.postMessage(\n    {\n      'answer': '挺不错的！',\n      'answerer':'Worker'\n\
    \    }\n  );\n\n},false);\n```\n\n### 注意：Worker 数据是复制的\n\n传递给 Worker 的数据是复制的，而不是共享的。接收方始终接收发送数据的副本。这意味着在发送之前，数据会被序列化，并在接收端被反序列化。你可能奇怪为什么这样实现。简单！为了避免线程问题。\n\
    \n### Web Worker 特性\n\n如之前提到的，Workers 运行在沙箱环境中。它们的特性包括：\n\n*   对 `navigator` 和\
    \ `location` 对象的只读访问\n\n*   `setTimeout`/setInterval` 函数以及 `XMLHttpRequest` 对象，与主线程一样\n\
    \n*   创建和启动子 Worker\n\n*   通过 `importScripts()` 函数导入其他脚本\n\n*   利用 AppCache 的能力\n\
    \n"
- fmt: "\n### Note: Why Workers Are Unable to Access the DOM\n\nBrowsers (and the\
    \ `DOM`) operate on a single thread. That's because your code can prevent other\
    \ actions, such as a link being clicked. Multiple threads could break that. Also\
    \ the `DOM` is not thread-safe. For these reasons, the `Worker` threads have no\
    \ access to the `DOM`—but that won't stop your Workers from modifying main page\
    \ content. You can always pass a result back to the parent script and let the\
    \ UI thread update the `DOM` content. I will show you how at the end of the chapter.\n\
    \nThere is just one final issue before we move onto more advanced features: how\
    \ to close a thread. To terminate a thread, just call `worker.terminate()` from\
    \ main script or `self.close()` from the worker itself.\n\n## More Advanced Workers\n\
    \n### Inline Workers\n\nEverybody loves to do things on the fly. Since Web Workers\
    \ run in a separate context, the `Worker` constructor expects a URI that specifies\
    \ an external script file to run. But if you want to be really quick, you can\
    \ create Inline Workers on the fly through `blobs`. Have a look at the following\
    \ code:\n\n```\nvar blob = new Blob([\"onmessage = function(e) {\nself.postMessage(e.data);\
    \ });\n\nvar worker = new Worker(window.URL.createObjectURL(blob));\n\nworker.addEventListener('message',\
    \ function(e){\n  alert('Got same Message: '+e.data+' from worker');\n},false);\n\
    \nworker.postMessage('Good Morning Worker!!');\n```\n\nIn this snippet, we wrote\
    \ the content of our Worker in a `Blob`. `window.URL.createObjectURL` essentially\
    \ creates a URI (for example, `blob:null/027b645d-be05-4f14-8866-e52604777608`)\
    \ that references the content of the Worker, and that URI is passed to the `Worker`\
    \ constructor. Then we proceed as usual.\n\nSince it’s inconvenient to put all\
    \ the Worker content into a `Blob` constructor, we can alternatively put all the\
    \ Worker code in a separate `script` tag inside the parent HTML. Then, at runtime,\
    \ we pass that content to the `Blob` constructor.\n\nIn the following example,\
    \ we write the Worker in the parent HTML page itself. Once the Worker starts,\
    \ it will execute a function every second and return the current time to the main\
    \ thread. The main thread will then update the `div` with the time (remember we\
    \ talked about updating the DOM?):\n\n`parentPage.html`\n\n```\n<!DOCTYPE html>\n\
    <html\n<head>\n<!-- \n  The following script won't be parsed by the JavaScript\
    \ engine \n  because of its type\n-->\n<script type=\"text/javascript-worker\"\
    \ id=\"jsworker\">\n\n  setInterval(function(){\n    postMessage(getTime());\n\
    \  }, 1000);\n\n  function getTime(){\n    var d = new Date();\n    return d.getHours()+\"\
    :\"+d.getMinutes()+\":\"+d.getSeconds();\n  }\n\n</script>\n\n<script>\n  var\
    \ blobURI = new Blob(\n    [document.querySelector(\"#jsworker\").textContent]\n\
    \  );\n\n  var worker=new Worker(window.URL.createObjectURL(blobURI));\n\n  worker.addEventListener('message',function(e){\n\
    \    document.getElementById('currTime').textContent=e.data;\n  },false);\n\n\
    \  worker.postMessage();\n</script>\n</head>\n<body>\n<div id=\"currTime\"></</div>\n\
    </body>\n</html>\n```\n\nThis code is fairly self-explanatory. Once the Worker\
    \ starts, we register a function that is executed every second and returns the\
    \ current time. The same data is retrieved and the `DOM` is updated by the main\
    \ thread. Furthermore, `#currTime` can be cached for better performance.\n\nIf\
    \ you’re creating many blob URLs, it’s good practice to release them once you’re\
    \ done (I’d recommend that you avoid creating too many blob URLs):\n\n```\nwindow.URL.revokeObjectURL(blobURI);\
    \ // release the resource\n```\n\n### Creating Subworkers Inside Workers\n\nIn\
    \ your Worker files you can further create subworkers and use them. The process\
    \ is the same. The main benefit is that you can divide your task between many\
    \ threads. The URIs of the subworkers are resolved relative to their parent script’s\
    \ location, rather than the main HTML document. This is done so that each Worker\
    \ can manage its dependencies clearly.\n\n### Using External Scripts within Workers\n\
    \nYour Workers have access to the `importScripts()` function, which lets them\
    \ import external scripts easily. The following snippet shows how to do it:\n\n\
    ```\n// import a single script\nimportScripts('external.js');\n\n//import 2 script\
    \ files\nimportScripts('external1.js','external2.js');\n```\n\n### Note: URIs\
    \ are Relative to the Worker\n\nWhen you import an external script from the Worker,\
    \ the URI of the script is resolved relative to the Worker file location instead\
    \ of the main HTML document.\n\n## Security Considerations\n\nThe Web Worker API\
    \ follows the same-origin principle. It means the argument to `Worker()` must\
    \ be of the same origin as that of the calling page.\n\nFor example, if my calling\
    \ page is at `http://xyz.com/callingPage.html`, the Worker cannot be on `http://somethingelse.com/worker.js`.\
    \ The Worker is allowed as long as its location starts with `http://xyz.com`.\
    \ Similarly, an `http` page cannot spawn a Worker whose location starts with `https://`.\n\
    \n[Figure 27.2](#ch27.html_sameorigin \"Figure 27.2. Origin error in Chrome\"\
    ) shows the error thrown by Chrome when trying to go out of the origin:\n\n![Origin\
    \ error in Chrome](figures/sameorigin.png)\n\nFigure 27.2. Origin error in Chrome\n\
    \nSome browsers may throw security exceptions if you try to access the files locally\
    \ (via the `file://` protocol). If you are getting any such exceptions, just put\
    \ your file in the local server and access it with this: `http://localhost/project/somepage.html`.\n\
    \n## Polyfills for Older Browsers\n\nWhat if the browser does not support the\
    \ Web Workers API? There are several polyfills available to support older browsers\
    \ by simulating the behavior of Web Workers. [The Modernizr page on Github](https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-browser-Polyfills#web-workers)\
    \ has a list of such polyfills, but long-running code may fail with these implementations.\
    \ In those cases, it may be necessary to offload some processing to the server\
    \ via Ajax.\n\n## Conclusion\n\nWeb Workers give you a big performance boost because\
    \ of their multi-threaded nature. All modern browsers, including IE10 and above,\
    \ offer support for Web Workers.\n\nHere are a few use cases that you can try\
    \ to implement:\n\n- [long polling](http://techoctave.com/c7/posts/60-simple-long-polling-example-with-javascript-and-jquery)\
    \ in the background and notifying the user about new updates\n- pre-fetching and\
    \ caching content\n- performing computationally expensive tasks and long-running\
    \ loops in the background\n- a spell-checker that runs continuously in the background\n\
    \n# Chapter 28\n\nGeolocation API provides an easy way to retrieve the exact position\
    \ of your users. For example, you can create an app that gives personalized suggestions\
    \ to the users based on their current location. You may also plot their position\
    \ on the map to show navigation details.\n\nIn this chapter, I will give you an\
    \ overview of the Geolocation API and show how you can use it to create magical\
    \ location-based HTML5 apps.\n\n## Hitting the Surface\n\nBefore using the API,\
    \ let’s just make sure the browser supports it:\n\n```\nif (navigator.geolocation)\
    \ {\n  // do something awesome\n}\nelse {\n  // provide alternative content\n\
    }\n```\n\nThe same check can be achieved through `Modernizr`:\n\n```\nif (Modernizr.geolocation)\
    \ {\n  //do something awesome\n}\nelse {\n  //provide alternative content\n}\n\
    ```\n\nUse the following code for the actual position of the user:\n"
