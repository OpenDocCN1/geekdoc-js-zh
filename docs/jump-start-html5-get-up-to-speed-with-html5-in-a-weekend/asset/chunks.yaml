    \ It accepts a series of key-value pairs using its `append()` method (`append(key,value)`).\
    \ Alternatively, you can pass a form object as an argument to the constructor.\
    \ Here we’ve done both, based on whether or not we have saved anything to `localStorage`.\
    \ A more robust version of this demo might handle this with separate features:\
    \ one for sending form data and another for syncing with the server.\n\nThis doesn’t\
    \ work if the server response contains an HTTP error code. You can work around\
    \ this by checking the value of the `status` property in the XHR response, as\
    \ shown here:\n\n```\nvar xhronloadhandler = function(loadEvent){\n    if( loadEvent.target.status\
    \ >= 400){\n        xhrerrorhandler();\n    } else {\n        // Parse the response.\n\
    \    }\n}\n```\n\nIf it’s 400 or greater―HTTP error codes start at 400―we’ll save\
    \ the data locally. Otherwise, parse the response.\n\n## What You’ve Learned\n\
    \nIn this chapter, we’ve discussed the advantages and limitations of the `navigator.onLine`\
    \ property, an alternate way to test for connectivity. Now let’s talk about the\
    \ browser features and APIs that let us create offline web applications. In our\
    \ [next chapter](#ch23.html \"Chapter 23Offline Apps: Application Cache\"), we’ll\
    \ look at the application cache.\n\n# Chapter 23\n\nOffline Apps: Application\
    \ Cache\n\nApplication Cache―“AppCache” for short―provides a way to save the assets\
    \ of an application locally so that they can be used without an internet connection.\
    \ It’s especially well-suited to “single-page” applications that are JavaScript-driven\
    \ and use local data stores such as `localStorage` and IndexedDB.\n\nAppCache\
    \ consists of two parts: the plain text file known as a *manifest*, and a DOM\
    \ interface for scripting and help managing updates. By the end of this chapter,\
    \ you’ll know how to write a cache manifest file, how to manage updates, and some\
    \ of the aspects to watch out for when using this API.\n\n### Note: AppCache in\
    \ IE\n\nApplication Cache is not supported in Internet Explorer 9 or below. You’ll\
    \ need to use version 10 or later. For a complete list of browsers supporting\
    \ AppCache, try [CanIUse.com.](http://caniuse.com/#search=appcache)\n\n## Cache\
    \ Manifest Syntax\n\nCache manifest files are plain text files, but they must\
    \ adhere to the manifest syntax. Let’s look at a simple example:\n\n```\nCACHE\
    \ MANIFEST\n\n# These files will be saved locally. This line is a comment.\nCACHE:\n\
    js/todolist.js\ncss/style.css\n```\n\nEvery cache manifest must begin with the\
    \ line `CACHE MANIFEST`. Comments must begin with a `#`. Notice that each file\
    \ is also listed as a separate line.\n\nThe `CACHE:` line is a section header.\
    \ There are four defined section headers in total:\n\n*   `CACHE:` explicitly\
    \ states which files should be stored locally\n\n*   `NETWORK:` explicitly states\
    \ which URLs should always be retrieved\n\n*   `FALLBACK:` specifies which locally\
    \ available file should be displayed when a URL isn’t available\n\n*   `SETTINGS:`\
    \ defines caching settings\n\n### Saving Files Locally with the `CACHE:` Section\
    \ Header\n\n`CACHE:` is unique because it is an optional section header―and it’s\
    \ the only one that is. Our cache manifest example could also be written without\
    \ it:\n\n```\nCACHE MANIFEST\n\n# These files will be saved locally. This line\
    \ is a comment.\njs/todolist.js\ncss/style.css\n```\n\nIn this case, `js/todolist.js`\
    \ and `css/style.css` will be cached locally, since they follow our `CACHE:` section\
    \ header. So will the page that linked to our manifest, even though we haven’t\
    \ explicitly said that it should be saved."
