  trans: "\n\n为了将视频绘制到 `canvas` 上，你需要为视频的 `onplay` 事件添加一个处理程序，该程序会复制当前的视频帧。\n\n```\n\
    var canvas = document.getElementById('MyCanvas')\nvar ctx = canvas.getContext('2d');\n\
    \n// 设置画布尺寸与视频相同\nvideo.onplay = function() {\n    canvas.width = video.videoWidth;\n\
    \    canvas.height = video.videoHeight;\n    draw();\n};\n\n// 将帧复制到画布上\nfunction\
    \ draw() {\n    if(video.paused || video.ended) return false;\n    ctx.drawImage(video,\
    \ 0, 0);\n    setTimeout(draw, 20)\n}\n\n// 开始视频播放\nvideo.play();\n```\n\n# 第\
    \ 17 章\n\n## Canvas & SVG：SVG 简介\n\nSVG 代表 `Scalable Vector Graphics`（可缩矢量图形）。它允许你使用\
    \ XML 标记语言创建图形。SVG 已经存在很段时间，并且被大多数浏览器支持。与 Canvas 不同，它并不是为了像素操作设计的。它允许你创建可缩放的图形，并且由于它是`分辨率无关`的，因此非常适合可能在各种屏幕分辨率和尺寸上使用的项目。例如，SVG\
    \ 是使用响应式网页设计（RWD）网站的理想选择。\n\n事实上，SVG 在 RWD 中的应用是显而易见的，你甚至会疑惑为什么有些网站仍使用传统图像重新设计。SVG\
    \ 在视网膜和其他高分辨率屏幕上也能完美显示。随着分辨率的提高，它们可能会被更广泛地使用。\n\nSVG 使用易于访问的基于 DOM 节点的 API，非常适合那些熟悉\
    \ HTML、CSS 和一些 JavaScript 的人员。你可以使用 CSS 对其进行样式化，并使用 JavaScript 使其具有交互性；对于那些不是非常熟悉\
    \ JavaScript 的人，有很多库可以提供帮助。\n\n与任何 Web 技术一样，SVG 一直不断变化，但它的许多功能可用于动画、变换、渐变、滤镜效果等。它在所有现代浏览器中都能工作——你可以在\
    \ [caniuse.com](http://caniuse.com/svg) 检查兼容性。\n\n## 为什么使用 SVG 而不是 JPEG、PNG 或\
    \ GIF？\n\n计算可以使用可以使用类型的图形：`位图`（bitmap）和`矢量`（vector）。位图（如 JPEG、PNG 和 GIF）也被称为`光栅图形`（raster\
    \ graphics），由不同颜色的单个像素组成。相比之下，SVG 等矢量图形定义了路径和点；它们可以缩放大小并保持质量。这使得它们非常适合网络用途，例如：\n\
    \n* logo 标志\n* 横幅\n* 标牌\n* 插画\n* 线条画\n\nSVG 图像相比位图图像具有几个固有优势：\n\n* 由于 SVG 图像由文本组成，它们通常比位图图像更具可访问性且对搜索引擎友好。\n\
    * 矢量图还可以放在其他对象上方并设置为半透明，这样下方的对象仍然可见。\n* 使用 SVG 创建的图形可以相对容易地编辑，并且可以结合 CSS 对输出进行样式化。这是目前传统位图图像无法实现的。\n\
    * SVG 图像的文件大小通常比位图图像小。\n\n然而，尽管它们有很多优势，但就像生活中的许多事物一样，矢量图像并不是所有应用的完美解决方案。例如，你不太可能通过矢量图形产生看起来真实的照片。\n\
    \n你可以将 SVG 嵌入标准的 HTML 文档中，并可以使用任何文本编辑器创建 SVG 图像。不过，你可能更倾向于使用 Adobe Illustrator\
    \ 或 [InkScape](http://inkscape.org/download/?lang=en)（开源矢量图形编辑器）来创建你的 SVG 图像。\n\
    \n现在你已经了解 SVG 是什么，让我们进入正题：学习如何使用它。\n\n## 入门\n\n要开始入门，你只需要使用一个基础的 HTML5 页面并将内联\
    \ SVG 代码直接放入其中即可。让我们从一个红圆圈的 SVG 图像开始：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n\
    \  <h1>A red circle:</h1>\n\n  <!-- 内联 SVG -->\n  <svg width=\"200\" height=\"\
    200\" xmlns=\"http://www.w3.org/2000/svg\">\n    <circle id=\"redcircle\" cx=\"\
    100\" cy=\"100\" r=\"100\" fill=\"red\" />\n  </svg>\n\n</body>\n</html>\n```\n\
    \n保存该文件并在浏览器中打开它，你应该能看到一个标题为“A red circle:”且带有红色圆圈的页面。\n\nSVG 部分由 `svg` 标签限定，该标签定义了页面上图像的为\
    \ 200x200px。\n\n尝试自己修改一些代码。`circle`元素通过各种属性指定了我们想要绘制的形状。`cx` 和 `cy` 属性定义了圆相对于绘制区域的中心；`r`\
    \ 属性给出圆的半径。这意味着圆的直径（宽度）将显示为你设置的半径值的两倍。\n\n你还可以给圆周围添加边框：\n\n```html\n<circle id=\"\
    redcircle\" cx=\"100\" cy=\"100\" r=\"100\" \nstroke=\"black\" stroke-width=\"\
    1\" fill=\"red\"/>\n```\n\n### 其他形状\n\n除了圆，通过在 `svg` 块内添加适当的标签创建其他形状也是简单的事情：\n\
    \n* **line**（直线）——创建一个简单的直线\n    ```html\n    <line x1=\"25\" y1=\"150\" x2=\"\
    300\" y2=\"150\" \n    stroke=\"#F00\" stroke-width=\"5\" />\n    ```\n    ![一条线](img/Lines.png)\n\
    \    图 17.1. 直线\n\n* **polyline**（折线）——定义由多个线条定义构建的形状\n    ```html\n    <polyline\
    \ points=\"0,40 40,40 40,80 80,80 80,120 120,120 120,160\"\n    stroke=\"#F00\"\
    \ stroke-width=\"5\" fill=\"#FFF\" />\n    ```\n    ![一条折线](img/Polylines.png)\n\
    \    图 17.2. 折线\n\n* **rect**（矩形）——创建一个矩形\n    ```html\n    <rect width=\"300\"\
    \ height=\"100\" fill=\"#F00\" />\n    ```\n    ![一个矩形](img/rectangles.png)\n\
    \    图 17.3. 矩形\n\n* **ellipse**（椭圆）——创建一个椭圆\n    ```html\n    <ellipse cx=\"\
    300\" cy=\"80\" rx=\"100\" ry=\"50\" fill=\"#F00\"/>\n    ```\n    ![椭圆](img/ellipses.png)\n\
    \    图 17.4. 圆\n\n* **polygon**（多边形）——创建一个多边形\n    ```html\n    <polygon points=\"\
    200,10 250,190 160,210\"\n    stroke=\"#000\" stroke-width=\"1\" fill=\"#F00\"\
    \ />\n    ```\n    ![一个（多边形）三角形](img/Polygontriangle.png)\n    图 17.5. （多边形）三角形\n\
    \n多边形在 `points` 属性中定义了一系列 x 和 y 坐标。这允许你创建具有任意边数的复杂形状。\n\n```html\n<polygon points=\"\
    100,10 40,180 190,60 10,60 160,10\" \nstroke=\"#000\" stroke-width=\"1\" fill=\"\
    pink\" />\n```\n![一个星形](img/Polygon.png)\n图 17.6. 星形\n\n* **path**（路径）——允许定义任意路径\n\
    `path`元素允许你使用特殊命令创建绘制。这些可以是大写或小写，适用于绝对和相对定位。它看起来很复杂，有很多选项，请参考[此 SitePoint 教程](http://www.sitepoint.com/svg-path/)\
    \ 获取更多信息。\n\n所有上面的形状都可以使用 `path` 创建。下面的代码使用 `path` 创建了一个分段圆，正如你在图 17.7 中所示，这对于创建饼图和类似的图形是完美的。\n\
    \n```html\n<path d=\"M300,200 h-150 a150,150 0 1,0 150,-150 z\"\nfill=\"pink\"\
    \ stroke=\"red\" stroke-width=\"3\"/>\n<path d=\"M275,175 v-150 a150,150 0 0,0\
    \ -150,150 z\"\nfill=\"purple\" stroke=\"red\" stroke-width=\"3\"/>\n```\n![路径](img/Paths.png)\n\
    图 17.7. 路径\n\n## 渐变与模式\n\n与画布一样，SVG 允许你使用渐变和模式填充或描边形状。这是通过在 SVG 的 `defs` 部分创建诸如\
    \ `linearGradient` 和 `radialGradient` 等特殊的渐变标签来实现的。其他元素可以通过名称引用这些渐变并复用到任何形状上。\n\
    \n在 `svg` 中为圆添加线性渐变：\n\n```html\n<!-- 定义渐变 -->\n<defs>\n  <linearGradient id=\"\
    MyGradient\">\n    <stop offset=\"10%\" stop-color=\"yellow\" />\n    <stop offset=\"\
    90%\" stop-color=\"blue\" />\n  </linearGradient>\n</defs>\n\n<!-- 在圆中使用渐变 -->\n\
    <circle cx=\"100\" cy=\"100\" r=\"100\" fill=\"url(#MyGradient)\" />\n```\n\n"
- fmt: "Now open it in your browser, you'll see that you now have a blue and yellow\
    \ circle. To make it a radial gradient, it's then just a case of using the `radialGradient`\
    \ tag:\n\n```xml\n<!-- define gradient -->\n<defs>\n  <radialGradient id=\"MyGradient\"\
    >\n    <stop offset=\"10%\" stop-color=\"yellow\" />\n    <stop offset=\"90%\"\
    \ stop-color=\"blue\" />\n  </radialGradient>\n</defs>\n\n<!-- use gradient in\
    \ a circle -->\n<circle cx=\"100\" cy=\"100\" r=\"100\" fill=\"url(#MyGradient)\"\
    \ />\n```\n\n### Patterns\n\nYou can also create repeating designs within a `pattern`\
    \ tag. This defines a series of SVG elements, which can be used to fill an area:\n\
    \n```svg\n<svg>\n<defs>\n<pattern id=\"mypattern\" x=\"0\" y=\"0\" width=\"150\"\
    \ height=\"100\" \npatternUnits=\"userSpaceOnUse\">\n  <circle cx=\"50\" cy=\"\
    50\" r=\"10\" fill=\"red\" stroke=\"black\"\n/>\n  <rect x=\"100\" y=\"0\" width=\"\
    50\" height=\"50\" fill=\"cyan\"   \nstroke=\"red\" />\n</pattern>\n</defs>\n\
    \  <ellipse fill=\"url(#mypattern)\" stroke=\"black\"\nstroke-width=\"1\" cx=\"\
    200\" cy=\"200\" rx=\"200\" ry=\"200\" />\n</svg>\n\n<!-- define pattern -->\n\
    <defs>\n  <pattern id=\"mypattern\" patternUnits=\"userSpaceOnUse\" \nx=\"0\"\
    \ y=\"0\" width=\"50\" height=\"50\">\n    <circle cx=\"25\" cy=\"25\" r=\"25\"\
    \ fill=\"red\" stroke=\"black\" />\n    <rect x=\"25\" y=\"25\" width=\"25\" height=\"\
    25\" \nfill=\"cyan\" stroke=\"red\" />\n  </pattern>\n</defs>\n\n<!-- use pattern\
    \ in a circle -->\n<circle cx=\"100\" cy=\"100\" r=\"100\" fill=\"url(#MyPattern)\"\
    \ \nstroke-width=\"1\" stroke=\"black\" />\n```\n\nSave the code above and open\
    \ it in a browser to see the results, shown in [Figure 17.8](#ch17.html_patternfill\
    \ \"Figure 17.8. Pattern fill\"). Now you can experiment to see what other patterns\
    \ you can make, using various shapes and color gradients.\n\n![Pattern fill](figures/svgpattern.png)\n\
    \nFigure 17.8. Pattern fill\n\n# Chapter 18: Canvas & SVG: Using SVG\n\nIn modern\
    \ browsers, SVG can be used anywhere where you would normally use JPGs, GIFs or\
    \ PNGs. Add to this the ability to add colors and gradients, plus the fact that\
    \ you get no loss of quality when scaled, and it's something to get excited about\
    \ for the majority of designers.\n\n## Inserting SVG Images on Your Pages\n\n\
    There are several ways to add SVG to your page:\n\n* The `object` tag\n* The `embed`\
    \ tag\n* Within an `iFrame`\n* Using a CSS background\n* Inline SVG embedded into\
    \ your HTML5 page\n* Using an `img` tag\n\n### Important: Use CSS for Repeating\
    \ Backgrounds\n\nOnly CSS can be used for repeating backgrounds. The other methods\
    \ will just show a single image.\n\n### Which Method Should You Use?\n\nThat will\
    \ depend on the project at hand but, generally, `object` or `embed` should be\
    \ used if you intend to use DOM scripting to manipulate the image in JavaScript.\
    \ An `iframe` can be used for the same purpose although the code becomes a little\
    \ more cumbersome. Alternatively, an inline SVG may be appropriate if you need\
    \ scripting but the image is used on a single page on your website.\n\nIf you\
    \ just need a static SVG, use the `img` tag or a CSS background. These do not\
    \ permit the SVG to be modified on the client.\n\n### Important: SVG MIME type\n\
    \nYour web server should return SVG images with the MIME type `image/svg+xml`.\
    \ Most servers should do this automatically, but double-check if images do not\
    \ display correctly.\n\nLet's have a look at how you'd go about it using the `object`\
    \ method using an SVG file we created using an application such as Illustrator\
    \ or Inkscape:\n\n```xml\n<object type=\"image/svg+xml\" \nwidth=\"400\" height=\"\
    400\" data=\"image.svg\">\n</object>\n```\n\nAn `embed` tag is similar, but `embed`\
    \ only became standard in HTML5. It's possible some older browsers could ignore\
    \ it, but most implement the tag:\n\n```xml\n<embed type=\"image/svg+xml\" \n\
    width=\"400\" height=\"400\" src=\"image.svg\">\n</embed>\n```\n\nAn `iframe`\
    \ loads the SVG much like any other web page:\n\n```xml\n<iframe src=\"image.svg\"\
    >\n</iframe>\n```\n\nWe've already used inline SVG images added directly to the\
    \ HTML page. This does not incur additional HTTP requests but will only be practical\
    \ for very small images or those you don't intend using elsewhere:\n\n```xml\n\
    <svg width=\"200\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <circle\
    \ id=\"redcircle\" cx=\"100\" cy=\"100\" r=\"100\" fill=\"red\" />\n</svg>\n```\n\
    \nAn `img` tag is identical to any you've used before:\n\n```xml\n<img src=\"\
    image.svg\" />\n```\n\nFinally, the CSS `background-image` property can reference\
    \ an SVG:\n\n```css\n#myelement {\n  background-image: url(image.svg);\n}\n```\n\
    \n### SVG Tools and Libraries\n\nThere are many libraries, snippets and useful\
    \ tools for creating and manipulating SVG images.\n\n[Snap SVG](http://snapsvg.io/)\
    \ from Adobe is a free, open-source tool for generating interactive SVG.\n\nAnother\
    \ great resource, [Bonsai](http://bonsaijs.org/), provides a JavaScript library\
    \ with snippets and demonstrations to help you alter SVG images using client-side\
    \ code.\n\n# Chapter 19: Canvas & SVG: SVG Bézier Curves\n\nBézier curves are\
    \ used extensively in graphics software and are sometimes described as a `polynomial`\
    \ expression](http://en.wikipedia.org/wiki/Polynomial), which is basically used\
    \ to describe a curve. Sometimes, Bézier curves are referred to simply as curves,\
    \ which can be slightly confusing if you're not familiar with all of the common\
    \ (or less common) terms when it comes to design.\n\nA Bézier curve is constructed\
    \ by control points, as shown in [Figure 19.1](#ch19.html_bezier \"Figure 19.1.\
    \ A quadratic Bézier curve\"). A quadratic Bézier curve has one control point,\
    \ whilst a cubic has two.\n\n## Quadratic Bézier Curves\n\n![A quadratic Bézier\
    \ curve](figures/Bezier.png)\n\nFigure 19.1. A quadratic Bézier curve\n\nNow let's\
    \ look at creating this whole image in SVG. Save the following code using your\
    \ text editor and then open it up in your browser and you should see an **A**\
    \ shape with a curved line reaching to the line that crosses the shape:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<svg width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    \ version=\"1.1\">\n\n  <!-- lines -->\n  <path id=\"lineAB\" d=\"M 100 350 l\
    \ 150 -30\" stroke=\"gold\" stroke-width=\"10\"/>\n  <path id=\"lineBC\" d=\"\
    M 250 50 l 150 300\" stroke=\"gold\" stroke-width=\"10\"/>\n  <path id=\"lineDE\"\
    \ d=\"M 175 200 l 150 0\" stroke=\"purple\" stroke-width=\"10\"/>\n\n  <!-- quadratic\
    \ curve -->\n  <path d=\"M 100 350 q 150 -300 300 0\" stroke=\"black\"\nstroke-width=\"\
    6\" fill=\"none\" />\n\n  <!-- mark points with a red dot -->\n  <g stroke=\"\
    red\" stroke-width=\"5\" fill=\"red\">\n    <circle id=\"pointA\" cx=\"100\" cy=\"\
    350\" r=\"3\" />\n    <circle id=\"pointB\" cx=\"250\" cy=\"50\" r=\"3\" />\n\
    \    <circle id=\"pointC\" cx=\"400\" cy=\"350\" r=\"3\" />\n  </g>\n\n  <!--\
    \ Add labels to each point -->\n  <g font-size=\"25\" font-family=\"sans-serif\"\
    \ fill=\"black\" stroke=\"none\"\ntext-anchor=\"middle\">\n    <text x=\"100\"\
    \ y=\"350\" dx=\"-30\">A</text>\n    <text x=\"250\" y=\"50\" dy=\"-10\">B</text>\n\
    \    <text x=\"400\" y=\"350\" dx=\"30\">C</text>\n  </g>\n\n</svg>\n</body>\n\
    </html>\n```\n\nThe quadratic Bézier curve is defined by the `path` tag:\n\n```xml\n\
    <path d=\"M 100 350 q 150 -300 300 0\" stroke=\"black\"\nstroke-width=\"6\" fill=\"\
    none\" />\n```\n\nThe `d` attribute instructs the parser to move to coordinate\
    \ (100,350). The `q` defines two further coordinates which are relative to (100,350).\
    \ The first is the control point (150,-300)—which equates to the absolute position\
    \ (450,50). The second is the ending point of the curve at (300,0)—which equates\
    \ to the absolute position (400,350).\n\nAlternatively, we could have used an\
    \ uppercase `Q` to use absolute, rather than relative, coordinate references.\n\
    \n## Cubic Bézier Curves\n\nWhile quadratic Bézier curves have one control point,\
    \ cubic Bézier curves have two. This allows more complex shapes which can reverse\
    \ direction or wrap back on themselves.\n\nThe following code provides three cubic\
    \ Bézier examples:\n"
