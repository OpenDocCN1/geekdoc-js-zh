    In these examples, we are using relative URLs. We can also cache assets across
    origins but the details are a little bit more complicated. In recent versions
    of Firefox, you can cache assets across origins when they share the same scheme
    or protocol (`HTTP` or `HTTPS`). You can, for example, cache assets from `http://sitepoint.com`
    on `http://example.com`. And you can cache assets from `https://secure.ourcontentdeliverynetwork.com`
    on `https://thisisasecureurl.com`. In these cases, the protocol is the same. What
    you can’t do is cache HTTPS URLs over HTTP or vice-versa. Current versions of
    IE, Safari, Chrome, and Opera allow cross-origin caching regardless of scheme.
    Caching assets from `http://sitepoint.com` on `https://thisisasecureurl.com` will
    work. This behavior could change, however, since it is out of line with the specification.
    Don’t depend on it. As of this writing, however, Chrome Canary ― version 33 ―
    doesn’t allow cross-origin requests from HTTP to HTTPS and vice versa.


    ### Forcing Network Retrieval with `NETWORK:`


    `NETWORK:` allows us to explicitly tell the browser that it should always retrieve
    particular URLs from the server. You may, for example, want a URL that syncs data
    to be a `NETWORK` resource. Let’s update our manifest from earlier to include
    a `NETWORK` section:


    ```

    CACHE MANIFEST


    # These files will be saved locally. This line is a comment.

    js/todolist.js

    css/style.css


    NETWORK:

    sync.cgi

    ```


    Any requests for `sync.cgi` will be made to the network. If the user is offline,
    the request will fail.


    You may also use a wildcard—or `*` character—in the network section. This tells
    the browser to use the network to fetch any resource that hasn’t been explicitly
    outlined in the `CACHE:` section. Partial paths also work with the wildcard.


    ### Specifying Alternative Content for Unavailable URLs


    Using the `FALLBACK:` section header lets you specify what content should be shown
    should the URL not be available due to connectivity. Let’s update our manifest
    to include a fallback section:


    ```

    CACHE MANIFEST


    # These files will be saved locally. This line is a comment.

    CACHE:

    js/todolist.js

    css/style.css


    FALLBACK:

    status.html offline.html

    ```


    Every line in the fallback section must adhere to the `<requested file name> <alternate
    file name>` pattern. Here, should the user request the `status.html` page while
    offline, he or she will instead see the content in `offline.html`.


    ### Specifying Settings


    To date, there’s only one setting that you can set using the `SETTINGS:` section
    header, and that’s the cache mode flag. Cache mode has two options: fast and `prefer-online`.
    The fast setting *always* uses local copies, while `prefer-online` fetches resources
    using the network if it’s available.


    Fast mode is the default. You don’t actually need to set it in the manifest. Doing
    so won’t cause any parsing errors, but there’s no reason to add it.


    To override this behavior, you *must* use `prefer-online`, and add this to the
    end of your manifest file:


    ```

    SETTINGS:

    prefer-online


    NETWORK:

    *

    ```


    There’s a caveat here, however. The master file―the file that *owns* the manifest―will
    still be retrieved from the local store. Other assets will be fetched from the
    network.


    ### Adding the Cache Manifest to Your HTML


    Now for the simplest part of AppCache: adding it to your HTML document. This requires
    adding a `manifest` attribute to your `<html>` tag:


    ```

    <html manifest="todolist.appcache">

    ```


    As your page loads, the browser will download and parse this manifest. If the
    manifest is valid, the browser will also download your assets.


    You’ll need to add the manifest to every HTML page that you wish to make available
    offline. Adding it to `http://example.com/index.html` will not make `http://example.com/article.html`
    work offline.


    ### Note: Verify Your Manifest Syntax


    To avoid problems with your manifest file, verify that its syntax is correct by
    using a validator, such as [Cache Manifest Validator](http://manifest-validator.com/).
    If you’re comfortable with Python and the command line, try [Caveman.](https://pypi.python.org/pypi/caveman).


    ### Serving the Cache Manifest


    In order for the browser to recognize and treat your cache manifest as a manifest,
    it must be served with a `Content-type: text/cache-manifest` header. Best practice
    is to use an `.appcache` extension (e.g. manifest.appcache` or `offline.appcache`),
    though it’s not strictly necessary. Without this header, most browsers will ignore
    the manifest. Consult the documentation for your server (or ask your web hosting
    support team) to learn how to set it.


    ### Avoiding Application Cache “Gotchas”


    As mentioned, AppCache uses local file copies by default. This produces a more
    responsive user interface, but it also creates two problems that are *very* confusing
    at first glance:


    * uncached assets do not load on a cached page, even while online

    * updating assets will not update the cache


    That’s right: browsers will use locally stored files regardless of whether new
    file versions are available, even when the user is connected to the network.


    ### Solving Gotcha #1: Loading Uncached Assets from a Cached Document


    Application Cache is designed to make web applications into self-contained entities.
    As a result, it unintelligently assumes all referenced assets have also been cached
    unless we’ve said otherwise in our cache manifest. Browsers will look in the cache
    first, and if they’re unable to find the referenced assets, those references break.


    To work around this, include a `NETWORK:` section header in your manifest file,
    and use a wildcard (`*`). A wildcard tells the browser to download any associated
    uncached file from the network if it’s available.


    ### Solving Gotcha #2: Updating the Cache


    Unfortunately, if you need to push updates to your users, you can’t just overwrite
    existing files on the server. Remember that AppCache always prefers local copies.


    In order to refresh files within the cache, you’ll need to update the cache manifest
    file. As a document loads, the browser checks whether the manifest has been updated.
    If it has, the browser will then re-download all the assets outlined in the manifest.


    Perhaps the best way to update the manifest is to set and use version numbers.
    Changing an asset name or adding a comment also works. When the browser encounters
    the modified manifest, it will download the specified assets.


    Though the cache will update, the new files will only be used when the application
    is reloaded. You can force the application to refresh itself by using `location.reload()`
    inside an `updateready` event handler.


    ### Cache Gotcha #3: Break One File, Break Them All


    Something else to be aware of when using AppCache: any resource failure will cause
    the entire caching process to fail. “404 Not Found,” “403 Forbidden,” and “500
    Internal Server Error” responses can cause resource failures, as well as the server
    connection being interrupted during the caching process.


    When the browser encounters any of these errors, the `applicationCache` object
    will fire an `error` event and stop downloading everything. We can listen for
    this event, of course; however, to date no browser includes the affected URL as
    part of the error message. The best we can do is alert the user that an error
    has occurred.


    Safari, Opera, and Chrome *do* report the failed URL in the developer console.


    ### Testing for Application Cache Support


    To test for support, use the following code:


    ```

    var hasAppCache = window.applicationCache === undefined;

    ```


    If you’re going to use several HTML5 features, you may also want to try [Modernizr](http://modernizr.com/)
    to check for them all.


    It’s unnecessary to test for AppCache support using JavaScript, unless your application
    interacts with the cache programmatically. In browsers without support for Application
    Cache, the manifest attribute will be ignored.

