  trans: "\n\n当用户提交表单时，如果 `your_name` 字段为空，Chrome、Opera 和 Internet Explorer 10+ 将阻止提交并提醒用户，如图图\
    \ 4.1 所示。不需要 DOM 脚本。\n\n![Chrome 中的表单提交错误消息](img/requiredfielderrormessagechrome.png)\n\
    \n图 4.1. Chrome 中的表单提交错误消息\n\n注意，我没有提到 Safari。无论好坏，Safari 6.0.5 及更早版本不提供原生的用户界面反馈。它确实支持\
    \ HTML5 验证，但我们仍然需要使用 DOM 脚本和 CSS 来提醒用户表单提交情况。我们将在 Validation API 部分讨论实现此点的方法。\n\
    \n### 设置必填表单样式\n\n你可能想使用 CSS 在视觉上指示哪些字段是必填的，哪些不是。我们可以使用两个 CSS 选择器来定位必填字段。\n\n\
    1. 使用属性选择器 `[required]`。\n2. 使用 `:required` 伪类。\n\n`:required` 伪类是一个 [CSS 选择器，级别\
    \ 4](http://www.w3.org/TR/selectors4/) 选择器，但主流浏览器的最新版本都支持它。CSS 4 选择器还增加了 `:optional`\
    \ 伪类，我们可以用它来定位非必填的输入字段。\n\n针对不支持 CSS4 选择器的旧浏览器，请使用属性选择器。例如，如果我们想为必填字段添加 1 像素的红色边框，可以在\
    \ CSS 中添加以下内容。\n\n```css\ninput[required], input:required\n{\n  border: 1px solid\
    \ #c00;\n}\n```\n\n### 收集电子邮件地址、电话号码和 URL\n\n我们希望让线人知道我们已经收到了他们的输入。这意味着我们的表单需要电子邮件地址和电话号码字段。我们还想收集可以获取更多关于该线索信息的\
    \ URL，因此我们的表单还需要一个 URL 字段。\n\n在之前的 HTML 版本中，我们会使用文本字段处理所有这些内容并用 JavaScript 验证数据。然而，HTML5\
    \ 为此定义了三个新的输入类型：`email`、`tel` 和 `url`。\n\n让我们为表单添加一个电子邮件字段。我们还将其设置为必填。\n\n```html\n\
    <p>\n  <label for=\"email\">E-mail address</label>\n  <input type=\"email\" name=\"\
    email\" id=\"email\" required>\n</p>\n```\n\n使用 `email` 类型会让浏览器检查该字段是否为有效的电子邮件地址。当然，它无法判断该地址是否可以接收邮件。但它会检查该字段的输入在语法上是否有效。如果用户输入了无效地址，大多数浏览器会在用户提交表单时提醒用户。\n\
    \n你可能还想让用户提供多个电子邮件地址。在这种情况下，请使用 `multiple` 属性。用户随后可以输入一个或多个电子邮件地址，每个地址之间用逗号分隔。\n\
    \n每当你允许一个输入字段有多个值时，通过标签或说明性文本指示这是允许的是一个好主意。\n\n### 注意：关于验证\n\n尽管原生数据验证是 HTML5\
    \ 的一部分，你仍然应该使用服务器端验证，并对任何源自用户的输出进行转义。并不是所有浏览器都支持 HTML5，并不是所有发送到脚本的输入都来自你的表单。\n\
    \n电话号码则是另一。电子邮件地址遵循标准格式，但电话号码并非如此。在英国，电话号码可能长达 11 位。在美国，它们不超过 10 位。有些国家的电话号码包含\
    \ 13 位。电话号码的格式也随国家而异。不一致的长度和格式使得原生电话号码验证变得困难。因此，规范没有定义执行此操作的算法。\n\n让我们为表单添加一个电话字段。为了实现这一点，我们需要添加一个输入字段并将其\
    \ `type` 属性的值设置为 `tel`。我们不会将其设置为必填。\n\n```html\n<p>\n  <label for=\"telephone\"\
    >Telephone number:</label>\n  <input type=\"tel\" name=\"telephone\" id=\"telephone\"\
    >\n</p>\n```\n\n使用 `tel` 代替 `text` 的巨大优势是在支持支持的浏览器中触发电话输入界面。\n\n![Firefox Mobile\
    \ 中的 tel 输入类型](img/inputtypetelinfirefoxmobile.png)\n\n图 4.2. Firefox Mobile 中的\
    \ tel 输入类型\n\n虽然 `tel` 没有为我们提供自动验证，但我们可以使用两个属性来规范用户输入：\n\n- `placeholder`，为用户提供关于该字段期望格式的“提示”。\n\
    - `pattern`，设置一个正则表达式模式，浏览器可以使用该模式来验证输入。\n\n我们想象的报社总部在美国，并拥有美国的受众。我们将在属性值中反映这一点。\n\
    \n```html\n<p>\n  <label for=\"telephone\">Telephone number:</label>\n  <input\
    \ type=\"tel\" name=\"telephone\" id=\"telephone\"\n  placeholder=\"(000) 000-0000\"\
    \n  pattern=\"\\([2-9][0-9]{2}\\) [0-9]{3}-[0-9]{4}\">\n</p>\n```\n\n对于 `placeholder`\
    \ 属性，我们刚刚添加了反映该电话号码期望格式的文本。\n\n### 注意：占位符文本\n\n占位符文本（Placeholder text）并不是 `label`\
    \ 元素的替代品。即使使用了 `placeholder` 属性，也要为每个输入字段提供一个标签。\n\n对于 `pattern`，我们使用了正则表达式。该属性提供了输入在提交表单之前匹配的格式或模式。几乎任何有效的\
    \ JavaScript 正则表达式都可以用于 `pattern` 属性。与 JavaScript 不同，你无法设置全局或忽略大小写的标志。要允许同时大写和小写字母，你的模式必须使用\
    \ `[a-zA-Z]`。`pattern` 属性本身可以用于 `text`、`search`、`email`、`url` 和 `telephone` 输入类型。\n\
    \n### 注意：正则表达式\n\n正则表达式是一个大且复杂的话题，因此超出了本书的范围。更完整的参考，请参阅 [WebPlatform.org 的文档](http://docs.webplatform.org/wiki/concepts/programming/javascript/regex)。\n\
    \n`url` 输入类型的工作方式与 `email` 基本相同。它根据接受 URL 模式对用户输入进行验证。允许协议前缀如 `ftp://` 和 `gopher://`。在这种情况下，我们希望限制用户输入为使用\
    \ `http://` 和 `https://` 协议的。因此我们在这里也添加一个 `pattern` 属性。\n\n```html\n<p>\n  <label\
    \ for=\"url\">\n    请提供我们可以了解更多信息的网站（如果\n  适用）：\n  </label>\n  <input type=\"\
    url\" name=\"current_site\" id=\"current_site\"\n  placeholder=\"http://www.example.com/\"\
    \n  pattern=\"http(|s)://[-0-9a-z]{1,253}\\.[.a-z]{2,7}\">\n</p>\n```\n\n我们还添加了占位符文本，作为对用户的提示，说明我们希望他们告诉什么。总之，你的表单应该如下所示：\n\
    \n"
- fmt: "\n```\n<form action=\"./script\" method=\"POST\">\n  <p>\n    <label for=\"\
    your_name\">Your name:</label>\n    <input type=\"text\" name=\"your_name\" id=\"\
    your_name\">\n  </p>\n\n  <p>\n    <label for=\"city\">City of residence:</label>\n\
    \    <input type=\"text\" name=\"city\" id=\"city\">\n  </p>\n\n  <p>\n    <label\
    \ for=\"email\">\n      E-mail address \n      (separate multiple e-mail addresses\
    \ with a comma):\n    </label>\n    <input type=\"email\" name=\"email\" id=\"\
    email\"\n    placeholder=\"jane.doe@example.com\" multiple >\n  </p>\n\n  <p>\n\
    \    <label for=\"tel\">Telephone number:</label>\n    <input type=\"tel\" name=\"\
    phone_number\" if=\"phone_number\"\n    placeholder=\"(000) 000-0000\"\n    pattern=\"\
    \\([2-9][0-9]{2}\\) [0-9]{3}-[0-9]{4}\">\n  </p>\n\n  <p>\n    <label for=\"url\"\
    >\n      Please provide a web site where we can learn more (if \n    applicable):\n\
    \    </label>\n    <input type=\"url\" name=\"current_site\" id=\"current_site\"\
    \n    placeholder=\"http://www.example.com/\"\n    pattern=\"http(|s)://[-0-9a-z]{1,253}\\\
    .[.a-z]{2,7}\">\n  </p>\n\n  <p>\n    <label for=\"project\">Tell us your story\
    \ idea:</label>\n    <textarea name=\"story_idea\" id=\"story_idea\"\n    placeholder=\"\
    Briefly tell us what we should write about and \n    why.\"\n    maxlength=\"\
    2000\"></textarea>\n  </p>\n\n  <p>\n    <button type=\"submit\">Send it!</button>\n\
    \  </p>\n</form>\n```\n\n# Uploading Files\n\nThe `file` input type is not new\
    \ to HTML. We’ve been able to upload files since HTML 3.2. What is new, however,\
    \ is the `multiple` attribute, which lets us upload multiple files using one form\
    \ field. In this section, we’ll build a form that lets users upload audio files.\n\
    \nFirst we’ll need to create a start tag for the `form` element.\n\n```\n<form\
    \ action=\"/script\" method=\"post\" enctype=\"multipart/form-data\">\n```\n\n\
    As with our previous form, our start tag has `action` and `method` attributes.\
    \ But note that the value of its `enctype` attribute is `multipart/form-data`.\
    \ Again, when uploading binary data, we must use the `multipart/form-data` encoding\
    \ type.\n\nNext, we need to add an `input` tag, and set the value of its `type`\
    \ attribute to `file`. We’ll name it `upload`, but you can choose almost any name\
    \ you like. To permit multiple file uploads, we’ll need to add the `multiple`\
    \ attribute.\n\n```\n<input type=\"file\" name=\"upload\" id=\"upload\" multiple>\n\
    ```\n\n## Note: PHP Form Keys\n\nPHP requires form keys with multiple values to\
    \ use square bracket array syntax. If you’re using PHP to handle your forms, append\
    \ square brackets to the name (for example: `name=\"upload\"` would become `name=\"\
    upload[]\"`).\n\nWe can also restrict what files can be uploaded in the browser\
    \ with the `accept` attribute. The value of `accept` may be any of the following:\n\
    \n* `audio/*`, `video/*`, `image/*`\n* a valid MIME type such as `image/png` or\
    \ `text/plain`\n* a file extension that begins with `.`\n\nYou may include multiple\
    \ `accept` values; separate them with a comma. Let’s update our form field to\
    \ accept only MP3 and Ogg Vorbis files.\n\n```\n<input type=\"file\" multiple\
    \ name=\"upload\" id=\"upload\"\naccept=\".mp3,.ogv\">\n```\n\nWe’ll finish up\
    \ our form with a submit button and closing form tag:\n\n```\n<form action=\"\
    /script\" method=\"post\" enctype=\"multipart/form-data\">\n  <p>\n    <label\
    \ for=\"upload\">Your file(s):</label>\n    <input type=\"file\" multiple name=\"\
    upload\" id=\"upload\"\n    accept=\".mp3,.ogv\">\n  </p>\n  <p>\n    <button\
    \ type=\"submit\">Upload!</button>\n  </p>\n</form>\n```\n\nWhen submitted, our\
    \ server-side script will save those files, and return a \"thank you\" message.\n\
    \n## Warning: Take Appropriate Precautions\n\nYou can’t rely on browser-based\
    \ validation or restrictions. Take appropriate precautions, and make sure that\
    \ your file uploads are being placed in a directory that is not web-accessible.\n\
    \n# The `datalist` Element\n\nWith the `datalist` element, we can add a predefined\
    \ set of options to any form input control. Let’s take a look at how we go about\
    \ this. First, we’ll create a `datalist` of destination options for a fictitious\
    \ airline:\n\n```\n<datalist id=\"where_we_fly\">\n  <option>Accra, Ghana</option>\n\
    \  <option>Paris, France</option>\n  <option>Melbourne, Australia</option>\n \
    \ <option>Lima, Peru</option>\n  <option>Los Angeles, United Sates</option>\n\
    \  <option>Kuala Lumpur, Malaysia</option>\n</datalist>\n```\n\nNow we can associate\
    \ it with an `input` field using the `list` attribute.\n\n```\n<p>\n  <label for=\"\
    destination\">Where would you like to go?</label>\n  <input type=\"text\" name=\"\
    destination\" id=\"destination\" value=\"\"\n  list=\"where_we_fly\">\n</p>\n\
    ```\n\nIn browsers that support the `datalist` element, the code above will associate\
    \ a predefined list of options with the `input` element. When the user enters\
    \ text, matching entries are displayed in the list below the field as shown in\
    \ [Figure 4.3](#ch04.html_datalist \"Figure 4.3. datalist in IE\").\n\n![datalist\
    \ in IE](figures/datalistinie.png)\n\nFigure 4.3. datalist in IE\n\nIn browsers\
    \ without support for `datalist`, the text input field will behave normally. Although\
    \ data lists may, in theory, be associated with other input types, not all browsers\
    \ support this.\n\n### Other Input Types\n\nWe’ve already discussed several types\
    \ in this chapter, but there are a few more we’ll cover in this section.\n\n*\
    \ `search`\n* `range`\n* `number`\n* `color`\n* `datetime`\n* `datetime-local`\n\
    * `date`\n* `month`\n* `week`\n* `time`\n\nAside from `range`, it’s possible to\
    \ determine whether a browser supports a type by testing the `type` attribute.\
    \ If a browser doesn’t support `range`, the type attribute will default to `text`.\
    \ For example, consider the following range input:\n\n```\n<input type=\"range\"\
    \ value=\"\" id=\"slider\">\n```\n\nWe could test for browser support using the\
    \ following JavaScript code:\n\n```javascript\nvar hasRange = function( elID ){\n\
    \  return document.getElementById( elID ).type == 'range';\n}\n```\n\nIn browsers\
    \ that do not support `range`, the function above will return `false`. Otherwise,\
    \ it will return `true`. Libraries such as [Modernizr](http://modernizr.com/)\
    \ make it easier to check.\n\n#### input=\"search\"\n\nFor the most part, `search`\
    \ operates like the `text` input type. It merely provides a type that can be visually\
    \ distinct from `text` boxes. For example, in Safari, Chrome, and Opera 15 on\
    \ Mac OS, search input fields have rounded corners.\n\n![The Search input type\
    \ in Safari](figures/searchtypesafari.png)\n\nFigure 4.4. Search input type in\
    \ Safari\n\n#### input=\"range\"\n\nThe `range` input type presents the user with\
    \ a slider control that’s well suited to approximate value inputs between an upper\
    \ and lower boundary. By default, it’s a horizontal control, as shown in [Figure\
    \ 4.5](#ch04.html_range \"Figure 4.5. The range input type\"). However with some\
    \ CSS (`transform: rotate(-90deg)`), you can also display range inputs vertically.\n\
    \n![The range input type](figures/inputtyperangefirefox.png)\n\nFigure 4.5. range\
    \ input type\n\nBy default, the upper and lower boundaries of the range type are\
    \ 0 and 100. Change this by setting the `min` and `max` attributes. You can also\
    \ control the 'smoothness' and precision of the thumb position using the `step`\
    \ attribute as shown below.\n\n```\n<input type=\"range\" value=\"\" min=\"0\"\
    \ max=\"100\" step=\"10\">\n```\n\nEvery time the user moves the thumb on this\
    \ range input control, the value of the range will increase or decrease by 10\
    \ between 0 and 100. You can also control precision by associating a `datalist`\
    \ element with the `range` input. Each option will be rendered as a 'notch' along\
    \ the width of the range in browsers that support it—to date, that’s Chrome and\
    \ Opera 15.\n\nUnfortunately, range isn’t supported in Internet Explorer 9 and\
    \ older, or Firefox 22 and older. In those browsers, the form control will be\
    \ a text box instead of a range element.\n"
