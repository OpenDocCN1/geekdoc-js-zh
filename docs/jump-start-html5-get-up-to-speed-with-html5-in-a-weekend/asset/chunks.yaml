  trans: "\n\n每个时间范围后面都跟着组成提示（cue）的文本。最简单的提示是纯文本，且提示可以跨多行，如下所示（对话源自电影《Sita Sings the\
    \ Blues》，sitasingstheblues.com）。\n\n```\nWEBVTT\n\n0:06:57.200 --> 0:07:01.000\
    \ \n[Music]\n\n0:07:02.500 --> 0:07:08.000 \nWhen? I don't remember what year.\
    \ There's no year. \nHow do you know there's a year for that?\n\n0:07:08.500 -->\
    \ 0:07:10.000 \nI think they say the 14th century.\n\n0:07:11.500 --> 0:07:13.000\
    \ \nThe 14th century was recently. \nI know but ... \n\n0:07:13.500 --> 0:07:16.500\
    \ \nThat's when the Moguls were ruling in India\nThe 11th then\n\n0:07:17.500\
    \ --> 0:07:22.000 \nIt's definitely B.C. It's B.C. for sure.\nAnd I think it's\
    \ Ayodhya.\n```\n\n注意每个提示之间的空行？它们是必须的。浏览器以此来判断一个提示结束和另一个提示开始的位置。\n\n### WebVTT\
    \ 提示跨度标签\n\nWebVTT 支持一组类似于 HTML5 的标签，称为 `cue spans`（提示跨度），它们为字幕和说明提供了简单的格式设置。\n\
    \n* `c` 或提示类跨度 (cue class span)\n* `i` 或斜体跨度 (italics span)\n* `b` 或粗体跨度 (bold\
    \ span)\n* `u` 或下划线跨度 (underline span)\n* `ruby` 和 `rt` 或注音跨度 (ruby and ruby text\
    \ spans)\n* `v` 或语音提示跨度 (voice cue span)\n* `lang` 或语言提示标签 (language cue tag)\n\
    \n就像 HTML 标签一样，每个提示跨度的起始标签以 `<` 开头并以 `>` 结尾。结束标签以 `</` 开头并以 `>` 结尾。让我们取上面的对话添加一些语音提示跨度标签。\n\
    \n```\nWEBVTT\n\n0:06:57.200 --> 0:07:01.000 \n<i.music>[Music]</i>\n\n0:07:02.500\
    \ --> 0:07:08.000 \n<v Man1>When? I don't remember what year. There's no year.\
    \ \nHow do you know there's a year for that?</v>\n\n0:07:08.500 --> 0:07:10.000\
    \ \n<v Woman>I think they say the 14th century.</v>\n\n0:07:11.500 --> 0:07:13.000\
    \ \n<v Man1>The 14th century was recently</v>\n<v Woman>I know but ...</v>\n\n\
    0:07:13.500 --> 0:07:16.500 \n<v Man1>-That's when the Moguls were ruling in India</v>\n\
    <v Woman>- The 11th then</v>\n\n0:07:17.500 --> 0:07:22.000 \n<v Man2>It's definitely\
    \ B.C. It's B.C. for sure.    \nAnd I think it's Ayodhya.</v>\n```\n\n在这里，每个角色都由\
    \ `<v>` 标签表示。每个角色的名字（这里是 Man1、Woman 和 Man2）也是标签的一部分。这是某种属性。我们还为第一个提示中添加了斜体提示跨度。\n\
    \n### 提示：验证你的 WebVTT\n\n编写不当的 WebVTT 会导致字幕无法工作。请使用 Anne Van Kesteren 的 [Live WebVTT\
    \ Validator](http://quuz.org/webvtt/) 验证你的 WebVTT 语法。\n\n语音提示跨度标签本身不会改变每个字幕的外观。但它们确实添加了语义数据，并成为\
    \ CSS 的钩子，我们将在下一节中看到。\n\n### 使用 `::cue` 伪元素为字幕和说明设置样式\n\n![Internet Explorer 11\
    \ 中未样化的字幕。来自 Nina Paley 的电影《Sita Sings the Blues》截图 (sitasingstheblues.com)](img/track-captions-unstyled-ie.png)\n\
    \n图 10.7. Internet Explorer 11 中未样化的字幕。来自 Nina Paley 的电影《Sita Sings the Blues》截图\
    \ (sitasingstheblues.com)\n\n字幕和说明在大多数浏览器中以白色无衬线字体文本显示。Internet Explorer ([图 10.7\"\
    ))）了文本阴影以提高可读性。Chrome、Safari 和 Opera 使用黑色背景。它们始终位于视频底部，并在屏幕上居中。\n\n尽管 WebVTT 提供了字幕对齐和放置的语法，但浏览器厂商尚未实现它。目前，我们对原生字幕的外观及其在屏幕上的放置位置控制有限。\n\
    \n然而，我们可以使用 CSS 和 `::cue` 伪元素来调整字幕和说明的外观（目前仅在 Chrome、Safari 7 和 Opera 16+ 中支持）。\n\
    \n并不是所有的 CSS 属性都能用于 WebVTT 字幕和说明。只支持部分属性，主要与文本和颜色相关。\n\n* `color`\n* `opacity`\n\
    * `visibility`\n* `text-decoration`\n* `text-outline`\n* `text-shadow`\n* `background`\
    \ 属性（如 `background-color`）\n* `outline` 属性（如 `outline-color`）\n* `font` 属性（如 `font-family`），但还有\
    \ `line-height` 和 `white-space`\n\n#### 重要：谨慎更改字幕颜色！\n\n请使用 [对比度比例计算器](http://leaverou.github.io/contrast-ratio/)\
    \ 确保你的颜色选择具有足够的对比度。\n\n让我们来看一个设置 `::cue` 伪元素的示例。在这里 `::cue` 是我们的选择器，我们正在使用 `font`\
    \ 简写属性使我们的字幕文本加粗。\n\n```\n::cue {\n    font: bold 18px / 1.5 sans-serif;\n}\n\
    ```\n\n你可以在 图 10.8 中看到效果。\n\n![为字幕文本应用加粗字体样式。图片来自《Sita Sings the Blues》sitasingstheblues.com](img/track-vtt-with-white-text.png)\n\
    \n图 10.8. 为字幕文本应用加粗字体样式。图片来自《Sita Sings the Blues》sitasingstheblues.com\n\n然而，这并不是我们能做的全部。`::cue`\
    \ 伪元素也像函数一样，接受单个参数。此参数必须是一个或多个 CSS 选择器，例如类名或元素。回想我们在上面对话片段中使用的标记。\n\n```\nWEBVTT\n\
    \n0:07:11.500 --> 0:07:13.000 \n<v Man1>The 14th century was recently</v>\n<v\
    \ Woman>I know but ...</v>\n```\n\n"
- fmt: "\nEvery HTML element has a DOM scripting interface. An interface is a group\
    \ of attributes, constants, events, and methods that are available to a scripting\
    \ language. Some elements, like `p` have simple interfaces. Not many properties\
    \ apply to the `p` element. Others like `audio` and `video` have a robust interface\
    \ that allow us to interact with and control every state of the element.\n\nAs\
    \ we saw in earlier chapters, `audio` and `video` have a lot of attributes in\
    \ common. This is also true for their scripting interfaces. In this chapter, we'll\
    \ focus on creating a video player. However, most of what we'll discuss also holds\
    \ true for audio. Differences and exceptions are noted.\n\n## Event-Driven DOM\
    \ Scripting: An Introduction\n\nTo create our player, we'll need use a technique\
    \ known as *event-driven programming*. The `audio` and `video` elements fire events\
    \ during media loading and playback. We can use DOM scripting to *listen* for\
    \ these events, and take an action when one occurs. It's a bit like an actor listening\
    \ off-stage for his cue to walk on stage, but in code form.\n\nBoth elements fire\
    \ events for all sorts of things. For this player, however, we'll only talk about\
    \ three:\n\n*   `durationchange`: fired when the browser has downloaded enough\
    \ of the file to determine the duration of our media file\n*   `timeupdate`: fired\
    \ whenever the media position is updated\n*   `volumechange`: fired whenever the\
    \ volume changes\n\nThere are two ways that we can listen for an event: We can\
    \ use the element's event handler attributes or we can use the `addEventListener()`\
    \ DOM method. Event handler attributes are basically the event names, prefixed\
    \ with `on` — `ondurationchange`, `ontimeupdate`, and `onclick`, for example.\
    \ Most HTML5 events have these attributes, and it's perfectly acceptable to use\
    \ them, e.g.\n\n```\nobject.onclick = function_to_invoke;\n```\n\nWe're going\
    \ to use `addEventListener()` in this chapter, however. Using `addEventListener()`\
    \ gives us more flexibility. With event handler attributes, we can only invoke\
    \ one function per event. With `addEventListener()`, we can invoke several functions\
    \ at once. The basic syntax is as follows:\n\n```\nobject.addEventListener('event_name',\
    \ function_to_invoke);\n```\n\nWhen an event fires, an *event object* will be\
    \ passed to the listener or *callback function* as its argument. An event object\
    \ is a container for passing data. If we'd like to use that data within our callback\
    \ function, we need to make sure that our callback function has a defined parameter.\
    \ To build on the generic example above, our `function_to_invoke` would resemble\
    \ the sample below.\n\n```\nfunction function_to_invoke(event){\n    // function\
    \ body that acts on our event\n}\n```\n\nEach event object contains several properties,\
    \ and we can retrieve each property using dot syntax. The basic form is `eventobject.property`\
    \ where `eventobject` is the name of our function parameter. We'll be most concerned\
    \ with the `target` of the event object in this chapter, so we'll use `event.target`\
    \ in almost all of our functions. The `target` property is a reference to the\
    \ object on which the event was fired.\n\n`target` is also an object in its own\
    \ right. It contains properties such as `id` that are common to all HTML elements.\
    \ But it also contains properties that are specific to the object type: `duration`\
    \ for video objects, or `value` for form controls. It *is* a tough concept to\
    \ wrap your brain around at first, so it may take you a few read-throughs to grasp\
    \ fully.\n\n## Step 1: Creating Our Markup\n\nThere are two ways to create a media\
    \ player using DOM scripting: completely with JavaScript (and the `document.createElement()`\
    \ method) or by scripting markup. We're going to choose the latter. Let's build\
    \ our markup:\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"\
    utf-8\">\n    <title>\n    Scripting an audio and video player\n    </title> \
    \           \n    <link rel=\"stylesheet\" type=\"text/css\" href=\"video.css\"\
    >\n  </head>\n  <body        \n    <div id=\"video_wrapper\">\n      <video preload=\"\
    metadata\">\n         <source src=\"./video_file.mp4\" type=\"video/mp4\">\n \
    \        <source src=\"./video_file.webm\" type=\"video/webm\">\n      </video>\n\
    \      <div id=\"video_time\">\n        <progress value=\"0\" id=\"playback\"\
    ></progress>\n        <span id=\"elapsed\"></span> <span id=\"duration\"></span>\n\
    \      </div>\n      <div id=\"video_seek\"> \n        <label for=\"seek\">Seek</label>\n\
    \    <input type=\"range\" id=\"seek\" title=\"seek\" \n    min=\"0\" value=\"\
    0\" max=\"0\">\n      </div>\n      <div id=\"video_controls\">\n        <button\
    \ type=\"button\" id=\"play\">Play</button>\n        <button type=\"button\" id=\"\
    pause\" class=\"hidden\">\n          Pause\n        </button>\n        <label\
    \ for=\"volume\">Volume</label>\n        <input type=\"range\" id=\"volume\" title=\"\
    volume\" \n    min=\"0\" max=\"1\" step=\"0.1\" value=\"1\">                \n\
    \      </div>\n    </div>\n    <script type=\"text/javascript\" src=\"video.js\"\
    ></script> \n  </body>\n</html>\n```\n\nHere, we're using `range` input types\
    \ for our volume and seek controls.\n\n## Step 2: Retrieving Our Video Object\n\
    \nBefore we can do any more, we'll need to create a video object for our script\
    \ to act on. We'll use the `video` element from our markup, and retrieve it using\
    \ the `document.querySelector()` method. This method, part of the `Selectors API`,\
    \ will return the first object in the document that matches the selector—in this\
    \ case, the `video` element selector.\n\n```javascript\nvar video = document.querySelector('video');\n\
    ```\n\nIf your `video` element has an `id` attribute, you could also use the `document.getElementById()`\
    \ method, as shown below.\n\n```javascript\nvar video = document.getElementById('my_video');\n\
    ```\n\nEither of these will return an object of the type `HTMLVideoElement`. If\
    \ this was an `audio` element, our object would be an `HTMLAudioElement` object.\
    \ Both `HTMLVideoElement` and `HTMLAudioElement` interfaces with defined properties\
    \ that we can read and write using DOM scripting. Some properties, such as `controls`\
    \ have corresponding HTML attributes. Others like `volume` are only available\
    \ through the scripting interface.\n\n## Step 3: Playing and Pausing Video\n\n\
    Most of what you'll ever want to do with a player is, well, *play* a video file.\
    \ You may also want to pause it to take a phone call, or hide your goofing off\
    \ from your boss. The `HTMLVideoElement` object has two, self-explanatory methods\
    \ for these tasks: `play()` and `pause()`. Any time the `play()` method is called,\
    \ playback will begin or resume. When the `pause()` method is invoked, playback\
    \ will pause.\n"
