  trans: "\n\n这里的新之处是使用了 `-vf` 标志，它是一个表示我们想要使用过滤器的标志。后面紧跟着我们的过滤器名称（`scale`）以及我们期望的比例（宽:高）。虽然我们可以指定两个维度，但在这里我们使用了\
    \ `-1` 代替。这告诉 `FFmpeg` 我们希望在缩放时保持纵横比。与我们之前的示例一样，命令的最后部分是输出文件名和扩展名。\n\n### 使用 FFmpeg\
    \ 生成海报图片\n\nFFmpeg 不限于媒体转换。我们还可以用它来从视频文件中提取帧。当我们讨论如何为视频添加封面图时，这会非常有用。基本命令遵循以下模式：\n\
    \n```\nffmpeg -ss 30 -t 2 -i /path/to/input.file -r 1 \n/path/to/output-%02d.jpg\n\
    ```\n\n这个示例涉及比之前示例更多的命令行标志。让我们过一遍。\n\n`-ss` 标志指示 `FFmpeg` 跳转到指定的位置，以秒为单位。在这种情况下，我们将从视频的\
    \ 30 秒处开始导出帧。\n\n接下来是 `-t` 标志，代表持续时间，即我们想要提取多少秒的视频图像。在这种情况下，我们将捕捉两秒的帧。正如你现在可能猜到的，`-i`\
    \ 标志代表“input”（输入），我们用它指定源文件。\n\n`-r` 标志设置帧率，即视频导出时每秒的帧数。在这种情况下，它是每秒 1 帧。这意味着我们将从该视频中得到两张静态图，每个由\
    \ `-t` 标志指定的秒数对应一张。如果我们使用更高的帧率，例如每秒 24 帧，我们就会提取出 24 张图像。\n\n最后最后，我们需要告诉 `FFmpeg`\
    \ 将文件放在哪里。`%02d` 是一个占位符或某种类型的通配符。它告诉 `FFmpeg` 按顺序为我们的图像命名，并在必要时填充到 2 位数字。在这种情况下，我们的图像将被命名为\
    \ `output-01.jpg`、`output-02.jpg` 等。如果我们使用 `%03d`，我们的文件将会被命名为 `output-001.jpg`、`output-002.jpg`。\n\
    \n### 使用托管服务\n\nMiro Video Converter 和 `FFmpeg` 非常适合你想要自己托管的音频和视频。但也有一些服务提供托管和转码服务。[Archive.org](http://archive.org/details/movies)\
    \ 为在知识共享（Creative Commons）许可下或公共领域发布的音频和视频作品提供免费的托管和转码。[Vid.ly](http://m.vid.ly/)、[Viddler](https://www.viddler.com/)\
    \ 和 [Zencoder](http://zencoder.com/en/) 是三个付费选项，同时也提供可配置的播放器。详情价格各异。\n\n### 质量与文件大小\n\
    \n本章并不是全面介绍 Miro Video Converter、`FFmpeg` 或针对网络优化媒体。但它能帮助你入门。\n\n然而，你应该为你的音频和视频文件考虑比特率和每秒帧数（FPS）。这里没有硬性的准则。你选择什么值取决于你以及以及观众——对质量与文件大小、带宽消耗和下载时间的容忍度。\n\
    \n热门视频网站如 [YouTube](https://support.google.com/youtube/answer/1722171)、[Vimeo](http://vimeo.com/help/compression)\
    \ 和 [Dailymotion](http://www.dailymotion.com/upload/faq) 为压缩媒体提供了一些指导。使用 `FFmpeg`\
    \ 进行这些调整。最好的办法是从这些指南开始，并尝试不同的比特率，直到找到合适的平衡点。\n\n现在你已经有了一些转换媒体的工具，让我们来谈谈如何将其添加到你的页面中。\n\
    \n# 第 7 章\n\n## 多媒体：使用原生 HTML5 音频\n\n在本章中，我们将介绍 `audio` 元素及其属性。虽然我们关注的是 `audio`\
    \ 元素，但请记住，这些属性大部分也适用于 `video`。事实上，可以使用 `audio` 元素播放视频文件，并使用 `video` 元素播放音频文件。主要的区别在于，如果可用，`video`\
    \ 元素将显示图像轨道；而 `audio` 则永远不会。\n\n## `audio` 元素\n\n在网页上添加音频非常简单。使用 `<audio>` 标签即可。它至少需要一个\
    \ `src` 属性，即媒体文件的路径和名称。音频元素还需要一个结束标签 `</audio>`。使用你的文本编辑器创建一个新的 HTML 文件，并添加下面的代码段，更改\
    \ `src` 的值指向你的媒体文件。将其保存为 audio.html，然后在浏览器中打开。\n\n```\n<audio src=\"/path/to/media.file\"\
    ></audio>\n```\n\n你应该什么也看不也听不到。默认情况下，`audio` 和 `video` 元素缺少控件并且处于空闲状态加载。\n\n为了向用户展示播放器界面，我们需要添加\
    \ `controls` 属性。\n\n```\n<audio src=\"/path/to/media.file\" controls></audio>\n\
    ```\n\n`controls` 属性是一个空属性的示例。对于空属性，它的存在与否决定了属性值是真还是假。它实际上等同于输入 `controls=\"\"\
    ` 并用空字符串作为值。\n\n添加 `controls` 属性将为我们提供可见的播放/暂停、音量等控件。外观取决于浏览器。\n\n### 注意：JavaScript\
    \ 已禁用\n\n当用户禁用了 JavaScript 时，无论 `controls` 属性值如何，浏览器都会显示媒体界面。\n\n![默认播放器从上到下 Internet\
    \ Explorer 11, Chrome 30, Firefox 27, Safari 6.0.5](img/audio-controls.png)\n\n\
    图 7.1 默认播放器从上到下 Internet Explorer 11, Chrome 30, Firefox 27, Safari 6.0.5\n\n\
    某些浏览器暴露所谓的“Shadow DOM”，即使用 CSS 目标组件的方法。Shadow DOM 的支持因浏览器而异，因此你需要咨询浏览器的文档。\n\n\
    更灵活的方法构建自己的播放器。正如我们在书中后面看到的，我们还可以使用媒体 API、CSS 和 JavaScript 控制外观。\n\n## `autoplay`\
    \ 属性\n\n我们可以通过添加 `autoplay` 属性在媒体加载时立即播放。与 `controls` 一样，`autoplay` 是一个空属性。\n\n\
    ```\n<audio src=\"/path/to/media.file\" autoplay></audio>\n```\n\n在你的 audio.html\
    \ 文件中将 `controls` 替换为 `autoplay` 并刷新页面。注意我们的音频立即播放，但也注意到没有停止播放的方法。如果我们想让用户控制此媒体，我们需要包含两者，如下：\n\
    \n```\n<audio src=\"/path/to/media.file\" autoplay controls></audio>\n```\n\n\
    在使用 `autoplay` 属性之前，请体谅你的用户。自动播放的媒体会消耗你和用户的带宽。对于带宽有限的用户来说，媒体文件会“阻塞管道”。对于按流量计费的用户，自动播放媒体意味着意味着费用。而且许多用户单纯觉得这很烦。在大多数情况下，用户发起的媒体是更好的选择。\n\
    \n### 循环媒体\n\n也许你想使用一些环境音频为你的网站营造氛围。在这种情况下，你可能希望媒体自动重复，无需用户干预。这就是 `loop` 属性派上用场的地方。存在时，媒体将在结束时“回溯”并从头开始。\n\
    \n```\n<audio src=\"/path/to/media.file\" autoplay controls loop></audio>\n```\n\
    \n### 静音媒体\n\nHTML5 提供了通过 `muted` 属性静音媒体文件输出的能力。媒体文件仍会被下载。进度条和时间将继续更新。但浏览器不会输出任何声音。\n\
    \n```\n<audio src=\"/path/to/media.file\" controls muted></audio>\n```\n\n"
- fmt: "\nThough perhaps nonsensical for audio files, it makes a bit more sense for\
    \ video. For example, a video ad can still capture the user's attention visually,\
    \ without the added disruptiveness of sound. Note again that `muted` is an empty\
    \ attribute. For XHTML syntax, you'll need to use `muted=\"\"` or `muted=\"muted\"\
    ` instead.\n\nWe can also control audio output with scripting and the `volume`\
    \ property.\n\n## Buffer Hinting with the `preload` Attribute\n\nMultimedia uses\
    \ a lot of bandwidth—both for your servers and your users. Audio and video data\
    \ takes a lot of bytes. As the document loads, the browser will request and download\
    \ a snippet of the media file. Usually this snippet is just long enough to determine\
    \ the file's duration or dimensions. In the case of video, it may also download\
    \ a frame or two. When playback begins, the browser will make another request—sometimes\
    \ multiple requests—for the rest of the media file.\n\nEach of these requests\
    \ places an additional demand on the server. And partial requests happen whether\
    \ or not the user listens to the audio or watches the video file. The good news\
    \ is that we can shape this behavior with the `preload` attribute, as shown below.\n\
    \n```\n<audio src=\"/path/to/media.file\" controls muted preload=\"auto\">\n</audio>\n\
    ```\n\nThe `preload` attribute accepts three possible values.\n\n- `none` tells\
    \ the browser not to download anything until the user requests it, but it may\
    \ download the entire video upon playback.\n- `metadata` hints to the browser\
    \ that it's okay to download a portion of this media file, and that it should\
    \ throttle the download during playback.\n- `auto` tells the browser that it is\
    \ okay to download as much of the video as it wants.\n\n### `preload=\"auto\"\
    `\n\nUsing `auto` is the most demanding of these. A value of `auto` tells the\
    \ browser that it is okay to download as much of the file as it wants, up to the\
    \ entire resource. Playback is often more consistent, because more of the video\
    \ is already in the browser's buffer. This is great for the user, but it may not\
    \ be so great for your bandwidth usage. As you can see in [Figure 7.2](#ch07.html_requestsffox\
    \ \"Figure 7.2. Requests for Pontification.ogg when preload=\"auto\" as shown\
    \ in Firefox's developer tools\"), Firefox made three requests for our media file,\
    \ Pontification.ogg.\n\n![Requests for Pontification.ogg when preload=\"auto\"\
    \ as shown in Firefox's developer tools](figures/audio-preload-auto-firefox.png)\n\
    \nFigure 7.2. Requests for Pontification.ogg when `preload=\"auto\"` as shown\
    \ in Firefox's developer tools\n\n### `preload=\"none\"`\n\nA `preload` value\
    \ of `none` tells the browser, \"Don't you dare download a single byte until the\
    \ user tries to play this file!\" On the plus side, `preload=\"none\"` will reduce\
    \ the number of requests, thereby reducing bandwidth consumption. In [Figure 7.3](#ch07.html_requestpreloadnone\
    \ \"Figure 7.3. Requests for Pontification.ogg when preload=\"none\" as shown\
    \ in Firefox's developer tools\"), below, we can see that the browser makes a\
    \ request for our HTML document, but not our media file.\n\n![Requests for Pontification.ogg\
    \ when preload=\"none\" as shown in Firefox's developer tools](figures/audio-preload-none-firefox.png)\n\
    \nFigure 7.3. Requests for Pontification.ogg when `preload=\"none\"` as shown\
    \ in Firefox's developer tools\n\nOn the minus side, `preload=\"none\"` means\
    \ that playback will be less responsive. The user may experience may several seconds\
    \ of lag time between when he or she clicks 'play,' and when the media actually\
    \ begins playing. Once playback starts, however, the browser may aggressively\
    \ download the file.\n\n### `preload=\"metadata\"`\n\nThink of `metadata` as a\
    \ nice compromise between the two. When the `preload` attribute is set to `metadata`,\
    \ the browser will make one request, and only download a portion of the file.\n\
    \n![Requests for Pontification.ogg when preload=\"metadata\" as shown in Firefox's\
    \ developer tools](figures/audio-preload-metadata-firefox.png)\n\nFigure 7.4.\
    \ Requests for Pontification.ogg when `preload=\"metadata\"` as shown in Firefox's\
    \ developer tools\n\nUsing the `metadata` value also suggests to the browser that\
    \ it should throttle the download once playback begins. Neither `preload=\"none\"\
    ` nor `preload=\"auto\"` prevent the browser from downloading an entire resource.\
    \ However, `preload=\"metadata\"` hints to the browser that it should download\
    \ the file at the slowest possible rate that still allows consistent play.\n\n\
    Here's where things get interesting: we can use JavaScript to change the value\
    \ of `preload` once playback begins. We may, for example, want to start with `preload=\"\
    none\"`, so that no additional data will be downloaded. Then once the user begins\
    \ playback we can switch to `preload=\"metadata\"` and reap the benefits of download\
    \ throttling. There's an example of how to do this in [Chapter 6](#ch06.html \"\
    Chapter 6Multimedia: Preparing Your Media\").\n\n## Fallback Content\n\nNotice\
    \ here that we're using both start and end tags for the `audio` element, but there\
    \ isn't anything in between. If a user visits our page using a browser that doesn't\
    \ support audio, they won't see any indication that the player is missing (unless\
    \ other content on the page tells them it is).\n\nWe can fix this issue by adding\
    \ fallback content between the `<audio>` and `</audio>` tags as shown below.\n\
    \n```\n <audio src=\"/path/to/media.file\" controls>\n   Oh no! Your browser doesn't\
    \ support HTML5 audio.\n   Try upgrading your browser if you can.\n </audio>\n\
    ```\n\nYou could also use an image as your alternative content, or embed a Flash-based\
    \ player between the tags. As we'll see in [Chapters 8](#ch08.html \"Chapter 8Multimedia:\
    \ Using Native HTML5 Video\") and 9, our `<source>` and `<track>` tags also sit\
    \ between our opening and closing tags.\n\nRemember: everything we've discussed\
    \ so far also applies to the `video` element. But the `video` element has a few\
    \ more attributes that make sense for a visual medium. We'll discuss those in\
    \ the [next chapter](#ch08.html \"Chapter 8Multimedia: Using Native HTML5 Video\"\
    ).\n\n# Chapter 8\n\n## Multimedia: Using Native HTML5 Video\n\nAdding video to\
    \ your HTML documents is just as straightforward as adding audio: use the `<video>`\
    \ tag. As with `audio`, the `video` element requires a closing tag (`</video>`)\
    \ and a `src` attribute.\n\nCreate a new HTML document, and add the code below,\
    \ changing the value of `src` to point to the media file of your choice. Save\
    \ it as video.html, and open the file in your browser.\n\n```\n<video src=\"/path/to/media.file\"\
    ></video>\n```\n\nYou should see the first frame of your video, and that's it,\
    \ as shown in [Figure 8.1](#ch08.html_nocontrolsnative \"Figure 8.1. A video player\
    \ in Chrome Canary when the controls attribute has not been set. Image from \"\
    Big Buck Bunny\" by the Blender Foundation, bigbuckbunny.org\"). As with `audio`,\
    \ the `video` element lacks control by default (unless JavaScript is disabled).\n\
    \n![A video player in Chrome Canary when the controls attribute has not been set.\
    \ Image from \"Big Buck Bunny\" by the Blender Foundation, bigbuckbunny.org](figures/default-video-control-chrome.png)\n\
    \nFigure 8.1. A video player in Chrome Canary when the `controls` attribute has\
    \ not been set. Image from \"Big Buck Bunny\" by the Blender Foundation, bigbuckbunny.org\n\
    \nTo enable controls, we'll need to add a `controls` attribute, as shown below.\n\
    \n```\n <video src=\"/path/to/media.file\" controls></video>\n```\n\nAs with the\
    \ `audio` element, this will add a player user interface to the video, so that\
    \ the user can play, pause, seek, and adjust the volume. Video controls look more\
    \ or less like their audio counterparts. They usually have an additional control\
    \ for entering and exiting full-screen playback, and in most browsers a control\
    \ toggle subtitles and captions. Exactly what the player looks like depends on\
    \ the browser, and not every browser makes re-styling these controls easy.\n\n\
    ## Setting Video Dimensions\n"
