  trans: "\n\n每个 HTML 元素都有一个 DOM 脚本接口。接口是脚本语言可用的属性、常量、事件和方法的组。某些元素（如 `p`）具有简单的接口，没有多少属性适用于\
    \ `p` 元素。而其他元素如 `audio` 和 `video` 元素则拥有强大的接口，允许我们与元素的每个状态进行交互并控制。\n\n正如我们在前面的章节中看到的，`audio`\
    \ 和 `video` 许多许多共同属性。它们的脚本接口也是如此。在本章中，我们将重点创建一个视频播放器。然而，我们所讨论的大部分内容也适用于音频。我们会对差异和异常进行说明。\n\
    \n## 事件驱动的 DOM 脚本：引言\n\n为了创建我们的播放器，将需要使用一种名为*事件驱动编程*的技术。`audio` 和 `video` 元素在媒体加载和播放期间会触发事件。我们可以使用\
    \ DOM 脚本来*监听*这些事件，并在事件发生时采取行动。这有点像演员在台下倾听上场的信号，只不过是以代码的形式呈现的。\n\n这两个元素都会为各种事情触发事件。但对于这个播放器，我们只讨论其中三种：\n\
    \n*   `durationchange`：当浏览器下载了足够的文件以确定我们媒体文件的时长时触发。\n*   `timeupdate`：每当媒体位置更新时触发。\n\
    *   `volumechange`：每当音量变化时触发。\n\n我们有两种方式可以监听事件：我们可以使用元素的事件处理器属性，或者使用 `addEventListener()`\
    \ DOM 方法。事件处理器属性基本上基本上是带有 `on` 前缀的事件名称——例如 `ondurationchange`、`ontimeupdate` 和\
    \ `onclick`。大多数 HTML5 事件都有这些属性，并且使用它们是完全可以接受的，例如：\n\n```\nobject.onclick = function_to_invoke;\n\
    ```\n\n然而，在本章中我们将使用 `addEventListener()`。使用 `addEventListener()` 赋予了我们更大的灵活性。使用事件处理器属性时，每个事件只能调用一个函数。而使用\
    \ `addEventListener()`，我们可以同时调用多个函数。基本语法如下：\n\n```\nobject.addEventListener('event_name',\
    \ function_to_invoke);\n```\n\n当事件触发时，一个*事件对象*将作为参数传递给监听器或*回调函数*。事件对象是用于传递数据的容器。如果我们想在回调函数中使用这些数据，我们需要确保回调函数定义了参数。为了基于上面的通用示例，我们的\
    \ `function_to_invoke` 将类似于下面的示例。\n\n```\nfunction function_to_invoke(event){\n\
    \    // 对我们的事件执行操作的函数体\n}\n```\n\n每个事件对象包含多个属性，我们可以使用点语法获取每个属性。基本形式是 `eventobject.property`，其中\
    \ `eventobject` 是我们的函数参数名。在本章中，我们最关注的是事件对象的 `target`，因此在几乎所有的函数中都会使用 `event.target`。`target`\
    \ 属性是对触发事件的对象的引用。\n\n`target` 本身也是一个对象。它包含了所有 HTML 元素共有的属性，如 `id`。但它也包含了特定于对象类型的属性：用于视频对象的\
    \ `duration`，用于表单控件的 `value`。这个概念起初*确实*很难理解，所以你可能需要读几遍才能完全掌握。\n\n## 1 步：创建我们的标记\n\
    \n使用 DOM 脚本创建媒体播放器有两种方法：完全使用 JavaScript（以及 `document.createElement()` 方法）或通过编写标记。我们将选择后者。让我们来构建标记：\n\
    \n```html\n<!DOCTYPE html>\n<<html>\n  <head>\n    <meta charset=\"utf-8\">\n\
    \    <title>\n    编写音频和视频播放器\n    </title>            \n    <link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"video.css\">\n  </head>\n  <body        \n    <div\
    \ id=\"video_wrapper\">\n      <video preload=\"metadata\">\n         <source\
    \ src=\"./video_file.mp4\" type=\"video/mp4\">\n         <source src=\"./video_file.webm\"\
    \ type=\"video/webm\">\n      </video>\n      <div id=\"video_time\">\n      \
    \  <progress value=\"0\" id=\"playback\"></progress>\n        <span id=\"elapsed\"\
    ></</span> <span id=\"duration\"></</span>\n      </</div>\n      <div id=\"video_seek\"\
    > \n        <label for=\"seek\">Seek</label>\n    <input type=\"range\" id=\"\
    seek\" title=\"seek\" \n    min=\"0\" value=\"0\" max=\"0\">\n      </div>\n \
    \     <div id=\"video_controls\">\n        <button type=\"button\" id=\"play\"\
    >Play</button>\n        <button type=\"button\" id=\"pause\" class=\"hidden\"\
    >\n          Pause\n        </button>\n        <label for=\"volume\">Volume</label>\n\
    \        <input type=\"range\" id=\"volume\" title=\"volume\" \n    min=\"0\"\
    \ max=\"1\" step=\"0.1\" value=\"1\">                \n      </div>\n    </div>\n\
    \    <script type=\"text/javascript\" src=\"video.js\"></script> \n  </body>\n\
    </html>\n```\n\n在这里，我们为音量和进度条控制使用了 `range` 输入类型。\n\n## 2 步：获取我们的视频对象\n\n在进行更多操作之前，我们需要为脚本创建一个可以操作的视频对象。我们将使用标记中的\
    \ `video` 元素，并使用 `document.querySelector()` 方法获取它。该方法是 `Selectors API` 的一部分，将返回文档中匹配选择器的第一个对象——在本例中是\
    \ `video` 元素选择器。\n\n```javascript\nvar video = document.querySelector('video');\n\
    ```\n\n如果你的 `video` 元素有一个 `id` 属性，你也可以像下面所示使用 `document.getElementById()` 方法。\n\
    \n```javascript\nvar video = document.getElementById('my_video');\n```\n\n这两种方法任都会返回一个\
    \ `HTMLVideoElement` 类型的对象。如果这是一个 `audio` 元素，我们的对象将是一个 `HTMLAudioElement` 对象。`HTMLVideoElement`\
    \ 和 `HTMLAudioElement` 接口都定义了可以通过 DOM 脚本进行读写的属性。某些属性（如 `controls`）有相应的 HTML 属性。其他属性（如\
    \ `volume`）只能通过脚本接口可用。\n\n## 3 步：播放和暂停视频\n\n你对播放器想要做的绝大多数操作就是，*播放*视频文件。你可能还想暂停它来接电话，或者在老板面前隐藏你的偷懒。`HTMLVideoElement`\
    \ 对象有两个自言易懂的方法来完成这些任务：`play()` 和 `pause()`。每当调用 `play()` 方法时，播放将开始或恢复。当调用 `pause()`\
    \ 方法时，播放将暂停。\n\n"
- fmt: "\nWe'll make sure these methods are invoked at the user's request. Play and\
    \ pause buttons are already part of our markup, so now we just need to add an\
    \ event listener to each. First, let's reference our buttons as variables:\n\n\
    ```\nvar play  = document.getElementById('play');\nvar pause = document.getElementById('pause');\n\
    ```\n\nSince these are buttons, they'll most likely be clicked on. So let's add\
    \ `click` event listeners to both.\n\n```\nplay.addEventListener('click', clickhandler);\n\
    pause.addEventListener('click', clickhandler);\n```\n\nNext, we'll need to define\
    \ our `clickhandler` function. Because these buttons will perform similar actions,\
    \ we can use the same function for both. We'll invoke one function or the other\
    \ based on the value of the `event.target.id` property.\n\n```javascript\nfunction\
    \ clickhandler(event){\n    var id = event.target.id;\n\n    if( id == 'play'\
    \ ){\n        video.play();\n    }\n    if( id == 'pause' ){\n        video.pause();\n\
    \    }  \n}\n```\n\n## Step 3: Determining the File's Duration\n\nMedia objects\
    \ have a `duration` property that's only available through the scripting interface.\
    \ This property becomes defined once the browser has downloaded the file's metadata.\n\
    \nWhen the browser can determine the running time of the media file, it fires\
    \ a `durationchange` event on the audio or video object. We can listen for this\
    \ event and use it to update our duration display. Our markup also has a progress\
    \ bar and a range control for seeking. In order for those controls to work correctly,\
    \ we'll need to set the `max` attribute for those controls to the value of our\
    \ `duration` property.\n\nFirst let's look at our `updateduration` function:\n\
    \n```javascript\nfunction updateduration(event){\n    var durationdisplay = document.getElementById('duration'),\n\
    \        elapseddisplay  = document.getElementById('elapsed');\n\n    durationdisplay.innerHTML\
    \ = event.target.duration;\n    elapseddisplay.innerHTML  = event.target.currentTime;\n\
    }\n```\n\nIn this function, we have retrieved the `span#duration` and `span#elapsed`\
    \ elements. Then we're updating the text between the `<span>` tags with the values\
    \ of `duration` and `currentTime` of our video object.\n\nWe'll also define two\
    \ more functions, one that updates the value of the `max` attribute for the progress\
    \ bar, and another that updates the value of `max` for the seek control. If we\
    \ didn't set the `max` values, our progress bar wouldn't accurately indicate how\
    \ much of the video has elapsed, nor would our range control allow us to scrub\
    \ forward or backward.\n\n```javascript\nvar seek = document.getElementById('seek'),\n\
    \    playback = document.getElementById('playback');\n\nfunction updateseekmax(event){\n\
    \    if( event.target.duration ){\n        seek.max = event.target.duration;\n\
    \    }\n}\n\nfunction updateplaybackmax(event){\n    if( event.target.duration\
    \ ){\n        playback.max = event.target.duration;\n    }\n}\n```\n\nNow let's\
    \ add these functions to our video object as `durationchange` event listeners.\n\
    \n```javascript\nvideo.addEventListener('durationchange', updateduration);\nvideo.addEventListener('durationchange',\
    \ updateseekmax);\nvideo.addEventListener('durationchange', updateplaybackmax);\n\
    ```\n\nAs our document loads and the `durationchage` event is fired, these three\
    \ functions will be called.\n\n## Step 4: Indicating Time Elapsed\n\nOnce our\
    \ media file begins playback, we'll want to indicate how much time has elapsed.\
    \ To do this, we'll need to listen for the `timechange` event, and in our callback\
    \ function, read the `currentTime` property of our video object.\n\n`timechange`\
    \ is an event fired periodically—every 15 to 250 milliseconds—during media playback.\
    \ When fired, we'll check the value of the `currentTime` property and update the\
    \ text in our elapsed display. This `currentTime` property returns the current\
    \ playback position of the media file in seconds. Let's set up our callback function.\n\
    \n```javascript\nfunction timeupdatehandler(event){\n    var elapsed = document.getElementById('elapsed');\n\
    \    elapsed.innerHTML = event.target.currentTime;\n}\n```\n\nThen we can add\
    \ an event listener to the video object.\n\n```javascript\nvideo.addEventListener('timechange',\
    \ timeupdatehandler);\n```\n\n`currentTime` is what's known as a getter/setter\
    \ property. We can use it to get the current point in the media timeline. But\
    \ we can also use it to move between points in the media timeline. Using `video.currentTime\
    \ = 0`, for example, resets the current playback point to the beginning. This\
    \ is the secret to creating a custom seek bar.\n\n## Step 5: Seeking Using a `range`\
    \ Input Type\n\nRange input types work by having a minimum value and a maximum\
    \ value (set using `min` and `max` attributes). Positions along the control correspond\
    \ to values between the minimum and maximum values of the range—in this case `0`,\
    \ and the media file's total duration in seconds.\n\nAll input elements, including\
    \ range, fire `change` events when a user changes the value of the control. When\
    \ the event object is passed to our handler, we can read the range control's current\
    \ `value` attribute, and update the value of `video.currentTime`. To keep our\
    \ progress bar in sync, we'll update its value as well.\n\nLet's look at our callback\
    \ function and event listener:\n\n```javascript\nfunction seekhandler(event){\n\
    \    video.currentTime = event.target.value; \n    playback.value = event.target.value\n\
    }\n\nseek.addEventListener('change',  seekhandler);\n```\n\nWhen the user adjusts\
    \ the seek control, our video will advance or reverse accordingly.\n\n![Advancing\
    \ the video using our seek control. Video image from \"Sita Sings the Blues\"\
    \ by Nina Paley (sitasingstheblues.com)](figures/video-seeking.png)\n\nFigure\
    \ 11.2. Advancing the video using our seek control. Video image from \"Sita Sings\
    \ the Blues\" by Nina Paley (sitasingstheblues.com)\n\n## Step 6: Adjusting Volume\n\
    \nOur volume control works similarly to the seek control.\n\nHTML media objects\
    \ have a volume attribute that's available through the scripting interface. Its\
    \ lower boundary is 0.0, and its upper boundary is 1.0\\. Acceptable values fall\
    \ somewhere in between. All values are relative to the intrinsic volume of the\
    \ media file in question.\n\nOur volume range control has a `min` value of 0 and\
    \ a `max` values of 1 to correspond to the upper and lower boundaries of the `volume`\
    \ property. Since these values are less than or equal to one, we need to add `step=\"\
    0.1\"` to our tag.\n\nAs with our seek control, when the user changes the volume,\
    \ the browser will fire a `change` event. We can then read its `event.target.value`\
    \ property and update the video objects's `volume` property with that value. In\
    \ the code below, we've defined our callback function, and adding an event listener\
    \ to volume control.\n\n```javascript\nvar volume = document.getElementById('volume');\n\
    \nfunction volumehandler(event){\n    video.volume = event.target.value;\n}\n\n\
    volume.addEventListener('change',  volumehandler);\n```\n\n## Hinting at Bandwidth\
    \ Consumption by Changing the Value of `preload`\n\nIn [Chapter 7](#ch07.html\
    \ \"Chapter 7Multimedia: Using Native HTML5 Audio\"), we mentioned that the `preload`\
    \ attribute provides hints to the browser about how much of our media should be\
    \ downloaded at a time. Using `preload=\"none\"` keeps the browser from downloading\
    \ any portion of the file, but once the user initiates playback, the browser could\
    \ aggressively download the media. Using `preload=\"metadata\"` is a hint to the\
    \ browser that it should behave as though bandwidth were at a premium.\n\nIf bandwidth\
    \ conservation is your goal, the combination of `preload=\"none\"` and `preload=\"\
    metadata\"` is the way to go. To do that, however, we'll need to use scripting\
    \ to change the value once the user initiates playback. Let's update our `clickhandler`\
    \ function from above.\n\n```javascript\nfunction clickhandler(event){\n    var\
    \ id = event.target.id;\n\n    if( id === 'play' ){\n        video.play();\n \
    \       video.preload = 'metadata';\n    }\n    if( id === 'pause' ){\n      \
    \  video.pause();\n    }  \n}\n```\n"
