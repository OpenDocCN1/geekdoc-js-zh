  trans: "\n另一方面，使用 `sessionStorage` 存储的数据仅在浏览上下文有效时才存在。通常这意味着一旦用户关闭浏览器窗口或标签页，我们就会丢失\
    \ `sessionStorage` 数据。然而，在允许用户保存浏览会话的浏览器中，它可能会持续存在。\n\n在本章中，我们将讨论 Web 相比于 Cookie\
    \ 的的一些优势。然后我们将讨论如何使用 Web Storage API 并查看其的一些局限性。\n\n## 为什么使用 Web Storage 而不是 Cookies？\n\
    \n使用 `localStorage` 或 `sessionStorage` 代替 Cookie 主要有三个原因：\n\n* HTTP 请求性能\n* 数据存储容量\n\
    * 针对跨站脚本攻击提供更好的保护\n\nCookie 会包含在每个指向服务器的请求中，这增加了每个请求的大小和持续时间。使用较小的 Cookie 有帮助，但使用\
    \ `localStorage` 和 `sessionStorage` 帮助最大。数据存储在本地，并仅在请求时发送。\n\n使用 Web 存储的另一个优势是你可以存储更多数据。现代浏览器对每个域限制存储\
    \ 50 个 Cookie。按照每个 Cookie 4 字节计算，在某些浏览器开始删除 Cookie 之前，我们可以安全地存储约 200KB 的数据。不，我们无法控制哪些数据被删除。另一方面，Web\
    \ 存储的限制从 Safari 和 Android 的约 2.5MB 到大多数其他浏览器的约 5MB 不等。我们可以通过键删除数据。\n\n最后，Web 存储比\
    \ Cookie 更不容易受到跨站脚本攻击的影响。Cookie 遵循同源策略。为 `.example.com` 设置的 Cookie 可以被 example.com\
    \ 的任何子域名读取或覆盖，包括 `hackedsubdomain.example.com`。如果 `sensitivata.example.com` 也使用\
    \ `.example.com` Cookie，那么 `hackedsubdomain.example.com` 上的脚本就可以拦截该数据。\n\n同源限制意味着只有创建数据的源才能访问该数据。由\
    \ `http://api.example.com` 写入 `localStorage` 的数据将对 `http://example.com`、`http://store.example.com`、`https://example.com`\
    \ 甚至 `http://api.example.com:80` 不可用。\n\n## 浏览器支持\n\n在本书讨论的所有 API 中，Web Storage\
    \ 在主流浏览器中的支持得最广泛。它适用于 Internet Explorer 8+、Firefox 3.5+、Safari 4+、Opera 10.5+\
    \ 以及 Android WebKit。有几个 polyfill 脚本可以在缺乏 Web Storage 的浏览器中模拟 Web Storage API。其中一个脚本是\
    \ [Remy Sharp 提供的 Storage polyfill。](https://gist.github.com/remy/350433)。它使用\
    \ Cookie 和 `window.name` 分别模拟 `localStorage` 和 `sessionStorage`。\n\n### 检查 Web\
    \ Storage\n\n本章请使用 Chrome、Safari 或 Opera。这些浏览器的开发者工具允许你检查和管理 Web 存储值。在 Chrome（见图\
    \ 24.1](#ch24.html_localstorage-inspector \"Figure 24.1. Google Chrome 中的 Local\
    \ Storage 检查器.\")）、Safari 和 Opera 15+ 中，你可以在开发者工具的资源（Resources）面板下找到 Web 存储。在\
    \ Opera 12（Linux 用户可用的 Opera 版本）中，你可以在 Dragonfly 的存储（Storage）面板下找到它。\n\n![Google\
    \ Chrome 中的 Local Storage 检查器。](img/localstorage-inspector.png)\n\n图 24.1. Google\
    \ Chrome 中的 Local Storage 检查器。\n\n## 测试 Web Storage 支持情况\n\n`localStorage` 和 `sessionStorage`\
    \ 都是 `window` 对象的属性。我们可以通过测试这些属性是否为 `undefined` 来测试浏览器支持情况：\n\n```\nif( typeof\
    \ window.localStorage == 'undefined' ){\n    // 使用 localStorage 以外的方法。\n} else\
    \ {\n    // 保存键值对。   \n}\n```\n\n测试 `sessionStorage` 的方式类似；改为使用 `typeof window.sessionStorage\
    \ == 'undefined'`。但通常情况下，如果浏览器支持 `localStorage`，它也支持 `sessionStorage`，反之亦然。\n\n\
    让我们通过构建一个简单的待事项列表来学习 Storage API。我们将使用 `localStorage` 来保存待办事项及其状态。虽然我们在本章中关注 `localStorage`，但请记住这同样适用于\
    \ `sessionStorage`。只需交换属性名称即可。\n\n## 设置我们的 HTML\n\n基础的 HTML 轮纲非常简单。我们将设置一个包含输入字段和添加新项目按钮的表单。我们还会添加删除项目的按钮。并添加一个空列表。当然，我们还会添加指向\
    \ CSS 和 JavaScript 文件的链接。你的 HTML 看起来应该是这样：\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en-us\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>localStorage 事项列表</title>\n\
    \  <link rel=\"stylesheet\" href=\"css/style.css\">  \n</head>\n<body>\n  <form>\n\
    \    <p>\n      <label for=\"newitem\">你今天要做什么？</label>\n      <input type=\"\
    text\" id=\"newitem\" required>\n      <button type=\"submit\" id=\"saveitem\"\
    >添加</button>\n    </p>\n    <p>\n      <button type=\"button\" id=\"deletedone\"\
    >删除已完成</button>\n      <button type=\"button\" id=\"deleteall\">重置列表</button>\n\
    \    </p>\n  </form>\n  <ul id=\"list\"></ul>\n  <script src=\"js/todolist.js\"\
    ></script>\n</body>\n</html>\n```\n\n"
- fmt: "\nShould a key already exist, using `setItem` will overwrite the old value\
    \ rather than create a new record. For our to-do list, this is exactly what we\
    \ want. To prevent the value of your key from being overwritten, check whether\
    \ the key exists before saving the item.\n\nWe will also use `setItem` to update\
    \ our task's status when it's clicked, as we'll see in the next section.\n\n##\
    \ Retrieving Values With `localStorage.getItem()`\n\nTo retrieve the value of\
    \ a key, we use `localStorage.getItem()`. This method accepts one argument, the\
    \ key of the value we’d like to retrieve, which must be a string.\n\nIf the key\
    \ exists, `getItem` will return the value of that key. Otherwise, it will return\
    \ `null`. That makes it useful for determining whether a key exists before calling\
    \ `setItem`. For example, if we wanted to test the presence of a `lunch` key,\
    \ we might do the following:\n\n```\nif( localStorage.getItem('lunch') ){\n  \
    \  // do something.\n}\n```\n\nIn our case, we’re going use `getItem` to retrieve\
    \ the status of our task. Based on the value returned by `getItem`, we will update\
    \ the value of our key using `setItem`.\n\nIn the code below, we’ve added an event\
    \ listener to our unordered list rather than to each list item. We’re using a\
    \ technique called **event delegation**. When an event is fired on an element,\
    \ it “bubbles up” to its ancestors. This means we can set a listener on its parent\
    \ element, and use the `target` property of the event object to determine which\
    \ element triggered the event. Because we only want to take an action if the element\
    \ clicked was a list item, we need to check the `nodeName` property of the `target`\
    \ object:\n\n```\nfunction toggleStatus(event){ \n    var status; \n    if(event.target.nodeName\
    \ == 'LI'){\n        /* \n        Using + is a trick to convert numeric strings\
    \ to numbers.\n        */\n        status = +localStorage.getItem(event.target.textContent);\n\
    \        if(status){ \n            localStorage.setItem(event.target.textContent,0);\
    \                     \n        } else {            \n            localStorage.setItem(event.target.textContent,1);\n\
    \        }\n\t    /* Toggle a 'done' class */\n        event.target.classList.toggle('done');\n\
    \    }\n}\n\nvar list = document.getElementById('list');   \nlist.addEventListener('click',toggleStatus);\n\
    ```\n\nThe `event.target` property is a pointer to the element that was clicked.\
    \ Every element object also has a `textContent` attribute, which is its child\
    \ text, if applicable. Each list item’s `textContent` matches a `localStorage`\
    \ key, so we can use it to retrieve the value we want. That’s what we’re doing\
    \ with `status = localStorage.getItem(event.target.textContent)`.\n\n### Note:\
    \ `localStorage` keys and values are strings\n\nRemember, all `localStorage` keys\
    \ and values are strings. What look like numbers are actually *numeric strings*.\
    \ To make comparisons with numbers or Boolean values, you’ll need to convert the\
    \ variable type. Here we’ve used a `+` sign to convert each key’s value to a number.\
    \ Zero is a **falsy** value, equivalent to but not equal to the Boolean `false`;\
    \ 1 is a **truthy** value.\n\n### Alternative Syntaxes for Setting and Getting\
    \ Items\n\nUsing `setItem` and `getItem` are not the only way to set or retrieve\
    \ `localStorage` values. You can also use square-bracket syntax or dot syntax\
    \ to add and remove them:\n\n```\nlocalStorage['foo'] = 'bar'; \n\nconsole.log(localStorage.foo)\
    \ // logs 'bar' to the console\n```\n\nThis is the equivalent of using `localStorage.setItem('foo','bar')`\
    \ and `localStorage.getItem('foo')`. If there’s a chance that your keys will contain\
    \ spaces though, stick to square-bracket syntax or use `setItem()`/`getItem()`\
    \ instead.\n\n## Looping Over Storage Items\n\nOn page reload, our list of to-dos\
    \ will be blank. They’ll still be available in `localStorage`, but not part of\
    \ the DOM tree. To fix this, we’ll have to rebuild our to-do list by iterating\
    \ over our collection of `localStorage` items, preferably when the page loads.\
    \ This is where `localStorage.key()` and `localStorage.length` come in handy.\n\
    \n`localStorage.length` tells us how many items are available in our storage area.\
    \ The `key()` method retrieves the key name for an item at a given index. It accepts\
    \ one argument: an integer value that’s greater or equal to 0 and less than the\
    \ value of `length`. If the argument is less than zero, or greater than equal\
    \ to `length`, `localStorage.key()` will return `null`.\n\nIndexes and keys have\
    \ a very loose relationship. Each browser orders its keys differently. What’s\
    \ more, the key and value at a given index will change as items are added or removed.\
    \ To retrieve a *particular* value, `key()` is a bad choice. But for looping over\
    \ entries, it’s perfect. An example follows:\n\n```\nvar i = localStorage.length;\n\
    while( i-- ){ /* As long as i isn't 0, this is true */\n    console.log( localStorage.key(i)\
    \ );\n}\n```\n\nThis will print every key in our storage area to the console.\
    \ If we wanted to print the values instead, we could use `key()` to retrieve the\
    \ key name, then pass it to `getItem()` to retrieve the corresponding value:\n\
    \n```\nvar i = localStorage.length, key;\nwhile( i-- ){ \n    key = localStorage.key(i);\n\
    \    console.log( localStorage.getItem(key) );\n}\n```\n\nLet’s go back to our\
    \ to-do list. We have a mechanism for adding new items and marking them complete.\
    \ But if you reload the page, nothing happens. Our data is there in our storage\
    \ area, but not the page.\n\nWe can fix this by adding a listener for the `load`\
    \ event of the `window` object. Within our event handler, we’ll use `localStorage.length`\
    \ and `localStorage.key()` along with `localStorage.getItem(key)` to rebuild our\
    \ to-do list:\n\n```\nfunction loadList(){\n    var len = localStorage.length;\n\
    \    while( len-- ){\n        var key = localStorage.key(len);    \n        addItemToList(key,\
    \ localStorage.getItem(key));\n    }\n}\nwindow.addEventListener('load', loadList);\n\
    ```\n\nSince we’re working with existing items in this loop, we want to preserve\
    \ those values. Let’s tweak our `addItemToList` function a bit to do that:\n\n\
    ```\nfunction addItemToList(itemtxt, status){\n    var li = document.createElement('li');\n\
    \n    if(status === undefined){\n        status = 0;\n        localStorage.setItem(itemtxt,\
    \ status);\n    }\n\n    if(status == true){ li.classList.add('done'); }\n\n \
    \   li.textContent = itemtxt;\n    list.appendChild(li);\n}\n```\n\nWe’ve added\
    \ a `status` parameter, which gives us a way to specify whether a task is complete.\
    \ When we add a task and call this item, we’ll leave out the `status` parameter;\
    \ but when loading items from storage as we are here, we’ll include it.\n\nThe\
    \ line `if(status == true){ li.classList.add('done'); }` adds a `done` class to\
    \ the list item if our task status is `1`.\n\n## Clearing the Storage Area With\
    \ `localStorage.clear()`\n\nTo clear the storage area completely, use the `localStorage.clear()`\
    \ method. It doesn’t accept any parameters:\n\n```\nfunction clearAll() {\n  list.innerHTML\
    \ = '';\n  localStorage.clear();\n}\n```\n\nOnce called, it will remove *all*\
    \ keys and their values from the storage area. Once removed, these values are\
    \ no longer available to the application. **Use it carefully**.\n\n## Storage\
    \ Events\n\nStorage events are fired on the `window` object whenever the storage\
    \ area changes. This happens when `removeItem()` or `clear()` deletes an item\
    \ (or items). It also happens when `setItem()` sets a new value or changes an\
    \ existing one.\n\n### Listening for the Storage Event\n\nTo listen for the `storage`\
    \ event, add an event listener to the `window` object:\n\n```\nwindow.addEventListener('storage',\
    \ storagehandler); \n```\n\nOur `storagehandler` function that will be invoked\
    \ when storage event is fired. We’re yet to define that function―we’ll deal with\
    \ that in a moment. First, let’s take a look at the `StorageEvent` object.\n\n\
    ### The `StorageEvent` Object\n\nOur callback function will receive a `StorageEvent`\
    \ object as its argument. The `StorageEvent` object contains properties that are\
    \ universal to all objects, and five that are specific to its type:\n"
