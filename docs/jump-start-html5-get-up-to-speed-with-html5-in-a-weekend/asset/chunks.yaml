    \          members in 2011.\n        </p>\n\n        <p>\n          The National\
    \ Organization of Chickens is an advocacy group\n          focused on environmental\
    \ justice for chickens.\n        </p>\n      </aside>\n\n      <p>\n        LONDON\
    \ -- Henny Penny, young leader of the National\n        Organization of Chickens\
    \ announced that the sky will fall\n        within the next week. Opponents criticize\
    \ Penny,\n        suggesting that acorns are the more likely threat.\n      </p>\n\
    \n      <p>\n        Phasellus viverra faucibus arcu ullamcorper sodales. \n \
    \       Curabitur tincidunt est in imperdiet ultrices. Sed \n        dignissim\
    \ felis a neque dignissim, nec cursus sapien \n        egestas.\n      </p>\n\n\
    \    </article>\n  </main>\n\n  <footer>\n    <ul>\n      <li><a href=\"#\">Contact\
    \ Us</a></li>\n      <li><a href=\"#\">Terms of Use</a></li>\n      <li><a href=\"\
    #\">Privacy Policy</a></li>\n    </ul>\n    <p>No copyright 2013 HTML5 News-Press.</p>\n\
    \  </footer>\n\n</div>\n</body>\n</html>\n```\n\nNow we have a document that's\
    \ more accessible and easier for browsers of all kinds to consume and display.\n\
    \n# Chapter 4\n\n## Basics: HTML5 Forms\n\nHTML5 forms are a leap forward from\
    \ those in previous versions of HTML. We now have a half dozen new input states\
    \ or types, such as `range` and `url`; we have new attributes that let us require\
    \ fields, or specify a particular format; we have an API that lets us constrain\
    \ and validate input; and finally, we have new form elements, such as `datalist`,\
    \ that let us create engaging user interfaces without heavy JavaScript libraries\
    \ or plugins.\n\nUnfortunately, not every browser supports all of these features\
    \ just yet. For now we still need to use JavaScript libraries, and [polyfills](http://remysharp.com/2010/10/08/what-is-a-polyfill/)\
    \ (downloadable code which provides facilities that are not built into a web browser)\
    \ as fall back strategies.\n\nThe best way to understand HTML5 forms is to build\
    \ one. Let’s try building a form that collects story suggestions for the HTML5\
    \ News-Press site from the previous chapter. We’ll need to gather the following\
    \ information with our form:\n\n*   Name\n*   City of residence\n*   Email address\n\
    *   A telephone number\n*   A URL where we can learn more (if there is one)\n\
    *   The actual story idea\n\nAt the very least, we’ll want to require the user\
    \ to provide a first name, email address, and their story idea.\n\n### Starting\
    \ an HTML5 Form\n\nTo build our HTML form, we’ll need to start with an opening\
    \ `form` element tag. Because we want to submit this form to a server-side processing\
    \ script, we’ll need to include two attributes.\n\n*   `action`: the URL of the\
    \ script\n*   `method`: the HTTP request method to use, sometimes `GET`, but usually\
    \ `POST`\n\nSince this could be a lengthy message, we’ll use `POST` rather than\
    \ `GET`. `GET` is better suited to short key-value pairs, such as search boxes.\
    \ Other HTTP methods, such as `PUT`, `HEAD`, or `DELETE` may also be.\n\nIt's\
    \ worth noting that `application/x-www-form-urlencoded` is the default. If we\
    \ wanted to upload files, however, we would need `multipart/form-data`.\n\n```\n\
    <form action=\"/script\" method=\"post\">\n```\n\n### The `input` Element\n\n\
    The `input` element is the most commonly used for creating controls. An `input`\
    \ tag typically includes the following attributes:\n\n*   `name`: the name of\
    \ the field\n*   `type`: indicates what kind of input\n*   `id`: a unique identifier\
    \ for the field\n*   `value`: sets a default value\n\nOf these, only `name` is\
    \ required for our form to send data. There are about a dozen possible values\
    \ for the `type` attribute, most of which we’ll cover in this chapter. The default\
    \ is `text`.\n\n### Collecting Names\n\nPeople names and place names are usually\
    \ a mix of alphanumeric characters. For this reason, we’ll use the `text` input\
    \ state. Let’s add form fields for the writer’s name and city of residence. Since\
    \ we want to require a name, we’ll also add `required` attribute.\n\n```\n<p>\n\
    \  <label for=\"your_name\">Your name:</label>\n  <input type=\"text\" name=\"\
    your_name\" id=\"your_name\" required>\n</p>\n\n<p>\n  <label for=\"city\">City\
    \ of residence:</label>\n  <input type=\"text\" name=\"city\" id=\"city\">\n</p>\n\
    ```\n\n#### Note: id and name attributes\n\nThe `id` attribute may, but does not\
    \ have to be, the same as the `name` attribute.\n\n### Using Form Labels\n\nWe’ve\
    \ added an unfamiliar element here: `label`. The `label` element in an HTML form\
    \ works just like the label on a paper form. It tells the user what to enter in\
    \ the field. In order to associate a label with a form control, the `label` must\
    \ have a `for` attribute that matches the `id` attribute of its form field. Or\
    \ you could place the form control inside of the `label` element.\n\n```\n<label>Your\
    \ name:\n  <input type=\"text\" name=\"your_name\" id=\"your_name\" required>\n\
    </label>\n```\n\nUsing the `for` and `id` attributes, however, offers a little\
    \ more flexibility for page layouts. Why not just use text without wrapping it\
    \ in a `label` element? Using `label` increases the usability of the web for those\
    \ with physical or cognitive challenges. Screen-reading software, for example,\
    \ uses labels to help low-vision users in filling forms.\n\n## Requiring Form\
    \ Fields\n\nOne of the great improvements of HTML5 over previous versions is native\
    \ form validation. By adding the `required` attribute, we are asking the browser\
    \ to make sure this field has been filled out before submitting the form.\n\n\
    #### Note: Empty Attributes\n\nThe `required` attribute is an example of an empty\
    \ attribute. Its presence or absence determines whether that value is set.\n"
