    ```\n\n## Debugging\n\nIn case you encounter problems, you can debug your application\
    \ using the browser’s JavaScript console. In Chrome, the console is opened from\
    \ Menu > Tools > JavaScript Console. In Firefox, the same can be accessed from\
    \ Menu > Web Developer > Web Console. In case the event stream is not working\
    \ as expected, the console may report the errors, if any.\n\nYou need to pay special\
    \ attentions to the following:\n\n*   sending the header `Content-Type: text/event-stream`\
    \ from the server\n\n*   marking the start and end of content with `data:` and\
    \ `\\n\\n` respectively\n\n*   paying attention to same-origin policies\n\n##\
    \ Conclusion\n\nServer Sent Events have solved the long polling hack that we previously\
    \ used to achieve real-time update functionality. Here are a few simple projects\
    \ that you might want to implement:\n\n*   Creating a page that has a clock updated\
    \ from the server side.\n\n*   Reading and displaying the latest tweets with the\
    \ help of the Twitter API.\n\n*   Fetching a random photo with the Flickr API\
    \ and updating the page.\n\nThe Mozilla Developer Network has a [good resource\
    \ for learning more about SSEs.](https://developer.mozilla.org/en-US/docs/Server-sent_events)\
    \ Here, you can also find some demo apps and polyfills for older browsers.\n\n\
    # Chapter 30\n\nAPIs: The WebSocket API\n\nI think that WebSockets are one of\
    \ the coolest APIs available in HTML5\\. The real strength of the WebSocket API\
    \ comes to the fore when you want your clients to talk to the server through a\
    \ **persistent connection**. This means that once the connection is opened, the\
    \ server and the client can send messages to each other anytime. Gone are the\
    \ days when clients used to send a message to the server and wait until the server\
    \ responded back. Clearly, WebSockets eliminate the need for long polling! The\
    \ API is very useful if you want to create real-time apps where clients and the\
    \ server talk to each other continuously. For instance, you can build chat systems,\
    \ multi-player HTML5 games and similar apps with WebSockets.\n\n### Note: WebSockets\
    \ versus Server Sent Events (SSEs)\n\nWebSockets and SSEs can achieve similar\
    \ tasks but they are different. In the case of SSEs, the server only pushes data\
    \ to the client once new updates are available. In the case of WebSockets, both\
    \ client and server send data to each other; to be precise, the communication\
    \ is bi-directional (full-duplex, if you love more technical terms).\n\nTo use\
    \ WebSockets, you’ll need a WebSocket-enabled server. Well, that’s the tricky\
    \ part. Don’t worry! There are implementations of WebSockets available for several\
    \ different languages. I will cover those shortly.\n\nAdditionally, you should\
    \ always bear in mind that WebSockets allows *cross-origin communication*. So,\
    \ you should always only connect to the clients and servers that you trust.\n\n\
    ## The JavaScript API\n\nLet’s quickly try it out. The developers at [WebSocket.org](http://www.websocket.org/)\
    \ have created a demo WebSocket server at `ws://echo.websocket.org`. We can connect\
    \ to it and start exchanging messages with it in no time.\n\n### Note: The `ws://`\
    \ Protocol\n\n`ws://` is a protocol that’s similar to `http://`, except that it’s\
    \ used for specifying the Web Sockets server URLs.\n\nFirst, let’s see how to\
    \ connect to a simple WebSocket server using the JavaScript API. After that, I\
    \ will show how you can create your own WebSocket server and let others connect\
    \ with you.\n\n```\n// test if the browser supports the API\nif('WebSocket' in\
    \ window) {\n\n  var socket = new WebSocket('ws://echo.websocket.org');\n\n  if\
    \ (socket.readyState == 0) console.log('Connecting...');\n\n  // As soon as connection\
    \ is opened, send a message to the server\n  socket.onopen = function () {\n \
    \   if (socket.readyState == 1) {\n      console.log('Connection Opened');\n \
    \     socket.send('Hey, send back whatever I throw at you!'); \n    }     \n \
    \ };\n\n  // Receive messages from the server\n  socket.onmessage = function(e)\
    \ {\n    console.log('Socket server said: ' + e.data);\n  };\n\n  socket.onclose\
    \ = function() {\n    if (socket.readyState == 2) console.log('Connection Closed');\n\
    \  };\n\n  // log errors\n  socket.onerror = function(err) {\n    console.log('An\
    \ Error Occurred ' + err);\n  };\n\n}\nelse {\n  // sadly, no WebSockets!\n}\n\
    ```\n\n### Note: Using Modernizr\n\nWith Modernizr, we can check for the browser\
    \ support of WebSockets this way:\n\n```\nif (Modernizr.websockets) {\n  // proceed\n\
    }\nelse{\n  // No WebSocket\n}\n```\n\nSo, you start by passing the socket server\
    \ URL to the `WebSocket` constructor. The constructor also accepts an optional\
    \ second parameter, which is an array of sub-protocols. This parameter defaults\
    \ to an empty string.\n\nNext, we attach different callbacks for different events.\
    \ As soon as the connection opens, the `onopen` event is fired and our callback\
    \ executes. You can send a simple message to the server by calling `socket.send()`.\
    \ You can also send binary data, which we’ll see in the next section.\n\nSimilarly,\
    \ the server can also send us messages. In that case, the `onmessage` callback\
    \ fires. At the moment, the server sends us back whatever we send to it, and we\
    \ simply log the message received. But you can always capture the message and\
    \ dynamically update your page with it.\n\nJust paste the code in an HTML file\
    \ and run it ― you’ll be delighted to see the server’s response!\n\n### Note:\
    \ The `readyState` Property\n\nThe variable `socket` in the aforementioned code\
    \ has a property called `readyState` indicating the status of the connection:\n\
    \n*   0 = connecting\n\n*   1 = opened\n\n*   2 = closed\n\n## Sending Binary\
    \ Data\n\nYou can also send binary data to the server. The following program sends\
    \ the image drawn on `canvas` to a sample WebSocket:\n\n```\n// you need to create\
    \ this socket server\nvar connection=new WebSocket('ws://localhost:8080');\n\n\
    connection.onopen = function() {\n\n  // get an image from canvas\n  var image\
    \ = canvas2DContext.getImageData(0, 0, 440, 300);\n  var binary_data = new Uint8Array(image.data.length);\n\
    \  for (var i = 0; i < image.data.length; i++) {\n    binary_data[i] = image.data[i];\n\
    \  }\n  connection.send(binary_data.buffer); // send the data\n\n}\n```\n\nIn\
    \ the code, we read the image from the HTML page and create an `ArrayBuffer` to\
    \ contain the binary data. Finally, `connection.send()` actually sends the data.\n\
    \n### Note: Using Blobs\n\nWe can also send the binary data as a blob. For example,\
    \ you could create a file uploader and read the files through `querySelector()`.\
    \ Then you can send those files with the help of `connection.send()`. HTML5Rocks\
    \ has an [excellent tutorial on WebSockets](http://www.html5rocks.com/en/tutorials/websockets/basics/)\
    \ that also covers sending binary data to the server through blobs.\n\n## Sample\
    \ Server Implementations"
