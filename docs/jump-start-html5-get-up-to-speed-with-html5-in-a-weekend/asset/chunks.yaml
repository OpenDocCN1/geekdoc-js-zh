  trans: '


    在这些示例中，我们使用的是相对 URL。我们也可以跨源缓存资源，但细节会稍微复杂一些。在最近版本的 Firefox 中，当它们共享相同的方案或协议（`HTTP`
    或 `HTTPS`）时，你可以跨源缓存资源。例如，你可以将 `http://sitepoint.com` 的资源缓存到 `http://example.com`
    上。你也可以将 `https://secure.ourcontentdeliverynetwork.com` 的资源缓存到 `https://thisisasecureurl.com`
    上。在这些情况下，协议是相同的。你不能做的是通过 HTTP 缓存 HTTPS URL，反之亦然。当前版本的 IE、Safari、Chrome 和 Opera
    允许无论方案如何进行跨源缓存。将 `http://sitepoint.com` 的资源缓存到 `https://thisisasecureurl.com`
    是可以运行的。然而，这种行为可能会改变，因为它不符合规范。不要依赖它。尽管如此在写本文时，Chrome Canary ― 版本 33 ― 不允许从 HTTP
    到 HTTPS 的跨源请求，反之亦然。


    ### 使用 `NETWORK:` 强制网络检索


    `NETWORK:` 允许我们明确告诉浏览器它应该始终从服务器检索特定的 URL。例如，你可能希望一个同步数据的 URL 成为一个 `NETWORK` 资源。让我们更新之前的
    manifest 文件以包含一个 `NETWORK` 节：


    ```

    CACHE MANIFEST


    # 这些文件将被保存到本地。这一行是注释。

    js/todolist.js

    css/style.css


    NETWORK:

    sync.cgi

    ```


    任何对 `sync.cgi` 的请求将通过网络发出。如果用户离线，该请求将失败。


    你还可以在网络部分使用通配符——或 `*` 字符。这告诉浏览器使用网络来获取任何在 `CACHE:` 部分中未显式列出的资源。部分路径配合通配符同样有效。


    ### 为不可用的 URL 指定替代内容


    使用 `FALLBACK:` 节头部可以让你指定当 URL 因为连接问题而不可用时应该显示什么内容。让我们更新 manifest 以包含一个回退（fallback）节：


    ```

    CACHE MANIFEST


    # 这些文件将被保存到本地。这一行是注释。

    CACHE:

    js/todolist.js

    css/style.css


    FALLBACK:

    status.html offline.html

    ```


    回退部分的每一行都必须遵循 `<requested file name> <alternate file name>` 模式。在这里，如果用户在离线时请求
    `status.html` 页面，他们将看到 `offline.html` 中的内容。


    ### 指定设置


    到目前为止，只有一个设置是可以使用 `SETTINGS:` 节头部设置的，那就是缓存模式标记。缓存模式有两个选项：`fast` 和 `prefer-online`。`fast`
    设置*始终*使用本地副本，而 `prefer-online` 则在网络可用时使用网络获取资源。


    `fast` 模式是默认设置。你实际上不需要在 manifest 中设置它。这样做不会导致任何解析错误，但没有理由要添加它。


    要覆盖此种行为，你*必须*使用 `prefer-online`，并将此添加到你的 manifest 文件的末尾：


    ```

    SETTINGS:

    prefer-online


    NETWORK:

    *

    ```


    然而，这里有一个注意事项。主文件——即*拥有* manifest 的文件——仍然将从本地存储中检索。其他资源将从网络获取。


    ### 将 Cache Manifest 添加到你的 HTML 中


    现在是 AppCache 最简单的部分：将其添加到你的 HTML 文档中。这需要在你的 `<html>` 标签中添加一个 `manifest` 属性：


    ```

    <html manifest="todolist.appcache">

    ```


    当页面加载时，浏览器将下载并解析此 manifest。如果 manifest 是有效的，浏览器还将下载你的资源。


    你需要将 manifest 添加到每一个希望离线可用的 HTML 页面。将其添加到 `http://example.com/index.html` 不会让
    `http://example.com/article.html` 可离线。


    ### 注意：验证你的 Manifest 语法


    为了避免 manifest 文件出现问题，请使用验证器验证其语法是否正确，例如 [Cache Manifest Validator](http://manifest-validator.com/)。如果你熟悉
    Python 和命令行，可以尝试 [Caveman.](https://pypi.python.org/pypi/caveman)。


    ### 托管 Cache Manifest


    为了让浏览器识别并将你的 cache manifest 视为 manifest，它必须带有 `Content-type: text/cache-manifest`
    标头提供服务。最佳实践是使用 `.appcache` 扩展（例如 manifest.appcache 或 offline.appcache），尽管这并非严格必要。没有这个标头，大多数浏览器将忽略该
    manifest。请查阅你的服务器文档（或咨询你的网络托管支持团队）来了解如何设置它。


    ### 避免应用程序缓存的“陷阱”


    如所述，AppCache 默认使用本地文件副本。这产生了更快速响应的用户界面，但也产生了两个初看之下*非常*令人困惑的问题：


    *   未缓存的资源在缓存页面上不会加载，即使在在线状态下也是

    *   更新资源不会更新缓存


    没错：无论是否有新文件版本，即使使用户连接到网络，浏览器都会使用本地存储的文件。


    ### 解决陷阱 #1：从缓存文档中加载未缓存的资源


    Application Cache 设计用于将 Web 应用程序变成自包含的实体。因此，它不智能地假设除非我们在 cache manifest 中另有说明，否则所有引用的资源都已缓存。浏览器将首先查找缓存，如果它们无法找到引用的资源，这些引用就会失效。


    为了解决这个问题，请在你的 manifest 文件中包含 `NETWORK:` 节头部，并使用通配符（`*`）。通配符告诉浏览器，如果可用，则从网络下载任何相关的未缓存文件。


    ### 解决陷阱 #2：更新缓存


    遺憾的是，如果你需要向用户推送更新，你不能简单地覆盖服务器上的现有文件。记住，AppCache 总是优先考虑本地副本。


    为了刷新缓存中的文件，你需要更新 cache manifest 文件。当文档加载时，浏览器会检查 manifest 是否已更新。如果已更新，浏览器将重新下载
    manifest 中列出的所有资源。


    更新 manifest 的最好方法是设置并使用版本号。更改资源名称或添加注释也有效。当浏览器遇到修改后的 manifest 时，它将下载指定的资源。


    尽管缓存会更新，但新文件只有在应用程序重新加载时才会被使用。你可以通过在 `updateready` 事件处理程序内部使用 `location.reload()`
    来强制应用程序刷新。


    ### 缓存陷阱 #3：坏一处，坏全盘


    使用 AppCache 时需要注意的另一点：任何资源失败都会导致整个缓存过程失败。“404 Not Found”、“403 Forbidden”和“500
    Internal Server Error”响应都会导致资源失败，还可能导致缓存过程中服务器连接被中断。


    当浏览器遇到这些错误中的任何一个时，`applicationCache` 对象将触发 `error` 事件并停止下载所有内容。我们当然可以监听此事件；但到目前为止，没有浏览器在错误消息中包含受影响的
    URL。我们能做的最好就是提示用户发生了错误。


    Safari、Opera 和 Chrome *确实*会在开发者控制台中报告失败的 URL。


    ### 测试对 Application Cache 支持


    要测试支持情况，请使用以下代码：


    ```

    var hasAppCache = window.applicationCache === undefined;

    ```


    如果你打算使用多个 HTML5 特性，可能也想尝试 [Modernizr](http://modernizr.com/) 来检查所有特性。


    除非你的应用程序通过编程与缓存交互，否则没有必要使用 JavaScript 测试 AppCache 支持。在不支持 Application Cache 的浏览器中，manifest
    属性将被忽略。


