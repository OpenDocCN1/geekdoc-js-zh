    # `input type="number"`


    `number` 类型是另一种用于数值输入值的表单控件类型。根据规范，任何浮点数都是有效值。但在实践中，情况要稍微复杂一些。


    默认情况下，`number` 输入类型只接受整数。例如，输入 `4.2776` 将导致符合标准的浏览器产生验证错误，如图 4.6 所示。


    ![输入浮点数时的错误](img/numbertype10.png)


    图 4.6. 输入浮点数时的错误


    为了接受浮点数，我们需要设置 `step` 属性。在带有增量控制控件的浏览器中，如图 4.7 所示，`step` 控制了每次点击箭头时数字增加或减少的幅度。


    ![带有步长的小数值](img/numbertypechrome.png)


    图 4.7. 带有步长的小数值


    例如，当 `step="0.5"` 时，`1.5` 和 `9` 都是有效值，但 `8.1` 不是。然而，当 `step=".01"` 时，`8.1`、`1.5`
    和 `9` 都是有效值，`3.14` 也是如此。某种程度上，你可以使用 `step` 属性来控制数字的浮点精度。


    ```

    <!-- 数字增加 0.5 -->

    <input type="number" name="num" value="" step=".5">


    <!-- 数字增加 .01；精度精确到小数点后两位 -->

    <input type="number" name="num" value="" step=".01">


    <!-- 数字增加 .001；精度精确到千分位 -->

    <input type="number" name="num" value="" step=".001">

    ```


    为了让我们的 `4.2776` 值成为一个被接受的值，我们需要将 `step` 属性设置为 `.001`。遗憾的是，这种变通方法在 Opera 12 及更早版本中不起。


    ## 日期和时间输入


    最后，让我们来看日期和时间输入类型。共有六种，列举如下：


    - `datetime`: 选择全局 UTC 字符串的日期和时间

    - `datetime-local`: 在用户的时区内选择日期和时间

    - `date`: 选择带有午夜时间组件的单一日期

    - `month`: 选择月份和年份

    - `week`: 选择周

    - `time`: 选择小时和分钟格式的时间


    支持这些类型的浏览器将显示时间选择器小部件（针对 `time`）、日期选择器（针对 `date`、`month`、`week`）或两者兼备（`datetime`
    和 `datetime-local`），如图 4.8 所示。


    ![Opera 中的时间选择器](img/datetime12.png)


    图 4.8. Opera 中的时间选择器


    `datetime` 和 `datetime-local` 输入类型有细微的区别。前者将所有输入视为 UTC（协调世界时）日期和时间。浏览器可能会向用户指示这是
    UTC 输入——如 Opera 12 版本那样——或者它可能会显示本地化界面，并在后台转换时间。


    Chrome 和 Opera 15 支持除 `datetime` 以外的所有类型。Safari 6.0 版本、Firefox 25 版本和 Internet
    Explorer 10 版本不支持这些类型中的任何一种。


    ## `input type="color"`


    通过 `color` 输入类型，我们可以为应用程序添加原生的颜色选择器。颜色选择器的外观取决于浏览器和操作系统。但在所有情况下，只有六位十六进制颜色值是有效的。这意味着你不能像在
    CSS 中那样指定带透明度的颜色。`color` 类型的默认值为 `#000000`。


    遗憾的是，`color` 输入类型仅受 Chrome 和 Opera 11 和 12 支持（但不支持 15.0 版本）。它还没有完全成熟，但为了完整性起见在此提及。


    # 第 5 章 基础：多媒体、音频和视频


    HTML5 最大的变化可能是它的多媒体能力。HTML5 带来了原生的音频和视频，并几乎取代了旧 Web 的插件。我之所以说“几乎”，是因为浏览器厂商尚未对网络音频和视频的默认格式达成一致。


    我们将在本章稍后部分讨论跨浏览器支持。首先，让我们看看在网页上添加视频所需的最少条件：一个 `video` 标签和一个 `src` 属性。


    ```

    <video src="path_to/file.video"></video>

    ```


    在 HTML5 中，该闭合标签是必须。如果你使用的是 XHTML 语法，可以将其自闭合，例如 `<video src="path_to/file.video"
    />`。`audio` 元素几乎相同。只需要开启的 `audio` 标签、一个 `src` 属性和一个闭合的 `</audio>` 标签。


    ```

    <audio src="path_to/file.audio"></audio>

    ```


    再次，如果我们使用 XHTML 语法，可以自闭合标签：`<audio src="path_to/file.audio" />`。


    ## 添加控件


    遗憾的是，如图 5.1”所示，我们上面的代码片段除了添加媒体文件外，什么也没做。我们无法播放视频，因为它会停留在第一帧。我们甚至不知道页面上有音频。


    ![没有控制控件的 Firefox 视频示例，来自 Blender Foundation 的图片](img/videocontrols.png)


    图 5.1. 没有控制控件的 Firefox 视频示例


    我们需要一些控件：也许是播放按钮和一个可拖动的进度条。我们可能还需要一个显示已播放内容的计时器以及音量控制。幸运的是，浏览器内置了这些功能。我们可以通过添加
    `controls` 属性来激活它们。


    ```

    <video src="path_to/file.video" controls>

    ```


    `controls` 属性告诉浏览器我们希望该媒体提供播放控件。在大多数浏览器中，这意味着用户将看到播放/暂停按钮、时间指示和音量控制，如图 5.2 所示。播放器可能还会包含允许用户在全屏和原始尺寸之间切换的按钮。这些默认控件的外观取决于浏览器。


    ![带有控制控件的 Firefox 视频示例，来自 Blender Foundation 的图片](img/videocontrol.png)


    图 5.2. 带有控制控件的 Firefox 视频示例，来自 Blender Foundation 的图片


    `controls` 是另一个空属性的示例。如果我们使用 XML 语法，也可以使用 `controls="true"` 或 `controls="controls"`。添加
    `controls` 属性无论其值为何，都会让控件可见。使用 `controls=false` 则不会隐藏它们。


    ## 自动播放和循环媒体


    也许我们想使用一段短视频作为背景元素。我们可能想创建一个“艺术装置”体验，让视频自动播放并循环。这不是问题。我们可以通过在视频或音频标签上添加 `autoplay`
    和 `loop` 属性来实现。


    ```

    <video src="path_to/file.video" autoplay loop></video>


    <audio src="path_to/file.audio" autoplay loop></audio>

    ```


    使用 `autoplay`，媒体将在浏览器接收到足够数据后开始播放。当音频或视频结束时，`loop` 告诉浏览器从头重新媒体文件。


    ### 注意：谨慎使用自动播放


    某些音频和视频听起来可能非常糟糕，或者只是令人尴尬。帮你的观众忙：使用 `muted` 属性静音自动播放的媒体。


    ```

    <video src="annoying.video" autoplay loop muted></video>

    ```


    '
- fmt: "\n## Video-only Attributes\n\nAlthough most attributes that apply to the `video`\
    \ tag also apply to `audio`, a few—related to visual display—do not:\n\n- `height`:\
    \ Sets the height of the video player.\n- `width`: Sets the width of the video\
    \ player.\n- `poster`: Specifies an image to display prior to video playback.\n\
    \n### Place Holding with `poster`\n\nA poster image acts as a placeholder for\
    \ a video. It’s typically a still image from the video, though it could be a company\
    \ logo, title screen, icon, or some other image. Once the page loads, visitors\
    \ will see the poster image until the video begins playback.\n\nTo add a poster\
    \ image, add a `poster` attribute. Set its value to the path of an image. Most\
    \ image formats work for poster images, although Internet Explorer sometimes struggles\
    \ with SVG files.\n\n```\n<video src=\"path_to_file.video\" poster=\"path_to_poster_image.jpg\"\
    >\n</video>\n```\n\nBe careful with the size of your poster image. Ideally, it\
    \ should be the same dimensions as your video. Initially the video player dimensions\
    \ will match the poster image dimensions. Then browser will resize the player\
    \ once it has determined the intrinsic height and width of the video. Setting\
    \ an explicit height and width for your video player prevents this resizing.\n\
    \n### Controlling Video Dimensions\n\nWhether you use a poster image or not, explicitly\
    \ setting the height and width of your player prevents the browser from having\
    \ to redraw the page once the video loads. One way to do this, of course, is to\
    \ include the `height` and `width` attributes with the `video` tag. Both attributes\
    \ accept percentages, which are useful when building a responsive or fluid layout.\n\
    \n```\n<video src=\"path_to_file.video\" poster=\"path_to_poster_image.jpg\" \n\
    width=\"100%\" height=\"100%\"></video>\n```\n\nYou may also set the height and\
    \ width of the video player using CSS.\n\n```css\nvideo {\n  width: 960px;\n \
    \ height: 540px;\n}\n```\n\nIn this example, we’ve used pixels. For responsive\
    \ layouts, you may prefer to use viewport percentage units: `vh` and `vw`. Any\
    \ valid CSS length unit outlined in the [CSS Values and Units Module Level 3](http://www.w3.org/TR/css3-values/)\
    \ is acceptable. Using CSS to set the video player’s dimensions will override\
    \ any `width` and `height` attributes applied to the element itself.\n\n## Bandwidth\
    \ Use and Playback Responsiveness\n\nMost browsers download a portion of an audio\
    \ or video file as the page loads. Typically this snippet of media contains the\
    \ file’s metadata, such as duration and dimensions, and a few seconds of the playable\
    \ data. When the user initiates playback, the browser makes a second request for\
    \ the rest of the file.\n\nEach of these requests places an additional demand\
    \ on the server, whether or not your visitor interacts with the media file. You\
    \ can change this behavior with the `preload` attribute. Set it to one of three\
    \ possible values:\n\n- `metadata` tells the browser that it’s okay to download\
    \ a portion of the file.\n- `auto` tells the browser that it’s okay to download\
    \ as much of the video as it wants.\n- `none` tells the browser not to download\
    \ anything until the user requests it.\n\nUsing `preload=\"auto\"` provides the\
    \ fastest playback for the user. Browsers will download as much of the resource\
    \ as it needs to provide consistent playback. For shorter clips, that could be\
    \ the entire file.\n\nWith `preload=\"none\"`, users could experience a significant\
    \ lag between pressing the play control and media playback. However, this option\
    \ will lead most browsers to download the least amount of data.\n\n### Note: Set\
    \ Explicit Video Height and Width When Using `preload=\"none\"`\n\nWith `preload=\"\
    none\"`, you may want to set an explicit width and height either in the video\
    \ element itself, or using CSS. Otherwise, you may trigger a page reflow when\
    \ the video loads and begins to play.\n\nUsing `preload=\"metadata\"` is a bit\
    \ of a compromise between `auto` and `none`. In most browsers, there won’t be\
    \ a lag between the user requesting playback and the action, as you often get\
    \ with `preload=\"none\"`. But because the browser pre-loads a smaller portion\
    \ of the media file, playback may not instantaneous as with `preload=\"auto\"\
    `.\n\n## Cross-browser Audio and Video\n\nThis almost sounds to good to be true,\
    \ doesn’t it? Native audio and video without a plug-in! Not so fast. There is\
    \ one thing is holding us back: file format support. Browser vendors disagree\
    \ about whether there should be a default multimedia codec, and if so, which one.\n\
    \nApple and Microsoft have decided to support H.264/MPEG-4 video and MPEG-3 audio\
    \ in their browsers (Safari and Internet Explorer, respectively). H.264 is a proprietary,\
    \ high-definition format for displaying video, usually within an MPEG-4 container.\
    \ MPEG-3 is an audio compression format. Because these formats are proprietary,\
    \ browser developers must pay licensing fees if they’d like to add support for\
    \ these formats to their software.\n\nMozilla and Opera are opposed H.264 and\
    \ MPEG-3 largely because of those royalty fees. Instead their browsers (Firefox\
    \ and Opera) support open source codecs such as Ogg Theora and WebM. Firefox does\
    \ support H.264 and MPEG-3 for mobile devices, but not for desktop and laptops.\
    \ Internet Explorer supports also other codecs if the user has installed them.\
    \ Google Chrome, to its credit, supports all of the above.\n\nThe Great Codec\
    \ Divide means that cross-browser video requires one of two approaches:\n\n1.\
    \ Encode only an H.264 version of the video and use a Flash video container as\
    \ a fallback to serve the video to browsers that don’t support H.264 natively.\n\
    2. Encode the video in multiple formats, and let the browser choose which to play.\n\
    \nThe first option is best if you need to support older browsers. Internet Explorer\
    \ 8, for example, lacks support for audio and video. JavaScript libraries such\
    \ as [Video.js](http://www.videojs.com/) and [audio.js](http://kolber.github.io/audiojs/)\
    \ use this strategy.\n\nThe second option is better if you do not need to support\
    \ older browsers. It will work for desktop and mobile device browsers. We’ll use\
    \ this approach here.\n\n### Note: Transcoding Software\n\nTo transcode videos\
    \ from one format to another, try [FFMpeg](http://www.ffmpeg.org/), a command-line\
    \ tool, or [Miro Video Converter](http://www.mirovideoconverter.com/). Both are\
    \ free and open source, with Mac OS X, Windows, and Linux builds available.\n\n\
    ### Using Multiple Video or Audio Files\n\nTo offer multiple file formats, we\
    \ need to use the `source` element: one `<source>` tag for each file format. Attributes\
    \ such as `autoplay`, `loop`, and `controls` should still be a part of the `<video>`\
    \ or `<audio>` tag. But our `src` attribute must move to our `<source>` tags.\n\
    \n```html\n<audio controls>\n  <source src=\"path_to_mpeg3_file.mp3\">\n  <source\
    \ src=\"path_to_ogg_file.ogg\">\n</audio>\n```\n\nWe can optionally add a `type`\
    \ attribute to each source tag. At the very least, `type` should contain a valid\
    \ MIME type. But it may also include a codec as shown below.\n\n```html\n<audio\
    \ controls>\n  <source src=\"mpeg3_file.mp3\" type=\"audio/mpeg\"> \n  <source\
    \ src=\"ogg_vorbis_file.ogg\" type=\"audio/ogg; codecs=vorbis\">\n  <source src=\"\
    ogg_flac_file.oga\" type=\"audio/ogg; codecs=flac\">\n</audio> \n```\n\n### Warning:\
    \ `preload=none` on Safari\n\nUsing `preload=none` with multiple sources may prevent\
    \ Safari from downloading the correct file. Safari 6.0.5 will ignore any file\
    \ besides the first one when `preload=none`. Even if the user presses play, Safari\
    \ will not load another video source. Avoid this by listing a Safari-compatible\
    \ source first. Otherwise set the value of `preload` to `metadata` or `auto`.\n\
    \nEach browser will download the first available file that it's capable of playing.\n"
