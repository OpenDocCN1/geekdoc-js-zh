    \n# Chapter 4\n\nBasics: HTML5 Forms\n\nHTML5 forms are a leap forward from those\
    \ in previous versions of HTML. We now have a half dozen new input states or types,\
    \ such as `range` and `url`; we have new attributes that let us require fields,\
    \ or specify a particular format; we have an API that lets us constrain and validate\
    \ input; and finally, we have new form elements, such as `datalist`, that let\
    \ us create engaging user interfaces without heavy JavaScript libraries or plugins.\n\
    \nUnfortunately, not every browser supports all of these features just yet. For\
    \ now we still need to use JavaScript libraries, and [**polyfills**](http://remysharp.com/2010/10/08/what-is-a-polyfill/)\
    \ (downloadable code which provides facilities that are not built into a web browser)\
    \ as fall back strategies.\n\nThe best way to understand HTML5 forms is to build\
    \ one. Let’s try building a form that collects story suggestions for the HTML5\
    \ News-Press site from the previous chapter. We’ll need to gather the following\
    \ information with our form:\n\n*   Name\n\n*   City of residence\n\n*   Email\
    \ address\n\n*   A telephone number\n\n*   A URL where we can learn more (if there\
    \ is one)\n\n*   The actual story idea\n\nAt the very least, we’ll want to require\
    \ the user to provide a first name, email address, and their story idea.\n\n##\
    \ Starting an HTML5 Form\n\nTo build our HTML form, we’ll need to start with an\
    \ opening `form` element tag. Because we want to submit this form to a server-side\
    \ processing script, we’ll need to include two attributes.\n\n*   `action`: the\
    \ URL of the script\n\n*   `method`: the HTTP request method to use, sometimes\
    \ `GET`, but usually `POST`\n\nSince this could be a lengthy message, we’ll use\
    \ `POST` rather than `GET`. `GET` is better suited to short key-value pairs, such\
    \ as search boxes. Other HTTP methods, such as `PUT`, `HEAD`, or `DELETE` may\
    \ also be used with forms, but most of the time you’ll use `GET` or `POST`.\n\n\
    It's worth noting here that `application/x-www-form-urlencoded` is the default\
    \ content type value for form data. We could also explicitly set it using the\
    \ `enctype` attribute, but we don’t have to.\n\nWe could also set our `enctype`\
    \ attribute to `multipart/form-data` as shown below:\n\n```\n<form action=\"/script\"\
    \ method=\"post\" enctype=\"multipart/form-data\">\n```\n\nEither is fine for\
    \ sending text. If we wanted to upload files, however, we would need to use `enctype=\"\
    multipart/form-data\"`.\n\n## The `input` Element\n\nThe `input` element is the\
    \ most commonly used element for creating form controls. An `input` tag typically\
    \ includes the following attributes.\n\n*   `name`: the name of the field\n\n\
    *   `type`: indicates what kind of input control to display\n\n*   `id`: a unique\
    \ identifier for the field\n\n*   `value`: sets a default value for the field\n\
    \nOf these, only `name` is required in order for our form to send data. Each `name`\
    \ attribute becomes a key or field name for our server-side script. That said,\
    \ in most cases, you'll also want to set the `type` attribute.\n\nThere are about\
    \ a dozen possible values for the `type` attribute, most of which we’ll cover\
    \ in this chapter. Each type value corresponds to a different kind of user interface\
    \ control and set of validation constraints. The most liberal value for the `type`\
    \ attribute—and the default state of the `input` element—is `text`.\n\n## Collecting\
    \ Names\n\nPeople names and place names are usually a mix of alphanumeric characters,\
    \ spaces, and punctuation marks. For this reason, we’ll use the `text` input state\
    \ for those fields. Let’s add form fields for the letter writer’s name and city\
    \ of residence. Since we want to require the user to provide a name, we’ll also\
    \ add a `required` attribute.\n\n```\n<p>\n  <label for=\"your_name\">Your name:</label>\n\
    \  <input type=\"text\" name=\"your_name\" id=\"your_name\" required>\n</p>\n\n\
    <p>\n  <label for=\"city\">City of residence:</label>\n  <input type=\"text\"\
    \ name=\"city\" id=\"city\">\n</p>\n```\n\n### Note: id and name attributes\n\n\
    The `id` attribute may, but *does not have to* be, the same as the `name` attribute.\n\
    \n### Using Form Labels\n\nWe’ve added an unfamiliar element here: `label`. The\
    \ `label` element in an HTML form works just like the label on a paper form. It\
    \ tells the user what to enter in the field. In order to associate a label with\
    \ a form control, the `label` must have a `for` attribute that matches the `id`\
    \ attribute of its form field. Or you could place the form control inside of the\
    \ `label` element.\n\n```\n<label>Your name:\n  <input type=\"text\" name=\"your_name\"\
    \ id=\"your_name\" required>\n</label>\n```\n\nUsing the `for` and `id` attributes,\
    \ however, offers a little more flexibility for page layouts.\n\nWhy not just\
    \ use text without wrapping it in a `label` element? Using `label` increases the\
    \ usability of the web for those with physical or cognitive challenges. Screen-reading\
    \ software, for example, uses labels to help low-vision users in filling out forms.\
    \ It’s an accessibility feature that’s baked into HTML.\n\n## Requiring Form Fields\n\
    \nOne of the great improvements of HTML5 over previous versions is native form\
    \ validation. By adding the `required` attribute, we are asking the browser to\
    \ make sure this field has been filled out before submitting the form.\n\n###\
    \ Note: Empty Attributes\n\nThe `required` attribute is an example of an empty\
    \ attribute. Its presence or absence determines whether that value is set."
