  trans: "\n\n来自 API 的数据是 JSON 格式的。SSE 要求你在数据前面加上 `data:`，并用 `\\n\\n` 标记结束。如果你漏掉了这些点，`EventSource`\
    \ 将无法正常工作，并且请记住也要注意请求头（headers）。循环的原因是为了保持连接开启。如果没有循环，浏览器将在五秒左右尝试打开一个新连接。\n\n\
    由于我们在 PHP 脚本中持续循环，脚本的执行时间可能会超过 PHP 的 `max_execution_time`。你还可能因为 Apache 用户连接限制而遇到问题。对于这类实时应用，`Node.js`\
    \ 等技术可能是是更好的选择。\n\n这里是显示数据的 HTML 页面：\n\n`jokes.html`\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>一个随机笑话网站</title>\n<script>\nif(typeof(EventSource)!==\"\
    undefined\"){\n  var eventsource=new EventSource('source.php');\n  eventsource.addEventListener('message',\
    \ function(event) {\n    document.getElementById(\"container\").innerHTML = \n\
    \    JSON.parse(event.data).value.joke + '<br/>' +\n    document.getElementById(\"\
    container\").innerHTML;\n  },false);\n}\nelse console.log(\"No EventSource\");\n\
    </script>\n</head>\n<body>\n\n  <div id=\"container\"></div>\n\n</body>\n</html>\n\
    ```\n\n## 调试\n\n如果你遇到问题，可以使用浏览器的 JavaScript 控制台来调试你的应用程序。在 Chrome 中，可以通过“菜单 >\
    \ 工具 > JavaScript 控制台”打开控制台。在 Firefox 中，可以通过“菜单 > 网页开发者工具 > Web 控制台”访问相同的内容。如果事件流没有按预期工作，控制台可能会报告错误（如果有任何的话）。\n\
    \n你需要特别注意以下几点：\n\n- 从服务器发送头部 `Content-Type: text/event-stream` 的头部\n- 分别用 `data:`\
    \ 和 `\\n\\n` 标记内容的开始和结束\n- 注意同源策略（same-origin policies）\n\n## 结论\n\n服务器发送事件（SSE）解决了我们之前为了实现实时更新功能而使用的长轮询黑科技。以下是你可能想要实现的几个简单项目：\n\
    \n- 创建一个从服务器端更新的时钟页面。\n- 借助 Twitter API 读取并显示最新的推文。\n- 使用 Flickr API 获取随机照片并更新页面。\n\
    \nMozilla 开发者网络提供了一个[学习更多 SSE 的良好资源。](https://developer.mozilla.org/en-US/docs/Server-sent_events)在这里，你还可以找到一些演示应用以及针对旧浏览器的补丁程序（polyfills）。\n\
    \n# 第 30 章\n\n## APIs：WebSocket API\n\n我认为 WebSockets 是 HTML5 中提供的最酷的 API 之一。当你希望客户端通过持久连接与服务器通信时，WebSocket\
    \ API 的真实优势就会显现出来。这意味着一旦连接建立，服务器和客户端就可以随时互相发送消息。客户端以前向服务器发送消息并等待服务器响应的日子已经过去了。显然，WebSocket\
    \ 消除了对长轮询的需求！如果你想创建一个客户端和服务器持续通信的实时应用，这个 API 非常有用。例如，你可以使用 WebSocket 构建聊天系统、多玩家\
    \ HTML5 游戏以及类似的应用。\n\n### 注意：WebSocket 与服务器发送事件 (SSEs)\n\nWebSockets 和 SSE 可以实现类似的任务，但它们是不同的。在\
    \ SSE 的情况下，服务器仅在有新更新时才向客户端推送数据。在 WebSocket 的情况下，客户端和服务器都会互相发送数据；准确地说，通信是双向的（如果你喜欢更技术性的术语，那就是全双工）。\n\
    \n要使用 WebSocket，你需要一个支持 WebSocket 的服务器。嗯，那是棘手的部分。别担心！有针对不同语言的 WebSocket 实现。我很快就会介绍这些内容。\n\
    \n此外，你应该始终记住，WebSockets 允许跨源通信。因此，你应该只连接到你信任的客户端和服务器。\n\n## JavaScript API\n\n\
    让我们快速尝试一下。[WebSocket.org](http://www.websocket.org/) 的开发者在 `ws://echo.websocket.org`\
    \ 创建了一个演示专用的 WebSocket 服务器。我们可以迅速连接到它并开始与它交换消息。\n\n### 注意：`ws://` 协议\n\n`ws://`\
    \ 是一种类似于 `http://` 的协议，不同之处在于它用于指定 WebSocket 服务器的 URL。\n\n首先，让我们看看如何使用 JavaScript\
    \ API 连接到简单的 WebSocket 服务器。之后，我将向你展示如何创建自己的 WebSocket 服务器并让其他人与你连接。\n\n```\n//\
    \ 测试浏览器是否支持该 API\nif('WebSocket' in window) {\n\n  var socket = new WebSocket('ws://echo.websocket.org');\n\
    \n  if (socket.readyState == 0) console.log('Connecting...');\n\n  // 只要连接建立，立即向服务器发送消息\n\
    \  socket.onopen = function () {\n    if (socket.readyState == 1) {\n      console.log('Connection\
    \ Opened');\n      socket.send('Hey, send back whatever I throw at you!'); \n\
    \    }     \n  };\n\n  // 接收来自服务器的消息\n  socket.onmessage = function(e) {\n   \
    \ console.log('Socket server said: ' + e.data);\n  };\n\n  socket.onclose = function()\
    \ {\n    if (socket.readyState == 2) console.log('Connection Closed');\n  };\n\
    \n  // 记录错误\n  socket.onerror = function(err) {\n    console.log('An Error Occurred\
    \ ' + err);\n  };\n\n}\nelse {\n  // 没有 WebSocket\n```\n\n### 注意：使用 Modernizr\n\
    \n使用 Modernizr，我们可以这样检查对 WebSocket 的支持：\n\n```\nif (Modernizr.websockets) {\n\
    \  // 继续\n}\nelse{\n  // 没有 WebSocket\n}\n```\n\n所以我们通过将 socket URL 传递给 `WebSocket`\
    \ 构造函数来开始。该构造函数还接受一个可选的第二个参数，即子协议。此参数默认为空字符串。\n\n接下来，我们为不同的事件附加回调。一旦连接打开，`onopen`\
    \ 事件就会触发并执行我们的回调。你可以通过调用 `socket.send()` 向服务器发送简单的消息。我们在下一节中将看到发送二进制数据。\n\n同样，服务器也可以向我们发送消息。在这种情况下，服务器会返回我们发送给它的内容，我们只需记录消息。但你总是可以捕捉消息并动态更新页面。\n\
    \n只需将代码粘贴到 HTML 文件并运行——你会看到服务器响应的！\n\n### 注意：`readyState` 属性\n\n上述代码中的 `socket`\
    \ 变量有一个名为 `readyState` 的属性，指示连接的状态：\n\n- 0 = 正在连接\n- 1 = 已开启\n- 2 = 已关闭\n\n##\
    \ 发送二进制数据\n\n你也可以向服务器发送二进制数据。以下程序将 `canvas` 画的图像发送到示例 WebSocket：\n\n```\n// 你需要创建这个\
    \ socket\nvar connection=new WebSocket('ws://localhost:8080');\n\nconnection.onopen\
    \ = function() {\n\n  // 从 canvas 获取图像\n  var image = canvas2DContext.getImageData(0,\
    \ 0, 440, 300);\n  var binary_data = new Uint8Array(image.data.length);\n  for\
    \ (var i = 0; i < image.data.length; i++) {\n    binary_data[i] = image.data[i];\n\
    \  }\n  connection.send(binary_data.buffer); // 发送数据\n\n}\n```\n\n在代码中，我们从 HTML\
    \ 页面读取图像并创建一个 `ArrayBuffer` 来包含二进制数据。最后，`connection.send()` 实际上发送了数据。\n\n服务器也可以发送二进制数据，我们在下一节看到。\n\
    \n### 注意：使用 Blob\n\n我们也可以以 blob 的形式发送二进制数据。例如，你可以创建一个文件上传器并通过 `querySelector()`\
    \ 读取文件。然后你可以借助 `connection.send()` 帮助发送这些文件。HTML5Rocks 有一个关于 WebSocket 的[优秀教程](http://www.html5rocks.com/en/tutorials/websockets/basics/)，也涵盖了如何通过\
    \ blob 向服务器发送二进制数据。\n\n## 示例服务器实现\n\n"
- fmt: "\nHere are a few WebSockets implementations available for different server-side\
    \ languages. You can choose a library based on your preferred language:\n\n* PHP:\
    \ [Ratchet](http://socketo.me/)\n* Node.js: [Socket.IO](https://github.com/learnboost/socket.io)\n\
    * Java: [jWebSocket](http://jwebsocket.org/)\n\nFor a complete overview of server-side\
    \ libraries, [Andrea Faulds maintains a comprehensive list.](http://ajf.me/websocket/#libs)\n\
    \nIt’s beyond the scope of this short book to discuss each of these libraries\
    \ in detail. But regardless of the implementation, they all offer a simple API\
    \ through which you can interact with your clients. For example, they all offer\
    \ a handler function to receive messages from the browser and you can also communicate\
    \ back with the client. I encourage you to grab a library for your favorite language\
    \ and play around with it.\n\nI have written an [extensive tutorial on WebSockets\
    \ on SitePoint.com.](http://www.sitepoint.com/introduction-to-the-html5-websockets-api/)\
    \ In that tutorial, I’ve shown how to implement a WebSockets-enabled server using\
    \ `jWebSocket` and let others connect to it.\n\n## Conclusion\n\nIf you want to\
    \ learn more about the WebSocket API, the following resources are worth checking\
    \ out:\n\n* [the WebSocket API](http://dev.w3.org/html5/websockets/)\n* [WebSocket\
    \ tutorial at Mozilla Ddeveloper Network](https://developer.mozilla.org/en-US/docs/WebSockets)\n\
    * [WebSocket demo apps](http://www.websocket.org/demos.html)\n\nHere are a few\
    \ use cases of the API:\n\n* creating a simple online chat application\n* updating\
    \ a page as new updates are available on the server and communicating back\n*\
    \ creating an HTML5 game with multiple users.\n\n# Chapter 31: APIs: The Cross-document\
    \ Messaging API\n\nThe `Cross-document Messaging API` in HTML5 makes it possible\
    \ for two documents to interact with each other without directly exposing the\
    \ DOM. Just imagine the following scenario: Your web page has an iframe that is\
    \ hosted by a different website. If you try to read some data from that iframe,\
    \ the browser will be very upset and may throw a security exception. It prevents\
    \ the DOM from being manipulated by a third-party document, thereby stopping potential\
    \ attacks such as [CSRF](http://en.wikipedia.org/wiki/Cross-site_request_for_gery)\
    \ or [cross-site scripting (XSS).](http://en.wikipedia.org/wiki/Cross-site_scripting)\
    \ But the `Cross-document Messaging API` never directly exposes the DOM. Instead,\
    \ it lets HTML pages send messages to other documents through a `message` event.\n\
    \nThe `Cross-document Messaging API` is useful for creating widgets and allowing\
    \ them to communicate with third-party websites. For example, let’s say that you\
    \ have a page that serves ads and you allow the end-users to embed this page in\
    \ their websites. In this case, you can let users personalize the ads or modify\
    \ the type of ads through the `Cross-document Messaging API`. Clients can send\
    \ messages to your page and you can receive those messages too.\n\n## The JavaScript\
    \ API\n\nThe `Cross-document Messaging API` revolves around a single method: `window.postMessage()`.\
    \ As its name suggests, this method allows you to post messages to a different\
    \ page. When the method is called, a `message` event is fired on the receiving\
    \ document side. Before moving further, it’s crucial to understand the properties\
    \ of the `message` event. There are three properties we’re interested in:\n\n\
    1. `data`: This holds the message being sent. You have already played with it\
    \ in previous chapters (remember calling `event.data` in SSEs?).\n2. `origin`:\
    \ This property indicates the sender document’s origin; i.e the protocol (scheme)\
    \ along with the domain name and port, something like `http://example.com:80`.\
    \ Whenever you receive a message, you should always, always, check that the message\
    \ is coming from a trusted origin. I will explain how to do that in the next section.\n\
    3. `source`: This is a reference to the sender’s window. After receiving a cross-document\
    \ message, if you want to send something back to the sender, this is the property\
    \ you’ll use.\n\n## Basic Usage\n\nYou send a message to another document by calling\
    \ `window.postMessage()`. This function takes two arguments:\n\n* `message`: the\
    \ actual message you want to send\n* `targetOrigin`: a simple string indicating\
    \ the target origin—an additional security feature (I’ll explain how this is useful\
    \ in the next section)\n\nThe code looks like the following:\n\n```\ntargetWindow.postMessage(message,\
    \ targetOrigin);\n```\n\nYou should note that `targetWindow` refers to the `window`\
    \ to which you want to send a message. It may be a window you just opened through\
    \ a call to `window.open()`, or it can also be the `contentWindow` property of\
    \ some iframe.\n\n### Note: A Reference to an Open Window\n\n`window.open('a URL')`\
    \ returns a reference to the opened window. You can always call `postMessage()`\
    \ on it.\n\nLet’s build a very simple example. Say that we have a parent page\
    \ that has an iframe inside it. The iframe’s `src` points to a third-party website\
    \ that provides us with a random image.\n\nThis is the page referenced by the\
    \ iframe in our parent page:\n\n*child.html*\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>A page that provides a random image</title>\n</head>\n<body>\n\
    \  <div id=\"container\">\n    <img\n      src=\"http://randomimage.setgetgo.com/get.php?key=2323232\"\
    \n      id=\"image\"\n    />\n  </div>\n</body>\n</html>\n```\n\nSo far, so good!\
    \ Now let’s have a look at our parent page:\n\n*parent.html*\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>The Parent Document</title>\n</head>\n  <body>\n\
    \    <iframe\n      src=\"child.html\"\n      height=\"500\" width=\"500\" id=\"\
    iframe\">\n    </iframe>\n    <br/>\n  </body>\n</html>\n```\n\nWhen you open\
    \ up the parent page, you can see the image coming from the page child.html. For\
    \ now, both parent.html and child.html are on the same server (`localhost)` for\
    \ testing purposes. But they should ideally be on different servers.\n\nBut we\
    \ don’t want to keep showing a static image to our users, nor reload our iframe.\
    \ It would be really great if we could ask the page child.html to reload its image\
    \ when a user hits a button on our parent page; i.e. parent.html.\n\nLet’s start\
    \ by adding a button to our parent page. We’ll also write a function that responds\
    \ to the click event and sends a message to child.html.\n\n*parent.html*\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>The Parent Document</title>\n</head>\n\
    \  <body>\n    <iframe\n      src=\"child.html\"\n      height=\"500\" width=\"\
    500\" id=\"iframe\">\n    </iframe>\n    <br/>\n    <button id=\"reloadbtn\">Reload</button>\n\
    \n    <script>\n      document.getElementById(\"reloadbtn\").\n      addEventListener(\"\
    click\", reload, false);\n\n      // reload handler\n      function reload(e)\
    \ {\n        // is cross-messaging supported?\n        if (window.postMessage)\
    \ {\n            document.getElementById('iframe').\n            contentWindow.postMessage(\n\
    \              Math.random()*1000, 'http://localhost'\n            );\n      \
    \  }\n        else {\n            console.log('postMessage() not supported');\n\
    \        }\n      }\n    </script>\n\n  </body>\n</html>\n```\n\n### Note: Using\
    \ Modernizr\n\nIf you’re using `Modernizr` to check browser compatibility, check\
    \ for the property `Modernizr.postmessage`.\n\nAs you can see, when a user clicks\
    \ on `reload` button our callback `reload()` executes. First, we ensure that `postMessage()`\
    \ is supported by the browser. Next, we call `postMessage()` on the iframe’s `contentWindow`.\
    \ The `contentWindow` property of an iframe is simply a reference to that iframe’s\
    \ window. Here, our message is a simple random number (we will see why shortly).\
    \ The second argument to `postMessage()` is `http://localhost`. This represents\
    \ the `targetOrigin` to which the message can be sent. The origin of the iframe’s\
    \ `src` and this argument must be same in order for `postMessage()` to succeed.\
    \ This is done so that other unintended domains cannot capture the messages. In\
    \ this case, if you pass something else as the `targetOrigin`, `postMessage()`\
    \ will fail.\n"
  raw: "Here are a few WebSockets implementations available for different server-side\
    \ languages. You can choose a library based on your preferred language:\n\n* \
    \  PHP: [Ratchet](http://socketo.me/)\n\n*   Node.js: [Socket.IO](https://github.com/learnboost/socket.io)\n\
    \n*   Java: [jWebSocket](http://jwebsocket.org/)\n\nFor a complete overview of\
    \ server-side libraries, [Andrea Faulds maintains a comprehensive list.](http://ajf.me/websocket/#libs)\n\
    \nIt’s beyond the scope of this short book to discuss each of these libraries\
    \ in detail. But regardless of the implementation, they all offer a simple API\
    \ through which you can interact with your clients. For example, they all offer\
    \ a handler function to receive messages from the browser and you can also communicate\
    \ back with the client. I encourage you to grab a library for your favorite language\
    \ and play around with it.\n\nI have written an [extensive tutorial on WebSockets\
    \ on SitePoint.com.](http://www.sitepoint.com/introduction-to-the-html5-websockets-api/)\
    \ In that tutorial, I’ve shown how to implement a WebSockets-enabled server using\
    \ jWebSocket and let others connect to it.\n\n## Conclusion\n\nIf you want to\
    \ learn more about the WebSocket API, the following resources are worth checking\
    \ out:\n\n*   [the WebSocket API](http://dev.w3.org/html5/websockets/)\n\n*  \
    \ [WebSocket tutorial at Mozilla Ddeveloper Network](https://developer.mozilla.org/en-US/docs/WebSockets)\n\
    \n*   [WebSocket demo apps](http://www.websocket.org/demos.html)\n\nHere are a\
    \ few use cases of the API:\n\n*   creating a simple online chat application\n\
    \n*   updating a page as new updates are available on the server and communicating\
    \ back\n\n*   creating an HTML5 game with multiple users.\n\n# Chapter 31\n\n\
    APIs: The Cross-document Messaging API\n\nThe **Cross-document Messaging API**\
    \ in HTML5 makes it possible for two documents to interact with each other without\
    \ directly exposing the DOM. Just imagine the following scenario: Your web page\
    \ has an iframe that is hosted by a different website. If you try to read some\
    \ data from that iframe, the browser will be very upset and may throw a security\
    \ exception. It prevents the DOM from being manipulated by a third-party document,\
    \ thereby stopping potential attacks such as [CSRF](http://en.wikipedia.org/wiki/Cross-site_request_forgery)\
    \ or [cross-site scripting (XSS).](http://en.wikipedia.org/wiki/Cross-site_scripting)\
    \ But the Cross-document Messaging API never directly exposes the DOM. Instead,\
    \ it lets HTML pages send messages to other documents through a `message` event.\n\
    \nThe Cross-document Messaging API is useful for creating widgets and allowing\
    \ them to communicate with third-party websites. For example, let’s say that you\
    \ have a page that serves ads and you allow the end-users to embed this page in\
    \ their websites. In this case, you can let users personalize the ads or modify\
    \ the type of ads through the Cross-document Messaging API. Clients can send messages\
    \ to your page and you can receive those messages too.\n\n## The JavaScript API\n\
    \nThe Cross-document Messaging API revolves around a single method: `window.postMessage()`.\
    \ As its name suggests, this method allows you to post messages to a different\
    \ page. When the method is called, a `message` event is fired on the receiving\
    \ document side. Before moving further, it’s crucial to understand the properties\
    \ of the `message` event. There are three properties we’re interested in:\n\n\
    1.  *data:* This holds the message being sent. You have already played with it\
    \ in previous chapters (remember calling `event.data` in SSEs?).\n\n2.  *origin:*\
    \ This property indicates the sender document’s origin; i.e the protocol (scheme)\
    \ along with the domain name and port, something like h`ttp://example.com:80`.\
    \ Whenever you receive a message, you should **always, always check** that the\
    \ message is coming from a trusted origin. I will explain how to do that in the\
    \ next section.\n\n3.  *source:* This is a reference to the sender’s window. After\
    \ receiving a cross-document message, if you want to send something back to the\
    \ sender, this is the property you’ll use.\n\n## Basic Usage\n\nYou send a message\
    \ to another document by calling `window.postMessage()`. This function takes two\
    \ arguments:\n\n*   *`message:`* the actual message you want to send\n\n*   *`targetOrigin`:*\
    \ a simple string indicating the target origin—an additional security feature\
    \ (I’ll explain how this is useful in the next section)\n\nThe code looks like\
    \ the following:\n\n```\ntargetWindow.postMessage(message, targetOrigin);\n```\n\
    \nYou should note that `targetWindow` refers to the `window` to which you want\
    \ to send a message. It may be a window you just opened through a call to `window.open()`,\
    \ or it can also be the `contentWindow` property of some iframe.\n\n### Note:\
    \ A Reference to an Open Window\n\n`window.open('a URL')` returns a reference\
    \ to the opened window. You can always call `postMessage()` on it.\n\nLet’s build\
    \ a very simple example. Say that we have a parent page that has an iframe inside\
    \ it. The iframe’s `src` points to a third-party website that provides us with\
    \ a random image.\n\nThis is the page referenced by the iframe in our parent page:\n\
    \n*child.html*\n\n```\n.f<!DOCTYPE html>\n<html>\n<head>\n<title>A page that provides\
    \ a random image</title>\n</head>\n<body>\n  <div id=\"container\">\n    <img\n\
    \      ↵src=\"http://randomimage.setgetgo.com/get.php?key=2323232\"\n      ↵id=\"\
    image\"\n    />\n  <div>\n</body>\n</html>\n```\n\nSo far, so good! Now let’s\
    \ have a look at our parent page:\n\n*parent.html*\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>The Parent Document</title>\n</head>\n  <body>\n    <iframe\n \
    \     ↵src=\"child.html\"\n      ↵height=\"500\" width=\"500\" id=\"iframe\">\n\
    \    </iframe>\n    <br/>\n  </body>\n</html>\n```\n\nWhen you open up the parent\
    \ page, you can see the image coming from the page child.html. For now, both parent.html\
    \ and child.html are on the same server (`localhost)` for testing purposes. But\
    \ they should ideally be on different servers.\n\nBut we don’t want to keep showing\
    \ a static image to our users, nor reload our iframe. It would be really great\
    \ if we could ask the page child.html to reload its image when a user hits a button\
    \ on our parent page; i.e. parent.html.\n\nLet’s start by adding a button to our\
    \ parent page. We’ll also write a function that responds to the click event and\
    \ sends a message to child.html.\n\n*parent.html*\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>The Parent Document</title>\n</head>\n  <body>\n    <iframe\n \
    \     ↵src=\"child.html\"\n      ↵height=\"500\" width=\"500\" id=\"iframe\">\n\
    \    </iframe>\n    <br/>\n    <button id=\"reloadbtn\">Reload</button>\n\n  \
    \  <script>\n      document.getElementById(\"reloadbtn\").\n      ↵addEventListener(\"\
    click\", reload, false);\n\n      // reload handler\n      function reload(e)\
    \ {\n        // is cross-messaging supported?\n        if (window.postMessage)\
    \ {\n            document.getElementById('iframe').\n            ↵contentWindow.postMessage(\n\
    \              Math.random()*1000, 'http://localhost'\n            );\n      \
    \  }\n        else {\n            console.log('postMessage() not supported');\n\
    \        }\n      }\n    </script>\n\n  </body>\n</html>\n```\n\n### Note: Using\
    \ Modernizr\n\nIf you’re using `Modernizr` to check browser compatibility, check\
    \ for the property `Modernizr.postmessage`.\n\nAs you can see, when a user clicks\
    \ on `reload` button our callback `reload()` executes. First, we ensure that `postMessage()`\
    \ is supported by the browser. Next, we call `postMessage()` on the iframe’s `contentWindow`.\
    \ The `contentWindow` property of an iframe is simply a reference to that iframe’s\
    \ window. Here, our message is a simple random number (we will see why shortly).\
    \ The second argument to `postMessage()` is `http://localhost`. This represents\
    \ the `targetOrigin` to which the message can be sent. The origin of the iframe’s\
    \ `src` and this argument must be same in order for `postMessage()` to succeed.\
    \ This is done so that other unintended domains cannot capture the messages. In\
    \ this case, if you pass something else as the `targetOrigin`, `postMessage()`\
    \ will fail."
