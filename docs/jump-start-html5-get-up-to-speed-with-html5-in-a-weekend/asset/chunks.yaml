  trans: "\n\n虽然使用多个 `track` 元素是完全有效的，但并非所有浏览器都完美支持这种做法。目前为止，Internet Explorer 10+\
    \ 和 Safari 7 是唯一支持多个 `track` 元素的浏览器。这两个浏览器都为用户提供了一个菜单，允许其选择想要使用的文本轨道。\n\n![Chrome\
    \ 中的字幕按钮，当字幕开启时（顶部）和关闭时](img/chrome-opera-CC-button.png)\n\n图 10.2. Chrome 中的字幕按钮，当字幕开启时（顶部）和关闭时\n\
    \n当存在多个 `track` 元素时，Chrome 和 Opera 将使用列出的第一个轨道元素。Chrome 和 Opera 并没有提供轨道元素菜单，而是包含一个\
    \ CC 按钮（代表“封闭字幕”），用于切换当前字幕或说明字幕的开启或关闭（图 10.2）。\n\n## 指定你文本轨道的语言\n\n你可能还需要为 `<track>`\
    \ 标签包含一个 `srclang` 属性。该属性的值必须是有效的 BCP 47 语言代码。通常这些代码是两个字母，例如代表英语的 `en` 或代表德语的\
    \ `de`。但也可以包含国家或地区代码，例如代表加拿大法语的 `fr-CA` 或代表英国英语的 `en-GB`。\n\n语言和国家或地区代码非常多——在这里无法列全。请记住你最常用的代码。如果你需要其他语言和地区代码，最好的查找地点是\
    \ Richard Ishida 的[语言标签查找工具](http://people.w3.org/rishida/utils/subtags/)。\n\n\
    如果没有 `srclang` 属性，字幕将无法工作（说明和描述应该可以工作）。当该属性存在时，某些用户代理允许用户在不同轨道之间进行选择。\n\n![在 iOS\
    \ 7 的 Safari 中为字幕或说明选择语言。来自 Nina Paley 的《Sita Sings the Blues》视频截图 (sitasingstheblues.com)](img/track-captions-ios7.png)\n\
    \n图 10.3. 在 iOS 7 的 Safari 中为字幕或说明选择语言。来自 Nina Paley 的《Sita Sings the Blues》视频截图\
    \ (sitasingstheblues.com)\n\n例如，Safari for iOS 7 在全屏模式下查看视频时会为用户提供一个字幕菜单（图 10.3\"\
    )，上方）。它使用 `srclang` 的值来设置菜单中的语言选项。\n\n![默认情况下，Internet Explorer 中的轨道没有标题。来自 Nina\
    \ Paley 的《Sita Sings the Blues》视频截图 (sitasingstheblues.com)](img/track-captions-ie10.png)\n\
    \n图 10.4. 默认情况下，Internet Explorer 中的轨道没有标题。来自 Nina Paley 的《Sita Sings the Blues》视频截图\
    \ (sitasingstheblues.com)\n\n然而，Internet Explorer 并非如此。在 Internet Explorer 10+\
    \ 中（图 10.4\")，上方），封闭字幕菜单中列出的轨道默认是没有标题的。为了修复这个问题，我们需要为每个轨道添加 `label` 属性。截至出版时，其他浏览器尚不支持多个\
    \ `track` 元素。\n\n## 为你的轨道标记\n\n`label` 属性是不是不言自喻的。它定义了浏览器在向用户展示轨道时可以使用的名称或标题。\n\
    \n```\n<video src=\"/path/to/media.file\" controls>\n\t<track src=\"/path/to/en-us.vtt\"\
    \ srclang=\"en-US\" \n\tlabel=\"English - USA\">\n\t<track src=\"/path/to/fr.vtt\"\
    \ srclang=\"fr\" \n\tlabel=\"Français\">\n\t<track src=\"/path/to/es-MX.vtt\"\
    \ srclang=\"es-mx\" \n\tlabel=\"Español - México\">\n</video>\n```\n\n如果没有 `label`\
    \ 属性，Internet Explorer 会为轨道元素提供没有帮助的默认标题，正如我们在图 3 中看到的。。如果包含了该属性，Internet Explorer\
    \ 将在字幕选择菜单中使用 `label` 属性的值（图 10.5\")）。\n\n![当轨道具有 label 属性时，标签值成为字幕选项的名称。来自 Nina\
    \ Paley 的《Sita Sings the Blues》视频截图 (sitasingstheblues.com)](img/track-captions-ie10-with-labels.png)\n\
    \n图 10.5. 当轨道具有 `label` 属性时，标签值成为字幕选项的名称。来自 Nina Paley 的《Sita Sings the Blues》视频截图\
    \ (sitasingstheblues.com)\n\nSafari 处理标签的方式略有不同。Safari 的字幕和说明菜单中的每个标签都包含了标签和语言。到为止，Firefox、Chrome\
    \ 和 Opera 都没有为用户提供多个轨道。\n\n![Safari 同时包含了标签和语言。](img/track-labels-safari6_1.png)\n\
    \n图 10.6. Safari 同时包含了标签和语言。\n\n在为你的轨道选择标签时，请记住以下几点：\n\n*   避免重复标签。这会让用户感到困惑。\n\
    *   标签应该描述轨道的内容和/或 目的（例如：“English - Fully captioned”）。\n*   标签不是 `srclang` 属性的替代品。\n\
    \n## 使用 WebVTT 创建文本轨道\n\nWebVTT 是 HTML5 字幕支持最广泛的文本格式。Chrome 和 Internet Explorer\
    \ 都支持它，万网联盟成员正努力为所有浏览器标准化语法。我们在这里展示几个示例。如需关于 WebVTT 的更深入的讨论，请参阅 [WebVTT 草案规范](http://dev.w3.org/html5/webvtt)。\n\
    \n### 什么是 WebVTT？\n\nWebVTT 是一种简单的结构化文本格式，用于为网络音频视频提供元数据、字幕和说明。尽管技术上是纯文本，但 WebVTT\
    \ 文件必须带有 `Content-type: text/vtt` 响应头进行传输。发送响应头确实需要调整服务器配置。请咨询您的服务器文档或您的 Web 托管支持团队以了解如何操作。\n\
    \nWebVTT 文件还必须使用 UTF-8 编码。检查您的文本编辑器设置或偏好。它应该使用 UTF-8 字符编码和 Unix/Linux 行结束符。（这实际上应该是您的默认设置，因为\
    \ HTML5 也要求。）您可能还希望调整服务器配置，在 `Content-type` 头中包含 `charset` 参数。这将使得完整的响应头变为 `Content-type:\
    \ text/vtt; charset=UTF-8`。再次咨询您的服务器文档或 Web 托管支持团队。\n\n### 创建简单的 WebVTT 文件\n\n\
    WebVTT 文件的文件的行必须以字符串 `WEBVTT` 开头。您可能会在网上看到以 `WEBVTT FILE` 开头的示例。这里的重点是 `WEBVTT`\
    \ 部分。空行将此字符串与文件的其余部分分开。\n\nWebVTT 文件由一系列提示组成。每个提示由时间范围和一个字幕或说明组成。时间应使用 *hh:mm:ss.mls*\
    \ 格式，其中 *hh* 是小时数，*mm* 是分钟，*ss* 是秒，*mls* 是毫秒数。对于一个在 1 小时 33 分 58.3 秒在屏幕上显示的提示，您使用\
    \ `01:33:58.300`。\n\n您可以省略小时前的导零，但仅限小时。这意味着我们之前的提示也可以写成 `1:33:58.300`。然而，分钟和秒必须使用两个数字表示。毫秒必须使用三位数字，必要时补零。\n\
    \n每个提示的开始和结束时间必须由 `-->` 分隔。例如，如果您的提示应该在媒体文件 30 秒处开始，并在 45.4 秒处结束，您可以这样记录：\n\n\
    ```\n00:00:30.000 --> 00:00:45.400\n```\n\n"
- fmt: "\nEvery time range is then followed by the text that makes up the cue. The\
    \ simplest cue is plain text, and cues can break across multiple lines, as shown\
    \ below. (Dialogue from the movie \"Sita Sings the Blues,\" sitasingstheblues.com).\n\
    \n```\nWEBVTT\n\n0:06:57.200 --> 0:07:01.000 \n[Music]\n\n0:07:02.500 --> 0:07:08.000\
    \ \nWhen? I don't remember what year. There's no year. \nHow do you know there's\
    \ a year for that?\n\n0:07:08.500 --> 0:07:10.000 \nI think they say the 14th\
    \ century.\n\n0:07:11.500 --> 0:07:13.000 \nThe 14th century was recently. \n\
    I know but ... \n\n0:07:13.500 --> 0:07:16.500 \nThat's when the Moguls were ruling\
    \ in India\nThe 11th then\n\n0:07:17.500 --> 0:07:22.000 \nIt's definitely B.C.\
    \ It's B.C. for sure.\nAnd I think it's Ayodhya.\n```\n\nNotice the blank lines\
    \ between each cue? They're required. This is how the browser determines where\
    \ one cue ends and the next begins.\n\n### WebVTT Cue Spans\n\nWebVTT supports\
    \ a set of HTML5-like tags known as `cue spans` that offer simple formatting for\
    \ subtitles and captions.\n\n* `c` or cue class span\n* `i` or italics span\n\
    * `b` or bold span\n* `u` or underline span\n* `ruby` and `rt` or ruby and ruby\
    \ text spans\n* `v` or voice cue span\n* `lang` or language cue tag\n\nMuch like\
    \ HTML tags, each cue span start tag begins with a `<` and ends with `>`. Ending\
    \ tags begin with `</` and end with `>`. Let's take our dialogue from above and\
    \ add some voice cue span tags.\n\n```\nWEBVTT\n\n0:06:57.200 --> 0:07:01.000\
    \ \n<i.music>[Music]</i>\n\n0:07:02.500 --> 0:07:08.000 \n<v Man1>When? I don't\
    \ remember what year. There's no year. \nHow do you know there's a year for that?</v>\n\
    \n0:07:08.500 --> 0:07:10.000 \n<v Woman>I think they say the 14th century.</v>\n\
    \n0:07:11.500 --> 0:07:13.000 \n<v Man1>The 14th century was recently</v>\n<v\
    \ Woman>I know but ...</v>\n\n0:07:13.500 --> 0:07:16.500 \n<v Man1>-That's when\
    \ the Moguls were ruling in India</v>\n<v Woman>- The 11th then</v>\n\n0:07:17.500\
    \ --> 0:07:22.000 \n<v Man2>It's definitely B.C. It's B.C. for sure.    \nAnd\
    \ I think it's Ayodhya.</v>\n```\n\nHere, each character is denoted by a `<v>`\
    \ tag. The name of each character—here Man1, Woman, and Man2—are also part of\
    \ the tag. It's an attribute of sorts. We've also added an italic cue span to\
    \ our first cue.\n\n### Tip: Validate Your WebVTT\n\nPoorly-written WebVTT will\
    \ keep captions and subtitles from working. Validate your WebVTT syntax using\
    \ Anne Van Kesteren's [Live WebVTT Validator](http://quuz.org/webvtt/).\n\nVoice\
    \ cue span tags don't change the appearance of each subtitle by themselves. But\
    \ they do add semantic data and become hooks for CSS, as we'll see in the next\
    \ section.\n\n### Styling Subtitles and Captions with the `::cue` Pseudo-element\n\
    \n![Un-styled captions in Internet Explorer 11\\. Video still from \"Sita Sings\
    \ the Blues\" by Nina Paley (sitasingstheblues.com)](figures/track-captions-unstyled-ie.png)\n\
    \nFigure 10.7. Un-styled captions in Internet Explorer 11\\. Video still from\
    \ \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\n\nCaptions and\
    \ subtitles are displayed in most browsers as white, sans-serif text. Internet\
    \ Explorer ([Figure 10.7](#ch10.html_IEcaptions \"Figure 10.7. Un-styled captions\
    \ in Internet Explorer 11\\. Video still from \"Sita Sings the Blues\" by Nina\
    \ Paley (sitasingstheblues.com)\")) adds a text shadow for readability. Chrome,\
    \ Safari, and Opera use a black background. They're always placed at the bottom\
    \ of the video, and centered on screen.\n\nThough WebVTT offers a syntax for caption\
    \ alignment and placement, browser vendors haven't yet implemented it. For now,\
    \ we have limited control over how native captions look and where they are placed\
    \ on screen.\n\nWe can, however, adjust the appearance of captions and subtitles\
    \ with CSS and the `::cue` pseudo-element (currently only supported in Chrome,\
    \ Safari 7, and Opera 16+).\n\nNot all CSS properties can be used to style WebVTT\
    \ captions and subtitles. Only a subset of properties are supported, largely related\
    \ to text and color.\n\n* `color`\n* `opacity`\n* `visibility`\n* `text-decoration`\n\
    * `text-outline`\n* `text-shadow`\n* `background` properties such as `background-color`\n\
    * `outline` properties such as `outline-color`\n* `font` properties such as `font-family`,\
    \ but also `line-height` and `white-space`\n\n#### Important: Change Caption Colors\
    \ With Caution!\n\nEnsure that your color selections create enough contrast by\
    \ using a [contrast ratio calculator](http://leaverou.github.io/contrast-ratio/).\n\
    \nLet's look at an example of styling the `::cue` pseudo-element. Here `::cue`\
    \ is our selector, and we're using the `font` short hand property to make our\
    \ caption text bold.\n\n```\n::cue {\n    font: bold 18px / 1.5 sans-serif;\n\
    }\n```\n\nYou can see the effect in [Figure 10.8](#ch10.html_boldcaptionstyle\
    \ \"Figure 10.8. Applying bold text styling to caption text. Image from \"Sita\
    \ Sings the Blues\" sitasingstheblues.com\").\n\n![Applying bold text styling\
    \ to caption text. Image from \"Sita Sings the Blues\" sitasingstheblues.com](figures/track-vtt-with-white-text.png)\n\
    \nFigure 10.8. Applying bold text styling to caption text. Image from \"Sita Sings\
    \ the Blues\" sitasingstheblues.com\n\nThat's not all we can do, however. The\
    \ `::cue` pseudo-element also resembles a function, and accepts a single argument.\
    \ This argument must be one or more CSS selectors, such as a class name or element.\
    \ Recall the markup we used in our snippet of dialogue from above.\n\n```\nWEBVTT\n\
    \n0:07:11.500 --> 0:07:13.000 \n<v Man1>The 14th century was recently</v>\n<v\
    \ Woman>I know but ...</v>\n```\n"
