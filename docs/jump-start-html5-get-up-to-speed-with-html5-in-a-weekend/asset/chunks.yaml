  trans: '

    HTML 语法在 [版本 2.0](http://www.w3.org/MarkUp/html-spec/) 中仅发生了细微变化。现在我们可以为 `p` 和
    `li` 等元素使用结束标签，但这些结束标签是可选的。然而，从 HTML 2.0 到 HTML 3.2 的过渡标志着一次巨大的飞跃。


    通过 HTML 3.2，我们可以使用 `font` 元素更改字体渲染。我们可以通过 Java applets 和 `applet` 元素添加强大的交互性。我们可以通过
    `table`、`tr` 和 `td` 元素添加表格数据。但也许 HTML 3.2 引入的最显著的特征是样式表。


    然而，大多数网页最终都停在了 HTML 4 上。随着 HTML 4 的出现，我们可以通过选择文档类型（doctype）来告诉浏览器如何解析我们的文档。HTML
    4 提供了三种选项：


    * Transitional（过渡型）：允许废弃的 HTML 3.2 元素与 HTML 4 混合使用

    * Strict（严格型）：仅允许 HTML 4 元素

    * Frameset（框架集）：允许使用 `frame` 元素将多个文档嵌入一个文档中


    然而，HTML 1 到 4 版本并没有提供关于如何解析 HTML 的清晰规则。


    W3C 在 1998 年停止了对 HTML 4 的工作，而是选择将精力放在一个替代品上：XHTML。


    ### 穿越 XHTML 世界的小路


    [XHTML 1.0](http://www.w3.org/TR/xhtml1/) 的创建是为了“将 HTML 4 作为 XML 1.0 应用进行重构”。`XML`（可扩展标记语言）是
    SGML 的 Web 友好修订版，为编写和解析标记提供了更严格的规则。


    例如，XHTML 要求标签使用小写，而 HTML 允许大写、小写或两者的混合。XHTML 要求所有如 `p` 和 `li` 等非空元素必须有结束标签。像 `br`
    和 `img` 等空元素必须用 `/>` 关闭。你必须为所有属性加上引号，并转义 `&` 符号。所有页面必须以 `application/xml+xhtml`
    MIME 类型提供。


    XHTML 教会我们如何编写更高质量的标记。但最终由于缺乏良好的浏览器支持而遭受了痛苦。


    [XForms](http://www.w3.org/TR/2007/REC-xforms-20071029/)另一方面旨在取代 HTML 表单。XForms
    引入了 `upload` 和 `range` 元素，提供了与丰富的与网站的方式。


    然而，XForms 并没有获得太大关注。毕竟，为什么要为网页引入特定的表单标记语言呢？为什么不增强 HTML 呢？


    ### 统治世界之战


    1996 年，Netscape 发布了 Netscape Navigator 2.0，支持两个独立但相关的技术：JavaScript 和文档对象模型（DOM）。我们通常谈论它们时就像它们是同一件事，但
    DOM 是用于与 HTML 文档交互的 API。JavaScript 是与该 API 交互的主要语言。


    Netscape Navigator 的 DOM 接口将 HTML 页面的每个元素转换为一个对象，可以使用脚本语言进行创建、移动、修改或删除。现在我们可以为网页页添加动画或交互性，即使我们必须在超级缓慢的
    14.4Kbps 调制解调器上等待很久下载它们。


    DOM 是 Web 如此出色的补充，其他浏览器很快跟进。但并非每个浏览器实现 DOM 的方式完全相同。例如，Netscape Navigator 使用 `document.layers`
    对象来引用整个 HTML 节点集合。微软 Internet Explorer 使用的是 `document.all`。各地的 Web 开发者花费了多年努力调和两者。至于
    Opera 和 WebKit，它们遵循了 Internet Explorer 的做法。这两个浏览器都采用了 `document.all`。


    最终，“DOM0”从一种基于实现的标准转变为基于规范的标准，参考了 [文档对象模型 (DOM) 1 级规范](http://www.w3.org/TR/REC-DOM-Level-1/)。我们可以使用
    `document.getElementById` 和 `document.getElementsByTagName` 来代替 `document.layers`
    和 `document.all`。今天，所有浏览器都支持 DOM。


    ### Applets 和插件


    在这一切之中——HTML 的增长、DOM 的兴起以及向 XHTML 的转变——applets 和浏览器插件加入了这场狂欢。值得的是，applets 和插件添加了
    HTML 缺失的功能。例如，RealPlayer 和苹果的 QuickTime 为 Web 带来了音频和视频。通过 Java applets，你可以在浏览器中运行电子表格程序。Macromedia（现为
    Adobe）的 Flash 和 Shockwave 让我们能够添加以上所有内容以及动画。


    然而，applets 和插件面临着三个主要问题：


    1. 没有插件（或 applet 环境）的用户无法看到内容。

    2. Applets 和插件扩大了基于互联网的安全漏洞面。

    3. 它们是商业产品，需要开发者支付许可费。


    此外，插件和 applet 有时会导致宿主环境——浏览器变慢或崩溃。


    因此，我们在 Web 上面临这样一个场景：


    * 浏览器没有按照相同的规则解析 HTML。

    * 新的标记语言相比 HTML 并没有多少明显的优势，但增加了实现的开销。

    * 插件和 applet 提供了额外功能，但为浏览器带来了安全和稳定性问题，为开发者带来了许可成本。


    这些正是 HTML5 解决的问题：


    * 它整合了 XHTML 和 XForms 引入的功能和语法。

    * 它几乎消除了对插件的需求以及它们可能带来的稳定性和安全性问题。


    ## HTML5 不是什么


    我承认我在本书书中采取了某种纯主义的方法。HTML5 已经变成了一个术语化的缩写，指代“我们以前无法在浏览器中做的一切酷炫的事情”。然而，在本书书中，我们指的是
    HTML 元素及其文档对象模型（DOM）API。


    在这些页面中，我们不会过多讨论 `CSS`（级联样式表）Level 3 引入的功能。我们将讨论通常被称为“JavaScript”的内容，但更准确地说，它是
    DOM HTML API。我们还会谈论可缩矢量矢量，即 SVG——但仅限于讨论在同一文档中混合使用 SVG 和 HTML 的。


    本书旨在作为 HTML5 的简短介绍。由于此原因，我们不会深入涵盖高级功能。然而，本书将向你介绍 HTML5 与之前版本相比的新之处和不同之处。


    ## 关于 HTML5 规范的说明


    Web 超文本应用技术工作小组 (`WHATWG`) 和万维网联盟 (`W3C`) 都发布了 HTML5 规范。这两个小组合作了多年，创建了一个由单一编辑器管理的规范。然而在
    2011 年，他们分歧了。现在有两个竞争但相似的规范版本。每个版本都有自己的编辑器。


    [WHATWG 版本](http://www.whatwg.org/specs/web-apps/current-work/multipage/) 规范是一个“活文档”。在社区内部讨论后，新功能会被添加、调整，偶尔会被移除。这个版本灵活得多，并且不断变化。


    然而，W3C 有不同的流程。规范编辑器仍然咨询社区，但每个文档都经历从“工作草稿”到“候选建议”再到“W3C 建议”的阶段。因此，W3C 规范是有版本的。2011
    年联合 HTML5 规范成为了 W3C 的 [HTML5 规范](http://www.w3.org/TR/html5/)。随后的修订包含在 [HTML 5.1
    规范](http://www.w3.org/html/wg/drafts/html/master/Overview.html) 中。


    # 第 2 章


    ## 基础：HTML5 的解剖


    每个 HTML 文档由元素组成，而元素由标签表示。标签是字符序列，用于标记元素的不同部分的开始和/或结束。

    '
- fmt: "\nAll tags begin with a left-facing angle bracket (`<`) and end with a right-facing\
    \ angle bracket (`>`). Every element has a `start tag` or `opening tag`, which\
    \ starts with `<`, and is followed by the element name (or an abbreviation of\
    \ it). The element name may be followed by an `attribute` (or series of attributes)\
    \ that describes how that instance of an element is supposed to behave. You can\
    \ set an explicit value for an attribute with an `=` sign. Some attributes, however,\
    \ are empty. If an empty attribute is present, the value is true. Let’s look at\
    \ an example using the `input` element.\n\n```\n<input type=\"text\" name=\"first_name\"\
    \ disabled>\n```\n\nHere, `type`, `name` and `disabled` are all attributes. The\
    \ first two have explicit values, but `disabled` is empty. Some elements allow\
    \ empty attributes, and these are usually those that might otherwise accept true/false\
    \ values. Here’s the tricky part: the value of an empty attribute is either true\
    \ or false based on the presence or absence of the attribute, regardless of its\
    \ set value. In other words, both `disabled=\"true\"` and `disabled=\"false\"\
    ` would also disable input control.\n\nMost elements also have a closing tag.\
    \ Closing tags also start with `<`, but rather than being immediately followed\
    \ by the element name, they are followed by a forward slash (`/`). Then comes\
    \ the element name, and right-angle bracket or `>`. However, some elements are\
    \ known as `void elements`. These elements cannot contain content, and so do not\
    \ have a closing tag. The `input` element shown above is an example of a void\
    \ element.\n\nNow that we’ve covered the basics of tags, let’s take a closer look\
    \ at an HTML5 document.\n\n## Your First HTML5 Document\n\nOpen up your favorite\
    \ text editor and type the following. Save it as `hi.html`.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <title>Hi</title>\n  </head>\n  <body>\n    <p>Hi</p>\n\
    \  </body>\n</html>\n```\n\nCongratulations—you’ve written your first HTML5 document!\
    \ It’s not fancy, perhaps, but it does illustrate the basics of HTML5.\n\nOur\
    \ first line, `<!DOCTYPE html>`, is required. This is how the browser knows that\
    \ we’re sending HTML5. Without it, there’s a risk of browsers parsing our document\
    \ incorrectly. Why? Because of `DOCTYPE switching`.\n\nDOCTYPE switching means\
    \ that browsers parse and render a document differently based on the value of\
    \ the `<!DOCTYPE` declaration, if it's served with a `Content-type:text/html`\
    \ response header. Most browsers implemented some version of DOCTYPE switching\
    \ in order to correctly render documents that relied on non-standard browser behavior,\
    \ or outdated specifications.\n\nHTML 4.01 and XHTML 1.0, for example, had multiple\
    \ modes—strict, transitional, and frameset—that could be triggered with a DOCTYPE\
    \ declaration, whereas HTML 4.01 used the following DOCTYPE for its `strict mode`.\n\
    \n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n```\n\nTransitional, or loose DOCTYPE declarations trigger `quirks mode`. In\
    \ quirks mode, each browser parses the document a little bit differently based\
    \ on its own bugs and deviations from web standards.\n\nStrict DOCTYPE declarations\
    \ trigger `standards mode` or `almost standards mode`. Each browser will parse\
    \ the document according to rules agreed upon in the HTML and CSS specifications.\n\
    \nA `missing` DOCTYPE, however, also triggers quirks mode. So HTML5 defined the\
    \ shortest DOCTYPE possible. The HTML5 specification explains:\n\n> \"DOCTYPEs\
    \ are required for legacy reasons. When omitted, browsers tend to use a different\
    \ rendering mode that is incompatible with some specifications. Including the\
    \ DOCTYPE in a document ensures that the browser makes a best-effort attempt at\
    \ following the relevant specifications.\"\n\nAnd so, using the HTML5 DOCTYPE\
    \ (`<!DOCTYPE html>`) triggers standards mode, even for older browsers that lack\
    \ HTML5 parsers.\n\n## The Two Modes of HTML5 Syntax\n\nHTML5 has two `parsing\
    \ modes` or `syntaxes`: HTML and XML. The difference depends on whether the document\
    \ is served with a `Content-type: text/html` header or a `Content-type: application/xml+xhtml`\
    \ header.\n\nIf it’s served as `text/html`, the following rules apply:\n\n*  \
    \ Start tags are not required for every element.\n*   End tags are not required\
    \ for every element.\n*   Only `void elements` such as `br`, `img`, and `link`\
    \ may be \"self-closed\" with `/>`.\n*   Tags and attributes are case-insensitive.\n\
    *   Attributes do not need to be quoted.\n*   Some attributes may be empty (such\
    \ as `checked` and `disabled`).\n*   Special characters, or entities, do not have\
    \ to be escaped.\n*   The document must include an HTML5 DOCTYPE.\n\n### HTML\
    \ Syntax\n\nLet’s look at another HTML5 document.\n\n```\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <meta charset=utf-8>\n    <title>Hi</title>\n    <!-- \n    This\
    \ is an example of a comment.\n    The lines below show how to include CSS \n\
    \    -->\n    <link rel=stylesheet href=style.css type=text/css>\n    <style>\n\
    \      body{\n        background: aliceblue;\n        }\n    </style>\n  </head>\n\
    \  <body>\n   <p>\n      <img src=flower.jpg alt=Flower>\n      Isn't this a lovely\
    \ flower?\n\n    <p>\n      Yes, that is a lovely flower. What is it?\n\n    <script\
    \ src=foo.js></script>\n  </body>\n</html>\n```\n\nAgain, our first line is a\
    \ DOCTYPE declaration. As with all HTML5 tags, it’s case-insensitive. If you don’t\
    \ like reaching for `Shift`, you could type `<!doctype html>` instead. If you\
    \ really enjoy using `Caps Lock`, you could also type `<!DOCTYPE HTML>` instead.\n\
    \nNext is the `head` element. The `head` element typically contains information\
    \ about the document, such as its title or character set. In this example, our\
    \ `head` element contains a `meta` element that defines the character set for\
    \ this document. Including a character set is optional, but you should always\
    \ set one and it's recommended that you use UTF-8](http://www.w3.org/International/questions/qa-choosing-encodings).\n\
    \n### Note: Make Sure You’re Using UTF-8\n\nIdeally, verify your text editor saves\
    \ your documents with UTF-8 encoding \"without BOM\" and uses Unix/Linux line-endings.\n\
    \nOur `head` element also contains our document title (`<title>Hi</title>`). In\
    \ most browsers, the text between the `title` tags is displayed at the top of\
    \ the browser window or tab.\n\n`Comments` in HTML are bits of text that aren’t\
    \ rendered in the browser. They’re only viewable in the source code, and are typically\
    \ used to leave notes to yourself or a coworker about the document. Some software\
    \ programs that generate HTML code may also include comments. Comments may appear\
    \ just about anywhere in an HTML document. Each one must start with `<!--` and\
    \ end with `-->`.\n\nA document head may also contain `link` elements that point\
    \ to external resources, as shown here. Resources may include style sheets, favicon\
    \ images, or RSS feeds. We use the `rel` attribute to describe the relationship\
    \ between our document and the one we’re linking to. In this case, we’re linking\
    \ to a cascading style sheet, or CSS file. CSS is the stylesheet language that\
    \ we use to describe the way a document looks rather than its structure.\n\nWe\
    \ can also use a `style` element (delineated here by `<style>` and `</style>`)\
    \ to include CSS in our file. Using a `link` element, however, lets us share the\
    \ same style sheet file across multiple pages.\n\nBy the way, both `meta` and\
    \ `link`, are examples of void HTML elements; we could also self-close them using\
    \ `/>`. For example, `<meta charset=utf-8>` would become `<meta charset=utf-8\
    \ />`, but it isn’t necessary to do this.\n\n### To Quote or Not Quote: Attributes\
    \ in HTML5\n\nIn the previous example, our attribute values are unquoted. In our\
    \ `hi.html` example, we used quotes. Either is valid in HTML5, and you may use\
    \ double (\") or single ('') quotes.\n"
