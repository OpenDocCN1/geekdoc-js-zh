  trans: "\n在进一步移动之前，理解此 API 的需求非常重要。为了解释这一点，让我先问你一个问题：你会如何设计一个在有新数据时持续更新浏览器的应用程序？嗯，你总是可以通过\
    \ `setInterval()`/`setTimeout()` 使用传统的轮询方法。在这种情况下，回调会在指定的时间间隔后执行，轮服务器是否有可用数据。如果数据可用，页面将异步更新新内容。\n\
    \n这种方法的主要问题在于产生 HTTP 请求的开销。通过 SSE，服务器可以通过单向连接向浏览器推送更新。而且即使连接断开，客户端也可以自动与服务器重新连接并继续更新。\n\
    \n请记住，SSE 适用于需要单向连接的应用。例如，服务器可以定期获取最新报价发送到浏览器，但浏览器不会向服务器通信，只需消费发送的数据。如果你需要双向连接，将需要使用\
    \ WebSocket，这将在下一节介绍。\n\n好了，说了这么多。让我们看代码！\n\n## API\n\n这里是使用 SSE 的示例代码：\n\n```\n\
    if (!!window.EventSource) {\n  var eventsource=new EventSource('source.php');\n\
    \  eventsource.addEventListener('message',function(event) {\n    document.getElementById(\"\
    container\").innerHTML = event.data;\n  }, false);\n}\nelse{\n    // 回退到轮询\n}\n\
    ```\n\n### 注意：使用 Modernizr\n\n注意我们在检查浏览器对 SSE 的支持。可以使用 Modernizr 实现：\n\n```\n\
    if (Modernizr.eventsource) {\n  // 继续\n}\nelse{\n  // 回退到轮询\n}\n```\n\n要使用 SSE，只需调用\
    \ `EventSource` 构造函数并传递源 URL。源可以是任何实时产生新数据的后端脚本（`source.php`）。\n\n然后你可以为 `eventsource`\
    \ 对象附加事件监听器。当服务器向浏览器推送数据时，会触发 `message` 事件。回调接收 `event` 对象，其 `data` 属性包含了来自服务器的数据。一旦获取了数据，你就可以执行诸如实时更新页面部分等任务。\n\
    \n你可以如下感知感知连接打开和错误发生的情况：\n\n```\neventsource.addEventListener('open', function(event)\
    \ {\n  // 源已打开\n},false);\n\neventsource.addEventListener('error', function(event)\
    \ {\n  // 糟糕！！发生了错误\n},false);\n```\n\n## `EventStream` 格式\n\n服务器的响应中需要某些内容来帮助浏览器将响应识别为服务器发送事件。当服务器向客户端发送数据时，`Content-Type`\
    \ 响应头必须设置为 `text/event-stream`。服务器的响应内容应该如下格式：\n\n```\ndata: 服务器发送的数据 \\n\\n\n\
    ```\n\n`data:` 数据的开始。`\\n\\n` 表示流的结束。\n\n### 注意：`\\n` 是换行符\n\n你应该注意，上面使用的 `\\\
    n` 是换行符，而不是简单的反斜杠和 n。\n\n虽然这对于单行更新有效，但在大多数情况下，我们希望响应是多行的。在这种情况下，数据的格式如下：\n\n```\n\
    data: 这是第一行 \\n\ndata: 现在第二行 \\n\\n\n```\n\n接收此流后，客户端的 `event.data` 将包含由 `\\n`\
    \ 分隔的所有行。你可以如下所示从流中移除这些换行符：\n\n```\nconsole.log(e.data.split('\\n').join(' '));\n\
    ```\n\n## JSON 又怎么样？\n\n在大多数真实世界的应用中，发送 JSON 响应非常方便。你可以这样发送响应：\n\n```\ndata: {\"\
    generator\": \"server\", \"message\": \"测试消息\"}\\n\\n\n```\n\n现在在你的 JavaScript\
    \ 中，可以简单地在 `onmessage` 回调中访问数据：\n\n```javascript\nvar parsedData = JSON.parse(event.data);\n\
    console.log(\n  \"来自 \" + parsedData.generator +\n  \" 的消息是：\" + parsedData.message\n\
    );\n```\n\n## 关联事件 ID\n\n你可以如下所示将事件 `id` 与你发送的数据关联：\n\n```\nid: 100\\n\ndata:\
    \ 嘿，你最近怎么样？\\n\\n\n```\n\n事件 `id` 是有益的，因为浏览器会跟踪最后一个触发的事件。这个 `id` 成为事件的唯一标识符。在任何连接断开的情况下，当浏览器重新连接到服务器时，它会在请求中包含\
    \ HTTP 头 `Last-Event-Id`。在服务器端，你可以检查 `Last-Event-Id` 头是否存在。如果存在，你可以尝试只向浏览器发送 `event\
    \ id` 大于 `Last-Event-Id` 头值值的事件。通过这种方式，浏览器可以消费错过的事件。\n\n## 创建你自己的事件\n\nSSE 最关键的方面之一是能够命名你的事件。在某些应用中，你可以使用特定的事件名称发送更新。为了这样做，你需要在客户端为每个事件注册回调。如下：\n\
    \n服务器响应：\n\n```\nevent: score \\n\ndata: 某些分数 \\n\\n\nevent: other \\n\ndata:\
    \ 某些其他 \\n\\n\n```\n\n客户端 JavaScript：\n\n```javascript\nvar eventsource=new EventSource('source.php');\n\
    \n// 自定义事件\neventsource.addEventListener('score',function(e) {\n  // 你的逻辑\n  console.log(e.data);\n\
    }, false);\n\n// 另一个自定义事件\neventsource.addEventListener('other',function(e) {\n\
    \  // 另一种方式\n  console.log(e.data);\n}, false);\n```\n\n不同的事件名称允许你的 JavaScript\
    \ 代码以不同的方式处理每个事件，并保持代码的整洁和可维护性。\n\n## 处理重连超时\n\n浏览器默认会在约五秒后自动尝试重新连接服务器；然而，你可以控制这个超时时间。以下服务器响应指定了在断开连接的情况下等待多少毫秒再尝试重连：\n\
    \n```\nretry: 15000 \\n\ndata: 常用的数据 \\n\\n\n```\n\n`retry` 值是毫秒，并应在第一个事件触发时指定。如果你的应用没有快速产生新内容，且浏览器在较长间隔后重连是可以的，你可以将其增大。这样做的好处是减少不必要的\
    \ HTTP 请求开销。\n\n## 关闭连接\n\n我们几乎总是会到达这一部分；当资源不再需要时，释放它们更好。那么，如何关闭事件流呢？编写以下代码你将不再从源接收更新：\n\
    \n```javascript\neventsource.close(); //关闭事件流\n```\n\n## 示例事件源\n\n最后，怎么样？创建一个简单的\
    \ `EventSource`，它会随机获取一个笑话并推送到我们的 HTML 页面。这是一个用于推送新数据的简单 PHP 脚本：\n\n*source.php*\n\
    \n```php\n<?php\nheader('Content-Type: text/event-stream');\nheader('Cache-Control:\
    \ no-cache'); \nob_implicit_flush(true);\nob_end_flush();\nwhile (true) {\n  sleep(2);\n\
    \  $curl=curl_init('http://api.icndb.com/jokes/random');\n  curl_setopt($curl,\
    \ CURLOPT_RETURNTRANSFER, true);\n  $result=curl_exec($curl);\n  echo \"data:$result\\\
    n\\n\";\n}\n?>\n```\n\n### 注意：关于 PHP 脚本的一些说明\n\n"
- fmt: "\nThe data from the API is in JSON format. SSEs require you to prepend your\
    \ data with `data:` and mark the end with `\\n\\n`. If you miss these points,\
    \ the `EventSource` won’t work, and remember to also pay attention to the headers.\
    \ The reason for the loop is to keep the connection open. Without the loop, the\
    \ browser will attempt to open a new connection after five seconds or so.\n\n\
    As we are looping continuously in the PHP script, the execution time of the script\
    \ may exceed PHP’s `max_execution_time`. You may also face problems because of\
    \ the Apache user connection limit. Technologies such as `Node.js` may be a better\
    \ choice for these types of real-time apps.\n\nHere’s the HTML page that displays\
    \ the data:\n\n`jokes.html`\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>A\
    \ Random Jokes Website</title>\n<script>\nif(typeof(EventSource)!==\"undefined\"\
    ){\n  var eventsource=new EventSource('source.php');\n  eventsource.addEventListener('message',\
    \ function(event) {\n    document.getElementById(\"container\").innerHTML = \n\
    \    JSON.parse(event.data).value.joke + '<br/>' +\n    document.getElementById(\"\
    container\").innerHTML;\n  },false);\n}\nelse console.log(\"No EventSource\");\n\
    </script>\n</head>\n<body>\n\n  <div id=\"container\"></div>\n\n</body>\n</html>\n\
    ```\n\n## Debugging\n\nIn case you encounter problems, you can debug your application\
    \ using the browser’s JavaScript console. In Chrome, the console is opened from\
    \ Menu > Tools > JavaScript Console. In Firefox, the same can be accessed from\
    \ Menu > Web Developer > Web Console. In case the event stream is not working\
    \ as expected, the console may report the errors, if any.\n\nYou need to pay special\
    \ attentions to the following:\n\n- sending the header `Content-Type: text/event-stream`\
    \ from the server\n- marking the start and end of content with `data:` and `\\\
    n\\n` respectively\n- paying attention to same-origin policies\n\n## Conclusion\n\
    \nServer Sent Events have solved the long polling hack that we previously used\
    \ to achieve real-time update functionality. Here are a few simple projects that\
    \ you might want to implement:\n\n- Creating a page that has a clock updated from\
    \ the server side.\n- Reading and displaying the latest tweets with the help of\
    \ the Twitter API.\n- Fetching a random photo with the Flickr API and updating\
    \ the page.\n\nThe Mozilla Developer Network has a [good resource for learning\
    \ more about SSEs.](https://developer.mozilla.org/en-US/docs/Server-sent_events)\
    \ Here, you can also find some demo apps and polyfills for older browsers.\n\n\
    # Chapter 30\n\n## APIs: The WebSocket API\n\nI think that WebSockets are one\
    \ of the coolest APIs available in HTML5. The real strength of the WebSocket API\
    \ comes to the fore when you want your clients to talk to the server through a\
    \ persistent connection. This means that once the connection is opened, the server\
    \ and the client can send messages to each other anytime. Gone are the days when\
    \ clients used to send a message to the server and wait until the server responded\
    \ back. Clearly, WebSockets eliminate the need for long polling! The API is very\
    \ useful if you want to create real-time apps where clients and the server talk\
    \ to each other continuously. For instance, you can build chat systems, multi-player\
    \ HTML5 games and similar apps with WebSockets.\n\n### Note: WebSockets versus\
    \ Server Sent Events (SSEs)\n\nWebSockets and SSEs can achieve similar tasks but\
    \ they are different. In the case of SSEs, the server only pushes data to the\
    \ client once new updates are available. In the case of WebSockets, both client\
    \ and server send data to each other; to be precise, the communication is bi-directional\
    \ (full-duplex, if you love more technical terms).\n\nTo use WebSockets, you’ll\
    \ need a WebSocket-enabled server. Well, that’s the tricky part. Don’t worry!\
    \ There are implementations of WebSockets available for several different languages.\
    \ I will cover those shortly.\n\nAdditionally, you should always bear in mind\
    \ that WebSockets allows cross-origin communication. So, you should always only\
    \ connect to the clients and servers that you trust.\n\n## The JavaScript API\n\
    \nLet’s quickly try it out. The developers at [WebSocket.org](http://www.websocket.org/)\
    \ have created a demo WebSocket server at `ws://echo.websocket.org`. We can connect\
    \ to it and start exchanging messages with it in no time.\n\n### Note: The `ws://`\
    \ Protocol\n\n`ws://` is a protocol that’s similar to `http://`, except that it’s\
    \ used for specifying the Web Sockets server URLs.\n\nFirst, let’s see how to\
    \ connect to a simple WebSocket server using the JavaScript API. After that, I\
    \ will show how you can create your own WebSocket server and let others connect\
    \ with you.\n\n```\n// test if the browser supports the API\nif('WebSocket' in\
    \ window) {\n\n  var socket = new WebSocket('ws://echo.websocket.org');\n\n  if\
    \ (socket.readyState == 0) console.log('Connecting...');\n\n  // As soon as connection\
    \ is opened, send a message to the server\n  socket.onopen = function () {\n \
    \   if (socket.readyState == 1) {\n      console.log('Connection Opened');\n \
    \     socket.send('Hey, send back whatever I throw at you!'); \n    }     \n \
    \ };\n\n  // Receive messages from the server\n  socket.onmessage = function(e)\
    \ {\n    console.log('Socket server said: ' + e.data);\n  };\n\n  socket.onclose\
    \ = function() {\n    if (socket.readyState == 2) console.log('Connection Closed');\n\
    \  };\n\n  // log errors\n  socket.onerror = function(err) {\n    console.log('An\
    \ Error Occurred ' + err);\n  };\n\n}\nelse {\n  // sadly, no WebSockets!\n}\n\
    ```\n\n### Note: Using Modernizr\n\nWith Modernizr, we can check for the browser\
    \ support of WebSockets this way:\n\n```\nif (Modernizr.websockets) {\n  // proceed\n\
    }\nelse{\n  // No WebSocket\n}\n```\n\nSo, you start by passing the socket server\
    \ URL to the `WebSocket` constructor. The constructor also accepts an optional\
    \ second parameter, which is an array of sub-protocols. This parameter defaults\
    \ to an empty string.\n\nNext, we attach different callbacks for different events.\
    \ As soon as the connection opens, the `onopen` event is fired and our callback\
    \ executes. You can send a simple message to the server by calling `socket.send()`.\
    \ You can also send binary data, which we’ll see in the next section.\n\nSimilarly,\
    \ the server can also send us messages. In that case, the `onmessage` callback\
    \ fires. At the moment, the server sends us back whatever we send to it, and we\
    \ simply log the message received. But you can always capture the message and\
    \ dynamically update your page with it.\n\nJust paste the code in an HTML file\
    \ and run it — you’ll be delighted to see the server’s response!\n\n### Note:\
    \ The `readyState` Property\n\nThe variable `socket` in the aforementioned code\
    \ has a property called `readyState` indicating the status of the connection:\n\
    \n- 0 = connecting\n- 1 = opened\n- 2 = closed\n\n## Sending Binary Data\n\nYou\
    \ can also send binary data to the server. The following program sends the image\
    \ drawn on `canvas` to a sample WebSocket:\n\n```\n// you need to create this\
    \ socket server\nvar connection=new WebSocket('ws://localhost:8080');\n\nconnection.onopen\
    \ = function() {\n\n  // get an image from canvas\n  var image = canvas2DContext.getImageData(0,\
    \ 0, 440, 300);\n  var binary_data = new Uint8Array(image.data.length);\n  for\
    \ (var i = 0; i < image.data.length; i++) {\n    binary_data[i] = image.data[i];\n\
    \  }\n  connection.send(binary_data.buffer); // send the data\n\n}\n```\n\nIn\
    \ the code, we read the image from the HTML page and create an `ArrayBuffer` to\
    \ contain the binary data. Finally, `connection.send()` actually sends the data.\n\
    \n### Note: Using Blobs\n\nWe can also send the binary data as a blob. For example,\
    \ you could create a file uploader and read the files through `querySelector()`.\
    \ Then you can send those files with the help of `connection.send()`. HTML5Rocks\
    \ has an [excellent tutorial on WebSockets](http://www.html5rocks.com/en/tutorials/websockets/basics/)\
    \ that also covers sending binary data to the server through blobs.\n\n## Sample\
    \ Server Implementations\n"
