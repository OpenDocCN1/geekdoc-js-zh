    </header>\n```\n\n在这里，我们将页眉和导航栏封装在 `header` 标签中。我们还将将 `id=\"nav\"` 属性及其值替换为 `nav`\
    \ 元素。让我们使用 HTML5 的 `footer` 元素来重写我们的页脚。\n\n```html\n<footer>\n  <ul>\n    <li><a\
    \ href=\"#\">联系我们</a></li>\n    <li><a href=\"#\">使用条款</a></li>\n    <li><a href=\"\
