- fmt: "\nNow that we’ve talked about the syntax of Application Cache, and a few of\
    \ its quirks, let’s talk about its JavaScript API. AppCache works quite well without\
    \ it, but you can use this API to create your own user interface for your application’s\
    \ loading process. Creating such a user interface requires understanding the event\
    \ sequence, as well as a bit of JavaScript.\n\n### The AppCache Event Sequence\n\
    \nAs the browser loads and parses the cache manifest, it fires a series of DOM\
    \ events on the `applicationCache` object. Since they’re DOM events, we’ll use\
    \ the `addEventListener` method to listen for and handle them.\n\nWhen the browser\
    \ first encounters the `manifest` attribute, it dispatches a `checking` event.\
    \ “Checking” means that the browser is determining whether the manifest has changed,\
    \ indicating an application update. We can use this event to trigger a message\
    \ to the user that our application is updating:\n\n```javascript\nvar checkinghandler\
    \ = function(){\n    updatemessage('Checking for an update');\n}\napplicationCache.addEventListener('checking',checkinghandler);\n\
    ```\n\nIf the cache hasn’t been downloaded before or if the manifest has changed\
    \ (prompting a new download), the browser fires a `downloading` event. Again,\
    \ we can use this event to update the user about our progress:\n\n```javascript\n\
    var downloadinghandler = function(){\n   updatemessage('Downloading files');\n\
    }\napplicationCache.addEventListener('downloading',downloadinghandler);\n```\n\
    \nIf the cache manifest file hasn’t changed since the last check, the browser\
    \ will fire a `noupdate` event. Should we have an update, the browser will fire\
    \ a series of `progress` events.\n\nEvery event is an object. We can think of\
    \ this object as a container with information about the operation that triggered\
    \ it. In the case of `progress` events, there are two properties to know about:\
    \ `loaded` and `total`. The `loaded` property tells us where the browser is in\
    \ the download queue, while `total` tells us the number of files to be downloaded:\n\
    \n```javascript\nvar downloadinghandler = function(event){\n   var progress  \
    \ = document.querySelector('progress');\n   progress.max   = event.total;\n  \
    \ progress.value = event.loaded;\n}\napplicationCache.addEventListener('downloading',downloadinghandler);\n\
    ```\n\nThe first time a cache downloads, the browser fires a `cached` event if\
    \ everything goes well. Updates to the cache end with an `updateready` event.\n\
    \nIf there are problems, the browser will fire an `error` event. Typically this\
    \ happens when a file listed in the manifest returns an error message. But it\
    \ can also happen if the manifest can’t be found or reached, returns an error\
    \ (such as “403 Forbidden”), or changes during an update.\n\nLet’s look at an\
    \ example using a simple to-do list.\n\n### Setting Up Our Cache Manifest\n\n\
    First, let’s define our manifest file: `todolist.appcache`. This file tells the\
    \ browser which files to cache offline:\n\n```\nCACHE MANIFEST\n# revision 1\n\
    \nCACHE:\njs/todolist.js\njs/appcache.js\ncss/style.css\nimgs/checkOk.svg\n```\n\
    \nOnce the browser encounters the `manifest` attribute, it will begin downloading\
    \ the files listed, plus the master HTML page.\n\n### Setting Up Our HTML\n\n\
    In order to set up our application, we first need to create an HTML document.\
    \ This is a single-page application without a lot of functionality, so our markup\
    \ will be minimal:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en-us\" manifest=\"\
    todolist.appcache\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>To do list</title>\n\
    \  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n\
    <body>\n  <section id=\"applicationstatus\"></section>\n\n  <section id=\"application\"\
    \ class=\"hidden\">\n    <form id=\"addnew\">\n      <p>\n        <label for=\"\
    newitem\">\n           What do you need to do today?\n        </label>\n     \
    \   <input type=\"text\" id=\"newitem\" required autofocus>\n        <button type=\"\
    submit\" id=\"saveitem\">Add</button>\n      </p>\n      <p>\n       <button type=\"\
    button\" id=\"delete\">Delete completed</button>\n     </p>\n    </form>\n   \
    \ <ul id=\"list\"></ul>\n  </section>\n\n  <script src=\"js/appcache.js\"></script>\n\
    </body>\n</html>\n```\n\n### Setting Up Our CSS\n\nIn order to set up our application,\
    \ we first need to create an HTML document. This is a single-page application\
    \ without a lot of functionality, so our markup will be minimal:\n\n```css\n.hidden\
    \ {\n  display: none;\n}\n```\n\n### Setting Up Our JavaScript\n\nIn order to\
    \ set up our application, we first need to create an HTML document. This is a\
    \ single-page application without a lot of functionality, so our markup will be\
    \ minimal:\n\n```javascript\nvar appstatus, app, progress;\n\nappstatus = document.getElementById('applicationstatus');\n\
    app = document.getElementById('application');\nprogress = document.createElement('progress');\n\
    \nfunction updatemessage(string){\n    appstatus.innerHTML = string;\n}\n\nvar\
    \ checkinghandler = function(){\n    updatemessage('Checking for an update');\n\
    }\napplicationCache.addEventListener('checking',checkinghandler);\n\nvar downloadinghandler\
    \ = function(){\n   updatemessage('Downloading files');\n}\napplicationCache.addEventListener('downloading',downloadinghandler);\n\
    \nfunction progresshandler(event){\n   var progress = document.querySelector('progress');\n\
    \   progress.max   = event.total;\n   progress.value = event.loaded;\n}\napplicationCache.addEventListener('downloading',progresshandler);\n\
    \nfunction whendonehandler(event){\n    appstatus.classList.add('hidden');\n \
    \   app.classList.remove('hidden');\n}\napplicationCache.addEventListener('cached',whendonehandler);\n\
    \nvar updatereadyhandler = function(){\n    location.reload();\n}\napplicationCache.addEventListener('updateready',updatereadyhandler);\n\
    ```\n"
  raw: "Now that we’ve talked about the syntax of Application Cache, and a few of\
    \ its quirks, let’s talk about its JavaScript API. AppCache works quite well without\
    \ it, but you can use this API to create your own user interface for your application’s\
    \ loading process. Creating such a user interface requires understanding the event\
    \ sequence, as well as a bit of JavaScript.\n\n### The AppCache Event Sequence\n\
    \nAs the browser loads and parses the cache manifest, it fires a series of DOM\
    \ events on the `applicationCache` object. Since they’re DOM events, we’ll use\
    \ the `addEventListener` method to listen for and handle them.\n\nWhen the browser\
    \ first encounters the `manifest` attribute, it dispatches a `checking` event.\
    \ “Checking” means that the browser is determining whether the manifest has changed,\
    \ indicating an application update. We can use this event to trigger a message\
    \ to the user that our application is updating:\n\n```\nvar checkinghandler =\
    \ function(){\n    updatemessage('Checking for an update');\n}\napplicationCache.addEventListener('checking',checkinghandler);\n\
    ```\n\nIf the cache hasn’t been downloaded before or if the manifest has changed\
    \ (prompting a new download), the browser fires a `downloading` event. Again,\
    \ we can use this event to update the user about our progress:\n\n```\nvar downloadinghandler\
    \ = function(){\n   updatemessage('Downloading files');\n}\napplicationCache.addEventListener('downloading',downloadinghandler);\n\
    ```\n\nIf the cache manifest file hasn’t changed since the last check, the browser\
    \ will fire a `noupdate` event. Should we have an update, the browser will fire\
    \ a series of `progress` events.\n\nEvery event is an object. We can think of\
    \ this object as a container with information about the operation that triggered\
    \ it. In the case of `progress` events, there are two properties to know about:\
    \ `loaded` and `total`. The `loaded` property tells us where the browser is in\
    \ the download queue, while `total` tells us the number of files to be downloaded:\n\
    \n```\nvar downloadinghandler = function(event){\n   var progress   = document.querySelector('progress');\n\
    \   progress.max   = event.total;\n   progress.value = event.loaded;\n}\napplicationCache.addEventListener('downloading',downloadinghandler);\n\
    ```\n\nThe first time a cache downloads, the browser fires a `cached` event if\
    \ everything goes well. Updates to the cache end with an `updateready` event.\n\
    \nIf there are problems, the browser will fire an `error` event. Typically this\
    \ happens when a file listed in the manifest returns an error message. But it\
    \ can also happen if the manifest can’t be found or reached, returns an error\
    \ (such as “403 Forbidden”), or changes during an update.\n\nLet’s look at an\
    \ example using a simple to-do list.\n\n### Setting Up Our Cache Manifest\n\n\
    First, let’s define our manifest file: `todolist.appcache`. This file tells the\
    \ browser which files to cache offline:\n\n```\nCACHE MANIFEST\n# revision 1\n\
    \nCACHE:\njs/todolist.js\njs/appcache.js\ncss/style.css\nimgs/checkOk.svg\n```\n\
    \nOnce the browser encounters the `manifest` attribute, it will begin downloading\
    \ the files listed, plus the master HTML page.\n\n### Setting Up Our HTML\n\n\
    In order to set up our application, we first need to create an HTML document.\
    \ This is a single-page application without a lot of functionality, so our markup\
    \ will be minimal:\n\n```\n<!DOCTYPE html>\n<html lang=\"en-us\" manifest=\"todolist.appcache\"\
    >\n<head>\n  <meta charset=\"utf-8\">\n  <title>To do list</title>\n  <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n<body>\n  <section\
    \ id=\"applicationstatus\"></section>\n\n  <section id=\"application\" class=\"\
    hidden\">\n    <form id=\"addnew\">\n      <p>\n        <label for=\"newitem\"\
    >\n           What do you need to do today?\n        </label>\n        <input\
    \ type=\"text\" id=\"newitem\" required autofocus>\n        <button type=\"submit\"\
    \ id=\"saveitem\">Add</button>\n      </p>\n      <p>\n       <button type=\"\
    button\" id=\"delete\">Delete completed</button>\n     </p>\n    </form>\n   \
    \ <ul id=\"list\"></ul>\n  </section>\n\n  <script src=\"js/appcache.js\"></script>\n\
    \  <script src=\"js/todolist.js\"></script>\n</body>\n</html>\n```\n\n### Setting\
    \ Up Our CSS and JavaScript\n\nNotice here that we have added a `manifest` attribute\
    \ to our `html` tag. Our stylesheet controls the appearance of our application,\
    \ including the styles we’ll need for our interactions. The pertinent CSS from\
    \ our stylesheet is shown:\n\n```\n.hidden {\n    display:none;\n}\n```\n\nOur\
    \ `hidden` class controls the display of our elements. We’ll use DOM scripting\
    \ to add and remove this class name from our elements when the browser has fired\
    \ a particular event.\n\nFirst, let’s define our global variables:\n\n```\nvar\
    \ appstatus, app, progress, p;\n\nappstatus = document.getElementById('applicationstatus');\n\
    app = document.getElementById('application');\nprogress = document.createElement('progress');\n\
    p = document.createElement('p');\n\nappstatus.appendChild(p);\nappstatus.appendChild(progress);\n\
    ```\n\nWe’ll also create an `updatemessage` function that we’ll use to update\
    \ our messages:\n\n```\n/* Create a reusable snippet for updating our messages\
    \ */\nfunction updatemessage(string){\n    var message = document.createTextNode(string);\n\
    \    if (p.firstChild) {\n        p.replaceChild(message, p.firstChild)\n    }\
    \ else {\n        p.appendChild(message);\n    }\n}\n```\n\nNext, let’s set up\
    \ our checking event handler. This function will be called when the browser fires\
    \ a `checking` event:\n\n```\nfunction checkinghandler(){\n    updatemessage('Checking\
    \ for an update');\n}\napplicationCache.addEventListener('checking', checkinghandler);\n\
    ```\n\nHere, we’ve updated our application to tell the user that the browser is\
    \ checking for an update.\n\nLet’s also add a `progress` event handler. This handler\
    \ will update our application with the index of the file currently being downloaded:\n\
    \n```\nfunction progresshandler(evt){\n    evt.preventDefault();\n    progress.max\
    \   = evt.total;\n    progress.value = evt.loaded;\n    updatemessage('Checking\
    \ for an update');\n}\napplicationCache.addEventListener('progress', progresshandler);\n\
    ```\n\nIf this is the first time our application cache is downloading our application,\
    \ it will fire a `cached` event. In this function, we’re going to hide `div#applicationstatus`,\
    \ and show `div#application` by adding and removing the `hidden` class:\n\n```\n\
    function whendonehandler(evt){\n    evt.preventDefault();\n    appstatus.classList.add('hidden');\n\
    \    app.classList.remove('hidden');\n}\napplicationCache.addEventListener('cached',\
    \ whendonehandler);\n```\n\nThis is what makes our application active. We’ll also\
    \ use this function to handle our `noupdate` event. If there isn’t an application\
    \ update, we’ll just hide the status screen and show the application:\n\n```\n\
    applicationCache.addEventListener('noupdate', whendonehandler);\n```\n\nFinally,\
    \ we need to take an action when the browser has downloaded an update. Once the\
    \ cache updates, the web application won’t use the latest files until the next\
    \ page load.\n\nIn order to force an update, we reload our page using `location.reload()`.\
    \ And we can invoke `location.reload()` when the browser fires the `updateready`\
    \ event:\n\n```\nfunction updatereadyhandler(){\n    location.reload();\n}\n\n\
    applicationCache.addEventListener('updateready',updatereadyhandler);\n```\n\n\
    That’s it! We have a loading interface for our application. Now let’s take a look\
    \ at the application itself. In [the next chapter](#ch24.html \"Chapter 24Offline\
    \ Apps: Web Storage\"), we’ll take a look at web storage: the `localStorage` and\
    \ `sessionStorage` objects.\n\n# Chapter 24\n\nOffline Apps: Web Storage\n\n[Web\
    \ storage](http://dev.w3.org/html5/webstorage/) (also known as DOM storage) is\
    \ a simple client-side, key-value system that lets us store data in the client.\
    \ It consists of two parts: `localStorage` and `sessionStorage`.\n\nThe main difference\
    \ between `localStorage` and `sessionStorage` is persistence. Data stored using\
    \ `localStorage` persists from session to session. It’s available until the user\
    \ or the application deletes it."
