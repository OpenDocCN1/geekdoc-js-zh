    # Preface


    `HTML` (HyperText Markup Language) is the predominant language of web pages. Whenever
    you read or interact with a page in your browser, chances are it’s an HTML document.
    Originally developed as a way to describe and share scientific papers, HTML is
    now used to mark up all sorts of documents and create visual interfaces for browser-based
    software.


    With HTML5, however, HTML has become as much of an `API` (Application Processing
    Interface) for developing browser-based software as it is a markup language. In
    this book, we’ll talk about the history of HTML and HTML5 and explore some of
    its new features.


    HTML5 also improves existing elements. With its new input types, we can create
    rich form controls without the need for a JavaScript library. For example, if
    you want a slider input control, you can use `<input type=range>`. Input types
    such as `email` and `url` add client-side validation to the mix. New `audio` and
    `video` elements let us embed audio and video media directly in our documents.
    Both elements also have scripting interfaces that we can use to create custom
    media players or clever visual effects. And we can do this without the need for
    a plugin in supporting browsers.


    We can draw in HTML5 with the addition of the `canvas` element and support for
    inline Scalable Vector Graphics (or SVG). The `canvas` element is a powerful bitmap
    drawing API that lets us create 2D or 3D images, charts, and games. SVG, on the
    other hand, uses vector graphics to create reusable, scalable, scriptable images
    that work across devices and screens.


    Perhaps the biggest shift of HTML5 is this: APIs that are part of HTML''s document
    object model, but don''t have corresponding markup elements. They are purely DOM
    APIs that we can use with `JavaScript` to share and consume data, or create location-aware
    applications. Web Workers, mimics multi-threaded `JavaScript` and background tasks.
    The Geolocation API lets our apps take location into context. With cross-document
    messaging, we can send data between documents, even across domains, without exposing
    the full DOM of either. Finally, Server-Sent Events and WebSockets enable near-real
    time communication between client and server.


    After reading this book, you''ll know the basics of everything mentioned above,
    and be well on your way to developing amazing HTML5 websites and applications.


    ## Who Should Read This Book


    Although this book is meant for HTML5 beginners, it isn''t totally comprehensive.
    As a result, we do assume some prior knowledge of HTML. If you are completely
    new to web development, SitePoint’s [**Build Your Own Website using HTML and CSS**](http://www.sitepoint.com/store/build-your-own-website-the-right-way-using-html-css-3rd-edition/)
    may be a better book for you.

