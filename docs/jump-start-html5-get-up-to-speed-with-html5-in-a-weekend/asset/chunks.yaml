  trans: "\n\n所有标签都以左向角括号（`<`）开头，并右向角括号（`>`）结束。每个元素都有一个`start tag`（或`opening tag`），它以`<`开头，后面跟着元素名称（或其缩写）。元素名称后面可以跟着一个`attribute`（或一系列属性），用于描述该元素实例的预期行为。你可以使用\
    \ `=` 号为属性设置一个显式值。然而，某些属性是空的。如果存在空属性，则该属性值为 `true`。让我们来看一个使用 `input` 元素的示例。\n\n\
    ```\n<input type=\"text\" name=\"first_name\" disabled>\n```\n\n在这里，`type`、`name`\
    \ 和 `disabled` 都是属性。前两个有显式值，但 `disabled` 是空的。某些元素允许空属性，这些通常是那些原本可能接受真/假值的元素。棘手的地方在于：空属性的值是\
    \ `true` 还是 `false` 取决于属性是否存在，而无论其设置的值如何。换句话说，`disabled=\"true\"` 和 `disabled=\"\
    false\"` 都会禁用输入控件。\n\n大多数元素还有一个闭合标签。闭合标签也以`<` 开头，但后面紧跟的不是元素名称，而是一个正斜杠（`/`）。然后是元素名称和右角括号或`>`。然而，某些元素被称为\
    \ `void elements`（空元素）。这些元素不能包含内容，因此没有闭合标签。上面显示的 `input` 元素就是一个空元素示例。\n\n现在我们已经涵盖了标签的基础知识，让我们仔细观察一个\
    \ HTML5 文档。\n\n## 你的第一个 HTML5 文档\n\n打开你最喜欢的文本编辑器并输入以下内容。将其保存为 `hi.html`。\n\n```\n\
    <!DOCTYPE html>\n<html>\n  <head>\n    <title>Hi</title>\n  </head>\n  <body>\n\
    \    <p>Hi</p>\n  </body>\n</html>\n```\n\n恭喜你——你写了你的第一个 HTML5 文档！它可能并不复杂，但它确实说明了\
    \ HTML5 的基础。\n\n我们的第一行 `<!DOCTYPE html>` 是必须的。这是浏览器知道我们正在发送 HTML5 的方式。如果没有它，存在浏览器错误解析文档的风险。为什么呢？因为\
    \ `DOCTYPE switching`（DOCTYPE 切换）。\n\nDOCTYPE 切换意味着，如果通过带有 `Content-type:text/html`\
    \ 响应头提供，浏览器将根据 `<!DOCTYPE` 声明的值不同的解析和渲染文档。大多数浏览器实现了某些版本的 DOCTYPE 切换，以便正确渲染依赖非标准浏览器行为或过时规范的文档。\n\
    \n例如，HTML 4.01 和 XHTML 1.0 有多种模式——严格（strict）、过渡（transitional）和帧（frameset），这些模式可以通过\
    \ DOCTYPE 声明触发，而 HTML 4.01 使用以下 DOCTYPE 作为其 `strict mode`。\n\n```\n<!DOCTYPE HTML\
    \ PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n```\n\n过渡型或宽松的 DOCTYPE 声明会触发 `quirks mode`（怪异模式）。在怪异模式下，每个浏览器都会根据自身的 bug 和对\
    \ Web 标准的偏差略有不同地解析文档。\n\n严格 DOCTYPE 声明会触发 `standards mode`（标准模式）或 `almost standards\
    \ mode`（准标准模式）。每个浏览器将根据 HTML 和 CSS 规范中约定的规则解析文档。\n\n然而，`missing` DOCTYPE 也会触发怪异模式。因此，HTML5\
    \ 定义了尽可能短的 DOCTYPE。HTML5 规范解释道：\n\n> “由于历史原因，DOCTYPE 是必须的。如果省略，浏览器倾向于使用与某些规范不兼容的默认渲染模式。在文档中包含\
    \ DOCTYPE 可以确保浏览器尽力遵循相关规范。”\n\n因此，使用 HTML5 的 DOCTYPE (`<!DOCTYPE html>`) 会触发标准模式，即使对于缺乏\
    \ HTML5 解析器的旧版浏览器也是如此。\n\n## HTML5 语法的两种模式\n\nHTML5 有两种 `parsing modes`（解析模式）或语法：HTML\
    \ 和 XML。区别取决于文档是带有带有 `Content-type: text/html` 头部还是带有 `Content-type: application/xml+xhtml`\
    \ 头部提供的。\n\n如果是作为 `text/html` 提供的，则适用以下规则：\n\n*   每个元素并不需要起始标签。\n*   每个元素并不需要结束标签。\n\
    *   只有 `void elements`（如 `br`、`img` 和 `link`）可以使用 `/>` 进行为“自闭合”。\n*   标签和属性不区分大小写。\n\
    *   属性不需要加引号。\n*   某些属性可以是空的（如 `checked` 和 `disabled`）。\n*   特殊字符或实体不需要转义。\n*\
    \   文档必须包含 HTML5 DOCTYPE。\n\n### HTML 语法\n\n让我们再来看另一个 HTML5 文档。\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta charset=utf-8>\n    <title>Hi</title>\n \
    \   <!-- \n    这是一个注释的示例。\n    下面的行显示了如何包含 CSS \n    -->\n    <link rel=stylesheet\
    \ href=style.css type=text/css>\n    <style>\n      body{\n        background:\
    \ aliceblue;\n        }\n    </style>\n  </head>\n  <body>\n   <p>\n      <img\
    \ src=flower.jpg alt=Flower>\n      这不是一朵漂亮的花吗？\n\n    <p>\n      是的，那是一朵漂亮的花。它是什么？\n\
    \n    <script src=foo.js></script>\n  </body>\n</html>\n```\n\n再次，我们的第一行是 DOCTYPE\
    \ 声明。与所有的 HTML5 标签一样，它不区分大小写。如果你不想按 `Shift` 键，你可以输入 `<!doctype html>`。如果你非常喜欢使用\
    \ `Caps Lock`，你也可以输入 `<!DOCTYPE HTML>`。\n\n接下来是 `head` 元素。`head` 元素通常包含有关文档的信息，例如标题或字符集。在这个示例中，我们的\
    \ `head` 元素包含一个定义此文档字符集的 `meta` 元素。包含字符集是可选的，但你应该始终设置一个，并且建议你使用 [UTF-8](http://www.w3.org/International/questions/qa-choosing-encodings)。\n\
    \n### 注意：确保你正在使用 UTF-8\n\n理想情况下，验证你的文本编辑器以“无 BOM”的 UTF-8 编码保存文档，并使用 Unix/Linux\
    \ 行结束。\n\n我们的 `head` 元素还包含了文档标题（`<title>Hi</title>`）。在大多数浏览器中，`title` 标签之间的文本显示在浏览器窗口或标签的顶部。\n\
    \nHTML 中的 `Comments`（注释）是在浏览器中不渲染的文本。它们只能在源代码中查看，通常用于给自己或同事留下关于文档的注释。某些生成 HTML\
    \ 代码的程序也可能包含注释。注释可能出现在 HTML 文档的任何地方。每个注释都必须以 `<!--` 开头并以 `-->` 结束。\n\n文档头部（head）还可以包含指向外部资源的\
    \ `link` 元素，所示。资源可能包括样式表、favicon 图像或 RSS 馈。我们使用 `rel` 属性来描述文档与我们链接的文档之间的关系。在这种情况下，我们链接到级联样式表，即\
    \ CSS 文件。CSS 是我们用来描述文档外观而非结构的样式表语言。\n\n我们还可以使用 `style` 元素（在这里由 `<style>` 和 `</style>`\
    \ 界定）在我们的文件中包含 CSS。然而，使用 `link` 元素可以在多个页面之间共享同一个样式表文件。\n\n顺便说一下，`meta` 和 `link`\
    \ 都是空 HTML 元素的示例；我们也可以 `/>` 使它们自闭合。例如，`<meta charset=utf-8>` 将变为 `<meta charset=utf-8\
    \ />`，但并不是必要的。\n\n### 加引号还是不加引号：HTML5 中的属性\n\n在示例中，我们的属性值是不加引号的。在我们的 `hi.html`\
    \ 示例中，我们使用了引号。这在 HTML5 中都是有效的，并且你可以使用双引号（\")或单引号（'）。\n\n"
- fmt: "\nBe careful with unquoted attribute values. It’s fine to leave a single-word\
    \ value unquoted. A space-separated list of values, however, must be enclosed\
    \ in quotes. If not, the parser will interpret the first value as the value of\
    \ the attribute, and subsequent values as empty attributes. Consider the following\
    \ snippet:\n\n```\n<code class=php highlightsyntax><?php echo 'Hello!'; ?></code>\n\
    ```\n\nBecause both values for the `class` attribute are not enclosed in quotes,\
    \ the browser interprets it like so:\n\n```\n<code class=\"php\" highlightsyntax><?php\
    \ echo 'Hello!'; ?></code>\n```\n\nOnly `php` is recognized as a class name, and\
    \ we’ve unintentionally added an empty `highlightsyntax` attribute to our element.\
    \ Changing `class=php highlightsyntax` to `class=\"php highlightsyntax\"` (or\
    \ the single-quoted `class='php highlightsyntax'`) ensures that both class attribute\
    \ values are treated as such.\n\n### A Pared-down HTML5 Document\n\nAccording\
    \ to the rules of HTML—this is also true of HTML 4—some elements don’t require\
    \ start tags or end tags. Those elements are implicit. Even if you leave them\
    \ out of your markup, the browser acts as if they’ve been included. The `body`\
    \ element is one such element. We could, in theory, re-write our `hi.html` example\
    \ to look like this.\n\n```\n<!DOCTYPE html>\n<head>\n  <meta charset=utf-8>\n\
    \  <title>Hi</title>\n  <p>Hi\n```\n\nWhen our browser creates the document node\
    \ tree, it will add a `body` element for us.\n\nJust because you *can* skip end\
    \ tags doesn’t mean you *should*. The browser will need to generate a DOM in either\
    \ case. Closing elements reduces the chance that browsers will parse your intended\
    \ DOM incorrectly. Balancing start and end tags makes errors easier to spot and\
    \ fix, particularly if you use a text editor with syntax highlighting. If you’re\
    \ working within a large team or within a `CMS` (Content Management System), using\
    \ start and end tags also increases the chance that your chunk of HTML will work\
    \ with those of your colleagues. For the remainder of this book, we’ll use start\
    \ and end tags, even when optional. \n\n### Note: Start and End Tags\n\nTo discover\
    \ which elements require start and end tags, consult the World Wide Web Consortium’s\
    \ guide [HTML: The Markup Language (an HTML language reference)](http://www.w3.org/TR/html-markup/).\
    \ The W3C also manages the [Web Platform Docs](http://docs.webplatform.org/wiki/Main_Page)\
    \ which includes this information.\n\n### \"XHTML5\": HTML5’s XML Syntax\n\nHTML5\
    \ can also be written using a stricter, XML-like syntax. You may remember from\
    \ [Chapter 1](#ch01.html \"Chapter 1Basics: What is HTML5?\") that XHTML 1.0 was\
    \ \"a reformulation of HTML 4 as an XML 1.0 application.\" That isn’t quite true\
    \ of what is sometimes called \"XHTML5\". XHTML5 is best understood as HTML5 that’s\
    \ written and parsed using the syntax rules of XML and served with a `Content-type:\
    \ application/xml+xhtml` response header.\n\nThe following rules apply to \"XHTML5\"\
    :\n\n* All elements must have a start tag.\n* Non-void elements with a start tag\
    \ must have an end tag (`p` and `li`, for example).\n* Any element may be \"self-closed\"\
    \ using `/>.`.\n* Tags and attributes are case sensitive, typically lowercase.\n\
    * Attribute values *must* be enclosed in quotes.\n* Empty attributes are forbidden\
    \ (`checked` must instead be `checked=\"checked\"` or `checked=\"true\"`).\n*\
    \ Special characters must be escaped using character entities.\n\nOur `html` start\
    \ tag also needs an `xmlns` (XML name space) attribute. If we rewrite our document\
    \ from above to use XML syntax, it would look like the example below.\n\n```\n\
    <!DOCTYPE html>\n  <html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n\
    \      <meta charset=\"utf-8\" />\n      <title>Hi</title>\n    </head>\n    <body>\n\
    \      <p>\n        <img src=\"flower.jpg\" alt=\"Flower\" />\n        Isn't this\
    \ a lovely flower?\n      </p>\n      <script src=\"foo.js\" />\n    </body>\n\
    </</html>\n```\n\nHere we’ve added the XML name space with the `xmlns` attribute,\
    \ to let the browser know that we’re using the stricter syntax. We’ve also self-closed\
    \ the tags for our empty or void elements, `meta` and `img`. According to the\
    \ rules of XML and XHTML, all elements must be closed either with an end tag or\
    \ by self-closing with a space, slash, and a right-pointing angle bracket (`/>`).\n\
    \nIn this example, we have also self-closed our `script` tag. We could also have\
    \ used a normal `</script>` tag, as we’ve done with our other elements. The `script`\
    \ element is a little bit of an oddball. You can embed scripting within your documents\
    \ by placing it between `script` start and end tags. When you do this, you *must*\
    \ include an end tag.\n\nHowever, you can also link to an external script file\
    \ using a `script` tag and the `src` attribute. If you do so, and serve your pages\
    \ as `text/html`, you *must* use a closing `</script>` tag. If you serve your\
    \ pages as `application/xml+xhtml`, you may also use the self-closing syntax.\n\
    \nDon’t forget: in order for the browser to parse this document according to XML/XHTML\
    \ rules, our document must be sent from the server with a `Content-type: application/xml+xhtml`\
    \ response header. In fact, including this header will trigger XHTML5 parsing\
    \ in conforming browsers even if the DOCTYPE is missing.\n\n### Note: Configuring\
    \ Your Server\n\nIn order for your web server or application to send the `Content-type:\
    \ application/xml+xhtml` response header, it must be configured to do so. If you’re\
    \ using a web host, there’s a good chance your web host has done this already\
    \ for files with an .xhtml extension. Here you would just need to rename `hi.html`\
    \ to `hi.xhtml`. If that doesn't work, consult your web server documentation.\n\
    \nAs you may have realized, XML parsing rules are more persnickety. It’s much\
    \ easier to use the `text/html` MIME type and its looser HTML syntax.\n\n# Chapter\
    \ 3\n\n## Basics: Structuring Documents\n\nHTML5 adds several elements that provide\
    \ a way to break a single document into multiple chunks of content—content that\
    \ may be either related or independent. These elements add semantic richness to\
    \ our markup, and make it easier to repurpose our documents across media and devices.\n\
    \nWe’ll take a look at these elements and how they interact using a fictitious\
    \ top story from a fictitious news web site: The *HTML5 News-Press*, as shown\
    \ in [Figure 3.1](#ch03.html_newspressarticle \"Figure 3.1. The HTML5 News-Press\"\
    ).\n\n![The HTML5 News-Press](figures/html5newspressarticle.png)\n\nFigure 3.1.\
    \ The HTML5 News-Press\n\nOur news story page begins with a masthead and main\
    \ navigation bar. In previous versions of HTML, we might have marked that up like\
    \ so:\n\n```\n<div id=\"header\">\n  <h1>HTML5 <i>News-Press</i></h1>\n  <h2>All\
    \ the news that's fit to link</h2>\n  <ul id=\"nav\">\n    <li><a href=\"#\">World</a></li>\n\
    \    <li><a href=\"#\">National</a></li>\n    <li><a href=\"#\">Metro area</a></li>\n\
    \    <li><a href=\"#\">Sports</a></li>\n    <li><a href=\"#\">Arts &amp; Entertainment</a></li>\n\
    \  </ul>\n</div>\n```\n\nOur page ends with a footer element. Again, using HTML\
    \ 4, our markup might look like this:\n\n```\n<div id=\"footer\">\n  <ul>\n  \
    \  <li><a href=\"#\">Contact Us</a></li>\n    <li><a href=\"#\">Terms of Use</a></li>\n\
    \    <li><a href=\"#\">Privacy Policy</a></li>\n  </ul>\n  <p>No copyright 2013\
    \ HTML5 News-Press.</p>\n</div>\n```\n\nHTML5, however, adds elements specifically\
    \ for this purpose: `header`, `nav` and `footer`.\n\nThe `header` element functions\
    \ as a header for the contents of a document segment. The `footer` functions as\
    \ a footer for a document segment. Notice, I said *segment* and not *document*\
    \ or *page*. Some elements are considered sectioning elements. They split a document\
    \ into sections or chunks. One of these elements, of course, is the new `section`\
    \ element. Other sectioning elements include `body`, `article`, `aside`, are `nav`\
    \ as well. Here’s the tricky part: each sectioning element may contain its own\
    \ header and footer. It’s a bit of confusing, but the main point here is that\
    \ a document may contain multiple header and footer elements.\n"
