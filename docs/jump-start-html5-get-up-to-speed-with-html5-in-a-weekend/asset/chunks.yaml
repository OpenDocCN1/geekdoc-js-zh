  trans: "\n\n在这种情况下，只有当用户拥有兼容 HD 的设备时，浏览器才会下载支持的视频文件。值得注意的是，`media` 属性仅适用于 `source`\
    \ 元素。将其添加到 `video` 或 `audio` 标签中将不起作用。\n\n当然，响应式 Web 设计和媒体查询还有许多相关内容。可以查看 SitePoint\
    \ 的 [*Jump Start Responsive Web Design*](http://www.sitepoint.com/store/jump-start-responsive-web-design/)\
    \ 了解介绍。\n\n## 到目前我们学了\n\n到为止，我们已经涵盖了 HTML5 音频和视频元素及其属性。我们还讨论了如何提供跨浏览器视频以及如何进行故障排除。下一页，我们将查看使用\
    \ `track` 元素为网络视频添加字幕。\n\n# 第 10 章：多媒体：`track` 元素\n\n在上章节中，我们讨论了如何通过跨浏览器技术让媒体对更多用户可用。在本章中，我们将查看如何通过\
    \ `track` 元素和 WebVTT 让媒体也变得可访问且“可索引”。\n\nHTML5 多媒体面临三个挑战：\n\n1. 缺乏可访问性。\n2. 缺乏“可索引性”。\n\
    3. 媒体与观众或听者之间的语言障碍。\n\n可访问性简单意味着尽可能地支持有障碍或残疾的用户。听觉媒体对于听障用户来说是不可用的。视障用户无法像视力正常的人那样看到视觉媒体。HTML5\
    \ 音频视频为这些用户带来了明显的挑战。\n\n此外，搜索引擎软件难以正确索引二进制数据（如音频、视频和图像）。即使是 Google 图像搜索也依赖文件名、`alt`\
    \ 属性和周围文本，而不是实际的文件索引。音频和视频文件本身像是一个信息黑洞。数据进去了，但往往难以提取和使用。\n\n语言障碍是 HTML5 多媒体的另一个挑战。观众或听者可能无法理解，更不用流练使用播放媒体的语言了。视频*内部*的字幕可以帮助。然而，它们在编辑、查看或收听媒体时无法方便地切换。它们也受到索引问题的影响。\n\
    \nHTML5 将 `track` 元素定义为解决这些问题的方法。通过它，我们可以为媒体文件添加基于时间的基于文本的替代方案——如字幕、说明和元数据。在本章中，我们将查看该元素以及一种名为\
    \ WebVTT 的说明和字幕语法。\n\n## `track` 的支持现状\n\n在开始之前，让我们来讨论浏览器支持。`<track>` 元素至少被 Internet\
    \ Explorer 10+、Chrome 16+、Safari 6+ 和 Opera 16+ 支持。然而，它在某些浏览器中的实用性是有限的。\n\nOS\
    \ X 版 Safari 6.0.5 并没有为用户提供说明或字幕，尽管脚本界面是部分可用的。然而，Safari 7 中是可以说明的。（在 iOS 7 中，只有当视频处于全屏模式时可用。）\n\
    \n桌面版 Opera 16+ 支持 `track`，但 Android 版 Opera 不支持。在 Android 上，Opera 将视频处理交给操作系统的软件。它不是在浏览器中播放视频，而是启动外部应用程序，使得字幕变得无关。Opera\
    \ 为 iOS 开发的新浏览器 Coast 行为也类似，使用该平台内置的视频处理。\n\nFirefox 对 `track` 的支持仍在进行中。尚未完全支持。但是，在[最新预览版](http://nightly.mozilla.org/)（Firefox\
    \ 27.0a1 及更高版本）可以使用部分支持。在地址栏中输入 `about:config`并将 `media.webvtt.enabled` 设置更改为\
    \ `true` 来启用它。\n\n要在不支持的浏览器中提供字幕，请查看 [Captionator.js](http://captionatorjs.com/)\
    \ 和 [MediaElementJS](http://mediaelementjs.com/)。\n\n### 说明、字幕与 `audio`\n\n大多数浏览器不支持与\
    \ `audio` 元素配合使用时的 `track` 元素。没有字幕，没有说明，也没有菜单。对于 `audio` 文件，你目前有两种选择：\n\n1. 在\
    \ HTML 文 文中包含文本转录。\n2. 使用 `video` 元素代替 `audio` 元素。\n\n由于音频文件缺乏内在尺寸，`video` 元素将以其默认的\
    \ 300x150 像素渲染。\n\n## 添加 `track` 元素\n\n要使用 `track` 元素，将其放在起始 `<video>` 标签和结束 `</video>`\
    \ 标签之间，如下所示。\n\n```\n<video src=\"/path/to/media.file\" controls>\n  <track src=\"\
    /path/to/tracktext.vtt\" srclang=\"en\">\n</video>\n```\n\n如果你使用的是 `source` 元素，请将你的\
    \ `track` 标签或标签放在 `source` 标签之后。\n\n```\n<video src=\"/path/to/media.file\" controls>\n\
    \  <source src=\"/path/to/media.m4v\" kind=\"video/mp4\">\n  <source src=\"/path/to/media.webm\"\
    \ kind=\"video/webm\">\n  <track src=\"/path/to/tracktext.vtt\" srclang=\"en\"\
    >\n</video>\n```\n\n你可能注意到我们的 `track` 标签包含一个 `src` 属性。`src` 的值必须包含替代版本的文本文件的 URL。理论上，这可以是浏览器支持的任何字幕文件格式。在实践中，它应该是\
    \ [WebVTT](http://dev.w3.org/html5/webvtt/) 文件。WebVTT 在所有支持 `track` 元素的浏览器中都受到支持。[TTML](http://www.w3.org/TR/ttaf1-dfxp/)\
    \ 是另一种字幕语法，但到目前，只有 Internet Explorer 支持它。\n\n在本章稍后部分，我们将讨论 WebVTT 的字幕语法以及如何使用它。\n\
    \n## 指定字幕、说明和元数据\n\n在上面的示例中，我们省略了 `kind` 属性。它是可选的，但建议带上。`kind` 属性告诉我们的浏览器每个文本轨道的功能，并引导其显示方式。\n\
    \n`kind` 的值可以是以下值之一：\n\n*   `subtitles`：用于提供对话的转录或翻译\n*   `captions`：用于转录和翻译，但专门为听障用户提供描述\n\
    *   `descriptions`：用于在视频组件不可用或用户视障时描述视频组件；合成为音频\n*   `chapters`：用于导航资源，类似于你在 DVD\
    \ 菜单中可能会找到的内容\n*   `metadata`：关于视频的数据，旨在供脚本或机器读取\n\n在这五种类型中，除了 `metadata` 之外，所有的都对用户可见。`descriptions`\
    \ 类型的轨道会被合成成音频，用户将听到而不是看到。字幕和说明都覆盖在视频文件上。对于说明，用户界面可能包含一个闭路字幕按钮，允许用户开启或关闭字幕（图 10.1\"\
    ）。\n\n![Chrome 32 中启用字幕的视频示例。取自 Nina Paley 的 \"Sita Sings the Blues\" 视频截图，(sitasingtheblues.com)](img/track-cc-button-chrome.png)\n\
    \n图 10.1. Chrome 32 中启用字幕的视频示例。取自 Nina Paley 的 \"Sita Sings the Blues\" 视频截图，(sitasingtheblues.com)\n\
    \n章节（Chapters）旨在作为用户界面中的交互式列表显示。然而到为止，没有主流浏览器完全支持此功能。元数据轨道提供有关媒体文件或时间范围的信息，完全不显示给用户。\n\
    \n如果你不设置 `kind` 属性，你的轨道将被视为 `subtitles` 轨道。这是元素的默认状态。当类型为 `subtitles` 时——无论是显式的还是隐式的——你*必须*包含一个\
    \ `srclang` 属性。没有 `srclang` 属性，字幕将无法工作。\n\n### 使用多个 `track` 元素\n\n"
- fmt: "\nThough it's perfectly valid to use multiple `track` elements, doing so is\
    \ not perfectly supported in all browsers. To date, Internet Explorer 10+ and\
    \ Safari 7 are the only browsers that support multiple `track` elements. Both\
    \ browsers provide the user with a menu that allows him or her to select which\
    \ text track he or she would like to use.\n\n![The closed caption button in Chrome,\
    \ when captions are turned on (top) and turned off](figures/chrome-opera-CC-button.png)\n\
    \nFigure 10.2. The closed caption button in Chrome, when captions are turned on\
    \ (top) and turned off\n\nWhen multiple `track` elements are present, Chrome and\
    \ Opera will use the first track element listed. Rather than provide a menu of\
    \ track elements, Chrome and Opera include a CC button (for \"Closed Captioning\"\
    ) that toggles the current set of captions or subtitles on or off ([Figure 10.2](#ch10.html_ccbutton\
    \ \"Figure 10.2. The closed caption button in Chrome, when captions are turned\
    \ on (top) and turned off)).\n\n## Specifying the Language of Your Text Tracks\n\
    \nYou'll also want to include a `srclang` attribute with your `<track>` tag. The\
    \ value of this attribute must be a valid BCP 47 language code. Usually these\
    \ codes are two letters, such as `en` for English, or `de` for German. But they\
    \ could also include a country or region code such as `fr-CA` for Canadian French,\
    \ or `en-GB` for British English.\n\nThere are loads of language and country or\
    \ region codes—too many to list here. Commit the ones you use most to memory.\
    \ Should you need other language and region codes, the best place to find them\
    \ is Richard Ishida's [Language Subtag Lookup](http://people.w3.org/rishida/utils/subtags/)\
    \ tool.\n\nWithout the `srclang` attribute, subtitles will not work (captions\
    \ and descriptions should). When present, some user agents allow the user to choose\
    \ between tracks.\n\n![Selecting a language for subtitles or captions in Safari\
    \ for iOS 7\\. Video still from \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)](figures/track-captions-ios7.png)\n\
    \nFigure 10.3. Selecting a language for subtitles or captions in Safari for iOS\
    \ 7\\. Video still from \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\n\
    \nFor example, Safari for iOS 7 offers the user a captions menu when the video\
    \ is viewed in full screen mode ([Figure 10.3](#ch10.html_selectlanguage \"Figure\
    \ 10.3. Selecting a language for subtitles or captions in Safari for iOS 7\\.\
    \ Video still from \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\"\
    ), above). It uses the value of `srclang` to set the language option in the menu.\n\
    \n![By default, tracks in Internet Explorer are untitled. Video still from \"\
    Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)](figures/track-captions-ie10.png)\n\
    \nFigure 10.4. By default, tracks in Internet Explorer are untitled. Video still\
    \ from \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\n\nThis\
    \ is not the case for Internet Explorer, however. In Internet Explorer 10+ ([Figure\
    \ 10.4](#ch10.html_ieuntitled \"Figure 10.4. By default, tracks in Internet Explorer\
    \ are untitled. Video still from \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\"\
    ), above), tracks listed in the Closed Captions menu are untitled by default.\
    \ To fix this, we need to add the `label` attribute to each of our tracks. As\
    \ of publication, other browsers do not support multiple `track` elements.\n\n\
    ## Labeling Your Tracks\n\nThe `label` attribute is self-explanatory. It defines\
    \ a name or title that the browser can use when exposing the track to the user.\n\
    \n```\n<video src=\"/path/to/media.file\" controls>\n\t<track src=\"/path/to/en-us.vtt\"\
    \ srclang=\"en-US\" \n\tlabel=\"English - USA\">\n\t<track src=\"/path/to/fr.vtt\"\
    \ srclang=\"fr\" \n\tlabel=\"Français\">\n\t<track src=\"/path/to/es-MX.vtt\"\
    \ srclang=\"es-mx\" \n\tlabel=\"Español - México\">\n</video>\n```\n\nWithout\
    \ the `label` attribute, Internet Explorer gives track elements unhelpful default\
    \ titles, as we saw in Figure 3\\. When included, Internet Explorer will instead\
    \ use the value of the `label` attribute in the caption selection menu ([Figure\
    \ 10.5](#ch10.html_labelnamecaption \"Figure 10.5. When tracks have a label attribute,\
    \ the label value becomes the name of the caption option. Video still from \"\
    Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\")).\n\n![When tracks\
    \ have a label attribute, the label value becomes the name of the caption option.\
    \ Video still from \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)](figures/track-captions-ie10-with-labels.png)\n\
    \nFigure 10.5. When tracks have a `label` attribute, the label value becomes the\
    \ name of the caption option. Video still from \"Sita Sings the Blues\" by Nina\
    \ Paley (sitasingstheblues.com)\n\nSafari handles labels a bit differently. Each\
    \ label in Safari includes the label and the language in its captions and subtitles\
    \ menu. To date, neither Firefox, Chrome, nor Opera make multiple tracks available\
    \ to the user.\n\n![Safari includes both the label and the language.](figures/track-labels-safari6_1.png)\n\
    \nFigure 10.6. Safari includes both the label and the language.\n\nWhen selecting\
    \ labels for your tracks, keep the following in mind:\n\n* Avoid duplicating labels.\
    \ It's confusing for the user.\n* Labels should describe the content and/or purpose\
    \ of the track (for example: \"English - Fully captioned\").\n* Labels are not\
    \ a substitute for a `srclang` attribute.\n\n## Creating Text Tracks With WebVTT\n\
    \nWebVTT is the most widely-supported text format for HTML5 captioning. Both Chrome\
    \ and Internet Explorer support it, and World Wide Web consortium members are\
    \ working to standardize the syntax for all browsers. We will show a few examples\
    \ here. For a fuller discussion of WebVTT, consult the [WebVTT draft specification](http://dev.w3.org/html5/webvtt).\n\
    \n### What is WebVTT?\n\nWebVTT is a simple, structured text format used to provide\
    \ metadata, subtitles, and captions for web-based audio and video. Though technically\
    \ plain text, WebVTT files must be served with a `Content-type: text/vtt` response\
    \ header. Sending a response header does require adjusting your server configuration.\
    \ Consult your server documentation or your web host's support team to learn how\
    \ to do this.\n\nWebVTT files must also use UTF-8 encoding. Check the settings\
    \ or preferences for your text editor. It should use UTF-8 character encoding,\
    \ and Unix/Linux line endings. (This should actually be your default since it's\
    \ also required of HTML5.) You may also wish to adjust your server configuration\
    \ to include a charset parameter with the `Content-type` header. This will make\
    \ the full response header `Content-type: text/vtt; charset=UTF-8`. Again, consult\
    \ your server documentation or your web hosting support team.\n\n### Creating\
    \ a Simple WebVTT File\n\nThe first line of a WebVTT file must begin with the\
    \ string `WEBVTT`. You may see examples online that start with `WEBVTT FILE`.\
    \ The `WEBVTT` part is what's important here. A blank line must separate this\
    \ string from the rest of your file.\n\nWebVTT files consist of a series of cues.\
    \ Each cue is made of a time range and a subtitle or caption. Times should use\
    \ an *hh:mm:ss.mls* format, where *hh* is the number of hours, *mm* is minutes,\
    \ *ss* is seconds, and *mls* are the number of milliseconds. For a cue that should\
    \ appear on screen at 1 hour, 33 minutes, and 58.3 seconds, you'd use `01:33:58.300`.\n\
    \nYou may leave off a leading zero for hours, but only for hours. This means our\
    \ previous cue could also be written as `1:33:58.300`. Minutes and seconds, however,\
    \ must be expressed using two digits. Milliseconds must use three, zero padding\
    \ if necessary.\n\nStart and end times for each cue must be separated by, `-->`.\
    \ If, for example, your cue should start 30 seconds into your media file, and\
    \ end 45.4 seconds into it, you'd note that like so.\n\n```\n00:00:30.000 -->\
    \ 00:00:45.400\n```\n"
