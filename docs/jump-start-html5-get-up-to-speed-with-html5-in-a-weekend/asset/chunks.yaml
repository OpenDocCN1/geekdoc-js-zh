  trans: "\n\n与任何事务一样，第一步是创建一个事务对象。接下来，选择商店。最后，使用 `openCursor` 方法打开一个 `cursor`（游标）。游标是由范围记录组成的对象。它是一种允许我们遍历记录集合的特殊机制：\n\
    \n```javascript\nfunction showAllEntries(){\n  var transaction, objectstore, cursor;\n\
    \n  transaction = databaseObj.transaction(['entries'],'readonly');\n  objectstore\
    \ = transaction.objectStore('entries');\n  cursor      = objectstore.openCursor();\n\
    };\n```\n\n由于我们希望在事务完成后显示条目，让我们为我们的游标操作添加一个 `onsuccess` 处理器：\n\n```javascript\n\
    function showAllEntries(){\n  var transaction, objectstore, cursor;\n\n  transaction\
    \ = databaseObj.transaction(['entries'],'readonly');\n  objectstore = transaction.objectStore('entries');\n\
    \  cursor      = objectstore.openCursor();\n\n  cursor.onsuccess = function(successEvent)\
    \ {\n    var resultset = successEvent.target.result;\n    if( resultset ){\n \
    \     buildList( resultset.value );\n    }\n    resultset.continue();\n  };\n\
    };\n```\n\n在此处理器函数内部，我们把搜索的每个结果传递给 `buildList` 函数。我们在这里不会讨论该函数，但它包含在本章的代码示例中。\n\
    \n最后一行——`resultset.continue()`——就是我们遍历结果集的方法。`onsuccess` 处理器会在整个事务期间调用一次，但此事务可能会返回多个结果。`continue`\
    \ 方法会推进游标，直到我们完成对每条记录的遍历。\n\n### 获取记录子集\n\n在 IndexedDB 中，我们还可以通过向 `openCursor()`\
    \ 方法传递一个键范围（key range）来选择记录的子集或 `range`。\n\n键范围是通过 `IDBKeyRange` 对象创建的。`IDBKeyRange`\
    \ 是所谓的 `static` 对象，它的工作方式与 `Math()` 对象类似。正如同你会直接输入 `Math.round()` 而不是 `var m =\
    \ new Math()` 一样，对于 `IDBKeyRange`，你必须始终使用 `IDBKeyRange.methodName()`。\n\n在这个示例中，我们仅使用\
    \ `lowerBound` 方法设置了一个下边界。它的值应该是我们想要检索的最低键值。在这种情况下，我们将使用 `0`，因为我们想要检索对象存储中的所有记录，从第一条开始：\n\
    \n```javascript\nobjectstore.openCursor(IDBKeyRange.lowerBound(0));\n```\n\n如果我们想设置一个上限，则可以使用\
    \ `upperBound` 方法。它也接受一个参数，该参数必须是我们想要在该范围内检索的最高键值：\n\n```javascript\nobjectstore.openCursor(IDBKeyRange.upperBound(1385265768757));\n\
    ```\n\n默认情况下，`openCursor` 按键的升序排序记录。然而，我们可以通过添加第二个参数来更改游标的方向及其排序方向。这第二个参数可以是四个值之一：\n\
    \n*   `next`：将游标置于源的开头，使键按升序排序\n\n*   `prev`：“previous”的缩写，将游标置于源的末尾，使键按降序排序\n\
    \n*   `nextunique`：按键升序返回唯一值\n\n*   `prevunique`：按键降序返回唯一值\n\n要按降序显示这些条目（最新条目优先），请将\
    \ `objectstore.openCursor(IDBKeyRange.lowerBound(0))` 改为 `objectstore.openCursor(IDBKeyRange.lowerBound(0),\
    \ 'prev')`。\n\n### 获取或删除单个条目\n\n但如果我们只想获取单个条目而不是整个商店呢？对于此，我们可以使用 `get` 方法：\n\n\
    ```javascript\nvar transaction, objectstore, request;\n\ntransaction    = databaseObj.transaction(['entries'],'readonly');\n\
    objectstore = transaction.objectStore('entries');\nrequest = request.get(1);\n\
    \nrequest.onsuccess = function(event) {\n  var result = event.target.result;\n\
    \  console.log(result);\n};\n```\n\n当我们要删除一个条目时，使用 `delete` 方法：\n\n```javascript\n\
    var transaction, objectstore, request;\n\ntransaction    = databaseObj.transaction(['entries'],'readwrite');\n\
    objectstore = transaction.objectStore('entries');\nrequest = objectstore.delete(1);\n\
    \nrequest.onsuccess = function(event) {\n  console.log(\"Entry deleted\");\n};\n\
    ```\n\n### 更新记录\n\n当我们要更新条目时，我们使用 `put` 方法。这将用新对象替换整个对象。\n\n```javascript\nvar\
    \ transaction, objectstore, request;\n\ntransaction    = databaseObj.transaction(['entries'],'readwrite');\n\
    objectstore = transaction.objectStore('entries');\nrequest = objectstore.put({id:\
    \ 1, name: 'New Name'});\n\nrequest.onsuccess = function(event) {\n  console.log(\"\
    Entry updated\");\n};\n```\n\n### 删除数据库\n\n删除数据库与打开数据库一样简单。它不需要使用回调。只需调用 IndexedDB\
    \ 对象的 `deleteDatabase` 方法即可：\n\n```javascript\nindexedDB.deleteDatabase('myIDB');\n\
    ```\n\n它接受一个参数：你想删除的数据库名称。请谨慎使用。\n\n### 总结与进阶\n\n通过离线技术，你可以开发无需互联网连接即可运行的应用程序。我们在书中介绍了离线应用程序的基础知识。如果你想更多地了解这些主题，一个很好的起点是\
    \ [WebPlatform.org](http://webplatform.org/)。它提供了关于 HTML5、CSS、JavaScript 和 Web\
    \ API 的教程和文档。\n\n特定厂商网站也有丰富的信息，特别是在记录浏览器特定的特殊性方面。然而，Google 的 [HTML5Rocks.com](http://html5rocks.com/)\
    \ 和上述的 Mozilla 开发者网络（Mozilla Developer Network）在记录其浏览器中的新技术方面表现出色，同时也处理了其他厂商的实现。[Microsoft\
    \ Developer Network](http://msdn.microsoft.com/) 包含了大量关于网络技术的文档，特别是 Edge 中支持的部分。\n\
    \n要跟踪规范，请关注 [万维网联盟 (W3C)](http://w3.org/) 和 [Web 超文本应用技术工作组 (WHATWG)](http://whatwg.org/)。这些机构为当前和未来的\
    \ API 开发规范和文档。\n\n当然，你也可以访问 [Learnable.com](https://learnable.com/) 或 [SitePoint.com](http://www.sitepoint.com/)\
    \ 来获取 Web 技术的最新动态。\n\n"
- fmt: "\nIn this chapter, we’ll make a quick trip to the world of HTML5 APIs. I’ll\
    \ outline the APIs that are going to be discussed in this book, and what you’ll\
    \ have learned by the end. There’ll be no diving into any code in this chapter;\
    \ rather, it will provide a quick overview of each API so that you can get a clear\
    \ idea about what you’re going to learn.\n\nSome HTML5 APIs are still fairly new,\
    \ and not every version of every browser supports them, which you’ll need to bear\
    \ in mind while creating HTML5 apps. Whenever you’re going to use any HTML5 API,\
    \ it’s always a good idea to check the support for that API in the browser. We’ll\
    \ see how to do that in the last section of the chapter.\n\n## A Quick Tour of\
    \ the HTML5 APIs Covered\n\nSince this is a short book, it’s impossible to cover\
    \ each and every API. Some APIs are already covered in other books in SitePoint’s\
    \ Jump Start HTML5 range. In this book we’ll focus on five important JavaScript\
    \ APIs that you can use to create really cool web apps. (Yes, web apps built with\
    \ plain HTML5 and JavaScript! How cool is that?) So, let’s see what we’ll be discussing:\n\
    \n* **The Web Workers API**: Ever thought of bringing multi-threading to the Web?\
    \ Have you every fancied performing some ongoing task in the background without\
    \ hampering the main JavaScript thread? If yes, it’s probably time for you to\
    \ get cozy with the Web Workers API because it’s designed just for this purpose.\n\
    \    * **Formal definition:** The ` Workers API` is used to run scripts in a background\
    \ thread that run in parallel to the main thread. In other words, you can perform\
    \ computationally expensive tasks or implement long polling in the background\
    \ and your main UI thread will remain unaffected.\n* **The Geolocation API**:\
    \ This new API simply lets you know where your users are. It enables you to find\
    \ the position of your users—even when they are moving. Furthermore, you can show\
    \ them customized choices (maybe a nice café or a theater near them) depending\
    \ on their location, or plot their position on the map.\n    * **Formal definition:**\
    \ The `Geolocation API` lets your application receive the current geographical\
    \ position of the user through simple JavaScript.\n* **The Server-sent Events\
    \ API**: The way Facebook pushes new updates to your wall is awesome, isn’t it?\
    \ Prior to the introduction of Server-sent Events (SSE, for short) this type of\
    \ functionality was achieved using long polling. But with the all new SSEs, the\
    \ server can automatically push new updates to the web page as they become available.\
    \ You can access those updates in your script and notify your users.\n    * **Formal\
    \ definition:** The `Server-sent Events API` lets your clients receive push notifications\
    \ from the server without the need of long polling.\n* **The WebSocket API**:\
    \ This API helps you build applications that allow bi-directional communication\
    \ between client and server. The classic use case of the `WebSocket API` is a\
    \ chat application where a client sends a message to the server and the server\
    \ processes it and replies back!\n    * **Formal definition:** This API enables\
    \ low-latency, full-duplex single-socket connection between client and server.\n\
    * **The Cross-document Messaging API**: Because of dreaded CSRF attacks, documents\
    \ from different domains are usually not allowed to communicate with each other.\
    \ But with this new Cross-document Messaging API, documents from different origins\
    \ can communicate with each other while still being safe against CSRF.\n    *\
    \ **Formal Definition:** This API introduces a messaging system that allows documents\
    \ to communicate with each other—regardless of the source domain—without CSRF\
    \ being a problem.\n\n### Note: Cross-site Request Forgery (CSRF)\n\nCSRF is a\
    \ type of attack that tricks end users to perform sensitive operations on a web\
    \ application without their knowledge. Typically, websites only verify if the\
    \ request is coming from the browser of an authenticated user, but they don’t\
    \ verify if the actual authenticated user himself is making the request. That’s\
    \ the common cause of a CSRF attack.\n\nTo learn more about CSRF attacks, please\
    \ visit the [Open Web Application Security Project.](https://www.owasp.org/index.php/Cross-Site_Request_Forgery_(CSRF))\n\
    \n## What You Are Going to Learn\n\nThis book will provide clear and concise explanations\
    \ of the APIs just mentioned. You will learn the purpose of each API and how to\
    \ use them. By the end of the book, you’ll be able to create cool and exciting\
    \ apps using some amazing HTML5 features.\n\nWhile explaining the APIs, I will\
    \ provide some code snippets that describe the general working principle of them.\
    \ Since this is a short book, it’s impossible to cover everything exhaustively,\
    \ but I will try to cover as much as possible in each chapter. I’ll also provide\
    \ guidance and share example use cases for each of the APIs.\n\n## Getting Started\n\
    \nBefore diving into the world of HTML5, there is a caveat of which to be aware.\
    \ As mentioned, some HTML5 APIs are quite new so you should always make sure the\
    \ specific feature is supported in the browsers. If there’s no (or limited) support,\
    \ you should handle it gracefully by falling back to another technique. This is\
    \ known as `graceful degradation`; in other words, your app is designed for modern\
    \ browsers but it is still functional in older browsers. On the other hand you\
    \ could also opt for `progressive enhancement techniques`, where you create an\
    \ app with limited functionalities and add new features when the browser supports\
    \ them. For more information on this, have a look at [Craig Buckler’s article\
    \ on sitepoint.com.](http://www.sitepoint.com/progressive-enhancement-graceful-degradation-choice)\n\
    \nIn this section, we will discuss addressing the browser compatibility issues\
    \ and setting up the development environment.\n\n### Checking Browser Compatibility\n\
    \nIt’s always good to obtain an overview of the list of HTML5 features supported\
    \ by the browsers. Before using any API, refer to a compatibility chart that shows\
    \ which browsers support that API. Personally, I prefer [caniuse.com](http://caniuse.com)\
    \ where you just start typing the name of the API and it shows the browser versions\
    \ that support it; however, although a compatibility chart gives an overview,\
    \ you should always check for browser compatibility of API features in your JavaScript\
    \ code.\n\nEach HTML element is represented by an object inside the DOM, and each\
    \ object has several properties. So, in browsers that support HTML5 APIs, certain\
    \ objects will have a set of unique properties. This is the key to determining\
    \ the browser’s support for various HTML5 features.\n\nSupport for some HTML5\
    \ features can be detected just by checking the existence of certain properties\
    \ on the `window` or `navigator` objects. For example, you can write the following\
    \ code to check the support for Web Workers:\n\n```\nif(!!window.Worker){\n  \
    \  //proceed further\n}\nelse{\n    //do something else\n}\n```\n\nAs you can\
    \ see, in Web Worker-enabled browsers there will be a property called `Worker`\
    \ in the `window` object.\n\nSimilar techniques can also be used to detect the\
    \ support for other features. We will see how to detect each feature when we examine\
    \ the details of each API.\n\n### Modernizr\n\nWouldn’t it be great if there was\
    \ a uniform interface for checking the support for each API? Well, it just so\
    \ happens there is an open-source JavaScript library that helps detect HTML5 features:\
    \ [Modernizr.](http://modernizr.com/)\n\nUsing Modernizr is a matter of downloading\
    \ the script and adding the following code to the `<head>` element:\n\n```\n<script\
    \ type=\"text/javascript\" src=\"modernizr.min.js\">\n```\n\n### Note: Always\
    \ put Modernizr in Your `<head>`\n"
  raw: "In this chapter, we’ll make a quick trip to the world of HTML5 APIs. I’ll\
    \ outline the APIs that are going to be discussed in this book, and what you’ll\
    \ have learned by the end. There’ll be no diving into any code in this chapter;\
    \ rather, it will provide a quick overview of each API so that you can get a clear\
    \ idea about what you’re going to learn.\n\nSome HTML5 APIs are still fairly new,\
    \ and not every version of every browser supports them, which you’ll need to bear\
    \ in mind while creating HTML5 apps. Whenever you’re going to use any HTML5 API,\
    \ it’s always a good idea to check the support for that API in the browser. We’ll\
    \ see how to do that in the last section of the chapter.\n\n## A Quick Tour of\
    \ the HTML5 APIs Covered\n\nSince this is a short book, it’s impossible to cover\
    \ each and every API. Some APIs are already covered in other books in SitePoint’s\
    \ Jump Start HTML5 range. In this book we’ll focus on five important JavaScript\
    \ APIs that you can use to create really cool web apps. (Yes, web apps built with\
    \ plain HTML5 and JavaScript! How cool is that?) So, let’s see what we’ll be discussing:\n\
    \n*   *The Web Workers API*: Ever thought of bringing multi-threading to the Web?\
    \ Have you every fancied performing some ongoing task in the background without\
    \ hampering the main JavaScript thread? If yes, it’s probably time for you to\
    \ get cozy with the Web Workers API because it’s designed just for this purpose.\n\
    \n    *   **Formal definition:** The Web Workers API is used to run scripts in\
    \ a background thread that run in parallel to the main thread. In other words,\
    \ you can perform computationally expensive tasks or implement long polling in\
    \ the background and your main UI thread will remain unaffected.\n\n*   *The Geolocation\
    \ API*: This new API simply lets you know where your users are. It enables you\
    \ to find the position of your users—even when they are moving. Furthermore, you\
    \ can show them customized choices (maybe a nice café or a theater near them)\
    \ depending on their location, or plot their position on the map.\n\n    *   **Formal\
    \ definition:** The Geolocation API lets your application receive the current\
    \ geographical position of the user through simple JavaScript.\n\n*   *The Server-sent\
    \ Events API*: The way Facebook pushes new updates to your wall is awesome, isn’t\
    \ it? Prior to the introduction of Server-sent Events (SSE, for short) this type\
    \ of functionality was achieved using long polling. But with the all new SSEs,\
    \ the server can automatically push new updates to the web page as they become\
    \ available. You can access those updates in your script and notify your users.\n\
    \n    *   **Formal definition:** The Server-sent Events API lets your clients\
    \ receive push notifications from the server without the need of long polling.\n\
    \n*   *The WebSocket API*: This API helps you build applications that allow bi-directional\
    \ communication between client and server. The classic use case of the WebSocket\
    \ API is a chat application where a client sends a message to the server and the\
    \ server processes it and replies back!\n\n    *   **Formal definition:** This\
    \ API enables low-latency, full-duplex single-socket connection between client\
    \ and server.\n\n*   *The Cross-document Messaging API:* Because of dreaded CSRF\
    \ attacks, documents from different domains are usually not allowed to communicate\
    \ with each other. But with this new Cross-document Messaging API, documents from\
    \ different origins can communicate with each other while still being safe against\
    \ CSRF.\n\n    *   **Formal Definition:** This API introduces a messaging system\
    \ that allows documents to communicate with each other—regardless of the source\
    \ domain—without CSRF being a problem.\n\n### Note: Cross-site Request Forgery\
    \ (CSRF)\n\nCSRF is a type of attack that tricks end users to perform sensitive\
    \ operations on a web application without their knowledge. Typically, websites\
    \ only verify if the request is coming from the browser of an authenticated user,\
    \ but they don’t verify if the *actual* authenticated user himself is making the\
    \ request. That’s the common cause of a CSRF attack.\n\nTo learn more about CSRF\
    \ attacks, please visit the [Open Web Application Security Project.](https://www.owasp.org/index.php/Cross-Site_Request_Forgery_(CSRF))\n\
    \n## What You Are Going to Learn\n\nThis book will provide clear and concise explanations\
    \ of the APIs just mentioned. You will learn the purpose of each API and how to\
    \ use them. By the end of the book, you’ll be able to create cool and exciting\
    \ apps using some amazing HTML5 features.\n\nWhile explaining the APIs, I will\
    \ provide some code snippets that describe the general working principle of them.\
    \ Since this is a short book, it’s impossible to cover everything exhaustively,\
    \ but I will try to cover as much as possible in each chapter. I’ll also provide\
    \ guidance and share example use cases for each of the APIs.\n\n## Getting Started\n\
    \nBefore diving into the world of HTML5, there is a caveat of which to be aware.\
    \ As mentioned, some HTML5 APIs are quite new so you should always make sure the\
    \ specific feature is supported in the browsers. If there’s no (or limited) support,\
    \ you should handle it gracefully by falling back to another technique. This is\
    \ known as ***graceful degradation***; in other words, your app is designed for\
    \ modern browsers but it is still functional in older browsers. On the other hand\
    \ you could also opt for ***progressive enhancement techniques***, where you create\
    \ an app with limited functionalities and add new features when the browser supports\
    \ them. For more information on this, have a look at [Craig Buckler’s article\
    \ on sitepoint.com.](http://www.sitepoint.com/progressive-enhancement-graceful-degradation-choice)\n\
    \nIn this section, we will discuss addressing the browser compatibility issues\
    \ and setting up the development environment.\n\n### Checking Browser Compatibility\n\
    \nIt’s always good to obtain an overview of the list of HTML5 features supported\
    \ by the browsers. Before using any API, refer to a compatibility chart that shows\
    \ which browsers support that API. Personally, I prefer [caniuse.com](http://caniuse.com)\
    \ where you just start typing the name of the API and it shows the browser versions\
    \ that support it; however, although a compatibility chart gives an overview,\
    \ you should *always* check for browser compatibility of API features in your\
    \ JavaScript code.\n\nEach HTML element is represented by an object inside the\
    \ DOM, and each object has several properties. So, in browsers that support HTML5\
    \ APIs, certain objects will have a set of unique properties. This is the key\
    \ to determining the browser’s support for various HTML5 features.\n\nSupport\
    \ for some HTML5 features can be detected just by checking the existence of certain\
    \ properties on the `window` or `navigator` objects. For example, you can write\
    \ the following code to check the support for Web Workers:\n\n```\nif(!!window.Worker){\n\
    \    //proceed further\n}\nelse{\n    //do something else\n}\n```\n\nAs you can\
    \ see, in Web Worker-enabled browsers there will be a property called `Worker`\
    \ in the `window` object.\n\nSimilar techniques can also be used to detect the\
    \ support for other features. We will see how to detect each feature when we examine\
    \ the details of each API.\n\n#### Modernizr\n\nWouldn’t it be great if there\
    \ was a uniform interface for checking the support for each API? Well, it just\
    \ so happens there is an open-source JavaScript library that helps detect HTML5\
    \ features: [Modernizr.](http://modernizr.com/)\n\nUsing Modernizr is a matter\
    \ of downloading the script and adding the the following code to the `<head>`\
    \ element:\n\n```\n<script type=\"text/javascript\" src=\"modernizr.min.js\">\n\
    ```\n\n### Note: Always put Modernizr in Your `<head>`"
