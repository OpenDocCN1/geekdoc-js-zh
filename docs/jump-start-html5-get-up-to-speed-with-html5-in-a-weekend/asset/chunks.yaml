  trans: "\n\nOpera 12（及旧版本）完全不会触发 `online` 或 `offline` 事件。然而，当用户断开网络时，它会向 `navigator.onLine`\
    \ 返回 `false`，在连接时返回 `true`。\n\n桌面版和笔记本电脑版的 Firefox 是一个特殊情况。它触发 `offline` 或 `online`\
    \ 事件取决于用户的活动。当用户选择“离线工作”菜单选项时，Firefox 会触发 `offline` 事件；当用户取消时，会触发 `online` 事件。这与是否存在功能性的互联网连接完全无关。即使用户已经断开网络，只要用户没有选择离线工作，`navigator.onLine`\
    \ 的值也将是 `true`。\n\n然而，Android 版 Firefox 和 Firefox OS 的工作方式不同。这些版本的浏览器在连接性丢失或关闭（例如开启飞行模式）时会触发\
    \ `online` 和 `offline` 事件。\n\n然而，所有浏览器都困难的地方在于存在*网络*连接但没有互联网连接的情况。如果浏览器可以连接到局域网，即使从局域网到更广泛的互联网的连接中断，`navigator.onLine`\
    \ 的值也将是 `true`。\n\n换句话之，`navigator.onLine` 属性可能无法告诉你你想知道的信息。因此，我们需要使用替代方案。\n\n\
    ## 使用 `XMLHttpRequest` 检查连接性\n\n确定连接性的更好方法是在网络请求时进行。我们可以使用 `XMLHttpRequest` 及其\
    \ `error` 和 `timeout` 事件来实现这一点。\n\n在这个示例中，我们将尝试将表单的内容发送到服务器。如果没有连接，或者连接完成所需时间过长，我们将数据保存到\
    \ `localStorage` 中并通知用户。\n\n首先，让我们定义 `error` 和 `timeout` 事件处理器：\n\n```\nvar form\
    \ = document.querySelector('form');\nvar xhrerrorhandler = function(errorEvent){\n\
    \    var i = 0;\n    // 如果有值，则保存它\n    while(i < form.length){\n        if(form[i].value\
    \ != ''){\n            localStorage.setItem(form[i].name, form[i].value);\n  \
    \      }   \n        i++;\n    }   \n}\n```\n\n我们将为这两个事件使用同一个函数，因为我们想在两种情况下都执行相同的任务。该函数将每个表单字段名称保存为\
    \ `localStorage` 的键（key），并将每个字段对应的值保存为 `localStorage` 的值（value）。\n\n接下来，让我们定义提交事件处理器。此函数将创建\
    \ XHR 请求，监控其是否失败，并添加我们的错误处理器：\n\n```\nsubmithandler = function(submitEvent){\n\
    \    var fd, ls, i=0, key;\n\n    // 阻止表单提交\n    submitEvent.preventDefault();\n\
    \n    // 如果有 localStorage 数据，则根据它构建一个 FormData 对象\n    // 否则，直接使用表单\n    if( localStorage.length\
    \ > 0){\n        fd = new FormData();\n        ls = localStorage.length;\n   \
    \     while(i < ls){\n            key = localStorage.key(0);\n            fd.append(key,\
    \ localStorage.getItem(key));\n            i++;\n        }\n    } else {\n   \
    \     fd = new FormData(form);\n    }\n\n    // 为慢连接设置超时\n    xhr.timeout = 3000;\n\
    \    xhr.open('POST','return.php');\n    xhr.send(fd);\n\n    // 设置我们的错误处理器。\n\
    \    xhr.addEventListener('timeout', xhrerrorhandler);\n    xhr.addEventListener('error',\
    \ xhrerrorhandler);\n}\nform.addEventListener('submit', submithandler);\n```\n\
    \n在此函数中，如果存在 `localStorage` 数据，我们将将其添加到 `FormData` 对象中。然后，我们将 `FormData` 对象作为请求的负载发送。\n\
    \n`FormData` 是 [XMLHttpRequest, Level 2 规范。](http://www.w3.org/TR/XMLHttpRequest/)\
    \ 的一部分。它使用 `append()` 方法（`append(key,value)`）接受一系列键值对。或者，你也可以将表单对象作为参数传递给构造函数。在这里，我们根据是否向\
    \ `localStorage` 保存了任何内容做了这两种尝试。此演示更健壮的版本可以使用独立的功能来处理：一个用于发送表单数据，另一个用于与服务器同步。\n\
    \n如果服务器响应包含 HTTP 错误代码，这种方法将不起。你可以通过检查 XHR 响应中 `status` 属性的值来绕过这个问题，如下：\n\n```\n\
    var xhronloadhandler = function(loadEvent){\n    if( loadEvent.target.status >=\
    \ 400){\n        xhrerrorhandler();\n    } else {\n        // 解析响应。\n    }\n}\n\
    ```\n\n如果是 400 或更大——HTTP 错误代码从 400 开始——我们将数据保存数据。否则，解析响应。\n\n## 你学到了什么\n\n在本章中，我们讨论了\
    \ `navigator.onLine` 属性的优势和局限性，这是测试连接性的另一种方法。现在让我们讨论允许创建离线 Web 应用程序的浏览器功能和 API。在下一章中，我们将查看应用程序缓存。\n\
    \n# 第 23 章：离线应用：应用程序缓存\n\n应用程序缓存（简称 AppCache）提供了一种本地保存应用程序资源的方法，以便在没有互联网连接的情况下使用它们。它特别适用于由\
    \ JavaScript 驱动并使用 `localStorage` 和 `IndexedDB` 等本地数据存储的“单页”应用程序。\n\nAppCache\
    \ 由两部分组成：称为 *manifest*（清单）的文本文件，以及用于脚本和帮助管理更新的 DOM 接口。在本章结束时，你将了解如何编写缓存清单文件、如何管理更新，以及使用此\
    \ API 时需要注意的一些方面。\n\n### 注意：IE 中的 AppCache\n\nInternet Explorer 9 或更低版本不支持应用程序缓存。你需要使用版本\
    \ 10 或更高版本。有关支持 AppCache 的浏览器完整列表，请尝试 [CanIUse.com.](http://caniuse.com/#search=appcache)\n\
    \n## 缓存清单语法\n\n缓存清单文件是文本文件，但它们必须遵守清单语法。让我们来看一个示例：\n\n```\nCACHE MANIFEST\n\n#\
    \ 这些文件将被保存到本地。这是一行注释。\nCACHE:\njs/todolist.js\ncss/style.css\n```\n\n每个缓存清单都必须以\
    \ `CACHE MANIFEST` 行开头。注释必须以 `#` 开头。注意每个文件也单独列出。\n\n`CACHE:` 行是一个节头部。总共有四个定义的节头部：\n\
    \n*   `CACHE:` 明确哪些文件应该存储在本地\n*   `NETWORK:` 明确说明哪些 URL 应该始终检索\n*   `FALLBACK:`\
    \ 指定当 URL 不可用时应该显示哪个本地可用文件\n*   `SETTINGS:` 定义缓存设置\n\n### 使用 `CACHE:` 节头部将文件保存到本地\n\
    \n`CACHE:` 是唯一的，因为它是一个可选的节头部——而且它是唯一的一个。我们的缓存清单示例也可以不带它来编写：\n\n```\nCACHE MANIFEST\n\
    \n# 这些文件将被保存到本地。这是一行注释。\njs/todolist.js\ncss/style.css\n```\n\n在这种情况下，`js/todolist.js`\
    \ 和 `css/style.css` 将被本地缓存，因为它们遵循了我们的 `CACHE:` 节头部。链接到我们清单的页面也会被缓存，尽管我们没有明确说明它应该被保存。\n\
    \n"
