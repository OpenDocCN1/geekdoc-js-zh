  trans: "\n\n这些新元素的目的是提供一种标准化的方式来描述文档结构。HTML 的本质是一种用于交换和重用文档的语言。使用这些结构化元素意味着同一个文档可以发布为网页，同时为电子书阅读器分发，而无需在混乱的任意\
    \ `div` 元素和 `id` 属性中筛选。\n\n## `section` 元素\n\nHTML5 还引入了 `section` 元素，用于定义文档中既不是页眉、页脚、导航、文章或侧边栏的片段。它比我们的老朋友\
    \ `div` 元素更具体，但比 `article` 更通用。\n\n让我们使用 `section` 元素来标记 *HTML5 News-Press* 首页，如图图\
    \ 3.2 所示。\n\n![HTML5 News-Press 首页](img/html5newspress.png)\n\n图 3.2. HTML5 News-Press\
    \ 首页\n\n这里有三个新闻故事章节：“头条新闻”、“体育”和“商业”。在 HTML 4 中，`div` 元素是定义这些章节的明确选择，因为它是唯一的选择。但在\
    \ HTML5 中，我们有了更具描述性的 `section` 元素。\n\n```\n<section id=\"topstories\">\n  <h1>Top\
    \ stories</h1>\n\n  <ul>\n    <li><a href=\"#\">小鸡领说：天空即将坠落 \n    ↵领袖</a></li>\n\
    \    <li><a href=\"#\">大狼吹倒了树枝和草搭的房子</a></li>\n    <li><a href=\"#\">面包屑路径失踪后，孩子们失踪\
    \ \n    ↵后被发现安全无事</a></li>\n    <li><a href=\"#\">牛跳过月亮，目击者们 \n    ↵震惊不已</a></li>\n\
    \  </ul>\n\n  <footer>\n    <p><a href=\"#\" class=\"mlink\">更多新闻</a></p>\n  </footer>\n\
    </section>\n\n<section id=\"sports\">\n  <h1>Sports</h1>\n\n  <ul>\n    <li><a\
    \ href=\"#\">大卫在冷门中击败了歌利亚</a></li>\n    <li><a href=\"#\">好队以 3-2 战胜恶势力</a></li>\n\
    \    <li><a href=\"#\">当地游泳选手入围 2016 \n    ↵奥运会</a></li>\n    <li><a href=\"#\"\
    >Woonsocket 小联盟队晋级 \n    ↵半决赛</a></li>\n  </ul>\n\n  <footer>\n    <p><a href=\"\
    #\" class=\"mlink\">更多体育</a></p>\n  </footer>\n</section>\n\n<section id=\"business\"\
    >\n  <h1>Business</h1>\n  <ul>\n    <li><a href=\"#\">BigWidgets, Ltd. 扩张业务将创造\
    \ 3,000 个 \n    ↵工作岗位</a></li>\n    <li><a href=\"#\">美元、欧元实现平价</a></li>\n   \
    \ <li><a href=\"#\">GiantAirline 和 Air Humongous 将合并</a></li>\n    <li><a href=\"\
    #\">WorldDomination 银行被认为“大到不能 \n    ↵倒”</a></li>\n  </ul>\n\n  <footer>\n   \
    \ <p><a href=\"#\" class=\"mlink\">更多商业</a></p>\n  </footer>\n</section>\n```\n\
    \n### `div` 与 `section`\n\n虽然这些新的分节元素为我们提供了更好的语义化，但它们也带来了一丝困惑。你可能会问的问题是：“继续使用\
    \ `div` 元素还可以吗？”\n\n简短的回答是“可以”。毕竟，`div` 仍然是一个有效的 HTML5 元素。但 `div` 几乎没有语义价值。它没有告诉我们任何关于其包含内容的信息，因此只有在极少数没有其他语义相关标签存在的情况下，才考虑使用它。例如，你可能会发现自己需要添加一个额外的元素作为“包装器”（wrapper）以方便样式设置。或者，你可能想在一个英语文档中将几个法语元素分组。在这种情况下，使用\
    \ `<div lang=\"fr\">` 和 `</div>` 封起来这些元素无疑是恰当的。在大多数其他情况下，最好使用 `section`、`header`、`nav`、`footer`、`article`\
    \ 或 `aside`。\n\n## 其他文档元素\n\n新的分节元素并不是 HTML5 中引入的唯一相关文档元素。在本章，我们将查看以下元素：\n\n*\
    \   `figure` 和 `figcaption` 用于定义插图、图表和图解\n*   `main` 用于显式定义文档内容的主要部分\n\n### `figure`\
    \ 和 `figcaption`\n\n如果文档配有一个图表或图解，在 HTML 4 中，我们可能使用 `div` 和 `p` 元素的组合对其进行标记，如下所示。\n\
    \n```\n<div class=\"graph\" id=\"figure1\">\n  <img src=\"graph.jpg\" alt=\"2008\
    \ 年以来的巧克力价格\">\n  <p class=\"caption\">图 1：巧克力价格自 2008 年以来 \n  ↵上涨了 200%。</p>\n\
    </div>\n```\n\n这是一种可以的方法。但当我们想在那些使用书本布局显示 HTML 文档的高级电子阅读器上阅读它时，会发生什么？使用 `<div\
    \ class=\"chart\">` 并告诉我们这块信息是什么以及它应该如何显示。\n\n在这种情况下，我们应该使用 `figure` 元素。它为我们提供了一种标记图表和标题的方法，并使其独立于文档流。我们稍微修改一下标记如何？\n\
    \n```\n<figure class=\"graph\" id=\"figure1\">\n  <img src=\"graph.jpg\" alt=\"\
    2008 年以来的巧克力价格\">\n  <p class=\"caption\">图 1：巧克力价格自 2008 年以来 \n  ↵上涨了 200%。</p>\n\
    </figure>\n```\n\n现在我们的电子阅读器知道这是一个图表，并可以以合适的方式显示。我们保留了 `class` 和 `id` 属性。前者对于\
    \ CSS 样式很有用——也许我们希望以不同于图解的方式显示图形。后者便于我们链接到图片。\n\n不过我们仍然在使用 `<p class=\"caption\"\
    >`，不是吗？我们改用 `figcaption` 元素怎么样？`figcaption` 作为其兄弟内容的标题或图例。它不是强制要求的，但如果包含，`figcaption`\
    \ 必须是 `figure` 元素的第一个元素或最后一个元素。让我们再次修改我们的标记：\n\n```\n<figure class=\"graph\" id=\"\
    figure1\">\n  <img src=\"graph.jpg\" alt=\"2008 年以来的巧克力价格\">\n  <figcaption>图\
    \ 1：巧克力价格自 2008 年以来 \n  ↵上涨了 200%。</figcaption>\n</figure>\n```\n\n### `main`\
    \ 元素\n\n`main` 元素是 HTML5 中最新的元素之一。它实际上并没有出现在世界维网联盟（W3C）发布的 2011 版本规范中，但它是 HTML\
    \ 5.1 规范的一部分。\n\n意乎情情，`main` 应该用于明确文档或应用程序的主要部分。通过文档的“主要部分”，我们指的是以下内容：\n\n*  \
    \ 文档或应用程序特有的\n*   不包含跨站点共享的元素，例如全局页眉或页脚\n\n截至为止，只有 Chrome 26+、Firefox 21+ 和 Opera\
    \ 15+ 支持 `main` 元素。Internet Explorer 和 Safari 应该在未来的发布中获得支持。\n\n`main` 的用例是什么？某些浏览器（如\
    \ Safari 和 Android 版 Firefox）提供了“阅读模式”，可以剥离页眉、页脚和广告。这些浏览器目前使用启发式算法（一种有理依据的推断）来确定文档的主要内容。使用\
    \ `main` 可以让浏览器明确它应该关注页面的哪部分。浏览器还可以将 `main` 元素作为无障碍功能的钩子，例如跳过导航的功能。\n\n让我们最后看一眼我们的新闻文章标记，这次包含了\
    \ `main` 元素。\n\n"
