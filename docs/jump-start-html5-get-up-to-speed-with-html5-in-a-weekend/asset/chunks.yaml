    \ at the top of the program listing, like this:\n\n`example.css`\n\n```\n.footer\
    \ {\n  background-color: #CCC;\n  border-top: 1px solid #333;\n}\n```\n\nIf only\
    \ part of the file is displayed, this is indicated by the word *excerpt*:\n\n\
    `example.css (excerpt)`\n\n```\n border-top: 1px solid #333;\n```\n\nIf additional\
    \ code is to be inserted into an existing example, the new code will be displayed\
    \ in bold:\n\n```\nfunction animate() {\n  new_variable = \"Hello\";\n}\n```\n\
    \nAlso, where existing code is required for context, rather than repeat all the\
    \ code, a … will be displayed:\n\n```\nfunction animate() {\n  …\n  return new_variable;\n\
    }\n```\n\nSome lines of code are intended to be entered on one line, but we’ve\
    \ had to wrap them because of page constraints. A ↵ indicates a line break that\
    \ exists for formatting purposes only, and should be ignored.\n\n```\nURL.open(\"\
    http://www.sitepoint.com/responsive-web-design-real-user-\n↵testing/?responsive1\"\
    );\n```\n\n### Tips, Notes, and Warnings\n\n### Tip: Hey, You!\n\nTips will give\
    \ you helpful little pointers.\n\n### Note: Ahem, Excuse Me …\n\nNotes are useful\
    \ asides that are related—but not critical—to the topic at hand. Think of them\
    \ as extra tidbits of information.\n\n### Important: Make Sure You Always …\n\n\
    … pay attention to these important points.\n\n### Warning: Watch Out!\n\nWarnings\
    \ will highlight any gotchas that are likely to trip you up along the way.\n\n\
    ## Supplementary Materials\n\n[http://www.sitepoint.com/store/jump-start-html5/](http://www.sitepoint.com/store/jump-start-html5/)\n\
    \nThe book’s website, containing links, updates, resources, and more.\n\n[https://github.com/spbooks/jshtml](https://github.com/spbooks/jshtml)\n\
    \nThe downloadable code archive for this book.\n\n[http://www.sitepoint.com/forums/](http://www.sitepoint.com/forums/)\n\
    \nSitePoint’s forums, for help on any tricky web problems.\n\n[`books@sitepoint.com`](mailto:books@sitepoint.com)\n\
    \nOur email address, should you need to contact us for support, to report a problem,\
    \ or for any other reason.\n\n## Tools You’ll Need\n\nAll you’ll need to develop\
    \ HTML5 documents is a text editor for writing, and a browser for viewing your\
    \ work. Don't use word processing software. Those programs are made for writing\
    \ documents, not for programming. Instead, you’ll need software that can read\
    \ and write plain text.\n\nIf you’re a Windows user, try [Notepad++](http://notepad-plus-plus.org/),\
    \ a free and open-source text editor. Mac OS X users may want to try [TextWrangler](http://www.barebones.com/products/textwrangler/)\
    \ by Bare Bones software. It's free, but not open source. [Brackets](http://brackets.io/)\
    \ is another option for Windows and Mac users. Linux users can use gEdit, which\
