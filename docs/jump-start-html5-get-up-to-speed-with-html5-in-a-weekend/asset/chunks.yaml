  trans: "\n\n## 仅视频属性\n\n虽然大多数适用于 `video` 标签的属性也适用于 `audio`，但有少数（与视觉显示相关的）属性并不适用：\n\
    \n- `height`: 设置视频播放器的高度。\n- `width`: 设置视频播放器的宽度。\n- `poster`: 指定在视频播放前显示的图像。\n\
    \n### 使用 `poster` 进行占位\n\n海报图（poster image）可以充当视频的占位符。它通常是视频中的某帧静态图像，也可以是公司标志、标题界面、图标或其他图像。页面加载后，访问者将看到海报图，直到视频开始播放。\n\
    \n要添加海报图，请添加 `poster` 属性。将其其值设置为图像的路径。大多数图像格式都可以用于海报图，尽管 Internet Explorer 有时处理\
    \ SVG 文件时会遇到困难。\n\n```\n<video src=\"path_to_file.video\" poster=\"path_to_poster_image.jpg\"\
    >\n</video>\n```\n\n请注意海报图的大小。理想情况下，它的尺寸应该与视频相同。初始，视频播放器的尺寸将与海报图的尺寸一致。一旦浏览器确定了视频的固有高度和宽度，就会调整播放器的大小。为视频播放器设置明确的高度和宽度可以防止这种尺寸调整。\n\
    \n### 控制视频尺寸\n\n无论你是否使用海报图，显式设置播放器的高度和宽度都可以防止浏览器在视频加载后重绘页面。当然，一种方法是在 `video` 标签中包含\
    \ `height` 和 `width` 属性。这两个属性都接受百分比，这在构建响应式或流式布局时非常有用。\n\n```html\n<video src=\"\
    path_to_file.video\" poster=\"path_to_poster_image.jpg\" \nwidth=\"100%\" height=\"\
    100%\"></video>\n```\n\n你也可以使用 CSS 设置视频播放器的高度宽。\n\n```css\nvideo {\n  width: 960px;\n\
    \  height: 540px;\n}\n```\n\n在这个示例中，我们使用了像素。对于响应式布局，你可能倾向于使用视口百分比单位：`vh` 和 `vw`。[CSS\
    \ Values and Units Module Level 3](http://www.w3.org/TR/css3-values/) 中列出的任何有效\
    \ CSS 长度单位都是接受的。使用 CSS 设置视频播放器的尺寸将覆盖应用于元素本身的任何 `width` 和 `height` 属性。\n\n## 带宽使用与播放响应性\n\
    \n大多数浏览器在页面加载时，会下载音频或视频文件的一部分。通常，这段媒体片段包含文件的元数据（如持续时间和尺寸）以及几秒钟的可播放数据。当用户启动播放时，浏览器会对文件的剩余部分发起第二次请求。\n\
    \n无论你的访问者是否与媒体文件交互，这些请求每一个都会对服务器产生额外需求。你可以通过 `preload` 属性更改此行为。将其设置为三个可能的值之一：\n\
    \n- `metadata` 告诉浏览器下载文件的一部分是可以接受的。\n- `auto` 告诉浏览器下载它想要下载的视频视频。\n- `none` 告诉浏览器在用户请求之前不要下载任何内容。\n\
    \n使用 `preload=\"auto\"` 可以为用户提供最快的播放体验。浏览器将下载其提供流畅播放所需的尽可能资源。对于短剪片，这可能是整个文件。\n\
    \n使用 `preload=\"none\"`，用户可能会在点击播放控制和媒体播放之间体验到明显的延迟。然而，此选项将导致大多数浏览器下载最少的数据。\n\n\
    ### 注意：在使用 `preload=\"none\"` 时设置明确的视频高宽\n\n在使用 `preload=\"none\"` 时，你可能希望在视频元素本身或使用\
    \ CSS 设置明确的宽高。否则，当视频加载并开始播放时，你可能会触发页面重流（reflow）。\n\n使用 `preload=\"metadata\"`\
    \ 是 `auto` 和 `none` 之间的一种折中方案。在大多数浏览器中，用户请求播放与操作之间不会出现像使用 `preload=\"none\"` 时经常常见的延迟。但由于浏览器预加载了较小部分的媒体文件，播放可能不如\
    \ `preload=\"auto\"` 那样瞬间完成。\n\n## 跨浏览器音频和视频\n\n这听起来好得有些不可相信，不是吗？不需要插件的原生音频和视频！别急。有一件事阻碍着我们：文件格式支持。浏览器厂商对于是否应该有一个默认的多媒体解码器，以及如果有，应该是哪一个存在存在意见。\n\
    \n苹果和微软已决定在他们的浏览器（分别是 Safari 和 Internet Explorer）中支持 H.264/MPEG-4 视频和 MPEG-3 音频。H.264\
    \ 是一种用于显示视频的高清专用格式，通常封装在 MPEG-4 容器中。MPEG-3 是一种音频压缩格式。因为这些格式是专用的，如果浏览器开发者想在他们的软件中添加对这些格式的支持，必须支付许可。\n\
    \nMozilla 和 Opera 反对 H.264 和 MPEG-3 主要是因为那些版税。相反，它们的浏览器（Firefox 和 Opera）支持开源解码器，如\
    \ Ogg Theora 和 WebM。Firefox 确实支持移动设备的 H.264 和 MPEG-3，但不支持桌面电脑和笔记本电脑。Internet Explorer\
    \ 在用户安装了其他解码器的情况下也支持它们。值得的是，Google Chrome 支持上述所有。\n\n“编码大分歧”意味着跨浏览器视频需要两种方法之一：\n\
    \n1. 仅编码 H.264 版本的视频，并使用 Flash 视频容器作为回退，为不支持原生 H.264 的浏览器提供视频。\n2. 将视频编码为多种格式，让浏览器选择播放哪一个。\n\
    \n如果你需要支持旧浏览器，第一种方案最好。例如，Internet Explorer 8 缺乏对音频和视频的支持。如 [Video.js](http://www.videojs.com/)\
    \ 和 [audio.js](http://kolber.github.io/audiojs/) 等 JavaScript 库使用了这种策略。\n\n如果你不需要支持旧浏览器，第二种方案更好。它适用于桌面和移动设备浏览器。我们在这里使用这种方法。\n\
    \n### 注意：转码软件\n\n要将视频从一种格式转码为另一种格式，请尝试 [FFMpeg](http://www.ffmpeg.org/)（命令行工具）或\
    \ [Miro Video Converter](http://www.mirovideoconverter.com/)。两者都是免费开源的，提供 Mac\
    \ OS X、Windows 和 Linux 版本。\n\n### 使用多个视频或音频文件\n\n为了提供多种文件格式，我们需要使用 `source` 元素：每个文件格式一个\
    \ `<source>` 标签。`autoplay`、`loop` 和 `controls` 等属性仍然应该是 `<video>` 或 `<audio>`\
    \ 标签的一部分。但我们的 `src` 属性必须移动到 `<source>` 标签中。\n\n```html\n<audio controls>\n  <source\
    \ src=\"path_to_mpeg3_file.mp3\">\n  <source src=\"path_to_ogg_file.ogg\">\n</audio>\n\
    ```\n\n我们可以为为每个 source 标签添加 `type` 属性。至少，`type` 应该包含一个有效的 MIME 类型。但它也可以像下面所示包含解码器。\n\
    \n```html\n<audio controls>\n  <source src=\"mpeg3_file.mp3\" type=\"audio/mpeg\"\
    > \n  <source src=\"ogg_vorbis_file.ogg\" type=\"audio/ogg; codecs=vorbis\">\n\
    \  <source src=\"ogg_flac_file.oga\" type=\"audio/ogg; codecs=flac\">\n</audio>\
    \ \n```\n\n### 警告：Safari 上的 `preload=none`\n\n在多个源上使用 `preload=none` 可能会防止 Safari\
    \ 下载正确的文件。Safari 6.0.5 在 `preload=none` 时将忽略第一个以外的任何文件。即使用户点击播放，Safari 也不会加载另一个视频源。通过列出\
    \ Safari 兼容的源来避免这种情况。否则，将 `preload` 的值设置为 `metadata` 或 `auto`。\n\n每个浏览器将下载它能够播放的第一个可用文件。\n\
    \n"
- fmt: "\nBefore we begin talking about HTML5's multimedia elements, let's talk about\
    \ preparing your media. Though we can now use native HTML5 elements in most browsers,\
    \ we can't (yet) use the same files in every browser. We touched on this in the\
    \ introduction, but a fuller explanation is appropriate. I've tried my best to\
    \ be fair about it.\n\nSo why can't we use the same files in every browser? The\
    \ short answer is: file formats.\n\n## Codec Showdown\n\nThe longer answer is\
    \ this: browser vendors have not yet agreed on a single format for audio and video\
    \ on the web.\n\nWhen multimedia was first added to the HTML5 specification, `Ogg—Vorbis`\
    \ for audio and `Theora` for video—was proposed as a standard, default format.\
    \ The `Ogg` specification is considered public domain. Most of its tools have\
    \ open source licenses. It's believed to be patent-free, and non-infringing on\
    \ other patents. For those reasons, it seemed like a fairly good choice for a\
    \ default codec.\n\nSome browser vendors—primarily Apple and Nokia—disagreed with\
    \ the choice of `Ogg` and flatly refused to support it. Among their concerns was\
    \ an uncertain patent landscape. After all, just because `Ogg` is `believed` to\
    \ be non-infringing, doesn't mean that it is. Plus `Ogg` lacked the robust hardware\
    \ support of formats such as `H.264` video.\n\nSpeaking of `H.264` video, Apple\
    \ and Nokia made it their video format of choice. `H.264` is widely supported\
    \ by hardware and software, particularly on mobile. Indeed much of the video used\
    \ on the web today relies on it. However, `H.264` is what's known as `encumbered`:\
    \ it's a patented format. Adding `H.264` support to your software requires paying\
    \ hefty royalty fees. Opera and Mozilla (developers of `Firefox`), balked at that.\
    \ Both refused to add `H.264` support to their browsers.\n\nGoogle, to its credit,\
    \ chose to support `H.264` and `Ogg` in its `Chrome` browser. But `Chromium`,\
    \ the open source codebase underlying `Chrome`, lacks `H.264` support. Microsoft\
    \ largely avoided the fray but then also settled on `H.264`.\n\nI should mention\
    \ here that `H.264` is a video codec, and largely what the fuss was about. Audio\
    \ formats are less contested, in part, because there are just so many to choose\
    \ from.\n\nAll that said: in 2009, specification authors removed the codec requirement.\
    \ Browser vendors implemented the codecs they wanted to. As a result, we have\
    \ to encode our audio and video in multiple formats. For all of the sordid details\
    \ and angry posts, comb through the [WHATWG mailing list archives](http://lists.w3.org/Archives/Public/public-whatwg-archive/)\
    \ from about mid-2009.\n\n## The Current Landscape\n\nSince the codec requirement\
    \ was dropped from HTML5, things have changed slightly in browser land. `Mozilla`\
    \ and `Opera` now support `H.264`, but `only` if the hardware or third-party software\
    \ provides access—on Android devices, for example.\n\nA new format—`WebM`—also\
    \ joined the party. `WebM` is sponsored by Google, and is a container format for\
    \ the `VP8` and `VP9` video codecs. Not surprisingly, Google's `Chrome` supports\
    \ `WebM` natively. So does `Opera` as of version `10.60`, and `Firefox` as of\
    \ version `4.0` (though only the `VP8` codec at this time). `Internet Explorer`\
    \ doesn't support `WebM` natively, but will if third-party software is installed.\
    \ Apple's `Safari` is still `H.264` only.\n\nAt a minimum, we'll need to encode\
    \ our video files in at least two formats: `H.264` and `WebM`. For audio files,\
    \ use `MP3` and `WebM`. These formats enjoy the widest support among currently-used\
    \ browsers. To support `Firefox 3` or `Opera 10.50` users encode your files using\
    \ `Ogg` ― Ogg Theora` for video and `Ogg Vorbis` for audio.\n\nLuckily for us,\
    \ basic media transcoding is easy and there are free and open-source tools for\
    \ the job. In this chapter, we'll discuss two of them: the command-line tool [FFmpeg](http://ffmpeg.org/)\
    \ and the graphical user interface, [Miro Video Converter](http://www.mirovideoconverter.com/).\n\
    \n### Note: Beware Hosting Costs\n\nStoring multiple files in multiple formats\
    \ may affect your hosting costs, particularly as the number of videos stored increases.\
    \ Check the details your web hosting and storage plan.\n\n## Converting Files\
    \ Using Miro Video Converter\n\nMiro Video Converter provides a graphical user\
    \ interface for `FFmpeg`, the open source, command line media conversion tool.\
    \ It's less flexible than `FFmpeg`. But it's also easier to use if the command\
    \ line makes you queasy.\n\nTo convert a file using `Miro`, add it to the queue.\
    \ You can do this by dragging and dropping a file into the application. Or click\
    \ \"Choose File\", and navigate to it. You can add multiple files to the queue.\
    \ `Miro` will process them sequentially. Once our files are queued, we can choose\
    \ our export format.\n\n![The conversion queue for Miro Video Converter for OS\
    \ X](figures/file-queue-in-miro.png)\n\nFigure 6.1. The conversion queue for Miro\
    \ Video Converter for OS X\n\nMiro offers a slew of presets for targeting specific\
    \ devices. Using the `Apple > Apple Universal` preset is a good choice for `H.264`-capable\
    \ browsers. For `WebM` and `Ogg`, look under the `Format` menu instead.\n\nUnder\
    \ the settings menu (the gear icon on the right), you'll also see options to create\
    \ thumbnails, resize your video, or adjust the aspect ratio. Click the gear icon\
    \ again to return to the main settings screen.\n\n![The settings panel in Miro\
    \ Video Converter](figures/miro-settings.png)\n\nFigure 6.2. The settings panel\
    \ in Miro Video Converter\n\nOnce you've selected a format and (optionally) adjusted\
    \ your settings, click the green button at the bottom of the screen to begin transcoding.\n\
    \n![We're okay to convert! What Miro looks like once we've chosen an output format](figures/convert-file-miro.png)\n\
    \nFigure 6.3. We're okay to convert! What Miro looks like once we've chosen an\
    \ output format\n\nMiro Video Converter will output your converted file to its\
    \ output folder. Its location varies by operating system, but you can find a link\
    \ in the settings menu.\n\n## Converting Media Using FFmpeg\n\nIf you want a bit\
    \ more flexibility, try using `FFmpeg`. It's open source, and primarily for Linux\
    \ systems. But binaries for Mac OS X and Windows are available via the `FFmpeg`\
    \ web site. If you're using a Mac, you can also install `FFmpeg` using Homebrew\
    \ or Macports.\n\n`FFmpeg` supports dozens of formats, including the ones we need\
    \ for the web: `Ogg Vorbis` and `Theora`, `MPEG-3`, `MPEG-4/H.264`, and `WebM`.\
    \ You can also use it to export still frames, which comes in handy for generating\
    \ poster images.\n\nLet's take a look at what it takes to convert a video from\
    \ QuickTime (.mov) to `WebM` using `FFmpeg`. Navigate to the directory that houses\
    \ the file you want to convert. Then open a terminal window.\n\n`FFmpeg` conversions\
    \ are straightforward. A simple version looks like this.\n\n```bash\nffmpeg -i\
    \ /path/to/input.file /path/to/output.file \n```\n\n`FFmpeg` will determine which\
    \ codec to use based on the output file's extension.\n\nIn this case, our file\
    \ is named `tracy-sings.mov`. To convert it to `WebM`, we'll type the following.\n\
    \n```bash\nffmpeg -i tracy-sings.mov tracy-sings.webm\n```\n\nThat's it. Your\
    \ terminal window will then fill up with all sorts of details about the input\
    \ and output files.\n\n### Note: Using FFmpeg Binary\n\nIf you're using an `FFmpeg`\
    \ binary, you may also need to include the path to `FFmpeg` (for example: `/usr/local/ffmpeg`).\n\
    \n![An action shot of the FFmpeg conversion process](figures/ffmpeg-output.png)\n\
    \nFigure 6.4. An action shot of the FFmpeg conversion process\n\nA few moments\
    \ later you'll have a transcoded file in the output format you requested.\n\n\
    ### Resizing Video Files\n\nServing a 1080p (typically 1920 pixels by 1080 pixels)\
    \ video may be a larger file than you need online. `FFmpeg` also includes tools\
    \ to scale or resize video files. One way to do this is with `FFmpeg`'s scaling\
    \ filter.\n\nLet's try scaling our movie to a smaller 720p (1280 pixels by 720\
    \ pixels) resolution. We'll also transcode it to `WebM`.\n\n```bash\nffmpeg -i\
    \ tracy-sings.mov -vf scale=-1:720 tracy-sings-720p.webm\n```\n"
