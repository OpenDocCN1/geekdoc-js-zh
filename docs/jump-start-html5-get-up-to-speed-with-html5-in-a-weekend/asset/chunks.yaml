  trans: "\n\n既然我们已经讨论了 Application Cache 的语法以及它的一些特性，现在让我们聊聊它的 JavaScript API。虽然\
    \ AppCache 在没有 API 的情况下运行得很好，但你可以使用此 API 为应用程序的加载过程创建自定义的用户界面。创建这样的用户界面需要理解事件序列，并掌握一些\
    \ JavaScript。\n\n### AppCache 事件序列\n\n当浏览器加载并解析缓存清单（manifest）时，它会在 `applicationCache`\
    \ 对象上触发一系列 DOM 事件。由于它们是 DOM 事件，我们将使用 `addEventListener` 方法来监听并处理它们。\n\n当浏览器首次遇到\
    \ `manifest` 属性时，会触发一个 `checking` 事件。“Checking”意味着浏览器正在确定清单是否发生了变化，这表明应用程序正在更新。我们可以使用此事件向用户发送消息，告知我们的应用程序正在更新：\n\
    \n```javascript\nvar checkinghandler = function(){\n    updatemessage('Checking\
    \ for an update');\n}\napplicationCache.addEventListener('checking',checkinghandler);\n\
    ```\n\n如果之前没有下载过缓存，或者清单发生了变化（触发新下载），浏览器会触发 `downloading` 事件。同样，我们可以使用此事件向用户更新我们的进度：\n\
    \n```javascript\nvar downloadinghandler = function(){\n   updatemessage('Downloading\
    \ files');\n}\napplicationCache.addEventListener('downloading',downloadinghandler);\n\
    ```\n\n如果缓存清单文件自上次检查以来没有变化，浏览器将触发 `noupdate` 事件。如果有更新，浏览器将触发一系列 `progress` 事件。\n\
    \n每个事件都是一个对象。我们可以将此对象看作一个包含触发它的操作信息的容器。在 `progress` 事件中，有两个属性需要注意：`loaded` 和 `total`。`loaded`\
    \ 属性告诉我们浏览器在下载队列中的位置，而 `total` 告诉我们需要下载的文件数：\n\n```javascript\nvar downloadinghandler\
    \ = function(event){\n   var progress   = document.querySelector('progress');\n\
    \   progress.max   = event.total;\n   progress.value = event.loaded;\n}\napplicationCache.addEventListener('downloading',downloadinghandler);\n\
    ```\n\n第一次下载缓存时，如果一切顺利，浏览器会触发 `cached` 事件。缓存的更新将以 `updateready` 事件结束。\n\n如果出现问题，浏览器将触发\
    \ `error` 事件。通常这发生在清单中列出的文件返回错误信息时。但如果清单找不到或无法访问、返回错误（例如“403 Forbidden”）或在更新期间发生变化，也会发生这种情况。\n\
    \n让我们来看一个使用简单待办列表的示例。\n\n### 设置我们的缓存清单\n\n首先，让我们定义清单文件：`todolist.appcache`。该文件告诉浏览器哪些文件需要缓存缓存：\n\
    \n```\nCACHE MANIFEST\n# revision 1\n\nCACHE:\njs/todolist.js\njs/appcache.js\n\
    css/style.css\nimgs/checkOk.svg\n```\n\n一旦浏览器遇到 `manifest` 属性，它将开始下载列出的文件以及主 HTML\
    \ 页面。\n\n### 设置我们的 HTML\n\n为了设置应用程序，我们首先需要创建一个 HTML 文档。这是一个没有太多功能的单页应用，因此我们的标记将是极的：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en-us\" manifest=\"todolist.appcache\"\
    >\n<head>\n  <meta charset=\"utf-8\">\n  <title>To do list</title>\n  <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n<body>\n  <section\
    \ id=\"applicationstatus\"></section>\n\n  <section id=\"application\" class=\"\
    hidden\">\n    <form id=\"addnew\">\n      <p>\n        <label for=\"newitem\"\
    >\n           你今天需要做什么？\n        </label>\n        <input type=\"text\" id=\"\
    newitem\" required autofocus>\n        <button type=\"submit\" id=\"saveitem\"\
    >Add</button>\n      </p>\n      <p>\n       <button type=\"button\" id=\"delete\"\
    >Delete completed</button>\n     </p>\n    </form>\n    <ul id=\"list\"></ul>\n\
    \  </section>\n\n  <script src=\"js/appcache.js\"></script>\n</body>\n</html>\n\
    ```\n\n### 设置我们的 CSS\n\n为了设置应用程序，我们首先需要创建一个 HTML 文档。这是一个没有太多功能的单页应用，因此我们的标记将是极的：\n\
    \n```css\n.hidden {\n  display: none;\n}\n```\n\n### 设置我们的 JavaScript\n\n为了设置应用程序，我们首先需要创建一个\
    \ HTML 文档。这是一个没有太多功能的单页应用，因此我们的标记将是极的：\n\n```javascript\nvar appstatus, app, progress;\n\
    \nappstatus = document.getElementById('applicationstatus');\napp = document.getElementById('application');\n\
    progress = document.createElement('progress');\n\nfunction updatemessage(string){\n\
    \    appstatus.innerHTML = string;\n}\n\nvar checkinghandler = function(){\n \
    \   updatemessage('Checking for an update');\n}\napplicationCache.addEventListener('checking',checkinghandler);\n\
    \nvar downloadinghandler = function(){\n   updatemessage('Downloading files');\n\
    }\napplicationCache.addEventListener('downloading',downloadinghandler);\n\nfunction\
    \ progresshandler(event){\n   var progress = document.querySelector('progress');\n\
    \   progress.max   = event.total;\n   progress.value = event.loaded;\n}\napplicationCache.addEventListener('downloading',progresshandler);\n\
    \nfunction whendonehandler(event){\n    appstatus.classList.add('hidden');\n \
    \   app.classList.remove('hidden');\n}\napplicationCache.addEventListener('cached',whendonehandler);\n\
    \nvar updatereadyhandler = function(){\n    location.reload();\n}\napplicationCache.addEventListener('updateready',updatereadyhandler);\n\
    ```\n"
- fmt: "Data stored using `sessionStorage`, on the other hand, persists only as long\
    \ as the browsing context is available. Usually this means that we lose our `sessionStorage`\
    \ data once the user closes the browser window or tab. It may, however, persist\
    \ in browsers that allow users to save browsing sessions.\n\nIn this chapter,\
    \ we’ll talk about some advantages web storage offers over cookies. We’ll then\
    \ discuss how to use the Web Storage API and look at some of its limitations.\n\
    \n## Why Use Web Storage Instead of Cookies?\n\nThere are three main reasons to\
    \ use `localStorage` or `sessionStorage` over cookies:\n\n* HTTP request performance\n\
    * data storage capacity\n* better protection against cross-site scripting attacks\n\
    \nCookies are included with each request to the server, increasing the size and\
    \ duration of each request. Using smaller cookies helps, but using `localStorage`\
    \ and `sessionStorage` helps most of all. Data is stored locally, and sent only\
    \ when requested.\n\nAnother advantage of using web storage is that you can store\
    \ much more data. Modern browsers begin to max out at 50 cookies per domain. At\
    \ 4 kilobytes per cookie, we can safely store about 200KB before some browsers\
    \ will start to delete cookies. And no, we’re unable to control what’s deleted.\
    \ Web storage limits, on the other hand, range from about 2.5MB in Safari and\
    \ Android to about 5MB in most other browsers. And we can delete data by key.\n\
    \nFinally, web storage is less vulnerable to cross-site scripting attacks than\
    \ cookies. Cookies adhere to a same-domain policy. A cookie set for `.example.com`\
    \ can be read or overwritten by any subdomain of example.com, including `hackedsubdomain.example.com`.\
    \ If `sensitivata.example.com` also uses the `.example.com` cookie, a script at\
    \ `hackedsubdomain.example.com` can intercept that data.\n\nA same-origin restriction\
    \ means that only the origin that created the data can access the data. Data written\
    \ to `localStorage` by `http://api.example.com` will not be available to `http://example.com`,\
    \ `http://store.example.com`, `https://example.com`, or even `http://api.example.com:80`.\n\
    \n## Browser Support\n\nOf all of the APIs discussed in this book, Web Storage\
    \ is the most widely supported among major browsers. It’s available in Internet\
    \ Explorer 8+, Firefox 3.5+, Safari 4+, Opera 10.5+, and Android WebKit. There\
    \ are a few polyfill scripts that mimic the Web Storage API in browsers that lack\
    \ it. One such script is [Storage polyfill by Remy Sharp.](https://gist.github.com/remy/350433).\
    \ It uses cookies and `window.name` to mimic `localStorage` and `sessionStorage`\
    \ respectively.\n\n### Inspecting Web Storage\n\nFor this chapter, use Chrome,\
    \ Safari, or Opera. The developer tools for these browsers let you inspect and\
    \ manage web storage values. In Chrome (seen in [Figure 24.1](#ch24.html_localstorage-inspector\
    \ \"Figure 24.1. The Local Storage inspector in Google Chrome.\")), Safari, and\
    \ Opera 15+, you can find web storage under the Resources panel of the developer\
    \ tools. In Opera 12 (the only version of Opera available for Linux users), you\
    \ can find it under the Storage panel of Dragonfly.\n\n![The Local Storage inspector\
    \ in Google Chrome.](figures/localstorage-inspector.png)\n\nFigure 24.1. The Local\
    \ Storage inspector in Google Chrome.\n\n## Testing for Web Storage Support\n\n\
    Both `localStorage` and `sessionStorage` are attributes of the `window` object.\
    \ We can test for browser support by testing whether these attributes are `undefined`:\n\
    \n```\nif( typeof window.localStorage == 'undefined' ){\n    // Use something\
    \ other than localStorage.\n} else {\n    // Save a key-value pair.   \n}\n```\n\
    \nTesting for `sessionStorage` works similarly; use `typeof window.sessionStorage\
    \ == 'undefined'` instead. Typically, though, if a browser supports `localStorage`\
    \ it also supports `sessionStorage`, and vice versa.\n\nLet’s look at using the\
    \ Storage API by building a simple to-do list. We’ll use `localStorage` to save\
    \ our to-do items and their status. Although we’ll focus on `localStorage` in\
    \ this chapter, keep in mind that this also works for `sessionStorage`. Just swap\
    \ the attribute names.\n\n## Setting Up Our HTML\n\nA basic HTML outline is fairly\
    \ simple. We’ll set up a form with an input field and a button for adding new\
    \ items. We’ll also add buttons for deleting items. And we’ll add an empty list.\
    \ Of course, we’ll also add links to our CSS and JavaScript files. Your HTML should\
    \ look a little like this:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en-us\">\n\
    <head>\n  <meta charset=\"utf-8\">\n  <title>localStorage to do list</title>\n\
    \  <link rel=\"stylesheet\" href=\"css/style.css\">  \n</head>\n<body>\n  <form>\n\
    \    <p>\n      <label for=\"newitem\">What do you need to do today?</label>\n\
    \      <input type=\"text\" id=\"newitem\" required>\n      <button type=\"submit\"\
    \ id=\"saveitem\">Add</button>\n    </p>\n    <p>\n      <button type=\"button\"\
    \ id=\"deletedone\">Delete completed</button>\n      <button type=\"button\" id=\"\
    deleteall\">Reset the list</button>\n    </p>\n  </form>\n  <ul id=\"list\"></ul>\n\
    \  <script src=\"js/todolist.js\"></script>\n</body>\n</html>\n```\n"
  raw: "Data stored using `sessionStorage`, on the other hand, persists only as long\
    \ as the browsing context is available. Usually this means that we lose our `sessionStorage`\
    \ data once the user closes the browser window or tab. It may, however, persist\
    \ in browsers that allow users to save browsing sessions.\n\nIn this chapter,\
    \ we’ll talk about some advantages web storage offers over cookies. We’ll then\
    \ discuss how to use the Web Storage API and look at some of its limitations.\n\
    \n## Why Use Web Storage Instead of Cookies?\n\nThere are three main reasons to\
    \ use `localStorage` or `sessionStorage` over cookies:\n\n*   HTTP request performance\n\
    \n*   data storage capacity\n\n*   better protection against cross-site scripting\
    \ attacks\n\nCookies are included with each request to the server, increasing\
    \ the size and duration of each request. Using smaller cookies helps, but using\
    \ `localStorage` and `sessionStorage` helps most of all. Data is stored locally,\
    \ and sent only when requested.\n\nAnother advantage of using web storage is that\
    \ you can store much more data. Modern browsers begin to max out at 50 cookies\
    \ per domain. At 4 kilobytes per cookie, we can safely store about 200KB before\
    \ some browsers will start to delete cookies. And no, we’re unable to control\
    \ what’s deleted. Web storage limits, on the other hand, range from about 2.5MB\
    \ in Safari and Android to about 5MB in most other browsers. And we can delete\
    \ data by key.\n\nFinally, web storage is less vulnerable to cross-site scripting\
    \ attacks than cookies. Cookies adhere to a same-domain policy. A cookie set for\
    \ .example.com can be read or overwritten by any subdomain of example.com, including\
    \ hackedsubdomain.example.com. If sensitivedata.example.com also uses the .example.com\
    \ cookie, a script at hackedsubdomain.example.com can intercept that data.\n\n\
    A same-origin restriction means that only the origin that created the data can\
    \ access the data. Data written to `localStorage` by `http://api.example.com`\
    \ will not be available to `http://example.com`, `http://store.example.com`, `https://example.com`,\
    \ or even `http://api.example.com:80`.\n\n## Browser Support\n\nOf all of the\
    \ APIs discussed in this book, Web Storage is the most widely supported among\
    \ major browsers. It’s available in Internet Explorer 8+, Firefox 3.5+, Safari\
    \ 4+, Opera 10.5+, and Android WebKit. There are a few polyfill scripts that mimic\
    \ the Web Storage API in browsers that lack it. One such script is [Storage polyfill\
    \ by Remy Sharp.](https://gist.github.com/remy/350433) It uses cookies and `window.name`\
    \ to mimic `localStorage` and `sessionStorage` respectively.\n\n### Inspecting\
    \ Web Storage\n\nFor this chapter, use Chrome, Safari, or Opera. The developer\
    \ tools for these browsers let you inspect and manage web storage values. In Chrome\
    \ (seen in [Figure 24.1](#ch24.html_localstorage-inspector \"Figure 24.1. The\
    \ Local Storage inspector in Google Chrome.\")), Safari, and Opera 15+, you can\
    \ find web storage under the Resources panel of the developer tools. In Opera\
    \ 12 (the only version of Opera available for Linux users), you can find it under\
    \ the Storage panel of Dragonfly.\n\n![The Local Storage inspector in Google Chrome.](figures/localstorage-inspector.png)\n\
    \nFigure 24.1. The Local Storage inspector in Google Chrome.\n\n## Testing for\
    \ Web Storage Support\n\nBoth `localStorage` and `sessionStorage` are attributes\
    \ of the `window` object. We can test for browser support by testing whether these\
    \ attributes are `undefined`:\n\n```\nif( typeof window.localStorage == 'undefined'\
    \ ){\n    // Use something other than localStorage.\n} else {\n    // Save a key-value\
    \ pair.   \n}\n```\n\nTesting for `sessionStorage` works similarly; use `typeof\
    \ window.sessionStorage == 'undefined'` instead. Typically, though, if a browser\
    \ supports `localStorage` it also supports `sessionStorage`, and vice versa.\n\
    \nLet’s look at using the Storage API by building a simple to-do list. We’ll use\
    \ `localStorage` to save our to-do items and their status. Although we’ll focus\
    \ on `localStorage` in this chapter, keep in mind that this also works for `sessionStorage`.\
    \ Just swap the attribute names.\n\n## Setting Up Our HTML\n\nA basic HTML outline\
    \ is fairly simple. We’ll set up a form with an input field and a button for adding\
    \ new items. We’ll also add buttons for deleting items. And we’ll add an empty\
    \ list. Of course, we’ll also add links to our CSS and JavaScript files. Your\
    \ HTML should look a little like this:\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en-us\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>localStorage to do list</title>\n\
    \  <link rel=\"stylesheet\" href=\"css/style.css\">  \n</head>\n<body>\n  <form>\n\
    \    <p>\n      <label for=\"newitem\">What do you need to do today?</label>\n\
    \      <input type=\"text\" id=\"newitem\" required>\n      <button type=\"submit\"\
    \ id=\"saveitem\">Add</button>\n    </p>\n    <p>\n      <button type=\"button\"\
    \ id=\"deletedone\">Delete completed</button>\n      <button type=\"button\" id=\"\
    deleteall\">Reset the list</button>\n    </p>\n  </form>\n  <ul id=\"list\"></ul>\n\
    \  <script src=\"js/todolist.js\"></script>\n</body>\n</html>\n```\n\nOur form\
    \ will resemble the one seen in [Figure 24.2](#ch24.html_todolist \"Figure 24.2. Our\
    \ to-do list interface rendered in Firefox after adding the barest bit of CSS\
    \ magic.\").\n\n![Our to-do list interface rendered in Firefox after adding the\
    \ barest bit of CSS magic.](figures/todolist.png)\n\nFigure 24.2. Our to-do list\
    \ interface rendered in Firefox after adding the barest bit of CSS magic.\n\n\
    On form submission―when a `submit` event is fired on our form―we will append the\
    \ new task to our unordered list element, and save it to `localStorage`.\n\n##\
    \ Saving Values With `localStorage.setItem()`\n\nTo add an item to local storage\
    \ or session storage, we need to use the `setItem` method. This method accepts\
    \ two arguments: `key` and `value`, in that order. Both arguments must be strings,\
    \ or be converted to strings:\n\n```\nlocalStorage.setItem(keyname, value);\n\
    ```\n\nFor our to-do list, we’ll take the text entered in `<input type=\"text\"\
    \ id=\"newitem\" required>`, create a new list item, and save it to `localStorage`.\
    \ That’s what we’ve done in this function:\n\n```\nfunction addItemToList(itemtxt){\n\
    \  var li = document.createElement('li'), \n    list = document.getElementById('list');\n\
    \n  /* Saves the item to storage */\n  localStorage.setItem(itemtxt, 0);\n\n \
    \ /* Update the innerHTML value of our list item \n  and add as a child of our\
    \ list */\n  li.innerHTML = itemtxt;\n  list.appendChild(li);\n}\n```\n\nNotice\
    \ here that we are setting the value of our key to 0 (`localStorage.setItem(itemtxt,\
    \ 0)`). For this application, we'll use 0 to indicate a task that needs to be\
    \ completed and 1 for a task that is complete. When saved, these values will be\
    \ converted to numeric strings.\n\n### Note: Sanitize Your Inputs\n\nIn this case,\
    \ accepting user input for keys is low-risk from a security standpoint. This application\
    \ and its data is contained entirely within the user's browser. When synchronizing\
    \ the data with a server, be sure to sanitize and validate your input and escape\
    \ your output.\n\nSince we want to update our list every time the form is submitted,\
    \ we also need to add an event listener to our form.\n\n### Adding an Event Listener\n\
    \nTo add an event listener, use the `addEventListener()` method and define a function\
    \ that will be invoked when our event is fired:\n\n```\nvar form, updateList;\n\
    \nform = document.forms[0];\n\nvar updateList = function(event){\n    /* Prevent\
    \ the default action, in this case, form submission */\n    event.preventDefault();\
    \ \n\n    /* Invoke the addItemToList function */\n    addItemToList( document.getElementById('newitem').value\
    \ );\n\n    /* Clear the input field */\n    document.getElementById('newitem').value\
    \ = '';\n}\n\nform.addEventListener('submit', updateList);\n```\n\n### Using `localStorage.setItem`\
    \ to Update Existing Values"
