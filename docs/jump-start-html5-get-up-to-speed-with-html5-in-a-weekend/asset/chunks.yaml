  trans: "\n\n到本书为止，我们已经介绍了 `audio` 和 `video` 元素，以及它们的大部分重要属性。但你可能注意到，你的 `audio` 和\
    \ `video` 示例并不是在所有浏览器中都能工作。例如，如果你使用了 `MP3` 和 `M4V` 文件，你的示例在 Opera 16 中就无法运行。\n\
    \n正如我们在第 6 章 中讨论过的样，浏览器厂商尚未同意支持一种标准的文件格式。这意味着我们需要提供多种格式的媒体文件。但当 `video` 和 `audio`\
    \ 元素只支持单个 `src` 属性时，我们如何做到呢？\n\n答案是，我们无法完全做到。但我们可以使用多个 `source` 元素来提供多个源文件。每个浏览器都会下载它最可能播放的文件格式。我们将在下一章中讨论跨浏览器视频问题。\n\
    \n# 第 9 章：多媒体：`source` 元素\n\n在本章之前，我们讨论了使用带有单个 `src` 属性的 `audio` 和 `video` 元素。你可能注意到，这在某些浏览器中只有部分有效，取决于你的文件格式。对于在不同浏览器中运行的真正跨浏览器多媒体，你需要使用多个\
    \ `source` 元素和多个源文件。\n\n我们将在本章示例中使用 `video` 元素，但我们讨论的大部分内容也适用于 `audio` 元素。为了提供多个源，你需要让你的媒体以多种格式可用。请参考第\
    \ 6 章了解实现此操作的方法。\n\n## `source` 元素\n\n`source` 元素允许我们为多媒体元素指定多个备用媒体文件。它不是一个独立的元素；必须作为\
    \ `audio` 或 `video` 元素的子使用。将你的 `source` 标签放置在 `audio` 或 `video` 元素的开始和结束标签之间。\n\
    \n```\n<video controls>\n  <source src=\"/path/to/video.h264.m4v\">\n  <source\
    \ src=\"/path/to/video.webm\">\n</video>\n```\n\n`source` 标签需要一个 `src` 属性，其值为多媒体文件的路径和名称。理想情况下，当你指定多个源时，浏览器应该检测并选择它能够播放的文件。目前的状况要稍微复杂一些。\n\
    \n在 Chrome、Firefox 和 Internet Explorer 中，浏览器将尝试下载指定的第一个源文件。如果它无法播放该格式，它将尝试下一个指定的文件，依此类推，直到找到一个它能够播放的格式的文件。\n\
    \nSafari 6（及更早版本）和 Opera 15 也执行相同的操作，但当 `preload` 的值为 `none` 时除外。当 `preload=\"\
    none\"` 时，这些浏览器将尝试下载第一个文件，如果证明是不兼容的则失败。为了防止这种情况，可以：\n\n1. 将 `preload` 属性设置为 `metadata`\
    \ 或 `auto`；或者\n2. 使用 `type` 属性指定 MIME 类型。\n\nSafari 7 不再受此 bug 的困扰。\n\n## 使用 `type`\
    \ 属性进行格式提示\n\n使用 `type` 属性指定 MIME 类型将防止浏览器对每个 `source` 元素运行格式兼容性检查。这对于该过程失效的浏览器来说尤为重要。浏览器将不再执行“下载-检查-重复”的序列，而是使用\
    \ `type` 属性来选择它能够播放的文件。让我们为上面的 `<source>` 元素添加 `type` 属性。\n\n```\n<video controls>\n\
    \  <source src=\"/path/to/video.h264.m4v\" type=\"video/mp4\">\n  <source src=\"\
    /path/to/video.webm\" type=\"video/webm\">\n</video>\n```\n\n`type` 属性的值必须是与相关格式匹配的有效\
    \ MIME 类型。对于 MPEG4/H.264 文件，为 `video/mp4`。对于音频 MPEG-4 文件，使用 `audio/mp4`。MP3 文件的\
    \ MIME 类型应为 `audio/mpeg`。对于 Ogg 文件，使用 `video/ogg` 或 `audio/ogg`。对于 WebM，首选 MIME\
    \ 类型是 `video/webm`。\n\n你可能还想指定用于编码媒体文件的编码器。大多数文件格式实际上只是各种编码格式的容器。例如，一个 Ogg 音频文件实际上可能是使用\
    \ Vorbis、FLAC 或 Speex 编码器编码的。包含编码器是可选的，它可以为浏览器提供更具体的信息。要包含编码器，请在 `type` 属性的值中添加\
    \ `codec` 参数。\n\n```\n<source src=\"/path/to/video.ogv\" \ntype=\"video/ogg; codecs='theora,\
    \ vorbis'\">\n```\n\n注意，我们的 `codecs` 参数值被包含在单引号中。这是因为它是封装在双引号中的值的一部分。我们也可以反转引号；即用单引号包含\
    \ `type` 的整个值，而对 `codecs` 参数的值使用双引号。\n\n使用 `codec` 并不是严格必要的。省略它也一样，特别是当你不确定文件使用的是哪种编码器时。\n\
    \n### 媒体问题排除\n\n现在你可能已经做了这一切——路径正确，文件格式正确——但你的视频或音频仍然无法工作。可能存在几个问题。\n\n检查你的服务器是否为文件类型发送了正确的\
    \ `Content-type` 响应头。许多服务器会带有 `Content-type: text/html` 或 `Content-type: application/octet-stream`\
    \ 头部发送未知文件类型。你需要为你的服务器或目录配置文件为每种文件格式添加正确的头部支持。这些头部值应与我们上面讨论的 MIME 类型相同。请查阅你的服务器文档或联系你的网络托管支持团队以获取更多信息。\n\
    \n如果不起作用，你可能需要重新编码你的文件。在这样做时，请确保你使用的是目标浏览器支持的编码器。（查阅浏览器文档。）\n\n## 使用 `media` 属性实现响应式视频\n\
    \n`source` 元素可以用于提供不同格式的文件。但它也可以根据屏幕或设备特性提供不同的视频。你可以通过 `media` 属性来实现。\n\n`media`\
    \ 属性接受媒体查询作为值。媒体查询由一个 CSS 媒体类型（如 print、TV 或 screen）和一个用于测试的媒体特性组成。关于媒体查询及其工作原理的完整解释，请参考万维网联盟的\
    \ [Media Queries](http://www.w3.org/TR/css3-mediaqueries/)规范。在这里，我们只来看一个使用宽高比的示例。\n\
    \n### 提供不同宽高比的视频\n\n我们可以测试的媒体或设备特性之一是宽高比。媒体查询允许我们测试 `aspect-ratio` 和 `device-aspect-ratio`。前者测试文档内容（通常是文档窗口）的宽高比。后者测试设备屏幕的宽高比。有时它们是相同的，但通常不同。无论哪种，我们都可以测试条件并根据结果提供不同的视频。\n\
    \n在这里，我们使用两个不同的文件提供相同的视频内容：为能够纳该分辨率的屏幕提供 1080p 视频，为容纳较低分辨率的屏幕提供 720p 视频。\n\n```\n\
    <video controls>\n  <source src=\"/path/to/video.1080p.m4v\" type=\"video/mp4\"\
    \ \n  media=\"screen and (device-aspect-ratio: 1920/1080)\">\n  <source src=\"\
    /path/to/video.720p.m4v\" type=\"video/mp4\" \n  media=\"screen and (device-aspect-ratio:\
    \ 1280/720)\">\n  <source src=\"/path/to/video.1080p.webm\" type=\"video/webm\"\
    \ \n  media=\"screen and (device-aspect-ratio: 1920/1080)\">\n  <source src=\"\
    /path/to/video.720p.webm\" type=\"video/webm\" \n  media=\"screen and (device-aspect-ratio:\
    \ 1280/720)\">\n</video>\n```\n"
- fmt: "\nIn this case, the browser will only download a supported video file only\
    \ if the user has an HD-compatible device. It's also worth mentioning that the\
    \ `media` attribute only applies to the `source` element. Adding it to your `video`\
    \ or `audio` tag won't work.\n\nThere's far more to responsive web design and\
    \ media queries, of course. Check out SitePoint's [*Jump Start Responsive Web\
    \ Design*](http://www.sitepoint.com/store/jump-start-responsive-web-design/) for\
    \ an introduction.\n\n## So Far We've Learned\n\nSo far we've covered the HTML5\
    \ audio and video elements and attributes. We've also talked about how to serve\
    \ cross-browser video, and how to troubleshoot. [Next](#ch10.html \"Chapter 10Mutimedia:\
    \ The track Element\"), we'll take a look at captioning web video with the `track`\
    \ element.\n\n# Chapter 10: Multimedia: The `track` Element\n\nIn the [last chapter](#ch09.html\
    \ \"Chapter 9Multimedia: The source Element\"), we discussed how to make your\
    \ media available to more users with cross-browser techniques. In this chapter,\
    \ we'll look at how to make it accessible and \"index-able\", too, with the `track`\
    \ element and WebVTT.\n\nHTML5 multimedia comes with three challenges:\n\n1. Lack\
    \ of accessibility.\n2. Lack of \"index-ability\".\n3. Language barriers between\
    \ the media and the viewer or listener.\n\nAccessibility simply means supporting\
    \ users with impairments or disabilities as fully as possible. Audible media isn't\
    \ usable to hearing-impaired users. Visually-impaired users don't see visual media\
    \ in the same way that fully-sighted users do. HTML5 audio and video present clear\
    \ challenges for these users.\n\nWhat's more, search engine software struggles\
    \ to correctly index binary data, such as audio, video, and images. Even Google's\
    \ Image Search relies on file names, `alt` attributes, and surrounding text rather\
    \ than actual file indexing. By themselves, audio and video files are a bit of\
    \ an information black hole. Data goes in, but is often difficult to extract and\
    \ use.\n\nLanguage barriers are another challenge of HTML5 multimedia. The viewer\
    \ or listener may not understand, let alone be fluent in the language of the media\
    \ played. Subtitles `within` the video can help. However, they aren't readily\
    \ swappable while editing, viewing, or listening to media. And they too suffer\
    \ from the indexing problem.\n\nHTML5 defines a `track` element as a way to solve\
    \ these problems. With it, we can add timed, text-based alternatives—such as subtitles,\
    \ captions, and metadata—to our media files. In this chapter, we'll look at this\
    \ element, and a syntax for captions and subtitles known as WebVTT.\n\n## The\
    \ State of `track` Support\n\nBefore we begin, however, let's talk about browser\
    \ support. The `<track>` element is at least partly supported by Internet Explorer\
    \ 10+, Chrome 16+, Safari 6+, and Opera 16+. However, its utility is limited in\
    \ some of those browsers.\n\nSafari 6.0.5 for OS X doesn't actually make captions\
    \ or subtitles available to the user, though the scripting interface is partially\
    \ available. Captions are visible, however, in Safari 7. (In iOS 7, they're only\
    \ available when the video is in full-screen mode.)\n\nOpera 16+ for desktop supports\
    \ `track`, but Opera for Android does not. On Android, Opera passes video handling\
    \ off to the operating system's software. Rather than playing video in the browser,\
    \ it launches an external application, making captions irrelevant. Opera's new\
    \ Coast browser for iOS behaves similarly, using that platform's built-in video\
    \ handling.\n\nFirefox support for `track` is still in progress. Full support\
    \ isn't yet available. However, partial support is available in the [latest nightlies](http://nightly.mozilla.org/)\
    \ (Firefox 27.0a1 and higher). Enable it by typing `about:config` in the address\
    \ bar, and changing the `media.webvtt.enabled` setting to `true`.\n\nTo provide\
    \ captioning in browsers that lack support, take a look at [Captionator.js](http://captionatorjs.com/)\
    \ and [MediaElementJS](http://mediaelementjs.com/).\n\n### Captions, Subtitles,\
    \ and `audio`\n\nMost browsers don't fully support the `track` element when used\
    \ with the `audio` element. There are no subtitles, no captions, and no menu for\
    \ them. For `audio` files you currently have two options:\n\n1. Include a text\
    \ transcript in the same HTML document.\n2. Use a `video` element instead of an\
    \ `audio` element.\n\nSince an audio file lacks intrinsic dimensions, the `video`\
    \ element's will render at its default 300x150-pixel size.\n\n## Adding the `track`\
    \ Element\n\nTo use the `track` element, place it between the opening `<video>`\
    \ tag and closing `</video>` tag, as shown below.\n\n```\n<video src=\"/path/to/media.file\"\
    \ controls>\n  <track src=\"/path/to/tracktext.vtt\" srclang=\"en\">\n</video>\n\
    ```\n\nIf you're using `source` elements instead, place your `track` tag or tags\
    \ after your `source` tags.\n\n```\n<video src=\"/path/to/media.file\" controls>\n\
    \  <source src=\"/path/to/media.m4v\" kind=\"video/mp4\">\n  <source src=\"/path/to/media.webm\"\
    \ kind=\"video/webm\">\n  <track src=\"/path/to/tracktext.vtt\" srclang=\"en\"\
    >\n</video>\n```\n\nYou've probably noticed that our `track` tag contains an `src`\
    \ attribute. The value of `src` must be the URL of a text file containing the\
    \ alternative version. In theory, this could be any captioning file format that\
    \ the browser supports. In practice, it should be a [WebVTT](http://dev.w3.org/html5/webvtt/)\
    \ file. WebVTT enjoys support in every browser that supports the `track` element.\
    \ [TTML](http://www.w3.org/TR/ttaf1-dfxp/) is an alternative captioning syntax,\
    \ but so far, only Internet Explorer supports it.\n\nA little later in this chapter,\
    \ we'll discuss WebVTT's captioning syntax and how to use it.\n\n## Specifying\
    \ Subtitles, Captions, and Metadata\n\nIn our examples above, we've left out the\
    \ `kind` attribute. It's optional, but recommended. The `kind` attribute tells\
    \ our browser the function of each text track and guides how it will be displayed.\n\
    \nThe value of `kind` may be one of the following values:\n\n* `subtitles`: used\
    \ to provide a transcription, or translation of dialogue\n* `captions`: used for\
    \ transcription and translation, but used to provide descriptions specifically\
    \ for hearing-impaired users\n* `descriptions`: used to describe the video component\
    \ in cases where it's unavailable, or the user is visually impaired; synthesized\
    \ as audio\n* `chapters`: used for navigating the resource, similar to what you\
    \ might find on a DVD menu\n* `metadata`: data about the video that's intended\
    \ for script or machine consumption\n\nOf these five types, all but `metadata`\
    \ are revealed to the user. Tracks of the `descriptions` kind are synthesized\
    \ as audio, and will be heard rather than seen by the user. Both subtitles and\
    \ captions are overlaid on the video file. For captions, the user interface may\
    \ include a closed caption button that lets the user toggle captions on and off\
    \ ([Figure 10.1](#ch10.html_captionsenabled \"Figure 10.1. An example of a video\
    \ with captions enabled in Chrome 32. Video still from \"Sita Sings the Blues\"\
    \ by Nina Paley, (sitasingtheblues.com)\")).\n\n![An example of a video with captions\
    \ enabled in Chrome 32. Video still from \"Sita Sings the Blues\" by Nina Paley,\
    \ (sitasingtheblues.com)](figures/track-cc-button-chrome.png)\n\nFigure 10.1.\
    \ An example of a video with captions enabled in Chrome 32. Video still from \"\
    Sita Sings the Blues\" by Nina Paley, (sitasingtheblues.com)\n\nChapters are intended\
    \ to be displayed as an interactive list in the user agent's interface. To date,\
    \ however, no major browser fully supports this feature. Metadata tracks provide\
    \ information about the media file or time range, and aren't displayed to the\
    \ user at all.\n\nIf you don't set the `kind` attribute, your track will be treated\
    \ as a `subtitles` track. That's the default state for the element. When the type\
    \ is `subtitles`—whether explicitly, or implicitly—you *must* include a `srclang`\
    \ attribute. Without the `srclang` attribute, captions will not work.\n\n### Using\
    \ Multiple `track` Elements\n"
