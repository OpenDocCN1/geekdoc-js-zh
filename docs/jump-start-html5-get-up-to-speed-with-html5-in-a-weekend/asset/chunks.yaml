    \ cue is plain text, and cues can break across multiple lines, as shown below.\
    \ (Dialogue from the movie \"Sita Sings the Blues,\" sitasingstheblues.com).\n\
    \n```\nWEBVTT\n\n0:06:57.200 --> 0:07:01.000 \n[Music]\n\n0:07:02.500 --> 0:07:08.000\
    \ \nWhen? I don't remember what year. There's no year. \nHow do you know there's\
    \ a year for that?\n\n0:07:08.500 --> 0:07:10.000 \nI think they say the 14th\
    \ century.\n\n0:07:11.500 --> 0:07:13.000 \nThe 14th century was recently. \n\
    I know but ... \n\n0:07:13.500 --> 0:07:16.500 \nThat's when the Moguls were ruling\
    \ in India\nThe 11th then\n\n0:07:17.500 --> 0:07:22.000 \nIt's definitely B.C.\
    \ It's B.C. for sure.\nAnd I think it's Ayodhya.\n```\n\nNotice the blank lines\
    \ between each cue? They're required. This is how the browser determines where\
    \ one cue ends and the next begins.\n\n### WebVTT Cue Spans\n\nWebVTT supports\
    \ a set of HTML5-like tags known as *cue spans* that offer simple formatting for\
    \ subtitles and captions.\n\n*   `c` or cue class span\n\n*   `i` or italics span\n\
    \n*   `b` or bold span\n\n*   `u` or underline span\n\n*   `ruby` and `rt` or\
    \ ruby and ruby text spans\n\n*   `v` or voice cue span\n\n*   `lang` or language\
    \ cue tag\n\nMuch like HTML tags, each cue span start tag begins with a `<` and\
    \ ends with `>`. Ending tags begin with `</` and end with `>`. Let's take our\
    \ dialogue from above and add some voice cue span tags.\n\n```\nWEBVTT\n\n0:06:57.200\
    \ --> 0:07:01.000 \n<i.music>[Music]</i>\n\n0:07:02.500 --> 0:07:08.000 \n<v Man1>When?\
    \ I don't remember what year. There's no year. \nHow do you know there's a year\
    \ for that?</v>\n\n0:07:08.500 --> 0:07:10.000 \n<v Woman>I think they say the\
    \ 14th century.</v>\n\n0:07:11.500 --> 0:07:13.000 \n<v Man1>The 14th century\
    \ was recently</v>\n<v Woman>I know but ...</v>\n\n0:07:13.500 --> 0:07:16.500\
    \ \n<v Man1>-That's when the Moguls were ruling in India</v>\n<v Woman>- The 11th\
    \ then</v>\n\n0:07:17.500 --> 0:07:22.000 \n<v Man2>It's definitely B.C. It's\
    \ B.C. for sure.    \nAnd I think it's Ayodhya.</v>\n```\n\nHere, each character\
    \ is denoted by a `<v>` tag. The name of each character—here Man1, Woman, and\
    \ Man2—are also part of the tag. It's an attribute of sorts. We've also added\
    \ an italic cue span to our first cue.\n\n### Tip: Validate Your WebVTT\n\nPoorly-written\
    \ WebVTT will keep captions and subtitles from working. Validate your WebVTT syntax\
    \ using Anne Van Kesteren's [Live WebVTT Validator](http://quuz.org/webvtt/).\n\
    \nVoice cue span tags don't change the appearance of each subtitle by themselves.\
    \ But they do add semantic data and become hooks for CSS, as we'll see in the\
    \ next section.\n\n### Styling Subtitles and Captions with the `::cue` Pseudo-element\n\
    \n![Un-styled captions in Internet Explorer 11\\. Video still from \"Sita Sings\
    \ the Blues\" by Nina Paley (sitasingstheblues.com)](figures/track-captions-unstyled-ie.png)\n\
    \nFigure 10.7. Un-styled captions in Internet Explorer 11\\. Video still from\
    \ \"Sita Sings the Blues\" by Nina Paley (sitasingstheblues.com)\n\nCaptions and\
    \ subtitles are displayed in most browsers as white, sans-serif text. Internet\
    \ Explorer ([Figure 10.7](#ch10.html_IEcaptions \"Figure 10.7. Un-styled captions\
    \ in Internet Explorer 11\\. Video still from \"Sita Sings the Blues\" by Nina\
    \ Paley (sitasingstheblues.com)\")) adds a text shadow for readability. Chrome,\
    \ Safari, and Opera use a black background. They're always placed at the bottom\
    \ of the video, and centered on screen.\n\nThough WebVTT offers a syntax for caption\
    \ alignment and placement, browser vendors haven't yet implemented it. For now,\
    \ we have limited control over how native captions look and where they are placed\
    \ on screen.\n\nWe *can*, however, adjust the appearance of captions and subtitles\
    \ with CSS and the `::cue` pseudo-element (currently only supported in Chrome,\
    \ Safari 7, and Opera 16+).\n\nNot all CSS properties can be used to style WebVTT\
    \ captions and subtitles. Only a subset of properties are supported, largely related\
    \ to text and color.\n\n*   `color`\n\n*   `opacity`\n\n*   `visibility`\n\n*\
    \   `text-decoration`\n\n*   `text-outline`\n\n*   `text-shadow`\n\n*   `background`\
    \ properties such as `background-color`\n\n*   `outline` properties such as `outline-color`\n\
    \n*   `font` properties such as `font-family`, but also `line-height` and `white-space`\n\
    \n    ### Important: Change Caption Colors With Caution!\n\n    Ensure that your\
    \ color selections create enough contrast by using a [contrast ratio calculator](http://leaverou.github.io/contrast-ratio/).\n\
    \nLet's look at an example of styling the `::cue` pseudo-element. Here `::cue`\
    \ is our selector, and we're using the `font` short hand property to make our\
    \ caption text bold.\n\n```\n::cue {\n    font: bold 18px / 1.5 sans-serif;\n\
    }\n```\n\nYou can see the effect in [Figure 10.8](#ch10.html_boldcaptionstyle\
    \ \"Figure 10.8. Applying bold text styling to caption text. Image from \"Sita\
    \ Sings the Blues\" sitasingstheblues.com\").\n\n![Applying bold text styling\
    \ to caption text. Image from \"Sita Sings the Blues\" sitasingstheblues.com](figures/track-vtt-with-white-text.png)\n\
    \nFigure 10.8. Applying bold text styling to caption text. Image from \"Sita Sings\
    \ the Blues\" sitasingstheblues.com\n\nThat's not all we can do, however. The\
    \ `::cue` pseudo-element also resembles a function, and accepts a single argument.\
    \ This argument must be one or more CSS selectors, such as a class name or element.\
    \ Recall the markup we used in our snippet of dialogue from above.\n\n```\n0:07:11.500\
    \ --> 0:07:13.000 \n<v Man1>The 14th century was recently</v>\n<v Woman>I know\
    \ but ...</v>\n```\n\nWe can use these tags with `::cue` to create more specific\
    \ CSS selectors. For example, we may want to use different colored text for each\
    \ character.\n\n```\n::cue(v[voice=Man1]) {\n    color:#9f0;\n    background:\
    \ rgba(0,0,0,.8);\n}\n\n::cue(v[voice=Woman]) {\n    color:#ece;\n    background:\
    \ rgba(0,0,0,.8);\n}\n```\n\nHere we've combined an element selector (`v`) and\
    \ an attribute selector (`voice`) to assign each character a different color ([Figure 10.9](#ch10.html_captiontextcolor\
    \ \"Figure 10.9. Caption text in which each character's lines are in a different\
    \ color, as shown in Chrome 30\")).\n\n![Caption text in which each character's\
    \ lines are in a different color, as shown in Chrome 30](figures/track-vtt-with-css.png)\n\
    \nFigure 10.9. Caption text in which each character's lines are in a different\
    \ color, as shown in Chrome 30\n\nPerhaps we want to visually convey the character's\
    \ volume or tone. We might add a class using dot syntax as shown below.\n\n```\n\
    0:07:11.500 --> 0:07:13.000 \n<v.softly Man1>The 14th century was recently</v>\n\
    <v Woman>I know but ...</v>\n```\n\nThen in our CSS, we would pass the class name\
    \ as our argument to `::cue`.\n\n```\n::cue(.softly) {\n    font-size: .9em;\n\
    }\n```\n\nWe've just scratched the surface of what you can do with `track` and\
    \ WebVTT here. HTML5Rocks has an [excellent tutorial](http://www.html5rocks.com/en/tutorials/track/basics/)\
    \ on the basics of both, as well as some neat tricks achievable with the TextTrack\
    \ scripting API.\n\n## What We've Learned\n\nIn this chapter, we looked at how\
    \ to increase the accessibility and findability of our media files. In our [next\
    \ chapter](#ch11.html \"Chapter 11Multimedia: Scripting Media Players\"), we'll\
    \ take a look combining markup and JavaScript to create a media player.\n\n# Chapter\
    \ 11\n\nMultimedia: Scripting Media Players\n\nNow that you know how to add video\
    \ and audio elements using markup, let's add some DOM scripting. In this chapter,\
    \ we'll look at customizing the look and feel of your audio or video element with\
    \ HTML elements, CSS, and scripting.\n\nIf you're not familiar with DOM scripting—better\
    \ known as JavaScript—don't worry. We'll go easy in this chapter. But if you'd\
    \ like to learn more (and you should) try SitePoint's [**Jump Start JavaScript**](http://www.sitepoint.com/store/jump-start-javascript/).\
    \ The World Wide Web Consortium's Web Platform Docs also has some [good tutorials](http://docs.webplatform.org/wiki/javascript/tutorials)\
    \ to get you started."
