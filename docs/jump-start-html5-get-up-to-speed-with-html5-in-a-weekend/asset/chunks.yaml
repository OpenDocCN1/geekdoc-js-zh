    \ Panda\n\nSandeep Panda 是一位 Web 开发人员和作家，对 `JavaScript` 和 `HTML5` 充满热情。他拥有超过四年的\
    \ Web 编程经验。喜欢在新技术出现时进行实验，是一个持续的学习者。不编程时，可以发现他在玩游戏和听音乐。\n\n## 关于 SitePoint\n\n\
    SitePoint 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 访问我们的博客、书籍、时通讯、文章和社区论坛。你可以在这里找到大量关于 `JavaScript`、`PHP`、`Ruby`、移动开发、设计等的信息。\n\
    \n## 关于 Jump Start\n\nJump Start 系列书籍为你提供对 Web 开发语言和技术的快速实用的介绍。这些书籍通常长度约为 150\
    \ 页，可以在周末内读完，让你对该主题有坚实的基础，并有独立实验的信心。\n\n***\n\n# 序言\n\n`HTML`（超文本标记语言）是网页主要的语言。当你在浏览器中阅读或与页面交互时，它很是一个\
    \ HTML 文档。HTML 最初开发作为描述和共享科学论文的方法，现在用于标记各种文档并为基于浏览器的软件创建视觉界面。\n\n然而，通过 HTML5，HTML\
    \ 已经成为开发基于浏览器软件的 `API`（应用程序接口）。在书中，我们将讨论 HTML 和 HTML5 的历史，并探索它的一些新功能。\n\nHTML5\
    \ 还改进了现有元素。通过新的输入类型，我们不需要 JavaScript 库就可以创建丰富的表单控件。例如，如果你想要滑动输入控件，可以使用 `<input\
    \ type=range>`。`email` 和 `url` 等输入类型增加了客户端验证功能。新的 `audio` 和 `video` 元素允许我们直接在文档中嵌入音频和视频媒体。这两个元素都具有脚本接口，我们可以用它们创建自定义媒体播放器或巧妙的视觉效果。而且在支持的浏览器中，这不需要插件。\n\
    \n通过添加 `canvas` 元素和对内联扩展矢量图形（或 SVG）的支持，我们可以在 HTML5 中绘图。`canvas` 元素是一个强大的位图绘制 API，允许我们创建\
    \ 2D 或 3D 图像、图表和游戏。另一方面，SVG 使用矢量图形创建可重用、可扩展、可脚本的图像，这些图像可以在设备和屏幕上工作。\n\n也许 HTML5\
    \ 最大的变化是这个：属于 HTML 文档对象模型的一部分但没有对应标记元素的 API。它们是纯粹的 DOM API，我们可以使用 `JavaScript`\
    \ 使用它们共享和消费数据，或创建位置感知应用程序。Web Workers 模拟了多线程 `JavaScript` 和后台任务。地理定位 API 让我们的应用程序能够感知位置。通过跨文档消息，我们可以在文档之间（甚至跨域）发送数据，而不暴露任何方的完整\
    \ DOM。最后，服务器发送事件和 WebSocket 实现了客户端与服务器之间的近实时通信。\n\n读完本书后，你将了解上述所有内容的基础，并为开发出 HTML5\
    \ 网站和应用程序铺平道路。\n\n## 谁应该读这本书\n\n虽然这本书是为 HTML5 初学者设计的，但它并不是完全全面的。因此，我们假设读者已经有一些\
    \ HTML 知识。如果你是 Web 开发的完全新手，SitePoint 的 [**Build Your Own Website using HTML and\
    \ CSS**](http://www.sitepoint.com/store/build-your-own-website-the-right-way-using-html-css-3rd-edition/)\
    \ 可能更适合你。\n\n"
- fmt: "\nAs we progress through the book, we'll tackle some more advanced topics,\
    \ such as APIs and offline applications. To follow these sections, you should\
    \ be familiar with HTML and the fundamentals of JavaScript and the Document Object\
    \ Model (`DOM`). It’s unnecessary to have deep knowledge of JavaScript. Still,\
    \ you should understand event handling, JavaScript data types, and control structures\
    \ such as `while` loops and `if-else` conditionals. We’ll keep our script examples\
    \ simple, though, and explain them line by line. If you’re unfamiliar with JavaScript,\
    \ you may like to read SitePoint’s *[Simply JavaScript](http://www.sitepoint.com/store/simply-javascript/)*\
    \ by Kevin Yank for an introduction. [Mozilla Developer Network](https://developer.mozilla.org/en-US/)\
    \ also offers fantastic learning resources and documentation for both JavaScript\
    \ and the `DOM`.\n\n## Conventions Used\n\nYou’ll notice that we’ve used certain\
    \ typographic and layout styles throughout this book to signify different types\
    \ of information. Look out for the following items.\n\n### Code Samples\n\nCode\
