  trans: "\n\n当用户点击播放时，此函数还将更改 `preload` 的值，提醒浏览器它应该限制下载速度。然而，请记住，这些只是提示；浏览器的行为是不保证的。\n\
    \n## 结语\n\n在本书中我们涵盖了媒体编码和 HTML5 标记。我们学习了如何让我们的媒体具有可访问性。并学习了使用多媒体脚本 API 构建播放器的基础知识。然而，内容远不止我们所涵盖的。\n\
    \n尽管内容密集，我建议你阅读来自 `HTML: The Living Standard` 的关于[视频元素](http://developers.whatwg.org/the-video-element.html#the-video-element)\
    \ 的文档。它由 WHATWG 维护，面向 Web 开发者而非浏览器供应商。\n\n广告公司 LongTail 维护着 [HTML5 视频状态](http://www.longtailvideo.com/html5/)页面，用于跟踪浏览器对特定多媒体功能的支持情况。\n\
    \nMozilla.org 还提供了一份[HTML5 音频和视频指南](https://developer.mozilla.org/en-US/docs/Web/Guide/HTML/Using_HTML5_audio_and_video)，其中更多地介绍了我们尚未涵盖的内容，例如错误处理和指定播放范围。另请参考\
    \ Dev.Opera 的[HTML5 视频介绍](http://dev.opera.com/articles/view/introduction-html5-video/)，获取有关编写视频播放器的更多技巧和窍门。\n\
    \n你现在掌握了关于 HTML5 音频和视频所需的全部知识。祝编码愉快！\n\n# 第 12 章：Canvas & SVG：Canvas 简介\n\n随着\
    \ Web 的演进和成熟，用于有效显示网页的语言也随之发展。之前的 HTML 版本 v4.01 具有许多现在已经过时的元素。\n\n现代互联网用户是精明且有要求的，这意味着他们期望网页以某种方式显示并快速加载。HTML5\
    \ 试图解决早期 HTML 版本中欠缺的问题，以更好地处理图形并满足这些预期。\n\n## Canvas 可以用来什么？\n\nCanvas 可用于绘制形状（如矩形、正方形和圆形），或者在\
    \ HTML5 文档中嵌入图像或视频。你可以根据需要在一个文档中使用多个 Canvas 实例，或者只使用一个。\n\n基础的 `canvas` 元素看起来如下：\n\
    \n```\n<canvas id=\"myCanvas\" width=\"300\" height=\"150\"></canvas>\n```\n\n\
    此时，值得注意的是，HTML5 `canvas` 元素是嵌入页面中的 `DOM`（文档对象模型）节点。随后会创建上下文（context），这是一个你用于在容器内渲染图形的对象。如果你创建了多个画布，你需要为每个上下文创建\
    \ `canvas` 元素，并对它们进行适当命名，以便浏览器理解你指的是哪个对象。\n\n`canvas` 元素在表面上与 `img` 元素相似。它们都有高度和宽度，并在页面上以矩形块的形式显示。然而，`img`\
    \ 通常加载预先准备好的图形（例如照片）。`canvas` 是一个可编程的图像；你使用 JavaScript 绘图方法直接操作像素。这项技术非常快，并允许你创建复杂的动画和游戏。总来说，canvas\
    \ 经常与 Flash 和 Silverlight 等技术相比较。\n\n查看这个[动画图形](http://raksy.dyndns.org/torus.html)，它是使用\
    \ canvas 可以做事情的一个良好示例。你还应该查看 [Canvas 演示](http://www.canvasdemos.com/) 以获取一些棒的运行示例，包括使用\
    \ `canvas` 创建的游戏和应用程序。\n\n## 在开始之前\n\n在我们开始玩转 canvas 之前，需要考虑的几点：\n\n*   最好为每个\
    \ canvas 分配一个唯一的 `id` 属性，这样你的脚本就可以直接引用它。该页面上的其他元素不应使用相同的 ID。\n\n*   当未应用样式时，容器或\
    \ canvas 元素将是透明的，没有边框，因此它看起来像一个透明的矩形框。默认宽度为 300 像素，默认高度为 150 像素。\n\n*   在理想的世界里，每个人都会使用最新的浏览器。但事实并非如此，他们并没有这样做。这意味着通常需要告诉浏览器在不支持\
    \ `canvas` 时应该如何表现。\n\n*   如果你习惯于使用 `img` 元素，你会知道它不需要闭合标签 `</img>`。相反，`canvas`\
    \ 需要闭合，所以你应该始终在容器代码的结尾包含 `</canvas>`。\n\n此时还值得提到，canvas 使用坐标、路径和渐变。这些内容在你第一次遇到它们时可能有些令人生畏，往往会让准开发者大叫着“数学！”四而逃命。但没必要担心——你很快就会掌握的。\n\
    \n## Canvas 看起来很复杂，为什么不使用 Flash？\n\n我在各种论坛上遇到过很多问题，它们的内容大同小：“Canvas 对于创建动画来说看起来太复杂了——为什么我不直接坚持使用\
    \ Flash 呢，因为我已经会它了？”\n\n嗯，Flash 的确允许你使用专业工具创建动画，这些工具并不一定需要编码技能。然而，canvas 在其他方面优于\
    \ Flash，包括：\n\n*   在桌面和移动设备上具有良好的兼容性\n*   它不需要浏览器之外的插件或依赖项\n*   它是免费的\n*   一旦你学会了使用，canvas\
    \ 用极少的代码就能创建令人深刻的动画\n\n## WebGL 如何？\n\nWebGL 允许在浏览器窗口内渲染 3D 图形，并可以使用 JavaScript\
    \ 对这些图形进行操作。如果你对使用 `canvas` 感兴趣，那么你可能也会对研究 WebGL 感兴趣；不需要插件就能创建 3D 图形非常有吸引。它已经被大多数浏览器[支持](http://caniuse.com/webgl)。尽管如此，我们不会在书中涵盖\
    \ WebGL。\n\n# 第 13 章：Canvas & SVG：Canvas 基础\n\n首先，让我们看看如何创建一个 canvas 文档。正如本书前面提到的，`canvas`\
    \ 元素本身如下：\n\n```\n<canvas id=\"MyCanvas\" width=\"300\" height=\"150\"></canvas\n\
    ```\n\n## HTML5 Canvas 模板\n\n让我们从一个可以开始工作的基础模板开始。我们将 `canvas` 元素添加到页面中，以及一个获取上下文的小型自执行脚本：\n\
    \n```\n<html>\n  <head>\n  <title>开始学习 Canvas</title>\n  <style type=\"text/css\"\
    >\n    canvas { border: 1px solid black; }\n  </style>\n  </head>\n  <body>\n\
    \    <canvas id=\"MyCanvas\" width=\"300\" height=\"150\"></canvas>\n    <script>\n\
    \      (function() {\n        var canvas = document.getElementById('MyCanvas');\n\
    \        if (canvas.getContext){\n          var ctx = canvas.getContext('2d');\n\
    \        }\n      })\n    </script>\n  </body>\n</html>\n```\n\n`canvas` 有两个基本属性：`width`\
    \ 和 `height`。如果没有指定这些属性，将使用 300px 宽由 150px 高的默认值。\n\n`getElementById` 函数简单地根据我们分配给\
    \ canvas 的 ID 在 DOM 中查找 `canvas` 元素，在这种情况下，是 `MyCanvas`。`var ctx = canvas.getContext('2d');`\
    \ 这一行是 2D 上文方法，它返回一个暴露了我们将使用的绘图方法 API 的对象。\n\n### 提示：Canvas 元素样式\n\n你可以像处理任何其他图像一样设置\
    \ `canvas` 元素，使用边框、颜色、背景等。然而，样式不会影响 canvas 上的实际绘制。没有任何样式的 canvas 将显示为透明区域。\n\n\
    ## 在 Canvas 上绘制简单形状\n\n让我们来看看如何绘制一些简单的形状。所有的绘制必须在我们的 JavaScript 函数中完成，在 `var ctx\
    \ = canvas.getContext('2d');` 这一行之后。让我们画一个矩形：\n\n```\nctx.fillStyle=\"#0000FF\"\
    ;\nctx.fillRect(0,0,300,150);\n```\n"
- fmt: "\nThis draws a blue rectangle that fills the canvas area. The `fillRect` method\
    \ requires the top-left x and y coordinates of the rectangle to be drawn, followed\
    \ by its width and height. The code above creates a 300x150px rectangle that is\
    \ positioned at with its top-left corner at coordinate 0,0 and filled with the\
    \ current `fillStyle`, which in this case is a solid blue (`#0000FF`)—see [Figure\
    \ 13.1](#ch13.html_fillblue \"Figure 13.1. Our blue rectangle\"). `fillStyle`\
    \ can be a color, gradient, or pattern.\n\n![Our blue rectangle](figures/BLUE-FILL-BORDER.png)\n\
    \nFigure 13.1. Our blue rectangle\n\nThe canvas 2D API provides methods for drawing\
    \ several basic shapes, including:\n\n*   Rectangles\n*   Arcs\n*   Paths\n* \
    \  Text\n*   Images\n\nW specified the size of the canvas as being 300x150px.\
    \ If we reduce the rectangle's size, then you'll see that you have a rectangle\
    \ within the canvas. For example, if we modify the code as follows:\n\n```\nctx.fillStyle=\"\
    #0000FF\";\nctx.fillRect(0,0,150,75);\n```\n\n![A resized rectangle](figures/Blue-part-fill.png)\n\
    \nFigure 13.2. A resized rectangle\n\nThe canvas itself remains as a transparent\
    \ box, as you can see. As we've included a black border around the canvas you\
    \ can see its area. Without the border you'd see nothing but the blue box, but\
    \ the canvas would still be there.\n\nRemember that the canvas `width` and `height`\
    \ attributes determine the dimensions of the pixel coordinate system. If you use\
    \ CSS to specify a different width or height, the canvas image will be squashed\
    \ or stretched accordingly. For example, if we apply a width of 600px and height\
    \ of 300px to the canvas in CSS, each canvas 'pixel' would be twice the size of\
    \ a normal pixel.\n\n## Canvas Coordinates and Paths\n\nCanvas uses a two-dimensional\
    \ coordinates grid. The top-left of the canvas has a coordinate of (0,0). The\
    \ bottom-right will have a positive x and y coordinate according to the size of\
    \ the element. In the example above, we used a canvas size of 300x150px, so the\
    \ bottom-right pixel is at (299,149), because coordinates are zero-based.\n\n\
    Lines are drawn on the canvas using `paths`. You create paths by using the `moveTo()`\
    \ and `lineTo()` methods, in conjunction with one of the `ink` methods, `stroke()`\
    \ or `fill()`. `moveTo()` and `lineTo()` define the start and end points of the\
    \ line to be drawn. `stroke()` draws a shape by \"stroking\" its outline, while\
    \ `fill()` draws a solid shape by filling in the content area of a path.\n\nSo,\
    \ to draw a simple white line through the rectangle we created above:\n\n```\n\
    ctx.strokeStyle = \"#FFFFFF\";\nctx.beginPath();\nctx.moveTo(0,0);\nctx.lineTo(300,150);\n\
    ctx.stroke();\n```\n\nThe `beginPath` method erases any outstanding path drawing\
    \ operations in preparation for a new path. The `stroke()` method physically draws\
    \ the path you've defined. In this case, it's a single line.\n\n## Drawing Circles\n\
    \nNow let's look at how we'd draw a circle. The simplest way to do this is to\
    \ use `arc` to effectively create a circular path, which can then be used with\
    \ ink methods, such as `stroke()` or `fill()`, like this:\n\n```\nctx.beginPath();\n\
    ctx.arc(95,50,40,0,2*Math.PI);\nctx.stroke();\n```\n\nHere we're using the `arc`\
    \ method (which can still be part of a path). The parameters specify the x and\
    \ y coordinates of the arc's center, the arc's radius, the start angle, and end\
    \ angle (in [radians](http://en.wikipedia.org/wiki/Radian)). Therefore, we've\
    \ created an arc centered on coordinates 95,50, with a radius of 40 pixels, with\
    \ a start angle of 0 and an end angle of 2*PI (or 360 degrees). We've used the\
    \ `stroke()` method to draw the path, which gives us a circle, as shown in [Figure\
    \ 13.3](#ch13.html_circle \"Figure 13.3. Drawing a circle\"):\n\n![Drawing a circle](figures/canvasCIRCLE.png)\n\
    \nFigure 13.3. Drawing a circle\n\nIf you added the `fill()` method, you would\
    \ end up with a circle that is filled in with the specified color, black by default,\
    \ as shown in [Figure 13.4](#ch13.html_filledcirc \"Figure 13.4. A filled circle\"\
    ).\n\n![A filled circle](figures/canvasCIRCLEFILL.png)\n\nFigure 13.4. A filled\
    \ circle\n\n## Drawing Text\n\nYou can draw text onto a canvas using these methods:\n\
    \n*   `font`—defines the font properties\n*   `fillText(text,x,y)`—draws text\
    \ on the canvas\n*   `strokeText(text,x,y)`—draws the outline of text on the canvas\n\
    \nHere's an example:\n\n```\nctx.font = \"25px Arial\";\nctx.fillText(\"HTML5\
    \ Canvas Rocks!\",10,50);\n```\n\nThis will draw the words \"HTML5 Canvas Rocks!\"\
    \ using block text, using the font Ariel at 25 pixel size, at the coordinates\
    \ (10,50), as shown in [Figure 13.5](#ch13.html_text \"Figure 13.5. Writing text\
    \ to the canvas\").\n\n![Writing text to the canvas](figures/canvasHTML5TEXT.png)\n\
    \nFigure 13.5. Writing text to the canvas\n\nIf you were to replace `fillText()`\
    \ now with `strokeText()`, you would instead have outlined text, as shown in [Figure\
    \ 13.6](#ch13.html_stroketext \"Figure 13.6. Stroked text\").\n\n![Stroked text](figures/canvasSTROKETEXT.png)\n\
    \nFigure 13.6. Stroked text\n\nYou can also add text effects and colors:\n\n```\n\
    ctx.fillStyle= '#0000FF';\nctx.font=\"Italic 25px Arial\";\nctx.fillText(\"HTML5\
    \ Canvas Rocks!\",10,50);\n```\n\nThis will italicize the text and make it blue,\
    \ as shown in [Figure 13.7](#ch13.html_blueitalic \"Figure 13.7. Blue italic text\"\
    ).\n\n![Blue italic text](figures/canvasBLUEITALICS.png)\n\nFigure 13.7. Blue\
    \ italic text\n\n## Drawing a Triangle\n\nLet's draw a triangle. As there's no\
    \ built-in triangle shape for us to draw with, we'll need to construct it using\
    \ paths. To create a basic triangle we can use the following code:\n\n```\nctx.beginPath();\n\
    ctx.moveTo(25,25);\nctx.lineTo(105,25);\nctx.lineTo(25,105);\nctx.fill();\n```\n\
    \nThis should appear as shown in [Figure 13.8](#ch13.html_filledtriangle \"Figure\
    \ 13.8. A filled triangle\"):\n\n![A filled triangle](figures/canvas_TRIANGLE.png)\n\
    \nFigure 13.8. A filled triangle\n\nTo create a stroked triangle:\n\n```\nctx.beginPath();\n\
    ctx.moveTo(125,125);\nctx.lineTo(125,45);\nctx.lineTo(45,125);\nctx.closePath();\n\
    ctx.stroke();\n```\n\nNote the `closePath()` method; this closes the path by drawing\
    \ a straight line from the current point to the initial point. This will appear\
    \ as shown in [Figure 13.9](#ch13.html_strokedtri \"Figure 13.9. A stroked triangle\"\
    ):\n\n![A stroked triangle](figures/canvasSTROKEDTRIANGLE.png)\n\nFigure 13.9.\
    \ A stroked triangle\n\nSo that's how to draw basic shapes in HTML5 using the\
    \ `canvas` element and JavaScript. Now that you've learned the basics, go and\
    \ practice with different styles, fonts, and shapes to get further accustomed\
    \ to using the JavaScript code.\n\n## Canvas Sizing\n\nDepending on what you're\
    \ developing using canvas, you can resize to fit the device being used—if you're\
    \ needing to fill the screen for say, a game. This can be achieved in a number\
    \ of ways:\n\n*   coding in JavaScript\n*   using CSS\n*   CSS transforms using\
    \ JavaScript\n\n### Scaling with JavaScript\n\n```\nvar canvas = document.getElementById('canvas');\n\
    canvas.width = window.innerWidth;\ncanvas.height = window.innerHeight;\n```\n\n\
    This will create a canvas which extends to the current viewport size, but you\
    \ will need to ensure the element has no margin or is affected by other items\
    \ on the page. In addition, changing the browser window size will not modify the\
    \ canvas dimensions.\n\n### Scaling with CSS\n\n```css\n#canvas {\n  position:\
    \ relative;\n  left: 0;\n  right: 0;\n  top: 0;\n  bottom: 0;\n  margin: auto;\n\
    \  width: 100%;\n  height: 100%;\n}\n```\n\nThis changes the size of the canvas\
    \ box but not the pixel dimensions; the coordinate system remains the same.\n\n\
    ### CSS Transforms Using JavaScript\n\n```\nvar scaleX = canvas.width / window.innerWidth;\
    \ \nvar scaleY = canvas.height / window.innerHeight; \nvar scaleToFit = Math.min(scaleX,\
    \ scaleY); \ncanvas.style.transformOrigin = \"0 0\"; \ncanvas.style.transform\
    \ = \"scale(\"+scaleToFit+\")\";\n```\n\nAgain, this changes the size of the canvas\
    \ box, but not the pixel dimensions.\n"
