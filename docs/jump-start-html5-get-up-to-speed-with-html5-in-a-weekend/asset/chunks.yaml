  trans: "\n\n虽然对于音频文件来说这可能毫无意义，但对于视频来说就更有意义了。例如，视频广告仍然可以在视觉上吸引用户的注意力，而不会产生声音的额外干扰。再次注意，`muted`\
    \ 是空属性。对于 XHTML 语法，你需要使用 `muted=\"\"` 或 `muted=\"muted\"` 来代之。\n\n我们还可以通过脚本和 `volume`\
    \ 属性来控制音频输出。\n\n## 使用 `preload` 属性进行缓冲提示\n\n多媒体消耗大量的带宽——无论对你的服务器还是你的用户。音频和视频数据占用大量字节。当文档加载时，浏览器会请求并下载媒体文件的片段。通常，这个片段仅足够确定文件的时长或尺寸。对于视频，它还可能下载一或两帧。当播放开始时，浏览器将就会发出另一个请求（有时是多次请求）来获取剩余的媒体文件。\n\
    \n这些每一个请求都会对服务器产生额外需求。无论用户是否听音频或观看视频文件，部分请求都会发生。好消息是，我们可以如如下所示通过 `preload` 属性来引导这种行为。\n\
    \n```\n<audio src=\"/path/to/media.file\" controls muted preload=\"auto\">\n</audio>\n\
    ```\n\n`preload` 属性接受三个可能的值。\n\n- `none` 告诉浏览器在用户请求之前不要下载任何内容，但在播放时它可能会下载整个视频。\n\
    - `metadata` 提示浏览器可以下载部分媒体文件，并在播放期间限制下载速度。\n- `auto` 告诉浏览器可以随其意下载尽可能多的视频内容。\n\n\
    ### `preload=\"auto\"`\n\n使用 `auto` 是这些值中要求最高的。`auto` 值告诉浏览器可以下载它想要的尽可能多的文件，直到整个资源。播放通常更加稳定，因为更多的视频内容已经在浏览器的缓冲区中了。这对用户来说很棒，但对你的带宽使用可能没那么好。正如图\
    \ 7.2 所示，Firefox 为我们的媒体文件 Pontification.ogg 发起了三次请求。\n\n![开发者工具中显示 preload=\"\
    auto\" 时对 Pontification.ogg 的请求](img/audio-preload-auto-firefox.png)\n\n图 7.2.\
    \ Firefox 开发者工具中显示 `preload=\"auto\"` 时对 Pontification.ogg 的请求\n\n### `preload=\"\
    none\"`\n\n`preload` 值为 `none` 告诉浏览器：“在用户尝试播放此文件之前，你都不敢下载哪怕一个字节！” 优点是，`preload=\"\
    none\"` 会减少请求次数，从而减少带宽消耗。在下方的图 7.3，我们可以看到浏览器对我们的 HTML 文档发起了请求，但没有请求我们的媒体文件。\n\n\
    ![开发者工具中显示 preload=\"none\" 时对 Pontification.ogg 的请求](img/audio-preload-none-firefox.png)\n\
    \n图 7.3. Firefox 开发者工具中显示 `preload=\"none\"` 时对 Pontification.ogg 的请求\n\n缺点是，`preload=\"\
    none\"` 意味着响应速度会较低。用户在点击“播放”到媒体实际开始播放之间可能会经历几秒的延迟。然而，一旦开始播放，浏览器可能会激进地下载文件。\n\n\
    ### `preload=\"metadata\"`\n\n将 `metadata` 视为两者之间的一种很好的折中方案。当 `preload` 属性设置为\
    \ `metadata` 时，浏览器将发送一个请求，并只下载部分文件。\n\n![开发者工具中显示 preload=\"metadata\" 时对 Pontification.ogg\
    \ 的请求](img/audio-preload-metadata-firefox.png)\n\n图 7.4. Firefox 开发者工具中显示 `preload=\"\
    metadata\"` 时对 Pontification.ogg 的请求\n\n使用 `metadata` 值还提示浏览器在播放开始后应该限制下载。`preload=\"\
    none\"` 或 `preload=\"auto\"` 都不能阻止浏览器下载整个资源。然而，`preload=\"metadata\"` 提示浏览器应该在允许流畅播放的最慢速率下下载文件。\n\
    \n有趣的地方在这里：我们可以使用 JavaScript 在播放开始后更改 `preload` 的值。例如，我们可能想从 `preload=\"none\"\
    ` 开始，这样就不会下载额外数据。一旦用户开始播放，我们就可以切换到 `preload=\"metadata\"` 并享受下载限制的好处。在第 6 章 中有一个如何操作的示例。\n\
    \n## 回退内容\n\n注意这里我们为 `audio` 元素同时使用了开始和结束标签，但中间没有任何内容。如果用户使用不支持音频的浏览器访问我们的页面，他们将看不到任何关于播放器缺失的指示（除非页面上的其他内容告诉了他们）。\n\
    \n我们可以通过在 `<audio>` 和 `</audio>` 标签之间添加回退内容来解决这个问题，如下所示。\n\n```\n <audio src=\"\
    /path/to/media.file\" controls>\n   哦不！您的浏览器不支持 HTML5 音频。\n   如果可以，请升级您的浏览器。\n\
    \ </audio>\n```\n\n你也可以使用图像作为替代内容，或者在标签之间嵌入基于 Flash 的播放器。正如我们在第 8 章和第 9 章所示，我们的\
    \ `<source>` 和 `<track>` 标签也位于我们的开始和结束标签之间。\n\n记住：我们目前讨论的所有内容也适用于 `video` 元素。但\
    \ `video` 元素还有几个更符合视觉媒体的属性。我们将在下一章中讨论它们。\n\n# 第 8 章\n\n## 多媒体：使用原生 HTML5 视频\n\n\
    在 HTML 文档中添加视频与添加音频一样简单：使用 `<video>` 标签。与 `audio` 一样，`video` 元素需要一个结束标签（</video>`）和一个\
    \ `src` 属性。\n\n创建一个新的 HTML 文档并添加下面的代码，将 `src` 的值指向你选择的媒体文件。将其保存为 video.html，并在浏览器中打开该文件。\n\
    \n```\n<video src=\"/path/to/media.file\"></video>\n```\n\n你应该能看到视频的第一帧，仅此而已，如图\
    \ 8.1 所示。与 `audio` 一样，`video` 元素默认缺少控制（除非禁用了 JavaScript）。\n\n![Chrome Canary 中未设置\
    \ controls 属性时的视频播放器。图片来自 Blender Foundation 的 \"Big Buck Bunny\"，bigbuckbunny.org](img/default-video-control-chrome.png)\n\
    \n图 8.1. Chrome Canary 中未设置 `controls` 属性时的视频播放器。图片来自 Blender Foundation 的 \"\
    Big Buck Bunny\"，bigbuckbunny.org\n\n为了启用控制，我们需要添加一个 `controls` 属性，如下所示。\n\n```\n\
    \ <video src=\"/path/to/media.file\" controls></video>\n```\n\n与 `audio` 元素一样，这将为视频添加一个播放器用户界面，使用户可以播放、暂停、进度和调整音量。视频控制看起来与其音频控制大致相同。它们通常有一个用于进入和退出全屏播放的额外控制，在大多数浏览器中，一个控制开关可以切换字幕和说明。播放器的外观取决于浏览器，并不是每个浏览器都能轻松地重样式这些控件。\n\
    \n## 设置视频尺寸\n\n"
- fmt: "\nAll videos files have `intrinsic` dimensions of width and height. Intrinsic\
    \ dimensions are the \"natural\" or default height and width of a file. For example,\
    \ a video file may be 640 pixels wide and 480 pixels high. However, we can tell\
    \ the browser to limit the size of our video player within our document layout\
    \ using the `width` and `height` attributes. An example follows.\n\n```html\n\
    <video src=\"/path/to/media.file\" controls width=\"427\" height=\"240\">\n</video>\n\
    ```\n\nThis will constrain our video to a box that's 427 pixels wide by 240 pixels\
    \ high. The video file itself will retain its dimensions. But it will be displayed\
    \ within the space we've defined, as shown in [Figure 8.2](#ch08.html_resizedvid\
    \ \"Figure 8.2. We've set our video to be 427 pixels wide by 240 pixels tall.\
    \ The Google Chrome window is 640 pixels wide. Image from \"Big Buck Bunny\" by\
    \ the Blender Foundation, bigbuckbunny.org\").\n\n![We've set our video to be\
    \ 427 pixels wide by 240 pixels tall. The Google Chrome window is 640 pixels wide.\
    \ Image from \"Big Buck Bunny\" by the Blender Foundation, bigbuckbunny.org](figures/resized-video-chrome.png)\n\
    \nFigure 8.2. We've set our video to be 427 pixels wide by 240 pixels tall. The\
    \ Google Chrome window is 640 pixels wide. Image from \"Big Buck Bunny\" by the\
    \ Blender Foundation, bigbuckbunny.org\n\nWithout a known width or height, the\
    \ default size of an HTML5 video player is 300 pixels wide by 150 pixels high.\
    \ Once the browser can determine the video's intrinsic dimensions, it will resize\
    \ the element. If you've used a `preload` value of `auto` or `metadata`, this\
    \ will happen as the video loads. If you've used a `preload` value of `none`,\
    \ it will happen once the user initiates playback.\n\n![A default video player\
    \ in Opera 16 when the preload attribute is set to none](figures/default-video-opera.png)\n\
    \nFigure 8.3. A default video player in Opera 16 when the `preload` attribute\
    \ is set to `none`\n\nThis is similar to the way the `img` element works. When\
    \ we don't specify the size of our element box, the box will expand to accommodate\
    \ the content. Setting a height and width prevents this from happening.\n\nIn\
    \ the example above, we specified the values in pixels, but we could also use\
    \ percentage values. Let's change our values from the example above to use percentages.\n\
    \n```html\n<video src=\"/path/to/media.file\" controls \nwidth=\"100%\" height=\"\
    100%\">\n</video>\n```\n\nNow the dimensions of our video element will grow or\
    \ shrink relative to the height and/or width of its containing element.\n\nSetting\
    \ `width` and `height` attributes aren't the only way we can control the size\
    \ of our `video` element. We can use CSS instead, as shown below.\n\n```css\n\
    video {\n    width: 427px;\n    height: 240px;\n}\n```\n\nHere we've used the\
    \ `video` element selector, which means these styles will apply to every video\
    \ in our document and on our site. Between our curly braces, we've added a `width`\
    \ property and a value of `427px` or 427 pixels and a `height` property with a\
    \ value of `240px`. As with the HTML attributes, we're not restricted to pixel-based\
    \ values. We could also use percentages, or any other length value permitted by\
    \ CSS.\n\nIf you use CSS, keep in mind that those values will have priority over\
    \ any `width` and `height` attributes in your HTML. If you're not familiar with\
    \ CSS, SitePoint's book, [Jump Start CSS](http://www.sitepoint.com/store/jump-start-css/)\
    \ by Louis Lazaris will bring you up to speed.\n\n### Percentages for Height\n\
    \nUsing a percentage value for `height` is tricky. It only works when the height\
    \ of the parent element has also been explicitly set. For example, if the parent\
    \ element for your video is the `body` element, you'll need to use CSS to specify\
    \ its height, as shown below.\n\n```css\nbody {\n    height: 100%;\n}\n```\n\n\
    Now your `video` element will expand in height as the `body` element does. There's\
    \ a caveat here, however. While the aspect ratio of your *video element* will\
    \ change, the aspect ratio of the video will not. When the aspect ratio of the\
    \ `video` element differs from that of the video itself, you'll end up with extra\
    \ room around your video image, as shown in [Figure 8.4](#ch08.html_aspects \"\
    Figure 8.4. The orange stripes at the top and bottom of the video is the difference\
    \ between the aspect ratio of the video element and the video file\").\n\n![The\
    \ orange stripes at the top and bottom of the video is the difference between\
    \ the aspect ratio of the video element and the video file](figures/video-percentage-height.png)\n\
    \nFigure 8.4. The orange stripes at the top and bottom of the video is the difference\
    \ between the aspect ratio of the video element and the video file\n\nFor this\
    \ reason, it's usually less hassle to use a percentage value for width and let\
    \ the browser adjust the height automatically.\n\n```css\nvideo {\n    width:\
    \ 800px;\n    height: auto;\n}\n```\n\n### Setting a Poster Image\n\nIf you use\
    \ `auto` or `metadata` for `preload`, your video will load the first frame. But\
    \ if you've used `none`, visitors will just see the placeholder. We can do better\
    \ than that. Let's specify an image using the `poster` attribute.\n\n```html\n\
    <video src=\"/path/to/media.file\" controls width=\"427\" height=\"240\" poster=\"\
    /path/to/poster.image\">\n</video>\n```\n\nThe value of the `poster` attribute\
    \ must be the URL of an image file. It will be displayed when no video data is\
    \ available. It's intended to be representative of the video, but it could easily\
    \ be a corporate logo or simple title. In [Chapter 6](#ch06.html \"Multimedia:\
    \ Preparing Your Media\"), we mentioned how to extract images from videos using\
    \ FFmpeg, which you could use for the poster frame. But you could also take a\
    \ regular screen shot and edit it using an image editor.\n\n#### Poster Image\
    \ Dimensions and `video` Element Dimensions\n\nPoster images have intrinsic dimensions,\
    \ just as video files do. Initially, the size of the `video` element will match\
    \ the width and height of your poster image. Once the browser knows the dimensions\
    \ of the video it will resize the element to match. To prevent this, either:\n\
    \n1.  ensure that your poster image has the same height and width as your video;\
    \ or\n\n2.  specify a height and width for the `video` element using attributes\
    \ or CSS.\n\nAlmost any image format will work for your poster image, including\
    \ SVG. Most browsers will constrain the image to the dimensions of the video element,\
    \ if they are set, and expand to the size of the SVG file if not.\n\n![Most browsers\
    \ constrain the dimensions of an SVG poster image to those of the video element.\
    \ SVG image by Michele Brami from Openclipart.org](figures/svg-poster-img-chrome.png)\n\
    \nFigure 8.5. Most browsers constrain the dimensions of an SVG poster image to\
    \ those of the video element. SVG image by Michele Brami from Openclipart.org\n\
    \nInternet Explorer does the opposite, however. It will constrain the poster image\
    \ to the default 300-by-150 size when the video element lacks a height and width.\
    \ If the dimensions *are* set, the SVG image will expand to its full intrinsic\
    \ size.\n\n![Internet Explorer doesn't constrain SVG poster images when the video\
    \ element has a set height and width. SVG image by Michele Brami from Openclipart.org](figures/svg-poster-img-ie.png)\n\
    \nFigure 8.6. Internet Explorer doesn't constrain SVG poster images when the video\
    \ element has a set height and width. SVG image by Michele Brami from Openclipart.org\n\
    \nTo work around this, make the intrinsic size of your SVG file smaller than the\
    \ height and width of your `video` element.\n\n### What We've Learned So Far\n"
