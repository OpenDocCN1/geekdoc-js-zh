  trans: "\n现在在浏览器中打开它，你会发现现在有了一个蓝黄相间的圆圈。要将其变为径向渐变，只需使用 `radialGradient` 标签即可：\n\n\
    ```xml\n<!-- 定义渐变 -->\n<defs>\n  <radialGradient id=\"MyGradient\">\n    <stop\
    \ offset=\"10%\" stop-color=\"yellow\" />\n    <stop offset=\"90%\" stop-color=\"\
    blue\" />\n  </radialGradient>\n</defs>\n\n<!-- 在圆形中使用渐变 -->\n<circle cx=\"100\"\
    \ cy=\"100\" r=\"100\" fill=\"url(#MyGradient)\" />\n```\n\n### 模式\n\n你还可以在 `pattern`\
    \ 标签内创建重复设计。这定义了一系列 SVG 元素，可以用于填充区域：\n\n```svg\n<svg>\n<defs>\n<pattern id=\"\
    mypattern\" x=\"0\" y=\"0\" width=\"150\" height=\"100\" \npatternUnits=\"userSpaceOnUse\"\
    >\n  <circle cx=\"50\" cy=\"50\" r=\"10\" fill=\"red\" stroke=\"black\"\n/>\n\
    \  <rect x=\"100\" y=\"0\" width=\"50\" height=\"50\" fill=\"cyan\"   \nstroke=\"\
    red\" />\n</pattern>\n</defs>\n  <ellipse fill=\"url(#mypattern)\" stroke=\"black\"\
    \nstroke-width=\"1\" cx=\"200\" cy=\"200\" rx=\"200\" ry=\"200\" />\n</svg>\n\n\
    <!-- 定义模式 -->\n<defs>\n  <pattern id=\"mypattern\" patternUnits=\"userSpaceOnUse\"\
    \ \nx=\"0\" y=\"0\" width=\"50\" height=\"50\">\n    <circle cx=\"25\" cy=\"25\"\
    \ r=\"25\" fill=\"red\" stroke=\"black\" />\n    <rect x=\"25\" y=\"25\" width=\"\
    25\" height=\"25\" \nfill=\"cyan\" stroke=\"red\" />\n  </pattern>\n</defs>\n\n\
    <!-- 在圆形中使用模式 -->\n<circle cx=\"100\" cy=\"100\" r=\"100\" fill=\"url(#MyPattern)\"\
    \ \nstroke-width=\"1\" stroke=\"black\" />\n```\n\n保存上述代码并在浏览器中打开以查看结果，结果如图图 17.8\
    \ 所示。现在你可以尝试使用各种形状和颜色渐变看看还能制作哪些其他模式。\n\n![模式填充](img/svgpattern.png)\n\n图 17.8.\
    \ 模式填充\n\n# 第 18 章：Canvas & SVG：使用 SVG\n\n在现代浏览器中，SVG 可以用于任何通常使用 JPG、GIF 或 PNG\
    \ 的地方。此外，它还具有添加颜色和渐变的能力，并且在缩放时不会损失质量，对于大多数设计师来说是一件令人兴奋的事情。\n\n## 在页面上插入 SVG 图像\n\
    \n有几种方法可以向页面添加 SVG：\n\n* 使用 `object` 标签\n* 使用 `embed` 标签\n* 在 `iFrame` 中使用\n*\
    \ 使用 CSS 背景\n* 嵌入到 HTML5 页面中的内联 SVG\n* 使用 `img` 标签\n\n### 重要提示：使用 CSS 处理重复背景\n\
    \n只有 CSS 可以用于重复背景。其他方法将只显示单张图像。\n\n### 你应该使用哪种方法？\n\n这取决于具体的项目，但通常如果你打算使用 DOM\
    \ 脚本在 JavaScript 中操作图像，则应该使用 `object` 或 `embed`。`iframe` 也可以用于相同目的，尽管代码会变得稍微繁琐。或者，如果你需要脚本但图像仅用于网站上的单个页面，那么内联\
    \ SVG 可能是合适的。\n\n如果你只需要静态的 SVG，请使用 `img` 标签或 CSS 背景。这些方法不允许在客户端修改 SVG。\n\n###\
    \ 重要提示：SVG MIME 类型\n\n你的 Web 服务器应该返回 MIME 类型为 `image/svg+xml` 的 SVG 图像。大多数服务器会自动处理这一点，但如果图像显示不正确，请双重检查。\n\
    \n让我们看看如何使用 `object` 方法，使用一个我们使用 Illustrator 或 Inkscape 等应用程序创建的 SVG 文件：\n\n```xml\n\
    <object type=\"image/svg+xml\" \nwidth=\"400\" height=\"400\" data=\"image.svg\"\
    >\n</object>\n```\n\n`embed` 标签与之类似，但 `embed` 直到 HTML5 才成为标准。某些旧版浏览器可能会忽略它，但大多数浏览器都实现了该标签：\n\
    \n```xml\n<embed type=\"image/svg+xml\" \nwidth=\"400\" height=\"400\" src=\"\
    image.svg\">\n</embed>\n```\n\n`iframe` 像加载任何其他网页一样加载 SVG：\n\n```xml\n<iframe\
    \ src=\"image.svg\">\n</iframe>\n```\n\n我们已经使用过直接添加到 HTML 页面中的内联 SVG 图像。这不会产生额外的\
    \ HTTP 请求，但仅对于非常小的图像或你不打算在其他地方使用的图像是实用的：\n\n```xml\n<svg width=\"200\" height=\"\
    200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <circle id=\"redcircle\" cx=\"\
    100\" cy=\"100\" r=\"100\" fill=\"red\" />\n</svg>\n```\n\n`img` 标签与之前使用的任何标签相同：\n\
    \n```xml\n<img src=\"image.svg\" />\n```\n\n最后，CSS 的 `background-image` 属性可以引用\
    \ SVG：\n\n```css\n#myelement {\n  background-image: url(image.svg);\n}\n```\n\n\
    ### SVG 工具和库\n\n有很多用于创建和操作 SVG 图像的库、片段和实用工具。\n\nAdobe 的 [Snap SVG](http://snapsvg.io/)\
    \ 是一个生成交互式 SVG 的免费开源工具。\n\n另一个很好的资源 [Bonsai](http://bonsaijs.org/) 提供了一个 JavaScript\
    \ 库，带有片段和演示，帮助使用客户端代码修改 SVG 图像。\n\n# 第 19 章：Canvas & SVG：SVG 曲线\n\n贝塞尔曲线在图形软件中广泛广泛，有时被描述为[多项式](http://en.wikipedia.org/wiki/Polynomial)表达式，基本上用于描述曲线。有时，贝塞尔曲线被简单称为曲线，如果你不熟悉设计中所有常见（或不常见）的术语，这可能会稍微引起困惑。\n\
    \n贝塞尔曲线由控制点构建，如图图 19.1 所示。二次贝塞尔曲线有一个控制点，而三次贝塞尔曲线有两个。\n\n## 二次贝塞尔曲线\n\n![二次贝塞尔曲线](img/Bezier.png)\n\
    \n图 19.1. 二次贝塞尔曲线\n\n现在让我们看看如何在 SVG 中创建整幅图像。使用你的文本编辑器保存以下代码，然后在浏览器中打开它，你应该看到一个\
    \ **A** 形状，带有一条弯线延伸到交叉形状的线条：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<svg\
    \ width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\" version=\"\
    1.1\">\n\n  <!-- 线条 -->\n  <path id=\"lineAB\" d=\"M 100 350 l 150 -30\" stroke=\"\
    gold\" stroke-width=\"10\"/>\n  <path id=\"lineBC\" d=\"M 250 50 l 150 300\" stroke=\"\
    gold\" stroke-width=\"10\"/>\n  <path id=\"lineDE\" d=\"M 175 200 l 150 0\" stroke=\"\
    purple\" stroke-width=\"10\"/>\n\n  <!-- 二次曲线 -->\n  <path d=\"M 100 350 q 150\
    \ -300 300 0\" stroke=\"black\"\nstroke-width=\"6\" fill=\"none\" />\n\n  <!--\
    \ 用红点标记点 -->\n  <g stroke=\"red\" stroke-width=\"5\" fill=\"red\">\n    <circle\
    \ id=\"pointA\" cx=\"100\" cy=\"350\" r=\"3\" />\n    <circle id=\"pointB\" cx=\"\
    250\" cy=\"50\" r=\"3\" />\n    <circle id=\"pointC\" cx=\"400\" cy=\"350\" r=\"\
    3\" />\n  </g>\n\n  <!-- 为每个点添加标签 -->\n  <g font-size=\"25\" font-family=\"sans-serif\"\
    \ fill=\"black\" stroke=\"none\"\ntext-anchor=\"middle\">\n    <text x=\"100\"\
    \ y=\"350\" dx=\"-30\">A</text>\n    <text x=\"250\" y=\"50\" dy=\"-10\">B</text>\n\
    \    <text x=\"400\" y=\"350\" dx=\"30\">C</text>\n  </g>\n\n</svg>\n</body>\n\
    </html>\n```\n\n二次贝塞尔曲线由 `path` 标签定义：\n\n```xml\n<path d=\"M 100 350 q 150 -300\
    \ 300 0\" stroke=\"black\"\nstroke-width=\"6\" fill=\"none\" />\n```\n\n`d` 属性指示解析器移动到坐标\
    \ (100,350)。`q` 定义了两个相对于 (100,350) 的坐标。第一个是控制点 (150,-300)——等同于绝对位置 (450,50)。第二个是曲线的终点\
    \ (300,0)——等同于绝对位置 (400,350)。\n\n或者，我们可以使用大写的 `Q` 来使用绝对而非相对坐标引用。\n\n## 三次贝塞尔曲线\n\
    \n虽然二次贝塞尔曲线有一个控制点，但三次贝塞尔曲线有两个控制点。这允许创建更复杂的形状，这些形状可以改变方向或折叠自身。\n\n以下代码提供了三个三次贝塞尔曲线示例：\n\
    \n"
