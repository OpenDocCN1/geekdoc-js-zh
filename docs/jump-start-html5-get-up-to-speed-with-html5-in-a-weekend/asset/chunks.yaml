  trans: "\n在本章中，我们将快速游览 HTML5 API 的世界。我将概述书中将讨论的 API，以及你读完本书后将学到的内容。本章将不会涉及任何代码实现，而是会为每个\
    \ API 提供一个快速概览，以便你对将要学习的内容有一个清晰的认识。\n\n某些 HTML5 API 仍然非常新，并不是每个浏览器的每个版本都支持它们，在创建\
    \ HTML5 应用时你需要记住这一点。每当你准备使用任何 HTML5 API 时，检查浏览器对该 API 的支持情况总是个好主意。我们将在本章的最后一节查看如何操作。\n\
    \n## 涵盖的 HTML5 API 快速概览\n\n由于这是一本短书，无法涵盖每一个 API。某些 API 已经在 SitePoint 的 Jump Start\
    \ HTML5 系列的其他书中涵盖了。在本书中，我们将重点介绍五个重要的 JavaScript API，你可以使用它们来创建非常酷的 Web 应用。（是的，使用原生的\
    \ HTML5 和 JavaScript 构建的 Web 应用！这有多酷吗？）所以，让我们来看看我们要讨论的内容：\n\n*   **Web Workers\
    \ API**：想过为 Web 引入多线程吗？你是否想过在不影响主 JavaScript 线程的情况下在后台执行某些持续任务？如果是这样，可能是时候让你熟悉\
    \ Web Workers API 了，因为它专为此目的而设计。\n    *   **正式定义：** `Workers API` 用于在后台线程中运行脚本，该线程与主线程并行运行。换句话说，你可以在后台执行计算密集型任务或实现长轮询，而你的主\
    \ UI 线程将不受影响。\n*   **Geolocation API**：这个新 API 仅让你知道用户在哪里。它让你能够找到用户的位置——即使他们在移动中也是如此。此外，你可以根据他们的位置为他们提供定制化的选择（也许是附近的不错咖啡馆或剧院），或者在地图上标记他们的位置。\n\
    \    *   **正式定义：** `Geolocation API` 让你的应用程序通过简单的 JavaScript 接收用户的当前地理位置。\n* \
    \  **Server-sent Events API**：Facebook 向你的动态墙推送新更新的方式非常棒，不是吗？在引入服务器发送事件（Sent Events，简称\
    \ SSE）之前，这种功能是使用长轮询实现的。但有了全新的 SSE，服务器可以在新更新可用时自动将更新推送到网页上。你可以在脚本中访问这些更新并通知你的用户。\n\
    \    *   **正式定义：** `Server-sent Events API` 让你的客户端在不需要长轮询的情况下接收服务器的推送通知。\n*  \
    \ **WebSocket API**：这个 API 帮助你构建允许客户端和服务器之间双向通信的应用。`WebSocket API` 的经典用例是聊天应用程序，客户端向服务器发送消息，服务器进行处理并回复！\n\
    \    *   **正式定义：** 该 API 实现了客户端与服务器之间低延迟、全双工的单字连接。\n*   **Cross-document Messaging\
    \ API**：由于可怕的 CSRF 攻击，来自不同域的文档通常不允许相互通信。但有了这个新的跨文档消息 API，来自不同源的文档可以相互通信，同时仍然能够防止\
    \ CSRF 攻击。\n    *   **正式定义：** 该 API 引入了一种消息系统，允许文档之间进行通信——无论源域如何——且不会产生 CSRF 问题。\n\
    \n### 注意事项：跨站请求伪造 (CSRF)\n\nCSRF 是一种攻击类型，它欺骗终端用户在不知情的情况下在 Web 应用程序上执行敏感操作。通常，网站只验证请求是否来自已验证身份用户的浏览器，但并不验证已验证的用户本人是否在发送请求。这就是\
    \ CSRF 攻击的常见原因。\n\n要了解更多关于 CSRF 攻击的信息，请访问 [Open Web Application Security Project](https://www.owasp.org/index.php/Cross-Site_Request_Forgery_(CSRF))。\n\
    \n## 你将学什么\n\n本书将对上述 API 提供清晰、简洁的解释。你将学习每个 API 的用途以及如何使用它们。到书结束时，你将能够使用一些惊人的 HTML5\
    \ 特性创建酷且令人兴奋的应用。\n\n在解释 API 时，我将提供一些代码片段来描述它们的通用工作原理。由于这是一本短书，无法详尽地涵盖所有内容，但我将尝试在每章中尽可能涵盖。我还会为每个\
    \ API 提供指导并分享示例用例。\n\n## 入门\n\n在深入 HTML5 世界之前，有一点警告需要注意。正如前面提到的，某些 HTML5 API 是非常新的，因此你应该始终确保特定功能在浏览器中支持。如果没有支持（或支持有限），你应该通过回退到其他技术来优雅地处理。这被称为\
    \ `优雅降级` (graceful degradation)；换句话说，你的应用程序是为现代浏览器设计的，但在旧浏览器中仍然可以运行。另一方面，你也可以选择\
    \ `渐进式增强技术` (progressive enhancement techniques)，即你创建一个功能有限的应用，并在浏览器支持时添加新功能。关于此点的更多信息，请查看\
    \ [Craig Buckler 在 sitepoint.com 文章](http://www.sitepoint.com/progressive-enhancement-graceful-degradation-choice)。\n\
    \n在本节中，我们将讨论处理浏览器兼容性问题以及搭建开发环境。\n\n### 检查浏览器兼容性\n\n获取浏览器支持的 HTML5 功能列表总是好的。在使用任何\
    \ API 之前，请参考显示哪些浏览器支持该 API 的兼容性表。我个人更喜欢 [caniuse.com](http://caniuse.com)，你只需开始输入\
    \ API 的名称，它就会显示支持它的浏览器版本；然而，尽管兼容性表提供了概述，你仍然应该在 JavaScript 代码中检查 API 特性的浏览器兼容性。\n\
    \n每个 HTML 元素都由 DOM 中的一个对象表示，每个对象都有多个属性。因此，在支持 HTML5 API 的浏览器中，某些对象将有一组独特的属性。这是确定浏览器对各种\
    \ HTML5 特性支持情况的关键。\n\n通过检查 `window` 或 `navigator` 对象上某些属性的存在，就可以检测对某些 HTML5 特性的支持。例如，你可以编写以下代码来检查对\
    \ Web Workers 的支持：\n\n```\nif(!!window.Worker){\n    //继续执行\n}\nelse{\n    //\
    \ 执行其他操作\n}\n```\n\n你可以看到，在启用了 Web Worker 的浏览器中，`window` 对象中有一个名为 `Worker` 的属性。\n\
    \n类似的技术也可以用于检测对其他特性的支持。我们在检查每个 API 的细节时将查看如何检测每个特性。\n\n### Modernizr\n\n如果有一个统一的接口来检查对每个\
    \ API 的支持，那不是很好吗？正好有一个开源 JavaScript 库可以帮助检测 HTML5 特性：[Modernizr.](http://modernizr.com/)\n\
    \n使用 Modernizr 只需下载并将并将代码添加到 `<head>` 元素中：\n\n```\n<script type=\"text/javascript\"\
    \ src=\"modernizr.min.js\">\n```\n\n### 注意事项：始终将 Modernizr 放在你的 `<head>` 中\n\n"
- fmt: "\nJust make sure to load the Modernizr script in the `<head>` section. The\
    \ reason is because the `HTML5 Shiv`, which enables the styling of HTML5 elements\
    \ in browsers prior to IE9, must execute before the body loads. Also if you are\
    \ using Modernizr-specific CSS classes, you might encounter an [FOUC (flash of\
    \ unstyled content)](http://en.wikipedia.org/wiki/Flash_of_unstyled_content) if\
    \ the script is not loaded in the `<head>`.\n\nNow, let’s say you want to detect\
    \ the support for Web Workers in the browser. The following snippet does that\
    \ for you:\n\n```\nif(Modernizr.webworkers){\n    //proceed further\n}\nelse{\n\
    \    //no support for web workers\n}\n```\n\nSo if the browser supports `webworkers`,\
    \ the `Modernizr.webworkers` property will be `true`. There are similar tests\
    \ for all other features. We’ll be using Modernizr in this book to check for browser\
    \ compatibility.\n\n## Setting Up the Environment\n\nTo create HTML5 apps, you\
    \ only really need your favorite text editor and browser. But to use certain APIs\
    \ such as Server-sent Events and WebSocket, you will need a server. So I’ll ask\
    \ you to install [WAMP](http://www.wampserver.com/en/) or [XAMPP](http://www.apachefriends.org/en/xampp.html)\
    \ on your machine so that we can easily create a local server to try things out.\
    \ If you already have a server set up, you’re good to go.\n\nIn this chapter,\
    \ we discussed the list of APIs covered in the book and learned how to detect\
    \ browser support for each HTML5 feature. We also discussed the purpose of each\
    \ API in brief and finally set up our development environment.\n\nI know you’ve\
    \ been waiting to get your hands dirty. Now that you’re aware of all the basic\
    \ stuff, let’s start our journey into the world of HTML5 APIs, with Web Workers\
    \ being the first place to visit.\n\n# Chapter 27: APIs: Web Workers\n\nEvery\
    \ HTML5 app is written in JavaScript, but the single and the most crucial limitation\
    \ of HTML5 apps is that the browsers’ JavaScript runtimes are single-threaded\
    \ in nature. Some of you might say that you have run tasks asynchronously in the\
    \ past using functions like `setTimeout`, `setInterval`, and our all-time favorite,\
    \ `XMLHttpRequest`. But, in reality, those functions are just asynchronous, not\
    \ concurrent. Actually, all JavaScript tasks run one after the other and are queued\
    \ accordingly. Web Workers offer us a multi-threaded environment where multiple\
    \ threads can execute in parallel, offering true concurrency.\n\nIn this chapter,\
    \ we’ll first discuss the purpose and how to use Web Workers, before having a\
    \ look at some its limitations and security considerations.\n\n## Introduction\
    \ and Usage\n\nThe Web Worker API allows us to write applications where a computationally\
    \ expensive script can run in the background without blocking the main UI thread.\
    \ As a result, unresponsive script dialogs—as shown in [Figure 27.1](#ch27.html_unresponsive\
    \ \"Figure 27.1. An unresponsive script message\"), which is due to the blocking\
    \ of main thread—can be a thing of the past.\n\n![An unresponsive script message](figures/unresponsive-script.png)\n\
    \nFigure 27.1. An unresponsive script message\n\nThere are two kinds of Web Workers:\
    \ dedicated workers and shared workers. The main difference is the visibility.\
    \ A dedicated worker is accessible from the parent script that created it, but\
    \ a shared worker can be accessed from any script of the same origin. Shared workers\
    \ have limited browser support: Chrome 4.0+, Safari 5.0+ and Opera 10.6+. Neither\
    \ Firefox nor IE has support for shared workers.\n\nWe’ll be discussing dedicated\
    \ workers in this book, as that’s what you’ll most probably use.\n\n### Note:\
    \ Detecting Support\n\nBefore going any further, I just want to make that sure\
    \ you detect the browser's support for Web Workers. In the previous chapter, I\
    \ showed an example where we detected the support for Web Workers using native\
    \ JavaScript and Modernizr, so we’ll skip repeating it here.\n\nTo use Web Workers,\
    \ you just need to call the `Worker` constructor and pass the URI of the Worker\
    \ script:\n\n```\nvar worker=new Worker('myworker.js');\n```\n\n### Note: Worker\
    \ Script Path\n\nPlease note that the Worker script path must have the same origin\
    \ as the parent script, and be relative to the parent script’s location.\n\nHere,\
    \ `myworker.js` is the Worker script that needs to be executed in the background.\
    \ To communicate with a Worker, you just need to call `postMessage` on the `worker`\
    \ object, passing a message, if any:\n\n```\n// start a worker without any message\n\
    worker.postMessage();\n\n// pass a message and start worker\nworker.postMessage('Hey,\
    \ are you in the mood to start work?');\n```\n\nBut communication doesn’t have\
    \ to be unidirectional. Our Worker can also reply! To receive a message sent by\
    \ our Worker, we attach an event listener to the `worker` object, like so:\n\n\
    ```\n//register a callback\nworker.addEventListener('message',function(e){\n \
    \ alert('Got message from worker, '+e.data);\n},false);\n```\n\nThe handler function\
    \ is also passed a `message` event object. this object has a property called `data`\
    \ that contains the actual message sent. So in the above code, we accessed the\
    \ `e.data` property to retrieve the data that was sent by our Worker.\n\nAnd what\
    \ happens to the message passed as an argument to `postMessage()` in our main\
    \ script? Well, that is passed to our Worker script, which can be retrieved at\
    \ the Worker side by registering the same event listener. The following snippet\
    \ shows how to do that:\n\n*myworker.js*\n\n```\n//sent from worker\nself.addEventListener('message',function(e){\n\
    \  self.postMessage('Hey, I am doing what you told me to do!');\n},false);\n```\n\
    \n### Warning: Workers Are Sandboxed\n\nWorkers run in a sandboxed environment.\
    \ This means that they’re unable to access everything a normal script can. For\
    \ example, in the previous code snippet you can’t access the global object `window`\
    \ inside `myworker.js`. So bad things will happen if you try to write `window.addEventListener`\
    \ instead of `self.addEventListener`. Workers also have no access to the DOM.\
    \ Why? More on that later.\n\nIn case of any error occurring, the `onerror` handler\
    \ is called. The following callback should be registered in the parent script:\n\
    \n```\n//register an onerror callback\nworker.addEventListener('error',function(e)\
    \ {\n  console.log(\n    'Error occurred at line: '+e.lineno+' in file '+e.filename\n\
    \  );\n},false);\n```\n\n### Passing JSON data\n\nWeb Workers can only be passed\
    \ a single parameter; however, that parameter can be a complex object containing\
    \ any number of items. Let’s modify our code to pass JSON data:\n\n*parentScript.js*\n\
    \n```\nvar worker=new Worker('myworker.js');\n\nworker.addEventListener('message',function(e){\n\
    \  alert('Got answer: '+e.data.answer+' from: '+e.data.answerer);\n},false);\n\
    \nworker.postMessage({'question':'how are you?','askedBy':'Parent'});\n```\n\n\
    *myworker.js*\n\n```\nself.addEventListener('message', function(e) {\n\n  console.log(\n\
    \    'Question: ' + e.data.question + \n    ' asked by: '+e.data.askedBy\n   );\n\
    \n  self.postMessage(\n    {\n      'answer': 'Doing pretty good!',\n      'answerer':'Worker'\n\
    \    }\n  );\n\n},false);\n```\n\n### Note: Worker Data Is Copied\n\nThe data\
    \ you pass to the Worker is copied, not shared. The receiver will always receive\
    \ a copy of data that is sent. It means that just before being sent, the data\
    \ is serialized and becomes de-serialized on the receiving side. You may wonder\
    \ why it is implemented this way. Simple! To avoid threading issues.\n\n### Web\
    \ Worker Features\n\nAs noted previously, Web Workers run in a sandboxed environment.\
    \ Their features include:\n\n*   read-only access to `navigator` and `location`\
    \ objects\n\n*   functions such as `setTimeout`/`setInterval` and `XMLHttpRequest`\
    \ object, just like the main thread\n\n*   creating and starting subworkers\n\n\
    *   importing other scripts through `importScripts()` function\n\n*   ability\
    \ to take advantage of AppCache\n\nThey have no access to:\n\n*   the `window`,\
    \ `parent`, and `document` objects (use `self` or `this` in Workers for global\
    \ scope)\n\n*   the DOM\n"
  raw: "Just make sure to load the Modernizr script in the `<head>` section. The reason\
    \ is because the `HTML5 Shiv`, which enables the styling of HTML5 elements in\
    \ browsers prior to IE9, must execute before the body loads. Also if you are using\
    \ Modernizr-specific CSS classes, you might encounter an [FOUC (flash of unstyled\
    \ content)](http://en.wikipedia.org/wiki/Flash_of_unstyled_content) if the script\
    \ is not loaded in the `<head>`.\n\nNow, let’s say you want to detect the support\
    \ for Web Workers in the browser. The following snippet does that for you:\n\n\
    ```\nif(Modernizr.webworkers){\n    //proceed further\n}\nelse{\n    //no support\
    \ for web workers\n}\n```\n\nSo if the browser supports `webworkers`, the `Modernizr.webworkers`\
    \ property will be `true`. There are similar tests for all other features. We’ll\
    \ be using Modernizr in this book to check for browser compatibility.\n\n### Setting\
    \ Up the Environment\n\nTo create HTML5 apps, you only really need your favorite\
    \ text editor and browser. But to use certain APIs such as Server-sent Events\
    \ and WebSocket, you will need a server. So I’ll ask you to install [WAMP](http://www.wampserver.com/en/)\
    \ or [XAMPP](http://www.apachefriends.org/en/xampp.html) on your machine so that\
    \ we can easily create a local server to try things out. If you already have a\
    \ server set up, you’re good to go.\n\nIn this chapter, we discussed the list\
    \ of APIs covered in the book and learned how to detect browser support for each\
    \ HTML5 feature. We also discussed the purpose of each API in brief and finally\
    \ set up our development environment.\n\nI know you’ve been waiting to get your\
    \ hands dirty. Now that you’re aware of all the basic stuff, let’s start our journey\
    \ into the world of HTML5 APIs, with Web Workers being the first place to visit.\n\
    \n# Chapter 27\n\nAPIs: Web Workers\n\nEvery HTML5 app is written in JavaScript,\
    \ but the single and the most crucial limitation of HTML5 apps is that the browsers’\
    \ JavaScript runtimes are **single-threaded** in nature. Some of you might say\
    \ that you have run tasks asynchronously in the past using functions like `setTimeout`,\
    \ `setInterval`, and our all-time favorite, `XMLHttpRequest`. But, in reality,\
    \ those functions are just asynchronous, not concurrent. Actually, all JavaScript\
    \ tasks run one after the other and are queued accordingly. Web Workers offer\
    \ us a **multi-threaded** environment where multiple threads can execute in parallel,\
    \ offering true concurrency.\n\nIn this chapter, we’ll first discuss the purpose\
    \ and how to use Web Workers, before having a look at some its limitations and\
    \ security considerations.\n\n## Introduction and Usage\n\nThe Web Worker API\
    \ allows us to write applications where a computationally expensive script can\
    \ run in the background without blocking the main UI thread. As a result, unresponsive\
    \ script dialogs—as shown in [Figure 27.1](#ch27.html_unresponsive \"Figure 27.1. An\
    \ unresponsive script message\"), which is due to the blocking of main thread—can\
    \ be a thing of the past.\n\n![An unresponsive script message](figures/unresponsive-script.png)\n\
    \nFigure 27.1. An unresponsive script message\n\nThere are two kinds of Web Workers:\
    \ dedicated workers and shared workers. The main difference is the visibility.\
    \ A dedicated worker is accessible from the parent script that created it, but\
    \ a shared worker can be accessed from **any script** of the same origin. Shared\
    \ workers have limited browser support: Chrome 4.0+, Safari 5.0+ and Opera 10.6+.\
    \ Neither Firefox nor IE has support for shared workers.\n\nWe’ll be discussing\
    \ dedicated workers in this book, as that’s what you’ll most probably use.\n\n\
    ### Note: Detecting Support\n\nBefore going any further, I just want to make that\
    \ sure you detect the browser's support for Web Workers. In the previous chapter,\
    \ I showed an example where we detected the support for Web Workers using native\
    \ JavaScript and Modernizr, so we’ll skip repeating it here.\n\nTo use Web Workers,\
    \ you just need to call the `Worker` constructor and pass the URI of the Worker\
    \ script:\n\n```\nvar worker=new Worker('myworker.js');\n```\n\n### Note: Worker\
    \ Script Path\n\nPlease note that the Worker script path *must* have the same\
    \ origin as the parent script, and be relative to the parent script’s location.\n\
    \nHere, `myworker.js` is the Worker script that needs to be executed in the background.\
    \ To communicate with a Worker, you just need to call `postMessage` on the `worker`\
    \ object, passing a message, if any:\n\n```\n// start a worker without any message\n\
    worker.postMessage();\n\n// pass a message and start worker\nworker.postMessage('Hey,\
    \ are you in the mood to start work?');\n```\n\nBut communication doesn’t have\
    \ to be unidirectional. Our Worker can also reply! To receive a message sent by\
    \ our Worker, we attach an event listener to the `worker` object, like so:\n\n\
    ```\n//register a callback\nworker.addEventListener('message',function(e){\n \
    \ alert('Got message from worker, '+e.data);\n},false);\n```\n\nThe handler function\
    \ is also passed a `message` event object. This object has a property called `data`\
    \ that contains the actual message sent. So in the above code, we accessed the\
    \ `e.data` property to retrieve the data that was sent by our Worker.\n\nAnd what\
    \ happens to the message passed as an argument to `postMessage()` in our main\
    \ script? Well, that is passed to our Worker script, which can be retrieved at\
    \ the Worker side by registering the same event listener. The following snippet\
    \ shows how to do that:\n\n*myworker.js*\n\n```\n//sent from worker\nself.addEventListener('message',function(e){\n\
    \  self.postMessage('Hey, I am doing what you told me to do!');\n},false);\n```\n\
    \n### Warning: Workers Are Sandboxed\n\nWorkers run in a **sandboxed environment**.\
    \ This means that they’re unable to access everything a normal script can. For\
    \ example, in the previous code snippet you can’t access the global object `window`\
    \ inside `myworker.js`. So bad things will happen if you try to write `window.addEventListener`\
    \ instead of `self.addEventListener`. Workers also have no access to the DOM.\
    \ Why? More on that later.\n\nIn case of any error occurring, the `onerror` handler\
    \ is called. The following callback should be registered in the parent script:\n\
    \n```\n//register an onerror callback\nworker.addEventListener('error',function(e)\
    \ {\n  console.log(\n    'Error occurred at line: '+e.lineno+' in file '+e.filename\n\
    \  );\n},false);\n```\n\n### Passing JSON data\n\nWeb Workers can only be passed\
    \ a single parameter; however, that parameter can be a complex object containing\
    \ any number of items. Let’s modify our code to pass JSON data:\n\n*parentScript.js*\n\
    \n```\nvar worker=new Worker('myworker.js');\n\nworker.addEventListener('message',function(e){\n\
    \  alert('Got answer: '+e.data.answer+' from: '+e.data.answerer);\n},false);\n\
    \nworker.postMessage({'question':'how are you?','askedBy':'Parent'});\n```\n\n\
    *myworker.js*\n\n```\nself.addEventListener('message', function(e) {\n\n  console.log(\n\
    \    'Question: ' + e.data.question + \n    ' asked by: '+e.data.askedBy\n   );\n\
    \n  self.postMessage(\n    {\n      'answer': 'Doing pretty good!',\n      'answerer':'Worker'\n\
    \    }\n  );\n\n},false);\n```\n\n### Note: Worker Data Is Copied\n\nThe data\
    \ you pass to the Worker is copied, not shared. The receiver will always receive\
    \ a copy of data that is sent. It means that just before being sent, the data\
    \ is serialized and becomes de-serialized on the receiving side. You may wonder\
    \ why it is implemented this way. Simple! To avoid threading issues.\n\n### Web\
    \ Worker Features\n\nAs noted previously, Web Workers run in a sandboxed environment.\
    \ Their features include:\n\n*   read-only access to `navigator` and `location`\
    \ objects\n\n*   functions such as `setTimeout`/`setInterval` and `XMLHttpRequest`\
    \ object, just like the main thread\n\n*   creating and starting subworkers\n\n\
    *   importing other scripts through `importScripts()` function\n\n*   ability\
    \ to take advantage of AppCache\n\nThey have no access to:\n\n*   the `window`,\
    \ `parent`, and `document` objects (use `self` or `this` in Workers for global\
    \ scope)\n\n*   the DOM"
