    \ for one low price. Enroll now and start learning today! Join Learnable and you’ll\
    \ stay ahead of the newest technology trends: [http://www.learnable.com](http://www.learnable.com).\n\
    \n# Chapter 1\n\n### Basics: What is HTML5?\n\nThe easy answer is that it’s the\
    \ latest version of HTML. But that doesn’t tell us much. Specifically, HTML5:\n\
    \n*   defines a parsing algorithm for generating a consistent `DOM` (Document\
    \ Object Model) tree, even from ambiguous or poor-quality markup\n*   adds new\
    \ elements to support multimedia and web applications\n*   redefines the rules\
    \ and semantics of existing HTML elements\n\nWith HTML5, we can now embed audio\
    \ and video natively within HTML documents. We can use inline `SVG` (Scalable\
    \ Vector Graphics) markup. We can build more robust form experiences, complete\
    \ with native error checking. We can create games, charts, and animations using\
    \ the `canvas` element. Documents can communicate with each other using cross-document\
    \ messaging. In other words, HTML5 is much more of an application platform, not\
    \ just a markup language.\n\n### A Brief History of HTML5\n\nThe story of how\
    \ and why HTML5 came to be is too long to adequately cover in this book. That\
    \ said, a little historical context may help you understand some of how HTML5\
    \ came to be.\n\nHTML has its roots in *Standard General Markup Language*, or\
    \ SGML. Think of SGML as a set of rules for defining and creating markup languages.\n\
    \nHTML, or `HyperText Markup Language`, began as an application of SGML. Created\
    \ in the early 1990s, HTML was a standardized way to describe the structure of\
    \ hypertext documents. \"Hypertext\" simply means that the text \"contains links\
    \ to other texts\" and is [not constrained by linearity](http://www.w3.org/WhatIs.html).\n\
    \nBy describing the structure of a document, we decouple it from how it looks,\
    \ or how it’s presented to the end user. This made it easier to share and redistribute.\
    \ The associated Hypertext Transfer Protocol (HTTP) made sharing documents over\
    \ the internet easy.\n\n### HTML: The Early Years\n\n\"HTML 1\" defined a simple,\
    \ tag-based syntax for explaining document structure—a very basic document structure.\
    \ Paragraph (`p`) and list item (`li`) elements didn’t require an end tag. The\
    \ [earliest version](http://info.cern.ch/hypertext/WWW/MarkUp/MarkUp.html) didn’t\
    \ even include the `img` or `table` elements. Image support was added in [version\
    \ 1.2](http://www.w3.org/MarkUp/draft-ietf-iiir-html-01.txt) of the specification.\n"
