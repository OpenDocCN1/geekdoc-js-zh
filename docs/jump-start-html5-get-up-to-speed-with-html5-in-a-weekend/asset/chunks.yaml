  trans: "\n\n### 注意：展望未来\n\nSVG 过滤器技术将引入 CSS3，因此你将能够对任何 HTML 元素应用效果。\n\n# 第 21 章\n\
    \n## Canvas & SVG：使用 Canvas 还是 SVG？\n\n正如我们所看到的，`canvas` 和 `SVG` 都能实现类似的功能。那么你如何决定使用哪一个呢？\n\
    \n首先，让我们看看它们的定义：\n\n* `SVG` 是 `Scalable Vector Graphics`（可缩矢量图形）的缩写，是一种在 `XML`\
    \ 中描述图形的语言。\n* 另一方面，`Canvas` 使用 `JavaScript` 动态绘制图形。\n\n这并没有告诉我们它们之间的区别以及如何使用，所以让我们深入探讨。在\
    \ `SVG` 中，绘制的形状作为 `objects` 被记录，因此，如果该对象的属性发生变化，浏览器可以自动重新渲染形状。然而，由于 `canvas` 元素是逐像素绘制的，因此任何任何更改都需要重新绘制整个场景。\n\
    \n`SVG` 的所有元素在 `DOM` 中都是可用的，因此你可以轻松地为它们绑定 `JavaScript` 事件处理器。在大多数情况下，项目将决定你使用哪种元素，因此在规划阶段对此进行思考是值得的。\n\
    \n记住，`SVG` 是完全可扩展的，与 `canvas` 不同，因此如果你正在设计一个需要缩放图形的响应式网站，`SVG` 可能是一个更好的选择。\n\n\
    ## 创建语言\n\n要在 `canvas` 元素上创建图像，你只有一个选择：`JavaScript`。熟悉这种语言的人将占优势，但仍然需要学习绘制 API。然而，动画\
    \ `canvas` 图像的速度极快；你每秒可以绘制并动画数百个项目，因为该元素不受显示项目数量限制。这使其成为动作游戏的理想选择。\n\n`SVG` 文件是\
    \ `XML`——这仅仅是结构化文本。它们可以在 `Illustrator` 或 `Inkscape` 等矢量图形软件包中预先准备，或者你可以使用任何语言在服务器上动态创建它们：`Node.js`、`PHP`、`Ruby`、`Python`、`C#`、`Java`、`BASIC`、`Cobol`\
    \ 等。\n\n你也可以使用熟悉的 `DOM` 和事件处理 API 在客户端并创建并操作 `SVG`。通常不需要重新绘制整个图像，因为对象是可访问的。遗憾的是，这比在\
    \ `canvas` 上移动位图要慢得多。`SVG`可能是动画条形图的理想选择，但不一定适用于快速移动的动作游戏。\n\n## 典型用途\n\n通常，`SVG`\
    \ 适用于：\n\n* 静态图像，特别是在响应式和流式布局中\n* 可以缩放到任何尺寸且不损失的图像\n* 受益于使用 `DOM` 方法附加事件和操作对象的项目\n\
    * 在服务器端创建图像的项目\n* 对可访问性和 SEO 关重要的项目\n\n`Canvas` 适用于：\n\n* 位图图像、照片编辑或任何需要像素级操作的操作\n\
    * 必须动态创建并带有动画效果的图像\n* 图形密集型应用程序，例如游戏\n\n有时，并没有明显的最佳解决方案，两种技术都可以可以使用。记住，它们并不是互斥的；你可以在同一个页面上同时使用\
    \ `canvas` 和 `SVG`，例如在静态的 `SVG` 背景上覆盖多个动画化的 `canvas` 元素。唯一的限制是你的想象力。\n\n希望你喜欢这本书，并准备好开始编写你自己的精彩示例。\n\
    \n感谢阅读，祝在使用 `canvas` 和 `SVG` 时玩得愉快！\n\n# 第 22 章\n\n## 离线应用：检测用户何时连接\n\n构建可以在离线运行的应用，最困难的部分实际上是确定用户何时离线。\n\
    \n在本章中，我们将涵盖 `window` 对象的 `ononline` 和 `onoffline` 事件以及 `window.navigator.onLine`\
    \ 属性。我们还将讨论它们的局限性以及一种测试连接性的替代方法。\n\n## 判断用户是否在线\n\n`window.navigator.onLine` 属性告诉我们用户是否连接到了网络。它返回一个布尔值\
    \ `true` 或 `false`：\n\n```\nif(navigator.onLine){\n    console.log('We are connected!');\n\
    } else {\n    console.log('We don't have connectivity.');\n}\n```\n\n我们可以将此属性与其他离线\
    \ API 一起使用，以确定何时以及何时本地存储数据。一旦再次获得连接，我们将其同步到服务器。\n\n每当 `navigator.onLine` 的值变化时，它会触发两个事件之一：\n\
    \n* `offline`：当 `navigator.onLine` 的值为 `false` 时\n* `online`：当 `navigator.onLine`\
    \ 的值为 `true` 时\n\n我们当然可以监听这些事件，并在触发时采取行动。\n\n## 监听连接状态的变化\n\n在 Firefox、Internet\
    \ Explorer 9+ 和 Safari 中，`online` 和 `offline` 事件在 `document.body` 对象上触发。然而，在 Chrome\
    \ 和 Opera 15+ 中，它们是在 `window` 对象上触发的。\n\n好消息是，即使在 `document.body` 上触发，这些 `online`\
    \ 和 `offline` 事件也会“冒泡”到 `window` 对象。这意味着我们可以监听那里触发的事件，而不是为两者都设置事件监听器或处理器。\n\n\
    监听我们的 `online` 和 `offline` 事件有两种选项。我们可以使用事件属性 `onoffline` 和 `ononline`，如下：\n\n\
    ```\n window.ononline = function(){\n    // 通知用户连接已恢复。\n    // 或者将本地数据与服务器数据同步。\n\
    \ }\n\n window.onoffline = function(){\n    // 通知用户连接已丢失。\n    // 或者仅将数据保存到本地。\n\
    \ }\n```\n\n或者我们可以使用 `addEventListener` 方法并监听 `online` 或 `offline` 事件：\n\n```\n\
    window.addEventListener('offline', offlineHandler);\nwindow.addEventListener('online',\
    \ onlineHandler);\n```\n\n`addEventListener` 方法需要两个参数：我们想要监听的事件，以及事件发生时要调用的函数——称为回调函数。\n\
    \n为了兼容某些旧版本的 Firefox (<6.0) 和 Opera (<11.6)，你需要添加第三个参数。该参数告诉浏览器使用事件捕获（capture）还是冒泡（bubbling）。值\
    \ `true` 表示事件应该被捕获。值 `false` 表示事件应该冒泡。通常情况下，你应该将其设置为 `false`。\n\n现代浏览器默认使用事件冒泡，使得这些参数在这些浏览器中是可选的。如果你想了解更多关于冒泡与捕获的区别，请阅读\
    \ Peter-Paul Koch 2006 年的文章《事件顺序》。\n\n### Internet Explorer 8 中的在线和离线事件\n\n此规则的例外是\
    \ Internet Explorer 8。IE8 在 `document.body` 对象上触发 `online` 和 `offline` 事件，但它们不会冒泡。此外，Internet\
    \ Explorer 不支持 `addEventListener()`。你需要使用 `attachEvent()` 方法，或者使用一个平滑差异的 polyfill。\n\
    \n尽管如此，Internet Explorer 8 支持的离线应用唯一组件是 Web Storage（我们将在第 24 章介绍）。Internet Explorer\
    \ 8 确实有一些特定厂商的存储功能，但为了推广 Web 标准并缩短本书的长度和复杂度，我们在这里不会介绍它们。\n\n## `navigator.onLine`\
    \ 的局限性\n\n`navigator.onLine` 的缺点是：它是不可靠的。此外，它的工作方式取决于浏览器和操作系统系统。\n\nChrome、Safari、Opera\
    \ 15+ 和 Internet Explorer 9+ 可以检测用户何时丢失网络连接。丢失或关闭 Wi-Fi 连接将会在这些浏览器中触发 `offline`\
    \ 事件。重新连接将触发 `online` 事件。如果连接到互联网，`navigator.onLine` 的值为 `true`，否则为 `false`。\n\
    \n"
- fmt: "\nOpera 12 (and older versions) will not fire `online` or `offline` events\
    \ at all. It does, however, report `false` for `navigator.onLine` when the user\
    \ is disconnected from a network and `true` when connected.\n\nFirefox for desktop\
    \ and laptop computers is a special case. Whether it fires `offline` or `online`\
    \ events depends on user activity. Firefox fires an `offline` event when the user\
    \ selects the Work Offline menu option, and fires an `online` event when the user\
    \ deselects it. It’s wholly unrelated to whether there is a functional internet\
    \ connection. Even if the user has disconnected from the network, the value of\
    \ `navigator.onLine` will be `true` if the user hasn’t also elected to work offline.\n\
    \nFirefox for Android and Firefox OS work differently, however. Those versions\
    \ of the browser will fire `online` and `offline` events when connectivity is\
    \ lost or turned off (as with Airplane Mode).\n\nWhere all browsers struggle,\
    \ however, is when there is *network* connectivity but not internet connectivity.\
    \ If the browser can connect to a local network, the value of `navigator.onLine`\
    \ will be `true`, even if the connection from the local network to the wider internet\
    \ is down.\n\nIn other words, the `navigator.onLine` property may not tell you\
    \ what you want to know. So we need to use an alternative.\n\n## Checking Connectivity\
    \ With `XMLHttpRequest`\n\nA better way to determine connectivity is to do it\
    \ at the time of a network request. We can do this using `XMLHttpRequest` and\
    \ its `error` and `timeout` events.\n\nIn this example, we’ll attempt to send\
    \ the contents of our form to the server. If we have no connection, or if the\
    \ connection takes too long to complete, we’ll save our data to `localStorage`\
    \ and tell the user.\n\nFirst, let’s define our `error` and `timeout` event handler:\n\
    \n```\nvar form = document.querySelector('form');\nvar xhrerrorhandler = function(errorEvent){\n\
    \    var i = 0;\n    // Save the value if we have one\n    while(i < form.length){\n\
    \        if(form[i].value != ''){\n            localStorage.setItem(form[i].name,\
    \ form[i].value);\n        }   \n        i++;\n    }   \n}\n```\n\nWe’ll use the\
    \ same function for both events, since we want to do the same task in both cases.\
    \ This function saves each form field name as a `localStorage` key, and each field’s\
    \ corresponding value as a `localStorage` value.\n\nNext, let’s define our submit\
    \ event handler. This function will make the XHR request, monitor it for failure,\
    \ and add our error handlers:\n\n```\nsubmithandler = function(submitEvent){\n\
    \    var fd, ls, i=0, key;\n\n    // Prevent form submission\n    submitEvent.preventDefault();\n\
    \n    // If we have localStorage data, build a FormData object from it\n    //\
    \ Otherwise, just use the form\n    if( localStorage.length > 0){\n        fd\
    \ = new FormData();\n        ls = localStorage.length;\n        while(i < ls){\n\
    \            key = localStorage.key(0);\n            fd.append(key, localStorage.getItem(key));\n\
    \            i++;\n        }\n    } else {\n        fd = new FormData(form);\n\
    \    }\n\n    // Set a timeout for slow connections\n    xhr.timeout = 3000;\n\
    \    xhr.open('POST','return.php');\n    xhr.send(fd);\n\n    // Set our error\
    \ handlers.\n    xhr.addEventListener('timeout', xhrerrorhandler);\n    xhr.addEventListener('error',\
    \ xhrerrorhandler);\n}\nform.addEventListener('submit', submithandler);\n```\n\
    \nIn this function, if there is `localStorage` data, we will append it to a `FormData`\
    \ object. Then we’ll send the `FormData` object as the payload for our request.\n\
    \n`FormData` is part of the [XMLHttpRequest, Level 2 specification.](http://www.w3.org/TR/XMLHttpRequest/)\
    \ It accepts a series of key-value pairs using its `append()` method (`append(key,value)`).\
    \ Alternatively, you can pass a form object as an argument to the constructor.\
    \ Here we’ve done both, based on whether or not we have saved anything to `localStorage`.\
    \ A more robust version of this demo might handle this with separate features:\
    \ one for sending form data and another for syncing with the server.\n\nThis doesn’t\
    \ work if the server response contains an HTTP error code. You can work around\
    \ this by checking the value of the `status` property in the XHR response, as\
    \ shown here:\n\n```\nvar xhronloadhandler = function(loadEvent){\n    if( loadEvent.target.status\
    \ >= 400){\n        xhrerrorhandler();\n    } else {\n        // Parse the response.\n\
    \    }\n}\n```\n\nIf it’s 400 or greater―HTTP error codes start at 400―we’ll save\
    \ the data locally. Otherwise, parse the response.\n\n## What You’ve Learned\n\
    \nIn this chapter, we’ve discussed the advantages and limitations of the `navigator.onLine`\
    \ property, an alternate way to test for connectivity. Now let’s talk about the\
    \ browser features and APIs that let us create offline web applications. In our\
    \ [next chapter](#ch23.html \"Chapter 23Offline Apps: Application Cache\"), we’ll\
    \ look at the application cache.\n\n# Chapter 23: Offline Apps: Application Cache\n\
    \nApplication Cache—“AppCache” for short—provides a way to save the assets of\
    \ an application locally so that they can be used without an internet connection.\
    \ It’s especially well-suited to “single-page” applications that are JavaScript-driven\
    \ and use local data stores such as `localStorage` and `IndexedDB`.\n\nAppCache\
    \ consists of two parts: the plain text file known as a *manifest*, and a DOM\
    \ interface for scripting and help managing updates. By the end of this chapter,\
    \ you’ll know how to write a cache manifest file, how to manage updates, and some\
    \ of the aspects to watch out for when using this API.\n\n### Note: AppCache in\
    \ IE\n\nApplication Cache is not supported in Internet Explorer 9 or below. You’ll\
    \ need to use version 10 or later. For a complete list of browsers supporting\
    \ AppCache, try [CanIUse.com.](http://caniuse.com/#search=appcache)\n\n## Cache\
    \ Manifest Syntax\n\nCache manifest files are plain text files, but they must\
    \ adhere to the manifest syntax. Let’s look at a simple example:\n\n```\nCACHE\
    \ MANIFEST\n\n# These files will be saved locally. This line is a comment.\nCACHE:\n\
    js/todolist.js\ncss/style.css\n```\n\nEvery cache manifest must begin with the\
    \ line `CACHE MANIFEST`. Comments must begin with a `#`. Notice that each file\
    \ is also listed as a separate line.\n\nThe `CACHE:` line is a section header.\
    \ There are four defined section headers in total:\n\n*   `CACHE:` explicitly\
    \ states which files should be stored locally\n*   `NETWORK:` explicitly states\
    \ which URLs should always be retrieved\n*   `FALLBACK:` specifies which locally\
    \ available file should be displayed when a URL isn’t available\n*   `SETTINGS:`\
    \ defines caching settings\n\n### Saving Files Locally with the `CACHE:` Section\
    \ Header\n\n`CACHE:` is unique because it is an optional section header―and it’s\
    \ the only one that is. Our cache manifest example could also be written without\
    \ it:\n\n```\nCACHE MANIFEST\n\n# These files will be saved locally. This line\
    \ is a comment.\njs/todolist.js\ncss/style.css\n```\n\nIn this case, `js/todolist.js`\
    \ and `css/style.css` will be cached locally, since they follow our `CACHE:` section\
    \ header. So will the page that linked to our manifest, even though we haven’t\
    \ explicitly said that it should be saved.\n"
