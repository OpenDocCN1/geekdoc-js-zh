    \ Filter Effects\"), we'll take a look at filters.\n\n# Chapter 20\n\nCanvas &\
    \ SVG: SVG Filter Effects\n\nYou can use **filter effects** in SVG. If you use\
    \ any graphic design or photo manipulation packages, then you're almost certain\
    \ to have come across filters before. The filters in SVG include:\n\n* `feBlend`\n\
    * `feColorMatrix`\n* `feComponentTransfer`\n* `feComposite`\n* `feConvolveMatrix`\n\
    * `feDiffuseLighting`\n* `feDisplacementMap`\n* `feFlood`\n* `feGaussianBlur`\n\
    * `feImage`\n* `feMerge`\n* `feMorphology`\n* `feOffset`\n* `feSpecularLighting`\n\
    * `feTile`\n* `feTurbulence`\n* `feDistantLight`\n* `fePointLight`\n* `feSpotLight`\n\
    \nIf you've used image-editing software you'll probably be familiar with what\
    \ filters do. Essentially, they apply effects to an image such as bezels, blurring,\
    \ soft-focus, and so on. In essence, think of filter elements as a form of image\
    \ processing for the Web. Filter elements can be used in most modern browsers,\
    \ with the exception of Blackberry Browser. For an example of what filters can\
    \ do, take a look at Microsoft's hands on: [SVG Filter Effects](http://ie.microsoft.com/testdrive/graphics/hands-on-css3/hands-on_svg-filter-effects.htm).\n\
    \n## Using Filter Effects\n\nEspecially if you're new to filters, it's a good\
    \ idea to begin testing with one filter at a time, otherwise you could end up\
    \ with pretty weird-looking images. For a comprehensive overview of filters, take\
    \ a look at [SVG Filters](http://example.com/SVG/Filters) page.\n\nBelow is an\
    \ example of the `feGaussianBlur` filter, as shown in [Figure 20.1](#ch20.html_gaussian\
    \ \"Figure 20.1 A circle\").\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <svg\
    \ xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n    <defs>\n      <filter\
    \ id=\"f1\">\n        <feGaussianBlur stdDeviation=\"14\"/>\n      </filter>\n\
    \    </defs>\n\n    <circle cx=\"200\" cy=\"200\" r=\"200\" stroke=\"red\" stroke-width=\"\
    5\" fill=\"gold\" filter=\"url(#f1)\" />\n  </svg>\n</body>\n</html>\n```\n\n\
    ![A circle with blurring applied](figures/GaussianBlur.png)\n\nFigure 20.1. A\
    \ circle with blurring\n\n### Playing with Filters\n\nAs you can see, you'll have\
    \ to give the filter an ID so this can later be specified in the circle: `filter=\"\
    url(#f1)\"`. The parameter associated with this filter is `stdDeviation`; this\
    \ controls the amount of blurring. So, for example, if you were to set the `stdDeviation`\
    \ to `1`, then you would get a minimal amount of blurring. However, if you were\
    \ to set this to, say, 200, then it creates a blurring effect that's almost transparent.\n\
    \n![A very blurry circle](figures/stdDeviation.png)\n\nFigure 20.2. A very blurry\
    \ circle\n\nIf you were to apply a lower value, then the blurring wouldn't be\
    \ so apparent and would allow the stroke to be seen as orange, as shown in [Figure\
    \ 20.3](#ch20.html_filter3 \"Figure 20.3 A less blurry circle\").\n\nLet's try\
    \ combining filter effects. We'll create a drop shadow using the `feOffset` filter;\
    \ this is achieved by taking the relevant image or element and moving it in the\
    \ x-y plane. We'll use the `feBlend` and `feOffset` elements, which will create\
    \ a duplicate image that's offset from the original, to create the effect that\
    \ one image is sitting behind the other, as shown in [Figure 20.4](#ch20.html_multifilter\
    \ \"Figure 20.4 Using multiple filters\").\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <svg xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n    <defs>\n\
    \      <filter id=\"f1\" x=\"0\" y=\"0\" width=\"200%\" height=\"200%\">\n   \
    \     <feOffset result=\"offOut\" dx=\"25\" dy=\"20\" />\n        <feBlend in=\"\
    SourceGraphic\" in2=\"offOut\" mode=\"normal\" />\n      </filter>\n    </defs>\n\
    \n    <polygon points=\"220,10 300,210 170,250 123,234\" fill=\"blue\"\n     stroke=\"\
    purple\" stroke-width=\"3\" filter=\"url(#f1)\" />\n\n  </svg>\n</body>\n</html>\n\
    ```\n\n![Using multiple filters](figures/Filtermulti.png)\n\nFigure 20.4. Using\
    \ multiple filters\n\nFilters can help you to create excellent effects. For example,\
    \ if we were to apply `feGaussianBlur` to the above, then you could blur the rear\
    \ image to create a kind of 3D effect.\n"
