  trans: "\n\n如果键已经存在，使用 `setItem` 将覆盖旧值而不是创建新记录。对于我们的待办事项列表来说，这正是我们需要的。为了防止您的键值被覆盖，请在保存项目之前检查该键是否存在。\n\
    \n正如我们在下一节将看到的，我们还将使用 `setItem` 在任务被点击时更新其状态。\n\n## 使用 `localStorage.getItem()`\
    \ 获取值\n\n要检索键的值，我们使用 `localStorage.getItem()`。该方法接受一个参数，即我们想要检索的值的键名，该键必须是一个字符串。\n\
    \n如果该键存在，`getItem` 将返回该键的值。否则，它将返回 `null`。这使得它在调用 `setItem` 之前确定键是否存在非常有用。例如，如果我们想测试\
    \ `lunch` 键是否存在，我们可以执行以下操作：\n\n```\nif( localStorage.getItem('lunch') ){\n   \
    \ // do something.\n}\n```\n\n在我们的案例中，我们将使用 `getItem` 来获取任务的状态。根据 `getItem` 返回的值，我们将使用\
    \ `setItem` 更新键的值。\n\n在下面的代码中，我们为无序列表添加了事件监听器，而不是为每个列表项添加。我们正在使用一种被称为**事件委托**的技术。当事件在元素上触发时，它会“冒泡”到它的祖元素。这意味着可以在父元素上设置监听器，并使用事件对象的\
    \ `target` 属性来确定哪个元素触发了事件。由于我们只想在点击的元素是列表项时执行操作，我们需要检查 `target` 对象的 `nodeName`\
    \ 属性：\n\n```\nfunction toggleStatus(event){ \n    var status; \n    if(event.target.nodeName\
    \ == 'LI'){\n        /* \n        使用 + 是将数字字符串转换为数字的技巧。\n        */\n        status\
    \ = +localStorage.getItem(event.target.textContent);\n        if(status){ \n \
    \           localStorage.setItem(event.target.textContent,0);                \
    \     \n        } else {            \n            localStorage.setItem(event.target.textContent,1);\n\
    \        }\n\t    /* 切换 'done' 类 */\n        event.target.classList.toggle('done');\n\
    \    }\n}\n\nvar list = document.getElementById('list');   \nlist.addEventListener('click',toggleStatus);\n\
    ```\n\n`event.target` 属性是指向被点击元素的指针。每个元素对象都有一个 `textContent` 属性，如果适用，它是它的子文本。每个列表项的\
    \ `textContent` 与一个 `localStorage` 键匹配，因此我们可以使用它来检索我们想要的值。这就是我们通过 `status = localStorage.getItem(event.target.textContent)`\
    \ 所完成的。\n\n### 注意：`localStorage` 的键和值都是字符串\n\n记住，所有 `localStorage` 的键和值都是字符串。看起来像数字的实际上是*数字字符串*。为了与数字或布尔值进行比较，你需要转换变量类型。在这里，我们使用\
    \ `+` 号将每个键的值转换为数字。0 是一个**假值**（falsy），等于但不等于布尔 `false`；1 是一个**真值**（truthy）。\n\n\
    ### 设置和获取项目的替代语法\n\n使用 `setItem` 和 `getItem` 不是设置或检索 `localStorage` 值的唯一方法。你也可以使用方括号语法或点语法来添加和删除它们：\n\
    \n```\nlocalStorage['foo'] = 'bar'; \n\nconsole.log(localStorage.foo) // 在控制台打印\
    \ 'bar'\n```\n\n这等同于使用 `localStorage.setItem('foo','bar')` 和 `localStorage.getItem('foo')`。但是，如果你的键可能包含空格，请坚持使用方括号语法或使用\
    \ `setItem()`/`getItem()`。\n\n## 遍历存储项目\n\n在页面重新加载时，我们的待办事项列表将是空的。它们仍然存在于 `localStorage`\
    \ 中，但不是 DOM 树的一部分。为了解决这个问题，我们必须通过遍历我们的 `localStorage` 项目集合来重建待办事项列表，最好在页面加载时进行。这就是\
    \ `localStorage.key()` 和 `localStorage.length` 派上用场的地方。\n\n`localStorage.length`\
    \ 告诉我们存储区域中有多少项目。`key()` 方法检索指定索引处项目的键名。它接受一个参数：一个大于等于 0 且小于 `length` 值的整数值。如果参数小于\
    \ 0 或大于等于 `length`，`localStorage.key()` 将返回 `null`。\n\n索引和键之间的关系非常松散。每个浏览器对键的排序方式不同。此外，给定索引处的键和值会随着项目的添加或删除而改变。要检索一个*特定的*值，`key()`\
    \ 是一个糟糕的选择。但对于遍历条目，它是完美的。示例如下：\n\n```\nvar i = localStorage.length;\nwhile( i--\
    \ ){ /* 只要 i 不是 0，该条件为真 */\n    console.log( localStorage.key(i) );\n}\n```\n\n\
    这将存储区域中的每个键都打印到控制台。如果我们想打印值，可以使用 `key()` 获取键名，然后将其传递给 `getItem()` 来获取对应的值：\n\n\
    ```\nvar i = localStorage.length, key;\nwhile( i-- ){ \n    key = localStorage.key(i);\n\
    \    console.log( localStorage.getItem(key) );\n}\n```\n\n回到我们的待办事项列表。我们有一个添加新项目并标记其完成的机制。但如果刷新页面，什么都不会发生。我们的数据在存储区域中，但不在页面上。\n\
    \n我们可以通过为 `window` 对象的 `load` 事件添加监听器来修复此。在事件处理器内部，我们将使用 `localStorage.length`\
    \ 和 `localStorage.key()` 结合 `localStorage.getItem(key)` 来重建待办事项列表：\n\n```\nfunction\
    \ loadList(){\n    var len = localStorage.length;\n    while( len-- ){\n     \
    \   var key = localStorage.key(len);    \n        addItemToList(key, localStorage.getItem(key));\n\
    \    }\n}\nwindow.addEventListener('load', loadList);\n```\n\n由于我们在这个循环中处理的是现有项目，我们想要保留这些值。让我们稍微调整一下\
    \ `addItemToList` 函数来完成这一点：\n\n```\nfunction addItemToList(itemtxt, status){\n\
    \    var li = document.createElement('li');\n\n    if(status === undefined){\n\
    \        status = 0;\n        localStorage.setItem(itemtxt, status);\n    }\n\n\
    \    if(status == true){ li.classList.add('done'); }\n\n    li.textContent = itemtxt;\n\
    \    list.appendChild(li);\n}\n```\n\n我们添加了一个 `status` 参数，这为我们提供了指定任务是否完成的方法。当我们添加任务并调用此项时，我们将省略\
    \ `status` 参数；但当我们像这里这样从存储加载项目时，我们会包含它。\n\n`if(status == true){ li.classList.add('done');\
    \ }` 这一行会在我们的任务状态为 `1` 时为列表项添加一个 `done` 类。\n\n## 使用 `localStorage.clear()` 清除存储区域\n\
    \n要完全清除存储区域，请使用 `localStorage.clear()` 方法。它不接受任何参数：\n\n```\nfunction clearAll()\
    \ {\n  list.innerHTML = '';\n  localStorage.clear();\n}\n```\n\n一旦调用，它将从存储区域移除*所有*键及其值。一旦移除，这些值将不再供应用程序使用。**谨慎使用**。\n\
    \n## 存储事件\n\n当存储区域发生变化时，window` 对象上会触发存储事件。当 `removeItem()` 或 `clear()` 删除一个或多个项目时就会发生这种情况。当\
    \ `setItem()` 设置新值或更改现有值时也会发生。\n\n### 监听存储事件\n\n要监听 `storage` 事件，请为 `window` 对象添加事件监听器：\n\
    \n```\nwindow.addEventListener('storage', storagehandler); \n```\n\n我们的 `storagehandler`\
    \ 函数将在存储事件触发时被调用。我们还没有定义该函数——稍后我们会处理。首先，让我们来看 `StorageEvent` 对象。\n\n### `StorageEvent`\
    \ 对象\n\n我们的回调函数将接收一个 `StorageEvent` 对象作为参数。`StorageEvent` 对象包含了所有对象通用的属性，以及五个特定于其类型的属性：\n\
    \n"
- fmt: "\n- `key`: contains the key name saved to the storage area\n- `oldValue`:\
    \ contains the former value of the key, or `null` if this is the first time an\
    \ item with that key has been set\n- `newValue`: contains the new value added\
    \ during the operation\n- `url`: contains the URL of the page that made this change\n\
    - `storageArea`: indicates the storage object affected by the update―either `localStorage`\
    \ or `sessionsStorage`\n\nWith these properties, you can update the interface\
    \ or alert the user about the status of an action. In this case, we’ll just quietly\
    \ reload the page in other tabs/windows using `location.reload()`.\n\n```\nfunction\
    \ storagehandler(event){\n    location.reload();\n}\n```\n\nNow our list is up-to-date\
    \ in all tabs.\n\n### Storage Events Across Browsers\n\nStorage events are a bit\
    \ tricky, and work differently to how you might expect in most browsers. Rather\
    \ than being fired on the *current* window or tab, the `storage` event is supposed\
    \ to be fired *in other windows and tabs* that share the same storage area. Let’s\
    \ say that our user has `http://ourexamplesite.com/buy-a-ticket` open in two tabs.\
    \ If they take an action in the first tab that updates the storage area, the `storage`\
    \ event should be fired in the second.\n\nChrome, Firefox, Opera, and Safari are\
    \ in line with the web storage specification, while Internet Explorer is not.\
    \ Instead, Internet Explorer fires the `storage` event in every window for every\
    \ change, including the current window.\n\nThere isn’t a good hack-free way to\
    \ work around this issue. For now, reloading the application―as we’ve done above―is\
    \ the best option across browsers.\n\n### Note: IE’s Nonstandard `remainingSpace`\
    \ Property\n\nInternet Explorer includes a nonstandard `remainingSpace` property\
    \ on its `localStorage` object. We can handle our storage event differently depending\
    \ on whether or not `localStorage.remainingSpace` is `undefined`. This approach\
    \ has its risks, though; Microsoft could remove the `remainingSpace` property\
    \ without fixing the storage event bug.\n\n### Determining Which Method Caused\
    \ the Storage Event\n\nThere isn’t an easy way to determine which method out of\
    \ `setItem()`, `removeItem()`, or `clear()` triggered the storage event. But there\
    \ is a way: examine the event properties.\n\nIf the `storage` event was caused\
    \ by invoking `localStorage.clear()`, the `key`, `oldValue`, and `newValue` properties\
    \ of that object will all be `null`. If `removeItem()` was the trigger, `oldValue`\
    \ will match the removed value and the `newValue` property will be `null`. If\
    \ `newValue` isn’t `null`, it’s a safe bet that `setItem()` was the method invoked.\n\
    \n## Storing Arrays and Objects\n\nAs mentioned earlier in this chapter, web storage\
    \ keys and arrays must be strings. If you try to save objects or arrays, the browser\
    \ will convert them to strings. This can lead to unexpected results. First, let’s\
    \ take a look at saving an array:\n\n```\nvar arrayOfAnimals = ['cat','dog','hamster','mouse','frog','rabbit'];\n\
    \nlocalStorage.setItem('animals', arrayOfAnimals);\n\nconsole.log(localStorage.animals[0])\n\
    ```\n\nIf we look at our web storage inspector, we can see that our list of animals\
    \ was saved to `localStorage`, as shown in [Figure 24.3](#ch24.html_safaridevtools\
    \ \"Figure 24.3. An array saved to web storage as a string in Safari’s developer\
    \ tools\").\n\n![An array saved to web storage as a string in Safari’s developer\
    \ tools](figures/localstorage-arrays.png)\n\nFigure 24.3. An array saved to web\
    \ storage as a string in Safari’s developer tools\n\nBut if you try to read the\
    \ first item of that array, you’ll see that the first item is the letter `C` and\
    \ not `cat` as in our array. Instead, it’s been converted to a comma-separated\
    \ string.\n\nSimilarly, when an object is converted to a string, it becomes `[object\
    \ Object]`. You lose all your properties and values, as shown in [Figure 24.4](#ch24.html_safaridevtools2\
    \ \"Figure 24.4. The result of saving an object to web storage in Safari’s developer\
    \ tools\").\n\n![The result of saving an object to web storage in Safari’s developer\
    \ tools](figures/localstorage-objects.png)\n\nFigure 24.4. The result of saving\
    \ an object to web storage in Safari’s developer tools\n\nTo prevent this from\
    \ happening, use the native `JSON.stringify()` method to turn your objects and\
    \ arrays into strings before saving:\n\n```\nvar foodcouples = {\n  'ham':'cheese',\n\
    \  'peanut_butter':'jelly',\n  'eggs':'toast'\n}\n\nlocalStorage.setItem(\n  'foodpairs_string',\n\
    \  JSON.stringify(foodcouples)\n);\n```\n\nUsing `JSON.stringify()` will *serialize*\
    \ arrays and objects. They’ll be converted to specially formatted strings that\
    \ hold indexes or properties and values, as shown in [Figure 24.5](#ch24.html_safaridevtools3\
    \ \"Figure 24.5. Using JSON.stringify() to save an object to web storage in Safari’s\
    \ developer tools\").\n\n![Using JSON.stringify() to save an object to web storage\
    \ in Safari’s developer tools](figures/localstorage-objects2.png)\n\nFigure 24.5.\
    \ Using `JSON.stringify()` to save an object to web storage in Safari’s developer\
    \ tools\n\nTo retrieve these values, use `JSON.parse()` to turn it back into a\
    \ JavaScript object or array. A word of caution: `JSON.parse()` and `JSON.stringify()`\
    \ can affect the performance of your application. Use them sparingly, especially\
    \ when getting and setting items.\n\n## Limitations of Web Storage\n\nWeb storage\
    \ comes with a couple of limitations: performance and capacity.\n\nWeb storage\
    \ is *synchronous*. Reads and writes are added to the JavaScript processing queue\
    \ immediately. Other tasks in the queue won't be completed until the engine is\
    \ done writing to or reading from the storage area. For small chunks of data,\
    \ this usually is no issue. But for larger chunks of data or a large number of\
    \ write operations, it will be.\n\nWeb storage also has a size limit. Should your\
    \ application reach that limit, the browser will throw a `DOMException` error.\
    \ Use a `try-catch` statement to catch and handle this error. In browsers that\
    \ support it, you can also use `window.onerror` (or use `addEventListener` and\
    \ the `error` event):\n\n```\n try {\n    localStorage.setItem('keyname',value);\n\
    \    return true;\n} catch (error) {\n    // Could alternatively update the UI.\n\
    \    console.log(error.message); \n}\n```\n\nSize limits vary by browser and version.\
    \ The web storage specification suggests an initial size of 5MB per origin. However,\
    \ Safari, currently allows 2.5MB of data to be stored per origin. Chrome, Internet\
    \ Explorer, and Opera 15+ currently store 5MB of data. Firefox stores 5MB by default,\
    \ but the user can adjust this limit in the `about:config` menu. Older versions\
    \ of Opera (12 and below) prompt the user to raise the storage limit.\n\nThe good\
    \ news is that these values may increase. The bad news is that most browsers fail\
    \ to expose the amount of storage space available to the application.\n\nNow that\
    \ we’ve covered the ins and outs of web storage, let’s take a look at a web database:\
    \ IndexedDB.\n\n# Chapter 25: Offline Apps: Storing Data With Client-side Databases\n\
    \nWeb storage (`localStorage` and `sessionStorage`) is fine for small amounts\
    \ of data such as our to-do list, but it’s an unstructured data store. You can\
    \ store keys and values, but you can’t easily search values. Data isn’t organized\
    \ or sorted in a particular way, plus the 5MB storage limit is too small for some\
    \ applications.\n\nFor larger amounts of structured searchable data, we need another\
    \ option: web databases. Web databases such as Web SQL and IndexedDB provide an\
    \ alternative to the limitations of web storage, enabling us to create truly offline\
    \ applications.\n\n## The State of Client-side Databases\n\nUnfortunately, this\
    \ isn’t as easy as it sounds. Browsers are split into three camps in the way they\
    \ support client-side databases:\n\n- both IndexedDB and Web SQL (Chrome, Opera\
    \ 15+)\n- IndexedDB exclusively (Firefox, Internet Explorer 10+)\n- Web SQL exclusively\
    \ (Safari)\n"
