    \ object and the `window.navigator.onLine` property. We’ll also talk about their\
    \ limits as well as an alternative way to test for connectivity.\n\n## Determining\
    \ Whether the User Is Online\n\nThe `window.navigator.onLine` property tells us\
    \ whether or not the user is connected to a network. It returns a Boolean `true`\
    \ or `false` value:\n\n```\nif(navigator.onLine){\n    console.log('We are connected!');\n\
    } else {\n    console.log('We don't have connectivity.');\n}\n```\n\nWe can use\
    \ this property with other offline APIs to determine when and whether to store\
    \ data locally. Then we can sync it with a server once we have connectivity again.\n\
    \nAnytime the value of `navigator.onLine` changes, it fires one of two events:\n\
    \n*   `offline`: when the value of `navigator.onLine` would be `false`\n\n*  \
    \ `online`: when the value of `navigator.onLine` would be `true`\n\nWe can listen\
    \ for these events, of course, and take action when one is fired.\n\n## Listening\
    \ for Changes in Connectivity State\n\nIn Firefox, Internet Explorer 9+, and Safari,\
    \ the `online` and `offline` events are fired on the `document.body` object. In\
    \ Chrome and Opera 15+, however, they are fired on the `window` object.\n\nThe\
    \ good news is that even when fired on the `document.body`, these `online` and\
    \ `offline` events “bubble up” to the `window` object. This means we can listen\
    \ for events fired there instead of setting event listeners or handlers for both.\n\
    \nThere are two options in listening for our `online` and `offline` events. We\
    \ can use the event attributes `onoffline` and `ononline`, as shown here:\n\n\
    ```\n window.ononline = function(){\n    // Alert the user that connectivity is\
    \ back.\n    // Or sync local data with server data.\n }\n\n window.onoffline\
    \ = function(){\n    // Alert the user that connectivity was lost.\n    // Or\
    \ just silently save data locally.\n }\n```\n\nOr we can use the `addEventListener`\
    \ method and listen for the `online` or `offline` event:\n\n```\n window.addEventListener('offline',\
    \ offlineHandler);\n window.addEventListener('online', onlineHandler); \n```\n\
    \nThe `addEventListener` method requires two parameters: the event we want to\
    \ listen for, and the function to invoke ― known as a ****callback**** ― when\
    \ the event occurs.\n\nFor compatibility with some older versions of Firefox (<\
    \ 6.0) and Opera (< 11.6), you will need to add a third parameter. This parameter\
    \ tells the browser whether to use event capture or event bubbling. A value of\
    \ `true` means that events should be captured. A `false` value means that events\
    \ should bubble. In general, you should set it to `false`.\n\nMost modern browsers\
    \ use event bubbling by default, making the third parameter optional in those\
    \ browsers. If you’d like to know more about bubbling versus capture, read Peter-Paul\
    \ Koch’s 2006 article, [“Event order.”](http://www.quirksmode.org/js/events_order.html)\n\
    \n### Online and Offline Events in Internet Explorer 8\n\nThe exception to this\
    \ rule is Internet Explorer 8\\. IE8 fires `online` and `offline` events at the\
    \ `document.body` object, but they do not bubble. What’s more, Internet Explorer\
    \ doesn’t support `addEventListener()`. You’ll need to use the `attachEvent()`\
    \ method instead, or a polyfill that smooths over the differences.\n\nThat said,\
    \ the only component of offline applications that Internet Explorer supports is\
    \ web storage (which we’ll cover in [Chapter 24](#ch24.html \"Chapter 24Offline\
    \ Apps: Web Storage\")). Internet Explorer 8 does have some vendor-specific storage\
    \ features, but in the interest of promoting web standards and shortening the\
    \ length and complexity of this book, we will not cover them here.\n\n## Limitations\
    \ of `navigator.onLine`\n\nHere’s the downside of `navigator.onLine`: it’s unreliable.\
    \ What’s more, it works differently depending on the browser and operating system.\n\
    \nChrome, Safari, Opera 15+, and Internet Explorer 9+ can detect when the user\
    \ has lost connectivity with the network. Losing or turning off a Wi-Fi connection\
    \ will trigger an `offline` event in those browsers. Reconnecting will trigger\
    \ an `online` event. The value of `navigator.onLine` will be `true` if connected\
    \ to the Internet, and `false` if it is not."
