  trans: "\n如果你计划支持移动浏览器，那么 IndexedDB 可能并不是一个可行的选择。iOS 上的 Safari 和 Opera Mobile 11-12\
    \ 仅支持 Web SQL；旧版本的 Android 和 Blackberry 浏览器也是如此。\n\n如果你想让你的应用程序能够在桌面浏览器上运行，那么使用\
    \ Web SQL 已经完成了一大半的工作。它在 Safari、Chrome 和 Opera 15+ 中可用，但 Firefox 和 Internet Explorer\
    \ 10+ 没有添加支持的计划。\n\n问题在于：万维网联盟（W3C）已经停止了 Web SQL 规范的工作。因此，存在浏览器放弃 Web SQL 支持的风险，或者进一步的发展将以非标准的方式进行。依赖它是有风险的，因此在本章中，我们将重点关注\
    \ IndexedDB，并使用 polyfill（填充方案）来支持 Safari 和旧版本的 Opera。\n\n好的一面是，有一些 JavaScript\
    \ polyfill 程序和库可以弥补 Web SQL 和 IndexedDB 之间的差异。[Lawnchair](http://brian.io/lawnchair/)\
    \ 同时支持两者，如果你愿意，它也可以使用 `localStorage`。还有 [PouchDB,](http://pouchdb.com/)，它使用自己的\
    \ API 来平滑 Web SQL 和 IndexedDB 之间的差异。PouchDB 还支持与 CouchDB 服务器同步，尽管在使用 PouchDB 构建应用时并不需要\
    \ CouchDB。\n\n在本章中，我们将专注于 IndexedDB，并使用 [IndexedDBShim](http://nparashuram.com/IndexedDBShim/)\
    \ 来处理其他浏览器。\n\n## 关于 IndexedDB\n\nIndexedDB 是一个无模式、事务型的键值对存储数据库。IndexedDB 数据库中的数据缺乏你在\
    \ MySQL 或 PostgresSQL 中常见的那种严格、规范化的表结构。相反，每条记录都有一个键，每个值都是一个对象。它是一个客户端“NoSQL”数据库，更类似于\
    \ CouchDB 或 MongoDB。对象可以具有任意数量的属性。例如，在一个待事项应用程序中，某些对象可能有 `tags` 属性，而某些则可能没有，如图\
    \ 25.1 所示。\n\n![带有和不带 tags 属性的对象](img/schema-free.png)\n\n图 25.1 带有和不带 `tags`\
    \ 属性的对象\n\n同一数据库中的两个对象甚至可以完全不同的属性。通常，我们希望为对象的属性名称使用命名规范。\n\nIndexedDB 还是**事务型的**。如果读或写操作的任何部分失败，数据库将回滚到之前的状态。这些操作被称为**事务**，并且必须在回调函数内部执行。这有助于确保数据完整性。\n\
    \nIndexedDB 有两个 API：同步和异步。在同步 API 中，方法会在操作完成后返回结果。该 API 只能在 [Web Workers](http://en.wikipedia.org/wiki/Web_worker)\
    \ 中使用，在这些地方同步操作不会阻塞应用程序的其他部分。在编写本文时，浏览器尚尚不支持同步 API。\n\n在本章中，我们将涵盖异步 API。在这种模式下，操作会立即返回结果，而不会阻塞调用线程。每个支持\
    \ IndexedDB 的浏览器都提供了异步 API 支持。\n\n书中的示例使用了最新版本的 [IndexedDB](http://www.w3.org/TR/IndexedDB/)\
    \ 规范。Chrome（23 及更早版本）和 Firefox（16 及更早版本）中的旧版本 IndexedDB 需要厂商前（vendor prefix）。这些实验性版本之间存在许多不一致之处，这些通过规范过程得到了很好的解决。由于标准化\
    \ API 在 Firefox 和 Chrome 中已发布多个版本，并且在 Internet Explorer 10+ 中可用，我们不再去理会旧版本。\n\n\
    ### 注意：检查 IndexedDB 记录\n\n如果你想检查你的 IndexedDB 记录，请使用 Chrome 或 Opera 15+。这些浏览器目前拥有检查\
    \ IndexedDB 对象存储的最佳工具。通过 IndexedDBShim，你可以使用 Safari 的检查器查看 Web SQL 中的这些数据，但其结构可能不完全相同。Internet\
    \ Explorer 提供了一个 [IDBExplorer 包](http://ie.microsoft.com/testdrive/HTML5/newyearslist/IDBExplorer.zip)\
    \ 来调试 IndexedDB，但它的开发者工具中缺乏原生支持。Firefox 开发者工具尚未支持数据库检查。\n\n现在，让我们通过创建一个日志应用程序来记录日记条目，来看\
    \ IndexedDB 的概念。\n\n## 设置我们的 HTML\n\n在深入研究 IndexedDB 之前，让我们为我们的日志应用构建一个非常简单的界面：\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>IndexedDB Journal</title>\n  <link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"css/style.css\">\n</head>\n<body>\n<form>\n  <p>\n    <label for=\"tags\"\
    >你想如何给这条条目打标签？</label>\n    <input type=\"text\" name=\"tags\" id=\"tags\" value=\"\
    \" required>\n    <span class=\"note\">(可选。用逗号分隔标签。)</span>\n  </p>\n  <p>\n \
    \   <label for=\"entry\">今天发生了什么？</label>\n    <textarea id=\"entry\" name=\"\
    entry\" cols=\"30\" rows=\"12\" required>\n    </textarea>\n    <button type=\"\
    submit\" id=\"submit\">保存条目</button>\n  </p>\n</form>\n\n <section id=\"allentries\"\
    \ class=\"hidden\">\n  <h1>查看所有条目</h1>\n </section>\n\n<script src=\"js/IndexedDBShim.min.js\"\
    ></script>\n<script src=\"js/journal.js\"></script>\n</body>\n</html>\n```\n\n\
    这为我们提供了一个非常简单的界面，由两个表单字段和一个“保存条目”的按钮组成，如图 25.2 所示。我们还添加了一个视图，在我们保存完最新的条目后显示所有条目。该应用程序的生产级版本可能会有更多屏幕，但对于这个演示来说足够了。\n\
    \n![在 Firefox 中所示的简单日志界面](img/journal-ui.png)\n\n图 25.2 在 Firefox 中所示的简单日志界面。\n\
    \n## 创建数据库\n\n要创建数据库，请使用 `open()` 方法。它接受两个参数：数据库名称以及一个可选的整数值，用于设置数据库的版本号：\n\n\
    ```\nvar idb = indexedDB.open('myIDBJournal',1);\n```\n\n你的数据库名称可以是任何字符串值，包括空字符串（''`）。名称只是将数据库绑定到源。与\
    \ `localStorage` 一样，IndexedDB 数据库只能由共享相同源的脚本读取或写入。记住，一个源由方案（例如 `http://` 或 `https://`）、主机名和端口号组成。这些必须完全匹配，这意味着在\
    \ `http://example.com` 创建的数据库无法被 `http://api.example.com` 的脚本访问，反之亦然。\n\n版本号可以是从\
    \ 1 到 2⁵³ 之间的任何整数（即 9,007,199,254,740,991）。浮点数或小数不起作用。浮点数将被转换为整数。例如，2.2 变成 2，0.8\
    \ 变成 0（并抛出 `TypeError`）。如果你不包含版本号，浏览器将使用 1。\n\n如果 `open` 操作成功，浏览器将触发 `success`\
    \ 事件。我们可以使用 `onsuccess` 回调来执行事务，或者像我们在这里所做的，用它将数据库对象赋值给全局变量：\n\n```\n// 初始化变量。\n\
    var databaseObj;\nidb.onsuccess = function(successEvent){\n    // 设置它的值。\n   \
    \ databaseObj = successEvent.target.result;\n}\n```\n\n与所有的 DOM 事件一样，我们的 `successEvent`\
    \ 对象包含一个 `target` 属性。在这种情况下，目标是我们的 `open` 请求事务。`target` 属性也是一个对象，包含一个 `result`\
    \ 属性，它是我们事务的结果。在这种情况下，`result` 的值就是我们的数据库。\n\n这是一个非常重要的理解要点。*每个事务都需要一个 `onsuccess`\
    \ 处理器*。该事务的结果始终是目标对象的子属性，而它是事件对象的属性（`event.target.result`）。\n\n"
- fmt: "\nNow that we’ve set our global `databaseObj` variable to our database object,\
    \ we can use `databaseObj` for our transactions.\n\n## Adding an Object Store\n\
    \nCreating a database won’t automatically make it do anything by itself. To begin\
    \ storing data, you’ll have to create at least one `object store`. If you are\
    \ familiar with SQL databases, an object store is analogous to an SQL table. Object\
    \ stores are where we store our `records`, or entries. IndexedDB databases can\
    \ contain multiple object stores.\n\nTo add an object store, we first need to\
    \ trigger a `version change`. To trigger a version change, the version argument\
    \ (the second parameter) needs to be greater than the database’s current version\
    \ value. For the first release of your application, this value can be `1`.\n\n\
    When the database version number increases (or is set for the first time), the\
    \ browser will fire an `upgradeneeded` event. Any structural changes—adding an\
    \ object store, adding an index to an object store—must be made within the `onupgradeneeded`\
    \ event handler method:\n\n```\nidb.onupgradeneeded = function(event){\n    //\
    \ Change the database.\n}\n```\n\nLet’s create an object store named `entries`.\
    \ To do this, we need to use the `createObjectStore` method of the database object:\n\
    \n```\nidb.onupgradeneeded = function(event){\n  try {\n    event.target.result.createObjectStore(\n\
    \      ['entries'],\n      { keyPath: 'entrydate' }\n    );\n  } catch(error)\
    \ {}\n}\n```\n\nIf the object store doesn’t exist, it will be created. If it does,\
    \ the browser will fire a constraint error. We’ve wrapped this in a `try`-`catch`\
    \ block so that we can silently handle an error should one occur. But we could\
    \ also set an event handler using the `onerror` event attribute:\n\n```\nidb.onerror\
    \ = function(event){\n    // Log the error to the console, or alert the user\n\
    }\n```\n\nAt a minimum, `createObjectStore` requires a name argument. It must\
    \ be a string, but this string can’t contain any spaces. The second argument is\
    \ optional, but it must be a `dictionary`. Dictionaries are objects that have\
    \ defined properties and values. For `createObjectStore`, those properties and\
    \ values are as follows:\n\n*   `autoIncrement`: Must be either `true` or `false`;\
    \ auto-generates keys and indexes for each record in the store. Default value\
    \ is `false`.\n*   `keyPath`: Specifies which object property to use as an index\
    \ for each record in the store. Default value is `null`. Makes the named field\
    \ a required one.\n\nHere we’ve chosen to set a `keyPath`. This means that every\
    \ object we add to the database will need to contain an `entrydate` property,\
    \ and the value of the `entrydate` property will become our key.\n\nYou don’t\
    \ have to set `autoIncrement` or `keyPath`. It’s possible to add our object store\
    \ without it. If you choose not to set either, you *must* set a key for every\
    \ record stored. We’ll discuss this in the next section.\n\nNotice that we didn’t\
    \ use our `databaseObj` variable with our `onupgradeneeded` callback? That’s because\
    \ the `onupgradeneeded` callback is triggered when the version changes.\n\n##\
    \ Adding a Record\n\nNow that we’ve set our global `databaseObj` variable to our\
    \ database object, we can use `databaseObj` for our transactions.\n\n## Adding\
    \ an Object Store\n\nCreating a database won’t automatically make it do anything\
    \ by itself. To begin storing data, you’ll have to create at least one `object\
    \ store`. If you are familiar with SQL databases, an object store is analogous\
    \ to an SQL table. Object stores are where we store our `records`, or entries.\
    \ IndexedDB databases can contain multiple object stores.\n\nTo add an object\
    \ store, we first need to trigger a `version change`. To trigger a version change,\
    \ the version argument (the second parameter) needs to be greater than the database’s\
    \ current version value. For the first release of your application, this value\
    \ can be `1`.\n\nWhen the database version number increases (or is set for the\
    \ first time), the browser will fire an `upgradeneeded` event. Any structural\
    \ changes—adding an object store, adding an index to an object store—must be made\
    \ within the `onupgradeneeded` event handler method:\n\n```\nidb.onupgradeneeded\
    \ = function(event){\n    // Change the database.\n}\n```\n\nLet’s create an object\
    \ store named `entries`. To do this, we need to use the `createObjectStore` method\
    \ of the database object:\n\n```\nidb.onupgradeneeded = function(event){\n  try\
    \ {\n    event.target.result.createObjectStore(\n      ['entries'],\n      { keyPath:\
    \ 'entrydate' }\n    );\n  } catch(error) {}\n}\n```\n\nIf the object store doesn’t\
    \ exist, it will be created. If it does, the browser will fire a constraint error.\
    \ We’ve wrapped this in a `try`-`catch` block so that we can silently handle an\
    \ error should one occur. But we could also set an event handler using the `onerror`\
    \ event attribute:\n\n```\nidb.onerror = function(event){\n    // Log the error\
    \ to the console, or alert the user\n}\n```\n\nAt a minimum, `createObjectStore`\
    \ requires a name argument. It must be a string, but this string can’t contain\
    \ any spaces. The second argument is optional, but it must be a `dictionary`.\
    \ Dictionaries are objects that have defined properties and values. For `createObjectStore`,\
    \ those properties and values are as follows:\n\n*   `autoIncrement`: Must be\
    \ either `true` or `false`; auto-generates keys and indexes for each record in\
    \ the store. Default value is `false`.\n*   `keyPath`: Specifies which object\
    \ property to use as an index for each record in the store. Default value is `null`.\
    \ Makes the named field a required one.\n\nHere we’ve chosen to set a `keyPath`.\
    \ This means that every object we add to the database will need to contain an\
    \ `entrydate` property, and the value of the `entrydate` property will become\
    \ our key.\n\nYou don’t have to set `autoIncrement` or `keyPath`. It’s possible\
    \ to add our object store without it. If you choose not to set either, you *must*\
    \ set a key for every record stored. We’ll discuss this in the next section.\n\
    \nNotice that we didn’t use our `databaseObj` variable with our `onupgradeneeded`\
    \ callback? That’s because the `onupgradeneeded` callback is triggered when the\
    \ version changes.\n\n## Adding a Record\n\nNow that we’ve set our global `databaseObj`\
    \ variable to our database object, we can use `databaseObj` for our transactions.\n"
  raw: "Now that we’ve set our global `databaseObj` variable to our database object,\
    \ we can use `databaseObj` for our transactions.\n\n## Adding an Object Store\n\
    \nCreating a database won’t automatically make it do anything by itself. To begin\
    \ storing data, you’ll have to create at least one ****o**bject store******. If\
    \ you are familiar with SQL databases, an object store is analogous to an SQL\
    \ table. Object stores are where we store our **records**, or entries. IndexedDB\
    \ databases can contain multiple object stores.\n\nTo add an object store, we\
    \ first need to trigger a ***version change***. To trigger a version change, the\
    \ version argument (the second parameter) needs to be greater than the database’s\
    \ current version value. For the first release of your application, this value\
    \ can be `1`.\n\nWhen the database version number increases (or is set for the\
    \ first time), the browser will fire an `upgradeneeded` event. Any structural\
    \ changes―adding an object store, adding an index to an object store―must be made\
    \ within the `onupgradeneeded` event handler method:\n\n```\nidb.onupgradeneeded\
    \ = function(event){\n    // Change the database.\n}\n```\n\nLet’s create an object\
    \ store named `entries`. To do this, we need to use the `createObjectStore` method\
    \ of the database object:\n\n```\nidb.onupgradeneeded = function(event){\n  try\
    \ {\n    event.target.result.createObjectStore(\n      ['entries'],\n      { keyPath:\
    \ 'entrydate' }\n    );\n  } catch(error) {}\n}\n```\n\nIf the object store doesn’t\
    \ exist, it will be created. If it does, the browser will fire a constraint error.\
    \ We’ve wrapped this in a `try`-`catch` block so that we can silently handle an\
    \ error should one occur. But we could also set an event handler using the `onerror`\
    \ event attribute:\n\n```\nidb.onerror = function(event){\n    // Log the error\
    \ to the console, or alert the user\n}\n```\n\nAt a minimum, `createObjectStore`\
    \ requires a name argument. It must be a string, but this string can’t contain\
    \ any spaces. The second argument is optional, but it must be a ****dictionary****.\
    \ Dictionaries are objects that have defined properties and values. For `createObjectStore`,\
    \ those properties and values are as follows:\n\n*   `autoIncrement`: Must be\
    \ either `true` or `false`; auto-generates keys and indexes for each record in\
    \ the store. Default value is `false`.\n\n*   `keyPath`: Specifies which object\
    \ property to use as an index for each record in the store. Default value is `null`.\
    \ Makes the named field a required one.\n\nHere we’ve chosen to set a `keyPath`.\
    \ This means that every object we add to the database will need to contain an\
    \ `entrydate` property, and the value of the `entrydate` property will become\
    \ our key.\n\nYou don’t have to set `autoIncrement` or `keyPath`. It’s possible\
    \ to add our object store without it. If you choose not to set either, you *must*\
    \ set a key for every record stored. We’ll discuss this in the next section.\n\
    \nNotice that we didn’t use our `databaseObj` variable with our `onupgradeneeded`\
    \ callback? That’s because the `onupgradeneeded` event is fired before the `onsuccess`\
    \ event when working with IndexedDB. It won’t be defined when we need it.\n\n\
    ## Adding a Record\n\nAdding records is a little more complicated. We need to\
    \ create a ****transaction****, and then take an action once the transaction completes.\
    \ The process is roughly as follows:\n\n1.  Open a transaction connection to one\
    \ or more object stores.\n\n2.  Select which object store to use for the transaction\
    \ request.\n\n3.  Create a request by invoking the `put`, `add`, `delete` or `get`\
    \ methods.\n\n4.  Define an `onsuccess` handler to process our results.\n\nThese\
    \ steps need to happen within a callback or event handler of some kind. Here we’ll\
    \ do it when our journal entry form is submitted:\n\n```\ndocument.forms[0].onsubmit\
    \ = function(submitEvent){\n  var entry, i, transaction, objectstore, request,\
    \ fields;\n\n  fields = submitEvent.target;\n\n  // Prevent form submission and\
    \ page reload.\n  submitEvent.preventDefault();\n\n  /* Build our record object\
    \ */\n  entry = {};\n  entry.entrydate = new Date().getTime();\n\n  for( i=0;\
    \ i < fields.length; i++){\n    if( fields[i].value !== undefined ){\n      entry[fields[i].name]\
    \ = fields[i].value;\n    }\n  }\n\n  /* Set our success handler  */\n  request.onsuccess\
    \ = showAllEntries;\n\n  /* Start our transaction. */\n  transaction = databaseObj.transaction(['entries'],'readwrite');\n\
    \n  /* Choose our object store (the only one we've opened). */\n  objectstore\
    \ = transaction.objectStore('entries');\n\n  /* Save our entry. We could also\
    \ use the add() method */\n  request = objectstore.put(entry);\n}\n```\n\nThere’s\
    \ a lot happening in this function, but the most important parts are the following\
    \ three lines:\n\n```\n/* Start our transaction. */\ntransaction = databaseObj.transaction(['entries'],'readwrite');\n\
    \n/* Choose our object store (the only one we've opened). */\nobjectstore = transaction.objectStore('entries');\n\
    \n/* Save our entry */\nrequest  = objectstore.put(entry);\n```\n\nIn these lines,\
    \ we’ve first created a transaction by calling the `transaction` method on our\
    \ database object. `transaction` accepts two parameters: the name of the object\
    \ store or stores we’d like to work with, and the mode. The mode may be either\
    \ `readwrite` or `readonly`. Use `readonly` to retrieve values. Use `readwrite`\
    \ to add, delete, or update records.\n\nNext, we’ve chosen which object store\
    \ to use. Since the transaction connection was only opened for the `entries` store,\
    \ we’ll use `entries` here as well. It’s possible to open a transaction on more\
    \ than one store at a time, however.\n\nLet’s say our application supported multiple\
    \ authors. We might then want to create a transaction connection for the `authors`\
    \ object store at the same time. We can do this by passing a ****sequence****—an\
    \ array of object store names—as the first argument of the `transaction` method,\
    \ as shown here:\n\n```\ntrans = databaseObj.transaction(['entries','authors'],\
    \ 'readwrite');\n```\n\nThis won’t write the record to both object stores. It\
    \ just opens them both for access. Which object store will be affected is determined\
    \ by the `objectStore()` method.\n\n### Note: Use Square Brackets\n\nIn newer\
    \ versions of Chrome (33+) and Firefox, you may pass a single object store name\
    \ to the transaction method without square brackets; for example, `databaseObj.transaction('entries','readonly')`.\
    \ For the broadest compatibility, though, use square brackets.\n\n`req = objectstore.put(entry);`\
    \ is the final line. It saves our `entry` object to the database. The `put` method\
    \ accepts up to two arguments. The first is the value we’d like to store, while\
    \ the second is the key for that value: for example: `objectStore.put(value, key)`.\n\
    \nIn this example, we’ve just passed the `entry` object to the `put` method. That’s\
    \ because we’ve defined `entrydate` as our `keyPath`. If you define a `keyPath`,\
    \ the property name you’ve specified will become the database key. In that case,\
    \ you don’t need to pass one as an argument. If, on the other hand, we didn’t\
    \ define a `keyPath` and `autoIncrement` was `false`, we *would* need to pass\
    \ a key argument.\n\nWhen the `success` event fires, it will invoke the `showAllEntries`\
    \ function.\n\n### Note: `put` Versus `add`\n\nThe IndexedDB API has two methods\
    \ that work similarly: `put` and `add`. You can only use `add` when adding a record.\
    \ But you can use `put` when adding *or updating* a record.\n\n## Retrieving and\
    \ Iterating Over Records\n\nYou probably noticed the line `request.onsuccess =\
    \ showAllEntries` in our form’s `onsubmit` handler. We’re yet to define that function,\
    \ but this is where we’ll retrieve all our entries from the database.\n\nTo retrieve\
    \ multiple records there are two steps:\n\n1.  run a **cursor** transaction on\
    \ the database object\n\n2.  iterate over the results with the `continue()` method\n\
    \n### Creating a Cursor Transaction"
