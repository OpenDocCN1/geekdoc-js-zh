    # `input type="number"`


    The `number` type is another form control type for numeric input values. According
    to the specification, any floating point number is a valid value. In practice,
    though, things are little more complicated.


    By default, the `number` input type only accepts integers. Entering `4.2776`,
    for example, will cause a validation error in conforming browsers, such as shown
    in [Figure 4.6](#ch04.html_numbertype "Figure 4.6. An error when entering floating
    point number").


    ![An error when entering floating point number](figures/numbertype10.png)


    Figure 4.6. An error when entering floating point number


    In order to accept floating point, we need to set the `step` attribute. In browsers
    with incremental controls, as shown in [Figure 4.7](#ch04.html_numberchrome "Figure
    4.7. Decimal values with the step"), `step` controls how much the number is incremented
    or decremented with each press of the arrow.


    ![Decimal values with the step](figures/numbertypechrome.png)


    Figure 4.7. Decimal values with the step


    For example, when `step="0.5"`, both `1.5` and `9` are valid values, but `8.1`
    is not. When `step=".01"`, however, `8.1`, `1.5`, and `9` are all valid values,
    as is `3.14`. In a way, you can use the `step` attribute to control the floating
    point precision of numbers.


    ```

    <!-- Increments number by 0.5 -->

    <input type="number" name="num" value="" step=".5">


    <!-- Increments number by .01; precision to the hundredth -->

    <input type="number" name="num" value="" step=".01">


    <!-- Increments number by .001; precision to the thousandth -->

    <input type="number" name="num" value="" step=".001">

    ```


    In order to make our `4.2776` value an accepted one, we would need to use our
    `step` attribute to `.001`. Unfortunately, this workaround does not work in Opera
    12 and older versions.


    ## Date and Time Inputs


    Finally, let’s look at the date and time input types. There are six of them, listed
    below:


    - `datetime`: Select a date and time as global UTC string

    - `datetime-local`: Select a date and time in the user’s time zone

    - `date`: Select a single date with time component of midnight

    - `month`: Select a month and year

    - `week`: Select a week

    - `time`: Select a time in hours and minutes


    Browsers that support these types will display a time picker widget (for `time`),
    a date picker (for `date`, `month`, `week`), or both (`datetime` and `datetime-local`),
    as shown in [Figure 4.8](#ch04.html_datetime "Figure 4.8. The time picker in Opera").


    ![The time picker in Opera](figures/datetime12.png)


    Figure 4.8. The time picker in Opera


    The `datetime` and `datetime-local` input types are subtly different. The former
    treats all input as a UTC (coordinated, universal) date and time. Browsers may
    indicate to the user that this is a UTC input—as Opera version 12 does—or it may
    display a localized interface, and convert the time under the hood.


    Chrome and Opera 15 support all but `datetime`. Safari of version 6.0, Firefox
    of version 25, and Internet Explorer of version 10 do not support any of these
    types.


    ## `input type="color"`


    With the `color` input type, we can add a native color picker to our applications.
    What the color picker looks like depends on the browser and operating system.
    However in all cases, only six-digit hexadecimal color values are valid. This
    means that you can’t specify a color with transparency as you can with CSS. The
    default value for the `color` type is `#000000`.


    Unfortunately, the `color` input type is only supported by Chrome and Opera 11
    and 12 (but not version 15.0). It’s not ready for prime time, but is mentioned
    here for completeness.


    # Chapter 5 Basics: Multimedia, Audio and Video


    Perhaps the biggest change in HTML5 is its multimedia capabilities. HTML5 brings
    with it native audio and video, and almost replaces the plugins of the old web.
    I say "almost" because browser vendors have yet to agree on a default format for
    web audio and video.


    We’ll talk about cross-browser support later in this chapter. First let’s look
    at the bare minimum necessary to add video to your web page: a `video` tag and
    a `src` attribute.


    ```

    <video src="path_to/file.video"></video>

    ```


    In HTML5, that closing tag is required. If you’re using XHTML syntax, you can
    self-close it instead like so: `<video src="path_to/file.video" />`. The `audio`
    element is almost the same. All that’s required is the opening `audio` tag, a
    `src` attribute and a closing `</audio>` tag.


    ```

    <audio src="path_to/file.audio"></audio>

    ```


    Again, if we were using XHTML5 syntax, we could self-close our tag instead: `<audio
    src="path_to/file.audio" />`.


    ## Adding Controls


    Unfortunately, as shown in [Figure 5.1](#ch05.html_nocontrols "Figure 5.1. An
    example of a video element without controls in Firefox. Image from Big Buck Bunny
    by the Blender Foundation."), our snippet from above won’t do anything besides
    add the media file. We won’t be able to play our video, because it will be stuck
    at the first frame. We won’t even know that there’s audio on the page.


    ![An example of a video element without controls in Firefox. Image from Big Buck
    Bunny by the Blender Foundation.](figures/videocontrolsfirefox.png)


    Figure 5.1. An example of a `video` element without controls in Firefox. Image
    from Big Buck Bunny by the [Blender Foundation](http://bigbuckbunny.org/).


    What we need are some controls: perhaps a play button and a scrubbable progress
    bar. We might also want a timer that reveals how much of the media has played,
    and a volume control. Luckily for us, browsers have these built-in to their audio
    and video support. We can activate them by adding the `controls` attribute.


    ```

    <video src="path_to/file.video" controls>

    ```


    The `controls` attribute tells the browser that we want playback controls to be
    available for this media instance. In most browsers, this means the user will
    see a play and pause button, elapsed time indicator, and volume control, as shown
    in [Figure 5.2](#ch05.html_withcontrols "Figure 5.2. An example of a video element
    with controls in Firefox. Image from Big Buck Bunny by the Blender Foundation").
    The player may also include a button that allows the user to toggle between full-screen
    and original size. What these default controls look like depends on the browser.


    ![An example of a video element with controls in Firefox. Image from Big Buck
    Bunny by the Blender Foundation.](figures/videocontrols.png)


    Figure 5.2. An example of a `video` element with controls in Firefox. Image from
    Big Buck Bunny by the Blender Foundation.


    `controls` is another example of an empty attribute. We could also use `controls="true"`
    or `controls="controls"` if we were using XML syntax. Adding the `controls` attribute,
    regardless of its value, will make the controls visible. Using `controls=false`
    will not hide them.


    ## Autoplaying and Looping Media


    Perhaps we want to use a short video clip as a background element. We might want
    to create an "art installation" experience in which a video plays and re-plays
    automatically. Not a problem. We can do this by adding the `autoplay` and `loop`
    attributes to our video or audio tag.


    ```

    <video src="path_to/file.video" autoplay loop></video>


    <audio src="path_to/file.audio" autoplay loop></audio>

    ```


    With `autoplay`, our media will begin as soon as the browser has received enough
    data to start playback. When the audio or video ends, `loop` tells the browser
    to re-start the media file from the beginning.


    ### Note: Use `autoplay` with Caution


    Some audio and video can be embarrassingly bad or just embarrassing if heard.
    Do your audience a favor: silence auto-playing media with the `muted` attribute.


    ```

    <video src="annoying.video" autoplay loop muted></video>

    ```

