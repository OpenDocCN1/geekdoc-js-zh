    \ Opera, or Mozilla Firefox available for your operating system. Internet Explorer\
    \ and Safari are bundled with Microsoft Windows and Mac OS X, respectively. Other\
    \ browsers may be downloaded from their company web sites.\n\nFor some of the\
    \ later chapters in the book, you will also require web server software. [Apache\
