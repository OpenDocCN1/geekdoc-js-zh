  trans: "\n\n随着本书的进展，我们将处理一些更高级的主题，例如 API 和离线应用程序。为了学习这些章节，你应该熟悉 HTML 以及 JavaScript\
    \ 基础和文档对象模型（`DOM`）。你不需要对 JavaScript 有深入了解。尽管如此，你应该理解事件处理、JavaScript 数据类型以及如 `while`\
    \ 循环和 `if-else` 条件语句等控制结构。不过，我们将保持脚本示例的简单，并逐行对其进行解释。如果你对 JavaScript 不熟悉，可能喜欢阅读\
    \ Kevin Yank 编写的 SitePoint 的 *[Simply JavaScript](http://www.sitepoint.com/store/simply-javascript/)*\
    \ 作为入门。[Mozilla 开发者网络](https://developer.mozilla.org/en-US/) 也为 JavaScript 和 `DOM`\
    \ 提供了极的学习资源和文档。\n\n## 使用的规范\n\n你会注意到，我们在整本书中使用了一些特定的排版和布局样式来表示不同类型的信息。请关注以下内容。\n\
    \n### 代码示例\n\n书中的代码将使用等宽字体显示，如下：\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park. The birds \nwere singing and the kids\
    \ were all back at school.</p>\n```\n\n如果代码出现在书籍的代码存档中，文件名将出现在程序列表顶部，如下：\n\n`example.css`\n\
    \n```\n.footer {\n  background-color: #CCC;\n  border-top: 1px solid #333;\n}\n\
    ```\n\n如果只显示了文件的部分内容，将用 *excerpt*（节选）一词表示：\n\n`example.css (excerpt)`\n\n```\n\
    \ border-top: 1px solid #333;\n```\n\n如果要在现有示例中插入额外的代码，新代码将以粗体显示：\n\n```\nfunction\
    \ animate() {\n  new_variable = \"Hello\";\n}\n```\n\n此外，当为了上下文而需要现有代码而不是重复所有代码时，将显示一个\
    \ …：\n\n```\nfunction animate() {\n  …\n  return new_variable;\n}\n```\n\n某些代码行\
    \ intended 在一行内输入，但由于页面限制，我们对其进行了换行。↵ 表示仅出于格式目的而存在的换行，应该被忽略。\n\n```\nURL.open(\"\
    http://www.sitepoint.com/responsive-web-design-real-user-\n↵testing/?responsive1\"\
    );\n```\n\n### 提示、注意和警告\n\n### 提示：嘿，你！\n\n提示（Tips）将为你提供有用的小技巧。\n\n### 注意：咳，打扰一下……\n\
    \n注意（Notes）是与主题相关但并非至关重要的补充。将它们看作额外的信息碎片。\n\n### 重要：确保你始终……\n\n… 注意这些重要的要点。\n\n\
    ### 警告：小心！\n\n警告（Warnings）将突出任何可能在过程中让你出错的陷阱。\n\n## 补充材料\n\n[`www.sitepoint.com/store/jump-start-html5/`](http://www.sitepoint.com/store/jump-start-html5/)\n\
    \n书籍官方网站，包含链接、更新、资源等。\n\n[`github.com/spbooks/jshtml`](https://github.com/spbooks/jshtml)\n\
    \n本书的可下载代码存档。\n\n[`www.sitepoint.com/forums/`](http://www.sitepoint.com/forums/)\n\
    \nSitePoint 论坛，用于在遇到任何棘手的 Web 问题寻求帮助。\n\n`books@sitepoint.com`\n\n我们的电子邮件地址，如果你需要联系我们寻求支持、报告问题或出于任何其他原因。\n\
    \n## 你需要的工具\n\n开发 HTML5 文档你只需要一个用于编写的文本编辑器和一个用于查看工作的浏览器。不要使用文字处理软件。那些程序是为编写文档设计的，而不是为了编程。相反，你需要一个可以读写纯文本的软件。\n\
    \n如果你是 Windows 用户，可以尝试 [Notepad++](http://notepad-plus-plus.org/)，这是一个免费开源的文本编辑器。Mac\
    \ OS X 用户可能想尝试 Bare Bones 软件的 [TextWrangler](http://www.barebones.com/products/textwrangler/)。它是免费的，但不是开源的。[Brackets](http://brackets.io/)\
    \ 是 Windows 和 Mac 用户的另一个选择。Linux 用户可以使用 Ubuntu Linux 自带的 gEdit，或者尝试免费开源的 [Bluefish](http://bluefish.openoffice.nl/)。也有付费软件选项，它们有时比免费开源选项更精细。\n\
    \n你还需要至少一个支持 HTML5 的浏览器，以便使用书中的示例。请确保你正在适用于你操作系统的最新版本的 Google Chrome、Microsoft\
    \ Internet Explorer、Apple Safari、Opera 或 Mozilla Firefox。Internet Explorer 和 Safari\
    \ 分别内置在 Microsoft Windows 和 Mac OS X 中。其他浏览器可以从它们公司的网站下载。\n\n对于书中的后几个章节，你还需要 Web\
    \ 服务器软件。[Apache HTTP Server](http://httpd.apache.org/), [Nginx](http://wiki.nginx.org/Main)\
    \ 或 [Lighttpd](http://www.lighttpd.net/) 都是适用于 Windows、Mac OS X 和 Linux 的开源服务器包。Mac\
    \ OS X 用户还可以尝试 [MAMP](http://www.mamp.info/en/index.html)，它将 MySQL、Apache 和 PHP\
    \ 封装成一个易于使用的程序包。Windows 用户可以尝试 [WAMP](http://www.wampserver.com/en/) 或 [XAMPP](http://www.apachefriends.org/index.html)，这些是该操作系统的类似包。你的操作系统可能也默认安装了\
    \ Web 服务器。如果不确定，请检查其文档。\n\n## 你想继续学习吗？\n\n现在你可以以低廉的价格在 [Learnable](https://learnable.com/)\
    \ 上无限访问课程和所有 SitePoint 书籍。立即报名并从今天开始学习！加入 Learnable，你将处于最新技术趋势的前：[`www.learnable.com`](http://www.learnable.com)。\n\
    \n# 第 1 章\n\n### 基础：什么是 HTML5？\n\n简单的答案是它是 HTML 的最新版本。但这并没有告诉我们太多信息。具体来说，HTML5：\n\
    \n*   定义了一种解析算法，用于生成一致的 `DOM`（文档对象模型）树，即使对于模糊或低质量的标记也是如此\n*   添加了新元素支持多媒体和 Web\
    \ 应用程序\n*   重新定义了现有 HTML 元素的规则和语义\n\n通过 HTML5，我们现在可以在 HTML 文档中原生嵌入音频和视频。可以使用内联\
    \ `SVG`（可缩矢量图形）标记。我们可以构建更健壮的表单体验，带有原生错误检查。我们可以使用 `canvas` 元素创建游戏、图表和动画。文档可以使用跨文档消息进行通信。换句话说，HTML5\
    \ 更多是一个应用程序平台，而不仅仅是一种标记语言。\n\n### HTML5 简史\n\n关于 HTML5 如何以及为何产生的历史太长了，在书中无法充分涵盖。尽管如此，一点历史背景可能帮助你理解\
    \ HTML5 的产生过程。\n\nHTML 起根于*标准通用标记语言*，或 SGML。将 SGML 想象为一组定义和创建标记语言的规则。\n\nHTML，或\
    \ `HyperText Markup Language`（超文本标记语言），最初是 SGML 的应用。HTML 创建于 20 世纪 90 年代初，是描述超文本文档结构的标准方法。“超文本”简单意味着文本“包含指向其他文本的链接”且[不受线性的限制](http://www.w3.org/WhatIs.html)。\n\
    \n通过描述文档的结构，我们将其与外观或其呈现给终端用户的方式解耦。这使得共享和分发变得更容易。相关的超文本传输协议（HTTP）使得在互联网上共享文档变得简单。\n\
    \n### HTML：早期阶段\n\n“HTML 1”定义了一种简单的、基于标签的语法来解释文档结构——非常基础的文档结构。段落（p`）和列表项（li`）元素不需要结束标签。[最早版本](http://info.cern.ch/hypertext/WWW/MarkUp/MarkUp.html)\
    \ 甚至不包含 `img` 或 `table` 元素。图像支持是在规范的 [1.2 版本](http://www.w3.org/MarkUp/draft-ietf-iiir-html-01.txt)\
    \ 中添加的。\n\n"
- fmt: '

    HTML grammar changed only slightly with [version 2.0](http://www.w3.org/MarkUp/html-spec/).
    Now we could use end tags for elements such as `p` and `li`, but these end tags
    were optional. The transition from HTML 2.0 to HTML 3.2, however, marked a huge
    leap.


    With HTML 3.2, we could change type rendering with the `font` element. We could
    add robust interactivity with Java applets and the `applet` element. We could
    add tabular data with the `table`, `tr` and `td` elements. But perhaps the most
    significant feature introduced in HTML 3.2 was style sheets.


    Most of the web, however, settled on HTML 4. With the advent of HTML 4, we could
    tell the browser how to parse our document by choosing a document type. HTML 4
    offered three options:


    * Transitional, which allowed for a mix of deprecated HTML 3.2 elements and HTML
    4

    * Strict, which only allowed HTML 4 elements

    * Frameset, which allowed multiple documents to be embedded in one using the `frame`
    element


    What HTML versions 1 through 4 didn’t provide, however, were clear rules about
    how to parse HTML.


    The W3C stopped working on HTML 4 in 1998, instead choosing to focus its efforts
    on a replacement: XHTML.


    ### A Detour Through XHTML Land


    [XHTML 1.0](http://www.w3.org/TR/xhtml1/) was created as "a reformulation of HTML
    4 as an XML 1.0 application." `XML`, eXtensible Markup Language, was a web-friendly
    revision of SGML, offering stricter rules for writing and parsing markup.


    XHTML, for example, required lower case tags while HTML allowed upper case tags,
    lower case tags, or a mix of the two. XHTML required end tags for all non-empty
    elements such as `p` and `li`. Empty elements such as `br` and `img` had to be
    closed with `/>`. You had to quote all of your attributes, and escape your ampersands.
    All pages had to be served as `application/xml+xhtml` MIME type.


    XHTML taught us how to write better-quality markup. But ultimately suffered from
    a lack of proper browser support.


    [XForms](http://www.w3.org/TR/2007/REC-xforms-20071029/), on the other hand, was
    supposed to replace HTML forms. XForms introduced `upload` and `range` elements
    to provide richer ways to interact with web sites.


    XForms didn’t gain much traction, however. After all, why introduce a specific
    markup language for forms to the web? Why not enhance HTML instead?


    ### The Battle for World DOM-ination


    In 1996, Netscape released Netscape Navigator 2.0 with support for two separate,
    but related technologies: JavaScript and the Document Object Model. We usually
    talk about them as though they’re one and the same thing, but DOM is an API for
    interacting with HTML documents. JavaScript is the primary language for interacting
    with that API.


    Netscape Navigator’s DOM interface turned each element of an HTML page into an
    object that could be created, moved, modified, or deleted using a scripting language.
    Now we could add animation or interactivity to our web pages, even if we had to
    wait ages for them to download over our super-slow, 14.4Kbps modems.


    The DOM was such a brilliant addition to the web that other browsers quickly followed
    suit. But not every browser implemented the DOM in quite the same way. Netscape
    Navigator, for example, used `document.layers` objects to reference the entire
    collection of HTML nodes. Microsoft Internet Explorer went with `document.all`.
    And web developers everywhere spent years struggling to reconcile the two. Opera
    and WebKit, for what it’s worth, followed Internet Explorer’s lead. Both browsers
    adopted `document.all`.


    Eventually "DOM0" went from being a standard-through-implementation to a standard-through-specification
    with the [Document Object Model (DOM) Level 1 Specification](http://www.w3.org/TR/REC-DOM-Level-1/).
    Rather than `document.layers` and `document.all`, we could use `document.getElementById`
    and `document.getElementsByTagName`. Today, all browsers support the DOM.


    ### Applets and Plugins


    In the midst of all of this—the growth of HTML, the rise of the DOM, and the shift
    to XHTML—applets and browser plugins joined the party. To their credit, applets
    and plugins added functionality missing from HTML. For example, RealPlayer and
    Apple’s QuickTime brought audio and video to the web. With Java applets, you could
    run a spreadsheet program in your browser. Macromedia (now Adobe) Flash and Shockwave
    let us add all of the above, plus animations.


    Applets and plugins, however, suffered from three major problems:


    1. Users who don’t have the plugin (or the applet environment) can’t see the content.

    2. Applets and plugins expanded the surface for internet-based security breaches.

    3. They were commercial products, and required developers to pay a license fee.


    What’s more, plugins and applets sometimes caused their host environment—the browser—to
    slow or crash.


    So what we had on the web was a scenario in which:


    * Browsers didn’t parse HTML according to the same rules.

    * New markup languages offered few clear advantages over HTML but added overhead
    to implement.

    * Plugins and applets offered additional functionality, but created security and
    stability issues for browsers and licensing costs for developers.


    These are the problems that HTML5 solves:


    * It incorporates features and grammars introduced by XHTML and XForms.

    * It almost eliminates the need for plugins and the stability and security issues
    they may introduce.


    ## What HTML5 Isn’t


    I admit that I’m taking a bit of a purist approach in this book. HTML5 has become
    a buzzword-y shorthand for "everything cool we can do in the browser that we couldn’t
    do before." In this book, however, we mean HTML elements and their Document Object
    Model (DOM) APIs.


    We won’t talk much about features introduced with `CSS` (Cascading Style Sheets),
    Level 3 in these pages. We will talk about what’s commonly called "JavaScript",
    but is more accurately the DOM HTML API. We’ll also talk about Scalable Vector
    Graphics, or SVG—but only to the extent that we discuss mixing SVG and HTML within
    the same document.


    This book is intended as a short introduction to HTML5. For that reason, we won’t
    cover advanced features in depth. This book will, however, give you an introduction
    to what’s new and different about HTML5 versus previous versions.


    ## A Note on the HTML5 Specification


    Both the Web Hypertext Application Technology Working Group (`WHATWG`) and the
    World Wide Web Consortium (`W3C`) publish HTML5 specifications. The two groups
    worked together for years, creating a single specification managed by a single
    editor. However in 2011, they diverged. There are now two competing, though largely
    similar, versions of the specification. Each has its own editor.


    The [WHATWG version](http://www.whatwg.org/specs/web-apps/current-work/multipage/)
    of the specification is a "living document." New features are added, tweaked,
    and occasionally removed after some discussion within the community. This version
    is far more fluid and subject to change.


    The W3C, however, has a different process. Specification editors still consult
    the community, but each document moves in phases from "Working Draft" to "Candidate
    Recommendation" to "W3C Recommendation." As a result, W3C specifications are versioned.
    The 2011 joint version of HTML5 specification became the W3C’s [HTML5 Specification](http://www.w3.org/TR/html5/).
    Subsequent revisions are part of the [HTML 5.1 specification](http://www.w3.org/html/wg/drafts/html/master/Overview.html).


    There are differences between the two specifications, some subtle, some significant.
    These differences are not well documented, however. Since this book doesn’t delve
    in to the minutiae of HTML5, these differences won’t mean much for us.


    # Chapter 2


    ## Basics: The Anatomy of HTML5


    Every HTML document is made from elements, and elements are represented by tags.
    Tags are a sequence of characters that mark where different parts of an element
    start and/or stops.

