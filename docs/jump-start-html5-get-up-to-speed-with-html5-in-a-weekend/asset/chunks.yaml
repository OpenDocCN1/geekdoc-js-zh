  trans: "\n\n```\n<form action=\"./script\" method=\"POST\">\n  <p>\n    <label for=\"\
    your_name\">您的姓名:</label>\n    <input type=\"text\" name=\"your_name\" id=\"your_name\"\
    >\n  </p>\n\n  <p>\n    <label for=\"city\">居住城市:</label>\n    <input type=\"\
    text\" name=\"city\" id=\"city\">\n  </p>\n\n  <p>\n    <label for=\"email\">\n\
    \      电子邮箱地址 \n      (用逗号分隔多个电子邮箱地址):\n    </label>\n    <input type=\"email\"\
    \ name=\"email\" id=\"email\"\n    placeholder=\"jane.doe@example.com\" multiple\
    \ >\n  </p>\n\n  <p>\n    <label for=\"tel\">电话号码:</label>\n    <input type=\"\
    tel\" name=\"phone_number\" if=\"phone_number\"\n    placeholder=\"(000) 000-0000\"\
    \n    pattern=\"\\([2-9][0-9]{2}\\) [0-9]{3}-[0-9]{4}\">\n  </p>\n\n  <p>\n  \
    \  <label for=\"url\">\n      请提供一个我们可以了解更多信息的网站（如果\n    适用）：\n    </label>\n\
    \    <input type=\"url\" name=\"current_site\" id=\"current_site\"\n    placeholder=\"\
    http://www.example.com/\"\n    pattern=\"http(|s)://[-0-9a-z]{1,253}\\.[.a-z]{2,7}\"\
    >\n  </p>\n\n  <p>\n    <label for=\"project\">告诉我们您的故事创意:</label>\n    <textarea\
    \ name=\"story_idea\" id=\"story_idea\"\n    placeholder=\"简要告诉我们我们应该写什么以及为什么。\"\
    \n    maxlength=\"2000\"></textarea>\n  </p>\n\n  <p>\n    <button type=\"submit\"\
    >提交！</button>\n  </p>\n</form>\n```\n\n# 上传文件\n\n`file` 输入类型对于 HTML 来说并不新鲜。自从\
    \ HTML 3.2 以来，我们就能上传文件了。然而，新颖的是 `multiple` 属性，它允许我们使用单个表单字段上传多个文件。在本节中，我们将构建允许用户上传音频文件的表单。\n\
    \n首先，我们需要为 `form` 元素创建一个起始标签。\n\n```\n<form action=\"/script\" method=\"post\"\
    \ enctype=\"multipart/form-data\">\n```\n\n与我们之前的表单一样，我们的起始标签具有 `action` 和 `method`\
    \ 属性。但请注意其 `enctype` 属性的值为 `multipart/form-data`。再次，在上传二进制数据时，我们必须使用 `multipart/form-data`\
    \ 编码类型。\n\n接下来，我们需要添加一个 `input` 标签，并将 `type` 属性的值设置为 `file`。我们将其命名为 `upload`，但你可以选择任何喜欢的名称。为了允许上传多个文件，我们需要添加\
    \ `multiple` 属性。\n\n```\n<input type=\"file\" name=\"upload\" id=\"upload\" multiple>\n\
    ```\n\n## 注意：PHP 表单键名\n\nPHP 要求具有多个值的表单键使用方括号数组语法。如果你正在使用 PHP 处理表单，请在名称后添加方括号（例如：`name=\"\
    upload\"` 将变为 `name=\"upload[]\"`）。\n\n我们还可以使用 `accept` 属性在浏览器中限制可以上传的文件。`accept`\
    \ 的值可以是以下任意一个：\n\n* `audio/*`, `video/*`, `image/*`\n* 有效的 MIME 类型，如 `image/png`\
    \ 或 `text/plain`\n* 以 `.` 开头的文件扩展\n\n你可以包含多个 `accept` 值；用逗号分隔它们。让我们更新表单字段以仅接受\
    \ MP3 和 Ogg Vorbis 文件。\n\n```\n<input type=\"file\" multiple name=\"upload\" id=\"\
    upload\"\naccept=\".mp3,.ogv\">\n```\n\n我们将用提交按钮和表单结束标签完成表单的构建：\n\n```\n<form\
    \ action=\"/script\" method=\"post\" enctype=\"multipart/form-data\">\n  <p>\n\
    \    <label for=\"upload\">您的文件(们):</label>\n    <input type=\"file\" multiple\
    \ name=\"upload\" id=\"upload\"\n    accept=\".mp3,.ogv\">\n  </p>\n  <p>\n  \
    \  <button type=\"submit\">上传！</button>\n  </p>\n</form>\n```\n\n提交时，我们的服务器端脚本将保存这些文件，并返回一条“感谢”消息。\n\
    \n## 警告：采取适当措施\n\n你不能依赖基于浏览器的验证或限制。请采取适当措施，并确保你的上传文件放置在非 Web 可访问的目录。\n\n# `datalist`\
    \ 元素\n\n通过 `datalist` 元素，我们可以为任何表单输入控件添加一组预定义的选项。让我们来看看如何实现。首先，我们将为一家虚拟航空公司创建一个包含目的地选项的\
    \ `datalist`：\n\n```\n<datalist id=\"where_we_fly\">\n  <option>加纳，加纳</option>\n\
    \  <option>巴黎，法国</option>\n  <option>墨尔本，澳大利亚</option>\n  <option>利马，秘鲁</option>\n\
    \  <option>洛杉矶，美国</option>\n  <option>吉隆坡，马来西亚</option>\n</datalist>\n```\n\n\
    现在我们可以使用 `list` 属性将其与 `input` 字段关联。\n\n```\n<p>\n  <label for=\"destination\"\
    >你想去哪里？</label>\n  <input type=\"text\" name=\"destination\" id=\"destination\"\
    \ value=\"\"\n  list=\"where_we_fly\">\n</p>\n```\n\n在支持 `datalist` 元素的浏览器中，上述代码会将预定义的选项列表与\
    \ `input` 元素关联。当用户输入文本时，匹配的项目将显示在字段下方的列表中，如图 4.3](#ch04.html_datalist \"Figure\
    \ 4.3. datalist in IE\")所示。\n\n![IE 中的 datalist](img/datalistinie.png)\n\n图 4.3.\
    \ IE 中的 datalist\n\n在不支持 `datalist` 的浏览器中，文本输入字段将正常工作。尽管理论上数据列表可以与其他输入类型关联，但并非所有浏览器都支持此功能。\n\
    \n### 其他输入类型\n\n在本章中我们已经讨论了几种类型，在本节中我们还将介绍另外几种。\n\n* `search`\n* `range`\n* `number`\n\
    * `color`\n* `datetime`\n* `datetime-local`\n* `date`\n* `month`\n* `week`\n*\
    \ `time`\n\n除了 `range` 之外，可以通过测试 `type` 属性来确定浏览器是否支持某种类型。如果浏览器不支持 `range`，则 `type`\
    \ 属性将默认为 `text`。例如，考虑以下范围输入：\n\n```\n<input type=\"range\" value=\"\" id=\"slider\"\
    >\n```\n\n我们可以使用以下 JavaScript 代码测试浏览器支持情况：\n\n```javascript\nvar hasRange = function(\
    \ elID ){\n  return document.getElementById( el ID ).type == 'range';\n}\n```\n\
    \n在不支持 `range` 的浏览器中，上述函数将返回 `false`。否则，它将返回 `true`。像 [Modernizr](http://modernizr.com/)\
    \ 这样的库会让检查变得更容易。\n\n#### input=\"search\"\n\n在大多数情况下，`search` 的工作方式类似于 `text`\
    \ 输入类型。它仅仅提供了一种在视觉上与 `text` 框有所不同的类型。例如，在 Safari、Chrome 和 Mac 上的 Opera 15 中，搜索字段具有圆角。\n\
    \n![Safari 中的搜索输入类型](img/searchtypesafari.png)\n\n图 4.4. Safari 中的搜索输入类型\n\n####\
    \ input=\"range\"\n\n`range` 输入类型为用户提供了一个滑块控件，适用于上下边界之间的近似值输入。默认情况下，它是水平控件，如图\
    \ 4.5](#ch04.html_range \"Figure 4.5. The range input type\")所示。然而，通过一些 CSS (`transform:\
    \ rotate(-90deg)`)，你也可以垂直显示范围输入。\n\n![Firefox 中的范围输入类型](img/inputtyperangefirefox.png)\n\
    \n图 4.5. 范围输入类型\n\n默认情况下，范围类型的上下边界是 0 和 100。通过设置 `min` 和 `max` 属性可以更改此。你还可以像下面这样使用\
    \ `step` 属性来控制滑块位置的平滑度和精度：\n\n```\n<input type=\"range\" value=\"\" min=\"0\"\
    \ max=\"100\" step=\"10\">\n```\n\n每当用户移动此范围输入控件上的滑块时，范围将在 0 到 100 之间增加或减少 10。你还可以通过将\
    \ `datalist` 元素与 `range` 输入关联来控制精度。在支持的浏览器中，每个选项将沿范围宽度渲染为一个“缺口”——到目前为止，Chrome\
    \ 和 Opera 15 支持此功能。\n\n遗憾的是，Internet Explorer 9 及旧版本、以及 Firefox 22 及旧版本不支持 range。在这些浏览器中，表单控件将是文本框而不是范围元素。\n\
    \n"
