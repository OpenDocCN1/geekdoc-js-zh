  trans: "\n\n这里是适用于不同服务器端语言的几种 WebSocket 实现。你可以根据你喜欢的语言选择相应的库：\n\n* PHP: [Ratchet](http://socketo.me/)\n\
    * Node.js: [Socket.IO](https://github.com/learnboost/socket.io)\n* Java: [jWebSocket](http://jwebsocket.org/)\n\
    \n关于服务器端库的完整概述，[Andrea Faulds 维护了一份详细列表。](http://ajf.me/websocket/#libs)\n\n在本短书中，详细讨论这些库中的每一个都是超出范围范围的。但无论采用哪种实现方式，它们都提供了一个简单的\
    \ API，你可以通过它与客户端进行交互。例如，它们都提供了一个处理函数来接收来自浏览器的消息，你也可以与客户端进行回传。我鼓励你为你喜爱的语言找一个库并尝试运行一下。\n\
    \n我在 SitePoint.com 上写了一篇[关于 WebSockets 的详细教程](http://www.sitepoint.com/introduction-to-the-html5-websockets-api/)。在那个教程中，我展示了如何使用\
    \ `jWebSocket` 实现一个启用 WebSockets 的服务器，并让其他人连接它。\n\n## 结论\n\n如果你想学习更多关于 WebSocket\
    \ API，以下资源值得查看：\n\n* [WebSocket API](http://dev.w3.org/html5/websockets/)\n* [Mozilla\
    \ Developer Network 上的 WebSocket 教程](https://developer.mozilla.org/en-US/docs/WebSockets)\n\
    * [WebSocket 演示应用](http://www.websocket.org/demos.html)\n\n这里是该 API 的一些用例：\n\n\
    * 创建简单的在线聊天应用程序\n* 当服务器上有新更新时更新页面并进行回传\n* 创建一个具有多个用户的 HTML5 游戏。\n\n# 第 31 章：API：跨文档消息传递\
    \ API (Cross-document Messaging API)\n\nHTML5 中的 `Cross-document Messaging API`\
    \ 使两个文档能够相互交互，而无需直接暴露 DOM。想象一下以下场景：你的网页中有一个由不同网站托管的 iframe。如果你尝试从该 iframe 中读取某些数据，浏览器会非常不悦并可能抛出安全异常。它防止\
    \ DOM 被第三方文档操作，从而阻止了潜在的攻击，如 [CSRF](http://en.wikipedia.org/wiki/Cross-site_request_for_gery)\
    \ 或 [跨站脚本 (XSS)。](http://en.wikipedia.org/wiki/Cross-site_scripting) 但 `Cross-document\
    \ Messaging API` 从不直接暴露 DOM。相反，它允许 HTML 页面通过 `message` 事件向其他文档发送消息。\n\n`Cross-document\
    \ Messaging API` 对于创建组件并允许它们与第三方网站通信非常有用。例如，假设你有一个提供广告的页面，并且允许用户将此页面嵌入他们的网站中。在这种情况下，你可以通过\
    \ `Cross-document Messaging API` 让用户个性化广告或修改广告类型。客户端可以向你的页面发送消息，你也可以接收这些消息。\n\n\
    ## JavaScript API\n\n`Cross-document Messaging API` 围绕一个单一方法：`window.postMessage()`。正如其名，该方法允许你向不同的页面发送消息。当该方法被调用时，接收端文档侧会触发一个\
    \ `message` 事件。在继续之前，理解 `message` 事件的属性至关重要。我们感兴趣的有三个属性：\n\n1. `data`: 它持有了正在发送的消息。你已经在之前的章节中玩过它了（记得在\
    \ SSE 中调用 `event.data` 吗？）。\n2. `origin`: 该属性指示发送者文档的源；即协议（方案）以及域名和端口，类似于 `http://example.com:80`。每当你收到消息时，你应该**始终、始终**检查该消息是否来自受信任的源。我将在下一节中解释如何这样做。\n\
    3. `source`: 这是对发送者窗口的引用。在接收跨文档消息后，如果你想向发送者发送某些内容，将使用这个属性。\n\n## 基本用法\n\n你通过调用\
    \ `window.postMessage()` 向另一个文档发送消息。此函数接受两个参数：\n\n* `message`: 你想要发送的实际消息\n* `targetOrigin`:\
    \ 一个指示目标源的简单字符串——一个额外的安全特性（我将在下一节解释它有什么用）\n\n代码看起来如下：\n\n```\ntargetWindow.postMessage(message,\
    \ targetOrigin);\n```\n\n你应该注意，`targetWindow` 指向你想要发送消息的 `window`。它可能是你刚刚通过调用\
    \ `window.open()` 打开的句，，也可以是某些 iframe 的 `contentWindow` 属性。\n\n### 注意：对已打开窗口的引用\n\
    \n`window.open('a URL')` 返回一个已打开窗口的引用。你可以随时在上面调用 `postMessage()`。\n\n让我们构建一个非常简单的示例。假设我们有一个父页面，里面有一个\
    \ iframe。该 iframe 的 `src` 指向一个第三方网站，该网站为我们提供一张随机图片。\n\n这是父页面中 iframe 引用的页面：\n\n\
    *child.html*\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>提供随机图片的页面</title>\n\
    </head>\n<body>\n  <div id=\"container\">\n    <img\n      src=\"http://randomimage.setgetgo.com/php?key=232323\"\
    \n      id=\"image\"\n    />\n  </div>\n</body>\n</html>\n```\n\n到目前为止一切顺利！现在让我们看看我们的父页面：\n\
    \n*parent.html*\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>父文档</title>\n\
    </head>\n<body>\n    <iframe\n      src=\"child.html\"\n      height=\"500\" width=\"\
    500\">\n    </iframe>\n</body>\n</html>\n```\n\n当你打开父页面时，你可以看到来自 `child.html`\
    \ 的图片。目前，`parent.html` 和 `child.html` 都在同一个服务器（`localhost`）上。但理想情况下它们应该在不同的服务器上。\n\
    \n但我们不想一直给用户显示静态图片，而是刷新 iframe。如果我们通过点击父页面上的按钮让 `child.html` 刷新图片就好了。\n\n让我们从向父页面添加一个按钮开始。我们编写一个响应点击事件并向\
    \ `child.html` 发送消息的函数。\n\n*parent.html*\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>父文档</title>\n</head>\n<body>\n    <iframe\n      src=\"child.html\"\
    \n      height=\"500\" width=\"500\">\n    </iframe>\n    <br/>\n    <button id=\"\
    reloadbtn\">刷新</button>\n\n    <script>\n      document.getElementById(\"reloadbtn\"\
    ).\n      addEventListener(\"click\", reload, false);\n\n      // 刷新处理器\n    \
    \  function reload(e) {\n        // 支持跨文档消息吗？\n        if (window.postMessage)\
    \ {\n            document.getElementById('iframe').\n            contentWindow.postMessage(\n\
    \              Math.random()*1000, 'http://localhost'\n            );\n      \
    \  }\n        else {\n            console.log('不支持 postMessage()');\n        }\n\
    \      }\n    </script>\n\n  </body>\n</html>\n```\n\n### 注意：使用 Modernizr\n\n\
    如果你使用 `Modernizr` 来检查浏览器兼容性，请检查 `Modernizr.postmessage` 属性。\n\n"
- fmt: "\n### Tip: targetOrigin\n\nThink of `targetOrigin` as a way of telling the\
    \ browser to which origin the message can be sent. You can also pass `\"*\"` as\
    \ the `targetOrigin`. As you might have guessed, `*` is a wildcard that says the\
    \ message can be sent to documents from any origin. But using a wildcard means\
    \ loosening your security system by allowing the message to be sent to any origin.\
    \ I recommend passing the exact origin as the second argument to `postMessage()`\
    \ instead of the wildcard.\n\nNow we have to receive the message in `child.html`\
    \ and take appropriate action. Here’s the modified `child.html` this:\n\n`child.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>A page that provides random\
    \ image</title>\n</head>\n<body>\n\n  <div id=\"container\">\n    <img\n     \
    \ src=\"http://randomimage.setgetgo.com/get.php?key=2323232\"\n      id=\"image\"\
    \n    />\n  <div>\n\n  <script>\n    window.addEventListener('message', messageReceiver,\
    \ false);\n\n    function messageReceiver(event) {\n\n      // can the origin\
    \ can be trusted?\n      if (event.origin != 'http://localhost') return;\n\n \
    \     document.getElementById('image').src =\n      \"http://randomimage.setgetgo.com/get.php?key=\"\
    \ + event.data;\n\n      console.log(\n        'source=' + event.source +\n  \
    \      ', data=' + event.data +\n        ', origin=' + event.origin\n      );\n\
    \n    }\n  </script>\n\n</body>\n</html>\n```\n\nFirst, we attach a callback to\
    \ the `message` event. Whenever `parent.html` sends a message to `child.html`,\
    \ this callback will be executed. The first and most important step is to check\
    \ whether you are receiving messages from the intended origin. After adding an\
    \ event listener to the `message` event, you can receive messages from documents\
    \ of any origin. So, it’s recommended to always put a check inside your callback\
    \ to ensure that the message is coming from a trusted origin.\n\nNext, we retrieve\
    \ the message from `event.data`. This particular API that we’re using for random\
    \ images requires a different random number each time so that the generated image\
    \ will be a unique one. That’s why we’re generating a random number on a button\
    \ click (in `parent.html`) and passing that as a message to `child.html`. In `child.html`,\
    \ we simply construct a new image URL with the help of the random number and update\
    \ the image’s `src`. As a result, we can see a new image each time we click the\
    \ reload button from the main page.\n\n### Note: Sending a Message Back\n\nIf\
    \ you want to send a message back to `parent.html`, you can always use `event.source.postMessage()`\
    \ inside your event listener in `child.html`. Consequently, you’ll also need an\
    \ event handler in the parent page.\n\n## Detecting the Readiness of the Document\n\
    \nMost of the time, you’ll send messages to iframes embedded in your pages. But\
    \ many times, you may also need to open a new window from your page and post messages\
    \ to that. In this case, ensure that the opened window has fully loaded. Inside\
    \ the opened window, attach a callback to the `DOMContentLoaded` event, and in\
    \ that function send a message to the parent window indicating that the current\
    \ window has fully loaded.\n\n### Tip: Getting a Reference\n\nInside the `DOMContentLoaded`\
    \ event listener (in the opened window), you can get a reference to the window\
    \ by accessing `event.currentTarget.opener` and calling `postMessage()` on it\
    \ as usual. Tiffany Brown explains how to achieve this in [an excellent tutorial.](http://dev.opera.com/articles/view/window-postmessage-messagechannel/#whenisdocready)\n\
    \n## Conclusion\n\nThis was the overview of the Cross-document Messaging API.\
    \ By using this API, two cross-origin documents can securely exchange data. Because\
    \ the DOM is not directly exposed, it’s now possible for a page to directly manipulate\
    \ a third-party document.\n\nThe Cross-document Messaging API certainly gives\
    \ you more power. But, as you know, with great power comes great responsibility!\
    \ If you fail to use this API properly, you may end up exposing your website to\
    \ various security risks. So, as discussed in this chapter, you should be very,\
    \ very careful while receiving cross-document messages to avoid security risks.\
    \ Similarly, while sending messages with `window.postMessage()`, don’t use `*`\
    \ as `targetOrigin`. Instead, provide a single valid origin name.\n\nAlthough\
    \ it’s not possible to cover each and everything about the API in detail, this\
    \ chapter gives you a head start. You should now be able to experiment with different\
    \ things on your own. For further reading, I strongly recommend the following\
    \ resources:\n\n* [the Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/Web/API/Window.postMessage)\n\
    * [the W3C specification.](http://www.w3.org/TR/webmessaging/)\n\nSo, this brings\
    \ us to the end of our tour through five of the most important and useful HTML5\
    \ APIs. I hope you've found this book a useful introduction to these powerful\
    \ technologies. Do take a look at the sample project ideas that I have shared\
    \ in the end of each chapter; I also encourage you to get creative and think of\
    \ some other good use cases that can be implemented.\n\nHappy coding!\n"
