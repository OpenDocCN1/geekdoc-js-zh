  trans: "\n请注意未加引号的属性值。对于单个单词的数值，不加引号是可以的。然而，由空格分隔的值列表必须包含在引号内。否则，解析器将把第一个值解释为属性的值，而将后续值视为空属性。请考虑以下代码段：\n\
    \n```\n<code class=php highlightsyntax><?php echo 'Hello!'; ?></code>\n```\n\n\
    由于 `class` 属性的两个值都没有加引号，浏览器的解释方式如下：\n\n```\n<code class=\"php\" highlightsyntax><?php\
    \ echo 'Hello!'; ?></code>\n```\n\n只有 `php` 被识别为类名，而我们无意中为元素添加了一个空的 `highlightsyntax`\
    \ 属性。将 `class=php highlightsyntax` 改为 `class=\"php highlightsyntax\"`（或单引号的 `class='php\
    \ highlightsyntax'`）可以确保两个类属性值都被视为类值。\n\n### 简化的 HTML5 文档\n\n根据 HTML 的规则——对于 HTML\
    \ 4 也是如此——某些元素不需要开始标签或结束标签。这些元素是隐式的。即使你在标记语言中省略了它们，浏览器的行为也像它们被包含在内一样。`body` 元素就是其中一个元素。理论上，我们可以重写\
    \ `hi.html` 示例使其像这样：\n\n```\n<!DOCTYPE html>\n<head>\n  <meta charset=utf-8>\n\
    \  <title>Hi</title>\n  <p>Hi\n```\n\n当浏览器创建文档节点树时，它会为我们添加一个 `body` 元素。\n\n仅仅因为你*可以*跳过结束标签并不意味着你*应该*这样做。无论哪种，浏览器都需要生成\
    \ DOM。关闭元素可以减少浏览器错误解析你预期的 DOM 的概率。平衡开始和结束标签使得错误更容易发现和修复，特别是当你使用带有语法高亮的文本编辑器时。如果你在大团队中或在\
    \ `CMS`（内容管理系统）中工作，使用开始和结束标签还可以增加你的 HTML 代码段与同事代码兼容的概率。在本书的剩余部分，即使在可选的情况下，我们也会使用开始和结束标签。\n\
    \n### 注意：开始和结束标签\n\n要了解哪些元素需要开始和结束标签，请参阅世界维网联盟（W3C）的指南 [HTML：标记语言（HTML 语言参考）](http://www.w3.org/TR/html-markup/)。W3C\
    \ 还管理包含这些信息的 [Web Platform Docs](http://docs.webplatform.org/wiki/Main_Page)。\n\
    \n### \"XHTML5\": HTML5 的 XML 语法\n\nHTML5 也可以使用更严格的类 XML 语法来编写。你可能在第 1 章 中记得过，XHTML\
    \ 1.0 是“将 HTML 4 重新制定为 XML 1.0 应用”。对于所谓的“XHTML5”，这并不完全。XHTML5 最好理解为使用 XML 的语法规则编写和解析，并使用\
    \ `Content-type: application/xml+xhtml` 响应头进行服务的 HTML5。\n\n以下规则适用于 \"XHTML5\"\
    ：\n\n* 所有元素必须有开始标签。\n* 带有开始标签的非空元素必须有结束标签（例如 `p` 和 `li`）。\n* 任何元素都可以使用 `/>` 进行“自闭合”。\n\
    * 标签和属性区分大小写，通常使用小写。\n* 属性值*必须*包含在引号内。\n* 禁止使用空属性（`checked` 必须是 `checked=\"checked\"\
    ` 或 `checked=\"true\"`）。\n* 特殊字符必须使用字符实体进行转义。\n\n我们的 `html` 开始标签还需要一个 `xmlns`（XML\
    \ 命名空间）属性。如果我们重写上面的文档以使用 XML 语法，它看起来像下面的示例所示：\n\n```\n<!DOCTYPE html>\n  <html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n      <meta charset=\"\
    utf-8\" />\n      <title>Hi</title>\n    </head>\n    <body>\n      <p>\n    \
    \    <img src=\"flower.jpg\" alt=\"Flower\" />\n        这不是一朵非常漂亮的花吗？\n      </p>\n\
    \      <script src=\"foo.js\" />\n    </body>\n</</html>\n```\n\n在这里，我们通过 `xmlns`\
    \ 属性添加了 XML 命名空间，以让浏览器知道我们正在使用更严格的语法。我们还对空或空元素 `meta` 和 `img` 的标签进行了自闭合。根据 XML\
    \ 和 XHTML 的规则，所有元素必须通过结束标签或通过空格、斜杠和右尖角（`/>`）自闭合来关闭。\n\n在这个示例中，我们也自闭合了 `script`\
    \ 标签。我们也可以像处理其他元素一样使用普通的 `</script>` 标签。`script` 元素有点特殊。你可以通过将脚本放在 `script` 开始和结束标签之间来在文档中嵌入脚本。当你这样做时，你*必须*包含一个结束标签。\n\
    \n然而，你也可以使用 `script` 标签和 `src` 属性链接到外部脚本文件。如果你这样做，并将页面作为 `text/html` 发送，你*必须*使用闭合\
    \ `</script>` 标签。如果你将页面作为 `application/xml+xhtml` 发送，你也可以使用自闭合语法。\n\n不要忘记：为了让浏览器按照\
    \ XML/XHTML 规则解析此文档，我们必须从服务器发送带有 `Content-type: application/xml+xhtml` 响应头的文档。事实上，包含此响应头部即使缺少\
    \ DOCTYPE，也会触发符合标准的浏览器中的 XHTML5 解析。\n\n### 注意：配置你的服务器\n\n为了让你的 Web 服务器或应用程序发送\
    \ `Content-type: application/xml+xhtml` 响应头，它必须配置为如此操作。如果你使用 Web 托管，很有可能你的 Web\
    \ 托管已经为 .xhtml 扩展的文件此类设置。在这里，你只需要将 `hi.html` 重命名为 `hi.xhtml`。如果不起，请查阅你的 Web 服务器文档。\n\
    \n你可能已经意识到，XML 解析规则更加挑剔。使用 `text/html` MIME 类型及其宽松的 HTML 语法要简单得多。\n\n# 第 3 章\n\
    \n## 基础：文档结构\n\nHTML5 增加了几个元素，提供了将单个文档拆分为多个内容块的方法——内容可以是相关的，也可以是独立的。这些元素为我们的标记增加了语义丰富性，并使跨媒体和设备重用文档变得更容易。\n\
    \n我们将通过一个虚构的新闻网站查看这些元素以及它们的相互作用：*HTML5 新闻*，如图[ch03.html_newsparticle \"图 3.1.\
    \ HTML5 新闻\"]所示。![HTML5 新闻](img/html5newsparticle.png)\n\n图 3.1. HTML5 新闻\n\n\
    我们的新闻页面从页眉和主导航栏开始。在之前的 HTML 版本中，我们可能会这样标记：\n\n```\n<div id=\"header\">\n  <h1>HTML5\
    \ <i>News-Press</i></h1>\n  <h2>所有适合链接的新</h2>\n  <ul id=\"nav\">\n    <li><a href=\"\
    #\">国际</a></li>\n    <li><a href=\"#\">国内</a></li>\n    <li><a href=\"#\">大区</a></li>\n\
    \    <li><a href=\"#\">体育</a></li>\n    <li><a href=\"#\">艺术&amp; 娱乐</a> <!--\
    \ 这里的 &amp; 代表 & -->\n  </ul>\n</div>\n```\n\n我们的页面以页脚元素结束。再次使用 HTML 4，我们的标记可能如下：\n\
    \n```\n<div id=\"footer\">\n  <ul>\n    <li><a href=\"#\">联系我们</a></li>\n    <li><a\
    \ href=\"#\">使用条款</a></li>\n    <li><a href=\"#\">隐私政策</a></li>\n  </ul>\n  <p>&copy;\
    \ 2013 &copy; HTML5 新闻. 版权所有。</p>\n</div>\n```\n\n然而，HTML5 专门为此种目的增加了元素：`header`、`nav`\
    \ 和 `footer`。\n\n`header` 元素作为文档段内容的页眉。`footer` 元素作为文档段的页脚。注意，我说的是*段*而不是*文档*或*页面*。某些元素被视为分节元素。它们将文档分为若干部分或块。这些元素之一当然是新的\
    \ `section` 元素。其他分节元素包括 `body`、`article`、`aside`，以及 `nav`。\n"
- fmt: "\n```html\n<header>\n  <h1>HTML5 News-Press</h1>\n  <h2>All the news that's\
    \ fit to link</h2>\n  <nav>\n    <ul>\n      <li><a href=\"#\">World</a></li>\n\
    \      <li><a href=\"#\">National</a></li>\n      <li><a href=\"#\">Metro area</a></li>\n\
    \      <li><a href=\"#\">Sports</a></li>\n      <li><a href=\"#\">Arts &amp; Entertainment</a></li>\n\
    \    </ul>\n  </nav>\n</header>\n```\n\nHere, we’ve wrapped our masthead and navigation\
    \ in `header` tags. We’ve also swapped our `id=\"nav\"` attribute and value for\
    \ the `nav` element. Let’s re-write our footer using HTML5’s `footer` element.\n\
    \n```html\n<footer>\n  <ul>\n    <li><a href=\"#\">Contact Us</a></li>\n    <li><a\
    \ href=\"#\">Terms of Use</a></li>\n    <li><a href=\"#\">Privacy Policy</a></li>\n\
    \  </ul>\n  <p>No copyright 2013 HTML5 News-Press.</p>\n</footer>\n```\n\nHere\
    \ we’ve simply swapped `<div id=\"footer\">` for `<footer>`. Our document bones\
    \ are in place. Let’s add some flesh.\n\n## The `article` Element\n\nAs defined\
    \ by the HTML5 specification, the `article` element:\n\n> \"[R]epresents a complete,\
    \ or self-contained, composition in a document, page, application, or site and\
    \ that is, in principle, independently distributable or reusable, e.g. in syndication.\"\
    \n\nMagazine articles and blog posts are obvious examples of when an `article`\
    \ element would be semantically appropriate. But you could also use it for blog\
    \ comments. This element is appropriate for any almost content item that could\
    \ be reused.\n\nWe can replace our `<div id=\"article\">` start and end tags with\
    \ `article` tags.\n\n```html\n<article>\n  <h1>Sky fall imminent says young chicken\
    \ leader</h1>\n\n  <p class=\"byline\">\n    <b class=\"reporter\">Foxy Loxy</b>\n\
    \    <i class=\"employment-status\">Staff Writer</i>\n  </p>\n\n  <div class=\"\
    aside\">\n    <h2>About Henny Penny</h2>\n\n    <dl>\n      <dt>Age</dt>\n   \
    \   <dd>32</dd>\n\n      <dt>Occupation</dt>\n      <dd>President, National Organization\
    \ of Chickens</dd>\n\n      <dt>Education</dt>\n      <dd>B.A., Chicken Studies,\
    \ Farmer University</dd>\n      <dd>J.D., University of Cluckland</dd>\n    </dl>\n\
    \n    <p>\n      Penny joined the National Organization of Chickens in 2002\n\
    \      as a staff lobbyist after short, but effective career in the Farmlandia\
    \ senate. Penny rose through the organization's ranks, serving as secretary, then\
    \ vice-president before being elected president by the group's members in 2011.\n\
    \    </p>\n\n    <p>\n      The National Organization of Chickens is an advocacy\
    \ group focused on environmental justice for chickens.\n    </p>\n  </div>\n\n\
    \  <p>\n    LONDON -- Henny Penny, young leader of the National Organization of\
    \ Chickens announced that the sky will fall within the next week. Opponents criticize\
    \ Penny, suggesting that acorns are the more likely threat.\n  </p>\n\n  <p>\n\
    \    Phasellus viverra faucibus arcu ullamcorper sodales. Curabitur tincidunt\
    \ est in imperdiet ultrices. Sed dignissim felis a nec dignissim, nec cursus sapien\
    \ egestas.\n  </p>\n\n  <div id=\"article-meta\">\n    <p class=\"reporter-contact\"\
    >You may reach reporter Foxy Loxy via email at foxy.loxy@html5newspress.com</p>\n\
    \    <p class=\"contributor\">Staff writer Turkey Lurkey contributed to this report.</p>\n\
    \    <p class=\"pubdate\">Published: <time>2013-07-11T09:00:00-07:00</time>.</p>\n\
    \  </div>\n</article>\n```\n\nThe `article` element is an example of sectioning\
    \ content, which means it may contain a header and a footer. If we think about\
    \ it, our `<div id=\"article-meta\">` could be considered a footer for our `article`\
    \ element. How about we swap our `div` element tags for `footer` tags?\n\n```html\n\
    <footer id=\"article-meta\">\n  <p class=\"reporter-contact\">You may reach reporter\
    \ Foxy Loxy via email at foxy.loxy@html5newspress.com</p>\n  <p class=\"contributor\"\
    >Staff writer Turkey Lurkey contributed to this report.</p>\n  <p class=\"pubdate\"\
    >Published: <time>2013-07-11T09:00:00-07:00</time>.</p>\n</footer>\n```\n\nWe\
    \ are keeping our `id` attribute intact, however. This makes it easier to distinguish\
    \ from other `footer` elements on the page.\n"
