    ```\n\n在这里，我们简单地将 `<div id=\"footer\">` 替换为 `<footer>`。文档的骨架已经就绪。让我们来添加一些血肉。\n\
    \n## `article` 元素\n\n根据 HTML5 规范定义，`article` 元素：\n\n> “[表]表示文档、页面、应用程序或网站中完整或自包含的内容，在原则上，该内容是可以独立分发或重用的，例如在分发中中使用。”\n\
    \n杂志文章和博客帖子是使用 `article` 元素在语义上恰当的例子。但你也可以将其用于博客评论。该元素适用于任何几乎可以重用的内容条目。\n\n我们可以将\
    \ `<div id=\"article\">` 的起始和结束标签替换为 `article` 标签。\n\n```html\n<article>\n  <h1>年轻鸡类领袖称天将降临</h1>\n\
    \n  <p class=\"byline\">\n    <b class=\"reporter\">Foxy Loxy</b>\n    <i class=\"\
    employment-status\">全职记者</i>\n  </p>\n\n  <div class=\"aside\">\n    <h2>关于 Henny\
    \ Penny</h2>\n\n    <dl>\n      <dt>年龄</dt>\n      <dd>32</dd>\n\n      <dt>职业</dt>\n\
    \      <dd>国家鸡类组织主席</dd>\n\n      <dt>教育</dt>\n      <dd>文学士学位，鸡类研究，农场大学</dd>\n\
    \      <dd>法学博士，克克兰大学</dd>\n    </dl>\n\n    <p>\n      Penny 在 Farmlandia 参议院度过短暂但有效的职业生涯后，于\
    \ 2002 年作为全职游说加入了国家鸡类组织。Penny 在组织内部晋升，曾担任秘书，然后是副主席，最后在 2011 年被团体成员选为主席。\n    </p>\n\
    \n    <p>\n      国家鸡类组织是一个关注鸡类环境正义的倡导团体。\n    </p>\n  </div>\n\n  <p>\n    伦敦\
    \ -- 国家鸡类组织的年轻领袖 Henny Penny 宣布，天空将在下周内崩塌。反对者批评了 Penny，认为橡果更可能是威胁。\n  </p>\n\n\
    \  <p>\n    Phasellus viverra faucibus arcu ullamcorper sodales. Curabitur tincidunt\
    \ est in imperdiet ultrices. Sed dignissim felis a nec dignissim, nec cursus sapien\
    \ egestas.\n  </p>\n\n  <div id=\"article-meta\">\n    <p class=\"reporter-contact\"\
    >您可以通过电子邮件 foxy.loxy@html5newspress.com 联系记者 Foxy Loxy</p>\n    <p class=\"contributor\"\
    >全职记者 Turkey Lurkey 对此报告做出了贡献。</p>\n    <p class=\"pubdate\">发布日期：<time>2013-07-11T09:00:00-07:00</time>.</p>\n\
    \  </div>\n</article>\n```\n\n`article` 元素是分节内容的示例，这意味着它可能包含页眉和页脚。如果我们仔细考虑，我们的\
    \ `<div id=\"article-meta\">` 可以被视为 `article` 元素的页脚。我们把把 `div` 元素标签交换为 `footer`\
    \ 标签怎么样？\n\n```html\n<footer id=\"article-meta\">\n  <p class=\"reporter-contact\"\
    >您可以通过电子邮件 foxy.loxy@html5newspress.com 联系记者 Foxy Loxy</p>\n  <p class=\"contributor\"\
    >全职记者 Turkey Lurkey 对此报告做出了贡献。</p>\n  <p class=\"pubdate\">发布日期：<time>2013-07-11T09:00:00-07:00</time>.</p>\n\
    </footer>\n```\n\n然而，我们保留了 `id` 属性。这使得它更容易与页面上的其他 `footer` 元素区分开来。\n\n"
- fmt: "\nThe point of these new elements is to have a standardized way to describe\
    \ document structures. HTML is, at heart, a language for exchanging and repurposing\
    \ documents. Using these structural elements means that the same document can\
    \ be published as a web page and also syndicated for e-book readers without having\
    \ to sort through a jumble of arbitrary `div` elements and `id` attributes.\n\n\
    ## The `section` Element\n\nHTML5 also introduces the `section` element, which\
    \ is used to define segments of a document that are neither a header, footer,\
    \ navigation, article, or aside. It’s more specific than our old friend, the `div`\
    \ element, but more generic than `article`.\n\nLet’s use the `section` element\
    \ to mark up the *HTML5 News-Press* home page, shown in [Figure 3.2](#ch03.html_homepage\
    \ \"Figure 3.2. HTML5 News-Press home page\").\n\n![HTML5 News-Press home page](figures/html5newspress.png)\n\
    \nFigure 3.2. HTML5 News-Press home page\n\nHere we have three sections of news\
    \ stories: \"Top Stories,\" \"Sports,\" and \"Business.\" In HTML 4, the `div`\
    \ elements is the clear choice to define these sections because it’s our only\
    \ choice. But in HTML5, we have the somewhat more descriptive `section` element.\n\
    \n```\n<section id=\"topstories\">\n  <h1>Top stories</h1>\n\n  <ul>\n    <li><a\
    \ href=\"#\">Sky fall imminent says young chicken \n    ↵leader</a></li>\n   \
    \ <li><a href=\"#\">Wolf blows down homes of sticks, straw</a></li>\n    <li><a\
    \ href=\"#\">Children lost after breadcrumb trail goes \n    ↵missing found safe</a></li>\n\
    \    <li><a href=\"#\">Cow jumps over moon, witnesses \n    ↵astounded</a></li>\n\
    \  </ul>\n\n  <footer>\n    <p><a href=\"#\" class=\"mlink\">More news</a></p>\n\
    \  </footer>\n</section>\n\n<section id=\"sports\">\n  <h1>Sports</h1>\n\n  <<ul>\n\
    \    <li><a href=\"#\">David beats Goliath in upset</a></li>\n    <li><a href=\"\
    #\">Goods top Evils 3-2</a></li>\n    <li><a href=\"#\">Local swimmer qualifies\
    \ for 2016 \n    ↵Olympics</a></li>\n    <li><a href=\"#\">Woonsocket Little League\
    \ team reaches \n    ↵semis</a></li>\n  </ul>\n\n  <footer>\n    <p><a href=\"\
    #\" class=\"mlink\">More sports</a></p>\n  </footer>\n</section>\n\n<section id=\"\
    business\">\n  <h1>Business</h1>\n  <<ul>\n    <li><a href=\"#\">BigWidgets, Ltd.\
    \ expansion to create 3,000 \n    ↵jobs</a></li>\n    <li><a href=\"#\">U.S. dollar,\
    \ Euro achieve parity</a></li>\n    <li><a href=\"#\">GiantAirline and Air Humongous\
    \ to merge</a></li>\n    <li><a href=\"#\">WorldDomination Banc deemed 'too big\
    \ to \n    ↵fail'</a></li>\n  </ul>\n\n  <footer>\n    <p><a href=\"#\" class=\"\
    mlink\">More business</a></p>\n  </footer>\n</section>\n```\n\n### `div` Versus\
    \ `section`\n\nWhile these new sectioning elements give us better semantics and\
    \ meaning, they also bring a touch of confusion. One question you may be asking\
    \ is: \"Is it still okay to use the `div` element?\n\nThe short answer is \"Yes.\"\
    \ After all, `div` is still a valid HTML5 element. But `div` has little semantic\
    \ value. It doesn’t tell us anything about what it contains, so use it for those\
    \ rare instances when another semantically-relevant tag doesn’t exist. For example,\
    \ you may find that you need to add an extra element as a \"wrapper\" to ease\
    \ styling. Or perhaps you want to group several French-language elements within\
    \ an English-language document. Enclosing those elements with `<div lang=\"fr\"\
    >` and `</div>` is certainly appropriate. It most other cases, it’s better to\
    \ use `section`, `header`, `nav`, `footer`, `article` or `aside`.\n\n## Other\
    \ Document Elements\n\nNew sectioning elements aren’t the only new document-related\
    \ elements introduced in HTML5. In this chapter, we’ll look at the following elements:\n\
    \n*   `figure` and `figcaption` for defining figures, charts, and diagrams\n*\
    \   `main` which explicitly defines the predominant portion of a document’s content\n\
    \n### `figure` and `figcaption`\n\nIf a document was accompanied by a chart or\
    \ diagram, in HTML 4, we might have used a combination of `div` and `p` elements\
    \ to mark it up as shown below.\n\n```\n<div class=\"graph\" id=\"figure1\">\n\
    \  <img src=\"graph.jpg\" alt=\"Price of chocolate since 2008\">\n  <p class=\"\
    caption\">Figure 1: Chocolate has increased in price \n  ↵by 200% since 2008.</p>\n\
    </div>\n```\n\nThat’s an acceptable way to do it. But what happens when we want\
    \ to read it on our fancy-pants ereader that displays HTML documents using a book-style\
    \ layout? Using `<div class=\"chart\">` doesn’t tell us much about what this chunk\
    \ of information is and how it should be displayed.\n\nIn this case, we should\
    \ use the `figure` element. It gives us a way to mark up charts and captions and\
    \ make them independent of document flow. How about we modify our markup a bit?\n\
    \n```\n<figure class=\"graph\" id=\"figure1\">\n  <img src=\"graph.jpg\" alt=\"\
    Price of chocolate since 2008\">\n  <p class=\"caption\">Figure 1: Chocolate has\
    \ increased in price \n  ↵by 200% since 2008.</p>\n</figure>\n```\n\nNow our e-reader\
    \ knows this is a chart, and can display it in a suitable way. We’ve kept the\
    \ class and ID attributes. The former comes in handy for CSS styling — perhaps\
    \ we want to display graphs differently than diagrams. The latter makes it easy\
    \ to link to our figure.\n\nWe still have `<p class=\"caption\">` though, don’t\
    \ we? How about we use the `figcaption` element instead? `figcaption` serves as\
    \ a caption or legend for its sibling content. It isn’t required, but if included,\
    \ `figcaption` needs to be either the first child or last child of a `figure`\
    \ element. Let’s change our markup once more:\n\n```\n<figure class=\"graph\"\
    \ id=\"figure1\">\n  <img src=\"graph.jpg\" alt=\"Price of chocolate since 2008\"\
    >\n  <figcaption>Figure 1: Chocolate has increased in price \n  ↵by 200% since\
    \ 2008.</figcaption>\n</figure>\n```\n\n### `main` Element\n\nThe `main` element\
    \ is one of the newest elements in HTML5. It actually isn’t in the 2011 version\
    \ of the specification published by the World Wide Web Consortium, but it is a\
    \ part of the HTML 5.1 specification.\n\nUnsurprisingly, `main` should be used\
    \ to clarify the main part of a document or application. By \"main part,\" of\
    \ a document, we mean content that:\n\n*   is unique to the document or application\n\
    *   doesn’t include elements, such as a global header or footer, that are shared\
    \ across a site\n\nTo date, only Chrome 26+, Firefox 21+, and Opera 15+ support\
    \ the `main` element. Support should come to Internet Explorer and Safari in a\
    \ future release.\n\nWhat’s the use case for `main`? Some browsers, such as Safari\
    \ and Firefox for Android, offer a \"reader mode\" that strips away headers, footers,\
    \ and ads. These browsers currently use heuristics—an educated guess—to determine\
    \ the main content of a document. Using `main` makes it clear to the browser which\
    \ segment of the page it should focus on. Browsers can also use the `main` element\
    \ as a hook for accessibility features, such the ability to skip navigation.\n\
    \nLet’s take one last look at our news article markup, this time including the\
    \ `main` element.\n"
