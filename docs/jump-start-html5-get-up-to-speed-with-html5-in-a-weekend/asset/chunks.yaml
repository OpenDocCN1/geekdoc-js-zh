    \ or [Lighttpd](http://www.lighttpd.net/) are all open-source server packages\
    \ available for Windows, Mac OS X, and Linux. Mac OS X users can also try [MAMP](http://www.mamp.info/en/index.html),\
    \ which bundles MySQL, Apache, and PHP into one easy-to-use package. Windows users\
    \ can try [WAMP](http://www.wampserver.com/en/) or [XAMPP](http://www.apachefriends.org/index.html),\
    \ which are similar packages for that operating system. Your operating system\
    \ may also have a web server installed by default. Check its documentation if\
    \ you’re unsure.\n\n## Do You Want to Keep Learning?\n\nYou can now get unlimited\
