    \ 宣布，天空将在下周内崩塌。\n        反对者批评了 Penny，认为橡果才是更有可能的威胁。\n      </p>\n\n      <p>\n\
    \        Phasellus viverra faucibus arcu ullamcorper sodales. \n        Curabitur\
    \ tincidunt est in imperdiet ultrices. Sed \n        dignisim felis a neque dignissim,\
    \ nec cursus sapien \n        egestas.\n      </p>\n\n    </article>\n  </main>\n\
    \n  <footer>\n    <ul>\n      <li><a href=\"#\">联系我们</a></li>\n      <li><a href=\"\
    #\">使用条款</a></li>\n      <li><a href=\"#\">隐私政策</a></li>\n    </ul>\n    <p>2013\
    \ HTML5 新闻报 版权所有。</p>\n  </footer>\n\n</div>\n</body>\n</html>\n```\n\n（注：HTML\
    \ 代码中的文本内容已翻译）\n\n现在我们有了一份更具访问性、更易于各种浏览器读取和展示的文档。\n\n# 第 4 章\n\n## 基础：HTML5 表单\n\
    \nHTML5 表单相比之前的 HTML 版本有了质的飞跃。我们现在拥有了六种新的输入状态或类型，例如 `range` 和 `url`；我们有了新的属性可以让我们要求某些字段必填，或指定特定的格式；我们有了一个\
    \ API 可以让我们约束并验证输入；最后，我们有了新的表单元素，如 `datalist`，它让我们能够在无需重量型 JavaScript 库或插件的情况下创建吸引人的用户界面。\n\
    \n遗憾的是，并不是所有浏览器都支持所有这些功能。目前，我们仍然需要使用 JavaScript 库和 [polyfills](http://remysharp.com/2010/10/08/what-is-a-polyfill/)（可下载的代码，提供了\
    \ Web 浏览器未内置的功能）作为回退策略。\n\n理解 HTML5 表单最好的方法是动手构建一个。让我们尝试构建一个表单，为上一章节的 HTML5 新闻报网站收集故事稿建议。我们需要通过表单收集以下信息：\n\
    \n*   姓名\n*   居住城市\n*   电子邮件地址\n*   电话号码\n*   可以进一步了解更多信息的 URL（如果有的话）\n*   具体的故事想法\n\
    \n至少，我们希望要求用户提供名字、电子邮件地址和他们的故事想法。\n\n### 开始编写 HTML5 表单\n\n要构建我们的 HTML 表单，我们需要从一个起始\
    \ `form` 元素标签开始。因为我们需要将此表单提交给服务器端的处理脚本，所以我们需要包含两个属性。\n\n*   `action`:脚本的 URL\n\
    *   `method`:要使用的 HTTP 请求方法，有时是 `GET`，但通常是 `POST`\n\n由于信息可能很长，我们将使用 `POST` 而不是\
    \ `GET`。`GET` 更适合短短的键值对，例如搜索框。其他 HTTP 方法，如 `PUT`、`HEAD` 或 `DELETE` 同样适用。\n\n注意的是，`application/x-www-form-urlencoded`\
    \ 是默认值。然而如果我们想上传文件，就需要 `multipart/form-data`。\n\n```\n<form action=\"/script\"\
    \ method=\"post\">\n```\n\n### `input` 元素\n\n`input` 元素是最常用于创建控件的。input 标签通常包含以下属性：\n\
    \n*   `name`:字段的名称\n*   `type`:输入的类型\n*   `id`:字段的唯一标识符\n*   `value`:设置默认值\n\n\
    在这些属性中，只有 `name` 是表单发送数据所必需的。`type` 属性大约有十几种可能的值，我们将在本章涵盖其中大部分。默认值是 `text`。\n\n\
    ### 收集姓名\n\n人名地名通常是字母和数字的混合。因此，我们将使用 `text` 输入状态。让我们为作者姓名和居住城市添加表单字段。因为我们要求提供姓名，所以还会添加\
    \ `required` 属性。\n\n```\n<p>\n  <label for=\"your_name\">您的姓名：</label>\n  <input\
    \ type=\"text\" name=\"your_name\" id=\"your_name\" required>\n</p>\n\n<p>\n \
    \ <label for=\"city\">居住城市：</label>\n  <input type=\"text\" name=\"city\" id=\"\
    city\">\n</p>\n```\n\n#### 注意：id 和 name 属性\n\n`id` 属性可以但不必与 `name` 属性相同。\n\n###\
    \ 使用表单标签 (Labels)\n\n我们在这里添加了一个不熟悉的元素：`label`。HTML 表单中的 `label` 元素的工作方式就像纸质表格上的标签一样。它告诉用户在字段中输入什么。为了将标签与表单控件关联，`label`\
    \ 必须有一个 `for` 属性，且其值必须与其表单字段的 `id` 属性匹配。或者你也可以将表单控件放在 `label` 元素内部。\n\n```\n<label>您的姓名：\n\
    \  <input type=\"text\" name=\"your_name\" id=\"your_name\" required>\n</label>\n\
    ```\n\n然而，使用 `for` 和 `id` 属性为页面布局提供了更多些灵活性。为什么不直接使用文本而不将其封装在 `label` 元素中呢？使用 `label`\
    \ 增加了那些身体或认知障碍人士访问网页的易用性。例如，屏幕阅读软件利用标签来帮助视力障碍的用户填写表单。\n\n## 表单字段\n\nHTML5 相比之前的版本的一个巨大改进是原生的表单验证。通过添加\
    \ `required` 属性，我们是在要求浏览器在提交表单之前确保该字段已填写。\n\n#### 注意：空属性\n\n`required` 属性是空属性的一个示例。它的存在与否决定该值是否被设置。\n\
    \n"
- fmt: "\nIf the `your_name` field is empty when the user submits our form, Chrome,\
    \ Opera, and Internet Explorer 10+ will prevent submission and alert the user,\
    \ as shown in [Figure 4.1](#ch04.html_errormsgchrome \"Figure 4.1. A form submission\
    \ error message in Chrome\"). No DOM scripting is necessary.\n\n![A form submission\
    \ error message in Chrome](figures/requiredfielderrormessagechrome.png)\n\nFigure\
    \ 4.1. A form submission error message in Chrome\n\nNotice that I didn’t mention\
    \ Safari. For better or worse, Safari versions 6.0.5 and older don't provide native\
    \ user interface feedback. It does support HTML5 validation, but we’ll still need\
    \ to use DOM scripting and CSS to alert the user about form submission. We’ll\
    \ discuss one way to do this in the Validation API section.\n\n### Styling Required\
    \ Forms\n\nYou may want to visually indicate which fields are required and which\
    \ aren’t using CSS. There are two CSS selectors we can use to target required\
    \ fields.\n\n1. Using the attribute selector `[required]`.\n2. Using the `:required`\
    \ pseudo-class.\n\nThe `:required` pseudo-class is a [CSS Selectors, Level 4](http://www.w3.org/TR/selectors4/)\
    \ selector, but support is available in the latest version of every major browser.\
    \ CSS Level 4 selectors also adds an `:optional` pseudo-class that we could use\
    \ instead to target the input fields that aren’t required.\n\nTo target older\
    \ browsers that lack CSS4 selector support, use the attribute selector. For example,\
    \ if we want to add a 1 pixel red border around our required fields, we could\
    \ add the following to our CSS.\n\n```css\ninput[required], input:required\n{\n\
    \  border: 1px solid #c00;\n}\n```\n\n### Collecting Email Addresses, Phone Numbers,\
    \ and URLs\n\nWe’ll want to let our tipster know that we’ve received their input.\
    \ That means our form needs fields for the email address and phone number. We\
    \ also want to collect URLs where we can learn more information about this story\
    \ idea, so our form will also need a field for the URL.\n\nWith previous versions\
    \ of HTML, we'd use a text field for all of these and validate the data with JavaScript.\
    \ HTML5, however, defines three new input types for this purpose: `email`, `tel`\
    \ and `url`.\n\nLet’s add an email field to our form. We’ll also make it required.\n\
    \n```html\n<p>\n  <label for=\"email\">E-mail address</label>\n  <input type=\"\
    email\" name=\"email\" id=\"email\" required>\n</p>\n```\n\nUsing the `email`\
    \ type tells the browser to check this field for a valid email address. It can’t,\
    \ of course, tell whether the address can receive mail. But it will check that\
    \ the input for this field is syntactically valid. If a user enters an invalid\
    \ address, most browsers will alert the user when he or she submits the form.\n\
    \nYou may also want to let the user provide multiple email addresses. In that\
    \ case, use the `multiple` attribute. The user can then enter one or more e-mail\
    \ addresses, each separated by a comma.\n\nAny time you permit multiple values\
    \ for one input field, it’s a good idea to indicate that it’s allowed with a label\
    \ or explanatory text.\n\n### Note: On Validation\n\nAlthough native data validation\
    \ is a part of HTML5, you should still use server-side validation and escape any\
    \ output that originates with the user. Not all browsers support HTML5, and not\
    \ all input sent to your script will come from your form.\n\nPhone numbers are\
    \ another story. Email addresses adhere to a standard format, but telephone numbers\
    \ do not. In the United Kingdom, phone numbers may be up to 11 digits long. In\
    \ the United States, they are no more than 10 digits. Some countries have phone\
    \ numbers that contain 13 digits. The formatting of phone numbers also varies\
    \ by country. Inconsistent lengths and formats make native phone number validation\
    \ difficult. As a result, the specification doesn’t define an algorithm for doing\
    \ so.\n\nLet’s add a telephone field to our form. To do that, we do need to add\
    \ an input field and set the value of its type attribute to `tel`. We won’t make\
    \ it required.\n\n```html\n<p>\n  <label for=\"telephone\">Telephone number:</label>\n\
    \  <input type=\"tel\" name=\"telephone\" id=\"telephone\">\n</p>\n```\n\nThe\
    \ big advantage of using `tel` instead of `text` is to trigger a telephone input\
    \ screen in browsers that support it.\n\n![The tel input type in Firefox Mobile](figures/inputtypetelinfirefoxmobile.png)\n\
    \nFigure 4.2. The tel input type in Firefox Mobile\n\nThough `tel` doesn’t give\
    \ us automatic validation, we can shape user input using two attributes:\n\n-\
    \ `placeholder`, which offers a 'hint' to the user about what format this field\
    \ expects.\n- `pattern`, which sets a regular expression pattern that the browser\
    \ can use to validate input.\n\nOur imaginary newspaper is based in the United\
    \ States, and has a US-based audience. We’ll reflect that in our attribute values.\n\
    \n```html\n<p>\n  <label for=\"telephone\">Telephone number:</label>\n  <input\
    \ type=\"tel\" name=\"telephone\" id=\"telephone\"\n  placeholder=\"(000) 000-0000\"\
    \n  pattern=\"\\([2-9][0-9]{2}\\) [0-9]{3}-[0-9]{4}\">\n</p>\n```\n\nFor our `placeholder`\
    \ attribute, we’ve just added text that reflects the expected format for this\
    \ phone number.\n\n### Note: Placeholder Text\n\nPlaceholder text is not a replacement\
    \ for the `label` element. Provide a label for each input field, even if you use\
    \ the `placeholder` attribute.\n\nFor `pattern`, we’ve used a regular expression.\
    \ This attribute provides a format or pattern that the input must match before\
    \ the form can be submitted. Almost any valid JavaScript regular expressions can\
    \ be used with the `pattern` attribute. Unlike with JavaScript, you can’t set\
    \ global or case-insensitive flags. To allow both upper and lower case letters,\
    \ your pattern must use `[a-zA-Z]`. The `pattern` attribute itself may be used\
    \ with `text`, `search`, `email`, `url` and `telephone` input types.\n\n### Note:\
    \ Regular Expressions\n\nRegular expressions are a big, complex topic and, as\
    \ such, they’re beyond the scope of this book. For a more complete reference,\
    \ consult [WebPlatform.org’s documentation](http://docs.webplatform.org/wiki/concepts/programming/javascript/regex).\n\
    \nThe `url` input type works much the same way as `email` does. It validates user\
    \ input against accepted URL patterns. Protocol prefixes such as `ftp://` and\
    \ `gopher://` are permitted. In this case, we want to limit user input to domains\
    \ using the `http://` and `https://` protocols. So we’ll add a `pattern` attribute\
    \ here as well.\n\n```html\n<p>\n  <label for=\"url\">\n    Please provide a web\
    \ site where we can learn more (if \n  applicable):\n  </label>\n  <input type=\"\
    url\" name=\"current_site\" id=\"current_site\"\n  placeholder=\"http://www.example.com/\"\
    \n  pattern=\"http(|s)://[-0-9a-z]{1,253}\\.[.a-z]{2,7}\">\n</p>\n```\n\nWe’ve\
    \ also added `placeholder` text as a cue to the user about what we’d like them\
    \ to tell us. Altogether, your form should resemble the one below:\n"
