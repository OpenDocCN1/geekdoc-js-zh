  trans: "\n\n我们将确保这些方法在用户请求时被调用。播放和暂停按钮已经是我们标记的一部分了，所以现在我们只需要为每个按钮添加一个事件监听器。首先，让我们将按钮引用为变量：\n\
    \n```\nvar play  = document.getElementById('play');\nvar pause = document.getElementById('pause');\n\
    ```\n\n由于这些是按钮，它们通常会被点击。因此，让我们为它们都添加 `click` 事件监听器。\n\n```\nplay.addEventListener('click',\
    \ clickhandler);\npause.addEventListener('click', clickhandler);\n```\n\n接下来，我们需要定义\
    \ `clickhandler` 函数。因为这些按钮将执行相似的操作，我们可以对它们使用同一个函数。我们将根据 `event.target.id` 属性的值来调用其中一个函数或另一个函数。\n\
    \n```javascript\nfunction clickhandler(event){\n    var id = event.target.id;\n\
    \n    if( id == 'play' ){\n        video.play();\n    }\n    if( id == 'pause'\
    \ ){\n        video.pause();\n    }  \n}\n```\n\n## 第 3 步：确定文件的时长\n\n媒体对象有一个 `duration`\
    \ 属性，该属性只能通过脚本接口访问。一旦浏览器下载了文件的元数据，该属性就会被定义。\n\n当浏览器能够确定媒体文件的运行时间时，它会在音频或视频对象上触发\
    \ `durationchange` 事件。我们可以监听这个事件并使用它来更新我们的时长显示。我们的标记中还包含一个进度条和一个用于跳转的范围控制控件。为了让这些控件正常工作，我们需要将这些控件的\
    \ `max` 属性设置为我们 `duration` 属性的值。\n\n首先来看我们的 `updateduration` 函数：\n\n```javascript\n\
    function updateduration(event){\n    var durationdisplay = document.getElementById('duration'),\n\
    \        elapseddisplay  = document.getElementById('elapsed');\n\n    durationdisplay.innerHTML\
    \ = event.target.duration;\n    elapseddisplay.innerHTML  = event.target.currentTime;\n\
    }\n```\n\n在这个函数中，我们获取了 `span#duration` 和 `span#elapsed` 元素。然后，我们使用视频对象的 `duration`\
    \ 和 `currentTime` 的值来更新 `<span>` 标签之间的文本。\n\n我们还会定义另外两个函数，一个用于更新进度条的 `max` 属性值，另一个用于更新跳转控制的\
    \ `max` 值。如果我们没有设置 `max` 值，我们的进度条将无法准确指示视频已经过了多少时间，范围控制控件也不会允许我们向前或后滑动。\n\n```javascript\n\
    var seek = document.getElementById('seek'),\n    playback = document.getElementById('playback');\n\
    \nfunction updateseekmax(event){\n    if( event.target.duration ){\n        seek.max\
    \ = event.target.duration;\n    }\n}\n\nfunction updateplaybackmax(event){\n \
    \   if( event.target.duration ){\n        playback.max = event.target.duration;\n\
    \    }\n}\n```\n\n现在，将这些函数作为 `durationchange` 事件监听器添加到视频对象中。\n\n```javascript\n\
    video.addEventListener('durationchange', updateduration);\nvideo.addEventListener('durationchange',\
    \ updateseekmax);\nvideo.addEventListener('durationchange', updateplaybackmax);\n\
    ```\n\n当我们的文档加载并触发 `durationchage` 事件时，这三个函数将被调用。\n\n## 第 4 步：指示已过时间\n\n一旦我们的媒体文件开始播放，我们就希望指示已经过去了多少时间。为了做到，我们需要监听\
    \ `timechange` 事件，并在我们的回调函数中读取视频对象的 `currentTime` 属性。\n\n`timechange` 是在媒体播放期间定期触发的事件——每\
    \ 15 到 250 毫秒触发一次。触发时，我们将检查 `currentTime` 属性的值并更新我们已过显示中的文本。此 `currentTime` 属性返回媒体文件当前的播放位置（以秒为单位）。让我们设置回调函数。\n\
    \n```javascript\nfunction timeupdatehandler(event){\n    var elapsed = document.getElementById('elapsed');\n\
    \    elapsed.innerHTML = event.target.currentTime;\n}\n```\n\n然后，我们可以为视频对象添加一个事件监听器。\n\
    \n```javascript\nvideo.addEventListener('timechange', timeupdatehandler);\n```\n\
    \n`currentTime` 是所谓的访问器属性（getter/setter property）。我们可以使用它来获取媒体时间轴上的当前点。但我们也可以用它在媒体时间轴的不同点之间移动。例如，使用\
    \ `video.currentTime = 0` 将当前播放点重置为开头。这是创建自定义跳转条的秘密。\n\n## 第 5 步：使用 `range` 输入类型进行跳转\n\
    \nRange 输入类型的工作原理是具有最小值和最大值（通过 `min` 和 `max` 属性设置）。控件上的位置对应于最小值和最大值之间的值——在本例中，是\
    \ `0` 和媒体文件的总时长（秒）。\n\n所有输入元素（包括 range）在用户更改控件的值时都会触发 `change` 事件。当事件对象被传递给我们的处理器时，我们可以读取范围控制控件的当前\
    \ `value` 属性，并更新 `video.currentTime` 的值。为了保持我们的进度条同步，我们也会更新它的值。\n\n让我们来看看回调函数和事件监听器：\n\
    \n```javascript\nfunction seekhandler(event){\n    video.currentTime = event.target.value;\
    \ \n    playback.value = event.target.value\n}\n\nseek.addEventListener('change',\
    \  seekhandler);\n```\n\n当用户调整跳转控制控件时，我们的视频将相应地推进或后退。\n\n![使用我们的跳转控制控件推进视频。视频图像来自\
    \ Nina Paley 的 \"Sita Sings the Blues\"(sitasingstheblues.com)](img/video-seeking.png)\n\
    \n图 11.2. 使用我们的跳转控制控件推进视频。视频图像来自 Nina Paley 的 \"Sita Sings the Blues\"(sitasingstheblues.com)\n\
    \n## 第 6 步：调整音量\n\n我们的音量控制原理与跳转控件类似。\n\nHTML 媒体对象有一个 `volume` 属性，可以通过脚本接口访问。它的下限是\
    \ 0.0，上限是 1.0。可接受的值落在两者之间。所有值都相对于该媒体文件的固有音量。\n\n我们的音量范围控件具有 0 的 `min` 值和 1 的 `max`\
    \ 值，对应于 `volume` 属性的上下限。由于这些值小于或等于一，我们需要在标签中添加 `step=\"0.1\"`。\n\n与跳转控制控件一样，当用户更改音量时，浏览器会触发\
    \ `change` 事件。然后我们可以读取其 `event.target.value` 属性并用该值更新视频对象的 `volume` 属性。在下面的代码中，我们定义了回调函数，并为音量控制添加了事件监听器。\n\
    \n```javascript\nvar volume = document.getElementById('volume');\n\nfunction volumehandler(event){\n\
    \    video.volume = event.target.value;\n}\n\nvolume.addEventListener('change',\
    \  volumehandler);\n```\n\n## 通过更改 `preload` 值提示带宽消耗\n\n在 第 7 章 中，我们提到 `preload`\
    \ 属性为浏览器提供了关于一次应下载多少媒体的提示。使用 `preload=\"none\"` 防止浏览器下载文件的任何部分，但一旦用户启动播放，浏览器可能会激进地下载媒体。使用\
    \ `preload=\"metadata\"` 是提示浏览器它应该像带宽非常昂贵一样表现。\n\n如果节省带宽是你的目标，那么 `preload=\"none\"\
    ` 和 `preload=\"metadata\"` 的组合是最佳选择。然而，我们需要使用脚本在用户启动播放后更改该值。让我们更新上面的 `clickhandler`\
    \ 函数。\n\n```javascript\nfunction clickhandler(event){\n    var id = event.target.id;\n\
    \n    if( id === 'play' ){\n        video.play();\n        video.preload = 'metadata';\n\
    \    }\n    if( id === 'pause' ){\n        video.pause();\n    }  \n}\n```\n\n"
- fmt: "\nWhen the user clicks Play, this function will also change the value of `preload`\
    \ alerting the browser that it should throttle its download. Remember, however,\
    \ that these are hints; browser behavior isn't guaranteed.\n\n## Wrapping Up\n\
    \nIn this book we've covered media encoding and HTML5 markup. We've learned how\
    \ to make our media accessible. And we've learned the basics of building a player\
    \ using the multimedia scripting APIs. There's more than what we've covered here,\
    \ however.\n\nThough dense, I recommend reading the documentation for the [video\
    \ element](http://developers.whatwg.org/the-video-element.html#the-video-element)\
    \ from `HTML: The Living Standard`. It's maintained by the WHATWG and geared towards\
    \ web developers rather than browser vendors.\n\nAdvertising company LongTail\
    \ maintains a [The State Of HTML5 Video](http://www.longtailvideo.com/html5/)\
    \ page that tracks current browser support for particular multimedia features.\n\
    \nMozilla.org also provides a [guide to using HTML5 audio and video](https://developer.mozilla.org/en-US/docs/Web/Guide/HTML/Using_HTML5_audio_and_video)\
    \ that talks a bit more about things we haven't covered, like error handling,\
    \ and specifying a playback range. Also see Dev.Opera's [Introduction to HTML5\
    \ video](http://dev.opera.com/articles/view/introduction-html5-video/) for more\
    \ tips and tricks on scripting a video player.\n\nYou're now equipped with what\
    \ you need to know about HTML5 audio and video. Happy coding!\n\n# Chapter 12:\
    \ Canvas & SVG: An Introduction to Canvas\n\nAs the Web has evolved and matured,\
    \ so too has the language used to display web pages effectively. The previous\
    \ version of HTML, v4.01 has many elements that are now obsolete.\n\nModern internet\
    \ users are sophisticated and demanding, and this means they expect web pages\
    \ to appear in a certain way and to load quickly. HTML5 seeks to address what\
    \ was lacking in earlier versions of HTML to better handle graphics and meet those\
    \ expectations.\n\n## What Can Canvas Be Used For?\n\nCanvas can be used to draw\
    \ shapes, such as rectangles, squares and circles, or to embed images or videos\
    \ in an HTML5 document. You can use multiple instances of it in one document,\
    \ or just one, depending on your needs.\n\nThe basic `canvas` element looks like\
    \ this:\n\n```\n<canvas id=\"myCanvas\" width=\"300\" height=\"150\"></canvas>\n\
    ```\n\nAt this point, it's worth noting that the HTML5 `canvas` element is the\
    \ `DOM` (Document Object Model) node that's embedded in the page. The context\
    \ is then created, which is an object that you use in order to render graphics\
    \ within the container. If you create multiple canvases, you'll need to create\
    \ `canvas` elements for each context and name them appropriately so that the browser\
    \ understands to which object you're referring.\n\nThe `canvas` element is superficially\
    \ similar to the `img` element. Both have a height and width, and display in a\
    \ rectangular block on the page. However, `img` normally loads a pre-prepared\
    \ graphic, such as a photograph. `canvas` is a programmable image; you use JavaScript\
    \ drawing methods to directly manipulate the pixels. The technology is fast and\
    \ permits you to create sophisticated animations and games. Overall, canvas is\
    \ often compared to technologies such as Flash and Silverlight.\n\nCheck out this\
    \ [animated graphic](http://raksy.dyndns.org/torus.html) for a good example of\
    \ what you can do using canvas. You should also check out [Canvas Demos](http://www.canvasdemos.com/)\
    \ for some great working examples, including games and apps that have been created\
    \ using `canvas`.\n\n## Before We Get Started\n\nSome points to think about before\
    \ we begin playing around with canvas:\n\n*   It's usually best to give each canvas\
    \ a unique `id` attribute so your scripts can reference it directly. No other\
    \ elements on that page should use the same ID.\n\n*   When no styling is applied,\
    \ the container or the canvas element will be transparent, with no border, so\
    \ it'll appear as a see-through, rectangular box. The default width is 300 pixels\
    \ and the default height is 150 pixels.\n\n*   In an ideal world, everyone would\
    \ use the latest browsers. But it isn't, and they don't. This means it's usually\
    \ necessary to tell the browser how to behave when `canvas` is not supported.\n\
    \n*   If you're used to working with the `img` element then you'll know that it\
    \ doesn't require the closing `</img>` tag. `canvas`, on the other hand, does\
    \ require closing, so you should always include `</canvas>` at the end of the\
    \ container code.\n\nIt's also worth mentioning at this point that canvas uses\
    \ coordinates, paths, and gradients. These can look a little daunting when you\
    \ first come across them, and often have would-be developers running for the hills\
    \ screaming \"MATH!\" But there's little need to worry—you'll soon get the hang\
    \ of it.\n\n## Canvas Looks Complex, Why Not Use Flash?\n\nI've come across a\
    \ lot of questions posted on various forums that all say much the same thing:\
    \ \"Canvas looks far too complicated for creating animations—why shouldn't I just\
    \ stick to using Flash since I know it already?\"\n\nWell, it's true that Flash\
    \ enables you to create animations using professional tools, which don't necessarily\
    \ require coding skills. However, canvas is superior to Flash in other ways, including:\n\
    \n*   good compatibility on desktop and mobile devices\n*   it requires no plugins\
    \ or dependencies outside of the browser\n*   it's free to use\n*   once you've\
    \ learned to use it, canvas can create impressive animations using minimal code\n\
    \n## What About WebGL?\n\nWebGL enables 3D graphics to be rendered within the\
    \ browser window, and for those graphics to be manipulated using JavaScript. If\
    \ you're interested in using `canvas` then it's likely you'll be interested in\
    \ investigating WebGL, too, at some point; the idea that you can create 3D graphics\
    \ without plugins is a very attractive one. It's already [supported](http://caniuse.com/webgl)\
    \ by most browsers, too. That said, we won't be covering WebGL in this book.\n\
    \n# Chapter 13: Canvas & SVG: Canvas Basics\n\nFirst of all, let's look at how\
    \ to create a canvas document. As noted earlier in this book, the `canvas` element\
    \ itself looks like this:\n\n```\n<canvas id=\"MyCanvas\" width=\"300\" height=\"\
    150\"></canvas\n```\n\n## HTML5 Canvas Template\n\nLet's start with a basic template\
    \ that we can use to begin working with. We'll add the `canvas` element to the\
    \ page and a small self-executing script that gets the context:\n\n```\n<html>\n\
    \  <head>\n  <title>Getting started with Canvas</title>\n  <style type=\"text/css\"\
    >\n    canvas { border: 1px solid black; }\n  </style>\n  </head>\n  <body>\n\
    \    <canvas id=\"MyCanvas\" width=\"300\" height=\"150\"></canvas>\n    <script>\n\
    \      (function() {\n        var canvas = document.getElementById('MyCanvas');\n\
    \        if (canvas.getContext){\n          var ctx = canvas.getContext('2d');\n\
    \        }\n      }\n    </script>\n  </body>\n</html>\n```\n\nThere are two essential\
    \ attributes that `canvas` has: `width` and `height`. If the attributes are not\
    \ specified, then the default of 300px wide by 150px high will be used.\n\nThe\
    \ `getElementById` function simply finds the `canvas` element in the DOM, based\
    \ on the ID we've assigned the canvas, which, in this case, is `MyCanvas`. The\
    \ line `var ctx = canvas.getContext('2d');` is the 2D context method, which returns\
    \ an object that exposes the API for the drawing methods we'll use.\n\n### Tip:\
    \ Canvas Element Styling\n\nYou can style the `canvas` element just as you would\
    \ any other image, using borders, colors, backgrounds, and so on. However, the\
    \ styling will not affect the actual drawing on the canvas. A canvas without any\
    \ styling will simply appear as a transparent area.\n\n## Drawing a Simple Shape\
    \ Onto the Canvas\n\nLet's have a look at how we can draw some simple shapes.\
    \ All drawing must be done in our JavaScript function, after the line `var ctx\
    \ = canvas.getContext('2d');`. Let's draw a rectangle:\n\n```\nctx.fillStyle=\"\
    #0000FF\";\nctx.fillRect(0,0,300,150);\n```\n"
