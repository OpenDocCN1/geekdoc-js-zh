    \ operate on a single thread. That's because your code can prevent other actions,\
    \ such as a link being clicked. Multiple threads could break that. Also the DOM\
    \ is not thread-safe. For these reasons, the Worker threads have no access to\
    \ the DOM—but that won't stop your Workers from modifying main page content. You\
    \ can always pass a result back to the parent script and let the UI thread update\
    \ the DOM content. I will show you how at the end of the chapter.\n\nThere is\
    \ just one final issue before we move onto more advanced features: how to close\
    \ a thread. To terminate a thread, just call `worker.terminate()` from main script\
    \ or `self.close()` from the worker itself.\n\n## More Advanced Workers\n\n###\
    \ Inline Workers\n\nEverybody loves to do things on the fly. Since Web Workers\
    \ run in a separate context, the `Worker` constructor expects a URI that specifies\
    \ an external script file to run. But if you want to be really quick, you can\
    \ create Inline Workers on the fly through `blobs`. Have a look at the following\
    \ code:\n\n```\nvar blob = new Blob([\"onmessage = function(e) {\n↵self.postMessage(e.data);\
    \ };\"]);\n\nvar worker = new Worker(window.URL.createObjectURL(blob));\n\nworker.addEventListener('message',\
    \ function(e){\n  alert('Got same Message: '+e.data+' from worker');\n},false);\n\
    \nworker.postMessage('Good Morning Worker!!');\n```\n\nIn this snippet, we wrote\
    \ the content of our Worker in a `Blob`. `window.URL.createObjectURL` essentially\
    \ creates a URI (for example, `blob:null/027b645d-be05-4f14-8866-e52604777608`)\
    \ that references the content of the Worker, and that URI is passed to the `Worker`\
    \ constructor. Then we proceed as usual.\n\nSince it’s inconvenient to put all\
    \ the Worker content into a `Blob` constructor, we can alternatively put all the\
    \ Worker code in a separate `script` tag inside the parent HTML. Then, at runtime,\
    \ we pass that content to the `Blob` constructor.\n\nIn the following example,\
    \ we write the Worker in the parent HTML page itself. Once the Worker starts,\
    \ it will execute a function every second and return the current time to the main\
    \ thread. The main thread will then update the `div` with the time (remember we\
    \ talked about updating the DOM?):\n\n*parentPage.html*\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<!-- \n  The following script won't be parsed by the JavaScript\
    \ engine \n  because of its type\n-->\n<script type=\"text/javascript-worker\"\
    \ id=\"jsworker\">\n\n  setInterval(function(){\n    postMessage(getTime());\n\
    \  }, 1000);\n\n  function getTime(){\n    var d = new Date();\n    return d.getHours()+\"\
    :\"+d.getMinutes()+\":\"+d.getSeconds();\n  }\n\n</script>\n\n<script>\n  var\
    \ blobURI = new Blob(\n    [document.querySelector(\"#jsworker\").textContent]\n\
    \  );\n\n  var worker=new Worker(window.URL.createObjectURL(blobURI));\n\n  worker.addEventListener('message',function(e){\n\
    \    document.getElementById('currTime').textContent=e.data;\n  },false);\n\n\
    \  worker.postMessage();\n</script>\n</head>\n<body>\n<div id=\"currTime\"></div>\n\
    </body>\n</html>\n```\n\nThis code is fairly self-explanatory. Once the Worker\
    \ starts, we register a function that is executed every second and returns the\
    \ current time. The same data is retrieved and the DOM is updated by the main\
    \ thread. Furthermore, `#currTime` can be cached for better performance.\n\nIf\
    \ you’re creating many blob URLs, it’s good practice to release them once you’re\
    \ done (I’d recommend that you avoid creating too many blob URLs):\n\n```\nwindow.URL.revokeObjectURL(blobURI);\
    \ // release the resource\n```\n\n### Creating Subworkers Inside Workers\n\nIn\
    \ your Worker files you can further create subworkers and use them. The process\
    \ is the same. The main benefit is that you can divide your task between many\
    \ threads. The URIs of the subworkers are resolved relative to their parent script’s\
    \ location, rather than the main HTML document. This is done so that each Worker\
    \ can manage its dependencies clearly.\n\n### Using External Scripts within Workers\n\
    \nYour Workers have access to the `importScripts()` function, which lets them\
    \ import external scripts easily. The following snippet shows how to do it:\n\n\
    ```\n// import a single script\nimportScripts('external.js');\n\n//import 2 script\
    \ files\nimportScripts('external1.js','external2.js');\n```\n\n### Note: URIs\
    \ are Relative to the Worker\n\nWhen you import an external script from the Worker,\
    \ the URI of the script is resolved relative to the Worker file location instead\
    \ of the main HTML document.\n\n## Security Considerations\n\nThe Web Worker API\
    \ follows the **same origin principle**. It means the argument to `Worker()` must\
    \ be of the same origin as that of the calling page.\n\nFor example, if my calling\
    \ page is at `http://xyz.com/callingPage.html`, the Worker cannot be on `http://somethingelse.com/worker.js`.\
    \ The Worker is allowed as long as its location starts with `http://xyz.com`.\
    \ Similarly, an `http` page cannot spawn a Worker whose location starts with `https://`.\n\
    \n[Figure 27.2](#ch27.html_sameorigin \"Figure 27.2. Origin error in Chrome\"\
    ) shows the error thrown by Chrome when trying to go out of the origin:\n\n![Origin\
    \ error in Chrome](figures/sameorigin.png)\n\nFigure 27.2. Origin error in Chrome\n\
    \nSome browsers may throw security exceptions if you try to access the files locally\
    \ (via the `file://` protocol). If you are getting any such exceptions, just put\
    \ your file in the local server and access it with this: `http://localhost/project/somepage.html`.\n\
    \n## Polyfills for Older Browsers\n\nWhat if the browser does not support the\
    \ Web Workers API? There are several polyfills available to support older browsers\
    \ by simulating the behavior of Web Workers. [The Modernizr page on Github](https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-browser-Polyfills#web-workers)\
    \ has a list of such polyfills, but long-running code may fail with these implementations.\
    \ In those cases, it may be necessary to offload some processing to the server\
    \ via Ajax.\n\n## Conclusion\n\nWeb Workers give you a big performance boost because\
    \ of their multi-threaded nature. All modern browsers, including IE10 and above,\
    \ offer support for Web Workers.\n\nHere are a few use cases that you can try\
    \ to implement:\n\n*   **[long polling](http://techoctave.com/c7/posts/60-simple-long-polling-example-with-javascript-and-jquery)**\
    \ in the background and notifying the user about new updates\n\n*   pre-fetching\
    \ and caching content\n\n*   performing computationally expensive tasks and long-running\
    \ loops in the background\n\n*   a spell-checker that runs continuously in the\
    \ background\n\n# Chapter 28\n\nAPIs: The Geolocation API\n\nThe Geolocation API\
    \ provides an easy way to retrieve the exact position of your users. For example,\
    \ you can create an app that gives personalized suggestions to the users based\
    \ on their current location. You may also plot their position on the map to show\
    \ navigation details.\n\nIn this chapter, I will give you an overview of the Geolocation\
    \ API and show how you can use it to create magical location-based HTML5 apps.\n\
    \n## Hitting the Surface\n\nBefore using the API, let’s just make sure the browser\
    \ supports it:\n\n```\nif (navigator.geolocation) {\n  // do something awesome\n\
    }\nelse {\n  // provide alternative content\n}\n```\n\nThe same check can be achieved\
    \ through `Modernizr`:\n\n```\nif (Modernizr.geolocation) {\n  //do something\
    \ awesome\n}\nelse {\n  //provide alternative content\n}\n```\n\nUse the following\
    \ code for the actual position of the user:"
