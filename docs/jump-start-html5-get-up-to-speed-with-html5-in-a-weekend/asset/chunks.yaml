  trans: "\n这绘制了一个填充整个画布区域的蓝色矩形。`fillRect` 方法需要绘制矩形的左上角 x 和 y 坐标，然后是它的宽度和高度。上面的代码创建了一个\
    \ 300x150px 的矩形，其左上角位于坐标 0,0，并用当前的 `fillStyle` 填充，在此例中，它是实蓝色（`#0000FF`）——参见图 13.1。`fillStyle`\
    \ 可以是颜色、渐变或图案。\n\n![我们的蓝色矩形](img/BLUE-FILL-BORDER.png)\n\n图 13.1. 我们的蓝色矩形\n\n\
    Canvas 2D API 提供了绘制几种基本形状的方法，包括：\n\n*   矩形\n*   弧\n*   路径\n*   文本\n*   图像\n\n\
    W 指定画布尺寸为 300x150px。如果我们减小矩形的大小，你将看到画布内有一个矩形。例如，如果我们如下所示修改代码：\n\n```\nctx.fillStyle=\"\
    #0000FF\";\nctx.fillRect(0,0,150,75);\n```\n\n![调整大小后的矩形](img/Blue-part-fill.png)\n\
    \n图 13.2. 调整大小后的矩形\n\n画布本身保持为一个透明框，如你所见。由于我们在画布周围添加了黑色边框，你可以看到它的区域。如果没有边框，你将只能看到蓝色框，但画布仍然在那里。\n\
    \n记住，画布的 `width` 和 `height` 属性决定了像素坐标系的维度。如果你使用 CSS 指定不同的宽度或高度，画布图像将相应地压缩或拉伸。例如，如果我们在\
    \ CSS 中对画布应用 600px 的宽度和 300px 的高度，每个画布“像素”将是普通像素的两倍。\n\n## 画布坐标与路径\n\nCanvas 使用二维坐标网格。画布的左上角坐标为\
    \ (0,0)。右下角根据元素的大小具有正 x 和 y 坐标。在上面的示例中，我们使用了 300x150px 的画布尺寸，所以右下角的像素位于 (299,149)，因为坐标是从\
    \ 0 开始的。\n\n使用 `paths` 在画布上绘制线条。你通过使用 `moveTo()` 和 `lineTo()` 方法，结合 `ink` 方法之一（`stroke()`\
    \ 或 `fill()`）来创建路径。`moveTo()` 和 `lineTo()` 定义了要绘制线条的起点和终点。`stroke()` 通过“描边”其轮廓来绘制形状，而\
    \ `fill()` 通过填充路径的内容区域来绘制实心形状。\n\n所以，为了在我们创建的矩形上画一条简单的白色直线线：\n\n```\nctx.strokeStyle\
    \ = \"#FFFFFF\";\nctx.beginPath();\nctx.moveTo(0,0);\nctx.lineTo(300,150);\nctx.stroke();\n\
    ```\n\n`beginPath` 方法会擦除任何现有的路径绘制操作，为新路径做准备。`stroke()` 方法会物理上绘制你定义的路径。在这种情况下，它是一单条线。\n\
    \n## 绘制圆\n\n现在让我们看看如何画圆。最简单的方法是使用 `arc` 来有效创建一个圆形路径，然后可以使用描摹方法（如 `stroke()` 或\
    \ `fill()`），如下所示：\n\n```\nctx.beginPath();\nctx.arc(95,50,40,0,2*Math.PI);\nctx.stroke();\n\
    ```\n\n这里我们使用了 `arc` 方法（它仍然可以是路径的一部分）。参数指定了弧圆心的 x 和 y 坐标、弧的半径、起始角度和结束角度（以[弧度](http://en.wikipedia.org/wiki/Radian)为单位）。因此，我们创建了一个以坐标\
    \ 95,50 为中心、半径为 40 像素、起始角度为 0、结束角度为 2*PI（或 360 度）。我们使用了 `stroke()` 方法绘制路径，我们得到了一个圆，如图\
    \ 13.3 所示：\n\n![绘制圆](img/canvasCIRCLE.png)\n\n图 13.3. 绘制圆\n\n如果你添加了 `fill()` 方法，你将得到一个用指定颜色填充的圆（默认为黑色），如图\
    \ 13.4 所示：\n\n![一个填充的圆](img/canvasCIRCLEFILL.png)\n\n图 13.4. 填充的圆\n\n## 绘制文本\n\
    \n你可以使用这些方法在画布上绘制文本：\n\n*   `font`——定义字体属性\n*   `fillText(text,x,y)`——在画布上绘制文本\n\
    *   `strokeText(text,x,y)`——在画布上绘制文本的轮廓\n\n这是一个示例：\n\n```\nctx.font = \"25px Arial\"\
    ;\nctx.fillText(\"HTML5 Canvas Rocks!\",10,50);\n```\n\n这将使用 25 像素大小的 Arial 字体在坐标\
    \ (10,50) 处使用块文本绘制“HTML5 Canvas Rocks!”，如图 13.5 所示：\n\n![在画布上写字](img/canvasHTML5TEXT.png)\n\
    \n图 13.5. 在画布上写字\n\n如果你现在将 `fillText()` 替换为 `strokeText()`，你将得到轮廓文本，如图 13.6 所示：\n\
    \n![描边文本](img/canvasSTROKETEXT.png)\n\n图 13.6. 描边文本\n\n你还可以添加文本效果和颜色：\n\n```\n\
    ctx.fillStyle= '#0000FF';\nctx.font=\"Italic 25px Arial\";\nctx.fillText(\"HTML5\
    \ Canvas Rocks!\",10,50);\n```\n\n这将使文本变为斜体并呈现蓝色，如图 13.7 所示：\n\n![蓝色斜体文本](img/canvasITALICS.png)\n\
    \n图 13.7. 蓝色斜体文本\n\n## 绘制三角形\n\n让我们看看如何画一个三角形。由于没有内置的三角形形状绘制方法，我们需要使用路径来构造它。为了创建一个填充三角形，我们可以使用以下代码：\n\
    \n```\nctx.beginPath();\nctx.moveTo(25,25);\nctx.lineTo(105,25);\nctx.lineTo(25,105);\n\
    ctx.fill();\n```\n\n这应该创建一个填充的三角形，如图 13.8 所示：\n\n![填充的三角形](img/TRIANGLE.png)\n\
    \n图 13.8. 填充的三角形\n\n创建一个描边的三角形：\n\n```\nctx.beginPath();\nctx.moveTo(25,25);\n\
    ctx.lineTo(105,25);\nctx.lineTo(25,105);\nctx.closePath();\nctx.stroke();\n```\n\
    \n注意 `closePath()` 方法；它通过绘制从当前点到初始点的直线来关闭路径。这将如图 13.9 所示：\n\n![描边的三角形](img/STROKETANGLE.png)\n\
    \n图 13.9. 描边的三角形\n\n这就是使用 HTML5 的 `canvas` 元素和 JavaScript 绘制形状的方法。现在你已经学习了基础知识，请练习不同的样式、字体和形状，以进一步习惯\
    \ JavaScript 代码。\n\n## 画布尺寸\n\n根据你使用 canvas 开发的内容，你可以调整尺寸以适应所使用的设备——例如，如果你需要填充屏幕的游戏。可以通过多种方式实现：\n\
    \n*   在 JavaScript 中编码\n*   使用 CSS\n*   使用 JavaScript 变换\n\n### JavaScript 缩放\n\
    \n```\nvar canvas = document.getElementById('canvas');\ncanvas.width = window.innerWidth;\n\
    canvas.height = window.innerHeight;\n```\n\n这将创建一个扩展到当前视口大小的画布，但你需要确保元素没有边距或不受页面其他项目的影响。此外，更改浏览器窗口大小不会修改画布维度。\n\
    \n### CSS 缩放\n\n```css\n#canvas {\n  position: relative;\n  left: 0;\n  right:\
    \ 0;\n  top: 0;\n  bottom: 0;\n  margin: auto;\n  width: 100%;\n  height: 100%;\n\
    }\n```\n\n这改变了画布框的大小，而不是像素维度；坐标系保持不变。\n"
- fmt: "\nIn this short chapter, we'll look at creating code that tells the browser\
    \ how to behave if it doesn't support `canvas` rendering.\n\n## Create Alternative\
    \ Content\n\nThe best way to handle the possibility that a user's browser doesn't\
    \ support `canvas` is to place alternative content within the `<canvas>` tag.\
    \ This does away with confusion for the end user if they can't see what's supposed\
    \ to be displayed.\n\nYou can use an `img` tag, explanatory text, or any other\
    \ HTML you think necessary for this alternative content. For example:\n\n```html\n\
    <canvas id=\"MyCanvas\" width=\"150\" height=\"300\">\n  <img src=\"http://yoursite.com/locationofimage.jpg\"\
    \ \n  ⌉alt=\"Browser Not Supported\" />\n</canvas>\n```\n\nIf the browser supports\
    \ `canvas`, the `img` tag and any other content between the `<canvas>` and `</canvas>`\
    \ tags are ignored and won't appear in the document.\n\nHow useful you want to\
    \ make fallback content is up to you; you can offer a download link to the latest\
    \ version of the user's browser, or you can add a framework that'll allow you\
    \ to show the content using a different technology, such as `SVG` or `Flash`.\n\
    \nYou can also use the `getContext` method to check for canvas support in JavaScript,\
    \ e.g.\n\n```javascript\nfunction supports_canvas() {\n  return !!document.createElement('canvas').getContext;\n\
    }\n```\n\nAlternatively, you can use the `getContext` method on an existing element:\n\
    \n```javascript\nvar canvas = document.createElement(\"MyCanvas\");\nif (!canvas.getContext\
    \ || !canvas.getContext(\"2d\")) {\n    alert(\"Sorry - canvas is not supported.\"\
    );\n}\nelse {\n    // start drawing\n    var ctx = canvas.getContext('2d');\n\
    }\n```\n\n# Chapter 15\n\n### Canvas & SVG: Canvas Gradients\n\nWith HTML5 `canvas`,\
    \ you're not limited to block colors, but can use gradients to fill shapes such\
    \ as rectangles and circles. There are two different types of gradient you can\
    \ use:\n\n```javascript\n// create a linear gradient\ncreateLinearGradient(x,y,x1,y1)\n\
    ```\n\n![An example of a linear gradient](figures/gradient_example_1.png)\n\n\
    Figure 15.1. An example of a linear gradient\n\n```javascript\n// create a radial\
    \ gradient\ncreateRadialGradient(x,y,r,x1,y1,r1)\n```\n\n![An example of a radial\
    \ gradient](figures/radial_gradient_2.png)\n\nFigure 15.2. An example of a radial\
    \ gradient\n\nLet's start by creating a linear gradient (the canvas context, `ctx`,\
    \ has already been defined):\n\n```javascript\n// create linear gradient\nvar\
    \ grd = ctx.createLinearGradient(0,0,400,0);\ngrd.addColorStop(0,\"blue\");\n\
    grd.addColorStop(1,\"yellow\");\n\n// fill with gradient\nctx.fillStyle = grd;\n\
    ctx.fillRect(40,20,300,160);\n```\n\nThe result is shown in [Figure 15.3](#ch15.html_linearexample\
    \ \"Figure 15.3. Our linear blue-yellow gradient\").\n\n![Our linear blue-yellow\
    \ gradient](figures/canvasGRADIENTBY.png)\n\nFigure 15.3. Our linear blue-yellow\
    \ gradient\n\nThe first line `var grd = ctx.createLinearGradient(0,0,400,0);`\
    \ creates a `CanvasGradient` object which defines a gradient between two sets\
    \ of coordinates (x1,y1,x2,y2). These determine the size and direction of the\
    \ gradient. In our example, we use (0,0) to (400,0) which results in a horizontal\
    \ gradient which is 400 pixels in width. If our box was wider, the last color\
    \ would extend accordingly.\n\nIf we required a 300px vertical gradient, we would\
    \ use:\n\n```javascript\nvar grd = ctx.createLinearGradient(0,0,0,300);\n```\n\
    \nA 45-degree diagonal gradient in a 100x100px space would be defined as:\n\n\
    ```javascript\nvar grd = ctx.createLinearGradient(0,0,100,100);\n```\n\nWe can\
    \ now set the color values at certain **color stop** points within that gradient\
    \ using the `addColorStop` method. It is passed two values:\n\n*   a stop value\
    \ between `0` (the left-most end of the linear gradient) and `1` (the right-most\
    \ end of the gradient)\n*   a color\n\nWe have used `\"blue\"` at stop value 0—or\
    \ coordinate (0,0)—and `\"yellow\"` at stop value 1—or coordinate (400,0). The\
    \ browser uses the values to define a smooth color gradient from blue to yellow.\n\
    \nYou can add any number of gradient stops. For example, a `\"red\"` color stop\
    \ at stop value 0.5 would create a smooth gradient from blue, to red at the mid-point\
    \ (200px), to yellow at the end.\n\n## Radial Gradients\n\nNow let's look at a\
    \ radial gradient:\n\n```javascript\n// create radial gradient\nvar grd = ctx.createRadialGradient(150,100,10,180,120,200);\n\
    grd.addColorStop(0,\"blue\");\ngrd.addColorStop(1,\"yellow\");\n\n// fill with\
    \ gradient\nctx.fillStyle = grd;\nctx.fillRect(0,0,300,150);\n```\n\nThe `createRadialGradient`\
    \ parameters are:\n\n*   the x and y coordinates of the starting circle\n*   the\
    \ radius of the starting circle\n*   the x and y coordinates of the ending circle\n\
    *   the radius of the ending circle\n\nThe result is shown in [Figure 15.3](#ch15.html_linearexample\
    \ \"Figure 15.3. Our linear blue-yellow gradient\").\n"
  raw: "In this short chapter, we'll look at creating code that tells the browser\
    \ how to behave if it doesn't support canvas rendering.\n\n## Create Alternative\
    \ Content\n\nThe best way to handle the possibility that a user's browser doesn't\
    \ support canvas is to place alternative content within the `<canvas>` tag. This\
    \ does away with confusion for the end user if they can't see what's supposed\
    \ to be displayed.\n\nYou can use an `img` tag, explanatory text, or any other\
    \ HTML you think necessary for this alternative content. For example:\n\n```\n\
    <canvas id=\"MyCanvas\" width=\"150\" height=\"300\">\n  <img src=\"http://yoursite.com/locationofimage.jpg\"\
    \ \n  ↵alt=\"Browser Not Supported\" />\n</canvas>\n```\n\nIf the browser supports\
    \ `canvas`, the `img` tag and any other content between the `<canvas>` and `</canvas>`\
    \ tags are ignored and won't appear in the document.\n\nHow useful you want to\
    \ make fallback content is up to you; you can offer a download link to the latest\
    \ version of the user's browser, or you can add a framework that'll allow you\
    \ to show the content using a different technology, such as SVG or Flash.\n\n\
    You can also use the `getContext` method to check for canvas support in JavaScript,\
    \ e.g.\n\n```\nfunction supports_canvas() {\n  return !!document.createElement('canvas').getContext;\n\
    }\n```\n\nAlternatively, you can use the `getContext` method on an existing element:\n\
    \n```\nvar canvas = document.createElement(\"MyCanvas\");\nif (!canvas.getContext\
    \ || !canvas.getContext(\"2d\")) {\n    alert(\"Sorry - canvas is not supported.\"\
    );\n}\nelse {\n    // start drawing\n    var ctx = canvas.getContext('2d');\n\
    }\n```\n\n# Chapter 15\n\nCanvas & SVG: Canvas Gradients\n\nWith HTML5 `canvas`,\
    \ you're not limited to block colors, but can use gradients to fill shapes such\
    \ as rectangles and circles. There are two different types of gradient you can\
    \ use:\n\n```\n// create a linear gradient\ncreateLinearGradient(x,y,x1,y1)\n\
    ```\n\n![An example of a linear gradient](figures/gradient_example_1.png)\n\n\
    Figure 15.1. An example of a linear gradient\n\n```\n// create a radial gradient\n\
    createRadialGradient(x,y,r,x1,y1,r1)\n```\n\n![An example of a radial gradient](figures/radial_gradient_2.png)\n\
    \nFigure 15.2. An example of a radial gradient\n\nLet's start by creating a linear\
    \ gradient (the canvas context, `ctx`, has already been defined):\n\n```\n// create\
    \ linear gradient\nvar grd = ctx.createLinearGradient(0,0,400,0);\ngrd.addColorStop(0,\"\
    blue\");\ngrd.addColorStop(1,\"yellow\");\n\n// fill with gradient\nctx.fillStyle\
    \ = grd;\nctx.fillRect(40,20,300,160);\n```\n\nThe result is shown in [Figure 15.3](#ch15.html_linearexample\
    \ \"Figure 15.3. Our linear blue-yellow gradient\").\n\n![Our linear blue-yellow\
    \ gradient](figures/canvasGRADIENTBY.png)\n\nFigure 15.3. Our linear blue-yellow\
    \ gradient\n\nThe first line `var grd = ctx.createLinearGradient(0,0,400,0);`\
    \ creates a `CanvasGradient` object which defines a gradient between two sets\
    \ of coordinates (x1,y1,x2,y2). These determine the size and direction of the\
    \ gradient. In our example, we use (0,0) to (400,0) which results in a horizontal\
    \ gradient which is 400 pixels in width. If our box was wider, the last color\
    \ would extend accordingly.\n\nIf we required a 300px vertical gradient, we would\
    \ use:\n\n```\nvar grd = ctx.createLinearGradient(0,0,0,300);\n```\n\nA 45-degree\
    \ diagonal gradient in a 100x100px space would be defined as:\n\n```\nvar grd\
    \ = ctx.createLinearGradient(0,0,100,100);\n```\n\nWe can now set the color values\
    \ at certain **color stop** points within that gradient using the `addColorStop`\
    \ method. It is passed two values:\n\n*   a stop value between `0` (the left-most\
    \ end of the linear gradient) and `1` (the right-most end of the gradient)\n\n\
    *   a color\n\nWe have used `\"blue\"` at stop value 0—or coordinate (0,0)—and\
    \ `\"yellow\"` at stop value 1—or coordinate (400,0). The browser uses the values\
    \ to define a smooth color gradient from blue to yellow.\n\nYou can add any number\
    \ of gradient stops. For example, a `\"red\"` color stop at stop value 0.5 would\
    \ create a smooth gradient from blue, to red at the mid-point (200px), to yellow\
    \ at the end.\n\n## Radial Gradients\n\nNow let's look at a radial gradient:\n\
    \n```\n// create radial gradient\nvar grd = ctx.createRadialGradient(150,100,10,180,120,200);\n\
    grd.addColorStop(0,\"blue\");\ngrd.addColorStop(1,\"yellow\");\n\n// fill with\
    \ gradient\nctx.fillStyle = grd;\nctx.fillRect(0,0,300,150);\n```\n\nThe `createRadialGradient`\
    \ parameters are:\n\n*   the x and y coordinates of the starting circle\n\n* \
    \  the radius of the starting circle\n\n*   the x and y coordinates of the ending\
    \ circle\n\n*   the radius of the ending circle\n\nOur code produces the output\
    \ seen in [Figure 15.4](#ch15.html_radialfill \"Figure 15.4. A radial gradient\"\
    ). You can experiment with different values to create interesting effects.\n\n\
    ![A radial gradient](figures/canvasRADIALFILL.png)\n\nFigure 15.4. A radial gradient\n\
    \n## Playing with the Color Stops\n\nLet's modify the linear gradient code we\
    \ created above and go a little crazy with adding some color stops:\n\n```\nvar\
    \ grd = ctx.createLinearGradient(35,25,25,190,105,50);\ngrd.addColorStop(0,\"\
    red\");\ngrd.addColorStop(0.25,\"blue\");\ngrd.addColorStop(0.3,\"yellow\");\n\
    grd.addColorStop(0.35,\"magenta\");\ngrd.addColorStop(0.4,\"green\");\ngrd.addColorStop(0.45,\"\
    pink\");\ngrd.addColorStop(0.5,\"gray\");\ngrd.addColorStop(1,\"white\");\n\n\
    // Fill with gradient\nctx.fillStyle=grd;\nctx.fillRect(20,20,400,400);\n```\n\
    \nThe results are shown in [Figure 15.5](#ch15.html_crazylinear \"Figure 15.5. A\
    \ crazy linear gradient\").\n\n![A crazy linear gradient](figures/canvasMULTILINEAR.png)\n\
    \nFigure 15.5. A crazy linear gradient\n\nTo create a radial gradient using the\
    \ same colors you could modify one line as follows:\n\n```\nvar grd=ctx.createRadialGradient(35,25,25,190,105,50);\n\
    ```\n\nwhich would display a pretty groovy effect, as shown in [Figure 15.6](#ch15.html_crazyradial\
    \ \"Figure 15.6. A crazy radial fill\"):\n\n![A crazy radial fill](figures/canvasMULTIRADIAL.png)\n\
    \nFigure 15.6. A crazy radial fill\n\n# Chapter 16\n\nCanvas & SVG: Canvas Images\
    \ and Videos\n\nYou can use bitmap images and video with canvas. In this chapter,\
    \ we’ll look at how you can copy images and videos onto your canvas.\n\n## Images\n\
    \nYou can copy a pre-defined bitmap image to your canvas using the `drawImage()`\
    \ method. The same method can also be used to draw part of an image or alter its\
    \ size. You can position the image on the `canvas` much in the same way as you\
    \ would draw a line:\n\n```\nvar c = document.getElementById(\"MyCanvas\");\n\
    var ctx=c.getContext(\"2d\");\nvar img = document.getElementById(\"yourimage\"\
    );\nctx.drawImage(img,10,10);\n```\n\nAs you can see here, the image (which is\
    \ on our page with the ID \"`yourimage`\") is positioned at the x,y coordinates\
    \ passed in the method: `ctx.drawImage(img,x,y)`.\n\nYou can specify the size\
    \ of the image by adding width and height, like this:\n\n```\nctx.drawImage(img,x,y,width,height);\n\
    ```\n\nTo crop the image and position the cropped part only:\n\n```\nctx.drawImage(img,sx,sy,swidth,sheight,x,y,width,height);\n\
    ```\n\nIn the code above, the `sx` and `sy` coordinates dictate where to begin\
    \ cropping the image, and `swidth` and `sheight` dictate the dimensions of the\
    \ image.\n\n### Using the `image()` Object\n\nThe above example assumes that the\
    \ image is on the page already. You may find it preferable to load the image dynamically\
    \ using JavaScript.\n\n```\n// canvas set-up\nvar canvas = document.getElementById('MyCanvas');\n\
    var ctx = canvas.getContext('2d');\n\n// load image from a URL\nvar img = new\
    \ Image();\nimg.src = \"http://mydomain.com/image1.png\";\n\n// is image loaded?\n\
    if (img.complete) addToCanvas();\nelse img.onload = addToCanvas;\n\n// add image\
    \ to canvas\nfunction addToCanvas() {\n    ctx.drawImage(img,10,10);\n}\n```\n\
    \n## Video\n\nThe content of an HTML5 `video` element can also be copied to a\
    \ canvas. You may want to do this so you can overlay additional text or apply\
    \ processing effects.\n\n```\nvar video = document.createElement(\"video\");\n\
    video.src = \"yourvideo.mp4\";\nvideo.controls = true;\n```"
