    \ good idea to begin testing and experimenting with one filter at a time, otherwise\
    \ you could end up with some pretty weird-looking images. For a comprehensive\
    \ overview and sample code on filters, take a look at the [SVG/Essentials Filters](http://commons.oreilly.com/wiki/index.php/SVG_Essentials/Filters)\
    \ page on O'Reilly Commons.\n\nBelow is an example of the code used to create\
    \ a circle (which you've already learned how to create) with the `feGaussianBlur`\
    \ filter applied. You can see the output in [Figure 20.1](#ch20.html_gaussian\
    \ \"Figure 20.1. A circle with the Gaussian blur filter applied\").\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <svg xmlns=\"http://www.w3.org/2000/svg\" version=\"\
    1.1\">\n  <defs>\n    <filter id=\"f1\" x=\"0\" y=\"0\">\n      <feGaussianBlur\
    \ stdDeviation=\"14\"/>\n    </filter>\n  </defs>\n\n  <circle cx=\"200\" cy=\"\
    200\" r=\"200\" stroke=\"red\"\n  ↵stroke-width=\"5\" fill=\"gold\" filter=\"\
    url(#f1)\" />\n\n  </svg>\n</body>\n</html>\n```\n\n![A circle with the Gaussian\
    \ blur filter applied](figures/GaussianBlur.png)\n\nFigure 20.1. A circle with\
    \ the Gaussian blur filter applied\n\n### Playing with Filters\n\nAs you can see,\
    \ you'll have to give the filter an ID so that this can later be specified in\
    \ the circle: `filter=\"url(#f1)`. The parameter that's associated with this filter\
    \ is `stdDeviation`; this controls the amount of blurring. So, for example, if\
    \ you were to set the `stdDeviation` to a value of `1`, then you would get such\
    \ a minimal amount of blurring as to be hardly noticeable. However, if you were\
    \ to set this to, say, 200, then it creates a blurring effect that's almost transparent.\
    \ And as we've applied a red stroke to the image (which you can't really see in\
    \ the example above), this effect fills the SVG canvas with an extremely blurred\
    \ circle, as shown in [Figure 20.2](#ch20.html_blurry \"Figure 20.2. A very blurry\
    \ circle\")\n\n![A very blurry circle](figures/stdDeviation.png)\n\nFigure 20.2. A\
    \ very blurry circle\n\nIf you were to apply a lower value, then the blurring\
    \ wouldn't be so apparent and would allow the stroke to be seen as an orange color\
    \ with the yellow blurring into the red, as shown in [Figure 20.3](#ch20.html_filter3\
    \ \"Figure 20.3. A less blurry circle\").\n\n![A less blurry circle](figures/Filter3.png)\n\
    \nFigure 20.3. A less blurry circle\n\nLet's try combining filter effects. We'll\
    \ create a drop shadow using the `feOffset` filter; this is achieved by taking\
    \ the relevant SVG image or element and moving it in the x-y plane. We'll use\
    \ the `feBlend` and `feOffset` elements, which will create a duplicate image that's\
    \ slightly offset from the original, to create the effect that one image is sitting\
    \ behind the other, as shown in [Figure 20.4](#ch20.html_multifilter \"Figure 20.4. Using\
    \ multiple filters\").\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n  <svg xmlns=\"\
    http://www.w3.org/2000/svg\" version=\"1.1\">\n    <defs>\n      <filter id=\"\
    f1\" x=\"0\" y=\"0\" width=\"200%\" height=\"200%\">\n        <feOffset result=\"\
    offOut\"  dx=\"25\" dy=\"20\" />\n        <feBlend in=\"SourceGraphic\" in2=\"\
    offOut\" mode=\"normal\" />\n      </filter>\n    </defs>\n\n    <polygon points=\"\
    220,10 300,210 170,250 123,234\" fill=\"blue\"\n     ↵stroke=\"purple\" stroke-width=\"\
    3\" filter=\"url(#f1)\" />\n\n  </svg>\n</body>\n</html> \n```\n\n![Using multiple\
    \ filters](figures/Filtermulti.png)\n\nFigure 20.4. Using multiple filters\n\n\
    Filters can help you to create excellent effects. For example, if we were to apply\
    \ `feGaussianBlur` to the above, then you could blur the rear image to create\
    \ a kind of 3D effect."
