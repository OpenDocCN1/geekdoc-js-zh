  trans: "\n现在我们已经将全局变量 `databaseObj` 设置为我们的数据库对象，就可以使用 `databaseObj` 来执行事务了。\n\n\
    ## 添加对象存储\n\n创建数据库不会让它自动执行任何操作。要开始存储数据，你必须至少创建一个 `object store`（对象存储）。如果你熟悉 SQL\
    \ 数据库，对象存储类似于 SQL 表。对象存储是我们存储 `records`（记录）或条目的的地方。IndexedDB 数据库可以包含多个对象存储。\n\n\
    要添加对象存储，我们首先需要触发 `version change`（版本更改）。要触发版本更改，版本参数（第二个参数）需要大于数据库当前的版本值。对于应用程序的首次发布，此值可以设为\
    \ `1`。\n\n当数据库版本号增加（或首次设置）时，浏览器将触发 `upgradeneeded` 事件。任何结构性更改——添加对象存储、向对象存储添加索引——都必须在\
    \ `onupgradeneeded` 事件处理方法中进行：\n\n```\nidb.onupgradeneeded = function(event){\n\
    \    // Change the database.\n}\n```\n\n让我们创建一个名为 `entries` 的对象存储。为了做到这一点，我们需要使用数据库对象的\
    \ `createObjectStore` 方法：\n\n```\nidb.onupgradeneeded = function(event){\n  try\
    \ {\n    event.target.result.createObjectStore(\n      ['entries'],\n      { keyPath:\
    \ 'entrydate' }\n    );\n  } catch(error) {}\n}\n```\n\n如果对象存储不存在，它将被创建。如果它已存在，浏览器将触发一个约束错误（constraint\
    \ error）。我们将其封装在 `try`-`catch` 块中，以便在发生错误时静默处理。但我们也可以使用 `onerror` 事件属性设置事件处理器：\n\
    \n```\nidb.onerror = function(event){\n    // Log the error to the console, or\
    \ alert the user\n}\n```\n\n至少，`createObjectStore` 需要一个名称参数。它必须是一个字符串，但该字符串不能包含任何空格。第二个参数是可选的，但它必须是一个\
    \ `dictionary`（字典）。字典是具有定义属性和值的对象。对于 `createObjectStore`，这些属性和值如下：\n\n*   `autoIncrement`:\
    \ 必须为 `true` 或 `false`；为存储中的每条记录自动生成键和索引。默认值为 `false`。\n*   `keyPath`: 指定使用哪个对象的属性作为存储中每条记录的索引。默认值为\
    \ `null`。使命名的字段成为必填字段。\n\n在这里，我们选择设置 `keyPath`。这意味着我们添加到数据库的每个对象都需要包含一个 `entrydate`\
    \ 属性，且 `entrydate` 属性的值将成为我们的键。\n\n你不必设置 `autoIncrement` 或 `keyPath`。可以在不设置它们的情况下添加我们的对象存储。如果你选择不设置其中任何，则*必须*为存储的每条记录设置一个键。我们将在下一节讨论这一点。\n\
    \n注意，我们没有在 `onupgradeneeded` 回调中使用我们的 `databaseObj` 变量？这是因为 `onupgradeneeded`\
    \ 回调是在版本更改时触发的。\n\n"
- fmt: "\nAs with any transaction, the first step is to create a transaction object.\
    \ Next, select the store. Finally, open a `cursor` with the `openCursor` method.\
    \ A cursor is an object consisting of a range of records. It’s a special mechanism\
    \ that lets us iterate over a collection of records:\n\n```javascript\nfunction\
    \ showAllEntries(){\n  var transaction, objectstore, cursor;\n\n  transaction\
    \ = databaseObj.transaction(['entries'],'readonly');\n  objectstore = transaction.objectStore('entries');\n\
    \  cursor      = objectstore.openCursor();\n};\n```\n\nSince we want to show our\
    \ entries once this transaction completes, let’s add an `onsuccess` handler to\
    \ our cursor operation:\n\n```javascript\nfunction showAllEntries(){\n  var transaction,\
    \ objectstore, cursor;\n\n  transaction = databaseObj.transaction(['entries'],'readonly');\n\
    \  objectstore = transaction.objectStore('entries');\n  cursor      = objectstore.openCursor();\n\
    \n  cursor.onsuccess = function(successEvent) {\n    var resultset = successEvent.target.result;\n\
    \    if( resultset ){\n      buildList( resultset.value );\n    }\n    resultset.continue();\n\
    \  };\n};\n```\n\nWithin this handler, we’re passing each result of our search\
    \ to a `buildList` function. We won’t discuss that function here, but it is included\
    \ in this chapter’s code sample.\n\nThat final line―`resultset.continue()`―is\
    \ how we iterate over our result set. The `onsuccess` handler is called once for\
    \ the entire transaction, but this transaction may return multiple results. The\
    \ `continue` method advances the cursor until we’ve iterated over each record.\n\
    \n### Retrieving a Subset of Records\n\nWith IndexedDB, we can also select a subset\
    \ or `range` of records by passing a key range to the `openCursor()` method.\n\
    \nKey ranges are created with the `IDBKeyRange` object. `IDBKeyRange` is what’s\
    \ known as a `static` object, and it’s similar to the way the `Math()` object\
    \ works. Just as you’d type `Math.round()` rather than `var m = new Math()`, with\
    \ `IDBKeyRange`, you must always use `IDBKeyRange.methodName()`.\n\nIn this example,\
    \ we’re only setting a lower boundary using the `lowerBound` method. Its value\
    \ should be the lowest key value we want to retrieve. In this case, we’ll use\
    \ `0` since we want to retrieve all the records in our object store, starting\
    \ with the first one:\n\n```javascript\nobjectstore.openCursor(IDBKeyRange.lowerBound(0));\n\
    ```\n\nIf we wanted to set an upper limit instead, we could use the `upperBound`\
    \ method. It also accepts one argument, which must be the highest key value we\
    \ want to retrieve for this range:\n\n```javascript\nobjectstore.openCursor(IDBKeyRange.upperBound(1385265768757));\n\
    ```\n\nBy default, `openCursor` sorts records by key in ascending order. We can\
    \ change the direction of the cursor and its sorting direction, however, by adding\
    \ a second argument. This second argument may be one of four values:\n\n* `next`:\
    \ puts the cursor at the beginning of the source, causing keys to be sorted in\
    \ ascending order\n\n* `prev`: short for “previous”, it places the cursor at the\
    \ end of the source, causing keys to be sorted in descending order\n\n* `nextunique`:\
    \ returns unique values sorted by key in ascending order\n\n* `prevunique`: returns\
    \ unique values sorted by key in descending order\n\nTo display these entries\
    \ in descending order (newest entry first), change `objectstore.openCursor(IDBKeyRange.lowerBound(0))`\
    \ to `objectstore.openCursor(IDBKeyRange.lowerBound(0), 'prev')`.\n\n### Retrieving\
    \ or Deleting Individual Entries\n\nBut what if we wanted to retrieve just a single\
    \ entry instead of our entire store? For that, we can use the `get` method:\n\n\
    ```javascript\nvar transaction, objectstore, request;\n\ntransaction    = databaseObj.transaction(['entries'],'readonly');\n\
    objectstore = transaction.objectStore('entries');\nrequest = request.get(1);\n\
    \nrequest.onsuccess = function(event) {\n  var result = event.target.result;\n\
    \  console.log(result);\n};\n```\n\nWhen we want to delete an entry, we use the\
    \ `delete` method:\n\n```javascript\nvar transaction, objectstore, request;\n\n\
    transaction    = databaseObj.transaction(['entries'],'readwrite');\nobjectstore\
    \ = transaction.objectStore('entries');\nrequest = objectstore.delete(1);\n\n\
    request.onsuccess = function(event) {\n  console.log(\"Entry deleted\");\n};\n\
    ```\n\n### Updating Records\n\nWhen we want to update an entry, we use the `put`\
    \ method. This replaces the entire object with the new one.\n\n```javascript\n\
    var transaction, objectstore, request;\n\ntransaction    = databaseObj.transaction(['entries'],'readwrite');\n\
    objectstore = transaction.objectStore('entries');\nrequest = objectstore.put({id:\
    \ 1, name: 'New Name'});\n\nrequest.onsuccess = function(event) {\n  console.log(\"\
    Entry updated\");\n};\n```\n\n### Deleting a Database\n\nDeleting a database is\
    \ just as easy as opening one. It doesn’t require using a callback. Just call\
    \ the `deleteDatabase` method of the IndexedDB object:\n\n```javascript\nindexedDB.deleteDatabase('myIDB');\n\
    ```\n\nIt accepts one argument: the name of the database you wish to delete. Use\
    \ it with caution.\n\n### Wrapping Up and Learning More\n\nWith offline technologies,\
    \ you can develop applications that work without an internet connection. We’ve\
    \ covered the basics of offline applications in this book. If you’d like to learn\
    \ more about any of these topics, a good place to start is with [WebPlatform.org.](http://webplatform.org/)\
    \ It features tutorials and documentation on HTML5, CSS, JavaScript and web APIs.\n\
    \nVendor-specific sites also have a wealth of information, particularly for documenting\
    \ browser-specific quirks. Yet, Google’s [HTML5Rocks.com](http://html5rocks.com/)\
    \ and the Mozilla Developer Network, mentioned above, are particularly good at\
    \ documenting new technologies in their browsers while also addressing other vendors’\
    \ implementations. The [Microsoft Developer Network](http://msdn.microsoft.com/)\
    \ includes a wealth of documentation about web technologies, especially as supported\
    \ in Edge.\n\nTo track specifications, pay attention to the [World Wide Web Consortium\
    \ (W3C)](http://w3.org/) and the [Web Hypertext Application Technology Working\
    \ Group (WHATWG).](http://whatwg.org/) These bodies develop specifications and\
    \ documentation for current and future APIs.\n\nAnd of course, you can always\
    \ visit [Learnable.com](https://learnable.com/) or [SitePoint.com](http://www.sitepoint.com/)\
    \ to stay up to date on web technologies.\n"
  raw: "As with any transaction, the first step is to create a transaction object.\
    \ Next, select the store. Finally, open a **cursor** with the `openCursor` method.\
    \ A cursor is an object consisting of a range of records. It’s a special mechanism\
    \ that lets us iterate over a collection of records:\n\n```\nfunction showAllEntries(){\n\
    \  var transaction, objectstore, cursor;\n\n  transaction = databaseObj.transaction(['entries'],'readonly');\n\
    \  objectstore = transaction.objectStore('entries');\n  cursor      = objectstore.openCursor();\n\
    };\n```\n\nSince we want to show our entries once this transaction completes,\
    \ let’s add an `onsuccess` handler to our cursor operation:\n\n```\nfunction showAllEntries(){\n\
    \  var transaction, objectstore, cursor;\n\n  transaction = databaseObj.transaction(['entries'],'readonly');\n\
    \  objectstore = transaction.objectStore('entries');\n  cursor      = objectstore.openCursor();\n\
    \n  cursor.onsuccess = function(successEvent) {\n    var resultset = successEvent.target.result;\n\
    \    if( resultset ){\n      buildList( resultset.value );\n    }\n    resultset.continue();\n\
    \  };\n};\n```\n\nWithin this handler, we’re passing each result of our search\
    \ to a `buildList` function. We won’t discuss that function here, but it is included\
    \ in this chapter’s code sample.\n\nThat final line―`resultset.continue()`―is\
    \ how we iterate over our result set. The `onsuccess` handler is called once for\
    \ the entire transaction, but this transaction may return multiple results. The\
    \ `continue` method advances the cursor until we’ve iterated over each record.\n\
    \n### Retrieving a Subset of Records\n\nWith IndexedDB, we can also select a subset\
    \ or ***range*** of records by passing a key range to the `openCursor()` method.\n\
    \nKey ranges are created with the `IDBKeyRange` object. `IDBKeyRange` is what’s\
    \ known as a ***static*** object, and it’s similar to the way the `Math()` object\
    \ works. Just as you’d type `Math.round()` rather than `var m = new Math()`, with\
    \ `IDBKeyRange`, you must always use `IDBKeyRange.methodName()`.\n\nIn this example,\
    \ we’re only setting a lower boundary using the `lowerBound` method. Its value\
    \ should be the lowest key value we want to retrieve. In this case, we’ll use\
    \ `0` since we want to retrieve all the records in our object store, starting\
    \ with the first one:\n\n```\nobjectstore.openCursor(IDBKeyRange.lowerBound(0));\n\
    ```\n\nIf we wanted to set an upper limit instead, we could use the `upperBound`\
    \ method. It also accepts one argument, which must be the highest key value we\
    \ want to retrieve for this range:\n\n```\nobjectstore.openCursor(IDBKeyRange.upperBound(1385265768757));\n\
    ```\n\nBy default, `openCursor` sorts records by key in ascending order. We can\
    \ change the direction of the cursor and its sorting direction, however, by adding\
    \ a second argument. This second argument may be one of four values:\n\n*   `next`:\
    \ puts the cursor at the beginning of the source, causing keys to be sorted in\
    \ ascending order\n\n*   `prev`: short for “previous”, it places the cursor at\
    \ the end of the source, causing keys to be sorted in descending order\n\n*  \
    \ `nextunique`: returns unique values sorted by key in ascending order\n\n*  \
    \ `prevunique`: returns unique values sorted by key in descending order\n\nTo\
    \ display these entries in descending order (newest entry first), change `objectstore.openCursor(IDBKeyRange.lowerBound(0))`\
    \ to `objectstore.openCursor(IDBKeyRange.lowerBound(0), 'prev')`.\n\n## Retrieving\
    \ or Deleting Individual Entries\n\nBut what if we wanted to retrieve just a single\
    \ entry instead of our entire store? For that, we can use the `get` method:\n\n\
    ```\nvar transaction, objectstore, request;\n\ntransaction    = databaseObj.transaction(['entries'],'readonly');\n\
    objectstore    = transaction.objectStore('entries');\nrequest        = objectstore.get(key_of_entry_to_retrieve);\n\
    \nrequest.onsuccess = function(event){\n    // display event.target.result\n}\n\
    ```\n\nWhen this transaction successfully completes, we can do something with\
    \ the result.\n\nTo delete a record, use the `delete` method. Its argument should\
    \ also be the key of the object to delete:\n\n```\nvar transaction, objectstore,\
    \ request;\n\ntransaction = databaseObj.transaction(['entries'],'readwrite');\n\
    objectstore = trans.objectStore('entries');\nrequest     = objectstore.delete(1384911901899);\n\
    \nrequest.onsuccess = function(event){\n    // Update the user interface or take\
    \ some other action.\n}\n```\n\nUnlike retrieval operations, deletions are write\
    \ operations. Use `readwrite` for this transaction type, instead of `readonly`.\n\
    \n## Updating a Record\n\nTo update a record, we can once again use the `put`\
    \ method. We just need to specify which entry we’re updating. Since we’ve set\
    \ a `keyPath`, we can pass an object with the same `entrydate` value to our `put`\
    \ method:\n\n```\nvar transaction, objectstore, request;\n\ntransaction = databaseObj.transaction(['entries'],'readwrite');\n\
    objectstore = trans.objectStore('entries');\nrequest     = objectstore.put(\n\
    \  {\n    entrydate: 1384911901899,\n    entry: 'Updated value for key 1384911901899.'\n\
    \  }\n);\n\nrequest.onsuccess = function(event){\n    // Update the user interface\
    \ or take some other action.\n}\n```\n\nThe browser will update the value of the\
    \ record whose key is `1384911901899`, as shown in [Figure 25.3](#ch25.html_updated\
    \ \"Figure 25.3. The updated value for our key\").\n\n![The updated value for\
    \ our key](figures/updating-values.png)\n\nFigure 25.3. The updated value for\
    \ our key\n\nUpdates, like additions, are write operations. When creating an update\
    \ transaction, the second parameter of the `transaction` method must be `readwrite`.\n\
    \nBe careful when using `put` for updates. Updates replace the *entire* object\
    \ value with the new one. You aren’t simply overwriting individual object properties;\
    \ you’re actually replacing the whole record.\n\n## Deleting a Database\n\nDeleting\
    \ a database is just as easy as opening one. It doesn’t require using a callback.\
    \ Just call the `deleteDatabase` method of the IndexedDB database object:\n\n\
    ```\nidb.deleteDatabase('myIDBJournal');\n```\n\nIt accepts one argument: the\
    \ name of the database you wish to delete. Use it with caution.\n\nWe’ve covered\
    \ enough to get you started with IndexedDB, but there’s more to the API than can\
    \ be covered in a single chapter. [The Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/IndexedDB)\
    \ has the most robust documentation available to date, including coverage of older\
    \ versions of the API.\n\n## Wrapping Up and Learning More\n\nWith offline web\
    \ technologies, you can develop applications that work without an internet connection.\
    \ We’ve covered the basics of offline applications in this book. If you’d like\
    \ to learn more about any of these topics, a good place to start is with the W3C’s\
    \ [WebPlatform.org.](http://webplatform.org/) It features tutorials and documentation\
    \ on HTML5, CSS, JavaScript and web APIs.\n\nVendor-specific sites also have a\
    \ wealth of information, particularly for documenting browser-specific quirks.\
    \ Yet Google’s [HTML5Rocks.com](http://html5rocks.com/) and the Mozilla Developer\
    \ Network, mentioned above, are particularly good at documenting new technologies\
    \ in their browsers while also addressing other vendors’ implementations. The\
    \ [Microsoft Developer Network](http://msdn.microsoft.com/) includes a wealth\
    \ of documentation about web technologies, especially as supported in Internet\
    \ Explorer.\n\nTo track specifications, pay attention to the [World Wide Web Consortium\
    \ (W3C)](http://w3.org/) and the [Web Hypertext Application Technology Working\
    \ Group (WHATWG).](http://whatwg.org/) These bodies develop specifications and\
    \ documentation for current and future APIs.\n\nAnd of course, you can always\
    \ visit [Learnable.com](https://learnable.com/) or [SitePoint.com](http://www.sitepoint.com/)\
    \ to stay up to date on web technologies.\n\n# Chapter 26\n\nAPIs: Overview"
