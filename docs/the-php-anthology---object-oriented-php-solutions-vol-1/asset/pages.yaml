    # Avoid output in classes


    Instead of get, we could have endowed the Page class with a method called write
    to send the code to the browser immediately. This would have made the code above
    slightly simpler, the main script would not have to get the code from the object
    and echo it itself for reason.


    It''s usually a bad idea to output directly from inside a class (with statements
    and functions like echo and printf()); doing so would reduce the flexibility of
    your classes. Allowing the value to be retrieved from the class gives you the
    option of performing additional transformations before you send it to the browser,
    or use it for some other purpose (like putting it in an email!)


