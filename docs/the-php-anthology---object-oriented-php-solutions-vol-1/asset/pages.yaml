- img_proc: true
  md: '# Chapter 3: PHP and MySQL


    expressions (the same as PHP’s ereg functions). Using the RLIKE operator, we

    compare a column by a regular expression:


    ```

    SELECT FROM articles WHERE title RLIKE ''^How ''

    ```


    The above statement also selects every article in which the title begins with
    "How"

    followed by a space.


    With some work, these operators provide everything needed to explore your data.

    Where the above approach becomes a burden is in performing a search against

    multiple columns. For example:


    ```

    SELECT * articles

    WHERE title LIKE ''%how%'' OR body LIKE ''%%how%''

    ```


    For larger tables, this can require you to write some very complicated and unpleasant

    ant queries.


    # FULLTEXT Searches


    MySQL provides an alternative that does most of the work for you—the FULLTEXT

    index. Indexes in a database are much like the index of a book; they provide a

    means to locate information within the database quickly from an organized list.

    A FULLTEXT index allows you to search for particular words.


    FULLTEXT indexes were introduced to MySQL with version 3.23. The implementation

    at this point was fairly limited but still useful for basic searching, which is

    what I’ll demonstrate here. In MySQL 4.0.1, this functionality was extended

    nto a full Boolean search mechanism that gives you the ability to build

    some like Google’s advanced search features. FULLTEXT indexes also allow

    each result to be returned with a “relevance” value so that, for example, the
    results

    of multiple word searches can be displayed in terms of how each result

    matches your user’s particular search.


    To take advantage of FULLTEXT indexes, you first need to instruct MySQL to

    begin an index of the columns you want to search:


    ```

    ALTER TABLE articles FULLTEXT art_search (title, body, author)

    ```


    Once you’ve done that, you need to INSERT a new record (or modify an existing

    one) to MySQL to build the index. You also need at least three records in

    the database for FULLTEXT searches, because non-Boolean searches will

    only return results if the search string occurs in less than 50% of the rows in'
