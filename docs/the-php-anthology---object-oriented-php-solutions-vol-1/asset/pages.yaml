  md: "# Chapter 3: PHP and MySQL\n\nMySQL Although PostgreSQL is arguably the better\
    \ database, in it supports more of the features that are common to relational\
    \ databases, MySQL is better supported on Windows, and is a popular choice among\
    \ Web hosts that provide support for PHP. These factors combine to make PHP and\
    \ MySQL a very popular combination. This book is geared to the use of MySQL with\
    \ PHP but it is important to remember that there are alternatives with full support\
    \ for features such as stored procedures, triggers and constraints, many of which\
    \ become important for applications with complex data structures.\n\nThis chapter\
    \ covers all the common operations PHP developers have to perform working with\
    \ MySQL, from retrieving and modifying data, to searching and backing up a database.\
    \ The examples focus on using a single table, so no discussion is made about table\
    \ relationships. For a full discussion of table relationships, see Kevin Yank's\
    \ Build Your Own Database Driven Website Using PHP & MySQL (ISBN 0-9579218-0),\
    \ or see an example of them in practice when we deal with users in Volume II,\
    \ Chapter 1.\n\nThe examples used here work with a sample database called sitepoint,\
    \ which contains the following table:\n\n```\nCREATE TABLE articles (\n  article_id\
    \ INT(11) NOT NULL AUTO_INCREMENT,\n  title VARCHAR(255) NOT NULL DEFAULT '',\n\
    \  intro TEXT NOT NULL,\n  body TEXT NOT NULL,\n  author VARCHAR(255) NOT NULL\
    \ DEFAULT '',\n  published VARCHAR(11) DEFAULT NULL,\n  public ENUM('0','1') NOT\
    \ NULL DEFAULT '0',\n  PRIMARY KEY (article_id),\n  FULLTEXT KEY article_search\
    \ (title, body, author)\n)\n```\n\nA query to construct this table along with\
    \ sample data is available in the code archive, contained in the file sql/articles.sql.\
    \ The table will be used for examples in later chapters of the book.\n\n# How\
    \ do I access a MySQL database?\n\nConnecting to MySQL with PHP couldn't be easier.\
    \ It's essentially a two-step process; first connect to the MySQL database server\
    \ itself, then inform MySQL the database you want to connect to."
