  md: '/usr/local/bin/php /home/username/scripts/my_script.php


    For Windows, you''d use something like this:


    ```

    c:\php\cli\php.exe c:\scripts\my_script.php

    ```


    Note that in the Windows path above, we used the executable in the cli (command
    line interface) subdirectory of the PHP installation, slightly differently from
    that used Apache to handle web pages. PHP binary releases for Windows since 4.3.0
    place the cli version of the PHP executable in this directory.


    It''s possible to make PHP much easier to use from the command line, though, by
    making some changes to your system''s environment variables. For an in-depth discussion
    see Replacing Perl Scripts with PHP Scripts[8] on PHPBuilder(9).


    Next, point your browser at http://pear.php.net/go-pear, where you''ll see a PHP
    script. This script is used to install the PEAR package manager—the basis you
    will need in order to install all other PEAR packages. Download this to your computer
    (File, Save As) as go-pear.php. From here, you have a number of options.


    Storing go-pear.php wherever your server''s document root directory will allow
    you to run the script as a Web page. This behavior is still experimental, though
    there are no guarantees it''ll work correctly. If you use this approach, make
    sure that the script is not publicly available!


    Better is to execute the go-pear.php script via the command line, for example:


    ```

    /usr/local/bin/php /home/username/pear/go-pear.php

    ```


    Or, on Windows:


    ```

    c:\php\cli c:\pear\go-pear.php

    ```


    This will start an interactive command line interface, which will ask you questions
    about how you would like the "installation prefix" is the directory in which PEAR
    (as well as any packages you install) will be installed, and is referred to as
    $prefix, while $php_dir is the path to your PHP installation (in which go-pear.php
    will put PEAR-related documentation by default, unless you specify otherwise).
    Windows users are aware that


