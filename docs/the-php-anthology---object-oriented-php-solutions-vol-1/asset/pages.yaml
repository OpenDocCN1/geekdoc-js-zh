    This is an example of a variable function. The expression $classNames[0] is evaluated
    to the name of the constructor (PoliteMessage, TerseMessage, or RudeMessage) to
    call.


    Finally, the $messages array contains ten messages, randomly selected, and is
    passed to the constructor of MessageReader on instantiation.


