  md: '# Chapter 2: Object Oriented PHP


    All of these means of passing a variable create a copy of that variable''s value;
    this is called passing by value.


    # Using a Reference


    To pass using a reference, you need to use the reference operator & ampersand).
    For example:


    ```

    <?php

    $color = ''blue'';

    $settings[''color''] = &$color;

    ?>

    ```


    $settings[''color''] now contains a reference to the original $color variable.


    Compare the following examples, the first using PHP''s default copying behavior:


    ```

    <?php

    $color = ''blue'';

    $settings[''color''] = $color; // Makes a copy

    $color = ''red''; // Color changes

    echo $settings[''color'']; // Displays "blue"

    ?>

    ```


    The second involves passing by reference:


    ```

    <?php

    $color = ''blue'';

    $settings[''color''] = &$color; // Makes a reference

    $color = ''red''; // Color changes

    echo $settings[''color'']; // Displays "red"

    ?>

    ```


    Passing by reference allows us to keep the new variable "linked" to the original
    source variable. To change the new variable or the old variable will be reflected
    in both of them.


    So far, you''re probably wondering. "What''s the big deal here? What difference
    does it make whether PHP copies or makes a reference to a variable, as long as
    we get what we expected? For variables passed around a procedural program, however
    rarely had to worry about references. However, when it comes to objects interacting
    with one another, if you don''t pass an object by reference, you may get well
    results you weren''t expecting.


