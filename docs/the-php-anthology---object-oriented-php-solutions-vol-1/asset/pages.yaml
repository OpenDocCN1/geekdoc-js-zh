    # How do I search my table?


    Some people are just impatient; rather than trawling your site navigation system
    you''ve provided, they demand information now! Hence PHP developers like you and
    I are required to implement search features to provide visitors a ''short cut''
    to find the information they want. In days of storing all content in the form
    of HTML files, this could be quite a problem, but now that you''re using a database
    to search, searching becomes much easier.


    # What You LIKE


    The most basic form of search occurs against a single column, with the LIKE operator:


    ```

    SELECT * FROM articles WHERE title LIKE ''How %''

    ```


    The % is a wildcard character. The above statement will select all articles in
    which the title begins with the word "How." MySQL also has support for POSIX regular'
  merge: -1
