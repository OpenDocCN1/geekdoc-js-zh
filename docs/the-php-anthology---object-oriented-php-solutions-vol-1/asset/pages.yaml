    before you do anything with it, such as when you''re splitting results across
    pages or producing statistical information. When selecting results, you can use
    either PHP or MySQL to count the number of rows for you.


    # Counting Rows with PHP


    With PHP, the function mysql_num_rows returns the number of rows selected, but
    its application can be limited when you use unbuffered queries (see "How


