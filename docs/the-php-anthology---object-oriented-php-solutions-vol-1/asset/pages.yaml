- img_proc: true
  md: '# Chapter 1: PHP Basics


    Alternatively, we can enter the full path to another.php, like this:


    ```

    include ''/home/username/www/another.php'';

    ```


    This leaves no doubt as to another.php is located.


    The PHP configuration file .ini also contains the directive include_path. This
    allows you to specify directories from which files can be included, with the need
    to specify their locations when using one of the commands.


    This approach needs to be used with caution, as it may lead to strange results
    if an included file of the same name exists in more than one directory, yet it
    can be an effective means to solve include-related headaches. PHP’s PEAR[25] class
    library, for example, relies on your the directory that contains PEAR’s files
    to the include path. Note that it''s not a good idea to put too many locations
    in your include path, as will slow PHP down when it tries to find the scripts
    you''ve included in your code.


    If you''re using Apache in a shared hosting environment, you may be able to override
    the value of include_path using a .htaccess file.Placed in the directory to which
    you want to apply it (it will also apply to all subdirectories), the file should
    contain something like this:


    ```

    php_value include_path ":/usr/local/lib/php:/home/user/phplib/

    ```


    The same can also be accomplished with the PHP function ini_set, for example:


    ```

    ini_set(''include_path'', ''C:/phplib/'');

    ```


    This allows changes to be made at runtime within a PHP script.


    You''ll find reference to php.ini values in Appendix A.


    # How do I write portable PHP code?


    Not all PHP installations are the same. Depending on version and configuration
    settings in php.ini, your script may may not run correctly on another server where
    PHP is installed. However, there are some good practices you can adopt to make
    life easier and minimize the need to rewrite code for other servers.


    > [25] http://pear.php.net/'
