    \ and your search matches one row, that makes 50%). One final thing to be aware\
    \ of is that FULLTEXT searches will only match searches of more than three letters;\
    \ the indexing mechanism ignores words of three characters or less, to avoid having\
    \ to build a massive index. This is much like the index of a book; you'd be surprised\
    \ to discover in a book's index exactly pages the word \"the\" appeared on!\n\n\
    Here's a basic FULLTEXT search:\n\n```\nSELECT * FROM articles\nWHERE MATCH (title,body,author)\
