    # Call-Time Pass-By-Reference Off


    A reference is like “short cut” to the value of a variable. References are often
    required when we use PHP functions and classes, a subject we will discuss further
    in Chapter 2. When you use a reference to a variable in a function or class method,
    it’s defined as a call-time pass-by-reference Consider this example:


    ```

    $result = myFunction(&$myVariable);

    ```


    Here the & operator tells PHP to use a reference to the variable $my as the argument,
    rather than creating a copy of its value. This is now regarded as bad practice,
    but it can make the job of understanding someone else’s code extremely difficult.


    Switch this off in php.ini using the following command:


    ```

    allow_call_time_pass_reference = Off

    ```


    Alternatively, switch it off in a .htaccess file as follows:


    ```

    php_flag allow_call_time_pass_reference off

    ```


