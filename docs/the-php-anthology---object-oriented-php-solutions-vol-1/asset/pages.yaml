  md: '# 3


    # PHP and MySQL


    > "On the Web today, content is king."

    —Kevin Yank


    In the “old days” of the Internet, most Web pages were nothing more than text
    files containing HTML. When people surfed to your site, your Web server simply
    made the file available to their browser, which parsed the contents and rendered
    something a human being could read. This approach was fine to start with, but
    as Websites grew and issues such as design and navigation became more important,
    developers realized that maintaining hundreds of HTML files was going to be a
    massive headache. To solve this problem, it became popular to separate variable
    content (articles, news items, etc.) from the static elements of the site—its
    design and layout.


    Using a database as a repository to store variable content, a server side language
    as PHP performs the task of fetching the data and placing it within a uniform
    “framework”, the design and layout elements became reused. This means that modifying
    the overall look and feel of a site can be handled as a separate task from the
    addition or maintenance of content. Suddenly, running a Website is no longer a
    task that consumes a developer’s waking hour.


    PHP supports all relational databases worth mentioning, including those commonly
    used in large companies, such as Oracle, IBM’s DB2 and Microsoft’s SQL Server.
    The two most noteworthy open source alternatives are PostgreSQL and'
