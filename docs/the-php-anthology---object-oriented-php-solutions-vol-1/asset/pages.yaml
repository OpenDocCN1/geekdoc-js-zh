  md: '# # Appendix D: Working with PEAR


    PEAR[1], the PHP Extension and Application Repository, is the brainchild of Stig
    Bakken, and was inspired by Perl''s CPAN[2].


    As a project, it was originally conceived in 1999 and reached its first stable
    release in January 2003. It serves two purposes. First, it provides a library
    of PHP classes for solving common "architectural" problems, a number of which
    you''ve seen in this book. Second, under the "PECL" (PHP Extension Code Library),
    PEAR provides a repository for extensions to PHP. PEAR was originally intended
    to store "non standard" extensions that lay on the fringes of PHP, but has since
    evolved into the default repository for all extensions not included in the core
    PHP distribution. Here, I will be concentrating on the PHP classes that PEAR provides.


    Those who submit and maintain the PEAR repository are all volunteers. Originally
    the first stable version of PEAR has seen their numbers grow significantly, and
    receive a greater focus from the PHP community as a whole. There''s still a lot
    of work to do to raise the standards to PHP itself documentation being a key area
    in which there''s still much room for improvement. If you''re struggling, a good
    place to start is PHPKitchen''s list of PEAR Tutorials[3]. Said, PEAR already
    offers significant value in terms of reducing the effort required in developing
    PHP applications.


    But does PEAR actually mean to you? Considering the capabilities of PEAR::SOAP,
    which was covered in Volume II, Chapter 2, attempting to write your own SOAP implementation,
    first writing the "application" code that will use it is clearly a waste of time.
    Browsing the list of packages[4], you''ll see that PEAR provides you many more
    classes, categorized by subject, to help prevent you from reinvent wheels. It''s
    important to understand the focus of PEAR is architectural classes. In other classes,
    PEAR is not Hotscripts; you don''t find applications there; rather, you''ll find
    code that can be reused in many applications. Also important is that the PEAR
    developer community does its best to maintain and support the library, compared
    to say, projects available via SourceForge[5], which are often individual


    +   [1] http://pear.php.net/

    [2] http://www.cpan.org/

    [3] http://www.phpkitchen.com/staticpages/index.php?page=200304120420962

    [4] http://pear.php.net/packages.php

    [5] http://www.sourceforge.net/'
  merge: -1
