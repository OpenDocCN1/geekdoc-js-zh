  md: 'problem may simply be that the underlying directory structure or domain name
    of the Web server is different. It’s common to deal with these types of issues
    by creating a central configuration script that stores all these environment variables.


    PHP also has a number of settings in php.ini that can cause a script to fail on
    another system that are different. I’ll be looking at these in “How do I write
    portable PHP code?"; there’s also summary information in Appendix A.


    # Logic Errors


    Logic errors occur when an application runs as perfectly as the PHP engine is
    concerned, but the code does something other than what you had intended. For example,
    imagine you have a mailing list that you want to send the same message to a few
    of the members of your online forum. To your horror, you discover after executing
    the script that you mailed the entire forum membership twenty times!


    These kinds of problems are the most difficult to find; users of Windows XP will
    be well acquainted with Windows updates—even big companies struggle with logic
    errors.


    Critical to finding logic errors is your ability to test rigorously your code
    in a safe environment that’s separate from your “live” Web server. Frankly, PHP
    and related technologies like Apache and MySQL (if you’re using them) are cross
    platform, which makes putting together an effective development environment easy
    if the underlying operating systems are different.


    You should investigate unit testing, a facet of Extreme Programming (XP), which
    will find an introduction in Volume II, Chapter 6. I’ve also suggested further
    reading at the end of this chapter.


    In Chapter 10, I’ll be taking a look at strategies for handling errors themselves,
    particularly environment errors. we’ll discuss how you can record (or trap) errors
    for your analysis without displaying ugly messages to your applications users.'
