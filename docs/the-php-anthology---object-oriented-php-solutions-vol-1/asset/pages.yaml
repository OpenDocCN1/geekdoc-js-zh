    This allows us to add a further condition to the WHERE clause:


    ```

    SELECT * FROM articles

    WHERE published > 1020204000 AND articles.author = ''Kevin Yank''

    ```


    There are other methods, if these fail to provide what you need,

    can use the query method to execute a hand-coded query. Note that if you find

    yourself needing to use the query method, it might be a good idea to create a

    class of the generated DataObject class, and wrap the query in a useful

    method name that describes it accurately.


    DB_DataObject also deals effectively with table joins, which, although slightly

    more detailed than the example above, is a certain time saver when compared

    with writing complex joins by hand.


    That concludes our short introduction to DB_DataObject, but this section

    have given you a taste of what it can do for you. The big advantage is that it

    m querying your database with SQL far less exhausting and error-prone. Also,

    by centering access to a particular table in a single class, it helps simplify

    dealing with changes to the table structure.


    # Further Reading


    +   * Beginning MySQL: http://www.devshed.com/Server_Side/MySQL/Intro/


