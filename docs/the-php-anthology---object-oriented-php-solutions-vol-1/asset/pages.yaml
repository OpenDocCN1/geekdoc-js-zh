  md: '# How do references work in PHP?


    The member variables appear in the middle area, while methods appear in the bottom
    box. Also, the plus and minus signs are there to indicate which other elements
    of the class are public (+) and which are private (-). Unlike languages such as
    Java, PHP does not enforce privacy on objects;³ in the examples above, we could
