  md: "```\nfunction display($message) {\n  echo $message;\n}\n\n$myMessage = 'Hello\
    \ World!';\n```\n\n// Call time pass by reference - bad practice!\ndisplay($myMessage);\n\
    \nThat's known as a call-time pass-by-reference, which PHP controls with the following\
    \ setting in php.ini:\n\n```\nallow_time_pass_reference = Off\n```\n\nBy default,\
    \ in recent PHP the above setting should be switched to Off; turning it is \"\
    frowned upon\" by PHP's makers. Switched off, PHP will generate warning errors\
    \ every time a function calls an argument should be passed by reference. As such,\
    \ it is good practice to leave this setting off.\n\nThe reason why call pass by\
    \ reference is a \"bad thing\" is that call time passing by reference can make\
    \ code extremely difficult to follow. I occasionally seen PHP XML parsers written\
    \ using a call-time pass-by-reference—it nearly impossible to gain any idea of\
    \ what is going on.\n\nThe \"decision\" as to whether a variable is passed by\
    \ reference or is not one that belongs to the function being called, not the code\
    \ that calls it. The above code written correctly would look like this:\n\n```\n\
    // Accept by reference - good practice\nfunction display($message) {\n  echo $message;\n\
    }\n\n$myMessage = 'Hello World!';\n\ndisplay($myMessage);\n```\n\n# Performance\
    \ Issues\n\nDepending on the scale of your application, there are some performance\
    \ issues you might need to consider when using references."
