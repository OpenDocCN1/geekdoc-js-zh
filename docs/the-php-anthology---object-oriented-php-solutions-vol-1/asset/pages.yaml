    # How do I back up my database?


    The bigger a database becomes, the more nerve wracking it can be to have a backup
    of the data it contains. What if your server crashes and everything is lost? Frankly,
    MySQL comes with two alternatives: a command utility like mysqldump, and a query
    syntax for backing up tables.


    Here''s how you can export the contents of a database from the command line with
    mysqldump:


    ```

    mysqldump -uhharry -psecret sitepoint > sitepoint.sql

    ```


    This command will log in to MySQL as user "harry" (-uharry) with the password-word
    "secret" and output the contents of the sitepoint database to a file called sitepoint.sql.
    The contents of sitepoint.sql will be a series of queries that can be run against
    MySQL, perhaps using the mysql utility to perform the reverse operation from the
    command line:


    ```

    mysql -uharry -psecret sitepoint < sitepoint.sql

    ```


