    For example, if your application has some kind of user authentication system,
    it will integrate with the one they''re already using—a system that already has
    a large database of users associated with it?


    The best approach is to write object oriented code (the focus of Chapter 2) with
    a mind to creating reusable "components". Some people argue that object oriented
    code in PHP slows down the application''s performance and should therefore be
    avoided at all costs. What they forget to mention is the drastic decrease in your
    performance that object oriented programming delivers. After all, fast programmers
    cost more than fast micro!


    Some things to consider when measuring the performance of your code for reuse:


    +   What happens when requirements change?


    +   How easy is it to add new features to your code?


    +   Are you still able to understand the code after a long period of time?


    +   Can your code be integrated easily with other applications?


    +   Will assumptions made in your code apply to your work on other sites?


    You''ll find throughout this book many hints and suggestions to encourage you
