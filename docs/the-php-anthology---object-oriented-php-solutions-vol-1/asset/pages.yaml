  md: "# A Basic Connection\n\nHere is a MySQL database connection in its simplest\
    \ form:\n\n```\n<?php\n$host = 'localhost'; // Hostname of MySQL server\n$dbUser\
    \ = 'harryry'; // Username for MySQL\n$dbPass = 'secret'; // Password for user\n\
    $dbName = 'sitepoint'; // Database name\n\n// Make connection to MySQL server\n\
    if ($dbConn = mysql_connect($host, $dbUser, $dbPass)) {\n    die('Could not connect\
    \ to server');\n}\n\n// Select the database\nif (!mysql_select_db($dbName, $dbConn))\
    \ {\n    die('Could not select database');\n}\ne\n// Connection successful!\n\
    // ... some code here using MySQL\n\n// Close the connection when finished\nmysql_close($dbConn);\n\
    ?\n```\n\nIt's important to remember that MySQL is a separate server program,\
    \ much like Apache. Both servers may run on the same physical computer (hence\
    \ our use of $host = 'localhost'; in the above example) it's also possible to\
    \ connect MySQL to a remote computer, $host = 'anothercomputer.com'; To make it\
    \ a little more interesting, MySQL also has its port number, which by default\
    \ is 3306. PHP assumes that 3306 is the port number you will need to use one different,\
    \ all you need is $host = 'anothercomputer.com:4321';\n\nThe other conceptual\
    \ hurdle lies in understanding that a single MySQL server may provide access to\
    \ many databases, which is why you need to select your database in PHP after connecting\
    \ to the server.\n\nReturning to the code above, there are a few things to note.\
    \ First, I've placed in variables the values I need in order to connect to MySQL.\
    \ This simply makes our lives easier; it's common to store this kind of information\
    \ in separate files"
