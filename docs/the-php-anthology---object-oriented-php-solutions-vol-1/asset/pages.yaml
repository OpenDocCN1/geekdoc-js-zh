    \ Output\n\n// Modify some settings\n$lookandfeel->setColor('red');\n$lookandfeel->setSize('large');\n\
    \n// Display the output\necho $output->display();\n```\n\nUsing the setColor and\
    \ setSize methods, we change the color to \"red\" and the size to \"large.\" right?\
    \ Well, in fact, no. The output display still says:\n\nColor is white and size\
    \ is medium\n\nWhy is that? The problem is that we've only passed a copy of the\
    \ LookAndFeel object to the changes we make to $lookandfeel have no effect on\
    \ the copy that $output uses to generate the display.\n\nTo fix this we modify\
    \ the Output class so that it uses a reference to the LookAndFeel object it is\
    \ given. We do this by altering the constructor:\n\nFile: 7.php (excerpt)\n\n\
    ```\nfunction Output(&$lookandfeel)\n{\n    $this->lookandfeel = &$lookandfeel;\n\
    }\n```\n\nNotice that we have to use the reference operator twice here. This is\
    \ because the variable is being passed twice—first to the constructor function,\
    \ then again, to place it in a member variable.\n\nOnce we've made these changes,\
    \ the display looks like this:\n\nColor is red and size is large\n\nIn summary,\
    \ passing by reference keeps the target variable \"linked\" to the source variable,\
    \ so that if one changes, so does the other.\n\nClick here to order The PHP Anthology\
    \ Volume I & II and get 25% off!"
