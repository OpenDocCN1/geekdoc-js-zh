  md: '# Appendix A: PHP Configuration


    # Table A.1. Key Security and Portability Settings


    | Setting | Notes |

    | --- | --- |

    | register_globals (default: off) | Automatically creates global variables from
    incoming HTTP request variables, such as GET and POST. For security and portability,
    it is highly recommended to switch this off. See http://www.php.net/register_globals
    for more details. |

    | magic_quotes_gpc (default: off) | Automatically escapes quotes in HTTP request
    variables with a backslash, helping prevent SQL injection attacks. If you know
    you''re doing, it''s usually better to switch this functionality off and handle
    this escaping yourself when inserting into a database, given the problems this
    feature can cause you with, as well as the performance overhead that introduce.
    See Chapter 1 for information on making your scripts compatible with this feature.
    |

    | call_time_pass_reference (default: off) | Allows you to use variable references
    at call time (e.g. htmlentities($string)). To keep code clean and understandable,
    and to ensure portability, keep this functionality switched off |

    | short_open_tag (default: on) | Allows you to start a block of PHP with just
    <? instead of the longer <?php. Also lets you write out expressions with <=?,
    which is identical to <?php echo. While convenient, these shortcuts are not XML
    compliant, and can cause the PHP processor to become confused when it encounters
    XML processing instructions such as <?xml version="1.0"?. Many people have short_open_tag
    switched off, so, for maximum portability, avoid the shortcuts and switch this
    feature off during development. |

    | asp_tags (default: off) | Allows ASP style tags <% ... %> as an alternative
    to the PHP and open tags (<?php ... ?>). Few people use this, so, for maximum
    portability, it''s best to avoid them, and switch this feature off during development.
    |


