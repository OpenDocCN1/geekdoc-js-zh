  - '[PAGE 39]


    # Use the Full <?php ?> Tags


    PHP supports a variety of tags to mark up sections of PHP code, including the
    short tags (<? ?>), and ASP-style tags (<% %). These are controlled by the php.ini
    with the settings short_open_tag and asp_tags. While you have these settings set
    to On, other people may not. The short tag style, for example, causes a problem
    when the PHP is mixed with XML documents, which use processing instructions like:


    ```

    <?xml version="1.0"?>

    ```


    If we have a document which contains PHP and XML, and we have the short_open_tag
    turned on, PHP will mistake the XML processing instruction <?xml for a PHP opening
    tag.


    It''s possible that your code will need to run in environments where short_open_tags
    and asp_tags are both off. The best way to be sure that you are to get into the
    habit of always using the <?php ?> tag style, otherwise there may be a lot of
    code rewriting to do in some future


    # register_globals


    PHP is capable of turning data into native PHP variables. This feature is controlled
    by the register_globals setting in php.ini. With register_globals switched on,
    if I point my browser at an address like http://www.mysite.com/index.php?logged_in=1,
    PHP will automatically create a $logged_in and assign it the value of 1. The PHP
    group recommends this being disabled because it represents a risk to security,
    as the previous example suggests.


    So, in php.ini make sure the following code is in place:


    ```

    register_globals = Off

    ```


    This will force you to access incoming data via the predefined superglobal variables
    (e.g. $_GET[''username'']), which means they won''t conflict with variables you''ve
    created in your script.


    Using a .htaccess file with Apache, the same result can be achieved with the following
    code:


    ```

    php_flag register_globals off

    ```'
