    With the installation options set to your requirements, the go-pear.php script
    will connect to the PEAR Website, and download all the packages required to set
    up the package manager (it also asks if you require additional packages, which
    are well worth having). Packages are installed in a subdirectory pear of the directory
    you specified as the installation prefix (so, in the above examples you''d end
    up with c:\pear/home/username/pear/pear).


    Finally, if you log in, the go-pear.php installer will attempt to modify your
    include_path in php.ini. To do this manually, assuming you use the directories
    above, you''d specify the following:


    ```

    include_path = ":/home/username/pear/pear*

    ```


    For Windows users, the path is as follows:


    ```

    include_path = "c:\pear\pear*

    ```


    Finally, to use the PEAR package manager from the command line, you need to set
    up some environment variables. For Windows users these can be automatically added
    to your Windows registry by right clicking on the file PEAR_ENV.reg and choosing
    Run. They may also be manually configured as environment variables via the Windows
    Control Panel. Users with Unix-based systems can configure them to be set every
    time log in, by editing the .profile in your home directory (/home/username):


    ```

    # Enviment variables

    export PEAR_PEAR_SYCONF_DIR=/home/username/pear

    export PEAR_PEAR_INSTALL_DIR=/home/username/pear

    export PEAR_PEAR_DOC_DIR=/home/username/pear/docs

    export PEAR_PEAR_BIN_DIR=/home/username

    export PEAR_PEAR_DATA_DIR=/home/username/pear/data

    export PEAR_PEAR_TEST_DIR=/home/username/pear/tests

    export PEAR_PEAR_BIN_USER=/local/bin/php

    ```


    Finally, you need to add the PEAR command script to your system path, which, on
    Windows, can be achieved through the System Control Panel application (on the
    Advanced tab, click Environment Variables), and appending ;c:\pear to the PATH
    variable.


    On Unix-based systems, add the following to your .profile script:


    ```

    export PATH=$home/username/pear

    ```'
