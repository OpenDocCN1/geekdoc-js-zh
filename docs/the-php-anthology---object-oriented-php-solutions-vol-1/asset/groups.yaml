    // For Unix users

    $user_config = ''/home/username/pear/pear/PEAR/pear.conf'';


    $useHTML = TRUE; // Switch off for older browsers


    require_once ''PEAR/WebInstaller.php'';

    ?>

    ```


    ## Installing Packages Manually


    It is possible to install packages manually (although this involves more work),
    but

    it''s important to watch the include paths carefully when doing so. First of all,

    create a directory that will be the base of all the PEAR classes you install.
    This

    directory must be in your include path. Next, install the main PEAR package[11]-download
    the latest stable version and extract it to the directory

    you''ve created, so that PEAR.php is in the root of this directory.


    Installing further packages can be completed in more or less the same fashion,

    but you need to be careful which directory you extract to. For example, looking

    at PEAR::DB, the main DB.php file goes alongside the PEAR.php file in the

    of PEAR class directory, while further PEAR::DB-related files go in the subdirectories.
    The best way to check is to look at the package.xml file that comes


    > [11] http://pear.php.net/package/PEAR


    with every PEAR package. This contains an element called filelist, which lists
    all the files contained in the package and the location at which they should be
    installed. For each file, check the baseinstalldir attribute which, if specified,
    tells you where, relative to the root PEAR class directory, the file should be
    placed. The name attribute specifies the path and filename relative to the baseinstalldir
    (or just the root PEAR class directory if there''s no baseinstalldir attribute),
    where each file should be placed.


