    该手册还提供了二十四种不同的语言版本 [4]，但既然你正在阅读这本书，我假设你对手册的英文版感到满意。它被分为五个主要部分加上附录。了解可以在哪里找到什么信息以及在何处是值得的——至少在前四个部分中，这些部分与典型的
    PHP 开发者最相关。


    ## 第一部分：入门


    http://www.php.net/getting-started


    本节提供了 PHP 的简要介绍并附有一些基础示例。随后，它解释了如何安装 PHP（描述了各种操作系统与 Web 服务器的组合），以及如何通过修改 `php.ini`
    文件来对其进行配置。


    不容忽视的是安全章节，它涵盖了 PHP 开发者经常在 PHP 中犯错误的领域，这些错误会导致他们的应用程序容易被滥用。再次，PHP 易用性的“代价”是它并不会总是保护你免受最糟糕错误的影响，因此在你的
    PHP 涯中尽早开始学习安全是值得的。你将在附录 C 中找到关键安全问题的总结，在本书的适当讨论中也会提到。


    [4] http://www.php.net/docs.php


    ## 第 1 章：PHP 基础


    ## 第三部分：特性


    http://www.php.net/features


    这里涵盖了通常专注于解决特定 Web 相关问题的 PHP 核心元素。特性部分的大部分内容读起来像“执行摘要”，从开发者的角度来看，当你看到它们在运行时，可能会更好地理解这里包含的信息。一次性读完所有内容可能就像在读字典一样。幸运的是，通过阅读网络上丰富的教程以及研究
    PHP 源代码中使用的代码，可以吸收语言参考中包含的大部分信息。当然，正如你将在书中读到的，我希望你从中学到一两点关于充分利用 PHP 的技巧。然而，熟悉手册这一部分包含的主题是值得的，并将它们记在脑中以备后参考。


    ## 第四部分：函数参考


    http://www.php.net/manual/en/funref.php


    这一部分构成了手册的核心，涵盖了 PHP 中可用功能的各个方面。随着你对 PHP 的学习，你将在这里花费大部分时间，所以你会很高听到 PHP 组努力让这一部分易于导航。在空闲时刻，仅仅阅读手册并对你可以用
    PHP 做的所有事情感到惊讶甚至很有趣。是的，我刚刚把阅读手册描述为“有趣”。


    函数参考被分为若干子章节，涵盖了各种类别的函数，每个类别对应一个 PHP 扩展。


    ### PHP 扩展


    扩展的概念刚开始时可能有点困惑，因为许多扩展是随标准 PHP 安装一起分发的。字符串函数（String functions）我们很难离开它们，就是一个例子。通常情况下，PHP
    组作为默认 PHP 安装的一部分分发了所有认为对开发者至关重要的扩展。被认为是“非要要”的功能（即某些开发者需要但并非所有开发者都需要）的扩展必须单独添加。重要信息出现在每个扩展主页的“安装”标题下。核心扩展的描述语句是：“使用这些函数不需要安装；它们是
    PHP 核心的一部分。”非标准扩展在附录 B 中进行了检查。


    访问函数参考中的信息可以通过搜索字段（右上角）和在“函数列表”中搜索来获取。注意，在函数列表中搜索仅检查函数参考部分。


    点击此处订购《PHP 选集》第一卷和第二卷，并获得手册 75% 折扣。要搜索整个手册，你需要在“在线文档”中搜索。


    另一种方便的导航方法是在 URL 中传递你感兴趣的主题名称来“快捷”到函数。例如，尝试在浏览器的地址栏中输入以下内容：http://www.php.net/strings。这将带你进入
    http://www.php.net/manual/en/strings.php，这是字符串扩展的主页。查看此页面，你将看到该扩展提供的所有函数列表；同样的列表在左侧菜单中可用。


    以 `strpos` 函数为例，输入 URL http://www.php.net/strpos（这会带你进入 http://www.php.net/manual/en/function.strpos.php）。你将看到关于
    `strpos` 函数的以下信息：


    | strpos |

    | :--- |

    | (PHP 3, PHP 4) |

    | strpos -- 查找字符串首次出现的位置 |

    | 描述 |

    | int strpos (string haystack, string needle [, int offset]) |

    | 返回 needle 在 haystack 中首次出现的的数字位置。与 strpos() 不同，此函数可以接受完整的字符串作为 needle 参数且该项将被使用。
    |

    | 如果未找到 needle，则返回 FALSE。 |


    第一行包含函数名，第二行是该函数可用的 PHP 版本。第三行告诉你是函数的作用。在这种情况下，这是一个相当简短的解释，但 `strpos` 确实如此。在“描述”标题下，它是你感兴趣的函数。在括号中，，，函数签名告诉了函数接受的参数，并以逗号分隔。


    ## 第 1 章：PHP 基础


    （注：行行，，，，，，，，，，。，，，， ` ` `stackstack` ``。。注意，第三个参数是可选的。以下是你如何使用 `strpos`：


    ```php

    <?php

    $haystack = ''Hello World!'';

    $needle = ''orld'';


    // 使用 strpos 函数

    $position = strpos($haystack, $needle);

    echo ''The substring '' . $needle . '' in '' . $haystack . '' begins at character
    '' . $position;

    ?>

    ```

    '
