    \ SPLIB 中）\n\n```php\n<?php\n/**\n * articles 表定义\n */\nrequire_once 'DB/DataObject.php';\n\
    \nclass DataObject_Articles extends DB_DataObject\n{\n    ###START_AUTOCODE\n\
