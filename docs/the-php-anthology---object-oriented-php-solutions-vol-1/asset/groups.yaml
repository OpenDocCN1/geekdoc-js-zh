  mdcn: "\n\n# 理解作用域\n\n编写超过几百行的过程化 PHP 代码，毫无疑问，你会遇到解析错误，或者更糟糕，由于无意中多次使用函数名或变量名而导致的错误。当你包含大量文件且代码变得越来越复杂时，你可能会发现自己对这个问题变得越来越偏执。如何防止命名冲突的发生？解决此问题的方法之一是利用作用域（scope）对不需要这些内容的代码隐藏变量和函数。\n\
    \n作用域是一个变量或函数与其他作用域隔离的上下文。PHP 有三种可用的作用域：全局作用域、函数作用域和类作用域。在任何这些作用域中定义的变量和函数对任何其他作用域都是隐藏。函数和类作用域是局部作用域，这意味着函数\
    \ X 的作用域对函数 Y 的作用域隐藏的，反之亦然。\n\n类的巨大优势在于你可以在地方定义变量以及使用它们的函数，将函数与无关的代码隔离开。这突显了面向对象范式的关键理论点之一。特定的范式特别强调函数，变量被视为在函数调用之间存储数据的微小组合。而面向对象的范式将重点转移到了变量；函数“支撑”变量并被用于访问或修改它们。\n\
    \n让我们通过一个示例来探索：\n\n```php\n<?php\n// 一个全局变量\n$MyVariable = 'Going global';\n\n\
    // 在全局作用域声明的函数\nfunction myFunction()\n{\n    // 函数作用域内的变量\n    $MyVariable =\
    \ 'Very functional';\n}\n\n// 在全局作用域声明的类\nclass MyClass {\n    // 在类作用域声明的变量\n\
    \    var $MyVariable = 'A class act';\n\n    // 在类作用域声明的函数\n    function myFunction()\
    \ {\n        // 函数（方法）作用域内的变量\n        $myVariable = 'Methodical';\n    }\n}\n\
    ?>\n```\n\n在示例中，每个变量声明实际上都是独立的变量。它们可以和谐地共存而不互相干扰，因为每个都位于独立的作用域中。同样，两个 myFunction\
    \ 声明是两个独立的函数，存在于不同的作用域中。因此，PHP 将为你保留它们所有的值。\n\n当你开始在 PHP 中开始大量使用面向对象编程时，作用域变得非常重要。由于许多类可以具有相同名称的方法，你可以设计不同的类来提供相同的编程接口（API）。这些类所使用的脚本可以使用相同的方法调用，无论它们处理的对象是由哪个类实例化的。这在编写可维护的代码时可能是一项非常强大的技术。当我们在本章稍后讨论多态时会详细介绍这一点。\n\
    \n# 三行代码\n\n以下是我们可以让类变得更易使用的方法：\n\n```php\n<?php\n// Page 类\nclass Page {\n  \
    \  // 声明类成员变量\n    var $page;\n    var $title;\n    var $year;\n    var $copyright;\n\
    \n    // 构造函数\n    function Page($title, $year, $copyright) {\n        // 给成员变量赋值\n\
    \        $this->page = '';\n        $this->title = $title;\n        $this->year\
    \ = $year;\n        $this->copyright = $copyright;\n\n        // 调用 addHeader()\
    \ 方法\n        $this->addHeader();\n    }\n\n    // 生成页面顶部\n    function addHeader()\n\
    \    {\n        $this->page .= <<EOD\n<html>\n<head>\n<title>$this->title</title>\n\
    </head>\n<body>\n<h1 align=\"center\">$this->title</h1>\nEOD;\n    }\n\n    //\
    \ 向页面添加更多文本\n    function addContent($content)\n    {\n        $this->page = $content;\n\
    \    }\n\n    // 生成页面底部\n    function addFooter()\n    {\n        $this->page\
    \ .= <<EOD\n<div align=\"center\">&copy; $this->year $this->copyright</</div>\n\
    </body>\n</html>\nEOD;\n    }\n\n    // 获取页面内容\n    function get()\n    {\n  \
    \      $temp = $this->page;\n    }\n\n    // 调用 addFooter() 方法\n    $this->addFooter();\n\
    }\n```\n\n点击此处订购《The PHP Anthology Volume I & II》并享受 75 折优惠！\n\n"
