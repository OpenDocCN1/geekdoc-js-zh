    \ are only over an SSL connection. If you're using third party software, such\
    \ as phpBB, change the default administrator password immediately, and stay informed\
    \ about potential security flaws.\n\n## Configuration and Patching\n\nWhen installing\
    \ PHP, the configuration file php.ini-recommended makes the best starting point\
    \ to make sure you've got the package configured correctly.\n\nIf you're using\
