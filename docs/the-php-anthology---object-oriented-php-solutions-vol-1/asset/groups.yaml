- md: "\n## Chapter 2: Object Oriented PHP\n\nBut how do we refactor the above code\
    \ to take on an object oriented form?\nFirst, we need a class into which we can\
    \ place the two functions, addHeader and addFooter:\n\nFile: 2.php (excerpt)\n\
    \n```php\n<?php\n// Page class\nclass Page {\n  // Generates the top of the page\n\
    \  function addHeader($page, $title)\n  {\n    $page .= <<EOD\n<html>\n<head>\n\
    <title>$title</title>\n</head>\n<body>\n<h1 align=\"center\">$title</h1>\nEOD;\n\
    \    return $page;\n  }\n\n  // Generates the bottom of the page\n  function addFooter($page,\
    \ $year, $copyright)\n  {\n    $page .= <<EOD\n<div align=\"center\">&copy; $year\
    \ $copyright</div>\n</body>\n</html>\nEOD;\n    return $page;\n  }\n}\n```\n\n\
    Using the PHP keyword class, we can group the two functions, addHeader and addFooter,\
    \ within the class. Functions placed inside a class are known as member functions,\
    \ or more commonly, methods. Unlike normal functions, methods must be called as\
    \ part of the class:\n\n> ²Refactoring is the process of restructuring code without\
    \ actually changing what it does. This is usually done to ease future maintenance\
    \ and expansion of the code that would be hindered by its current structure.\n\
    \n```php\n// Initialize the page variable\n$page = '';\n\n// Add the header to\
    \ the page\n$page = Page::addHeader($page, 'A Script Using Static Methods');\n\
    \n// Add something to the body of the page\n$page .= <<EOD\n<p align=\"center\"\
    >This page was generated with static class methods</p>\nEOD;\n\n// Add the footer\
    \ to the page\n$page = Page::addFooter($page, date('Y'), 'Static Designs Inc.');\n\
    \n// Display the page\necho $page;\n?>\n```\n\nWe've called the class methods\
    \ addHeader and addFooter using the :: operator. The script is practically the\
    \ same as before; however, instead of calling our functions directly, we need\
    \ to call them as here:\n\n```php\n$page = Page::addHeader($page, 'A Script Using\
    \ Static Methods');\n```\n\nAlthough this isn't a big improvement, it does collect\
    \ our functions together by their job. This allows us to call different functions\
    \ by the same name separately inside different classes.\n\n## Static methods\n\
    \nSo far, we've only used a class as a container for related functions. In object\
    \ oriented parlance, functions that are designed to work this way are called static\
    \ methods. Actually, compared to most methods, static methods are about as boring.\
    \ In the sections below, we'll see how you can flex your object with fully-fledged\
    \ methods.\n\n## Classes and Objects\n\nA class is a \"blueprint\" for an object.\
    \ That is, unlike a function that you declare and use, a class merely describes\
    \ a type of object. Before you can do useful work with it, you need to create\
    \ an object—an instance of the class—using instantiation.\n\nClasses don't contain\
    \ only functions—they can also contain variables. To make the Page class more\
    \ useful, we might want to group some variables with the methods, then instantiate\
    \ the class into an object. Here's the code for the revamped Page class: File:\
    \ 3.php (excerpt)\n\n```php\n<?php\n// Page class\nclass Page {\n\n  // Declare\
    \ a class variable\n  var $page;\n\n  // The constructor function\n  function\
    \ Page() {\n    $this->page = '';\n  }\n\n  // Generates the top of the page\n\
    \  function addHeader($title)\n  {\n    $this->page .= <<EOD\n<html>\n<head>\n\
    <title>$title</title>\n</head>\n<body>\n<h1 align=\"center\">$title</h1>\nEOD;\n\
    \  }\n\n  // Adds some text to the page\n  function addContent($content)\n  {\n\
    \    $this->page .= $content;\n  }\n\n  // Generates the bottom of the page\n\
    \  function addFooter($year, $copyright)\n  {\n    $this->page .= <<EOD\n<div\
    \ align=\"center\">&copy; $year $copyright</div>\n</body>\n</html>\nEOD;\n  }\n\
    \n  // Gets the contents of the page\n  function get()\n  {\n    return $this->page;\n\
    \  }\n}\n```\n\nThe Page class has a lot more useful in this version of the example.\
    \ First of all, we've added a member variable (also called a field), in which\
    \ to store the HTML:\n\n```php\n// Declare a member variable\nvar $page;\n```\n\
    \nThe PHP keyword var is used to declare variables in classes. We can also assign\
    \ variables as we declare them, but we cannot place function calls in the declaration.\
    \ For example:\n\n```php\n// This is allowed\nvar $page = '';\n\n// This is NOT\
    \ allowed\n// var $page = strtolower('HELLO WORLD');\n```\n\nAfter the variable\
    \ declaration, we have a special method called the constructor. This method is\
    \ automatically executed when the class is instantiated. The constructor function\
    \ must always have the same name as the class.\n\n## Constructors have no return\
    \ value\n\n> A constructor cannot return any value. It is purely to set up the\
    \ object in some way as the class is instantiated. If it helps, then the constructor\
    \ as a function that automatically returns the object once it has been set up,\
    \ no need for you to supply a return value yourself.\n\nThat said, you may still\
    \ use the return command with no specified value to terminate the constructor\
    \ immediately, if needed. Inside the constructor we've used a special variable,\
    \ $this:\n\n```php\n// The constructor function\nfunction Page() {\n  $this->page\
    \ = '';\n}\n```\n\nWithin any method (including the constructor) $this points\
    \ to the object in which the method is running. It allows the method to access\
    \ other methods and variables that belong to that particular object. The -> (arrow)\
    \ operator that follows $this is used to point to a property or method that is\
    \ named within the object.\n\nIn the example above, the constructor assigns an\
    \ empty string value to the member variable we declared at the start. The idea\
    \ of the $this variable may seem awkward and confusing to start with, but it's\
    \ a common strategy employed by other programming languages, such as Java, to\
    \ allow class members to interact with each other. You'll get used to it very\
    \ quickly once you start writing oriented PHP code, as it will likely be for every\
    \ method your class contains.\n\nOf the other methods, addHeader and addFooter\
    \ are almost the same as before; notice they have no return values. Instead, they\
    \ update the object's page member variable, which helps simplify the code that\
    \ will use this class. We've also used the addContent method here with this; we\
