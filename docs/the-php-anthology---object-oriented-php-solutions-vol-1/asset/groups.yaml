    \ ' . $row['author'] . '<br />';\n  echo 'Body: ' . $row['body'] . '<br />';\n\
    }\n```\n\n注意我们使用了别名来放置 `COUNT` 函数的结果吗？\n\n`SELECT COUNT(*) AS numrows FROM articles`\n\
    \n我们这样做是为了稍后可以使用 `$row['numrows']` 来识别行数。另一种替代方案是省略别名：\n\n`SELECT COUNT(*) FROM\
    \ articles`\n\n这将要求我们通过 `$row['COUNT(*)']` 访问信息，这可能会让代码读起来很困惑。\n\n当我们使用 `COUNT`\
    \ 函数时，动态构建查询就变得重要了，正如“如何创建灵活的 SQL 语句？”所示。你需要确保你的 `COUNT` 查询包含了与“真实”查询中使用的相同的 `WHERE`\
    \ 或 `LIMIT` 子句。例如，如果我们实际用于获取数据的查询是：\n\n```sql\nSELECT * FROM articles WHERE author='HarryF'\n\
    ```\n\n在 PHP 中，我们可能想要像这样的代码：\n\n```php\n// 定义可重用的 SQL “块”\n$table = \" FROM articles\"\
    ;\n$where = \" WHERE author='HarryF'\";\n$order  = \" ORDER BY title\";\n\n//\
    \ 统计返回行数的查询\n$sql = \"SELECT COUNT(*) as numrows\" . $table . $where;\n\n// 执行查询，标识连接\n\
    $queryResource = mysql_query($sql, $dbConn);\n\n$row = mysql_fetch_array($queryResource,\
    \ MYSQL_ASSOC);\necho $row['numrows'] . \" rows selected<br />\";\n\n// 获取行的查询\n\
    $sql = \"SELECT \" . $table . $where . $order;\n\n// 执行查询，标识连接\n$queryResource\
    \ = mysql_query($sql, $dbConn);\n\n// 一次从 MySQL 获取一行数据\nwhile ($row = mysql_fetch_array($queryResource,\
    \ MYSQL_ASSOC)) {\n    echo 'Title: ' . $row['title'] . '<br />';\n    echo 'Author:\
    \ ' . $row['author'] . '<br />';\n    echo 'Body: ' . $row['body'] . '<br />';\n\
    }\n```\n\n## 使用类进行行计数\n\n让我们再次看看我们在本节中开发的类。我们可以通过向 `MySQLResult` 类引入以下方法，增加查找选定行数的功能：\n\
    \n文件：Database/MySQL.php（在 SPLIB 中）节录\n\n```php\n/**\n * 返回选定的行数\n * @return int\n\
    \ * @access public\n */\nfunction size() {\n    return mysql_num_rows($this->query);\n\
    }\n```\n\n以下是使用方法：\n\n```php\n// 连接到 MySQL\n$db = &new MySQL($host, $dbUser, $dbPass,\
    \ $dbName);\n```\n\n文件：15.php（节录）\n\n[点击此处订购 PHP Anthology Volume I & II 并享受 75\
