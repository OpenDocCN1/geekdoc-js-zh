    PHP 脚本期间相同类型的重复错误。 |

    | report_memleaks (default: on) | 确保开启此项，特别是当你使用实验性版本或非稳定版 PHP 时，否则一旦内存耗尽可用空间可能会导致服务器崩溃。`error_reporting`
    必须设置为报告警告，此设置才能生效。 |


    ## 其他设置


    表 A.4 显示了你在 PHP 配置中应该注意的其他重要设置。


