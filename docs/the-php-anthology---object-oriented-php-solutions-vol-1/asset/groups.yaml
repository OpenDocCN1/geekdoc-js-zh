    # 1 PHP Basics


    PHP is a programming language that’s designed specifically for building Websites,
    and is both blessed and cursed with being remarkably easy to learn and use. Getting
    started is extremely simple. Before long, the typical beginner can put together
    a simple Website and experiment with the wealth of open source projects available
    through resources like HotScripts[1].


    Unfortunately, the ease with which PHP-based sites can be developed also means
    you can quickly get yourself into trouble. As traffic to your site increases,
    along with the demand for more features and greater complexity, it’s important
    to gain a more intimate understanding of PHP, and to research application designs
    and techniques that have proved successful on large Websites. Of course, you can’t
    leap into programming and expect to know it all straight away. Even if you could,
    where would be the fun in?


    In this chapter, I’ll assume you’ve had a basic grounding in PHP, such as that
    provided in the first few chapters of Kevin Yank’s Build Your Own Database-Driven
    Website Using PHP & MySQL (ISBN 0-9579218-1-0), and instead concentrate on the
    essentials of “getting around” in PHP.


    In this chapter, you’ll find out where to get help—a defence against those that
