  mdcn: "\n接下来，我们来看 PHP 的 `addslashes`。应用于任何字符串时，`addslashes` 将使用反斜杠对单引号、双引号、反斜杠和空字符进行转义。这使其成为查询转义字符串的有效手段。\n\
    \n如果使用了魔引号（magic quotes），当然，你不能使用 `addslashes`，否则字符会被转义两次！为了解决这个冲突，你可以使用 `get_magic_quotes_gpc`\
    \ 函数检查是否启用了魔引号，如果启用则返回 TRUE，如果未启用则返回 FALSE。你可以如下所示将此测试封装在一个函数中：\n\n```php\n<?php\n\
    function safeAddSlashes($string)\n{\n    if (get_magic_quotes_gpc()) {\n     \
    \   return $string;\n    } else {\n        return addslashes($string);\n    }\n\
    }\n?>\n```\n\n第三种方法与 `addslashes` 非常，使用的是 `mysql_escape_string` 或 `mysql_real_escape_string`\
    \ 函数（后者在 PHP 4.3.0 中引入）。这些函数使用底层的 MySQL C++ + API（由 MySQL 开发者提供，而非 PHP 开发者）来对特殊字符进行转义。\n\
    \n这些函数转义空字符、换行符、回车符、反斜杠、单引号、双引号和结束符。从 PHP 4.3.0 开始，这两个函数都使用了 PHP 与 MySQL 连接时使用的当前字符集。因此，在最新的\
    \ PHP 版本中，这两个函数没有区别，如果你的服务器是最新的，可以自由使用其中较短的 `mysql_escape_string`。\n\n由于这种方法是\
    \ MySQL 内置的字符串转义机制，我推荐使用它而不是 `addslashes` 或 `magic_quotes_gpc`。当然，如果你想让你的 SQL\
    \ 良好迁移到其他数据库，你可能想要将该函数“隐藏”在类方法中，这样在移动到不同的数据库时，就可以更换整个类（包括转义机制）。\n\n# 第三章：PHP 与\
    \ MySQL\n\n再次，如果你没有通过其他方式处理魔引号问题，你必须检查 `magic_quotes_gpc` 是否开启：\n\n```php\n<?php\n\
