    # Avoid output in classes


    Instead of get, we could have endowed the Page class with a method called write
    to send the code to the browser immediately. This would have made the code above
    slightly simpler, the main script would not have to get the code from the object
    and echo it itself for reason.


    It''s usually a bad idea to output directly from inside a class (with statements
    and functions like echo and printf()); doing so would reduce the flexibility of
    your classes. Allowing the value to be retrieved from the class gives you the
    option of performing additional transformations before you send it to the browser,
    or use it for some other purpose (like putting it in an email!)


    Also note that the number of lines of code we have to use the class is fewer than
    required in the earlier examples. Although it''s impossible to determine good
    application design by counting the number of lines of code, it is clear that the
    class has the procedural code that uses it much simpler. From the point of view
    of people reading the code, it''s already clear what''s going on, even without
    having to look at the code for the Page class.'
- md: "\n# Understanding Scope\n\nWrite more than a few hundred lines of procedural\
    \ PHP code and, no doubt, you'll run into a parser error or, worse, a mysterious\
    \ bug caused by your accidentally using a function or variable name more than\
    \ once. When you're including numerous files and your code grows increasingly\
    \ complex, you may find yourself becoming more paranoid about this issue. How\
    \ do you stop naming conflicts from occurring? One approach that can help solve\
    \ this problem is to take advantage of scope to hide variables and functions from\
    \ code that doesn't need them.\n\nA scope is a context within which variables\
    \ or functions are isolated from other scopes. PHP has three available scopes:\
    \ the global scope, the function scope, and the class scope. Variables and functions\
    \ defined in any of these scopes are hidden from any other scope. The function\
    \ and class scopes are local scopes, meaning that function X's scope is hidden\
    \ from function Y's scope, and vice versa.\n\nThe big advantage of classes is\
    \ that you define variables and the functions that use them in one place, keeping\
    \ the functions from unrelated code. This highlights one of key theoretical points\
    \ about the object oriented paradigm. The particular paradigm places most emphasis\
    \ on functions, variables being treated as little than a pair to store data between\
    \ function calls. The object oriented paradigm shifts the emphasis to variables;\
    \ the functions \"back\" the variables and are used to access or modify them.\n\
    \nLet's explore this through an example:\n\n```php\n<?php\n// A global variable\n\
    $MyVariable = 'Going global';\n\n// A function declared in the global scope\n\
    function myFunction()\n{\n    // A variable in function scope\n    $MyVariable\
    \ = 'Very functional';\n}\n\n// A class declared in the global scope\nclass MyClass\
    \ {\n    // A variable declared in the class scope\n    var $MyVariable = 'A class\
    \ act';\n\n    // A function declared in the class scope\n    function myFunction()\
    \ {\n        // A variable in the function (method) scope\n        $myVariable\
    \ = 'Methodical';\n    }\n}\n?>\n```\n\nIn the example, each of the variable declarations\
    \ is actually a separate variable. They can live together happily without interfering\
    \ with each other, as each resides in a separate scope. Similarly, the two myFunction\
    \ declarations are two separate functions, which exist in separate scopes. Thus\
    \ PHP will keep all of their values for you.\n\nScope becomes important when you\
    \ start to use object oriented programming in a significant way in your PHP applications.\
    \ As many classes can have methods of the same name, you can design separate classes\
    \ to deliver the same programming interface (API). The scripts that the classes\
    \ can then use the same method calls, regardless of which class was instantiated\
    \ to the object they're working with. This can be a very powerful technique in\
    \ writing maintainable code. We'll look at this point more when we discuss polymorphism\
    \ later in this chapter.\n\n# A Three Liner\n\nHere's how we could make the class\
    \ even easier to use:\n\n```php\n<?php\n// Page class\nclass Page {\n    // Declare\
    \ a class member variable\n    var $page;\n    var $title;\n    var $year;\n \
    \   var $copyright;\n\n    // The constructor function\n    function Page($title,\
    \ $year, $copyright) {\n        // Assign values to member variables\n       \
    \ $this->page = '';\n        $this->title = $title;\n        $this->year = $year;\n\
    \        $this->copyright = $copyright;\n\n        // Call the addHeader() method\n\
    \        $this->addHeader();\n    }\n\n    // Generates the top of the page\n\
    \    function addHeader()\n    {\n        $this->page .= <<EOD\n<html>\n<head>\n\
    <title>$this->title</title>\n</head>\n<body>\n<h1 align=\"center\">$this->title</h1>\n\
    EOD;\n    }\n\n    // Adds some more text to the page\n    function addContent($content)\n\
    \    {\n        $this->page = $content;\n    }\n\n    // Generates the bottom\
    \ of the page\n    function addFooter()\n    {\n        $this->page .= <<EOD\n\
    <div align=\"center\">&copy; $this->year $this->copyright</div>\n</body>\n</html>\n\
    EOD;\n    }\n\n    // Gets the contents of the page\n    function get()\n    {\n\
    \        $temp = $this->page;\n    }\n\n    // Call the addFooter() method\n \
    \   $this->addFooter();\n}\n```\n\nClick here to order The PHP Anthology Volume\
