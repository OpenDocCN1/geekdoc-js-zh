    \ * FROM articles LIMIT 0,5\";\n  $this->result = &&$this->db->query($sql);\n\
    }\nfunction fetch() {\n  return $this->result->fetch();\n}\n```\n\n// Create an\
    \ instance of the MySQL class\n$db = &new MySQL('localhost', 'harryf', 'secret',\
