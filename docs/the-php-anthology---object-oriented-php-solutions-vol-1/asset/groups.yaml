  - "[PAGE 96]\n\n# Fetching with Classes\n\nunbuffered query, on the other hand,\
    \ lets MySQL hold onto the results until you request them, one row at a time (e.g.\
    \ with mysql_fetch_array). Not only does this allow your script to continue running\
    \ while MySQL performs the query, it also saves PHP from having to store all of\
    \ the rows in memory at:\n\nPHP lets you perform unbuffered queries with mysql_unbuffered_query:\n\
    \n```\n$QueryResource = mysql_unbuffered_query($sql, $dbConn);\n```\n\nOf course\
    \ all good things come at a price—unbuffered queries you can no longer use the\
    \ mysql_num_rows function to count the number of rows. Obviously, as PHP doesn't\
    \ keep a copy of the complete result set, it is unable to count the rows it! You\
    \ must fetch all rows in the result set from MySQL before you can make another\
    \ query.\n\nAlthough other functions exist for existing rows and cells from query\
    \ results, like mysql_fetch_object and mysql_result, you can achieve more or less\
    \ the same things with just mysql_fetch_array, and the consistency may help keep\
    \ your code simple.\n\n# Fetching with Classes\n\nNow that you're happy with the\
