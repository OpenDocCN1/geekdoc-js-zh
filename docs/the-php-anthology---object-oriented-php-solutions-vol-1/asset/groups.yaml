    | 设置 | 备注 |

    |---|---|

    | error_reporting (default: E_ALL & -E_NOTICE) | 开发时，为了获得最大的移植性，最好将其设置为 `E_ALL`，这样
    PHP 会通知你某些情况，例如你的代码依赖的某个 `$_GET` 变量已初始化。这会迫使你编写更安全且错误更少的代码，同时也确保你的代码在服务器上运行顺畅。
