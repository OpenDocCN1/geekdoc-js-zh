    If you''re not used to object oriented programming, this may seem very confusing,
    but what''s most important is to concentrate on how you can use the classes, rather
    than the detail hidden inside them. That''s one of the joys of object oriented
    programming, once you get to it. The code can get very complex behind the scenes,
    but all you need to concern yourself with is the simple "interface" (API) with
    which you use the code classes.


    # About APIs


    It''s common to hear the term API mentioned around classes. API stands for Application
    Programming Interface. What it refers to is the set of methods that act as "doors"
    to the functionality contained within a class. A well-designed API will allow
    the developer of the class to make radical changes behind the scenes without breaking
    any of the code that uses the classes.


    Compare using the MySQL classes with the earlier procedural code; it should be
    easy to see the similarities. Given that it''s so simple, you may ask, "Why not
    stick to plain, procedural PHP?" Well, in this case, it hides many of the details
    associated with performing the query. Tasks like managing the connection, catching
    errors, and deciding what format to get the query results are all handled behind
    the scenes by the class. Classes also make the implementation of global modifications
    (such as switching from MySQL to PostgreSQL) relatively painless (i.e. you could
    just switch to a PostgreSQL class that provided the same API).


    # # How do you resolve errors in my SQL queries?


    If something goes wrong when you try to deal with PHP and SQL together, it''s
    often difficult to find the cause. The trick is to get PHP to tell you where the
    problem is, bearing in mind that you must be able to hide this information from
    visitors when the site goes live.


    PHP provides the mysql_error function, which returns a detailed error message
    from the last MySQL operation performed.'
- md: "\n## How do I add or modify data in my database?\n\nIt's best used in conjunction\
    \ with the trigger_error function (which will be discussed in more detail in Chapter\
    \ 10), which allows you to control the output of the error message. Let's modify\
    \ the basic connection code we saw earlier:\n\nFile: 6.php (excerpt)\n\n```php\n\
    // Make connection to MySQL server\nif (!$dbConn = mysql_connect($host, $dbUser,\
    \ $dbPass)) {\n    trigger_error('Could not connect to server: ' . mysql_error());\n\
    \    }\n```\n\n```php\n// Select the database\nif (!mysql_select_db($dbName))\
    \ {\n    trigger_error('Could not select database: ' . mysql_error());\n}\n```\n\
    \nThe same approach can be used with queries:\n\nFile: 6.php (excerpt)\n\n```php\n\
    // A query to select all articles\n$sql = \"SELECT * FROM articles ORDER BY title\"\
    ;\n```\n\n```php\n// Run the query, identifying the connection\nif (!$queryResource\
    \ = mysql_query($sql, $dbConn)) {\n    trigger_error('Query error ' . mysql_error()\
    \ . ': SQL: ' . $sql);\n}\n```\n\nIt would be a good idea to return the complete\
    \ query itself, as we've done in the above example, particularly when you've built\
    \ it using PHP variables. This allows you to see exactly what query was performed,\
    \ and if necessary, execute it directly against MySQL to identify exactly where\
    \ it went wrong.\n\nThe MySQL class discussed above will automatically use mysql_error\
    \ and trigger_error should it encounter a problem.\n\n## How do I add or modify\
    \ data in my database?\n\nBeing able to fetch data from the database is a start,\
    \ but how can you put it there in the first place?\n\nClick here to order The\
    \ PHP Anthology Volume I & II and get 25% off!\n\n## Chapter 3: PHP and MySQL\n\
    \nAgain, the answer is simple with PHP: use the mysql_query function combined\
    \ with SQL commands INSERT and UPDATE. INSERT is used to create new rows in a\
    \ table, while UPDATE is used to modify existing rows.\n\n### Inserting a Row\n\
    \nA simple INSERT, using the articles table defined at the start of this chapter,\
    \ looks like this:\n\n```php\n// A query to INSERT data\n$sql = \"INSERT INTO\n\
    \    articles\n    SET\n        title = '$title',\n        body = '$body',\n \
    \       author = '$Author';\n\n// Run the query, identifying the connection\n\
    if (!$QueryResource = mysql_query($sql, $dbConn)) {\n    trigger_error('Query\
    \ error ' . mysql_error() . ' SQL: ' . $sql);\n}\n```\n\n### Updating a Row\n\n\
    Before you can use an UPDATE query, you need to identify which row(s) of the table\
    \ to update. In this example, I've used a SELECT to obtain the unique article_id\
    \ value for the article entitled \"How to insert data\":\n\n```php\n// A query\
    \ to select an article\n$sql = 'SELECT article_id FROM articles\nWHERE title =\
    \ 'How to insert data';\n\nif (!$QueryResource = mysql_query($sql, $dbConn)) {\n\
    \    trigger_error('Query error ' . mysql_error() . ' SQL: ' . $sql);\n}\n\n//\
    \ Fetch a single row from the result\n$row = mysql_fetch_array($QueryResource,\
    \ MYSQL_ASSOC);\n\n// A new title\n$title = 'How to update data';\n```\n\n```php\n\
    $sql = \"UPDATE articles\nSET title='$title'\nWHERE article_id=' . $row['article_id']\
    \ . '\";\n```\n\n```php\nif (!$queryResource = mysqli($sql, $dbConn)) {\n    trigger_error('Query\
    \ error ' . $mysql_error() . ': SQL: ' . $sql);\n}\n```\n\nIn the above example,\
    \ we used the SELECT query to find the ID for the row we wanted to update.\n\n\
    In practical Web applications, the UPDATE might occur on a page that relies on\
    \ input from the Web browser, after the user has entered the value($s) using HTML\
    \ form, for example. It is possible that strings in this data might contain apostrophes,\
    \ which would break the SQL, and impact security. In light of this, make sure\
    \ you read \"How do I solve database errors caused by quotes/apostrophes?\", which\
    \ covers SQL injection attacks.\n\n![](img/80d007a3dc499b219e99d11695c2c366_102_0.png)\n\
    \n## Beware Global Updates\n\nBe careful with UPDATE and remember to use a WHERE\
    \ clause to indicate which rows to change.\n\nFor example, consider this query:\n\
    \n```sql\nUPDATE articles SET title = 'How NOT to update data'\n```\n\nThis will\
    \ update every row of the table!\n\n### Another Class Action\n\nUsing the MySQL\
    \ class last in \"How do I fetch data from a table?\", we can perform INSERT and\
    \ UPDATE queries without any further modifications. Repeating the above examples\
    \ using the class, we can first INSERT like:\n\n```php\n// Connect to MySQL\n\
    $db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\n$title = 'How to insert\
    \ data';\n$body = 'This is the body of the article';\n```\n\nClick here to order\
    \ the PHP Anthology Volume I & II and get 25% off!\n\n## Chapter 3: PHP and MySQL\n\
    \n```php\n$author = 'HarryF';\n\n// A query to INSERT data\n$sql = 'INSERT INTO\
    \ articles\nSET\ntitle = '$title',\nbody = '$body',\nauthor = '$author';\n\n$db->query($sql);\n\
    \nif ($db->isError()) {\n    echo 'INSERT successful';\n} else {\n    echo 'INSERT\
    \ failed';\n}\n```\n\nWe can UPDATE as follows:\n\n```php\n$db = &new MySQL($host,\
    \ $dbUser, $dbPass, $dbName);\n\n// A query to select an article\n$sql = 'SELECT\
    \ article_id FROM articles\nWHERE title='How to insert data';\n\n$result = $db->query($sql);\n\
    \n$row = $result->fetch();\n\n// A new title\n$title = 'How to update data';\n\
    \n$sql = \"UPDATE articles\nSET\ntitle=''. $title.'. '\nWHERE\narticle_id=' '.$row['article_id'].\
    \ . ''\";\n\n$db->query($sql);\n\nif (!$db->isError()) {\n    echo 'UPDATE successful';\n\
    } else {\n    echo 'UPDATE failed';\n}\n```\n\nFile: 10.php (excerpt)\n\n82\n\
    Click here to order The PHP Anthology Volume I & II and get 25% off!\n\n## How\
    \ do I solve database errors caused by quotes/apostrophes?\n\nConsider the following:\n\
    \n```sql\nINSERT INTO articles SET title='PHP';\n```\n\n### The Great Escape\n\
    \nThe solution is to escape the apostrophe by adding a backslash. The following,\
    \ for example, will work:\n\n```sql\nINSERT INTO articles SET title='PHP\\'s';\n\
    ```\n\n### Backslashes and ANSI SQL Standard\n\nNote that using the backslash\
    \ as an escape character is not ANSI SQL. If MySQL is the only database you'll\
    \ use, the backslash may be acceptable, but the same statement run on another\
    \ database may fail. According to ANSI SQL we should escape apostrophes with another:\n\
    \n```sql\nINSERT INTO articles SET title='PHP''s';\n```\n\n> It continually amazes\
    \ me many professionally designed sites fail to handle escaping properly! Keep\
    \ an eye out for unexpected backslashes in your own web sites. Chapter 1 for my\
    \ advice on how best to avoid this on your own sites.\n"
  mdcn: "\n\n## 如何在我的数据库中添加或修改数据？\n\n最好是结合 `trigger_error` 函数使用（该函数将在第10章中详细讨论），该函数允许你控制错误消息的输出。让我们修改一下之前看到的基础连接代码：\n\
