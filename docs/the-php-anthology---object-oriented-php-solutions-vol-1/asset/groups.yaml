- md: '

    # What’s Next?


    If you’ve enjoyed these chapters from The PHP Anthology: Object Oriented PHP Solutions,
    why not order yourself a copy?


    In the rest of The PHP Anthology: Object Oriented PHP Solutions, Volume I, you’ll
    learn how to put PHP’s basic features, as file and text manipulation, image generation,
    and email, to full use in practical solutions built upon principles of object
    oriented software design. You’ll also gain access to the code archive download,
    so you can try out all the examples without retyping!


    Here are just a handful of things you’ll learn to do with PHP in Volume I:


    - upload download files over FTP

    - create compressed ZIP/TAR files

    - implement a bad word filter

    - build an online calendar

    - create thumbnail images

    - display charts and graphs

    - handle incoming mail

    - make “search engine friendly” URLs

    - implement a custom error handler

    - And a whole lot more...


    And don’t forget The PHP Anthology: Object Oriented PHP Solutions, Volume II!
    It covers complex applications of PHP including XML processing, alternative content
    types like PDF files, site statistics, unit testing, design patterns, and plenty
    more besides!


    Order now and get it delivered to your doorstep!

    '
