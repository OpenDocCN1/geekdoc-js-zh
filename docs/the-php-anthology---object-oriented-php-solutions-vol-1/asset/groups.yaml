    \ MySQL\nobject\n$articles = &new Articles($db);\n\n```\nwhile ($row = $articles->fetch())\
    \ {\n  echo '<pre>';\n  print_r($row);\n  echo '</pre>';\n}?\n```\n\nIn the above\
    \ example, we instantiate the MySQL class outside the Articles class, then pass\
