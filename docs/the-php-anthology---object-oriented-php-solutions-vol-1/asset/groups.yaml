    | allow_url_fopen (default: on) | 允许为函数 `fopen` 指定远程文件位置（例如 `fopen(''http://www.sitepoint.com/'',''r'')`）。这是一个实用的工具，但对于编写得糟糕的脚本来说，也存在潜在的安全风险。如果你知道不需要它，请将其关闭。
    |


    ## 包含与执行设置


    表 A.2 显示了与包含（includes）以及你的 PHP 脚本运行状况相关的最重要的 PHP 设置。


    ## 表 A.2. 包含与执行设置


    | 设置 | 备注 |

    |---|---|

    | include_path (default: ''.'') | 允许你在使用包含相关的命令时，指定 PHP 应该搜索的相对路径和绝对路径。确保你至少指定了当前目录（`.`），否则大多数第三方脚本将无法工作。在
    Unix 系统上，目录列表用冒号（`;`）分隔，而在 Windows 上，分隔符是分号（`:`）。 |

    | auto_prepend_file (default: not set) | PHP 将在执行任何请求脚本之前执行文件（文件）。这对于执行全站操作（如安全、日志、定义错误处理程序、移除
    magic quotes 功能添加的反斜杠等）非常有用。对于你自己使用的应用程序很有用，但不适用于打算分发的代码。无法通过 .htaccess 文件修改 `php.ini`
    设置的用户无法使用此类代码。分隔符与 `include_path` 设置相同。 |

    | auto_append_file (default: not set) | `auto_prepend_file` 的孪生节点，在请求脚本之后执行。 |

