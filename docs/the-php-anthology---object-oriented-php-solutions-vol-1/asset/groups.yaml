- md: "\n# Use the Full <?php ?> Tags\n\nPHP supports a variety of tags to mark up\
    \ sections of PHP code, including the short tags (<? ?>), and ASP-style tags (<%\
    \ %>). These are controlled by the php.ini with the settings `short_open_tag`\
    \ and `asp_tags`. While you have these settings set to On, other people may not.\
    \ The short tag style, for example, causes a problem when the PHP is mixed with\
    \ XML documents, which use processing instructions like:\n\n```xml\n<?xml version=\"\
    1.0\"?>\n```\n\nIf we have a document which contains PHP and XML, and we have\
    \ the `short_open_tag` turned on, PHP will mistake the XML processing instruction\
    \ `<?xml` for a PHP opening tag.\n\nIt's possible that your code will need to\
    \ run in environments where `short_open_tags` and `asp_tags` are both off. The\
    \ best way to be sure that you are to get into the habit of always using the `<?php\
    \ ?> tag style, otherwise there may be a lot of code rewriting to do in some future.\n\
    \n# register_globals\n\nPHP is capable of turning data into native PHP variables.\
    \ This feature is controlled by the `register_globals` setting in php.ini. With\
    \ `register_globals` switched on, if I point my browser at an address like `http://www.mysite.com/index.php?logged_in=1`,\
    \ PHP will automatically create a `$logged_in` and assign it the value of 1. The\
    \ PHP group recommends this being disabled because it represents a risk to security,\
    \ as the previous example suggests.\n\nSo, in php.ini make sure the following\
    \ code is in place:\n\n```\nregister_globals = Off\n```\n\nThis will force you\
    \ to access incoming data via the predefined superglobal variables (e.g. `$_GET['username']`),\
    \ which means they won't conflict with variables you've created in your script.\n\
    \nUsing a .htaccess file with Apache, the same result can be achieved with the\
    \ following code:\n\n```\nphp_flag register_globals off\n```\n\nFurther information\
    \ can be found in the PHP manual, and in Kevin Yank's article \"Write Secure Scripts\
    \ with PHP 4.2!\" on SitePoint.\n\n# Magic Quotes\n\nMagic quotes is a feature\
    \ intended to help prevent security breaches in sites developed by PHP beginners.\
    \ It automatically escapes characters (see Chapter 5 for more information) to\
    \ incoming URL strings, from posts, before your script is able to access any of\
    \ these values. Should you insert the data directly into your database, there's\
    \ no risk of someone being able to tamper with the database. For beginners, this\
    \ is certainly a useful way to prevent disasters. However, once you understand\
    \ SQL injection and have developed the habit of dealing with them, the magic quote\
    \ functionality can become more of a problem than it's worth.\n\nMagic quotes\
    \ functionality is controlled by a PHP configuration setting, `magic_quotes_gpc`,\
    \ which can be either On or off. My preference is to have magic quotes switched\
    \ off, and deal with escaping data myself. Unfortunately, this means the code\
    \ I write won't port well to PHP installations where magic quotes are switched\
    \ on (I'll end up with backslashes in content). Frankly, to deal with this problem,\
    \ PHP provides the function `get_magic_quotes()` which can be used to find out\
    \ magic quotes are switched on. To keep the code portable, use a simple file that\
    \ strips out magic quotes if this functionality be enabled:\n\n```php\n<?php\n\
    /* Checks if magic_quotes_gpc = On and strips them from incoming\nrequests if\
    \ necessary */\nif (get_magic_quotes_gpc()) {\n  $GET = array_map('stripslashes',\
    \ $GET);\n  $POST = array_map('stripslashes', $POST);\n}\n?>\n```\n\n# Chapter\
    \ 1: PHP Basics\n\nIf we include this at the start of any file which we accept\
    \ data from a query string, a post, or a cookie, we'll remove any slashes by magic\
    \ quotes, this effectively gives us back what we started with. SQL injection attacks\
    \ is discussed in detail in \"How do I solve errors caused by quotes?\" in Chapter\
    \ 3. If you're not confident that you can protect yourself against SQL attacks,\
    \ use magic quotes. Once you're happy with a full grasp of all the issues, switch\
    \ the magic quotes off and save yourself many headaches. Note that magic quotes\
    \ can only be switched off in the php.ini file or one of Apache’s .htaccess files.\
    \ For more information, see Appendix A.\n\n# Call-Time Pass-By-Reference\n\nA\
    \ reference is like a \"shortcut\" to the value of a variable. References are\
    \ often required when we use functions and classes, a subject we will discuss\
    \ further in Chapter 2. When you use a reference to a variable in a function or\
    \ class method, it’s defined as call-time pass-by-reference. Consider this example:\n\
    \n```\n$result = myFunction(&$myVariable);\n```\n\nThe & operator tells PHP to\
    \ use a reference to the variable $my as the argument, rather than creating a\
    \ copy of its value. This is now regarded as bad practice, but it can make the\
    \ job of understanding someone else’s code extremely difficult. Switch this off\
    \ in php.ini using the following command:\n\n```\nallow_call_time_pass_reference\
    \ = Off\n```\n\nAlternatively, switch it off in a .htaccess file as follows:\n\
    \n```\nphp_flag allow_call_time_pass_reference off\n```\n\n# Write Reusable Code\n\
    \nIt’s easy to say, I know, but if you find yourself writing more than one PHP\
    \ script, you need to start thinking about how to make your code reusable before\
    \ you suffer premature hair loss. Technically, this isn't exactly an issue of\
    \ portability as such, but if you end up working on other sites or applications,\
    \ you'll appreciate having ready code that you can simply plug into your new project.\
    \ Also, if you're writing code that people will integrate with existing applications\
    \ on their Websites, you'll need to package it in a form that doesn't place requirements\
    \ on the code they're already using.\n\nFor example, if your application has some\
    \ kind of user authentication system, it will integrate with the one they're already\
    \ using—a system that already has a large database of users associated with it.\n\
    \nThe best approach is to write object oriented code (the focus of Chapter 2)\
    \ with a mind to creating \"components\". Some people argue that object oriented\
    \ code in PHP slows down the application's performance and should therefore be\
    \ avoided at all costs. What they forget to mention is the drastic increase in\
    \ your performance that object oriented programming delivers. After all, fast\
    \ programmers cost more than fast micro!\n\nSome things to consider when measuring\
    \ the performance of your code for reuse:\n\n- What happens when requirements\
    \ change?\n- How easy is it to add new features to your code?\n- Are you still\
    \ able to understand the code after a long period of time?\n- Can your code be\
    \ integrated easily with other applications?\n- Will assumptions made in your\
    \ code apply to your work on other sites?\n\nYou'll find throughout this book\
    \ many hints and suggestions to encourage you to write reusable code, although\
    \ an in-depth analysis of PHP applications design as a whole is beyond its scope.\
    \ As you read this book, you should get a feeling for some of the critical factors\
    \ as subjects for further investigation. You have one responsibility to yourself\
    \ as an experienced PHP developer: to expand your general knowledge of the more\
    \ esoteric aspects of software development, such as design patterns and enterprise\
    \ application architecture, as a means to improve your development technique and,\
    \ more importantly, save yourself time. The broader your knowledge, the lower\
    \ the risk of failure when you land that project.\n\n# Further Reading\n\n- Write\
    \ Secure Scripts with PHP 4.2!: http://www.sitepoint.com/article/758\nA tutorial\
    \ that explains the importance of writing scripts with register_globals switched\
    \ off.\n- Effortless (or Better!) Bug Detection with PHP Assertions: http://www.sitepoint.com/article/1008\n\
    - Using Strings: http://www.zend.com/zend/tut/using-strings.php\nZend provides\
    \ a walk-through of the main functions available for working with strings.\n-\
    \ String Theory: http://www.devshed.com/Server_Side/PHP/StringTheory\nDevShed\
    \ offers an in depth look at strings, going as far as Posix extended regular expressions.\n"
  mdcn: "\n\n# 使用完整的 <?php ?> 标签\n\nPHP 支持多种标记来标识 PHP 代码段，包括短标签 (`<? ?>`) 和 ASP 风格的标签\
    \ (`<% %>`)。这些标签由 `php.ini` 中的 `short_open_tag` 和 `asp_tags` 设置进行控制。虽然你可能将这些设置设置为\
    \ `On`，但其他人可能没有。例如，短标签样式在 PHP 与 XML 文档混合时会产生问题，因为 XML 使用了类似下面的处理指令：\n\n```xml\n\
    <?xml version=\"1.0\"?>\n```\n\n如果这里有一个包含 PHP 和 XML 的文档，并且开启了 `short_open_tag`，PHP\
    \ 会将 XML 处理指令 `<?xml` 误认为是 PHP 开启标签。\n\n你的代码可能需要在 `short_open_tags` 和 `asp_tags`\
    \ 均关闭的环境中运行。确保万无失的最佳方法是养成始终使用 `<?php ?>` 标签风格的习惯，否则在将来可能需要进行大量的代码重写。\n\n# register_globals\n\
    \nPHP 能够将数据转换为原生 PHP 变量。此功能由 `php.ini` 中的 `register_globals` 设置控制。开启 `register_globals`\
    \ 后，如果我的浏览器指向类似 `http://www.mysite.com/index.php?logged_in=1` 的地址，PHP 将自动创建 `$logged_in`\
    \ 变量并赋值为 1。PHP 组建议禁用此功能，因为正如前一个示例所示，它代表了安全风险。\n\n因此，在 `php.ini` 中确保存在以下代码：\n\n\
    ```\nregister_globals = Off\n```\n\n这将迫使你通过预定义的超全局变量（例如 `$_GET['username']`）来访问传入的数据，这意味着它们不会与你在脚本中创建的变量冲突。\n\
    \n在 Apache 中使用 .htaccess 文件，可以通过以下代码实现相同的结果：\n\n```\nphp_flag register_globals\
    \ off\n```\n\n更多信息可以在 PHP 手册中，以及 Kevin Yank 在 SitePoint 上的文章“Write Secure Scripts\
    \ with PHP 4.2!”中找到。\n\n# Magic Quotes（魔幻引号）\n\nMagic quotes 是一项旨在防止 PHP 初学者开发的网站出现安全漏洞的功能。在你的脚本访问任何这些值之前，它会自动对传入的\
    \ URL 字符串和表单中的字符进行转义（更多信息请见第 5 章）。如果你直接将数据插入数据库，那么就不存在某人能够篡改数据库的风险。对于初学者来说，这无疑是防止灾难性方法。然而，一旦你理解了\
    \ SQL 注入并养成了处理它们的习惯，magic quote 功能可能会变成比其价值更大的问题。\n\nMagic quotes 功能由 PHP 配置设置\
    \ `magic_quotes_gpc` 控制，该设置可以为 `On` 或 `off`。我倾向于关闭 magic quotes，并自己处理数据转义。遗憾的是，这意味着我编写的代码无法很好地迁移到开启了\
    \ magic quotes 的 PHP 环境中（会导致内容中出现反斜杠）。坦率地说，为了解决这个问题，PHP 提供了 `get_magic_quotes()`\
    \ 函数，可以用它检查 magic quotes 是否开启。为了保持代码的可移植性，如果启用了此功能，请使用一个简单的文件来剔除 magic quotes：\n\
    \n```php\n<?php\n/* 检查 magic_quotes_gpc 是否为 On，并在需要时从传入的 \n请求中剔除它们 */\nif (get_magic_quotes_gpc())\
    \ {\n  $GET = array_map('stripslashes', $GET);\n  $POST = array_map('stripslashes',\
    \ $POST);\n}\n?>\n```\n\n# 第 1 章：PHP 基础\n\n如果在任何从查询字符串、post 或 cookie 接收数据的文件的开头包含包含此内容，我们将移除由\
    \ magic quotes 添加的任何反斜杠，这有效地让我们找回了原始数据。SQL 注入攻击将在第 3 章的“我如何解决由引号引起的错误？”中详细讨论。如果你不确定自己可以保护自己免受\
    \ SQL 攻击，请使用 magic quotes。一旦你对完全掌握了所有问题感到满意，请关闭 magic quotes 为自己省去很多烦恼。请注意，magic\
    \ quotes 只能在 `php.ini` 文件或 Apache 的一个 .htaccess 文件中关闭。更多信息请参阅附录 A。\n\n# 调用时按引用传递（Call-Time\
    \ Pass-By-Reference）\n\n引用就像是变量值的“快捷方式”。当我们使用函数和类时，通常需要引用，我们将在第 2 章进一步讨论这个主题。当你在函数或类方法中使用变量的引用时，它被定义为调用时引用传递。考虑这个例子：\n\
    \n```\n$result = myFunction(&$myVariable);\n```\n\n`&` 运算符告诉 PHP 使用变量 `$my` 的引用作为参数，而不是创建一个其值的副本。这现在被认为是一种坏做法，但它会让理解他人代码变得极其困难。在\
    \ `php.ini` 中使用以下命令关闭它：\n\n```\nallow_call_time_pass_reference = Off\n```\n\n\
    或者，在 .htaccess 文件中如下关闭它：\n\n```\nphp_flag allow_call_time_pass_reference off\n\
    ```\n\n# 编写可复用代码\n\n说起来容易，我知道，但如果你发现自己正在编写多个 PHP 脚本，那么你需要在遭受过早性脱发之前开始思考如何让你的代码可复用。从技术上讲，这并不完全是一个可移植性问题，但如果你最终在其他网站或应用程序上工作，你会感谢拥有现成的代码。此外，如果你编写的是需要集成到现有应用程序的代码，你需要将其封装成不依赖于现有系统的形式。\n\
    \n例如，如果你的应用程序有某种用户身份验证系统，它将与已使用的系统集成——一个拥有大量关联系统的。\n\n最好的方法是编写面向对象的代码（第 2 章的重点），并旨在创建“组件”。有些人人认为\
    \ PHP 中的面向对象代码会降低应用程序性能，因此应该避免。他们忘记提到面向对象编程带给性能的巨大提升。毕竟，优秀的程序员比快的机器更贵！\n\n衡量代码复用性能时需要考虑的一些因素：\n\
    \n- 当需求变化时会怎样？\n- 向代码中添加新功能有多容易？\n- 在长时间之后你还能理解这些代码吗？\n- 你的代码可以轻松集成到其他应用程序中吗？\n\
    - 你代码中的假设是否适用于其他网站？\n\n你将在本书书中找到许多提示和建议，鼓励你编写可复用代码，尽管对 PHP 应用设计的深度分析超出了它的范围。在你阅读本书时，你应该对某些关键因素作为进一步研究的主产生感觉。作为一名丰富的\
    \ PHP 开发者，你对自己有一个责任：扩展对软件开发更深奥方面的知识，例如设计模式和企业应用架构，以提高你的开发技术，更重要的是为你节省时间。你的知识越广泛，在获得项目时风险就越低。\n\
    \n# 延伸阅读\n\n- Write Secure Scripts with PHP 4.2!: http://www.sitepoint.com/article/758\n\
    一篇解释在关闭 `register_globals` 的情况下编写脚本重要性的教程。\n- Effortless (or Better!) Bug Detection\
    \ with PHP Assertions: http://www.sitepoint.com/article/1008\n- Using Strings:\
    \ http://www.zend.com/zend/tut/using-strings.php\nZend 提供了处理字符串的主要函数导览。\n- String\
    \ Theory: http://www.devshed.com/Server_Side/PHP/StringTheory\nDevShed 对字符串进行了深入探讨，甚至涉及了\
    \ Posix 扩展正则表达式。\n\n"
