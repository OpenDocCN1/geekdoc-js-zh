    # Preface


    One of the great things about PHP is its vibrant and active community. Developers
    enjoy many online meeting points, including SitePoint Forums[1] where developers
    get together to help each other out with problems they face on a daily basis,
    from the basics of how PHP works, to solving design problems “How do I validate
    a form?” As a way to get help, these communities are excellent—they’re replete
    with all sorts of vital fragments you’ll need to make your projects successful.
    By putting all that knowledge together into a solution that applies to your particular
    situation can be a problem. Often, community members assume others have some degree
    of knowledge; frequently, you might spend a considerable amount of time pulling
    together snippets from various posts, threads, and users (each of whom has a different
    programming style) to gain a complete picture.


    The PHP Anthology: Object Oriented PHP Solutions is, first and foremost, a compilation
    of the best solutions provided to common PHP questions that turn up at the SitePoint
    Forums on a regular basis, combined with the experiences and insights I''ve gained
    from my work with PHP on a daily basis over the last four years.


    What makes this book different from others on PHP is that it steps away from a
    tutorial style, and instead focuses on the achievement of practical goals with
    a minimum of effort. To that extent, you should be able to use many of the solutions
    provided here in a more or less “plug and play” manner, rather than having to
    read this book from cover to cover.


    That said, throughout these discussions is a “hidden agenda.” As well as solutions,
    this book introduces you to techniques that can save you effort, and help you
    reduce the time it takes to complete and later maintain your Web-based PHP applications.


    Although was originally considered as a procedural programming language, in recent
    years PHP has proven increasingly successful as a language for the development
    of object oriented solutions. This was further compounded by the public opening
    in January 2003 of the PHP Application and Extension Repository[2] (PEAR), which
    provides a growing collection of reusable and well maintained solutions for architectural
    problems (such as Web form generation and validation) regularly encountered by
    PHP developers around the world.


    [1] http://www.sitepointforums.com/

    [2] http://pear.php.net/


    The object oriented paradigm seems to scare many PHP developers, and is often
    regarded as "off limits" to all the PHP gurus. What this book will show you is
    that you do not need a computer science degree to take advantage of the wealth
    of class libraries available in PHP today. Wherever possible in the development
    of the solutions provided in this book, I''ve made use of freely available libraries
    that''ve personally found handy, and which have saved me hours of development.
    Employing a class developed by someone else is often as easy as using any of the
    built-functions PHP provides.


    This emphasis book places on taking advantage of reusable components to build
    your PHP Web applications reflects another step away from the focus of many PHP-related
    books. Although you haven''t found extensive discussions of object oriented design,
    reading The PHP Anthology: Object Oriented PHP Solutions, Volumes I and II from
    cover to cover, through a process of osmosis, help you take your PHP coding skills
    to the next level, showing your way on constructing applications that can stand
    the test of time.


    The PHP Anthology: Object Oriented PHP Solutions, Volume I will equip you with
    the essentials which you need to be confident when working the PHP engine, including
    a fast-paced primer on object oriented programming with PHP (Chapter 2). With
    that preparation out of the way, the book looks solutions that could be applied
    to all PHP-based Web applications, the essentials of which you may already have
    knowledge of, but yet to fully grasp.


    # Who should read this book?


    If you have already got your feet wet with PHP, perhaps reading Kevin Yank''s
    Build Your Own Database Website Using PHP & MySQL (SitePoint, ISBN-0-9579218-1-0)
    and completed your first project or two with PHP, then this is the book for you.


    Readers with a greater amount of PHP experience may like to skip ahead to The
    PHP Anthology: Object Oriented PHP Solutions, Volume II to learn how to use some
    of PHP''s more advanced features to use, and refer back to The PHP Anthology:
    Object Oriented PHP Solutions, Volume I when they need an explanation of a more
    basic concept.


    # What''s covered in this book?


    Here''s what you''ll find in each of the chapters in this volume:


    ## Chapter 1: PHP Basics


    This chapter provides a summary of all the essentials you need in order to get
    around quickly in PHP, from how to use the manual, understanding PHP error messages,
    and how includes work. There are also some tips for writing portable code, and
    we''ll take a look at the main PHP configuration.


    ## Chapter 2: Object Oriented PHP


    The second chapter includes a run-down of PHP''s class syntax, as well as a primer
    that explains how the key elements of the Object Oriented Paradigm apply to PHP.
    It''s essential preparatory reading for later chapters in this anthology.


    ## Chapter 3: PHP and MySQL


    This chapter provides you with all the essentials of MySQL, PHP''s favorite database.
    We start with the basics, covering important topics as how to avoid SQL injection
    attacks. We then delve deeply into many lesser known topics, such as MySQL FULLTEXT
    search facilities, how to repair tables and back up your database, and how to
    avoid writing SQL with PEAR::DB_DataObject. This chapter also serves as a "case
    study" in designing a class to handle connecting to, and the querying of, your
    MySQL database.


    ## Chapter 4: Files


    This chapter is a survival guide to working with files in PHP. Here, we''ll cover
    everything from gaining access to the local file system, fetching files over a
    network using PHP''s FTP client. We''ll go on how to create your own zipped archives
    with PEAR::Archive_Tar.


    ## Chapter 5: Text Manipulation


    This chapter covers the essentials of handling content on your site. We''ll discuss
    string functions you can live without, along with pros for validating and filtering
    user-submitted content. We''ll look at how you can implement a BBCode system,
    and understand the practicalities involved in preventing cross script exploits.


    ## Chapter 6: Dates and Times


    Here, you''ll learn how to store dates in your database, and how to use PHP''s
    date functions. We''ll deal with the nuances of handling different time zones,
    and implement an online calendar. We''ll see how easy it is to run batch jobs
    on your Website without access to the command line, and how to perform simple
    script performance measurements.

    '
