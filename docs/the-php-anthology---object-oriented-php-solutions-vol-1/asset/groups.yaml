  - '[PAGE 80]


    Because the Auth class needs to read and write session variables, and only a limited
    number of other, unrelated classes in an application are likely also to need use
    Session, it''s logical that it gets to create its own Session object.


    Figure 2.3 illustrates the composition in this example with UML.


    # Figure 2.3. Composition


    ![](img/80d007a3dc499b219e99d11695c2c366_80_0.png)


    # Spotting the Difference


    The general "thought test" to spot whether object A aggregates or composes object
    B is to ask. "What happens if object A dies? Will object B still be alive" If
    object B outlives the death of object A, object A is said to aggregate object
    B. But if object B dies when object A dies, then object A is said to compose object
    B.


    In terms of practical development, knowing when to apply aggregation or composition
    is important.


    Aggregation has the advantage of lower overhead, because a single object will
    be shared by many other objects. Certainly, aggregating your database connection
    class is a good idea; composing it with every object that needs to make a query
    may require you to have multiple connections to your database, which will quickly
    halt your application when site attracts high levels of traffic.


    Composition has the advantage of making classes easier to work from the outside.
    That the class doesn''t need to worry about passing the other objects it needs,
    which, in a complex application, can often become tricky and result in a "work
    around." Composition also has the advantage that you know exactly which class
    has access to the composed object. With aggregation, another object sharing the
    aggregated object may do something to its state that "breaks" the object as far
    as the other classes that use it are concerned.'
- md: "\n## Chapter 2: Object Oriented PHP\n\n## Polymorphism\n\nAnother powerful\
    \ aspect of object oriented programming is polymorphism—the ability of different\
    \ classes to share an interface.\n\nAn interface is one or more methods that let\
    \ you use a class for a particular purpose. For example, you could have two database\
    \ connection classes—one for MySQL and one for PostgreSQL. As long as they offered\
    \ a query method, you could use them interchangeably for running queries on different\
    \ databases. The query method is a simple interface that the two classes share.\n\
    \nThe classes sharing the same interface are often inherited from a parent class\
    \ that makes the common methods available. Again, this is best understood by example.\n\
    \nFirst, we define an abstract base class, Message, which provides the common\
    \ method get(). Beneath the Message class, we define concrete classes, of which\
    \ creates a specific message.\n\nThe terms \"abstract\" and \"concrete\" refer\
    \ to class usage, in particular, whether a class is intended to be used directly\
    \ or not. An abstract class is one in which some functionality or structure is\
    \ to be shared by all subclasses, but is not intended to be used directly; it\
    \ has one or more empty methods that don't do anything useful. In other words,\
    \ you're not supposed to create objects from an abstract class. A concrete class\
    \ is a subclass of the abstract class from which you create objects. Some languages,\
    \ like Java, provide support for abstract classes within the language syntax—PHP\
    \ 4 doesn't offer. You can still use the concept of abstract classes when designing\
    \ applications, though you might consider adding documentation to tell other developers\
    \ with the code that the class is abstract.\n\n```php\n<?php\nclass Message {\n\
    \    var $message;\n    function setMessage($message) {\n        $this->message\
    \ = $message;\n    }\n    function getMessage() {\n        return $this->message;\n\
    \    }\n}\n```\n\nFile: 14.php (excerpt)\n\nClick here to order The PHP Anthology\
    \ Volume I & II and get 25% off!\n\n```php\nclass PoliteMessage extends Message\
    \ {\n  function PoliteMessage()\n  {\n    $this->setMessage('How are you today?');\n\
    \  }\n}\n\nclass TerseMessage extends Message {\n  function TerseMessage()\n \
    \ {\n    $this->setMessage('Howzit?');\n  }\n}\n\nclass RudeMessage extends Message\
    \ {\n  function RudeMessage()\n  {\n    $this->setMessage('You look like ** today!');\n\
    \  }\n}\n```\n\nWe define the MessageReader class, which takes an array of Message\
    \ objects through its constructor.\n\nFile: 14.php (excerpt)\n\n```php\nclass\
    \ MessageReader {\n  var $messages;\n  function MessageReader(&$messages) {\n\
    \    $this->messages = &$messages;\n    $this->readMessages();\n  }\n  function\
    \ readMessages() {\n    foreach ($this->messages as $message) {\n      echo $message->getMessage()\
    \ . '<br />';\n    }\n  }\n}\n```\n\nThe important thing to note here is, that\
    \ as far as MessageReader is concerned, a \"Message object\" is any object that\
    \ was instantiated from the Message class or one of its subclasses. Did you see,\
    \ inside the readMessages method, we call the getMessage method? This code will\
    \ work on any object that has a getMessage method—including any subclass of Message.\n\
    \nNow, to prove the point, let’s create some Message objects using our three sub-classes\
    \ at random:\n\nFile: 14.php (excerpt)\n\n```php\n$classNames = array('PoliteMessage',\
    \ 'TerseMessage', 'RudeMessage');\n$messages = array();\nsrand((int((float)microtime())\
    \ * 1000000)); // Prepares random shuffle\nfor ($s=0; $s<10; $s++) {\n  shuffle($classNames);\n\
    \  $messages[] = new $classNames[0]();\n}\n$messageReader = new MessageReader($messages);\n\
    ?>\n```\n\nBy creating the $classNames and repeatedly shuffling it, we can take\
    \ the first element of the array and use it to create a new object:\n\n```php\n\
    $messages[] = new $classNames[0]();\n```\n\nThis is an example of a variable function.\
    \ The expression $classNames[0] is evaluated to the name of the constructor (PoliteMessage,\
    \ TerseMessage, or RudeMessage) to call.\n\nFinally, the $messages array contains\
    \ ten messages, randomly selected, and is passed to the constructor of MessageReader\
    \ on instantiation.\n\nHere’s a sample result:\n\n```\nYou look like ** today!\n\
    Howzit?\nHow are you today?\nHow are you today?\nHow are you today?\nYou look\
    \ like ** today!\nHow are you today?\nHow are you today?\nHowzit?\nHow are you\
    \ today?\n```\n\nEach time we execute the script, the list is different.\n\nBecause\
    \ all the concrete classes share the same getMethod function (i.e. they implement\
    \ the interface), the MessageReader class is able to extract the data without\
    \ knowing which particular type of message it’s dealing with. The ability for\
    \ a group of related classes to work interchangeably is called polymorphism, and\
    \ is illustrated in the UML diagram in Figure 2.4.\n\n## Figure 2.4. Polymorphism\n\
    \n| MessageReader | Message |\n| :--- | :--- |\n| -messages : array | -message\
    \ : string |\n| -readMessages(): void | +getMessage() : string |\n| | #setMessage(in\
    \ message : string) : void |\n\nThis aspect of object oriented programming can\
    \ be very powerful once you realize its worth. You might have a collection of\
    \ objects representing HTML tags, for example.\n"
  mdcn: "\n\n## 第 2 章：面向对象的 PHP\n\n## 多态\n\n面向对象编程的另一个强大方面是多态——不同类共享同一个接口的能力。\n\n\
    接口由一个或多个方法组成，允许你为了特定目的使用某个类。例如，你可以有两个数据库连接类——一个用于 MySQL，另一个用于 PostgreSQL。只要它们提供一个\
    \ `query` 方法，你就可以交替使用它们在不同的数据库上运行查询。`query` 方法就是这两个类共享的简单接口。\n\n共享相同接口的类通常继承自父类，该父类提供了公共方法。同样，通过示例来理解是最好的。\n\
    \n首先，我们定义了一个抽象基类 `Message`，它提供了公共方法 `get()`。在 `Message` 类之下，我们定义了具体类，这些类创建特定的消息。\n\
    \n“抽象（abstract）”和“具体（concrete）”术语指的是类的用法，特别是指一个类是否被设计为直接使用。抽象类是所有子类都将共享某些功能或结构，但并不打算被直接使用的类；它有一个或多个不执行任何用处的空方法。换句话说，你不应该从抽象类创建对象。具体类是抽象类的子类，你可以从中创建对象。某些语言（如\
    \ Java）在语言语法中提供了对抽象类的支持——PHP 4 则没有。尽管如此，在设计应用程序时你仍然可以使用抽象类的概念，不过你可能考虑添加文档告诉告诉代码的其他开发者该类是抽象的。\n\
    \n```php\n<?php\nclass Message {\n    var $message;\n    function setMessage($message)\
    \ {\n        $this->message = $message;\n    }\n    function getMessage() {\n\
    \        return $this->message;\n    }\n}\n```\n\n文件：14.php (节录)\n\n[点击此处订购 The\
    \ PHP Anthology Volume I & II 并享受 75 折优惠！]()\n\n```php\nclass PoliteMessage extends\
    \ Message {\n  function PoliteMessage()\n  {\n    $this->setMessage('How are you\
    \ today?');\n  }\n}\n\nclass TerseMessage extends Message {\n  function TerseMessage()\n\
    \  {\n    $this->setMessage('Howzit?');\n  }\n}\n\nclass RudeMessage extends Message\
    \ {\n  function RudeMessage()\n  {\n    $this->setMessage('You look like ** today!');\n\
    \  }\n}\n```\n\n我们定义了 `MessageReader` 类，它通过构造函数接收一个 `Message` 对象的数组。\n\n文件：14.php\
    \ (节录)\n\n```php\nclass MessageReader {\n  var $messages;\n  function MessageReader(&$messages)\
    \ {\n    $this->messages = &$messages;\n    $this->readMessages();\n  }\n  function\
    \ readMessages() {\n    foreach ($this->messages as $message) {\n      echo $message->getMessage()\
    \ . '<br />';\n    }\n  }\n}\n```\n\n这里需要注意的重要点是，对于 `MessageReader` 而言，“消息对象”是任何从\
    \ `Message` 类或其任一子类实例的对象。你看到了吗，在 `readMessages` 方法内部调用了 `getMessage` 方法？这段代码适用于任何具有\
    \ `getMessage` 方法的对象——包括 `Message` 的任何子类。\n\n现在，为了证明这一点，让我们使用我们的三个子类随机创建一些 `Message`\
    \ 对象：\n\n文件：14.php (节录)\n\n```php\n$classNames = array('PoliteMessage', 'TerseMessage',\
    \ 'RudeMessage');\n$messages = array();\nsrand((int((float)microtime()) * 1000000));\
    \ // 准备随机洗牌\nfor ($s=0; $s<10; $s++) {\n  shuffle($classNames);\n  $messages[]\
    \ = new $classNames[0]();\n}\n$messageReader = new MessageReader($messages);\n\
    ?>\n```\n\n通过创建 `$classNames` 并反复洗牌，我们可以获取数组的第一个元素并用它创建一个新对象：\n\n```php\n$messages[]\
    \ = new $classNames[0]();\n```\n\n这是一个变量函数的示例。表达式 `$classNames[0]` 被求值为要调用的构造函数名称（`PoliteMessage`、`TerseMessage`\
    \ 或 `RudeMessage`）。\n\n最后，`$messages` 数组包含了随机选择的消息，并在实例化时传递给 `MessageReader` 的构造函数。\n\
    \n这是一个示例结果：\n\n```\nYou look like ** today!\nHowzit?\nHow are you today?\nHow\
    \ are you today?\nHow are you today?\nYou look like ** today!\nHow are you today?\n\
    How are you today?\nHowzit?\nHow are you today?\n```\n\n每次我们执行脚本时，列表都是不同的。\n\n\
    由于所有具体类都共享相同的 `getMessage` 函数（即它们实现了接口），`MessageReader` 类能够提取数据，而无需知道它处理的是哪种类型的消息。一组相关类交替工作的能力被称为多态，如图\
    \ 2.4 所示的 UML 图。\n\n## 图 2.4. 多态\n\n| MessageReader | Message |\n| :--- | :---\
    \ |\n| -messages : array | -message : string |\n| -readMessages(): void | +getMessage()\
    \ : string |\n| | #setMessage(in message : string) : void |\n\n一旦你意识到它的价值，面向对象编程的这个方面将非常强大。例如，你可能有一个代表\
    \ HTML 标签的对象集合。\n\n"
