    # The Top Security Vulnerabilities


    contains the session ID. In general, it''s better to handle sessions with cookies.
    If you''re working with your own cookie-based authentication, store an identifying
    ID in the cookie only, not the user name and password.


    # Cross Site Scripting (XSS)


    By using the legitimate mechanisms your site provides, it''s possible for attackers
    to post on your site, for example, JavaScript that results in other users giving
    away their session IDs, thereby allowing the attacker to hijack their session.
    Less serious, but equally embarrassing, is simply posting HTML that "scrambles"
    the layout of your page, perhaps closing a tag prematurely. Use a "deny a little"
    approach, or better yet, employ a separate markup language as BBCode (Chapter
    5), while eliminating HTML PHP functions like strip_tags and htmlentitiesities.
    If you really want to allow HTML to be posted, consider building a filter based
    on PEAR::XML_HTMLSax[5] (see Volume II, Chapter 2).


    # Command Injection


    Command injection occurs when an attacker is able to influence the way PHP interacts
    with external systems, such as the file system or database. A SQL injection is
    an example, which occurs when an attacker uses a form or URL to modify a database
    query. This was discussed in detail in Chapter 3. The bottom line is: escape all
    data you receive from a user before you use it in.


    # Error Handling


    An experienced attacker will be able to gain a lot of important information about
    your system from your error messages. Although this comes under the heading of
    "security obscurity" (which is no substitute for a really secure application),
    for a live site, it''s a good idea to instruct PHP to log error messages to a
    file, rather than display them to the browser. See Appendix A for details.


    # Insecure Use of Cryptography


    First of all, when it comes to cryptography, don''t roll your own. Remember that
    if it''s an algorithm that''s meant to be decoded, someone (other than you) is
    also capable of decoding it. Remember, strictly speaking, MD5 is not an encryption
    algorithm (i.e. you cannot decrypt an


