    \n全文索引是从 MySQL 3.23 版本引入的。当时的实现相当有限，但对于基础搜索仍然很有用，这也是我将在这里演示的。在 MySQL 4.0.1 中，此功能扩展到了完整的布尔搜索机制，使你能够构建类似于\
    \ Google 高级搜索功能的功能。全文索引还允许每个结果带有一个“相关性”值返回，例如，多个单词搜索的结果可以根据每个结果与用户特定搜索的匹配程度来显示。\n\
