    \n## Appendix D: Working with PEAR\n\nPEAR[1], the PHP Extension and Application\
    \ Repository, is the brainchild of Stig Bakken, and was inspired by Perl's CPAN[2].\n\
    \nAs a project, it was originally conceived in 1999 and reached its first stable\
