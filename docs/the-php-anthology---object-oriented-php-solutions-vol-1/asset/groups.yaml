    \n# SQL 注入攻击\n\nSQL 注入发生于攻击者利用你网站上合法的用户输入机制发送 SQL 代码，而你毫无防备的脚本会将这些代码传递给数据库执行。黄金法则：在让数据接触数据库之前，对所有来自外部源的数据进行转义。该规则不仅适用于\
    \ `INSERT` 和 `UPDATE` 查询，也适用于 `SELECT`。\n\n许多 PHP 开发者由于 MySQL 的局限性免受 SQL 注入的影响，每次调用\
