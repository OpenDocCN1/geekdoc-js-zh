- md: "\nHow do I fetch data from a table?\n\nThe point of using a class here is to\
    \ get some practice using PHP's object model to deal with common tasks. If you're\
    \ new to object oriented programming with PHP, the most important thing to remember\
    \ at this stage is that you don't need to understand all the code you find in\
    \ a class to be used in your code.\n\nWe'll be making use of this class and others\
    \ throughout the book to illustrate how object oriented programming allows the\
    \ reuse of code and can save time when you're developing applications.\n\n## How\
    \ do I fetch data from a table?\n\nBeing connected to a database is nice, sure.\
    \ But what good is it if we can't get anything from it?\n\nThere are a number\
    \ of ways to fetch data from MySQL, but the most widely used is probably mysql_fetch_array\
    \ in conjunction with mysql_query.\n\nWe just need to add a little more to the\
    \ connectToDb function we saw in “How do I access a MySQL database?” to fetch\
    \ data from this table:\n\n```php\n// Connect to MySQL\n$dbConn = &connectToDb($host,\
    \ $dbUser, $dbPass, $dbName);\n\n// A query to select all articles\n$sql = \"\
    SELECT * FROM articles ORDER BY title\";\n\n// Run the query, identifying the\
    \ connection\n$queryResource = mysql_query($sql, $dbConn);\n\n// Fetch rows from\
    \ MySQL one at a time\nwhile ($row = mysql_fetch_array($queryResource, MYSQL_ASSOC))\
    \ {\n    echo 'Title: ' . $row['title'] . ' <br />';\n    echo 'Author: ' . $row['author']\
    \ . ' <br />';\n    echo 'Body: ' . $row['body'] . ' <br />';\n}\n```\n\nFile:\
    \ 4.php\n\nEssentially, there are three steps to getting to your data:\n\n1. First,\
    \ place the necessary SQL query in a string\n\n> If you are unfamiliar with Structured\
    \ Query Language (SQL), I'll cover the bases through this chapter. For a more\
    \ complete tutorial, refer to Build Your Own Website Driven Using PHP & MySQL,\
    \ 2nd Edition (ISBN 0-9579218-0).\n\nClick here to order The PHP Anthology Volume\
    \ I & II and get 25% off!\n\n# Chapter 3: PHP and MySQL\n\n```php\n$sql = \"SELECT\
    \ * FROM articles ORDER BY title\";\n```\n\nIt's handy to keep it in a separate\
    \ variable, as when we get into writing complex queries and something goes wrong,\
    \ we can double-check our query with this one-liner:\n\n```php\necho $sql;\n```\n\
    \n2. Next, tell MySQL to perform the query:\n\n```php\n$queryResource = mysql_query($sql,\
    \ $dbConn);\n```\n\nThis can be confusing at first. When you tell MySQL to perform\
    \ a query, it doesn't immediately give you the results. It holds the results in\
    \ memory until you tell it what to do. PHP keeps track of the results with a resource\
    \ identifier, which is what you get back from the mysql_query function. In the\
    \ code above, we've stored the identifier in $queryResource.\n\n3. Finally, use\
    \ mysql_fetch_array to fetch one row at a time from the set of results:\n\n```php\n\
    while ($row = mysql_fetch_array($queryResource, MYSQL_ASSOC))\n```\n\nThis places\
    \ each row of results in the variable $row. Each of these rows will be represented\
    \ by an array. By using the additional argument MYSQL_ASSOC with mysql_fetch_array,\
    \ we've told the function to give us an array in which the keys correspond to\
    \ column names in the table. If you omit the MYSQL_ASSOC argument, each column\
    \ will appear once with a numerical index (i.g. $row[0], $row[1], etc.), and once\
    \ with a string index (i.g. $row['title'], $row['author'], etc.). While this doesn't\
    \ usually cause a problem, specifying the type of array you want will speed things\
    \ up slightly.\n\nUsing a loop, as shown above, is a common way to process each\
    \ row of the result set. The loop effectively says, \"Fetching rows from MySQL\
    \ until I can't get any more\", with the body of the loop processing the rows\
    \ as they're fetched.\n\n## Foreground Buffering on Large Queries\n\nFor large\
    \ queries (that is, queries that produce large result sets), you can improve performance\
    \ dramatically by telling PHP not to buffer the results of the query. When a query\
    \ is buffered, the entire result is retrieved from MySQL and stored in memory\
    \ before your script allows to proceed.\n\nClick here to order The PHP Anthology\
    \ Volume I & II and get 25% off!\n\n## Fetching with Classes\n\nunbuffered query,\
    \ on the other hand, lets MySQL hold onto the results until you request them,\
    \ one row at a time (e.g. with mysql_fetch_array). Not only does this allow your\
    \ script to continue running while MySQL performs the query, it also saves PHP\
    \ from having to store all of the rows in memory at:\n\nPHP lets you perform unbuffered\
    \ queries with mysql_unbuffered_query:\n\n```php\n$QueryResource = mysql_unbuffered_query($sql,\
    \ $dbConn);\n```\n\nOf course all good things come at a price—unbuffered queries\
    \ you can no longer use the mysql_num_rows function to count the number of rows.\
    \ Obviously, as PHP doesn't keep a copy of the complete result set, it is unable\
    \ to count the rows it! You must fetch all rows in the result set from MySQL before\
    \ you can make another query.\n\nAlthough other functions exist for existing rows\
    \ and cells from query results, like mysql_fetch_object and mysql_result, you\
    \ can achieve more or less the same things with just mysql_fetch_array, and the\
    \ consistency may help keep your code simple.\n\nNow that you're happy with the\
    \ basics of fetching data from MySQL, it's time to build more on the MySQL class\
    \ from the last solution.\n\nFirst, let's add a method to run queries from the\
    \ class:\n\n> File: Database/MySQL.php (in SPLITB8) (excerpt)\n\n```php\n/**\n\
    \ * Returns an instance of MySQLResult to fetch rows with\n * @param string $sql\
    \ the database query to run\n * @return MySQLResult\n * @access public\n */\n\
    function query($sql) {\n    if (!$queryResource = mysql_query($sql, $this->dbConn))\
    \ {\n        trigger_error('Query failed: ' . mysql_error($this->dbConn)\n   \
    \         ' SQL: ' . $sql);\n    }\n    return new MySQLResult($this, $queryResource);\n\
    }\n```\n\n# Chapter 3: PHP and MySQL\n\nWhat this new method does is accept a\
    \ variable containing an SQL statement, run it, then build a new object from another\
    \ class, MySQLResult (described below). It returns this object to the point where\
    \ query was called.\n\nHere’s the code for that new class, MySQLResult:\n\n```php\n\
    /**\n * MySQLResult Data Fetching Class\n * @access public\n * @package SPLIB\n\
    \ */\nclass MySQLResult {\n/**\n * Instance of MySQL providing database connection\n\
    \ * @access private\n * @Var MySQL\n */\nvar $mysql;\n\n/**\n * Query resource\n\
    \ * @access private\n * @var resource\n */\nvar $query;\n\n/**\n * MySQLResult\
    \ object mysql (instance of MySQL class)\n * @param resource query (MySQL query\
    \ resource)\n * @access public\n */\nfunction MySQLResult(&$mysql, &$query) {\n\
    \  $this->mysql = &$mysql;\n  $this->query = $query;\n}\n\n/**\n * Fetches a row\
    \ from the result\n * @return array\n * @access public\n */\nfunction fetch()\
    \ {\n}\n```\n\nFile: Database/MySQL.php (in SPLIB) (excerpt)\n\n76 Click here\
    \ to order The PHP Anthology Volume 1 & II and get 25% off!\n\n```php\nif ($row\
    \ = mysql_fetch_array($query, MYSQL_ASSOC)) {\n    return $row;\n} else if ($this->size()\
    \ > 0) {\n    mysql_seek($query, 0);\n    return false;\n} else {\n    return\
    \ false;\n}\n```\n\n```php\n/**\n * Checks for MySQL errors\n * @return boolean\n\
    \ * @access public\n */\nfunction isError() {\n    return $this->mysql->isError();\n\
    }\n```\n\nNow, hold your breath just a little until you've seen what using these\
    \ classes are like:\n\nFile: 5.php\n\n```php\n<?php\n// Include the class\nrequire_once\
    \ 'Database/MySQL.php';\n\n$host = 'localhost'; // Hostname of MySQL server\n\
    $dbUser = 'harry'; // Username for MySQL\n$dbPass = 'secret'; // Password for\
    \ user\n$dbName = 'sitepoint'; // Database name\n\n// Connect to MySQL\n$db =\
    \ &new MySQL($host, $dbUser, $dbPass, $dbName);\n$sql = \"SELECT * FROM articles\
    \ ORDER BY title\";\n\n// Perform a query getting back MySQLResult object\n$result\
    \ = $db->query($sql);\n\n// Iterate through the results\nwhile ($row = $result->fetch())\
    \ {\n    echo 'Title: ' . $row['title'] . '<br>';\n    echo 'Author: ' . $row['author']\
    \ . '<br>';\n}\n```\n\n```php\necho 'Body: ' . $row['body'] . '<br />';\n?>\n\
    ```\n"
  mdcn: "\n\n我如何从表中获取数据？\n\n在这里使用类的目的是为了练习使用 PHP 的对象模型来处理常见任务。如果你是 PHP 面向对象编程的新手，在这个阶段最需要记住的一点是：你不需要理解类中发现的所有代码，就可以在你的代码中使用它。\n\
    \n我们将在整本书中使用这个类以及其他类，用来说明面向对象编程如何允许代码复用，并在开发应用程序时节省时间。\n\n## 我如何从表中获取数据？\n\n连接到数据库当然是好事。但如果我们无法从从中获取任何内容，它又有什么用呢？\n\
    \n从 MySQL 获取数据有多种方法，但最常用的可能是结合 `mysql_query` 使用 `mysql_fetch_array`。\n\n我们只需要在“我如何访问\
    \ MySQL 数据库？”中看到的 `connectToDb` 函数中添加一点内容，就可以从该表中获取数据：\n\n```php\n// Connect to\
    \ MySQL\n$dbConn = &connectToDb($host, $dbUser, $dbPass, $dbName);\n\n// 查询所有文章的\
    \ SQL\n$sql = \"SELECT * FROM articles ORDER BY title\";\n\n// 执行查询，标识连接\n$queryResource\
    \ = mysql_query($sql, $dbConn);\n\n// 一次从 MySQL 获取行数据\nwhile ($row = mysql_fetch_array($queryResource,\
    \ MYSQL_ASSOC)) {\n    echo 'Title: ' . $row['title'] . ' <br />';\n    echo 'Author:\
    \ ' . $row['author'] . ' <br />';\n    echo 'Body: ' . $row['body'] . ' <br />';\n\
    }\n```\n\n文件: 4.php\n\n本质上，获取数据有三个步骤：\n\n1. 首先，将必要的 SQL 查询语句放在字符串中\n\n> 如果你不熟悉结构化查询语言\
    \ (SQL)，我将在本章中介绍基础知识。如需更完整的教程，请参阅《Build Your Own Website Driven Using PHP & MySQL,\
    \ 2nd Edition》(ISBN 0-9579218-0)。\n\n点击此处订购《PHP Anthology Volume I & II》并享受 75\
    \ 折优惠！\n\n# 第 3 章：PHP 和 MySQL\n\n```php\n$sql = \"SELECT * FROM articles ORDER\
    \ BY title\";\n```\n\n将它保持在单独变量中非常方便，因为当我们开始编写复杂的查询并出现问题时，我们可以通过这一单行代码双检我们的查询：\n\
    \n```php\necho $sql;\n```\n\n2. 接下来，告诉 MySQL 执行查询：\n\n```php\n$queryResource =\
    \ mysql_query($sql, $dbConn);\n```\n\n这起初可能会让人困惑。当你告诉 MySQL 执行查询时，它并不会立即给你结果。它将结果保存在内存中，直到你告诉它要做什么。PHP\
    \ 使用资源标识符来跟踪结果，这就是你从 `mysql_query` 函数获取的返回值。在上面的代码中，我们将标识符存储在 `$queryResource`\
    \ 中。\n\n3. 最后，使用 `mysql_fetch_array` 从结果集中一次获取行数据：\n\n```php\nwhile ($row = mysql_fetch_array($queryResource,\
    \ MYSQL_ASSOC))\n```\n\n这将结果集的每一行都放在变量 `$row` 中。这些行中的每一行都将由一个数组表示。通过在 `mysql_fetch_array`\
    \ 使用额外的参数 `MYSQL_ASSOC`，我们告诉函数返回一个数组，其中其键（keys）与表中的列名对应。如果你省略了 `MYSQL_ASSOC` 参数，每个列将以数字索引出现一次（例如\
    \ `$row[0], $row[1]` 等），并以字符串索引出现一次（例如 `$row['title'], $row['author']` 等）。虽然这通常不会引起问题，但指定你想要的数组类型将稍微提高速度。\n\
    \n如上所示，使用循环处理结果集的每一行是一种常用方法。循环实际上是在说：“从 MySQL 获取行，直到我无法获取更多数据为止”，而循环体会在获取每一行时对对其进行处理。\n\
    \n## 大规模查询的前台缓冲（Foreground Buffering）\n\n对于大型查询（即产生大型结果集的查询），你可以通过告诉 PHP 不要缓冲查询结果来大幅提高性能。当查询被缓冲时，整个结果在从\
    \ MySQL 获取并存储在内存中之前，你的脚本才会被继续执行。\n\n点击此处订购《PHP Anthology Volume I & II》并享受 75\
    \ 折优惠！\n\n## 使用类获取数据\n\n另一方面，无缓冲查询（unbuffered query）允许 MySQL 保留结果，直到你一次一次地请求它们（例如使用\
