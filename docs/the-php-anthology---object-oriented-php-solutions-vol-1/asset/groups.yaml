    ?php echo $baseUrl;?category=CSS\">CSS</a></p>\n</body>\n</html>\n```\n\n你可以看到，控制主体会寻找\
    \ `$_GET['category']` 变量。如果它存在，就会创建一个 `CategoryHeader` 实例，显示导航以允许用户找到返回首页的路。但如果它不存在，则会创建一个父类\
    \ `StandardHeader` 实例，这适用于用户查看首页时（因此不需要面包屑来返回首页）。\n\n换句话说，继承允许我们添加所需的额外功能，而无需重现父类中已有的逻辑；由于现有的方法和逻辑可以通过子子类进行复用。\n\
    \n继承提供了一种强大的机制，可以创建出模块化的类来解决特定问题，同时确保无论我们处理的是哪个具体的对象，共享的方法和变量都可以被使用。\n\n# 避免深层次的继承结构\n\
    \n作为一个通用的准则，当使用继承来构建类层次结构时，深度不要超过两代。\n\n![](img/80d007a3dc499b219e99d11695c2c366_76_0.png)\n\
    \n# 第 2 章：面向对象的 PHP\n\n这样做通常是设计不佳的标志，即错过了类之间以不同方式交互的机会（参见下一个解决方案）。在实践中，类层次超过两代通常会导致各种调试问题，并使代码难以维护。例如，可能很难跟踪你在层次结构高层使用的变量名。\n\
    \n# 对象之间如何交互？\n\n除了继承之外，对象之间还有其他交互方式；例如，一个对象使用另一个对象。在许多方面，这种交互比继承更重要，这正是面向对象范式展现其实力的地方。\n\
    \n一个对象可以使用其他对象的方法有两种：**聚合（aggregation）和组合（composition）。**\n\n# 聚合 (Aggregation)\n\
    \n当一个对象“临时借用”另一个对象时，就会发生聚合。第二个对象通常会被传递给第一个对象的成员函数。随后第一个对象就可以调用第二个对象的方法，允许它将第二个对象中存储的功能用于自己的目的。\n\
    \n聚合的一个常见示例涉及数据库连接类。想象你将一个数据库连接类传递给另一个类，然后该类使用该数据库连接类来执行查询。执行查询的类**聚合**了数据库连接类。\n\
    \n这里有一个使用 MySQL 类的简单示例，我们将在第 3 章创建它：\n\n```php\n<?php\n// 引入 MySQL 数据库连接类\nrequire_once\
    \ 'Database/MySQL.php';\n\n// 聚合 MySQL 类的类\nclass Articles {\n    var $db;\n \
    \   var $result;\n    // 接收 MySQL 类的实例\n\n``````php\nfunction Articles(&$db) {\n\
    \  // 将对象赋值给本地成员变量\n  $this->db = &$db;\n  $this->readArticles();\n}\nfunction\
    \ readArticles() {\n  // 使用 MySQL 类执行查询\n  $sql = \"SELECT * FROM articles LIMIT\
    \ 0,5\";\n  $this->result = $this->db->query($sql);\n}\nfunction fetch() {\n \
    \ return $this->result->fetch();\n}\n```\n\n// 创建 MySQL 类的实例\n$db = &new MySQL('localhost',\
    \ 'harryf', 'secret', 'sitepoint');\n\n// 创建 Article 类的实例，传递 MySQL 对象\n$articles\
    \ = &new Articles($db);\n\n```php\nwhile ($row = $articles->fetch()) {\n  echo\
    \ '<pre>';\n  print_r($row);\n  echo '</pre>';\n}\n```\n\n你可以看到，控制主体会寻找 `$_GET['category']`\
    \ 变量。如果它存在，就会创建一个 `CategoryHeader` 实例，显示导航以允许用户找到返回首页的路。但如果它不存在，则会创建一个父类 `StandardHeader`\
    \ 实例，这适用于用户查看首页时（因此不需要面包屑来返回首页）。\n\n换句话说，继承允许我们添加所需的额外功能，而无需重现父类中已有的逻辑；现有的方法和逻辑可以通过子子类进行复用。\n\
    \n继承提供了一种强大的机制，可以创建出模块化的类来解决特定问题，同时确保无论我们处理的是哪个具体的对象，共享的方法和变量都可以被使用。\n\n# 第 2\
    \ 章：面向对象的 PHP\n\n| Articles |\n| :--- |\n| $db |\n| $result |\n| 接收 MySQL 类的实例\
    \ |\n| (string) |\n| 共享的方法和变量都可以 |\n| 无论我们处理的是哪个具体的对象。 |\n\n| Articles |\n| :---\
    \ |\n| $db |\n| $result |\n| +readArticles() |\n| +fetch() |\n\n## 聚合 (Aggregation)\n\
    \n当一个对象“临时借用”另一个对象时，就会发生聚合。第二个对象通常会被传递给第一个对象的成员函数。随后第一个对象就可以调用第二个对象的方法，允许它将第二个对象中存储的功能用于自己的目的。\n\
    \n聚合的一个常见示例涉及数据库连接类。想象你将一个数据库连接类传递给另一个类，然后该类使用该数据库连接类来执行查询。执行查询的类**聚合**了数据库连接类。\n\
    \n这里有一个使用 MySQL 类的简单示例，我们将在第 3 章创建它：\n\n```php\n<?php\n// 引入 MySQL 数据库连接类\nrequire_once\
    \ 'Database/MySQL.php';\n\n// 聚合 MySQL 类的类\nclass Articles {\n    var $db;\n \
