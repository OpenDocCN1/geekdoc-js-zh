    # 2 Object Oriented PHP


    The object oriented paradigm is an approach to programming that''s intended to
    encourage the development of maintainable and well structured applications. Many
    PHP coders regard **object oriented programming** (OOP) as some kind of mystic
    art, given that frequently, of PHP look only at **procedural** approaches to adopting
    an object oriented approach to solving problem. This is a shame, as there is much
    to be gained from adopting an object oriented approach to developing PHP applications,
    perhaps the most important being employed to code reuse. A well written piece
    of object oriented code can easily solve the same problem in other projects; we
    can simply slot it whenever we need it. There is a growing number of object oriented
    code repositories, such as PEAR[1] and PHP Classes[2], which can save you from
    hours of work spent solving well charted problems, and leave you free to focus
    on the specifics of your application.


    In this chapter, you''ll gain a practical grounding in writing object oriented
    PHP—and there''ll be plenty of opportunities to get your hands dirty. There are
    many ways to teach OOP, and the topic provides endless room for discussion. In
    my opinion, the best approach is to dive in head first, seeing how procedural
    tasks can be accomplished with classes in PHP, and adding the theory as we go.
    This is the approach we''ll take in this chapter. Throughout both volumes of The


