    ## 附录 D：使用 PEAR


    （注意，如果你通过 Web 服务器执行了 go-pear.php，则也安装了 Web 端前端）。输入以下命令：


    ```

    pear install Net UserAgent_Detect

    pear install Pager

    pear install HTML_Template_IT

    pear install PEAR_Frontend_Web

    ```


    请注意前三个包是 PEAR_Frontend_Web 必需的。完成后，你可以使用以下简单脚本从 Web 服务器上启动前端：


    ```php

    <?php

    // 如果未设置包含路径，则此项可选

    # ini_set(''include_path'', ''c:\htdocs\PEAR'');


    require_once ''PEAR.php'';


    // 对于 Windows 用户

    # $user_config = ''c:\windows\pear.ini'';

    // 对于 Unix 用户

    $user_config = ''/home/username/pear/pear/PEAR/pear.conf'';


    $useHTML = TRUE; // 旧版浏览器请关闭


    require_once ''PEAR/WebInstaller.php'';

    ?>

    ```


    ## 手动安装包


    可以手动安装包（尽管这涉及更多工作），但在这样做时，务必仔细观察包含路径（include paths）。首先，创建一个作为你安装的所有 PEAR 类基础的目录。该目录必须在你的包含路径中。接下来，安装主
    PEAR 包[11]——下载最新稳定版本并将其解压到你创建的目录，使得 `PEAR.php` 位于该目录的根目录下。


    安装更多包可以以大致相同的方式完成，但你需要小心解压到哪个目录。例如，查看 PEAR::DB，主文件 `DB.php` 与 `PEAR.php` 文件并列位于
    PEAR 类目录下，而其他与 PEAR::DB 相关的文件则位于子目录。最好的检查方法是查看每个 PEAR 包附带的 `package.xml` 文件。


    > [11] http://pear.php.net/package/PEAR


    该文件包含一个名为 `filelist` 的元素，列出了包中包含的所有文件以及它们应该安装的位置。对于每个文件，检查 `baseinstalldir` 属性，如果指定了该属性，它会告诉文件相对于
    PEAR 类根目录应该放置的位置。`name` 属性指定了相对于 `baseinstalldir`（如果没有 `baseinstalldir` 属性，则直接相对于
    PEAR 类根目录）的每个文件应放置的路径和文件名。


