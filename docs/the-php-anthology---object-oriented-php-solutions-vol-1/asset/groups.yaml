    ## Key Security and Portability Settings


    Table A.1 shows the most important PHP settings that relate to the security and
    portability of your PHP scripts.


    ## Appendix A: PHP Configuration


    ## Table A.1. Key Security and Portability Settings


    | Setting | Notes |

    | --- | --- |

    | register_globals (default: off) | Automatically creates global variables from
    incoming HTTP request variables, such as GET and POST. For security and portability,
    it is highly recommended to switch this off. See http://www.php.net/register_globals
    for more details. |

    | magic_quotes_gpc (default: off) | Automatically escapes quotes in HTTP request
    variables with a backslash, helping prevent SQL injection attacks. If you know
    you''re doing, it''s usually better to switch this functionality off and handle
    this escaping yourself when inserting into a database, given the problems this
    feature can cause you with, as well as the performance overhead that it introduces.
    See Chapter 1 for information on making your scripts compatible with this feature.
    |

    | call_time_pass_reference (default: off) | Allows you to use variable references
    at call time (e.g. htmlentities($string)). To keep code clean and understandable,
    and to ensure portability, keep this functionality switched off |

    | short_open_tag (default: on) | Allows you to start a block of PHP with just
    <? instead of the longer <?php. Also lets you write out expressions with <=?,
    which is identical to <?php echo. While convenient, these shortcuts are not XML
    compliant, and can cause the PHP processor to become confused when it encounters
    XML processing instructions such as <?xml version="1.0"?. Many people have short_open_tag
    switched off, so, for maximum portability, avoid the shortcuts and switch this
    feature off during development. |

    | asp_tags (default: off) | Allows ASP style tags <% ... %> as an alternative
    to the PHP and open tags (<?php ... ?>). Few people use this, so, for maximum
    portability, it''s best to avoid them, and switch this feature off during development.
    |


    Click here to order The PHP Anthology Volume 1 & II and get 25% off!


    | Setting | Notes |

    |---|---|

    | error_reporting (default: E_ALL & -E_NOTICE) | When developing, and for maximum
    portability, it''s best to set this to E_ALL, so that PHP will inform you of situations,
    for example, a $_GET variable your code relies upon has been initialized. This
    forces you to write code that is more secure and contains fewer errors, also ensures
    that your code will run neatly on servers. |

    | display_errors (default: on) | Determines whether PHP sends error messages to
    the Web browser. When running your application in a live environment, it''s generally
    better to switch this off, instead using PHP''s logging mechanism to capture errors
    to a file, for example. |

    | open_baseddir (default: not set) | Allows you to restrict all PHP file operations
    to a given directory or below. This can be a good idea to prevent a script that
    is used to display the contents of files, for example, from being used to access
    sensitive files elsewhere on your server. |

    | allow_url_fopen (default: on) | Allows you to specify remote file locations
    for use with functions fopen (e.g, fopen(''http://www.sitepoint.com/'',''r''));
    It''s a handy tool but also potentially a security risk for a badly written script.
    Switch it off if you know you don''t need it. |


    ## Includes and Execution Settings


    Table A.2 shows the most important PHP settings that relate to includes, and how
    well your PHP scripts run.


    ## Table A.2. Includes and Execution Settings


    | Setting | Notes |

    |---|---|

    | include_path (default: ''.'') | Allows you to specify relative and absolute
    paths that PHP should search when you use one of the include related commands.
    Make sure you have at least the current directory (.) specified, or most third
    party scripts will fail to work. On Unix systems, the list of directories is separated
    by colons (;), while on Windows the separator is a semicolon (:). |

    | auto_prepend_file (default: not set) | PHP will execute the file(s) before executing
    any requested script. Useful for performing site-wide operations such as security,
    logging, defining error handlers, stripping backslashes added by the magic quotes
    feature, and so on. Useful for applications that you use only yourself, but unsuitable
    for use code you intend to distribute. Those unable to modify php.ini settings
    with .htaccess files will be unable to use such code. The separator is the same
    as used for the include_path setting. |

    | auto_append_file (default: not set) | The twin of auto_prepend_file, executed
    after requested script. |

    | max_execution_time (default: 30) | Specifies the maximum execution time (in
    seconds) for which a PHP script run a Web server may be allowed to execute. Generally,
    it is best to leave this as the default and use the set_time_limit function to
    extend the limit on a per-script basis. Value of 0 either removes any limitations
    on script execution time. |

    | memory_limit (default: 8M) | The amount of memory PHP has available to it at
    runtime. Usually, the default is fine, when handling very large XML documents,
    for example, or dealing with images, you may need to increase it. The bigger this
    value, the more memory a script actually uses, the less memory is available for
    other applications running on your server. |


    ## Error-Related Settings


    Table A.3 shows the most important PHP settings that relate to the way PHP handles
    errors, in addition to display_errors and error_reporting, which are described
    in A.1.


    | Setting | Notes |

    | --- | --- |

    | post_max_size (default: 8M) | The maximum amount of data that PHP will accept
    via an HTTP POST (e.g. form that uploads an image). You may need to increase this
    if you have an application that will upload bigger files. |


    ## Table A.3. Error-Related Settings


    | Setting | Notes |

    | --- | --- |

    | log_errors (default: off) | Allows you to log errors to a text file, in conjunction
    with error_log (below). Useful for a live site where you''ve switched off the
    display of errors to visitors. |

    | error_log (default: not set) | A filename to which errors are logged when log_errors
    is switched on. |

    | ignore_repeated_errors (default: off) | Using this, if the same error occurs
    from the same script on the same line, it will only be reported once per script
    execution. Helps prevent massive log files resulting from errors that occur in
    loops, when logging to a file. |

    | ignore_repeated_seconds (default: 30) | Similar to ignore_repeated_errors, but
    in this case, it suppresses repeated errors of the same type throughout a PHP
    script. |

    | report_memleaks (default: on) | Make sure this is switched on, especially if
    you''re using experimental versions or non-stable releases of PHP, otherwise you
    may end up crashing your server once memory has eaten up all available space.
    error_reporting must be set to report warnings for this setting to apply. |


    ## Miscellaneous Settings


    Table A.4 shows additional important settings that you should be aware of in your
    PHP configuration.


    ## Table A.4. Miscellaneous Settings


    | Setting | Notes |

    | --- | --- |

    | session.save_path (default: /tmp) | If storing sessions in files on a Windows-based
    system, you will need to modify this setting to an available directory to which
    PHP can write session files. |

    | session.use_cookies (default: 1) | Use cookies to store the session ID on the
    client, rather than placing the session ID in the URL (which can present a greater
    risk to security). |

    | extension_dir (default: ''./'') | The path where compiled PHP extensions can
    be found. On Windows-based systems, it might be something like this `extension_dir
    = C:\php-4.3.2\extensions\` |

    | extension | On Windows based systems only, this is used to identify all the
    extensions which should be loaded. The extensions specified should reside in the
    extension_dir path (above). For example: `extension = php_xslt.dll` |

    '
