- md: "\n## 2 Object Oriented PHP\n\nThe object oriented paradigm is an approach to\
    \ programming that's intended to encourage the development of maintainable and\
    \ well structured applications. Many PHP coders regard **object oriented programming**\
    \ (OOP) as some kind of mystic art, given that frequently, of PHP look only at\
    \ **procedural** approaches to adopting an object oriented approach to solving\
    \ problem. This is a shame, as there is much to be gained from adopting an object\
    \ oriented approach to developing PHP applications, perhaps the most important\
    \ being employed to code reuse. A well written piece of object oriented code can\
    \ easily solve the same problem in other projects; we can simply slot it whenever\
    \ we need it. There is a growing number of object oriented code repositories,\
    \ such as PEAR[1] and PHP Classes[2], which can save you from hours of work spent\
    \ solving well charted problems, and leave you free to focus on the specifics\
    \ of your application.\n\nIn this chapter, you'll gain a practical grounding in\
    \ writing object oriented PHP—and there'll be plenty of opportunities to get your\
    \ hands dirty. There are many ways to teach OOP, and the topic provides endless\
    \ room for discussion. In my opinion, the best approach is to dive in head first,\
    \ seeing how procedural tasks can be accomplished with classes in PHP, and adding\
    \ the theory as we go. This is the approach we'll take in this chapter. Throughout\
    \ both volumes of The PHP Anthology: Object Oriented PHP Solutions, I'll be using\
    \ OOP, where appropriate, which should give you further examples to study. In\
    \ particular, Volume II, Chapter 7 should provide some insight into why OOP is\
    \ an effective way to structure your applications.\n\nIn practice, learning to\
    \ use the object model provided by PHP requires us to achieve two goals, which\
    \ usually have to be undertaken simultaneously:\n\n- You'll need to learn the\
    \ PHP syntax and object oriented terminology.\n- You must make the “mental leap”\
    \ from procedural to object oriented code.\n\nThe first step is easy. It's the\
    \ subject of the next solution, and further examples in later stages that look\
    \ for more advanced subjects.\n\nThe second step, the “mental leap,” is both easy\
    \ and challenging. Once you achieve it, you will no longer think about long lists\
    \ of tasks that a single script should accomplish; instead, you'll see programming\
    \ as the putting together of a set of tools to which your script will delegate\
    \ work.\n\nJumping ahead a little—to get a taste of things to come—here’s a simple\
    \ example that anyone’s worked with PHP for more than a week: connecting to MySQL\
    \ and fetching some data. A common procedural approach looks like this:\n\n```php\n\
    <?php\n// Procedural Example\n\n// Connect to MySQL\n$connection = mysql_connect('localhost',\
    \ 'harry', 'secret');\n\n// Select desired database\nmysql_select_db('sitepoint',\
    \ $connection);\n\n// Perform a query selecting five articles\n$sql = 'SELECT\
    \ * FROM articles LIMIT 0,5';\n$result = mysql_query($sql, $connection);\n\n//\
    \ Display the results\nwhile ($row = mysql_fetch_array($result)) {\n    // Display\
    \ results here\n}\n?>\n```\n\nClick here to order The PHP Anthology Volume I &\
    \ II and get 25% off!\n\nIn the above script, we've called PHP's MySQL functions,\
    \ which act on the variables we pass to them. This generally results in our getting\
    \ back a new variable with which we can perform further work.\n\nAn object oriented\
    \ approach to solving the same problem might look like this:\n\n```php\n<?php\n\
    // OOP Example\n\n// Include MySQL class\nrequire_once 'Database/MySQL.php';\n\
    \n// Instantiate MySQL class, connect to MySQL and select database\n$db = new\
    \ MySQL('localhost', 'harry', 'secret', 'sitepoint');\n\n// Perform a query selecting\
    \ five articles\n$sql = 'SELECT * FROM articles LIMIT 0,5';\n$result = $db->query($sql);\
    \ // Creates a MySQLResult\n\n// Display the results\nwhile ($row = $result->fetch())\
    \ {\n    echo $Display results\n}\n?>\n```\n\nThe detail of using MySQL with PHP's\
    \ MySQL functions has now been delegated to an object that's created from the\
    \ MySQL class (which we'll use frequently throughout this book, and is constructed\
    \ in Chapter 3). Although this example may not make entirely clear the advantages\
    \ of OOP, given that, in terms of the amount of code, it is very similar to the\
    \ first example, what it does is that some of the original script's complexity\
    \ is now being cared of by the MySQL class.\n\nFor example, we no longer need\
    \ to perform two steps to connect to the MySQL server, and then select a database;\
    \ rather, we can handle both steps in one when we create the MySQL object. Also,\
    \ should we later to have the script fetch the results from a different database,\
    \ such as PostgreSQL, we could use the relevant class programming interface (API)\
    \ as the MySQL class—and, to do so, we'd only need to change a single line of\
    \ the above example. We'll exactly do that in Volume II, Chapter 7.\n\nThe object\
    \ oriented approach really shows its worth in situations which objects interact\
    \ with each other. I'll leave further discussion of the solutions in this chapter,\
    \ as it's an important concept. As you become fluent in object oriented programming,\
    \ you'll find writing complex applications becomes as easy as putting together\
    \ blocks of Lego.\n\nI'll introduce the occasional Unified Modelling Language\
    \ (UML) class diagram in this discussion. UML is a standard for describing object\
    \ oriented programs with images. Don't worry if you haven't come across UML before;\
    \ the relationship between the diagrams and the code will speak for itself.\n\n\
    ## What are the basics of object oriented PHP?\n\nAssuming you have no knowledge\
    \ of OOP, the best place to start is with the basic PHP syntax for classes. You\
    \ can think of a class simply as a collection of functions and variables.\n\n\
    ## Read The Fine Manual\n\nThe PHP manual contains a wealth of information on\
    \ OOP:\nhttp://www.php.net/oop\n\nWe'll develop a simple example that could help\
    \ generate HTML, which will demonstrate the basics of classes and objects in PHP.\
    \ This isn't intended to be an example of great design; it's simply a primer in\
    \ PHP syntax. Let's begin with a procedural script that builds a Web page. Then\
    \ we'll gradually turn it into a PHP class:\n\n```php\n<?php\n// Generates the\
    \ top of the page\nfunction addHeader($page, $title)\n{\n  $page .= <<<EOD\n<html>\n\
    <head>\n<title>$title</title>\n</head>\n<body>\n<h1 align=\"center\">$title</h1>\n\
    EOD;\n  return $page;\n}\n\n// Generates the bottom of the page\nfunction addFooter($page,\
    \ $year, $copyright)\n{\n  $page .= <<EOD\n<div align=\"center\">$page $copyright</div>\n\
    </body>\n</html>\nEOD;\n  return $page;\n}\n\n// Initialize the page variable\n\
    $page = '';\n\n// Add the header to the page\n$page = addHeader($page, 'A Procedural\
    \ Script');\n\n// Add something to the body of the page\n$page = <<EOD\n<p align=\"\
    center\">This page was generated with a procedural script</p>\nEOD;\n\n// Add\
    \ the footer to the page\n$page = addFooter($page, date('Y'), 'Procedural Designs\
    \ Inc.');\n\n// Display the page\necho $page;\n?>\n```\n\n> Procedural programming\
    \ is the name given to non-object oriented programming. All the code we've seen\
    \ in this book so far has been procedural in nature.\n[1] http://pear.php.net/\n\
    [2] http://www.phpclasses.org/\n"
  mdcn: "\n\n## 2 面向对象的 PHP\n\n面向对象范式是一种编程方法，旨在鼓励开发可维护且结构良好的应用程序。由于，许多 PHP 开发者将**面向对象编程**\
    \ (OOP) 视为某种神秘的艺术，因为许多 PHP 开发者在解决问题时，往往只关注**面向过程**的方法，而不采用面向对象的方法。这是一种遗憾，因为采用面向对象的方法开发\
    \ PHP 应用可以获益匪浅，其中最重要的的一点可能就是代码重用。一段编写良好的面向对象代码可以轻松解决其他项目中的相同问题；我们只需要在需要时将其插入即可。面向对象的代码库数量日益增加，例如\
    \ PEAR[1] 和 PHP Classes[2]，它们可以节省你在解决这些成体系问题上花费的数小时工作，让你有精力专注于应用程序的特定细节。\n\n在本章中，你将获得编写面向对象\
    \ PHP 的实战基础——并且会有很多机会让你上手实践。教授 OOP 有很多方法，这个主题提供了无尽的讨论空间。在我看来，最好的方法是直接投入，看看如何使用\
    \ PHP 中的类来完成过程化的任务，并在此过程中加入理论。这就是我们在本章将采取的方法。在《PHP 选集：面向对象 PHP 解决方案》两卷书中，我将在适当的地方使用\
    \ OOP，这应该为你提供更多可学习的示例。特别是第二卷第 7 章，将让你深入理解为什么 OOP 是结构化应用程序的有效方法。\n\n在实践中，学习使用 PHP\
    \ 提供的对象模型我们需要实现两个目标，这两个目标通常需要同时进行：\n\n- 你需要学习 PHP 语法和面向对象的术语。\n- 你必须完成从面向过程代码到面向对象代码的“思维跨跃”。\n\
    \n第一步是很容易的。它是下一个解决方案的主题，并在后续阶段的更多示例中将涉及更高级的主题。\n\n第二步，即“思维跨跃”，既简单又具有挑战性。一旦你实现了它，你将不再考虑单个脚本应该完成的长长任务列表；相反，你将编程视为组合一组工具，你的脚本将把工作委托给这些工具。\n\
    \n稍微提前一点——为了体验一下未来的内容——这里有一个任何使用 PHP 超过一周的人都会熟悉的简单示例：连接 MySQL 并获取一些数据。一种常见的面向过程方法所示：\n\
    \n```php\n<?php\n// 过程示例\n\n// 连接到 MySQL\n$connection = mysql_connect('localhost',\
    \ 'harry', 'secret');\n\n// 选择所需的数据库\nmysql_select_db('sitepoint', $connection);\n\
    \n// 执行查询选择五篇文章\n$sql = 'SELECT * FROM articles LIMIT 0,5';\n$result = mysql_query($sql,\
    \ $connection);\n\n// 显示结果\nwhile ($row = mysql_fetch_array($result)) {\n    //\
    \ 在处显示结果\n}\n?>\n```\n\n点击此处订购《PHP 选集》第一、二卷并享受 75 折优惠！\n\n在上面的脚本中，我们调用了 PHP 的\
    \ MySQL 函数，这些函数作用于我们传递给它们的变量。这通常会导致我们得到一个新的变量，我们可以通过它进行进一步的工作。\n\n解决相同问题的面向对象方法可能如下：\n\
    \n```php\n<?php\n// OOP示例\n\n// 引入 MySQL 类\nrequire_once 'Database/MySQL.php';\n\
    \n// 实例化 MySQL 类，连接到 MySQL 并选择数据库\n$db = new MySQL('localhost', 'harry', 'secret',\
    \ 'sitepoint');\n\n// 执行查询选择五篇文章\n$sql = 'SELECT * FROM articles LIMIT 0,5';\n\
    $result = $db->query($sql); // 创建一个 MySQLResult\n\n// 显示结果\nwhile ($row = $result->fetch())\
    \ {\n    echo $Display results\n}\n?>\n```\n\n使用 PHP MySQL 函数处理 MySQL 的细节现在已委托给了一个从\
    \ MySQL 类创建的对象（我们将在本书中频繁使用该类，它将在第 3 章中构建）。尽管这个示例可能无法完全阐明 OOP 的优势（考虑到在代码量上它与第一个示例非常相似），但它的作用是原始脚本中的某些复杂性现在由\
    \ MySQL 类来处理了。\n\n例如，我们不再需要执行两个步骤来连接到 MySQL 服务器然后选择数据库；相反，我们可以在创建 MySQL 对象时一次性处理这两个步骤。此外，如果稍后我们希望让脚本从不同的数据库（例如\
    \ PostgreSQL）获取结果，我们可以使用像 MySQL 类那样相关的类编程接口 (API)——为了做到这一点，我们只需要更改上述示例的一行代码。我们将在第二卷第\
    \ 7 章中恰好这样做。\n\n面向对象的方法在对象相互交互的情况下真正显示了它的价值。我将在本章中留出对这些解决方案的进一步讨论，因为这是一个重要的概念。当你精通面向对象编程时，你会发现编写复杂的应用程序变得像组装高积木一样简单。\n\
    \n我会在讨论中偶尔引入统一建模语言 (UML) 类图。UML 是一种用图像描述面向对象程序的标准。如果你以前没有遇到过 UML，不要担心；图表与代码之间的关系将自足其明。\n\
    \n## 面向对象 PHP 的基础是什么？\n\n假设你对 OOP 一无所知，最好的开始点是类的基本 PHP 语法。你可以简单地将类类函数和变量的集合。\n\
    \n## 阅读详细手册\n\nPHP 手册包含了关于 OOP 的丰富信息：\nhttp://www.php.net/oop\n\n我们将开发一个可以帮助生成\
    \ HTML 的简单示例，并将演示 PHP 类和对象的知识。这并不是为了优秀的设计；它只是 PHP 语法的入门。让我们从一个构建 Web 页面的过程脚本开始，然后逐渐将其转换为\
    \ PHP 类：\n\n```php\n<?php\n// 生成页面顶部\nfunction addHeader($page, $title)\n{\n \
    \ $page .= <<<EOD\n<html>\n<head>\n<title>$title</title>\n</head>\n<body>\n<h1\
    \ align=\"center\">$title</h1>\nEOD;\n  return $page;\n}\n\n// 生成页面底部\nfunction\
    \ addFooter($page, $year, $copyright)\n{\n  $page .= <<EOD\n<div align=\"center\"\
    >$page $copyright</div>\n</body>\n</html>\nEOD;\n  return $page;\n}\n\n// 初始化页面变量\n\
    $page = '';\n\n// 将页页头添加到页面\n$page = addHeader($page, '一个过程脚本');\n\n// 在页面主体中添加内容\n\
    $page = <<EOD\n<p align=\"center\">此页面是通过过程脚本生成的</p>\nEOD;\n\n// 将页脚添加到页面\n$page\
    \ = addFooter($page, date('Y'), 'Procedural Designs Inc.');\n\n// 显示页面\necho $page;\n\
    ?>\n```\n\n> 过程化编程是非面向对象编程的名称。到目前为止，我们在书中看到的所有代码都是过程性的。\n\n"
