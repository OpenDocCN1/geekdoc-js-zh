    # Chapter 2: Object Oriented PHP


    # Good and Bad Practices


    When working with classes and objects, it''s a good idea to use references whenever
    an object is involved. Occasionally, you may have to do the same with an array,
    such as when you want to sort the array in a different section of code. But, for
    the most part, normal variables will not need this treatment, simply because,
    when your code reaches the level of complexity you''d need to do so, you will
    (I hope!) storing variables inside objects and passing the complete object by
    reference.


    Let''s look at other situations in which you might need to use references...


    ```

    // Make sure $myObject is a reference to

    // the variable created by the new keyword

    $myObject = &newMyClass();

    ```


    This looks odd at first, remember, a variable created by the new keyword is passed
    by reference—even if you can''t see it. The reference operator saves PHP having
    to create a copy of the newly-created object to store in $myObject.


    ```

    class Bar {

    }

    class Foo {

    // Return by reference

    function &getBar()

    {

    return new Bar();

    }

    }

    // Instantiate Foo

