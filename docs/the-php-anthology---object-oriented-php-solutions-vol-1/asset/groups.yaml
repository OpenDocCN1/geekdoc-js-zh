- md: "\n## Chapter 2: Object Oriented PHP\n\nIn PHP, all variable names are linked\
    \ with values in memory automatically.\nUsing a reference allows us to link two\
    \ variable names to the same value in memory, if the variable names were the same.\
    \ You can then substitute one for the other.\n\n## What Are References?\n\nTo\
    \ understand references, we have to begin by understanding how PHP handles variables\
    \ under normal circumstances (i.e. without references).\n\nBy default, when a\
    \ variable is passed to anything else, PHP creates a copy of that. When I say\
    \ \"passed,\" I mean any of the following:\n\n- Passing a variable to another\
    \ variable:\n\n```php\n<?php\n$color = 'blue';\n$settings['color'] = $color;\n\
    ?>\n```\n\n$settings['color'] now contains a copy of $color.\n\n- Passing a variable\
    \ as an argument to a function:\n\n```php\n<?php\nfunction isPrimaryColor($color)\n\
    {\n    // $color is a copy\n    switch ($color) {\n        case 'red':\n     \
    \   case 'blue':\n        case 'green':\n            return true;\n          \
    \  break;\n        default:\n            return false;\n    }\n}\n\n$color = 'blue';\n\
    if (isPrimaryColor($color)) {\n    echo $color . ' is a primary color';\n} else\
    \ {\n    echo $color . ' is not a primary color';\n}\n?>\n```\n\nWhen $color is\
    \ passed to the function isPrimaryColor, PHP works with a copy of the original\
    \ $color variable inside the function.\n\nThe same applies when passing variables\
    \ to class methods.\n\n```php\n<?php\nclass ColorFilter {\n  var $color;\n  function\
    \ ColorFilter($color) {\n    // $color is a copy\n    $this->color = $color;\n\
    \    // $this->color is a copy of a copy\n  }\n  function isPrimaryColor() {\n\
    \    switch ($this->color) {\n      case 'red':\n      case 'blue':\n      case\
    \ 'green':\n        return true;\n        break;\n      default:\n        return\
    \ false;\n    }\n  }\n}\n```\n\n```php\n<?php\n$color = 'blue';\n$filter = new\
    \ ColorFilter($color);\nif ($filter->isPrimaryColor()) {\n  echo ($color.' is\
    \ a primary color');\n} else {\n  echo ($color.' is not a primary color');\n}\n\
    ?>\n```\n\nThe original $color outside the class is passed to ColorFilter's constructor.\
    \ The $color variable inside the constructor is a copy of the version that was\
    \ passed to it. It is assigned to $this->color, which makes that version of a\
    \ copy.\n\n## Chapter 2: Object Oriented PHP\n\nAll of these means of passing\
    \ a variable create a copy of that variable's value; this is called passing by\
    \ value.\n\n## Using a Reference\n\nTo pass using a reference, you need to use\
    \ the reference operator & (ampersand). For example:\n\n```php\n<?php\n$color\
    \ = 'blue';\n$settings['color'] = &$color;\n?>\n```\n\n$settings['color'] now\
    \ contains a reference to the original $color variable.\n\nCompare the following\
    \ examples, the first using PHP's default copying behavior:\n\n```php\n<?php\n\
    $color = 'blue';\n$settings['color'] = $color; // Makes a copy\n$color = 'red';\
    \ // Color changes\necho $settings['color']; // Displays \"blue\"\n?>\n```\n\n\
    The second involves passing by reference:\n\n```php\n<?php\n$color = 'blue';\n\
    $settings['color'] = &$color; // Makes a reference\n$color = 'red'; // Color changes\n\
    echo $settings['color']; // Displays \"red\"\n?>\n```\n\nPassing by reference\
    \ allows us to keep the new variable \"linked\" to the original source variable.\
    \ To change the new variable or the old variable will be reflected in both of\
    \ them.\n\nSo far, you're probably wondering. \"What's the big deal here? What\
    \ difference does it make whether PHP copies or makes a reference to a variable,\
    \ as long as we get what we expected? For variables passed around a procedural\
    \ program, however rarely had to worry about references. However, when it comes\
    \ to objects interacting with one another, if you don't pass an object by reference,\
