    ```


    This statement asks the question "Did I successfully connect to the MySQL server?"
    If not, it use die to terminate the script.


    Next, we''ll select the database we want with mysql_select_db, using the same
    statement technique:


    ```

    if (!mysql_select_db($dbName, $dbConn)) {

    ```


    Note that we provided the variable the link identifier as the second argument
    to mysql_select_db. We would usually not do this (the argument is optional), but
    when a complex script jiggles multiple database connections, this method can help
    ensure PHP knows which one you are referring to.


    Finally, we''ve used mysql_close to disconnect from the server again:


    ```

    mysql_close($dbConn);

    ```


    This occurs at the bottom of the script, once we''ve run some PHP code that used
    the connection. Closing the connection is generally optional—PHP automatically
    closes any connections after a script finishes.


    > Connections with mysql_pconnect are different. This function establishes a persistent
    connection to the database to be reused by multiple PHP scripts. Using a persistent
    connection makes your scripts faster, as PHP no longer has to reconnect each time,
    but speed comes at a price: if your website runs on a shared server, persistent
    connections can monopolize that, rendering other sites unable to connect at times.
    In such environments, it''s typical to avoid mysql_pconnect, or configure MySQL
    so that connections are terminated the moment they stop doing anything, with a
    short connection timeout value.


