- md: '

    ## Appendix B: Hosting Provider Checklist


    PHP, and more generally, the LAMP combination of Linux, Apache, MySQL and PHP/Perl/Python,
    is widely available via literally thousands of Web hosts at very affordable prices.
    You can easily get quality Web hosting that will suit 90% of your needs for under
    $10 a month site. That said, all PHP installations are not created equal, and
    depend largely on the configuration settings defined in php.ini, as well as the
    extensions the host has installed for you. There are also a number of general
    issues relating to the amount of control you''re given over your environment,
    and these are important if you don''t want big trouble later on.


    This is a summary of the key issues you should investigate before paying for a
    hosting service. Contact potential providers and have them respond on each of
    these points. Follow up by asking for opinions from other people who know/have
    used the service in question. There are many online forums where you''ll find
    people who are able to offer advice. Be aware, though, that the ratio of “knowledgeable”
    to “ignorant” is stacked highly in favor of ignorance; dig up on technical detail
    so you''re able to verify that the answers you were given were actually well-informed.


    Some of the points I''ve provided here may seem a little extreme, but once you''ve
    been around the block few times, you''ll probably want to get value for your money,
    rather than spending your Saturday mornings fixing the problems your host made
    for you on Friday night.


    ## General Issues


    - Require Linux and Apache (1.3) From the point of view of performance and reliability,
    this is the best. Avoid using Apache 2.x (it''s not completely stable with PHP).
    Ask for details of the Linux distribution. Although Red Hat and Suse are popular,
    you may find hosts using Debian (or, better yet, Rocky Linux) know more about
    what they''re doing.


    - Does the host provide you with SSH access to the server?


    SSH gives you a secure connection to the server to perform tasks from the Linux
    command line or transfer files with SCP (secure copy). Avoid any host who allows
    you to use telnet (a fundamentally insecure way to connect to a server over the
    Internet). For Windows users, Putty|WinSCP[2] provides a secure file transfer
    mechanism using an SSH connection. Oh, and don''t transfer files with ftp—it''s
    as secure as telnet.


    - Is the host reseller or do they maintain the server themselves?


    Resellers can provide significant value if you need help at a basic technical
    level (if, for example, you call yourself a newbie), but they generally have the
    same level of control over the server as you. Going “straight to the source” means
    you won''t have to deal with delays when there are system problems, as you''ll
    be dealing with those who maintain the server. The down side is that they tend
    to be “newbie tolerant” so you may get answers—but not ones you can understand.


    - To what degree does the host “overload” the server?


    Many Web hosting companies create more accounts on a server than the maximum for
    which the system is specified. The best metric is the uptime command (which you
    require access); this will tell you the server load averages over 1, 5 and 15
    minutes. Ideally, the server should never have load averages above 1. Obviously,
    the problem isn''t as simple as this, but once you see your server hit averages
    in excess of 5, you''ll begin to experience significant delays in your PHP-based
    applications.


    - What is the hosting provider’s policy on running scripts and programs from the
    command line?


    MySQLDump is a very handy tool for backing up your database, but it’s good if
    you can''t run it. Some hosts automatically kill command line applications that
    execute for longer than a given time.


    - Does the host provide access to cron, the Unix utility that allows you to schedule
    batch jobs?


    If so, make sure the host allows command line scripts to be executed. Some hosts
    have implementing cron so that it executes scripts via a Web URL. This is no use
    if the script in question uses the MySQLDump application to back up your database—a
    PHP script executed via Apache will typically run as a user, which will not have
    the correct permissions required for the job.


    [1] http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html

    [2] winscp.sourceforge.net/


    ## PHP-Related Issues


    - Can you see the output of phpinfo on the server you will actually be assigned
    to?


    Some hosts may claim this is a security risk, but expert hosts know that security
    by obscurity is no substitute for real security. The information provided by phpinfo
    is not a security risk to hosting providers that know what they’re doing, have
    Linux, Apache, and firewalls correctly set up. What phpinfo tells you is the best
    way to confirm the facts.


    - Is PHP installed as an Apache module (not the CGI variant)?


    This provides much better performance.


    - Is the Apache setting AllowOverride set to Options or All?


    This will let you modify php.ini settings with .htaccess files.


    - Is PHP Safe Mode disabled?


    The safe_mode option in php.ini is, in a way, to make PHP secure, and prevent
    users from performing certain tasks or using functions that are security-sensitive.
    Safe Mode is nothing but a large headache if you’re doing any serious work in
    PHP.


    - Check the upgrade policy of your host.


    Ask the host how much warning you will get before upgrades are performed. Check
    that they provide you with a copy of the php.ini file they use.


    - Ask the host for a list of installed extensions.


    - Will PHP be available for use from the command line?


    If not, you might alternately require access to Perl or Python.


    ## Appendix C: Security Checklist


    Given that online PHP applications are exposed to anyone and everyone, security
    should be one of, if not the top concern as you develop. To some extent, the ease
    with which PHP applications can be developed is also one of its greatest weaknesses;
    that, for beginners who aren''t aware of possible dangers, it''s very easy to
    deploy an application for which the line of security resembles swiss cheese.


    Make sure you''re informed, and in any doubt, ask. The Open Web Application Security
    Project (OWASP)[1] is a community focused on raising awareness of Web security,
    and is an excellent source of information. Never trust anything you get from a
    Web browser. The browser is completely outside of your control, and it''s easy
    to fake values like the HTTP referrer. It''s also easy to hide a hidden field
    in a form.


    More importantly, when dealing with forms, for example, validate the data carefully.
    Use a “deny all, permit a little” policy. For example, if a registration form
    has a field for the user name, allow only alphabetical characters and perhaps
    the numbers 0-9, rather than simply rejecting particular characters. Use regular
    expressions to limit data to exactly what you require. Packages like PEAR::QuickForm,
    as you saw in Chapter 9, provide built-in mechanisms for validating forms and
    do a lot to help cover weaknesses you might otherwise neglect.


    Also, where things like include files are concerned, watch out for logic like
    this:


    ```

    include($_GET[''page'']);

    ```


    Make sure you check the value of $_GET[''page''] against a list of files your
    code is designed to include.


    [1] http://www.owasp.org/

    '
  mdcn: '


    ## 附录 B：主机选择清单


    PHP，更广泛地说，Linux、Apache、MySQL 和 PHP/Perl/Python 的 LAMP 组合通过数以千计的 Web 主机提供，价格非常低廉。你可以轻松获得每月不到
    10 美元、就能满足你 90% 需求的优质 Web 托管。尽管如此，并非所有的 PHP 安装都是同等的，它们在很大程度上取决于 `php.ini` 中定义的配置设置，以及主机商为你安装的扩展。此外，还有许多与你对环境的控制程度有关的通用问题，如果你不想以后遇到大麻烦，这些问题是非常关重要的。


    以下是在支付托管服务费用之前应该调查的关键问题总结。联系潜在的提供商，让他们针对这些问题的每一点给出回复。随后，向其他了解或使用过该服务的人征求意见。在许多在线论坛中，你可以找到能够提供建议的人。但请注意，“知情者”与“无知者”的比例是严重向无知倾斜的；要挖掘技术细节，以便能够验证所给答案是否确实是有据可的。


    我在这里提供的一些观点可能看起来有些极端，但一旦你经历过几次，你可能希望花钱买到价值，而不是在周六早上修理主机商在周五晚上为你制造的问题。


    ## 通用问题


    - **要求 Linux 和 Apache (1.3)**：从性能和可靠性的角度来看，这是最好的。避免使用 Apache 2.x（它与 PHP 的配合并不完全稳定）。询问
    Linux 发行版的细节。虽然 Red Hat 和 Suse 很流行，但你可能会发现使用 Debian（或者更好的，Rocky Linux）的主机对自己的工作更了如。


    - **主机是否为你提供服务器的 SSH 访问权限？**


    SSH 为你提供了服务器的安全连接，可以从 Linux 命令行执行任务或使用 SCP（安全复制）传输文件。避免任何允许你使用 telnet 的主机（这是通过互联网连接服务器的一种根本上不安全的方法）。对于
    Windows 用户，Putty|WinSCP[2] 提供了使用 SSH 连接的安全文件传输机制。噢，千万不要用 ftp 传输文件——它的安全性和 telnet
    一样。


    - **主机是转销商还是他们自己维护服务器？**


    如果你需要基础技术层面的帮助（例如，如果你自认为是新手），转销商可以提供巨大的价值，但他们对服务器的控制权限通常和你一样。“直接找源头”意味着当系统出现问题时，你不需要面对延迟，因为你面对的是维护服务器的人。缺点是，他们往往倾向于“宽容新手”，所以你可能会得到答案——但不是你能够听懂的答案。


    - **主机在多大程度上对服务器进行了“过载”？**


    许多 Web 托管公司在服务器上创建的账户超过了系统指定的最大数量。最好的指标是 `uptime` 命令（你需要访问权限）；它将告诉你服务器在 1、5 和
    15 分钟内的负载平均值。理想情况下，服务器的负载平均值永远不应高于 1。显然，问题没有那么简单，但一旦你看到服务器的平均值超过 5，你就会开始发现你的基于
    PHP 的应用程序出现明显的延迟。


    - **主机商对于从命令行运行脚本和程序的策略是什么？**


    MySQLDump 是一个备份数据库非常实用的工具，但如果你无法运行它，那也是很妙的。有些主机会自动杀死执行时间超过给定时间的命令行应用程序。


    - **主机是否提供对 cron 的访问（允许你调度批处理作业的 Unix 工具）？**


    如果是，请确保主机允许执行命令行脚本。有些主机实现的 cron 使得它通过 Web URL 执行脚本。如果相关脚本使用 MySQLDump 应用程序备份数据库，这样做就毫无用处——因为通过
    Apache 执行的 PHP 脚本通常以用户身份运行，该用户将不具备完成任务所需的正确权限。


    [1] http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html

    [2] winscp.sourceforge.net/


    ## PHP 相关问题


    - **你是否可以在实际分配给你的服务器上看到 `phpinfo` 的输出？**


    有些主机可能声称这是一个安全风险，但专家级主机知道，通过隐蔽来实现安全并不能替代真正的安全。对于那些懂业务并正确设置了 Linux、Apache 和防火墙的主机商来说，`phpinfo`
    提供的信息并不是安全风险。`phpinfo` 告诉你的的是确认事实的最佳方法。


    - **PHP 是否作为 Apache 模块安装（而不是 CGI 版本）？**


    这提供了许多更好的性能。


    - **Apache 设置 `AllowOverride` 是否被设置为 Options 或 All？**


    这将允许你通过 `.htaccess` 文件修改 `php.ini` 设置。


    - **PHP 是否禁用了安全模式（Safe Mode）？**


    `php.ini` 中的 `safe_mode` 选项在某种程度上是为了让 PHP 安全，防止用户执行某些任务或使用对安全敏感的函数。如果你在 PHP 中进行任何严肃的工作，安全模式将是一个巨大的麻烦。


    - **检查你主机的升级策略。**


    询问主机在执行升级前你会得到多少警告。检查他们是否为你提供他们所使用的 `php.ini` 文件副本。


    - **向主机索要已扩展列表。**


    - **PHP 是否可以在命令行中使用？**


    如果不能，你可能需要要求访问 Perl 或 Python。


    ## 附录 C：安全清单


    鉴于在线 PHP 应用对所有人开放，在开发过程中，安全应该是关注的问题之一，甚至是首要考虑。在某种程度上，PHP 应用开发的简易性也是其最大的弱点之一；对于那些没有意识到可能危险的新手来说，部署一个安全性像瑞士奶酪一样的应用程序是非常容易的。


    确保你了解相关信息，如有任何疑问，请询问。开放 Web 应用安全项目 (OWASP)[1] 是一个专注于提高 Web 安全意识的社区，是信息的绝佳来源。永远不要从
    Web 浏览器中获取任何信任。浏览器完全在你的控制之外，伪造如 HTTP referrer 等值非常容易。在表单中隐藏一个字段也很容易。


    更重要的是，在处理表单时（例如），务必仔细验证数据。使用“拒绝所有，允许少量”的策略。例如，如果注册表单有一个用户名字段，只允许字母和可能可能的数字 0-9，而不是简单地拒绝特定字符。使用正则表达式将数据限制为你精确所需的内容。像
    PEAR::QuickForm 这样的包（如你在第 9 章中看到的）提供了验证表单的内置机制，并在很大程度上帮助涵盖你可能忽略的弱点。


    此外，在涉及包含文件时，要警惕这类逻辑：


    ```

    include($_GET[''page'']);

    ```


    确保你检查 $_GET[''page''] 的值是否在你代码设计包含的文件列表中。


    [1] http://www.owasp.org/


    '
