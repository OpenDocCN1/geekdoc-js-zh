  mdcn: "\n## 基础连接\n\n以下是最简单形式的 MySQL 数据库连接：\n\n```php\n<?php\n$host = 'localhost';\
    \ // MySQL 服务器主机名\n$dbUser = 'harryry'; // MySQL 用户名\n$dbPass = 'secret'; // 用户密码\n\
    $dbName = 'sitepoint'; // 数据库名称\n\n// 连接 MySQL 服务器\nif ($dbConn = mysql_connect($host,\
    \ $dbUser, $dbPass)) {\n    die('无法连接到服务器');\n}\n\n// 选择数据库\nif (!mysql_select_db($dbName,\
    \ $dbConn)) {\n    die('无法选择数据库');\n}\n// 连接成功！\n// ... 在此处使用 MySQL 的某些代码\n\n\
    // 完成后关闭连接\nmysql_close($dbConn);\n?>\n```\n\n需要记住，MySQL 是一个独立的服务器程序，就像 Apache\
    \ 一样。这两个服务器可能运行在同一台物理计算机上（因此在上面的示例中我们 `$host = 'localhost';`），也可以将 MySQL 连接到远程计算机，例如\
    \ `$host = 'anothercomputer.com';`。更有趣的是，MySQL 还有自己的端口号，默认是 3306。PHP 假设 3306 是你需要使用的端口，如果使用不同的端口，只需设置\
    \ `$host = 'anothercomputer.com:4321';`。\n\n另一个概念上的障碍在于理解：单个 MySQL 服务器可以提供许多数据库的访问，这就是为什么在连接服务器后，你需要在\
    \ PHP 中选择你的数据库。\n\n回到上面的代码，有几点需要注意。首先，我将连接 MySQL 所需的值放在了变量中。这让我们的工作变得更简单；通常会将此类信息存储在每个\
    \ PHP 脚本都会包含的单独文件中，这样就可以一次性更改多个脚本。稍后我们将查看可以采用的让生活更轻松的进一步技巧。\n\n## 第 3 章：PHP 与\
    \ MySQL\n\n`mysql_connect` 函数负责连接 MySQL 服务器的工作。它返回的值要么是一个链接标识（PHP 提供的用于标识连接的值），要么是\
    \ `FALSE`（连接失败）。\n\n```php\nif (!$dbConn = mysql_connect($host, $dbUser, $dbPass))\
    \ {\n    die('无法连接到服务器');\n}\n```\n\n这条语句提问：“我是否成功连接到了 MySQL 服务器？”如果没有成功，它将使用\
    \ `die` 终止脚本。\n\n接下来，我们将使用相同的语句技术通过 `mysql_select_db` 选择我们需要的数据库：\n\n```php\n\
    if (!mysql_select_db($dbName, $dbConn)) {\n```\n\n注意，我们将链接标识符变量作为第二个参数传递给 `mysql_select_db`。虽然我们通常不会这样做（该参数是可选的），但当一个复杂脚本处理多个数据库连接时，这种方法可以帮助\
    \ PHP 知道你指的是哪一个。\n\n最后，我们使用 `mysql_close` 断开与服务器的连接：\n\n```php\nmysql_close($dbConn);\n\
    ```\n\n这发生在脚本底部，在我们运行了一些使用该连接的 PHP 代码之后。关闭连接通常是可选的——PHP 在脚本结束后会自动关闭任何连接。\n\n>\
    \ 使用 `mysql_pconnect` 的连接是不同的。该函数建立到数据库的持久连接，供多个 PHP 脚本重用。使用持久连接会让你的脚本运行更快，因为\
    \ PHP 不再每次都要重新连接，但速度是有代价的：如果你的网站运行在共享服务器上，持久连接可能会垄断连接，导致其他网站有时无法连接。在这种环境中，通常会避免使用\
    \ `mysql_pconnect`，或者配置 MySQL 让连接在停止操作时立即终止，并设置较短的连接超时值。\n\n点击此处订购《The PHP Anthology\
    \ Volume I & II》并享受 75 折优惠！\n\n## 可重用代码\n\n你刚刚看到了连接 MySQL 最简单的方法。然而，将上述代码“封装”在函数或类中通常很有用，这样它可以被重用。\n\
    \n作为一个函数，我们可以拥有：\n\n```php\n<?php\nfunction connectToDb($host, $dbUser, $dbPass,\
    \ $dbName) {\n  // 连接 MySQL 服务器\n  if (!@mysql_connect($host, $dbUser, $dbPass))\
    \ {\n    return false;\n  }\n\n  // 选择数据库\n  if (!@mysql_select_db($dbName)) {\n\
    \    return false;\n  }\n\n  return $dbConn;\n}\n\n$host = 'localhost'; // MySQL\
    \ 服务器主机名\n$dbUser = 'harry'; // MySQL 用户名\n$dbPass = 'secret'; // 用户密码\n$dbName\
    \ = 'sitepoint'; // 数据库名称\n\n$dbConn = &connectToDb($host, $dbUser, $dbPass, $dbName);\n\
    ?>\n```\n\n这把连接 MySQL 和选择数据库的过程简化为了单行（如果你算上 `include` 语句，它指向包含 `connectToDb` 函数的单独文件）：\n\
