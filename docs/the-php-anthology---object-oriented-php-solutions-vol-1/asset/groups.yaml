    \n查找 `UPDATE` 或 `DELETE` 语句影响的行数也是可能的。`mysql_affected_rows` 函数返回受最后一个查询影响的行数。你可以这样使用：\n\
    \n```php\n// 更新某些行\n$sql = \"UPDATE articles SET title='New Title' WHERE author='HarryF'\"\
    ;\n$queryResource = mysql_query($sql, $dbConn);\n$affected = mysql_affected_rows($queryResource);\n\
    echo $affected . \" affected\";\n```\n\n## 插入 ID\n\n当你处理 `AUTO_INCREMENT` 列时，通常需要获取新插入行的\
    \ ID。`mysql_insertid` 函数提供了这些信息。你可以这样使用：\n\n```php\n// 插入新行\n$sql = \"INSERT INTO\
    \ articles (title, body, author) VALUES ('How to use mysql_insertid()', 'This\
    \ is an example', 'HarryF')\";\n$queryResource = mysql_query($sql, $dbConn);\n\
    $insertID = mysql_insertid($queryResource);\n\necho 'The row has ID: ' . $insertID;\n\
    ```\n\n## 类插入 ID\n\n要在 `MySQLResult` 类中使用此功能，请添加以下方法：\n\n```php\n/**\n * 返回最后插入行的\
    \ ID\n * @return int\n * @access public\n */\nfunction insertID() {\n    return\
    \ mysql_insertid($this->dbConn);\n}\n```\n\n正如你可能猜想到的，这个方法非常直接：\n\n```php\n//\
    \  MySQL 类\nrequire_once 'Database/MySQL.php';\n\n$host = 'localhost'; // MySQL\
    \ 服务器主机\n$dbUser = 'harry'; // MySQL 用户名\n$dbPass = 'secret'; // 用户密码\n$dbName\
    \ = 'sitepoint'; // 数据库名\n\n$db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\
    \n// 插入新行\n$sql=\"INSERT INTO articles (title, body, author) VALUES ('How to use\
    \ mysql_insertid()', 'This is an example', 'HarryF')\";\n\n$result = $db->query($sql);\n\
    \necho 'The row as ID: ' . $result->insertID();\n```\n\n## 如何搜索我的表？\n\n有些人就是非常急躁；与其浏览你提供的网站导航系统，他们现在就想要信息！因此，像你我这样的\
    \ PHP 开发者需要实现搜索功能，为访问者提供寻找所需信息的捷径。在以 HTML 文件形式存储所有内容的时代，这可能是个大问题，但现在你使用数据库进行搜索，搜索变得简单多了。\n\
    \n## 你所 LIKE\n\n最基础的搜索形式是针对单列并使用 `LIKE` 操作符：\n\n```sql\nSELECT * FROM articles\
    \ WHERE title LIKE 'How %'\n```\n\n`%` 是一个通配符。上面的语句将选取所有标题以“How”开头的文章。MySQL 还支持\
    \ POSIX 正则表达式\n\n"
