    | 设置 | 备注 |

    | --- | --- |

    | session.save_path (default: /tmp) | 如果在 Windows 系统上文件存储会话，你需要修改此设置以便 PHP 可以写入会话文件的可用目录。
    |

    | session.use_cookies (default: 1) | 使用 cookie 在客户端存储会话 ID，而不是将会话 ID 放在 URL 中（这带来的风险更大）。
    |

    | extension_dir (default: ''./'') | 编译好的 PHP 扩展所在的路径。在 Windows 系统上，它可能像这样：`extension_dir
    = C:\php-4.3.2\extensions\` |

    | extension | 仅限 Windows 系统，用于标识所有应该加载的扩展。指定的扩展应位于 `extension_dir` 路径（上文）。例如：`extension
    = php_xslt.dll` |


