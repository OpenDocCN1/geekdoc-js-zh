    http://www.php.net/register_globals。 |

    | magic_quotes_gpc (default: off) | 自动用反斜杠转义 HTTP 请求变量中的引号，有助于防止 SQL 注入攻击。如果你知道自己在做什么，通常最好关闭此功能，并在插入数据库时自行处理这些转义工作，因为该功能可能会给你带来很多问题，而且它还会引入性能开销。请参阅第
    1 章获取有关如何让你的脚本兼容此功能的信息。 |

    | call_time_pass_reference (default: off) | 允许在调用时使用变量引用（例如 `htmlentities($string)`）。为了保持代码整洁易于理解并确保移植性，请保持此功能关闭状态。
    |

    | short_open_tag (default: on) | 允许仅用 `<?` 而不是更长的 `<?php` 来启动 PHP 块。还允许使用 `<=?`
    写表达式，这与 `<?php echo` 相同。虽然方便，但这些快捷方式不符合 XML 标准，并且当 PHP 处理器遇到如 `<?xml version="1.0"?`
    这样的 XML 处理指令时可能会混乱。许多人都关闭了 short_open_tag，因此为了最大的移植性，请在开发期间避免使用快捷方式并关闭此功能。 |

    | asp_tags (default: off) | 允许使用 ASP 样式的标签 `< ... %>` 作为 PHP 和开放标签 `<?php ...
    ?>` 的替代方案。很少有人使用它，因此为了最大的移植性，最好避免使用它们，并在开发期间关闭此功能。 |


