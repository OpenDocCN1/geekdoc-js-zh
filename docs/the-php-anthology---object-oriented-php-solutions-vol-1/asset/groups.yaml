- md: "\nThe manual is also available in twenty-four different languages [4] but as\
    \ you're reading this book I'll assume you're happy with the English version of\
    \ the manual. It's broken down into five main sections plus appendices. It's worth\
    \ knowing what kind of information can be found, and where—at least within the\
    \ first four sections, which are the most relevant to the typical PHP developer.\n\
    \n## Section I: Getting Started\n\nhttp://www.php.net/getting-started\n\nThis\
    \ section provides a short introduction to PHP with some basic examples. It then\
    \ explains how to install PHP (describing all sorts of operating system-Web server\
    \ combinations), and how to configure it in terms of modifying your php.ini file.\n\
    \nNot to be overlooked is the section on security, which covers the area in PHP\
    \ PHP developers often make mistakes that leave their applications open to abuse.\
    \ Once again, the \"price\" of PHP's ease of use is that it won't always protect\
    \ you from your worst mistakes, so it's worth getting started on security as early\
    \ as possible in your PHP career. You'll find a summary of key security issues\
    \ in Appendix C, as well as in discussions throughout this book, appropriate.\n\
    \n## Section II: Language Reference\n\nhttp://www.php.net/langref\n\nThis section\
    \ covers the fundamentals of PHP as a programming language. Some of these are\
    \ essential to help you achieve anything with PHP, while others become useful\
    \ as you look for ways to improve your technique. Reading the whole lot in one\
    \ sitting may be well like reading a dictionary. Fortunately, it's possible to\
    \ absorb much of the information contained in the language reference reading the\
    \ wealth of tutorials available online, and examining the code that's used in\
    \ source PHP applications. Certainly, as you will read, in this book I hope you\
    \ pick up one or two about getting the most out of PHP. However, it is worth familiarizing\
    \ yourself with the subjects contained in this section of the manual, and keeping\
    \ them in the back of your mind for future reference.\n\n[4] http://www.php.net/docs.php\n\
    \n## Chapter 1: PHP Basics\n\n## Section III: Features\n\nhttp://www.php.net/features\n\
    \nCovered here are the core elements of PHP that are generally focused on solving\
    \ specific Web-related problems. Much of the Features section reads like an “executive\
    \ summary” and, from a developer's point of view, the information contained here\
    \ may be better understood when you see it in action—for instance, in the examples\
    \ we’ll see throughout this book.\n\n## Section IV: Function Reference\n\nhttp://www.php.net/manual/en/funref.php\n\
    \nThis section makes up the real body of the manual, covering all aspects of the\
    \ functionality available within PHP. This is where you’ll spend most of your\
    \ time as you progress with PHP, so you’ll be glad to hear the PHP group has made\
    \ a concerted effort to make this section easy to get around. It’s even fun, in\
    \ an idle moment, just to read the manual and be amazed by all the things you\
    \ can do with PHP. Yes, I just describe reading a manual as “fun”.\n\nThe function\
    \ reference is broken down into subsections that cover various categories of functions,\
    \ each category corresponding to a PHP extension.\n\n### PHP Extensions\n\nThe\
    \ notion of an extension can be a little confusing to start with, as many are\
    \ distributed with the standard PHP installation. The String functions, which\
    \ we’d be pretty hard to live without, are a case in point. In general, the PHP\
    \ group distributes, as part of the default PHP installation, all the extensions\
    \ that regard as being essential to developers. Extensions regarded as “non-essential”\
    \ functionality (i.e. they will be required by some, but not all developers) must\
    \ be added separately. The important information appears under the heading “Installation”\
    \ on the main page for each extension. Core extensions are described with the\
    \ sentence “There is no installation needed to use these functions; they are part\
    \ of the PHP core.” Nonstandard extensions are examined in Appendix B.\n\nAccess\
    \ to information within the Function Reference is available through the search\
    \ field (top right) and searching within the “Function List”. Note that searching\
    \ within the function list examines only the Function Reference section.\n\nClick\
    \ here to order The PHP Anthology Volume I & II and get 25% off of the manual.\
    \ To search the entire manual you need to search within \"Online Documentation.\"\
    \n\nAnother handy way to get around is to \"short cut\" to functions by passing\
    \ the name of the topic you're interested in in the URL. For example, try entering\
    \ the following in your browser's address field: http://www.php.net/strings. This\
    \ will take you to http://www.php.net/manual/en/strings.php, which is the main\
    \ page for the Strings extension. Looking at this page, you'll see a list of all\
    \ the functions made available by the extension; the same list is available in\
    \ the menu on the left hand side.\n\nTaking the strpos function as an example,\
    \ enter the URL http://www.php.net/strpos (which takes you to http://www.php.net/manual/en/function.strpos.php).\
    \ You will see the following information about the strpos function:\n\n| strpos\
    \ |\n| :--- |\n| (PHP 3, PHP 4) |\n| strpos -- Find position of first occurrence\
    \ of a string |\n| Description |\n| int strpos (string haystack, string needle\
    \ [, int offset]) |\n| Returns the numeric position of the first occurrence of\
    \ needle in the haystack. Unlike the strpos(), this function can take a full string\
    \ as the needle parameter and the entry will be used. |\n| If needle is not found,\
    \ returns FALSE. |\n\nLine one contains the name of the function and line two\
    \ the PHP versions in which the function is available. The third line tells you\
    \ what the function does. In this case, it's a fairly terse explanation, but strpos\
    \ really isn't a subject you get excited about.\n\nUnder the Description heading\
    \ is perhaps the most important line of all—the function's signature. This describes\
    \ the arguments this function accepts and the value it returns in response. Reading\
    \ from left to right, you have int, tells you that the value returned by the function\
    \ is an integer (in this case, the position of one piece of text within another).\
    \ Next comes the name of the function itself, and then, in parentheses, the arguments\
    \ this function takes, separated by commas.\n\n## Chapter 1: PHP Basics\n\nLet's\
    \ look at the argument string haystack. This says the first argument should be\
    \ a string value, where haystack simply names the argument so that it can be referred\
    \ to in the detailed description. Note that the third argument is placed inside\
    \ square brackets, which means it's optional (i.e. you don't have to supply this\
    \ argument).\n\nHere's how you could use strpos:\n\n```php\n<?php\n$haystack =\
    \ 'Hello World!';\n$needle = 'orld';\n\n// Use the strpos() function\n$position\
    \ = strpos($haystack, $needle);\necho 'The substring ' . $needle . ' in ' .\n\
    \  $haystack . ' begins at character ' . $position;\n?>\n```\n\nNotice that I've\
    \ used strpos similarly to the way it appears in the manual. I used the variable\
    \ names $haystack and $needle to make clear how each relates to the explanation\
    \ in the manual, but you can use whatever variables you like.\n\nThe function\
    \ signature convention can be used consistently throughout the manual, so once\
    \ you're used to it, you'll be able to grasp quickly how to use functions you\
    \ haven't tried before.\n\n## Get Help When Problems Arise\n\n> If you make a\
    \ mistake using an in-built function in PHP 4.3.0, the default error reporting\
    \ mechanism of PHP will display an error message with a link that takes you directly\
    \ to the manual.\n\nIf you're ever in doubt, be sure to read through the comments\
    \ submitted by other PHP developers, which appear at the bottom of every page\
    \ in the manual. Usually, you will at least see an example of how the function\
    \ is used, which may solve the particular dilemma you run into.\n\n## Further\
    \ Help\n\nOutside the manual, there are literally thousands of online resources\
    \ from which you can get help. I would dare to say that 99% of all the common\
    \ problems you'll encounter with PHP have already been answered somewhere, and\
    \ are available online. That means the most obvious (but sometimes forgotten)\
    \ place to begin is Google, a quick search for “PHP strpos problem” will give\
    \ you an idea of what I mean.\n\nThere are also some excellent sites where you\
    \ can get answers directly from other PHP developers (for free—it's part of the\
    \ PHP ethic). Perhaps the three biggest in the English language:\n\n- SitePoint\
    \ Forums: http://www.sitepointforums.com/\n- Dev Shed Forums: http://forums.devds.com/\n\
    - phpBuilder: http://www.phpbuilder.com/board/\n\nEach of these to host an online\
    \ discussion and, as such, have very friendly and easy-to-use interfaces. All\
    \ have active memberships and you should find most questions answered within twenty-four\
    \ hours.\n\nNote that when you ask for help on forums, the principle of “helping\
    \ others to help yourself” is important. Don't post a message that says, “This\
    \ problem” and paste in your entire PHP script. Narrow the problem down-identify\
    \ the area where you're having problems and this code snippet along with other\
    \ relevant information, such as error messages, the purpose of the code, your\
    \ operating system, and so on. People offering to help generally don't want to\
    \ spend more than a few minutes on your problem (they're doing it for free), saving\
    \ them time will improve your chance of getting a helpful answer.\n\nLess convenient,\
    \ but perhaps the most effective last lists are the PHP mailing lists, where beginners\
    \ are encouraged to use the PHP General list. The lists are available for limited\
    \ browsing, though it's possible to search for some of them using the search field\
    \ from the PHP Website and selecting the list of your choice.\n"
