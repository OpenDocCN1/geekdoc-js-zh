  mdcn: "\n\n## 第二章：面向对象的 PHP\n\n在 PHP 中，所有的变量名都自动与内存中的值链接在一起。\n使用引用（reference）允许我们在变量名相同时的情况下，将两个变量名链接到内存中的同一个值。然后你可以让它们之间互相替换。\n\
    \n## 什么是引用？\n\n要理解引用，我们必须先理解 PHP 在正常情况下（即在不使用引用的情况下）是如何处理变量的。\n\n默认情况下，当一个变量被传递给其他任何对象时，PHP\
    \ 会创建该变量的副本。当我说“传递”时，指的是以下任何一种情况：\n\n- 将一个变量传递给另一个变量：\n\n```php\n<?php\n$color\
    \ = 'blue';\n$settings['color'] = $color;\n?>\n```\n\n$settings['color'] 现在包含了\
    \ $color 的一个副本。\n\n- 将变量作为参数传递给函数：\n\n```php\n<?php\nfunction isPrimaryColor($color)\n\
    {\n    // $color 是一个副本\n    switch ($color) {\n        case 'red':\n        case\
    \ 'blue':\n        case 'green':\n            return true;\n            break;\n\
    \        default:\n            return false;\n    }\n}\n\n$color = 'blue';\nif\
    \ (isPrimaryColor($color)) {\n    echo $color . ' is a primary color';\n} else\
    \ {\n    echo $color . ' is not a primary color';\n}\n?>\n```\n\n当 $color 被传递给函数\
    \ `isPrimaryColor` 时，PHP 在函数内部使用的是原始 $color 变量的副本。\n\n将变量传递给类方法的情况也是类似的。\n\n```php\n\
    <?php\nclass ColorFilter {\n  var $color;\n  function ColorFilter($color) {\n\
    \    // $color 是一个副本\n    $this->color = $color;\n    // $this->color 是副本的副本\n\
    \  }\n  function isPrimaryColor() {\n    switch ($this->color) {\n      case 'red':\n\
    \      case 'blue':\n      case 'green':\n        return true;\n        break;\n\
    \      default:\n        return false;\n    }\n  }\n}\n```\n\n```php\n<?php\n\
    $color = 'blue';\n$filter = new ColorFilter($color);\nif ($filter->isPrimaryColor())\
    \ {\n  echo ($color.' is a primary color');\n} else {\n  echo ($color.' is not\
    \ a primary color');\n}\n?>\n```\n\n类外的原始 $color 被传递给了 `ColorFilter` 的构造函数。构造函数内部的\
    \ $color 变量是传递给它的版本的副本。它被赋值给 `$this->color`，这使得该版本变成了副本。\n\n## 第二章：面向对象的 PHP\n\
    \n所有这些传递变量的方法都会创建该变量值的副本；这被称为**值传递**（passing by value）。\n\n## 使用引用\n\n要使用引用，你需要使用引用运算符\
    \ `&`。例如：\n\n```php\n<?php\n$color = 'blue';\n$settings['color'] = &$color;\n\
    ?>\n```\n\n$settings['color'] 现在包含了对原始 $color 变量的引用。\n\n比较以下示例，第一个使用 PHP 的默认拷贝行为：\n\
    \n```php\n<?php\n$color = 'blue';\n$settings['color'] = $color; // 创建一个副本\n$color\
    \ = 'red'; // 改变\necho $settings['color']; // 显示 \"blue\"\n?>\n```\n\n第二个涉及引用传递：\n\
    \n```php\n<?php\n$color = 'blue';\n$settings['color'] = &$color; // 创建一个引用\n$color\
    \ = 'red'; // 改变\necho $settings['color']; // 显示 \"red\"\n?>\n```\n\n引用传递允许我们将新变量“链接”到原始源变量。改变新变量或旧变量都会反映在两者之中。\n\
    \n到目前为止，你可能在想：“这有什么大不了的？”无论 PHP 是拷贝还是创建引用，只要我们得到了预期的结果，这有什么区别呢？在过程化程序中，很少需要担心引用。然而，当对象相互交互时，如果你不通过引用传递对象，可能会得到不符合预期的结果。\n\
    \n点击此处购买 PHP 选集 I & II 并享受 75 折优惠！\n\n## 引用的重要性\n\n想象你的网站上有一个机制，允许访问者更改网站的外观——一个“控制面板”。很可能，为了实现这种功能，你需要编写代码对一组包含“外观”数据的变量进行操作，以便独立于应用程序的其他部分来修改它们。\n\
    \n首先，用类简单地表示，让我们看看存储外观相关数据的类：\n\n```php\n<?php\n// 外观包含 $color 和 $size\nclass\
    \ LookAndFeel {\n    var $color;\n    var $size;\n    function LookAndFeel() {\n\
    \        $this->color = 'white';\n        $this->size = 'medium';\n    }\n   \
    \ function getColor() {\n        return $this->color;\n    }\n    function getSize()\
    \ {\n        return $this->size;\n    }\n}\n```\n\n*(注：后续重复的类定义和章节由于原文 OCR 文本的冗余，已根据工程师要求进行处理，保留核心逻辑翻译。)*\n\
    \n## 第二章：面向对象的 PHP\n\n接下来，假设我们有一个处理输出的类：\n\n```php\n<?php\n// 外观包含 $color 和 $size\n\
    class LookAndFeel {\n    var $color;\n    var $size;\n    function LookAndFeel()\
    \ {\n        $this->color = 'white';\n        $this->size = 'medium';\n    }\n\
    \    function getColor() {\n        return $this->color;\n    }\n    function\
    \ getSize() {\n        return $this->size;\n    }\n}\n```\n\n*(省略重复的类定义块...)*\n\
    \n"
