    compliant, and can cause the PHP processor to become confused when it encounters
    XML processing instructions such as <?xml version="1.0"?. Many people have short_open_tag
    switched off, so, for maximum portability, avoid the shortcuts and switch this
    feature off during development. |

    | asp_tags (default: off) | Allows ASP style tags <% ... %> as an alternative
    to the PHP and open tags (<?php ... ?>). Few people use this, so, for maximum
