    # Chapter 1: PHP Basics


    also discuss some general tips for keeping your code portable, and provide other
    essential roughage for your PHP diet. Not everything fits under the heading of
    “basic”—there may also be a few surprises in store for the more experienced PHP
    developers, keep your eyes peeled!


    Be warned, though, the discussion of PHP syntax is not the most invigorating of
    subjects—although it is essential to prepare for later chapters. If you start
    to struggle, remember the line from The Karate Kid: you must learn “wax, wax on
    off” before you can perform the kicking kick.


    # Where do I get help?


    PHP is the most widely-used Web scripting language, running on ten million domains
    around the world[2]. For an open source technology that lacks any corporate funding
    whatsoever, its popularity may seem inexplicable. PHP’’ success is no mystery;
    it has one of the most active and helpful online communities of any technology.
    Recent estimates place the number of PHP developers around 500,000 and given the
    nature of the medium, it''s fair to assume that a large proportion are active
    online. In other words, for developers of PHP-based Websites, help is only ever
    a few clicks away.


    # Reading the Manual


    There''s a well known letter abbreviation, RTFM (I don''t think it needs explaining
    here), which tends to be used to harass beginners in all areas of computing. While
    I can understand veterans who be unwilling to read endlessly the same, well documented
    instructions, I think the basic assumption should be that we all know how to read
    the manual in the first place.


    The documentation for PHP is excellent, and is maintained by volunteers who make
    it their sole purpose to keep up to date, understandable and relevant. The online
    version[3] is extremely easy to navigate and contains further knowledge in the
    form of annotations from developers across the globe. The manual is one of the
    areas in which PHP is truly exceptional; software houses like Sun and Microsoft
    still have a long way to go to provide this quality of material to developers
    working on their platforms.


    +   [2] http://www.php.net/usage.php

    [3] http://www.php.net/manual/en/


