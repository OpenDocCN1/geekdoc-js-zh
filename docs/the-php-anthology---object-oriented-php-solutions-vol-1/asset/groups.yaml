    \ By assigning a value to the author property of $articles object, we prepare\
    \ a WHERE condition DataObjectArticles should use when it queries the database.\
    \ The query is actually performed by calling the find method (see the DB_DataObject\
    \ documentation for full details), which in turn executes the following query:\n\
    \n```sql\nSELECT FROM articles WHERE author = 'Kevin Yank'\n```\n\nTo loop through\
    \ the results, we use the fetch method. When it's called, fetch populates the\
    \ properties of the $articles object with the current result.\n\nThis allows us\
    \ to access them again via the property names, as with\n$articles->title.\n\n\
    Further methods are provided to make the query more complex, for example, the\n\
    whereAdd method:\n\n```php\n// Instantiate the DataObject_Articles class\n$articles\
    \ = new DataObject_Articles();\n\n// Assign a value to search the 'Author' column\n\
    $articles->author = 'Kevin Yank'\n\n// Add a where clause\n$articles->whereAdd('published\
    \ > ' . mktime(0, 0, 0, 5, 1, 2002));\n\n// Perform the query\n$articles->find();\n\
    ```\n\nThis allows us to add a further condition to the WHERE clause:\n\n```sql\n\
    SELECT * FROM articles\nWHERE published > 1020204000 AND articles.author = 'Kevin\
    \ Yank'\n```\n\nThere are other methods, if these fail to provide what you need,\
    \ can use the query method to execute a hand-coded query. Note that if you find\
    \ yourself needing to use the query method, it might be a good idea to create\
    \ a class of the generated DataObject class, and wrap the query in a useful method\
    \ name that describes it accurately.\n\nDB_DataObject also deals effectively with\
    \ table joins, which, although slightly more detailed than the example above,\
    \ is a certain time saver when compared with writing complex joins by hand.\n\n\
    That concludes our short introduction to DB_DataObject, but this section have\
    \ given you a taste of what it can do for you. The big advantage is that it im\
    \ querying your database with SQL far less exhausting and error-prone. Also, by\
    \ centering access to a particular table in a single class, it helps simplify\
    \ dealing with changes to the table structure.\n\n# Further Reading\n\n- * Beginning\
