    # Appendix D: Working with PEAR


    endeavours and come to a stop once the individuals in question contributing their
    time. Otherwise, there is some emphasis on maintaining a degree of standardization
    throughout the library. For example, all error handling should be performed using
    PEAR:Error, and the code should be documented using the PHPDoc standard, which
    means you should be able to extract the API documentation using PHPDocument[6]
    (Volume II, Chapter 6) if you can find it on the PEAR Website.


    Be aware: the degree of integration between the packages with PEAR is rarely low
    when compared to say, the Java class library. This means, in some cases, you''ll
    be confronted with decisions whether to use PEAR:HTMLForm''s validation functionality,
    or PEAR:Validate, or both. It''s a good idea to invest time investigating which
    fits your development up-front, rather than jumping straight in and using a PEAR
    for a critical part of your application, only to discover later that it wasn''t
    the best fit for the problem.


    One important point to be clear is that referring to “PEAR” can actually mean
    one of two things: the repository as a whole, or the PEAR front (also known as
    the package manager), which provides tools for installing and upgrading the PEAR
    packages.


    Note that it''s not a requirement that you use the PEAR manager to install PEAR
    packages. If you need to, you can download them directly from the PEAR Website
    and manually extract them to your PHP include path. Make sure you check the dependencies
    listed on the site (this being required other packages) and be aware that most
    packages implicitly require PEAR “base” package[7] for tasks like error handling.


    # Installing PEAR


    These days, the foundations of PEAR are provided with PHP distribution itself,
    but Web hosts typically fail customers with their own default PEAR installation,
    so it''s worth knowing how to go about doing this from scratch. The process can
    differ slightly between Unix and Windows based systems.


    Step one is to make sure you can run PHP scripts via the command line. This is
    always possible if you type the full path to the PHP binary. For a Unix based
    system, you use the following:


    > [6] http://www.phpdoc.org

    > [7] http://pear.php.net/package/PEAR


    Click here to order the PHP Anthology Volume 1 & II and get 25% off!


    /usr/local/bin/php /home/username/scripts/my_script.php


    For Windows, you''d use something like this:


    ```

    c:\php\cli\php.exe c:\scripts\my_script.php

    ```


    Note that in the Windows path above, we used the executable in the cli (command
    line interface) subdirectory of the PHP installation, slightly differently from
    that used Apache to handle web pages. PHP binary releases for Windows since 4.3.0
    place the cli version of the PHP executable in this directory.


    It''s possible to make PHP much easier to use from the command line, though, by
    making some changes to your system''s environment variables. For an in-depth discussion
    see Replacing Perl Scripts with PHP Scripts[8] on PHPBuilder(9).


    Next, point your browser at http://pear.php.net/go-pear, where you''ll see a PHP
    script. This script is used to install the PEAR package manager—the basis you
    will need in order to install all other PEAR packages. Download this to your computer
    (File, Save As) as go-pear.php. From here, you have a number of options.


    Storing go-pear.php wherever your server''s document root directory will allow
    you to run the script as a Web page. This behavior is still experimental, though
    there are no guarantees it''ll work correctly. If you use this approach, make
    sure that the script is not publicly available!


    Better is to execute the go-pear.php script via the command line, for example:


    ```

    /usr/local/bin/php /home/username/pear/go-pear.php

    ```


    Or, on Windows:


    ```

    c:\php\cli c:\pear\go-pear.php

    ```


    This will start an interactive command line interface, which will ask you questions
    about how you would like the "installation prefix" is the directory in which PEAR
    (as well as any packages you install) will be installed, and is referred to as
    $prefix, while $php_dir is the path to your PHP installation (in which go-pear.php
    will put PEAR-related documentation by default, unless you specify otherwise).
    Windows users are aware that


    +   [8] http://www.phpbuilder.com/columns/jayesh20021111.php3

    +   [9] http://www.phpbuilder.com/


    Click here to order the PHP Anthology Volume I & II and get 25% off!


    357


    # Appendix D: Working with PEAR


    changing the installation prefix pops up a Windows “Browse” dialog box, through
    which you can specify the required directory.


    With the installation options set to your requirements, the go-pear.php script
    will connect to the PEAR Website, and download all the packages required to set
    up the package manager (it also asks if you require additional packages, which
    are well worth having). Packages are installed in a subdirectory pear of the directory
    you specified as the installation prefix (so, in the above examples you''d end
    up with c:\pear/home/username/pear/pear).


    Finally, if you log in, the go-pear.php installer will attempt to modify your
    include_path in php.ini. To do this manually, assuming you use the directories
    above, you''d specify the following:


    ```

    include_path = ":/home/username/pear/pear*"

    ```


    For Windows users, the path is:


    ```

    include_path = "c:\pear*"

    ```


    Finally, to use the PEAR command from the command line, you need to set the system
    path. On Windows through the System Control application (on the Advanced tab,
    click Environment Variables), and appending c:\pear to the PATH variable.


    On Unix-based systems, add the following to .profile:


    ```

    export PATH=$PATH:pear

    ```


    # PEAR Package Manager


    Assuming you have set PEAR correctly, you can now use the command line interface
    to the package manager to install packages. For example, from the command line,
    type:


    ```

    pear install HTML_Common

    ```


    That will install the package HTML_Common from the PEAR Website. The package names
    for the command line are the same as on the Website.


    The PEAR Package Manager uses XML_RPC to communicate with the PEAR Website. If
    you''re behind a proxy server or firewall, you will need to tell the PEAR domain
    name of the proxy server with:


    ```

    pear config-set http_proxy.your-isp.com

    ```


    To unset the variable at later stage, simply use:


    ```

    pear config-set http_proxy ""

    ```


    Now to add QuickForm to the installed PEAR packages, you simply need to type:


    ```

    pear install HTML_QuickForm

    ```


    Should another release of QuickForm be made after you''ve installed it, you can
    upgrade the version with:


    ```

    pear upgrade HTML_QuickForm

    ```


    If, for some reason, you later decide you don''t need QuickForm anymore, you can
    remove it using:


    ```

    pear uninstall HTML_QuickForm

    ```


    For a list of all PEAR commands, simply type pear.


    Now, if you don''t like command lines, there''s also an (experimental) Web-based
    front end to PEAR (as well as a PHP-GTK front end, which is beyond the scope of
    discussion). To use it, you first need to install it from the command line.

