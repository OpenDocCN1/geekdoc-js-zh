    ## 如何修复损坏的表？


    虽然不应该发生，但存储在 MySQL 中的数据偶尔会损坏。在某些（罕见）情况下可能会发生这种情况；Windows 特别容易受到，因为它没有像 Unix 系统那样的健壮的文件锁定机制。在重负载下，`INSERT`
    和 `UPDATE` 查询与 `SELECT` 查询一样，也可能遭受偶尔损坏。你正在使用 MyISAM 表类型（除非另有指定，否则你将使用这种类型），这是一个好消息；通常情况下，你应该能够恢复损坏表中的所有数据。


    注意，这里提供的信息仅供需要帮助时的快速参考。非常值得阅读关于[灾难预防与恢复][2] 的 MySQL 手册，这样你就能确切知道自己在做什么。


    MySQL 提供了两个处理损坏表的重要工具，并为那些可以访问 MySQL 命令行的用户提供了实用的 SQL 语法。


    首先，可以从命令行运行 `error` 工具，让你大致了解 MySQL 错误代码的含义。该工具可以在你 MySQL 安装的 `bin` 子目录下找到。例如，输入
    `error 145` 将告诉你：


    145 = 表被标记为崩溃并应修复


    从命令行中，你可以使用 `myisamchk` 工具检查数据库文件本身：


    ```

    myisamchk /path/to/mysql/data/table_name

    ```


    使用 `myisamchk` 修复损坏的表，语法如下：


    ```

    myisamchk -r /path/to/mysql/data/table_name

