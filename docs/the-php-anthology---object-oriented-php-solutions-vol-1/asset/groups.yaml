- md: '

    ## How do I back up my database?


    week overwriting those from the previous week. This should provide adequate backups,
    giving you a week to discover any serious problems, and without requiring excessive
    disk space to store the files.


    The use of a ZIP utility is optional. If the value of the $zip variable is not
    gz or bz2, no compression will be made, although for large databases it''s obviously
    a good idea to use a compression tool to minimize the amount of disk space.


    This class is intended for use with the crontab utility, which is a Unix feature
    that allows you to execute scripts on a regular (for, daily) basis.


    MySQL provides the SQL statements BACKUP TABLE and RESTORE TABLE, which allow
    you to copy the contents of a table to another location on your system. Using
    the mysql utility, tables backed up in this way preserve their original format
    (which is not human-readable) but this mechanism does not require access to a
    command line utility, so it could be executed via a Web page.


    The general syntax for these statements is as follows:


    ```

    BACKUP TABLE tbl_name[, tbl_name ...]

    TO /path/to/backup/directory/


    RESTORE TABLE tbl_name[, tbl_name ...]

    FROM /path/to/backup/directory/

    ```


    Note on Windows systems it''s best to specify paths using forward slashes (e.g.
    C:/backups).


    By combining these with some of the "introspection" statements MySQL provides,
    we can back up our database using the MySQL class we built in this chapter. To
