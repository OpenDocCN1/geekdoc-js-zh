    # About The Author


    Harry is a technical writer, programmer, and system engineer. He has worked in
    corporate IT since 1994, having completed a Bachelor''s degree in Physics. He
    first came across PHP in 1999, while putting together a small Intranet. Today,
    he''s the lead developer of a corporate Extranet, where PHP plays an important
    role in delivering numerous back office systems.


    In his off hours he writes technical articles for SitePoint and runs phpPatterns
    (http://www.phppatterns.com/), a site exploring PHP application design.


    Originally from the United Kingdom, he now lives in Switzerland. In May, Harry
    became the proud father of a beautiful baby girl who keeps him busy all day (and
    night!)


    # About the Technical Editor


    As Technical Director for SitePoint, Kevin Yank oversees all of its technical
    publications—books, articles, newsletters, and blogs. He has written over 50 articles
    for SitePoint on technologies including PHP, XML, .NET, Java, JavaScript, and
    CSS, and is perhaps best known for his book, Build Your Own Database Driven Website
    Using PHP & MySQL, from SitePoint. Kevin now lives in Melbourne, Australia. In
    his spare time he enjoys flying light aircraft and learning the fine art of improvised
    acting. Go you big red fire!


    # About SitePoint


    SitePoint specializes in publishing fun, practical and easy-to-understand content
    for Web Professionals. Visit http://www.sitepoint.com/ to access our books, newsletters,
    articles, and community forums.

