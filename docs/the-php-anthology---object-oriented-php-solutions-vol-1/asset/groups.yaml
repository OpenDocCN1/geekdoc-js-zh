    \ in separate files that are included in every PHP script, making it possible\
    \ to change many scripts at one time. We'll be looking at further tricks we can\
    \ employ to make life easier in a moment.\n\n## Chapter 3: PHP and MySQL\n\nThe\
    \ mysql_connect function does the work of connecting to a MySQL server. The value\
    \ it returns is either a link identifier (a value supplied by PHP to identify\
    \ the connection), or FALSE, the connection failed.\n\n```php\nif (!$dbConn =\
    \ mysql_connect($host, $dbUser, $dbPass)) {\n    die('Could not connect to server');\n\
    }\n```\n\nThis statement asks the question \"Did I successfully connect to the\
    \ MySQL server?\" If not, it use die to terminate the script.\n\nNext, we'll select\
    \ the database we want with mysql_select_db, using the same statement technique:\n\
    \n```php\nif (!mysql_select_db($dbName, $dbConn)) {\n```\n\nNote that we provided\
    \ the variable the link identifier as the second argument to mysql_select_db.\
    \ We would usually not do this (the argument is optional), but when a complex\
    \ script jiggles multiple database connections, this method can help ensure PHP\
    \ knows which one you are referring to.\n\nFinally, we've used mysql_close to\
    \ disconnect from the server again:\n\n```php\nmysql_close($dbConn);\n```\n\n\
    This occurs at the bottom of the script, once we've run some PHP code that used\
    \ the connection. Closing the connection is generally optional—PHP automatically\
    \ closes any connections after a script finishes.\n\n> Connections with mysql_pconnect\
