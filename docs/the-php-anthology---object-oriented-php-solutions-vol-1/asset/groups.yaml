    \ the object). Finally, we have the get method, which is the only method that\
    \ returns a value. Once we've finished building the page, we'll use this to create\
    \ the HTML.\n\nAll methods use the page member variable, and this is no coincidence.\
    \ The ability to tie code (the methods) to the data (the variables) that it works\
    \ on is the most fundamental feature of object oriented programming.\n\nHere's\
    \ the class in action:\n\n```php\n// Instantiate the Page class\n$webPage = new\
    \ Page();\n\n// Add the header to the page\n$webPage->addHeader('A Page Built\
    \ with an Object');\n```\n\n```php\n// Add something to the body of the page\n\
    $webPage->addContent(\"<p align=\\\"center\\\">This page was generated using an\
    \ object</p>\");\n\n// Add the footer to the page\n$webPage->addFooter(date('Y'),\
    \ 'Object Designs Inc.');\n\n// Display the page\necho $webPage->get();\n?>\n\
    ```\n"
  mdcn: "\n\n## 第 2 章：面向对象的 PHP\n\n但是我们如何重构上述代码以采用面向对象的形式呢？\n首先，我们需要一个类，将上述两个函数 `addHeader`\
    \ 和 `addFooter` 放入其中：\n\n文件：2.php (节录）\n\n```php\n<?php\n// Page 类\nclass Page\
    \ {\n  // 生成页面顶部\n  function addHeader($page, $title)\n  {\n    $page .= <<EOD\n\
    <html>\n<head>\n<title>$title</title>\n</head>\n<body>\n<h1 align=\"center\">$title</h1>\n\
    EOD;\n    return $page;\n  }\n\n  // 生成页面底部\n  function addFooter($page, $year,\
    \ $copyright)\n  {\n    $page .= <<EOD\n<div align=\"center\">&copy; $year $copyright</div>\n\
    </body>\n</html>\nEOD;\n    return $page;\n  }\n}\n```\n\n使用 PHP 关键字 `class`，我们可以将\
    \ `addHeader` 和 `addFooter` 这两个函数组合在类中。放在类内部的函数被称为成员函数，或更常用的**方法 (methods)**。与普通函数不同，方法必须作为类的一部分被调用：\n\
    \n> ²重构是在不实际改变代码功能的情况下对代码进行结构调整。这通常是为了便于未来的维护和扩展，而当前的结构会阻碍代码的扩展。\n\n```php\n//\
    \ 初始化 $page 变量\n$page = '';\n\n// 将页头添加到页面\n$page = Page::addHeader($page, '一个使用静态方法的脚本');\n\
    \n// 向页面主体添加一些内容\n$page .= <<EOD\n<p align=\"center\">此页面是用静态类方法生成的</p>\nEOD;\n\
    \n// 将页脚添加到页面\n$page = Page::addFooter($page, date('Y'), 'Static Designs Inc.');\n\
    \n// 显示页面\necho $page;\n?>\n```\n\n我们使用 `::` 运算符调用了类方法 `addHeader` 和 `addFooter`。脚本实际上与之前几乎相同；然而，我们不再是直接调用函数，而是需要像这样调用它们：\n\
    \n```php\n$page = Page::addHeader($page, '一个使用静态方法的脚本');\n```\n\n虽然这算是一个巨大的改进，但它确实根据功能将我们的函数集合在了一起。这允许我们在不同的类中分别调用同名的不同函数。\n\
    \n## 静态方法\n\n到目前为止，我们只把类作为相关函数的容器。在面向对象的术语中，设计为这样工作的函数被称为**静态方法 (static methods)**。实际上，与大多数方法相比，静态方法相当无聊。在接下来的章节中，我们将看到如何通过完全的方法来展示你的才华。\n\
    \n## 类与对象\n\n类是对象的“蓝图”。也就是说，与你声明并使用的函数不同，类仅仅描述了一种类型的对象。在用它做有用的工作之前，你需要通过**实例化\
    \ (instantiation)** 来创建一个对象——即类的**实例 (instance)**。\n\n类并不只包含函数——它们还可以包含变量。为了让\
    \ `Page` 类更有用，我们可能希望将某些变量与方法分组，然后将类实例化为一个对象。这里是改进后的 `Page` 类的代码：文件：3.php (节录)\n\
    \n```php\n<?php\n// Page 类\nclass Page {\n\n  // 声明一个类变量\n  var $page;\n\n  //\
    \ 构造函数\n  function Page() {\n    $this->page = '';\n  }\n\n  // 生成页面顶部\n  function\
    \ addHeader($title)\n  {\n    $this->page .= <<EOD\n<html>\n<head>\n<title>$title</title>\n\
    </head>\n<body>\n<h1 align=\"center\">$title</h1>\nEOD;\n  }\n\n  // 向页面添加一些文本\n\
    \  function addContent($content)\n  {\n    $this->page .= $content;\n  }\n\n \
    \ // 生成页面底部\n  function addFooter($year, $copyright)\n  {\n    $this->page .=\
    \ <<EOD\n<div align=\"center\">&copy; $year $copyright</div>\n</body>\n</html>\n\
    EOD;\n  }\n\n  // 获取页面内容\n  function get()\n  {\n    return $this->page;\n  }\n\
    }\n```\n\n在这一版本的示例中，`Page` 类要实得多得多。首先，我们添加了一个成员变量（也称为**字段 (field)**），用于存储 HTML：\n\
    \n```php\n// 声明一个成员变量\nvar $page;\n```\n\nPHP 关键字 `var` 用于在类中声明变量。我们也可以在声明变量时为其赋值，但不能在声明中放置函数调用。例如：\n\
    \n```php\n// 这是允许的\nvar $page = '';\n\n// 这是不允许的\n// var $page = strtolower('HELLO\
    \ WORLD');\n```\n\n在变量声明之后，我们有一个特殊的方法叫做**构造函数 (constructor)**。当类被实例化时，该方法会被自动执行。构造函数的名称必须与类名相同。\n\
    \n## 构造函数没有返回值\n\n> 构造函数不能返回任何值。它的作用纯粹是在类实例化时以某种方式设置好对象。如果这有帮助的话，可以将构造函数看作是一个在设置好后会自动返回对象的函数，你不需要自己提供提供返回值。\n\
    \n尽管如此，如果需要，你仍然可以使用不带指定值的 `return` 命令来立即终止构造函数。在构造函数内部，我们使用了一个特殊变量 `$this`：\n\n\
    ```php\n// 构造函数\nfunction Page() {\n  $this->page = '';\n}\n```\n\n在任何方法（包括构造函数）中，`$this`\
    \ 都指向正在运行该方法的对象。它允许方法访问该特定对象的其他方法和变量。跟在 `$this` 后面的 `->`（箭头）运算符用于指向对象命名的属性或方法。\n\
    \n在上面的示例中，构造函数为开始时声明的成员变量赋了一个空字符串。`$this` 变量的概念初看起来很奇怪且令人困惑，但是其他编程语言（如 Java）采用的一种常用策略，允许类成员之间相互交互。一旦你开始编写面向对象的代码，你很快就会习惯它。所有方法都使用\
    \ `page` 成员变量，这并非巧合。将代码（方法）与其所处理的数据（变量）绑定在一起，是面向对象编程最基础的特性。\n\n这里是该类的实际运行：\n\n\
    ```php\n// 实例化 Page 类\n$webPage = new Page();\n\n// 将页头添加到页面\n$webPage->addHeader('一个用对象构建的页面');\n\
    ```\n\n```php\n// 向页面主体添加一些内容\n$webPage->addContent(\"<p align=\\\"center\\\"\
    >此页面是用对象生成的</p>\");\n\n// 将页脚添加到页面\n$webPage->addFooter(date('Y'), 'Object Designs\
    \ Inc.');\n\n// 显示页面\necho $webPage->get();\n?>\n```\n\n"
