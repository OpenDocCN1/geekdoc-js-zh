    \n```php\nif (!$dbConn = mysql_connect($host, $dbUser, $dbPass)) {\n    die('Could\
    \ not connect to server');\n}\n```\n\nThis statement asks the question \"Did I\
    \ successfully connect to the MySQL server?\" If not, it use die to terminate\
    \ the script.\n\nNext, we'll select the database we want with mysql_select_db,\
    \ using the same statement technique:\n\n```php\nif (!mysql_select_db($dbName,\
    \ $dbConn)) {\n```\n\nNote that we provided the variable the link identifier as\
    \ the second argument to mysql_select_db. We would usually not do this (the argument\
    \ is optional), but when a complex script jiggles multiple database connections,\
    \ this method can help ensure PHP knows which one you are referring to.\n\nFinally,\
    \ we've used mysql_close to disconnect from the server again:\n\n```php\nmysql_close($dbConn);\n\
    ```\n\nThis occurs at the bottom of the script, once we've run some PHP code that\
