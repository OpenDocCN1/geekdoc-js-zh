    // Make connection to MySQL server\nif ($dbConn = mysql_connect($host, $dbUser,\
    \ $dbPass)) {\n    die('Could not connect to server');\n}\n\n// Select the database\n\
    if (!mysql_select_db($dbName, $dbConn)) {\n    die('Could not select database');\n\
    }\n// Connection successful!\n// ... some code here using MySQL\n\n// Close the\
    \ connection when finished\nmysql_close($dbConn);\n?>\n```\n\nIt's important to\
    \ remember that MySQL is a separate server program, much like Apache. Both servers\
    \ may run on the same physical computer (hence our use of $host = 'localhost';\
    \ in the above example) it's also possible to connect MySQL to a remote computer,\
    \ $host = 'anothercomputer.com'; To make it a little more interesting, MySQL also\
    \ has its port number, which by default is 3306. PHP assumes that 3306 is the\
    \ port number you will need to use one different, all you need is $host = 'anothercomputer.com:4321';\n\
    \nThe other conceptual hurdle lies in understanding that a single MySQL server\
    \ may provide access to many databases, which is why you need to select your database\
