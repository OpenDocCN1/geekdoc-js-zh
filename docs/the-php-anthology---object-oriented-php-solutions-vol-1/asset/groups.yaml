    # How do I solve database errors caused by quotes/apostrophes?


    Consider the following SQL statement:


    ```

    INSERT INTO articles SET title=''The PHP Anthology'';

    ```


    Perhaps the PHP script that this query contained something like this:


    ```

    <?php

    $title = "The PHP Anthology";


    $sql = "INSERT INTO articles SET title=''$title'';";


    $result = mysql_query($sql, $dbConn);

    ?>

    ```


    No problem so far, but what happens if we change the title:


    ```

    $title = "PHP''s Greatest Hits";

    ```


    Notice the apostrophe in the title? When we place this in the SQL statement, the
    query MySQL receives will be as follows:


    ```

    INSERT articles SET title=''PHP''s Greatest Hits'';

    ```


    See the problem? When MySQL reads that statement, it will only get as far as this:


    ```

    INSERT INTO articles SET title=''PHP''

    ```


    The rest of the statement will cause a syntax error and the query will fail. It''s
    easy enough to avoid this problem when you write the title yourself, but what
    happens when your script gets the value from user input?


    # The Great Escape


    The solution is to escape the apostrophe character by adding a backslash before
    the apostrophe. The following query, for example, will work:'
  - '[PAGE 105]


    # Chapter 3: PHP and MySQL


    ```

    INSERT INTO articles SET title=''PHP\''s Greatest Hits'';

    ```


    # Backslashes and the ANSI SQL Standard


    Note that using the backslash as an escape character is not standard ANSI SQL.
    If MySQL is the only database you''ll ever use, the backslash may be acceptable,
    but the same SQL statement run on another database may fail. According to ANSI
    SQL we should escape apostrophes with another apostrophe: \''''


    ```

    INSERT INTO articles SET title=''PHP\''s Greatest Hits'';

    ```


    The question is, how do we make sure our apostrophes are escaped when we build
    a query on the fly? Dealing with this situation has become rather confusing due
    to the number of alternative solutions:


    +   - We have the php.ini setting magic_quotes_gpc. Magic quotes are a feature
    of PHP which, when turned on, automatically escapes single and double quotes,
    as well as backslashes and null characters in incoming GET, POST and cookie variables,
    by adding backslashes to the strings. This may sound great, but in practice it
    quickly makes for trouble, particularly where forms are involved.


    Say you have a form which is used for editing articles. Your script takes the
    text user enters and inserts it into MySQL. Now, if the user fails to complete
    some important field, you might want to re-display the details that have been
    entered in the form so far. With magic quotes you''d have to strip all the backslashes
    added to the values (with PHP''s stripslashes function!)


    Then, if you wanted to run the code on a server where magic_quotes_gpc is disabled?
    You would have to check to see if magic quotes is switched on and bypass the use
    of stripslashes. Headaches are inevitable, and if you make a mistake and end up
    with spurious backslashes stored in your database, you would have a painful cleanup
    process ahead of you.


    Magic quotes is discussed in some detail in Chapter 1. If you do switch off magic_quotes_gpc,
    you should be aware of the potential risks to security. See the section called
    "SQL Injection Attacks" below and Appendix C.


    > It continually amazes me many professionally designed sites fail to handle escaping
    properly! Keep an eye out for unexpected backslashes in your own web sites. Chapter
    1 for my advice on how best to avoid this on your own sites.


