    # 前言


    PHP 的伟大之处之一在于其充满活力且活跃的社区。开发者拥有许多在线交流聚集点，包括 [SitePoint 论坛][1](http://www.sitepointforums.com/)，开发者在那里聚在一起，帮助彼此解决每天面临的问题，从
    PHP 工作的基本知识，到解决如“我如何验证表单？”之类的设计问题。作为获取帮助的一种，这些社区是非常出色的——它们充满了你使项目成功所需的各种关键碎片。然而，将所有这些知识整合成适用于你特定情况的解决方案可能是一个难题。通常，社区成员会假设他人也具有某种程度的知识；你可能经常花费大量的时间从各种帖子、线程和用户处（每个人的编程风格都不同）收集代码段，以获得完整的全貌。


    《PHP 选集：面向对象的 PHP解决方案》（The PHP Anthology: Object Oriented PHP Solutions）首先是针对
    SitePoint 论坛常见 PHP 问题的最佳解决方案汇编，结合了我过去四年来日常处理 PHP 工作积累的经验和见解。


    与其他 PHP 书籍的不同之处在于，它摒弃了教程风格，转而关注如何以最小的努力实现实际目标。在某种程度上，你应该能够以或或“即插即用”的方式使用这里提供的许多解决方案，而无需从头到尾读完。


    尽管如此，在这些讨论中贯穿着一个“隐藏目标”。除了解决方案，本书还向你介绍了一些可以节省精力的技术，帮助你缩短完成以及后期维护 Web 端 PHP 应用程序的时间。


    尽管 PHP 最初被视为过程化编程语言，但近年来，PHP 证明其作为开发面向对象解决方案的语言已日益成功。2003 年 1 月 PHP 应用和扩展库[2](http://pear.php.net/)（PEAR）的开放进一步加强了这一点，它为全球
    PHP 开发者经常遇到的架构问题（如 Web 表单生成和验证）提供了日益增多的的可重用且维护良好的解决方案集。


    [1] http://www.sitepointforums.com/

    [2] http://pear.php.net/


    面向对象的范式似乎让许多 PHP 开发者感到恐惧，并且通常被视为所有 PHP 大师的“禁区”。本书将向你展示的是，你不需要计算机科学学位就可以利用如今 PHP
    中丰富的类库。在本书提供的解决方案的开发过程中，只要可能，我都利用了一些我个人认为好用的免费库，这些库为我节省了数小时的开发时间。使用他人开发的类通常与使用
    PHP 提供的任何内置函数一样简单。


    本书对利用可重用组件构建你的 PHP Web 应用程序的强调，反映了与许多 PHP 相关书籍关注点的又一次偏。尽管你还没有发现关于面向对象设计的广泛讨论，但通过读完《PHP
    选集：面向对象的 PHP解决方案》第一卷和第二卷，通过渗透的过程，可以帮助你将 PHP 编码技能提升到新水平，指引你构建经受住时间考验的应用。


    《PHP 选集：面向对象的 PHP解决方案》第一卷将为你提供在操作 PHP 引擎时所需的信心的要要素，包括一个关于使用 PHP 进行面向对象编程的快速入门指南（第
    2 章）。在完成这些准备后，本书将介绍适用于所有基于 PHP 的 Web 应用程序的解决方案，你可能已经了解它们的要要素，但尚未完全掌握。


    # 谁应该读这本书？


    如果你已经开始尝试 PHP（涉足水），可能读过 Kevin Yank 的《使用 PHP & MySQL 构建你自己的数据库网站》（SitePoint, ISBN-0-9579218-1-0）并完成了你的第一或两个
    PHP 项目，那么这本书适合你。


    具有更丰富 PHP 经验的读者可能希望跳到《PHP 选集：面向对象的 PHP解决方案》第二卷，学习如何使用 PHP 的一些更高级的功能，并在需要解释更基础的概念时回看《PHP
    选集：面向对象的 PHP解决方案》第一卷。


    # 本书中涵盖了什么？


    以下是你在本卷的每个章节中可以找到的内容：


    ## 第 1 章：PHP 基础


    本章总结了你为了在 PHP 中快速上手所需的所有要素，从如何使用手册、理解 PHP 错误信息到 `include` 是如何工作的。还有一些关于编写可移植代码的提示，我们将查看主要的
    PHP 配置。


    ## 第 2 章：面向对象 PHP


    第二章包含了对 PHP 类语法的概述，以及一个解释了面向对象范式的关键元素如何应用于 PHP 的入门。这是阅读本选集后续章节的必要准备。


    ## 第 3 章：PHP 与 MySQL


    本章为你提供了 MySQL（PHP 最喜爱的数据库）的所有要素。我们从基础开始，涵盖了如何避免 SQL 注入攻击等重要话题。然后我们深入探讨许多不为人知的主题，例如
    MySQL 全文检索功能、如何修复表和备份数据库，以及如何使用 PEAR::DB_DataObject 避免编写 SQL。本章还作为设计用于连接和查询 MySQL
    数据库的类的“案例研究”。


    ## 第 4 章：文件


    本章是 PHP 中处理文件的生存指南。在这里，我们将涵盖从访问本地文件系统到使用 PHP 的 FTP 客户端从网络获取文件的所有内容。我们将学习如何 PEAR::Archive_Tar
    创建你自己的压缩包。


    ## 第 5 章：文本处理


    本章涵盖了处理网站内容的要要素。我们将讨论你可以舍弃的字符串函数，以及用于验证和过滤用户提交内容的专业方法。我们将查看你如何实现一个 BBCode 系统，并理解防止跨脚本攻击涉及的实际操作问题。


    ## 第 6 章：日期与时间


    在这里，你将学习如何在数据库中存储日期，以及如何使用 PHP 的日期函数。我们将处理处理不同时区的细微差别，并实现一个在线日历。我们将看到在没有命令行访问的情况下，在网站上运行批作业是多么简单，以及如何进行简单的脚本性能测量。


