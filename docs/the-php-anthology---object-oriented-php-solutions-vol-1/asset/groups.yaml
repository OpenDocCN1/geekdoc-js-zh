- md: "\nNext, we have the PHP addslashes. Applied to any string, addslashes will\
    \ use backslashes to escape single quotes, double quotes, backslashes and null\
    \ characters. This makes it an effective means to escape strings for queries.\n\
    \nIf magic quotes is, of course, you must not use addslashes, or characters would\
    \ be escaped twice! To solve this conflict, you can check if magic quotes is enabled\
    \ with the function get_magic_quotes_gpc, which returns TRUE if magic quotes is\
    \ enabled and FALSE if it isn't. You can bundle this test with a function as follows:\n\
    \n```php\n<?php\nfunction safeAddSlashes($string)\n{\n    if (get_magic_quotes_gpc())\
    \ {\n        return $string;\n    } else {\n        return addslashes($string);\n\
    \    }\n}\n?>\n```\n\nThe third way, which is very similar to addslashes, uses\
    \ the function mysql_escape_string or mysql_real_escape_string (the latter was\
    \ added in PHP 4.3.0). These functions use the underlying MySQL C++ + API (provided\
    \ by the developers of MySQL, rather than the developers of PHP) to escape special\
    \ characters.\n\nThese functions escape null characters, line feeds, carriage\
    \ returns, backslashes, single quotes, double quotes, and end-of-file characters.\
    \ Since PHP 4.3.0, both functions have used the current character set for the\
    \ connection between PHP and MySQL. There is, therefore, no difference between\
    \ these two functions in the latest PHP versions, so free to stick with the shorter\
    \ of the two, mysql_escape_string, if your server is up-to-date.\n\nAs this method,\
    \ the built-in mechanism by MySQL for escaping strings, I recommend over addslashes\
    \ or magic_quotes_gpc. Of course, if you want your SQL to port well to other databases,\
    \ you may want to consider \"hiding\" the function within a class method, which\
    \ allows you to swap out the class—including the escape mechanism—when moving\
    \ to a different database.\n\n# Chapter 3: PHP and MySQL\n\nAgain, if you do not\
    \ otherwise handle the magic quotes issue, you'll have to check whether magic_quotes_gpc\
    \ is on:\n\n```php\n<?php\nfunction safeEscapeString($string) {\n    if (get_magic_quotes_gpc())\
    \ {\n        return $string;\n    } else {\n        return mysql_real_escape_string($string);\n\
    \    }\n}\n?>\n```\n\nThe scripts in this book make use of the MagicQuotes/strip_quotes.php\
    \ file introduced in Chapter 1 and included in the code archive to effectively\
    \ switch magic quotes on servers where it is enabled, so the solutions that follow\
    \ will use mysql_real_escape_string freely. I'd encourage you to do the same in\
    \ your own scripts if you feel confident escaping quotes and other special characters\
    \ yourself.\n\n# SQL Injection Attacks\n\nA SQL injection occurs when an attacker\
    \ exploits a legitimate user input mechanism on your site to send SQL code that\
    \ your unsuspecting script will pass on to the database to execute. The golden\
    \ rule: escape all data from external sources before letting it near your database.\
    \ That rule doesn't just apply to INSERT and UPDATE queries, but also to SELECT.\n\
    \nMany PHP developers have been saved from the SQL injection by the limitations\
    \ of MySQL, which will only allow a single SQL statement to be performed with\
    \ each call to mysql_query(). On other databases, the effect of an SQL injection\
    \ can be disastrous, as an attacker can send a second query for example, deletes\
    \ the entire contents of a table. With MySQL, however, problems can still occur,\
    \ as the following code demonstrates:\n\n```php\n$sql = \"SELECT * FROM users\
    \ WHERE username='\" . $_POST['username'] . \"' AND password='\" . $_POST['password']\
    \ . \"'\";\necho 'Query: ' . $sql . '<br/>';\n```\n\nClick here to order The PHP\
    \ Anthology Volume 1 & II and get 25% off!\n\n```php\n$rows = mysql_num_rows($result);\n\
    \nif ($rows > 0) {\n    echo 'You are logged in!<br />';\n} else {\n    echo 'You\
    \ are not allowed here!<br />';\n}\n```\n<form method=\"post\" action=\"<?php\
    \ echo $_SERVER['PHP_SELF']; ?>\">\n<input type=\"text\" name=\"username\" /><br\
    \ />\n<input type=\"text\" name=\"password\" /><br />\n<input type=\"submit\"\
    \ />\n</form>\n```\n\nA savvy attacker could simply enter the following in the\
    \ form's password field:\n' OR username LIKE '%'\n\nAssuming magic quotes is disabled\
    \ on your server, and you have no other measures in place to prevent it, this\
    \ clever alters the meaning of the query:\n\n```sql\nSELECT * FROM users\nWHERE\
    \ username='' AND password=''' OR username LIKE '%'\n```\n\nThe modified query\
    \ will select all records in the user table! When the script checks whether any\
    \ users matches the supplied user name and password combination, it will see this\
    \ big result set and grant access to the site:\n\nThis can be prevented by the\
    \ following:\n\n```php\n$sql = \"SELECT * FROM users\nWHERE username='' . safeEscapeString($_POST['username'])\
    \ . ''\nAND password='' . safeEscapeString($_POST['password']) . ''\";\n```\n\n\
    In some cases, depending on the circumstances, this may not be necessary. But\
    \ if you value your sleep, remember that golden rule: escape all data from external\
    \ sources.\n\n# How do I create flexible SQL statements?\n\nSQL is a powerful\
    \ language for manipulating data. Using PHP, we can construct SQL statements out\
    \ of variables, which can be useful for sorting a table by a single column or\
