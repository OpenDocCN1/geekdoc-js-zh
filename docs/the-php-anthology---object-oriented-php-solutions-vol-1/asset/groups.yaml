    # Appendix A: PHP Configuration


    This is a quick reference to configuring PHP that covers the most important general
    settings you need to be aware of, either when running applications in a live environment,
    or because they impact security or the way you write code.


    # Configuration Mechanisms


    The primary mechanism for configuring PHP is the php.ini file. As the master file,
    this provides you with control over all configuration settings. Entries generally
    take the:


    ```

    setting = value

    ```


    Be sure to read the comments provided in the file before making changes, though
    there are a few tricks, such as include_path using a colon (:) as a separator
    on Unix, and a semicolon (;) on Windows.


    Most hosts will not provide you access to your php.ini file unless you have root
    access to the system (which is typically not the case if you''re using a cheap
    virtual hosting service). Your next alternative is to use .htaccess files to configure
    PHP (assuming the Web server is Apache).


    An .htaccess file is a text file that you place in a public Web directory to determine
    the behavior of Apache when it comes to serving pages from that directory; for
    instance, you might identify which pages you allow public access to. Note the
    effect of an .htaccess file is recursive—it applies to subdirectories as well.


    To configure PHP with .htaccess files, your hosting provider must have the Apache
    setting AllowOverride Options or AllowOverride All to to your directory in Apache''s
    main httpd.conf configuration file. Assuming that that is done, there are two
    Apache directives you can use to modify PHP''s configuration:


    ```

    php_flag

    used for settings that have boolean values (i.e. on/off or 1/0) such as

    register_globals

    ```'
  - '[PAGE 133]


    # Appendix A: PHP Configuration


    php_value

    used to specify a string value for settings, such as you might have with the

    include_path setting


    Here''s an example .htaccess file:


    ```

    # Switch off register globals

    php_flag register_globals off


    # Set the include path

    php_value include_path "/home/username/pear"

    ```


    The final mechanism controlling PHP''s configuration is the group of functions

    ini_set and ini_alter, which let you modify configuration settings, as well as

    ini_get, which allows you to check configuration settings, and ini_restore,

    resets PHP''s configuration to the default value as defined by php.ini and

    any .htaccess files. Using ini_set, here''s an example which allows us to avoid

    having to define your host, user name and password when connecting to MySQL:


    ```

    ini_set(''mysql.default_host'', ''localhost'');

    ini_set(''mysql.default_user'', ''harryry'');

    ini_set(''mysql.default_password'', ''secret'');

    ```


    ```

    if (!mysql_connect()) {

    echo mysql_error();

    } else {

    echo ''Success'';

    }

    ```


    Be aware that PHP provides for some settings, such as error_reporting, altern-

    ative functions that perform effectively the same job as ini_set. Which you

    prefer is a matter of taste.


    Note that certain settings, such as register_globals, can only be usefully

    modified by .php.ini or .htaccess, because such settings influence PHP''s beh-

    ior it begins executing your scripts.


    Furthermore, some configuration settings can be changed only in .php.ini, such

    extension_dir, which tells PHP the directory in which PHP extensions can

    be found. For a complete reference on controlling settings, refer to the PHP

    Manual[1].


    > [1] http://www.php.net/ini_set


