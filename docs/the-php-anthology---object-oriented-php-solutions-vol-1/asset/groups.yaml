    \ object |\n\n# Composition\n\nComposition occurs when one object “completely\
    \ owns” another object. That is, the first object was responsible for creating\
    \ (instantiating) the second object. There are many cases in which this can be\
    \ useful, although, typically, composition is used when it’s likely that the first\
