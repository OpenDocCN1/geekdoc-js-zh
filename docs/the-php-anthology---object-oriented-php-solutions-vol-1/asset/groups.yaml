- md: "\n## Chapter 3: PHP and MySQL\n\nexpressions (the same as PHP’s ereg functions).\
    \ Using the RLIKE operator, we\ncompare a column by a regular expression:\n\n\
    ```\nSELECT * FROM articles WHERE title RLIKE '^How '\n```\n\nThe above statement\
    \ also selects every article in which the title begins with \"How\"\nfollowed\
    \ by a space.\n\nWith some work, these operators provide everything needed to\
    \ explore your data.\nWhere the above approach becomes a burden is in performing\
    \ a search against\nmultiple columns. For example:\n\n```\nSELECT * FROM articles\n\
    WHERE title LIKE '%how%' OR body LIKE '%how%'\n```\n\nFor larger tables, this\
    \ can require you to write some very complicated and unpleasant\nant queries.\n\
    \n## FULLTEXT Searches\n\nMySQL provides an alternative that does most of the\
    \ work for you—the FULLTEXT\nindex. Indexes in a database are much like the index\
    \ of a book; they provide a\nmeans to locate information within the database quickly\
    \ from an organized list.\nA FULLTEXT index allows you to search for particular\
    \ words.\n\nFULLTEXT indexes were introduced to MySQL with version 3.23. The implementation\n\
    at this point was fairly limited but still useful for basic searching, which is\n\
    what I’ll demonstrate here. In MySQL 4.0.1, this functionality was extended\n\
    to a full Boolean search mechanism that gives you the ability to build\nsome like\
    \ Google’s advanced search features. FULLTEXT indexes also allow\neach result\
    \ to be returned with a “relevance” value so that, for example, the results\n\
    of multiple word searches can be displayed in terms of how each result\nmatches\
    \ your user’s particular search.\n\nTo take advantage of FULLTEXT indexes, you\
    \ first need to instruct MySQL to\nbegin an index of the columns you want to search:\n\
    \n```\nALTER TABLE articles FULLTEXT art_search (title, body, author)\n```\n\n\
    Once you’ve done that, you need to INSERT a new record (or modify an existing\n\
    one) to MySQL to build the index. You also need at least three records in\nthe\
    \ database for FULLTEXT searches, because non-Boolean searches will\nonly return\
    \ results if the search string occurs in less than 50% of the rows in\nthe table\
    \ (if there are only two rows in the table, and your search matches one row, that\
    \ makes 50%). One final thing to be aware of is that FULLTEXT searches will only\
    \ match searches of more than three letters; the indexing mechanism ignores words\
    \ of three characters or less, to avoid having to build a massive index. This\
    \ is much like the index of a book; you'd be surprised to discover in a book's\
    \ index exactly pages the word \"the\" appeared on!\n\nHere's a basic FULLTEXT\
    \ search:\n\n```\nSELECT * FROM articles\nWHERE MATCH (title,body,author) AGAINST\
    \ ('MySQL');\n```\n\nThis search will return all rows where either the title,\
    \ body or author contained the word \"MySQL\".\n\nAnother use for FULLTEXT indexes\
    \ is in a search which returns the relevance for each example:\n\nFile: 19.php\
    \ (excerpt)\n\n```php\n// Select all rows but display relevance\n$sql = \"SELECT\n\
    \    MATCH (title, body, author)\n    AGAINST\n    ('The PHP Anthology Released\
    \ Long Word Matching')\n    AS\n    score\nFROM\n    articles\n    ORDER BY score\
    \ DESC\";\n```\n\n```php\n// Run the query, identifying the connection\n$queryResource\
    \ = mysql_query($sql, $dbConn);\n\n// Fetch rows from MySQL one at a time\nwhile($row\
    \ = mysql_fetch_array($queryResource, MYSQL_ASSOC)) {\n    echo 'Title: ' . $row['title']\
    \ . '<br />';\n    echo 'Author: ' . $row['author'] . '<br />';\n    echo 'Body:\
    \ ' . $row['body'] . '<br />';\n    echo 'Score: ' . $row['score'] . '<br />';\n\
    }\n```\n\nThe alias score contains a value that identifies how relevant the row\
    \ is to the search. The value is not a percentage, but simply a measure: 0 means\
    \ no match was made at all. A single word will produce a value around 1. The more\
    \ words that match, the bigger the numbers get, so a few word match ranking will\
    \ produce a relevance score around 13. MySQL's relevance algorithm is designed\
    \ for large tables, the more data you have, the more useful the relevance value\
    \ becomes.\n\nOverall, MySQL's FULLTEXT capabilities provide a mechanism that's\
    \ easy to implement and deliver useful results.\n\n## How do I back up my database?\n\
    \nThe bigger a database becomes, the more nerve wracking it can be to have a backup\
    \ of the data it contains. What if your server crashes and everything is lost?\
    \ Frankly, MySQL comes with two alternatives: a command utility like mysqldump,\
    \ and a query syntax for backing up tables.\n\nHere's how you can export the contents\
    \ of a database from the command line with mysqldump:\n\n```\nmysqldump -uharry\
    \ -psecret sitepoint > sitepoint.sql\n```\n\nThis command will log in to MySQL\
    \ as user \"harry\" (-uharry) with the password-word \"secret\" and output the\
    \ contents of the sitepoint database to a file called sitepoint.sql. The contents\
    \ of sitepoint.sql will be a series of queries that can be run against MySQL,\
    \ perhaps using the mysql utility to perform the reverse operation from the command\
    \ line:\n\n```\nmysql -uharry -psecret sitepoint < sitepoint.sql\n```\n\nUsing\
    \ the PHP function system, you can execute the command above within a PHP script\
    \ (this requires you to be logged in and able to execute PHP scripts from the\
    \ command line). The following class puts all together in a handy PHP:\n\n```php\n\
    <?php\nclass MySQLDump {\n    /**\n     * The command to execute\n     * @private\n\
    \     * @var string\n     */\n    var $cmd;\n\n    /**\n     * MySQLDump constructor\n\
    \     * @param string $dbUser MySQL User\n     * @param string $dbPass MySQL Password\n\
    \     * @param string $dbName Database name\n     * @param string $dest Path to\
    \ directory\n     * @param string $zip ZIP utility to compress with\n     */\n\
    \    public function __construct($dbUser, $dbPass, $dbName, $dest, $zip = 'gz')\
    \ {\n        $zip_util = array('gz'='gzip','bz2'='bzip2');\n        if (array_key_exists($zip,\
    \ $zip_util)) {\n            $fname = $dbName.'.'.date('w').'.sql'.($zip == 'gz'\
    \ ? '' : '.$zip);\n            $this->cmd = 'mysqldump -u'.$dbUser.' -p'.$dbPass.'\
    \ '.$dbName.' > '.$dest.'$fname;\n        } else {\n            // Handle invalid\
    \ zip type\n        }\n    }\n\n    /**\n     * Runs the constructed command\n\
    \     * @access public\n     * @return void\n     */\n    public function backup()\
    \ {\n        system($this->cmd, $error);\n        if ($error) {\n            trigger_error('Backup\
    \ failed: ' . $error);\n        }\n    }\n}\n\n// Example usage:\n$dbUser = 'harry';\n\
    $dbPass = 'secret';\n$dbName = 'sitepoint';\n$dest = '/home/harry/backups/';\n\
    $zip = 'bz2';\n\n$mysqlDump = new MySQLDump($dbUser, $dbPass, $dbName, $dest,\
    \ $zip);\n$mysqlDump->backup();\n?>\n```\n"
