    \ script jiggles multiple database connections, this method can help ensure PHP\
    \ knows which one you are referring to.\n\nFinally, we've used mysql_close to\
    \ disconnect from the server again:\n\n```php\nmysql_close($dbConn);\n```\n\n\
    This occurs at the bottom of the script, once we've run some PHP code that used\
