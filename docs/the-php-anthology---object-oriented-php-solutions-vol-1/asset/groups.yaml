    # 3


    # PHP and MySQL


    > "On the Web today, content is king."

    —Kevin Yank


    In the “old days” of the Internet, most Web pages were nothing more than text
    files containing HTML. When people surfed to your site, your Web server simply
    made the file available to their browser, which parsed the contents and rendered
    something a human being could read. This approach was fine to start with, but
    as Websites grew and issues such as design and navigation became more important,
    developers realized that maintaining hundreds of HTML files was going to be a
    massive headache. To solve this problem, it became popular to separate variable
    content (articles, news items, etc.) from the static elements of the site—its
    design and layout.


    Using a database as a repository to store variable content, a server side language
    as PHP performs the task of fetching the data and placing it within a uniform
    “framework”, the design and layout elements became reused. This means that modifying
    the overall look and feel of a site can be handled as a separate task from the
    addition or maintenance of content. Suddenly, running a Website is no longer a
    task that consumes a developer’s waking hour.


    PHP supports all relational databases worth mentioning, including those commonly
    used in large companies, such as Oracle, IBM’s DB2 and Microsoft’s SQL Server.
    The two most noteworthy open source alternatives are PostgreSQL and'
  - "[PAGE 87]\n\n# Chapter 3: PHP and MySQL\n\nMySQL Although PostgreSQL is arguably\
    \ the better database, in it supports more of the features that are common to\
    \ relational databases, MySQL is better supported on Windows, and is a popular\
    \ choice among Web hosts that provide support for PHP. These factors combine to\
    \ make PHP and MySQL a very popular combination. This book is geared to the use\
    \ of MySQL with PHP but it is important to remember that there are alternatives\
    \ with full support for features such as stored procedures, triggers and constraints,\
    \ many of which become important for applications with complex data structures.\n\
    \nThis chapter covers all the common operations PHP developers have to perform\
    \ working with MySQL, from retrieving and modifying data, to searching and backing\
    \ up a database. The examples focus on using a single table, so no discussion\
    \ is made about table relationships. For a full discussion of table relationships,\
    \ see Kevin Yank's Build Your Own Database Driven Website Using PHP & MySQL (ISBN\
    \ 0-9579218-0), or see an example of them in practice when we deal with users\
    \ in Volume II, Chapter 1.\n\nThe examples used here work with a sample database\
    \ called sitepoint, which contains the following table:\n\n```\nCREATE TABLE articles\
    \ (\n  article_id INT(11) NOT NULL AUTO_INCREMENT,\n  title VARCHAR(255) NOT NULL\
    \ DEFAULT '',\n  intro TEXT NOT NULL,\n  body TEXT NOT NULL,\n  author VARCHAR(255)\
    \ NOT NULL DEFAULT '',\n  published VARCHAR(11) DEFAULT NULL,\n  public ENUM('0','1')\
    \ NOT NULL DEFAULT '0',\n  PRIMARY KEY (article_id),\n  FULLTEXT KEY article_search\
    \ (title, body, author)\n)\n```\n\nA query to construct this table along with\
    \ sample data is available in the code archive, contained in the file sql/articles.sql.\
    \ The table will be used for examples in later chapters of the book.\n\n# How\
    \ do I access a MySQL database?\n\nConnecting to MySQL with PHP couldn't be easier.\
    \ It's essentially a two-step process; first connect to the MySQL database server\
    \ itself, then inform MySQL the database you want to connect to."
- md: "\n## A Basic Connection\n\nHere is a MySQL database connection in its simplest\
    \ form:\n\n```php\n<?php\n$host = 'localhost'; // Hostname of MySQL server\n$dbUser\
    \ = 'harryry'; // Username for MySQL\n$dbPass = 'secret'; // Password for user\n\
    $dbName = 'sitepoint'; // Database name\n\n// Make connection to MySQL server\n\
    if ($dbConn = mysql_connect($host, $dbUser, $dbPass)) {\n    die('Could not connect\
    \ to server');\n}\n\n// Select the database\nif (!mysql_select_db($dbName, $dbConn))\
    \ {\n    die('Could not select database');\n}\n// Connection successful!\n// ...\
    \ some code here using MySQL\n\n// Close the connection when finished\nmysql_close($dbConn);\n\
    ?>\n```\n\nIt's important to remember that MySQL is a separate server program,\
    \ much like Apache. Both servers may run on the same physical computer (hence\
    \ our use of $host = 'localhost'; in the above example) it's also possible to\
    \ connect MySQL to a remote computer, $host = 'anothercomputer.com'; To make it\
    \ a little more interesting, MySQL also has its port number, which by default\
    \ is 3306. PHP assumes that 3306 is the port number you will need to use one different,\
    \ all you need is $host = 'anothercomputer.com:4321';\n\nThe other conceptual\
    \ hurdle lies in understanding that a single MySQL server may provide access to\
    \ many databases, which is why you need to select your database in PHP after connecting\
    \ to the server.\n\nReturning to the code above, there are a few things to note.\
    \ First, I've placed in variables the values I need in order to connect to MySQL.\
    \ This simply makes our lives easier; it's common to store this kind of information\
    \ in separate files that are included in every PHP script, making it possible\
    \ to change many scripts at one time. We'll be looking at further tricks we can\
    \ employ to make life easier in a moment.\n\n## Chapter 3: PHP and MySQL\n\nThe\
    \ mysql_connect function does the work of connecting to a MySQL server. The value\
    \ it returns is either a link identifier (a value supplied by PHP to identify\
    \ the connection), or FALSE, the connection failed.\n\n```php\nif (!$dbConn =\
    \ mysql_connect($host, $dbUser, $dbPass)) {\n    die('Could not connect to server');\n\
    }\n```\n\nThis statement asks the question \"Did I successfully connect to the\
    \ MySQL server?\" If not, it use die to terminate the script.\n\nNext, we'll select\
    \ the database we want with mysql_select_db, using the same statement technique:\n\
    \n```php\nif (!mysql_select_db($dbName, $dbConn)) {\n```\n\nNote that we provided\
    \ the variable the link identifier as the second argument to mysql_select_db.\
    \ We would usually not do this (the argument is optional), but when a complex\
    \ script jiggles multiple database connections, this method can help ensure PHP\
    \ knows which one you are referring to.\n\nFinally, we've used mysql_close to\
    \ disconnect from the server again:\n\n```php\nmysql_close($dbConn);\n```\n\n\
    This occurs at the bottom of the script, once we've run some PHP code that used\
    \ the connection. Closing the connection is generally optional—PHP automatically\
    \ closes any connections after a script finishes.\n\n> Connections with mysql_pconnect\
    \ are different. This function establishes a persistent connection to the database\
    \ to be reused by multiple PHP scripts. Using a persistent connection makes your\
    \ scripts faster, as PHP no longer has to reconnect each time, but speed comes\
    \ at a price: if your website runs on a shared server, persistent connections\
    \ can monopolize that, rendering other sites unable to connect at times. In such\
    \ environments, it's typical to avoid mysql_pconnect, or configure MySQL so that\
    \ connections are terminated the moment they stop doing anything, with a short\
    \ connection timeout value.\n\nClick here to order The PHP Anthology Volume 1\
    \ & II and get 25% off!\n\n## Reusable Code\n\nYou've just seen the most simplistic\
    \ way to connect to MySQL. It's often useful, however, to “package” the above\
    \ code in a function or a class so that it can be reused.\n\nAs a function we\
    \ could have:\n\n```php\n<?php\nfunction connectToDb($host, $dbUser, $dbPass,\
    \ $dbName) {\n  // Make connection to MySQL server\n  if (!@mysql_connect($host,\
    \ $dbUser, $dbPass)) {\n    return false;\n  }\n\n  // Select the database\n \
    \ if (!@mysql_select_db($dbName)) {\n    return false;\n  }\n\n  return $dbConn;\n\
    }\n\n$host = 'localhost'; // Hostname of MySQL server\n$dbUser = 'harry'; // Username\
    \ for MySQL\n$dbPass = 'secret'; // Password for user\n$dbName = 'sitepoint';\
    \ // Database name\n\n$dbConn = &connectToDb($host, $dbUser, $dbPass, $dbName);\n\
    ?>\n```\n\nThis reduces the process of connecting to MySQL and selecting a database\
    \ to a single line (if you count the include statement, which would point to a\
    \ separate file containing the connectToDb function):\n\n$dbConn = &connectToDb($host,\
    \ $dbUser, $dbPass, $dbName);\n\nNote that we've used the reference operator &.\
    \ This operator and the role it plays were covered in detail in Chapter 2.\n\n\
