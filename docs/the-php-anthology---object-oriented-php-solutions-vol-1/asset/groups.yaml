    To see all this action, let''s make a script include_me.php:


    File: include_me.php


    ```php

    <?php

    // include_me.php

    echo ''I\''ve been included!<br />'';

    ?>

    ```


    Every time this script is included it will display the message "I’ve been included!"

    so we know it''s worked.


    Now, let''s test the various ways we can include this file in another script:


    File: 5.php


    ```php

    <?php

    // This works fine

    echo ''<br />Requiring Once: '';

    require_once ''include_me.php'';


    // This works fine as well

    echo ''<br />Including: '';

    include ''include_me.php'';


    // Nothing happens as file is already included

    echo ''<br />Including Once: '';

    include_once ''include_me.php'';


    // This is fine

    echo ''<br />Requiring: '';

    require ''include_me.php'';


    // Again nothing happens - the file is already included

    echo ''<br />Requiring Once again: '';

    require_once ''include_me.php'';


    // Produces a warning message as the file doesn''t exist

    echo ''<br />Include the wrong file: '';

    include ''include_wrong.php'';


    // Produces a fatal error and script execution halts

    echo ''<br />Requiring the wrong file: '';

    ```


    # Chapter 1: PHP Basics


    ```php

    require ''include_wrong.php'';


    // This will never be executed as we have a fatal error

    echo ''<br />Including again: '';

    include ''include_me.php'';

    ?>

    ```


    Here''s the output this generates (note that I''ve simplified the error messages
    at the end):


    Requiring Once: I''ve been included!


    Including: I''ve been included!


    Including Once:


    Requiring Once: I''ve been included!


    Requiring Once again:


    Include the wrong file: ''include_wrong.php'' for inclusion

    Warning: Failed opening ''include_wrong.php'' for a warning

    Requiring the wrong file:Fatal error: Failed opening required

    ''include_wrong.php''


    Notice that the first use of include_once does not include (the file has already
    included), does the later use of require_once. Later, when I try to include the
    wrong file (in a case, a file that doesn''t exist), there is a warning message.
    However, execution continues to the next line where I try to require a file that
    does not exist. This time, PHP produces a fatal error and execution of the script
    halts, meaning the final attempt to include the file will never happen.


    Be aware that the files you needn''t contain only PHP. The included file could
    simply contain HTML without any PHP.


    # Which Command to Use?


    As a general practice, unless you have a special circumstance where some other
    behavior is needed, always use the require_once command to include one file in
    another. This is particularly important when you''re placing PHP classes in separate
    files, and one class may depend on another. For the full story on classes, see
    Chapter 2.


    ![](img/80d007a3dc499b219e99d11695c2c366_35_0.png)


    Click here to order The PHP Anthology Volume I & II and get 25% off!


    PHP''s four include commands should not be confused with the various file-related
    functions (discussed in Chapter 4); these are intended for fetching without parsing
    them immediately as PHP scripts, thereby allowing you to work on their contents.


    Note that throughout this book I''ll be talking about “including” a file even
    when I''m using one of the require commands. This is a common convention for talking
    about PHP that stems from older languages used by the first PHP pioneers.


    # Path Finding


    So far, I''ve only looked at including files in the same directory as the script
    that contains the include command. In practice, you''ll usually want to organize
    files into subdirectories based on the job they do. This can be a source of confusion,
    particularly when you''re using third party code, as there are numerous alternative
    approaches to dealing with includes in other directories.


    The first thing to be aware of is all includes are calculated relative to the
    directory in the main script (where execution began) resides. For example, imagine
    we have three files in the following locations:


    ```

    /home/username/www/index.php

    /home/username/www/includes/script.php

    /home/username/www/another.php

    ```


    First, let''s consider index.php. The command include `includes/script.php`; will
    correctly include script.php, assuming index.php is the actual file requested.


    But if we use the following command in script.php:


    ```php

    include ''../another.php''; // ???

    ```


    If script.php is the page we''re viewing, this command will correctly include
    another.php. However, if index.php is the page we''re viewing, and it includes
    script.php, this command will fail, because the location of another.php is relative
    to the location of index.php, not relative to script.php.


    We have two choices. We can modify script.php so that it includes another.php
    as follows:


    ```php

    include ''another.php'';

    ```


    # Chapter 1: PHP Basics


    Alternatively, we can enter the full path to another.php, like this:


    ```php

    include ''/home/username/www/another.php'';

    ```


    This leaves no doubt as to another.php is located.


    The PHP configuration file .ini also contains the directive include_path. This
    allows you to specify directories from which files can be included, with the need
    to specify their locations when using one of the commands.


    This approach needs to be used with caution, as it may lead to strange results
    if an included file of the same name exists in more than one directory, yet it
    can be an effective means to solve include-related headaches. PHP’s PEAR[25] class
    library, for example, relies on your the directory that contains PEAR’s files
    to the include path. Note that it''s not a good idea to put too many locations
    in your include path, as will slow PHP down when it tries to find the scripts
    you''ve included in your code.


    If you''re using Apache in a shared hosting environment, you may be able to override
    the value of include_path using a .htaccess file. Placed in the directory to which
    you want to apply it (it will also apply to all subdirectories), the file should
    contain something like this:


    ```php

    php_value include_path ":/usr/local/lib/php:/home/user/phplib/

    ```


    The same can also be accomplished with the PHP function ini_set, for example:


    ```php

    ini_set(''include_path'', ''C:/phplib/'');

    ```


    This allows changes to be made at runtime within a PHP script.


    You''ll find reference to php.ini values in Appendix A.


    # How do I write portable code?


    Not all PHP installations are the same. Depending on version and configuration
    settings in php.ini, your script may not run correctly on another server. However,
    there are some good practices you can adopt to make life easier and minimize the
    need to rewrite code for other servers.


    > [25] http://pear.php.net/


    # Keep All Configuration Central


    For most PHP applications, it will be necessary to provide information describing
    the environment in which the script will run, including user names and passwords,
    directory locations, and so on. As a general rule, try to keep the majority of
    this information in a single place—maybe even a single file—so that when the information
    needs to be modified, you can do it in the one place. That said, when building
    modular applications, you may want to store elements of the configuration that
    are local to a specific "module" with the module itself, rather than centrally.
    How exactly you choose to store this information is a matter of personal choice.
    In some cases, it may be worth considering an XML file or storing some of the
    information in a database. It''s also worth aware of the parse_ini_file function,
    which I''ll explore in Chapter 4.


    A simple but effective mechanism is to place all the settings in a single file
    as PHP constants, which makes them available from any function or class in your
    application. For example:


    ```php

    <?php

    // Configuration settings

    define(''DOMAIN'', ''sitepoint.com'');


    // In another script

    echo ''The domain is '' . DOMAIN;

    ?>

    ```


    Constants need to be used with caution, though. To make your functions and classes
    reusable in other applications, they shouldn''t depend on constants of a fixed
    name; rather, in such cases, it''s best to use PHP variables in your configuration
    file, which you can pass to functions and classes as required. If you look at
    Chapter 3, connecting to MySQL we can identify a number of variables we need to
    have in a central location: the server host name, the user name, and the password
    of the selected database.


    Using the require_once command we looked at in the previous solution, we can create
    a file, for instance, config.php, and place it outside the public Web directories.
    This helps ensure that no one accidentally browses to the file containing this
    critical information, which would place the site at security risk at.

