    class Auth {\n    ...\n    /**\n     * Session 类实例\n     * @var Session\n    \
    \ */\n    var $session;\n\n    function Auth($dbConn, $redirect, $md5 = true)\n\
    \    {\n        $this->dbConn = &$dbConn;\n        $this->redirect = $redirect;\n\
    \        $this->md5 = $md5;\n        $this->session = &new Session();\n      \
    \  $this->checkAddress();\n        $this->login();\n    }\n}\n```\n\n因为 Auth 类需要读写会话变量，并且应用程序中只有少数不相关的类可能也需要\
