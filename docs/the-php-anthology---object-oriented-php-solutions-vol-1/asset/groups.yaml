    # Do I really need to write SQL?


    A good quality to possess as a programmer is laziness—the desire to do as much
    as possible with the minimum amount of effort. Although you may not want to cite
    it as one of your strong points in a job interview, being motivated to make life
    easier for yourself is a boon in developing a well developed application.


    Now that you''ve read this chapter on PHP and MySQL, I think it''s a good time
    to reveal that I hate SQL not because there''s anything wrong with it, as but
    because it always causes me grief. If there''s a syntax error in my PHP, for example,
    PHP will find it for me. But PHP won'' SQL error messages are less revealing.
    If I''m coding SQL in an application, I will spend a fair amount of time debugging—it
    could have spent taking it easy!


    If you could avoid having to write SQL statements altogether? If you think back
    to "How do I create flexible SQL statements", where we constructed SQL strings
    "on the fly" based on incoming variables, you may have had an inkling that there
    would be some kind of generic solution to make SQL ever easier. Well, it''s called
    PEAR::DataObject[3].


    DBDataObject is a class that encapsulates the process of writing SQL statements
    in a single API. It takes advantage of the native "grammar" of SQL and provides
    you with a mechanism that removes almost any need to write any SQL yourself. As
    an approach to dealing with databases, it is usually described as a database persistence
    layer, or alternatively, using the Data Access Objects (DAO) design pattern. You
    will find further discussion of the general techniques used by DBDataObject at
    the end of this chapter.


    Here, I will provide a short introduction to DBDataObject to get you started,
    as it''s a subject that could easily absorb a whole chapter if examined in depth.
    The_DataObject documentation[4] on the PEAR Website should provide you


    +   [3] http://pear.php.net/DB_DataObject

    [4] http://pear.php.net/manual/en/package.database.db-object.php


