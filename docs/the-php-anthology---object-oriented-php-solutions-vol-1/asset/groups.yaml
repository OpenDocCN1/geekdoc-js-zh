    \    var $published; // string(1) not_null enum\n\n    /* ZE2 兼容性技巧 */\n    function\
    \ clone() { return $this; }\n\n    /* 获取 */\n    function getStatic($k,$v=NULL)\
    \ {\n        return DB_DataObject::staticGet('DataObject_Articles',$k,$v);\n \
    \   }\n\n    /* 以上代码为自动生成，请勿删除下方标签 */\n    ###END_AUTOCODE\n}\n?>\n```\n\n现在让我们使用这个类来访问\
    \ articles 表：\n\n文件：23.php\n\n```php\n<?php\n// 引入 DataObjects_Articles 类\n```\n\
    \n点击此处订《The PHP Anthology Volume I & II》并享受 75 折优惠！\n\n# 我真的需要写 SQL 吗？\n\n```php\n\
    require_once 'ExampleApps/DataObject/Articles.php';\n\n// 解析数据库 ini 文件\n$dbconfig\
    \ = parse_ini_file('db_dataobject.ini', true);\n\n// 加载数据库设置\n// （注意 PEAR 类由 Articles.php\
    \ 加载）\nforeach ($dbconfig as $class => $values) {\n    $options = &PEAR::staticProperty($class,\
    \ 'options');\n    $options = $values;\n}\n\n// 实例化 DataObject_Articles 类\n$articles\
    \ = new DataObject_Articles();\n\n// 为 'Author' 列分配一个使用的值\n$articles->author =\
    \ 'Kevin Yank';\n\n// 执行查询\n$articles->find();\n```\n\necho 'Kevin has written\
    \ the following articles:<br />';\n\n// 遍历文章\nwhile ($articles->Fetch()) {\n \
    \   echo ' - ' . $articles->title . ' , published : ' . date('j M Y', $articles->published)\
    \ . ' <br />';\n}\n\n首先，SQL 呢？完全没有——太棒了！`parse_ini_file` 函数由 PHP 提供（详情请见第 4 章），用于从我们的\
    \ db_dataobject 配置文件中获取变量。fetch 循环在我们实例化 `DataObject_Articles` 时，为 `DB_DataObject`\
    \ 提供了所需的变量。通过为 `$articles` 对象的 `author` 属性赋值，我们为 `DataObjectArticles` 在查询数据库时准备了一个\
    \ `WHERE` 条件。查询实际上是通过调用 `find` 方法执行的（完整细节请参 DB_DataObject 文档），该方法转而执行了以下查询：\n\n\
    ```sql\nSELECT FROM articles WHERE author = 'Kevin Yank'\n```\n\n为了遍历结果，我们使用 `fetch`\
    \ 方法。当它被调用时，`fetch` 用当前结果填充 `$articles` 对象的属性。\n\n这允许我们再次通过属性名访问它们，例如通过 `$articles->title`。\n\
    \n还提供了其他方法来使查询更复杂，例如 `whereAdd` 方法：\n\n```php\n// 实例化 DataObject_Articles 类\n\
    $articles = new DataObject_Articles();\n\n// 为 'Author' 列分配一个用于搜索的值\n$articles->author\
    \ = 'Kevin Yank'\n\n// 添加 where 子句\n$articles->whereAdd('published > ' . mktime(0,\
    \ 0, 0, 5, 1, 2002));\n\n// 执行查询\n$articles->find();\n```\n\n这允许我们向 `WHERE` 子句中添加额外的条件：\n\
    \n```sql\nSELECT * FROM articles\nWHERE published > 1020204000 AND articles.author\
    \ = 'Kevin Yank'\n```\n\n还有其他方法，如果这些方法不能满足你的需求，可以使用 `query` 方法执行手动编写的查询。请注意，如果你发现自己需要使用\
    \ `query` 方法，那么创建一个生成的 DataObject 类可能是一个好主意，并将查询封装在一个描述准确的有用方法名中。\n\n`DB_DataObject`\
    \ 还能有效地处理表连接（table joins），虽然比上面的示例稍微详细一些，但与手动编写复杂的连接相比，它非常节省时间。\n\n对 `DB_DataObject`\
    \ 的简要介绍到此结束，但本节让你体验了它能为你做什么。巨大的优势是，使用 SQL 查询数据库要轻松得多且不易出错。此外，通过在单个类中集中对特定表的访问，有助于简化处理表结构的变化。\n\
    \n# 扩展阅读\n\n- *Beginning MySQL: http://www.devshed.com/Server_Side/MySQL/Intro/*\n\
    \n点击此处订购《The PHP Anthology Volume 1 & II》并享受 75 折优惠！\n\n"
