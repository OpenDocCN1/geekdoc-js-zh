    [8] http://www.securityfocus.com/incidents/\n[9] http://dmoz.org/Computers/Mailing_Lists/\n\
    [10] http://www.phpadvisory.com/\n\n## 附录 D：使用 PEAR\n\nPEAR[1]（PHP扩展与应用程序库）是 Stig\
    \ Bakken 的结晶，并受到了 Perl 的 CPAN[2] 的启发。\n\n作为一个项目，它构思于 1999 年，并在 2003 年 1 月发布了第一个稳定版本。它有两个：首先，它提供了解决架构问题的\
    \ PHP 类，我们在书中已经看到。其次，在 PECL（PHP扩展代码）下，PEAR 为扩展提供了仓库。PEAR 最初旨在存储边缘的非标准扩展，但后来已演变为未包含核心扩展的默认仓库。在这里，我将专注于\
