    \ users view the home page (and therefore does not require crumbs to find their\
    \ way back).\n\nIn other words, inheritance allows us to add the extra functionality\
    \ we need without having to reproduce the logic that already exists within the\
    \ parent class; the existing methods and logic can be reused via the child subclass.\n\
    \nInheritance provides a powerful mechanism to make classes that are modular,\
    \ addressing a specific problem, while still making shared methods and variables\
    \ be used irrespective of the specific object we're dealing with.\n\n# Avoid Deep\
    \ Inheritance Structures\n\nAs a general rule of thumb, when using inheritance\
    \ to build class hierarchies, going deeper than two generations.\n\n![](img/80d007a3dc499b219e99d11695c2c366_76_0.png)"
  - "[PAGE 77]\n\n# Chapter 2: Object Oriented PHP\n\nDoing so is often a sign of\
    \ a bad design, in which opportunities for classes to interact in different ways\
    \ (see the next solution) were missed. In practice, having more than two generations\
    \ of classes often leads to all sorts of debugging problems and makes the code\
    \ difficult to maintain. For example, it can become hard to keep track of variable\
    \ names you've used higher in the hierarchy.\n\n# How do objects interact?\n\n\
    Aside from inheritance, there are other ways for objects to interact; for example,\
    \ one object uses another object. In many ways, such interactions are more important\
    \ than inheritance, and this is where the object oriented paradigm shows its real\
    \ power.\n\nThere are two ways in which one object can use another: **aggregation\
    \ and composition.**\n\n# Aggregation\n\nAggregation occurs when one object is\
    \ another object on \"temporary loan.\" The second object will usually be passed\
    \ to the first one of the first’s member functions. The first object is then able\
    \ to call methods in the second, allowing it to use the functionality stored in\
    \ the second object for its own purposes.\n\nA common example of aggregation in\
    \ action involves a database connection class. Imagine you pass a database connection\
    \ class to some other class, which then uses the database connection class to\
    \ perform a query. The class performing the query **aggregates** the database\
    \ connection class.\n\nHere's a simple example using the MySQL class, which we'll\
    \ create in Chapter 3:\n\n```\n<?php\n// Include the MySQL database connection\
    \ class\nrequire_once 'Database/MySQL.php';\n\n// A class which aggregates the\
    \ MySQL class\nclass Articles {\n    var $db;\n    var $result;\n    // Accept\
    \ an instance of the MySQL class\n```"
