  - "[PAGE 55]\n\n# Understanding Scope\n\nWrite more than a few hundred lines of\
    \ procedural PHP code and, no doubt, you'll run into a parser error or, worse,\
    \ a mysterious bug caused by your accidentally using a function or variable name\
    \ more than once. When you're including numerous files and your code grows increasingly\
    \ complex, you may find yourself becoming more paranoid about this issue. How\
    \ do you stop naming conflicts from occurring? One approach that can help solve\
    \ this problem is to take advantage of scope to hide variables and functions from\
    \ code that doesn't need them.\n\nA scope is a context within which variables\
    \ or functions are isolated from other scopes. PHP has three available scopes:\
    \ the global scope, the function scope, and the class scope. Variables and functions\
    \ defined in any of these scopes are hidden from any other scope. The function\
    \ and class scopes are local scopes, meaning that function X's scope is hidden\
    \ from function Y's scope, and vice versa.\n\nThe big advantage of classes is\
    \ that you define variables and the functions that use them in one place, keeping\
    \ the functions from unrelated code. This highlights one of key theoretical points\
    \ about the object oriented paradigm. The particular paradigm places most emphasis\
    \ on functions, variables being treated as little than a pair to store data between\
    \ function calls. The object oriented paradigm shifts the emphasis to variables;\
    \ the functions \"back\" the variables and are used to access or modify them.\n\
    \nLet's explore this through an example:\n\n```\n<?php\n// A global variable\n\
    $MyVariable = 'Going global';\n\n// A function declared in the global scope\n\
    function myFunction()\n{\n    // A variable in function scope\n    $MyVariable\
    \ = 'Very functional';\n}\n\n// A class declared in the global scope\nclass MyClass\
    \ {\n    // A variable declared in the class scope\n    var $MyVariable = 'A class\
    \ act';\n\n```"
