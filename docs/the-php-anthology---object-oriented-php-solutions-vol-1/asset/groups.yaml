- md: "\n## Chapter 3: PHP and MySQL\n\ndo I fetch data from a table?). The following\
    \ code illustrates the use of mysql_num_rows:\n\nFile: 12.php (excerpt)\n\n```php\n\
    // A query to select all articles\n$sql = \"SELECT * FROM articles ORDER BY title\"\
    ;\n\n// Run the query, identifying the connection\n$queryResource = mysql_query($sql,\
    \ $dbConn);\n\n// Fetch the number of rows selected\n$numRows = mysql_num_rows($queryResource);\n\
    \necho $numRows . ' rows<br/>';\n\n// Fetch rows from MySQL one at a time\nwhile\
    \ ($row = mysql_fetch_array($queryResource, MYSQL_ASSOC)) {\n    echo 'Title:\
    \ ' . $row['title'] . ' <br/>';\n    echo 'Author: ' . $row['author'] . ' <br/>';\n\
    \    echo 'Body: ' . $row['body'] . ' <br/>';\n}\n```\n\nThe mysql_num_rows function,\
    \ in the example above, takes a result resource identifier and returns the number\
    \ of rows in that result.\n\nNote that the related function, mysql_num_fields,\
    \ can be used to find out how many columns were selected. This can be handy when\
    \ you're using queries like SELECT * FROM, but you don't know how many columns\
    \ you've selected.\n\n## Counting Rows with MySQL\n\nThe alternative approach\
    \ is to use MySQL's COUNT function within the query. This requires that you perform\
    \ two queries—one to count the rows and one to actually get the results—which\
    \ will cost you a little in terms of performance.\n\nHere's how you could use\
    \ the MySQL COUNT function:\n\nFile: 13.php (excerpt)\n\n```php\n// A query to\
    \ select all articles\n$sql = \"SELECT COUNT(*) AS numrows FROM articles\";\n\n\
    // Query to count the rows returned\n$queryResource = mysql_query($sql, $dbConn);\n\
    \n$row = mysql_fetch_array($queryResource, MYSQL_ASSOC);\n\necho $row['numrows']\
    \ . ' rows selected<br />';\n\n// A query to select all articles\n$sql = \"SELECT\
    \ * FROM articles ORDER BY title\";\n\n// Run the query, identifying the connection\n\
    $queryResource = mysql_query($sql, $dbConn);\n\n// Fetch rows from MySQL one at\
    \ a time\nwhile ($row = mysql_fetch_array($queryResource, MYSQL_ASSOC)) {\n  echo\
    \ 'Title: ' . $row['title'] . '<br />';\n  echo 'Author: ' . $row['author'] .\
    \ '<br />';\n  echo 'Body: ' . $row['body'] . '<br />';\n}\n```\n\nNotice we used\
    \ an alias to place the result of the COUNT function?\n\nSELECT COUNT(*) AS numrows\
    \ FROM articles\n\nWe do so that the number of rows can be identified later using\
    \ $row['numrows']. The alternative would have been to omit the alias:\n\nSELECT\
    \ COUNT(*) FROM articles\n\nThis would require that we access the information\
    \ as $row['COUNT(*)'], which can make the code confusing to read.\n\nWhen we use\
    \ the COUNT function, it becomes important to construct queries on the fly as\
    \ seen in \"How do create flexible SQL statements? You need to make sure your\
    \ COUNT query contains the same WHERE or LIMIT clauses you used in the \"real\"\
    \ query. For example, if the query we're actually using to fetch data is:\n\n\
    ```sql\nSELECT * FROM articles WHERE author='HarryF'\n```\n\nIn PHP, we'll probably\
    \ want something like this:\n\n```php\n// Define reusable \"chunks\" of SQL\n\
    $table = \" FROM articles\";\n$where = \" WHERE author='HarryF'\";\n$order  =\
    \ \" ORDER BY title\";\n\n// Query to count the rows returned\n$sql = \"SELECT\
    \ COUNT(*) as numrows\" . $table . $where;\n\n// Run the query, identifying the\
    \ connection\n$queryResource = mysql_query($sql, $dbConn);\n\n$row = mysql_fetch_array($queryResource,\
    \ MYSQL_ASSOC);\necho $row['numrows'] . \" rows selected<br />\";\n\n// A query\
    \ to fetch the rows\n$sql = \"SELECT \" . $table . $where . $order;\n\n// Run\
    \ the query, identifying the connection\n$queryResource = mysql_query($sql, $dbConn);\n\
    \n// Fetches rows from MySQL one at a time\nwhile ($row = mysql_fetch_array($queryResource,\
    \ MYSQL_ASSOC)) {\n    echo 'Title: ' . $row['title'] . '<br />';\n    echo 'Author:\
    \ ' . $row['author'] . '<br />';\n    echo 'Body: ' . $row['body'] . '<br />';\n\
    }\n```\n\n## Row Count with Classes\n\nLet's look again at the classes we've developing\
    \ throughout this section. We can add the ability to find out the number of rows\
    \ selected by introducing the following method to the MySQLResult class:\n\nFile:\
    \ Database/MySQL.php (in SPLIB) excerpt\n\n```php\n/**\n * Returns the number\
    \ of rows selected\n * @return int\n * @access public\n */\nfunction size() {\n\
    \    return mysql_num_rows($this->query);\n}\n```\n\nHere's how to use it:\n\n\
    ```php\n// Connect to MySQL\n$db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\
    ```\n\nFile: 15.php (excerpt)\n\nClick here to order the PHP Anthology Volume\
    \ I & II and get 25% off!\n\n```php\n// Select all rows\n$sql = \"SELECT * FROM\
    \ articles WHERE author='HarryF'\";\n$result = $db->query($sql);\necho $result->size()\
    \ . \" rows\";\n```\n\n## Affected Rows\n\nIt's also possible to find how many\
    \ rows were affected by an UPDATE or DELETE statement. The mysql_affected_rows\
    \ function returns the number of rows affected by the last query. Here's how you\
    \ could use it:\n\n```php\n// Update some rows\n$sql = \"UPDATE articles SET title='New\
    \ Title' WHERE author='HarryF'\";\n$queryResource = mysql_query($sql, $dbConn);\n\
    $affected = mysql_affected_rows($queryResource);\necho $affected . \" rows affected\"\
    ;\n```\n\n## Insert ID\n\nWhen you are dealing with AUTO_INCREMENT columns, it's\
    \ often useful to find out the ID of the row you just inserted. The mysql_insert_id\
    \ function provides this information. Here's how you could use it:\n\n```php\n\
    // Insert a new row\n$sql = \"INSERT INTO articles (title, body, author) VALUES\
    \ ('How to use mysql_insert_id()', 'This is an example', 'HarryF')\";\n$queryResource\
    \ = mysql_query($sql, $dbConn);\n$insertID = mysql_insert_id($queryResource);\n\
    \necho 'The new row has ID: ' . $insertID;\n```\n\n## Class Insert ID\n\nTo use\
    \ this functionality in our MySQLResult class, add the following method:\n\n```php\n\
    /**\n * Returns the ID of the last row inserted\n * @return int\n * @access public\n\
    \ */\nfunction insertID() {\n    return mysql_insert_id($this->dbConn);\n}\n```\n\
    \nAs you might guess, this method is quite straightforward:\n\n```php\n// Include\
    \ the MySQL class\nrequire_once 'Database/MySQL.php';\n\n$host = 'localhost';\
    \ // Hostname of MySQL server\n$dbUser = 'harry'; // Username for MySQL\n$dbPass\
    \ = 'secret'; // Password for user\n$dbName = 'sitepoint'; // Database name\n\n\
    $db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\n// Insert a new row\n$sql=\"\
    INSERT INTO articles (title, body, author) VALUES ('How to use mysql_insert_id()',\
    \ 'This is an example', 'HarryF')\";\n\n$result = $db->query($sql);\n\necho 'The\
    \ row as ID: ' . $result->insertID();\n```\n\n## How do I search my table?\n\n\
    Some people are just impatient; rather than trawling your site navigation system\
    \ you've provided, they demand information now! Hence PHP developers like you\
    \ and I are required to implement search features to provide visitors a short\
    \ cut to find the information they want. In days of storing all content in the\
    \ form of HTML files, this could be quite a problem, but now that you're using\
    \ a database to search, searching becomes much easier.\n\n## What You LIKE\n\n\
    The most basic form of search occurs against a single column, with the LIKE operator:\n\
    \n```sql\nSELECT * FROM articles WHERE title LIKE 'How %'\n```\n\nThe % is a wildcard\
    \ character. The above statement will select all articles in which the title begins\
    \ with the word \"How.\" MySQL also has support for POSIX regular\n"
  mdcn: "\n\n## 第 3 章：PHP 与 MySQL\n\n（我该如何从表中获取数据呢？）以下代码演示了 `mysql_num_rows` 的用法：\n\
    \n文件：12.php（节录）\n\n```php\n// 查询所有文章的语句\n$sql = \"SELECT * FROM articles ORDER\
    \ BY title\";\n\n// 执行查询，标识连接\n$queryResource = mysql_query($sql, $dbConn);\n\n\
    // 获取选定的行数\n$numRows = mysql_num_rows($queryResource);\n\necho $numRows . ' rows<br/>';\n\
    \n// 一次从 MySQL 获取一行数据\nwhile ($row = mysql_fetch_array($queryResource, MYSQL_ASSOC))\
    \ {\n    echo 'Title: ' . $row['title'] . ' < br/>';\n    echo 'Author: ' . $row['author']\
    \ . ' < br/>';\n    echo 'Body: ' . $row['body'] . ' < br/>';\n}\n```\n\n在上面的示例中，`mysql_num_rows`\
    \ 函数接收一个结果资源标识符并返回该结果中的行数。\n\n请注意，相关函数 `mysql_num_fields` 可用于查找选取了多少列。当你使用像 `SELECT\
    \ * FROM` 类的查询，但不知道选取了多少列时，这非常有用。\n\n## 使用 MySQL 统计行数\n\n另一种方法是在查询中使用 MySQL 的\
    \ `COUNT` 函数。这要求你执行两次查询——一个用于统计行数，另一个用于实际获取结果——这在性能上会让你产生少许的开销。\n\n以下是你可以使用 MySQL\
    \ `COUNT` 函数的方法：\n\n文件：13.php（节录）\n\n```php\n// 查询所有文章的语句\n$sql = \"SELECT COUNT(*)\
    \ AS numrows FROM articles\";\n\n// 统计返回行数的查询\n$queryResource = mysql_query($sql,\
    \ $dbConn);\n\n$row = mysql_fetch_array($queryResource, MYSQL_ASSOC);\n\necho\
    \ $row['numrows'] . ' rows selected<br />';\n\n// 查询所有文章的语句\n$sql = \"SELECT *\
    \ FROM articles ORDER BY title\";\n\n// 执行查询，标识连接\n$queryResource = mysql_query($sql,\
