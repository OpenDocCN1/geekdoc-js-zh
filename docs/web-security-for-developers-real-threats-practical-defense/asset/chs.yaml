  \ Haggis 大多数时间远离键盘，偶尔在沙发上吐吐。\n\n## 引言\n![image](img/common01.jpg)\n网络是一个狂野的地方。人们很容易产生这样印象：互联网是由专家们非常有刻意地设计的，而且一切的运行都有其充分的原因。事实上，互联网的演变是快速且无章法的，我们今天在网络上做的事情远超最初发明者的想象。\n\
  \n因此，保护你的网站似乎是一项艰巨的任务。网站是一种独特的软件类型，在发布后立即即可供数百万用户使用，其中还包括一个活跃且动力十足的黑客社区。大公司经常遭受安全故障，每周都有新的数据泄露消息公布。面对这些，一个\
  \ Web 开发者该如何保护自己呢？\n\n### 关于本书\n网络安全的大秘密在于，Web 漏洞的数量实际上相当少——巧合的是，规模足以装在一本书里——而且这些漏洞多年来变化并不大。这本书将教你需要了解的*每一个*关键威胁，我将为你分解你应该采取的实用步骤。\n\
  \n### 谁应该读这本书\n如果你是一个职业生涯刚刚起步的 Web 开发者，这本书将是你安全的理想“旅行者指南”。无论你是刚完成计算机科学专业学习、刚从训练营毕业，亦或是自学，我都建议你通读此书。\n\
  \n如果你是一个经验丰富的程序员，这本书也将很有用。你总可以在加强安全知识中受益，因此请利用这本书填补你的空白。像你这样的资深程序员有责任以身作则，对于 Web\
  \ 开发者来说，这意味着遵守规范。你会发现这本书并不针对任何特定的语言。\n\n### 互联网历史\n在列出本书内容之前，回顾一下互联网是如何达到现状的将帮助。许多天才工程师对互联网的爆炸式增长做出了贡献，但与大多数软件项目一样，安全考虑往往让位于功能之后。理解安全漏洞是如何引入的，将为你学习修复它们时提供背景。\n\
  \n万维网是 Tim Berners-Lee 在欧洲核子研究组织（CERN）工作期间发明的。CERN 的研究通过碰撞亚原子粒子，希望它们分裂成更小的亚原子粒子，从而揭示宇宙的基本结构，同时也理解这种研究有可能会在地球上产生黑洞。\n\
  \nBerners-Lee 似乎并不像同事们那样对毁灭宇宙感兴趣，他在 CERN 期间发明了我们今天所知的互联网，作为大学之间分享发现的手段。他创建了第一个 Web\
  \ 浏览器和第一个 Web 服务器，并发明了超文本标记语言（HTML）和超文本传输协议（HTTP）。世界上第一个网站于 1993 年上线。\n\n早期的网页只有纯文本。第一个能够显示内联图像的浏览器是\
  \ Mosaic，它创建于国家超级计算中心。Mosaic 的创建者最终加入了 Netscape Communications，并在那里帮助创建了第一个广泛使用的\
  \ Web 浏览器 Netscape Navigator。在早期 Web 时代，大多数页面是静态的，且流量未经加密传输。一个简单的时代！\n\n### 浏览器中的脚本\n\
  \n\n\n\n\n回到 1995 年，Netscape Communications 的一名新入员工 Brendan Eich 只花了 10 天就发明了 `JavaScript`，这是第一个可以嵌入网页的语言。在开发期间，这种语言被称为\
  \ `Mocha`，随后被更名为 `LiveScript`，之后再次更名为 `JavaScript`，最后被正式化为 `ECMAScript`。没有人喜欢 `ECMAScript`\
  \ 这个名字，尤其是 Eich，他声称这个名字听起来像一种皮肤病；因此，除了在最正式的场合，每个人继续称其为 `JavaScript`。\n\nJavaScript\
  \ 的最初形态结合了（与其无关的）`Java` 编程语言笨拙的命名规范、`C` 的结构化编程语法、`Self` 晦涩的原型继承机制，以及 Eich 亲自设计的噩梦般的类型转换逻辑。无论好坏，`JavaScript`\
  \ 成了 Web 浏览器的事实语言。突然，网页变成了交互式事物，一整类安全漏洞应运而生。黑客发现了通过跨站脚本攻击向页面中注入 `JavaScript` 代码的方法，互联网变成了一个危险得多的地方。\n\
  \n# 一个新挑战者进入竞技场\n\nNetscape Navigator 的第一个真正对手是微软的 `Internet Explorer`。`Internet\
  \ Explorer` 具有几个竞争优势——它是免费的，并且预装在 `Microsoft Windows` 上。`Explorer` 迅速成为世界上最流行的浏览器，`Explorer`\
  \ 图标成为了对于一代学习如何浏览网页的用户的“互联网按钮”。\n\n微软试图“拥有” Web 的尝试导致其向浏览器中引入了 `ActiveX` 等专有技术。不幸的是，这导致了\
  \ `malware`（恶意软件，即感染用户机器的恶意软件）的增加。`Windows` 是（现在仍然是）计算机病毒的主要目标，而互联网被证明是一种有效的传输机制。\n\
  \n`Internet Explorer` 的统治地位多年没有受到挑战，直到 Mozilla 的 `Firefox` 发布，随后是 `Chrome` —— 这是一个由勇敢勇敢的年轻搜索初创公司\
  \ Google 创建的一款酷炫的新浏览器。这些新浏览器加速了互联网标准的增长和创新。然而，到此时，黑客攻击已成为一项有利的业务，任何安全漏洞一旦被发现就会被利用。保护浏览器成为开发商的首要任务，网站所有者如果想保护他们的用户，就必须跟上安全新闻。\n\
  \n# 编写 HTML 的机器\n\nWeb 服务器的演进与浏览器技术一样快速。在互联网的早期，托管网站是一项由学术界从事的小众爱好。大多数大学运行开源操作系统\
  \ `Linux`。1993 年，`Linux` 社区实现了 `Common Gateway Interface (CGI)`，它允许 `webmasters`\
  \ 轻松创建由相互互联的动态 `HTML` 页面组成的网站（注：此处原文为 static，译文修正为：允许 webmasters 轻松创建由相互互联的静态 `HTML`\
  \ 页面组成的网站）。更有趣的是，`CGI` 允许使用 `Perl` 或 `PHP` 等脚本语言生成 `HTML`——这样网站所有者就可以从存储在数据库中的内容动态创建页面。`PHP`\
  \ 最初代表 Personal Home Page（个人主页），那时人们的梦想是每个人运行自己的 Web 服务器，而不是将所有个人信息上传到一个数据隐私政策存疑的社交媒体巨头。\n\
  \n`PHP` 普及了 `template`（模板）文件的概念：嵌入处理标签的 `HTML`，可以通过 `PHP` 运行时引擎进行处理。动态 `PHP` 网站（如\
  \ `Facebook` 的早期形态）在互联网上蓬勃发展。然而，动态服务器代码引入了一整类新的安全漏洞。黑客发现了通过注入攻击在服务器上运行自己的恶意代码的新颖方法，或者通过目录遍历来探索服务器的文件系统。\n\
  \n# 一系列管子\n\nWeb 技术的不断重构意味着今天互联网的很大程度上是由我们认为“老旧”的技术驱动的。软件往往会达到一个足够好用的平衡点，然后进入“维护”模式，即只有在绝对必要时才进行更改。对于\
  \ Web 服务器来说尤其如此，因为它们需要 24/7 小时在线。黑客在网络上扫描运行旧旧技术的漏洞网站，因为这些网站经常出现安全漏洞。我们仍然在修复十年前首次发现的安全问题，这就是为什么在在本书中，我描述了每一个可能影响网站的主要安全漏洞。\n\
  \n与此同时，互联网的增长速度比以往任何时候都快！汽车、门铃、冰箱、灯泡和猫砂盆等接入互联网的日常设备趋势，这种趋势开启了新的攻击向量。连接到物联网的家电越简单，就越可能缺乏自动更新的安全功能。这引入了大量的不安全互联网节点，为\
  \ `botnets`（僵尸网络，可以被黑客远程安装和控制的恶意软件代理）提供了丰富的托管环境。如果攻击者针对你的网站，这为他们提供了大量的潜在火力。\n\n\
  # 首先要担心什么\n\nWeb 开发人员可能会因为正确保护网站的困难而容易感到沮丧。但你应该保持希望：有一支安全研究人员正在那里勇敢地发现、记录和修复安全漏洞。你保护网站所需的工具是免费提供的，而且通常易于使用。\n\
  \n学习最常见的安全漏洞并了解如何修补它们，将保护你的系统免受 99% 的攻击。技术极高的对手总会有办法破解你的系统，但除非你正在运行伊朗核反应堆或参加美国竞选，否则这种想法不应该让你彻夜难眠。\n\
  \n# 本书中包含什么\n\n本书分为两个部分。第一部分 涵盖了互联网工作原理的基础知识。第二部分 深入探讨了你需要防护的特定漏洞。内容如下：\n\n## 第\
  \ 1 章：让我们黑一个网站](#ch01.xhtml_ch01)\n\n在介绍章节中，你将学习黑一个网站有多简单。提示：非常简单，所以你买这本书是明智的。\n\
  \n## 第 2 章：互联网是如何工作的](#ch02.xhtml_ch02)\n\n互联网的“管子”运行在互联网协议上，这是一系列允许全球计算机无缝通信的网络技术。你将回顾\
  \ `TCP`、`IP` 地址、域名和 `HTTP`，并数据如何在网络上安全传输。\n\n## 第 3 章：浏览器是如何工作的](#ch03.xhtml_ch03)\n\
  \n用户通过浏览器与你的网站交互，许多安全漏洞在那里。你将学习浏览器如何渲染网页，以及 `JavaScript` 代码如何在浏览器安全模型中执行。\n\n##\
  \ 第 4 章：Web 服务器是如何工作的](#ch04.xhtml_ch04)\n\n你为网站编写的大部分代码运行在 Web 服务器环境中。服务器是黑客的主要目标。本章描述了它们如何提供静态内容，以及如何使用模板等动态内容整合来自数据库和其他系统的数据。你还将接触一些用于\
  \ Web 编程的主要语言，并审查每种语言的安全考量。\n\n## 第 5 章：程序员是如何工作的](#ch05.xhtml_ch05)\n\n本章解释了你应该如何进行网站代码编写，以及你可以培养哪些减少\
  \ Bug 和安全漏洞风险的好习惯。\n\n## 第 6 章：注入攻击](#ch06.xhtml_ch06)\n\n\n\n\n\n我们将通过查看你将遇到的最恶劣威胁之一来开始对网站漏洞进行调查：黑客注入代码并在你的服务器上执行它。这通常发生在你的代码与\
  \ SQL 数据库或操作系统交互时；或者攻击可能由注入到 Web 服务器进程本身的远程代码组成。你还将看到文件上传功能如何允许黑客注入恶意脚本。\n\n## 第\
  \ 7 章：跨站脚本攻击\n\n本章回顾了用于将恶意 JavaScript 代码走私到浏览器环境的攻击，以及如何防御这些攻击。跨站脚本有三种不同的方法（存储型、反射型和基于\
  \ DOM 的），你将学习如何防御每一种攻击。\n\n## 第 8 章：跨站请求伪造攻击\n\n你将看到黑客如何利用伪造攻击欺骗你的用户执行不希望执行的操作。这是互联网上常见的困扰，你需要相应地保护你的用户。\n\
  \n## 第 9 章：破解身份认证\n\n如果用户注册了你的网站，安全地处理他们的账户至关重要。你将回顾黑客用于绕过登录界面的各种方法，从密码的暴力破解猜测到用户枚举。你还将回顾如何在数据库中安全地存储用户凭据。\n\
  \n## 第 10 章：会话劫持\n\n你将看到你的用户在登录后账户如何被劫持。你将学习如何构建网站并安全地处理你的 Cookie 以降低这种风险。\n\n##\
  \ 第 11 章：权限\n\n学习如何防止恶意行为者利用权限提升访问你网站的禁用区域。特别是，如果你在 URL 中引用了文件，黑客将尝试使用目录遍历来探索你的文件系统。\n\
  \n## 第 12 章：信息泄露\n\n你可能通过泄露信息而为你的网站发布漏洞。本章将告诉你如何立即停止这种行为。\n\n## 第 13 章：加密\n\n本章展示了如何正确使用加密，并解释了为什么它在互联网上如此重要。准备好面对一些基础数学知识。\n\
  \n## 第 14 章：第三方代码\n\n你将学习如何管理他人代码中的漏洞。你运行的大部分代码都是别人编写的，你应该知道如何确保它的安全！\n\n## 第 15\
  \ 章：XML 攻击\n\n你的 Web 服务器可能解析 XML，并可能受到本章描述的攻击的影响。在过去的几十年里，XML 攻击一直是黑客中一直流行的攻击手段，所以务要小心！\n\
  \n## 第 16 章：不要做帮凶\n\n正如你在本章中看到的，你可能会无意中成为他人黑客尝试的帮凶。通过确保关闭这些安全漏洞，做一名良好的互联网公民吧。\n\n\
  ## 第 17 章：拒绝服务攻击\n\n在本章中，我将向你展示大量的网络流量如何作为拒绝攻击的一部分使你的网站离线。\n\n## 第 18 章：总结\n\n最后一章是一份备忘表，回顾了你整本书中学到的安全关键要素，并总结了你在具备安全意识时应该应用的高级原则。烂记于心，并在每晚睡觉前背诵这些课程。\n\
  \n# 1\n\n## 让我们黑一个网站\n\n![image](img/common01.jpg)\n\n这本书将教你成为一名高效 Web 开发人员所需要的必备安全知识。在开始之前，观察你将如何攻击一个网站是一项有用的练习。让我们置身于敌人的立场，看看我们面对的是什么。本章将向你展示黑客是如何操作的，以及开始黑客攻击有多简单。\n\
  \n### 软件漏洞与暗网\n\n黑客利用网站等软件中的安全漏洞。在黑客社区中，说明如何利用安全漏洞的代码段被称为 `exploit`（利用程序）。一些黑客——好人，通常被称为`白帽黑客`——尝试出于趣味发现安全漏洞，并在公开之前向软件供应商和网站所有者通报这些利用程序。此类黑客通常会通过此行为获得财务报酬。\n\
  \n负责任的软件供应商会尽快为`zero-day exploits`（公开时间不足一天或完全未公开的漏洞）制作补丁。然而，即使软件供应商发布了补丁来修复软件漏洞，许多受影响的软件实例仍会在一段时间内未打补丁。\n\
  \n道德水平较低的黑客——`黑帽`——会囤积利用程序以最大化他们可以使用漏洞的时间窗口，甚至会在黑市用比特币出售利用程序代码。在当今的互联网上，利用程序被迅速武器化，并整合到黑客社区广泛使用的命令行工具中。\n\
  \n使用这些利用工具的黑帽黑客存在着丰厚的财务激励。被盗的信用卡详情、被黑的用户账户和零日漏洞的黑市存在于`dark 网`，这些网站只能通过匿名传入 IP 地址的特殊网络节点访问。暗网站，如图\
  \ 1-1 所示，\n\n![image](img/01fig01.jpg)\n\n*图 1-1：嗨，是的，我想买一些被盗的信用卡号，因为你显然是一个高级俄罗斯特工。*\n\
  \n可以利用最新漏洞的黑客工具免费且易于设置。你甚至不需要访问暗网，因为你需要的一切通过简单的 Google 搜索就能找到。让我们来看看如何操作。\n\n###\
  \ 如何攻击网站\n\n开始黑客攻击异常简单。以下是方法：\n\n1. 搜索 `kali linux`。`Kali Linux` 是一个专门为黑客构建的 Linux\
  \ 操作系统版本。它预装了 600 多个安全和黑客工具。它是完全免费的，由 Offensive Security 的一个安全研究人员小组维护。\n2. 在你的计算机上安装一个虚拟机容器。`Virtual\
  \ containers` 是允许你在计算机上安装其他操作系统而不会覆盖当前操作系统的宿主机环境。Oracle 的 `VirtualBox` 是免费的，并可以安装在\
  \ Windows、macOS 或 Linux 上。这允许你在不需要过多配置的情况下在电脑上运行 `Kali Linux`。\n3. 在容器中安装 `Kali\
  \ Linux`。下载并双击安装程序开始。\n4. 启动 `Kali Linux` 并打开 `Metasploit` 框架。`Metasploit`如图 1-2\
  \ 所示，是测试网站安全和检查漏洞的最流行的命令行工具。\n\n![image](img/01fig02.jpg)\n\n*图 1-2：只有足够的 ASCII\
  \ 画牛才能实现黑客攻击。*\n\n5. 在 Metasploit 命令行中对目标网站运行 `wmap` 工具，看看你能发现哪些漏洞。输出应该像图 1-3 所示的样。`wmap`\
  \ 工具将扫描 URL 列表以测试 Web 服务器是否存在安全缺陷。请确保你只在你自己的网站上运行该工具！\n\n![image](img/01fig03.jpg)\n\
  \n*图 1-3：黑客攻击中——预计执法部门即将上门。*\n\n6. 在 Metasploit 数据库中选择一个允许你利用该漏洞的 `exploit`。\n\n\
  \n\n\n\n到这里，我们将停止黑客教程，因为下一步可能构成刑事犯罪。然而，核心观点已经显而易见：开始攻击网站其实非常简单！Metasploit 和 Kali\
  \ Linux 被现实世界中的黑客使用，并且可以在几分钟内完成配置。使用它们不需要任何特殊的知识，但它们识别和利用网站漏洞方面表现得惊人地出色。\n\n这就是我们今天作为\
  \ Web 开发人员所面对的现实。我们构建的网站对任何连接互联网的人都是开放的，针对这些网站的黑客工具也是如此。不过，不要恐慌！在本书结束时，你（希望）将像黑客自己一样了解安全方面的知识，并为他们攻击你的网站做好充分准备。那么，让我们从讨论互联网协议栈的构建模块开始吧。\n\
  \n# 第一部分\n\n## 基础知识\n\n# 2\n\n## 互联网是如何工作的\n\n![image](img/common01.jpg)\n\n要成为网络安全专家，你需要牢牢掌握互联网的底层\
  \ Web 技术和协议。本章将介绍互联网协议栈，它规定了计算机如何在网络上交换数据。你还将学习有状态连接和加密，这些都是现代 Web 的关键元素。我将在过程中重点介绍安全漏洞容易出现的地方。\n\
  \n### 互联网协议栈\n\n在互联网早期，数据交换并不可靠。第一条通过互联网的前身——`高级研究计划网络 (ARPANET)` 发送的消息是发往斯坦福大学的一台远程计算机的\
  \ `LOGIN`（登录）命令。该网络只发送了前两个字母 `LO`，然后就崩溃了。这对于美国军来说是一个问题，因为他们正在寻找一种连接远程计算机的方法，以便在苏联核打击导致网络某些部分离线时，能够继续交换信息。\n\
  \n为了解决这个问题，网络工程师开发了`传输控制协议 (TCP)`，以确保计算机之间可靠的可靠交换。`TCP` 是约 20 种网络协议之一，统称为`互联网协议栈`。当计算机通过\
  \ `TCP` 向另一台机器发送消息时，该消息被拆分成数据包，并带有目标地址向其最终目的地发送。构成互联网的计算机将每个数据包推向目的地，而无需处理整个消息。\n\
  \n一旦接收端计算机收到数据包，它将根据每个数据包上的`序列号 (sequence number)` 将它们重新组装成可用的顺序。每当接收端收到数据包时，它都会发送一个回执。如果接收端未能确认收到数据包，发送端将重新发送该数据包，可能通过不同的网络路径。通过这种方式，`TCP`\
  \ 允许计算机在预期不可靠的网络上交付数据。\n\n随着互联网的增长，`TCP` 经历了重大的改进。现在发送数据包时带有`校验和 (checksum)`，允许接收者检测数据损坏并确定数据包是否需要重发。发送者还会根据数据消耗的速度预先调整发送速率。（互联网服务器的性能通常比接收消息的客户端强大数量级，因此它们需要小心不要超过客户端的容量。）\n\
  \n**注意**\n\n由于其提供了交付保证，`TCP` 仍然是最常用的协议，但现在互联网上也使用了其他几种协议。例如，`用户数据报协议 (UDP)` 是一种较新的协议，它故意允许数据包丢失，以便数据以恒定速率流传输。`UDP`\
  \ 通常用于直播视频流，因为当网络拥塞时，消费者宁愿丢失几帧，也不愿看到视频画面延迟。\n\n### IP 协议地址\n\n互联网上的数据包被发送到`IP 协议\
  \ (IP)地址`，这是分配给每个连接互联网的计算机的数字。每个`IP 地址`都必须是唯一的，因此新的 IP 地址是以结构化的方式颁发的。\n\n在最高层，`全球域名与数字分配机构\
  \ (ICANN)` 向区域机构分配 IP 地址块。这些区域机构随后将地址块授予其区域内的`互联网服务提供商 (ISP)` 和托管公司。当你将浏览器连接到互联网时，你的\
  \ `ISP` 会为你的计算机分配一个 `IP 地址`，该地址会固定几个月。（`ISP` 倾向于定期为客户端更换 IP 地址。）同样，在互联网上托管内容的公司会为其连接到网络的每台服务器分配一个\
  \ IP 地址。\n\n`IP 地址`是二进制数字，通常以`IP 版本 4 (IPv4)` 语法编写，它支持 `2³²` (4,294,967,296) 个地址。例如，Google\
  \ 的域名服务器地址为 `8.8.8.8`。由于 `IPv4 地址`的消耗速度不可持续，互联网正在转向`IP 版本 6 (IPv6)` 地址，以允许更多连接设备，其表示为由冒号分隔的八组四十六进制数字（例如：`2001:0db8:0000:0042:0000:8a2e:0370:7334`）。\n\
  \n### 域名系统\n\n浏览器和其他连接互联网的软件可以识别并将流量路由到 IP 地址，但 IP 地址对人类来说不易记忆。为了让网站地址对用户更友好，我们使用名为`域名系统\
  \ (DNS)`的全局目录，将人类可读的`域名`（如 `[example.com](http://example.com)`）转换为类似于 `93.184.216.119`\
  \ 的 IP 地址。域名仅仅是 IP 地址的占位符。域名和 IP 地址一样是唯一的，在使用前必须向`域名注册商`的私人组织进行注册。\n\n当浏览器第一次遇到域名时，它们使用本地`域名服务器`（通常由\
  \ `ISP` 托管）进行查找，然后缓存结果以防止将来进行耗时的查找。这种缓存行为意味着新域名或现有域名的更改在互联网上的传播需要一段时间。这种传播持续的确切时间由`存活时间\
  \ (TTL)` 变量控制，该变量设置在 DNS 记录上，并指示 DNS 缓存何时过期该记录。DNS 缓存允许一种被称为`DNS 投毒`的攻击，本地 DNS 缓存被故意损坏，导致数据被路由到攻击者控制的服务器。\n\
  \n为为特定域名返回 IP 地址外，域名服务器还托管了记录，可以通过`规范名称 (CNAME) 记录`描述域名别名，这允许多个域名指向同一个 IP 地址。DNS\
  \ 还可以通过使用`邮件交换 (MX)` 记录来帮助路由电子邮件。我们将在第 16 章检查 DNS 记录如何帮助对抗请求的邮件（垃圾邮件）。\n\n### 应用层协议\n\
  \n`TCP 允许两台计算机在互联网上可靠地交换数据，但它并没有规定发送的数据应该如何解释。为了实现这一点，两台计算机都需要同意通过协议栈中的另一个更高层协议交换信息。构建在\
  \ `TCP`（或 `UDP`）之上的协议被称为`应用层协议`。图 2-1 展示了应用层协议在互联网协议栈中位于 `TCP` 之上。\n\n\n\n\n\n互联网协议族中的低层协议提供了跨网络的基础数据路由功能，而应用层的高层协议则为应用程序交换数据提供了更丰富的结构支持。许多类型的应用程序使用\
  \ `TCP` 作为互联网上的传输机制。例如，电子邮件使用简单邮件传输协议（`SMTP`）发送，即时消息软件通常使用扩展消息和存在性协议（`XMPP`），文件服务器通过文件传输协议（`FTP`）提供下载，而\
  \ Web 服务器则使用超文本传输协议（`HTTP`）。由于 Web 是我们的主要关注点，让我们详细查看 `HTTP`。\n\n![image](img/02fig01.jpg)\n\
  \n*图 2-1：构成互联网协议族的各种层级*\n\n## 超文本传输协议\n\nWeb 服务器使用 `HyperText Transfer Protocol\
  \ (HTTP)` 将网页及其资源传输给诸如 Web 浏览器等 `user agents`（用户代理）。在一次 `HTTP` 会话中，用户代理为特定资源生成 `requests`（请求）。Web\
  \ 服务器接收这些请求，并返回 `responses`（响应），其中包含所请求的资源，或者在请求无法实现时返回错误代码。`HTTP` 请求和响应都是明文消息，尽管它们通常以压缩和加密的形式发送。本书中描述的所有漏洞都以某种方式使用了\
  \ `HTTP`，因此详细了解构成 `HTTP` 会话的请求和响应其工作原理是非常值得的。\n\n### HTTP 请求\n\n浏览器发送的 `HTTP` 请求由以下元素组成：\n\
  \n**Method（方法）**：也称为 `verb`（动词），描述了用户代理希望服务器执行的操作。\n\n**Universal resource locator\
  \ (URL，通用资源定位符）**：描述了正在操作或获取的资源。\n\n**Headers（头部）**：这些提供了元数据，例如用户代理期望的内容类型，或它是否接受压缩响应。\n\
  \n**Body（正文）**：这是一个可选组件，包含需要发送到服务器的额外数据。\n\nListing 2-1 显示了一个 `HTTP` 请求。\n\n```\n\
  GET❶ http://example.com/❷\n❸ User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X\
  \ 10_13_6)\n   AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396.99 Safari/537.36\n\
  ❹ Accept: text/html,application/xhtml+xml,application/xml; */*\n   Accept-Encoding:\
  \ gzip, deflate\n   Accept-Language: en-GB,en-US;q=0.9,en;q=0.8\n```\n\n*列表 2-1：一个简单的\
  \ HTTP 请求*\n\n方法 ❶ 和 URL ❷ 出现在第一行。随后是分行列出的 `HTTP` 头部。`User-Agent` 头部 ❸ 告诉网站发起请求的浏览器类型。`Accept`\
  \ 头部 ❹ 告诉网站浏览器期望的内容类型。\n\n使用 `GET` 方法的请求（简称为 `GET` 请求）是互联网上最常见的请求类型。`GET` 请求根据特定的\
  \ `URL` 从 Web 服务器上获取特定资源。对 `GET` 请求的响应将包含一个资源：可能是一个网页、图像，甚至是搜索请求的结果。Listing 2-1\
  \ 中的示例请求代表了加载 `[example.com](http://example.com)` 首页的尝试，并在当用户在浏览器的导航栏中输入 `[example.com](http://example.com)`\
  \ 时生成。\n\n如果浏览器需要向服务器发送信息而不仅仅是获取数据，它通常使用 `POST` 请求。当你在网页上填写表单并提交它时，浏览器会发送 `POST`\
  \ 请求。由于 `POST` 请求包含了发送到服务器的信息，浏览器会发送这些信息。\n\n如果浏览器需要向服务器发送信息而不是仅仅获取数据，它通常使用 `POST`\
  \ 请求。在第 8 章](#ch02.xhtml_ch08) 中，你会看到 `POST` 请求包含了发送到服务器的信息。`HTTP` 请求还可以遇到 `PUT`、`PATCH`\
  \ 和 `DELETE` 方法。\n\n**表 2-1：已知的 HTTP 方法**\n\n| HTTP 方法 | 功能 |\n| :--- | :--- |\n\
  | `HEAD` | `HEAD` 请求检索 `GET` 请求相同的信息，但指示服务器返回响应时不要包含正文。 |\n| `CONNECT` | `CONNECT`\
  \ 发起双向通信，通过代理连接。 |\n| `OPTIONS` | `OPTIONS` 请求允许用户代理询问服务器支持哪些方法。 |\n| `TRACE` |\
  \ `TRACE` 请求的响应将包含原始 `HTTP` 请求的副本，以便客户端查看是否发生了任何更改。 |\n\n### HTTP 响应\n\n由服务器返回的\
  \ `HTTP` 响应以协议描述、三位数的 `status code` 以及指示请求是否可以实现的 `status message` 开头。响应还包含了指示浏览器如何处理内容的头部。最后，大多数响应包含一个正文。Listing\
  \ 2-2 显示了 `HTTP` 响应的内容。\n\n```\nHTTP/1.1 200 OK\nContent-Encoding: gzip\nAccept-Ranges:\
  \ bytes\nCache-Control: max-age=60480\nContent-Type: text/html\nContent-Length:\
  \ 606\n<!doctype html>\n<html>\n<head>\n  <title>Example Domain</title>\n  <style\
  \ type=\"text/css\">\n    body {\n      font-family: \"Open Sans\", \"Helvetica\
  \ Neue\", sans-serif;\n      background-color: #f0ff0;\n      width: 600px;\n  \
  \    padding: 50px;\n      background-color: #fff;\n      border-radius: 1em;\n\
  \    }\n  </style>\n</head>\n<body>\n  <div>\n    <h1>Example Domain</h1>\n    <p>该域名的建立是为了用于说明性示例。</p>\n\
  \    <p>\n      <a href=\"http://www.iana.org/domains/example\">更多信息...</a>\n  \
  \  </p>\n  </div>\n</body>\n</html>\n```\n\n*列表 2-2：来自 [example.com](http://example.com)\
  \ 的 HTTP 响应，世界上最无趣的网站*\n\n\n\n\n\n接下来是 HTTP 头部 ❹。几乎所有的 HTTP 响应都包含一个 `Content-Type`\
  \ 头部，用于指示返回的数据类型。GET 请求的响应通常还包含一个 `Cache-Control` 头部，用于指示客户端应本地缓存大型资源（例如图像）。\n\n\
  如果 HTTP 响应成功，正文将包含客户端尝试访问的资源——通常是描述请求的页面结构的`超文本标记语言 (HTML)` ❺。在这种情况下，响应包含了样式信息 ❻\
  \ 以及页面内容本身 ❼。其他类型的响应可能在正文中返回 JavaScript 代码、用于样式化 HTML 的级联样式表 (CSS) 或二进制数据。\n\n###\
  \ 有状态的连接 (Stateful Connections)\n\nWeb 服务器通常同时处理许多用户代理，但 HTTP 并没有做任何工作来区分哪些请求来自哪个用户代理。在互联网的早期这并不是一个重要的考虑因素，因为网页在很大程度上是只读的。然而，现代网站通常允许用户登录，并在他们访问和交互不同页面时跟踪其活动。为了实现这一点，HTTP\
  \ 会话需要是**有状态的**的。当客户端和服务器之间执行“握手”并持续往返发送数据，直到通信双方之一决定终止连接时，这种连接或会话就是`有状态的`。\n\n\
  当 Web 服务器想要跟踪它每个请求正在向哪个用户响应，从而实现有状态的 HTTP 会话时，它需要建立一种机制来跟踪用户代理发送的后续请求。跟踪会话最常见的方法是服务器在初始\
  \ HTTP 响应中返回一个 `Set-Cookie` 头部。这要求接收响应的用户代理存储一个 `cookie`，这是一个与特定 Web 域名相关的小段文本数据。然后，用户代理在向\
  \ Web 服务器发送的任何后续 HTTP 请求中通过 `Cookie` 头部返回相同的数据。如果实现正确，往返传输的 cookie 内容将唯一标识用户代理，从而建立\
  \ HTTP 会话。\n\ncookie 中包含的会话信息是黑客的肥手目标。如果攻击者偷取了另一个用户的 cookie，他们就可以在网站上冒充该用户。同样，如果攻击者成功说服网站接受伪造的\
  \ cookie，他们就可以冒充他们喜欢的任何用户。我们将在第 10 章中查看窃和伪造 cookie 的各种方法。\n\n### 加密 (Encryption)\n\
  \n当 Web 最初发明时，HTTP 请求和响应是以明文形式发送的，这意味着拦截数据包的任何人都可以读取；这种拦截被称为`中间人攻击 (man-in-the-middle\
  \ attack)`。由于私人通信和在线交易在现代 Web 上非常常见，Web 服务器和浏览器通过使用`加密`来保护用户免受此类攻击，加密是在传输过程中对消息内容进行编码，以躲避窥探之目光的方法。\n\
  \n为了确保通信安全，Web 服务器和浏览器使用`传输层安全协议 (TLS)` 发送请求和响应，这是一种同时提供隐私性和数据完整性的加密方法。TLS 确保被第三方拦截的数据包在没有相应加密密钥的情况下无法解密。它还确保任何篡改数据包的尝试都能被检测到，从而确保数据的完整性。\n\
  \n使用 TLS 进行的 HTTP 会话被称为`HTTP 安全传输协议 (HTTPS)`。HTTPS 要求客户端和服务器执行 `TLS 握手`，双方在其中约定一种加密方法（算法）并交换加密密钥。一旦握手完成，任何后续消息（包括请求和响应）对外部人员来说都是不透明的。\n\
  \n加密是一个复杂的课题，但是保护你的网站安全的关键。我们将在第 13 章中研究如何为你的网站启用加密。\n\n### 总结 (Summary)\n\n在本章中，你学习了互联网的底层结构。TCP\
  \ 允许每个具有 IP 地址的连接互联网的计算机之间进行可靠的通信。域名系统（DNS）为 IP 地址提供了人类可读的别名。HTTP 构建在 TCP 之上，从用户代理（如\
  \ Web 浏览器）向 Web 服务器发送 HTTP 请求，Web 服务器以 HTTP 响应作为回复。每个请求都发送到特定的 URL，你学习了各种类型的 HTTP\
  \ 方法。Web 服务器通过状态码进行响应，并返回 cookie 以建立有状态的连接。最后，加密（以 HTTPS 的形式存在）可用于保护用户代理与 Web 服务器之间的通信。\n\
  \n在下一章中，你将查看 Web 浏览器接收到 HTTP 响应时会发生什么——网页是如何渲染的，以及用户操作如何产生更多的 HTTP 请求。\n\n# 3: 浏览器是如何工作的\n\
  \n![image](img/common01.jpg)\n\n大多数互联网用户通过浏览器与网站进行交互。为了构建安全的网站，你需要理解浏览器如何将描述网页的`超文本标记语言\
  \ (HTML)` 转换为你在屏幕上看到的交互式视觉表示。本章涵盖了现代浏览器如何渲染网页，并突出了它为保护用户而采取的安全措施——`浏览器安全模型`。我们还将查看黑客尝试克服这些安全措施的各种方法。\n\
  \n### 网页渲染 (Web Page Rendering)\n\nWeb 浏览器内部负责将网页 HTML 转换为你在屏幕上看到的视觉表示的软件组件被称为`渲染流水\
  \ (rendering pipeline)`。渲染流水负责解析页面 HTML、理解文档的结构和内容，并转换为操作系统可以理解的一系列绘制操作。\n\n对于互联网早期的网站，这个过程相对简单。网页\
  \ HTML 包含极少的样式信息（如颜色、字体和字体大小），因此渲染主要是加载文本和图像并按照它们在 HTML 文档中出现的顺序将其绘制到屏幕上。HTML 被设想为一种`标记语言`，意味着它通过将网页拆分为语义元素并标注信息的结构方式来描述网页。早期的\
  \ Web 看起来很原始，但对于传输文本内容非常高效。\n\n如今，网页设计更加复杂且具有吸引力。Web 开发者将样式信息编码到独立的级联样式表 (CSS)文件中，这些文件指示浏览器如何显示每个页面元素。像\
  \ Google Chrome 这样现代的高度优化的浏览器包含数百万行代码，以正确解释和渲染 HTML 并以快速、统一的方式处理冲突的样式规则。理解渲染流水线的各个阶段将有助于理解这种复杂性。\n\
  \n### 渲染流水概述 (Rendering Pipeline: An Overview)\n\n稍后我们将详细介绍渲染流水线的每个阶段，但让我们看看整体流程。\n\
  \n当浏览器接收到 HTTP 响应时，它将响应体中的 HTML 解析为`文档对象模型 (DOM)`：一种表示浏览器对页面结构理解的内存数据结构。生成 DOM 是解析\
  \ HTML 和将其绘制到屏幕之间的中间步骤。\n\n\n\n\n\n一旦浏览器生成了 `DOM`，在任何内容绘制到屏幕之前，必须对每个 DOM 元素应用样式规则。这些样式规则规定了每个页面元素如何绘制——前景颜色和背景颜色、字体样式和大小、位置和对齐方式等。最后，在浏览器确定了页面结构并分解了如何应用样式信息后，它就会在屏幕上绘制网页。这一切都在几分之一秒内完成，并在用户与页面交互时循环进行。\n\
  \n浏览器在构建 `DOM` 的同时，还会加载并执行它遇到的任何 JavaScript。JavaScript 代码可以在页面渲染之前或在响应用户操作时，动态地更改\
  \ `DOM` 和样式规则。\n\n现在，让我们更详细地查看每一个步骤。\n\n### 文档对象模型\n\n当浏览器首次接收到包含 HTML 的 HTTP 响应时，它会将\
  \ HTML 文档解析为一个 `DOM`，这是一种数据结构，将 HTML 文档描述为一系列被称为 `DOM nodes`（DOM 节点）的嵌套元素。`DOM`\
  \ 中的某些节点对应于要在屏幕上渲染的元素，例如输入框和文本段落；另一些节点（如 `script` 和样式元素）则控制页面的行为和布局。\n\n每个 `DOM\
  \ node` 大约等于原始 HTML 文档中的一个标签。`DOM nodes` 可以包含文本内容，也可以包含其他 `DOM nodes`，类似于 HTML 标签相互嵌套的方式。由于每个节点都可以以分支的形式包含其他节点，因此\
  \ Web 开发人员称为 `DOM tree`（DOM 树）。\n\n某些 HTML 标签，如 `<script>`、`<style>`、`<image>`、`<font>`\
  \ 和 `<video>`可以在属性中引用外部 URL。当它们被解析到 `DOM` 时，这些标签会导致浏览器导入外部资源，这意味着浏览器必须发起进一步的 HTTP\
  \ 请求。现代浏览器与页面渲染并行执行这些请求，以缩短页面加载时间。\n\n从 HTML 构建 `DOM` 的设计尽可能健壮。浏览器对格式不规范的 HTML 是宽容的；它们会根据需要关闭未闭合的标签、插入缺失的标签，并忽略损坏的标签。浏览器厂商不会因为网站的错误而惩罚网络用户。\n\
  \n### 样式信息\n\n一旦浏览器构建了 `DOM tree`，它就需要确定哪些 `DOM nodes` 对应于屏幕元素、这些元素之间应该如何布局，以及对它们应用什么样的样式信息。虽然这些样式规则可以内联在\
  \ HTML 文档中，但 Web 开发人员更倾向于将样式信息编码在单独 CSS 文件中。样式信息与 HTML 内容分离使得对现有内容进行重新建模更容易，并保持\
  \ HTML 内容尽可能清洁且具有语义化。它还让屏幕阅读器等替代浏览技术更容易解析 HTML。\n\n使用 CSS 时，Web 开发人员将创建一个或多个 `stylesheets`（样式表）来声明页面上的元素应该如何渲染。HTML\
  \ 文档将通过 `<style>` 标签引用托管样式表的外部 URL 来导入这些样式表。每个样式表包含 `selectors`（选择器），它们选取 HTML 文档中的标签并为每个标签分配样式信息，如字体大小、颜色和位置。选择器可能是简单的：例如，它们可能会规定\
  \ `<h1>` 标签中的标题文本应该渲染为蓝色。对于更复杂的网页，选择器会变得复杂：一个选择器可能会描述当用户鼠标移动到超链接上时，链接更改颜色的速度。\n\n\
  渲染流水线实现了大量的逻辑来解析最终样式，因为关于如何应用样式需要遵循严格的优先级规则。每个选择器可以应用于多个页面元素，而每个页面元素通常会有由多个选择器提供的样式信息。早期互联网的成长痛点之一是研究如何创建一个在不同类型的浏览器渲染时看起来相同的网站。现代浏览器在渲染网页的方式上通常是一致的，但仍然存在差异。行业遵循\
  \ Web 标准的基准是 `Acid3` 测试，如图 3-1\n\n图 3-1：Acid3，确保浏览器自 2008 年以来能够正确渲染彩色矩形\n\n`DOM\
  \ tree` 的构建和样式规则的应用与网页中包含的任何 JavaScript 代码的处理并行进行。这些 JavaScript 代码可以在页面渲染之前更改页面的结构和布局，因此让我们快速查看\
  \ JavaScript 的执行如何与渲染流水线衔接。\n\n### JavaScript\n\n现代网页使用 JavaScript 来响应用户操作。`JavaScript`\
  \ 是一种功能编程语言，在网页渲染时由浏览器的 JavaScript 引擎执行。可以通过 `<script>` 标签将 JavaScript 引入 HTML 文档；代码可以内联在\
  \ HTML 文档中，或者更常见的是，`<script>` 标签将引用一个从外部 URL 加载的 JavaScript 文件。\n\n默认情况下，任何 JavaScript\
  \ 代码在相关的 `<script>` 标签被解析为 `DOM node` 时就会由浏览器立即执行。对于从外部 URL 加载的 JavaScript 代码，这意味着代码一旦加载就会执行。\n\
  \n如果渲染流水线尚未完成 HTML 文档的解析，这种默认行为就会导致问题；JavaScript 代码将尝试与可能尚未于 `DOM` 中的页面元素交互。为了允许这一点，`<script>`\
  \ 标签通常会标记有 `defer` 属性。这会导致 JavaScript 只在整个 `DOM` 构建完成后才执行。\n\n正如你所想象的，浏览器急于执行它们遇到的任何\
  \ JavaScript 代码这一事实具有安全影响。黑客的最终目标通常是在用户的机器上远程执行代码，而互联网使得这一目标变得更容易，因为很少有计算机不以某种方式连接网络。由于由于，现代浏览器通过\
  \ `browser security model`（浏览器安全模型）严格限制 JavaScript。该模型规定 JavaScript 代码必须在 `sandbox`（沙箱）中执行，在沙箱内不允许执行以下操作：\n\
  \n*   启动新进程或访问其他现有进程。\n*   读取任意系统内存。作为一种托管内存语言，JavaScript 无法读取沙箱之外的内存。\n*   访问本地磁盘。现代浏览器允许网站在本地存储少量数据，但这种存储与文件系统本身抽象。\n\
  *   访问操作系统的网络层。\n*   调用操作系统函数。\n\n在浏览器沙箱中执行的 JavaScript *允许* 执行以下操作：\n\n*   读取和操作当前网页的\
  \ `DOM`。\n*   通过注册事件监听器并响应当前页面上的用户操作。\n*   代表用户发起 HTTP 调用。\n*   打开新网页或刷新当前页面 URL，但仅响应用户操作。\n\
  *   向浏览器历史记录写入新条目并在历史记录中后退。\n*   请求用户位置。例如，“Google Maps 想要使用您的位置”。\n*   请求发送桌面通知的权限。\n\
  \n\n\n\n\n即使有这些限制，能够向你的网页中注入恶意 JavaScript 的攻击者仍然可以通过跨站脚本攻击在用户输入时读取信用卡详情或凭据，从而造成巨大伤害。即使是少量的注入\
  \ JavaScript 也会构成威胁，因为注入的代码可以在 DOM 中添加 `<script>` 标签来加载恶意载荷。我们将在第 7 章中介绍如何防止这类跨站脚本攻击。\n\
  \n## 渲染之前和之后：浏览器做的其他事情\n\n浏览器不仅仅是一个渲染流水线和一个 JavaScript 引擎。除了渲染 HTML 和执行 JavaScript\
  \ 之外，现代浏览器包含了许多其他职责的逻辑。浏览器与操作系统连接，以解析并缓存 DNS 地址、解释并验证安全证书、在需要时对 HTTPS 请求进行编码，并根据\
  \ Web 服务器的指令存储和传输 cookie。为了理解这些职责是如何协作工作的，让我们从后台看看用户登录 Amazon 的过程：\n\n1. 用户在他们喜爱的浏览器中访问\
  \ `[www.amazon.com](http://www.amazon.com)`。\n2. 浏览器尝试将域名 `[amazon.com](http://amazon.com)`\
  \ 解析为 IP 地址。首先，浏览器查询操作系统的 DNS 缓存。如果没有找到结果，它会请求互联网服务提供商（ISP）在其 DNS 缓存中查找。在 ISP 中没有人访问过\
  \ Amazon 网站的极少数情况下，ISP 将在权威 DNS 服务器上解析域名。\n3. 现在已经解析了 IP 地址，浏览器尝试与该 IP 地址对应的服务器发起\
  \ TCP 握手，以建立安全连接。\n4. 一旦建立 TCP 会话，浏览器就会指向 `[www.amazon.com](http://www.amazon.com)`\
  \ 的 HTTP GET 请求。TCP 将 HTTP 请求拆分为数据包并发送到服务器进行重组。\n5. 此时，HTTP 会话升级为 HTTPS 以确保通信安全。浏览器和服务器进行\
  \ TLS 握手，约定加密算法，并交换加密密钥。\n6. 服务器使用安全通道回传包含 Amazon 首页 HTML 的 HTTP 响应。浏览器解析并显示该页面，通常会触发许多其他\
  \ HTTP GET 请求。\n7. 用户导航到登录页面，输入登录凭据并提交登录表单，这会向服务器生成一个 POST 请求。\n8. 服务器验证登录凭据，并通过在响应中返回\
  \ `Set-Cookie` 头来建立会话。浏览器在规定时间内存储该 cookie，并在后续向 Amazon 的请求中将其发送回。\n\n在完成这一切之后，用户就可以访问他们的\
  \ Amazon 账户。\n\n### 总结\n\n本章回顾了浏览器如何将用于描述网页的 HTML 转换为你在屏幕上看到的交互式视觉表示。浏览器的渲染流水线将\
  \ HTML 文档解析为文档对象模型（DOM），应用来自层级样式表（CSS）文件的样式信息，然后在屏幕上布局 DOM 节点。\n\n你还学习了浏览器安全模型。浏览器在严格的安全规则下执行\
  \ `<script>` 标签包含的 JavaScript。你还回顾了一个简单的 HTTP 会话，说明了浏览器在渲染页面之外的许多其他职责：从 TCP 数据包重构\
  \ HTTP、验证安全证书并使用 HTTPS 保护通信，以及存储和传输 cookie。\n\n在下一章中，你将查看 HTTP 会话的另一端：Web 服务器。\n\
  \n# 4 Web 服务器是如何运作的\n\n![image](img/common01.jpg)\n\n在上一章中，你学习了浏览器如何在互联网上通信，并渲染构成网站的\
  \ HTML 页面和其他资源。在这一章中，你将学习 Web 服务器是如何构建这些相同的 HTML 页面的。\n\n从最简单的定义来说，*Web 服务器*是一个响应\
  \ HTTP 请求返回 HTML 页面的计算机程序。然而，现代 Web 服务器包含的功能比这暗示的要广泛得多。当浏览器发出 HTTP 请求时，现代 Web 服务器允许执行代码以动态生成网页\
  \ HTML，并且通常包含来自数据库的内容。作为一名 Web 开发者，你将花费大部分时间来编写和测试此类代码。\n\n本章涵盖了开发者如何在 Web 服务器内部组织代码和资源。我还将指出\
  \ Web 服务器中导致安全漏洞发生的常见弱点，并讨论如何避免这些陷阱。\n\n## 静态资源和动态资源\n\nWeb 服务器响应 HTTP 请求提供两种内容：静态资源和动态资源。*静态资源*是\
  \ HTML 文件、图像文件或其他类型的文件，Web 服务器在 HTTP 响应中按原样返回这些文件。*动态资源*是 Web 服务器在响应 HTTP 请求时执行或解释的代码、脚本或模板。现代\
  \ Web 服务器能够同时托管静态和动态资源。服务器执行或返回哪种资源取决于 HTTP 请求中的 URL。你的 Web 服务器将根据配置文件解析 URL，该文件将\
  \ URL 模式映射到特定资源。\n\n让我们看看 Web 服务器如何处理静态和动态资源。\n\n## 静态资源\n\n在互联网的早期，网站主要由静态资源组成。开发者手动编写\
  \ HTML 文件，网站由部署到 Web 服务器的各个独立 HTML 文件组成。网站的“部署”需要开发者将所有 HTML 文件复制到 Web 服务器并重启服务器进程。当用户想要访问网站时，他们会在浏览器中输入网站的\
  \ URL。浏览器会向托管该网站的 Web 服务器发送 HTTP 请求，服务器将把传入的 URL 解析为对磁盘上文件的请求。最后，Web 服务器将在 HTTP\
  \ 响应中原样返回 HTML 文件。\n\n这方面的例子是 1996 年电影《太空火鼠大战》（*Space Jam*）的网站。它完全由静态资源组成，并且在 `[spacejam.com](http://spacejam.com)`\
  \ 在线。点击该网站带我们回了网页开发的一个更简单、审美更不复杂的时代。如果你访问该网站，你会发现每个 `[`www.spacejam.com/cmp/sitemap.html`](https://www.spacejam.com/cmp/sitemap.html)`\
  \ 的 URL 都以 `.html` 后缀结尾，这意味着每个网页对应服务器上的一个 HTML 文件。\n\n蒂姆·伯纳斯利对 Web 的原始愿景非常像《太空火鼠大战》网站：一个托管在\
  \ Web 服务器上的静态文件网络，包含世界上所有的信息。\n\n### 解析\n\n现代 Web 服务器处理静态资源的方式与旧旧版本非常相似。在浏览器中访问资源时，你会在\
  \ URL 中包含资源名称，Web 服务器会根据请求从磁盘返回该资源文件。为了显示图 4-1 所示的图片，URL 包含资源名称 `/images/hedgehog_in_spaghetti.png`，Web\
  \ 服务器从磁盘返回相应的文件。\n\n![image](img/04fig01.jpg)\n\n*图 4-1：静态资源的示例*\n\n\n\n\n最初的动态资源是简单的脚本文件（通常用\
  \ `Perl` 语言编写），Web 服务器在用户访问特定 URL 时执行它们。这些脚本文件会生成构成页面的 HTML。以这种方式编写动态资源的代码通常并不直直观。如果一个网页是由静态资源组成的，你可以通过查看静态\
  \ HTML 文件来了解其组织结构，但对于拥有数千行 `Perl` 代码的动态资源，很难做到这一点。本质上，你在用一种语言（`Perl`）输出另一种语言（`HTML`）的内容，而最终由浏览器进行渲染。在修改\
  \ `Perl` 代码时，脑中还要记住最终的渲染输出样式是一项困难的任务。\n\n为了解决这个问题，Web 开发者通常使用模板文件来构建动态网页。*模板*大部分是\
  \ HTML，但其中穿插了程序逻辑，这些逻辑包含了对服务器的指令。这种逻辑通常非常简单，通常只做三件事：从数据库或 HTTP 请求中提取数据并将其插到 HTML\
  \ 中、条件性渲染 HTML 模板的某些，或者遍历数据结构（例如项目列表）以重复渲染 HTML 块。所有现代 Web 框架都使用模板文件（语法有所不同），因为在\
  \ HTML 中插入代码片段通常会让代码更整洁、更易读。\n\n\n\n\n当 Web 服务器执行动态资源中的代码时，它通常会从数据库加载数据。如果你访问一个零售网站，Web\
  \ 服务器会在数据库中查找产品 ID，并使用存储在数据库中的产品信息来构建页面。如果你登录一个社交媒体网站，Web 服务器会从底层数据库加载你的时间线和通知，以便写入\
  \ HTML。事实上，绝大多数现代网站都使用数据库来存储用户信息，而 Web 服务器与数据库之间的接口是黑客频繁攻击的目标。\n\n数据库技术出现得早于互联网的发明。随着\
  \ 20 世纪 60 年代计算机的日益普及，公司开始看到数字化和集中化记录管理的价值，以便使搜索和维护变得更容易。随着互联网的诞生，对于寻求扩展到在线零售的公司来说，在产品库存数据库之上加一个\
  \ Web 前端是一个自然而演进的过程。\n\n数据库对于身份验证也至关重要。如果一个网站想要识别返回用户，它需要记录谁注册了网站，并在他们返回时，根据存储的凭据验证（或\
  \ `authenticate`，即身份验证）他们的登录信息。\n\n最常用的两种类型数据库是 SQL 和 NoSQL。让我们来了解这两者。\n\n### SQL\
  \ 数据库\n\n今天最常用的数据库是关系型数据库，它们实现了`结构化查询语言 (SQL)`，这是一种用于维护和提取数据的声明式编程语言。\n\n**注意**\n\
  \n`SQL` 可以读作“ess-qew-ell”或“sequel”，尽管你也可以尝试读作“squeal”，如果你想看到你的数据库管理员感到局促不安的话。\n\n\
  SQL 数据库是`关系型 rel 的`，这意味着它们将数据存储在一个或多个`表（tables）`中，这些表之间通过正式规定的方式相互关联。你可以将表格比作 Microsoft\
  \ Excel 表格，它有行和列，每行代表一个数据项，每列代表每个项的一个数据点。SQL 数据库中的列具有预定义的数据类型，通常是文本字符串（通常是固定长度）、数字或日期。\n\
  \n关系型数据库中的数据表通过`键（keys）` 相互关联。通常，表中的每行都有一个唯一的数字`主键（primary key）`，表可以通过`外键（foreign\
  \ keys）`引用对方的行。例如，如果你将用户订单存储为数据库记录，`orders` 表将有一个名为 `user_id` 的外键列，代表下订单的用户。与其直接在\
  \ `orders` 表中存储用户信息，此 `user_id` 列将包含外键值，引用 `users` 表中特定行的主键（`id` 列）。这种关联关系确保了你不会在不存储用户的情况下在数据库中存储订单，并确保了每个用户只存在唯一的真理来源。\n\
  \n关系型数据库还具有`数据完整性约束（data integrity constraints）`，它可以防止数据损坏并允许对数据库进行统一查询。像外键一样，SQL\
  \ 中还可以定义其他类型的数据完整性约束。例如，你可以要求 `users` 表中的 `email_address` 列仅包含唯一值，以强制数据库中的每个用户都拥有不同的电子邮件地址。你还可以要求表中的值非空，以便数据库必须为每个用户指定一个电子邮件地址。\n\
  \nSQL 数据库还表现出事务性和一致性行为。数据库`事务（transaction）`是一组批量执行的 SQL 语句。如果每个事务都是“要么全成功，要么全失败”，则该数据库被认为是`事务性的`：也就是说，如果批处理中的任何\
  \ SQL 语句执行失败，整个事务就会失败，并保持数据库状态不变。SQL 数据库是`一致的`，因为任何任何事务都会将数据库从一个有效状态带到另一个有效状态。在\
  \ SQL 数据库中插入无效数据的尝试都会导致整个事务失败，数据库保持原样。\n\n由于存储在 SQL 数据库中的数据通常高度敏感，黑客会针对数据库并在黑市出售其内容。黑客还经常利用构建不安全的\
  \ SQL 语句。我们将在第 6 章中探讨如何这样做。\n\n### NoSQL 数据库\n\nSQL 数据库通常是 Web 应用性能的瓶颈。如果访问网站的大多数\
  \ HTTP 请求都会产生数据库调用，数据库服务器将承受巨大的负载，并减慢所有用户的网站性能。\n\n这些性能考虑导致了 NoSQL 数据库的日益流行——NoSQL\
  \ 牺牲了传统 SQL 数据库的严格数据完整性要求，以获得更大的可扩展性。NoSQL 涵盖了存储和访问数据的多种方法，但其中已经出现了一些趋势。\n\nNoSQL\
  \ 数据库通常是`无模式（schemaless）`的，允许你向新记录添加字段，而无需升级任何数据结构。为了实现这种灵活性，数据通常以`键值对（key-value）`形式或`JavaScript\
  \ 对象表示法 (JSON)``存储。\n\nNoSQL 数据库技术也倾向于将大规模数据复制放在绝对一致性之上。SQL 数据库保证不同客户端程序的并发查询将看到相同的结果；NoSQL\
  \ 数据库通常放宽这一限制，只保证`最终一致性（eventual consistency）`。\n\nNoSQL 数据库使得存储非结构化或半结构化数据变得非常容易。提取和查询数据往往稍微复杂一些——某些数据库提供编程接口，而另一些则实现自己的查询语言，将类似\
  \ SQL 的语法适配到它们的数据结构中。NoSQL 数据库和 SQL 数据库一样容易受到注入攻击，尽管攻击者必须正确猜测数据库类型才能成功发起攻击。\n\n\
  ### 分布式缓存\n\n动态资源也可以从内存中的分布式`缓存（caches）`中加载数据，这是实现大型网站所需的巨大可扩展性的另一种流行方法。`缓存（Caching）`是指将存储在其他处的数据以易于检索的形式存储，以加速该数据的检索。诸如\
  \ `Redis` 或 `Memcached` 这样的`分布式缓存`使得数据缓存变得简单，并允许软件以语言无关的方式在不同服务器和进程之间共享数据结构。分布式缓存可以在\
  \ Web 服务器之间共享，使其非常适合存储那些原本需要从数据库检索的频繁访问的数据。\n\n\n\n\n\n`Ruby` 编程语言就像《龙珠 Z》和汤姆·塞勒克主演的电影《棒球王》一样，于\
  \ 20 世纪 90 年代中期在日本发明。与《龙珠》或汤姆·塞勒克不同，它在 `Ruby on Rails` 平台发布十年后才开始流行起来。\n\n`Ruby\
  \ on Rails` 整合了许多构建大型 Web 应用的最佳实践，并使其能够以最少的配置轻松实现。Rails 社区也非常重视安全。Rails 是最早包含防止跨站请求伪造攻击保护的\
  \ Web 服务器栈之一。尽管如此，Rails 的普及使其成为黑客的常见目标。近年来，已经发现了几个重大安全漏洞（并进行了匆忙补丁）。\n\n通常被描述为`微框架`（例如\
  \ `Sinatra`）的简单 Ruby Web 服务器在近年来已成为 Rails 的流行替代方案。微框架允许你组合执行特定功能的单个代码库，因此你的 Web\
  \ 服务器在尺寸上会刻意保持极简。这与 Rails 的“万事皆（包括厨房水槽）”部署模型形成对比。使用微框架的开发者通常通过使用 `RubyGems` 包管理器找到他们所需的额外功能。\n\
  \n## Python\n\n`Python` 语言发明于 20 世纪 80 年代后期。它简洁的语法、灵活的编程范式和丰富的模块使得该语言异常地流行。Python\
  \ 初学者通常会对空格和缩进具有语义意义感到惊讶，这在编程语言中是不寻常的。空格在 Python 社区如此重要，以至于他们会为了使用 Tab 键还是空格进行缩进而争论“圣战”。\n\
  \nPython 用于各种应用程序，通常是数据科学和科学计算项目的首选语言。Web 开发者有许多活跃维护的 Web 服务器可以选择（例如流行的 `Django`\
  \ 和 `Flask`）。Web 服务器的多样性也构成了一种安全特性，因为黑客不太可能针对特定的平台。\n\n## JavaScript and Node.js\n\
  \n`JavaScript` 最初是一种用于在浏览器内执行小型脚本的简单语言，但由于编写 Web 服务器代码而流行起来，并随着 `Node.js` 运行时迅速演进。`Node.js`\
  \ 运行在 `V8` JavaScript `引擎`之上，这是 Google Chrome 用来解释浏览器内 `JavaScript` 的相同软件组件。`JavaScript`\
  \ 仍然包含许多怪癖，但在客户端和服务器端使用同一种语言的前景使 Node 成为增长最快的 Web 开发平台。\n\nNode 最大的安全风险源于其快速增长——每天都会添加数百个模块。当你在\
  \ Node 应用中使用第三方代码时，需要格外小心。\n\n## PHP\n\n`PHP` 语言是根据一组用于在 Linux 上构建动态网站的 `C` 二进制文件开发的。`PHP`\
  \ 后来发展成为一种完善的编程语言，尽管该语言不受计划的演进在其无章的性质中显而易见。`PHP` 对许多内置函数的实现并不一致。例如，变量名对大小写敏感，但函数名不敏感。尽管有这些怪癖，`PHP`\
  \ 仍然很流行，曾一度，它支撑了网上 10% 的网站。\n\n如果你正在编写 `PHP`，你通常在维护一个遗留系统。由于旧的 `PHP` 框架表现出你能想象的最最糟糕的安全漏洞，你应该更新遗留的\
  \ `PHP` 系统以使用现代库。每种类型的漏洞，无论是命令执行、目录遍历还是缓冲区溢出，都让 `PHP` 程序员彻夜难眠。\n\n## Java\n\n`Java`\
  \ 和 `Java Virtual Machine (JVM)` 在企业领域被广泛使用和实现，允许你在多个操作系统上运行 `Java` 的编译字节码。当考虑性能时，它通常是一种很好的苦力型语言。\n\
  \n开发者将 `Java` 用于一切，无论是机器人技术、移动应用开发、大数据应用还是嵌入式设备。它作为 Web 开发语言的人气已经消减，但数百万行 `Java`\
  \ 代码仍然支撑着互联网。从安全的角度来看，`Java` 被其过去的流行所困扰；遗留应用程序包含运行旧版本语言和框架的 `Java` 代码。Java 开发者需要及时更新到安全版本，以免成为黑客的待宰品。\n\
  \n如果你是一个更具冒险精神的开发者，你会发现其他运行在 `JVM` 上并提供与 Java 庞大第三方库生态系统兼容性的流行语言。`Clojure` 是一种流行的\
  \ Lisp 方言；`Scala` 是一种具有静态类型的函数式语言；`Kotlin` 是一种较新的面向对象的语言，设计为与 `Java` 后兼容，同时让脚本变得更容易。\n\
  \n## C#\n\n`C#` 由微软作为 `.NET` 计划的一部分设计的。`C#`（以及其他 `.NET` 语言，如 `VB.NET`）使用名为 `Common\
  \ Language Runtime (CLR)` 的虚拟机。`C#` 与操作系统的抽象程度比 `Java` 低，你可以愉快地将 `C++` 代码与 `C#`\
  \ 混合使用。\n\n微软在后期转向了开源宣传，坦率地说，`C#` 的参考实现现在是开源的。`Mono` 项目允许 `.NET` 运行在 Linux 和其他操作系统上。尽管如此，大多数使用\
  \ `C#` 的公司部署在 Windows 服务器和典型的微软栈上。Windows 在安全方面有着令人不安的历史——例如，它是最常见的病毒目标平台——因此任何想要采用\
  \ `.NET` 作为平台的的人都需要意识到这些风险。\n\n## Client-Side JavaScript\n\n作为 Web 开发者，你有多种语言可以编写\
  \ Web 服务器代码。但当你的代码需要在浏览器中执行时，你只有一种选择：`JavaScript`。正如我之前提到的，`JavaScript` 作为服务器端语言的流行部分归功于\
  \ Web 开发者在编写客户端代码时对它的熟悉。\n\n浏览器中的 `JavaScript` 已经远远超过了 Web 早期用于简单表单验证逻辑和动画小组件。像\
  \ Facebook 这样复杂的网站使用 `JavaScript` 在用户与其交互时重绘页面区域——例如，当用户点击图标时渲染菜单，或当他们点击照片时打开对话框。当后台事件发生时，网站通常也会更新用户界面，例如在他人发表评论或发布新帖子时添加通知标记。\n\
  \n要在不刷新整个页面且不中断用户体验的情况下实现这种动态用户界面，需要客户端 `JavaScript` 在内存中管理大量状态。已经开发了几个框架来组织内存状态并高效地渲染页面。它们还允许在网站的各个页面上对\
  \ `JavaScript` 代码进行模块化复用，当你有有数百万行 `JavaScript` 需要管理时，这是一个关键的设计考量。\n\n其中一个 JavaScript\
  \ 框架是 `Angular`，它最初由 Google 以开源许可发布。`Angular` 借用了服务器端的范式，并使用客户端模板来渲染网页。`Angular`\
  \ 模板引擎（在页面加载时在浏览器中执行）会解析服务器提供的模板 HTML，并处理它们出现的任何指令。由于模板引擎只是在浏览器中执行的 `JavaScript`，它可以直接写入\
  \ `DOM` 并短路某些浏览器渲染流水线。随着内存状态的改变，`Angular` 会自动重新渲染 `DOM`。这种分离使得代码更简洁，Web 应用程序更易于维护。\n\
  \n\n\n\n\n由 Facebook 开发团队发布的开源框架 `React`，其方法与 Angular 略有不同。React 并不是在 HTML 模板中交替编写代码，而是鼓励开发者直接在\
  \ JavaScript 中编写类 HTML 标签。React 开发者通常会创建 `JavaScript XML (JSX)` 文件，并在将其发送到浏览器之前，通过预处理器对其进行处理并编译为\
  \ JavaScript。\n\n第一次编写像 `return <h1>Hello, {format(user)}</h1>` 这样的 JavaScript 代码，对于习惯于将\
  \ JavaScript 和 HTML 文件分离的开发者来说可能很奇怪，但通过将 HTML 变成 JavaScript 语法的一等元素，React 能够实现非常有用的功能（例如语法高亮和代码补全），而这些功能通常是难以实现的。\n\
  \n像 Angular 和 `React` 这样丰富的客户端 JavaScript 框架非常适合构建和维护复杂的网站。然而，直接操作 `DOM` 的 JavaScript\
  \ 代码容易受到一种新型安全漏洞的影响：基于 DOM 的跨站脚本攻击，我们将在第 7 章中详细讨论这一点。\n\n请注意，尽管 JavaScript 是浏览器通常执行的唯一语言，但并不意味着你必须用\
  \ JavaScript 编写所有的客户端代码。许多开发者使用如 `CoffeeScript` 或 `TypeScript` 等语言，这些语言在发送到浏览器之前会在构建过程中被编译（transpiled）为\
  \ JavaScript。这些语言在执行时面临与 JavaScript 相同的安全漏洞，因此在书中，我将大部分讨论限制在纯 JavaScript（plain old\
  \ JavaScript）。\n\n### 总结\n\nWeb 服务器响应 HTTP 请求提供两种类型的内容：静态资源（如图像）以及执行自定义代码的动态资源。\n\
  \n静态资源是可以直接从文件系统或内容分发网络提供的资源，以提高网站的响应速度。网站所有者通常在内容管理系统中编写完全由静态资源组成的网站，这允许非技术管理员直接在浏览器中对其进行编辑。\n\
  \n另一方面，动态资源是我们在经常以模板形式定义的资源，这些 HTML 中嵌入了程序化指令，用于由服务器进行解释。它们通常会从数据库或缓存中读取数据，以告知如何渲染页面。最常见的数据库形式是\
  \ `SQL` 数据库，它以表格形式存储数据，并对数据结构有严格的规定。较大的网站通常使用 `NoSQL` 数据库，这是一种较新的数据库类型，它放宽了传统 `SQL`\
  \ 数据库的一些限制，以实现更大的可扩展性。我们用 Web 编程语言编写动态资源，这种语言有很多。\n\n在下一章中，你将查看编写代码本身的过程。编写安全、无\
  \ bug 代码的关键在于严谨的开发流程；我将向你展示如何编写、测试、构建和部署你的代码。\n\n## 5. 程序员是如何工作的\n\n![image](img/common01.jpg)\n\
  \n构建和维护网站是一个迭代过程，而不是一个终极目标。Web 开发者很少在第一次构建网站时就完美实现每一个功能。（除非你是我的朋友 `Dave`；别再让我们其他人显得很差了，`Dave`）。在\
  \ Web 开发中，产品会不断演进，代码库变得越来越复杂，需要开发者添加功能、修复漏洞并重构代码。重新设计是理常情态。\n\n作为 Web 开发者，你需要以有序且严谨的方式对代码库进行更改并实施。由于在面对截止日期时采取捷径，安全漏洞和漏洞随着时间的推移而渗透是很常见的。大多数安全漏洞的引入并不是因为缺乏开发知识，而是因为对细节缺乏关注。\n\
  \n本章重点关注你`应该`如何编写安全代码，即遵循`软件开发生命周期 (SDLC)`，这是一个开发团队在设计新网站功能、编写代码、测试和发布更改时遵循的流程的华丽术语。混乱且杂乱的\
  \ `SDLC` 会导致无法追踪你正在运行的代码及其漏洞，这不可避免地会导致程序错误和不安全。然而，结构良好的 `SDLC` 允许你在过程中尽早发现 bug 和漏洞。\n\
  \n我们将遍历 `SDLC` 的五个阶段：设计与分析、编写代码、发布前测试、发布过程以及发布后测试。我们还将简要谈论依赖（dependencies），即我们在网站中使用的第三方软件。\n\
  \n### 阶段 1：设计与分析\n\n`SDLC` 并不是从编写代码开始的，而是从思考你应该编写什么开始的。我们将第一阶段称为设计与分析阶段：你分析需要添加的功能并设计其实现。在项目开始时，这可能包括勾勒设计草图。但在你的网站运行之前，你需要对更改进行更多的考虑，因为你不想破坏现有功能。\n\
  \n此阶段最重要的目标是识别代码试图解决的需求。一旦开发团队完成代码，每个人应该能够判断新代码是否正确地解决了这些需求。如果你是为客户编写代码，这个阶段意味着与利益相关者会面并让他们同意目标列表。对于公司或组织的内部开发，它主要意味着开发并记录你正在构建的内容的共享愿景。\n\
  \n### 阶段 2：编写代码\n\n一旦完成了设计和分析，你就可以进入 `SDLC` 的第二阶段：编写代码。你可以使用许多工具编写代码，但应始终将任何非一次脚本的代码保存在源码控制软件（也称为版本控制）中，这允许你存储代码库的备份、浏览代码库的历史版本、跟踪更改并对你做的代码更改进行注释。你可以通过将代码更改推送（push）到源码仓库（repository）与团队其他人共享更改，通常通过命令行工具或其他开发工具的插件，在发布到世界之前进行。将你的代码更改推送到中央存储库，其他团队成员就可以对其进行审查。\n\
  \n\n\n\n使用版本控制还允许你浏览当前运行在生产网站上的代码库版本，这对于诊断漏洞以及调查和解决发布后发现的安全问题至关重要。当开发团队识别并解决了一个安全问题时，他们应该检查引入漏洞的更改更改，并确认这些更改是否影响了网站的其他部分。\n\
  \n版本控制是所有开发团队都需要使用的首要工具（即使是只有一个人的开发团队也是如此！）。大型公司通常运行自己的版本控制服务器，而较小的公司和开源开发者通常使用第三方托管服务。\n\
  \n## 分布式与集中式版本控制\n\n目前存在多种版本控制软件，每种软件都有不同的语法和功能。在目前提供的工具中，最流行的是 `Git`，它是由 Linux\
  \ 创始人 Linus Torvalds 创建的，用于帮助组织 Linux 内核的开发。`Git` 是一个`分布式版本控制系统`，这意味着在 `Git` 下保留的每一份代码副本都是一个完整的仓库。当新开发人员第一次从团队仓库\
  \ `pulls`（下载）代码本地副本时，他们不仅获得了代码库的最新版本，还获得了代码库更改的完整历史。\n\n分布式版本控制工具跟踪开发者所做的更改，并在开发者推送代码时仅传输这些更改。这种版本控制模型与旧版软件不同，旧软件实现了一个`集中式`服务器，开发者从那里下载并向其上传整个文件。\n\
  \n`Git` 之所以流行，很大程度上归功于 `GitHub`，这个网站可以方便地设置在线 `Git` 仓库并邀请团队成员。用户可以在浏览器中查看存储在 `GitHub`\
  \ 中的代码，并可以使用 Markdown 语言对其进行记录。`GitHub` 还包含了自己的问题跟踪器和管理冲突代码更改的工具。\n\n## 代码的分支与合并\n\
  \n版本控制软件允许你精确控制每次更新网站时发布哪些代码更改。通常，代码发布是使用分支来管理的。一个 `branch`（分支）是代码库的逻辑副本，存储在版本控制服务器或开发者的本地仓库中。开发者可以对自己的分支进行本地更改，而不影响\
  \ `master` 代码库，并在完成正在处理的任何功能或错误修复后，将分支 `merge`（合并）回 `master` 代码库。\n\n**注意**\n\n\
  较大的开发团队可能会有更复杂的分支方案。版本控制软件允许你无限创建分支之分支之上的分支，因为分支是一项开廉的操作。一个大型团队可能有几名开发者为同一个功能分支做出贡献*用于复杂的代码更新。*\n\
  \n在发布之前，几位开发者可能会将不同的分支合并到 `master` 代码库中。如果他们对同一个文件进行了不同的编辑，版本控制软件会自动尝试合并这些更改。如果不同的更改无法自动合并，就会发生\
  \ `merge conflict`（合并冲突），这需要开发团队手动完成合并过程，逐行选择如何应用冲突的代码更改。解决合并冲突是开发人员的噩梦：当你认为自己已经完成了一个问题时，却还有额外的工作要做。而且通常这是因为\
  \ Dave 决定更改几千个 Python 文件的格式。（谢谢你，Dave。）\n\n合并时间是进行 `code reviews`（代码审查）的绝佳机会，在审查过程中，一个或多个团队成员会检查代码更改并提供反馈。发现潜在安全漏洞的一种极方法是遵循`四眼原则`（four\
  \ eyes principle），这要求在发布之前由两个独立的人查看每一处代码更改。通常，用新的视角来查看代码可以发现原始作者未预料到的问题。（独眼巨人是非常糟糕的程序员，因此建议对他们的审查进行双重检查。）\n\
  \n基于 `Git` 的工具可以通过 `pull requests`（拉取请求）使代码审查正式化。`pull request` 是开发者将代码合并到 `master`\
  \ 代码库的请求，这允许 `GitHub` 等工具确保在合并发生之前有其他开发者批准更改。（版本控制软件通常会将拉取请求的批准取决于持续集成系统中所有测试的通过，我们将在下一节中讨论。）\n\
  \n## 第三阶段：发布前测试\n\n软件开发生命周期（SDLC）的第三阶段是测试。你应该在彻底测试代码后才发布，以发现任何潜在的错误并确保其正确运行。良好的测试策略是在用户体验到或黑客利用它们之前发现软件缺陷（特别是安全漏洞）的关键。任何更改代码的人在合并或发布代码之前，都应该手动测试网站的功能。这是你应该要求团队所有成员都具备的基本勤谨态度。\n\
  \n在开发生命周期早期发现软件缺陷可以节省大量的时间精力，因此你应该用 `unit testing`（单元测试）来补充手动测试。`Unit tests`（单元测试）是代码库中的小型脚本，通过执行代码库的不同部分并测试输出，对代码的运行方式进行基本断言。你应该作为构建过程的一部分运行单元测试，并对代码中特别敏感或频繁更改的区域编写单元测试。\n\
  \n保持单元测试简单，以便它们测试代码的孤立函数。同时测试多个功能部分的过于复杂的单元测试是 `brittle`（脆弱的）的，随着代码的更改很容易崩溃。例如，一个良好的单元测试可能会断言只有经过身份验证的用户才能查看网站的某些区域，或者密码必须满足最小复杂度要求。良好的单元测试还充当了文档的形式，说明了代码在实现正确时应该如何运行。\n\
  \n### 覆盖率与持续集成\n\n当你运行单元测试时，它会调用你主代码库中的函数。当你运行所有单元测试时，它们执行的代码库百分比被称为你的 `coverage`（覆盖率）。虽然追求\
  \ 100%的测试覆盖率是值得赞的，但通常是不切行的，因此在选择代码库哪些部分编写单元测试时要小心。（此外，完全的测试覆盖并不能保证代码正确；仅仅执行了所有代码路径并不意味着涵盖了所有场景。）编写单元测试取决于判断，应该是更大风险评估策略的一部分。这里有一个很好的法则：当你发现一个\
  \ bug 时，编写一个断言正确行为的单元测试，然后再修复 bug。这可以防止问题再次发生。\n\n\n\n一旦你完成了某个发布的所有代码更改，就应该将它们部署到测试环境进行最终测试。`test\
  \ environment`（通常被称为 `staging`、`pre-production` 或 `quality assurance environment`\
  \ 测试环境）应该是网站的一个完全运行的副本，运行在专用服务器上。测试环境对于在发布发生之前检测软件缺陷（如安全漏洞）至关重要。大型开发团队通常会雇用专门的 `quality\
  \ assurance (QA)` 人员在此类环境中对软件进行测试。如果你正在将多组代码更改整合在一起，这有时被称为 `integration testing`。\n\
  \n一个良好的测试环境应该尽可能与生产环境相似，以确保测试具有意义。你应该在相同的服务器和数据库技术上运行测试环境，区别仅在于配置以及运行在其上的代码版本。（你仍然应该运用常识。例如，你的测试环境不应该能够向真实用户发送电子邮件，因此根据需要对你的测试环境施加刻意的限制。）\n\
  \n这个过程类似于剧院的演员和演职人员在第一次面向现场观众表演之前进行的彩排。他们在小范围测试观众面前穿上全服装进行演出。这允许他们能够在低风险的环境中解决表演中的最终小问题，在这个环境中的每一个细节都尽可能地接近开幕之夜演出。\n\
  \n测试环境是安全发布的关键部分，但如果管理不当，它们也会带来自身的安全风险。测试环境和生产环境需要在网络层进行适当的 `segregated`（隔离），这意味着两个环境之间的通信是不可能的。你不能让攻击者有机会通过网络从不安全的测试环境跳转到你的生产环境，从而获得破坏你网站的机会。\n\
  \n测试环境通常有自己的数据库，这需要真实的测试数据，以便对网站功能进行彻底测试。生成良好的测试数据的一种常用方法是从生产系统复制数据。如果你这样做，请特别注意\
  \ `scrub`（清理）这类数据副本中的敏感信息，包括姓名、支付详情和密码。近几年发生的多次备受关注的数据泄露都是由于攻击者在测试环境中偶然发现清理不当的数据导致的。\n\
  \n## 第 4 阶段：发布流程\n\n如果你从不发布代码，为网站编写代码就毫无用处，所以让我们谈谈 SDLC（软件开发生命周期）的第四阶段：发布流程。网站的\
  \ `release process` 涉及从版本控制获取代码，将其复制到 Web 服务器，并（通常）重启 Web 服务器进程。你如何实现这一点取决于你托管网站的位置以及你使用的技术。无论你采用什么方法，你的发布流程都需要是可靠的、可重复的、且可回滚的。\n\
  \n一个 `reliable`（可靠的）发布流程意味着你可以保证在发布期间部署了哪些代码、依赖项、资源和配置文件。如果你的发布流程不可靠，你运行的可能并不是你认为正在运行的代码版本，这是一个严重的安全风险。为了确保你的网站可靠地部署文件，发布脚本通常使用\
  \ `checksums`（校验和）——这是一种数字“指纹”，用于确保复制到服务器上的文件与版本控制中保存的文件完全相同。\n\n`reproducible`（可重复的）发布流程是指你可以在不同环境或使用不同版本的代码重新运行它并获得相同的结果。可重复性意味着发布过程中人为错误的空间更小。如果你的发布流程需要管理员按照正确的顺序完美地执行\
  \ 24 个步骤，你可以预见到他们会出错。尽可能地编写脚本并使你的发布流程自动化！可重复的流程对于建立良好的测试环境也是至关重要的。\n\n一个 `revertible`（可回滚的）发布流程允许你\
  \ `roll back`（回滚）发布。有时意外之外的突发状况会让你想要“撤销”最近的发布并恢复到代码的先前版本。这个过程应该尽可能无缝。部分回滚的代码是一场等待发生的灾难，因为你可能留下了不安全的配置或带有已知漏洞的软件依赖项。无论你选择什么发布流程，你都需要能够以最小的麻烦可靠地回滚到代码库的先前版本。\n\
  \n### 发布期间标准化部署的选项\n\n托管公司发明了 `Platform as a Service (PaaS)`（平台即服务）解决方案，使得发布代码变得简单且可靠。如果“云端”是指在他人的服务器上运行代码，那么使用“作为一种服务”的产品则指的是在他人的服务器上运行代码，并配有一些实用的自动化工具和管理网站。（托管公司有一系列发明糟糕营销缩写词的先例可循。）\n\
  \nMicrosoft Azure、Amazon Web Services Elastic Beanstalk、Google App Engine 和 Heroku\
  \ 都是 PaaS 提供商，允许开发者通过单条命令行调用来发布代码。平台负责处理发布过程中所需的几乎所有其他工作：设置虚拟化服务器、安装操作系统和虚拟机、运行你的构建过程（稍后将详细介绍）、加载依赖项、将代码部署到磁盘以及重启\
  \ Web 服务器进程。你可以在 Web 控制台或命令行中监控并回滚发布，平台会执行各种安全检查以确保你的代码清洁部署。使用基于 PaaS 的发布流程可以减少你网站的停机时间，确保代码的清洁部署，并产生完整的审计轨迹。\n\
  \nPaaS 解决方案带有限制性。作为这种便利性和可靠性的交换，它们仅支持某些编程语言和操作系统。它们允许有限的服务器配置，并且不支持复杂的网络布局。因此，有时对遗留应用程序进行改造以部署在此类平台上是困难的。\n\
  \n### 基础设施即服务与 DevOps\n\n如果你不使用 PaaS（因为你的应用程序太复杂、太老旧或成本太高），你通常会将代码部署到单个服务器上。这些服务器可能是自托管的、托管在数据中心，或托管在\
  \ `Infrastructure as a Service (IaaS)`（基础设施即服务）解决方案（如 Amazon Elastic Compute Cloud\
  \ `EC2`)的虚拟化服务器上。在这种情况下，你需要负责编写自己的发布流程。\n\n历史上，公司雇佣专门的系统管理员人员来设计和运行发布流程。然而，`DevOps`（开发与运维的缩写）工具的兴起模糊了这些职责，并让开发者对代码部署方式拥有更多控制权。DevOps\
  \ 工具（具有各种生动的名字，如 Puppet、Chef 和 Ansible）使得描述标准部署场景和将发布脚本模块化变得简单，赋予了开发团队设计自己部署策略的能力。这种方法通常比编写自定义发布脚本来下载并复制文件到服务器要可靠得多。DevOps\
  \ 工具使得遵循最佳实践变得简单，因为大多数部署场景都有现成的“配方”或脚本覆盖。\n\n### 容器化\n\n\n\n\n\n标准化部署的另一种方法是使用容器化。`Containerization`\
  \ 技术（如 `Docker`）允许你创建名为 `images` 的配置脚本，这些脚本描述了服务器应该使用的哪些操作系统、磁盘布局和第三方软件，以及你应该在软件栈之上部署何种\
  \ Web 应用程序。你将镜像部署到 `container` 中，容器抽象了底层操作系统的各种功能，以实现一致的部署；发布所需的所有特定内容都包含在镜像中，而容器是一个完全通用的组件。\n\
  \n你可以以可复的方式将 Docker 镜像部署到真实或虚拟化的服务器上，从而实现可靠的发布流程。在本地测试代码的开发者可以使用与生产环境完全相同的 `Docker`\
  \ 镜像，这样在代码正式发布时出现意外的情况就会减少。\n\n容器化是一项相对较的技术，但它承诺让复杂应用程序的部署更加可靠和标准化。一系列相关技术（例如 `Docker\
  \ Swarm` 和 `Kubernetes`）允许用机器可读的配置文件来描述复杂的多服务器网络配置。这使得重建整个环境变得简单得多。例如，一个团队可以轻松地启动一个包含多个\
  \ Web 服务器和数据库的全新测试环境，因为这些单独的服务以及它们之间的通信方式都会在托管服务可以理解的配置文件中描述。\n\n### 构建过程\n\n大多数代码库都有一个\
  \ `build process`（通过命令行或开发工具调用），它会获取静态代码并为部署做准备。`Java` 和 `C#` 等语言在构建过程中会将源代码编译为可部署的二进制格式，而使用包管理器的语言在运行构建过程中会下载并验证第三方代码（也称为\
  \ `dependencies`，依赖项）。\n\n网站的构建过程通常会对准备好部署的客户端资源进行预处理。许多开发者使用 `TypeScript` 和 `CoffeeScript`\
  \ 等语言，他们通过构建过程将这些语言编译为 `JavaScript`。无论 `JavaScript` 是手动编写的还是生成的，构建过程通常都会 `minify`（压缩）或混淆\
  \ `JavaScript` 文件，以生成一个压缩的、可读性较低但功能等效的 `JavaScript` 文件版本，该版本在浏览器中加载速度更快。\n\n网站的样式信息通常存储在\
  \ `CSS` 文件中，如第 3 章 所示。管理大型网站的 `CSS` 文件是一项苦差的工作（因为样式信息通常在不同的地方重复，并且需要同步更新）。Web 开发者经常使用\
  \ `Sass` 和 `SCSS` 等 `CSS pre-processors`——这些语言旨在使样式表更易于管理，它们在构建时需要预处理为 `CSS` 文件。\n\
  \n每种编程语言都有一个首选的构建工具，你的开发团队应该精通它。在将任何代码提交到源码控制之前，你应该在本地运行构建过程，以确保该过程在发布过程中重新运行之前是有效的。如前所述，请使用持续集成服务器来确保这一点的发生。\n\
  \n### 数据库迁移脚本\n\n为网站添加新功能通常需要新的数据库表或更新现有表。数据库存储了需要在发布之间保持持久化的数据，因此你不能在每次发布时简单地擦掉并安装新数据库。你需要在发布流程中创建并针对数据库运行数据库迁移脚本，以便在部署代码之前更新数据库结构；并在回滚代码时撤销这些脚本。\n\
  \n某些技术（例如 `Ruby on Rails`）允许你将迁移脚本作为构建过程的一部分运行。如果你无法将其作为构建过程的一部分运行，就应该将脚本保留在源码控制中，然后在发布窗口期间在数据库上以临时提升权限运行它们。在某些公司中，特别是大型复杂的数据库，通常有专门的\
  \ `database administrators (DBAs)`（数据库管理员）管理这一过程，并且他们作为他们心爱的数据存储的守门人。\n\n如果人员能够在发布之外更改数据库结构，那就是安全风险。我们将在第\
  \ 11 章 中讨论锁定权限的方法。\n\n### 第五阶段：发布后测试与观察\n\n一旦部署了代码，你就执行 `post-release testing`（发布后测试），以确保部署正确，并且你对代码在生产环境中执行方式的假设是正确的。理论上，如果你有一个良好的测试环境和可靠的发布流程，这种发布后测试（通常称为\
  \ `smoke testing` 烟测试）可以非常草率。尽管如此，在决定 SDLC（软件开发生命周期）每个阶段进行多少测试时，关注直觉并规避风险是一个主意。俗话说：“持续测试，直到恐惧变成无聊。”这捕捉到了恰当的情绪。\n\
  \n### 渗透测试\n\n安全专家和道德黑客经常执行 `penetration testing`（渗透测试），通过外部探测网站来测试安全性。渗透测试对于发布前和发布后测试都是有用的。此外，开发团队可以采用复杂的自动化渗透测试工具，通过分析各种\
  \ `URLs` 并尝试构建恶意的 `HTTP requests` 来测试网站的常见安全漏洞。渗透测试可能昂贵且耗时，但它比被黑客攻击要便宜得多，因此强烈考虑将其加入你的测试程序。\n\
  \n### 监控、日志记录与错误报告\n\n一旦发布了代码，你的生产环境在运行时就需要是可观测的。这有助于管理员发现异常和潜在的恶意行为，并在问题发生时进行诊断。发布后观察应该以三种活动的形式进行：日志记录、监控和错误报告。\n\
  \n`Logging`（日志记录）是在软件应用程序执行操作时让代码写入日志文件的做法，这有助于管理员查看 Web 服务器在任何给定时间正在做什么。你的代码应该记录每一个\
  \ `HTTP request`（带有时间戳、`URL` 和 `HTTP response code`），以及用户执行的重大操作（例如身份验证和重置密码请求）和网站本身的操作（例如发送电子邮件和调用\
  \ `APIs`）。\n\n你应该让管理员在运行时能够访问日志（无论是通过命令行还是 Web 控制台），并将其归档以便日后阅读（以防需要事后分析）。在代码中添加日志语句有助于诊断网站上发生的问题，但要小心不要将密码和信用卡信息等敏感细节写入日志，以防攻击者设法获取它们的访问权限。\n\
  \n`Monitoring`（监控）是在运行时衡量网站响应时间和其他指标的做法。监控你的 Web 服务器和数据库有助于管理员在网络速度变慢或数据库查询耗时长通过触发告警，发现高负载场景或性能下降。你应该将\
  \ `HTTP` 和数据库响应时间传递给监控软件，软件在服务器和数据库响应时间超过某些阈值时发出告警。许多云平台内置了监控软件，因此请花时间适当配置你的错误条件和选择的告警系统。\n\
  \n\n\n\n你应该使用 `error reporting` 来捕获并记录代码中意外错误。你可以通过从日志中提取错误，或者在代码本身中捕获并记录错误来建立错误条件。然后，你可以将这些错误条件整理到管理员访问的数据存储中。许多安全入侵利用了处理不当的错误条件，因此务必在意外错误发生时给予关注。\n\
  \n诸如 `Rollbar` 和 `Airbrake` 等第三方服务提供了插件，允许你通过几行代码来收集错误，因此如果你没有时间或兴趣建立自己的错误报告系统，可以考虑使用此类服务。或者，如\
  \ `Splunk` 等日志抓取工具允许你从日志文件中筛选出错误并对其进行分析。\n\n## 依赖管理\n\n除了标准的软件开发生命周期（SDLC）之外，你还需要考虑的一点是依赖管理。现代\
  \ Web 开发中一个有趣的现象是，你可能只编写了运行你网站的一小部分代码。你的网站通常依赖于操作系统代码、编程语言运行时及相关库、可能还有虚拟机，以及运行第三方代码库的\
  \ Web 服务器进程。所有你赖以支持你网站代码的第三方工具都被称为 `dependencies`。（换句话说，就是*你的*软件运行所所需的软件。）\n\n各领域的专家编写了这些依赖项中的每一个，这为你减轻了编写自己的内存管理或低层\
  \ TCP 语义的负担。这些专家还有强烈的动力来关注安全漏洞，并在问题出现时发布补丁，因此你应该利用他们提供的资源！\n\n使用他人的代码需要你方面足够勤奋。一个安全的\
  \ SDLC 应该包含一个审查第三方库并确定何时需要应用补丁的过程。这通常需要在常规开发周期之外进行，因为黑客不会等到你的下一次计划发布日期才开始尝试利用安全漏洞。时刻跟进安全告警并为他人的代码部署补丁，与确保团队编写代码的安全同样重要。我们将在第\
  \ 14 章中介绍如何做到这一点。\n\n### 总结\n\n在本章中，你学习了结构良好的软件开发生命周期可以帮助你避免 bug 和软件漏洞。\n\n* 你应该使用问题跟踪软件来记录设计目标。\n\
  * 你应该将代码保留在源版本控制中，以便旧版本的代码可供检查，并方便组织代码审查。\n* 在发布之前，你应该在与生产环境相似的专用且隔离测试环境中对代码进行测试，并对你的数据极极其谨慎。\n\
  * 你应该有一个可靠、可复现且可回滚的发布流程。如果你有一个脚本化的构建过程来生成准备好部署的资产，你应该在持续集成环境中定期运行它并进行单元测试，以便在开发生命周期早期发现潜在问题。\n\
  * 发布后，你应该使用渗透测试在黑客利用它们之前检测网站漏洞。你还应该使用监控、日志和错误报告来检测并诊断运行中网站的问题。\n* 你应该跟进你所使用的任何第三方代码的安全告警，因为你可能需要在常规发布周期之外部署补丁。\n\
  \n在下一章中，你将（终于！）开始查看特定的软件漏洞以及如何防止这些漏洞。你将从网站面临的最大威胁之一开始看起：旨在向你的 Web 服务器中注入代码的恶意输入。\n\
  \n# 第二部分\n\n## 威胁\n\n## 6\n\n# 注入攻击\n\n![image](img/common01.jpg)\n\n现在你已经牢固地掌握了互联网的工作原理，让我们关注特定的漏洞以及黑客利用这些漏洞的方法。本章将介绍\
  \ `injection attacks`（注入攻击），当攻击者试图将外部代码注入应用程序以获取应用程序控制权或读取敏感数据时，就会发生这种攻击。\n\n回互联网是\
  \ `client-server architecture`（客户端-服务器架构）的一个示例，这意味着 Web 服务器同时处理来自许多客户端的连接。大多数客户端是浏览器，负责在用户浏览网站时向\
  \ Web 服务器生成 HTTP 请求。Web 服务器返回包含 HTML 的 HTTP 响应，这些 HTML 成了网站页面的内容。\n\n由于 Web 服务器控制网站的内容，服务器端代码自然预期特定类型的用户交互，因此预期浏览器生成特定类型的\
  \ HTTP 请求。例如，服务器预期在用户每次点击链接时，看到一个发往新 URL 的 `GET` 请求，或者如果他们输入登录凭据并点击 `Submit`，则看到一个\
  \ `POST` 请求。\n\n然而，浏览器向服务器生成意外之外的 HTTP 请求是完全可能的。此外，Web 服务器乐意接受来自任何类型客户端的 HTTP 请求，而不只是浏览器。配备\
  \ HTTP 客户端库的程序员可以编写脚本，向互联网上的任意 URL 发送请求。我们在第 1 章中回顾的黑客工具正是这样操作的。\n\n服务器端代码没有可靠的方法来判断\
  \ HTTP 请求是由脚本还是浏览器生成的，因为无论客户端如何，HTTP 请求的内容都是无法区分的。服务器能做的最好就是检查 `User-Agent` 头部，该标头本应该描述生成请求的\
  \ `agent` 类型，但脚本和黑客工具通常会 `spoof`（伪造）此标头的内容，使其与浏览器发送的内容匹配。\n\n了解了这一切后，攻击网站的黑客经常在\
  \ HTTP 请求中传递恶意代码，从而欺骗服务器执行这些代码。这就是网站注入攻击的基础。\n\n注入攻击在互联网上异常常见，如果成功，其影响将是毁灭性的。作为一名\
  \ Web 开发人员，你需要了解它们发生的所有方式以及如何防御它们。在编写网站代码时，考虑处理网站的 HTTP 请求中可能出现的内容很重要，而不仅仅是预期的内容。在本章中，你将查看四种注入攻击：SQL\
  \ 注入攻击、命令注入攻击、远程代码攻击以及利用文件上传漏洞的攻击。\n\n### SQL 注入\n\n\n\n\n\n`Structured Query Language`（或\
  \ `SQL`）用于从关系型数据库中提取数据和数据结构。关系型数据库以表的形式存储数据；表中的每一行都是一个数据项（例如，一个用户或正在出售的产品）。SQL 语法允许\
  \ Web 服务器等应用程序通过使用 `INSERT` 语句向数据库添加行，使用 `SELECT` 语句读取行，使用 `UPDATE` 语句更新行，以及使用 `DELETE`\
  \ 语句删除行。\n\n考虑当你在网站上注册时，Web 服务器在后台运行的 SQL 语句，如列表 6-1 所示。\n\n```\n❶ INSERT INTO users\
  \ (email, encrypted_password)\n   VALUES ('billy@gmail.com', '$10$WMT9Y')\n\n❷ SELECT\
  \ * FROM users WHERE email = 'billy@gmail.com'\n   AND encrypted_password = '$10$WMT9Y'\n\
  \n❸ UPDATE USERS users encrypted_password ='3D$MW$10Z'\n   WHERE email='billy@gmail.com'\n\
  \n❹ DELETE FROM users WHERE email = 'billy@gmail.com'\n```\n*列表 6-1: 用户与网站交互时 Web\
  \ 服务器可能运行的典型 SQL 语句*\n\nSQL 数据库通常在 `users` 表中存储网站用户的信息。当用户首次注册并选择用户名和密码时，Web 服务器会在数据库上运行\
  \ `INSERT` 语句，在 `users` 表中创建一个新行 ❶。当用户下次登录网站时，Web 服务器会运行 `SELECT` 语句，尝试在 `users`\
  \ 表中找到对应的行 ❷。如果用户更改了密码，Web 服务器会运行 `UPDATE` 语句来更新 `users` 表中对应的行 ❸。最后，如果用户注销账户，网站可能会运行\
  \ `DELETE` 语句从 `users` 表中删除其对应的行 ❹。\n\n对于每一次交互，Web 服务器负责获取 HTTP 请求的部分内容（例如在登录表单中输入的用户名和密码），并构造一个针对数据库的\
  \ SQL 语句。语句的实际执行是通过 `database driver`（数据库驱动程序）实现的，这是一个与数据库通信的专用代码库。\n\n### SQL 注入攻击剖析\n\
  \n当 Web 服务器不安全地构造传递给 `database driver` 的 SQL 语句时，就会发生 SQL 注入攻击。这允许攻击者通过 HTTP 请求传递参数，导致驱动程序执行开发人员意图之外的操作。\n\
  \n让我们来看一个不安全的 SQL 语句构造示例，它在用户尝试登录网站时从数据库中读取用户数据，如列表 6-2 中的 Java 代码所示。\n\n```\nConnection\
  \ connection = DriverManager.getConnection(DB_URL, DB_USER, DB_PASSWORD);\nStatement\
  \ statement = connection.createStatement();\nString sql = \"SELECT * FROM users\
  \ WHERE email='\" + email +\n             \"' AND encrypted_password='\" + password\
  \ + \"'\";\nstatement.executeQuery(sql);\n```\n*列表 6-2: 登录尝试期间从数据库读取用户数据的不安全方法*\n\
  \n此 SQL 语句的构造是不安全的！这段代码使用了从 HTTP 请求中获取的 `email` 和 `password` 参数，并将它们直接插入到 SQL 语句中。由于没有对参数检查是否包含\
  \ SQL 控制字符（例如 `'`），这些字符会改变 SQL 语句的含义，黑客可以构造出绕过网站身份验证系统的输入。\n\n列表 6-3 展示了此类示例。在这个示例中，攻击者将用户邮箱参数传递为\
  \ `billy@gmail.com'--`，这提前终止了 SQL 语句，并导致密码检查逻辑没有执行：\n\n```\nstatement.executeQuery(\n\
  \  \"SELECT * FROM users WHERE email='billy@gmail.com'❶--' AND encrypted_password='Z$DSA92H0'❷\"\
  );\n```\n*列表 6-3: 使用 SQL 注入绕过身份验证*\n\n`database driver` 只执行 SQL 语句 ❶，并忽略其之后的所有内容\
  \ ❷。在此类型的 SQL 注入攻击中，单引号字符（`'`）提前关闭了邮箱参数，SQL 注释语法（`--`）欺骗了 `database driver` 忽略包含密码检查的语句结尾。此\
  \ SQL 语句允许攻击者在不知道密码的情况下以任何用户的身份登录！攻击者只需要在登录表单的用户邮箱地址中添加 `'` 和 `--` 即可。\n\n这是一个相对简单的\
  \ SQL 注入攻击示例。更高级的攻击可能会导致 `database driver` 在数据库上运行额外的命令。列表 6-4 展示了一个 SQL 注入攻击。\n\
  \n```\nstatement.executeQuery(\"SELECT * FROM users WHERE email='billy@gmail.com'❶--;\
  \ DROP users❷' AND encrypted_password='Z$DSA90'\");\n```\n*列表 6-4: SQL 注入攻击*\n\n\
  在这种场景下，攻击者将邮箱参数传递为 `billy@gmail.com';`。分号字符（`;`）终止了第一个语句 ❶，之后攻击者插入了一个破坏性语句 ❷。数据库将运行这两条语句！\n\
  \n### 缓解措施 1：使用参数化语句\n\n为了防止 SQL 注入攻击，你的代码需要使用绑定参数（bind parameters）构造 SQL 字符串。*绑定参数*是占位符字符，数据库驱动程序将安全地将其替换为提供的输入——如列表\
  \ 6-1 所示的邮箱或密码值。包含绑定参数的 SQL 语句被称为*参数化语句*（parameterized statement）。\n\nSQL 注入攻击利用\
  \ SQL 语句中具有特殊含义的“控制字符”来“跳出”上下文并更改整个 SQL 语句的语义。当你使用绑定参数时，这些控制字符会被加上“转义字符”，告诉数据库不要将后续字符视为控制字符。这种对控制字符的转义消除了潜在的注入攻击。\n\
  \n使用绑定参数构造的安全 SQL 语句应如列表 6-5 所示。\n\n```\nConnection connection = DriverManager.getConnection(DB_URL,\
  \ DB_USER, DB_PASSWORD);\nStatement statement = connection.createStatement();\n\
  ❶ String sql = \"SELECT * FROM users WHERE email = ? AND encrypted_password = ?\"\
  ;\n❷ statement.executeQuery(sql, email, password);\n```\n*列表 6-5: 使用绑定参数防止 SQL 注入*\n\
  \n此代码使用 `?` 作为绑定参数以参数化的形式构造 SQL 查询 ❶。随后代码将每个参数的输入值绑定到语句 ❷，要求数据库驱动程序在将参数值插入 SQL 语句的同时安全处理任何控制字符。如果攻击者尝试使用列表\
  \ 6-4 所述的方法通过传递 `billy@gmail.com'--` 用户名来破解此代码，你构造的安全 SQL 语句将消解攻击，如列表 6-6 所示。\n\n\
  ```\nstatement.executeQuery(\n  \"SELECT * FROM users WHERE email = ? AND encrypted_password\
  \ = ?\",\n  \"billy@gmail.com'--,\",\n  \"Z$DSA92H0\"\n);\n```\n*列表 6-6: SQL 注入攻击被消解。*\n\
  \n\n\n\n\n由于数据库驱动程序确保不会提前终止 SQL 语句，此 `SELECT` 语句将安全地返回 `no` 个用户，攻击应当失败。参数化语句确保数据库驱动程序将所有控制字符（如\
  \ `'`、`--` 和 `;`）视为 SQL 语句的 `input`，而不是 SQL 语句的一部分。如果你不确定你的网站是否使用了参数化语句，请立即检查！`SQL\
  \ injection` 可能是你的网站面临的最大风险。\n\n每当 Web 服务器通过在后端的原生语言构建语句来与独立的后端通信时，都可能出现类似的注入攻击。这包括如\
  \ `MongoDB` 和 `Apache Cassandra` 等 NoSQL 数据库、如 `Redis` 和 `Memcached` 等分式缓存，以及实现轻量级目录访问协议（`LDAP`）的目录服务。与这些平台通信的库都有其各自的绑定参数实现方式，因此请务必理解它们的工作原理并在你的代码中使用它们。\n\
  \n### 缓解措施 2：使用对象关系映射\n\n许多 Web 服务器库和框架都抽象了代码中显式的 SQL 语句构建，并允许你通过对象关系映射来访问数据对象。`Object-relational\
  \ mapping (ORM)` 库将数据库表中的行映射到内存中的代码对象，这意味着开发者通常不需要编写自己的 SQL 语句即可从数据库读取和更新。这种架构在大多数情况下可以防止\
  \ `SQL injection` 攻击，但如果使用了自定义 SQL 语句，仍然可能存在漏洞——因此，了解你的 ORM 在后台是如何运作的至关重要。\n\n人们最熟悉的\
  \ ORM 可能是 Ruby on Rails 的 `ActiveRecord` 框架。列表 6-7 显示了一行简单的 Rails 代码，它以安全的方式查找用户。\n\
  \n```ruby\nUser.find_by(email: \"billy@gmail.com\")\n```\n\n列表 6-7：Ruby on Rails\
  \ 代码，以一种受注入攻击保护的方式通过电子邮件查找用户*\n\n由于 ORM 在底层层使用绑定参数，因此它们在大多数情况下可以防止注入攻击。然而，大多数 ORM\
  \ 也预留了“后门”，允许开发者在需要时编写原始 SQL。如果你使用这些类型的函数，需要小心如何构建 SQL 语句。例如，列表 6-8 显示了易受注入攻击的 Rails\
  \ 代码。\n\n```ruby\ndef find_user(email, password)\n  User.where(\"email = '\" + email\
  \ + \"' and encrypted_password = '\" + password + \"'\")\nend\n```\n\n列表 6-8：易受注入攻击的\
  \ Ruby on Rails 代码*\n\n由于这段代码将部分 SQL 语句作为原始字符串传递，攻击者可以传入特殊字符来操纵 Rails 生成的 SQL 语句。如果攻击者可以将\
  \ `password` 变量设置为 `' OR 1=1`，他们就可以运行禁用密码检查的 SQL 语句，如列表 6-9 所示。\n\n```sql\nSELECT\
  \ * FROM users WHERE email='billy@gmail.com' AND encrypted_password ='' OR 1=1\n\
  ```\n\n列表 6-9：`1=1` 语句显然为真，它禁用了密码检查*。此 SQL 语句的最后一个子句禁用了密码检查，允许攻击者以该用户登录。你可以通过绑定参数在\
  \ Rails 中安全地调用 `where` 函数，如列表 6-10 所示。\n\n```ruby\ndef find_user(email, encrypted_password)\n\
  \  User.where([\"email = ? and encrypted_password = ?\", email, encrypted_password])\n\
  end\n```\n\n列表 6-10：`where` 函数的安全使用*\n\n在这种场景下，`ActiveRecord` 框架将安全地处理攻击者添加到 `email`\
  \ 或 `password` 参数中的任何 SQL 控制字符。\n\n### 额外缓解措施：使用深度防御\n\n作为经验法则，你应该始终通过冗余措施来保护你的网站。仅仅逐行检查代码的漏洞是不够的。你需要在堆栈的每一层考虑并执行安全措施，使某一层的故障能够通过其他策略得到缓解。这种方法被称为\
  \ `defense in depth`。\n\n考虑一下如何保护你的家。最重要的防御是在所有的门窗上安装锁，但配备防盗报警器、监控摄像头、家庭保险，可能还有一只脾气暴躁的大狗也有助于应对所有意外。\n\
  \n对于防止 `SQL injection`，`defense in depth` 意味着使用绑定参数，同时也采取额外的步骤来最小化伤害。让我们看看其他缓解此问题的办法。\n\
  \n#### 最小权限原则\n\n缓解注入攻击的另一种方法是遵循“最小权限原则”，该原则要求每个进程和应用程序仅以执行任务所需的权限运行。这意味着如果攻击者向你的服务器注入代码，他们造成的破坏将被限制在该特定组件允许的操作。\n\
  \n如果你的 Web 服务器与数据库通信，请确保它用于登录数据库的账户具有有限的权限。大多数网站只需要运行属于 SQL 子集 `data manipulation\
  \ language (DML)` 的语句，包括 `SELECT`、`INSERT`、`UPDATE` 和 `DELETE` 语句。\n\n名为 `data definition\
  \ language (DDL)` 的 SQL 子集使用 `CREATE`、`DROP` 和 `MODIFY` 语句来创建、删除和修改数据库中的表结构。Web\
  \ 服务器通常不需要执行 DDL 语句的权限，因此不要在运行时授予它们 DDL 权限集！将 Web 服务器权限缩小到最小的 DML 集可以减少攻击者造成的伤害。\n\
  \n#### 盲注与非盲 SQL 注入\n\n黑客区分 `blind` 和 `nonblind` 注入攻击。如果你的网站错误信息向客户端泄露了敏感信息，例如信息“唯一约束冲突：此电子邮件已存在于\
  \ users 表中”，这就是 `nonblind` SQL 攻击。在这种场景下，攻击者在尝试入侵系统时会获得即时反馈。\n\n如果你让客户端看到的错误信息更加通用，例如信息“找不到此用户名和密码”或“发生意外错误”，这就是\
  \ `blind` SQL 攻击。这种场景意味着攻击者实际上是在黑暗中操作，拥有的信息较少。易受非盲注入攻击的网站更容易被破解，因此要避免在错误信息中泄露信息。\n\
  \n### 命令注入\n\n另一种注入攻击是 `command injection`，攻击者利用它来利用对底层操作系统执行不安全命令行调用的网站。如果你的 Web\
  \ 应用程序执行命令行调用，请确保安全地构建命令字符串。否则，攻击者可以构造执行任意操作系统命令的 HTTP 请求，并接管你的应用程序。\n\n对于许多编程语言来说，构建命令字符串调用操作系统实际上非常罕见。例如，Java\
  \ 运行在虚拟机中，虽然你可以通过 `java.lang.Runtime` 类调用操作系统，但 Java 程序通常设计为可以在不同操作系统之间迁移，因此依赖特定操作系统的函数的可用性会违背其设计哲学。\n\
  \n\n\n\n命令行调用在解释型语言中更为常见。PHP 的设计遵循 Unix 哲学——程序应该只做一件事，并通过文本流进行相互通信——因此，PHP 应用通过命令行调用其他程序是很常见的。同样，Python\
  \ 和 Ruby 在脚本任务中非常流行，因此它们使得在操作系统层面执行命令变得简单。\n\n## 命令注入攻击的剖析\n\n如果你的网站使用了命令行调用，请确保攻击者无法欺骗\
  \ Web 服务器向执行调用中注入额外的命令。例如，假设你有一个简单的网站，它使用 `nslookup` 来解析域名和 IP 地址。PHP 代码从 HTTP 请求中获取域名或\
  \ IP 地址，并构造如列表 6-11 所示的操作系统调用。\n\n```php\n<?php\n    if (isset($_GET['domain']))\
  \ {\n        echo '<pre>';\n        $domain = $_GET['domain']❶;\n        $lookup\
  \ = system(\"nslookup {$domain❷}\");\n        echo($lookup);\n        echo '</pre>';\n\
  \    }\n?>\n```\n\n*列表 6-11：接收 HTTP 请求并构造操作系统调用的 PHP 代码*\n\n域名参数在 ❶ 处从 HTTP 请求中提取。由于代码在构造命令字符串\
  \ ❷ 时没有转义域名参数，攻击者可以构造恶意 URL 并在末尾标记额外的命令，如图 6-1 所示。\n\n![image](img/06fig01.jpg)\n\
  \n*图 6-1：使用 URL 注入恶意命令*\n\n在这里，攻击者发送了一个值为 `google.com && echo \"HAXXED\"` 的域名参数，浏览器会对空格和非字母数字字符进行\
  \ URL 编码。Unix 中的 `&&` 语法用于连接不同的命令。由于我们的 PHP 代码没有过滤此类控制字符，攻击者通过仔细构造 HTTP 请求来追加一个额外的命令。在这种情况下，将执行两个独立的命令：预期的、用于查找\
  \ *google.com* 的 `nslookup` 命令，然后是*注入的*命令 `echo \"HAXXED\"`。\n\n在这种情况下，注入的命令是一个无害的\
  \ `echo` 命令，它只是在 HTTP 响应中打印出“HAXXED”。然而，攻击者可以利用此漏洞在你的服务器上注入并执行他们选择的任何命令。只要稍加努力，他们就可以探索文件系统、读取敏感信息并破坏整个应用程序。Web\
  \ 服务器上的命令行访问赋予了攻击者完全控制系统的自由，除非你采取了刻意采取的措施来减轻影响。\n\n## 缓解措施：转义控制字符\n\n与 SQL 注入一样，你可以通过正确转义来自\
  \ HTTP 请求的输入来防御命令注入。这意味着将敏感的控制字符（例如我们示例中的 `&` 字符）替换为安全的替代方案。具体做法取决于你正在使用的操作系统和编程语言。为了使列表\
  \ 6-11 中的 PHP 代码更安全，我们只需要调用 `escapeshellarg`，如列表 6-12 所示。\n\n```php\n<?php\n   \
  \ if (isset($_GET['domain'])) {\n        echo '<pre>';\n        $domain = escapeshellarg❶($_GET['domain']);\n\
  \        $lookup = system(\"nslookup {$domain}\");\n        echo($lookup);\n   \
  \     echo '</pre>';\n    }\n?>\n```\n\n*列表 6-12：转义来自 HTTP 请求输入的 PHP 代码*\n\n对 `escapeshellarg`\
  \ ❶ 的调用确保攻击者无法通过域名参数注入额外的命令。\n\nPython 和 Ruby 也可以防止潜在的命令注入攻击。\n\n在 Python 中，调用 `call()`\
  \ 函数时在使用数组而不是字符串，以防止攻击者在末尾标记额外的命令，如列表 6-13 所示。\n\n```python\nfrom subprocess import\
  \ call\ncall([\"nslookup\", domain])\n```\n*列表 6-13：Python subprocess 模块中的 call\
  \ 函数*\n\n在 Ruby 中，`system()` 函数执行命令行调用。向它提供参数数组而不是字符串，以确保攻击者无法溜入额外的命令，如列表 6-14 所示。\n\
  \n```ruby\nsystem(\"nslookup\", domain)\n```\n*列表 6-14：Ruby 中的 system() 函数*\n\n\
  与 SQL 注入一样，遵循**最小权限原则**也有助于限制成功的命令注入攻击的影响。你的 Web 服务器进程应该仅以其所需的权限运行。例如，你应该限制 Web\
  \ 服务器进程可以读取和写入的目录。在 Linux 上，你可以使用 `chroot` 命令来防止进程探索指定根目录之外的内容。你还应该通过在网络上配置防火墙和访问控制列表来限制\
  \ Web 服务器的访问权限。这些步骤将使黑客利用命令注入漏洞变得困难得多，因为即使他们执行命令，除了读取 Web 服务器运行目录中的文件外，他们也做不了其他。\n\
  \n## 远程代码执行\n\n到为止，你已经看到当 Web 代码构造对数据库调用（如 SQL 注入）或对其运行的操作系统调用（如命令注入）时，漏洞是如何渗入的。在其他情况下，攻击者可以注入恶意代码并在\
  \ Web 服务器本身的语言中执行，这种策略被称为远程代码执行。网站上的远程代码执行攻击比我们讨论的注入攻击更少，但危险程度相当。\n\n### 远程代码执行攻击的剖析\n\
  \n攻击者可以通过发现特定类型 Web 服务器的漏洞，然后创建针对该服务器技术的网站的*利用脚本*，来实现远程代码执行。利用脚本在 HTTP 请求体中包含恶意代码，其编码方式使得服务器会读取并执行这些代码。执行远程执行攻击的技术差异很大。安全研究人员会分析常用\
  \ Web 服务器的代码库，寻找允许注入恶意代码的漏洞。\n\n在 2013 年初，研究人员在 Ruby on Rails 中发现了一个漏洞，允许攻击者向服务器注入自己的\
  \ Ruby 代码。由于 Rails 框架根据 Content-Type 请求头自动解析请求，安全研究人员发现，如果他们创建一个嵌入 YAML 对象（Rails\
  \ 社区常用的存储配置数据的标记语言）的 XML 请求，就可以欺骗解析过程执行任意代码。\n\n### 缓解措施：禁用反序列化期间的代码执行\n\n远程代码执行漏洞通常发生在\
  \ Web 服务器软件使用不安全的序列化时。*序列化*是将内存中的数据结构转换为二进制数据流的过程，通常是为了跨网络传递数据结构。*反序列化*指的是另一端发生的相反过程，即将二进制数据转换回数据结构。\n\
  \n序列化库存在于每种主要的编程语言中并被广泛使用。某些序列化库（例如 Rails 使用的 YAML 解析器）允许数据结构在内存中重新初始化时执行代码。如果你信任序列化数据的来源，这是一个非常有用的功能，但如果你不信任，它可能是*非常*危险的，因为它允许任意代码执行。\n\
  \n\n\n\n如果 Web 服务器使用反序列化来处理来自 HTTP 请求的数据，那么它需要通过禁用任何代码执行能力来消除其所用序列化库的风险；否则，攻击者可能会找到直接将代码注入到\
  \ Web 服务器进程的方法。通常，可以通过相关的配置设置来禁用代码执行，允许你的 Web 服务器软件在不执行代码的情况下反序列化数据。\n\n作为一名使用 Web\
  \ 服务器构建网站的开发者，而不是编写 Web 服务器代码本身的开发者，保护你的技术栈免受远程代码执行的影响通常意味着关注安全告警。你不太可能编写自己的序列化库，因此请注意你的代码库在何处使用了第三方序列化库。确保在你自己的代码中关闭活动的代码执行功能，并密切关注\
  \ Web 服务器供应商发布的漏洞公告。\n\n## 文件上传漏洞\n\n我们在本章中将看到的最后一种注入攻击利用了文件上传函数中的漏洞。网站出于多种目的使用`file\
  \ upload functions`：允许用户向其个人资料或帖子中添加图片、在消息中添加附件、提交文件、与其他用户共享文档等。浏览器通过内置的文件上传控件和\
  \ JavaScript API 方便地上传文件，这些 API 允许你将文件拖入网页并将其异步发送到服务器。\n\n然而，浏览器在检查文件内容方面并不十分谨慎。攻击者可以通过向上传的文件注入恶意代码来轻松地滥用文件上传函数。Web\
  \ 服务器通常将上传的文件视为大型二进制数据块（blobs），因此攻击者很容易上传恶意有效负载（payload）而不会被 Web 服务器检测。即使你的网站有 JavaScript\
  \ 代码在上传文件之前检查文件内容，攻击者也可以编写脚本直接将文件数据发布到服务器端端点，从而绕过你在客户端设置的任何安全措施。\n\n让我们看看攻击者通常如何利用文件上传函数，以便识别出我们需要修补的各种安全薄弱环节。\n\
  \n### 文件上传攻击的剖析\n\n作为一个文件上传漏洞的例子，让我们来看看攻击者如何可能滥用你的个人图片上传功能。攻击者首先编写一个小型 `web shell`（Web\
  \ 壳），这是一个简单的可执行脚本，它可以从 HTTP 请求中获取一个参数，在命令行中执行它并输出结果。Web shell 是黑客尝试攻破 Web 服务器的常用工具。列表\
  \ 6-15 显示了一个用 PHP 编写的 web shell 示例。\n\n```php\n<?php\n  if(isset($_REQUEST['cmd']))\
  \ {\n    $cmd = ($_REQUEST['cmd']);\n    system($cmd);\n  } else {\n    echo \"\
  What is your bidding?\";\n  }\n?>\n```\n*列表 6-15: 用 PHP 语言编写的 web shell*\n\n攻击者将此脚本保存为计算机上的\
  \ `hack.php`，并将其作为个人资料“图片”上传到你的网站。PHP 文件通常被操作系统视为 `executable`（可执行）文件，这是此攻击成功的关键。显然，以\
  \ `*.php` 结尾的文件并不是有效的图片文件，但攻击者可以相当地禁用上传过程中进行的任何 JavaScript 文件类型检查。\n\n一旦攻击者上传了他们的“图片”文件，他们的网站个人资料页面将显示缺失的图标，因为他们的个人图片已损坏，实际上不是图片。然而，到此时他们已经实现了真实目标：将\
  \ web shell 文件走私到你的服务器上，这意味着他们的恶意代码现在已部署到你的网站上，等待以某种方式执行。\n\n由于 web shell 可以在公网上\
  \ URL 可，攻击者可能为执行恶意代码创建了一个后门。如果你的服务器操作系统安装了 PHP 运行时，并且该文件在上传过程中以可执行权限写入磁盘，那么攻击者只需调用与他们的个人图片对应的\
  \ URL 即可传递命令来运行 web shell。\n\n要执行命令注入攻击，黑客可以向 web shell 传递 `cmd` 参数以在你的服务器上执行任意操作系统命令，如图\
  \ 6-2 所示。\n\n![image](img/06fig02.jpg)\n*图 6-2: 如果你的文件上传函数存在漏洞，黑客可以使用 web shell\
  \ 访问你的数据库凭据。*\n\n在这种情况下，攻击者可以探索你的文件系统。攻击者利用你的文件上传函数获得了与命令注入攻击相同的操作系统访问权限。\n\n####\
  \ 缓解措施\n\n你可以使用几种缓解措施保护自己免受文件上传代码漏洞的影响。最重要的缓解措施是确保任何上传的文件不能作为代码执行。遵循深度防御原则，你还应该分析上传的文件并拒绝任何看起来损坏或恶意的文件。\n\
  \n#### 缓解措施 1：在安全系统中托管文件\n\n保护文件上传函数的第一种也是重要的方法是确保 Web 服务器将上传的文件视为惰性对象而非可执行对象。你可以通过在内容分发网络（CDN）中托管上传的文件来做到，例如\
  \ Cloudflare 或 Akamai，如第 4 章所述，这会将安全负担交给了安全地存储你文件的第三方。\n\nCDN 还有其他非安全相关的益处。CDN 向浏览器极快地提供文件，并可以在你上传时将其通过处理流水线。许多\
  \ CDN 提供了复杂的 JavaScript 上传控件，你只需几行代码即可添加，并且它们提供了如图像裁剪等额外功能。\n\n如果由于某种原因 CDN 不是可选项，你可以通过将上传的文件存储在云存储中（例如\
  \ Amazon Storage Service，或 `S3`）或专用内容管理系统中获得许多相同的益处。这两种方法都能提供安全存储，在上传时消除 web shell。（不过，如果你托管自己的内容管理系统，你需要正确配置它。）\n\
  \n#### 缓解措施 2：确保上传的文件无法被执行\n\n如果未使用 CDN 或内容管理系统，你需要采取与 CDN 或内容管理系统后台相同的步骤来保护你的文件。这意味着确保所有文件在没有执行权限的情况下写入磁盘，将上传的文件分离到特定的目录或分区（以免与代码混杂），并对服务器进行\
  \ `hardening`（加固），只安装最少需要的软件。（如果你没有使用 PHP，请卸载它！）实现这些目标取决于你的托管技术、操作系统和所使用的编程语言。例如，如果你在\
  \ Linux 上运行 Python Web 服务器，可以通过使用 `os` 模块在创建文件时设置文件权限，如列表 6-16 所示。\n\n```python\n\
  import os\nfile_descriptor = os.open(\"/path/to/file\", os.O_WRONLY | os.O_CREAT,\
  \ 0o600)\nwith os.fdopen(open(file_descriptor, \"wb\")) as file_handle:\n    file_handle.write(...)\n\
  ```\n*列表 6-16: 在 Linux 上用 Python 写入读写（但不可执行）权限的文件*\n\n\n\n\n\n### 缓解 3：验证上传文件的内容\n\
  \n如果你正在上传已知文件类型的文件，请考虑在代码中添加一些文件类型检查。确保上传 HTTP 请求中的 `Content-Type` 头部与预期的文件类型匹配，但要注意攻击者可以轻易伪造该标头。\n\
  \n在文件上传后验证文件类型是可能的，特别是对于图像文件，因此在服务器端代码中实现此功能是一个好主意，如 列表 6-17 所示。不过，具体情况可能会有所不同；过去聪明的黑客通过设计适用于多种文件格式的有效负载渗透了各种系统。\n\
  \n```python\n>>> imghdr\n\n>>> imghdr.what('/tmp/what_is_this.dat')\n'gif'\n```\n\
  *列表 6-17：在 Python 中读取文件头以验证文件格式*\n\n### 缓解 4：运行防病毒软件\n\n最后，如果你运行在易感染病毒的服务器平台上（你好，Microsoft\
  \ Windows！），请确保你正在运行最新的防病毒软件。文件上传函数是病毒负载的敞口。\n\n### 总结\n\n在本章中，你学习了各种注入攻击，攻击者通过构造恶意的\
  \ HTTP 请求来控制后端系统。\n\nSQL 注入攻击利用了 Web 代码在与 SQL 数据库通信时没有安全地构造 SQL 字符串的问题。你可以通过在与数据库驱动程序通信时使用绑定参数（bind\
  \ parameters）来缓解 SQL 注入。\n\n命令注入攻击利用了对操作系统函数进行不安全调用的代码。你同样可以通过正确使用绑定（binding）来消除命令注入。\n\
  \n远程代码执行漏洞允许黑客在 Web 服务器进程内部运行利用程序，通常源于不安全的序列化库。确保密切关注你使用的序列化库以及 Web 服务器软件的安全性公告。\n\
  \n如果你的文件上传功能将上传的文件以可执行权限写入磁盘，那么文件上传函数往往会引发命令注入攻击。请确保将上传的文件写入第三方系统或具有适当权限的磁盘，并在上传时尽尽所能地验证文件类型。\n\
  \n你可以通过遵循**最小特权原则**来缓解所有类型注入攻击的风险：进程和软件组件的运行应仅限于执行其分配任务所需的权限，而不能更多。这种方法可以减少攻击者在注入有害代码时可能造成的伤害。遵循最小特权原则的示例包括限制你的\
  \ Web 服务器进程的文件和网络访问，以及使用受限权限的账户连接数据库。\n\n在下一章中，你将查看黑客如何利用 JavaScript 漏洞来攻击你的网站。\n\
  \n# 7 跨站脚本攻击\n\n![image](img/common01.jpg)\n\n在上一章中，你看到了攻击者如何向 Web 服务器注入代码以损害网站安全。如果你的\
  \ Web 服务器是安全的，那么黑客的下一个最佳注入目标就是 Web 浏览器。浏览器会听从地执行出现在网页中的任何 JavaScript 代码，因此，如果攻击者能够找到在用户查看你的网站时向其浏览器中注入恶意\
  \ JavaScript 的方法，那么该用户就倒霉了。我们把这种代码注入称为跨站脚本（XSS）攻击。\n\nJavaScript 可以读取或修改网页的任何部分，因此攻击者利用跨站脚本漏洞可以做很多事情。他们可以在用户输入凭据时窃取登录凭据或其他敏感信息（如信用卡号）。如果\
  \ JavaScript 可以读取 HTTP 会话信息，他们就可以完全劫持用户的会话，允许他们远程以该用户的身份登录。（你将在第 10 章中学习更多关于会话劫持的知识）。\n\
  \n跨站脚本是一种非常常见的攻击类型，其危害显而易见。本章介绍了三种最常见的跨站脚本攻击类型，并解释了如何防御它们。\n\n### 存储型跨站脚本攻击\n\n\
  网站通常使用存储在数据库中的信息生成并渲染 HTML。零售网站会在数据库中存储产品信息，社交媒体网站会存储用户对话。网站将根据用户导航到的 URL 从数据库获取内容，并将其插入到页面中以生成最终的\
  \ HTML。\n\n任何来自数据库的页面内容都是黑客潜在的攻击向量。攻击者会尝试向数据库中注入 JavaScript 代码，以便 Web 服务器在渲染 HTML\
  \ 时写出 JavaScript。我们把这种攻击称为存储型跨站脚本攻击：JavaScript 被写入数据库，但当毫无防备的受害者查看网站上的特定页面时，会在浏览器中执行。\n\
  \n可以使用第 6 章中描述的 SQL 注入方法在数据库中植入恶意 JavaScript，但攻击者更常见是通过合法途径插入恶意代码。例如，如果网站允许用户发表评论，网站会将评论文本存储在数据库中，并显示给查看同一评论线程的其他用户。在这种情况下，黑客执行跨站脚本攻击的一种简单方法是向数据库写入一条包含\
  \ `<script>` 标签的评论。如果网站未能安全地构造 HTML，那么每当页面渲染给其他用户时，`<script>` 标签就会被写出，JavaScript\
  \ 将在受害者的浏览器中执行。\n\n让我们来看一个具体的例子。假设你经营着一个针对烘焙爱好者的流行网站，`https://breddit.com`。你的网站鼓励用户参与关于面包相关主题的讨论线程。在使用在线论坛讨论时，用户自己贡献了网站的大部分内容。当用户添加帖子时，你的网站将其记录到数据库中，并显示给参与该线程的其他用户。这为攻击者通过评论注入\
  \ JavaScript 提供了绝佳机会，如图 7-1 所示。\n\n![image](img/07fig01.jpg)\n*图 7-1：攻击者通过评论注入 JavaScript*\n\
  \n如果你的网站在渲染 HTML 时没有转义注入的脚本（我们将在下一节讨论），下一个查看该线程的用户将看到攻击者的 `<script>` 标签被写到其浏览器并执行，如图\
  \ 7-2 所示。\n\n![image](img/07fig02.jpg)\n*图 7-2：攻击者的 <script> 标签被写到受害者的浏览器并执行*\n\n\
  一个恶意的 `alert()` 对话更多是骚扰而非真正的威胁，但攻击者通常通过这种方法检查是否存在跨站脚本攻击。如果攻击者可以调用 `alert()` 函数，他们就可以升级到更危险的攻击，例如窃取其他用户的会话，或将受害者重定向到有害网站。烘焙社区再也无法在线感到安全了！\n\
  \n评论线程并不是唯一可能出现这种漏洞的地方。*任何*用户控制的内容都是需要安全的潜在攻击途径。例如，攻击者曾通过向用户名、个人资料页在线评论注入恶意脚本标签执行跨站脚本攻击。让我们来看两种应该实施的简单防护措施。\n\
  \n#### 缓解 1：转义 HTML 字符\n\n\n\n\n\n为了防止存储型跨站脚本攻击，你需要对所有来自数据存储的动态内容进行转义，以便浏览器知道将其视为\
  \ HTML 标签的*内容*，而不是原始 HTML。在浏览器中*转义*内容意味着将 HTML 中的控制字符替换为相应的*实体编码*，如 表 7-1 所示。\n\n\
  **表 7-1:** HTML 控制字符的实体编码\n\n| 字符 | 实体编码 |\n| :--- | :--- |\n| \" | `&quot;` |\n\
  | & | `&amp;` |\n| ' | `&apos;` |\n| < | `&lt;` |\n| > | `&gt;` |\n\n任何在 HTML 中具有特殊含义的字符（例如表示标签开始和结束的\
  \ `<` 和 `>` ）都有对应的安全实体编码。浏览器遇到*实体编码*时将其识别为转义字符并在视觉上渲染为相应的字符，但至关的一点是，它们不会被视为 HTML\
  \ 标签。列表 7-1 显示了安全的网站将如何输出 图 7-1 中攻击者输入的注释。加粗文本表示可能用于构建 HTML 标签的字符。\n\n```html\n\
  <div class=\"comment\">\n  &lt;script&gt;alert(&quot;HAXXED&quot;)&lt;/script&gt;\n\
  </div>\n```\n\n*列表 7-1: 此处尝试的 XSS 攻击已被防御。*\n\n转义字符到未转义字符的转换发生在浏览器构建完页面 DOM *之后*，因此浏览器将*不会*执行\
  \ `<script>` 标签。通过这种方式转义 HTML 控制字符可以关闭大多数跨站脚本攻击的大门。\n\n由于跨站脚本是一种非常常见的漏洞，现代 Web 框架倾向于默认对动态内容进行转义。特别是模板，通常会在没有要求的情况下转义插值内容。在*嵌入\
  \ Ruby (ERB)* 模板中插值变量的语法如 列表 7-2 所示。\n\n```html\n<div class=\"comment\">\n  <%=\
  \ comment %>\n</div>\n```\n\n*列表 7-2: Embedded Ruby 模板中动态内容的隐式转义*\n\nERB 模板引擎会在评估动态内容时，通过\
  \ `<%= comment %>` 语法自动转义敏感字符。\n\n为了编写原始的、未转义的 HTML（从而容易受到 XSS 攻击），ERB 模板需要显式调用\
  \ `raw` 函数，如 列表 7-3 所示。\n\n```html\n<div class=\"comment\">\n  <%= raw comment %>\n\
  </div>\n```\n\n*列表 7-3: 在 Embedded Ruby 模板中允许原始注入 HTML 的语法*\n\n所有安全的模板语言都遵循相同的设计原则：除非开发者显式选择构建原始\
  \ HTML，否则模板引擎会隐式转义动态内容。确保你理解模板中转义是如何运作的，并在代码审查期间检查动态内容是否已安全转义！特别是，如果你有辅助函数或方法来构建原始\
  \ HTML 以注入到模板中，请检查攻击者是否能够滥用其输入来提交跨站脚本攻击。\n\n## 缓解措施 2：实施内容安全策略\n\n现代浏览器允许网站设置*内容安全策略*，你可以用它锁定你网站上的\
  \ JavaScript 执行。跨站脚本攻击依赖于攻击者能够在受害者的网页上运行恶意脚本，通常是通过在页面 `<html>` 标签内的某处注入 `<script>`\
  \ 标签，这也称为*内联*JavaScript。图 7-2 所示的示例攻击使用了内联 JavaScript，并以注释文本的形式输出。\n\n通过在 HTTP 响应头中设置内容安全策略，你可以告诉浏览器*永远不要*执行内联\
  \ JavaScript。只有通过 `<script>` 标签的 `src` 属性导入时，浏览器才会执行页面上的 JavaScript。典型的内容安全策略头部看起来如\
  \ 列表 7-4 所示。该策略规定脚本可以从同一域（'self'）或 *apis.google.com* 域导入，但不应执行内联 JavaScript。\n\n\
  ```http\nContent-Security-Policy: script-src 'self' https://apis.google.com\n```\n\
  \n*列表 7-4: 在 HTTP 响应头中设置的内容安全策略*\n\n你也可以在网页 HTML 的 `<head>` 元素中的 `<meta>` 标签中设置网站的内容安全策略，如\
  \ 列表 7-5 所示。\n\n```html\n<meta http-equiv=\"Content-Security-Policy\" content=\"\
  script-src 'self' https://apis.google.com\">\n```\n\n*列表 7-5: 在 HTML 文档 <head> 元素中设置的等效内容安全策略*\n\
  \n通过对浏览器加载脚本的域进行白名单限制，你隐式地声明不允许内联 JavaScript。在这个示例内容安全策略中，浏览器将仅从域 *apis.google.com*\
  \ 以及网站所在的域（例如，*[breddit.com](http://breddit.com)*）加载 JavaScript。要允许内联 JavaScript，策略必须包含\
  \ `unsafe-inline` 关键字。\n\n防止内联 JavaScript 的执行是一项极好的安全措施，但这意味着你必须移动任何内联 JavaScript。\n\
  \n\n\n\n\n现在，如果 Google 是一个安全性不那么的公司，可能可以将 URL 中的 `cats` 参数替换为恶意的 JavaScript，并且每当任何人在浏览器中打开该\
  \ URL 时，该 JavaScript 代码就会执行。攻击者可以将该 URL 作为链接通过电子邮件发送给受害者，或者通过将其添加到评论中来诱骗用户访问该 URL。这就是“反射型”（`reflected`）跨站脚本攻击的本质：攻击者在\
  \ HTML 请求中发送恶意代码，然后服务器将其反射回客户端。\n\n幸运的是，Google 雇佣了许多安全专家，因此，如果你尝试在它的搜索结果中插入 `<script>`\
  \ 标签，服务器不会执行该 JavaScript。在过去，黑客曾在 `https://admin.google.com` 上的 Google Apps 管理界面中发现过反射型跨站脚本漏洞，这说明即使是大公司也会栽跟头。如果你想有机会保护你的用户安全，就需要防御这种攻击向量。\n\
  \n### 缓解措施：对 HTTP 请求中的动态内容进行转义\n\n缓解反射型跨站脚本漏洞与缓解存储型跨站脚本漏洞的方法相同：对网站插值到 HTML 页面中的动态内容中的控制字符进行转义。无论动态内容来自后端数据库还是\
  \ HTTP 请求，你都需要以相同的方式对其进行转义。\n\n幸运的是，模板语言通常会对所有插值变量应用转义，无论模板是从数据库加载它们还是从 HTTP 请求中拉取它们。然而，你的开发团队在审计代码时仍然需要意识到通过\
  \ HTTP 请求进行注入的风险。代码审查经常会忽略反射型跨站脚本漏洞，因为开发者太忙于寻找存储型跨站脚本漏洞了。\n\n反射型跨站脚本攻击常见的区域区域是搜索页面和错误页面，因为它们通常会将查询字符串的一部分显示回给用户。确保你的团队理解这些风险，并知道在审查代码更改时如何识别漏洞。存储型跨站脚本攻击往往更具危害性，因为注入到你数据库表中的单段恶意\
  \ JavaScript 代码可以反复攻击你的用户。但反射型攻击更常见，因为它们更容易实现。\n\n在结束本章之前，让我们来看另一种类型的跨站脚本攻击。\n\n\
  ## 基于 DOM 的跨站脚本攻击\n\n化解大多数跨站脚本攻击意味着检查并保护服务器端代码；然而，客户端代码丰富框架的日益普及导致了`基于 DOM 的跨站脚本`的兴起，攻击者通过\
  \ URI 片段将恶意 JavaScript 带入用户的网页中。\n\n要理解这些攻击，你首先需要理解 URI 片段是如何运行的。让我们先回顾一下 `URLs\
  \ (通用资源定位符)`（即浏览器地址栏中显示的地址）的结构。一个典型的 URL 如图 7-3 所示。\n\n![image](img/07fig03.jpg)\n\
  \n图 7-3：典型 URL 的部分\n\nURI 片段是 URL 中 `#` 符号之后的可选部分。浏览器使用 `URI 片段` 进行页内（`intra-page`）导航——如果页面上的\
  \ HTML 标签具有与 URI 片段匹配的 `id` 属性，浏览器会在打开后滚动到该标签。例如，如果你在浏览器中加载 URL `https://en.wikipedia.org/wiki/Cat#Grooming`，浏览器会打开网页，然后滚动到关于猫的\
  \ Wikipedia 页面中的 Grooming 部分。它之所以这样运行，是因为该部分的标题标签看起来类似于列表 7-7 所示。\n\n```html\n<h3\
  \ id=\"Grooming\">Grooming</<h3>>\n```\n\n列表 7-7：与 URI 片段 #Grooming 对应的 HTML 标签\n\
  \n凭借这种非常有用的浏览器内置行为，Wikipedia 允许用户直接链接到页面内的部分，这样你和你的室友就可以解决那个关于猫理毛的争议性问题了。\n\n单页应用（`Single-page\
  \ apps`）也经常使用 URI 片段以直观的方式记录和重新加载状态。这些使用 Angular、Vue.js 和 React 等 JavaScript 框架编写的应用程序实际上是依赖\
  \ JavaScript 的网页，旨在避免浏览器重新加载网页时发生的渲染闪烁（`blink`）。\n\n避免这种渲染闪烁的一种潜在方法是设计整个应用程序在从改变的静态\
  \ URL 下加载，因为更改浏览器地址栏中的 URL 通常是导致重新加载的原因。然而，如果用户对一个不变的 URL 刷新浏览器，浏览器会将网页重置为初始状态，丢失用户之前正在操作的任何信息。\n\
  \n许多单页应用通过使用 URI 片段在浏览器刷新期间保持状态来实现。你经常会看到网页实现“无限滚动”：当用户向下滚动页面时，图片列表会动态加载。URI 片段随之更新，指示用户向下滚动了多远。这样，即使浏览器刷新了，JavaScript\
  \ 代码也可以解释 URI 片段的内容，并在页面刷新时加载相应数量的图片。\n\n根据设计，浏览器在渲染页面时不会向服务器发送 URI 片段。当浏览器接收带有\
  \ URI 片段的 URL 时，它会记录该片段，将其从 URL 中剥离，并将分离后的 URL 发送到网络服务器。在页面上执行的任何 JavaScript 都可以读取\
  \ URI 片段，如果用户收藏了页面，浏览器会将完整的 URL 写入浏览器历史或书签。\n\n遗憾的是，这意味着 URI 片段对于任何服务器端代码都是不可用的——保护服务器端代码无法缓解基于\
  \ DOM 的 XSS。解释和使用片段的客户端 JavaScript 代码需要小心其如何解释内容。如果内容未经过转义并直接写入网页的 DOM 中，攻击者就可以通过此通道带入恶意\
  \ JavaScript。攻击者可以构造一个在 URI 片段中带有某些 JavaScript 的 URL，然后诱骗用户访问该 URL 以发动跨站攻击。\n\n\
  ## 缓解措施：对 URI 片段中的动态内容进行转义\n\n在浏览器中执行的获取 URI 片段部分并构造 HTML 的 JavaScript 代码容易受到基于\
  \ DOM 的跨站脚本攻击。这意味着你在使用客户端代码在 HTML 中插值该值之前，需要对从 URI 片段获取的任何内容进行转义，就像你处理服务器端代码那样。\n\
  \n现代 JavaScript 模板框架的作者完全意识到 URI 片段带来的风险，并反对在代码中构造原始 HTML。例如，在 React 框架中写入未转义 HTML\
  \ 的语法需要开发者调用 `dangerouslySetInnerHTML` 函数，如列表 7-8 所示。\n\n```javascript\nfunction\
  \ writeSomeHTML () {\n  return {__html: 'First &middot; Second'};\n}\n\nfunction\
  \ MyComponent() {\n  return <div dangerouslySetInnerHTML={writeSomeHTML()} />;\n\
  }\n```\n\n列表 7-8：在 React 框架中从文本危险地设置原始 HTML\n\n如果你的客户端 JavaScript 代码复杂，考虑切换到现代 JavaScript\
  \ 框架。这会让代码库更容易管理，并让安全考虑变得更加显而易。既往一样，确保设置适当的内容安全策略。\n\n\n\n\n\n### 总结\n\n在本章中，你学习了跨站脚本攻击（cross-site\
  \ scripting attacks），这种攻击允许攻击者在用户查看你的网站页面时，向页面中注入 JavaScript。攻击者通常会将恶意 JavaScript\
  \ 注入到来自数据库、HTTP 请求或 URI 片的动态内容。你可以通过对动态内容中的任何 HTML 控制字符进行转义，以及设置内容安全策略（CSP）来防止内联\
  \ JavaScript 的执行，从而防御跨站脚本攻击。\n\n在下一章中，你将查看另一种攻击者用来捕猎你网站用户的方法：跨站请求伪造。\n\n# 8 跨站请求伪造攻击\n\
  \n![image](img/common01.jpg)\n\n在上一章中，你已经看到攻击者如何利用跨站脚本攻击，通过评论区、搜索结果和 URL 等页面元素向用户的\
  \ Web 浏览器注入 JavaScript。现在，你将查看攻击者如何利用恶意链接来入侵你的用户。\n\n没有哪个网站是孤岛。因为你的网站有公共 URL，其他网站经常链接到它，作为网站所有者，你通常应该鼓励这样做。指向你网站的入站链接越多，意味着流量越大、搜索引擎排名越靠。\n\
  \n然而，并不是所有链接到你网站的人都有好意。攻击者可以欺骗用户点击恶意链接，从而触发不希望或意料之外的副作用。这被称为跨站请求伪造（CSRF 或 XSRF）。安全研究人员有时将\
  \ CSRF 读作“sea-surf”。\n\nCSRF 是一种极其常见的漏洞，大多数主流网站都曾在某个时候表现出这种漏洞。攻击者已使用 CSRF 窃取 Gmail\
  \ 联系人列表、在 Amazon 上触发一键购买以及更改路由器配置。本章将检查 CSRF 攻击通常是如何运作的，并展示了一些用于防御此类攻击的编码实践。\n\n\
  ## CSRF 攻击剖析\n\n攻击者通常通过利用实现更改 Web 服务器状态 GET 请求的网站来发动 CSRF 攻击。当受害者点击链接时会触发 GET 请求，这允许攻击者为目标网站构造误导性链接以执行意料之外的操作。GET\
  \ 请求是唯一将整个请求内容包含在 URL 中的 HTTP 请求类型，因此它们对 CSRF 攻击特别地脆弱。\n\n在 Twitter 的早期版本中，你可以通过\
  \ GET 请求创建推文，而不是该网站目前使用的 POST 请求。这一疏忽使得 Twitter 容易受到 CSRF 攻击：它使得创建 URL 链接成为可能，点击后就会在用户的时间线上发布推文。列表\
  \ 8-1 显示了其中一个 URL 链接。\n\n```\nhttps://twitter.com/share/update?status=in%20ur%20twitter%20CSRF-ing%20ur%20tweets\n\
  ```\n\n*列表 8-1：一个链接，在过去某时刻点击后会将“ur twitter CSRF-ing ur tweets”中的文本推文到受害者的时间线上*\n\
  \n一个机灵的黑客利用这个漏洞在 Twitter 上创建了一个病毒式传播蠕虫。由于他们可以使用单个 GET 请求来编写推文，他们构造了一个恶意链接，该链接点击后就会发布一条包含色情信息和相同恶意链接的推文。当该推文的读者点击由第一个受害者推文的链接时，他们也被欺骗去发布了相同的内容。\n\
  \n该黑客欺骗了几个受害者点击恶意链接，这些受害者在时间线上发布了意料之外的帖子。随着越来越多的用户阅读原始推文并出于好奇点击嵌入的链接，他们也发布了相同的内容。很快，成千上万的\
  \ Twitter 用户被诱骗表达他们骚扰羊的欲望（初始推文的内容）。第一个 Twitter 蠕虫诞生了，Twitter 开发团队在局面失控之前匆忙修复了这个安全漏洞。\n\
  \n## 缓解措施 1：遵循 REST 原则\n\n为了保护你的用户免受 CSRF 攻击，请确保你的 GET 请求不会更改服务器状态。你的网站应该只使用 GET\
  \ 请求来获取网页或其他资源。对于更改服务器状态的操作——例如用户登录或注销、重置密码、编写文章或关闭账户——你应该仅通过 `PUT`、`POST` 或 `DELETE`\
  \ 请求来执行。这种设计哲学被称为表述状态转移（REST），除了防御 CSRF 外，它还有许多其他好处。\n\nREST 规定，你应该根据意图将网站操作映射到适当的\
  \ HTTP 方法。你应该使用 `GET` 请求获取数据或页面，使用 `PUT` 请求在服务器上创建新对象（如评论、上传或消息），使用 `POST` 请求修改服务器上的对象，并使用\
  \ `DELETE` 请求删除对象。\n\n并不是所有操作都有明显对应的 HTTP 方法。例如，当用户登录时，关于用户是在创建一个新会话还是修改其状态是一个哲学性讨论。然而，在防御\
  \ CSRF 攻击方面，关键是要避免将更改服务器状态的操作分配给 `GET` 请求。\n\n保护你的 `GET` 请求并不意味着其他类型的请求中没有漏洞，正如你将在第二种缓解措施中看到的。\n\
  \n## 缓解措施 2：实现反 CSRF Cookie\n\n消除你的 `GET` 请求的风险可以关闭大多数 CSRF 攻击的大门，但你仍然需要防御使用其他 HTTP\
  \ 动词的请求。使用这些动词的攻击比基于 GET 的 CSRF 攻击少得多，且需要更多工作，但如果攻击者认为回报足够，他们可能会尝试尝试。\n\n例如，他们可以通过让受害者提交托管在攻击者控制的第三方网站上的恶意表单或脚本，从而欺骗用户向你的网站发起\
  \ `POST` 请求。如果你的网站在响应 `POST` 请求时执行敏感操作，你就需要使用反 CSRF Cookie 来确保这些请求仅从你的网站发起。\n\n\
  反 CSRF Cookie 是一种随机的字符串令牌，Web 服务器将其写入命名的 Cookie 参数。回想一下 Cookie 是在浏览器和 Web 服务器之间通过\
  \ HTTP 请求头传递的小段文本。如果 Web 服务器返回包含类似 `Set-Cookie: _xsrf=59782d4ef31` 值的 HTTP 响应，浏览器将在下次\
  \ HTTP 请求通过 `Cookie: _xsrf=59782d4ef31` 返回相同的信息。\n\n安全的网站使用反 CSRF Cookie 来验证 `POST`\
  \ 请求来自同域名。网站上的 HTML 页面在生成 `POST` 请求的任何 HTML 表单中添加相同的字符串令牌 `<input type=\"hidden\"\
  \ name=\"_xsrf\" value=\"59782d4ef31\">`。当用户向服务器提交表单时，如果 Cookie 中的 `_xsrf` 值与请求体中的\
  \ `_xsrf` 值不匹配，服务器将完全拒绝该请求。通过这种方式，服务器验证并确保请求源自内部而非恶意第三方网站；浏览器*仅*在 Web 页面从同域名加载时才会发送所需的\
  \ Cookie。\n\n大多数现代 Web 服务器都支持反 CSRF Cookie。务必查阅你所选 Web 服务器的安全文档以了解它们如何实现这些 Cookie，因为语法在不同的\
  \ Web 服务器之间略有不同。列表 8-2 显示了 Tornado Web 服务器的一个包含反 CSRF 保护的模板文件。\n\n```html\n<form\
  \ action=\"/new_message\" method=\"post\">\n❶ {% module xsrf_form_html() %}\n   <input\
  \ type=\"text\" name=\"message\"/>\n   <input type=\"submit\" value=\"Post\"/>\n\
  </form>\n```\n\n*列表 8-2：使用 Python 编写的 Tornado Web 服务器模板文件，包含反 CSRF 保护*\n\n\n\n\n\
  \n在本示例中，`xsrf_form_html()` 函数 ❶ 生成一个随机令牌，并将其作为输入元素写入 HTML 表单中，如下所示：`<input type=\"\
  hidden\" name=\"_xsrf\" value=\"5978e29d4ef434a1\">`。随后， Tornado Web 服务器会将相同的令牌写入\
  \ HTTP 响应头，设置为 `Set-Cookie: _xsrf=5978e29d4ef434a1`。当用户提交表单时，Web 服务器会验证表单中的令牌与返回\
  \ Cookie 头中的令牌是否匹配。浏览器安全模型会根据同源策略返回 Cookie，因此 Cookie 值只能由 Web 服务器设置。因此，服务器可以确定 `POST`\
  \ 请求源自宿主网站。\n\n你还应该使用反 CSRF Cookie 来验证来自 JavaScript 的 HTTP 请求，这允许你同时也保护 `PUT` 和\
  \ `DELETE` 请求。JavaScript 需要从 HTML 中查询出反 CSRF 令牌，并在 HTTP 请求中将其传回给服务器。\n\n在实现了反 CSRF\
  \ Cookie 之后，你的网站应该变得安全得多。现在，你需要堵住最后一个漏洞，以确保攻击者无法窃取你的反 CSRF 令牌并将其嵌入恶意代码中。\n\n###\
  \ 缓解措施 3：使用 SameSite Cookie 属性\n\n必须实现的针对 CSRF 攻击的最后防护是在设置 Cookie 时指定 `SameSite`\
  \ 属性。默认情况下，当浏览器向你的网站生成请求时，会将该站点设置的最后已知 Cookie 附加到请求中，无论请求来源如何。这意味着恶意的跨站请求将带有你之前设置的任何安全\
  \ Cookie 到你的 Web 服务器。这本身并不能击反 CSRF 措施，但如果攻击者从你的 HTML 表单中窃取了安全令牌并将其安装在自己的恶意表单中，他们仍然可以发起\
  \ CSRF 攻击。\n\n在设置 Cookie 时指定 `SameSite` 属性会告诉浏览器，当请求从外部域名（例如由攻击者建立的恶意网站）生成时，剥离向你站点发送的请求中的\
  \ Cookie。在列表 8-3 中使用 `SameSite=Strict` 语法设置 Cookie，可以确保浏览器仅在从你网站内部发起的请求中发送 Cookie。\n\
  \n```\nSet-Cookie: _xsrf=5978e29d4ef434a1; SameSite=Strict;\n```\n\n*列表 8-3：为我们的反\
  \ CSRF Cookie 设置 SameSite 属性，可以确保 Cookie 仅附加到来自我们网站的请求。*\n\n在所有 Cookie（而不只是用于 CSRF\
  \ 防护的 Cookie）上设置 `SameSite` 属性是一个好主意。但有一个例外：如果你使用 Cookie 进行会话管理，为会话 Cookie 设置 `SameSite`\
  \ 属性会移除从其他网站生成的指向你站点的请求中的 Cookie。这意味着指向你站点的任何入站链接都将强制用户重新登录。\n\n对于已经在你网站上开启会话的用户来说，这种行为可能有些麻烦。想象一下，如果每有人分享视频，你就必须重新登录\
  \ Facebook。这很令人沮丧，对吧？为了防止这种行为，列表 8-4 显示了一个更有用的 `SameSite` 属性值 `Lax`，它允许来自其他站点的 `GET`\
  \ 请求发送 Cookie。\n\n```\nSet-Cookie: session_id=82938d911e13f5; SameSite=Lax;\n```\n\
  \n*列表 8-4：在 HTTP Cookie 上设置 SameSite 属性允许在 GET 请求中使用 Cookie。*\n\n这允许无缝链接到你的网站，但剥夺了攻击者伪造\
  \ `POST` 请求等恶意操作的能力。只要你的 `GET` 请求是无副作用的，此设置的安全性并不不差。\n\n### 额外缓解措施：对敏感操作要求重身份验证\n\
  \n你可能会发现，某些网站在你执行敏感操作时（例如更改密码或发起支付时）会强制你重新确认登录信息。这被称为重身份验证（reauthentication），它是保护网站免受\
  \ CSRF 攻击的常用方法，因为它向用户提供了一个明确指示，表明你正要执行某些重大且潜在危险的操作。\n\n重身份验证还有一个积极副作用，即如果用户不小心在共享或被盗的设备上保持登录状态，它可以保护你的用户。如果你的网站处理财务交易或机密数据，强烈考虑在用户执行敏感操作时强制他们重新输入凭据。\n\
  \n### 总结\n\n攻击者可以使用来自其他站点的 Web 请求欺骗你的用户执行意外的操作。此类跨站请求伪造攻击的解决方案有三个方面。\n\n首先，确保你的\
  \ `GET` 请求是无副作用的，这样当用户点击恶意链接时，服务器状态就不会改变。其次，使用反 CSRF Cookie 来保护其他类型的请求。第三，在设置这些\
  \ Cookie 时使用 `SameSite` 属性，以剥离由其他站点生成的请求中的 Cookie。\n\n对于网站上非常敏感的操作，要求用户在请求执行这些操作时重新身份验证是一个好主意。这增加了防范\
  \ CSRF 攻击的额外保护层，并在用户不小心在共享或被盗的设备上保持登录状态时保护他们。\n\n在下一章中，你将查看黑客尝试如何在身份验证过程中利用漏洞。\n\
  \n# 9：破解身份验证\n\n![image](img/common01.jpg)\n\n大多数网站都提供某种登录功能。这是身份验证的一种，即在用户返回你的网站时识别其身份的过程。对用户进行身份验证允许他们在在线社区中拥有身份，并在那里贡献内容、发送消息、进行购买等。\n\
  \n如今，互联网用户习惯于使用用户名和密码注册网站，并在下次使用时重新登录。由于浏览器和插件帮助缓存或选择密码，而且第三方身份验证服务已无处不在。\n\n然而，这也有缺点。获取用户的账户访问权限对黑客来说是一个非常有前景的。在互联网时代，黑客在暗网上出售窃取的凭据、劫持社交媒体账号传播点击饵以及进行财务欺诈从未如此简单。\n\
  \n在本章中，你将研究黑客如何在身份验证过程中破解你网站的用户账户。（下一章涵盖用户在登录并建立会话后面临的漏洞。）在这里，你首先将看到网站实现身份验证的最常见方式并观察攻击者如何使用暴力攻击来利用它们。然后你将学习如何通过第三方身份验证、单登录和保护自己的身份验证系统来保护用户。\n\
  \n## 实现身份验证\n\n身份验证是超文本传输协议的一部分。为了提出身份验证挑战，Web 服务器需要在 HTTP 响应中返回 401 状态码并添加 `WWW-Authenticate`\
  \ 头来描述首选的身份验证方法。（有两种常用的身份验证方法：基础认证和摘要认证。）为了满足这一要求，用户代理（通常是 Web 浏览器）需要向用户请求用户名和密码，从而创建登录功能。\n\
  \n在基础认证方案中，浏览器将用户提供的用户名和密码用冒号（:`）连接起来，生成 `username:password` 字符串。然后，它使用 Base64 算法对该字符串进行编码，并在\
  \ HTTP 请求的 `Authorization` 头中将其传给服务器。\n\n\n\n\n\n`digest authentication`（摘要认证）方案要复杂得多，它要求浏览器生成包含用户名、密码和\
  \ URL 的哈希值。`hash` 是单向加密算法的输出，它能很容易地为一组输入数据生成唯一的“指纹”，但如果你只有算法的输出，就很难推测出输入值。在本章稍后讨论如何安全地存储密码时，我们将更深入地研究哈希。\n\
  \n## HTTP 原生认证\n\n尽管身份验证已内置在超文本传输协议（HTTP）中，但流行的网站很少使用基础（basic）或摘要（digest）认证——主要是出于可用性的考虑。原生的\
  \ 浏览器身份验证提示`不是`什么美东西。它看起来类似于 `JavaScript` 警告对话框，会夺取浏览器的焦点并中断用户访问网站的体验，如图 9-1 所示。\n\
  \n由于浏览器在 HTML 之外实现身份验证提示，我们无法对原生认证提示进行样式设置以匹配网站。由于作为一个不出现在网页中的原生浏览器窗口，浏览器也无法自动填充用户的凭据。最后，由于\
  \ HTTP 认证没有规定在用户忘记密码时的重置方法，我们必须在登录提示之外单独实现重置功能，这会导致困惑的用户体验。\n\n![image](img/09fig01.jpg)\n\
  \n*图 9-1：原生的 Google Chrome 登录提示粗鲁地中断了你的浏览会话。*\n\n## 非原生认证\n\n由于这种对用户不利的设计，内置的 HTTP\
  \ 认证方法通常只用于那些对用户体验并不重要的应用程序。现代网站通常会在 HTML 中实现自己的登录表单，如代码列表 9-1 所示。\n\n```html\n\
  <form action=\"/login\" method=\"post\">\n\n❶ <input type=\"email\" name=\"username\"\
  \ placeholder=\"Type your email\">\n\n❷ <input type=\"password\" name=\"password\"\
  \ placeholder=\"Type your password\">\n   <input type=\"submit\" name=\"login\"\
  \ value=\"Log in\">\n\n</form>\n```\n\n*代码列表 9-1：典型的 HTML 登录表单*\n\n典型的登录表单包含一个 `<input\
  \ type=\"text\">` 元素 ❶，要求用户提供用户名；以及一个 `<input type=\"password\">` 元素 ❷，它会将输入的字符替换为\
  \ `•` 字符以隐藏密码。当用户提交表单时，提供的用户名和密码将作为 `POST` 请求发送到服务器。如果因为无法验证用户身份导致登录失败，服务器会在 HTTP\
  \ 响应中返回状态 `401`。如果登录成功，服务器会将用户重定向到主页。\n\n## 暴力攻击\n\n攻击者经常尝试通过猜测密码在身份验证点攻破你的网站。电影通常描绘黑客利用对目标的个人了解来猜密码。虽然这对于高知名目标可能是一个担忧，但黑客通常使用`暴力攻击`\
  \ 更有成功率，这种攻击使用脚本对登录页面尝试数千个常用密码。由于之前的数据泄露已经泄露了数百万常用密码（包括代码列表 9-2 中的那些），攻击者很容易判断应该先尝试哪些密码。\n\
  \n1. 123456\n2. password\n3. 12345678\n4. qwerty\n5. 12345\n6. 123456789\n7. letmein\n\
  8. 1234567\n9. football\n10. iloveyou\n\n*代码列表 9-2：安全研究人员每年发布一份最常用密码列表；每年之间变化很小。（此列表由网络安全公司\
  \ SplashData 提供。）*\n\n让我们看看通过哪些方法来实现并保护你的认证以抵御此类威胁。\n\n### 缓解措施 1：使用第三方认证\n\n最安全的身份验证系统是你不需要自己编写的那个。与其实现自己的身份验证系统，不如考虑使用如\
  \ `Facebook Login` 等第三方服务，它允许用户使用他们的社交媒体凭据在你的网站进行认证。这对他们来说很方便，也减轻了你存储用户密码的负担。\n\n\
  大型科技公司提供其他类似的认证服务。它们中的大多数基于 `open authentication (OAuth)` 或 `OpenID` 标准——这些是用于将身份验证委托给第三方的常用协议。你可以随时混合使用身份验证系统。它们通常易于集成，因此选择与你的用户群体相匹配的一个或多个即可。如果你提供与电子邮件相关的服务，可以集成\
  \ `Google OAuth` 来请求用户访问其 `Gmail 账户`。如果你提供技术服务，可以使用类似 `GitHub OAuth` 的工具。Twitter、微软、LinkedIn、Reddit\
  \ 和 Tumblr 都提供了认证选项，数百个其他网站也是如此。\n\n### 缓解措施 2：与单点登录集成\n\n如果你与 `OAuth` 或 `OpenID`\
  \ 身份提供者集成，你的用户通常会使用个人邮箱作为用户名。然而，如果你的网站的目标受众是商务用户，请考虑集成 `Okta`、`OneLogin` 或 `Centrify`\
  \ 等`单点登录 (SSO)` 身份提供者，它可以跨企业系统集中认证，让员工可以使用业务邮箱无缝登录第三方应用程序。公司管理员对哪些员工可以访问哪些网站保留最终控制权，用户凭据安全存储在公司服务器上。\n\
  \n要与单点登录提供者集成，你通常需要使用 `Security Assertion Language (SAML)`，这是一个比 `OAuth` 或 `OpenID`\
  \ 更旧（且不那么友好）的标准，尽管大多数编程语言都有成熟的 SAML 库可以使用。\n\n（注：尽管第三方认证通常比你自己的系统更安全，但仅使用第三方认证可能会在某种程度上限制你的用户，因为并不是每个人都有社交媒体或\
  \ Gmail 账号。对于其他人，你需要一种方法让他们注册并手动选择用户名和密码。这意味着要在你的网站上创建单独的页面供用户注册、登录和注销；外编写代码在数据库中存储和更新凭据，并在用户重新输入时检查凭据是否正确。很有可能，你还需要一个让用户更改密码的机制。）\n\
  \n这要实现的功能太多了！在开始编写代码之前，你需要做一些设计决定。让我们看看为了拥有一个安全的身份验证系统，你需要正确处理的关键点。\n\n#### 要求用户名、电子邮件地址或两者都要\n\
  \n你的用户在注册时需要选择用户名和密码。大多数网站还会要求用户在注册时提交一个有效的电子邮件地址，以便在用户忘记凭据时发送重置密码邮件。\n\n对于许多网站，用户的电子邮件地址*就是*他们的用户名。由于需要，每个邮箱地址必须唯一对应一个账户，因此选择独立的用户名通常是多余的。例外是用户在网站上有可见的身份；例如，当用户拥有个人资料，或在评论区与其他用户互动时。这类网站要求用户选择一个独立的`显示名称`。将电子邮件地址作为显示名称是一个坏习惯，因为它会招来骚扰和垃圾邮件。\n\
  \n##### 验证电子邮件地址\n\n\n\n\n\n如果你打算从你的网站发送电子邮件——例如，允许用户重置密码——你来说验证每个用户的电子邮件地址都对应一个运行良好的电子邮件账户。网站生成的电子邮件被称为`事务性邮件`（transactional\
  \ emails），因为网站是为了响应用户的操作而发送这些邮件。向未验证的地址发送`事务性邮件`会迅速让你被电子邮件服务提供商列入黑名单，因为他们对开启垃圾邮件发送功能非常警惕。\n\
  \n首先，验证用户的电子邮件地址在表面上是否有效。这意味着验证邮件中是否仅包含有效字符：字母、数字或任何特殊字符（`!#$%&'*+-/=?^_`{|}~;.`）。\n\
  \n地址必须包含一个 `@` 符号，并且在该符号右侧有一个有效的互联网域名。通常情况下（但并非总是），该域名应该对应一个网站，例如 `@gmail.com` 地址对应于\
  \ `[www.gmail.com](http://www.gmail.com)`。至少，我们在第 2 章中讨论过的互联网`域名系统 (DNS)` 必须包含一个该域的邮件交换（`MX`）记录，告诉软件应向何处路由电子邮件。你可以在验证过程的一部分查找\
  \ `MX` 记录，如列表 9-3 所示。\n\n```python\nimport dns.resolver\n\ndef email_domain_is_valid(domain):\n\
  \  for _ in dns.resolver.query(domain, 'MX'):\n    return True\n  return False\n\
  ```\n*列表 9-3: 使用 dnsresolver 库通过 Python 验证域名能够接收电子邮件*\n\n然而，验证地址是否对应运行良好的电子邮件账户的唯一\
  \ 100% 可靠的方法是发送一条电子邮件消息并检查它是否被接收。这意味着你必须向每个用户发送一封邮件，其中包含一个`电子邮件验证链接`，该链接链回你的网站并包含一个`验证令牌`（validation\
  \ token）——这是一个你存储在数据库中、与该用户电子邮件地址关联的大型随机生成的字符串。当用户点击链接来验证其电子邮件地址的所有权时，你可以检查该`验证令牌`是否是你发送的那个，并确认他们确实拥有该电子邮件账户的访问权限。\n\
  \n许多网站强制用户在完成注册流程之前验证其电子邮件。其他网站则允许用户在未验证状态下使用网站上的有限功能，以使注册流程变得不那么麻烦。在验证用户之前，你永远不要假设用户拥有电子邮件账户的访问权限。在此之前，不要发送任何其他类型的事务性邮件，也不要将用户加入邮件列表列表！\n\
  \n### 禁用一次性电子邮件账户\n\n某些用户不愿使用他们常用的电子邮件地址注册，他们会使用由 10 Minute Mail 或 Mailinator 等服务生成的临时电子邮件账户，或者如图\
  \ 9-2 所示的账户来注册你的网站。这类服务生成的一次性电子邮件账户仅用于在关闭前接收几条消息。如果用户使用此类服务，通常意味着他们担心被加入邮件列表列表（考虑到电子邮件营销人员无休无止的攻势，这是一个非常合理的考虑）。\n\
  \n如果例如，你的某些用户正在生成临时账户来骚扰他人，你可能需要禁止用户使用一次性电子邮件地址注册。如果是这样，你可以使用维护良好的一次性电子邮件提供者黑名单，在注册过程中检测、拒绝并禁用一次性电子邮件域名。\n\
  \n![image](img/09fig02.jpg)\n*图 9-2: 想要临时电子邮件地址吗？来 [`www.sharklasers.com/`](https://www.sharklasers.com/)\
  \ 获取吧。（是的，这是一个真实的网站。砰砰砰。）*\n\n### 安全重置密码\n\n为每个用户拥有一个验证过的电子邮件地址允许你处理用户忘记密码的（不可避免的这种情况。只需向他们发送一封包含`密码重置链接`的邮件，其中包含一个全新的验证令牌。当健忘的用户打开邮件并点击链接时，你可以验证传入的令牌，并允许用户为账户选择新密码。\n\
  \n密码重置链接应该是短效的，并且在用户使用后应当过期。一个好的经验是在重置令牌在 30 分钟后过期，以防止攻击者滥用过期的重置链接。如果攻击者黑进了用户的电子邮件账户，你绝不能让他们搜索包含重置链接的邮件，然后通过使用这些链接以受害者的身份访问你的网站。\n\
  \n#### 要求复杂密码\n\n复杂的密码通常更难破解，因此为了用户自身的保护，你应该在他们选择密码时要求他们符合某些密码复杂度标准。复杂密码包括数字、符号以及字母，具有大小写字母混合，并且是长的而不是短的。至少，你应该强制执行密码长度至少八个字符，但越长越好。（研究表明，密码长度比混合不常用的字符更重要。）\n\
  \n然而，用户通常很难记住复杂的密码，所以如果你强制执行过于严格的密码复杂度要求，用户通常会重用他们之前在另一个网站上输入过的密码。一些安全的网站会防止用户重用之前使用过的密码，迫使他们每次都选择新的、唯一的密码，从而引导他们远离懒惰的习惯。遗憾的是，大多数用户会简单地通过在常用密码末尾添加一个数字来循环密码，这并不会让密码变得显著更难破解。\n\
  \n归结底，每个用户都对自己的在线安全负责，因此通常引导用户做出强效的选择比强迫他们通过重重关卡要好。一些 JavaScript 库，如 `password-strength-calculator`\
  \ 库，可以在用户输入时对密码复杂度进行评分，并列出常用密码，这些可以用于注册界面和密码重置界面。\n\n#### 安全地存储密码\n\n在用户选择密码后，你需要以某种形式将其记录在数据库中并与用户名关联，以便在他们以后登录时可以重新验证凭据。不要直接原样存储密码——我们称之为`明文`存储，这是大忌。如果攻击者访问了以明文形式存储密码的数据库，他们破解每个用户账户，以及这些用户在其他网站上相同凭据的账户。幸运的是，有一种安全存储密码的方法，使其在数据库中是不可读，但允许你在之后检查用户是否正确输入。\n\
  \n### 哈希密码\n\n密码在存储到数据库之前，应该使用`加密哈希算法`进行处理。这会将原始文本字符串转换为固定长度的位字符串，使得反转该过程在计算上是不可能的。你应该将该算法的输出值——`哈希值`——与用户名一起存储。\n\
  \n哈希算法是一种单向数学函数。猜测生成给定哈希输出（简称为 `hash`）的输入字符串的唯一可行方法是按顺序尝试所有可能的输入字符串。通过存储用户密码的哈希值，你可以在用户重新输入密码时重新计算哈希，并比较新旧哈希值以查看他们是否输入了正确的密码。\n\
  \n\n\n\n\n存在许多加密哈希算法，每种算法都有不同的实现方式和优点。一个良好的哈希算法计算应该很快，但不能过快。否则，随着计算速度的提高，通过枚举所有可能的输入来破解密码的暴力破解将变得可行。因此，一种值得使用的优秀算法是\
  \ `bcrypt`，如列表 9-4)\n\n# 检查未哈希的密码与之前哈希过的密码是否匹配\n\nif bcrypt.checkpw(password, hashed):\n\
  \    print(\"It matches!\")\nelse:\n    print(\"It does not match :(\")\n```\n*列表\
  \ 9-4：在 Python 中使用 bcrypt 算法对密码进行哈希并测试*\n\n❶处的 `rounds` 参数可以增加以使密码哈希更强。存储哈希后的密码而不是明文密码安全得多。任何访问数据库的人（包括你）都无法直接破解密码，但你的网站仍然可以判断用户是否正确重新输入了密码。这减轻了你的安全负担——即使攻击者黑了你的数据库，他们对哈希后的密码也做不了什么。\n\
  \n### 加盐（Salting Hashes）\n对密码进行哈希会让你的网站更安全，但用户在选择密码时通常缺乏想象力。在破解密码列表时——即对泄露的密码哈希列表进行逆向工程破解密码——黑客经常使用彩虹表（rainbow\
  \ tables），这种表是经过已知哈希算法处理的常用密码列表。将哈希值与预计算的值进行匹配对攻击者来说回报非常丰厚，使他们能够确定许多（如果不是大多数）哈希的密码。\n\
  \n为了防止彩虹表攻击，你需对密码哈希进行“加盐”（`salt`），这意味着在哈希算法中引入一个随机元素，使得输入密码不再唯一决定生成的哈希值。你可以将盐输入值存储在配置中，或者更好的是为每个用户单独生成一个盐输入值并将其与其密码哈希一起存储。这使得彩虹表攻击变得不可行，因为攻击者必须为你使用的每个盐值重新生成整个彩虹表，这在计算上是不可接受的，因此耗时过长。\n\
  \n### 要求多因素身份验证\n无论你如何安全地存储密码，基于密码的身份验证系统总是受到暴力破解的攻击。要真正保护你的网站，请考虑通过要求多因素身份验证（MFA）来增加额外的安全层，这要求返回用户通过以下三类信息中的至少两类来识别身份：他们知道的、他们拥有的以及他们特征的。多因素身份验证的一个例子是银行\
  \ ATM，它需要账户持有者的 PIN 码（他们知道的）和银行卡（他们拥有的）。另一个例子是使用生物识别识别个人的设备，如智能手机上的指纹扫描（他们特征的）。\n\
  \n对于网站，多因素身份验证通常意味着需要用户名和密码（用户知道的），并确认用户在智能手机上安装了身份验证器（他们拥有的）。每个用户在注册期间需要将身份验证器\
  \ App 与网站同步（通常通过拍摄屏幕上二维码的照片）。此后，App 会生成一个六位随机数，用户在登录时需要提供该数字才能成功登录，如图 9-3 所示。\n\n\
  ![image](img/09fig03.jpg)\n*图 9-3：你的用户将喜欢输入这六位数字。*\n\n这迫使攻击者必须掌握受害者的凭据并访问受害者的手机才能破解其账户，这是一种极小可能的组合。考虑到智能手机的普及，多因素身份验证正日益成为常态。如果你的网站进行任何类型的财务处理，你绝对应该实现多因素身份验证。幸运的是，许多代码库使其集成变得相对容易。\n\
  \n### 实现和保护退出功能\n如果你在网站上对用户进行身份验证，不要忘记添加一个让让他们退出网站的函数。鉴于用户似乎永远登录社交媒体，这可能看起来是一个过时的想法，但对于在共享设备上登录的用户来说，注销功能是一个关键的安全考虑因素。许多家庭共享一台笔记本电脑或\
  \ iPad，公司经常重复使用计算机和便携设备，因此确保让用户注销！\n\n你的注销函数应该清除浏览器中的会话 Cookie，如果你在服务器端存储了它，则使会话标识失效。这可以防止那些事后成功拦截会话\
  \ Cookie 并尝试使用盗取的 Cookie 重新建立会话的攻击者。清除会话 Cookie 只需要返回一个包含 `Set-Cookie` 头的 HTTP 响应，并将你的会话参数设为空。\n\
  \n### 防止用户枚举（User Enumeration）\n如果攻击者无法枚举用户——即通过从列表中测试每个用户名以查看其是否存在于你的网站上——那么你就可以降低攻击者破解你身份验证系统的风险。攻击者经常使用从之前的黑客攻击泄露的凭据，并尝试验证目标网站上是否存在这些用户名中的任何。在他们缩小范围后，他们将继续为匹配的用户名猜想密码。\n\
  \n#### 防止潜在的枚举漏洞\n登录页面通常允许攻击者判断网站上的某个用户名是否被占用。如果页面对错误密码显示的错误信息与对未知用户的错误信息不同，那么攻击者就可以根据响应推断出某些用户名是否对应于你网站上存在的账户。为了避免泄露此类信息，保持错误信息的通用性非常重要。例如，当用户名无法识别或密码错误时，简单地使用“用户名或密码错误”的错误信息。\n\
  \n攻击者还可能使用计时攻击通过测量 HTTP 响应时间来枚举用户。哈希密码是一个耗时的操作；虽然它通常不到一秒，但仍然是一个可以衡量的时间。如果你的网站仅在用户输入有效用户名时计算密码哈希，攻击者就可以通过测量稍慢的响应时间来推断网站上哪些账户。确保你的网站在身份验证期间，即使对于无效用户名也会计算密码哈希。\n\
  \n你还应该防止密码重置屏幕泄露用户名是否存在。如果攻击者点击“忘记密码”链接并输入电子邮件地址以请求密码重置链接，页面上的响应信息不应揭示是否发送了重置邮件。这可以防止攻击者知道该电子邮件地址是否与你网站上的账户相关。保持信息中立：诸如“检查您的收件箱”。\n\
  \n#### 实现 CAPTCHA\n\n\n\n\n\n你还可以通过实现 `CAPTCHA（全自动区分人类与图灵测试）` 来防御用户枚举攻击，它要求网络用户执行各种图像识别任务，这些任务对人类来说轻而易举，但对计算机来说却很难。像图\
  \ 9-4 所示的 CAPTCHA 使得攻击者通过黑客脚本滥用网页变得不再现实。\n\nCAPTCHA 并非完美。攻击者可以使用复杂的机器学习技术，或者通过付费人类用户代为完成任务来击败它们。然而，它们通常足够足以阻止大多数黑客尝试，而且你可以轻松地将其添加到网站中。例如，Google\
  \ 实现了一个名为 `reCAPTCHA` 的 CAPTCHA 组件，你只需要几行代码即可将其安装在网站上。\n\n![image](img/09fig04.jpg)\n\
  \n*图 9-4：某些任务对计算机成功完成太难了。*\n\n### 总结\n\n黑客经常尝试攻击你的身份验证系统，以窃取用户的凭据。为了保护你的网站，你可以使用如\
  \ `Facebook Login` 这样的第三方身份验证系统或单点登录提供商。\n\n如果你正在实现自己的身份验证系统，你需要让用户在注册时选择用户名和密码。你还应该为每个用户存储并验证电子邮件地址。将此电子邮件作为用户名是有意义的，除非你需要用户拥有可见的显示名称。\n\
  \n验证电子邮件地址的唯一可靠方法是发送一封包含链接的邮件，其中包含一个唯一的临时验证令牌，当用户点击该链接时，你的网站可以检查该令牌。针对忘记密码用户的密码重置机制也应该以相同的方式工作。重置密码邮件和初始验证邮件应该在一段时间后过期，并在首次使用后过期。\n\
  \n在存储密码之前，你应该使用密码学哈希算法对密码进行处理。你还应该对密码哈希进行加盐（salt），以防止彩虹表攻击。\n\n如果你的网站托管敏感数据，请考虑添加多因素身份验证。确保在网站的某处包含注销功能。保持登录失败信息的通用性，以防止黑客在你的网站上进行用户名枚举。\n\
  \n在下一章节中，你将调查网站用户在登录后，其账户可能被破解的方法，即其会话（session）被攻击者窃取。\n\n# 10 会话劫持\n\n![image](img/common01.jpg)\n\
  \n当网站成功验证用户身份时，浏览器和服务器会开启一个会话。`session` 是一种 HTTP 会话，其中浏览器发送一系列与用户操作相应的 HTTP 请求，Web\
  \ 服务器将这些请求识别为来自同一个已验证用户，而无需要求用户在每次请求时都重新登录。\n\n如果黑客可以访问或伪造浏览器发送的会话信息，他们就可以访问你网站上的任何用户账户。坦率地说，现代\
  \ Web 服务器包含了安全的会话管理代码，这使得攻击者操纵或伪造会话实际上几乎是不可能的。然而，即使服务器的会话管理功能没有漏洞，黑客仍然可以在会话进行期间窃取他人的有效会话；这被称为\
  \ `session hijacking（会话劫持）`。\n\n会话劫持漏洞通常比前一章讨论的身份验证漏洞风险更大，因为同样，它们允许攻击者访问你的任何用户账户。这种前景非常诱人，以至于黑客已经发现了许多劫持会话的方法。\n\
  \n在本章中，你首先将查看网站是如何实现会话管理的。然后，你将学习黑客劫持会话的三种方式：Cookie 窃取、会话固定以及利用弱的会话 ID。\n\n## 会话的工作原理\n\
  \n要理解攻击者如何劫持会话，你首先需要理解用户和 Web 服务器开启会话时发生了什么。\n\n当用户在 HTTP 下验证身份时，Web 服务器会在登录过程中为他们分配一个会话标识符。`session\
  \ identifier (session ID)`——通常是一个大型随机生成的数字——是浏览器在随后的每个 HTTP 请求中需要传输的最少信息，以便服务器能够与已验证用户继续\
  \ HTTP 会话。Web 服务器识别每个请求中提供的 `session ID`，将其映射到相应的用户，并代表他们执行操作。\n\n注意，`session ID`\
  \ 必须是一个临时分配的、与用户名不同的值。如果浏览器使用的 `session ID` 仅仅是用户名，黑客就可以伪装成他们喜欢的任何用户。根据设计，在任何给定的时间内，只有极少数的可能会话\
  \ ID 会对应于服务器上的有效会话。（如果情况并非如此，则 Web 服务器将表现出弱会话漏洞，我们将在本章稍后部分讨论。）\n\n除了用户名之外，Web 服务器通常会在\
  \ `session ID` 旁边存储其他 `session state（会话状态）`，包含有关用户近期活动的相关信息。例如，会话状态可能包含用户访问过的页面列表，或者当前位于购物篮中的物品。\n\
  \n现在我们已经理解了用户和 Web 服务器开启会话时发生了什么，让我们来看网站是如何实现这些会话的。有两种常见的实现方式，通常被描述为服务端会话和客户端会话。让我们回顾这些方法是如何工作的，这样你就能看到漏洞发生在何处。\n\
  \n### 服务端会话\n\n在传统的会话管理模型中，Web 服务器将会话状态保留在内存中，Web 服务器和浏览器相互传递会话标识符。这被称为 `server-side\
  \ session（服务端会话）`。列表 10-1 显示了 Ruby on Rails 对服务端会话的实现。\n\n```ruby\n# 从缓存中获取会话。\n\
  def find_session(env, sid)\n  unless sid && (session = @cache.read(cache_key(sid)))\n\
  \    sid, session = generate_sid, {}\n  end\n  [sid, session]\nend\n\n# 在缓存中设置会话。\n\
  def write_session(env, sid, session, options)\n  key = cache_key(sid)\n  if session\n\
  \    @cache.write(key, session, expires_in: options[:expire_after])\n  else\n  \
  \  @cache.delete(key)\n  end\n  sid\nend\n```\n\n*列表 10-1: Ruby on Rails 使用 session\
  \ ID 实现服务端会话。*\n\n会话对象在 ❶ 创建，在 ❷ 写入服务器内存，然后在 ❸ 从内存中重新加载。\n\n在历史上，Web 服务器曾尝试过多种方式传输会话\
  \ ID：在 URL 中、作为 HTTP 头部，或者在 HTTP 请求体中。目前，Web 开发社区决定的最常见（且可靠）的机制是将话 ID 作为会话 Cookie\
  \ 发送。使用 `session cookies` 时，Web 服务器在 HTTP 响应的 `Set-Cookie` 头部返回会话 ID，浏览器在随后的 HTTP\
  \ 请求中通过 `Cookie` 头部附加相同的信息。\n\n自 Netscape 在 1995 年首次引入 Cookie 以来，它们一直是超文本传输协议的一部分。与\
  \ HTTP 原生身份验证不同，它们几乎被每个网站所使用。（因为欧盟法律的原因，你对这一事实非常熟悉：网站根据欧洲法律必须告知你正在使用 Cookie。）\n\n\
  服务端会话已被广泛实现且通常非常安全。然而，它们具有扩展性局限，因为 Web 服务器必须在内存中存储会话状态。\n\n\n\n\n\n这意味着在身份验证时，只有`一个`\
  \ Web 服务器知道已建立的会话。如果针对同一用户的后续 Web 请求被重定向到`不同的` Web 服务器，那么新的 Web 服务器需要能够识别返回的用户，因此\
  \ Web 服务器需要一种共享会话信息的方法。\n\n通常，这需要在每次请求时将会话状态写入共享缓存或数据库，并在有新的 HTTP 请求通过时，让每个 Web\
  \ 服务器读取该缓存的会话状态。这两种操作都是耗时且消耗资源的操作，可能会限制大型用户群网站的响应速度，因为向网站添加的每个用户都会为会话存储器带来巨大的负载。\n\
  \n### 客户端会话\n\n由于服务器端会话已被证明难以在大站点中扩展，Web 服务器开发者发明了客户端会话。实现`client-side sessions`的\
  \ Web 服务器会将所有会话状态都通过 `cookie` 传递，而不是只在 `Set-Cookie` 头部中返回会话 ID。服务器在将会话状态设置到 HTTP\
  \ 头部之前，会会将会话状态序列化为文本。Web 服务器通常会将会话状态编码为 JavaScript 对象表示（`JSON`），并在返回给服务器时对其进行反序列化。Listing\
  \ 10-2 展示了 Ruby on Rails 实现客户端会话的示例。\n\n```ruby\ndef set_cookie(request, session_id,\
  \ cookie)\n  cookie_jar(request)[@key] = cookie\nend\n\ndef get_cookie(req)\n  cookie_jar(req)[@key]\n\
  end\n\ndef cookie_jar(request)\n  request.cookie_jar.signed_or_encrypted\nend\n\
  ```\n\n*Listing 10-2: 将会话数据存储为客户端 cookie 的 Ruby on Rails 代码*\n\n通过使用客户端会话，网站的 Web\
  \ 服务器不再需要共享状态。每个 Web 服务器都拥有了与传入的 HTTP 请求重新建立会话所需的所有内容。当你尝试扩展到数千个并发用户时，这是一个巨大的优势！\n\
  \n然而，客户端会话确实存在明显的安全问题。在客户端会话的简单实现中，恶意用户可以轻松操纵会话 cookie 的内容，甚至完全伪造它们。这意味着 Web 服务器必须以一种防止篡改的方式编码会话状态。\n\
  \n保护客户端会话 cookie 的一种流行方法是在发送到客户端之前对序列化的 cookie 进行加密。Web 服务器在浏览器返回 cookie 时对其进行解密。这种方法使得会话状态在客户端是完全不透明的。任何操纵或伪造\
  \ cookie 的尝试都会破坏编码的会话并导致 cookie 无法读取。服务器将直接注销恶意用户并将其重定向到错误页面。\n\n另一种稍微轻量级的会话 cookie\
  \ 安全方法是在发送 cookie 时向其添加数字签名。`digital signature` 充当某些输入数据（在本例中，为序列化的会话状态）的唯一“指纹”，只要他们拥有最初用于生成签名的签名密钥，任何人都可以轻松重新计算。对\
  \ cookie 进行数字签名允许 Web 服务器检测到操纵会话状态的尝试，因为如果有任何篡改，它将计算出不同的签名值并拒绝该会话。\n\n对 cookie 进行签名而非加密仍然允许好奇心强的用户在浏览器调试器中读取会话数据。如果你正在存储中存储关于用户的数据（例如跟踪信息），而你又可能不希望他们看到这些信息，请记住这一点！\n\
  \n### 攻击者如何劫持会话\n\n现在我们已经讨论了会话以及网站如何实现会话，让我们来看看攻击者是如何劫持会话的。攻击者使用三种主要方法来劫持会话：cookie\
  \ 窃取、会话固定和利用弱的会话 ID。\n\n### Cookie 窃取\n\n由于现在 cookie 的非常广泛，攻击者通常通过窃取已身份验证用户的 `Cookie`\
  \ 头部标值来实现会话劫持。攻击者通常使用三种技术之一来窃取 cookie：在用户与网站交互时向网站注入恶意的 JavaScript（跨站脚本）、嗅探网络流量以拦截\
  \ HTTP 头部（中间人攻击），或者在用户已身份验证时向网站触发非预期的 HTTP 请求（跨站请求伪造）。\n\n幸运的是，现代浏览器实现了简单的安全措施，允许你保护你的会话\
  \ cookie 免受这三种技术的影响。你只需通过向服务器返回的 `Set-Cookie` 头部中添加关键字即可启用这些安全措施，如 Listing 10-3\
  \ 所示。\n\n```\nSet-Cookie: session_id=278283910977381992837; HttpOnly; Secure; SameSite=Lax\n\
  ```\n\n*Listing 10-3: HTTP 响应中出现的会话 cookie，通过组合关键字指令防止了会话劫持*\n\n让我们回顾 cookie 窃取的三种技术，以及可以缓解这些技术的关键字。\n\
  \n#### 跨站脚本\n\n攻击者经常使用 `cross-site scripting`（我们在 第 7 章 中详细讨论过）来窃取会话 cookie。攻击者会尝试使用注入到用户浏览器的\
  \ JavaScript 来读取用户的 cookie，并将其发送到攻击者控制的外部 Web 服务器。攻击者随后会在这些 cookie 现在 Web 服务器日志文件中时进行`harvest`，然后将\
  \ cookie 值复制粘贴到浏览器会话中——或者更有可能将它们添加到脚本中——以便在被破解的用户会话下执行操作。\n\n要消除通过跨站脚本进行的会话劫持，请在\
  \ `Set-Cookie` 头部将所有 cookie 标记为 `HttpOnly`。这告诉浏览器不要让 cookie 可供 JavaScript 使用。在 `Set-Cookie`\
  \ 之后附加 `HttpOnly` 关键字，如 Listing 10-4 所示。\n\n```\nSet-Cookie: session_id=278283910977381992837;\
  \ HttpOnly\n```\n\n*Listing 10-4: 将 cookie 标记为 HttpOnly 以阻止 JavaScript 访问它们*\n\n\
  很少有理由允许客户端 JavaScript 访问 cookie，因此这种方法几乎没有缺点。\n\n#### 中间人攻击\n\n攻击者还可以通过`中间人攻击` 窃取\
  \ cookie：攻击者找到一种位于浏览器和 Web 服务器之间的方法，并读取传输的网络流量。为了防止中间人攻击导致的 cookie 窃取，你的网站应该使用 HTTPS。你将在\
  \ 第 13 章 中学习如何启用 HTTPS。\n\n在 Web 服务器启用 HTTPS 后，你应该将 cookie 标记为 `Secure`，如 Listing\
  \ 10-5 所示，这样浏览器知道绝不通过 HTTP 发未加密的 cookie。\n\n```\nSet-Cookie: session_id=278283910977381992837;\
  \ Secure\n```\n\n*Listing 10-5: 将 cookie 标记为安全意味着在 Set-Cookie 响应头部中添加 Secure 关键字*\n\
  \n大多数 Web 服务器配置为同时响应 HTTP 和 HTTPS，但会将 HTTP URL 重定向到相应的 HTTPS。将 cookie 标记为 `Secure`\
  \ 将阻止浏览器在定向发生之前传输 cookie 数据。\n\n#### 跨站请求伪造\n\n攻击者劫持会话的最后方法是通过`跨站请求伪造`（在 第 8 章 中详细介绍）。使用\
  \ CSRF 的攻击者不需要获取用户的会话 cookie。相反，他们只需要诱骗受害者点击指向你网站的链接。如果用户已经在你的网站上打开了会话，浏览器会将他们的会话\
  \ cookie 随链接触发的 HTTP 请求一起发送，这可能导致用户无意中执行敏感操作（例如点赞黑客试图推广的项目）。\n\n\n\n\n\n为了防御 CSRF\
  \ 攻击，请为你的 cookie 标记 `SameSite` 属性，该属性指示浏览器仅对从你的网站生成的 HTTP 请求发送话 cookie。浏览器将从其他 HTTP\
  \ 请求（例如通过点击电子邮件中的链接生成的请求）中剥离会 cookie。\n\n`SameSite` 属性有两个设置：`Strict` 和 `Lax`。列表\
  \ 10-6 所示的 `Strict` 设置的优势是可以移除从外部站点触发的所有 HTTP 请求中的 cookie。\n\n```\nSet-Cookie: session_id=278283910977381992837;\
  \ SameSite=Strict\n```\n*列表 10-6：Strict 设置将移除从外部站点生成你网站请求中的 cookie。*\n\n如果用户通过社交媒体分享你的内容，`Strict`\
  \ 设置可能会非常困扰，因为该设置强制任何点击其链接的人重新登录才能查看内容。为了解决用户的这种困扰，可以使用 `SameSite=Lax` 设置配置浏览器仅在\
  \ GET 请求上允许 cookie，如列表 10-7 所示。\n\n```\nSet-Cookie: session_id=278283910977381992837;\
  \ SameSite=Lax\n```\n*列表 10-7：Lax 设置允许在社交媒体上无痛共享链接，同时仍能防御通过 CSRF 进行会话劫持攻击。*\n\n\
  此 `SameSite=Lax` 设置指示浏览器将 cookie 附加到传入的 GET 请求，同时从其他请求类型中移除它们。由于网站通常通过 `POST`、`PUT`\
  \ 或 `DELETE` 请求执行敏感操作（如写入内容或发送消息），攻击者无法欺骗受害者执行这些类型的敏感操作。\n\n### # 会话固定 (Session\
  \ Fixation)\n\n在互联网发展的早期，许多浏览器并没有实现 cookie，因此 Web 服务器找到了其他传递 session ID 的方法。这样做最流行的方法是*URL\
  \ 重写*——将 session ID 附加到用户访问的每个 URL 之后。直到今天，*Java Servlet 规范*仍然描述了在无法使用 cookie 时开发者如何将会话\
  \ ID 添加到 URL 的末尾。列表 10-8 展示了一个包含 session ID 的重写 URL 示例。\n\n```\nhttp://www.example.com/catalog/index.html;jsessionid=1234\n\
  ```\n*列表 10-8：传递 session ID 1234 的 URL 示例*\n\n如今所有浏览器都支持 cookie，因此 URL 重写已经过时了。然而，遗留的\
  \ Web 栈可能被配置为仍然以这种方式接受 session ID，这引入了两个主要的安全问题。\n\n首先，在 URL 中写入 session ID 会导致它们在日志文件中泄露。获取了你日志的攻击者只需在浏览器中丢弃这类\
  \ URL，即可劫持用户的会话。\n\n第二个问题是一个被称为*会话固定 (session fixation)* 的漏洞。当易受会话固定攻击的 Web 服务器在\
  \ URL 中遇到未知的 session ID 时，它们会要求用户进行身份验证，然后在提供的 session ID 下建立会话。\n\n这允许黑客提前*固定*会话\
  \ ID，向受害者发送带有固定 session ID 的诱人链接（通常在未请求的垃圾邮件或网站评论区的垃圾信息中）。任何点击链接的用户都可能被劫持会话，因为攻击者可以简单地在自己的浏览器中使用相同的\
  \ URL，而已经提前固定了 session ID。点击链接并登录的行为会将虚拟 session ID 转换为真实的 session ID——黑客知道的那个。\n\
  \n如果你的 Web 服务器支持将 URL 重写作为会话跟踪手段，你应该通过相关的配置选项禁用它。它没有任何意义，并且会让你暴露在会话固定攻击中。列表 10-9\
  \ 展示了如何编辑 `web.xml` 配置文件在流行的 Java Web 服务器 Apache Tomcat 7.0 版本中禁用 URL 重写。\n\n```\n\
  <session-config>\n    <tracking-mode>COOKIE</tracking-mode>\n</session-config>\n\
  ```\n*列表 10-9：在 Apache Tomcat 7.0 中指定会话跟踪使用 `COOKIE` 模式将禁用 URL 重写。*\n\n### # 利用弱会话\
  \ ID\n\n正如我们已经讨论过的，如果攻击者获取了 session ID，他们就可以劫持用户的会话。他们可以通过窃取会话 cookie 或在支持 URL 重写的服务器上提前固定会话来实现。然而，一种更具暴力性的方法是简单的*猜测*会话\
  \ ID。因为 session ID 通常只是数字，如果这些数字足够小或具有预测性，攻击者可以编写脚本来枚举潜在的 session ID 并在 Web 服务器上对其进行测试，直到找到有效的会话。\n\
  \n在软件中很难生成真正的随机数。大多数随机数生成算法使用环境因素（如系统时钟）作为*种子 (seeds)* 来生成它们的随机数。如果攻击者能够确定足够的种子值（或将其减少到合理的潜在值数量），他们就可以枚举潜在的有效\
  \ session ID 并在你的服务器上进行测试。\n\n早期版本的标准 Apache Tomcat 服务器被发现易受此类攻击的影响。安全研究人员发现，随机\
  \ session ID 生成算法的种子是系统时间和内存中对象的哈希值。研究人员能够利用这些种子来缩小潜在输入值的范围，从而能够可靠地猜出 session ID。\n\
  \n请咨询你的 Web 服务器文档，并确保它使用无法被猜中的的大型 session ID。由于安全研究人员经常发现弱的 session ID 算法，请确保密切关注安全告，告告将告知你何时需要修补软件。\n\
  \n当网站成功验证用户身份时，浏览器和服务器之间会开启一个会话。会话状态可以存储在服务器端，也可以存储在客户端作为加密或经过数字签名的 cookie。\n\n\
  黑客会尝试窃取会话 cookie，因此你应该确保它们受到保护。为了防止跨站脚本攻击会话劫持，请确保你的 cookie 不会被 JavaScript 代码访问。为了防止通过中间人攻击会话劫持，请确保你的\
  \ cookie 仅通过 HTTPS 连接传递。为了防止通过跨站请求伪造会话劫持，请确保移除跨站请求中的 cookie。在 HTTP 响应中编写 `Set-Cookie`\
  \ 头部时，可以分别使用 `HttpOnly`、`Secure` 和 `SameSite` 关键字添加这些保护。\n\n旧版本的 Web 服务器可能易受会话固定攻击，因此请务必禁用作为传递\
  \ session ID 手段的 URL 重写。偶尔会发现 Web 服务器使用可猜的 session ID，请关注你软件栈的安全告，并根据需要进行修补。\n\n\
  11 权限 (PERMISSIONS)\n\n你网站上的用户通常具有不同级别的权限。例如，在内容管理系统中，某些用户是管理员，拥有编辑内容的权限，而大多数用户只能查看和交互内容。社交媒体网站有更复杂的权限网络：用户可能选择仅与朋友分享某些内容，或将他们的个人资料锁定。对于\
  \ 邮箱网站，每个用户都应该只能访问自己的电子邮件！确保你在整个网站范围内正确且一致地执行这些类型的权限，否则你的用户将失去对你的信任。\n\n\n\n\nFacebook\
  \ 在 2018 年 9 月遭遇了用户权限的灾难性失败，当时黑客利用其视频上传工具中的一个漏洞为网站生成了访问令牌。网站上有高达 5000 万用户账户遭到破坏。黑客窃取了用户的个人资料详情，如用户名、电子邮件和电话号码。Facebook\
  \ 修复了该漏洞，发布了安全公告，并通过媒体进行了道歉访问。然而，这发生在一个充满了关于 Facebook 业务行为负面报道的一年的年底，公司股价也遭受了重创。\n\
  \nFacebook 黑客事件是`权限提升`（privilege escalation）的一个例子，即恶意用户夺取另一个用户的权限。确保网站安全以便对每个用户应用正确权限的过程被称为实施`访问控制`（access\
  \ control）。本章将涵盖这两个概念，并介绍黑客用来利用访问控制不足的一种常用方法，称为`目录遍历`（directory traversal）。\n\n\
  ## 权限提升\n\n安全专家将权限提升攻击分为两类：垂直提升和水平提升。\n\n在`垂直提升`（vertical escalation）中，攻击者获取了拥有比自己权限更大的账户权限。如果攻击者可以在你的服务器上部署`web\
  \ shell`（一种接收 HTTP 请求元素并在命令行上运行它们的可执行脚本），他们的首要目标之一将是提升到`root 权限`（root privilege），以便他们可以在服务器上执行任何想要的操作。通常，发送到\
  \ web shell 的命令将在运行 Web 服务器的相同操作系统账户下执行，该账户通常具有有限的网络和磁盘访问权限。黑客已经发现许多在操作系统上执行垂直提升攻击的方法，试图获取\
  \ root 访问——这允许他们从 web shell 感染整个服务器。\n\n在`水平提升`（horizontal escalation）中，攻击者访问另一个与自己权限相似的账户。在接后的接下来的几个章节中，我们讨论了执行此类攻击的常见方法：猜测密码、劫持会话或恶意构建\
  \ HTTP 请求数据。2018 年 9 月的 Facebook 黑客事件就是水平提升的一个典型案例，它是由于一个 API 在没有正确验证用户权限的情况下发布了访问令牌导致的。\n\
  \n为了保护你的网站免受提升攻击，你需要对所有敏感资源实施安全的访问控制。让我们讨论一下如何实现。\n\n### 访问控制\n\n你的访问控制策略应该涵盖三个关键方面：\n\
  \n**身份验证**（Authentication）：当用户返回网站时正确识别用户\n**授权**（Authorization）：用户在识别身份后，决定他们应该和不应该执行哪些操作\n\
  **权限检查**（Permission checking）：在用户尝试执行操作的时间点评估授权\n\n`第 9 章`和`第 10 章`详细介绍了身份验证；你已经看到保护登录功能和会话管理如何让你可靠地确定是哪个用户在发送\
  \ HTTP 请求。然而，从那里开始，你仍然需要每个每个可以执行哪些操作，这是一个更开放的问题。\n\n一个良好的访问控制策略由三个阶段组成：设计授权模型、实施访问控制和测试访问控制。完成这些之后，你还可以添加审计日志，并确保没有遗漏常见的疏忽。让我们详细介绍其中的每一项。\n\
  \n### 设计授权模型\n\n在软件应用程序中，建模授权规则有几种常见方法。在设计授权模型时，记录你将如何将所选模型应用到用户是非常重要的。如果没有一套约俗的规则，很难定义一个“正确”的实现应该是什么样的。\n\
  \n考虑到这一点，让我们看看一些建模授权规则的常见方法。\n\n#### 访问控制列表\n\n`访问控制列表（ACLs）`是建模授权的一种简单方法，它在系统中的每个对象上挂载一个权限列表，指定每个用户或账户对该对象可以执行的操作。基于\
  \ ACL 的模型的经典范例是 Linux 文件系统，它可以单独授予每个用户对每个文件和目录的读取、写入或执行权限。大多数 SQL 数据库也实现了基于 ACL\
  \ 的授权——你用于连接到数据库的账户决定了你可以读取或更新哪些表，或者你是否可以更改表结构。\n\n#### 白名单和黑名单\n\n一种更简单的授权建模方法是使用白名单或黑名单。`白名单`（whitelist）描述可以访问特定资源的用户或账户，并禁止所有其他用户。`黑名单`（blacklist）明确描述被禁止访问资源的用户或账户，意味着该资源应该对任何其他用户或账户开放。垃圾过滤器经常使用白名单和黑名单来区分邮件应用程序应该直接发送到垃圾箱或永远不将其视为垃圾的电子邮件地址。\n\
  \n#### 基于角色的访问控制\n\n最全面的授权模型可能是`基于角色的访问控制 (RBAC)`，它授予用户`角色`（roles），或将用户添加到已授予特定角色的`组`（groups）中。系统中的`策略`（Policies）定义了每个角色如何与特定的`主体`（subjects）——计算系统内的资源进行交互。\n\
  \n简单的 RBAC 系统可能会通过将用户添加到管理员组将某些用户指定为管理员，从而授予他们管理员角色。随后，策略将允许具有管理员角的用户或组编辑你网站的特定内容。\n\
  \nAmazon Web Services `身份和访问管理 (IAM)`系统是一个全面的基于角色的系统示例，微软的 Active Directory 也是如此。基于角色的访问控制非常强大，但往往容易产生复杂性。策略之间可能会相互矛盾，产生开发者需要解决的冲突，并且用户可能属于多个具有重叠关注点的组。在这些情况下，有时很难看出系统为什么会做出某些访问控制决策，或者为什么在特定情况下对某些规则进行优先考虑。\n\
  \n### 基于所有权的访问控制\n\n在社交媒体时代，围绕`所有权`（ownership）的概念来组织访问控制规则已变得常见，即每个用户对他们上传的照片或创建的帖子拥有完全控制权。社交媒体用户本质上是他们内容的管理员：他们可以创建、上传、删除并控制自己的帖子、评论、照片和故事的可见性。他们可以在照片等内容中标记其他用户，但这些其他用户可能在标记公开之前必须批准这些标记。\n\
  \n### 实施访问控制\n\n在你选择了授权模型并为网站定义了访问规则后，你需要在代码中实现它们。你应该尝试在代码库中集中处理访问控制决策，以便在代码审查期间根据你的设计文档对其进行验证。你不一定需要让所有的访问决策都通过一个代码路径，但拥有一种评估访问控制决策的标准方法是非常重要的。\n\
  \n\n\n\n实现授权规则有许多方法：使用函数或方法装饰器（通过特定的权限级别对函数进行标记）、URL 检查（例如，为敏感路径加通配符 `*/admin*`\
  \ 前缀），或在代码中插入内联断言。某些实现将委托于专门的权限组件或内部 API 提供的访问控制决策。列表 11-1 显示了在 Python 函数中添加权限检查的示例。\n\
  \n```python\nfrom django.contrib.auth.decorators import login_required, permission_required\n\
  \n❶ @login_required\n\n❷ @permission_required('content.can_publish')\n\ndef publish_post(request):\n\
  \    # 将文章发布到首页。\n```\n列表 11-1：在 Python 中使用 django Web 服务器检查权限*\n\nWeb 服务器要求用户在允许其发布文章之前必须已登录\
  \ ❶ 并且具有发布内容的权限 ❷。\n\n列表 11-2 显示了如何使用 `pundit` 库在 Ruby 中进行内联权限检查。\n\n```ruby\ndef\
  \ publish\n  @post = Post.find(params[:id])\n❶ authorize @post, :update?\n  @post.publish!\n\
  \  redirect_to @post\nend\n```\n列表 11-2：在 Ruby 中使用 pundit 库检查权限*\n\n该方法调用 ❶ 会向库询问当前登录用户是否有权限更新由\
  \ `@post` 对象描述的社交媒体帖子。\n\n无论你使用哪种方法来实现权限检查，请务必根据经过适当验证的身份数据做出访问控制决策。不要依赖 HTTP 请求中除会话\
  \ cookie 之外的任何内容来推断是哪个用户正在访问资源以及他们拥有什么权限！恶意用户可以篡改请求中的任何其他内容以实施特权提升攻击。\n\n### 访问控制测试\n\
  \n批判性地测试你的访问控制系统至关重要。确保你的测试程序真实地尝试寻找访问控制方案中的漏洞；如果你能像攻击者那样对待它，那么在第一次真实攻击发生时你会有更充分的准备。\n\
  \n编写单元测试，对谁可以访问某些资源进行断言，更重要的是对谁*不应该*能够访问它们进行断言。在为网站添加功能时，养成编写描述访问控制规则的新单元测试的习惯。如果你的网站有管理界面，这尤为重要，因为它们是攻击者黑入网站时常用的常见的后门。列表\
  \ 11-3 显示了一个简单的 Ruby 单元测试，断言用户在执行敏感操作之前必须登录。\n\n```ruby\nclass PostsTest < ApplicationSystemTestCase\n\
  \  test \"users should be redirected to the login page if they are not logged in\"\
  \ do\n    visit publish_post_url\n    assert_response :redirect\n    assert_selector\
  \ \"h1\", text: \"Login\"\n  end\nend\n```\n列表 11-3：一个 Ruby 单元测试，检查未经授权的用户在尝试发布文章时是否会被重定向到登录页面\n\
  \n最后，如果你有时间和预算，可以考虑雇用外部团队进行渗透测试。该团队可以探测攻击者可以滥用的缺失或错误的访问控制规则。\n\n### 添加审计轨迹\n\n由于你的代码会在用户访问资源时识别用户身份并测试其授权级别，因此你应该添加审计轨迹以帮助故障排除和取证分析。*审计轨迹*是当用户执行操作时记录的日志文件或数据库条目。简单地在用户浏览你的网站时添加日志语句（14:32:06\
  \ 2019-02-05: User [example@gmail.com] logged in）可以帮助你在运行时诊断任何问题，并在确实被黑客入侵的情况下提供关键证据。\n\
  \n### 避免常见疏忽\n\n你在许多网站上看到的一个常见疏忽是，它们对并非设计为可发现的资源省略了访问控制。由于攻击者在黑入网站时经常利用这些后门，如果你的网站有管理界面，这尤为重要。假设由于页面被隐藏而攻击者无法访问是不的。\n\
  \n黑客工具可以快速列出可猜测的 URL，例如 `example.com/item?42`，依赖攻击者无法猜测 URL（例如 `example.com/profiles/bob`）被称为*通过隐蔽实现安全*（security\
  \ through obscurity），这被认为是一种风险。对于设计在特定时间发布的（embargo）敏感资源尤为重要。上市公司要求根据此约束发布季度报告。有些网站会提前发布这些报告（例如，以\
  \ `*/reports/<company-name>/<month-year>` 形式的 URL），欺攻击者为了访问这些报告是众为人知的。监管机构已由于披露不当而对公司处以巨额罚款！确保你的访问控制规则考虑到任何时间要求。\n\
  \n你网站上的每个敏感资源都需要访问控制。如果你的网站允许用户下载文件，黑客可能会尝试使用目录遍历方法访问他们不应该访问的文件。\n\n### 目录遍历\n\n\
  如果你网站的任何 URL 包含指向文件的路径参数，攻击者可以使用目录遍历绕过你的访问控制规则。在*目录遍历*攻击中，攻击者操纵 URL 参数以访问你从未打算允许的敏感文件。目录遍历攻击通常涉及使用\
  \ `../*` 语法的相对路径来“爬出”托管目录。\n\n### 路径与相对路径\n\n在大多数文件系统中，每个文件的位置可以通过*路径*来描述。例如，Linux\
  \ 上的路径 `/tmp/logs/web.log` 通过列出包含文件的*目录*（在此情况下为顶级目录 `tmp` 下的 `logs` 目录）来描述文件 `web.log`\
  \ 的位置，并用*路径分隔符*字符（`/`）连接。\n\n*相对路径*是以点 `.` 字符开头的路径，表示它位于当前目录；相对路径 `./web.log` 描述文件\
  \ `web.log` 的位置位于当前目录。什么被称为“当前”目录取决于评估该路径的上下文。例如，从命令行提示符来说，当前目录是用户最近导航到的目录。\n\n\
  相对路径还使用 `..` 语法来引用包含它的*父*目录。使用两次 `..` 语法将引用父目录的父目录。例如，文件系统将路径 `../../etc/passwd`\
  \ 解析为向上移动两个目录，找到名为 `etc` 的目录，然后返回该目录下的 `passwd` 文件。使用相对路径类似于描述亲戚：你的叔叔是你祖父母的儿子，所以为了找到他，请在家族谱中回溯两代，然后寻找一个男性孩子。\n\
  \n\n\n\n如果你的服务器端代码允许攻击者通过相对文件路径代替文件名并对其进行评估，他们就可以探测你的文件系统以寻找看起来有趣的文件，从而破坏访问控制。相对路径语法允许攻击者读取\
  \ Web 服务器根目录之外的文件，让他们能够探测通常包含密码或配置信息的目录，并读取其中包含的数据。让我们来看这样一个攻击的示例。\n\n### 目录遍历攻击的剖析\n\
  \n假设你有一个网站，在服务器文件系统中存储了 PDF 格式的餐厅菜单。你的网站邀请用户通过点击引用文件名的链接来下载每个 PDF，如图图 11-1 所示。\n\
  \n![image](img/11fig01.jpg)\n\n*图 11-1：允许下载网站*\n\n如果 `filename` 参数没有被安全地解析，攻击者可以在\
  \ URL 中用相对路径替换菜单文件名，并获取你服务器上的用户账户信息，如图 11-2 所示。\n\n![image](img/11fig02.jpg)\n\n\
  *图 11-2：使用目录遍历攻击访问持有账户信息的 Unix 文件*\n\n在这种情况下，黑客用相对路径 `../../../../etc/passwd` 替换了\
  \ `menu` 参数中的菜单名称以便下载敏感文件。读取 `passwd` 文件可以告诉攻击者底层 Linux 操作系统存在哪些用户账户，揭示敏感的系统信息，这将帮助攻击者黑入服务器。你绝对不希望攻击者能够读取此类信息！让我们来看看消除目录遍历攻击的方法。\n\
  \n### 缓解措施 1：信任你的 Web 服务器\n\n为了防止目录遍历攻击，首先要熟悉你的 Web 服务器如何解析静态内容 URL。几乎所有网站都会以某种方式将\
  \ URL 转换为文件路径——通常是在服务器响应对 JavaScript 文件、图像或样式表等静态内容的请求时。如果你发现自己正在提供更奇特的静态文件类型（例如餐厅菜单），请尝试使用\
  \ Web 服务器内置的 URL 解析逻辑，而不是编写自己的逻辑。你的 Web 服务器的 URL 静态托管功能通常经过了测试，并具有针对目录遍历攻击的安全防护。\n\
  \n### 缓解措施 2：使用托管服务\n\n如果你提供的文件不是代码库的一部分（可能是因为用户或网站管理员上传了它们），你应该强烈考虑将它们托管在内容分发网络（CDN）、云存储或内容管理系统中。这些软件类型不仅缓解了第\
  \ 6 章中讨论的文件上传漏洞，还通过允许使用安全的 URL 或不透明的文件标识符引用文件来消目录遍历攻击。在这些替代方案中，CDN 通常允许的权限粒度较低（例如，如果某些文件仅对某些用户可用），但通常是最容易集成的。\n\
  \n### 缓解措施 3：使用间接文件引用\n\n如果你编写自己的代码来从本地磁盘提供文件，消除目录遍历攻击最安全的方法是通过间接引用：你为每个文件分配一个对应文件路径的`不透明\
  \ ID`（opaque ID），然后让所有 URL 通过该 ID 引用每个文件。这需要你维护某种注册表（例如在数据库中），将每个文件 ID 与路径配对。\n\n\
  ### 缓解措施 4：清理文件引用\n\n最后，如果你确实在 URL 中使用了直接文件引用——可能是因为你继承了一个遗留代码库，并且缺乏重构文件存储方式的时间或资源——你需要保护你的网站代码，以确保不会用任意路径代替文件名。最安全的方法是禁用任何包含路径分隔符字符（包括编码后的分隔符字符）的文件引用。（注意，Windows\
  \ 和 Unix 操作系统使用不同的路径分隔符：分别为 `\\*` 和 `/`。）\n\n另一种方法是使用正则表达式（regex）对文件名进行验证，以过滤掉任何看起来像路径语法的内容。所有现代\
  \ Web 编程语言都包含某种正则表达式实现，因此很容易针对“安全”表达式对传入的文件名参数进行测试。不过，使用这种技术时要小心：由于目录遍历攻击非常常见，黑客会不断研究新的和晦涩的路径名编码方法。如果可能，请尝试使用第三方库来清理文件名。列表\
  \ 11-4 显示了 Ruby Sinatra gem 中清理路径参数的某些逻辑。\n\n```ruby\ndef cleanup(path)\n    parts\
  \      = []\n  ❶ unescaped = path.gsub(/%2e/i, dot).gsub(/%2f/i, slash).gsub(/%5c/i,\
  \ backslash)\n    unescaped = unescaped.gsub(backslash, slash)\n  ❷ unescaped.split(slash).each\
  \ do |part|\n      next if part.empty? or part == dot\n      part == '..' ? parts.pop\
  \ : parts << part\n    end\n  ❸ cleaned = slash + parts.join(slash)\n    cleaned\
  \ << slash if parts.any? and unescaped =~ %r{/\\.{0,2}$}\n    cleaned\nend\n```\n\
  *列表 11-4：Sinatra Ruby gem 中清理路径参数的逻辑*\n\n首先，代码标准化它识别出的任何晦涩字符编码 ❶。然后它将路径拆分为单独组件 ❷。最后，通过使用标准分隔符\
  \ ❸ 重构路径，确保开头字符是斜杠。\n\n列表 11-4 所示的复杂性是必要的，因为相对路径在目录遍历攻击期间可以以多种方式编码。列表 11-5 显示了在不同操作系统上父目录语法的八种编码方式。\n\
  \n```text\n../\n..\\\n..\\/\n%2e%2e%2f\n%252e%252e%252f\n%c0%ae%c0%ae%c0%af\n%uff0e%uff0e%u2215\n\
  %uff0e%uff0e%u2216\n```\n*列表 11-5：相对路径在不同操作系统上存在多种编码方式。Gulp.*\n\n### 总结\n\n你网站上的用户通常具有不同的权限，因此你需要实施在用户尝试访问资源时进行评估的访问控制规则。\n\
  \n\n\n\n\n### 缓解措施 1：禁用暴露特征的服务器响应头部\n\n确保在你的 Web 服务器配置中禁用任何显示你运行的服务器技术、语言和版本的 HTTP\
  \ 响应头部。默认情况下，Web 服务器通常会在每次响应时返回一个 `Server` 头部，描述服务器端运行的是什么软件。这对于 Web 服务器供应商来说是极好的广告，但浏览器并不会使用它。它只是告诉攻击者他们可以探测哪些漏洞。确保你的\
  \ Web 服务器配置禁用了此 `Server` 头部。（或者如果你想耍点小聪明，可以让它报告错误的 Web 服务器技术！）\n\n### 缓解措施 2：使用清洁\
  \ URL (Clean URLs)\n\n在设计网站时，避免在 URL 中使用特征性的文件后缀，例如 `*.php`、`*.asp` 和 `*.jsp`。改为实现`清洁\
  \ URL`——即不会暴露实现细节的 URL。带有文件扩展名的 URL 在旧版 Web 服务器中很常见，它们显式引用了模板文件名。确保避免此类扩展名。\n\n\
  ### 缓解措施 3：使用通用 Cookie 参数\n\nWeb 服务器用于存储会话状态的 Cookie 名称经常会暴露你的服务器端技术。例如，Java Web\
  \ 服务器通常将会话 ID 存储在名为 `JSESSIONID` 的 Cookie 下。攻击者可以检查此类会 Cookie 名称来识别服务器，如列表 12-1\
  \ 所示。\n\n```\nif response.get_cookies.match(/JSESSIONID=(.*);(.*)/i)\n    jsessionid\
  \ = $1\n    post_data  = \"j_username=#{username}&j_password=#{password}\"\n   \
  \ response = send_request_cgi({\n        'uri'          => '/admin/j_security_check',\n\
  \        'method'       => 'POST',\n        'content-type' => 'application/x-www-form-urlencoded',\n\
  \        'cookie'       => \"JSESSIONID=#{jsessionid}\",\n        'data'       \
  \  => post_data,\n    })\n```\n*列表 12-1：攻击工具 Metasploit 尝试检测并破解 Apache Tomcat 服务器*\n\
  \n注意 Metasploit 代码检查了会话 Cookie 的名称。\n\n确保你的 Web 服务器不会在 Cookie 中返回任何提供关于你技术栈线索的信息。更改你的配置，为会话\
  \ Cookie 使用通用名称（例如，session）。\n\n### 缓解措施 4：禁用客户端错误报告\n\n大多数 Web 服务器都支持`客户端错误报告`，这允许服务器在错误页的\
  \ HTML 中打印堆栈跟踪和路由信息。客户端错误报告在测试环境调试错误时非常有用。然而，堆栈跟踪和错误日志也会告诉攻击者你正在使用哪些模块或库，帮助他们挑选出可以攻击的安全漏洞。发生在你数据访问层中的错误甚至可以泄露有关数据库结构的细节，这是一个重安全隐患！\n\
  \n你*必须*在生产环境中禁用客户端错误报告。你应该让用户看到的错误页面保持完全通用。最多情况下，用户只应该知道发生了意外错误，并且有人正在处理该问题。详细的错误报告应保留在生产日志和错误报告工具中，只有管理员才能访问。\n\
  \n请查阅你的 Web 服务器文档，了解如何禁用客户端错误报告。列表 12-2 展示了如何在 Rails 配置文件中禁用此功能。\n\n```\n# 禁用了完整的错误报告。\n\
  config.consider_all_requests_local = false\n```\n*列表 12-2：确保你的生产环境配置文件（通常存储在 Ruby\
  \ on Rails 的 `config/environments/production.rb`）禁用了客户端错误报告。*\n\n### 缓解措施 5：压缩或混淆你的\
  \ JavaScript 文件\n\n许多 Web 开发者在部署 JavaScript 代码之前会使用`压缩器`(minifier) 进行预处理，它获取 JavaScript\
  \ 代码并输出一个功能等效但高度压缩的 JavaScript 文件。压缩器会移除所有多余字符（如空格），并将某些代码语句替换为更短且语义相同的语句。相关的工具是`混淆器`(obfuscator)，它将方法和函数名替换为短且无意义的令牌，同时不改变代码的任何行为，故意降低代码的可读性。流行的\
  \ `UglifyJS` 工具具备这两种功能，可以通过命令行以 `uglifyjs [input files]` 的语法直接调用，这使其很容易集成到你的构建过程中。\n\
  \n开发者通常为了性能而压缩或混淆 JavaScript 代码，因为较小的 JavaScript 文件加载更快。\n\n### 缓解措施 6：清理你的客户端文件\n\
  \n进行代码审查并使用静态分析工具来确保敏感数据没有出现在注释中，这是重要的。压缩 JavaScript 可能会删除注释，但你需要发现你不小心留下的注释。\n\n\
  ### 密切关注安全告警\n\n即使你锁定了所有的安全设置，老练的黑客仍然对你运行的技术做出很好的推测。Web 服务器在响应特定边缘情况时具有特征性行为：例如，故意损坏的请求或带有异常谓词的请求。黑客可以使用这些独特的服务器技术指纹来识别服务器端的技术栈。\n\
  \n### 总结\n\n你应该确保你的 Web 服务器不会泄露有关你运行的软件栈类型的信息，因为黑客在尝试破解如何破解你的网站时会利用这些信息攻击你。确保你的配置禁用了特征头部并使用了通用的会话\
  \ Cookie 名称。使用不包含文件扩展名的清洁 URL。压缩或混淆你的 JavaScript，以便难以判断你正在使用哪些第三方库。在你的生产站点关闭详细的客户端错误报告。确保清理你的模板文件和\
  \ HTML，删除可能提供过多信息的注释。最后，密切关注安全告警，以便能够及时部署补丁。\n\n在下一章中，你将查看如何使用加密来保护网站的流量。\n\n##\
  \ 13\n\n**加密**\n\n![image](img/common01.jpg)\n\n加密驱动着现代互联网。如果没有私密且安全地交换数据包的能力，电子商务将不复存在，用户无法安全地向互联网网站进行身份验证。\n\
  \n\n\n\n\n超文本传输安全协议（HTTPS）是网络上最广泛使用的加密形式。Web 服务器和网络浏览器普遍支持 `HTTPS`，因此开发者可以将所有流量重定向到该协议，并为用户确保通信安全。想要在网站上使用\
  \ `HTTPS` 的 Web 开发人员只需从 `certificate authority`（证书权威机构）获取 `certificate`（证书），并由托管提供商进行安装即可。\n\
  \n开始使用加密的简单程度掩盖了网站与用户代理通过 `HTTPS` 交互时所发生的复杂过程。现代 `cryptography`（密码学）——对数据加密和解密方法的研究——取决于数学家和安全专业人员开发并积极研究的技术。幸运的是，互联网协议的抽象层意味着你不需要了解线性代数或数论就能使用他们的发现。但你对底层算法越越了解，就越能预判潜在的风险。\n\
  \n本章首先概述了加密在互联网协议中的用法以及支撑其运行的数学。一旦你充分掌握了加密的工作原理，你将回顾开发者开始使用 `HTTPS` 所需采取的实际步骤。最后，你将查看黑客如何利用未加密或弱加密的流量，以及某些攻击如何完全绕过加密。\n\
  \n## 互联网协议中的加密\n\n回想一下，互联网上传输的消息被分成数据包，并通过 `Transmission Control Protocol (TCP)`（传输控制协议）导向最终目的地。接收端计算机将这些\
  \ `TCP` 包重新装组成原始消息。`TCP` 并没有规定发送的数据应该*如何*被解释。为了实现这一点，两台计算机都需要对如何解释发送的数据达成一致，并使用如\
  \ `HTTP` 等更高级协议。`TCP` 不会对发送数据包的内容进行任何隐藏。不安全的 `TCP` 会话容易受到 `man-in-the-middle attacks`（中间人攻击）的影响，恶意第三方可以在数据包传输时拦截并读取它们。\n\
  \n为了避免这种情况，浏览器与 Web 服务器之间的 `HTTP` 会话由 `Transport Layer Security (TLS)`（传输层安全）保护，这种加密方法提供了隐私性（通过确保数据包无法被第三方破解）和\
  \ `data integrity`（数据完整性，通过确保任何对传输中数据包的篡改尝试都能被检测）。使用 `TLS` 进行的 `HTTP` 会话被称为 `HTTP\
  \ Secure (HTTPS)` 会话。\n\n当你的 浏览器连接到 `HTTPS` 网站时，浏览器和 Web 服务器会协商使用哪些加密算法作为 `TLS handshake`（TLS\
  \ 握手）的一部分——这是启动 `TLS` 会话时发生的数据包交换。为了理解 `TLS handshake` 期间发生了什么，我们需要简要了解一下各种类型的加密算法。是时候来一些简单的数学了！\n\
  \n### 加密算法、哈希函数和消息认证码\n\n`encryption algorithm`（加密算法）接收输入数据并使用 `encryption key`（加密密钥）对其进行混乱——该密钥是想要建立安全通信的双方之间的秘密。对于任何没有\
  \ `decryption key`（解密密钥，即还原数据所需的相应密钥）的人来说，混乱后的输出都是无法破解。输入数据和密钥通常被编码为二进制数据，尽管密钥为了可读性可以用文本字符串。\n\
  \n存在许多加密算法，数学家和安全研究人员仍在不断发明它们。它们可以分为几类：对称和非对称加密算法（用于数据加密）、哈希函数（用于生成数据指纹和构建其他加密算法）以及消息认证码（用于确保数据完整性）。\n\
  \n#### 对称加密算法\n\n`symmetric encryption algorithm`（对称加密算法）使用相同的密钥来加密和解密数据。对称加密算法通常以\
  \ `block ciphers`（块密码）的形式运行：它们将输入数据分成固定大小的块，并对其单独进行加密。（如果输入数据的最后一个块大小不足，则将进行 `padded`（填充）以填满块大小。）这使得它们适用于处理数据流，包括\
  \ `TCP` 数据包。\n\n对称算法为速度而设计，但有一个主要的安全缺陷：解密密钥必须在接收方解密数据流之前给他们。如果解密密钥在互联网上共享，潜在的攻击者将有机会窃取密钥，从而能够解密任何后续消息。这可不好。\n\
  \n#### 非对称加密算法\n\n为了应对解密密钥被窃的威胁，开发了 `asymmetric encryption algorithms`（非对称加密算法）。非对称算法使用不同的密钥来加密和解密数据。\n\
  \n非对称算法允许 Web 服务器等软件自由发布其加密密钥，同时保持其解密密钥秘密。想要向服务器发送安全消息的用户代理都可以使用服务器的加密密钥来加密这些消息，并确信没有（甚至包括他们自己！）能够破解所发送的数据，因为解密密钥是被保密的。这有时被称为\
  \ `public-key cryptography`（公钥加密）：加密密钥（`the public key` 公钥）可以发布；只有解密密钥（`private\
  \ key` 私钥）需要保持秘密。\n\n非对称算法比对称算法复杂得多，因此也更慢。正如你在本章后面看到的，互联网协议中的加密使用了这两种类型的组合。\n\n\
  #### 哈希函数\n\n与加密算法相关的是 `cryptographic hash functions`（密码学哈希函数），它们可以被视为输出*无法*被解密的加密算法。哈希函数还有其他有趣的属性：算法的输出（`hashed\
  \ value` 哈希值）始终是固定大小，无论输入数据的大小有多大；而且在给定不同输入值的情况下，获得相同输出值的概率微小到天文数字。\n\n你到底为什么要加密一段你之后又无法解密的数据呢？嗯，这是为输入数据生成“指纹”的一种简便方法。如果你需要检查两个独立的输入是否相同，但出于安全考虑不想存储原始输入值，你可以验证两个输入是否产生相同的哈希值。\n\
  \n这通常是网站存储密码的方式，正如我们在 `ch09.xhtml_ch09` 中看到的。当用户首次设置密码时，Web 服务器会在数据库中存储密码的哈希值，但会故意忘记实际的密码值。当用户以后在网站上重新输入密码时，服务器会重新计算哈希值并与存储的哈希值进行比较。如果两个哈希值不同，说明用户输入的错误的密码，这意味着应该拒绝凭据。通过这种方式，网站可以在不知道每个用户密码的情况下检查密码的正确性。（以明文形式存储密码是有危害：如果攻击者破解了数据库，他们将获得所有用户的密码。）\n\
  \n##### 消息认证码\n\n`message authentication code (MAC)`（消息认证码）算法与密码学哈希函数相似（并且通常构建在其之上），它们将任意长度的输入映射到唯一的固定大小输出。该输出本身被称为\
  \ `message authentication code`。然而，MAC 算法比哈希函数更专门，因为重新计算 MAC 需要一个密钥。这意味着只有持有密钥的双方才能生成或验证消息认证码的有效性。\n\
  \n\n\n\nMAC 算法用于确保用于在互联网上传输的数据包不会被攻击者伪造或篡改。要使用 MAC 算法，发送端和接收端计算机会交换一个共享密钥——通常作为\
  \ TLS 握手的一部分。（该密钥本身在发送之前会进行加密，以避免被窃取的的风险。）从该点起，发送端将为发送的每个数据包生成一个 MAC 并将其附加到数据包上。因为接收端计算机具有相同的密钥，它可以从消息中重新计算\
  \ MAC。如果计算出的 MAC 与数据包附上的值不符，则说明数据包已经过某种形式的篡改或损坏，或者它不是由原始计算机发送的。因此，接收端会拒绝该数据包。\n\n\
  如果你已经读到了这里并且仍在关注，恭喜你！密码学是一门庞大且复杂的学科，有自己特定的术语。理解它是如何融入互联网协议的，需要你在大脑中同时平衡多个概念，因此感谢你的耐心。让我们来看看我们讨论过的各种类型加密算法是如何被\
  \ TLS 使用的。\n\n### TLS 握手\n\nTLS 使用加密算法的组合来高效且安全地传递信息。为了速度，大多数通过 TLS 传输的数据包将使用对称加密算法加密，通常称为\
  \ `block cipher`（分组加密），因为它加密的是流式信息的“块”。记住，对称加密算法容易被窃听对话的恶意用户窃取其加密密钥。为了安全地传递用于分组加密的加密/解密密钥，TLS\
  \ 在将密钥传递给接收端之前会使用 `asymmetric`（非对称）算法对密钥进行加密。最后，使用 TLS 传输的数据包将使用消息认证码进行标记，以检测任何数据是否被篡改。\n\
  \n在 TLS 会话开始时，浏览器和网站会执行 `TLS handshake` 以确定它们应该如何通信。在握手的第一阶段，浏览器将列出它支持的多个加密套件。让我们来深入研究一下这意味着什么。\n\
  \n#### 加密套件\n\n`cipher suite`（加密套件）一组用于保护通信的算法。在 TLS 标准下，一个加密套件由 `three` 个独立的算法组成。第一种算法\
  \ `key-exchange algorithm（密钥交换算法）是一种非对称加密算法。通信计算机用它来交换第二种加密算法的密钥：即用于加密 TCP 数据包内容的对称分组加密。最后，加密套件指定了一个\
  \ MAC 算法来验证加密消息。\n\n让我们让它更具体化。像 Google Chrome 这样支持 TLS 1.3 的现代网络浏览器提供了许多加密套件。写作时，其中一个套件有一个非常响亮的名字\
  \ `ECDHE-ECDSA-AES128-GCM-SHA256`。这个特定的加密套件包括 `ECDHE-RSA` 作为密钥交换算法，`AES-128-GCM`\
  \ 作为分组加密，以及 `SHA-256` 作为消息认证算法。\n\n想了解更多完全没必要的细节吗？嗯，`ECDHE` 代表 `Elliptic Curve Diffie–Hellman\
  \ Exchange`（椭圆曲线迪菲-赫曼交换，一种在不安全通道上建立共享秘密的现代方法）。`RSA` 代表 `Rivest–Shamir–Adleman` 算法（第一种实用的非对称加密算法，由三位数学家在\
  \ 9970 年代喝了很多逾越节酒后发明）。`AES` 代表 `Advanced Encryption Standard`（高级加密标准，由两位比利时密码学家发明，并经过美国标准与技术研究院为期三年的评审选定）。这种特定变体在\
  \ Galois/计数器模式下使用 128 位密钥，由名称中的 `GCM` 指定。最后，`SHA-256` 代表 `Secure Hash Algorithm`（具有\
  \ 256 位字长的哈希函数）。\n\n看到我所说的现代加密标准的复杂性了吗？现代浏览器和 Web 服务器支持相当多的加密套件，而且 TLS 标准不断在添加新的套件。随着现有算法的缺陷被发现以及计算能力变得廉价，安全研究人员会更新\
  \ TLS 标准以保持互联网的安全。作为 Web 开发者，理解这些算法的工作原理并不是特别重要，但保持你的 Web 服务器软件更新到确是非常重要的，这样你就可以支持最现代、最安全的算法。\n\
  \n#### 会话启动\n\n让我们继续刚才。在 TLS 握手的第二阶段，Web 服务器选择它能支持的最安全的加密套件，然后指示浏览器使用这些算法进行通信。同时，服务器会传回一个\
  \ `digital certificate`（数字证书），其中包含服务器名称、保证证书真实性的受信任证书颁发机构，以及用于密钥交换算法的 Web 服务器加密密钥。（我们将在下一节讨论什么是证书以及为什么它们对安全通信是必要的。）\n\
  \n一旦浏览器验证了证书的真实性，两台计算机就会生成一个 `session key`（会话密钥），将使用选定的分组加密来加密 TLS 会话。（注意，此会话密钥与之前章节讨论的\
  \ HTTP `session identifier` 不同。TLS 握手发生在互联网协议更低的层级，而此时 HTTP 会话尚未开始。）会话密钥是由浏览器生成的巨大随机数，使用密钥交换算法通过数字证书附上的（公共）密钥进行加密，并传输到服务器。\n\
  \n现在，最后，TLS 会话可以开始了。从此之后的一切都将使用分组加密和共享会话标识符进行安全加密，因此数据包对于任何监控对话的人来说都是不可破解的。浏览器和服务器使用约定的加密算法和会话密钥双向加密数据包。数据包还使用消息认证码进行认证和防篡改处理。\n\
  \n### 启用 HTTPS\n\n如你所见，互联网安全通信的背后是大量复杂的数学。坦率地说，作为 Web 开发者，启用 HTTPS 涉及的步骤要简单得多。现在我们解决了理论问题，让我们来看看保护你的用户所需的实际步骤。\n\
  \n大多数现代网络浏览器都是自动更新的；每个主要浏览器的开发团队都处于支持现代 TLS 标准的最前沿。你 Web 服务器软件的最新版本将同样支持现代的 TLS\
  \ 算法。这意味着作为开发者，你剩下的唯一责任就是获取数字证书并将其安装到你的 Web 服务器上。让我们讨论如何这样做，并阐明为什么证书是必要的。\n\n###\
  \ 数字证书\n\n\n\n\n`digital certificate`（也称为`公钥证书`）是一种用于证明公钥加密所有权的电子文档。数字证书在 TLS 中用于将加密密钥与互联网域名（例如\
  \ `example.com`）关联起来。它们由`certificate authorities`（证书颁发机构）颁发，这些机构充当浏览器和网站之间受信任的第三方，保证特定的加密密钥应用于加密发送到该网站域名的数据。浏览器软件会信任数百个证书颁发机构——例如\
  \ `Comodo`、`DigiCert`以及最近的非营利组织 `Let’s Encrypt`。当受信任的证书颁发机构为某个密钥和域名背书时，它向你的浏览器确保你正在使用正确的加密密钥与正确的网站通信，从而阻止攻击者展示恶意网站或证书。\n\
  \n你可能会问：为什么在互联网上交换加密密钥需要第三方呢？毕竟，非对称加密的意义意义不就是服务器本身可以自由地提供公钥吗？虽然这句说法是正确的，但在互联网上获取加密密钥的实际过程取决于互联网将域名映射到\
  \ IP 地址的`Domain Name System (DNS)` 系统的的可靠性。在某些情况下，DNS 容易受到`spoofing attacks`的影响，这种攻击可将互联网流量从合法服务器重定向到攻击者控制的\
  \ IP 地址。如果攻击者能够伪造互联网域名，他们就可以颁发自己的加密密钥，而受害者对此一无所知。\n\n证书颁发机构的存在是为了防止加密流量被伪造。如果攻击者找到一种将流量从合法（安全的）网站重定向到其控制的恶意服务器的方法，该攻击者通常不会拥有网站证书对应的解密密钥。这意味着他们无法解密使用网站数字证书附带的加密密钥所加密的拦截流量。\n\
  \n另一方面，如果攻击者提供一个与他们`确实`拥有的解密密钥对应的`alternative（替代）数字证书，该证书将没有经过受信任证书颁发机构的验证。任何访问伪造网站的浏览器都会向用户显示安全警告，强烈劝阻他们继续访问。\n\
  \n通过这种方式，证书颁发机构使用户信任他们正在访问的网站。你可以通过点击浏览器栏中的锁图标来查看网站正在使用的证书。那里描述的信息可能并不有趣，但当证书无效时，浏览器会很好地为你发出警告。\n\
  \n### 获取数字证书\n\n从证书颁发机构为你的网站获取数字证书需要几个步骤，通过这些步骤，机构将验证你拥有该域名。执行这些步骤的具体方法取决于你选择哪个证书颁发机构。\n\
  \n第一步是生成`key pair`（密钥对），这是一个包含随机生成的公钥和私钥的小型数字文件。接下来，你使用此密钥对生成一个`certificate signing\
  \ request (CSR)`（证书签名请求），该请求包含你网站的公钥和域名，并将请求上传到证书颁发机构。在认可签名请求并颁发证书之前，证书颁发机构会要求向他们证明你对\
  \ CSR 中包含的域名具有控制权。一旦验证了域名所有权，就可以下载证书并将密钥对安装到你的 Web 服务器上。\n\n#### 生成密钥对和证书签名请求\n\n\
  密钥对和 CSR 通常使用命令行工具 `openssl` 生成。CSR 通常还包含域名和公钥之外的申请人其他信息，例如组织的法律名称和物理位置。这些信息会被包含在签名的证书中，但除非证书颁发机构选择验证它们，否则不是强制性的。在生成签名请求期间，由于历史原因，域名通常被称为`distinguished\
  \ name (DN)`或`fully qualified domain name (FQDN)`（完全限定域名）。[Listing 13-1]显示了如何使用\
  \ `openssl` 生成证书签名请求。\n\n```\nopenssl req -new -key ./private.key -out ./request.csr\n\
  ```\n\n*Listing 13-1: 在命令行中使用 openssl 生成证书签名请求*\n\n`private.key` 文件应包含一个新生成的私钥（也可以通过\
  \ `openssl` 生成）。`openssl` 工具将询问要纳入签名请求的详细信息，包括域名。\n\n#### 域名验证\n\n`Domain verification`（域名验证）是证书颁发机构验证申请互联网域名证书的人确实对该域名具有控制权的过程。在申请数字证书时，你是在声明你需要能够解密发送到特定互联网域名的流量。证书颁发机构会在其尽职调查中坚持检查你是否拥有该域名。\n\
  \n域名验证通常要求你对域名的 DNS 记录进行临时编辑，从而证明你拥有 DNS 的编辑权限。域名验证是防止 DNS 欺骗攻击的：攻击者除非也拥有编辑权限，否则无法申请证书。\n\
  \n#### 扩展验证证书\n\n某些证书颁发机构颁发`extended validation (EV)`（扩展验证）证书。这些证书要求证书颁发机构收集并验证有关申请证书的法律实体的信息。这些信息将包含在数字证书中，并在访问网站的浏览器中提供给用户。EV\
  \ 证书在大型组织中很受欢迎，因为公司名称通常显示在浏览器 URL 栏的锁图标旁边，增加了用户的信任感。\n\n#### 证书过期和撤销\n\n数字证书有有限的寿命（通常为几年或几个月），到后必须由证书颁发机构重新发行。证书颁发机构还会跟踪证书持有者自愿`revoked`（撤销）的证书。如果与你的数字证书对应的私钥泄露，作为网站所有者申请新证书并撤销之前的证书是非常重要的。浏览器在访问过期或撤销证书的网站时会向用户发出警告。\n\
  \n#### 自签名证书\n\n对于某些环境，特别是测试环境，从证书颁发机构获取证书是不必要的或不实际的。例如，仅在内部网络上的测试环境无法通过证书颁发机构的验证。然而，你可能希望在这些环境中支持\
  \ HTTPS，因此解决方案是生成自己的证书——`self-signed certificate`（自签名证书）。\n\n像 `openssl` 这样的命令行工具可以轻松生成自签名证书。遇到带有自签名证书的网站时，浏览器通常会向用户发出严厉的安全警告（此网站的安全证书不受予信任！），但仍然允许用户接受风险并继续。只需确保任何使用你测试环境的人都了解这一局限性，并知道警告产生即可。\n\
  \n\n\n\n证书颁发机构传统上是商业实体。即使今天，许多机构仍然对颁发的每个证书收取固定费用。自 2015 年以来，加州非营利组织 Let’s Encrypt\
  \ 开始提供免费证书。Let’s Encrypt 由（包括）Mozilla 基金会（负责 Firefox 浏览器的发布）和电子前沿基金会（一家位于旧金山的数字权利非营利组织）共同创立。因此，除非你需要商业证书颁发机构提供的扩展验证功能，否则几乎没有理由为证书付费。\n\
  \n### 安装数字证书\n\n一旦你拥有了证书和密钥对，下一步就是让你的 Web 服务器切换到使用 HTTPS，并将证书作为 TLS 握手的一部分进行提供。这个过程取决于你的主机托管提供商和服务器技术，尽管它通常非常简单且文档详尽。让我们回顾一个典型的部署过程——这需要一段简短的插叙。\n\
  \n### Web 服务器 vs 应用服务器\n\n在本书的目前为止，我将 Web 服务器描述为用于拦截和响应 HTTP 请求的机器，并讨论了它们如何返回静态内容或在响应每个请求时执行代码。这种描述是准确的，但它忽略了网站通常是作为*一对*运行中的应用程序部署的这一事实。\n\
  \n运行典型网站第一个应用程序是*Web 服务器*，它提供静态内容并执行低层 TCP 功能。这通常是像 `Nginx` 或 `Apache HTTP Server`\
  \ 的东西。Web 服务器用 `C` 语言编写，并经过优化以快速执行低层 TCP 功能。\n\n这对第二个应用程序是*应用服务器*，它位于 Web 服务器的下游，托管构成网站动态内容的代码和模板。每种编程语言都有许多应用服务器可用。对于\
  \ Java 语言编写的网站，典型的应用服务器可能是 `Tomcat` 或 `Jetty`；对于 Ruby on Rails 网站，可能是 `Puma` 或 `Unicorn`；对于\
  \ Python 网站，可能是 `Django`、`Flask` 或 `Tornado`；以此此类推。\n\n令人困惑的是，Web 开发者经常会随口将他们使用的应用服务器称为“Web\
  \ 服务器”，因为那是他们花费大部分时间编写代码的环境。事实上，单独部署应用服务器是完全可能的，因为应用服务器可以做 Web 服务器能的所有事情，尽管效率低一些。当\
  \ Web 开发者在自己的机器上编写和测试代码时非常典型的设置。\n\n### 配置你的 Web 服务器使用 HTTPS\n\n数字证书和加密密钥几乎总是部署在\
  \ Web 服务器上的，因为它们比应用服务器快得多。将 Web 服务器切换到 HTTPS 需要更新 Web 服务器配置，使其接受标准 HTTPS 端口（`443`）上的流量，并告诉它在建立\
  \ TLS 会话时使用的数字证书和密钥对的位置。列表 13-2 显示了如何将证书添加到 `Nginx` Web 服务器的配置文件。\n\n```\nserver\
  \ {\n    listen              443 ssl;\n    server_name         www.example.com;\n\
  \    ssl_certificate     www.example.com.crt;\n    ssl_certificate_key www.example.com.key;\n\
  \    ssl_protocols       TLSv1.2 TLSv1.3;\n    ssl_ciphers         HIGH:!aNULL:!MD5;\n\
  }\n```\n\n列表 13-2：配置 `Nginx` 时描述数字证书 (`www.example.com.crt`）和加密密钥 (`www.example.com.key`）的位置\n\
  \n以这种方式处理 TLS 功能的 Web 服务器将解密传入的 HTTPS 请求，并将任何需要由下游应用服务器处理的请求作为未加密的 HTTP 请求传递下去。这被称为在\
  \ Web 服务器上*终止 HTTPS*：Web 服务器和应用服务器之间的流量是不安全的（因为加密已被剥离），但这通常不是一个安全风险，因为流量没有离开物理机器（或者至少，将仅通过私有网络传输）。\n\
  \n### 那 HTTP 呢？\n\n配置你的 Web 服务器在端口 `443` 上监听 HTTPS 请求需要对配置文件进行一些编辑。然后你需要决定你的 Web\
  \ 服务器将如何处理来自标准 HTTP 端口（`80`）的未加密流量。通常的方法是指示 Web 服务器将不安全的流量重定向到相应的安全 URL。例如：如果用户代理访问\
  \ `http://www.example.com/page/123`，Web 服务器将响应 HTTP 301 响应，引导用户代理访问 `https://www.example.com/page/123`。浏览器会将此理解为在协商\
  \ TLS 握手后在端口 `443` 上发送相同请求的指令。列表 13-3 显示了如何在 `Nginx` Web 服务器上将端口 `80` 上的所有流量重定向到端口\
  \ `443` 的示例。\n\n```\nserver {\n    listen 80 default_server;\n    server_name _;\n\
  \    return 301 https://$host$request_uri;\n}\n```\n\n列表 13-3：在 `Nginx` Web 服务器上将所有\
  \ HTTP 重定向到 HTTPS\n\n### HTTP 强制传输安全 (HSTS)\n\n此时，你的网站已设置好与浏览器进行安全通信，并且任何使用 HTTP\
  \ 的浏览器都将重重定向到 HTTPS。你还有一个最后的漏洞需要处理：你需要确保在初始连接期间不会发送敏感数据。\n\n当浏览器访问一个它以前访问过的网站时，浏览器会在\
  \ Cookie 头部中返回网站之前提供的任何 Cookie。如果到网站的初始连接是通过 HTTP 完成的， \n\n你的网站应该通过实施 *HTTP 强制传输安全\
  \ (HSTS)* 策略，指示浏览器*仅*通过 HTTPS 连接发送 Cookie。你通过在响应中设置 `Strict-Transport-Security`\
  \ 头部来实现这一点。遇到此头部的现代浏览器将记住仅使用 HTTPS 连接到你的网站。即使用户显式输入 HTTP 地址如 `http://www.example.com`，浏览器也会自动切换到\
  \ HTTPS。这保护了 Cookie 在初始连接期间被窃取。列表 13-4 显示了在使用 `Nginx` 时如何添加 `Strict-Transport-Security`\
  \ 头部。\n\n```\nserver {\n    add_header Strict-Transport-Security \"max-age=31536000\"\
  \ always;\n}\n```\n\n列表 13-4：在 `Nginx` 中设置 HTTP 强制传输安全\n\n浏览器将在 max-age 指定的秒内不再通过\
  \ HTTP 发送任何 Cookie，之后它将再次检查网站是否更改了策略。\n\n## 攻击 HTTP（以及 HTTPS）\n\n在本章的现在，你可能会问：如果选择*不*使用\
  \ HTTPS，最坏会怎样？我还没有真正描述未加密的 HTTP 是被利用的，所以让我们解决这个问题。互联网上弱加密或未加密的通信允许攻击发起中间人攻击，通过他们篡改或监听\
  \ HTTP 会话。让我们看看来自黑客、互联网服务提供商和政府的近期示例。\n\n### 无线路由器\n\n无线路由器是中间人攻击的常见目标。大多数路由器包含一个精版的\
  \ Linux 操作系统安装，这使其能够路由流量到本地*互联网服务提供商 (ISP)* 并托管一个简单的配置界面。对于黑客来说是一个完美的目标，因为该 Linux\
  \ 安装通常*永远*不会更新安全补丁——而且相同的操作系统版本被安装在成千上万家庭中。\n\n\n\n\n\n2018 年 5 月，思科安全研究人员发现超过 50\
  \ 万台 Linksys 和 Netgear 路由器被一种名为`VPNFilter` 的恶意软件感染。该软件会监听通过路由器的 HTTP 流量，代表一个未知攻击者窃取网站密码和其他敏感用户数据，该攻击者被认为与俄罗斯政府有关。VPNFilter\
  \ 甚至尝试执行`downgrade attacks`，通过干扰与热门网站的初始 TLS 握手，使浏览器选择使用较弱的加密或完全不加密。\n\n使用 HTTPS\
  \ 的网站对这种攻击免疫，因为 HTTPS 流量对于接收网站以外的任何人都是无法破解的。指向其他网站的流量可能会被黑客窃取并挖掘敏感数据。\n\n### Wi-Fi\
  \ 热点\n黑客发起中间人攻击的一种技术要求较低的方法是在公共场所简单搭建自己的 Wi-Fi 热点。我们很少有人关注设备所使用的 Wi-Fi 热点的名称，因此攻击者很容易在咖啡馆或酒店大堂等公共空间建立热点，等待由于疏忽的用户连接。由于`TCP`\
  \ 流量在通往互联网服务提供商（ISP）的过程中会经过黑客的设备，黑客将能够将流量记录到磁盘并进行梳理，以提取信用卡号和密码等敏感细节。受害者发现异常的唯一迹象是攻击者离开物理位置并关闭热点，导致受害者断开网络连接。加密流量可以防御这种攻击，因为黑客无法读取其捕获的任何流量。\n\
  \n#### 互联网服务提供商\n互联网服务提供商将个人用户和企业连接到互联网骨干网，考虑到传输数据的潜在敏感性，这是一个极受信任的位置。你可能认为这会阻止他们窥视或干扰\
  \ HTTP 请求，但对于像 Comcast 这样的公司（美国最大的 ISP 之一）并非如此，多年来一直在通过其服务器的 HTTP 流量中注入 JavaScript\
  \ 广告。Comcast 声称这是提供的一种服务（许多广告会告知用户每月流量套餐已使用了流量），但数字权利倡导者认为这种方法等同于邮递员在密封信封中塞入广告材料。\n\
  \n使用 HTTPS 的网站对这种篡改具有免疫，因为每个请求和响应的内容对 ISP 来说都是透明的。\n\n### 政府机构\n政府机构监视你的互联网流量似乎可能像阴谋论中的故事，但大量的证据表明这确实在发生。美国`国家安全局\
  \ (NSA)`已成功实施了中间人攻击来进行监视。前 NSA 承包爱德华·斯诺登泄露的一份内部演示稿描述了巴西国家级石油生产商 Petrobras 如何被监视：NSA\
  \ 获取了 Google 网站的数字证书，然后托管了自己的仿造网站，在代理指向 Google 的流量的同时收割用户凭据。我们并真的不知道这类程序的范围有多大，但想想这确实令人不安。（如果有政府人员正在读这里：实际上，这种程序是好的，能让我们保持安全，本书的作者完全支持它。）\n\
  \n### 总结\n你应该使用 HTTPS 来确保从 浏览器到你网站的通信保持私密且不被篡改。HTTPS 是通过传输层安全（`TLS`）发送的 HTTP。当 Web\
  \ 服务器和用户代理参与 TLS 握手时，就会启动一个 TLS 会话。在 TLS 握手期间，浏览器会提供其能够支持的密码套件列表。每个密码套件包含一个密钥交换算法、一个块密码和一个消息认证码算法。Web\
  \ 服务器选择一个它支持的密码，并返回其数字证书。\n\n然后，浏览器使用附在数字证书上的公钥通过密钥交换算法加密一个（随机生成的）TLS 会话标识符，并发送到\
  \ Web 服务器。最后，当双方都拥有会话标识符时，他们将其作为后续往返消息的加密/解密密钥，并使用选定的块密码进行加密。每个数据包的真实性将使用消息认证码算法进行验证。\n\
  \n数字证书由少数证书颁发机构发布，它们会在发布证书之前你在域名系统中证明你对所选域的所有权。通过作为浏览器和网站之间受信任的第三方，证书颁发机构防止伪造网站展示假证书。\n\
  \n一旦为网站获得了证书，你需要通过 HTTPS 提供内容。这意味着配置你的 Web 服务器接受端口 `443` 的流量，告诉它在哪里找到证书和相应的解密密钥，并将端口\
  \ `80` 的 HTTP 流量重定向到端口 `443` 的 HTTPS 流量。最后，你应该通过设置 HTTP 强制传输安全策略，指示浏览器在升级到 HTTPS\
  \ 之前不要在 HTTP 请求中发送任何敏感数据（例如会话 Cookie）。\n\n请务必定期更新你的 Web 服务器技术，以确保你使用的是最现代（因此最安全）的密码套件。随着旧算法被破解或发现存在漏洞，加密标准正在不断地被研究和增强。\n\
  \n在我们讨论保持 Web 服务器更新的需求时，你应该更广泛地考虑如何测试、保护和管理你用于提供网站服务的任何第三方应用程序。这正是你将在下一章中要做的！\n\n\
  ## 14\n### 第三方代码\n![image](img/common01.jpg)\n\n现在没有人从零开始构建软件，Web 开发人员更是如此。驱动你网站的大部分代码——从操作系统、Web\
  \ 服务器，到你使用的编程语言库——都将由他人编写。那么，你该如何管理他人代码中的漏洞呢？\n\n黑客经常针对热门软件组件中的已知漏洞，因此保护第三方代码至关重要。对于黑客来说，例如在网上扫描不安全的\
  \ WordPress 实例，比挑选一个特定网站并试图弄清楚可能存在哪些漏洞要高效得多。因此，保持最新的安全补丁至关重要，以避免被恶意扫描命中。\n\n本章讨论了保护第三方代码的三种方法。你将学习如何跟进你的`dependencies`（即你使用的软件组件）的安全告警。接下来，你将深入研究正确`配置`这些依赖项的重要性，以免它们在无意中留下黑客可以利用的后门。最后，你将看到与第三方`services`相关的安全风险——这些代码在别人的服务器上运行，被你的\
  \ Web 服务器调用或通过 JavaScript 导入加载到你的网页中。特别是，你将查看通过广告网络部署恶意软件这种极其流行的策略——所谓的*恶意广告*（malvertising），并研究如果你的网站包含广告时保护你用户的方法。\n\
  \n### 保护依赖项\n\n\n\n\n\n2014 年 4 月，OpenSSL 的作者（OpenSSL 是一个为大多数 Linux 版本及其他操作系统实现\
  \ TLS 的开源 C 语言库）泄露了“心脏血溢”（Heartbleed）漏洞的存在：通过使用缓冲区溢读，攻击者可以利用受漏洞的库从服务器上读取任意内存块，从而窃取加密密钥、用户名、密码和其他敏感数据。互联网上最流行的两个\
  \ Web 服务器——Apache 和 Nginx 使用 OpenSSL 来保障通信，安全公司 AVG 的研究人员估计，一夜之间就有超过 50 万个网站被发现容易受到攻击。由于影响的网站数量巨大，心脏血溢漏洞被誉为史上最危险的漏洞。\n\
  \n修复该漏洞的新版本 OpenSSL 在漏洞披露的当天发布了，但在随后的几个月里，未打补丁的 Web 服务器在互联网上仍然常见。当时运行未打补丁的 Web 服务器是非常危险的时期：黑客有时间寻找利用漏洞的最佳方法，而受影响网站池的缩小使得剩余的\
  \ Web 服务器更容易成为攻击目标。\n\n所有网站都使用第三方代码，而所有第三方库——即使是由安全专家编写的（如 OpenSSL）也可能存在安全问题。如果你想领先于这些漏洞，你需要在安全问题公开后立即意识到它们，并及时修补软件。这涉及三个方面：准确了解你正在运行哪些依赖项、能够快速更新依赖项，以及对依赖项的安全问题保持警惕。让我们逐一讨论。\n\
  \n### 了解你正在运行的代码\n\n保护依赖项的第一步是了解它们是什么。这听起来可能显而易见，但现代软件栈复杂且多层次，在软件开发生命周期的开发阶段很容易添加新库，而你之后可能会忘记它们。你真的应该使用许多工具来组织你的依赖项。\n\
  \n### 依赖管理工具\n\n大多数编程语言都带有一个`dependency manager`（依赖管理器），允许开发团队在配置文件指定第三方依赖。描述的软件库将在构建过程中按需下载。依赖管理器使得获取新依赖项以及在新环境中（例如在部署到服务器时）重新构建软件栈变得轻而易举。\n\
  \n为了完全确定你运行的是每个依赖项的哪个版本，你应该养成在依赖列表中为每个依赖项指定明确 `version numbers`（版本号）的习惯。依赖管理系统中提供的软件包托管在互联网上的远程仓库中。当包作者发布包的新版本时，它们将带有新版本号添加到仓库中。默认情况下，大多数依赖管理器会在你首次在新环境中运行构建时获取每个依赖项的最新版本。这在初始开发期间是一个合理的默认行为，但当你发布代码时，你的依赖配置文件应该显式列出版本号。安全告告会披露哪些版本的依赖项存在漏洞，因此确定你在每个环境中运行的版本将告诉你哪些需要修补。\n\
  \n同时请注意，你声明的依赖项本身可能也有自己的依赖项——你的依赖管理器也会贴心地帮助获取这些库。出于这个原因，我们谈论 `dependency tree`（依赖树），因为每个依赖项都有指向其他依赖项的分支。在评估安全风险时，务必考虑*整个*依赖树。你的依赖管理器可以在命令行中输出整棵树（包括依赖项的依赖项）。Listing\
  \ 14-1 显示了 Node.js 项目的依赖树，说明了 `@blueprintjs/core` 库如何将 `popper.js` 库作为子依赖。\n\n```\n\
  my_project@0.0.0 /usr/code/my_project\n\n├─┬ @blueprintjs/core@3.10.0\n│ ├─┬ @blueprintjs/icons@3.4.0\n\
  │ │ ├── classnames@2.2.6 deduped\n│ │ └── tslib@1.9.3 deduped\n│ ├── @types/dom4@2.0.1\n\
  │ ├── classnames@2.2.6 deduped\n│ ├── dom4@2.1.4\n│ ├── normalize.css@8.0.1\n│ ├──\
  \ popper.js@1.14.6\n│ ├── react-popper@1.3.3 deduped\n```\nListing 14-1：命令 `npm\
  \ list` 显示了 Node Package Manager 中的整个依赖树。\n\n### 操作系统补丁\n\n除了跟踪编程语言依赖之外，你还需要跟踪在操作系统级别部署的软件软件包。操作系统供应商（例如\
  \ Red Hat 和微软）经常发布安全补丁，因此你应该跟踪你在任何给定环境中使用的每个操作系统库的版本，并有一个及时升级服务器的策略。如果你在数据中心运行运行物理服务器，你的公司可能有专门的系统管理员来处理此事。如果你在云端的虚拟化服务器上（例如在\
  \ `Amazon EC2` 上）运行软件，你应该作为部署的一部分定期更新操作系统版本。使用 `Docker` 进行容器化也是跟踪操作系统依赖的极佳方法，因为\
  \ `Docker` 配置文件将显式列出实例化容器时要安装的软件。\n\n### 完整性检查\n\n最后一个考虑因素：你需要确保你*认为*正在运行的代码就是你*实际*运行的代码。依赖管理器和补丁工具会提供帮助。它们通过使用\
  \ `checksums`（校验和）来确保软件组件传输时未损坏——校验和是在依赖项上传到仓库时计算的数字指纹，并在下载使用依赖项时可以重新计算并验证。在向浏览器部署\
  \ JavaScript 代码和其他资源时，你应该努力提供相同的哈。\n\n现代浏览器允许通过在 HTML 的 `<script>` 和 `<style>` 标签中添加\
  \ `subresource integrity checks`（子资源完整性检查）来实现这一点。你的构建过程应该为你打算在客户端导入的每个资源文件生成校验和，并将该校验和分配给\
  \ `integrity` 属性。Listing 14-2 显示了如何使用 `openssl` 工具生成校验和。\n\n```\ncat FILENAME.js\
  \ | openssl dgst -sha384 -binary | openssl base64 -A\n```\nListing 14-2：在 Unix 中生成校验和，将\
  \ JavaScript 文件 `FILENAME.js` 传给 `openssl` 以生成摘要并将其编码为 Base64。\n\n浏览器会将脚本与预期的校验和进行比较，并在执行导入的代码之前验证是否匹配。这使得获得你服务器访问权的黑客想要将\
  \ JavaScript 文件替换为恶意代码变得困难得多，因为他们还必须访问并更改生成 `<script>` 标签的代码，如 Listing 14-3 所示。\n\
  \n```html\n<script src=\"https://example.com/example-framework.js\" integrity=\"\
  sha384-oqVuAfXRKap7fdgcCY5uykM6+R9Gq8K/uxy9rx7HNQlG\" crossorigin=\"anonymous\"\
  ></script>\n```\nListing 14-3：通过计算文件的校验和并将其添加到导入脚本的 HTML 标签的 `integrity` 属性中，确保导入的\
  \ JavaScript 文件的完整性。\n\n\n\n\n响应安全问题需要你能够快速部署补丁，这反过来意味着要有一套有序且脚本化的发布流程。第 5 章 已经涵盖了这大部分内容：你的发布流程应该是可靠的、可复的且可回滚的，并且发布应该与源码控制系统中的代码分支绑定。依赖管理器使用的配置文件应该被保留在源码控制之下，这样你就可以跟踪每次发布部署了每个依赖的哪些版本。\n\
  \n你经常会孤立地部署第三方组件的安全补丁——即在升级 `dependency` 版本的情况下，不向你自己的代码发布任何更改。即使是只包含第三方代码更改的发布，仍然需要你对网站进行\
  \ `regression test`（回归测试）：换句话说，就是确保升级后的依赖项不会破坏网站上的任何现有功能。如果你的单元测试具有良好的覆盖率，回归测试将更多地变成一种形式上的工作。单元测试运行期间执行的代码库行数越多，你需要的手动测试就越少。投入一些时间编写良好的单元测试将使部署安全补丁变得更快、更容易。\n\
  \n## 警惕安全问题\n\n通过仔细管理依赖项和可靠的发布流程，你已经处于保护你所使用的第三方代码的良好位置。拼图的最后一块是在安全问题公布时保持消息灵。得益于互联网，你有许多方法来跟进。\n\
  \n### 社交媒体\n\n安全告通过社交媒体和如 Twitter、Reddit 和 Hacker News `[`news.ycombinator.com/`](https://news.ycombinator.com/)`\
  \ 等新闻网站快速传播，因此这些网站是快速获取安全新闻极极方法。大型软件漏洞将在 `[`www.reddit.com/r/programming/`](https://www.reddit.com/r/programming/)`\
  \ 和 `/r/technology` 等子版中讨论，并通常会登上 Hacker News 的首页。\n\n如果你花时间在 Twitter 上关注技术专家和软件作者，安全问题往往会成为当日的话题。这也是跟进软件世界新进展的绝佳方式。\n\
  \n### 邮件列表和博客\n\n编程语言通常有发布重大新闻的邮件列表和频道。例如，Python 软件基金会发布每周通讯，并有自己的 Slack 频道。确保订阅与你技术栈相关的所有内容。\n\
  \n关于信息安全主题存在大量的博客。关注 Brian Krebs `[`krebsonsecurity.com/`](https://krebsonsecurity.com/)`\
  \ 和 Bruce Schneier `[`www.schneier.com/`](https://www.schneier.com/)`，获取对当今安全问题的深刻见解。\n\
  \n### 官方公告\n\n注意来自你的托管提供商和软件供应商的安全警报。当发生像 Heartbleed 这样的大安全问题时，托管公司会与其客户联系并引导他们完成补丁流程。微软著名的做法是每周二发布新补丁（`patch\
  \ Tuesday`），所以如果你使用微软技术，请确保订阅其通讯邮件。\n\n### 软件工具\n\n除了时刻关注动态之外，自动化工具还可以检查你的依赖项是否存在已知漏洞。Node.js\
  \ 在此领域领先，因为 `Node Package Manager (NPM)` 现在集成了 `npm audit` 命令，该命令可以与开源漏洞数据库交叉检查你的依赖版本。Ruby\
  \ 的对等工具是 `bundler-audit` 宝石；对于 Java 和 .NET，开放 Web 应用程序安全项目（OWASP）发布了一个名为 `dependency-check`\
  \ 的命令行工具。将这些工具整合到你的构建过程中，将会在每次构建代码时提醒你任何潜在的漏洞，并允许你评估每个漏洞周围的风险。\n\n你的源码仓库也可以提供帮助。GitHub\
  \ 会自动扫描托管在其网站上的代码，并在发现存在漏洞的依赖项时发布安全警报。\n\n### 了解何时升级\n\n需要注意的是，并非所有的安全问题都具有同等的优先级！不断升级你的依赖项可能会非常耗时，特别是由于特定公告中的许多安全疑虑可能在你的系统中通过其他因素得到了缓解。大型组织组织有正式的流程来审查安全警报、对它们进行排序，然后选择合适的行动。只要你的团队已经评估了涉及的风险，在下一次计划的发布中包含次要安全升级是完全可以接受的。\n\
  \n## 安全配置\n\n软件的安全性完全取决于其配置的安全性。这对于第三方软件来说尤为如此：如果你安装了一个新数据库并使用默认用户帐户和密码运行，你很快就会遇到麻烦。黑客经常在互联网上扫描运行默认设置的软件组件，因为他们知道许多网站所有者在安装软件时会忽略定制化配置。\n\
  \n如果你正在运行具有不安全配置的软件，你可能在向世界宣告这一事实。信息安全咨询小组 Offensive Security 托管了 Google Hacking\
  \ Database（Google 黑客数据库），这是一个你可以通过简单的 Google 搜索找到的不安全软件列表。Google 搜索爬虫在索引网页页面方面工作非常尽职，并提供了一套强大的工具来根据这些信息精炼搜索。例如，搜索\
  \ `index of /etc/certs` 将列出数百万向世界暴露其数字证书目录的 Web 服务器——这是一个重大的安全漏洞！\n\n使用安全配置部署依赖项是防止被黑客攻击的关键。安全配置要求使用强凭据设置服务、安全地存储配置信息，并限制攻击者在获得你环境某部分的访问后可能造成的破坏。让我们如何实现。\n\
  \n### 禁用默认凭据\n\n许多软件包都带有默认登录凭据，以便首次用户能够轻松上手运行。在将软件部署到测试或生产环境之前，确保你禁用了这些凭据。例如，如果你的数据库、Web\
  \ 服务器或内容管理系统是用管理员帐户部署的，它很快会被扫描互联网漏洞软件的机器人检测到。\n\n### 禁用开放目录列表\n\nWeb 服务器倾向于过度分享。例如，旧版本的\
  \ Apache 服务器会将 URL 路径映射到文件，如果 URL 中省略了文件名，它会热心地列出该目录包含的文件。`目录列表` 邀请黑客探索你的文件系统，允许他们搜索敏感数据文件和安全密钥。确保在你的\
  \ Web 服务器配置中禁用目录列表。列表 14-4 显示如何在 Apache 服务器中执行。\n\n```apache\n<Directory /var/www/>\n\
  \    Options Indexes FollowSymLinks\n    AllowOverride None\n    Require all granted\n\
  </Directory>\n```\n14-4：移除 Indexes 关键字防止此 Apache 配置文件生成目录列表。\n\n### 保护你的配置信息\n\n\
  你的 Web 服务器配置可能包含敏感信息，例如数据库凭据和 API 密钥。许多开发团队将配置文件存储在源码控制中以便于部署。然而，请考虑黑客访问你的源码控制系统后会做什么：这类敏感信息是黑客首先搜索的内容。数据库凭据、API\
  \ 密钥、私加密密钥、证书和其他敏感配置细节需要保持在源码控制 `外部`。\n\n\n\n\n\n一种常见的方法是在操作系统层面的环境变量中记录敏感配置，并让你的配置代码在启动时从这些环境变量中初始化。这些环境变量可以通过存储在服务器本地的配置文件进行初始化。\n\
  \n另一种方法是使用专门的配置存储器。亚马逊云服务（AWS）允许你在其系统管理器参数存储（Systems Manager Parameter Store）中安全地存储配置。微软服务器经常在活动目录（Active\
  \ Directory）中存储凭据，这允许细粒度的权限控制。在数据库表中存储配置是另一种选择，但你应该考虑如果攻击者获取了你数据库的权限，他们可能会如何扩大攻击。（你的\
  \ Web 服务器在加载其余配置之前，也必须访问你的数据库凭据！）\n\n保护配置信息的一种可靠方法是以加密形式存储它，并使用诸如 `AES-128` 的算法进行加密。这意味着黑客必须攻破你的配置数据*以及*你的解密密钥才能窃取你的凭据。只需记住将解密密钥存储在与配置文件不同的位置，否则安全益处将微乎其微。\n\
  \n## 加固测试环境\n\n预生产环境通常与生产环境安装相同的软件，但安全性通常较低。如果你的测试环境包含敏感数据——例如，如果你曾经从生产环境复制数据以帮助测试——你就需要配置测试环境，使其与生产环境一样安全。至关重要的是，生产环境和非生产环境不应共享凭据或\
  \ API 密钥；如果黑客设法破解了你的测试服务器，限制他们能造成的破坏是非常重要的。\n\n## 保护管理前端\n\n某些软件组件带有可以在互联网上访问的管理工具。管理界面是黑客最喜爱的目标。你经常会遇到恶意机器人，它们会通过测试是否存在\
  \ `/wp-login.php` 页面来探测未安全的 WordPress 实例，例如。\n\n如果你不打算使用这些管理前端，请在配置中禁用它们。如果你确实打算使用它们，请确保删除任何默认登录凭据，并在可能的情况下，限制可以访问它们的\
  \ IP 范围。请咨询你所软件栈的文档，或在 Stack Overflow (`https://stackoverflow.com/`) 上进行快速搜索以找到方法。\n\
  \n现在你已经学会了如何保护运行在服务器上的第三方代码，让我们来看看如何与运行在他人服务器上的代码进行安全集成。\n\n## 安全你所使用的服务\n\n第三方服务在现代\
  \ Web 开发中被广泛使用。你可能使用 Facebook  进行身份验证，使用 Google AdSense 在你的网站投放广告，使用 Akamai 托管静态内容，使用\
  \ SendGrid 发送事务电子邮件，以及使用 Stripe 处理支付。\n\n将此类服务集成到你的网站通常意味着要在服务商处创建账户、获取秘密访问凭据，并修改你的网站代码以使用该服务。这里有两个安全考虑因素。首先，黑客经常会尝试窃取你的访问凭据，以便访问你在这些服务的账户。这将允许他们挖掘有关你用户的信息，例如，或者在支付处理程序的情况下启动财务交易。其次，每个第三方服务都是你网站的潜在攻击向量，因为黑客会尝试攻破服务商以获取更广泛的目标。\n\
  \n让我们从第一个考虑因素开始：学习如何安全地存储你的访问凭据。\n\n### 保护你的 API 密钥\n\n许多第三方服务在你注册时会颁发应用程序编程接口（API）密钥，你的代码在与\
  \ API 交互时必须将该密钥作为访问令牌。API 密钥需要安全存储。通常，这意味着如上一节讨论的，在服务器的配置中安全地存储 API 密钥。\n\n某些 API\
  \ 会颁发*两个* API 密钥：一个可以安全传递给浏览器的*公钥*，用于从 JavaScript 发起 API 调用；以及一个必须安全地保留在服务器上的*私钥*，用于从服务器侧执行更敏感操作的私有\
  \ API 调用。公钥关联的权限较少。审核你的代码以确保这些密钥不会混淆！你不想意外将高权限的私钥发送给客户端。即使是是将你的配置变量命名为 `SECRET_KEY`\
  \ 这样简单的操作，也会提醒你的开发团队风险。\n\n其他服务允许你生成可以传递给客户端的临时访问令牌。通常，这些令牌只能使用一次，或在限制的时间窗口内使用，以防止恶意用户的用。这些访问令牌可以防止*重放攻击*，即攻击者通过重新发送\
  \ HTTP 请求试图重复支付。\n\n### 保护你的 Webhooks\n\n大多数 API 集成涉及从你的服务器或浏览器向服务商的 API 发起 HTTPS\
  \ 调用。当服务商需要反向调用时（例如，向你发送通知），它可能会要求你实现 webhook。这是你网站上的一个简单的“反向 API”，当事件发生时，服务商将向其发送\
  \ HTTPS 请求。例如，当用户打开电子邮件或你的支付处理程序发起支付时，你可能会收到 webhook 调用。\n\n由于 webhook 是公开 URL，互联网上的任何人都可以调用它，而不仅仅是服务商。如果服务商支持在调用\
  \ webhook 时发送凭据，你应该在处理 webhook 调用之前验证这些凭据是否正确。\n\n如果 webhook 调用纯粹是信息性的且不包含任何敏感数据，它可以在不带任何凭据的情况下发送。在这种情况下，攻击者可以轻松伪造此类\
  \ webhook 调用。准备好在进行进一步处理之前，通过向服务商的 API 进行进一步回调来验证通知。\n\n### 保护第三方提供的内容\n\n在他人的域名下提供恶意内容是黑客最喜爱的技巧；受害者可能会被他们信任的网站诱产生虚假的安全感。用户已经习惯了信任浏览器中的锁头图标，因此如果黑客能找到在大型公司安全证书下部署恶意软件的方法，他们就能骗更多受害者下载。\n\
  \n许多网站使用内容交付网络（CDN）或云存储（如 `S3`）来提供频繁访问的内容。当 Web 开发人员集成此类服务时，他们通常通过更改 DNS 将流量从其域名路由到该服务——例如，通过将\
  \ `subdomain.example.com` 等子域的流量重定向到该服务。使得第三方提供的内容可以使用网站的安全证书进行加密。\n\n黑客经常尝试*子域名接管*，通过在互联网上扫描描述指向未初始化或停用服务的\
  \ IP 地址的子域名 DNS 条目。然后他们将在服务商处注册，并*占有*列出的 IP 地址之一。这将允许他们利用受害者的域名创建指向其恶意内容的链接。\n\n\
  \n\n\n如果你的网站提供托管在 CDN 或云存储上的内容，你需要格外确保你的 `DNS` 条目仅指向活跃的 IP 地址。只有在确认该服务已在你的控制下正常运行后，才进行进行\
  \ `DNS` 更改，并且如果你更换了服务提供商，请及时撤销 `DNS` 更改。\n\n现在你已经知道了如何保护与服务提供商的集成，让我们来看看另一个方向的威胁。\n\
  \n### 服务作为攻击向量\n\n第三方服务可能成为针对你网站的恶意攻击的向量。这对于你将在客户端集成的服务来说尤为如此，因为你从第三方域名导入的任何 JavaScript\
  \ 都伴随着安全风险。\n\n让我们以 Google Analytics 为例。当你向网站中添加 Google Analytics 工具时，你需要在 Google\
  \ 注册账户以获取 `tracking ID`，然后在你想要跟踪用户活动的页面上导入外部 JavaScript，如列表 14-5 所示。\n\n```html\n\
  <script src=\"https://www.googletagmanager.com/gtag/js?id=GA_TRACKING_ID\"></script>\n\
  ```\n\n*列表 14-5：在网页中添加 Google Analytics 的配方*\n\n导入的代码可以读取页面 `DOM` 中的任何内容，包括用户输入的敏感数据。它还能够以可能具有误导性的方式对\
  \ `DOM` 进行更改；例如，为了欺骗用户输入凭据。在添加客户端服务时，考虑这些风险至关重要。恶意代码可能由第三方服务本身提供，也可能由攻破该服务的攻击者提供。（如果你好奇的话：Google\
  \ Analytics 从未被攻击者攻破。我只是在这里用它作为一个示例！）\n\n遗憾的是，目前的浏览器安全模型在考虑如何运行从第三方导入的客户端代码方面并不复杂。浏览器内的\
  \ JavaScript 代码运行在 `sandbox`（沙箱）中，这意味着它与底层操作系统隔离，无法访问磁盘上的文件，但从网页上不同源导入的 JavaScript\
  \ 文件都在都在同一个沙箱中运行。\n\n即将发布的 Web Components 规范（`https://www.webcomponents.org/`）目前由\
  \ HTML 标准委员会开发，它为代码和页面元素定义了更细粒度的权限。然而，在这些细节最终敲定并实现之前，你应该在网站上实施合理的安全预防措施。让我们通过观察目前（迄为止）最常见的第三方通道攻击向量：恶意广告（malvertising），来讨论如何保护你的客户端集成。\n\
  \n### 警惕恶意广告\n\n广告是现代网络的重要部分：互联网上的大部分内容由广告收入资助，公司每年在线广告上的支出超过 1000 亿美元。广告通常由第三方广告平台放置在网站上。网站所有者（在线广告世界中被称为发布者）会订阅广告平台，然后将其网站的不同区域标记为广告出现的地方。广告平台会在网站加载时，使用直接在在每个页面上导入的\
  \ JavaScript 填充这些空间。\n\nGoogle AdSense 等主要广告平台使用分析来识别发布者托管的内容类型以及访问网站的人群类型，以决定放置什么类型的广告。发布者有时直接与广告商交易，或者将他们的广告位放置在交易所，由广告买家在其中购买广告包。（广告买家可能会为特定的人口，例如访问运动鞋网站的\
  \ 18-25 岁男性购买 1000 次广告展示。）\n\n作为发布者，你对所投放的广告具有一定的控制权，但通常无法事先批准每一条广告。例如，Google AdSense\
  \ 允许发布者阻止某些类广告或特定的网站域名，或者在特定广告开始向用户展示后将其拒绝。\n\n这是一个安全风险，因为黑客经常利用广告平台作为攻击向量。恶意广告（malvertising）允许攻击者一次针对许多网站投放恶意软件。恶意广告是互联网上日益常见的威胁，会让发布者和广告网络陷入尴尬，并让他们的用户成为受害者。\n\
  \n### 避免恶意软件分发\n\n广告中的恶意软件通常通过漏洞工具包（exploit kits）传递，这些工具包在交付实际恶意代码（有效负载）之前，会判断特定的浏览器和操作系统是否存在漏洞。有效负载可能包括重定向或锁定浏览器的脚本、通过插件漏洞传递的病毒或勒索软件，甚至是在用户浏览器中挖掘加密货币的\
  \ JavaScript 代码。\n\n漏洞工具包的作者与安全研究人员正在进行军备竞赛。为了避免检测，漏洞工具包托管在动态生成的 URL 上，并通过仅发性触发来避免自动扫描。甚至观察到漏洞工具包尝试通过检测自己何时运行在虚拟机中防止恶意软件分析（恶意软件研究人员通常使用虚拟机在分析时隔离有害代码）。\n\
  \n如果你的用户受到你网站上广告投放的恶意软件攻击，你就将他们置于危险之中。你可以通过确保只与值得信的广告平台合作、在网页中使用的安全框架中部署广告，以及持续警惕恶意广告来保护他们。\n\
  \n### 使用声誉良好的广告平台\n\n在大多数情况下，防御恶意广告是广告平台的责任。他们与广告买家拥有关系，并且只有他们拥有足够的跨广告商的可见度来发现恶意行为者。\n\
  \nGoogle 是广告领域（迄为止）最大的玩家。Google 允许较小的发布者通过自助 AdSense 平台将其网站变现。较大的发布者获得 AdX 的访问权限，这是一个允许发布者指定广告合作伙伴并设置价格的平台。这两个平台都从第三方广告网络获取广告。\n\
  \nGoogle 在防御恶意广告方面异常敏锐，因为他们的很大一部分收入依赖于其广告平台。为了利用这一点，在选择广告平台时，你应该将 AdSense 或 AdX\
  \ 作为你的首选。\n\n然而，出于声誉考虑，Google 选择与某些类型的网站合作。例如，如果你托管成人或暴力内容，你将很难获得 AdSense 的批准。在这种情况下，你可能不得不与较小的广告平台合作，这些平台可能资源较少，且保护你免受恶意软件侵害的意愿较低。在选择平台之前请做好研究。\n\
  \n### 使用 SafeFrame\n\n在网页中隔离第三方内容最有效的方法是将内容托管在 `iframe` 标签内。在 `iframe`（内联框架）加载的\
  \ JavaScript 代码无法访问包含页面的 DOM。HTML5 通过向 `iframe` 标签添加 `sandbox` 属性添加了更细粒度的控制。该属性允许框架指定内容是否可以提交\
  \ POST 请求或打开新窗口。\n\n广告行业采用名为 SafeFrame 的标准，它允许发布者指定广告必须在 `iframe` 中运行。SafeFrame\
  \ 标准使用 `iframe` 标签，并添加了一个 JavaScript API，允许广告商克服 iframe 的原生局限性。例如，API 允许广告脚本知道框架何时可见并对大小变化做出响应。\n\
  \n\n\n\n您的广告平台将有一个仅`only` 显示 SafeFrame 标准广告的选项，您应该选择该选项。这将阻止任何试图在网页渲染时进行干扰的恶意广告脚本。\n\
  \n### 定制您的广告偏好\n\n大多数广告平台都允许您自定义向用户展示的广告内容类型。如果您使用 `Google AdSense`，请确保仅显示来自 Google\
  \ 认证广告网络的内容。众所周知，黑客会购买较小或已倒闭的广告网络的过期域名，以便投放恶意软件。\n\n同时，也要检查您正在展示哪些哪些类别的广告。您可能想要屏蔽“快速致富”计划和多级营销活动的广告，以及任何自称为“可下载实用程序”的广告。\n\
  \n### 审查并报告可疑广告\n\n定期从广告平台仪表板中审查在您的网站上显示的广告。（请记住：广告是为访问者定制的，因此仅仅在浏览器中访问您的网站并不会向您展示完整的广告范围。）报告并屏蔽任何看起来可疑的内容。在用户离开您的网站时记录出的\
  \ URL 也是一个好主意，这样您就可以跟踪所托管的广告是否将用户引导至可疑网站。\n\n### 总结\n\n第三方代码中的漏洞对您的网站构成了威胁。使用依赖管理器来跟踪您使用的第三方依赖项，将依赖清单保留在版本控制下，并指定显式的依赖项版本。确保您的构建和部署过程是脚本化的，以便在安全公告发布时能够轻松升级依赖项。（这应该包括操作系统补丁。）密切关注社交媒体和新闻网站，以便在安全公告发布时及时获知。使用审计工具检测依赖树中存在漏洞的软件组件。在网页上导入\
  \ JavaScript 时使用 `integrity` 属性，以便浏览器能够对这些文件进行验证。\n\n确保您没有在不安全的配置下运行；黑客会通过简单的 Google\
  \ 搜索发现不安全的软件组件。禁用系统的任何默认凭据，并在 Web 服务器配置中禁用开放目录列表。不要将敏感的配置详情（例如数据库访问凭据或 API 密钥）留存在版本控制中；相反，将它们存储在专门的配置存储中并在启动时加载。注意确保测试环境和管理前端的配置是安全的，因为它们是黑客的常见目标。\n\
  \n小心不要将敏感的 API 密钥或访问令牌传递给客户端。确保任何 webhooks 免受伪造攻击。如果您在您的域名下提供托管自其他位置的内容——例如，通过内容分发网络或云存储进行托管——请确保攻击者无法在这些系统中放置恶意软件并在您的安全证书保护下提供它。\n\
  \n了解您在网站上托管的任何广告可能带来的恶意软件风险。使用信誉良好的广告网络，并充分利用其允许的所有基于 SafeFrame 的安全设置。定期审查放置在您的网站上的广告。报告您发现的任何可疑广告并将其加入黑名单。\n\
  \n在下一章节中，您将查看与 XML 解析相关的漏洞。XML 是现代互联网中无处不在的一部分，也是黑客入侵您系统的常见目标。\n\n# 15 XML 攻击\n\n\
  ![image](img/common01.jpg)\n\n随着 90 年代互联网的爆炸式增长，各组织开始通过网络相互共享数据。在计算机之间共享数据意味着要同一种共享的数据格式。网页上的可读文档正在使用超文本标记语言\
  \ (HTML) 进行标记。机器可读的文件通常存储在一种类似的数据格式中，称为`可扩展标记语言 (XML)`。\n\nXML 可以被视为 HTML 的更通用的实现：在这种形式的标记中，标签和属性名称可以由文档作者选择，而不是像\
  \ HTML 规范中那样固定的。在 `Listing 15-1` 中，你可以看到一个描述书籍目录的 XML 文件，使用了 `<catalog>`、`<book>`\
  \ 和 `<author>` 等标签。\n\n```xml\n<?xml version=\"1.0\"?>\n<catalog>\n   <book id=\"\
  7991728882998\">\n      <author>Sponden, Phillis</author>\n      <title>The Evil\
  \ Horse That Knew Karate</title>\n      <genre>Young Adult Fiction</genre>\n   \
  \   <description>Three teenagers with very different personalities\n      team up\
  \ to defeat a surprising villain.</description>\n   </book>\n   <book id=\"28299171927772\"\
  >\n      <author>Chenoworth, Dr. Sebastian</author>\n      <title>Medical Encyclopedia\
  \ of Elbows, 12th Edition</title>\n      <genre>Medical</genre>\n      <description>The\
  \ world's foremost forearm expert gives detailed diagnostic\n      and clinical\
  \ advice on maintaining everyone's favorite joint.</description>\n   </book>\n</catalog>\n\
  ```\n\n*列表 15-1: 一个描述书籍目录的 XML 文档*\n\n这种数据格式的流行（特别是在互联网早期）意味着 XML `解析`（parsing，即将\
  \ XML 文件转换为内存中代码对象的过程）在过去几十年里的每个浏览器和 Web 服务器中都得到了实现。遗憾的是，XML 解析器是黑客的常见目标。即使您的网站在设计上不处理\
  \ XML，您的 Web 服务器也可能默认解析这种数据格式。本章将展示 XML 解析器是如何被攻击的，以及如何防御这些攻击。\n\n## XML 的用途\n\n\
  与 HTML 类似，XML 将数据项封装在标签之间，并允许标签相互嵌套。XML 文档的作者可以选择具有语义意义的标签名称，使 XML 文档具有自描述性。由于 XML\
  \ 具有很的可读性，这种数据格式被广泛用于编码供其他应用程序使用的数据。\n\nXML 的用途非常多。允许客户端软件通过互联网调用函数的应用程序编程接口 (APIs)\
  \ 经常使用 XML 接收和响应。网页中与服务器进行异步通信的 JavaScript 代码通常也使用 XML。许多类型的应用程序（包括 Web 服务器）使用基于\
  \ XML 的配置文件。\n\n### 验证 XML\n\n由于 XML 文件的作者可以选择文档中使用的标签名称，任何读取数据的应用程序都需要知道期望哪些标签以及它们出现的顺序。XML\
  \ 文档的预期结构通常由正式语法法描述，文档可以根据该语法进行*验证*。\n\n*语法*（grammar）文件会告知解析器该语言中哪些字符序列是有效的表达式。编程语言语法可能会规定，例如变量名只能包含字母和数字，并且某些运算符（如\
  \ `+`）需要两个输入。\n\n\n\n\nXML 有两种主要方式来描述 XML 文档的预期结构。`document type definition (DTD)`\
  \ 文件类似于经常用于描述编程语言语法的 `Bachus–Naur Form (BNF)` 记法。`XML Schema Definition (XSD)` 文件是一种更现代、更具表达力的替代方案，能够描述更广泛的\
  \ XML 文档；在这种情况下，语法本身是在 XML 文件中描述的。两种 XML 验证方法都被 XML 解析器广泛支持。然而，DTD 包含了一些可能让解析器受到攻击的特性，这就是我们将关注的重点。\n\
  \n## 文档类型定义\n\nDTD 文件通过指定文档中预期的标签、子标签和数据类型来描述 XML 文件的结构。Listing 15-2 显示了一个描述 Listing\
  \ 15-1 中 `<catalog>` 和 `<book>` 标签预期结构的 DTD 文件。\n\n```xml\n<!DOCTYPE catalog [\n\
  \n  <!ELEMENT catalog    (book+)>\n  <!ELEMENT book         (author,title,genre,description)>\n\
  \  <!ENTITY  author       (#PCDATA)>\n  <!ENTITY  title        (#PCDATA)>\n  <!ENTITY\
  \  genre        (#PCDATA)>\n  <!ENTITY  description (#PCDATA)>\n  <!ATTLIST book\
  \ id CDATA>\n]>\n```\n\n*Listing 15-2: 描述 Listing 15-1 中 XML 格式的 DTD 文件*\n\n此 DTD\
  \ 描述了顶层 `<catalog>` 标签预期包含零或多个 `<book>` 标签（数量由 `+` 符号表示），每个 `<book>` 标签预期包含描述作者、标题、类型和描述的标签，以及一个\
  \ `id` 属性。标签和属性预期包含解析后的字符数据（`PPCDATA`）字符数据（CDATACDATA`——即文本而不是标签。\n\nDTDs 可以包含在\
  \ XML 文档中以使文档能够自验证。然而，支持此类 `inline`（内联） DTD 的解析器容易受到攻击——因为上传此类 XML 文档的恶意用户可以控制 DTD\
  \ 的内容，而不是由解析器本身提供。黑客已使用内联 DTD 指数级地增加文档在解析期间消耗的服务器内存（XML 炸弹），并访问服务器上的其他文件（XML 外部实体攻击）。让我们来看看这些攻击是如何运作的。\n\
  \n### XML 炸弹\n\n`XML bomb` 使用内联 DTD 来导致 XML 解析器的内存使用爆炸。这将通过耗尽服务器可用的所有内存并导致其崩溃，使\
  \ Web 服务器离线。\n\nXML 炸弹利用了 DTD 可以指定简单字符串替换宏的特性，这些宏在解析时展开，被称为`internal entity declarations`内部实体声明）。如果一段文本在\
  \ XML 文件中频繁使用，你可以在 DTD 中将其声明为内部实体。这样，你就不需要在文档中每次需要它时都输入一遍——只需输入实体名称作为简写。在 Listing\
  \ 15-3 中，一个包含员工记录的 XML 文件通过使用内部实体声明在 DTD 中指定了公司名称。\n\n```xml\n<?xml version=\"1.0\"\
  ?>\n\n<!DOCTYPE employees [\n\n  <!ELEMENT employees (employee)*>\n  <!ELEMENT employee\
  \ (#PCDATA)>\n  <!ENTITY company \"Rock and Gravel Company\"❶>\n]>\n\n<employees>\n\
  \  <employee>\n    Fred Flintstone, &company;❷\n  </employee>\n  <employee>\n  \
  \  Barney Rubble, &company;❸\n  </employee>\n</employees>\n```\n\n*Listing 15-3:\
  \ 内部实体声明*\n\n字符串 `&company;` ❷ ❸ 充值 `Rock and Gravel Company` ❶ 的占位符。当文档被解析时，解析器将所有的\
  \ `&company;` 替换为 `Rock and Gravel Company`，并产生 Listing 15-4 所示的最终文档。\n\n```xml\n\
  <?xml version=\"1.0\"?>\n\n<employees>\n  <employee>\n    Fred Flintstone, Rock\
  \ and Gravel Company\n  </employee>\n  <employee>\n    Barney Rubble, Rock and Gravel\
  \ Company\n  </employee>\n</employees>\n```\n\n*Listing 15-4: 解析器处理 DTD 后的 XML 文档*\n\
  \n内部实体是有用的，尽管很少使用。当内部实体声明引用其他内部实体声明时，就会出现问题。Listing 15-5 显示了一系列构成 XML 炸弹的嵌套实体声明。\n\
  \n```xml\n<?xml version=\"1.0\"?>\n\n<!DOCTYPE lolz [\n  <!ENTITY lol \"lol\">\n\
  \  <!ENTITY lol2 \"&lol;&lol;&lol;&lol;&lol;&lol;&lol;&lol;&lol;&lol;\">\n  <!ENTITY\
  \ lol3 \"&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;&lol2;\">\n  <!ENTITY\
  \ lol4 \"&lol3;&lol3;&lol3;&lol3;&lol3;&lol3;&lol3;&lol3;&lol3;&lol3;\">\n  <!ENTITY\
  \ lol5 \"&lol4;&lol4;&lol4;&lol4;&lol4;&lol4;&lol4;&lol4;&lol4;&lol4;\">\n  <!ENTITY\
  \ lol6 \"&lol5;&lol5;&lol5;&lol5;&lol5;&lol5;&lol5;&lol5;&lol5;&lol5;\">\n  <!ENTITY\
  \ lol7 \"&lol6;&lol6;&lol6;&lol6;&lol6;&lol6;&lol6;&lol6;&lol6;&lol6;\">\n  <!ENTITY\
  \ lol8 \"&lol7;&lol7;&lol7;&lol7;&lol7;&lol7;&lol7;&lol7;&lol7;&lol7;\">\n  <!ENTITY\
  \ lol9 \"&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;&lol8;\">\n]>\n\n\
  <lolz>&lol9;</lolz>\n```\n\n*Listing 15-5: 一种被称为十亿次数的 XML 炸弹*\n\n当此 XML 文件被解析时，`&lol9;`\
  \ 字符串被替换为 10 次 `&lol8;`。然后，*每个* `&lol8;` 出现的地方都被替换为 10 次 `&lol7;`。`&lol7;` 字符串被替换为\
  \ 10 次。XML 文件的最终形式包含一个包含超过*十亿*次字符串的 `<lolz>` 标签。当 DTD 完全展开时，这个简单的 XML 文件将占用 3GB\
  \ 内存，足以导致崩溃！\n\n耗尽解析器的可用内存将使你的 Web 服务器离线，这使得 XML 炸弹成为黑客发起拒绝服务攻击的有效手段。攻击者只需要在你网站上找到接受\
  \ XML 上传的 URL，就可以让你离线。\n\n### XML 外部实体攻击\n\nDTDs 可以包含外部文件的内容。如果 XML 解析器配置为处理内联 DTD，攻击者可以使用这些*external\
  \ entity declarations*外部实体声明来探索本地文件系统或从 Web 服务器本身触发网络请求。\n\n典型的外部实体如 Listing 15-6\
  \ 所示。\n\n```xml\n<?xml version=\"1.0\" standalone=\"no\"?>\n\n<!DOCTYPE copyright\
  \ [\n  <!ELEMENT copyright (#PCDATA)>\n  <!ENTITY copy PUBLIC \"http://www.w3.org/xmlspec/copyright.xml\"\
  ❶\n]>\n\n<copyright>&copy;❷ </copyright>\n```\n\n*使用外部实体在 XML 文件中包含模板化版权文本*\n\n\
  根据 XML 1.0 规范，解析器预期读取外部实体指定的文件内容，并在引用实体的地方将该数据插入 XML 文档。在示例中，托管在 `http://www.w3.org/xmlspec/copyright.xml`\
  \ ❶ 的数据将插入到文本 `&copy;` ❷ 出现的任何 XML 文档中。\n\n外部实体声明引用的 URL 可以使用各种网络协议，取决于前缀。我们的示例\
  \ DTD 使用 `http://` 前缀，这将导致解析器发起 HTTP 请求。XML 规范还支持读取磁盘上的本地文件，使用 `file://` 前缀。出于这个原因，外部实体定义是一个安全*灾难*。\n\
  \n\n\n\n当 XML 解析器抛出错误时，错误信息通常会包含正在解析的 XML 文档的内容。利用这一点，黑客会使用外部实体声明来读取服务器上的文件。例如，一个恶意构造的\
  \ XML 文件可能包含对 Linux 系统上某个文件（如 `file://etc/passwd`）的引用。当解析器将此外部文件插入到 XML 文档时，XML\
  \ 就会变得格式错误——导致解析失败。随后，解析器会听从并将文件内容包含在错误响应中，从而允许黑客查看被引用文件中的敏感数据。通过使用这种技术，黑客可以读取易漏洞\
  \ Web 服务器上包含密码和其他机密信息的敏感文件。\n\n外部实体还可用于实施`服务端请求伪造 (SSRF)`攻击，攻击者借此可以从你的服务器触发恶意的 HTTP\
  \ 请求。配置不当的 XML 解析器每当遇到带有网络协议前缀的外部实体 URL 时，都会发起网络请求。能够欺骗你的 Web 服务器向他们选择的 URL 发起网络请求，这对于攻击者来说是一个巨大的助力！黑客已利用这一特性来探测内部网络、对第三方发起拒绝服务攻击，并伪装恶意\
  \ URL 调用。你将在下一章中学习更多关于 SSRF 攻击的风险。\n\n## 安全你的 XML 解析器\n\n这是一个保护解析器免受 XML 攻击的简单修复方法：在配置中禁用对内联\
  \ DTD 的处理。DTD 是一项遗留技术，而内联 DTD 绝对是一个坏主意。事实上，许多现代 XML 解析器默认都经过了加固，这意味着它们开箱即用就禁用了允许解析器受到攻击的功能，因此你可能已经受到了保护。如果你不确定，应该检查你正在使用什么（如果有的话）XML\
  \ 解析技术。\n\n接下来的章节描述如何在某些主要的 Web 编程语言中保护你的 XML 解析器。即使你认为你的代码没有解析 XML，你使用的第三方依赖可能以某种形式使用了\
  \ XML。确保你分析了整个依赖树，查看 Web 服务器启动时内存加载了哪些库。\n\n## Python\n\n`defusedxml` 库明确拒绝内联 DTD，它是\
  \ Python 标准 XML 解析库的无缝替换方案。请使用此模块代替 Python 标准库。\n\n### Ruby\n\nRuby 中解析 XML 的事实标准是\
  \ `Nokogiri` 库。该库从 `1.5.4` 版本起已针对 XML 攻击进行了加固，因此确保你的代码使用该或更高版本进行解析。\n\n### Node.js\n\
  \nNode.js 有多种解析 XML 的模块，包括 `xml2js`、`parse-xml` 和 `node-xml`。它们大多数在设计上省略了对 DTD 的处理，因此请确保查阅你所用解析器的文档。\n\
  \n## Java\n\nJava 有多种解析 XML 的方法。遵循 Java 规范的解析器通常通过 `javax.xml.parsers.DocumentBuilderFactory`\
  \ 类启动解析。列表 15-7 展示了如何在实例化该类的地方使用 `XMLConstants.FEATURE_SECURE_PROCESSING` 特性来配置安全的\
  \ XML 解析。\n\n```\nDocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
  \nfactory.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);\n```\n*列表 15-7：加固\
  \ Java XML 解析库*\n\n### .NET\n\n.NET 有多种解析 XML 的方法，包含在 `System.Xml` 命名空间中。`XmlDictionaryReader`、`XmlNodeReader`\
  \ 和 `XmlReader` 默认是安全的，`System.Xml.Linq.XElement` 和 `System.Xml.Linq.XDocument`\
  \ 也是如此。`System.Xml.XmlDocument`、`System.Xml.XmlTextReader` 和 `System.Xml.XPath.XPathNavigator`\
  \ 从 .NET `4.5.2` 版本起已通过安全。如果你使用的是早期版本的 .NET，应该切换到安全的解析器，或禁用对内联 DTD 的处理。列表 15-8 显示了如何设置\
  \ `ProhibitDtd` 属性标记来实现此操作。\n\n```\nXmlTextReader reader = new XmlTextReader(stream);\n\
  \nreader.ProhibitDtd = true;\n```\n*列表 15-8：在 .NET 中禁用内联 DTD 的处理*\n\n## 其他考虑\n\n\
  外部实体攻击的威胁说明了遵循`最小权限原则`的重要性，该原则规定软件组件和进程应授予执行任务所需的最小权限。XML 解析器很少有理由发起出站网络请求：考虑限制整个\
  \ Web 服务器的出站网络请求。如果你确实需要出站网络访问——例如，如果你的服务器代码调用了第三方 API——你应该在防火墙规则中将这些 API 的域名加入白名单。\n\
  \n同样，限制你的 Web 服务器可以访问的磁盘目录也同样重要。在 Linux 操作系统上，可以通过在 `chroot jail` 中运行 Web 服务器进程来实现，它会忽略运行进程更改根目录的任何尝试。在\
  \ Windows 操作系统上，你应该手动将 Web 服务器可以访问的目录加入白名单。\n\n### 总结\n\n可扩展标记语言（XML）是一种灵活的数据格式，广泛用于在互联网上交换机器读数据。如果你的\
  \ XML 解析器被配置为接受并处理内联文档类型定义（DTD），它可能会受到攻击。XML 炸弹利用内联 DTD 使解析器的内存爆炸，可能导致你的 Web 服务器崩溃。XML\
  \ 外部实体攻击引用本地文件或网络地址，可欺骗解析器显示敏感信息或发出恶意网络请求。确保你使用禁用了内联 DTD 解析的加固 XML 解析器。\n\n下一章将扩展本章中提到的一个概念：你的\
  \ Web 服务器的安全漏洞如何被黑客利用来对第三方发起攻击。即使你不是直接的受害者，做一个良好的互联网公民并停止利用你系统的攻击也是重要的。\n\n## 16：不要做帮凶\n\
  \n![image](img/common01.jpg)\n\n恶意行为者在互联网上有许多隐藏之处。黑客经常伪装他人并使用被攻破的服务器来躲避检测。本章将探索你的\
  \ Web 存在可能帮助攻击者逃脱恶意行为的各种方式，即使你并不是他们攻击的目标。\n\n确保自己不是帮凶将为你赢得良好的互联网公民积分。更务实地说，如果黑客正利用你的系统作为攻击他人的跳板，你会很快发现你的域名和\
  \ IP 地址被关键服务列入黑名单，你甚至可能被托管提供商断网。\n\n本章涵盖了几个可能让你成为互联网恶意行为帮凶的漏洞。前几个漏洞被黑客用于发送有害电子邮件：诈骗者经常使用`电子邮件地址欺骗`来伪装邮件发送者，并利用网站上的`开放重定向`来伪装邮件中的恶意链接。\n\
  \n接下来，你将看到你的网站如何被嵌入他人页面的框架中并作为`点击劫持`攻击的一部分。在这种攻击中，你的网站被用于一种诱敌计术，以欺骗用户点击有害内容。\n\n\
  \n\n\n最后，你将面对服务器上安装恶意软件以用于`botnet`（僵尸网络）的风险。你可能在不知情的情况下了僵尸代码，这些代码可以被攻击者远程控制！\n\n\
  ### 电子邮件欺诈\n\n邮件使用 `Simple Mail Transfer Protocol (SMTP)` 发送。`SMTP` 原始设计中的一个主要疏忽是它没有身份验证机制：邮件发送者能够在\
  \ `From` 头部中附加他们想指定的`any` 电子邮件地址，而且直到最近，接收代理还没有办法验证发送者是否是其所声称的身份。\n\n结果自然是，我们所有人都收到了大量的垃圾邮件。专家估计，所有发送的邮件中约有`half`\
  \ 是垃圾邮件——每天发送近 150 亿封垃圾邮件。垃圾邮件通常包含不想要的（且往往具有误导性的）营销材料，这对接收者来说是一种骚扰。\n\n与垃圾邮件相关的是`phishing`（钓鱼）邮件：发送者试图诱骗接收者泄露敏感个人信息，如密码或信用卡详情。一种常见的技巧是向受害者发送一封看起来像是其使用的网站的密码重置邮件，但将重置链接指向一个\
  \ `doppelganger domain`（双生域名）——该域名的名称在表面与托管虚假网站的真实域名看起来非常相似。该虚假网站将代表攻击者收集用户的凭据，然后将用户重定向到真实网站，让受害者毫无察觉。\n\
  \n这种攻击的另一种更为恶毒的形式是`spearphishing`（鱼叉式钓鱼），其恶意邮件的内容是针对小众群体身定制的。发送此类邮件的诈骗者通常会对受害者进行详细研究，以便能够提及同事姓名或冒充同事。根据\
  \ FBI 的数据，`CEO fraud`（CEO 诈骗——诈骗者冒充 C 级官员并邮件给另一名员工要求电汇）在 2016 年至 2019 年间为黑客赚了超过\
  \ 260 亿美元。而且这仅仅计算了向法律执法部门报告了损失的受害者。\n\n幸运的是，邮件服务提供商已经开发了复杂的算法来检测垃圾邮件和钓鱼邮件。例如，`Gmail`\
  \ 会扫描每封入站邮件，并快速判断其是否合法，将任何看起来可疑的内容发送到垃圾箱。\n\n垃圾过滤器在分类邮件时使用许多输入：邮件正文和主题中的关键词、邮件域名，以及邮件正文中是否存在任何可疑的导出链接。\n\
  \n你的网站和组织可能从自定义域名发送邮件，因此，防止你的邮件被标记为垃圾邮件并保护你的用户免受伪成你域名的恶意邮件的责任在于`you`。你有几种方法来实现：通过实施\
  \ `Sender Policy Framework`（发送者策略框架）以及在生成邮件时使用 `DomainKeys Identified Mail`（域名密钥识别邮件）。\n\
  \n### 实施发送者策略框架\n\n实施 `Sender Policy Framework (SPF)` 需要在 DNS 中将授权从你的网络域名发送邮件的 IP\
  \ 地址列入白名单。由于 `SMTP` 运行在 `TCP` 之上，邮件发送的 IP 地址无法像 `From` 头部那样轻易被伪造。通过在你的域名记录中显式地将\
  \ IP 地址加入白名单，邮件接收代理将能够验证入站邮件是否源自许可源。\n\nListing 16-1 显示了如何在 DNS 记录中指定发送者策略框架。\n\n\
  ```\nv=spf1❶ ip4:192.0.2.0/24 ip4:198.51.100.123❷ a❸ -all❹\n```\n\n*Listing 16-1:\
  \ 一条 DNS 记录，将授权从给定域名发送邮件的 IP 地址范围加入白名单，作为 SPF 的一部分*\n\n此记录将作为 `.txt` 记录添加到你的域名记录中。在此语法中，`v=`\
  \ 参数 ❶ 定义了所使用的 `SPF` 版本。`ip4` ❷ 和 `a` ❸ 标志指定了允许为给定域名发送信息的系统：在这种情况下，是一个 IP 地址范围，以及域名对应的\
  \ IP 地址（由 `a` 标志指示）本身。记录末尾的 `-all` 标志 ❹ 邮件提供者，如果之前的机制不匹配，则应该拒绝该消息。\n\n### 实施域名密钥识别邮件\n\
  \n`DomainKeys` 可用于为发出的邮件生成数字签名，以证明邮件是从你的域名合法发送的，并且在传输过程中未被修改过。`DomainKeys Identified\
  \ Mail (DKIM)` 使用公钥加密，通过私钥对来自域名的导出消息进行签名，并允许接收者使用托管在 DNS 中的公钥来验证签名。只有发送者知道私签名密钥，因此只有他们才能生成合法的签名。邮件接收代理将结合邮件内容和托管在你域名上的公签名密钥重新计算签名。如果重新计算的签名与附在邮件上的签名不匹配，该邮件将被拒绝。\n\
  \n要实施 `DKIM`，你需要在你的域名的 `.txt` 记录中添加一个 `DomainKey`。Listing 16-2 显示了一个示例。\n\n```\n\
  k=rsa;❶ p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDDmzRmJRQxLEuyYiyMg4suA❷\n```\n\n\
  *Listing 16-2: （公）域名密钥托管在 DNS 系统中，相应的私钥需要与为该域名生成邮件的应用程序共享。*\n\n在此示例中，`k` 表示密钥类型\
  \ ❶，`p` 是用于重新计算签名的公钥 ❷。\n\n### 安全你的电子邮件：实际步骤\n\n你的组织可能从多个位置生成邮件。响应用户在你的网站上的操作而发送给用户的邮件——称为事务性邮件——将由你的\
  \ Web 服务器触发，并且通常通过 `SendGrid` 或 `Mailgun` 等邮件服务生成。手动编写的邮件将通过网页邮件服务（例如 `Gmail`）或托管在你网络上的邮件服务器（例如\
  \ `Microsoft Exchange` 或 `Postfix`）发送。你的团队可能还在使用 `Mailchimp` 或 `TinyLetter` 等邮件服务。\n\
  \n咨询你的服务提供商或邮件服务器的文档，查看如何生成并添加实施 `SPF` 和 `DKIM` 所需的 DNS 条。事实上，你可能已经在使用 `DKIM` 了，因为许多事务性邮件和营销服务要求你在注册服务时添加相关的\
  \ DNS 条。当你作为 `SPF` 实施的一部分锁定 IP 范围和域名时，请考虑 `all` 所有从你的域名发送邮件的软件！\n\n### 隐藏邮件中的恶意链接\n\
  \n垃圾算法寻找邮件中的恶意链接，为了支持这一点，网页邮件提供商维护已知有害域名的黑名单。扫描此类域名的链接是阻止危险邮件的一种常用且有效的方法。\n\n因此，诈骗者不得不想出新花样来伪装有害链接，防止他们的邮件被标记并直接发送到垃圾箱。一种方法是使用像\
  \ `Bitly` 这样的 URL 压缩服务，它会将 URL 编码为更短的形式并在用户访问链接时进行重定向。然而，在不断升级的垃圾邮件大战中，邮件扫描算法现在会展开已知\
  \ URL 压缩服务的链接，并检查最终目的地是否有害。\n\n#### 开放重定向 (Open Redirects)\n\n如果你的网站可以被用来隐藏指向互联网上任意\
  \ URL 的链接——如果你在网站的任何地方实施了 `open redirect`（开放重定向）——你可能在帮助黑客像 URL 压缩服务一样隐藏恶意链接。你不仅让你的用户容易受到钓鱼诈骗的影响，你发送的真实邮件还可能被垃圾检测算法列黑。\n\
  \n\n\n\n\n在 HTTP 中，当 Web 服务器响应 301（临时重定向）或 302（永久重定向）响应码，并提供一个浏览器应该跳转的 URL 时，就会发生\
  \ `redirect`（重定向）。重定向最用途之一是在当未经认证的用户尝试访问网站时，将其发送到登录页面。在这种情况下，用户完成身份验证后，网站通常会发送第二次重定向\
  \ `back` 回原始 URL。\n\n为了实现此第二次重定向，Web 服务器必须在用户登录时记住原始目标地。这通常通过将最终目标 URL 编码在登录 URL\
  \ 的查询参数中来实现。如果黑客可以在此查询参数中编码任意 URL——换句话说，如果第二次重定向可以将用户发送到互联网上完全不同的网站——那么你就面临了所谓的\
  \ `open redirect`（开放重定向）。\n\n## 防止开放重定向\n\n大多数网站永远都不需要重定向到外部 URL。如果你的网站有任何部分为了将用户重定向到目标地而在另一个\
  \ URL 内部编码了 URL，你应该确保这些编码的 URL 是 `relative`（相对）URL 而不是 `absolute`（绝对）URL：编码链接应该指向你的网站内部，而不是外部。\n\
  \n相对 URL 以正斜杠（`/*`）开头，这很容易检查。黑客发现了几种伪装绝对 URL 使其看起来像相对 URL 方法，因此你的代码需要考虑到此点。列表 16-3\
  \ 显示了如何通过简单的模式匹配逻辑检查一个 URL 是否为相对 URL。\n\n```python\nimport re\n\ndef is_relative(url):\n\
  \  return re.match(r\"^\\/[^\\/\\\\]\"❶, url)\n```\n*列表 16-3: 使用 Python 正则表达式检查链接是否为相对（网站内部）的函数*\n\
  \n该模式 ❶ 表示 URL 必须以正斜杠开头，且随后的字符不能是另一个正斜杠或反斜杠（`\\*`）。检查第二个字符是为了防止如 `www.google.com`\
  \ 这样的 URL，这些会被浏览器解释为绝对 URL；它们将根据页面当前使用的协议自动加上 `http` 或 `https` 前缀。\n\n防止开放重定向的另一种方法是**完全避免**在查询参数中编码\
  \ URL。如果你正在为登录后的最终重定向而编码 URL，请考虑将 URL 放入临时 Cookie 而不是查询参数。攻击者无法那么容易地在受害者的浏览器中伪造\
  \ Cookie，因此你关闭了滥用链接的大门。\n\n## 其他考虑\n\n某些类型的网站确实需要用户发布外部链接。例如，如果你运行一个社交新闻网站，你的用户经常会发布外部\
  \ URL 的链接。如果此情况适用于你的网站，请使用 `Google Safe Browsing` API 结合有害网站黑名单检查每个 URL。\n\n在保护好电子邮件和重定向代码后，确保你的网页不会被他人的恶意网站包裹是非常重要的。让我们看看如何保护用户免受点击劫持（clickjacking）攻击。\n\
  \n## 点击劫持\n\nHTML 允许通过 `<<iframe>>` 标签让网页包含另一个网页。这允许不同域域的内容以受控的方式混合，因为在框架内运行的 JavaScript\
  \ 无法访问容器页面。`<<iframe>>` 标签通常用于在网页中嵌入第三方内容——OAuth 和 CAPTCHA 组件经常使用它们来保护 Cookie。\n\
  \n与互联网上任何有用工具一样，黑客已经发现了滥用 `<<iframe>>` 标签的方法。现代 CSS 允许使用 `z-index` 属性让页面元素堆叠；`z-index`\
  \ 较高的元素会隐藏 `z-index` 较低的元素，并优先接收点击事件。页面元素还可以使用 `opacity` 属性变为透明。通过结合这些技术，黑客可以将透明的\
  \ `<div>` 放置在 `<<iframe>>` 元素之上，然后诱骗受害者点击 `<div>` 中存储的任何内容，而不是他们认为正在点击的底层内容。\n\n\
  这种点击劫持——`clickjacking`——已以多种方式使用。在某些情况下，受害者被骗打开摄像头，以便攻击者可以远程监控他们。这种技术的另一种变体是 `likejacking`（点赞劫持），即受害者在不知情的情况下被骗点赞\
  \ Facebook 上的某些内容。在暗网上出售点赞以用于促销，对黑客来说是一笔大钱的生意。\n\n## 防止点击劫持\n\n如果你运行网站，你应该确保你的网站不会被作点击劫持攻击的诱饵。大多数网站永远不需要托管在\
  \ `<iframe>` 标签中，因此你应该直接告诉浏览器。现代浏览器支持 `Content-Security-Policy` 头部，它允许服务器响应指定页面不应有任何框架祖先（frame-ancestors），如列表\
  \ 16-4 所示。\n\n```\nContent-Security-Policy: frame-ancestors 'none'\n```\n*列表 16-4:\
  \ 告诉浏览器永远不要在框架中托管你的网站的头部*\n\n实施此策略告诉浏览器永远不要将你的网站放入框架中。\n\n由于某种原因你的网站确实需要包含在 `<iframe>`\
  \ 中，你应该告诉浏览器 `哪些` 网站允许托管此类框架。你可以通过使用相同的 `Content-Security-Policy` 头部来指定该网站可以作为自身的框架祖先。列表\
  \ 16-5 显示了如何使用关键字 `self` 允许你的网站托管指向同一网站其他部分的 iframes。\n\n```\nContent-Security-Policy:\
  \ frame-ancestors 'self'\n```\n*列表 16-5: 允许网站托管其自身 iframes 的头部*\n\n最后，如果你需要第三方网站能够在框架中托管你的网站，你可以对单个\
  \ Web 域名设置白名单，如列表 16-6 所示。\n\n```\nContent-Security-Policy: frame-ancestors example.com\
  \ google.com\n```\n*列表 16-6: 允许 example.com 和 google.com 在 iframe 中托管该网站的头部*\n\n\
  现在你已经了解了如何防止点击劫持，让我们看看攻击者将如何从你的服务器发起恶意网络请求。\n\n## 服务器端请求伪造\n\n发起恶意 HTTP 请求的黑客通常试图伪装这些请求的来源地。例如，拒绝服务攻击——在下一章中介绍——当来自许多不同的\
  \ IP 地址时更为有效。如果你的 Web 服务器发出出站 HTTP 请求，且黑客可以控制这些请求发送到哪些 URL，你就容易受到服务器端请求伪造（SSRF）攻击，黑客可以使用你的服务器发送恶意请求。\n\
  \n从你的服务器发出出站网络请求确实有一些合法的理由。如果你使用任何类型的第三方 API，这些通常通过 HTTPS 作为网络服务提供。例如，你可能会使用服务器端\
  \ API 发送事务电子邮件、索引内容用于搜索、在错误报告系统中记录意外错误或处理支付。然而，当攻击者能够操纵服务器调用他们选择的 URL 时，问题就会出现。\n\
  \n\n\n\n\n黑客还会检查你的网站是否有任何部分接受 XML 内容，并尝试使用 XML 外部实体攻击来实施 SSRF（服务器请求伪造）。第 15 章`。\n\
  \n由于你应该遵循深度防御的原则——通过多种重叠的手段保护自己免受漏洞影响——因此在网络层面也安装针对 SSRF 的防护措施也是很有意义的。在防火墙中对你需要访问的各个域名建立白名单并禁止所有其他域名，是捕捉你在代码审查过程中可能忽略的安全性问题的好方法。\n\
  \n最后，考虑采用渗透测试来检测代码中的 SSRF 漏洞。这可以通过聘请外部团队寻找你网站的漏洞，或者使用自动化在线工具来完成同样的工作来实现。有效来说，你将在黑客有机会动手之前，先使用与他们检测漏洞时相同的工具。\n\
  \n### 僵尸网络\n\n黑客一直在寻找空闲的计算能力来支持他们的攻击。如果黑客成功攻破了你的服务器，他们会经常安装一个 `bot`——一种他们可以使用远程命令控制的恶意软件。大多数机器人作为个体机器人组成的点对网络的一部分运行——`botnet`（僵尸网络），它们通过加密协议相互通信。\n\
  \n机器人通常用于感染笔记本电脑等普通消费设备。然而，在服务器上成功安装机器人是一个巨大的收获，因为机器人将获得多得的计算力。诈骗者会在暗网上支付高价，购买允许他们控制僵尸网络的访问密钥。他们通常利用这些空闲的计算力来挖掘比特币或实施\
  \ `click fraud`——即人为夸大网站的页面访问量。僵尸网络还用于生成垃圾邮件或实施拒绝服务攻击（下一章将介绍）。\n\n## 防御恶意软件感染\n\n\
  显然，你不希望在服务器上安装任何机器人类恶意软件。第 6 章\n\n2016 年 10 月 21 日，互联网用户醒来后发现他们许多喜爱的网站都无法访问：Twitter、Spotify、Netflix、GitHub、Amazon\
  \ 以及许多其他网站似乎都离线了。根源是针对一家 DNS 提供商的攻击。规模巨大的 DNS 查询请求浪潮让流行的 DNS 提供商 Dyn 陷入瘫痪。在了一整天的大部分时间——期间又发生了两次巨大的\
  \ DNS 查询浪潮之后，服务才完全恢复。\n\n这次宕机的规模和影响是前所未有的。（唯一一次具有可比影响的事件是由于鲨鱼咬断了海底互联网电缆，导致整个越南离线了一段时间。）然而，这只是常见且日益危险的\
  \ `denial-of-service (DoS)`（拒绝服务）攻击的最新变体。\n\n 拒绝服务攻击与书中讨论的大多数类型漏洞不同，因为攻击的意图并不是破坏系统或网站：其意图仅仅是让其他用户无法使用。通常，这是通过向网站大量入站流量来实现的，导致所有服务器资源耗尽。本章将分解用于拒绝服务攻击中某些常用技术，并展示了防御它们的各种方法。\n\
  \n## 拒绝服务攻击类型\n\n响应网络请求通常比发送请求需要更多的处理能力。例如，当 Web 服务器处理 HTTP 请求时，它必须解析请求、运行数据库查询、将数据写入日志并构建要返回的\
  \ HTML。用户代理只需要生成包含三部分信息的请求：HTTP 动词、发送到的 IP 地址以及 URL。黑客利用这种非对称性用网络请求淹没服务器，使其无法对合法用户做出响应。\n\
  \n黑客已经发现了在网络栈的每一层发起拒绝服务攻击的方法，而不仅仅是 HTTP 层。鉴于它们在过去如此成功，未来还会发现更多方法。让我们看看攻击者工具箱中的一些工具。\n\
  \n## 互联网控制消息协议攻击\n\n`Internet Control Message Protocol`（ICMP）被服务器、路由器和命令行工具用于检查网络地址是否在线。该协议非常简单：将请求发送到\
  \ IP 地址，如果响应的服务器在线，它将返回一个其在线的确认。如果你曾经使用过 `ping` 工具检查服务器是否可访问，你就在底层使用了 ICMP。\n\n\
  ICMP 是互联网协议中最简单的之一，因此理所当然，它是第一个被用于恶意用途的协议。`ping flood`（ping 洪水）试图通过发送无尽的 ICMP 请求来淹没服务器，只需几行代码即可启动。稍微复杂一点的攻击是\
  \ `ping of death`（死亡 ping）攻击，它通过发送损坏的 ICMP 包来尝试崩溃服务器。这种攻击利用了旧软件未对传入的 ICMP 包进行正确边界检查的漏洞。\n\
  \n## 传输控制协议攻击\n\n大多数基于 ICMP 的攻击都可以被现代网络接口防御，因此攻击者移动到了网络栈中更高层的 `TCP`，它支撑着大多数互联网通信。\n\
  \n\n\n\nTCP 会话从 TCP 客户端向服务器发送一个 `SYN`（同步）消息开始，服务器预期将回复一个 `SYN-ACK`（同步确认）响应。随后，客户端应通过向服务器发送最终的\
  \ `ACK` 消息来完成握手。通过向服务器发送大量的 `SYN` 消息（即 `SYN flood` 洪水攻击）而不完成 TCP 握手，黑客工具会使服务器留下大量的“半开放”连接，从而耗尽合法客户端的连接池。这时，当合法客户端尝试连接时，服务器会拒绝该连接。\n\
  \n## 应用层攻击\n\n针对 Web 服务器的应用层攻击滥用了 HTTP 协议。`Slowloris` 攻击向服务器开启许多 HTTP 连接，并通过定期发送部分\
  \ HTTP 请求来保持这些连接开启，从而耗尽服务器的连接池。`R-U-Dead-Yet? (RUDY)` 攻击向服务器发送无止境的 POST 请求，带有任意长度的\
  \ `Content-Length` 头部值，让服务器忙于读取无意义的数据。\n\n黑客还发现了利用特定的 HTTP 端点来使 Web 服务器下线的方法。向文件上传函数上传\
  \ `zip bombs`（解压后体积呈指数级增长的损坏压缩文件）可以耗尽服务器的可用磁盘空间。任何执行反序列化（将 HTTP 请求的内容转换为内存中的代码对象）的\
  \ URL 也可能存在漏洞。此类类型攻击的一个例子是 XML 炸弹，你在第 15 章 中见过它。\n\n## 反射与放大攻击\n\n发起有效的拒绝服务攻击的一个困难在于找到足够的计算能力来生成恶意流量。黑客通过使用第三方服务为他们生成流量来克服这一限制。通过向第三方发送恶意请求，并伪造属于其目标受害者的返回地址，黑客将响应`反射`到他们的目标，可能会导致响应该地址流量的服务器过载。反射攻击还掩盖了攻击的原始来源，使其更难追踪。如果第三方服务返回的响应比初始请求更大或更多，那么更大的响应就会`放大`攻击威力。\n\
  \n迄今为止，最大的拒绝服务攻击之一是使用反射实施的。2018 年，一名单一攻击者能够`每秒`生成 1.3 TB 的数据，并指向 GitHub 网站。黑客实现这一目标的方法是定位大量不安全的\
  \ Memcached 服务器，并向它们发送带有 GitHub 服务器 IP 地址签名的 `User Datagram Protocol (UDP)` 请求。每个响应的大小都是原始请求的\
  \ 50 倍左右，有效地将攻击者的计算能力扩大了同样的倍数。\n\n## 分布式拒绝服务攻击\n\n如果拒绝服务攻击从单个 IP 地址发起，将该 IP 的流量列入黑名单并停止攻击相对容易。现代拒绝服务攻击（例如\
  \ 2018 年对 GitHub 的攻击）来自多个协作源——`分布式拒绝服务 (DDoS)` 攻击。除了使用反射外，这些攻击通常从`僵尸网络 (botnet)`\
  \ 发起，这是一个感染了各种计算机和连接网络设备的恶意软件机器人网络，可以由攻击者控制。由于现在有许多类型的设备连接到互联网——恒温器、冰箱、汽车、门铃、发刷等——且容易产生安全漏洞，这些机器人有许多藏身之处。\n\
  \n### 无意拒绝服务攻击\n\n并非所有的网络流量激增都是恶意的。网站走红并在短时间内经历意想不到的大量访问者是常见现象，因为其设计时并未考虑到处理如此高流量流量，实际上会导致其暂时离线。Reddit\
  \ 的“死亡之拥 (hug of death)”在较小网站成功进入该社交新闻网站首页时，经常会导致这些网站离线。\n\n## 拒绝服务攻击缓解\n\n防御大型拒绝服务攻击既昂贵又耗时。幸运的是，你不太可能成为像\
  \ 2016 年导致 Dyn 离线的那种规模攻击的目标。此类攻击需要详尽的计划，只有少数对手能够实施。你不太可能看到每秒 TB 级的数据击中你的食谱博客！\n\n\
  然而，较小的拒绝服务攻击结合勒索请求`确实`会发生，因此投入一些保护措施是值得的。接下来的章节描述了你应该考虑使用的一些对策：防火墙和入侵防御系统（IPS）、DDoS\
  \ 防护服务以及高度可的网站技术。\n\n#### 防火墙和入侵防御系统\n\n所有现代服务器操作系统都带有一个`防火墙`——这是一种根据预定义的安全规则监控并控制入出站网络流量的软件。防火墙允许你确定哪些端口应该对入站流量开放，并通过`访问控制规则`过滤掉来自特定\
  \ IP 地址的流量。防火墙部署在组织的网络边界，在坏流量到达内部服务器之前将其过滤掉。现代防火墙可以拦截大多数基于 ICMP 的攻击，并可将单个 IP 地址列入黑名单，这是关闭单源流量的有效方法。\n\
  \n`应用防火墙`工作在网络栈的更高层次，充当代理的角色，在流量传递到网络其他部分之前扫描 HTTP 和其他互联网流量。应用防火墙扫描入站流量以寻找损坏或恶意请求，并拒绝任何匹配恶意签名的内容。由于供应商会更新签名，这种方法可以阻止许多类型的黑客尝试（例如执行\
  \ SQL 注入的尝试），并缓解拒绝服务攻击。除了 `ModSecurity` 等开源实现外，还存在商业应用防火墙供应商（例如 Norton 和 Barracuda\
  \ Networks），其中一些销售基于硬件的解决方案。\n\n`入侵防御系统 (IPS)` 采用更全局的方法来保护网络：除了实施防火墙和匹配签名，它们还会寻找网络流量中的统计异常，并扫描磁盘上的文件是否存在异常变化。IPS\
  \ 通常是一项重大的投资，但可以非常有效地保护你。\n\n## 分布式拒绝服务防护服务\n\n在复杂的拒绝服务攻击中，网络数据包通常与普通包无法区分。流量是有效的；只有流量的意图和数量是恶意的。这意味着防火墙无法过滤这些数据包。\n\
  \n许多公司提供针对分布式拒绝服务攻击的防护，通常成本高昂。当你与 DDoS 解决方案提供商集成时，会将所有入站流量路由到其数据中心，在那里它扫描并拦截任何看起来恶意的内容。由于解决方案提供商对全球恶意互联网活动拥有视野并拥有海量可用带宽，可以使用启发式算法防止任何有害流量到达你处。\n\
  \nDDoS 防护通常由 CDN 提供，因为它们拥有地理分布的数据中心，并且通常已经为客户托管了静态内容。如果你的大部分请求已经由 CDN 托管的内容提供服务，那么将剩余流量路由到其数据中心并不需要太多额外精力。\n\
  \n#### 构建扩展性架构\n\n\n\n\n\n在许多方面，成为拒绝服务攻击的目标与你的网站同时出现大量访问者并无区别。通过准备好处理大规模流量激增，你可以保护自己免受许多尝试性的拒绝服务攻击。构建扩展性架构（Building\
  \ for scale）是一个宏大的课题——关于这个主题已经有整本书的著作，而且是一个活跃的研究领域。你应该关注的一些最有影响力的方法包括：卸载静态内容、缓存数据库查询、对长耗任务使用异步处理，以及部署到多个\
  \ Web 服务器。\n\nCDN 将提供静态内容（如图像和字体文件）的负担卸载给第三方。使用 `CDN` 可以显著提高网站的响应速度，并减轻服务器的负载。CDN\
  \ 易于集成，对大多数网站来说具有成本效益，并且将显著减少你的 Web 服务器需要处理的网络请求数量。\n\n一旦你卸载了静态内容，数据库访问调用通常会成为下一个瓶颈。有效的\
  \ `caching`（缓存）可以防止数据库在流量激增时发生过载。缓存数据可以存储在磁盘、内存中或如 `Redis` 或 `Memcached` 等共享内存缓存中。甚至是浏览器也能帮助缓存：在资源（例如图像）上设置\
  \ `Cache-Control` 头部会告诉浏览器存储资源的本地副本，并在可配置未来日期之前不再再次请求它。\n\n将长耗任务卸载到 `job queue`（任务队列）将帮助你的\
  \ Web 服务器在流量增加时快速响应。这种 Web 架构方法将长耗任务（如生成大型下载文件或发送电子邮件）移动到后台 `worker` 进程。这些 worker\
  \ 独立于 Web 服务器部署，Web 服务器创建任务并将其放入队列。worker 从队列中取出任务并逐一处理，任务完成后通知 Web 服务器。查看 Netflix\
  \ 技术博客（`[https://medium.com/@NetflixTechBlog/]`）可以找到基于此类原理构建的大可扩展系统示例。\n\n最后，你应该拥有一种部署策略，允许你相对快速地扩展\
  \ Web 服务器的数量，以便在繁忙期间增加计算能力。像 Amazon Web Services (`AWS`) 这样的基础设施即服务 (`IaaS`) 供应商可以可以轻松地在负载均衡器后多次部署相同的服务器镜像。像\
  \ Heroku 这样的平台只需在其 Web 仪表板上移动滑块即可简单实现！你的托管提供商会有某种监控流量的方法，可以使用 Google Analytics 等工具来跟踪网站上何时开启了多少个会话。这样，你只需要在达到监控阈值时增加服务器数量即可。\n\
  \n### 总结\n\n攻击者通过向网站注入大量流量发动拒绝服务攻击，导致合法用户无法访问。拒绝服务攻击可能发生在网络栈的任何层，并可能被第三方服务反射或放大。通常，它们是从受攻击者控制的僵尸网络发分布式攻击。\n\
  \n简单的拒绝服务攻击可以通过合理的防火墙设置来防御。应用程序防火墙和入侵防御系统可以帮助你免受更复杂的攻击。最全面的（因此也是昂贵的）保护来自分布式拒绝服务攻击解决方案供应商，他们会在所有恶意流量进入你的网络之前将其过滤掉。\n\
  \n所有类型的拒绝服务攻击——包括当你突然看到新访问者激增时的无意攻击——都可以通过构建良好扩展性的网站来缓解。内容分发网络减轻了从网站提供静态内容的负担，有效的缓存防止了数据库成为瓶颈。将长耗过程移动到任务队列将使你的\
  \ Web 服务器能够以满负状态高效运行。活跃的流量监控以及轻松扩展 Web 服务器数量的能力将为你应对繁忙时期做好充分准备。\n\n到此，书中将介绍的所有各个漏洞就结束了！最后一章总结了书中涵盖的主要安全原则，并回顾了各个漏洞以及如何防止它们。\n\
  \n# 18 总结\n\n![image](img/common01.jpg)\n\n所以，我们到达书的末尾！我们涵盖了大量的材料，但现在你应该觉得已经准备好走向世界，以安全、可靠的方式构建网站了。\n\
  \n让我们以简短的总结作为结束吧。本章介绍了 Web 安全的 21 条诫，将帮助你记住每一章的核心教训。遵循这些简单的步骤，你被黑客攻击的可能性接近于零。\n\n\
  ### 自动化你的发布流程\n\n能够通过单条命令行调用构建代码。将代码保留在源码控制中，并决定一种分支策略。将配置与代码分离，以便于构建测试环境。在每次发布之前使用测试环境验证功能。自动化代码到每个环境的部署。确保你的发布过程是可靠、可复现且可回滚的。始终知道每个环境中运行的是哪个版本的代码，并能够以简单的方式回滚到之前的版本。\n\
  \n### 进行（彻底的）代码审查\n\n确保每处代码更改在批准发布之前，至少由一位非原作者的团队成员进行审查。确保团队成员有时间批判性地评估代码更改，并理解审查代码与编写代码同样重要。\n\
  \n### 测试你的代码（直到无聊为止）\n\n编写单元测试以对代码库的关键部分进行断言，并将其作为构建过程的一部分运行。在每次更改时，在持续集成服务器上运行单元测试。测量运行单元测试时代码库被执行的百分比，并始终尝试增加这个覆盖率数字。在修复漏洞\
  \ `之前` 编写测试来重现软件漏洞。测试直到恐惧变成无聊！\n\n### 预判恶意输入\n\n`HTTP` 请求的所有部分都可能被黑客操纵，因此要有准备。通过参数化语句构建数据库和操作系统的查询，以受到免受注入攻击。\n\
  \n### 中和文件上传\n\n如果用户可以向你的网站上传文件，请确保这些文件无法被执行。理想情况下，将文件上传到内容分发网络 (`CDN`)。如果你需要更细粒度的文件权限，将其托管在内容管理系统\
  \ (`CMS`) 中。作为最后手段，将上传的文件保存在单独磁盘分区，并确保不会以可执行权限写入磁盘。\n\n### 在编写 HTML 时转义内容\n\n攻击者会尝试通过将\
  \ JavaScript 注入数据库或隐藏在 `HTTP` 参数中，向你的网页中注入恶意的 JavaScript。确保写入网页的任何动态内容都经过了转义——将\
  \ HTML 控制字符替换为安全的实体编码。这不仅适用于客户端，也适用于服务器！如果可能，通过 `Content-Security-Policy` 响应头部完全禁用内联\
  \ JavaScript 的执行。\n\n### 对来自其他网站的 HTTP 请求保持警惕\n\n\n\n\n\n来自其他域的 HTTP 请求可能是恶意的——例如，攻击者可能欺骗你的某一个用户点击了伪装的链接。确保对你网站的\
  \ `GET` 请求是无副作用的：它们应该仅用于检索资源。通过在 HTML 表单和任何由 JavaScript 发起的 HTTP 请求中加入防伪造 cookie，确保其他类型的请求（如用于启动登录的\
  \ `POST` 请求）源自你的网站。通过在 `Set-Cookie` HTTP 响应头中添加 `SameSite` 属性，移除从 Web 域之外发起的请求中的\
  \ cookie。\n\n### 对密码进行哈希和加盐\n\n如果你在数据库中存储密码，请在保存之前使用强力的单向哈希函数（如 `bcrypt`）对它们进行加密。通过添加\
  \ `salt`（盐值）为每个哈希值增加一个随机元素。\n\n### 不要承认你的用户的身份\n\n只有用户本人应该知道该用户是否已经注册了你的网站。确保登录表单和密码重置页面不会允许黑客挖掘你的网站获取用户列表：无论用户名是否存在，错误信息和提示信息都应该是通用的。\n\
  \n### 保护你的 Cookie\n\n如果攻击者可以窃取你的 cookie，他们就可以劫持用户的身份。在你的 `Set-Cookie` 响应头中添加 `HttpOnly`\
  \ 关键字，防止恶意 JavaScript 读取这些 cookie。添加 `Secure` 关键字，以便 cookie 仅通过 `HTTPS` 发送。\n\n\
  ### 保护敏感资源（即使你没有链接到它们）\n\n在 HTTP 请求中返回网站上的任何敏感资源之前，检查用户是否有权限访问该资源——即使该资源没有列在搜索页面中，或未从其他地方链接。\n\
  \n### 避免使用直接文件引用\n\n避免在 HTTP 请求中传递和评估文件路径。使用你 Web 服务器内置的 URL 解析器来评估资源路径，或通过不透明标识符引用文件。\n\
  \n### 不要泄露信息\n\n尽可能减少攻击者可以获取的关于你技术栈的信息。关闭 HTTP 响应中的任何 `Server` 头，并确保你的 `Set-Cookie`\
  \ 头中的会话参数名称是通用的。避免在 URL 中出现特征性的文件后缀。确保在生产环境中关闭详细的客户端错误报告。在构建过程中对使用的 JavaScript 库进行混淆。\n\
  \n### 使用加密（正确地）\n\n为你的域名购买安全证书，并将其与你的私钥一起安装到 Web 服务器上。将所有流量重定向到 `HTTPS`，并在 `Set-Cookie`\
  \ 响应头中添加 `Secure` 关键字，以确保 cookie 永远不会通过未加密的 `HTTP` 发送。定期更新你的 Web 服务器以保持加密标准。\n\n\
  ### 安全你的依赖（以及和服务）\n\n使用包管理器在构建过程中导入第三方代码并将每个包固定到特定的版本号。关注你使用的软件包的安全建议并定期更新它们。安全地存储你的配置——放在源码控制之外！对于托管的任何广告使用\
  \ `SafeFrame` 标准。\n\n### 解除你的 XML 解析器\n\n在你的 XML 解析器中关闭对内联文档类型声明（DTD）的处理。\n\n###\
  \ 安全地发送邮件\n\n通过在域名记录中使用“发送策略框架”（`SPF`）记录，派遣允许哪些服务器从你的域名发送邮件。允许邮件收件人验证你发送的任何邮件的 `From`\
  \ 地址，并使用“域密钥识别邮件”（`DKIM`）检测篡改邮件的尝试。\n\n### 检查你的重定向（如果有）\n\n如果你重定向到存储在 HTTP 请求部分的\
  \ URL——例如在用户登录后——请检查该 URL 是你的域本地的，而不是外部网站。否则，这些开放重定向将被用于在邮件中伪装恶意链接。\n\n### 不要允许你的网站被嵌套\n\
  \n除非你有特殊需求，否则不要允许你的网站被封装在 `<<iframe>>` 中。通过在你的 HTTP 响应中添加 `Content-Security-Policy:\
  \ frame-ancestors 'none'` 来禁用框架。\n\n### 锁定你的权限\n\n遵循最小权限原则——确保每个进程和软件组件都以所需的最小权限运行。思考如果攻击者攻破你系统的任何部分，他们可能会尝试做什么，并减轻损害。确保你的\
  \ Web 服务器进程不是以 root 操作系统账户运行的。限制你的 Web 服务器可以访问的磁盘目录。防止你的 Web 服务器发起不必要的网络调用。让你的 Web\
  \ 服务器以权限限制的账户连接数据库。\n\n### 检测并准备应对流量激增\n\n使用实时监控来检测访问网站的高流量。通过使用 `CDN`、客户端 cookie、缓存和异步处理来构建可扩展的架构。确保能够轻松扩展托管网站的服务器数量。如果恶意流量成为问题，请部署防火墙或入侵防御系统，或考虑订阅分布式拒绝攻击防护。\n\
