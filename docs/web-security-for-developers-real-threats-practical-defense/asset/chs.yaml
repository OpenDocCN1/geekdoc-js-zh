  Malcolm McDonald 是 [hacksplaining.com](http://hacksplaining.com) 的创建者，这是网上最流行的 Web\
  \ 开发安全培训资源之一。他花了二十时间为金融公司和初创公司编写代码，并利用他担任领导的经验编写了关于安全漏洞以及如何防护的直俗易懂的教程。他与妻子和猫住在加利福尼亚州的奥克兰。\n\
  \n## 关于技术审核员\n从 Commodore PET 和 VIC-20 早期开始，技术一直是 Cliff Janzen 的常伴（有时甚至是执迷！）！Cliff\
  \ 很庆幸有机会与业内一些最优秀的人合作并学习，包括 Malcolm 以及 No Starch 的优秀同事们。Cliff 每天的大部分工作时间都在管理和指导一个优秀的安全专业人员团队，但努力通过处理从安全策略审查到渗透测试的所有事务来保持技术上的敏感性。他觉得很幸运拥有一份既是职业又是爱好的工作，以及一位支持他的妻子。\n\
