- md: "## Inheritance in JavaScript\n\nInheritance is one of the key features of OOP\
    \ that allows us to create a new class from an existing class. The new class,\
    \ known as the child class, inherits all the properties and behaviors of the parent\
    \ class.\n\nHere is an example of inheritance in JavaScript:\n\n```\nclass SportsCar\
    \ extends Car {\n  constructor(make, model, color, turbo) {\n    super(make, model,\
    \ color);\n    this.turbo = turbo;\n  }\n\n  turboStart() {\n    console.log('Turbo\
    \ is started');\n  }\n}\n\nlet mySportsCar = new SportsCar('Toyota', 'Supra',\
    \ 'Red', true);\nconsole.log(mySportsCar.make); // Toyota\nconsole.log(mySportsCar.turbo);\
    \ // true\nmySportsCar.turboStart(); // Turbo is started\n```\n\nAs you can see,\
    \ the SportsCar class inherits from the Car class using the extends keyword. We\
    \ also use the super keyword to call the constructor of the parent class.\n\n\
    In this chapter, we’ve covered the basics of object-oriented programming in JavaScript,\
    \ including objects, classes, and inheritance. In the next chapter, we’ll dive\
    \ deeper into OOP and explore more advanced concepts such as encapsulation and\
    \ polymorphism.\n\n## Chapter 8: Loops in JavaScript\n\nLoops are a fundamental\
    \ concept in any programming language, and JavaScript is no exception. The purpose\
    \ of a loop is to execute a block of code repeatedly until a certain condition\
    \ is met.\n\n## Introduction to Loops\n\nIn JavaScript, we have several types\
    \ of loops:\n\n- 1. **For Loop:** This is the most common loop which repeats until\
    \ a specified condition evaluates to false.\n- 2. **While Loop:** The while loop\
    \ executes the instructions as long as the specified condition evaluates to true.\n\
    - 3. **Do-while Loop:** This is similar to the while loop but it guarantees the\
    \ loop will run at least once.\n- 4. **For-in Loop:** The for-in loop is used\
    \ to loop through properties of an object.\n- 5. **For-of Loop:** The for-of loop\
    \ is used to loop over iterable objects like arrays, strings etc.\n\n## For Loop\n\
    \nA “for” loop is characterized by three expressions enclosed in its parentheses,\
    \ separated by semicolons. These are, in order: initialization, condition, and\
    \ final expression.\n\nHere is an example of a for loop:\n\n```\nfor (let i =\
    \ 0; i < 5; i++) {\n    console.log(i);\n}\n```\n\nThis code will output the numbers\
    \ 0 to 4 in the console.\n\n## While Loop\n\nThe while loop is simple, it only\
    \ takes a condition and executes the code inside the loop as long as the condition\
    \ is true.\n\nHere is an example of a while loop:\n\n```\nlet i = 0;\nwhile (i\
    \ < 5) {\n  console.log(i);\n  i++;\n}\n```\n\nThis will give the same output\
    \ as the previous for loop.\n\n## Do-while Loop\n\nThe do-while loop will execute\
    \ the code block once, before checking if the condition is true, then it will\
    \ repeat the loop as long as the condition is true.\n\nHere is an example of a\
    \ do-while loop:\n\n```\nlet i = 0;\ndo {\n    console.log(i);\n    i++;\n}\n\
    while (i < 5);\n```\n\nAgain, this will give the same output as the previous two\
    \ loops.\n\n## For-in Loop\n\nThe for-in loop is used to loop through properties\
    \ of an object.\n\nHere is an example of a for-in loop:\n\n```\nconst person =\
    \ {fname:\"John\", lname:\"Doe\", age:25};\n\nfor (let x in person) {\n    console.log(x\
    \ + \": \" + person[x]);\n}\n```\n\nThis will log each property name with its\
    \ corresponding value in the console.\n\n## For-of Loop\n\nThe for-of loop is\
    \ used to loop over iterable objects like arrays, strings etc.\n\nHere is an example\
    \ of a for-of loop:\n\n```\nlet arr = [3, 5, 7];\nfor (let i of arr) {\n  console.log(i);\n\
    }\n```\n\nThis will log each value of the array in the console.\n\nIn the next\
    \ chapter, we'll continue to explore JavaScript by looking at Functions.\n\n##\
    \ Chapter 9: Async and Await\n\nIn this chapter, we will delve into Async and\
    \ Await in JavaScript. These are powerful tools that allow you to write more readable\
    \ and maintainable asynchronous code. Asynchronous JavaScript can be a bit tricky\
    \ to understand, especially for beginners, but don't worry, we will break it down\
    \ into simpler terms and use plenty of examples to make it as clear as possible.\n\
    \n## Understanding Asynchronous JavaScript\n\nBefore we dive into Async and Await,\
    \ it's important to understand what asynchronous JavaScript is. JavaScript is\
    \ single-threaded, which means it can only do one thing at a time. However, some\
    \ operations, like fetching data from a server, can take a long time to complete.\
    \ If JavaScript waited for these operations to finish before moving on to the\
    \ next line of code, our applications would be incredibly slow and unresponsive.\n\
    \nTo solve this problem, JavaScript uses callbacks, promises, and async/await\
    \ to handle these time-consuming operations without blocking the rest of the code.\n\
    \n## Callbacks and Promises\n\nBefore Async and Await were introduced in ES2017,\
    \ developers used callbacks and promises to handle asynchronous operations.\n\n\
    A callback is a function that is passed as an argument to another function and\
    \ is executed after a certain event has occurred. However, callbacks can lead\
    \ to what’s known as “callback hell” when you have many nested callbacks, making\
    \ the code difficult to read and maintain.\n\nPromises improved on callbacks by\
    \ providing a more readable syntax and better error handling. A promise represents\
    \ a value that may not be available yet, but will be available at some point in\
    \ the future, or it might never be available.\n\nHere’s an example of a promise:\n\
    \n```\nlet promise = new Promise((resolve, reject) => {\n    let condition = true;\n\
    \n    if(condition) {\n      resolve(\"Promise is resolved\");\n    } else {\n\
    \      reject(\"Promise is rejected\");\n    }\n});\n\npromise\n.then((message)\
    \ => console.log(message))\n.catch((error) => console.log(error));\n```\n\n##\
    \ Introducing Async and Await\n\nAsync and Await make it even easier to work with\
    \ promises. An async function is a function that knows how to expect the possibility\
    \ of the await keyword being used to invoke asynchronous code.\n\nThe await keyword\
    \ is used in an async function to ensure that all promises returned in the function\
    \ are synchronized, i.e., they wait for each other. Await eliminates the use of\
    \ callbacks in .then() and .catch(). In using async and await, async function\
    \ returns a promise, and the resolved value of the promise will be whatever you\
    \ return from the function (which is the fulfilled state of the promise).\n\n\
    Here’s how you could rewrite the above promise with async and await:\n\n```\n\
    async function myFunction() {\n  let condition = true;\n\n  if(condition) {\n\
    \    return \"Promise is resolved\";\n  } else {\n    throw new Error(\"Promise\
    \ is rejected\");\n  }\n}\n\nmyFunction()\n.then((message) => console.log(message))\n\
    .catch((error) => console.log(error));\n```\n\nAs you can see, Async and Await\
    \ can make your asynchronous code more readable and easier to understand. In the\
    \ next chapter, we will dive deeper into Async and Await, covering topics like\
    \ error handling and how to use Async and Await with loops.\n\n## Chapter 10:\
    \ Object-Oriented Programming in Javascript\n\nIn this chapter, we will delve\
    \ into the concepts and applications of Object-Oriented Programming (OOP) in Javascript.\
    \ By the end of this chapter, you should understand the principles of OOP and\
    \ how to put them into practice in your Javascript code.\n\n## Introduction to\
    \ Object-Oriented Programming\n\nObject-Oriented Programming (OOP) is a programming\
    \ paradigm that is based on the concept of “objects”. Objects can contain data\
    \ and code: data in the form of properties (also known as attributes or fields),\
    \ and code in the form of methods (functions associated with an object).\n\nIn\
    \ Javascript, almost everything is an object. Booleans, numbers, strings, dates,\
    \ maths, regular expressions, arrays, functions, and objects are all objects.\
    \ This makes Javascript a powerful language for object-oriented programming.\n\
    \n```\nvar person = {\n  firstName: \"John\",\n  lastName : \"Doe\",\n  id   \
    \    : 5566,\n  fullName : function() {\n    return this.firstName + \" \" + this.lastName;\n\
    \  }\n};\n```\n\nIn the above code, person is an object. firstName, lastName and\
    \ id are properties, fullName is a method.\n\n## Classes in Javascript\n\nClasses\
    \ are a template for creating objects. They encapsulate data with code. As such,\
    \ an object is a specific instance of a class; it contains real values instead\
    \ of variables.\n\nIn Javascript, classes are declared using the class keyword."
  mdcn: "\n## JavaScript 中的继承\n\n继承是面向对象编程的关键特性之一，它允许我们从现有的类创建一个新类。这个新类被称为子类，它会继承父类的所有属性和行为。\n\
    \n以下是 JavaScript 中继承的一个示例：\n\n```\nclass SportsCar extends Car {\n  constructor(make,\
    \ model, color, turbo) {\n    super(make, model, color);\n    this.turbo = turbo;\n\
    \  }\n\n  turboStart() {\n    console.log('Turbo is started');\n  }\n}\n\nlet\
    \ mySportsCar = new SportsCar('Toyota', 'Supra', 'Red', true);\nconsole.log(mySportsCar.make);\
    \ // Toyota\nconsole.log(mySportsCar.turbo); // true\nmySportsCar.turboStart();\
    \ // Turbo is started\n```\n\n如你所见，`SportsCar` 类使用 `extends` 关键字继承自 `Car` 类。我们还使用\
    \ `super` 关键字来调用父类的构造函数。\n\n在本章中，我们涵盖了 JavaScript 中面向对象编程的基础知识，包括对象、类和继承。在下一章中，我们将更深入地探讨面向对象编程，并探索封装和多态性等更高级的概念。\n\
    \n## 第 8 章：JavaScript 中的循环\n\n循环是任何编程语言中的一个基本概念，JavaScript 也不例外。循环的目的是重复执行一段代码块，直到满足某个条件。\n\
    \n## 循环简介\n\n在 JavaScript 中，我们有几种类型的循环：\n\n- 1. **For 循环：** 这是最常见的循环，它会重复执行直到指定的条件求值为\
    \ false。\n- 2. **While 循环：** 只要指定的条件求值为 true，`while` 循环就会执行指令。\n- 3. **Do-while\
    \ 循环：** 这类似于 `while` 循环，但它保证循环体至少会执行一次。\n- 4. **For-in 循环：** `for-in` 循环用于遍历对象的属性。\n\
    - 5. **For-of 循环：** `for-of` 循环用于遍历可迭代对象，如数组、字符串等。\n\n## For 循环\n\n\"for\" 循环的特点是其括号内包含三个表达式，由分号分隔。按顺序分别是：初始化、条件和最终表达式。\n\
    \n以下是一个 for 循环的示例：\n\n```\nfor (let i = 0; i < 5; i++) {\n    console.log(i);\n\
    }\n```\n\n这段代码将在控制台输出数字 0 到 4。\n\n## While 循环\n\n`while` 循环很简单，它只接受一个条件，并在条件为真时执行循环内的代码。\n\
    \n以下是一个 while 循环的示例：\n\n```\nlet i = 0;\nwhile (i < 5) {\n  console.log(i);\n\
    \  i++;\n}\n```\n\n这将产生与前一个 for 循环相同的输出。\n\n## Do-while 循环\n\n`do-while` 循环会先执行一次代码块，然后再检查条件是否为真，然后只要条件为真，它就会重复循环。\n\
    \n以下是一个 do-while 循环的示例：\n\n```\nlet i = 0;\ndo {\n    console.log(i);\n    i++;\n\
    }\nwhile (i < 5);\n```\n\n同样，这将产生与前两个循环相同的输出。\n\n## For-in 循环\n\n`for-in` 循环用于遍历对象的属性。\n\
    \n以下是一个 for-in 循环的示例：\n\n```\nconst person = {fname:\"John\", lname:\"Doe\", age:25};\n\
    \nfor (let x in person) {\n    console.log(x + \": \" + person[x]);\n}\n```\n\n\
    这将在控制台记录每个属性名及其对应的值。\n\n## For-of 循环\n\n`for-of` 循环用于遍历可迭代对象，如数组、字符串等。\n\n以下是一个\
    \ for-of 循环的示例：\n\n```\nlet arr = [3, 5, 7];\nfor (let i of arr) {\n  console.log(i);\n\
    }\n```\n\n这将在控制台记录数组的每个值。\n\n在下一章中，我们将继续探索 JavaScript，学习函数。\n\n## 第 9 章：Async\
    \ 和 Await\n\n在本章中，我们将深入探讨 JavaScript 中的 Async 和 Await。这些是强大的工具，允许你编写更具可读性和可维护性的异步代码。JavaScript\
    \ 异步可能有点难以理解，特别是对于初学者，但别担心，我们会将其分解为更简单的术语，并使用大量示例，使其尽可能清晰。\n\n## 理解异步 JavaScript\n\
    \n在深入探讨 Async 和 Await 之前，了解什么是异步 JavaScript 很重要。JavaScript 是单线程的，这意味着它一次只能做一件事。然而，一些操作，比如从服务器获取数据，可能需要很长时间才能完成。如果\
    \ JavaScript 在继续执行下一行代码之前等待这些操作完成，我们的应用程序将会变得非常慢且无响应。\n\n为了解决这个问题，JavaScript 使用回调、Promise\
    \ 和 async/await 来处理这些耗时的操作，而不会阻塞其余代码。\n\n## 回调和 Promise\n\n在 ES2017 中引入 Async\
    \ 和 Await 之前，开发者使用回调和 Promise 来处理异步操作。\n\n回调是作为参数传递给另一个函数的函数，在某个特定事件发生后执行。然而，当你有许多嵌套的回调时，回调可能导致所谓的“回调地狱”，使代码难以阅读和维护。\n\
    \nPromise 通过提供更具可读性的语法和更好的错误处理，改进了回调。Promise 代表一个可能尚不可用，但将来某个时间点会可用的值，或者它可能永远不可用。\n\
    \n这是一个 Promise 的示例：\n\n```\nlet promise = new Promise((resolve, reject) => {\n\
    \    let condition = true;\n\n    if(condition) {\n      resolve(\"Promise is\
    \ resolved\");\n    } else {\n      reject(\"Promise is rejected\");\n    }\n\
    });\n\npromise\n.then((message) => console.log(message))\n.catch((error) => console.log(error));\n\
    ```\n\n## 介绍 Async 和 Await\n\nAsync 和 Await 使得使用 Promise 变得更加容易。异步函数是一种知道如何预期在函数中使用\
    \ `await` 关键字来调用异步代码可能性的函数。\n\n`await` 关键字在异步函数中使用，以确保函数中返回的所有 Promise 都是同步的，即它们彼此等待。`await`\
    \ 消除了在 `.then()` 和 `.catch()` 中使用回调。使用 async 和 await 时，异步函数返回一个 Promise，而 Promise\
    \ 的解析值将是你从函数返回的任何内容（即 Promise 的 fulfilled 状态）。\n\n以下是如何使用 async 和 await 重写上述 Promise\
    \ 的示例：\n\n```\nasync function myFunction() {\n  let condition = true;\n\n  if(condition)\
    \ {\n    return \"Promise is resolved\";\n  } else {\n    throw new Error(\"Promise\
    \ is rejected\");\n  }\n}\n\nmyFunction()\n.then((message) => console.log(message))\n\
    .catch((error) => console.log(error));\n```\n\n如你所见，Async 和 Await 可以使你的异步代码更具可读性，更容易理解。在下一章中，我们将更深入地探讨\
    \ Async 和 Await，涵盖错误处理以及如何在循环中使用 Async 和 Await 等主题。\n\n## 第 10 章：JavaScript 中的面向对象编程\n\
    \n在本章中，我们将深入探讨 JavaScript 中面向对象编程（OOP）的概念和应用。学完本章后，你应该理解 OOP 的原理以及如何在 JavaScript\
    \ 代码中实践它们。\n\n## 面向对象编程简介\n\n面向对象编程（OOP）是一种基于“对象”概念的编程范式。对象可以包含数据和代码：数据以属性（也称为字段或成员变量）的形式存在，代码以方法（与对象关联的函数）的形式存在。\n\
    \n在 JavaScript 中，几乎所有东西都是对象。布尔值、数字、字符串、日期、数学运算、正则表达式、数组、函数和对象都是对象。这使得 JavaScript\
    \ 成为一种强大的面向对象编程语言。\n\n```\nvar person = {\n  firstName: \"John\",\n  lastName\
    \ : \"Doe\",\n  id       : 5566,\n  fullName : function() {\n    return this.firstName\
    \ + \" \" + this.lastName;\n  }\n};\n```\n\n在上面的代码中，`person` 是一个对象。`firstName`、`lastName`\
    \ 和 `id` 是属性，`fullName` 是一个方法。\n\n## JavaScript 中的类\n\n类是创建对象的模板。它们封装了数据和代码。因此，对象是类的一个具体实例；它包含实际的值而不是变量。\n\
    \n在 JavaScript 中，类使用 `class` 关键字声明。\n"
