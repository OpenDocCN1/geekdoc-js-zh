  md: '# # Chapter 20: JavaScript Design Patterns


    Design patterns are reusable solutions to commonly occurring problems in software
    design. They are best practices that experienced developers have learned over
    time and are now offering to less experienced devs. Learning design patterns is
    a crucial step towards writing better JavaScript code. In this chapter, we will
    be discussing some of the most commonly used design patterns in JavaScript.


    # ## The Module Pattern


    The Module pattern is used to create private and public encapsulation for classes
    in JavaScript. It''s common in JavaScript because it provides a way of protecting
    variables and methods (privacy) but also exposes certain variables and methods
    to the public.


    Here is an example of the module pattern:'
  merge: -1
  pgno: 83
- img_proc: true
  md: "```\nvar myModule = (function() {\n  var privateVar = 'I am private...';\n\
    \  var publicVar = 'I am public!';\n\n  function privateMethod() {\n    console.log('Accessed\
    \ private method');\n  }\n\n  function publicMethod() {\n    privateMethod();\n\
    \  }\n\n  return {\n    publicVar: publicVar,\n    publicMethod: publicMethod\n\
    \  };\n})();\n\nconsole.log(myModule.publicVar); // I am public!\nmyModule.publicMethod();\
    \ // Accessed private method\n```"
  merge: -1
  pgno: 84
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 85
- img_proc: true
  md: "# The Prototype Pattern\n\nJavaScript is a prototype-based language, and every\
    \ object in JavaScript has a hidden [[Prototype]] property that's used for inheritance.\n\
    \nHere is an example of the prototype pattern:\n\n```\nfunction Person(firstName,\
    \ lastName) {\n  this.firstName = firstName;\n  this.lastName = lastName;\n}\n\
    \nPerson.prototype.getFullName = function() {\n  return this.firstName + ' ' +\
    \ this.lastName;\n};\n\nvar person1 = new Person('John', 'Doe');\nconsole.log(person1.getFullName());\
    \ // John Doe\n```"
  merge: -1
  pgno: 86
- img_proc: true
  md: "# The Observer Pattern\n\nThe Observer pattern offers a subscription model\
    \ where objects subscribe to an event and get notified when the event occurs.\
    \ This pattern is the cornerstone of event driven programming, including JavaScript.\n\
    \nHere is an example of the observer pattern:\n\n```\nvar Subject = function()\
    \ {\n  this.observers = [];\n\n  return {\n    subscribeObserver: function(observer)\
    \ {\n      this.observers.push(observer);\n    },\n    unsubscribeObserver: function(observer)\
    \ {\n      var index = this.observers.indexOf(observer);\n      if(index > -1)\
    \ {\n        this.observers.splice(index, 1);\n      }\n    },\n    notifyObserver:\
    \ function(observer) {\n      var index = this.observers.indexOf(observer);\n\
    \      if(index > -1) {\n        observer.notify();\n      }\n    },\n    notifyAllObservers:\
    \ function() {\n      for(var i = 0; i < this.observers.length; i++) {\n     \
    \   this.observers[i].notify();\n      }\n    }\n  };\n};\n```"
  merge: -1
  pgno: 87
- img_proc: true
  md: "```\nnotifyObserver: function(observer) {\n  var index = this.observers.indexOf(observer);\n\
    \  if(index > -1) {\n    this.observers[index].notify(index);\n  }\n},\nnotifyAllObservers:\
    \ function() {\n  for(var i = 0; i < this.observers.length; i++){\n    this.observers[i].notify(i);\n\
    \  };\n}\n};\n```\n\n```\nvar Observer = function() {\n  return {\n    notify:\
    \ function(index) {\n      console.log(\"Observer \" + index + \" is notified!\"\
    );\n    }\n  }\n}\n```"
  merge: -1
  pgno: 88
- img_proc: true
  md: <!-- no content -->
