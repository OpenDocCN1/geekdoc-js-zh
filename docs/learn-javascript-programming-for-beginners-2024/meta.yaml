    ## Learn Javascript


    Connor Camberwell


    ## Chapter 1: Introduction to JavaScript


    ### What is JavaScript?


    JavaScript is a lightweight, interpreted, object-oriented language with first-class
    functions, and is best known as the scripting language for web pages, but it''s
    used in many non-browser environments as well. JavaScript is a prototype-based,
    multi-paradigm, dynamic language, supporting object-oriented, imperative, and
    declarative (e.g. functional programming) styles.


    Originally developed by Netscape in the mid-1990s, JavaScript has become one of
    the three core technologies of the web, along with HTML and CSS.


    ```

    console.log("Hello, World!");

    ```


    ### Why Learn JavaScript?


    JavaScript is the programming language of the web. If you want to code for the
    web, JavaScript is essential. Whether you’re an aspiring web developer or a seasoned
    professional, JavaScript is a critical skill in your toolbelt.


    JavaScript also serves as a great entry point into the programming world. It has
    a relatively straightforward syntax and is a great way to learn fundamental concepts
    in programming.


    ### JavaScript Environment


    Before we start, we need to set up our JavaScript environment. While you can write
    JavaScript in any text editor, you’ll need a web browser to run your scripts.


    Most web browsers have built-in JavaScript engines. You can open a JavaScript
    console in your browser and run JavaScript code directly in the console.


    ### Basic JavaScript Syntax


    JavaScript syntax is the set of rules, how JavaScript programs are constructed:


    ```

    var x = 5; // declaring a variable

    var y = 6; // declaring another variable

    var z = x + y; // adding the variables together


    console.log(z); // prints the result to the console

    ```


    ### Variables and Data Types


    JavaScript has dynamic types. This means you don''t have to specify the data type
    of a variable when you declare it, and you can change the data type of a variable
    that has already been declared.


    ```

    var length = 16; // Number

    var lastName = "Johnson"; // String

    var x = {firstName:"John", lastName:"Doe"}; // Object

    ```


    In the next chapter, we''ll dive deeper into JavaScript''s data types, how to
    manipulate them, and how to use them effectively in your code.


    ## Chapter 2: Understanding Variables and Data Types in JavaScript


    In this chapter, we will explore variables and data types, which are fundamental
    concepts in JavaScript. As you learn about these topics, you will also get to
    see them in action through various code examples.


    ### Variables


    Variables are containers for storing data values. In JavaScript, we declare a
    variable using the var keyword, followed by the name of the variable. Let’s look
    at how we can create a variable.


    ```

    var name = "John Doe";

    ```


    In the example above, we created a variable named name and assigned it the value
    “John Doe”. We can also declare a variable without assigning a value, and assign
    it later.


    ```

    var name;

    name = "John Doe";

    ```


    JavaScript also provides two other keywords for declaring variables - let and
    const. The let keyword is similar to var, but it has a block scope. On the other
    hand, const is used for declaring constants, which are variables that cannot be
    reassigned.


    ```

    let age = 25;

    const country = "USA";

    ```


    ### Data Types


    JavaScript has several data types, including:


    1. Number - Represents numeric values. For example: var num = 25;.

    2. String - Represents sequence of characters. For example: var str = "Hello World";.

    3. Boolean - Represents logical values. Can either be true or false. For example:
    var isTrue = true;.

    4. Undefined - Represents a variable that has not been assigned a value. For example:
    var x;.

    5. Null - Represents a null value. For example: var y = null;.

    6. Object - Represents an instance through which we can access methods. For example:
    var obj = {name: "John", age: 25, country: "USA"};.

    7. Array - Represents a group of similar items in a list. For example: var arr
    = [1, 2, 3, 4, 5];.


    Let''s look at a few examples of these data types.


    ```

    // Number

    var num = 25;

    ```


    ```

    // String

    var str = "Hello World";

    ```


    ```

    // Boolean

    var isTrue = true;

    ```


    ```

    // Undefined

    var x;

    ```


    ```

    // Null

    var y = null;

    ```


    ```

    // Object

    var obj = {name: "John", age: 25, country: "USA"};


    // Array

    var arr = [1, 2, 3, 4, 5];

    ```


    In JavaScript, we can find the type of a variable using the typeof operator.


    ```

    console.log(typeof num); // Returns "number"

    console.log(typeof str); // Returns "string"

    console.log(typeof isTrue); // Returns "boolean"

    console.log(typeof x); // Returns "undefined"

    console.log(typeof y); // Returns "object"

    console.log(typeof obj); // Returns "object"

    console.log(typeof arr); // Returns "object"

    ```


    As you can see, variables and data types are fundamental to working with JavaScript.
    In the next chapter, we will discuss how to use operators and control structures
    in JavaScript.


    ## Chapter 3: Variables and Data Types in JavaScript


    In this chapter, we will explore the foundation of any programming language: variables
    and data types. In JavaScript, we have a variety of data types and ways to declare
    variables, which we will be delving into in this chapter.


    ### Variables


    In JavaScript, variables are containers for storing data values. The value stored
    in a variable can be changed, and it’s this dynamic nature that makes variables
    an essential part of programming.


    There are three ways to declare a variable in JavaScript:


    1. Using var

    2. Using let

    3. Using const


    Let''s look at each of them.


    ### Var


    Before ES6, var was the only way to declare variables in JavaScript. Here is an
    example:


    ```

    var name = "John Doe";

    ```


    ### Let


    Introduced in ES6, let is now the preferred way to declare variables. It has more
    restrictions than var, which helps prevent bugs in your code. Here is an example:


    ```

    let name = "John Doe";

    ```


    ### Const


    Also introduced in ES6, const is used to declare constants, i.e., variables that
    cannot be reassigned. Here is an example:


    ```

    const PI = 3.14159;

    ```


    ### Data Types


    JavaScript has a few basic data types, including:


    1. Number

    2. String

    3. Boolean

    4. Object

    5. Null

    6. Undefined

    7. Symbol (new in ES6)


    ### Number


    Numbers in JavaScript can be with or without decimals. For example:


    ```

    let num1 = 5; // without decimal

    let num2 = 5.5; // with decimal

    ```


    ### String


    Strings are sequences of characters, and they must be inside quotes. For example:


    ```

    let str1 = "Hello"; // double quotes

    let str2 = ''Hello''; // single quotes

    ```


    ### Boolean


    Booleans can only be true or false. For example:


    ```

    let isReading = true;

    let isSleeping = false;

    ```


    ### Object


    Objects are complex data types that allow for the combination of other data types.
    For example:


    ```

    let person = {firstName: "John", lastName: "Doe", age: 30};

    ```


    ### Null and Undefined


    In JavaScript, null means “nothing”. It needs to be assigned:


    ```

    let nothing = null;

    ```


    Undefined means a variable has not been assigned a value:


    ```

    let something;

    console.log(something); // Outputs: undefined

    ```


    ### Symbol


    The Symbol data type was introduced in ES6, and it produces a unique value:


    ```

    let symbol1 = Symbol(''symbol'');

    ```


    That''s it for this chapter! By now, you should have a good understanding of variables
    and data types in JavaScript. In the next chapter, we will delve into more complex
    topics like functions and loops. Stay tuned!


    ## Chapter 4: Functions in JavaScript


    In this chapter, we will delve into one of the most fundamental aspects of JavaScript:
    functions. Functions are reusable blocks of code that perform a specific task.
    They can take inputs, called parameters, and return an output, or result.


    ### What are Functions?


    In JavaScript, functions are first-class objects, which means they can be stored
    in variables, passed as arguments to other functions, and returned from other
    functions. This flexibility gives JavaScript its power and versatility.


