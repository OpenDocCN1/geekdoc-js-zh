    # # Chapter 20: JavaScript Design Patterns


    Design patterns are reusable solutions to commonly occurring problems in software
    design. They are best practices that experienced developers have learned over
    time and are now offering to less experienced devs. Learning design patterns is
    a crucial step towards writing better JavaScript code. In this chapter, we will
    be discussing some of the most commonly used design patterns in JavaScript.


    # ## The Module Pattern


    The Module pattern is used to create private and public encapsulation for classes
    in JavaScript. It''s common in JavaScript because it provides a way of protecting
    variables and methods (privacy) but also exposes certain variables and methods
    to the public.


