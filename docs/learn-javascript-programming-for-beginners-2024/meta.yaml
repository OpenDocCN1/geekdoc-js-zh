- img_proc: true
  md: '```

    var subject = new Subject();


    var observer1 = new Observer();

    var observer2 = new Observer();

    var observer3 = new Observer();


    subject.subscribeObserver(observer1);

    subject.subscribeObserver(observer2);

    subject.subscribeObserver(observer3);


    subject.notifyObserver(observer2); // Observer 2 is notified!


    subject.notifyAllObservers();

    // Observer 0 is notified!

    // Observer 1 is notified!

    // Observer 2 is notified!

    ```


    In this chapter, we have covered some of the most commonly used design patterns
    in JavaScript. Design patterns provide a general repeatable solution to commonly
    occurring problems in software design. They can speed up the development process
    by providing tested, proven development paradigms and also improve the structure
    of your code, making your code more maintainable and flexible.'
  merge: -1
