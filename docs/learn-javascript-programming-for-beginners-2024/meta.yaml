    programming languages: Object-Oriented Programming (OOP). OOP is a design paradigm
    or pattern that is based on the concept of “objects”, which can contain data and
    code: data in the form of fields (also known as attributes or properties), and
    code, in the form of procedures (also known as methods).


    # Understanding Objects in JavaScript


    In JavaScript, an object is a standalone entity with properties and type. It''s
    similar to real-life objects, such as a car, a person, or a dog. All these objects
    have a state and a behavior. For example, a car has color, make, model as its
    properties, and start, stop, accelerate as its behaviors.'
