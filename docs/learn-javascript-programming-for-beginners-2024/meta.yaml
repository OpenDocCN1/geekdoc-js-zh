    \ statement that allows you to “try” a block of code and “catch” any errors that\
    \ occur.\n\n```\ntry {\n  // code that might throw an error\n} catch (error) {\n\
    \  // code to handle the error\n}\n```\n\nYou can also add a finally block after\
    \ the catch block. The code inside the finally block will run regardless of whether\
    \ an error occurred.\n\n```\ntry {\n  // code that might throw an error\n} catch\
