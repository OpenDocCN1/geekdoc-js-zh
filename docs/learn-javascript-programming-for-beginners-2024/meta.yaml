  md: '# # Chapter 19: Working with JSON in JavaScript


    JavaScript Object Notation, or JSON, is a common data format with diverse uses
    in data manipulation and communication. Being native to JavaScript, it’s unsurprisingly
    a breeze to work with JSON data in JavaScript. In this chapter, we’ll explore
    how to parse JSON data, how to stringify JavaScript objects, and how to handle
    JSON data fetched from an API.


    # ## What is JSON?


    JSON stands for JavaScript Object Notation. It is a standard data interchange
    format that is primarily used for transmitting data between a server and a web
    application, as an alternative to XML. JSON objects are easy to read and write
    and they’re lightweight when it comes to size.


    An example of a JSON object:'
  merge: -1
  pgno: 79
- img_proc: true
  md: "```\nconst person = {\n  \"name\": \"John Doe\",\n  \"age\": 30,\n  \"city\"\
    : \"New York\"\n};\n```\n\n# Parsing JSON\n\nTo convert JSON text into a JavaScript\
    \ object, we use the JSON.parse() method.\n\n```\nconst jsonString = '{\"name\"\
    :\"John Doe\",\"age\":30,\"city\":\"New York\"}';\nconst jsonObject = JSON.parse(jsonString);\n\
    console.log(jsonObject.name); // Outputs: \"John Doe\"\n```\n\n# Stringifying\
    \ Objects\n\nThe process of encoding a JavaScript object into JSON text is called\
    \ stringifying. This is done with the JSON.stringify() method."
  merge: -1
  pgno: 80
- img_proc: true
  md: "```\nconst person = {\n  name: 'John Doe',\n  age: 30,\n  city: 'New York'\n\
    };\n\nconst jsonString = JSON.stringify(person);\nconsole.log(jsonString); //\
    \ Outputs: '{\"name\":\"John Doe\",\"age\":30,\"city\":\"New York\"}'\n```\n\n\
    # Fetching JSON from an API\n\nOften, you'll be working with JSON data fetched\
    \ from a web server. To do this, we can use the fetch() method, which returns\
    \ a Promise.\n\n```\nfetch('https://api.example.com/data')\n  .then(response =>\
    \ response.json()) // Parsing the data as JSON\n  .then(data => console.log(data))\
    \ // Handle the JSON data\n  .catch(error => console.error('Error:', error))\n\
    ```"
  merge: -1
  pgno: 81
- img_proc: true
  md: 'In this example, we''re fetching JSON data from ‘https://api.example.com/data’.
    The fetch() method returns a Promise, which we handle with .then(). The response
    is then parsed as JSON, and we handle the resulting data in the next .then().


    In the next chapter, we will learn more about Promises and asynchronous programming
    in JavaScript. For now, understand that Promises represent a future value, and
    .then() allows us to handle these values once they’re available.


    This chapter has given you the basics of working with JSON in JavaScript. As you
    continue your journey with JavaScript, you’ll find that JSON is an essential part
    of web development, whether you’re sending data to an API, or receiving and handling
    data.'
