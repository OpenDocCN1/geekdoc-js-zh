- md: "## The Prototype Pattern\n\nJavaScript is a prototype-based language, and every\
    \ object in JavaScript has a hidden [[Prototype]] property that's used for inheritance.\n\
    \nHere is an example of the prototype pattern:\n\n```javascript\nfunction Person(firstName,\
    \ lastName) {\n  this.firstName = firstName;\n  this.lastName = lastName;\n}\n\
    \nPerson.prototype.getFullName = function() {\n  return this.firstName + ' ' +\
    \ this.lastName;\n};\n\nvar person1 = new Person('John', 'Doe');\nconsole.log(person1.getFullName());\
    \ // John Doe\n```\n\n## The Observer Pattern\n\nThe Observer pattern offers a\
    \ subscription model where objects subscribe to an event and get notified when\
    \ the event occurs. This pattern is the cornerstone of event driven programming,\
    \ including JavaScript.\n\nHere is an example of the observer pattern:\n\n```javascript\n\
    var Subject = function() {\n  this.observers = [];\n\n  return {\n    subscribeObserver:\
    \ function(observer) {\n      this.observers.push(observer);\n    },\n    unsubscribeObserver:\
    \ function(observer) {\n      var index = this.observers.indexOf(observer);\n\
    \      if(index > -1) {\n        this.observers.splice(index, 1);\n      }\n \
    \   },\n    notifyObserver: function(observer) {\n      var index = this.observers.indexOf(observer);\n\
    \      if(index > -1) {\n        this.observers[index].notify(index);\n      }\n\
    \    },\n    notifyAllObservers: function() {\n      for(var i = 0; i < this.observers.length;\
    \ i++){\n        this.observers[i].notify(i);\n      }\n    }\n  };\n};\n\nvar\
    \ Observer = function() {\n  return {\n    notify: function(index) {\n      console.log(\"\
    Observer \" + index + \" is notified!\");\n    }\n  }\n}\n\nvar subject = new\
    \ Subject();\n\nvar observer1 = new Observer();\nvar observer2 = new Observer();\n\
    var observer3 = new Observer();\n\nsubject.subscribeObserver(observer1);\nsubject.subscribeObserver(observer2);\n\
    subject.subscribeObserver(observer3);\n\nsubject.notifyObserver(observer2); //\
    \ Observer 2 is notified!\n\nsubject.notifyAllObservers();\n// Observer 0 is notified!\n\
    // Observer 1 is notified!\n// Observer 2 is notified!\n```\n\nIn this chapter,\
    \ we have covered some of the most commonly used design patterns in JavaScript.\
    \ Design patterns provide a general repeatable solution to commonly occurring\
    \ problems in software design. They can speed up the development process by providing\
    \ tested, proven development paradigms and also improve the structure of your\
    \ code, making your code more maintainable and flexible."
