  - "[PAGE 42]\n\n# Explicit each\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comment\
    \ in comments}}\n    <li>{{comment.title}}\n      - by {{comment.author}}</li>\n\
    \  {{/each}}\n</ul>\n```\n\nBoth ways yield the same result: two comments are\
    \ displayed. The difference is that the first one changes the data context against\
    \ which the inner block (<li> in that case) is evaluated.\n\nWhen using the first\
    \ approach, the data context of the inner block is the particular comment for\
    \ which that block is duplicated. That’s why we only state `title` inside the\
    \ double mustache: since the data context is a comment, we mean the `title` property\
    \ of the current comment object. Inside the inner block, I cannot reference the\
    \ `comments` object anymore, since it was in my parent context.\n\nOn contrary,\
    \ when using the second approach the data context of the inner block remains the\
    \ same as the parent data context. Only the `comment` variable contains the current\
    \ comment.\n\nOn a first approach, the implicit syntax is tempting because it\
    \ looks more simple. The problem is that you loose the ability to refer to the\
    \ parent context from your inner block, which for real-life scenarios will often\
    \ be limiting.\n\nConsider a change to the above samples:"
