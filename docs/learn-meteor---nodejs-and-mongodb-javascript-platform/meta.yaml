- md: "Packages: admin dashboard, navigation, validation, forms generation\n\ncollections.\
    \ While this may be a great productivity feature especially on rapidly evolving\
    \ projects, it goes against security. For instance, our application relies on\
    \ the fact that all news pieces contain a `title` field, so we should ensure that\
    \ created and updated documents meet that condition.\n\nFortunately, there are\
    \ two packages for that: *aldeed:simple-schema* and *aldeed:collection2*. The\
    \ first, *aldeed:simple-schema*, allows us to create schemas for validating data.\
    \ This feature can be used anywhere in the application, for instance for validating\
    \ data which comes through a method parameter or a route. The example below shows\
    \ how to check that some object has a `title` field of less than 100 characters,\
    \ and that if the `price` field is a number (if present).\n\n## One-shot validation\n\
    \n```\nvar untrustedData = ...;\n\nvar schema = new SimpleSchema({\n  title: {\n\
    \    type: String,\n    max: 200\n  },\n  price: {\n    type: Number,\n    optional:\
    \ true\n  }\n});\n```\n\n```\nvar isValid = Match.test(untrustedData, schema);\n\
    ```\n\nFurthermore *aldeed:simple-schema* can be combined with other packages\
    \ in order to make your work even easier. For instance when combined with the\
    \ *aldeed:collection2* package, any update to a MongoDB collection is validated\
    \ according to a schema. In other words, a schema is applied to your MongoDB collection.\
    \ All you have to do is call the `attachSchema` method on a collection and provide\
    \ it with a schema.\n\nFor instance, the following code will ensure that documents\
    \ added or updated in the `Books` collection have a `title` field of less than\
    \ 100 characters, and that if the `price` field is a number (if present):\n\n\
    ## MongoDB collection validation\n\n```\nvar Schemas = {};\n\nSchemas.Book = new\
    \ SimpleSchema({\n  title: {\n    type: String,\n    max: 200\n  },\n  price:\
    \ {\n    type: Number,\n    optional: true\n  }\n});\n\nBooks.attachSchema(Schemas.Book);\n\
    ```\n\nNote that in the above example our schema is defined just as in the previous\
    \ one-shot validation example. What's even greater is that those checks are made\
    \ on the client and the server side, so a user is quickly notified **and** server\
    \ data is safe.\n\n## 6.10 Exercise: Create a collection and schema for the products\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_92_0.png)\n\nYour application is an\
    \ e-store, so you need a way to store information about the products you sell.\n\
    \nCreate a `products` collection. Create a schema for that collection using the\
    \ `aldeed:simple-schema` package. The schema should enforce the following constraints:\n\
    \n- a `title` field must be present and be a String;\n- a `price` field must be\
    \ present and be a Number.\n\nMake sure that whenever a document is added or modified\
    \ in the `products` collection, validation is applied using the schema you just\
    \ created.\n\n## 6.11 Exercise solution\n\n- Leave your browser open and the meteor\
    \ command-line running.\n- Open another command-line, navigate to your application\
    \ directory and type:\n\n```\nmeteor add aldeed:simple-schema\nmeteor add aldeed:collection2\n\
    ```\n\n- Close that command-line once the packages were successfully installed.\n\
    - Add the following code at the top of the meteor-shop.js file:\n\n```\nmeteorshop.js\n\
    Products = new Mongo.Collection('products');\n\nProducts.attachSchema(new SimpleSchema({\n\
    \  title: {\n    type: String\n  },\n  price: {\n    type: Number\n  }\n}));\n\
    ```\n\n## 6.12 CRUD forms generation\n\nWhile coding a data-centric web application,\
    \ a lot of time is spent creating forms. Forms allow users to create, update and\
    \ delete data from your data store. But they require quite some work: create the\
    \ UI, handle the events, perform validation and notify the user about any validation\
    \ errors. That “quite some work” is multiplied by the number of collections, which\
    \ in total amounts to an important part of the project.\n\nWouldn’t it be nice\
    \ to save a lot of time on that part? That’s where another productive Meteor package\
    \ kicks in: *aldeed:autoform*. This package will automatically create forms, complete\
    \ with validation UI, and it can even connect them to your collections.\n\nWhat’s\
    \ more, *aldeed:autoform* is very flexible. It can do anything from:\n\n- Create\
    \ a form connected to a MongoDB collection, including validation, all in just\
    \ a line of code;\n- Create a customized form connected to a MongoDB collection,\
    \ including validation, with hooks you write;\n- Create a UI that’s validated\
    \ using a schema you provide, calling your own functions when data is validated.\n\
    \nIn other words, AutoForms can be coupled with collections or just schemas. Productivity\
    \ **and** flexibility. Needless to say that this package should be part of most\
    \ (if not all) of your projects.\n\nIn its most basic use, AutoForm is dead simple.\
    \ Just reference your collection using the `quickForm` template. You need to provide\
    \ a unique id. For instance, here is a form that allow users to add a new book:\n\
    \n```\n{{> quickForm collection=\"Books\" id=\"someId\" type=\"insert\"}}\n```\n\
    \nYour could change the `type` to `update`, and all you would need to do is provide\
    \ the id of the document to be modified.\n\nShould you need to customize the generated\
    \ form, you can use the `autoForm` template in lieu of the `quickForm`. You can\
    \ then specify the fields and customize the HTML content. And if you need insert,\
    \ update and delete forms to be shown as popups, there are several packages that\
    \ will do just that in a breeze.\n\nAutoForm is really flexible, read more about\
    \ it [on the package page](https://github.com/aldeed/meteor-autoform).\n\n## 6.13\
    \ Exercise: Create GUI for the user to display and add products with validation\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_96_0.png)\n\nCreate a template named\
    \ `products` that displays all documents in the `products` collection. For each\
    \ product, display its title and price.\n\nMake sure that users can navigate to\
    \ the `products` template using the following URL: http://localhost:3000/products.\
    \ Add a link to that URL in the header of your application, next to the other\
    \ two links.\n\nAdd the *aldeed:autoform* package to your application. Add a form\
    \ to the `products` template that allows users to add new products.\n\nYour `products`\
    \ page should look like the following:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_97_0.png)\n\
    \n## 6.14 Exercise solution\n\n- Leave your browser open and the meteor command-line\
    \ running.\n- Add a products.html file to the client folder. Add the following\
    \ code:\n\nclient\\products.html\n\n```\n<template name=\"products\">\n  <h3>Products</h3>\n\
    \  <ul>\n    {{#each list}}\n      <li>{{title}} {{price}}$</li>\n    {{/each}}\n\
    \  </ul>\n</template>\n```\n\n- Add a `products.js` file to the `client` folder.\
    \ Add the following code:\n\nclient\\products.js\n\n```\nTemplate.products.helpers({\n\
    \  list: function () {\n    return Products.find();\n  }\n});\n```\n\n- Open the\
    \ `route.js` file. Add the following code after the one that is already in the\
    \ file:\n\n# route.js\n\n```\nRouter.route('/products', function () {\n  this.render('products');\n\
    });\n```\n\n- In the `client/layout.html` file, locate the following code:\n\n\
    # client/layout.html\n\n```\n...\n<a href=\"/\">Home</a>\n<a href=\"/time\">Time</a>\n\
    <a href=\"/admin\">Admin</a>\n...\n```\n\n- Replace that code with the following\
    \ one :\n\n# client/layout.html\n\n```\n...\n<a href=\"/\">Home</a>\n<a href=\"\
    /products\">Products</a>\n<a href=\"/time\">Time</a>\n<a href=\"/admin\">Admin</a>\n\
    ...\n```\n\n- Open another command-line, navigate to your application directory\
    \ and type:"
  mdcn: "\n包：管理后台、导航、验证、表单生成\n\n集合。虽然这可能是一个很棒的生产力功能，尤其是在快速发展的项目中，但它与安全性相悖。例如，我们的应用程序依赖于所有新闻文章都包含一个`title`字段这一事实，因此我们应该确保创建和更新的文档都满足该条件。\n\
    \n幸运的是，有两个包可以解决这个问题：*aldeed:simple-schema* 和 *aldeed:collection2*。第一个，*aldeed:simple-schema*，允许我们创建用于验证数据的模式。此功能可在应用程序中的任何地方使用，例如用于验证通过方法参数或路由传递的数据。下面的示例展示了如何检查某个对象是否有一个少于100个字符的`title`字段，以及如果存在`price`字段，它是否是一个数字。\n\
    \n## 单次验证\n\n```\nvar untrustedData = ...;\n\nvar schema = new SimpleSchema({\n\
    \  title: {\n    type: String,\n    max: 200\n  },\n  price: {\n    type: Number,\n\
    \    optional: true\n  }\n});\n```\n\n```\nvar isValid = Match.test(untrustedData,\
    \ schema);\n```\n\n此外，*aldeed:simple-schema* 可以与其他包结合使用，以使你的工作更加轻松。例如，与 *aldeed:collection2*\
    \ 包结合时，对 MongoDB 集合的任何更新都会根据模式进行验证。换句话说，模式被应用于你的 MongoDB 集合。你所要做的就是在集合上调用 `attachSchema`\
    \ 方法并为其提供一个模式。\n\n例如，以下代码将确保添加或更新到 `Books` 集合中的文档有一个少于100个字符的`title`字段，并且如果存在`price`字段，它是一个数字：\n\
    \n## MongoDB 集合验证\n\n```\nvar Schemas = {};\n\nSchemas.Book = new SimpleSchema({\n\
    \  title: {\n    type: String,\n    max: 200\n  },\n  price: {\n    type: Number,\n\
    \    optional: true\n  }\n});\n\nBooks.attachSchema(Schemas.Book);\n```\n\n请注意，在上面的例子中，我们的模式定义方式与前一个单次验证示例相同。更棒的是，这些检查是在客户端和服务器端同时进行的，因此用户会快速得到通知，**同时**服务器数据也得到了保护。\n\
    \n## 6.10 练习：为产品创建一个集合和模式\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_92_0.png)\n\
    \n你的应用程序是一个电子商店，因此你需要一种方法来存储你所售产品的信息。\n\n创建一个 `products` 集合。使用 `aldeed:simple-schema`\
    \ 包为该集合创建一个模式。该模式应强制执行以下约束：\n\n- 必须存在一个 `title` 字段，且类型为 String；\n- 必须存在一个 `price`\
    \ 字段，且类型为 Number。\n\n确保每当在 `products` 集合中添加或修改文档时，都使用你刚刚创建的模式进行验证。\n\n## 6.11\
    \ 练习解答\n\n- 保持你的浏览器和 meteor 命令行打开。\n- 打开另一个命令行，导航到你的应用程序目录并输入：\n\n```\nmeteor\
    \ add aldeed:simple-schema\nmeteor add aldeed:collection2\n```\n\n- 包成功安装后关闭该命令行。\n\
    - 在 meteor-shop.js 文件的顶部添加以下代码：\n\n```\nmeteorshop.js\nProducts = new Mongo.Collection('products');\n\
    \nProducts.attachSchema(new SimpleSchema({\n  title: {\n    type: String\n  },\n\
    \  price: {\n    type: Number\n  }\n}));\n```\n\n## 6.12 CRUD 表单生成\n\n在编写以数据为中心的\
    \ Web 应用程序时，大量时间都花在创建表单上。表单允许用户从你的数据存储中创建、更新和删除数据。但它们需要相当多的工作：创建用户界面、处理事件、执行验证并就任何验证错误通知用户。这种“相当多的工作”会随着集合数量的增加而倍增，总计占项目的重要一部分。\n\
    \n如果能在那部分节省大量时间，岂不是很好？这就是另一个提高生产力的 Meteor 包 *aldeed:autoform* 发挥作用的地方。这个包将自动创建表单，包括验证用户界面，甚至可以将它们连接到你的集合。\n\
    \n更重要的是，*aldeed:autoform* 非常灵活。它可以做任何事情，从：\n\n- 创建一个连接到 MongoDB 集合的表单，包括验证，只需一行代码；\n\
    - 创建一个连接到 MongoDB 集合的自定义表单，包括验证，并附带你编写的钩子；\n- 创建一个使用你提供的模式进行验证的用户界面，并在数据验证通过时调用你自己的函数。\n\
    \n换句话说，AutoForm 可以与集合或仅与模式结合使用。兼顾生产力**和**灵活性。不用说，这个包应该成为你大多数（如果不是所有）项目的一部分。\n\n\
    在其最基本的用法中，AutoForm 非常简单。只需使用 `quickForm` 模板引用你的集合。你需要提供一个唯一的 id。例如，这是一个允许用户添加新书的表单：\n\
    \n```\n{{> quickForm collection=\"Books\" id=\"someId\" type=\"insert\"}}\n```\n\
    \n你可以将 `type` 更改为 `update`，这样你所需要做的就是提供要修改的文档的 id。\n\n如果你需要自定义生成的表单，你可以使用 `autoForm`\
    \ 模板代替 `quickForm`。然后你可以指定字段并自定义 HTML 内容。如果你需要插入、更新和删除表单显示为弹出窗口，有几个包可以轻松做到这一点。\n\
