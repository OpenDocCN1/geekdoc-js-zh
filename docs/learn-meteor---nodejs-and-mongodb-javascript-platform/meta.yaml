    \ named block and provide the inner HTML to that template. There are built-in\
    \ block templates that we'll see later like if or each.\n\n# 4.2 Where does the\
    \ data come from?\n\nOnce inside Spacebars' mustaches, you'll often need data.\
    \ Consider the following code:\n\n```\n<div>You have {{messagesCount}} messages.</div>\n\
    {{#if hasMessages}}\n  {{> messagesList data=messages}}\n{{/if}}\n```\n\nIn that\
    \ code, we reference three values: messagesCount, hasMessages and messages. You\
    \ must provide those values. Spacebars will look for it in the current context\
    \ (more about this later), and then as helpers. Let's look at helpers.\n\n# 4.3\
    \ Helpers\n\nIn the JavaScript file, I can add helpers that provide data for the\
    \ view. That is, data that can be accessed from the Spacebars syntax in my HTML\
    \ file.\n\nIn order to provide a value, we simply use the following syntax:"
