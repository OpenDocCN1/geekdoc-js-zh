    # # 1. Introduction


    # ## 1.1 What this book is not


    I made my best to keep this book small, so that you can learn Meteor quickly without
    getting lost in petty details. If you’re looking for a reference book where you’ll
    find answers to all the questions you may have within the next 4 years of your
    Meteor practice, you’ll find other heavy books for that.


    My purpose is to swiftly provide you with the tools you need to code your first
    Meteor application and be able to look for more by yourself when needed. While
    some authors seems to pride themselves in having the thickest book, in this series
    I’m glad I achieved the thinnest possible book for my purpose. Though I tried
    my best to keep all of what seems necessary, based on my 14 years experience of
    teaching.


    I assume that you know what Meteor is and when to use it. In case you don’t, read
    the following *Why Meteor ?* chapter.


    # ## 1.2 Prerequisites


    In order for this book to meet its goals, you must :'
