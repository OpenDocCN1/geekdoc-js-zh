    # 8.4 Getting out of prototyping


    Up to now we''ve been coding our application really fast, which is great for prototyping.
    However, for our coding to be so effective Meteor uses two packages that should
    be removed before going to production, since they compromise security:'
- md: "## Removing *autopublish*\n\nFirst, you need to remove the package. Just run\
    \ the following command on your command line:\n\n```\nmeteor remove autopublish\n\
    ```\n\nNow, you need to tell Meteor which data should be published and fetched.\
    \ This is done in two steps:\n\n1. Use the `Meteor.publish` function on the server;\n\
    2. Call the `Meteor.subscribe` function on the client.\n\nFor both functions,\
    \ you provide a publication name as a string, that should be the same on the client\
    \ and server (that’s how the subscription is matched with the publication). You\
    \ can also take parameters in the publish method, that you provide in the subscribe\
    \ method.\n\nTo keep things simple, a subscribe should be done before you fetch\
    \ documents from a collection on the client, for instance before using the collection\
    \ find method. A good place to do so is in the onCreated event of a template where\
    \ you use the data.\n\nLet’s have a look at an example. Remember the code I used\
    \ in order to display all the books:\n\n```\ndemos.js\n\nBooks = new Meteor.Collection('books');\n\
    \nif (Meteor.isClient) {\n  Template.books.helpers({\n    books: function () {\n\
    \      return Books.find({});\n    }\n  });\n}\n```\n\n### demos.html\n\n```\n\
    <template name=\"books\">\n    <ul>\n        {{#each book in books}}\n       \
    \ <li>{{book.title}}</li>\n        {{/each}}\n    </ul>\n</template>\n```\n\n\
    This code was based on the *autopublish* package being present. It won't work\
    \ anymore once the *autopublish* package is removed. Let's fix this. First, I\
    \ have to publish the data used by that template. I'll choose a name of `books-all`\
    \ for this subscription. In a `server/publications.js` file I write:\n\n### server/publications.js\n\
    \n```\nMeteor.publish(\"books-all\", function () {\n  return Books.find({});\n\
    });\n```\n\nNext, I subscribe to that publication in the `onCreated` event of\
    \ the `books` template. I create a `client/books.js` file and add the following\
    \ code:\n\n### client/books.js\n\n```\nTemplate.books.onCreated(function() {\n\
    \  this.subscribe('books-all');\n});\n```\n\nNow, after those two steps the list\
    \ of books is displayed again. Note that I use `this.subscribe` instead of `Meteor.subscribe`.\
    \ This allows for the subscription to be gracefully disposed of when the template\
    \ is not being displayed. When using `iron:router`, you can have the router render\
    \ a waiting template while the subscription gets effectively available on the\
    \ client. For this, you provide a `waitOn` option that gets a subscription or\
    \ array of subscriptions:\n\n```\nRouter.route('/books', {\n  loadingTemplate:\
    \ 'loading',\n\n  waitOn: function () {\n    return Meteor.subscribe('books-all');\n\
    \  },\n\n  action: function () {\n    this.render('books');\n  }\n});\n```\n\n\
    ## 8.5 Exercise: Remove the *autopublish* package\n\nRemove the *autopublish*\
    \ package in order to make the application more secure. Note that the application\
    \ pages do not display data anymore.\n\nMake sure to add the appropriate calls\
    \ to *publish* and *subscribe* methods in order to display the data.\n\n![image](img/7ee67584836eb2d3d796446a7cd4a75d_130_0.png)\n\
    \n## 8.6 Exercise solution\n\n1. Point your browser to `http://localhost:3000`.\n\
    2. Leave your browser open and the `meteor` command-line running.\n3. Open another\
    \ command-line, navigate to your application directory and type:\n\n```\nmeteor\
    \ remove autopublish\n```\n\n4. Switch back to your browser and note that news\
    \ and products are not displayed anymore on the home page and *Products* page.\n\
    5. Create a `server/publications.js` file with the following code:\n\n```\nserver/publications.js\n\
    Meteor.publish(\"news-all\", function () {\n  return News.find();\n});\nMeteor.publish(\"\
    products-all\", function () {\n  return Products.find();\n});\n```\n\n6. Create\
    \ a client/subscriptions.js file with the following code:\n\n```\nclient/subscriptions.js\n\
    Template.news.onCreated(function() {\n  this.subscribe('news-all');\n});\nTemplate.products.onCreated(function()\
    \ {\n  this.subscribe('products-all');\n});\nTemplate.store.onCreated(function()\
    \ {\n  this.subscribe('products-all');\n});\n```\n\n7. Switch back to your browser\
    \ and note that news and products are displayed again on the home page and *Products*\
    \ page.\n\n## Removing insecure\n\nFirst, you need to remove the package. Just\
    \ run the following command on your command line:\n\n```\nmeteor remove insecure\n\
    ```\n\nWhen you do so, a client can only perform limited update operations on\
    \ the collections. For instance, it can update a document providing its `_id`\
    \ field but it cannot remove documents or insert new ones. If you decided that\
    \ the client code should not even be able to update a document providing its `_id`\
    \ field, you can use the deny option when creating a Meteor.Collection.\n\nNow,\
    \ only server code has access to the full range update operations. Since your\
    \ client code needs to make updates too, you can enable them using methods. Methods\
    \ are declared on the client and server (common code) with a name and parameters,\
    \ and called from the client using the same name.\n\n> Methods are more powerful\
    \ than a basic API call. When a method is called on the client, it is first evaluated\
    \ on the client using the data that’s already cached by MiniMongo. That way, a\
    \ user sees immediate results to their action. Then the method is evaluated on\
    \ the server, and any change is pushed to the client so the user sees the real\
    \ result taking into account full server-side data.\n\nHere is how you declare\
    \ methods:\n\n### commoncode.js\n\n```\nMeteor.methods({\n  'deletebook': function(id)\
    \ {\n    Books.remove({_id: id});\n  },\n  'dosomething': function(first, second)\
    \ {\n    ...\n  }\n});\n```\n\nAnd here is how you would call those methods from\
    \ client-side events:\n\n```\nTemplate.books.events({\n  'click .deleteAction':\
    \ function(e, a) {\n    Meteor.call('deletebook', this._id);\n  },\n  'click .doAction':\
    \ function(e, a) {\n    var first = ...;\n    var second = ...;\n    Meteor.call('dosomething',\
    \ first, second);\n  }\n});\n```\n\n## 8.7 Exercise: Remove the insecure package\n\
    \nRemove the insecure package in order to make the application more secure. Check\
    \ that you cannot add or remove news pieces using the home page anymore. Make\
    \ sure to add the appropriate calls to methods and call methods in order to enable\
    \ users to add or remove news pieces using the home page.\n\n## 8.8 Exercise solution\n\
    \n1. Point your browser to `http://localhost:3000`.\n2. Leave your browser open\
    \ and the meteor command-line running.\n3. Open another command-line, navigate\
    \ to your application directory and type:\n\n```\nmeteor remove insecure\n```\n\
    \n4. Switch back to your browser and note that you cannot add or remove news pieces\
    \ on the home page.\n5. Create a methods.js file with the following code:\n\n\
    ```\nmethods.js\n\nMeteor.methods({\n  'removenews': function(id) {\n    News.remove({_id:\
    \ id});\n  },\n  'insertnews': function(title) {\n    News.insert({\n      title:\
    \ title,\n      created: new Date()\n    });\n  }\n});\n```\n\n6. Locate the following\
    \ code:\n\n### client/client.js\n\n```\nTemplate.news.events({\n  'submit form':\
    \ function (e) {\n    e.preventDefault();\n    var title = e.target.title.value;\n\
    \    News.insert({title: title, created: new Date()});\n  },\n  'click .removeAction':\
    \ function(e, a) {\n    News.remove({_id: this._id});\n  }\n});\n```\n\n7. Replace\
    \ it with:\n\n### client/client.js\n\n```\nTemplate.news.events({\n  'submit form':\
    \ function (e) {\n    e.preventDefault();\n    var title = e.target.title.value;\n\
    \    Meteor.call('insertnews', title);\n  },\n  'click .removeAction': function(e,\
    \ a) {\n    Meteor.call('removenews', this._id);\n  }\n});\n```\n\n> Note that\
    \ direct calls to collections methods were replaced with method calls.\n\n8. Switch\
    \ back to your browser and note that you can now add or remove news pieces on\
    \ the home page."
  mdcn: "\n## 移除 *autopublish*\n\n首先，你需要移除该包。只需在你的命令行中运行以下命令：\n\n```\nmeteor remove\
    \ autopublish\n```\n\n现在，你需要告诉 Meteor 哪些数据应该被发布和获取。这通过两个步骤完成：\n\n1.  在服务器上使用 `Meteor.publish`\
    \ 函数；\n2.  在客户端调用 `Meteor.subscribe` 函数。\n\n对于这两个函数，你都提供一个字符串形式的发布名称，该名称在客户端和服务器上应保持一致（这是订阅与发布匹配的方式）。你也可以在发布方法中接受参数，这些参数在订阅方法中提供。\n\
    \n为保持简单，应在客户端从集合中获取文档之前完成订阅，例如在使用集合的 find 方法之前。一个合适的地方是在使用数据的模板的 onCreated 事件中。\n\
    \n让我们看一个例子。还记得我用来显示所有书籍的代码吗：\n\n```\ndemos.js\n\nBooks = new Meteor.Collection('books');\n\
    \nif (Meteor.isClient) {\n  Template.books.helpers({\n    books: function () {\n\
    \      return Books.find({});\n    }\n  });\n}\n```\n\n### demos.html\n\n```\n\
    <template name=\"books\">\n    <ul>\n        {{#each book in books}}\n       \
    \ <li>{{book.title}}</li>\n        {{/each}}\n    </ul>\n</template>\n```\n\n\
    这段代码基于 *autopublish* 包的存在。一旦移除 *autopublish* 包，它将不再工作。我们来修复它。首先，我必须发布该模板使用的数据。我将为这个订阅选择一个名为\
    \ `books-all` 的名称。在 `server/publications.js` 文件中，我编写：\n\n### server/publications.js\n\
    \n```\nMeteor.publish(\"books-all\", function () {\n  return Books.find({});\n\
    });\n```\n\n接下来，我在 `books` 模板的 `onCreated` 事件中订阅该发布。我创建一个 `client/books.js` 文件并添加以下代码：\n\
    \n### client/books.js\n\n```\nTemplate.books.onCreated(function() {\n  this.subscribe('books-all');\n\
    });\n```\n\n现在，经过这两个步骤后，书籍列表再次显示。注意我使用 `this.subscribe` 而不是 `Meteor.subscribe`。这允许在模板不再显示时优雅地处理订阅。当使用\
    \ `iron:router` 时，你可以让路由器在订阅在客户端实际可用之前渲染一个等待模板。为此，你提供一个 `waitOn` 选项，该选项获取一个订阅或订阅数组：\n\
    \n```\nRouter.route('/books', {\n  loadingTemplate: 'loading',\n\n  waitOn: function\
    \ () {\n    return Meteor.subscribe('books-all');\n  },\n\n  action: function\
    \ () {\n    this.render('books');\n  }\n});\n```\n\n## 8.5 练习：移除 *autopublish*\
    \ 包\n\n移除 *autopublish* 包以使应用程序更安全。注意应用程序页面不再显示数据。\n\n确保添加对 *publish* 和 *subscribe*\
    \ 方法的适当调用以显示数据。\n\n![image](img/7ee67584836eb2d3d796446a7cd4a75d_130_0.png)\n\n\
    ## 8.6 练习解答\n\n1.  将你的浏览器指向 `http://localhost:3000`。\n2.  保持浏览器打开，并保持 `meteor`\
    \ 命令行运行。\n3.  打开另一个命令行，导航到你的应用程序目录并输入：\n\n```\nmeteor remove autopublish\n```\n\
    \n4.  切换回你的浏览器，注意首页和 *产品* 页面上不再显示新闻和产品。\n5.  创建一个 `server/publications.js` 文件，包含以下代码：\n\
    \n```\nserver/publications.js\nMeteor.publish(\"news-all\", function () {\n  return\
    \ News.find();\n});\nMeteor.publish(\"products-all\", function () {\n  return\
    \ Products.find();\n});\n```\n\n6.  创建一个 client/subscriptions.js 文件，包含以下代码：\n\n\
    ```\nclient/subscriptions.js\nTemplate.news.onCreated(function() {\n  this.subscribe('news-all');\n\
    });\nTemplate.products.onCreated(function() {\n  this.subscribe('products-all');\n\
    });\nTemplate.store.onCreated(function() {\n  this.subscribe('products-all');\n\
    });\n```\n\n7.  切换回你的浏览器，注意首页和 *产品* 页面上新闻和产品再次显示。\n\n## 移除 insecure\n\n首先，你需要移除该包。只需在你的命令行中运行以下命令：\n\
    \n```\nmeteor remove insecure\n```\n\n当你这样做时，客户端只能对集合执行有限的更新操作。例如，它可以提供 `_id`\
    \ 字段来更新文档，但不能删除文档或插入新文档。如果你决定客户端代码甚至不应该能够通过提供 `_id` 字段来更新文档，你可以在创建 Meteor.Collection\
    \ 时使用 deny 选项。\n\n现在，只有服务器代码才能访问完整的更新操作范围。由于你的客户端代码也需要进行更新，你可以使用方法来启用它们。方法在客户端和服务器上（公共代码）用名称和参数声明，并使用相同的名称从客户端调用。\n\
    \n> 方法比基本的 API 调用更强大。当在客户端调用一个方法时，它首先在客户端使用 MiniMongo 已经缓存的数据进行评估。这样，用户可以立即看到其操作的结果。然后在服务器上评估该方法，并将任何更改推送到客户端，以便用户看到考虑了完整服务器端数据的真实结果。\n\
    \n以下是你如何声明方法：\n\n### commoncode.js\n\n```\nMeteor.methods({\n  'deletebook': function(id)\
    \ {\n    Books.remove({_id: id});\n  },\n  'dosomething': function(first, second)\
    \ {\n    ...\n  }\n});\n```\n\n以下是你如何在客户端事件中调用这些方法：\n\n```\nTemplate.books.events({\n\
    \  'click .deleteAction': function(e, a) {\n    Meteor.call('deletebook', this._id);\n\
    \  },\n  'click .doAction': function(e, a) {\n    var first = ...;\n    var second\
    \ = ...;\n    Meteor.call('dosomething', first, second);\n  }\n});\n```\n\n##\
    \ 8.7 练习：移除 insecure 包\n\n移除 insecure 包以使应用程序更安全。检查你是否无法再使用首页添加或删除新闻条目。确保添加对方法的适当调用并调用方法，以使用户能够使用首页添加或删除新闻条目。\n\
    \n## 8.8 练习解答\n\n1.  将你的浏览器指向 `http://localhost:3000`。\n2.  保持浏览器打开，并保持 meteor\
    \ 命令行运行。\n3.  打开另一个命令行，导航到你的应用程序目录并输入：\n\n```\nmeteor remove insecure\n```\n\n\
    4.  切换回你的浏览器，注意你无法在首页上添加或删除新闻条目。\n5.  创建一个 methods.js 文件，包含以下代码：\n\n```\nmethods.js\n\
    \nMeteor.methods({\n  'removenews': function(id) {\n    News.remove({_id: id});\n\
    \  },\n  'insertnews': function(title) {\n    News.insert({\n      title: title,\n\
    \      created: new Date()\n    });\n  }\n});\n```\n\n6.  找到以下代码：\n\n### client/client.js\n\
    \n```\nTemplate.news.events({\n  'submit form': function (e) {\n    e.preventDefault();\n\
    \    var title = e.target.title.value;\n    News.insert({title: title, created:\
    \ new Date()});\n  },\n  'click .removeAction': function(e, a) {\n    News.remove({_id:\
    \ this._id});\n  }\n});\n```\n\n7.  将其替换为：\n\n### client/client.js\n\n```\nTemplate.news.events({\n\
    \  'submit form': function (e) {\n    e.preventDefault();\n    var title = e.target.title.value;\n\
    \    Meteor.call('insertnews', title);\n  },\n  'click .removeAction': function(e,\
    \ a) {\n    Meteor.call('removenews', this._id);\n  }\n});\n```\n\n> 注意，对集合方法的直接调用已被方法调用所取代。\n\
