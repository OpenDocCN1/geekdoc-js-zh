  md: '# # 7. Accounts: user management


    # ## 7.1 Meteor''s account system


    Meteor relies on packages for user management. Several packages are provided by
    the Meteor team, plus many third-parties packages.


    At the root of user management is the `accounts-base` package, which provides
    a `Meteor.users` collection and an API. Full access to the collection is restricted
    to server-side code for obvious security reasons, and the client-side code has
    access to a restricted API enabling you to check whether the user is authenticated:
    `Meteor.user()`. It returns `null` when the user isn''t authenticated, otherwise
    you get some of the user details (a subset of the fields available on the server).


    > Since several account-related packages rely on the `accounts-base` package and
    add it automatically, there is usually no need to add it from the command line.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Accounts: user management


    103


    Sure, you could code everything manually starting from *accounts-base*. But remember:
    Meteor is about productivity. So they provide lots of packages to get you going.

    Basically, what we need is a way to authenticate users and a UI for doing so.
    For the first part, you simply add a login provider package. For the second part,
    you have the choice between a ready-to-use UI package or extended packages that
    let you customize the appearance. Let''s see about those two parts.


    # Login providers


    Users may authenticate against your database, a third-party, or whatever you may
    come up with like two-steps authentication or token-based one-time passwords.
    There are many packages available for that, like:


    +   - *accounts-password*: password-based login;

    - *accounts-facebook*, *accounts-google*, *accounts-twitter* and several others:
    third-party authentication using OAuth;

    - many others, just [look for them in Atmosphere](https://atmospherejs.com/?q=accounts-).


    # Login UI packages


    There are two ways to create your authentication UI:

    The super-fast one, great for prototyping: add the *accounts-ui* package, use
    the {{> loginButtons}} template


    [1] https://atmospherejs.com/?q=accounts-'
  merge: -1
