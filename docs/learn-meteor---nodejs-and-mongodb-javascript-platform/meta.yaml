    client synchronized database cache, isomorphic code, authentication, and lots
    of other Meteor assumptions.

    Meteor''s package manager is Atmosphere. It is made of a web site and integrated
    as part of the Meteor command line.


    > Atmosphere is bound to be progressively abandoned in favor of npm. As the Meteor
