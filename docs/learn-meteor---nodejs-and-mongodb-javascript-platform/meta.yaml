    # 5.5 Mongo.Collection


    Now comes one of the greatest time savers in Meteor. When developing traditional
    client-server applications you have to write server code that accesses the data
    source, exposes it to the client (i.e. write an API), and consume that API from
    the client. You have to track changes on the client, submit them to the server
    (API again), and write server code that pushes those changes to the data source.
    Optionally, you would write code that detects changes in the data source and pushes
    them to the client.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Meteor takes an approach where it does all of that by default, as long as you
    create a `Mongo.Collection`. Which means little code to write and maintain, and
    more time to go on holiday, have fun with your kids or play that great MMORPG
    you like.


    Basically, you create a `Mongo.Collection`, query it, and Meteor does what is
    needed for that to work. That means writing two lines:


    ```

    Books = new Meteor.Collection(''books'');


    var allBooks = Books.find({});

    ```


    Practically, those two simple lines have several effects:


    +   - Provide you with access to the collection on the server side.

    - Create a MiniMongo database on the client side. MiniMongo holds the query results
    on the client side and provides (almost) the same interface as the MongoDB database.

    - Ensure that the MiniMongo database is kept in sync with the server-side MongoDB
    database: any change to the query result will be pushed to the client for you.


    With Meteor, the data management schema for that (and other) collection looks
    like this:'
