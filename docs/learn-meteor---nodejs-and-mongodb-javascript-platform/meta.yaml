  md: "Here, I make sure my templates are defined only on the client:\n\n```\nif(Meteor.isClient)\
    \ {\n  Template.messagesDisplay.helpers({\n    ...\n  });\n}\n```\n\n# Execute\
    \ on server or client - using folders\n\nYou can create `client` and `server`\
    \ folders inside your application, and Meteor will automatically ensure those\
    \ files are processed only on the corresponding side.\nFor instance, here's a\
    \ second way to ensure my templates are defined only on the client (note the file\
    \ name):\n\n```\nTemplate.messagesDisplay.helpers({\n  ...\n});\n```\n\nStill,\
    \ if you want to write code that is executed on both the client and server, you\
    \ can place your JavaScript file in the root folder or one that is not named `client`\
    \ or `server`.\nWhich way would you prefer? It obviously depends on your project's\
    \ size. You may want to have a single JavaScript"
  merge: -1
  pgno: 30
- img_proc: true
  md: 'file in a small project, hence use a test for `Meteor.isClient`. On a bigger
    project, you''ll make maintenance easier if you place the files in the `client`
    and `server` folders.

    Another advantage of using folders is that when you change files just in the `client`
    folder, Meteor builds your application faster than if you change them in the main
    or `server` folder. So using folders also makes your code-review experience faster.


    > Should your application be really large, you can create the `client` and `server`
    folders as sub-folders, and the same logic will apply. This means you can have
    folders at the root of your application named after the functionality they hold,
    and each of those main folders would have `client` and `server` sub-folders when
    necessary.


    # 4.5 Organizing things


    In fact, you can use as little or as many files as you want. Meteor will look
    for all of the `template` elements in all of your HTML and CSS files, whether
    in the base folder, `client` sub-folder (or sub-sub-folder).

    The same goes for the JavaScript file: Meteor will merge all of your JavaScript.
    The only detail, as we saw, is that JavaScript files located in the `client` folder
    will only execute on the client while those in the `server` folder will'
  merge: -1
  pgno: 31
