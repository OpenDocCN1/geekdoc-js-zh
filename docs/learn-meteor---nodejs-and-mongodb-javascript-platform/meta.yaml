    \ 函数可以将数据添加到模板的数据上下文中。因此，例如，我可以这样重写 /message 路由：\n\n```\nRouter.route('/message/:id',\
    \ function () {\n    var id = this.params.id;\n    this.render('messagesDisplay',\n\
    \        { data: { id: id } }\n    );\n});\n```\n\n默认情况下，应用程序的主体内容将显示在每个页面上。但你可以提供一个通用的布局作为模板。这很简单。只需创建你的布局作为一个模板，然后配置\
    \ iron router 使其用于所有路由，或者在每个路由中选择布局。别忘了移除 `body`（模板标签之外的任何 HTML）。\n\n例如，以下是为所有页面配置的布局和代码。布局应包含一个\
    \ yield 指令，指明页面渲染发生的位置。\n\n### 在任何 HTML 文件中\n\n```\n<template name=\"mainLayout\"\
    >\n  <h1>我的超棒应用</h1>\n\n  <div class=\"mainContent\">\n    {{> yield}}\n  </div>\n\
    \n  <div class=\"footer\">\n    版权所有。\n  </div>\n</template>\n```\n\n### routes.js\n\
    \n```\nRouter.configure({\n  layoutTemplate: 'mainLayout'\n});\n```\n\n更多关于 iron\
    \ router 的信息可以在 iron router 指南[^2]中找到。\n\n[^2]: http://iron-meteor.github.io/iron-router/\n\
    \n## 6.7 练习：启用路由并创建布局\n\n将 `iron:router` 软件包添加到你的应用程序中。配置以下路由：\n\n| 路径 | 模板 |\n\
