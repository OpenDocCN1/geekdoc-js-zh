- img_proc: true
  md: 'to get login buttons and you''re done. Downside is: you cannot customize the
    look of the generated UI.

    The fully customizable one, which takes slightly more time, where you use one
    of the packages based on *useraccounts*. For instance, you may use *useraccounts:bootstrap*,
    *useraccounts:materialize* or *useraccounts:polymer* that are ready made for the
    popular frameworks, or *useraccounts:unstyled* in case you need custom HTML.

    Using any of the packages based on *useraccounts*, all you need to do is include
    the `{{> atForm}}` template. It will adapt to whatever login state the user is
    in order to create a login or register form. Also, you can use the `{{> atNavButton}}`
    template that will create a "Log-in" / "Log-out" button.


    The full list of *useraccounts* UI packages [can be found here](https://github.com/meteor-useraccounts/core/blob/master/Guide.md)².


    # Restricting access to parts the application


    Once your users are authenticated, you''ll surely need to have pages restricted
    to authenticated users or groups. For that purpose, The *useraccounts:iron-routing*
    can be combined with the *iron:router* package [we used earlier](https://github.com/meteor-useraccounts/core/blob/master/Guide.md).


    In fact, *useraccounts:iron-routing* is simple to use, yet configurable. You only
    have two things to do. First you state which layout should be used:'
