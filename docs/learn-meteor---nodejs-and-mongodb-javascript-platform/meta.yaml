    \n# 7. 账户：用户管理\n\n## 7.1 Meteor 的账户系统\n\nMeteor 依赖于包来进行用户管理。Meteor 团队提供了几个包，此外还有许多第三方包。\n\
    \n用户管理的核心是 `accounts-base` 包，它提供了一个 `Meteor.users` 集合和一个 API。出于明显的安全原因，对集合的完全访问权限仅限于服务器端代码，而客户端代码可以访问一个受限的\
    \ API，使你能够检查用户是否已认证：`Meteor.user()`。当用户未认证时，它返回 `null`，否则你将获得部分用户详情（服务器端可用字段的一个子集）。\n\
    \n> 由于几个与账户相关的包依赖于 `accounts-base` 包并会自动添加它，因此通常不需要从命令行添加它。\n\n当然，你可以从 *accounts-base*\
    \ 开始手动编码所有内容。但请记住：Meteor 是关于生产力的。所以他们提供了许多包来帮助你快速上手。\n基本上，我们需要的是一个验证用户身份的方法和一个相应的\
    \ UI。对于第一部分，你只需添加一个登录提供程序包。对于第二部分，你可以选择一个现成的 UI 包或者允许你自定义外观的扩展包。让我们分别看看这两部分。\n\
    \n### 登录提供程序\n\n用户可以对你的数据库进行身份验证，也可以使用第三方服务，或者任何你能想到的方式，比如两步验证或基于令牌的一次性密码。为此有许多可用的包，例如：\n\
    \n-   *accounts-password*：基于密码的登录；\n-   *accounts-facebook*、*accounts-google*、*accounts-twitter*\
    \ 以及其他一些包：使用 OAuth 进行第三方身份验证；\n-   还有很多其他的，只需[在 Atmosphere 上搜索](https://atmospherejs.com/?q=accounts-)。\n\
    \n### 登录 UI 包\n\n创建认证 UI 有两种方式：\n超级快速的方式，非常适合原型设计：添加 *accounts-ui* 包，使用 {{> loginButtons}}\
    \ 模板即可获得登录按钮，搞定。缺点是：你无法自定义生成的 UI 的外观。\n完全可自定义的方式，稍微花点时间，你可以使用基于 *useraccounts*\
    \ 的包之一。例如，你可以使用为流行框架预先制作好的 *useraccounts:bootstrap*、*useraccounts:materialize*\
    \ 或 *useraccounts:polymer*，或者在需要自定义 HTML 时使用 *useraccounts:unstyled*。\n使用任何基于\
    \ *useraccounts* 的包，你所要做的就是包含 `{{> atForm}}` 模板。它会根据用户当前的登录状态进行调整，以创建登录或注册表单。此外，你可以使用\
    \ `{{> atNavButton}}` 模板，它将创建一个 \"登录\" / \"注销\" 按钮。\n\n完整的 *useraccounts* UI 包列表[可以在这里找到](https://github.com/meteor-useraccounts/core/blob/master/Guide.md)。\n\
    \n### 限制对应用程序部分的访问\n\n一旦你的用户通过了身份验证，你肯定需要将某些页面限制为仅认证用户或用户组可以访问。为此，*useraccounts:iron-routing*\
    \ 可以与我们[之前使用](https://github.com/meteor-useraccounts/core/blob/master/Guide.md)的\
    \ *iron:router* 包结合使用。\n\n实际上，*useraccounts:iron-routing* 使用简单且可配置。你只需要做两件事。首先声明应使用哪个布局：\n"
