  md: '# Definitions


    # Bundling


    Bundling is the process of combining in a single file several JavaScript or CSS
    files. Since a browser is limited in the amount of files it can get at at time
    from the server, and since each HTTP request has overhead, bundling enables for
    faster load times on the client.


    Bundling is often done together with minification.


    # Minification


    The process of reducing the size of CSS and JavaScript files without altering
    their meaning. This can be done by removing extra spaces and renaming local variables
    to shorter names.


    Minification is done on the server during the build process, so that the files
    provided to the client are smaller. That way, they get to the client quicker,
    which means faster load times.


    Minification is often done together with bundling.'
  merge: -1
  pgno: 137
