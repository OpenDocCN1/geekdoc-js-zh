- img_proc: true
  md: "application.\nIn order to store a value you write:\n\n```\nvar myObject = {\n\
    \  A: 'my value',\n  B: 5\n}\nSession.set('someKey', myObject);\n```\n\nAnd you\
    \ retrieve the value at another place using that code (note the key, `someKey`,\
    \ is the same as the one used to store the data):\n\n```\nvar storedValue = Session.get('someKey');\n\
    console.log(storedValue.A); // prints 'my value'\n```\n\n# Session is a reactive\
    \ source\n\nCode that reads a session value using `Session.get` will be reevaluated\
    \ if the value changes. Well, there are some conditions for code to be reevaluated\
    \ (it all depends on where it is called from), but code in a helper fills that\
    \ condition. That's what Meteor calls reactivity.\nIn my example above, as soon\
    \ as I write the new time value to the session, the `timeDisplay` helper is evaluated\
    \ again and its value inserted in the HTML that states `{{timeDisplay}}`.\nReactivity\
    \ will save us a lot of boilerplate code: as long as we use reactive data, we\
    \ only need to update the data and the UI that relates to it updates."
