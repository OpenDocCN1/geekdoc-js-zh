    # 3.7 Exercise - Create the application\n\nCreate a new Meteor application named\
    \ meteorshop. Add a <h1> title to the page that reads “Shop in a hurry”. Remove\
    \ the button and counter.\n\nYour application should look like the following:\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_24_0.png)\n\nI know, it’s basic, but\
    \ you need to learn some more things before you can do more. Beginner badge unlocked:\
    \ let’s proceed to the next level.\n\n# 3.8 Exercise solution\n\n- Open a command-line\
    \ and navigate to an empty development folder or create one.\n- In the command-line,\
    \ type `meteor create meteor-shop`.\n- In the command-line, type `cd meteorshop`.\n\
    - Open the `meteorshop.html` file. Locate the following code:\n\n```\n<body>\n\
    \  ...\n</body>\n```\n\n- Replace that code with the following one :\n\n```\n\
    <body>\n  <h1>Shop in a hurry</h1>\n</body>\n```\n\n- In the command-line, type\
    \ `meteor`.\n- Wait for the application to generate and run.\n- Open your browser\
    \ and type the following URL:\n  `http://localhost:3000`\n\n# 4. Blaze, Spacebars\
    \ and reactivity\n\n# 4.1 Spacebars\n\nThe mustache, or double brace syntax {{\
    \ ... }} is due to the fact that Meteor uses Spacebars as a view engine.\n\n#\
    \ What if I prefer Angular or React?\n\nUsing Spacebars is no obligation and you\
    \ can use another view engine. There are Meteor packages that allow you to use\
    \ Angular, Angular2, React or Knockout.\n\nThis book will stick to the default\
    \ Spacebars syntax since we get it out of the box.\n\n# Spacebars basics\n\nAs\
    \ you saw, Spacebars is HTML on steroids. There are three main types of Spacebars\
    \ blocks you can insert:\n\n- `{{someValue}}` will evaluate `someValue` and render\
    \ its content as text. More about that later;\n- `{{> templateName}}` will insert\
    \ a template named `templateName`, just like we saw above;\n- `{{#block}}Your\
    \ HTML content{{/block}}` will insert a template named block and provide the inner\
    \ HTML to that template. There are built-in block templates that we'll see later\
    \ like if or each.\n\n# 4.2 Where does the data come from?\n\nOnce inside Spacebars'\
    \ mustaches, you'll often need data. Consider the following code:\n\n```\n<div>You\
    \ have {{messagesCount}} messages.</div>\n{{#if hasMessages}}\n  {{> messagesList\
    \ data=messages}}\n{{/if}}\n```\n\nIn that code, we reference three values: messagesCount,\
    \ hasMessages and messages. You must provide those values. Spacebars will look\
    \ for it in the current context (more about this later), and then as helpers.\
    \ Let's look at helpers.\n\n# 4.3 Helpers\n\nIn the JavaScript file, I can add\
    \ helpers that provide data for the view. That is, data that can be accessed from\
    \ the Spacebars syntax in my HTML file.\n\nIn order to provide a value, we simply\
    \ use the following syntax:\n\n```\nTemplate.templateName.helpers({\n  someValue:\
    \ function() {\n    return ...;\n  },\n  someOtherValue: function(param1, param2)\
    \ {\n    return ...;\n  },\n});\n```\n\nThose helpers are readily available in\
    \ my HTML file, so I could write:\n\n```\n<div>Here's a value: {{someValue}},\n\
    and another one: {{someOtherValue 'first param' 'second one'}}</div>\n```\n\n\
    Now let's look again at my previous example, this time writing the helpers.\n\n\
    ```\nTemplate.messagesDisplay.helpers({\n  messagesCount: function() {\n    return\
    \ 2;\n  },\n  hasMessages: function() {\n    return true;\n  },\n  messages: function(param1,\
    \ param2) {\n    return ['Hello', 'Important message'];\n  },\n});\n```\n\n# demos.html\n\
    \n```\n<template name=\"messagesDisplay\">\n  <div>You have {{messagesCount}}\
    \ messages.</div>\n  {{#if hasMessages}}\n    {{> messagesList data=messages}}\n\
    \  {{/if}}\n</template>\n<template name=\"messagesList\">\n  <div>This one needs\
    \ to be coded...</div>\n</template>\n```\n\n# 4.4 Client and server code\n\nWhat\
    \ you write in the JavaScript files will be executed both on the client and the\
    \ server. That can be very practical: much of the Meteor productivity comes from\
    \ the fact that we can share the code that describes data and its shape in a single\
    \ place and have it executed both on the client and the server.\n\nBut sometimes\
    \ your JavaScript code should be executed only on the server or the client. For\
    \ instance, my templates need to be defined on the client only. There are two\
    \ ways to achieve this.\n\n# Execute on server or client - testing in JavaScript\n\
    \nYou can test the value of `Meteor.isClient` or `Meteor.isServer`, which return\
    \ boolean values.\n\nHere, I make sure my templates are defined only on the client:\n\
    \n```\nif(Meteor.isClient) {\n  Template.messagesDisplay.helpers({\n    ...\n\
    \  });\n}\n```\n\n# Execute on server or client - using folders\n\nYou can create\
    \ `client` and `server` folders inside your application, and Meteor will automatically\
    \ ensure those files are processed only on the corresponding side.\n\nFor instance,\
    \ here's a second way to ensure my templates are defined only on the client (note\
    \ the file name):\n\n```\nTemplate.messagesDisplay.helpers({\n  ...\n});\n```\n\
    \nStill, if you want to write code that is executed on both the client and server,\
    \ you can place your JavaScript file in the root folder or one that is not named\
    \ `client` or `server`.\n\nWhich way would you prefer? It obviously depends on\
    \ your project's size. You may want to have a single JavaScript"
  mdcn: "\n# body\n\n这是你放置首次呈现给用户的 HTML 内容的地方。当然，你可能觉得这是放置 HTML 元素最简单的地方，但那样会让维护工作变成一场噩梦。\n\
    \n既然你是一个追求代码整洁的开发者（我知道你是，因为你还在阅读），你就不会想在 `body` 元素里放置超过几行代码。之后，我们将主要用它作为路由引擎的显示容器。不过，嘿，我们不一定要用路由引擎才能保持整洁。所以我建议你在这里只使用对模板的引用。\n\
    \n我刚才说的是*模板*。是时候看看第三个元素了。\n\n# template\n\n正如我所说，这个元素将会被重复使用。你可以创建任意多个模板，只要为每个模板分配一个不同的\
    \ `name` 属性即可。\n\n然后，你可以在 `body` 元素或其他模板中，使用带有 `>` 元素的 mustache 语法来引用你的模板元素：\n\
    \n```\n{{> templateName}}\n```\n\n> 好吧，这不是纯 HTML，我们添加了一些 *mustache* 语法。稍后会详细介绍。现在，先接受它。\n\
    \n# body + template + template + ...\n\n实际上，如果我们再次查看 `demos.html` 文件，可以看到这样的引用：\n\
    \n```\n<body>\n  ...\n  {{> hello}}\n</body>\n\n<template name=\"hello\">\n  ...\n\
    </template>\n```\n\n这意味着名为 *hello* 的 `template` 元素的内容必须放入 `body` 元素中。这意味着我可以这样写：\n\
    \n```\n<body>\n  {{> header}}\n  {{> someGreatInfo}}\n  {{> footer}}\n</body>\n\
    ```\n\n```\n<template name=\"header\">\n  ...\n</template>\n```\n\n```\n<template\
    \ name=\"someGreatInfo\">\n  ...\n</template>\n```\n\n```\n<template name=\"footer\"\
    >\n  ...\n</template>\n```\n\n我也可以从一个模板内部引用另一个模板：\n\n```\n<body>\n  {{> home}}\n\
    </body>\n```\n\n```\n<template name=\"home\">\n  {{> latestNews}}\n  ...\n</template>\n\
    ```\n\n```\n<template name=\"latestNews\">\n  ...\n</template>\n```\n\n当然，我可以详细解释这个语法，但我会留到后面。现在，你已经学了很多新东西，是时候把它们付诸实践了。\n\
    \n# 3.6 轮到你编码了：动手实践\n\n现在轮到你拿起键盘开始编码了。哦，让我先解释一下这是怎么回事，以防你不熟悉我的 *Learn* 系列书籍。\n\
    \n# 关于本书中的练习\n\n所有的练习都是相互关联的：你将构建一个小型电子商务应用。你将允许用户浏览你的产品，将它们加入购物车，同时你还将创建一个完整的后端，让网站管理员能够列出、创建、修改和删除产品。\n\
    \n# 万一你卡住了\n\n你应该能够独立解决练习。如果你卡住了或者手边没有电脑（或者你没有本书的先修知识，这没关系！），这里是解决方案。我会在本书每个练习之后提供所有练习的解决方案。\n\
    \n# 3.7 练习 - 创建应用\n\n创建一个名为 meteorshop 的新 Meteor 应用。在页面中添加一个 `<h1>` 标题，内容为 “Shop\
    \ in a hurry”。移除按钮和计数器。\n\n你的应用应如下所示：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_24_0.png)\n\
    \n我知道，这很基础，但在你能做更多之前需要再学一些东西。初学者徽章已解锁：让我们进入下一关。\n\n# 3.8 练习解答\n\n- 打开命令行，导航到一个空的开发文件夹或创建一个。\n\
    - 在命令行中，输入 `meteor create meteor-shop`。\n- 在命令行中，输入 `cd meteorshop`。\n- 打开 `meteorshop.html`\
    \ 文件。找到以下代码：\n\n```\n<body>\n  ...\n</body>\n```\n\n- 用以下代码替换它：\n\n```\n<body>\n\
    \  <h1>Shop in a hurry</h1>\n</body>\n```\n\n- 在命令行中，输入 `meteor`。\n- 等待应用生成并运行。\n\
    - 打开你的浏览器并输入以下 URL：\n  `http://localhost:3000`\n\n# 4. Blaze, Spacebars 和响应式\n\
    \n# 4.1 Spacebars\n\nmustache 或双花括号语法 {{ ... }} 是因为 Meteor 使用 Spacebars 作为视图引擎。\n\
    \n# 如果我更喜欢 Angular 或 React 怎么办？\n\n使用 Spacebars 不是强制性的，你可以使用其他视图引擎。有一些 Meteor\
    \ 包允许你使用 Angular、Angular2、React 或 Knockout。\n\n本书将坚持使用默认的 Spacebars 语法，因为它是开箱即用的。\n\
    \n# Spacebars 基础\n\n正如你所见，Spacebars 是强化版的 HTML。你可以插入三种主要类型的 Spacebars 块：\n\n-\
    \ `{{someValue}}` 将计算 `someValue` 并将其内容渲染为文本。稍后会详细介绍；\n- `{{> templateName}}`\
    \ 将插入一个名为 `templateName` 的模板，就像我们上面看到的；\n- `{{#block}}你的 HTML 内容{{/block}}` 将插入一个名为\
    \ block 的模板，并将内部 HTML 提供给该模板。我们稍后会看到一些内置的块模板，比如 if 或 each。\n\n# 4.2 数据从哪里来？\n\n\
    一旦进入 Spacebars 的花括号内，你经常会需要数据。考虑以下代码：\n\n```\n<div>You have {{messagesCount}}\
    \ messages.</div>\n{{#if hasMessages}}\n  {{> messagesList data=messages}}\n{{/if}}\n\
    ```\n\n在这段代码中，我们引用了三个值：messagesCount、hasMessages 和 messages。你必须提供这些值。Spacebars\
    \ 会先在当前上下文中查找（稍后详述），然后作为辅助函数（helpers）查找。让我们看看辅助函数。\n\n# 4.3 辅助函数 (Helpers)\n\n\
    在 JavaScript 文件中，我可以添加为视图提供数据的辅助函数。也就是说，这些数据可以从我的 HTML 文件中的 Spacebars 语法中访问。\n\
    \n为了提供一个值，我们只需使用以下语法：\n\n```\nTemplate.templateName.helpers({\n  someValue: function()\
    \ {\n    return ...;\n  },\n  someOtherValue: function(param1, param2) {\n   \
    \ return ...;\n  },\n});\n```\n\n这些辅助函数在我的 HTML 文件中是现成可用的，所以我可以这样写：\n\n```\n<div>Here's\
    \ a value: {{someValue}},\nand another one: {{someOtherValue 'first param' 'second\
    \ one'}}</div>\n```\n\n现在让我们再看看我之前的例子，这次编写辅助函数。\n\n```\nTemplate.messagesDisplay.helpers({\n\
    \  messagesCount: function() {\n    return 2;\n  },\n  hasMessages: function()\
    \ {\n    return true;\n  },\n  messages: function(param1, param2) {\n    return\
    \ ['Hello', 'Important message'];\n  },\n});\n```\n\n# demos.html\n\n```\n<template\
    \ name=\"messagesDisplay\">\n  <div>You have {{messagesCount}} messages.</div>\n\
    \  {{#if hasMessages}}\n    {{> messagesList data=messages}}\n  {{/if}}\n</template>\n\
    <template name=\"messagesList\">\n  <div>This one needs to be coded...</div>\n\
    </template>\n```\n\n# 4.4 客户端和服务器代码\n\n你在 JavaScript 文件中编写的代码将在客户端和服务器端执行。这可能非常实用：Meteor\
    \ 的高效性很大程度上源于我们可以将描述数据及其结构的代码共享在同一个地方，并让它在客户端和服务器端都执行。\n\n但有时你的 JavaScript 代码应该只在服务器端或客户端执行。例如，我的模板需要只在客户端定义。有两种方法可以实现这一点。\n\
    \n# 在服务器或客户端执行 - 在 JavaScript 中测试\n\n你可以测试 `Meteor.isClient` 或 `Meteor.isServer`\
    \ 的值，它们返回布尔值。\n\n在这里，我确保我的模板只在客户端定义：\n\n```\nif(Meteor.isClient) {\n  Template.messagesDisplay.helpers({\n\
    \    ...\n  });\n}\n```\n\n# 在服务器或客户端执行 - 使用文件夹\n\n你可以在应用程序内部创建 `client` 和 `server`\
    \ 文件夹，Meteor 会自动确保这些文件只在相应的端上被处理。\n\n例如，这是确保我的模板只在客户端定义的第二种方法（注意文件名）：\n\n```\n\
    Template.messagesDisplay.helpers({\n  ...\n});\n```\n\n不过，如果你想编写在客户端和服务器端都执行的代码，你可以将\
    \ JavaScript 文件放在根文件夹或一个不名为 `client` 或 `server` 的文件夹中。\n\n你更喜欢哪种方式？这显然取决于你项目的规模。你可能希望有一个单独的\
    \ JavaScript 文件用于客户端代码，一个用于服务器端代码，或者为两者编写共享代码。你将看到，随着时间的推移，Meteor 鼓励你将共享代码分离出来，但同时也鼓励你将代码分离为仅限客户端或服务器端。这是一个权衡，你可以根据你的具体情况进行选择。\n"
