    In the header of the application, add a \"Log-in\" / \"Log-out\" button.\n\nHere\
    \ is what an unauthenticated user should see when clicking on the `Products` link:\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_112_0.png)\n\nAccounts: user management\
    \ 107\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_113_0.png)\n\n## 7.3 Exercise\
    \ solution\n\n- Point your browser to http://localhost:3000.\n- Leave your browser\
    \ open and the meteor command-line running.\n- Open another command-line, navigate\
    \ to your application directory and type:\n  - Add the following code to the end\
    \ of the route.js file:\n\n```\nmeteor add accounts-password\nmeteor add useraccounts:bootstrap\n\
    meteor add useraccounts:iron-routing\n```\n\n# route.js\n\n```\nAccountsTemplates.configure({\n\
    \  defaultLayout: 'layout',\n});\n\nRouter.plugin('ensureSignedIn', {\n  only:\
    \ ['products']\n});\n```\n\n- Locate the following code:\n\n# client/layout.html\n\
    \n```\n<li><a href=\"/admin\">Admin</a></li>\n</ul>\n```\n\n- Replace it with:\n\
    \n# client/layout.html\n\n```\n<li><a href=\"/admin\">Admin</a></li>\n<li>{{>\
    \ atNavButton}}</li>\n</ul>\n```\n\n- Switch back to your browser and try to navigate\
    \ the application using the two links at the top. Note that the *Products* page\
    \ cannot be accessed if you are not logged-in.\n\n# Accounts: user management\n\
    \n- Create an account using the link at the bottom of the login page, and check\
    \ that you can access the whole application.\n- Logout, check that the *Products*\
    \ page cannot be accessed anymore.\n- Log-in and check that you can access the\
    \ whole application.\n\n# 8. Going further\n\n# 8.1 MiniMongo: you don’t even\
    \ need MongoDB\n\nAs we saw earlier, `Mongo.Collection` allows you to have real-time,\
    \ synchronized, client **and** server access to MongoDB collections. This is great,\
    \ but what if you need a simple in-memory store for data? Well, you can, and you\
    \ already know how.\n\nWhen you create a `Mongo.Collection`, it uses MiniMongo\
    \ on the client side in order to cache query results. The good news is that you\
    \ can create a MiniMongo instance alone. Just create a new `Mongo.Collection`\
    \ using `null` as the constructor parameter (instead of the MongoDB collection\
    \ name that you would provide otherwise) and you get an in-memory MiniMongo. What's\
    \ more, this MiniMongo isn't synchronized between the server and client like a\
    \ normal `Mongo.Collection`: it remains only where you declared it: server-side\
    \ when declared on the server and, well, client-side if declared on the client.\n\
    \nTo summarize, just write:\n\n```\nvar store = new Meteor.Collection(null);\n\
    ```\n\nAnd that's all. You can now [query that collection](query that collection)\
    \ using the `find` method, and update it [using update methods](using update methods)\
    \ (almost) just like a MongoDB collection.\n\nMiniMongo is a reactive collection,\
    \ which means that pages displaying data from a MiniMongo collection will get\
    \ instantly updated when the data held in MiniMongo changes.\n\nUsing client-only\
    \ or server-only in-memory MiniMongo comes in handy for parts of your application\
    \ where you store temporary data. For persistent data, use the full power of [Mongo-stored\
    \ collections](Mongo-stored collections). That is, create a `Mongo.Collection`\
    \ providing the MongoDB collection name as a string parameter.\n\n# 8.2 Exercise:\
    \ Create and manage a shopping cart\n\nDisplay the list of products on the home\
    \ page. Next to each product in the list, add a “Buy” button.\nCreate an in-memory\
    \ collection that holds items in the shopping cart. When the user clicks the “Buy”\
    \ button, add a new item to the shopping cart, with a quantity of 1.\nAdd a “Cart”\
    \ page and link to it from the header.\nOn the “Cart” page, display a list of\
    \ items in the cart together with the quantity. Next to each cart item, add “+”\
    \ and “-” buttons that increase or decrease the quantity.\nHere is what the “Cart”\
    \ page should look like:\n\nGoing further 113\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_119_0.png)\n\
    \n## 8.3 Exercise solution\n\n- Point your browser to `http://localhost:3000`.\n\
    - Leave your browser open and the `meteor` command-line running.\n- Add a `store.html`\
    \ file in the `client` folder, with the following code:\n\n# client/store.html\n\
    \n```\n<template name=\"store\">\n  <h3>Store</h3>\n  <ul>\n    {{#each list}}\n\
    \    <li>\n      {{title}} {{price}}$\n      <button class=\"btn btn-success btn-xs\
    \ buyAction\">\n        Buy\n      </button>\n    </li>\n    {{/each}}\n  </ul>\n\
    </template>\n```\n\n- Add a store.js file in the client folder, with the following\
    \ code:\n\n# client/store.js\n\n```\nBasket = new Mongo.Collection(null);\n\n\
    Template.store.helpers({\n  list: function () {\n    return Products.find();\n\
    \  }\n});\n\nTemplate.store.events({\n  'click .buyAction': function () {\n  \
    \  Basket.insert({ product: this, quantity: 1});\n  }\n});\n```\n\n- Add a home.html\
    \ file in the client folder, with the following:\n\n# client/home.html\n\n```\n\
    <template name=\"home\">\n  <div class=\"row\">\n    <div class=\"col-sm-7\">\n\
    \      {{> store}}\n    </div>\n    <div class=\"col-sm-5\">\n      {{> news}}\n\
    \    </div>\n  </div>\n</template>\n```\n\n> In the template above, the div elements\
    \ are there in order to have side-by-side columns using Bootstrap CSS classes.\
    \ We could as well have avoided them since they don't change the functionality.\n\
    \n- Locate the following code:\n\n# route.js\n\n```\nRouter.route('/', function\
    \ () {\n  this.render('news');\n});\n```\n\n- Replace it with:\n\n# route.js\n\
    \n```\nRouter.route('/', function () {\n  this.render('home');\n});\n\nRouter.route('/cart',\
    \ function () {\n  this.render('cart');\n});\n```\n\n- Locate the following code:\n\
    \n# client/layout.html\n\n```\n...\n<li><a href=\"/products\">Products</a></li>\n\
    ...\n```\n\n- Replace it with:\n\n# client/layout.html\n\n```\n...\n<li><a href=\"\
    /products\">Products</a></li>\n<li><a href=\"/cart\">Cart</a></li>\n...\n```\n\
    \n- Add a `cart.html` file in the `client` folder, with the following:\n\n# client/cart.html\n\
    \n```\n<template name=\"cart\">\n  <h3>In your cart</h3>\n  <ul>\n    {{#each\
    \ contents}}\n      <li>{{product.title}}\n        <button class=\"removeAction\
    \ btn btn-xs btn-danger\">\n          x\n        </button>\n        <button class=\"\
    incrementAction btn btn-xs btn-primary\">\n          +\n        </button>\n  \
    \      {{quantity}}\n        <button class=\"decrementAction btn btn-xs btn-primary\"\
    >\n          -\n        </button>\n      </li>\n    {{/each}}\n  </ul>\n</template>\n\
    ```\n\n- Add a cart.js file in the client folder, with the following:\n\n# client/cart.js\n\
    \n```\nTemplate.cart.helpers({\n    contents: function () {\n        return Basket.find();\n\
    \    }\n});\n\nTemplate.cart.events({\n  'click .removeAction': function() {\n\
    \    Basket.remove({_id: this._id});\n  },\n  'click .incrementAction': function()\
    \ {\n    Basket.update({_id: this._id},\n    {$inc: {quantity: 1}});\n  },\n \
    \ 'click .decrementAction': function() {\n    Basket.update({\n      _id: this._id,\n\
    \      quantity: { $gt: 1 },\n    },\n    {$inc: {quantity: -1 }});\n  }\n});\n\
    ```\n\n> In the code above, `quantity: { $gt: 1 }` is a condition that checks\
    \ that the quantity is 1 or more before decrementing. This way we ensure there\
    \ can't be negative quantities.\n\n- Switch back to your browser.\n- Navigate\
    \ to the home page. Check that it displays a list of products.\n- Add some products\
    \ to your cart using the “Buy” button next to the products.\n- Navigate to the\
    \ “Cart” page. Check that the products you added to your cart appear there.\n\
    - Try to increment and decrement the number of products in your cart.\n\n# 8.4\
    \ Getting out of prototyping\n\nUp to now we've been coding our application really\
    \ fast, which is great for prototyping. However, for our coding to be so effective\
    \ Meteor uses two packages that should be removed before going to production,\
    \ since they compromise security:"
