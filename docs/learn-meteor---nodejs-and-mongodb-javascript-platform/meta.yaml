    \ 输入以下命令：\n\n```\nmeteor mongo\n```\n\n-   在出现的 MongoDB 命令行中，输入以下代码：\n\n```\n\
    db.news.insert({ title: 'Site just opened!'} );\ndb.news.insert({ title: 'Special\
    \ offers today.'} );\n```\n\n-   在同一个命令行中，输入以下代码：\n\n```\ndb.news.find({});\n\
    ```\n\n-   确保该命令显示的结果中出现了这两个对象。\n\n## 5.5 Mongo.Collection\n\n现在我们来看看 Meteor 中最节省时间的功能之一。在开发传统的客户端-服务器应用时，你必须编写服务器代码来访问数据源，将其暴露给客户端（即编写一个\
    \ API），然后在客户端调用那个 API。你必须跟踪客户端上的变更，将其提交给服务器（又是 API），并编写服务器代码将这些变更推送到数据源。此外，你可能还需要编写代码来检测数据源中的变更并将其推送到客户端。\n\
    \nMeteor 采用了一种默认方式，只要创建了 `Mongo.Collection`，它就会完成所有这些工作。这意味着需要编写和维护的代码更少，你可以有更多时间去度假、陪孩子玩乐，或者玩你喜欢的那款很棒的\
    \ MMORPG 游戏。\n\n基本上，你创建一个 `Mongo.Collection`，查询它，Meteor 就会处理好使其工作所需的一切。这意味着只需编写两行代码：\n\
    \n```\nBooks = new Meteor.Collection('books');\n\nvar allBooks = Books.find({});\n\
    ```\n\n实际上，这两行简单的代码有几个效果：\n\n-   使你在服务器端可以访问该集合。\n-   在客户端创建一个 MiniMongo 数据库。MiniMongo\
    \ 在客户端保存查询结果，并提供与 MongoDB 数据库（几乎）相同的接口。\n-   确保 MiniMongo 数据库与服务器端的 MongoDB 数据库保持同步：查询结果的任何更改都会被推送到客户端。\n\
    \n在 Meteor 中，这个（以及其他）集合的数据管理架构如下所示：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_57_0.png)\n\
    \n记得我在“集合”章节中创建了一个 `books` 集合吗？我将在我的应用中展示它。\n\n为了让客户端和服务器知道这个集合，我只需要创建一个 `Meteor.Collection`。为了让集合在模板中显示，我会添加一个辅助函数。以下是完整的\
    \ JavaScript 代码：\n\n```\ndemos.js\nBooks = new Meteor.Collection('books');\n\n\
    if (Meteor.isClient) {\n  Template.books.helpers({\n    books: function () {\n\
    \      return Books.find({});\n    }\n  });\n}\n```\n\n第一行代码在客户端和服务器端都会执行。它确保双方都能访问存储在\
    \ MongoDB 数据库中的 `books` 集合。然后，我们创建了一个模板辅助函数，将所有的书作为一个“books”变量暴露在上下文中。注意，我们使用了\
    \ MongoDB 接受的 `find()` 方法，语法相同。\n\n现在，我们可以编写 HTML 了：\n\n```\ndemos.html\n<template\
    \ name=\"books\">\n    <ul>\n        {{#each book in books}}\n        <li>{{book.title}}</li>\n\
    \        {{/each}}\n    </ul>\n</template>\n```\n\n结果如下：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_58_0.png)\n\
    \n现在到了最棒的部分：这段简单的代码从服务器到客户端完全是响应式的。这意味着我不需要做任何事情，就能让已连接的浏览器显示 `books` 集合中的任何更改。别光听我说，让我演示一下。\n\
    \n我将打开一个命令行，输入：\n\n```\nmeteor mongo\n```\n\n```\ndb.books.insert({\n  title:\
    \ 'Learn WebSockets',\n  bought: false\n});\n```\n\n让我们切回浏览器。我甚至不需要刷新它。显示如下：\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_59_0.png)\n\n是的，插入的书出现了。每当我们查询一个 `Mongo.Collection`\
    \ 时，Meteor 会确保查询结果在服务器和客户端之间实时同步。它为此使用了 WebSocket。在内部，Meteor 的 *DDP* 协议用于将变更推送给客户端。\n\
    \n这真是个好消息。我告诉过你 Meteor 让我们效率很高，我希望你在阅读本书的过程中能更清楚地感受到这一点。这是一个很好的例子：仅使用基础代码，我们无需付出额外努力，就能在所有连接的客户端之间实现实时同步。只需想一秒钟，编写像聊天或协作这样的实时应用有多容易：一个客户端上的更改会反映到服务器和所有连接的客户端上。既巧妙又省力。\n\
    \n## 5.6 练习：显示新闻\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_60_0.png)\n\n添加一个名为“news”的新模板，显示你在上一个练习中创建的\
    \ `news` 集合中的所有新闻。在 *body* 元素中引用 `news` 模板。\n\n你的应用应该如下所示：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_61_0.png)\n\
    \n## 5.7 练习解答\n\n-   保持浏览器打开，`meteor` 命令行正在运行。\n-   打开 `meteorshop.js` 文件。添加以下代码：\n\
    -   打开 `client/client.js` 文件。添加以下代码：\n\n```\nmeteorshop.js\nNews = new Mongo.Collection('news');\n\
    ```\n\n```\nclient/client.js\nTemplate.news.helpers({\n    news: function () {\n\
    \        return News.find();\n    }\n});\n```\n\n-   在 `client` 文件夹中添加一个 `news.html`\
    \ 文件。添加以下代码：\n\n```\nclient/news.html\n<template name=\"news\">\n    <h3>News</h3>\n\
    \    <ul>\n        {{#each news}}\n        <li>{{title}}</li>\n        {{/each}}\n\
    \    </ul>\n</template>\n```\n\n-   在 `meteorshop.html` 文件中，找到以下代码：\n\n```\nmeteorshop.html\n\
    <body>\n  <h1>Shop in a hurry</h1>\n  {{> timeDisplay}}\n</body>\n```\n\n-   将其替换为以下代码：\n\
    \n```\nmeteorshop.html\n<body>\n  <h1>Shop in a hurry</h1>\n  {{> timeDisplay}}\n\
    \  {{> news}}\n</body>\n```\n\n切回你的浏览器，确保新闻已经显示出来。\n\n## 5.8 查询选择器\n\n为了获取我示例中的书籍，我写了以下语句：\n\
    \n```\nBooks.find({});\n```\n\n也就是说，我使用了 `Mongo.Collection` 类的 `find` 方法。此命令返回集合中的所有文档。第一个参数是一个查询选择器。\n\
    \n> 查询选择器在任何需要使用 MongoDB 引用某些文档的地方都会用到。它们大致相当于 SQL 语句中的 WHERE 部分。我们稍后在更新数据时会用到它们。\n\
    \n选择器是一个 JavaScript 对象。默认的空选择器是 {}，表示集合中的所有文档。让我们学习如何进一步细化我们的查询。由于我们向 Books 集合添加了\
    \ title 和 bought 字段，我们可以使用这些字段进行查询。\n\n假设我们只想获取已经购买的书籍。我们可以使用以下查询：\n\n```\nBooks.find({\n\
    \    bought: true\n});\n```\n\n如果我们想要那些标题是“Diet”且尚未购买的书，我们可以这样写：\n\n```\nBooks.find({\n\
    \    title: 'Diet',\n    bought: false\n});\n```\n\n正如你所知，MongoDB 是一个无结构数据库，即使\
    \ Books 集合中的某些文档没有这些字段，我们也可以使用这个选择器。\n"
