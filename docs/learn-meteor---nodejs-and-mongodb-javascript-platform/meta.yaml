    less to say that this package should be part of most (if not all) of your projects.


    In its most basic use, AutoForm is dead simple. Just reference your collection
    using the `quickForm` template. You need to provide a unique id. For instance,
    here is a form that allow users to add a new book:


    ```

    {{> quickForm collection="Books" id="someId" type="insert"}}

