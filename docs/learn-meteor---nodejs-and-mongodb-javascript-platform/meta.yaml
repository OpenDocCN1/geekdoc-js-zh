    \          <span class=\"icon-bar\"></span>\n        </button>\n        <a class=\"\
    navbar-brand\" href=\"/\">Home</a>\n      </div>\n      <div class=\"collapse\
    \ navbar-collapse\" id=\"nvbcl\">\n        <ul class=\"nav navbar-nav\">\n   \
    \       <li><a href=\"/products\">Products</a></li>\n          <li><a href=\"\
    /time\">Time</a></li>\n          <li><a href=\"/admin\">Admin</a></li>\n     \
    \   </ul>\n      </div>\n    </div>\n  </nav>\n  <div class=\"container\">\n \
    \   {{>yield}}\n  </div>\n</template>\n```\n\n- In the `client/news.html` file,\
    \ locate the following code:\n\n```\nclient/news.html\n...\n<ul>\n  {{#each news}}\n\
    \    <li>{{title}} <button class=\"removeAction\">x</button></li>\n  {{/each}}\n\
    </ul>\n...\n```\n\n- Replace that code with the following one:\n\n```\nclient/news.html\n\
    ...\n<ul class=\"list-group\">\n  {{#each news}}\n    <li class=\"list-group-item\"\
    >\n      {{title}}\n      <button class=\"btn btn-danger btn-xs removeAction\"\
    >x</button>\n    </li>\n  {{/each}}\n</ul>\n...\n```\n\n- Switch back to your\
    \ browser and click the “Home” link.\n- Check the new style.\n- Resize the browser\
    \ window so that its width gets smaller and wider. The navigation bar should collapse\
    \ on smaller widths.\n\n# 7. Accounts: user management\n\n## 7.1 Meteor's account\
    \ system\n\nMeteor relies on packages for user management. Several packages are\
    \ provided by the Meteor team, plus many third-parties packages.\n\nAt the root\
    \ of user management is the `accounts-base` package, which provides a `Meteor.users`\
    \ collection and an API. Full access to the collection is restricted to server-side\
    \ code for obvious security reasons, and the client-side code has access to a\
    \ restricted API enabling you to check whether the user is authenticated: `Meteor.user()`.\
    \ It returns `null` when the user isn't authenticated, otherwise you get some\
    \ of the user details (a subset of the fields available on the server).\n\n> Since\
    \ several account-related packages rely on the `accounts-base` package and add\
    \ it automatically, there is usually no need to add it from the command line.\n\
    \nSure, you could code everything manually starting from *accounts-base*. But\
    \ remember: Meteor is about productivity. So they provide lots of packages to\
    \ get you going.\nBasically, what we need is a way to authenticate users and a\
    \ UI for doing so. For the first part, you simply add a login provider package.\
    \ For the second part, you have the choice between a ready-to-use UI package or\
    \ extended packages that let you customize the appearance. Let's see about those\
    \ two parts.\n\n### Login providers\n\nUsers may authenticate against your database,\
    \ a third-party, or whatever you may come up with like two-steps authentication\
    \ or token-based one-time passwords. There are many packages available for that,\
    \ like:\n\n- *accounts-password*: password-based login;\n- *accounts-facebook*,\
    \ *accounts-google*, *accounts-twitter* and several others: third-party authentication\
    \ using OAuth;\n- many others, just [look for them in Atmosphere](https://atmospherejs.com/?q=accounts-).\n\
    \n### Login UI packages\n\nThere are two ways to create your authentication UI:\n\
    The super-fast one, great for prototyping: add the *accounts-ui* package, use\
    \ the {{> loginButtons}} template to get login buttons and you're done. Downside\
    \ is: you cannot customize the look of the generated UI.\nThe fully customizable\
    \ one, which takes slightly more time, where you use one of the packages based\
    \ on *useraccounts*. For instance, you may use *useraccounts:bootstrap*, *useraccounts:materialize*\
    \ or *useraccounts:polymer* that are ready made for the popular frameworks, or\
    \ *useraccounts:unstyled* in case you need custom HTML.\nUsing any of the packages\
    \ based on *useraccounts*, all you need to do is include the `{{> atForm}}` template.\
    \ It will adapt to whatever login state the user is in order to create a login\
    \ or register form. Also, you can use the `{{> atNavButton}}` template that will\
    \ create a \"Log-in\" / \"Log-out\" button.\n\nThe full list of *useraccounts*\
    \ UI packages [can be found here](https://github.com/meteor-useraccounts/core/blob/master/Guide.md).\n\
    \n### Restricting access to parts of the application\n\nOnce your users are authenticated,\
    \ you'll surely need to have pages restricted to authenticated users or groups.\
    \ For that purpose, The *useraccounts:iron-routing* can be combined with the *iron:router*\
    \ package [we used earlier](https://github.com/meteor-useraccounts/core/blob/master/Guide.md).\n\
    \nIn fact, *useraccounts:iron-routing* is simple to use, yet configurable. You\
    \ only have two things to do. First you state which layout should be used:"
