- img_proc: true
  md: '```

    meteor remove insecure

    ```


    When you do so, a client can only perform limited update operations on the collections.
    For instance, it can update a document providing its _id field but it cannot remove
    documents or insert new ones. If you decided that the client code should not even
    be able to update a document providing its _id field, you can use the deny option
    when creating a Meteor.Collection.


    Now, only server code has access to the full range update operations. Since your
    client code needs to make updates too, you can enable them using methods. Methods
    are declared on the client and server (common code) with a name and parameters,
    and called from the client using the same name.


    > Methods are more powerful than a basic API call. When a method is called on
    the client, it is first evaluated on the client using the data that’s already
    cached by MiniMongo. That way, a user sees immediate results to their action.
    Then the method is evaluated on the server, and any change is pushed to the client
    so the user sees the real result taking into account full server-side data.


    Here is how you declare methods:'
  merge: -1
  pgno: 132
- img_proc: true
  md: "commoncode.js\n\n```\nMeteor.methods({\n  'deletebook': function(id) {\n  \
    \  Books.remove({_id: id});\n  },\n  'dosomething': function(first, second) {\n\
    \    ...\n  }\n});\n```\n\nAnd here is how you would call those methods from client-side\
    \ events:\n\n```\nTemplate.books.events({\n  'click .deleteAction': function(e,\
    \ a) {\n    Meteor.call('deletebook', this._id);\n  },\n  'click .doAction': function(e,\
    \ a) {\n    var first = ...;\n    var seconcd = ...;\n    Meteor.call('dosomething',\
    \ first, second);\n  }\n});\n```"
  merge: -1
