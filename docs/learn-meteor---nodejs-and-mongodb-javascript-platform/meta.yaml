    \n# 8. 进一步探索\n\n# 8.1 MiniMongo：你甚至不需要 MongoDB\n\n正如我们之前看到的，`Mongo.Collection`\
    \ 允许你进行实时的、同步的、客户端**和**服务器端对 MongoDB 集合的访问。这很棒，但如果你需要一个简单的内存数据存储呢？嗯，你可以，并且你已经知道如何做。\n\
    \n当你创建一个 `Mongo.Collection` 时，它在客户端使用 MiniMongo 来缓存查询结果。好消息是，你可以单独创建一个 MiniMongo\
    \ 实例。只需使用 `null` 作为构造函数参数（而不是你通常提供的 MongoDB 集合名称）创建一个新的 `Mongo.Collection`，你就得到了一个内存中的\
    \ MiniMongo。此外，这个 MiniMongo 不像普通的 `Mongo.Collection` 那样在服务器和客户端之间同步：它只保留在你声明它的地方：在服务器端声明时保留在服务器端，在客户端声明时则保留在客户端。\n\
    \n总结一下，只需写：\n\n```\nvar store = new Meteor.Collection(null);\n```\n\n仅此而已。你现在可以[查询该集合](query\
    \ that collection)，使用 `find` 方法，并[使用更新方法](using update methods)（几乎）像更新 MongoDB\
    \ 集合一样更新它。\n\nMiniMongo 是一个响应式集合，这意味着显示来自 MiniMongo 集合数据的页面将在 MiniMongo 中持有的数据发生变化时立即更新。\n\
    \n使用仅客户端或仅服务器端的内存 MiniMongo 对于你存储临时数据的应用部分非常方便。对于持久性数据，请使用 [Mongo 存储的集合](Mongo-stored\
    \ collections) 的全部功能。也就是说，创建一个 `Mongo.Collection` 并提供 MongoDB 集合作为字符串参数。\n\n#\
