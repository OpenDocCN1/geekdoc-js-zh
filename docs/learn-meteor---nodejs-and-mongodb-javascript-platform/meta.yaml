    Your could change the `type` to `update`, and all you would need to do is provide
    the id of the document to be modified.


    Should you need to customize the generated form, you can use the `autoForm` template
    in lieu of the `quickForm`. You can then specify the fields and customize the
    HTML content. And if you need insert, update and delete forms to be shown as popups,
    there are several packages that will do just that in a breeze.


