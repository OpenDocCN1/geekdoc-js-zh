  md: "# npm\n\nnpm is a popular JavaScript package manager. Basically, a package\
    \ manager allows you to download a library into your application folder so you\
    \ can use it. Why not simply download it manually? Well, npm will also manage\
    \ dependencies (packages needed by that particular package) and download them\
    \ if needed. It will also allow you to manage versions and update packages painlessly.\n\
    \n# Spacebars\n\nSpacebars is the default syntax used to write Meteor templates.\
    \ It is derived from the [Handlebars](http://handlebarsjs.com)¹ syntax.\n\nSpacebars\
    \ is HTML with extensions. Extensions take the form of mustache tags like the\
    \ following:\n\n```\n{{#each product in products}}\n  <li>Buy {{product.name}}\
    \ now!</li>\n{{/each}}\n```\n\n> ¹ http://handlebarsjs.com"
  merge: -1
