  md: "```\nclient/client.js\nMeteor.setInterval(function() {\n  var currentDate =\
    \ new Date();\n  Session.set('now',\n    currentDate.toLocaleTimeString()\n  );\n\
    }, 1000);\n\nTemplate.timeDisplay.helpers({\n  currentTime: function() {\n   \
    \ return Session.get('now');\n  }\n});\n```\n\nLet's save it. If I look at my\
    \ browser again, I can see the time is refreshing. Again, you may not be very\
    \ impressed with that, since we could do the same with even less lines of jQuery\
    \ or plain JavaScript. That's because my example is too simple, that is, the result\
    \ is too simple for Meteor to shine.\n\nHowever, you can see a very interesting\
    \ thing about our code already: the `currentTime` helper doesn't state that it\
    \ has to refresh. All it does is get some value from a “Session” and return it.\
    \ A whole different part of the code is updating that “Session” value on a periodic\
    \ basis.\n\n# Session is a client-side storage\n\nSession is a place where you\
    \ can store key-value objects. It is global: stored on the client and available\
    \ to the whole application."
