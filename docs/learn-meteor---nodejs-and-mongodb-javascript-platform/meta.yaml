    \ the result is too simple for Meteor to shine.\n\nHowever, you can see a very\
    \ interesting thing about our code already: the `currentTime` helper doesn't state\
    \ that it has to refresh. All it does is get some value from a “Session” and return\
    \ it. A whole different part of the code is updating that “Session” value on a\
    \ periodic basis.\n\n# Session is a client-side storage\n\nSession is a place\
    \ where you can store key-value objects. It is global: stored on the client and\
