    ```\n\nMy message will be stored as a session variable so that it is reactive.\
    \ Here's the helper that returns the session value:\n\n# client/timeDisplay.js\n\
    \n```\nTemplate.messageDisplay.helpers({\n  sessionMessage: function() {\n   \
    \ return Session.get('message');\n  }\n});\n```\n\nNow, I want the message to\
