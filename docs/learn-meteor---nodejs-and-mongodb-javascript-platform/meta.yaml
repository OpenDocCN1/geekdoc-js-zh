    # 4.11 Data context


    When referring to a field in a Blaze syntax, it''s looked for in the current data
    context and helpers, as stated earlier. For instance, the following code will
    look for a `title` field in the current data context:


    ```

    <p>You are looking at {{title}}.</p>

    ```


    The data context can be provided using several tools:


    +   - *each* and *with* blocks that change the current data context;

    - *each* .. *in* and *let* blocks that add a field to the current data context;

    - template code (*onCreated, onRendered*), where you can add fields to the data
    context using the *this* field which refers to the current template instance.


    <sup>1</sup>http://docs.meteor.com/api/templates.html#eventmaps'
