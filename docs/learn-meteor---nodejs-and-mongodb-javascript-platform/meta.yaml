    \ comments)</li>\n  {{/each}}\n</ul>\n```\n\n# Explicit each - correct\n\n```\n\
    <h1>Comments</h1>\n<ul>\n  {{#each comment in comments}}\n    <li>{{comment.title}}\n\
    \      - by {{comment.author}}\n      (out of comments.length comments)</li>\n\
    \  {{/each}}\n</ul>\n```\n\nThis is not a real-life sample, since I want my samples\
    \ to be simple. However, just try and generate a table with dynamic columns using\
    \ two nested `each` statements and you'll be stuck if you choose the implicit\
    \ syntax.\n\nWhich one do I recommend? I guess it's clear that except for trivial\
    \ views, the explicit statement is more powerful, more maintainable, and even\
    \ more readable."
