    # 6.6 Navigation


    Chances are that your application is made of several pages. Those should be accessible
    through distinct URLs. Also, some data may be required on the client before displaying
    a page. For instance, you may want to make sure that a progress message is displayed
    before the home page while the news are being loaded.


    Router packages are in charge of that. There are several router packages available
    for Meteor, one of which is *iron:router*. It allows for client or server-side
    routing.


