    \n```\n<template name=\"layout\">\n  <div>\n    <a href=\"/\">Home</a>\n    <a\
    \ href=\"/time\">Time</a>\n    <a href=\"/time\">Admin</a>\n  </div>\n  <div>\n\
    \    {{>yield}}\n  </div>\n</template>\n```\n\n- Create a `routes.js` file in\
    \ the root folder of your application and add the following code to it:\n\n###\
    \ routes.js\n\n```\nRouter.configure({\n  layoutTemplate: 'layout'\n});\n\nRouter.route('/',\
    \ function () {\n  this.render('news');\n});\n\nRouter.route('/time', function\
    \ () {\n  this.render('timeDisplay');\n});\n```\n\n- Switch back to your browser\
