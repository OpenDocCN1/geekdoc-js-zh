    just by installing it. It hooks itself to the user management features of Meteor,
    which in turn allows us to hook it to practically any way of authenticating users,
    or use the default collection.


    The *houston:admin* package requires no configuration, but it can be customized
    to better suit your needs when needed. Using it is a simple process:


    +   1. Add it typing `meteor add houston:admin`

    2. Navigate to the `http://localhost:3000/admin` page

    3. Create an account and give it admin rights'
