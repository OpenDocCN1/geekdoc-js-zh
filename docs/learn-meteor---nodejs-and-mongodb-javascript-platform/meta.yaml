- md: "## Definitions\n\n## Bundling\n\nBundling is the process of combining in a\
    \ single file several JavaScript or CSS files. Since a browser is limited in the\
    \ amount of files it can get at at time from the server, and since each HTTP request\
    \ has overhead, bundling enables for faster load times on the client.\n\nBundling\
    \ is often done together with minification.\n\n## Minification\n\nThe process\
    \ of reducing the size of CSS and JavaScript files without altering their meaning.\
    \ This can be done by removing extra spaces and renaming local variables to shorter\
    \ names.\n\nMinification is done on the server during the build process, so that\
    \ the files provided to the client are smaller. That way, they get to the client\
    \ quicker, which means faster load times.\n\nMinification is often done together\
    \ with bundling.\n\n## npm\n\nnpm is a popular JavaScript package manager. Basically,\
    \ a package manager allows you to download a library into your application folder\
    \ so you can use it. Why not simply download it manually? Well, npm will also\
    \ manage dependencies (packages needed by that particular package) and download\
    \ them if needed. It will also allow you to manage versions and update packages\
    \ painlessly.\n\n## Spacebars\n\nSpacebars is the default syntax used to write\
    \ Meteor templates. It is derived from the [Handlebars](http://handlebarsjs.com)¹\
    \ syntax.\n\nSpacebars is HTML with extensions. Extensions take the form of mustache\
    \ tags like the following:\n\n```\n{{#each product in products}}\n  <li>Buy {{product.name}}\
    \ now!</li>\n{{/each}}\n```\n\n> ¹ http://handlebarsjs.com\n\n## A word from the\
    \ author\n\nI sincerely hope you enjoyed reading this book as much as I liked\
    \ writing it and that you quickly become proficient enough with Meteor.\n\nIf\
    \ you would like to get in touch you can use:\n\n- email: books@aweil.fr\n- Facebook:\
    \ https://facebook.com/learncollection\n\nIn case your project needs it, I'm also\
    \ available for speaking, teaching, consulting and coding. All around the world.\n\
    \nIf you liked this book, you probably saved a lot of time thanks to it. I'd be\
    \ very grateful if you took some minutes of your precious time to leave a comment\
    \ on the site where you purchased this book. Thanks a ton!\n\n## The Learn collection\n\
    \nThis book is part of the *Learn collection*. The *Learn collection* allows developers\
    \ to self-teach new technologies in a matter of days.\n\n### Published books\n\
    \n- [Learn ASP.NET MVC](http://tinyurl.com/h6hjwce)\n- [Learn Meteor](https://leanpub.com/learnmeteor)\n\
    \n### To be published in 2016\n\n- [Learn WPF MVVM](https://leanpub.com/learnwpf)\n\
    - Learn Knockout\n\n¹ http://tinyurl.com/h6hjwce\n² https://leanpub.com/learnmeteor\n\
    ³ https://leanpub.com/learnwpf"
  mdcn: "\n## 定义\n\n## 打包\n\n打包是将多个 JavaScript 或 CSS 文件合并到一个文件中的过程。由于浏览器从服务器获取文件的数量有限，并且每次\
    \ HTTP 请求都有开销，打包能够实现客户端更快的加载时间。\n\n打包通常与压缩一起进行。\n\n## 压缩\n\n在不改变文件含义的前提下，缩减 CSS\
    \ 和 JavaScript 文件大小的过程。这可以通过移除多余空格、将局部变量重命名为更短的名称来实现。\n\n压缩在构建过程中于服务器端完成，这样提供给客户端的文件体积更小。因此，文件能更快地传送到客户端，从而意味着更快的加载速度。\n\
    \n压缩通常与打包一起进行。\n\n## npm\n\nnpm 是一个流行的 JavaScript 包管理器。基本上，包管理器允许你将一个库下载到你的应用文件夹中，以便你可以使用它。为什么不直接手动下载呢？嗯，npm\
    \ 还会管理该特定包所需的依赖项（即该特定包所需的包），并在需要时下载它们。它还允许你轻松地管理版本和更新包。\n\n## Spacebars\n\nSpacebars\
    \ 是用于编写 Meteor 模板的默认语法。它源自 [Handlebars](http://handlebarsjs.com)¹ 语法。\n\nSpacebars\
