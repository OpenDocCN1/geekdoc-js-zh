- md: "appeared that Meteor could also meet the requirements for another client's\
    \ project, except that the requirements needed low-level network I/O. Turns out\
    \ Meteor allowed me to leverage Node.js in a breeze, and I had the first draft\
    \ running in hours.\n\nI love tools that make me productive for common tasks while\
    \ also allowing for greater power and customization when needed. Meteor does just\
    \ that, providing simple ways to answer most requirements of today's applications.\n\
    \n## 2.2 Why is Meteor so productive?\n\nMeteor makes writing applications a much\
    \ faster process than many other Javascript environments. Here are some of the\
    \ reasons why:\n\n- Everything a developer needs is installed in a breeze, on\
    \ any major OS (Linux, Windows, OS X);\n- JavaScript code on the server and client,\
    \ some of the code may even be shared between the two;\n- Native support for MongoDB\
    \ collections (if you don't know MongoDB we'll talk about it a bit later);\n-\
    \ Automated synchronization of the data between client and server;\n- Very little\
    \ code to write;\n- Most of the functionality a developer usually needs is provided\
    \ as easy-to-install packages;\n- A very helpful command-line utility;\n- Out-of-the-box\
    \ effortless minification and file combine;\n- Simple creation of packages;\n\
    - Integrated debugging of server code right in the browser;\n- Straightforward\
    \ unit-testing of created packages.\n\n## 2.3 Where is the catch?\n\nToo often\
    \ you invest time and energy in a technology stack, only to find out its drawbacks\
    \ a while later.\n\nAfter some extensive use, Meteor drawbacks came when deploying.\
    \ This is personal experience, but I was faced with two problems.\n\nFirst, as\
    \ long as you are willing to host your apps in Meteor's cloud solution (*Galaxy*),\
    \ everything goes well. If you want to host Meteor apps in your custom environment,\
    \ you'd better use a Linux machine. In which case things go quite smoothly when\
    \ you don't require a server farm.\n\nAs of writing, deploying to a production\
    \ Windows server was so difficult that I stopped in the process. That's a real\
    \ pain, to say the less. This is strange since the Meteor team worked hard to\
    \ bring excellent support for developing on a Windows environment. However, my\
    \ problems were solved when using Docker for deployment. Dockerized Meteor applications\
    \ can be deployed on any platform that support Docker, which means Linux, Windows\
    \ or cloud with no surprise.\n\nSecond, the applications deployed had performance\
    \ problems. There are many things that can be done in order to improve Meteor\
    \ application performance, but it's quite a disappointment to spend a lot of time\
    \ on performance improvements when the development stage was so quick.\n\nAll\
    \ in all, though you can learn Meteor very quickly (that's the purpose of this\
    \ book), bear in mind that fully understanding Meteor takes time. It's a quick\
    \ way to create applications thanks to bold assertions from the Meteor stack and\
    \ many things going on under the hood. You'll be able to create great Meteor applications\
    \ within a few days, but you'll need to invest some time to fully understand Meteor's\
    \ engine.\n\nWhat I mean is that most tasks that usually take hours of coding\
    \ will take minutes using Meteor, but during the first days be prepared to get\
    \ stuck several times on some documentation reading. All in all you should gain\
    \ a lot of time anyway, but you'll need to invest yourself in order to really\
    \ master the Meteor stack.\n\n# 3. Beginning with Meteor\n\n## 3.1 Setting up\
    \ your development machine\n\nYou can develop Meteor applications using a Windows,\
    \ Linux or OS X machine, and this book applies to all of them.\n\nIn order to\
    \ setup your machine, just point your browser to the install page¹.\n\nFor Windows\
    \ machines, there is an installer. On a Linux or OS X machine, just type:\n\n\
    ```\ncurl https://install.meteor.com/ | sh\n```\n\n## 3.2 Creating a meteor application\n\
    \nMeteor boosts your productivity as a developer. While most JavaScript development\
    \ environments rely on the help of scaffolding tools like Yeoman in order to hide\
    \ the fact that you need many files for even a basic application, Meteor needs\
    \ only three files to code your application.\n\n¹https://www.meteor.com/install\n\
    \nYou read well: three files. That's all there is to it. Of course you can use\
    \ a full folder hierarchy and as many files as needed to organize your application,\
    \ but that's optional. Simply put, Meteor applies a good coding pattern from the\
    \ start: KISS (keep it simple).\n\nAlthough you need only three files, Meteor\
    \ even makes that process easy. Let me show you how I create my *demos* application.\
    \ I'll use my demos to showcase the techniques I want you to learn, before you\
    \ get some practice for yourself in the exercises. You'll soon create your own\
    \ application, but for now please bear with me: sit and relax, and look at my\
    \ demonstration.\n\nI want my application to be called *demos* so I simply open\
    \ a command line and type:\n\n```\nmeteor create demos\ncd demos\n```\n\nThat's\
    \ it! The first line creates a \"demos\" directory and adds three files to it.\
    \ It also adds a `.meteor` folder, but it's just a local storage you won't need\
    \ to manage or go into. Time to run my application. Guess what? Yes, you're right:\
    \ Meteor makes it simple. Again, using my command-line I type:\n\n```\nmeteor\n\
    ```\n\nThat's a shortcut for `meteor run`. It builds my application, runs a local\
    \ MongoDB database server, and runs an HTTP server (using Node.js) that serves\
    \ the application.\n\nNow I can simply open a Web browser and type in the application\
    \ URL:\n\nhttp://localhost:3000\n\n> In case you don't like the default port (3000),\
    \ you can use the `--port` argument of the `meteor run` command.\n\nWhat do I\
    \ see in my browser? Well, not much but that's a good start:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_16_0.png)\n\
    \nAlright, I didn’t code anything yet but I already have a local database and\
    \ server that render an HTML page. Out of the box, that page doesn’t do more than\
    \ increase a counter when you click the button, but it won’t take long to fill\
    \ that page with data and functionality.\n\n## 3.3 What are those files?\n\nAs\
    \ mentioned earlier, there are currently three files that make up my application.\
    \ In fact, I could code my whole application using those three files. Of course,\
    \ for maintenance purposes it would be a good idea to split them up, but that’s\
    \ fully optional.\n\nLet’s take a look at those files. We have:\n\n- `demos.html`\
    \ contains the HTML that renders on the client;\n- `demos.js` contains code that\
    \ executes on the server and/or the client, and may be used by the HTML code;\n\
    - `demos.css` is, well, the CSS that applies to your HTML;\n\nSounds obvious?\
    \ Great! In fact it is, but we just overlooked a time-saving feature of Meteor:\
    \ you can mix server **and** client code in the same file. More about that later.\n\
    \n## 3.4 Meteor is listening to your code\n\nTime for some magic: if I change\
    \ whatever of those files, the result will automatically appear in my browser\
    \ after a few seconds. If you never used a good development stack this may not\
    \ feel so natural.\n\nWhen I typed the `meteor` command in my command-line, it\
    \ didn't just build the application and listen for HTTP queries. It also stays\
    \ there listening for file changes. When a change is detected it builds the application\
    \ again, and it also sends a message to the connected browsers so that they reload.\n\
    \nAs a developer, this means all you have to do is change your files, and your\
    \ browser refreshes. Best of all, this also works in production: any connected\
    \ browser to your application will automatically refresh with the latest version\
    \ whenever you publish a new version.\n\n## 3.5 The HTML file\n\nLet me open the\
    \ `demos.html` file. Here's what we find inside:\n\n```\n<head>\n  <title>demos</title>\n\
    </head>\n\n<body>\n  <h1>Welcome to Meteor!</h1>\n\n  {{> hello}}\n</body>\n\n\
    <template name=\"hello\">\n  <button>Click Me</button>\n  <p>You've pressed the\
    \ button {{counter}} times.</p>\n</template>\n```\n\nYou can see three base elements:\
    \ head, body and template. Those are the only three elements that can be at the\
    \ root of your HTML. The template element will be repeated, but any other HTML\
    \ element should be inside one of those three elements.\n\nLet's detail those\
    \ three elements.\n\n### head\n\nWhen Meteor runs your application, it does a\
    \ lot of stuff for you, including referencing the JavaScript and CSS file, plus\
    \ bundling and minification for those. For this, it will locate the head element\
    \ and add links to those generated resources there."
  mdcn: "\n看起来Meteor也能满足另一个客户项目的需求，只是该项目需要底层的网络I/O操作。事实证明，Meteor让我能够轻松利用Node.js，我在几个小时内就完成了初稿。\n\
    \n我喜欢那些能让我在处理常见任务时保持高效，同时又能在需要时提供更强大功能和自定义能力的工具。Meteor正是如此，它用简单的方式满足了当今应用的大多数需求。\n\
    \n## 2.2 为什么Meteor如此高效？\n\nMeteor让编写应用的过程比许多其他JavaScript环境都要快得多。以下是部分原因：\n\n-\
    \   开发者所需的一切都能在任何主流操作系统（Linux、Windows、OS X）上轻松安装；\n-   服务器和客户端都使用JavaScript代码，部分代码甚至可以在两者之间共享；\n\
    -   原生支持MongoDB集合（如果你不了解MongoDB，我们稍后会讨论）；\n-   客户端与服务器之间的数据自动同步；\n-   编写的代码量非常少；\n\
    -   开发者通常需要的大多数功能都以易于安装的包的形式提供；\n-   非常实用的命令行工具；\n-   开箱即用、轻松实现的文件压缩与合并；\n-  \
    \ 简单的包创建；\n-   直接在浏览器中集成服务器代码调试；\n-   创建的包可以进行直接的单元测试。\n\n## 2.3 有什么缺点吗？\n\n很多时候，你投入时间和精力使用一套技术栈，却在一段时间后才发现其缺点。\n\
    \n在大量使用之后，Meteor的缺点在部署时显现出来。这是我的个人经验，但我当时面临两个问题。\n\n首先，只要你愿意将应用托管在Meteor的云解决方案（*Galaxy*）上，一切都很顺利。如果你想在自定义环境中托管Meteor应用，最好使用Linux机器。在这种情况下，当你不需要服务器集群时，事情会相当顺利。\n\
    \n截至本文撰写时，部署到生产环境的Windows服务器非常困难，以至于我中途放弃了。这简直是痛苦不堪。这很奇怪，因为Meteor团队努力为Windows环境下的开发提供了出色的支持。然而，当我使用Docker进行部署时，我的问题得到了解决。经过Docker化的Meteor应用可以部署在任何支持Docker的平台上，这意味着Linux、Windows或云平台都不成问题。\n\
    \n其次，部署的应用存在性能问题。为了提高Meteor应用的性能可以做很多事情，但在开发阶段如此迅速的情况下，却要花费大量时间进行性能优化，这相当令人失望。\n\
    \n总而言之，尽管你可以非常快速地学习Meteor（这也是本书的目的），但请记住，完全理解Meteor是需要时间的。由于Meteor技术栈的“大胆断言”以及底层运行的许多机制，它提供了创建应用的快速途径。你可以在几天内创建出出色的Meteor应用，但你需要投入一些时间来完全理解Meteor的引擎。\n\
    \n我的意思是，大多数通常需要数小时编码的任务，使用Meteor只需几分钟，但在最初几天，要准备好在阅读文档时卡住几次。总之，无论如何你应该节省了大量时间，但你需要投入自己才能真正掌握Meteor技术栈。\n\
    \n# 3. 入门Meteor\n\n## 3.1 搭建你的开发机器\n\n你可以使用Windows、Linux或OS X机器开发Meteor应用，本书适用于所有这些系统。\n\
    \n要设置你的机器，只需将浏览器指向安装页面¹。\n\n对于Windows机器，有一个安装程序。在Linux或OS X机器上，只需输入：\n\n```\n\
    curl https://install.meteor.com/ | sh\n```\n\n## 3.2 创建Meteor应用\n\nMeteor提升了你作为开发者的生产力。虽然大多数JavaScript开发环境依赖像Yeoman这样的脚手架工具来隐藏即使是基本应用也需要许多文件的事实，但Meteor只需要三个文件就能编码你的应用。\n\
    \n¹https://www.meteor.com/install\n\n你没看错：三个文件。仅此而已。当然，你可以使用完整的文件夹层次结构和所需的任意多文件来组织你的应用，但这是可选的。简单来说，Meteor从一开始就应用了良好的编码模式：KISS（保持简单）。\n\
    \n尽管你只需要三个文件，Meteor甚至让这个过程变得更容易。让我向你展示我如何创建我的*demos*应用。我将用我的demos来展示我希望你学习的技术，之后你将在练习中亲自实践。你很快就会创建自己的应用，但现在请耐心听我说：坐下来放松，看看我的演示。\n\
    \n我希望我的应用叫做*demos*，所以我只需打开命令行并输入：\n\n```\nmeteor create demos\ncd demos\n```\n\
    \n就是这样！第一行创建了一个“demos”目录并向其中添加了三个文件。它还添加了一个`.meteor`文件夹，但这只是一个本地存储，你不需要管理或进入。是时候运行我的应用了。猜猜怎么着？是的，你猜对了：Meteor让它变得简单。同样，使用我的命令行，我输入：\n\
    \n```\nmeteor\n```\n\n这是`meteor run`的简写。它构建我的应用，运行一个本地MongoDB数据库服务器，并运行一个HTTP服务器（使用Node.js）来提供应用服务。\n\
    \n现在我可以简单地打开Web浏览器并输入应用URL：\n\nhttp://localhost:3000\n\n> 如果你不喜欢默认端口（3000），可以使用`meteor\
    \ run`命令的`--port`参数。\n\n我在浏览器里看到什么？嗯，不多，但这是一个好的开始：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_16_0.png)\n\
    \n好吧，我还没编写任何代码，但我已经有了一个渲染HTML页面的本地数据库和服务器。开箱即用的页面除了点击按钮时增加一个计数器外，别无他用，但用不了多久就能让这个页面充满数据和功能。\n\
    \n## 3.3 那些文件是什么？\n\n如前所述，目前构成我应用的共有三个文件。事实上，我完全可以用这三个文件编写整个应用。当然，出于维护目的，将它们拆开是个好主意，但这完全是可选的。\n\
    \n让我们看看这些文件。我们有：\n\n-   `demos.html` 包含在客户端渲染的HTML；\n-   `demos.js` 包含在服务器和/或客户端执行的代码，并可被HTML代码使用；\n\
    -   `demos.css` 是应用于你的HTML的CSS；\n\n听起来很显然？很好！事实上确实如此，但我们刚刚忽略了Meteor的一个节省时间的特性：你可以在同一个文件中混合编写服务器**和**客户端代码。稍后会详细介绍。\n\
    \n## 3.4 Meteor在监听你的代码\n\n见证一些魔法的时刻：如果我更改这些文件中的任何一个，结果会自动在几秒钟后出现在我的浏览器中。如果你从未使用过好的开发技术栈，这可能感觉不那么自然。\n\
    \n当我在命令行中输入`meteor`命令时，它不仅仅是构建应用并监听HTTP查询。它还会一直监听文件更改。当检测到更改时，它会再次构建应用，并向已连接的浏览器发送消息，让它们重新加载。\n\
    \n作为开发者，这意味着你所要做的就是更改你的文件，然后你的浏览器就会刷新。最棒的是，这在生产环境中同样有效：任何连接到你应用的浏览器，在你发布新版本时，都会自动刷新到最新版本。\n\
    \n## 3.5 HTML文件\n\n让我打开`demos.html`文件。我们在里面看到了什么：\n\n```\n<head>\n  <title>demos</title>\n\
    </head>\n\n<body>\n  <h1>Welcome to Meteor!</h1>\n\n  {{> hello}}\n</body>\n\n\
    <template name=\"hello\">\n  <button>Click Me</button>\n  <p>You've pressed the\
    \ button {{counter}} times.</p>\n</template>\n```\n\n你可以看到三个基本元素：head、body和template。这些是HTML根节点下仅有的三个元素。template元素会被重复使用，但任何其他HTML元素都应该放在这三个元素之一之内。\n\
    \n让我们详细看看这三个元素。\n\n### head\n\n当Meteor运行你的应用时，它会为你做很多事情，包括引用JavaScript和CSS文件，以及对它们进行打包和压缩。为此，它会定位head元素，并在其中添加指向这些生成资源的链接。\n"
