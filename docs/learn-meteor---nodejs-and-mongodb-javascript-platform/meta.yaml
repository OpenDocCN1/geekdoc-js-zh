  md: '# 8. Going further


    # 8.1 MiniMongo: you don’t even need MongoDB


    As we saw earlier, `Mongo.Collection` allows you to have real-time, synchronized,
    client **and** server access to MongoDB collections. This is great, but what if
    you need a simple in-memory store for data? Well, you can, and you already know
    how.


    When you create a `Mongo.Collection`, it uses MiniMongo on the client side in
    order to cache query results. The good news is that you can create a MiniMongo
    instance alone. Just create a new `Mongo.Collection` using `null` as the constructor
    parameter (instead of the MongoDB collection name that you would provide otherwise)
    and you get an in-memory MiniMongo. What''s more, this MiniMongo isn''t synchronized
    between the server and client like a normal `Mongo.Collection`: it remains only
    where you declared it: server-side when declared on the server and, well, client-side
    if declared on the client.


    To summarize, just write:


    ```

    var store = new Meteor.Collection(null);

    ```'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'And that''s all. You can now [query that collection](query that collection)
    using the `find` method, and update it [using update methods](using update methods)
    (almost) just like a MongoDB collection.


    MiniMongo is a reactive collection, which means that pages displaying data from
    a MiniMongo collection will get instantly updated when the data held in MiniMongo
    changes.


    Using client-only or server-only in-memory MiniMongo comes in handy for parts
    of your application where you store temporary data. For persistent data, use the
    full power of [Mongo-stored collections](Mongo-stored collections). That is, create
    a `Mongo.Collection` providing the MongoDB collection name as a string parameter.'
  merge: -1
  pgno: 117
