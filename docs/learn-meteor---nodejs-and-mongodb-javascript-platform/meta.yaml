    changes. When a change is detected it builds the application again, and it also
    sends a message to the connected browsers so that they reload.


    As a developer, this means all you have to do is change your files, and your browser
    refreshes. Best of all, this also works in production: any connected browser to
    your application will automatically refresh with the latest version whenever you
    publish a new version.


    # 3.5 The HTML file


    Let me open the `demos.html` file. Here''s what we find inside:'
