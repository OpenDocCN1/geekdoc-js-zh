    </template>\n```\n\n### routes.js\n\n```\nRouter.configure({\n  layoutTemplate:\
    \ 'mainLayout'\n});\n```\n\nMore information about iron router is available in\
    \ the iron router guide[^2].\n\n[^2]: http://iron-meteor.github.io/iron-router/\n\
    \n## 6.7 Exercise: Enable routing and create a layout\n\nAdd the `iron:router`\
    \ package to your application. Configure the following routes:\n\n| Path | Template\
