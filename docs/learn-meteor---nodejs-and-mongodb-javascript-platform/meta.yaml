  - '[PAGE 126]


    +   - The *autopublish* package, which ensures that all the collections you declared
    using `Mongo.Collection` are available to the client;

    - The *insecure* package, which allows the client to make any change to the collections.


    The *autopublish* package lowers security since it enables any client to get all
    of the documents in each collection.


    The *insecure* package lowers security because, even though your GUI allows only
    for certain changes, an evil developer could execute custom JavaScript code on
    the client that would make unexpected changes to your collections.


    Thus, you obviously want to remove the *autopublish* and *insecure* package before
    moving your application to production. Let''s see how.


    # Removing *autopublish*


    First, you need to remove the package. Just run the following command on your
    command line:


    ```

    meteor remove autopublish

    ```


    Now, you need to tell Meteor which data should be published and fetched. This
    is done in two steps:


    +   1. Use the `Meteor.publish` function on the server;

    2. Call the `Meteor.subscribe` function on the client.'
  - "[PAGE 127]\n\nFor both functions, you provide a publication name as a string,\
    \ that should be the same on the client and server (that’s how the subscription\
    \ is matched with the publication). You can also take parameters in the publish\
    \ method, that you provide in the subscribe method.\n\nTo keep things simple,\
    \ a subscribe should be done before you fetch documents from a collection on the\
    \ client, for instance before using the collection find method. A good place to\
    \ do so is in the onCreated event of a template where you use the data.\n\nLet’s\
    \ have a look at an example. Remember the code I used in order to display all\
    \ the books:\n\n```\ndemos.js\n\nBooks = new Meteor.Collection('books');\n\nif\
    \ (Meteor.isClient) {\n  Template.books.helpers({\n    books: function () {\n\
    \      return Books.find({});\n    }\n  });\n}\n```"
  - "[PAGE 128]\n\n# demos.html\n\n```\n<template name=\"books\">\n    <ul>\n    \
    \    {{#each book in books}}\n        <li>{{book.title}}</li>\n        {{/each}}\n\
    \    </ul>\n</template>\n```\n\nThis code was based on the *autopublish* package\
    \ being present. It won't work anymore once the *autopublish* package is removed.\
    \ Let's fix this. First, I have to publish the data used by that template. I'll\
    \ choose a name of `books-all` for this subscription. In a `server/publications.js`\
    \ file I write:\n\n# server/publications.js\n\n```\nMeteor.publish(\"books-all\"\
    , function () {\n  return Books.find({});\n});\n```\n\nNext, I subscribe to that\
    \ publication in the `onCreated` event of the `books` template. I create a `client/books.js`\
    \ file and add the following code:"
  - "[PAGE 129]\n\n# client/books.js\n\n```\nTemplate.books.onCreated(function() {\n\
    \  this.subscribe('books-all');\n});\n```\n\nNow, after those two steps the list\
    \ of books is displayed again.\nNote that I use `this.subscribe` instead of `Meteor.subscribe`.\
    \ This allows for the subscription to be gracefully disposed of when the template\
    \ is not being displayed.\nWhen using `iron:router`, you can have the router render\
    \ a waiting template while the subscription gets effectively available on the\
    \ client. For this, you provide a `waitOn` option that gets a subscription or\
    \ array of subscriptions:\n\n```\nRouter.route('/books', {\n  loadingTemplate:\
    \ 'loading',\n\n  waitOn: function () {\n    return Meteor.subscribe('books-all');\n\
    \  },\n\n  action: function () {\n    this.render('books');\n  }\n});\n```"
  - '[PAGE 130]


    # 8.5 Exercise: Remove the *autopublish* package


    Remove the *autopublish* package in order to make the application more secure.
    Note that the application pages do not display data anymore.


    Make sure to add the appropriate calls to *publish* and *subscribe* methods in
    order to display the data.


    ![](img/7ee67584836eb2d3d796446a7cd4a75d_130_0.png)


    # 8.6 Exercise solution


    +   - Point your browser to `http://localhost:3000`.

    - Leave your browser open and the `meteor` command-line running.

    - Open another command-line, navigate to your application directory and type:


    ```

    meteor remove autopublish

    ```


    +   - Switch back to your browser and note that news and products are not displayed
    anymore on the home page and *Products* page.

    - Create a `server/publications.js` file with the following code:'
  - "[PAGE 131]\n\n```\nserver/publications.js\nMeteor.publish(\"news-all\", function\
    \ () {\n  return News.find();\n});\nMeteor.publish(\"products-all\", function\
    \ () {\n  return Products.find();\n});\n```\n\n+   Create a client/subscriptions.js\
    \ file with the following code:\n\n```\nserver/subscriptions.js\nTemplate.news.onCreated(function()\
    \ {\n  this.subscribe('news-all');\n});\nTemplate.products.onCreated(function()\
    \ {\n  this.subscribe('products-all');\n});\nTemplate.store.onCreated(function()\
    \ {\n  this.subscribe('products-all');\n});\n```\n\n+   Switch back to your browser\
    \ and note that news and products are displayed again on the home page and *Products*\
    \ page.\n\n# Removing insecure\n\nFirst, you need to remove the package. Just\
    \ run the following command on your command line:"
  - '[PAGE 132]


    ```

    meteor remove insecure

    ```


    When you do so, a client can only perform limited update operations on the collections.
    For instance, it can update a document providing its _id field but it cannot remove
    documents or insert new ones. If you decided that the client code should not even
    be able to update a document providing its _id field, you can use the deny option
    when creating a Meteor.Collection.


    Now, only server code has access to the full range update operations. Since your
    client code needs to make updates too, you can enable them using methods. Methods
    are declared on the client and server (common code) with a name and parameters,
    and called from the client using the same name.


    > Methods are more powerful than a basic API call. When a method is called on
    the client, it is first evaluated on the client using the data that’s already
    cached by MiniMongo. That way, a user sees immediate results to their action.
    Then the method is evaluated on the server, and any change is pushed to the client
    so the user sees the real result taking into account full server-side data.


    Here is how you declare methods:'
  - "[PAGE 133]\n\ncommoncode.js\n\n```\nMeteor.methods({\n  'deletebook': function(id)\
    \ {\n    Books.remove({_id: id});\n  },\n  'dosomething': function(first, second)\
    \ {\n    ...\n  }\n});\n```\n\nAnd here is how you would call those methods from\
    \ client-side events:\n\n```\nTemplate.books.events({\n  'click .deleteAction':\
    \ function(e, a) {\n    Meteor.call('deletebook', this._id);\n  },\n  'click .doAction':\
    \ function(e, a) {\n    var first = ...;\n    var seconcd = ...;\n    Meteor.call('dosomething',\
    \ first, second);\n  }\n});\n```"
  - '[PAGE 134]


