- md: "## 5.9 Updating data with a Mongo.Collection\n\nThe `Mongo.Collection` class\
    \ offers update methods (almost) just like MongoDB. You surely remember that in\
    \ order to add a book I connected directly to the database command-line interface\
    \ and typed:\n\n```\ndb.books.insert({\n  title: 'Learn METEOR',\n  bought: true\n\
    });\n```\n\nNow, thanks to Meteor I could write the following JavaScript code\
    \ either on the client or the server:\n\n```\nBooks.insert({\n  title: 'Learn\
    \ METEOR',\n  bought: true\n});\n```\n\nWhen ran on the client it would in effect\
    \ add the book to the client cache of the collection (which makes it instantaneous),\
    \ then to the server collection inside MongoDB, then reflect any server change\
    \ to the client, so that the client takes into account any change that could arise\
    \ on the server.\n\nThe following methods are available (among others):\n\n* `insert(document)`\
    \ inserts a new document in the collection and returns its ID;\n* `remove(selector)`\
    \ removes all documents from a collection that match the provided selector;\n\
    * `update(selector, modifier)` updates all documents from a collection that match\
    \ the provided selector, using the provided modifier.\n\nFor the `update` method,\
    \ the modifier is a MongoDB modifier, or a document. A modifier contains ‘$’ fields,\
    \ while a document doesn’t. If you provide a document, it completely replaces\
    \ the existing documents. A modifier allows you to specify only some updates that\
    \ need to be done to the matching documents.\n\nSuppose I want to increase to\
    \ 15 the price of all the books whose price is less than 10. I can write:\n\n\
    ```\nBooks.update(\n    { price: { $lt: 10 } },\n    { $set: { price: 15 } }\n\
    );\n```\n\n> On the client side, there are limitations to which updates can be\
    \ done using the *insert*, *update* and *remove* methods. They can be somewhat\
    \ removed using the *allow* and *deny* methods of the *Mongo.Collection* class.\
    \ You can learn more about that [in the manual](http://docs.meteor.com/api/collections.html#Mongo-Collection-allow).\n\
    \n## 5.10 Exercise: Enable adding a piece of news\n\nInside the template named\
    \ “news”, add a new `input` element inside a `form` element. When the user types\
    \ a text and presses enter, make sure that a new document is added to the `news`\
    \ collection, with `title` fields that corresponds to the typed text.\n\nYour\
    \ application should look like the following:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_68_0.png)\n\
    \n## 5.11 Exercise solution\n\n* Leave your browser open and the `meteor` command-line\
    \ running.\n* In the `client/news.html` file, locate the following code:\n\n**client/news.html**\n\
    \n```\n<template name=\"news\">\n  <h3>News</h3>\n  <ul>\n    ...\n  </ul>\n</template>\n\
    ```\n\n* Replace that code with the following one :\n\n**client/news.html**\n\n\
    ```\n<template name=\"news\">\n  <h3>News</h3>\n  <ul>\n    ...\n  </ul>\n  <form>\n\
    \    <input type=\"text\" name=\"title\" placeholder=\"Title\" />\n  </form>\n\
    </template>\n```\n\n* Open the `client/client.js` file. Add the following code:\n\
    \n**client/client.js**\n\n```\nTemplate.news.events({\n  'submit form': function\
    \ (e) {\n    e.preventDefault();\n    var title = e.target.title.value;\n    News.insert({title:\
    \ title, created: new Date()});\n  }\n});\n```\n\nSwitch back to your browser\
    \ and make sure that you can add some piece of news by typing them in the newly\
    \ created input field.\n\n> **Meteor magic**\n>\n> As you already know, Meteor\
    \ ensures that any change made on the server is pushed to any connected client.\
    \ But don't take my word for it: you can now ensure it is true.\n>\n> Open two\
    \ browser windows using the following URL:\n> *http://localhost:3000*\n>\n> Add\
    \ a piece of news in one of the windows, it should appear instantly in the other.\
    \ Great, isn't it? And it would work exactly the same should you deploy that application\
    \ to a distant server.\n\n## 5.12 Exercise: Enable users to delete news\n\nInside\
    \ the template named “news”, next to each piece of news add a button. When the\
    \ user clicks that button, the corresponding piece of news should be deleted from\
    \ the database.\n\nYour application should look like the following:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_72_0.png)\n\
    \n## 5.13 Exercise solution\n\n* Leave your browser open and the `meteor` command-line\
    \ running.\n* In the `client/news.html` file, locate the following code:\n\n**client/news.html**\n\
    \n```\n<li>{{title}}</li>\n```\n\n* Replace that code with the following one :\n\
    \n**client/news.html**\n\n```\n<li>{{title}} <button class=\"removeAction\">x</button></li>\n\
    ```\n\n* The full news template should now be:\n\n**client/news.html**\n\n```\n\
    <template name=\"news\">\n    <h3>News</h3>\n    <ul>\n        {{#each news}}\n\
    \            <li>{{title}} <button class=\"removeAction\">x</button></li>\n  \
    \      {{/each}}\n    </ul>\n    <form>\n        <input type=\"text\" name=\"\
    title\" placeholder=\"Title\" />\n    </form>\n</template>\n```\n\n* Open the\
    \ `client/client.js` file. Locate the following code:\n\n**client/client.js**\n\
    \n```\nTemplate.news.events({\n  'submit form': function (e) {\n    ..\n  }\n\
    });\n```\n\n* Replace it with the following code:\n\n**client/client.js**\n\n\
    ```\nTemplate.news.events({\n  'submit form': function (e) {\n    ..\n  },\n \
    \ 'click .removeAction': function(e, a) {\n    News.remove({_id: this._id});\n\
    \  }\n});\n```\n\nSwitch back to your browser and make sure that you can delete\
    \ pieces of news by clicking the button on their right.\n\n## 6. Packages: admin\
    \ dashboard, navigation, validation, forms generation\n\n## 6.1 What are packages\n\
    \nUp to now, we’ve been manually coding our application. Meteor makes this part\
    \ fast and painless, but if you stop reading now you’ll find yourself repeating\
    \ the same kind of code in most of your applications.\n\nCreating user interfaces\
    \ for input, validating data, handling navigation, tracing and many other tasks\
    \ are not specific to one particular application. Their code can be factored and\
    \ reused into packages.\n\nYou may already know about the npm package manager\
    \ famous in the JavaScript community. Meteor being about JavaScript, we can sure\
    \ use npm and get access to its active and wide range of packages. Which is great,\
    \ however Meteor has its own package manager which provides packages specifically\
    \ written for Meteor. The advantage of Meteor-specific packages is that they know\
    \ of and benefit from all the tools that make Meteor so productive: client synchronized\
    \ database cache, isomorphic code, authentication, and lots of other Meteor assumptions.\n\
    \nMeteor's package manager is Atmosphere. It is made of a web site and integrated\
    \ as part of the Meteor command line.\n\n> Atmosphere is bound to be progressively\
    \ abandoned in favor of npm. As the Meteor guide [states](https://guide.meteor.com/atmosphere-vs-npm.html):\n\
    >\n> With the release of version 1.3, Meteor has full support for npm. In the\
    \ future, there will be a time when all packages will be migrated to npm, but\
    \ currently there are benefits to both systems.\n\nHowever, as of now, Atmosphere\
    \ is a recommended tool since it is both easy-to-use and productive tool.\n\n\
    [https://guide.meteor.com/atmosphere-vs-npm.html](https://guide.meteor.com/atmosphere-vs-npm.html)\n\
    \n## 6.2 Searching for and installing packages\n\nSearching for a package is done\
    \ using the [Atmosphere web site](https://atmospherejs.com/):\n\n[https://atmospherejs.com/](https://atmospherejs.com/)\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_77_0.png)\n\nSuppose I need to create\
    \ a REST API for CRUD operations on my collections. There are several packages\
    \ for that. Hopefully Atmosphere shows the number of stars and installs for each\
    \ package. Another useful information for selecting a package is the project activity\
    \ (on the package page): when was it last updated, and is it updated on a regular\
    \ basis? A quick search leads me to the *nimble:restivus* package:"
  mdcn: "\n## 5.9 使用 Mongo.Collection 更新数据\n\n`Mongo.Collection` 类提供的更新方法与 MongoDB\
    \ 几乎相同。你肯定记得，为了添加一本书，我曾直接连接到数据库命令行界面并输入：\n\n```\ndb.books.insert({\n  title: 'Learn\
    \ METEOR',\n  bought: true\n});\n```\n\n现在，得益于 Meteor，我可以在客户端或服务器端编写以下 JavaScript\
    \ 代码：\n\n```\nBooks.insert({\n  title: 'Learn METEOR',\n  bought: true\n});\n\
    ```\n\n在客户端运行时，它实际上会先将这本书添加到客户端的集合缓存中（这使其即时生效），然后再添加到 MongoDB 中的服务器集合，接着将服务器端的任何更改同步回客户端，从而让客户端能够考虑到服务器端可能发生的任何变化。\n\
    \n以下是可用（及其他）的一些方法：\n\n*   `insert(document)` 在集合中插入一个新文档，并返回其 ID；\n*   `remove(selector)`\
    \ 从集合中移除所有匹配给定选择器的文档；\n*   `update(selector, modifier)` 使用给定的修改器，更新集合中所有匹配给定选择器的文档。\n\
    \n对于 `update` 方法，修改器是一个 MongoDB 修改器，或者是一个文档。修改器包含 `$` 字段，而文档则不包含。如果你提供的是一个文档，它会完全替换现有的文档。修改器则允许你仅指定对匹配文档需要进行的部分更新。\n\
    \n假设我想将所有价格低于 10 的书的价格提高到 15。我可以编写：\n\n```\nBooks.update(\n    { price: { $lt:\
    \ 10 } },\n    { $set: { price: 15 } }\n);\n```\n\n> 在客户端，使用 *insert*、*update*\
    \ 和 *remove* 方法能执行的更新是有限制的。这些限制可以通过 *Mongo.Collection* 类的 *allow* 和 *deny* 方法来部分解除。你可以在[手册](http://docs.meteor.com/api/collections.html#Mongo-Collection-allow)中了解更多相关信息。\n\
    \n## 5.10 练习：启用添加新闻功能\n\n在名为 \"news\" 的模板内，在一个 `form` 元素内添加一个新的 `input` 元素。当用户输入文本并按下回车键时，确保将一个新的文档添加到\
    \ `news` 集合中，其中 `title` 字段对应于输入的文本。\n\n你的应用应该如下所示：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_68_0.png)\n\
    \n## 5.11 练习解答\n\n*   保持浏览器打开，并让 `meteor` 命令行继续运行。\n*   在 `client/news.html` 文件中，找到以下代码：\n\
    \n**client/news.html**\n\n```\n<template name=\"news\">\n  <h3>News</h3>\n  <ul>\n\
    \    ...\n  </ul>\n</template>\n```\n\n*   将其替换为以下代码：\n\n**client/news.html**\n\
    \n```\n<template name=\"news\">\n  <h3>News</h3>\n  <ul>\n    ...\n  </ul>\n \
    \ <form>\n    <input type=\"text\" name=\"title\" placeholder=\"Title\" />\n \
    \ </form>\n</template>\n```\n\n*   打开 `client/client.js` 文件。添加以下代码：\n\n**client/client.js**\n\
    \n```\nTemplate.news.events({\n  'submit form': function (e) {\n    e.preventDefault();\n\
    \    var title = e.target.title.value;\n    News.insert({title: title, created:\
    \ new Date()});\n  }\n});\n```\n\n切换回你的浏览器，确保你可以在新创建的输入框中输入并添加一些新闻。\n\n> **Meteor\
    \ 的魔法**\n>\n> 正如你已经知道的，Meteor 确保服务器端的任何更改都会推送到所有连接的客户端。但不要只听我说：你现在就可以验证这一点。\n\
    >\n> 使用以下 URL 打开两个浏览器窗口：\n> *http://localhost:3000*\n>\n> 在其中一个窗口中添加一条新闻，它应该会立即出现在另一个窗口中。很棒，不是吗？即使你将该应用部署到远程服务器，它的工作方式也完全相同。\n\
    \n## 5.12 练习：启用用户删除新闻功能\n\n在名为 \"news\" 的模板内，在每条新闻旁边添加一个按钮。当用户点击该按钮时，应从数据库中删除对应的新闻。\n\
    \n你的应用应该如下所示：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_72_0.png)\n\n## 5.13\
    \ 练习解答\n\n*   保持浏览器打开，并让 `meteor` 命令行继续运行。\n*   在 `client/news.html` 文件中，找到以下代码：\n\
    \n**client/news.html**\n\n```\n<li>{{title}}</li>\n```\n\n*   将其替换为以下代码：\n\n**client/news.html**\n\
    \n```\n<li>{{title}} <button class=\"removeAction\">x</button></li>\n```\n\n*\
    \   完整的新闻模板现在应如下所示：\n\n**client/news.html**\n\n```\n<template name=\"news\">\n\
    \    <h3>News</h3>\n    <ul>\n        {{#each news}}\n            <li>{{title}}\
    \ <button class=\"removeAction\">x</button></li>\n        {{/each}}\n    </ul>\n\
    \    <form>\n        <input type=\"text\" name=\"title\" placeholder=\"Title\"\
    \ />\n    </form>\n</template>\n```\n\n*   打开 `client/client.js` 文件。找到以下代码：\n\n\
    **client/client.js**\n\n```\nTemplate.news.events({\n  'submit form': function\
    \ (e) {\n    ..\n  }\n});\n```\n\n*   将其替换为以下代码：\n\n**client/client.js**\n\n```\n\
    Template.news.events({\n  'submit form': function (e) {\n    ..\n  },\n  'click\
    \ .removeAction': function(e, a) {\n    News.remove({_id: this._id});\n  }\n});\n\
    ```\n\n切换回你的浏览器，确保你可以通过点击新闻右侧的按钮来删除新闻。\n\n## 6. 包：管理面板、导航、验证、表单生成\n\n## 6.1 什么是包\n\
    \n到目前为止，我们一直在手动为应用编写代码。Meteor 让这部分工作变得快速而轻松，但如果你现在停止阅读，你会发现自己在大多数应用中都在重复类似的代码。\n\
    \n为输入创建用户界面、验证数据、处理导航、跟踪以及许多其他任务，并不是某个特定应用所独有的。它们的代码可以被提取并重用到**包**中。\n\n你可能已经听说过在\
    \ JavaScript 社区中著名的 npm 包管理器。既然 Meteor 是关于 JavaScript 的，我们当然可以使用 npm 并访问其活跃且广泛的包生态。这很棒，然而\
    \ Meteor 也有自己的包管理器，它提供了专门为 Meteor 编写的包。Meteor 特定包的优势在于，它们了解并受益于使 Meteor 如此高效的**所有工具**：客户端同步的数据库缓存、同构代码、认证以及许多其他\
    \ Meteor 预设。\n\nMeteor 的包管理器是 Atmosphere。它由一个网站组成，并作为 Meteor 命令行的一部分集成。\n\n> Atmosphere\
    \ 最终将被逐步淘汰，转而支持 npm。正如 Meteor 指南[所述](https://guide.meteor.com/atmosphere-vs-npm.html)：\n\
    >\n> 随着 1.3 版本的发布，Meteor 已完全支持 npm。未来，所有的包都将迁移到 npm，但目前两种系统各有利弊。\n\n然而，就目前而言，Atmosphere\
    \ 是一个推荐的工具，因为它既易于使用又高效。\n\n[https://guide.meteor.com/atmosphere-vs-npm.html](https://guide.meteor.com/atmosphere-vs-npm.html)\n\
    \n## 6.2 搜索和安装包\n\n搜索包是使用 [Atmosphere 网站](https://atmospherejs.com/)完成的：\n\n[https://atmospherejs.com/](https://atmospherejs.com/)\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_77_0.png)\n\n假设我需要为我的集合创建一个用于 CRUD\
    \ 操作的 REST API。有几个包可以实现这一点。值得庆幸的是，Atmosphere 显示了每个包的星标数和安装次数。选择包时另一个有用的信息是项目活跃度（在包页面上）：它最后一次更新是什么时候，是否定期更新？快速搜索让我找到了\
    \ *nimble:restivus* 这个包：\n"
