  md: '# There are way more reactive sources


    Session is just one of the reactive sources. There are more reactive sources,
    here are some of them:


    +   - ReactiveVar, which you can instantiate to store any value.

    - Database queries, that we’ll see a bit later, used to store data coming from
    the database.

    - Meteor.user, that holds information about the current user.

    - Meteor.status, that holds information about the client-server connection.


    Meteor packages will provide you with other reactive sources.


    # 4.9 Available blocks


    As we saw, there are several built-in block templates in Spacebars, apart from
    the ones you can define yourself. Let’s have a look at them.


    # if


    That one will display an enclosed block only if a condition is truthy. Like in
    the following example:'
  merge: -1
  pgno: 39
- img_proc: true
  md: "```\n<h1>Comments</h1>\n{{#if comments}}\n    <div>{{comments.length}} comments</div>\n\
    {{else}}\n    <div>No comment yet.</div>\n{{/if}}\n```\n\nNote that the else block\
    \ is optional. And remember: it’s all reactive. Helper variables you use from\
    \ the Blaze HTML code are reactive. Which means that the if block will go visible\
    \ or hidden at any time the comments value changes.\nAlso, there is a handy unless\
    \ block. If works exactly as the if block, except that the block goes hidden when\
    \ the condition is truthy - the exact opposite of a if block. We could rewrite\
    \ the above sample like that:\n\n```\n<h1>Comments</h1>\n{{#if comments}}\n  \
    \  <div>{{comments.length}} comments</div>\n{{/if}}\n{{#unless comments}}\n  \
    \  <div>No comment yet.</div>\n{{/unless}}\n```\n\n# each\n\nAn each block repeats\
    \ its contents as many times as necessary. You provide it with some collection,\
    \ and the enclosed block will be inserted as many times as there are elements."
  merge: -1
  pgno: 40
- img_proc: true
  md: "There are two ways to use the `each` block: implicit or explicit. Consider\
    \ the following examples:\n\n# Javascript for both examples\n\n```\nTemplate.commentsIndex.helpers({\n\
    \  comments: function() {\n    return [\n      { title='Some comment', author='Jane'\
    \ },\n      { title='Another one', author='Ted' }\n    ];\n  }\n});\n```\n\nWe\
    \ then have two ways to use it:\n\n# Implicit each\n\n```\n<h1>Comments</h1>\n\
    <ul>\n{{#each comments}}\n  <li>{{title}} - by {{author}}</li>\n{{/each}}\n</ul>\n\
    ```"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# Explicit each\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comment in comments}}\n\
    \    <li>{{comment.title}}\n      - by {{comment.author}}</li>\n  {{/each}}\n\
    </ul>\n```\n\nBoth ways yield the same result: two comments are displayed. The\
    \ difference is that the first one changes the data context against which the\
    \ inner block (<li> in that case) is evaluated.\n\nWhen using the first approach,\
    \ the data context of the inner block is the particular comment for which that\
    \ block is duplicated. That’s why we only state `title` inside the double mustache:\
    \ since the data context is a comment, we mean the `title` property of the current\
    \ comment object. Inside the inner block, I cannot reference the `comments` object\
    \ anymore, since it was in my parent context.\n\nOn contrary, when using the second\
    \ approach the data context of the inner block remains the same as the parent\
    \ data context. Only the `comment` variable contains the current comment.\n\n\
    On a first approach, the implicit syntax is tempting because it looks more simple.\
    \ The problem is that you loose the ability to refer to the parent context from\
    \ your inner block, which for real-life scenarios will often be limiting.\n\n\
    Consider a change to the above samples:"
  merge: -1
  pgno: 42
- img_proc: true
  md: "# Implicit each - doesn't work\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comments}}\n\
    \    <li>{{title}} - by {{author}}\n      (out of comments.length comments)</li>\n\
    \  {{/each}}\n</ul>\n```\n\n# Explicit each - correct\n\n```\n<h1>Comments</h1>\n\
    <ul>\n  {{#each comment in comments}}\n    <li>{{comment.title}}\n      - by {{comment.author}}\n\
    \      (out of comments.length comments)</li>\n  {{/each}}\n</ul>\n```\n\nThis\
    \ is not a real-life sample, since I want my samples to be simple. However, just\
    \ try and generate a table with dynamic columns using two nested `each` statements\
    \ and you'll be stuck if you choose the implicit syntax.\n\nWhich one do I recommend?\
    \ I guess it's clear that except for trivial views, the explicit statement is\
    \ more powerful, more maintainable, and even more readable."
