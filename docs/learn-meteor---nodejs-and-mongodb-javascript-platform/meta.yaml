- md: "Packages: admin dashboard, navigation, validation, forms generation\n\n72\n\
    \nOnce you find a package you simply add it through the command-line. For instance,\
    \ if I want to use the `nimble:restivus` package I simply type the following command:\n\
    \n```\nmeteor add nimble:restivus\n```\n\nYou can leave your meteor application\
    \ running and open a new command line in order to type that command.\n\nJust make\
    \ sure the current directory is the one of your application.\n\nIt's time to have\
    \ a look at some commonly used packages. That should help make you familiar with\
    \ Meteor's packages productivity boost, and you'll soon find yourself searching\
    \ through Atmosphere for an appropriate package once faced with a common task.\n\
    \n## 6.3 Back-office management\n\nThere will be several collections in our application.\
    \ Though the end-user interface will allow for most common interactions with the\
    \ collections, it would be nice to have a tool that allows for every CRUD operation\
    \ through a nice GUI. Admin packages are made for this.\n\nFor instance, the *houston:admin*\
    \ package provides us with a gorgeous admin GUI just by installing it. It hooks\
    \ itself to the user management features of Meteor, which in turn allows us to\
    \ hook it to practically any way of authenticating users, or use the default collection.\n\
    \nThe *houston:admin* package requires no configuration, but it can be customized\
    \ to better suit your needs when needed. Using it is a simple process:\n\n1. \
    \ Add it typing `meteor add houston:admin`\n2.  Navigate to the `http://localhost:3000/admin`\
    \ page\n3.  Create an account and give it admin rights\n\n> If you use another\
    \ account manager package or already created a user, you will simply be prompted\
    \ for confirmation that you want to make the current user an admin.\n\n## 6.4\
    \ Exercise: Create back-office for data management\n\nAdd the *houston:admin*\
    \ package to your application. Create a user and give it admin rights so you can\
    \ access the admin page. Make sure you can create, update and delete pieces of\
    \ news using the admin page.\n\nYour admin page should look like the following:\n\
    \n## 6.5 Exercise solution\n\n- Leave your browser open and the `meteor` command-line\
    \ running.\n- Open another command-line, navigate to your application directory\
    \ and type:\n\n```\nmeteor add houston:admin\n```\n\n- Once the \"houston:admin:\
    \ A zero-config Meteor Admin\" message is displayed, close the recently opened\
    \ command-line.\n- In your browser, navigate to the following URL: `http://localhost:3000/admin`\n\
    - Create an admin user account as prompted: fill-in the fields and click the “Create\
    \ account” button.\n- Click the “news” link on the left of the screen.\n- Double-click\
    \ the title of a piece of news and change it.\n- Click the “New news” button at\
    \ the top right of the page, and create a piece of news.\n\n## 6.6 Navigation\n\
    \nChances are that your application is made of several pages. Those should be\
    \ accessible through distinct URLs. Also, some data may be required on the client\
    \ before displaying a page. For instance, you may want to make sure that a progress\
    \ message is displayed before the home page while the news are being loaded.\n\
    \nRouter packages are in charge of that. There are several router packages available\
    \ for Meteor, one of which is *iron:router*. It allows for client or server-side\
    \ routing.\n\nTo begin with, we of course need to add the package using the command\
    \ line:\n\n```\nmeteor add iron:router\n```\n\nRoutes tell iron router what to\
    \ display according to the incoming URL. They are described in a client and server\
    \ JavaScript file, so for instance you can add them to a routes.js file in the\
    \ root folder.\n\nIn its simplest form, you can render a template for a given\
    \ route. In my previous examples I had templates named messagesDisplay and messagesList.\
    \ Suppose I want messagesList to be displayed in the root page of my application\
    \ and messagesDisplay to be available through the http://localhost:3000/message\
    \ URL. I can write:\n\n```\nRouter.route('/', function () {\n  this.render('messagesList');\n\
    });\n\nRouter.route('/message', function () {\n  this.render('messagesDisplay');\n\
    });\n```\n\nNow, we can either use HTML links or JavaScript to navigate to those\
    \ URLs:\n\n**HTML navigation**\n\n```\n<a href=\"/message\">See one message</a>\n\
    ```\n\n### JavaScript navigation\n\n```\nRouter.go('/message');\n```\n\nChances\
    \ are that the messagesDisplay template will expect a parameter stating which\
    \ message it should display. Routes can include parameters, and the render function\
    \ can add data to the data context of the template. So for instance I could rewrite\
    \ the /message route as such:\n\n```\nRouter.route('/message/:id', function ()\
    \ {\n    var id = this.params.id;\n    this.render('messagesDisplay',\n      \
    \  { data: { id: id } }\n    );\n});\n```\n\nBy default, the main application\
    \ body will be displayed on each page. But you can provide a common layout as\
    \ a template. Easy. Just create your layout as a template, then configure iron\
    \ router to use it for all routes, or choose the layout in each route. And don't\
    \ forget to remove the body (any HTML you have outside of template tags).\n\n\
    For instance, here are the layout and code to configure it for all pages. The\
    \ layout should include a yield directive, which states where the page rendering\
    \ should take place.\n\n### In any HTML file\n\n```\n<template name=\"mainLayout\"\
