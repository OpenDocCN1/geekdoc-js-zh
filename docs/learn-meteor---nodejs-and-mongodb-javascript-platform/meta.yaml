    # 6.1 What are packages


    Up to now, we’ve been manually coding our application. Meteor makes this part
    fast and painless, but if you stop reading now you’ll find yourself repeating
    the same kind of code in most of your applications.


    Creating user interfaces for input, validating data, handling navigation, tracing
    and many other tasks are not specific to one particular application. Their code
    can be factored and reused into packages.


    You may already know about the npm package manager famous in the JavaScript community.
    Meteor being about JavaScript, we can sure use npm and get access to its active
    and wide range of packages. Which is great, however Meteor has its own package
    manager which provides packages specifically written for Meteor. The advantage
    of Meteor-specific packages is that they know of and benefit from all the tools
    that make Meteor so productive:


    69'
