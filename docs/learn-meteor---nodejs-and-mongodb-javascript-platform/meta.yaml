  md: 'Alright, I didn’t code anything yet but I already have a local database and
    server that render an HTML page. Out of the box, that page doesn’t do more than
    increase a counter when you click the button, but it won’t take long to fill that
    page with data and functionality.


    # 3.3 What are those files ?


    As mentioned earlier, there are currently three files that make up my application.
    In fact, I could code my whole application using those three files. Of course,
    for maintenance purposes it would be a good idea to split them up, but that’s
    fully optional.


    Let’s take a look at those files. We have:


    +   - demos.html contains the HTML that renders on the client;

    - demos.js contains code that executes on the server and/or the client, and may
    be used by the HTML code;

    - demos.css is, well, the CSS that applies to your HTML;


    Sounds obvious? Great! In fact it is, but we just overlooked a time-saving feature
    of Meteor: you can mix server **and** client code in the same file. More about
    that later.'
