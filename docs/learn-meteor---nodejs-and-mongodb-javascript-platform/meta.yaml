- md: "## Explicit each\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comment in comments}}\n\
    \    <li>{{comment.title}}\n      - by {{comment.author}}</li>\n  {{/each}}\n\
    </ul>\n```\n\nBoth ways yield the same result: two comments are displayed. The\
    \ difference is that the first one changes the data context against which the\
    \ inner block (<li> in that case) is evaluated.\n\nWhen using the first approach,\
    \ the data context of the inner block is the particular comment for which that\
    \ block is duplicated. That’s why we only state `title` inside the double mustache:\
    \ since the data context is a comment, we mean the `title` property of the current\
    \ comment object. Inside the inner block, I cannot reference the `comments` object\
    \ anymore, since it was in my parent context.\n\nOn contrary, when using the second\
    \ approach the data context of the inner block remains the same as the parent\
    \ data context. Only the `comment` variable contains the current comment.\n\n\
    On a first approach, the implicit syntax is tempting because it looks more simple.\
    \ The problem is that you loose the ability to refer to the parent context from\
    \ your inner block, which for real-life scenarios will often be limiting.\n\n\
    Consider a change to the above samples:\n\n## Implicit each - doesn't work\n\n\
    ```\n<h1>Comments</h1>\n<ul>\n  {{#each comments}}\n    <li>{{title}} - by {{author}}\n\
    \      (out of comments.length comments)</li>\n  {{/each}}\n</ul>\n```\n\n## Explicit\
    \ each - correct\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comment in comments}}\n\
    \    <li>{{comment.title}}\n      - by {{comment.author}}\n      (out of comments.length\
    \ comments)</li>\n  {{/each}}\n</ul>\n```\n\nThis is not a real-life sample, since\
    \ I want my samples to be simple. However, just try and generate a table with\
    \ dynamic columns using two nested `each` statements and you'll be stuck if you\
    \ choose the implicit syntax.\n\nWhich one do I recommend? I guess it's clear\
    \ that except for trivial views, the explicit statement is more powerful, more\
    \ maintainable, and even more readable.\n\n## Some more\n\nThere are other blocks\
    \ and you can define your own blocks. For instance, a `let` block lets you define\
    \ a new variable in your data context. As a developer you know that the most important\
    \ tools are loops and conditional execution, which is what `each` and `if` blocks\
    \ provide. Let's keep things simple: now we know the necessary blocks.\n\n## 4.10\
    \ Template events\n\nWe are now able to display stuff, and display it in a reactive\
    \ way. Which means our users will always see up-to-date information. Now, wouldn't\
    \ it be nice if they could interact with that information? Alright, it's not just\
    \ nice, it's necessary: if we can't get users to act on their data, we might as\
    \ well look for another job now.\n\nFor user interaction, we can write event handlers\
    \ just like we wrote helpers. Helpers are for displaying information, events are\
    \ for user interaction. Let's suppose I want to display a message to the user\
    \ and change it whenever the user clicks a button. Here's the HTML (well, Blaze\
    \ HTML):\n\n### client/timeDisplay.html\n\n```\n<template name=\"messageDisplay\"\
    >\n  <p>Message: {{sessionMessage}}</p>\n  <button>Be nice</button>\n</template>\n\
    ```\n\nMy message will be stored as a session variable so that it is reactive.\
    \ Here's the helper that returns the session value:\n\n### client/timeDisplay.js\n\
    \n```\nTemplate.messageDisplay.helpers({\n  sessionMessage: function() {\n   \
    \ return Session.get('message');\n  }\n});\n```\n\nNow, I want the message to\
    \ change whenever the user clicks the button. So I simply add an event handler\
    \ for that:\n\n### client/timeDisplay.js\n\n```\nTemplate.messageDisplay.helpers({\n\
    \    ...\n});\n\nTemplate.messageDisplay.events({\n    'click': function () {\n\
    \        Session.set('message', 'Hello!');\n    }\n});\n```\n\nThis event handler\
    \ tells Meteor that whenever a `click` event is raised from the `messageDisplay`\
    \ template, the code inside the function should be executed. The code I wrote\
    \ changes a session variable, so the `sessionMessage` helper that relies on that\
    \ session variable is evaluated again and the HTML is updated.\n\nThis is what\
    \ the user sees in their browser:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_46_0.png)\n\
    \nAnd this is what they see after clicking the button:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_47_0.png)\n\
    \nNow, how about adding a second button? If I do so, both buttons will raise the\
    \ `click` event so I need a way to differentiate them. Fortunately, event handlers\
    \ accept a CSS selector. So I can add an `id` or `class` to my HTML elements and\
    \ use it in the event handler selector. I personally prefer to use `class` since\
    \ `id` cannot be repeated. And who knows: my template may be used several time\
    \ in the same page later on.\n\nSo here's my updated HTML with two buttons and\
    \ CSS classes:\n\n### client/timeDisplay.html\n\n```\n<template name=\"messageDisplay\"\
    >\n  <p>Message: {{sessionMessage}}</p>\n  <button class=\"nice\">Be nice</button>\n\
    \  <button class=\"cute\">Be cute</button>\n</template>\n```\n\nAnd the updated\
    \ event handlers:\n\n### client/timeDisplay.js\n\n```\nTemplate.messageDisplay.helpers({\n\
    \  ...\n});\n\nTemplate.messageDisplay.events({\n  'click .nice': function ()\
    \ {\n    Session.set('message', 'Hello!');\n  },\n  'click .cute': function ()\
    \ {\n    Session.set('message', 'I love you.');\n  }\n});\n```\n\nNow each button\
    \ displays a different message.\nOf course, you can add as many event handlers\
    \ as you want to a template, differentiating them using the event name and CSS\
    \ selectors. What's more, when you write an event handler, your function can receive\
    \ the event as parameter. More information in the Meteor documentation<sup>1</sup>.\n\
    \n## 4.11 Data context\n\nWhen referring to a field in a Blaze syntax, it's looked\
    \ for in the current data context and helpers, as stated earlier. For instance,\
    \ the following code will look for a `title` field in the current data context:\n\
    \n```\n<p>You are looking at {{title}}.</p>\n```\n\nThe data context can be provided\
    \ using several tools:\n\n+   - *each* and *with* blocks that change the current\
    \ data context;\n- *each* .. *in* and *let* blocks that add a field to the current\
    \ data context;\n- template code (*onCreated, onRendered*), where you can add\
    \ fields to the data context using the *this* field which refers to the current\
    \ template instance.\n\n<sup>1</sup>http://docs.meteor.com/api/templates.html#eventmaps\n\
    \n# # I need you, super-hero !\n\nThank you so much for reading this book. I do\
    \ hope that it helps you understand and get confident with Meteor.\n\nAs a reader,\
    \ you are kind of a super-hero: you gain the power to create Web applications\
    \ using Meteor and make the Web a better place.\n\nGuess what? You have another\
    \ superpower: to rate this book on the site where you purchased it. You may feel\
    \ it's nothing, but it is super important for auto-edited books like this one.\
    \ Please, take some minutes of your precious time to rate this book.\n\nAs a way\
    \ to thank you, I'd like to offer you my upcoming book. Just drop me an email\
    \ at books@aweil.com with a link to your rating, and you'll get my next book for\
    \ free, before it is even published. Plus all my gratitude.\n\n# # 5. Managing\
    \ data from a MongoDB database\n\n## 5.1 What is MongoDB?\n\nWe're going to code\
    \ an application, right? Most applications need to store data on some server in\
    \ a way that is persistent and may be shared across all the users. Meteor chose\
    \ to include MongoDB for that purpose, and is reportedly working on including\
    \ other database engines.\n\nMongoDB is very popular as a *no-SQL* database engine.\
    \ Among the reasons that make it so popular is the fact that it works with a document\
    \ format that's very close to JSON.\n\nBy default, MongoDB will not force you\
    \ to use any schema, so you can simply store and read your data as needed. Which\
    \ is great for getting your application ready as fast as possible.\n\nSure, you'll\
    \ probably need some schema that your data should respect. Don't worry: that part\
    \ will be covered extensively (and easily) by Meteor, as you'll learn [later in\
    \ this book](#).\n\n## 5.2 Collections\n\nIn a MongoDB database you define collections,\
    \ which are much like tables in relational databases. Except that collections\
    \ can contain objects with different structures, and that those objects may have\
    \ object or array properties. If you want to feel like you are using a relational\
    \ database, just make sure that each object in a given collection has similar\
    \ properties.\n\nMeteor provides seamless support for MongoDB which we're going\
    \ to learn very soon. However, you can always access the MongoDB database directly,\
    \ from your command-line.\n\nIn my command line, I can type the following:\n\n\
    ```\nmeteor mongo\n```\n\nNow all of my commands go to the MongoDB Node.JS engine,\
    \ so I can issue direct JavaScript commands in order to manage the database. For\
    \ instance, let's add an object describing a book to a collection named `books`:\n\
    \n```\ndb.books.insert({\n    title: 'Learn METEOR',\n    bought: true\n});\n\
    ```\n\nThis statement creates the collection in case it doesn't exist, and adds\
    \ the object to it."
  mdcn: "\n## 显式 each\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comment in comments}}\n\
    \    <li>{{comment.title}}\n      - by {{comment.author}}</li>\n  {{/each}}\n\
    </ul>\n```\n\n两种方式产生相同的结果：都显示两条评论。区别在于，第一种方式改变了内部块（这里是 `<li>`）求值时所依据的数据上下文。\n\n\
    使用第一种方式时，内部块的数据上下文是当前正在被复制的那个特定评论对象。这就是为什么我们在双花括号内只写了 `title`：因为数据上下文是一个评论对象，我们指的是当前评论对象的\
    \ `title` 属性。在内部块内部，我不能再引用 `comments` 对象了，因为它属于父级上下文。\n\n相反，使用第二种方式时，内部块的数据上下文与父级数据上下文保持相同。只有\
    \ `comment` 变量包含了当前评论。\n\n乍一看，隐式语法因其更简单而颇具吸引力。问题在于，你从内部块中失去了引用父级上下文的能力，这在实际应用场景中常常会成为限制。\n\
    \n考虑对上面示例的修改：\n\n## 隐式 each - 不可用\n\n```\n<h1>Comments</h1>\n<ul>\n  {{#each comments}}\n\
    \    <li>{{title}} - by {{author}}\n      (out of comments.length comments)</li>\n\
    \  {{/each}}\n</ul>\n```\n\n## 显式 each - 正确\n\n```\n<h1>Comments</h1>\n<ul>\n\
    \  {{#each comment in comments}}\n    <li>{{comment.title}}\n      - by {{comment.author}}\n\
    \      (out of comments.length comments)</li>\n  {{/each}}\n</ul>\n```\n\n这不是一个真实的示例，因为我希望我的示例保持简单。然而，请尝试使用两个嵌套的\
    \ `each` 语句来生成一个动态列的表格，如果你选择隐式语法，你就会陷入困境。\n\n我推荐哪种方式？我想很明显，除了最简单的视图之外，显式语句更强大、更易于维护，甚至更具可读性。\n\
    \n## 还有一些\n\n还有其他块，你也可以定义自己的块。例如，`let` 块允许你在数据上下文中定义一个新变量。作为开发者，你知道最重要的工具是循环和条件执行，而这正是\
    \ `each` 和 `if` 块提供的功能。让我们保持简单：现在我们已经了解了必要的块。\n\n## 4.10 模板事件\n\n我们现在能够显示内容，并且是以一种响应式的方式显示。这意味着我们的用户将始终看到最新的信息。那么，如果他们能与这些信息交互，岂不是更好？好吧，这不仅仅是好，而且是必要的：如果我们无法让用户对其数据采取行动，那我们不如现在就去找另一份工作。\n\
    \n对于用户交互，我们可以像编写辅助函数一样编写事件处理器。辅助函数用于显示信息，事件用于用户交互。假设我想向用户显示一条消息，并在用户点击按钮时更改它。这是\
    \ HTML（嗯，Blaze HTML）：\n\n### client/timeDisplay.html\n\n```\n<template name=\"\
    messageDisplay\">\n  <p>Message: {{sessionMessage}}</p>\n  <button>Be nice</button>\n\
    </template>\n```\n\n我的消息将存储为一个会话变量，以便它具有响应性。这是返回该会话值的辅助函数：\n\n### client/timeDisplay.js\n\
    \n```\nTemplate.messageDisplay.helpers({\n  sessionMessage: function() {\n   \
    \ return Session.get('message');\n  }\n});\n```\n\n现在，我希望消息在用户每次点击按钮时都发生更改。所以我只需为它添加一个事件处理器：\n\
    \n### client/timeDisplay.js\n\n```\nTemplate.messageDisplay.helpers({\n    ...\n\
    });\n\nTemplate.messageDisplay.events({\n    'click': function () {\n        Session.set('message',\
    \ 'Hello!');\n    }\n});\n```\n\n这个事件处理器告诉 Meteor，每当从 `messageDisplay` 模板触发一个\
    \ `click` 事件时，就执行函数内部的代码。我编写的代码更改了一个会话变量，因此依赖于该会话变量的 `sessionMessage` 辅助函数会重新求值，HTML\
    \ 也会随之更新。\n\n这是用户在浏览器中看到的：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_46_0.png)\n\
    \n这是点击按钮后他们看到的：\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_47_0.png)\n\n那么，添加第二个按钮怎么样？如果我这样做，两个按钮都会触发\
    \ `click` 事件，所以我需要一种区分它们的方法。幸运的是，事件处理器接受 CSS 选择器。因此，我可以为我的 HTML 元素添加 `id` 或 `class`，并在事件处理器选择器中使用它。我个人更喜欢使用\
    \ `class`，因为 `id` 不能重复。而且谁知道呢：我的模板以后可能会在同一个页面中多次使用。\n\n所以这是我更新后的 HTML，包含两个按钮和\
    \ CSS 类：\n\n### client/timeDisplay.html\n\n```\n<template name=\"messageDisplay\"\
    >\n  <p>Message: {{sessionMessage}}</p>\n  <button class=\"nice\">Be nice</button>\n\
    \  <button class=\"cute\">Be cute</button>\n</template>\n```\n\n以及更新后的事件处理器：\n\
    \n### client/timeDisplay.js\n\n```\nTemplate.messageDisplay.helpers({\n  ...\n\
    });\n\nTemplate.messageDisplay.events({\n  'click .nice': function () {\n    Session.set('message',\
    \ 'Hello!');\n  },\n  'click .cute': function () {\n    Session.set('message',\
    \ 'I love you.');\n  }\n});\n```\n\n现在每个按钮显示不同的消息。\n当然，你可以为一个模板添加任意数量的事件处理器，通过事件名称和\
    \ CSS 选择器来区分它们。更重要的是，当你编写事件处理器时，你的函数可以接收事件作为参数。更多信息请参阅 Meteor 文档<sup>1</sup>。\n\
    \n## 4.11 数据上下文\n\n如前所述，在 Blaze 语法中引用一个字段时，它会在当前数据上下文和辅助函数中查找。例如，以下代码将在当前数据上下文中查找\
    \ `title` 字段：\n\n```\n<p>You are looking at {{title}}.</p>\n```\n\n数据上下文可以使用以下几种工具提供：\n\
    \n+   - *each* 和 *with* 块，它们改变当前数据上下文；\n- *each* .. *in* 和 *let* 块，它们向当前数据上下文添加字段；\n\
    - 模板代码（*onCreated, onRendered*），你可以在其中使用 *this* 字段（指向当前模板实例）向数据上下文添加字段。\n\n<sup>1</sup>http://docs.meteor.com/api/templates.html#eventmaps\n\
    \n# # 我需要你，超级英雄！\n\n非常感谢你阅读这本书。我确实希望它能帮助你理解并建立对 Meteor 的信心。\n\n作为一名读者，你某种程度上也是一位超级英雄：你获得了使用\
    \ Meteor 创建 Web 应用程序的力量，并让网络变得更好。\n\n猜怎么着？你还有另一种超能力：在你购买这本书的网站上为它评分。你可能觉得这没什么，但对于像这样自动出版的书籍来说，这超级重要。请花几分钟宝贵的时间为本书评分。\n\
    \n作为感谢，我想向你提供我即将出版的新书。只需给我发送一封电子邮件至 books@aweil.com，并附上你的评分链接，你就能在出版之前免费获得我的下一本书。以及我所有的感激之情。\n\
    \n# # 5. 管理来自 MongoDB 数据库的数据\n\n## 5.1 什么是 MongoDB？\n\n我们将要编写一个应用程序，对吧？大多数应用程序需要以一种持久化的方式在某个服务器上存储数据，并且这些数据可以被所有用户共享。Meteor\
    \ 为此选择了包含 MongoDB，据报道正在研究包含其他数据库引擎。\n\nMongoDB 作为一种 *no-SQL* 数据库引擎非常受欢迎。使其如此受欢迎的原因之一是它使用一种非常接近\
    \ JSON 的文档格式。\n\n默认情况下，MongoDB 不会强制你使用任何模式，因此你可以根据需要简单地存储和读取数据。这对于尽快让应用程序准备就绪非常有利。\n\
    \n当然，你可能需要一些你的数据应该遵守的模式。别担心：这部分内容将由 Meteor 轻松而广泛地涵盖，正如你将在[本书后面](#)学到的那样。\n\n##\
    \ 5.2 集合\n\n在 MongoDB 数据库中，你定义集合，它们非常类似于关系数据库中的表。只是集合可以包含具有不同结构的对象，并且这些对象可以具有对象或数组属性。如果你想感觉自己在使用关系数据库，只需确保给定集合中的每个对象具有相似的属性即可。\n\
    \nMeteor 对 MongoDB 提供了无缝支持，我们很快就会学习。但是，你始终可以从命令行直接访问 MongoDB 数据库。\n\n在我的命令行中，我可以输入以下内容：\n\
    \n```\nmeteor mongo\n```\n\n现在我所有的命令都发送到 MongoDB Node.JS 引擎，因此我可以发出直接的 JavaScript\
    \ 命令来管理数据库。例如，让我们向一个名为 `books` 的集合中添加一个描述书籍的对象：\n\n```\ndb.books.insert({\n  \
    \  title: 'Learn METEOR',\n    bought: true\n});\n```\n\n此语句在集合不存在时创建它，并将对象添加到其中。\n"
