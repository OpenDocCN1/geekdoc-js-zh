    Template.commentsIndex.helpers({\n  comments: function() {\n    return [\n   \
    \   { title='Some comment', author='Jane' },\n      { title='Another one', author='Ted'\
    \ }\n    ];\n  }\n});\n```\n\nWe then have two ways to use it:\n\n# Implicit each\n\
    \n```\n<h1>Comments</h1>\n<ul>\n{{#each comments}}\n  <li>{{title}} - by {{author}}</li>\n\
