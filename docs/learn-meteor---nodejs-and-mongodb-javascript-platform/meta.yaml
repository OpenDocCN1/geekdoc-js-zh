    \ },\n  price: { $lt: 10 }\n});\n```\n\nYou can find the whole query syntax reference\
    \ in the [MongoDB reference](https://docs.mongodb.com/manual/reference/operator/query/)¹.\n\
    \n# 5.9 Updating data with a Mongo.Collection\n\nThe `Mongo.Collection` class\
    \ offers update methods (almost) just like MongoDB. You surely remember that in\
