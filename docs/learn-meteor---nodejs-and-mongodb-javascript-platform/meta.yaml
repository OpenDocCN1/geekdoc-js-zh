    \ CRUD 操作，那将是极好的。管理类软件包正是为此而生的。\n\n例如，*houston:admin* 软件包仅通过安装就能为我们提供一个精美的管理界面。它与\
    \ Meteor 的用户管理功能挂钩，这反过来又使我们能够将其与几乎任何用户认证方式或默认集合集成。\n\n*houston:admin* 软件包无需配置，但必要时可以根据你的需求进行定制。使用它是一个简单的过程：\n\
