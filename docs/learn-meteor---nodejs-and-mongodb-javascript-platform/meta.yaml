  md: '# 4. Blaze, Spacebars and reactivity


    # 4.1 Spacebars


    The mustache, or double brace syntax {{ ... }} is due to the fact that Meteor
    uses Spacebars as a view engine.


    # What if I prefer Angular or React?


    Using Spacebars is no obligation and you can use another view engine. There are
    Meteor packages that allow you to use Angular, Angular2, React or Knockout.


    This book will stick to the default Spacebars syntax since we get it out of the
    box.


    # Spacebars basics


    As you saw, Spacebars is HTML on steroids. There are three main types of Spacebars
    blocks you can insert:


    +   - `{{someValue}}` will evaluate `someValue` and render its content as text.
    More about that later;

    - `{{> templateName}}` will insert a template named `templateName`, just like
    we saw above;'
  merge: -1
  pgno: 26
- img_proc: true
  md: "+   - {{#block}}Your HTML content{{/block}} will insert a template named block\
    \ and provide the inner HTML to that template. There are built-in block templates\
    \ that we'll see later like if or each.\n\n# 4.2 Where does the data come from?\n\
    \nOnce inside Spacebars' mustaches, you'll often need data. Consider the following\
    \ code:\n\n```\n<div>You have {{messagesCount}} messages.</div>\n{{#if hasMessages}}\n\
    \  {{> messagesList data=messages}}\n{{/if}}\n```\n\nIn that code, we reference\
    \ three values: messagesCount, hasMessages and messages. You must provide those\
    \ values. Spacebars will look for it in the current context (more about this later),\
    \ and then as helpers. Let's look at helpers.\n\n# 4.3 Helpers\n\nIn the JavaScript\
    \ file, I can add helpers that provide data for the view. That is, data that can\
    \ be accessed from the Spacebars syntax in my HTML file.\n\nIn order to provide\
    \ a value, we simply use the following syntax:"
  merge: -1
  pgno: 27
- img_proc: true
  md: "```\nTemplate.templateName.helpers({\n  someValue: function() {\n    return\
    \ ...;\n  },\n  someOtherValue: function(param1, param2) {\n    return ...;\n\
    \  },\n});\n```\n\nThose helpers are readily available in my HTML file, so I could\
    \ write:\n\n```\n<div>Here's a value: {{someValue}},\nand another one: {{someOtherValue\
    \ 'first param' 'second one'}}</div>\n```\n\nNow let's look again at my previous\
    \ example, this time writing the helpers.\n\n```\nTemplate.messagesDisplay.helpers({\n\
    \  messagesCount: function() {\n    return 2;\n  },\n  hasMessages: function()\
    \ {\n    return true;\n  },\n  messages: function(param1, param2) {\n    return\
    \ ['Hello', 'Important message'];\n  },\n});\n```"
  merge: -1
  pgno: 28
- img_proc: true
  md: "Blaze, Spacebars and reactivity\n\n23\n\n# demos.html\n\n```\n<template name=\"\
    messagesDisplay\">\n  <div>You have {{messagesCount}} messages.</div>\n  {{#if\
    \ hasMessages}}\n    {{> messagesList data=messages}}\n  {{/if}}\n</template>\n\
    <template name=\"messagesList\">\n  <div>This one needs to be coded...</div>\n\
    </template>\n```\n\n# 4.4 Client and server code\n\nWhat you write in the JavaScript\
    \ files will be executed both on the client and the server. That can be very practical:\
    \ much of the Meteor productivity comes from the fact that we can share the code\
    \ that describes data and its shape in a single place and have it executed both\
    \ on the client and the server.\n\nBut sometimes your JavaScript code should be\
    \ executed only on the server or the client. For instance, my templates need to\
    \ be defined on the client only. There are two ways to achieve this.\n\n# Execute\
    \ on server or client - testing in JavaScript\n\nYou can test the value of `Meteor.isClient`\
    \ or `Meteor.isServer`, which return boolean values."
