- md: "# Learn Meteor\n\nNode.js and MongoDB JavaScript platform\n\n# Learn Meteor\
    \ - Node.js and MongoDB JavaScript platform\n\nBe ready for coding away next week\
    \ using Meteor\n\nArnaud Weil\n\nThis book is for sale at [http://leanpub.com/learnmeteor](http://leanpub.com/learnmeteor)\n\
    \nLeanpub\n\n© 2016 Arnaud Weil\n\nTo my wonderful family. Your love and support\
    \ fueled this book.\n\nTo my Verallia and Bruitparif clients, whose demanding\
    \ projects helped me discover and challenge Meteor.\n\n## Contents\n\n1. Introduction\n\
    \    1.1 What this book is not\n    1.2 Prerequisites\n    1.3 How to read this\
    \ book\n    1.4 Tools you need\n    1.5 Source code\n\n2. Why Meteor?\n    2.1\
    \ How I fell in love with Meteor\n    2.2 Why is Meteor so productive?\n    2.3\
    \ Where is the catch?\n\n3. Beginning with Meteor\n    3.1 Setting up your development\
    \ machine\n    3.2 Creating a meteor application\n    3.3 What are those files?\n\
    \    3.4 Meteor is listening to your code\n    3.5 The HTML file\n    3.6 It's\
    \ your turn to code: do-it-yourself\n    3.7 Exercise - Create the application\n\
    \    3.8 Exercise solution\n\n4. **Blaze, Spacebars and reactivity**\n    4.1\
    \ Spacebars\n    4.2 Where does the data come from?\n    4.3 Helpers\n    4.4\
    \ Client and server code\n    4.5 Organizing things\n    4.6 Exercise - Display\
    \ the current time\n    4.7 Exercise solution\n    4.8 Reactivity\n    4.9 Available\
    \ blocks\n    4.10 Template events\n    4.11 Data context\n\n5. **Managing data\
    \ from a MongoDB database**\n    5.1 What is MongoDB?\n    5.2 Collections\n \
    \   5.3 Exercise - Manually create a news collection in MongoDB\n    5.4 Exercise\
    \ solution\n    5.5 Mongo.Collection\n    5.6 Exercise: Display the news\n   \
    \ 5.7 Exercise solution\n    5.8 Query selectors\n    5.9 Updating data with a\
    \ Mongo.Collection\n    5.10 Exercise: Enable adding a piece of news\n    5.11\
    \ Exercise solution\n    5.12 Exercise: Enable users to delete news\n    5.13\
    \ Exercise solution\n\n6. **Packages: admin dashboard, navigation, validation,\
    \ forms generation**\n    6.1 What are packages\n    6.2 Searching for and installing\
    \ packages\n    6.3 Back-office management\n    6.4 Exercise: Create back-office\
    \ for data management\n    6.5 Exercise solution\n    6.6 Navigation\n    6.7\
    \ Exercise: Enable routing and create a layout\n    6.8 Exercise solution\n  \
    \  6.9 Schemas, validation\n    6.10 Exercise: Create a collection and schema\
    \ for the products\n    6.11 Exercise solution\n    6.12 CRUD forms generation\n\
    \    6.13 Exercise: Create GUI for the user to display and add products with validation\n\
    \    6.14 Exercise solution\n    6.15 Bootstrap\n    6.16 Exercise: Add some style\
    \ to the application\n    6.17 Exercise solution\n\n7. **Accounts: user management**\n\
    \    7.1 Meteor's account system\n    7.2 Exercise: Secure the products management\n\
    \    7.3 Exercise solution\n\n8. **Going further**\n    8.1 MiniMongo: you don't\
    \ even need MongoDB\n    8.2 Exercise: Create and manage a shopping cart\n   \
    \ 8.3 Exercise solution\n    8.4 Getting out of prototyping\n    8.5 Exercise:\
    \ Remove the *autopublish* package\n    8.6 Exercise solution\n    8.7 Exercise:\
    \ Remove the *insecure* package\n    8.8 Exercise solution\n\n**Definitions**\n\
    \    Bundling\n    Minification\n    npm\n    Spacebars\n\n**A word from the author**\n\
    \n**The Learn collection**\n\n## 1. Introduction\n\n### 1.1 What this book is\
    \ not\n\nI made my best to keep this book small, so that you can learn Meteor\
    \ quickly without getting lost in petty details. If you’re looking for a reference\
    \ book where you’ll find answers to all the questions you may have within the\
    \ next 4 years of your Meteor practice, you’ll find other heavy books for that.\n\
    \nMy purpose is to swiftly provide you with the tools you need to code your first\
    \ Meteor application and be able to look for more by yourself when needed. While\
    \ some authors seems to pride themselves in having the thickest book, in this\
    \ series I’m glad I achieved the thinnest possible book for my purpose. Though\
    \ I tried my best to keep all of what seems necessary, based on my 14 years experience\
    \ of teaching.\n\nI assume that you know what Meteor is and when to use it. In\
    \ case you don’t, read the following *Why Meteor?* chapter.\n\n### 1.2 Prerequisites\n\
    \nIn order for this book to meet its goals, you must:\n- Have basic experience\
    \ creating applications with JavaScript.\n- Have working knowledge of HTML.\n\
    - Know what a Web application is.\n\n### 1.3 How to read this book\n\nThis book's\
    \ aim is to make you productive as quickly as possible. For this we'll use some\
    \ theory, several demonstrations, plus exercises. Exercises appear like the following:\n\
    \n> Do it yourself: Time to grab your keyboard and code away to meet the given\
    \ objectives.\n\n### 1.4 Tools you need\n\nThe only tools you'll need to work\
    \ through that book are:\n- A Windows, Linux or OS X machine\n- A text editor.\
    \ My own favorite is the free [Visual Studio Code](https://code.visualstudio.com),\
    \ just pick the one you like.\n\n### 1.5 Source code\n\nAll of the source code\
    \ for the demos and do-it-yourself solutions is available at https://bitbucket.org/epobb/learnmeteorexercises\n\
    \nIt can be downloaded as a ZIP file², or if you installed GIT you can simply\
    \ type:\n\n```\ngit clone https://bitbucket.org/epobb/learnmeteorexercises.git\n\
    ```\n\n²https://bitbucket.org/epobb/learnmeteorexercises/get/c50195f7592a.zip\n\
    \n## 2. Why Meteor?\n\nIf you're in a hurry, you can safely skip this chapter\
    \ and head straight to the Beginning with Meteor chapter. This *Why Meteor* chapter\
    \ is there for those that want to know why Meteor should be used.\n\n### 2.1 How\
    \ I fell in love with Meteor\n\nI've been coding a lot of data-centric applications\
    \ using various technology stacks. They usually involve displaying and updating\
    \ data from some store (mainly a database) through a user interface and APIs,\
    \ adding some functional logic in the way.\n\nProblem is: most technology stacks\
    \ involve writing quite some code for basic things, and often require different\
    \ coding logics on the client and server.\n\nOne of my clients presented me with\
    \ a challenging application to build. After rough evaluation of the time needed,\
    \ writing a proof of concept required dozens of days. That was too much, so I\
    \ took a full day and looked for available technology stacks. By the end of the\
    \ day I stumbled upon Meteor. It promised a lot, but would it hold to its promises?\n\
    \nWell, it did. In five days I had the proof-of-concept coded and deployed on\
    \ a staging server. A few days later it"
  mdcn: "\n# 学习 Meteor\n\nNode.js 和 MongoDB JavaScript 平台\n\n# 学习 Meteor - Node.js\
    \ 和 MongoDB JavaScript 平台\n\n准备好下周使用 Meteor 进行编码吧\n\nArnaud Weil\n\n本书可在 [http://leanpub.com/learnmeteor](http://leanpub.com/learnmeteor)\
    \ 购买\n\nLeanpub\n\n© 2016 Arnaud Weil\n\n献给我美好的家人。你们的爱和支持是这本书的燃料。\n\n献给我的 Verallia\
    \ 和 Bruitparif 客户，他们要求严格的项目帮助我发现并挑战 Meteor。\n\n## 目录\n\n1. 引言\n    1.1 这本书不是什么\n\
    \    1.2 前提条件\n    1.3 如何阅读本书\n    1.4 你需要的工具\n    1.5 源代码\n\n2. 为什么选择 Meteor？\n\
    \    2.1 我如何爱上 Meteor\n    2.2 为什么 Meteor 如此高效？\n    2.3 有什么陷阱吗？\n\n3. Meteor\
    \ 入门\n    3.1 设置你的开发机器\n    3.2 创建 Meteor 应用\n    3.3 这些文件是什么？\n    3.4 Meteor\
    \ 在监听你的代码\n    3.5 HTML 文件\n    3.6 轮到你编码了：自己动手\n    3.7 练习 - 创建应用\n    3.8 练习解答\n\
    \n4. **Blaze、Spacebars 和响应式编程**\n    4.1 Spacebars\n    4.2 数据从哪里来？\n    4.3 Helper\n\
    \    4.4 客户端和服务器代码\n    4.5 组织代码\n    4.6 练习 - 显示当前时间\n    4.7 练习解答\n    4.8 响应式编程\n\
    \    4.9 可用的块\n    4.10 模板事件\n    4.11 数据上下文\n\n5. **管理 MongoDB 数据库中的数据**\n  \
    \  5.1 什么是 MongoDB？\n    5.2 集合\n    5.3 练习 - 在 MongoDB 中手动创建新闻集合\n    5.4 练习解答\n\
    \    5.5 Mongo.Collection\n    5.6 练习：显示新闻\n    5.7 练习解答\n    5.8 查询选择器\n    5.9\
    \ 使用 Mongo.Collection 更新数据\n    5.10 练习：允许添加新闻\n    5.11 练习解答\n    5.12 练习：允许用户删除新闻\n\
    \    5.13 练习解答\n\n6. **包：管理面板、导航、验证、表单生成**\n    6.1 什么是包\n    6.2 搜索和安装包\n   \
    \ 6.3 后台管理\n    6.4 练习：为数据管理创建后台\n    6.5 练习解答\n    6.6 导航\n    6.7 练习：启用路由并创建布局\n\
    \    6.8 练习解答\n    6.9 模式、验证\n    6.10 练习：为产品创建集合和模式\n    6.11 练习解答\n    6.12\
    \ CRUD 表单生成\n    6.13 练习：为用户创建图形界面，以便显示和添加产品并进行验证\n    6.14 练习解答\n    6.15 Bootstrap\n\
    \    6.16 练习：为应用添加一些样式\n    6.17 练习解答\n\n7. **账户：用户管理**\n    7.1 Meteor 的账户系统\n\
    \    7.2 练习：保护产品管理\n    7.3 练习解答\n\n8. **进阶**\n    8.1 MiniMongo：你甚至不需要 MongoDB\n\
    \    8.2 练习：创建和管理购物车\n    8.3 练习解答\n    8.4 脱离原型开发\n    8.5 练习：移除 *autopublish*\
    \ 包\n    8.6 练习解答\n    8.7 练习：移除 *insecure* 包\n    8.8 练习解答\n\n**定义**\n    打包\n\
    \    压缩\n    npm\n    Spacebars\n\n**作者寄语**\n\n**Learn 系列丛书**\n\n## 1. 引言\n\n\
    ### 1.1 这本书不是什么\n\n我尽力让这本书保持简短，这样你可以快速学习 Meteor，而不会迷失在繁琐的细节中。如果你正在寻找一本参考书，希望在未来四年的\
    \ Meteor 实践中能从中找到所有问题的答案，你会发现其他更厚重的书籍适合那个目的。\n\n我的目的是迅速为你提供编写第一个 Meteor 应用所需的工具，并在需要时能够自己寻找更多资源。当一些作者似乎以拥有最厚的书而自豪时，在这个系列中，我很高兴我实现了为我的目标写出尽可能薄的书。尽管我尽了最大努力保留所有看似必要的内容，这是基于我\
    \ 14 年的教学经验。\n\n我假设你知道 Meteor 是什么以及何时使用它。如果你不知道，请阅读下面的 *为什么选择 Meteor？* 章节。\n\n\
    ### 1.2 前提条件\n\n为了使本书达到其目标，你必须：\n- 具有使用 JavaScript 创建应用的基本经验。\n- 具备 HTML 的实用知识。\n\
    - 知道什么是 Web 应用。\n\n### 1.3 如何阅读本书\n\n本书的目标是让你尽快提高生产力。为此，我们将使用一些理论、多个演示以及练习。练习如下所示：\n\
    \n> 自己动手：是时候抓住你的键盘，编码以达到给定的目标了。\n\n### 1.4 你需要的工具\n\n学习本书所需的唯一工具是：\n- 一台 Windows、Linux\
    \ 或 OS X 机器。\n- 一个文本编辑器。我个人喜欢免费的 [Visual Studio Code](https://code.visualstudio.com)，选择你喜欢的即可。\n\
    \n### 1.5 源代码\n\n所有演示和自己动手解答的源代码都可在 https://bitbucket.org/epobb/learnmeteorexercises\
    \ 获取。\n\n可以将其下载为 ZIP 文件²，或者如果你安装了 GIT，可以简单地输入：\n\n```\ngit clone https://bitbucket.org/epobb/learnmeteorexercises.git\n\
    ```\n\n²https://bitbucket.org/epobb/learnmeteorexercises/get/c50195f7592a.zip\n\
    \n## 2. 为什么选择 Meteor？\n\n如果你赶时间，可以安全地跳过本章，直接进入 Meteor 入门章节。本 *为什么选择 Meteor* 章节是为那些想知道为什么应该使用\
    \ Meteor 的人准备的。\n\n### 2.1 我如何爱上 Meteor\n\n我使用各种技术栈编写了大量以数据为中心的应用。它们通常涉及通过用户界面和\
    \ API 显示和更新来自某个存储（主要是数据库）的数据，并在过程中添加一些功能逻辑。\n\n问题在于：大多数技术栈涉及为基本功能编写大量代码，并且通常需要在客户端和服务器上使用不同的编码逻辑。\n\
    \n我的一个客户向我提出了一个具有挑战性的应用。在粗略评估所需时间后，编写概念验证需要数十天。这太长了，所以我花了一整天时间寻找可用的技术栈。一天结束时，我偶然发现了\
    \ Meteor。它承诺了很多，但它会信守承诺吗？\n\n嗯，它信守了。五天内，我编写了概念验证并将其部署到预发布服务器上。几天后，\n"
