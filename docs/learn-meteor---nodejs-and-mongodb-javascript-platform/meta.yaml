  md: "```\nBooks.insert({\n  title: 'Learn METEOR',\n  bought: true\n});\n```\n\n\
    When ran on the client it would in effect add the book to the client cache of\
    \ the collection (which makes it instantaneous), then to the server collection\
    \ inside MongoDB, then reflect any server change to the client, so that the client\
    \ takes into account any change that could arise on the server.\n\nThe following\
    \ methods are available (among others):\n\n+   * `insert(document)` inserts a\
    \ new document in the collection and returns its ID;\n* `remove(selector)` removes\
    \ all documents form a collection that match the provided selector;\n* `update(selector,\
    \ modifier)` updates all documents form a collection that match the provided selector,\
    \ using the provided modifier.\n\nFor the `update` method, the modifier is a MongoDB\
    \ modifier, or a document. A modifier contains ‘$’ fields, while a document doesn’t.\
    \ If you provide a document, it completely replaces the existing documents. A\
    \ modifier allows you to specify only some updates that need to be done to the\
    \ matching documents.\n\nSuppose I want to increase to 15 the price of all the\
    \ books whose price is less than 10. I can write:"
  merge: -1
