    \ MongoDB is a schema-less database which makes it possible to add unstructured\
    \ documents to its"
  mdcn: "\n软件包：管理仪表板、导航、验证、表单生成\n\n72\n\n一旦找到某个软件包，你只需通过命令行添加它。例如，如果我想使用 `nimble:restivus`\
