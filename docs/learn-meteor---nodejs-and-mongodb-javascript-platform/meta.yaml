    \n## 6.15 Bootstrap\n\nYou surely know about Bootstrap, a widely used HTML framework\
    \ using responsive design. Full use of Bootstrap goes beyond the scope of this\
    \ book, but in case you don’t know it you can get up to speed quickly by [reading\
    \ the documentation](http://getbootstrap.com/css/).\n\nAlthough adding Bootstrap\
    \ to an application is not a big deal, it’s even easier using the Meteor package.\
    \ Just type\n\n```\nmeteor add twbs:bootstrap\n```\n\nBasically, Bootstrap relies\
    \ on your pages having a root element with a `container` class. If your application\
    \ uses some kind of layout (just like our exercises with `client/layout.html`)\
    \ it’s a no-brainer: add that element to the layout.\n\nFor instance, a layout\
    \ using iron router would be:\n\n```\n<div class=\"container\">\n  {{>yield}}\n\
    </div>\n```\n\nYou can also create a collapsable header (one that collapses on\
    \ small screen sizes) using the `nav` element with a `navbar` class. Details and\
    \ examples are available [here in the Bootstrap documentation](http://getbootstrap.com/components/#navbar).\n\
    \n## 6.16 Exercise: Add some style to the application\n\n> Styling your application\
    \ is optional, and so is this exercise. If you don't want to spend time on styling\
    \ your application, this is fine and you can skip this exercise altogether.\n\n\
    Add Bootstrap to your application. Ensure that any page content is displayed in\
    \ a `div` that has a CSS class of `container`.\n\nMove the header links into a\
    \ `nav` element that collapses.\n\nChange the news page so that news are part\
    \ of a Bootstrap list-group, and that the button to delete news has a better style.\n\
    \nYour `news` page should now look like the following:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_103_0.png)\n\
    \n## 6.17 Exercise solution\n\n- Leave your browser open and the `meteor` command-line\
    \ running.\n- Open another command-line, navigate to your application directory\
    \ and type:\n\n```\nmeteor add twbs:bootstrap\n```\n\n- Once the package is added,\
    \ close the recently opened command-line.\n- In the `client/layout.html` file,\
    \ locate the following code:\n\n```\nclient/layout.html\n<template name=\"layout\"\
    >\n  <div>\n    <a href=\"/\">Home</a>\n    <a href=\"/products\">Products</a>\n\
    \    <a href=\"/time\">Time</a>\n    <a href=\"/admin\">Admin</a>\n  </div>\n\
    \  <div>\n    {{> yield}}\n  </div>\n</template>\n```\n\n- Replace that code with\
    \ the following one:\n\n```\nclient/layout.html\n<template name=\"layout\">\n\
    \  <nav class=\"navbar navbar-inverse\">\n    <div class=\"container-fluid\">\n\
    \      <div class=\"navbar-header\">\n        <button type=\"button\"\n      \
    \    class=\"navbar-toggle collapsed\"\n          data-toggle=\"collapse\"\n \
    \         data-target=\"#nvbcl\"\n          aria-expanded=\"false\">\n       \
