    \ MongoDB. They are roughly the equivalent of the WHERE part in a SQL statement.\
    \ We'll use them later on when updating the data.\n\nA selector is a JavaScript\
    \ object. A default, empty selector is {}, which means all documents in the collection.\
    \ Let's learn how to further refine our queries. Since we added title and bought\
