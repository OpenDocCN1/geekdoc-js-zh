    # 2.1 How I felt in love with Meteor


    I''ve been coding a lot of data-centric applications using various technology
    stacks. They usually involve displaying and updating data from some store (mainly
    a database) through a user interface and APIs, adding some functional logic in
    the way.


    Problem is: most technology stacks involve writing quite some code for basic things,
    and often require different coding logics on the client and server.


    One of my clients presented me with a challenging application to build. After
