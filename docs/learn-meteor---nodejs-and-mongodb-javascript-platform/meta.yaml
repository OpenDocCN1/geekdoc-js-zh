  md: "# demos.html\n\n```\n<template name=\"books\">\n    <ul>\n        {{#each book\
    \ in books}}\n        <li>{{book.title}}</li>\n        {{/each}}\n    </ul>\n\
    </template>\n```\n\nThis code was based on the *autopublish* package being present.\
    \ It won't work anymore once the *autopublish* package is removed. Let's fix this.\
    \ First, I have to publish the data used by that template. I'll choose a name\
    \ of `books-all` for this subscription. In a `server/publications.js` file I write:\n\
    \n# server/publications.js\n\n```\nMeteor.publish(\"books-all\", function () {\n\
    \  return Books.find({});\n});\n```\n\nNext, I subscribe to that publication in\
    \ the `onCreated` event of the `books` template. I create a `client/books.js`\
    \ file and add the following code:"
  merge: -1
  pgno: 128
- img_proc: true
  md: "# client/books.js\n\n```\nTemplate.books.onCreated(function() {\n  this.subscribe('books-all');\n\
    });\n```\n\nNow, after those two steps the list of books is displayed again.\n\
    Note that I use `this.subscribe` instead of `Meteor.subscribe`. This allows for\
    \ the subscription to be gracefully disposed of when the template is not being\
    \ displayed.\nWhen using `iron:router`, you can have the router render a waiting\
    \ template while the subscription gets effectively available on the client. For\
    \ this, you provide a `waitOn` option that gets a subscription or array of subscriptions:\n\
    \n```\nRouter.route('/books', {\n  loadingTemplate: 'loading',\n\n  waitOn: function\
    \ () {\n    return Meteor.subscribe('books-all');\n  },\n\n  action: function\
    \ () {\n    this.render('books');\n  }\n});\n```"
  merge: -1
