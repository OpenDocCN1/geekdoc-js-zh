- md: "file in a small project, hence use a test for `Meteor.isClient`. On a bigger\
    \ project, you'll make maintenance easier if you place the files in the `client`\
    \ and `server` folders.\n\nAnother advantage of using folders is that when you\
    \ change files just in the `client` folder, Meteor builds your application faster\
    \ than if you change them in the main or `server` folder. So using folders also\
    \ makes your code-review experience faster.\n\n> Should your application be really\
    \ large, you can create the `client` and `server` folders as sub-folders, and\
    \ the same logic will apply. This means you can have folders at the root of your\
    \ application named after the functionality they hold, and each of those main\
    \ folders would have `client` and `server` sub-folders when necessary.\n\n## 4.5\
    \ Organizing things\n\nIn fact, you can use as little or as many files as you\
    \ want. Meteor will look for all of the `template` elements in all of your HTML\
    \ and CSS files, whether in the base folder, `client` sub-folder (or sub-sub-folder).\n\
    \nThe same goes for the JavaScript file: Meteor will merge all of your JavaScript.\
    \ The only detail, as we saw, is that JavaScript files located in the `client`\
    \ folder will only execute on the client while those in the `server` folder will\
    \ only execute on the server. Any other JavaScript file will execute both on the\
    \ client and server.\n\n## 4.6 Exercise - Display the current time\n\nTime again\
    \ for some fun: you're going to practice what we just saw.\n\nJust like with the\
    \ previous exercise, the solution follows, in case you need it. But I bet you\
    \ won't.\n\n- Add a new template named \"timeDisplay\", which displays the current\
    \ time. Reference the `timeDisplay` template from the `body` element.\n\nYour\
    \ application should look like the following:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_33_0.png)\n\
    \n## 4.7 Exercise solution\n\n- Leave your browser open and the meteor command-line\
    \ running.\n- Open the meteorshop.html file. At the end of the file, add the following\
    \ code:\n\n**meteorshop.html**\n\n```\n<template name=\"timeDisplay\">\n  {{currentTime}}\n\
    </template>\n```\n\n- In the meteorshop.html file, locate the following code:\n\
    \nBlaze, Spacebars and reactivity 28\n\n**meteorshop.html**\n\n```\n<body>\n \
    \ <h1>Shop in a hurry</h1>\n</body>\n```\n\n- Replace that code with the following\
    \ one:\n\n**meteorshop.html**\n\n```\n<body>\n  <h1>Shop in a hurry</h1>\n  {{>\
    \ timeDisplay}}\n</body>\n```\n\n- Create a folder named `client`. Add a `client.js`\
    \ file into it.\n- Open the `client/client.js` file. Add the following code:\n\
    \nclient/client.js\n\n```\nTemplate.timeDisplay.helpers({\n    currentTime: function()\
    \ {\n        var now = new Date();\n        return now.toLocaleTimeString();\n\
    \    }\n});\n```\n\n- Switch back to your browser and look at the result:\n  http://localhost:3000\n\
    \n## 4.8 Reactivity\n\n### An example\n\nNow, I’m sure you’re wondering: how about\
    \ making the time refresh automatically? Indeed, that would be nice. Because the\
    \ time that’s displayed in our application is already outdated.\n\nI have good\
    \ news for you: Meteor handles this in a very elegant way, just like other productive\
    \ framework: you update the values in your JavaScript, and the HTML refreshes\
    \ automatically.\n\nIf you used other frameworks like Angular or Knockout you’re\
    \ used to that kind of magic that makes a programmer’s life much easier. Meteor\
    \ takes it a step further, because it can automatically refresh the HTML when\
    \ something changes on the server. In fact, it can even refresh the HTML when\
    \ something changes in the database!\n\nFor now, we don't have any database and\
    \ are coding on the client side. So it's not going to be impressive. But believe\
    \ me, in a few paragraphs we'll use code that's even simpler in order to get data\
    \ refreshing automatically all from the database down to the browser.\n\nLet me\
    \ open your `client/client.js` file and replace the following code:\n\n```\nTemplate.timeDisplay.helpers({\n\
    \    currentTime: function() {\n        var now = new Date();\n        return\
    \ now.toLocaleTimeString();\n    }\n});\n```\n\nWith the following code:\n\nclient/client.js\n\
    \n```\nMeteor.setInterval(function() {\n  var currentDate = new Date();\n  Session.set('now',\n\
    \    currentDate.toLocaleTimeString()\n  );\n}, 1000);\n\nTemplate.timeDisplay.helpers({\n\
    \  currentTime: function() {\n    return Session.get('now');\n  }\n});\n```\n\n\
    Let's save it. If I look at my browser again, I can see the time is refreshing.\
    \ Again, you may not be very impressed with that, since we could do the same with\
    \ even less lines of jQuery or plain JavaScript. That's because my example is\
    \ too simple, that is, the result is too simple for Meteor to shine.\n\nHowever,\
    \ you can see a very interesting thing about our code already: the `currentTime`\
    \ helper doesn't state that it has to refresh. All it does is get some value from\
    \ a “Session” and return it. A whole different part of the code is updating that\
    \ “Session” value on a periodic basis.\n\n### Session is a client-side storage\n\
    \nSession is a place where you can store key-value objects. It is global: stored\
    \ on the client and available to the whole application.\n\nIn order to store a\
    \ value you write:\n\n```\nvar myObject = {\n  A: 'my value',\n  B: 5\n}\nSession.set('someKey',\
    \ myObject);\n```\n\nAnd you retrieve the value at another place using that code\
    \ (note the key, `someKey`, is the same as the one used to store the data):\n\n\
    ```\nvar storedValue = Session.get('someKey');\nconsole.log(storedValue.A); //\
    \ prints 'my value'\n```\n\n### Session is a reactive source\n\nCode that reads\
    \ a session value using `Session.get` will be reevaluated if the value changes.\
    \ Well, there are some conditions for code to be reevaluated (it all depends on\
    \ where it is called from), but code in a helper fills that condition. That's\
    \ what Meteor calls reactivity.\n\nIn my example above, as soon as I write the\
    \ new time value to the session, the `timeDisplay` helper is evaluated again and\
    \ its value inserted in the HTML that states `{{timeDisplay}}`.\n\nReactivity\
    \ will save us a lot of boilerplate code: as long as we use reactive data, we\
    \ only need to update the data and the UI that relates to it updates.\n\n### There\
    \ are way more reactive sources\n\nSession is just one of the reactive sources.\
    \ There are more reactive sources, here are some of them:\n\n- ReactiveVar, which\
    \ you can instantiate to store any value.\n- Database queries, that we’ll see\
    \ a bit later, used to store data coming from the database.\n- Meteor.user, that\
    \ holds information about the current user.\n- Meteor.status, that holds information\
    \ about the client-server connection.\n\nMeteor packages will provide you with\
    \ other reactive sources.\n\n## 4.9 Available blocks\n\nAs we saw, there are several\
    \ built-in block templates in Spacebars, apart from the ones you can define yourself.\
    \ Let’s have a look at them.\n\n### if\n\nThat one will display an enclosed block\
    \ only if a condition is truthy. Like in the following example:\n\n```\n<h1>Comments</h1>\n\
    {{#if comments}}\n    <div>{{comments.length}} comments</div>\n{{else}}\n    <div>No\
    \ comment yet.</div>\n{{/if}}\n```\n\nNote that the else block is optional. And\
    \ remember: it’s all reactive. Helper variables you use from the Blaze HTML code\
    \ are reactive. Which means that the if block will go visible or hidden at any\
    \ time the comments value changes.\n\nAlso, there is a handy unless block. It\
    \ works exactly as the if block, except that the block goes hidden when the condition\
    \ is truthy - the exact opposite of a if block. We could rewrite the above sample\
    \ like that:\n\n```\n<h1>Comments</h1>\n{{#if comments}}\n    <div>{{comments.length}}\
    \ comments</div>\n{{/if}}\n{{#unless comments}}\n    <div>No comment yet.</div>\n\
    {{/unless}}\n```\n\n### each\n\nAn each block repeats its contents as many times\
    \ as necessary. You provide it with some collection, and the enclosed block will\
    \ be inserted as many times as there are elements.\n\nThere are two ways to use\
    \ the `each` block: implicit or explicit. Consider the following examples:\n\n\
    ### Javascript for both examples\n\n```\nTemplate.commentsIndex.helpers({\n  comments:\
    \ function() {\n    return [\n      { title='Some comment', author='Jane' },\n\
    \      { title='Another one', author='Ted' }\n    ];\n  }\n});\n```\n\nWe then\
    \ have two ways to use it:\n\n### Implicit each\n\n```\n<h1>Comments</h1>\n<ul>\n\
    {{#each comments}}\n  <li>{{title}} - by {{author}}</li>\n{{/each}}\n</ul>\n```"
  mdcn: "\n在小项目中，可以使用 `Meteor.isClient` 进行测试。但在较大项目中，将文件放在 `client` 和 `server` 文件夹中会更易于维护。\n\
    \n使用文件夹的另一个好处是，当你只修改 `client` 文件夹中的文件时，Meteor 构建应用的速度会比修改主文件夹或 `server` 文件夹中的文件更快。因此，使用文件夹也能加快代码审查的体验。\n\
    \n> 如果你的应用确实很大，你可以将 `client` 和 `server` 文件夹创建为子文件夹，同样的逻辑依然适用。这意味着你可以在应用的根目录下创建以功能命名的文件夹，并且在必要时，每个主文件夹都可以包含\
    \ `client` 和 `server` 子文件夹。\n\n## 4.5 组织方式\n\n实际上，你可以使用任意数量的文件。Meteor 会查找所有 HTML\
    \ 和 CSS 文件中的 `template` 元素，无论它们位于根文件夹、`client` 子文件夹（或子子文件夹）中。\n\nJavaScript 文件也是如此：Meteor\
    \ 会合并你所有的 JavaScript。唯一的细节是，正如我们之前看到的，位于 `client` 文件夹中的 JavaScript 文件只会在客户端执行，而位于\
    \ `server` 文件夹中的文件只会在服务器端执行。任何其他 JavaScript 文件都将在客户端和服务器端同时执行。\n\n## 4.6 练习 -\
    \ 显示当前时间\n\n又是有趣时刻：你将实践我们刚刚学到的内容。\n\n和之前的练习一样，解决方案附在后面，以防你需要。但我打赌你不需要。\n\n- 添加一个名为\
    \ \"timeDisplay\" 的新模板，用于显示当前时间。在 `body` 元素中引用 `timeDisplay` 模板。\n\n你的应用应如下所示：\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_33_0.png)\n\n## 4.7 练习解决方案\n\n- 保持浏览器打开，并让\
    \ meteor 命令行运行。\n- 打开 meteorshop.html 文件。在文件末尾添加以下代码：\n\n**meteorshop.html**\n\
    \n```\n<template name=\"timeDisplay\">\n  {{currentTime}}\n</template>\n```\n\n\
    - 在 meteorshop.html 文件中，找到以下代码：\n\nBlaze, Spacebars 和响应式 28\n\n**meteorshop.html**\n\
    \n```\n<body>\n  <h1>Shop in a hurry</h1>\n</body>\n```\n\n- 将该代码替换为以下代码：\n\n\
    **meteorshop.html**\n\n```\n<body>\n  <h1>Shop in a hurry</h1>\n  {{> timeDisplay}}\n\
    </body>\n```\n\n- 创建一个名为 `client` 的文件夹。在其中添加一个 `client.js` 文件。\n- 打开 `client/client.js`\
    \ 文件。添加以下代码：\n\nclient/client.js\n\n```\nTemplate.timeDisplay.helpers({\n    currentTime:\
    \ function() {\n        var now = new Date();\n        return now.toLocaleTimeString();\n\
    \    }\n});\n```\n\n- 切换回浏览器并查看结果：\n  http://localhost:3000\n\n## 4.8 响应式\n\n\
    ### 一个例子\n\n现在，我敢肯定你在想：让时间自动刷新怎么样？的确，那会很好。因为我们应用中显示的时间已经过时了。\n\n我有个好消息：Meteor\
    \ 以非常优雅的方式处理了这个问题，就像其他高效的框架一样：你在 JavaScript 中更新值，HTML 就会自动刷新。\n\n如果你使用过 Angular\
    \ 或 Knockout 等框架，你已经习惯了那种让程序员工作变得更轻松的“魔法”。Meteor 更进一步，因为它可以在服务器上的内容发生变化时自动刷新 HTML。事实上，它甚至可以在数据库中的内容发生变化时刷新\
    \ HTML！\n\n目前，我们没有任何数据库，并且是在客户端编码。所以它不会令人印象深刻。但请相信我，几段之后，我们将使用更简单的代码来实现从数据库到浏览器的数据自动刷新。\n\
    \n让我打开你的 `client/client.js` 文件，并将以下代码：\n\n```\nTemplate.timeDisplay.helpers({\n\
    \    currentTime: function() {\n        var now = new Date();\n        return\
    \ now.toLocaleTimeString();\n    }\n});\n```\n\n替换为以下代码：\n\nclient/client.js\n\
    \n```\nMeteor.setInterval(function() {\n  var currentDate = new Date();\n  Session.set('now',\n\
    \    currentDate.toLocaleTimeString()\n  );\n}, 1000);\n\nTemplate.timeDisplay.helpers({\n\
    \  currentTime: function() {\n    return Session.get('now');\n  }\n});\n```\n\n\
    让我们保存它。如果我再次查看浏览器，我可以看到时间在刷新。同样，你可能对此印象不深，因为用更少行的 jQuery 或纯 JavaScript 也能实现相同的功能。这是因为我的例子太简单了，结果对于\
    \ Meteor 来说过于简单，无法展现其优势。\n\n然而，你已经可以看到我们代码中一个非常有趣的地方：`currentTime` helper 并没有声明它必须刷新。它所做的只是从一个“Session”中获取某个值并返回。代码中一个完全不同的部分正在定期更新那个“Session”值。\n\
    \n### Session 是一个客户端存储\n\nSession 是一个存储键值对的地方。它是全局的：存储在客户端，并对整个应用可用。\n\n要存储一个值，你可以这样写：\n\
    \n```\nvar myObject = {\n  A: 'my value',\n  B: 5\n}\nSession.set('someKey', myObject);\n\
    ```\n\n然后在其他地方使用以下代码检索该值（注意键 `someKey` 与存储数据时使用的键相同）：\n\n```\nvar storedValue\
    \ = Session.get('someKey');\nconsole.log(storedValue.A); // 打印 'my value'\n```\n\
    \n### Session 是一个响应式源\n\n使用 `Session.get` 读取 session 值的代码将在该值发生变化时被重新评估。当然，代码被重新评估有一些条件（这完全取决于它被调用的位置），但\
    \ helper 中的代码满足这个条件。这就是 Meteor 所说的响应式。\n\n在上面的例子中，一旦我将新的时间值写入 session，`timeDisplay`\
    \ helper 就会被重新评估，并将其值插入到声明了 `{{timeDisplay}}` 的 HTML 中。\n\n响应式将为我们节省大量样板代码：只要我们使用响应式数据，我们只需要更新数据，相关的\
    \ UI 就会自动更新。\n\n### 还有更多响应式源\n\nSession 只是众多响应式源之一。还有更多响应式源，以下是一些：\n\n- ReactiveVar，你可以实例化它来存储任何值。\n\
    - 数据库查询，我们稍后会看到，用于存储来自数据库的数据。\n- Meteor.user，它保存有关当前用户的信息。\n- Meteor.status，它保存有关客户端-服务器连接的信息。\n\
    \nMeteor 包将为你提供其他响应式源。\n\n## 4.9 可用的块\n\n正如我们所看到的，除了你可以自己定义的模板之外，Spacebars 中还有几个内置的块模板。让我们来看看它们。\n\
    \n### if\n\n这个块只在条件为真时才会显示其包含的内容。例如：\n\n```\n<h1>Comments</h1>\n{{#if comments}}\n\
    \    <div>{{comments.length}} comments</div>\n{{else}}\n    <div>No comment yet.</div>\n\
    {{/if}}\n```\n\n注意 else 块是可选的。记住：这一切都是响应式的。你在 Blaze HTML 代码中使用的 helper 变量是响应式的。这意味着\
    \ if 块会在 comments 值发生变化的任何时刻显示或隐藏。\n\n另外，有一个方便的 unless 块。它的工作方式与 if 块完全相同，只是当条件为真时块会隐藏——与\
    \ if 块完全相反。我们可以这样重写上面的示例：\n\n```\n<h1>Comments</h1>\n{{#if comments}}\n    <div>{{comments.length}}\
    \ comments</div>\n{{/if}}\n{{#unless comments}}\n    <div>No comment yet.</div>\n\
    {{/unless}}\n```\n\n### each\n\neach 块会根据需要重复其内容多次。你为它提供一个集合，包含的块就会根据元素的数量插入相应次数。\n\
    \n使用 `each` 块有两种方式：隐式和显式。考虑以下示例：\n\n### 两个示例的 Javascript\n\n```\nTemplate.commentsIndex.helpers({\n\
    \  comments: function() {\n    return [\n      { title='Some comment', author='Jane'\
    \ },\n      { title='Another one', author='Ted' }\n    ];\n  }\n});\n```\n\n然后我们有两种使用方法：\n\
    \n### 隐式 each\n\n```\n<h1>Comments</h1>\n<ul>\n{{#each comments}}\n  <li>{{title}}\
    \ - by {{author}}</li>\n{{/each}}\n</ul>\n```\n"
