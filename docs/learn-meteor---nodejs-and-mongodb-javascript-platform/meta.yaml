  md: '# # 5. Managing data from a MongoDB database


    # ## 5.1 What is MongoDB?


    We''re going to code an application, right? Most applications need to store data
    on some server in a way that is persistent and may be shared across all the users.
    Meteor chose to include MongoDB for that purpose, and is reportedly working on
    including other database engines.


    MongoDB is very popular as a *no-SQL* database engine. Among the reasons that
    make it so popular is the fact that it works with a document format that''s very
    close to JSON.


    By default, MongoDB will not force you to use any schema, so you can simply store
    and read your data as needed. Which is great for getting your application ready
    as fast as possible.


    Sure, you''ll probably need some schema that your data should respect. Don''t
    worry: that part will be covered extensively (and easily) by Meteor, as you''ll
    learn [later in this book](#).'
  merge: -1
  pgno: 51
- img_proc: true
  md: "# # 5.2 Collections\n\nIn a MongoDB database you define collections, which\
    \ are much like tables in relational databases. Except that collections can contain\
    \ objects with different structures, and that those objects may have object or\
    \ array properties. If you want to feel like you are using a relational database,\
    \ just make sure that each object in a given collection has similar properties.\n\
    \nMeteor provides seamless support for MongoDB which we're going to learn very\
    \ soon. However, you can always access the MongoDB database directly, from your\
    \ command-line.\n\nIn my command line, I can type the following:\n\n```\nmeteor\
    \ mongo\n```\n\nNow all of my commands go to the MongoDB Node.JS engine, so I\
    \ can issue direct JavaScript commands in order to manage the database. For instance,\
    \ let's add an object describing a book to a collection named `books`:\n\n```\n\
    db.books.insert({\n    title: 'Learn METEOR',\n    bought: true\n});\n```\n\n\
    This statement creates the collection in case it doesn't exist, and adds the object\
    \ to it."
  merge: -1
  pgno: 52
- img_proc: true
  md: 'You might think it''s unnecessary to learn how to issue direct commands to
    the MongoDB engine. More since we want to learn Meteor quickly. Bad guess. Indeed,
    we shouldn''t normally have to issue those commands manually, but that''s not
    time wasted: Meteor accepts (almost) the same commands in JavaScript, whether
    on the client side or server side. Which means we''re not only learning MongoDB,
    but also Meteor. Did I tell you I love Meteor? Oh, yes.


    How about writing a query statement in order to check that the book is now part
    of the MongoDB database (technically, that we added a document to the `books`
    collection). Here it is:


    ```

    db.books.find({});

    ```


    That statement returns all of the books that are part of the database. It''s the
    MongoDB equivalent of a SQL `SELECT`.


