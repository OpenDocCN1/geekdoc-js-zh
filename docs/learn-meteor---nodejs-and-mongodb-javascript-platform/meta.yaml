    \      {{title}} {{price}}$\n      <button class=\"btn btn-success btn-xs buyAction\"\
    >\n        Buy\n      </button>\n    </li>\n    {{/each}}\n  </ul>\n</template>\n\
    ```\n\n- 在 client 文件夹中添加一个 store.js 文件，包含以下代码：\n\n# client/store.js\n\n```\nBasket\
