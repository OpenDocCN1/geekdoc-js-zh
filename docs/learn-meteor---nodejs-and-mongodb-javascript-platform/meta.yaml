  md: '# # 3. Beginning with Meteor


    # ## 3.1 Setting up your development machine


    You can develop Meteor applications using a Windows, Linux or OS X machine, and
    this book applies to all of them.


    In order to setup your machine, just point your browser to the install page¹.


    For Windows machines, there is an installer. On a Linux or OS X machine, just
    type:


    ```

    curl https://install.meteor.com/ | sh

    ```


    # ## 3.2 Creating a meteor application


    Meteor boosts your productivity as a developer. While most JavaScript development
    environments rely on the help of scaffolding tools like Yeoman in order to hide
    the fact that you need many files for even a basic application, Meteor needs only
    three files to code your application.


    ¹https://www.meteor.com/install'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'You read well: three files. That''s all there is to it. Of course you can use
    a full folder hierarchy and as many files as needed to organize your application,
    but that''s optional. Simply put, Meteor applies a good coding pattern from the
    start: KISS (keep it simple).


    Although you need only three files, Meteor even makes that process easy. Let me
    show you how I create my *demos* application. I''ll use my demos to showcase the
    techniques I want you to learn, before you get some practice for yourself in the
    exercises. You''ll soon create your own application, but for now please bear with
    me: sit and relax, and look at my demonstration.


    I want my application to be called *demos* so I simply open a command line and
    type:


    ```

    meteor create demos

    cd demos

    ```


    That''s it! The first line creates a "demos" directory and adds three files to
    it. It also adds a `.meteor` folder, but it''s just a local storage you won''t
    need to manage or go into. Time to run my application. Guess what? Yes, you''re
    right: Meteor makes it simple. Again, using my command-line I type:


    ```

    meteor

    ```


    That''s a shortcut for `meteor run`. It builds my application, runs a local MongoDB
    database server, and runs an HTTP server (using Node.js) that serves the application.'
  merge: -1
