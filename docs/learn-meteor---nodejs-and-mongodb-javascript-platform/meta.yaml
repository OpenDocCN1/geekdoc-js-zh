    \ comments</div>\n{{else}}\n    <div>No comment yet.</div>\n{{/if}}\n```\n\nNote\
    \ that the else block is optional. And remember: it’s all reactive. Helper variables\
    \ you use from the Blaze HTML code are reactive. Which means that the if block\
    \ will go visible or hidden at any time the comments value changes.\nAlso, there\
    \ is a handy unless block. If works exactly as the if block, except that the block\
    \ goes hidden when the condition is truthy - the exact opposite of a if block.\
    \ We could rewrite the above sample like that:\n\n```\n<h1>Comments</h1>\n{{#if\
    \ comments}}\n    <div>{{comments.length}} comments</div>\n{{/if}}\n{{#unless\
    \ comments}}\n    <div>No comment yet.</div>\n{{/unless}}\n```\n\n# each\n\nAn\
    \ each block repeats its contents as many times as necessary. You provide it with\
