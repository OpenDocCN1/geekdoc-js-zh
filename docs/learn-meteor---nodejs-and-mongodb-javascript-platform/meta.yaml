    \ your application, it does a lot of stuff for you, including referencing the\
    \ JavaScript and CSS file, plus bundling and minification for those. For this,\
    \ it will locate the head element and add links to those generated resources there."
- md: "# body\n\nThat’s where you put the HTML that renders at first to the user.\
    \ Sure, you may feel that this is the easiest place to put your HTML elements,\
    \ but that would make maintenance a nightmare.\n\nSince you’re a clean developer\
    \ (I know it, because you’re still reading), you won’t want to put more than a\
    \ few lines inside the `body` element. Later, we’ll mostly use it as display for\
    \ our routing engine. But hey, we don’t necessarily need a routing engine to be\
    \ clean. So what I recommend you do here is only use references to your templates.\n\
    \nDid I say *templates*. Time to look at the third element.\n\n# template\n\n\
    As I said, this element will be repeated. You create as many templates as you\
    \ want, provided you assign a different `name` attribute to each.\n\nThen you\
    \ reference your template elements from the `body` element or from other templates\
    \ using the mustache syntax with a `>` element:\n\n```\n{{> templateName}}\n```\n\
    \n> Alright, this is not pure HTML, we added some *mustache* syntax. More about\
    \ this a bit later. Just accept it like that, for now.\n\n# body + template +\
    \ template + ...\n\nIn fact, if we look again at the `demos.html` file, we can\
    \ see such a reference:\n\n```\n<body>\n  ...\n  {{> hello}}\n</body>\n\n<template\
    \ name=\"hello\">\n  ...\n</template>\n```\n\nWhat this means is that the content\
    \ of the `template` element named *hello* must go inside the `body` element. Which\
    \ means I can write:\n\n```\n<body>\n  {{> header}}\n  {{> someGreatInfo}}\n \
    \ {{> footer}}\n</body>\n```\n\n```\n<template name=\"header\">\n  ...\n</template>\n\
    ```\n\n```\n<template name=\"someGreatInfo\">\n  ...\n</template>\n```\n\n```\n\
    <template name=\"footer\">\n  ...\n</template>\n```\n\nI could also reference\
    \ a template from within another template:\n\n```\n<body>\n  {{> home}}\n</body>\n\
    ```\n\n```\n<template name=\"home\">\n  {{> latestNews}}\n  ...\n</template>\n\
    ```\n\n```\n<template name=\"latestNews\">\n  ...\n</template>\n```\n\nSure, I\
    \ could elaborate on that syntax but I’ll do that later. For now, you already\
