    # # 5. Managing data from a MongoDB database


    # ## 5.1 What is MongoDB?


    We''re going to code an application, right? Most applications need to store data
    on some server in a way that is persistent and may be shared across all the users.
    Meteor chose to include MongoDB for that purpose, and is reportedly working on
    including other database engines.


    MongoDB is very popular as a *no-SQL* database engine. Among the reasons that
    make it so popular is the fact that it works with a document format that''s very
    close to JSON.


    By default, MongoDB will not force you to use any schema, so you can simply store
    and read your data as needed. Which is great for getting your application ready
    as fast as possible.


    Sure, you''ll probably need some schema that your data should respect. Don''t
    worry: that part will be covered extensively (and easily) by Meteor, as you''ll
    learn [later in this book](#).'
  - "[PAGE 52]\n\n# # 5.2 Collections\n\nIn a MongoDB database you define collections,\
    \ which are much like tables in relational databases. Except that collections\
    \ can contain objects with different structures, and that those objects may have\
    \ object or array properties. If you want to feel like you are using a relational\
    \ database, just make sure that each object in a given collection has similar\
    \ properties.\n\nMeteor provides seamless support for MongoDB which we're going\
    \ to learn very soon. However, you can always access the MongoDB database directly,\
    \ from your command-line.\n\nIn my command line, I can type the following:\n\n\
    ```\nmeteor mongo\n```\n\nNow all of my commands go to the MongoDB Node.JS engine,\
    \ so I can issue direct JavaScript commands in order to manage the database. For\
    \ instance, let's add an object describing a book to a collection named `books`:\n\
    \n```\ndb.books.insert({\n    title: 'Learn METEOR',\n    bought: true\n});\n\
    ```\n\nThis statement creates the collection in case it doesn't exist, and adds\
    \ the object to it."
- md: "You might think it's unnecessary to learn how to issue direct commands to the\
    \ MongoDB engine. More since we want to learn Meteor quickly. Bad guess. Indeed,\
    \ we shouldn't normally have to issue those commands manually, but that's not\
    \ time wasted: Meteor accepts (almost) the same commands in JavaScript, whether\
    \ on the client side or server side. Which means we're not only learning MongoDB,\
    \ but also Meteor. Did I tell you I love Meteor? Oh, yes.\n\nHow about writing\
    \ a query statement in order to check that the book is now part of the MongoDB\
    \ database (technically, that we added a document to the `books` collection).\
    \ Here it is:\n\n```\ndb.books.find({});\n```\n\nThat statement returns all of\
    \ the books that are part of the database. It's the MongoDB equivalent of a SQL\
    \ `SELECT`.\n\n## 5.3 Exercise - Manually create a news collection in MongoDB\n\
    \nNow is finally time for you to practice. I guess your fingers are itching to\
    \ code, so please accept my excuses for so much theory. That's in part because\
    \ you needed to have that background before going on with this exercise... and\
    \ also because I love speaking about Meteor.\n\nOpen a Meteor MongoDB prompt and\
    \ create a collection named `news` that contains the following documents:\n\n\
    `{ title: 'Site just opened!' }`\n\n`{ title: 'Special offers today.' }`\n\nQuery\
    \ the `news` collection in order to ensure you did your job correctly. You should\
    \ get the following display (with different ObjectID values):\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_54_0.png)\n\
    \n## 5.4 Exercise solution\n\n- Leave your browser open and the `meteor` command-line\
    \ running.\n- Open a new command-line and browse to your application folder.\n\
    - Type the following command:\n\n```\nmeteor mongo\n```\n\n- On the MongoDB command-line\
    \ that appeared, type the following code:\n\n```\ndb.news.insert({ title: 'Site\
    \ just opened!'} );\ndb.news.insert({ title: 'Special offers today.'} );\n```\n\
    \n- On the same command-line, type the following code:\n\n```\ndb.news.find({});\n\
    ```\n\n- Ensure the two objects appear in the results that were displayed by this\
    \ command.\n\n## 5.5 Mongo.Collection\n\nNow comes one of the greatest time savers\
    \ in Meteor. When developing traditional client-server applications you have to\
    \ write server code that accesses the data source, exposes it to the client (i.e.\
    \ write an API), and consume that API from the client. You have to track changes\
    \ on the client, submit them to the server (API again), and write server code\
    \ that pushes those changes to the data source. Optionally, you would write code\
    \ that detects changes in the data source and pushes them to the client.\n\nMeteor\
    \ takes an approach where it does all of that by default, as long as you create\
    \ a `Mongo.Collection`. Which means little code to write and maintain, and more\
    \ time to go on holiday, have fun with your kids or play that great MMORPG you\
    \ like.\n\nBasically, you create a `Mongo.Collection`, query it, and Meteor does\
    \ what is needed for that to work. That means writing two lines:\n\n```\nBooks\
    \ = new Meteor.Collection('books');\n\nvar allBooks = Books.find({});\n```\n\n\
    Practically, those two simple lines have several effects:\n\n- Provide you with\
    \ access to the collection on the server side.\n- Create a MiniMongo database\
    \ on the client side. MiniMongo holds the query results on the client side and\
    \ provides (almost) the same interface as the MongoDB database.\n- Ensure that\
    \ the MiniMongo database is kept in sync with the server-side MongoDB database:\
    \ any change to the query result will be pushed to the client for you.\n\nWith\
    \ Meteor, the data management schema for that (and other) collection looks like\
    \ this:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_57_0.png)\n\nRemember I created\
    \ a `books` collection in the Collections chapter? I'm going to display it in\
    \ my application.\n\nIn order for the client and server to know about that collection,\
    \ I just have to create a `Meteor.Collection`. In order to get the collection\
    \ to be displayed in my templates, I'll add a helper. Here's the full JavaScript\
    \ code:\n\n```\ndemos.js\nBooks = new Meteor.Collection('books');\n\nif (Meteor.isClient)\
    \ {\n  Template.books.helpers({\n    books: function () {\n      return Books.find({});\n\
    \    }\n  });\n}\n```\n\nThe first line is executed both on the client and server.\
    \ It ensures that they both can access the `books` collection stored in the MongoDB\
    \ database. Then, we create a template helper that exposes all of the books as\
    \ a \"books\" variable in the context. Note that we use the `find()` method that\
    \ MongoDB accepts, with the same syntax.\n\nNow, we can write the HTML:\n\n```\n\
    demos.html\n<template name=\"books\">\n    <ul>\n        {{#each book in books}}\n\
    \        <li>{{book.title}}</li>\n        {{/each}}\n    </ul>\n</template>\n\
    ```\n\nAnd here's the result:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_58_0.png)\n\
    \nNow comes the best part: this simple code is fully reactive all the way down\
    \ from the server to the client. Which means I have nothing to do in order to\
    \ get connected browsers to display any change in the `books` collection. Don’t\
    \ just take my word for it, let me demo it.\n\nI'll pop open a command line and\
    \ type:\n\n```\nmeteor mongo\n```\n\n```\ndb.books.insert({\n  title: 'Learn WebSockets',\n\
    \  bought: false\n});\n```\n\nLet’s switch back to the browser. I don’t even need\
    \ to refresh it. Here’s the display:\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_59_0.png)\n\
    \nYes, the inserted book appeared. Whenever we query a `Meteor.Collection`, Meteor\
    \ ensures that the query results are synchronized real-time between the server\
    \ and clients. It uses a WebSocket for that. Internally, Meteor's *DDP* protocol\
    \ is used for changes to be pushed to the clients.\n\nThose are really good news.\
    \ I told you that Meteor makes us productive, and I hope it gets clearer to you\
    \ as you read through that book. That is a really good example: using only basic\
    \ code, we have no effort to make in order to get real-time synchronization between\
    \ all connected clients. Just think for one second how easy it is to write real-time\
    \ applications like chat or collaborative applications: a change on one client\
    \ is reflected to the server and all connected clients. Nifty and effortless.\n\
    \n## 5.6 Exercise: Display the news\n\n![](img/7ee67584836eb2d3d796446a7cd4a75d_60_0.png)\n\
    \nAdd a new template named “news”, which displays all the news from the `news`\
    \ collection you created in the previous exercise. Reference the `news` template\
    \ from the *body* element.\n\nYour application should look like the following:\n\
    \n![](img/7ee67584836eb2d3d796446a7cd4a75d_61_0.png)\n\n## 5.7 Exercise solution\n\
    \n- Leave your browser open and the `meteor` command-line running.\n- Open the\
    \ `meteorshop.js` file. Add the following code:\n- Open the `client/client.js`\
    \ file. Add the following code:\n\n```\nmeteorshop.js\nNews = new Mongo.Collection('news');\n\
    ```\n\n```\nclient/client.js\nTemplate.news.helpers({\n    news: function () {\n\
    \        return News.find();\n    }\n});\n```\n\n- Add a `news.html` file to the\
    \ `client` folder. Add the following code:\n\n```\nclient/news.html\n<template\
    \ name=\"news\">\n    <h3>News</h3>\n    <ul>\n        {{#each news}}\n      \
    \  <li>{{title}}</li>\n        {{/each}}\n    </ul>\n</template>\n```\n\n- In\
    \ the `meteorshop.html` file, locate the following code:\n\n```\nmeteorshop.html\n\
    <body>\n  <h1>Shop in a hurry</h1>\n  {{> timeDisplay}}\n</body>\n```\n\n- Replace\
    \ that code with the following one:\n\n```\nmeteorshop.html\n<body>\n  <h1>Shop\
    \ in a hurry</h1>\n  {{> timeDisplay}}\n  {{> news}}\n</body>\n```\n\nSwitch back\
    \ to your browser and make sure that the news are displayed.\n\n## 5.8 Query selectors\n\
    \nIn order to get the books in my example, I wrote the following statement:\n\n\
    ```\nBooks.find({});\n```\n\nThat is, I used the `find` method of the `Mongo.Collection`\
    \ class. This command returns all of the documents in a collection. The first\
    \ parameter is a query selector.\n\n> Query selectors are used everywhere we need\
    \ to reference some documents using MongoDB. They are roughly the equivalent of\
    \ the WHERE part in a SQL statement. We'll use them later on when updating the\
    \ data.\n\nA selector is a JavaScript object. A default, empty selector is {},\
    \ which means all documents in the collection. Let's learn how to further refine\
    \ our queries. Since we added title and bought fields to our Books collection,\
    \ we can query using them.\n\nSuppose we want to get only the books that were\
    \ bought. We could use the following query:\n\n```\nBooks.find({\n    bought:\
    \ true\n});\n```\n\nAnd if we want those whose title is \"Diet\" and were not\
    \ bought already, we can write:\n\n```\nBooks.find({\n    title: 'Diet',\n   \
    \ bought: false\n});\n```\n\nAs you may know, MongoDB being an unstructured database,\
    \ we could use that selector even if some of the documents in the Books collection\
    \ didn't have those fields."
