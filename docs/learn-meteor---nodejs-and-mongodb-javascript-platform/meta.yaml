    # 6.12 CRUD forms generation


    While coding a data-centric web application, a lot of time is spent creating forms.
    Forms allow users to create, update and delete data from your data store. But
    they require quite some work: create the UI, handle the events, perform validation
    and notify the user about any validation errors. That “quite some work” is multiplied
    by the number of collections, which in total amounts to an important part of the
    project.


    Wouldn’t it be nice to save a lot of time on that part? That’s where another productive
    Meteor package kicks in: *aldeed:autoform*. This package will automatically create
    forms, complete with validation UI, and it can even connect them to your collections.


    What’s more, *aldeed:autoform* is very flexible. It can do anything from:


    +   - Create a form connected to a MongoDB collection, including validation, all
    in just a line of code;

    - Create a customized form connected to a MongoDB collection, including validation,
    with hooks you write;

    - Create a UI that’s validated using a schema you provide, calling your own functions
    when data is validated.


    In other words, AutoForms can be coupled with collections or just schemas. Productivity
    **and** flexibility. Need-'
  merge: -1
