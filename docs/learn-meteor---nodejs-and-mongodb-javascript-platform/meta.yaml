    # 8.4 Getting out of prototyping


    Up to now we''ve been coding our application really fast, which is great for prototyping.
    However, for our coding to be so effective Meteor uses two packages that should
    be removed before going to production, since they compromise security:'
  merge: -1
  pgno: 125
- img_proc: true
  md: '+   - The *autopublish* package, which ensures that all the collections you
    declared using `Mongo.Collection` are available to the client;

    - The *insecure* package, which allows the client to make any change to the collections.


    The *autopublish* package lowers security since it enables any client to get all
    of the documents in each collection.


    The *insecure* package lowers security because, even though your GUI allows only
    for certain changes, an evil developer could execute custom JavaScript code on
    the client that would make unexpected changes to your collections.


    Thus, you obviously want to remove the *autopublish* and *insecure* package before
    moving your application to production. Let''s see how.


    # Removing *autopublish*


    First, you need to remove the package. Just run the following command on your
    command line:


    ```

    meteor remove autopublish

    ```


    Now, you need to tell Meteor which data should be published and fetched. This
    is done in two steps:


    +   1. Use the `Meteor.publish` function on the server;

    2. Call the `Meteor.subscribe` function on the client.'
  merge: -1
  pgno: 126
- img_proc: true
  md: "For both functions, you provide a publication name as a string, that should\
    \ be the same on the client and server (that’s how the subscription is matched\
    \ with the publication). You can also take parameters in the publish method, that\
    \ you provide in the subscribe method.\n\nTo keep things simple, a subscribe should\
    \ be done before you fetch documents from a collection on the client, for instance\
    \ before using the collection find method. A good place to do so is in the onCreated\
    \ event of a template where you use the data.\n\nLet’s have a look at an example.\
    \ Remember the code I used in order to display all the books:\n\n```\ndemos.js\n\
    \nBooks = new Meteor.Collection('books');\n\nif (Meteor.isClient) {\n  Template.books.helpers({\n\
    \    books: function () {\n      return Books.find({});\n    }\n  });\n}\n```"
  merge: -1
