    # 4.10 Template events


    We are now able to display stuff, and display it in a reactive way. Which means
    our users will always see up-to-date information. Now, wouldn''t it be nice if
    they could interact with that information? Alright, it''s not just nice, it''s
    necessary: if we can''t get users to act on their data, we might as well look
    for another job now.


    For user interaction, we can write event handlers just like we wrote helpers.
    Helpers are for displaying information, events are for user interaction. Let''s
    suppose I want to display a message to the user and change it whenever the user
    clicks a button. Here''s the HTML (well, Blaze HTML):'
