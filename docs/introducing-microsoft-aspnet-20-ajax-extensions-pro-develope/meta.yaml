    \ TargetControlID=\"TextBox1\" />\n```\n\nThe extender validates the current text\
    \ against a set of requirements set by the page author. The result of the validation\
    \ process is output through either a text message or a bar indicator to let users\
    \ know about the level of complexity of the chosen password. With all default\
