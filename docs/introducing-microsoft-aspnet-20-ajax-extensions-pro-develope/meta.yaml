  md: '# # Introduction


    If you''re a Web professional developing for Microsoft-based Web technologies,
    AJAX is your next big opportunity to seize. This book is your starting point.
    And even a bit more.


    # # How This Book Is Organized


    The book is divided into three parts: an overview of the platform and its building
    blocks, techniques to effectively enhance existing sites, and client-centric development.
    In the first part, you''ll learn the basics of the AJAX model and the extensions
    made to the JavaScript language to back it. The second part is dedicated to the
    elements in the framework that you use to add new capabilities to existing server
    controls and to transform existing classic ASP.NET pages into full-fledged AJAX
    pages. Finally, the third part covers tools and techniques that express the real
    power of AJAX applications—out-of-band calls to server code.


    # # System Requirements


    You''ll need the following hardware and software to build and run the code samples
    for this book:


    +   - Microsoft Windows Vista, Microsoft Windows XP with Service Pack 2, Microsoft
    Windows Server 2003 with Service Pack 1, or Microsoft Windows 2000 with Service
    Pack 4

    - Microsoft Visual Studio 2005 Standard Edition or Microsoft Visual Studio 2005
    Professional Edition

    - Microsoft SQL Server 2005 Express (included with Visual Studio 2005) or Microsoft
    SQL Server 2005

    - 600-MHz Pentium or compatible processor (1-GHz Pentium recommended)

    - 192 MB of RAM (256 MB or more recommended)

    - Video monitor (800 x 600 or higher resolution) with at least 256 colors (1024
    x 768 High Color 16-bit recommended)

    - Microsoft mouse or compatible pointing device


    # # Configuring SQL Server 2005 Express Edition


    Some chapters of this book require that you have access to SQL Server 2005 Express
    Edition (or SQL Server 2005) to create and use the Northwind Traders database.
    If you are using SQL Server 2005 Express Edition, follow these steps to grant
    access to the user account that you will be using to perform the exercises in
    this book:


