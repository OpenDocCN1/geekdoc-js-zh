    ## 设置 ASP.NET AJAX 扩展


    在我们深入探讨 ASP.NET AJAX 架构之前，让我们简要回顾一些与安装、配置和运行 ASP.NET AJAX 应用程序相关的常见问题。


    ## 安装 ASP.NET AJAX 扩展


    ASP.NET AJAX 扩展的安装阶段会安装 AJAX 脚本库的调试版和发行版以及所有需要的二进制文件。如果你安装了任何版本的 Visual Studio
    2005，该软件包还会配置集成开发环境 (IDE) 以显示一个现成的 AJAX 项目模板。（参见图 1-6。）


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_41_0.png)


    **图 1-6** 创建新网站时出现的新 AJAX 项目模板。


    ASP.NET AJAX 扩展 Microsoft Windows Installer (MSI) 软包会将一些文件安装到你计算机上的以下文件夹中：


    ```

    %DRIVE%:\Program Files\Microsoft ASP.NET\ASP.NET 2.0 AJAX Extensions\v1.0.61025

    ```


    此外，它还会将一个名为 *System.Web.Extensions.dll* 的程序集放置到全局程序集缓存 (GAC) 中。ASP.NET AJAX 程序集包含一组形成客户端脚本库的
    JavaScript 文件（.js 文件）。


    > **注意** ASP.NET AJAX 的官方安装程序会将二进制文件复制到 GAC 中。这仍然是推荐的方式。然而，简单地将 *System.Web.Extensions*
    程序集复制到 Bin 文件夹中也足以部署一个 ASP.NET AJAX 网站。


    ## 部署 ASP.NET AJAX 应用程序


    创建 ASP.NET AJAX 应用程序的最简单方法是选择 Visual Studio 2005 项目模板。（参见图 1-6。）Visual Studio
    会向项目添加一个 *web.config* 文件，其中包含运行 ASP.NET AJAX 应用程序所需的所有设置。特别是，该配置文件将 ASP.NET AJAX
    程序集链接到项目中。


    如果你的 ASP.NET AJAX 应用程序使用 Web 服务，你应该确保这些 Web 服务——位于应用程序本地——已正确安装并且能够找到所有必需的资源。


    > **重要** 并非在默认 *web.config* 文件中创建的所有配置条目在所有情况下都是必需的。你可能希望删除那些不需要的条目。特别是，如果你的应用程序不直接从
    JavaScript 发出远程带外调用，你可能希望删除那些分别用于处理对 Web 服务和页面方法的调用的 HTTP 处理程序和 HTTP 模块。但是，当你编辑
    web.config 文件时，请格外小心，最好将不需要的部分注释掉而不是删除。你可能会无意中删除一个重要的设置，从而破坏整个应用程序。


    ## 核心组件


    ASP.NET AJAX 框架由客户端和服务器端两部分组成。应用程序主要使用客户端 JavaScript 库来管理页面用户界面、调用基于服务器的组件以及发出部分页面刷新的请求。服务器组件为客户端生成响应，并发出预定义的客户端脚本，这些脚本与客户端库集成，有时还会对其进行扩展。ASP.NET
    AJAX 的服务器端部分包括 Web 服务、临时控件以及 JavaScript 对象表示法 (JSON) 基础设施。（我将在本章稍后讨论 JSON 数据交换技术。）


    ## Microsoft AJAX 客户端库


    AJAX 客户端库由一组 JavaScript（*.js*）文件组成，这些文件在需要时会从客户端页面链接。这些 *.js* 文件会被下载到每个使用 ASP.NET
    AJAX 页面的客户端上。这些文件对 ASP.NET 开发者来说是透明的，因为它们被嵌入在 ASP.NET AJAX 程序集中。


    客户端库为 JavaScript 语言提供了面向对象且跨浏览器的扩展，例如类、命名空间、继承和数据类型。此外，它还定义了一个基本封装的 .NET 基类库版本，其中包括字符串构建器、正则表达式、计时器和跟踪功能。ASP.NET
    AJAX 客户端库的关键部分是网络层，它管理着通过 *XMLHttpRequest* 进行异步调用的复杂性。这一层允许客户端页面通过带外调用与 Web 服务和
    Web 页面进行通信。


    ## 基于服务器的组件


    ASP.NET AJAX 是 ASP.NET 的扩展，而 ASP.NET 是一个服务器端开发平台。因此，ASP.NET AJAX 提供了许多基于服务器的组件，包括
    Web 服务和控件，这些组件带来了双重好处。一方面，你可以从客户端编程这些组件并更新当前页面，而无需完全刷新；另一方面，在很大程度上，编程模型保持不变。这样一来，至少在核心功能方面，ASP.NET
    AJAX 的学习曲线可能会令人愉快地短暂。


    内置的 Web 服务向客户端页面暴露了许多 ASP.NET 功能，包括用户配置文件、成员身份和角色。服务器控件看起来就像经典的 ASP.NET 服务器控件，不同之处在于它们会发出额外的脚本代码。这些脚本代码通过有选择地利用
    AJAX 客户端库提供的设施来丰富用户对控件的体验。你将要使用的一些关键的 AJAX 服务器控件是 *UpdatePanel*、*UpdateProgress*
    和 *Timer*。我将在第 4 章中介绍它们。


    ## JSON 基础设施


    Web 应用程序中带外调用的日益增多带来了一个新问题——移动越来越复杂的数据。这不仅仅是一个序列化问题，.NET Framework 和其他特定平台的框架已经有了现成的解决方案。带外调用涉及的序列化不仅是跨平台的；它还涉及不同的层次以及截然不同的工具和语言。通过带外调用，你将数据从客户端移动到服务器并返回。但客户端是一个浏览器（如果不是移动设备的话），JavaScript
    是数据的原生格式。服务器是一个托管在各种硬件/软件平台上并运行特定 Web 应用程序框架的 Web 服务器。


    JSON 是一种新兴的技术，用于在网络上传递结构化数据。它是一种数据交换格式，在 http://www.json.org 有完整描述。它对于人类来说相对容易阅读，对于机器来说也容易解析和生成。JSON
    使用两种通用数据结构——集合和数组——来描述数据，大多数现代编程语言和类库都以某种方式支持这两种数据结构。


    JSON 是一种完全独立于语言的文本格式，尽管它严重依赖于从 C 语言系列继承的一些约定。


    JSON 客户端基础设施可以将 JavaScript 对象序列化为交换格式，并通过网络将其发送到服务器端接收器。特定于平台的接收器将解析数据流以构建特定于平台的对象。同样，JSON
    服务器基础设施可以接受任何特定于平台的对象并将其序列化为交换格式。回到客户端，数据流会立即转换为一个 JavaScript 对象。就 .NET Framework
    和 ASP.NET 而言，会使用一些反射技术来检查类的内部结构并创建适当的 JavaScript 包装器。


    实际上所有基于 AJAX 的框架都实现了 JSON 基础设施。ASP.NET AJAX 也不例外。


    > **注意** 有一段时间，XML 被吹捧为网络的通用语言，因为它对于开发者和架构师来说是理想且量身定制的，可以以完全跨平台的方式打包和交换数据。如今，你会发现
    JSON（一种非 XML 技术）被用于同样的任务。有什么区别吗？JSON 和 XML 做的是同样的工作。XML 更复杂，在某些方面有些古怪，而且是通用的。对于需要使用
    XSLT 样式表来设置 UI 样式的数据描述，XML 更可取。而对于原始数据，JSON 是一种更轻量级的格式，对人类和计算机来说都更容易阅读和解析。


    ## 结论


    大多数专注的开发者自 20 世纪 90 年代末以来一直围绕交互式 Web 技术进行开发。各种技术（例如，Microsoft Remote Scripting
    以及开源和商业变体）已经发展起来，但没有形成足够大的接受度和使用量。或者也许量已经够大了，但每个人都在等待一个杀手级应用的火花。另一个阻碍更先进的客户端技术被采用的因素是浏览器缺乏对它们的跨浏览器支持。


    如今的情况与仅仅三四年前相比发生了根本性的变化。现在大约 90% 的可用浏览器都支持实现交互式 Web 应用程序（也称为 AJAX 应用程序）的所有最低要求。此外，W3C
    正在标准化 *XMLHttpRequest* 对象，这是所有现有 AJAX 平台背后必不可少的通信工作马。下一代 Web 应用程序将基于一种不同的机制：不再仅仅是，或者不仅仅是，在页面跳转时提交表单，而是对数据的单独请求以及对显示页面的动态更新。


    作为旨在创建 Web 页面的服务器技术，ASP.NET 利用了提供这一备受期待功能的机会。脚本回调是 Microsoft 提供构建 AJAX 风格页面的 API
    的首次尝试。其建模于经典的回发事件，回调有时不必要地繁琐且不灵活。


    作为 ASP.NET 2.0 的附加组件，Microsoft ASP.NET AJAX 扩展为 ASP.NET 平台上的 AJAX 应用程序指明了前进的方向。它将
    AJAX 生活方式集成到 ASP.NET 的现有应用程序模型中，从而产生了一个熟悉的编程模型，并大大改进和丰富了功能。

