  - '[PAGE 62]


    **156**  Part II  Adding AJAX Capabilities to a Site


    Table 5-1  Extenders in the ACT (Continued)


    | Component | Description |

    | :--- | :--- |

    | *PopupControl* | Transforms the contents of a given panel into a pop-up window
    without using HTML dialog boxes. You can associate this extender with any control
    that can fire any of the following client-side events: *onfocus*, *onclick*, and
    *onkeydown*. |

    | *ResizableControl* | Attaches to any page element, and allows the user to resize
    the element using a handle placed at the lower-right corner of the control. |

    | *RoundedCorners* | Adds a background panel to any ASP.NET control so that the
    control appears with rounded corners. The overall height of the original control
    changes slightly. |

    | *Slider* | Extends a *TextBox* control with a slider user interface. |

    | *TextBoxWatermark* | Associated with *TextBox* controls. This extender adds
    sample or prompt text, called a "watermark," that illustrates the type of text
    the user is expected to enter in the field. For example, the watermark might say,
    "Type your name here." The watermark text disappears as soon as the user starts
    typing and reappears as the text box becomes empty. |

    | *ToggleButton* | Associated with *CheckBox* controls. This extender enables
    you to use custom images to render the check buttons. You can use different images
    to indicate the selected and cleared states. |

    | *UpdatePanelAnimation* | Plays animations during key steps of a partial update.
    You can use the extender to animate the page both while the panel is being updating
    and when the update has completed. |

    | *ValidatorCallout* | Works on top of ASP.NET validators, and improves their
    user interface. In particular, the extender displays a yellow callout with the
    error message. |


    As you can probably guess, some extenders listed in the table require rich browser
    capabilities, whereas others are just a smart piece of JavaScript code attached
    to a block of markup elements. Note that all these features work in a cross-browser
    way. I’ll return to each of the aforementioned extenders with code samples and
    more details in a moment.


    # **Controls in the ACT**


    Along with all the extenders listed in Table 5-1, the ACT also supplies a few
    traditional server controls with rich capabilities: the *Accordion*, *Rating*,
    *ReorderList* and *TabContainer* controls.


    The *Accordion* control allows you to provide multiple collapsible panes and display
    only one at a time. When the user clicks a new pane, the currently displayed pane
    is collapsed to leave room for the new one.


    The *Rating* control provides an intuitive user interface to let users select
    the number of stars that represents their rating of a given subject. The control
    is the wrapped-up version of the user interface that several Web sites provide
    to let users rate published items.'
  - '[PAGE 63]


    A data-bound control, *ReorderList*, allows its child elements to be reordered
    on the client using drag-and-drop functionality. To move an item in the list,
    the user drags the item''s handle up to its new position. At the end of the operation,
    the control posts back so that the new status of the data source can be recorded.


    Finally, the *TabContainer* control is a purely client-side container of tabbed
    forms.


    Let''s first get to know more about these controls and then move on to discuss
    extenders.


    # ## The *Accordion* Control


    Collapsible panels are a frequent feature in modern and cutting-edge Web sites.
    They allow you to display a short highlight—the header—and keep more text hidden
    and available on demand. The *CollapsiblePanel* extender (discussed later) allows
    you to hide and display any block of markup. But what if you need to build a sort
    of hierarchy of panels?


    The *Accordion* control allows you to group multiple collapsible panels in a single
    control, and it manages the collapsed/expanded state of each panel so that only
    one can be expanded at a time.


    # ## Generalities of the *Accordion* Control


    The *Accordion* control contains a collection of child *AccordionPane* controls,
    each of which features a template property to define header and content. Each
    pane can include any HTML, ASP.NET, or ASP.NET AJAX markup you want.


    # ### Properties of the Control


    Table 5-2 lists the key properties of the *Accordion* control.


    # **Table 5-2 Properties of the *Accordion* Control**


    | Property | Description |

    | --- | --- |

    | *AutoSize* | The value assigned to this property indicates how the control will
    determine its actual size. |

    | *ContentCssClass* | Gets and sets the CSS class used to style the content of
    child panes. |

    | *FadeTransitions* | Indicates whether to use a fade-out transition effect while
    hiding the current pane. This property is set to *false* by default. |

    | *FramesPerSecond* | Gets and sets the number of frames per second used in the
    transition animation for the newly selected pane. This property is set to 30 frames
    by default. |

    | *HeaderCssClass* | Gets and sets the CSS class used to style the header of child
    panes. |

    | *Panes* | Returns the collection of child panes. |

    | *SelectedIndex* | Gets and sets the currently expanded pane. |

    | *TransitionDuration* | Gets and sets the number of milliseconds to animate the
    transition. This property is set to *250* by default. |'
- md: " ## Animating the Control\n\nThe *Accordion* control supports animation in\
    \ two different contexts. First, it might optionally fade out the content of the\
    \ current pane when a new one is selected. This effect is controlled by the *FadeTransitions*\
    \ Boolean property. The effect is not very visible on small-sized content panes.\
    \ Note also that the fade animation is tightly coupled with the transition animation\
    \ that slowly rolls down the content of the new pane.\n\nThis second form of animation\
    \ is controlled by the *TransitionDuration* and *FramesPerSecond* properties.\
    \ If this latter effect is disabled, you won't see any fade-out effect regardless\
    \ of the setting of the *FadeTransitions* property.\n\nTo skip transition animation\
    \ completely and obtain a quick swap of panes, you set both *FramesPerSecond*\
    \ and *TransitionDuration* to *0*. If you do so, also set *FadeTransitions* to\
    \ *false* to save the control unnecessary tasks that will produce no observable\
    \ effects.\n\n## Sizing the Control\n\nThe size of the *Accordion* control is\
    \ clearly determined by any container element as well as the content of the various\
    \ panes. This means that the overall size of the accordion might vary with the\
    \ selected pane. In this case, other elements in the page might be pushed up or\
    \ down. The *AutoSize* property helps to keep the overall size of accordion under\
    \ control.\n\nThe *AutoSize* property takes its values from the *AutoSize* enumeration,\
    \ whose values are *None* (default), *Limit*, and *Fill*. When the *AutoSize*\
    \ property is set to *None*, the accordion modifies its size freely following\
    \ the size of the selected pane.\n\nWhen you set *AutoSize* to *Limit*, the accordion\
    \ never grows larger than the value specified by its *Width* and *Height* properties.\
    \ The *Accordion* control inherits these properties from its base class. The *Height*\
    \ and *Width* properties are both ignored if *None* is set. If the content to\
    \ display is larger than the designated size of the accordion, scrollbars are\
    \ employed to let users see all of it.\n\nWith the *Fill* value set, the accordion\
    \ stays exactly within the bounding box delimited by the *Width* and *Height*\
    \ properties. In this case, the content will be expanded or made scrollable if\
    \ it isn't the right size. Expanding the contents just means making the pane larger.\n\
    \n## Using the *Accordion* Control\n\nThe accordion consists of a number of child\
    \ panes, each of which is an instance of the *AccordionPane* class. You add panes\
    \ using markup and retrieve the collection of panes programmatically using the\
    \ *Panes* collection property.\n\n### The *Accordion* Control in Action\n\nThe\
    \ following code demonstrates the usage of the *Accordion* control:\n\n```\n<div\
    \ style=\"width:300px;\">\n  <act:Accordion ID=\"Accordion1\" run帐號务必确认=\"server\"\
    \ Height=\"400px\"\n      SelectedIndex=\"0\"\n      ContentCssClass=\"accordionContent\"\
    \n      HeaderCssClass=\"accordionHeader\"\n      FadeTransitions=\"true\"\n \
    \     AutoSize=\"Fill\">\n    <Panes>\n      <act:AccordionPane ID=\"AccordionPane1\"\
    \ runat=\"server\">\n        <Header>One</Header>\n        <Content>This is the\
    \ first pane</Content>\n      </act:AccordionPane>\n      <act:AccordionPane ID=\"\
    AccordionPane2\" runat=\"server\">\n        <Header>Two</Header>\n        <Content>\n\
    \          <div style=\"height:400px\">\n          This is the second pane</div>\n\
    \        </Content>\n      </act:AccordionPane>\n      <act:AccordionPane ID=\"\
    AccordionPane3\" runat=\"server\">\n        <Header>Three</Header>\n        <Content>This\
    \ is the third pane</Content>\n      </act:AccordionPane>\n      <act:AccordionPane\
    \ ID=\"AccordionPane4\" runat=\"server\">\n        <Header>Four</Header>\n   \
    \     <Content>This is the fourth pane</Content>\n      </act:AccordionPane>\n\
    \    </Panes>\n  </act:Accordion>\n</div>\n```\n\nYou add an `<act:AccordionPane>`\
    \ element for each collapsible panel you want to display. Each pane consists of\
    \ a `<header>` and `<content>` template.\n\nThe sample accordion is embedded in\
    \ a fixed-width `<div>` tag. The outermost container determines the width and\
    \ height of the accordion. The *AutoSize* property set to *Fill* forces the accordion\
    \ to cover and fill the whole bounding box. Figure 5-4 shows the results.\n\n\
    Note that the content of the second pane is set to a height of 400 pixels; the\
    \ accordion itself, though, can't be taller than 400 pixels and can't grow uncontrolled\
    \ because of the *AutoSize* setting. As a result, the second pane displays a scrollbar\
    \ to let you see the content that exceeds that limit.\n\n![Accordion control in\
    \ action](img/db82dc55683fa403b8b16b76eb00cc2e_66_0.png)\n\nFigure 5-4  The *Accordion*\
    \ control in action\n\n## Accordion Panes\n\nAn accordion pane is a simple Web\
    \ control named *AccordionPane*. It has a *Header* template property that you\
    \ use to define the highlighting of the panel–that is, the portion of the panel\
    \ that is visible also when it is collapsed. You can style the header using the\
    \ settings in the CSS class defined by the *HeaderCssClass* property.\n\nLikewise,\
    \ the content of the pane is defined by the *Content* template property and styled\
    \ using the settings in the CSS class referenced by the *ContentCssClass* property.\n\
    \n## The *Rating* Control\n\nThe satisfaction of users is one of the key metrics\
    \ used to determine the success of a Web site. And how do you recognize the satisfaction\
    \ level of a user? Many Web sites kindly ask users to provide their feedback through\
    \ ad hoc panels scattered through the pages. The most common user-interface pattern\
    \ for user feedback is a ratings system. The Web site shows a fixed number of\
    \ stars and lets users click those stars to rate a given feature (usually, more\
    \ stars clicked indicates a higher level of satisfaction).\n\nMost ASP.NET developers\
    \ can easily arrange a rating mechanism that works through classic postbacks.\
    \ The ACT *Rating* control, on the other hand, provides a standard rating mechanism\
    \ that works over callbacks.\n\n### Generalities of the *Rating* Control\n\nThe\
    \ output of the control consists of a repeated `<span>` tag that is decorated\
    \ through a set of CSS classes. Each `<span>` tag represents a \"star\" in the\
    \ rating system and is styled according to the status it represents. Figure 5-5\
    \ gives you an idea of the *Rating* control.\n\n![Rating control in action](img/db82dc55683fa403b8b16b76eb00cc2e_67_0.png)\n\
    \nFigure 5-5 The *Rating* control in action\n\n### Properties of the Control\n\
    \nTable 5-3 lists the key properties of the *Rating* control.\n\n| Property |\
    \ Description |\n| --- | --- |\n| *AutoPostBack* | Indicates whether the control\
    \ will post back whenever the user rates a given associated content. |\n| *CurrentRating*\
    \ | Gets and sets the current value rendered by the control. The default value\
    \ is 3. |\n| *EmptyStarCssClass* | Gets and sets the CSS class to render an unselected\
    \ star. |\n| *FilledStarCssClass* | Gets and sets the CSS class to render a selected\
    \ star. |\n| *MaxRating* | Gets and sets the maximum value that can be rated through\
    \ the control. The default value is 5. |\n| *RatingAlign* | Indicates the alignment\
    \ of the stars. The default is *horizontal*. |\n| *RatingDirection* | Indicates\
    \ the orientation of the stars. The default is left to right if the *RatingAlign*\
    \ value is horizontal and top to bottom if *RatingAlign* is vertical. |\n| *ReadOnly*\
    \ | Indicates whether the control accepts user input. |\n\nTable 5-3 Properties\
    \ of the *Rating* Control (Continued)\n\n| Property | Description |\n| --- | ---\
    \ |\n| *StarCssClass* | Gets and sets the CSS class to style the whole control.\
    \ |\n| *Tag* | A string to pass to the server-side code that handles the user's\
    \ click. |\n| *WaitingStarCssClass* | Gets and sets the CSS class to render selected\
    \ stars during a server postback following a user update. |\n\nThe markup generated\
    \ by the *Rating* control looks like the following code:\n\n```\n<div id=\"Rating1\"\
    \ style=\"float: left;\">\n    <span id=\"Rating1_Star_1\" class=\"ratingStar\
    \ filledRatingStar\"\n          style=\"float:left;\">&nbsp;</span>\n    <span\
    \ id=\"Rating1_Star_2\" class=\"ratingStar filledRatingStar\"\n          style=\"\
    float:left;\">&nbsp;</span>\n    ...\n</div>\n```\n\nAs you can see, each \"star\"\
    \ is characterized by a unique ID and is represented with a `<span>` tag set to\
    \ the empty string. In Figure 5-5, though, each star is clearly an image. How\
    \ is that possible?\n\n### Styling the Control\n\nThe *Rating* control supports\
    \ four different CSS classes. *StarCssClass* defines the style for the entire\
    \ control. *WaitingStarCssClass* defines the style to be used when the control\
    \ is posting back. *EmptyStarCssClass* and *FilledStarCssClass* define the style\
    \ for the `<span>` tag. You can use either an image to fill the tag or a contrasting\
    \ background color. Let's consider the following CSS classes:\n\n```\n.filledRatingStar\n\
    {\n    background-color: #2E4d7B;\n}\n.emptyRatingStar\n{\n    background-image:\
    \ url(images/NotSelected.png);\n}\n```\n\nThese classes produce an effect like\
    \ the second rating object shown in Figure 5-5. The selected part is rendered\
    \ as a gauge bar; the unselected part is rendered using empty stars. By editing\
    \ the CSS classes, you can choose the \"star\" images to meet the expectations\
    \ of the users of your application.\n\n### Using the *Rating* Control\n\nThe *Rating*\
    \ control is relatively simple to use. It only requires you to set a few properties—the\
    \ CSS classes—and it has no child elements or templates."
  mdcn: "\n ## 为控件添加动画\n\n*Accordion* 控件支持两种不同情境下的动画。首先，当选择新窗格时，它可以选淡入淡出当前窗格的内容。此效果由\
    \ *FadeTransitions* 布尔属性控制。该效果在内容窗格较小时不太明显。还需注意，淡出动画与过渡动画紧密耦合，后者会缓慢展开新窗格的内容。\n\
    \n第二种动画形式由 *TransitionDuration* 和 *FramesPerSecond* 属性控制。如果后一种效果被禁用，则无论 *FadeTransitions*\
    \ 属性如何设置，都不会看到任何淡出效果。\n\n要完全跳过过渡动画并实现窗格的快速切换，可将 *FramesPerSecond* 和 *TransitionDuration*\
    \ 都设置为 *0*。如果这样做，也应将 *FadeTransitions* 设置为 *false*，以避免控件执行不必要的、不会产生可观效果的任务。\n\n\
    ## 控件尺寸调整\n\n*Accordion* 控件的尺寸显然由任何容器元素以及各窗格的内容决定。这意味着手风琴的整体尺寸可能随所选窗格而变化。在这种情况下，页面中的其他元素可能会被上下推动。*AutoSize*\
    \ 属性有助于控制手风琴的整体尺寸。\n\n*AutoSize* 属性的值取自 *AutoSize* 枚举，其值为 *None*（默认）、*Limit* 和\
    \ *Fill*。当 *AutoSize* 属性设置为 *None* 时，手风琴会自由调整其大小，跟随所选窗格的尺寸变化。\n\n当将 *AutoSize*\
    \ 设置为 *Limit* 时，手风琴永远不会超过其 *Width* 和 *Height* 属性指定的值。*Accordion* 控件从其基类继承这些属性。如果设置为\
    \ *None*，则忽略 *Height* 和 *Width* 属性。如果要显示的内容大于手风琴的指定尺寸，将使用滚动条让用户查看全部内容。\n\n设置 *Fill*\
    \ 值时，手风琴将完全保持在由 *Width* 和 *Height* 属性限定的边界框内。在这种情况下，如果内容尺寸不合适，将被扩展或变为可滚动。扩展内容意味着使窗格更大。\n\
    \n## 使用 *Accordion* 控件\n\n手风琴由多个子窗格组成，每个窗格都是 *AccordionPane* 类的实例。您可以使用标记添加窗格，并通过\
    \ *Panes* 集合属性以编程方式检索窗格集合。\n\n### *Accordion* 控件实战\n\n以下代码演示了 *Accordion* 控件的使用：\n\
    \n```\n<div style=\"width:300px;\">\n  <act:Accordion ID=\"Accordion1\" run帐號务必确认=\"\
    server\" Height=\"400px\"\n      SelectedIndex=\"0\"\n      ContentCssClass=\"\
    accordionContent\"\n      HeaderCssClass=\"accordionHeader\"\n      FadeTransitions=\"\
    true\"\n      AutoSize=\"Fill\">\n    <Panes>\n      <act:AccordionPane ID=\"\
    AccordionPane1\" runat=\"server\">\n        <Header>One</Header>\n        <Content>This\
    \ is the first pane</Content>\n      </act:AccordionPane>\n      <act:AccordionPane\
    \ ID=\"AccordionPane2\" runat=\"server\">\n        <Header>Two</Header>\n    \
    \    <Content>\n          <div style=\"height:400px\">\n          This is the\
    \ second pane</div>\n        </Content>\n      </act:AccordionPane>\n      <act:AccordionPane\
    \ ID=\"AccordionPane3\" runat=\"server\">\n        <Header>Three</Header>\n  \
    \      <Content>This is the third pane</Content>\n      </act:AccordionPane>\n\
    \      <act:AccordionPane ID=\"AccordionPane4\" runat=\"server\">\n        <Header>Four</Header>\n\
    \        <Content>This is the fourth pane</Content>\n      </act:AccordionPane>\n\
    \    </Panes>\n  </act:Accordion>\n</div>\n```\n\n您为每个要显示的可折叠面板添加一个 `<act:AccordionPane>`\
    \ 元素。每个窗格由 `<header>` 和 `<content>` 模板组成。\n\n示例手风琴嵌入在固定宽度的 `<div>` 标签中。最外层容器决定了手风琴的宽度和高度。*AutoSize*\
    \ 属性设置为 *Fill*，强制手风琴覆盖并填满整个边界框。图 5-4 显示了结果。\n\n注意，第二个窗格的内容设置为 400 像素高；然而，由于 *AutoSize*\
    \ 设置，手风琴本身不能高于 400 像素，也不能无限制地增长。因此，第二个窗格显示一个滚动条，让您查看超出该限制的内容。\n\n![Accordion control\
    \ in action](img/db82dc55683fa403b8b16b76eb00cc2e_66_0.png)\n\n图 5-4  *Accordion*\
    \ 控件实战\n\n## 手风琴窗格\n\n手风琴窗格是一个名为 *AccordionPane* 的简单 Web 控件。它有一个 *Header* 模板属性，用于定义面板的突出显示部分——即面板折叠时仍然可见的部分。您可以使用\
    \ *HeaderCssClass* 属性定义的 CSS 类中的设置来设置标题样式。\n\n同样，窗格的内容由 *Content* 模板属性定义，并使用 *ContentCssClass*\
    \ 属性引用的 CSS 类中的设置来设置样式。\n\n## *Rating* 控件\n\n用户满意度是衡量网站成功与否的关键指标之一。那么如何识别用户的满意程度呢？许多网站善意地要求用户通过散布在页面中的临时面板提供反馈。用户反馈最常见的用户界面模式是评分系统。网站显示固定数量的星星，让用户点击这些星星来给某个功能评分（通常，点击的星星越多表示满意度越高）。\n\
    \n大多数 ASP.NET 开发者可以轻松安排一个通过经典回发工作的评分机制。另一方面，ACT *Rating* 控件提供了一个通过回调工作的标准评分机制。\n\
    \n### *Rating* 控件概述\n\n该控件的输出由一系列重复的 `<span>` 标签组成，通过一组 CSS 类进行装饰。每个 `<span>`\
    \ 标签代表评分系统中的一个\"星星\"，并根据其所代表的状态进行样式设置。图 5-5 让您了解 *Rating* 控件的外观。\n\n![Rating control\
    \ in action](img/db82dc55683fa403b8b16b76eb00cc2e_67_0.png)\n\n图 5-5 *Rating*\
    \ 控件实战\n\n### 控件的属性\n\n表 5-3 列出了 *Rating* 控件的关键属性。\n\n| 属性 | 描述 |\n| --- | ---\
    \ |\n| *AutoPostBack* | 指示当用户对给定关联内容进行评分时，控件是否将回发。 |\n| *CurrentRating* | 获取和设置控件渲染的当前值。默认值为\
    \ 3。 |\n| *EmptyStarCssClass* | 获取和设置用于渲染未选中星星的 CSS 类。 |\n| *FilledStarCssClass*\
    \ | 获取和设置用于渲染已选中星星的 CSS 类。 |\n| *MaxRating* | 获取和设置通过控件可以评分的最大值。默认值为 5。 |\n| *RatingAlign*\
    \ | 指示星星的对齐方式。默认值为 *horizontal*。 |\n| *RatingDirection* | 指示星星的方向。如果 *RatingAlign*\
    \ 值为 horizontal，则默认为从左到右；如果 *RatingAlign* 为 vertical，则默认为从上到下。 |\n| *ReadOnly*\
    \ | 指示控件是否接受用户输入。 |\n\n表 5-3 *Rating* 控件的属性（续）\n\n| 属性 | 描述 |\n| --- | --- |\n\
    | *StarCssClass* | 获取和设置用于为整个控件设置样式的 CSS 类。 |\n| *Tag* | 传递给处理用户点击的服务器端代码的字符串。\
    \ |\n| *WaitingStarCssClass* | 获取和设置在用户更新后进行服务器回发期间用于渲染已选中星星的 CSS 类。 |\n\n*Rating*\
    \ 控件生成的标记如下所示：\n\n```\n<div id=\"Rating1\" style=\"float: left;\">\n    <span\
    \ id=\"Rating1_Star_1\" class=\"ratingStar filledRatingStar\"\n          style=\"\
    float:left;\">&nbsp;</span>\n    <span id=\"Rating1_Star_2\" class=\"ratingStar\
    \ filledRatingStar\"\n          style=\"float:left;\">&nbsp;</span>\n    ...\n\
    </div>\n```\n\n如您所见，每个\"星星\"由唯一 ID 标识，并由设置为空的 `<span>` 标签表示。然而，在图 5-5 中，每个星星显然是一幅图像。这怎么可能呢？\n\
    \n### 控件样式设置\n\n*Rating* 控件支持四种不同的 CSS 类。*StarCssClass* 定义整个控件的样式。*WaitingStarCssClass*\
    \ 定义控件回发时使用的样式。*EmptyStarCssClass* 和 *FilledStarCssClass* 定义 `<span>` 标签的样式。您可以使用图像填充标签，也可以使用对比背景色。让我们考虑以下\
    \ CSS 类：\n\n```\n.filledRatingStar\n{\n    background-color: #2E4d7B;\n}\n.emptyRatingStar\n\
    {\n    background-image: url(images/NotSelected.png);\n}\n```\n\n这些类产生的效果类似于图\
    \ 5-5 中显示的第二个评分对象。选中部分渲染为计量条；未选中部分使用空星星渲染。通过编辑 CSS 类，您可以选择适合应用程序用户期望的\"星星\"图像。\n\
    \n### 使用 *Rating* 控件\n\n*Rating* 控件相对简单易用。它只需要您设置几个属性——CSS 类——并且没有子元素或模板。\n"
