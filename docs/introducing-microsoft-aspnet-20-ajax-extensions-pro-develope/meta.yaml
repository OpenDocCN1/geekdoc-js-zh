  md: '# **Table 5-4** Properties of the *ReorderList* Control (Continued)


    | Property | Description |

    |---|---|

    | *DragHandleTemplate* | The template for the drag handle that the user clicks
    to drag and reorder items. |

    | *EditItemTemplate* | The template used to show that a row is in edit mode. |

    | *EmptyListTemplate* | The template used to show that the list has no data. This
    item is not data bindable. |

    | *InsertItemTemplate* | The template used to add new items to the list. |

    | *ItemInsertLocation* | When the *InsertItemTemplate* property is used to add
    a new item to the displayed list, this property indicates where the item has to
    be inserted. Feasible values are *Beginning* and *End*. |

    | *ItemTemplate* | The template for any items in the list. |

    | *PostBackOnReorder* | Indicates whether the control has to post back at the
    end of a reorder operation. |

    | *ReorderTemplate* | The template used to show the drop location during a reorder
    operation. This template is not data bindable. |

    | *SortOrderField* | The field, if any, that represents the sort order of the
    items. |


    The key properties are *ItemTemplate*, *DragHandleTemplate*, and *ReorderTemplate*.
    *ItemTemplate* allows you to populate the list control with any information and
    layout you need. *DragHandleTemplate* defines the graphical elements that users
    need to identify when they want to reorder the list. Finally, the *ReorderTemplate*
    defines the template of the visual feedback that is shown to the user while the
    operation is occurring.


    # Events of the Control


    The *ReorderList* control is primarily a data-bound control with a rich user interface
    largely made up of templates. This means that the control can include a number
    of child controls that might trigger postbacks and cause the contents of the control
    to change.


    It is not surprising, then, to find a long list of events associated with this
    control. These events are detailed in Table 5-5.


    # **Table 5-5** Events of the *ReorderList* Control


    | Event | Description |

    |---|---|

    | *CancelCommand* | Occurs when a button with the *CommandName* of "Cancel" is
    clicked from within the control. |

    | *DeleteCommand* | Occurs when a button with the *CommandName* of "Delete" is
    clicked from within the control. |

    | *EditCommand* | Occurs when a button with the *CommandName* of "Edit" is clicked
    from within the control. |

    | *InsertCommand* | Occurs when a button with the *CommandName* of "Insert" is
    clicked from within the control. |

    | *ItemCommand* | Occurs when a button is clicked from within the item template
    of a row. |'
