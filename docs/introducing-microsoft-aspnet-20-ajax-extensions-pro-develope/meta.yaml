  - '[PAGE 57]


    more about the project by visiting the home page of the project on the CodePlex
    Web site. The exact URL is *http://www.codeplex.com/AtlasControlToolkit*.


    If interested, you can become a contributor to the project and have your work
    highlighted. The main purpose of the ACT is to provide a collection of controls
    and extenders that fully benefit from the ASP.NET AJAX programming model and provide
    free and effective Web components to developers. The ACT is expected to remain
    and evolve separately from ASP.NET AJAX. However, chances are that, in the future,
    part of the contents of the ACT assembly will be merged with the ASP.NET core
    binaries. Time will tell.


    As of today, you have two main options for using ACT controls. You can link the
    full assembly to your application, or you can incorporate some of the controls
    as source code in your project. Before you do this, though, make sure you read
    the license page at *http://www.codeplex.com/AtlasControlToolkit/Project/License.aspx*.


    # ## Get Ready for the Toolkit


    To download the latest bits of the ACT, visit the project''s home page on CodePlex:
    *http://www.codeplex.com/AtlasControlToolkit*. Once it is downloaded, the Toolkit
    looks like a ZIP file that you click to unpack and install any contained files.


    # ### The ACT Project


    At the end of the setup, you have a Microsoft Visual Studio 2005 ASP.NET project
    on your hard disk. If you run the project, you should see something like the screen
    shown in Figure 5-2.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_57_0.png)


    Figure 5-2 The sample Web site built to illustrate the facilities in the ACT'
  - '[PAGE 58]


    If you take a tour of the project files, you''ll see that the ACT is a collection
    of ASP.NET AJAX controls and extenders plus many examples that illustrate their
    functionality and tests. In addition, the ACT contains a development kit to simplify
    the creation and re-use of your own custom controls and extenders. The development
    kit includes Visual Studio 2005 templates for Visual Basic and Visual C# to let
    developers write their own controls and extenders. In addition, it features a
    library of helper classes to speed up the creation of controls and extenders.


    # Adding ACT Components to the Toolbox


    So the ACT contains a number of controls and extenders that you might want to
    compose and combine in your ASP.NET pages. The Visual Studio 2005 toolbox appears
    to be the perfect place to list all these components so that developers can pick
    up exactly the one they need and paste it to the current page. To add ACT components
    to the toolbox, you first create a new tab in the toolbox. You right-click on
    the toolbox surface and select Add Tab from the context menu. Once the new tab
    is added, you can give it any name you want—for example, AJAX Control Toolkit.


    Next, you populate the tab with all components in the ACT assembly. To do this,
    you right-click the toolbox area below the newly added tab and select Choose Items.
    The standard dialog box that lists .NET assemblies and COM components will show
    up. Browse to the location where you installed the ACT, and select the AjaxControlToolkit
    assembly from the Bin folder of the SampleWebsite folder. That''s all there is
    to it. When you''re done, your toolbox will magically look like the one shown
    in Figure 5-3.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_58_0.png)


    Figure 5-3 Creating a new tab in the Visual Studio 2005 toolbox to host the ACT
    components'
  - "[PAGE 59]\n\nChapter 5 The AJAX Control Toolkit 153\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_59_0.png)\n\
    \n> **Note** In the ACT, you find a few server controls (such as *TabContainer*)\
    \ and many more extenders (such as *RoundedCorners*, *DropShadow*, and *TextBoxWatermark*).\
    \ What's the difference between controls and extenders? A *control* provides a\
    \ closed set of functionalities and a well-known, fixed behavior that you can\
    \ rule only through properties and events. An *extender* is a (mostly) client-side\
    \ behavior that can be attached to a variety of controls. For example, you can\
    \ attach the *DropShadow* extender to a *TextBox* as well as to a *Panel* and,\
    \ in both cases, the target control renders out with a shadow. In spite of such\
    \ logical differences, both server controls and extenders are implemented in the\
    \ same way—both are, in the end, ASPNET server controls.\n\n# Registering ACT\
    \ Components with the Page\n\nAlthough the ACT is a native part of the ASP.NET\
    \ AJAX framework and a constituent part of the next ASP.NET platform, as of today\
    \ it is simply an external library. For this reason, you need to explicitly register\
    \ the ACT with each and every page where you happen to use any of its controls\
    \ or extenders. You use the *@Register* directive, as shown here:\n\n```\n<%@\
    \ Register Assembly=\"AjaxControlToolkit\"\n            Namespace=\"AjaxControlToolkit\"\
    \n            TagPrefix=\"act\" %>\n```\n\nIf you don't like the idea of repeating\
    \ the same code for all the pages of a given application, you can take the same\
    \ shortcut that the ASP.NET team took for avoiding the same burden with ASP.NET\
    \ AJAX controls.\n\nIn fact, the same ASP.NET AJAX core library discussed here\
    \ is also an external library to the ASP.NET platform and would need explicit\
    \ registration with each page. In ASP.NET 2.0, you can use the following configuration\
    \ script to enable a *@Register* directive for all pages of the application:\n\
    \n```\n<pages>\n    <controls>\n        <add tagPrefix=\"asp\"\n             namespace=\"\
    System.Web.UI\"\n             assembly=\"System.Web.Extensions, ...\" />\n   \
    \ </controls>\n</pages>\n```\n\nFor example, all controls in the *System.Web.UI*\
    \ namespace are associated with the *asp* tag pre- fix and don't need an explicit\
    \ *@Register* directive in the pages where they're used. You can add a similar\
    \ block to the *web.config* file for ACT controls as well:\n\n```\n<pages>\n \
    \   <controls>\n        <add namespace=\"AjaxControlToolkit\"\n             assembly=\"\
    AjaxControlToolkit, ...\"\n             tagPrefix=\"act\" />\n        ...\n  \
    \  </controls>\n</pages>\n```"
  - '[PAGE 60]


    As you may already know, the string you choose as the tag prefix is arbitrary.
    For the sake of clarity, though, it is not recommended that you choose the *asp*
    prefix as well. The *asp* prefix should be reserved for system controls.


    # What’s in the AJAX Control Toolkit


    The ACT is a library designed to extend the capabilities of the ASP.NET AJAX framework.
    Its control set might change in the future and could be further extended or cut
    down. You can check the progress of the project from the aforementioned CodePlex
    site. At the time of this writing, the ACT contains a fair number of extenders
    and controls, but they certainly don’t address every possible development scenario.


    # Extenders in the ACT


    Table 5-1 lists the components currently available in the ACT. Note that the full
    name of the extender class contains an “Extender” suffix that I omitted in the
    table for brevity. So, for example, there will be no *CollapsiblePanel* component
    in the ACT assembly, but you will find a *CollapsiblePanelExtender* control instead.


    **Table 5-1 Extenders in the ACT**


    | Component | Description |

    | :--- | :--- |

    | *AlwaysVisibleControl* | Pins a control to a corner of the page, and keeps it
    floating over the page background as the user scrolls or resizes the page. You
    use this extender to make sure that, say, a given panel shows up at the top-left
    corner of the page regardless of the scroll position or the size of the browser
    window. |

    | *Animation* | Provides a specialized framework for adding animation effects
    to controls hosted in ASPNET pages. You associate client-side events of the target
    control with one or more of the predefined animation effects. |

    | *AutoComplete* | Associated with a text box, provides a list of suggestions
    for the text to type in the field. |

    | *Calendar* | Attached to a text box, the extender provides client-side date-picking
    functionality with customizable date format and pop-up control. |

    | *CascadingDropDown* | Associated with a *DropDownList* control. This extender
    automatically populates the list with data retrieved from a Web service method.
    The nice thing about this extender is that you can create a hierarchy of drop-down
    lists and have the extender automatically populate child drop-down lists based
    on the current selections in any of the previous lists in the heiararchy, if any.
    |

    | *CollapsiblePanel* | Adds collapsible sections to a Web page. This extender
    can be used only with panel controls—that is, with the ASP.NET *Panel* control
    or any class derived from it. You let the extender know which panel in the page
    acts as the header and which panel provides the contents that collapse and expand.
    |'
- md: '## Table 5-1 Extenders in the ACT (Continued)


    | Component | Description |

    | :--- | :--- |

    | *ConfirmButton* | Associated with a button control. This extender adds a confirmation
    JavaScript dialog box to the click event of the button. The extender is supported
    on any class that implements the *IButtonControl* interface, including *Button*,
    *LinkButton*, and *ImageButton*. |

    | *DragPanel* | Associated with panel controls. This extender adds drag-and-drop
    capabilities so that you can move the panel around the page. You can specify the
    contents to move as well as the handle that, if pressed, triggers the dragging
    operation. |

    | *DropDown* | The extender provides a mouse-over link to open a drop-down panel.
    |

    | *DropShadow* | Adds drop shadows to any control available on the page. With
    this extender, you can specify the opacity and width of the shadow. |

    | *DynamicPopulate* | Updates the contents of a control with the result of a Web
    service or page method call. |

    | *FilteredTextBox* | Lets users enter text in a *TextBox* control that matches
    a given set of valid characters. |

    | *HoverMenu* | Displays the contents of an associated panel control when the
    mouse hovers next to a given control. You can associate this extender with any
    ASP.NET control. The extender works as a kind of specialized and extremely flexible
    ToolTip. |

    | *MaskedEdit* | Lets users enter text in a *TextBox* control according to a given
    input layout. |

    | *ModalPopup* | Associated with a control that can fire a client-side *onclick*
    event (typically, buttons and hyperlinks), this extender implements a classic
    modal dialog box without using HTML dialog boxes. Basically, it displays the contents
    of a given panel and prevents the user from interacting with the rest of the page.
    |

    | *MutuallyExclusiveCheckBox* | Associated with *CheckBox* controls, this extender
    lets you define logical groups of check boxes so that users can check only one
    in each group. |

    | *NoBot* | Applies some *anti-bot* techniques to input forms. Bots, or robot
    applications, are software applications that run automated tasks over the Internet.
    For example, bots are used to fill input forms and submit ad hoc values. |

    | *NumericUpDown* | Associated with text box controls, this extender allows you
    to click automatically displayed buttons to enter the next/previous value in the
    field. It works with numbers, custom lists, and Web service methods. |

    | *PagingBulletedList* | Associated with *BulletedList* controls, this extender
    groups all items bound to the list and organizes them in client-side sorted pages.
    |

    | *PasswordStrength* | Associated with text box controls used to type a password,
    this extender provides visual feedback on the strength of the password being typed.
    |

    | *PopupControl* | Transforms the contents of a given panel into a pop-up window
    without using HTML dialog boxes. You can associate this extender with any control
    that can fire any of the following client-side events: *onfocus*, *onclick*, and
    *onkeydown*. |

    | *ResizableControl* | Attaches to any page element, and allows the user to resize
    the element using a handle placed at the lower-right corner of the control. |

    | *RoundedCorners* | Adds a background panel to any ASP.NET control so that the
    control appears with rounded corners. The overall height of the original control
    changes slightly. |

    | *Slider* | Extends a *TextBox* control with a slider user interface. |

    | *TextBoxWatermark* | Associated with *TextBox* controls. This extender adds
    sample or prompt text, called a "watermark," that illustrates the type of text
    the user is expected to enter in the field. For example, the watermark might say,
    "Type your name here." The watermark text disappears as soon as the user starts
    typing and reappears as the text box becomes empty. |

    | *ToggleButton* | Associated with *CheckBox* controls. This extender enables
    you to use custom images to render the check buttons. You can use different images
    to indicate the selected and cleared states. |

    | *UpdatePanelAnimation* | Plays animations during key steps of a partial update.
    You can use the extender to animate the page both while the panel is being updated
    and when the update has completed. |

    | *ValidatorCallout* | Works on top of ASP.NET validators, and improves their
    user interface. In particular, the extender displays a yellow callout with the
    error message. |


    As you can probably guess, some extenders listed in the table require rich browser
    capabilities, whereas others are just a smart piece of JavaScript code attached
    to a block of markup elements. Note that all these features work in a cross-browser
    way. I’ll return to each of the aforementioned extenders with code samples and
    more details in a moment.


    ## Controls in the ACT


    Along with all the extenders listed in Table 5-1, the ACT also supplies a few
    traditional server controls with rich capabilities: the *Accordion*, *Rating*,
    *ReorderList* and *TabContainer* controls.


    The *Accordion* control allows you to provide multiple collapsible panes and display
    only one at a time. When the user clicks a new pane, the currently displayed pane
    is collapsed to leave room for the new one.


    The *Rating* control provides an intuitive user interface to let users select
    the number of stars that represents their rating of a given subject. The control
    is the wrapped-up version of the user interface that several Web sites provide
    to let users rate published items.


    A data-bound control, *ReorderList*, allows its child elements to be reordered
    on the client using drag-and-drop functionality. To move an item in the list,
    the user drags the item''s handle up to its new position. At the end of the operation,
    the control posts back so that the new status of the data source can be recorded.


    Finally, the *TabContainer* control is a purely client-side container of tabbed
    forms.


    Let''s first get to know more about these controls and then move on to discuss
    extenders.


    ## The *Accordion* Control


    Collapsible panels are a frequent feature in modern and cutting-edge Web sites.
    They allow you to display a short highlight—the header—and keep more text hidden
    and available on demand. The *CollapsiblePanel* extender (discussed later) allows
    you to hide and display any block of markup. But what if you need to build a sort
    of hierarchy of panels?


    The *Accordion* control allows you to group multiple collapsible panels in a single
    control, and it manages the collapsed/expanded state of each panel so that only
    one can be expanded at a time.


    ## Generalities of the *Accordion* Control


    The *Accordion* control contains a collection of child *AccordionPane* controls,
    each of which features a template property to define header and content. Each
    pane can include any HTML, ASP.NET, or ASP.NET AJAX markup you want.


    ### Properties of the Control


    Table 5-2 lists the key properties of the *Accordion* control.


    **Table 5-2 Properties of the *Accordion* Control**


    | Property | Description |

    | --- | --- |

    | *AutoSize* | The value assigned to this property indicates how the control will
    determine its actual size. |

    | *ContentCssClass* | Gets and sets the CSS class used to style the content of
    child panes. |

    | *FadeTransitions* | Indicates whether to use a fade-out transition effect while
    hiding the current pane. This property is set to *false* by default. |

    | *FramesPerSecond* | Gets and sets the number of frames per second used in the
    transition animation for the newly selected pane. This property is set to 30 frames
    by default. |

    | *HeaderCssClass* | Gets and sets the CSS class used to style the header of child
    panes. |

    | *Panes* | Returns the collection of child panes. |

    | *SelectedIndex* | Gets and sets the currently expanded pane. |

    | *TransitionDuration* | Gets and sets the number of milliseconds to animate the
    transition. This property is set to *250* by default. |'
