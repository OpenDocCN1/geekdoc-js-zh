  md: 'and additional rich client controls are provided through a separate download—the
    AJAX Control Toolkit (ACT).


    In this chapter, I''ll first review the syntax and semantics of control extenders
    and then take you on a tour of the major components in the ACT.


    # Extender Controls


    ASP.NET pages are made of server controls. ASP.NET comes with a fairly rich collection
    of built-in controls. In addition, plenty of custom controls are available for
    developers from third-party vendors, from community projects, and even from contributions
    by volunteers. If you need a text box with a set of features that the ASP.NET
    control can''t provide (for example, a numeric text box), you typically write
    one yourself or buy a new specialized control that extends the original control
    and adds the desired behavior. Object orientation, of course, encourages this
    approach.


    However, it''s rare that you need to write a completely new control yourself.
    More often, your control will derive from an existing ASP.NET control base class.
    Blindly using inheritance for building specialized versions of controls might
    not be a wise choice, though. Even in relatively small projects, in fact, it can
    lead straight to a proliferation of controls. For example, you can end up with
    a regular text box, plus a numeric text box, a filtered text box, a text box that
    changes its style when focused, a text box that displays a prompt when left empty,
    and so on. On the other hand, merging all these behaviors into a single super
    *TextBox* control might not be wise either. In this case, the resulting code will
    be literally full of branches, logical conditions, and properties to check. For
    just a simple extra feature, you would load a huge control. There has to be a
    different approach. Enter extender controls.


    # What Is an Extender, Anyway?


    First and foremost, an extender control is a server control itself. It represents
    a logical behavior that can be attached to one or more control types to extend
    their base capabilities.


    # Formalizing the Concept of a "Behavior"


    Imagine you want only the text boxes in a given input form to change their style
    when focused. If you create a new control, say *FocusedTextBox*, you''re fine.
    What if, instead, you want the same behavior from buttons, check boxes, and drop-down
    lists? You should create a bunch of new controls—all of which will extend the
    target controls with the same logical behavior. Extender controls are just a formal
    way to define such a behavior.


    > **Note** Virtually all behaviors require the injection of some script code in
    the client page. For this reason, extenders are naturally associated with ASP.NET
    AJAX. From a technology standpoint, on the other hand, ASP.NET AJAX and extenders
    are independent concepts. You could'
