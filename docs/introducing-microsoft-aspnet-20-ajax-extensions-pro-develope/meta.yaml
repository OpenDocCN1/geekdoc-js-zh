    # The ReorderList Control


    Data-bound lists of data are commonly displayed to Web users and, most of the
    time, are read-only, immutable lists. There might be situations, though, in which
    the end user might want to reorder a displayed list of items. A good example is
    a page on which the user can select multiple cities in the world to be informed
    about the current weather. The cities appear in a given order on the page, but
    the user might want to change the order at some point.


    As a developer, you can add a Move Up button to the page and have the user click
    three times to bring the last city to the top of a list with four cities. Although
    this approach is functionally effective, it is certainly not very user friendly.
    A more natural approach would be to enable the user to simply select the item
    of a given city and drop it to the desired new location.


    This is exactly what the ReorderList control allows you to do. Let''s learn more
    about this new ASP.NET AJAX control.


    # Generalities of the ReorderList Control


    The contents of the ReorderList control are expressed through a series of templates
    that you use to indicate the structure of each data-bound item, the user interface
    for the drag handle, and the user interface for the insertion point where the
    dragged item is being moved. More properties and events, though, interact to form
    the programming interface of the control.


    # Properties of the Control


    Table 5-4 lists the key properties of the ReorderList control. In particular,
    the list describes the properties that can be set through attributes in an ASP.NET
    Web page. The control, in fact, derives from DataBoundControl and implements the
    IRepeatInfoUser interface—the typical interface for controls that support a variety
    of alignments and layouts, such as CheckBoxList. The base class and the interface
    include a bunch of additional properties that relate to data binding and control
    layout.


    | Property | Description |

    | --- | --- |

    | AllowReorder | Indicates whether the control supports drag-and-drop reordering.
    This property is automatically set to true if a reorder template is specified.
    |

    | DataKeyField | Indicates the name of the data-bound source that operates as
    the primary key field. |

    | DataSourceID | Indicates the ID of the data source control used to populate
    the control. |

    | DragHandleAlignment | Indicates the position of the drag handle with respect
    to the item to drag. It can have any of the following values: Top, Left, Bottom,
    or Right. |


    # Table 5-4 Properties of the ReorderList Control'
  merge: -1
