  md: "166 Part II Adding AJAX Capabilities to a Site\n\nTable 5-5 Events of the *ReorderList*\
    \ Control (Continued)\n\n| Event | Description |\n| :--- | :--- |\n| *ItemCreated*\
    \ | Occurs when an item row is created. |\n| *ItemDataBound* | Occurs when an\
    \ item row is bound to its data. |\n| *ItemReorder* | Occurs when an item row\
    \ is moved to a new location at the end of a reorder operation. |\n| *UpdateCommand*\
    \ | Occurs when a button with the *CommandName* of \"Update\" is clicked from\
    \ within the control. |\n\nMost command events are related to the capabilities\
    \ of the bound data source. For example, the *InsertCommand* event occurs if the\
    \ control features a proper template with controls to capture data and invoke\
    \ an *Insert* command on the bound data source control. Here's a quick example:\n\
    \n```\n<act:ReorderList ...>\n    ...\n    <InsertItemTemplate>\n        <div>\n\
    \            <asp:TextBox ID=\"TextBox1\" runat=\"server\"\n                Text='<%#\
    \ Bind(\"Title\") %>'></asp:TextBox>\n            <asp:LinkButton ID=\"LinkButton1\"\
    \ runat=\"server\"\n                CommandName=\"Insert\">Add</asp:LinkButton>\n\
    \        </div>\n    </InsertItemTemplate>\n</act:ReorderList>\n```\n\nBy clicking\
    \ on the link button, you cause the *ReorderList* control to invoke the *Insert*\
    \ command on the bound data source, if there is any. The new item, which will\
    \ have a *Title* property, is added at the top or bottom of the data source based\
    \ on the value of the *ItemInsertLocation* property.\n\nThe *ItemReorder* event\
    \ is fired on the server before the new control is rendered back to the client\
    \ with the new order of items. The event carries a *ReorderListItemReorderEventArgs*\
    \ object with the following structure:\n\n```\npublic class ReorderListItemReorderEventArgs\
    \ : EventArgs\n{\n    public ReorderListItem Item { get; set; }\n    public int\
    \ NewIndex { get; set; }\n    public int OldIndex { get; set; }\n}\n```\n\nThe\
    \ *Item* property indicates the item being moved, whereas *NewIndex* and *OldIndex*\
    \ specify the new and old positions (a 0-based index), respectively.\n\n# Using\
    \ the *ReorderList* Control\n\nLet's consider a sample page that makes use of\
    \ the *ReorderList* control. As you'll see in a moment, the *ReorderList* control\
    \ must be bound to a data source and embedded in an *UpdatePanel* control."
