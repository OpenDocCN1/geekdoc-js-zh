    \ It uses an attribute to mark server methods that can be called from the client.\
    \ This means that you have the greatest flexibility when it comes to defining\
    \ the server public interface callable from the client. In particular, you don't\
    \ have to change the flow of the code or add new ad hoc methods just to comply\
    \ with the requested programming interface."
  - '[PAGE 37]


    In addition, you can register server types for use on the client, which provides
    for a strong-typed data transfer. The AjaxPro infrastructure serializes .NET types
    to JavaScript objects and vice versa. The AJAX.NET hooks up and replaces the standard
    request processing mechanism of ASP.NET—the page handler. As a result, you won''t
    receive classic ASP.NET server events such as Init, Load, and postback. At the
    same time, you won''t have the view state automatically transmitted with each
    out-of-band request. An AjaxPro request, though, is still processed by the ASP.NET
    HTTP runtime, meaning that the request is still subject to the modules registered
    with the HTTP pipeline, including session state management, roles, and authentication.


    For more information about the AjaxPro library, you can take a look at *http://www.ajaxpro.info*.
    There you will also find a link to the CodePlex Web site to get the source code
    of the library.


    # ## The Anthem.NET Framework


    Anthem.NET is a free, cross-browser AJAX toolkit for both ASP.NET 1.1 and 2.0,
    written by Jason Diamond. The library is made of a number of server controls that
    use *XMLHttpRequest* to post back. It sets itself apart from AjaxPro because it
    fully integrates with the classic life cycle of each ASP.NET request. The view
    state is sent across the wire, and server-side page and control events such as
    *Init*, *Load*, and *PreRender* are regularly fired. As a result, you write a
    page using the same programming model of ASP.NET, you are not required to write
    any JavaScript yourself, and you still leverage the beauty of the AJAX model.
    The only difference with a traditional ASP.NET application is that you use a different
    set of server controls, most of which are just subclassed versions of the original
    ASP.NET controls.


    Extremely lean and easy to use, Anthem.NET implements AJAX functionalities through
    the "partial rendering" model applied at the control level. The partial rendering
    model is the same model that ASP.NET AJAX pushes hard. (See Chapter 4, "Partial
    Page Rendering.") For more information, check out *http://www.anthemdotnet.com*.


    # ## The ComfortASP.NET Framework


    Conceptually similar to Anthem.NET, but significantly different in its implementation,
    is Daniel Zeiss'' ComfortASP.NET framework. ComfortASP.NET uses a manager server
    control to inject script code in the client page. Invisible to the page author,
    the script code hooks up client postbacks and replaces them with calls to *XMLHttpRequest*.


    Once back on the server, the manager component takes control of the operations
    and determines the delta between the current page and the page resulting from
    the processing of the current request. The markup that describes the changes in
    the displayed page is sent back and used to dynamically modify the page contents
    on the client via the previously emitted script. The server life cycle of the
    page is executed as usual, and events such as *Init* and *Load* are fired when
    expected.'
