  md: "# 194 Part II Adding AJAX Capabilities to a Site\n\nASP.NET 2.0 *Calendar*\
    \ control requires full-page postbacks, although you can find a number of good\
    \ workarounds for it–from wrapping it up in an updatable panel to using the hover-menu\
    \ extender we considered earlier.\n\nThe *Calendar* extender is the ultimate and,\
    \ I believe, definitive solution. Attached to a text box, it provides client-side\
    \ date-picking functionality with customizable date format and pop-up control.\
    \ You can interact with the calendar by clicking on a day, navigating to a month,\
    \ or selecting a particular link to set the current date. (See Figure 5-22.)\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_100_0.png)\n\n**Figure 5-22** The *Calendar*\
    \ extender in action\n\n```\n<asp:TextBox runat=\"server\" ID=\"TextBox1\" />\n\
    \n<act:CalendarExtender runat=\"server\" ID=\"CalendarExtender1\"\n    TargetControlID=\"\
    TextBox1\"\n    CssClass=\"MyCalendar\"\n    Format=\"dd/MM/yyyy\" />\n```\n\n\
    By clicking on the title of the calendar, you can change the view from days-per-month\
    \ to months-per-year, and even years-per-decade. The *Format* property allows\
    \ you to select the final format of the date, which will be inserted in the bound\
    \ text box. Normally, the calendar pops up when the companion text box gets the\
    \ input focus. However, you can associate the display of the calendar with the\
    \ clicking of an element–for example, an image. The *PopupButtonID* property gets\
    \ and sets the ID of a control to show the calendar popup when clicked.\n\n# The\
    \ FilteredTextBox Extender\n\nThe *FilteredTextBox* extender filters out some\
    \ characters from the buffer of a given text box control. It differs from a validation\
    \ control in that it just prevents users from entering invalid characters, whereas\
    \ a validation control operates at a later time when the user tabs out of the\
    \ input field."
