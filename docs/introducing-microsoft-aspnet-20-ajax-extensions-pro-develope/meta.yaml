- img_proc: true
  md: 'more about the project by visiting the home page of the project on the CodePlex
    Web site. The exact URL is *http://www.codeplex.com/AtlasControlToolkit*.


    If interested, you can become a contributor to the project and have your work
    highlighted. The main purpose of the ACT is to provide a collection of controls
    and extenders that fully benefit from the ASP.NET AJAX programming model and provide
    free and effective Web components to developers. The ACT is expected to remain
    and evolve separately from ASP.NET AJAX. However, chances are that, in the future,
    part of the contents of the ACT assembly will be merged with the ASP.NET core
    binaries. Time will tell.


    As of today, you have two main options for using ACT controls. You can link the
    full assembly to your application, or you can incorporate some of the controls
    as source code in your project. Before you do this, though, make sure you read
    the license page at *http://www.codeplex.com/AtlasControlToolkit/Project/License.aspx*.


    # ## Get Ready for the Toolkit


    To download the latest bits of the ACT, visit the project''s home page on CodePlex:
    *http://www.codeplex.com/AtlasControlToolkit*. Once it is downloaded, the Toolkit
    looks like a ZIP file that you click to unpack and install any contained files.


    # ### The ACT Project


    At the end of the setup, you have a Microsoft Visual Studio 2005 ASP.NET project
    on your hard disk. If you run the project, you should see something like the screen
    shown in Figure 5-2.


