    \ assumed to be a page method defined either in the code file of the page or inline\
    \ through a server `<script>` tag:\n\n```\n[WebMethod]\npublic string GetTimeOnServer(string\
    \ contextKey)\n{\n    // Use contextKey to receive data from the client\n```"
