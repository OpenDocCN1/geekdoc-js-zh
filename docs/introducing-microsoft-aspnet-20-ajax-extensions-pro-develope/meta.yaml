  - '[PAGE 64]


    # Animating the Control


    The *Accordion* control supports animation in two different contexts. First, it
    might optionally fade out the content of the current pane when a new one is selected.
    This effect is controlled by the *FadeTransitions* Boolean property. The effect
    is not very visible on small-sized content panes. Note also that the fade animation
    is tightly coupled with the transition animation that slowly rolls down the content
    of the new pane.


    This second form of animation is controlled by the *TransitionDuration* and *FramesPerSecond*
    properties. If this latter effect is disabled, you won''t see any fade-out effect
    regardless of the setting of the *FadeTransitions* property.


    To skip transition animation completely and obtain a quick swap of panes, you
    set both *FramesPerSecond* and *TransitionDuration* to *0*. If you do so, also
    set *FadeTransitions* to *false* to save the control unnecessary tasks that will
    produce no observable effects.


    # Sizing the Control


    The size of the *Accordion* control is clearly determined by any container element
    as well as the content of the various panes. This means that the overall size
    of the accordion might vary with the selected pane. In this case, other elements
    in the page might be pushed up or down. The *AutoSize* property helps to keep
    the overall size of accordion under control.


    The *AutoSize* property takes its values from the *AutoSize* enumeration, whose
    values are *None* (default), *Limit*, and *Fill*. When the *AutoSize* property
    is set to *None*, the accordion modifies its size freely following the size of
    the selected pane.


    When you set *AutoSize* to *Limit*, the accordion never grows larger than the
    value specified by its *Width* and *Height* properties. The *Accordion* control
    inherits these properties from its base class. The *Height* and *Width* properties
    are both ignored if *None* is set. If the content to display is larger than the
    designated size of the accordion, scrollbars are employed to let users see all
    of it.


    With the *Fill待机模式Fill value set, the accordion stays exactly within the bounding
    box delimited by the *Width* and *Height* properties. In this case, the content
    will be expanded or made scrollable if it isn''t the right size. Expanding the
    contents just means making the pane larger.'
  - "[PAGE 65]\n\n# ## Using the *Accordion* Control\n\nThe accordion consists of\
    \ a number of child panes, each of which is an instance of the *AccordionPane*\
    \ class. You add panes using markup and retrieve the collection of panes programmatically\
    \ using the *Panes* collection property.\n\n# ## The *Accordion* Control in Action\n\
    \nThe following code demonstrates the usage of the *Accordion* control:\n\n```\n\
    <div style=\"width:300px;\">\n  <act:Accordion ID=\"Accordion1\" runat=\"server\"\
    \ Height=\"400px\"\n      SelectedIndex=\"0\"\n      ContentCssClass=\"accordionContent\"\
    \n      HeaderCssClass=\"accordionHeader\"\n      FadeTransitions=\"true\"\n \
    \     AutoSize=\"Fill\">\n    <Panes>\n      <act:AccordionPane ID=\"AccordionPane1\"\
    \ runat=\"server\">\n        <Header>One</Header>\n        <Content>This is the\
    \ first pane</Content>\n      </act:AccordionPane>\n      <act:AccordionPane ID=\"\
    AccordionPane2\" runat=\"server\">\n        <Header>Two</Header>\n        <Content>\n\
    \          <div style=\"height:400px\">\n          This is the second pane</div>\n\
    \        </Content>\n      </act:AccordionPane>\n      <act:AccordionPane ID=\"\
    AccordionPane3\" runat=\"server\">\n        <Header>Three</Header>\n        <Content>This\
    \ is the third pane</Content>\n      </act:AccordionPane>\n      <act:AccordionPane\
    \ ID=\"AccordionPane4\" runat=\"server\">\n        <Header>Four</Header>\n   \
    \     <Content>This is the fourth pane</Content>\n      </act:AccordionPane>\n\
    \    </Panes>\n  </act:Accordion>\n</div>\n```\n\nYou add an `<act:AccordionPane>`\
    \ element for each collapsible panel you want to display. Each pane consists of\
    \ a `<header>` and `<content>` template.\n\nThe sample accordion is embedded in\
    \ a fixed-width `<div>` tag. The outermost container determines the width and\
    \ height of the accordion. The *AutoSize* property set to *Fill* forces the accordion\
    \ to cover and fill the whole bounding box. Figure 5-4 shows the results.\n\n\
    Note that the content of the second pane is set to a height of 400 pixels; the\
    \ accordion itself, though, can't be taller than 400 pixels and can't grow uncontrolled\
    \ because of the *AutoSize*"
