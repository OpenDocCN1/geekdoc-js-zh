- md: " ## Introduction\n\nAJAX stands for \"Asynchronous JavaScript and XML,\" and\
    \ it's a sort of blanket term coined in 2005 to indicate rich, highly interactive,\
    \ and responsive Web applications that do a lot of work on the client and place\
    \ out-of-band calls to the server. An *out-of-band* call is a server request that\
    \ results in a page update rather than a page replacement. The net effect is that\
    \ an AJAX Web application tends to look like a classic desktop Microsoft Windows\
    \ application and has advanced features such as drag-and-drop and asynchronous\
    \ tasks, a strongly responsive and nonflickering user interface, and far less\
    \ user frustration.\n\nASP.NET AJAX Extensions is a significant extension to the\
    \ ASP.NET platform that makes AJAX-style functionalities possible and effective.\
    \ ASP.NET AJAX Extensions is designed to be part of ASP.NET and, therefore, seamlessly\
    \ integrate with the existing platform and application model.\n\nArchitecturally\
    \ speaking, the ASP.NET AJAX framework is made of two distinct elements: a client\
    \ script library and a set of server extensions. The client script library is\
    \ entirely written in JavaScript and, therefore, works with any modern browser.\
    \ Server extensions are fully integrated with ASP.NET server-based services and\
    \ controls. As a result, developers can write rich Web pages using nearly the\
    \ same approach they know from developing classic ASP.NET server-based pages.\n\
    \nMost ASP.NET AJAX developers are former ASP.NET developers and, as such, are\
    \ familiar with the server-side development model based on controls. The server-centric\
    \ programming model is the next big step in the evolution of the ASP.NET programming\
    \ model. ASP.NET AJAX server controls are great, especially if you don't feel\
    \ confident enough to create AJAX client scripts manually.\n\nThis book provides\
    \ an overview of the ASP.NET AJAX framework with numerous examples to familiarize\
    \ you with a variety of techniques and tools.\n\nAJAX is a real breakthrough for\
    \ ASP.NET developers and professionals. It makes cross-browser programming a reality\
    \ and enables desktop-like functionalities over the Web.\n\nIf you're a Web professional\
    \ developing for Microsoft-based Web technologies, AJAX is your next big opportunity\
    \ to seize. This book is your starting point. And even a bit more.\n\n## Who This\
    \ Book Is For\n\nThe book is recommended for virtually any ASP.NET developer and\
    \ professional. As mentioned, ASP.NET AJAX is the next big thing in the ASP.NET\
    \ evolution and follows a key industry trend—the AJAX model. In addition, ASP.NET\
    \ AJAX goes beyond the classic AJAX model, pushing a framework that spans the\
    \ client and server to provide an end-to-end solution for Web applications. As\
    \ far as the Microsoft Web platform is concerned, ASP.NET AJAX Extensions weds\
    \ rich functions with wide reach—an old dream of Web professionals that comes\
    \ true. At last.\n\n## How This Book Is Organized\n\nThe book is divided into\
    \ three parts: an overview of the platform and its building blocks, techniques\
    \ to effectively enhance existing sites, and client-centric development. In the\
    \ first part, you'll learn the basics of the AJAX model and the extensions made\
    \ to the JavaScript language to back it. The second part is dedicated to the elements\
    \ in the framework that you use to add new capabilities to existing server controls\
    \ and to transform existing classic ASP.NET pages into full-fledged AJAX pages.\
    \ Finally, the third part covers tools and techniques that express the real power\
    \ of AJAX applications—out-of-band calls to server code.\n\n## System Requirements\n\
    \nYou'll need the following hardware and software to build and run the code samples\
    \ for this book:\n\n- Microsoft Windows Vista, Microsoft Windows XP with Service\
    \ Pack 2, Microsoft Windows Server 2003 with Service Pack 1, or Microsoft Windows\
    \ 2000 with Service Pack 4\n- Microsoft Visual Studio 2005 Standard Edition or\
    \ Microsoft Visual Studio 2005 Professional Edition\n- Microsoft SQL Server 2005\
    \ Express (included with Visual Studio 2005) or Microsoft SQL Server 2005\n- 600-MHz\
    \ Pentium or compatible processor (1-GHz Pentium recommended)\n- 192 MB of RAM\
    \ (256 MB or more recommended)\n- Video monitor (800 x 600 or higher resolution)\
    \ with at least 256 colors (1024 x 768 High Color 16-bit recommended)\n- Microsoft\
    \ mouse or compatible pointing device\n\n## Configuring SQL Server 2005 Express\
    \ Edition\n\nSome chapters of this book require that you have access to SQL Server\
    \ 2005 Express Edition (or SQL Server 2005) to create and use the Northwind Traders\
    \ database. If you are using SQL Server 2005 Express Edition, follow these steps\
    \ to grant access to the user account that you will be using to perform the exercises\
    \ in this book:\n\n1. Log on to Windows on your computer by using an account with\
    \ administrator privileges.\n\n2. On the Windows Start menu, click All Programs,\
    \ click Accessories, and then click Command Prompt to open a command prompt window.\n\
    \n3. In the command prompt window, type the following case-sensitive command:\n\
    \n    `sqlcmd -S YourServer\\SQLExpress -E`\n\n    Replace `YourServer` with the\
    \ name of your computer.\n\n    You can find the name of your computer by running\
    \ the `hostname` command in the command prompt window before running the `sqlcmd`\
    \ command.\n\n4. At the 1> prompt, type the following command, including the square\
    \ brackets, and then press Enter:\n\n    `sp_grantlogin [YourServer\\UserName]`\n\
    \n    Replace `YourServer` with the name of your computer, and replace `UserName`\
    \ with the name of the user account you will be using.\n\n5. At the 2> prompt,\
    \ type the following command and then press Enter:\n\n    `go`\n\n    If you see\
    \ an error message, make sure that you have typed the **sp_grantlogin** command\
    \ correctly, including the square brackets.\n\n6. At the 1> prompt, type the following\
    \ command, including the square brackets, and then press Enter:\n\n    `sp_addsrvrolemember\
    \ [YourServer\\UserName], dbcreator`\n\n7. At the 2> prompt, type the following\
    \ command and then press Enter:\n\n    `go`\n\n    If you see an error message,\
    \ make sure that you have typed the **sp_addsrvrolemember** command correctly,\
    \ including the square brackets.\n\n8. At the 1> prompt, type the following command\
    \ and then press Enter:\n\n    `exit`\n\n9. Close the command prompt window.\n\
    \n10. Log out of the administrator account.\n\nThe Northwind Traders database\
    \ no longer ships with SQL Server 2005 (either version), so you'll need to download\
    \ that separately. You can download the necessary installation scripts for the\
    \ Northwind database from http://www.microsoft.com/downloads/details.aspx?familyId=06616212-0356-46A0-8DA2-EEBC53A68034&displaylang=en.\
    \ Installation instructions are included on the download page.\n\n## Code Samples\n\
    \nThe downloadable code includes projects for most chapters that cover the code\
    \ snippets and examples referenced in the chapter. All the code samples discussed\
    \ in this book can be downloaded from the book's companion content page at the\
    \ following address:\n\nhttp://www.microsoft.com/mspress/companion/9780735624139\n\
    \n## Support for This Book\n\nEvery effort has been made to ensure the accuracy\
    \ of this book and the companion content. As corrections or changes are collected,\
    \ they will be added to a Microsoft Knowledge Base article.\n\nMicrosoft Press\
    \ provides support for books and companion content at the following Web site:\n\
    \nhttp://www.microsoft.com/learning/support/books/\n\n## Questions and Comments\n\
    \nIf you have comments, questions, or ideas regarding the book or the companion\
    \ content, or questions that are not answered by visiting the site just mentioned,\
    \ please send them to Microsoft Press via e-mail to\n\nmspinput@microsoft.com\n\
    \nOr via postal mail to\n\nMicrosoft Press\nAttn: Introducing Microsoft ASP.NET\
    \ AJAX Editor\nOne Microsoft Way\nRedmond, WA 98052-6399\n\nPlease note that Microsoft\
    \ software product support is not offered through the above addresses.\n\n## Part\
    \ I\n### ASP.NET AJAX Building Blocks\n\n**In this part:**\n\n| Chapter | Title\
    \ | Page |\n|---|---|---|\n| Chapter 1 | The AJAX Revolution | 3 |\n| Chapter\
    \ 2 | The Microsoft Client Library for AJAX | 35 |"
  mdcn: "\n ## 简介\n\nAJAX 的全称是“**Asynchronous JavaScript and XML**”（异步 JavaScript\
    \ 与 XML），它是 2005 年创造的一个通用术语，用来指代那些丰富、高度交互且响应迅速的 Web 应用程序，这类应用会在客户端执行大量工作，并向服务器发起*带外*调用。所谓**带外调用**，是指那些导致页面更新而非页面替换的服务器请求。最终效果是，AJAX\
    \ Web 应用看起来往往类似于经典的桌面 Microsoft Windows 应用程序，具备拖放、异步任务等高级功能，拥有响应迅速且无闪烁的用户界面，用户的挫败感也大大降低。\n\
    \n**ASP.NET AJAX Extensions** 是对 ASP.NET 平台的重要扩展，它使 AJAX 风格的功能成为可能并切实有效。ASP.NET\
    \ AJAX Extensions 被设计为 ASP.NET 的一部分，因此能够与现有平台和应用模型无缝集成。\n\n从架构上讲，ASP.NET AJAX\
    \ 框架由两个截然不同的元素组成：客户端脚本库和一组服务器扩展。客户端脚本库完全使用 JavaScript 编写，因此可在任何现代浏览器中运行。服务器扩展与基于\
    \ ASP.NET 的服务器和控件完全集成。这样一来，开发人员可以使用与开发经典 ASP.NET 服务器页面几乎相同的方法来编写丰富的 Web 页面。\n\n\
    大多数 ASP.NET AJAX 开发人员都是原来的 ASP.NET 开发人员，因此他们熟悉基于控件的服务器端开发模型。以服务器为中心的编程模型是 ASP.NET\
    \ 编程模型演进中的又一个重大进步。ASP.NET AJAX 服务器控件非常出色，尤其是当你对手动创建 AJAX 客户端脚本不够自信时。\n\n本书提供了\
    \ ASP.NET AJAX 框架的概览，并附有大量示例，帮助你熟悉各种技巧和工具。\n\nAJAX 对 ASP.NET 开发人员和专业人士而言是一个真正的突破。它使跨浏览器编程成为现实，并让类似桌面的功能可以通过\
    \ Web 实现。\n\n如果你是一位为基于 Microsoft 的 Web 技术进行开发的专业 Web 人员，AJAX 是你接下来要把握的重大机遇。本书是你的起点。而且还不止于此。\n\
    \n## 本书面向的读者\n\n本书推荐几乎所有 ASP.NET 开发人员和专业人士阅读。如前所述，ASP.NET AJAX 是 ASP.NET 演进中的下一个重要成果，它顺应了一个关键的行业趋势——AJAX\
    \ 模型。此外，ASP.NET AJAX 超越了经典的 AJAX 模型，推出了一套横跨客户端和服务器的框架，为 Web 应用提供端到端的解决方案。就 Microsoft\
    \ Web 平台而言，ASP.NET AJAX Extensions 将丰富功能与广泛覆盖范围结合在一起——这是 Web 专业人士长久以来的梦想，如今终于实现。终于。\n\
    \n## 本书的组织结构\n\n本书分为三个部分：平台及其构建模块的概览、有效增强现有站点的技巧，以及以客户端为中心的开发。在第一部分中，你将了解 AJAX\
    \ 模型的基础知识，以及为支持它而对 JavaScript 语言所做的扩展。第二部分专门介绍框架中的元素，你可以使用这些元素为现有服务器控件添加新功能，并将现有经典\
    \ ASP.NET 页面转换为功能完备的 AJAX 页面。最后，第三部分涵盖了展现 AJAX 应用真正威力的工具和技巧——对服务器代码的带外调用。\n\n\
    ## 系统要求\n\n你需要以下硬件和软件来构建和运行本书的代码示例：\n\n- Microsoft Windows Vista、Microsoft Windows\
    \ XP with Service Pack 2、Microsoft Windows Server 2003 with Service Pack 1，或 Microsoft\
    \ Windows 2000 with Service Pack 4\n- Microsoft Visual Studio 2005 Standard Edition\
    \ 或 Microsoft Visual Studio 2005 Professional Edition\n- Microsoft SQL Server\
    \ 2005 Express（包含在 Visual Studio 2005 中）或 Microsoft SQL Server 2005\n- 600-MHz\
    \ Pentium 或兼容处理器（建议使用 1-GHz Pentium）\n- 192 MB RAM（建议使用 256 MB 或更多）\n- 视频显示器（800\
    \ x 600 或更高分辨率），至少支持 256 色（建议使用 1024 x 768 高彩色 16 位）\n- Microsoft 鼠标或兼容的定点设备\n\
    \n## 配置 SQL Server 2005 Express Edition\n\n本书的某些章节要求你能够访问 SQL Server 2005 Express\
    \ Edition（或 SQL Server 2005），以创建和使用 Northwind Traders 数据库。如果你使用的是 SQL Server 2005\
    \ Express Edition，请按照以下步骤为你将用于完成本书练习的用户账户授予访问权限：\n\n1. 使用具有管理员权限的账户登录到计算机上的 Windows。\n\
    \n2. 在 Windows 的“开始”菜单中，依次单击“所有程序”、“附件”，然后单击“命令提示符”以打开命令提示符窗口。\n\n3. 在命令提示符窗口中，输入以下区分大小写的命令：\n\
    \n    `sqlcmd -S YourServer\\SQLExpress -E`\n\n    将 `YourServer` 替换为你计算机的名称。\n\
    \n    你可以在运行 `sqlcmd` 命令之前，先在命令提示符窗口中运行 `hostname` 命令来查找你计算机的名称。\n\n4. 在 `1>`\
    \ 提示符下，输入以下命令（包括方括号），然后按 Enter：\n\n    `sp_grantlogin [YourServer\\UserName]`\n\
    \n    将 `YourServer` 替换为你计算机的名称，并将 `UserName` 替换为你将要使用的用户账户名称。\n\n5. 在 `2>` 提示符下，输入以下命令，然后按\
    \ Enter：\n\n    `go`\n\n    如果你看到错误消息，请确保你已正确输入 **sp_grantlogin** 命令，包括方括号。\n\n\
    6. 在 `1>` 提示符下，输入以下命令（包括方括号），然后按 Enter：\n\n    `sp_addsrvrolemember [YourServer\\\
    UserName], dbcreator`\n\n7. 在 `2>` 提示符下，输入以下命令，然后按 Enter：\n\n    `go`\n\n    如果你看到错误消息，请确保你已正确输入\
    \ **sp_addsrvrolemember** 命令，包括方括号。\n\n8. 在 `1>` 提示符下，输入以下命令，然后按 Enter：\n\n  \
    \  `exit`\n\n9. 关闭命令提示符窗口。\n\n10. 注销管理员账户。\n\nNorthwind Traders 数据库不再随 SQL Server\
    \ 2005（任一版本）一起提供，因此你需要单独下载。你可以从 http://www.microsoft.com/downloads/details.aspx?familyId=06616212-0356-46A0-8DA2-EEBC53A68034&displaylang=en\
    \ 下载 Northwind 数据库所需的安装脚本。下载页面上包含安装说明。\n\n##  code 示例\n\n可下载的代码包含大多数章节的项目，涵盖了各章节中引用的代码片段和示例。本书中讨论的所有代码示例都可以从本书的配套内容页面下载，地址如下：\n\
