  - "[PAGE 55]\n\n# Using the Focus Extender Control\n\nTo use the sample extender\
    \ in an ASP.NET page, you first register the control using the @Register directive:\n\
    \n```\n<%@ Register Namespace=\"IntroAjax.Controls\" TagPrefix=\"x\" %>\n```\n\
    \nThe host page must also have a script manager just as any other ASP.NET AJAX\
    \ page. Imagine a sample page with three text boxes and a button that you want\
    \ to change style when focused. Here is what the code looks like:\n\n```\n<asp:ScriptManager\
    \ ID=\"ScriptManager1\" runat=\"server\" />\n<table>\n    <tr>\n        <td><asp:Label\
    \ runat=\"server\" ID=\"Label1\">Name</asp:Label></td>\n        <td><asp:TextBox\
    \ ID=\"TextBox1\" runat=\"server\" /></td>\n    </tr>\n    <tr>\n        <td><asp:Label\
    \ runat=\"server\" ID=\"Label2\">Phone</asp:Label></td>\n        <td><asp:TextBox\
    \ ID=\"TextBox2\" runat=\"server\" /></td>\n    </tr>\n    <tr>\n        <td><asp:Label\
    \ runat=\"server\" ID=\"Label3\">E-mail</asp:Label></td>\n        <td><asp:TextBox\
    \ ID=\"TextBox3\" runat=\"server\" /></td>\n    </tr>\n</table>\n<asp:Button runat=\"\
    server\" ID=\"Button1\" Text=\"Submit Form\" />\n```\n\nYou extend these controls\
    \ through the focus extender using the following ASP.NET markup:\n\n```\n<x:FocusExtender\
    \ ID=\"FocusExtender1\" runat=\"server\"\n        NormalCssClass=\"Normal\"\n\
    \        HighlightCssClass=\"HighLight\"\n        TargetControlID=\"TextBox1\"\
    \ />\n<x:FocusExtender ID=\"FocusExtender2\" runat=\"server\"\n        NormalCssClass=\"\
    Normal\"\n        HighlightCssClass=\"HighLight\"\n        TargetControlID=\"\
    TextBox2\" />\n<x:FocusExtender ID=\"FocusExtender3\" runat=\"server\"\n     \
    \   NormalCssClass=\"Normal\"\n        HighlightCssClass=\"HighLight\"\n     \
    \   TargetControlID=\"TextBox3\" />\n<x:FocusExtender ID=\"FocusExtender4\" runat=\"\
    server\"\n        NormalCssClass=\"NormalButton\"\n        HighlightCssClass=\"\
    HighLightButton\"\n        TargetControlID=\"Button1\" />\n```\n\nAs you can see,\
    \ each instance of the extender is bound to a particular target control and sets\
    \ properties. In particular, all text boxes share the same normal and highlighted\
    \ CSS styles. Figure 5-1 shows the sample page in action."
- md: "**Figure 5-1** The focus extender in action\n\nIn the code snippet, *Normal*\
    \ and *HighLight* are just CSS classes. Here's a possible definition:\n\n```css\n\
    .Normal {\n    background-color: #FFFFEE;\n}\n.HighLight {\n    background-color:\
    \ Orange;\n}\n.NormalButton {\n    font-weight: normal;\n    width: 100px;\n}\n\
    .HighLightButton {\n    font-weight: bold;\n    width: 100px;\n}\n```\n\nCSS classes\
    \ are the preferred way to define visual properties for behaviors and client controls\
    \ because they let you group multiple visual attributes in a single object and,\
    \ subsequently, a single class property of type *string*.\n\n## Introducing the\
    \ AJAX Control Toolkit\n\nAs mentioned, currently the vast majority of control\
    \ extenders are compiled into an assembly known as the AJAX Control Toolkit. This\
    \ assembly is a separate download and must be registered with any applications\
    \ in which you plan to use it. The ACT project is an open-source project that\
    \ results from a joint effort of Microsoft and the ASP.NET community. You can\
    \ learn more about the project by visiting the home page of the project on the\
    \ CodePlex Web site. The exact URL is *http://www.codeplex.com/AtlasControlToolkit*.\n\
    \nIf interested, you can become a contributor to the project and have your work\
    \ highlighted. The main purpose of the ACT is to provide a collection of controls\
    \ and extenders that fully benefit from the ASP.NET AJAX programming model and\
    \ provide free and effective Web components to developers. The ACT is expected\
    \ to remain and evolve separately from ASP.NET AJAX. However, chances are that,\
    \ in the future, part of the contents of the ACT assembly will be merged with\
    \ the ASP.NET core binaries. Time will tell.\n\nAs of today, you have two main\
    \ options for using ACT controls. You can link the full assembly to your application,\
    \ or you can incorporate some of the controls as source code in your project.\
    \ Before you do this, though, make sure you read the license page at *http://www.codeplex.com/AtlasControlToolkit/Project/License.aspx*.\n\
    \n### Get Ready for the Toolkit\n\nTo download the latest bits of the ACT, visit\
    \ the project's home page on CodePlex: *http://www.codeplex.com/AtlasControlToolkit*.\
    \ Once it is downloaded, the Toolkit looks like a ZIP file that you click to unpack\
    \ and install any contained files.\n\n#### The ACT Project\n\nAt the end of the\
    \ setup, you have a Microsoft Visual Studio 2005 ASP.NET project on your hard\
    \ disk. If you run the project, you should see something like the screen shown\
    \ in Figure 5-2.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_57_0.png)\n\nFigure\
    \ 5-2 The sample Web site built to illustrate the facilities in the ACT\n\nIf\
    \ you take a tour of the project files, you'll see that the ACT is a collection\
    \ of ASP.NET AJAX controls and extenders plus many examples that illustrate their\
    \ functionality and tests. In addition, the ACT contains a development kit to\
    \ simplify the creation and re-use of your own custom controls and extenders.\
    \ The development kit includes Visual Studio 2005 templates for Visual Basic and\
    \ Visual C# to let developers write their own controls and extenders. In addition,\
    \ it features a library of helper classes to speed up the creation of controls\
    \ and extenders.\n\n## Adding ACT Components to the Toolbox\n\nSo the ACT contains\
    \ a number of controls and extenders that you might want to compose and combine\
    \ in your ASP.NET pages. The Visual Studio 2005 toolbox appears to be the perfect\
    \ place to list all these components so that developers can pick up exactly the\
    \ one they need and paste it to the current page. To add ACT components to the\
    \ toolbox, you first create a new tab in the toolbox. You right-click on the toolbox\
    \ surface and select Add Tab from the context menu. Once the new tab is added,\
    \ you can give it any name you want—for example, AJAX Control Toolkit.\n\nNext,\
    \ you populate the tab with all components in the ACT assembly. To do this, you\
    \ right-click the toolbox area below the newly added tab and select Choose Items.\
    \ The standard dialog box that lists .NET assemblies and COM components will show\
    \ up. Browse to the location where you installed the ACT, and select the AjaxControlToolkit\
    \ assembly from the Bin folder of the SampleWebsite folder. That's all there is\
    \ to it. When you're done, your toolbox will magically look like the one shown\
    \ in Figure 5-3.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_58_0.png)\n\nFigure\
    \ 5-3 Creating a new tab in the Visual Studio 2005 toolbox to host the ACT components\n\
    \nChapter 5 The AJAX Control Toolkit 153\n\n> **Note** In the ACT, you find a\
    \ few server controls (such as *TabContainer*) and many more extenders (such as\
    \ *RoundedCorners*, *DropShadow*, and *TextBoxWatermark*). What's the difference\
    \ between controls and extenders? A *control* provides a closed set of functionalities\
    \ and a well-known, fixed behavior that you can rule only through properties and\
    \ events. An *extender* is a (mostly) client-side behavior that can be attached\
    \ to a variety of controls. For example, you can attach the *DropShadow* extender\
    \ to a *TextBox* as well as to a *Panel* and, in both cases, the target control\
    \ renders out with a shadow. In spite of such logical differences, both server\
    \ controls and extenders are implemented in the same way—both are, in the end,\
    \ ASP.NET server controls.\n\n## Registering ACT Components with the Page\n\n\
    Although the ACT is a native part of the ASP.NET AJAX framework and a constituent\
    \ part of the next ASP.NET platform, as of today it is simply an external library.\
    \ For this reason, you need to explicitly register the ACT with each and every\
    \ page where you happen to use any of its controls or extenders. You use the *@Register*\
    \ directive, as shown here:\n\n```\n<%@ Register Assembly=\"AjaxControlToolkit\"\
    \n            Namespace=\"AjaxControlToolkit\"\n            TagPrefix=\"act\"\
    \ %>\n```\n\nIf you don't like the idea of repeating the same code for all the\
    \ pages of a given application, you can take the same shortcut that the ASP.NET\
    \ team took for avoiding the same burden with ASP.NET AJAX controls.\n\nIn fact,\
    \ the same ASP.NET AJAX core library discussed here is also an external library\
    \ to the ASP.NET platform and would need explicit registration with each page.\
    \ In ASP.NET 2.0, you can use the following configuration script to enable a *@Register*\
    \ directive for all pages of the application:\n\n```\n<pages>\n    <controls>\n\
    \        <add tagPrefix=\"asp\"\n             namespace=\"System.Web.UI\"\n  \
    \           assembly=\"System.Web.Extensions, ...\" />\n    </controls>\n</pages>\n\
    ```\n\nFor example, all controls in the *System.Web.UI* namespace are associated\
    \ with the *asp* tag prefix and don't need an explicit *@Register* directive in\
    \ the pages where they're used. You can add a similar block to the *web.config*\
    \ file for ACT controls as well:\n\n```\n<pages>\n    <controls>\n        <add\
    \ namespace=\"AjaxControlToolkit\"\n             assembly=\"AjaxControlToolkit,\
    \ ...\"\n             tagPrefix=\"act\" />\n        ...\n    </controls>\n</pages>\n\
    ```\n\nAs you may already know, the string you choose as the tag prefix is arbitrary.\
    \ For the sake of clarity, though, it is not recommended that you choose the *asp*\
    \ prefix as well. The *asp* prefix should be reserved for system controls.\n\n\
    ## What’s in the AJAX Control Toolkit\n\nThe ACT is a library designed to extend\
    \ the capabilities of the ASP.NET AJAX framework. Its control set might change\
    \ in the future and could be further extended or cut down. You can check the progress\
    \ of the project from the aforementioned CodePlex site. At the time of this writing,\
    \ the ACT contains a fair number of extenders and controls, but they certainly\
    \ don’t address every possible development scenario.\n\n## Extenders in the ACT\n\
    \nTable 5-1 lists the components currently available in the ACT. Note that the\
    \ full name of the extender class contains an “Extender” suffix that I omitted\
    \ in the table for brevity. So, for example, there will be no *CollapsiblePanel*\
    \ component in the ACT assembly, but you will find a *CollapsiblePanelExtender*\
    \ control instead.\n\n**Table 5-1 Extenders in the ACT**\n\n| Component | Description\
    \ |\n| :--- | :--- |\n| *AlwaysVisibleControl* | Pins a control to a corner of\
    \ the page, and keeps it floating over the page background as the user scrolls\
    \ or resizes the page. You use this extender to make sure that, say, a given panel\
    \ shows up at the top-left corner of the page regardless of the scroll position\
    \ or the size of the browser window. |\n| *Animation* | Provides a specialized\
    \ framework for adding animation effects to controls hosted in ASP.NET pages.\
    \ You associate client-side events of the target control with one or more of the\
    \ predefined animation effects. |\n| *AutoComplete* | Associated with a text box,\
    \ provides a list of suggestions for the text to type in the field. |\n| *Calendar*\
    \ | Attached to a text box, the extender provides client-side date-picking functionality\
    \ with customizable date format and pop-up control. |\n| *CascadingDropDown* |\
    \ Associated with a *DropDownList* control. This extender automatically populates\
    \ the list with data retrieved from a Web service method. The nice thing about\
    \ this extender is that you can create a hierarchy of drop-down lists and have\
    \ the extender automatically populate child drop-down lists based on the current\
    \ selections in any of the previous lists in the hierarchy, if any. |\n| *CollapsiblePanel*\
    \ | Adds collapsible sections to a Web page. This extender can be used only with\
    \ panel controls—that is, with the ASP.NET *Panel* control or any class derived\
    \ from it. You let the extender know which panel in the page acts as the header\
    \ and which panel provides the contents that collapse and expand. |"
  mdcn: "\n**图 5-1** 聚焦扩展器的实际应用\n\n在代码片段中，*Normal* 和 *HighLight* 只是 CSS 类。以下是一种可能的定义：\n\
    \n```css\n.Normal {\n    background-color: #FFFFEE;\n}\n.HighLight {\n    background-color:\
    \ Orange;\n}\n.NormalButton {\n    font-weight: normal;\n    width: 100px;\n}\n\
    .HighLightButton {\n    font-weight: bold;\n    width: 100px;\n}\n```\n\nCSS 类是定义行为和客户端控件可视化属性的首选方式，因为它们允许你将多个可视化属性分组到单个对象中，进而封装为单个*字符串*类型的类属性。\n\
    \n## AJAX 控件工具包简介\n\n如前所述，目前绝大多数控件扩展器都已编译成一个名为 AJAX 控件工具包的程序集。该程序集是一个独立的下载文件，必须在任何计划使用它的应用程序中进行注册。ACT\
    \ 项目是一个开源项目，由 Microsoft 和 ASP.NET 社区合作创建。你可以通过访问 CodePlex 网站上的项目主页来了解更多关于该项目的信息。确切的\
    \ URL 是 *http://www.codeplex.com/AtlasControlToolkit*。\n\n如果你有兴趣，可以成为该项目的贡献者，并让你的工作得以展示。ACT\
    \ 的主要目的是提供一组充分利用 ASP.NET AJAX 编程模型的控件和扩展器，为开发者提供免费且有效的 Web 组件。ACT 预计将继续与 ASP.NET\
    \ AJAX 分开发展和演进。然而，未来 ACT 程序集的部分内容很可能会与 ASP.NET 核心二进制文件合并。时间会证明一切。\n\n截至目前，你主要有两种方式使用\
    \ ACT 控件。你可以将完整的程序集链接到你的应用程序，或者你可以将部分控件作为源代码合并到你的项目中。不过在执行此操作之前，请务必阅读许可证页面：*http://www.codeplex.com/AtlasControlToolkit/Project/License.aspx*。\n\
    \n### 为使用工具包做好准备\n\n要下载 ACT 的最新版本，请访问 CodePlex 上的项目主页：*http://www.codeplex.com/AtlasControlToolkit*。下载后，工具包看起来像一个\
    \ ZIP 文件，你需要点击解压并安装其中包含的所有文件。\n\n#### ACT 项目\n\n安装完成后，你的硬盘上会有一个 Microsoft Visual\
    \ Studio 2005 ASP.NET 项目。如果你运行该项目，你应该会看到如图 5-2 所示的界面。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_57_0.png)\n\
    \n图 5-2 为展示 ACT 功能而构建的示例网站\n\n如果你浏览项目文件，你会发现 ACT 是一组 ASP.NET AJAX 控件和扩展器的集合，外加许多展示其功能和进行测试的示例。此外，ACT\
    \ 包含一个开发工具包，用于简化你自定义控件和扩展器的创建与复用。该开发工具包包含适用于 Visual Basic 和 Visual C# 的 Visual\
    \ Studio 2005 模板，让开发者可以编写自己的控件和扩展器。此外，它还提供了一个辅助类库，以加速控件和扩展器的创建过程。\n\n## 将 ACT\
    \ 组件添加到工具箱\n\n因此，ACT 包含了大量控件和扩展器，你可能希望将它们组合并整合到你的 ASP.NET 页面中。Visual Studio 2005\
    \ 工具箱似乎是列出所有这些组件的完美场所，这样开发者就可以精确选取所需的组件并将其粘贴到当前页面。要将 ACT 组件添加到工具箱，首先需要在工具箱中创建一个新选项卡。右键单击工具箱界面，从上下文菜单中选择“添加选项卡”。添加新选项卡后，你可以为其指定任何名称——例如\
    \ AJAX 控件工具包。\n\n接下来，你需要用 ACT 程序集中的所有组件填充该选项卡。为此，右键单击新添加选项卡下方的工具箱区域，然后选择“选择项”。此时会显示一个列出\
    \ .NET 程序集和 COM 组件的标准对话框。浏览到你安装 ACT 的位置，然后从 SampleWebsite 文件夹的 Bin 文件夹中选择 AjaxControlToolkit\
    \ 程序集。就是这么简单。完成后，你的工具箱将神奇地变成图 5-3 所示的样子。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_58_0.png)\n\
    \n图 5-3 在 Visual Studio 2005 工具箱中创建一个新选项卡以承载 ACT 组件\n\n第 5 章 AJAX 控件工具包 153\n\n\
    > **注意** 在 ACT 中，你会发现一些服务器控件（如 *TabContainer*）和更多的扩展器（如 *RoundedCorners*、*DropShadow*\
    \ 和 *TextBoxWatermark*）。控件和扩展器之间有什么区别？*控件*提供一组封闭的功能和一个已知的、固定的行为，你只能通过属性和事件来控制它。而*扩展器*是一个（主要是）客户端行为，可以附加到各种控件上。例如，你可以将\
    \ *DropShadow* 扩展器附加到 *TextBox*，也可以附加到 *Panel*，在两种情况下，目标控件都会带有阴影进行渲染。尽管存在这些逻辑上的区别，但服务器控件和扩展器的实现方式相同——它们最终都是\
    \ ASP.NET 服务器控件。\n\n## 在页面中注册 ACT 组件\n\n尽管 ACT 是 ASP.NET AJAX 框架的原生部分，也是下一代 ASP.NET\
    \ 平台的组成部分，但截至目前，它仅仅是一个外部库。因此，你需要在每一个使用其控件或扩展器的页面上显式注册 ACT。你可以使用 *@Register* 指令，如下所示：\n\
    \n```\n<%@ Register Assembly=\"AjaxControlToolkit\"\n            Namespace=\"\
    AjaxControlToolkit\"\n            TagPrefix=\"act\" %>\n```\n\n如果你不喜欢在应用程序的所有页面中重复相同的代码，可以采用\
    \ ASP.NET 团队为避免在 ASP.NET AJAX 控件上承担同样负担而采取的捷径。\n\n事实上，这里讨论的同一个 ASP.NET AJAX 核心库对于\
    \ ASP.NET 平台来说也是一个外部库，也需要在每个页面上显式注册。在 ASP.NET 2.0 中，你可以使用以下配置脚本为应用程序的所有页面启用 *@Register*\
    \ 指令：\n\n```\n<pages>\n    <controls>\n        <add tagPrefix=\"asp\"\n      \
    \       namespace=\"System.Web.UI\"\n             assembly=\"System.Web.Extensions,\
    \ ...\" />\n    </controls>\n</pages>\n```\n\n例如，*System.Web.UI* 命名空间中的所有控件都与\
    \ *asp* 标签前缀关联，无需在其使用的页面中进行显式 *@Register* 注册。你也可以为 ACT 控件添加类似的配置块到 *web.config*\
    \ 文件中：\n\n```\n<pages>\n    <controls>\n        <add namespace=\"AjaxControlToolkit\"\
    \n             assembly=\"AjaxControlToolkit, ...\"\n             tagPrefix=\"\
    act\" />\n        ...\n    </controls>\n</pages>\n```\n\n正如你可能已经知道的，你选择作为标签前缀的字符串是任意的。不过，为了清晰起见，建议不要同时选择\
    \ *asp* 前缀。*asp* 前缀应保留给系统控件使用。\n\n## AJAX 控件工具包包含什么\n\nACT 是一个旨在扩展 ASP.NET AJAX\
    \ 框架能力的库。其控件集在未来可能会发生变化，可能会进一步扩展或精简。你可以从上述 CodePlex 网站查看项目的进展。在撰写本文时，ACT 包含了大量的扩展器和控件，但它们当然无法覆盖所有可能的开发场景。\n\
    \n## ACT 中的扩展器\n\n表 5-1 列出了 ACT 中当前可用的组件。请注意，扩展器类的全名包含一个“Extender”后缀，为简洁起见，我在表格中省略了它。因此，例如，ACT\
    \ 程序集中不会存在 *CollapsiblePanel* 组件，但你会找到一个 *CollapsiblePanelExtender* 控件。\n\n**表\
    \ 5-1 ACT 中的扩展器**\n\n| 组件 | 描述 |\n| :--- | :--- |\n| *AlwaysVisibleControl* |\
    \ 将控件固定在页面的某个角落，并在用户滚动或调整页面大小时使其保持浮动在页面背景之上。使用此扩展器可以确保，例如，某个给定面板始终显示在页面的左上角，无论滚动位置或浏览器窗口大小如何。\
    \ |\n| *Animation* | 提供一个专门的框架，用于向 ASP.NET 页面中托管的控件添加动画效果。你可以将目标控件的客户端事件与一个或多个预定义的动画效果关联起来。\
    \ |\n| *AutoComplete* | 与一个文本框关联，为用户在字段中输入的文本提供一个建议列表。 |\n| *Calendar* | 附加到一个文本框，此扩展器提供客户端的日期选择功能，具有可自定义的日期格式和弹出控件。\
    \ |\n| *CascadingDropDown* | 与一个 *DropDownList* 控件关联。此扩展器使用从 Web 服务方法检索的数据自动填充列表。此扩展器的妙处在于，你可以创建级联下拉列表的层次结构，并让扩展器根据层次结构中任何先前列表（如果有）的当前选择，自动填充子下拉列表。\
    \ |\n| *CollapsiblePanel* | 为网页添加可折叠的部分。此扩展器只能与面板控件一起使用——即与 ASP.NET 的 *Panel*\
