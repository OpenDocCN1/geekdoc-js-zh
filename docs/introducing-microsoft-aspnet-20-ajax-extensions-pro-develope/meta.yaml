  - "[PAGE 95]\n\nlower-right corner of the element, the handle lets the user resize\
    \ the element as if it were a window. Let's consider the following markup:\n\n\
    ```\n<asp:Panel ID=\"Panel1\" runat=\"server\" Style=\"overflow:hidden\"\n   \
    \       Width=\"130px\" Height=\"65px\">\n    <asp:Image ID=\"Image1\" runat=\"\
    server\" ImageUrl=\"~/images/ajax.gif\"\n             Style=\"width:100%; height:100%;\"\
    \ />\n</asp:Panel>\n\n<asp:Panel ID=\"Panel2\" runat=\"server\" Style=\"overflow:auto\"\
    \n          Width=\"130px\" height=\"100px\">\n    This text resizes itself to\
    \ be as large as possible\n    within its container.\n</asp:Panel>\n```\n\nAs\
    \ you can see, the first panel contains an image; the second includes plain text.\
    \ Some CSS attributes are necessary for the extender to work properly. In particular,\
    \ you might want to set the overflow attribute to *hidden* for images and to *auto*\
    \ for text. The *overflow* attribute controls the appearance of scrollbars when\
    \ the contents of the element exceeds the reserved space. In the example, I stretch\
    \ or shrink the image and scroll the text.\n\nIt is important to give panels an\
    \ initial correct size. In particular, for images you should give the surrounding\
    \ panel the same size of the image. Panels surrounding a block of text should\
    \ be given an explicit size too.\n\n```\n<act:ResizableControlExtender ID=\"Resizable1\"\
    \ runat=\"server\"\n    TargetControlID=\"Panel1\"\n    ResizableCssClass=\"resizingStyle\"\
    \n    HandleCssClass=\"handleStyle\" />\n<act:ResizableControlExtender ID=\"Resizable2\"\
    \ runat=\"server\"\n    TargetControlID=\"Panel2\"\n    ResizableCssClass=\"resizingStyle\"\
    \n    HandleCssClass=\"handleStyle\" />\n```\n\nThe *ResizableControl* extender\
    \ features two mandatory properties: *TargetControlID* and *HandleCssClass*. The\
    \ former indicates the control to resize; the latter sets the name of the CSS\
    \ class to apply to the resize handle. In addition, *ResizableCssClass* is the\
    \ CSS class to apply to the element when resizing. You might want to use this\
    \ class to change or thicken the color of the border to emphasize the operation.\
    \ Here's a typical handle CSS class:\n\n```\n.handleStyle\n{\n    width:16px;\n\
    \    height:16px;\n    background-image:url(~/images/HandleGrip.gif);\n    overflow:hidden;\n\
    \    cursor:se-resize;\n}\n```"
  - "[PAGE 96]\n\nFigure 5-19 shows the extender in action.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_96_0.png)\n\
    \nFigure 5-19  The *ResizableControl* extender in action\n\nThe *ResizableControl*\
    \ extender also features two client events (*onresizing* and *onresize*) that\
    \ can trigger some JavaScript code to do more complex things, such as increasing\
    \ the font size to fit a larger area. The extender allows you to define a minimum\
    \ and maximum size for the elements being resized. Any changes resulting from\
    \ control resizing are automatically persisted across postbacks.\n\n# The *RoundedCorners*\
    \ Extender\n\nThe *RoundedCorners* extender is a subset of the *DropShadow* extender,\
    \ as it is limited to rounding the corners of child panels:\n\n```\n<asp:Panel\
    \ runat=\"server\" ID=\"Panel1\" BackColor=\"LightBlue\" Width=\"170px\">\n  \
    \  <div style=\"margin-left:2px\">\n        <asp:TextBox ID=\"TextBox1\" runat=\"\
    server\"\n                     BackColor=\"LightBlue\"\n                     BorderWidth=\"\
    0px\" />\n    </div>\n</asp:Panel>\n\n<act:RoundedCornersExtender ID=\"RoundedCornerExtender1\"\
    \ runat=\"server\"\n    TargetControlID=\"Panel1\" Radius=\"6\" Color=\"LightBlue\"\
    \ />\n```\n\nThe extender accepts arguments to set the target control and define\
    \ the desired radius of the rounded corner and the color of the surrounding border.\
    \ The rounded corner, in fact, is obtained by rendering an additional border all\
    \ around the target control. By removing all borders around the text box and using\
    \ the same background color for the panel and the text box, you can obtain the\
    \ nice effect shown in Figure 5-20—a rounded text box control."
