    # What’s in the AJAX Control Toolkit


    The ACT is a library designed to extend the capabilities of the ASP.NET AJAX framework.
    Its control set might change in the future and could be further extended or cut
    down. You can check the progress of the project from the aforementioned CodePlex
    site. At the time of this writing, the ACT contains a fair number of extenders
    and controls, but they certainly don’t address every possible development scenario.


    # Extenders in the ACT


    Table 5-1 lists the components currently available in the ACT. Note that the full
    name of the extender class contains an “Extender” suffix that I omitted in the
    table for brevity. So, for example, there will be no *CollapsiblePanel* component
    in the ACT assembly, but you will find a *CollapsiblePanelExtender* control instead.


    **Table 5-1 Extenders in the ACT**


    | Component | Description |

    | :--- | :--- |

    | *AlwaysVisibleControl* | Pins a control to a corner of the page, and keeps it
    floating over the page background as the user scrolls or resizes the page. You
    use this extender to make sure that, say, a given panel shows up at the top-left
    corner of the page regardless of the scroll position or the size of the browser
    window. |

    | *Animation* | Provides a specialized framework for adding animation effects
    to controls hosted in ASPNET pages. You associate client-side events of the target
    control with one or more of the predefined animation effects. |

    | *AutoComplete* | Associated with a text box, provides a list of suggestions
    for the text to type in the field. |

    | *Calendar* | Attached to a text box, the extender provides client-side date-picking
    functionality with customizable date format and pop-up control. |

    | *CascadingDropDown* | Associated with a *DropDownList* control. This extender
    automatically populates the list with data retrieved from a Web service method.
    The nice thing about this extender is that you can create a hierarchy of drop-down
    lists and have the extender automatically populate child drop-down lists based
    on the current selections in any of the previous lists in the heiararchy, if any.
    |

    | *CollapsiblePanel* | Adds collapsible sections to a Web page. This extender
    can be used only with panel controls—that is, with the ASP.NET *Panel* control
    or any class derived from it. You let the extender know which panel in the page
    acts as the header and which panel provides the contents that collapse and expand.
    |'
