  md: "# The *DropDown* Extender\n\nThe *DropDown* extender can be attached to virtually\
    \ any ASP.NET control. Once attached to a control, the extender provides a mouse-over\
    \ link to open a drop-down panel. The contents of the panel are entirely up to\
    \ you—typically, arranged as a menu. The drop-down is activated by clicking the\
    \ extended control with any mouse buttons.\n\n```\n<asp:Label ID=\"Label1\" runat=\"\
    server\" Text=\"Move the mouse here\" />\n<asp:Panel ID=\"Panel1\" runat=\"server\"\
    \ CssClass=\"ContextMenuPanel\"\n    Style=\"display:none;visibility:hidden;\"\
    >\n    <asp:LinkButton runat=\"server\" ID=\"Option1\" Text=\"I'm the first\"\n\
    \        CssClass=\"ContextMenuItem\" OnClick=\"LinkButton1_Click\" />\n    <asp:LinkButton\
    \ runat=\"server\" ID=\"Option2\" Text=\"I'm the second\"\n        CssClass=\"\
    ContextMenuItem\" OnClick=\"LinkButton1_Click\" />\n    <asp:LinkButton runat=\"\
    server\" ID=\"Option3\" Text=\"I'm the third\"\n        CssClass=\"ContextMenuItem\"\
    \ OnClick=\"LinkButton1_Click\" />\n</asp:Panel>\n\n<act:DropDownExtender runat=\"\
    server\" ID=\"DropDownExtender1\"\n    TargetControlID=\"Label1\" DropDownControlID=\"\
    Panel1\" />\n```\n\nIn the sample just shown, the drop-down user interface is\
    \ a *Panel* that contains a list of link buttons. Link buttons are styled to look\
    \ like menu items. Link and push buttons, and indeed embedded controls in general,\
    \ operate normally. (See Figure 5-10.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_81_0.png)\n\
    \n# Button Extenders\n\nButtons are by far one of the most common elements in\
    \ ASP.NET pages. However, as pages become functionally richer, additional features\
    \ are required for buttons to stay in sync with users' expectations. ASP.NET AJAX\
    \ provides a few extenders that apply to submit buttons and to the pseudo-buttons\
    \ that form a *CheckBox* element."
  merge: -1
  pgno: 81
- img_proc: true
  md: "176 Part II Adding AJAX Capabilities to a Site\n\n# The *ConfirmButton* Extender\n\
    \nMany times, a safe approach to responding to a user clicking a button is to\
    \ ask the user for a confirmation for the operation she's going to start. A common\
    \ solution for implementing this behavior entails that the ASP.NET page attach\
    \ some script code to the button to pop up a JavaScript message box with a confirmation\
    \ message. The *ConfirmButton* extender greatly simplifies this common task by\
    \ making it declarative:\n\n```\n<asp:Button runat=\"server\" ID=\"Button1\" Text=\"\
    Click me\" />\n```\n\n```\n<act:ConfirmButtonExtender ID=\"ConfirmButtonExtender1\"\
    \ runat=\"server\"\n    TargetControlID=\"Button1\"\n    ConfirmText=\"Are you\
    \ sure you want to click this?\\nReally sure?\" />\n```\n\nThe *ConfirmText* property\
    \ specifies the text of the message box being displayed as the user clicks the\
    \ button. Note that HTML entities can be used in the text, but by design no HTML\
    \ formatting, such as <b> or <i>, can be used. You can, however, use entitized\
    \ special characters. For example, you can use &#10; to break the line and continue\
    \ the text on the next line. The reason for this lies in the JavaScript code for\
    \ the *ConfirmButton*—it's using JavaScript's *window.confirm*. Providing HTML\
    \ formatting makes no sense because the confirmation dialog box is basically a\
    \ non-HTML Windows *MessageBox* call.\n\nInternally, the *ConfirmButton* extender\
    \ sets a handler for the *onsubmit* event of the form and swallows the event if\
    \ the user doesn't confirm the operation. Only controls that implement the *IButtonControl*\
    \ interface can be used with the extender, including *LinkButton* and *ImageButton*\
    \ controls. (See Figure 5-11.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_82_0.png)\n\
    \nFigure 5-11 The *ConfirmButton* extender in action\n\n# The *MutuallyExclusiveCheckBox*\
    \ Extender\n\nThe *MutuallyExclusiveCheckBox* extender can be attached to any\
    \ ASP.NET *CheckBox* control to make it part of a group of logically related options.\
    \ The extender implements a behavior that"
  merge: -1
  pgno: 82
- img_proc: true
  md: "looks a lot like a list of radio buttons—multiple options are available but\
    \ only one can be chosen. So what's the point of having a mutually exclusive set\
    \ of check boxes rather than a radio button list?\n\nA list of radio buttons can\
    \ be initially unselected, but once one option has been selected there's no way\
    \ for the user to return to the initial state of having all options unselected.\
    \ Returning to the original, completely unselected state is possible with the\
    \ *MutuallyExclusiveCheckBox* extender.\n\nThe idea is that you group a number\
    \ of check boxes under the same key. The extender then ensures that only one check\
    \ box with the specified key can be selected at a time:\n\n```\n<h2>What Kind\
    \ of Experience Do You Have with ASP.NET?</h2>\n<asp:CheckBox runat=\"server\"\
    \ ID=\"chkBeginner\" Text=\"Beginner\" />\n<asp:CheckBox runat=\"server\" ID=\"\
    chkIntermediate\" Text=\"Intermediate\" />\n<asp:CheckBox runat=\"server\" ID=\"\
    chkExpert\" Text=\"Expert\" />\n\n<act:MutuallyExclusiveCheckBoxExtender runat=\"\
    server\" ID=\"Mutual1\"\n    TargetControlID=\"chkBeginner\"\n    Key=\"AspNetExpertise\"\
    \ />\n<act:MutuallyExclusiveCheckBoxExtender runat=\"server\" ID=\"Mutual2\"\n\
    \    TargetControlID=\"chkIntermediate\"\n    Key=\"AspNetExpertise\" />\n<act:MutuallyExclusiveCheckBoxExtender\
    \ runat=\"server\" ID=\"Mutual3\"\n    TargetControlID=\"chkExpert\"\n    Key=\"\
    AspNetExpertise\" />\n```\n\nIt can be argued that the same functionality could\
    \ have been applied to radio buttons instead of check boxes. Using check boxes\
    \ was the choice of developers, and it also provides a more consistent and expected\
    \ user interface. However, you can re-implement the behavior to use JavaScript\
    \ to allow the deselection of a radio button item.\n\n# The *ToggleButton* Extender\n\
    \nCheck boxes are graphical HTML elements visually represented by a pair of little\
    \ bitmaps (selected and unselected) plus companion text. Each browser can use\
    \ its own pair of bitmaps, thus resulting in the check boxes having a slightly\
    \ different look and feel. Most browsers, though, tend to represent check-box\
    \ buttons as square embossed buttons.\n\nThe *ToggleButton* extender provides\
    \ a way to simulate a check-box element that uses custom bitmaps. The extender\
    \ is applied to a *CheckBox* control, and it replaces the control with a completely\
    \ new markup block that uses custom images and provides the same behavior as a\
    \ standard check box:\n\n```\n<act:ToggleButtonExtender ID=\"ToggleButtonExtender1\"\
    \ runat=\"server\"\n        TargetControlID=\"CheckBox1\"\n        ImageWidth=\"\
    19\"\n        ImageHeight=\"19\"\n        UncheckedImageUrl=\"DontLike.gif\"\n\
    \        CheckedImageUrl=\"Like.gif\" />\n```"
  merge: -1
  pgno: 83
- img_proc: true
  md: '*ImageWidth* and *ImageHeight* properties indicate the desired size of the
    images. Note that these attributes are required. *UncheckedImageUrl* and *CheckedImageUrl*
    specify the images to use when the check box is selected or not selected.


    # Pop-up Extenders


    Virtually every Web developer has a sort of love/hate relationship with pop-up
    windows. As a matter of fact, pop-up windows often greatly simplify a number of
    tasks—especially modal dialog boxes. One of the nasty things about HTML pop-up
    windows is that they are browser windows and require a page to navigate. The pop-up
    extenders that ASP.NET AJAX Extensions has to offer, on the other hand, do not
    require a new browser instance. Instead, they are limited to popping up the content
    of any panel you indicate, with or without modality.


    # The *HoverMenu* Extender


    The *HoverMenu* extender is similar to the *PopupControl* extender and can be
    associated with any ASP.NET control. Both extenders display a pop-up panel to
    display additional content, but they do it for different events. The *HoverMenu*,
    in particular, pops up its panel when the user moves the mouse cursor over the
    target control. The panel can be displayed at a position specified by the developer.
    It can be at the left, right, top, or bottom of the target control. In addition,
    the control can be given an optional CSS style so that it looks like it is in
    a highlighted state. (See Figure 5-12.)


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_84_0.png)


    Figure 5-12   The *HoverMenu* extender in action


    The *HoverMenu* extender is good for implementing an auto-display context menu
    for virtually every ASP.NET control instance and for providing tips to fill in
    some input fields. In Figure 5-12, for example, when the user hovers the cursor
    over the text box, a list of suggestions appears to simplify the work.'
