    as a guide to the user. This help text is stripped off when the text box is submitted
    and is automatically removed as the user starts typing in the field. Likewise,
    it is automatically re-inserted when the user wipes out any text in the text box.


    The watermark behavior hooks up three HTML events: *onfocus*, *onblur*, and *onkeypress*.
    In its initialization stage, it also sets a new style and default text for the
    target text box if the body of the field is empty. When the text box gets the
    input focus, the event handler promptly removes the watermark text and restores
    the original style. As the user types, the handler for *onkeypress* ensures that
    the current text box is watermarked. Finally, when the input field loses the focus—the
    *onblur* event—the handler sets the watermark back if the content of the field
    is the empty string.


    To associate this behavior with an ASP.NET *TextBox*, you use the extender. Alternatively,
    if you feel comfortable with ASP.NET control development and JavaScript, you can
    use a client-side code fragment to achieve the same results.'
- md: "> **Note** The concept of AJAX extenders closely resembles Dynamic HTML (DHTML)\
    \ behavior. Introduced with Internet Explorer 5.0, DHTML behaviors were nothing\
    \ more than a script file (or a compiled COM object) that hooked up HTML events\
    \ and modified the DOM of a given HTML tag to implement a given behavior. DHTML\
    \ behaviors were used to extend the capabilities of individual HTML tags. ASP.NET\
    \ AJAX behaviors are used to extend the capabilities of the markup block generated\
    \ by individual ASP.NET controls.\n\n## Target Properties\n\nExtender controls\
    \ are characterized by a set of properties that determine the resulting behavior.\
    \ The values of these properties are passed on to the client and incorporated\
    \ in the client script.\n\nObviously, a made-to-measure framework is required\
    \ both on the server and the client to make the implementation of behaviors effective\
    \ and, more importantly, affordable. This framework is exactly the benefit that\
    \ ASP.NET AJAX Extensions provides. We'll examine the internals of extenders in\
    \ a moment while going through some sample code. Meanwhile, let's take a quick\
    \ look at how you actually use extenders in ASP.NET pages.\n\nIn a page, you have\
    \ one extender instance for each control you want to enhance. The extender is\
    \ decorated with a set of properties, as shown here:\n\n```\n<act:TextBoxWatermarkExtender\
    \ ID=\"Watermark1\" runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    WatermarkText=\"\
    \ ... \"\n    WatermarkCssClass=\" ... \" />\n</act:TextBoxWatermarkExtender>\n\
    <act:TextBoxWatermarkExtender ID=\"Watermark2\" runat=\"server\"\n    TargetControlID=\"\
    TextBox2\"\n    WatermarkText=\" ... \"\n    WatermarkCssClass=\" ... \" />\n\
    </act:TextBoxWatermarkExtender>\n```\n\nThe *TargetControlID* property is common\
    \ to all extenders and indicates the control in the page that is the target of\
    \ the extender. Other properties specific to the extender tailor its individual\
    \ behavior. The *WatermarkText* and *WatermarkCssClass* properties are implemented\
    \ only by the Watermark Extender, for example, and serve to assign the text and\
    \ style the watermarked text should exhibit.\n\nArmed with this background information,\
    \ let's take the plunge into the programming interface of extender controls.\n\
    \n## The *ExtenderControl* Class\n\nAs mentioned, ASP.NET AJAX Extensions doesn't\
    \ include any concrete implementation of an extender. However, it defines the\
    \ base class from which all custom extenders, as well as all extenders in the\
    \ ACT, derive. This class is named *ExtenderControl*.\n\nThe *ExtenderControl*\
    \ class derives from *Control* and implements the *IExtenderControl* interface.\
    \ The class defines one specific property—*TargetControlID*. The property is a\
    \ string and represents the ID of the server control being extended. The *Visible*\
    \ property, common to all server controls, is overridden and made virtually read-only.\
    \ More precisely, you can't override a read/write property to remove the set modifier,\
    \ but you can just make it throw an exception if invoked. Here's the pseudocode\
    \ of the property:\n\n```\npublic override bool Visible\n{\n    get { return base.Visible;\
    \ }\n    set { throw new NotImplementedException(); }\n}\n```\n\nAn extender requires\
    \ a script manager control in the page, just as any ASP.NET AJAX server controls\
    \ do. Note that extenders are mostly used declaratively and are never modified\
    \ programmatically. For this reason, an extender doesn't need (and doesn't use)\
    \ view state.\n\n### The *IExtenderControl* Interface\n\nThe *IExtenderControl*\
    \ interface defines the contract of an extender control. It comprises two methods:\
    \ *GetScriptDescriptors* and *GetScriptReferences*. Here's the definition of the\
    \ interface:\n\n```\npublic interface IExtenderControl\n{\n    IEnumerable<ScriptDescriptor>\
    \ GetScriptDescriptors(\n        Control targetControl);\n    IEnumerable<ScriptReference>\
    \ GetScriptReferences();\n}\n```\n\nBoth methods return a collection of specific\
    \ objects—script descriptors and script references, respectively.\n\nA script\
    \ descriptor is represented by an instance of the *ScriptDescriptor* class, whereas\
    \ the *ScriptReference* class represents a linked script file. What is a script\
    \ descriptor, anyway? It describes the JavaScript class that provides the expected\
    \ client behavior. A script descriptor indicates the client type to create, the\
    \ properties to set, and the client events for which handlers are required.\n\n\
    Actually, *ScriptDescriptor* is just a base class that you use only as a reference.\
    \ The real class you work with is *ScriptBehaviorDescriptor*. Here's some code\
    \ that demonstrates the typical implementation of a *GetScriptDescriptors* method\
    \ in a sample extender control:\n\n```\nprotected IEnumerable<ScriptDescriptor>\
    \ GetScriptDescriptors(\n    Control targetControl)\n{\n    ScriptBehaviorDescriptor\
    \ descriptor;\n    descriptor = new ScriptBehaviorDescriptor(className, id);\n\
    \    descriptor.AddProperty(propertyName1, value1);\n    ...\n    return new ScriptDescriptor[]\
    \ { descriptor };\n}\n```\n\nThe *ScriptBehaviorDescriptor* class doesn't feature\
    \ public properties, but it does expose a cargo collection property that is filled\
    \ with property descriptions—typically, name and value.\n\nAs discussed in Chapter\
    \ 3, \"The Pulsing Heart of ASP.NET AJAX,\" a *ScriptReference* object describes\
    \ a piece of JavaScript code. In particular, in this context it represents the\
    \ client script included with the behavior. All referenced scripts define client\
    \ types and any other auxiliary JavaScript code that is required. We'll return\
    \ to this method in a moment.\n\nThe *ExtenderControl* base class implements the\
    \ *IExtenderControl* interface by falling back into internal members that are\
    \ declared as *protected* and *abstract* (or as must-override in Microsoft Visual\
    \ Basic .NET):\n\n```\nIEnumerable<ScriptDescriptor> IExtenderControl.GetScriptDescriptors(\n\
    \    Control targetControl)\n{\n    return this.GetScriptDescriptors(targetControl);\n\
    }\nIEnumerable<ScriptReference> IExtenderControl.GetScriptReferences()\n{\n  \
    \  return this.GetScriptReferences();\n}\n```\n\nThe internal members must be\
    \ overridden in any derived classes.\n\n## Creating a Sample Extender\n\nLet's\
    \ apply the previously exposed concepts to a practical scenario and create a sample\
    \ extender control. The new extender adds a highlighting behavior that changes\
    \ the appearance of the control when this gets focused. This extender, named *FocusExtender*,\
    \ is not specific to just one control but can be applied to virtually any ASP.NET\
    \ control.\n\n### The *FocusExtender* Control\n\nThe focus extender is implemented\
    \ as a control type that derives from *ExtenderControl* and overrides the two\
    \ abstract members on the base class:\n\n```\n[TargetControlType(typeof(Control))]\n\
    public class FocusExtender : ExtenderControl\n{\n    protected override IEnumerable<ScriptReference>\
    \ GetScriptReferences()\n    {\n        ...\n    }\n    protected override IEnumerable<ScriptDescriptor>\
    \ GetScriptDescriptors(\n        Control targetControl)\n    {\n        ...\n\
    \    }\n    ...\n}\n```\n\nThe *TargetControlType* attribute defines the base\
    \ class of controls that can be extended. In this case, all Web controls can be\
    \ extended. As you can see, if multiple control types must be extended, it is\
    \ required that they all derive from the same base class.\n\nThe skeleton of the\
    \ extender is pretty much done. You only have to add some properties to make the\
    \ extender configurable and flesh out the body of abstract methods.\n\nThe focus\
    \ extender is designed to change the appearance of the target control when this\
    \ gets the focus. At a minimum, you need two sets of visual properties: one for\
    \ the highlighted state and one for the normal state. However, these attributes\
    \ will be processed and applied on the client. On the client browser, though,\
    \ there's a better way to set the appearance of elements than by using individual\
    \ properties—cascading styles. To assign these styles, the extender has two properties—*HighlightCssClass*\
    \ and *NormalCssClass*:\n\n```\npublic class FocusExtender : ExtenderControl\n\
    {\n    private string _highlightCssClass;\n    private string _normalCssClass;\n\
    \n    public string HighlightCssClass\n    {\n        get { return _highlightCssClass;\
    \ }\n        set { _highlightCssClass = value; }\n    }\n\n    public string NormalCssClass\n\
    \    {\n        get { return _normalCssClass; }\n        set { _normalCssClass\
    \ = value; }\n    }\n    ...\n}\n```\n\nAs mentioned, an extender class doesn't\
    \ need a view state and implements storage for properties through private fields.\
    \ This requires that an extender be either used declaratively (and not modified\
    \ programmatically during postbacks) or fully configured in the page initialization\
    \ phase regardless of postbacks.\n\n### Defining the Client Behavior\n\nThe *GetScriptDescriptors*\
    \ method instantiates a descriptor class and it uses that class to bind the *IntroAjax.FocusBehavior*\
    \ JavaScript class to the HTML subtree rooted in the client ID of the target control."
  mdcn: "\n> **注意** AJAX 扩展器的概念与动态 HTML（DHTML）行为非常相似。随着 Internet Explorer 5.0 引入的\
    \ DHTML 行为，本质上只是一个脚本文件（或编译后的 COM 对象），它挂钩 HTML 事件并修改给定 HTML 标签的 DOM 来实现特定行为。DHTML\
    \ 行为用于扩展单个 HTML 标签的功能。ASP.NET AJAX 行为则用于扩展由单个 ASP.NET 控件生成的标记块的功能。\n\n## 目标属性\n\
    \n扩展器控件由一组决定最终行为的属性来表征。这些属性的值会传递到客户端，并嵌入到客户端脚本中。\n\n显然，在服务器端和客户端都需要一个量身定制的框架，才能使行为的实现既高效又经济。ASP.NET\
    \ AJAX Extensions 正是提供了这一框架。我们马上会在分析一些示例代码的同时，深入研究扩展器的内部原理。与此同时，让我们先快速了解一下如何在\
    \ ASP.NET 页面中使用扩展器。\n\n在页面中，每个你想要增强的控件都有一个扩展器实例。扩展器带有一组属性，如下所示：\n\n```\n<act:TextBoxWatermarkExtender\
    \ ID=\"Watermark1\" runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    WatermarkText=\"\
    \ ... \"\n    WatermarkCssClass=\" ... \" />\n</act:TextBoxWatermarkExtender>\n\
    <act:TextBoxWatermarkExtender ID=\"Watermark2\" runat=\"server\"\n    TargetControlID=\"\
    TextBox2\"\n    WatermarkText=\" ... \"\n    WatermarkCssClass=\" ... \" />\n\
    </act:TextBoxWatermarkExtender>\n```\n\n*TargetControlID* 属性是所有扩展器共有的，它指示页面中作为扩展器目标的控件。其他特定于扩展器的属性则用于定制其个别行为。例如，*WatermarkText*\
    \ 和 *WatermarkCssClass* 属性仅由水印扩展器实现，用于设置水印文本应显示的文本和样式。\n\n有了这些背景信息，让我们深入探讨扩展器控件的编程接口。\n\
    \n## *ExtenderControl* 类\n\n如前所述，ASP.NET AJAX Extensions 不包含任何扩展器的具体实现。但是，它定义了所有自定义扩展器以及\
    \ ACT 中所有扩展器所继承的基类。这个类名为 *ExtenderControl*。\n\n*ExtenderControl* 类派生自 *Control*，并实现了\
    \ *IExtenderControl* 接口。该类定义了一个特定属性——*TargetControlID*。该属性是一个字符串，表示被扩展的服务器控件的\
    \ ID。*Visible* 属性是所有服务器控件共有的，在此被重写并设为实际上只读。更准确地说，你不能将读/写属性重写为移除 set 访问器，但可以使其在调用时抛出异常。以下是该属性的伪代码：\n\
    \n```\npublic override bool Visible\n{\n    get { return base.Visible; }\n   \
    \ set { throw new NotImplementedException(); }\n}\n```\n\n扩展器需要页面中存在脚本管理器控件，正如任何\
    \ ASP.NET AJAX 服务器控件一样。请注意，扩展器大多是声明式使用的，永远不会以编程方式修改。因此，扩展器不需要（也不使用）视图状态。\n\n###\
    \ *IExtenderControl* 接口\n\n*IExtenderControl* 接口定义了扩展器控件的契约。它包含两个方法：*GetScriptDescriptors*\
    \ 和 *GetScriptReferences*。以下是该接口的定义：\n\n```\npublic interface IExtenderControl\n\
    {\n    IEnumerable<ScriptDescriptor> GetScriptDescriptors(\n        Control targetControl);\n\
    \    IEnumerable<ScriptReference> GetScriptReferences();\n}\n```\n\n两个方法分别返回特定对象的集合——脚本描述符和脚本引用。\n\
    \n脚本描述符由 *ScriptDescriptor* 类的实例表示，而 *ScriptReference* 类则表示链接的脚本文件。那么，脚本描述符究竟是什么呢？它描述了提供预期客户端行为的\
    \ JavaScript 类。脚本描述符指示要创建的客户端类型、要设置的属性以及需要处理程序的那些客户端事件。\n\n实际上，*ScriptDescriptor*\
    \ 只是一个你仅用作引用的基类。你实际使用的真实类是 *ScriptBehaviorDescriptor*。以下是一些代码，演示了在示例扩展器控件中 *GetScriptDescriptors*\
    \ 方法的典型实现：\n\n```\nprotected IEnumerable<ScriptDescriptor> GetScriptDescriptors(\n\
    \    Control targetControl)\n{\n    ScriptBehaviorDescriptor descriptor;\n   \
    \ descriptor = new ScriptBehaviorDescriptor(className, id);\n    descriptor.AddProperty(propertyName1,\
    \ value1);\n    ...\n    return new ScriptDescriptor[] { descriptor };\n}\n```\n\
    \n*ScriptBehaviorDescriptor* 类没有公共属性，但它确实公开了一个用于填充属性描述的承载集合属性——通常是名称和值。\n\n如第\
    \ 3 章\"ASP.NET AJAX 的脉动核心\"中所讨论的，*ScriptReference* 对象描述了一段 JavaScript 代码。特别是在本上下文中，它表示与行为一起包含的客户端脚本。所有引用的脚本都定义了客户端类型以及任何其他需要的辅助\
    \ JavaScript 代码。我们稍后会再回到这个方法。\n\n*ExtenderControl* 基类通过回退到声明为 *protected* 和 *abstract*（或在\
    \ Microsoft Visual Basic .NET 中声明为 must-override）的内部成员来实现 *IExtenderControl* 接口：\n\
    \n```\nIEnumerable<ScriptDescriptor> IExtenderControl.GetScriptDescriptors(\n\
    \    Control targetControl)\n{\n    return this.GetScriptDescriptors(targetControl);\n\
    }\nIEnumerable<ScriptReference> IExtenderControl.GetScriptReferences()\n{\n  \
    \  return this.GetScriptReferences();\n}\n```\n\n内部成员必须在任何派生类中被重写。\n\n## 创建示例扩展器\n\
    \n让我们将前面阐述的概念应用于实际场景，创建一个示例扩展器控件。这个新扩展器添加了一种高亮行为，在控件获得焦点时改变其外观。这个名为 *FocusExtender*\
    \ 的扩展器不仅限于单个控件，而是可以应用于几乎任何 ASP.NET 控件。\n\n### *FocusExtender* 控件\n\n焦点扩展器被实现为派生自\
    \ *ExtenderControl* 的控件类型，并重写了基类上的两个抽象成员：\n\n```\n[TargetControlType(typeof(Control))]\n\
    public class FocusExtender : ExtenderControl\n{\n    protected override IEnumerable<ScriptReference>\
    \ GetScriptReferences()\n    {\n        ...\n    }\n    protected override IEnumerable<ScriptDescriptor>\
    \ GetScriptDescriptors(\n        Control targetControl)\n    {\n        ...\n\
    \    }\n    ...\n}\n```\n\n*TargetControlType* 属性定义了可以被扩展的控件的基类。在本例中，所有 Web 控件都可以被扩展。如你所见，如果必须扩展多种控件类型，则要求它们都派生自同一个基类。\n\
    \n扩展器的骨架已经基本完成。你只需要添加一些属性使扩展器可配置，并充实抽象方法的主体。\n\n焦点扩展器旨在在目标控件获得焦点时改变其外观。至少需要两组视觉属性：一组用于高亮状态，一组用于正常状态。然而，这些属性将在客户端处理和应用。在客户端浏览器中，有一种比使用单个属性更好的方式来设置元素的外观——级联样式。为了分配这些样式，扩展器有两个属性——*HighlightCssClass*\
    \ 和 *NormalCssClass*：\n\n```\npublic class FocusExtender : ExtenderControl\n{\n\
    \    private string _highlightCssClass;\n    private string _normalCssClass;\n\
    \n    public string HighlightCssClass\n    {\n        get { return _highlightCssClass;\
    \ }\n        set { _highlightCssClass = value; }\n    }\n\n    public string NormalCssClass\n\
    \    {\n        get { return _normalCssClass; }\n        set { _normalCssClass\
    \ = value; }\n    }\n    ...\n}\n```\n\n如前所述，扩展器类不需要视图状态，并通过私有字段实现属性的存储。这要求扩展器要么声明式使用（且不在回发期间以编程方式修改），要么在页面初始化阶段完全配置，无论是否回发。\n\
    \n### 定义客户端行为\n\n*GetScriptDescriptors* 方法实例化一个描述符类，并使用该类将 *IntroAjax.FocusBehavior*\
    \ JavaScript 类绑定到以目标控件客户端 ID 为根的 HTML 子树。\n"
