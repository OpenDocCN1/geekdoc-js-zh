    \ cultures, and all sorts of things that affect the representation of a date.\
    \ The most natural way of choosing a date in an input form is through a calendar;\
    \ and ASP.NET 2.0 does indeed provide such a control. The original"
  mdcn: "\n## *ResizableControl* 扩展器\n\n位于元素右下角的拖动手柄让用户可以像调整窗口大小一样调整该元素的大小。让我们来看一下以下标记：\n\
    \n```xml\n<asp:Panel ID=\"Panel1\" runat=\"server\" Style=\"overflow:hidden\"\n\
    \          Width=\"130px\" Height=\"65px\">\n    <asp:Image ID=\"Image1\" runat=\"\
    server\" ImageUrl=\"~/images/ajax.gif\"\n             Style=\"width:100%; height:100%;\"\
    \ />\n</asp:Panel>\n\n<asp:Panel ID=\"Panel2\" runat=\"server\" Style=\"overflow:auto\"\
    \n          Width=\"130px\" height=\"100px\">\n    This text resizes itself to\
    \ be as large as possible\n    within its container.\n</asp:Panel>\n```\n\n如你所见，第一个面板包含一张图片；第二个面板包含纯文本。某些\
    \ CSS 属性对于扩展器正常工作来说是必需的。特别是，你可能需要将图片的 overflow 属性设置为 *hidden*，将文本的 overflow 属性设置为\
    \ *auto*。overflow 属性控制当元素内容超出预留空间时滚动条的显示方式。在此示例中，我拉伸或缩小图片，并对文本进行滚动处理。\n\n为面板设置正确的初始大小非常重要。特别是，对于图片，你应该为周围的面板设置与图片相同的大小。包含文本块的面板也应该给定明确的大小。\n\
    \n```xml\n<act:ResizableControlExtender ID=\"Resizable1\" runat=\"server\"\n \
    \   TargetControlID=\"Panel1\"\n    ResizableCssClass=\"resizingStyle\"\n    HandleCssClass=\"\
    handleStyle\" />\n<act:ResizableControlExtender ID=\"Resizable2\" runat=\"server\"\
    \n    TargetControlID=\"Panel2\"\n    ResizableCssClass=\"resizingStyle\"\n  \
    \  HandleCssClass=\"handleStyle\" />\n```\n\n*ResizableControl* 扩展器有两个必需属性：*TargetControlID*\
    \ 和 *HandleCssClass*。前者指明要调整大小的控件；后者设置要应用于调整大小手柄的 CSS 类名称。此外，*ResizableCssClass*\
    \ 是在调整大小期间要应用于元素的 CSS 类。你可能希望使用这个类来更改或加粗边框颜色以强调该操作。以下是一个典型的手柄 CSS 类：\n\n```css\n\
    .handleStyle\n{\n    width:16px;\n    height:16px;\n    background-image:url(~/images/HandleGrip.gif);\n\
    \    overflow:hidden;\n    cursor:se-resize;\n}\n```\n\n图 5-19 展示了该扩展器的实际运行效果。\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_96_0.png)\n\n**图 5-19** *ResizableControl*\
    \ 扩展器实际运行效果\n\n*ResizableControl* 扩展器还包含两个客户端事件（*onresizing* 和 *onresize*），可以触发一些\
    \ JavaScript 代码来执行更复杂的操作，例如增大字体大小以适应更大的区域。该扩展器允许你为正在调整大小的元素定义最小和最大尺寸。控件调整大小所产生的任何更改都会自动在回发后持久保存。\n\
    \n## *RoundedCorners* 扩展器\n\n*RoundedCorners* 扩展器是 *DropShadow* 扩展器的一个子集，因为它仅限于将子面板的角设为圆角：\n\
    \n```xml\n<asp:Panel runat=\"server\" ID=\"Panel1\" BackColor=\"LightBlue\" Width=\"\
    170px\">\n    <div style=\"margin-left:2px\">\n        <asp:TextBox ID=\"TextBox1\"\
    \ runat=\"server\"\n                     BackColor=\"LightBlue\"\n           \
    \          BorderWidth=\"0px\" />\n    </div>\n</asp:Panel>\n\n<act:RoundedCornersExtender\
    \ ID=\"RoundedCornerExtender1\" runat=\"server\"\n    TargetControlID=\"Panel1\"\
    \ Radius=\"6\" Color=\"LightBlue\" />\n```\n\n该扩展器接受参数来设置目标控件，并定义圆角的期望半径和周围边框的颜色。实际上，圆角是通过在目标控件周围渲染一个额外的边框来实现的。通过移除文本框周围的所有边框，并为面板和文本框使用相同的背景色，你可以获得如图\
    \ 5-20 所示的漂亮效果——一个圆角的文本框控件。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_97_0.png)\n\
    \n**图 5-20** *RoundedCorners* 扩展器实际运行效果\n\n## 输入扩展器\n\n网页仍然依赖 HTML 标记语言内置的功能让用户在表单和输入字段中输入数据。但\
    \ HTML 输入元素对于当今的应用程序和用户来说有时过于有限和简单。因此，老旧的 <input type=\"text\"> 元素及其 ASP.NET 对应控件\
    \ TextBox 需要一些额外的功能。ACT 提供了一些扩展器，可将经典的输入字段转换为更具交互性和用户友好性的文本框。\n\n### **AutoComplete**\
    \ 扩展器\n\n在文本框中输入数据有时可能很乏味，尤其是当你反复输入相同的文本片段时。出于这个原因，Web 浏览器早在不久前就开始支持自动完成功能。Web\
    \ 浏览器的自动完成功能是指代码能够跟踪用户曾经输入过的任何 URL。这样，当你在输入一个可能很长且难以记住的 URL 时，浏览器可以快速向你提供建议。\n\
    \n自动完成也是某些浏览器（如 Internet Explorer 5 及更新版本）支持的一项功能，适用于你在 HTML 表单中使用的任何自定义文本框。浏览器会将曾经输入到给定名称输入字段中的任何数据保存在本地计算机上，并将其提供给站点中所有具有相同名称的\
    \ HTML 元素的页面。该功能与浏览器集成，对用户和开发者透明。建议列表是逐步构建的，完全不受页面作者的控制。\n\n*AutoComplete* 扩展器将自动完成功能扩展到任何\
    \ ASP.NET TextBox 控件；更重要的是，它让页面作者能够以编程方式定义建议列表（通过 Web 服务检索获取）。\n\n## 第二部分 为站点添加\
    \ AJAX 功能\n\n```xml\n<asp:TextBox ID=\"CustomerName\" runat=\"server\" />\n```\n\
    \n```xml\n<act:AutoCompleteExtender runat=\"server\" ID=\"AutoCompleteExtender1\"\
    \n    TargetControlID=\"CustomerName\"\n    Enabled=\"true\"\n    MinimumPrefixLength=\"\
    1\"\n    ServicePath=\"Suggestions.asmx\"\n    ServiceMethod=\"GetSuggestions\"\
    \ />\n```\n\n在代码片段中，文本框使用指定 Web 服务的 GetSuggestions 方法返回的数据进行自动完成。ServicePath 和\
    \ ServiceMethod 扩展器属性标识提供自动完成数据的服务；MinimumPrefixLength 属性设置用户必须输入多少个字符才能触发自动完成功能。在前面的代码中，自动完成从输入第一个字符时开始。\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_98_0.png)\n\n> **注意** Web 服务必须是本地 Web\
    \ 服务，安装在与使用它的页面相同的服务器计算机和应用程序上。请注意，此注意事项适用于 ASP.NET AJAX 扩展器使用的所有 Web 服务。\n\n\
    用于提供建议的 Web 服务方法必须具有已知的签名：\n\n```csharp\n[WebMethod]\npublic string[] GetSuggestions(string\
    \ prefixText, int count)\n{\n    ...\n}\n```\n\nprefixText 参数表示用户到目前为止已输入的文本；count\
    \ 参数设置期望的建议数量。结果显示在文本框下方的下拉面板中。用户可以使用鼠标或键盘选择其中一个建议项。以下代码显示了一个 Web 服务方法，该方法返回与提供的前缀匹配的客户名称子集。（见图\
    \ 5-21。）\n\n```csharp\npublic class SuggestionService : System.Web.Services.WebService\n\
    {\n    [WebMethod]\n    public string[] GetSuggestions(string prefixText, int\
    \ count)\n    {\n        int i=0;\n        DataView data = GetData();\n      \
    \  data = FilterData(data, prefixText);\n        string [] suggestions = new string[data.Count];\n\
    \n        foreach (DataRowView row in data)\n            suggestions[i++] = row[\"\
    companyname\"].ToString();\n\n        return suggestions;\n    }\n\n    private\
    \ DataView GetData()\n    {\n        DataView view = (DataView)HttpContext.Current.Cache[\"\
    Suggestions\"];\n        if (view == null)\n        {\n            SqlDataAdapter\
    \ adapter = new SqlDataAdapter(\n                \"SELECT * FROM customers\",\
    \ \"...\");\n            DataTable table = new DataTable();\n            adapter.Fill(table);\n\
    \            view = table.DefaultView;\n\n            // Store the entire data\
    \ set to the ASP.NET Cache for\n            // further reuse\n            HttpContext.Current.Cache[\"\
    Suggestions\"] = view;\n        }\n\n        return view;\n    }\n\n    private\
    \ DataView FilterData(DataView view, string prefix)\n    {\n        // Filter\
    \ out undesired strings\n        view.RowFilter = String.Format(\"companyname\
    \ LIKE '{0}%'\", prefix);\n        return view;\n    }\n}\n```\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_99_0.png)\n\
    \n**图 5-21** *AutoComplete* 扩展器实际运行效果\n\n### *Calendar Extender*\n\n许多输入表单要求用户指定日期。作为\
    \ ASP.NET 开发者，你知道让用户处理分隔符、格式、文化以及影响日期表示的各种因素是多么令人沮丧。在输入表单中选择日期最自然的方式是通过日历；ASP.NET\
    \ 2.0 确实提供了这样的控件。原始\n"
