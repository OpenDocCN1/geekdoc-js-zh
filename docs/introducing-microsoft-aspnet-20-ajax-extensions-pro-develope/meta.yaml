    # The *HoverMenu* Extender


    The *HoverMenu* extender is similar to the *PopupControl* extender and can be
    associated with any ASP.NET control. Both extenders display a pop-up panel to
    display additional content, but they do it for different events. The *HoverMenu*,
    in particular, pops up its panel when the user moves the mouse cursor over the
    target control. The panel can be displayed at a position specified by the developer.
    It can be at the left, right, top, or bottom of the target control. In addition,
    the control can be given an optional CSS style so that it looks like it is in
    a highlighted state. (See Figure 5-12.)


