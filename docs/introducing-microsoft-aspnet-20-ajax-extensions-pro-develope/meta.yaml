  md: 'A data-bound control, *ReorderList*, allows its child elements to be reordered
    on the client using drag-and-drop functionality. To move an item in the list,
    the user drags the item''s handle up to its new position. At the end of the operation,
    the control posts back so that the new status of the data source can be recorded.


    Finally, the *TabContainer* control is a purely client-side container of tabbed
    forms.


    Let''s first get to know more about these controls and then move on to discuss
    extenders.


    # ## The *Accordion* Control


    Collapsible panels are a frequent feature in modern and cutting-edge Web sites.
    They allow you to display a short highlight—the header—and keep more text hidden
    and available on demand. The *CollapsiblePanel* extender (discussed later) allows
    you to hide and display any block of markup. But what if you need to build a sort
    of hierarchy of panels?


    The *Accordion* control allows you to group multiple collapsible panels in a single
    control, and it manages the collapsed/expanded state of each panel so that only
    one can be expanded at a time.


    # ## Generalities of the *Accordion* Control


    The *Accordion* control contains a collection of child *AccordionPane* controls,
    each of which features a template property to define header and content. Each
    pane can include any HTML, ASP.NET, or ASP.NET AJAX markup you want.


    # ### Properties of the Control


    Table 5-2 lists the key properties of the *Accordion* control.


    # **Table 5-2 Properties of the *Accordion* Control**


    | Property | Description |

    | --- | --- |

    | *AutoSize* | The value assigned to this property indicates how the control will
    determine its actual size. |

    | *ContentCssClass* | Gets and sets the CSS class used to style the content of
    child panes. |

    | *FadeTransitions* | Indicates whether to use a fade-out transition effect while
    hiding the current pane. This property is set to *false* by default. |

    | *FramesPerSecond* | Gets and sets the number of frames per second used in the
    transition animation for the newly selected pane. This property is set to 30 frames
    by default. |

    | *HeaderCssClass* | Gets and sets the CSS class used to style the header of child
    panes. |

    | *Panes* | Returns the collection of child panes. |

    | *SelectedIndex* | Gets and sets the currently expanded pane. |

    | *TransitionDuration* | Gets and sets the number of milliseconds to animate the
    transition. This property is set to *250* by default. |'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Animating the Control


    The *Accordion* control supports animation in two different contexts. First, it
    might optionally fade out the content of the current pane when a new one is selected.
    This effect is controlled by the *FadeTransitions* Boolean property. The effect
    is not very visible on small-sized content panes. Note also that the fade animation
    is tightly coupled with the transition animation that slowly rolls down the content
    of the new pane.


    This second form of animation is controlled by the *TransitionDuration* and *FramesPerSecond*
    properties. If this latter effect is disabled, you won''t see any fade-out effect
    regardless of the setting of the *FadeTransitions* property.


    To skip transition animation completely and obtain a quick swap of panes, you
    set both *FramesPerSecond* and *TransitionDuration* to *0*. If you do so, also
    set *FadeTransitions* to *false* to save the control unnecessary tasks that will
    produce no observable effects.


    # Sizing the Control


    The size of the *Accordion* control is clearly determined by any container element
    as well as the content of the various panes. This means that the overall size
    of the accordion might vary with the selected pane. In this case, other elements
    in the page might be pushed up or down. The *AutoSize* property helps to keep
    the overall size of accordion under control.


    The *AutoSize* property takes its values from the *AutoSize* enumeration, whose
    values are *None* (default), *Limit*, and *Fill*. When the *AutoSize* property
    is set to *None*, the accordion modifies its size freely following the size of
    the selected pane.


    When you set *AutoSize* to *Limit*, the accordion never grows larger than the
    value specified by its *Width* and *Height* properties. The *Accordion* control
    inherits these properties from its base class. The *Height* and *Width* properties
    are both ignored if *None* is set. If the content to display is larger than the
    designated size of the accordion, scrollbars are employed to let users see all
    of it.


    With the *Fill待机模式Fill value set, the accordion stays exactly within the bounding
    box delimited by the *Width* and *Height* properties. In this case, the content
    will be expanded or made scrollable if it isn''t the right size. Expanding the
    contents just means making the pane larger.'
