    \n<asp:Panel ID=\"Panel2\" runat=\"server\" Style=\"overflow:auto\"\n        \
    \  Width=\"130px\" height=\"100px\">\n    This text resizes itself to be as large\
    \ as possible\n    within its container.\n</asp:Panel>\n```\n\nAs you can see,\
    \ the first panel contains an image; the second includes plain text. Some CSS\
    \ attributes are necessary for the extender to work properly. In particular, you\
    \ might want to set the overflow attribute to *hidden* for images and to *auto*\
    \ for text. The *overflow* attribute controls the appearance of scrollbars when\
