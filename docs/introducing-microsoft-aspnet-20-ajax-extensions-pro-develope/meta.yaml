    > **Note** The *ReorderList* can automatically perform server-side reorders if
    its *SortOrderField* property is set and if the data source can be sorted on that
    field. In addition, the type of the sort field must be *integer*.


    # The **TabContainer** Control


    Multiple views are a common feature in most pages. They group information in tabs
    and let users click to display only a portion of the information available. In
    ASP.NET 2.0, the *MultiView* control provides an effective shortcut to this feature.
    But it requires a postback to update the page when the user selects a new tab.
    In the ACT, the *TabContainer* control provides an AJAX version of the multiview
    control.


    # Generalities of the **TabContainer** Control


    The *TabContainer* control is made of a collection of tabs, each of which is represented
    by an instance of the *TabPanel* class. You can add and remove panels programmatically,
    as well as define them declaratively.


    # Properties of the Control


    Table 5-6 lists the properties supported by the control.


    # Table 5-6 Properties of the **TabContainer** Control


    | Property | Description |

    | --- | --- |

    | *ActiveTab* | Returns a reference to the currently selected tab. |

    | *ActiveTabIndex* | Gets and sets the 0-based index of the selected tab. |

    | *CssClass* | Gets and sets the CSS class to use to style the control. |

    | *Height* | Gets and sets the height of the tabs. The value of the property is
    expressed as a *Unit* value. This value doesn''t include headers. |

    | *OnClientActiveTabChanged* | Gets and sets the JavaScript code to be executed
    on the client when the user changes the selection. |

    | *Scrollbars* | Gets and sets the desired support for scrollbars. This property
    is set to *Auto* by default. Feasible values come from the ASP.NET 2.0 *Scrollbars*
    type. |

    | *Tabs* | Returns the collection of *TabPanel* objects that defines the user
    interface of the control. |

    | *Width* | Gets and sets the width of the tabs. The value of the property is
    expressed as a *Unit* value. |


    In addition, the control fires the *ActiveTabChanged* event when the selected
    tab changes. The event is a mere notification, and the required delegate is *EventHandler*.
    No additional information is passed along with the event.'
  - "[PAGE 76]\n\n# Properties of Tab Panels\n\nThe *TabPanel* class represents an\
    \ individual tab in the container. Each tab defines its header either as plain\
    \ text or as a template. Likewise, a tab features a template to let developers\
    \ specify its content. The most recent tab should remain selected after a postback.\
    \ Table 5-7 lists the properties of the *TabPanel* class.\n\n| Property | Description\
    \ |\n|---|---|\n| *ContentTemplate* | Sets the contents of the tab. |\n| *Enabled*\
    \ | Indicates whether the tab should be displayed. The value of the property can\
    \ be changed on the client. |\n| *HeaderTemplate* | Gets and sets the template\
    \ to use to define the header of the tab. |\n| *HeaderText* | Gets and sets the\
    \ text to display in the tab's header. |\n| *OnClientClick* | JavaScript code\
    \ to attach to the client-side *click* event of the tab. |\n| *OnClientPopulated*\
    \ | JavaScript code to run on the client when the tab has been fully populated.\
    \ |\n| *OnClientPopulating* | JavaScript code to run on the client when the tab\
    \ is going to be populated. |\n| *Scrollbars* | Gets and sets the desired support\
    \ for scrollbars. This property is set to *Auto* by default. Feasible values come\
    \ from the ASPNET 2.0 *Scrollbars* type. |\n\nThe JavaScript code you can attach\
    \ to some client events can be either the name of function embedded in the host\
    \ page or a string of JavaScript executable code.\n\n# Using the *TabContainer*\
    \ Control\n\nLet's consider a sample page that makes use of the *TabContainer*\
    \ control. As you'll see in a moment, the markup required for a tab container\
    \ is straightforward.\n\n# Configuring the *TabContainer* Control\n\nThe *TabContainer*\
    \ tag maps its child tags to the *Tabs* collection of *TabPanel* objects. You\
    \ add one <TabPanel> tag for each desired tab and configure it at will. Here's\
    \ an example:\n\n```\n<act:TabContainer runat=\"server\" ID=\"TabContainer1\"\
    >\n    <act:TabPanel runat=\"server\" ID=\"TabPanel1\" HeaderText=\"Your Tab\"\
    >\n        <ContentTemplate>\n            <h3>Some text here</h3>\n        </ContentTemplate>\n\
    \    </act:TabPanel>\n    ...\n</act:TabContainer>\n```\n\nAll tabs are given\
    \ the same size, and you can control the size designation through the *Width*\
    \ and *Height* properties of the container. The height you set refers to the body\
    \ of tags and doesn't include the header."
- md: " ## Changing the Selected Tab\n\nYou can add some script code to run when the\
    \ user selects a new tab. You can wrap up all the code in a page-level JavaScript\
    \ function and bind the name of the function to the OnClientActiveTabChanged property\
    \ of the tab container. The following code writes the name of the currently selected\
    \ tab to a page element (originally, an ASP.NET Label control) named CurrentTab:\n\
    \n```\n<script type=\"text/javascript\">\n    function ActiveTabChanged(sender,\
    \ e)\n    {\n        var tab = $get('<%=CurrentTab.ClientID%>');\n        tab.innerHTML\
    \ = sender.get_activeTab().get_headerText();\n    }\n</script>\n```\n\nNote the\
    \ usage of code blocks in JavaScript. In this way, the client ID of the label\
    \ is merged in the script regardless of whether the page is a regular page or\
    \ a content page (with a hierarchy of parent controls and naming containers).\
    \ Figure 5-7 shows the control in action.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_77_0.png)\n\
    \n**Figure 5-7** The *TabContainer* control in action\n\n## The Client-Side Object\
    \ Model\n\nAs a full-fledged ASP.NET AJAX control, the TabContainer control exposes\
    \ a client-side object model. In particular, there's a set of properties that\
    \ represents the programming interface of the container and another set of properties\
    \ for each tab panel.\n\nThe container features read/write properties—such as\
    \ activeTabIndex, activeTab, tabs, and scrollBars—plus the activeTabChanged event.\n\
    \nThe tab panel exposes read/write properties such as *enabled*, *headerText*,\
    \ and *scrollBars* along with a read-only *tabIndex* property and a few events—*click*,\
    \ *populating*, and *populated*.\n\n## AJAX Control Toolkit Extenders\n\nIn addition\
    \ to finding full-fledged server controls such as *ReorderList* and *Accordion*\
    \ in the ACT, you find a bunch of other server controls designed to extend existing\
    \ controls on the page and provide them with new and additional behaviors. Existing\
    \ extenders can be categorized into a few groups: panel, input, popup, user interface,\
    \ animation, and button. Let's dig deeper into these groupings.\n\n## Panel Extenders\n\
    \nASP.NET pages are full of blocks of markup that, ideally, users would love to\
    \ move around, collapse if too large, and expand on demand. The perfect panel\
    \ control in ASP.NET is, therefore, both draggable and expandable. Purposely,\
    \ ASP.NET AJAX defines a few server-side behaviors that allow you to easily create\
    \ collapsible sections and drag panels around the page.\n\n### The *CollapsiblePanel*\
    \ Extender\n\nThe extender builds up a collapsible section in your pages by combining\
    \ two panels—one acting as the content panel, and one being the expand/collapse\
    \ controller. In its simplest form, the *CollapsiblePanel* extender looks like\
    \ the following code sample:\n\n```\n<act:CollapsiblePanelExtender ID=\"CollPanel\"\
    \ runat=\"server\"\n        TargetControlID=\"ContentPanel\"\n        ExpandControlID=\"\
    HeaderPanel\"\n        CollapseControlID=\"HeaderPanel\" />\n```\n\nAs usual,\
    \ the *TargetControlID* property sets the target panel to expand or collapse.\
    \ *ExpandControlID* and *CollapseControlID* indicate the panel to use to expand\
    \ and collapse the content panel. Note the extreme flexibility of the component\
    \ design—it might not make sense in all cases, but you can use different panels\
    \ to control the expansion and collapsing of the content panel. In most cases,\
    \ though, you'll be using the same header panel with an image button that changes\
    \ according to the state of the content panel. The following code snippet shows\
    \ a more complete usage for the extender:\n\n```\n<act:CollapsiblePanelExtender\
    \ ID=\"cpe\" runat=\"server\"\n        TargetControlID=\"CollapsibleCustomersPanelContent\"\
    \n        ExpandControlID=\"CollapsibleCustomersPanel\"\n        CollapseControlID=\"\
    CollapsibleCustomersPanel\"\n        Collapsed=\"true\"\n        ExpandDirection=\"\
    Vertical\"\n        ImageControlID=\"ToggleImage\"\n        ExpandedImage=\"~/images/collapse.jpg\"\
    \n        ExpandedText=\"Collapse\"\n        CollapsedImage=\"~/images/expand.jpg\"\
    \n        CollapsedText=\"Expand\" />\n```\n\nThe *ImageControlID* indicates the\
    \ *Image* control, if any, that if clicked causes the panel to expand or collapse.\
    \ The *ExpandedImage* and *CollapsedImage* properties set the URL of the images\
    \ to use to expand and collapse. Likewise, *CollapsedText* and *ExpandedText*\
    \ set the ToolTip text for the image. *Collapsed* sets the state of the panel,\
    \ whereas *ExpandDirection* indicates whether the panel expands horizontally or\
    \ vertically. Figure 5-8 provides a view of the control in action.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_79_0.png)\n\
    \nFigure 5-8 The *CollapsiblePanel* extender in action\n\nThe following code demonstrates\
    \ a typical pair of *Panel* controls used with the extender:\n\n```\n<asp:Panel\
    \ ID=\"CollapsibleCustomersPanel\" runat=\"server\">\n    <asp:Image ID=\"ToggleImage\"\
    \ runat=\"server\"\n               ImageUrl=\"~/images/collapse.jpg\" />\n   \
    \ <b>Customers</b>\n</asp:Panel>\n<asp:Panel ID=\"CollapsibleCustomersPanelContent\"\
    \ runat=\"server\"\n    Height=\"0\" CssClass=\"collapsePanel\">\n    ...\n</asp:Panel>\n\
    ```\n\nUnlike draggable panels, the header and content panels are distinct and\
    \ are typically placed one after the next in the page layout. The extender panel\
    \ is also *postback aware*, meaning that, on a client postback, it automatically\
    \ records and restores its collapsed/expanded client state.\n\n> Note To avoid\
    \ the initial flickering when a collapsible panel is displayed, make sure you\
    \ properly style the panel that is going to be collapsed and expanded. This panel\
    \ needs to have *Height=0* and the CSS *overflow* style set to *hidden*.\n\n###\
    \ The *DragPanel* Extender\n\nThe *DragPanel* extender is one of the simplest\
    \ extenders in the ACT. It has only two properties—one to indicate the panel to\
    \ drag, and one to indicate the panel to use as the drag handle:\n\n```\n<act:DragPanelExtender\
    \ ID=\"DragPanelExtender1\" runat=\"server\"\n                    TargetControlID=\"\
    CustomerPanel\"\n                    DragHandleID=\"CustomersDragHandle\" />\n\
    ```\n\nAs the name suggests, the TargetControlID property refers to the ID of\
    \ the panel control in the page that is going to be moved. The DragHandleID, on\
    \ the other hand, indicates the ID of the panel control that is used as the handle\
    \ of the drag. In other words, to drag the target panel users drag and drop the\
    \ handle panel. Although functionally distinct, the two panels are, in effect,\
    \ logically correlated and rendered through nested tags:\n\n```\n<asp:Panel ID=\"\
    CustomersPanel\" runat=\"server\" >\n    <asp:Panel ID=\"CustomersDragHandle\"\
    \ runat=\"server\">\n        <div style=\"background-color:yellow\">Customers</div>\n\
    \    </asp:Panel>\n    <asp:Panel runat=\"server\">\n        <asp:gridview runat=\"\
    server\" DataSourceID=\"ObjectDataSource1\">\n            <Columns>\n        \
    \        ...\n            </Columns>\n        </asp:gridview>\n        <asp:ObjectDataSource\
    \ ID=\"ObjectDataSource2\" runat=\"server\"\n                TypeName=\"IntroAjax.CustomerManager\"\
    \n                SelectMethod=\"LoadAll\">\n        </asp:ObjectDataSource>\n\
    \    </asp:Panel>\n</asp:Panel>\n```\n\nThe target panel usually contains as a\
    \ child the drag handle panel. In this way, you obtain the effect of moving the\
    \ whole panel as if it were a Microsoft Windows window. (See Figure 5-9.)\n\n\
    ![](img/db82dc55683fa403b8b16b76eb00cc2e_80_0.png)\n\n### The *DropDown* Extender\n\
    \nThe *DropDown* extender can be attached to virtually any ASP.NET control. Once\
    \ attached to a control, the extender provides a mouse-over link to open a drop-down\
    \ panel. The contents of the panel are entirely up to you—typically, arranged\
    \ as a menu. The drop-down is activated by clicking the extended control with\
    \ any mouse buttons.\n\n```\n<asp:Label ID=\"Label1\" runat=\"server\" Text=\"\
    Move the mouse here\" />\n<asp:Panel ID=\"Panel1\" runat=\"server\" CssClass=\"\
    ContextMenuPanel\"\n    Style=\"display:none;visibility:hidden;\">\n    <asp:LinkButton\
    \ runat=\"server\" ID=\"Option1\" Text=\"I'm the first\"\n        CssClass=\"\
    ContextMenuItem\" OnClick=\"LinkButton1_Click\" />\n    <asp:LinkButton runat=\"\
    server\" ID=\"Option2\" Text=\"I'm the second\"\n        CssClass=\"ContextMenuItem\"\
    \ OnClick=\"LinkButton1_Click\" />\n    <asp:LinkButton runat=\"server\" ID=\"\
    Option3\" Text=\"I'm the third\"\n        CssClass=\"ContextMenuItem\" OnClick=\"\
    LinkButton1_Click\" />\n</asp:Panel>\n\n<act:DropDownExtender runat=\"server\"\
    \ ID=\"DropDownExtender1\"\n    TargetControlID=\"Label1\" DropDownControlID=\"\
    Panel1\" />\n```\n\nIn the sample just shown, the drop-down user interface is\
    \ a *Panel* that contains a list of link buttons. Link buttons are styled to look\
    \ like menu items. Link and push buttons, and indeed embedded controls in general,\
    \ operate normally. (See Figure 5-10.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_81_0.png)\n\
    \n## Button Extenders\n\nButtons are by far one of the most common elements in\
    \ ASP.NET pages. However, as pages become functionally richer, additional features\
    \ are required for buttons to stay in sync with users' expectations. ASP.NET AJAX\
    \ provides a few extenders that apply to submit buttons and to the pseudo-buttons\
    \ that form a *CheckBox* element."
  mdcn: "\n## 更改选定的选项卡\n\n你可以添加一些脚本代码，以便在用户选择新选项卡时运行。你可以将所有代码封装在页面级JavaScript函数中，并将该函数的名称绑定到选项卡容器的`OnClientActiveTabChanged`属性。以下代码将当前选定的选项卡名称写入名为`CurrentTab`的页面元素（最初是一个ASP.NET\
    \ Label控件）：\n\n```\n<script type=\"text/javascript\">\n    function ActiveTabChanged(sender,\
    \ e)\n    {\n        var tab = $get('<%=CurrentTab.ClientID%>');\n        tab.innerHTML\
    \ = sender.get_activeTab().get_headerText();\n    }\n</script>\n```\n\n注意JavaScript中代码块的用法。通过这种方式，标签的客户端ID会合并到脚本中，无论页面是普通页面还是内容页面（具有父控件和命名容器的层次结构）。图5-7展示了该控件的实际效果。\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_77_0.png)\n\n**图5-7** *TabContainer*控件的实际效果\n\
    \n## 客户端对象模型\n\n作为一个功能齐全的ASP.NET AJAX控件，`TabContainer`控件公开了一个客户端对象模型。特别是，有一组属性代表容器的编程接口，另一组属性用于每个选项卡面板。\n\
    \n容器具有读/写属性——如`activeTabIndex`、`activeTab`、`tabs`和`scrollBars`——以及`activeTabChanged`事件。\n\
    \n选项卡面板公开读/写属性，如*enabled*、*headerText*和*scrollBars*，以及一个只读的*tabIndex*属性和一些事件——*click*、*populating*和*populated*。\n\
    \n## AJAX Control Toolkit 扩展器\n\n除了在ACT中找到功能齐全的服务器控件（如*ReorderList*和*Accordion*）外，你还会找到许多其他服务器控件，旨在扩展现有控件并为其提供新的附加行为。现有的扩展器可以分为几组：面板、输入、弹出窗口、用户界面、动画和按钮。让我们深入了解这些分组。\n\
    \n## 面板扩展器\n\nASP.NET页面充满了标记块，理想情况下，用户希望移动它们，如果太大则折叠，并按需展开。因此，ASP.NET中完美的面板控件既是可拖动的又是可扩展的。为此，ASP.NET\
    \ AJAX定义了一些服务器端行为，使你可以轻松创建可折叠部分和在页面上拖动面板。\n\n### *CollapsiblePanel*扩展器\n\n该扩展器通过组合两个面板（一个作为内容面板，另一个作为展开/折叠控制器）来在你的页面中构建可折叠部分。在最简单的形式中，*CollapsiblePanel*扩展器如下代码示例所示：\n\
    \n```\n<act:CollapsiblePanelExtender ID=\"CollPanel\" runat=\"server\"\n     \
    \   TargetControlID=\"ContentPanel\"\n        ExpandControlID=\"HeaderPanel\"\n\
    \        CollapseControlID=\"HeaderPanel\" />\n```\n\n与往常一样，*TargetControlID*属性设置要展开或折叠的目标面板。*ExpandControlID*和*CollapseControlID*指示用于展开和折叠内容面板的面板。注意组件设计的极高灵活性——虽然在所有情况下可能并不都有意义，但你可以使用不同的面板来控制内容面板的展开和折叠。不过，在大多数情况下，你会使用相同的标题面板，其中包含一个根据内容面板状态而变化的图像按钮。以下代码片段展示了该扩展器更完整的用法：\n\
    \n```\n<act:CollapsiblePanelExtender ID=\"cpe\" runat=\"server\"\n        TargetControlID=\"\
    CollapsibleCustomersPanelContent\"\n        ExpandControlID=\"CollapsibleCustomersPanel\"\
    \n        CollapseControlID=\"CollapsibleCustomersPanel\"\n        Collapsed=\"\
    true\"\n        ExpandDirection=\"Vertical\"\n        ImageControlID=\"ToggleImage\"\
    \n        ExpandedImage=\"~/images/collapse.jpg\"\n        ExpandedText=\"Collapse\"\
    \n        CollapsedImage=\"~/images/expand.jpg\"\n        CollapsedText=\"Expand\"\
    \ />\n```\n\n*ImageControlID*指示*Image*控件（如果有），单击该控件会导致面板展开或折叠。*ExpandedImage*和*CollapsedImage*属性设置用于展开和折叠的图像的URL。同样，*CollapsedText*和*ExpandedText*设置图像的工具提示文本。*Collapsed*设置面板的状态，而*ExpandDirection*指示面板是水平还是垂直展开。图5-8提供了该控件的实际效果视图。\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_79_0.png)\n\n图5-8 *CollapsiblePanel*扩展器的实际效果\n\
    \n以下代码演示了与扩展器一起使用的一对典型*Panel*控件：\n\n```\n<asp:Panel ID=\"CollapsibleCustomersPanel\"\
    \ runat=\"server\">\n    <asp:Image ID=\"ToggleImage\" runat=\"server\"\n    \
    \           ImageUrl=\"~/images/collapse.jpg\" />\n    <b>Customers</b>\n</asp:Panel>\n\
    <asp:Panel ID=\"CollapsibleCustomersPanelContent\" runat=\"server\"\n    Height=\"\
    0\" CssClass=\"collapsePanel\">\n    ...\n</asp:Panel>\n```\n\n与可拖动面板不同，标题和内容面板是独立的，通常在页面布局中一个接一个地放置。扩展器面板也是*回发感知*的，这意味着在客户端回发时，它会自动记录并恢复其折叠/展开的客户端状态。\n\
    \n> 注意 为避免显示可折叠面板时的初始闪烁，请确保正确设置将要折叠和展开的面板的样式。此面板需要将*Height=0*，并将CSS *overflow*样式设置为*hidden*。\n\
    \n### *DragPanel*扩展器\n\n*DragPanel*扩展器是ACT中最简单的扩展器之一。它只有两个属性——一个用于指示要拖动的面板，另一个用于指示用作拖动句柄的面板：\n\
    \n```\n<act:DragPanelExtender ID=\"DragPanelExtender1\" runat=\"server\"\n   \
    \                 TargetControlID=\"CustomerPanel\"\n                    DragHandleID=\"\
    CustomersDragHandle\" />\n```\n\n顾名思义，TargetControlID属性指的是页面中将要移动的面板控件的ID。另一方面，DragHandleID指示用作拖动句柄的面板控件的ID。换句话说，要拖动目标面板，用户需要拖放句柄面板。虽然功能上不同，但这两个面板实际上在逻辑上是相关的，并通过嵌套标签呈现：\n\
    \n```\n<asp:Panel ID=\"CustomersPanel\" runat=\"server\" >\n    <asp:Panel ID=\"\
    CustomersDragHandle\" runat=\"server\">\n        <div style=\"background-color:yellow\"\
    >Customers</div>\n    </asp:Panel>\n    <asp:Panel runat=\"server\">\n       \
    \ <asp:gridview runat=\"server\" DataSourceID=\"ObjectDataSource1\">\n       \
    \     <Columns>\n                ...\n            </Columns>\n        </asp:gridview>\n\
    \        <asp:ObjectDataSource ID=\"ObjectDataSource2\" runat=\"server\"\n   \
    \             TypeName=\"IntroAjax.CustomerManager\"\n                SelectMethod=\"\
    LoadAll\">\n        </asp:ObjectDataSource>\n    </asp:Panel>\n</asp:Panel>\n\
    ```\n\n目标面板通常包含拖动句柄面板作为子级。通过这种方式，你可以获得移动整个面板的效果，就像它是Microsoft Windows窗口一样。（参见图5-9。）\n\
    \n![](img/db82fc55683fa403b8b16b76eb00cc2e_80_0.png)\n\n### *DropDown*扩展器\n\n\
    *DropDown*扩展器可以附加到几乎任何ASP.NET控件。一旦附加到控件，该扩展器提供一个鼠标悬停链接以打开下拉面板。面板的内容完全由你决定——通常，安排为一个菜单。下拉菜单通过使用任何鼠标按钮单击扩展控件来激活。\n\
    \n```\n<asp:Label ID=\"Label1\" runat=\"server\" Text=\"Move the mouse here\"\
    \ />\n<asp:Panel ID=\"Panel1\" runat=\"server\" CssClass=\"ContextMenuPanel\"\n\
    \    Style=\"display:none;visibility:hidden;\">\n    <asp:LinkButton runat=\"\
    server\" ID=\"Option1\" Text=\"I'm the first\"\n        CssClass=\"ContextMenuItem\"\
    \ OnClick=\"LinkButton1_Click\" />\n    <asp:LinkButton runat=\"server\" ID=\"\
    Option2\" Text=\"I'm the second\"\n        CssClass=\"ContextMenuItem\" OnClick=\"\
    LinkButton1_Click\" />\n    <asp:LinkButton runat=\"server\" ID=\"Option3\" Text=\"\
    I'm the third\"\n        CssClass=\"ContextMenuItem\" OnClick=\"LinkButton1_Click\"\
    \ />\n</asp:Panel>\n\n<act:DropDownExtender runat=\"server\" ID=\"DropDownExtender1\"\
    \n    TargetControlID=\"Label1\" DropDownControlID=\"Panel1\" />\n```\n\n在刚刚显示的示例中，下拉用户界面是一个包含链接按钮列表的*Panel*。链接按钮被设置为看起来像菜单项。链接和按钮，以及实际上一般的嵌入式控件，都可以正常操作。（参见图5-10。）\n\
    \n![](img/db82fc55683fa403b8b16b76eb00cc2e_81_0.png)\n\n## 按钮扩展器\n\n到目前为止，按钮是ASP.NET页面中最常见的元素之一。然而，随着页面功能日益丰富，按钮需要附加功能以保持与用户期望同步。ASP.NET\
    \ AJAX提供了一些扩展器，适用于提交按钮以及构成*CheckBox*元素的伪按钮。\n"
