    \ 表示所请求员工的 ID。（参见图 1-5。）\n\n```\ndefault.aspx?outofband=true&param=1\n```\n\n\
    在大多数浏览器上正确显示结果可能比较棘手。事实上，Internet Explorer 在 DOM 中支持许多非标准的快捷方式，而这些在其他浏览器中根本无法使用。最常见的陷阱是使用\
    \ *document.getElementById* 方法而不是元素的直接名称来获取 HTML 元素的引用。例如，以下代码在 Internet Explorer\
