  md: "```\n<strong>How old are you?</strong>\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" />\n```\n\n```\n<act:FilteredTextBoxExtender ID=\"Filtered1\" runat=\"\
    server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"Numbers\" />\n```\n\
    \nThe preceding text box is expected to accept a number indicating the age of\
    \ the user. Clearly, it can accept only numbers. The extender ensures that only\
    \ numbers can be typed in the input field. It does that by adding a piece of JavaScript\
    \ code to the text box to filter out undesired characters.\n\nThe extender supports\
    \ a few properties, including FilterType, which determine the filter applied to\
    \ the input. The property can take any of the following values: Numbers, UppercaseLetters,\
    \ LowercaseLetters, and Custom. The effect of the filter is obvious for the first\
    \ three cases. When Custom is specified, though, you also set the ValidChars property\
    \ to a comma-separated string where each item denotes a valid character. For example,\
    \ the following code allows users to enter only A and B characters regardless\
    \ of the case:\n\n```\n<act:FilteredTextBoxExtender ID=\"Filtered1\" runat=\"\
    server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"Custom\"\n    ValidChars=\"\
    A,a,B,b\" />\n```\n\nYou can't combine multiple filters on the same text box.\
    \ If you want to filter all but letters, you can't add two FilteredTextBox extenders\
    \ to the same control. Instead, you resort to a custom filter where you specify\
    \ in the ValidChars property all acceptable characters.\n\n> Important Client-side\
    \ filtering, as well as validation, is subject to the action of some JavaScript\
    \ code. This means that by deactivating JavaScript on the client browser, any\
    \ filtering or validation is subsequently disabled. In any case, you should not\
    \ blindly trust what's typed by a user in a text box and, instead, apply proper\
    \ filtering and validation on the server before you use that data for critical\
    \ operations.\n\n# The MaskedEdit Extender\n\nAdded to a TextBox control, the\
    \ MaskedEdit extender forces users to enter input according to the specified mask.\
    \ In addition, data is validated on the client according to the data type chosen.\
    \ To achieve the validation, a new validator control is introduced—MaskedEditValidator—that\
    \ verifies the input. The masked edit validator is, in turn, associated with an\
    \ instance of the masked edit extender:\n\n```\n<asp:TextBox runat=\"server\"\
    \ ID=\"TextBox1\" />\n```\n\n```\n<act:MaskedEditValidator ID=\"MaskedEditValidator1\"\
    \ runat=\"server\"\n    ControlExtender=\"MaskedEditExtender1\"\n    ControlToValidate=\"\
    TextBox1\"\n    IsValidEmpty=\"False\"\n```"
