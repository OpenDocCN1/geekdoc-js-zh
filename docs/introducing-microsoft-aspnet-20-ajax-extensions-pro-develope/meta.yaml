    \ request is made? Which page method is executed?\n\nASP.NET Script Callback defines\
    \ an interface—the *ICallbackEventHandler* interface—that any server object that\
    \ is the target of an out-of-band call can implement. The target of the out-of-band\
    \ call can be either the page or any of its child controls. The execution of an\
    \ out-of-band call is divided into two steps: preparation and results generation.\
    \ The *RaiseCallbackEvent* method of the *ICallbackEventHandler* interface is\
    \ invoked first to prepare the remote code execution. The *GetCallbackResult*\
    \ method is invoked later in the request life cycle when it is time for the ASP.NET\
    \ runtime to generate the response for the browser.\n\nAll in all, the programming\
    \ interface of ASP.NET Script Callback is a bit clumsy. Although the programming\
    \ interface shields developers from a lot of internal details, it still requires\
    \ the programmer to have good JavaScript skills and is articulated in a bunch\
    \ of boilerplate server code. You need server code to bind HTML elements to client-side\
    \ event handlers, and you need ad hoc server code to publish a programming interface\
    \ that is callable from the client. Each request carries with it a copy of the\
    \ original view state and rebuilds the last known good state on the server. In\
    \ other words, the original value of all input fields in the currently displayed\
    \ page (regardless of any changes entered before the out-of-band call is made)\
    \ are sent to the server along with any parameters for the server method. Any\
    \ out-of-band calls are processed as a regular postback request up to the pre-rendering\
    \ stage, meaning that all standard server events are fired: *Init*, *Load*, *LoadComplete*,\
    \ and so on. Before the pre-rendering stage, the callback is prepared and executed\
    \ shortly after. The requests ends immediately after the server method executes.\
    \ The view state is not updated to reflect the state of the page after the out-of-band\
    \ call and subsequently, it is not sent back to the client.\n\nThe advantage of\
    \ using ASP.NET Script Callback is that it is a native part of ASP.NET and can\
    \ be easily encapsulated in server controls. For example, the *TreeView* control\
    \ in ASP.NET 2.0 uses script callbacks to expand its nodes.\n\nASP.NET Script\
    \ Callback is not free of significant issues, however. In particular, the server\
    \ method is constrained to a fixed signature and can only take and return a string.\
    \ Sure, you can place any contents in the string, but the serialization and deserialization\
    \ of custom objects to the string is something you must take care of entirely\
    \ on your own. In addition, a page based on ASP.NET Script Callback can have only\
    \ one endpoint for remote calls. This means that if a client page needs to place\
    \ two distinct calls to the same remote page, you have to implement a switch in\
    \ the implementation of the *ICallbackEventHandler* interface to interpret which\
    \ method was intended to be executed.\n\n## The AJAX.NET Professional Library\n\
    \nTo effectively implement out-of-band calls in application-wide scenarios, a\
    \ kind of framework is required that hides all the nitty-gritty details of HTTP\
    \ communication and exposes additional and higher-level controls and services.\n\
    \n## Part I  ASP.NET AJAX Building Blocks\n\nAJAX.NET Professional (AjaxPro) is\
    \ a pretty popular open-source library that adds a good layer of abstraction over\
    \ the *XMLHttpRequest* machinery. Written by Michael Schwarz, the library creates\
    \ proxy classes that are used by client-side JavaScript to invoke methods on the\
    \ server page. The AjaxPro framework provides full data type support and works\
    \ on all common Web browsers, including mobile devices. Nicely enough, the library\
    \ can be used with both ASP.NET 1.1 and ASP.NET 2.0.\n\nThe key tool behind the\
    \ AjaxPro library is an HTTP handler that hooks up any HTTP requests generated\
    \ by the client-side part of the library:\n\n```\n<httpHandlers>\n  <add verb=\"\
    POST,GET\" path=\"ajaxpro/*.ashx\"\n        type=\"AjaxPro.AjaxHandlerFactory,\
    \ AjaxPro.2\" />\n</httpHandlers>\n```\n\nOnce the *web.config* file has been\
    \ correctly set up, you write JavaScript functions to trigger and control the\
    \ out-of-band call. Each call targets a JavaScript object that represents the\
    \ publicly callable method on the server ASP.NET page. A client-callable method\
    \ is just a public method decorated with a specific attribute, as shown here:\n\
    \n```\n[AjaxPro.AjaxMethod]\npublic DateTime GetCurrentTimeOnServer()\n{\n  return\
    \ DateTime.Now;\n}\n```\n\nThe class with public methods, as well as any custom\
    \ types used for I/O, has to be registered with the framework to have the corresponding\
    \ JavaScript proxy created:\n\n```\nprotected void Page_Load(object sender, EventArgs\
    \ e)\n{\n  AjaxPro.Utility.RegisterTypeForAjax(typeof(YourAjaxClass));\n}\n```\n\
    \nIf you do this, the handler guarantees that any managed .NET object that is\
    \ returned by a server method will be serialized to a dynamically created JavaScript\
    \ object to be seamlessly used on the client. You can return any managed type,\
    \ your own classes, or enum types as you would do in plain .NET code. No view\
    \ state is available during the AJAX request, meaning that you can't do much with\
    \ page controls. In light of this, it is recommended that you create callable\
    \ methods as static methods preferably, though not necessarily, on a separate\
    \ class.\n\nAjaxPro has some key advantages over the ASP.NET Script Callback API.\
    \ It uses an attribute to mark server methods that can be called from the client.\
    \ This means that you have the greatest flexibility when it comes to defining\
    \ the server public interface callable from the client. In particular, you don't\
    \ have to change the flow of the code or add new ad hoc methods just to comply\
    \ with the requested programming interface.\n\nIn addition, you can register server\
    \ types for use on the client, which provides for a strong-typed data transfer.\
    \ The AjaxPro infrastructure serializes .NET types to JavaScript objects and vice\
    \ versa. The AJAX.NET hooks up and replaces the standard request processing mechanism\
    \ of ASP.NET—the page handler. As a result, you won't receive classic ASP.NET\
    \ server events such as Init, Load, and postback. At the same time, you won't\
    \ have the view state automatically transmitted with each out-of-band request.\
    \ An AjaxPro request, though, is still processed by the ASP.NET HTTP runtime,\
    \ meaning that the request is still subject to the modules registered with the\
    \ HTTP pipeline, including session state management, roles, and authentication.\n\
    \nFor more information about the AjaxPro library, you can take a look at *http://www.ajaxpro.info*.\
    \ There you will also find a link to the CodePlex Web site to get the source code\
    \ of the library.\n\n### The Anthem.NET Framework\n\nAnthem.NET is a free, cross-browser\
    \ AJAX toolkit for both ASP.NET 1.1 and 2.0, written by Jason Diamond. The library\
    \ is made of a number of server controls that use *XMLHttpRequest* to post back.\
    \ It sets itself apart from AjaxPro because it fully integrates with the classic\
    \ life cycle of each ASP.NET request. The view state is sent across the wire,\
    \ and server-side page and control events such as *Init*, *Load*, and *PreRender*\
    \ are regularly fired. As a result, you write a page using the same programming\
    \ model of ASP.NET, you are not required to write any JavaScript yourself, and\
    \ you still leverage the beauty of the AJAX model. The only difference with a\
    \ traditional ASP.NET application is that you use a different set of server controls,\
    \ most of which are just subclassed versions of the original ASP.NET controls.\n\
    \nExtremely lean and easy to use, Anthem.NET implements AJAX functionalities through\
    \ the \"partial rendering\" model applied at the control level. The partial rendering\
    \ model is the same model that ASP.NET AJAX pushes hard. (See Chapter 4, \"Partial\
    \ Page Rendering.\") For more information, check out *http://www.anthemdotnet.com*.\n\
    \n### The ComfortASP.NET Framework\n\nConceptually similar to Anthem.NET, but\
    \ significantly different in its implementation, is Daniel Zeiss' ComfortASP.NET\
    \ framework. ComfortASP.NET uses a manager server control to inject script code\
    \ in the client page. Invisible to the page author, the script code hooks up client\
    \ postbacks and replaces them with calls to *XMLHttpRequest*.\n\nOnce back on\
    \ the server, the manager component takes control of the operations and determines\
    \ the delta between the current page and the page resulting from the processing\
    \ of the current request. The markup that describes the changes in the displayed\
    \ page is sent back and used to dynamically modify the page contents on the client\
    \ via the previously emitted script. The server life cycle of the page is executed\
    \ as usual, and events such as *Init* and *Load* are fired when expected."
