    \ ASP.NET 请求的经典生命周期。视图状态在线路上传输，并且服务器端页面和控件事件（如 *Init*、*Load* 和 *PreRender*）会按常规触发。因此，你使用与\
    \ ASP.NET 相同的编程模型编写页面，不需要自己编写任何 JavaScript，并且仍然能利用 AJAX 模型的优势。与传统 ASP.NET 应用程序的唯一区别是你使用了不同的服务器控件集，其中大多数只是原始\
    \ ASP.NET 控件的子类化版本。\n\nAnthem.NET 非常精简且易于使用，它通过应用于控件级别的“部分呈现”模型来实现 AJAX 功能。部分呈现模型与\
    \ ASP.NET AJAX 大力推行的模型相同。（参见第 4 章，“部分页面呈现”。）欲了解更多信息，请查看 *http://www.anthemdotnet.com*。\n\
