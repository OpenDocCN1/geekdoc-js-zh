- md: ' ## Chapter 1

    ## The AJAX Revolution


    **In this chapter:**

    The Paradigm Shift ......................................................................4

    The AJAX Core Engine .................................................................10

    ASP.NET AJAX in Person .................................................................30

    Conclusion ...................................................................................34


    Gone are the days when a Web application could be architected and implemented
    as a collection of related and linked pages. The advent of the so-called AJAX
    model is radically modifying the user''s perception of a Web application, and
    it is subsequently forcing developers to apply newer and richer models to the
    planning and implementation of modern Web applications. But what is the AJAX model,
    anyway?


    AJAX is a relatively new acronym that stands for *Asynchronous JavaScript and
    XML*. It is a sort of blanket term used to describe highly interactive and responsive
    Web applications. What''s the point here? Weren''t Web applications created about
    a decade ago specifically to be "interactive," "responsive," and deployed over
    a unique tool called the browser? So what''s new today?


    The incredible success of the Internet has whetted people''s appetite for Web-related
    technology beyond imagination. Over the years, the users'' demand for ever more
    powerful and Web-exposed applications and services led architects and developers
    to incorporate more and more features into the server platform and client browser.
    As a result, the traditional pattern of Web applications is becoming less adequate
    every day. A radical change in the design and programming model cannot be further
    delayed.


    At the current state of the art, the industry needs more than just an improved
    and more powerful platform devised along the traditional guidelines and principles
    of Web applications—a true paradigm shift is required. AJAX is the incarnation
    of a new paradigm for the next generation of Web applications that is probably
    destined to last for at least the next decade.


    From a more developer-oriented perspective, AJAX collectively refers to a set
    of development components, tools, and techniques for creating highly interactive
    Web applications that give users a better experience. According to the AJAX paradigm,
    Web applications work by exchanging data rather than pages with the Web server.
    From a user perspective, this means that faster roundtrips occur and, more importantly,
    page loading and refresh is significantly reduced. As a result, a Web application
    tends to look like a classic desktop Microsoft Windows application and has advanced
    features such as drag-and-drop and asynchronous tasks, a strongly responsive and
    nonflickering user interface, and other such features that minimize user frustration,
    provide timely feedback about what''s going on, and deliver great mashed-up content.
    (Hold on! This doesn''t mean AJAX Web applications *are the same as* desktop applications;
    they simply allow for a few more desktop-like features.)


    ### The Paradigm Shift


    AJAX is the philosophy that has inspired a new generation of components and frameworks,
    each designed to target a particular platform, provide a given set of capabilities,
    and possibly integrate seamlessly with existing frameworks. Microsoft ASP.NET
    AJAX Extensions is the AJAX addition to the ASP.NET 2.0 platform. In the next
    major release of the .NET Framework platform ASP.NET AJAX Extensions will officially
    fuse to ASP.NET and the rest of the Microsoft Web platform and application model.
    The next release of Microsoft Visual Studio (code-named "Orcas") will also integrate
    ad hoc design-time support for AJAX-specific features.


    In this chapter, I''ll dig deeper into the motivation for and driving force behind
    AJAX and then review the basic system requirements common to all AJAX frameworks.


    We are all witnessing and contributing to an interesting and unique phenomenon—the
    Web is undergoing an epochal change right before our eyes as a result of our actions.
    As drastic as it might sound, the Web revolutionized the concept of an application.
    Only eight years ago, the majority of developers considered an application far
    too serious a thing to reduce it to an unordered mix of script and markup code.
    In the late 1990s, the cost of an application was sweat, blood, tears, and endless
    debugging sessions. According to the common and semi-serious perception there
    was neither honor nor fame for the "real" programmer in writing Web applications.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_14_0.png)


    > **Note** In the late 1990s, though, a number of Web sites were designed and
    built. Some of them grew incredibly in the following years to become pillars of
    today''s world economy and even changed the way we do ordinary things. Want some
    examples? Google, Amazon, eBay. Nonetheless, a decade ago the guys building these
    and other applications were sort of avant-garde developers, perhaps even just
    smart and game amateurs.


    Since then, the Web has evolved significantly. And although 10 years of Web evolution
    has resulted in the building of a thick layer of abstraction on the server side,
    it hasn''t changed the basic infrastructure—HTTP protocol and pages.


    The original infrastructure—one that was simple, ubiquitous, and effective—was
    the chief factor for the rapid success of the Web model of applications. The next
    generation of Web applications will still be based on the HTTP protocol and pages.
    However, the contents of pages and the capabilities of the server-side machinery
    will change to provide a significantly richer user experience—as rich as that
    of classic desktop Windows applications.


    > Note As we''ll see in greater detail in Chapter 8, "Building AJAX Applications
    with ASP.NET," AJAX applications have a number of plusses but also a few drawbacks.
    Overall, choosing an AJAX application rather than a classic Web application is
    simply a matter of weighing the trade-offs. An AJAX application certainly gives
    users continuous feedback and never appears held up by some remote operation.
    On the other hand, AJAX applications are not entirely like desktop applications,
    and their capabilities in terms of graphics, multimedia, and hardware control
    are not as powerful as in a regular (smart) client. In the end, AJAX applications
    are just one very special breed of a Web application; as such, they might require
    some code refactoring to deliver the expected performance and results.


    ### Classic Web Applications


    Today Web applications work by submitting user-filled forms to the Web server
    and displaying the markup returned by the Web server. The browser-to-server communication
    employs the classic HTTP protocol. As is widely known, the HTTP protocol is stateless,
    which means that each request is not related to the next and no state is automatically
    maintained. (The state objects we all know and use in, say, ASP.NET are nothing
    more than an abstraction provided by the server programming environment.)


    Communication between the browser and the Web server occurs through "forms." From
    a user''s perspective, the transition occurs through "pages." Each user action
    that originates a new request for the server results in a brand new page (or a
    revamped version of the current page) being downloaded and displayed.


    Let''s briefly explore this model a bit further to pinpoint its drawbacks and
    bring to the surface the reasons why a new model is needed.


    ### Send Input via Forms


    Based on the URL typed in the address bar, the browser displays a page to the
    user. The page is ultimately made of HTML markup and contains one or more HTML
    forms. The user enters some data, and then instructs the browser to submit the
    form to an action URL.


    Using the local Domain Name System (DNS) resolver in the operating system, the
    browser resolves the specified URL to an IP address and opens a socket. An HTTP
    packet travels over the wire to the given destination. The packet includes the
    form and all its fields. The request is captured by the Web client-haserver and
    typically forwarded to an intern module for further processing. At the end of
    the process, an HTTP response packet is prepared and the return value for the
    browser is inserted in the body.


    ### Get Output through Pages


    When a request is made for, say, an .aspx resource, the Web server passes it on
    to ASP.NET for processing and receives the resulting HTML markup in return. The
    generated markup'
