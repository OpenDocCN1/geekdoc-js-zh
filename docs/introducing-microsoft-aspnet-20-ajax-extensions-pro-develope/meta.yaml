- img_proc: true
  md: "and Humans Apart. In practice, CAPTCHA is a challenge-response test that requires\
    \ the provision of additional information that must be figured out on the fly.\
    \ Figuring this out is nothing special for humans, but virtually impossible for\
    \ automated programs. The most popular example of CAPTCHA technique is a distorted\
    \ image that represents a number. In a variety of blog systems, users encounter\
    \ an additional input field to specify a number depicted within a figure before\
    \ their posts will be accepted.\n\nThe NoBot extender is a control that attempts\
    \ to apply anti-bot techniques to input forms. The extender might not be as powerful\
    \ as a distorted image with a number inside, but it has the advantage of being\
    \ completely invisible and hard to detect. All in all, the NoBot extender’s usefulness\
    \ is probably limited to sites with low traffic where the main goal is stopping\
    \ spam, and where it’s not a big deal if it doesn’t achieve 100-percent effectiveness.\n\
    \n# The NumericUpDown Extender\n\nAdded to a TextBox control, the NumericUpDown\
