    ```\n\n总之，需要跨浏览器的 JavaScript 代码来更新客户端当前显示的页面。同时，在服务器端也必须做出一些假设，以提供一个可用且高效的环境。因此，框架是实现\
    \ AJAX 功能的唯一合理方式。然而，不同的框架可能在使用相同公共组件集合的引擎之上，提供不同的编程接口。\n\n## 切换到文档对象模型\n\n微软自\
    \ 1990 年代末期就开始引领可更新网页的发展。随着 Internet Explorer 4.0（早在 1997 年发布）的推出，微软引入了动态 HTML（DHTML），这是\
    \ HTML、样式表和脚本的强大组合，允许以编程方式更改任何已显示的页面。此后，多家公司开发了自己的 DHTML 对象模型——通常被称为浏览器对象模型（BOM）。W3C\
    \ 委员会努力推动各厂商就一个可互操作且语言无关的解决方案达成一致，以便通过可更新的编程接口暴露 Web 页面。其结果就是文档对象模型（DOM），它不同于特定于浏览器的\
    \ BOM。\n\nDOM 是一个独立于平台且语言无关的 Web 页面内容表示，脚本可以访问并使用它来修改文档的内容、结构和样式。\n\n对于 AJAX 而言，核心就是与远程服务器交换数据。但一旦数据在客户端以带外方式下载完毕，你能用它做什么呢？DOM\
    \ 为数据流入当前页面结构并更新它提供了一个出口。\n\n## 文档的表示\n\nDOM 是浏览器暴露的一个标准 API，其中已显示的页面具有基于树的结构。逻辑树中的每个节点对应一个对象。另一方面，\"\
    文档对象模型\"这个名字暗示了一个在面向对象设计术语的通用解释中的对象模型。一个 Web 页面——即文档——通过对象来建模。该模型包括文档的结构和行为。逻辑树中的每个节点不是静态数据；相反，它是一个具有已知行为和自身身份的活动对象。\n\
    \n## DOM 实现\n\nW3C DOM 由三个级别组成，它们对浏览器而言表示三个不同程度的标准遵从性。更多信息请参阅 http://www.w3.org/DOM。\n\
    \nDOM 由节点组成，每个节点都是一个对象。对于一个 Web 页面，每个节点映射到一个表示 HTML 标签的对象。因此，该对象具有可应用于 HTML 标签的属性和方法。你可以在节点上完成三个基本操作：查找节点（包括子节点、父节点或兄弟节点等关联节点）、创建节点以及操作节点。\n\
    \n只要页面作者知道相应元素的 ID，标识特定节点就很容易。在这种情况下，你使用以下标准代码：\n\n```\nvar node = document.getElementById(id);\n\
    ```\n\n特别地，如果有多个元素共享相同的 ID 值，该方法返回集合中的第一个对象。此方法在 DOM Level 1 及更高版本中都受支持。另一个用于查找元素的有趣方法如下：\n\
    \n```\nvar coll = document.getElementsByTagName(tagname);\n```\n\n该方法检索基于相同 HTML\
    \ 标签的所有对象的集合。例如，该方法检索页面中所有 `<div>` 或所有 `<input>` 标签的集合。\n\n相关的 DOM 对象被分组在节点列表中。每个节点都有名称、类型、父节点和子节点集合。节点还保存对其兄弟节点和属性的引用。以下代码片段展示了如何获取节点的父节点及其前一个兄弟节点：\n\
    \n```\nvar oParent = oNode.parentNode\nvar oPrevious = oNode.previousSibling\n\
    ```\n\n如何修改节点的内容？最简单且最常见的方法是使用 innerHTML 属性：\n\n```\nvar node = document.getElementById(\"\
    button1\");\nnode.innerHTML = \"Hey click me\";\n```\n\ninnerHTML 属性几乎被所有浏览器支持，它设置或获取给定对象开始标签和结束标签之间的\
    \ HTML。某些浏览器（如 Internet Explorer）还支持 innerText 属性。该属性用于设置或获取给定 DOM 对象内的文本。遗憾的是，此属性并非所有浏览器都支持。它存在于\
    \ Internet Explorer 和 Safari 中，但例如在 Firefox 中不受支持。而 Firefox 支持一个具有类似行为但名称不同的属性——textContent。\n\
    ```\n"
