    \ 扩展器以模态方式显示与 *PopupControlID* 属性所标识控件相关联的任何内容。此场景中的 *TargetControlID* 属性指向一个可点击的控件：\n\
    \n```\n<act:ModalPopupExtender ID=\"ModalPopupExtender1\" runat=\"server\"\n \
    \       TargetControlID=\"LinkButton1\"\n        PopupControlID=\"PopupContent\"\
    \n        OkControlID=\"Button1\"\n        CancelControlID=\"Button2\">\n```\n\
    \n请注意，*ModalPopup* 扩展器是由目标控件上的 *onclick* 事件触发的。因此，目标控件必须是支持点击操作的控件。弹出控件不必是 *Panel*\
    \ 控件；通常来说，它可以是任何控件。不过，它一般是一个包含多个子控件的控件——通常是 *Panel*。\n\n在弹出面板中，你可以有选择地指定一个\"确定\"\
    控件和一个\"取消\"控件。你通过 *OkControlID* 和 *CancelControlID* 属性设置这些控件（通常是按钮）的 ID。弹出行为显然是客户端操作，因此可能需要一些\
    \ JavaScript 代码来响应用户点击\"确定\"或\"取消\"控件。你可以使用 *OnOkScript* 属性指定用户点击\"确定\"按钮时要运行的\
    \ JavaScript 函数；使用 *OnCancelScript* 指定点击\"取消\"时要执行的函数。\n\n以下标记展示了一个示例模态面板的内容。请注意，*Panel*\
    \ 控件应将其 CSS *display* 属性设置为 *none*，以使所有内容在初始状态下不可见。\n\n```\n<asp:LinkButton ID=\"\
    LinkButton1\" runat=\"server\" text=\"Click me\" />\n<asp:Panel runat=\"server\"\
    \ ID=\"PopupContent\" BackColor=\"Yellow\">\n        <div style=\"margin:10px\"\
    >\n        Take note of this message and tell us if you strongly agree.\n    \
    \    <br /><br />\n        <asp:Button ID=\"Button1\" runat=\"server\" Text=\"\
    Yes\" width=\"40px\"  />\n        <asp:Button ID=\"Button2\" runat=\"server\"\
    \ Text=\"No\"  width=\"40px\" />\n        </div>\n</asp:Panel>\n```\n\n图 5-13\
    \ 展示了模态对话框的实际效果。\n\n两个图形属性——*DropShadow* 和 *BackgroundCssClass*——完善了该扩展器的功能。*DropShadow*\
    \ 是一个布尔属性，用于指示是否应渲染如图 5-13 所示的投影效果。而 *BackgroundCssClass* 则决定了临时应用于底层页面的样式：\n\n\
    ![](img/db82dc55683fa403b8b16b76eb00cc2e_87_0.png)\n\n图 5-13 *ModalPopup* 扩展器的实际效果\n\
    \n```\nmodalBackground {\n    background-color:Gray;\n    filter:alpha(opacity=70);\n\
    \    opacity:0.7;\n}\n```\n\n上述样式使页面变灰并呈现半透明效果，以获得更美观的视觉体验。\n\n## *PopupControl*\
    \ 扩展器\n\n*PopupControl* 扩展器可以附加到任何触发 *onclick*、*onfocus* 或 *onkeydown* 事件的 HTML\
    \ 元素上。该扩展器的最终目的是显示一个弹出窗口，展示额外内容，例如在用户需要输入日期的文本框上显示一个日历。弹出面板的内容通过 *Panel* 控件来表达，其中可以包含\
    \ ASP.NET 服务器控件以及静态文本和 HTML 元素：\n\n```\n<asp:TextBox runat=\"server\" ID=\"InvoiceDateTextBox\"\
    \ />\n<asp:Panel runat=\"server\" ID=\"Panel1\">\n    ...\n</asp:Panel>\n```\n\
    \n```\n<act:PopupControlExtender ID=\"PopupExtender1\" runat=\"server\"\n    TargetControlID=\"\
    InvoiceDateTextBox\"\n    PopupControlID=\"Panel1\"\n    Position=\"Bottom\" />\n\
    ```\n\n*TargetControlID* 属性指向触发弹出窗口的控件，而 *PopupControlID* 指示要显示的面板。*Position*\
    \ 属性设置面板的位置——可以是父控件的顶部、左侧、右侧或底部。（参见图 5-14。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_88_0.png)\n\
    \n图 5-14 *PopupControl* 扩展器的实际效果\n\n其他属性包括 *OffsetX* 和 *OffsetY*，用于指示弹出窗口从其位置偏移的像素数，以及\
    \ *CommitProperty* 和 *CommitScript*，可用于向目标控件赋值。\n\n弹出窗口通常包含一些交互控件并会触发回发。因此，你可能需要将其放置在\
    \ *UpdatePanel* 控件中，以便在不刷新整个页面的情况下执行服务器端任务。通常情况下，弹出窗口会在回发后关闭——例如，图 5-14 中显示的弹出窗口配置为在用户选择日期后关闭。此场景中的日历在服务器端触发\
    \ *SelectionChanged* 事件：\n\n```\nprotected void Calendar1_SelectionChanged(object\
    \ sender, EventArgs e)\n{\n    PopupExtender1.Commit(\n        Calendar1.SelectedDate.ToShortDateString());\n\
    }\n```\n\n*Commit* 方法将关联控件的默认属性设置为指定值。如果你想控制弹出窗口关闭时在目标控件上设置哪个（非默认）属性，请使用 *CommitProperty*\
    \ 属性。同样，你可以使用 *CommitScript* 属性指定在设置弹出窗口结果后在客户端执行的 JavaScript 函数。\n\n> 警告 请注意，扩展器不能放置在与其扩展的控件不同的\
    \ *UpdatePanel* 中。如果被扩展的控件包含在 *UpdatePanel* 中，扩展器也应放置在该可更新面板中。否则将引发运行时异常。\n\n\
    ## 用户界面扩展器\n\n在 ASP.NET AJAX 扩展器家族中，最大的一组是用户界面扩展器——即用于帮助实现丰富且用户友好功能的特殊组件。\n\n\
    ### *AlwaysVisibleControl* 扩展器\n\n*AlwaysVisibleControl* 扩展器允许你将给定的控件或控件面板固定在页面的某个角落，使其在页面滚动或调整大小时始终浮动显示在背景之上。该扩展器几乎可以与任何\
    \ ASP.NET 控件配合使用。\n\n```\n<span style=\"background-color:yellow;\" runat=\"server\"\
    \ id=\"Msg\">\n   Need a bit of dummy text? Look at\n   <b>http://www.loremipsum.net</b></span>\n\
    \n<act:AlwaysVisibleControlExtender ID=\"av1\" runat=\"server\"\n   TargetControlID=\"\
    Msg\"\n   HorizontalSide=\"Left\"\n   VerticalSide=\"Top\" />\n```\n\n你使用 *HorizontalSide*\
    \ 和 *VerticalSide* 属性设置绑定控件的目标位置，以定义内容应停靠在页面的哪个角落。*HorizontalSide* 属性接受 *Left*\
    \ 和 *Right* 作为值，而 *VerticalSide* 属性的可选值为 *Top* 和 *Bottom*。你还可以通过 *VerticalOffset*\
    \ 和 *HorizontalOffset* 属性控制与各边框的偏移距离。最后，*ScrollEffectDuration* 指示目标控件重新定位时滚动效果持续的秒数。（参见图\
    \ 5-15。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_89_0.png)\n\n**图 5-15** *AlwaysVisible*\
    \ 扩展器的实际效果\n\n请注意，你不能将扩展器添加到普通的 HTML 元素上。如果你有一个需要始终保持可见的 HTML 块（例如前面示例中的 `<span>`\
    \ 标签），请添加 runat=server 属性并为其指定一个唯一的 ID。\n\n## CascadingDropDown 扩展器\n\nCascadingDropDown\
    \ 扩展器可以附加到 DropDownList 控件上，根据一个或多个父 DropDownList 控件的当前选择自动填充其内容。\n\nCascadingDropDown\
    \ 扩展器适用于一个较为常见的场景，即一个下拉列表的内容取决于另一个列表的选择。通过这种方式，你无需将整个数据集传输到客户端，子列表可以按照父列表的选择从数据集中选取子集来显示。例如，假设你希望用户先选择一个国家，再选择该国家中的城市。为了减少数据传输量并提供更友好的用户界面，你可能希望在用户选择国家之前保持城市列表为空。当用户选定一个国家后，再回到服务器下载该国家可用的城市列表。CascadingDropDown\
    \ 扩展器通过向客户端页面注入一些胶水代码，并对页面代码的结构做出一些假设，从而简化了这一场景。\n\n所有关于 DropDownList 控件集内容的逻辑都应驻留在一个\
    \ Web 服务中。该 Web 服务可以使用任何合适的方法来存储和查找相关数据。不过，Web 服务在某种程度上必须使用约定的模式。具体来说，它需要包含一个具有以下签名的方法：\n\
    \n```\n[WebMethod]\npublic CascadingDropDownNameValue[] GetDropDownContents(\n\
    \    string knownCategoryValues, string category)\n{\n    ...\n}\n```\n\n方法的名称当然可以有所不同。CascadingDropDownNameValue\
    \ 类型是一个内部集合类型，用于存放要在下拉列表中显示的名称/值项。附加到该扩展器的每个下拉列表都属于一个类别：\n\n```\n<act:CascadingDropDown\
    \ ID=\"CascadingDropDown1\" runat=\"server\"\n    TargetControlID=\"DropDownList1\"\
    \n    Category=\"Country\"\n    PromptText=\"Please select a country\"\n    ServiceMethod=\"\
    GetDropDownContentsPageMethod\" />\n<act:CascadingDropDown ID=\"CascadingDropDown2\"\
    \ runat=\"server\"\n    TargetControlID=\"DropDownList2\"\n    Category=\"City\"\
    \n    PromptText=\"Please select a city\"\n    LoadingText=\"Please, wait ...\"\
    \n    ServicePath=\"CityFinderService.asmx\"\n```\n"
