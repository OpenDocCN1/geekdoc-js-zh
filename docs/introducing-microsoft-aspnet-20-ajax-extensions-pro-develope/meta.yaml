    100\"\n    TargetControlID=\"TextBox1\" />\n```\n\nYou should set the Width property\
    \ on both the text box and the extender to control the size of the input field.\
    \ Note that the Width property on the extender indicates the total width of the\
    \ control including the arrow buttons. (See Figure 5-24.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_103_0.png)\n\
    \nThe default increment is a numeric +1 or -1. However, the RefValues property\
    \ lets you define a sequence of values to cycle through. The property accepts\
    \ a string where each value is separated by a semicolon (;) symbol."
