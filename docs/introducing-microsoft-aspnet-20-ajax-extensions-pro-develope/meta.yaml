    \ 的调用替换它们。\n\n一旦回到服务器端，管理器组件接管操作，并确定当前页面与处理当前请求后生成的页面之间的差异。描述显示页面更改的标记被发送回去，并通过先前发出的脚本用于动态修改客户端上的页面内容。页面的服务器生命周期照常执行，事件如\
