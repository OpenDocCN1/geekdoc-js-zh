    Note that you can use any HTML element to trigger the dynamic population of the\
    \ target control. It doesn't have to be a button control; and it doesn't have\
    \ to be a submit button such as LinkButton or Button. In this case, in fact, the\
    \ page will post back and you'll lose the benefit of the ASP.NET AJAX platform.\n\
    \n> **Note** You can also use a piece of JavaScript code to dynamically populate\
    \ a given DOM element. In this case, you set the CustomScript property to the\
    \ name of a JavaScript global function. Whether you use a custom script or a server\
    \ method, you can use the ContextKey property of the extender to pass an arbitrary\
    \ string to the code.\n\n# The PagingBulletedList Extender\n\nImagine a page that\
    \ has to present a long list of items to users—say, a list of customers. A common\
    \ solution entails using a pageable grid control. ASP.NET grids do a postback\
    \ for each new page, but by wrapping the grid in an UpdatePanel control you can\
    \ brilliantly fix the issue. What if you figure that a grid is far too heavy a\
    \ control and that you need to list items using a bullet-list control?\n\nThe\
    \ ASP.NET BulletedList control lists the contents of a data source using a variety\
    \ of bullet-point user interfaces. It doesn't provide paging, though. The PagingBulletedList\
    \ extender is a surprisingly simple and effective extender to page through the\
    \ contents of a BulletedList control. Let's consider the following code that populates\
    \ a bulleted list with no paging:\n\n```\n<asp:BulletedList ID=\"BulletedList1\"\
    \ runat=\"server\" DisplayMode=\"Text\"\n                  DataSourceID=\"ObjectDataSource1\"\
    \ DataTextField=\"CompanyName\" />\n\n<asp:ObjectDataSource ID=\"ObjectDataSource1\"\
    \ runat=\"server\"\n                     TypeName=\"IntroAjax.CustomerManager\"\
    \n                     SelectMethod=\"LoadAll\">\n</asp:ObjectDataSource>\n```\n\
    \nSuch a page will generate more than 80 bullet-point items—one for each customer\
    \ in the Northwind database. By extending the BulletedList control with the extender,\
    \ you get output like that shown in Figure 5-18."
