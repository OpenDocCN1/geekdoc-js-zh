  - '[PAGE 30]


    Displaying results correctly on most browsers can be tricky. Internet Explorer,
    in fact, supports a number of nonstandard shortcuts in the DOM that just don''t
    work with other browsers. The most common snag is retrieving references to HTML
    elements using the *document.getElementById* method instead of the direct name
    of the element. For example, the following code works on Internet Explorer but
    not on Firefox and other Mozilla-equipped browsers:


    ```

    // Msg is the ID of a <span> tag.

    // This code works only with Internet Explorer

    Msg.innerHTML = xml.requestText;

    ```


    In summary, cross-browser JavaScript code is required to update the currently
    displayed page on the client. At the same time, a number of assumptions must be
    made on the server to come up with a working and effective environment. For this
    reason, frameworks are the only reasonable way of implementing AJAX functionalities.
    Different frameworks, though, might provide a different programming interface
    on top of an engine that uses the same common set of parts.


    # The Switch to the Document Object Model


    Microsoft has pioneered updatable Web pages since the late 1990s. With Internet
    Explorer 4.0 (released back in 1997), Microsoft introduced Dynamic HTML (DHTML),
    which is a powerful combination of HTML, style sheets, and scripts that allows
    programmatic changes to any displayed page. Several companies since then have
    worked out their own DHTML object model—often referred to as the Browser Object
    Model (BOM). The W3C committee worked hard to bring vendors to agree on an interoperable
    and language-neutral solution for exposing Web pages through an updatable programming
    interface. The result is the Document Object Model (DOM), as opposed to a browser-specific
    BOM.


    The DOM is a platform-independent and language-neutral representation of the contents
    of a Web page that scripts can access and use to modify the content, structure,
    and style of the document.


    For AJAX, it''s all about exchanging data with a remote server. But once the data
    is downloaded out-of-band on the client, what can you do with that? The DOM provides
    an outlet for the data to flow into the current page structure and update it.


    # Representation of a Document


    The DOM is a standard API exposed by the browser in which a displayed page has
    a tree-based structure. Each node in the logical tree corresponds to an object.
    On the other hand, the name "Document Object Model" hints at an object model in
    the common interpretation of the object-oriented design terminology. A Web page—the
    document—is modeled through objects. The model includes the structure and behavior
    of a document. Each node in the logical tree is not static data; rather, it is
    a live object with a known behavior and its own identity.'
  - '[PAGE 31]


    # DOM Implementation


    The W3C DOM consists of three levels that indicate, for the browser, three different
    levels of adherence to the standard. For more information, take a look at http://www.w3.org/DOM.


    The DOM is made of nodes, and each node is an object. For a Web page, each node
    maps to an object that represents an HTML tag. The object, therefore, has properties
    and methods that can be applied to an HTML tag. There are three fundamental operations
    you can accomplish on a node: find the node (including related nodes such as children,
    parent, or sibling nodes), create a node, and manipulate a node.


    Identifying a particular node is easy as long as the page author knows the ID
    of the corresponding element. In this case, you use the following standard piece
    of code:


    ```

    var node = document.getElementById(id);

    ```


    In particular, if there are multiple elements sharing the same ID value, the method
    returns the first object in the collection. This method is supported in the DOM
    Level 1 and upper levels. Another interesting method to find elements is the following:


    ```

    var coll = document.getElementsByTagName(tagname);

    ```


    The method retrieves a collection of all objects based on the same HTML tag. For
    example, the method retrieves a collection of all <div> or all <input> tags in
    the page.


    Related DOM objects are grouped in node lists. Each node has a name, type, parent,
    and collection of children. A node also holds a reference to its siblings and
    attributes. The following code snippet shows how to retrieve the parent of a node
    and its previous sibling:


    ```

    var oParent = oNode.parentNode

    var oPrevious = oNode.previousSibling

    ```


    How can you modify the contents of a node? The easiest and most common approach
    entails that you use the innerHTML property:


    ```

    var node = document.getElementById("button1");

    node.innerHTML = "Hey click me";

    ```


    The innerHTML property is supported by virtually all browsers, and it sets or
    retrieves the HTML between the start and end tags of the given object. Some browsers
    such as Internet Explorer also support the innerText property. This property is
    designed to set or retrieve the text inside of a given DOM object. Unfortunately,
    this property is not supported by all browsers. It exists in Internet Explorer
    and Safari but, for example, it is not supported by Firefox. Firefox, on the other
    hand, supports a property with a similar behavior but a different name—textContent.'
- md: " The advent of the Microsoft AJAX Client Library (discussed in Chapter 2, \"\
    The Microsoft Client Library for AJAX\") shields developers from having to know\
    \ much about the little differences between the DOM implementation of the various\
    \ browsers. For example, you should know about innerText and textContent if you're\
    \ embedding your own JavaScript in the page; however, you don't have to if you\
    \ rely on the AJAX Client Library to refresh portions of the displayed page.\n\
    \nFinally, note that you should not check the user agent string to figure out\
    \ whether the current browser supports a given feature. You should check the desired\
    \ object instead. For example, to know whether the browser supports innerText,\
    \ you're better off running the following code:\n\n```\nvar supportsInnerText\
    \ = false;\nvar temp = document.body.innerText;\nif (temp != undefined)\n    supportsInnerText\
    \ = true;\n...\n```\n\nIn this way, you directly check the availability of the\
    \ property without having to maintain a list of browsers.\n\nNodes are created\
    \ using the createElement method exposed only to the document object. Alternatively,\
    \ you can add new elements to the document hierarchy by modifying the innerHTML\
    \ property value, or by using methods explicit to particular elements, such as\
    \ the insertRow and insertCell methods for the table element. Here's an example:\n\
    \n```\n// Create an <IMG> element\nvar oImg = document.createElement(\"img\");\n\
    ...\n// Create a new option for the SELECT element\nvar oOption = new Option(text,\
    \ id);\ncontrol.options.add(oOption);\n```\n\nWith this information, I have only\
    \ scratched the surface of the DOM implementation in the various browsers. Nonetheless,\
    \ the DOM is a key part of the AJAX jigsaw puzzle and deserves a lot of attention\
    \ and skilled use. For a primer, you can take a look at http://msdn.microsoft.com/workshop/author/dom/domoverview.asp.\n\
    \n## Be Pragmatic: DHTML vs. DOM\n\nIn the beginning, only the browser's support\
    \ for the DHTML object model provided JavaScript developers with the ability to\
    \ update the page contents dynamically. The success of DHTML led to the definition\
    \ of a standard document object model—the W3C's DOM. Quite obviously, the DOM\
    \ evolved from DHTML and became much more generalized than DHTML. As mentioned,\
    \ the DOM provides a tree-based model for the whole document, not just for an\
    \ individual HTML tag.\n\nMost browsers, though, support a mix of DOM and DHTML.\
    \ Which one should you use? In particular, to update some contents, should you\
    \ obtain a reference to the textual child node of the node that matches the intended\
    \ HTML tag (the DOM way) or just grab a reference to a node and use `innerHTML`\
    \ (the DHTML way)? Likewise, to add a new element, should you create a new element\
    \ or just stuff in a chunk of updated HTML via `innerHTML`? Admittedly, one of\
    \ the most interesting debates in the community is whether to use DHTML to manipulate\
    \ pages or opt for the cleaner approach propounded by the DOM application programming\
    \ interface (API).\n\nThe key fact is that the DOM API is significantly slower\
    \ than using `innerHTML`. If you go through the DOM to generate some user interface\
    \ dynamically, you have to create every element, append each into the proper container,\
    \ and then set properties. The alternative only entails that you define the HTML\
    \ you want and render it into the page using `innerHTML`. The browser, then, does\
    \ the rest by rendering your markup into direct graphics.\n\nOverall, DHTML and\
    \ DOM manipulation are both useful depending on the context. There are many Web\
    \ sites that discuss performance tests and DHTML is always the winner. Anyway,\
    \ DOM is still perfectly fast as long as you use it the right way—that is, create\
    \ HTML fragments and append them to the proper container only as the final step.\n\
    \n## Be Pragmatic: Use Events\n\nLet's make it clear: without events, there would\
    \ be no point in adding JavaScript to Web pages. To be effective, therefore, scripts\
    \ have to react to some user action as well as to actions generated by the browser,\
    \ such as when loading the page. Events and event handlers are old companions\
    \ to Web pages, as they appeared the first time with Netscape 2.\n\nFor quite\
    \ some time, largely incompatible event models lived and thrived in different\
    \ browsers—mainly in Internet Explorer and Netscape. A few years ago, the W3C\
    \ standardized the event model with a paper that you can AJAX read at <http://www.w3.org/TR/2000/REC-DOM-Level-2-Events-20001113/events.html>.\n\
    \nWith Internet Explorer and Netscape having their own original event model, and\
    \ making themselves compatible to the W3C standard, you understand that writing\
    \ model-agnostic event handlers is going to be a hard task. There are a lot of\
    \ events, but not all of them are supported by all browsers. The following categories\
    \ of events can be considered standard: user interface events (blur, focus, scroll),\
    \ device events (click, keydown), and form events (submit, select). The second\
    \ big point concerns how you set event handlers. The most reliable way is still\
    \ the following:\n\n```\n<a href=\"page.aspx\" onclick=\"doClick()\" />\n```\n\
    \nAn excellent paper that discusses the theme of events in JavaScript can be found\
    \ here: <http://www.quirksmode.org/js/introevents.html>.\n\n> **Tip** If you're\
    \ looking for a great Web site to learn about the various aspects of JavaScript,\
    \ DHTML, DOM, CSS and client-side programming in general, the right place to go\
    \ is http://www.quirksmode.org.\n\n## Existing AJAX Frameworks for ASP.NET\n\n\
    Today, quite a few APIs exist to implement AJAX functionality in ASP.NET, and\
    \ one of these APIs is already integrated into ASP.NET 2.0. Other APIs come from\
    \ third-party vendors or take form from open-source projects. I'll briefly look\
    \ at some of these APIs. Note, though, that as long as ASP.NET is your development\
    \ environment, the most reasonable choice you can make is Microsoft ASP.NET AJAX\
    \ Extensions. However, ASP.NET AJAX Extensions can coexist pretty well with a\
    \ large number of the existing alternative AJAX frameworks. ASP.NET AJAX is not\
    \ a mutually exclusive choice.\n\nSince early 2005, some aggressive independent\
    \ software vendors (for example, Telerik, Infragistics, and ComponentArt) have\
    \ integrated AJAX functionality into their existing suite of controls for rapid\
    \ and rich Web development. In the beginning, each vendor developed its own internal\
    \ and proprietary AJAX engine and integrated it with the product. The advent of\
    \ ASP.NET AJAX Extensions will likely prompt vendors to offer native ASP.NET AJAX\
    \ controls or, at a minimum, provide controls that work seamlessly with ASP.NET\
    \ AJAX.\n\nLet's review some of the options you have today for developing AJAX-enabled\
    \ ASP.NET Web applications. As you can see, the Kaplan list is not exhaustive\
    \ and features libraries from both independent software vendor (ISV) companies\
    \ and open-source projects started by outstanding members of the ASP.NET community.\n\
    \n## ASP.NET Script Callbacks\n\nASP.NET 2.0 contains a native API, named ASP.NET\
    \ Script Callback, to implement out-of-band calls to the same URL of the current\
    \ page. This API makes the out-of-band request look like a special-case page request.\
    \ It transmits the view state along with original input fields. A few additional\
    \ input fields are inserted in the body of the request to carry extra information.\
    \ Once on the server, the request passes through the regular pipeline of HTTP\
    \ modules and raises the expected sequence of server-side events up to the pre-rendering\
    \ stage.\n\nJust before the pre-rendering stage, the page method is executed,\
    \ the return value is serialized to a string, and then the string is returned\
    \ to the client. No rendering phase ever occurs, and the view state is not updated\
    \ and serialized back.\n\nASP.NET Script Callback provides its own JavaScript\
    \ API to wrap any needed calls to *XMLHttpRequest*. As a developer, you are not\
    \ required to know about this API in detail. As a developer, you should instead\
    \ focus on the programming interface of the *GetCallbackEventReference* method\
    \ of the *Page.ClientScript* object. This method simply returns the JavaScript\
    \ code to attach to a client-side event handler to place an out-of-band call.\
    \ The JavaScript code"
  mdcn: "\nMicrosoft AJAX客户端库（在第2章“用于AJAX的Microsoft客户端库”中讨论）的出现，使开发者无需了解不同浏览器DOM实现之间的诸多细微差别。例如，若在页面中嵌入自己的JavaScript代码，应了解`innerText`和`textContent`属性；但如果依赖AJAX客户端库刷新页面的部分内容，则无需关注这些。\n\
    \n最后请注意，不应通过检查用户代理字符串来判断当前浏览器是否支持特定功能，而应直接检测所需对象。例如，要判断浏览器是否支持`innerText`，最好运行以下代码：\n\
    \n```\nvar supportsInnerText = false;\nvar temp = document.body.innerText;\nif\
    \ (temp != undefined)\n    supportsInnerText = true;\n...\n```\n\n这种方式能直接检测属性的可用性，无需维护浏览器清单。\n\
    \n节点可通过仅暴露给document对象的`createElement`方法创建。也可通过修改`innerHTML`属性值，或使用特定元素（如表格元素的`insertRow`和`insertCell`方法）来向文档层级添加新元素。示例如下：\n\
    \n```\n// 创建<IMG>元素\nvar oImg = document.createElement(\"img\");\n...\n// 为SELECT元素创建新选项\n\
    var oOption = new Option(text, id);\ncontrol.options.add(oOption);\n```\n\n以上内容仅浅析了不同浏览器中的DOM实现。尽管如此，DOM作为AJAX拼图的关键部分，仍值得深入关注与熟练运用。如需入门，可参阅\
    \ http://msdn.microsoft.com/workshop/author/dom/domoverview.asp。\n\n## 务实之道：DHTML与DOM之辩\n\
    \n早期，仅浏览器对DHTML对象模型的支持赋予了JavaScript开发者动态更新页面内容的能力。DHTML的成功促成了标准文档对象模型（W3C DOM）的定义。显然，DOM脱胎于DHTML，却比DHTML更具普适性。如前所述，DOM为整个文档（而非单个HTML标签）提供了基于树状结构的模型。\n\
    \n然而，多数浏览器同时支持DOM与DHTML的混合模式。开发者应如何选择？具体而言，更新内容时，应获取匹配目标HTML标签节点的文本子节点引用（DOM方式），还是直接引用节点并使用`innerHTML`（DHTML方式）？同理，添加新元素时，应创建新元素，还是通过`innerHTML`插入一段更新的HTML？诚然，社区中持续热议的话题之一，便是选择DHTML操控页面，还是采用DOM应用编程接口（API）倡导的更规范方式。\n\
    \n关键事实是：DOM API的性能显著慢于使用`innerHTML`。若通过DOM动态生成用户界面，需逐一创建元素、追加至合适容器并设置属性。而替代方案只需定义所需HTML，再通过`innerHTML`渲染到页面，浏览器将自动完成后续渲染。\n\
    \n总体而言，DHTML与DOM操作各具适用场景。众多网站的性能测试表明DHTML通常胜出。但DOM在正确使用时（即创建HTML片段并仅在最后一步追加至容器）依然性能可靠。\n\
    \n## 务实之道：善用事件机制\n\n明确一点：若无事件机制，向网页添加JavaScript将失去意义。因此，脚本必须响应用户操作及浏览器生成的动作（如页面加载）。事件与事件处理程序作为网页的经典组件，早在Netscape\
    \ 2时期便已出现。\n\n长期以来，兼容性欠佳的事件模型在不同浏览器（主要为Internet Explorer和Netscape）中并存发展。数年前，W3C通过《DOM\
    \ Level 2 Events》标准化了事件模型，详情可查阅 <http://www.w3.org/TR/2000/REC-DOM-Level-2-Events-20001113/events.html>。\n\
    \n鉴于Internet Explorer与Netscape保留了各自的原始事件模型，同时努力兼容W3C标准，编写兼容多种模型的事件处理程序颇具挑战。事件类型众多，但浏览器支持程度各异。以下事件类别可视为标准：用户界面事件（blur、focus、scroll）、设备事件（click、keydown）和表单事件（submit、select）。第二大关键在于事件处理程序的绑定方式，目前最可靠的方法仍是：\n\
    \n```\n<a href=\"page.aspx\" onclick=\"doClick()\" />\n```\n\n关于JavaScript事件机制的深入探讨，可参考：\
    \ <http://www.quirksmode.org/js/introevents.html>。\n\n> **提示** 若想系统学习JavaScript、DHTML、DOM、CSS及客户端编程等知识，推荐访问\
    \ http://www.quirksmode.org。\n\n## 面向ASP.NET的现有AJAX框架\n\n目前已有多种API可在ASP.NET中实现AJAX功能，其中一种已集成于ASP.NET\
    \ 2.0。其他API则来自第三方厂商或开源项目。以下将简要介绍部分API。需注意的是，只要使用ASP.NET作为开发环境，Microsoft ASP.NET\
    \ AJAX扩展组件是最合理的选择。但该扩展组件能与众多现有AJAX框架良好共存——ASP.NET AJAX并非排他性选择。\n\n自2005年初起，部分进取的独立软件开发商（如Telerik、Infragistics和ComponentArt）已将AJAX功能整合到其控件套件中，以支持快速富Web开发。初期，各厂商开发了私有的AJAX引擎并与产品集成。ASP.NET\
    \ AJAX扩展组件的推出，或将促使厂商提供原生ASP.NET AJAX控件，或至少开发能与ASP.NET AJAX无缝协作的控件。\n\n现梳理当前可用于开发支持AJAX的ASP.NET\
    \ Web应用的方案。如您所见，以下列表虽非详尽，但涵盖了独立软件供应商（ISV）的库及ASP.NET社区杰出成员发起的开源项目。\n\n## ASP.NET脚本回调\n\
    \nASP.NET 2.0内置了名为ASP.NET Script Callback的原生API，用于实现向当前页面相同URL的带外调用。该API使带外请求呈现为特殊页面请求，随原始输入字段传输视图状态，并在请求体中插入额外输入字段以携带附加信息。服务器收到请求后，将经过常规HTTP模块管道，触发直至预渲染阶段的预期服务端事件序列。\n\
    \n在预渲染阶段之前，页面方法被执行，返回值被序列化为字符串并返回客户端。整个过程不会发生渲染阶段，视图状态也不会被更新和回传序列化。\n\nASP.NET\
    \ Script Callback提供专用JavaScript API以封装对*XMLHttpRequest*的所有调用。开发者无需深入掌握该API细节，而应聚焦于*Page.ClientScript*对象的*GetCallbackEventReference*方法接口。该方法返回用于绑定客户端事件处理程序以发起带外调用的JavaScript代码：\n"
