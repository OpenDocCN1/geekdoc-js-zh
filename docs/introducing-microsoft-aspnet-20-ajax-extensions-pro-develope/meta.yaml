- md: "## The *ResizableControl* Extender\n\nlower-right corner of the element, the\
    \ handle lets the user resize the element as if it were a window. Let's consider\
    \ the following markup:\n\n```xml\n<asp:Panel ID=\"Panel1\" runat=\"server\" Style=\"\
    overflow:hidden\"\n          Width=\"130px\" Height=\"65px\">\n    <asp:Image\
    \ ID=\"Image1\" runat=\"server\" ImageUrl=\"~/images/ajax.gif\"\n            \
    \ Style=\"width:100%; height:100%;\" />\n</asp:Panel>\n\n<asp:Panel ID=\"Panel2\"\
    \ runat=\"server\" Style=\"overflow:auto\"\n          Width=\"130px\" height=\"\
    100px\">\n    This text resizes itself to be as large as possible\n    within\
    \ its container.\n</asp:Panel>\n```\n\nAs you can see, the first panel contains\
    \ an image; the second includes plain text. Some CSS attributes are necessary\
    \ for the extender to work properly. In particular, you might want to set the\
    \ overflow attribute to *hidden* for images and to *auto* for text. The *overflow*\
    \ attribute controls the appearance of scrollbars when the contents of the element\
    \ exceeds the reserved space. In the example, I stretch or shrink the image and\
    \ scroll the text.\n\nIt is important to give panels an initial correct size.\
    \ In particular, for images you should give the surrounding panel the same size\
    \ of the image. Panels surrounding a block of text should be given an explicit\
    \ size too.\n\n```xml\n<act:ResizableControlExtender ID=\"Resizable1\" runat=\"\
    server\"\n    TargetControlID=\"Panel1\"\n    ResizableCssClass=\"resizingStyle\"\
    \n    HandleCssClass=\"handleStyle\" />\n<act:ResizableControlExtender ID=\"Resizable2\"\
    \ runat=\"server\"\n    TargetControlID=\"Panel2\"\n    ResizableCssClass=\"resizingStyle\"\
    \n    HandleCssClass=\"handleStyle\" />\n```\n\nThe *ResizableControl* extender\
    \ features two mandatory properties: *TargetControlID* and *HandleCssClass*. The\
    \ former indicates the control to resize; the latter sets the name of the CSS\
    \ class to apply to the resize handle. In addition, *ResizableCssClass* is the\
    \ CSS class to apply to the element when resizing. You might want to use this\
    \ class to change or thicken the color of the border to emphasize the operation.\
    \ Here's a typical handle CSS class:\n\n```css\n.handleStyle\n{\n    width:16px;\n\
    \    height:16px;\n    background-image:url(~/images/HandleGrip.gif);\n    overflow:hidden;\n\
    \    cursor:se-resize;\n}\n```\n\nFigure 5-19 shows the extender in action.\n\n\
    ![](img/db82dc55683fa403b8b16b76eb00cc2e_96_0.png)\n\n**Figure 5-19** The *ResizableControl*\
    \ extender in action\n\nThe *ResizableControl* extender also features two client\
    \ events (*onresizing* and *onresize*) that can trigger some JavaScript code to\
    \ do more complex things, such as increasing the font size to fit a larger area.\
    \ The extender allows you to define a minimum and maximum size for the elements\
    \ being resized. Any changes resulting from control resizing are automatically\
    \ persisted across postbacks.\n\n## The *RoundedCorners* Extender\n\nThe *RoundedCorners*\
    \ extender is a subset of the *DropShadow* extender, as it is limited to rounding\
    \ the corners of child panels:\n\n```xml\n<asp:Panel runat=\"server\" ID=\"Panel1\"\
    \ BackColor=\"LightBlue\" Width=\"170px\">\n    <div style=\"margin-left:2px\"\
    >\n        <asp:TextBox ID=\"TextBox1\" runat=\"server\"\n                   \
    \  BackColor=\"LightBlue\"\n                     BorderWidth=\"0px\" />\n    </div>\n\
    </asp:Panel>\n\n<act:RoundedCornersExtender ID=\"RoundedCornerExtender1\" runat=\"\
    server\"\n    TargetControlID=\"Panel1\" Radius=\"6\" Color=\"LightBlue\" />\n\
    ```\n\nThe extender accepts arguments to set the target control and define the\
    \ desired radius of the rounded corner and the color of the surrounding border.\
    \ The rounded corner, in fact, is obtained by rendering an additional border all\
    \ around the target control. By removing all borders around the text box and using\
    \ the same background color for the panel and the text box, you can obtain the\
    \ nice effect shown in Figure 5-20—a rounded text box control.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_97_0.png)\n\
    \n**Figure 5-20** The *RoundedCorners* extender in action\n\n## Input Extenders\n\
    \nWeb pages still rely on the facilities built into the HTML markup language to\
    \ let users enter data into forms and input fields. But HTML input elements are\
    \ sometimes too limited and simple for today's applications and users. For this\
    \ reason, the plain old <input type=\"text\"> element, and its TextBox ASP.NET\
    \ counterpart, need some extra features. The ACT supplies a couple of extenders\
    \ that transform the classic input field into a more interactive and user-friendly\
    \ text box.\n\n### The **AutoComplete** Extender\n\nTyping data into a text box\
    \ might be boring at times, and even more so when you type the same chunk of text\
    \ over and over again. For this reason, Web browsers began supporting auto-completion\
    \ features a while ago. A Web browser's auto-completion feature consists of the\
    \ code's ability to track any URL that the user ever types in. In this way, the\
    \ browser can quickly prompt you with a suggestion when you're typing a possibly\
    \ long and hard-to-remember URL.\n\nAuto-completion is also a feature that some\
    \ browsers, such as Internet Explorer 5 and newer versions, support for any custom\
    \ text box you use in HTML forms. The browser saves on the local machine any data\
    \ ever typed into an input field with a given name, and it makes that information\
    \ available to all pages in the site that feature an HTML element with the same\
    \ name. The feature is integrated with the browser and is transparent to users\
    \ and developers. The list of suggestions builds up incrementally and is entirely\
    \ beyond the control of page authors.\n\nThe *AutoComplete* extender extends the\
    \ auto-completion to any ASP.NET TextBox control; more importantly, it gives page\
    \ authors the means to define programmatically the list of suggestions (as retrieved\
    \ via a Web Service).\n\n## Part II Adding AJAX Capabilities to a Site\n\n```xml\n\
    <asp:TextBox ID=\"CustomerName\" runat=\"server\" />\n```\n\n```xml\n<act:AutoCompleteExtender\
    \ runat=\"server\" ID=\"AutoCompleteExtender1\"\n    TargetControlID=\"CustomerName\"\
    \n    Enabled=\"true\"\n    MinimumPrefixLength=\"1\"\n    ServicePath=\"Suggestions.asmx\"\
    \n    ServiceMethod=\"GetSuggestions\" />\n```\n\nIn the code snippet, the text\
    \ box is auto-completed using the data returned by the GetSuggestions method of\
    \ the specified Web service. The ServicePath and ServiceMethod extender properties\
    \ identify the service to provide auto-completion data; the MinimumPrefixLength\
    \ property sets how many characters the user has to type to trigger the auto-completion\
    \ feature. In the preceding code, auto-completion begins with the first typed\
    \ character.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_98_0.png)\n\n> **Note**\
    \ The Web service has to be a local Web service that is installed on the same\
    \ server machine and application as the page that is using it. Note that this\
    \ consideration holds true for all Web services used by ASP.NET AJAX extenders.\n\
    \nThe Web service method you use to provide suggestions must have a known signature:\n\
    \n```csharp\n[WebMethod]\npublic string[] GetSuggestions(string prefixText, int\
    \ count)\n{\n    ...\n}\n```\n\nThe prefixText argument indicates the text the\
    \ user has typed so far; the count argument sets the desired number of suggestions.\
    \ The result is displayed in a drop-down panel underneath the text box. The user\
    \ can use either the mouse or the keyboard to select one of the suggested items.\
    \ The following code shows a Web service method that returns a subset of customer\
    \ names that match the provided prefix. (See Figure 5-21.)\n\n```csharp\npublic\
    \ class SuggestionService : System.Web.Services.WebService\n{\n    [WebMethod]\n\
    \    public string[] GetSuggestions(string prefixText, int count)\n    {\n   \
    \     int i=0;\n        DataView data = GetData();\n        data = FilterData(data,\
    \ prefixText);\n        string [] suggestions = new string[data.Count];\n\n  \
    \      foreach (DataRowView row in data)\n            suggestions[i++] = row[\"\
    companyname\"].ToString();\n\n        return suggestions;\n    }\n\n    private\
    \ DataView GetData()\n    {\n        DataView view = (DataView)HttpContext.Current.Cache[\"\
    Suggestions\"];\n        if (view == null)\n        {\n            SqlDataAdapter\
    \ adapter = new SqlDataAdapter(\n                \"SELECT * FROM customers\",\
    \ \"...\");\n            DataTable table = new DataTable();\n            adapter.Fill(table);\n\
    \            view = table.DefaultView;\n\n            // Store the entire data\
    \ set to the ASP.NET Cache for\n            // further reuse\n            HttpContext.Current.Cache[\"\
    Suggestions\"] = view;\n        }\n\n        return view;\n    }\n\n    private\
    \ DataView FilterData(DataView view, string prefix)\n    {\n        // Filter\
    \ out undesired strings\n        view.RowFilter = String.Format(\"companyname\
    \ LIKE '{0}%'\", prefix);\n        return view;\n    }\n}\n```\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_99_0.png)\n\
    \n**Figure 5-21** The *AutoComplete* extender in action\n\n### The *Calendar Extender*\n\
    \nPlenty of input forms require users to specify a date. As an ASP.NET developer,\
