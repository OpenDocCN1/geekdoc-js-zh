    \ choose the type of visual feedback. It can be *Text* or *BarIndicator*. When\
    \ the indicator type is *Text*, the *PrefixText* property sets"
  mdcn: "\n## 第二部分 为网站添加 AJAX 功能\n\nASP.NET 2.0 的 *日历* 控件需要完整的页面回发，尽管你可以找到许多好的变通方法——从将其包装在可更新面板中，到使用我们之前讨论过的悬停菜单扩展器。\n\
    \n*日历* 扩展器是最终的，我相信也是决定性的解决方案。它附加到一个文本框上，提供具有可自定义日期格式和弹出控件的客户端日期选择功能。你可以通过点击某一天、导航到某个月，或选择特定链接来设置当前日期与日历进行交互。（参见图\
    \ 5-22。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_100_0.png)\n\n**图 5-22**\
    \ *日历* 扩展器运行中\n\n```xml\n<asp:TextBox runat=\"server\" ID=\"TextBox1\" />\n\n\
    <act:CalendarExtender runat=\"server\" ID=\"CalendarExtender1\"\n    TargetControlID=\"\
    TextBox1\"\n    CssClass=\"MyCalendar\"\n    Format=\"dd/MM/yyyy\" />\n```\n\n\
    通过点击日历的标题，你可以将视图从每月显示天数更改为每年显示月份，甚至每十年显示年份。*Format* 属性允许你选择日期的最终格式，该格式将被插入到绑定的文本框中。通常，当日历伴随的文本框获得输入焦点时，日历会弹出。但是，你可以将日历的显示与某个元素（例如，一个图像）的点击关联起来。*PopupButtonID*\
    \ 属性获取和设置一个控件的 ID，以便在点击该控件时显示日历弹出窗口。\n\n## FilteredTextBox 扩展器\n\n*FilteredTextBox*\
    \ 扩展器从给定文本框控件的缓冲区中过滤掉一些字符。它与验证控件的不同之处在于，它只是防止用户输入无效字符，而验证控件则在用户切换出输入字段后的稍后时间点进行操作。\n\
    \n```html\n<strong>How old are you?</strong>\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" />\n```\n\n```xml\n<act:FilteredTextBoxExtender ID=\"Filtered1\" runat=\"\
    server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"Numbers\" />\n```\n\
    \n前面的文本框预期接受一个表示用户年龄的数字。显然，它只能接受数字。该扩展器确保只能在输入字段中键入数字。它通过向文本框添加一段 JavaScript 代码来过滤掉不需要的字符。\n\
    \n该扩展器支持几个属性，包括 FilterType，它决定应用于输入的过滤器。该属性可以接受以下任何值：Numbers、UppercaseLetters、LowercaseLetters\
    \ 和 Custom。前三种情况的过滤效果很明显。然而，当指定 Custom 时，你还需要将 ValidChars 属性设置为一个逗号分隔的字符串，其中每个项目表示一个有效字符。例如，以下代码仅允许用户输入\
    \ A 和 B 字符，无论大小写：\n\n```xml\n<act:FilteredTextBoxExtender ID=\"Filtered1\" runat=\"\
    server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"Custom\"\n    ValidChars=\"\
    A,a,B,b\" />\n```\n\n你不能在同一文本框上组合多个过滤器。如果你想过滤除字母以外的所有字符，你不能向同一个控件添加两个 FilteredTextBox\
    \ 扩展器。相反，你需要使用自定义过滤器，在 ValidChars 属性中指定所有可接受的字符。\n\n> **重要提示** 客户端过滤以及验证都依赖于某些\
    \ JavaScript 代码的执行。这意味着通过停用客户端浏览器上的 JavaScript，任何过滤或验证随后都会被禁用。无论如何，你不应盲目信任用户在文本框中键入的内容，而应在将该数据用于关键操作之前，在服务器上应用适当的过滤和验证。\n\
    \n## MaskedEdit 扩展器\n\n添加到 TextBox 控件的 MaskedEdit 扩展器强制用户根据指定的掩码输入输入内容。此外，数据会根据所选的数据类型在客户端进行验证。为了实现验证，引入了一个新的验证器控件——MaskedEditValidator——用于验证输入。掩码编辑验证器反过来与掩码编辑扩展器的实例相关联：\n\
    \n```xml\n<asp:TextBox runat=\"server\" ID=\"TextBox1\" />\n```\n\n```xml\n<act:MaskedEditValidator\
    \ ID=\"MaskedEditValidator1\" runat=\"server\"\n    ControlExtender=\"MaskedEditExtender1\"\
    \n    ControlToValidate=\"TextBox1\"\n    IsValidEmpty=\"False\"\n    EmptyValueMessage=\"\
    Date is required\"\n    InvalidValueMessage=\"Date is invalid\"\n    TooltipMessage=\"\
    Input a Date\" />\n<act:MaskedEditExtender runat=\"server\" ID=\"MaskedEditExtender1\"\
    \n    TargetControlID=\"TextBox1\"\n    Mask=\"99/99/9999\"\n    MessageValidatorTip=\"\
    true\"\n    OnFocusCssClass=\"MaskedEditFocus\"\n    OnInvalidCssClass=\"MaskedEditError\"\
    \n    MaskType=\"Date\" />\n```\n\n图 5-23 显示了该扩展器在日期和货币值上的应用。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_102_0.png)\n\
    \n该扩展器支持针对最常见和专业类型的三种不同掩码：日期、数字和时间。*MaskType* 属性设置最终数据的类型；*Mask* 属性定义所需的输入掩码。\n\
    \n## *NoBot* 扩展器\n\nWeb 应用程序，如博客、论坛和门户网站，容易受到机器人应用程序（也称为 *bots*）自动填写其输入表单的影响。例如，一个机器人可以注册为邮件服务的用户，并使用该门户发送垃圾邮件。用于确保是人在填写输入表单而不是一段智能软件的技术被称为\
    \ CAPTCHA，即 *完全自动化的公共图灵测试，用于区分计算机和人类* 的首字母缩写。实际上，CAPTCHA 是一种挑战-响应测试，要求提供必须即时理解的额外信息。这对人类来说没什么特别的，但对自动化程序来说几乎不可能。CAPTCHA\
    \ 技术最流行的例子是一个表示数字的扭曲图像。在各种博客系统中，用户会遇到一个额外的输入字段，在他们的帖子被接受之前，需要指定图中描绘的一个数字。\n\n\
    NoBot 扩展器是一个尝试将反机器人技术应用于输入表单的控件。该扩展器可能不如包含数字的扭曲图像强大，但其优势在于完全不可见且难以检测。总而言之，NoBot\
    \ 扩展器的实用性可能仅限于流量较低的网站，其主要目标是阻止垃圾邮件，并且即使未达到 100% 的有效性也无关紧要。\n\n## NumericUpDown\
    \ 扩展器\n\n添加到 TextBox 控件的 NumericUpDown 扩展器会在控件旁边添加一对箭头按钮，让用户能够增加和减少显示的值。请注意，递增和递减既适用于数字输入，也适用于任何用户定义的枚举。\n\
    \n```html\n<strong>How old are you?</strong>\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" Width=\"100px\" />\n\n<act:NumericUpDownExtender ID=\"UpDown1\" runat=\"\
    server\"\n    Width=\"100\"\n    TargetControlID=\"TextBox1\" />\n```\n\n你应该在文本框和扩展器上都设置\
    \ Width 属性以控制输入字段的大小。请注意，扩展器上的 Width 属性表示包括箭头按钮在内的控件总宽度。（参见图 5-24。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_103_0.png)\n\
    \n默认递增量是数字 +1 或 -1。但是，RefValues 属性允许你定义一个要循环遍历的值序列。该属性接受一个字符串，其中每个值用分号 (;) 符号分隔。\n\
    \n```xml\n<act:NumericUpDownExtender ID=\"UpDown1\" runat=\"server\"\n    Width=\"\
    100\"\n    RefValues=\"Sun;Mon;Tue;Wed;Thu;Fri;Sat\"\n    TargetControlID=\"TextBox1\"\
    \ />\n```\n\n该扩展器还可以使用 Web 服务来计算下一个或上一个值。在这种情况下，你使用 *ServiceUpPath* 和 *ServiceUpMethod*\
    \ 来定位用于 *向上* 操作的服务和方法。同样，你使用 *ServiceDownPath* 和 *ServiceDownMethod* 用于 *向下* 操作。服务方法可以通过\
    \ *Tag* 属性从客户端接收任意值。\n\n> **注意** 仅使用上下扩展器通常不足以保证良好的用户体验。事实上，上下扩展器并不强制文本框“只”接受由上下过程生成的值。因此，你可以在带有相关上下扩展器的数字文本框中键入单词。为避免这种情况，你可能希望将上下扩展器与过滤扩展器结合使用，并使用\
    \ *TextBox 的 MaxLength* 属性来设置最大字符数。\n\n## *PasswordStrength* 扩展器\n\n即使是最安全的系统，如果授权用户使用弱且易于猜测的密码，也无法提供太多保护。最近制定了一些最佳实践，用来定义强密码的特征。*PasswordStrength*\
    \ 扩展器附加到一个 *TextBox* 控件上，并在当前文本被用作密码时测量其强度。\n\n从语法角度来看，该扩展器可以附加到任何 *TextBox* 控件；但从语义角度来看，只有当应用于用于输入密码的\
    \ *TextBox* 控件时才有意义。*PasswordStrength* 扩展器证明有用的场景不是用户输入密码以访问特定功能的登录页面。相反，它在用户注册其凭证以访问系统功能的表单中很有帮助。\n\
    \n```html\n<h2>Choose your password</h2>\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" />\n<act:PasswordStrength runat=\"server\" TargetControlID=\"TextBox1\"\
    \ />\n```\n\n该扩展器根据页面作者设置的一组要求验证当前文本。验证过程的结果通过文本消息或条形指示器输出，让用户了解所选密码的复杂程度。在所有默认设置下，该扩展器的工作方式如图\
    \ 5-25 所示。\n\n反馈显示为纯文本，并在用户在缓冲区中键入时动态更新。该扩展器的属性可分为两组：外观和行为。\n\n外观属性包括 *DisplayPosition*\
    \ 用于设置反馈文本的位置（上方、下方、左侧或右侧），以及 *StrengthIndicatorType* 用于选择视觉反馈的类型。它可以是 *Text*\
    \ 或 *BarIndicator*。当指示器类型为 *Text* 时，*PrefixText* 属性设置\n"
