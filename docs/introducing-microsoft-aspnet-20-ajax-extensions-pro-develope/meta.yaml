    \ properties: one for the highlighted state and one for the normal state. However,\
    \ these attributes will be processed and applied on the client. On the client\
    \ browser, though, there's a better way to set the appearance of elements than\
    \ by using individual properties—cascading styles. To assign these styles, the\
    \ extender has two properties—*HighlightCssClass* and *NormalCssClass*:\n\n```\n\
    public class FocusExtender : ExtenderControl\n{\n    private string _highlightCssClass;\n\
    \    private string _normalCssClass;\n\n    public string HighlightCssClass\n\
    \    {\n        get { return _highlightCssClass; }\n        set { _highlightCssClass\
    \ = value; }\n    }\n\n    public string NormalCssClass\n    {\n        get {\
    \ return _normalCssClass; }\n        set { _normalCssClass = value; }\n    }\n\
    \    ...\n}\n```\n\nAs mentioned, an extender class doesn't need a view state\
    \ and implements storage for properties through private fields. This requires\
    \ that an extender be either used declaratively (and not modified programmatically\
    \ during postbacks) or fully configured in the page initialization phase regardless\
    \ of postbacks.\n\n# Defining the Client Behavior\n\nThe *GetScriptDescriptors*\
    \ method instantiates a descriptor class and it uses that class to bind the *IntroAjax.FocusBehavior*\
    \ JavaScript class to the HTML subtree rooted in the client ID of the"
