    \ 库就是这样工作的。\n\n## 显示结果\n\n还缺少一个步骤——当客户端收到带外调用的响应后会发生什么？以下代码片段展示了一段客户端代码，当它绑定到按钮时，会触发带外调用并刷新用户界面：\n\
    \n```\nfunction MoreInfo()\n{\n    var empID = document.getElementById(\"EmployeeList\"\
    ).value;\n    var xml = SendRequest(\"default.aspx\", empID);\n\n    // Update\
