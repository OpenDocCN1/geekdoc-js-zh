- img_proc: true
  md: 'Most ASP.NET developers can easily arrange a rating mechanism that works through
    classic postbacks. The ACT *Rating* control, on the other hand, provides a standard
    rating mechanism that works over callbacks.


    # Generalities of the *Rating* Control


    The output of the control consists of a repeated `<span>` tag that is decorated
    through a set of CSS classes. Each `<span>` tag represents a "star" in the rating
    system and is styled according to the status it represents. Figure 5-5 gives you
    an idea of the *Rating* control.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_67_0.png)


    Figure 5-5 The *Rating* control in action


    # Properties of the Control


    Table 5-3 lists the key properties of the *Rating* control.


    | Property | Description |

    | --- | --- |

    | *AutoPostBack* | Indicates whether the control will post back whenever the user
    rates a given associated content. |

    | *CurrentRating* | Gets and sets the current value rendered by the control. The
    default value is 3. |

    | *EmptyStarCssClass* | Gets and sets the CSS class to render an unselected star.
    |

    | *FilledStarCssClass* | Gets and sets the CSS class to render a selected star.
    |

    | *MaxRating* | Gets and sets the maximum value that can be rated through the
    control. The default value is 5. |

    | *RatingAlign* | Indicates the alignment of the stars. The default is *horizontal*.
    |

    | *RatingDirection* | Indicates the orientation of the stars. The default is left
    to right if the *RatingAlign* value is horizontal and top to bottom if *RatingAlign*
    is vertical. |

    | *ReadOnly* | Indicates whether the control accepts user input. |'
