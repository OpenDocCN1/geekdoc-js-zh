  md: "# Using the Focus Extender Control\n\nTo use the sample extender in an ASP.NET\
    \ page, you first register the control using the @Register directive:\n\n```\n\
    <%@ Register Namespace=\"IntroAjax.Controls\" TagPrefix=\"x\" %>\n```\n\nThe host\
    \ page must also have a script manager just as any other ASP.NET AJAX page. Imagine\
    \ a sample page with three text boxes and a button that you want to change style\
    \ when focused. Here is what the code looks like:\n\n```\n<asp:ScriptManager ID=\"\
    ScriptManager1\" runat=\"server\" />\n<table>\n    <tr>\n        <td><asp:Label\
    \ runat=\"server\" ID=\"Label1\">Name</asp:Label></td>\n        <td><asp:TextBox\
    \ ID=\"TextBox1\" runat=\"server\" /></td>\n    </tr>\n    <tr>\n        <td><asp:Label\
    \ runat=\"server\" ID=\"Label2\">Phone</asp:Label></td>\n        <td><asp:TextBox\
    \ ID=\"TextBox2\" runat=\"server\" /></td>\n    </tr>\n    <tr>\n        <td><asp:Label\
    \ runat=\"server\" ID=\"Label3\">E-mail</asp:Label></td>\n        <td><asp:TextBox\
    \ ID=\"TextBox3\" runat=\"server\" /></td>\n    </tr>\n</table>\n<asp:Button runat=\"\
    server\" ID=\"Button1\" Text=\"Submit Form\" />\n```\n\nYou extend these controls\
    \ through the focus extender using the following ASP.NET markup:\n\n```\n<x:FocusExtender\
    \ ID=\"FocusExtender1\" runat=\"server\"\n        NormalCssClass=\"Normal\"\n\
    \        HighlightCssClass=\"HighLight\"\n        TargetControlID=\"TextBox1\"\
    \ />\n<x:FocusExtender ID=\"FocusExtender2\" runat=\"server\"\n        NormalCssClass=\"\
    Normal\"\n        HighlightCssClass=\"HighLight\"\n        TargetControlID=\"\
    TextBox2\" />\n<x:FocusExtender ID=\"FocusExtender3\" runat=\"server\"\n     \
    \   NormalCssClass=\"Normal\"\n        HighlightCssClass=\"HighLight\"\n     \
    \   TargetControlID=\"TextBox3\" />\n<x:FocusExtender ID=\"FocusExtender4\" runat=\"\
    server\"\n        NormalCssClass=\"NormalButton\"\n        HighlightCssClass=\"\
    HighLightButton\"\n        TargetControlID=\"Button1\" />\n```\n\nAs you can see,\
    \ each instance of the extender is bound to a particular target control and sets\
