    # Input Extenders


    Web pages still rely on the facilities built into the HTML markup language to
    let users enter data into forms and input fields. But HTML input elements are
    sometimes too limited and simple for today''s applications and users. For this
    reason, the plain old <input type="text"> element, and its TextBox ASP.NET counterpart,
    need some extra features. The ACT supplies a couple of extenders that transform
    the classic input field into a more interactive and user-friendly text box.


    # The **AutoComplete** Extender


    Typing data into a text box might be boring at times, and even more so when you
    type the same chunk of text over and over again. For this reason, Web browsers
    began supporting auto-completion features a while ago. A Web browser''s auto-completion
    feature consists of the code''s ability to track any URL that the user ever types
    in. In this way, the browser can quickly prompt you with a suggestion when you''re
    typing a possibly long and hard-to-remember URL.


    Auto-completion is also a feature that some browsers, such as Internet Explorer
    5 and newer versions, support for any custom text box you use in HTML forms. The
    browser saves on the local machine any data ever typed into an input field with
    a given name, and it makes that information available to all pages in the site
    that feature an HTML element with the same name. The feature is integrated with
    the browser and is transparent to users and developers. The list of suggestions
    builds up incrementally and is entirely beyond the control of page authors.


    The *AutoComplete* extender extends the auto-completion to any ASP.NET TextBox
    control; more importantly, it gives page authors the means to define programmatically
    the list of suggestions (as retrieved via a Web Service).'
