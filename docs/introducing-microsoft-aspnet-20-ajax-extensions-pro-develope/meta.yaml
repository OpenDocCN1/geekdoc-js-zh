  - "[PAGE 100]\n\n# 194 Part II Adding AJAX Capabilities to a Site\n\nASP.NET 2.0\
    \ *Calendar* control requires full-page postbacks, although you can find a number\
    \ of good workarounds for it–from wrapping it up in an updatable panel to using\
    \ the hover-menu extender we considered earlier.\n\nThe *Calendar* extender is\
    \ the ultimate and, I believe, definitive solution. Attached to a text box, it\
    \ provides client-side date-picking functionality with customizable date format\
    \ and pop-up control. You can interact with the calendar by clicking on a day,\
    \ navigating to a month, or selecting a particular link to set the current date.\
    \ (See Figure 5-22.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_100_0.png)\n\n\
    **Figure 5-22** The *Calendar* extender in action\n\n```\n<asp:TextBox runat=\"\
    server\" ID=\"TextBox1\" />\n\n<act:CalendarExtender runat=\"server\" ID=\"CalendarExtender1\"\
    \n    TargetControlID=\"TextBox1\"\n    CssClass=\"MyCalendar\"\n    Format=\"\
    dd/MM/yyyy\" />\n```\n\nBy clicking on the title of the calendar, you can change\
    \ the view from days-per-month to months-per-year, and even years-per-decade.\
    \ The *Format* property allows you to select the final format of the date, which\
    \ will be inserted in the bound text box. Normally, the calendar pops up when\
    \ the companion text box gets the input focus. However, you can associate the\
    \ display of the calendar with the clicking of an element–for example, an image.\
    \ The *PopupButtonID* property gets and sets the ID of a control to show the calendar\
    \ popup when clicked.\n\n# The FilteredTextBox Extender\n\nThe *FilteredTextBox*\
    \ extender filters out some characters from the buffer of a given text box control.\
    \ It differs from a validation control in that it just prevents users from entering\
    \ invalid characters, whereas a validation control operates at a later time when\
    \ the user tabs out of the input field."
  - "[PAGE 101]\n\n```\n<strong>How old are you?</strong>\n<asp:TextBox ID=\"TextBox1\"\
    \ runat=\"server\" />\n```\n\n```\n<act:FilteredTextBoxExtender ID=\"Filtered1\"\
    \ runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"Numbers\"\
    \ />\n```\n\nThe preceding text box is expected to accept a number indicating\
    \ the age of the user. Clearly, it can accept only numbers. The extender ensures\
    \ that only numbers can be typed in the input field. It does that by adding a\
    \ piece of JavaScript code to the text box to filter out undesired characters.\n\
    \nThe extender supports a few properties, including FilterType, which determine\
    \ the filter applied to the input. The property can take any of the following\
    \ values: Numbers, UppercaseLetters, LowercaseLetters, and Custom. The effect\
    \ of the filter is obvious for the first three cases. When Custom is specified,\
    \ though, you also set the ValidChars property to a comma-separated string where\
    \ each item denotes a valid character. For example, the following code allows\
    \ users to enter only A and B characters regardless of the case:\n\n```\n<act:FilteredTextBoxExtender\
    \ ID=\"Filtered1\" runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"\
    Custom\"\n    ValidChars=\"A,a,B,b\" />\n```\n\nYou can't combine multiple filters\
    \ on the same text box. If you want to filter all but letters, you can't add two\
    \ FilteredTextBox extenders to the same control. Instead, you resort to a custom\
    \ filter where you specify in the ValidChars property all acceptable characters.\n\
    \n> Important Client-side filtering, as well as validation, is subject to the\
    \ action of some JavaScript code. This means that by deactivating JavaScript on\
    \ the client browser, any filtering or validation is subsequently disabled. In\
    \ any case, you should not blindly trust what's typed by a user in a text box\
    \ and, instead, apply proper filtering and validation on the server before you\
    \ use that data for critical operations.\n\n# The MaskedEdit Extender\n\nAdded\
    \ to a TextBox control, the MaskedEdit extender forces users to enter input according\
    \ to the specified mask. In addition, data is validated on the client according\
    \ to the data type chosen. To achieve the validation, a new validator control\
    \ is introduced—MaskedEditValidator—that verifies the input. The masked edit validator\
    \ is, in turn, associated with an instance of the masked edit extender:\n\n```\n\
    <asp:TextBox runat=\"server\" ID=\"TextBox1\" />\n```\n\n```\n<act:MaskedEditValidator\
    \ ID=\"MaskedEditValidator1\" runat=\"server\"\n    ControlExtender=\"MaskedEditExtender1\"\
    \n    ControlToValidate=\"TextBox1\"\n    IsValidEmpty=\"False\"\n```"
  - "[PAGE 102]\n\n```\nEmptyValueMessage=\"Date is required\"\nInvalidValueMessage=\"\
    Date is invalid\"\nTooltipMessage=\"Input a Date\" />\n<act:MaskedEditExtender\
    \ runat=\"server\" ID=\"MaskedEditExtender1\"\n    TargetControlID=\"TextBox1\"\
    \n    Mask=\"99/99/9999\"\n    MessageValidatorTip=\"true\"\n    OnFocusCssClass=\"\
    MaskedEditFocus\"\n    OnInvalidCssClass=\"MaskedEditError\"\n    MaskType=\"\
    Date\" />\n```\n\nFigure 5-23 shows the extender at work with date and monetary\
    \ values.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_102_0.png)\n\nThe extender\
    \ supports three different masks for most common and specialized types: date,\
    \ number, and time. The *MaskType* property sets the type of the final data; the\
    \ *Mask* property defines the required input mask.\n\n# The *NoBot* Extender\n\
    \nWeb applications such as blogs, forums, and portals are subject to having their\
    \ input forms automatically filled by robot applications (also known as *bots*).\
    \ For example, a bot can register as a user of the mail service and use the portal\
    \ to send spam. The techniques employed to ensure that humans are filling an input\
    \ form instead of a piece of smart software go under the name of CAPTCHA, an acronym\
    \ for *Completely Automated Public Turing test to tell Computers*"
  - "[PAGE 103]\n\nand Humans Apart. In practice, CAPTCHA is a challenge-response\
    \ test that requires the provision of additional information that must be figured\
    \ out on the fly. Figuring this out is nothing special for humans, but virtually\
    \ impossible for automated programs. The most popular example of CAPTCHA technique\
    \ is a distorted image that represents a number. In a variety of blog systems,\
    \ users encounter an additional input field to specify a number depicted within\
    \ a figure before their posts will be accepted.\n\nThe NoBot extender is a control\
    \ that attempts to apply anti-bot techniques to input forms. The extender might\
    \ not be as powerful as a distorted image with a number inside, but it has the\
    \ advantage of being completely invisible and hard to detect. All in all, the\
    \ NoBot extender’s usefulness is probably limited to sites with low traffic where\
    \ the main goal is stopping spam, and where it’s not a big deal if it doesn’t\
    \ achieve 100-percent effectiveness.\n\n# The NumericUpDown Extender\n\nAdded\
    \ to a TextBox control, the NumericUpDown extender adds a couple of arrow buttons\
    \ next to the control to let users increment and decrement the displayed value.\
    \ Note that increment and decrement apply to numeric input as well as any user-defined\
    \ enumeration.\n\n```\n<strong>How old are you?</strong>\n<asp:TextBox ID=\"TextBox1\"\
    \ runat=\"server\" Width=\"100px\" />\n\n<act:NumericUpDownExtender ID=\"UpDown1\"\
    \ runat=\"server\"\n    Width=\"100\"\n    TargetControlID=\"TextBox1\" />\n```\n\
    \nYou should set the Width property on both the text box and the extender to control\
    \ the size of the input field. Note that the Width property on the extender indicates\
    \ the total width of the control including the arrow buttons. (See Figure 5-24.)\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_103_0.png)\n\nThe default increment\
    \ is a numeric +1 or -1. However, the RefValues property lets you define a sequence\
    \ of values to cycle through. The property accepts a string where each value is\
    \ separated by a semicolon (;) symbol."
  - "[PAGE 104]\n\n```\n<act:NumericUpDownExtender ID=\"UpDown1\" runat=\"server\"\
    \n    Width=\"100\"\n    RefValues=\"Sun;Mon;Tue;Wed;Thu;Fri;Sat\"\n    TargetControlID=\"\
    TextBox1\" />\n```\n\nThe extender can also use a Web service to calculate the\
    \ next or the previous value. In this case, you use *ServiceUpPath* and *ServiceUpMethod*\
    \ to locate the service and method for the *up* operation. Likewise, you use *ServiceDownPath*\
    \ and *ServiceDownMethod* for the *down* operation. The service methods can receive\
    \ an arbitrary value from the client through the *Tag* property.\n\n> **Note**\
    \ The sole use of the up-down extender is usually not enough to guarantee a pleasant\
    \ experience. The up-down extender, in fact, doesn't force the text box to accept\
    \ \"only\" the values generated by the up-down process. So you could type words\
    \ in a numeric text box with an associated up-down extender. To avoid that, you\
    \ might want to combine the up-down extender with a filter extender and use the\
    \ *TextBox's MaxLength* property to set the maximum number of characters.\n\n\
    # The *PasswordStrength* Extender\n\nEven the most secure system can't do much\
    \ to protect your server if authorized users employ weak and easy-to-guess passwords.\
    \ A number of best practices have been developed lately that characterize a strong\
    \ password. The *PasswordStrength* extender attaches to a *TextBox* control and\
    \ measures the strength of the current text if it's being used as a password.\n\
    \nFrom a syntax point of view, the extender can be attached to any *TextBox* control;\
    \ from a semantic perspective instead, it makes sense only if applied to a *TextBox*\
    \ control that is used for the entry of a password. The scenario in which the\
    \ *PasswordStrength* extender proves useful is not a login page where the user\
    \ enters his password to access a given functionality. Rather, it is helpful in\
    \ forms where users registers their credentials to access a system feature.\n\n\
    ```\n<h2>Choose your password</h2>\n<asp:TextBox ID=\"TextBox1\" runat=\"server\"\
    \ />\n<act:PasswordStrength runat=\"server\" TargetControlID=\"TextBox1\" />\n\
    ```\n\nThe extender validates the current text against a set of requirements set\
    \ by the page author. The result of the validation process is output through either\
    \ a text message or a bar indicator to let users know about the level of complexity\
    \ of the chosen password. With all default settings, the extender works as shown\
    \ in Figure 5-25.\n\nThe feedback is displayed as plain text and dynamically as\
    \ the user types in the buffer. The properties of the extender can be divided\
    \ into two groups: appearance and behavior.\n\nAppearance properties include *DisplayPosition*\
    \ to set the position of the feedback text (above, below, left side, or right\
    \ side), and *StrengthIndicatorType* to choose the type of visual feedback. It\
    \ can be *Text* or *BarIndicator*. When the indicator type is *Text*, the *PrefixText*\
    \ property sets"
- md: " some text to use in the composition of the feedback message. The *TextCssClass*\
    \ defines the CSS class to style the feedback message.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_105_0.png)\n\
    \nFigure 5-25 The *PasswordStrength* extender in action\n\nWhen the indicator\
    \ type is *BarIndicator*, the feedback appears as a gauge bar in a framed area.\
    \ *BarBorderCssClass* and *BarIndicatorCssClass* properties let you style the\
    \ bar.\n\nThe following properties allow you to set the password requirements\
    \ to check: *RequiresUpperAndLowerCaseCharacters*, *PreferredPasswordLength*,\
    \ *MinimumNumericCharacters*, and *MinimumSymbolCharacters*. By default, the password\
    \ length is set to 10 and no other check is enabled on the contents.\n\nThe extender\
    \ ranks the password text based on the requirements set. The score is rendered\
    \ as a gauge bar or through a text message, as you saw in Figure 5-25. Text messages\
    \ can be customized by assigning a list of semicolon-separated descriptions to\
    \ the *TextStrengthDescriptions* property. You can specify a minimum of 2 and\
    \ a maximum of 10 strings ordered from the weakest to the strongest.\n\nThe feedback\
    \ you get from the extender is split in two parts: score and status message. The\
    \ score is used to update the indicator or display a strength description. The\
    \ status message is a help message displayed on a companion control identified\
    \ by the *HelpStatusLabelID* property:\n\n```\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" /> <br />\n<asp:Label runat=\"server\" ID=\"Label1\" />\n\n<act:PasswordStrength\
    \ runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    DisplayPosition=\"RightSide\"\
    \n    PreferredPasswordLength=\"12\"\n    HelpStatusLabelID=\"Label1\" />\n</act:PasswordStrength>\n\
    ```\n\nThe *Label1* control receives a message that suggests what to do to meet\
    \ password requirements. You can also keep this message hidden all the time and\
    \ display it on demand by clicking a button. In this case, you set two new properties:\
    \ *HelpHandlePosition* and *HelpHandleCssClass*. The former sets the display position\
    \ for the help icon; the latter styles the icon.\n\n```\n<act:PasswordStrength\
    \ runat=\"server\">\n    <act:PasswordStrengthExtenderProperties TargetControlID=\"\
    TextBox1\"\n        DisplayPosition=\"BelowRight\"\n        PreferredPasswordLength=\"\
    12\"\n        HelpHandlePosition=\"RightSide\"\n        HelpHandleCssClass=\"\
    helpHandle\" />\n</act:PasswordStrength>\n```\n\nTo be precise, you set the icon\
    \ to display using the CSS style:\n\n```\n.helpHandle\n{\n    width:16px;\n  \
    \  height:14px;\n    background-image:url(images/Question.png);\n    overflow:hidden;\n\
    \    cursor:help;\n}\n```\n\nFigure 5-26 shows the final page.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_106_0.png)\n\
    \n**Figure 5-26** The *PasswordStrength* extender in action with a help button\n\
    \n## The *Slider* Extender\n\nThe *Slider* extender allows you to morph a classic\
    \ *TextBox* into a graphical slider so that users can pick up a numeric value\
    \ from a finite range. You can set the orientation of the slider (horizontal or\
    \ vertical) and also make it accept a discrete interval of values—that is, only\
    \ a specified number of values within a given range. By default, the slider accepts\
    \ values in the 0 through 100 range.\n\n```\n<h2>Your age</h2>\n<asp:TextBox ID=\"\
    TextBox1\" runat=\"server\" />\n<hr />\n<asp:Label runat=\"server\" ID=\"Label1\"\
    \ />\n```\n\n```\n<act:SliderExtender runat=\"server\" ID=\"SliderExtender1\"\n\
    \    TargetControlID=\"TextBox1\"\n    BoundControlID=\"Label1\" />\n```\n\nA\
    \ value chosen using the slider is automatically persisted via a full or partial\
    \ postback. You can reference the value using the *TextBox* programming interface.\
    \ (See Figure 5-27.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_107_0.png)\n\n\
    **Figure 5-27** The *Slider* extender in action\n\n## The *TextBoxWatermark* Extender\n\
    \nThe *TextBoxWatermark* extender allows you to define default text to display\
    \ when the text box is empty. The extender takes care of showing and hiding the\
    \ text as required.\n\n```\n<h2>Watermark</h2>\n<br/>\n<asp:TextBox ID=\"TextBox1\"\
    \ runat=\"server\" />\n&nbsp;\n<asp:TextBox ID=\"TextBox2\" runat=\"server\" />\n\
    \n<act:TextBoxWatermarkExtender runat=\"server\" ID=\"TextBoxWatermark1\"\n  \
    \  TargetControlID=\"TextBox1\"\n    WatermarkText=\"Type First Name Here\"\n\
    \    WatermarkCssClass=\"watermarked\" />\n<act:TextBoxWatermarkExtender runat=\"\
    server\" ID=\"TextBoxWatermark2\"\n    TargetControlID=\"TextBox2\"\n    WatermarkText=\"\
    Type Last Name Here\"\n    WatermarkCssClass=\"watermarked\" />\n```\n\nThe extender\
    \ uses the *TargetControlID* property to designate the target text box. The *WatermarkText*\
    \ property defines the text to display, whereas *WatermarkCssClass* indicates\
    \ the CSS style to apply to the watermark text. (See Figure 5-28.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_108_0.png)\n\
    \n**Figure 5-28** The *TextBoxWatermark* extender in action\n\n## The *ValidatorCallout*\
    \ Extender\n\nThe *ValidatorCallout* extender enhances the graphical capabilities\
    \ of existing ASP.NET validators. It displays the error message of a validator\
    \ using the balloon-style ToolTips of Windows XP. (See Figure 5-29.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_108_1.png)\n\
    \n**Figure 5-29** The *ValidatorCallout* extender in action\n\nHere's how to use\
    \ the extender:\n\n```\n<table>\n<tr>\n    <td>Name:</td>\n    <td><asp:TextBox\
    \ runat=\"server\" ID=\"txtName\" /></td>\n</tr>\n<tr>\n    <td>Email:</td>\n\
    \    <td><asp:TextBox runat=\"server\" ID=\"txtEmail\" /></td>\n</tr>\n</table>\n\
    ```\n\n```\n<asp:Button runat=\"server\" ID=\"Button1\" Text=\"Submit\" />\n<asp:RequiredFieldValidator\
    \ runat=\"server\" ID=\"requiredName\"\n    ControlToValidate=\"txtName\"\n  \
    \  Display=\"None\"\n    ErrorMessage=\"Required Field Missing<br />A name is\
    \ required.\" />\n<asp:RequiredFieldValidator runat=\"server\" ID=\"requiredEmail\"\
    \n    ControlToValidate=\"txtEmail\"\n    Display=\"None\"\n    ErrorMessage=\"\
    Required Field Missing<br />Email address required.\" />\n<asp:RegularExpressionValidator\
    \ runat=\"server\" ID=\"regularEmail\"\n    ControlToValidate=\"txtEmail\"\n \
    \   Display=\"None\"\n    ValidationExpression=\"[a-zA-Z0-9.-]+\\@[a-zA-Z0-9.-]+\\\
    .\\w+\"\n    ErrorMessage=\"<b>Invalid Email</b><br />Please, enter a valid email\
    \ address\" />\n<act:ValidatorCalloutExtender runat=\"server\" ID=\"CalloutExtender1\"\
    \n    TargetControlID=\"requiredName\" HighlightCssClass=\"highlight\" />\n<act:ValidatorCalloutExtender\
    \ runat=\"server\" ID=\"CalloutExtender2\"\n    TargetControlID=\"requiredEmail\"\
    \ HighlightCssClass=\"highlight\" />\n<act:ValidatorCalloutExtender runat=\"server\"\
    \ ID=\"CalloutExtender3\"\n    TargetControlID=\"regularEmail\" HighlightCssClass=\"\
    highlight\" />\n```\n\n## Animation Extenders\n\nThe ACT comes with a full-fledged\
    \ framework for building animations over the Web, leveraging the capabilities\
    \ of rich browsers. The idea is to have an extensible set of animation blocks\
    \ that can be composed together and run either in sequence or in parallel. The\
    \ animations to be played are declaratively specified using XML.\n\n## The *Animation*\
    \ Extender\n\nThe *Animation* extender allows you to use the built-in animation\
    \ framework in a mostly declarative and codeless fashion. The extender plays specified\
    \ animations whenever a client event occurs on the target control. Supported events\
    \ include *load*, *click*, *mouseover*, and *mouseout*. Here's an example:\n\n\
    ```\n<act:AnimationExtender ID=\"AnimationExtender1\" runat=\"server\"\n    TargetControlID=\"\
    Panel1\">\n    <Animations>\n        <OnLoad>\n            <OpacityAction Opacity=\"\
    .2\" />\n        </OnLoad>\n        <OnHoverOver>\n            <FadeIn Duration=\"\
    .25\" Fps=\"20\"\n                    MinimumOpacity=\".2\" MaximumOpacity=\"\
    .8\" />\n        </OnHoverOver>\n        <OnHoverOut>\n            <FadeOut Duration=\"\
    .25\" Fps=\"20\"\n                    MinimumOpacity=\".2\" MaximumOpacity=\"\
    .8\" />\n        </OnHoverOut>\n    </Animations>\n</act:AnimationExtender>\n\
    ```\n\nThe *Animations* tag fully describes the animation. It is made up of a\
    \ list of actions bound to specific events. In the preceding example, the events\
    \ are *load*, *hover*, and *mouseout*. The tag *OnLoad* describes the animation\
    \ performed when the extended control is loaded. Tags *OnHoverOver* and *OnHoverOut*\
    \ describe what happens when the *hover* effect is to take place, which is typically\
    \ delayed from the actual *mouseover* and *mouseout* events. To describe an animation,\
    \ you use a combination of existing animation blocks: fade-in, fade-out, opacity,\
    \ pulse, move, resize, color interpolation, and scaling. You can also specify\
    \ actions using custom script. The sample code just shown applies a slight opacity\
    \ filter to the extended control upon loading and then fades its area in when\
    \ the mouse hovers over it and out of it. For more information on built-in animation\
    \ blocks, take a look at [http://ajax.asp.net/ajaxtoolkit/Walkthrough/AnimationReference.aspx](http://ajax.asp.net/ajaxtoolkit/Walkthrough/AnimationReference.aspx).\n\
    \n## The *UpdatePanelAnimation* Extender\n\nThe *UpdatePanelAnimation* extender\
    \ applies animation to a very specific situation where custom events need to be\
    \ handled–before and after an updatable region is refreshed. Using the extender\
    \ is as simple as defining an updatable panel in the page and adding the following\
    \ code for the extender:\n\n```\n<act:UpdatePanelAnimationExtender runat=\"server\"\
    \ ID=\"UpdatePanelAnimation1\"\n    TargetControlID=\"UpdatePanel1\">\n    <Animations>\n\
    \        <OnUpdating>\n            <Sequence>\n                <EnableAction AnimationTarget=\"\
    Button1\" Enabled=\"false\" />\n                <FadeOut AnimationTarget=\"Panel1\"\
    \ minimumOpacity=\".3\" />\n            </Sequence>\n        </OnUpdating>\n \
    \       <OnUpdated>\n            <Sequence>\n                <FadeIn AnimationTarget=\"\
    Panel1\" minimumOpacity=\".3\" />\n                <EnableAction AnimationTarget=\"\
    Button1\" Enabled=\"true\" />\n            </Sequence>\n        </OnUpdated>\n\
    \    </Animations>\n</act:UpdatePanelAnimationExtender>\n```\n\nAs you can see,\
    \ it is nothing more than an animation applied to panel-specific events such as\
    \ *OnUpdating* and *OnUpdated*. Before the update begins, the area that contains\
    \ the sensitive contents to update is faded out and a control, *Button1*, is disabled.\
    \ You use the *FadeOut* animation block for this purpose. In the preceding example,\
    \ *Panel1* is merely the HTML block that contains the *UpdatePanel* control.\n\
    \n```\n<div ID=\"Panel1\">\n    <asp:UpdatePanel ID=\"UpdatePanel1\" runat=\"\
    server\" ...>\n        ...\n    </asp:UpdatePanel>\n</div>\n```"
  mdcn: "\n用于编写反馈消息的文本。*TextCssClass* 定义用于设置反馈消息样式的 CSS 类。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_105_0.png)\n\
    \n图 5-25 *PasswordStrength* 扩展器的实际效果\n\n当指示器类型为 *BarIndicator* 时，反馈以带框架区域中的仪表条形式显示。*BarBorderCssClass*\
    \ 和 *BarIndicatorCssClass* 属性允许你设置该仪表条的样式。\n\n以下属性允许你设置需要检查的密码要求：*RequiresUpperAndLowerCaseCharacters*、*PreferredPasswordLength*、*MinimumNumericCharacters*\
    \ 和 *MinimumSymbolCharacters*。默认情况下，密码长度设置为 10，且未启用其他内容检查。\n\n该扩展会根据设定的要求对密码文本进行评分。分数以仪表条或文本消息的形式呈现，如图\
    \ 5-25 所示。你可以通过将用分号分隔的描述列表赋值给 *TextStrengthDescriptions* 属性来自定义文本消息。你可以指定最少 2\
    \ 个、最多 10 个字符串，按从最弱到最强的顺序排列。\n\n从扩展器获取的反馈分为两部分：分数和状态消息。分数用于更新指示器或显示强度描述。状态消息是显示在由\
    \ *HelpStatusLabelID* 属性指定的伴随控件上的帮助消息：\n\n```\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" /> <br />\n<asp:Label runat=\"server\" ID=\"Label1\" />\n\n<act:PasswordStrength\
    \ runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    DisplayPosition=\"RightSide\"\
    \n    PreferredPasswordLength=\"12\"\n    HelpStatusLabelID=\"Label1\" />\n</act:PasswordStrength>\n\
    ```\n\n*Label1* 控件会收到一条提示消息，告知如何满足密码要求。你也可以让此消息始终隐藏，并通过点击按钮按需显示。在这种情况下，你需要设置两个新属性：*HelpHandlePosition*\
    \ 和 *HelpHandleCssClass*。前者设置帮助图标的显示位置；后者设置图标的样式。\n\n```\n<act:PasswordStrength\
    \ runat=\"server\">\n    <act:PasswordStrengthExtenderProperties TargetControlID=\"\
    TextBox1\"\n        DisplayPosition=\"BelowRight\"\n        PreferredPasswordLength=\"\
    12\"\n        HelpHandlePosition=\"RightSide\"\n        HelpHandleCssClass=\"\
    helpHandle\" />\n</act:PasswordStrength>\n```\n\n具体来说，你需要使用 CSS 样式来设置要显示的图标：\n\
    \n```\n.helpHandle\n{\n    width:16px;\n    height:14px;\n    background-image:url(images/Question.png);\n\
    \    overflow:hidden;\n    cursor:help;\n}\n```\n\n图 5-26 显示了最终页面。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_106_0.png)\n\
    \n**图 5-26** 带帮助按钮的 *PasswordStrength* 扩展器的实际效果\n\n## *Slider* 扩展器\n\n*Slider*\
    \ 扩展器允许你将经典的 *TextBox* 转换为图形化滑块，使用户可以从有限范围内选择一个数值。你可以设置滑块的方向（水平或垂直），还可以使其接受离散的值间隔——即在给定范围内仅接受指定数量的值。默认情况下，滑块接受\
    \ 0 到 100 范围内的值。\n\n```\n<h2>Your age</h2>\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" />\n<hr />\n<asp:Label runat=\"server\" ID=\"Label1\" />\n```\n\n```\n\
    <act:SliderExtender runat=\"server\" ID=\"SliderExtender1\"\n    TargetControlID=\"\
    TextBox1\"\n    BoundControlID=\"Label1\" />\n```\n\n使用滑块选择的值会通过完整回发或部分回发自动持久保存。你可以使用\
    \ *TextBox* 编程接口来引用该值。（参见图 5-27。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_107_0.png)\n\
    \n**图 5-27** *Slider* 扩展器的实际效果\n\n## *TextBoxWatermark* 扩展器\n\n*TextBoxWatermark*\
    \ 扩展器允许你定义当文本框为空时显示的默认文本。扩展会根据需要自动处理文本的显示和隐藏。\n\n```\n<h2>Watermark</h2>\n<br/>\n\
    <asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n&nbsp;\n<asp:TextBox ID=\"TextBox2\"\
    \ runat=\"server\" />\n\n<act:TextBoxWatermarkExtender runat=\"server\" ID=\"\
    TextBoxWatermark1\"\n    TargetControlID=\"TextBox1\"\n    WatermarkText=\"Type\
    \ First Name Here\"\n    WatermarkCssClass=\"watermarked\" />\n<act:TextBoxWatermarkExtender\
    \ runat=\"server\" ID=\"TextBoxWatermark2\"\n    TargetControlID=\"TextBox2\"\n\
    \    WatermarkText=\"Type Last Name Here\"\n    WatermarkCssClass=\"watermarked\"\
    \ />\n```\n\n该扩展器使用 *TargetControlID* 属性来指定目标文本框。*WatermarkText* 属性定义要显示的文本，而\
    \ *WatermarkCssClass* 指示要应用于水印文本的 CSS 样式。（参见图 5-28。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_108_0.png)\n\
    \n**图 5-28** *TextBoxWatermark* 扩展器的实际效果\n\n## *ValidatorCallout* 扩展器\n\n*ValidatorCallout*\
    \ 扩展器增强了现有 ASP.NET 验证器的图形功能。它使用 Windows XP 风格的气球形工具提示来显示验证器的错误消息。（参见图 5-29。）\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_108_1.png)\n\n**图 5-29** *ValidatorCallout*\
    \ 扩展器的实际效果\n\n以下是使用该扩展器的方法：\n\n```\n<table>\n<tr>\n    <td>Name:</td>\n    <td><asp:TextBox\
    \ runat=\"server\" ID=\"txtName\" /></td>\n</tr>\n<tr>\n    <td>Email:</td>\n\
    \    <td><asp:TextBox runat=\"server\" ID=\"txtEmail\" /></td>\n</tr>\n</table>\n\
    ```\n\n```\n<asp:Button runat=\"server\" ID=\"Button1\" Text=\"Submit\" />\n<asp:RequiredFieldValidator\
    \ runat=\"server\" ID=\"requiredName\"\n    ControlToValidate=\"txtName\"\n  \
    \  Display=\"None\"\n    ErrorMessage=\"Required Field Missing<br />A name is\
    \ required.\" />\n<asp:RequiredFieldValidator runat=\"server\" ID=\"requiredEmail\"\
    \n    ControlToValidate=\"txtEmail\"\n    Display=\"None\"\n    ErrorMessage=\"\
    Required Field Missing<br />Email address required.\" />\n<asp:RegularExpressionValidator\
    \ runat=\"server\" ID=\"regularEmail\"\n    ControlToValidate=\"txtEmail\"\n \
    \   Display=\"None\"\n    ValidationExpression=\"[a-zA-Z0-9.-]+\\@[a-zA-Z0-9.-]+\\\
    .\\w+\"\n    ErrorMessage=\"<b>Invalid Email</b><br />Please, enter a valid email\
    \ address\" />\n<act:ValidatorCalloutExtender runat=\"server\" ID=\"CalloutExtender1\"\
    \n    TargetControlID=\"requiredName\" HighlightCssClass=\"highlight\" />\n<act:ValidatorCalloutExtender\
    \ runat=\"server\" ID=\"CalloutExtender2\"\n    TargetControlID=\"requiredEmail\"\
    \ HighlightCssClass=\"highlight\" />\n<act:ValidatorCalloutExtender runat=\"server\"\
    \ ID=\"CalloutExtender3\"\n    TargetControlID=\"regularEmail\" HighlightCssClass=\"\
    highlight\" />\n```\n\n## 动画扩展器\n\nACT 配备了一套完整的 Web 动画构建框架，充分利用了富浏览器的能力。其核心思想是提供一组可扩展的动画块，这些动画块可以组合在一起，并以串行或并行的方式运行。要播放的动画通过\
    \ XML 以声明方式指定。\n\n## *Animation* 扩展器\n\n*Animation* 扩展器允许你以声明式、无代码的方式使用内置的动画框架。当目标控件上发生客户端事件时，扩展会播放指定的动画。支持的事件包括\
    \ *load*、*click*、*mouseover* 和 *mouseout*。示例如下：\n\n```\n<act:AnimationExtender\
    \ ID=\"AnimationExtender1\" runat=\"server\"\n    TargetControlID=\"Panel1\">\n\
    \    <Animations>\n        <OnLoad>\n            <OpacityAction Opacity=\".2\"\
    \ />\n        </OnLoad>\n        <OnHoverOver>\n            <FadeIn Duration=\"\
    .25\" Fps=\"20\"\n                    MinimumOpacity=\".2\" MaximumOpacity=\"\
    .8\" />\n        </OnHoverOver>\n        <OnHoverOut>\n            <FadeOut Duration=\"\
    .25\" Fps=\"20\"\n                    MinimumOpacity=\".2\" MaximumOpacity=\"\
    .8\" />\n        </OnHoverOut>\n    </Animations>\n</act:AnimationExtender>\n\
    ```\n\n*Animations* 标签完整描述了动画内容。它由一系列绑定到特定事件的动作组成。在上述示例中，事件包括 *load*、*hover* 和\
    \ *mouseout*。*OnLoad* 标签描述扩展控件加载时执行的动画。*OnHoverOver* 和 *OnHoverOut* 标签描述 *hover*\
    \ 效果发生时的行为，这通常是从实际的 *mouseover* 和 *mouseout* 事件延迟触发的。要描述动画，你可以组合使用现有的动画块：淡入、淡出、透明度、脉冲、移动、调整大小、颜色插值和缩放。你也可以使用自定义脚本来指定动作。上述示例代码在加载时对扩展控件应用了轻微的透明度滤镜，然后在鼠标悬停时淡入其区域，移出时淡出。有关内置动画块的更多信息，请参阅\
    \ [http://ajax.asp.net/ajaxtoolkit/Walkthrough/AnimationReference.aspx](http://ajax.asp.net/ajaxtoolkit/Walkthrough/AnimationReference.aspx)。\n\
    \n## *UpdatePanelAnimation* 扩展器\n\n*UpdatePanelAnimation* 扩展器适用于一种非常特定的场景，即需要处理自定义事件——在可更新区域刷新之前和之后。使用该扩展器非常简单，只需在页面中定义一个更新面板，并添加以下扩展器代码即可：\n\
    \n```\n<act:UpdatePanelAnimationExtender runat=\"server\" ID=\"UpdatePanelAnimation1\"\
    \n    TargetControlID=\"UpdatePanel1\">\n    <Animations>\n        <OnUpdating>\n\
    \            <Sequence>\n                <EnableAction AnimationTarget=\"Button1\"\
    \ Enabled=\"false\" />\n                <FadeOut AnimationTarget=\"Panel1\" minimumOpacity=\"\
    .3\" />\n            </Sequence>\n        </OnUpdating>\n        <OnUpdated>\n\
    \            <Sequence>\n                <FadeIn AnimationTarget=\"Panel1\" minimumOpacity=\"\
    .3\" />\n                <EnableAction AnimationTarget=\"Button1\" Enabled=\"\
    true\" />\n            </Sequence>\n        </OnUpdated>\n    </Animations>\n\
    </act:UpdatePanelAnimationExtender>\n```\n\n如你所见，这只不过是应用于面板特定事件（如 *OnUpdating*\
    \ 和 *OnUpdated*）的动画。在更新开始之前，包含需要更新的敏感内容的区域会淡出，同时控件 *Button1* 被禁用。你使用 *FadeOut*\
    \ 动画块来实现此目的。在上述示例中，*Panel1* 只是一个包含 *UpdatePanel* 控件的 HTML 块。\n\n```\n<div ID=\"\
    Panel1\">\n    <asp:UpdatePanel ID=\"UpdatePanel1\" runat=\"server\" ...>\n  \
    \      ...\n    </asp:UpdatePanel>\n</div>\n```\n"
