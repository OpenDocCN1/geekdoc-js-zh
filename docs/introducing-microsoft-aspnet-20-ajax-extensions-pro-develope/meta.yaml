    \ method:\n\n```\nprotected override IEnumerable<ScriptReference> GetScriptReferences()\n\
    {\n    ScriptReference reference = new ScriptReference();\n    reference.Path\
    \ = ResolveClientUrl(\"FocusBehavior.js\");\n\n    return new ScriptReference[]\
