  md: 'If you take a tour of the project files, you''ll see that the ACT is a collection
    of ASP.NET AJAX controls and extenders plus many examples that illustrate their
    functionality and tests. In addition, the ACT contains a development kit to simplify
    the creation and re-use of your own custom controls and extenders. The development
    kit includes Visual Studio 2005 templates for Visual Basic and Visual C# to let
    developers write their own controls and extenders. In addition, it features a
    library of helper classes to speed up the creation of controls and extenders.


    # Adding ACT Components to the Toolbox


    So the ACT contains a number of controls and extenders that you might want to
    compose and combine in your ASP.NET pages. The Visual Studio 2005 toolbox appears
    to be the perfect place to list all these components so that developers can pick
    up exactly the one they need and paste it to the current page. To add ACT components
    to the toolbox, you first create a new tab in the toolbox. You right-click on
    the toolbox surface and select Add Tab from the context menu. Once the new tab
    is added, you can give it any name you want—for example, AJAX Control Toolkit.


    Next, you populate the tab with all components in the ACT assembly. To do this,
    you right-click the toolbox area below the newly added tab and select Choose Items.
    The standard dialog box that lists .NET assemblies and COM components will show
    up. Browse to the location where you installed the ACT, and select the AjaxControlToolkit
    assembly from the Bin folder of the SampleWebsite folder. That''s all there is
    to it. When you''re done, your toolbox will magically look like the one shown
    in Figure 5-3.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_58_0.png)


    Figure 5-3 Creating a new tab in the Visual Studio 2005 toolbox to host the ACT
    components'
