    \n        PopupControlID=\"PopupContent\"\n        OkControlID=\"Button1\"\n \
    \       CancelControlID=\"Button2\">\n```\n\nNotice that the *ModalPopup* extender\
    \ is fired by the *onclick* event on the target control. It turns out, therefore,\
    \ that the target control can only be a control that supports clicking. The pop-up\
    \ control doesn't have to be a *Panel* control; generally, it can be any control.\
    \ However, it will normally be a control that contains a bunch of other controls—typically,\
    \ a *Panel*.\n\nIn the pop-up panel you can optionally identify an OK control\
    \ and a *Cancel* control. You set the ID of such controls (commonly, buttons)\
    \ through the *OkControlID* and *CancelControlID* properties. The pop-up behavior\
    \ is clearly a client-side action, so some JavaScript code might be required in\
    \ response to the user's clicking the OK or *Cancel* control. You use the *OnOkScript*\
    \ property to specify the JavaScript function to run in case the user clicks the\
    \ OK button; you use *OnCancelScript* otherwise.\n\nThe following markup shows\
    \ the content of a sample modal panel. Note that the *Panel* control should set\
    \ its CSS *display* attribute to *none* to make any contents invisible at first.\n\
    \n```\n<asp:LinkButton ID=\"LinkButton1\" runat=\"server\" text=\"Click me\" />\n\
    <asp:Panel runat=\"server\" ID=\"PopupContent\" BackColor=\"Yellow\">\n      \
    \  <div style=\"margin:10px\">\n        Take note of this message and tell us\
    \ if you strongly agree.\n        <br /><br />\n        <asp:Button ID=\"Button1\"\
    \ runat=\"server\" Text=\"Yes\" width=\"40px\"  />\n        <asp:Button ID=\"\
    Button2\" runat=\"server\" Text=\"No\"  width=\"40px\" />\n        </div>\n</asp:Panel>\n\
    ```\n\nFigure 5-13 shows the modal dialog box in action.\n\nA couple of graphical\
    \ properties—*DropShadow* and *BackgroundCssClass*—complete the extender. A Boolean\
    \ property, *DropShadow* indicates whether a drop shadow—as shown in Figure 5-13—should\
    \ be rendered. *BackgroundCssClass*, on the other hand, determines the style that\
    \ is temporarily applied to the underlying page:"
  - "[PAGE 87]\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_87_0.png)\n\nFigure 5-13\
