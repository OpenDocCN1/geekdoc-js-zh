    ![](img/db82dc55683fa403b8b16b76eb00cc2e_17_0.png)


    Figure 1-1 Browsers submit an HTML form and receive a new page to display.'
  - '[PAGE 18]


    The chief factor that enables remote scripting is the ability to issue out-of-band
    HTTP requests. In this context, an out-of-band call indicates an HTTP request
    placed using a component that is different from the browser''s built-in module
    that handles the HTML form submission (that is, outside the traditional mechanism
    you see in Figure 1-1). The out-of-band call is triggered via script by an HTML
    page event and is served by a proxy component. In the most recent AJAX solutions,
    the proxy component is based on the XMLHttpRequest object; the proxy component
    was a Java applet in the very first implementation of RS.


    # ## Update Pages via Script


    The proxy component (for example, the XMLHttpRequest object) sends a regular HTTP
    request and waits, either synchronously or asynchronously, for it to be fully
    served. When the response data is ready, the proxy invokes a user-defined JavaScript
    callback to refresh any portion of the page that needs updating. Figure 1-2 provides
    a graphical overview of the model.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_18_0.png)


    **Figure 1-2** Out-of-band calls are sent through a proxy component, and a JavaScript
    callback is used to update any portion of the page affected by returned data.


    All browsers know how to replace an old page with a new page; until a few years
    ago, though, not all of them provided an object model to represent the current
    contents of the page. (Today, I can hardly mention a single modern, commercially
    available browser that doesn''t expose a read/write page DOM.) For browsers that
    supply an updatable object model for HTML pages, the JavaScript callback function
    can refresh specific portions of the old page, thus making them look updated,
    without a full reload.


    # ## The Document Object Model


    The page Document Object Model (DOM) is the specification that defines a platform-
    and language-neutral interface for accessing and updating the contents, structure,
    and style of HTML and XML documents. A recognized standard ratified by the W3C
    committee, the DOM is now supported by virtually all browsers. The DOM provides
    a standard set of objects for representing the constituent elements of HTML and
    XML documents. All together, these objects form a standard interface for accessing
    and manipulating child elements of HTML pages and, more in general, XML documents.


    Note that although the first working frameworks for remote scripting date back
    to a decade ago, the limited support browsers have had for dynamic changes in
    displayed documents slowed down the adoption of such technologies in the industry.
    Until now.'
  - '[PAGE 19]


    # The Role of Rich Browsers


    As shown in Figure 1-2, the AJAX model has two key requirements as far as browsers
    are con-cerned: a proxy component and an updatable page DOM. For quite a long
    time, only high-end browsers (also known as rich, up-level browsers) provided
    support for both features. In the past few years, only companies that could exercise
    strict control over the capabilities of the client browsers were able to choose
    the AJAX model for their sites. For too long, a *rich* browser also has meant
    a browser with too limited *reach*. For too long, using such a browser was defi-nitely
    a bad choice for most businesses because the limited reach excluded significant
    portions of the customer base.


    # Rich vs. Reach


    Perhaps due to a rare and likely unrepeatable astral conjunction, today more than
    90 percent of browsers available on the market happen to have built-in support
    for the advanced capabil-ities that the AJAX model requires. Internet Explorer
    since version 5.0, Firefox, Netscape from version 6 and onward, Safari 1.2, Opera
    starting with version 8.0, and a variety of mobile devices are all browsers that
    fully support the AJAX programming model.


    For the very first time, a *rich browser* is not synonymous with a *limited reach
    browser*. Finally, you don''t have to choose a particular browser to enjoy advanced,
    programming-rich features. Designing highly interactive Web applications that
    implement remote scripting techniques is no longer an impossible dream to chase
    but a concrete opportunity to seize—whatever browsers you and your clients use.


    Each platform and each vendor might have a particular framework and tool set to
    offer, but this doesn''t change the basic fact that living the AJAX lifestyle
    is now possible with 90 percent of the browsers available today. It''s a real
    breakthrough, and it is now possible to build and distribute applications that
    were not possible before.


    # Required Capabilities


    Exactly what are the capabilities required of a browser to run AJAX functionalities?
    As men-tioned, a browser needs to provide two key capabilities: a proxy mechanism
    to make client code able to place out-of-band HTTP calls, and an updatable DOM.


    There''s a W3C ratified standard for the updatable DOM. A W3C standard for the
    proxy com-ponent is currently being developed. It takes the form of the *XMLHttpRequest*
    object and is devised as an interface exposed by the browser to allow script code
    to perform HTTP client functionality, such as submitting form data or loading
    data from a remote Web site. The latest working draft is available at *http://www.w3.org/TR/XMLHttpRequest*.


    In addition, browsers must support JavaScript and preferably cascading style sheets
    (CSS).


    In the end, the AJAX lifestyle is possible and affordable for virtually every
    developer and nearly 90 percent of the Web audience, regardless of the platform.
    The tools required to make AJAX work are becoming as ubiquitous as HTML/XML parsers,
    HTTP listeners, and JavaScript'
- md: '## The AJAX Core Engine


    AJAX is not a particular technology or product. It refers to a number of client
    features, and related development techniques, that make Web applications look
    like desktop applications. AJAX doesn''t require any plug-in modules either and
    is not browser specific. Virtually any browser released in the past five years
    can serve as a great host for AJAX-based applications. AJAX development techniques
    revolve around one common software element—the `XMLHttpRequest` object. The availability
    of this object in the object model of most browsers is the key to the current
    ubiquity and success of AJAX applications. In addition to `XMLHttpRequest`, a
    second factor contributes to the wide success of AJAX—the availability of a rich
    document object model in virtually any browser.


    Originally introduced with Internet Explorer 5.0, the `XMLHttpRequest` object
    is an internal object that the browser publishes to its scripting engine. In this
    way, the script code found in any client page—typically, JavaScript code—can invoke
    the object and take advantage of its functionality.


    The `XMLHttpRequest` object allows script code to send HTTP requests and handle
    their response. Functionally speaking, and despite the XML in the name, the `XMLHttpRequest`
    object is nothing more than a tiny object designed to place HTTP calls via script
    in a non-browser-led way. When users click the submit button of a form, or perform
    any action that ends up invoking the `submit` method on the DOM''s `form` object,
    the browser kicks in and takes full control of the subsequent HTTP request. From
    the user''s perspective, the request is a black box whose only visible outcome
    is the new page being displayed. The client script code has no control over the
    placement and outcome of the request.


    ## The *XMLHttpRequest* Object


    Created by Microsoft and adopted soon thereafter by Mozilla, the `XMLHttpRequest`
    object is today fully supported by the majority of Web browsers. As you''ll see
    in a moment, the implementation can significantly differ from one browser to the
    next, even though the top-level interface is nearly identical. For this reason,
    a W3C committee is at work with the goal of precisely documenting a minimum set
    of interoperable features based on existing implementations.


    > **Note** The `XMLHttpRequest` object originally shipped as a separate component
    with Internet Explorer 5.0 back in the spring of 1999. It is a native component
    of all Microsoft operating systems that have shipped since. In particular, you''ll
    certainly find it installed on all machines that run Windows 2000, Windows XP,
    and newer operating systems.


    ## The Internet Explorer Object


    When the XMLHttp *Request* object was first released, the Component Object Model
    (COM) was ruling the world at Microsoft. The extensibility model of products and
    applications was based on COM and implemented through COM components. In the late
    1990s, the right and natural choice was to implement this new component as a reusable
    automation COM object, named Microsoft.XmlHttp.


    Various versions of the same component (even with slightly different names) were
    released over the years, but all of them preserved the original component model—COM.
    Internet Explorer 6.0, for example, ships the XMLHttp *Request* object in the
    form of a COM object. Where''s the problem?


    COM objects are external components that require explicit permission to run inside
    of a Web browser. In particular, to run the XMLHttp *Request* object and subsequently
    enable any AJAX functionality built on top of it, at a minimum a client machine
    needs to accept ActiveX components marked safe for scripting. (See Figure 1-3.)


    ![Figure 1-3](img/db82dc55683fa403b8b16b76eb00cc2e_21_0.png)


    Figure 1-3 The property window used to change the security settings in Internet
    Explorer


    The XMLHttp *Request* object is certainly a safe component, but to enable it users
    need to lessen their security settings and accept any other component "declared"
    safe for scripting that is around the Web sites they visit.


    > **Important** The internal implementation of `XMLHttpRequest` is disjointed
    from the implementation of any AJAX-like frameworks, such as Microsoft ASP.NET
    AJAX. Under the hood, any framework ends up calling the object as exposed by,
    or available in, the browser.


    ## The Mozilla Counterpart


    Mozilla adopted `XMLHttpRequest` immediately after its first release with Internet
    Explorer 5.0. However, in Mozilla-equipped browsers the `XMLHttpRequest` object
    is part of the browser''s object model and doesn''t rely on external components.
    Put another way, a Mozilla browser such as Firefox publishes its own `XMLHttpRequest`
    object into the scripting engine and never uses the COM component, even when the
    COM component is installed on the client machine and is part of the operating
    system. Figure 1-4 shows the different models in Internet Explorer (up to version
    6.0) and Mozilla browsers.


    ![Figure 1-4](img/db82dc55683fa403b8b16b76eb00cc2e_22_0.png)


    Figure 1-4 `XMLHTTPRequest` is a scriptable component exposed by the browser in
    Mozilla and an external COM component in Internet Explorer (up to version 6.0)


    As a result, in Mozilla browsers `XMLHttpRequest` looks like a native JavaScript
    object and can be instantiated through the classic `new` operator:


    ```

    // The object name requires XML in capital letters

    var proxy = new XMLHttpRequest();

    ```


    When the browser is Internet Explorer, the `XMLHttpRequest` object is instantiated
    using the `ActiveXObject` wrapper, as shown here:


    ```

    var proxy = new ActiveXObject("Microsoft.XmlHttp");

    ```


    Generally, AJAX-style frameworks check the current browser and then decide about
    the route to take.


    Needless to say, as implemented in Mozilla browsers the *XMLHttpRequest* functionality
    is somewhat safer, at least in the sense it doesn''t require users to change their
    security settings for the browser.


    ## XMLHttpRequest in Internet Explorer 7


    Implemented as a COM component for historical reasons on Internet Explorer browsers,
    the *XMLHttpRequest* object has finally become a browser object with Internet
    Explorer 7.0. All potential security concerns are removed at the root, and AJAX
    frameworks can be updated to use the same syntax for creating the *XMLHttpRequest*
    object regardless of the browser:


    ```

    var proxy = new XMLHttpRequest();

    ```


    In addition, this change in Internet Explorer 7.0 completely decouples AJAX-like
    functionality in ASP.NET from an ActiveX-enabled environment.


    ## An HTTP Object Model


    I spent quite a few words on the *XMLHttpRequest* object and its expected behavior,
    but I still owe you a practical demonstration of the object''s capabilities. In
    this section, I''ll cover the members of the component, the actions it can perform,
    and details of the syntax.


    As mentioned, the *XML* in the name of the component means little and in no way
    limits the capabilities of the component. In spite of the XML prefix, you can
    use the object as a true automation engine for executing and controlling HTTP
    requests, from client code generated by ASP.NET pages or the Windows shell, or
    Visual Basic 6.0 or C++ unmanaged applications. Using the *XMLHttpRequest* COM
    object from within .NET applications is nonsensical, as you can find similar functionality
    in the folds of the *System.Net* namespace in the .NET Framework.


    > **Important** If you''re going to use Microsoft ASP.NET AJAX Extensions or any
    other AJAX-like framework for building your applications, you''ll hardly hear
    about the *XMLHttpRequest* object, much less use it directly in your own code.
    ASP.NET AJAX Extensions completely encapsulates this object and shields page authors
    and application designers from it. You don''t need to know about *XMLHttpRequest*
    to write great AJAX applications, no matter how complex and sophisticated they
    are. However, knowing the fundamentals of *XMLHttpRequest* can lead you to a better
    and more thorough understanding of the platform and to more effective diagnoses
    of problems.


    ## Behavior and Capabilities


    The *XMLHttpRequest* object is designed to perform one key operation: sending
    an HTTP request. The request can be sent either synchronously or asynchronously.
    The following listing shows the programming interface of the object as it results
    from the W3C working draft at the time of this writing:'
