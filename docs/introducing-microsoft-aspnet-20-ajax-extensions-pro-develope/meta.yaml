  md: '# Chapter 5

    The AJAX Control Toolkit


    In this chapter:

    - Extender Controls .....................................................................140

    - Introducing the AJAX Control Toolkit .............................................150

    - The *Accordion* Control ...................................................................157

    - The *Rating* Control ........................................................................160

    - The *ReorderList* Control .................................................................164

    - The *TabContainer* Control ...............................................................169

    - AJAX Control Toolkit Extenders ........................................................172

    - Conclusion ......................................................................................205


    Although ASP.NET AJAX is a framework designed to bring more programming power
    to the Web client, it happens to be mostly used by server developers—for example,
    ASP.NET developers or, at least, Web developers with strong server-side skills.
    Unfortunately, for the time being, there’s no way to add rich capabilities and
    functionalities to the Web client other than by crafting good and tricky JavaScript
    code.


    ASP.NET AJAX takes up the challenge and provides two ways for developers to build
    rich Web applications using a server-centric development approach. As we discussed
    in Chapter 4, “Partial Page Rendering,” developers can refresh specific regions
    of the page using partial rendering instead of normal ASP.NET postbacks. To create
    such regions, you just use a particular set of server controls—the most important
    of which is the *UpdatePanel* control.


    In addition to partial rendering, developers can use *control extenders* to add
    a predefined client-side behavior to new and existing ASP.NET controls. A client-side
    behavior is a block of JavaScript code that adds a new capability to the markup
    generated by a given ASP.NET control. An extender is basically a server control
    that emits proper script code—the client behavior—to enhance how a given ASP.NET
    control behaves on the client. An extender is not simply a custom control derived
    from an existing control. Rather, it represents a general behavior—such as auto-completion,
    focus management, generation of popups, and draggability—that can be declaratively
    applied to various target control types. For example, a special behavior can be
    applied to any focused control—be it a *TextBox*, *Button*, or *CheckBox* control.


    ASP.NET AJAX Extensions 1.0 simply delivers the base class for extender controls.
    No concrete extender controls are provided with the binaries. The online documentation
    provides some good tutorials on how to build extenders. You can find one at http://
    ajax.asp.net/docs/tutorials/ExtenderControlTutorial1.aspx. A fair number of sample
    extenders


    139'
