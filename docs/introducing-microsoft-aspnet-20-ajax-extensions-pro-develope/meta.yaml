    \ of a node? The easiest and most common approach entails that you use the innerHTML\
    \ property:\n\n```\nvar node = document.getElementById(\"button1\");\nnode.innerHTML\
    \ = \"Hey click me\";\n```\n\nThe innerHTML property is supported by virtually\
    \ all browsers, and it sets or retrieves the HTML between the start and end tags\
    \ of the given object. Some browsers such as Internet Explorer also support the\
    \ innerText property. This property is designed to set or retrieve the text inside\
    \ of a given DOM object. Unfortunately, this property is not supported by all\
    \ browsers. It exists in Internet Explorer and Safari but, for example, it is\
    \ not supported by Firefox. Firefox, on the other hand, supports a property with\
    \ a similar behavior but a different name—textContent.\n```"
