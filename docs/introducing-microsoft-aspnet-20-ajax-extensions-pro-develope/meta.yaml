    \ 编写，它创建了代理类，供客户端 JavaScript 用于调用服务器页面上的方法。AjaxPro 框架提供完整的数据类型支持，并可在所有常见的 Web\
    \ 浏览器上工作，包括移动设备。值得一提的是，该库既可用于 ASP.NET 1.1，也可用于 ASP.NET 2.0。\n\nAjaxPro 库背后的关键工具是一个\
