    \ and sets the number of frames per second used in the transition animation for\
    \ the newly selected pane. This property is set to 30 frames by default. |\n|\
    \ *HeaderCssClass* | Gets and sets the CSS class used to style the header of child\
    \ panes. |\n| *Panes* | Returns the collection of child panes. |\n| *SelectedIndex*\
    \ | Gets and sets the currently expanded pane. |\n| *TransitionDuration* | Gets\
    \ and sets the number of milliseconds to animate the transition. This property\
    \ is set to *250* by default. |\n"
