- md: "## Configuring the ReorderList Control\n\nThe following code snippet demonstrates\
    \ a sample reorder list control bound to an *ObjectDataSource* control:\n\n```\n\
    <act:ReorderList runat=\"server\" ID=\"list\"\n    DataSourceID=\"ObjectDataSource1\"\
    >\n    <ItemTemplate>\n        <asp:Label ID=\"Label1\" runat=\"server\"\n   \
    \         Text='<%# Eval(\"lastname\") %>' />\n    </ItemTemplate>\n    <ReorderTemplate>\n\
    \        <asp:Panel ID=\"Panel2\" runat=\"server\" CssClass=\"reorderCue\" />\n\
    \    </ReorderTemplate>\n</act:ReorderList>\n<asp:ObjectDataSource ID=\"ObjectDataSource1\"\
    \ runat=\"server\"\n    TypeName=\"IntroAtlas.EmployeeManager\"\n    SelectMethod=\"\
    LoadAll\">\n</asp:ObjectDataSource>\n```\n\nThe sample control has no *DragHandleTemplate*\
    \ set, which means that its user interface has no visible element to start dragging.\
    \ In this case, the output looks like a bulleted list, and to start reordering\
    \ you simply click and drag the text beside the bullet point, as shown in Figure\
    \ 5-6.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_73_0.png)\n\n**Figure 5-6**\
    \ Reordering the items in a *ReorderList* control\n\nGenerally, the item being\
    \ moved is rendered through a template that you specify via the *ReorderTemplate*\
    \ property. In this case, the reorder template consists of the sole text of the\
    \ item plus a cascading style. If you omit the template but still enable reordering\
    \ through the *AllowReorder* Boolean property, the text of the item, rendered\
    \ with a gray color, is used to give feedback to users about the ongoing operation.\n\
    \n## Reordering and Postback Events\n\nThe *ReorderList* control can be configured\
    \ to post back at the end of each drag-and-drop operation. To avoid a full page\
    \ refresh, you need to wrap the *ReorderList* control in an *UpdatePanel* control.\
    \ As explained in Chapter 4, in this way you guarantee that only the user interface\
    \ of the list control is refreshed rather than the entire page being updated with\
    \ a complete postback. The following few lines of markup can accomplish this for\
    \ us:\n\n```\n<asp:UpdatePanel runat=\"server\" ID=\"UpdatePanel1\">\n    <ContentTemplate>\n\
    \        ...\n        <!-- ReorderList goes here -->\n        ...\n    </ContentTemplate>\n\
    </asp:UpdatePanel>\n```\n\nWhy does the control do a postback of its own? The\
    \ *ReorderList* control attempts to persist the changes the user made so that\
    \ if any postback occurs from within the page—say, a postback caused by the user\
    \ clicking on another button in the page—the contents of the *ReorderList*, as\
    \ modified via a drag-and-drop operation, are maintained. Note, in fact, that\
    \ any changes made on the client should be persisted on the server; otherwise,\
    \ they will be lost in the first subsequent page postback.\n\n## Persisting Reordered\
    \ Items\n\nIf you run a page that contains a *ReorderList* control, you notice\
    \ that invariably after a postback, any moved element is restored to its original\
    \ location. Why is that so? At the end of the drop operation, the *ReorderList*\
    \ control posts back, fires the *ItemReorder* event on the server, and rebuilds\
    \ the list. The list is data bound, so unless you change something in the binding\
    \ process, the list will be bound back to the same record set in the same old\
    \ order.\n\nSubsequently, a page that hosts a *ReorderList* control should wire\
    \ up the *ItemReorder* event and make sure that the data source bound to the control\
    \ properly reflects the changes generated on the client. The *ItemReorder* event\
    \ has the following signature:\n\n```\nvoid OnItemReorder(object sender, ReorderListItemReorderEventArgs\
    \ e)\n```\n\nIn this event handler, you should do the real work of the reorder—that\
    \ is, move the item from the old position to the new position in the data source\
    \ used to populate the list. How you do this depends on the binding mechanism.\
    \ If you opted for a data source control (for example, *ObjectDataSource*), you\
    \ can try sorting on a given field, if any, that reflects the new order. If you\
    \ set the data source assigning an *IEnumerable* object to the *DataSource* property,\
    \ you can retrieve and modify this object to reflect the new order. For a *DataTable*,\
    \ for example, this means swapping two rows.\n\n> **Note** The *ReorderList* can\
    \ automatically perform server-side reorders if its *SortOrderField* property\
    \ is set and if the data source can be sorted on that field. In addition, the\
    \ type of the sort field must be *integer*.\n\n## The TabContainer Control\n\n\
    Multiple views are a common feature in most pages. They group information in tabs\
    \ and let users click to display only a portion of the information available.\
    \ In ASP.NET 2.0, the *MultiView* control provides an effective shortcut to this\
    \ feature. But it requires a postback to update the page when the user selects\
    \ a new tab. In the ACT, the *TabContainer* control provides an AJAX version of\
    \ the multiview control.\n\n## Generalities of the TabContainer Control\n\nThe\
    \ *TabContainer* control is made of a collection of tabs, each of which is represented\
    \ by an instance of the *TabPanel* class. You can add and remove panels programmatically,\
    \ as well as define them declaratively.\n\n## Properties of the Control\n\nTable\
    \ 5-6 lists the properties supported by the control.\n\n### Table 5-6 Properties\
    \ of the TabContainer Control\n\n| Property | Description |\n| --- | --- |\n|\
    \ *ActiveTab* | Returns a reference to the currently selected tab. |\n| *ActiveTabIndex*\
    \ | Gets and sets the 0-based index of the selected tab. |\n| *CssClass* | Gets\
    \ and sets the CSS class to use to style the control. |\n| *Height* | Gets and\
    \ sets the height of the tabs. The value of the property is expressed as a *Unit*\
    \ value. This value doesn't include headers. |\n| *OnClientActiveTabChanged* |\
    \ Gets and sets the JavaScript code to be executed on the client when the user\
    \ changes the selection. |\n| *Scrollbars* | Gets and sets the desired support\
    \ for scrollbars. This property is set to *Auto* by default. Feasible values come\
    \ from the ASP.NET 2.0 *Scrollbars* type. |\n| *Tabs* | Returns the collection\
    \ of *TabPanel* objects that defines the user interface of the control. |\n| *Width*\
    \ | Gets and sets the width of the tabs. The value of the property is expressed\
    \ as a *Unit* value. |\n\nIn addition, the control fires the *ActiveTabChanged*\
    \ event when the selected tab changes. The event is a mere notification, and the\
    \ required delegate is *EventHandler*. No additional information is passed along\
    \ with the event.\n\n## Properties of Tab Panels\n\nThe *TabPanel* class represents\
    \ an individual tab in the container. Each tab defines its header either as plain\
    \ text or as a template. Likewise, a tab features a template to let developers\
    \ specify its content. The most recent tab should remain selected after a postback.\
    \ Table 5-7 lists the properties of the *TabPanel* class.\n\n| Property | Description\
    \ |\n| --- | --- |\n| *ContentTemplate* | Sets the contents of the tab. |\n| *Enabled*\
    \ | Indicates whether the tab should be displayed. The value of the property can\
    \ be changed on the client. |\n| *HeaderTemplate* | Gets and sets the template\
    \ to use to define the header of the tab. |\n| *HeaderText* | Gets and sets the\
    \ text to display in the tab's header. |\n| *OnClientClick* | JavaScript code\
    \ to attach to the client-side *click* event of the tab. |\n| *OnClientPopulated*\
    \ | JavaScript code to run on the client when the tab has been fully populated.\
    \ |\n| *OnClientPopulating* | JavaScript code to run on the client when the tab\
    \ is going to be populated. |\n| *Scrollbars* | Gets and sets the desired support\
    \ for scrollbars. This property is set to *Auto* by default. Feasible values come\
    \ from the ASP.NET 2.0 *Scrollbars* type. |\n\nThe JavaScript code you can attach\
    \ to some client events can be either the name of function embedded in the host\
    \ page or a string of JavaScript executable code.\n\n## Using the TabContainer\
    \ Control\n\nLet's consider a sample page that makes use of the *TabContainer*\
    \ control. As you'll see in a moment, the markup required for a tab container\
    \ is straightforward.\n\n## Configuring the TabContainer Control\n\nThe *TabContainer*\
    \ tag maps its child tags to the *Tabs* collection of *TabPanel* objects. You\
    \ add one `<TabPanel>` tag for each desired tab and configure it at will. Here's\
    \ an example:\n\n```\n<act:TabContainer runat=\"server\" ID=\"TabContainer1\"\
    >\n    <act:TabPanel runat=\"server\" ID=\"TabPanel1\" HeaderText=\"Your Tab\"\
    >\n        <ContentTemplate>\n            <h3>Some text here</h3>\n        </ContentTemplate>\n\
    \    </act:TabPanel>\n    ...\n</act:TabContainer>\n```\n\nAll tabs are given\
    \ the same size, and you can control the size designation through the *Width*\
    \ and *Height* properties of the container. The height you set refers to the body\
    \ of tags and doesn't include the header."
  mdcn: "\n## 配置 ReorderList 控件\n\n以下代码片段演示了一个绑定到 *ObjectDataSource* 控件的示例 reorder\
    \ list 控件：\n\n```\n<act:ReorderList runat=\"server\" ID=\"list\"\n    DataSourceID=\"\
    ObjectDataSource1\">\n    <ItemTemplate>\n        <asp:Label ID=\"Label1\" runat=\"\
    server\"\n            Text='<%# Eval(\"lastname\") %>' />\n    </ItemTemplate>\n\
    \    <ReorderTemplate>\n        <asp:Panel ID=\"Panel2\" runat=\"server\" CssClass=\"\
    reorderCue\" />\n    </ReorderTemplate>\n</act:ReorderList>\n<asp:ObjectDataSource\
    \ ID=\"ObjectDataSource1\" runat=\"server\"\n    TypeName=\"IntroAtlas.EmployeeManager\"\
    \n    SelectMethod=\"LoadAll\">\n</asp:ObjectDataSource>\n```\n\n此示例控件未设置 *DragHandleTemplate*，这意味着其用户界面中没有可见的元素来启动拖动。在这种情况下，输出看起来像一个项目符号列表，要开始重新排序，只需单击并拖动项目符号旁边的文本，如图\
    \ 5-6 所示。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_73_0.png)\n\n**图 5-6** 在\
    \ *ReorderList* 控件中重新排序项目\n\n通常，正在移动的项目是通过您通过 *ReorderTemplate* 属性指定的模板进行渲染的。在这种情况下，重新排序模板由项目的纯文本加上级联样式组成。如果您省略了模板，但仍然通过\
    \ *AllowReorder* 布尔属性启用重新排序，则会以灰色渲染项目文本，向用户提供有关正在进行的操作的反馈。\n\n## 重新排序和回发事件\n\n\
    *ReorderList* 控件可以配置为在每次拖放操作结束时回发。为避免整个页面刷新，您需要将 *ReorderList* 控件包装在 *UpdatePanel*\
    \ 控件中。如第 4 章所述，通过这种方式，您可以确保仅刷新列表控件的用户界面，而不是通过完整的回发更新整个页面。以下几行标记可以为我们实现这一点：\n\n\
    ```\n<asp:UpdatePanel runat=\"server\" ID=\"UpdatePanel1\">\n    <ContentTemplate>\n\
    \        ...\n        <!-- ReorderList goes here -->\n        ...\n    </ContentTemplate>\n\
    </asp:UpdatePanel>\n```\n\n为什么控件会自行回发？*ReorderList* 控件尝试持久化用户所做的更改，以便如果页面内部发生任何回发（例如，用户单击页面中另一个按钮引起的回发），通过拖放操作修改的\
    \ *ReorderList* 的内容将得以维护。请注意，事实上，在客户端所做的任何更改都应该在服务器上持久化；否则，它们将在第一次后续页面回发中丢失。\n\
    \n## 持久化重新排序的项目\n\n如果您运行一个包含 *ReorderList* 控件的页面，您会注意到在回发之后，任何移动的元素都会恢复到其原始位置。为什么会这样？在拖放操作结束时，*ReorderList*\
    \ 控件回发，在服务器上触发 *ItemReorder* 事件，并重建列表。列表是数据绑定的，因此除非您在绑定过程中更改某些内容，否则列表将按相同的旧顺序重新绑定回相同的记录集。\n\
    \n因此，托管 *ReorderList* 控件的页面应连接 *ItemReorder* 事件，并确保绑定到控件的数据源正确反映在客户端上生成的更改。*ItemReorder*\
    \ 事件具有以下签名：\n\n```\nvoid OnItemReorder(object sender, ReorderListItemReorderEventArgs\
    \ e)\n```\n\n在此事件处理程序中，您应该执行重新排序的实际工作——即，将项目从用于填充列表的数据源中的旧位置移动到新位置。具体如何操作取决于绑定机制。如果您选择使用数据源控件（例如\
    \ *ObjectDataSource*），您可以尝试对反映新顺序的给定字段（如果有的话）进行排序。如果您通过将 *IEnumerable* 对象分配给 *DataSource*\
    \ 属性来设置数据源，则可以检索并修改此对象以反映新顺序。例如，对于 *DataTable*，这意味着交换两行。\n\n> **注意** 如果设置了 *ReorderList*\
    \ 的 *SortOrderField* 属性，并且数据源可以按该字段排序，则 *ReorderList* 可以自动执行服务器端重新排序。此外，排序字段的类型必须是\
    \ *integer*。\n\n## TabContainer 控件\n\n多视图是大多数页面中的一个常见功能。它们将信息分组到选项卡中，让用户单击以仅显示可用信息的一部分。在\
    \ ASP.NET 2.0 中，*MultiView* 控件为此功能提供了一个有效的快捷方式。但它需要一个回发来在用户选择新选项卡时更新页面。在 ACT 中，*TabContainer*\
    \ 控件提供了多视图控件的 AJAX 版本。\n\n## TabContainer 控件概述\n\n*TabContainer* 控件由一个选项卡集合组成，每个选项卡由一个\
    \ *TabPanel* 类的实例表示。您可以以编程方式添加和删除面板，也可以以声明方式定义它们。\n\n## 控件的属性\n\n表 5-6 列出了控件支持的属性。\n\
    \n### 表 5-6 TabContainer 控件的属性\n\n| 属性 | 描述 |\n| --- | --- |\n| *ActiveTab* |\
    \ 返回对当前选定选项卡的引用。 |\n| *ActiveTabIndex* | 获取和设置选定选项卡的从零开始的索引。 |\n| *CssClass* |\
    \ 获取和设置用于设置控件样式的 CSS 类。 |\n| *Height* | 获取和设置选项卡的高度。属性的值表示为 *Unit* 值。此值不包括标题。\
    \ |\n| *OnClientActiveTabChanged* | 获取和设置当用户更改选择时在客户端执行的 JavaScript 代码。 |\n| *Scrollbars*\
    \ | 获取和设置所需滚动条支持。此属性默认设置为 *Auto*。可行的值来自 ASP.NET 2.0 的 *Scrollbars* 类型。 |\n| *Tabs*\
    \ | 返回定义控件用户界面的 *TabPanel* 对象集合。 |\n| *Width* | 获取和设置选项卡的宽度。属性的值表示为 *Unit* 值。\
    \ |\n\n此外，当所选选项卡更改时，控件会触发 *ActiveTabChanged* 事件。该事件仅是一个通知，所需的委托是 *EventHandler*。没有附加信息随事件一起传递。\n\
    \n## 选项卡面板的属性\n\n*TabPanel* 类表示容器中的单个选项卡。每个选项卡将其标题定义为纯文本或模板。同样，选项卡具有一个模板，让开发者可以指定其内容。最近的选项卡应在回发后保持选中状态。表\
    \ 5-7 列出了 *TabPanel* 类的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| *ContentTemplate*\
    \ | 设置选项卡的内容。 |\n| *Enabled* | 指示是否应显示该选项卡。属性的值可以在客户端更改。 |\n| *HeaderTemplate*\
    \ | 获取和设置用于定义选项卡标题的模板。 |\n| *HeaderText* | 获取和设置在选项卡标题中显示的文本。 |\n| *OnClientClick*\
    \ | 附加到选项卡客户端 *click* 事件的 JavaScript 代码。 |\n| *OnClientPopulated* | 当选项卡已完全填充时在客户端运行的\
    \ JavaScript 代码。 |\n| *OnClientPopulating* | 当选项卡将要被填充时在客户端运行的 JavaScript 代码。\
    \ |\n| *Scrollbars* | 获取和设置所需滚动条支持。此属性默认设置为 *Auto*。可行的值来自 ASP.NET 2.0 的 *Scrollbars*\
    \ 类型。 |\n\n您可以附加到某些客户端事件的 JavaScript 代码可以是嵌入在宿主页面中的函数的名称，也可以是 JavaScript 可执行代码的字符串。\n\
    \n## 使用 TabContainer 控件\n\n让我们考虑一个使用 *TabContainer* 控件的示例页面。您稍后会看到，选项卡容器所需的标记很简单。\n\
    \n## 配置 TabContainer 控件\n\n*TabContainer* 标记将其子标签映射到 *TabPanel* 对象的 *Tabs* 集合。您为每个所需的选项卡添加一个\
    \ `<TabPanel>` 标记，并根据需要配置它。下面是一个示例：\n\n```\n<act:TabContainer runat=\"server\"\
    \ ID=\"TabContainer1\">\n    <act:TabPanel runat=\"server\" ID=\"TabPanel1\" HeaderText=\"\
    Your Tab\">\n        <ContentTemplate>\n            <h3>Some text here</h3>\n\
    \        </ContentTemplate>\n    </act:TabPanel>\n    ...\n</act:TabContainer>\n\
    ```\n\n所有选项卡都被赋予相同的大小，您可以通过容器的 *Width* 和 *Height* 属性来控制大小设置。您设置的高度是指标签主体的高度，不包括标题。\n"
