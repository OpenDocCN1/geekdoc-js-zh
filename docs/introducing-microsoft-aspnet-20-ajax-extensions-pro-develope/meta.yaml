- md: "## Part II Adding AJAX Capabilities to a Site\n\nASP.NET 2.0 *Calendar* control\
    \ requires full-page postbacks, although you can find a number of good workarounds\
    \ for it–from wrapping it up in an updatable panel to using the hover-menu extender\
    \ we considered earlier.\n\nThe *Calendar* extender is the ultimate and, I believe,\
    \ definitive solution. Attached to a text box, it provides client-side date-picking\
    \ functionality with customizable date format and pop-up control. You can interact\
    \ with the calendar by clicking on a day, navigating to a month, or selecting\
    \ a particular link to set the current date. (See Figure 5-22.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_100_0.png)\n\
    \n**Figure 5-22** The *Calendar* extender in action\n\n```xml\n<asp:TextBox runat=\"\
    server\" ID=\"TextBox1\" />\n\n<act:CalendarExtender runat=\"server\" ID=\"CalendarExtender1\"\
    \n    TargetControlID=\"TextBox1\"\n    CssClass=\"MyCalendar\"\n    Format=\"\
    dd/MM/yyyy\" />\n```\n\nBy clicking on the title of the calendar, you can change\
    \ the view from days-per-month to months-per-year, and even years-per-decade.\
    \ The *Format* property allows you to select the final format of the date, which\
    \ will be inserted in the bound text box. Normally, the calendar pops up when\
    \ the companion text box gets the input focus. However, you can associate the\
    \ display of the calendar with the clicking of an element–for example, an image.\
    \ The *PopupButtonID* property gets and sets the ID of a control to show the calendar\
    \ popup when clicked.\n\n## The FilteredTextBox Extender\n\nThe *FilteredTextBox*\
    \ extender filters out some characters from the buffer of a given text box control.\
    \ It differs from a validation control in that it just prevents users from entering\
    \ invalid characters, whereas a validation control operates at a later time when\
    \ the user tabs out of the input field.\n\n```html\n<strong>How old are you?</strong>\n\
    <asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n```\n\n```xml\n<act:FilteredTextBoxExtender\
    \ ID=\"Filtered1\" runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"\
    Numbers\" />\n```\n\nThe preceding text box is expected to accept a number indicating\
    \ the age of the user. Clearly, it can accept only numbers. The extender ensures\
    \ that only numbers can be typed in the input field. It does that by adding a\
    \ piece of JavaScript code to the text box to filter out undesired characters.\n\
    \nThe extender supports a few properties, including FilterType, which determine\
    \ the filter applied to the input. The property can take any of the following\
    \ values: Numbers, UppercaseLetters, LowercaseLetters, and Custom. The effect\
    \ of the filter is obvious for the first three cases. When Custom is specified,\
    \ though, you also set the ValidChars property to a comma-separated string where\
    \ each item denotes a valid character. For example, the following code allows\
    \ users to enter only A and B characters regardless of the case:\n\n```xml\n<act:FilteredTextBoxExtender\
    \ ID=\"Filtered1\" runat=\"server\"\n    TargetControlID=\"TextBox1\"\n    FilterType=\"\
    Custom\"\n    ValidChars=\"A,a,B,b\" />\n```\n\nYou can't combine multiple filters\
    \ on the same text box. If you want to filter all but letters, you can't add two\
    \ FilteredTextBox extenders to the same control. Instead, you resort to a custom\
    \ filter where you specify in the ValidChars property all acceptable characters.\n\
    \n> **Important** Client-side filtering, as well as validation, is subject to\
    \ the action of some JavaScript code. This means that by deactivating JavaScript\
    \ on the client browser, any filtering or validation is subsequently disabled.\
    \ In any case, you should not blindly trust what's typed by a user in a text box\
    \ and, instead, apply proper filtering and validation on the server before you\
    \ use that data for critical operations.\n\n## The MaskedEdit Extender\n\nAdded\
    \ to a TextBox control, the MaskedEdit extender forces users to enter input according\
    \ to the specified mask. In addition, data is validated on the client according\
    \ to the data type chosen. To achieve the validation, a new validator control\
    \ is introduced—MaskedEditValidator—that verifies the input. The masked edit validator\
    \ is, in turn, associated with an instance of the masked edit extender:\n\n```xml\n\
    <asp:TextBox runat=\"server\" ID=\"TextBox1\" />\n```\n\n```xml\n<act:MaskedEditValidator\
    \ ID=\"MaskedEditValidator1\" runat=\"server\"\n    ControlExtender=\"MaskedEditExtender1\"\
    \n    ControlToValidate=\"TextBox1\"\n    IsValidEmpty=\"False\"\n    EmptyValueMessage=\"\
    Date is required\"\n    InvalidValueMessage=\"Date is invalid\"\n    TooltipMessage=\"\
    Input a Date\" />\n<act:MaskedEditExtender runat=\"server\" ID=\"MaskedEditExtender1\"\
    \n    TargetControlID=\"TextBox1\"\n    Mask=\"99/99/9999\"\n    MessageValidatorTip=\"\
    true\"\n    OnFocusCssClass=\"MaskedEditFocus\"\n    OnInvalidCssClass=\"MaskedEditError\"\
    \n    MaskType=\"Date\" />\n```\n\nFigure 5-23 shows the extender at work with\
    \ date and monetary values.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_102_0.png)\n\
    \nThe extender supports three different masks for most common and specialized\
    \ types: date, number, and time. The *MaskType* property sets the type of the\
    \ final data; the *Mask* property defines the required input mask.\n\n## The *NoBot*\
    \ Extender\n\nWeb applications such as blogs, forums, and portals are subject\
    \ to having their input forms automatically filled by robot applications (also\
    \ known as *bots*). For example, a bot can register as a user of the mail service\
    \ and use the portal to send spam. The techniques employed to ensure that humans\
    \ are filling an input form instead of a piece of smart software go under the\
    \ name of CAPTCHA, an acronym for *Completely Automated Public Turing test to\
    \ tell Computers and Humans Apart*. In practice, CAPTCHA is a challenge-response\
    \ test that requires the provision of additional information that must be figured\
    \ out on the fly. Figuring this out is nothing special for humans, but virtually\
    \ impossible for automated programs. The most popular example of CAPTCHA technique\
    \ is a distorted image that represents a number. In a variety of blog systems,\
    \ users encounter an additional input field to specify a number depicted within\
    \ a figure before their posts will be accepted.\n\nThe NoBot extender is a control\
    \ that attempts to apply anti-bot techniques to input forms. The extender might\
    \ not be as powerful as a distorted image with a number inside, but it has the\
    \ advantage of being completely invisible and hard to detect. All in all, the\
    \ NoBot extender’s usefulness is probably limited to sites with low traffic where\
    \ the main goal is stopping spam, and where it’s not a big deal if it doesn’t\
    \ achieve 100-percent effectiveness.\n\n## The NumericUpDown Extender\n\nAdded\
    \ to a TextBox control, the NumericUpDown extender adds a couple of arrow buttons\
    \ next to the control to let users increment and decrement the displayed value.\
    \ Note that increment and decrement apply to numeric input as well as any user-defined\
    \ enumeration.\n\n```html\n<strong>How old are you?</strong>\n<asp:TextBox ID=\"\
    TextBox1\" runat=\"server\" Width=\"100px\" />\n\n<act:NumericUpDownExtender ID=\"\
    UpDown1\" runat=\"server\"\n    Width=\"100\"\n    TargetControlID=\"TextBox1\"\
    \ />\n```\n\nYou should set the Width property on both the text box and the extender\
    \ to control the size of the input field. Note that the Width property on the\
    \ extender indicates the total width of the control including the arrow buttons.\
    \ (See Figure 5-24.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_103_0.png)\n\n\
    The default increment is a numeric +1 or -1. However, the RefValues property lets\
    \ you define a sequence of values to cycle through. The property accepts a string\
    \ where each value is separated by a semicolon (;) symbol.\n\n```xml\n<act:NumericUpDownExtender\
    \ ID=\"UpDown1\" runat=\"server\"\n    Width=\"100\"\n    RefValues=\"Sun;Mon;Tue;Wed;Thu;Fri;Sat\"\
    \n    TargetControlID=\"TextBox1\" />\n```\n\nThe extender can also use a Web\
    \ service to calculate the next or the previous value. In this case, you use *ServiceUpPath*\
    \ and *ServiceUpMethod* to locate the service and method for the *up* operation.\
    \ Likewise, you use *ServiceDownPath* and *ServiceDownMethod* for the *down* operation.\
    \ The service methods can receive an arbitrary value from the client through the\
    \ *Tag* property.\n\n> **Note** The sole use of the up-down extender is usually\
    \ not enough to guarantee a pleasant experience. The up-down extender, in fact,\
    \ doesn't force the text box to accept \"only\" the values generated by the up-down\
    \ process. So you could type words in a numeric text box with an associated up-down\
    \ extender. To avoid that, you might want to combine the up-down extender with\
    \ a filter extender and use the *TextBox's MaxLength* property to set the maximum\
    \ number of characters.\n\n## The *PasswordStrength* Extender\n\nEven the most\
    \ secure system can't do much to protect your server if authorized users employ\
    \ weak and easy-to-guess passwords. A number of best practices have been developed\
    \ lately that characterize a strong password. The *PasswordStrength* extender\
    \ attaches to a *TextBox* control and measures the strength of the current text\
    \ if it's being used as a password.\n\nFrom a syntax point of view, the extender\
    \ can be attached to any *TextBox* control; from a semantic perspective instead,\
    \ it makes sense only if applied to a *TextBox* control that is used for the entry\
    \ of a password. The scenario in which the *PasswordStrength* extender proves\
    \ useful is not a login page where the user enters his password to access a given\
    \ functionality. Rather, it is helpful in forms where users registers their credentials\
