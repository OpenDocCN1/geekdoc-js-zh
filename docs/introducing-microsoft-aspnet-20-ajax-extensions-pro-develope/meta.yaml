- img_proc: true
  md: '# Deploying ASP.NET AJAX Applications


    The simplest way to create an ASP.NET AJAX application is by choosing the Visual
    Studio 2005 project template. (See Figure 1-6.) Visual Studio adds to the project
    a *web.config* file that contains all settings required to run an ASP.NET AJAX
    application. In particular, the configuration file links the ASP.NET AJAX assembly
    to the project.


    If your ASP.NET AJAX application consumes Web services, you should ensure that
    these Web services—local to the application—have correctly installed and can find
    all of their required resources.


    > **Important** Not all configuration entries created in the default *web.config*
    file are required in all cases. You might want to remove those that you don''t
    need. In particular, you might want to remove HTTP handlers and HTTP modules that
    serve calls to Web services and page methods, respectively, if your application
    doesn''t place remote out-of-band calls directly from JavaScript. However, when
    you edit the web.config file pay a lot of attention and limit yourself to commenting
    out parts rather than deleting them. You might inadvertently remove an important
    setting that breaks the whole application.


    # Core Components


    The ASP.NET AJAX framework is made of a client and a server part. Applications
    use a client-side JavaScript library mostly to manage the page user interface,
    to call server-based components, and order partial page refreshes. Server components
    generate the response for the client and emit predefined client script that integrates
    and sometimes extends the client library. The server-side part of ASP.NET AJAX
    includes Web services, ad hoc controls, and the JavaScript Object Notation (JSON)
    infrastructure. (I discuss the JSON data interchange technology a bit later in
    this chapter.)


    # The Microsoft Client Library for AJAX


    The AJAX client library is made of a set of JavaScript (*.js*) files that are
    linked from client pages in case of need. These *.js* files are downloaded on
    each client that consumes ASP.NET AJAX pages. These files are transparent to ASP.NET
    developers, as they are embedded in the ASP.NET AJAX assembly.


    The client library provides object-oriented and cross-browser extensions to the
    JavaScript language such as classes, namespaces, inheritance, and data types.
    In addition, it defines a largely shrink-wrapped version of the .NET base class
    library that includes string builders, regular expressions, timers, and tracing.
    The key part of the ASP.NET AJAX client library is the networking layer that manages
    the complexity of making asynchronous calls over *XMLHttpRequest*. This layer
    allows the client page to communicate with Web services and Web pages through
    out-of-band calls.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Server-Based Components


    ASP.NET AJAX is an extension to ASP.NET, and ASP.NET is a server-side development
    platform. Hence, ASP.NET AJAX sports a number of server-based components, including
    Web services and controls, that offer a double benefit. On one end, you can program
    these components from the client and update the current page without a full refresh;
    on the other hand, though, the programming model remains unaltered for the most
    part. In this way, at least limited to core functionalities, the ASP.NET AJAX
    learning curve might be pleasantly short.


    Built-in Web services expose a handful of ASP.NET features to client pages, including
    user profiles, membership, and roles. Server controls look like classic ASP.NET
    server controls, except that they emit additional script code. The script code
    enriches the user''s experience with the control by optionally taking advantage
    of the facilities provided by the AJAX client library. Some key AJAX server controls
    you will work with are *UpdatePanel*, *UpdateProgress*, and *Timer*. I''ll cover
    them in Chapter 4.


    # The JSON Infrastructure


    The growing use of out-of-band calls in Web applications poses a new issue—moving
    more and more complex data around. It''s not a mere serialization issue for which
    the .NET Framework and other platform-specific frameworks have a ready-made solution.
    The serialization involved with out-of-band calls is not just cross-platform;
    it also involves distinct tiers and radically different tools and languages. With
    out-of-band calls, you move data from a client to a server and back. But the client
    is a browser (if not a mobile device), and JavaScript is the native format of
    data. The server is a Web server hosted on a variety of hardware/software platforms
    and running a specific Web application framework.


    JSON is the emerging technology for passing structured data across the Web. It
    is a data interchange format and is fully described at http://www.json.org. Relatively
    easy to read for humans and to parse and generate for machines, JSON describes
    data using two universal data structures—collections and array—that are supported
    in one way or another by most modern programming languages and class libraries.


    JSON is a text format that is completely language independent, although it relies
    heavily on a number of conventions inherited from the C family of languages.


    The JSON client infrastructure can serialize a JavaScript object to an interchange
    format and send it over the wire to a server-side receiver. The platform-specific
    receiver will parse the data stream to build a platform-specific object. Likewise,
    the JSON server infrastructure can take any platform-specific object and serialize
    to an interchange format. Back on the client, the data stream is promptly transformed
    in a JavaScript object. As far as the .NET Framework and ASP.NET are concerned,
    a bit of reflection is used to examine the internal structure of classes and create
    proper JavaScript wrappers.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Virtually all AJAX-based frameworks implement a JSON infrastructure. ASP.NET
    AJAX is no exception.


    > **Note** For a while, XML has been touted as the lingua franca of the Web because
    it is ideal and made-to-measure for developers and architects to package and exchange
    data in a totally cross-platform way. Today, you find out that JSON (a non-XML
    technology) is sold for the same task. Is there any difference? Both JSON and
    XML do the same work. XML is more complex, quirky in some respects, and general-purpose,
    and it is preferable to describe data to be styled using an XSLT style sheet for
    UI purposes. For raw data, JSON is a more light-weight format that is easier to
    read and parse for both humans and computers.


    # Conclusion


    Most attentive developers have been developing around interactive Web technologies
    since the late 1990s. Various technologies (for example, Microsoft Remote Scripting
    and open-source and commercial variations) have been developed without forming
    a critical mass of acceptance and use. Or perhaps the mass was big enough, but
    everyone was waiting for the spark of a killer application. Another factor that
    slowed down the adoption of more advanced client techniques was the lack of cross-browser
    support for them.


    Today, the situation is radically different from what it was only three or four
    years ago. Now about 90 percent of the available browsers support all the minimal
    requirements for implementing interactive Web applications, known as AJAX applications.
    In addition, the W3C is standardizing the *XMLHttpRequest* object, which is the
    necessary communication workhorse behind all existing platforms for AJAX. The
    next generation of Web applications will be based on a different mechanism: it
    is no longer, or not just, forms posted in a change of pages, but individual requests
    for data and dynamic updates to displayed pages.


    As a server technology aimed at the creation of Web pages, ASP.NET takes advantage
    of the opportunity for providing this much desired functionality. Script callbacks
    were the first Microsoft attempt to offer an API for building AJAX-style pages.
    Modeled after the classic postback event, callbacks are sometimes unnecessarily
    heavy and inflexible.


    An add-on to ASP.NET 2.0, Microsoft ASP.NET AJAX Extensions, shows the way ahead
    for AJAX applications as far as the ASP.NET platform is concerned. It integrates
    the AJAX lifestyle into the existing application model of ASP.NET, resulting in
    a familiar programming model with greatly improved and richer functionality.'
