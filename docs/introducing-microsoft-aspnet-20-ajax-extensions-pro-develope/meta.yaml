  md: "The server-side event handler will then just update the text in the text box.,\
    \ as shown in Figure 5-12.\n\n# The *ModalPopup* Extender\n\nThe *ModalPopup*\
    \ extender displays in a modal way any content associated with the control identified\
    \ by the *PopupControlID* property. The *TargetControlID* property in this case\
    \ refers to a clickable control:\n\n```\n<act:ModalPopupExtender ID=\"ModalPopupExtender1\"\
    \ runat=\"server\"\n        TargetControlID=\"LinkButton1\"\n        PopupControlID=\"\
    PopupContent\"\n        OkControlID=\"Button1\"\n        CancelControlID=\"Button2\"\
    >\n```\n\nNotice that the *ModalPopup* extender is fired by the *onclick* event\
    \ on the target control. It turns out, therefore, that the target control can\
    \ only be a control that supports clicking. The pop-up control doesn't have to\
    \ be a *Panel* control; generally, it can be any control. However, it will normally\
    \ be a control that contains a bunch of other controls—typically, a *Panel*.\n\
    \nIn the pop-up panel you can optionally identify an OK control and a *Cancel*\
    \ control. You set the ID of such controls (commonly, buttons) through the *OkControlID*\
    \ and *CancelControlID* properties. The pop-up behavior is clearly a client-side\
    \ action, so some JavaScript code might be required in response to the user's\
    \ clicking the OK or *Cancel* control. You use the *OnOkScript* property to specify\
    \ the JavaScript function to run in case the user clicks the OK button; you use\
    \ *OnCancelScript* otherwise.\n\nThe following markup shows the content of a sample\
    \ modal panel. Note that the *Panel* control should set its CSS *display* attribute\
    \ to *none* to make any contents invisible at first.\n\n```\n<asp:LinkButton ID=\"\
    LinkButton1\" runat=\"server\" text=\"Click me\" />\n<asp:Panel runat=\"server\"\
    \ ID=\"PopupContent\" BackColor=\"Yellow\">\n        <div style=\"margin:10px\"\
    >\n        Take note of this message and tell us if you strongly agree.\n    \
    \    <br /><br />\n        <asp:Button ID=\"Button1\" runat=\"server\" Text=\"\
    Yes\" width=\"40px\"  />\n        <asp:Button ID=\"Button2\" runat=\"server\"\
    \ Text=\"No\"  width=\"40px\" />\n        </div>\n</asp:Panel>\n```\n\nFigure\
    \ 5-13 shows the modal dialog box in action.\n\nA couple of graphical properties—*DropShadow*\
    \ and *BackgroundCssClass*—complete the extender. A Boolean property, *DropShadow*\
    \ indicates whether a drop shadow—as shown in Figure 5-13—should be rendered.\
    \ *BackgroundCssClass*, on the other hand, determines the style that is temporarily\
    \ applied to the underlying page:"
  merge: -1
  pgno: 86
- img_proc: true
  md: "![](img/db82dc55683fa403b8b16b76eb00cc2e_87_0.png)\n\nFigure 5-13 The *ModalPopup*\
    \ extender in action\n\n```\nmodalBackground {\n    background-color:Gray;\n \
    \   filter:alpha(opacity=70);\n    opacity:0.7;\n}\n```\n\nThe preceding style\
    \ grays out the page and makes it partially opaque for a nicer effect.\n\n# ##\
    \ The *PopupControl* Extender\n\nThe *PopupControl* extender can be attached to\
    \ any HTML element that fires the *onclick*, *onfocus*, or *onkeydown* events.\
    \ The ultimate goal of the extender is to display a pop-up window that shows additional\
    \ content, such as a calendar on a text box in which the user is expected to enter\
    \ a date. The contents of the pop-up panel are expressed through a *Panel* control,\
    \ and they can contain ASP.NET server controls as well as static text and HTML\
    \ elements:\n\n```\n<asp:textbox runat=\"server\" ID=\"InvoiceDateTextBox\" />\n\
    <asp:panel runat=\"server\" ID=\"Panel1\">\n    ...\n</asp:panel>\n```\n\n```\n\
    <act:PopupControlExtender ID=\"PopupExtender1\" runat=\"server\"\n    TargetControlID=\"\
    InvoiceDateTextBox\"\n    PopupControlID=\"Panel1\"\n    Position=\"Bottom\" />\n\
    ```\n\nThe *TargetControlID* property points to the control that triggers the\
    \ popup, whereas *PopupControlID* indicates the panel to display. The *Position*\
    \ property sets the position of the panel—either at the top, left, right, or bottom\
    \ of the parent control. (See Figure 5-14.)"
  merge: -1
  pgno: 87
- img_proc: true
  md: "![](img/db82dc55683fa403b8b16b76eb00cc2e_88_0.png)\n\nFigure 5-14  The *PopupControl*\
    \ extender in action\n\nAdditional properties are *OffsetX* and *OffsetY*, which\
    \ indicate the number of pixels to offset the popup from its position, as well\
    \ as *CommitProperty* and *CommitScript*, which can be used to assign values to\
    \ the target control.\n\nThe pop-up window will probably contain some interactive\
    \ controls and post back. For this reason, you might want to insert it within\
    \ an *UpdatePanel* control so that it can perform server-side tasks without refreshing\
    \ the whole page. Typically, the popup will be dismissed after a postback–for\
    \ example, the popup shown in Figure 5-14 is configured to be dismissed after\
    \ the user has selected a date. The calendar in this case fires the *SelectionChanged*\
    \ event on the server:\n\n```\nprotected void Calendar1_SelectionChanged(object\
    \ sender, EventArgs e)\n{\n    PopupExtender1.Commit(\n        Calendar1.SelectedDate.ToShortDateString());\n\
    }\n```\n\nThe *Commit* method sets the default property of the associated control\
    \ to the specified value. If you want to control which (nondefault) property is\
    \ set on the target when the popup is dismissed, use the *CommitProperty* property.\
    \ Likewise, you use the *CommitScript* property to indicate the Javascript function\
    \ to execute on the client after setting the result of the popup.\n\n> Warning\
    \  Note that an extender can’t be placed in a different *UpdatePanel* than the\
    \ control it extends. If the extended control is incorporated in an *UpdatePanel*,\
    \ the extender should also be placed in the updatable panel. If you miss this,\
    \ you get a runtime exception."
  merge: -1
  pgno: 88
- img_proc: true
  md: "# # User-Interface Extenders\n\nIn the family of ASP.NET AJAX extenders, the\
    \ biggest group is user-interface extenders—that is, special components that help\
    \ in the implementation of rich and user-friendly features.\n\n# ## The *AlwaysVisibleControl*\
    \ Extender\n\nThe *AlwaysVisibleControl* extender allows you to pin a given control,\
    \ or panel of controls, to one of the page corners so that it appears to float\
    \ over the background body as the page is scrolled or resized. You can use the\
    \ extender with virtually any ASP.NET control.\n\n```\n<span style=\"background-color:yellow;\"\
    \ runat=\"server\" id=\"Msg\">\n   Need a bit of dummy text? Look at\n   <b>http://www.loremipsum.net</b></span>\n\
    \n<act:AlwaysVisibleControlExtender ID=\"av1\" runat=\"server\"\n   TargetControlID=\"\
    Msg\"\n   HorizontalSide=\"Left\"\n   VerticalSide=\"Top\" />\n```\n\nYou set\
    \ the target position for the bound control using the *HorizontalSide* and *VerticalSide*\
    \ properties to define the corner of the page where the content should be docked.\
    \ The *HorizontalSide* property accepts *Left* and *Right* as values, whereas\
    \ *Top* and *Bottom* are feasible values for the *VerticalSide* property. You\
    \ can also control the offset from each border using the *VerticalOffset* and\
    \ *HorizontalOffset* properties. Finally, *ScrollEffectDuration* indicates how\
    \ many seconds the scrolling effect will last when the target control is repositioned.\
    \ (See Figure 5-15.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_89_0.png)\n\n\
    **Figure 5-15** The *AlwaysVisible* extender in action"
  merge: -1
  pgno: 89
- img_proc: true
  md: "Note that you can't add the extender to a plain HTML element. If you have an\
    \ HTML block to keep always visible (for example, the <span> tag in the previous\
    \ example), add the runat=server attribute and give it a unique ID.\n\n# The CascadingDropDown\
    \ Extender\n\nThe CascadingDropDown extender can be attached to a DropDownList\
    \ control to automatically populate it based on the current selection of one or\
    \ more parent DropDownList controls.\n\nThe CascadingDropDown extender is designed\
    \ to fit in a relatively common scenario in which the contents of one drop-down\
    \ list depend on the selection of another list. With this arrangement, you don't\
    \ need to transfer to the client the entire data set from which a child list can\
    \ select a subset of items to display in accordance with the selection on its\
    \ parent. For example, suppose you want the user to select a country and a city\
    \ in that country. To minimize data transfer and provide a friendlier user interface,\
    \ you might want to keep the city list empty until a selection is made on the\
    \ country list. When a country is selected, you get back to the server to download\
    \ the list of cities available for that country. The CascadingDropDown extender\
    \ simplifies this scenario by injecting some glue code into the client page and\
    \ also making some assumptions on the structure of your page code.\n\nAll the\
    \ logic about the contents of the set of DropDownList controls is expected to\
    \ reside on a Web service. The Web service, in turn, can use any suitable method\
    \ for storing and looking up any relevant data. The Web service, though, is somewhat\
    \ forced to use a contracted schema. In particular, it needs to have a method\
    \ with the following signature:\n\n```\n[WebMethod]\npublic CascadingDropDownNameValue[]\
    \ GetDropDownContents(\n    string knownCategoryValues, string category)\n{\n\
    \    ...\n}\n```\n\nThe name of the method can vary, of course. The CascadingDropDownNameValue\
    \ type is an internal collection type that is designed to contain the name/value\
    \ items to show in the drop-down list. Each drop-down list bound to the extender\
    \ belongs to a category:\n\n```\n<act:CascadingDropDown ID=\"CascadingDropDown1\"\
    \ runat=\"server\"\n    TargetControlID=\"DropDownList1\"\n    Category=\"Country\"\
    \n    PromptText=\"Please select a country\"\n    ServiceMethod=\"GetDropDownContentsPageMethod\"\
    \ />\n<act:CascadingDropDown ID=\"CascadingDropDown2\" runat=\"server\"\n    TargetControlID=\"\
    DropDownList2\"\n    Category=\"City\"\n    PromptText=\"Please select a city\"\
    \n    LoadingText=\"Please, wait ...\"\n    ServicePath=\"CityFinderService.asmx\"\
    \n```"
  merge: -1
  pgno: 90
- img_proc: true
  md: "```\nServiceMethod=\"GetDropDownContents\"\nParentControlID=\"DropDownList1\"\
    \ />\n```\n\nThe content of the *Category* property is any name that helps the\
    \ Web service method to understand what kind of data should be retrieved and the\
    \ meaning of the input arguments. The *PromptText* property sets any text that\
    \ you want to display in the drop-down list when no selection is currently made\
    \ and the control is typically disabled. The *LoadingText* property indicates\
    \ any text that has to be displayed while the drop-down list is being populated.\
    \ The *ServiceMethod* property indicates the method to call to fill in the list\
    \ control. If no *ServicePath* is specified, the method is assumed to be a page\
    \ method. Finally, *ParentControlID* creates a hierarchy and designates a list\
    \ to be the child of another list.\n\nEach time the selection changes in a parent\
    \ *DropDownList* control, the extender makes a call to the Web service and retrieves\
    \ the list of values for the next *DropDownList* in the hierarchy. If no selection\
    \ is currently made, the extender automatically disables the control. (See Figure\
    \ 5-16.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_91_0.png)\n\n# **The *DropShadow*\
    \ Extender**\n\nThe *DropShadow* extender is designed to add a drop shadow to\
    \ panel controls to make them look more professional. You can also set the opacity\
    \ and width of the shadow:\n\n```\n<asp:Panel runat=\"server\" ID=\"Panel1\">\n\
    \    <div style=\"padding:8px\">\n        <asp:TextBox ID=\"TextBox1\" runat=\"\
    server\" />\n    </div>\n</asp:Panel>\n```\n\n```\n<act:DropShadowExtender ID=\"\
    DropShadowExtender1\" runat=\"server\"\n    TargetControlID=\"Panel1\" Opacity=\"\
    .65\" Width=\"5\" Rounded=\"true\" />\n```\n\nThe *TargetControlID* property sets\
    \ the control that will be rendered with a drop shadow. This control should generally\
    \ be a *Panel*; however, as long as you don't set rounded corners, it can also\
    \ be any other ASP.NET control, such as a *TextBox*. You control the opacity of\
    \ the shadow through the *Opacity* property. Values for the property range from\
    \ *0.0* to *1.0*, where *0* (or *0.0*) means total transparency. Hence, the closer\
    \ the value is to *1* (or *1.0*) the darker the shadow will be.\n\nThe *Rounded*\
    \ Boolean property indicates whether the surrounding panel and the shadow should\
    \ have rounded corners. The default is *false*. Figure 5-17 shows the extender\
    \ in action."
  merge: -1
