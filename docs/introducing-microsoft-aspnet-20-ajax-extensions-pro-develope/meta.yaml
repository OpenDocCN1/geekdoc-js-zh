    \    filter:alpha(opacity=70);\n    opacity:0.7;\n}\n```\n\nThe preceding style\
    \ grays out the page and makes it partially opaque for a nicer effect.\n\n# ##\
    \ The *PopupControl* Extender\n\nThe *PopupControl* extender can be attached to\
    \ any HTML element that fires the *onclick*, *onfocus*, or *onkeydown* events.\
    \ The ultimate goal of the extender is to display a pop-up window that shows additional\
    \ content, such as a calendar on a text box in which the user is expected to enter\
    \ a date. The contents of the pop-up panel are expressed through a *Panel* control,\
    \ and they can contain ASP.NET server controls as well as static text and HTML\
    \ elements:\n\n```\n<asp:textbox runat=\"server\" ID=\"InvoiceDateTextBox\" />\n\
    <asp:panel runat=\"server\" ID=\"Panel1\">\n    ...\n</asp:panel>\n```\n\n```\n\
    <act:PopupControlExtender ID=\"PopupExtender1\" runat=\"server\"\n    TargetControlID=\"\
    InvoiceDateTextBox\"\n    PopupControlID=\"Panel1\"\n    Position=\"Bottom\" />\n\
    ```\n\nThe *TargetControlID* property points to the control that triggers the\
    \ popup, whereas *PopupControlID* indicates the panel to display. The *Position*\
    \ property sets the position of the panel—either at the top, left, right, or bottom\
    \ of the parent control. (See Figure 5-14.)"
  - "[PAGE 88]\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_88_0.png)\n\nFigure 5-14\
    \  The *PopupControl* extender in action\n\nAdditional properties are *OffsetX*\
    \ and *OffsetY*, which indicate the number of pixels to offset the popup from\
    \ its position, as well as *CommitProperty* and *CommitScript*, which can be used\
    \ to assign values to the target control.\n\nThe pop-up window will probably contain\
    \ some interactive controls and post back. For this reason, you might want to\
    \ insert it within an *UpdatePanel* control so that it can perform server-side\
    \ tasks without refreshing the whole page. Typically, the popup will be dismissed\
    \ after a postback–for example, the popup shown in Figure 5-14 is configured to\
    \ be dismissed after the user has selected a date. The calendar in this case fires\
    \ the *SelectionChanged* event on the server:\n\n```\nprotected void Calendar1_SelectionChanged(object\
    \ sender, EventArgs e)\n{\n    PopupExtender1.Commit(\n        Calendar1.SelectedDate.ToShortDateString());\n\
    }\n```\n\nThe *Commit* method sets the default property of the associated control\
    \ to the specified value. If you want to control which (nondefault) property is\
    \ set on the target when the popup is dismissed, use the *CommitProperty* property.\
    \ Likewise, you use the *CommitScript* property to indicate the Javascript function\
    \ to execute on the client after setting the result of the popup.\n\n> Warning\
    \  Note that an extender can’t be placed in a different *UpdatePanel* than the\
    \ control it extends. If the extended control is incorporated in an *UpdatePanel*,\
    \ the extender should also be placed in the updatable panel. If you miss this,\
    \ you get a runtime exception."
  - "[PAGE 89]\n\n# # User-Interface Extenders\n\nIn the family of ASP.NET AJAX extenders,\
    \ the biggest group is user-interface extenders—that is, special components that\
    \ help in the implementation of rich and user-friendly features.\n\n# ## The *AlwaysVisibleControl*\
    \ Extender\n\nThe *AlwaysVisibleControl* extender allows you to pin a given control,\
    \ or panel of controls, to one of the page corners so that it appears to float\
    \ over the background body as the page is scrolled or resized. You can use the\
    \ extender with virtually any ASP.NET control.\n\n```\n<span style=\"background-color:yellow;\"\
    \ runat=\"server\" id=\"Msg\">\n   Need a bit of dummy text? Look at\n   <b>http://www.loremipsum.net</b></span>\n\
    \n<act:AlwaysVisibleControlExtender ID=\"av1\" runat=\"server\"\n   TargetControlID=\"\
    Msg\"\n   HorizontalSide=\"Left\"\n   VerticalSide=\"Top\" />\n```\n\nYou set\
    \ the target position for the bound control using the *HorizontalSide* and *VerticalSide*\
    \ properties to define the corner of the page where the content should be docked.\
    \ The *HorizontalSide* property accepts *Left* and *Right* as values, whereas\
    \ *Top* and *Bottom* are feasible values for the *VerticalSide* property. You\
    \ can also control the offset from each border using the *VerticalOffset* and\
    \ *HorizontalOffset* properties. Finally, *ScrollEffectDuration* indicates how\
    \ many seconds the scrolling effect will last when the target control is repositioned.\
    \ (See Figure 5-15.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_89_0.png)\n\n\
    **Figure 5-15** The *AlwaysVisible* extender in action"
  - "[PAGE 90]\n\nNote that you can't add the extender to a plain HTML element. If\
    \ you have an HTML block to keep always visible (for example, the <span> tag in\
    \ the previous example), add the runat=server attribute and give it a unique ID.\n\
    \n# The CascadingDropDown Extender\n\nThe CascadingDropDown extender can be attached\
    \ to a DropDownList control to automatically populate it based on the current\
    \ selection of one or more parent DropDownList controls.\n\nThe CascadingDropDown\
    \ extender is designed to fit in a relatively common scenario in which the contents\
    \ of one drop-down list depend on the selection of another list. With this arrangement,\
    \ you don't need to transfer to the client the entire data set from which a child\
    \ list can select a subset of items to display in accordance with the selection\
    \ on its parent. For example, suppose you want the user to select a country and\
    \ a city in that country. To minimize data transfer and provide a friendlier user\
    \ interface, you might want to keep the city list empty until a selection is made\
    \ on the country list. When a country is selected, you get back to the server\
    \ to download the list of cities available for that country. The CascadingDropDown\
    \ extender simplifies this scenario by injecting some glue code into the client\
    \ page and also making some assumptions on the structure of your page code.\n\n\
    All the logic about the contents of the set of DropDownList controls is expected\
    \ to reside on a Web service. The Web service, in turn, can use any suitable method\
    \ for storing and looking up any relevant data. The Web service, though, is somewhat\
    \ forced to use a contracted schema. In particular, it needs to have a method\
    \ with the following signature:\n\n```\n[WebMethod]\npublic CascadingDropDownNameValue[]\
    \ GetDropDownContents(\n    string knownCategoryValues, string category)\n{\n\
    \    ...\n}\n```\n\nThe name of the method can vary, of course. The CascadingDropDownNameValue\
    \ type is an internal collection type that is designed to contain the name/value\
    \ items to show in the drop-down list. Each drop-down list bound to the extender\
    \ belongs to a category:\n\n```\n<act:CascadingDropDown ID=\"CascadingDropDown1\"\
    \ runat=\"server\"\n    TargetControlID=\"DropDownList1\"\n    Category=\"Country\"\
    \n    PromptText=\"Please select a country\"\n    ServiceMethod=\"GetDropDownContentsPageMethod\"\
    \ />\n<act:CascadingDropDown ID=\"CascadingDropDown2\" runat=\"server\"\n    TargetControlID=\"\
    DropDownList2\"\n    Category=\"City\"\n    PromptText=\"Please select a city\"\
    \n    LoadingText=\"Please, wait ...\"\n    ServicePath=\"CityFinderService.asmx\"\
    \n```"
- md: "The content of the *Category* property is any name that helps the Web service\
    \ method to understand what kind of data should be retrieved and the meaning of\
    \ the input arguments. The *PromptText* property sets any text that you want to\
    \ display in the drop-down list when no selection is currently made and the control\
    \ is typically disabled. The *LoadingText* property indicates any text that has\
    \ to be displayed while the drop-down list is being populated. The *ServiceMethod*\
    \ property indicates the method to call to fill in the list control. If no *ServicePath*\
    \ is specified, the method is assumed to be a page method. Finally, *ParentControlID*\
    \ creates a hierarchy and designates a list to be the child of another list.\n\
    \nEach time the selection changes in a parent *DropDownList* control, the extender\
    \ makes a call to the Web service and retrieves the list of values for the next\
    \ *DropDownList* in the hierarchy. If no selection is currently made, the extender\
    \ automatically disables the control. (See Figure 5-16.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_91_0.png)\n\
    \n## **The *DropShadow* Extender**\n\nThe *DropShadow* extender is designed to\
    \ add a drop shadow to panel controls to make them look more professional. You\
    \ can also set the opacity and width of the shadow:\n\n```xml\n<asp:Panel runat=\"\
    server\" ID=\"Panel1\">\n    <div style=\"padding:8px\">\n        <asp:TextBox\
    \ ID=\"TextBox1\" runat=\"server\" />\n    </div>\n</asp:Panel>\n```\n\n```xml\n\
    <act:DropShadowExtender ID=\"DropShadowExtender1\" runat=\"server\"\n    TargetControlID=\"\
    Panel1\" Opacity=\".65\" Width=\"5\" Rounded=\"true\" />\n```\n\nThe *TargetControlID*\
    \ property sets the control that will be rendered with a drop shadow. This control\
    \ should generally be a *Panel*; however, as long as you don't set rounded corners,\
    \ it can also be any other ASP.NET control, such as a *TextBox*. You control the\
    \ opacity of the shadow through the *Opacity* property. Values for the property\
    \ range from *0.0* to *1.0*, where *0* (or *0.0*) means total transparency. Hence,\
    \ the closer the value is to *1* (or *1.0*) the darker the shadow will be.\n\n\
    The *Rounded* Boolean property indicates whether the surrounding panel and the\
    \ shadow should have rounded corners. The default is *false*. Figure 5-17 shows\
    \ the extender in action.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_92_0.png)\n\
    \nFigure 5-17 The *DropShadow* extender in action\n\n## The *DynamicPopulate*\
    \ Extender\n\nThe *DynamicPopulate* extender is a sort of binder component that\
    \ replaces the markup of a given control with the markup returned by a Web service\
    \ method call. The extender can be seen as a shrink-wrapped and simplified version\
    \ of the *UpdatePanel* control that we discussed in Chapter 4. It captures a client\
    \ event and fires a remote call. The returned string is inserted in the page DOM\
    \ as the child of the target element. Here's an example:\n\n```xml\n<input type=\"\
    button\" id=\"Button1\" runat=\"server\" value=\"Refresh ...\" />\n<hr />\n<b>Last\
    \ updated:&nbsp;</b>\n<asp:Panel runat=\"server\" ID=\"Msg\" Style=\"padding:2px;height:2em;\"\
    \ />\n\n<act:DynamicPopulateExtender ID=\"DynamicPopulateExtender1\" runat=\"\
    server\"\n    TargetControlID=\"Msg\"\n    ClearContentsDuringUpdate=\"true\"\n\
    \    PopulateTriggerControlID=\"Button1\"\n    ServiceMethod=\"GetTimeOnServer\"\
    \n    UpdatingCssClass=\"updating\" />\n```\n\nWhen the user clicks on the specified\
    \ item--in this case, the button named *Button1*--the extender starts working.\
    \ It invokes the method *GetTimeOnServer* and replaces the subtree rooted in the\
    \ *Msg* control with its output. The method *GetTimeOnServer* is a Web service\
    \ method. You specify the URL to the service using the *ServicePath* property.\
    \ If this property is not set, the method is assumed to be a page method defined\
    \ either in the code file of the page or inline through a server `<script>` tag:\n\
    \n```csharp\n[WebMethod]\npublic string GetTimeOnServer(string contextKey)\n{\n\
    \    // Use contextKey to receive data from the client\n    // Get the output-it\
    \ can be HTML markup\n    return DateTime.UtcNow.ToString();\n}\n```\n\nClearContentsDuringUpdate\
    \ is a Boolean property that clears the contents of the target control during\
    \ the update. If you want to display a special style or a bitmap during the operation,\
    \ you set a CSS style through the UpdatingCssClass property. When creating such\
    \ a CSS class, bear in mind that you should ensure the target control has a minimum\
    \ height. (It must be explicitly set on panels.) You use the background-image\
    \ CSS attribute to set the image to display.\n\nNote that you can use any HTML\
    \ element to trigger the dynamic population of the target control. It doesn't\
    \ have to be a button control; and it doesn't have to be a submit button such\
    \ as LinkButton or Button. In this case, in fact, the page will post back and\
    \ you'll lose the benefit of the ASP.NET AJAX platform.\n\n> **Note** You can\
    \ also use a piece of JavaScript code to dynamically populate a given DOM element.\
    \ In this case, you set the CustomScript property to the name of a JavaScript\
    \ global function. Whether you use a custom script or a server method, you can\
    \ use the ContextKey property of the extender to pass an arbitrary string to the\
    \ code.\n\n## The PagingBulletedList Extender\n\nImagine a page that has to present\
    \ a long list of items to users—say, a list of customers. A common solution entails\
    \ using a pageable grid control. ASP.NET grids do a postback for each new page,\
    \ but by wrapping the grid in an UpdatePanel control you can brilliantly fix the\
    \ issue. What if you figure that a grid is far too heavy a control and that you\
    \ need to list items using a bullet-list control?\n\nThe ASP.NET BulletedList\
    \ control lists the contents of a data source using a variety of bullet-point\
    \ user interfaces. It doesn't provide paging, though. The PagingBulletedList extender\
    \ is a surprisingly simple and effective extender to page through the contents\
    \ of a BulletedList control. Let's consider the following code that populates\
    \ a bulleted list with no paging:\n\n```xml\n<asp:BulletedList ID=\"BulletedList1\"\
    \ runat=\"server\" DisplayMode=\"Text\"\n                  DataSourceID=\"ObjectDataSource1\"\
    \ DataTextField=\"CompanyName\" />\n\n<asp:ObjectDataSource ID=\"ObjectDataSource1\"\
    \ runat=\"server\"\n                     TypeName=\"IntroAjax.CustomerManager\"\
    \n                     SelectMethod=\"LoadAll\">\n</asp:ObjectDataSource>\n```\n\
    \nSuch a page will generate more than 80 bullet-point items—one for each customer\
    \ in the Northwind database. By extending the BulletedList control with the extender,\
    \ you get output like that shown in Figure 5-18.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_94_0.png)\n\
    \nFigure 5-18 The *PagingBulletedList* extender in action\n\nBut then add the\
    \ code for the extender:\n\n```xml\n<act:PagingBulletedListExtender ID=\"PagingBulletedList1\"\
    \ runat=\"server\"\n    TargetControlID=\"BulletedList1\"\n    ClientSort=\"true\"\
    \n    IndexSize=\"2\"\n    Separator=\" - \"\n    SelectIndexCssClass=\"selectIndex\"\
    \ />\n```\n\nThe extender organizes all bound items in pages and displays links\
    \ to each of them. Pages can contain a fixed number of items or all the items\
    \ that match an initial string. The *IndexSize* property indicates how many letters\
    \ in the displayed text should be used to create a page. If you set it to *1*,\
    \ you will have a pure alphabetical menu. If you set it to 2, you obtain a more\
    \ granular view, as each page contains only the items whose name matches the two-letter\
    \ initial. As an alternative to using *IndexSize*, you can use *MaxItemsPerPage*.\
    \ In this case, each page (except perhaps the last one) will have exactly the\
    \ specified number of items.\n\nThe *Separator* property indicates the character\
    \ used to separate menu items. *SelectIndexCssClass* and *UnselectIndexCssClass*\
    \ set the CSS classes for selected and unselected menu items. Finally, if *ClientSort*\
    \ is set to *true*, items are alphabetically sorted on the client before display.\n\
    \n## The *ResizableControl* Extender\n\nMost users would welcome pages where they\
    \ can dynamically resize certain HTML elements, such as panels of text or images.\
    \ The *ResizableControl* extender attaches to an element of a Web page and provides\
    \ a graphical handle for users to resize that element. Placed at the"
  mdcn: "\n*Category* 属性的内容是任何有助于 Web 服务方法理解应检索何种数据以及输入参数含义的名称。*PromptText* 属性设置当未进行选择且控件通常处于禁用状态时，希望在下拉列表中显示的任何文本。*LoadingText*\
    \ 属性指示在填充下拉列表期间必须显示的任何文本。*ServiceMethod* 属性指示要调用以填充列表控件的方法。如果未指定 *ServicePath*，则假定该方法是页面方法。最后，*ParentControlID*\
    \ 创建一个层次结构，并指定一个列表作为另一个列表的子项。\n\n每当父 *DropDownList* 控件中的选择发生变化时，扩展程序会调用 Web 服务并检索层次结构中下一个\
    \ *DropDownList* 的值列表。如果当前未进行选择，扩展程序会自动禁用该控件。（参见图 5-16。）\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_91_0.png)\n\
    \n## **The *DropShadow* 扩展程序**\n\n*DropShadow* 扩展程序旨在为面板控件添加阴影效果，使其看起来更专业。您还可以设置阴影的不透明度和宽度：\n\
    \n```xml\n<asp:Panel runat=\"server\" ID=\"Panel1\">\n    <div style=\"padding:8px\"\
    >\n        <asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n    </div>\n</asp:Panel>\n\
    ```\n\n```xml\n<act:DropShadowExtender ID=\"DropShadowExtender1\" runat=\"server\"\
    \n    TargetControlID=\"Panel1\" Opacity=\".65\" Width=\"5\" Rounded=\"true\"\
    \ />\n```\n\n*TargetControlID* 属性设置将被渲染阴影效果的控件。此控件通常应是一个 *Panel*；但是，只要不设置圆角，它也可以是任何其他\
    \ ASP.NET 控件，例如 *TextBox*。您通过 *Opacity* 属性控制阴影的不透明度。该属性的值范围从 *0.0* 到 *1.0*，其中\
    \ *0*（或 *0.0*）表示完全透明。因此，值越接近 *1*（或 *1.0*），阴影就越深。\n\n*Rounded* 布尔属性指示周围的面板和阴影是否应具有圆角。默认值为\
    \ *false*。图 5-17 显示了扩展程序的运行效果。\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_92_0.png)\n\
    \n图 5-17 *DropShadow* 扩展程序运行效果\n\n## *DynamicPopulate* 扩展程序\n\n*DynamicPopulate*\
    \ 扩展程序是一种绑定器组件，它用 Web 服务方法调用返回的标记替换给定控件的标记。该扩展程序可以看作是我们第 4 章讨论的 *UpdatePanel*\
    \ 控件的封装简化版本。它捕获客户端事件并触发远程调用。返回的字符串作为目标元素的子项插入到页面 DOM 中。以下是一个示例：\n\n```xml\n<input\
    \ type=\"button\" id=\"Button1\" runat=\"server\" value=\"Refresh ...\" />\n<hr\
    \ />\n<b>Last updated:&nbsp;</b>\n<asp:Panel runat=\"server\" ID=\"Msg\" Style=\"\
    padding:2px;height:2em;\" />\n\n<act:DynamicPopulateExtender ID=\"DynamicPopulateExtender1\"\
    \ runat=\"server\"\n    TargetControlID=\"Msg\"\n    ClearContentsDuringUpdate=\"\
    true\"\n    PopulateTriggerControlID=\"Button1\"\n    ServiceMethod=\"GetTimeOnServer\"\
    \n    UpdatingCssClass=\"updating\" />\n```\n\n当用户点击指定的项目时——在本例中，是名为 *Button1*\
    \ 的按钮——扩展程序开始工作。它调用 *GetTimeOnServer* 方法，并用其输出替换 *Msg* 控件为根的子树。*GetTimeOnServer*\
    \ 方法是一个 Web 服务方法。您使用 *ServicePath* 属性指定服务的 URL。如果未设置此属性，则假定该方法是页面代码文件中或通过服务器 `<script>`\
    \ 标签内联定义的页面方法：\n\n```csharp\n[WebMethod]\npublic string GetTimeOnServer(string\
    \ contextKey)\n{\n    // Use contextKey to receive data from the client\n    //\
    \ Get the output-it can be HTML markup\n    return DateTime.UtcNow.ToString();\n\
    }\n```\n\nClearContentsDuringUpdate 是一个布尔属性，它在更新期间清除目标控件的内容。如果您想在操作期间显示特殊样式或位图，可以通过\
    \ UpdatingCssClass 属性设置 CSS 样式。创建此类 CSS 类时，请记住应确保目标控件具有最小高度。（必须在面板上显式设置。）您使用 background-image\
    \ CSS 属性设置要显示的图像。\n\n请注意，您可以使用任何 HTML 元素来触发目标控件的动态填充。它不必是按钮控件；也不必是提交按钮，如 LinkButton\
    \ 或 Button。事实上，在这种情况下，页面将回发，您将失去 ASP.NET AJAX 平台的优势。\n\n> **注意** 您也可以使用一段 JavaScript\
    \ 代码来动态填充给定的 DOM 元素。在这种情况下，您将 CustomScript 属性设置为 JavaScript 全局函数的名称。无论您使用自定义脚本还是服务器方法，都可以使用扩展程序的\
    \ ContextKey 属性向代码传递任意字符串。\n\n## PagingBulletedList 扩展程序\n\n想象一个页面需要向用户展示一个很长的项目列表——比如，一个客户列表。常见的解决方案是使用可分页的网格控件。ASP.NET\
    \ 网格在每页加载时都会执行回发，但通过将网格包装在 UpdatePanel 控件中，您可以出色地解决这个问题。如果您觉得网格控件过于笨重，而需要使用项目符号列表控件来列出项目怎么办？\n\
    \nASP.NET BulletedList 控件使用各种项目符号用户界面列出数据源的内容。但它不提供分页功能。PagingBulletedList 扩展程序是一个简单高效得惊人的扩展程序，用于对\
    \ BulletedList 控件的内容进行分页。让我们考虑以下代码，它用无分页的方式填充项目符号列表：\n\n```xml\n<asp:BulletedList\
    \ ID=\"BulletedList1\" runat=\"server\" DisplayMode=\"Text\"\n               \
    \   DataSourceID=\"ObjectDataSource1\" DataTextField=\"CompanyName\" />\n\n<asp:ObjectDataSource\
    \ ID=\"ObjectDataSource1\" runat=\"server\"\n                     TypeName=\"\
