    ComfortASP.NET 框架将这项技术称为"选择性更新"，但最终它只是 ASP.NET AJAX 所称的"部分渲染"的另一种说法。（我们将在第 4 章介绍部分渲染。）


    使用 ComfortASP.NET 既轻松又快速。它只需要你调整 *web.config* 文件，为 ASP.NET 请求添加一个 HTTP 处理程序，并在你打算扩展
    AJAX 功能的每个页面上添加一个管理器控件。该管理器控件具有几个有趣的属性，如压缩、回发期间自动禁用表单以及请求超时处理。


    单独使用时，管理器控件作用于整个页面。该框架还包含一个 *PanelUpdater* 控件，用于有选择地更新页面的特定部分（面板）。你可以通过 *http://www.comfortasp.de/*
    了解更多关于 ComfortASP.NET 框架的信息。


    ## Telerik r.a.d.controls for ASP.NET 框架


    Telerik r.a.d.controls for ASP.NET 是一套多功能的用户界面（UI）组件套件，可与 Microsoft ASP.NET AJAX
    Extensions 完全互操作。该产品允许开发人员基于 ASP.NET AJAX 构建复杂且高度可定制的用户界面。这意味着 r.a.d.controls
    可以安全地在任何 ASP.NET AJAX 页面中使用，并与任何内置的 ASP.NET AJAX 控件顺畅交互。


    Telerik 目前正在开发 r.a.d.controls 套件的特殊更新版本，将充分利用 ASP.NET AJAX 框架的完整功能。该产品的新版本应该在你阅读本书时已经可用。在新特性中，你当然可以期待一个与
    Microsoft AJAX Client Library 约定一致的客户端对象模型，以及完全参与请求客户端生命周期的控件。（参见第 2 章。）此外，r.a.d.controls
    套件具有丰富的类型信息，类似于 .NET 类型描述符、便捷的组件可发现性和枚举功能，以及在部分页面更新时优化的资源管理和释放。


    除此之外，Telerik 还提供了自己的 AJAX 框架，称为 r.a.d.ajax。该产品的目的是消除构建 JavaScript 密集型 AJAX 应用程序的复杂性，使开发人员无需额外的学习曲线就能利用这项新技术。通过将
    AJAX 引擎和所有 surrounding 逻辑（包括脚本）封装到经典的 ASP.NET 服务器组件中，复杂性得以消除，这些组件可以在 Visual Studio
    2005 中使用便捷的设计器进行可视化配置。因此，开发人员只需编写常规的后回发应用程序，就能将它们转变为支持 AJAX 的应用程序，而无需编写任何 JavaScript
    或服务器端代码。


    Telerik 引擎完全保留了 ASP.NET 页面的生命周期，这对于应用程序的正常运行至关重要。视图状态、事件验证和客户端脚本也如同正常回发一样被保留。所有表单值都会自动发送到服务器进行处理。Telerik
    的框架基于一项正在申请专利的技术，该技术在内部管理 AJAX 回发。


    更多信息，请访问 *http://www.telerik.com*。


    ## ComponentArt Web.UI 框架


    ComponentArt 推出了 Web.UI for ASP.NET AJAX——这是第一个专为 ASP.NET AJAX 设计的控件套件。该库包含各种用于复杂
    Web 应用程序的高级用户界面控件，例如网格、拆分器、树视图和下拉列表。另一方面，*Callback* 控件提供了基本的 AJAX 功能。


    Web.UI 库不仅仅是与 ASP.NET AJAX 兼容或具备基本的互操作性。相反，它提供了与新的 Microsoft AJAX 框架的深度集成。你会发现大量服务器控件，它们
    enriched 了一个客户端对象模型，充分利用了 Microsoft AJAX Client Library 类型系统。（我们将在第 2 章介绍 Microsoft
    AJAX Client Library。）特别是，所有控件都继承自 *Sys.UI.Control* 客户端基类，并公开广泛的客户端方法和属性，可通过脚本调用和设置。控件参与客户端生命周期、通知事件，并与原生
    DOM 元素通信。


    所有 Web.UI 控件都能够自行或通过 ASP.NET AJAX 的 *UpdatePanel* 控件发起 AJAX 回发。（参见第 4 章。）例如，*TreeView*
    和 *Grid* 控件为按需加载或分页等功能实现了自己内置的轻量级回调机制。


    与 ASP.NET AJAX 的 *UpdatePanel* 类似，*CallBack* 组件可以选包装要更新的控件，并且可以绕过标准的页面生命周期以更快地执行服务器端逻辑，或者通过视图状态维护页面中包含的所有
    ASP.NET 控件的最新状态。*CallBack* 组件的客户端模型可用于从客户端执行服务器端代码。不过，*CallBack* 控件并未被任何其他 Web.UI
    控件内部使用。


    更多信息，请访问 *http://www.componentart.com*。


    ## Infragistics 的 NetAdvantage for ASP.NET AJAX


    NetAdvantage for ASP.NET——Infragistics 用于 ASP.NET 开发的旗舰产品——提供从树和菜单到分层网格，甚至是图表引擎的全套组件。Infragistics
    采用一种称为"嵌入式 AJAX"的技术，将 AJAX 功能直接构建到其控件中。通过将 AJAX 嵌入到控件本身，实现了使用单独的 AJAX 引擎或包装器所无法达到的性能水平。除了内置的
    AJAX 功能外，Infragistics 还提供了"WARP Panel"，可用于为任何控件赋予 AJAX 功能，方式类似于 Microsoft 的 UpdatePanel。


    AJAX 功能内置于 Infragistics 的 WebControls 中，开发人员只需知道如何设置属性即可开始使用 AJAX。Infragistics
    将这一概念称为"无接触 AJAX"。如果你想深入探索，Infragistics 提供了完整的客户端对象模型，包括 API 甚至事件模型，可以完全通过 JavaScript
    进行编程。NetAdvantage for ASP.NET 提供与 Microsoft ASP.NET AJAX Extensions 的互操作性——使你可以并排使用这两个强大的工具集。虽然当前与
    ASP.NET AJAX 的集成深度不如我们看到的 ComponentArt 的 Web.UI，但 Infragistics 通过他们自己的框架设法提供了大部分相同的功能。


    更多信息，请访问 *http://www.infragistics.com/ajax*。


    ## AJAX 框架分类


    正如你自己可以看到的，每个面向 AJAX 的框架都属于以下三个主要类别之一：


    - RPC 风格框架

    - 丰富的控件套件

    - AJAX 框架


    RPC 风格框架是 ASP.NET 库，它们仅仅提供通过 JavaScript 从客户端回调服务器代码的功能。ASP.NET Script Callbacks
    和 AjaxPro 当然具有这种能力。


    Telerik、ComponentArt 和 Infragistics 等流行供应商的商业产品提供了具有 AJAX 功能的控件套件。目前，它们与 ASP.NET
    AJAX 平台的集成程度不尽相同；然而，短期内它们将达到同一水平，并通过扩展不同级别的特性和功能来区分产品，一些完全遵守 Microsoft ASP.NET
    AJAX（ComponentArt），其他的则程度稍低。


    最后，将会有纯 AJAX 框架——即，一个使页面和应用程序能够实现 AJAX 的代码库。当然，ASP.NET AJAX Extensions 是最丰富、最强大的选择，它无疑是大多数开发人员应该遵循的标准。然而，存在一些优秀的框架（通常是开源框架）——如
    Anthem.NET 和 ComfortASP.NET——它们只是帮助你快速有效地构建 AJAX 页面。它们已经预见了你今天在 ASP.NET AJAX Extensions
    中发现的大部分功能。


    ## ASP.NET AJAX 亲身体验


    从架构上讲，ASP.NET AJAX 框架由两个不同的元素组成：一个客户端脚本库和一组为 ASP.NET 2.0 添加 AJAX 功能的服务器控件。客户端脚本库是用
    Javascript 编写的。

    '
