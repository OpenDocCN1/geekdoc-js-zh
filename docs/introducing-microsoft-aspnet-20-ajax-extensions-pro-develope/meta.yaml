    # Accordion Panes


    An accordion pane is a simple Web control named *AccordionPane*. It has a *Header*
    template property that you use to define the highlighting of the panel–that is,
    the portion of the panel that is visible also when it is collapsed. You can style
    the header using the settings in the CSS class defined by the *HeaderCssClass*
    property.


    Likewise, the content of the pane is defined by the *Content* template property
    and styled using the settings in the CSS class referenced by the *ContentCssClass*
    property.


    # The *Rating* Control


    The satisfaction of users is one of the key metrics used to determine the success
    of a Web site. And how do you recognize the satisfaction level of a user? Many
    Web sites kindly ask users to provide their feedback through ad hoc panels scattered
    through the pages. The most common user-interface pattern for user feedback is
    a ratings system. The Web site shows a fixed number of stars and lets users click
    those stars to rate a given feature (usually, more stars clicked indicates a higher
    level of satisfaction).'
