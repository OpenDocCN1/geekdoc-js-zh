    \n## The Switch to the Document Object Model\n\nMicrosoft has pioneered updatable\
    \ Web pages since the late 1990s. With Internet Explorer 4.0 (released back in\
    \ 1997), Microsoft introduced Dynamic HTML (DHTML), which is a powerful combination\
    \ of HTML, style sheets, and scripts that allows programmatic changes to any displayed\
    \ page. Several companies since then have worked out their own DHTML object model—often\
    \ referred to as the Browser Object Model (BOM). The W3C committee worked hard\
    \ to bring vendors to agree on an interoperable and language-neutral solution\
    \ for exposing Web pages through an updatable programming interface. The result\
    \ is the Document Object Model (DOM), as opposed to a browser-specific BOM.\n\n\
    The DOM is a platform-independent and language-neutral representation of the contents\
    \ of a Web page that scripts can access and use to modify the content, structure,\
    \ and style of the document.\n\nFor AJAX, it's all about exchanging data with\
    \ a remote server. But once the data is downloaded out-of-band on the client,\
    \ what can you do with that? The DOM provides an outlet for the data to flow into\
    \ the current page structure and update it.\n\n## Representation of a Document\n\
    \nThe DOM is a standard API exposed by the browser in which a displayed page has\
    \ a tree-based structure. Each node in the logical tree corresponds to an object.\
    \ On the other hand, the name \"Document Object Model\" hints at an object model\
    \ in the common interpretation of the object-oriented design terminology. A Web\
    \ page—the document—is modeled through objects. The model includes the structure\
    \ and behavior of a document. Each node in the logical tree is not static data;\
    \ rather, it is a live object with a known behavior and its own identity.\n\n\
    ## DOM Implementation\n\nThe W3C DOM consists of three levels that indicate, for\
    \ the browser, three different levels of adherence to the standard. For more information,\
    \ take a look at http://www.w3.org/DOM.\n\nThe DOM is made of nodes, and each\
    \ node is an object. For a Web page, each node maps to an object that represents\
    \ an HTML tag. The object, therefore, has properties and methods that can be applied\
    \ to an HTML tag. There are three fundamental operations you can accomplish on\
    \ a node: find the node (including related nodes such as children, parent, or\
    \ sibling nodes), create a node, and manipulate a node.\n\nIdentifying a particular\
    \ node is easy as long as the page author knows the ID of the corresponding element.\
    \ In this case, you use the following standard piece of code:\n\n```\nvar node\
    \ = document.getElementById(id);\n```\n\nIn particular, if there are multiple\
    \ elements sharing the same ID value, the method returns the first object in the\
    \ collection. This method is supported in the DOM Level 1 and upper levels. Another\
    \ interesting method to find elements is the following:\n\n```\nvar coll = document.getElementsByTagName(tagname);\n\
    ```\n\nThe method retrieves a collection of all objects based on the same HTML\
    \ tag. For example, the method retrieves a collection of all <div> or all <input>\
    \ tags in the page.\n\nRelated DOM objects are grouped in node lists. Each node\
    \ has a name, type, parent, and collection of children. A node also holds a reference\
    \ to its siblings and attributes. The following code snippet shows how to retrieve\
    \ the parent of a node and its previous sibling:\n\n```\nvar oParent = oNode.parentNode\n\
