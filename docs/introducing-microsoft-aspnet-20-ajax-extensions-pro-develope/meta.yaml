  md: "# # The *Rating* Control in Action\n\nThe following code demonstrates the usage\
    \ of the *Rating* control:\n\n```\n<h2>Rate this item:</h2>\n<div>\n    <act:Rating\
    \ ID=\"Rating1\" runat=\"server\"\n        CurrentRating=\"3\"\n        MaxRating=\"\
    10\"\n        StarCssClass=\"ratingStar\"\n        WaitingStarCssClass=\"savedRatingStar\"\
    \n        FilledStarCssClass=\"filledRatingStar\"\n        EmptyStarCssClass=\"\
    emptyRatingStar\"\n        OnChanged=\"Rating_Changed\" />\n</div>\n```\n\nThe\
    \ *MaxRating* property determines the number of stars to render. Of these, the\
    \ first stars (or the last ones, depending on the direction) up to the value specified\
    \ by *CurrentRating* are styled using the class name specified by *FilledStarCssClass*.\
    \ The remaining stars are styled using the attributes set by *EmptyStarCssClass*.\n\
    \nSpecifying valid CSS class names is key. If you omit, say, the empty-star style,\
    \ the corresponding `<span>` tag will be rendered as is, without any graphical\
    \ adjustments. Because the `<span>` tag is set to the empty string, no visible\
    \ output will be generated.\n\n# # The Eventing Model\n\nThe *Rating* control\
    \ injects into the client browser a piece of script code that does two main things.\
    \ First, it captures mouse movements over the bounding box of the control. Second,\
    \ it handles the user's clicking.\n\nAs the user moves the mouse over the unselected\
    \ stars, the script code automatically toggles the class name of the underlying\
    \ `<span>` tag to give you an idea of the interface if you select the given number\
    \ of stars.\n\nTo change the current value, you just click on the star that represents\
    \ the new value. For example, in an rating system with five stars, you click on\
    \ the fourth star to set a rating of 4. When this happens, the *Rating* control\
    \ makes an out-of-band call to the server and raises the *Changed* event:\n\n\
    ```\nprotected void Rating_Changed(object sender, RatingEventArgs e)\n{\n    //\
    \ Perform any significant server-side action\n    // such as storing the new value\
    \ to a database\n}\n```\n\nThe *RatingEventArgs* class contains three main properties:\
    \ *Tag*, *Value*, and *CallbackResult*. *Tag* is a cargo property used to carry\
    \ any custom string from the client to the server. *Value* indicates the currently\
    \ selected value in the control. *CallbackResult*, on the other hand, is a string"
