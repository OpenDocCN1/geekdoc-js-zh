    user profiles, membership, and roles. Server controls look like classic ASP.NET
    server controls, except that they emit additional script code. The script code
    enriches the user''s experience with the control by optionally taking advantage
    of the facilities provided by the AJAX client library. Some key AJAX server controls
    you will work with are *UpdatePanel*, *UpdateProgress*, and *Timer*. I''ll cover
    them in Chapter 4.


    # The JSON Infrastructure


    The growing use of out-of-band calls in Web applications poses a new issue—moving
    more and more complex data around. It''s not a mere serialization issue for which
    the .NET Framework and other platform-specific frameworks have a ready-made solution.
    The serialization involved with out-of-band calls is not just cross-platform;
    it also involves distinct tiers and radically different tools and languages. With
    out-of-band calls, you move data from a client to a server and back. But the client
    is a browser (if not a mobile device), and JavaScript is the native format of
    data. The server is a Web server hosted on a variety of hardware/software platforms
    and running a specific Web application framework.


    JSON is the emerging technology for passing structured data across the Web. It
    is a data interchange format and is fully described at http://www.json.org. Relatively
    easy to read for humans and to parse and generate for machines, JSON describes
    data using two universal data structures—collections and array—that are supported
    in one way or another by most modern programming languages and class libraries.


    JSON is a text format that is completely language independent, although it relies
    heavily on a number of conventions inherited from the C family of languages.


    The JSON client infrastructure can serialize a JavaScript object to an interchange
    format and send it over the wire to a server-side receiver. The platform-specific
    receiver will parse the data stream to build a platform-specific object. Likewise,
    the JSON server infrastructure can take any platform-specific object and serialize
    to an interchange format. Back on the client, the data stream is promptly transformed
    in a JavaScript object. As far as the .NET Framework and ASP.NET are concerned,
    a bit of reflection is used to examine the internal structure of classes and create
    proper JavaScript wrappers.'
  - '[PAGE 44]


    Virtually all AJAX-based frameworks implement a JSON infrastructure. ASP.NET AJAX
    is no exception.


    > **Note** For a while, XML has been touted as the lingua franca of the Web because
    it is ideal and made-to-measure for developers and architects to package and exchange
    data in a totally cross-platform way. Today, you find out that JSON (a non-XML
    technology) is sold for the same task. Is there any difference? Both JSON and
    XML do the same work. XML is more complex, quirky in some respects, and general-purpose,
    and it is preferable to describe data to be styled using an XSLT style sheet for
    UI purposes. For raw data, JSON is a more light-weight format that is easier to
    read and parse for both humans and computers.


    # Conclusion


    Most attentive developers have been developing around interactive Web technologies
    since the late 1990s. Various technologies (for example, Microsoft Remote Scripting
    and open-source and commercial variations) have been developed without forming
    a critical mass of acceptance and use. Or perhaps the mass was big enough, but
    everyone was waiting for the spark of a killer application. Another factor that
    slowed down the adoption of more advanced client techniques was the lack of cross-browser
    support for them.


    Today, the situation is radically different from what it was only three or four
    years ago. Now about 90 percent of the available browsers support all the minimal
    requirements for implementing interactive Web applications, known as AJAX applications.
    In addition, the W3C is standardizing the *XMLHttpRequest* object, which is the
    necessary communication workhorse behind all existing platforms for AJAX. The
    next generation of Web applications will be based on a different mechanism: it
    is no longer, or not just, forms posted in a change of pages, but individual requests
    for data and dynamic updates to displayed pages.


    As a server technology aimed at the creation of Web pages, ASP.NET takes advantage
    of the opportunity for providing this much desired functionality. Script callbacks
    were the first Microsoft attempt to offer an API for building AJAX-style pages.
    Modeled after the classic postback event, callbacks are sometimes unnecessarily
    heavy and inflexible.


    An add-on to ASP.NET 2.0, Microsoft ASP.NET AJAX Extensions, shows the way ahead
    for AJAX applications as far as the ASP.NET platform is concerned. It integrates
    the AJAX lifestyle into the existing application model of ASP.NET, resulting in
    a familiar programming model with greatly improved and richer functionality.'
- md: ' Chapter 5

    The AJAX Control Toolkit


    In this chapter:

    - Extender Controls

    - Introducing the AJAX Control Toolkit

    - The *Accordion* Control

    - The *Rating* Control

    - The *ReorderList* Control

    - The *TabContainer* Control

    - AJAX Control Toolkit Extenders

    - Conclusion


    Although ASP.NET AJAX is a framework designed to bring more programming power
    to the Web client, it happens to be mostly used by server developers—for example,
    ASP.NET developers or, at least, Web developers with strong server-side skills.
    Unfortunately, for the time being, there''s no way to add rich capabilities and
    functionalities to the Web client other than by crafting good and tricky JavaScript
    code.


    ASP.NET AJAX takes up the challenge and provides two ways for developers to build
    rich Web applications using a server-centric development approach. As we discussed
    in Chapter 4, "Partial Page Rendering," developers can refresh specific regions
    of the page using partial rendering instead of normal ASP.NET postbacks. To create
    such regions, you just use a particular set of server controls—the most important
    of which is the *UpdatePanel* control.


    In addition to partial rendering, developers can use *control extenders* to add
    a predefined client-side behavior to new and existing ASP.NET controls. A client-side
    behavior is a block of JavaScript code that adds a new capability to the markup
    generated by a given ASP.NET control. An extender is basically a server control
    that emits proper script code—the client behavior—to enhance how a given ASP.NET
    control behaves on the client. An extender is not simply a custom control derived
    from an existing control. Rather, it represents a general behavior—such as auto-completion,
    focus management, generation of popups, and draggability—that can be declaratively
    applied to various target control types. For example, a special behavior can be
    applied to any focused control—be it a *TextBox*, *Button*, or *CheckBox* control.


    ASP.NET AJAX Extensions 1.0 simply delivers the base class for extender controls.
    No concrete extender controls are provided with the binaries. The online documentation
    provides some good tutorials on how to build extenders. You can find one at http://ajax.asp.net/docs/tutorials/ExtenderControlTutorial1.aspx.
    A fair number of sample extenders and additional rich client controls are provided
    through a separate download—the AJAX Control Toolkit (ACT).


    In this chapter, I''ll first review the syntax and semantics of control extenders
    and then take you on a tour of the major components in the ACT.


    ## Extender Controls


    ASP.NET pages are made of server controls. ASP.NET comes with a fairly rich collection
    of built-in controls. In addition, plenty of custom controls are available for
    developers from third-party vendors, from community projects, and even from contributions
    by volunteers. If you need a text box with a set of features that the ASP.NET
    control can''t provide (for example, a numeric text box), you typically write
    one yourself or buy a new specialized control that extends the original control
    and adds the desired behavior. Object orientation, of course, encourages this
    approach.


    However, it''s rare that you need to write a completely new control yourself.
    More often, your control will derive from an existing ASP.NET control base class.
    Blindly using inheritance for building specialized versions of controls might
    not be a wise choice, though. Even in relatively small projects, in fact, it can
    lead straight to a proliferation of controls. For example, you can end up with
    a regular text box, plus a numeric text box, a filtered text box, a text box that
    changes its style when focused, a text box that displays a prompt when left empty,
    and so on. On the other hand, merging all these behaviors into a single super
    *TextBox* control might not be wise either. In this case, the resulting code will
    be literally full of branches, logical conditions, and properties to check. For
    just a simple extra feature, you would load a huge control. There has to be a
    different approach. Enter extender controls.


    ### What Is an Extender, Anyway?


    First and foremost, an extender control is a server control itself. It represents
    a logical behavior that can be attached to one or more control types to extend
    their base capabilities.


    ### Formalizing the Concept of a "Behavior"


    Imagine you want only the text boxes in a given input form to change their style
    when focused. If you create a new control, say *FocusedTextBox*, you''re fine.
    What if, instead, you want the same behavior from buttons, check boxes, and drop-down
    lists? You should create a bunch of new controls—all of which will extend the
    target controls with the same logical behavior. Extender controls are just a formal
    way to define such a behavior.


    > **Note** Virtually all behaviors require the injection of some script code in
    the client page. For this reason, extenders are naturally associated with ASP.NET
    AJAX. From a technology standpoint, on the other hand, ASP.NET AJAX and extenders
    are independent concepts. You could develop extenders for ASP.NET 1.1 and ASP.NET
    2.0 that work without ASP.NET AJAX Extensions. However, ASP.NET AJAX Extensions
    provides some interesting facilities for writers of extender controls—specifically,
    base classes and, more importantly, the Microsoft AJAX library for developing
    JavaScript functionalities more comfortably.


    A typical extender control is made of a set of properties and one or more JavaScript
    files that, all together, define the expected behavior of the target control in
    the browser. The ASP.NET developer adds extenders declaratively to a server page
    and configures properties to obtain the desired behavior.


    Next, when the extender renders out, it emits proper script code in the client
    page. This script code typically registers handlers for client-side events and
    modifies the Document Object Model (DOM) of the markup elements it is associated
    with. As a result, the original control looks and behaves in a slightly different
    manner while its programming interface remains intact.


    To some extent, the concept of a "behavior" is similar to a theme. The theme is
    used to change the control''s look and feel. Where the behavior and theme differ,
    however, is that the behavior might change some visual aspects of the control,
    but it is not limited to graphical attributes. It can alter the structure of the
    control by accessing the client DOM, add event handlers, and even expose a true
    object model with properties and methods.


    ### Examining a Sample Extender


    To better understand the goals and characteristics of AJAX extenders, let''s briefly
    consider the behavior encapsulated by one of the extenders contained in the ACT—the
    *TextBoxWatermark* extender.


    A text box watermark is a string of text that is displayed in an empty text box
    as a guide to the user. This help text is stripped off when the text box is submitted
    and is automatically removed as the user starts typing in the field. Likewise,
    it is automatically re-inserted when the user wipes out any text in the text box.


    The watermark behavior hooks up three HTML events: *onfocus*, *onblur*, and *onkeypress*.
    In its initialization stage, it also sets a new style and default text for the
    target text box if the body of the field is empty. When the text box gets the
    input focus, the event handler promptly removes the watermark text and restores
    the original style. As the user types, the handler for *onkeypress* ensures that
    the current text box is watermarked. Finally, when the input field loses the focus—the
    *onblur* event—the handler sets the watermark back if the content of the field
    is the empty string.


    To associate this behavior with an ASP.NET *TextBox*, you use the extender. Alternatively,
    if you feel comfortable with ASP.NET control development and JavaScript, you can
    use a client-side code fragment to achieve the same results.'
  mdcn: "\n 第5章\nAJAX 控件工具包\n\n本章内容：\n- 扩展器控件\n- AJAX 控件工具包简介\n- *Accordion* 控件\n\
    - *Rating* 控件\n- *ReorderList* 控件\n- *TabContainer* 控件\n- AJAX 控件工具包扩展器\n- 总结\n\
    \n尽管 ASP.NET AJAX 是一个旨在为 Web 客户端提供更强大编程能力的框架，但它主要被服务端开发者使用——例如 ASP.NET 开发者，或者至少是具有较强服务端技能的\
    \ Web 开发者。遗憾的是，目前要为 Web 客户端添加丰富的功能和能力，除了编写精妙而复杂的 JavaScript 代码外，别无他法。\n\nASP.NET\
    \ AJAX 迎难而上，为开发者提供了两种以服务端为中心的开发方式来构建丰富的 Web 应用程序。正如我们在第4章\"部分页面渲染\"中所讨论的，开发者可以使用部分渲染（而非普通的\
    \ ASP.NET 回发）来刷新页面的特定区域。要创建这样的区域，只需使用一组特定的服务器控件——其中最重要的是 *UpdatePanel* 控件。\n\n\
    除了部分渲染之外，开发者还可以使用*控件扩展器*为新的和现有的 ASP.NET 控件添加预定义的客户端行为。客户端行为是一段 JavaScript 代码，它为给定\
    \ ASP.NET 控件生成的标记添加新功能。扩展器本质上是一个服务器控件，它发出适当的脚本代码——即客户端行为——以增强给定 ASP.NET 控件在客户端的表现方式。扩展器不仅仅是一个从现有控件派生的自定义控件，它代表了一种通用行为——例如自动完成、焦点管理、弹出窗口生成和拖拽功能——可以以声明方式应用于各种目标控件类型。例如，一个特殊的行为可以应用于任何获得焦点的控件——无论是\
    \ *TextBox*、*Button* 还是 *CheckBox* 控件。\n\nASP.NET AJAX Extensions 1.0 仅提供了扩展器控件的基类。二进制文件中不包含任何具体的扩展器控件。在线文档提供了一些关于如何构建扩展器的优秀教程。你可以在\
    \ http://ajax.asp.net/docs/tutorials/ExtenderControlTutorial1.aspx 找到其中一篇。通过单独的下载包——AJAX\
    \ 控件工具包（ACT），提供了相当数量的示例扩展器和额外的富客户端控件。\n\n在本章中，我将首先回顾控件扩展器的语法和语义，然后带你浏览 ACT 中的主要组件。\n\
    \n## 扩展器控件\n\nASP.NET 页面由服务器控件组成。ASP.NET 自带了相当丰富的内置控件集合。此外，第三方供应商、社区项目乃至志愿者的贡献也为开发者提供了大量的自定义控件。如果你需要一个具有\
    \ ASP.NET 控件无法提供的特定功能集的文本框（例如数字文本框），通常需要自己编写一个，或者购买一个新的专用控件来扩展原始控件并添加所需的行为。面向对象的设计当然鼓励这种做法。\n\
    \n然而，很少需要从头编写一个全新的控件。更多情况下，你的控件会从现有的 ASP.NET 控件基类派生。不过，盲目使用继承来构建控件的专用版本可能并不是明智的选择。事实上，即使在相对较小的项目中，这也可能直接导致控件的激增。例如，你最终可能拥有一个普通文本框，加上一个数字文本框、一个过滤文本框、一个聚焦时改变样式的文本框、一个留空时显示提示的文本框，等等。另一方面，将所有这些行为合并到一个超级\
    \ *TextBox* 控件中也未必明智。在这种情况下，代码中将充斥着各种分支、逻辑条件和需要检查的属性。仅仅为了一个简单的额外功能，你就要加载一个庞大的控件。一定有其他的方法。这就是扩展器控件的用武之地。\n\
    \n### 扩展器到底是什么？\n\n首先，扩展器控件本身就是一个服务器控件。它代表一种可以附加到一个或多个控件类型上以扩展其基本能力的逻辑行为。\n\n\
    ### 形式化\"行为\"的概念\n\n假设你只想让给定输入表单中的文本框在聚焦时改变样式。如果你创建一个新控件，比如 *FocusedTextBox*，这没问题。但如果你希望按钮、复选框和下拉列表也具有相同的行为呢？你需要创建一堆新控件——所有这些控件都以相同的逻辑行为扩展目标控件。扩展器控件正是定义此类行为的规范化方式。\n\
    \n> **注意** 几乎所有行为都需要在客户端页面中注入一些脚本代码。因此，扩展器天然与 ASP.NET AJAX 相关联。但从技术角度来看，ASP.NET\
    \ AJAX 和扩展器是相互独立的概念。你可以为 ASP.NET 1.1 和 ASP.NET 2.0 开发扩展器，使其在没有 ASP.NET AJAX Extensions\
    \ 的情况下也能工作。不过，ASP.NET AJAX Extensions 为扩展器控件的编写者提供了一些有趣的便利设施——具体来说是基类，更重要的是用于更方便地开发\
    \ JavaScript 功能的 Microsoft AJAX 库。\n\n一个典型的扩展器控件由一组属性和一个或多个 JavaScript 文件组成，它们共同定义了目标控件在浏览器中的预期行为。ASP.NET\
    \ 开发者以声明方式将扩展器添加到服务器页面，并配置属性以获得所需的行为。\n\n接下来，当扩展器渲染输出时，它会在客户端页面中发出适当的脚本代码。这段脚本代码通常注册客户端事件处理程序，并修改与其关联的标记元素的文档对象模型（DOM）。因此，原始控件的外观和行为会略有不同，但其编程接口保持不变。\n\
    \n在某种程度上，\"行为\"的概念类似于主题。主题用于改变控件的外观和感觉。然而，行为与主题的区别在于，行为可能改变控件的某些视觉方面，但并不局限于图形属性。它可以通过访问客户端\
    \ DOM 来改变控件的结构，添加事件处理程序，甚至暴露具有属性和方法的真正对象模型。\n\n### 分析一个示例扩展器\n\n为了更好地理解 AJAX 扩展器的目标和特性，让我们简要了解一下\
    \ ACT 中某个扩展器所封装的行为——*TextBoxWatermark* 扩展器。\n\n文本框水印是在空文本框中显示的一段提示文字，用于引导用户。当文本框被提交时，该帮助文本会被移除；当用户开始在输入框中输入时，它也会自动移除。同样，当用户清除文本框中的所有文本时，它会自动重新插入。\n\
    \n水印行为钩挂了三个 HTML 事件：*onfocus*、*onblur* 和 *onkeypress*。在初始化阶段，如果文本框内容为空，它还会为目标文本框设置新的样式和默认文本。当文本框获得输入焦点时，事件处理程序会立即移除水印文本并恢复原始样式。当用户输入时，*onkeypress*\
    \ 的处理程序确保当前文本框保持水印状态。最后，当输入框失去焦点——即 *onblur* 事件触发时——如果内容为空字符串，处理程序会重新设置水印。\n\n\
    要将此行为与 ASP.NET *TextBox* 关联，你可以使用扩展器。或者，如果你对 ASP.NET 控件开发和 JavaScript 比较熟悉，也可以使用客户端代码片段来达到相同的效果。\n"
