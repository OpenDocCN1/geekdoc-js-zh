    \n与 ASP.NET 脚本回调 API 相比，AjaxPro 有一些关键优势。它使用属性来标记可以从客户端调用的服务器方法。这意味着在定义可从客户端调用的服务器公共接口时，你拥有最大的灵活性。特别是，你不必更改代码流程或添加新的临时方法来仅仅满足所要求的编程接口。\n\
