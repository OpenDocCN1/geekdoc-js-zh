  md: '> **Note** The *ReorderList* can automatically perform server-side reorders
    if its *SortOrderField* property is set and if the data source can be sorted on
    that field. In addition, the type of the sort field must be *integer*.


    # The **TabContainer** Control


    Multiple views are a common feature in most pages. They group information in tabs
    and let users click to display only a portion of the information available. In
    ASP.NET 2.0, the *MultiView* control provides an effective shortcut to this feature.
    But it requires a postback to update the page when the user selects a new tab.
    In the ACT, the *TabContainer* control provides an AJAX version of the multiview
    control.


    # Generalities of the **TabContainer** Control


    The *TabContainer* control is made of a collection of tabs, each of which is represented
    by an instance of the *TabPanel* class. You can add and remove panels programmatically,
    as well as define them declaratively.


    # Properties of the Control


    Table 5-6 lists the properties supported by the control.


    # Table 5-6 Properties of the **TabContainer** Control


    | Property | Description |

    | --- | --- |

    | *ActiveTab* | Returns a reference to the currently selected tab. |

    | *ActiveTabIndex* | Gets and sets the 0-based index of the selected tab. |

    | *CssClass* | Gets and sets the CSS class to use to style the control. |

    | *Height* | Gets and sets the height of the tabs. The value of the property is
    expressed as a *Unit* value. This value doesn''t include headers. |

    | *OnClientActiveTabChanged* | Gets and sets the JavaScript code to be executed
    on the client when the user changes the selection. |

    | *Scrollbars* | Gets and sets the desired support for scrollbars. This property
    is set to *Auto* by default. Feasible values come from the ASP.NET 2.0 *Scrollbars*
    type. |

    | *Tabs* | Returns the collection of *TabPanel* objects that defines the user
    interface of the control. |

    | *Width* | Gets and sets the width of the tabs. The value of the property is
    expressed as a *Unit* value. |


    In addition, the control fires the *ActiveTabChanged* event when the selected
    tab changes. The event is a mere notification, and the required delegate is *EventHandler*.
    No additional information is passed along with the event.'
  merge: -1
  pgno: 75
- img_proc: true
  md: "# Properties of Tab Panels\n\nThe *TabPanel* class represents an individual\
    \ tab in the container. Each tab defines its header either as plain text or as\
    \ a template. Likewise, a tab features a template to let developers specify its\
    \ content. The most recent tab should remain selected after a postback. Table\
    \ 5-7 lists the properties of the *TabPanel* class.\n\n| Property | Description\
    \ |\n|---|---|\n| *ContentTemplate* | Sets the contents of the tab. |\n| *Enabled*\
    \ | Indicates whether the tab should be displayed. The value of the property can\
    \ be changed on the client. |\n| *HeaderTemplate* | Gets and sets the template\
    \ to use to define the header of the tab. |\n| *HeaderText* | Gets and sets the\
    \ text to display in the tab's header. |\n| *OnClientClick* | JavaScript code\
    \ to attach to the client-side *click* event of the tab. |\n| *OnClientPopulated*\
    \ | JavaScript code to run on the client when the tab has been fully populated.\
    \ |\n| *OnClientPopulating* | JavaScript code to run on the client when the tab\
    \ is going to be populated. |\n| *Scrollbars* | Gets and sets the desired support\
    \ for scrollbars. This property is set to *Auto* by default. Feasible values come\
    \ from the ASPNET 2.0 *Scrollbars* type. |\n\nThe JavaScript code you can attach\
    \ to some client events can be either the name of function embedded in the host\
    \ page or a string of JavaScript executable code.\n\n# Using the *TabContainer*\
    \ Control\n\nLet's consider a sample page that makes use of the *TabContainer*\
    \ control. As you'll see in a moment, the markup required for a tab container\
    \ is straightforward.\n\n# Configuring the *TabContainer* Control\n\nThe *TabContainer*\
    \ tag maps its child tags to the *Tabs* collection of *TabPanel* objects. You\
    \ add one <TabPanel> tag for each desired tab and configure it at will. Here's\
    \ an example:\n\n```\n<act:TabContainer runat=\"server\" ID=\"TabContainer1\"\
    >\n    <act:TabPanel runat=\"server\" ID=\"TabPanel1\" HeaderText=\"Your Tab\"\
    >\n        <ContentTemplate>\n            <h3>Some text here</h3>\n        </ContentTemplate>\n\
    \    </act:TabPanel>\n    ...\n</act:TabContainer>\n```\n\nAll tabs are given\
    \ the same size, and you can control the size designation through the *Width*\
    \ and *Height* properties of the container. The height you set refers to the body\
    \ of tags and doesn't include the header."
  merge: -1
  pgno: 76
- img_proc: true
  md: "# Changing the Selected Tab\n\nYou can add some script code to run when the\
    \ user selects a new tab. You can wrap up all the code in a page-level JavaScript\
    \ function and bind the name of the function to the OnClientActiveTabChanged property\
    \ of the tab container. The following code writes the name of the currently selected\
    \ tab to a page element (originally, an ASP.NET Label control) named CurrentTab:\n\
    \n```\n<script type=\"text/javascript\">\n    function ActiveTabChanged(sender,\
    \ e)\n    {\n        var tab = $get('<%=CurrentTab.ClientID%>');\n        tab.innerHTML\
    \ = sender.get_activeTab().get_headerText();\n    }\n</script>\n```\n\nNote the\
    \ usage of code blocks in JavaScript. In this way, the client ID of the label\
    \ is merged in the script regardless of whether the page is a regular page or\
    \ a content page (with a hierarchy of parent controls and naming containers).\
    \ Figure 5-7 shows the control in action.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_77_0.png)\n\
    \n**Figure 5-7** The *TabContainer* control in action\n\n# The Client-Side Object\
    \ Model\n\nAs a full-fledged ASP.NET AJAX control, the TabContainer control exposes\
    \ a client-side object model. In particular, there's a set of properties that\
    \ represents the programming interface of the container and another set of properties\
    \ for each tab panel.\n\nThe container features read/write properties—such as\
    \ activeTabIndex, activeTab, tabs, and scrollBars—plus the activeTabChanged event."
  merge: -1
  pgno: 77
- img_proc: true
  md: "The tab panel exposes read/write properties such as *enabled*, *headerText*,\
    \ and *scrollBars* along with a read-only *tabIndex* property and a few events—*click*,\
    \ *populating*, and *populated*.\n\n# AJAX Control Toolkit Extenders\n\nIn addition\
    \ to finding full-fledged server controls such as *ReorderList* and *Accordion*\
    \ in the ACT, you find a bunch of other server controls designed to extend existing\
    \ controls on the page and provide them with new and additional behaviors. Existing\
    \ extenders can be categorized into a few groups: panel, input, popup, user interface,\
    \ animation, and button. Let's dig deeper into these groupings.\n\n# Panel Extenders\n\
    \nASP.NET pages are full of blocks of markup that, ideally, users would love to\
    \ move around, collapse if too large, and expand on demand. The perfect panel\
    \ control in ASP.NET is, therefore, both draggable and expandable. Purposely,\
    \ ASP.NET AJAX defines a few server-side behaviors that allow you to easily create\
    \ collapsible sections and drag panels around the page.\n\n# The *CollapsiblePanel*\
    \ Extender\n\nThe extender builds up a collapsible section in your pages by combining\
    \ two panels—one acting as the content panel, and one being the expand/collapse\
    \ controller. In its simplest form, the *CollapsiblePanel* extender looks like\
    \ the following code sample:\n\n```\n<act:CollapsiblePanelExtender ID=\"CollPanel\"\
    \ runat=\"server\"\n        TargetControlID=\"ContentPanel\"\n        ExpandControlID=\"\
    HeaderPanel\"\n        CollapseControlID=\"HeaderPanel\" />\n```\n\nAs usual,\
    \ the *TargetControlID* property sets the target panel to expand or collapse.\
    \ *ExpandControlID* and *CollapseControlID* indicate the panel to use to expand\
    \ and collapse the content panel. Note the extreme flexibility of the component\
    \ design—it might not make sense in all cases, but you can use different panels\
    \ to control the expansion and collapsing of the content panel. In most cases,\
    \ though, you'll be using the same header panel with an image button that changes\
    \ according to the state of the content panel. The following code snippet shows\
    \ a more complete usage for the extender:\n\n\n```\n<act:CollapsiblePanelExtender\
    \ ID=\"cpe\" runat=\"server\"\n        TargetControlID=\"CollapsibleCustomersPanelContent\"\
    \n        ExpandControlID=\"CollapsibleCustomersPanel\"\n        CollapseControlID=\"\
    CollapsibleCustomersPanel\"\n        Collapsed=\"true\"\n        ExpandDirection=\"\
    Vertical\"\n        ImageControlID=\"ToggleImage\"\n        ExpandedImage=\"~/images/collapse.jpg\"\
    \n        ExpandedText=\"Collapse\"\n        CollapsedImage=\"~/images/expand.jpg\"\
    \n        CollapsedText=\"Expand\" />\n```"
  merge: -1
  pgno: 78
- img_proc: true
  md: "The *ImageControlID* indicates the *Image* control, if any, that if clicked\
    \ causes the panel to expand or collapse. The *ExpandedImage* and *CollapsedImage*\
    \ properties set the URL of the images to use to expand and collapse. Likewise,\
    \ *CollapsedText* and *ExpandedText* set the ToolTip text for the image. *Collapsed*\
    \ sets the state of the panel, whereas *ExpandDirection* indicates whether the\
    \ panel expands horizontally or vertically. Figure 5-8 provides a view of the\
    \ control in action.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_79_0.png)\n\n\
    Figure 5-8 The *CollapsiblePanel* extender in action\n\nThe following code demonstrates\
    \ a typical pair of *Panel* controls used with the extender:\n\n```\n<asp:Panel\
    \ ID=\"CollapsibleCustomersPanel\" runat=\"server\">\n    <asp:Image ID=\"ToggleImage\"\
    \ runat=\"server\"\n               ImageUrl=\"~/images/collapse.jpg\" />\n   \
    \ <b>Customers</b>\n</asp:Panel>\n<asp:Panel ID=\"CollapsibleCustomersPanelContent\"\
    \ runat=\"server\"\n    Height=\"0\" CssClass=\"collapsePanel\">\n    ...\n</asp:Panel>\n\
    ```\n\nUnlike draggable panels, the header and content panels are distinct and\
    \ are typically placed one after the next in the page layout. The extender panel\
    \ is also *postback aware*, meaning that, on a client postback, it automatically\
    \ records and restores its collapsed/expanded client state.\n\n> Note To avoid\
    \ the initial flickering when a collapsible panel is displayed, make sure you\
    \ properly style the panel that is going to be collapsed and expanded. This panel\
    \ needs to have *Height=0* and the CSS *overflow* style set to *hidden*.\n\n#\
    \ The *DragPanel* Extender\n\nThe *DragPanel* extender is one of the simplest\
    \ extenders in the ACT. It has only two properties—one to indicate the panel to\
    \ drag, and one to indicate the panel to use as the drag handle:"
  merge: -1
