    Figure 5-4  The *Accordion* control in action


    # Accordion Panes


    An accordion pane is a simple Web control named *AccordionPane*. It has a *Header*
    template property that you use to define the highlighting of the panel–that is,
    the portion of the panel that is visible also when it is collapsed. You can style
    the header using the settings in the CSS class defined by the *HeaderCssClass*
    property.


    Likewise, the content of the pane is defined by the *Content* template property
    and styled using the settings in the CSS class referenced by the *ContentCssClass*
    property.


    # The *Rating* Control


    The satisfaction of users is one of the key metrics used to determine the success
    of a Web site. And how do you recognize the satisfaction level of a user? Many
    Web sites kindly ask users to provide their feedback through ad hoc panels scattered
    through the pages. The most common user-interface pattern for user feedback is
    a ratings system. The Web site shows a fixed number of stars and lets users click
    those stars to rate a given feature (usually, more stars clicked indicates a higher
    level of satisfaction).'
  - '[PAGE 67]


    Most ASP.NET developers can easily arrange a rating mechanism that works through
    classic postbacks. The ACT *Rating* control, on the other hand, provides a standard
    rating mechanism that works over callbacks.


    # Generalities of the *Rating* Control


    The output of the control consists of a repeated `<span>` tag that is decorated
    through a set of CSS classes. Each `<span>` tag represents a "star" in the rating
    system and is styled according to the status it represents. Figure 5-5 gives you
    an idea of the *Rating* control.


    ![](img/db82dc55683fa403b8b16b76eb00cc2e_67_0.png)


    Figure 5-5 The *Rating* control in action


    # Properties of the Control


    Table 5-3 lists the key properties of the *Rating* control.


    | Property | Description |

    | --- | --- |

    | *AutoPostBack* | Indicates whether the control will post back whenever the user
    rates a given associated content. |

    | *CurrentRating* | Gets and sets the current value rendered by the control. The
    default value is 3. |

    | *EmptyStarCssClass* | Gets and sets the CSS class to render an unselected star.
    |

    | *FilledStarCssClass* | Gets and sets the CSS class to render a selected star.
    |

    | *MaxRating* | Gets and sets the maximum value that can be rated through the
    control. The default value is 5. |

    | *RatingAlign* | Indicates the alignment of the stars. The default is *horizontal*.
    |

    | *RatingDirection* | Indicates the orientation of the stars. The default is left
    to right if the *RatingAlign* value is horizontal and top to bottom if *RatingAlign*
    is vertical. |

    | *ReadOnly* | Indicates whether the control accepts user input. |'
  - "[PAGE 68]\n\n162 \tPart II \tAdding AJAX Capabilities to a Site\n\n# Table 5-3\
    \ \tProperties of the *Rating* Control (Continued)\n\n| Property | Description\
    \ |\n| --- | --- |\n| *StarCssClass* | Gets and sets the CSS class to style the\
    \ whole control. |\n| *Tag* | A string to pass to the server-side code that handles\
    \ the user's click. |\n| *WaitingStarCssClass* | Gets and sets the CSS class to\
    \ render selected stars during a server postback following a user update. |\n\n\
    The markup generated by the *Rating* control looks like the following code:\n\n\
    ```\n<div id=\"Rating1\" style=\"float: left;\">\n    <span id=\"Rating1_Star_1\"\
    \ class=\"ratingStar filledRatingStar\"\n          style=\"float:left;\">&nbsp;</span>\n\
    \    <span id=\"Rating1_Star_2\" class=\"ratingStar filledRatingStar\"\n     \
    \     style=\"float:left;\">&nbsp;</span>\n    ...\n</div>\n```\n\nAs you can\
    \ see, each “star” is characterized by a unique ID and is represented with a `<span>`\
    \ tag set to the empty string. In Figure 5-5, though, each star is clearly an\
    \ image. How is that possible?\n\n# Styling the Control\n\nThe *Rating* control\
    \ supports four different CSS classes. *StarCssClass* defines the style for the\
    \ entire control. *WaitingStarCssClass* defines the style to be used when the\
    \ control is posting back. *EmptyStarCssClass* and *FilledStarCssClass* define\
    \ the style for the `<span>` tag. You can use either an image to fill the tag\
    \ or a contrasting background color. Let’s consider the following CSS classes:\n\
    \n```\n.filledRatingStar\n{\n    background-color: #2E4d7B;\n}\n.emptyRatingStar\n\
    {\n    background-image: url(images/NotSelected.png);\n}\n```\n\nThese classes\
    \ produce an effect like the second rating object shown in Figure 5-5. The selected\
    \ part is rendered as a gauge bar; the unselected part is rendered using empty\
    \ stars. By editing the CSS classes, you can choose the “star” images to meet\
    \ the expectations of the users of your application.\n\n# Using the *Rating* Control\n\
    \nThe *Rating* control is relatively simple to use. It only requires you to set\
    \ a few properties—the CSS classes—and it has no child elements or templates."
- md: " ## The Rating Control in Action\n\nThe following code demonstrates the usage\
    \ of the *Rating* control:\n\n```\n<h2>Rate this item:</h2>\n<div>\n    <act:Rating\
    \ ID=\"Rating1\" runat=\"server\"\n        CurrentRating=\"3\"\n        MaxRating=\"\
    10\"\n        StarCssClass=\"ratingStar\"\n        WaitingStarCssClass=\"savedRatingStar\"\
    \n        FilledStarCssClass=\"filledRatingStar\"\n        EmptyStarCssClass=\"\
    emptyRatingStar\"\n        OnChanged=\"Rating_Changed\" />\n</div>\n```\n\nThe\
    \ *MaxRating* property determines the number of stars to render. Of these, the\
    \ first stars (or the last ones, depending on the direction) up to the value specified\
    \ by *CurrentRating* are styled using the class name specified by *FilledStarCssClass*.\
    \ The remaining stars are styled using the attributes set by *EmptyStarCssClass*.\n\
    \nSpecifying valid CSS class names is key. If you omit, say, the empty-star style,\
    \ the corresponding `<span>` tag will be rendered as is, without any graphical\
    \ adjustments. Because the `<span>` tag is set to the empty string, no visible\
    \ output will be generated.\n\n## The Eventing Model\n\nThe *Rating* control injects\
    \ into the client browser a piece of script code that does two main things. First,\
    \ it captures mouse movements over the bounding box of the control. Second, it\
    \ handles the user's clicking.\n\nAs the user moves the mouse over the unselected\
    \ stars, the script code automatically toggles the class name of the underlying\
    \ `<span>` tag to give you an idea of the interface if you select the given number\
    \ of stars.\n\nTo change the current value, you just click on the star that represents\
    \ the new value. For example, in an rating system with five stars, you click on\
    \ the fourth star to set a rating of 4. When this happens, the *Rating* control\
    \ makes an out-of-band call to the server and raises the *Changed* event:\n\n\
    ```\nprotected void Rating_Changed(object sender, RatingEventArgs e)\n{\n    //\
    \ Perform any significant server-side action\n    // such as storing the new value\
    \ to a database\n}\n```\n\nThe *RatingEventArgs* class contains three main properties:\
    \ *Tag*, *Value*, and *CallbackResult*. *Tag* is a cargo property used to carry\
    \ any custom string from the client to the server. *Value* indicates the currently\
    \ selected value in the control. *CallbackResult*, on the other hand, is a string\
    \ property you can set on the server with any information you want to bring back\
    \ to the client. For example, you can use the Changed event to store the rating\
    \ value to a database and use the CallbackResult string to return an error message\
    \ if the operation fails.\n\n## The ReorderList Control\n\nData-bound lists of\
    \ data are commonly displayed to Web users and, most of the time, are read-only,\
    \ immutable lists. There might be situations, though, in which the end user might\
    \ want to reorder a displayed list of items. A good example is a page on which\
    \ the user can select multiple cities in the world to be informed about the current\
    \ weather. The cities appear in a given order on the page, but the user might\
    \ want to change the order at some point.\n\nAs a developer, you can add a Move\
    \ Up button to the page and have the user click three times to bring the last\
    \ city to the top of a list with four cities. Although this approach is functionally\
    \ effective, it is certainly not very user friendly. A more natural approach would\
    \ be to enable the user to simply select the item of a given city and drop it\
    \ to the desired new location.\n\nThis is exactly what the ReorderList control\
    \ allows you to do. Let's learn more about this new ASP.NET AJAX control.\n\n\
    ### Generalities of the ReorderList Control\n\nThe contents of the ReorderList\
    \ control are expressed through a series of templates that you use to indicate\
    \ the structure of each data-bound item, the user interface for the drag handle,\
    \ and the user interface for the insertion point where the dragged item is being\
    \ moved. More properties and events, though, interact to form the programming\
    \ interface of the control.\n\n### Properties of the Control\n\nTable 5-4 lists\
    \ the key properties of the ReorderList control. In particular, the list describes\
    \ the properties that can be set through attributes in an ASP.NET Web page. The\
    \ control, in fact, derives from DataBoundControl and implements the IRepeatInfoUser\
    \ interface—the typical interface for controls that support a variety of alignments\
    \ and layouts, such as CheckBoxList. The base class and the interface include\
    \ a bunch of additional properties that relate to data binding and control layout.\n\
    \n| Property | Description |\n| --- | --- |\n| AllowReorder | Indicates whether\
    \ the control supports drag-and-drop reordering. This property is automatically\
    \ set to true if a reorder template is specified. |\n| DataKeyField | Indicates\
    \ the name of the data-bound source that operates as the primary key field. |\n\
    | DataSourceID | Indicates the ID of the data source control used to populate\
    \ the control. |\n| DragHandleAlignment | Indicates the position of the drag handle\
    \ with respect to the item to drag. It can have any of the following values: Top,\
    \ Left, Bottom, or Right. |\n| DragHandleTemplate | The template for the drag\
    \ handle that the user clicks to drag and reorder items. |\n| EditItemTemplate\
    \ | The template used to show that a row is in edit mode. |\n| EmptyListTemplate\
    \ | The template used to show that the list has no data. This item is not data\
    \ bindable. |\n| InsertItemTemplate | The template used to add new items to the\
    \ list. |\n| ItemInsertLocation | When the InsertItemTemplate property is used\
    \ to add a new item to the displayed list, this property indicates where the item\
    \ has to be inserted. Feasible values are Beginning and End. |\n| ItemTemplate\
    \ | The template for any items in the list. |\n| PostBackOnReorder | Indicates\
    \ whether the control has to post back at the end of a reorder operation. |\n\
    | ReorderTemplate | The template used to show the drop location during a reorder\
    \ operation. This template is not data bindable. |\n| SortOrderField | The field,\
    \ if any, that represents the sort order of the items. |\n\nThe key properties\
    \ are *ItemTemplate*, *DragHandleTemplate*, and *ReorderTemplate*. *ItemTemplate*\
    \ allows you to populate the list control with any information and layout you\
    \ need. *DragHandleTemplate* defines the graphical elements that users need to\
    \ identify when they want to reorder the list. Finally, the *ReorderTemplate*\
    \ defines the template of the visual feedback that is shown to the user while\
    \ the operation is occurring.\n\n### Events of the Control\n\nThe *ReorderList*\
    \ control is primarily a data-bound control with a rich user interface largely\
    \ made up of templates. This means that the control can include a number of child\
    \ controls that might trigger postbacks and cause the contents of the control\
    \ to change.\n\nIt is not surprising, then, to find a long list of events associated\
    \ with this control. These events are detailed in Table 5-5.\n\n| Event | Description\
    \ |\n| --- | --- |\n| CancelCommand | Occurs when a button with the *CommandName*\
    \ of \"Cancel\" is clicked from within the control. |\n| DeleteCommand | Occurs\
    \ when a button with the *CommandName* of \"Delete\" is clicked from within the\
    \ control. |\n| EditCommand | Occurs when a button with the *CommandName* of \"\
    Edit\" is clicked from within the control. |\n| InsertCommand | Occurs when a\
    \ button with the *CommandName* of \"Insert\" is clicked from within the control.\
    \ |\n| ItemCommand | Occurs when a button is clicked from within the item template\
    \ of a row. |\n| ItemCreated | Occurs when an item row is created. |\n| ItemDataBound\
    \ | Occurs when an item row is bound to its data. |\n| ItemReorder | Occurs when\
    \ an item row is moved to a new location at the end of a reorder operation. |\n\
    | UpdateCommand | Occurs when a button with the *CommandName* of \"Update\" is\
    \ clicked from within the control. |\n\nMost command events are related to the\
    \ capabilities of the bound data source. For example, the *InsertCommand* event\
    \ occurs if the control features a proper template with controls to capture data\
    \ and invoke an *Insert* command on the bound data source control. Here's a quick\
    \ example:\n\n```\n<act:ReorderList ...>\n    ...\n    <InsertItemTemplate>\n\
    \        <div>\n            <asp:TextBox ID=\"TextBox1\" runat=\"server\"\n  \
    \              Text='<%# Bind(\"Title\") %>'></asp:TextBox>\n            <asp:LinkButton\
    \ ID=\"LinkButton1\" runat=\"server\"\n                CommandName=\"Insert\"\
    >Add</asp:LinkButton>\n        </div>\n    </InsertItemTemplate>\n</act:ReorderList>\n\
    ```\n\nBy clicking on the link button, you cause the *ReorderList* control to\
    \ invoke the *Insert* command on the bound data source, if there is any. The new\
    \ item, which will have a *Title* property, is added at the top or bottom of the\
    \ data source based on the value of the *ItemInsertLocation* property.\n\nThe\
    \ *ItemReorder* event is fired on the server before the new control is rendered\
    \ back to the client with the new order of items. The event carries a *ReorderListItemReorderEventArgs*\
    \ object with the following structure:\n\n```\npublic class ReorderListItemReorderEventArgs\
    \ : EventArgs\n{\n    public ReorderListItem Item { get; set; }\n    public int\
    \ NewIndex { get; set; }\n    public int OldIndex { get; set; }\n}\n```\n\nThe\
    \ *Item* property indicates the item being moved, whereas *NewIndex* and *OldIndex*\
    \ specify the new and old positions (a 0-based index), respectively.\n\n### Using\
    \ the *ReorderList* Control\n\nLet's consider a sample page that makes use of\
    \ the *ReorderList* control. As you'll see in a moment, the *ReorderList* control\
    \ must be bound to a data source and embedded in an *UpdatePanel* control."
  mdcn: "\n## 评级控件实战\n\n以下代码演示了 *Rating* 控件的用法：\n\n```\n<h2>Rate this item:</h2>\n\
    <div>\n    <act:Rating ID=\"Rating1\" runat=\"server\"\n        CurrentRating=\"\
    3\"\n        MaxRating=\"10\"\n        StarCssClass=\"ratingStar\"\n        WaitingStarCssClass=\"\
    savedRatingStar\"\n        FilledStarCssClass=\"filledRatingStar\"\n        EmptyStarCssClass=\"\
    emptyRatingStar\"\n        OnChanged=\"Rating_Changed\" />\n</div>\n```\n\n*MaxRating*\
    \ 属性决定了要渲染的星形数量。其中，从第一颗星（或最后一颗，取决于方向）开始，到 *CurrentRating* 指定值之前的所有星形，都会使用 *FilledStarCssClass*\
    \ 指定的类名进行样式化。其余的星形则使用 *EmptyStarCssClass* 设置的属性进行样式化。\n\n指定有效的 CSS 类名至关重要。例如，如果你省略了空星的样式，相应的\
    \ `<span>` 标签将原样渲染，没有任何图形调整。由于 `<span>` 标签被设置为空字符串，因此不会生成任何可见输出。\n\n## 事件模型\n\n\
    *Rating* 控件会向客户端浏览器注入一段脚本代码，该代码主要做两件事。首先，它捕获鼠标在控件边界框上的移动。其次，它处理用户的点击操作。\n\n当用户将鼠标移动到未选中的星形上时，脚本代码会自动切换底层\
    \ `<span>` 标签的类名，让你在选中指定数量的星形时，对界面效果有个直观的了解。\n\n要更改当前值，你只需点击代表新值的星形即可。例如，在一个五星评级系统中，你点击第四颗星即可将评级设置为\
    \ 4。此时，*Rating* 控件会向服务器发出带外调用并触发 *Changed* 事件：\n\n```\nprotected void Rating_Changed(object\
    \ sender, RatingEventArgs e)\n{\n    // Perform any significant server-side action\n\
    \    // such as storing the new value to a database\n}\n```\n\n*RatingEventArgs*\
    \ 类包含三个主要属性：*Tag*、*Value* 和 *CallbackResult*。*Tag* 是一个用于将任何自定义字符串从客户端传递到服务器的载荷属性。*Value*\
    \ 表示控件中当前选中的值。另一方面，*CallbackResult* 是一个字符串属性，你可以在服务器端设置任何想要返回给客户端的信息。例如，你可以使用\
    \ Changed 事件将评级值存储到数据库，并使用 CallbackResult 字符串在操作失败时返回错误消息。\n\n## ReorderList 控件\n\
    \n数据绑定列表通常向 Web 用户展示，并且在大多数情况下是只读的、不可变的列表。然而，可能存在这样的情况：最终用户可能希望重新排列显示的项目列表。一个很好的例子是一个页面，用户可以在其中选择世界上多个城市以获取当前天气信息。这些城市在页面上以给定的顺序出现，但用户可能希望在某个时候更改顺序。\n\
    \n作为开发人员，你可以为页面添加一个“上移”按钮，让用户点击三次将四个城市列表中的最后一个城市移动到顶部。虽然这种方法在功能上有效，但肯定不是很友好。更自然的方法是允许用户简单地选择某个城市的项目，并将其拖放到所需的新位置。\n\
    \n这正是 ReorderList 控件允许你做的事情。让我们进一步了解这个新的 ASP.NET AJAX 控件。\n\n### ReorderList 控件概述\n\
    \nReorderList 控件的内容通过一系列模板来表达，这些模板用于指示每个数据绑定项目的结构、用于拖动的句柄的用户界面，以及拖动项目移动到的插入点的用户界面。然而，还有更多属性和事件相互作用，共同构成了该控件的编程接口。\n\
    \n### 控件属性\n\n表 5-4 列出了 ReorderList 控件的关键属性。特别地，该列表描述了可以通过 ASP.NET 网页中的属性设置的属性。实际上，该控件派生自\
    \ DataBoundControl 并实现了 IRepeatInfoUser 接口——这是支持各种对齐和布局的控件（如 CheckBoxList）的典型接口。基类和接口包含许多与数据绑定和控件布局相关的附加属性。\n\
    \n| 属性 | 描述 |\n| --- | --- |\n| AllowReorder | 指示控件是否支持拖放重新排序。如果指定了重新排序模板，此属性将自动设置为\
    \ true。 |\n| DataKeyField | 指示充当主键字段的数据绑定源的名称。 |\n| DataSourceID | 指示用于填充控件的数据源控件的\
    \ ID。 |\n| DragHandleAlignment | 指示拖动句柄相对于要拖动项目的位置。它可以具有以下任何值：Top、Left、Bottom\
    \ 或 Right。 |\n| DragHandleTemplate | 用户单击以拖动和重新排序项目的拖动句柄的模板。 |\n| EditItemTemplate\
    \ | 用于显示行处于编辑模式的模板。 |\n| EmptyListTemplate | 用于显示列表没有数据的模板。此项目不可进行数据绑定。 |\n| InsertItemTemplate\
    \ | 用于向列表添加新项目的模板。 |\n| ItemInsertLocation | 当使用 InsertItemTemplate 属性向显示的列表添加新项目时，此属性指示项目必须插入的位置。可行的值为\
    \ Beginning 和 End。 |\n| ItemTemplate | 列表中任何项目的模板。 |\n| PostBackOnReorder | 指示控件是否必须在重新排序操作结束后执行回发。\
    \ |\n| ReorderTemplate | 用于在重新排序操作期间显示放置位置的模板。此模板不可进行数据绑定。 |\n| SortOrderField\
    \ | 表示项目排序顺序的字段（如果有）。 |\n\n关键属性是 *ItemTemplate*、*DragHandleTemplate* 和 *ReorderTemplate*。*ItemTemplate*\
    \ 允许你使用所需的任何信息和布局来填充列表控件。*DragHandleTemplate* 定义了用户在想要重新排序列表时需要识别的图形元素。最后，*ReorderTemplate*\
    \ 定义了操作期间向用户显示的视觉反馈的模板。\n\n### 控件事件\n\n*ReorderList* 控件主要是一个数据绑定控件，其丰富的用户界面主要由模板组成。这意味着该控件可以包含许多可能触发回发并导致控件内容更改的子控件。\n\
    \n因此，发现与此控件关联的长长事件列表也就不足为奇了。这些事件在表 5-5 中详细说明。\n\n| 事件 | 描述 |\n| --- | --- |\n\
    | CancelCommand | 当控件内部单击 *CommandName* 为 \"Cancel\" 的按钮时发生。 |\n| DeleteCommand\
    \ | 当控件内部单击 *CommandName* 为 \"Delete\" 的按钮时发生。 |\n| EditCommand | 当控件内部单击 *CommandName*\
    \ 为 \"Edit\" 的按钮时发生。 |\n| InsertCommand | 当控件内部单击 *CommandName* 为 \"Insert\" 的按钮时发生。\
    \ |\n| ItemCommand | 当在行的项目模板内单击按钮时发生。 |\n| ItemCreated | 当创建项目行时发生。 |\n| ItemDataBound\
    \ | 当项目行与其数据绑定时发生。 |\n| ItemReorder | 当项目行在重新排序操作结束时移动到新位置时发生。 |\n| UpdateCommand\
    \ | 当控件内部单击 *CommandName* 为 \"Update\" 的按钮时发生。 |\n\n大多数命令事件与绑定数据源的功能有关。例如，如果控件具有适当的模板，其中包含用于捕获数据并在绑定的数据源控件上调用\
    \ *Insert* 命令的控件，则 *InsertCommand* 事件会发生。这是一个简单的示例：\n\n```\n<act:ReorderList ...>\n\
    \    ...\n    <InsertItemTemplate>\n        <div>\n            <asp:TextBox ID=\"\
    TextBox1\" runat=\"server\"\n                Text='<%# Bind(\"Title\") %>'></asp:TextBox>\n\
    \            <asp:LinkButton ID=\"LinkButton1\" runat=\"server\"\n           \
    \     CommandName=\"Insert\">Add</asp:LinkButton>\n        </div>\n    </InsertItemTemplate>\n\
    </act:ReorderList>\n```\n\n通过单击链接按钮，你可以使 *ReorderList* 控件在绑定的数据源（如果有的话）上调用 *Insert*\
    \ 命令。新项目（将具有 *Title* 属性）将根据 *ItemInsertLocation* 属性的值添加到数据源的顶部或底部。\n\n*ItemReorder*\
    \ 事件在服务器端触发，然后新的控件才会以新的项目顺序呈现回客户端。该事件携带一个具有以下结构的 *ReorderListItemReorderEventArgs*\
    \ 对象：\n\n```\npublic class ReorderListItemReorderEventArgs : EventArgs\n{\n  \
    \  public ReorderListItem Item { get; set; }\n    public int NewIndex { get; set;\
    \ }\n    public int OldIndex { get; set; }\n}\n```\n\n*Item* 属性指示正在移动的项目，而 *NewIndex*\
    \ 和 *OldIndex* 分别指定新位置和旧位置（从 0 开始的索引）。\n\n### 使用 *ReorderList* 控件\n\n让我们看一个使用\
    \ *ReorderList* 控件的示例页面。你稍后会看到，*ReorderList* 控件必须绑定到数据源并嵌入到 *UpdatePanel* 控件中。\n"
