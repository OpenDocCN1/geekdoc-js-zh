- img_proc: true
  md: "<asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n\n```\n<asp:Panel ID=\"Panel1\"\
    \ runat=\"server\" CssClass=\"popupMenu\">\n    <asp:RadioButtonList ID=\"RadioButtonList1\"\
    \ runat=\"server\"\n        AutoPostBack=\"true\"\n        OnSelectedIndexChanged=\"\
    RadioButtonList1_SelectedIndexChanged\">\n        <asp:ListItem Text=\"Dino Esposito\"\
    ></asp:ListItem>\n        <asp:ListItem Text=\"Nancy Davolio\"></asp:ListItem>\n\
    \        <asp:ListItem Text=\"Andrew Fuller\"></asp:ListItem>\n        <asp:ListItem\
    \ Value=\"\" Text=\"None of the above\"></asp:ListItem>\n    </asp:RadioButtonList>\n\
    </asp:Panel>\n```\n\n```\n<act:HoverMenuExtender ID=\"HoverMenu1\" runat=\"server\"\
    \n    TargetControlID=\"TextBox1\"\n    HoverCssClass=\"hoverPopupMenu\"\n   \
    \ PopupControlID=\"Panel1\"\n    PopupPosition=\"Right\" />\n```\n\nThe *Panel1*\
    \ control defines a list of radio buttons, each containing a suggestion for filling\
    \ the text box. The *HoverMenu* extender targets the text box control and defines\
    \ *Panel1* as its dynamic pop-up panel. The *PopupPosition* property indicates\
    \ the position of the panel with respect to the target control. Likewise, other\
    \ properties not shown in the previous example code, such as *OffsetX* and *OffsetY*,\
    \ define the desired offset of the panel. The *PopDelay* sets the time (in milliseconds)\
    \ to pass between the mouse movement and the display of the panel. The *HoverCssClass*\
    \ can optionally be used to give the text box a different style when the hover\
    \ menu is on. It is interesting to look at the CSS class associated with the panel:\n\
    \n```\n.popupMenu\n{\n    position:absolute;\n    visibility:hidden;\n    background-color:#F5F7F8;\n\
    }\n.hoverPopupMenu\n{\n    background-color:yellow;\n}\n```\n\nIt is key that\
    \ the *visibility* attribute of the panel is set to *hidden* just as with *CollapsiblePanel*\
    \ control; otherwise, the panel will display upon page loading and hidden immediately\
    \ afterwards.\n\nJust as for the *PopupControl* extender, to take full advantage\
    \ of the *HoverMenu* extender you need to place extended controls inside of an\
    \ *UpdatePanel* control. In this way, whenever the user clicks a radio button,\
    \ the panel posts back asynchronously and fires the *SelectedIndexChanged* event\
    \ on the server.\n\n```\nvoid RadioButtonList1_SelectedIndexChanged(object sender,\
    \ EventArgs e)\n{\n    TextBox1.Text = RadioButtonList1.SelectedValue;\n}\n```"
