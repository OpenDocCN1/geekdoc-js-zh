    Shell，或是Visual Basic 6.0或C++非托管应用程序。在.NET应用程序中使用*XMLHttpRequest* COM对象是毫无意义的，因为你在.NET
    Framework的*System.Net*命名空间中可以找到类似功能。


    > **重要提示** 如果你打算使用Microsoft ASP.NET AJAX Extensions或任何其他类AJAX框架来构建应用，你几乎不会听到*XMLHttpRequest*对象，更不用说在自己的代码中直接使用它。ASP.NET
    AJAX Extensions完全封装了该对象，使页面作者和应用设计者无需接触它。要编写出色的AJAX应用，无论多么复杂精巧，你都不需要了解*XMLHttpRequest*。然而，了解*XMLHttpRequest*的基础知识，能让你对平台有更好更透彻的理解，并更有效地诊断问题。


