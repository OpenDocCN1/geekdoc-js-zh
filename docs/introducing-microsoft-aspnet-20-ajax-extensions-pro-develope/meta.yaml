  md: 'Displaying results correctly on most browsers can be tricky. Internet Explorer,
    in fact, supports a number of nonstandard shortcuts in the DOM that just don''t
    work with other browsers. The most common snag is retrieving references to HTML
    elements using the *document.getElementById* method instead of the direct name
    of the element. For example, the following code works on Internet Explorer but
    not on Firefox and other Mozilla-equipped browsers:


    ```

    // Msg is the ID of a <span> tag.

    // This code works only with Internet Explorer

    Msg.innerHTML = xml.requestText;

    ```


    In summary, cross-browser JavaScript code is required to update the currently
    displayed page on the client. At the same time, a number of assumptions must be
    made on the server to come up with a working and effective environment. For this
    reason, frameworks are the only reasonable way of implementing AJAX functionalities.
    Different frameworks, though, might provide a different programming interface
    on top of an engine that uses the same common set of parts.


    # The Switch to the Document Object Model


    Microsoft has pioneered updatable Web pages since the late 1990s. With Internet
    Explorer 4.0 (released back in 1997), Microsoft introduced Dynamic HTML (DHTML),
    which is a powerful combination of HTML, style sheets, and scripts that allows
    programmatic changes to any displayed page. Several companies since then have
    worked out their own DHTML object model—often referred to as the Browser Object
    Model (BOM). The W3C committee worked hard to bring vendors to agree on an interoperable
    and language-neutral solution for exposing Web pages through an updatable programming
    interface. The result is the Document Object Model (DOM), as opposed to a browser-specific
    BOM.


    The DOM is a platform-independent and language-neutral representation of the contents
    of a Web page that scripts can access and use to modify the content, structure,
    and style of the document.


    For AJAX, it''s all about exchanging data with a remote server. But once the data
    is downloaded out-of-band on the client, what can you do with that? The DOM provides
    an outlet for the data to flow into the current page structure and update it.


    # Representation of a Document


    The DOM is a standard API exposed by the browser in which a displayed page has
    a tree-based structure. Each node in the logical tree corresponds to an object.
    On the other hand, the name "Document Object Model" hints at an object model in
    the common interpretation of the object-oriented design terminology. A Web page—the
    document—is modeled through objects. The model includes the structure and behavior
    of a document. Each node in the logical tree is not static data; rather, it is
    a live object with a known behavior and its own identity.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# DOM Implementation


    The W3C DOM consists of three levels that indicate, for the browser, three different
    levels of adherence to the standard. For more information, take a look at http://www.w3.org/DOM.


    The DOM is made of nodes, and each node is an object. For a Web page, each node
    maps to an object that represents an HTML tag. The object, therefore, has properties
    and methods that can be applied to an HTML tag. There are three fundamental operations
    you can accomplish on a node: find the node (including related nodes such as children,
    parent, or sibling nodes), create a node, and manipulate a node.


    Identifying a particular node is easy as long as the page author knows the ID
    of the corresponding element. In this case, you use the following standard piece
    of code:


    ```

    var node = document.getElementById(id);

    ```


    In particular, if there are multiple elements sharing the same ID value, the method
    returns the first object in the collection. This method is supported in the DOM
    Level 1 and upper levels. Another interesting method to find elements is the following:


    ```

    var coll = document.getElementsByTagName(tagname);

    ```


    The method retrieves a collection of all objects based on the same HTML tag. For
    example, the method retrieves a collection of all <div> or all <input> tags in
    the page.


    Related DOM objects are grouped in node lists. Each node has a name, type, parent,
    and collection of children. A node also holds a reference to its siblings and
    attributes. The following code snippet shows how to retrieve the parent of a node
    and its previous sibling:


    ```

    var oParent = oNode.parentNode

    var oPrevious = oNode.previousSibling

    ```


    How can you modify the contents of a node? The easiest and most common approach
    entails that you use the innerHTML property:


    ```

    var node = document.getElementById("button1");

    node.innerHTML = "Hey click me";

    ```


    The innerHTML property is supported by virtually all browsers, and it sets or
    retrieves the HTML between the start and end tags of the given object. Some browsers
    such as Internet Explorer also support the innerText property. This property is
    designed to set or retrieve the text inside of a given DOM object. Unfortunately,
    this property is not supported by all browsers. It exists in Internet Explorer
    and Safari but, for example, it is not supported by Firefox. Firefox, on the other
    hand, supports a property with a similar behavior but a different name—textContent.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'The advent of the Microsoft AJAX Client Library (discussed in Chapter 2, "The
    Microsoft Client Library for AJAX") shields developers from having to know much
    about the little differences between the DOM implementation of the various browsers.
    For example, you should know about innerText and textContent if you''re embedding
    your own JavaScript in the page; however, you don''t have to if you rely on the
    AJAX Client Library to refresh portions of the displayed page.


    Finally, note that you should not check the user agent string to figure out whether
    the current browser supports a given feature. You should check the desired object
    instead. For example, to know whether the browser supports innerText, you''re
    better off running the following code:


    ```

    var supportsInnerText = false;

    var supportsInnerText = false;

    if (temp != undefined)

    supportsInnerText = true;

    ...

    ```


    In this way, you directly check the availability of the property without having
    to maintain a list of browsers.


    Nodes are created using the createElement method exposed only to the document
    object. Alternatively, you can add new elements to the document hierarchy by modifying
    the innerHTML property value, or by using methods explicit to particular elements,
    such as the insertRow and insertCell methods for the table element. Here''s an
    example:


    ```

    // Create an <IMG> element

    var oImg = document.createElement("<img>");

    ...

    // Create a new option for the SELECT element

    var oOption = new Option(text, id);

    control.options.add(oOption);

    ```


    With this information, I have only scratched the surface of the DOM implementation
    in the various browsers. Nonetheless, the DOM is a key part of the AJAX jigsaw
    puzzle and deserves a lot of attention and skilled use. For a primer, you can
    take a look at http://msdn.microsoft.com/workshop/author/dom/domoverview.asp.


    # Be Pragmatic: DHTML vs. DOM


    In the beginning, only the browser''s support for the DHTML object model provided
    JavaScript developers with the ability to update the page contents dynamically.
    The success of DHTML led to the definition of a standard document object model—the
    W3C''s DOM. Quite obviously, the DOM evolved from DHTML and became much more generalized
    than DHTML. As mentioned, the DOM provides a tree-based model for the whole document,
    not just for an individual HTML tag.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Most browsers, though, support a mix of DOM and DHTML. Which one should you
    use? In particular, to update some contents, should you obtain a reference to
    the textual child node of the node that matches the intended HTML tag (the DOM
    way) or just grab a reference to a node and use `innerHTML` (the DHTML way)? Likewise,
    to add a new element, should you create a new element or just stuff in a chunk
    of updated HTML via `innerHTML`? Admittedly, one of the most interesting debates
    in the community is whether to use DHTML to manipulate pages or opt for the cleaner
    approach propounded by the DOM application programming interface (API).


    The key fact is that the DOM API is significantly slower than using `innerHTML`.
    If you go through the DOM to generate some user interface dynamically, you have
    to create every element, append each into the proper container, and then set properties.
    The alternative only entails that you define the HTML you want and render it into
    the page using `innerHTML`. The browser, then, does the rest by rendering your
    markup into direct graphics.


    Overall, DHTML and DOM manipulation are both useful depending on the context.
    There are many Web sites that discuss performance tests and DHTML is always the
    winner. Anyway, DOM is still perfectly fast as long as you use it the right way—that
    is, create HTML fragments and append them to the proper container only as the
    final step.


    # Be Pragmatic: Use Events


    Let''s make it clear: without events, there would be no point in adding JavaScript
    to Web pages. To be effective, therefore, scripts have to react to some user action
    as well as to actions generated by the browser, such as when loading the page.
    Events and event handlers are old companions to Web pages, as they appeared the
    first time with Netscape 2.


    For quite some time, largely incompatible event models lived and thrived in different
    browsers—mainly in Internet Explorer and Netscape. A few years ago, the W3C standardized
    the event model with a paper that you can read at <http://www.w3.org/TR/2000/REC-DOM-Level-2-Events-20001113/events.html>.


    With Internet Explorer and Netscape having their own original event model, and
    making themselves compatible to the W3C standard, you understand that writing
    model-agnostic event handlers is going to be a hard task. There are a lot of events,
    but not all of them are supported by all browsers. The following categories of
    events can be considered standard: user interface events (blur, focus, scroll),
    device events (click, keydown), and form events (submit, select). The second big
    point concerns how you set event handlers. The most reliable way is still the
    following:


    ```

    <a href="page.aspx" onclick="doClick()" />

    ```


    An excellent paper that discusses the theme of events in JavaScript can be found
    here: <http://www.quirksmode.org/js/introevents.html>.'
