    \ Web 应用程序。这里的关键是什么？难道 Web 应用程序不是大约在十年前就被专门设计为\"交互式的\"、\"响应灵敏的\"，并通过一种称为浏览器的独特工具来部署的吗？那么今天又有什么新鲜事呢？\n\
    \n互联网的惊人成功激发了人们对 Web 相关技术的渴求，其程度超乎想象。多年来，用户对更强大、更多 Web 暴露的功能和服务的需求，促使架构师和开发者在服务器平台和客户端浏览器中加入越来越多的功能。因此，Web\
    \ 应用程序的传统模式正日益显得不足。设计和编程模型上的根本性变革已刻不容缓。\n\n以目前的技术水平而言，业界需要的不仅仅是按照 Web 应用程序的传统指导原则和路线图设计出的改进型、更强大的平台——真正的范式转变势在必行。AJAX\
    \ 代表了下一代 Web 应用程序新范式的化身，这一范式很可能将持续至少未来十年。\n\n从更偏向开发者的角度来看，AJAX 泛指一套开发组件、工具和技术，用于创建高度交互的\
    \ Web 应用程序，为用户提供更优质的体验。根据 AJAX 范式，Web 应用程序通过与 Web 服务器交换数据而非页面来工作。从用户的角度来看，这意味着实现更快的往返传输，更重要的是，页面加载和刷新显著减少。因此，Web\
    \ 应用程序开始类似于经典的桌面 Microsoft Windows 应用程序，并拥有诸如拖放和异步任务、高度响应且无闪烁的用户界面等高级功能，以及其他能够最大程度减少用户挫败感、及时反馈当前状态并提供出色的混搭内容的功能。（且慢！这并不意味着\
    \ AJAX Web 应用程序*与桌面应用程序完全相同*；它们只是支持更多类似桌面的功能而已。）\n\n### 范式转变\n\nAJAX 是激发新一代组件和框架的哲学，每个组件和框架都旨在针对特定平台、提供给定功能集，并可能与现有框架无缝集成。Microsoft\
    \ ASP.NET AJAX Extensions 是针对 ASP.NET 2.0 平台的 AJAX 扩展。在 .NET Framework 平台的下一个主要版本中，ASP.NET\
    \ AJAX Extensions 将正式融入 ASP.NET 以及其余 Microsoft Web 平台和应用程序模型。下一版本的 Microsoft Visual\
    \ Studio（代号为 \"Orcas\"）也将集成针对 AJAX 特定功能的专用设计时支持。\n\n在本章中，我将更深入地探讨 AJAX 背后的动机和推动力量，然后回顾所有\
    \ AJAX 框架通用的基本系统要求。\n\n我们都正在见证并贡献于一个有趣而独特的现象——Web 正在我们眼前经历一次划时代的变革，这是由我们的行动所导致的。尽管听起来可能有些极端，但\
    \ Web 彻底革新了应用程序的概念。仅仅八年前，大多数开发者认为应用程序是一个过于严肃的东西，不能将其简化为脚本和标记代码的无序混合。在 20 世纪 90\
    \ 年代末，开发应用程序的代价是汗水、心血、泪水和无尽的调试工作。根据普遍且半认真的看法，编写 Web 应用程序对\"真正的\"程序员来说既无荣誉也无名声。\n\
    \n![](img/db82dc55683fa403b8b16b76eb00cc2e_14_0.png)\n\n> **注意** 然而，在 20 世纪 90\
    \ 年代末，许多网站被设计并建立起来。其中一些在随后几年里惊人地成长为当今世界经济的中流砥柱，甚至改变了我们处理日常事务的方式。想要一些例子吗？Google、Amazon、eBay。尽管如此，十年前构建这些及其他应用程序的人们算是某种前卫开发者，或许只是聪明且爱玩的业余爱好者。\n\
    \n从那时起，Web 已经发生了显著的演变。尽管 10 年的 Web 演变在服务器端构建了厚厚的抽象层，但它并没有改变基本的基础设施——HTTP 协议和页面。\n\
    \n最初的基础设施——简单、无处不在且有效——是 Web 应用程序模型快速成功的主要因素。下一代 Web 应用程序仍将基于 HTTP 协议和页面。然而，页面的内容和服务器端机制的能力将发生变化，以提供显著更丰富的用户体验——丰富到与经典桌面\
    \ Windows 应用程序相媲美。\n\n> **注意** 正如我们将在第八章\"使用 ASP.NET 构建 AJAX 应用程序\"中更详细地看到的，AJAX\
    \ 应用程序有许多优点，但也有一些缺点。总体而言，选择 AJAX 应用程序而非经典 Web 应用程序只是一个权衡 trade-off 的问题。AJAX 应用程序当然能为用户提供持续的反馈，永远不会因为某些远程操作而显得卡顿。另一方面，AJAX\
    \ 应用程序并不完全像桌面应用程序，它们在图形、多媒体和硬件控制方面的能力不如普通的（智能）客户端。归根结底，AJAX 应用程序只是 Web 应用程序中非常特殊的一类；因此，它们可能需要一些代码重构才能达到预期的性能和效果。\n\
    \n### 经典 Web 应用程序\n\n如今，Web 应用程序通过将用户填写的表单提交给 Web 服务器，并显示 Web 服务器返回的标记来工作。浏览器与服务器之间的通信采用经典的\
    \ HTTP 协议。众所周知，HTTP 协议是无状态的，这意味着每个请求与下一个请求无关，且不会自动维护状态。（我们在 ASP.NET 等环境中熟知并使用的状态对象，不过是服务器编程环境提供的一种抽象。）\n\
    \n浏览器与 Web 服务器之间的通信通过\"表单\"进行。从用户的角度来看，转换通过\"页面\"发生。每个 originating 新服务器请求的用户动作都会导致一个全新的页面（或当前页面的更新版本）被下载并显示。\n\
    \n让我们进一步简要探讨这个模型，以 pinpoint 其缺点并揭示需要新模型的原因。\n\n### 通过表单发送输入\n\n基于地址栏中键入的 URL，浏览器向用户显示一个页面。页面最终由\
    \ HTML 标记组成，并包含一个或多个 HTML 表单。用户输入一些数据，然后指示浏览器将表单提交到一个操作 URL。\n\n通过操作系统中的本地域名系统（DNS）解析器，浏览器将指定的\
    \ URL 解析为 IP 地址并打开一个套接字。一个 HTTP 数据包通过网络传输到指定的目的地。该数据包包含表单及其所有字段。请求被 Web 服务器捕获，并通常转发给内部模块进行进一步处理。在流程结束时，准备一个\
    \ HTTP 响应数据包，并将浏览器的返回值插入到主体中。\n\n### 通过页面获取输出\n\n当请求一个例如 .aspx 资源时，Web 服务器将其转交给\
    \ ASP.NET 处理，并接收生成的 HTML 标记作为回报。生成的标记\n"
