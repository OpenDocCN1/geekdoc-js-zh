- md: "## The *ConfirmButton* Extender\n\nMany times, a safe approach to responding\
    \ to a user clicking a button is to ask the user for a confirmation for the operation\
    \ she's going to start. A common solution for implementing this behavior entails\
    \ that the ASP.NET page attach some script code to the button to pop up a JavaScript\
    \ message box with a confirmation message. The *ConfirmButton* extender greatly\
    \ simplifies this common task by making it declarative:\n\n```aspx\n<asp:Button\
    \ runat=\"server\" ID=\"Button1\" Text=\"Click me\" />\n```\n\n```aspx\n<act:ConfirmButtonExtender\
    \ ID=\"ConfirmButtonExtender1\" runat=\"server\"\n    TargetControlID=\"Button1\"\
    \n    ConfirmText=\"Are you sure you want to click this?\\nReally sure?\" />\n\
    ```\n\nThe *ConfirmText* property specifies the text of the message box being\
    \ displayed as the user clicks the button. Note that HTML entities can be used\
    \ in the text, but by design no HTML formatting, such as `<b>` or `<i>`, can be\
    \ used. You can, however, use entitized special characters. For example, you can\
    \ use `&#10;` to break the line and continue the text on the next line. The reason\
    \ for this lies in the JavaScript code for the *ConfirmButton*—it's using JavaScript's\
    \ *window.confirm*. Providing HTML formatting makes no sense because the confirmation\
    \ dialog box is basically a non-HTML Windows *MessageBox* call.\n\nInternally,\
    \ the *ConfirmButton* extender sets a handler for the *onsubmit* event of the\
    \ form and swallows the event if the user doesn't confirm the operation. Only\
    \ controls that implement the *IButtonControl* interface can be used with the\
    \ extender, including *LinkButton* and *ImageButton* controls. (See Figure 5-11.)\n\
    \n![Figure 5-11 The *ConfirmButton* extender in action](img/db82dc55683fa403b8b16b76eb00cc2e_82_0.png)\n\
    \n## The *MutuallyExclusiveCheckBox* Extender\n\nThe *MutuallyExclusiveCheckBox*\
    \ extender can be attached to any ASP.NET *CheckBox* control to make it part of\
    \ a group of logically related options. The extender implements a behavior that\
    \ looks a lot like a list of radio buttons—multiple options are available but\
    \ only one can be chosen. So what's the point of having a mutually exclusive set\
    \ of check boxes rather than a radio button list?\n\nA list of radio buttons can\
    \ be initially unselected, but once one option has been selected there's no way\
    \ for the user to return to the initial state of having all options unselected.\
    \ Returning to the original, completely unselected state is possible with the\
    \ *MutuallyExclusiveCheckBox* extender.\n\nThe idea is that you group a number\
    \ of check boxes under the same key. The extender then ensures that only one check\
    \ box with the specified key can be selected at a time:\n\n```aspx\n<h2>What Kind\
    \ of Experience Do You Have with ASP.NET?</h2>\n<asp:CheckBox runat=\"server\"\
    \ ID=\"chkBeginner\" Text=\"Beginner\" />\n<asp:CheckBox runat=\"server\" ID=\"\
    chkIntermediate\" Text=\"Intermediate\" />\n<asp:CheckBox runat=\"server\" ID=\"\
    chkExpert\" Text=\"Expert\" />\n\n<act:MutuallyExclusiveCheckBoxExtender runat=\"\
    server\" ID=\"Mutual1\"\n    TargetControlID=\"chkBeginner\"\n    Key=\"AspNetExpertise\"\
    \ />\n<act:MutuallyExclusiveCheckBoxExtender runat=\"server\" ID=\"Mutual2\"\n\
    \    TargetControlID=\"chkIntermediate\"\n    Key=\"AspNetExpertise\" />\n<act:MutuallyExclusiveCheckBoxExtender\
    \ runat=\"server\" ID=\"Mutual3\"\n    TargetControlID=\"chkExpert\"\n    Key=\"\
    AspNetExpertise\" />\n```\n\nIt can be argued that the same functionality could\
    \ have been applied to radio buttons instead of check boxes. Using check boxes\
    \ was the choice of developers, and it also provides a more consistent and expected\
    \ user interface. However, you can re-implement the behavior to use JavaScript\
    \ to allow the deselection of a radio button item.\n\n## The *ToggleButton* Extender\n\
    \nCheck boxes are graphical HTML elements visually represented by a pair of little\
    \ bitmaps (selected and unselected) plus companion text. Each browser can use\
    \ its own pair of bitmaps, thus resulting in the check boxes having a slightly\
    \ different look and feel. Most browsers, though, tend to represent check-box\
    \ buttons as square embossed buttons.\n\nThe *ToggleButton* extender provides\
    \ a way to simulate a check-box element that uses custom bitmaps. The extender\
    \ is applied to a *CheckBox* control, and it replaces the control with a completely\
    \ new markup block that uses custom images and provides the same behavior as a\
    \ standard check box:\n\n```aspx\n<act:ToggleButtonExtender ID=\"ToggleButtonExtender1\"\
    \ runat=\"server\"\n        TargetControlID=\"CheckBox1\"\n        ImageWidth=\"\
    19\"\n        ImageHeight=\"19\"\n        UncheckedImageUrl=\"DontLike.gif\"\n\
    \        CheckedImageUrl=\"Like.gif\" />\n```\n\n*ImageWidth* and *ImageHeight*\
    \ properties indicate the desired size of the images. Note that these attributes\
    \ are required. *UncheckedImageUrl* and *CheckedImageUrl* specify the images to\
    \ use when the check box is selected or not selected.\n\n## Pop-up Extenders\n\
    \nVirtually every Web developer has a sort of love/hate relationship with pop-up\
    \ windows. As a matter of fact, pop-up windows often greatly simplify a number\
    \ of tasks—especially modal dialog boxes. One of the nasty things about HTML pop-up\
    \ windows is that they are browser windows and require a page to navigate. The\
    \ pop-up extenders that ASP.NET AJAX Extensions has to offer, on the other hand,\
    \ do not require a new browser instance. Instead, they are limited to popping\
    \ up the content of any panel you indicate, with or without modality.\n\n## The\
    \ *HoverMenu* Extender\n\nThe *HoverMenu* extender is similar to the *PopupControl*\
    \ extender and can be associated with any ASP.NET control. Both extenders display\
    \ a pop-up panel to display additional content, but they do it for different events.\
    \ The *HoverMenu*, in particular, pops up its panel when the user moves the mouse\
    \ cursor over the target control. The panel can be displayed at a position specified\
    \ by the developer. It can be at the left, right, top, or bottom of the target\
    \ control. In addition, the control can be given an optional CSS style so that\
    \ it looks like it is in a highlighted state. (See Figure 5-12.)\n\n![Figure 5-12\
    \ The *HoverMenu* extender in action](img/db82dc55683fa403b8b16b76eb00cc2e_84_0.png)\n\
    \nThe *HoverMenu* extender is good for implementing an auto-display context menu\
    \ for virtually every ASP.NET control instance and for providing tips to fill\
    \ in some input fields. In Figure 5-12, for example, when the user hovers the\
    \ cursor over the text box, a list of suggestions appears to simplify the work.\n\
    \n```aspx\n<asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n\n<asp:Panel ID=\"\
    Panel1\" runat=\"server\" CssClass=\"popupMenu\">\n    <asp:RadioButtonList ID=\"\
    RadioButtonList1\" runat=\"server\"\n        AutoPostBack=\"true\"\n        OnSelectedIndexChanged=\"\
    RadioButtonList1_SelectedIndexChanged\">\n        <asp:ListItem Text=\"Dino Esposito\"\
    ></asp:ListItem>\n        <asp:ListItem Text=\"Nancy Davolio\"></asp:ListItem>\n\
    \        <asp:ListItem Text=\"Andrew Fuller\"></asp:ListItem>\n        <asp:ListItem\
    \ Value=\"\" Text=\"None of the above\"></asp:ListItem>\n    </asp:RadioButtonList>\n\
    </asp:Panel>\n```\n\n```aspx\n<act:HoverMenuExtender ID=\"HoverMenu1\" runat=\"\
    server\"\n    TargetControlID=\"TextBox1\"\n    HoverCssClass=\"hoverPopupMenu\"\
    \n    PopupControlID=\"Panel1\"\n    PopupPosition=\"Right\" />\n```\n\nThe *Panel1*\
    \ control defines a list of radio buttons, each containing a suggestion for filling\
    \ the text box. The *HoverMenu* extender targets the text box control and defines\
    \ *Panel1* as its dynamic pop-up panel. The *PopupPosition* property indicates\
    \ the position of the panel with respect to the target control. Likewise, other\
    \ properties not shown in the previous example code, such as *OffsetX* and *OffsetY*,\
    \ define the desired offset of the panel. The *PopDelay* sets the time (in milliseconds)\
    \ to pass between the mouse movement and the display of the panel. The *HoverCssClass*\
    \ can optionally be used to give the text box a different style when the hover\
    \ menu is on. It is interesting to look at the CSS class associated with the panel:\n\
    \n```css\n.popupMenu\n{\n    position:absolute;\n    visibility:hidden;\n    background-color:#F5F7F8;\n\
    }\n.hoverPopupMenu\n{\n    background-color:yellow;\n}\n```\n\nIt is key that\
    \ the *visibility* attribute of the panel is set to *hidden* just as with *CollapsiblePanel*\
    \ control; otherwise, the panel will display upon page loading and hidden immediately\
    \ afterwards.\n\nJust as for the *PopupControl* extender, to take full advantage\
    \ of the *HoverMenu* extender you need to place extended controls inside of an\
    \ *UpdatePanel* control. In this way, whenever the user clicks a radio button,\
    \ the panel posts back asynchronously and fires the *SelectedIndexChanged* event\
    \ on the server.\n\n```csharp\nvoid RadioButtonList1_SelectedIndexChanged(object\
    \ sender, EventArgs e)\n{\n    TextBox1.Text = RadioButtonList1.SelectedValue;\n\
    }\n```"
  mdcn: "\n## *ConfirmButton* 扩展器\n\n在许多情况下，响应用户点击按钮的安全做法是询问用户是否确认她将要开始的操作。实现这种行为的常见解决方案需要\
    \ ASP.NET 页面将一些脚本代码附加到按钮上，以弹出带有确认消息的 JavaScript 消息框。*ConfirmButton* 扩展器通过声明式方式极大地简化了这一常见任务：\n\
    \n```aspx\n<asp:Button runat=\"server\" ID=\"Button1\" Text=\"Click me\" />\n\
    ```\n\n```aspx\n<act:ConfirmButtonExtender ID=\"ConfirmButtonExtender1\" runat=\"\
    server\"\n    TargetControlID=\"Button1\"\n    ConfirmText=\"Are you sure you\
    \ want to click this?\\nReally sure?\" />\n```\n\n*ConfirmText* 属性指定用户点击按钮时显示的消息框文本。请注意，可以在文本中使用\
    \ HTML 实体，但按照设计不能使用 HTML 格式，例如 `<b>` 或 `<i>`。不过，您可以使用实体化的特殊字符。例如，可以使用 `&#10;`\
    \ 来换行并继续下一行的文本。原因在于 *ConfirmButton* 的 JavaScript 代码——它使用的是 JavaScript 的 *window.confirm*。提供\
    \ HTML 格式没有意义，因为确认对话框基本上是一个非 HTML 的 Windows *MessageBox* 调用。\n\n在内部，*ConfirmButton*\
    \ 扩展器为表单的 *onsubmit* 事件设置一个处理程序，如果用户不确认操作，则阻止该事件。只有实现了 *IButtonControl* 接口的控件才能与该扩展器一起使用，包括\
    \ *LinkButton* 和 *ImageButton* 控件。（见图 5-11。）\n\n![图 5-11 *ConfirmButton* 扩展器实际运行效果](img/db82dc55683fa403b8b16b76eb00cc2e_82_0.png)\n\
    \n## *MutuallyExclusiveCheckBox* 扩展器\n\n*MutuallyExclusiveCheckBox* 扩展器可以附加到任何\
    \ ASP.NET *CheckBox* 控件，使其成为一组逻辑相关选项的一部分。该扩展器实现的行为非常类似于单选按钮列表——有多个选项可用，但只能选择其中一个。那么，拥有一组互斥复选框而不是单选按钮列表的意义何在？\n\
    \n单选按钮列表最初可以是未选中状态，但一旦某个选项被选中，用户就无法返回到所有选项都未选中的初始状态。而使用 *MutuallyExclusiveCheckBox*\
    \ 扩展器，则可以恢复到最初完全未选中的状态。\n\n其思路是将多个复选框归组到同一个键下。然后，扩展器确保具有指定键的复选框在任何时候只能选中一个：\n\n\
    ```aspx\n<h2>What Kind of Experience Do You Have with ASP.NET?</h2>\n<asp:CheckBox\
    \ runat=\"server\" ID=\"chkBeginner\" Text=\"Beginner\" />\n<asp:CheckBox runat=\"\
    server\" ID=\"chkIntermediate\" Text=\"Intermediate\" />\n<asp:CheckBox runat=\"\
    server\" ID=\"chkExpert\" Text=\"Expert\" />\n\n<act:MutuallyExclusiveCheckBoxExtender\
    \ runat=\"server\" ID=\"Mutual1\"\n    TargetControlID=\"chkBeginner\"\n    Key=\"\
    AspNetExpertise\" />\n<act:MutuallyExclusiveCheckBoxExtender runat=\"server\"\
    \ ID=\"Mutual2\"\n    TargetControlID=\"chkIntermediate\"\n    Key=\"AspNetExpertise\"\
    \ />\n<act:MutuallyExclusiveCheckBoxExtender runat=\"server\" ID=\"Mutual3\"\n\
    \    TargetControlID=\"chkExpert\"\n    Key=\"AspNetExpertise\" />\n```\n\n有人可能会说，同样的功能也可以应用到单选按钮上，而不是复选框。这是开发者的选择，而且使用复选框也提供了更加一致且符合用户预期的界面。不过，你也可以使用\
    \ JavaScript 重新实现这种行为，以允许取消单选按钮项的选中状态。\n\n## *ToggleButton* 扩展器\n\n复选框是图形化的 HTML\
    \ 元素，视觉上由一对小位图（选中和未选中）和配套文本组成。每个浏览器可以使用自己的位图对，因此复选框的外观和感觉会略有不同。不过，大多数浏览器倾向于将复选框按钮表示为方形浮雕按钮。\n\
    \n*ToggleButton* 扩展器提供了一种模拟使用自定义位图的复选框元素的方法。该扩展器应用于 *CheckBox* 控件，并将该控件替换为一个全新的标记块，该标记块使用自定义图像并提供与标准复选框相同的行为：\n\
    \n```aspx\n<act:ToggleButtonExtender ID=\"ToggleButtonExtender1\" runat=\"server\"\
    \n        TargetControlID=\"CheckBox1\"\n        ImageWidth=\"19\"\n        ImageHeight=\"\
    19\"\n        UncheckedImageUrl=\"DontLike.gif\"\n        CheckedImageUrl=\"Like.gif\"\
    \ />\n```\n\n*ImageWidth* 和 *ImageHeight* 属性指示图像的期望大小。请注意，这些属性是必需的。*UncheckedImageUrl*\
    \ 和 *CheckedImageUrl* 指定复选框未选中和选中时要使用的图像。\n\n## 弹出扩展器\n\n几乎每个 Web 开发者对弹出窗口都存有一种爱恨交织的关系。事实上，弹出窗口通常能大大简化许多任务——尤其是模态对话框。HTML\
    \ 弹出窗口的一个棘手之处在于它们是浏览器窗口，需要一个页面来导航。而 ASP.NET AJAX 扩展提供的弹出扩展器则不需要新的浏览器实例。相反，它们仅限于弹出你指定的任何面板的内容，可以是模态的也可以是非模态的。\n\
    \n## *HoverMenu* 扩展器\n\n*HoverMenu* 扩展器类似于 *PopupControl* 扩展器，可以与任何 ASP.NET 控件关联。这两个扩展器都会显示一个弹出面板来展示额外内容，但它们针对的是不同的事件。*HoverMenu*\
    \ 特别之处在于，当用户将鼠标光标移到目标控件上时，它会弹出自己的面板。面板可以显示在开发者指定的位置。它可以位于目标控件的左侧、右侧、顶部或底部。此外，该控件可以应用可选的\
    \ CSS 样式，使其看起来处于高亮状态。（见图 5-12。）\n\n![图 5-12 *HoverMenu* 扩展器实际运行效果](img/db82dc55683fa403b8b16b76eb00cc2e_84_0.png)\n\
    \n*HoverMenu* 扩展器适合为几乎任何 ASP.NET 控件实例实现自动显示的上下文菜单，以及为填写某些输入字段提供提示。例如，在图 5-12 中，当用户将光标悬停在文本框上时，会出现一个建议列表来简化工作。\n\
    \n```aspx\n<asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n\n<asp:Panel ID=\"\
    Panel1\" runat=\"server\" CssClass=\"popupMenu\">\n    <asp:RadioButtonList ID=\"\
    RadioButtonList1\" runat=\"server\"\n        AutoPostBack=\"true\"\n        OnSelectedIndexChanged=\"\
    RadioButtonList1_SelectedIndexChanged\">\n        <asp:ListItem Text=\"Dino Esposito\"\
    ></asp:ListItem>\n        <asp:ListItem Text=\"Nancy Davolio\"></asp:ListItem>\n\
    \        <asp:ListItem Text=\"Andrew Fuller\"></asp:ListItem>\n        <asp:ListItem\
    \ Value=\"\" Text=\"None of the above\"></asp:ListItem>\n    </asp:RadioButtonList>\n\
    </asp:Panel>\n```\n\n```aspx\n<act:HoverMenuExtender ID=\"HoverMenu1\" runat=\"\
    server\"\n    TargetControlID=\"TextBox1\"\n    HoverCssClass=\"hoverPopupMenu\"\
    \n    PopupControlID=\"Panel1\"\n    PopupPosition=\"Right\" />\n```\n\n*Panel1*\
    \ 控件定义了一组单选按钮，每个按钮包含一个用于填充文本框的建议。*HoverMenu* 扩展器以文本框控件为目标，并将 *Panel1* 定义为其动态弹出面板。*PopupPosition*\
    \ 属性指示面板相对于目标控件的位置。同样，前面示例代码中未显示的其他属性，如 *OffsetX* 和 *OffsetY*，定义了面板所需的偏移量。*PopDelay*\
    \ 设置鼠标移动与面板显示之间经过的时间（以毫秒为单位）。*HoverCssClass* 可选地用于在悬停菜单处于活动状态时给文本框不同的样式。值得关注的是与面板关联的\
    \ CSS 类：\n\n```css\n.popupMenu\n{\n    position:absolute;\n    visibility:hidden;\n\
    \    background-color:#F5F7F8;\n}\n.hoverPopupMenu\n{\n    background-color:yellow;\n\
    }\n```\n\n面板的 *visibility* 属性必须设置为 *hidden*，这与 *CollapsiblePanel* 控件一样；否则，面板将在页面加载时显示，然后立即隐藏。\n\
    \n与 *PopupControl* 扩展器一样，要充分利用 *HoverMenu* 扩展器，需要将扩展控件放在 *UpdatePanel* 控件内部。这样，每当用户点击单选按钮时，面板会异步回传并在服务器上触发\
    \ *SelectedIndexChanged* 事件。\n\n```csharp\nvoid RadioButtonList1_SelectedIndexChanged(object\
    \ sender, EventArgs e)\n{\n    TextBox1.Text = RadioButtonList1.SelectedValue;\n\
    }\n```\n"
