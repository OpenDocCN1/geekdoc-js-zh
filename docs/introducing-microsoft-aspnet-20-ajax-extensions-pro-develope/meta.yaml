    \ method is called upon to link, say, the *highlightCssClass* on the JavaScript's\
    \ *FocusBehavior* class and the *HighlightCssClass* on the extender.\n\n```\n\
    protected override IEnumerable<ScriptDescriptor> GetScriptDescriptors(\n    Control\
    \ targetControl)\n{\n    ScriptBehaviorDescriptor descriptor;\n    descriptor\
    \ = new ScriptBehaviorDescriptor(\"IntroAjax.FocusBehavior\",\n        targetControl.ClientID);\n\
    \    descriptor.AddProperty(\"highlightCssClass\", this.HighlightCssClass);\n\
    \    descriptor.AddProperty(\"normalCssClass\", this.NormalCssClass);\n\n    return\
    \ new ScriptDescriptor[] { descriptor };\n}\n```\n\nThe binding between client\
    \ and server properties serves to have the client property set with the value\
    \ specified on the server. An extender should be seen as a pair of classes—one\
    \ server control class, and a JavaScript class that exposes the extender's object\
