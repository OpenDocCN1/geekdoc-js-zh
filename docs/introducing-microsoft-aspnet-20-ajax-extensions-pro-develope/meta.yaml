    \n    PreferredPasswordLength=\"12\"\n    HelpStatusLabelID=\"Label1\" />\n</act:PasswordStrength>\n\
    ```\n\nThe *Label1* control receives a message that suggests what to do to meet\
    \ password requirements. You can also keep this message hidden all the time and\
    \ display it on demand by clicking a button. In this case, you set two new properties:\
    \ *HelpHandlePosition* and *HelpHandleCssClass*. The former sets the display position\
    \ for the help icon; the latter styles the icon."
  - "[PAGE 106]\n\nPart II Adding AJAX Capabilities to a Site\n\n```\n<act:PasswordStrength\
    \ runat=\"server\">\n    <act:PasswordStrengthExtenderProperties TargetControlID=\"\
    TextBox1\"\n        DisplayPosition=\"BelowRight\"\n        PreferredPasswordLength=\"\
    12\"\n        HelpHandlePosition=\"RightSide\"\n        HelpHandleCssClass=\"\
    helpHandle\" />\n</act:PasswordStrength>\n```\n\nTo be precise, you set the icon\
    \ to display using the CSS style:\n\n```\n.helpHandle\n{\n    width:16px;\n  \
    \  height:14px;\n    background-image:url(images/Question.png);\n    overflow:hidden;\n\
    \    cursor:help;\n}\n```\n\nFigure 5-26 shows the final page.\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_106_0.png)\n\
    \n**Figure 5-26** The *PasswordStrength* extender in action with a help button\n\
    \n# The *Slider* Extender\n\nThe *Slider* extender allows you to morph a classic\
    \ *TextBox* into a graphical slider so that users can pick up a numeric value\
    \ from a finite range. You can set the orientation of the slider (horizontal or\
    \ vertical) and also make it accept a discrete interval of values—that is, only\
    \ a specified number of values within a given range. By default, the slider accepts\
    \ values in the 0 through 100 range.\n\n```\n<h2>Your age</h2>\n<asp:TextBox ID=\"\
    TextBox1\" runat=\"server\" />\n<hr />\n<asp:Label runat=\"server\" ID=\"Label1\"\
    \ />\n```"
  - "[PAGE 107]\n\n```\n<act:SliderExtender runat=\"server\" ID=\"SliderExtender1\"\
    \n    TargetControlID=\"TextBox1\"\n    BoundControlID=\"Label1\" />\n```\n\n\
    A value chosen using the slider is automatically persisted via a full or partial\
    \ postback. You can reference the value using the *TextBox* programming interface.\
    \ (See Figure 5-27.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_107_0.png)\n\n\
    **Figure 5-27** The *Slider* extender in action\n\n# ## The *TextBoxWatermark*\
    \ Extender\n\nThe *TextBoxWatermark* extender allows you to define default text\
    \ to display when the text box is empty. The extender takes care of showing and\
    \ hiding the text as required.\n\n```\n<h2>Watermark</h2>\n<br/>\n<asp:TextBox\
    \ ID=\"TextBox1\" runat=\"server\" />\n&nbsp;\n<asp:TextBox ID=\"TextBox2\" runat=\"\
    server\" />\n\n<act:TextBoxWatermarkExtender runat=\"server\" ID=\"TextBoxWatermark1\"\
    \n    TargetControlID=\"TextBox1\"\n    WatermarkText=\"Type First Name Here\"\
    \n    WatermarkCssClass=\"watermarked\" />\n<act:TextBoxWatermarkExtender runat=\"\
    server\" ID=\"TextBoxWatermark2\"\n    TargetControlID=\"TextBox2\"\n    WatermarkText=\"\
    Type Last Name Here\"\n    WatermarkCssClass=\"watermarked\" />\n```\n\nThe extender\
    \ uses the *TargetControlID* property to designate the target text box. The *WatermarkText*\
    \ property defines the text to display, whereas *WatermarkCssClass* indicates\
    \ the CSS style to apply to the watermark text. (See Figure 5-28.)"
  - "[PAGE 108]\n\nPart II  Adding AJAX Capabilities to a Site\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_108_0.png)\n\
    \nFigure 5-28  The TextBoxWatermark extender in action\n\n# The ValidatorCallout\
    \ Extender\n\nThe ValidatorCallout extender enhances the graphical capabilities\
    \ of existing ASP.NET validators. It displays the error message of a validator\
    \ using the balloon-style ToolTips of Windows XP. (See Figure 5-29.)\n\n![](img/db82dc55683fa403b8b16b76eb00cc2e_108_1.png)\n\
    \nFigure 5-29  The ValidatorCallout extender in action\n\nHere's how to use the\
    \ extender:\n\n```\n<table>\n<tr>\n    <td>Name:</td>\n    <td><asp:TextBox runat=\"\
    server\" ID=\"txtName\" /></td>\n</tr>\n<tr>\n    <td>Email:</td>\n    <td><asp:TextBox\
    \ runat=\"server\" ID=\"txtEmail\" /></td>\n</tr>\n</table>\n```"
  - "[PAGE 109]\n\n```\n<asp:Button runat=\"server\" ID=\"Button1\" Text=\"Submit\"\
    \ />\n<asp:RequiredFieldValidator runat=\"server\" ID=\"requiredName\"\n    ControlToValidate=\"\
    txtName\"\n    Display=\"None\"\n    ErrorMessage=\"Required Field Missing<br\
    \ />A name is required.\" />\n<asp:RequiredFieldValidator runat=\"server\" ID=\"\
    requiredEmail\"\n    ControlToValidate=\"txtEmail\"\n    Display=\"None\"\n  \
    \  ErrorMessage=\"Required Field Missing<br />Email address required.\" />\n<asp:RegularExpressionValidator\
    \ runat=\"server\" ID=\"regularEmail\"\n    ControlToValidate=\"txtEmail\"\n \
    \   Display=\"None\"\n    ValidationExpression=\"[a-zA-Z0-9.-]+\\@[a-zA-Z0-9.-]+\\\
    .\\w+\"\n    ErrorMessage=\"<b>Invalid Email</b><br />Please, enter a valid email\
    \ address\" />\n<act:ValidatorCalloutExtender runat=\"server\" ID=\"CalloutExtender1\"\
    \n    TargetControlID=\"requiredName\" HighlightCssClass=\"highlight\" />\n<act:ValidatorCalloutExtender\
    \ runat=\"server\" ID=\"CalloutExtender2\"\n    TargetControlID=\"requiredEmail\"\
    \ HighlightCssClass=\"highlight\" />\n<act:ValidatorCalloutExtender runat=\"server\"\
    \ ID=\"CalloutExtender3\"\n    TargetControlID=\"regularEmail\" HighlightCssClass=\"\
    highlight\" />\n```\n\n# Animation Extenders\n\nThe ACT comes with a full-fledged\
    \ framework for building animations over the Web, leveraging the capabilities\
    \ of rich browsers. The idea is to have an extensible set of animation blocks\
    \ that can be composed together and run either in sequence or in parallel. The\
    \ animations to be played are declaratively specified using XML.\n\n# The *Animation*\
    \ Extender\n\nThe *Animation* extender allows you to use the built-in animation\
    \ framework in a mostly declarative and codeless fashion. The extender plays specified\
    \ animations whenever a client event occurs on the target control. Supported events\
    \ include *load*, *click*, *mouseover*, and *mouseout*. Here's an example:\n\n\
    ```\n<act:AnimationExtender ID=\"AnimationExtender1\" runat=\"server\"\n    TargetControlID=\"\
    Panel1\">\n    <Animations>\n        <OnLoad>\n            <OpacityAction Opacity=\"\
    .2\" />\n        </OnLoad>\n        <OnHoverOver>\n            <FadeIn Duration=\"\
    .25\" Fps=\"20\"\n                    MinimumOpacity=\".2\" MaximumOpacity=\"\
    .8\" />\n        </OnHoverOver>\n        <OnHoverOut>\n            <FadeOut Duration=\"\
    .25\" Fps=\"20\"\n                    MinimumOpacity=\".2\" MaximumOpacity=\"\
    .8\" />\n        </OnHoverOut>\n    </Animations>\n</act:AnimationExtender>\n\
    ```"
  - "[PAGE 110]\n\nThe *Animations* tag fully describes the animation. It is made\
    \ up of a list of actions bound to specific events. In the above preceding example,\
    \ the events are *load*, *hover*, and *mouseout*. The tag *OnLoad* describes the\
    \ animation performed when the extended control is loaded. Tags *OnHoverOver*\
    \ and *OnHoverOut* describe what happens when the *hover* effect is to take place,\
    \ which is typically delayed from the actual *mouseover* and *mouseout* events.\
    \ To describe an animation, you use a combination of existing animation blocks:\
    \ fade-in, fade-out, opacity, pulse, move, resize, color interpolation, and scaling.\
    \ You can also specify actions using custom script. The sample code just shown\
    \ applies a slight opacity filter to the extended control upon loading and then\
    \ fades its area in when the mouse hovers over it and out of it. For more information\
    \ on built-in animation blocks, take a look at [http://ajax.asp.net/ajaxtoolkit/Walkthrough/AnimationReference.aspx](http://ajax.asp.net/ajaxtoolkit/Walkthrough/AnimationReference.aspx).\n\
    \n# The **UpdatePanelAnimation** Extender\n\nThe *UpdatePanelAnimation* extender\
    \ applies animation to a very specific situation where custom events need to be\
    \ handled–before and after an updatable region is refreshed. Using the extender\
    \ is as simple as defining an updatable panel in the page and adding the following\
    \ code for the extender:\n\n```\n<act:UpdatePanelAnimationExtender runat=\"server\"\
    \ ID=\"UpdatePanelAnimation1\"\n    TargetControlID=\"UpdatePanel1\">\n    <Animations>\n\
    \        <OnUpdating>\n            <Sequence>\n                <EnableAction AnimationTarget=\"\
    Button1\" Enabled=\"false\" />\n                <FadeOut AnimationTarget=\"Panel1\"\
    \ minimumOpacity=\".3\" />\n            </Sequence>\n        </OnUpdating>\n \
    \       <OnUpdated>\n            <Sequence>\n                <FadeIn AnimationTarget=\"\
    Panel1\" minimumOpacity=\".3\" />\n                <EnableAction AnimationTarget=\"\
    Button1\" Enabled=\"true\" />\n            </Sequence>\n        </OnUpdated>\n\
    \    </Animations>\n</act:UpdatePanelAnimationExtender>\n```\n\nAs you can see,\
    \ it is nothing more than an animation applied to panel-specific events such as\
    \ *OnUpdating* and *OnUpdated*. Before the update begins, the area that contains\
    \ the sensitive contents to update is faded out and a control, *Button1*, is disabled.\
    \ You use the *FadeOut* animation block for this purpose. In the preceding example,\
    \ *Panel1* is merely the HTML block that contains the *UpdatePanel* control.\n\
    \n```\n<div ID=\"Panel1\">\n    <asp:UpdatePanel ID=\"UpdatePanel1\" runat=\"\
    server\" ...>\n        ...\n    </asp:UpdatePanel>\n</div>\n```"
- md: ' The *EnableAction* animation block declaratively disables the specified control
    during the update. In Chapter 4, you learned how to accomplish the same thing
    programmatically—the extender now provides a declarative approach.


    Once the region has been updated, you run a *FadeIn* animation to bring the panel
    content back to its full colors and re-enable previously disabled controls using
    the *EnableAction*. The *Resize* animation can also be used to implement a sort
    of collapse/expand effect during the update: the panel closes, gets updated, and
    then unfolds to show its new contents. Imagination is your only limit. (See Figure
    5-30.)


    ## Conclusion


    No matter how many controls you have in your arsenal, you''ll likely be always
    lacking just the one that is crucial for your current work. That''s why the extensibility
    model of ASP.NET has been so successful over the years, and that''s why so many
    component vendors crowd the market with excellent product offerings.


    Anyway, always deriving new controls from existing ones might not necessarily
    be a wise strategy. A new control is required for a significant piece of server
    and client code that can be used to back up a good chunk of user interface. If
    you only need to filter the values in a text box, a custom text box control is
    hardly the best option. But until the arrival of ASP.NET AJAX and the AJAX Control
    Toolkit, there was no other way out.


    With control extenders, you define the concept of a "behavior" and work with it
    as a distinct entity set apart from classic server controls. Extenders are server
    controls, but they work on top of bound controls and improve their overall capabilities
    by adding a new behavior.


    An extender doesn''t necessarily have to be an AJAX control. However, in the implementation
    of the AJAX Control Toolkit all extenders require a script manager, inject a good
    quantity of script code into the client pages, and take advantage of the client
    JavaScript library.


    To take advantage of extenders and controls in the ACT, you don''t have to import
    the binaries into your application. The ACT is an open-source project and, according
    to the license agreement you accept when you download the assembly, it can be
    incorporated piecemeal in your applications. This means, for example, that you
    can import only a few components through their source code and perhaps even adapt
    the code to your specific needs.


    With this overview of controls and extenders, and armed with a strong knowledge
    of partial rendering, we''re now ready to tackle an alternative programming model
    in ASP.NET AJAX—making remote procedure calls over the Web.'
  mdcn: "\n *EnableAction* 动画块以声明方式在更新期间禁用指定的控件。在第 4 章中，你已经了解了如何通过编程方式实现相同的功能——而扩展器现在提供了一种声明式方法。\n\
    \n区域更新完成后，你执行一个 *FadeIn* 动画，将面板内容恢复到完整的颜色，并使用 *EnableAction* 重新启用先前禁用的控件。*Resize*\
    \ 动画也可用于在更新期间实现一种折叠/展开效果：面板关闭，完成更新，然后展开以显示其新内容。想象力是你唯一的限制。（参见图 5-30。）\n\n## 结论\n\
    \n无论你拥有多少控件，你可能总是缺少一个控件，即对当前工作至关重要的那一个。这就是为什么 ASP.NET 的可扩展性模型多年来一直如此成功，以及为什么如此多的组件供应商涌入市场，提供出色的产品。\n\
    \n然而，总是从现有控件派生新控件并不一定是一个明智的策略。新控件需要大量的服务器端和客户端代码来支撑大部分用户界面。如果你只需要过滤文本框中的值，自定义文本框控件绝对不是最佳选择。但在\
    \ ASP.NET AJAX 和 AJAX Control Toolkit 出现之前，没有其他出路。\n\n借助控件扩展器，你可以定义\"行为\"的概念，并将其作为一个与经典服务器控件截然不同的实体来处理。扩展器是服务器控件，但它们在绑定控件之上工作，通过添加新行为来增强其整体功能。\n\
    \n扩展器不一定非要是 AJAX 控件。然而，在 AJAX Control Toolkit 的实现中，所有扩展器都需要脚本管理器，向客户端页面注入大量脚本代码，并充分利用客户端\
    \ JavaScript 库。\n\n要利用 ACT 中的扩展器和控件，你不必将二进制文件导入到你的应用程序中。ACT 是一个开源项目，根据下载程序集时接受的许可协议，它可以分段整合到你的应用程序中。这意味着，例如，你只需通过源代码导入几个组件，甚至可以根据特定需求调整代码。\n\
    \n有了对控件和扩展器的这番概述，以及扎实的部分呈现知识，我们现在准备好应对 ASP.NET AJAX 中的另一种编程模型了——通过 Web 进行远程过程调用。\n"
