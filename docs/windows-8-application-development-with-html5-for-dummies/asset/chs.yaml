  \n如果你像我一样，已经在你的网站上使用了 Google AdSense 好几年了。现在，我的博客流量并不大，我也不为了这些书而把网站变现，但我每月能赚大约 20\
  \ 美元，足够支付托管费和我授权的图片之类的费用。\n\nGoogle AdSense 在 Windows 8 中运行良好。因为它是外部内容，所以你需要在 `package.appxmanifest`\
