  ```\n\n3. 在 `package.appxmanifest` 中，点击 Content URI 选项卡并添加 AdSense 分发点的 URL。我的看起来就像图\
  \ 16-4。\n\n4. 在你想显示广告的页面上添加一个 `iframe`，并引用你刚刚添加到项目中的代码。\n\n砰，你完成了。因为你是在使用 HTML5，所以你可以按照设计的方式直接这些工具。如果你在内容\
