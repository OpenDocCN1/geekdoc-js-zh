  \ 对象表示法（JSON）的。不要去找“Add Column”按钮——根根没有这个。\n\n信不信，就这样。你已经准备好运行了。\n\n## 连接你的 Windows\
  \ Store 应用\n\n你的下一步是告诉 Visual Studio 你在做什么。创建一个将笔记存储在云端的快速易应用。\n\n1. 打开 Visual Studio\
  \ 并创建一个新的空白 JavaScript Windows 8 应用。我将我的应用命名为 `CloudNotes`。\n2. 右键点击 References\
  \ 项目并选择 Add。按照我在图 15-4 中所示添加 Mobile Services。\n3. 你可能需要在 HTML 文件中手动引用服务。这是 `html`\
  \ 的内容：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\"\
  \ />\n    <title>CloudNotes</title>\n    <!-- Mobile Services -->\n    <link href=\"\
  css/default.css\" rel=\"stylesheet\" />\n    <script src=\"default.js\"></script>\n\
  </head>\n<body>\n    <p>内容在这里</p>\n</body>\n</html>\n```\n\n4. 在 Azure 门户中，将表名改为\
  \ `Notes`，因为那是我们的表名。\n5. 获取第 2 步的代码并粘贴到 `default.js` 中，位于 `app` 和 `activation` 声明下方。\n\
  6. 获取第 3 步的小代码块并粘贴到 `app.activated` 事件中。\n\n```javascript\n(function () {\n    \"\
  use strict\";\n    WinJS.Binding.optimizeReferences = true;\n    var app = WinJS.Application;\n\
  \    var activation = Windows.Application.Activation;\n    var client = new Microsoft.WindowsAzure.MobileServices.ServiceClient(\n\
  \        \"https://pointnotepad.azure-mobile.net/\",\n        \"ThisIsMyPrivateKeyPleaseSureDontLose\"\
  \n    );\n\n    app.onactivated = function (args) {\n        var item = { text:\
  \ \"Awesome item\" };\n        client.getTable(\"Notes\").insert(item);\n    };\n\
  \n    app.start();\n})();\n```\n\n![remember.eps](img/remember_fmt.png) Mobile Services\
  \ 调用第三个参数是服务的私钥。这是一个密码。不要丢失它、通过邮件发送它、粘贴到论坛帖子或留在 PasteBin 上。如果你这样做了，别人就能窃取你的数据。坏消息，就是这样。此外，确保使用你自己的密钥。它在\
  \ Azure 门户中。\n\n### 使用服务运行你的应用\n\n这是困难的部分。\n\n按下 F5。\n\n屏幕上不会变化，但回到 Azure 管理门户，点击\
  \ Data 标签。然后点击 `Notes` 表。你应该看到类似图 15-5 的内容。数据已被添加，甚至带有一个新列。简直令人惊讶。\n\n这对你意味着什么？毫不费力，你就为自己的应用添加了一个全面的数据库后端，而且完全不需要后端数据库设计。坐下来思考一会儿。\n\
  \n好了吗？很好。\n\n\n\n\n\n这意味着如果你在 Store 中有一个在本地存储数据的 App，你可以将其更改为存储在 Azure 中，根据 App\
  \ 的复杂度，总共只需要 10 到 30 行代码。\n\n**图 15-5：** 查看我们的新数据。\n\n![9781118173350-fg1505.tif](img/9781118173350-fg1505_fmt.png)\n\
  \n## 进一步提升\n\n现在你已经在 Mobile Services 中有了一些数据。你也需要从中提取一些数据。\n\n我首先从向 `Notes` 表中添加几条记录开始。我采用的是廉价的方法，通过在\
  \ `Text` 字段中使用不同的值并重新运行演示程序。如果你愿意，也可以尝试一下 Mobile services 的 `Scripting` 功能。它非常酷炫。\n\
  \n然后，我在 `default.html` 页面中放入了一个 `ListView`。我在这里没有设置 `itemDataSource`；我稍后会在代码中设置它。\n\
  \n```html\n<!DOCTYPE html>\n<html\n<head>\n    <meta charset=\"utf-8\" />\n    <title>CloudNotes</title>\n\
  \    <!-- WinJS references -->\n    <link href=\"//Microsoft.WinJS.1.0/css/ui-dark.css\"\
  \ rel=\"stylesheet\" />\n    <script src=\"//Microsoft.WinJS.1.0/js/base.js\"></script>\n\
  \    <script src=\"//Microsoft.WinJS.1.0/js/ui.js\"></script>\n    <script src=\"\
  /MobileServicesJavaScriptClient/MobileServices.js\"></script>\n    <!-- CloudNotes\
  \ references -->\n    <link href=\"/css/default.css\" rel=\"stylesheet\" />\n  \
  \  <script src=\"/js/default.js\"></script>\n    <script type=\"text/javascript\"\
  >WinJS.UI.processAll();</script>\n    <script src=\"sampleData.js\" type=\"text/javascript\"\
  ></script>\n</head>\n<body>\n    <div class=\"sampleListViewItemTemplate\" data-win-control=\"\
  WinJS.Binding.Template\">\n        <div>\n            <div data-win-bind=\"innerText:text\"\
  >      </div>\n        </div>\n    </div>\n    <div data-win-control=\"WinJS.UI.ListView\"\
  \ id=\"SampleDataList\" data-win-options=\"{itemTemplate:select('.sampleListViewItemTemplate')}\"\
  ></div>\n</body>\n</html>\n```\n\n在后端 JavaScript 中，我将使用 `getTable.read()`，这是一个异步函数。它会从我的表中获取\
  \ JSON，并允许我创建一个绑定列表。\n\n```javascript\n(function () {\n    \"use strict\";\n   \
  \ WinJS.Binding.optimizeBindingReferences = true;\n    var app = WinJS.Application;\n\
  \    var activation = Windows.ApplicationModel.Activation;\n    var client = new\
  \ Microsoft.WindowsAzure.MobileServices.MobileServiceClient(\n    \"https://pointnotepad.azure-mobile.net/\"\
  ,\n    \"UQumkjaBjjGlgcmvDrrcLKKZtzcudr53\");\n    var bindingData;\n    app.onactivated\
  \ = function (args) {\n        client.getTable(\"Notes\").read().done(function (result)\
  \ {\n            bindingData = new WinJS.Binding.List(result);\n            document.getElementById(\"\
  SampleDataList\").dataSource = bindingData;\n        });\n    };\n    app.start();\n\
  })();\n```\n\n\n\n\n\n如果你编写了一个可以 ping 通服务器并报告结果的应用程序（例如最近在商店上架的 Ping 应用），你就拥有了广告商渴望的受众。如果你是为跑步者、天文学家或电影爱好者开发应用程序，情况也是如此。事实证明，如果你知道你的受众是谁，公司就可以针对他们投放广告。坦率地说，这样会让每个人都更顺心。\n\
  \n这就是为什么 Google AdWords 如此流行。。例如，如果你正在搜索 SQL Server，你会看到关于 SQL Server 工具、托管和书籍的广告。如果你正在搜索电影并开启了位置信息，你甚至会在广告中看到本地列表。\n\
  \n不过，这存在隐私问题。如果广告商存储这些关于用户的信息，以便在互联网上“跟踪”他们（包括通过连接的应用程序），人们就会变得不耐烦。我知道我是这样的。我在这里介绍的两个广告\
  \ API 很好地避免了这一点：`MSN` 和 `Google`。\n\n## 确定你的运行情况\n\n各种指标都用于判断广告活动是否有效。在本章的代码和描述中，你将看到的一些术语包括\n\
  \n![check.png](img/check.png) 广告格式：广告商购买的广告类型（例如，图像、视频、富媒体）。\n\n![check.png](img/check.png)\
  \ 广告尺寸：以像素为单位广告尺寸（例如，`300X250`）。\n\n![check.png](img/check.png) 展示次数 (Impression)：广告单元的查看次数。\n\
  \n![check.png](img/check.png) UUs：在给定时间内看到广告展示的唯一用户。\n\n![check.png](img/check.png)\
  \ 广告库存：你的应用程序上可用的广告展示量或数量。\n\n![check.png](img/check.png) 收益率 (Yield)：从广告库存产生的收入；通常以每次展示的收入来衡量。\n\
  \n这些概念与广告商用于确定广告活动运行情况的指标直接相关。其中一些指标包括\n\n![check.png](img/check.png) CPM：千次展示成本；当用户看到广告时，广告商支付费用。\n\
  \n![check.png](img/check.png) CPC：单点击成本；当用户点击广告时，广告商支付费用。\n\n![check.png](img/check.png)\
  \ CPA：单转化成本；当用户完成特定操作时，广告商支付费用。\n\n![check.png](img/check.png) CTR：点击率；广告点击次数除以该广告的投放展示总数。\n\
  \n![check.png](img/check.png) CVR：广告转化率，通常以百分比表示，计算方法为广告转化次数除以点击次数再乘以 100。\n\n所有这些因素共同回答了问题“我通过这个赚钱了吗？”。我写不出比《Microsoft\
  \ Advertising 应用内广告 101》白皮书中找到的答案更好的答案了，所以我直接在这里复述一遍：\n\n“你的广告收入或收益率取决于广告商每次广告展示支付的金额，以及广告商购买的展示次数。对受众人口统计数据和使用行为的了解有助于广告商提供相关的广告，并提高你应用程序广告展示的价值。广告商为了接触这类受众，每次展示支付特定的成本。这种成本被称为\
  \ `CPM` 或千次展示成本。广告商有机会按此价格购买你的广告。开发者的目标是仔细监控广告活动以获得最佳收益。调整广告类型和尺寸可能有助于提高广告收益。提供准确的受众人口统计信息和使用具有吸引力的广告格式也可能有效。”\n\
  \n## Windows 8 Ads SDK\n\n理论够了。是时候让广告跑起来了。\n\n当微软宣布 Windows 8 时，他们也悄悄引入了 Microsoft\
  \ Advertising，这实际上是 `Google AdWords` 的一个副本。你不能怪他们——`AdWords` 无疑是目前最好、最流行的广告网络。很多人每天都通过他们的\
  \ Android 应用程序和网站使用它赚钱。\n\n我不认为微软会无法作为第二个入场的的产品获得成功。它的职业生涯就是观察他人的创新并完善模型以供自己所用。我打算尝试一下\
  \ Microsoft Advertising。\n\n## 开始上手\n\n以下是开始使用的三个步骤。\n\n1.  在 [`pubcenter.microsoft.com`](http://pubcenter.microsoft.com)\
  \ 注册。你可以使用你的 `Live ID` 登录，但在验证后你需要创建一个 `pubCenter` 账户——不要让这困扰到你。本就应该是这样的。\n2.  填写你的个人信息。\n\
  3.  添加广告单元。这是你为应用程序设置所需广告的地方。你可以有多个这样的单元。在图 16-2 中，我为 `POINTtodo` 添加了一个右侧直塔广告。这种设置为我提供了将广告添加到代码中所需的注册代码。\n\
  \n**图 16-2：** 创建新的广告单元。\n\n![9781118173350-fg1602.tif](img/9781118173350-fg1602_fmt.png)\n\
  \n4.  为你的目标投放广告选择类别。该工具允许你选择想要投放广告的产品类别，而不是使用搜索术语。\n5.  记下页面底部的 `ApplicationId`\
  \ 和你的 `App Unit ID`。\n6.  下载并安装 Microsoft Ad SDK。你可以在 [`http://advertising.microsoft.com/windows\
  \ advertising/developer`](http://advertising.microsoft.com/windowsadvertising/developer)\
  \ 下载 SDK。\n7.  将 Microsoft Ad SDK 添加到你的项目中。\n\n## 在项目中构建广告\n\n1.  确保在你的 `appxmanifest`\
  \ 中声明了 `Internet` 权限。\n2.  右键点击 `References` 文件夹并选择“添加 (Add)”。\n3.  在“添加引用 (Add\
  \ References)”对话框中，选择 `Microsoft Advertising SDK`。\n4.  在你的 `default.html` 文件的 `head`\
  \ 部分中，引用该 SDK。\n\n```html\n<script src=\"/MSAdvertising/ads.js\"></script>\n```\n\
  \n5.  在想要显示广告的页面 `body` 标签中，添加一个带有 `AdControl` 的 `div`。\n\n```html\n<div id=\"myAd\"\
  \ style=\"position: absolute; top: 53px; left: 0px; width: 160px; height: 600px;\
