  \ App 吸引用户，但对“更多相同的内容”收费是另一种明智的策略，而且通常疏远的人更少。卖广告不是赚钱的唯一方法。通过一个始终免费的 App 吸引用户，但对“更多相同的内容”收费是另一种明智的策略，而且通常疏远的人更少。\n\
  \n## 扩展计划\n\n选项几乎是无限的。事实上，你可以提出一种论点：永远不应该收费或接受广告——应用内购买是唯一的途径，因为它对每个人都是公平的。我发现这种论点没有什么错误。\n\
  \n## 准备你的应用购买\n\n在内部如何配置应用由你决定。在我的示例应用中，我有一个带有 MOTS 按钮（代表更多相同的内容）的标题栏，允许用户访问可购买的功能。如果用户点击，它会提示他们购买。如果他们已经购买了，就会进入该功能。\n\
  \n```html\n<body>\n  <p>内容在此处</p>\n  <div data-win-control=\"WinJS.UI.AppBar\">\n\
  </body>\n```\n\n\n\n\n\n```html\n<button data-win-control=\"WinJS.UI.AppBarCommand\"\
  \ data-win-options=\"{icon:’back’, id:’, label:’example’, onclick:null, section:’global’,\
  \ type:’button’}\"></button>\n<button id=’motsButton’ data-win-control=\"WinJS.UI.AppBarCommand\"\
  \ data-win-options=\"{label:’MOTS’, type:’button’}\"></button>\n</div\n</body>\n\
  ```\n\n## 2. 从激活代码中获取应用程序的许可信息。\n\n在激活时，你需要这些信息来判断用户是否购买了该功能。\n\n```javascript\n\
  currentApp = Windows.ApplicationModel.Store.CurrentAppSimulator;\nlicenseInformation\
  \ = currentApp.licenseInformation;\n```\n\n<tip>\n当然，如果你是在生产环境中运行，则应该使用 `CurrentApp`\
  \ 对象。\n```javascript\ncurrentApp = Windows.ApplicationModel.Store.CurrentAppSimulator;\n\
  ```\n</tip>\n\n## 3. 检查是否购买了 MOTS 功能。如果是，当用户点击按钮时，将他们引导至“应许之地”。如果没有，则引导他们去购买。\n\n\
  ```javascript\nif (licenseInformation.productLicenses.lookup(“motsFeature”).isActive)\
  \ {\n    document.getElementById('MOTS').onclick = AccessTheNewFeatureMethod();\n\
  }\nelse {\n    document.getElementById('MOTS').onclick = SendThemToTheStore();\n\
  }\n```\n\n## 4. 最后，提供 `SendTheToTheStore` 函数。该函数使用 Windows 8 的购买功能允许用户购买受限制的功能。以下是目前代码库的情况：\n\
  \n```javascript\n(function () {\n    \"use strict\";\n    WinJS.Binding.optimizeBindingReferences\
  \ = true;\n    var app = WinJS.Application;\n    var activation = Windows.ApplicationModel.Activation;\n\
  \    app.onactivated = function (args) {\n        if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n            if (args.detail.previousExecutionState !== activation.ApplicationExecutionState.terminated)\
  \ {\n                currentApp = Windows.ApplicationModel.Store.CurrentAppSimulator;\n\
  \                licenseInformation = currentApp.licenseInformation;\n         \
  \       if (licenseInformation.productLicenses.lookup(“motsFeature”).isActive) {\n\
  \                    document.getElementById('MOTS').onclick = AccessTheNewFeatureMethod();\n\
  \                }\n                else {\n                    document.getElementById('MOTS').onclick\
  \ = SendThemToTheStore();\n                }\n            }\n            args.setPromise(WinJS.UI.processAll());\n\
  \        }\n    };\n    function SendThemToTheStore() {\n        currentApp.requestProductAsync\
  \ (“motsFeature”).then(\n            function () {\n                // 他们购买了，开启它\n\
  \                document.getElementById('MOTS').onclick = AccessNewFeatureMethod();\n\
  \            },\n            function () {\n                // 他们没买，放情播放悲伤的号角吧\n\
  \            }\n        );\n    }\n    app.start();\n})();\n```\n\n### 添加购买 UI\n\
  \n不要忘记功能的 UI 必须位于你的应用程序中。许可存储在 Store 中，但功能本身必须已经存在。在这种情况下，无论 `MOTS` 按钮做什么，代码都必须存在于项目中。如果它是指向应用中另一个页面的链接，那么该页面也必须存在于项目中。\n\
  \n为了防止意外的权限提升（用户获取他们未付费的内容），我建议在页面加载之前检查许可情况。这不需要大费周章，但你永远不知道会发现哪些潜在的漏洞。\n\n###\
  \ 为你的应用程序设置 Store\n\n在第 14 章中，我提到了应用程序设置的“高级功能”部分。高级部分之一是应用内选项，这正是它们所在的地方。要销售某个功能，你需要将其作为产品添加并附加到你的应用上。这为它提供了一个小的独立许可，你可以在主应用的代码中使用\
  \ `licenseInformation` 对象对其进行检查。Windows 8 会在后台处理与 Store 的通信。\n\n要为应用内购买设置 Store，请在浏览器访问\
  \ [`https://appdev.microsoft.com/StorePortals`](https://appdev.microsoft.com/StorePortals)，并使用你的\
  \ Microsoft 账户凭据登录。选择要更改的应用项目，然后点击“高级功能”（Advanced Features）。\n\n在页面底部，你可以添加应用内报价。选择一个\
  \ App ID，它应该描述你所提供的具体内容，而不是一个通用的标签。例如：\n\n- `AtlantaTrackLevel` 而不是 `Level4`\n-\
  \ `BusinessTaxFormPackage` 而不是 `NewForms`\n- `DisableAdsPackage` 而不是 `Premium`\n\
  - `20ExtraRecordsOfStorage` 而不是 `BonusRecords`\n\n这出于两个原因：第一，这可以防止你自己混淆；第二，这是由人工审核的，是允许进入\
  \ Windows Store 的条件之一，你需要给他们关于你应用中各项功能用途线索。我在 POINTtodo 中添加了“禁用广告”功能，如图 16-7 所示。\n\
  \n你还需要选择价格层级——这些与应用定价的层级是相同的。你还可以选择时间范围，并让人们能够在限时间内获得某些功能。例如，我可以说：“只需 $1.49 即可购买三个月的无广告体验！”这是一个非常棒的优惠。\n\
  \n**图 16-7：** 添加应用内报价。\n\n在设置好 Store 账户后，你可以在代码中使用 `ProductId` 来检查报价是否已授权。然后你就可以将你的报价交付给客户了！\n\
  \n### 第五部分：十项\n\n在本部分 . . .\n当你的脑子里充满了编程精华，但缺乏良好的应用想法时，你可以随时参考“十项”。我将分享我最喜欢的十个应用想法，并列出我编写应用和本书时使用的资源列表。\n\
  \n# 第 17 章：十个应用想法\n\n### 本章内容\n\n- `快速启动`\n- `用精彩的内容吸引用户`\n- `利用服务`\n\n如果你已经读了这本书并练习了示例，你可能已经准备好开始了。但该从哪里开始呢？别担心：我带来了十个应用想法，足以激发你的开发灵感。\n\
  \n开始写代码吧！\n\n\n\n\n\nWindows 8 默认安装中包含一个使用 Bing 地图的地图。它其实很酷——它利用 GPS 或无线信号获取你的位置，并向你展示周围发生的情况。\n\
  \n你可以搜索位置并获取路线，甚至可以显示交通状况。作为一个地图应用，它非常出色。但在一个特定领域它表现不佳：你无法规划行程。\n\n你懂我的意思。你只是想去处理杂事，在途中某处停下吃午饭，最后回到家里。没有人为你规划路线、推荐沿线的午餐地点并提供导航吗？这就是你的挑战：\n\
  \n*使用 Bing 地图 API 让用户规划行程。*\n\n一个解决用户特定问题的应用在商店里总是很受欢迎。只要遵循设计指南，它就会表现出色。\n\n## 尽情游戏\n\
  \n这本书并不是关于游戏开发的。坦率说，Windows 8 平台的大多数游戏将由 `C++` 程序员使用现有的物理引擎构建，这远远超本书的范围。\n\n不过，这只是大多数游戏。可以说最流行的\
  \ `HTML5` 游戏，我与其中一个转换为 `WinJS` 的人员合作过，并发现某些类型的游戏非常适合 `HTML5` 实现。所以这里的挑战是：\n\n*写一个游戏！*\n\
  \n不，我没有任何主意。对于我的游戏（`Proton`），我实际上从一位才华的游戏开发者（Andy Looney）那里获得了一个游戏创意，并问他是否可以以此制作一个游戏。他同意了，剩下的就是历史了。\n\
  \n## 阅读你想读\n\n博客阅读器对于 Windows 8 来说是一个非常简单的想法，事实上它是 Chris Sells 在 2011 年为 Windows\
  \ 8 开发者预览版最初写的第一个“Hello, World”。\n\n根据其提供的内容类型，专门设计用于阅读特定分发内容的工具是一个非常很棒的主意。也许是一个内置视频播放器的电影评论博客阅读器，或者是一个内置笔记本的作家想法博客——之类的工具。挑战是？\n\
  \n*构建一个专注于消费 RSS 或 Atom 内容的独特应用。*\n\n## 整理你的物品\n\n我不知道你们怎么想，但我怀念文件系统的关注。当这个操作系统成为我的主系统时，我感觉我可能无法找到任何东西。所以我挑战你：*\n\
  \n*编写一种在 SkyDrive 上存放数字资产的方法。*\n\n实际上，它甚至不必是 `SkyDrive`。即使是一个 `Dropbox` 或 `Wuala`\
  \ 客户端也会很好。但一个能让我以合理的存储系统存储日志文件、电子书和笔记等非传统资产的工具。\n\n我会毫无疑问地购买这样的应用。\n\n## 用照片绘画\n\
  \nInstagram 让全球蓬勃发展的摄影师们拍摄出完美的照片，并将它们转化为具有颗粒感的“艺术”作品，与朋友和家人一起分享。我投票建议你更进层楼：\n\n\
  *构建一个使用滤镜让照片瞬间看起来像画作的应用。*\n\n网上有许多精妙的代码片段可以帮助你处理数字照片。在 `SourceForge` 上，我轻松找到了四个项目，可以将照片变得看起来像画布上的油画。\n\
  \n将它与第 13 章中出色的设备管理工具相结合，你就大功告成了。\n\n## 管理你的业务\n\nWindows 8 不仅仅是为了把应用放到商店里并赚大钱。有时你还得让老板开心。\n\
  \n企业经理有大量信息需要管理。我想读这本书的你们中有些人（如果不是所有人）曾担任过 bug 业务开发人员，你们知道报告是一件大事。\n\n数字列表并不像人们想象中那么有用。真正帮助人们的是生动的、令人记忆的数据图像。Windows\
  \ Store 风格定位独特，恰恰可以提供这种。因此，你的挑战是\n\n*创建一个企业信息仪表板。*\n\n承认这个应用与这里的其他一切完全不同。它假设你有数据访问权限以及处理此类项目的时间和可用性。但对于拥有那种环境的\
  \ 10% 的人，考虑一下吧！\n\n## 保持健康\n\n在发布预览中，商店有一个整个医疗类别，但里面什么都没有。\n\n想改变这一点吗？你们至少应该应该尝试这个挑战：\n\
  \n*使用漫游存储在平板电脑、电脑和手机之间同步饮食和运动日志。*\n\n构建一个让用户输入健康数据并进行追踪的应用。我听过一位叫 Tottenkoph 的人关于“生物挖掘”的精彩演讲（在互联网上用\
  \ `Bing` 搜索），通过仔细追踪信息，你可以对自己、饮食和健康学到很多神奇的事情。\n\n构建一个此类这样的应用其实相当简单。这只是数据输入，数据输出。尝试一下！\n\
  \n## 购物\n\n购物世界已经改变了。亚马逊、`eBay` 以及其他电子商务巨头改变了我们购买从模型飞机到纸尿裤的一切物品。我的牙膏每月送一次货，免费，且价格只有杂货店的\
  \ 50%。\n\n无论是在买电视还是奶酪通面，在线比较都很重要。因此，我挑战你\n\n*使用购物 API 比较价格。*\n\n如果你想玩得高级一点，可以使用传感器\
  \ API 从扫描器获取条码并以这种方式查找。这将会是一个受欢迎的应用！\n\n## 第 18 章\n\n### 寻找示例和信息的十个地方\n\n在本章\n\n\
  - 发现超出容纳范围的内容\n- 深入使用模板\n- 寻找示例代码\n\n这本书只能到这里。它有这么多页面，新信息不断涌现。\n\n\n\n\n\n# 案例研究\n\
  \n## 资源\n\n![check.png](img/check.png) 最后一个非常赞酷——提供了包含最常见 Windows 8 模式的预制 Photoshop\
  \ 模板，方便自定义。这充分展示了微软如今为设计师提供的支持水平。此外，它为设计开发人员——那些跨越这两个领域的人才——提供了一个极佳的起点。\n\n## social.msdn.microsoft.com/forums\n\
  \n多年来，[`social.msdn.microsoft.com/forums`](http://social.msdn.microsoft.com/forums)\
  \ 上的 MSDN 论坛一直是获取未通过消费渠道支持的微软产品支持的首选地。如果你还没有这样做，请去那里使用你的 Live 账户设置一个论坛账户。这是一个非常好的资源。\n\
  \n对于大多数查询，你应该查看“使用 HTML5/JavaScript 构建 Windows Store 应用”论坛。我建议你将搜索过滤到该论坛；否则你将得到很多与\
  \ Internet Explorer 相关的虚假匹配结果。\n\n如果你想提问，这里就是合适的地方。目前，这里有一群微软员工坐镇，例如无伦比的 J.P. Sanders。在正式发布（General\
  \ Availability release）后，会有更多的社区成员（包括我在内）开始提供回复。\n\n## www.stackoverflow.com\n\n\
  当微软没有你想要的答案时（例如处理 Facebook 集成、jQuery 或高级 JavaScript 的复杂问题时），请尝试 [`www.stackoverflow.com`](http://www.stackoverflow.com)。\n\
  \nStack overflow 既有点像论坛，又有点像链接聚合，既像博客，又像维基，既像国家，又有点像摇滚乐（好吧，最后两个没那么像）。它是一个由用户维护、编辑和审核的专为程序员设计的问答网站。\n\
  \n它有自己的规则。在发布之前，请先搜索查看该主题是否已在其他地方讨论过——他们非常努力防止重复，并对此非常认真。在发布之前，请做好尽职调查，确保你正在寻找的内容不在网站上。\n\
  \n但请尽管发布。更重要的是，注册并参与。编程是一项团队运动，没有什么比 [`www.stackoverflow.com`](http://www.stackoverflow.com)\
  \ 更能体现这一点了。\n\n## jQuery.com\n\n你不必在你的 Windows 8 应用中使用 jQuery。我甚至没有在这本书中介绍它。尽管如此，在处理用户界面细节时，它可以让你的生活变得简单很多。通常情况下它是微软友好的——它甚至包含在默认的\
  \ ASP.NET 安装中。它可以显著降低你代码的整体复杂度。\n\n你可能会对 jQuery 的插件特别感兴趣。当我写这些内容时，插件网站正在开发中，所以我正在查看旧网站的存档。我希望当你读到这里时，新的插件网站已经完成了。\n\
  \n插件通常可以在 `plugins.jquery.com` 找到，它们只是利用 `jQuery` 作为平台的脚本。需要倒计时器吗？搞定。华丽的表单设置？有了。酷的滑出日历控件？有一打。`jQuery`\
  \ 插件真的可以为你节省大量精力和。\n\n## www.buildwindows.com\n\nBuild 是微软自 20 世纪 90 年代以来举办专业开发者会议（Professional\
  \ Developers Conference）的新名称。他们是在那里发布了 Windows 8，并将它于 2012 年 10 月推出。\n\nBuild 的每场演讲都有录音，音频和幻灯片都在\
  \ Build 网站上（[www.buildwindows.com`](http://www.buildwindows.com)）。这是一个绝对的信息宝库，必看，特别是对于高级主题。你可以从编写代码的人那里学习进程生命周期或实时磁（live\
  \ Tiles）等主题。\n\n## jsonformatter.curiousconcept.com\n\n这是一个奇怪的条目，但我几乎每天都用它，所以我想把它也放进来。\n\
  \n`JSON` 作为 Windows 8 的数据语言，在传输时通常没有换行符或制表符以节省空间。这使得调试非常困难。\n\n你可以从 Visual Studio\
  \ 的调试可视化器中复制 `JSON` 并将其粘贴到 `jsonformatter.curiousconcept.com`，然后就能得到格式化良好的 `JSON`。它甚至会进行验证，以确保你的括号全部对齐。这是一个非常棒且免费的工具。\n\
  \n## www.w3schools.com/js\n\n似乎每当我查询 JavaScript 语法问题时，我都能在 [`www.w3schools.com/js`](http://www.w3schools.com/js)\
  \ 网站找到结果。这是一个非常优秀的教程网站，拥有许多简单的示例，解释了 JavaScript 语言中的奇异点。\n\n还有一个 HTML 子站点，它的帮助稍微小一点，因为微软为了配合\
  \ WinRT 对 HTML 进行了很多调整，但层级样式表（CSS）的内容非常棒，与 Windows 8 配合非常好。总的来说，该网站应该在你的书签中占有一席。\n\
  \n## windowsteamblog.com\n\n如果你在为你的 RSS 阅读器寻找点东西，我推荐 Windows 团队博客。这个博客，特别是 [`windowsteamblog.com/windows/developers`](http://windowsteamblog.com/windows/developers)\
  \ 开发者博客，是获取微软如何构建 Windows 8、WinRT 和 WinJS 详细信息的必备资源。\n\n该网站还包含用户体验、业务、安全以及许多其他内容的博客。它是深度战略信息的金矿。今天就把它加入你收藏的阅读器吧！\n\
  \n## www.microsoftstore.com\n\n这正是我们都要去的地方，不是吗？\n\nWindows 商店（[www.microsoftstore.com`](http://www.microsoftstore.com/））是我们在本书中创建的应用销售的地方。它也是获取微软\
  \ Surface 或其他支持 Windows 8 的酷炫装备的良好起点。Windows 8 桌面应用可以从开始屏幕上点击 Store 来访问它，但它不止于此；务必去看看。\n\
  \n"
