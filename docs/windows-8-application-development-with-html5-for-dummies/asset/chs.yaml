  \n# 引言\n\n2000 年，我接了一个电话。一位图书出版社的编辑读了我关于微软 `.NET Live Services` 的文章。她想知道我能否为一本新的\
  \ `VB.NET` 书写一个关于网络服务的章节。\n\n“没问题，”我说，“这和 `VB6` 能有多大区别呢，对吧？”\n\n嗯，你们年纪大到记得 `.NET`\
  \ 革命的人知道这句话有多荒谬。`VB.NET` 改变了一切，我花了四周时间没睡觉，因为我不仅学习了一种新语言和框架，还学习了在微软世界中实现 `XML` 网络服务的新思维方式。\n\
  \n你手中的这本书也代表了一场类似的革命。\n\n这一次，变化发生在该老传统的 `Win32` 栈中。`WinRT` 是一个全新的 Windows 核心库，已经迟到了\
  \ 15 年。它让开发者对他们编写代码的硬件拥有前所未有的控制权。然而，这也是有代价。\n\n为了 `WinRT` 和新的 `Windows 8` 桌面应用编写代码，你需要像以前任何时候那样思考用户体验。微软遵循了\
  \ Google 和 Apple 的脚步，定义了应用如何与用户交互，以及用户如何与应用交互。\n\n当然，你仍然可以编写旧的 `Forms` 风格的应用。事实上，你仍然可以编写\
  \ `VB6` 应用并期望它在 `Windows 8` 上运行。但如果你想让应用出现在 `Microsoft Store` 中，让十亿酷用户立即访问，你就必须遵守规则。\n\
  \n幸运的是你，这些规则都在这本书里。\n\n## 谁应该读这本书\n\n`Windows 8` 是对 `Windows` 的重新想象。具体来说，它没有任何 `Windows`。你觉得怎么样？\n\
  \n显然，移动革命已经进入了家。尽管每卖出一台 `iPad` 还会卖出 10 台 `Windows` PC，但市场上仍然有很多 `iPads`，而且如果有选择，大多数人更倾向于使用平板电脑而不是\
  \ PC。\n\n微软从 `Windows XP` 时代就开始为平板电脑编写软件了。`XP` 和 `Office 2003` 中的手笔支持是非常卓越的。尽管如此，硬件还没有到位。\n\
  \nApple 推高了硬件障碍。Google 随其后。现在，微软准备好占据舞台中心。他们凭借十年的经验和行业内最好的工程师，让事情发生了。\n\n正在发生的事情就是你。\n\
  \n如果你准备好利用计算史上最大的开发者机会，那么你拿了正确的书。你阅读完这本书后编写的应用程序，到 2013 年底，通过简单的搜索就能被五十万用户看到。\n\n\
  那是世界上 `Apple` 用户数量的三倍多。\n\n在这些页面中，你将了解到微软试图通过 `Windows 8` 做的精髓，你学习了如何让你的应用想法在该系统中运行，并且你获得了让其成为现实所需的工具。作为作者，我的目标是让你的想法变为。\n\
  \n# 关于这本书\n\n`Windows 8` 开发现在可以第一次通过 `HTML` 完成。这正是本书的主题所在。\n\n你可以用 `C#` 或 `C++`\
  \ 编写 `Windows 8` 应用。`C#` 应用使用 `XAML` 构建，从设计上来说，它们比 `C++` 更具业务导向。`C++` 应用将是使用 `DirectX`\
  \ 的游戏开发者的领域。我没有涵盖任何一种。如果你是企业或游戏开发者，你将从书中受益，但它并不是为了提供你所需的一切。\n\n## 如何使用这本书\n\n这是我的第十本\
  \ `For Dummies` 系列书籍，也是我第三本从零开始编写的书籍。这一次，我认为我确保了你可以翻开书中的任何章节并开始工作。试试看。\n\n`For Dummies`\
  \ 系列的目标是让你获得成功。为了这一目标，这本书的设计确保你可以使用索引或目录，直接翻到你感兴趣的页面。然后你就可以开始工作了。\n\n## 愚的假设\n\n\
  为了为 `Windows 8` 构建软件，我假设你至少拥有 `Visual Studio 2012 Express`。该软件是全书的基础，并用于所有的示例。\n\
  \n好消息是它是免费的。是的。微软免费赠送编写 Windows Store 应用所需的工具。你可以从 [`msdn.microsoft.com/vstudio/express](http://www.msdn.microsoft.com/vstudio/express)\
  \ 下载。\n\n你使用这本书还需要对 `HTML`、`CSS` 和 `JavaScript` 有理解。我在书中完全没有教 `HTML5`。如果你需要这方面的帮助，我推荐\
  \ Andy Harris 写的 `HTML, XHTML, & CSS All-In-One For Dummies` 第二版（John Wiley and\
  \ Sons, Inc. 出版），作为构建 HTML 网站的指南。从那里开始，我将带你走向 `Windows 8`。\n\n噢，还有一件事。你需要学习意愿和一点耐心。你可能是一个\
  \ Web 开发者、移动开发者、`.NET` 开发者，或者只是有一个应用主意的人。针对如此多的潜在受众编写技术话题是困难的，所以有时你得对我包涵。\n\n\n\n\
  \n尽管如此，我还是建议从头到尾阅读一遍。关于 Windows 8 有很多值得学习的地方。这本书不会教你一切，但它会为你提供非常详实的信息储备。如果你从头到尾读完，你将在\
  \ HTML5 方面拥有极其丰富的 Windows 8 开发背景。\n\n# 本书的结构\n\n本书包含五个部分（Part）。\n\n### 第一部分：探索 Windows\
  \ 8\n为 Windows 8 编写代码与 `. . . 好 . . . 其他一切` 存在许多差异。这四章将提供理解这些变化所需的所有内容。\n\n### 第二部分：与外部交互\n\
  用户是 Windows 8 世界的中心，因此，用户界面通常是 Windows 8 应用的核心。在第二部分中，我将介绍你将使用的 `API`（应用程序编程接口）内置的所有各种用户界面功能。\n\
  \n### 第三部分：深入内部\n用户界面固然很好，但在某些时刻，你的应用必须执行某些操作。在这里，我将涵盖合约、网络、数据以及至关重要的程序周期。\n\n###\
  \ 第四部分：准备发布\n在你完成所有功能的开发后，需要进行细节微调并准备好进入商店。在第四部分中，我将介绍你可能没有想到的事情，例如与传感器集成、使用 `Azure`、广告以及应用内购买。当然，我也会讨论测试和实际发布。\n\
  \n### 第五部分：十之篇\n在“十之篇”中，如果你对开发应用充满渴望但缺乏想法，我将用十个应用主意帮你入门。你还将发现一份非常有用的列表，告诉你在哪里获取更多信息。\n\
  \n## 本书使用的图标\n\n在书书中，我使用以下图标来突出重要信息：\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 这个听起来很吓的图标标记了你在初次读本书时可以跳过的的技术信息。\n\n![tip.eps](img/tip_fmt.png) `Tip`（提示）图标强调了一个可以节省大量时间和精力的点。\n\
  \n![remember.eps](img/remember_fmt.png) 记住这些信息。它们很重要。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 尝试记住你遇到的任何 `Warning`（警告）信息。这些信息会在你意想不到的情况下袭击你，产生极难发现的 bug。或者，它们可能会带你误入歧途。\n\n\
  ## 本书使用的惯例\n\n在本书中，我使用了几种惯例来帮助你理解。非“真实单词”的术语（例如程序变量名）将以`这种字体`出现，以尽力减少混淆。你应该输入的文本采用**粗体**。新术语采用*斜体*。程序列表以这种方式与正文区分：\n\
  \n```\nuse System;\n\nnamespace MyNameSpace\n{\n  public class MyClass\n  {\n  }\n\
  }\n```\n\n每个列表后面都有一个巧妙且富有洞察力的解释。完整的程序包含在网站上供你欣赏；较小的代码段则没有。\n\n当你看到命令箭头时，例如指令“选择文件⇒打开方式⇒记事本”，你只需选择`File`（文件）菜单选项。然后，从出现的菜单中选择`打开方式`。最后，从生成的子菜单中选择`记事本`。\n\
  \n## 接下来该做什么\n\n去写应用吧。本书提供了构建甚至相当复杂应用所需的 80% 的内容，其余部分可以在第 18 章列出的额外资源中找到。书中的示例代码可以在\
  \ `dummies.com/go/windows8appdevhtml5fd` 找到。我说的，尽管去发挥创意吧！把你的应用上架微软商店。当你大富大贵时，记得我们这些小人物。\n\
  \n偶尔，我们会对技术类书籍进行更新。如果本书确实有技术更新，它们将发布在 `dummies.com/go/windows8 appdevhtml5fdupdates`。\n\
  \n# 第一部分\n### 探索 Windows 8\n\n![9781118173350-pp0101.eps](img/9781118173350-pp0101_fmt.png)\n\
  \n在本部分中 . . .\n\n“Windows 8 是 Windows 的重新构。”\n\n公司经常使用“重新构”（reimagining）这个词，但我很久没有看到它被用得如此准确。Windows\
  \ 8 真的是全新的。而且是不同的。为它编写代码也是新颖不同的。在这一部分中，我将展示如何从零开始 Windows 8 开发。\n\n# 第一章\n### 介绍\
  \ Windows 8\n\n### 本章内容\n\n![arrow](img/arrow.png) 掌握新的 Windows\n\n![arrow](img/arrow.png)\
  \ 让 Windows 快速上手\n\n![arrow](img/arrow.png) 决定使用哪种开发方式\n\n![arrow](img/arrow.png)\
  \ 确保你优先考虑用户\n\n\n\n\n一直缺失的是一种为专业程序员——或优秀的爱好者——提供的工具，让他们能够创建出既简单又漂亮的消费级程序。以前既没有工具，也没有相应的平台：人们只能独自摸索。\n\
  \n随着 Windows 8 的推出，微软正在改变现状。你可以通过观察 Xbox 和 Windows Phone 来预览他们的路线。苹果和谷歌正引领着追求精美单用户应用的热潮，而微软也正处于其中。\n\
  \n## 搞清楚微软将迈向何方\n\n但微软究竟是如何进入应用消费市场的？终点又在哪里呢？\n\n这个计划规模宏大且复杂，但通过只需关注核心内容，你就可以清晰地看到全貌。在本章的引言中，我提到了\
  \ Windows 世界中现 Windows 8 应用——Xbox 和 Windows Phone。图 1-1 展示了这者以及一台 Windows 8 平板电脑，它们之间的相似之处一而易见。\n\
  \n**图 1-1：** Windows 8 的真实场景示例。\n\n![9781118173350-fg0101.eps](img/9781118173350-fg0101_fmt.png)\n\
  \n仅仅通过观察这些应用就能看出微软正尝试做几件事：\n\n![check.png](img/check.png) 针对触控优化：无论是在 Windows Phone\
  \ 上使用手指，在 Xbox 上使用 Kinect，还是在 Windows 8 上使用手写笔——用户体验都是由触控驱动的。\n\n![check.png](img/check.png)\
  \ 让用户一次专注于一件事：看看你的 PC。每个应用程序都有菜单和状态栏。甚至操作系统本身也有菜单和状态栏！这种设计理念是通过在任务间轻松切换来提高生产力。这是多任务处理者的梦想。Windows\
  \ 8 并非如此：它完全专注于一次只做一件事。\n\n![check.png](img/check.png) 关注消费而非创作：这三个平台更多是为了阅读博客文章而非编写它们，更多是为了看电影而非制作电影。如果你想创作内容，请切换到桌面版。\n\
  \n这意味着我们所知的 Windows 桌面应用死了一了吗？完全没有。从实际上说，Windows 8 的体验是对常规 Windows 7 体验的补充。它其实只是一个增强版的开始菜单，可以运行自己的应用程序。\n\
  \n## 构建一个简单的 Hello World 应用\n\n在开始构建 Hello World 应用之前，请确保你已拥有这些基础要素：\n\n![check.png](img/check.png)\
  \ 一台带有输入机制的 Windows 8 设备，最好带有键盘和鼠标\n\n![check.png](img/check.png) Visual Studio\
  \ 2012\n\n![check.png](img/check.png) Expression Blend\n\nVisual Studio 运行在桌面端，尽管你从\
  \ Windows 8 开始屏幕访问它。图 1-2 显示了我平板电脑的 Windows 8 菜单，Visual Studio 图标位于右中央。点击它，开启你的之旅。\n\
  \n为了了解 Windows 8 应用是如何运作的，最好的办法是构建一个（非常）简单的应用。\n\n**图 1-2：** 我的 Windows 8 菜单屏幕。\n\
  \n![9781118173350-fg0102.tif](img/9781118173350-fg0102_fmt.png)\n\n基本上，使用 HTML5\
  \ 作为用户界面标记的 Windows 8 应用是由一个 HTML 文件、一个层叠样式表（CSS）文件和一个 JavaScript 文件构建的，这些文件被编译成一个包。虽然你可以直接将\
  \ Web 版 HTML 应用在 Windows 8 中运行，但如果你想利用任何 Windows 特有功能，你需要稍微做一些扩展。\n\n1. 点击 Windows\
  \ 8 菜单中的图标打开 Visual Studio。\n2. 点击右上角的 `New Project`（新建项目）开始一个新项目。你将看到 `New Project`\
  \ 对话，如图 1-3 所示。\n3. 在左侧的树形视图中，选择 `JavaScript`⇒`Microsoft Store`。\n4. 在右侧窗口中，选择 `Blank\
  \ App`（空白应用）。这为我们提供了新应用所需的基础要素。\n5. 在 `Name` 字段中输入 `Hello World`。\n6. 点击 `OK`。\n\
  \n**图 1-3：** 开始新项目。\n\n![9781118173350-fg0103.tif](img/9781118173350-fg0103_fmt.png)\n\
  \nVisual Studio 咕噜作响了一分钟，然后为你提供了 Windows 8 应用的基础文件。这些文件包含以下内容：\n\n![check.png](img/check.png)\
  \ `Default.html`：起始表单、页面、视图以及你用于 Windows 8 应用的内容。这是你布局表单的地方。\n\n![check.png](img/check.png)\
  \ `Default.css`（在 CSS 文件夹中）：该文件被 `Default.html` 引用。它是样式信息的起始位置。你在这里设置 HTML 文件中的字体、颜色和位置。\n\
  \n![check.png](img/check.png) `Default.js`（在 JS 文件夹中）：该 JavaScript 文件也被 `Default.html`\
  \ 引用。这是应用加载器查找如何启动应用提示的地方。所有的应用逻辑都放在 `.js` 文件中。\n\n![check.png](img/check.png) `HelloWorld_TemporaryKey.pfx`：用于签名应用的临时密钥。\n\
  \n![check.png](img/check.png) `Package.appmanifest`：应用的清单文件，包含了应用的元数据和配置。\n\n正如你所预期的，代码运行在\
  \ HTML 中。为了让它有一点感觉，我们需要一些 HTML 和 JavaScript：\n\n1. 在 `Default.html` 文件中，添加一个 ID\
  \ 为 `headline` 的 `<h1>` 标签。在 `<body>` 标签中添加该标签。生成的 HTML 应该是这样的：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <meta charset=\"utf-8\" />\n    <title>Hello_World</title>\n\
  \    <!-- WinJS references -->\n    <link href=\"//MicrosoftJS.1.0/css/ui-light.css\"\
  \ rel=\"stylesheet\" />\n    <script src=\"//MicrosoftJS.1.0/js/base.js\"></script>\n\
  \    <script src=\"//MicrosoftJS.1.0/js/ui.js\"></script>\n    <!-- Hello_World\
  \ references -->\n    <link href=\"/css/default.css\" rel=\"stylesheet\" />\n  \
  \  <script src=\"/js/default.js\"></script>\n</head>\n<body>\n    <h1 id=\"headline\"\
  ></h1>\n</body>\n</html>\n```\n\n2. 在 `Default.js` 文件中，将标题项的 `innerText` 属性设置为 `This\
  \ is my Windows 8 app.`。它看起来像这样：\n\n```javascript\n// 关于空白模板的介绍请参考以下文档：\n// http://go.microsoft.com/fwlink/?LinkId=232509\n\
  (function () {\n    \"use strict\";\n    var app = WinJS.Application;\n    var activation\
  \ = Windows.ApplicationModel.Activation;\n    WinJS.strictProcessing();\n    app.onactivated\
  \ = function (args) {\n        if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n            if (args.detail.previousExecutionState !== activation.ApplicationExecutionState.terminated)\
  \ {\n                var headline = document.getElementById(\"headline\");\n   \
  \             headline.innerText = \"This is my Windows 8 app.\";\n            }\
  \ else {\n                // TODO: 此应用是从挂起恢复的。\n                //在此处恢复应用状态。\n \
  \           }\n            args.setPromise(WinJS.UI.processAll());\n        }\n\
  \    };\n    app.oncheckpoint = function (args) {\n        // TODO: 此应用即将挂起。在此处保存任何跨挂起的状态。\n\
  \        // 你可以使用 WinJS.Application.sessionState 对象，它会在挂起之间自动保存和恢复。\n        //\
  \ 如果你需要在应用挂起之前完成异步操作，请调用\n        // args.setPromise()。\n    };\n    app.start();\n\
  })();\n```\n\n\n\n\n这已经足够让你上手了——至少它能让你看出一切是如何结合在一起的。\n\n要开始调试 Windows 8 程序，请按 `F5`。执行系统直接内置在\
  \ Visual Studio 中。当你按下 `F5` 时，你将进入 Windows 8 界面。它看起来应该像图 1-4 所示，尽管没什么特别可看的。Windows\
  \ 8 应用没有状态栏、没有菜单栏，也没有关闭按钮：即使按照全球“Hello World”应用设定的相当低标准来看，它们也是很无聊的。\n\n这个 Windows\
  \ 8 应用的基础模板没有任何导航功能。从底部向上滑动不会出现任何有趣的内容。从右侧滑动会像任何其他 Windows 8 一样调出 栏（Charms bar）。如果你需要更多关于\
  \ Windows 8 设计的资讯，我将在第 2 章中进行详细介绍。\n\n**图 1-4：** 并不太有趣的“Hello World”应用。\n\n![9781118173350-fg0104.tif](img/9781118173350-fg0104_fmt.png)\n\
  \n如果你从左侧执行滑动手势，它会返回桌面和 Visual Studio。从那里，你可以点击 Visual Studio 中的停止按钮来结束会话。此时 Windows\
  \ 8 应用就会关闭。\n\n调试工作按照惯例进行。断点在 JavaScript 中的支持方式与在大多数其他语言中完全一样。当在 Visual Studio 中遇到断点时，Windows\
  \ 8 应用会暂停，Windows 会无缝将你带回调试器。我将在第二部分详细讨论调试器，届时我将向你展示如何消除 Bug。\n\n## 比较昨天的程序\n\n\
  在某些方面，为 Windows 8 应用编写代码与编写网站并无异，即使在微软技术栈之外也是如此。HTML5、CSS 和 JavaScript 是通用标准，你可以获取上述“Hello\
  \ World”应用的代码，并在大约十年前的任何网络浏览器中运行它。\n\n回到上一个版本，`.NET Framework` 负责处理用户界面的细节。XAML\
  \ 或 Windows Forms 会将布局代码转换为我们习惯看到的、带有状态栏和菜单等各种内容的 Windows 程序。在此之前，有无数种技术，包括 `VB6`\
  \ 中的 Ruby 表单引擎。现在有了 `WinRT`（即 Windows 运行时），它接收 HTML 提供的布局代码和 JavaScript 提供的逻辑，并将其转换为\
  \ Windows 8 风格的应用。\n\n## 用户界面处于领先地位\n\n图 1-5 很好概述了 `WinRT` 如何融入 Windows 8 应用的结构。XAML\
  \ 和 HTML 都可以用于构建布局代码。包括 JavaScript、C#、VB.NET 和 C++ 在内的多种语言可编写逻辑。`WinRT`提供了与 Windows\
  \ 的通信。\n\n**图 1-5：** `WinRT` 如何融入 Windows 8 空间。\n\n![9781118173350-fg0105.eps](img/9781118173350-fg0105_fmt.png)\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 为了创建更流畅的用户体验并保护开发者免受不必要的技术细节干扰，微软在应用程序的布局层封装了\
  \ `DXGI`（DirectX 图形基础设施），使得布局代码与应用程序的其他部分分离。图 1-6 显示了 Windows 8 应用 API（应用程序编程接口）是如何协同工作并为开发者带来这种体验的。\n\
  \n这是一件好事。如果你曾经用过 DirectX，你就知道仅仅是入门实际上就需要一个数学科学位。相反，`.NET` 中被削减过的 `System.Drawing`\
  \ 命名空间仅提供了图形处理上最基本的功能。当读者问我是否可以在 `.NET` 中编写游戏时，我过去总是会推荐他们去 Xbox，因为 `System.Drawing`\
  \ 太弱了。而现在有了另一个选择。\n\n![tip.eps](img/tip_fmt.png) 你可以在 [`https://mdxgi.codeplex.com`](https://mdxgi.codeplex.com)\
  \ 学习更多关于 `DXGI` 的知识。这是该库的托管版本（这意味着你可以从 `.NET` 调用它）。\n\n**图 1-6：** 用户界面架构。\n\n![9781118173350-fg0106.eps](img/9781118173350-fg0106_fmt.png)\n\
  \n## 这不是 .NET\n\n当 Windows 8 用户界面的细节在 2010 年夏天开始流一时，许多人担心微软正在偏离 `.NET`。这本是一件大事，因为它当时诞生还不满十年。许多人将公司的未来寄托在\
  \ `.NET` 的成功上。当时爆发了许多哀嚎和切齿声。\n\n相反，微软为 Windows 8 应用编写了一个新的 API。为什么？这很大程度上与图形有关。`.NET`\
  \ 是一个业务型 API。它是为编写业务应用程序而设计的。尽管你可以用 `.NET` 编写出优质的用户体验，但 `.NET` 的主要目标。它的主要目标是将数据从这里传输到那里。\n\
  \n另一方面，Windows 8 完全关乎用户体验。尽管你可以用 Windows 8 创建和移动数据，但它在很大程度上是为了消费这些数据。它不是一个业务应用程序。你可以用它这样做，但并不是它被创建的初衷。表\
  \ 1-1 为你提供了更好的思路。\n\n### 表 1-1 你的应用可能是 Windows 8\n\n| 你的应用应该是 Windows 8 | 你的应用应该是\
  \ .NET |\n| :--- | :--- |\n| 汇总各种服务的数据。 | 允许访问数据源。 |\n| 精致的图形呈现。 | 基础图形呈现。 |\n|\
  \ 为平板电脑设计。 | 为鼠标和键盘设计。 |\n\n![tip.eps](img/tip_fmt.png) 这张图并不是微软的标准：这是我的观点。我写过 `.NET`\
  \ 书，尽管这是我的第一个 Windows 8 书，但这种区别显而易见。尽管如此，这里有很大的争论空间。欢迎访问网站与我争论！\n\n\n\n\n\n![check.png](img/check.png)\
  \ # 基本设计分组：你必须确保已涵盖的核心内容\n\n*   应用磁贴 (App tile)：用户点击启动你的应用的图标\n*   启动屏幕 (Splash\
  \ screen)：应用加载时用户看到的内容\n*   应用生命周期 (Application lifecycle)：在应用被挂起或电量耗尽时做好准备\n* \
  \  应用栏 (App bar)：你应用所有的命令都位于同一个地方\n\n![check.png](img/check.png) # 通过应用契约吸引用户（如搜索和共享。详见第\
  \ 9 章。）\n\n*   设置 (Settings)：应用如何与 Windows 通信\n*   搜索 (Search)：它如何应用于你的应用\n*   共享\
  \ (Share)：社交化\n*   播放到 (Play to)：流式传输到其他设备\n\n![check.png](img/check.png) # 各种视图\n\
  \n*   全屏 (Full screen)\n*   靠拢 (Snapped)\n*   填充 (Filled)\n*   竖屏 (Portrait)\n*\
  \   缩放 (Scaled)\n\n![check.png](img/check.png) # 添加功能：利用你可以完成的简洁特性\n\n*   语义缩放 (Semantic\
  \ zoom)\n*   通知 (Notifications)\n*   漫游 (Roaming)\n*   内容磁贴 (Content tiles)\n* \
  \  手势库 (Gesture library)\n*   文件选择器 (File picker)\n*   动画 (Animations)\n*   用户磁贴\
  \ (User tiles)\n\n## 约定优于配置\n\n你现在可能已经注意到 Windows 8 风格很大程度上取决于“约定”——这种约定被定义为 Apple\
  \ 为其 iPad 选择的方法。对于用户如何与与应用相关的元数据交互，你实际上并没有太大的创作空间；它们已经由设计清单 (Design Checklist) 和核心原则\
  \ (Core Principles) 定义得很明确。\n\n以导航为例。在 `Windows Forms` 应用中，导航到处都是。有菜单、丝带和按钮（噢天哪！）。然而，在\
  \ Windows 8 中，应用的导航应该是面向文档的，并存在于应用底部的 `app bar` 中。\n\n事实上，编程模型支持了这一点。它支持得如此完美，以至于实际上没有其他方法可以实现\
  \ `app bar`。要明白我的意思，请打开我们在“构建简单的 Hello World 应用”中创建的 `Hello World` 应用。\n\n在 HTML\
  \ 中，`body` 标签内部添加一个代表 `AppBar` 控件的 `div`。注意 `data-win-control` 声明：\n\n```html\n\
  <body>\n  <h1 id=\"headline\"></h1>\n  <div data-win-control=\"WinJS.UI.AppBar\"\
  \ id=\"appbar\">\n    <button data-win-control=\"WinJS.UI.AppBarCommand\" data-win-options=\"\
  {icon:'back', id:'', label:'example', onclick:null, section:'global', type:'button'}\"\
  ></button>\n  </div>\n</body>\n```\n\n现在你你可以运行该应用，并在 `app bar` 中拥有一个精美的返回按钮了。你所有的导航相关内容都在这里：重新开始、切换视图、返回首页。不在菜单中，也不在页面中，而是在\
  \ `app bar` 中。\n\n## 拥抱开发者体验\n\n如果微软想要进军平板电脑市场，那么吸引开发者是一个很好的开始。大多数人都认同 Android 和\
  \ iOS 的开发体验非常值得赞赞。Windows 8 的体验就像 `.NET` 体验一样，已经非常出色，并且正在变得更好。\n\n![check.png](img/check.png)\
  \ # 首先，你可以从多种不同的编程语言中选择。此本书是关于 HTML 和 JavaScript 的，但使用 `C#` 或 `VB.NET` 的 `XAML`\
  \ 也可行。此外，你可以使用 `C++`。\n\n![check.png](img/check.png) # 开发环境在配置后会自动编译、打包并将你的应用部署到商店。\n\
  \n![check.png](img/check.png) # Windows 8 环境包含的控件同时支持触摸和鼠标/键盘。这是一个非常巧妙的安排。\n\n![check.png](img/check.png)\
  \ # 使用 Windows 8 在多种文化下进行部署轻而易举。本地化配置已内置在部署周期中；你只需要填充数据即可。\n\n### 使用地球上最好的开发者工具\n\
  \n除了这些之外，十年来，微软一直致力于地球上顶尖的开发者工具：`Visual Studio`。我们不仅可以使用 `Visual Studio` 进行开发，获得了一个（相对）新的工具来进行设计：`Expression\
  \ Blend`。\n\n`Expression Blend`（图 1-7）长期以来一直是 `XAML` 开发者的首选工具。对于 Windows 8，它也支持\
  \ `HTML/CSS`。`Blend` 为设计师提供了一个良好的环境，从视觉上设计外观和感受，而不会完全破坏底层代码。\n\n**图 1-7：** 使用 Expression\
  \ Blend 开发。\n\n![9781118173350-fg0107.tif](img/9781118173350-fg0107_fmt.png)\n\n\
  开发完 UI 后，你可以轻松将代码交给开发者，进行必要的 JavaScript “后端”编码，这将使应用与 Windows 8 以及服务等进行交互。这种过渡是无痛的，这是刻意的。`Blend`\
  \ 设计的设计就是这样。它确实是一个真正的组合拳。\n\n## 融入 WinRT\n\n`ASP.NET` 开发者有 `.NET Framework` 后盾。作为\
  \ Windows 8 开发者，我们有 `Windows Runtime`。`.NET` 框架是一个面向业务的 API，专注于将数据从一个地方移动到另一个地方。`Windows\
  \ Runtime`（通常称为 `WinRT`）更多关于使用 PC 或平板电脑硬件的功能来增强用户体验。\n\n![check.png](img/check.png)\
  \ # `WinRT` 中的几乎一切都是异步的，这意味着用户界面不会等待请求结果而阻塞。它是为了优化用户体验而设计的。\n\n![check.png](img/check.png)\
  \ # 你可以使用 `WinRT` 访问几乎一切：文件、设备、网络。\n\n# 第 2 章：拥抱 Windows 8 风格\n\n### 本章\n\n![arrow](img/arrow.png)\
  \ # 符合 Windows 8 风格\n![arrow](img/arrow.png) # 将特性应用于你的应用\n![arrow](img/arrow.png)\
  \ # 帮助你的应用获得关注和喜爱\n\n微软制定了一份 Windows 8 特性列表。本章将该列表拆分为你可以使用的设计原则。当我第一次看到这个列表时，我觉得它有点模糊。毕竟，什么是\
  \ Windows 8 风格？这不就是这一切的核心吗？\n\n事实证明，这个列表经过深思熟虑，背后的细节也是如此。我建议你花 30 分钟阅读本章，查看我提到的应用，然后再次阅读一遍。\n\
  \n设计你的 Windows 8 应用比你想象的要重要。如果不符合指南，你就无法进入商店。如果你无法进入商店，你就浪费了时间，所以深吸一口气，准备好迎接 Windows\
  \ 8。\n\n话不多说，微软定义的 Windows 8 应用应具备的八种特性如下：\n\n![check.png](img/check.png) # Windows\
  \ 8 设计风格\n![check.png](img/check.png) # 快速流畅\n![check.png](img/check.png) # 美观对齐和缩放\n\
  ![check.png](img/check.png) # 使用正确的契约\n![check.png](img/check.png) # 投入出色的磁片\n![check.png](img/check.png)\
  \ # 感到连接和活跃\n![check.png](img/check.png) # 漫游到云端\n![check.png](img/check.png) #\
  \ 拥抱 Windows 8 设计原则\n\n### 使用 Windows 8 风格设计\n\n这整章不是关于使用 Windows 8 风格进行设计吗？好吧，既如此也不是。一些通常属于设计工作范围的特定事项都在列表中，而且工作已经为你完成了。\n\
  \n以字体排版为例。通常我们开发者直接使用 `Visual Studio` 设置的默认字体用于标签和选择框。这对于我们正在构建的应用来说并不总是最好的。\n\n\
  在 Windows 8 中，选择字体排版的繁重工作已为你承担。最好的字体、字重和大小都是预先定义的。遵循规则，砰：你就拥有了漂亮的效果。\n\n\n\n\n\n\
  Windows 8 的核心是内容优先。用户应该看到内容，而不是应用程序。在用户的脑海里，他们并不是在运行`Gallery`画库），而是在看图片。\n\n这不仅仅是哲学上的差异。内容不仅应该出现在用户的脑海中，也应该出现在应用程序的布局中。此外，用户不应该感觉自己正在与某个应用程序交互，或者眼睛一次同时关注超过一个物体。\n\
  \n你知道这最让我想起什么吗？《少数报告》（Minority Report）。你知道的，那部汤姆·克鲁斯主演、改编自菲普·K·迪克短说的电影。电影中，克鲁斯使用一台屏幕像窗玻璃一样薄且透明的电脑，上面没有菜单或其他其他明显的导航方式。在这台电脑上，克鲁斯可以通过手势和口令来操纵图像、声音、数据——一切。这才是内容优先。\n\
  \n### 内容优先\n\n对于“内容优先”，我能想到的最简单的二元对立，就是旧的 VCR 控制命令（如`Play`播放、`Rewind`倒退和`Fast Forward`快进）与\
  \ Windows 8 中新的`Photos`（照片）应用之间的对比。在构建 `Windows Forms`应用程序时，它们无处不在。事实上，你仍然可以在 `VS2012`\
  \ 中将数据实体拖入 `Windows Forms` 页面，如图 2-1 所示。你可以使用 VCR 控制按钮来返回或前进、回到或最后、添加或删除。\n\n**图\
  \ 2-1：** VCR 控制命令依然存在。\n\n![9781118173350-fg0201.tif](img/9781118173350-fg0201_fmt.png)\n\
  \n打开 Windows 8 中类似`Photos` 的应用。你只会看到图片列表，如图 2-2 所示。想看细节？点击它。想看下一张？向左滑动。或者向右滑动。需要做一些罕见的操作？那里有一个应用栏（app\
  \ bar）可以处理。\n\n**图 2-2：** 内容驱动的照片应用。\n\n![9781118173350-fg0202.tif](img/9781118173350-fg0202_fmt.png)\n\
  \n这里的核心思想是：用户想要照片，他们就得到照片。而不是一堆使用照片的东西。只要照片。人们喜欢的东西是屏幕上的内容，而不是你用来操纵人们喜爱的内容的工具。\n\
  \n## 减少干扰\n\n这种对内容的关注还有一个好处，减少了用户需要关注的事物。图 2-3 显示了 `GIMP`，一种许多数字艺术家喜欢的图形工具。\n\n\
  主界面有很多装饰（chrome）。装饰、窗面装饰、点缀：无论你怎么称呼它，`GIMP` 主界面都有很多。我发现所有东西都坐在那里盯着我，非常分心。我知道目标是让一切都触手可及，但老天。\n\
  \n对比图 2-4 中的 `Autodesk SketchBook`。用一个词来形容，`Sketchbook` 是美极。它有两个圆盘：一个用于颜色，一个用于宽度，以及一个工具的“泻湖”。\n\
  \n**图 2-3：** GIMP 令人分心的主界面。\n\n![9781118173350-fg0203.tif](img/9781118173350-fg0203_fmt.png)\n\
  \n**图 2-4：** Autodesk Sketch- Book —— 极致的不干扰设计。\n\n![9781118173350-fg0204.tif](img/9781118173350-fg0204_fmt.png)\n\
  \n然而，即使在图 2-2 这样的示例中，你可能也想做一些选择照片、下一张、最后一张之外的操作。如果你想打印它怎么办？或者把那张照片当作头像？如果你想添加或删除照片怎么办？对于更高级的任务，你需要其他东西。\n\
  \n## 应用栏 (App bar)\n\n应用栏包含特定于应用程序的功能。当你从底部向上滑动（或者奇怪地从顶部向下滑动）时，屏幕底部会弹出一个 90 像素宽的条形。这就是放置应用特定功能按钮的地方。\n\
  \n按照惯，适用于整个应用程序的功能位于左侧，适用于当前所在页面的功能位于右侧。按钮应该由图标和文本组成，并执行应用程序用户特别感兴趣的操作。\n\n我将在第\
  \ 6 章介绍如何使用应用栏。\n\n## 魅力栏 (Charms bar)\n\n魅力栏包含 Windows 级别的功能。它有五个按钮——在每个应用中都是一样的。它们是：\n\
  \n![check.png](img/check.png) 搜索\n\n![check.png](img/check.png) 共享\n\n![check.png](img/check.png)\
  \ 开始\n\n![check.png](img/check.png) 设备\n\n![check.png](img/check.png) 设置\n\n如果应用程序需要执行应该由\
  \ Windows 处理的操作（如打印），可以在魅力栏中找到。你不需要在应用中添加打印按钮：你直接使用魅力栏上的`Devices`（设备）按钮即可。\n\n魅力是通过\
  \ `Contracts`（合约）集成的。我将在下面的“选择正确的合约”中介绍如何选择合约，并在第 10 章介绍如何使用它们。\n\n# 布局 (Layout)\n\
  \n项目放在屏幕上的位置非常重要。\n\n## 留白 (White space)\n\n提供留白可能是最重要的单一考虑因素。\n\n![check.png](img/check.png)\
  \ 在内容周围留白。\n\n![check.png](img/check.png) 使用边距，并确保元素之间有内边距。\n\n![check.png](img/check.png)\
  \ 去除上的线条。\n\n我将在第 6 章介绍如何改进对留白的使用。\n\n# 排版 (Typography)\n\n如果你让内容自己说话，而没有任何框来告诉用户任何东西在哪里，你该如何组织内容呢？排版。Windows\
  \ 8 设计很大程度上是使用标题样式和文本格式来驱动交互。幸运的是，微软提供了一种通用字体（`Segoe`），但还有一个样式表来设置标题、导航和其他样式，如图\
  \ 2-5 所示。\n\n**图 2-5：** 字号阶梯。\n\n![9781118173350-fg0205.tif](img/9781118173350-fg0205_fmt.png)\n\
  \n字号阶梯展示了如何通过一组比例大小的字体引导用户的注意力。排版使用的良好示例，可以查看 `Store` 上的 `News` 应用。\n\n\n\n\n\n\
  Windows 8 风格包含一个名为 `Windows 8 Silhouette`（Windows 8 轮廓）的概念。如图 2-6 以及商店中几乎所有的应用所示——它定义了页面标题、分组标题和内容在应用中的位置，以帮助用户理解应用结构。\n\
  \n关于 `Windows 8 Silhouette` 有两点重要的需要了解。首先，它可能是布局中无人谈过的最重要的部分。它充分考虑了空白区域、排版和人体工程学，真正有助于赋予应用一种\
  \ Windows 8 的感觉。\n\n其次，微软让你的上手工作变得非常简单。在第 4 章详细展示的默认模板都为你设置好了 `Silhouette`，以帮助你快速开始。默认样式表也包含了很多元素。如果你遵循指南并使用提供的工具，让你正在构建的应用更像\
  \ Windows 8 就会非常简单。\n\n**图 2-6：** 微软提供的 `Windows 8 Silhouette` 示例。\n\n![9781118173350-fg0206.tif](img/9781118173350-fg0206_fmt.png)\n\
  \n## 交互\n\n内容的视觉效果只是 Windows 8 风格的一部分。用户与应用交互的方式也起着很大作用。你可以预期在三个地方找到交互点：内容、应用栏（app\
  \ bar）和 `Charms bar`（魅力栏）。交互应该从内容非常自然地流动，利用内容的上下文来引导用户，而不是提供一堆菜单和按钮。\n\n## 内容提供命令\n\
  \n点击故事标题来运行新闻应用是使用内容作为控制器的显而见的用法，但这并不是唯一的例子。几乎所有内容都可以用于让用户控制应用程序的命令结构。\n\n以射射击游戏为例。在屏幕上放置一个方向键风格的控制器并不是你想要的方式。只需用户触摸某个物体来射击，比如，拖动他们的飞船来移动它。\n\
  \n记住你还有全系列的手势可以使用。例如，用户可以向一个方向滑动来投掷，或者拖动角色来移动。你可以使用 `pinch gesture`（捏合手势）让用户聚焦于某物，并使用\
  \ `rotate function`（旋转功能）更改摄像视角。\n\n这里的要点是对你的命令进行创意设计。花时间下载许多已经为该平台开发的游戏——甚至是为具有触摸元素的其他平台开发的游戏——并根据它们的\
  \ Windows 8 命令进行评估。内容是在驱动命令吗？它应该是这样的吗？为什么或者为什么不？然后将你学到的知识应用到你自己的游戏中。\n\n天气地图是另一个很好的例子。设计你的应用，使得当用户点击地图上的某个位置时，雷达会重新聚焦到靠近点击位置的气象站。如果他们拖动地图，就让它移动。如果他们捏合，就放大。遵循其他人在任何特定类型中的做法是好事。你不需要重新发明轮子。\n\
  \n同样重要的是这种哲学带来的外壳元素（chrome）的减少。如果你不需要 `glyph`（图标），就不要提供 `glyph`。用户不需要屏幕上显示着“点击此处移动到此气象站”的文字。他们会想出来的。对整件事保持一点“禅”意，不要担心。\n\
  \n## 使用边缘\n\n在本章早之前的“内容优于框架（Content Before Chrome）”部分中，我介绍了应用栏和 `Charms bar`。确保你的应用支持这些功能，即使你没有完全使用它们。尝试不要在应用栏和\
  \ `Charms bar` 应该出现的区域放置内容。\n\n更好的是充分利用应用栏和 `Charms bar`。将应用边缘之外任何必要的框架元素隐藏，确实能让内容优先，并给用户带来新层次的体验。\n\
  \n微软更希望消失的框架元素的绝佳例子是标签。Internet Explorer 是一个使用应用栏来消除标签的最好随手示例。\n\n图 2-7 中顶端应用栏的使用完全消除了以前从\
  \ IE 窗口中减去 30 像素内容的标签栏。有两个集成框架元素：一个用于添加标签的 `¶` `glyph` 和一个用于删除标签的 `X` `glyph`。其他情况下，如果你需要查看标签，触摸它！这就是让内容用起来。\n\
  \n## 上下文命令\n\n应用栏是放置命令的地方，但你不能只是把所有东西都堆在那里，并期望用户能找到路。应用栏在显示命令时应该考虑应用程序的上下文。\n\n\
  图 2-8 显示了 Windows 世界中上下文命令结构结构的一部分增长过程。首先，Windows 在菜单项不可用时会将其置为灰色（置灰）。这至少防止了用户点击不起作用的东西——例如，当剪贴板为空时，你无法进行粘贴。\n\
  \n**图 2-7：** Internet Explorer 中的顶端应用栏。\n\n![9781118173350-fg0207.tif](img/9781118173350-fg0207_fmt.png)\n\
  \n**图 2-8：** 上下文命令的成熟。\n\n![9781118173350-fg0208.eps](img/9781118173350-fg0208_fmt.png)\n\
  \n随着 Ribbon 丝带的发明，微软推动了更多的上下文命令结构。除非你正在处理表格，否则 `Table ribbon` 甚至不可用，`picture ribbon`\
  \ 也是如此。\n\n在 Windows 8 中，微软将其推到了下一个水平——除非选择了可删除项目，否则 `Delete` `glyph` 甚至不会出现在应用栏上。\n\
  \n## 导航\n\n命令并不是拼图的全部。某些类型的应用程序（如网络浏览器）需要导航。如果你需要查看集合中的项目，应用程序应该有一个结构化的处理方式。\n\n\
  幸运的是，这有一套模式。导航模式与架构模式相似，导航模式为应用开发者提供了一种结构化的方式来组合内容，使用户能够清楚如何从一个地方去到另一个地方。\n\n每个屏幕都应该是关于你在内容中的位置，而不是你要去向哪里。你要去的地方应该是简单易懂的，但视图的首要任务不应该是如何带你到达。\n\
  \n## 内容也提供导航\n\n内容应该尽可能提供导航。语义导航对用户来说应该是合理的：点击标题应该带你进入文章，点击图片应该带你进入更大的图片。\n\n要点是让应用程序关注内容，而不是功能。\n\
  \n## 避免持久性导航\n\n持久性导航是指在不再需要时仍保持导航工具活跃的概念。在本章早前的图 2-1 和 2-2 中，我展示了 VCR 控制按钮与当前照片应用的示例。这是一个很好的例子。你不希望在不需要时导航仍然一直留在页面上。\n\
  \n另一个很好的例子：大多数现代网络浏览器的标签。标签是你不需要的导航部分。用户在需要时可以获取它们。\n\n内容导航的想法关注的是你在哪里，而不是去哪里。与其永久放置\
  \ `Next` 按钮，不如在应用栏上提供上下文敏感的 `Next` 按钮，在用户向左滑动时切换，或者在用户触摸屏幕时显示 `Next` `glyph`。不要关注你要去哪里。\n\
  \n## 使用导航模式\n\n两种（实际上非常常见）导航模式将帮助你实现 Windows 8 导航的目标。`flat`（扁平）模式设计用于迭代项目列表。`hierarchal`（层级）模式适用于深入研究嵌套分类的项目。图\
  \ 2-9 为你提供了这两者的概述。\n\n\n\n\n\n扁平模式（Flat pattern）在图 2-2 的图片查看器中显示，或者图 2-6 中的 `IE10`。这是一种允许用户遍历列表中未进一步分类的项的方法。你可能会说，图片是有组织的吗？是的，但当你导航这些图片时，它们有一个固定的数量，你以列表的形式查看它们。\n\
  \n**图 2-9：** Windows 8 的两种导航模式。\n\n![9781118173350-fg0209.eps](img/9781118173350-fg0209_fmt.png)\n\
  \n扁平模式对于在较小的、可独立导航的区域具有多个项目的应用非常有效。例如：\n\n![check.png](img/check.png) 会话记录\n\n![check.png](img/check.png)\
  \ 文档\n\n![check.png](img/check.png) 标签\n\n层级模式（Hierarchal pattern）更适合大型内容集。层级模式的基础是一个三部分导航系统：从中心页到分区页，再到详情页。使用层级模式的一些优秀应用示例包括：\n\
  \n![check.png](img/check.png) 开始\n\n![check.png](img/check.png) 商店\n\n![check.png](img/check.png)\
  \ 新闻\n\n![check.png](img/check.png) 体育\n\n### 尝试语义缩放（Semantic Zoom）\n\n在 Windows\
  \ 8 中导航层级模式可能会很生硬，因此微软围绕它发明了一个新元素和一整套编程模型——语义缩放（Semantic Zoom）。语义缩放为用户提供了一种导航数据组的方式，就像这些数据本身就是数据点一样，非常具有\
  \ Windows 8 的风格。\n\n为了理解我的意思，请按下“开始”按钮并进入开始屏幕。如果你有触摸屏，请捏合屏幕。看到项目类别是如何变成项本身的了吗？如果没有，请查看图\
  \ 2-10 —— 这是我在语义缩放下的开始屏幕。\n\n这使得一组项目变成了本身易于管理的项。要要理解我的意思，向下划动任何一个组并打开应用栏。为组命名的功能就在那里，作为组选择的上下文命令。\n\
  \n**图 2-10：** 语义缩放。\n\n![9781118173350-fg0210.tif](img/9781118173350-fg0210_fmt.png)\n\
  \n### 保持快速与流畅\n\n动画就像 Windows 8 风格一样，是 Windows 8 体验组成部分。Windows 8 中的动画旨在帮助用户理解发生了什么、正在发生什么，以及当以某些方式交互环境时将发生什么。\n\
  \nWindows 8 中的动画库为应用开发者提供了一种简单的方法，为用户提供一致的体验。动画不是关注运动，而是关注 Windows 8 的某些特性。你不是为了旋转而旋转某东西——而是为特定的命令添加特定上下文的动作。\n\
  \n### 有目的地地使用动画\n\n动作为 Windows 8 注入了生命。这种理念不是为了移动而移动，而是提供一种看起来非常一致且深思熟虑的完成体验。\n\n\
  由于 Windows 8 操作系统中内置了这么多动画，因此在你的应用中使用动作与用户在其他地方看到的内容相匹配。此外，在控件中使用动画为用户提供了视觉提示，告诉他们什么是可以移动的、如何移动以及应用将如何响应。\n\
  \n将动画引入你的应用有两种方法，它们在第 6 章中都会介绍。第一种是使用 `WinJS` 库中的内置控件。第二是使用 `WinRT` 中的动画。两者都提供了用户希望在\
  \ Windows 8 中看到的专业、一致的体验。\n\n### 优先考虑触摸的设计\n\n构建始终快速流畅环境的最后一部分是：优先考虑触摸。在 Windows\
  \ 8 中，这种设计。\n\n**图 2-11：** 触摸设计。\n\n![9781118173350-fg0211.eps](img/9781118173350-fg0211.png)\n\
  \n\n\n\n\n该目标是通过让其他应用来填写你的用户故事，从而提升整体用户体验。不要在你的应用中编写如打印等常用函数——只需将其交给 `WinRT`，并让\
  \ `Devices` 磁贴处理即可。与其在你的应用中编写共享功能，不如让用户选择的共享选项来工作。\n\n实现合约将在第 10 章中介绍。\n\n## 分享\
  \ (Share)\n\n使用 `Share` 合约赋予用户共享应用内容的能力，或消费从其他应用共享的内容。与其猜测用户想要如何共享内容，只需让 `WinRT`\
  \ 获取用户系统中支持共享的应用列表，并让它们来完成工作。\n\n## 搜索 (Search)\n\n感谢 `Search` 磁贴，用户可以在 Windows\
  \ 的任何地方搜索你应用的内容。这样做极大地提高了你应用的可用性，改善了整个应用生态系统，并将让你在市场上获得更高的评分。\n\n然而，搜索不等同于查找（Find）。查找（如\
  \ Internet Explorer 中的 `CTRL+F`）用于在当前信息页上查找某些单词或短语。在 Windows 8 中，搜索的范围要得多，指的是跨整个应用程序查找包含搜索术语的项目列表。\n\
  \n在你的应用中开放搜索功能，使得人们在从日历搜索时能够找到包含搜索术语的任务。它让整个 Windows 8 体验变得更加小巧且紧凑。\n\n## 选择器 (Pickers)\n\
  \n`Picker` 合约是 Windows 体验中新的通用对话框。用户不再需要翻阅文件夹来寻找文件。他们现在通过“体验”来寻找内容。\n\n例如，文件选择器允许你的应用注册为内容提供者，这样用户就可以在其他应用中使用你应用提供的内容。文件和文件夹仍然存在，但用户体验非常不同。\n\
  \n## 设置 (Settings)\n\n以前你可能有一个编辑/设置菜单，而现在你应用及其周围环境的所有设置都位于同一个屋檐下，即 `Settings` 磁贴中。\n\
  \n你的应用从应用内部控制 `Settings` 磁贴中的设置，作为交换，你让 Windows 为所有设置提供单一托管点。\n\n### 设置面板中包含哪些类型的内容？\n\
  \n![check.png](img/check.png) 帮助\n![check.png](img/check.png) 关于\n![check.png](img/check.png)\
  \ 登录/注销\n![check.png](img/check.png) 支付信息\n![check.png](img/check.png) 更新\n![check.png](img/check.png)\
  \ 偏好\n\n## 投资一个精美的磁贴\n\n30 多年来，应用开发者一直都在制作 32X32 像素的图片作为其应用的图标。要在小于邮票大小的空间内传达应用的个性确实是一项挑战。\n\
  \n但在 Windows 8 中，你获得了一个 120X300 的的动态广告牌，上面展示来自你应用的内容来推销你的商品。这就是磁贴。\n\n使用磁贴吧。它是你应用的大门，是启动页面上的店面。\n\
  \n### 为你的磁贴品牌化\n\n磁贴应该是美而不张扬的。对于设计缺乏天赋的人（比如我这个谦卑的作者）来说这可能是一个挑战，但微软已经让指南变得非常直观。\n\
  \n你可以查看微软关于 [`http://msdn.microsoft.com/en-us/windows`](http://msdn.microsoft.com/en-us/windows)\
  \ 的建议。我的建议是？坚持使用照片、符号和文本。这样不会出错。找到一张代表你应用的已许可照片（或自己拍一张）并将其作为主图。然后，如果你有要显示的文本内容，请设置一个模板来支持代表性的符号和相关的文本。\n\
  \n示例？看看 Windows 8 自带的默认应用即可。启动每个应用以使内容刷新。将你的 LinkedIn 和 Google 账户关联到安装，这样你的联系人、日历和消息磁贴就会活跃起来，然后以此为基础决定你的磁贴将如何代表你的应用。\n\
  \n### 使用次级磁贴驱动流量\n\n磁贴并不是进入应用的唯一入口。在用户允许的情况下，可以使用次级磁贴（secondary tile）固定你应用的内容。\n\
  \n正在编写一个旅行应用吗？让用户将即将到来的行程固定到他们的启动页面。这对他们来说易于访问，也是用户记住你应用的另一种方式。这是双赢的。\n\n第 9 章详细介绍了磁贴和固定功能。\n\
  \n## 保持你的应用连接并活跃\n\n在上一节中，我曾建议磁贴是动态广告牌，我可不是在开玩笑。当你的应用运行时，发送到磁贴的内容在应用未运行时也会保持活跃，这会带来大量的用户兴趣。\n\
  \n你的应用还可以设置细微的通知，在用户未使用应用时与他们交互——这对于消息应用或告知用户某个长时间运行的应用已完成非常完美。\n\n当然，对于实时磁贴和通知都有合约和\
  \ API；它们在第 9 章中都会介绍。\n\n### 让你的磁贴活起来\n\n磁贴可以填充内容，这些内容用户在使用启动页面时以细微且有组织的方式旋转。在应用启动后，主要职责之一就是更新磁贴，这样当\
  \ `WinRT` 挂起应用时，内容仍保持新鲜。\n\n磁贴布局有许多经过批准的模板，包括各种尺寸的长文本和短文本，以及用于简单图像和数字信息的徽章（Badges）。在你决定想让磁贴如何工作之前，请深入研究第\
  \ 9 章并找到包含所有磁贴模板的大图表。\n\n你还可以选择循环五次更新，这些可以是任何对你的应用有意义的内容：\n\n![check.png](img/check.png)\
  \ 消息\n![check.png](img/check.png) 更新\n![check.png](img/check.png) 故事\n![check.png](img/check.png)\
  \ 照片\n![check.png](img/check.png) 高分\n![check.png](img/check.png) 行程\n\n其理念是让应用尽可能地成为用户生活的一部分。\n\
  \n### 使用通知\n\n当用户在使用另一个应用时，你的应用会被挂起，无法控制屏幕、内存、网络或系统的任何其他资源。\n\n尽管如此，通过使用通知，你的应用仍然可以感觉活跃。通知就像你在\
  \ .NET 中通过 `MessageBox.show()` 获取的旧对话框或通过浏览器通过 `alert()` 获取的内容。但它们看起来大不同——参见图 2-13。\n\
  \n记住，用户可以随时关闭你应用的通知（或整个系统的通知）。切不要轰扰他们。\n\n**图 2-13：** 来自 Windows 8 的通知。\n\n![978118173350-fg0213.eps](img/978118173350-fg0213_fmt.png)\n\
  \n## 云端漫\n\n连接体验的大部分是……嗯……连接。虽然你的应用在未连接到互联网时仍应运行（或者至少优雅地失败），但在连接时，有很多 `WinRT` 的酷炫功能可供应用利用。\n\
  \nWindows 8 应用无法使用传统意义上的数据库。它们被设计为使用 Web 服务保存大型数据集。我在第 11 章中介绍了 Web 服务，但有一种简单的方法可以使用\
  \ `WinRT` 来保存较小数据集。\n\n### 使用 Azure\n\n数据比漫游设置多得多？我理解——我有时也会遇到这个问题。\n\n使用 Azure\
  \ 云平台构建的服务与 Windows 8 应用之间的集成是令人惊叹的。可以使用 Windows Communication Foundation 或 ASP.NET\
  \ MVC Web 应用程序接口来构建简单的服务。可以使用 Visual Studio 简单快速地部署到 Azure，然后通过 Windows 8 应用中的服务引用进行调用。我在第\
  \ 15 章中介绍了使用 Azure Mobile Services 为你的应用获取服务。\n\n使用大型云服务消除了构建应用的管理工作。它们并不总是完美，但你不需要为了管理始终连接互联网的服务器来编写具有在线存储的功能。通过\
  \ Azure 站的免费小型实例，你为应用放置更大的在线存储提供了绝佳机会。\n\n\n\n\n\n漫游设置（Roaming settings）是 Windows\
  \ 8 的一部分，它们使用 SkyDrive 为特定用户和特定应用存储较小的数据集。例如，我的一个 Windows 8 只要只要用户连接到互联网，就会用户的任务列表存储在漫游设置中。\n\
  \n酷的地方在于，当用户执行此操作时，可以在登录的任何机器上访问这些设置。所以，如果你在家里里的 PC 上设置了任务列表，然后在在途中登录 Surface，你可以立即访问你的任务列表。\n\
  \n这项服务的代价是什么？什么也没有；它是免费的。它是每个用户拥有微软账户时获得的存储空间的一部分。利用它吧。\n\n# 第 3 章：掌握 Windows 8\
  \ 开发\n\n### 本章内容\n- ![arrow](img/arrow.png) 比较在 Windows 8 中构建应用的方法\n- ![arrow](img/arrow.png)\
  \ 工具导览\n- ![arrow](img/arrow.png) 在 Windows Store 中让用户优先\n\n在开发 Windows 8 应用程序时，Windows\
  \ 8 的风格是许多决策的基础，微软对此直言不讳。与实际上没有任何规则的、战舰灰色 VB6/Windows Forms 应用不同，Windows 8 应用寻求提供特定的用户体验，并有强制这种体验的规则。如果你不遵守这些规则，你就无法进入\
  \ Store。\n\n从微软的角度来看，Windows 8 关乎用户和开发者。关注开发者并不新奇，但坦率说，关注用户对微软来说有点新颖。他们一直秉着“我们会照顾好开发者，他们来照顾用户”的哲学。从事后看来来看，这结果并不理想。\n\
  \n所有这些对用户的新关注背后的动力是平板电脑的发展，微软已经对其琢磨了多年。事实是，他们做得相当糟糕。诚然，硬件还没有到位，但 Google 特尤其是苹果抢先而出并给了微软沉重一击。接受了挫败后，微软终于决定以用户和开发者为中心。\n\
  \n## 关注用户\n因为关注用户对于 Windows 开发来说算是一个新鲜，我将从这里开始。\n\nWindows 8 很好地支持了几个核心概念，你应该在开始构建之前学习它们。简而言之，它们是：\n\
  \n- ![check.png](img/check.png) 让用户沉浸在你的应用程序中。\n- ![check.png](img/check.png) 不提供多余的功能。\n\
  - ![check.png](img/check.png) 触摸优先设计。\n- ![check.png](img/check.png) 为多任务处理做好准备。\n\
  - ![check.png](img/check.png) 记住这是一个互联的世界。\n\n在接下来的几节中，我逐一介绍这些点，并看看它们如何影响你的设计策略。\n\
  \n### 让用户沉浸\nWindows 8 应用程序体验最大的部分是利用整个屏幕。这让你作为应用程序设计师稍微感到有些无奈，因为没有标题栏、没有退出按钮、没有菜单，也没有状态栏。你不得不学习如何以稍微不同的方式设计应用程序。\n\
  \n注意图 3-1，新控制面板中所有的外壳（即标题栏、状态栏等）都是不可可见的。在 Windows 世界中，你已经可以全屏运行有一段时间了，但绝不是像这样。外壳并没有被隐藏——它只是根本不存在。完全没有。你必须找到其他方法。\n\
  \n**图 3-1：** 瞧，妈妈。没有外壳了！\n\n![9781118173350-fg0301.tif](img/9781118173350-fg0301_fmt.png)\n\
  \n对你来说幸运的是，你可以找到大量的指导和工具来帮助构建 Windows 8 风格的应用。过之处在于是你必须放弃一点控制权，让工具为你工作，而不是决定微软在所有方面都是错的，并从头开始重建一切。至少给这种风格一个机会。\n\
  \n### 提供用户所需\n如果 Windows 8 用户界面没有花哨装饰，那么易用性也应该没有花哨装饰吗？\n\n通常情况下，是的的。Windows 8 应用程序从头到尾都是实用的。从需求的角度来看，任何\
  \ Windows 8 应用都不应该满足用户的超过几项需求——它们几乎是单次使用的应用程序。\n\n想象一个棋盘。你可以用它来下棋。这就是它的功能——让用户完全沉浸在下棋的体验中。跳棋？嗯，好吧，也许吧。但仅此而已。没有西洋棋。没有棒球。没有《光环\
  \ 3》。\n\nWindows 8 应用很像那样。它们会让你立即沉浸于为它们创建而执行的任务。一个股票应用应该直接进入概览图。没有菜单。如果你需要特定股票的信息，点击它的图线。一个新闻应用应该显示新闻。用户应该看到图片、标题、故事片段——与新闻直接相关的内容。\n\
  \n甚至是应用程序图标（称为磁贴 tile）也可以是其中的一部分。以图 3-2 中的天气应用为例——磁贴可以包含图像和文本，在用户启动设备后立即显示他们想要的基本信息。\n\
  \n### 为触摸设计（等等，我看到我的想法里有个错别字，让我重读一遍）\n**图 3-2：** 一个活跃的应用程序图标，称为磁贴。\n\n![9781118173350-fg0302.tif](img/9781118173350-fg0302.png)\n\
  \nWindows 一直以来一直是鼠标键盘的，这在短期内不会改变。在我们能够像《少数派报告》中的汤姆·克鲁那样操控一切之前，键盘将仍然是输入数据的主要方式。\n\
  \n但是从计算机获取数据呢？有什么不同？嗯，用户不需要在某些地方输入单词。此外，我们可以利用新的技术——特别是小型化和电容屏幕。小型化让我们能够将大大的 PC\
  \ 缩小成用户可以手持的小包。电容屏幕让我们能够用手指而不是手笔移动鼠标指针，因为每个人都讨厌手笔。\n\n微软认为 Windows XP 是支持触摸的。它接受电子墨并有屏幕键盘或软键盘，等等。除了它根本没有准备好，一点也没有。试过用手笔调整窗口大小吗？那完全是不可能的。\n\
  \n当你开始用手指做事情时，情况变得更糟。Windows 根本不是为触摸设计的。所有的图标都很微小，滚动条只有几像素宽，诸如此类。这是一个糟糕的触摸体验。\n\n\
  Windows 8 解决了这个问题。它是为触摸优先设计的，控件也证明了这一点。WinJS ——微软提供的新的 JavaScript 库——有一组针对触摸优化的\
  \ HTML 控件。触摸式输入由它为你处理。更重要的是，应用程序设计的哲学完全不同。触摸正是为什么外壳消失、为什么没有菜单，以及你与元素交互而不是告诉它们如何行为的原因。\n\
  \n由于这一切，虽然你可以使用鼠标和键盘运行 Windows 8 应用程序，但它需要针对触摸进行设计。\n\n### 多任务处理\n使用你的应用程序的人也会使用其他应用程序。考虑到这一点。因为所有的应用程序在设计上都是单次使用的，所以多个应用程序会同时运行。\n\
  \n这在计算机方面并不是问题，因为 Windows 8 应用程序享有沙箱机制，但在易用性方面可能是一个问题。用户不能被期望一直 Alt+Tab，因为，通常情况下，他们没有键盘！\n\
  \n\n\n\n\n![check.png](img/check.png) 全屏（Full screen）：如你所想象，全屏意味着应用程序占据了所有可用屏幕空间，仅留出一个用于注册边缘滑动的单像素边框。这意味着“全”，即没有开始按钮、没有时钟、没有系统托盘，什么都没有。全屏就是全屏。\n\
  \n![check.png](img/check.png) 填充（Fill）：对于屏幕上已停贴的应用程序，占据三分之二的视图。这是屏幕空间共享的主体份额。如图\
  \ 3-3 所示，它让你的应用程序保持大部分正方形，因此在设置布局时需要考虑布局空间的损失。如果你有一个带有大型详情页和侧边列表的界面，你可能想将详情放在顶部，列表放在下方，并允许滚动。\n\
  \n![check.png](img/check.png) 停贴（Snapped）：一种与填充视图形成对比的占据三分之一的视图。其理念是，停贴视图和填充视图可以作为两个不同的应用程序共同工作。由于空间大幅减少，你需要规划应用程序，以便在更充实的全屏视图中有效地显示导航视图。例如，多列布局应该压缩为单列。\n\
  \n![check.png](img/check.png) 挂起（Suspended）：这并不是一种真正的视图。当你的程序不在前台时，Windows 会“挂起”它使其不再运行。尽管如此，挂起的程序仍有方式与用户进行交互，这种应用程序的“视图”是你需要考虑的因素。第\
  \ 11 章关于应用程序挂起有很多详细内容。\n\n**图 3-3：** 两种视图状态：停贴和填充。\n\n![9781118173350-fg0303.eps](img/9781118173350-fg0303_fmt.png)\n\
  \n我将在第二部分中讨论处理多个视图的实现细节。不过，现在就开始考虑它吧，因为这不仅仅是将你的内容压缩以适应较小空间的问题。微软建议（我也同意）你实际上为每个视图状态都准备一个不同的布局。从全屏视图开始，并以此向下推进。\n\
  \n请记住，这不仅仅是为了好玩。人们利用视图状态功能来让工作变得轻松。例如，如果你正在计划一次旅行，可以将行程单停贴在右侧，地图停贴在左侧；或者将行程单放在左侧，航空公司订票软件放在右侧。所有部分都需要协同工作，为完成任务创造一个和谐的环境。\n\
  \n## 假设连接性\n\n在某个时刻，我们需要假设存在网络连接。那个时刻就是现在。互联网几乎无处不在。当我还是 90 年代中期一个一个小 Web 管理员时，一位富有远见的首席执行官告诉我，总有一天，互联网将遵循一种模式，使得良好的连接变得非常昂贵，而平庸的互联网连接对大众来说是免费的。她是正确的。如果你需要高质量的高速连接，你需要给本地电缆公司每月\
  \ 50 美元；或者你可以去咖啡馆与其他 20 个人免费共享狭窄、低速的连接。\n\nWindows 8 UI 应用程序是联网的。无论好坏，它们都假设存在网络连接。任何开发经验超过十年的人都会对此产生逻辑上的疑虑——我知道我\
  \ 20 年的经验正在大声抗议这有多么错误。但事实是，大多数人一直都是在线的，你不应该害怕假设这一点。\n\n尽管如此，如果应用程序没有连接到互联网，也不应该崩溃。无法工作？没关系。向用户显示一条消息，说明程序未连接，也许礼貌地提供将他们引导至网络控制面板，但不要让他们直接失败。\n\
  \n但在当今时代，制作一个在没有网络连接时完全无用的应用程序是可以接受的。这所有都需要与应用程序的需求达成平衡。例如，Proton（我在本书中编写的游戏）可以在单机模式下玩玩，所以如果用户没有网络连接，你不需要阻止他们。现在，如果没有网络，他们显然无法进行网络对战，但他们应该能够玩单机模式。\n\
  \n制作一个消耗新闻的应用程序是另一个例子。如果网络不可用，应用程序不应该崩溃。只需显示最后一次更新即可。社交网络应用也是如此。只需给用户最后的可用信息即可。这才是公平。\n\
  \n## 利用开发环境\n\n从目前来看，用户已经得到了 Windows 8 UI 的良好照顾。现在的问题是，开发者是如何被对待的呢？\n\n有一个好消息。开发者在微软仍然是首位，你可以从极高质量的工具中看出这一点。作为开发者，我们已经习惯了微软提供行业内最好的工具，这一点没有丝毫改变。\n\
  \n### 坚持使用 Visual Studio\n\n根据你的背景，你可能不知道 `Visual Studio` 已经在过去的 14 年左右变成了一个极其强大的集成开发环境（或\
  \ `IDE`）。在整个行业中，即使在那些普遍不喜欢微软产品的人中，`Visual Studio` 也被认为是集成开发环境（IDEs）的黄金标准。\n\n幸运的是，`Visual\
  \ Studio` 是 Windows 8 开发的起点。它长期以来一直是微软开发的中心，并且将继续如此。通过本书，大部分工作是在 `Visual Studio`\
  \ 中完成的，包括构建应用程序的基础结构、编写使其运行的 `JavaScript` 代码以及与外部库集成。\n\n### 选择语言\n\n然而，在 `Visual\
  \ Studio` 内部，有许多选择。`HTML5` 并不是唯一的平台。微软与 Windows 空间内的许多其他开发者社区保持着联系。\n\n### 复活 .NET\n\
  \n当 Windows 8 UI 的第一个传闻出现时，人们曾非常担心 `.NET` 可能会为了 `HTML5` 而被抛弃。现在，大多数敏锐的行业观察者意识到这极不可能。`.NET`\
  \ 与 `HTML5` 处理的功能非常不同，因此对大多数人来说，两者都能拥有长期而充实的生活。这正是正在发生的事情。\n\n所以处于生命支持的 `.NET` 已经复活。Windows\
  \ 8 程序的逻辑可以使用 `C#`、`VB.NET` 或任何其他 `.NET` 语言编写。你需要适应一些新的库和控件，但核心原则依然不会消失。\n\n此外，`.NET`\
  \ 库与 `HTML5` 之间有清晰的集成路径。这意味着你现有的 `C#` 代码无需浪费。我有一个与 `Meetup` API 交互的 `.NET` 库，我可以在我的\
  \ `HTML5` Windows 8 应用程序中无需修改地使用它。\n\n## 编写少量 C++\n\nWindows 空间内另一个不像 `.NET` 那么活跃的生态系统是\
  \ `C++`。真正的应用程序（如 `Excel`、`Photoshop` 等）都是用 `C++` 编写的。它比 `.NET` 更接近操作系统，并对 UI 和设备交互提供非常精细的控制。\n\
  \n使用 `C++` 构建 Windows 8 应用程序逻辑是可能的，甚至是推荐的。游戏尤其能受益于社区中大量的现有代码和强大的库支持。`C++` 应用程序可能比\
  \ `HTML5` 或 `.NET` 更快，为处理器的密集型任务提供了可能。而且与 `.NET` 一样，`C++` 库也可以被 `HTML5` Windows\
  \ 8 应用程序消费。\n\n### 引入 XAML\n\n虽然 `.NET` 和 `C++` 为构建 Windows 8 UI 的逻辑提供了功能性平台，但在某个时刻，我们必须把\
  \ UI 放回 UI 中。\n\n\n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 这是一个有趣的命名法旁记。当你提到\
  \ HTML5 时，你指的是 HTML 的布局能力、CSS 的样式能力以及 JavaScript 提供的逻辑。在 Windows 领域，并没有一个对应的术语来描述这种组合。`C#`\
  \ 是一门语言，`.NET` 是一个类库，而且还有诸如 `ASP.NET` 和 `Windows Forms` 等多种不同的布局方案。样式基本上是内置的。这非常令人困惑，但你可以这样理解：`.NET`\
  \ 是另一套编程工具，你可以用它用各种语言编写 Windows 8 应用程序的后端。而在 HTML5 中，你只需要使用 JavaScript。\n\n但是 `.NET`\
  \ 的 UI 是什么呢？`.NET` 和 `C++` 都使用微软自己的标记语言来编写 UI，称为 `XAML`。`XAML` 是 `Silverlight` 和\
  \ `Windows Presentation Foundation` 这微软另外两个 UI 设计平台的首选标记语言。Windows 8 的 UI 也可以在 `XAML`\
  \ 中设计。\n\n我用过去式谈论 `Silverlight` 和 `XAML`。看来这两者的库已经封装在支持 `XAML` 的 `.NET` 命名空间中了。在写本文时细节还不明确，但看起来尽管这些技术将继续存在，它们的名称可能会改变，而且这可不是为了保护无辜者。\n\
  \n## 提到 HTML5\n\n在这些页面中，我将讨论由 `HTML`、`CSS` 和 `JavaScript` 组成的 HTML5。我或多假设你已经对这些技术有了基本的了解，所以我不需要对它们进行长篇大论。\n\
  \n![tip.eps](img/tip_fmt.png) 不过，我想花时间聊聊 `WinJS`。`WinJS` 是一个 JavaScript 库，类似于 `jQuery`，它包含一系列控件和函数，让编写\
  \ Windows 8 应用程序变得更容易。`WinJS` 为我们带来的两个主要点是触摸输入以及适用于平板电脑的更大、预设的控件。你将在书中看到对 `WinJS`\
  \ 的引用，因为 Windows 8 应用程序很大程度上依赖它提供的功能。\n\n## 浏览 Expression Blend\n\nExpression Blend\
  \ 可能是 `FrontPage` 的逻辑继任者，但现在你几乎看不出它们的相似之处了。`Blend` 现在是一个精细调的设计工具，即使是最老练的用户体验 (UX)\
  \ 专家也认为使用它是一种享受。\n\n要从 `Visual Studio` 使用 `Blend`，只需右键点击 HTML5 Windows 8 应用程序，并在弹出菜单中选择“在\
  \ Expression Blend 中打开”。从那时起，`Blend` 就变为了你的设计师，你在 `Blend` 中进行的所有更改都会反映在 `Visual\
  \ Studio` 项目中。\n\nExpression 专注于 Windows 8 的用户界面 (UI) 元素。`Visual Studio` 和 `Blend`\
  \ 都能做很多事情，但某些事情显然在其中一个工具中比另一个更容易。`Blend` 是为了与 `HTML` 和 `CSS` 协作而设计的。`Assets Panel`（资源面板）和\
  \ `CSS` 属性提供了设置这些部分所需的工具。\n\n### Assets 面板和画布\n\n`Assets panel` 面板是存储放置在画布（画板）上物品的调色板。Windows\
  \ 8 应用程序的元素，如 `WinJS` 控件、`HTML` 元素、图像和文本都位于 `Assets panel` 上，当你准备好使用它们时，可以将它们移动到画布上。\n\
  \n画布是你的绘画画布。它代表了应用程序在运行时所处的空间。这并不意味着应用程序看起来和画布完全一样。`JavaScript` 可以调整完成后的应用程序在运行时的外观。画布为你提供了一个开始元素并设置重要属性的地方。\n\
  \n### CSS 属性\n\n说到属性，画布上资源的属性受一个名为层叠样式表（`CSS`）的标准的约束。在 `Visual Studio` 中，这些属性被存储并管理在一个名为\
  \ `CSS` 文件的代码文件中。它们以 `.css` 命名，并且看起来如下所示：\n\n```css\nbody{\n    background-color:\
  \ gray;\n}\np {\n    color: blue;\n}\nh3{\n    color: white;\n}\n```\n\n在 `Blend`\
  \ 中，样式看起来更像属性，有一个很方便的表单来填写各种元素。对于那些不是每天看 `CSS` 的人来说，这要容易得多，因为所有重要的属性都在那里，你不需要每次都记住它们叫什么。图\
  \ 3-4 显示了 `Blend` 如何让你处理 `CSS`。\n\n在 `CSS` 中，你可以为整个元素设置全局规则，仅为特定样式设置规则（这可能跨越元素），或者通过特定的\
  \ `ID` 设置规则，这仅适用于资源的某一个实例。困惑吗？你不孤单。这种细节让 `CSS` 变成了一种复杂的语言，而 UI 设计并没有忽视这种复杂性。构建一个能够支持像\
  \ `CSS` 这样困难内容的工具面板相当困难的，微软在这方面做得非常出色。\n\n**图 3-4：** `CSS` 中的 `Blend`。\n\n![9781118173350-fg0304.tif](img/9781118173350-fg0304_fmt.png)\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 在 `CSS` 中，当你声明样式时，格式为 `name\
  \ { };` 并带有标签的特定属性。如果你在名称前加一个点 (``)，你就是在指定一个类。\n\n## 处理 JavaScript\n\n\n\n\n\n除了风格之外，Windows\
  \ 8 应用从用户的角度来看还有某种特定的感觉。具体来说，用户应该想要使用这些应用。你打开过 `GIMP` 吗？那是一款图像处理软件。看看图 3-5。它非常强大，但你该从哪里开始呢？你甚至需要一本《傻瓜指南》来读这《傻瓜指南》！\n\
  \nWindows 8 应用应该是不同的。它们是即插即用的。它们是单一用途（或接近如此）。没有任何隐藏的内容，或者很少隐藏的内容。用户应该立即对使用该软件感到自信。对你的应用有多易用有疑问吗？找一个\
  \ 6 岁的孩子或 60 岁的老人用用。如果他们停顿了，说明它还不够好。\n\n**图 3-5：** GIMP 界面。\n\n![9781118173350-fg0305.tif](img/9781118173350-fg0305_fmt.png)\n\
  \n## 迈向下一步\n\n想要开始，你只需要开始开始。但我有一些关于不该做什么的建议。\n\n![check.png](img/check.png) 不要担心从一开始就去学习\
  \ `WinRT` 或 `WinJS`。使用示例（比如本书中的）并有机地学习它们。你可以轻松使用 [`dev.windows.com/`](http://dev.windows.com/)\
  \ 在需要时查询特定内容。\n\n![check.png](img/check.png) 不要构建“你好宇宙”。请不要列出一个需求清单。列一个就行。也许是两个。我知道\
  \ Windows 风格的“瑞士军刀型”应用是常态，但并不是 Windows 8 的核心。应用应该只做一件事或两件事，并且要做好它们。\n\n![check.png](img/check.png)\
  \ 不要做别人都在做的事。不要构建地图应用、小费计算器或博客阅读器。选择一个你感兴趣的，并围绕它设计一个应用。\n\n现在，请读完这本书剩余部分并尝试一些东西。当你完成后，你就准备好着挑战一些真正的\
  \ Windows 8 应用了。\n\n# 第 4 章：设置 Windows 8 应用\n\n### 本章内容\n\n- ![arrow](img/arrow.png)\
  \ 从新项目开始\n- ![arrow](img/arrow.png) 使用模板进行布局\n- ![arrow](img/arrow.png) 帮助用户导航\n\
  \n如果你是一位出色的 Web 程序员、精通移动端的开发者，或者想要为 Windows 8 编程的资深桌面大师，我有一个坏消息。你的很多技能将需要一些调整。在\
  \ Windows 8 中开发利用了你现有的许多技能，但也有一些“坑”。\n\n本章的目标是让你了解这些“坑”。本章末尾有一个测试，看看你表现得如何。（开个玩笑。我想是。）\n\
  \n在本章中，我将带你走完整个应用程序——侧重于 Windows 8 模板的结构。这个应用什么都做不了，但没关系。我会在书的后部分向你展示很多实现巧妙功能的代码。\n\
  \n### 在 Visual Studio 中开始\n\n我在第 1 章中让你领略了 `Visual Studio`，但它并不是我们武器库中唯一的工具。`Visual\
  \ Studio` 有多个版本可付费或免费使用。不同的版本吸引不同的群体。\n\n表 4-1 详细列了 `Visual Studio` 的不同版本。\n\n表\
  \ 4-1 Visual Studio 版本\n\n| 名称 | 为什么使用它 |\n| :--- | :--- |\n| `Visual Studio 2012\
  \ Express Edition` | 它是免费的 |\n| `Visual Studio 2012 Professional Edition` | 它能够构建各种\
  \ Microsoft 应用，而不是 Windows 8 |\n| `Visual Studio 2012 Premium Edition` | 增加了架构、数据库和测试工具\
  \ |\n| `Visual Studio 2012 Ultimate Edition` | 它包含了企业级程序员所需的一切，包括 Team Foundation\
  \ Server 集成。 |\n\n本书使用的是 Express 版本。除了开发者密钥外，Express 包含了开发 Windows Store 应用所需的所有内容。第四部分涵盖了进入\
  \ Store 的细节，包括获取开发者密钥。\n\n为了让一切运转起来，启动 `Visual Studio`（现在先选择你喜欢的版本），然后点击左上角 Logo\
  \ 正下方的 `New Project`（新建项目）。这将弹出 `New Project` 对话框。\n\n### 项目类型\n\n图 4-1 所示的 `New\
  \ Project` 对话框四个部分：\n\n- ![check.png](img/check.png) 最近：指向你最近使用的项目链接。\n- ![check.png](img/check.png)\
  \ 已安装：包含随程序安装或在此 `Visual Studio` 实例上安装的示例和模板。\n- ![check.png](img/check.png) 模板：处理内置项目类型。`Samples`\
  \ 子标题包含已本地安装的示例代码。\n- ![check.png](img/check.png) 在线：在线访问 MSDN 和社区的模板和示例。\n\n`Online`\
  \ 选项卡让你从微软下载示例和模板。一旦获取了它们，它们就会出现在 `Installed` 部分。如果你需要某些你没有的东西，先在 `Online` 部分中查找，这样就不用浪费时间去搜索不同的在线资源。\n\
  \n`Installed` 部分中的 `Templates` 文件夹是你将花费大量时间的地方。你安装的所有语言都将有一个文件夹。在编写时，你在这里看到 `JavaScript`、`C#`\
  \ 和 `VB.NET`。\n\n**图 4-1：** 新项目对话框。\n\n![9781118173350-fg0305.tif](img/9781118173350-fg0305_fmt.png)\n\
  \n![remember.png](img/remember.png)\n\n#### 创建新项目\n\n创建一个新项目。这本书是关于 HTML5 应用的。但是，知道\
  \ Windows 8 模板可以做什么是很重要的。\n\n#### .NET 模板\n\n好消息是你可以使用 `.NET` 构建东西。坏消息是，你仍然受限于 Windows\
  \ 8 的规则。例如，Windows 8 应用不提供数据库访问（更多内容见第 12 章和第 15 章）。\n\n在 `New Project` 对话框中，有几类类别。其中三个与布局有关，两个与结构有关，一个用于测试。\n\
  \n**图 4-2：** .NET 模板。\n\n![9781118173350-fg0402.tif](img/9781118173350-fg0402_fmt.png)\n\
  \n`Blank App`、`Split App (XAML)` 和 `Grid App (XAML)` 模板定义了推荐用于 Windows 8 的布局。我将在本章“构建不同的布局”中介绍这些。`Class\
  \ Library` 和 `Windows Runtime Components` 项目设置 `WinRT` 动态链接库 (`DLL`)，它可以被各种不同的应用程序调用。它对于代码复用很有用。`unit\
  \ test` 项目正如其名——确保你的程序按照你的要求运行。\n\n#### 使用 C++ 工作\n\n`C++` 是 Windows 8 世界中一个有趣的补充。如果你点击\
  \ `C++` 选项卡，你会发现一个与 `.NET` 列表非常相似的列表。例如，布局项目是相同的，这应该是，因为它们使用 `XAML` 作为标记语言。\n\n\
  `C++` 还具有 `WinRT Component DLL`。这与 `Class Library` 基本上相同，但它是专门设计用于扩展作为 Windows 8\
  \ 世界基础的 `WinRT` 库。`.NET Class Library` 更偏向于业务逻辑。\n\n\n\n\n为什么 C++ 也会在其中？列表中的最后一个项目——`DirectX\
  \ Applications`——就是原因。C++ 是 Windows 的图形语言。如果你正在构建基于矢量绘制的多边形游戏或应用程序，你需要 `DirectX`。C++\
  \ 是获取 `DirectX` 的途径。地图应用、3D 游戏和复杂的用户界面通常都是使用 C++ 和 `DirectX` 编写的\n\n![remember.eps](img/remember_fmt.png)\
  \ 这本书不是关于那的。这本书是关于 HTML 的，它使用的是位图。你可以不需要 DirectX 也能运行。\n\n## JavaScript 模板\n\n现在是有趣的内容。HTML5\
  \ 应用程序完全关乎布局。除了非常有用的 `Blank App` 之外，你还有四种布局是大多数信息驱动型 Windows 8 应用程序的驱动焦点。\n\n我将在本章稍后的“构建不同的布局”中介绍布局细节，但现在，请记住根据第\
  \ 2 章的指南，`Fixed Layout`、`Grid` 和 `Split` 是 Windows Store 应用程序应该使用的三个核心导航系统。\n\n\
  ## 解决方案布局\n\n在命名不当的 JavaScript 项目中（它真的应该是 HTML5，但随它吧），创建一个新的 `Blank App` 项目。不要担心名称——你做完后会把它删掉的。\n\
  \n看看图 4-3。顶部是通常的项目详情。如果你不熟悉 `Visual Studio`，你可能不知道图 4-3 右上角的 `References`。`References`\
  \ 是一个虚拟文件夹，存放项目项目使用的库文件的链接。如果你需要一个特殊的方法或属性，而它可以通过特殊的 `DLL` 获取，那么 `DLL` 的名称和路径就可以在这里找到。\n\
  \n**图 4-3：** 核心 JavaScript 项目布局。\n\n![9781118173350-fg0403.tif](img/9781118173350-fg0403_fmt.png)\n\
  \nHTML5 领域的 Windows 8 应用程序意料之中很像网站。`CSS` 文件夹将样式表文件放在一起。遗憾的是，情况并非如此。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 当你向 Windows 8 应用程序添加新文件时，`Visual Studio` 会在同一个地方放入一个 `CSS` 文件、一个 `HTML` 文件和一个\
  \ `JavaScript` 文件。通常来说，这是一个坏主意。你希望环境让开发者知道文件存储在何处。如果你想让 `CSS` 文件位于 `CSS` 文件夹中，你必须移动它们并更改引用。\n\
  \n`Images` 文件夹存放位图资产，如按钮、标志等。`JS` 文件夹存放 `JavaScript` 文件，并存在与 `CSS` 文件夹相同的问题——在创建创建文件时必须移动它们。\n\
  \n`References` 文件夹很有趣。它包含了在用户界面层实现所有“魔法”的库。它从一个项目复制到另一个项目。这看起来像个糟糕的主意，但随后你会考虑到版本问题。从开发工具的每一个版本来看，发生了很多变化。在这种布局中，库不会随之改变，这是一好事。\n\
  \n在 `WinJS` 之后，你会看到两个文件：默认 HTML 文件和应用程序清单（`appxmanifest`），如图 4-4 所示。默认 HTML 文件是这一切开始的地方。应用程序清单是项目设置文件——它对应用程序有很大影响。\n\
  \n**图 4-4：** 应用程序清单。\n\n![9781118173350-fg0404.tif](img/9781118173350-fg0404_fmt.png)\n\
  \n应用程序清单包含了所有对应用程序核心的设置，如包信息和图标标志文件。此清单包含最重要的细节之一是功能列表。这是你的应用程序在 Windows 8 空间中可以执行的操作列表。每个默认模板在它们的声明中都包含\
  \ `Internet Access`，但你必须勾选你将使用的任何其他内容，用户将在安装时被告知这些内容。\n\n## 构建不同的布局\n\nWindows 8\
  \ 空间中的 HTML5 应用程序特别擅长显示结构化数据——就像网页一样。我在本章之前“创建新项目”部分查看的模板中提供的三种布局，是 Windows 8 应用程序的首选外观，紧密遵循\
  \ Windows 8 风格指南。\n\nWindows 8 不仅仅是一个随机的名字。它是微软整合的一套设计语言，首次在 Windows Phone 7 和 Xbox\
  \ 用户界面中看到。微软这样描述它：“Windows 8 是我们的设计语言。我们称之为 Windows 8 是它是现代且简洁的。它是快速且灵动的。它关乎内容和排版。它是完全正宗的。”模板让你的应用程序保持\
  \ Windows 8 风格。\n\n### Grid 布局\n\nGrid 布局是最简单的主/详情布局。集合中的项目以网格形式显示，点击其中一个会将屏幕切换到详情视图。这是一种显示产品、电影、故事或任何具有项目/详情层级结构内容的经典且非常实用的方法。\n\
  \n从 `New Project` 对话框，创建一个新的 `Grid layout` 应用程序。`Visual Studio` 为你创建了一组默认页面，实际上开箱就能制作出一个外观很不错的\
  \ Windows 8 应用程序。数据全是假的，但差不离就行，对吧？\n\n在键盘上按 `F5` 看看我的意思。取决于你运行的硬件平台，会出现 Windows\
  \ 8 界面，你将需要 `Alt+Tab` 或回到 `Visual Studio` 并停止调试以回到桌面模式。\n\n`Grid layout` 用于具有图片和大量细节的结构。\n\
  \n### Split 布局\n\nGrid 布局是最简单的主/详情布局。集合中的项目以网格形式显示，点击其中一个会将屏幕切换到详情视图。这是一种显示产品、电影、故事或任何具有项目/详情层级内容的经典且非常实用的方法。\n\
  \n从 `New Project` 对话框，创建一个新的 `Grid layout` 应用程序。`Visual Studio` 为你创建了一组默认页面，实际上开箱就能制作出一个外观很不错的\
  \ Windows 8 应用程序。数据全是假的，但差不离就行，对吧？\n\n在键盘上按 `F5` 看看我的意思。取决于你运行的硬件平台，会出现 Windows\
  \ 8 界面，你将需要 `Alt+Tab` 或回到 `Visual Studio` 并停止调试以回到桌面模式。\n\n`Grid layout` 用于具有图片和大量细节的结构。\n\
  \n\n\n\n\n```javascript\ndocument.body.addEventListener('keyup', function (e) {\n\
  \    if (e.altKey) {\n        if (e.keyCode === WinJS.Utilities.Key.leftArrow) {\n\
  \            WinJS.Navigation.back();\n        }\n        else if (e.keyCode ===\
  \ WinJS.Utilities.Key.rightArrow) {\n            WinJS.Navigation.forward();\n \
  \       }\n    }\n}, false);\nWinJS.UI.process(document.getElementById('appbar'))\n\
  \    .then(function () {\n        document.getElementById('home').addEventListener('click',\
  \ navigateHome, false);\n    });\nWinJS.Navigation.navigate(homePage);\n}\n```\n\
  \n这里重要的是最后一行可运行的代码。它负责查找用于导航的拆分页面，那里就是重要逻辑所在。\n\n分栏布局是通过 HTML5 的 `section` 标签实现的。`section`\
  \ 将一个 `div` 进行细分，这正是你在这里所做的。这里有一个用于列表的 `section` 和一个用于详情的 `section`。\n\n```html\n\
  <section class=\"itemListSection\">\n    <div class=\"itemList\"\n         data-win-control=\"\
  WinJS.UI.ListView\"\n         data-win-options=\"{dataSource: splitPage.items, oniteminvoked:\
  \ splitPage.itemInvoked, layout: {type: WinJS.UI.ListLayout}, selectionMode: 'none'\
  \ }\"></div>\n</section>\n```\n\n```html\n<section class=\"articleSection\" aria-live=\"\
  assertive\" aria-atomic=\"true\" aria-label=\"Item detail\">\n    <header class=\"\
  header\">\n        <div class=\"image\" data-win-bind=\"style.backgroundColor: backgroundColor;\
  \ style.backgroundImage: backgroundImage; alt: title\"></div>\n        <div class=\"\
  text\">\n            <h1 class=\"title win-contentTitle\" data-win-bind=\"textContent:\
  \ title\"></h1>\n            <h2 class=\"subtitle win-itemText\" data-win-bind=\"\
  textContent: subtitle\"></h2>\n            <p class=\"description\" data-win-bind=\"\
  textContent: description\"></p>\n        </div>\n    </header>\n    <article class=\"\
  content\" data-win-bind=\"innerHTML: content\"></article>\n</section>\n```\n\n第一个部分\
  \ `itemListSection` 包含一个 `itemList` ，它引用了 `itemTemplate` 之上的 `WinJS.Binding.Template`。这是你应该尽可能模仿的常用模式。\n\
  \n```html\n<div class=\"itemTemplate\" data-win-control=\"WinJS.Binding.Template\"\
  >\n    <div class=\"largeIconTemplate\">\n        <div class=\"largeIconTemplateImage\"\
  \ data-win-bind=\"style.backgroundColor: backgroundColor\"></div>\n        <div\
  \ class=\"largeIconTemplateBackground\">\n            <div class=\"largeIconTemplateLargeText\
  \ win-itemTextStrong\" data-win-bind=\"textContent: title\"></div>\n           \
  \ <div class=\"largeIconTemplateSmallText win-itemTertiary\" data-win-bind=\"textContent:\
  \ subtitle\"></div>\n            <div class=\"largeIconTemplateMediumText win-itemText\"\
  \ data-win-bind=\"textContent: description\"></div>\n        </div>\n    </div>\n\
  </div>\n```\n\n这是 Windows 8 的新数据绑定方式。看到 `div` 中的 `data-win-control` 标签了吗？那是 Windows\
  \ 8 控件的定义。在 section 代码中，你可以找到 `data-win-bind`。它以及 `data-win-options` 就是属性设置。这是在\
  \ Windows Store 应用中将信息引入 UI 的新方法。我将在第 7 章介绍数据绑定。现在，请记住布局是由新的 `section` 标签处理的，而单独的绑定了重复信息的布局。打开\
  \ `splitPage.js` 查看导航是如何填充的。`fragment.load` 事件获取了供给 `navigate` 函数的命名空间。\n\n```javascript\n\
  WinJS.Application.mainwindow = function (e) {\n    if (e.detail.kind === Windows.Application.ActivationKind.launch)\
  \ {\n        homePage = document.body.getAttribute('data-homePage');\n        document.body.addEventListener('keyup',\
  \ function (e) {\n            if (e.altKey) {\n                if (e.keyCode ===\
  \ WinJS.Utilities.Key.leftArrow) {\n                    WinJS.Navigation.back();\n\
  \                }\n                else if (e.keyCode === WinJS.Utilities.Key.rightArrow)\
  \ {\n                    WinJS.Navigation.forward();\n                }\n      \
  \      }\n        }, false);\n        WinJS.UI.process(document.getElementById('appbar'))\n\
  \            .then(function () {\n                document.getElementById('home').addEventListener('click',\
  \ navigateHome, false);\n            });\n        WinJS.Navigation.navigate(homePage);\n\
  \    }\n}\n```\n\n### 固定布局\n\n固定布局是最简单的选项。它使用了 `ViewBox`，这是一个有助于在层级模型中进行导航的 WinJS\
  \ 控件。\n\n```html\n<body>\n    <div data-win-control=\"WinJS.UI.ViewBox\">\n    \
  \    <div class=\"fixed-layout\">\n            <p>内容在此处</p>\n        </div>\n  \
  \  </div>\n</body>\n```\n\n## 漫游与跳转\n\n许多 Windows 8 应用的工作方式就像网站：你有一个首页，并在内容页面之间移动。这完全没问题：事实上，这很好。如果内容是动态的，这种方法会带来巨大的价值——这正是万维网如此流行的原因。\n\
  \n然而，Windows 8 不需要 Web 那标准的 HTTP 请求-响应模式，因此你有机会稍微微调一下模型。微软通过 WinJS 中的 Navigation\
  \ 库对 HTTP 模型进行了一些修改。\n\n## 导航\n\nNavigation 库的设计是为了让 Windows 8 开发中的片段导航（fragment\
  \ navigation）变得更简单。片段导航是将小段 HTML 内容注入到主 HTML 页面中。JavaScript 为我们提供了工具，可以在应用程序中移动这些\
  \ HTML，并给用户切换页面的视觉体验。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 如果你开发了一段时间网站，你可能还记得\
  \ iframe。`div` 并不总是拥有像现在这样的力量。我们以前经常使用 iframe，它实际上会在浏览器内部启动一个新的浏览器实例。不言而喻，在过去（20\
  \ 世纪 90 年代初），这会导致各种安全和性能问题。如今，浏览器对 iframe 的处理得更好了，你可以使用 `divs`，它的效果更好。\n\n在深入研究代码之前，先看一个静态示例。在图\
  \ 4-7 中，你看到一个带有内容区域的主页面。从意义上讲，内容区域是一个 `div` 标签。这种思想是按需加载“片段”并将其展示给用户。\n\n**图 4-7**：导航系统。\n\
  \n![9781173350-047.tif](img/9781173350.tif)\n\n代码中的某些地方需要跟踪导航状态。应用需要记住它处于哪个片段，以及之前发生了什么（以防用户按下返回按钮）。此外，根据应用的不同，应用还需要记住下一个页面。这需要一些精力。\n\
  \n### 加载片段\n\n幸运的是，WinJS 提供了让 Windows 8 约束下的导航所需的工具。`WinJS.Navigation` 命名空间拥有完成任务所需的工具。\n\
  \n更棒的是，Visual Studio 有导航模板。如果你点击文件⇒新建项目并查看 Windows 8 JavaScript 应用，你会看到导航应用程序。它被描述为“一个使用\
  \ Windows 8 风格框架并包含导航支持的简约风格应用程序”。\n\n查看源码可以发现导航模板是一个相当现代的分屏模型。它包含包含内容的 `div` 标签以及另一个包含导航工具的\
  \ `div`。\n\n\n\n\n\n```html\n    </div>\n\n</body>\n```\n\n标记为 `contentHost` 的 `div`\
  \ 用于存储定向到该处的内容。应用栏 `div` 则更有趣性。它具有一个 `data-win-control` 属性，这是一个 Windows 8 特有的字段，在渲染时包含特定的样式和功能。\n\
  \n这个 `data-win-control` 指的是 `WinJS.UI.AppBar`，它是你在 Windows 8 应用中通过从底部向上滑动可以访问的小型滑动条。所有应用程序底部都有一个\
  \ 1 像素的触发区域，使得滑动操作生效，而这里显示的 `div` 为该栏设置了内容。\n\n该应用栏旨在赋予你将新片段（fragments）加载到 `contentHost`\
  \ 中的。你可以通过按钮、页码或 VCR 风格的控件来实现。这并不重要，只要内容被加载即可。\n\n片段的加载在 `default.js` 中设置。还记得默认页面\
  \ `body` 标签中那个奇怪的 `data-homepage` 属性吗？它用于设置 `contentHost` 中的初始页面：\n\n```javascript\n\
  WinJS.Application.onmainwindowactivated = function (e) {\n    if (e.detail.kind\
  \ === Windows.ApplicationModel.Activation.ActivationKind.launch) {\n        homePage\
  \ = document.body.getAttribute(‘data-homePage’);\n        document.body.addEventListener(‘keyup’,\
  \ function (e) {\n            if (e.altKey) {\n                if (e.keyCode ===\
  \ WinJS.Utilities.Key.leftArrow) {\n                    WinJS.Navigation.back();\n\
  \                }\n                else if (e.keyCode === WinJS.Utilities.Key.rightArrow)\
  \ {\n                    WinJS.Navigation.forward();\n                }\n      \
  \      }\n        }, false);\n        WinJS.UI.process(document.getElementById(‘appbar’))\n\
  \            .then(function () {\n                document.getElementById(‘home’).addEventListener(‘click’,\
  \ navigateHome, false);\n            });\n        WinJS.Navigation.navigate(homePage);\n\
  \    }\n}\n```\n\n应用激活后，会处理几个键盘事件，然后使用 `WinJS.Navigation` 命名空间将页面导航到主页。\n\n### 添加片段\n\
  \n只有一个页面确实相当无聊。对于一个内容，你为什么需要导航呢，对吧？为了让事情更有趣一点，做些疯狂的，比如添加一个页面、屏幕表单或任何你想称呼它的东西。从微软的角度，它是一个片段，在任何其他范式中它都被视为表单或页面。\n\
  \n要在模板应用程序中添加第 2 页，请执行以下操作：\n\n1. 在解决方案（Solution Explorer）中，右键点击 HTML 文件夹并点击 `Add⇒New\
  \ Item`。\n2. 在弹出的“新建项”对话框中，选择 `Page Control` 项并将其命名为 `Page2.html`，如图 4-8 所示。\n\n\
  **图 4-8：** 添加一个新的 Page Control。\n\n![9781118173350-fg0408.tif](img/9781118173350-fg0408_fmt.png)\n\
  \n3. 更新 `Page2.html` 的 `body` 内容，以便当你到达那里时可以显示一些酷炫的内容。\n\n```html\n<body>\n    <div\
  \ class=”Page2 fragment”>\n        <header role=”banner” aria-label=”Header content”>\n\
  \            <button disabled class=”win-backbutton” aria-label=”Back”></button>\n\
  \            <div class=”titleArea”>\n                <h1 class=”pageTitle win-title”>Welcome\
  \ to Page2</h1>\n            </</div>\n        </header>\n        <section role=”main”\
  \ aria-label=”Main content”>\n            <p>This is my page 2! Isn’t cool?</p>\n\
  \        </section>\n    </div>\n</body>\n```\n\n4. 在 `default.html` 中，添加一个将用户带到第\
  \ 2 页的按钮。这位于应用栏 `div` 中。\n\n```html\n<div id=”appbar” data-win-control=”WinJS.UI.AppBar”\
  \ aria-label=”Command Bar” data-win-options=\"{position:’bottom’, transient:true,\
  \ autoHide:0, lightDismiss:false}\">\n    <div class=”win-left\">\n        <button\
  \ id=”home” class=”win-command\">\n            <span class=\"win-icon win-large\"\
  >&#xE10F;</span>\n            <span class=\"win-label\">Home</span>\n        </button>\n\
  \        <button id=”page2” class=”win-command\">\n            <span class=\"win-icon\
  \ win-large\">&#xE10F;</span>\n            <span class=\"win-label\">Page2</span>\n\
  \        </button>\n    </div>\n</div>\n```\n\n5. 在 `default.js` 中，你为新按钮需要一个事件处理程序。将其添加到\
  \ `process` 方法中（位于末尾）：\n\n```javascript\nWinJS.UI.process(document.getElementById(‘appbar’))\n\
  \    .then(function () {\n        document.getElementById(‘home’).addEventListener(‘click’,\
  \ navigateHome, false);\n        document.getElementById(‘page2’).addEventListener(‘click’,\
  \ navigatePage, false);\n    });\n```\n\n6. 嘿，你需要 `navigatePage`，不是吗？在上方添加它：\n\n\
  ```javascript\nfunction navigatePage() {\n    WinJS.Navigation.navigate(homePage);\n\
  }\n```\n\n\n\n\n\n你可以看到微软在创建新的页面控件时，在它的设计工作中是如何考虑 `div` 的。（请记住，页面控件是用户可以进行导航的内容片段。）要创建一个新的页面控件，请按照以下步骤操作：\n\
  \n1. 右键点击一个新项目（我将我的项目命名为 EverydayControls），并选择 `Add New⇒Folder`。\n2. 将新文件夹命名为 `Pages`\
  \ 并点击 OK。\n3. 右键点击新生成的 `Pages` 文件夹并选择 `Add New⇒Item`。\n4. 在图 5-2 所示的“New Item”（新项目）对话框中，你可以看到除了选定的\
  \ Page Control 外，还有各种其他项目。\n\n**图 5-1:** 更改起始页。\n![9781118173350-fg0501.tif](img/9781118173350-fg0501_fmt.png)\n\
  \n**图 5-2:** 添加新的页面控件。\n![9781118173350-fg0502.tif](img/9781118173350-fg0502_fmt.png)\n\
  \n你需要 Page Control 项目，就像我所选的那样。这会为你的项目添加一个新的新的 HTML、CSS 和 JS 文件。\n\n5. 在 Name 字段中输入名称\
  \ `div` 并点击 OK。\n\n![remember.eps](img/remember_fmt.png) 将项目命名为 `div` 不会改变它所使用的模板内容。这只是因为该控件中的代码都是关于\
  \ `div` 标记的。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 如果你查看新的 `Div.html`\
  \ 文件，可以看到基础内容都封装在一个 `div` 中。内容还利用了新的 HTML5 `header` 和 `section` 标签，这太棒了。使用这些标签可以提供更好的搜索体验，因为搜索引擎知道它们正在查看的是什么类型的内容。\n\
  \n```\n<div class=\"Div fragment\">\n    <header aria-label=\"Header content\" role=\"\
  banner\">\n        <button class=\"win-backbutton\" aria-label=\"Back\" disabled></button>\n\
  \        <h1 class=\"titlearea win-type-ellipsis\">\n            <span class=\"\
  pagetitle\">Welcome to Div </span>\n        </</h1>\n    </header>\n    <section\
  \ aria-label=\"Main content\" role=\"main\">\n        <p>Content goes here.</p>\n\
  \    </section>\n</div>\n```\n\n`Divs` 用于内容管理。`Headers` 和 `sections` 基本上就是 `divs`。当你向代码中添加一个你想要添加更多\
  \ HTML 的 section 时，你会使用 `div` 来来实现。\n\n在前述代码的 `div` 标签中，你可以看到它有一个 d`iv` fragment\
  \ 的 `class` 标记。这是对 `div` 样式的引用。如果你愿意，可以在 `div.css` 文件中更改该样式，并更改屏幕上该整个区域代码的显示，但我离题了。\n\
  \n现在，进入 `Div.js` 并找到页面级函数。顶层函数的作用是防止我们页面代码“污染”整个应用程序的作用域，防止此页面上的代码影响其他页面。作用域（Scoping）是一个完全不同的主题。为了获得全面的教育，请查阅\
  \ Andy Harris 编写的 JavaScript and AJAX For Dummies》（由 John Wiley & Sons, Inc. 出版）。只需相信我吧。\n\
  \n首先，我向你展示如何添加一个 `id` 函数。这就像 LISP 中的宏（是的，我提到那里了），以便更容易地访问页面上的 HTML 元素。我建议你将 `id`\
  \ 函数放在整个应用程序可访问的地方。现在，我把它放在页面控件中。（在章节结束时，我可能会改变主意。）\n\n然后，我向你展示如何更改 `ready()` 函数的内容。当页面准备好处理元素访问时，这就是它的名字。如果你熟悉\
  \ JQuery，`ready` 函数就像 `$(document).ready()`。最终代码如下：\n\n```\n// 有关 HTML 模板的介绍，请参考以下文档：\n\
  // http://go.microsoft.com/fwlink/?LinkId=232511\n(function () {\n    \"use strict\"\
  ;\n    // 每当用户导航到此页面时都会调用此函数。\n    // 用应用程序的数据填充页面元素。\n    var id = function (elementID)\
  \ {\n        return document.getElementById(elementID);\n    }\n    function ready(element,\
  \ options) {\n        var numbers = [1,2,3,4,5];\n        id('numberList').innerHTML\
  \ = '<ul>';\n        for (var x in numbers) {\n            id('numberList').innerHTML\
  \ += '<li>'+x+'</li>';\n        }\n        id('numberList').innerHTML += '</ul>';\n\
  \    }\n    function updateLayout(element, viewState) {\n        // TODO: 响应 viewState\
  \ 的变化。\n    }\n    WinJS.UI.Pages.define(\"/Pages.html\", {\n        ready: ready,\n\
  \        updateLayout: updateLayout\n    });\n})();\n```\n\n按下 `F5` 运行，你将在屏幕左侧看到\
  \ 0..4 的列表，就在 Welcome to Div 标题下方。为了让样式更具吸引力，你可以编辑 `Div.css`。将 `margin-left` 参数更改为\
  \ 40 像素的间隙会让它看起来好看一些。生成的代码如下：\n\n```\n.Div p {\n    margin-left: 120px;\n}\n#numberList\
  \ {\n    margin-left: 40px;\n}\n```\n\n重新运行页面，你可以发现它现在有了项目符号和一点间距。好多了。这种样式和代码适用于书中的所有内容，当然也在本章。布局在\
  \ `.html` 文件中，功能在 `.js` 文件中，而样式在 `.css` 文件中。\n\n### 文本框\n\n啊，谦逊的文本框。它接收数据并在请求时返回数据。在\
  \ Web 世界中你离不开它，Windows 8 客户端也是如此。如果你只是显示数据而不进行编辑，那么 `div` 适合你，但如果你需要用户能够进行更改，请考虑文本框（textbox）。\n\
  \n右键点击 `Pages` 目录并像你在之前关于 `div` 的节中做的那样添加新的页面控件。这次，将页面控件命名为 `Textbox`。这会创建一个 `Textbox.js`、`Textbox.css`\
  \ 和 `Textbox.html` 文件。打开 `Textbox.html` 以开始使用 `textbox`。在打开 `Textbox.html` 文件后，将光标放在\
  \ `<P>content goes here</P>` 文本处。你将看到两个视图：HTML 和 General，如图 5-3 所示。General 标签里 .\
  \ . . 什么也没有 . . . HTML 标签包含了一些东西。\n\n**图 5-3:** 工具箱。\n![9781118173350-fg0503.tif](img/9781118173350-fg0503_fmt.png)\n\
  \n当我说 HTML 标签包含了一些东西时，我指的是少数几个。并不是在 Windows 8 应用中可以使用的所有项目集合，但它确实有一些好处。首先，它让你直接开始开发应用程序。其次，你可以向工具箱添加内容，比如不常用的\
  \ HTML。现在，让它帮你开始吧。稍后我会向你展示如何添加内容。\n\n#### 获取页面上的文本框\n\n开始之前，要知道文本框接收一些形式。如果你熟悉 HTML，你可能知道文本框是\
  \ `Input` 控件族的一部分，并且有几种类型，具体包括：\n\n![check.png](img/check.png) 文本\n![check.png](img/check.png)\
  \ 文件\n![check.png](img/check.png) 密码\n\n通常文本框被称为文本输入字段。为了让它在页面上运行，你只需要从工具箱将 `Input\
  \ (Text)` 项目拖到你的 HTML 页面上即可。生成的代码如下：\n\n```\n<body\n    <div class=\"Textbox fragment\"\
  >\n        <header aria-label=\"Header content\" role=\"banner\">\n            <button\
  \ class=\"win-backbutton\" aria-label=\"Back\" disabled></button>\n            <h1\
  \ class=\"titlearea win-type-ellipsis\">\n                <span class=\"pagetitle\"\
  >Welcome to Textbox</span>\n            </h1>\n        </header>\n        <section\
  \ aria-label=\"Main content\" role=\"main\">\n            <p>Content goes here.</p>\n\
  \            <input id=\"Text1\" type=\"text\" />\n        </section>\n    </div>\n\
  </body>\n```\n\n\n\n\n当文本框出现在页面后，我们想对它做两件事：从中获取数据和向其写入数据。无论哪种方式，它的工作原理非常像网页上的 HTML。\n\
  \n### 设置值\n\n要设置值，你需要从 JavaScript 文件中的 HTML 中获取文本框的引用，然后设置它的 `value` 属性。打开 `Textbox.js`\
  \ 并在 `ready()` 函数中添加这段代码：\n\n```javascript\n//Setting a textbox\nvar firstTextbox\
  \ = document.getElementById(\"Text1\");\nfirstTextbox.value = \"Let’s type!\";\n\
  ```\n\n就是这些了。按下 `F5` 运行程序，你就可以看到值被设置好了。非常直观，对吧？\n\n### 获取值\n\n现在，要获取值，你需要额外添加一些代码。\n\
  \n1. 在 HTML 文件中，添加第二个文本框。它默认名为 `Textbox2`。目前这样没问题。\n2. 在文本框下方添加一个 `div`，就像我们在在本章早些时候\
  \ `div` 部分做的那样。给它一个 `'youTyped'` 的 `id`。\n3. 在其下方，拖入一个 `Input`（按钮）。这为你提供了一个可以绑定的事件。\n\
  4. 最终的 HTML（至少是 HTML 的主体）看起来如下：\n\n```html\n<body><body>\n  <div class=\"Textbox\
  \ fragment\">\n    <header aria-label=\"Header content\" role=\"banner\">\n    \
  \  <button class=\"win-backbutton\" aria-label=\"Back\" disabled></button>\n   \
  \   <h1 class=\"titlearea win-type-ellipsis\">\n        <span class=\"pagetitle\"\
  >Welcome to Textbox</span>\n      </</h1>\n    </header>\n    <section aria-label=\"\
  Main content\" role=\"main\">\n      <p>Content goes here.</p>\n      <input id=\"\
  Text1\" type=\"text\" />\n      <input id=\"Text2\" type=\"text\" />\n      <div\
  \ id=\"youTyped\"></div>\n      <input id=\"Button1\" type=\"button\" value=\"button\"\
  \ />\n    </section>\n  </div>\n</body>\n```\n\n现在，回到 JavaScript，你必须添加一个事件处理器。要在\
  \ JavaScript 中实现这一点，你使用控件的 `addEventHandler` 方法。完成后，代码看起来如下：\n\n```javascript\n\
  function ready(element, options) {\n  //Setting a text box\n  var firstTextbox =\
  \ document.getElementById(\"Text1\");\n  firstTextbox.value = \"Let’s type!\";\n\
  \  //Getting from a text box\n  var secondTextbox = document.getElementById(\"Text2\"\
  );\n  var youTyped = document.getElementById(\"youTyped\");\n  var theButton = document.getElementById(\"\
  Button1\");\n  theButton.addEventListener('click', function () {\n    youTyped.innerHTML\
  \ = secondTextbox.value;\n  });\n}\n```\n\n按下 `F5`，然后在第二个文本框（右侧）中输入内容。点击按钮，你会看到类似图\
  \ 5-4 的效果。\n\n**图 5-4：** 你好，事件处理器！\n![978118173350-fg054.tif](img/978118173350-fg054.png)\n\
  \n设置事件处理器实际上是将文本框的一个属性更改为我们作为参数添加的匿名函数。这些事件处理器是 Windows 8 整个结构的处理方式，学习它们非常重要。在完成后，你在\
  \ `ready` 函数中有很多这类内容。\n\n### Select\n\n如果你是 Windows 开发人员，你可能认出 `Select` 元素是一个 `Listbox`（列表框）。它是点击时下拉的选择列表的渲染。它向你显示选项列表，并在你选择项目后折叠回单行。`Select`\
  \ 元素在很多方面都非常棒：从离散的项目列表中挑选、导航到某个地方、在设置中选择选项，或者任何你想给用户（本质上）固定选项列表的情况。\n\n#### 填充 Select\
  \ 控件\n\nHTML 中的 `Select` 标签是一个容器，你列表中的项是 `Options`（选项）。正如你将看到的，你可以在 JavaScript 中直接操作该标签和选项列表，这使得处理数据数组变得非常棒。\n\
  \n1. 像上一步操作一样，向 `Controls` 项目添加一个 `Select` 页面控件。\n2. 在 HTML 文件中，删除 `<p>Content goes\
  \ here.</p>` 代码并添加以下内容：\n\n```html\n<select id=\"Controls\" size=\"1\">\n  <option\
  \ value=\"1\">Div</option>\n  <option value=\"2\">Textbox</option>\n  <option value=\"\
  3\">Select</option>\n  <option value=\"4\">Radio Button</option>\n  <option value=\"\
  5\">Toggle Switch</option>\n</select>\n```\n\n3. 按下 `F5` 运行 Windows 8 应用。你可以看到该标签已经是\
  \ Windows 8 样式——它是 WinJS 库提供的免费资源。标签足够大以便触摸并符合风格。\n4. 回到 Visual Studio 点击 Stop 停止应用。\n\
  5. 打开 `Select.js`。\n6. 在 `ready` 函数中添加这段代码：\n\n```javascript\nvar selectControl\
  \ = document.getElementById(\"Controls\");\nvar newOption = document.createElement(\"\
  OPTION\");\nnewOption.text = \"Date Picker\";\nnewOption.value = \"6\";\nselectControl.add(newOption);\n\
  ```\n\n通过 `getElementById` 获取现有的 `Select` 控件，创建一个 `Option`，然后添加到 `Select`。按下 `F5`\
  \ 查看新选项。它看起来像图 5-5。\n\n#### 遍历 Select 项目\n\n你可以使用 `for` 循环遍历 `Select` 中的项——从 `Select`\
  \ 返回的数据是一个迭代集合。在 `ready` 函数的 `selectControl.add` 调用下方，添加此循环：\n\n```javascript\n\
  for (var item in selectControl) {\n  if (selectControl[item].innerText) {\n    itemsDiv.innerHTML\
  \ += selectControl[item].innerText + \"<br />\";\n  }\n}\n```\n\n**图 5-5：** 选择 Select\
  \ 页面控件。\n![978118173350-fg055.tif](img/978118173350-fg055.png)\n\n然后在 HTML 中添加引用的\
  \ `div`：\n\n```html\n<div id=\"Items\"></div>\n```\n\n我们在这里做的是使用 `all` 集合，它有一些原型方法没有\
  \ `innerText` 属性（这就是为什么你在那里有一个条件判断）。再次运行代码，你将看到 `Select` 中的项。你也可以填充一个数组，使用 `JSON.parse`\
  \ 解析它，然后将其回服务。我在第 10 章将教你如何这样做。\n\n### Check box\n\n复选框控件是提供设置和选项的极佳控件。它是一个简单的开关，并且位于\
  \ WinJS 库中，因此它具有 Windows 8 样式。\n\n使用单选框非常无聊。HTML 看起来就像人们所预期的那样：\n\n```html\n<input\
  \ type=\"checkbox\" id=\"newCheckbox\"/> <label style=\"font-size:18pt\">This</label>\n\
  ```\n\n你可以在 JavaScript 中设置复选框的选中属性（它只是布尔值）：\n\n```javascript\nif(document.getElementById(\"\
  newCheckbox\").checked()) {\n  //\n}\n```\n\n当你有一个复选框列表时，它会变得有趣得多。我在第一部分讨论过，但当你有一个活动列表时，情况会变得真实。例如，待办事项，我为用户启动了一个基础列表：\n\
  \n```javascript\ndataArray = [\n  {task: \"Chapter 1\", complete: false},\n  {task:\
  \ \"Get milk\", complete: false},\n  {task: \"Check eyebrows\", complete: false},\n\
  \  {task: \"Repair TARDIS\", complete: true},\n  {task: \"Punt on 4th and 8\", complete:\
  \ false}\n];\n```\n\n\n\n\n```javascript\ncomplete: true\n        },\n        {\n\
  \            task: “让手指活跃一下我的思绪”,\n            complete: false\n        }\n]\n```\n\
  \n为了将这些绑定到一组复选框，我需要设置一个 `ListView`。我在第 2 章中简要讨论过 `ListView`，并且在整本书中都使用了它。它是 Windows\
  \ 8 界面中创建项目列表的标准机制。\n\n设置 `ListView` 有两个元素：列表容器和列表模板。容器决定了每个项目使用哪个模板以及核心数据源是什么。模板则决定了数据源中每行的哪个元素将映射到哪个控件。\n\
  \n例如，这里是复选框列表的 HTML，它映射到我之前设置的数组上：\n\n```html\n<div id=\"mediumListIconTextTemplate\"\
  \ data-win-control=\"WinJS.Binding.Template\">\n    <div style=\"width: 480px\"\
  >\n        <input type=\"checkbox\" data-win-bind=\"checked: complete\" /><label\
  \ data-win-bind=\"innerText: task\" style=\"font-size: 18pt\"></label>\n    </div>\n\
  </div>\n<div id=\"todayList\" data-win-control=\"WinJS.UI.ListView\"\n    data-win-options=\"\
  {itemDataSource : dataList, itemTemplate: select('#mediumListIconTextTemplate')}\"\
  \ style=\"margin-left: 5%; margin-right: 5%; width: 514.4px; left: 0px; top: 16px;\"\
  >\n</div>\n```\n\n模板位于上方，`ListView` 容器位于下方。`ListView` 容器有两个 `data-win-options`：要绑定的数据名称和模板的名称。模板有两个控件：我在简单示例中使用的输入（input）和标签（label）。注意它们都具有\
  \ `Data-Win-Bind` 选项，这些选项与数组中的元素名称匹配。\n\n![tip.eps](img/tip_fmt.png) 你也可以在 JavaScript\
  \ 代码中设置绑定。如果你获取了 `ListView` 的引用，那么所有的 `data-win-options` 都是该类暴露的属性。如果你需要在运行时更改列表的绑定，这是一个很好的方法。\n\
  \n```javascript\nvar todayList = document.getElementById('todayList');\ntodayList.itemDataSource\
  \ = dataList;\n```\n\n## 切换开关 (ToggleSwitch)\n\n`ToggleSwitch` 控件与 `Checkbox` 控件并不相似，但它是\
  \ Windows 8 特有的控件，专为触摸友好界面创建。这就是为什么我把它包含在这里的原因。\n\n与其他 WinJS 特有的控件一样，`ToggleSwitch`\
  \ 是一个带有 `Data-Win-Control` 属性的 `div`。在页面上单独使用时，它如下：\n\n```html\n<div id=\"lightSwitch\"\
  \ data-win-control=\"WinJS.UI.ToggleSwitch\" data-win-options=\"{title: '灯'}\">\n\
  ```\n\n与 `Checkbox` 控件不同，你不需要包含标签——可以通过包含 `data-win-option` 来渲染标题。状态也是如此，如图 5-6\
  \ 所示。它告诉用户当前是开启还是关闭状态。（你可以通过 `labelOn` 和 `labelOff` 修改切换开关的文本。）\n\n**图 5-6：** 开启和关闭。\n\
  \n![9781118173350-fg0506.eps](img/9781118173350-fg0506_fmt.png)\n\n注意，与复选框不同，切换开关支持特定的手势——滑动。我将在第\
  \ 6 章中讨论这八种核心手势，但这是第一个支持用户可能意料之外操作的控件。当我第一次看到切换开关时，我尝试点击它，结果只是得到了微软在滑动中内置的微小动作，可能是为了给用户一个提示，告诉他们应该滑动。老实说，我仍然习惯滑动切换开关。在选择控件时请考虑你的用户。使用复选框还是切换开关更有意义？对我来说，我认为复选框更像是一个列表项，而切换开关更像是一个单次使用的工具。\n\
  \n## 日期选择器 (DatePicker) 和 时间选择器 (TimePicker)\n\n`DatePicker` 和 `TimePicker` 是 UI\
  \ 中的另外两个 WinJS 控件。它们优先考虑触摸，但与鼠标和键盘配合得很好。与其他控件一样，它们可以绑定到数据项，或者响应事件。\n\n默认的 `DatePicker`\
  \ 易于使用，但好消息是自定义它也很容易。默认的 `DatePicker` 看起来可能和你预期的那样：\n\n```html\n<div id=\"setTheDate\"\
  \ data-win-control=\"WinJS.UI.DatePicker\"></div>\n```\n\n酷的部分是选项列表。它提供了许多可以在 `data-win-options`\
  \ 中设置的选项，这些选项影响控件在用户面前的外：\n\n- `Calendar`: 设置你想使用的日历\n- `Current`: 设置选定的日期\n- `datePattern/monthPattern/yearPattern`:\
  \ 一个用于本地化应用设置模式的酷选项，例如从周日或周一开始的周\n- `disabled`: 显而易见，对吧？\n- `Element`: 访问 DOM\n\
  - `maxYear/minYear`: 控制用户可以向上或向后浏览多远\n\n## 灵活视图选项\n\n模式选项是最好的——类似于在显示日期时向 `ToString`\
  \ 传递值。这里是一些选项：\n\n- `datePattern/monthPattern/yearPattern`: 一个用于本地化应用设置模式的酷选项，例如从周日或周一开始的周\n\
  \n所以，例如，为了显示日期时显示星期几，你会向选项传递此字符串：\n\n```javascript\nfunction ready(element, options)\
  \ {\n    var datePicker = document.getElementById('setTheDate');\n    datePicker.datePattern\
  \ = \"{0 ({e})\";\n}\n```\n\n这样做可以获得类似于图 5-7 的效果。\n\n### 注册事件\n\n与 WinJS 的几乎所有控件一样，你可以在实例上注册事件。注册事件是告诉\
  \ Windows 在发生事情时运行特定的函数。Windows 会监控特定的细节，例如点击按钮，这些细节具有可以设置为函数的属性。当事件发生时，函数就会运行。\n\
  \n**图 5-7：** 自定义日期选择器。\n\n![9781118173350-fg0507.tif](img/9781118173350-fg0507_fmt.png)\n\
  \n同样与许多 事件一样，只有一个事件可以挂接：`onChange`。注册事件只需要使用 `onChange` 属性：\n\n```javascript\nfunction\
  \ ready(element, options) {\n    var datePicker = document.getElementById(\"setTheDate\"\
  );\n    datePicker.datePattern = \"{0 ({e})\";\n    datePicker.onchange = theDateChanged;\n\
  \    function theDateChanged(event) {\n        // 执行工作\n    }\n}\n```\n\n## 通知用户\n\
  \n告知用户应用程序状态的控件可能比交互控件使用得更频繁。通常，你想告诉用户他们需要等待多久。Windows 8 “快速且流畅”的理念要求，如果你要做一些需要时间的事情，你就应该告诉用户正在发生什么。这很公平，不是吗？\n\
  \n有时，你只需要传递一些信息，这些 WinJS 控件也非常适合。\n\n## 确定性进度状态\n\n\n\n\n\n当你确切知道某件事应该发生多少时，你可以使用显示完成百分比的进度条。这适用于你使用\
  \ `XHR`（WinJS 的异步 `XmlHttpResponse` 函数）或其他带有进度回调的通信类，并且可以获取某事何时完成的指标的情况。\n\n![tip.eps](img/tip_fmt.png)\
  \ 当你无法获取进度统计时，尝试使用不确定进度条或圆环，我将在本章稍后的“不确定进度状态”节节中讨论它们。\n\n## 进度条\n\n`ProgressBar`\
  \ 是一个 HTML5 控件，具有设置的当前值和最大值。（不设置这些值就是获取不确定进度条的方法。）要显示进度大约为百分之六十，可以在 HTML 中放入此内容：\n\
  \n```html\n<progress id=”fixedProgress” value=”60” max=”100”></progress>\n```\n\n\
  设置值并不困难——它只是类中的一个属性。（当然，你可以在代码稍之后更改它。）\n\n```javascript\nvar bar = document.getElementById(“fixedProgress\
  \ “);\nbar.value = 70;\n```\n\n### 获取进度统计数据\n\n当我们开始按照设计的方式实际使用进度条时，事情就变得有趣了。其思想是从用户必须等待的潜在长时间操作中获取进度统计数据，并以某种视觉方式显示它们。\n\
  \n例如，`XmlHttpRequest` 有一个进度事件监听器。进度事件监听器实际上是在 W3C 标准中定义的，因此它们的工作方式大相同。\n\n在 Windows\
  \ 8 中，当 Windows 8 UI 检查进度时会触发 `ProgressEvent`，所以不要依赖它来任何事情。尽管如此，你完全可以更新进度条。\n\n\
  ```javascript\nmyLongRunningFunction.onprogress = function(prog) {\n    if(prog.lengthComputable)\
  \ {\n        progressBar.max = prog.total\n        progressBar.value = prog.loaded\n\
  \    }\n}\n```\n\n`total` 和 `loaded` 属性是关键。你实际上是在为进度条设置一个百分比，因此，你给进度条提供总量和已完成量，让它自己进行计算。\n\
  \n![remember.eps](img/remember_fmt.png) 一般来说，你甚至不想使用进度条。这种长时间运行的任务本不应该出现在你的 Windows\
  \ 8 应用中，除非你正在上传图片或下载电影。\n\n此外，不要用进度条阻塞 UI 线程。如果你显示它，请允许用户在进度更新时继续使用你的应用程序。\n\n##\
  \ 不确定进度状态\n\n在那个“快速且流畅”的全新世界里，“不确定进度”这个短语应该让你感到背脊发凉。通常，你的应用程序不应该让用户等待。它需要展示商品，或者至少展示商品存放的架子。\n\
  \n问题就在于此。应用程序在某个时刻需要加载缓慢的数据。最终，你需要加载一张大图片，或者从缓慢的服务获取天气预报，或者等待海外远程服务器的消息。\n\n![remember.eps](img/remember_fmt.png)\
  \ 那就是你使用不确定进度状态图标的时候。而不是在你加载应用的主页面或或的任何页面时使用它。当你将某些缓慢加载的数据加载到特定位置时，在那个位置显示进度图标。仅在该处。不要为整个加载缓慢的程序使用它——否则你的应用会被拒绝。\n\
  \n这一点清楚了吗？很好。\n\n## 使用进度条\n\n如果你在“确定进度状态”节中使用我用过的进度控件且不带带任何参数，你将获得标准的 Windows 8\
  \ 加载状态条，带有我在图 5-8 中展示的五个点。代码看起来如下：\n\n```html\n<progress id=”flexibleProgress”></progress>\n\
  ```\n\n为了给用户提供过程正在进行的反馈，只需显示该控件。要告诉用户应用已就绪，请隐藏控件。就是如此简单。\n\n**图 5-8：** Windows 8\
  \ 加载状态条。\n\n![9781118173350-fg0508.tif](img/9781118173350-fg0508_fmt.png)\n\n###\
  \ 阻塞用户\n\n在极少数必须停止用户界面的情况下（例如他们必须等待文件加载时），你会使用不同的进度控件，称为圆环。圆环只是一个具有不同 CSS 样式的进度控件，内置于\
  \ WinJS。因此，你可以这样实现它：\n\n```html\n<progress class=”win-ring”></progress>\n```\n\n\
  控件 `innerHtml` 中的文本会显示在圆环中心。你可以让用户对完成了多少有个概念。\n\n如何使用它比何时使用它要重要得多。\n\n## 评分\n\n\
  评分控件比进度条有趣得多。它们的设计旨在向用户展示……（注：原文此处不完整）。微软在评分方面投入巨大。给人们分享意见的机会让他们感到联系。\n\n## 评分无处不在\n\
  \n查看我的 Windows 8，我看到只要有用户分享信息的地方就有评分。\n\n![check.png](img/check.png) 商店中的应用\n![check.png](img/check.png)\
  \ Build 上的视频\n![check.png](img/check.png) 论坛帖子\n![check.png](img/check.png) 播放应用中的音乐\n\
  ![check.png](img/check.png) 新闻故事\n![check.png](img/check.png) Visual Studio 插件\n\
  ![check.png](img/check.png) Netflix 中的电影\n\n### 使用评分控件\n\n与作为 HTML5 标准并拥有独立标签的进度控件不同，评分是\
  \ Windows 8 特有的，并作为 `Data-Win-Control` 实现。因此，你可以在设计时在 HTML 中设置控件的属性，也可以在运行时使用 JavaScript\
  \ 进行设置。\n\n```html\n<div id=”rating” data-win-control=”WinJS.UI.Rating”></div>\n\
  ```\n\n在 JavaScript 中引用该控件后，你可以访问控件上的三个重要属性：\n\n- `averageRating`：社区对该项目的评分\n- `userRating`：用户对该项目的评分\n\
  - `maxRating`：该项目的最高评分\n\n\n\n\n以 Amazon 为例。你可以对评论给出最高五星评价。对于我的书籍 `C# 2010 All-in-One\
  \ For Dummies`由 John Wiley & Sons, Inc. 出版），平均评分为 3.8（如果我这么说的话，这很不错）。JavaScript\
  \ 代码看起来是这样：\n\n```javascript\n// 如果要介绍 HTML Fragment 模板，请参考以下文档：\n// http://go.microsoft.com/fwlink/?LinkId=232511\n\
  \n(function () {\n    \"use strict\";\n    // 每当用户导航到此页面时，都会调用此函数。它\n    // 用应用程序的数据填充页面元素。\n\
  \    function ready(element, options) {\n        // 获取 HTML 控件引用\n        var rate\
  \ = document.getElementById(\"rating\").winControl;\n        // Amazon 最多 5 星评价\n\
  \        rate.maxRating = 5;\n        // 当前的社区评分为 3.8\n        rate.averageRating\
  \ = 3.8;\n    }\n    function updateLayout(element, viewState) {\n        // TODO:\
  \ 响应 viewState 的变化。\n    }\n    WinJS.UI.Pages.define(\"/Pages/Ratings.html\", {\n\
  \        ready: ready,\n        updateLayout: updateLayout\n    });\n})();\n```\n\
  \n你可以从图 5-9 中看到设置的最终结果。社区评论是由代码预设的。然而，控件仍然处于激活状态。尽管点击控件并设置你自己的设置。`onChange` 事件可以在\
  \ JavaScript 中处理，就像库中的任何其他控件一样，并且用户评分可以保存回数据源中。你可以在下一节中看到它是如何运作的示例（滑块是一个不同的控件，但工作原理相同）。\n\
  \n**图 5-9：**评分控件。\n\n![9781118173350-fg0509.tif](img/9781118173350-fg0509_fmt.png)\n\
  \n## 滑块 (Sliders)\n\n与 Rating 控件一样，`Slider` 在离散范围内向用户显示一个预设值。同样，与 Rating 控件一样，`Slider`\
  \ 允许用户更改该值，并且可以捕获更改事件并保存或使用该值。\n\n与 Rating 控件不同，`Slider` 允许对目标数字进行精细控制。同样，与 Rating\
  \ 控件不同，`Slider` 是一个通用控件。Ratings 仅用于评分，而 `Slider` 可以在任何你想告知用户某个范围内的数字时使用。此外与 Rating\
  \ 控件不同，`Slider` 是一种 HTML Input 类型，称为 `Range`。\n\n滑块非常适合设置、尺寸或颜色等事项——任何具有平滑范围而非离散值集合的内容。另一个例子可能是百分比完成度滑块。例如，用户可能会反复拖动滑块来描述他们读了书的比例。\n\
  \n范围 HTML 控件的核心属性在 Windows 8 中都得到了很好的实现。它们包括：\n\n- `max`: 你可以为滑块设置的最高数字\n- `min`:\
  \ 你可以为滑块设置的数字（可以是负数）\n- `step`: 滑块移动的增量\n- `value`: 当前设置的值\n\n所有这些值都可以在 HTML 中进行初始设置，并在\
  \ JavaScript 中更改。例如，书籍阅读百分比的示例可能如下所示，min 为 0，max 为 100，step 为 1。\n\n```html\n<section\
  \ aria-label=\"Main content\" role=\"main\">\n    <img src=\"../images/c_catalogcover.jpg\"\
  \ /><br />\n    I am <div id=\"percentComplete\">0</div> percent done with this\
  \ book.<br />\n    <input id=\"slider\" type=\"range\" min=\"0\" max=\"100\" step=\"\
  1\" value=\"0\"/>\n</section>\n```\n\n这为我们提供了图 5-10 中的效果，虽然它的样式并不漂亮。\n\n要更改该文本，你只需要处理\
  \ `onChange` 事件。这看起来和其他所有控件大体相同，尽管它的感觉可能更活跃一点。如下所示更改 `ready` 函数并添加 `sliderChanged`\
  \ 函数：\n\n```javascript\nfunction ready(element, options) {\n    document.getElementById(\"\
  slider\").addEventListener('change', sliderChanged, false);\n}\nfunction sliderChanged()\
  \ {\n    document.getElementById(\"percentComplete\").innerHTML = document.getElementById(\"\
  slider\").value;\n}\n```\n\n**图 5-10：**Slider 控件。\n\n![978118173350-fg0510.tif](img/978118173350-fg0510.png)\n\
  \n现在按 F5 运行程序（记得更改 `package.appxmanifest` 中的 Start）并拖动滑块。每当 UI 感知到变化时，就会触发你的方法，你可以看到\
  \ 5-10 中的数字发生了变化。很酷对吧？\n\n## 使用 HTML5 播放媒体\n\nHTML5 中的两个新标签只要你坚持使用 WinJS，就能处理你在\
  \ Windows 8 中的大部分播放需求。`<audio>` 和 `<video>` 标签在 Windows 8 中的工作方式与在浏览器中一样，事实上，得于\
  \ WinJS 和 WinRT，它们得到了硬件增强。这是一个很好的组合——事实上，比你在 XAML 和 C# 中找到的更好。\n\n### 听音频\n\n音频标签是\
  \ HTML5 世界中最优雅、最简单的东西之一。不需要花哨的 JavaScript 或 CSS。只需要一点技巧。尝试以下步骤将音频标签添加到你的应用中：\n\n\
  1. 在页面中添加指向文件的 `src` 元素的音频标签：\n\n```html\n<body>\n    <div class=\"audio fragment\"\
  >\n        <header aria-label=\"Header content\">\n            <!--音频标题 -->\n  \
  \      </header>\n        <section aria-label=\"Main content\">\n            <audio\
  \ src=\"http://go.microsoft.com/fwlink/?LinkId=232511\"></audio>\n        </section>\n\
  \    </div>\n</body>\n```\n\n2. 如果是 Internet 文件（如示例所示），确保在 `package.appxmanifest`\
  \ 中勾选 Internet Client。\n\n如果你设置的是让用户控制的内容，`controls` 参数是关键。如果你想在后台播放，使用 `autoplay`\
  \ 参数。它是无声的。\n\n```html\n<body>\n    <div class=\"audio fragment\">\n        <header\
  \ aria-label=\"Header content\">\n            <!--音频标题 -->\n        </header>\n\
  \        <section aria-label=\"Main content\">\n            <audio src=\"http://go.microsoft.com/fwlink/?LinkId=232511\"\
  \ autoplay></audio>\n        </section>\n    </div>\n</body>\n```\n\n### 看视频\n\n\
  在 Windows 8 空间，视频并不比音频困难。你基本上只需要添加 video 标签，如果是从本地源以外，则声明 Internet 能力。\n\n1. 在你的标记中添加\
  \ video 标签：\n\n```html\n<body>\n    <div class=\"video fragment\">\n        <header\
  \ aria-label=\"Header content\">\n            <!--视频标题 -->\n        </header>\n\
  \        <section aria-label=\"Main content\">\n            <video src=\"http://archive.org/download/Cake/Cake.wmv\"\
  \ controls></video>\n        </section>\n    </div>\n</body>\n```\n\n2. 对视频属性进行调整。\n\
  \n一个非常好的例子是高度和宽度。像浏览器那样交给 Windows 8 处理是错误的。在编码标签之前，尽可能从源获取视频尺寸。\n\n\n\n\n![tip.eps](img/tip_fmt.png)\
  \ Visual Studio 默认选中了“Internet Client”功能，但你的实际情况可能会有所不同。\n\n大概就是这些。VCR 控件通过 `controls`\
  \ 标签添加，硬件加速则会自动完成。没有比这更简单的了。\n\n# 第 6 章\n\n## 布局应用\n\n### 本章内容概览\n- ![arrow](img/arrow.png)\
  \ 实现 Windows 8 风格指南\n- ![arrow](img/arrow.png) 在你的应用中导航\n- ![arrow](img/arrow.png)\
  \ 制作内容动画\n- ![arrow](img/arrow.png) 处理大小调整事件\n\n在第 2 章中，我回顾了用于 Windows 8 开发的内置模板。这些模板非常实用，特别是作为参考，但它们无法完成你所需的所有工作。`Grid`\
  \ 和 `Split` 模板为列表/详情风格的应用提供了一个很好的起点。`Fixed` 模板非常适合单页应用。`Navigation` 模板适用于第 2 章中介绍过的中心枢风格应用。\n\
  \n最终，你将需要满足应用的特定需求，而内置模板无法胜任。事实上，它们可能根本无法触及。你需要自己编写一些布局。\n\n既然是 HTML5，制作 Windows\
  \ Store 应用有点就像设置网页。你有一种类似站点地图，并在页面之间进行导航。\n\n当然，由于这是 Windows 8，你自然有一些需要考虑的特殊事项。这里没有菜单，你的应用不应该有落地页，因为应用应该在很大程度上专注于单一的用例。\n\
  \n站点布局是一回事，而页面布局是另一回事。正如我在第 3 章中讨论的，Windows 8 有许多布局要求，这些要求可能决定你在 Store 测试中的通过与失败。在第\
  \ 3 章中，你读到了相关内容。在本章中，你将实现它们。\n\n![remember.eps](img/remember_fmt.png) 页面布局驱动着用户体验。你的应用需要提供一条完成任务的清晰路径，不要让用户对如何往返产生任何疑问。应用还必须美观。拥挤的用户界面是禁止的，并且会将你从\
  \ Store 中踢出去。\n\n页面布局还驱动用户的接受度。如果人们喜欢使用你的应用，他们更有可能使用它、投入应用内容并给出高分。事实就是这么简单。Windows\
  \ 8 指南并非为了束缚你，而是为了让你的应用融入 Windows 8 的无缝体验中。使用它们，不要与其抗争。\n\n## 构建 Windows 8 布局\n\n\
  人们之所以喜欢 Windows 8 是因为它专注于他们想要做、想看和想玩的内容，而不是运行这些内容的机制。某些内容需要很多按钮和开关，但并非所有内容都是如此。大多数类型的内容不需要菜单栏来运行。\n\
  \n在第 2 章中，我谈到了“外壳”（chrome）以及如何在一个没有状态栏或菜单栏的世界中解决设计问题。在这里，我向你展示如何完成这一切。\n\n### 使用字体排版\n\
  \nWindows 8 通过字体大小来引导用户对层级的理解。图 6-1 所示的“排版阶梯”定义了什么是重要的，什么是无关紧要的。\n\n这与网页没有太大，网页中标题大小\
  \ `H1`、`H2`、`H3` 等在浏览器中有默认定义。Windows 8 环境也对大小有默认设置，但你可以通过默认样式表来管理它们。\n\n这并不是说你不能自己设计标题布局，但如果你想避免进入\
  \ Store 时遇到麻烦，可能希望考虑做与默认样式类似的事情。\n\n**图 6-1：** 排版阶梯。\n\n![9781118173350-fg0601.tif](img/9781118173350-fg0601_fmt.png)\n\
  \n### 研究微软的样式表\n\n建议的设置与我们大多数人的通常做法并没有太大区别。与 Normal 样式——即标准文本——相比，subnormal（次标准）文本的大小大约是\
  \ 80%。\n\n标题也相当标准。副标题比正文大大约 200%。标题比副标题再大 200%，或者比标准文本大 400%。\n\n你可以拆解 `WinJS` 库中的样式表来理解我的意思。字体和大小的布局方式正如图\
  \ 6-1 所示。\n\n```css\nh1, .win-type-xx-large {\n    font-size: 42pt;\n    font-weight:\
  \ 200;\n    line-height: 1.1429; /* 当 font-size 为 42pt 时为 64px */\n}\n\nh2, .win-type-x-large\
  \ {\n    font-size: 20pt;\n    font-weight: 200;\n    line-height: 1.2; /* 当 font-size\
  \ 为 20pt 时为 32px */\n}\n\nh3, .win-type-large {\n    font-size: 11pt;\n    font-weight:\
  \ 600;\n    line-height: 1.3636; /* 当 font-size 为 11pt 时为 20px */\n}\n\nh4, .win-type-medium,\
  \ code, pre, samp {\n    font-size: 11pt;\n    font-weight: 400;\n    line-height:\
  \ 1.3636; /* 当 font-size 为 11pt 时为 20px */\n}\n\nbody, h5, .win-type-small, legend\
  \ {\n    font-size: 11pt;\n    font-weight: 300;\n    line-height: 1.3636; /* 当\
  \ font-size 为 11pt 时为 20px */\n}\n\n.win-type-x-small {\n    font-size: 11pt;\n\
  \    font-weight: 300;\n    line-height: 1.3636; /* 当 font-size 为 11pt 时为 20px */\n\
  }\n\nh6, caption, figcaption, small, .win-type-xx-small {\n    font-size: 9pt;\n\
  \    font-weight: 400;\n    line-height: 1.6667; /* 当 font-size 为 9pt 时为 20px */\n\
  }\n```\n\n尺寸、权重和行高的组合用于实现图 6-1 所示的阶梯。我发现有趣的是 `H3` 和 `H4` 之间的区别。字体大小与正文相同，但权重分别为\
  \ 600 和 400，而正文为 300。\n\n### 实现样式\n\n我建议大多数应用使用微软的样式表。对于某些应用，你可能想要其他的，但那是那 20% 的情况。标准样式应该满足大多数人的需求。\n\
  \n由于微软团队构建样式的方式，你可以按照平常的方式编写 HTML，并免费获得 Windows 8 的视觉效果。标题在 HTML4 世界中已经有些过时，但在 HTML5\
  \ 中在语义上非常有意义。\n\n标题不是你可能不熟悉的唯一样式元素。像 `code`、`legend` 和 `caption` 这样的语义名词也失去了青睐，但现在是时候让它们回归。它们不仅在样式上特别适用于\
  \ Windows 8 开发，而且有助于描述页面内容。标题本身就是标题，应该被这样对待。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 语义化网络是一个大的话题，我在这里没有空间深入讨论。基本上，它提供了一个框架，使得页面上的信息呈现方式让样式和数据定义都由标记控制。要了解更多信息，请浏览\
  \ [`http://semanticweb.org/wiki/Main_Page`](http://semanticweb.org/wiki/Main_Page)。\n\
  \n字体排版不是 Windows 8 设计语言中唯一的视觉视觉区分因素。留白也起着巨大的作用。在第 2 章中，我给你了一些要做和不要做的建议，以及一些非常棒的例子。在本章中，我将进入实现细节。\n\
  \n\n\n\n\nWindows 8 中的留白与 Web 应用中的留白几乎相同，只不过你需要更多的留白。当你构建屏幕结构时，使用外边距（margins）和内边距（padding）来用留白划分内容。\n\
  \n在这个示例中，我在 Visual Studio 中启动了一个新项目。你可以这样做，也可以从书中的示例代码打开示例项目。在默认的 HTML 文件中，将 body\
  \ 文本替换为几个标题和 `div` 。\n\n```html\n<div class=\"mainContainer\">\n    <h1>This is\
  \ the page heading</h1>\n    <div class=\"contentArea\">\n        <h2>This is a\
  \ topic heading</h2>\n    </div>\n</div>\n```\n\n接下来，右键点击该项目并在 Blend 中打开它。\n\n1.\
  \ 在 HTML 视图中点击 `mainContainer` `div`。\n2. 在 CSS 属性面板中找到外边距（margin）设置。\n3. 将 `margin-top`\
  \ 和 `margin-left` 改为 `30`。\n4. 点击 `contentArea` `div` 并进行相同的更改。\n\n在 Blend 中生成的屏幕应该像图\
  \ 6-2 所示。注意，留白在带有酷炫标尺的布局屏幕中显示。\n\n**图 6-2：** 在 Blend 中设置留白。\n\n![9781118173350-fg0602.tif](img/9781118173350-fg0602_fmt.png)\n\
  \n生成的样式以内联形式出现在 `divs` 中，这完全没问题。\n\n```html\n<div class=\"mainContainer\" style=\"\
  margin-top: 30px; margin-left: 30px;\">\n    <h1>This is the page heading</h1>\n\
  \    <div class=\"contentArea\" style=\"margin-left: 30px; margin-top: 30px;\">\n\
  \        <h2>This is a topic heading</h2>\n    </div>\n</div>\n```\n\n在第 2 章中，我讨论了如何通过间距而不是窗口和线条来定义\
  \ Windows 8 中的空间。为了实现这一点，很多需要做的工作其实是不需要的。\n\n例如，不要用边框包围 `divs` 或不要用颜色填充它们。相反，使用留白和缩进来显示布局。所有的边框样式都在图\
  \ 6-3 中给出。除非你有充分的理由，否则不要使用它们。\n\n**图 6-3：** Blend 中的边框样式。\n\n![9781118173350-fg0603.tif](img/9781118173350-fg0603_fmt.png)\n\
  \n## 考虑人体工程学\n\n当你让用户掌握了视觉层级后，你需要让他在应用程序中的移动变得尽可能简单。\n\n正如我在第 2 章中提到的，一切都应该朝一个方向流动。为了最好地处理这一点，你必须掌握你的重复器控件（repeater\
  \ controls）将向哪个方向移动。\n\n`ListView` 是这个领域最需要帮助的控件。幸运的是，微软已经提供了有效处理滚动所需的钩子。三个类涵盖了你需要样化的层：\n\
  \n* `win-surface`：整个内容区域，无论是否可见\n* `win-viewport`：可见的内容部分\n* `win-listview`：整个控件\n\
  \n你可以在图 6-4 中看到这三个实体的细分。\n\n**图 6-4：** ListView 的多个侧面。\n\n![9781118173350-fg0604.eps](img/9781118173350-fg0604_fmt.png)\n\
  \n`win-surface` 定义了内容的滚动方向。如果 `win-surface` 比右侧的 `win-viewport` 大，控件水平滚动。如果 `win-surface`\
  \ 比下方的 `win-viewport` 大，控件垂直滚动。\n\n如果 `win-surface` 在两个方向上都比 `win-viewport` 大，那么你的方法错了。\n\
  \n在 Windows 8 中，一切都应该以相同的方式滚动。无论你是垂直滚动还是水平滚动，只要只做其中一种即可。\n\n话虽如此，微软确实希望我们水平滚动。这违背了许多\
  \ Web 开发者（包括谦虚的作者）的直觉。尽管如此，在使用许多 Windows 8 应用后，我不得不承认特别是在平板电脑上，这非常有意义。\n\n你也不需要手动样化\
  \ `win-surface` 的布局。WinJS 提供的列表和网格视图模板为你承担了大部分工作。例如，查看 `textListMediaQueueTemplate`\
  \ 的 CSS。`win-viewport` 预设用于处理滚动条，而你的 `ListView` 会自动将 `win-surface` 推向底部。\n\n```css\n\
  /* overall dimensions */\n#textListMediaQueue {\n    margin-left: 10px;\n    width:\
  \ 18px; /*18 px to account scrollbar*/\n    height: 32px;\n}\n/* textList-media\
  \ used for app item */\n/* individual dimensions */\n.textListMediaQueue {\n   \
  \ display: -ms-flex;\n    width: 100%;\n    height: 40px;\n    overflow: hidden;\n\
  \    padding: 8px;\n}\n\n}\n.textListDetail1 {\n    -ms-flex: auto;\n}\n/* Text\
  \ line 1: Track */\n.textListMediaQueueTrack {\n    overflow: hidden;\n}\n/* Text\
  \ line 2 col 1: Artist */\n.textListMediaQueuetextList1Artist {\n    width: 280px;\n\
  }\n/* Text line 2 col 2: Album */\n.textListMediaQueueAlbum {\n    line-height:\
  \ 60px;\n    width: 180px;\n}\n/* Text line 2 col 3: Length */\n.textListMediaQueueNumber\
  \ {\n    line-height: 60px;\n    margin: 0px 10px;\n    width: 40px;\n}\n```\n\n\
  ![remember.eps](img/remember_fmt.png) 这是了解内置工具并在可以使用时使用的另一个例子。微软提供那些模板是为了方便你构建产品。它们具有额外的\
  \ Windows 8 风格。使用它们。\n\n## 将内容放入网格\n\n你知道 Windows 8 应用比良好的滚动列表更喜欢什么吗？良好的滚动网格。你应该尽可能将内容放入网格中，最好带有精美的图片。现在，这并非总是可行，但如果可行，你应该考虑一下。\n\
  \n有很多网格模板，如表 6-1 所示，它们从新建项目对话框中的模板开始。\n\n表 6-1 网格模板\n\n| 模板名称 | 类型 | 作用 |\n| :---\
  \ | :--- | :--- |\n| iconTextApplicationsTemplate | 图标和文本 (应用程序) 模板 | 定义一个代表项目的项。项目包含图标和描述性文本。\
  \ |\n| imageGalleryTemplate | 图像画廊模板 | 定义图像画廊中的项。 |\n| imageGalleryBasketTemplate\
  \ | 图像画廊篮子模板 | 定义图像画廊篮子中的项。 |\n| imageOverlayAlbumTemplate | 图像叠加 (专辑)模板 | 定义一个显示专辑信息的项：专辑图片、关于专辑和艺术家的信息。\
  \ |\n| imageOverlayGalleryFolderTemplate | 图像叠加 (画廊文件夹)模板 | 定义图像画廊中的文件夹项。 |\n| imageOverlayLandingTemplate\
  \ | 图像叠加 (落地页)模板 | 定义一个包含图像、大文本区域和小文本区域的项。 |\n| imageAndTextCollectionTemplate |\
  \ 图像和文本 (集合)模板 | 定义一个包含图像、大标题、副标题和正文的项。 |\n| imageAndTextListFileTemplate | 图像和文本\
  \ (列表文件)模板 | 定义一个代表文件的项：图标、名称、日期和大小。 |\n| textAlbumTrackTemplate | 文本 (专辑轨道)模板 |\
  \ 定义一个包含专辑轨道编号和标题的项。 |\n\n\n\n\n\n## 模板概述\n\n| 名称 | 说明 | 详情 |\n| :--- | :--- | :---\
  \ |\n| `textTileLandingTemplate` | 文本磁片（落地页）模板 | 定义一个代表磁片的项目。该项目包含一个带有大粗文本的区域和一个带有较小文本的区域。\
  \ |\n| `textTileListFolderTemplate` | 文本磁片（列表文件夹）模板 | 定义一个代表磁片的项目。该项目包含一个标题。 |\n\
  \n我把查看所有这些模板的任务留给你们这些读者作为练习。在这里描述所有它们会让这本书再增加几百页的内容。\n\n### 使用预设模板\n\n要在网格中使用其中一个预设模板，只需在\
  \ `data-win-control` 定义中，在你所需的 `class` 名称前加一个井号符号即可：\n\n```html\n<div id=\"basicListView\"\
  \n    data-win-control=\"WinJS.UI.ListView\"\n    data-win-options=\"{ itemDataSource\
  \ : DataExample.itemList.dataSource,\n        itemTemplate: select('#mediumListIconTextTemplate'),\n\
  \        layout: {type: WinJS.UI.ListLayout}}\">\n</div>\n```\n\n# 与你的应用交互\n\n用户应该感觉到应用是连接通且生动的。实现这一点的最佳方法之一是让导航成为数据的一致部分。\n\
  \n万维网通过 `Anchor` 标签在正确的方向上走了很远，但我们开发者仍然倾向于“点击此处查看此故事”的导航模式。\n\n在搜索引擎优化专家出现之前的日子，我发现了一些有趣现象。如果你有内容是“点击此处获取更多关于\
  \ widgets 的信息”，并将“点击此处”部分设置为超链接，那么你的搜索排名会很差。如果你将 `widgets` 一词设置为超链接，效果会好得多。\n\n\
  这是因为 `Semantic Web` 依赖于其索引页面的元信息。“点击此处”没有告诉我任何信息。“Widgets”告诉了我一切。搜索引擎只能从少数几个地方汲取元数据——目标页的标题和指向目标页的链接。仅此而已。把它们都做得尽可能好。\n\
  \n## 集成导航\n\n从这个角度来看，Windows 8 中根本没有所谓的“导航”。内容驱动一切。从游戏到新闻阅读器，内容本身就应该是导航。\n\n实际执行这一点比听起来要简单。与其使用“阅读更多”链接，你只需让内容本身成为链接。使用\
  \ `Navigation` 库在页面之间跳转。\n\n最好的例子是图 6-5 中的默认 `Grid` 模板。点击项目将带你进入内容页。\n\n**图 6-5：**\
  \ 默认的 Grid 模板。\n\n![9781118173350-fg0605.tif](img/9781118173350-fg0605_fmt.png)\n\
  \n`WinJS` 中的 `Navigation` 库提供了一个方法，可以将页面名和相关模型传递给页面。它在页面的 `itemInvoked` 事件中处理：\n\
  \n```javascript\nitemInvoked: function (args) {\n    var item = this.items.getAt(args.detail.itemIndex);\n\
  \    nav.navigate(\"/pages/itemDetail/itemDetail.html\", { item: Data.getItemReference(item)\
  \ });\n},\n```\n\n就是如此。当你有内容时，将内容项目模板链接到详情。如果你发现自己正准备创建一个按钮，停下。不要这样做。\n\n然而，某些情况需要屏幕内导航：例如，返回按钮。返回按钮的理念已经深根于我们的浏览体验中，以至于许多用户发现很难离开它。如果你查看\
  \ `Grid` 模板中的详情页，你可以看到一个返回按钮，这在 Windows 8 世界里是可以接受的。\n\n此外，如果你有一个内容创建应用，你可能需要导航到如\
  \ `Add` 和 `Edit` 等功能。但这些按钮不应该在窗格上；它们应该在应用栏中。\n\n## 使用应用栏\n\n应用栏在本书的前几章中偶尔出现，但它值得一个更正式的介绍。应用栏是重要的。例如，如果你的应用的控件无法放入应用栏中，那么这个应用对于\
  \ Windows 8 来说就太复杂了。\n\n这是一个重大的陈述，这是我的个人观点，不是微软的。尽管如此，我恳求你考虑这里的真相。看看第 2 章的应用栏部分，考虑你的应用大小是否合适。\n\
  \n应用栏是 `WinJS` 的一个功能，它调用了 `WinRT` 库。它是 Windows 的全新功能，就像当年 Windows 95 的 `System Tray`\
  \ 一样。\n\n到目前，我可能不需要重复强调应用栏就是当你从底部向上滑动时从底部弹出的东西。我也不应该说按钮应该放在那里：页面特定的放在右侧，全局的放在左侧。\n\
  \n应用栏是一个 `WinJS` 控件。因此，它被实现为一个带有 `data-win-control` 属性的 `div`。\n\n```html\n<div\
  \ data-win-control=\"WinJS.UI.AppBar\">\n    <button data-win-control=\"WinJS.UI.AppBarCommand\"\
  \ data-win-options=\"{icon:’back’, id:’, label:’example’, onclick:null, section:’global’,\
  \ type:’button’}\"></button>\n</div>\n```\n\n![tip.eps](img/tip_fmt.png) 到目前为止，向页面添加应用栏最简单的方法是使用\
  \ Blend 中的 `Assets` 面板。就在顶部。按钮之类的东西也可以加在那里。\n\n说到按钮，`<button>` 标签就在这里。`AppBar` 本身是一个容器。`AppBarCommand`\
  \ 类位于此处。\n\n**表 6-2：AppBar 的属性**\n\n| 属性 | 功能\n| :--- | :--- |\n| `Disabled` | 启用或禁用单个按钮。\
  \ |\n| `Flyout` | 按按下时自动调用弹出菜单的优秀属性。 |\n| `Hidden` | 你能看到吗？ |\n| `Icon` | 获取或设置图标——见图\
  \ 6-6。 |\n| `Label` | 按钮上的文本。 |\n| `onclick` | 点击方法。你也可以在设计时为其分配监听器。 |\n| `Selection`\
  \ | 选择或全局。选择代表页面，全局代表整个应用。 |\n| `Tooltip` | 用户悬停在按钮上时看到的。 |\n\n我在几乎每一章中都包含了使用应用栏和\
  \ `AppBarCommand` 的示例，但我想确保你有一些可以尝试的漂亮图标。只需设置 `icon` 属性，它们就能工作！\n\n**图 6-6：** 一组精美的符号。\n\
  \n![9781118173350-fg0606.tif](img/9781118173350-fg0606_fmt.png)\n\n当然，你可以自己制作图标，但为什么要这样做呢？用于图标的符号列表非常全面，而且符合\
  \ Windows 8 风格、免费且易用！直接使用它们吧！\n\n让命令上下文化\n\n除了应用栏之外，你还需要为用户提供比仅点击按钮更多的调用和导航选择。导航应该是上下文相关的，以适应\
  \ Windows 8 设计快速且流畅的特性。\n\n触摸是一种完全不同的集成语言，不应该模仿鼠标。因此，你应该让用户使用页面上的内容以及 `interaction`\
  \ 库中的手势来帮助内容生动。\n\n你问 `GestureLibrary` 中的手势有哪些？问得好！\n\n![check.png](img/check.png)\
  \ 轻点：手指短时间触摸屏幕。\n\n![check.png](img/check.png) 长按：手指触摸屏幕并保持不动。\n\n![check.png](img/check.png)\
  \ 滑动：一个或多个手指触摸屏幕并在相同方向移动。\n\n![check.png](img/check.png) Swipe：一个或多个手指触摸屏幕并在相同方向移动短距离。\n\
  \n![check.png](img/check.png) 旋转：两个或多个手指触摸屏幕并顺时针或逆时针弧运动。\n\n\n\n\n\n![check.png](img/check.png)\
  \ 捏指：两个或更多手指触摸屏幕并向彼此靠近。\n\n![check.png](img/check.png) 伸指：两个或更多手指触摸屏幕并向彼此远离。\n\n\
  要访问所有这些事件，我们使用 `GestureLibrary`。`GestureLibrary` 是一段文档较少（至少目前如此）的代码，旨在将 Windows\
  \ 8 与未来设备上的触摸屏集成。\n\n![remember.eps](img/remember_fmt.png) 如果你在笔记本电脑上编写代码，鼠标点击手势不足以测试\
  \ `GestureLibrary`。触摸（tap）并不等于点击（click）。如果你想为这些离散事件提供不同的结果，可以使用 `GestureLibrary`\
  \ 进行区分。否则，Windows 8 解释器会将触摸视为点击。\n\n要使用 `GestureLibrary`，你需要在 `gestureSettings`\
  \ 属性中初始化各个手势。这些初始化与我在之前的项目符号列表中列出的设计语言中定义的手势匹配得相当好，但并非完美。它们看起来如下：\n\n![check.png](img/check.png)\
  \ `tap`：触摸项目\n\n![check.png](img/check.png) `doubleTap`：触摸两次\n\n![check.png](img/check.png)\
  \ `hold`：触摸直到达到配置阈值\n\n![check.png](img/check.png) `drag`：触摸并移动（如果一直这样下去，这本书的家长分级就要下降了）\n\
  \n![check.png](img/check.png) `crossSlide`：跨越物体滑动\n\n![check.png](img/check.png)\
  \ `manipulationRotate`：圆周滑动\n\n![check.png](img/check.png) `manipulationTranslateX`：左右滑动\n\
  \n![check.png](img/check.png) `manipulationTranslateY`：上下滑动\n\n![check.png](img/check.png)\
  \ `manipulationScale`：张开手指\n\n![check.png](img/check.png) `manipulationRotateInertia`：手指旋转的速度\n\
  \n![check.png](img/check.png) `manipulationScaleInertia`：手指聚拢或张开的速度\n\n![check.png](img/check.png)\
  \ `manipulationTranslateInertia`：操作结束时的速度率\n\n显然，其中许多是用于游戏开发的，例如当你可能想以不同的速度向穿犱投掷小甜圈时。这稍微超出了本书的范范围，但我可以想象许多应用可能出于更平庸的原因使用手势。例如，你可能想允许用户通过点击图像来更改其不透明度。\n\
  \n事实上，让我们就这么做吧。在一个新的空白项目中，向默认的 HTML 文件添加一张图像，如下所示：\n\n```html\n<body>\n    <div\
  \ id=\"horizon\">\n        <div id=\"content\">\n            <img id=\"mainImage\"\
  \ src=\"images/logo.png\" />\n        </div>\n    </div>\n</body>\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ `horizon`（地平线）和 `content`（内容）指令有助于居中。CSS 文件看起来如下所示：\n\n```css\n#horizon {\n  \
  \  background-color: transparent;\n    text-align: center;\n    position: absolute;\n\
  \    top: 50%;\n    left: 0px;\n    width: 100%;\n    height: 1px;\n    overflow:\
  \ visible;\n    visibility: visible;\n    display: block;\n}\n#content {\n    background-color:\
  \ transparent;\n    margin-left: -125px;\n    position: absolute;\n    left: 50%;\n\
  \    visibility: visible\n}\n```\n\n在 `onactivated` 事件中，获取图像的引用。确保在函数作用域内声明它！\n\n\
  ```javascript\nmainImage = document.getElementById(\"mainImage\");\n// 之后，声明并初始化\
  \ GestureRecognizer。\nrecognizer = new Windows.UI.Input.GestureRecognizer();\nrecognizer.gestureSettings\
  \ = Windows.UI.Input.GestureSettings.tap;\n// 最后，为 tapped 事件添加事件监听器。\nrecognizer.addEventListener('tapped',\
  \ that.tappedHandler);\n// 在代码库的其他地方，添加 tappedHandler。\nthat.tappedHandler = function\
  \ (evt) {\n    evt.target.changeOpacity();\n};\n```\n\n同样，在代码库的其他地方，编写 `changeOpacity`\
  \ 处理函数。\n\n```javascript\nfunction changeOpacity() {\n    if (mainImage.getAttribute(\"\
  style\") === \"filter:progid:DXImageTransform.Microsoft.Alpha(opacity=50)\") {\n\
  \        mainImage.setAttribute(null, \"style\", \"filter:progid:DXImageTransform.Microsoft.Alpha(opacity=100)\"\
  );\n    } else {\n        mainImage.setAttribute(null, \"style\", \"filter:progid:DXImageTransform.Microsoft.Alpha(opacity=50)\"\
  );\n    }\n}\n```\n\n运行程序，你将在屏幕中央看到该图像。点击它（在触摸屏上），它会变为 50% 的不透明度。再次点击，它恢复到 100%。\n\
  \n这是我能想出的 `GestureRecognizer` 最简单的应用了。它非常复杂，我预计合作伙伴将会推出更好的库。如果你计划构建一个触摸密集的游戏，可能可能考虑迁移到\
  \ DirectX 并使用 C++，因为 JavaScript 的支持较弱。\n\n## 让应用快速流畅\n\n在布局正确之后，你需要确保它是快速且流畅的。吸附（Snapping）是我们处理的问题。说到模式切换，页面之间的切换也应该是敏捷的。\n\
  \n## Windows 动画\n\nHTML5 和 JQuery 中固有的动画不仅在 Windows 8 中支持，而且受到鼓励。页面和内容级的动画（有时称为过渡）由\
  \ WinJS 覆盖。这里是你可以获得的示例：\n\n![check.png](img/check.png) 页面过渡：动画页面进入或退出视图。\n\n![check.png](img/check.png)\
  \ 内容过渡：动画一组内容进入或退出视图。\n\n![check.png](img/check.png) 淡入/淡出：显示元素。\n\n![check.png](img/check.png)\
  \ 交叉淡：刷新内容区域。\n\n![check.png](img/check.png) 展开/折叠：显示额外的信息。\n\n![check.png](img/check.png)\
  \ 重新定位：将元素移动到新位置。\n\n![check.png](img/check.png) 显示/隐藏弹出窗口：在视图上方显示上下文 UI。\n\n![check.png](img/check.png)\
  \ 显示/隐藏边缘 UI：滑动边缘 UI 进入或退出视图。\n\n![check.png](img/check.png) 显示/隐藏面板：滑动大型边缘面板进入或退出视图。\n\
  \n![check.png](img/check.png) 从列表中添加/删除：从列表中添加或删除项目。\n\n![check.png](img/check.png)\
  \ 从搜索列表中添加/删除：在过滤搜索结果时从列表中添加或删除项目。\n\n![check.png](img/check.png) 徽章：更新数字徽章。\n\n\
  ![check.png](img/check.png) 开始/结束拖拽或之间拖拽：在拖放操作期间提供视觉反馈。\n\n有很多动画。不要觉得为了进入商店必须对所有内容做动画。然而，我建议认真考虑动画页面和内容过渡，以显示你已经考虑了\
  \ Windows 8 设计语言的现实。\n\n## 页面级过渡\n\n与处理 `GestureLibrary` 相比，页面过渡轻而易举。在 `WinJS.UI.Animation`\
  \ 中，你会找到一个 `enterPage` 函数和一个 `exitPage` 函数。它们的作用几乎相同，只是需要在页面生命周期的不同时间运行即可。\n\n\n\
  \n\n\n两种方法都接收一个元素对象和一个偏移量对象，并返回一个 `promise`。你不能在元素处于过渡时对其进行操作，因此你希望使用 `promise`\
  \ 来延迟任何页面功能（如删除元素），直到动画结束。\n\n```javascript\nWinJS.UI.Animation.enterPage(content,\
  \ startingPosition).done();\n```\n\n`content` 是你正在执行动画的单个或多个元素。这听起来可能不符合直觉，但我认为这样设置是为了让你选择只对页面的某些部分进行动画，并在之后仍保持内容级别的控制。`enterPage`\
  \ 函数设计用于与我在第三章中提到的导航库配合使用。\n\n`startingPosition` 的含义正如其名。它是 `content` 集合在动画发生之前应该开始的位置。你可以在页面上选择一个位置，并传入包含该位置的\
  \ JavaScript 数组来实现这一点。我建议对默认起始位置使用 `undefined`，除非你有非常特定的需要从其他地方开始。我目前为止还没有遇到过这种需要。\n\
  \n当然，`done` 代表由函数返回的 `promise`。当动画完成后，将执行其余代码。设置延迟是为了防止在执行动画时整个 UI 锁定。\n\n### 要设置动画页面序列，请尝试以下步骤：\n\
  \n1. 创建一个空白的 JavaScript Windows 8 项目。\n2. 创建一个名为 `Pages` 的新目录，用于我们将切换的页面。\n3. 添加三个页面。右键点击\
  \ `Pages` 目录并选择“添加新建项”。选择“页面控件”。重复三次。我将我的页面命名为 `firstpage`、`nextpage` 和 `thepageafter`。\n\
  4. 在 `default.html` 中，添加一个 `content div` 来替换 `<p>` 标签，如下所示：\n\n```html\n<body>\n\
  \    <div id=\"content\"></div>\n</body>\n```\n\n在 `default.js` 文件中，添加一个 `navigated`\
  \ 事件处理程序。\n\n```javascript\nWinJS.Navigation.addEventListener(\"navigated\", function\
  \ (eventObject) {\n    var url = eventObject.detail.location;\n    var content =\
  \ document.getElementById(\"content\");\n    WinJS.Utilities.empty(content);\n \
  \   eventObject.detail.setPromise(WinJS.UI.Pages.render(url, content, eventObject.detail.state).then(function\
  \ () {\n        WinJS.Application.sessionState.lastUrl = url;\n    }));\n});\n```\n\
  \n5. 在 `onactivated` 事件中导航到第一个内容页面。这会启动应用程序。\n\n```javascript\napp.onactivated =\
  \ function (args) {\n    if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n        args.setPromise(WinJS.UI.processAll().then(function(){\n          \
  \  return WinJS.Navigation.navigate(\"/pages/firstpage.html\");\n        }));\n\
  \    }\n};\n```\n\n`firstpage.html`、`nextpage.html` 和 `thepageafter.html` 为头部和主部分提供了\
  \ ID。\n\n6. 顺便，便添加一个用于导航的按钮：\n\n```html\n<body>\n    <div class=\"firstpage fragment\"\
  >\n        <header aria-label=\"Header content\" role=\"banner\" id=\"header\">\n\
  \            <button class=\"win-backbutton\" aria-label=\"Back\" disabled></button>\n\
  \            <h1 class=\"titlearea win-type-ellipsis\">\n                <span class=\"\
  pagetitle\">Welcome to firstpage</span>\n            </h1>\n        </header>\n\
  \        <section aria-label=\"Main content\" role=\"main\" id=\"main\">\n     \
  \       <p>Content goes here.</p>\n            <button id=\"nextPage\">Next Page</button>\n\
  \        </section>\n    </div>\n</body>\n```\n\n7. 在 `firstpage.js`、`nextpage.js`\
  \ 和 `thepageafter.js` 中添加一个过渡函数，用于导航到指定的页面并使用动画：\n\n```javascript\nfunction transition()\
  \ {\n    WinJS.UI.Animation.exitPage([[header],[main]], null).done(\n        function\
  \ () {\n            WinJS.Navigation.navigate(\"/pages/nextpage.html\");\n     \
  \   });\n    );\n}\n```\n\n有一个很棒的功能：内容实体（示例中的 `[[header],[main]]`）具有 IntelliSense，这是\
  \ Visual Studio 的功能，可以补全你正在输入的代码。你可以在图 6-7 中光标开始输入 `header` 的地方看到它。这使得在复杂页面中获取正确的\
  \ ID 变得容易得多。\n\n图 6-7：`exitPage` 函数中的 IntelliSense。\n\n![9781118173350-fg0607.tif](img/9781118173350-fg0607.tif)\n\
  \n8. 顺便，添加一个用于导航的按钮：\n\n\n\n\n\n![check.png](img/check.png) `fullscreen-landscape`:\
  \ 您的应用覆盖整个屏幕，且宽度大于高度。\n\n![check.png](img/check.png) `fullscreen-portrait`: 您的应用覆盖整个屏幕，且高度大于宽度。\n\
  \n![check.png](img/check.png) `filled`: 应用程序占据了屏幕的三之二。\n\n![check.png](img/check.png)\
  \ `snapped`: 应用程序占据了屏幕的三分之一。\n\n使用这些媒体类型允许您使用 CSS 为每个视图的自定义布局设置样式。它在 CSS 文件中看起来像这样：\n\
  \n```css\n@media (-ms-view-state: fullscreen-landscape)\n{\n  /*横屏视图的布局 */\n}\n\
  @media (-ms-view-state: fullscreen-portrait)\n{\n  /*竖屏视图的布局 */\n}\n@media (-ms-view-state:\
  \ filled)\n{\n  /* 填充状态布局（屏幕的 2/3） */\n}\n@media (-ms-view-state: snapped)\n  /*\
  \ 贴紧布局（屏幕的 1/2） */\n}\n```\n\n### 使用 resize 事件\n\n布局的另一种选择是在发生大小调整时实际更改视图。这需要您处理\
  \ `resize` 事件，这是可行的，因为应用必须处于活动状态才能进行大小调整。\n\n您实际上可以向 `window` 对象添加一个 `EventListener`，并在视图状态更改时更改视图的细节——甚至是页面本身。代码如下：\n\
  \n```javascript\nwindow.addEventListener(“resize”, function (e) {\n    var currentViewState\
  \ = Windows.UI.ViewManagement.ApplicationView.value;\n    var snapped = Windows.UI.ViewManagement.ApplicationViewState.snapped;\n\
  \    if (currentViewState === snapped) {\n        that.listView.layout = new WinJS.UI.ListLayout();\n\
  \    }\n    else if (lastViewState === snapped && currentViewState !== snapped)\
  \ {\n        that.listView.layout = new WinJS.UI.GridLayout();\n    }\n    lastViewState\
  \ = currentViewState;\n});\n```\n\n虽然这不是微软推荐的方法，但对我来说，这是最符合逻辑的。我不是 CSS 大师，因此在代码中处理变化似乎非常合适。它提供了大量的控制权，并允许您在不同的视图中提供不同的功能。这取决于您和您的应用风格。\n\
  \n### 何时不提供视图状态更改\n\n我可以想象一些不需要视图状态更改函数的应用程序。例如游戏。只需确保用户可以暂停并直接离开即可。\n\n# 第 7 章：展示数据\n\
  \nWindows 8 的核心在于为用户提供数据。这不仅关乎布局，更关乎所显示的信息。在本章中，我们将探索如何有效地管理和显示数据。\n\n#### 在屏幕上获取数据\n\
  \n![arrow](img/arrow.png) 虽然这不是微软推荐的方法，但对我来说，这是最符合逻辑的。我不是 CSS 大师，因此在代码中处理变化似乎非常合适。它提供了大量的控制权，并允许您在不同的视图中提供不同的功能。这取决于您和您的应用风格。\n\
  \n### 分组\n\n![arrow](img/arrow.png) Windows 8 的核心在于为用户提供数据。这不仅关乎布局，更关乎所显示的信息。在本章中，我们将探索如何有效地管理和显示数据。\n\
  \n### 使用 JavaScript\n\n![arrow](img/arrow.png) 虽然这不是微软推荐的方法，但对我来说，这是最符合逻辑的。我不是 CSS\
  \ 大师，因此在代码中处理变化似乎非常合适。它提供了大量的控制权，并允许您在不同的视图中提供不同的功能。这取决于您和您的应用风格。\n\n\n\n\n不过，这比你之前做的并没有好多少。每当数据发生变化时，你仍然必须调用\
  \ `processAll`，因为它是一次性绑定。JavaScript 对象本身不具备更新用户界面的能力。你需要一个绑定源。\n\n创建绑定源很容易。只需将 JavaScript\
  \ 对象传递给 `WinJS.Binding.as`，然后将其传递给 `ProcessAll`。现在当值改变时，UI 也会随之改变。这是我完成后 `basicBind.js`\
  \ 文件的样子：\n\n```javascript\n(function () {\n    \"use strict\";\n    var testing\
  \ = { testvalue: 7 }\n    var testingSource = WinJS.Binding.as(testing);\n    WinJS.UI.Pages.define(\"\
  /pages/basicBind.html\", {\n        ready: function (element, options) {\n     \
  \       var placeToPutText = document.getElementById(\"PlaceToPutText\");\n    \
  \        WinJS.Binding.processAll(placeToPutText, testingSource);\n        }\n \
  \   });\n})();\n```\n\n现在，任何更改 `testing` 数组数据的函数都会导致数据更新。你只需要记住更改绑定源而不是底层对象。绑定源会处理\
  \ UI 和底层对象的变化。\n\n你可以通过添加一个按钮来增加 `testing` 对象的 `testvalue` 参数来测试这一点。这模拟了值由用户事件改变的效果。实际上，它就是值由用户事件改变引起的效果。\n\
  \n只需在 HTML 中添加一个按钮，如下：\n\n```html\n<button id=\"increment\"></button>\n```\n\n然后挂载一个事件监听器来增量修改绑定源。这是我的新\
  \ .js 文件：\n\n```javascript\n(function () {\n    \"use strict\";\n    var testing\
  \ = { testvalue: 7 }\n    var testingSource = WinJS.Binding.as(testing);\n    WinJS.UI.Pages.define(\"\
  /pages/basicBind.html\", {\n        ready: function (element, options) {\n     \
  \       var incrementButton = document.getElementById(\"increment\");\n        \
  \    increment.addEventListener(\"click\", incrementValue);\n            var placeToPutText\
  \ = document.getElementById(\"PlaceToPutText\");\n            WinJS.Binding.processAll(placeToPutText,\
  \ testingSource);\n        }\n    });\n    function incrementValue() {\n       \
  \ testingSource.testvalue++;\n    }\n})();\n```\n\n### 修改数据\n\n在 `WinJS` 中，数据绑定是单向的。这意味着虽然数据绑定显示在\
  \ UI 上，但如果用户想更改数据，你需要做一些其他操作。\n\n实现此最简单的方法是在可以更改数据的元素上设置一个事件监听器。在之前的绑定示例中，我使用了 `span`，但如果它是文本框呢？\n\
  \n```html\nTesting <input type=\"text\" id=\"PlaceToPutText\" data-win-bind=\"value:\
  \ testvalue\"></input><br />\n<button id=\"increment\"></button>\n```\n\n现在你可以为文本框挂载事件监听器，并用它来更新绑定上下文。这是最终的\
  \ JavaScript 文件：\n\n```javascript\n(function () {\n    \"use strict\";\n    var\
  \ testing = { testvalue: 7 }\n    var testingSource = WinJS.Binding.as(testing);\n\
  \    WinJS.UI.Pages.define(\"/pages/basicBind.html\", {\n        ready: function\
  \ (element, options) {\n            var incrementButton = document.getElementById(\"\
  increment\");\n            increment.addEventListener(\"click\", incrementValue);\n\
  \            var placeToPutText = document.getElementById(\"PlaceToPutText\");\n\
  \            placeToPutText.addEventListener(\"change\", updateData);\n        \
  \    WinJS.Binding.processAll(placeToPutText, testingSource);\n        }\n    });\n\
  \    function incrementValue() {\n        testingSource.testvalue++;\n    }\n  \
  \  function updateData() {\n        var placeToPutText = document.getElementById(\"\
  PlaceToPutText\");\n        testingSource.testvalue = placeToPutText.value;\n  \
  \  }\n})();\n```\n\n如果你运行应用，更改值并按下按钮，你可以看到增量会加到你设置的值上。如果你通过调试器进行更改，可以检查底层数据，并发现它们是同步的。\n\
  \n**图 7-1：** 使用绑定源更改底层数据。\n\n![97811173350-fg701](img/97811173350-fg701_fmt.png)\n\
  \n### 列出数据\n\n单字段很重要，但并非所有事物皆如此。在某个某个时刻，你需要绑定到一个对象集合。例如，列表/详情应用程序需要在向用户显示详情之前先向其显示列表。详情都是单字段绑定，使用了前一节中的技术。列表需要稍微复杂一点。\n\
  \n在第 4 章的示例示例中，我对 `ListView` 进行了一些简单的数据绑定。那在多程度上就是绑定到对象集合的基础。在这里我将详细介绍（请原谅这个双关）。这里的目标是为你提供工具，以便将其应用于你遇到的任何情况。\n\
  \n### 处理对象集合\n\n在 JavaScript 中，任何事物都可以是对象。你可以将任何变量声明为对象并随机给它分配变量：\n\n```javascript\n\
  var person = new Object();\nperson.name = \"Bill\";\nperson.age = 41;\nperson.isWriting\
  \ = true;\n```\n\n此问题的在于你不能很容易地处理多个对象（等等，这里重新看原文逻辑，原文是 \"The problem with this is\
