  \ down the hatches with much love and affection\",\n    complete: false,\n  },\n\
  \  {\n    task: \"Remember the Alamo\",\n    complete: false,\n  },\n  {\n    task:\
  \ \"Drink beer\",\n    complete: false,\n  }\n];\n```\n\n2.  使用数据集作为参数声明一个 `WinJS.Binding.List`。\n\
  \n```javascript\nvar todayList = new WinJS.Binding.List(todayArray);\n```\n\n等等，就这些？两个步骤？这世界怎么了？事实上，大抵如此。虽然还有更多细节，但绑定就在此地开始并结束了。创建一个模板；获取一些数据；绑定。\n\
  \n### 填充细节\n\n在 HTML 中，你设置了一些 `data-win-options`。这些是 `WinJS.UI.ListView` 对象的属性——与作为模板一部分定义的那些相同。在\
  \ HTML 或 JavaScript 中，你可以获取 `ListView` 对象并设置其中一些属性来更改列表的行为。这就是处理分组信息展示细节的方法。表 7-1\
  \ 描述了你可以控制的某些角度。\n\n### 表 7-1 ListView 选项\n\n| 属性 | 详情 |\n| :--- | :--- |\n| `pagesToLoad`\
  \ | 告诉 Windows 8 在后台加载多少页。 |\n| `automaticallyLoad` | 设置当用户滚动到列表末尾时，自动加载下一组页面。 |\n\
  | `itemDataSource` | 设置数据源。 |\n| `itemTemplate` | 设置模板。这是你在上一个示例中所做的。 |\n| `currentItem`\
  \ | 设置用户查看页面时被选中的项目。 |\n| `indexOfFirstVisible` | 可以设置用户交互的列表中第一个项的项目。 |\n| `indexOfLastVisible`\
  \ | 你也可以设置最后一个可见的项。 |\n| `layout` | 你可以给 `ListView` 提供一个 `ListLayout` 或 `GridLayout`\
  \ 对象来控制列表的外观。 |\n| `loadingBehavior` | 决定可用项目的数量。 |\n| `scrollPosition` | 设置滚动条离内容的距离。\
  \ |\n| `selection` | 当然，你可以设置当前选中的项。 |\n| `selectionMode` | 这是一个令人惊讶地重要的属性。你可以决定用户如何在\
  \ `ListView` 中选择项目项。你可以将其设置为 `none`（无法选择任何内容）、`single`（可以选择一个项目）或 `multi`（可以选择几个或所有项目）。\
  \ |\n| `swipeBehavior` | 令人惊讶的是，这设置了用户用手指滑过列表时列表将的行为。 |\n| `tapBehavior` | 同理——处理点击操作。\
  \ |\n| `zoom` | 给 UI 一个提示，说明该控件接受双指缩放手势。我稍后在“使用分组”部分中会详细讨论这一点。 |\n\n那么 `ListView`\
  \ 是如何改变事情的呢？嗯，我想要复选框是因为这是一个任务列表，而任务列表应该有复选框。但如果我不要呢？比方我想让 `ListView` 处理选择并负责交互。我可以通过\
  \ `div` 和 `selectionMode` 属性来实现这一点。\n\n```html\n<div id=\"todayList\" data-win-control=\"\
  WinJS.UI.ListView\" data-win-options=\"{itemDataSource :todayList.dataSource, itemTemplate:\
  \ listTemplate, selectionMode: multi}\" style=\"margin-left: 5%; margin-right: 5%;\
  \ width: 40%; left: 0px; top: 0px;\"></div>\n```\n\n这给用户提供了在 `ListView` 中选择任务的体验，而不是点击复选框。这只是用户设计的问题，取决于你。对我个人而言，我需要复选框来提供那个任务列表的视角。对于其他应用程序，则不然。\n\
  \n### 网格布局\n\n`ListView` 的 `layout` 属性接受一个 `ListLayout` 或 `GridLayout` 对象来控制列表的外观。我们在“使用分组”部分中会更多讨论布局。图\
  \ 7-3 网格布局看起来不错！\n\n![978117350-fg003](img/978117350-fg003.png)\n\n### FlipView\n\
  \n`FlipView` 是 `ListView` 的全屏版本。`FlipView` 与 `ListView` 的绑定方式完全一样，唯一的区别是 `FlipView`\
  \ 标签本身。`FlipView` 和 `ListView` 一样拥有一组很好的属性，列在表 7-2 中，可以改变其性能和格式。你可以通过 `data-win-options`\
  \ 设置它们。\n\n```html\n<div id=\"theFlipView\" data-win-control=\"WinJS.UI.FlipView\"\
  ></div>\n```\n\n### 表 7-2 FlipView 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `itemDataSource`\
  \ | 与 `ListView` 一样，该属性设置集合。 |\n| `itemTemplate` | 用于每个项目的布局。 |\n| `currentPage`\
  \ | 设置 `FlipView` 所在的页面。非常适合导航。 |\n| `orientation` | 在这里设置竖屏或横屏格式。 |\n\n### 分组、排序和选择\n\
  \n将数据分组是 `ListView` 的一个重要且强大的功能。不过，分组有很多方面。排序、选择以及向用户展示他们想要的内容都是重要的。\n\n### 分组控制\n\
  \n这里是关于在 WinJS 中分组需要了解的两点：\n\n- 你只能通过使用 `GridView` 布局的布局进行分组。\n- 设置分组使用两个数据源——一个带有数据，另一个带有分组信息。尽管如此，它们都可以源自同一个根数据。\n\
  \n为了尝试分组，创建一个具有可分组属性的数据集。\n\n可分组属性是集合中重复的、可以形成有趣分组的属性。经典的例子是使用对象的第一个字母并按字母顺序分组。对于任务列表示例，你可以做一些不同的尝试。你到为止绑定的数据并不是分组最好的例子，但因为很熟悉，尽管尝试一下吧：\n\
  \n```javascript\nvar laterArray = [\n  {\n    task: \"Finish Chapter 1\",\n    whenToDo:\
  \ \"today\",\n    complete: false\n  }\n];\n```\n\n\n\n\n\n```javascript\n[\n  \
  \  whenToDo: \"today\",\n    complete: false\n  },\n  {\n    task: \"Check eyebrows\"\
  ,\n    whenToDo: \"today\",\n    complete: false\n  },\n  {\n    task: \"Repair\
  \ TARDIS\",\n    whenToDo: \"today\",\n    complete: true\n  },\n  {\n    task:\
  \ \"Batten down the hatches with much love and affection\",\n    whenToDo: \"later\"\
  ,\n    complete: false\n  },\n  {\n    task: \"Remember the Alamo\",\n    whenToDo:\
  \ \"later\",\n    complete: false\n  },\n  {\n    task: \"Drink beer\",\n    whenToDo:\
  \ \"later\",\n    complete: false\n  }\n];\n```\n\n2. 在你拥有一个绑定列表后，你会发现列表有一个用于分组的属性——`createGrouped`。它需要三个要素：\n\
  \n- 用于分组的字段或或键（key）。\n- 构成分组集合的数据——在我们的案例中，只是 `Today` 和 `Later`。\n- 一个用于项目排序的函数。这并不是这个示例中最有趣的部分，该排序组包含两个成员。\n\
  \n```javascript\nfunction sortGroup(leftKey, rightKey) {\n    return leftKey - rightKey;\n\
  }\nfunction getGroupKey(dataItem) {\n    return dataItem.whenToDo;\n}\nfunction\
  \ getGroupData(dataItem) {\n    return {\n        title: dataItem.whenToDo\n   \
  \ };\n}\nvar groupedItemsList = itemsList.createGrouped(getGroupKey, getGroupData,\
  \ sortGroup);\n```\n\n3. 设置一个使用 `Grid` 布局的 `ListView`，并使其同时具有 `item DataSource`\
  \ 和 `groupDataSource`。\n\n```html\n<div id=\"groupedListView\"\n    data-win-control=\"\
  WinJS.UI.ListView\"\n    data-win-options=\"{itemDataSource:groupedItemsList.dataSource,\n\
  \        groupDataSource:groupedItemsList.groups.dataSource,\n        layout: {type:\
  \ WinJS.UI.GridLayout}}\">\n</div>\n```\n\n其实就是这些。你只需要为 WinJS 提供另一个用于分组的数据源，它就会为你处理好一切。在未分组视图中工作的列表项模板在这里也同样适用。\n\
  \n### 单选与多选\n\n在 POINTtodo 中，我使用复选框和标签让用户选择任务项目。之所以这样做是因为它更像任务列表。\n\n不过通常，你可以使用\
  \ `ListView` 的 `SelectionMode` 让用户在视图中选择项目。`SelectionMode` 允许三种选择方式，如表 7-3 所示。\n\
  \n表 7-3 选择模式\n\n| 成员 | 值 | 描述 |\n| :--- | :--- | :--- |\n| none | none | 项目不可选择。这是我在\
  \ POINTtodo 中使用的的模式，因为它有复选框。 |\n| single | single | 允许用户一次选择一个项目，类似于单选按钮。 |\n| multi\
  \ | multi | 允许用户通过点击多个项目来选择多个项目。 |\n\n我本可以在 POINTtodo 中使用 `SelectionMode`。图 7-4\
  \ 显示了它可能的样子。\n\n### 内置动画\n\nWindows Store 中可以使用大量的动画——其中一些在第 6 节中讨论过。`ListView`\
  \ 特别为动画而设计，因为用户已经习惯了看到滑动的内容。设置 `ListView` 动画的属性是 `ListViewAnimationType`。它有两种类型：\n\
  \n- `entrance`：当 `ListView` 首次显示时显示。\n- `contentTransition`：用于更改内容。\n\n图 7-4：使用多选来完成\
  \ POINTtodo。你可以在 HTML 中的 `data-win-properties` 或 JavaScript 中设置该属性。JavaScript 只是一个数组，如下：\n\
  \n```javascript\nvar WinJS.UI.ListViewAnimationType = {\n    entrance: \"entrance\"\
  ,\n    contentTransition: \"contentTransition\"\n}\n```\n\nWindows 8 会为你处理这些细节。\n\
  \n### 使用语义缩放处理分组\n\nWindows 8 内置了一个控件，用于帮助用户（以及开发者）管理分组。语义缩放（Semantic Zoom）是一种感知触摸的用户界面功能，它允许用户从数据中“后退”，并将上层结构视为自身的数据集。到目前为止，我在任何应用中见过的这种功能的最佳例子就在开始屏幕上。按下\
  \ Windows 键进入开始屏幕，然后在屏幕上使用双指缩手势。你会看到类似图 7-5 的效果，分组变成了自己的磁贴。在鼠标和键盘世界中，你可以通过 `Ctrl+`\
  \ 和 `Ctrl-` 进行放大和缩小。\n\n图 7-5：缩小后的开始屏幕。图 7-5 是我的开始屏幕；你的自然会不同。没关系，你可以在这里做两件与分组管理相关的事——移动它们和命名。在这里，我可以滑过一个分组来选择它，然后触摸“命名分组”（Name\
  \ Group）给分组命名。你也可以只需按按更改分组的顺序。幸运的是，它是内置在 WinRT 中的，所以你可以轻松从应用中获取它。\n\n当你能够给用户提供有意义的数据概述时，就可以使用语义缩放。我之前使用的\
  \ POINTtodo 示例并不太适用，因为只有两个分组，而且分组视图并不那么有趣。对于大量应用，使用语义缩放是有意义的。例如：\n\n- 联系人列表：任何可以按字母组织的内容。放大视图将由单个联系人组成，缩小视图将由字母表以及可能代表每组联系人数量的组成。\n\
  - 股票应用：按市场板块分组。放大视图显示股票详情，缩小视图显示板块，可能绿色代表净收益，红色代表净亏损。\n- 产品目录：按类别分组。放大视图显示产品详情，缩小视图显示列出每个类别的磁贴。你甚至可以根据每个类别中的产品数量来调整磁贴的大小。\n\
  - 网络管理应用：按类型组织。放大视图显示设备详情列表，缩小视图显示设备类型集合。你也可以按物理位置、公司部门甚至子网进行分组，但一次只支持一种分组。在图 7-6\
  \ 中，我按照设备类型进行了分组。\n- 图书：按杜威分类法分组。放大视图显示书籍列表，缩小视图显示书籍编号的百位。这个示例展示了即使有一组分组，你可能需要做一些决策。你可以按杜威分类法的百位、十位甚至个位进行分组。\n\
  \n图 7-6：网络设备列表的平移、缩放和详情视图。\n\n在图 7-6 中，注意详情视图。语义缩放实际上为处理数据集的传统列表/详情范式添加了第三层。这样做是为了防止传统上与数据列表相关的页面视图。\n\
  \n\n\n\n\n![check.png](img/check.png) 记住尺寸和空间：确保缩放区域足够大以便有效使用缩放手势，并确保缩小后视图中的项目足够大以便点击。\n\
  \n![check.png](img/check.png) 在缩放和平移视图之间切换时，不要改变应用程序的整体流程：例如，如果你的列表是左右滚动的，那么语义缩放（Semantic\
  \ Zoom）视图也应该是那样的。\n\n![check.png](img/check.png) 确保分组对用户来说是有意义的：为分组命名并寻找良好的分组主题。\n\
  \n![check.png](img/check.png) 与 Windows 8 的其他设计一样，不要为语义缩放控件或其项目使用边框：这看起来并不好看。\n\n\
  ## 考虑技术细节\n\n在项目中设置语义缩放需要两点——像你在本章早些时候“分组、排序和选择”中所的那样构建分组数据，以及设置 `WinJS.UI.ListView`\
  \ 并以两种格式分别用于平移视图和缩放视图。\n\n1. 获取你的数据集并基于它创建一个 `WinJS.Binding.List`。\n\n```javascript\n\
  var data = [\n    { ‘name’: ‘Castillo de Rumba’, ‘address’: ‘334 Main Street’, ‘category’:\
  \ ‘Italian’ },\n    { ‘name’: “Bob’s Diner”, ‘address’: ‘12 Town Street’, ‘category’:\
  \ ‘Diner’ },\n    { ‘name’: ‘Italian Feast’, ‘address’: ‘503 Rich Street’, ‘category’:\
  \ ‘Italian’ },\n    { ‘name’: ‘Hamburger Palace’, ‘address’: ‘44 State Street’,\
  \ ‘category’: ‘American’ },\n    { ‘name’: ‘Hot Dog Palace’, ‘address’: ‘45 State\
  \ Street’, ‘category’: ‘American’ },\n    { ‘name’: ‘Taj Palace’, ‘address’: ‘1337\
  \ Hacker Street’, ‘category’: ‘Indian’ },\n    { ‘name’: ‘Spaghetti Warehouse’,\
  \ ‘address’: ‘10 Mound Street’, ‘category’: ‘Italian’ },\n    { ‘name’: ‘Dal Restaurant’,\
  \ ‘address’: ‘994 Lambert Street’, ‘category’: ‘Indian’ },\n    { ‘name’: ‘Sandwiches\
  \ by Joe’, ‘address’: ‘440 Main Street’, ‘category’: ‘Diner’ },\n    { ‘name’: ‘Bar\
  \ on Fifth’, ‘address’: ‘12 Fifth Street’, ‘category’: ‘Diner’ },\n    { ‘name’:\
  \ ‘The Sub Shop’, ‘address’: ‘229 E Broad Street’, ‘category’: ‘American’ },\n \
  \   { ‘name’: ‘Foor Deng’, ‘address’: ‘289 Main Street’, ‘category’: ‘Indian’ },\n\
  \    { ‘name’: ‘Soups and More’, ‘address’: ‘26 Columbus Street’, ‘category’: ‘American’\
  \ },\n    { ‘name’: ‘Beer Shack’, ‘address’: ‘12 Norton Street’, ‘category’: ‘Diner’\
  \ },\n    { ‘name’: ‘House of Food’, ‘address’: ‘998 Circle Street’, ‘category’:\
  \ ‘American’ },\n];\nvar dataList = new WinJS.Binding.List(data);\n```\n\n2. 设置分组函数并从数据创建\
  \ `groupedItemsList`。\n\n```javascript\nfunction compareGroups(leftKey, rightKey)\
  \ {\n    return leftKey.charCodeAt(0) - rightKey.charCodeAt(0);\n}\nfunction getGroupKey(dataItem)\
  \ {\n    return dataItem.category;\n}\nfunction getGroupData(dataItem) {\n    return\
  \ {\n        category: dataItem.category\n    };\n}\nvar groupedItemsList = dataList.createGrouped(getGroupKey,\
  \ getGroupData, compareGroups);\n```\n\n3. 在 HTML 中设置两个 ListView 以支持缩小视图和放大后视图。\n\
  \n```html\n<div id=”zoomedInListView”\n    data-win-control=”WinJS.UI.ListView”\n\
  \    data-win-options=\"{ itemDataSource: groupedItemsList.dataSource, itemTemplate:\
  \ select(‘#mediumListIconTextTemplate’), groupHeaderTemplate: select(‘#headerTemplate’),\
  \ groupDataSource: data.groupedItemsList.groups.dataSource, selectionMode: ‘none’,\
  \ tapBehavior: ‘none’, swipeBehavior: ‘none’ }”\n</div>\n<div id=”zoomedOutListView”\n\
  \    data-win-control=”WinJS.UI.ListView”\n    data-win-options=\"{ itemDataSource:\
  \ groupedItemsList.groups.dataSource, itemTemplate: select(‘#semanticZoomTemplate’),\
  \ selectionMode: ‘none’, tapBehavior: ‘none’, swipeBehavior: ‘none’ }”\n</div>\n\
  ```\n\n4. 在 HTML 中设置两个 ListView 以支持缩小视图和放大后视图。在 ListView 之间使用了三个模板。注意放大后视图中的 `headerTemplate`。\n\
  \n```html\n<div id=”headerTemplate”\n    data-win-control=”WinJS.UI.ListView”\n\
  \    data-win-options=\"{ itemDataSource: groupedItemsList.dataSource, itemTemplate:\
  \ select(‘#mediumListIconTextTemplate’), groupHeaderTemplate: select(‘#headerTemplate’),\
  \ groupDataSource: data.groupedItemsList.groups.dataSource, selectionMode: ‘none’,\
  \ tapBehavior: ‘none’, swipeBehavior: ‘none’ }”\n>\n```\n（注：第 4 步的原文是碎片化的；上述逻辑已根据提供的上下文片段进行了重构。）\n\
  \n\n\n\n\nWindows 8 设计语言的核心原则之一是整合常用任务组以提高使用速度。磁贴（Tile）就是这一原则的实现。它允许用户从桌面直接查看应用内容，而不仅仅是点击一个图标来运行程序。\n\
  \n然而，磁贴不仅仅是更新后的图标。在接下来的几个章节中，我将讨论实时更新、动画和图像的编程。磁贴本身也是一个微型应用程序。\n\n一个活跃且响应迅速的 UI\
  \ 应该做的不仅仅是作为磁贴显示静态的信息面板，对吧？我确实是这么认为的。当用户在使用屏幕时，它应该有一些有趣的、动态的且富有信息的幻灯，微妙地穿过用户的意识。\n\
  \n为了实现这一目标，磁贴具有某些能力，这些能力将 `WinRT` 的力量稍微扩展到了沙盒之外。它们可以在应用程序未运行时进行更新，并打破几条图形规则。关于此更多信息请参阅《构建实时磁贴》以及本章后续。\n\
  \n现在，请理解：磁贴可能是你的应用中不直接属于应用本身最重要的部分。它是设计语言的核心，也是 Windows 8 原则的核心。它还是你应用极佳的广告牌。\n\n\
  ## 磁贴能力\n\n基于磁贴的功能可以很清楚看到，磁贴具有某些某种程度上违背了 `WinRT` 通用理念的能力。有一个 Windows 沙盒，你的 Store\
  \ 应用必须在其中运行，但磁贴可以在草地上玩耍。以下是磁贴可以做的一些事情：\n\n- ![check.png](img/check.png) 它们可以在你的程序未运行时更新。即使你的程序没有运行，磁贴也可以从\
  \ Windows 通知服务获取更新。例如，如果用户从网站上传了一照片，你的照片应用的磁贴就可以更新以显示它。\n- ![check.png](img/check.png)\
  \ 磁贴的灵感来自各种来源。磁贴的布局不是 `HTML` 或 `XAML`，也不只是旧式的 `XML`（我们以前称之为 `POX` 或纯 `XML`）。内容、徽标（badge）和名称由不同的内容源处理并独立更新。\n\
  - ![check.png](img/check.png) 你几乎可以展示电影。磁贴的图像、动画和循环更新允许你作为作为应用开发者进行一些非常华丽的操作。尽管应用应该是端庄得体的，但磁贴可以非常活跃。\n\
  \n为什么对于一个基本上是应用图标的东西要有这些能力？因为它是你应用的窗口。你可以、也应该利用磁贴来展示你的应用，吸引更多人使用它，并通常情况下给用户留下深刻印象。\n\
  \n## 磁贴预期\n\n尽管如此，人们对磁贴有某些预期，这些预期在很大程度上被实现为开发模型的限制。磁贴只有特定的尺寸，且更新频率也有限制。磁贴沙盒更大，但它仍然存在。\n\
  \n- ![remember.eps](img/remember_fmt.png) 第一个最重要的预期是应用可以处理两种尺寸的磁贴：方形和宽屏。方形磁贴通常只作为图标，但也可以更新活跃内容，以及品牌和徽标。宽格式通常与活跃内容相关，因为它比方形磁贴大一倍以上。\n\
  \n用户决定显示方形还是宽磁贴。要理解我的意思，请在开始屏幕上右键点击（或向上滑动）宽磁贴，注意出现的应用程序栏。它有一个较小的按钮。由于用户拥有控制权，你必须准备好在方形磁贴中显示内容，以及你在宽格式中显示的任何内容。\n\
  \n- ![check.png](img/check.png) 磁贴并不被要求保持活跃。事实上，如果每个磁贴都带有动画，用户的开始页面可能会变得过于嘈杂。磁贴仍然可以相关的、最新的信息，并在风格上与应用保持一致。\n\
  - ![check.png](img/check.png) 磁贴更新取决于应用的使用情况。对于由应用本身更新的内容——例如游戏的高分——应用应该执行更新，就像它在准备挂起一样。如果应用从外部消耗内容，磁贴可以不依赖于应用进行更新，但每\
  \ 30 分钟最多更新一次。\n- ![check.png](img/check.png) 磁贴内容应该是相关的。给用户展示能让他开心的东西。不要向用户展示广告或推广其他应用。\n\
  \n磁贴可能是你的应用中不直接属于应用本身最重要的部分。它是设计语言的核心，也是 Windows 8 原则的核心。它还是你应用极佳的广告牌。\n\n## 构建实时磁贴\n\
  \n设置磁贴\n\n在创建新项目时，它将默认为宽磁贴，用户现在有选项更改为较小的磁贴。应用清单文件中“宽屏标志”（Wide Logo）的存在定义了你的应用启动时的磁贴尺寸。\n\
  \n\n\n\n\n沿着此思路，如果你在清单编辑器中填写了“短名称”（Short Name）字段，它将显示在磁片的“名称”（Name）区域，如图 8-4 所示。该值在代码是可以编辑的，因此你可以使用它执行是将名称传递给用户之外的操作。\n\
  \n**图 8-4**：带有名称区域的宽磁片。\n\n![9781118173350-fg0804.tif](img/9781118173350-fg0804_fmt.png)\n\
  \n### 使用模板发布\n\n默认布局之外磁片内容由一组隐藏在 WinRT 最深处的 XML 模板处理。这 46 个模板处理了各种不同的设置、图标类型和内容。\n\
  \n![remember.eps](img/remember_fmt.png) 模板类型（见图 8-1）位于 `Windows.UI.Notifications.TileTemplateType`\
  \ 枚举器中。如果你想查看带有示例的完整列表，请搜索[`http:// mdn.microsoft.com/en-us/windows`](http://msdn.microsoft.com/en-us/windows)\
  \ 中的 `TileTemplateType`。\n\n模板类型包括一些边缘情况以及几个看起来不太好看的布局。内容类型还包括 Peek（预览），这是磁片的另一项高级功能。通常情况下，你会一直使用某几种模板类型。\n\
  \n### 表 8-1 磁片模板布局\n\n| 类型 | 描述 | 图像 |\n| :--- | :--- | :--- |\n| `tileSquareImage`\
  \ | 填充整个正方形磁片的图像。 | ![9781118173350-ma001.tif](img/9781118173350-ma001_fmt.png)\
  \ |\n| `tileSquareBlock` | 一个大字符串覆盖在一个小字符串上。类似于日历。 | ![9781118173350-ma002.tif](img/9781118173350-ma002_fmt.png)\
  \ |\n| `tileSquareText01` | 一个标题和三行较小的文本。有四种不同格式的此类。 | ![9781118173350-ma003.tif](img/9781118173350-ma003_fmt.png)\
  \ |\n| `tileWideImage` | 仅有一个填充整个宽磁片区域的宽图（310px）。 | ![9781118173350-ma004.tif](img/9781118173350-ma004_fmt.png)\
  \ |\n| `tileWideImageAndText01` | 图像，在底部留有文本空间。 | ![9781118173350-ma005.tif](img/9781118173350-ma005_fmt.png)\
  \ |\n| `tileWideBlockAndText01` | 类似于 `TileSquareBlock`，但左侧有文本行。 | ![9781118173350-ma006.tif](img/9781118173350-ma006_fmt.png)\
  \ |\n| `tileWideSmallImage AndText01` | 一个小图标，右侧留有文本空间。有四种版本。 | ![9781118173350-ma007.tif](img/9781118173350-ma007_fmt.png)\
  \ |\n| `tileWideText` | 可能是最常见的——宽磁片中的 11 种纯文本，没有图像。 | ![9781118173350-ma008.tif](img/9781118173350-ma008_fmt.png)\
  \ |\n\n这种模式是：你决定用户最感兴趣在磁片上看到什么，然后选择最能模拟你想法的模板。每个模板都有一组略有不同的属性，你在运行时用内容填充它们。砰！你就有了一个动态磁片。\n\
  \n模板的属性定义在 XML 中。例如，`TileWideImageAndText01` 的 XML 如下所示：\n\n```xml\n<tile>\n  <visual>\n\
  \    <binding template=\"TileWideImageAndText01\">\n      <image id=\"1\" src=\"\
  image1.png\"/>\n      <text id=\"1\">Text Field 1</text>\n    </binding>\n  </visual>\n\
  </tile>\n```\n\n如果你愿意，可以查看使用 `getTemplateContent` 方法获取的 XML。在后续章节的步骤列表中，只需在代码的第二行上设置断点，然后查看\
  \ `tileTemplate` 的内容。\n\n但我现在想得太快了。\n\n### 在应用的个性化中渲染内容\n\n使用宽大的 Dummies 磁片图像，在其上面写一些文本，给用户一些可以看的内容。\n\
  \n1. 从 `TileUpdateManager` 获取 XML 模板。这类似于上一节末尾的代码。你需要用你自己的内容设置模板中的值。\n2. 使用 `getElementsByTagName`\
  \ 从 XML 中获取 `Text` 元素。\n3. 通过 `getElementsByTagName` 设置 `Image` 元素。\n4. 创建 `TileUpdater`\
  \ 来更新磁片。\n5. 在这种情况下，我们使用磁片来通知用户。\n6. 如例所示，我们在 `onactivated` 事件中更新磁片：\n\n```javascript\n\
  app.onactivated = function (eventObject) {\n  if (eventObject.detail.kind === Windows.ApplicationModel.ActivationKind.launch)\
  \ {\n    if (eventObject.detail.previousExecutionState !== Windows.ApplicationModel.ApplicationExecutionState.terminated)\
  \ {\n      var tileTemplate = Windows.UI.Notifications.TileUpdateManager.getTemplateContent(Windows.UI.Notifications.TileTemplateType.tileWideImageAndText01);\n\
  \      var tileTextAttributes = tileTemplate.getElementsByTagName(\"text\");\n \
  \     tileTextAttributes[0].appendChild(tileTemplate.createTextNode(\"Welcome to\
  \ Dummies\"));\n      var tileImageAttributes = tileTemplate.getElementsByTagName(\"\
  image\");\n      tileImageAttributes[0].setAttribute(\"src\", \"ms-appx:///images/WideLogo.png\"\
  );\n      var tileNotification = new Windows.UI.Notifications.TileNotification(tileTemplate);\n\
  \      Windows.UI.Notifications.TileUpdateManager.createTileUpdaterForApplication().update(tileNotification);\n\
  \    }\n  }\n};\n```\n\n这对于我们意味着？调试时你可以在开始屏幕上看到新的磁片，正如图 8-5 所示。\n\n**图 8-5**：带有模板的新的磁片。\n\
  \n![9781118173350-ma005.tif](img/9781118173350-ma005_fmt.png)\n\n## 获取通知\n\n设置好模板后，获取磁片通知并不困难。你需要决定系统中的哪些事件应该更新磁片，然后将磁片更新附加到它们上。\n\
  \n考虑你的应用程序。在 ToDo 应用中，每当用户更新任务列表时我都会更新磁片，确保显示最新的任务。如果你正在编写游戏，可能希望每次玩家清除关卡时更新磁片。\n\
  \n通常情况下，将通知视为其本身——一个通知用户应用中发生的最后一件事情的机会。\n\n\n\n\n\n我们可以调用此函数，也许可以传入日期来看看它是如何运行的。例如，在示例项目\
  \ `default.js` 文件的 `processAll` 函数之后添加一个由 promise 激活的函数：\n\n```javascript\nWinJS.UI.processAll().done(function\
  \ (e) {\n        var today = new Date();\n        updateTile(today);\n});\n```\n\
  \n运行此代码，磁贴的文本区域应该会更新为当前日期。现在，假设你想在用户使用应用时实时更新磁贴。为了实现这一点，你可以在默认页面直接添加一个按钮以及该按钮的事件处理器。\n\
  \n```html\n<body>\n            <button type=\"button\" id=\"actionButton\" style=\"\
  position: relative; left: 300px; top: 300px;\">Click Me</button>\n</body>\n```\n\
  \n在 `default.js` 为按钮设置一个变量（我将其命名为 `theButton`），然后添加少量代码来调用 `updateTile` 函数：\n\n\
  ```javascript\ntheButton = document.getElementById(\"actionButton\")\ntheButton.addEventListener(\"\
  click\", function (e) {\n        var today = new Date();\n        updateTile(today);\n\
  });\n```\n\n再次运行应用，然后按下 Windows 键并确认磁贴中的日期和时间是否正确。然后回到示例应用并点击按钮。\n\n再次按下 Windows\
  \ 键，磁贴将会发生变化。这可以是某场大赛的比分、新闻或预约——选择权交由你。\n\n## 在队列上获取消息\n\n如果你有多个内容想要显示给用户看怎么办？你可以使用带有许多小文本的模板之一，但有一个更好的选择。Microsoft\
  \ 允许你在队列中堆叠最多五条消息，并逐一个循环播放。\n\n为了实现这一点，你必须启用队列。这是一个单行属性设置，可以放在应用的初始化代码中。在此示例中，我使用了\
  \ `onactivated` 事件：\n\n```javascript\nWindows.UI.Notifications.TileUpdateManager.createTileUpdaterForApplication().enableNotificationQueue(true);\n\
  ```\n\n执行该操作后，我建议清除队列。你不希望旧的内容在你的新内容出现之前仍在其中滚动。\n\n```javascript\nWindows.UI.Notifications.TileUpdateManager.createTileUpdaterForApplication().clear();\n\
  ```\n\n现在 `onAppActivated` 看起来像这样：\n\n```javascript\napp.onactivated = function\
  \ (eventObject) {\n      if (eventObject.detail.kind === Windows.ApplicationModel.Activation.ActivationKind.launch)\
  \ {\n               if (eventObject.detail.previousExecutionState !== Windows.ApplicationModel.Activation.ApplicationExecutionState.terminated)\
  \ {\n                    Windows.UI.Notifications.TileUpdateManager.createTileUpdaterForApplication().enableNotificationQueue(true);\n\
  \            Windows.UI.Notifications.TileUpdateManager.createTileUpdaterForApplication().clear();\n\
  \                    theButton = document.getElementById(\"actionButton\")\n   \
  \                 theButton.addEventListener(\"click\", function (e) {\n       \
  \                 var today = new Date();\n                        updateTile(today);\n\
  \                   });\n            }WinJS.UI.processAll().done(function (e) {\n\
  \                   var today = new Date();\n            updateTile(today);\n  \
  \      });\n     }\n};\n```\n\n按下 F5 启动应用，然后点击 Windows 按钮查看磁贴。它应该显示日期。去喝杯咖啡，然后回来。我会等你的。\n\
  \n现在点击“Click Me”按钮，然后查看磁贴。通知应该会在两个时间之间滚动——即你启动应用的时间和点击按钮的时间。\n\n回到应用并再次点击按钮。现在查看磁贴；三个日期正在滚动。你可以拥有多五个这样的项目，通知管理器会自动丢弃最旧的。\n\
  \n## 创建二级磁贴\n\n用户可以创建二级磁贴，将他们引导至应用内的特定内容。\n\n### 了解二级磁贴的概念\n\n用户可以创建二级磁贴，将他们引导至应用内的特定内容。\n\
  \n二级磁贴非常像应用。它们具有相同的尺寸、交互方式，并且在点击时会启动应用。\n\n### 固定二级磁贴\n\n要固定二级磁贴，请使用 `StartScreen`\
  \ 类。调用方式如下：\n\n```javascript\nsecondaryTile = Windows.UI.Notifications.StartScreen.createTile(\"\
  001\",\n      \"Baklava\",\n      \"Baklava's Best\",\n      Windows.UI.Notifications.StartScreen.TileOptions.showName,\n\
        new Windows.Foundation.Uri(\"ms-appx:///logo.png\"))\n```\n\n**图 8-6：固定**\n\
  \n- TileID 是磁贴的唯一标识。如果你用，旧的会被替换。\n- 短名称显示在磁贴上。\n- 显示名称在工具提示中。\n- 参数告诉 Windows 8\
  \ 是否显示短名称。\n- 点击磁贴时，会将参数传递给应用程序。参数可以是有意义的内容，如 ID。\n- `TileOptions` 枚举告诉 Windows\
  \ 8 是否显示短名称。\n- 应使用的图像是最后一个参数。\n\n创建磁贴对象后，需要将其安装到开始屏幕上。这需要调用 `requestAsync`，它会向用户请求许可。然后它会安装磁贴。\n\
  \n```javascript\nsecondaryTile.requestAsync().then(function (isCreated) {\n      if\
  \ (isCreated) {\n             // 成功了，继续你的工作\n      } else {\n             // 发生了错误\n\
  \      }\n});\n```\n\n`Windows` 8 现在负责放置磁贴，用户可以随心所欲地移动、调整大小或删除。\n\n## 处理来自二级磁贴的启动\n\
  \n你的应用可以通过二级磁贴像普通磁贴一样被激活。幸运的是，使用的是同一个事件。同样幸运的是，你可以判断哪个磁贴执行了激活。\n\n在 `activated`\
  \ 函数（即你的应用监听的 `Activated` 事件的处理器）中，如果你的应用使用了二级磁贴，则需要检查参数。\n\n```javascript\nfunction\
  \ activated(eventObject) {\n      if (eventObject.detail.kind === Windows.ApplicationModel.Activation.ActivationKind.launch)\
  \ {\n              if (eventObject.detail.arguments) {\n                      //有参数。\n\
  \        }\n    }\n}\n```\n\n\n\n\n```javascript\n//获取它们并使用它们进行导航。\n} else {\n//没有参数意味着它是从磁贴启动的。\n\
  }\n}\n```\n这些参数将和你在固定磁贴”（Pinning a tile）部分中设置的内容相同。你可以获取它们、解析它们并将它们用于导航。\n\n## 使用\
  \ Toast 吸引用户注意力\n\n更新磁贴是获取用户在开始屏幕上注意力的极方法。然而，当用户处于另一个应用程序时，情况完全是另一回事。在 Windows 7\
  \ 的世界里，曾经可以创建系统托盘（SysTray）应用程序来通知用户重要事件。在 Web 领域，你可以使用 `alert` 进行跨标签页通信。在 Windows\
  \ 8 中，我们有了 Toast。图 8-7 中的 Toast（以及其他地方的 Toast）是出现在 Windows 8 屏幕右上角的一个小区域。它可以是定时的，也可以由应用激活，甚至是由云端驱动的。它可以包含图像、文本或两者兼有。它的存在是为了告诉用户某些信息并将他们带回你的应用。\n\
  \n**图 8-7：** Toast —— 它不仅仅是为了早餐。\n![978111173350-fg807.eps](img/978111173350-fg807_fmt.png)\n\
  \n### 决定何时使用 Toast\n\n仅仅把 Toast 放在用户面前并说“嘿，我们的应用很酷吧？快用用它！”是非常糟糕的，会让你被商店踢出去。关于何时以及何处最适合使用\
  \ Toast 通知有几个决定因素：\n\n![check.png](img/check.png) 在用户等待的任务完成时（例如后台工作线程或上传）通知用户。\n\
  \n![check.png](img/check.png) 告诉用户他们有一条消息。\n\n![check.png](img/check.png) 提醒用户他请求过提醒的事情。\n\
  \n当用户收到合适的 Toast 通知时，点击通知应该将他们带到应用中恰恰正确的空间来处理。然而，你必须意识到，用户可能不会看到每一个通知，因为它们是瞬即时的：它们只持续特定的时间，并且是用户可配置的。\n\
  \n## 会导致被商店踢出的 Toast 用法包括：\n\n![check.png](img/check.png) 高频消息，例如每次温度变化时。\n\n![check.png](img/check.png)\
  \ 普通事务，例如 PC 维护事件。\n\n![check.png](img/check.png) 用户必须看到的真正重要的事情。Toast 通知是瞬间，所以它们不是关键消息的良好选择。\n\
  \n![check.png](img/check.png) 无缘无故引导用户进入应用。“打破 349 的最高分！”并不是一个好的 Toast 通知。\n\n![remember.eps](img/remember_fmt.png)\
  \ 在你努力不打扰用户时，记住在通知中排除应用名称。你通常也不应该在你的 Toast 通知中包含应用图标，但如果图像增加了额外信息，那是可以的。最后，在发送 Toast\
  \ 通知之前，确保你已经检查了通知是否已禁用。\n\n## 从应用中调用 Toast\n\n为了发送 Toast 通知，你必须能够接收它们。这属于那种安排的一种。图\
  \ 8-8 显示了清单（manifest）的通知区域，可以在那里设置 `ToastCapable` 设置。\n\nToast 的一种用法是定时通知。当通知在队列中时，即使你的应用挂起，它也会运行，因为队列是由操作系统处理的。\n\
  \n![tip.eps](img/tip_fmt.png) 你也可以通过云端发送通知。（是的，我说了云端。现在可以去喝水了。）查看“当应用未运行时通知你的用户”以了解我的意思。图\
  \ 8-9 显示了非商店应用上的通知。\n\n调度通知当然是根据用户的意愿发生的某些事情会预先设置——设置某个值并按下某个按钮。然而，对于这个示例，我将调度放在了\
  \ `onactivated` 事件处理器中。只需将代码移动到你需要的地方即可！\n\n**图 8-8：** 为 Toast 准备。\n![978111173350-fg0808.eps](img/978111173350-fg0808_fmt.png)\n\
  \n**图 8-9：** Visual Studio 之上的 Toast。\n![978111173350-fg0809.tif](img/978111173350-fg0809_fmt.png)\n\
  \n1. 就像磁贴一样，你需要为你的 Toast 设置模板。模板与磁贴非常相似，但要查看完整列表，请搜索 [`http://msdn.microsoft.com/en-US/windows`](http://msdn.microsoft.com/en-US/windows)\
  \ 中的 `ToastTemplateType`。\n\n```javascript\nvar template = Windows.UI.Notifications.ToastTemplateType.toastImageAndText01;\n\
  var toastXml = Windows.UI.Notifications.ToastNotificationManager;\n```\n\n\n\n\n\
  用户可以决定不接收通知，如图 8-10 所示，而你必须尊重这一点。虽然微软似乎可以选择在用户选择退出时直接禁用所有 Toast（Toast）通知，但我想他们可能为自己的应用保留了权利，即使在用户已选择退出的情况下仍使用\
  \ Toast 通知，这可能是可以接受的。系统应用应该遵循自己的规则运行，以提供稳定的工作环境。\n\n**图 8-10：** 关闭通知。\n\n![9781118173350-fg0810.tif](img/9781118173350-fg0810_fmt.png)\n\
  \n要关闭通知，请进入“设置”（Settings）界面并点击弹出窗口最底部的 `Change PC Settings`。图 8-10 显示了向下的第三个选项卡（取决于你的设备，项目可能会略有不同），即\
  \ `Notifications`（通知）。\n\n用户有权显示或隐藏所有通知，或者按应用程序单独设置。你的应用程序需要遵守这些请求。\n\n`ToastNotifier`\
  \ 有一个专门用于处理此问题的 `setting` 属性。在调用 `createToastNotifier` 之后，你可以检查设置以查看是否已启用。代码如下：\n\
  \n```\nvar toastNotifier = Windows.UI.Notifications.ToastNotificationManager.createToastNotifier();\n\
  var setting = toastNotifier.setting;\nif (setting == Windows.UI.Notifications.NotificationSetting.enabled)\
  \ {\n    toastNotifier.addToSchedule(recurringToast);\n}\n```\n\n你可能需要对代码进行一些重构以使其更高效。在本书章前面的“在你的应用中调用\
  \ Toast”代码中，`createToastNotifier` 的调用位于结尾 —— 你可能想在开头调用它，如果它未启用，则短路（short-circuit）整个函数。如往常一样，什么构成良好的模式和实践取决于你的具体情况。\n\
  \n## 当你的应用程序未运行时通知用户\n\n你有四种方法将通知发送到活动磁贴（live tile）或 Toast：\n\n![check.png](img/check.png)\
  \ 在你的应用程序运行时执行。\n\n![check.png](img/check.png) 像之前的磁贴示例一样，安排以后执行。\n\n![check.png](img/check.png)\
  \ 设置为定期运行。\n\n![check.png](img/check.png) 使用 Windows 推送服务，即 WNS。\n\n![tip.eps](img/tip_fmt.png)\
  \ WNS 设计用于在你的应用程序未活动时向用户获取数据。实时信息，如消息、邀请、更新和新闻简报是推送的理想选择。该服务由微软作为 Windows 8 UI 开发工具的一部分免费提供（你也可以在\
  \ Windows Phone 上使用它），所以充分利用它。\n\n## 为 Windows 推送服务设计\n\nWNS 的设计目标是挂钩你已经在应用程序中构建的服务，即使该服务没有运行也是如此。它通过跟踪使用你应用程序的单个用户的注册，然后代表他们监控服务来实现。\n\
  \n话虽如此，这并不是一项简单的任务。它假设了几个点：\n\n![check.png](img/check.png) 你有一个需要从自定义服务获取信息的应用程序。\n\
  \n![check.png](img/check.png) 该服务已经编写完成。\n\n![check.png](img/check.png) 编写的服务托管在网络上。\n\
  \n如果你具备这三点，你就万事了。\n\n这个小小的推送系统包含四个部分，如图 8-11 所示。其中两个部分是微软的责任，另外两个是你的责任。\n\n顶部的两个部分\
  \ —— Windows 8 应用程序和服务 —— 是你的问题。微软负责通知客户端平台和 WINS 服务。\n\n**图 8-11：** WINS 架构。\n\n\
  ![9781118173350-fg0811.eps](img/9781118173350-fg0811_fmt.png)\n\n![remember.eps](img/remember_fmt.png)\
  \ 当微软提到云服务时，他们指的是托管在互联网上的 Web 服务。我完全不知道为什么那突然就变成了云服务，但它确实是。\n\n在你的应用程序设置好以使用该服务后，图\
  \ 8-11 中的过程开始展开：\n\n1. Windows 8 应用程序向本地通知客户端发送请求，获取通知服务的 URL。\n2. 客户端平台从 WNS 获取\
  \ URL。\n3. 该 URL 发送到你的应用程序供使用。\n4. 你将其发送到你的服务，以便它知道向何处发送内容。\n5. 当你的服务有新内容要推送到磁贴时，它将其发送到应用程序发送的\
  \ URL。\n6. WNS 将其发回平台，由平台更新磁贴或 Toast。\n\n这意味着你的服务必须维护所有已注册的安装应用程序列表以进行更新；此循环适用于每个应用程序。该服务的设计稍微超出了本书的范围，但市面上有很多优秀的\
  \ WCF 籍。将服务托管在 AppHarbor 上，你就可以正常运行。\n\nWindows 8 应用程序实际上不需要任何特殊的设计决策 —— 服务只需要包含可以从互联网定期更新的信息，并且它需要一个存放这些信息的地方。\n\
  \n## 注册你的应用程序\n\nWNS 需要知道你的应用程序将要发送内容。它使用白名单进行授权，因此如果你的应用程序不在列表中，它将不会允许进入。\n\n为了注册你的应用程序，你需要确保几个部分已到位。仪表板（我在第四部分中提到过）是你设置\
  \ WNS 的地方。\n\n1. 确保你的应用程序已注册。\n2. 设置应用程序的身份信息。\n3. 获取 `package.manifest` 中的值。\n\
  4. 从图 8-12 获取包安全标识符（SID）和客户端密钥（Secret）。\n\n这是最重要的部分 —— 你需要给服务的密钥。恶意用户可能会劫持每个安装的应用程序实例。\n\
  \n## 推送通知\n\n将通知送到磁贴现在在很大程度上是服务的责任。因为你无法用 JavaScript 编写 WCF 项目，这是另一本书的领域。我可以写整本关于\
  \ WNS 以及正确设计、配置和部署带推送功能的 Windows 8 应用程序的书。\n\n**图 8-12：** 你的包安全信息。\n\n![9781118173350-fg0812.tif](img/9781118173350-fg0812_fmt.png)\n\
  \n![tip.eps](img/tip_fmt.png) 此使用 [`dev.windows.com/](http://dev.windows.com/)。你可以在那里找到系列文章，提供了大量的示例代码和图表\
  \ —— 比我提供的要多。只需搜索通知即可找到它。此外，在相同的 URL 上有一个针对此问题的示例，包含了一切。利用微软提供的资源。\n\n我要说 —— 你必须在应用程序中考虑两个关键点。首先，你需要从\
  \ Windows 8 应用程序请求通道（WNS 服务的路径）。其次，你需要将获得的 URL 发送到你的服务并存储在那里。\n\n要获取通道 URL，你需要使用\
  \ WinRT 中的 `PushNotification` 类。它有一个命名中最糟糕的方法：`createPushNotification ChannelForApplicationAsync`。代码如下：\n\
  \n```\nvar channel;\nvar pushNotifications = Windows.Networking.PushNotifications;\n\
  var channelOperation = pushNotifications.PushNotificationChannelManager.createPushNotificationChannelForApplicationAsync();\n\
  return channelOperation.then(function (newChannel) {\n    channel = newChannel;\n\
  });\n```\n\n\n\n\n\n```javascript\n// Success. The channel URI is found in newChannel.uri.\n\
  \n    },\n    function (error) {\n        // Could not create a channel. Retrieve\
  \ the error through error.number.\n    }\n);\n```\n\n接下来，你需要将 `channel.uri` 获取到你的服务。幸运的是，这仅仅是一个\
  \ `xhr` 调用。这段代码非常直观。\n\n```javascript\nvar serverUrl = “http://YourServer.com”;\n\
  var xhr = new WinJS.xhr({\n    type: “POST”,\n    url: serverUrl,\n    headers:\
  \ {\"Content-Type”: “application/x-www-form-urlencoded\"},\n    data: “channelUri=”\
  \ + channel.uri\n}).then(function (req) {\n    // Channel URI 成功发送到服务器。通过 req.response\
  \ 获取响应。\n},\nfunction (req) {\n    // 无法将 channel URI 发送到服务器。通过 req.statusText 获取错误。\n\
  }\n});\n```\n\n在 Windows 8 应用中，你做的就是这些了。剩下的工作都由服务处理。\n\n## 涂上 Azure 色\n\n由于你的服务必须托管在互联网服务器上，因此值得提到的是，作为微软云平台的一部分，Windows\
  \ Azure 免费支持最多 10 个 Web 应用程序（包括 WCF 项目）。\n\n这为开发者提供了一个有趣的机会，可以为他们的应用创建一个基于云的服务层，该层可以向\
  \ WNS 注册。它不非要是 Azure，但这项技术确实非常好，而且价格也合理！我将在第 15 章深入介绍 Azure 的新功能 Mobile Services。\n\
  \n# 第三部分：深入内部原理\n\n![9781118173350-pp0301.eps](img/9781118173350-pp0301_fmt.png)\n\
  \n## 在这一部分 . .\n\n当涉及到真正完成任务时，你需要数据、网络、程序流……简而言之，你的应用需要一些内部机制。这一部分完全关于 WinRT 的新异步平台，用于以快速、流畅的方式完成任务。\n\
  \n# 第 9 章：面向合约编程\n\n### 本章内容\n\n- 允许与其他应用共享\n- 提供搜索功能\n- 利用设备\n\n从几何以前，如果你需要执行应用程序外部的操作，例如打印到打印机或与另一个程序通信，你就得从杂志上拷贝代码。\n\
  \n好吧，那是很久以前的事了。但也不久以前，你开始从互联网上拷贝代码。然后过了一段时间，出现了你可以复制到程序中的库。\n\n最终，出现了你可以直接使用的服务。如果你想提供信息，可以创建自己的服务。尽管如此，寻找这些服务或让别人发现你的服务有时是相当困难的。事实现在依然如此。\n\
  \nWindows 8 正在尝试一种完全新的方法。它不再依赖于具有联网功能的代码（无论是复制的还是内置的），通用的接口代码是作为操作系统编程接口的一部分提供的。它被称为\
  \ `contract`（合约），它正将 Windows 编程带向新的高度。\n\n## 以全新的旋律进行编码\n\nWindows 8 应用使用 Charms（磁贴）与用户交互，并使用\
  \ Contracts（合约）与外部世界通信。Charms 是当你从右侧滑动或将鼠标移动到屏幕右下角时出现在屏幕右侧的导航元素。Contracts 是与其他应用的约定。\n\
  \n当微软说 Windows 8 是重构的 Windows 时，很少有人认为这意味着为该平台开发应用需要对应用行为的态度发生彻底改变，但事实确实如此。磁贴和合约的使用涉及了当代应用开发中一些常见的方面。\n\
  \n每个功能都有两个方面——在你的应用程序中实现功能，以及在整个 Windows 8 体验中暴露功能。我将从 `Search` 合约开始，看看后续如何发展。\n\
  \n### 搜索合约\n\n你可以通过几种方式进行搜索。你可以编写一个 `Search` 视图和一个过程，并赋予用户在应用数据内搜索的能力。或者，你可以实现 `Search`\
  \ 合约，不仅赋予用户在应用内搜索的能力，还让其他应用也能在你的应用内搜索。\n\n不确定这意味着什么？不要觉得你孤单——合约搜索（search by contract）是一个很新的概念。在第\
  \ 2 章中，你浏览了 Charms 栏以及其中的五个内置磁贴。还记得 `Search` 磁贴吗？这是你作为开发者改变该功能用户工作方式的机会。\n\n`Search`\
  \ 磁贴是感知上下文。如果你在开始屏幕上搜索（如图 9-1 所示），搜索的是应用。如果你在 Internet Explorer 中搜索，搜索的是 Bing。但它比这更有趣。\n\
  \n当我在应用屏幕上搜索“word”时，我得到的是应用屏幕上的结果。\n\n### 在应用内搜索\n\n如果你实现了 `Search` 合约，不仅赋予用户在应用内搜索的能力，还让其他应用也能在你的应用内搜索。\n\
  \n**图 9-1:** 搜索飞出窗口\n![9781118173350-pp031.eps](img/9781118173350-pp031_fmt.png)\n\
  \n要设置基础的 `Search` 合约，请遵循以下步骤：\n\n1. 右键点击项目文件并选择 `New Item`（新建项），向项目添加一个 `Search`\
  \ 合约。\n2. 选择 `Search Contract` 并点击 `Add`（添加）。\n3. 查看 `package.appxmanifest` 文件，确保扩展已添加：\n\
  ```xml\n<Extensions>\n    <Extension Category=\"windows.search\" />\n</Extensions>\n\
  ```\n4. 在 `default.html` 文件中引用搜索代码：\n```html\n<!-- Search references -->\n<link\
  \ href=\"/css/default.css\" rel=\"stylesheet\">\n<script src=\"/js/default.js\"\
  ></script>\n<script src=\"/js/data.js\"></script>\n<script src=\"/js/search.js\"\
  ></script>\n```\n\n接下来，你需要设置 `Search` 过滤器并确保你有一个结果视图。`Search` 过滤器是程序员用来控制允许用户在应用内搜索的内容，与从其他应用搜索的人所看到的内容相比。\n\
  \n最后，创建一个显示结果的视图。\n\n**图 9-2:** 新页面控件\n![9781118173350-pp032.eps](img/9781118173350-pp032_fmt.png)\n\
  \n1. 在 HTML 的 Main Content 部分中添加一个 `ListView`。\n\n\n\n\n\n这是整个列表的格式设置。它使用一次来包含整个列表。\n\
  \n```html\n<div id=\"basicListView\" data-win-control=\"WinJS.UI.ListView\"\n  \
  \  data-win-options=\"{itemDataSource : SearchSample.itemList.dataSource, itemTemplate:\
  \ select(‘# mediumListIconTextTemplate’)}\" style=\"margin-left: 5%; margin-right:\
  \ 5%;\">\n</div>\n```\n\n### 2. 在列表模板上方，添加项目模板。\n\n这是每个项目的格式设置。列表中的每个项目都将显示其中一个模板项。\n\
  \n```html\n<div id=\"mediumListIconTextTemplate\" data-win-control=\"WinJS.Binding.Template\"\
  >\n<div style=\"width: 480px\" data-win-bind=\"innerText: task\" style=\"font-size:\
  \ 18pt\">\n  </div>\n</div>\n```\n\n### 3. 在 `search.js` 的第 28 行附近，调用搜索时将用户引导至 `itemlist.html`\
  \ 页面。\n\n```javascript\nitemInvoked: function (eventObject) {\n    eventObject.detail.itemPromise.then(function\
  \ (item) {\n        // TODO: 导航到被调用的项目。\n        nav.navigate(\"/itemlist.html\"\
  , {item: item.data});\n    });\n},\n```\n\n### 4. 删除 `search.js` 第 24 行周围的示例过滤器。\n\
  \n现在当你运行应用（按 F5）时，打开 Charm 条（Charm bar）。点击搜索 Charm 并输入 Tardis。你将被传送到 `ItemList`\
  \ 并看到专为你展示的那个项目。\n\n你还需要考虑用户从其他应用跳转过来时，他们是如何看到你的结果的。坦率地说，如果你愿意，你可以看到相同的视图，但应用代码和配置中必须包含几个关键部分。\n\
  \n## 将结果返回给其他应用\n\n因此，当用户从另一个应用进行搜索而你的应用未在屏幕上时，你仍然可以返回结果。因为你的应用已通过清单（manifest）同意参与搜索合约（Search\
  \ contract），你可以免费获得某些功能，其中一个就是。\n\n你的应用仍然需要做几件事（这意味着你必须为它们编写代码）。当搜索激活你的应用时，你必须处理\
  \ `Activated` 事件。我知道这很令人惊讶。\n\n在 `default.js` 文件中有一个用于 `app.onactivated` 事件的通用函数。其中有一个对\
  \ `ActivationKind.launch` 的检查，你将添加一个针对 `ActivationKind.search` 的检查。\n\n```javascript\n\
  if (eventObject.detail.kind === Windows.ApplicationModel.Activation.ActivationKind.search)\
  \ {\n    nav.navigate(\"/search.html\", { query : eventObject.queryText });\n}\n\
  ```\n\n嘿，猜怎么着？基本上就是这样。嗯，好吧，你应该做几件事来确保查询是有效的，但只需将数据发送到搜索就可以开始了了。如果你想遵循搜索合约的标准，这里是你做的四件事：\n\
  \n1. 保存应用状态。\n2. 检查应用的视图状态。如果是贴靠（snapped）或全屏（filled）状态，你可能有不同的视图。\n3. 测试 `queryText`\
  \ 是否为空。\n4. 检查 `queryText` 是否与上一次处理的相同。\n\n完成这些操作后，你就可以进行导航了。额外的标准虽然很重要，但对应用的功能并非至关重要。这里涉及到两个标准——让它运行以及遵循\
  \ Windows 8 原则。为了拥有一个真正令人信赖的响应式应用，你应该检查状态和输入的数据。我赞成这样做。\n\n但首先，先让它运行起来。\n\n## 共享合约\n\
  \n使用连接互联网的技术进行的社交互动永远改变了应用程序的编写方式。现在人们期望可以通过电子邮件发送食谱、将高分发布到 Twitter，并从几乎任何类型的应用将图片发布到\
  \ Facebook。\n\n好消息是，大多数社交网络都提供了易于使用的 API 来促进这种共享。毕竟，让人们为他们的网络提供内容符合他们的最大利益。\n\n\
  坏消息是，今天你需要在编写的每个应用程序中重复实现这一功能。对于每个分享到 Twitter 的游戏，你都需要反复编写那个向 Post 端点执行 `PUT` 操作的方法。当\
  \ API 变化时，修复应用就成了你了。\n\n## 喜爱分享\n\n得益于共享 Charm（Sharing charm），Windows 8 应用将不再受不断更改共享代码的苦扰。当用户想要分享新成就或从你的应用中发布最新想法时，他们只需触摸共享\
  \ Charm，即可将活动应用的内容共享到任何声明自己为共享合约的其他应用中。\n\n例如，看看 Windows Store 中的新闻应用。打开应用并点击一个故事。如果你从右侧滑动或按下\
  \ Windows+C，然后点击 Windows Charm，你将获得所有支持共享的应用列表。在 Windows 8 的默认安装中，这只是 Mail 应用。如果你有更多支持共享的应用，你会看到它们，如图\
  \ 9-3 所示。\n\n**图 9-3:** 正在使用的共享 Charm。\n\n![9781118173350-fg0903.tif](img/9781118173350-fg0903_fmt.png)\n\
  \n触摸 Mail 共享图标会弹出一个 Mail 与新闻之间的混合界面（mashup）。由于 Mail 应用声明了可以共享且新闻应用同意提供，Mail 应用可以根据新闻应用获取文本来预填充内容，如图\
  \ 9-4 所示。\n\n**图 9-4:** 邮件！![9781118173350-fg0904.tif](img/9781118173350-fg0904_fmt.png)\n\
  \n## 从你的应用共享\n\n为了实现这一功能，你需要两个东西：\n- 一个提供内容的应用（例如 Contoso）\n- 一个声明自己为共享目标的应用（例如\
  \ Mail）\n\n在接下来的几节中，我们将查看两者。从 Windows 8 客户端提供内容很疯狂。基本上发生了五件事：\n\n1. 你的应用必须向 `DataManager`\
  \ 注册。\n2. 当系统检测到触摸了 Charm 时，它会向你发送 `datatransfer` 事件。\n3. 你的应用填充 `datatransfer`\
  \ 对象。\n4. 系统过滤应用列表。\n5. 应用完成调用并返回用户。\n\n编写这些代码是一个小型练习，特别是当你有简单的内容时。查看以下步骤：\n\n1.\
  \ 获取 `DataManager` 的引用。\n`var dataTransferManager = Windows.ApplicationModel.DataTransfer.DataTransferManager.getForView();`\n\
  2. 为 `datareed` 事件添加监听器。\n`dataTransferManager.addEventListener(\"datareed\", function\
  \ (e) {}`\n3. 在匿名函数中设置标题和文本。\n```javascript\ndataTransferManager.addEventListener(\"\
  datareed\", function (e) {\n    e.request.data.properties.title = “Windows 8 傻瓜编程指南.”;\n\
  \    e.request.data.setText(“我正在读这一章，特别是共享部分。这是我的分享!”);\n});\n```\n4. 将所有内容放在 `processAll`\
  \ 语句之前。`onActivated` 处理程序应该类似于：\n\n```javascript\napp.onactivated = function (eventObject)\
  \ {\n    if (eventObject.detail.kind === Windows.ApplicationModel.Activation.ActivationKind.launch)\
  \ {\n        if (eventObject.detail.previousExecutionState !== Windows.ApplicationModel.Activation.ApplicationExecutionState.terminated)\
  \ {\n            // TODO: 此应用是新启动。\n            // 在处初始化你的应用程序。\n        } else\
  \ {\n            // TODO: 此应用是从挂起恢复激活的。\n            // 在处恢复应用状态。\n        }\n \
  \   }\n};\n```\n\n\n\n\n```javascript\n        e.request.data.setText(“I’m reading\
  \ the chapter on contracts, especially sharing. This is my share example!”);\n \
  \   });\n    WinJS.UI.processAll();\n}\n};\n```\n\n完成这段简短的代码后，你只需按下 F5 即可运行应用程序。我承认，没什么可看的，但按下\
  \ Windows+C 并点击“共享”（Share）小应用，你看到图 9-5。这些值是为用户预设的，正如它们应该的那样。\n\n**图 9-5：** 共享。\n\
  \n![9781118173350-fg0905.tif](img/9781118173350-fg0905_fmt.png)\n\n文本并不是你可以分享的内容。有属性可以处理许多常见格式，你也有即兴发挥的能力。内置格式包括\n\
  \n- ![check.png](img/check.png) 文本\n- ![check.png](img/check.png) 链接\n- ![check.png](img/check.png)\
  \ 图片\n- ![check.png](img/check.png) 文件\n- ![check.png](img/check.png) HTML\n- ![check.png](img/check.png)\
  \ 延迟渲染（即“我不确定它是什么，我稍后告诉你”）\n- ![check.png](img/check.png) 自定义数据\n- ![check.png](img/check.png)\
  \ 错误\n\n从你的应用进行共享并不是吸引用户的关键，但成为一个共享目标（sharing target）可以。你希望人们使用你的应用将内容分享到热门的新社交网络上——那里才是焦点所在。\n\
  \n## 成为共享目标\n\n为了成为一个共享目标，你只需要做两件事：\n\n1. 应用程序必须在它的 `package.appxmanifest` 中注册为共享目标。\n\
  2. 你需要在 `Activated` 事件中处理共享的 `ActivationKind`。\n\n这非常像搜索（Search），而且这是有意设计的。消费这些小应用合约（Charm\
  \ contracts）背后的思想应该非常相似，这些小应用的使用也应该是标准的。\n\n### 设置 appmanifest\n\n为了将应用程序注册为搜索目标，必须更改\
  \ appmanifest。事实上，你可以手动编辑它（它只是 XML），但微软非常贴心地提供了一个易于使用的 UI 来完成此操作，如图 9-6 所示。\n\n\
  **图 9-6：** appxmanifest 编辑器。\n\n![9781118173350-fg0906.tif](img/9781118173350-fg0906_fmt.png)\n\
  \n1. 双击 `package.appxmanifest` 文件打开编辑器。\n2. 点击 `Declarations`（声明）选项卡。\n3. 在可用声明中，选择\
  \ `Share Target`（共享目标，最后一个）。\n4. 在 `Data Formats`（数据格式）下，点击 `Add New`（新增）。\n5. 在这里输入你接受的数据格式。文本是一个很好的选择。\n\
  6. 在 `Supported File Types`（支持的文件类型）下，你可以输入你支持的文件，或勾选 `All Types`（所有类型，这是我做的）。\n\
  7. 点击 `Save`（保存）。大功完成！\n\n这就是 appmanifest。如果你打开代码，就可以看到你所做的更改：\n\n```xml\n<Extensions>\n\
  \    <Extension Category=\"windows.shareTarget\">\n        <ShareTarget>\n     \
  \       <SupportedFileTypes>\n                <SupportsAnyFileType />\n        \
  \    </SupportedFileTypes>\n            <DataFormat>text</DataFormat>\n        </ShareTarget>\n\
  \    </Extension>\n</Extensions>\n```\n\n接下来，是时候处理应用通过共享被激活的情况。\n\n### 处理激活\n\n\
  当有人向你的应用共享内容时，你可以完全打赌你的应用并不会处于激活状态。它有可能被分屏（snapped）或全屏（filled），但我打赌它至少会处于挂起状态。因此，共享操作会激活你的应用。\n\
  \n要处理这一点，你只需要在 `app.activated` 事件处理程序（handler）中添加一个新的 `if` 块。那里已经有一个针对 `launch`\
  \ 的块了，如果你在家里练习的话，可能还有一个针对 `search` 的。现在你需要一个针对 `share` 的。\n\n```javascript\nif (eventObject.detail.kind\
  \ === Windows.ApplicationModel.Activation.ActivationKind.shareTarget) {\n    //\
  \ 在此处施魔术\n}\n```\n\n就这些了。你可以在该设置中做（在合理范围内）任何你想做的事，并处理被发送的内容。这些内容可以通过 `shareOperation`\
  \ 类获取。你可以检查类型并处理内容。例如，这段代码获取了发送的文本并设置了 UI 中 `div` 的内容。\n\n```javascript\nif (shareOperation.data.contains(Windows.ApplicationModel.DataTransfer.StandardFormats.text))\
  \ {\n    shareOperation.data.getText().then(function (text) {\n        if (text\
  \ !== null) {\n            document.getElementById(\"output\").innerText = text;\n\
  \        }\n    });\n}\n```\n\n如果数据是图片，你实际上会执行相同的操作并获取位数据。你可以在 `ShareTarget` 示例中查看许多不同的示例。\n\
  \n### 设置\n\n应用程序设置（如搜索和共享）不应该是用户界面的一部分——它们应该由小应用栏（Charm bar）处理。设置小应用现在用于几乎所有的 Windows。\n\
  \n当点击设置小应用时，它会触发一个浮窗。与其他小应用一样，设置小应用是上下文相关的。幸运的是，设置小应用只需要 HTML 来处理设置。不过，这里调用了 WinRT\
  \ 代码。如图 9-7 所示。\n\n**图 9-7：** 设置小应用。\n\n![9781118173350-fg097.tif](img/9781118173350-fg097_fmt.png)\n\
  \n实现一个简单的设置：\n\n1. 创建一个新的空白 JavaScript 项目。\n2. 右键点击项目并添加 HTML 页面。\n3. 在 HTML 页面中放入以下代码。它使用了\
  \ WinJS `SettingsFlyout`。\n\n```html\n<!doctype HTML>\n<html>\n<head>\n    <title>设置</title>\n\
  </head>\n<body>\n    <div id=\"settingsFlyout\" data-win-control=\"WinJS.SettingsFlyout\"\
  \ aria-label=\"设置浮窗\" data-win-options=\"{width:'wide'}\">\n        <div class=\"\
  win-header\" background-color:#dbf9ff\">\n            <button type=\"button\" onclick=\"\
  WinJS.UI.SettingsFlyout.show()\" class=\"win-backbutton\">返回</button>\n        \
  \    <div class=\"win-label\">设置</div>\n            <img src=\"images/smallTile.png\"\
  \ style=\"position: absolute; right: 40px;\"/>\n        </div>\n        <div class=\"\
  win-content\">\n            这里是设置的地方\n        </div>\n    </div>\n</body>\n</html>\n\
  ```\n\n4. 剩下的部分是连接事件处理程序。\n\n在 DOM 加载后，你只需要在 `WinJS.Application` 类的 `onsettings`\
  \ 事件中编写代码。这段代码位于 `default.js` 文件中 `app.start` 之前。\n\n```javascript\nWinJS.Application.onsettings\
  \ = function (e) {\n    e.detail.applicationcommands = {\n        \"settingsFlyout\"\
  : { href: \"Settings.html\", title: \"设置\"},\n    };\n    WinJS.UI.SettingsFlyout.populateSettings(e);\n\
  }\n```\n\nWinJS 让这一切变得简单。你不需要做很多工作就可以连接好浮窗。不过，这里有 WinRT 代码被 WinJS 对象调用。\n\n你可以在图\
  \ 9-8 中看到最终的结果。\n\n**图 9-8：** 我们的设置浮窗。\n\n![9781118173350-fg098.tif](img/9781118173350-fg098_fmt.png)\n\
  \n## 播放到设备 (Play To)\n\n音频、图片和视频是 Windows 8 应用程序以及通用连接应用的核心部分。在 Windows 8 的世界中，将媒体从一个地方到另一个地方是连接应用理念的核心。视频应该发送到电视，图片发送到手机或数字相框，音频发送到家庭音响。\n\
  \n### 了解 Play To 的要义\n\n\n\n\n\n# `Play To` 合约的核心在于将媒体从一个地方传输到另一个地方。它由 `Devices`\
  \ 魅力程序运行，旨在将媒体从应用程序（例如电影管理器）传输到符合 DLNA（数字生活网络联盟）标准的设备。这类设备的数量比你想象的要多。它基于 `UPnP`（即插即用），这是一个非常常用的协议，可能有\
  \ 10,000 多种不同的产品支持该协议。\n\n![remember.eps](img/remember_fmt.png) 为什么要费心设置 `Play To`？原因有两个。首先，我已经确定了\
  \ `Charm` 栏将是用户查找搜索和设备访问等功能的地方。此外，`Play To` 合约对挂起具有免疫。如果用户选择了一个视频并播放到 DLNA 电视上，然后将你的应用切换到后台，视频将继续播放。在正常情况下，连接会被断开。\n\
  \n## 编写 Play To 示例\n\n实现 `Play To` 的复杂程度并不比我讨论过的其他契约复杂。以下是处理它的最佳方式：\n\n1. 在 Visual\
  \ Studio 中创建一个新的 JavaScript 空模板。将其命名为 `PlayTo`（或下载示例代码）。\n\n2. 双击 `package.appxmanifest`\
  \ 并点击 `Capabilities` 标签页。\n\n3. 在 `Capabilities` 列表中勾选 `Music Library`、`Pictures\
  \ Library Access` 和 `Videos Library Access` 项目，如图 9-9 所示。\n\n**图 9-9:** 添加 Capabilities\
  \ 列表。\n\n![9781118173350-fg0909.tif](img/9781118173350-fg0909_fmt.png)\n\n4. 获取\
  \ `PlayToManager` 的引用并绑定 `source requested` 事件。\n\n以下代码可以为你完成这项工作：\n\n```javascript\n\
  var ptm = Windows.Media.PlayTo.PlayToManager.getForCurrentView();\n\nptm.addEventListener(“sourcerequested”,\
  \ sourceRequestHandler, false);\n\nfunction sourceRequestHandler(e) {\n    try {\n\
  \        var sr = e.sourceRequest;\n        var controller;\n        try {\n   \
  \         controller = mediaElement.msPlayToSource;\n        } catch (ex) {\n  \
  \          id(“messageDiv”).innerHTML += “msPlaytoSource failed: “ + ex.message\
  \ + “<br/>”;\n        }\n        sr.setSource(controller);\n    } catch (ex) {\n\
  \        id(“messageDiv”).innerHTML += “Exception encountered: “ + ex.message +\
  \ “<br/>”;\n    }\n}\n```\n\n5. 你需要一个 `PlayTo` 目标，假设你的工作站没有连接高级的显示器（如果有的话，你可以使用它！）。\n\
  \n我建议先启动媒体播放器（Media Player）。你可以通过按下 Windows 按钮然后点击媒体播放器来实现。你可能需要设置该应用。（默认设置并不算糟糕。）\n\
  \n6. 按 `F5` 运行应用。\n\n7. 点击 `Devices` 魅力程序并体验媒体播放器的功能。\n\n这就是 `Play To`。设置一个程序将媒体发送到设备并改变氛围。\n\
  \n## 从应用到应用的文件选取\n\nWindows 开发中最难改变的哲学观念之一是应用程序的隔离。在 Win32 或 .NET 开发中，应用可以连接数据库、访问文件系统中的（几乎）任何文件，并与\
  \ Windows 服务通信。在 Windows 8 中，情况很少如此。\n\n正如你从搜索和共享等功能中所看到的那样，与 Windows 部分通信是通过合约完成的。目前为止，你看到的最常见的合约是\
  \ `File Picker`（文件选取器）。\n\n`File Picker` 是新的 `CommonDialog`（通用对话框）。如果你足够老，可能记得 .NET\
  \ 甚至 VB6 中的 `CommonDialog`（见图 9-10）。`File Picker` 的工作方式类似，但你需要请求权限查看文件，然后你需要实现 `FileOpenPicker`。\n\
  \n**图 9-10:** 通用对话框。\n\n![9781118173350-fg0910.tif](img/9781118173350-fg0910_fmt.png)\n\
  \n让它运行起来非常简单。在 Visual Studio 中创建一个新项目（或使用现有项目）。文件选取是一个常见的功能，所以你可以将其整合到现有应用中，而没有太大困难。\n\
  \n你需要做的第一件事是为应用可能需要的任何文件访问声明能力（Capabilities）。在图 9-9 中，你可以看到 `Capabilities` 列表：`Music\
  \ Library`、`Pictures Library Access` 和 `Videos Library Access`。\n\n\n\n\n\n图 10-1：网格应用（Grid\
  \ Application）模板。\n\n![9781118173350-fg1001.tif](img/9781118173350-fg1001_fmt.png)\n\
  \n此模板包含三个用户接口文件：\n\n![check.png](img/check.png) `default.html`：位于目录根目录下，它是解决方案片段（fragments）的容器页。（关于片段的更多信息，请参见第\
  \ 4 章。）该页面指向 `body` 标签中加载的第一个片段；查找即可。\n\n```html\n<body data-homePage=\"/html/landingPage.html\"\
  >\n```\n\n![check.png](img/check.png) `landingPage.html`：位于 HTML 目录，是被指向的页面。它是加载到\
  \ `default.html` 中 `contentHost` div 中的第一个内容。它拥有集合集合——集合标题 ABC、集合标题 XYZ 等列表，就是落地页向我们展示的内容。\n\
  \n![check.png](img/check.png) `collectionPage.html`：这是每个集合标题下重复的部分。它负责管理图 10-1 所示的实际网格——图像和文本。如果你查看\
  \ `itemTemplate`，你可以看到基础布局——图像、标题、副标题和描述。\n\n```html\n<div class=\"itemTemplate\"\
  \ data-win-control=\"WinJS.Binding.Template\">\n    <div class=\"largeIconTextTemplate\"\
  >\n        <div class=\"largeIconTextTemplateImage\" data-win-bind=\"style.backgroundColor:\
  \ backgroundColor\"></div>\n        <div class=\"largeIconTextTemplateBackground\"\
  >\n            <div class=\"largeIconTextTemplateLargeText win-itemTextStrong\"\
  \ data-win-bind=\"textContent: title\"></div>\n            <div class=\"largeIconTextTemplateSmallText\
  \ win-itemTextTertiary\" data-win-bind=\"textContent: subtitle\"></div>\n      \
  \      <div class=\"largeIconTextTemplateMediumText win-itemText\" data-win-bind=\"\
  textContent: description\"></div>\n        </div>\n    </div>\n</</div>\n```\n\n\
  如果你点击某项，将进入 `detailPage.html`。这是一个托管在 `default.html` 内部的经典详情页。因此，你拥有包含 `default.html`\
  \ 的 `default.html`，而后者通过 JavaScript 的魔力又包含了 `collectionPage.html`。这种嵌套是 Windows\
  \ 风格应用布局的核心，请仔细考虑它。\n\n### 访问数据\n\n模板中 JavaScript 文件的命名标准非常出色——文件名相同且易于查找。`collectionPage`\
  \ 包含内容并调用此模板中的数据方法。打开该页面并向下滚动查看数据。在页面末尾，你可以看到 `getGroups` 和 `getItems` 只是在手动填充数组。这些都在\
  \ JavaScript 块的最后处理。记住，它只是一个大函数，所以按顺序处理：\n\n```javascript\nvar pageData = {};\n\
  pageData.groups = getGroups();\npageData.items = getItems();\nWinJS.Namespace.define('collectionPage',\
  \ {\n    fragmentLoad: fragmentLoad,\n    itemInvoked: itemInvoked\n});\n```\n\n\
  那么如何在这里获取新数据呢？替换 `getGroups` 方法中的代码。我在本章稍后的“与 Internet 通信”部分中为你提供了一些建议，但首先请先看模板中的另一个主要布局。\n\
  \n### 网格应用模板的适用场景\n\n并不是所有布局都适用于所有类型的数据。显然，网格布局最适合带有重要图片的项目：产品目录、运动队和酒店列表。对于可能没有图片的内容，列表格式可能更好。坦率地说，你可以转向列表布局。\n\
  \n### 列表布局\n\n列表布局顾名其义：它是一个为描述性列表设计的项目列表，可以引导到详尽的详情视图。有两个主要区别：它位于一个页面上，而且列表格式更适合没有图片的项目。图\
  \ 10-2 显示了启动页，在 `default.html` 文件的 `body` 标签中标记。它实际上是所选分类的 ListView 。如果你点击返回箭头，将返回分类页面。\n\
  \n### 分析文件\n\n与网格应用模板一样，此模板使用了我在第 4 章中解释的通用片段模型。因此，它包含一个包含导航等内容的主页面，以及用于内容的独立页面。主页面是\
  \ `default.html`，片段位于 `html` 文件夹。\n\n图 10-2：列表布局。\n\n![9781118173350-fg1002.tif](img/9781118173350-fg1002_fmt.png)\n\
  \n![check.png](img/check.png) `splitPage.html` 是应用程序启动的页面。它显示一个分类的项目以及右侧的详情。\n\n\
  ![check.png](img/check.png) `categoryPage.html` 通过 `splitPage` 的返回按钮访问。这是分类的网格视图，这些分类在网格应用模板中只是列表。\n\
  \n老实，我不认为默认列表布局是 UI 的最佳实现。在我运行这个示例的前十次左右，我都没有发现分类在哪里。返回按钮显然在那里，但它并不明显（至少对我来说）起什么作用的。不过，这并不重要。关键在于数据\
  \ `win-options` 参数中的 `layout` 字段。对于网格，使用 layout `{type: WinJS.UI.GridLayout}`。对于列表，你使用\
  \ layout `{type: WinJS.UI.ListLayout}`。\n\n### 访问数据\n\n使用 `ListLayout` 作为模板的列表模板与使用\
  \ `GridLayout` 的模板的数据访问点相同。你将在 `splitPage.js` 文件中找到数据。如果你是从服务获取原始数据（正如我在本章稍后的“与\
  \ Internet 通信”部分中所讨论的那样），你需要替换 `getGroups` 和 `getItems` 方法内部的代码。微软在 `dev.microsoft.com`\
  \ 的官方示例中使用数组，但我使用 JSON。\n\n\n\n\n\n![check.png](img/check.png) 格式：在信息到达你之后，你需要能够处理数据进入的格式。不过，数据格式并不是你最需要的问题。从\
  \ RSS 到 ATOM，从 JSON 到 XML，无论是什么格式，都有工具可以处理。这是你可以在学习过程中尝试的内容。现在，去获取一些数据吧。\n\n## 原始的\
  \ XMLHttpRequest\n\n为了从 Web 服务器获取信息到脚本源，JavaScript（以及许多其他语言）实现了一个 HTTP `Request`\
  \ 方法。这本质上是一个封装在所选语言语义中的 `GET` 请求，利用了图 10-3 所示 HTTP 协议的相对简单性。\n\n**图 10-3:** HTTP\
  \ 进程。\n\n![9781118173350-fg1003.eps](img/9781118173350-fg1003_fmt.png)\n\n如果你理解网络浏览器是如何工作的，你就理解\
  \ `XMLHttpRequest` 是如何工作的。基本上，它就像在浏览器的地址栏中输入 URL 一样，只不过结果返回给了脚本。\n\n但脚本部分是关键——这就是\
  \ jQuery 和通用的 AJAX 如何成名的原因。请求结果（HTML、XML 或 JSON）被返回给脚本，用于解析并插入到脚本选择的 DOM 任何位置。这就是整个\
  \ Web 2.0 运转起来的方式。\n\n对于 Windows 8 风格的应用程序，一切都没有变化。数据就在那里，你需要获取它。`XMLHttpRequest`\
  \ 就是这条路——至少在 JavaScript 语言中是。它以某种格式获取数据（无论如何，你有解析器），然后你可以根据需要将其插入应用程序中。\n\n唯一的问题是时机。Windows\
  \ Store 风格指南规定，任何超过 50 毫秒的事务都应该是异步的。显然，网络调用超过了 50 毫秒——你最近尝试过加载 YouTube 吗？无论如何，必须做些什么。\n\
  \n你可能可以使用 JavaScript 中的回调机制来完成这一切。或者，你可以直接使用微软 Windows 8 工具团队热心提供的 XHR 库。\n\n##\
  \ XHR：微软的小秘密\n\nXHR 是微软在 WinJS 库中创建的许多玩具中的第一个。我在第 2 章介绍的 WinJS 是一组 JavaScript 方法和\
  \ CSS 样式，帮助我们以 Windows Store 的风格进行操作。还记得那个“超过 50 毫秒的操作必须是异步的”的规则吗？XHR 就是为此设计的。\n\
  \n`WinJS.xhr` 的工作方式非常像 `XmlHttpRequest`，因为它不仅仅是基于 `XmlHttpRequest`，它实际上调用了 `XmlHttpRequest`。它带来的是异步操作，我稍后会详细介绍。现在，请查看\
  \ `XHR` 方法的参数：\n\n![check.png](img/check.png) 方法：该方法可以指定调用类型。正如你预期的——常见的 HTTP 类型。在\
  \ `REST` 驱动的环境中，你可以使用那些不常用的整洁类型：\n\n• `GET`\n• `HEAD`\n• `POST`\n• `DELETE`\n• `PUT`\n\
  • `TRACE`\n• `CONNECT`\n\n![check.png](img/check.png) URL：URL 是唯一必须的特征。记住，它在查询字符串中带有参数。\n\
  \n![check.png](img/check.png) 用户和密码：这些用于身份验证。请仅在在使用 SSL（安全套字层）时才使用这些项。\n\n![check.png](img/check.png)\
  \ 请求头：Headers 是可选字段，直接传递给 `XMLHttpRequest.setRequestHeader()` 方法。\n\n![check.png](img/check.png)\
  \ 数据：Data 是直接发送给 `XMLHttpRequest.send()` 方法的参数。你可以查看该文档（Mozilla 网站上的文档非常棒，遗憾的是比微软的更好——[`https://developer.mozilla.org`](https://developer.mozilla.org/)））。它用于发布不在\
  \ URL 中的数据，例如二进制数据等。\n\n现代版本的 `XmlHttpRequest` 有一个 `onreadystatechange` 事件处理器，它接受一个回调方法作为属性。这允许线程继续执行，并在对象返回值时调用处理程序。\n\
  \n`WinJS.xhr` 基本上将这四个元素——`instance`、`open`、`onready statechange` 和 `send`——封装成一个返回\
  \ promise（期程）对象的方法。你可以在 XHR 的源代码中看到它。\n\n```javascript\nfunction (c, e, p) {\n \
  \   req = new XMLHttpRequest();\n    req.onreadystatechange = function () {\n  \
  \      if (req.readyState === 4) {\n            if (req.status >= 200 && req.status\
  \ < 300) {\n                c(req);\n            } else {\n                e(req);\n\
  \            }\n        }\n    };\n    req.open(type, url, async);\n    req.setRequestHeader(header,\
  \ value);\n    req.send(data);\n}\n```\n（注：提示中提供的源代码是片段化的，为了清晰起见，已根据描述的逻辑将其重构为标准块。）\n\
  \n\n\n\n例如，如果你需要发送一个请求来购买物品并获取该物品的详情，你可以这样做：\n\n```javascript\nWinJS.xhr(\"http://www.sempf.net/order/1234/\"\
  )\n  .then(function(result) { WinJS.xhr(\"http://www.sempf.net/item/\" + result\
  \ + \"/\")})\n  .then(function(result) {return doSomething(result)});\n```\n\n这种方法的效果是从订单\
  \ `1234` 中获取值（假设这是一个通过编号获取订单的服务），在它返回后，将结果传递给另一个服务，该服务随后在物品搜索中查找结果。在它返回后，会调用某个最终方法。\n\
  \n注意，我跳过了错误处理和进度报告。这样做是为了简单起见，并为了指出它们是可选的。\n\n# 处理数据\n\n在你拥有了用户界面模型和数据访问模型之后，是时候编写一个使用外部数据的程序了。在这个例示例中，我使用了\
  \ Flickr，因为我相当确定在你读到这段文字时，它仍然存在。\n\nFlickr 有一个公共数据馈，非常适合这个应用程序，因为它包含了一些图像的元数据（如标题之类），以及图像本身。这非常适合\
  \ Grid Application 模板，因为每个项目都有图像，并且没有分类列表。\n\n## 准备工作\n\n设置 Grid Application 模板：\n\
  \n1. 在 Visual Studio 中，点击 `File`（文件）⇒`New Project`（新建项目）。\n2. 选择 Grid App 模板并将项目命名为\
  \ `FlickrViewr`（或你喜欢的任何名称）。\n3. 点击 `OK`。Visual Studio 会为你创建项目。\n4. 你不会使用 `groupedItemsPage`。在\
  \ `default.html` 中，将 `data-win-options` 字段中的 `contenthost` `div` 修改为 `groupDetailPage.html`。\n\
  \n```html\n<div id=\"contenthost\" data-win-control=\"FlickrViewr.PageControlNavigator\"\
  \ data-win-options=\"{home: '/html/groupDetailPage.html'}\"></div>\n```\n\n5. 删除\
  \ `groupedItems.html`、`groupedItems.css` 和 `groupedItems.js` 文件。取决于你的 Visual Studio\
  \ 安装设置，你可能需要点击解决方案资源管理器中的 `Show All`（显示所有）才能看到这些文件。你不需要它们，为什么要搞乱解决方案呢？\n6. 在 `groupDetailPage.html`\
  \ 中，找到类为 `titlearea` 的 `H1` 并将其替换为某些静态文本，如下：\n\n```html\n<h1 class=\"titlearea win-type-ellipsis\"\
  >\n    Flickr Public Feed\n</header>\n```\n\n7. 找到原来更新页头的代码并将其注释掉。它在 `groupDetailPage.js`\
  \ 中：\n\n```javascript\nelement.querySelector(\"header[role=banner] .pagetitle\"\
  ).textContent = group.title;\n```\n\n好了，这样就足够了。现在你只需要把数据加载进去。\n\n# 调用数据馈\n\n到此时，所有示例数据都在\
  \ `js` 文件夹下的 `data.js` 中。你将把从该文件中数组获取数据的调用，替换为从 Flickr API 获取数据的调用。\n\n### Flickr\
  \ 数据馈\n\n首先，查看 Flickr 数据馈以看看里面有什么。启动该过程的 URL 是：\n\n`http://api.flickr.com/services/feeds/photos_public.gne`\n\
  \n为了获取 ATOM 格式以外的内容，你需要使用 `format` 参数。因此，在浏览器中输入此：\n\n你将得到一些 JSON，看起来如下：\n\n```json\n\
  jsonFlickrFeed({\n    \"title\":\"Uploads from everyone\",\n    \"link\":\"http://www.flickr.com/photos/\"\
  ,\n    \"description\":\"\",\n    \"modified\":\"2012-03-07T04:50:49Z\",\n    \"\
  generator\":\"http://www.flickr.com/\",\n    \"items\":[\n        {\n          \
  \  \"title\":\"IMG_6401\",\n            \"link\":\"http://www.flickr.com/photos/jumpstartweb/6814740920/\"\
  ,\n            \"media\":{\n                \"m\":\"http://farm8.staticflickr.com/7052/6814740920_4521f82eb3_m.jpg\"\
  \n            },\n            \"date_taken\":\"2011-12-10T12:25:50-08:00\",\n  \
  \          \"description\": <p><a href=\"http://www.flickr.com/people/jumpstartweb/\"\
  >JumpWeb</a> posted a photo: <p><a href=\"http://www.flickr.com/photos/jumpstartweb/6814740920/\"\
  ><img src=\"http://farm8.staticflickr.com/7052/6814740920_4521f82eb3_m.jpg\" width=\"\
  240\" height=\"160\" alt=\"IMG_6401\" /></a></p>\",\n            \"published\":\"\
  2012-03-07T04:50:49Z\",\n            \"author\":\"nobody@flickr.com (JumpWeb)\"\
  ,\n            \"author_id\":\"6372446@N06\",\n            \"tags\":\"\"\n     \
  \   }\n    ]\n})\n```\n\n该 JSON 是你可以使用的一些数据。\n\n\n\n\n\n“Repeater（重复器）模板是一个框，内部为白色，黑色为黑色。它的宽度应该是屏幕允许的最大宽度，任何文本位于底部——且文本为黑色。将任何项目垂直堆叠。”\n\
  \n项目示例如下：\n\n“Item（项目）模板是一个框，比其容器小一点。边框为黑色，主体为浅灰色。任何文本都应该居中且为黑色。”\n\n**图 10-4：**\
  \ 使用模板进行数据绑定。\n\n![9781118173350-fg1004.eps](img/9781118173350-fg1004_fmt.png)\n\
  \n在包含列表的 HTML 文件中，分别定义这些每一个项，以便在需要时替换 `Repeater` 模板内部 `Item` 模板的外观。\n\n### Repeater\
  \ 模板\n\n以模板文本为例。`Repeater` 模板位于页面底部：一个带有 `aria-label` “Main Content”的 `section`\
  \ 标签。`Aria-label` 是 HTML5 中的一个全局属性。它用于为项目提供一个在屏幕上不显示的、可识别的名称。\n\n```html\n<section\
  \ aria-label=”Main content” role=”main\">\n    <div class=”grouplist” aria-label=”List\
  \ of this group’s items” data-win-control=”WinJS.UI.ListView” data-win-options=\"\
  { selectionMode: ‘none’ }\"></div>\n</section>\n```\n\nsection 标签内部的 `div` 有几个 HTML5\
  \ 中不存在的属性——它们是 WinJS 特有的。这些属性是 `data-win-control` 和 `data-win-options`。\n\n`Data-win-control`\
  \ 定义了 `div` 以何种控件的形式出现。WinJS 带有许多控件，它们都针对 Windows 8 UI 进行了专门样式设计。它们并不重复器。以下是 WinJS\
  \ 自带控件的部分列表：\n\n![check.png](img/check.png) `AppBar`：显示命令。\n\n![check.png](img/check.png)\
  \ `DatePicker`：允许用户选择日期。\n\n![check.png](img/check.png) `FlipView`：一次显示项目集合中的一个。\n\
  \n![check.png](img/check.png) `Flyout`：显示需要用户交互的消息。（与对话框不同，`flyout` 不创建单独窗口。）\n\n\
  ![check.png](img/check.png) `ListView`：以网格或列表布局显示项目集合。\n\n![check.png](img/check.png)\
  \ `HtmlControl`：显示 HTML 页面。\n\n![check.png](img/check.png) `Menu`：用于显示命令的菜单弹出层。\n\
  \n![check.png](img/check.png) `Page` 控件：一组描述 true HTML、JavaScript 和 CSS。你可以导航到 `Page`\
  \ 控件或像使用自定义控件一样使用它。\n\n![check.png](img/check.png) `Rating`：允许用户对项目进行评分。\n\n![check.png](img/check.png)\
  \ `SemanticZoom`：允许用户在两个子控件提供的两个不同视图之间缩放。一个子控件提供缩小后的视图，另一个提供放大后的视图。\n\n![check.png](img/check.png)\
  \ `SettingsFlyout`：为用户提供快速、上下文相关的应用设置访问。\n\n![check.png](img/check.png) `TimePicker`：允许用户选择时间。\n\
  \n![check.png](img/check.png) `ToggleSwitch`：开启或关闭项目。\n\n![check.png](img/check.png)\
  \ `Tooltip`：显示支持富内容（如图像和格式化文本）的提示框，以显示有关对象的更多信息。\n\n![check.png](img/check.png)\
  \ `ViewBox`：将单个子元素扩展以填充可用空间而不调整其大小。该控件对容器的大小以及子元素的大小变化做出响应。例如，如果媒体查询导致纵横比变化，此控件将做出响应。\n\
  \n另一个 WinJS 特有的属性是 `data-win-options` 属性。这是你告诉控件关于你希望它如何处理数据的细节。控件对象的属性与你在 JavaScript\
  \ 中可以设置的相同。\n\n![tip.eps](img/tip_fmt.png) 决定是在 HTML 中还是 JavaScript 中设置属性是一个判断。通常情况下，如果我认为我可能需要用我的\
  \ JavaScript 代码在运行时更改它，我就在 JavaScript 中设置它。如果是设计时就固定的内容，我就在 HTML 中设置它。\n\n### Item\
  \ 模板\n\n在重复器文本上方是 `Item` 模板，它包含了你想重复的内容 HTML。根据重复器的设置，你可以以不同的方式组织项目，并使用 HTML 按照你想要的方式显示它们：\n\
  \n```html\n<!-- 这些模板用于显示下方声明的 ListView 中的每个项 -->\n<div class=”headerTemplate” data-win-control=”WinJS.Binding.Template\"\
  >\n    <h2 class=”group-subtitle” data-win-control=\"\"></h2>\n    <img class=”group-image”>\n\
  \    <h4 class=”group-description”</h4>\n</div>\n<div class=”itemTemplate” data-win-control=”WinJS.Binding.Template\"\
  >\n    <img class=”item-image”>\n    <div class=”item-info\">\n        <h4 class=”item-title”</h4>\n\
  \        <h6 class=”item-subtitle”</h4>\n        <h4 class=”item-description”</h4>\n\
  \    </div>\n</div>\n```\n*（注：上面的代码块已根据提供的文本结构进行了清理，以在保留原始内容和属性的同时确保 HTML 格式有效。）*\n\
  \n\n\n\n简而言之，Windows Store 应用的运行方式类似于手机应用，而不是 Windows 7 或 Web 程序。在 Windows 世界中，应用会一直运行，直到用户停止它们。在\
  \ Web 世界中，应用在用户请求某些内容时运行，然后会立即忘记用户曾经存在过。\n\nWindows Store 应用介于两者之间。只要它们是可见的，它们就拥有状态，然后它们可能会丢失与操作系统的状态，也可能不会。它们就像编程世界中的“薛尔谔的猫”（你知道的，检查它的这一行为决定了它的存在性）。\n\
  \n尽管如此，你必须随时做好准备，因为操作系统可能会忘记你的应用。用户有权查看其他东西，当这种情况发生时，你的应用大约只有五秒钟的寿命。除非你想让用户每次都必须经过启动过程，否则你必须能够处理应用状态的变化。\n\
  \n正如你预期的那样，微软提供了实现这一点的工具。这些工具用起来很复杂，除非你对 `PLM` 内部机制的了解超过了本该要求的程度。由于如此，我将比通常更深入地探讨进程生命周期的“原因”。\n\
  \n## 处理应用挂起\n\nWindows 8 的体验应该是快速且流畅的，就此而言，用户应该能够随时切换应用。这完全合逻辑。\n\n在实践中的问题是，用户最终会发现设备上的几乎每个应用都处于运行状态。这对于电池寿命或保持设备长时间可用性并不有利。\n\
  \n不是说得太委婉，但微软通过将应用的生命周期从用户和开发者的手中夺回，解决了这个问题。现在，由 Windows 决定应用何时允许运行。以下是应用可以运行的时间列表：\n\
  \n- ![check.png](img/check.png) 当应用以全屏、贴靠或填充视图在屏幕上时\n- ![check.png](img/check.png)\
  \ 当应用正在播放音乐（某种意义上）\n- ![check.png](img/check.png) 当应用正在移动文件\n\n就这些了。除了这些时间之外，你的应用可能没有任何操作系统的任何资源。\n\
  \n然而，也有好消息。某些事件会告诉我们应用何时失去焦点、何时被挂起，以及用户何时恢复使用该应用。此外，这些事件运行非常快且效果良好。你只需要知道如何正确地使用它们。\n\
  \n## 切换任务\n\n处理生命周期的深度源于用户切换应用。在触控环境中，用户通过从左向右滑动来切换应用。现在试一下，除非你是在平板电脑上读这本书，如果是那样，你应该听我的没错。\n\
  \n现在，当应用在屏幕上时（无论是全屏、填充还是贴靠视图），它被认为正处于运行状态。这是你的应用在执行任务时的正常状态。一旦你向一滑动并在屏幕上调出另一个应用，你的应用实际上就进入了挂起状态。在图\
  \ 11-1 中，应用 2 刚刚获得焦点，而应用 3 刚刚被放入挂起。\n\n**图 11-1：** 挂起状态的应用。\n![97811173350-fg1101.eps](img/97811173350-fg1101_fmt.png)\n\
  \n总之，挂起并不是一个糟糕的处境。多程度上，挂起的应用对操作系统的访问很少或没有，因为它们都集中在运行的应用上。这意味着不活跃的应用无法工作，但也不会消耗电池或减慢运行应用。\n\
  \n你可以通过查看任务管理器来观察 Windows 8 如何处理挂起。要进入任务管理器：\n\n1. 回到桌面。\n2. 右键点击状态栏。\n3. 选择任务管理器。\n\
  4. 离开你的应用。\n\n在五秒钟左右，它应该会显示为已挂起，任务管理器看起来应该像图 11-2。挂起不那么理想的一点是，你有五秒钟（正负不等）的时间在应用可能被终止之前进行“清理”。终止意味着\
  \ Windows 已经决定关闭应用——就像是说再见，恢复意味着你必须重新开始。\n\n**图 11-2：** Windows 8 任务管理器。\n![97811173350-fg1102.tif](img/97811173350-fg1102_fmt.png)\n\
  \n应用不会收到它们即将终止的通知。虽然有一个挂起事件，但你最好做好准备。即使应用因为挂起以外的其他原因终止，你也会得到五秒钟的警告。其他导致终止的因素包括：\n\
  \n- ![check.png](img/check.png) 系统面临内存压力\n- ![check.png](img/check.png) 用户注销\n-\
  \ ![check.png](img/check.png) 用户强制关闭应用\n- ![check.png](img/check.png) 系统关机\n- ![check.png](img/check.png)\
  \ 发生崩溃\n- ![check.png](img/check.png) 操作系统想要终止\n\n每当用户离开你的应用时，你都需要处理两件事：为恢复做准备的挂起信息，以及以防终止的清理工作。你需要在五秒内完成这些操作。然后，你需要让应用准备好随时从任何一种状态回来。\n\
  \n## 处理挂起和终止\n\n通过 `activated` 和 `checkpoint` 事件，微软让我们 JavaScript 世界能够非常简单地处理挂起和终止，以及恢复（我在本章节的“注册恢复事件”部分讨论）。\n\
  \n为了理解我的意思，打开 Visual Studio 并创建一个空白项目。在屏幕底部，`checkpoint` 事件中的注释写道：\n\n```\nTODO：\
  \ 应用即将挂起。在此保存任何跨挂起的状态。你可能使用 Application.sessionState 对象，它是跨挂起保存并恢复的。如果你需要在应用挂起前完成异步操作，调用\
  \ args.setPromise().\n```\n\n好了，就这些了。章节结束了吗？不，说真的：你确实需要在那里放入处理挂起的代码，并且你可能需要 `sessionState`\
  \ 和 `setPromise`。我会介绍如何使用这两个工具，以及里面需要什么。\n\n## checkpoint 处理中需要的内容\n\n当 `checkpoint`\
  \ 事件触发时，你的应用在五秒钟内失去任何网络、显示或处理器访问。这意味着当你的应用仍然活着时，它处于挂起状态（这就是术语的来源）。\n\n`checkpoint`\
  \ 处理程序让你有机会：\n\n- ![check.png](img/check.png) 确保应用像从未挂起过一样恢复\n- ![check.png](img/check.png)\
  \ 如果应用被终止，做好重新开始准备\n- ![check.png](img/check.png) 友好地释放你正在使用的任何资源\n\n所以，你想保存的东西（从编程角度来看）是：\n\
  \n- ![check.png](img/check.png) 任何编辑过的数据，如文档或消息\n- ![check.png](img/check.png) 当前页面或应用位置\n\
  - ![check.png](img/check.png) 用户暂停音乐、游戏或视频的地方\n- ![check.png](img/check.png) 购物车中的物品\n\
  - ![check.png](img/check.png) 选中项目，如人员或文件\n- ![check.png](img/check.png) 修改过的设置或偏好\n\
  - ![check.png](img/check.png) 最近从服务获取的信息\n\n你把这些东西保存在哪里？当应用挂起时，你可以将其保存在内存中。当它被终止时，内存存储会消失，你需要更具持久性的东西。你可能有一个服务在备份你的应用；如果没有，你应该使用\
  \ `sessionState`。\n\n\n\n\n`sessionState` 是一个 WinJS 类，当应用程序在终止后启动时它会被填充。如果设备被重启，或者\
  \ Windows 因为内存压力停止了应用，就可以使用 `sessionState`。\n\n要在 `sessionState` 中存储内容，你可以在 JavaScript\
  \ 中创建一个新对象，用你的设置填充它，然后将其放入 `sessionState`。以下是我的 `oncheckpoint` 句程序的写法：\n\n```javascript\n\
  app.oncheckpoint = function (args) {\n    var currentState = new Object();\n   \
  \ currentState.page = 'videoPlayer.htm';\n    currentState.video = 'MySummerVacation.wmv';\n\
  \    currentState.secondsWatched = 385;\n    app.sessionState.stateObject = currentState;\n\
  };\n```\n\n![tip.eps](img/tip_fmt.png) 在 Windows Store 应用中存储持久化数据有很多方法，但 SQL Server\
  \ 数据库并不是其中之一。要了解更多关于 Windows 8 数据存储的知识，请查看第 12 章。\n\n## 使用 setPromise\n\n`sessionState`\
  \ 对于持久化数据来说非常棒，但如果你有某些操作在停止时会导致应用程序出错，例如向你的后端服务发送 `XHR` 调用，该怎么办？\n\n为了确保在 promise\
  \ 返回之前 `oncheckpoint` 不会被调用，你可以使用 `setPromise`。这告诉 Windows 8，在 promise 履行或超时之前之前，`suspend`\
  \ 操作无法完成。\n\n```javascript\napp.oncheckpoint = function (args) {\n    var currentState\
  \ = new Object();\n    currentState.page = 'videoPlayer.htm';\n    currentState.video\
  \ = 'MySummerVacation.wmv';\n    currentState.secondsWatched = 385;\n    app.sessionState.stateObject\
  \ = currentState;\n    args.setPromise(\n        WinJS.xhr(\n            {url: myBackendService,\
  \ data: myDataObject}\n        )\n    );\n};\n```\n\n## 注册恢复事件\n\n在你将所有内容安全地存储后，你可以放心即使应用程序被终止，用户也会获得良好的体验，对吧？嗯，不完全是。接下来你需要加载所有的应用程序数据和设置备份。\n\
  \n这有趣吗？不。有必要吗？是的。\n\n不过，我不认同这里的推荐做法。看一眼 `app.onactivated` 事件的模板代码：\n\n```javascript\n\
  app.onactivated = function (args) {\n    if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n        if (args.detail.previousExecutionState !== activation.ApplicationExecutionState.terminated)\
  \ {\n            // TODO: 此应用程序已新启动。\n            // 在此处初始化你的应用程序。\n        } else\
  \ {\n            // TODO: 此应用程序已从挂起重新激活。\n            // 在此处恢复应用程序状态。\n        }\n\
  \        args.setPromise(WinJS.UI.processAll());\n    }\n};\n```\n\n如果应用被启动，你会查看之前的状态是否被终止。如果没有被终止，你应该初始化应用。那么只有在应用被终止时你才应该恢复状态。我觉得这有点愚蠢。在我的应用中，我会检查应用是否被挂起，然后刷新我可能拥有的任何过期数据。否则，如果\
  \ `sessionState` 已填充，我就从那里刷新。这样，无论应用是如何停止的都紧。只要数据可用，我总能获取它们。\n\n```javascript\n\
  app.onactivated = function (args) {\n    if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n        if (args.detail.previousExecutionState === activation.ApplicationExecutionState.suspended)\
  \ {\n            // 刷新来自服务或状态之类的任何数据\n        } else {\n            if (args.setPromise)\
  \ {\n                var currentState = new Object();\n                currentState\
  \ = args.setPromise.stateObject;\n                // 从状态中重新填充\n            } else\
  \ {\n                // 首次运行\n            }\n        }\n    } else {\n        args.setPromise(WinJS.UI.processAll());\n\
  \    }\n};\n```\n\n### 让你的应用看起来是有活力的\n\n现在你的应用根据 Windows 的心意而激活或消失。这一事实上改变了你规划用户交互的方式。坦率地说，有一些指南可以帮助你。\n\
  \n最重要的一点是，确保用户在切换到应用程序时，感觉它仍在运行。大部分工作是在挂起时保存适当的数据，并在恢复时带回正确的内容。其他技巧也有帮助——例如在应用未运行时运行某些任务，并更新磁贴。\n\
  \n简而言之，目标是让 Windows 8 看起来更像……Windows 7。确保当用户按下 `Alt+Tab` 时，一切都符合预期。应用程序让用户停留在他们预期的地方。数据没有消失。一切都好。\n\
  \n## 处理应用程序启动\n\n在“注册恢复事件”部分中，我讨论了从挂起恢复应用程序，但实际上你有多个选项可以考虑。从 `onactivated` 事件处理程序的参数返回的两个属性将对你有帮助：`kind`\
  \ 和 `previousExecutionState`。\n\n`kind` 参数告诉你是什么启动了你的应用。Windows 8 为你提供了多种启动方式，你的应用可能需要根据启动方式做出不同的响应。事实上，`ActivationKind`\
  \ 枚举器中有 12 个值，如果你愿意，可以单独处理每一个分值（尽管你可能不需要这样做）：\n\n-   `launch`: 某种默认情况。这是当用户正常启动应用程序时。\n\
  -   `search`: 通过另一个应用程序的搜索激活。\n-   `shareTarget`: 通过另一个应用程序的共享激活。\n-   `file`: 另一个应用启动了该应用注册处理的文件。\n\
  -   `protocol`: 另一个应用启动了你的应用注册处理的 URI（如网页地址）。\n-   `fileOpenPicker`: 用户选择了一个该应用注册的文件。\n\
  -   `fileSavePicker`: 用户将文件保存到了你的应用程序。\n-   `cachedFileUpdater`: 当你的应用为用户更新的文件提供内容管理时使用。\n\
  -   `contactPicker`: 用户选择联系人时激活。\n-   `device`: 如果你的应用注册了自动播放使用。\n-   `printTaskSettings`:\
  \ 如果你的应用注册为打印目标使用。\n-   `cameraSettings`: 如果你的应用注册用于从相机拍摄照片，且相机被激活使用。\n\n`previousExecutionState`\
  \ 参数告诉我们应用程序在被激活之前最后一次在做什么。这是在激活后要检查的第二个内容，紧随 `ActivationKind` 之后。\n\n-   `NotRunning`:\
  \ 首次安装或重启后激活。从头启动应用。\n-   `Running`: 搜索合约或类似操作在应用运行时已激活了它。只需处理激活事件。\n-   `Suspended`:\
  \ 合约在应用挂起时激活了它。再次，只需处理激活事件。所有内容都存储在内存中。\n\n\n\n\n\n![check.png](img/check.png) `Terminated`：Windows\
  \ 终止应用后激活。这是你使用保存的会话数据时。\n\n![check.png](img/check.png) `ClosedByUser`：用户主动关闭了应用。像\
  \ `NotRunning` 一样重启即可。\n\n这些状态中最重要的是 `Terminated`，因为你每次都必须优雅地从该状态恢复。记住，用户并不知道应用可能被关闭过！\n\
  \n## 在挂起后执行某些操作\n\n默认情况下，应用在挂起后被允许执行几项操作。这些是 Windows 赋予的（grandfathered in）任务。它们包括播放音频和移动文件。\n\
  \n### 播放音频\n\n听播客并切换到 Visual Studio 处理一些工作，是程序员经常做的事情之一。即使在最严苛的移动平台上，也可以播放背景音频。\n\
  \nWindows 8 也不无例外。只要你声明了该能力并对代码库进行一些调整，Windows 就会让你的应用在应该挂起时保持存活并播放音频。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 当这五秒过去后，应用真的挂起了吗？我的测试结果定的。音频线程继续运行，但操作系统的其他功能不可用。例如，你无法调用服务。网络电台有效用吗？我把这个测试留给读者作为练习。文档指出：“如果你的应用除了流式音频或视频外还执行其他任务，当应用失去焦点且不再是活动窗口时，你的应用应该停止执行非媒体相关的工作。”但我诚实地说，这并不清楚。\n\
  \n要让背景音频工作，请采取以下步骤：\n\n1. 更新程序包清单。在图 11-3 中，你可以看到 `package.appxmanifest` 中需要勾选的\
  \ `Audio` 复选框。只需从 `Available Declarations` 下拉列表中选择 `Background Tasks` 项目，然后勾选 `Audio`\
  \ 复选框。\n\n`Entry Point` 或 `Start Page` 字段必须有一个填充了内容。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你可以对视频执行同样的操作。WinRT 没有视频项目，但如果你设置了 `Audio` 类型，视频也能正常工作。虽然当你切换回应用时，它恢复得并不很好（至少在\
  \ Release Preview 版本中），但它可以运行。\n\n2. 在 HTML 文件中使用 HTML5 音频标签来实现音频。为 `audio` 标签添加\
  \ `msAudioCategory` 标签，并将其设置为 `BackgroundCapableMedia`。\n\n```html\n<audio msAudioCategory=\"\
  BackgroundCapableMedia\">\n    <source src=\"/audio/sample.mp3\"/>\n</audio>\n```\n\
  \n**图 11-3：** 在清单中声明音频。\n\n![9781118173350-fg1103.tif](img/9781118173350-fg1103_fmt.png)\n\
  \n3. 在 JavaScript 文件中，注册媒体传输控制。幸运的是，这比起来要简单。先在 `ready` 事件中创建一个 `Windows.Media.MediaControl`\
  \ 实例。\n\n```javascript\nready: function (element, options) {\n    var media = Windows.Media.MediaControl;\n\
  \    media.addEventListener('playpausetogglepressed', playswitch, false);\n},\n\
  ```\n\n之后，你只需要添加那个 `playswitch` 函数：\n\n```javascript\nfunction playswitch() {\n\
  \    if(mediaControls.isPlaying === true) {\n        document.getElementById('audiotag').pause();\n\
  \    } else {\n        document.getElementById('audiotag').play();\n    }\n}\n```\n\
  \n就这些了。Windows 8 和 WinJS 会处理其他所有事情。\n\n### 移动文件\n\n当你通过 Alt+Tab 离开应用时，另一个可能需要继续的操作是文件下载。它的处理方式与音频类似。当你使用\
  \ `BackgroundTransfer` 类集合时，你实际上是将传输传输的责任交给了 Windows。即使你的应用被挂起，文件传输也会继续。\n\n要连接起后台传输，你需要两个主要的活动：一个新文件和一个\
  \ `BackgroundDownloader`。你可以使用 `Windows.Storage` 命名空间中的 `createFileAsync` 方法创建一个新文件，然后在回调中设置后台下载器。如下所示：\n\
  \n```javascript\ntry {\n    Windows.Storage.KnownFolders.musicLibrary.createFileAsync(\n\
  \        'sample.mp3',\n        Windows.Storage.CreationCollisionOption.generateUniqueName\n\
  \    ).done(function (file) {\n        var uri = Windows.Foundation.Uri('http://ia600609.us.archive.org/16/items/tpalmieri2012-06-30.akg481-sbd.flac16/tpalmieri2012-06-30t15.mp3');\n\
  \        var downloader = new Windows.Networking.BackgroundTransfer.BackgroundDownloader();\n\
  \        // 创建一个新的下载操作。\n        download = downloader.createDownload(uri, file);\n\
  \        // 开始下载并持久 promise 以便取消。\n        promise = download.startAsync();\n  \
  \  });\n} catch (err) {\n    console.log(err);\n}\n```\n\n我只是从 Internet Archive\
  \ 抓了一个文件作为示例，当然，任何文件都可以。这里的诀窍不在于当应用被终止时下载会继续，而是 ![check.png](img/check.png) 下载在应用挂起后会继续。如果应用被终止，操作系统会保存它停止的位置。\n\
  \n如果你的应用中有后台下载，在应用恢复时需要检查 `getCurrentDownloads` 集合。要这样做，在你设置的 `resume` 事件中添加代码，“注册\
  \ resume”：\n\n```javascript\nvar downloader = Windows.Networking.BackgroundTransfer.BackgroundDownloader;\n\
  downloader.getCurrentDownloads().done(function (downloads) {\n    for (var i = 0;\
  \ i < downloads.size; i++) {\n        // 根据应用情况处理下载\n    }\n});\n```\n\n### 运行后台任务\n\
  \n除了预设的任务外，你也可以创建自己的任务。这并不简单，但你不需要每次都：\n\n1. 在清单中将应用程序注册为后台任务提供者。图 1-4 显示了这些声明 ——\
  \ 它与注册音频类似。\n\n**图 1-4：** 声明后台任务。\n\n![9781118173350-fg1104.tif](img/9781118173350-fg1104_fmt.png)\n\
  \n2. 构建后台任务。只需在项目中创建一个文件并将 JavaScript 代码封装在后台任务处理程序中。微软提供了一些效果良好的模板。这里有一个计算质数的任务示例：\n\
  \n```javascript\n(function () {\n    \"use strict\";\n    var backgroundTaskInstance\
  \ = Windows.UI.BackgroundTaskInstance.current, cancel = false;\n    function onCanceled(cancelSender,\
  \ cancelReason) {\n        cancel = true;\n    }\n    backgroundTaskInstance.addEventListener(\"\
  canceled\", onCanceled);\n    function doWork() {\n        var key = null, settings\
  \ = Windows.Storage.ApplicationData.current.localSettings, primeHolder = \"\";\n\
  \        // 这里是我们的代码执行实际工作的地方\n        for (number = 1; number <= 1000; number++)\
  \ {\n            primeFlag = true;\n            maxTest = number / 2;\n        \
  \    if ((number != 2) && ((number % 2) == 0)) {\n                primeFlag = false;\n\
  \            }\n            Test = 3;\n            while ((Test <= maxTest) && (primeFlag\
  \ == true)) {\n                if ((number % Test) == 0) {\n                   \
  \ primeFlag = false;\n                }\n                Test = Test + 2;\n    \
  \        }\n            if (primeFlag == true) {\n                primeHolder =\
  \ primeHolder + number + \" \";\n            }\n        }\n        // 现在我们只做一些清理工作\n\
  \        key = backgroundTaskInstance.task.taskId.toString();\n        settings.values[key]\
  \ = \"Succeeded\";\n        // 完成后务必调用 close\n        close();\n    }\n    if (!cancel)\
  \ {\n```\n\n\n\n\n```javascript\n    doWork();\n} else {\n    // 让应用知道我们已取消\n  \
  \  key = backgroundTaskInstance.task.taskId.toString();\n    settings.values[key]\
  \ = “Canceled”;\n    // 完成后始终调用 close\n    close();\n}\n})();\n```\n\n首先准备一个 `Cancel`\
  \ 事件监听器，然后设置实际包含工作代码的 `doWork` 函数。后台任务在完成后必须调用 `close`。\n\n3. 最后，通过在 `default.js`\
  \ 页面中添加一些代码来注册你的后台任务。`Windows.ApplicationModel.Background.BackgroundTaskBuilder`\
  \ 有一个名为 `taskEntryPoint` 的属性，它期望一个对象名称，但幸运的是，如果你传递一个 JavaScript 文件名，也可以运行。\n\n```javascript\n\
  var builder = new Windows.ApplicationModel.Background.BackgroundTaskBuilder();\n\
  var trigger = new Windows.ApplicationModel.Background.SystemTrigger(Windows.ApplicationModel.Background.SystemTriggerType.timeZoneChange,\
  \ false);\nbuilder.name = “Busily calculating primes.”;\nbuilder.taskEntryPoint\
  \ = “js\\\\background.js\\\";\nbuilder.setTrigger(trigger);\nbuilder.addCondition(new\
  \ Windows.ApplicationModel.Background.SystemCondition(Windows.ApplicationModel.Background.SystemConditionType.userPresent));\n\
  var task = builder.register();\n```\n\n在基础层面，就是这些了。良好的后台任务会优雅地处理 `completed` 事件，但那里有许多选项。我建议你在\
  \ `dev.windows.com` 上搜索“Create and register a background task”关键词以找到快速上手指南，并查看步骤列表中的第\
  \ 3 步，以了解 `completed` 支持的所有操作。\n\n## 使用实时磁贴 (live tiles)\n\n你的应用磁贴是另一个可以让你应用即使在未运行时也看起来生动的工具。你可以注册一个云服务（在\
  \ Azure 或其他地方），在 Windows 有空闲时更新磁贴信息，而不仅仅是在应用运行时才更新。\n\n第 8 章详细介绍了如何让你的磁贴更加生动。它是整个\
  \ Windows 8 体验的重要组成部分。\n\n## 第 12 章\n\n## 保持本地存储\n\n### 本章内容\n\n* 存储设置\n* 利用 SQLite\n\
  * 在文件系统中存储内容\n\n从系统架构的角度来看，Windows 8 平台最有趣的点之一是，你无法执行微软产品多年来最擅长的事情——连接到 SQL Server。\n\
  \n你没有听错。因为 Windows Store 应用的套接字层级连接能力受到了严重限制，你无法连接到外部数据库。这意味着在 80 年代由 Visual Basic\
  \ 极力培养的标准的“表单驱动数据”（forms-over-data）编程方法已经……呃……已经死于一旦形了。\n\n什么正在取代它？所有数据都应该通过服务来提供。市面上大多数糟糕程序之所以糟糕，是因为应用程序开发者可以直接访问数据库。在那种可能的情况下，人们很容易做出错误的选择。\n\
  \n现在，这已不再可行，至少对于 Windows Store 应用是如此。如果你想构建一个使用真实数据的应用——例如企业报告应用或类似程序——你必须从某些服务层获取数据。\n\
  \n尽管如此，三个重要的数据源是允许的且不应被忽略：\n\n* 本地数据库（例如简单的文本文件和可部署的关系型数据库）\n* 设置\n* 文件系统\n\n这些解决方案并不适合大型数据集，所以请不要尝试。它们确实非常适合在本地存储信息。远程数据源仍然需要服务层，但某些内容放在本地更好。\n\
  \n## 将设置放在易于获取的地方\n\n在普通应用程序中，大量与应用直接相关的数据被用于存储用户设置。自定义内容、会话信息、用户做出的选择以及其他面向用户的数据通常被隐藏在关系型数据存储的表中，而那里本就不该是它们所在地。（它们实际上应该放在某些本地设置格式中。）\n\
  \n在 Windows Store 应用领域，存储设置有比旧 `.ini` 文件更好的选择。事实上，这拥有一套完整的基础设施，甚至还有在机器之间共享设置的功能。\n\
  \n### 组织本地设置\n\n`Windows.Storage` 命名空间有几个工具帮助管理 Windows 8 中的设置。其中主要的是 `localSettings`\
  \ 类，它是一个简单的持有对象，具有某些由 Windows 为你处理的特定状态特性。\n\n不过，要用用 `localSettings` 是很容易的。在最基础的情况下，它只是数据输入，数据输出。\n\
  \n```javascript\nvar settings = Windows.Storage.ApplicationData.current.localSettings;\n\
  // 写入设置\nsettings.values[\"theAnswer\"] = 42;\n\n// 读取设置\nvar Setting = settings.values[\"\
  theAnswer”];\n\n// 删除设置\nsettings.values.remove(“theAnswer”);\n```\n\n\n\n\n\n它们看起来完全一样。看看我所做的第一个简单示例：\n\
  \n```javascript\nvar settings = Windows.Storage.ApplicationData.current.localSettings;\n\
  //写入一个设置\nsettings.values[\"theAnswer\"] = 42;\n//读取一个设置\nvar thatSetting = settings.values[\"\
  theAnswer\"];\n```\n\n这些数据是安全存储的，但我仍然建议你不要在其中存储任何真正的隐私信息。用户希望知道他们的数据去向了哪里。\n\n##\
  \ 使用 ApplicationDataContainer 保留更多内容\n\n虽然可以在 `localSettings` 的单个值中存储内容，但将它们组织成不同的“桶”（buckets）可能会更好，尤其是当你有很多此类设置时。`localSettings`\
  \ 类允许为此类实例创建 `ApplicationDataContainers`。\n\n你为什么要这样做呢？例如，用户可能需要为某次应用程序会话存储大量的临时设置。使用\
  \ `ApplicationDataContainer`，可以轻松地将它们都保留在一个地方，并在完成后删除整个容器。\n\n实现此类功能看起来与上面的设置非常相似，只不过我需要对容器进行一些初始化操作。然后我就可以几乎像使用\
  \ `localSettings` 示例一样使用它了：\n\n1. 向项目中添加另一个 JavaScript 文件。我将其命名为 `tempSettings.js`。当然，你不需要仅将其用于临时设置；我只是在遵循我之前使用的示例。\n\
  2. 创建一个 `Init` 函数，它执行两件事：\n    - 使用 `createContainer` 和 `ApplicationDataCreateComposition`\
  \ 值设置容器，以便该函数始终替换该集合。\n    - 初始化所有的值。\n3. 添加一个删除容器的函数。\n4. 添加所有的 setter（设置器）和 getter（获取器），就像\
  \ `settings.js` 文件一样。\n5. 记得将该文件添加到你的命名空间中，并添加所有的公共 Getters 和 Setters 以及 `init`\
  \ 和 `deleteContainer` 函数。\n\n最终产品看起来如下：\n\n```javascript\n(function () {\n    'use\
  \ strict';\n    var settings = Windows.Storage.ApplicationData.current.localSettings;\n\
  \    var isUp, isDown, isBackward;\n    var directionsContainer;\n    function init()\
  \ {\n        //初始化容器\n        directionsContainer = localSettings.createContainer(\"\
  directions\", Windows.Storage.ApplicationDataCreateDisposition.Always);\n      \
  \  directionsContainer.values['isUp'] = false;\n        directionsContainer.values['isDown']\
  \ = false;\n        directionsContainer.values['isBackward'] = false;\n    }\n \
  \   function deleteContainer(){\n        settings.deleteContainer(\"directions\"\
  );\n    }\n    var getIsUp = function () {\n        if (!isUp) {\n            if\
  \ (settings.containers.hasKey(\"directions\")) {\n                isUp = directionsContainer.values['isUp'];\n\
  \            }\n        }\n        return isUp;\n    }\n    var setIsUp = function\
  \ (newValue) {\n        if (isUp != newValue) {\n            isUp = newValue;\n\
  \            if (settings.containers.hasKey(\"directions\")) {\n               \
  \ directionsContainer.values['isUp'] = isUp;\n            }\n        }\n    }\n\
  \    var getIsDown = function () {\n        if (!isDown) {\n            if (settings.containers.hasKey(\"\
  directions\")) {\n                isDown = directionsContainer.values['isDown'];\n\
  \            }\n        }\n        return isDown;\n    }\n    var setIsDown = function\
  \ (newValue) {\n        if (isDown != newValue) {\n            isDown = newValue;\n\
  \            if (settings.containers.hasKey(\"directions\")) {\n               \
  \ directionsContainer.values['isDown'] = isDown;\n            }\n        }\n   \
  \ }\n    var getIsBackward = function () {\n        if (!isBackward) {\n       \
  \     if (settings.containers.hasKey(\"directions\")) {\n                isBackward\
  \ = directionsContainer.values['isBackward'];\n            }\n        }\n      \
  \  return isBackward;\n    }\n    var setIsBackward = function (newValue) {\n  \
  \      if (isBackward != newValue) {\n            isBackward = newValue;\n     \
  \       if (settings.containers.hasKey(\"directions\")) {\n                directionsContainer.values['isBackward']\
  \ = isBackward;\n            }\n        }\n    }\n    WinJS.Namespace.defineWithParent(MyApp,\
  \ 'TempSettings', {\n        init: init,\n        deleteContainer: deleteContainer,\n\
  \        getIsUp: getIsUp,\n        setIsUp: setIsUp,\n        getIsDown: getIsDown,\n\
  \        setIsDown: setIsDown,\n        getIsBackward: getIsBackward,\n        setIsBackward:\
  \ setIsBackward\n    });\n});\n```\n\n在这里，我尝试在 `tempSettings` 类中捕获所有可能的情况。这使得开发者在在使用设置之前不需要检查容器是否存在。\n\
  \n说到使用设置，你将在本章稍后的“通过 Settings 装饰组件赋予用户访问权限”部分中执行此操作。\n\n## 在文件中保留设置\n\n当然，在文件系统中保留带有设置的\
  \ JavaScript 数据数组是完全可能且允许的，只需对其进行读取和写入即可。关于在 WinRT 中使用文件系统你需要了解的所有知识，在本章稍后标题为“为以后存档”的章节中。\n\
  \n## 通过 Settings 装饰组件赋予用户访问权限\n\n如果没有用户可以编辑值的功能，那么有一个整洁的设置类是有点没用的。幸运的是，WinJS 允许通过\
  \ `SettingsFlyout` 实现这一点。这个类为你实现了 Settings 装饰组件的功能：\n\n1. 向项目中添加一个文件夹。如果你有一个较大的项目，可能需要这个。\n\
  2. 添加一个设置页面。右键点击页面并选择“新建项”，从弹出的框中选择页面。我将其命名为 `Settings`。\n3. 在主页上放置三个开关。为了这一点，你使用\
  \ `SettingsFlyout` 控件。它看起来如下：\n\n```html\n<body\n    <div id=\"settings\" data-control=\"\
  WinJS.UI.SettingsFlyout\" aria-label=\"Settings flyout\" data-options='{\"width\"\
  : \"wide\"}'>\n        <div class=\"win-header\">\n            <button type=\"button\"\
  \ onclick=\"WinJS.UI.SettingsFlyout.show()\" class=\"win-back\"></button>\n    \
  \        <div class=\"win-label\">Settings</div>\n        </div>\n        <div class=\"\
  win-content\">\n            <div id=\"settingsDiv\">\n                <div id=\"\
  isUpToggle\" data-control=\"WinJS.UI.ToggleSwitch\" data-options='{\"title\": \"\
  Is Up\", \"labelOn\": \"Yup\", \"labelOff\": \"Nope\"}'></div>\n               \
  \ <div id=\"isDownToggle\" data-control=\"WinJS.UI.ToggleSwitch\" data-options='{\"\
  title\": \"Is Down\", \"labelOn\": \"Yup\", \"labelOff\": \"Nope\"}'></div>\n  \
  \              <div id=\"isBackwardToggle\" data-control=\"WinJS.UI.ToggleSwitch\"\
  \ data-options='{\"title\": \"Is Backward\", \"labelOn\": \"Yup\", \"labelOff\"\
  : \"Nope\"}'></div>\n            </div>\n        </div>\n    </div>\n</body>\n```\n\
  \n4. 修改 JS 文件中的 `ready` 事件处理程序以填充开关并设置事件处理程序。\n\n```javascript\nready: function\
  \ (element, options) {\n    var isUpToggle = document.getElementById('isUpToggle');\n\
  \    isUpToggle.checked = MyApp.TempSettings.getIsUp();\n    isUpToggle.addEventListener('onClick',\
  \ function () {\n        MyApp.TempSettings.setIsUp(isUpToggle.checked);\n    });\n\
  \    var isDownToggle = document.getElementById('isDownToggle');\n    isDownToggle.checked\
  \ = MyApp.TempSettings.getIsDown();\n    isDownToggle.addEventListener('onClick',\
  \ function () {\n        MyApp.TempSettings.setIsDown(isDownToggle.checked);\n \
  \   });\n    var isBackwardToggle = document.getElementById('isBackwardToggle');\n\
  \    isBackwardToggle.checked = MyApp.TempSettings.getIsBackward();\n}\n```\n\n\n\
  \n\n\n```javascript\nisBackwardToggle.addEventListener('onClick’, function () {\n\
  \    MyApp.TempSettings.setIsBackward(isBackwardToggle.checked);\n});\n},\n```\n\
  \n### 5. 在 `default.js` 中添加 `onsettings` 事件处理器\n\n这会将页面连接到 Charms 栏并设置默认值。\n\n```javascript\n\
  WinJS.Application.onsettings = function (e) {\n    e.detail.applicationcommands\
  \ = {\n        “settings”: { title: “Settings”, href: “/pages/settings.html” },\n\
  \    };\n    WinJS.UI.SettingsFlyout.populateSettings(e);\n};\n```\n\n### 测试设置\n\
  \n当该功能运行正常后，运行应用并按下 `Windows+C` 调出 Charms 栏，然后点击“设置”。设置栏会出现，在那里你可以点击“设置”链接，你可以在\
  \ `default.js` 文件中将其命名为任何内容。点击该链接，你将看到图 12-1。\n\n**图 12-1:** 允许用户访问设置。\n\n![9781118173350-fg1201.tif](img/9781118173350-fg1201_fmt.png)\n\
  \n你可以在此处添加任意数量的飞轮（Windows 8 版本的对话框）——只需通过 `WinJS` 中的 `applicationcommands` 对象将它们连接起来。记住，在\
  \ Windows Store 中使用 Charms 栏不是可选的。测试过程会检查这一点！\n\n# 将文件存以便以后使用\n\n有时你需要存储设置之外的更多内容。有时用户正在创建内容，你需要将这些内容保存到他们的本地机器上，甚至到网络上。\n\
  \n这时文件系统类派上用场。WinRT 并不是真正由文件系统驱动的 API；它更多地受端口 80 和 443 通信以及调用 Web 服务驱动。尽管如此，仍然有文件访问，你有能力将用户创建的数据存储为文件。\n\
  \n### 使用文件系统\n\n以 `POINTtodo` 为例，当你读到这里时，这个任务列表应该已经在 Windows Store 上了。它需要在某处保存一份活动任务列表。可以使用设置，也可以构建一个远程服务并将其存储在\
  \ Azure 上。然而，对于任务列表这样的内容，将数据保留在文件中是最明智的做法。\n\n要使用文件内部管理数据，你需要几样东西：\n\n- ![check.png](img/check.png)\
  \ 一些数据：JavaScript 数组是一个很好的选择。可以使用 `JSON` 命名空间进行序列化并存储为文本。\n- ![check.png](img/check.png)\
  \ 一种将该序列化数组保存到文件的方法：此代码放入 `oncheckpoint` 事件处理器。\n- ![check.png](img/check.png) 一种获取文件并填充数组的方法：这放在\
  \ `onactivated` 事件处理器中。\n- ![tip.eps](img/tip_fmt.png) 现在，这里有各种生命周期的考虑，但我会在第 11\
  \ 章中涵盖所有这些。现在，保持时间线简单，专注于使用文件即可。\n\n## 设置一些数据\n\n当然，在任何系统中你都可以让用户从空数组开始，并从那里开始填充。这样做，你只需用一个空集启动系统即可。\n\
  \n```javascript\nvar todayArray = [];\n```\n\n这在某些应用程序中是合理的，但我认为像 `POINTtodo` 这样的应用应该有一些初始数据。为此，我创建了一组默认的初始数据，其中包含一些有趣的示例任务。\n\
  \n```javascript\nvar todayArray = [\n    {\n        task: “带着满满的爱和关怀封锁舱门”,\n   \
  \     complete: false,\n    },\n    {\n        task: “记住阿拉拉莫亚山战役”,\n        complete:\
  \ false,\n    },\n    {\n        task: “喝啤酒”,\n        complete: false,\n    }\n\
  ];\n```\n\n这足够引导用户开始了，当然，当他们使用应用时，可以将这些标记为完成并添加他们自己的数据。JSON 格式非常适合这种应用，因为有 `JSON`\
  \ 命名空间，它提供了简单的 `parse()` 和 `stringify()` 函数，为我们序列化和反序列化数据，无需大量精力。XML 也可以，但我更喜欢 JSON。\n\
  \n## 写入文件\n\n现在你有了一些内容。为了将其写入文件，你需要执行几个步骤：\n\n1.  在 `package.appx` 文件中声明 `Document`\
  \ 能力。在 Visual Studio 中打开该文件并点击 `Capabilities` 选项卡，然后选择 `Document Access` 复选框。![tip.eps](img/tip_fmt.png)\
  \ 注意 `Capabilities` 选项卡现在有一个带有 `X` 的红色圆圈形式通知。如果你将鼠标悬停在上面，可以看到它正指示我们将文件类型与应用关联。\n\
  2.  切换到 `Declarations` 选项卡，选择 `File Type Associations` 并点击 `Add`。你会在表单主体收到另一个通知，相同的悬停操作同样有效。\n\
  3.  如图 12-2 所示填写声明。只需将将使用的扩展名添加到 `Name` 和 `File Type` 字段中。![remember.eps](img/remember_fmt.png)\
  \ 保留了一些扩展名列表，所以你不能使用它们。它们包括：`Account-ms`、`Appx`、`application-ms`、`Bat`、`Cer`、`Cmd`、`Common`、`crt`、`dll`、`exe`、`fon`、`gadget`、`Hta`、`Inf`、`Ins`、`jse`、`lnk`、`Msi`、`Msp`、`oc`、`ocx`、`Reg`、`Sc`、`Sc`、`Sh`、`Shb`、`Sch`、`Sct`、`Sce`、`Sel`、`Ser`、`Src`、`Set`、`Sys`、`ttf`、`txt`、`url`、`Vbe`、`Vbs`、`Vcd`、`Vld`、`Vsd`、`Vf`、`Wce`、`Wsc`、`Wsf`、`Wsh`、`Wxt`。**图\
  \ 12-2:** 设置声明。\n![9781118173350-fg1202.tif](img/9781118173350-fg1202_fmt.png)\n\
  \n4.  在 `default.js` 中声明一个文件的变量。\n```javascript\nvar tasksFile;\n```\n5.  在 `oncheckpoint`\
  \ 事件中，将数组保存到文件。为了这样做，你需要确保文件存在或者创建一个它（我每次都创建一个）。使用 `writeTextAsync`：\n\n```javascript\n\
  app.oncheckpoint = function (args) {\n    Windows.Storage.KnownFolders.documentsLibrary.createFileAsync(“POINTtodo.tasks”,\n\
  \    Windows.Storage.CollisionOption.replaceExisting).done(function (file) {\n \
  \       tasksFile = file;\n    });\n    Windows.Storage.FileIO.writeTextAsync(tasksFile,\
  \ JSON.stringify(todayArray)).done();\n};\n```\n\n## 读取文件\n\n现在文件已经在磁盘上了（或者在挂起时会在），你需要在应用激活时通过读取获取它。在\
  \ `onappactivate` 事件中，从磁盘读取文件并使用 `readTextAsync` 填充数组。\n\n```javascript\napp.onactivated\
  \ = function (args) {\n    if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n        if (args.detail.previousExecutionState !== activation.ApplicationExecutionState.terminated)\
  \ {\n            Windows.Storage.FileIO.readTextAsync(sampleFile).then(function\
  \ (contents) {\n                todayArray = JSON.parse(contents)\n            });\n\
  \        }\n        args.setPromise(WinJS.UI.processAll());\n    }\n};\n```\n\n\
  `Windows.Storage` API 让这一切变得非常简单。你只需要记住文件操作都是异步的，并且在使用它们时需要用 `then` 或 `done` 处理返回值。\n\
  \n## 文件选择器合约\n\n有时你想给用户保存和加载自己的文件的机会。在 WinRT 中，你通过 `Windows.Storage.Pickers` 类来实现。它的工作方式类似于\
  \ .NET 的 `CommonDialog`，但界面更华丽。\n\n为了让用户选择要打开的文件，在你的项目中创建一个新的页面控件。（我把它命名为 filepicker。）尝试以下步骤：\n\
  \n1.  在 `filepicker.html` 文件中添加一个打开选择器的按钮。\n\n\n\n\n2. 在 `ready` 事件处理程序中，为按钮添加一个\
  \ `click` 事件处理程序：\n\n```javascript\nready: function (element, options) {\n    document.getElementById(\"\
  pickfile\").addEventListener(\"click\", selectTaskFile, false);\n},\n```\n\n3. 编写一个使用\
  \ `FileOpenPicker` 选择文件的函数。\n\n```javascript\nfunction selectTaskFile() {\n    var\
  \ openPicker = new Windows.Storage.Pickers.FileOpenPicker();\n    openPicker.viewMode\
  \ = Windows.Storage.Pickers.PickerViewMode.thumbnail;\n    openPicker.suggestedStartLocation\
  \ = Windows.Storage.Pickers.PickerLocationId.documentsLibrary;\n    openPicker.fileTypeFilter.replaceAll([\"\
  .tasks\"]]);\n    openPicker.pickSingleFileAsync().then(function (file) {\n    \
  \    //Do something\n    });\n}\n```\n\n在 `package.appxmanifest` 文件中将默认启动页改为 `filepicker.html`，然后按\
  \ `F5` 运行应用程序。当你点击按钮时，你会看到如如图 12-3 所示的新文件选择器（File Picker）。\n\n**图 12-3：** 使用 File\
  \ Picker 选择文件。\n\n![9781118173350-fg1203.tif](img/9781118173350-fg1203_fmt.png)\n\
  \n你可以使用 File Picker 对打开和保存进行许多更多操作，但关于这些信息，请参阅 `http://msdn.microsoft.com/en-US/windows`。只需搜索\
  \ `Windows.Storage` 即可。\n\n### 利用可部署数据库\n\n有时，设置或文件并不满足需求。有时，你需要本地关系型数据库。遗憾的是，Windows\
  \ 8 并没有提供内置的此类工具。使用本地数据并不是它的强项。\n\n不过，有办法解决。以 `JSON` 或 `XML` 格式存储的文本数据库可以保存为文件，你可能可以在你的部署中包含一两个开源数据库。（我不确定，只是随口一说。）\n\
  \n## 提供一些关系型能力\n\n你可能需要为应用程序部署一个更大、更有结构化的关系型数据库，就像你以前使用 `Microsoft Access` 和 `JET`\
  \ 提供程序的那样。在 Windows 8 中没有内置的方法可以实现这一点 —— 这本身不是其目标。微软希望我们使用服务，但那并不总是最优的。\n\n另一个选项是开源的\
  \ `SQLite` 数据库。嗯，还有其他选项，但 `SQLite` 是最好的。它提供了最好的功能集并拥有良好的社区支持。\n\n## 获取 SQLite\n\n\
  根据文档，`SQLite` 是一个实现了自包含、无服务器、零配置、事务型 SQL 数据库引擎的软件库。它基本上是一个用 `C++` 编写的 Windows `DLL`（动态链接库），你可以将其直接包含在应用程序中。它为你处理数据库文件的实现细节。\n\
  \n要获取 `SQLite`，请前往其下载页面 `www.sqlite.org/download.html` 获取适用于你的 Windows 版本（32 位或\
  \ 64 位）的工具。然后注册并包含到应用程序中。\n\n然而，`SQLite` 并不是普通的数据库。它没有管理界面，没有 GUI。它不作为服务运行。一切都在代码中完成。从创建新的数据库文件到删除行，都通过你应用程序中的代码完成。\n\
  \n## 为 WinRT 封装 SQLite\n\n`SQLite` 是一个 `COM DLL`；它并不是为 Windows Store 风格的 `WinMD`\
  \ 格式设计的。出于这个原因，获取二进制文件并包含它是不可通的。Jan Nedoma 和其他一些数据社区成员整合了一个封装当前 `SQLite` 组件的 `WinRT`\
  \ 组件。\n\n尽管在编写本文时，它还没有针对 Windows 8 的最终发布版本进行更新。因此，你必须从 `Bitbucket` 获取源代码并自行编译。别担心，这并不复杂：\n\
  \n1. 进入 `https://bitbucket.org/MnemonicWME/sqlitemetro/wiki/Home` 并下载 `SQLiteMetro`\
  \ 的源代码。\n2. 解压项目并在 `Visual Studio` 中打开解决方案文件。\n3. 右键点击项目，从出现的菜单中选择 `Properties`（属性）。\n\
  4. 选择 `Configuration`（配置）并将平台更改为 `x64`，如图 12-4 所示。\n\n**图 12-4：** 在 SQLiteMetro\
  \ 中设置平台。\n\n![9781118173350-fg1204.tif](img/9781118173350-fg1204_fmt.png)\n\n5.\
  \ 在 `Project Properties`（项目属性）中，将 `Project Output` 更改为 `WinMD`。\n6. 将项目添加到你的解决方案并从那里引用它。\n\
  \n此后你就可以继续了。到这里，我将你参考 codeplex 网站 `http://sqlwinrt.codeplex.com` 获取示例并入门。它应该能帮你开始构建本地数据库。\n\
  \n![tip.eps](img/tip_fmt.png) 这里有一些最新信息：检查 `sqlite.org` 上的 `SQLite` 仓库是否有新的 Windows\
  \ 8 版本。微软显然正在与他们合作，这可能就是为什么 `SQLiteMetro` 的开发没有以前那么活跃。\n\n## 使用 HTML5 数据库选项\n\n\
  Windows Store 应用支持 `Indexed Database API`，这是 Web 浏览器的 W3C 标准，在很大程度上取代了 Web SQL。如果你喜欢阅读标准文档，可以在\
  \ `www.w3.org/TR/webviewdb/` 查看（注意：原文中的链接文本已失效，已修正为标准链接）。\n\n### 第四部分：准备发布\n\n![9781118173350-pp401.eps](img/9781118173350-pp401.png)\n\
  \n在本部分中……\n\n你有了用户界面，你的程序可以运行了。太棒了！现在是时候考虑一些你可能还没有想过的事情了。尝试一下设备的一些传感器怎么样？你考虑过在应用中投放广告或提供应用内购买吗？将你应用程序的一些信息存储在\
  \ `Microsoft Azure` 中又又如何？在考虑了所有这些之后，也许你已经准备好测试并发布了。\n\n# 第 13 章：与硬件集成\n\n## 本章\n\
  \n* 使用设备上的传感器\n* 收集上下文信息\n* 给用户提供反馈\n\nWinRT 了一件从 .NET 框架很难实现的事情：它让我们访问设备。摄像头、麦克风、传感器、近场通信以及触摸屏本身从\
  \ `.NET` 很难访问，但在 `WinRT` 中非常简单。\n\n\n\n如今，几乎所有运行 Windows 的设备都带有麦克风和摄像头。台式电脑的显示器现在也配备了这些设备。创建视频和音频媒体已经是\
  \ Windows 的预期功能，但与其他操作系统相比，这仍然相当困难。\n\n部分原因是因为访问摄像头所需的 API 相当晦涩。在 `WM_CAP_DLG_VIDEOSOURCE`\
  \ 中那个非常出色的视频源对话框，由于某种原因，并不是所有人都知道或在使用的。\n\nWinRT 通过 `Media APIs` 改变了这一点。现在，通过 `C#`\
  \ 或 `JavaScript` 访问摄像头等设备变得容易得多——你不再需要使用 `C++` 或依赖第三方来获取视频源。\n\n在此基础上，WinJS 充分利用了\
  \ HTML5 媒体工具，以最小的复杂程度将视频带到用户界面。得益于 WinJS HTML5 渲染器，拍照、录视频或创建音频流几乎都可以由你处理好。\n\n##\
  \ Windows.Media API\n\n`Windows.Media` API 是一个命名空间集合，它将之前令人困惑的 `vfw.dll` 库封装成了一个良好的面向对象的包。该库的功能被均匀地分为媒体捕获和随后的管理。\n\
  \n### 媒体捕获\n\n该命名空间中最实用的类可能是 `Capture`。Windows 8 中所有用于选择设备的 UI 可以在这里找到，例如 `CameraCaptureUI`。该类是媒体\
  \ API 的超简化版本，具有单行代码拍照的能力：\n\n```\nvar cameraCapture = new Windows.Media.Capture.CameraCaptureUI();\n\
  cameraCapture.captureFileAsync(\n    Windows.Media.Capture.CameraCaptureUIMode.photo).then(\n\
  \      process(item), error(err));\n```\n\n操作仅于此，但你无法获得很多选项。\n\n该 API 也有更详细、更细粒度的功能。捕获媒体通常依赖于选择设备，`Windows.Media.Devices`\
  \ 命名空间可以为此为你提供帮助。例如，`MediaDevice` 类有一个 `getVideoChapterSelector` 类，它可以获取主机机器上所选视频录制设备的\
  \ ID。这可以与 `MediaCapture` 类配合使用，对摄像头进行更详细的控制。\n\n本章稍后部分的“从你的应用访问摄像头”章节提供了使用捕获 API\
  \ 的良好初始案例研究。\n\n### 编码与管理\n\n从设备获取媒体是一回事，但使其对你的应用有用是另一回事。`Windows.Media` 命名空间中有一系列精选工具，以多种不同的方式协助视频和音频文件的编码、转码和转换。\n\
  \nWinRT 中的编码基于 Windows 7 中引入的 Microsoft Media Foundation。它在编码方面为你完成三项主要工作：\n\n-\
  \ ![check.png](img/check.png) 获取视频或音频流并转换为格式化文件——例如，将视频编码为 `MP4`。\n- ![check.png](img/check.png)\
  \ 将两个流编码到单个文件中——例如，将音频流和视频流合并为一个流。\n- ![check.png](img/check.png) 获取已编码的、复用的流并将其保存为文件。\n\
  \n所有这些媒体魔法的核心类是 `Windows.Media.Transcoding.MediaTranscoder`。`MediaTranscoder` 有一个\
  \ `prepare FileTranscodeAsynch` 函数，它接受一个配置（profile）并异步创建输出文件。配置包含了要执行的编码信息。\n\n\
  例如，这就是 `MediaTranscoder` 可能创建 MP4 视频的方式：\n\n```\nvar transcoder = new Windows.Media.Transcoding.MediaTranscoder();\n\
  var profile = Windows.Media.MediaProperties.MediaEncodingProfile.createMp4(\n  \
  \  Windows.Media.MediaProperties.VideoEncodingQuality.hd1080p);\nreturn transcoder.prepareFileTranscodeAsync(sourceFile,\
  \ destinationFile, profile);\n```\n\n### 签署 PlayTo 合约\n\n`Windows.Media` 也是你找到 PlayTo\
  \ 合约类的地方。PlayTo 是你为了将媒体传输到应用以外的地方，或者为了让你的应用作为可以播放某些类型媒体的示例而必须履行的合约。\n\n你可以在第 9 章中阅读关于使用\
  \ PlayTo 合约的内容。\n\n### 从你的应用访问摄像头\n\n这些是用户想要用摄像头完成的主要操作：拍照、录音或捕获视频。它们各自有自己的内部细节，但在很大程度上非常相似。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) `视频会议` 也是摄像头的流行用途。然而，传输视频网络流在\
  \ WinJS 的范围之外（至少到本文为止）。你需要使用 `C++` 才能实现这一点。\n\n### 拍摄照片\n\n使用 `CameraCaptureUI`\
  \ 类拍照非常简单。你可以将其用于简单的应用内图像捕获，如头像等等。\n\n1. 点击 Capabilities 选项卡并勾选 Webcam 复选框，向 `package.appxmanifest`\
  \ 文件添加网络摄像头功能。\n\n用户会看到一条询问是否可以使用摄像头的消息，如图 13-1 所示。\n\n**图 13-1：** 获取用户的权限。\n\n\
  ![9781118173350-fg1301.tif](img/9781118173350-fg1301.tif)\n\n2. 在 HTML 中添加一个按钮：\n\
  ```html\n<body>\n  <input type=\"button\" id=\"takePic\" />\n</body>\n``````\n3.\
  \ 编写一个使用 `CaptureUI` 的函数。它看起来如下：\n```javascript\nfunction takePic() {\n    var cameraCapture\
  \ = new Windows.Media.Capture.CameraCaptureUI();\n    cameraCapture.captureFileAsync(Windows.Media.Capture.CameraCaptureUIMode.photo).then(function\
  \ (item) {\n        if (item) {\n            //保存文件\n        } else {\n        \
  \    //用户可能改变了主意\n        }\n    });\n}\n```\n4. 使用 `addEventListener` 将函数绑定到按钮：\n\
  ```javascript\nvar picButton = document.getElementById('takePic');\npicButton.addEventListener('click',\
  \ takePic);\n```\n操作仅于此。该图片会弹出带有预览的捕获界面。\n\n### 录制视频\n\n我相信当你发现如果需要，`CameraCaptureUI`\
  \ 可以录制视频而不是音频，你并不会感到意外。你只需要更改 `takePic` 函数中的模式：\n\n```javascript\nfunction takePic()\
  \ {\n    var cameraCapture = new Windows.Media.Capture.CameraCaptureUI();\n    cameraCapture.captureFileAsync(Windows.Media.Capture.CameraCaptureUIMode.video).then(function\
  \ (item) {\n        if (item) {\n            //保存文件\n        } else {\n        \
  \    //用户可能改变了主意\n        }\n    });\n}\n```\n\n你还可以使用 `MediaCapture` 类来录制视频。这有几个优点，特别是你可以设置的配置（profile）。它为视频录制的方式提供了更多选项。\n\
  \n该配置由 `MediaProperties` 组成，该类旨在定义所存储视频或音频的特定属性。你可以设置的一些属性值包括- `AudioEncodingProperties`\n\
  - `ImageEncodingProperties`\n- `videoEncodingProperties`\n- `ContainerEncodingProperties`\n\
  - `MediaRatio`\n- `MediaPropertySet`\n- `MediaEncodingProfile`\n\n这些设置允许你对视频获得更大的控制力，但代价是代码复杂性的增加。你需要编写自己的异步方法并为视频捕获提供自己的\
  \ UI。\n\n通用流程如下\n\n1. 启用网络摄像头功能。\n\n\n\n\n\n2. 创建并初始化 `MediaCapture` 对象。\n3. 创建并初始化编码配置文件。\n\
  4. 制作录制界面。\n5. 处理开始和停止录制的方法。\n\n要查看这些操作的实际效果，请查看 SDK 示例中的录制示例。它对整个工作原理进行了非常详细的解析（尽管稍微复杂）。\n\
  \n## 捕获音频\n\n音频录制的结构与使用 `MediaCapture` 进行视频录制非常相似。`MediaProperties` API 包含了你所需的音频编码位，可以以多种格式保存音频。内置格式包括：\n\
  \n- ![check.png](img/check.png) AAC 音频 (M4A)\n- ![check.png](img/check.png) MP3\
  \ 音频\n- ![check.png](img/check.png) Windows Media Audio (WMA)\n\n会有更多格式，而且，你当然可以使用\
  \ API 从现有的解码器构建你自己的 `MediaProperties`。\n\n## 从传感器收集数据\n\n笔记本电脑并没有很多传感器。它们主要是键盘和屏幕。虽然无聊，但这是事实。有些带有摄像头，这为体验增添了一些色彩。\n\
  \n现代设备，如 Surface 和平板电脑，内置了大量传感器。WinRT 让你能够以极小的麻烦访问所有传感器。WinRT 中的传感器命名空间包括：\n\n-\
  \ ![check.png](img/check.png) 地理位置：GPS 等\n- ![check.png](img/check.png) 输入：触摸屏和键盘\n\
  - ![check.png](img/check.png) 传感器：所有好东西，如指南针、加速度计、陀螺仪、倾斜仪、光传感器和方向传感器\n- ![check.png](img/check.png)\
  \ 便携：你可能连接到设备的 MP3 播放器和手机\n- ![check.png](img/check.png) 打印机：你知道的，为了纸张\n- ![check.png](img/check.png)\
  \ SMS：与手机网络通信\n\n![tip.eps](img/tip_fmt.png) 任何技术信息都无法帮助你在应用中很好地使用传感器数组。我唯一要求的就是使用良好的应用程序。良好的程序会很好地利用传感器。地图应用在天黑时会将背景从白色变为黑色。之类东西是教不出来的。\n\
  \n### 获取用户位置\n\n在不久前的某一天（等等，就是昨天！），你需要搜索三个或四个不同的位置 API 来查看用户最准确的位置。在 WinRT 中，至少这种痛苦被你免除了。所有可能包含位置的项都由\
  \ API 进行了检查。\n\n### 判断设备是否移动\n\n从前，有一种名为加速度计的美妙传感器。它能告诉设备已从一个位置移动到另一个位置。遗憾的是，Windows\
  \ 程序员无法访问这种设备，因为编写它的程序实在太困难了。\n\n好了，现在情况不再如此。\n\n`Accelerometer` 类让事情变得简单多。。现在调用该类中的默认传感器，就可以在一组通常糟糕的选项中选出最佳的一个。\n\
  \n```\naccelerometer = Windows.Devices.Sensors.Accelerometer.getDefault();\n```\n\
  \nWinRT 会尽力为你寻找加速度计。它可能以多种形式存在——即使是硬盘锁定保护。只要有驱动程序，就能被找到。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你可能想在某时编写摇晃功能。这实际上是一个很酷的功能。我喜欢我的 Twitter 客户端，当我摇晃手机时，它会更新动态。现在在你的项目中使用加速度计非常简单。\n\
  \n你不需要将加速度计声明为能力（capability）。它是免费提供的。\n\n1. 编写一个函数，当加速度计注册到摇晃时调用该函数。它可以执行任何你想的操作。\n\
  2. 获取默认加速度计的实例。\n3. 将 `onreadingchanged` 事件设置为你添加的函数。\n\n我的示例代码看起来如下（基于默认的 `PageControl`）：\n\
  \n```javascript\n(function () {\n    \"use strict\";\n    var checkingShake, accelerometer;\n\
  \    function itshook()\n    {\n        var field = document.getElementById(\"isitshaken\"\
  );\n        field.innerHTML=\"It shook!\";\n    }\n    WinJS.UI.Pages.define(\"\
  /pages/shaken.html\", {\n        // 此函数每当用户导航到此页面时都会调用。它\n        // 用应用的数据填充页面元素。\n\
  \        ready: function (element, options) {\n            accelerometer = Windows.Devices.Sensors.Accelerometer.getDefault();\n\
  \            accelerometer.onreadingchanged = itshook;\n        },\n        updateLayout:\
  \ function (element, viewState, lastViewState) {\n            /// <param name=\"\
  element\" value=\"true\"/>\n            /// <param name=\"viewState\" value=\"Windows.UI.ViewManagement.ApplicationViewState\"\
  />\n            /// <param name=\"lastViewState\" value=\"Windows.UI.ViewManagement.ApplicationViewState\"\
  />\n            // TODO: 响应 viewState 的变化。\n        },\n        unload: function\
  \ () {\n            // TODO: 响应离开此页的操作。\n        }\n    });\n})();\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 如果你的设备没有加速度计，这段代码就不起作用。无论怎么摇晃显示器都没有用（相信我，我试过）。而且，我不认为模拟器支持。如果你有一个没有加速度计的设备，它将无法工作。我用妻的\
  \ ThinkPad 试过，它有硬盘摇晃功能，在那里是可以起作用的，至少。\n\n但 `onreadingchanged` 事件并不是唯一的玩具。`getCurrentReading`\
  \ 提供了一个关于设备在空间中位置的三维概念。虽然一切都是相对的，但它确实告诉你用户是在向左向右还是向上向下移动设备。\n\n`getCurrentReading`\
  \ 的结果提供 `X`、`Y` 和 `Z` 参数。要使用它，可以尝试这样的代码：\n\n```javascript\nfunction getPosition()\
  \ {\n    var position = accelerometer.getCurrentReading();\n    if (position) {\n\
  \        var x = reading.accelerationX.toFixed(2);\n        var y = reading.accelerationY.toFixed(2);\n\
  \        var z = reading.accelerationZ.toFixed(2);\n    }\n}\n```\n\n使用它并不简单，因为你需要在用户处于可以改变的位置时不断检查位置。这需要一些算法上的技巧。只需记住任何这样直接与设备硬件通信的内容在\
  \ WinRT 下都是流式的，所以你检查值的可能更加频繁。\n\n## 感知光\n\n你在编写应用时可能没有考虑环境光，但你应该考虑。你可以根据用户所在房间的光线决定在应用中显示什么样式。\n\
  \n光传感器比在本章介绍的其他传感器不晦涩。它要么内置在机器中，要么没有，所以只要你做一些防御性编程，它就是一个好工具。\n\n使用光传感器与其他传感器类似。你会在传感器数组中反复看到模式：\n\
  \n1. 声明函数变量。\n2. 为 `on<sensor>changed` 事件处理器编写函数。\n3. 处理事件。\n4. 在处理器中，获取当前读取并对其进行处理。\n\
  \n我开始认为这是 Windows 8 中一个非常常见的模式。如果你熟悉其他平台的移动开发，你可能以前见过这种。它在 JavaScript 中看起来是这样的：\n\
  \n```javascript\n(function () {\n    \"use strict\";\n    var light;\n    function\
  \ onLightChanged(eventArgs) {\n        light = light.getCurrentReading();\n    }\n\
  \    WinJS.UI.Pages.define(\"/pages/light.html\", {\n        // 此函数每当用户导航到此页面时都会调用。它\n\
  \        // 用应用的数据填充页面元素。\n        ready: function (element, options) {\n      \
  \      lightSensor.onreadingchanged = onLightChanged;\n        },\n        updateLayout:\
  \ function (element, viewState, lastViewState) {\n        }\n    });\n})();\n```\n\
  \n\n\n\n\n```javascript\n// TODO: Respond to changes in viewState.\n        },\n\
  \        unload: function () {\n            // TODO: Respond to navigations away\
  \ from this page.\n        }\n    });\n})();\n```\n\n这一切都归于为用户提供良好的体验——就好像设备是他们的延伸一样。了解你的用户可能拥有哪些传感器并利用这些特性，是\
  \ Windows 8 领域应用开发的一个重要部分。\n\n处理传感器不存在的情况同样重要。不要忘记检查 `null` 值。不要依赖用户输入。记住，有可能是机器配置错误，或者用户关闭了某个开关。按最坏的情况来考虑。\n\
  \n## 触摸表面\n\nWindows 8 是一个“触摸优先”的操作系统。预装 Windows 8 的机器很大程度上都开启了触摸屏，而平板电脑自然也带有触摸屏。\n\
  \n因此，你可能会预预期 `WinRT` 拥有大部分支持触摸的 API 和工具，而你的想法是正确的。`WinJS` 中的所有用户控件都是支持触摸的，并且有一个非常稳健的触摸\
  \ API。所有这些内容将在第 6 章中进行详细介绍。\n\n### 全面的鼠标和指针功能\n\n并不是每个设备都有触摸屏。台式机和某些笔记本电脑只有鼠标和键盘，这没关系。所有支持触摸的功能也同样支持鼠标。\n\
  \n然而，在 Windows Store 应用中使用鼠标和键盘时，有一些设计上的考虑因素。例如，滚轮等可能会模拟触摸屏的某些功能。\n\n我将在第 5 章中介绍鼠标、键盘以及如何在\
  \ `WinJS` UI 控件中使用它们。\n\n# 使用手笔写作\n\n你可能遇到的最后一个输入设备（至少在 `Kinect` 安装到所有设备之前——那是另一个\
  \ API）是手笔。`WinRT` API 内置了一个非常棒的手笔，但但它的频率还不够。在本节中，我将带你简单了解手笔——至少足以让你在屏幕上留下墨迹。\n\n\
  ## 创建一个绘制区域\n\n首先，你需要一个绘制的地方。在 `WinJS` 世界中，这意味着一个 `Canvas` 元素。`Canvas` 元素是由 `W3C`（创建网页标准的组织）设计的，用于在\
  \ Web 上更快速地创建图形。可缩矢量图形（或 `SVG`）多年来一直是互联网动态图形的标准，但为了实现更高级的色彩和运动动画，需要转向可更新的位图模型。\n\
  \n事实证明，它对 Windows 8 同样完美。\n\n添加一个 `canvas` 元素很容易：\n\n```html\n<body>\n    <canvas\
  \ id=\"pieceOfPaper\"></canvas>\n</body>\n```\n\n使用它就没那么简单了。幸运的是，几个 `WinRT` 组件让在\
  \ `Canvas` 上写作变得简单得多。\n\n## 监听手笔输入\n\n要获取手笔输入，你需要使用 `Windows.UI.Input.PointerPoint`\
  \ 类的一些部分。（在此说明一下，我没有命名那个类）。无论如何，那里就是你要去的地方。\n\n1. 你需要做的第一件事是获取 `InkManager` 的引用。只需将其放在你\
  \ JavaScript 页面的声明部分即可。\n\n```javascript\nvar inkManager = new Windows.UI.Input.Inking.InkManager();\n\
  ```\n\n2. 获取 `canvas` 实例并设置一些事件处理器。你将在接下来的几步中编写它们。你可以将所有这些内容放在 `onactivated` 事件处理器中。\n\
  \n```javascript\napp.onactivated = function (args) {\n    if (args.detail.kind ===\
  \ activation.ActivationKind.launch) {\n        if (args.detail.previousExecutionState\
  \ !== activation.ApplicationExecutionState.terminated) {\n            inkCanvas\
  \ = document.getElementById(\"Canvas\");\n            inkContext = inkCanvas.getContext(\"\
  2d\");\n            inkCanvas.addEventListener(\"MSPointer Down\", onPointerDown,\
  \ false);\n            inkCanvas.addEventListener(\"MSPointer Move\", onPointerMove,\
  \ false);\n            inkCanvas.addEventListener(\"MSPointerUp\", onPointerUp,\
  \ false);\n        } else {\n            // TODO: 此应用已从挂起重新激活。\n            // 在此处恢复应用状态。\n\
  \        }\n        args.setPromise(WinJS.UI.processAll());\n    }\n};\n```\n\n\
  3. 你需要第 2 步中三个事件对应的三个函数。一个处理 `down` 事件，一个处理 `move`，一个处理 `up`。\n\n```javascript\n\
  function onPointerDown(evt) {\n    pointerDeviceType = getPointerDeviceType(evt.pointerId);\n\
  \    if (pointerDeviceType === \"Pen\" || (pointerDeviceType === \"Mouse\" && evt.button\
  \ === 1)) {\n        if (pointerId === -1) {\n            var current = evt.currentPoint;\n\
  \            inkContext.beginPath();\n            inkContext.lineWidth = strokeWidth;\n\
  \            inkContext.strokeStyle = strokeColor;\n            inkContext.moveTo(current.position,\
  \ current.y);\n            inkManager.processPointerDown(current);\n           \
  \ pointerId = evt.pointerId;\n        }\n    }\n}\nfunction onPointerMove(evt) {\n\
  \    pointerDeviceType = getPointerDeviceType(evt.pointerId);\n    if (pointerDeviceType\
  \ === \"Pen\" || (pointerDeviceType === \"Mouse\" && evt.button === 1)) {\n    \
  \    if (pointerId === pointerId) {\n            var current = evt.currentPoint;\n\
  \            inkContext.lineTo(current.rawPosition.x, current.rawPosition.y);\n\
  \            inkContext.stroke();\n            inkManager.processPointerUpdate(current);\n\
  \        }\n    }\n}\nfunction onPointerUp(evt) {\n    pointerDeviceType = getPointerDeviceType(evt.pointerId);\n\
  \    if (pointerDeviceType === \"Pen\" || (pointerDeviceType === \"Mouse\" && evt.button\
  \ === 0)) {\n        if (pointerId === pointerId) {\n            inkManager.processPointerUp(evt.currentPoint);\n\
  \            inkContext.closePath();\n            renderAllStrokes();\n        \
  \    pointerId = -1;\n        }\n    }\n}\n```\n\n4. 最后，你需要那个 `getPointerDeviceType`\
  \ 函数。你可以在每个事件中重复代码，但为什么要那么做呢？\n\n```javascript\nfunction getPointerDeviceType(pId)\
  \ {\n    var pointerDeviceType;\n    var pointerPoint = Windows.UI.Input.PointerPoint.getCurrentPoint(pId);\n\
  \    switch (pointerPoint.pointerDevice.pointerDeviceType) {\n        case Windows.Devices.Input.PointerDeviceType.touch:\n\
  \            pointerDeviceType = \"Touch\";\n            break;\n        case Windows.Devices.Input.PointerDeviceType.pen:\n\
  \            pointerDeviceType = \"Pen\";\n            break;\n        case Windows.Devices.Input.PointerDeviceType.mouse:\n\
  \            pointerDeviceType = \"Mouse\";\n            break;\n        default:\n\
  \            pointerDeviceType = \"Undefined\";\n    }\n    deviceMessage.innerText\
  \ = pointerDeviceType;\n    return pointerDeviceType;\n}\n```\n\n## 收集墨迹\n\n现在你已经设置好了事件处理器，就可以运行应用并进行绘画了。记住，如果你的设备上没有手笔，你可以使用模拟器来模拟手笔。\n\
  \n# 第 14 章：为商店准备\n\n### 本章内容\n\n- ![arrow](img/arrow.png) 确保你的应用与宣传一致\n- ![arrow](img/arrow.png)\
  \ 获取微软的批准\n- ![arrow](img/arrow.png) 保持应用更新\n\n正如许多移动应用商店一样，微软对进入 Windows Store\
  \ 的应用有一套审核流程。如果你想让你的应用向公众出售，你就必须通过这个过程。\n\n\n\n\n尽管微软已经让商店（Store）认证流程变得非常透明，但它仍然相当复杂。这里有很多涉及的环节，关注所有细节至关重要。\n\
  \n在进入商店之前，你需要确保你的应用符合认证要求。这有一项指南，我将在本章中详细介绍。你准备得越充分，开始赚钱的速度就越快。\n\n但在担心认证之前，你需要确保你的应用运行正常。到目前为止我还没有详细讨论单元测试，但在这里我会提到。\n\
  \n在完成所有这些之后，你需要将应用放入商店并保持其更新。除了修复错误，你还需要保持应用的新鲜以便让用户满意。使用 `Visual Studio` 非常简单，我会在本章中介绍。\n\
  \n## 测试你的应用\n\n`Visual Studio` 中没有适用于 JavaScript 应用的单元测试或代码分析模板。测试是一种“自备其器”的体验。\n\
  \n尽管如此，你仍然必须测试你的应用。仅仅在发送到商店之前点击一遍应用是够够的，但它必须是测试过程的一部分。\n\n由于 JavaScript 项目中没有任何单元测试项目类型，你需要想出辅助方案。\n\
  \n### 老式测试\n\n我构出的技巧之一是使用 JavaScript 来测试 JavaScript。这并不是理想状态，因为你没有测试框架，但它比没有要好：\n\
  \n1. 右键点击项目并添加一个文件夹。将其命名为 `Tests`。\n2. 右键点击新文件夹并添加一个新的 `Page Control`。使用默认名称即可。\n\
  3. 打开创建的 HTML 文件，将所有的 `.js` 文件拖到其他 `.js` 文件旁边的代码区域。\n4. 添加一个在主项目中执行某些操作的函数。这就是测试方法。\n\
  5. 添加一个调用该测试方法的按钮。\n\n对于许多项目来说，这可能就是最好的办法了。在没有单元测试项目类型的情况下，你基本上回到了老式的“点击按钮看看它是否工作”的测试。\n\
  \n### 获取单元测试框架\n\nWindows 8 的一些新研究围绕着在 JavaScript 中使用单元测试框架，就像你编写 `jQuery` 或 `Node.JS`\
  \ 项目一样。其中一些框架与 Windows 8 配合得良好。\n\n例如，以 `QUnit` 为例。它最初是为 `jQuery` 项目创建的单元测试环境，现在\
  \ `QUnit` 是一个独立项目。可以将源代码包含在 Windows 8 项目中，你的测试可以变得有趣得多。\n\n要使用 `QUnit` 运行测试，请从 GitHub\
  \ ([https://github.com/jquery/qunit`]) 下载 `QUnit` 文件和 CSS 文件，然后将这些内容放入测试文件的默认 HTML\
  \ 中：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=”utf-8” />\n\
  \    <title>Qunit</title>\n    <!-- WinJS references -->\n    <link href=”//Microsoft.WinJS.1.0.RC/css/ui-dark.css”\
  \ rel=”stylesheet” />\n    <script src=”//Microsoft.WinJS.1.0.RC/js/base.js”> </script>\n\
  \    <script src=”//Microsoft.WinJS.1.0.RC/js/ui.js”> </script>\n    <!-- Qunit\
  \ references -->\n    <link href=”/css/default.css” rel=”stylesheet” />\n    <script\
  \ src=\"/js/default.js”></script>\n    <script type=”text/javascript” src=”js/qunit.js”>\
  \ </script>\n    <link rel=”stylesheet” type=”text/css” href=”css/qunit.css” />\n\
  </head>\n<body>\n    <div id=”qunit”></</div>\n</body>\n</html>\n```\n\n<tip>\n\
  确保脚本源路径匹配。\n</tip>\n\n这为你开始测试提供了一个参考点。我们只需要将一个测试插入到 Windows 8 的代码中。来自示例网站的测试看起来如下所示：\n\
  \n```\napp.onactivated = function (args) {\n    if (args.detail.kind === activation.ActivationKind.launch)\
  \ {\n        if (args.detail.previousExecutionState !== activation.ApplicationExecutionState.terminated)\
  \ {\n            test(“hello test”, function () {\n                ok(1 == “1”,\
  \ “Passed!”);\n            });\n        }\n    }\n}\n```\n\n<tip>\n确保脚本源路径匹配。\n\
  </tip>\n\n这为你开始测试提供了一个参考点。我们只需要将一个测试插入到 Windows 8 的代码中。来自示例网站的测试看起来如下所示：\n\n\n\n\
  \n![check.png](img/check.png) 关闭网络并确保应用仍然运行，或者至少能够优雅地运行失败。确保如果你使用了漫游配置文件，它们有回退位置且在没有网络的情况下仍可工作。\n\
  \n![check.png](img/check.png) 检查每一个动画。在并排（snap）和全屏（fill）视图下查看它们。确保当机器忙于处理其他事务时动画也能正常工作。确保如果用户在动画播放期间旋转屏幕，长运行动画也能正常工作。\n\
  \n![check.png](img/check.png) 应用有响应吗？记住，Windows 8 的“快速且流畅”原则被测试人员严格对待。应用 应该对任何用户交互做出即时响应。\n\
  \n![check.png](img/check.png) 向应用中输入垃圾数据并确保它能够优雅地失败。让你的猫在键盘上走。触摸你不该触摸的地方。上传损坏的文件。确保你的错误处理机制正常。\n\
  \n![check.png](img/check.png) 确保你的应用符合无障碍访问基准。使用放大镜和屏幕阅读器进行测试。测试语音输入。\n\n![check.png](img/check.png)\
  \ 更改电脑的基础语言并确保应用仍然运行。商店是全球性的。更改你的时区。更改你的日期格式。如果有必要，使用虚拟机。\n\n![check.png](img/check.png)\
  \ 最后，如果你想让使用 ARM 架构（运行 Windows RT 轻级移动芯片）的用户可以使用你的应用（建议这样做），请在 ARM 设备上进行测试。模拟器似乎还不支持，但在你读到这里时可能已经支持。\n\
  \n### 验证生命周期\n\n如果你的应用进程生命周期管理 (PLM) 不符合标准，它会被踢出商店。认证套件（我将在下一节介绍）会测试其中一些内容，但也会进行手动测试。\n\
  \n你应该做的第一件事是检查挂起状态。从磁贴启动应用，切换到另一个应用，然后切换到桌面。运行任务管理器，点击 `查看⇒状态值⇒显示挂起状态`。它看起来像图 14-2。观察你的应用挂起。确保内存占用减少。\n\
  \n**图 14-2：** 显示挂起应用的任务管理器。\n\n![9781118173350-fg1402.tif](img/9781118173350-fg1402_fmt.png)\n\
  \n然后通过从左侧滑动回你的应用（你可能需要滑动几次）。确保应用优雅地恢复。你可以让任务管理器保持在最顶层并观察挂起状态消失，并确保资源返回。\n\n也测试终止情况。在任务管理器中，右键点击应用并选择`结束任务`。确保它已终止。然后回到开始屏幕并启动应用。确保它优雅地恢复。它不需要在用户结束时所在的相同页面重新启动用户，但不应该完全忘记已经发生过的一切事情。\n\
  \n最后，确保应用在未运行时执行了它应该做的所有事情。从任务管理器中终止它，然后检查磁贴、Toast 提示以及你为之编写的任何后台任务。它们仍然有效吗？它们的行为符合预期吗？\n\
  \n第 11 章有更多关于 PLM 的。好好测试它。微软也会的。\n\n## Windows 应用认证套件\n\nWACK（Windows 应用认证套件）是微软提供的一个工具，用于运行你的应用在认证过程中将经历的各种测试。当你认为应用已准备好进入商店时，务必先运行\
  \ WACK！\n\nWACK 基本上是一个自动化测试套件，它在相当于基准电脑（当然是虚拟的）上运行你的应用几次，并检查几项内容。具体而言，它测试：\n\n![check.png](img/check.png)\
  \ 与 Windows 的所有交互都记录在 `package.appxmanifest` 文件中\n\n![check.png](img/check.png)\
  \ 你的应用声称支持的所有语言都已本地化\n\n![check.png](img/check.png) 你的应用在崩溃后能否恢复\n\n![check.png](img/check.png)\
  \ 你仍然处于调试模式\n\n![check.png](img/check.png) 包编码是否正确（换句话说，没有损坏）\n\n![check.png](img/check.png)\
  \ 性能是否过度消耗处理器\n\n![check.png](img/check.png) 你是否使用了任何不允许的 API\n\n![check.png](img/check.png)\
  \ 是否遵循所有的安全规范（运行 WACK 可了解更多）\n\n运行 Windows 应用认证套件非常简单，但有一些小技巧：\n\n1. 按 Windows 键并输入\
  \ Windows App 来运行 WACK —— 它可能是你机器上唯一以此命名的应用。\n2. 在启动界面上，点击`验证 Metro 风格应用`。在你读到这里时，它的名称可能稍有不同，但你不想点击桌面应用程序。\n\
  3. 在应用扫描了系统上的 WinRT 应用后，你将得到一个像图 14-3 所示的列表。勾选你想检查的项目 —— 我正在测试 `ToDoToday`，它是 `POINTtodo`\
  \ 的原始名称。\n\n**图 14-3：** 为测试选择你的应用。\n\n![9781118173350-fg1403.tif](img/9781118173350-fg1403_fmt.png)\n\
  \n4. 点击`下一步`，去喝杯咖啡。WACK 以多种方式运行你的应用。最后测试完成并提示你保存 XML 文件。\n5. 将 XML 文件保存在你可以找到的地方。\n\
  6. 接下来将获得结果——通过、失败或警告。此屏幕有一个结果的链接。点击它。由于 WACK 当前版本的某个已知错误，我的应用失败了。它显示几乎所有应用都处于调试模式，即使它们并非如此。在你获取该工具时可能已经修复。\n\
  \n## 手动检查 Windows 风格\n\n在 Windows 8 应用开发的早期，为了获得商店早期投放，你需要与微软工程师会面。他们使用手动检查清单来遍历应用的体验点，以确保涵盖了所有基础。考虑到此列表可能会消失，我在这里进行了转述。在设计\
  \ `POINTtodo` 应用以及编写本书时，我它非常有用。\n\n![check.png](img/check.png) ### 场景\n- 有明确的任务和范围；实现程度足以代表最终范围\n\
  \n![check.png](img/check.png) ### UX 完善\n- 遵循 Windows 商店原则\n- 传递品牌和目的\n- 遵循一致的布局和对齐\n\
  - 利用排版和留白，并遵循字体层次结构\n- 采用 Windows 8 个性\n- 为良好的第一印象设计\n- 动画具有目的性、创造连续性并带给信心\n- 为触摸设计\n\
  \n![check.png](img/check.png) ### 用户体验：控件、导航、动画\n- 内容是主要的导航机制\n- 恰当使用应用栏\n- 恰当使用命令表面并尊重边缘\n\
  - 显示非干扰、有意义且可操作的错误处理\n- 恰当利用语义缩放\n\n![check.png](img/check.png) ### 用户体验：视图与形状因子\n\
  - 支持横屏和竖屏视图\n- 适应不同的形状因子和宽高比\n- 处理并排、填充和全屏状态\n- 单轴和平和滚动以创造稳定感\n- 在仅有鼠标或键盘的系统上功能正常且自然\n\
  - 在使用屏幕键盘的系统上功能正常且自然\n\n![check.png](img/check.png) ### 用户体验：设置\n- 实现设置应用，且在应用其他任何地方没有设置和偏好\n\
  - 漫游用户设置和用户状态\n\n\n\n## 用户体验：应用协议\n- 具有良好的登录/注销体验\n![check.png](img/check.png)\n\
  - 实现了搜索协议\n- 实现了共享目标协议\n- 实现了共享源协议\n- 具有精美的品牌化协议 UI\n- 利用了文件选择器\n\n## 用户体验：PLM（生命周期管理）\n\
  ![check.png](img/check.png)\n- 恰善处理 PLM 状态\n- 适当使用后台任务\n\n## 用户体验：网络\n![check.png](img/check.png)\n\
  - 在离线和间性网络连接下表现良好\n\n## 用户体验：磁贴与通知\n![check.png](img/check.png)\n- 具有精美的品牌磁贴\n-\
  \ 具有活动磁贴或二级磁贴\n- 使用 `Toast` 通知处理时间敏感的相关信息\n- 正确处理来自应用协议、二级磁贴和通知的激活\n\n## 商店\n![check.png](img/check.png)\n\
  - 预期符合 Windows 8 App 认证要求。\n- 通过 Windows App 认证套件 (`WACK`) 测试。\n\n## 性能\n![check.png](img/check.png)\n\
  - UI 始终保持响应，并对交互提供视觉反馈\n\n## 性能：动画\n![check.png](img/check.png)\n- 维持每秒 60 帧\n\n\
  ## 性能：生命周期\n![check.png](img/check.png)\n- 优化你的挂起和恢复处理器\n- 在规定的时间内挂起和恢复\n\n## 性能：缓存与本地数据\n\
  ![check.png](img/check.png)\n- 尽可能依赖本地的包体内容\n\n## 性能：启动\n![check.png](img/check.png)\n\
  - 第一页加载必须在五秒内完成。\n- 利用字节码缓存\n\n## 性能：内存\n![check.png](img/check.png)\n- 将内存工作集管理到预期目标\n\
  \n## 性能：网络\n![check.png](img/check.png)\n- 适当管理网络资源\n\n## 性能：后台任务\n![check.png](img/check.png)\n\
  - 尊重后台任务分配的时间段\n\n## 其他\n- 具备可访问性\n- 已本地化\n\n所有这些内容多程度上都需要通过查看应用来测试，而这正是操作方法。\n\n\
  ### 推送到商店\n为了将你的应用推送到商店，你首先需要一个开发者账户。注册此类后，你可以上传程序包并提交测试。在测试过程以及相关后续步骤完成后，你的应用即可在商店中发布。\n\
  \n### 注册开发者账户\n如果你还没有账户，则需要注册一个开发者账户。你可以直接从 Visual Studio 注册账户或登录已有账户。在 `Project⇒Store`\
  \ 菜单中有一个 `Open Developer Account`（打开开发者账户）项。点击它将跳转到浏览器。\n\n你从这里 开发者门户开始，那里会显示你的\
  \ `Live` 账户信息，以确认这些是你想要使用的信息。如果你使用的是 `IE10`以外的浏览器，可能需要先登录。点击“继续”。\n\n在下一个屏幕上，你需要为你的\
  \ `Live` 账户添加少量信息（我需要更新我的手机号码）。底部是一个重要的步骤——选择你的发行者名称。这将用户安装你的应用时显示的内容，因此对于整体品牌方案至关重要。\n\
  \n接下来你将看到开发者协议。阅读它。我不会把它全部放在这里，因为太长了，但你确实需要通读一遍。例如，其中有费用信息：\n\n“对于你通过 Windows Store\
  \ 提供的每个应用，你将向 Microsoft 支付 `Store Fee`（商店费用）。Microsoft 可能从它从这些应用那里收取的任何金额中扣除并保留你欠\
  \ Microsoft 的商店费用。你将在收到书面请求后的五（5）天内，还将支付 Microsoft 未扣除的任何 `Store fees`。`Store Fee`\
  \ 是 Microsoft 作为通过 Windows Store 提供你的应用的服务费，所保留的 `Net Receipts`（净收入）的百分比。该百分比为 30%，除非且直到你的应用总\
  \ `Net Receipts` 达到 `USD$25,000`，届时该应用的该项百分比将变为 20%。”\n\n该信息在其他很多地方并不出现。\n\n此之后，你需要付出一些血汗钱。设置账户需要费用，以防止人们随心所欲。在编写本文时，费用为\
  \ `$49 USD`，尽管早期采用者获得了一个免费获取代码。尽管如此，我仍然必须给他们提供信用卡号。\n\n你完成了。如果你愿意，可以设置账户将付款直接发送到你的支票或储蓄账户。你也可以直接进入仪表板开始注册你的应用。\n\
  \n### 提交应用\n图 14-4 显示了仪表板。在这里，你可以提交新应用，查看人们如何使用你的应用，并检查你赚了多少钱。此外，在 `Profile`（配置）标题下，你可以承诺的那样设置付款账户。\n\
  \n更重要的是准备将应用提交到商店。在上传应用之前，你必须经过一个多步骤流程。你能做的最重要的一件事就是：\n\n#### 应用名称\n应用名称是唯一的。在提交应用之前，你可以在仪表板中设置你的\
  \ `Tile`（磁贴）。一旦你决定，就去申请名称。\n\n**图 14-4：你的应用**\n\n![9781118173350-fg404.tif](img/9781118173350-fg404.tif)\n\
  \n#### 销售详情\n在仪表板的 `Selling Details`（销售详情）部分，你可以设置价格。当然，其中一个选项是免费的，但有趣的之处在哪里？（除了免费外，你可以将价格设置为从低\
  \ `$1.49` 到高 `$999.99`，或者任何 0.5 美元的增量）。你还可以设置免费试用时长，我将在第 16 章中讨论。\n\n**图 14-5：其他市场的费用计算**\n\
  \n![9781118173350-fg405.tif](img/9781118173350-fg405.tif)\n\n![tip.png](img/tip.png)\
  \ 只要在你想要提供应用的市场中勾选即可。注意：如果我选择像香港这样的地方（那里是 16 港币），最好准备好支持从右向左阅读顺序。我热爱技术。\n\n在 `Selling\
  \ Details` 页面底部，你还有一些项目需要处理：\n\n- 发布日期\n- 应用分类和子分类。这很重要，因为它代表了你在商店中的位置。\n- 最小 DirectX\
  \ 支持\n- 最小 RAM\n- 可访问性要求——是否符合？\n\n### 高级功能\n在 `Advanced Features`（高级功能）部分，你可以设置推送通知、`Live\
  \ Connect` 服务和应用内。我将在第 16 章中介绍应用内，所以在这里我们关注前两项。事实证明，你在网站上也不需要做什么——大部分工作必须在 Visual\
  \ Studio 中完成。\n\n为了使用 `WNS` 和 `Live Services`，最重要的东西是 `Package Security Identifier`（包安全标识符）和\
  \ `Client Secret`（客户端密钥）。这些被用于 Windows 8 应用与服务进行身份验证。\n\n\n\n\n\n要获取包安全标识（Package\
  \ Security Identifier）和客户端密钥（Client Secret），只需点击 `Push Notifications` 和 `Live Connect`\
  \ 服务信息链接，然后点击 `Identifying Your Service`。\n\n## 年龄分\n\n作为应用配置的一部分，你可以选择一个年龄分级。注意，这个年龄分级是针对适用性的，而不一定针对功能性。例如，`POINTtodo`\
  \ 可以被评为`适合幼儿儿童`，尽管一个合理的三岁孩子不需要任务列表。现实来说，除非你的目标群体是儿童，否则请使用 `12+` 设置。\n\n以下是网站直接提供的选项：\n\
  \n![check.png](img/check.png) 3+, 适合幼儿儿童：这些应用程序被认为适合幼儿儿童。可能包含非写实的、卡通形式的极微漫画暴力。角色不应与现实生活中的人物相似或关联。内容不应具有恐吓性，或包含裸露或对性活动或犯罪活动的引用。具有此年龄分级的应用无法启用访问不适合幼儿儿童的内容或功能。这包括但不限于访问在线服务、收集个人信息或激活麦克风或摄像头等硬件。\n\
  \n![check.png](img/check.png) 7+, 适合 7 岁及以上年龄：具有此年龄分级的应用标准与 3+ 应用相同，但这些应用可以包含可能惊吓较小观众的内容，并可以包含部分裸露，只要该裸露不涉及性活动。\n\
  \n![check.png](img/check.png) 12+, 适合 12 岁及以上年龄：如果你不确定为应用选择哪种年龄分级，请选择此分级。具有此年龄分级的应用可能包含增加非性本质裸露、针对非写实角色的轻微写实暴力，或针对真实人类或动物角色的非写实暴力。此年龄分级也可能包含脏话，但不是性方面的。此外，具有此年龄分级的应用可能包含访问在线服务，并启用麦克风或摄像头等功能。还可以包含比\
  \ 7+ 应用允许更多的脏言，但脏言不能是性方面的。\n\n![check.png](img/check.png) 16+, 适合 16 岁及以上年龄：具有此年龄分级的应用可以描绘带有极少出血的写实暴力，并且可以描绘性活动。它们还可以包含药物或烟草使用以及犯罪活动，以及在认证要求第\
  \ 5 节规定的范围内比 12+应用允许更多的脏话。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 注意，在\
  \ Windows Store 应用中不能包含成人级内容（17+）。抱歉。\n\n作为年龄认证的一部分，某些国家需要分级证书。你可以在此页面上传这些证书。\n\n\
  ## 加密\n\n我在这本书中没有怎么介绍安全和风险话题。这些是复杂且深入的话题，有许多变量，并且对不同的市场、人员和应用的影响程度也不同。\n\n所以，如果你发现你需要加密密码加密、复制保护、身份验证、数字版权管理或使用数字签名以外的内容，你就需要为应用申请一个\
  \ `ECCN`。`ECCN` 是出口控制分类编号。它对出口到与美国内容标准不同的国家的物品进行分类。有关更多信息，请访问工业和安全局网站 `www.bis.doc.gov/`。\n\
  \n## 包\n\n最后，你可以上传你的包。如果你还没有完成编码或测试，现在是停下来并评估状况的好时机。\n\n如果你已经完成，就可以准备就绪了。你可以将包文件拖到微软选择的文件输入类型字段中，或者直接使用\
  \ `Visual Studio` 来完成。因为你必须使用 `Visual Studio` 创建包，而且它也会为你上传，所以我将重点关注这一点。\n\n1. 在\
  \ `Project⇒Store` 菜单中，选择 `Create App Package`。\n2. 在询问是否创建包的对话框中选择 `Yes`。\n3. 如果需要，请登录。\n\
  4. 选择你正在构建包的应用。\n5. 设置版本和生成配置。\n6. 点击 `Create`。\n\n如果你收到关于临时密钥的错误，可能是你尚未为你的项目创建证书。如果你需要处理这个问题，请查看\
  \ `http://go.microsoft.com/fwlink/?LinkID=241478` 关于证书的内容——对我来说这是一段挣扎，尽管我对公钥加密和代码签名非常熟悉。我希望当你走到这一步时，微软已经让过程变得更容易了。\n\
  \n无论如何，完成完成后（通过网站或 `Visual Studio`），你都会收到门户的通知。你快要完成了。\n\n## 描述\n\n现在你可以写一点营销文案了。如果你访问\
  \ Windows Store 并点击任何随机应用，就可以看到 `Description` 字段中填了什么。这段文字实际上是让人们对你的应用多看一眼的唯一途径。在这里不要吝啬。\n\
  \n事实上，如果你不擅长写作，就找个作家帮你写。（如果你已经读到了这本书的这一页，给我发封邮件吧。也许我可以帮你写描述。谁知道呢。）但无论如何如何，都要把它写好。你可能认为你的应用很好并且可以独立，但我向你保证，如果描述写得不好，没人会下载它。\n\
  \n这里是 `POINTtodo` 的描述：\n\n任务列表的问题在于它永远没有完工。你永远无法获得那种完成感。\n\n相比之下，任务管理器非常复杂。Outlook\
  \ 等工具有截止日期和重要性评分。你每天必须输入任务来管理。\n\n介绍 `POINTtodo`：属于我们的任务列表。\n\n通过 `POINTtodo`，你维护两个列表。一个是你不想思考但必须处理的待办事项；另一个是今天必须完成的任务。\n\
  \n每天早上花三分钟将任务从 `Later` 列表移动到 `Today` 列表，再加上一些紧急事项，你的一天就有计划了。\n\n这并不是莎士比亚，但它易于阅读，并传达了所有重要细节。如果你开始得良好且应用有了良好的设计，写一个引人的描述应该是很容易的。\n\
  \n## 给测试者的说明\n\n最后，你有 500 个字符来告诉测试人员要寻找什么。不要辞藻——500 个字符并不多。\n\n最重要的是，如果有用户账户管理，请给\
  \ Windows Store 测试人员提供测试账户，并告诉他们如何进入受限功能。此外，确保提交时应用的任何外部服务或资源都是可用的。\n\n![remember.eps](img/remember_fmt.png)\
  \ 真人会阅读这些并运行你的应用，然后决定是否让你进入商店。不要忽略这部分。停下来考虑一下。我会等。\n\n## 顺利通过测试\n\n一旦完成所有这些，你的应用将进入测试，然后你等待。当结果返回时（通常一周后），它要么通过并等待进入商店，要么失败等待你修复。你可能会遇到某些特定的失败以及解决方案。\n\
  \n![check.png](img/check.png) 数字签名文件测试：测试可执行文件和设备驱动程序以验证它们是否具有有效的数字签名。\n\n![check.png](img/check.png)\
  \ 文件编码测试：测试应用包的内容以确保它们使用正确的文件编码。\n\n![check.png](img/check.png) 安装-卸载测试：安装并卸载应用，并检查残留的文件和注册表项。\n\
  \n\n\n\n![check.png](img/check.png) 启动和挂起性能测试：测试用户在启动应用时的启动速度，以及当用户切换到另一个应用时的挂起速度。\n\
  \n![check.png](img/check.png) Windows Store 风格应用清单测试：测试应用清单的内容，以确保其内容正确。\n\n![check.png](img/check.png)\
  \ 多用户会话测试：测试应用在同时运行多个会话时的行为。\n\n![check.png](img/check.png) 重启管理器消息测试：测试应用对系统关闭和重启消息的响应。\n\
  \n![check.png](img/check.png) 安全模式测试：测试驱动程序或服务是否配置为在安全模式下启动。\n\n![check.png](img/check.png)\
  \ 应用崩溃停止响应测试：在认证测试期间监控应用，记录其崩溃或停止响应的时间。\n\n![check.png](img/check.png) Windows 安全功能更改测试：验证应用是否使用了\
  \ Windows 安全功能和强 ACL（访问控制列表）。\n\n![check.png](img/check.png) 文件夹使用正确测试：验证应用是否将其程序和数据文件写入正确的文件夹。\n\
  \n![check.png](img/check.png) 调试应用测试：测试应用以确保其不是调试版本。\n\n![check.png](img/check.png)\
  \ Windows Store 风格应用 API 使用测试：测试应用是否使用了任何不合的 API。\n\n![check.png](img/check.png)\
  \ Windows 兼容性修复测试：验证应用没有使用任何 Windows 兼容性修复。\n\n![check.png](img/check.png) OS 版本检查逻辑测试：测试应用如何检查运行它的\
  \ Windows 版本。\n\n![check.png](img/check.png) 应用清单中定义的资源测试：测试应用清单中定义的资源，确保它们存在且有效。\n\
  \n![check.png](img/check.png) 用户账户控制（UAC）测试：验证应用运行是否不需要不必要的提升权限。\n\n![check.png](img/check.png)\
  \ Windows 平台支持测试：测试应用以确保 `.exe` 是为将要安装的平台架构构建的。\n\n要修复这些任何失败项，只需根据描述修复相关情况即可。诚实地说，微软回传的邮件（至少在我案例中收到的那封）包含了关于修复应用并使其重新进入测试的具体指令。\n\
  \n# 管理你的应用生存\n\n当你的应用进入 Windows Store 后，你将希望监控它的使用方式、使用频率以及任何问题或错误。微软的管理经验是无与伦比的，所以你应该发现这非常简单。\n\
  \n但在你开始操作之前，先了解一下，仪表板为你提供了以下某些主题的非常好的统计数据：\n\n![check.png](img/check.png) 按年龄组和市场划分的下载\n\
  \n![check.png](img/check.png) 评分和评论\n\n![check.png](img/check.png) 转化率（查看到下载）\n\n\
  ![check.png](img/check.png) 列表查看量\n\n![check.png](img/check.png) 每日使用量（这难道不很棒吗？）\n\
  \n![check.png](img/check.png) 按年龄和市场划分的应用内购买\n\n还有详尽的质量指标，它可以深入到某些你以前在 Windows 应用中无法获得的统计使用数据：\n\
  \n![check.png](img/check.png) JavaScript 异常率\n\n![check.png](img/check.png) 崩溃率\n\
  \n![check.png](img/check.png) 应用无响应率\n\n这些值对于改进应用整个生命周期的体验非常重要。即使你可能推出了没有 bug 的代码，`WinRT`\
  \ 库也会发生变化，而且会出现你没有测试过的环境。做好准备是好的，但了解情情更好。Windows Store 在告知你用户对你的应用的体验方面做得非常好。\n\n\
  # 第 15 章\n\n## 走向云端\n\n### 本章内容\n\n![arrow](img/arrow.png) 使用服务支持你的应用\n\n![arrow](img/arrow.png)\
  \ 使用 Azure 为用户带来更多价值\n\n![arrow](img/arrow.png) 弥补 WinRT 缺乏数据库支持的问题\n\n在整本书中，我提到对于\
  \ `.NET` 开发者来说，最奇怪的变化之一就是 `WinRT` 缺乏数据库支持。这并不是微软不喜欢数据库（毕竟他们自己也开发数据库），而是数据库连接所需的网络访问成本高且不安全。\n\
  \n在第 10 章和第 12 章中，我涵盖了许多绕过数据库问题的方案。本地数据是一种可能，使用 `SQLite` 和远程设置也是如此。然而，最佳方案是将你的数据库封装在结构化服务层中，并使用\
  \ `WinJS.xhr` 获取你所需的内容。\n\n遗憾的是，对我们许多人来说，启动一个带有 `SQL Server` 后端的完整 Windows Communication\
  \ Services 项目是不可能的。你可以使用 `Ruby on Rails`、`AppHarbor` 和 `MySQL`，但那些可能不在你的技术栈中。这是一个可能棘手的问题。\n\
  \n幸运的是，微软的云平台 Windows Azure 已经带来了一个廉价、预配置、易于使用和管理的服务平台来救援。`Windows Azure Mobile\
  \ Services` 产品是 Windows Store 应用的数据库，我将在本章向你展示如何使用它。\n\n提醒一下：在写本书时，Azure 甚至还没有进入测试阶段。事情——尤其是界面的外观——可能会发生。不要被此误导。请在本章之外，额外使用在线文档来设置你的初始服务。如果你在使用的过程中发现与产品有差异，请通过书籍网站上的联系表单告诉我。\n\
  \n## 游览 Azure\n\nWindows Azure 是由微软运营的一家大型、复杂的互联网托管公司。它让开发者能够访问互联网上 24 小时、每周 7 天提供的服务器。你永远看不到这些服务器，可能不知道它们在物理位置上，你也没有登录并更改操作系统中任何内容的能力。\n\
  \n这是一件好事。\n\n在我职业生涯的前 15 年里，我主要在学术和创业性的互联网领域工作。我构建网站、管理电子邮件，并提供了大量的建议。事实上，我是极少数的互联网业务战略师之一。\n\
  \n在那段时间，我在构建、维护和保护服务器上花费的精力比编写代码上花费的要多。保持服务器在线——特别是在今天这种令人眼晕的安全形势下——具有极高的要求。即使你拥有资源和互联网连接，它也会消耗你管理应用的时间。\n\
  \nAzure 登场了。Azure 为开发者为所有后端事务提供了一站式解决方案。图 15-1 显示了 Azure 仪表板，你可以在那里访问完整的 Azure 服务范围，包括数据库、虚拟机、工作进程等。\n\
  \n**图 15-1：** 全新的 Windows Azure 门户。\n\n![9781118173350-fg1501.tif](img/9781118173350-fg1501_fmt.png)\n\
  \nAzure 有许多功能，但对于 Windows Store 开发者来说，它是构建数据库、访问身份验证和部署推送通知的地方。Windows Azure Mobile\
  \ Services 在此本书出版时应该就会推出，它会让这一切变得更简单。\n\n### 发布 Windows Azure Mobile Services\n\n\
  Windows Azure Mobile Services 是一种专门为移动应用开发设计的云端服务模型。尽管在写下这部分文字时，所有的 API 都基于 Windows\
  \ Store，但当你读到这里时，它将也会支持 iOS、Android 和 Windows Phone 开发。Mobile Services 将成为从移动设备在云端存储和访问数据的一站式商店。\n\
  \n\n\n\n\nMobile Services（移动服务）使用预定义的模式集合来解决移动应用开发中非常特定的问题，我在书中讨论了所有这些内容：\n\n![check.png](img/check.png)\
  \ 数据存储\n\n![check.png](img/check.png) 身份验证\n\n![check.png](img/check.png) 推送通知及更多\n\
  \n在我写这段文字时，该产品刚刚进入测试阶段，因此会有更多功能推出。为了让你了解一下这一切是如何运作的，我将向你展示如何使用 Mobile Services 设置后端数据库。\n\
  \n## 获取启动所需的准备\n\n要开始 Mobile Services，你需要几样东西。\n\n![check.png](img/check.png) 一个\
  \ Azure 账户：如果你有 MSDN 许可，Azure 账户就包含在其中。只需登录 `manage.windowsazure.com` 使用你的 MSDN\
  \ 凭据并完成设置。如果你没有 MSDN 许可，有很多免费试用可用。只需访问 [`www.windowsazure.com`](http://www.windowsazure.com)\
  \ 查看那里有什么内容。\n\n![check.png](img/check.png) Mobile Services SDK：最新的 SDK 可以在 [`http://sempf.me/MobileServicesSdk`](http://sempf.me/MobileServicesSdk)\
  \ 找到。获取、下载并安装它。你就可以准备好了。\n\n### 创建新的移动服务\n\n你可以在 Azure 管理门户（Azure Management Portal）创建新的移动服务。你可以在\
  \ `manage.windowsazure.com` 找到门户：\n\n1. 点击左侧的 Mobile Services 标签页。它应该提示你目前没有 Mobile\
  \ Services，并询问是否想要添加一个。\n2. 点击添加服务的链接并填写表单。我在图 15-2 中展示了填写完全后的示例。\n\n* 所有 URL 必须是唯一的，因此在该字段中输入一些有意义的内容。记住，它对用户不可见。\n\
  * 在 Database 字段中选择 Create a New SQL Database（新建 SQL 数据库）。我将在下一节向你展示如何创建新数据库。\n*\
  \ 选择一个离你近的区域。\n3. 在 Specify Database 设置页面中，为了简单起见，保持默认名称，并使用高质量密码设置一些凭据。确保在 Region\
  \ Select 列表中 Mobile Services 和 Database 都部署在同一个区域。\n4. 点击勾号完成。\n\n**图 15-2：** 创建新的\
  \ Mobile Service。\n\n![9781118173350-fg1502.tif](img/_fmt.png)\n\n系统会运行一会，但没关系。至少它在微软的服务器上，而不是你的服务器，对吧？\n\
  \n完成后，点击 Mobile Services 标签页中的新行，你将进入新服务的着陆页，如图 15-3 所示。它现在还没有执行任何操作，但没关系。它已经这里了！\n\
  \n在我见过的任何软件产品中最酷的功能之一是，你可以点击 Create a New Windows 8 Application 链接，下载一个全新的模板，该模板已预填了将应用连接到服务所需的所有内容。这很棒。我将在本章后面的“连接你的\
  \ Windows Store 应用”中讨论如何将现有的移动应用连接到服务。\n\n### 构建数据库\n\n从图 15-3 所示的着陆页，你可以进入配置好的数据库。现在就操作。点击\
  \ Data 菜单项，Azure 友好地提示你没有表。点击 Add a Table 继续。\n\nCreate New Table（新建表）对话框允许你设置新的表名和一些权限。创建一个名为\
  \ `Notes` 的表，并保持默认权限设置。\n\n**图 15-3：** 进入服务的着陆页。\n\n![9781118173350-fg1503.tif](img/_fmt.png)\n\
  \n当 Azure 完成创建你的 `Notes` 表后，你可以点击它进入表着陆页。在这里，你可以浏览数据、针对数据编写脚本、管理表中的字段或更改表的权限。\n\n\
