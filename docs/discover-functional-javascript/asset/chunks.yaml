    \n以下是一个筛选未完成待办事项的示例：\n\n```\nconst filteredTodos = todos.filter(todo => !todo.completed);\n\
    //{id: 1, title: \"learn\", type: \"NC\", completed: false}\n```\n\n下面是用函数声明和箭头语法分别编写同一函数的示例：\n\
    \n```\nfunction isNewContent(todo){\n   return todo.type === \"NC\";\n}\n\nconst\
    \ isNewContent = todo => todo.type === \"NC\";\n```\n\n#### this\n\n箭头函数没有自己的\
    \ `this` 和 `arguments`。箭头函数不能用作构造函数。\n\n使用 `bind()`、`apply()` 或 `call()` 为箭头函数设置\
    \ `this` 的值是无效的。请看下面的代码：\n\n```\nthis.message = \"help\";\n\nconst logMessage\
    \ = () => { \n  console.log(this.message); \n}\n\nlogMessage(); //\"help\"\nlogMessage.call({message\
    \ : \"identify\"}); //\"help\"\n```\n\n`this` 和 `arguments` 被视为函数定义中使用的任何其他自由变量。\n\
    \n### 尾调用优化\n\n> 当递归调用是函数执行的最后一步时，该递归函数称为尾递归函数。\n\n尾递归函数的性能优于非尾递归函数。优化后的尾调用不会为每次函数调用创建新的栈帧，而是使用单个栈帧。\n\
    \nES6 在严格模式下引入了尾调用优化。\n\n以下函数应受益于尾调用优化：\n\n```\nfunction print(from, to) \n{ \n\
    \  const n = from;\n  if (n > to)  return;\n\n  console.log(n);\n\n//最后一条语句是递归调用\n\
    \  print(n + 1, to); \n}\n\nprint(1, 3);\n//1\n//2\n//3\n```\n\n请注意，主流浏览器尚未支持尾调用优化。\n\
    \n### Promise\n\n> Promise 是一个对象，表示异步操作可能产生的未来结果。\n\nPromise 可以处于三种状态之一：待定（pending）、已解决（resolved）或已拒绝（rejected）。Promise\
    \ 将保持待定状态，直到被解决或拒绝。\n\n#### 创建 Promise\n\n让我们使用 `Promise` 创建一个 `delay()` 函数：\n\
    \n```\nfunction delay(duration){\n  return new Promise(function(resolve, reject){\n\
    \    setTimeout(resolve, duration);\n  });\n}\n\nfunction logMessage(){\n  console.log(\"\
    process ended\");\n}\n\ndelay(5000)\n .then(logMessage);\n```\n\n`Promise` 构造函数接受一个参数，即一个称为“执行器函数”的函数。当\
    \ Promise 被创建时，该函数会立即执行。\n\n执行器函数接受两个回调：`resolve` 和 `reject`。\n\n*   调用 `resolve()`\
    \ 会解决 Promise。\n\n*   调用 `reject()` 会拒绝 Promise。\n\n这两个函数都可以接受一个参数。Promise 只会被解决或拒绝一次。之后对这些方法的任何调用都将无效。\n\
    \n#### 使用 Promise\n\n创建 Promise 后，可以注册回调。当 Promise 的结果已知时，这些回调将被调用。\n\n```\nfunction\
    \ fetchUsers(){ \n  return fetch(\"/users\"); \n}\n\nfunction doSomething(){ }\n\
    function handleError(error){ }\n\nfetchUsers()\n  .then(doSomething)\n  .catch(handleError);\n\
    ```\n\n当 Promise 被解决时，调用 `doSomething()`。当 Promise 被拒绝时，调用 `handleError()`。`doSomething()`\
    \ 不需要返回 Promise。\n\n`then()` 可以同时处理成功和失败，但更清晰的做法是使用它处理成功，使用 `catch()` 处理拒绝。\n\n\
    ### 最后思考\n\n`let` 和 `const` 声明并初始化变量。\n\n模块封装功能，只暴露一小部分。\n\n展开运算符、剩余参数和属性简写使表达更简单。\n\
    \nPromise 和尾递归完善了函数式编程工具箱。\n\n# 第 3 章：一等函数\n\n> JavaScript 最出色的地方在于其函数的实现。—— Douglas\
    \ Crockford，《JavaScript 语言精粹》作者\n\n### 一等函数\n\nJavaScript 拥有一等函数。这意味着函数可以像其他任何值一样使用。数字和函数都是值，因此我们可以像使用数字一样使用函数：\n\
    \n*   数字可以存储在变量中 → 函数可以存储在变量中。实际上，函数可以存储在变量、对象或数组中。\n\n*   数字可以作为参数传递给函数 → 函数可以作为参数传递给其他函数。\n\
    \n*   函数可以返回数字 → 函数可以返回其他函数。\n\n请看以下示例：\n\n```\n//存储在变量中\nfunction doSomething(){\
    \ }\n\n//存储在变量中\nconst doSomething = function (){ };\n\n//存储在属性中\nconst obj =\
    \ { \n   doSomething : function(){ } \n}\n\n//作为参数传递\nprocess(doSomething);\n\n\
    //从函数返回\nfunction createGenerator(){\n  return function(){\n  }\n}\n```\n\n函数名被视为变量。本质上，函数声明语法创建了一个保存函数的变量：\n\
    \n```\n//函数声明语法\nfunction doSomething() {}\n\n//等价于\nlet doSomething = function()\
    \ {}\n```\n\n### 高阶函数\n\n> 高阶函数是接受另一个函数作为参数、返回一个函数，或两者兼有的函数。\n\n让我们构建一个 `doWithLoading(fn)`\
    \ 高阶函数，它接受一个函数 `fn` 作为参数并执行它。它在输入函数执行前后显示加载消息。\n\n```\nfunction doWithLoading(fn){\n\
    \  console.log(\"start loading\");\n  const returnValue = fn();\n  console.log(\"\
    end loading\");\n  return returnValue;\n}\n\nfunction process() {\n  console.log(\"\
    process\");\n}\n\ndoWithLoading(process);\n//start loading\n//process\n//end loading\n\
    ```\n\n以函数式风格处理数组涉及使用一组内置的高阶函数：`filter()`、`map()` 和 `reduce()`。\n\n### filter()\n\
    \n> `filter()` 使用一个谓词函数从列表中选择值，该函数决定保留哪些值。\n\n```\nconst numbers = [1,2,3,4,5,6];\n\
    \nfunction isEven(number){\n  return number % 2 === 0;\n}\n\nconst evenNumbers\
    \ = numbers.filter(isEven);\n//element=1, isEven(1) is false → result=[]\n//element=2,\
    \ isEven(2) is true  → result=[2]\n//element=3, isEven(3) is false → result=[2]\n\
    //element=4, isEven(4) is true  → result=[2, 4]\n//element=5, isEven(5) is false\
    \ → result=[2, 4]\n//element=6, isEven(6) is true  → result=[2, 4, 6]\n//[2, 4,\
    \ 6]\n```\n\n> 谓词函数是接受一个参数并返回 `true` 或 `false` 的函数。它测试输入值是否满足条件。\n\n> 回调是作为参数传递给另一个函数的函数。\n\
    \n`isEven()` 是一个谓词函数，并作为回调使用。\n\n### map()\n\n> `map()` 使用映射函数将一个值列表转换为另一个值列表。\n\
    \n```\nfunction toCodeOfLength(number){\n  return \"a\".repeat(number);\n}\n\n\
    const numbers = [1, 2, 3];\nconst codes = numbers.map(toCodeOfLength);\n//element=1,\
    \ map to \"a\"   → result=[\"a\"]\n//element=2, map to \"aa\"  → result=[\"a\"\
    , \"aa\"]\n//element=3, map to \"aaa\" → result=[\"a\", \"aa\", \"aaa\"]\n//[\"\
    a\", \"aa\", \"aaa\"]\n```\n\n`toCodeOfLength()` 是一个映射函数。它接受一个值并计算出另一个值。\n\n###\
    \ reduce()\n\n> `reduce()` 使用归约函数将一个值列表归约为一个值。\n\n> 归约函数接受累加器值和当前值，并计算新的累加器值。`reduce()`\
    \ 方法对数组中的每个元素执行归约函数。\n\n```\nfunction addNumber(total, number){\n  return total\
    \ + number;\n}\n\nconst numbers = [1, 2, 3];\nconst total = numbers.reduce(addNumber,\
    \ 0);\n//element=1, total=0 → result=1\n//element=2, total=1 → result=3\n//element=3,\
    \ total=3 → result=6\n//6\n```\n\n`addNumber()` 是一个归约函数。\n\n"
- fmt: "\n`reduce(reducer, initialValue)` takes a second argument as the initial value\
    \ for the accumulator. If no value is provided, it sets the first element in the\
    \ array as the initial value and starts the loop from the second element.\n\n\
    ```\nconst numbers = [1, 2, 3];\nconst total = numbers.reduce(addNumber);\n//element=2,\
    \ total=1 → result=3\n//element=3, total=3 → result=6\n//6\n```\n\nThere is also\
    \ a `reduceRight()` method that starts from the last element in the list.\n\n\
    ```\nfunction multiply(product, value){\n  return product * value;\n}\n\nconst\
    \ numbers = [2, 3, 4];\nconst product = numbers.reduceRight(multiply, 1);\n//element=4,\
    \ product=1  → result=4\n//element=3, product=4  → result=12\n//element=2, product=12\
    \ → result=24\n//24\n```\n\nAs you note, when we multiply numbers the initial\
    \ value for the accumulator is 1.\n\n### `sort()`\n\n> `sort()` sorts the elements\
    \ of the array using a comparison function. It is an impure method, it modifies\
    \ the input array.\n\n> The comparison function takes two arguments, `a` and `b`\
    \ for example, and returns negative, positive or zero. When result is negative\
    \ then `a` comes before `b`. When it is positive `a` comes after `b`. When it\
    \ is zero, `a` and `b` are not sorted in regards to each other.\n\n```\nfunction\
    \ asc(a, b){\n  return a - b;\n}\n\nfunction desc(a, b){\n  return b - a;\n}\n\
    \nconst numbers = [1,3,2,6,4,5];\n\nnumbers.sort(asc);\n//[1, 2, 3, 4, 5, 6]\n\
    \nnumbers.sort(desc);\n//[6, 5, 4, 3, 2, 1]\n```\n\n`asc()` and `desc()` are comparison\
    \ functions. Given the same input, the comparison function should always return\
    \ the same output.\n\n### Extended toolbox\n\n> `find()` returns the first value\
    \ that satisfies the predicate function. It stops processing when it finds the\
    \ first value.\n\n> `findIndex()` returns the index of the first value that satisfies\
    \ the predicate function.\n\n> `some()` checks if at least one value in the list\
    \ passes the test implemented by the predicate function. It stops processing when\
    \ the predicate returns `true`.\n\n> `every()` checks if all values in the list\
    \ pass the test implemented by the predicate function. It stops processing when\
    \ the predicate returns `false`.\n\nLet’s use them:\n\n```\nconst numbers = [1,2,3,4,5,6];\n\
    \nconst firstEven = numbers.find(isEven);\n//2\n\nconst firstEvenIndex = numbers.findIndex(isEven);\n\
    //1\n\nconst areAllEven = numbers.every(isEven);\n//false\n\nconst hasOneEven\
    \ = numbers.some(isEven);\n//true\n```\n\n> `forEach()` calls the callback function\
    \ for each element in an array, in order.\n\n```\nfunction log(value){\n  console.log(value);\n\
    }\n\nconst numbers = [1,2,3];\nnumbers.forEach(log);\n//1\n//2\n//3\n```\n\nAll\
    \ these array methods are built-in higher-order functions.\n\n### Final thoughts\n\
    \nHaving first-class functions is the ability to use functions as values. It makes\
    \ it easy to pass around behavior and work with functions like with any other\
    \ values.\n\n`filter()`, `map()`, `reduce()` make the basic toolbox for working\
    \ with collections in a functional style.\n\n# Chapter 4: Closures\n\n> Closure\
    \ is an inner function that has access to the outer scope, even after the outer\
    \ scope container has executed.\n\nThe scope defines the lifetime and visibility\
    \ of a variable. The outer scope container can be a function, a block, or a module.\n\
    \n### Nested functions\n\nFunctions can be nested inside other functions. Consider\
    \ the next code:\n\n```\n(function autorun(){\n    let x = 1;\n    function log(){\
    \ \n       console.log(x); \n    }\n    log();\n})();\n```\n\n`log()` is a nested\
    \ function. `log()` accesses variable `x` from its outer scope. The `log()` function\
    \ is a closure. The outer scope container is the outer function.\n\nThe inner\
    \ function accessing variables from the outer function is a closure.\n\n### Lexical\
    \ scope\n\nLexical scope is the ability of the inner function to access the outer\
    \ scope in which it is defined. Consider the next code:\n\n```\n(function autorun(){\n\
    \    let x = 1;\n    function log(){\n      console.log(x);\n    };\n\n    function\
    \ run(fn){\n      let x = 100;\n      fn();\n    }\n\n    run(log); //1\n})();\n\
    ```\n\nThe `log()` function is a closure. It refers to the `x` variable from its\
    \ parent function `autorun()`. `log()` doesn’t use the `x` variable from the `run()`\
    \ function.\n\nThe closure function has access to the scope in which it is created,\
    \ not the scope in which it is executed.\n\nThe local function scope of `autorun()`\
    \ is the lexical scope of the `log()` function.\n\n### Surviving parent execution\n\
    \nClosure becomes important when the inner function survives the execution of\
    \ the parent scope container. This happens in the following situations:\n\n* \
    \  The inner function is used as a callback for an asynchronous task like a timer,\
    \ an event or a network call\n\n*   The parent function or module returns the\
    \ inner function or returns an object storing the inner function\n\nConsider the\
    \ next examples:\n\n#### Timer\n\n```\n(function autorun(){\n  let x = 1;\n  setTimeout(function\
    \ log(){\n    console.log(x);\n  }, 10000);\n})();\n```\n\nThe `x` variable lives\
    \ until the `log()` function invocation.\n\nIf `setInterval()` had been used,\
    \ the `x` variable would have lived forever or until `clearInterval()` was called.\n\
    \n#### Event\n\n```\n(function autorun(){\n  let x = 1;\n  $(\"#btn\").click(function\
    \ log(){\n    console.log(x);\n  });\n})();\n```\n\nWhen the variable `x` is used\
    \ in an event handler, it lives forever or until the handler is removed.\n\n####\
    \ Network call\n\n```\n(function autorun(){\n  let x = 1;\n  fetch(\"/todos\"\
    ).then(function log(){\n    console.log(x);\n  });\n})();\n```\n\nThe `x` variable\
    \ lives until the response gets back from the Web API and the callback is executed.\n\
    \nIn all these cases, `log()` is a closure and survives the invocation of the\
    \ parent function.\n\nThe variable lifetime depends on the closure lifetime. Variables\
    \ live as long as the closure referring them lives. If a variable is shared by\
    \ many closures, all closures should be garbage collected before the variable\
    \ is garbage collected.\n\n### Closures in loop\n\nClosures store references to\
    \ outer variables, they don’t copy the actual values. Check the next example:\n\
    \n```\nfunction initEvents(){\n  for(var i=1; i<=3; i++){\n    $(\"#btn\"+i).click(function\
    \ log(){\n      console.log(i); //4\n    });\n  }\n}\n\ninitEvents();\n```\n\n\
    In this example, three closures were created, all sharing the same `i` variable.\
    \ All three closures are event handlers. Because `i` changes during the loop,\
    \ all logs will display the same value, the last one.\n\nThe simplest way to fix\
    \ this issue is to use the `for` statement with a `let` declaration inside. It\
    \ will create a variable local to the block scope for each iteration.\n\n```\n\
    function initEvents(){\n  for(let i=1; i<=3; i++){\n    $(\"#btn\"+i).click(function\
    \ log(){\n      console.log(i); //1 2 3\n    });\n  }\n}\n\ninitEvents();\n```\n\
    \nWhen the variable declaration is done outside the `for` statement, even if it\
    \ is done with `let`, all closures will use the same variable. All logs will display\
    \ the same value, the last one.\n\n```\nfunction initEvents(){\n  let i;  \n \
    \ for(i=1; i<=3; i++){\n    $(\"#btn\"+i).click(function log(){\n      console.log(i);\
    \ //4\n    });\n  }\n}\n```\n\n### Generators\n\n> A generator is a function that\
    \ returns the next value from the sequence each time it is called.\n\nI think\
    \ the ES6 generator is an unnecessary feature that makes code more complicated.\n\
    \nThe ES6 generator creates an object that has the `next()` method. The `next()`\
    \ method creates an object that has the `value` property. ES6 generators promote\
    \ the use of loops and in functional programming, we want to get away from loops.\n\
    \nConsider the ES6 generator below:\n\n```\nfunction* sequence(){\n  let count\
    \ = 0;\n  while(true) {\n    count += 1;\n    yield count;\n  }\n}\n\nconst generator\
    \ = sequence();\ngenerator.next().value; //1\ngenerator.next().value; //2\ngenerator.next().value;\
    \ //3\n```\n\nThe same generator can be simply implemented with a closure:\n\n\
    ```\nfunction sequence(){\n  let count = 0;\n  return function(){\n    count +=\
    \ 1;\n    return count;\n  }\n}\n\nconst generator = sequence();\ngenerator();\
    \ //1\ngenerator(); //2\ngenerator(); //3\n```\n"
