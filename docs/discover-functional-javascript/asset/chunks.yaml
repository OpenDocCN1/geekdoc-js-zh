  trans: "\n对象可以嵌套在其他对象内部。请看下一个示例：\n\n```\nconst book = {\n  title : \"How JavaScript\
    \ Works\",\n  author : {\n    firstName : \"Douglas\",\n    lastName : \"Crockford\"\
    \n  }\n}\n\nbook.author.firstName; //\"Douglas\"\n```\n\n通过这种方式，我们可以创建一个命名空间：\n\
    \n```\nconst app = {};\n\napp.authorGateway = { \n  getAuthors : function() {}\
    \ \n};\n\napp.bookGateway = { \n  getBooks : function() {} \n};\n```\n\n### 函数作为值\n\
    \n当函数被用作属性的值时，它通常会成为一个方法。在方法内部，`this` 关键字用于引用当前对象。然而，`this` 的值会根据函数的调用方式而有所不同。\n\
    \n### 原型\n\n对象有一个指向原型对象的“隐藏”链接 `__proto__`，并从中继承属性。\n\n例如，通过对象字面量创建的对象有一个指向 `Object.prototype`\
    \ 的链接：\n\n```\nconst obj = {};\nobj.__proto__ === Object.prototype; //true\n```\n\
    \n对象从其他对象继承。\n\n原型继承具有节省内存的优点。原型只创建一次，并被所有实例使用。\n\n#### 原型链\n\n原型对象自身也有一个原型。当访问一个属性而对象本身不包含它时，引擎会沿着原型对象向下查找，直到找到请求的属性或到达\
    \ `null`。\n\n#### 只读\n\n原型链接仅用于读取值。当进行修改时，只会在当前对象上进行，而不会影响其原型，即使原型上存在同名的属性也是如此。\n\
    \n#### 内置原型\n\n数字继承自 `Number.prototype`，而 `Number.prototype` 又继承自 `Object.prototype`。\n\
    \n```\nlet no = 1;\nno.__proto__ === Number.prototype; //true\nno.__proto__.__proto__\
    \ === Object.prototype; //true\n```\n\n字符串继承自 `String.prototype`。布尔值继承自 `Boolean.prototype`。数组继承自\
    \ `Array.prototype`。函数继承自 `Function.prototype`。\n\n所有对象、函数和原始值（除了 `null` 和 `undefined`）都从\
    \ `Object.prototype` 继承属性。例如，它们都有 `toString()` 方法。\n\n### 映射\n\n我们可以将对象视为一个映射。映射中的键是对象属性的名称。\n\
    \n访问键不需要扫描所有属性。它的访问时间是 O(1)。\n\n`Object.create(null)` 创建一个没有原型的对象。通常用于创建映射。\n\n\
    ```\nconst italian = Object.create(null); \n\nitalian[\"Yes\"] = \"Si\"; \nitalian[\"\
    No\"]  = \"No\";  \n\nitalian[\"Yes\"]; //\"Si\"\n```\n\n### 对象字面量\n\n对象字面量提供了一种简单优雅的创建对象的方式。\n\
    \n```\nconst timer = {\n  secret: 0,\n  start : function() {},\n  stop : function()\
    \ {},\n}\n```\n\n然而，这种语法有一些缺点。所有属性都是公开的，方法可以被重新定义，并且我们无法在新实例上使用相同的方法。\n\n```\n\
    timer.secret; //0 \ntimer.start = function() { \n  console.log(\"don't start\"\
    );\n}\ntimer.start(); //\"don't start\"\n```\n\n### Object.create()\n\n`Object.create(prototypeObject)`\
    \ 创建一个新对象，并将参数对象作为其原型。\n\n使用 `Object.create()`，我们可以创建一个新的 `timer` 对象，其原型为 `timerPrototype`。这意味着\
    \ `start()` 和 `stop()` 方法在 `timer` 对象上可用。同时，`timer` 的 `__proto__` 属性指向 `timerPrototype`\
    \ 对象。\n\n```\nconst timerPrototype = {\n  start : function() {},\n  stop : function()\
    \ {}\n};\n\nconst timer = Object.create(timerPrototype);\ntimer.__proto__ ===\
    \ timerPrototype; //true\n```\n\n当原型被冻结时，继承自它的对象将无法更改其中定义的属性。在这种情况下，`start()`\
    \ 和 `stop()` 方法不能被重新定义。\n\n```\nconst timerPrototype = Object.freeze({\n  start\
    \ : function() {},\n  stop : function() {}\n});\n\nconst timer = Object.create(timerPrototype);\n\
    timer.start = function() { \n  console.log(\"don't start\"); \n}\n//Cannot assign\
    \ to read only property 'start' of object\n```\n\n`Object.create(timerPrototype)`\
    \ 可用于构建更多具有相同原型的对象。\n\n### 函数构造函数\n\n最初，该语言提出了函数构造函数作为构建具有自定义原型的对象的语法糖。请看下一个示例：\n\
    \n```\nfunction Timer(){\n  this.secret = 0;\n}\n\nTimer.prototype = {\n  start\
    \ : function() {},\n  stop : function() {}\n}\n\nconst timer = new Timer();\n\
    timer.start();\n```\n\n所有使用 `function` 关键字定义的函数都可以用作函数构造函数。函数构造函数通过 `new` 运算符调用。新对象的原型被设置为\
    \ `FunctionConstructor.prototype`。\n\n```\nconst timer = new Timer();\ntimer.__proto__\
    \ === Timer.prototype;\n```\n\n为了防止方法被重新定义，原型应该被冻结。\n\n```\nTimer.prototype =\
    \ Object.freeze({\n  start : function() {},\n  stop : function() {}\n});\n```\n\
    \n#### new\n\n当执行 `new Timer()` 时，它会执行与 `newTimer()` 函数类似的步骤：\n\n```\nfunction\
    \ newTimer(){\n  let newObj = Object.create(Timer.prototype);\n  let returnObj\
    \ = Timer.call(newObj, arguments);\n  if(returnObj) return returnObj;\n\n  return\
    \ newObj;\n}\n```\n\n创建一个新对象，其原型为 `Timer.prototype`。然后运行 `Timer` 函数，在新对象上设置字段。\n\
    \n### 类\n\n`class` 提供了更好的语法糖，用于构建具有自定义原型的对象。请看下一个示例：\n\n```\nclass Timer{\n  constructor(){\n\
    \    this.secret = 0;\n  }\n\n  start() {}\n  stop() {}  \n}\n```\n\n使用 `class`\
    \ 构建的对象，其原型被设置为 `ClassName.prototype`。\n\n```\nconst timer = new Timer();\ntimer.__proto__\
    \ === Timer.prototype;\n```\n\n为了避免方法被重新定义，我们需要冻结类的原型。\n\n```\nObject.freeze(Timer.prototype);\n\
    ```\n\n### 无隐私\n\n基于原型的继承模式没有隐私。所有对象的属性都是公开的。\n\n`Object.keys()` 返回一个包含所有自有属性键的数组。它可以用于遍历对象的属性。\n\
    \n```\nfunction logProperty(name){\n  console.log(name); //property name\n  console.log(obj[name]);\
    \ //value\n}\n\nObject.keys(obj).forEach(logProperty);\n```\n\n### 最终思考\n\n对象本质上是动态的，可以用作映射。所有对象的属性都是公开的。\n\
    \n对象从其他对象继承。\n\n构造函数和类是创建继承自自定义原型对象的语法糖。它们首先定义包含所有方法的自定义原型，然后 `new` 运算符创建继承自该原型的对象。\n\
    \n# 第 14 章：使用闭包的对象\n\n> 闭包——是函数可以嵌套以及函数是一等值的结果，JavaScript 拥有它，并且其实现方式几乎完全正确，这可能是编程语言中最好的特性。——\
    \ Douglas Crockford\n\n闭包可以作为具有私有状态的函数来创建。不仅如此，我们还可以创建多个共享相同私有状态的闭包。这样，我们可以将对象构建为闭包的集合。闭包封装了状态。\n\
    \n### 工厂函数\n\n让我们看看如何做到这一点。我们从揭示模块模式开始，给该函数命名，并用它来构建新的封装对象。以下是一个 `Counter` 函数的示例，它可以创建计数器对象：\n\
    \n```\nfunction Counter(){\n    let state = 0;\n\n    function increment(){\n\
    \       state += 1;\n       return state;\n    }\n\n    function decrement(){\n\
    \       state -= 1;\n       return state;\n    }\n\n    return Object.freeze({\n\
    \       increment,\n       decrement\n    });\n};\n\nconst counter = Counter();\n\
    counter.increment(); //1\ncounter.increment(); //2\ncounter.increment(); //3\n\
    \nconst otherCounter = Counter();\notherCounter.increment(); //1\n```\n\n`Counter`\
    \ 函数被称为工厂函数。以这种方式构建的对象具有一系列优点。\n\n### 封装\n\n封装意味着信息隐藏。\n\n"
- fmt: "\nWhen using closures, only the methods exposed are public, everything else\
    \ is encapsulated.\n\n```\nconst counter = Counter();\ncounter.state; //undefined\n\
    ```\n\nThe private data of the object can be modified only through its public\
    \ methods.\n\n### Immutable public interface\n\nThe public interface of an object\
    \ created using a factory function is immutable. Notice the use of `Object.freeze()`\
    \ on the returned object containing the public methods.\n\n```\nconst counter\
    \ = Counter();\ncounter.increment = function() { \n    console.log(\"don't increment\"\
    ); \n}\n//Cannot assign to read only property 'increment' of object\n```\n\n###\
    \ No `this`\n\nThere are no `this` changing context issues simply because when\
    \ building objects with closures, `this` is not used at all.\n\nLet’s build a\
    \ few other objects with closures and compare them with the ones built with prototypes.\n\
    \n### Timer\n\nThe timer object is used to do asynchronous operations at a specific\
    \ interval. In contrast with `setInterval` it waits for the previous operation\
    \ to finish before making a new call. It implements the Recursive setTimeout pattern.\
    \ Below the timer object is created both with prototypes and with closures\n\n\
    Timer with prototypes\n\n```\nclass Timer {\n  constructor(callback, interval){\n\
    \    this.callback = callback;\n    this.interval = interval;\n    this.timerId\
    \ = 0;\n }\n\n executeAndStartTimer(){\n   this.callback().then(() => {\n    \
    \   this.timerId = setTimeout(this.executeAndStartTimer, \n          this.interval);\n\
    \   });\n }\n\n start(){\n   if(this.timerId === 0){\n     this.executeAndStartTimer();\n\
    \   }\n }\n\n stop(){\n   if(this.timerId !== 0){\n     clearTimeout(this.timerId);\n\
    \     this.timerId = 0;\n   }\n }\n}\n\nfunction getTodos(){\n  return fetch(\"\
    /todos\");\n}\n\nconst timer = new Timer(getTodos,2000);\ntimer.start();\n```\n\
    \nTimer with closures\n\n```\nfunction Timer(callback, interval){\n  let timerId;\n\
    \n  function executeAndStartTimer(){\n    callback().then(function makeNewCall(){\n\
    \      timerId = setTimeout(executeAndStartTimer, interval);\n    });\n  }\n\n\
    \  function stop(){\n    if(timerId){\n      clearTimeout(timerId);\n      timerId\
    \ = 0;\n    }\n  }\n\n  function start(){\n    if(!timerId){\n      executeAndStartTimer();\n\
    \    }\n  }\n\n  return Object.freeze({\n    start,\n    stop\n  });  \n}\n\n\
    const timer = Timer(getTodos, 2000);\ntimer.start();\n```\n\n#### Encapsulation\n\
    \nWith `class` all members, fields, and methods, of the object, are public.\n\n\
    With closures only the `start()` and `stop()` methods are public.\n\nThe `timerId`\
    \ and `executeAndStartTimer()` are private.\n\n#### Immutable public interface\n\
    \nThe public interface of an object created with `class` can be modified.\n\n\
    ```\nconst timer = new Timer(getTodos,2000);\ntimer.start = function() { \n  console.log(\"\
    don't start\"); \n}\ntimer.start(); //\"don't start\"\n```\n\nThe public interface\
    \ of an object created with closures and `Object.freeze()` is immutable.\n\n####\
    \ No `this`\n\n`this` may unexpectedly lose context when the method is used as\
    \ a callback. It may lose context when used in nested functions.\n\nConsider the\
    \ next example where `this` loses context when  \n\n`executeAndStartTimer()` is\
    \ used as a callback.\n\n```\nexecuteAndStartTimer(){\n   this.callback().then(()\
    \ => {\n       this.timerId =  \n       setTimeout(this.executeAndStartTimer,\
    \ this.interval);\n   });\n }\n```\n\nWhen the `start()` method is used as an\
    \ event handler, like in the code below, `this` loses context:\n\n```\n$(\"#btnStart\"\
    ).click(timer.start);\n```\n\nThere are no such issues when using closures as\
    \ `this` is not used.\n\nJavaScript without `this` looks like a better functional\
    \ programming language.\n\n### Stack\n\nThe stack is a data structure with two\
    \ principal operations: `push()` for adding an element to the collection, and\
    \ `pop()` for removing the most recent element added. It adds and removes elements\
    \ according to the LIFO, Last In First Out, principle.\n\nLook at the next example:\n\
    \n```\nconst stack = Stack();\nstack.push(1);\nstack.push(2);\nstack.push(3);\n\
    stack.pop(); //3\nstack.pop(); //2\n```\n\nLet’s implement the stack with closures:\n\
    \n```\nfunction Stack(){\n  const list = [];\n\n  function push(value){ \n   \
    \ list.push(value); \n  }\n\n  function pop(){ \n    return list.pop(); \n  }\n\
    \n  return Object.freeze({\n    push,\n    pop\n  });\n}\n```\n\nThe stack object\
    \ has two public methods `push()` and `pop()`. The internal state can only be\
    \ changed through these methods.\n\nWe can’t modify directly the internal state:\n\
    \n```\nconst stack = Stack();\nstack.list = null;\n//Cannot add property list,\
    \ object is not extensible\n```\n\n### Queue\n\nThe queue is a data structure\
    \ with two principal operations: `enqueue()` for adding an element to the collection,\
    \ and `dequeue()` for removing the first element from the collection. It adds\
    \ and removes elements according to the FIFO, First In First Out, principle.\n\
    \nHere is an example:\n\n```\nconst queue = Queue();\nqueue.enqueue(1);\nqueue.enqueue(2);\n\
    queue.enqueue(3);\nqueue.dequeue(); //1\nqueue.dequeue(); //2\n```\n\nTake a look\
    \ at a queue implemented with closures:\n\n```\nfunction Queue(){\n  const list\
    \ = [];\n\n  function enqueue(value){ \n    list.push(value); \n  }\n\n  function\
    \ dequeue(){ \n    return list.shift(); \n  }\n\n  return Object.freeze({\n  \
    \  enqueue,\n    dequeue\n  });\n}\n```\n\nAs we have seen before, the internal\
    \ state of the object can’t be accessed from the outside.\n\n### Event emitter\n\
    \nAn event emitter is an object with a publish/subscribe public interface. It\
    \ is used to communicate between different parts of an application.\n\nLook at\
    \ the next example:\n\n```\nconst eventEmitter = EventEmitter();\n\neventEmitter.subscribe(\"\
    update\", doSomething);\neventEmitter.subscribe(\"update\", doSomethingElse);\n\
    eventEmitter.subscribe(\"add\", addItem);\n\neventEmitter.publish(\"update\",\
    \ {});\n\nfunction doSomething(value) { }\nfunction doSomethingElse(value) { }\n\
    function addItem(value) { }\n```\n\nFirst, we subscribe with two functions for\
    \ the `update` event, and with one function for the `add` event. When the event\
    \ emitter publishes the `update` event, `doSomething()` and `doSomethingElse()`\
    \ will be called.\n\nHere is an implementation of a simple event emitter:\n\n\
    ```\nimport partial from \"lodash/partial\";\n\nfunction EventEmitter(){\n  const\
