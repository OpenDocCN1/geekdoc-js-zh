  trans: "\n\n使用闭包构建的对象封装数据，支持组合，并且没有 `this` 上下文变化的问题。\n\n# 第 15 章：方法装饰器\n\n> 装饰器就像关键字或注解，记录方法的行为，但将这些次要关注点与方法的核心逻辑清晰分离。——雷金纳德·布雷思韦特，《JavaScript\
    \ Allongé》作者\n\n方法装饰器是一种复用通用逻辑的工具。它们与面向对象编程相辅相成。装饰器封装了不同对象共享的职责。\n\n考虑以下代码：\n\n\
    ```\nfunction TodoStore(currentUser){\n  const todos = [];\n\n  function add(todo){\n\
    \    const start = Date.now();\n    if(currentUser.isAuthenticated()){\n     \
    \ todos.push(todo);\n    } else {\n      throw new Error(\"Not authorized\");\n\
    \    }\n\n    const duration = Date.now() - start;\n    console.log(\"add() duration\
    \ : \" + duration);\n  }\n\n  return Object.freeze({\n    add\n  });  \n}\n\n\
    const currentUser = {\n  isAuthenticated : function(){\n    return true;\n  }\n\
    }\n\nconst todoStore = TodoStore(currentUser);\ntodoStore.add({ title : \"learn\"\
    });\n//\"add() duration : 0\"\n```\n\n`add()` 方法的主要职责是将新的 `todo` 添加到内部状态，同时还有两个次要职责：验证用户身份和记录执行时长。这些次要关注点可能会在其他方法中重复出现。\n\
    \n假设我们将这两个次要职责分解为两个意图明确的函数装饰器：`authorize()` 和 `logDuration()`。然后我们将它们组合起来创建原始函数。\n\
    \n```\nimport { compose } from \"./tools\";\nimport { logDuration, authorize }\
    \ from \"./decorators\";\n\nfunction TodoStore(){\n  const todos = [];\n\n  function\
    \ add(todo){\n    todos.push(todo);\n  }\n\n  return Object.freeze({\n     add:\
    \ compose(logDuration, authorize)(add) \n  }); \n}\n```\n\n现在 `add()` 方法只负责将 `todo`\
    \ 添加到列表中。其他职责通过装饰方法来实现。\n\n### 记录时长\n\n一个常见的场景是记录方法调用的时长。下面的装饰器记录了同步调用的时长。\n\n\
    ```\nfunction logDuration(fn){\n  return function(...args){\n    const start =\
    \ Date.now();\n    const result = fn(...args);\n    const duration = Date.now()\
    \ - start;\n    console.log(fn.name + \"() duration : \" + duration);\n    return\
    \ result;\n  }\n}\n```\n\n### 授权\n\n`authorize()` 装饰器确保用户有权执行该方法。这个装饰器更复杂，因为它依赖于另一个对象\
    \ `currentUser`。在这种情况下，我们可以使用函数 `createAuthorizeDecorator()` 来构建装饰器。只有当用户通过身份验证时，装饰器才会执行原始方法。\n\
    \n```\nfunction createAuthorizeDecorator(currentUser) {\n  return function authorize(fn)\
    \ {\n    return function(...args) {\n      if (currentUser.isAuthenticated())\
    \ {\n        return fn(...args);\n      } else {\n        throw new Error(\"Not\
    \ authorized\");\n      }\n    };\n  };\n}\n```\n\n现在，我们可以创建装饰器并传入依赖。\n\n```\n\
    const authorize = createAuthorizeDecorator(currentUser);\n```\n\n### 装饰器组合\n\n\
    通常我们需要在一个方法上应用多个装饰器。一种简单的方法是依次调用装饰器：\n\n```\nfunction add() { }\n\nconst addWithAuthorize=\
    \ authorize(add);\nconst addWithAuthorizeAndLog= logDuration(addWithAuthorize);\n\
    addWithAuthorizeAndLog();\n```\n\n另一种方法是组合所有装饰器，然后将新装饰器应用于原始函数。\n\n```\nimport\
    \ { compose } from \"./tools\";\n\nconst composedDecorator = compose(logDuration,\
    \ authorize);\nconst addWithComposedDecorator = composedDecorator(add);\naddWithComposedDecorator();\n\
    ```\n\n下面使用 `compose()` 函数将装饰器应用于 `add()` 方法：\n\n```\nimport { compose } from\
    \ \"./tools\";\n\nfunction TodoStore(){\n  function add(){}\n\n  return Object.freeze({\n\
    \     add: compose(logDuration, authorize)(add) \n  });  \n}\n\nconst todoStore\
    \ = TodoStore();\ntodoStore.add();\n```\n\n### 装饰器顺序\n\n在某些情况下，装饰器的执行顺序可能并不重要。但通常顺序确实很重要。\n\
    \n在我们的示例中，它们从左到右执行：\n\n*   首先，开始记录时长\n*   其次，执行授权\n*   最后，调用原始方法\n\n### 装饰对象的所有方法\n\
    \n在某些情况下，我们可能需要将装饰器应用于对象的所有公共方法。我们可以创建 `decorateMethods()` 函数来将装饰器应用于对象的所有公共方法。\n\
    \n```\nfunction decorateMethods(obj, ...decorators) {\n  const newObject = { ...obj\
    \ };\n  Object.keys(newObject).forEach(function(fnName) {\n    if (typeof newObject[fnName]\
    \ === \"function\") {\n      newObject[fnName] = \n          compose(...decorators)(newObject[fnName]);\n\
    \    }\n  });\n  return newObject;\n}\n```\n\n我们可能希望直接将装饰器应用于创建对象的函数。`decorate()`\
    \ 函数可以做到这一点：\n\n```\nfunction decorate(factory, ...decorators) {\n  return function(...args)\
    \ {\n    const newObject = decorateMethods(factory(...args), \n              \
    \                        ...decorators);\n    return Object.freeze(newObject);\n\
    \  };\n}\n```\n\n在下一个示例中，由 `TodoStore` 创建的对象的所有公共方法都使用 `logDuration()` 和 `authorize()`\
    \ 进行了装饰。\n\n```\nimport { decorate } from \"./tools\";\nimport { logDuration,\
    \ authorize } from \"./decorators\";\n\nfunction TodoStore(){  \n  function get(){}\n\
    \  function add(todo){ }\n  function edit(id, todo){}\n  function remove(id){}\n\
    \n  return Object.freeze({\n      get,\n      add,\n      edit,\n      remove\n\
    \  });  \n}\n\nexport default decorate(TodoStore, logDuration, authorize);\n```\n\
    \n### 使用纯函数的存储\n\n借助装饰器，我们可以将纯代码与不纯代码分离。考虑以下示例：\n\n```\nexport default function\
    \ TodoStore() {\n  let todos = [];\n\n  function add(todos, todo) {\n    return\
    \ todos.concat([todo]);\n  }\n\n  function addAndMutate(todo) {\n    todos = add(todos,\
    \ todo);\n  }\n\n  return Object.freeze({\n    add: addAndMutate\n  });\n}\n```\n\
    \n在这个例子中，`add()` 是一个纯函数，而 `addAndMutate()` 是不纯的。为了修改 `todos` 状态，我们需要使用不纯函数。如果我们把不纯代码封装在像下面\
    \ `setter` 这样的装饰器中呢？\n\n```\nimport { decorateMethods } from \"./tools\";\n\n\
    function Store(storeConfig) {\n  return function() {\n    let state = storeConfig.state;\n\
    \n    function setter(fn) {\n      return function(...args) {\n        state =\
    \ fn(state, ...args);\n      };\n    }\n\n    function getter(fn) {\n      return\
    \ function(...args) {\n        return fn(state, ...args);\n      };\n    }\n\n\
    \    return Object.freeze({\n      ...decorateMethods(storeConfig.getters, getter),\n\
    \      ...decorateMethods(storeConfig.setters, setter)\n    });\n  };\n}\n\nexport\
    \ default Store;\n```\n\n`getter()` 接收一个纯函数，并创建一个函数，该函数返回经过纯函数转换后的当前状态。\n\n`setter()`\
    \ 接收一个纯函数，并创建一个使用纯函数修改状态的函数。\n\n借助像 `Store.js` 这样的库，我们可以仅使用纯函数来编写 `TodoStore`：\n\
    \n```\nimport Store from \"./Store\";\n\nfunction add(todos, todo) {\n  return\
    \ todos.concat([todo]);\n}\n\nexport default Store({\n  state: [],\n  setters:\
    \ { add }\n});\n```\n\n当执行 `todoStore.add({ title: \"verify\" })` 时，`setter()`\
    \ 装饰器会调用 `add()` 纯函数，并将当前 `state` 作为第一个参数，新的 `todo` 作为第二个参数。然后，`setter()` 装饰器使用结果来更改\
    \ `state`。\n\n### 最终思考\n\n装饰器封装了对象之间可复用的通用逻辑。它们与面向对象编程相辅相成。\n\n装饰器提高了可读性。代码更加清晰，因为它专注于主要职责，而不会被次要逻辑所模糊。\n\
    \n"
- fmt: "\n# Chapter 16: Waiting for the new programming paradigm\n\n> Knowledge builds\
    \ on knowledge.— John Carmack\n\nJavaScript makes functional programming popular\
    \ and offers a new way of building encapsulated objects with closures. While waiting\
    \ for the new programming paradigm let’s see what got us here.\n\n### OOP with\
    \ classes\n\nIn 1985 C++ came out and added classes to the C language. Classes\
    \ define the data and behavior of objects. Objects are instances of classes. Class\
    \ members can be `private`, `protected` or `public`.\n\nIn 1995 Java, one of the\
    \ most successful programming languages was lunched. Classes are the basic unit\
    \ of code, everything should be inside a class. In a class, `this` references\
    \ the current object.\n\nLet’s create a `TodoStore` class that manages a list\
    \ of `todos`. The `TodoStore` class has a private list and two public methods:\
    \ `push()` and `getBy()`. The `Todo` class defines the `todo` transfer object.\
    \ The two classes are then used in the `main()` function.\n\n```\nimport java.util.List;\n\
    import java.util.ArrayList;\nimport java.util.stream.Collectors;\n\npublic class\
    \ TodoStore\n{\n  private List<Todo> list;\n\n  public TodoStore()\n  {\n    this.list\
    \ = new ArrayList<Todo>();\n  }\n\n  public void push(Todo todo)\n  {\n    list.add(todo);\n\
    \  }\n\n  public List<Todo> getBy(String text)\n  {\n    return list.stream()\n\
    \      .filter(todo -> todo.Title.contains(text))\n      .collect(Collectors.toList());\n\
    \  }\n}\n\npublic class Todo \n{\n  public Integer Id;\n  public String Title;\n\
    \n  public Todo(Integer id, String title) \n  {\n    this.Id = id;\n    this.Title\
    \ = title;\n  }\n}\n\npublic class StartApplication\n{\n  public static void main(String[]\
    \ args)\n  {\n    TodoStore todoStore = new TodoStore();\n\n    todoStore.push(new\
    \ Todo(1, \"find\"));\n    todoStore.push(new Todo(2, \"read\"));\n    todoStore.push(new\
    \ Todo(3, \"share\"));\n\n    List<Todo> filterTodos = todoStore.getBy(\"read\"\
    );\n    System.out.print(\"Count:\" + filterTodos.size());\n  }\n}\n```\n\nClasses\
    \ brought encapsulation.\n\nEncapsulation means information hiding. It is about\
    \ hiding as much as possible of the object’s internal parts and exposing a minimal\
    \ public interface.\n\n### OOP with prototypes\n\nIn 1987 the [Self](https://en.wikipedia.org/wiki/Self_(programming_language))\
    \ language was released. It aimed to simplify class inheritance by replacing classes\
    \ with prototypes. Objects can inherit from other objects. Self was a dynamically\
    \ typed, prototype-based experimental language.\n\nIn 1995 the JavaScript language\
    \ was created. In a way it put together the prototypes patterns ideas from the\
    \ Self language with the functional patterns from [Scheme](https://en.wikipedia.org/wiki/Scheme_(programming_language)),\
    \ in a Java-like syntax.\n\n`class` in JavaScript is sugar-syntax for creating\
    \ objects with a custom prototype. Let’s remake the previous `TodoStore` using\
    \ prototypes:\n\n```\nclass TodoStore{\n  constructor(){\n    this.list = [];\n\
    \  }\n\n  push(todo){\n    this.list.push(todo);\n  }\n\n  getBy(text){\n    return\
    \ this.list\n               .filter(todo => todo.title.includes(text));\n  }\n\
    }\n\nclass Todo{\n  constructor(id, title){\n    this.id = id;\n    this.title\
    \ = title;\n  }\n}\n\n(function startApplication(){\n  const todoStore = new TodoStore();\n\
    \n  todoStore.push(new Todo(1, \"find\"));\n  todoStore.push(new Todo(2, \"read\"\
    ));\n  todoStore.push(new Todo(3, \"share\"));\n\n  const filterTodos = todoStore.getBy(\"\
    read\");\n  console.log(\"Count:\" + filterTodos.length);\n})();\n```\n\nThe prototype\
    \ system is more flexible than classes and is good at memory conservation, but\
    \ it turns out to have some drawbacks:\n\n*   No encapsulation. All members, data,\
    \ and methods, are public.\n\n*   The public interface of the object is mutable.\
    \ It can be changed from the outside.\n\n*   The need to manage the `this` losing\
    \ context problems.\n\n### Functional programming\n\nJavaScript rediscovered and\
    \ brought to the mainstream the functional programming paradigm.\n\nFunctional\
    \ programming is better at solving some of our problems. It becomes clear that\
    \ it is better at making code easier to read and understand and it is better at\
    \ dealing with data transformations.\n\nProgramming in a functional style means\
    \ using concepts of functional programming such as first-class functions, closures,\
    \ higher-order functions, partial application, immutability, or pure functions.\n\
    \nPure functional programming is a programming paradigm that treats all functions\
    \ as pure functions.\n\nPure functions have a big set of advantages. They are\
    \ easier to read, understand, test, debug, or compose. Pure functions are great,\
    \ but we can’t write a practical application using only pure functions.\n\n###\
    \ OOP with closures\n\nJavaScript brings closures to the mainstream. Closures\
    \ can encapsulate state. Even more, we can create multiple closures sharing the\
    \ same private state. This way we can create flexible, encapsulated objects. Consider\
    \ the next implementation of `TodoStore`:\n\n```\nfunction TodoStore(){\n  const\
    \ list = [];\n\n  function push(todo){\n    list.push(todo);\n  }\n\n  function\
    \ getBy(text){\n    return list.filter(todo => todo.title.includes(text));\n \
    \ }\n\n  return Object.freeze({\n    push,\n    getBy\n  })\n}\n\nfunction Todo(id,\
    \ title){\n  return Object.freeze({id, title});\n}\n\n(function startApplication(){\n\
    \    const todoStore = TodoStore();\n\n    todoStore.push(Todo(1, \"find\"));\n\
    \    todoStore.push(Todo(2, \"read\"));\n    todoStore.push(Todo(3, \"share\"\
    ));\n\n    const filterTodos = todoStore.getBy(\"read\");\n    console.log(\"\
    Count:\" + filterTodos.length);\n})();\n```\n\nObjects built this way have a set\
    \ of advantages :\n\n*   Encapsulation. Only the methods exposed are public, everything\
    \ else is hidden.\n\n*   Immutable public interface.\n\n*   No `this` related\
    \ problems and complexity.\n\n*   Promote composition over inheritance.\n\nDouglas\
    \ Crockford pioneered the idea of splitting objects inside an application in two:\n\
    \n*   Data objects that expose data and have no behavior. Data objects are immutable.\
    \ They are created with the `Todo()` function in this example.\n\n*   Behavior\
    \ objects that expose behavior and hide data. There is only one object in this\
    \ example and is created with the `TodoStore()` function.\n\nFrom a different\
    \ perspective:\n\n*   Data objects are immutable collections of primitives or\
    \ other plain objects\n\n*   Behavior objects are immutable collections of closures\
    \ sharing the same private state\n\n### Final thoughts\n\nObject-oriented programming,\
    \ functional programming, purely functional programming are all paradigms at our\
    \ disposal for building better applications.\n\nFunctional programming turns out\
    \ to be better at data transformations and making code easier to understand. Pure\
    \ functions offer a solution to many of our problems and help to create code easier\
    \ to read, understand, test, debug, compose. Nevertheless, functional programming\
    \ doesn’t seem to solve all challenges. Objects look to be better at encapsulating\
    \ side effects and managing state.\n\nThe prototype system tries to simplify class\
    \ inheritance but it turns out it has its own problems. It has no encapsulation\
    \ and `this` creates losing context issues. However, the prototype system is good\
    \ at memory conservation and is flexible enough to transpile class-based objects\
    \ to prototype-based objects. In the end, the prototype system is good for transpiling\
    \ reasons, making JavaScript a target compilation language.\n\nJavaScript brings\
    \ another way of creating objects as collections of closures. This way is class-less,\
    \ prototype-less. Using functions to build encapsulated objects fits better with\
    \ the functional programming style.\n\nWhile waiting for the new better programming\
    \ paradigm we can use a mix of both functional and object-oriented programming,\
    \ trying to get the best of both worlds.\n\n# What’s next?\n"
