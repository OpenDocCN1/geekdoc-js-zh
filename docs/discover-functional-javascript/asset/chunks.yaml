  trans: "\n偏函数应用和柯里化是将函数转换为参数更少的其他函数的技术。它们的目的相似，但实现方式不同。让我们看看具体区别。\n\n### 偏函数应用\n\
    \n> 偏函数应用是通过生成一个参数更少的函数来固定函数中一定数量参数的过程。返回的函数就是一个偏应用函数。\n\n固定或绑定函数的第一个参数会创建一个新函数，该函数接受剩余的参数。考虑函数\
    \ `f(x, y, z)`：\n\n```\nfunction f(x, y, z){\n  console.log(x);\n  console.log(y);\n\
    \  console.log(z);\n}\n\nconst f1 = partial(f, 1);\nconst f2 = partial(f, 1, 2);\n\
    const f3 = partial(f, 1, 2, 3);\n\nf1(10, 100);\n//1\n//10\n//1000\n\nf2(4);\n\
    //1\n//2\n//4\n\nf3();\n//1\n//2\n//3\n```\n\n*   固定函数 `f` 的一个参数会创建一个具有两个参数的新函数。\n\
    *   固定函数的两个参数会创建一个具有一个参数的新函数。\n*   固定全部三个参数会创建一个没有参数的新函数。\n\n假设你有一个函数，想要创建另一个接受更少参数的函数。首先，为什么要这样做？一个原因可能是你想从一个通用函数中创建一个专用函数。另一个原因可能是你实际上需要一个接受更少参数的函数，以便与\
    \ `filter()` 或 `map()` 等函数一起使用。\n\n接下来，我们将介绍用于实现偏函数应用的工具。\n\n### bind()\n\n`bind()`\
    \ 方法可以实现偏函数应用，但需要注意 `this` 的取值。请看下面的例子：\n\n```\nfunction log(level, message){\n\
    \  console.log(level + \" : \"+message);\n}\n\nconst logInfo = log.bind(null,\
    \ \"Info\");\nlogInfo(\"A message\");\n//Info : A message\n```\n\n注意 `logInfo()`\
    \ 函数是如何创建的。它只需要一个参数，即 `message`。`logInfo()` 就是一个偏应用函数。\n\n### partial()\n\n为了更好地理解偏函数应用的工作原理，让我们自己创建一个\
    \ `partial()` 函数装饰器。\n\n`partial()` 创建一个函数版本，该版本接受的参数比原函数少。\n\n```\nfunction partial(fn,\
    \ ...leftArgs) {\n  return function(...rightArgs) {\n    return fn(...leftArgs,\
    \ ...rightArgs);\n  }\n}\n\nfunction log(level, message){\n  console.log(level\
    \ + \" : \"+message);\n}\n\nconst logInfo = partial(log, \"Info\");\nlogInfo(\"\
    A message\");\n//Info : A message\n```\n\n`partial()` 函数可以在 [lodash.js](https://lodash.com/docs/4.17.11#partial)\
    \ 或 [underscore.js](https://underscorejs.org/#partial) 等库中找到。\n\n### 与 filter\
    \ 一起使用的偏函数应用\n\n当新函数作为回调函数且可以接受更少参数时，偏函数应用就派上用场了。考虑下面的例子：\n\n```\nfunction isTodoOfType(type,\
    \ todo){\n  return todo.type === type;\n}\n\nfunction getTodos(todos, type){\n\
    \  return todos.filter(todo => isTodoOfType(type, todo));\n}\n\nconst todos =\
    \ [\n {id: 1, type: \"NC\", title: \"create\"},\n {id: 2, type: \"RE\", title:\
    \ \"review\"}\n];\n\nconst filteredTodos = getTodos(todos, \"NC\");\n//[{id:1,\
    \ type:\"NC\", title:\"create\"}];\n```\n\n`filter()` 的匿名谓词接受一个参数，即当前的 `todo`，并用它来调用\
    \ `isTodoOfType()`。\n\n另一种选择是使用偏函数应用，创建一个已经设置了 `type` 的新函数：\n\n```\nconst isOfType\
    \ = partial(isTodoOfType, type); \n```\n\n然后我们可以将新的谓词函数作为 `filter()` 方法的回调。代码如下：\n\
    \n```\nfunction getTodos(type){\n  const isOfType = partial(isTodoOfType, type);\
    \ \n  return todos.filter(isOfType, type);\n}\n```\n\n### 参数顺序\n\n参数顺序很重要。\n\n\
    `partial()` 工具从左到右固定参数。以下代码无法正常工作：\n\n```\nfunction isTodoOfType(todo, type){\n\
    \  return todo.type === type;\n}\n\nfunction getTodos(type){\n  return todos.filter(partial(isTodoOfType,\
    \ type));\n}\n```\n\n注意 `isTodoOfType(todo, type)` 函数中参数的顺序。`partial(isTodoOfType,\
    \ type)` 将第一个参数 `todo` 设置为特定于 `type` 的值，这是错误的。\n\n### 与 map 一起使用的偏函数应用\n\n以购物清单为例，每个行项目包含\
    \ `productId` 和 `quantity`。假设我们想显示每一行的所有产品详情。我们可以使用 `map()` 方法将购物清单转换为包含所有产品详情的新列表。我想使用\
    \ `toProductView(products, line)` 函数，但 `map()` 只发送一个参数，即当前行项目。此时，偏函数应用对于创建一个已经设置了\
    \ `products` 参数的新函数非常有用。\n\n```\nimport partial from \"lodash/partial\";\n\nconst\
    \ shoppingList = [\n  { \n    productId: 1,\n    quantity: 2\n  },\n  { \n   \
    \ productId: 2,\n    quantity: 1\n  }\n];\n\nconst products = {\n  1 : { id: 1,\
    \ name: \"mango\"},\n  2 : { id: 2, name: \"apple\"}\n}\n\nfunction toProductView(products,\
    \ line){\n  const product = products[line.productId];\n  return {\n    ...line,\n\
    \    ...product\n    }\n}\n\nconst newList = shoppingList\n  .map(partial(toProductView,\
    \ products));\n\nconsole.log(newList);\n//[\n//{id: 1, name: \"mango\", quantity:\
    \ 2},\n//{id: 2, name: \"apple\", quantity: 1}\n//]\n```\n\n### 与事件处理程序一起使用的偏函数应用\n\
    \n偏函数应用提供了一种向事件处理程序传递参数的好方法。查看 [React](https://reactjs.org/) 中的下一个示例：\n\n```\n\
    import partial from \"lodash/partial\";\n\nfunction TodoItem({ todo, onRemoveClick\
    \ }) {\n  return (\n    <li>\n      <div>{todo.title}</div>\n      <button onClick={partial(onRemoveClick,\
    \ todo)}>\n        Delete\n      </button>\n    </li>\n  );\n}\n```\n\n### 柯里化\n\
    \n> 柯里化将接受多个参数的函数转换为一系列函数，每个函数只接受一个参数。\n\n例如，考虑具有三个参数的 `f(x,y,z)` 函数。以下是编写柯里化版本的方法：\n\
    \n```\nfunction f(x){\n  return function(y){\n    return function(z){\n      console.log(x);\n\
    \      console.log(y);\n      console.log(z);\n    }\n  }\n}\n\nf(1)(2)(3);\n\
    //1\n//2\n//3\n```\n\n柯里化函数是一个一次只接受一个参数的函数，并返回一系列一元函数，直到所有参数都提供完毕。\n\n将所有参数应用于函数时，函数才会执行。\n\
    \n```\nf(1); // 返回一个函数\nf(1)(2); // 返回一个函数\nf(1)(2)(3); // 执行 f 并返回结果\n```\n\n\
    ### 与 filter 一起使用的柯里化\n\n回到之前的情况，`isTodoOfType()` 需要两个参数，而我们想将其与只提供一个参数（`todo`）的\
    \ `filter()` 一起使用。\n\n可以将 `isTodoOfType` 创建为柯里化函数。它接受 `type` 并返回一个谓词函数，该函数接受 `todo`\
    \ 并返回布尔值。代码如下：\n\n```\nfunction isTodoOfType(type){\n  return function(todo){\n\
    \    return todo.type === type;\n  }\n};\n\nfunction getTodos(type){\n return\
    \ todos.filter(isTodoOfType(type));\n}\n\nconst todos = [\n {id: 1, type: \"NC\"\
    , title: \"create\"},\n {id: 2, type: \"RE\", title: \"review\"}\n];\n\nconst\
    \ filteredTodos = getTodos(\"NC\");\n//[{id:1, type:\"NC\", title:\"create\"}];\n\
    ```\n\n### 与 map 一起使用的柯里化\n\n在购物清单示例中，我们可以将需要两个参数的 `toProductView()` 函数重写为柯里化函数。考虑以下代码：\n\
    \n```\nfunction toProductView(products){\n  return function(line){\n    const\
    \ product = products[line.productId];\n    return {\n      ...line,\n      ...product\n\
    \    }\n  }\n}\n\nconst newList = shoppingList.map(toProductView(products));\n\
    ```\n\n### curry()\n\n在 [Haskell](https://en.wikipedia.org/wiki/Haskell_(programming_language))\
    \ 等函数式语言中，函数默认是柯里化的。用更少的参数调用函数会得到一个接受剩余参数的新函数。用所有参数调用函数则会执行该函数。\n\n在 JavaScript\
    \ 中，可以使用像 `curry()` 这样的工具函数来启用柯里化。\n\n"
- fmt: "\n`curry()` offers a more flexible apply system than a truly curried function.\
    \ It can apply multiple arguments at once, not just one. When applying all arguments\
    \ the function is executed.\n\n```\nimport { curry } from 'lodash';\n\nconst f\
    \ = curry(function(x, y, z){\n  console.log(x);\n  console.log(y);\n  console.log(z);\n\
    });\n\nf(1, 2, 3);\nf(1, 2)(3);\nf(1)(2)(3);\n//1\n//2\n//3\n```\n\nHere is an\
    \ implementation of the `curry()` function:\n\n```\nfunction curry(f, leftArgs\
    \ = []){\n  return function(...args){\n    const allArgs = [...leftArgs, ...args];\n\
    \    if (allArgs.length >= f.length) {\n      return f(...allArgs);\n    } else{\n\
    \      return curry(f, allArgs);\n    }\n  }\n}\n```\n\nThis implementation of\
    \ the `curry()` function doesn’t work correctly with functions having a rest parameter\
    \ or default values.\n\nThe function `length` property gets the number of parameters\
    \ the function is expecting. However, the rest parameter does not count into the\
    \ function `length` property, neither default values.\n\n```\nfunction f1 (a,\
    \ b) { }\nfunction f2 (a, ...b) { }\nfunction f3 (a, b=0) { }\n\nf1.length; //2\n\
    f2.length; //1\nf3.length; //1\n```\n\nA solution would be to take a parameter,\
    \ specifying the number of parameters.\n\n```\nfunction curry(f, length, leftArgs\
    \ = []){\n  let noArguments = f.length;\n  if(length) {\n    noArguments = length;\n\
    \  }\n\n  return function(...args){\n    const allArgs = [...leftArgs, ...args];\n\
    \    if (allArgs.length >= noArguments){\n      return f(...allArgs);\n    } else{\n\
    \      return curry(f, length, allArgs);\n    }\n  }\n}\n\nfunction f(a, b=0)\
    \ {\n  console.log(a);\n  console.log(b);\n}\n\nconst fn = curry(f, 2);\nfn(1)(2);\n\
    //1\n//2\n```\n\nThe `curry()` function can be found in [lodash.js](https://lodash.com/docs/4.17.11#curry)\
    \ or [ramda.js](https://ramdajs.com/docs/#curryN).\n\n### Arity\n\nThe arity of\
    \ a function represents the number of arguments it takes.\n\n* A unary function\
    \ is a function that takes one argument.\n* A binary function takes two arguments.\n\
    * A ternary function takes three arguments.\n* An n-ary function takes n arguments.\n\
    * A nullary function takes no arguments.\n\nPartial application and currying decrease\
    \ the arity of a function.\n\nCurrying transforms an n-ary function into n unary\
    \ functions.\n\n### Full Application\n\nApplying fewer than the total number of\
    \ arguments to a function is a partial application.\n\nApplying all arguments\
    \ to a function is a full application.\n\nConsider the following full applications\
    \ of the `f(x, y, z)` function:\n\n```\nfunction f(x, y, z){\n  console.log(x);\n\
    \  console.log(y);\n  console.log(z);\n}\n\nf(1,2,3);\nf.apply(null, [1,2,3]);\n\
    f.call(null, 1,2,3);\n```\n\nApplying all arguments to a curried function is a\
    \ full application and executes the function.\n\n```\nconst fn = curry(f);\nfn(1)(2)(3);\n\
    ```\n\nThe partial utility functions are an exception. Applying all arguments\
    \ to a function with `partial()` creates a nullary function with all arguments\
    \ fixed. The original function is not executed immediately when the arguments\
    \ are applied. This new function can be used as a callback.\n\n```\nconst fn =\
    \ partial(f,1,2,3);\nsetTimeout(fn, 1000);\n//1\n//2\n//3\n```\n\n### Thunk\n\n\
    A thunk is a function that delays the invocation of another function. The thunk\
    \ function calls the original function with all arguments.\n\n```\nfunction sum(x,\
    \ y, z){\n  const total = x + y + z;\n  console.log(total);\n  return total;\n\
    }\n\nfunction sumThunk() {\n  return sum(1, 2, 3);\n}\n\nsumThunk();\n//6\n```\n\
    \nWe can use function decorators to create thunks.\n\n`thunk(fn, args)` takes\
    \ a function and all the arguments and creates a new function that executes the\
    \ original function with all arguments.\n\n```\nfunction thunk(fn, ...args){\n\
    \  return function(){\n    return fn(...args);\n  }\n}\n\nconst sumFirst3 = thunk(sum,\
    \ 1, 2, 3);\nsetTimeout(sumFirst3, 3000);\n//6 after 3s\n```\n\n`thunkify(fn)`\
    \ takes a function `fn` and returns a new function that asks for arguments and\
    \ returns a third function that, when called, invokes `fn` with all arguments.\n\
    \n```\nfunction thunkify(fn) {\n  return function(...args) {\n    return function()\
    \ {\n      return fn(...args);\n    }\n  }\n}\n\nconst sumFirst3 = thunkify(sum)(1,\
    \ 2, 3);\nsetTimeout(sumFirst3, 3000);\n//6 after 3s\n```\n\nI think it is better\
    \ to use `partial()` only with fewer arguments than the total number of arguments,\
    \ and use `thunk()` to create a nullary function that calls the original function\
    \ with all arguments.\n\n```\nfunction f(x, y, z){\n  console.log(x);\n  console.log(y);\n\
    \  console.log(z);\n}\n\nconst fThunk = thunk(f, 1, 2, 3);\n$(\"#btn\").click(fThunk);\n\
    ```\n\n### Final thoughts\n\nPartial application transforms a function with multiple\
    \ arguments in a function with fewer arguments.\n\nCurrying transforms a function\
    \ with multiple arguments in a sequence of functions each taking one argument.\n\
    \n# Chapter 9: Function composition\n\n> Function composition is a technique of\
    \ passing the output of a function as the input for another function.\n\nSuppose\
    \ we have two function `f()` and `g()` taking one argument.\n\n```\nconst y =\
    \ g(x);\nconst z = f(y);\n```\n\nComposing them means:\n\n```\nconst z = f(g(x));\n\
    ```\n\n### compose()\n\nIn order to compose multiple functions, we can create\
    \ the `compose()` utility function.\n\n```\nf(g(x)) === compose(f,g)(x);\n```\n\
    \nHere is an implementation for `compose()`:\n\n```\nfunction compose(...functions){\n\
    \  return function(x){\n    return functions.reduceRight((value,f) => f(value),\
    \ x);\n  }\n}\n\nfunction f(y){\n  return y * y;\n}\n\nfunction g(x){\n  return\
    \ x + x;\n}\n\nf(g(2)) === compose(f,g)(2);\n```\n\n`compose()` works with unary\
    \ functions.\n\n### Composing with decorators\n\nConsider the following code selecting\
    \ the `title` from a collection of books:\n\n```\nimport prop from \"lodash/property\"\
    ;\n\nconst books = [\n  {id:1, title: \"JavaScript The Good Parts\", type: \"\
    T\"},\n  {id:2, title: \"Civilization\", type: \"H\"},\n  {id:3, title: \"Javascript\
    \ Allongé\", type: \"T\"}\n];\n\nconst titles = books.map(prop(\"title\"));\n\
    //[\"JavaScript The Good Parts\", \n// \"Civilization\",\n// \"Javascript Allongé\"\
    ]\n```\n\nIn this case, we use function composition. The `map()` function takes\
    \ as input the return value from the `prop()` function.\n\nBelow is another example\
    \ of function composition using `matchesProperty()` to find a book by id:\n\n\
    ```\nimport matchesProperty from \"lodash/matchesProperty\";\n\nconst book = books.find(matchesProperty(\"\
    id\", 1));\n//{id: 1, title: \"JavaScript The Good Parts\", type: \"T\"}\n```\n\
    \nFunction `find()` takes as input the return value from `matchesProperty()` decorator.\n\
    \nWhen composing functions this way the first function can have multiple arguments.\n\
    \n### pipe()\n\n> `pipe()` creates a pipeline of functions, where the output of\
    \ one function is the input for the next one.\n\nConsider the next code:\n\n```\n\
    function filterBooks(todos){\n  return todos.filter(isTechnology);\n}\n\nfunction\
    \ isTechnology(todo){\n  return todo.type === \"T\";\n}\n\nfunction creatItemHtml(todo){\n\
    \  return `<div>${todo.title}</div>`;\n}\n\nfunction createListHtml(todos){\n\
    \  const htmlArr = todos.map(creatItemHtml);\n  return htmlArr.join(\"\");\n}\n\
    \nfunction renderHtml(html){\n  $(\"#books\").html(html);\n}\n\nconst books =\
    \ [\n  { id:1, title: \"JavaScript The Good Parts\", type: \"T\" },\n  { id:2,\
    \ title: \"Civilization\", type: \"H\" },\n  { id:3, title: \"Javascript Allongé\"\
    , type: \"T\" }\n];\n\nconst filteredBooks = filterBooks(books);\nconst html =\
    \ createListHtml(filteredBooks);\nrenderHtml(html);\n```\n\nThe `books` processing\
    \ can be rewritten with the `pipe()` utility function:\n\n```\nimport pipe from\
    \ \"lodash/flow\";\n\npipe(\n  filterBooks,\n  createListHtml,\n  renderHtml\n\
    )(books);\n```\n\nA utility function like `logData()` can be used to log data\
    \ between transformations:\n\n```\nimport pipe from \"lodash/flow\";\n\nfunction\
    \ logData(data){\n  console.log(data)\n  return data;\n}\n\npipe(\n  filterBooks,\n\
    \  logData,\n  createListHtml,\n  logData,\n  renderHtml\n)(books);\n```\n\nHere\
    \ is an implementation for the `pipe()` function:\n\n```\nfunction pipe(...functions){\n\
    \  return function(x){\n    return functions.reduce((value, f) => f(value), x);\n\
    \  }\n}\n```\n\n`pipe()` works with functions taking one argument.\n"
