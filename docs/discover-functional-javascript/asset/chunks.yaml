    \  function notify(value, fn){\n    try {\n      fn(value);\n    }\n    catch(e)\
    \ { console.error(e); }\n  }\n\n  function publish(type, value){\n    if(subscribers[type]){\n\
    \      subscribers[type].forEach(partial(notify, value));\n    }\n  }\n\n  return\
    \ Object.freeze({\n    subscribe,\n    publish\n  });\n}\n```\n\nOnly the `publish()`\
    \ and `subscribe()` methods are public. Everything else is private. `this` is\
    \ not used.\n\n### Memory\n\nClasses are better at memory conservation, as they\
    \ are implemented over the prototype system. All methods will be created once\
    \ in the prototype object and shared by all instances.\n\nThe memory cost of using\
    \ closures is noticeable when creating thousands of the same object. Here is a\
    \ measurement of the memory cost in Chrome:\n\n| Instances | 10 methods | 20 methods\
    \ |\n| --- | --- | --- |\n| 10 | 0 | 0 |\n| 100 | ~0.1 Mb | ~0.1 Mb |\n| 1000\
    \ | ~0.7 Mb | ~1.4 Mb |\n| 10000 | ~7 Mb | ~14 Mb |\n\n### Composition over inheritance\n\
    \nFactory functions promote composition over inheritance. Take a look at the next\
    \ example where `SpecialService` reuses members of `Service` :\n\n```\nfunction\
    \ Service() {\n  function doSomething(){ \n    console.log(\"do-something\");\
    \ \n  }\n\n  return Object.freeze({\n    doSomething\n  });\n}\n\nfunction SpecialService({\
    \ service }){  \n  function doSomethingElse(){ \n    console.log(\"do-something-else\"\
    ); \n  }\n\n  return Object.freeze({\n    doSomething : service.doSomething,\n\
    \    doSomethingElse\n  });\n}\n\nconst specialService = SpecialService({\n  service\
    \ : Service()\n});\n\nspecialService.doSomething(); \n//\"do-something\"\n\nspecialService.doSomethingElse();\n\
    //\"do-something-else\"\n```\n\n### Final thoughts\n\nClosures open a new way\
    \ of doing object-oriented programming without classes or prototypes.\n"
