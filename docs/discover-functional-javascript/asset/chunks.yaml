  trans: "\n以下是一个接受单参数函数的实现。\n\n```\nfunction memoize(fn) {\n  const map = Object.create(null);\n\
    \  return function (x) {\n    if (!map[x]){\n      map[x] = fn(x);\n    }\n\n\
    \    return map[x];\n  }\n}\n\nconst factorial = memoize(function(n){\n  console.log(\"\
    n=\" + n);\n  if(n < 2) return 1;\n  return n * factorial(n-1);\n});\n\nconsole.log(factorial(3));\
    \ //6;\n//n=3\n//n=2\n//n=1\n\nconsole.log(factorial(5)); //120;\n//n=5\n//n=4\n\
    ```\n\n`factorial()` 是一个拥有私有状态的函数。其内部状态是一个存储先前结果的映射表。\n\n### unary()\n\n`unary(fn)`\
    \ 创建一个只接受一个参数的函数版本。它通常用于修复函数被传入多余参数时的问题。\n\n```\nfunction unary(fn){\n  return\
    \ function(first){\n    return fn(first);\n  }\n}\n```\n\n让我们尝试使用 `console.log()`\
    \ 来打印数组中的所有数字。\n\n```\nconst numbers = [1,2,3,4,5,6];\n\nnumbers.forEach(console.log);\n\
    //1 0 (6) [1, 2, 3, 4, 5, 6]\n//2 1 (6) [1, 2, 3, 4, 5, 6]\n//...\n```\n\n如你所见，这里有一个问题。`console.log()`\
    \ 接收的参数比我们想要的要多。我们需要只用一个参数来调用它。以下是使用 `unary()` 函数的代码：\n\n```\nnumbers.forEach(unary(console.log));\n\
    //1 2 3 4 5 6\n```\n\n下面是另一个使用 `unary()` 修复 `parseInt()` 问题的例子：\n\n```\nconst\
    \ numbers = ['1','2','3','4','5','6'];\n\nnumbers.map(parseInt); \n//[1, NaN,\
    \ NaN, NaN, NaN, NaN]\n\nnumbers.map(unary(parseInt)); \n//[1, 2, 3, 4, 5, 6]\n\
    ```\n\n### binary()\n\n`binary(fn)` 创建一个只接受两个参数的函数版本。它可用于修复函数被传入多余两个参数时的问题。\n\n\
    ```\nfunction binary(fn){\n  return function(a, b){\n    return fn(a, b);\n  }\n\
    }\n```\n\n在下一个例子中，`Math.max()` 被传入的参数比我们预期的要多。因为其中一个参数（第四个）无法转换为数字，结果返回 `NaN`。\n\
    \n```\nconst numbers = [1, 2, 3];\nnumbers.reduce(Math.max);\n//NaN\n```\n\n为了确保\
    \ `Math.max()` 只被传入两个参数，我们可以使用 `binary()` 装饰器：\n\n```\nconst numbers = [1, 2,\
    \ 3];\nnumbers.reduce(binary(Math.max));\n//3\n\nnumbers.reduce(binary(Math.min));\n\
    //1\n```\n\n### 保留函数上下文\n\n为了保留原始函数的上下文，我们需要做两件事：\n\n*   装饰器应使用 `function` 关键字返回一个函数，而不是箭头语法。\n\
    \n*   原始函数应通过 `fn.apply(this, args)` 或 `fn.call(this, ...args)` 调用。\n\n### 最终思考\n\
    \n函数装饰器是一种强大的工具，可以在不修改原始函数的情况下创建现有函数的变体。它们可以成为函数式编程工具箱中用于复用通用逻辑的一部分。\n\n# 第 6\
    \ 章：纯函数\n\n> 纯函数是指对于相同的输入总是返回相同输出，并且没有副作用的函数。\n\n纯函数承诺让代码更易于阅读、理解、测试、调试和组合。这些承诺很重大。让我们看看它们能做什么。\n\
    \n### 从内部阅读\n\n我们不需要考虑当前函数中变量的变化会如何影响其他函数。我们也不需要考虑其他函数中变量的变化会如何影响当前函数。\n\n这是一个纯函数：\n\
    \n```\nfunction capitalize(name) {\n  if(name){\n    return name.charAt(0).toUpperCase()\
    \ + name.slice(1);\n  }\n\n  return name;\n}\n\ncapitalize(\"chapter\");\n//\"\
    Chapter\"\n```\n\n阅读纯函数时，我们可以专注于一个地方——当前函数。纯函数让读者阅读的代码更少。\n\n### 从外部阅读\n\n看下面的代码：\n\
    \n```\nconst arr = [1, 2, 3];\nconst newValue = compute(arr);\n\nconsole.log(arr);\n\
    //[1, 2, 3]\n```\n\n当 `compute()` 是纯函数时，我们可以确信 `console` 会输出 `[1, 2, 3]`，无需阅读和理解\
    \ `compute()` 函数。\n\n需要阅读和理解的东西越少，代码就越容易阅读。\n\n### 副作用\n\n副作用是指在计算结果过程中，对局部环境之外的变量进行更改，或与外部环境进行交互。\n\
    \n以下是一些副作用的例子：\n\n*   读取和修改局部作用域之外的状态\n*   修改作为参数传入的对象\n*   网络调用\n*   读写 DOM\n\
    *   写入控制台\n*   触发/分发事件\n*   读写本地存储\n*   使用定时器\n\n以任何方式改变外部环境都是副作用。\n\n改变外部状态可能会在代码的其他遥远部分产生意外问题。尤其是修改输入值可能会造成难以理解的\
    \ bug。我们不知道输入对象来自哪里，也不知道修改它会如何影响其他函数。\n\n带有副作用的函数的结果依赖于外部环境。对于相同的输入，由于外部状态可能变化，它可能返回不同的结果。\n\
    \n以下是一些带有副作用的函数：\n\n`getNextValue()` 不是纯函数，它改变了函数作用域之外的状态。\n\n```\nlet startValue\
    \ = 0;\n\nfunction getNextValue(){\n    startValue += 1;\n    return startValue;\n\
    }\n\ngetNextValue(); //1\ngetNextValue(); //2\n```\n\n`addValue()` 不是纯函数，它修改了输入变量。\n\
    \n```\nfunction addValue(list, value){\n    list.push(value);\n}\n\nconst numbers\
    \ = [];\n\naddValue(numbers, 1);\nconsole.log(numbers);\n//[1]\n\naddValue(numbers,\
    \ 2);\nconsole.log(numbers);\n//[1, 2]\n```\n\n### 自由变量\n\n> 自由变量是指在函数中使用，但既不是该函数的局部变量也不是参数的变量。\n\
    \n如果自由变量是常量，纯函数可以访问它们。常量是用 `const` 声明并存储不可变值的变量。\n\n```\nconst vatTax = 20;\n\n\
    function getFinalPrice(price){\n  return price * (1 + vatTax/100);\n}\n\ngetFinalPrice(10);\n\
    //12\n```\n\n`getFinalPrice()` 是一个纯函数。\n\n纯函数不会访问可能变化的外部环境变量。\n\n### 不可变性\n\n\
    不可变值是指一旦创建就无法更改的值。\n\n纯函数将输入值视为不可变的。理想情况下，输入值应该是不可变值。返回不可变值是一个好习惯。\n\n### 纯函数中的\
    \ `this`\n\n`this` 是一个隐式输入。\n\n当使用 `this` 时，我们需要将函数作为方法调用，或者使用 `call()` 或 `apply()`\
    \ 并传入上下文对象来调用函数。\n\n`this` 应被视为不可变的输入值，即使它实际上并非不可变。例如，`filter()`、`map()` 和 `reduce()`\
    \ 是纯数组方法，它们创建新数组并将 `this` 作为输入。`sort()` 数组方法是不纯的，它会修改输入数组。\n\n当使用 `this` 并以函数形式调用函数时，会产生副作用。在这种情况下，函数可能根据其运行环境给出不同的结果。`this`\
    \ 变成了一个自由变量。\n\n我们希望函数有显式的输入。如果希望轻松组合函数，就不应该使用 `this`。\n\n将上下文对象显式化意味着将其添加到参数列表中。\n\
    \n```\nfunction transform(context) { }\n```\n\n我建议在纯函数中避免使用 `this`。\n\n### 确定性函数\n\
    \n纯函数是确定性函数。对于特定的输入，它总是返回相同的输出。\n\n`Math.random()` 或 `Date.now()` 不会在纯函数中使用，因为它们每次调用都会给出不同的结果。\n\
    \n下面的函数没有副作用，但它不是确定性的。它不是纯函数：\n\n```\nfunction getNextValue(){\n    return Math.random();\n\
    }\n```\n\n### 引用透明性\n\n> 如果一个函数可以用其输出值替换，且应用程序的行为不变，则该函数具有引用透明性。\n\n因为我们可以用函数的结果替换函数，这意味着该函数没有副作用。一个引用透明的函数除了计算结果之外不做其他事情。\n\
    \n具有引用透明性的函数就是纯函数。\n\n"
- fmt: "\n## Using other pure functions\n\nPure functions can use other pure functions.\
    \ Check the code below where the `getMaxId()` pure function uses the other two\
    \ pure functions: `prop()` and `Math.max()`. The `addTodo()` pure function uses\
    \ the `getMaxId()` pure function.\n\n```\nimport prop from \"lodash/property\"\
    ;\n\nfunction addTodo(todos, todo) {\n  const id = getMaxId(todos) + 1;\n  const\
    \ newTodo = { ...todo, id };\n  return todos.concat([newTodo]);\n}\n\nfunction\
    \ getMaxId(todos) {     \n  if(todos.length){\n    const ids = todos.map(prop(\"\
    id\"));\n    return Math.max(...ids);\n  }\n  return 0;\n}\n\nconst todos = [];\n\
    const newTodos = addTodo(todos, { title: \"improve\" });\n\nconsole.log(newTodos);\n\
    //[{title: \"improve\", id: 1}]\n```\n\n## Using other impure functions\n\nPure\
    \ functions don’t invoke other impure functions with an exception. Pure functions\
    \ can invoke impure functions if those impure functions only modify the input\
    \ parameters and the overall purity is not affected. Consider the next code:\n\
    \n```\nfunction applySort(arr){\n  return arr.sort();\n}\n\nfunction sort(arr){\n\
    \  const newArr = [...arr];\n  return applySort(newArr);\n}\n\nconst numbers =\
    \ [3, 2, 1];\nconst sortedNumbers = sort(numbers);\n\nconsole.log(numbers);\n\
    //[3, 2, 1];\nconsole.log(sortedNumbers);\n//[1, 2, 3]\n```\n\n`applySort()` is\
    \ an impure function, it modifies the input array. `sort()` is a pure function\
    \ even if it uses the impure `applySort()` function.\n\nReturning a reference\
    \ to an impure function doesn’t affect the function purity.\n\nConsider the next\
    \ example where `doImpureTask()` is an impure function:\n\n```\nfunction doImpureTask(){}\n\
    \nfunction runFunction(){\n  return doImpureTask();\n}\n\nfunction getFunction(){\n\
    \  return doImpureTask;\n}\n```\n\n`runFunction()` is impure. `getFunction()`\
    \ is pure.\n\n## Purity from the inside\n\nWe can start writing code in pure functional\
    \ style by just removing features:\n\n*   No use of assignment operators.\n\n\
    *   No use of `let`, `var` statements.\n\n*   Declare variable only with `const`.\n\
    \n*   No use of `++` or `--` update operators.\n\n*   No use of `delete`.\n\n\
    *   No use of a variable as the first argument for `Object.assign()`.\n\n*   No\
    \ use of loops.\n\n*   Use only the pure array methods.\n\nIn a purely functional\
    \ style, loops are replaced by pure array methods like `filter()`, `map()`, `reduce()`\
    \ or by recursion.\n\nNote that replacing all loops with recursion is practical\
    \ when the engine does the tail-call optimization. At this moment, the tail-call\
    \ optimization is not supported by major browsers.\n\n## Purity from the outside\n\
    \nWriting code in a purely functional style makes it pure both from the inside\
    \ and outside.\n\nNevertheless, according to the definition, the purity of a function\
    \ is decided from the outside, not from the inside. Look at the next function,\
    \ creating a map by id from a collection:\n\n```\nfunction createMapById(list){\n\
    \  const map = Object.create(null);\n  list.forEach(function addToMap(item){\n\
    \    map[item.id] = item;\n  });\n  return Object.freeze(map);\n}\n\nconst arr\
    \ = [\n  { id:1, name:\"mango\" }, \n  { id:2, name:\"apple\" }\n];\n\nconst map\
    \ = createMapById(arr);\nconsole.log(map);\n//{\n// 1: {id: 1, name: \"mango\"\
    },\n// 2: {id: 2, name: \"apple\"}\n//}\n```\n\nThe `createMapById()` is not written\
    \ in a purely functional style. It uses the assignment operator and the `forEach()`\
    \ impure method. However, when we look at the function from the outside, it is\
    \ pure.\n\nPurity inside a function is something to aspire to in the pursuit of\
    \ a clear code. The following implementations of the `getEvens()` function are\
    \ both pure, but we should favor the first one:\n\n```\nfunction isEven(number){\n\
    \  return number % 2 === 0;\n}\n\nfunction getEvens(numbers) {\n  return numbers.filter(isEven);\n\
    }\n\nfunction getEvens(numbers) {\n  const evenNumbers = []\n  numbers.forEach(function(number){\n\
    \    if (isEven(number)) {\n      evenNumbers.push(number);\n    }\n  });\n  return\
    \ evenNumbers;\n}\n```\n\n## The problem\n\nThe problem with pure functions is\
    \ that we can’t write the whole application using pure functions. There is state\
    \ change, there is user interface rendering, there are user interactions, there\
    \ are network calls. All these cannot be implemented with pure functions. Pure\
    \ functions don’t communicate with the external environment.\n\nWhat can we do\
    \ then? We want all the benefits of pure functions, but at the same time, we cannot\
    \ use 100% pure functions to do a practical application.\n\nThe benefits of pure\
    \ functions are significant and we should write as many pure functions as we can.\
    \ At the same time, we need impure code to communicate with the environment.\n\
    \nI suggest to aim for purity and encapsulate impure code.\n\n## Impure code\n\
    \nSide effects are a common source of bugs because they make code harder to read\
    \ and reason about.\n\nSide effects can make code hard to understand, but they\
    \ are necessary.\n\nOur best approach is to encapsulate side effects. Objects\
    \ are useful for encapsulating side effects.\n\nCollecting the impure code together\
    \ will make it easier to investigate these parts when bugs arise. By isolating\
    \ side effects we know where to look for unexpected issues.\n\nThe goal is not\
    \ only to encapsulate but to reduce the possible kinds of side effects in a function.\n\
    \n## Final thoughts\n\nTaking all these into consideration, it becomes clear that\
    \ pure functions make code easier to read and understand. Nevertheless, we should\
    \ not lose the importance of making pure functions small, do one thing, and have\
    \ intention revealing names.\n\nWe should aim for purity as much as we can and\
    \ encapsulate side effects. The purpose is to have a big percent of code pure\
    \ and a low percent impure. This way we end up with a bigger part of the code\
    \ that is easier to reason about and less code that can cause problems.\n\nThe\
    \ more pure code the better.\n\n# Chapter 7: Immutability\n\n> An immutable value\
    \ is a value that, once created, cannot be changed.\n\nImagine you are waiting\
    \ in a queue. At the entrance, you get an electronic device showing your number.\
    \ Just before you are very close to being served, your order number changes on\
    \ the screen. When you ask around why it happened, you understand that anyone\
    \ in the building can change your number but nobody knows who. While you are waiting,\
    \ the order number continues to change, again and again. You now face the task\
    \ of asking everyone in the building to stop changing your order number.\n\nBack\
    \ to the code, picture the order device as an `order` object with the `number`\
    \ property. Imagine that the `order.number` property can be changed by any piece\
    \ of code in the application. Detecting what part of the code did the change is\
    \ hard. You may need to check all the code using the `order` object and presume\
    \ what happened.\n\nAn immutable order object will not have this kind of problem.\n\
    \nImmutability, in general, avoids a series of unexpected bugs hard to detect\
    \ and reason about.\n\n## Primitives\n\nPrimitive values are immutable, objects\
    \ are not.\n\nThe best example of an immutable primitive is a string. Any modification\
    \ to a string will result in a new string. Consider the next examples:\n\n```\n\
    \"ABCD\".substring(1,3); //\"BC\"\n\"AB\" + \"CD\";           //\"ABCD\"\n\"AB\"\
    .concat(\"CD\");     //\"ABCD\"\n```\n\nIn all these cases new strings are created.\n\
    \n## Reading code\n\nTake a look at the next code:\n\n```\nconst arr = [1, 2,\
    \ 3];\ndoSomething(arr);\n\nconsole.log(arr);\n//[1, 2, 3] ?\n```\n\nCan we easily\
    \ say that `log()` will print `[1, 2, 3]` to console? No, we cannot. The array\
    \ is a mutable data structure. It can change in the `doSomething()` function.\
    \ We need to read and understand the `doSomething()` function in order to say\
    \ what will be logged to the console.\n\nHere is an example of a `doSomething()`\
    \ function that changes the array.\n\n```\nfunction doSomething(arr){\n  arr.push(4);\n\
    }\n```\n\nIf the array was an immutable data structure, we could say what will\
    \ be logged to the console without reading the `doSomething()` function. There\
    \ will be less code to read and understand.\n\n## Constant\n"
  raw: "### Using other pure functions\n\nPure functions can use other pure functions.\
    \ Check the code below where the `getMaxId()` pure function uses the other two\
    \ pure functions: `prop()` and `Math.max()`. The `addTodo()` pure function uses\
    \ the `getMaxId()` pure function.\n\n```\nimport prop from \"lodash/property\"\
    ;\n\nfunction addTodo(todos, todo) {\n  const id = getMaxId(todos) + 1;\n  const\
    \ newTodo = { ...todo, id };\n  return todos.concat([newTodo]);\n}\n\nfunction\
    \ getMaxId(todos) {     \n  if(todos.length){\n    const ids = todos.map(prop(\"\
    id\"));\n    return Math.max(...ids);\n  }\n  return 0;\n}\n\nconst todos = [];\n\
    const newTodos = addTodo(todos, { title: \"improve\" });\n\nconsole.log(newTodos);\n\
    //[{title: \"improve\", id: 1}]\n```\n\n### Using other impure functions\n\nPure\
    \ functions don’t invoke other impure functions with an exception. Pure functions\
    \ can invoke impure functions if those impure functions only modify the input\
    \ parameters and the overall purity is not affected. Consider the next code:\n\
    \n```\nfunction applySort(arr){\n  return arr.sort();\n}\n\nfunction sort(arr){\n\
    \  const newArr = [...arr];\n  return applySort(newArr);\n}\n\nconst numbers =\
    \ [3, 2, 1];\nconst sortedNumbers = sort(numbers);\n\nconsole.log(numbers);\n\
    //[3, 2, 1];\nconsole.log(sortedNumbers);\n//[1, 2, 3]\n```\n\n`applySort()` is\
    \ an impure function, it modifies the input array. `sort()` is a pure function\
    \ even if it uses the impure `applySort()` function.\n\nReturning a reference\
    \ to an impure function doesn’t affect the function purity.\n\nConsider the next\
    \ example where `doImpureTask()` is an impure function:\n\n```\nfunction doImpureTask(){}\n\
    \nfunction runFunction(){\n  return doImpureTask();\n}\n\nfunction getFunction(){\n\
    \  return doImpureTask;\n}\n```\n\n`runFunction()` is impure. `getFunction()`\
    \ is pure.\n\n### Purity from the inside\n\nWe can start writing code in pure\
    \ functional style by just removing features:\n\n*   No use of assignment operators.\n\
    \n*   No use of `let`, `var` statements.\n\n*   Declare variable only with `const`.\n\
    \n*   No use of `++` or `--` update operators.\n\n*   No use of `delete`.\n\n\
    *   No use of a variable as the first argument for `Object.assign()`.\n\n*   No\
    \ use of loops.\n\n*   Use only the pure array methods.\n\nIn a purely functional\
    \ style, loops are replaced by pure array methods like `filter()`, `map()`, `reduce()`\
    \ or by recursion.\n\nNote that replacing all loops with recursion is practical\
    \ when the engine does the tail-call optimization. At this moment, the tail-call\
    \ optimization is not supported by major browsers.\n\n### Purity from the outside\n\
    \nWriting code in a purely functional style makes it pure both from the inside\
    \ and outside.\n\nNevertheless, according to the definition, the purity of a function\
    \ is decided from the outside, not from the inside. Look at the next function,\
    \ creating a map by id from a collection:\n\n```\nfunction createMapById(list){\n\
    \  const map = Object.create(null);\n  list.forEach(function addToMap(item){\n\
    \    map[item.id] = item;\n  });\n  return Object.freeze(map);\n}\n\nconst arr\
    \ = [\n  { id:1, name:\"mango\" }, \n  { id:2, name:\"apple\" }\n];\n\nconst map\
    \ = createMapById(arr);\nconsole.log(map);\n//{\n// 1: {id: 1, name: \"mango\"\
    },\n// 2: {id: 2, name: \"apple\"}\n//}\n```\n\nThe `createMapById()` is not written\
    \ in a purely functional style. It uses the assignment operator and the `forEach()`\
    \ impure method. However, when we look at the function from the outside, it is\
    \ pure.\n\nPurity inside a function is something to aspire to in the pursuit of\
    \ a clear code. The following implementations of the `getEvens()` function are\
    \ both pure, but we should favor the first one:\n\n```\nfunction isEven(number){\n\
    \  return number % 2 === 0;\n}\n\nfunction getEvens(numbers) {\n  return numbers.filter(isEven);\n\
    }\n\nfunction getEvens(numbers) {\n  const evenNumbers = []\n  numbers.forEach(function(number){\n\
    \    if (isEven(number)) {\n      evenNumbers.push(number);\n    }\n  });\n  return\
    \ evenNumbers;\n}\n```\n\n### The problem\n\nThe problem with pure functions is\
    \ that we can’t write the whole application using pure functions. There is state\
    \ change, there is user interface rendering, there are user interactions, there\
    \ are network calls. All these cannot be implemented with pure functions. Pure\
    \ functions don’t communicate with the external environment.\n\nWhat can we do\
    \ then? We want all the benefits of pure functions, but at the same time, we cannot\
    \ use 100% pure functions to do a practical application.\n\nThe benefits of pure\
    \ functions are significant and we should write as many pure functions as we can.\
    \ At the same time, we need impure code to communicate with the environment.\n\
    \nI suggest to aim for purity and encapsulate impure code.\n\n### Impure code\n\
    \nSide effects are a common source of bugs because they make code harder to read\
    \ and reason about.\n\nSide effects can make code hard to understand, but they\
    \ are necessary.\n\nOur best approach is to encapsulate side effects. Objects\
    \ are useful for encapsulating side effects.\n\nCollecting the impure code together\
    \ will make it easier to investigate these parts when bugs arise. By isolating\
    \ side effects we know where to look for unexpected issues.\n\nThe goal is not\
    \ only to encapsulate but to reduce the possible kinds of side effects in a function.\n\
    \n### Final thoughts\n\nTaking all these into consideration, it becomes clear\
    \ that pure functions make code easier to read and understand. Nevertheless, we\
    \ should not lose the importance of making pure functions small, do one thing,\
    \ and have intention revealing names.\n\nWe should aim for purity as much as we\
    \ can and encapsulate side effects. The purpose is to have a big percent of code\
    \ pure and a low percent impure. This way we end up with a bigger part of the\
    \ code that is easier to reason about and less code that can cause problems.\n\
    \nThe more pure code the better.\n\n# Chapter 7: Immutability\n\n> An immutable\
    \ value is a value that, once created, cannot be changed.\n\nImagine you are waiting\
    \ in a queue. At the entrance, you get an electronic device showing your number.\
    \ Just before you are very close to being served, your order number changes on\
    \ the screen. When you ask around why it happened, you understand that anyone\
    \ in the building can change your number but nobody knows who. While you are waiting,\
    \ the order number continues to change, again and again. You now face the task\
    \ of asking everyone in the building to stop changing your order number.\n\nBack\
    \ to the code, picture the order device as an `order` object with the `number`\
    \ property. Imagine that the `order.number` property can be changed by any piece\
    \ of code in the application. Detecting what part of the code did the change is\
    \ hard. You may need to check all the code using the `order` object and presume\
    \ what happened.\n\nAn immutable order object will not have this kind of problem.\n\
    \nImmutability, in general, avoids a series of unexpected bugs hard to detect\
    \ and reason about.\n\n### Primitives\n\nPrimitive values are immutable, objects\
    \ are not.\n\nThe best example of an immutable primitive is a string. Any modification\
    \ to a string will result in a new string. Consider the next examples:\n\n```\n\
    \"ABCD\".substring(1,3); //\"BC\"\n\"AB\" + \"CD\";           //\"ABCD\"\n\"AB\"\
    .concat(\"CD\");     //\"ABCD\"\n```\n\nIn all these cases new strings are created.\n\
    \n### Reading code\n\nTake a look at the next code:\n\n```\nconst arr = [1, 2,\
    \ 3];\ndoSomething(arr);\n\nconsole.log(arr);\n//[1, 2, 3] ?\n```\n\nCan we easily\
    \ say that `log()` will print `[1, 2, 3]` to console? No, we cannot. The array\
    \ is a mutable data structure. It can change in the `doSomething()` function.\
    \ We need to read and understand the `doSomething()` function in order to say\
    \ what will be logged to the console.\n\nHere is an example of a `doSomething()`\
    \ function that changes the array.\n\n```\nfunction doSomething(arr){\n  arr.push(4);\n\
    }\n```\n\nIf the array was an immutable data structure, we could say what will\
    \ be logged to the console without reading the `doSomething()` function. There\
    \ will be less code to read and understand.\n\n### Constant"
