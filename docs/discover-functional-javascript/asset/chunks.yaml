  trans: "\n网络调用可以通过 `fetch()` 函数完成。`fetch()` 函数返回一个 promise。\n\n### 组合 promises\n\
    \n我们来看看如何组合 promises：\n\n```\nfunction fetchUsers() { \n  return fetch(\"/users\"\
    ); \n}\n\nfunction fetchPosts() { \n  return fetch(\"/posts\"); \n}\n\nfunction\
    \ fetchComments() { \n  return fetch(\"/comments\"); \n}\n\nfunction doSomething()\
    \ { }\n\nfunction handleError(error) { \n  console.error(error); \n}\n\nfetchUsers()\n\
    \  .then(fetchPosts)\n  .then(fetchComments)\n  .then(doSomething)\n  .catch(handleError);\n\
    ```\n\nPromises 支持链式系统，允许我们通过一组函数传递数据。Promises 使用回调函数。\n\n注意前面示例中的执行流程：\n\n* \
    \  `fetchPosts` 在 `fetchUsers` 获取结果后执行。等待结果时，应用程序不会被阻塞。\n\n*   `fetchComments`\
    \ 在 `fetchPosts` 获取结果后执行。\n\n`fetchUsers` 的结果作为输入传递给 `fetchPosts`。`fetchUsers`\
    \ 的结果作为输入传递给 `fetchComments`，以此类推。\n\n数据流为：`fetchUsers` → `fetchPosts` → `fetchComments`\
    \ → `doSomething`\n\n如果任何步骤出现错误，链式控制会跳转到链中最近的拒绝处理程序。\n\n`Promise.all()` 返回一个新的\
    \ promise，当所有 promise 都解决时解决，或者当其中一个 promise 拒绝时拒绝。\n\n`Promise.race()` 返回一个新的\
    \ promise，当其中一个 promise 解决或拒绝时解决或拒绝。\n\n```\nconst allPromises = [ fetchUsers(),\n\
    \                      fetchPosts(),\n                      fetchComments() ];\n\
    \nPromise.all(allPromises)\n  .then(doSomething)\n  .catch(handleError);\n```\n\
    \n### async/await\n\n`async/await` 允许我们编写看起来像同步代码的异步代码。`async/await` 是使用 promise\
    \ 的语法糖。\n\n该语法要求使用 `async` 关键字标记函数。\n\n```\n//async 与函数声明\nasync function doAsynchronousTask()\
    \ {}\n\n//async 与箭头函数\nconst doAsynchronousTask = async ()=>{ };\n```\n\n让我们看看如何在函数内部使用其他异步任务。查看下一个示例：\n\
    \n```\n(async function startApplication(){\n  const users = await fetchUsers();\n\
    \  const posts = await fetchPosts();\n  const comments = await fetchComments();\n\
    \  console.log(users);\n  console.log(posts);\n  console.log(comments);\n})();\n\
    ```\n\n`await` 运算符用于等待一个 promise。\n\n`await fetchUsers()` 之后的代码在 `fetchUsers`\
    \ 获取结果后执行。`await fetchPosts()` 之后的代码在 `fetchPosts` 获取结果后执行。在某种程度上，可以想象成：\n\n```\n\
    fetchUsers().then((users) => {\n  fetchPosts().then((posts) => {\n    fetchComments().then((comments)=>{\n\
    \      console.log(users);\n      console.log(posts);\n      console.log(comments);\n\
    \    });\n  });    \n});\n```\n\n`try/catch` 用于处理错误。\n\n```\nfunction handleError(error)\
    \ { \n    console.error(error); \n}\n\n(async function startApplication() {\n\
    \  try {\n    const users = await fetchUsers();\n    const posts = await fetchPosts();\n\
    \    const comments = await fetchComments();\n  } catch(error) {\n    handleError(error);\n\
    \  }\n})();\n```\n\n前面的代码可以想象成：\n\n```\nfetchUsers()\n .then((users) => {\n  \
    \ fetchPosts().then((posts) => {\n     fetchComments().then((comments)=>{\n  \
    \   });\n   });    \n })\n .catch(handleError);\n```\n\n当我们想要并行执行所有网络调用时，可以将 `await`\
    \ 与 `Promise.all()` 一起使用：\n\n```\n(async function startApplication(){\n  const\
    \ allPromises = [ fetchUsers(),\n                        fetchPosts(),\n     \
    \                   fetchComments() ];\n  const [todos, users, albums] = \n  \
    \  await Promise.all(allPromises);\n  console.log(todos);\n  console.log(users);\n\
    \  console.log(albums);\n})();\n```\n\n我不认为让异步代码看起来像同步代码一定是个好主意。这可能会导致难以理解哪些代码是异步执行的，哪些是同步执行的。我认为\
    \ promises 在显示代码的哪一部分处理异步任务方面更清晰。\n\n### 事件循环\n\nJavaScript 引擎在单线程中运行。在某一时刻，只有一行代码被执行。\n\
    \nJavaScript 拥有一个更简单的异步编程模型，没有线程、竞态条件、锁或死锁。\n\n引擎使用事件循环。当事件发生并且有事件监听器附加到它时，回调函数会被添加到事件循环中。事件循环使用队列，因此回调函数按照添加的顺序处理。\n\
    \n事件循环中的函数必须快速完成。如果它们不快速完成，应用程序会变得无响应，几分钟后浏览器会显示“脚本运行时间过长”的对话框。\n\nDOM 事件、定时事件、网络请求，都会将回调函数添加到事件循环中。\n\
    \n下面的代码不会快速完成，并且会阻塞应用程序：\n\n```\nfor(let i=0; i<10000000000; i++){}\n```\n\n###\
    \ Web Workers\n\nWeb workers 提供了一种运行长时间任务的方式。这些任务并行运行，不会影响主线程。当长时间任务完成时，结果必须传回主线程。\n\
    \n主线程和 web workers 之间没有共享内存。\n\n在下一个示例中，主线程创建一个 web worker 并向其发送一条消息以启动长时间运行的过程。然后它监听结果，并在之后终止\
    \ worker。\n\n```\nconst worker = new Worker(\"worker.js\");\n\n//向 worker 发送消息\n\
    worker.postMessage(\"start\");\n\n//从 worker 接收消息\nworker.onmessage = function(e)\
    \ {\n  console.log(e.data);\n  worker.terminate();\n};\n```\n\nWorker 监听来自主线程的消息。当它收到\
    \ `\"start\"` 消息时，开始长时间运行的计算。计算完成后，结果通过 `postMessage()` 发送到主线程。\n\n```\nfunction\
    \ computeValue() {\n  for (let i = 0; i < 10000000000; i++) {}\n  return 10000000000;\n\
    }\n\n//从主线程接收消息\nonmessage = function(e) {\n  const action = e.data;\n  if (action\
    \ === \"start\") {\n    const result = computeValue();\n\n    //向主线程发送消息\n   \
    \ postMessage(result);\n  }\n};\n```\n\n### 最终思考\n\n回调是异步编程的基本单元。\n\nPromises\
    \ 是表示未来结果的对象。Promises 为组合异步任务提供了更好的方式。\n\n`async/await` 允许我们编写看起来像同步代码的异步代码。\n\
    \nJavaScript 拥有一个更简单的异步编程模型，没有线程、竞态条件、锁或死锁。\n\nWeb workers 可以运行长时间运行的任务。\n\n#\
    \ 第 13 章：带原型的对象\n\n> 对象是属性的动态集合，带有一个指向对象原型的“隐藏”属性。属性有一个键和一个值。\n\n### 属性键\n\n属性键是一个唯一的字符串。\n\
    \n有两种访问属性的方式：点号表示法和方括号表示法。使用点号表示法时，属性键必须是有效的标识符。\n\n```\nconst obj = {\n  message\
    \ : \"discover\"\n}\n\nobj.message; //\"discover\"\n```\n\n访问不存在的属性不会抛出错误，而是返回\
    \ `undefined`。\n\n```\nobj.otherProperty; //undefined\n```\n\n使用方括号表示法时，属性键不必是有效的标识符，它可以是任何值。\n\
    \n```\nconst french = {};\nfrench[\"Thank you\"] = \"Merci\";\n\nfrench[\"Thank\
    \ you\"]; //\"Merci\"\n```\n\n当使用非字符串值作为属性键时，它会通过 `toString()` 方法（如果可用）转换为字符串。\n\
    \n```\nconst obj = {};\n\n//数字作为键\nobj[1] = \"Number 1\";\nobj[1] === obj['1'];\
    \ //true\n\n//对象作为键\nconst number1 = {\n  toString : function() {return '1';}\n\
    }\nobj[number1] === obj['1']; //true\n```\n\n在前面的示例中，对象 `number1` 被用作属性键。然后它被转换为字符串，转换结果\
    \ `'1'` 被用作属性键。\n\n### 属性值\n\n属性值可以是原始值、对象或函数。\n\n### 对象作为值\n\n"
- fmt: "\nObjects can be nested inside other objects. See the next example:\n\n```\n\
    const book = {\n  title : \"How JavaScript Works\",\n  author : {\n    firstName\
    \ : \"Douglas\",\n    lastName : \"Crockford\"\n  }\n}\n\nbook.author.firstName;\
    \ //\"Douglas\"\n```\n\nThis way, we can create a namespace:\n\n```\nconst app\
    \ = {};\n\napp.authorGateway = { \n  getAuthors : function() {} \n};\n\napp.bookGateway\
    \ = { \n  getBooks : function() {} \n};\n```\n\n### Function as value\n\nWhen\
    \ a function is used as a value for a property, it usually becomes a method. Inside\
    \ methods, the `this` keyword is used to refer to the current object. However,\
    \ `this` can have many values depending on how the function is invoked.\n\n###\
    \ Prototypes\n\nObjects have a “hidden” link `__proto__` to the prototype object,\
    \ from which they inherit properties.\n\nFor example, objects created with an\
    \ object literal have a link to the `Object.prototype`:\n\n```\nconst obj = {};\n\
    obj.__proto__ === Object.prototype; //true\n```\n\nObjects inherit from objects.\n\
    \nThe prototypal inheritance has the benefit of memory conservation. The prototype\
    \ is created once and used by all instances.\n\n#### Prototype chain\n\nThe prototype\
    \ object has a prototype of its own. When a property is accessed and the object\
    \ does not contain it, the engine will look down the prototype objects until it\
    \ either finds the requested property or until it reaches `null`.\n\n#### Read-only\n\
    \nThe prototype link is used only for reading values. When a change is made, it\
    \ is made only on the current object not on its prototype, not even when a property\
    \ with the same name exists on the prototype.\n\n#### Built-in prototypes\n\n\
    Numbers inherit from `Number.prototype`, which inherits from `Object.prototype`.\n\
    \n```\nlet no = 1;\nno.__proto__ === Number.prototype; //true\nno.__proto__.__proto__\
    \ === Object.prototype; //true\n```\n\nStrings inherit from `String.prototype`.\
    \ Booleans inherit from `Boolean.prototype`. Arrays inherit from `Array.prototype`.\
    \ Functions inherit from `Function.prototype`.\n\nAll objects, functions and primitives,\
    \ except `null` and `undefined`, inherit properties from `Object.prototype`. All\
    \ of them have the `toString()` method, for example.\n\n### Map\n\nWe can think\
    \ of an object as a map. The keys in the map are the names of the object’s properties.\n\
    \nAccessing a key doesn’t require to scan through all the properties. It is an\
    \ O(1) access time.\n\n`Object.create(null)` creates an object with no prototype.\
    \ Usually this is used to create a map.\n\n```\nconst italian = Object.create(null);\
    \ \n\nitalian[\"Yes\"] = \"Si\"; \nitalian[\"No\"]  = \"No\";  \n\nitalian[\"\
    Yes\"]; //\"Si\"\n```\n\n### Object literal\n\nObject literal offers a simple,\
    \ elegant way for creating objects.\n\n```\nconst timer = {\n  secret: 0,\n  start\
    \ : function() {},\n  stop : function() {},\n}\n```\n\nHowever, this syntax has\
    \ a few drawbacks. All properties are public, methods can be redefined, and we\
    \ can’t use the same methods on new instances.\n\n```\ntimer.secret; //0 \ntimer.start\
    \ = function() { \n  console.log(\"don't start\");\n}\ntimer.start(); //\"don't\
    \ start\"\n```\n\n### Object.create()\n\n`Object.create(prototypeObject)` creates\
    \ a new object, using the argument object as its prototype.\n\nWith `Object.create()`\
    \ we can create a new `timer` object with `timerPrototype` as its prototype. This\
    \ means that `start()` and `stop()` are available on the `timer` object. It also\
    \ means that the `__proto__` property from `timer` points to the `timerPrototype`\
    \ object.\n\n```\nconst timerPrototype = {\n  start : function() {},\n  stop :\
    \ function() {}\n};\n\nconst timer = Object.create(timerPrototype);\ntimer.__proto__\
    \ === timerPrototype; //true\n```\n\nWhen the prototype is frozen, the objects\
    \ that inherit from it won’t be able to change the properties defined within.\
    \ In this case, the `start()` and `stop()` methods can’t be redefined.\n\n```\n\
    const timerPrototype = Object.freeze({\n  start : function() {},\n  stop : function()\
    \ {}\n});\n\nconst timer = Object.create(timerPrototype);\ntimer.start = function()\
    \ { \n  console.log(\"don't start\"); \n}\n//Cannot assign to read only property\
    \ 'start' of object\n```\n\n`Object.create(timerPrototype)` can be used to build\
    \ more objects with the same prototype.\n\n### Function constructor\n\nInitially,\
    \ the language proposed the function constructor as a sugar syntax for building\
    \ objects with a custom prototype. Take a look at the next example:\n\n```\nfunction\
    \ Timer(){\n  this.secret = 0;\n}\n\nTimer.prototype = {\n  start : function()\
    \ {},\n  stop : function() {}\n}\n\nconst timer = new Timer();\ntimer.start();\n\
    ```\n\nAll functions defined with the `function` keyword can be used as function\
    \ constructors. The function constructor is called with the `new` operator. The\
    \ new object has the prototype set to `FunctionConstructor.prototype`.\n\n```\n\
    const timer = new Timer();\ntimer.__proto__ === Timer.prototype;\n```\n\nTo prevent\
    \ method redefinition the prototype should be frozen.\n\n```\nTimer.prototype\
    \ = Object.freeze({\n  start : function() {},\n  stop : function() {}\n});\n```\n\
    \n#### new\n\nWhen `new Timer()` is executed it does similar steps as the `newTimer()`\
    \ function:\n\n```\nfunction newTimer(){\n  let newObj = Object.create(Timer.prototype);\n\
    \  let returnObj = Timer.call(newObj, arguments);\n  if(returnObj) return returnObj;\n\
    \n  return newObj;\n}\n```\n\nA new object is created with `Timer.prototype` as\
    \ its prototype. Then the `Timer` function runs and sets the fields on the new\
    \ object.\n\n### Class\n\n`class` offers a much better sugar syntax for building\
    \ objects with a custom prototype. Check out the next example:\n\n```\nclass Timer{\n\
    \  constructor(){\n    this.secret = 0;\n  }\n\n  start() {}\n  stop() {}  \n\
    }\n```\n\nObjects built with `class` have the prototype set to `ClassName.prototype`.\n\
    \n```\nconst timer = new Timer();\ntimer.__proto__ === Timer.prototype;\n```\n\
    \nIn order to avoid method redefinition we need to freeze the class’ prototype.\n\
    \n```\nObject.freeze(Timer.prototype);\n```\n\n### No privacy\n\nThe prototype-based\
    \ inheritance patterns have no privacy. All object’s properties are public.\n\n\
    `Object.keys()` returns an array with all the own property keys. It can be used\
    \ to iterate over the object’s properties.\n\n```\nfunction logProperty(name){\n\
    \  console.log(name); //property name\n  console.log(obj[name]); //value\n}\n\n\
    Object.keys(obj).forEach(logProperty);\n```\n\n### Final thoughts\n\nObjects are\
    \ dynamic in nature and can be used as maps. All object’s properties are public.\n\
    \nObjects inherit from other objects.\n\nConstructor function and class are a\
    \ sugar syntax for creating objects that inherit from a custom prototype object.\
    \ They first define the custom prototype with all methods and then the `new` operator\
    \ creates objects that inherit from that prototype.\n\n# Chapter 14: Objects with\
    \ closures\n\n> Closure - is a consequence of functions that can nest and functions\
    \ that are first class values, and JavaScript has it, and is almost completely\
    \ right in the way it implements them, and it’s maybe the best feature ever put\
    \ into a programming language.— Douglas Crockford\n\nClosures can be created as\
    \ functions with private state. More than that, we can create many closures sharing\
    \ the same private state. This way, we can build objects as collections of closures.\
    \ Closures encapsulate state.\n\n### Factory functions\n\nLet’s see how we can\
    \ do that. We start from the Revealing Module pattern, give that function a name\
    \ and use it to build new encapsulated objects. Here is an example of the `Counter`\
    \ function that can create counter objects:\n\n```\nfunction Counter(){\n    let\
    \ state = 0;\n\n    function increment(){\n       state += 1;\n       return state;\n\
    \    }\n\n    function decrement(){\n       state -= 1;\n       return state;\n\
    \    }\n\n    return Object.freeze({\n       increment,\n       decrement\n  \
    \  });\n};\n\nconst counter = Counter();\ncounter.increment(); //1\ncounter.increment();\
    \ //2\ncounter.increment(); //3\n\nconst otherCounter = Counter();\notherCounter.increment();\
    \ //1\n```\n\nThe `Counter` function is called factory function. Objects built\
    \ this way have a series of benefits.\n\n### Encapsulation\n\nEncapsulation means\
    \ information hiding.\n"
  raw: "Objects can be nested inside other objects. See the next example:\n\n```\n\
    const book = {\n  title : \"How JavaScript Works\",\n  author : {\n    firstName\
    \ : \"Douglas\",\n    lastName : \"Crockford\"\n  }\n}\n\nbook.author.firstName;\
    \ //\"Douglas\"\n```\n\nThis way, we can create a namespace:\n\n```\nconst app\
    \ = {};\n\napp.authorGateway = { \n  getAuthors : function() {} \n};\n\napp.bookGateway\
    \ = { \n  getBooks : function() {} \n};\n```\n\n#### Function as value\n\nWhen\
    \ a function is used as a value for a property, it usually becomes a method. Inside\
    \ methods, the `this` keyword is used to refer to the current object. However,\
    \ `this` can have many values depending on how the function is invoked.\n\n###\
    \ Prototypes\n\nObjects have a “hidden” link `__proto__` to the prototype object,\
    \ from which they inherit properties.\n\nFor example, objects created with an\
    \ object literal have a link to the `Object.prototype` :\n\n```\nconst obj = {};\n\
    obj.__proto__ === Object.prototype; //true\n```\n\nObjects inherit from objects.\n\
    \nThe prototypal inheritance has the benefit of memory conservation. The prototype\
    \ is created once and used by all instances.\n\n#### Prototype chain\n\nThe prototype\
    \ object has a prototype of its own. When a property is accessed and the object\
    \ does not contain it, the engine will look down the prototype objects until it\
    \ either finds the requested property or until it reaches `null`.\n\n#### Read-only\n\
    \nThe prototype link is used only for reading values. When a change is made, it\
    \ is made only on the current object not on its prototype, not even when a property\
    \ with the same name exists on the prototype.\n\n#### Built-in prototypes\n\n\
    Numbers inherit from `Number.prototype`, which inherits from `Object.prototype`\
    \ .\n\n```\nlet no = 1;\nno.__proto__ === Number.prototype; //true\nno.__proto__.__proto__\
    \ === Object.prototype; //true\n```\n\nStrings inherit from `String.prototype`.\
    \ Booleans inherit from `Boolean.prototype`. Arrays inherit from `Array.prototype`.\
    \ Functions inherit from `Function.prototype`.\n\nAll objects, functions and primitives,\
    \ except `null` and `undefined`, inherit properties from `Object.prototype`. All\
    \ of them have the `toString()` method, for example.\n\n### Map\n\nWe can think\
    \ of an object as a map. The keys in the map are the names of the object’s properties.\n\
    \nAccessing a key doesn’t require to scan through all the properties. It is an\
    \ O(1) access time.\n\n`Object.create(null)` creates an object with no prototype.\
    \ Usually this is used to create a map.\n\n```\nconst italian = Object.create(null);\
    \ \n\nitalian[\"Yes\"] = \"Si\"; \nitalian[\"No\"]  = \"No\";  \n\nitalian[\"\
    Yes\"]; //\"Si\"\n```\n\n### Object literal\n\nObject literal offers a simple,\
    \ elegant way for creating objects.\n\n```\nconst timer = {\n  secret: 0,\n  start\
    \ : function() {},\n  stop : function() {},\n}\n```\n\nHowever, this syntax has\
    \ a few drawbacks. All properties are public, methods can be redefined, and we\
    \ can’t use the same methods on new instances.\n\n```\ntimer.secret; //0 \ntimer.start\
    \ = function() { \n  console.log(\"don't start\");\n}\ntimer.start(); //\"don't\
    \ start\"\n```\n\n### Object.create()\n\n`Object.create(prototypeObject)` creates\
    \ a new object, using the argument object as its prototype.\n\nWith `Object.create()`\
    \ we can create a new `timer` object with `timerPrototype` as its prototype. This\
    \ means that `start()` and `stop()` are available on the `timer` object. It also\
    \ means that the `__proto__` property from `timer` points to the `timerPrototype`\
    \ object.\n\n```\nconst timerPrototype = {\n  start : function() {},\n  stop :\
    \ function() {}\n};\n\nconst timer = Object.create(timerPrototype);\ntimer.__proto__\
    \ === timerPrototype; //true\n```\n\nWhen the prototype is frozen, the objects\
    \ that inherit from it won’t be able to change the properties defined within.\
    \ In this case, the `start()` and `stop()` methods can’t be redefined.\n\n```\n\
    const timerPrototype = Object.freeze({\n  start : function() {},\n  stop : function()\
    \ {}\n});\n\nconst timer = Object.create(timerPrototype);\ntimer.start = function()\
    \ { \n  console.log(\"don't start\"); \n}\n//Cannot assign to read only property\
    \ 'start' of object\n```\n\n`Object.create(timerPrototype)` can be used to build\
    \ more objects with the same prototype.\n\n### Function constructor\n\nInitially,\
    \ the language proposed the function constructor as a sugar syntax for building\
    \ objects with a custom prototype. Take a look at the next example:\n\n```\nfunction\
    \ Timer(){\n  this.secret = 0;\n}\n\nTimer.prototype = {\n  start : function()\
    \ {},\n  stop : function() {}\n}\n\nconst timer = new Timer();\ntimer.start();\n\
    ```\n\nAll functions defined with the `function` keyword can be used as function\
    \ constructors. The function constructor is called with the `new` operator. The\
    \ new object has the prototype set to FunctionConstructor.prototype.\n\n```\n\
    const timer = new Timer();\ntimer.__proto__ === Timer.prototype;\n```\n\nTo prevent\
    \ method redefinition the prototype should be frozen.\n\n```\nTimer.prototype\
    \ = Object.freeze({\n  start : function() {},\n  stop : function() {}\n});\n```\n\
    \n#### new\n\nWhen `new Timer()` is executed it does similar steps as the `newTimer()`\
    \ function:\n\n```\nfunction newTimer(){\n  let newObj = Object.create(Timer.prototype);\n\
    \  let returnObj = Timer.call(newObj, arguments);\n  if(returnObj) return returnObj;\n\
    \n  return newObj;\n}\n```\n\nA new object is created with `Timer.prototype` as\
    \ its prototype. Then the `Timer` function runs and sets the fields on the new\
    \ object.\n\n### Class\n\n`class` offers a much better sugar syntax for building\
    \ objects with a custom prototype. Check out the next example:\n\n```\nclass Timer{\n\
    \  constructor(){\n    this.secret = 0;\n  }\n\n  start() {}\n  stop() {}  \n\
    }\n```\n\nObjects built with `class` have the prototype set to ClassName.prototype.\n\
    \n```\nconst timer = new Timer();\ntimer.__proto__ === Timer.prototype;\n```\n\
    \nIn order to avoid method redefinition we need to freeze the class’ prototype.\n\
    \n```\nObject.freeze(Timer.prototype);\n```\n\n### No privacy\n\nThe prototype-based\
    \ inheritance patterns have no privacy. All object’s properties are public.\n\n\
    `Object.keys()` returns an array with all the own property keys. It can be used\
    \ to iterate over the object’s properties.\n\n```\nfunction logProperty(name){\n\
    \  console.log(name); //property name\n  console.log(obj[name]); //value\n}\n\n\
    Object.keys(obj).forEach(logProperty);\n```\n\n### Final thoughts\n\nObjects are\
    \ dynamic in nature and can be used as maps. All object’s properties are public.\n\
    \nObjects inherit from other objects.\n\nConstructor function and class are a\
    \ sugar syntax for creating objects that inherit from a custom prototype object.\
    \ They first define the custom prototype with all methods and then the `new` operator\
    \ creates objects that inherit from that prototype.\n\n# Chapter 14: Objects with\
    \ closures\n\n> Closure - is a consequence of functions that can nest and functions\
    \ that are first class values, and JavaScript has it, and is almost completely\
    \ right in the way it implements them, and it’s maybe the best feature ever put\
    \ into a programming language.— Douglas Crockford\n\nClosures can be created as\
    \ functions with private state. More than that, we can create many closures sharing\
    \ the same private state. This way, we can build objects as collections of closures.\
    \ Closures encapsulate state.\n\n### Factory functions\n\nLet’s see how we can\
    \ do that. We start from the Revealing Module pattern, give that function a name\
    \ and use it to build new encapsulated objects. Here is an example of the `Counter`\
    \ function that can create counter objects:\n\n```\nfunction Counter(){\n    let\
    \ state = 0;\n\n    function increment(){\n       state += 1;\n       return state;\n\
    \    }\n\n    function decrement(){\n       state -= 1;\n       return state;\n\
    \    }\n\n    return Object.freeze({\n       increment,\n       decrement\n  \
    \  });\n};\n\nconst counter = Counter();\ncounter.increment(); //1\ncounter.increment();\
    \ //2\ncounter.increment(); //3\n\nconst otherCounter = Counter();\notherCounter.increment();\
    \ //1\n```\n\nThe `Counter` function is called factory function. Objects built\
    \ this way have a series of benefits.\n\n### Encapsulation\n\nEncapsulation means\
    \ information hiding."
