    \nScope objects make a scope chain. It is similar in concept to the prototype\
    \ chain. When a variable is used, the program looks down the scope chain until\
    \ it finds that variable.\n\nA closure is a function having a private reference\
    \ to the scope object of the outer function where it is created.\n\n### Garbage\
    \ collection\n\nThe private state of a closure becomes eligible for garbage collection\
    \ after the closure itself is garbage collected. To make this possible, the closure\
    \ should no longer have a reference to it.\n\nIn the next example, first, the\
    \ `add()` closure function is created:\n\n```\nlet add = (function createAddClosure(){\n\
    \    let arr = [];\n    return function(obj){\n       arr.push(obj);\n    }\n\
    })();\n```\n\nThen, two functions working with the closure function are defined:\n\
    \n*   `addALotOfObjects()` adds a lot of objects to the closure’s private state.\n\
    \n*   `clearAllObjects()` sets the closure reference to `null`.\n\nBoth functions\
    \ are used as event handlers:\n\n```\nfunction Todo(){}\n\nfunction addALotOfObjects(){\n\
    \    for(let i=1; i<=10000;i++) {\n       add(new Todo(i));\n    }\n}\n\nfunction\
    \ clearAllObjects(){\n    if(add){\n       add = null;\n    }\n}\n\n$(\"#add\"\
    ).click(addALotOfObjects);\n$(\"#clear\").click(clearAllObjects);\n```\n\nClicking\
    \ “Add” will add 10,000 to-dos to the closure’s private state.\n\n![](Images/image00078.jpeg\
    \ \"Memory snapshot after adding 10000 to-dos\")\n\nClicking “Clear” will set\
    \ the closure reference to `null`. After doing that, the private state is garbage\
    \ collected.\n\n![](Images/image00079.gif \"Memory snapshot after setting the\
    \ closure reference to null\")\n\n### Final thoughts\n\nClosures are inner functions\
    \ having access to variables from the outer scopes.\n\nVariables used in closures\
    \ live as long as closures live.\n\nClosures create encapsulation.\n\nFirst-class\
    \ functions and closures open the way for functional programming in JavaScript.\n\
    \n# Chapter 5: Function decorators\n\n> A function decorator is a higher-order\
    \ function that takes one function as an argument and returns another function,\
    \ and the returned function is a variation of the argument function.— Reginald\
    \ Braithwaite, author of [JavaScript Allongé](https://www.amazon.com/Javascript-Allong%C3%A9-Reginald-Braithwaite-ebook/dp/B00FLKRCVO)\n\
    \nIn order to see the concept in practice, we will write some common function\
    \ decorators found in libraries like [lodash.js](https://lodash.com/docs/4.17.5),\
    \ [underscore.js](http://underscorejs.org/#functions), or [ramda.js](http://ramdajs.com/docs/).\n\
    \n### once()\n\n`once(fn)` creates a function that executes the original function\
    \ only one time. It is useful when we want to execute the function once, no matter\
    \ how many times is called from different places.\n\n```\nfunction once(fn){\n\
    \  let returnValue;\n  let canRun = true;\n  return function(...args){\n     if(canRun)\
    \ {\n         returnValue = fn(...args);\n         canRun = false;\n     }\n \
    \    return returnValue;\n  }\n}\n\nfunction process(){ \n  console.log(\"process\"\
    ); \n}\n\nconst processOnce = once(process);\nprocessOnce(); //process\nprocessOnce();\
    \ //\nprocessOnce(); //\n```\n\n`once()` is a function that returns another function.\
    \ The returned function is a closure. Note how the original function is called\
    \ with all the arguments: `fn(...args)`.\n\n### after()\n\n`after(fn, count)`\
    \ creates a version of the function that executes only after a number of calls.\
    \ For example, it can be used to run the function after all asynchronous operations\
    \ have finished.\n\n```\nfunction after(fn, startCount){\n  let count = 0;\n \
    \ return function(...args){\n     count = count + 1;\n     if (count >= startCount)\
    \ {\n         return fn(...args);        \n     }\n  }\n}\n\nfunction logResult()\
    \ { \n  console.log(\"finish\"); \n}\n\nconst logResultAfter2 = after(logResult,\
    \ 2);\nsetTimeout(function firstCall(){ \n  console.log(\"1st\"); \n  logResultAfter2();\
    \ \n}, 3000);\n\nsetTimeout(function secondCall(){ \n  console.log(\"2nd\"); \n\
    \  logResultAfter2(); \n}, 4000);\n\n//\"1st\"\n//\"2nd\"\n//\"finish\"\n```\n\
    \nIn this example, I am using `after()` to build a new function `logResultAfter2()`\
    \ that executes the original code of `logResult()` starting with the second call.\n\
    \n### throttle()\n\n`throttle(fn, wait)` creates a version of the function that,\
    \ when invoked repeatedly, will call the original function once per every `wait`\
    \ milliseconds. It is useful for limiting events that occur faster.\n\n```\nfunction\
    \ throttle(fn, interval) {\n  let lastTime;\n  return function throttled(...args)\
    \ {\n    if(!lastTime || (Date.now() - lastTime >= interval)) {\n      fn(...args);\n\
    \      lastTime = Date.now();\n    }\n  }\n}\n\nlet throttledProcess = throttle(process,\
    \ 1000);\n$(window).mousemove(throttledProcess);\n```\n\nIn this example, moving\
    \ the mouse will generate a lot of `mousemove` events, but the original function\
    \ will be called once per second.\n\n### debounce()\n\n`debounce(fn, wait)` creates\
    \ a version of the function that, when invoked repeatedly, will call the original\
    \ function after `wait` milliseconds since the last invocation. It is useful for\
    \ running a function only after the event has stopped arriving.\n\n```\nfunction\
    \ debounce(fn, interval) {\n  let timer;\n  return function debounced(...args)\
    \ {\n    clearTimeout(timer);\n    timer = setTimeout(function(){\n      fn(...args);\n\
    \    }, interval);\n  }\n}\n\nlet debouncedProcess = debounce(process, 400);\n\
    $(window).resize(debouncedProcess);\n```\n\nSome common events to take in consideration\
    \ for `debounce` are `scroll`, `resize`, `mousemove` or `keypress`.\n\n### memoize()\n\
    \nMemoization is a technique for improving execution speed by saving the previous\
    \ results and use them to avoid computation. Memoization is different than caching,\
    \ in the sense that it works only with deterministic functions.\n\n`memoize(fn)`\
    \ creates a memoized version of a function. It is useful for speeding up slow\
    \ computations."
