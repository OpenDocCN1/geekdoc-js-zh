  trans: "\n\n`generator()` 函数是一个闭包。它可以访问其父函数 `sequence()` 中的 `count` 变量。即使在 `sequence()`\
    \ 执行完毕后，它仍然可以访问 `count` 变量。\n\n`generator()` 闭包是通过一个返回函数的函数创建的。这样，闭包函数在其父函数调用后依然存活。`sequence()`\
    \ 是一个高阶函数。\n\n### 具有私有状态的函数\n\n利用闭包，我们可以创建具有私有状态的函数。闭包封装了状态。\n\n`generator()`\
    \ 闭包就是一个具有私有状态的函数。每次调用时，它都会记住之前的 `count` 状态，并返回下一个连续的数字。`count` 变量是私有的，外部无法访问。\n\
    \n### 具有私有状态的函数\n\n我们可以进一步扩展这个思路，创建多个共享同一私有状态的闭包。在下一个示例中，`increment()` 和 `decrement()`\
    \ 是两个共享同一私有 `state` 变量的闭包。\n\n```\nconst counter = (function(){\n    let state\
    \ = 0;\n\n    function increment(){\n       state += 1;\n       return state;\n\
    \    }\n\n    function decrement(){\n       state -= 1;\n       return state;\n\
    \    }\n\n    return {\n       increment,\n       decrement\n    }\n})();\n\n\
    counter.increment(); //1\ncounter.increment(); //2\ncounter.decrement(); //1\n\
    ```\n\n这种模式被称为“揭示模块模式”。\n\n使用 ES6 模块也可以实现相同的行为。\n\n```\n//module \"./counter.js\"\
    \nlet state = 0;\n\nfunction increment() {\n  state += 1;\n  return state;\n}\n\
    \nfunction decrement() {\n  state -= 1;\n  return state;\n}\n\nexport default\
    \ {\n  increment,\n  decrement\n}\n\n//module \"./index.js\"\nimport counter from\
    \ \"./counter\";\n\ncounter.increment(); //1\ncounter.increment(); //2\ncounter.decrement();\
    \ //1\n```\n\n### 作用域对象\n\n当函数执行时，会创建一个新的私有作用域对象。该作用域对象包含所有参数和局部变量。它还包含一个指向其创建时外部作用域对象的引用。\n\
    \n作用域对象像其他对象一样被分配。函数执行后，作用域对象不会自动清理。当没有更多引用指向它们时，它们会像普通对象一样被垃圾回收。\n\n作用域对象构成了一条作用域链。它在概念上类似于原型链。当使用一个变量时，程序会沿着作用域链向下查找，直到找到该变量。\n\
    \n闭包是一个函数，它拥有对其创建时外部函数作用域对象的私有引用。\n\n### 垃圾回收\n\n闭包的私有状态在闭包本身被垃圾回收后才有资格被回收。为了实现这一点，闭包不应再持有对该状态的引用。\n\
    \n在下一个示例中，首先创建了 `add()` 闭包函数：\n\n```\nlet add = (function createAddClosure(){\n\
    \    let arr = [];\n    return function(obj){\n       arr.push(obj);\n    }\n\
    })();\n```\n\n然后，定义了两个与该闭包函数配合使用的函数：\n\n*   `addALotOfObjects()` 向闭包的私有状态中添加大量对象。\n\
    *   `clearAllObjects()` 将闭包引用设置为 `null`。\n\n这两个函数都用作事件处理程序：\n\n```\nfunction Todo(){}\n\
    \nfunction addALotOfObjects(){\n    for(let i=1; i<=10000;i++) {\n       add(new\
    \ Todo(i));\n    }\n}\n\nfunction clearAllObjects(){\n    if(add){\n       add\
    \ = null;\n    }\n}\n\n$(\"#add\").click(addALotOfObjects);\n$(\"#clear\").click(clearAllObjects);\n\
    ```\n\n点击“Add”将向闭包的私有状态中添加 10,000 个待办事项。\n\n![](img/image00078.jpeg \"添加 10000\
    \ 个待办事项后的内存快照\")\n\n点击“Clear”会将闭包引用设置为 `null`。之后，私有状态将被垃圾回收。\n\n![](img/image00079.gif\
    \ \"将闭包引用设置为 null 后的内存快照\")\n\n### 总结\n\n闭包是可以访问外部作用域变量的内部函数。\n\n闭包中使用的变量与闭包共存亡。\n\
    \n闭包实现了封装。\n\n一等函数和闭包为 JavaScript 中的函数式编程开辟了道路。\n\n# 第 5 章：函数装饰器\n\n> 函数装饰器是一个高阶函数，它接受一个函数作为参数并返回另一个函数，返回的函数是参数函数的变体。——\
    \ Reginald Braithwaite，《JavaScript Allongé》作者\n\n为了在实践中理解这一概念，我们将编写一些常见的函数装饰器，这些装饰器可以在\
    \ [lodash.js](https://lodash.com/docs/4.17.5)、[underscore.js](http://underscorejs.org/#functions)\
    \ 或 [ramda.js](http://ramdajs.com/docs/) 等库中找到。\n\n### once()\n\n`once(fn)` 创建一个只执行原始函数一次的函数。当我们希望函数只执行一次，无论从不同地方调用多少次时，这非常有用。\n\
    \n```\nfunction once(fn){\n  let returnValue;\n  let canRun = true;\n  return\
    \ function(...args){\n     if(canRun) {\n         returnValue = fn(...args);\n\
    \         canRun = false;\n     }\n     return returnValue;\n  }\n}\n\nfunction\
    \ process(){ \n  console.log(\"process\"); \n}\n\nconst processOnce = once(process);\n\
    processOnce(); //process\nprocessOnce(); //\nprocessOnce(); //\n```\n\n`once()`\
    \ 是一个返回另一个函数的函数。返回的函数是一个闭包。注意原始函数是如何通过所有参数调用的：`fn(...args)`。\n\n### after()\n\n\
    `after(fn, count)` 创建一个仅在调用一定次数后才执行的函数版本。例如，它可以用于在所有异步操作完成后运行函数。\n\n```\nfunction\
    \ after(fn, startCount){\n  let count = 0;\n  return function(...args){\n    \
    \ count = count + 1;\n     if (count >= startCount) {\n         return fn(...args);\
    \        \n     }\n  }\n}\n\nfunction logResult() { \n  console.log(\"finish\"\
    ); \n}\n\nconst logResultAfter2 = after(logResult, 2);\nsetTimeout(function firstCall(){\
    \ \n  console.log(\"1st\"); \n  logResultAfter2(); \n}, 3000);\n\nsetTimeout(function\
    \ secondCall(){ \n  console.log(\"2nd\"); \n  logResultAfter2(); \n}, 4000);\n\
    \n//\"1st\"\n//\"2nd\"\n//\"finish\"\n```\n\n在这个示例中，我使用 `after()` 构建了一个新函数 `logResultAfter2()`，该函数从第二次调用开始执行\
    \ `logResult()` 的原始代码。\n\n### throttle()\n\n`throttle(fn, wait)` 创建一个函数版本，当重复调用时，每\
    \ `wait` 毫秒最多调用一次原始函数。它对于限制过快发生的事件非常有用。\n\n```\nfunction throttle(fn, interval)\
    \ {\n  let lastTime;\n  return function throttled(...args) {\n    if(!lastTime\
    \ || (Date.now() - lastTime >= interval)) {\n      fn(...args);\n      lastTime\
    \ = Date.now();\n    }\n  }\n}\n\nlet throttledProcess = throttle(process, 1000);\n\
    $(window).mousemove(throttledProcess);\n```\n\n在这个示例中，移动鼠标会生成大量 `mousemove` 事件，但原始函数每秒只会被调用一次。\n\
    \n### debounce()\n\n`debounce(fn, wait)` 创建一个函数版本，当重复调用时，会在最后一次调用后等待 `wait` 毫秒才执行原始函数。它适用于仅在事件停止到达后运行函数。\n\
    \n```\nfunction debounce(fn, interval) {\n  let timer;\n  return function debounced(...args)\
    \ {\n    clearTimeout(timer);\n    timer = setTimeout(function(){\n      fn(...args);\n\
    \    }, interval);\n  }\n}\n\nlet debouncedProcess = debounce(process, 400);\n\
    $(window).resize(debouncedProcess);\n```\n\n一些常见的适合 `debounce` 的事件包括 `scroll`、`resize`、`mousemove`\
    \ 或 `keypress`。\n\n### memoize()\n\n记忆化是一种通过保存先前结果并利用它们避免重复计算来提高执行速度的技术。记忆化与缓存不同，它只适用于确定性函数。\n\
    \n`memoize(fn)` 创建一个函数的记忆化版本。它对于加速慢速计算非常有用。\n\n"
- fmt: "\nHere is an implementation taking a function with one argument.\n\n```\n\
    function memoize(fn) {\n  const map = Object.create(null);\n  return function\
    \ (x) {\n    if (!map[x]){\n      map[x] = fn(x);\n    }\n\n    return map[x];\n\
    \  }\n}\n\nconst factorial = memoize(function(n){\n  console.log(\"n=\" + n);\n\
    \  if(n < 2) return 1;\n  return n * factorial(n-1);\n});\n\nconsole.log(factorial(3));\
    \ //6;\n//n=3\n//n=2\n//n=1\n\nconsole.log(factorial(5)); //120;\n//n=5\n//n=4\n\
    ```\n\n`factorial()` is a function with private state. The internal state is a\
    \ map storing the previous results.\n\n### unary()\n\n`unary(fn)` creates a version\
    \ of the function that takes only one argument. It is usually used to fix problems\
    \ when the function is called with more arguments than necessary.\n\n```\nfunction\
    \ unary(fn){\n  return function(first){\n    return fn(first);\n  }\n}\n```\n\n\
    Let’s try to use `console.log()` to log all numbers from an array.\n\n```\nconst\
    \ numbers = [1,2,3,4,5,6];\n\nnumbers.forEach(console.log);\n//1 0 (6) [1, 2,\
    \ 3, 4, 5, 6]\n//2 1 (6) [1, 2, 3, 4, 5, 6]\n//...\n```\n\nAs you can see, there\
    \ is a problem. `console.log()` receives more arguments than we want. We need\
    \ to call it with only one argument. Here is the code using the `unary()` function:\n\
    \n```\nnumbers.forEach(unary(console.log));\n//1 2 3 4 5 6\n```\n\nBelow is another\
    \ example using `unary()` to fix problems with `parseInt()`:\n\n```\nconst numbers\
    \ = ['1','2','3','4','5','6'];\n\nnumbers.map(parseInt); \n//[1, NaN, NaN, NaN,\
    \ NaN, NaN]\n\nnumbers.map(unary(parseInt)); \n//[1, 2, 3, 4, 5, 6]\n```\n\n###\
    \ binary()\n\n`binary(fn)` creates a version of the function that takes only two\
    \ arguments. It can be used to fix problems when the function is called with more\
    \ than two arguments.\n\n```\nfunction binary(fn){\n  return function(a, b){\n\
    \    return fn(a, b);\n  }\n}\n```\n\nIn the next example, `Math.max()` is called\
    \ with more arguments than we may expect. Because one of the arguments, the forth,\
    \ cannot be converted to a number the result is `NaN`.\n\n```\nconst numbers =\
    \ [1, 2, 3];\nnumbers.reduce(Math.max);\n//NaN\n```\n\nTo make sure `Math.max()`\
    \ is called with two arguments we can use the `binary()` decorator:\n\n```\nconst\
    \ numbers = [1, 2, 3];\nnumbers.reduce(binary(Math.max));\n//3\n\nnumbers.reduce(binary(Math.min));\n\
    //1\n```\n\n### Preserve function context\n\nIn order to preserve the original\
    \ function context we need to do two things:\n\n*   The decorator should return\
    \ a function using the `function` keyword, not the arrow syntax.\n\n*   The original\
    \ function should be called with `fn.apply(this, args)` or `fn.call(this, ...args)`.\n\
    \n### Final thoughts\n\nFunction decorators are a powerful tool for creating variations\
    \ of existing functions without modifying the original functions. They can be\
    \ part of the functional programming toolbox for reusing common logic.\n\n# Chapter\
    \ 6: Pure functions\n\n> A pure function is a function that given the same input\
    \ always returns the same output and has no side effects.\n\nPure functions promise\
    \ to make code easier to read, understand, test, debug, compose. These are big\
    \ promises. Let’s see what they can do.\n\n### Reading from inside\n\nWe don’t\
    \ need to think about how changing variable in the current function will affect\
    \ other functions. We don’t need to think about how changing a variable in other\
    \ functions will affect the current function.\n\nHere is a pure function:\n\n\
    ```\nfunction capitalize(name) {\n  if(name){\n    return name.charAt(0).toUpperCase()\
    \ + name.slice(1);\n  }\n\n  return name;\n}\n\ncapitalize(\"chapter\");\n//\"\
    Chapter\"\n```\n\nWhen reading a pure function we can focus on one place, the\
    \ current function. Pure functions give the reader less code to read.\n\n### Reading\
    \ from outside\n\nLook at the code below:\n\n```\nconst arr = [1, 2, 3];\nconst\
    \ newValue = compute(arr);\n\nconsole.log(arr);\n//[1, 2, 3]\n```\n\nWhen `compute()`\
    \ is a pure function, we are sure that `console` will log `[1, 2, 3]`, we don’t\
    \ need to read and understand the `compute()` function.\n\nFewer things to read\
    \ and understand makes code easier to read.\n\n### Side effects\n\nA side effect\
    \ is a change of a variable from outside the local environment or interaction\
    \ with the outside environment that happens during the computation of the result.\n\
    \nHere are some examples of side effects:\n\n*   reading and changing state out\
    \ of local scope\n\n*   modifying objects taken as arguments\n\n*   network calls\n\
    \n*   reading and writing to DOM\n\n*   writing to console\n\n*   emitting/dispatching\
    \ events\n\n*   reading and writing to local storage\n\n*   using timers\n\nChanging\
    \ the outside environment in any way is a side effect.\n\nMutating the external\
    \ state may create unexpected issues in some other distant part of the code. Especially\
    \ changing input values can create hard to understand bugs. We don’t know where\
    \ the input object comes from or how changing it will affect other functions.\n\
    \nThe result of a function with side effects depends on the external environment.\
    \ Given the same input, it may return different results as the outside state may\
    \ change.\n\nHere are a few functions with side effects:\n\n`getNextValue()` is\
    \ not pure, it changes state outside the function scope.\n\n```\nlet startValue\
    \ = 0;\n\nfunction getNextValue(){\n    startValue += 1;\n    return startValue;\n\
    }\n\ngetNextValue(); //1\ngetNextValue(); //2\n```\n\n`addValue()` is not pure,\
    \ it mutates the input variable.\n\n```\nfunction addValue(list, value){\n   \
    \ list.push(value);\n}\n\nconst numbers = [];\n\naddValue(numbers, 1);\nconsole.log(numbers);\n\
    //[1]\n\naddValue(numbers, 2);\nconsole.log(numbers);\n//[1, 2]\n```\n\n### Free\
    \ variables\n\n> A free variable is a variable used in a function that is neither\
    \ a local variables nor a parameter of the function.\n\nPure functions can access\
    \ free variables if they are constants. A constant is a variable declared with\
    \ `const` and storing an immutable value.\n\n```\nconst vatTax = 20;\n\nfunction\
    \ getFinalPrice(price){\n  return price * (1 + vatTax/100);\n}\n\ngetFinalPrice(10);\n\
    //12\n```\n\n`getFinalPrice()` is a pure function.\n\nPure functions don’t access\
    \ variables from the outside environment that can change.\n\n### Immutability\n\
    \nAn immutable value is a value that, once created, cannot be changed.\n\nPure\
    \ functions treat input values as immutable. Ideally, input values should be immutable\
    \ values. It is a good practice to return an immutable value.\n\n### `this` in\
    \ pure functions\n\n`this` is an implicit input.\n\nWhen `this` is used, we need\
    \ to use the function as a method or call the function with `call()` or `apply()`\
    \ and pass in the context object.\n\n`this` should be treated as an immutable\
    \ input value, even if it is not. For example `filter()`, `map()` and `reduce()`\
    \ are pure array methods, creating new arrays and using `this` as their input.\
    \ `sort()` array method is impure, it modifies the input array.\n\nWhen `this`\
    \ is used and we invoke the function with the function form, we create a side\
    \ effect. In this case, the function may give different results depending on the\
    \ environment in which it is run. `this` becomes a free variable.\n\nWe want explicit\
    \ inputs on functions. If we want to compose functions easily, `this` should not\
    \ be used.\n\nMaking the context object explicit means to add it to the parameter\
    \ list.\n\n```\nfunction transform(context) { }\n```\n\nI would say to avoid `this`\
    \ in pure functions.\n\n### Deterministic function\n\nA pure function is a deterministic\
    \ function. For a specific input, it always returns the same output.\n\n`Math.random()`\
    \ or `Date.now()` will not be used in pure functions as they give different results\
    \ on each call.\n\nThe next function has no side effects, but it is not deterministic.\
    \ It is not a pure function:\n\n```\nfunction getNextValue(){\n    return Math.random();\n\
    }\n```\n\n### Referential transparency\n\n> An function has referential transparency\
    \ if it can be replaced with its output value and the application behavior doesn’t\
    \ change.\n\nBecause we can replace the function with its result it means that\
    \ the function has no side effects. A referentially transparent function does\
    \ nothing else but computing the result.\n\nA function that has referential transparency\
    \ is a pure function.\n"
  raw: "Here is an implementation taking a function with one argument.\n\n```\nfunction\
    \ memoize(fn) {\n  const map = Object.create(null);\n  return function (x) {\n\
    \    if (!map[x]){\n      map[x] = fn(x);\n    }\n\n    return map[x];\n  }\n\
    }\n\nconst factorial = memoize(function(n){\n  console.log(\"n=\" + n);\n  if(n\
    \ < 2) return 1;\n  return n * factorial(n-1);\n});\n\nconsole.log(factorial(3));\
    \ //6;\n//n=3\n//n=2\n//n=1\n\nconsole.log(factorial(5)); //120;\n//n=5\n//n=4\n\
    ```\n\n`factorial()` is a function with private state. The internal state is a\
    \ map storing the previous results.\n\n### unary()\n\n`unary(fn)` creates a version\
    \ of the function that takes only one argument. It is usually used to fix problems\
    \ when the function is called with more arguments than necessary.\n\n```\nfunction\
    \ unary(fn){\n  return function(first){\n    return fn(first);\n  }\n}\n```\n\n\
    Let’s try to use `console.log()` to log all numbers from an array.\n\n```\nconst\
    \ numbers = [1,2,3,4,5,6];\n\nnumbers.forEach(console.log);\n//1 0 (6) [1, 2,\
    \ 3, 4, 5, 6]\n//2 1 (6) [1, 2, 3, 4, 5, 6]\n//...\n```\n\nAs you can see, there\
    \ is a problem. `console.log()` receives more arguments than we want. We need\
    \ to call it with only one argument. Here is the code using the `unary()` function:\n\
    \n```\nnumbers.forEach(unary(console.log));\n//1 2 3 4 5 6\n```\n\nBelow is another\
    \ example using `unary()` to fix problems with `parseInt()`:\n\n```\nconst numbers\
    \ = ['1','2','3','4','5','6'];\n\nnumbers.map(parseInt); \n//[1, NaN, NaN, NaN,\
    \ NaN, NaN]\n\nnumbers.map(unary(parseInt)); \n//[1, 2, 3, 4, 5, 6]\n```\n\n###\
    \ binary()\n\n`binary(fn)` creates a version of the function that takes only two\
    \ arguments. It can be used to fix problems when the function is called with more\
    \ than two arguments.\n\n```\nfunction binary(fn){\n  return function(a, b){\n\
    \    return fn(a, b);\n  }\n}\n```\n\nIn the next example, `Math.max()` is called\
    \ with more arguments than we may expect. Because one of the arguments, the forth,\
    \ cannot be converted to a number the result is `NaN`.\n\n```\nconst numbers =\
    \ [1, 2, 3];\nnumbers.reduce(Math.max);\n//NaN\n```\n\nTo make sure `Math.max()`\
    \ is called with two arguments we can use the `binary()` decorator:\n\n```\nconst\
    \ numbers = [1, 2, 3];\nnumbers.reduce(binary(Math.max));\n//3\n\nnumbers.reduce(binary(Math.min));\n\
    //1\n```\n\n### Preserve function context\n\nIn order to preserve the original\
    \ function context we need to do two things:\n\n*   The decorator should return\
    \ a function using the `function` keyword, not the arrow syntax.\n\n*   The original\
    \ function should be called with `fn.apply(this, args)` or `fn.call(this, ...args)`.\n\
    \n### Final thoughts\n\nFunction decorators are a powerful tool for creating variations\
    \ of existing functions without modifying the original functions. They can be\
    \ part of the functional programming toolbox for reusing common logic.\n\n# Chapter\
    \ 6: Pure functions\n\n> A pure function is a function that given the same input\
    \ always returns the same output and has no side effects.\n\nPure functions promise\
    \ to make code easier to read, understand, test, debug, compose. These are big\
    \ promises. Let’s see what they can do.\n\n### Reading from inside\n\nWe don’t\
    \ need to think about how changing variable in the current function will affect\
    \ other functions. We don’t need to think about how changing a variable in other\
    \ functions will affect the current function.\n\nHere is a pure function:\n\n\
    ```\nfunction capitalize(name) {\n  if(name){\n    return name.charAt(0).toUpperCase()\
    \ + name.slice(1);\n  }\n\n  return name;\n}\n\ncapitalize(\"chapter\");\n//\"\
    Chapter\"\n```\n\nWhen reading a pure function we can focus on one place, the\
    \ current function. Pure functions give the reader less code to read.\n\n### Reading\
    \ from outside\n\nLook at the code below:\n\n```\nconst arr = [1, 2, 3];\nconst\
    \ newValue = compute(arr);\n\nconsole.log(arr);\n//[1, 2, 3]\n```\n\nWhen `compute()`\
    \ is a pure function, we are sure that `console` will log `[1, 2, 3]`, we don’t\
    \ need to read and understand the `compute()` function.\n\nFewer things to read\
    \ and understand makes code easier to read.\n\n### Side effects\n\nA side effect\
    \ is a change of a variable from outside the local environment or interaction\
    \ with the outside environment that happens during the computation of the result.\n\
    \nHere are some examples of side effects:\n\n*   reading and changing state out\
    \ of local scope\n\n*   modifying objects taken as arguments\n\n*   network calls\n\
    \n*   reading and writing to DOM\n\n*   writing to console\n\n*   emitting/dispatching\
    \ events\n\n*   reading and writing to local storage\n\n*   using timers\n\nChanging\
    \ the outside environment in any way is a side effect.\n\nMutating the external\
    \ state may create unexpected issues in some other distant part of the code. Especially\
    \ changing input values can create hard to understand bugs. We don’t know where\
    \ the input object comes from or how changing it will affect other functions.\n\
    \nThe result of a function with side effects depends on the external environment.\
    \ Given the same input, it may return different results as the outside state may\
    \ change.\n\nHere are a few functions with side effects:\n\n`getNextValue()` is\
    \ not pure, it changes state outside the function scope.\n\n```\nlet startValue\
    \ = 0;\n\nfunction getNextValue(){\n    startValue += 1;\n    return startValue;\n\
    }\n\ngetNextValue(); //1\ngetNextValue(); //2\n```\n\n`addValue()` is not pure,\
    \ it mutates the input variable.\n\n```\nfunction addValue(list, value){\n   \
    \ list.push(value);\n}\n\nconst numbers = [];\n\naddValue(numbers, 1);\nconsole.log(numbers);\n\
    //[1]\n\naddValue(numbers, 2);\nconsole.log(numbers);\n//[1, 2]\n```\n\n### Free\
    \ variables\n\n> A free variable is a variable used in a function that is neither\
    \ a local variables nor a parameter of the function.\n\nPure functions can access\
    \ free variables if they are constants. A constant is a variable declared with\
    \ `const` and storing an immutable value.\n\n```\nconst vatTax = 20;\n\nfunction\
    \ getFinalPrice(price){\n  return price * (1 + vatTax/100);\n}\n\ngetFinalPrice(10);\n\
    //12\n```\n\n`getFinalPrice()` is a pure function.\n\nPure functions don’t access\
    \ variables from the outside environment that can change.\n\n### Immutability\n\
    \nAn immutable value is a value that, once created, cannot be changed.\n\nPure\
    \ functions treat input values as immutable. Ideally, input values should be immutable\
    \ values. It is a good practice to return an immutable value.\n\n### `this` in\
    \ pure functions\n\n`this` is an implicit input.\n\nWhen `this` is used, we need\
    \ to use the function as a method or call the function with `call()` or `apply()`\
    \ and pass in the context object.\n\n`this` should be treated as an immutable\
    \ input value, even if it is not. For example `filter()`, `map()` and `reduce()`\
    \ are pure array methods, creating new arrays and using `this` as their input.\
    \ `sort()` array method is impure, it modifies the input array.\n\nWhen `this`\
    \ is used and we invoke the function with the function form, we create a side\
    \ effect. In this case, the function may give different results depending on the\
    \ environment in which it is run. `this` becomes a free variable.\n\nWe want explicit\
    \ inputs on functions. If we want to compose functions easily, `this` should not\
    \ be used.\n\nMaking the context object explicit means to add it to the parameter\
    \ list.\n\n```\nfunction transform(context) { }\n```\n\nI would say to avoid `this`\
    \ in pure functions.\n\n### Deterministic function\n\nA pure function is a deterministic\
    \ function. For a specific input, it always returns the same output.\n\n`Math.random()`\
    \ or `Date.now()` will not be used in pure functions as they give different results\
    \ on each call.\n\nThe next function has no side effects, but it is not deterministic.\
    \ It is not a pure function:\n\n```\nfunction getNextValue(){\n    return Math.random();\n\
    }\n```\n\n### Referential transparency\n\n> An function has referential transparency\
    \ if it can be replaced with its output value and the application behavior doesn’t\
    \ change.\n\nBecause we can replace the function with its result it means that\
    \ the function has no side effects. A referentially transparent function does\
    \ nothing else but computing the result.\n\nA function that has referential transparency\
    \ is a pure function."
