  trans: "\n\n> 链式调用是一种用于简化代码的技术，即对同一个对象连续调用多个方法。\n\n`map()` 和 `filter()` 被链式调用。\n\
    \n我们可以通过提取匿名回调函数并赋予其意图明确的名称来进一步改进代码。请看下面的代码：\n\n```\nfunction isPriorityTodo(todo){\n\
    \   return todo.type === \"RE\" && !todo.completed;\n}\n\nfunction toTodoView(todo)\
    \ {\n   return { ...todo, userName: todo.user.name };\n}\n\nconst filteredTodos\
    \ = todos\n .filter(todo => isPriorityTodo(todo))\n .map(todo => toTodoView(todo));\n\
    ```\n\n`isPriorityTodo()` 和 `toTodoView()` 是纯函数，且具有意图明确的名称。\n\n### 无点风格\n\n> 无点风格是一种通过消除不必要的参数来提高可读性的技术。\n\
    \n回顾之前的代码：\n\n```\nconst filteredTodos = todos\n .filter(todo => isPriorityTodo(todo))\n\
    \ .map(todo => toTodoView(todo));\n```\n\n以下是消除不必要参数后的代码：\n\n```\nconst filteredTodos\
    \ = todos\n  .filter(isPriorityTodo)\n  .map(toTodoView);\n```\n\n无点风格可以在特定场景下提高可读性。\n\
    \n在无点风格中，没有 `function` 关键字，也没有箭头语法。这意味着我们使用另一个函数来创建所需的函数。在无点风格中，我们看到的只有函数名。\n\n\
    ### 使用 reduce 重构\n\n以购物清单为例：\n\n```\nconst shoppingList = [\n   {name: \"orange\"\
    , quantity: 2, price: 10, type: \"FRT\"},\n   {name: \"lemon\", quantity: 1, price:\
    \ 15, type: \"FRT\"},\n   {name: \"fish\", quantity: 0.5, price: 30, type: \"\
    MET\"}\n];\n```\n\n下面是计算总价和水果价格的命令式代码：\n\n```\nlet totalPrice = 0, fruitsPrice\
    \ = 0;\nfor(let i=0; i<shoppingList.length; i++){\n   let line = shoppingList[i];\n\
    \   totalPrice += line.quantity * line.price;\n   if (line.type === \"FRT\") {\n\
    \       fruitsPrice += line.quantity * line.price;\n   }\n}\n\nconsole.log(totalPrice);\n\
    //50\nconsole.log(fruitsPrice);\n//35\n```\n\n在这种情况下，采用函数式方法需要使用 `reduce()` 来计算总价。\n\
    \n> `reduce()` 将一组值归约为一个值\n\n和之前一样，我们使用具有意图明确名称的纯函数、纯数组方法和无点风格来重构代码：\n\n```\n\
    function addPrice(totalPrice, line){\n   return totalPrice + (line.quantity *\
    \ line.price);\n}\n\nfunction areFruits(line){\n   return line.type === \"FRT\"\
    ;\n}\n\nlet totalPrice = shoppingList.reduce(addPrice, 0);\nlet fruitsPrice =\
    \ shoppingList\n              .filter(areFruits)\n              .reduce(addPrice,\
    \ 0);\n```\n\n### 分解\n\n我们处理问题的自然方式是将问题分解成更小的部分，然后再将它们组合起来。\n\n我们的目标应该是创建具有意图明确名称的小型纯函数，然后再将它们组合起来。\n\
    \n为这些小函数命名需要时间，但如果命名得当，将使代码更易于阅读。\n\n将存在两种函数：\n\n*   执行单一任务的函数\n\n*   协调多个任务的函数。这里我们可以使用无点风格使代码更易读。\n\
    \n### 最终思考\n\n以函数式风格处理集合时，会将数据转换分解为 filter、map、reduce 或 sort 等步骤。同时，需要定义小型纯函数来支持这些转换。\n\
    \n无点风格提高了代码的清晰度和可读性。\n\n函数式编程结合赋予意图明确名称的实践，极大地提高了代码的可读性。\n\n# 第 12 章：异步编程\n\n\
    从某种意义上说，函数分为两种：同步函数和异步函数。\n\n> 同步函数只有在操作完成后才会返回。\n\n> 异步函数启动操作后立即返回。操作可能在未来的某个时刻完成。\n\
    \n在控制台应用程序中，像 `Console.ReadKey()` 这样的命令会阻塞程序，直到按下某个字符。这种方法对于无法执行其他操作的控制台应用程序可能有效，但对于\
    \ Web 应用程序则行不通。\n\n同步代码易于理解，但在某些情况下，我们需要在不阻塞界面的情况下执行操作。从这个角度来看：\n\n> 同步代码是阻塞的。\n\
    \n> 异步代码是非阻塞的。\n\n我们需要一种方法来监听用户交互或从 Web API 获取数据，同时不阻塞界面。这就是异步编程模型的作用。\n\n###\
    \ 阻塞与非阻塞\n\n顺序模型会因输入/输出或任何长时间运行的过程而阻塞程序。异步模型则不会阻塞。考虑以下代码：\n\n```\nfunction block(duration){\n\
    \  const starTime = Date.now();\n  while (Date.now() < starTime + duration) {}\n\
    }\n\nfunction logMessage(){\n  console.log(\"process ended\");\n}\n\nblock(5000);\n\
    logMessage();\n```\n\n这是一个阻塞代码的示例。它会阻塞所有操作 5 秒，然后执行 `logMessage()` 函数。当应用程序被阻塞时，它将无法响应。\n\
    \n让我们看看如何在不阻塞的情况下，在间隔时间后显示一条消息。\n\n```\nfunction logMessage(){\n  console.log(\"\
    process ended\");\n}\n\nfunction delay(duration, callback){\n  setTimeout(callback,\
    \ duration);\n}\n\ndelay(5000, logMessage);\n```\n\n这次应用程序没有被阻塞。5 秒后消息被显示。\n\n\
    异步函数会立即返回，因为它只是启动了待完成的工作，并不等待其完成。\n\n最常见的异步任务包括用户事件、网络调用和定时事件。\n\n### 回调\n\n回调提供了一种在异步操作完成时执行代码的简单方式。\n\
    \n> 回调是作为参数传递给另一个函数的函数。\n\n回调用于异步任务的最常见场景是事件。\n\n#### DOM 事件\n\n用户交互可能会产生许多事件，如\
    \ `click`、`focus`、`blur`、`keypress`。监听这些事件不会阻塞界面。\n\n看看下面使用回调处理 DOM 事件的示例，使用了\
    \ [jQuery](https://jquery.com/)：\n\n```\nfunction doSomething(){ }\n\n$(\"#btn\"\
    ).on(\"click\", doSomething);\n$(\"#input\").on(\"keypress\", doSomething);\n\
    ```\n\n另一个使用 [React](https://reactjs.org/) 的示例：\n\n```\nimport React from \"react\"\
    ;\n\nfunction TodoItem({ todo, onRemoveClick }) {\n  return (\n    <div>\n   \
    \   <div>{todo.title}</div>\n      <div>\n      <button onClick={onRemoveClick}>\n\
    \        Delete\n      </button>\n      </div>\n    </div>\n  );\n}\n```\n\n####\
    \ 定时事件\n\n有两个函数用于在指定的时间间隔执行代码。\n\n`setTimeout`：在间隔时间后执行一次回调。可以通过 `clearTimeout()`\
    \ 取消。\n\n`setInterval`：以指定的时间间隔重复执行回调。它会一直运行直到调用 `clearInterval` 函数。\n\n```\n\
    setInterval(doSomething, 5000);\n```\n\n#### 嵌套回调\n\n回调对于简单任务（如事件处理）非常有用，但难以组合。考虑\
    \ `fetchUsers()`、`fetchPosts()`、`fetchComments()` 能够进行网络调用，并在操作完成时接受一个回调来执行。\n\
    \n```\nfetchUsers(function(users) {\n  fetchPosts(function(dictionaries) {\n \
    \   fetchComments(function(todos) {\n      console.log(users);\n      console.log(dictionaries);\n\
    \      console.log(todos);\n    });\n  });\n});\n```\n\n如果希望同时启动所有网络调用，然后再执行某些操作呢？使用回调是可能的，但会更困难，并且可能使代码变得不必要的复杂。\n\
    \n### Promise\n\nPromise 为组合异步任务提供了更好的选择。\n\n> Promise 是一个对象，代表异步操作可能的未来结果。\n\n\
    Promise 可以在知道结果之前传递给代码的其他部分。\n\n#### 网络调用\n\nPromise 通常用于处理网络调用。在等待 Web API 响应时，应用程序不会被阻塞。更重要的是，网络调用可以并行运行。\n\
    \n"
- fmt: "\nNetwork calls can be done with the `fetch()` function. The `fetch()` function\
    \ returns a promise.\n\n### Composing promises\n\nLet’s look at how to compose\
    \ promises:\n\n```\nfunction fetchUsers() { \n  return fetch(\"/users\"); \n}\n\
    \nfunction fetchPosts() { \n  return fetch(\"/posts\"); \n}\n\nfunction fetchComments()\
    \ { \n  return fetch(\"/comments\"); \n}\n\nfunction doSomething() { }\n\nfunction\
    \ handleError(error) { \n  console.error(error); \n}\n\nfetchUsers()\n  .then(fetchPosts)\n\
    \  .then(fetchComments)\n  .then(doSomething)\n  .catch(handleError);\n```\n\n\
    Promises support a chaining system that allows us to pass data through a set of\
    \ functions. Promises use callbacks.\n\nNote the execution flow in the previous\
    \ example:\n\n*   `fetchPosts` executes after `fetchUsers` gets the result. The\
    \ application is not blocked while waiting for its result.\n\n*   `fetchComments`\
    \ executes after `fetchPosts` gets the result.\n\nThe result of `fetchUsers` is\
    \ passed as input to `fetchPosts`. The result of `fetchUsers` is passed as input\
    \ to `fetchComments` and so on.\n\nThe data flow is : `fetchUsers` → `fetchPosts`\
    \ → `fetchComments` → `doSomething`\n\nIf there is an error at any step, the chain\
    \ control jumps to the closest rejection handler down the chain.\n\n`Promise.all()`\
    \ returns a new promise that resolves when all promises have resolved or rejects\
    \ when one of the promises rejects.\n\n`Promise.race()` returns a new promise\
    \ that resolves or rejects when one promise resolves or rejects.\n\n```\nconst\
    \ allPromises = [ fetchUsers(),\n                      fetchPosts(),\n       \
    \               fetchComments() ];\n\nPromise.all(allPromises)\n  .then(doSomething)\n\
    \  .catch(handleError);\n```\n\n### async/await\n\n`async/await` allows us to\
    \ write asynchronous code that looks like synchronous code. `async/await` is a\
    \ syntactical sugar for using promises.\n\nThe syntax requires to mark functions\
    \ with the `async` keyword.\n\n```\n//async with function declaration\nasync function\
    \ doAsynchronousTask() {}\n\n//async with arrow function\nconst doAsynchronousTask\
    \ = async ()=>{ };\n```\n\nLet’s see how to use other asynchronous tasks inside\
    \ a function. Check the next example:\n\n```\n(async function startApplication(){\n\
    \  const users = await fetchUsers();\n  const posts = await fetchPosts();\n  const\
    \ comments = await fetchComments();\n  console.log(users);\n  console.log(posts);\n\
    \  console.log(comments);\n})();\n```\n\nThe `await` operator is used to waiting\
    \ for a promise.\n\nThe code after `await fetchUsers()` executes when `fetchUsers`\
    \ gets the result. The code after `await fetchPosts()` executes when `fetchPosts`\
    \ gets the result. In a way, it can be imagined like:\n\n```\nfetchUsers().then((users)\
    \ => {\n  fetchPosts().then((posts) => {\n    fetchComments().then((comments)=>{\n\
    \      console.log(users);\n      console.log(posts);\n      console.log(comments);\n\
    \    });\n  });    \n});\n```\n\n`try/catch` is used to handle errors.\n\n```\n\
    function handleError(error) { \n    console.error(error); \n}\n\n(async function\
    \ startApplication() {\n  try {\n    const users = await fetchUsers();\n    const\
    \ posts = await fetchPosts();\n    const comments = await fetchComments();\n \
    \ } catch(error) {\n    handleError(error);\n  }\n})();\n```\n\nThe previous code\
    \ can be imagined as:\n\n```\nfetchUsers()\n .then((users) => {\n   fetchPosts().then((posts)\
    \ => {\n     fetchComments().then((comments)=>{\n     });\n   });    \n })\n .catch(handleError);\n\
    ```\n\nWhen we want to execute all network calls in parallel, we can use `await`\
    \ with `Promise.all()`:\n\n```\n(async function startApplication(){\n  const allPromises\
    \ = [ fetchUsers(),\n                        fetchPosts(),\n                 \
    \       fetchComments() ];\n  const [todos, users, albums] = \n    await Promise.all(allPromises);\n\
    \  console.log(todos);\n  console.log(users);\n  console.log(albums);\n})();\n\
    ```\n\nI don’t think that making asynchronous code look like synchronous code\
    \ is necessarily a good idea. It may lead to trouble understanding which code\
    \ is executed asynchronously and which is executed synchronously. I think that\
    \ promises are clearer at showing which part of the code deals with asynchronous\
    \ tasks.\n\n### The Event Loop\n\nThe JavaScript engine runs in a single thread.\
    \ At one moment, a single line of code is executed.\n\nJavaScript has a simpler\
    \ asynchronous programming model without threads, race conditions, locks or deadlocks.\n\
    \nThe engine uses an event loop. Callback functions are added to the event loop\
    \ when an event occurs and there is an event listener attached to it. The event\
    \ loop uses a queue, so callbacks are processed in the order they are added.\n\
    \nFunctions in the event loop must finish fast. If they don’t the application\
    \ becomes unresponsive and after some minutes the browser displays the “script\
    \ is taking too long to run” dialog.\n\nDOM events, timing events, network requests,\
    \ all add callbacks to the event loop.\n\nThe next code doesn’t finish fast and\
    \ blocks the application:\n\n```\nfor(let i=0; i<10000000000; i++){}\n```\n\n\
    ### Web Workers\n\nWeb workers offer a way to run long-running tasks. These tasks\
    \ run in parallel and don’t affect the main thread. When a long-running task finishes,\
    \ the result must be communicated back to the main thread.\n\nThere is no shared\
    \ memory between the main thread and web workers.\n\nIn the next example, the\
    \ main thread creates a web worker and sends it a message to start the long-running\
    \ process. Then it listens for the result and after terminates the worker.\n\n\
    ```\nconst worker = new Worker(\"worker.js\");\n\n//send message to worker\nworker.postMessage(\"\
    start\");\n\n//receive message from worker\nworker.onmessage = function(e) {\n\
    \  console.log(e.data);\n  worker.terminate();\n};\n```\n\nThe worker listens\
    \ for messages from the main thread. When it gets the `\"start\"` message, it\
    \ begins the long-running computation. After the computation finishes, the result\
    \ is sent to the main thread with `postMessage()`.\n\n```\nfunction computeValue()\
    \ {\n  for (let i = 0; i < 10000000000; i++) {}\n  return 10000000000;\n}\n\n\
    //receive message from main thread\nonmessage = function(e) {\n  const action\
    \ = e.data;\n  if (action === \"start\") {\n    const result = computeValue();\n\
    \n    //send message to main thread\n    postMessage(result);\n  }\n};\n```\n\n\
    ### Final thoughts\n\nCallbacks are the fundamental unit of asynchronous programming.\n\
    \nPromises are objects that represent future results. Promises offer a better\
    \ way for composing asynchronous tasks.\n\n`async/await` allows us to write asynchronous\
    \ code that looks like synchronous code.\n\nJavaScript offers a simpler asynchronous\
    \ programming model without threads, race conditions, locks or deadlocks.\n\n\
    Web workers can run long-running tasks.\n\n# Chapter 13: Objects with prototypes\n\
    \n> Objects are dynamic collections of properties with a “hidden” property to\
    \ the object’s prototype. The property has a key and a value.\n\n### Property\
    \ key\n\nThe property key is a unique string.\n\nThere are two ways to access\
    \ properties, the dot notation and the bracket notation. When the dot notation\
    \ is used, the property key must be a valid identifier.\n\n```\nconst obj = {\n\
    \  message : \"discover\"\n}\n\nobj.message; //\"discover\"\n```\n\nAccessing\
    \ a property that doesn’t exist will not throw an error, but will return `undefined`\
    \ .\n\n```\nobj.otherProperty; //undefined\n```\n\nWhen the bracket notation is\
    \ used, the property key does not have to be a valid identifier, it can have any\
    \ value.\n\n```\nconst french = {};\nfrench[\"Thank you\"] = \"Merci\";\n\nfrench[\"\
    Thank you\"]; //\"Merci\"\n```\n\nWhen a non-string value is used as the property\
    \ key is converted to a string, via the `toString()` method when available.\n\n\
    ```\nconst obj = {};\n\n//Number as key\nobj[1] = \"Number 1\";\nobj[1] === obj['1'];\
    \ //true\n\n//Object as key\nconst number1 = {\n  toString : function() {return\
    \ '1';}\n}\nobj[number1] === obj['1']; //true\n```\n\nIn the previous example,\
    \ the object `number1` is used as the property key. It is then converted to a\
    \ string and the result of the conversion, `'1'`, is used as the property key.\n\
    \n### Property value\n\nThe property value can be a primitive, an object, or a\
    \ function.\n\n### Object as value\n"
  raw: "Network calls can be done with the `fetch()` function. The `fetch()` function\
    \ returns a promise.\n\n#### Composing promises\n\nLet’s look at how to compose\
    \ promises:\n\n```\nfunction fetchUsers() { \n  return fetch(\"/users\"); \n}\n\
    \nfunction fetchPosts() { \n  return fetch(\"/posts\"); \n}\n\nfunction fetchComments()\
    \ { \n  return fetch(\"/comments\"); \n}\n\nfunction doSomething() { }\n\nfunction\
    \ handleError(error) { \n  console.error(error); \n}\n\nfetchUsers()\n  .then(fetchPosts)\n\
    \  .then(fetchComments)\n  .then(doSomething)\n  .catch(handleError);\n```\n\n\
    Promises support a chaining system that allows us to pass data through a set of\
    \ functions. Promises use callbacks.\n\nNote the execution flow in the previous\
    \ example:\n\n*   `fetchPosts` executes after `fetchUsers` gets the result. The\
    \ application is not blocked while waiting for its result.\n\n*   `fetchComments`\
    \ executes after `fetchPosts` gets the result.\n\nThe result of `fetchUsers` is\
    \ passed as input to `fetchPosts.` The result of `fetchUsers` is passed as input\
    \ to `fetchComments` and so on.\n\nThe data flow is : `fetchUsers` → `fetchPosts`\
    \ → `fetchComments` → `doSomething`\n\nIf there is an error at any step, the chain\
    \ control jumps to the closest rejection handler down the chain.\n\n`Promise.all()`\
    \ returns a new promise that resolves when all promises have resolved or rejects\
    \ when one of the promises rejects.\n\n`Promise.race()` returns a new promise\
    \ that resolves or rejects when one promise resolves or rejects.\n\n```\nconst\
    \ allPromises = [ fetchUsers(),\n                      fetchPosts(),\n       \
    \               fetchComments() ];\n\nPromise.all(allPromises)\n  .then(doSomething)\n\
    \  .catch(handleError);\n```\n\n### async/await\n\n`async/await` allows us to\
    \ write asynchronous code that looks like synchronous code. `async/await` is a\
    \ syntactical sugar for using promises.\n\nThe syntax requires to mark functions\
    \ with the `async` keyword.\n\n```\n//async with function declaration\nasync function\
    \ doAsynchronousTask() {}\n\n//async with arrow function\nconst doAsynchronousTask\
    \ = async ()=>{ };\n```\n\nLet’s see how to use other asynchronous tasks inside\
    \ a function. Check the next example:\n\n```\n(async function startApplication(){\n\
    \  const users = await fetchUsers();\n  const posts = await fetchPosts();\n  const\
    \ comments = await fetchComments();\n  console.log(users);\n  console.log(posts);\n\
    \  console.log(comments);\n})();\n```\n\nThe `await` operator is used to waiting\
    \ for a promise.\n\nThe code after `await fetchUsers()` executes when `fetchUsers`\
    \ gets the result. The code after `await fetchPosts()` executes when `fetchPosts`\
    \ gets the result. In a way, it can be imagined like:\n\n```\nfetchUsers().then((users)\
    \ => {\n  fetchPosts().then((posts) => {\n    fetchComments().then((comments)=>{\n\
    \      console.log(users);\n      console.log(posts);\n      console.log(comments);\n\
    \    });\n  });    \n});\n```\n\n`try/catch` is used to handle errors.\n\n```\n\
    function handleError(error) { \n    console.error(error); \n}\n\n(async function\
    \ startApplication() {\n  try {\n    const users = await fetchUsers();\n    const\
    \ posts = await fetchPosts();\n    const comments = await fetchComments();\n \
    \ } catch(error) {\n    handleError(error);\n  }\n})();\n```\n\nThe previous code\
    \ can be imagined as:\n\n```\nfetchUsers()\n .then((users) => {\n   fetchPosts().then((posts)\
    \ => {\n     fetchComments().then((comments)=>{\n     });\n   });    \n })\n .catch(handleError);\n\
    ```\n\nWhen we want to execute all network calls in parallel, we can use `await`\
    \ with `Promise.all()`:\n\n```\n(async function startApplication(){\n  const allPromises\
    \ = [ fetchUsers(),\n                        fetchPosts(),\n                 \
    \       fetchComments() ];\n  const [todos, users, albums] = \n    await Promise.all(allPromises);\n\
    \  console.log(todos);\n  console.log(users);\n  console.log(albums);\n})();\n\
    ```\n\nI don’t think that making asynchronous code look like synchronous code\
    \ is necessarily a good idea. It may lead to trouble understanding which code\
    \ is executed asynchronously and which is executed synchronously. I think that\
    \ promises are clearer at showing which part of the code deals with asynchronous\
    \ tasks.\n\n### The Event Loop\n\nThe JavaScript engine runs in a single thread.\
    \ At one moment, a single line of code is executed.\n\nJavaScript has a simpler\
    \ asynchronous programming model without threads, race conditions, locks or deadlocks.\n\
    \nThe engine uses an event loop. Callback functions are added to the event loop\
    \ when an event occurs and there is an event listener attached to it. The event\
    \ loop uses a queue, so callbacks are processed in the order they are added.\n\
    \nFunctions in the event loop must finish fast. If they don’t the application\
    \ becomes unresponsive and after some minutes the browser displays the “script\
    \ is taking too long to run” dialog.\n\nDOM events, timing events, network requests,\
    \ all add callbacks to the event loop.\n\nThe next code doesn’t finish fast and\
    \ blocks the application:\n\n```\nfor(let i=0; i<10000000000; i++){}\n```\n\n\
    ### Web Workers\n\nWeb workers offer a way to run long-running tasks. These tasks\
    \ run in parallel and don’t affect the main thread. When a long-running task finishes,\
    \ the result must be communicated back to the main thread.\n\nThere is no shared\
    \ memory between the main thread and web workers.\n\nIn the next example, the\
    \ main thread creates a web worker and sends it a message to start the long-running\
    \ process. Then it listens for the result and after terminates the worker.\n\n\
    ```\nconst worker = new Worker(\"worker.js\");\n\n//send message to worker\nworker.postMessage(\"\
    start\");\n\n//receive message from worker\nworker.onmessage = function(e) {\n\
    \  console.log(e.data);\n  worker.terminate();\n};\n```\n\nThe worker listens\
    \ for messages from the main thread. When it gets the `\"start\"` message, it\
    \ begins the long-running computation. After the computation finishes, the result\
    \ is sent to the main thread with `postMessage()`.\n\n```\nfunction computeValue()\
    \ {\n  for (let i = 0; i < 10000000000; i++) {}\n  return 10000000000;\n}\n\n\
    //receive message from main thread\nonmessage = function(e) {\n  const action\
    \ = e.data;\n  if (action === \"start\") {\n    const result = computeValue();\n\
    \n    //send message to main thread\n    postMessage(result);\n  }\n};\n```\n\n\
    ### Final thoughts\n\nCallbacks are the fundamental unit of asynchronous programming.\n\
    \nPromises are objects that represent future results. Promises offer a better\
    \ way for composing asynchronous tasks.\n\n`async/await` allows us to write asynchronous\
    \ code that looks like synchronous code.\n\nJavaScript offers a simpler asynchronous\
    \ programming model without threads, race conditions, locks or deadlocks.\n\n\
    Web workers can run long-running tasks.\n\n# Chapter 13: Objects with prototypes\n\
    \n> Objects are dynamic collections of properties with a “hidden” property to\
    \ the object’s prototype. The property has a key and a value.\n\n### Property\
    \ key\n\nThe property key is a unique string.\n\nThere are two ways to access\
    \ properties, the dot notation and the bracket notation. When the dot notation\
    \ is used, the property key must be a valid identifier.\n\n```\nconst obj = {\n\
    \  message : \"discover\"\n}\n\nobj.message; //\"discover\"\n```\n\nAccessing\
    \ a property that doesn’t exist will not throw an error, but will return `undefined`\
    \ .\n\n```\nobj.otherProperty; //undefined\n```\n\nWhen the bracket notation is\
    \ used, the property key does not have to be a valid identifier, it can have any\
    \ value.\n\n```\nconst french = {};\nfrench[\"Thank you\"] = \"Merci\";\n\nfrench[\"\
    Thank you\"]; //\"Merci\"\n```\n\nWhen a non-string value is used as the property\
    \ key is converted to a string, via the `toString()` method when available.\n\n\
    ```\nconst obj = {};\n\n//Number as key\nobj[1] = \"Number 1\";\nobj[1] === obj['1'];\
    \ //true\n\n//Object as key\nconst number1 = {\n  toString : function() {return\
    \ '1';}\n}\nobj[number1] === obj['1']; //true\n```\n\nIn the previous example,\
    \ the object `number1` is used as the property key. It is then converted to a\
    \ string and the result of the conversion, `'1'`, is used as the property key.\n\
    \n### Property value\n\nThe property value can be a primitive, an object, or a\
    \ function.\n\n#### Object as value"
