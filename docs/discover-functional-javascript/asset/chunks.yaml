    \n# Preface\n\nJavaScript has become one of the most important programming languages.\
    \ It is important from many points of view:\n\n*   It is easy to learn. The beauty\
    \ of the language stays in its simplicity.\n*   It is the first language to bring\
    \ functional programming to the mainstream.\n*   It offers a new way of doing\
    \ object-oriented programming without classes and prototypes.\n\nJavaScript is\
    \ popular as being the language of the browser. At the same time, it is a powerful\
    \ and expressive programming language.\n\nThis is a book for developers eager\
    \ to make a foundation of functional programming in JavaScript and who want to\
    \ learn a new approach of building encapsulated objects.\n\n#### Online code examples\n\
    \nMany code examples from this book, but not all, are available at [https://github.com/cristi-salcescu/discover-functional-javascript](https://github.com/cristi-salcescu/discover-functional-javascript).\
    \ I encourage you to write the code yourself. Writing is another form of learning,\
    \ and in most cases, the code you understand best is the code you wrote.\n\n####\
    \ Feedback\n\nI will be glad to hear your feedback. For comments, questions, or\
    \ suggestions regarding this book send me an email to [cristisalcescu@gmail.com](mailto:cristisalcescu@gmail.com).\
    \ Thanks in advance for considering to write a review of the book.\n\n# Chapter\
    \ 1: A brief overview of JavaScript\n\nJavaScript has primitives, objects, and\
    \ functions. All of them are values. All are treated as objects, even primitives.\n\
    \n### Primitives\n\nNumber, boolean, string, `undefined`, and `null` are primitives.\n\
    \n#### Number\n\nAt the moment there is only one number type in JavaScript, the\
    \ 64-bit binary floating-point. Decimal numbers’ arithmetic is inexact. As you\
    \ may already know, `0.1 + 0.2` does not make `0.3`. But with integers, the arithmetic\
    \ is exact, so `1 + 2 === 3`.\n\nNumbers inherit methods from the `Number.prototype`\
    \ object. Methods can be called on numbers:\n\n```\n(123).toString();  //\"123\"\
    \n(1.23).toFixed(1); //\"1.2\"\n```\n\nThere are functions for converting strings\
    \ to numbers:\n\n`Number.parseInt()`, `Number.parseFloat()` and `Number()`.\n\n\
    ```\nNumber.parseInt(\"1\");       //1\nNumber.parseInt(\"text\");    //NaN\n\
    Number.parseFloat(\"1.234\"); //1.234\nNumber(\"1\");                //1\nNumber(\"\
    1.234\");            //1.234\n```\n\nInvalid arithmetic operations or invalid\
    \ conversions do not throw an exception but result in the `NaN` “Not-a-Number”\
    \ value. `isNaN()` can detect `NaN`.\n\n#### String\n\nA string stores a series\
    \ of Unicode characters. Text can be inside double quotes `\"\"` or single quotes\
    \ `''`.\n\nStrings inherit methods from `String.prototype`. They have methods\
    \ like `substring()`, `indexOf()` or `concat()`.\n\n```\n\"text\".substring(1,3);\
    \ //\"ex\"\n\"text\".indexOf('x');   //2\n\"text\".concat(\" end\"); //\"text\
    \ end\"\n```\n\nStrings, like all primitives, are immutable. For example `concat()`\
    \ doesn’t modify the existing string but creates a new one.\n\nThe `+` operator\
    \ can add or concatenate:\n\n```\n1 + 1      //2\n\"1\" + \"1\"  //\"11\"\n1 +\
    \ \"1\"    //\"11\"\n```\n\n#### Boolean\n\nA boolean has two values: `true` and\
    \ `false`.\n\nThe language has truthy and falsy values. `false`, `null`, `undefined`,\
    \ `''`(empty string), `0` and `NaN` are falsy. All other values are truthy.\n\n\
    Truthy values are evaluated to `true` when executed in a boolean context. Falsy\
    \ values are evaluated to `false`. The next example displays the `false` branch.\n\
    \n```\nif('') {\n  console.log(\"true\");\n} else {\n  console.log(\"false\");\n\
    }\n```\n\nThe equality operator is `===`. The not equal operator is `!==`.\n\n\
    ### Variables\n\nVariables can be defined using `var`, `let` and `const`.\n\n\
    `var` declares and optionally initializes a variable. Variables declared with\
    \ `var` have function scope. They are treated as declared at the top of the function.\
    \ This is called variable hoisting.\n\nThe `let` and `const` declarations have\
    \ block scope. A variable declared with `const` cannot be reassigned.\n\nThe value\
    \ of a variable that is not initialized is `undefined`.\n\n### Objects\n\nAn object\
    \ is a dynamic collection of properties.\n\nA property has a key and a value.\
    \ The property key is a unique string. The property value can be a primitive,\
    \ an object, or a function.\n\nThe simplest way to create an object is to use\
    \ an object literal:\n\n```\nlet obj = {\n  message: \"read me\",\n  doSomething:\
    \ function() {}\n};\n```\n\nThere are two ways for accessing properties: the dot\
    \ notation and the bracket notation. Object’s properties can be read, added, edited\
    \ or removed.\n\n```\nlet obj = {};\nobj.message = \"read me\"; //add\nobj.message\
    \ = \"enjoy\"; //edit\ndelete obj.message; //remove\n```\n\nAll object’s properties\
    \ are public.\n\n#### Primitives vs objects\n\nPrimitives, except `null` and `undefined`,\
    \ are treated like objects in the sense they have methods, but they are not objects.\n\
    \nNumbers, strings, and booleans have equivalent wrapper objects. These are built\
    \ with the `Number`, `String` and `Boolean` functions.\n\nIn order to allow access\
    \ to properties on primitives, JavaScript creates a wrapper object and then destroys\
    \ it. The process of creating and destroying wrapper objects is optimized by the\
    \ JavaScript engine.\n\n### Array\n\nArrays are indexed collections of values.\
    \ Each value is an element. Elements are ordered and accessed by their index number.\n"
