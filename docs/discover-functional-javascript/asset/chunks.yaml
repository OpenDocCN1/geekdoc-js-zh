    const books = [\n  {title:\"How JavaScript works\",type:\"T\"},\n  {title:\"Square\
    \ and tower\",type:\"H\"},\n  {title:\"Functional-Light JavaScript\",type:\"T\"\
    }\n];\n\nconst titles = books.map(book => book.title);\n//[\"How JavaScript works\"\
    , \"Square and tower\", \n// \"Functional-Light JavaScript\"]\n```\n\nAnother\
    \ option is to use a generic utility function like `prop()`:\n\n```\nimport prop\
    \ from \"lodash/property\";\n\nconst titles = books.map(prop(\"title\"));\n```\n\
    \n### Arrow function vs `function`\n\nLess code doesn’t necessarily mean more\
    \ readable. The next example shows two ways of defining the `prop()` function.\
    \ I prefer the one using the `function` keyword because I think it is clearer\
    \ what the function does.\n\n`prop()` takes the name of a property and returns\
    \ a function that asks for an object an returns the property of that object.\n\
    \n```\n//with arrow function\nconst prop = key => obj => obj[key];\n\n//with function\
    \ keyword\nfunction prop(key){\n   return function(obj){\n      return obj[key];\n\
    \   }\n}\n```\n\n### Final thoughts\n\nIntention revealing function names improve\
    \ readability and offer a better debugging experience.\n\nI suggest refactoring\
    \ to a named function whenever the name adds value to the existing code.\n\n#\
    \ Chapter 11: Making code easier to read\n\n> I believe very deeply that the vastly\
    \ more important role of code is as a means of communication with other human\
    \ beings.\n\n> It’s widely estimated that developers spend 70% of code maintenance\
    \ time on reading to understand it.— Kyle Simpson, author of [Functional-Light\
    \ JavaScript](https://www.amazon.com/Functional-Light-JavaScript-Pragmatic-Balanced-FP-ebook/dp/)\n\
    \nDevelopers have an easier time understanding small pieces of code with intention\
    \ revealing names. Understanding is easier if functions are pure.\n\nLet’s look\
    \ at how we can improve code readability with functional programming techniques.\n\
    \n### Refactoring with filter and map\n\nI will take the case of a collection\
    \ of to-dos:\n\n```\nconst todos = [\n  { \n    id : 1,\n    type : \"NC\",\n\
    \    desc : \"task1\",\n    user : { id: 1, name: \"user1\"},\n    completed :\
    \ false\n  },\n  { \n    id : 2,\n    type : \"RE\",\n    desc : \"task2\",\n\
    \    user : { id: 2, name: \"user2\"},\n    completed : false\n  }\n];\n```\n\n\
    Below is the imperative code filtering the to-dos and creating new objects having\
    \ the `userName` property.\n\n```\nlet filteredTodos = [];\nfor(let i=0; i<todos.length;\
    \ i++){\n  let todo = todos[i];\n  if (todo.type === \"RE\" && !todo.completed)\
    \ {\n    filteredTodos.push({...todo,userName: todo.user.name});\n  }\n}\n\nconsole.log(filteredTodos);\n\
    //[{ \n// completed: false,\n// desc: \"task2\",\n// id: 2,\n// type: \"RE\",\n\
    // user: {id: 2, name: \"user2\"},\n// userName: \"user2\" \n//}]\n```\n\nRefactoring\
    \ to a functional style makes use of the `filter()` and `map()` functions.\n\n\
    ```\nconst filteredTodos = todos\n .filter(todo => (todo.type === \"RE\" && !todo.completed))\n\
    \ .map(todo => ({ ...todo, userName: todo.user.name }));\n```"
