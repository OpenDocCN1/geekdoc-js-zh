  trans: "\n\n`reduce(reducer, initialValue)` 接受第二个参数作为累加器的初始值。如果未提供该值，则将数组的第一个元素设为初始值，并从第二个元素开始循环。\n\
    \n```\nconst numbers = [1, 2, 3];\nconst total = numbers.reduce(addNumber);\n\
    //element=2, total=1 → result=3\n//element=3, total=3 → result=6\n//6\n```\n\n\
    还有一个 `reduceRight()` 方法，它从列表的最后一个元素开始处理。\n\n```\nfunction multiply(product, value){\n\
    \  return product * value;\n}\n\nconst numbers = [2, 3, 4];\nconst product = numbers.reduceRight(multiply,\
    \ 1);\n//element=4, product=1  → result=4\n//element=3, product=4  → result=12\n\
    //element=2, product=12 → result=24\n//24\n```\n\n正如你所注意到的，当我们将数字相乘时，累加器的初始值为\
    \ 1。\n\n### `sort()`\n\n> `sort()` 使用比较函数对数组元素进行排序。它是一个不纯的方法，会修改输入数组。\n\n> 比较函数接受两个参数，例如\
    \ `a` 和 `b`，并返回负数、正数或零。当结果为负数时，`a` 排在 `b` 之前；当结果为正数时，`a` 排在 `b` 之后；当结果为零时，`a`\
    \ 和 `b` 的相对顺序不变。\n\n```\nfunction asc(a, b){\n  return a - b;\n}\n\nfunction desc(a,\
    \ b){\n  return b - a;\n}\n\nconst numbers = [1,3,2,6,4,5];\n\nnumbers.sort(asc);\n\
    //[1, 2, 3, 4, 5, 6]\n\nnumbers.sort(desc);\n//[6, 5, 4, 3, 2, 1]\n```\n\n`asc()`\
    \ 和 `desc()` 是比较函数。对于相同的输入，比较函数应始终返回相同的输出。\n\n### 扩展工具箱\n\n> `find()` 返回第一个满足谓词函数的值。找到第一个值后即停止处理。\n\
    \n> `findIndex()` 返回第一个满足谓词函数的值的索引。\n\n> `some()` 检查列表中是否至少有一个值通过了谓词函数实现的测试。当谓词返回\
    \ `true` 时停止处理。\n\n> `every()` 检查列表中的所有值是否都通过了谓词函数实现的测试。当谓词返回 `false` 时停止处理。\n\
    \n让我们使用它们：\n\n```\nconst numbers = [1,2,3,4,5,6];\n\nconst firstEven = numbers.find(isEven);\n\
    //2\n\nconst firstEvenIndex = numbers.findIndex(isEven);\n//1\n\nconst areAllEven\
    \ = numbers.every(isEven);\n//false\n\nconst hasOneEven = numbers.some(isEven);\n\
    //true\n```\n\n> `forEach()` 按顺序为数组中的每个元素调用回调函数。\n\n```\nfunction log(value){\n\
    \  console.log(value);\n}\n\nconst numbers = [1,2,3];\nnumbers.forEach(log);\n\
    //1\n//2\n//3\n```\n\n所有这些数组方法都是内置的高阶函数。\n\n### 最终思考\n\n拥有头等函数意味着能够将函数作为值来使用。这使得传递行为以及像处理其他值一样处理函数变得容易。\n\
    \n`filter()`、`map()`、`reduce()` 构成了以函数式风格处理集合的基本工具箱。\n\n# 第 4 章：闭包\n\n> 闭包是一个内部函数，它可以访问外部作用域，即使外部作用域容器已经执行完毕。\n\
    \n作用域定义了变量的生命周期和可见性。外部作用域容器可以是一个函数、一个块或一个模块。\n\n### 嵌套函数\n\n函数可以嵌套在其他函数内部。考虑以下代码：\n\
    \n```\n(function autorun(){\n    let x = 1;\n    function log(){ \n       console.log(x);\
    \ \n    }\n    log();\n})();\n```\n\n`log()` 是一个嵌套函数。`log()` 从其外部作用域访问变量 `x`。`log()`\
    \ 函数是一个闭包。外部作用域容器是外部函数。\n\n内部函数访问外部函数中的变量，这就是闭包。\n\n### 词法作用域\n\n词法作用域是指内部函数能够访问其定义所在的外部作用域的能力。考虑以下代码：\n\
    \n```\n(function autorun(){\n    let x = 1;\n    function log(){\n      console.log(x);\n\
    \    };\n\n    function run(fn){\n      let x = 100;\n      fn();\n    }\n\n \
    \   run(log); //1\n})();\n```\n\n`log()` 函数是一个闭包。它引用其父函数 `autorun()` 中的变量 `x`。`log()`\
    \ 不使用 `run()` 函数中的变量 `x`。\n\n闭包函数可以访问其创建时所在的作用域，而不是其执行时所在的作用域。\n\n`autorun()`\
    \ 的局部函数作用域就是 `log()` 函数的词法作用域。\n\n### 父级执行后的存活\n\n当内部函数在父作用域容器执行完毕后仍然存活时，闭包就变得重要了。这发生在以下情况中：\n\
    \n*   内部函数被用作异步任务的回调，例如定时器、事件或网络调用\n*   父函数或模块返回内部函数，或返回存储了内部函数的对象\n\n考虑以下示例：\n\
    \n#### 定时器\n\n```\n(function autorun(){\n  let x = 1;\n  setTimeout(function log(){\n\
    \    console.log(x);\n  }, 10000);\n})();\n```\n\n变量 `x` 会一直存在，直到 `log()` 函数被调用。\n\
    \n如果使用了 `setInterval()`，那么变量 `x` 将永远存在，或者直到调用了 `clearInterval()`。\n\n#### 事件\n\
    \n```\n(function autorun(){\n  let x = 1;\n  $(\"#btn\").click(function log(){\n\
    \    console.log(x);\n  });\n})();\n```\n\n当变量 `x` 在事件处理程序中使用时，它会一直存在，直到处理程序被移除。\n\
    \n#### 网络调用\n\n```\n(function autorun(){\n  let x = 1;\n  fetch(\"/todos\").then(function\
    \ log(){\n    console.log(x);\n  });\n})();\n```\n\n变量 `x` 会一直存在，直到从 Web API 返回响应并执行回调。\n\
    \n在所有这些情况下，`log()` 都是一个闭包，并且在父函数调用结束后仍然存活。\n\n变量的生命周期取决于闭包的生命周期。变量会一直存在，直到引用它的所有闭包都被垃圾回收。如果一个变量被多个闭包共享，那么在所有闭包都被垃圾回收之前，该变量不会被回收。\n\
    \n### 循环中的闭包\n\n闭包存储的是对外部变量的引用，而不是实际值的副本。查看以下示例：\n\n```\nfunction initEvents(){\n\
    \  for(var i=1; i<=3; i++){\n    $(\"#btn\"+i).click(function log(){\n      console.log(i);\
    \ //4\n    });\n  }\n}\n\ninitEvents();\n```\n\n在这个示例中，创建了三个闭包，它们都共享同一个变量 `i`。这三个闭包都是事件处理程序。由于\
    \ `i` 在循环过程中会变化，所有日志都会显示相同的值，即最后一个值。\n\n解决这个问题的最简单方法是在 `for` 语句内部使用 `let` 声明。这将为每次迭代创建一个块级作用域的局部变量。\n\
    \n```\nfunction initEvents(){\n  for(let i=1; i<=3; i++){\n    $(\"#btn\"+i).click(function\
    \ log(){\n      console.log(i); //1 2 3\n    });\n  }\n}\n\ninitEvents();\n```\n\
    \n当变量声明在 `for` 语句外部时，即使使用 `let`，所有闭包也会使用同一个变量。所有日志都会显示相同的值，即最后一个值。\n\n```\nfunction\
    \ initEvents(){\n  let i;  \n  for(i=1; i<=3; i++){\n    $(\"#btn\"+i).click(function\
    \ log(){\n      console.log(i); //4\n    });\n  }\n}\n```\n\n### 生成器\n\n> 生成器是一个函数，每次调用它时，它会从序列中返回下一个值。\n\
    \n我认为 ES6 生成器是一个不必要的特性，它使代码变得更加复杂。\n\nES6 生成器创建了一个具有 `next()` 方法的对象。`next()` 方法创建了一个具有\
    \ `value` 属性的对象。ES6 生成器促进了循环的使用，而在函数式编程中，我们希望摆脱循环。\n\n考虑下面的 ES6 生成器：\n\n```\n\
    function* sequence(){\n  let count = 0;\n  while(true) {\n    count += 1;\n  \
    \  yield count;\n  }\n}\n\nconst generator = sequence();\ngenerator.next().value;\
    \ //1\ngenerator.next().value; //2\ngenerator.next().value; //3\n```\n\n同样的生成器可以简单地用闭包实现：\n\
    \n```\nfunction sequence(){\n  let count = 0;\n  return function(){\n    count\
    \ += 1;\n    return count;\n  }\n}\n\nconst generator = sequence();\ngenerator();\
    \ //1\ngenerator(); //2\ngenerator(); //3\n```\n\n"
- fmt: "\nThe `generator()` function is a closure. It has access to the `count` variable\
    \ from its parent `sequence()`. It can access the `count` variable even after\
    \ `sequence()` is executed.\n\nThe `generator()` closure is created using a function\
    \ that returns a function. This way the closure function survives the invocation\
    \ of its parent. `sequence()` is a higher-order function.\n\n### Function with\
    \ private state\n\nWith closures, we can create functions with private state.\
    \ Closures encapsulate state.\n\nThe `generator()` closure is a function with\
    \ private state. Each time it is called, it remembers its previous `count` state\
    \ and returns the next consecutive number. The `count` variable is private, there\
    \ is no access to it from the outside.\n\n### Functions with private state\n\n\
    We can take this idea further and create more closures sharing the same private\
    \ state. In the next example, `increment()` and `decrement()` are two closures\
    \ sharing the same private `state` variable.\n\n```\nconst counter = (function(){\n\
    \    let state = 0;\n\n    function increment(){\n       state += 1;\n       return\
    \ state;\n    }\n\n    function decrement(){\n       state -= 1;\n       return\
    \ state;\n    }\n\n    return {\n       increment,\n       decrement\n    }\n\
    })();\n\ncounter.increment(); //1\ncounter.increment(); //2\ncounter.decrement();\
    \ //1\n```\n\nThis practice is known as the Revealing Module pattern.\n\nThe same\
    \ behavior can be achieved using ES6 modules.\n\n```\n//module \"./counter.js\"\
    \nlet state = 0;\n\nfunction increment() {\n  state += 1;\n  return state;\n}\n\
    \nfunction decrement() {\n  state -= 1;\n  return state;\n}\n\nexport default\
    \ {\n  increment,\n  decrement\n}\n\n//module \"./index.js\"\nimport counter from\
    \ \"./counter\";\n\ncounter.increment(); //1\ncounter.increment(); //2\ncounter.decrement();\
    \ //1\n```\n\n### Scope objects\n\nWhen a function is executed a new private scope\
    \ object is created. The scope object contains all the arguments and local variables.\
    \ It also contains a reference to the scope object of the outer scope where it\
    \ was created.\n\nScope objects are allocated like any other object. Scope objects\
    \ are not automatically cleaned up after the function execution. They are garbage\
    \ collected like ordinary objects when there are no more references to them.\n\
    \nScope objects make a scope chain. It is similar in concept to the prototype\
    \ chain. When a variable is used, the program looks down the scope chain until\
    \ it finds that variable.\n\nA closure is a function having a private reference\
    \ to the scope object of the outer function where it is created.\n\n### Garbage\
    \ collection\n\nThe private state of a closure becomes eligible for garbage collection\
    \ after the closure itself is garbage collected. To make this possible, the closure\
    \ should no longer have a reference to it.\n\nIn the next example, first, the\
    \ `add()` closure function is created:\n\n```\nlet add = (function createAddClosure(){\n\
    \    let arr = [];\n    return function(obj){\n       arr.push(obj);\n    }\n\
    })();\n```\n\nThen, two functions working with the closure function are defined:\n\
    \n*   `addALotOfObjects()` adds a lot of objects to the closure’s private state.\n\
    \n*   `clearAllObjects()` sets the closure reference to `null`.\n\nBoth functions\
    \ are used as event handlers:\n\n```\nfunction Todo(){}\n\nfunction addALotOfObjects(){\n\
    \    for(let i=1; i<=10000;i++) {\n       add(new Todo(i));\n    }\n}\n\nfunction\
    \ clearAllObjects(){\n    if(add){\n       add = null;\n    }\n}\n\n$(\"#add\"\
    ).click(addALotOfObjects);\n$(\"#clear\").click(clearAllObjects);\n```\n\nClicking\
    \ “Add” will add 10,000 to-dos to the closure’s private state.\n\n![](Images/image00078.jpeg\
    \ \"Memory snapshot after adding 10000 to-dos\")\n\nClicking “Clear” will set\
    \ the closure reference to `null`. After doing that, the private state is garbage\
    \ collected.\n\n![](Images/image00079.gif \"Memory snapshot after setting the\
    \ closure reference to null\")\n\n### Final thoughts\n\nClosures are inner functions\
    \ having access to variables from the outer scopes.\n\nVariables used in closures\
    \ live as long as closures live.\n\nClosures create encapsulation.\n\nFirst-class\
    \ functions and closures open the way for functional programming in JavaScript.\n\
    \n# Chapter 5: Function decorators\n\n> A function decorator is a higher-order\
    \ function that takes one function as an argument and returns another function,\
    \ and the returned function is a variation of the argument function.— Reginald\
    \ Braithwaite, author of [JavaScript Allongé](https://www.amazon.com/Javascript-Allong%C3%A9-Reginald-Braithwaite-ebook/dp/B00FLKRCVO)\n\
    \nIn order to see the concept in practice, we will write some common function\
    \ decorators found in libraries like [lodash.js](https://lodash.com/docs/4.17.5),\
    \ [underscore.js](http://underscorejs.org/#functions), or [ramda.js](http://ramdajs.com/docs/).\n\
    \n### once()\n\n`once(fn)` creates a function that executes the original function\
    \ only one time. It is useful when we want to execute the function once, no matter\
    \ how many times is called from different places.\n\n```\nfunction once(fn){\n\
    \  let returnValue;\n  let canRun = true;\n  return function(...args){\n     if(canRun)\
    \ {\n         returnValue = fn(...args);\n         canRun = false;\n     }\n \
    \    return returnValue;\n  }\n}\n\nfunction process(){ \n  console.log(\"process\"\
    ); \n}\n\nconst processOnce = once(process);\nprocessOnce(); //process\nprocessOnce();\
    \ //\nprocessOnce(); //\n```\n\n`once()` is a function that returns another function.\
    \ The returned function is a closure. Note how the original function is called\
    \ with all the arguments: `fn(...args)`.\n\n### after()\n\n`after(fn, count)`\
    \ creates a version of the function that executes only after a number of calls.\
    \ For example, it can be used to run the function after all asynchronous operations\
    \ have finished.\n\n```\nfunction after(fn, startCount){\n  let count = 0;\n \
    \ return function(...args){\n     count = count + 1;\n     if (count >= startCount)\
    \ {\n         return fn(...args);        \n     }\n  }\n}\n\nfunction logResult()\
    \ { \n  console.log(\"finish\"); \n}\n\nconst logResultAfter2 = after(logResult,\
    \ 2);\nsetTimeout(function firstCall(){ \n  console.log(\"1st\"); \n  logResultAfter2();\
    \ \n}, 3000);\n\nsetTimeout(function secondCall(){ \n  console.log(\"2nd\"); \n\
    \  logResultAfter2(); \n}, 4000);\n\n//\"1st\"\n//\"2nd\"\n//\"finish\"\n```\n\
    \nIn this example, I am using `after()` to build a new function `logResultAfter2()`\
    \ that executes the original code of `logResult()` starting with the second call.\n\
    \n### throttle()\n\n`throttle(fn, wait)` creates a version of the function that,\
    \ when invoked repeatedly, will call the original function once per every `wait`\
    \ milliseconds. It is useful for limiting events that occur faster.\n\n```\nfunction\
    \ throttle(fn, interval) {\n  let lastTime;\n  return function throttled(...args)\
    \ {\n    if(!lastTime || (Date.now() - lastTime >= interval)) {\n      fn(...args);\n\
    \      lastTime = Date.now();\n    }\n  }\n}\n\nlet throttledProcess = throttle(process,\
    \ 1000);\n$(window).mousemove(throttledProcess);\n```\n\nIn this example, moving\
    \ the mouse will generate a lot of `mousemove` events, but the original function\
    \ will be called once per second.\n\n### debounce()\n\n`debounce(fn, wait)` creates\
    \ a version of the function that, when invoked repeatedly, will call the original\
    \ function after `wait` milliseconds since the last invocation. It is useful for\
    \ running a function only after the event has stopped arriving.\n\n```\nfunction\
    \ debounce(fn, interval) {\n  let timer;\n  return function debounced(...args)\
    \ {\n    clearTimeout(timer);\n    timer = setTimeout(function(){\n      fn(...args);\n\
    \    }, interval);\n  }\n}\n\nlet debouncedProcess = debounce(process, 400);\n\
    $(window).resize(debouncedProcess);\n```\n\nSome common events to take in consideration\
    \ for `debounce` are `scroll`, `resize`, `mousemove` or `keypress`.\n\n### memoize()\n\
    \nMemoization is a technique for improving execution speed by saving the previous\
    \ results and use them to avoid computation. Memoization is different than caching,\
    \ in the sense that it works only with deterministic functions.\n\n`memoize(fn)`\
    \ creates a memoized version of a function. It is useful for speeding up slow\
    \ computations.\n"
