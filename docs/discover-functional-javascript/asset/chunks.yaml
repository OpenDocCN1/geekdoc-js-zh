  trans: "\n`curry()` 提供了一种比真正柯里化函数更灵活的调用系统。它可以一次性传入多个参数，而不仅仅是一个。当所有参数都传入时，函数会被执行。\n\
    \n```\nimport { curry } from 'lodash';\n\nconst f = curry(function(x, y, z){\n\
    \  console.log(x);\n  console.log(y);\n  console.log(z);\n});\n\nf(1, 2, 3);\n\
    f(1, 2)(3);\nf(1)(2)(3);\n//1\n//2\n//3\n```\n\n以下是 `curry()` 函数的一种实现：\n\n```\n\
    function curry(f, leftArgs = []){\n  return function(...args){\n    const allArgs\
    \ = [...leftArgs, ...args];\n    if (allArgs.length >= f.length) {\n      return\
    \ f(...allArgs);\n    } else{\n      return curry(f, allArgs);\n    }\n  }\n}\n\
    ```\n\n这种 `curry()` 函数的实现对于含有剩余参数或默认值的函数无法正确工作。\n\n函数的 `length` 属性获取的是函数期望的参数个数。然而，剩余参数不计入函数的\
    \ `length` 属性，默认值也不计入。\n\n```\nfunction f1 (a, b) { }\nfunction f2 (a, ...b) {\
    \ }\nfunction f3 (a, b=0) { }\n\nf1.length; //2\nf2.length; //1\nf3.length; //1\n\
    ```\n\n一种解决方案是增加一个参数，用于指定参数个数。\n\n```\nfunction curry(f, length, leftArgs = []){\n\
    \  let noArguments = f.length;\n  if(length) {\n    noArguments = length;\n  }\n\
    \n  return function(...args){\n    const allArgs = [...leftArgs, ...args];\n \
    \   if (allArgs.length >= noArguments){\n      return f(...allArgs);\n    } else{\n\
    \      return curry(f, length, allArgs);\n    }\n  }\n}\n\nfunction f(a, b=0)\
    \ {\n  console.log(a);\n  console.log(b);\n}\n\nconst fn = curry(f, 2);\nfn(1)(2);\n\
    //1\n//2\n```\n\n`curry()` 函数可以在 [lodash.js](https://lodash.com/docs/4.17.11#curry)\
    \ 或 [ramda.js](https://ramdajs.com/docs/#curryN) 中找到。\n\n### 元数\n\n函数的元数表示它接受的参数个数。\n\
    \n* 一元函数是接受一个参数的函数。\n* 二元函数接受两个参数。\n* 三元函数接受三个参数。\n* n 元函数接受 n 个参数。\n* 零元函数不接受参数。\n\
    \n偏应用和柯里化会降低函数的元数。\n\n柯里化将一个 n 元函数转换为 n 个一元函数。\n\n### 完全应用\n\n向函数传入少于总参数个数的参数称为偏应用。\n\
    \n向函数传入所有参数称为完全应用。\n\n考虑以下对 `f(x, y, z)` 函数的完全应用：\n\n```\nfunction f(x, y, z){\n\
    \  console.log(x);\n  console.log(y);\n  console.log(z);\n}\n\nf(1,2,3);\nf.apply(null,\
    \ [1,2,3]);\nf.call(null, 1,2,3);\n```\n\n向柯里化函数传入所有参数即为完全应用，并会执行该函数。\n\n```\n\
    const fn = curry(f);\nfn(1)(2)(3);\n```\n\n偏应用工具函数是一个例外。使用 `partial()` 向函数传入所有参数会创建一个所有参数都已固定的零元函数。原始函数不会在参数传入时立即执行。这个新函数可以用作回调。\n\
    \n```\nconst fn = partial(f,1,2,3);\nsetTimeout(fn, 1000);\n//1\n//2\n//3\n```\n\
    \n### Thunk\n\nThunk 是一种延迟调用另一个函数的函数。thunk 函数会使用所有参数调用原始函数。\n\n```\nfunction sum(x,\
    \ y, z){\n  const total = x + y + z;\n  console.log(total);\n  return total;\n\
    }\n\nfunction sumThunk() {\n  return sum(1, 2, 3);\n}\n\nsumThunk();\n//6\n```\n\
    \n我们可以使用函数装饰器来创建 thunk。\n\n`thunk(fn, args)` 接受一个函数和所有参数，并创建一个新函数，该函数使用所有参数执行原始函数。\n\
    \n```\nfunction thunk(fn, ...args){\n  return function(){\n    return fn(...args);\n\
    \  }\n}\n\nconst sumFirst3 = thunk(sum, 1, 2, 3);\nsetTimeout(sumFirst3, 3000);\n\
    //6 after 3s\n```\n\n`thunkify(fn)` 接受一个函数 `fn`，并返回一个新函数，该函数要求传入参数，并返回第三个函数，当第三个函数被调用时，它会使用所有参数调用\
    \ `fn`。\n\n```\nfunction thunkify(fn) {\n  return function(...args) {\n    return\
    \ function() {\n      return fn(...args);\n    }\n  }\n}\n\nconst sumFirst3 =\
    \ thunkify(sum)(1, 2, 3);\nsetTimeout(sumFirst3, 3000);\n//6 after 3s\n```\n\n\
    我认为最好只对少于总参数个数的参数使用 `partial()`，而使用 `thunk()` 来创建一个零元函数，该函数使用所有参数调用原始函数。\n\n```\n\
    function f(x, y, z){\n  console.log(x);\n  console.log(y);\n  console.log(z);\n\
    }\n\nconst fThunk = thunk(f, 1, 2, 3);\n$(\"#btn\").click(fThunk);\n```\n\n###\
    \ 最终思考\n\n偏应用将一个多参数函数转换为一个参数更少的函数。\n\n柯里化将一个多参数函数转换为一系列每个只接受一个参数的函数。\n\n# 第 9\
    \ 章：函数组合\n\n> 函数组合是一种将一个函数的输出作为另一个函数输入的技术。\n\n假设我们有两个函数 `f()` 和 `g()`，每个接受一个参数。\n\
    \n```\nconst y = g(x);\nconst z = f(y);\n```\n\n将它们组合意味着：\n\n```\nconst z = f(g(x));\n\
    ```\n\n### compose()\n\n为了组合多个函数，我们可以创建 `compose()` 工具函数。\n\n```\nf(g(x)) ===\
    \ compose(f,g)(x);\n```\n\n以下是 `compose()` 的一种实现：\n\n```\nfunction compose(...functions){\n\
    \  return function(x){\n    return functions.reduceRight((value,f) => f(value),\
    \ x);\n  }\n}\n\nfunction f(y){\n  return y * y;\n}\n\nfunction g(x){\n  return\
    \ x + x;\n}\n\nf(g(2)) === compose(f,g)(2);\n```\n\n`compose()` 适用于一元函数。\n\n###\
    \ 使用装饰器进行组合\n\n考虑以下从书籍集合中选取 `title` 的代码：\n\n```\nimport prop from \"lodash/property\"\
    ;\n\nconst books = [\n  {id:1, title: \"JavaScript The Good Parts\", type: \"\
    T\"},\n  {id:2, title: \"Civilization\", type: \"H\"},\n  {id:3, title: \"Javascript\
    \ Allongé\", type: \"T\"}\n];\n\nconst titles = books.map(prop(\"title\"));\n\
    //[\"JavaScript The Good Parts\", \n// \"Civilization\",\n// \"Javascript Allongé\"\
    ]\n```\n\n在这个例子中，我们使用了函数组合。`map()` 函数将 `prop()` 函数的返回值作为输入。\n\n下面是另一个使用 `matchesProperty()`\
    \ 按 id 查找书籍的函数组合示例：\n\n```\nimport matchesProperty from \"lodash/matchesProperty\"\
    ;\n\nconst book = books.find(matchesProperty(\"id\", 1));\n//{id: 1, title: \"\
    JavaScript The Good Parts\", type: \"T\"}\n```\n\n函数 `find()` 将 `matchesProperty()`\
    \ 装饰器的返回值作为输入。\n\n以这种方式组合函数时，第一个函数可以有多个参数。\n\n### pipe()\n\n> `pipe()` 创建一个函数管道，其中一个函数的输出是下一个函数的输入。\n\
    \n考虑以下代码：\n\n```\nfunction filterBooks(todos){\n  return todos.filter(isTechnology);\n\
    }\n\nfunction isTechnology(todo){\n  return todo.type === \"T\";\n}\n\nfunction\
    \ creatItemHtml(todo){\n  return `<div>${todo.title}</div>`;\n}\n\nfunction createListHtml(todos){\n\
    \  const htmlArr = todos.map(creatItemHtml);\n  return htmlArr.join(\"\");\n}\n\
    \nfunction renderHtml(html){\n  $(\"#books\").html(html);\n}\n\nconst books =\
    \ [\n  { id:1, title: \"JavaScript The Good Parts\", type: \"T\" },\n  { id:2,\
    \ title: \"Civilization\", type: \"H\" },\n  { id:3, title: \"Javascript Allongé\"\
    , type: \"T\" }\n];\n\nconst filteredBooks = filterBooks(books);\nconst html =\
    \ createListHtml(filteredBooks);\nrenderHtml(html);\n```\n\n可以使用 `pipe()` 工具函数重写\
    \ `books` 的处理过程：\n\n```\nimport pipe from \"lodash/flow\";\n\npipe(\n  filterBooks,\n\
    \  createListHtml,\n  renderHtml\n)(books);\n```\n\n可以使用像 `logData()` 这样的工具函数在转换之间记录数据：\n\
    \n```\nimport pipe from \"lodash/flow\";\n\nfunction logData(data){\n  console.log(data)\n\
    \  return data;\n}\n\npipe(\n  filterBooks,\n  logData,\n  createListHtml,\n \
    \ logData,\n  renderHtml\n)(books);\n```\n\n以下是 `pipe()` 函数的一种实现：\n\n```\nfunction\
    \ pipe(...functions){\n  return function(x){\n    return functions.reduce((value,\
    \ f) => f(value), x);\n  }\n}\n```\n\n`pipe()` 适用于接受一个参数的函数。\n\n"
- fmt: "\n### Composing with promise chaining\n\nWhen we use promise chaining we use\
    \ function composition. The result of one function is passed as input for the\
    \ next function. Look at the next example:\n\n```\nfunction fetchBooks() {\n \
    \ return new Promise(function(resolve, reject) {\n    resolve(books);\n  });\n\
    }\n\nfunction handleError(error) { \n  console.error(error); \n}\n\nfetchBooks()\n\
    \  .then(filterBooks)\n  .then(createListHtml)\n  .then(renderHtml)\n  .catch(handleError);\n\
    ```\n\n### Final thoughts\n\nFunction composition is the process of applying one\
    \ function to the result of another. With function composition we eliminate the\
    \ intermediary variables.\n\nPipelines make data transformations more expressive.\n\
    \n# Chapter 10: Intention revealing names\n\n> Choosing good names takes time\
    \ but saves more than it takes. So take care with your names and change them when\
    \ you find better ones. Everyone who reads your code, including you, will be happier\
    \ if you do.\n\n> The name of a variable, function … should answer all the big\
    \ questions. It should tell you why it exists, what it does, and how it is used.\
    \ If a name requires a comment, then the name does not reveal its intent.— Tim\
    \ Ottinger in [Clean Code](https://www.amazon.com/Clean-Code-Handbook-Software-Craftsmanship/dp/0132350882)\n\
    \nThe function name turns out to have a very important role in readability as\
    \ we can easily read and understand meaningful words. The function name is our\
    \ tool for expressing the intention of a piece of code.\n\n### Refactoring anonymous\
    \ functions\n\nFunctions can be created with or without a name. The arrow syntax\
    \ usually creates anonymous functions. Consider the following code written with\
    \ anonymous arrow functions:\n\n```\nconst books = [\n  {title:\"How JavaScript\
    \ works\",type:\"T\"},\n  {title:\"Square and tower\",type:\"H\"},\n  {title:\"\
    Functional-Light JavaScript\",type:\"T\"}\n];\n\nconst newBooks = books\n .filter(book\
    \ => book.type === \"T\")\n .sort((book1, book2) => {\n   if(book1.title < book2.title)\
    \ return -1;\n   if(book1.title > book2.title) return 1;\n   return 0;\n });\n\
    \n//[{title:\"Functional-Light JavaScript\",type:\"T\"}, \n// {title:\"How JavaScript\
    \ works\",type:\"T\"}];\n```\n\nNow check out the same logic refactored to pure\
    \ functions with intention revealing names:\n\n```\nfunction isTechnology(book){\n\
    \   return book.type === \"T\";\n}\n\nfunction ascByTitle(book1, book2){\n  if(book1.title<book2.title)\
    \ return -1;\n  if(book1.title>book2.title) return 1;\n  return 0;\n}\n\nconst\
    \ newBooks = books\n                .filter(isTechnology)\n                .sort(ascByTitle);\n\
    ```\n\nWith good function names we can read the code faster. We can read the function\
    \ name and understand its purpose. There is no need to analyze its code.\n\nLet’s\
    \ look at an event handler written with an anonymous function.\n\n```\n$(\"#first\"\
    ).click(() => {\n  const list = getItemsFromList();\n  const filteredList = list.slice(0,1);\n\
    \  renderList(filteredList);\n});\n```\n\nBelow is the code after refactoring\
    \ to a function with a clear name:\n\n```\n$(\"#first\").click(renderFirstItem);\n\
    \nfunction renderFirstItem(){\n  const list = getItemsFromList();\n  const filteredList\
    \ = list.slice(0,1);\n  renderList(filteredList);\n}\n```\n\nI suggest using names\
    \ that express the function purse and add value to the existing code. For example,\
    \ names like `onClick()` or `myCustomClickEvent()` express where the function\
    \ is used not what it does. The same function can very well handle other events\
    \ or be called in other places.\n\n### Named function expressions\n\nNext, we\
    \ will look at how to improve readability with named function expressions.\n\n\
    I will exaggerate the situation and use three anonymous IIFEs:\n\n```\n(() =>\
    \ {\n    /*code*/\n    (() => {\n        /*code*/\n        (() => {\n        \
    \    /*code*/\n        })();  \n    })();\n})();\n```\n\nAnonymous functions appear\
    \ as `(anonymous)` in the call stack.\n\n![](Images/image00080.gif \"Anonymous\
    \ Function Expressions in the Call Stack\")\n\nLet’s rewrite the code with named\
    \ function expressions:\n\n```\n(function createTodoModule(){\n  /*code*/\n  (function\
    \ getAllTodos(){\n    /*code*/\n    (function renderTodo(){\n      /*code*/\n\
    \    })();  \n  })();\n})();\n```\n\nThis time, the Call Stack is easier to understand.\n\
    \n![](Images/image00081.gif \"Name Function Expressions in the Call Stack\")\n\
    \n`createTodoModule()`, `getAllTodos()` and `renderTodo()` are named function\
    \ expressions.\n\n### Names with arrow functions\n\nI think that names can improve\
    \ readability in cases with little logic. Let’s take the example of computing\
    \ a sum over an array.\n\n```\n//using anonymous function\nconst total = numbers.reduce((a,\
    \ b) => a + b, 0);\n\n//using named function\nfunction sum(a, b) { return a +\
    \ b; }\nconst total = numbers.reduce(sum, 0);\n```\n\nThe `sum()` function can\
    \ be written with the arrow syntax. In this case, the arrow function infers the\
    \ name of the variable.\n\n```\nconst sum = (a, b) => a + b;\nconst total = numbers.reduce(sum,\
    \ 0);\n```\n\n### Simple code\n\nThere are situations when the code is so small\
    \ that creating a named function adds no value. In that case, we can use an anonymous\
    \ function until the code becomes more complex. Consider the next code:\n\n```\n\
    const books = [\n  {title:\"How JavaScript works\",type:\"T\"},\n  {title:\"Square\
    \ and tower\",type:\"H\"},\n  {title:\"Functional-Light JavaScript\",type:\"T\"\
    }\n];\n\nconst titles = books.map(book => book.title);\n//[\"How JavaScript works\"\
    , \"Square and tower\", \n// \"Functional-Light JavaScript\"]\n```\n\nAnother\
    \ option is to use a generic utility function like `prop()`:\n\n```\nimport prop\
    \ from \"lodash/property\";\n\nconst titles = books.map(prop(\"title\"));\n```\n\
    \n### Arrow function vs `function`\n\nLess code doesn’t necessarily mean more\
    \ readable. The next example shows two ways of defining the `prop()` function.\
    \ I prefer the one using the `function` keyword because I think it is clearer\
    \ what the function does.\n\n`prop()` takes the name of a property and returns\
    \ a function that asks for an object an returns the property of that object.\n\
    \n```\n//with arrow function\nconst prop = key => obj => obj[key];\n\n//with function\
    \ keyword\nfunction prop(key){\n   return function(obj){\n      return obj[key];\n\
    \   }\n}\n```\n\n### Final thoughts\n\nIntention revealing function names improve\
    \ readability and offer a better debugging experience.\n\nI suggest refactoring\
    \ to a named function whenever the name adds value to the existing code.\n\n#\
    \ Chapter 11: Making code easier to read\n\n> I believe very deeply that the vastly\
    \ more important role of code is as a means of communication with other human\
    \ beings.\n\n> It’s widely estimated that developers spend 70% of code maintenance\
    \ time on reading to understand it.— Kyle Simpson, author of [Functional-Light\
    \ JavaScript](https://www.amazon.com/Functional-Light-JavaScript-Pragmatic-Balanced-FP-ebook/dp/)\n\
    \nDevelopers have an easier time understanding small pieces of code with intention\
    \ revealing names. Understanding is easier if functions are pure.\n\nLet’s look\
    \ at how we can improve code readability with functional programming techniques.\n\
    \n### Refactoring with filter and map\n\nI will take the case of a collection\
    \ of to-dos:\n\n```\nconst todos = [\n  { \n    id : 1,\n    type : \"NC\",\n\
    \    desc : \"task1\",\n    user : { id: 1, name: \"user1\"},\n    completed :\
    \ false\n  },\n  { \n    id : 2,\n    type : \"RE\",\n    desc : \"task2\",\n\
    \    user : { id: 2, name: \"user2\"},\n    completed : false\n  }\n];\n```\n\n\
    Below is the imperative code filtering the to-dos and creating new objects having\
    \ the `userName` property.\n\n```\nlet filteredTodos = [];\nfor(let i=0; i<todos.length;\
    \ i++){\n  let todo = todos[i];\n  if (todo.type === \"RE\" && !todo.completed)\
    \ {\n    filteredTodos.push({...todo,userName: todo.user.name});\n  }\n}\n\nconsole.log(filteredTodos);\n\
    //[{ \n// completed: false,\n// desc: \"task2\",\n// id: 2,\n// type: \"RE\",\n\
    // user: {id: 2, name: \"user2\"},\n// userName: \"user2\" \n//}]\n```\n\nRefactoring\
    \ to a functional style makes use of the `filter()` and `map()` functions.\n\n\
    ```\nconst filteredTodos = todos\n .filter(todo => (todo.type === \"RE\" && !todo.completed))\n\
    \ .map(todo => ({ ...todo, userName: todo.user.name }));\n```\n"
