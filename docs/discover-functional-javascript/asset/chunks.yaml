  trans: "\n`const` 声明一个不能被重新赋值的变量。只有当赋值为不可变值时，它才成为常量。\n\n简而言之，对原始值使用 `const` 定义的是常量。对对象值使用\
    \ `const` 并不一定定义常量。\n\n```\nconst book = {\n  title : \"How JavaScript Works\"\
    ,\n  author : \"Douglas Crockford\"\n};\n\nbook.title = \"JavaScript The Good\
    \ Parts\";\n\nconsole.log(book);\n//{title: \"JavaScript The Good Parts\", \n\
    // author: \"Douglas Crockford\"}\n```\n\n### 冻结对象\n\n冻结对象使其不可变。\n\n`Object.freeze()`\
    \ 可用于冻结对象。属性不能被添加、删除或修改。\n\n```\nconst book = Object.freeze({\n  title : \"Functional-Light\
    \ JavaScript\",\n  author : \"Kyle Simpson\"\n});\n\nbook.title = \"You Don't\
    \ Know JS\";\n//Cannot assign to read only property 'title'\n```\n\n`Object.freeze()`\
    \ 执行的是浅冻结。嵌套对象仍可被修改。要实现深冻结，需要递归地冻结每个对象类型的属性。以下是 `deepFreeze()` 的实现：\n\n```\nfunction\
    \ deepFreeze(object) {\n  Object.keys(object).forEach(function(name){\n    const\
    \ value = object[name];\n    if(typeof value === \"object\") {\n      deepFreeze(value);\n\
    \    }\n  });\n  return Object.freeze(object);\n}\n```\n\n`deepFreeze()` 使普通对象不可变。\n\
    \n### 处理不可变对象\n\n将 `book` 视为一个不可变对象。\n\n```\nconst book = Object.freeze({\n  title\
    \ : \"JavaScript The Good Parts\",\n  author : \"Douglas Crockford\"\n});\n```\n\
    \n任何修改都需要创建一个新对象。\n\n#### 编辑属性\n\n```\nconst title = \"How JavaScript Works\"\
    ;\nconst newBook = Object.freeze({ ...book, title });\n\nconsole.log(book);\n\
    //{title: \"JavaScript The Good Parts\", \n// author: \"Douglas Crockford\"}\n\
    \nconsole.log(newBook);\n//{title: \"How JavaScript Works\", \n// author: \"Douglas\
    \ Crockford\"}\n```\n\n#### 添加属性\n\n```\nconst description = \"Looking at the\
    \ fundamentals\";\nconst newBook = Object.freeze({ ...book, description});\n\n\
    console.log(book);\n//{title: \"JavaScript The Good Parts\", \n// author: \"Douglas\
    \ Crockford\"}\n\nconsole.log(newBook);\n//{title: \"JavaScript The Good Parts\"\
    , \n// author: \"Douglas Crockford\"}\n// description: \"Looking at the fundamentals\"\
    }\n```\n\n#### 删除属性\n\n可以使用解构语法创建一个不包含 `author` 属性的新对象：\n\n```\nconst { author,\
    \ ...newBook } = book;\n\nconsole.log(book);\n//{title: \"JavaScript The Good\
    \ Parts\", \n// author: \"Douglas Crockford\"}\n\nconsole.log(newBook);\n//{title:\
    \ \"JavaScript The Good Parts\"}\n```\n\n### 处理不可变数组\n\n数组数据结构是可变的。创建后可以被修改。\n\
    \n为了处理不可变数组，我们需要在创建时冻结它们，并主要使用纯数组方法和展开运算符。\n\n纯数组方法不会修改现有数组，而是创建新值。\n\n`concat()`、`every()`、`filter()`、`find()`、`findIndex()`、`map()`、`reduce()`、`reduceRight()`、`slice()`、`some()`\
    \ 是纯方法。\n\n`reverse()`、`sort()` 本应是纯方法，但实际上不是。要使用它们，必须先复制原始数组。\n\n非纯方法会修改输入数组。\n\
    \n`pop()`、`push()`、`shift()`、`splice()`、`unshift()` 不是纯方法。\n\n`Object.freeze()`\
    \ 冻结数组。只有纯方法能正常工作。\n\n```\nconst books = Object.freeze([ \n  {title: \"Functional\
    \ JavaScript\"}, \n  {title: \"Programming Elixir\"}\n]);\n\nbooks.push({});\n\
    //Cannot add property 0\n\nbooks.pop();\n//Cannot delete property '0'\n```\n\n\
    #### 添加\n\n以下是一个向不可变数组添加新值的示例：\n\n```\nconst newBook = \n        Object.freeze({\
    \ title:\"How JavaScript Works\" });\n\n//使用展开运算符添加\nconst newBooks = [...books,\
    \ newBook];\n\n//使用 concat() 添加\nconst newBooks = books.concat([newBook]);\n```\n\
    \n#### 删除\n\n以下是从位置 `index` 删除值的示例：\n\n```\nconst index = 0;\nconst newBooks =\
    \ [...books.slice(0, index), \n                  ...books.slice(index+1)];\n```\n\
    \n`slice(start, end)` 返回数组的一部分，介于两个指定索引之间，作为一个新数组。当省略 `end` 索引时，会选择从 `start` 位置到数组末尾的所有元素。当\
    \ `start` 索引也被省略时，则从索引 0 开始，并创建数组的浅克隆。\n\n#### 编辑\n\n`map()` 可用于编辑不可变数组中的元素。映射函数返回我们要更新的元素的新值，并返回所有其他元素的现有值。\n\
    \n```\nconst newBook = Object.freeze({title:\"JavaScript Patterns\"});\nconst\
    \ editIndex = 0;\n\nconst newBooks = books.map(function(book, index){\n    if(index\
    \ === editIndex){\n      return newBook;\n    }\n\n    return book;\n  });\n```\n\
    \n### 不可变库\n\n[Immutable.js](https://facebook.github.io/immutable-js/) 提供了不可变数据结构，如\
    \ `List` 和 `Map`。这些数据结构经过了高度优化。\n\n让我们看看 `List` 数据结构。\n\n```\nimport { List }\
    \ from \"immutable\";\n\nconst books = List([\n  { title: \"JavaScript Allongé\"\
    \ }, \n  { title: \"You Don't Know JS\" }\n]);\n```\n\n#### 添加\n\n> `push(value)`\
    \ 返回一个添加了新 `value` 的新 `List`。\n\n```\nconst aNewBook = { title: \"Mastering Immutable.js\"\
    \ };\n\nconst newBooks = books.push(aNewBook);\n\nconsole.log(Array.from(books));\n\
    //[{title: \"JavaScript Allongé\"},\n// {title: \"You Don't Know JS\"}]\n\nconsole.log(Array.from(newBooks));\n\
    //[{title: \"JavaScript Allongé\"},\n// {title: \"You Don't Know JS\"},\n// {title:\
    \ \"Mastering Immutable.js\"}]\n```\n\n#### 编辑\n\n> `set(index, value)` 返回一个新\
    \ `List`，在位置 `index` 处具有新 `value`。\n\n```\nconst aNewBook = { title: \"Mastering\
    \ Immutable.js\" };\n\nconst newBooks = books.set(0, aNewBook);\n\nconsole.log(Array.from(newBooks));\n\
    //[{title: \"Mastering Immutable.js\"},\n// {title: \"You Don't Know JS\"}];\n\
    ```\n\n#### 删除\n\n> `remove(index)` 返回一个新 `List`，其中移除了位置 `index` 处的值。\n\n```\n\
    const newBooks = books.remove(0);\n\nconsole.log(Array.from(newBooks));\n//[{title:\
    \ \"You Don't Know JS\"}];\n```\n\n不可变的 `List` 数据结构可以使用 `Array.from()`、展开运算符或\
    \ `toArray()` 方法转换为原生数组。对于大型数组/对象，这些转换可能会很慢。\n\n在性能和内存方面，我们应该考虑像 [Immutable.js](https://facebook.github.io/immutable-js/)\
    \ 这样的库提供的不可变数据结构。\n\n### 传输对象\n\n传输对象是仅包含数据的普通对象，这些数据在应用程序中从一个函数传递到另一个函数。\n\n\
    为了避免任何意外更改，它们应该是不可变的。\n\n### 输入值\n\n意外更改可能会产生难以发现和理解的错误。这意味着需要更多时间来调查问题，因此不可变性可以节省故障排除和调试时间。\n\
    \n所有输入值都应被视为不可变值，无论它们是否真的是。这样，我们就能避免在应用程序的其他地方产生意外更改。\n\n### 变更检测\n\n不可变性在检测对象变化时提供了效率。要检测对象是否已更改，我们只需比较之前的引用和当前的引用。无需检查所有属性的值。\n\
    \n### 最终思考\n\n不可变性使代码更易于阅读。当值不能改变时，代码更容易推理。\n\n不可变性避免了一类难以检测的错误。\n\n在 JavaScript\
    \ 中处理不可变值有两种方法。一种是在创建时冻结所有对象和数组，然后使用展开运算符或纯数组方法创建新数组。另一种选择是使用像 [Immutable.js](https://facebook.github.io/immutable-js/)\
    \ 这样的库，它提供了不可变数据结构。\n\n不可变性不是关于不能改变的变量，而是关于不能改变的值。\n\n# 第 8 章：偏函数应用与柯里化\n\n"
- fmt: "\nPartial application and currying are techniques for transforming functions\
    \ into other functions with fewer arguments. They have a similar purpose, but\
    \ they work in different ways. Let’s see how.\n\n### Partial application\n\n>\
    \ Partial application is the process of fixing a number of arguments to a function\
    \ by producing another function with fewer arguments. The returned function is\
    \ a partially applied function.\n\nFixing or binding the first arguments to a\
    \ function creates a new function that takes the remaining arguments. Consider\
    \ function `f(x, y, z)`:\n\n```\nfunction f(x, y, z){\n  console.log(x);\n  console.log(y);\n\
    \  console.log(z);\n}\n\nconst f1 = partial(f, 1);\nconst f2 = partial(f, 1, 2);\n\
    const f3 = partial(f, 1, 2, 3);\n\nf1(10, 100);\n//1\n//10\n//1000\n\nf2(4);\n\
    //1\n//2\n//4\n\nf3();\n//1\n//2\n//3\n```\n\n*   Fixing one argument to function\
    \ `f` creates a new function with two arguments.\n*   Fixing two arguments to\
    \ the function creates a function with one argument.\n*   Fixing all three arguments\
    \ creates a function with no arguments.\n\nImagine you have a function and you\
    \ want to create another one accepting fewer arguments. First of all, why would\
    \ you want that? One reason may be that you want to create a specialized function\
    \ from a generic one. Another reason may be that you actually need a function\
    \ that takes fewer arguments and can be used with functions like `filter()` or\
    \ `map()`.\n\nNext, we will look at utilities for doing partial application.\n\
    \n### bind()\n\nThe `bind()` method can do partial application, however, the value\
    \ given to `this` requires attention. Take a look at the next example:\n\n```\n\
    function log(level, message){\n  console.log(level + \" : \"+message);\n}\n\n\
    const logInfo = log.bind(null, \"Info\");\nlogInfo(\"A message\");\n//Info : A\
    \ message\n```\n\nNotice how `logInfo()` function is created. It requires only\
    \ one argument, the `message`. `logInfo()` is a partially applied function.\n\n\
    ### partial()\n\nTo better understand how partial application works, let’s create\
    \ our own `partial()` function decorator.\n\n`partial()` creates a version of\
    \ the function that takes fewer arguments than the original function.\n\n```\n\
    function partial(fn, ...leftArgs) {\n  return function(...rightArgs) {\n    return\
    \ fn(...leftArgs, ...rightArgs);\n  }\n}\n\nfunction log(level, message){\n  console.log(level\
    \ + \" : \"+message);\n}\n\nconst logInfo = partial(log, \"Info\");\nlogInfo(\"\
    A message\");\n//Info : A message\n```\n\nThe `partial()` function can be found\
    \ in libraries like [lodash.js](https://lodash.com/docs/4.17.11#partial) or [underscore.js](https://underscorejs.org/#partial).\n\
    \n### Partial application with filter\n\nPartial application comes in handy when\
    \ the new function is used as a callback and can take fewer arguments. Consider\
    \ the next example:\n\n```\nfunction isTodoOfType(type, todo){\n  return todo.type\
    \ === type;\n}\n\nfunction getTodos(todos, type){\n  return todos.filter(todo\
    \ => isTodoOfType(type, todo));\n}\n\nconst todos = [\n {id: 1, type: \"NC\",\
    \ title: \"create\"},\n {id: 2, type: \"RE\", title: \"review\"}\n];\n\nconst\
    \ filteredTodos = getTodos(todos, \"NC\");\n//[{id:1, type:\"NC\", title:\"create\"\
    }];\n```\n\nThe anonymous predicate for `filter()` takes one argument, the current\
    \ `todo`, and uses it to call `isTodoOfType()`.\n\nAnother option is to use partial\
    \ application and create a new function with the `type` already set:\n\n```\n\
    const isOfType = partial(isTodoOfType, type); \n```\n\nThen we can use the new\
    \ predicate function as a callback for the `filter()` method. Here is the code:\n\
    \n```\nfunction getTodos(type){\n  const isOfType = partial(isTodoOfType, type);\
    \ \n  return todos.filter(isOfType, type);\n}\n```\n\n### Argument order\n\nThe\
    \ argument order is important.\n\nThe `partial()` utility fixes arguments from\
    \ left to right. The following code will not work properly:\n\n```\nfunction isTodoOfType(todo,\
    \ type){\n  return todo.type === type;\n}\n\nfunction getTodos(type){\n  return\
    \ todos.filter(partial(isTodoOfType, type));\n}\n```\n\nNotice the order of arguments\
    \ in the `isTodoOfType(todo, type)` function. `partial(isTodoOfType, type)` sets\
    \ the first argument `todo` with a value specific for the `type`, which is wrong.\n\
    \n### Partial application with map\n\nLet’s take the case of a shopping list containing\
    \ the `productId` and `quantity` on each line item. Suppose we want to display\
    \ all product details on each line. We can use the `map()` method to transform\
    \ the shopping list into a new list with all product details. I would like to\
    \ use the `toProductView(products, line)` function, but `map()` sends only one\
    \ argument, the current line item. Here, partial application is useful for creating\
    \ a new function with the `products` argument already set.\n\n```\nimport partial\
    \ from \"lodash/partial\";\n\nconst shoppingList = [\n  { \n    productId: 1,\n\
    \    quantity: 2\n  },\n  { \n    productId: 2,\n    quantity: 1\n  }\n];\n\n\
    const products = {\n  1 : { id: 1, name: \"mango\"},\n  2 : { id: 2, name: \"\
    apple\"}\n}\n\nfunction toProductView(products, line){\n  const product = products[line.productId];\n\
    \  return {\n    ...line,\n    ...product\n    }\n}\n\nconst newList = shoppingList\n\
    \  .map(partial(toProductView, products));\n\nconsole.log(newList);\n//[\n//{id:\
    \ 1, name: \"mango\", quantity: 2},\n//{id: 2, name: \"apple\", quantity: 1}\n\
    //]\n```\n\n### Partial application with event handlers\n\nPartial application\
    \ provides a nice way to pass arguments to event handlers. Check the next example\
    \ in [React](https://reactjs.org/):\n\n```\nimport partial from \"lodash/partial\"\
    ;\n\nfunction TodoItem({ todo, onRemoveClick }) {\n  return (\n    <li>\n    \
    \  <div>{todo.title}</div>\n      <button onClick={partial(onRemoveClick, todo)}>\n\
    \        Delete\n      </button>\n    </li>\n  );\n}\n```\n\n### Currying\n\n\
    > Currying transforms a function that takes multiple arguments into a sequence\
    \ of functions where each takes one argument.\n\nConsider for example the `f(x,y,z)`\
    \ function with three arguments. Here is how we can write the curried version:\n\
    \n```\nfunction f(x){\n  return function(y){\n    return function(z){\n      console.log(x);\n\
    \      console.log(y);\n      console.log(z);\n    }\n  }\n}\n\nf(1)(2)(3);\n\
    //1\n//2\n//3\n```\n\nA curried function is a function that takes multiple arguments\
    \ one at a time and returns a sequence of unary functions until all arguments\
    \ have been provided.\n\nApplying all arguments to the function executes the function.\n\
    \n```\nf(1); // returns a function\nf(1)(2); //returns a function\nf(1)(2)(3);\
    \ //executes f and returns the result\n```\n\n### Currying with filter\n\nLet’s\
    \ take the previous situation, where `isTodoOfType()` needs two arguments and\
    \ we want to use it with `filter()` that provides only one of them, the `todo`.\n\
    \nThe `isTodoOfType` can be created as a curried function. It takes the `type`\
    \ and returns a predicate function that takes the `todo` and returns a boolean.\
    \ See the code below:\n\n```\nfunction isTodoOfType(type){\n  return function(todo){\n\
    \    return todo.type === type;\n  }\n};\n\nfunction getTodos(type){\n return\
    \ todos.filter(isTodoOfType(type));\n}\n\nconst todos = [\n {id: 1, type: \"NC\"\
    , title: \"create\"},\n {id: 2, type: \"RE\", title: \"review\"}\n];\n\nconst\
    \ filteredTodos = getTodos(\"NC\");\n//[{id:1, type:\"NC\", title:\"create\"}];\n\
    ```\n\n### Currying with map\n\nIn the shopping list example, we can rewrite the\
    \ `toProductView()` function, that needs two arguments, as a curried function.\
    \ Consider the next code:\n\n```\nfunction toProductView(products){\n  return\
    \ function(line){\n    const product = products[line.productId];\n    return {\n\
    \      ...line,\n      ...product\n    }\n  }\n}\n\nconst newList = shoppingList.map(toProductView(products));\n\
    ```\n\n### curry()\n\nIn functional languages like [Haskell](https://en.wikipedia.org/wiki/Haskell_(programming_language)),\
    \ functions are curried by default. Calling the function with fewer arguments\
    \ results in a new function taking the remaining arguments. Calling the function\
    \ with all arguments executes the function.\n\nIn JavaScript currying can be enabled\
    \ with a utility function like `curry()`.\n"
