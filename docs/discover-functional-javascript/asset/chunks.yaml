  trans: "\n\n使用闭包时，只有暴露的方法才是公开的，其他一切都被封装起来。\n\n```\nconst counter = Counter();\n\
    counter.state; //undefined\n```\n\n对象的私有数据只能通过其公共方法进行修改。\n\n### 不可变的公共接口\n\n使用工厂函数创建的对象，其公共接口是不可变的。注意在返回的包含公共方法的对象上使用了\
    \ `Object.freeze()`。\n\n```\nconst counter = Counter();\ncounter.increment = function()\
    \ { \n    console.log(\"don't increment\"); \n}\n//Cannot assign to read only\
    \ property 'increment' of object\n```\n\n### 没有 `this`\n\n不存在 `this` 上下文变化的问题，因为使用闭包构建对象时，根本不会用到\
    \ `this`。\n\n让我们用闭包构建几个其他对象，并与用原型构建的对象进行比较。\n\n### 定时器\n\n定时器对象用于在特定时间间隔执行异步操作。与\
    \ `setInterval` 不同，它会等待上一个操作完成后再进行新的调用。它实现了递归的 setTimeout 模式。下面分别用原型和闭包创建定时器对象。\n\
    \n使用原型的定时器\n\n```\nclass Timer {\n  constructor(callback, interval){\n    this.callback\
    \ = callback;\n    this.interval = interval;\n    this.timerId = 0;\n }\n\n executeAndStartTimer(){\n\
    \   this.callback().then(() => {\n       this.timerId = setTimeout(this.executeAndStartTimer,\
    \ \n          this.interval);\n   });\n }\n\n start(){\n   if(this.timerId ===\
    \ 0){\n     this.executeAndStartTimer();\n   }\n }\n\n stop(){\n   if(this.timerId\
    \ !== 0){\n     clearTimeout(this.timerId);\n     this.timerId = 0;\n   }\n }\n\
    }\n\nfunction getTodos(){\n  return fetch(\"/todos\");\n}\n\nconst timer = new\
    \ Timer(getTodos,2000);\ntimer.start();\n```\n\n使用闭包的定时器\n\n```\nfunction Timer(callback,\
    \ interval){\n  let timerId;\n\n  function executeAndStartTimer(){\n    callback().then(function\
    \ makeNewCall(){\n      timerId = setTimeout(executeAndStartTimer, interval);\n\
    \    });\n  }\n\n  function stop(){\n    if(timerId){\n      clearTimeout(timerId);\n\
    \      timerId = 0;\n    }\n  }\n\n  function start(){\n    if(!timerId){\n  \
    \    executeAndStartTimer();\n    }\n  }\n\n  return Object.freeze({\n    start,\n\
    \    stop\n  });  \n}\n\nconst timer = Timer(getTodos, 2000);\ntimer.start();\n\
    ```\n\n#### 封装\n\n使用 `class` 时，对象的所有成员、字段和方法都是公开的。\n\n使用闭包时，只有 `start()` 和 `stop()`\
    \ 方法是公开的。\n\n`timerId` 和 `executeAndStartTimer()` 是私有的。\n\n#### 不可变的公共接口\n\n使用\
    \ `class` 创建的对象，其公共接口可以被修改。\n\n```\nconst timer = new Timer(getTodos,2000);\n\
    timer.start = function() { \n  console.log(\"don't start\"); \n}\ntimer.start();\
    \ //\"don't start\"\n```\n\n使用闭包和 `Object.freeze()` 创建的对象，其公共接口是不可变的。\n\n####\
    \ 没有 `this`\n\n当方法作为回调使用时，`this` 可能会意外丢失上下文。在嵌套函数中使用时也可能丢失上下文。\n\n考虑下面的例子，当 `executeAndStartTimer()`\
    \ 作为回调使用时，`this` 丢失了上下文。\n\n```\nexecuteAndStartTimer(){\n   this.callback().then(()\
    \ => {\n       this.timerId =  \n       setTimeout(this.executeAndStartTimer,\
    \ this.interval);\n   });\n }\n```\n\n当 `start()` 方法作为事件处理程序使用时，如下面的代码所示，`this`\
    \ 会丢失上下文：\n\n```\n$(\"#btnStart\").click(timer.start);\n```\n\n使用闭包时不存在这些问题，因为根本没有使用\
    \ `this`。\n\n没有 `this` 的 JavaScript 看起来更像一种更好的函数式编程语言。\n\n### 栈\n\n栈是一种数据结构，包含两个主要操作：`push()`\
    \ 用于向集合中添加元素，`pop()` 用于移除最近添加的元素。它按照 LIFO（后进先出）原则添加和移除元素。\n\n请看下面的例子：\n\n```\n\
    const stack = Stack();\nstack.push(1);\nstack.push(2);\nstack.push(3);\nstack.pop();\
    \ //3\nstack.pop(); //2\n```\n\n让我们用闭包实现栈：\n\n```\nfunction Stack(){\n  const\
    \ list = [];\n\n  function push(value){ \n    list.push(value); \n  }\n\n  function\
    \ pop(){ \n    return list.pop(); \n  }\n\n  return Object.freeze({\n    push,\n\
    \    pop\n  });\n}\n```\n\n栈对象有两个公共方法 `push()` 和 `pop()`。内部状态只能通过这些方法改变。\n\n我们不能直接修改内部状态：\n\
    \n```\nconst stack = Stack();\nstack.list = null;\n//Cannot add property list,\
    \ object is not extensible\n```\n\n### 队列\n\n队列是一种数据结构，包含两个主要操作：`enqueue()` 用于向集合中添加元素，`dequeue()`\
    \ 用于从集合中移除第一个元素。它按照 FIFO（先进先出）原则添加和移除元素。\n\n下面是一个例子：\n\n```\nconst queue = Queue();\n\
    queue.enqueue(1);\nqueue.enqueue(2);\nqueue.enqueue(3);\nqueue.dequeue(); //1\n\
    queue.dequeue(); //2\n```\n\n看看用闭包实现的队列：\n\n```\nfunction Queue(){\n  const list\
    \ = [];\n\n  function enqueue(value){ \n    list.push(value); \n  }\n\n  function\
    \ dequeue(){ \n    return list.shift(); \n  }\n\n  return Object.freeze({\n  \
    \  enqueue,\n    dequeue\n  });\n}\n```\n\n正如我们之前所见，对象的内部状态无法从外部访问。\n\n### 事件发射器\n\
    \n事件发射器是一个具有发布/订阅公共接口的对象。它用于在应用程序的不同部分之间进行通信。\n\n请看下面的例子：\n\n```\nconst eventEmitter\
    \ = EventEmitter();\n\neventEmitter.subscribe(\"update\", doSomething);\neventEmitter.subscribe(\"\
    update\", doSomethingElse);\neventEmitter.subscribe(\"add\", addItem);\n\neventEmitter.publish(\"\
    update\", {});\n\nfunction doSomething(value) { }\nfunction doSomethingElse(value)\
    \ { }\nfunction addItem(value) { }\n```\n\n首先，我们为 `update` 事件订阅了两个函数，为 `add` 事件订阅了一个函数。当事件发射器发布\
    \ `update` 事件时，`doSomething()` 和 `doSomethingElse()` 将被调用。\n\n下面是一个简单事件发射器的实现：\n\
    \n```\nimport partial from \"lodash/partial\";\n\nfunction EventEmitter(){\n \
    \ const subscribers = [];\n\n  function subscribe(type, callback){\n    subscribers[type]\
    \ = subscribers[type] || [];\n    subscribers[type].push(callback); \n  }\n\n\
    \  function notify(value, fn){\n    try {\n      fn(value);\n    }\n    catch(e)\
    \ { console.error(e); }\n  }\n\n  function publish(type, value){\n    if(subscribers[type]){\n\
    \      subscribers[type].forEach(partial(notify, value));\n    }\n  }\n\n  return\
    \ Object.freeze({\n    subscribe,\n    publish\n  });\n}\n```\n\n只有 `publish()`\
    \ 和 `subscribe()` 方法是公开的。其他一切都是私有的。没有使用 `this`。\n\n### 内存\n\n类在内存节省方面更优，因为它们是基于原型系统实现的。所有方法都将在原型对象中创建一次，并由所有实例共享。\n\
    \n当创建数千个相同对象时，使用闭包的内存开销是明显的。以下是在 Chrome 中测量的内存开销：\n\n| 实例数 | 10 个方法 | 20 个方法 |\n\
    | --- | --- | --- |\n| 10 | 0 | 0 |\n| 100 | ~0.1 Mb | ~0.1 Mb |\n| 1000 | ~0.7\
    \ Mb | ~1.4 Mb |\n| 10000 | ~7 Mb | ~14 Mb |\n\n### 组合优于继承\n\n工厂函数提倡组合优于继承。请看下面的例子，其中\
    \ `SpecialService` 复用了 `Service` 的成员：\n\n```\nfunction Service() {\n  function\
    \ doSomething(){ \n    console.log(\"do-something\"); \n  }\n\n  return Object.freeze({\n\
    \    doSomething\n  });\n}\n\nfunction SpecialService({ service }){  \n  function\
    \ doSomethingElse(){ \n    console.log(\"do-something-else\"); \n  }\n\n  return\
    \ Object.freeze({\n    doSomething : service.doSomething,\n    doSomethingElse\n\
    \  });\n}\n\nconst specialService = SpecialService({\n  service : Service()\n\
    });\n\nspecialService.doSomething(); \n//\"do-something\"\n\nspecialService.doSomethingElse();\n\
    //\"do-something-else\"\n```\n\n### 最终思考\n\n闭包为面向对象编程开辟了一条新路，无需类或原型。\n\n"
- fmt: "\nObjects built with closures encapsulate data, favor composition and have\
    \ not `this` changing context issues.\n\n# Chapter 15: Method decorators\n\n>\
    \ The decorators act like keywords or annotations, documenting the method’s behavior\
    \ but clearly separating these secondary concerns from the core logic of the method.—\
    \ Reginald Braithwaite, author of [JavaScript Allongé](https://www.amazon.com/Javascript-Allong%C3%A9-Reginald-Braithwaite-ebook/dp/B00FLKRCVO)\n\
    \nMethod decorators are a tool for reusing common logic. They are complementary\
    \ to object-oriented programming. Decorators encapsulate responsibility shared\
    \ by different objects.\n\nConsider the following code:\n\n```\nfunction TodoStore(currentUser){\n\
    \  const todos = [];\n\n  function add(todo){\n    const start = Date.now();\n\
    \    if(currentUser.isAuthenticated()){\n      todos.push(todo);\n    } else {\n\
    \      throw new Error(\"Not authorized\");\n    }\n\n    const duration = Date.now()\
    \ - start;\n    console.log(\"add() duration : \" + duration);\n  }\n\n  return\
    \ Object.freeze({\n    add\n  });  \n}\n\nconst currentUser = {\n  isAuthenticated\
    \ : function(){\n    return true;\n  }\n}\n\nconst todoStore = TodoStore(currentUser);\n\
    todoStore.add({ title : \"learn\"});\n//\"add() duration : 0\"\n```\n\nThe `add()`\
    \ method has the primary responsibility of adding a new `todo` to the internal\
    \ state and two secondary responsibilities of authorizing the user and logging\
    \ the duration of execution. The secondary concerns can repeat in other methods.\n\
    \nImagine we decompose the secondary responsibilities in two function decorators\
    \ with intention revealing names : `authorize()` and `logDuration()`. Then we\
    \ compose everything together to create the original function.\n\n```\nimport\
    \ { compose } from \"./tools\";\nimport { logDuration, authorize } from \"./decorators\"\
    ;\n\nfunction TodoStore(){\n  const todos = [];\n\n  function add(todo){\n   \
    \ todos.push(todo);\n  }\n\n  return Object.freeze({\n     add: compose(logDuration,\
    \ authorize)(add) \n  }); \n}\n```\n\nNow the `add()` method just adds the `todo`\
    \ to the list. The other responsibilities are implemented by decorating the method.\n\
    \n### Logging duration\n\nA common scenario is logging the duration of a method\
    \ call. The following decorator logs the duration of a synchronous call.\n\n```\n\
    function logDuration(fn){\n  return function(...args){\n    const start = Date.now();\n\
    \    const result = fn(...args);\n    const duration = Date.now() - start;\n \
    \   console.log(fn.name + \"() duration : \" + duration);\n    return result;\n\
    \  }\n}\n```\n\n### Authorization\n\nThe `authorize()` decorator makes sure the\
    \ user has the right to execute the method. This decorator is more complex as\
    \ it has a dependency on another object `currentUser`. In this case, we can use\
    \ a function `createAuthorizeDecorator()` to build the decorator. The decorator\
    \ will execute the original method only if the user is authenticated.\n\n```\n\
    function createAuthorizeDecorator(currentUser) {\n  return function authorize(fn)\
    \ {\n    return function(...args) {\n      if (currentUser.isAuthenticated())\
    \ {\n        return fn(...args);\n      } else {\n        throw new Error(\"Not\
    \ authorized\");\n      }\n    };\n  };\n}\n```\n\nNow, we can create the decorator\
    \ and pass the dependency.\n\n```\nconst authorize = createAuthorizeDecorator(currentUser);\n\
    ```\n\n### Decorator composition\n\nOften we need to apply multiple decorators\
    \ on a method. A simple way is to call the decorators one after the other:\n\n\
    ```\nfunction add() { }\n\nconst addWithAuthorize= authorize(add);\nconst addWithAuthorizeAndLog=\
    \ logDuration(addWithAuthorize);\naddWithAuthorizeAndLog();\n```\n\nAnother way\
    \ is to compose all decorators and then apply the new decorator on the original\
    \ function.\n\n```\nimport { compose } from \"./tools\";\n\nconst composedDecorator\
    \ = compose(logDuration, authorize);\nconst addWithComposedDecorator = composedDecorator(add);\n\
    addWithComposedDecorator();\n```\n\nBelow the `compose()` function is used to\
    \ apply decorators on the `add()` method:\n\n```\nimport { compose } from \"./tools\"\
    ;\n\nfunction TodoStore(){\n  function add(){}\n\n  return Object.freeze({\n \
    \    add: compose(logDuration, authorize)(add) \n  });  \n}\n\nconst todoStore\
    \ = TodoStore();\ntodoStore.add();\n```\n\n### Decorator order\n\nIn some cases,\
    \ the order in which decorators get executed may not be important. But often the\
    \ order does matter.\n\nIn our example, they are executed from left to right:\n\
    \n*   1st, the duration log starts\n\n*   2nd, the authorization is performed\n\
    \n*   3rd, the original method is called\n\n### Decorating all object’s methods\n\
    \nIn some cases, we may need to apply decorators on all public methods of an object.\
    \ We can create the `decorateMethods()` function to apply decorators on all public\
    \ methods of an object.\n\n```\nfunction decorateMethods(obj, ...decorators) {\n\
    \  const newObject = { ...obj };\n  Object.keys(newObject).forEach(function(fnName)\
    \ {\n    if (typeof newObject[fnName] === \"function\") {\n      newObject[fnName]\
    \ = \n          compose(...decorators)(newObject[fnName]);\n    }\n  });\n  return\
    \ newObject;\n}\n```\n\nWe may want to apply the decorators directly to the function\
    \ that creates the object. The `decorate()` function can help with that:\n\n```\n\
    function decorate(factory, ...decorators) {\n  return function(...args) {\n  \
    \  const newObject = decorateMethods(factory(...args), \n                    \
    \                  ...decorators);\n    return Object.freeze(newObject);\n  };\n\
    }\n```\n\nIn the next example, all public methods of the object created by `TodoStore`\
    \ are decorated with `logDuration()` and `authorize()`.\n\n```\nimport { decorate\
    \ } from \"./tools\";\nimport { logDuration, authorize } from \"./decorators\"\
    ;\n\nfunction TodoStore(){  \n  function get(){}\n  function add(todo){ }\n  function\
    \ edit(id, todo){}\n  function remove(id){}\n\n  return Object.freeze({\n    \
    \  get,\n      add,\n      edit,\n      remove\n  });  \n}\n\nexport default decorate(TodoStore,\
    \ logDuration, authorize);\n```\n\n### Store with pure functions\n\nWith decorators\
    \ we can separate pure from impure code. Consider the following example:\n\n```\n\
    export default function TodoStore() {\n  let todos = [];\n\n  function add(todos,\
    \ todo) {\n    return todos.concat([todo]);\n  }\n\n  function addAndMutate(todo)\
    \ {\n    todos = add(todos, todo);\n  }\n\n  return Object.freeze({\n    add:\
    \ addAndMutate\n  });\n}\n```\n\nIn this case, `add()` is a pure function and\
    \ `addAndMutate()` is impure. In order to modify the `todos` state, we need to\
    \ use the impure function. What if we encapsulate the impure code in a decorator\
    \ like the `setter` below:\n\n```\nimport { decorateMethods } from \"./tools\"\
    ;\n\nfunction Store(storeConfig) {\n  return function() {\n    let state = storeConfig.state;\n\
    \n    function setter(fn) {\n      return function(...args) {\n        state =\
    \ fn(state, ...args);\n      };\n    }\n\n    function getter(fn) {\n      return\
    \ function(...args) {\n        return fn(state, ...args);\n      };\n    }\n\n\
    \    return Object.freeze({\n      ...decorateMethods(storeConfig.getters, getter),\n\
    \      ...decorateMethods(storeConfig.setters, setter)\n    });\n  };\n}\n\nexport\
    \ default Store;\n```\n\n`getter()` takes a pure function and creates a function\
    \ that returns the current state transformed with the pure function.\n\n`setter()`\
    \ takes a pure function and creates a function that modifies the state using the\
    \ pure function.\n\nWith a library like `Store.js` we can write the `TodoStore`\
    \ using only pure functions:\n\n```\nimport Store from \"./Store\";\n\nfunction\
    \ add(todos, todo) {\n  return todos.concat([todo]);\n}\n\nexport default Store({\n\
    \  state: [],\n  setters: { add }\n});\n```\n\nWhen running `todoStore.add({ title:\
    \ \"verify\" })`, the `setter()` decorator calls the `add()` pure function with\
    \ the current `state` as the first parameter and the new `todo` as the second\
    \ parameter. Then, the `setter()` decorator uses the result to change the `state`.\n\
    \n### Final thoughts\n\nDecorators encapsulate common logic reusable between objects.\
    \ They are complementary to object-oriented programming.\n\nDecorators improve\
    \ readability. The code is much cleaner as it focuses on the main responsibility\
    \ without being blurred by the secondary logic.\n"
