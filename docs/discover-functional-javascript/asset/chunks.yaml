  trans: "\n\n# 第 16 章：等待新的编程范式\n\n> 知识建立在知识之上。——约翰·卡马克\n\nJavaScript 让函数式编程流行起来，并提供了一种用闭包构建封装对象的新方式。在等待新的编程范式之际，让我们回顾一下我们是如何走到这一步的。\n\
    \n### 基于类的面向对象编程\n\n1985 年，C++ 问世，并为 C 语言增加了类。类定义了对象的数据和行为。对象是类的实例。类的成员可以是 `private`、`protected`\
    \ 或 `public`。\n\n1995 年，Java——最成功的编程语言之一——诞生了。类是代码的基本单元，所有内容都应放在类中。在类中，`this`\
    \ 引用当前对象。\n\n让我们创建一个 `TodoStore` 类，它管理一个 `todos` 列表。`TodoStore` 类有一个私有列表和两个公有方法：`push()`\
    \ 和 `getBy()`。`Todo` 类定义了 `todo` 传输对象。这两个类随后在 `main()` 函数中使用。\n\n```\nimport java.util.List;\n\
    import java.util.ArrayList;\nimport java.util.stream.Collectors;\n\npublic class\
    \ TodoStore\n{\n  private List<Todo> list;\n\n  public TodoStore()\n  {\n    this.list\
    \ = new ArrayList<Todo>();\n  }\n\n  public void push(Todo todo)\n  {\n    list.add(todo);\n\
    \  }\n\n  public List<Todo> getBy(String text)\n  {\n    return list.stream()\n\
    \      .filter(todo -> todo.Title.contains(text))\n      .collect(Collectors.toList());\n\
    \  }\n}\n\npublic class Todo \n{\n  public Integer Id;\n  public String Title;\n\
    \n  public Todo(Integer id, String title) \n  {\n    this.Id = id;\n    this.Title\
    \ = title;\n  }\n}\n\npublic class StartApplication\n{\n  public static void main(String[]\
    \ args)\n  {\n    TodoStore todoStore = new TodoStore();\n\n    todoStore.push(new\
    \ Todo(1, \"find\"));\n    todoStore.push(new Todo(2, \"read\"));\n    todoStore.push(new\
    \ Todo(3, \"share\"));\n\n    List<Todo> filterTodos = todoStore.getBy(\"read\"\
    );\n    System.out.print(\"Count:\" + filterTodos.size());\n  }\n}\n```\n\n类带来了封装。\n\
    \n封装意味着信息隐藏。它旨在尽可能隐藏对象的内部部分，并暴露最小的公共接口。\n\n### 基于原型的面向对象编程\n\n1987 年，[Self 语言](https://en.wikipedia.org/wiki/Self_(programming_language))\
    \ 发布。它旨在通过用原型取代类来简化类继承。对象可以继承自其他对象。Self 是一种动态类型、基于原型的实验性语言。\n\n1995 年，JavaScript\
    \ 语言诞生。从某种意义上说，它将 Self 语言的原型模式思想与 [Scheme 语言](https://en.wikipedia.org/wiki/Scheme_(programming_language))\
    \ 的函数式模式结合在一起，并采用了类似 Java 的语法。\n\nJavaScript 中的 `class` 是使用自定义原型创建对象的语法糖。让我们用原型重新实现之前的\
    \ `TodoStore`：\n\n```\nclass TodoStore{\n  constructor(){\n    this.list = [];\n\
    \  }\n\n  push(todo){\n    this.list.push(todo);\n  }\n\n  getBy(text){\n    return\
    \ this.list\n               .filter(todo => todo.title.includes(text));\n  }\n\
    }\n\nclass Todo{\n  constructor(id, title){\n    this.id = id;\n    this.title\
    \ = title;\n  }\n}\n\n(function startApplication(){\n  const todoStore = new TodoStore();\n\
    \n  todoStore.push(new Todo(1, \"find\"));\n  todoStore.push(new Todo(2, \"read\"\
    ));\n  todoStore.push(new Todo(3, \"share\"));\n\n  const filterTodos = todoStore.getBy(\"\
    read\");\n  console.log(\"Count:\" + filterTodos.length);\n})();\n```\n\n原型系统比类更灵活，并且擅长节省内存，但事实证明它也有一些缺点：\n\
    \n*   没有封装。所有成员、数据和方法都是公有的。\n*   对象的公共接口是可变的。可以从外部更改它。\n*   需要管理 `this` 丢失上下文的问题。\n\
    \n### 函数式编程\n\nJavaScript 重新发现并将函数式编程范式带入了主流。\n\n函数式编程在解决我们的一些问题时表现更好。很明显，它更擅长让代码易于阅读和理解，也更擅长处理数据转换。\n\
    \n以函数式风格编程意味着使用函数式编程的概念，例如一等函数、闭包、高阶函数、偏应用、不可变性或纯函数。\n\n纯函数式编程是一种将所有函数视为纯函数的编程范式。\n\
    \n纯函数具有很多优点。它们更易于阅读、理解、测试、调试和组合。纯函数很棒，但我们不能只使用纯函数来编写一个实用的应用程序。\n\n### 基于闭包的面向对象编程\n\
    \nJavaScript 将闭包带入了主流。闭包可以封装状态。更进一步，我们可以创建多个共享相同私有状态的闭包。这样，我们就可以创建灵活、封装的对象。考虑\
    \ `TodoStore` 的下一个实现：\n\n```\nfunction TodoStore(){\n  const list = [];\n\n  function\
    \ push(todo){\n    list.push(todo);\n  }\n\n  function getBy(text){\n    return\
    \ list.filter(todo => todo.title.includes(text));\n  }\n\n  return Object.freeze({\n\
    \    push,\n    getBy\n  })\n}\n\nfunction Todo(id, title){\n  return Object.freeze({id,\
    \ title});\n}\n\n(function startApplication(){\n    const todoStore = TodoStore();\n\
    \n    todoStore.push(Todo(1, \"find\"));\n    todoStore.push(Todo(2, \"read\"\
    ));\n    todoStore.push(Todo(3, \"share\"));\n\n    const filterTodos = todoStore.getBy(\"\
    read\");\n    console.log(\"Count:\" + filterTodos.length);\n})();\n```\n\n以这种方式构建的对象具有一系列优点：\n\
    \n*   封装。只有暴露的方法才是公有的，其他一切都被隐藏。\n*   不可变的公共接口。\n*   没有与 `this` 相关的问题和复杂性。\n* \
    \  提倡组合优于继承。\n\nDouglas Crockford 率先提出了将应用程序中的对象一分为二的想法：\n\n*   数据对象：暴露数据，没有行为。数据对象是不可变的。在本例中，它们由\
    \ `Todo()` 函数创建。\n*   行为对象：暴露行为，隐藏数据。在本例中，只有一个对象，由 `TodoStore()` 函数创建。\n\n从另一个角度来看：\n\
    \n*   数据对象是原始类型或其他普通对象的不可变集合。\n*   行为对象是共享相同私有状态的闭包的不可变集合。\n\n### 最终思考\n\n面向对象编程、函数式编程、纯函数式编程都是我们可以用来构建更好应用程序的范式。\n\
    \n函数式编程在数据转换和使代码更易于理解方面表现更好。纯函数为我们的许多问题提供了解决方案，并有助于创建更易于阅读、理解、测试、调试和组合的代码。然而，函数式编程似乎并不能解决所有挑战。对象在封装副作用和管理状态方面似乎更胜一筹。\n\
    \n原型系统试图简化类继承，但事实证明它有自己的问题。它没有封装，而且 `this` 会导致上下文丢失的问题。不过，原型系统擅长节省内存，并且足够灵活，可以将基于类的对象转译为基于原型的对象。最终，原型系统在转译方面表现出色，使\
    \ JavaScript 成为一种目标编译语言。\n\nJavaScript 带来了另一种创建对象的方式，即作为闭包的集合。这种方式没有类，也没有原型。使用函数来构建封装对象更符合函数式编程风格。\n\
    \n在等待新的、更好的编程范式时，我们可以混合使用函数式编程和面向对象编程，试图兼得两者之长。\n\n# 接下来是什么？\n\n"
- fmt: '

    ![](Images/image00082.jpeg) In the [Functional Programming in JavaScript](https://www.amazon.com/dp/B08CZZ4FQQ)
    book you will find how to use JavaScript as a functional programming language
    by disabling the `this` keyword and enforcing immutable objects with a linter.
    You will learn how to use statements like `if` and `switch` in a functional way,
    or how to create and use functors and monads.


    ![](Images/image00083.jpeg) If you want to learn how to build modern React applications
    using functional components and functional programming principles, you can consider
    reading [Functional React, 2nd Edition](https://www.amazon.com/dp/B088FZQ1XN).


    ![](Images/image00084.jpeg) Continue your learning path with [Functional Architecture
    with React and Redux](https://www.amazon.com/dp/B0846NRJYR/ref=cm_sw_em_r_mt_dp_U_pztUEbV10W9GY)
    and use React and Redux to build several applications with an incremental level
    of complexity.


    The functional architecture implies getting the initial state, showing it to the
    user using the view functions, listening for actions, updating the state based
    on those actions, and rendering the updated state back to the user again.


    ![](Images/image00085.jpeg) The [Microblog React Project](https://www.amazon.com/dp/B08MD3DFY8)
    book takes a project-based learning approach by engaging you in building a practical
    application. The reader will learn things on the way by developing different parts
    of this project. The Microblog application will be built using React with Hooks
    and libraries like Redux, Redux Thunk, Redux Toolkit, Material UI, or Axios.


    ![](Images/image00086.jpeg) The [UI State Management](https://www.amazon.com/dp/B08X21JRTL)
    book gives you an overview of how state is managed by building a note-taking application
    with four different libraries. We start from an object-oriented approach using
    Svelte, centralize state with Vuex, then move to a functional approach with React
    and Redux, and in the end arrive at a solution using only pure functions with
    Elm.


    ![](Images/image00087.jpeg) The Composition API provides a new way of managing
    reactivity. It is made of a set of Reactive API functions plus the facility to
    register lifecycle hooks. Understand better the reactivity system by building
    one from scratch and then implement a master-details functionality. Check how
    to manage state using the Composition API and then use it to implement a central
    store similar to Vuex.


    Enjoy the learning journey!

    '
