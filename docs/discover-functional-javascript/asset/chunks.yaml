  trans: "\n\n### 使用 Promise 链式调用进行组合\n\n当我们使用 Promise 链式调用时，我们实际上是在进行函数组合。一个函数的结果作为下一个函数的输入。请看下面的示例：\n\
    \n```\nfunction fetchBooks() {\n  return new Promise(function(resolve, reject)\
    \ {\n    resolve(books);\n  });\n}\n\nfunction handleError(error) { \n  console.error(error);\
    \ \n}\n\nfetchBooks()\n  .then(filterBooks)\n  .then(createListHtml)\n  .then(renderHtml)\n\
    \  .catch(handleError);\n```\n\n### 最终思考\n\n函数组合是将一个函数应用于另一个函数结果的过程。通过函数组合，我们消除了中间变量。\n\
    \n管道使数据转换更具表现力。\n\n# 第 10 章：意图揭示性命名\n\n> 选择好的名称需要时间，但节省的时间比花费的更多。所以请谨慎对待你的命名，并在找到更好的名称时进行更改。每个阅读你代码的人（包括你自己）都会因此更开心。\n\
    \n> 变量、函数等的名称应该回答所有重大问题。它应该告诉你它为什么存在、它做什么以及如何使用。如果一个名称需要注释，那么这个名称就没有揭示其意图。—— Tim\
    \ Ottinger 在《[Clean Code](https://www.amazon.com/Clean-Code-Handbook-Software-Craftsmanship/dp/0132350882)》中\n\
    \n函数名称在可读性中扮演着非常重要的角色，因为我们可以轻松阅读和理解有意义的词语。函数名称是我们表达一段代码意图的工具。\n\n### 重构匿名函数\n\n\
    函数可以有名称，也可以没有名称。箭头语法通常创建匿名函数。考虑以下使用匿名箭头函数编写的代码：\n\n```\nconst books = [\n  {title:\"\
    How JavaScript works\",type:\"T\"},\n  {title:\"Square and tower\",type:\"H\"\
    },\n  {title:\"Functional-Light JavaScript\",type:\"T\"}\n];\n\nconst newBooks\
    \ = books\n .filter(book => book.type === \"T\")\n .sort((book1, book2) => {\n\
    \   if(book1.title < book2.title) return -1;\n   if(book1.title > book2.title)\
    \ return 1;\n   return 0;\n });\n\n//[{title:\"Functional-Light JavaScript\",type:\"\
    T\"}, \n// {title:\"How JavaScript works\",type:\"T\"}];\n```\n\n现在看看重构为具有意图揭示性名称的纯函数后的相同逻辑：\n\
    \n```\nfunction isTechnology(book){\n   return book.type === \"T\";\n}\n\nfunction\
    \ ascByTitle(book1, book2){\n  if(book1.title<book2.title) return -1;\n  if(book1.title>book2.title)\
    \ return 1;\n  return 0;\n}\n\nconst newBooks = books\n                .filter(isTechnology)\n\
    \                .sort(ascByTitle);\n```\n\n有了好的函数名称，我们可以更快地阅读代码。我们可以读取函数名称并理解其用途，无需分析其代码。\n\
    \n让我们看一个使用匿名函数编写的事件处理程序。\n\n```\n$(\"#first\").click(() => {\n  const list = getItemsFromList();\n\
    \  const filteredList = list.slice(0,1);\n  renderList(filteredList);\n});\n```\n\
    \n下面是重构为具有清晰名称的函数后的代码：\n\n```\n$(\"#first\").click(renderFirstItem);\n\nfunction\
    \ renderFirstItem(){\n  const list = getItemsFromList();\n  const filteredList\
    \ = list.slice(0,1);\n  renderList(filteredList);\n}\n```\n\n我建议使用能够表达函数用途并为现有代码增加价值的名称。例如，像\
    \ `onClick()` 或 `myCustomClickEvent()` 这样的名称表达的是函数在哪里被使用，而不是它做什么。同一个函数完全可以处理其他事件或在其他地方被调用。\n\
    \n### 命名函数表达式\n\n接下来，我们将看看如何通过命名函数表达式来提高可读性。\n\n我将夸大情况，使用三个匿名的 IIFE：\n\n```\n\
    (() => {\n    /*code*/\n    (() => {\n        /*code*/\n        (() => {\n   \
    \         /*code*/\n        })();  \n    })();\n})();\n```\n\n匿名函数在调用栈中显示为 `(anonymous)`。\n\
    \n![](img/image00080.gif \"调用栈中的匿名函数表达式\")\n\n让我们用命名函数表达式重写代码：\n\n```\n(function\
    \ createTodoModule(){\n  /*code*/\n  (function getAllTodos(){\n    /*code*/\n\
    \    (function renderTodo(){\n      /*code*/\n    })();  \n  })();\n})();\n```\n\
    \n这次，调用栈更容易理解。\n\n![](img/image00081.gif \"调用栈中的命名函数表达式\")\n\n`createTodoModule()`、`getAllTodos()`\
    \ 和 `renderTodo()` 是命名函数表达式。\n\n### 箭头函数的命名\n\n我认为在逻辑较少的场景中，命名可以提高可读性。以计算数组总和为例。\n\
    \n```\n//使用匿名函数\nconst total = numbers.reduce((a, b) => a + b, 0);\n\n//使用命名函数\n\
    function sum(a, b) { return a + b; }\nconst total = numbers.reduce(sum, 0);\n\
    ```\n\n`sum()` 函数可以用箭头语法编写。在这种情况下，箭头函数会推断变量的名称。\n\n```\nconst sum = (a, b) =>\
    \ a + b;\nconst total = numbers.reduce(sum, 0);\n```\n\n### 简单代码\n\n有些情况下代码非常简短，创建一个命名函数并不会增加价值。在这种情况下，我们可以使用匿名函数，直到代码变得复杂。考虑以下代码：\n\
    \n```\nconst books = [\n  {title:\"How JavaScript works\",type:\"T\"},\n  {title:\"\
    Square and tower\",type:\"H\"},\n  {title:\"Functional-Light JavaScript\",type:\"\
    T\"}\n];\n\nconst titles = books.map(book => book.title);\n//[\"How JavaScript\
    \ works\", \"Square and tower\", \n// \"Functional-Light JavaScript\"]\n```\n\n\
    另一种选择是使用像 `prop()` 这样的通用工具函数：\n\n```\nimport prop from \"lodash/property\";\n\n\
    const titles = books.map(prop(\"title\"));\n```\n\n### 箭头函数 vs `function`\n\n\
    代码更少并不一定意味着可读性更高。下一个示例展示了定义 `prop()` 函数的两种方式。我更喜欢使用 `function` 关键字的方式，因为我认为它更清楚地表达了函数的作用。\n\
    \n`prop()` 接受一个属性名称，并返回一个函数，该函数接受一个对象并返回该对象的属性。\n\n```\n//使用箭头函数\nconst prop =\
    \ key => obj => obj[key];\n\n//使用 function 关键字\nfunction prop(key){\n   return\
    \ function(obj){\n      return obj[key];\n   }\n}\n```\n\n### 最终思考\n\n意图揭示性函数名称提高了可读性，并提供了更好的调试体验。\n\
    \n我建议在名称能为现有代码增加价值时，重构为命名函数。\n\n# 第 11 章：让代码更易读\n\n> 我深信不疑，代码更重要的角色是作为与其他人类沟通的手段。\n\
    \n> 据广泛估计，开发人员将 70% 的代码维护时间花在阅读和理解代码上。—— Kyle Simpson，《[Functional-Light JavaScript](https://www.amazon.com/Functional-Light-JavaScript-Pragmatic-Balanced-FP-ebook/dp/)》作者\n\
    \n开发人员更容易理解带有意图揭示性名称的小段代码。如果函数是纯函数，理解起来会更简单。\n\n让我们看看如何通过函数式编程技术提高代码可读性。\n\n###\
    \ 使用 filter 和 map 重构\n\n我将以待办事项集合为例：\n\n```\nconst todos = [\n  { \n    id : 1,\n\
    \    type : \"NC\",\n    desc : \"task1\",\n    user : { id: 1, name: \"user1\"\
    },\n    completed : false\n  },\n  { \n    id : 2,\n    type : \"RE\",\n    desc\
    \ : \"task2\",\n    user : { id: 2, name: \"user2\"},\n    completed : false\n\
    \  }\n];\n```\n\n下面是过滤待办事项并创建具有 `userName` 属性的新对象的命令式代码。\n\n```\nlet filteredTodos\
    \ = [];\nfor(let i=0; i<todos.length; i++){\n  let todo = todos[i];\n  if (todo.type\
    \ === \"RE\" && !todo.completed) {\n    filteredTodos.push({...todo,userName:\
    \ todo.user.name});\n  }\n}\n\nconsole.log(filteredTodos);\n//[{ \n// completed:\
    \ false,\n// desc: \"task2\",\n// id: 2,\n// type: \"RE\",\n// user: {id: 2, name:\
    \ \"user2\"},\n// userName: \"user2\" \n//}]\n```\n\n重构为函数式风格，使用了 `filter()` 和\
    \ `map()` 函数。\n\n```\nconst filteredTodos = todos\n .filter(todo => (todo.type\
    \ === \"RE\" && !todo.completed))\n .map(todo => ({ ...todo, userName: todo.user.name\
    \ }));\n```\n\n"
- fmt: "\n> Chaining is a technique used to simplify code where multiple methods are\
    \ applied to an object one after another.\n\n`map()` and `filter()` are chained.\n\
    \nWe can improve the code further by extracting out the anonymous callbacks and\
    \ give them intention revealing names. See the code below:\n\n```\nfunction isPriorityTodo(todo){\n\
    \   return todo.type === \"RE\" && !todo.completed;\n}\n\nfunction toTodoView(todo)\
    \ {\n   return { ...todo, userName: todo.user.name };\n}\n\nconst filteredTodos\
    \ = todos\n .filter(todo => isPriorityTodo(todo))\n .map(todo => toTodoView(todo));\n\
    ```\n\n`isPriorityTodo()` and `toTodoView()` are pure functions with intention\
    \ revealing names.\n\n### Point-free style\n\n> Point-free is a technique that\
    \ improves readability by eliminating the unnecessary arguments.\n\nConsider the\
    \ previous code:\n\n```\nconst filteredTodos = todos\n .filter(todo => isPriorityTodo(todo))\n\
    \ .map(todo => toTodoView(todo));\n```\n\nHere is the code after eliminating the\
    \ unnecessary arguments:\n\n```\nconst filteredTodos = todos\n  .filter(isPriorityTodo)\n\
    \  .map(toTodoView);\n```\n\nThe point-free style can improve readability in specific\
    \ places.\n\nThere is no `function` keyword, no arrow syntax in a point-free style.\
    \ That means we use another function to create the function we need. All we see\
    \ in a point-free style are function names.\n\n### Refactoring with reduce\n\n\
    Let’s take the case of a shopping list:\n\n```\nconst shoppingList = [\n   {name:\
    \ \"orange\", quantity: 2, price: 10, type: \"FRT\"},\n   {name: \"lemon\", quantity:\
    \ 1, price: 15, type: \"FRT\"},\n   {name: \"fish\", quantity: 0.5, price: 30,\
    \ type: \"MET\"}\n];\n```\n\nBelow is the imperative code computing the total\
    \ price and the price for fruits:\n\n```\nlet totalPrice = 0, fruitsPrice = 0;\n\
    for(let i=0; i<shoppingList.length; i++){\n   let line = shoppingList[i];\n  \
    \ totalPrice += line.quantity * line.price;\n   if (line.type === \"FRT\") {\n\
    \       fruitsPrice += line.quantity * line.price;\n   }\n}\n\nconsole.log(totalPrice);\n\
    //50\nconsole.log(fruitsPrice);\n//35\n```\n\nTaking the functional approach,\
    \ in this case, will require the use of `reduce()` to compute the total price.\n\
    \n> `reduce()` reduces a list of values to one value\n\nAs we did before, we refactor\
    \ the code using pure functions with intention revealing names, pure array methods,\
    \ and a point-free style:\n\n```\nfunction addPrice(totalPrice, line){\n   return\
    \ totalPrice + (line.quantity * line.price);\n}\n\nfunction areFruits(line){\n\
    \   return line.type === \"FRT\";\n}\n\nlet totalPrice = shoppingList.reduce(addPrice,\
    \ 0);\nlet fruitsPrice = shoppingList\n              .filter(areFruits)\n    \
    \          .reduce(addPrice, 0);\n```\n\n### Decomposition\n\nOur natural way\
    \ of dealing with a problem is to break it into smaller pieces and then put everything\
    \ back together.\n\nOur aim should be to create small pure functions with intention\
    \ revealing names and then compose them back together.\n\nNaming these small functions\
    \ requires time, but if is done well, it will make the code easier to read.\n\n\
    There will be two kinds of functions:\n\n*   Functions doing one task\n\n*   Functions\
    \ coordinating a lot of tasks. Here we can use a point-free style to make code\
    \ easier to read.\n\n### Final thoughts\n\nWorking with collections in a functional\
    \ style breaks the data transformations in steps like filter, map, reduce, or\
    \ sort. At the same time, it requires to define small pure functions to support\
    \ those transformations.\n\nThe point-free style improves code clarity and readability.\n\
    \nFunctional programming together with the practice of giving intention revealing\
    \ names greatly improves code readability.\n\n# Chapter 12: Asynchronous programming\n\
    \nIn a sense, there are two kinds of functions: synchronous and asynchronous.\n\
    \n> A synchronous function returns only after the operation is finished.\n\n>\
    \ An asynchronous function starts the operation and returns immediately. The operation\
    \ may finish somewhere in the future.\n\nIn a console application, a command like\
    \ `Console.ReadKey()` blocks the program until a character is pressed. This kind\
    \ of approach may work for a console application where you cannot do anything\
    \ else anyway, but it doesn’t work for a web application.\n\nSynchronous code\
    \ is easy to reason about, but there are situations where we need to do things\
    \ without blocking the interface. Looking from this perspective:\n\n> Synchronous\
    \ code is blocking.\n\n> Asynchronous code is not blocking.\n\nWe need a way to\
    \ listen for user interactions or to get data from Web APIs without blocking the\
    \ interface. This is the role of the asynchronous programming model.\n\n### Blocking\
    \ vs not blocking\n\nThe sequential model blocks the program for input/output\
    \ or for any long-running process. The asynchronous model doesn’t block. Consider\
    \ the next code:\n\n```\nfunction block(duration){\n  const starTime = Date.now();\n\
    \  while (Date.now() < starTime + duration) {}\n}\n\nfunction logMessage(){\n\
    \  console.log(\"process ended\");\n}\n\nblock(5000);\nlogMessage();\n```\n\n\
    This is an example of a blocking code. It blocks everything for 5s and then executes\
    \ the `logMessage()` function. When the application is blocked, it is unresponsive.\n\
    \nLet’s see how to display a message, after an interval, without blocking.\n\n\
    ```\nfunction logMessage(){\n  console.log(\"process ended\");\n}\n\nfunction\
    \ delay(duration, callback){\n  setTimeout(callback, duration);\n}\n\ndelay(5000,\
    \ logMessage);\n```\n\nThis time the application is not blocked. After 5s the\
    \ message is displayed.\n\nAn asynchronous function returns immediately because\
    \ it just starts the work to be done. It doesn’t wait for it to finish.\n\nThe\
    \ most common asynchronous tasks are user events, network calls, timing events.\n\
    \n### Callbacks\n\nCallbacks offer a simple way to run code when asynchronous\
    \ operations are completed.\n\n> A callback is a function passed as an argument\
    \ to another function.\n\nThe most common scenarios where callbacks are used for\
    \ asynchronous tasks are events.\n\n#### DOM events\n\nUser interactions may result\
    \ in many events like `click`, `focus`, `blur`, `keypress`. Listening to these\
    \ events doesn’t block the interface.\n\nLook at the next examples using callbacks\
    \ to handle DOM events with [jQuery](https://jquery.com/):\n\n```\nfunction doSomething(){\
    \ }\n\n$(\"#btn\").on(\"click\", doSomething);\n$(\"#input\").on(\"keypress\"\
    , doSomething);\n```\n\nHere is another example with [React](https://reactjs.org/):\n\
    \n```\nimport React from \"react\";\n\nfunction TodoItem({ todo, onRemoveClick\
    \ }) {\n  return (\n    <div>\n      <div>{todo.title}</div>\n      <div>\n  \
    \    <button onClick={onRemoveClick}>\n        Delete\n      </button>\n     \
    \ </div>\n    </div>\n  );\n}\n```\n\n#### Timing events\n\nThere are two functions\
    \ for executing code at specified time intervals.\n\n`setTimeout`: executes a\
    \ callback once after an interval. It can be canceled with `clearTimeout()`.\n\
    \n`setInterval`: executes a callback at a specific interval. It runs until the\
    \ `clearInterval` function is called.\n\n```\nsetInterval(doSomething, 5000);\n\
    ```\n\n#### Nested callbacks\n\nCallbacks are great for simple tasks like event\
    \ handling, but they are hard to combine. Consider `fetchUsers()`, `fetchPosts()`,\
    \ `fetchComments()` as being able to do network calls and accept a callback to\
    \ execute when the operation is completed.\n\n```\nfetchUsers(function(users)\
    \ {\n  fetchPosts(function(dictionaries) {\n    fetchComments(function(todos)\
    \ {\n      console.log(users);\n      console.log(dictionaries);\n      console.log(todos);\n\
    \    });\n  });\n});\n```\n\nWhat about starting all network calls at the same\
    \ time and then do something? It is possible with callbacks, but it is harder\
    \ and can make code more complicated than necessary.\n\n### Promises\n\nPromises\
    \ offer a better option for composing asynchronous tasks.\n\n> A promise is an\
    \ object that represents a possible future result of an asynchronous operation.\n\
    \nPromises can be given to some other parts of the code before knowing the result.\n\
    \n#### Network calls\n\nPromises are commonly used to handle network calls. The\
    \ application is not blocked while waiting for the Web API response. Even more,\
    \ the network calls can run in parallel.\n"
