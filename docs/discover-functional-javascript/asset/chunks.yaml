  trans: "\n\n    *   `async/await`\n    *   事件循环\n    *   Web Workers\n    *   最终思考\n\
    *   第 13 章：带原型的对象\n    *   属性键\n    *   属性值\n    *   原型\n    *   `Map`\n    *\
    \   对象字面量\n    *   `Object.create()`\n    *   函数构造函数\n    *   `Class`\n    * \
    \  无隐私\n    *   最终思考\n*   第 14 章：带闭包的对象\n    *   工厂函数\n    *   封装\n    *   不可变的公共接口\n\
    \    *   无`this`\n    *   定时器\n    *   栈\n    *   队列\n    *   事件发射器\n    *   内存\n\
    \    *   组合优于继承\n    *   最终思考\n*   第 15 章：方法装饰器\n    *   记录持续时间\n    *   授权\n\
    \    *   装饰器组合\n    *   装饰器顺序\n    *   装饰所有对象的方法\n    *   使用纯函数的存储\n    *   最终思考\n\
    *   第 16 章：等待新的编程范式\n    *   基于类的面向对象编程\n    *   基于原型的面向对象编程\n    *   函数式编程\n\
    \    *   基于闭包的面向对象编程\n    *   最终思考\n*   接下来是什么？\n\n# 前言\n\nJavaScript 已经成为最重要的编程语言之一。从许多角度来看，它都很重要：\n\
    \n*   它易于学习。这门语言的美妙之处在于它的简洁性。\n*   它是第一门将函数式编程带入主流的语言。\n*   它提供了一种无需类和原型即可进行面向对象编程的新方式。\n\
    \nJavaScript 作为浏览器语言而广受欢迎。同时，它也是一种强大且富有表现力的编程语言。\n\n这是一本为渴望在 JavaScript 中打下函数式编程基础，并希望学习构建封装对象新方法的开发者而写的书。\n\
    \n#### 在线代码示例\n\n本书中的许多代码示例（并非全部）可在 [`github.com/cristi-salcescu/discover-functional-javascript`](https://github.com/cristi-salcescu/discover-functional-javascript)\
    \ 找到。我鼓励你自己编写代码。写作是另一种学习形式，在大多数情况下，你最理解的代码是你自己写的代码。\n\n#### 反馈\n\n我很乐意听到你的反馈。如有关于本书的评论、问题或建议，请发送电子邮件至\
    \ cristisalcescu@gmail.com。提前感谢你考虑为本书撰写评论。\n\n# 第 1 章：JavaScript 简要概述\n\nJavaScript\
    \ 有原始值、对象和函数。它们都是值。所有值都被视为对象，即使是原始值也是如此。\n\n### 原始值\n\n数字、布尔值、字符串、`undefined`\
    \ 和 `null` 是原始值。\n\n#### 数字\n\n目前 JavaScript 中只有一种数字类型，即 64 位二进制浮点数。十进制数的算术是不精确的。你可能已经知道，`0.1\
    \ + 0.2` 不等于 `0.3`。但对于整数，算术是精确的，所以 `1 + 2 === 3`。\n\n数字继承自 `Number.prototype`\
    \ 对象的方法。可以在数字上调用方法：\n\n```\n(123).toString();  //\"123\"\n(1.23).toFixed(1); //\"\
    1.2\"\n```\n\n有一些函数用于将字符串转换为数字：\n\n`Number.parseInt()`、`Number.parseFloat()` 和\
    \ `Number()`。\n\n```\nNumber.parseInt(\"1\");       //1\nNumber.parseInt(\"text\"\
    );    //NaN\nNumber.parseFloat(\"1.234\"); //1.234\nNumber(\"1\");           \
    \     //1\nNumber(\"1.234\");            //1.234\n```\n\n无效的算术运算或无效的转换不会抛出异常，而是产生\
    \ `NaN`（“非数字”）值。`isNaN()` 可以检测 `NaN`。\n\n#### 字符串\n\n字符串存储一系列 Unicode 字符。文本可以放在双引号\
    \ `\"\"` 或单引号 `''` 内。\n\n字符串继承自 `String.prototype` 的方法。它们有诸如 `substring()`、`indexOf()`\
    \ 或 `concat()` 等方法。\n\n```\n\"text\".substring(1,3); //\"ex\"\n\"text\".indexOf('x');\
    \   //2\n\"text\".concat(\" end\"); //\"text end\"\n```\n\n字符串和所有原始值一样，是不可变的。例如，`concat()`\
    \ 不会修改现有字符串，而是创建一个新字符串。\n\n`+` 运算符可以用于加法或拼接：\n\n```\n1 + 1      //2\n\"1\" + \"\
    1\"  //\"11\"\n1 + \"1\"    //\"11\"\n```\n\n#### 布尔值\n\n布尔值有两个值：`true` 和 `false`。\n\
    \n该语言有真值和假值。`false`、`null`、`undefined`、`''`（空字符串）、`0` 和 `NaN` 是假值。所有其他值都是真值。\n\
    \n真值在布尔上下文中执行时会被求值为 `true`。假值会被求值为 `false`。下一个示例显示了 `false` 分支。\n\n```\nif('')\
    \ {\n  console.log(\"true\");\n} else {\n  console.log(\"false\");\n}\n```\n\n\
    相等运算符是 `===`。不等运算符是 `!==`。\n\n### 变量\n\n变量可以使用 `var`、`let` 和 `const` 定义。\n\n`var`\
    \ 声明并可选地初始化一个变量。用 `var` 声明的变量具有函数作用域。它们被视为在函数顶部声明。这称为变量提升。\n\n`let` 和 `const`\
    \ 声明具有块级作用域。用 `const` 声明的变量不能被重新赋值。\n\n未初始化的变量的值是 `undefined`。\n\n### 对象\n\n对象是属性的动态集合。\n\
    \n属性有一个键和一个值。属性键是唯一的字符串。属性值可以是原始值、对象或函数。\n\n创建对象的最简单方法是使用对象字面量：\n\n```\nlet obj\
    \ = {\n  message: \"read me\",\n  doSomething: function() {}\n};\n```\n\n有两种访问属性的方式：点表示法和方括号表示法。对象的属性可以被读取、添加、编辑或删除。\n\
    \n```\nlet obj = {};\nobj.message = \"read me\"; //添加\nobj.message = \"enjoy\"\
    ; //编辑\ndelete obj.message; //删除\n```\n\n所有对象的属性都是公开的。\n\n#### 原始值与对象\n\n原始值（除了\
    \ `null` 和 `undefined`）在拥有方法的意义上被视为对象，但它们不是对象。\n\n数字、字符串和布尔值有对应的包装对象。这些包装对象由 `Number`、`String`\
    \ 和 `Boolean` 函数构建。\n\n为了允许访问原始值上的属性，JavaScript 会创建一个包装对象，然后销毁它。创建和销毁包装对象的过程由\
    \ JavaScript 引擎优化。\n\n### 数组\n\n数组是值的索引集合。每个值都是一个元素。元素按顺序排列，并通过其索引号访问。\n\n"
- fmt: "\nJavaScript has array-like objects. Arrays are implemented using objects.\
    \ Indexes are converted to strings and used as keys for retrieving values.\n\n\
    A simple array like `let arr = ['A', 'B', 'C']` is emulated using an object similar\
    \ to the one below:\n\n```\n{\n  '0': 'A',\n  '1': 'B',\n  '2': 'C'\n}\n```\n\n\
    Note that `arr[1]` gives the same value as `arr['1']`:\n\n```\narr[1] === arr['1'];\
    \ //true\n```\n\nRemoving values from an array with `delete` will leave holes.\
    \ `splice()` can be used to avoid the problem, but it can be slow.\n\n```\nlet\
    \ arr = ['A', 'B', 'C'];\ndelete arr[1];\nconsole.log(arr); //['A', empty, 'C']\n\
    console.log(arr.length); //3\n```\n\nJavaScript’s arrays don’t throw “index out\
    \ of range” exceptions. If the index is not available, they return `undefined`.\n\
    \nStacks and queues can be easily implemented using array methods:\n\n```\nlet\
    \ stack = [];\nstack.push(1);           //[1]\nstack.push(2);           //[1,\
    \ 2]\nlet last = stack.pop();  //[1]\nconsole.log(last);       //2\n\nlet queue\
    \ = [];\nqueue.push(1);           //[1]\nqueue.push(2);           //[1, 2]\nlet\
    \ first = queue.shift();//[2]\nconsole.log(first);      //1\n```\n\n### Functions\n\
    \nFunctions are independent units of behavior. There are three ways to define\
    \ a function:\n\n*   Function declaration (aka function statement)\n\n*   Function\
    \ expression (aka function literal)\n\n*   Arrow function\n\n#### The function\
    \ declaration\n\n```\nfunction doSomething(){ }\n```\n\n*   `function` is the\
    \ first keyword on the line.\n\n*   It must have a name.\n\n*   It can be used\
    \ before definition. Function declarations are moved, or “hoisted”, to the top\
    \ of their scope.\n\n#### The function expression\n\n```\nlet doSomething = function()\
    \ { }\n```\n\n*   `function` is not the first keyword on the line.\n\n*   The\
    \ name is optional. There can be anonymous function expressions or named function\
    \ expressions.\n\n*   It needs to be defined, then it can execute.\n\n*   It can\
    \ auto-execute after definition. It is called IIFE, Immediately Invoked Function\
    \ Expression. It is also known as a self-executing function.\n\nHere is an example\
    \ of an IIFE:\n\n```\n(function autorun(){\n  console.log(\"executed\");\n})();\n\
    //\"executed\"\n```\n\n#### Arrow function\n\nThe arrow function is a sugar syntax\
    \ for creating an anonymous function expression.\n\n```\nlet doSomething = ()\
    \ => { };\n```\n\n#### Function invocation\n\nFunctions can be invoked in different\
    \ ways:\n\n```\n//as functions\ndoSomething(arguments);\n\n//as methods\ntheObject.doSomething(arguments);\n\
    \n//as constructors\nnew Constructor(arguments)\n\n//with apply() or call()\n\
    doSomething.apply(theObject, [arguments]);\ndoSomething.call(theObject, arguments);\n\
    ```\n\nFunctions can be invoked with more or fewer arguments than declared in\
    \ the definition. The extra arguments will be ignored, and the missing arguments\
    \ will be set to `undefined`.\n\nFunctions, except arrow functions, have two pseudo-parameters:\
    \ `this` and `arguments`.\n\n#### this\n\nMethods are functions that are stored\
    \ in objects. In order for a function to know which object to work on, `this`\
    \ is used. `this` represents the function’s context.\n\nWhen functions are used\
    \ as methods, `this` represents the object.\n\n```\nlet theObject = {\n  name:\
    \ \"name\",\n  getName: function(){\n    return this.name;\n  }\n}\n\ntheObject.getName();\
    \ //\"name\"\n```\n\nWhen a function is used as a constructor `new Constructor()`,\
    \ `this` represents the newly created object. Arrow functions can’t be used as\
    \ constructors.\n\nFunctions are objects, as a result, functions can have methods.\
    \ The `apply()` and `call()` methods execute the function with a given `this`.\
    \ `call()` provides the arguments individually, while `apply()` accepts an array\
    \ with all arguments.\n\n```\nlet otherObject = {\n  name: \"otherName\"\n}\n\n\
    function getName(){\n  return this.name;\n}\n\ngetName.apply(otherObject); //\"\
    otherName\"\ngetName.call(otherObject);  //\"otherName\"\n```\n\nThere is no point\
    \ to use `this` when a function is invoked with the function form. In that case,\
    \ `this` is `undefined` or is the `window` object, depending if strict mode is\
    \ enabled or not. Consider the next example:\n\n```\n\"use strict\";\nfunction\
    \ getName(){\n  return this.name;\n}\n\ngetName(); \n//Cannot read property 'name'\
    \ of undefined\n```\n\nThe value of `this` depends on how the function is invoked,\
    \ not where the function is defined. This is, of course, a source of confusion.\n\
    \n#### arguments\n\nThe `arguments` pseudo-parameter gives all the arguments used\
    \ at invocation. It is an array-like object, but not an array. It lacks the array\
    \ methods.\n\n```\nfunction logAll(){\n  console.log(arguments);\n}\n\nlogAll(\"\
    msg1\", \"msg2\", \"msg3\");\n//Arguments(3)[\"msg1\",\"msg2\",\"msg3\"]\n```\n\
    \n#### return\n\n`return` stops the function execution and returns the result.\
    \ When it returns no value or there is no `return` at all, the function still\
    \ returns `undefined`.\n\nThe automatic semi-colon insertion may create problems\
    \ when using `return`. The following function will not return an empty object,\
    \ but rather `undefined`.\n\n```\nfunction getObject(){ \n  return \n  {\n  }\n\
    }\n\ngetObject();\n```\n\nCurly brackets should be opened `{` on the same line\
    \ as `return`.\n\n### Dynamic typing\n\nJavaScript has dynamic typing. Values\
    \ have types but variables are not associated with a type. Any variable, parameter,\
    \ property can be assigned and re-assigned values of any type.\n\n```\nfunction\
    \ log(value){\n  console.log(value);\n}\n\nlog(1);\nlog(\"text\");\nlog({message:\
    \ \"text\"});\n```\n\nThe `typeof()` operator can check the type of a variable.\n\
    \n```\nlet n = 1;\ntypeof(n);   //\"number\"\n\nlet s = \"text\";\ntypeof(s);\
    \   //\"string\"\n\nlet fn = function() {};\ntypeof(fn);  //\"function\"\n```\n\
    \nDynamic typing offers higher flexibility.\n\n### Exceptions\n\nJavaScript has\
    \ an exception handling mechanism. It works like you may expect, by wrapping the\
    \ code using the `try/catch` statement. The statement has a single `catch` block\
    \ that handles all exceptions.\n\nYou can `throw` values of any type, but it is\
    \ common to throw error objects.\n\nIt is good to know that JavaScript sometimes\
    \ has a preference for silent errors. Strict mode eliminates some of JavaScript\
    \ silent errors.\n\n### Final thoughts\n\nPrimitives are not objects but JavaScript\
    \ allows accessing properties on them as if they were objects.\n\nObjects are\
    \ dynamic collections of key-value pairs.\n\nArrays are indexed collections of\
    \ values.\n\nFunctions are independent units and can be invoked in different ways.\n\
    \nPrimitives, objects, and functions are all values.\n\n# Chapter 2: New features\
    \ in ES6+\n\nES6+ brings new features to the language. Some new syntax allows\
    \ you to write code in a more expressive way, some features complete the functional\
    \ programming toolbox, and some features are questionable.\n\n### let and const\n\
    \nThere are now two ways for declaring a variable, `let` and `const`, plus one\
    \ that is becoming obsolete, `var`.\n\n#### let\n\n`let` declares and optionally\
    \ initializes a variable in the current scope. The current scope can be either\
    \ a module, a function, or a block.\n\nThe scope defines the lifetime and visibility\
    \ of a variable. Variables are not visible outside the scope in which they are\
    \ declared.\n\nConsider the next code that emphasizes the `let` block scope:\n\
    \n```\nlet x = 1;\n{ \n  let x = 2;\n}\nconsole.log(x); //1\n```\n\nIn contrast,\
    \ the `var` declaration had no block scope:\n\n```\nvar x = 1;\n{ \n  var x =\
    \ 2;\n}\nconsole.log(x); //2\n```\n\n#### const\n\n`const` declares a variable\
    \ that cannot be reassigned. It becomes a constant only when the assigned value\
    \ is immutable.\n\n```\nconst x = 1;\n\nx = 2;\n//TypeError: Assignment to constant\
    \ variable.\n```\n\nAn immutable value is a value that, once created, cannot be\
    \ changed. Primitive values are immutable, objects are mutable.\n\n```\nconst\
    \ obj = {\n  message: \"Hi\",\n};\n\nobj = {\n  message: \"Hello\",\n};\n//TypeError:\
    \ Assignment to constant variable.\n\nobj.message = \"Hello\";\nconsole.log(obj);\n\
    // { message: \"Hello\" }\n```\n\nThe initialization of the `const` variable is\
    \ mandatory.\n\n### Modules\n"
