  trans: '


    ![](img/image00082.jpeg) 在《[JavaScript 函数式编程](https://www.amazon.com/dp/B08CZZ4FQQ)》一书中，你将了解如何通过禁用
    `this` 关键字并使用 linter 强制不可变对象，将 JavaScript 用作函数式编程语言。你将学习如何以函数式方式使用 `if` 和 `switch`
    等语句，以及如何创建和使用函子与单子。


    ![](img/image00083.jpeg) 如果你想学习如何使用函数式组件和函数式编程原则构建现代 React 应用，可以考虑阅读《[函数式 React（第
    2 版）](https://www.amazon.com/dp/B088FZQ1XN)》。


    ![](img/image00084.jpeg) 继续你的学习之旅，阅读《[使用 React 和 Redux 的函数式架构](https://www.amazon.com/dp/B0846NRJYR/ref=cm_sw_em_r_mt_dp_U_pztUEbV10W9GY)》，利用
    React 和 Redux 构建多个复杂度递增的应用。


    函数式架构意味着获取初始状态，通过视图函数将其展示给用户，监听动作，基于这些动作更新状态，然后将更新后的状态再次渲染给用户。


    ![](img/image00085.jpeg) 《[微博客 React 项目](https://www.amazon.com/dp/B08MD3DFY8)》一书采用基于项目的学习方法，让你参与构建一个实际应用。读者将在开发该项目不同部分的过程中学习知识。微博客应用将使用
    React 结合 Hooks 以及 Redux、Redux Thunk、Redux Toolkit、Material UI 或 Axios 等库来构建。


    ![](img/image00086.jpeg) 《[UI 状态管理](https://www.amazon.com/dp/B08X21JRTL)》一书通过使用四种不同的库构建一个笔记应用，概述了状态管理的方式。我们从使用
    Svelte 的面向对象方法开始，用 Vuex 集中管理状态，然后转向使用 React 和 Redux 的函数式方法，最后使用 Elm 仅通过纯函数实现解决方案。


    ![](img/image00087.jpeg) Composition API 提供了一种管理响应式的新方式。它由一组响应式 API 函数以及注册生命周期钩子的功能组成。通过从零开始构建一个响应式系统来更好地理解它，然后实现一个主从详情功能。了解如何使用
    Composition API 管理状态，然后利用它实现一个类似于 Vuex 的中央存储。


    祝学习愉快！


    '
