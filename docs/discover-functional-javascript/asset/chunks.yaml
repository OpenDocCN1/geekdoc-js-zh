  trans: "\n\n## 使用其他纯函数\n\n纯函数可以调用其他纯函数。请看下面的代码，其中 `getMaxId()` 纯函数使用了另外两个纯函数：`prop()`\
    \ 和 `Math.max()`。而 `addTodo()` 纯函数则使用了 `getMaxId()` 纯函数。\n\n```\nimport prop from\
    \ \"lodash/property\";\n\nfunction addTodo(todos, todo) {\n  const id = getMaxId(todos)\
    \ + 1;\n  const newTodo = { ...todo, id };\n  return todos.concat([newTodo]);\n\
    }\n\nfunction getMaxId(todos) {     \n  if(todos.length){\n    const ids = todos.map(prop(\"\
    id\"));\n    return Math.max(...ids);\n  }\n  return 0;\n}\n\nconst todos = [];\n\
    const newTodos = addTodo(todos, { title: \"improve\" });\n\nconsole.log(newTodos);\n\
    //[{title: \"improve\", id: 1}]\n```\n\n## 使用其他非纯函数\n\n纯函数通常不会调用其他非纯函数，但有一个例外：如果那些非纯函数只修改输入参数，且整体纯度不受影响，那么纯函数可以调用它们。请看下面的代码：\n\
    \n```\nfunction applySort(arr){\n  return arr.sort();\n}\n\nfunction sort(arr){\n\
    \  const newArr = [...arr];\n  return applySort(newArr);\n}\n\nconst numbers =\
    \ [3, 2, 1];\nconst sortedNumbers = sort(numbers);\n\nconsole.log(numbers);\n\
    //[3, 2, 1];\nconsole.log(sortedNumbers);\n//[1, 2, 3]\n```\n\n`applySort()` 是一个非纯函数，它会修改输入的数组。而\
    \ `sort()` 是一个纯函数，即使它使用了非纯的 `applySort()` 函数。\n\n返回一个非纯函数的引用并不会影响函数的纯度。\n\n请看下面的例子，其中\
    \ `doImpureTask()` 是一个非纯函数：\n\n```\nfunction doImpureTask(){}\n\nfunction runFunction(){\n\
    \  return doImpureTask();\n}\n\nfunction getFunction(){\n  return doImpureTask;\n\
    }\n```\n\n`runFunction()` 是非纯的，而 `getFunction()` 是纯的。\n\n## 从内部实现纯度\n\n我们可以通过移除某些特性来开始编写纯函数风格的代码：\n\
    \n*   不使用赋值运算符。\n*   不使用 `let`、`var` 声明。\n*   只使用 `const` 声明变量。\n*   不使用 `++`\
    \ 或 `--` 更新运算符。\n*   不使用 `delete`。\n*   不将变量作为 `Object.assign()` 的第一个参数。\n*  \
    \ 不使用循环。\n*   只使用纯数组方法。\n\n在纯函数风格中，循环被纯数组方法（如 `filter()`、`map()`、`reduce()`）或递归所替代。\n\
    \n请注意，当引擎支持尾调用优化时，用递归替换所有循环才是可行的。目前，主流浏览器尚未支持尾调用优化。\n\n## 从外部判断纯度\n\n以纯函数风格编写代码，会使函数从内部和外部来看都是纯的。\n\
    \n然而，根据定义，函数的纯度是由外部而非内部决定的。请看下面的函数，它根据集合中的 id 创建了一个映射：\n\n```\nfunction createMapById(list){\n\
    \  const map = Object.create(null);\n  list.forEach(function addToMap(item){\n\
    \    map[item.id] = item;\n  });\n  return Object.freeze(map);\n}\n\nconst arr\
    \ = [\n  { id:1, name:\"mango\" }, \n  { id:2, name:\"apple\" }\n];\n\nconst map\
    \ = createMapById(arr);\nconsole.log(map);\n//{\n// 1: {id: 1, name: \"mango\"\
    },\n// 2: {id: 2, name: \"apple\"}\n//}\n```\n\n`createMapById()` 并非以纯函数风格编写。它使用了赋值运算符和非纯的\
    \ `forEach()` 方法。然而，当我们从外部观察这个函数时，它是纯的。\n\n函数内部的纯度是我们在追求清晰代码时应当努力的方向。下面 `getEvens()`\
    \ 函数的两种实现都是纯的，但我们应优先选择第一种：\n\n```\nfunction isEven(number){\n  return number %\
    \ 2 === 0;\n}\n\nfunction getEvens(numbers) {\n  return numbers.filter(isEven);\n\
    }\n\nfunction getEvens(numbers) {\n  const evenNumbers = []\n  numbers.forEach(function(number){\n\
    \    if (isEven(number)) {\n      evenNumbers.push(number);\n    }\n  });\n  return\
    \ evenNumbers;\n}\n```\n\n## 问题所在\n\n纯函数的问题在于，我们无法用纯函数编写整个应用程序。存在状态变化、用户界面渲染、用户交互、网络调用等场景。所有这些都无法用纯函数实现。纯函数不与外部环境通信。\n\
    \n那我们该怎么办？我们想要纯函数的所有好处，但同时，我们无法用 100% 的纯函数来构建一个实用的应用程序。\n\n纯函数的好处是显著的，我们应该尽可能多地编写纯函数。同时，我们也需要非纯代码来与环境通信。\n\
    \n我建议以纯函数为目标，并将非纯代码封装起来。\n\n## 非纯代码\n\n副作用是常见的错误来源，因为它们使代码更难阅读和推理。\n\n副作用可能使代码难以理解，但它们是必要的。\n\
    \n我们最好的方法是封装副作用。对象对于封装副作用非常有用。\n\n将非纯代码集中在一起，当出现错误时，更容易调查这些部分。通过隔离副作用，我们知道去哪里寻找意外问题。\n\
    \n目标不仅仅是封装，而是减少函数中可能出现的副作用种类。\n\n## 最终思考\n\n综合考虑以上因素，很明显纯函数使代码更易于阅读和理解。然而，我们不应忽视让纯函数保持小巧、只做一件事、并具有揭示意图的命名的重要性。\n\
    \n我们应该尽可能追求纯度，并封装副作用。目的是让代码中纯函数占比高，非纯代码占比低。这样，我们就能拥有更大比例易于推理的代码，以及更少可能引发问题的代码。\n\
    \n纯代码越多越好。\n\n# 第 7 章：不可变性\n\n> 不可变值是指一旦创建就无法更改的值。\n\n想象一下你在排队。在入口处，你拿到一个显示你号码的电子设备。就在你快要被服务时，屏幕上的订单号发生了变化。当你询问原因时，你了解到大楼里的任何人都可以更改你的号码，但没人知道是谁改的。在你等待的过程中，订单号一次又一次地变化。你现在面临的任务是请求大楼里的每个人都停止更改你的订单号。\n\
    \n回到代码中，将订单设备想象成一个带有 `number` 属性的 `order` 对象。假设应用程序中的任何代码都可以更改 `order.number`\
    \ 属性。检测是哪部分代码做了更改非常困难。你可能需要检查所有使用 `order` 对象的代码，并推测发生了什么。\n\n一个不可变的订单对象就不会有这种问题。\n\
    \n总的来说，不可变性可以避免一系列难以检测和推理的意外错误。\n\n## 原始值\n\n原始值是不可变的，而对象则不是。\n\n不可变原始值的最佳例子是字符串。对字符串的任何修改都会产生一个新的字符串。请看下面的例子：\n\
    \n```\n\"ABCD\".substring(1,3); //\"BC\"\n\"AB\" + \"CD\";           //\"ABCD\"\
    \n\"AB\".concat(\"CD\");     //\"ABCD\"\n```\n\n所有这些情况都会创建新的字符串。\n\n## 阅读代码\n\n\
    请看下面的代码：\n\n```\nconst arr = [1, 2, 3];\ndoSomething(arr);\n\nconsole.log(arr);\n\
    //[1, 2, 3] ?\n```\n\n我们能轻易地说 `log()` 会在控制台打印 `[1, 2, 3]` 吗？不能。数组是一种可变的数据结构。它可以在\
    \ `doSomething()` 函数中被修改。我们需要阅读并理解 `doSomething()` 函数才能知道控制台会打印什么。\n\n下面是一个修改数组的\
    \ `doSomething()` 函数示例：\n\n```\nfunction doSomething(arr){\n  arr.push(4);\n}\n\
    ```\n\n如果数组是一种不可变的数据结构，那么无需阅读 `doSomething()` 函数，我们就能知道控制台会打印什么。这样需要阅读和理解的代码就会更少。\n\
    \n## 常量\n\n"
- fmt: "\n`const` declares a variable that cannot be reassigned. It becomes a constant\
    \ only when the assigned value is immutable.\n\nIn short, using `const` with a\
    \ primitive value defines a constant. Using `const` with an object value doesn’t\
    \ necessarily define a constant.\n\n```\nconst book = {\n  title : \"How JavaScript\
    \ Works\",\n  author : \"Douglas Crockford\"\n};\n\nbook.title = \"JavaScript\
    \ The Good Parts\";\n\nconsole.log(book);\n//{title: \"JavaScript The Good Parts\"\
    , \n// author: \"Douglas Crockford\"}\n```\n\n### Freezing objects\n\nFreezing\
    \ objects makes them immutable.\n\n`Object.freeze()` can be used to freeze objects.\
    \ Properties can’t be added, deleted, or changed.\n\n```\nconst book = Object.freeze({\n\
    \  title : \"Functional-Light JavaScript\",\n  author : \"Kyle Simpson\"\n});\n\
    \nbook.title = \"You Don't Know JS\";\n//Cannot assign to read only property 'title'\n\
    ```\n\n`Object.freeze()` does a shallow freeze. The nested objects can be changed.\
    \ For deep freeze, we need to recursively freeze each property of type object.\
    \ Here is a `deepFreeze()` implementation:\n\n```\nfunction deepFreeze(object)\
    \ {\n  Object.keys(object).forEach(function(name){\n    const value = object[name];\n\
    \    if(typeof value === \"object\") {\n      deepFreeze(value);\n    }\n  });\n\
    \  return Object.freeze(object);\n}\n```\n\n`deepFreeze()` makes plain objects\
    \ immutable.\n\n### Working with immutable objects\n\nConsider `book` as an immutable\
    \ object.\n\n```\nconst book = Object.freeze({\n  title : \"JavaScript The Good\
    \ Parts\",\n  author : \"Douglas Crockford\"\n});\n```\n\nAny change will require\
    \ to create a new object.\n\n#### Edit property\n\n```\nconst title = \"How JavaScript\
    \ Works\";\nconst newBook = Object.freeze({ ...book, title });\n\nconsole.log(book);\n\
    //{title: \"JavaScript The Good Parts\", \n// author: \"Douglas Crockford\"}\n\
    \nconsole.log(newBook);\n//{title: \"How JavaScript Works\", \n// author: \"Douglas\
    \ Crockford\"}\n```\n\n#### Add property\n\n```\nconst description = \"Looking\
    \ at the fundamentals\";\nconst newBook = Object.freeze({ ...book, description});\n\
    \nconsole.log(book);\n//{title: \"JavaScript The Good Parts\", \n// author: \"\
    Douglas Crockford\"}\n\nconsole.log(newBook);\n//{title: \"JavaScript The Good\
    \ Parts\", \n// author: \"Douglas Crockford\"}\n// description: \"Looking at the\
    \ fundamentals\"}\n```\n\n#### Remove property\n\nThe destructuring syntax can\
    \ be used to create a new object without the `author` property:\n\n```\nconst\
    \ { author, ...newBook } = book;\n\nconsole.log(book);\n//{title: \"JavaScript\
    \ The Good Parts\", \n// author: \"Douglas Crockford\"}\n\nconsole.log(newBook);\n\
    //{title: \"JavaScript The Good Parts\"}\n```\n\n### Working with immutable arrays\n\
    \nThe array data structure is mutable. It can be modified after it is created.\n\
    \nIn order to work with immutable arrays we need to freeze them at creation and\
    \ use mainly the pure array methods and the spread operator.\n\nThe pure array\
    \ methods don’t modify the existing array but create new values.\n\n`concat()`,\
    \ `every()`, `filter()`, `find()`, `findIndex()`, `map()`, `reduce()`, `reduceRight()`,\
    \ `slice()`, `some()` are pure.\n\n`reverse()`, `sort()` should be pure, but they\
    \ are not. To use them, we must first make a copy of the original array.\n\nThe\
    \ impure methods modify the input array.\n\n`pop()`, `push()`, `shift()`, `splice()`,\
    \ `unshift()` are not pure.\n\n`Object.freeze()` freezes the array. Only the pure\
    \ methods work.\n\n```\nconst books = Object.freeze([ \n  {title: \"Functional\
    \ JavaScript\"}, \n  {title: \"Programming Elixir\"}\n]);\n\nbooks.push({});\n\
    //Cannot add property 0\n\nbooks.pop();\n//Cannot delete property '0'\n```\n\n\
    #### Add\n\nHere is an example of adding a new value to an immutable array:\n\n\
    ```\nconst newBook = \n        Object.freeze({ title:\"How JavaScript Works\"\
    \ });\n\n//add with spread operator\nconst newBooks = [...books, newBook];\n\n\
    //add with concat()\nconst newBooks = books.concat([newBook]);\n```\n\n#### Remove\n\
    \nBelow is an example of removing the value from the position `index`:\n\n```\n\
    const index = 0;\nconst newBooks = [...books.slice(0, index), \n             \
    \     ...books.slice(index+1)];\n```\n\n`slice(start, end)` returns a portion\
    \ of an array, between two specified indexes, as a new array. When the `end` index\
    \ is omitted, all elements from the `start` position to the end of the array are\
    \ selected. When the `start` index is also omitted, it starts from index 0 and\
    \ makes a shallow clone of the array.\n\n#### Edit\n\n`map()` can be used to edit\
    \ an element in an immutable array. The mapping function returns the new value\
    \ for the element we want to update and returns the existing value for all the\
    \ other elements.\n\n```\nconst newBook = Object.freeze({title:\"JavaScript Patterns\"\
    });\nconst editIndex = 0;\n\nconst newBooks = books.map(function(book, index){\n\
    \    if(index === editIndex){\n      return newBook;\n    }\n\n    return book;\n\
    \  });\n```\n\n### Immutable library\n\n[Immutable.js](https://facebook.github.io/immutable-js/)\
    \ provides immutable data structures like `List` and `Map`. These data structures\
    \ are highly optimized.\n\nLet’s check the `List` data structure.\n\n```\nimport\
    \ { List } from \"immutable\";\n\nconst books = List([\n  { title: \"JavaScript\
    \ Allongé\" }, \n  { title: \"You Don't Know JS\" }\n]);\n```\n\n#### Add\n\n\
    > `push(value)` returns a new `List` with the new `value` added.\n\n```\nconst\
    \ aNewBook = { title: \"Mastering Immutable.js\" };\n\nconst newBooks = books.push(aNewBook);\n\
    \nconsole.log(Array.from(books));\n//[{title: \"JavaScript Allongé\"},\n// {title:\
    \ \"You Don't Know JS\"}]\n\nconsole.log(Array.from(newBooks));\n//[{title: \"\
    JavaScript Allongé\"},\n// {title: \"You Don't Know JS\"},\n// {title: \"Mastering\
    \ Immutable.js\"}]\n```\n\n#### Edit\n\n> `set(index, value)` returns a new `List`\
    \ having the new `value` at position `index`.\n\n```\nconst aNewBook = { title:\
    \ \"Mastering Immutable.js\" };\n\nconst newBooks = books.set(0, aNewBook);\n\n\
    console.log(Array.from(newBooks));\n//[{title: \"Mastering Immutable.js\"},\n\
    // {title: \"You Don't Know JS\"}];\n```\n\n#### Remove\n\n> `remove(index)` returns\
    \ a new `List` with the value at the `index` position removed.\n\n```\nconst newBooks\
    \ = books.remove(0);\n\nconsole.log(Array.from(newBooks));\n//[{title: \"You Don't\
    \ Know JS\"}];\n```\n\nThe immutable `List` data structure can be converted to\
    \ a native array using `Array.from()`, spread operator or the `toArray()` method.\
    \ These conversions can be slow for big arrays/objects.\n\nFor both processing\
    \ and memory, we should take in consideration the immutable data structures provided\
    \ by libraries like [Immutable.js](https://facebook.github.io/immutable-js/).\n\
    \n### Transfer objects\n\nTransfer objects are plain objects containing only data\
    \ that move around the application from one function to another.\n\nTo avoid any\
    \ unexpected changes they should be immutable.\n\n### Input values\n\nUnexpected\
    \ changes can create bugs hard to find and understand. That will mean more time\
    \ to investigate problems, so immutability saves troubleshooting and debugging\
    \ time.\n\nAll input values should be treated as immutable values regardless if\
    \ they are or not. This way we avoid creating unexpected changes somewhere else\
    \ in the application.\n\n### Change detection\n\nImmutability offers efficiency\
    \ at detecting a change in an object. To detect if an object has changed, we just\
    \ need to compare the previous reference with the current one. There is no need\
    \ to check the values of all properties.\n\n### Final thoughts\n\nImmutability\
    \ makes code easier to read. When values cannot change, code is much easier to\
    \ reason about.\n\nImmutability avoids a set of hard to detect bugs.\n\nThere\
    \ are two ways for working with immutable values in JavaScript. One is to freeze\
    \ all objects and arrays at creation and then use the spread operator or the pure\
    \ array methods to create new arrays. The other option is to use a library like\
    \ [Immutable.js](https://facebook.github.io/immutable-js/) that offers immutable\
    \ data structures.\n\nImmutability is not about variables that cannot change,\
    \ but about values that cannot change.\n\n# Chapter 8: Partial application and\
    \ currying\n"
