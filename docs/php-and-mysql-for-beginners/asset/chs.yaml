  \ `departments` 表添加一些行：\n\n![](img/00277.jpeg)\n\n图 9.14: 向 departments 表添加数据。\n\
  \n`departments` 表将如下所示：\n\n![](img/00278.jpeg)\n\n图 9.15: 包含 4 行的 departments 表。\n\
  \n现在，你的数据库已经完全设置好了！在下一章中，我们将编写一个与此数据库交互的 PHP 应用。\n\n### 复习题\n\n1. 为了在 MySQL 提示符中获取命令列表，我们应该输入什么？\n\
  \   a. `mysql>Help`\n   b. `mysql>command`\n   c. `mysql>list`\n   d. 以上都不是。\n\n\
  2. 为了确保列中的每个条目都是唯一的，我们使用什么？\n   a. 外键 (Foreign key)。\n   b. 候选键 (Candidate key)。\n\
  \   c. 主键 (Primary key)。\n   d. 以上都不是。\n\n### 9.2 从数据库中检索查询\n\n在上一节中，我们使用 `phpMyAdmin`\
  \ 创建了 `employees` 数据库，然后在该数据库中创建了 `employee` 和 `department` 表。仍然使用 `phpMyAdmin`，我们向这两个表输入了示例数据。现在，我们将通过编写对\
  \ MySQL 数据库执行操作的 PHP 脚本来检索这些数据。\n\n为了让 PHP 访问并操作 MySQL 数据库中的表列，我们使用 MySQL API 扩展。PHP\
  \ 提供了三个这样的扩展：\n- 已废弃的原始 MySQL API\n- MySQL PDO 函数\n- MySQL 改进扩展，`MySQLi`。\n\n我们将使用第三种\
  \ API 扩展 `MySQLi`，它也是最新的。API 意味着应用程序编程接口。该接口定义了你的 PHP 脚本与 MySQL 交互所需的类、方法、函数和变量。\n\
  \n**提示**：要学习关于这三个 PHP MySQL API 扩展的所有知识，你可以查找 `PHP MYSQL API (2014-03-14 Revision\
  \ 38079)`。该手册描述了可以与 MySQL 使用的 PHP 扩展和接口。托管此文档的站点之一是 `downloads.mysql.com/docs/apis-php-en.a4.pdf`你可以在搜索引擎中输入“php\
  \ mysqli api”来搜索其他网站。\n\n在我们详细介绍 `MySQLi` 之前，让我们先明确什么是“访问并操作 MySQL 数据库中的表行和列”。我们将编写一个非常简单基础的\
  \ PHP CRUD 应用。CRUD 是创建、检索、更新和删除（英文）的缩写。一个 CRUD 应用：\na. 向数据库表中添加新行 (Create)，\nb.\
  \ 从数据库表中检索数据 (Retrieve)，\nc. 修改表列中的数据 (Update)，以及\nd. 从数据库表中删除行 (Delete)。\n\n上述四项功能中的每项都由特定的\
  \ SQL 语句专门执行：\n\n| SQL | 说明 |\n| :--- | :--- |\n| `INSERT` | 向数据库中的表添加新数据行。 |\n\
  | `SELECT` | 从一个或多个表中检索数据。 |\n| `UPDATE` | 修改现有数据。 |\n| `DELETE` | 从表中删除一行数据。 |\n\
  \n我们的 PHP 脚本将构建所需的精确 SQL 语句并使用 MySQL。\n\n\n\n\nc. 如果连接对象创建成功，我们将构造一个 SQL 查询（可以是\
  \ `INSERT`、`SELECT`、`UPDATE` 或 `DELETE`）。\n\nd. 我们使用连接对象 `$conn` 的 `query` 方法来执行我们构造的查询，以获取一个\
  \ `resultset` 对象 `$rs`。\n\ne. 我们检查查询是否成功。如果成功，我们将显示有关查询执行的某些参数。如果未成功，我们将显示一条错误消息并退出程序。\n\
  \nf. 在检索（Retrieve）功能中，如果查询成功，我们将获得一个 `resultset` 对象。然后，我们使用 `resultset` 的 `fetch_array`\
  \ 方法将 `resultset` 对象的数据传输到关联数组或索引数组中。\n\ng. 当所有数据库操作（添加、检索、更新和删除）完成后，通过调用连接对象 `$conn`\
  \ 的 `close` 方法来关闭连接。\n\n让我们从一个简单的脚本 `connect.php` 开始，它将创建一个到我们 `employees` 数据库的连接对象。（这是前几个段落中的步骤\
  \ a 和 b。）输入以下代码并将其保存为 `connect.php`。\n\n```php\n<?php\ndefine( \"HOSTNAME\", \"\
  localhost\");\ndefine( \"USERNAME\", \"root\");\ndefine( \"PASSWORD\", \"\");\n\
  define( \"DB_NAME\", \"employees\");\n\n$conn = new mysqli(HOSTNAME, USERNAME, PASSWORD,\
  \ DB_NAME);\n\nif ($conn->connect_errno) {\n    echo( \"<br/>Failed to connect to\
  \ MySQL: (\" .\n    $conn->connect_errno . \") \" . $conn->connect_error );    \
  \         \n} else {\n    echo( \"<br/>Connected to database \" . DB_NAME);\n  \
  \  echo( \"<br/>\" . $conn->host_info );\n}   \n?>\n```\n\n让我们分析一下代码。首先，我们定义了四个常量——`HOSTNAME`、`USERNAME`、`PASSWORD`\
  \ 和 `DB_NAME`。这四个常量作为参数传递给 `mysqli()` 类，该类创建一个由变量 `$conn` 引用的连接对象。该连接对象的方法允许我们访问数据库\
  \ `employees`。\n\n请注意，为了简化步骤，我们使用“root”作为用户名，空字符串作为密码，但实际情况下，我们应该提供真实的用户名和强密码。这些真实的用户名和密码应该在我们的\
  \ employees 数据库中预先定义并设置。\n\n另外请记住，使用常量应该成为你的编程最佳实践之一。你应该在代码中留出一个位置，用于放置经常变化的参数，例如用户名和密码。\n\
  \n现在，如果我们在运行 Windows 7 的 PC 上运行此脚本，我们将看到：\n\nConnected to database employees\nlocalhost\
  \ via TCP/IP\n\n第二行或最后一行将根据你的操作系统操作系统而异。有些系统将生成：\n\n127.0.0.1 via TCP/IP\n\n现在，让我们通过更改这一行来测试代码：\n\
  \n`define( \"DB_NAME\", \"employees\");`\n\n更改为：\n\n`define( \"DB_NAME\", \"competitors\"\
  );`\n\n实际上，我们通过提供一个不存在的数据库名称来故意创建一个错误条件。如果我们运行这个修改后的 `connect.php`，我们应该得到下面的截图。\n\
  \n![](img/00279.jpeg)\n\n图 9.16: 错误消息显示。\n\n显示的最后一行是由我们的这行代码生成的：\n\n`echo( \"<br/>Failed\
  \ to connect to MySQL: (\" . $conn->connect_errno . \") \" . $conn->connect_error\
  \ );`\n\n显示的其余部分由浏览器 Google Chrome 生成。\n\n如你所示，我们的 `connect.php` 脚本已完全调试并运行良好。现在，我们将进行一些微调，并将修改后的脚本保存为\
  \ `connectInc.php`。这是它的代码：\n\n```php\n<?php\ndefine( \"HOSTNAME\", \"localhost\"\
  );\ndefine( \"USERNAME\", \"root\");\ndefine( \"PASSWORD\", \"\");\ndefine( \"DB_NAME\"\
  , \"employees\");\n\n$conn = new mysqli(HOSTNAME, USERNAME, PASSWORD, DB_NAME);\n\
  \nif ($conn->connect_errno) {\n    echo( \"<br/>Failed to connect to MySQL: (\"\
  \ . $conn-\n    >connect_errno . \") \" . $conn->connect_error );\n    die( '<br/>Program\
  \ Terminated');\n}\n?>\n```\n\n我们之所以进行这些更改是因为 `connectInc.php` 是一个脚本，我们将使用 `require_once()`\
  \ 函数将其包含到下一个脚本中，如下代码片段所示。\n\n```php\n<?php\n    require_once(\"connectInc.php\"\
  );\n?>\n```\n\n现在，我们将构建一个脚本，该脚本将构造一个 SQL Select 语句从 `employee` 表中检索记录。让我们输入以下代码并将其保存到文件\
  \ `Retrieve1.php` 中。\n\n```php\n<?php\nrequire_once(\"connectInc.php\");\n\n$sql\
  \ = \"SELECT * FROM employee\";\n$rs = $conn->query($sql);\n\nif ( $rs === false\
  \ ) {\n  trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error, E_USER_ERROR);\n\
  } else {\n  $arr = $rs->fetch_array( MYSQLI_ASSOC); // MYSQLI_ASSOC\n  $rows_returned\
  \ = $rs->num_rows;\n  echo(\"<br/>Rows: \" . $rows_returned);\n  echo(\"<br/>\"\
  \ . $arr['id']);\n  echo(\"<br/>\" . $arr['firstname']);\n  echo(\"<br/>\" . $arr['lastname']);\n\
  \  echo(\"<br/>\" . $arr['department']);\n  echo(\"<br/>\" . $arr['position']);\n\
  \  echo(\"<br/>\" . $arr['salary']);\n}\n?>\n```\n\n让我们分析这段代码。由于我们已经知道 `require_once()`\
  \ `connectInc.php` 做了什么，让我们从这一行开始：\n\n`$sql = \"SELECT * FROM employee\"`\n\n在这里我们构造了一个\
  \ SQL 查询（遵循 SQL 语法）并将该查询存储在变量 `$sql` 中。然后在下一行，我们将 `$sql` 作为参数传递给连接对象 `$conn` 的 `query`\
  \ 方法。\n\n`$rs = $conn->query($sql);`\n\n`query` 方法将执行 SQL 语句并返回一个对象。结果集（称为记录集）是客户端中数据库行的镜像。在我们之前的查询中，我们请求了所有的行。（当然，如果表包含成千上万行而我们请求所有行，客户端机器内存可能不足以保存这些行。因此服务器将使用分页技术来提供可以处理的行。）\n\
  \n现在回到连接对象 `$conn` 的 `query` 方法，它执行了 `$sql` 中的 SQL 语句并返回了由变量 `$rs` 引用的结果集。\n\n如果查询失败，变量\
  \ `$rs` 将包含布尔值 `false`，此行代码将显示特定的错误消息。\n\n`trigger_error('Wrong SQL: ' . $sql .\
  \ ' Error: ' . $conn->error, E_USER_ERROR);`\n\n为了执行此 `trigger_error()` 函数，更改此行代码：\n\
  \n`$sql = \"SELECT * FROM employee\";`\n\n改为：\n\n`$sql = \"OBTAIN * FROM employee\"\
  ;`\n\n你将得到这条错误消息，专门指出“OBTAIN”是我们 SQL 语句中的错误：Fatal error: Wrong SQL: OBTAIN * FROM\
  \ employee Error: You have an error in your SQL syntax; check the manual that corresponds\
  \ to your MySQL server version for the right syntax to use near 'OBTAIN * FROM employee'\n\
  \n如果我们的查询成功，那么 `employee` 表的所有记录都在变量 `$rs` 引用的结果集对象中。我们随后执行结果集对象 `$rs` 的 `fetch_array`\
  \ 方法：\n\n`$arr = $rs->fetch_array(MYSQLI_ASSOC);`\n\n`fetch_array` 方法将结果集 `$rs`\
  \ 当前行的字段存储在关联数组 `$arr` 中，使用字段名作为键，因为我们提供了常量 `MYSQLI_ASSOC`。如果我们将此常量改为 `MYSQLI_NUM`，那么\
  \ `$arr` 将是一个数值索引数组。\n\n\n\n我们说“存储 `$rs` 当前行的字段”。那么“`$rs` 的当前行”会是什么呢？由于在代码行中，我们会在\
  \ `$rs` 创建（通过连接对象 `$conn` 的 `query` 方法）后立即访问 `$rs`：\n\n```php\n$rs = $conn->query($sql);\n\
  ```\n\n那么 `$rs` 的当前行将是它的第一行。这第一行的字段将会被存储在关联数组 `$arr` 中。我们现在使用以下行代码显示这些字段：\n\n```php\n\
  echo( $arr['empid'] . ' ' .\n      $arr['lastname'] . ' ' .\n      $arr['firstname']\
  \ . ' ' .\n      $arr['department'] . ' ' .\n      $arr['position'] . ' ' .\n  \
  \    $arr['salary'] );\n```\n\n### 浏览器输出\n在你的浏览器中，你应该能看到类似的内容：\n\n101 Escudero,\
  \ Ernesto 3 Utility Supervisor 10000\n\n这些是 `employee` 表第一行的字段。检查你获得的值是否与你第一条记录字段的实际值顺序匹配——`empid`、`lastname`、`firstname`、`department`、`position`\
  \ 和 `salary`。\n\n我们还有这两行代码：\n\n```php\n$rows_returned = $rs->num_rows;\necho( \"\
  <br>Rows: \" . $rows_returned);\n```\n\n它将产生以下输出：\n\nRows: 9\n\n`num_rows` 是由 `$rs`\
  \ 引用的结果集对象的属性，它存储了 `$rs` 中的行数，这也就是 `employee` 表中的行数。检查浏览器中显示的值是否与你 `employee` 表中的记录数匹配。你可以使用\
  \ `phpMyAdmin` 来完成此操作。\n\n### 显示所有行\n现在，我们有两个运行运行的脚本。一个脚本 `connectInc.php` 建立了到\
  \ MySQL 数据库 `employees` 的连接。第二个脚本 `retrieve1.php` 在数据库上执行了一句 `Select` 查询，并将 `employee`\
  \ 表的所有记录检索到结果集对象 `$rs` 中。但是，它只显示了第一条记录！我们该如何显示结果集 `$rs` 的所有行呢？（实际上，我们该如何显示 `employee`\
  \ 表的所有行？）答案是：我们使用 `while` 循环。\n\n当我们第一次调用 `fetch_array` 方法时，它会将 `$rs` 第一行（当前行）的字段提取到数组\
  \ `$arr` 的元素中。随后，`fetch_array` 会将第二行变为当前行。\n\n如果我们再次调用 `fetch_array`，提取的将是第二行的字段，然后第三行就变成了当前行。因此，如果我们不断地调用\
  \ `fetch_array`，我们就能连续地处理结果集 `$rs` 的所有行。\n\n因此，为了在 `while` 循环中反复反复调用 `fetch_array`，我们修改了\
  \ `retrieve1.php` 的代码并将其保存为 `retrieve2.php`。其代码如下：\n\n```php\n<?php\nrequire_once(\"\
  connectInc.php\");\n\n$sql = \"SELECT * FROM employee\";\n$rs = $conn->query($sql);\n\
  \nif ( $rs === false ) {\n  trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error,\
  \ E_USER_ERROR);\n} else {\n  $rows_returned = $rs->num_rows;\n  echo( \"<br>Rows:\
  \ \" . $rows_returned);\n  while ( $arr = $rs->fetch_array(MYSQLI_ASSOC) ) {\n \
  \   echo(\"<br/>\");\n    echo ($arr['empid'] . ' ' .\n            $arr['lastname'].'\
  \ ' .\n            $arr['firstname'] . ' ' .\n            $arr['department'] . '\
  \ ' .\n            $arr['position'].' '.\n            $arr['salary']);\n  }\n}\n\
  ?>\n```\n\n当我们执行此脚本时，我们将按照下面的方式看到 `employee` 表的所有行。\n\n![](img/00280.jpeg)\n\n图\
  \ 9.17：显示了 employee 表的所有行。\n\n### 使用表格格式\n为了以表格形式呈现这些信息，将 `else` 块替换为以下代码，并将脚本保存为\
  \ `retrieve3.php`：\n\n```php\n{\n  $rows_returned = $rs->num_rows;\n  echo( \"<br>Rows:\
  \ \" . $rows_returned);          \n  echo(\"<table>\");\n  while ($arr = $rs->fetch_array(\
  \ MYSQLI_ASSOC)) {\n    echo(\"<tr>\");\n    echo \"<td>\" . $arr['empid'] . \"\
  </td>\"\n    echo \"<td>\" . $arr['lastname'] . \"</td>\"\n    echo \"<td>\" . $arr['firstname']\
  \ . \"</td>\"\n    echo \"<td>\" . $arr['department'] . \"</td>\"\n    echo \"<td>\"\
  \ . $arr['position']. \"</td>\"\n    echo \"<td>\" . $arr['salary'] . \"</td>\"\
  ;\n    echo '</tr>';\n  }\n  echo(\"</table>\");\n}\n```\n\n当我们执行 `retrieve3.php`\
  \ 时，我们将得到类似下面的显示，其中列是对齐的。\n\n![](img/00281.jpeg)\n\n图 9.18：信息以表格形式表示。\n\n在本章中，我们能够使用\
  \ SQL 命令查询数据库，通过向数据库发送查询来获取 `$result` 对象，并获取表格。代码如下：\n\n```php\n<?php\nrequire_once(\"\
  connectInc.php\");\n\n$sql = \"SELECT * FROM employee\";\n$rs = $conn->query($sql);\n\
  \nif ( $rs === false ) {\n  trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error,\
  \ E_USER_ERROR);\n} else {\n  $rows_returned = $rs->num_rows;\n  echo( \"<br>Rows:\
  \ \" . $rows_returned);\n  while ( $arr = $rs->fetch_array(MYSQLI_ASSOC) ) {\n \
  \   echo(\"<br/>\");\n    echo ($arr['empid'] . ' ' .\n            $arr['lastname'].'\
  \ ' .\n            $arr['firstname'] . ' ' .\n            $arr['department'] . '\
  \ ' .\n            $arr['position'].' '.\n            $arr['salary']);\n  }\n}\n\
  ?>\n```\n\n### 复习题\n1. 哪个类作为连接对象的蓝图？\n   a. 连接类\n   b. mysqli 类\n   c. 查询类\n   d.\
  \ 结果集类\n\n2. 哪个命令指示 `mysql_connect` 未工作，将导致？\n   a. 结束\n   b. 退出\n   c. 完成\n   d.\
  \ 错误\n\n## 9.3 在数据库中存储信息\n让我们回顾一下努力。我们使用 `phpMyAdmin` 创建了数据库 `employees` 以及它的两个表——`employee`\
  \ 和 `department`。我们还使用 `phpMyAdmin` 向这两个表输入测试数据。然后，我们编写了 PHP 脚本来处理 `检索` 功能。现在，我们将编写\
  \ PHP 脚本来实现 `创建` 功能。\n\n我们需要做的第一件事是创建一个表单，包含 `empid`，因为它会自动生成。我们将打开名为 `insert.php`\
  \ 的新文件，在那里使用 HTML 表单标签并编写以下代码：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n    <meta charset=\"UTF-8\">\n    <title>Insert Employee</title>\n</head>\n\
  <body>\n    <form action=\"insertProcess.php\" method=\"post\">\n      <p>姓<br/>\n\
  \      <input type=\"text\" name=\"last\"/></p>\n      <p>名<br/>\n      <input type=\"\
  text\" name=\"first\"/></p>\n      <p>部门<br/>\n      <input type=\"text\" name=\"\
  department\"/></p>\n      <p>职位<br/>\n      <input type=\"text\" name=\"position\"\
  /></p>\n      <p>薪水<br/>\n      <input type=\"text\" name=\"salary\"/></p>\n   \
  \   <input type=\"submit\" value=\"保存信息\" />\n    </form>\n</body>\n</html>\n```\n\
  \n让我们来看这行 HTML 代码：\n\n`<form action=\"insertProcess.php\" method=\"post\">`\n\n\
  此表单标签将 `action` 属性设置为 `insertProcess.php` 文件，该文件将接收并处理输入此表单的数据。我们还使用了 `post` 方法，它以数组的形式传递信息，而不是在\
  \ URL 中创建查询字符串。\n\n如果在浏览器中运行 `insert.php` 脚本，我们将看到：\n\n![](img/00282.jpeg)\n\n图\
  \ 9.19：用于插入新数据的表单。\n\n现在我们有一个可以向数据库中放入数据的表单。然而，你可以看到你可以在“部门”下方的框中输入任何内容，这并不是我们想要的。\n\
  \n我们希望用户选择部门名称，但保存到数据库的不是部门名称，而是对应的部门 ID，该 ID 只能在 1 到 4 之间。为了实现这一点，我们以此这样修改我们的 HTML\
  \ 代码。\n\n\n\n\n\n# 部门\n\n<p>\n<select name=\"department\">\n  <option value=\"1\"\
  >财务</option>\n  <option value=\"2\">销售</option>\n  <option value=\"3\">信息技术</option>\n\
  \  <option value=\"4\">管理</option>\n</select>\n</p>\n\n在这里，当用户选择相应的字面量（财务、销售、信息技术或管理）时，`option`\
  \ 标签的 `value` 属性将会在提交。\n\n![](img/00283.jpeg)\n图 9.20：部门（Department）字段的下拉选择框。\n\n\
  现在，在实际向此表单插入数据之前，让我们编写脚本 `insertProcess.php`。该脚本的首要任务是提取 `insert.php` 显示的表单中的输入数据。因此，我们通过以下代码访问超全局数组\
  \ `$_REQUEST`，然后使用 `echo` 函数将其显示：\n\n```php\n<?php\n    $last = $_REQUEST['last'];\n\
  \    $first= $_REQUEST['first'];\n    $department= $_REQUEST['department'];\n  \
  \  $position= $_REQUEST['position'];\n    echo($last . ' ' .\n          $first .\
  \ ' ' .\n          $department . ' ' .\n          $position);\n?>\n```\n\n\n\n\n\
  ```php\necho( \"<br/>返回到 <a href='index.php'>Add-Upd-DelPage</a>\" );\n?>\n```\n\
  \n## 复习习题\n\n1. `post` 方法使用的信息数据类型是什么？\n   a. 数组 (array)。\n   b. 链表 (linked list)。\n\
  \   c. 单个数据。\n   d. 以上都不是。\n\n2. 连接对象使用哪种方法来关闭自身？\n   a. exit\n   b. end\n   c.\
  \ close\n   d. 以上都不是。\n\n## 9.4 删除和更新数据库记录\n\n现在我们已经为这个非常简单且基础的 CRUD 应用编写了创建（Create）和检索（Retrieve）功能的脚本，接下来我们将编写更新（Update）和删除（Delete）功能的脚本。\n\
  \n首先，我们将修改 `retrieve3.php` 脚本并将其保存为 `index.php`。我们希望此脚本的页面显示作为一个仪表盘——应用程序的中央控制点。`index.php`\
  \ 也将是我们 CRUD 应用的启动脚本，通过它的仪表盘页面，我们可以访问应用程序的创建、更新和删除脚本。以下是 `index.php` 的修改代码。\n\n\
  ```php\n<?php\n\nrequire_once(\"connectINC.php\");\n\n$sql = \"SELECT * FROM employee\"\
  ;\n\n$rs = $conn->query($sql);\n\nif ( $rs === false ) {\n  $errmsg = 'Wrong SQL:\
  \ ' . $sql . ' Error: ' . $conn->error;\n  trigger_error( $errmsg, E_USER_ERROR);\n\
  } else {\n  echo(\"<table>\");\n  while ($arr = $rs->fetch_array( MYSQLI_ASSOC ))\
  \ {\n      echo(\"<tr>\");\n      echo( \"<td>\" . $arr['empid'] . \"</td>\"\n \
  \     . \"<td>\" . $arr['lastname'] . \"</td>\"\n      . \"<td>\" . $arr['firstname']\
  \ . \"</td>\"\n      . \"<td>\" . $arr['department'] . \"</td>\"\n      . \"<td>\"\
  \ . $arr['position'].  \"</td>\"\n      . \"<td>\" . $arr['salary'] . \"</td>\"\n\
  \      . \"<td><a href='delete.php?id=\" . $arr['empid'] .\n      \"'>Delete</a></td>\"\
  \n      . \"<td><a href='updateForm.php?id=\" . $arr['empid'] .\n      \"'>Update</a></td>\"\
  \ );\n    echo '</tr>';\n  }\n  echo(\"<tr>\n      <td></td> <td></td> <td></td>\
  \ <td></td> \n      <td></td><td></td><td><a href=insert.php>Add New</a></td>\"\
  );\n  echo(\"</tr>\");\n  echo(\"</table>\");\n}\n\n$conn->close();\n\n?>\n```\n\
  \n当我们运行此脚本时，你在 `employee` 表中输入的所有示例数据都应该如截图所示，按行列有序地出现在屏幕上。\n\n![](img/00287.jpeg)\n\
  \n图 9.24：由 `index.php` 脚本生成的屏幕显示，显示了 `employee` 表的行，并为每个员工提供了删除和更新按钮。表格底部还有一个“添加”（Add\
  \ New）按钮，用于为新员工创建记录。\n\n**提示**：为了让“添加”按钮与删除按钮列对齐，请在定义“添加”按钮的链接之前添加或删除表格单元格标签 `<td></td></td>`。\n\
  \n如果你将 `index.php` 的代码与 `retrieve3.php` 的代码对比，你会发现我们增加了代码，为显示的每个员工记录创建了删除和更新按钮。通过这两个按钮，我们可以删除员工记录或修改其数据。我们还在屏幕底部创建了一个“添加”按钮，允许我们向数据库中添加新员工。“添加”、删除和更新按钮也分别是指向\
  \ `insert.php`、`delete.php` 和 `updateForm.php` 脚本的链接。点击这三个按钮中的任何一个都会执行其相应的 PHP 脚本。\n\
  \n这就是 `index.php` 脚本作为仪表盘的功能。它的屏幕显示允许我们访问 CRUD 应用创建、更新和删除功能。\n\n当我们链接到 `delete.php`\
  \ 和 `updateForm.php` 脚本时，我们还必须传递想要删除或更新的特定记录的 `ID`。为了实现这一点，我们需要查询字符串（query string）。它是\
  \ URL 的一部分，包含传递给 Web 应用程序的数据。你可能以前见过查询字符串，URL 的末尾有一个问号（`?`），然后是一组短语，如下所示：\n\n`http://program/path/?query_string`\n\
  \n下行示例代码创建了删除按钮并将其链接到 `delete.php` 脚本。它还构建了传递给 `delete.php` 脚本的查询字符串。\n\n<td><a\
  \ href='delete.php?id=\" . $arr['empid'] . \"'>Delete</a></td>\n\n更新按钮的行几乎相同：\n\
  <td><a href='updateForm.php?id=\" . $arr['empid'] . \"'>Update</a></td>\n\n构建“添加”按钮的行与之前不同：\n\
  <td><a href=insert.php>Add New</a></td>\n\n等一下，让我们总结一下我们四个主脚本的通用流程：\na. 使用连接对象 `$conn`\
  \ 建立数据库连接。\nb. 检查 `$conn` 是否成功创建。\nc. 构建 INSERT、UPDATE 或 DELETE 查询。\nd. 使用 `$conn`\
  \ 的 `query` 方法执行查询。\ne. 检查查询是否执行成功。对于检索（Retrieve），获取结果集并将其内容转换为数组。\nf. 关闭连接。\n\n\
  现在，让我们看看 `delete.php` 的代码。步骤 a 和 b 由我们包含在 `delete.php` 脚本中的 `connectInc.php` 代码完成：\n\
  \n```php\nrequire_once(\"connectINC.php\");\n\n获取我们要删除的员工的 empid：\n$id = $_REQUEST['id'];\n\
  \n使用 $id 的值构建我们的 SQL 查询。这是步骤 c。\n$sql = \"DELETE FROM employee WHERE empid='\" .\
  \ $id . \"';\n\n执行查询并检查其执行情况（步骤 d 和 e）。\nif ($conn->query($sql) === false) {\n \
  \ trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error, E_USER_ERROR);\n\
  } else {\n  // 如果查询成功，我们显示与操作相关的参数。\n  $affected_rows = $conn->affected_rows;\n\
  \  echo(\"<br/>\" . $sql);\n  echo(\"<br/>Affected rows: \" . $affected_rows );\n\
  \  echo(\"<br/>User \" . $id . \" deleted from the database.\");\n}\n\n关闭连接（步骤 f）。\n\
  $conn->close();\n```\n\n显示一个链接允许用户返回仪表盘，即 `index.php` 脚本：\n\n```php\necho( \"<br/>返回到\
  \ <a href='index.php'>Add-Upd-DelPage</a>\" );\n```\n\n现在，运行脚本 `index.php` 并选择一个员工进行删除。（注意该员工的\
  \ empid。）当你点击删除按钮时，你应该得到类似下面的显示。\n\nDELETE FROM employee WHERE empid='112';\n\n\
  Affected rows: 1\n\nUser 112 deleted from the database.\n\n\n\n\n\n这显示了删除 `empid`\
  \ 为 112 的员工的结果。\n\n（将 112 替换为你要删除的员工的 `empid`。）\n\n如果我们返回主页，即 `index.php`，我们将看到这个：\n\
  \n你可以看到第一条记录不存在了，这表明我们的删除操作成功了。\n\n现在，让我们来看 `updateForm.php` 的完整代码，它实际上是一个完整的 HTML\
  \ 文档。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  UTF-8\">\n  <title>Update Form</title>\n</head>\n<body>\n  <?php\n    require_once(\"\
  connectInc.php\");\n    $id=$_REQUEST['id'];\n    $sql = \"SELECT * FROM employee\
  \ WHERE empid = '\" . $id . \"';\";\n    $rs = $conn->query($sql);\n    if ( $rs\
  \ === false ) {\n      trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error,\
  \ E_USER_ERROR);\n      die( \"Select Error: \" . $sql);\n    } else {\n      $arr\
  \ = $rs->fetch_array( MYSQLI_ASSOC);\n    }\n    $conn->close();\n  ?>\n  <form\
  \ action=\"updateProcess.php\" method=\"post\">\n    <input type=\"hidden\" name=\"\
  id\" value=\"<?php print($id); ?>\" />\n    <p>Last Name<br/>\n    <input type=\"\
