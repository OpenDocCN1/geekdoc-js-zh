  \n![](img/168.jpeg)\n\n图 5.28：`foreachLoops_3.php` 的输出\n\n## 章节测验\n\n1. 什么是循环？\n\
  a. 代码段的无限迭代。\nb. 执行固定次数的命令。\nc. 根据条件重复的命令。\nd. 忽略重复的结构。\n\n2. `while` 循环和 `do` 循环的主要区别是什么？\n\
  a. `while` 循环比 `do` 循环短。\nb. `do` 循环比 `while` 复杂。\nc. 即使条件为假，`do` 循环也会执行一次。\nd.\
  \ 没有任何区别。\n\n3. 什么是 `for` 循环？\na. 代码段的循环。\nb. `for` 循环比 `while` 和 `do` 循环长。\nc.\
  \ `for` 循环是一种紧凑的循环类型，将逻辑和参数包含在一行内。\nd. `for` 循环设计用于处理数组。\n\n4. 处理复杂数组时哪种循环比较明智？\n\
  a. `while`-循环\nb. `do`-循环\nc. `for`-循环\nd. `foreach`-循环\n\n## 实验练习\n\n### 问题 1\n\
