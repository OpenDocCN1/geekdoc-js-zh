  \n### 3.4 超全局数组\n\n超全局变量（Superglobals）是 PHP 内置的（预定义的）关联数组变量，于 PHP 4.1.0 版本引入。这些变量对所有\
  \ PHP 代码自动可用，这意味着不需要创建额外的程序使它们对整个 PHP 脚本公开。\n\n超全局变量代表来自 URL、HTML 表单、cookies、sessions\
  \ 以及 Web 服务器本身的数据。这些数组在函数内部也可以访问。\n\n需要更多帮助和参考，你可以访问以下 URL，这些网址提供了关于 PHP 的友好讨论：\n\
  \n- http://php.net/manual/en/index.php\n- http://www.w3schools.com/php/default.asp\n\
  \nPHP 超全局数组最常见的用途是从 HTML 表单获取值。以下是 9 个程序员可以使用的超全局数组，它们是：\n\n- `$_GET`\n- `$_POST`\n\
  - `$_REQUEST`\n- `$_COOKIE`\n- `$_SESSION`\n- `$_SERVER`\n- `$_ENV`\n- `$_FILES`\n\
  - `$_GLOBAL`\n\n由于我们在本书中本地服务器上操作，因此我们的讨论将限于 `$_GET`、`$_POST` 和 `$_REQUEST`，因为我们可以在本地服务器上下文中演示这三个超全局变量。\n\
  \n超全局变量 `$_GET` 代表来自 URL 并通过 get 协议发送到 PHP 脚本的数据。它是一个预定义变量，用于使用 get 方法从 HTML 表单收集值。`$_GET`\
  \ 包含通过 URL 参数传递给当前脚本的变量关联数组。\n\n**注意**：在发送密码或其他敏感信息时不，应使用 GET 方法，因为这些信息会被附加到 URL\
  \ 的末尾，并显示在 URL 的地址栏中，从而对全世界可见。它也不适用于非常大的变量值，不应用于处理超过 2000 个字符的值。\n\n在下行代码中，我们使用\
  \ `$_GET` 超全局变量来访问从表单传递的名为 `userName` 的参数。我们将该值赋值给本地变量 `$name`：\n\n```php\n$name\
  \ = $_GET['userName'];\n```\n\n`$_POST` 超全局变量代表来自表单并通过 post 协议发送到 PHP 脚本的数据。它是一个预定义变量，用于使用\
  \ post 方法从 HTML 表单收集值。`$_POST` 包含通过 URL 参数传递给当前脚本的变量关联数组。\n\n`$_COOKIE` 超全局变量代表来自\
  \ cookies 的数据。\n\n`$_SESSION` 超全局变量代表来自 sessions 的数据。\n\n`$_SERVER` 超全局变量代表来自 Web\
  \ 服务器的数据。\n\n`$_ENV` 超全局变量代表来自环境的数据。\n\n`$_FILES` 超全局变量代表来自上传文件的数据。\n\n`$_GLOBAL`\
  \ 超全局变量包含所有全局变量。\n\n让我们创建一个更广泛的示例，使用 `$_GET`、`$_POST` 和 `$_REQUEST`。\n\n### 步骤 1：创建一个基础表单\n\
