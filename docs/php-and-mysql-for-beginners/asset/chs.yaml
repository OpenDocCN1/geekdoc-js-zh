  \n![](img/00050.jpeg)\n图 3.14：调用数组的未定义成员会导致错误。\n\n没有显式赋值值的数组成员会被报告为“undefined offset”（未定义的偏移量）。解决此问题的一种良好方法是在当没有更多名称可以显示时显示空格。\n\
