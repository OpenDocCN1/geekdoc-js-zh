  ## 第 2 章：变量\n## 章节目标\n* 你将能够定义 PHP 变量和运算符。\n* 你将学习如何正确编写变量操作的代码。\n\n\n\n\n\n\n*\
  \ `$StudentNumber`\n* `$customer_1`\nPHP 中变量的声明与许多其他编程语言不同。如果你遇到过 `C`、`C++` 或 `Java`，你就知道变量的声明通常伴随着其数据类型的声明，例如\
  \ `string`、`int`、`float` 或 `double`。在 PHP 中，声明变量不需要声明其数据类型。只需要在变量名前面加上 `$`（美元）符号即可。为了说明，让我们声明一个名为\
  \ `age` 的变量。\n在其他语言中，声明如下：\n```c\n```\n但在 PHP 中，声明为：\n```php\n```\n显然，在 PHP 声明中不需要变量类型。这就是为什么\
  \ PHP 被称为“弱类型语言”的原因。PHP 根据你赋值的值 `21` 假设 `$age` 是一个整数类型的变量。此外，在弱类型语言中，一旦你存储了一个特定值，以后可以更改它。\n\
  \n让我们微调上一个示例，并引入浮点数的使用。\n打开 `variables.php` 文件，并从下面的代码列表中找到 PHP 脚本标签内部的代码行并添加：\n\
