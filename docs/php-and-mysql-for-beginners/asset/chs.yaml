  \ 的输出。\n\n如果条件表达式求值为 `FALSE`，上述示例会发生什么？尝试一下并看看结果。\n\n步骤 1：通过给 `$number` 赋值值 11 来调整变量赋值部分\n\
  \n```php\n<?php\n    $number = 11;\n?>\n```\n\n![](img/0145.jpeg)\n图 5.5: 将计数器变量\
  \ `$number` 的初始值改为 11。\n\n步骤 2：保存你的文档。\n\n步骤 3：运行你的输出。\n\n![](img/0146.jpeg)\n图\
  \ 5.6: 将 `$number` 的初始值改为 11 后空白输出。\n\n\n\n\n没有任何显示。这是因为条件表达式求值为为 FALSE（假）。这将导致循环的代码块被忽略，从而导致一个空白页面。\n\
  \n让我们尝试另一个例子。这次，我们将指示循环按 5 计数。\n\n### 问题\n创建一个 `while` 循环，从 0 到 50 每隔 5 计数一次。每个数字应该在单独的行显示。确保条件语句的初始值为\
