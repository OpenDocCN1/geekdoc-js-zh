  \ $gpa[\"Smith\"] . \".\");\necho(\"</br>\");\necho(\"Sam Rogers has an annual salary\
  \ of $\" . $gpa[\"Rogers\"] . \".\");\necho(\"</br>\");\necho(\"Drei Adam has an\
  \ annual salary of $\" . $gpa[\"Adam\"] . \".\");\necho(\"</br>\");\necho(\"Jim\
  \ Brown has an annual salary of $\" . $gpa[\"Brown\"] . \".\");\necho(\"</br>\"\
  );\n?>\n</body>\n</html>\n```\n\n图 3.8：使用关联数组输出列表。\n\n### 3.3 多维数组\n\n多维数组是元素本身也是数组的数组。多维数组包含多个“子数组”。多维数组的一个常见用途是计算机游戏。如果你考虑游戏的“关卡”，通常关于这些关卡的信息存储在一个或多个多维数组中。声明多维数组与声明关联数组相似，但不再是键和值，你仍然拥有键，但每个值都是数组。\n\
  \n让我们处理一个示例。让我们打开一个文件并检查代码示例以更好地理解这一概念。创建一个 HTML5 文档，并将其保存到 `www`（Windows, WAMP）或\
  \ `htdocs`（Mac, MAMP）文件夹中，名为 `multidimensional_array.php`。\n\n![](img/0045.jpeg)\n\
  \n图 3.9：Komodo 编辑首页。\n\n![](img/0046.jpeg)\n\n图 3.10：将新文档保存为 multidimensional_array.php。\n\
  \n确保你的文件中包含了 PHP 的脚本开始和结束标签。以下数组内容示例来自一个流行的角色扮演游戏。主数组是背包，子数组将是武器、护甲、可用物品、关键物品和魔法物品。每个子数组将是描述每个部分内容的关联数组。\n\
  \n武器将是一个包含以下成员的简单数组：\n\nKrasnaya,Executioner,Violet Fear,Atroce’s Blade\n\n```php\n\
  \"Weapon\" => array (\n    \"Krasnaya\",\n    \"Executioner\",\n    \"Violet Fear\"\
  ,\n    \"Atroce's Blade\"\n)\n```\n\n护甲数组将包含以下成员：\n\nLord Kaho’s Horns,Megingjard,Sleipnir,Dragon\
  \ Manteau,Ears of Ifrit\n\n\n\n\n\n```php\n\"Armors\" => array\n(\n    \"Lord Kaho's\
  \ Horns\",\n    \"Megingjard\",\n    \"Sleipnir\",\n    \"Dragon Manteau\",\n  \
  \  \"Ears of Ifrit\"\n),\n```\n\n`Useables`（可用物品）将包含以下成员：尤德拉希之果、狂暴药水、权限章、速度药水、万能药、诅咒水。\n\
  \n```php\n\"Useables\" => array\n(\n    \"Yggdrasil Berry\",\n    \"Berserk Potion\"\
  ,\n    \"Authoritative Badge\",\n    \"Speed Potion\",\n    \"Panacea\",\n    \"\
  Cursed Water\"\n),\n```\n\n`Key_Items` 数组将包含以下成员：大陆卫卫证书、黑暗之烬、龙牙、龙鳞、龙皮。\n\n```php\n\
  \"Key_Items\" => array\n(\n    \"Continental Guard Certificate\",\n    \"Ashes of\
  \ Darkness\",\n    \"Dragon Tooth\",\n    \"Dragon Scale\",\n    \"Dragon Skin\"\
  \n)\n```\n\n`Magic_Items` 数组将包含以下成员：10 级祝福卷轴、10 级敏捷卷轴、10 级假定卷轴。\n\n```php\n\"Magic_Items\"\
  \ => array\n(\n    \"Lvl10 Blessing Scroll\",\n    \"Lvl10 Increase AGI Scroll\"\
  ,\n    \"Lvl10 Assumptio Scroll\"\n)\n```\n\n现在多维数组已经填充了元素，我们可以展示如何调用每个数组。引用多维数组使用的语法为\
  \ `$variablename[subarray1][subarray2]`。在多维数组 `$backpack` 中实现时，这意味着：\n\n```php\n\
  $backpack = array\n    \"Weapons\" => array(\"Krasnaya\", \"Executioner\", \"Violet\
  \ Fear\"),\n    \"Armors\" => array (\"Lord Kaho's Horns\", \"Megingjard\", \"Sleipnir\"\
  , \"Ears of Ifrit\"),\n    \"Useables\" => array(\"Yggdrasil Berry\", \"Berserk\
  \ Potion\", \"Authoritative Badge\", \"Panacea\", \"Cursed Water\"),\n    \"Key_Items\"\
  \ => array(\"Continental Guard Certificate\", \"Ashes of Darkness\", \"Dragon Tooth\"\
  , \"Dragon Skin\"),\n    \"Magic_Items\" => array(\"Lvl10 Blessing Scroll\", \"\
  Lvl10 Increase AGI Scroll\", \"Lvl10 Assumptio Scroll\")\n```\n\n为了让上述多维数组更易读，你可能想要遵循以下格式：\n\
  \n```php\n$backpack = array(\n    \"Weapons\" => array(\n        \"Krasnaya\",\n\
  \        \"Executioner\",\n        \"Violet Fear\",\n        \"Atroce's Blade\"\n\
  \    ),\n    \"Armors\" => array(\n        \"Lord Kaho's Horns\",\n        \"Megingjard\"\
  ,\n        \"Sleipnir\",\n        \"Dragon Manteau\",\n        \"Ears of Ifrit\"\
  \n    ),\n    \"Useables\" => array(\n        \"Yggdrasil Berry\",\n        \"Berserk\
  \ Potion\",\n        \"Authoritative Badge\",\n        \"Speed Potion\",\n     \
  \   \"Panacea\",\n        \"Cursed Water\"\n    ),\n    \"Key_Items\" => array(\n\
  \        \"Continental Guard Certificate\",\n        \"Ashes of Darkness\",\n  \
  \      \"Dragon Tooth\",\n        \"Dragon Scale\",\n        \"Dragon Skin\"\n \
  \   ),\n    \"Magic_Items\" => array(\n        \"Lvl10 Blessing Scroll\",\n    \
  \    \"Lvl10 Increase AGI Scroll\",\n        \"Lvl10 Assumptio Scroll\"\n    )\n\
