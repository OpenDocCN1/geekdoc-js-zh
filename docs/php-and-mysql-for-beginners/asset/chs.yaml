  \    else\n        {\n            echo(\"You entered an invalid grade :( \");\n\
  \        }\n    ?>\n</body>\n</html>\n```\n\n### 步骤 1：创建一个新的 HTML5 文档。将你的文档保存为 `complexConditionals-2.php`。\n\
