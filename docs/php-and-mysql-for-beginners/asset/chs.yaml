  \ 从本地数据库查看的已保存用户信息。\n\n## 章节总结\n\n在本章中，你学习了执行文件输入/输出操作的 PHP 函数：创建文件、向文件写入数据、从文件读取数据以及删除文件。\n\
  \n在完成文件输入/输出操作的脚本过程中，你使用了接收数据的表单，并在将这些数据保存到文本文件之前，使用超全局数组获取了这些表单数据。你还使用了数组来显示从 csv\
  \ 格式文件中检索出来的数据。\n\n## 第 8 章：使用 PHP 发送电子邮件\n\n## 章节目标\n\n* 你将学习文本电子邮件与 HTML 电子邮件之间的区别。\n\
  * 你将学习如何下载并安装 `phpMailer` 扩展包。\n* 你将学习如何配置 `WAMPSERVER` 以与 `phpMailer` 扩展包配合工作。\n\
  * 你将编写 PHP 脚本，使用 `phpMailer` 向 Gmail 账户发送文本邮件和 HTML 电子邮件。\n\n## 8.1 使用 PHP 发送文本电子邮件\n\
  \n你是否好奇过，为什么你会收到来自如 `noreply@domain.com` 这种回信地址的邮件？或者为什么有人会给你发邮件，并通过其邮件地址暗示你不应该回复？实际上，来自此类地址的邮件是由你最近访问的网站自动生成并发送的。有时，这些邮件可能是收执确认，让你知道你下的订单或发送的邮件已收到。\n\
  \n你可能在某个网站上注册了新会员并开通了账户。然后该网站会给你发一封邮件确认你的注册，要求你执行某些活动以验证身份，并分配用户名和密码（你有权更改这些信息）。在其他你已经完成注册（甚至是付费会员）的网站上，你会定期收到有关任何影响你账户的活动的邮件通知。例如，`PayPal.com`\
  \ 会对其成员在网站上进行的每项活动发送邮件通知：购买、付款、资金转账等。\n\n所有这些邮件都是由网站应用程序自动生成的。它们必须自动创建并发送，否则将需要一个营级规模的团队来监控一个网站所有成员的所有活动。\n\
  \n电子邮件的发送和接收需要一个配置适当的邮件服务器。这是一个充当虚拟邮局的计算机程序。它可以运行在自己的专用硬件上，也可以与其他服务器程序共享硬件资源。它的设计目标是在正常运行期间自动执行，无需任何人工干预。\n\
  \n邮件服务器有两种类型：发信服务器和收信服务器。发信服务器处理所有发出的邮件并实现 `SMTP`（简单邮件传输协议），而收信服务器处理所有收到的邮件并实现 `POP3`（邮局协议第三版）或\
  \ `IMAP`（互联网消息访问协议）。\n\n`POP3` 收信服务器将发送和接收的消息存储在客户端的硬盘上。这迫使用户只能从一个设备或位置访问和处理电子邮件。然而，`IMAP`\
  \ 收信服务器将消息存储在服务器上，因此允许用户从任何位置或任何设备访问电子邮件。\n\n发送和接收电子邮件涉及收发邮件服务器之间多个级别的通信，这一过程确保了邮件到达正确的收件者。\n\
  \n提示：要了解更多关于邮件服务器传输和接受电子邮件的细节，你可以访问 `http://computer.howstuffworks.com/e-mail-messaging/email.htm`\
  \ 查看“电子邮件是如何工作的”，访问 `http://www.howtogeek.com/56002/htg-explains-how-does-email-work`\
  \ 查看“电子邮件到底是如何工作的？”。\n\nPHP 允许你直接通过脚本创建并发送电子邮件。下表提供了 `mail()` 函数的详细信息。\n\n| 参数 |\
  \ 说明 |\n| :--- | :--- |\n| `$to` | 必需。邮件的收件人。 |\n| `$subject` | 必需。邮件的主题。 |\n| `$message`\
  \ | 必需。实际消息内容。 |\n| `$headers` | 可选。额外的头部，如 `Cc` 或 `Bcc`。 |\n| `$parameters` | 可选。额外的参数。\
  \ |\n\n如果邮件发送成功，`mail()` 函数返回布尔值 `TRUE`，否则返回 `FALSE`。\n\n语法为：\n`mail($to, $subject,\
  \ $message, $headers, $parameters)`\n\n第 1 ：打开一个空白 HTML 文并保存为 `simpleEmail.php`。\n\
  \n第 2 ：在 `<body>` 部分添加 PHP 的开始和结束标签。\n\n第 3 ：根据下表，编写赋值语句，将第二列的值赋给第一列中的变量。例如，对于表格中的第一行，代码应该是：\n\
  \n| 变量 | 字符串值 |\n| :--- | :--- |\n| `$to` | `\"someone@e-mail.com\"` |\n| `$subject`\
  \ | `\"Feedback for you.\"` |\n| `$message` | `\"This is a test e-mail created using\
  \ php\"` |\n| `$from` | `\"test@learntoprogram.tv\"` |\n| `$headers` | `\"From:\"\
  \ . $from` |\n\n完整的代码列表如下：\n\n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <title>A\
  \ Simple Text e-mail</title>\n</head>\n<body>\n<?php\n    $to = \"someone@e-mail.com\"\
  ;\n    $subject = \"Feedback for you.\";\n    $message = \"This is a test e-mail\
  \ created using php\";\n    $message .= \"from LearnToProgram.tv\";\n    $from =\
  \ \"test@learntoprogram.tv\";\n    $headers = \"From:\" . $from;\n    $retval =\
  \ mail ($to, $subject, $message, $headers);\n    if ($retval) {\n        echo (\"\
  Mail has been sent!\");\n    } else {\n        echo (\"Mail has not been sent!\"\
  );\n    }\n?>\n</body>\n</html>\n```\n\n第 4 ：保存你的文件并尝试查看你的输出。\n\n现在，当你运行此脚本时，你会得到下方截图所示的错误信息。\n\
  \n![](img/00256.jpeg)\n\n图 8.1: `simpleEmail.php` 的输出。\n\n\n\n\n你之所以得到这个错误是因为 `WAMPSERVER`\
  \ 没有配置邮件服务器作为其组件之一。那么，一个安装了 `WAMPSERVER` 的初级 PHP 程序员如何测试发送电子邮件的 PHP 脚本呢？\n\n意乎所料，解决方案随处可见！如果你在\
  \ Google 中输入“使用 PHP 从 WAMPSERVER 发送邮件”，你会发现进取的 Web 程序员提供的几种替代方案。其中一些方案可以追溯到两多年前，而有一一两个是今年才提出的。（这些不同的解决方案甚至有相同的名称，即“sendmail”，这可能会导致一些困惑！）\n\
  \n从直觉上，我们不仅想选择最新的解决方案，还想要一个易于实现的解决方案。幸运的是，我们在非常流行的 `PHPMailer` 中拥有这一点。以下是摘自 [PHPMailer\
  \ 教程](https://code.google.com/a/apache-extras.org/p/phpmailer/wiki/UsefulTutorial)\
  \ 的简要描述。\n\n“PHPMailer 是一个用于 PHP (www.php.net) 的 PHP 类，提供了一包发送电子邮件的函数。其两个主要功能是发送\
  \ HTML 电子邮件和带附件的电子邮件。PHPMailer 支持几乎发送邮件的所有可能：`mail()`、`Sendmail`、`qmail` 以及直接发送到\
  \ SMTP 服务器。你可以使用基于 SMTP 电子邮件的任何功能，通过 `to`、`CC`、`BCC` 等设置多个接收者。简而言之：PHPMailer 是 PHP\
  \ 中发送电子邮件的高效方式。”\n\n正如从描述所示，`PHPMailer` 是一个用于 PHP 脚本发送电子邮件的完整且功能丰富的包。尽管我们想检查并测试\
  \ `PHPMailer` 的所有功能和能力，但考虑到本书的限制，这将是不现实的。\n\n现在我们将向你展示如何使用 `PHPMailer` 向 Gmail 地址发送纯文本电子邮件和\
  \ HTML 电子邮件。接下来的步骤将指导你下载并安装 `PHPMailer`、配置 `WAMPSERVER` 与 `PHPMailer` 工作以及编写脚本。\n\
  \n### 步骤 1：下载 PHPMailer/SMTP\n从 [`github.com/PHPMailer/PHPMailer`](https://github.com/PHPMailer/PHPMailer)\
  \ 下载。以下屏幕显示了 `PHPMailer` 的 GitHub 页面以及下载按钮所在的位置。你将获得一个名为 `PHPMailer-master.zip`\
  \ 的文件，大小约为 200kb。\n\n![](img/00257.jpeg)\n图 8.2：GitHub PHPMailer 下载页面的左上部分，地址为 [`github.com/PHPMailer/PHPMailer`](https://github.com/PHPMailer/PHPMailer)。\n\
  \n![](img/00258.jpeg)\n图 8.3：GitHub PHPMailer 下载页面的右下部分的下载按钮，地址为 [`github.com/PHPMailer/PHPMailer`](https://github.com/PHPMailer/PHPMailer)。\n\
  \n### 步骤 2：解压\n将 `PHPMailer-master.zip` 解压到文件夹中。\n\n### 步骤 3：复制脚本\n在解压压的 `PHPMailer-master.zip`\
  \ 文件夹中，找到以下三个脚本，并将它们复制到 Windows 中的 `c:/wamp/www` 文件夹（或 Mac 和 Linux 系统上的对应文件夹）。\n\
  \n1. `PHPMailerAutoload.php`\n2. `class.phpmailer.php`\n3. `class.smtp.php`\n\n\
  ### 步骤 4：启用 Apache SSL\n在 `WAMPSERVER` 菜单中，通过访问如下所示的 `httpd.conf` 文件启用 Apache 的\
  \ `ssl_module`。\n\n![](img/00259.jpeg)\n图 8.4：在 WAMPSERVER 菜单中访问 httpd.conf 文件。\n\
  \n### 步骤 5：配置 httpd.conf\n在 `httpd.conf` 文件中取消以下行的注释。（要取消注释请删除行开头的“#”符号。）\n\n```\n\
  #LoadModule ssl_module modules/mod_ssl.so\n```\n取消注释后的行如下所示所示。\n\n![](img/00260.jpeg)\n\
  图 8.5：取消注释以启用 ssl_module\n\n或者，你也可以通过 `WAMPSERVER` 菜单选项 `Apache` -> `Apache Modules`\
  \ -> `ssl_module` 启用 `ssl_module`，如下所示所示。\n\n![](img/00261.jpeg)\n图 8.6：在 WAMPSERVER\
  \ 菜单中启用 Apache ssl_module。\n\n### 步骤 6：启用扩展\n在 `WAMPSERVER` 菜单中，如下所示所示启用 PHP 的 `php_openssl`、`php_smtp`\
  \ 和 `php_sockets` 扩展。\n\n![](img/00262.jpeg)\n图 8.7：在 WAMPSERVER 菜单中为 PHP 启用 php_openssl、php_smtp\
  \ 和 php_sockets 扩展。\n\n### 步骤 7：重启\n重启 `WAMPSERVER` 使你的更改生效。\n\n![](img/00263.jpeg)\n\
  图 8.8：重启 WAMPSERVER\n\n### 步骤 8：测试安装\n你可以通过执行此代码来测试 `PHPMailer` 是否安装正确，该代码应该只会产生一个空白浏览器页面。\n\
  \n```php\n<?php\n```\n\n### 步骤 9：创建脚本\n将以下内容粘贴到 Komodo Edit 并保存为 `emailText.php`。\n\
  \n```php\n<?php\nrequire('PHPMailerAutoload.php');\n$mail = new PHPMailer();\n$mail->isSMTP();\n\
  $mail->Host = 'smtp.gmail.com';\n$mail->Port = 465;\n$mail->TPSec = 'ssl';\n$mail->Username\
  \ = 'username@gmail.com';\n$mail->Password = 'password';\n$mail->isHTML(false);\n\
  $mail->SingleTo = false;\n$mail->From = 'email address';\n$mail->FromName = 'sender';\n\
  $mail->addAddress('added email address');\n$mail->Subject = 'Testing PHPMailer';\n\
  $mail->Body = 'Hi,This system is working.';\n\nif (!$mail->Send()) {\n    echo \"\
  Message was not sent. Error: \" . $mail->ErrorInfo;\n} else {\n    echo \"Message\
  \ has been sent\";\n}\n```\n\n### 步骤 10：调整凭据\n在以下行中调整 `Username` 和 `Password` 值。\n\
  \n```php\n$mail->Username = 'username@gmail.com';\n$mail->Password = 'password';\n\
  ```\n\n### 步骤 11：完成\n在以下行中，将 `From` 和 `FromName` 字符串调整为适合的值，并在 `addAddress` 函数中也是。\n\
  \n```php\n$mail->From = 'email address';\n$mail->FromName = 'sender';\n$mail->addAddress('added\
  \ email address');\n```\n运行脚本。在浏览器中，你应该看到：Message has been sent。\n\n8. 发送 HTML 电子邮件\n\
  HTML 电子邮件包含一个很小的 HTML 标签集，但对于哪些 HTML 标签组成子集并没有标准。因此，不同的电子邮件客户端处理的 HTML 标签不同。\n\n\
  当 HTML 电子邮件最初出现时，由于许多原因对其存在反对意见。一个原因是安全性，因为可以将恶意代码注入 HTML 电子邮件中。但邮件附件也可以进行同样的恶意行为。尽管如此，HTML\
  \ 电子邮件的使用已经普及，邮件附件仍在发送，因此对 HTML 电子邮件的反对已变成无奈。\n\nHTML 电子邮件的格式和结构与标准文本电子邮件相似，区别在于额外的头部属性。为了编写发送\
  \ HTML 电子邮件的脚本，我们将通过添加几行创建发送 HTML 电子邮件所需的头部来修改发送纯文本电子邮件的脚本。这两个头部是：\n\n`MIME-Version\
  \ : 1.0` 此头部用于发送包含以下内容的电子邮件：\n1. 非 ASCII 文本字符集\n2. 非文本附件（图片、音乐文件、视频文件等）\n3. 多个部分的消息正文，或\n\
  4. 非 ASCII 字符集的头部信息\n\n`Content-Type text/html; charset=ISO-8859-1` 此头部定义了你的 HTML\
  \ 电子邮件使用的字符编码。这是因为程序在验证或显示 HTML 文档之前必须选择一种字符编码。对于英语和其他大多数其他西方语言的文档，通常使用广泛支持的 ISO-8859-1\
  \ 编码。\n\n这两个新头部将是你 PHP 脚本中的新增内容，以及嵌入邮件消息部分的 HTML 标签。\n\n\n\n现在，好消息来了！有了 `phpMailer`，你不需要再费心处理刚刚过的那些额外标头了！\n\
  \n### 第 1 步：获取 `sendEmailText.php` 并将其另存为 `sendEmailHtml.php`。\n\n### 第 2 步：将 `IsHTML`\
  \ 函数的参数设置为 `TRUE` 或添加以下行：\n\n```php\n$mail->IsHTML(true);\n```\n\n### 第 3 步：将 `Body`\
  \ 和 `AltBody` 设置为以下字符串值。\n\n```php\n$mail->Body = \"Hello, <b>my friend</b>! \\\
  n\\n This message uses HTML entities!\";\n\n$mail->AltBody=\"Hello, my friend! \\\
  n\\n This message uses HTML entities, but you prefer plain text !\";\n```\n\n这就是完整的代码列表应该有的样子：\n\
  \n#### 代码列表：sendEmailHtml.php\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>HTML\
  \ E-mail</title>\n</head>\n<body>\n  <?php\n    require('class.phpmailer.php');\n\
  \    $mail = new PHPMailer();\n    $mail->IsSMTP();\n    $mail->Mailer = 'smtp';\n\
  \    $mail->SMTPAuth = true;\n    $mail->Host = 'smtp.gmail.com';\n    $mail->Port\
  \ = 465;\n    $mail->SMTPSecure = 'ssl';\n    $mail->Username = \"username@gmail.com\"\
  ;\n    $mail->Password = \"password\";\n    $mail->IsHTML(true);\n    $mail->SingleTo\
  \ = false;\n    $mail->From = \"email address of sender\";\n    $mail->FromName\
  \ = \"username of sender\";\n    $mail->addAddress(\"added email address\",\"added\
  \ username\");\n    $mail->Subject = \"An HTML Message\";\n    $mail->Body = \"\
  Hello, <b>my friend</b>! \\n\\n This message uses HTML entities!\";\n    $mail->AltBody=\"\
  Hello, my friend! \\n\\n This message uses HTML entities, but you prefer plain text\
  \ !\";\n    if(!$mail->Send())\n      echo \"Message was not sent <br />PHPMailer\
  \ Error: \" . $mail->ErrorInfo;\n    else\n      echo \"Message has been sent\"\
  ;   \n  ?>\n</body>\n</html>\n```\n\n## 章节测试\n\n1. 在 PHP 中哪一个对应电子邮件的收件者？\n   a.\
  \ `$to`\n   b. `$from`\n   c. `$header`\n   d. `$message`\n\n2. `mail()` 函数的作用是什么？\n\
  \   a. 它通过服务器使用 PHP 发送和接收电子邮件。\n   b. 它读取邮件并通知用户他们的邮件。\n   c. 它向指定的收件者发送 PDF 格式的文件。\n\
  \   d. 它将电子邮件副本发送到用户地址簿中的所有地址。\n\n3. `SMTP` 是什么意思？\n   a. 简单邮件传输协议 (Simple Mail\
  \ Transfer Protocol)。\n   b. 简单妈妈裁缝协议 (Simple Mommy Tailoring Protocol)。\n   c.\
  \ 超级邮件传输协议 (Super Mail Transfer Protocol)。\n   d. 单一邮件传输校验位 (Single Mail Transmit\
  \ Parity)。\n\n4. 什么是 HTML 电子邮件？\n   a. 一种嵌入了 HTML 标签的电子邮件。\n   b. 一种使用 HTML 创建的电子邮件。\n\
  \   c. 通过 HTML 页面发送的电子邮件。\n   d. 一种嵌入在 HTML 文档中的、纯 Javascript 生成的电子邮件。\n\n5. 标头\
  \ `MIME Version` 的作用是什么？\n   a. 该标题表示邮件包含除 ASCII 文本字符以外的字符。\n   b. 通用描述内容类型，包括网页内容以及作为某些商业产品中富内容的存储。\n\
  \   c. 为服务器模拟（Mimes）邮件。\n   d. 复制邮件内容并保存到服务器上。\n\n6. 内容类型 `text/HTML` 标头的作用是什么？\n\
  \   a. 它声明邮件正文将同时包含 HTML 和纯文本。\n   b. 它允许在电子邮件中使用 PHP 脚本。\n   c. 它允许在电子邮件中使用 Javascript。\n\
  \   d. 它定义了 HTML 电子邮件将使用的字符编码。\n\n## 章节实验练习\n\n**问题：** 使用 PHP 创建一个 HTML 电子邮件，发送以下\
  \ HTML 电子邮件。使用并将以下值赋值给其适当的变量参数。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h1>This\
  \ is Chapter 8 Lab Exercise HTML test e-mail</h1>\n  <p><strong>Such an easy Lab\
  \ Exercise! </strong></p>\n</body>\n</html>\n```\n\n**解决方案：**\n\n#### 代码列表：Chapter\
  \ 8 Lab Exercise Solution.\n`chap8Lab.php`\n\n```php\n<?php\n    require('class.phpmailer.php');\n\
  \    $mail = new PHPMailer();\n    $mail->IsSMTP();\n    $mail->Mailer = 'smtp';\n\
  \    $mail->SMTPAuth = true;\n    $mail->Host = 'smtp.gmail.com';\n    $mail->Port\
  \ = 465;\n    $mail->SMTPSecure = 'ssl';\n    $mail->Username = \"username@gmail.com\"\
  ;\n    $mail->Password = \"password\";\n    $mail->IsHTML(true);\n    $mail->SingleTo\
  \ = false;\n    $mail->From = \"email address of sender\";\n    $mail->FromName\
  \ = \"username of sender\";\n    $mail->addAddress(\"added email address\",\"added\
  \ username\");\n    $mail->Subject = \"An HTML Message\";\n    $mail->Body = \"\
  Hello, <b>my friend</b>! \\n\\n This message uses HTML entities!\";\n    $mail->AltBody=\"\
  Hello, my friend! \\n\\n This message uses HTML entities, but you prefer plain text\
  \ !\";\n    if(!$mail->Send())\n      echo \"Message was not sent <br />PHPMailer\
  \ Error: \" . $mail->ErrorInfo;\n    else\n      echo \"Message has been sent\"\
  ;   \n?>\n```\n\n## 章节总结\n\n在本章中，你学习了纯文本和 HTML 的区别。为了发送邮件，你学习了如何配置 `phpMailer`。在下一章中，我们将讨论最流行的开源关系型数据库管理系统。\n\
  \n#### 第 9 章：使用 MySQL \n\n**目标：**\n\n* 使用 `phpMyAdmin` 创建 MySQL 数据库。\n* 使用 `phpMyAdmin`\
  \ 在 MySQL 数据库中创建表。\n* 开发一个简单的 CRUD（创建、查询、删除）应用程序。\n* 学习使用 HTML 表单和 PHP 脚本向 MySQL\
  \ 数据库输入和更新数据。\n* 构建 SQL Insert、Update 和 Delete 语句，并使用 PHP 脚本在 MySQL 中执行这些语句。\n*\
  \ 使用一种名为 `MySQLi` 的应用程序编程接口，它将允许你的 PHP 脚本访问 MySQL 数据库。\n\n数据库是计算机的骨干。计算机系统的主要任务是存储、组织、更新、保护并以多种方式检索数据。计算机系统将数据存储在数据库中。\n\
  \n数据库有许多分类：层次型、平文件、网络型、分布式等。它们的区别在于工作方式以及用途。在业务应用程序中，最常用的类型是关系型数据库。之所以这样命名，是因为关系型数据库的表不仅存储数据，还存储数据之间的关系。\n\
  \n提示：你可能会遇到数据库管理系统的术语，`dbms`，它包含了管理数据库中数据的软件工具和实用程序。现在，这两个术语经常互换。\n\n\n\n\n# 数据库概念\n\
  \n**字段 (Fields)** – 这是列（column）的另一种说法。有时，字段指的是特定行的列。\n\n**记录 (Record)** - 这是行（row）的另一种说法。\n\
  \n**值 (Value)** – 值是给定行和列中的数据。\n\n此时，为了帮助你直观地理解和理解表、列、行、字段、记录和值这些术语，我们展示了两个表的示意图——`Employee`\
  \ 和 `Department`。（我们将在稍后的代码示例中创建这些表。）\n\n| empId | lastName | firstName | department\
  \ | position | salary |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 001 | Smith\
  \ | George | 1 | S Acct | 84000 |\n| 002 | Valera | Linda | 2 | J Sales | 55000\
  \ |\n\n表 9.1：Employee 表\n\n`Employee` 表有六列（或字段）和两行数据。（第一行作为视觉辅助列名，不属于表格的一部分。）\n\n\
  | departmentId | departmentName |\n| :--- | :--- |\n| 1 | Accounting |\n| 2 | Sales\
  \ |\n| 3 | Operations |\n| 4 | Management |\n\n表 9.2：Department 表\n\n`Department`\
  \ 表有两个列（或字段）和四行数据。\n\n**关系 (Relationship)** – 关系是两个表之间的链接。它是组织数据的一种强大方法。你通过在两个表的字段之间建立链接来定义关系（其中一个或两个字段是主键字段）。例如，我们可以通过链接\
  \ `Employee` 的 `department` 字段和 `Department` 的 `departmentId` 字段，在之前的两个表 `Employee`\
  \ 和 `Department` 之间建立关系。这种关系使得两个表的数据作为一个整体可用。\n\n一个表拥的关系数量取决于它与其他表相关的字段数量。例如，将 `Employee`\
  \ 的六个字段每一个都链接到数据库中的其他表是可能的，但并实际实际。\n\n**连接 (Join)** – 这是关系的另一种说法。\n\n**键 (Key)**\
  \ – 这是表上的一个列或若干列，在其上构建索引以便快速和/或排序排序访问表数据。\n\n**索引 (Index)** – 这是数据库系统用于更快速定位数据的内部系统。在表中，你可以指定某些列（通常是键）为索引。与关系或连接一样，为表的每一列创建索引是可能的，但并不实际实际。\n\
  \n**主键 (Primary key)**– 这是给定表中的一个列或一组列，用于唯一标识表中的每一行。为了唯一标识某一行，任何两个主键不能具有相同的值。在我们的示例表中，字段\
  \ `empId` 是 `Employee` 表的主键，而 `Department` 表的主键是 `departmentId`。\n\n**外键 (Foreign\
  \ key)** – 这是表中的一个或多个列，旨在仅包含与引用表中的相关主/唯一键列（列）匹配的值。外键和主键显式地定义了表与表之间的直接关系。在我们的示例表中，`Department`\
  \ 表的主键列 `departmentId` 与 `Employee` 表的外键列 `department` 建立了关系。\n\n提示：有关更多与数据库相关的术语，你可以查看\
  \ 数据库术语 - 前 145 个常用数据库术语字典。\n\n在本章中，我们将向你介绍一种名为 `MySql` 的开源关系型数据库。（它的读音可以是 My S-Q-L\
  \ 或 My Sequel。）它是许多共享主机服务的流行标准，并运行在许多平台上——各种 Unix/Linux 版本、Windows 和 Mac OS X。它可以与许多编程语言一起使用——PHP、Java、C#、ASP、Visual\
  \ Basic 等。\n\n访问存储在 `MySQL` 数据库中的数据是通过 SQL（结构化查询语言）完成的，它开发于 20 世纪 70 年，现在是所有数据库的标准，尽管不同的实现存在细微差异。\n\
  \n也可以通过 PHP 使用 API（应用程序接口）或扩展来访问 `MySQL`。\n\n# 9.1 设置数据库\n\n在本节中，我们将创建一个数据库。然后我们将在该数据库中创建两个表（我们之前演示的两个表——`Employee`\
  \ 和 `Department`），然后在这两个表中存储一些示例数据。为了完成所有这些操作， WAMPSERVER 提供了两个工具——`MySQL Console`\
  \ 和 `PhpAdmin`。我们将使用后者，但首先让我们涵盖关于 `MySQL Console`的一些介绍细节。\n\n从 WAMPSERVER 菜单启动 `MySQL\
  \ Console`，点击 `MySQL`，然后点击如下截图所示的 `MySQL console`。\n\n![](img/00264.jpeg)\n\n图 9.1：WAMPServer\
