  );\n    echo($name[1] . \" was approximately born in the year \" . $yob[1].\".\"\
  );\n    echo(\"</br>\");\n?>\n```\n\n## 章节总结\n\n在本章中，我们讨论了数组。你学习了 PHP 有两种类型的数组：简单数组（索引数组）和关联数组。你学习了多维数组是嵌套在数组中的数组，并且\
  \ PHP 提供了对全局作用域关联数组的访问，称为超全局数组。\n\n我们列出了九个立即可用的超全局变量，并讨论了三个：`$_GET`、`$_REQUEST`\
  \ 和 `$_POST`。另外六个超全局变量只能在远程服务器上运行和测试。\n\n在下一章中，我们将讨论 PHP 的条件语句。\n\n# 4：控制结构 - 分支\n\
  \n## 章节目标\n\n- 你将学习表达式、条件表达式、操作数、操作符、比较运算符和逻辑运算符的精确定义，并学习相关示例。\n- 你将能够理解并分析 PHP\
  \ 中使用的分支控制结构。\n- 你将能够理解 PHP 分支控制结构中使用的条件语句之间的区别。\n- 你将学习三元运算符并使用它编写紧凑的 PHP 代码。\n\
  - 你将在各种 PHP 脚本中应用条件语句和分支控制结构。\n\n### 4.1 简单控制结构—if 语句\n\n在计算机编程中，控制结构允许你改变程序语句的执行流。与其逐行顺序执行，不如让程序能够：\n\
  \na. 跳过特定的代码行或代码块（分支），或\n\nb. 重复执行一组行或代码块（循环）。\n\n程序通过评估条件表达式为 TRUE（真）或 FALSE（假）来执行这些分支或循环动作。\n\
  \n在本章中处理分支控制结构，而循环控制结构将是第 5 章的主题。\n\n分支控制结构由：\n\na. 一个条件表达式和一个定义明确的代码块，或者 b. 多个条件表达式和多个定义明确的代码块组成。\n\
  \n根据条件表达式评估为 TRUE 还是 FALSE，将执行这些代码块中的任何一个或都不执行。\n\n**提示**：一个代码块由大括号 `{}` 隔开的一个或多个程序语句组成。如果代码块中只有一个语句，则不需要大括号。然而，为了清晰和可读性，通常始终使用大括号。\n\
  \n让我们来看看最简单的分支控制结构——if 语句。它的语法如下：\n\n```php\nif (conditional-expression) {\n   \
  \ statements . . .\n}\n```\n\nif 语句后的语句...\n\n如果条件表达式（conditional-expression）在评估时结果为布尔值\
  \ TRUE，则大括号括围的语句块将被执行。否则（意味着如果评估条件表达式的结果为布尔值 FALSE），该语句块将被忽略，程序执行将跳到 if 语句代码块之后的下一个\
  \ if 语句。\n\n现在，让我们检查条件表达式。首先，我们必须理解什么是表达式。\n\n在 PHP 中，表达式是变量、常量、字面量、操作符、对象甚至函数的任何有效组合，可以被评估以产生一个值。这个值可以是\
  \ PHP 八种数据类型中的任意一种：整数、浮点数、字符串、布尔、数组、对象、资源（或句柄）和空（空）。\n\n如何评估表达式？最简单且最常用的方法是将表达式放在赋值语句的右侧：\n\
  \n```php\n$variable = expression\n```\n\n当执行此赋值语句时，右侧的表达式将被评估，其值将存储在左侧的 `$variable`\
  \ 中。通过使用变量存储表达式评估的结果，你可以在程序的后续任何位置使用该值。\n\n现在，所有表达式都至少包含一个操作数和一个或多个操作符。\n\n操作符是指定要执行特定动作的符号。该动作通常会产生一个新值。\n\
  \n操作数是接收操作符动作的对象。大多数情况下，操作数是一个变量，但也可以是字面量、对象、函数或任何操作符可以有效执行动作的对象。\n\n**提示**：PHP\
  \ 操作符可以分为十组，即：算术、数组、赋值、位运算、比较、错误控制、执行、逻辑、字符串以及递增/递。\n\n最简单的表达式是字面量和变量。这些是仅包含一个操作数且没有操作符的表达式。字面量表达式评估结果为本身，而变量评估结果为其中存储的值。\n\
  \n**提示**：字面量是通过其实际值表示的单个值（不是通过变量引用）。例如，`1` 和 `\"string\"` 是字面量。\n\n让我们取表达式：\n\n\
  ```php\n$days++\n```\n\n它由递增运算符 `++` 和操作数 `$days` 组成。递增运算符对操作数加 1。如果 `$days` 存储的值是\
  \ 7，评估此表达式将返回 8。\n\n这是另一个表达式：\n\n```php\n$cost + $margin\n```\n\n它由两个操作数：变量 `$cost`\
  \ 和 `$margin` 以及加法运算符 `+` 组成。该表达式将加变量 `$cost` 和 `$margin` 中的值。为了使此表达式有用，它必须是赋值语句的一部分，例如：\n\
  \n```php\n$sellingPrice = $cost + $margin\n```\n\n现在，上述赋值语句右侧表达式评估的结果存储在变量 `$sellingPrice`\
  \ 中。\n\n这是一个没有操作符的表达式示例：\n\n```php\nstrtoupper($str)\n```\n\n该表达式由字符串函数 `strtoupper()`\
  \ 和变量 `$str` 组成。`strtoupper()` 将字符串的所有字符转换为大写。如果 `$str` 存储的是“LearnTo”，那么 `strtoupper($str)`\
  \ 将返回“LEARNTO”。原始的内容保持不变，因此如果你想使用修改后的字符串“LEARNTO”，你需要将表达式 `strtoupper($str)` 放入赋值语句：\n\
  \n```php\n$newstr = strtoupper($str)\n```\n\n现在，评估为布尔值 TRUE 或 FALSE 的表达式被称为条件表达式。此外，条件表达式专门使用比较运算符和逻辑运算符。\n\
  \n比较运算符允许你在条件表达式以各种方式比较两个操作数。如果比较测试成功，条件表达式评估为 TRUE；否则，评估为 FALSE。\n\n下表列出了 PHP 中不同的比较运算符及其在\
  \ PHP 中的描述。\n\n| 运算符 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| `==` (等于) | `$LS ==\
  \ $RS` | 如果存储在 `$LS` 中的操作数等于 `$RS` 中的操作数，则为 TRUE；否则为 FALSE。 |\n| `!=` 或 `<>` (不等于)\
  \ | `$LS != $RS` 或 `$LS <> $RS` | 如果存储在 `$LS` 中的操作数不等于 `$RS` 中的操作数，则为 TRUE；否则为 FALSE。\
  \ |\n\n\n\n\n\n| 运算符 | 表达式 | 描述 |\n| :--- | :--- | :--- |\n| `===` (全等) | `$LS ===\
  \ $RS` | 如果 `$LS` 中存储的操作数不仅等于 `$RS` 中存储的操作数，而且类型也相同，则为 TRUE；否则为 FALSE。 |\n| `!==`\
  \ (全不等) | `$LS !== $RS` | 如果 `$LS` 中存储的操作数不仅等于 `$RS` 中存储的操作数，而且类型也相同，则为 TRUE；否则为\
  \ FALSE。 |\n| `>` (大于) | `$LS > $RS` | 测试运算符左侧的操作数是否大于运算符右侧的操作数。 |\n| `<` (小于) |\
  \ `$LS < $RS` | 测试运算符左侧的操作数是否小于运算符右侧的操作数。 |\n| `>=` (大于等于) | `$LS >= $RS` | 测试运算符左侧的操作数是否大于或等于运算符右侧的操作数。\
  \ |\n| `<=` (小于等于) | `$LS <= $RS` | 测试运算符左侧的操作数是否小于或等于运算符右侧的操作数。 |\n\n逻辑运算符允许你组合条件表达式以产生\
  \ TRUE 或 FALSE 的布尔结果。\n\n| 运算符 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| AND | `exp1\
  \ AND exp2` | 仅当 `exp1` 和 `exp2` 都求值为 TRUE 时，为 TRUE；否则为 FALSE。 |\n| `&&` | `exp1\
  \ && exp2` | |\n| OR | `exp1 OR exp2` | 如果 `exp1` 和 `exp2` 中任一求值为 TRUE 或者 `exp1`\
  \ 和 `exp2` 都为 TRUE，则为 TRUE；仅当 `exp1` 和 `exp2` 都为 FALSE 时为 FALSE。 |\n| `||` | `exp1\
  \ || exp2` | |\n\n现在让我们来看一些条件表达式。\n\n第一个是一个非常简单的 PHP 条件表达式：\n\n```php\n$age <= 21\n\
  ```\n\n它由变量 `$age`、比较运算符 `<=`（小于等于）和整数值 `21` 。如果变量 `$age` 的值在 21 到任何小于 21 的范围内，将产生\
  \ TRUE。如果变量 `$age` 的值大于 21，则该条件表达式将产生 FALSE。\n\n第二个例子就不那么简单：\n\n```php\n$char >=\
  \ ”A” and $char<=”Z”\n```\n\n如果变量 `$char` 存储从 “A” 到 “Z” 的任何大写字母，则将产生 TRUE。\n\n最后一个一个是一个复杂的条件表达式：\n\
  \n```php\n( ( ( $year % 4 == 0 ) && ( $year % 100 != 0 ) ) || ( $year % 400 == 0\
  \ ) )\n```\n\n如果存储在 `$year` 中的值是闰年，则返回 true；否则返回 false。\n\n现在我们已经涵盖了定义并研究了表达式、条件表达式、操作数、运算符、比较运算符和逻辑运算符，现在我们来看\
  \ PHP 的条件语句。\n\nPHP 有三种基本的条件语句，可以使用它们来创建分支控制结构：\n\na. `if`-语句，\nb. `if-else-` 和\
  \ `if-elseif-`语句，以及\nc. `switch`-语句。\n\n### 4.2 If-语句\n\n`if`-语句求值条件表达式。如果为 TRUE，则执行\
  \ `if`-语句后面的代码块。否则，忽略该代码块。在 TRUE 或 FALSE 的任何情况下，执行都将继续到代码块之后的语句。\n\n`if`-语句的语法如下：\n\
  \n```php\nif (conditional expression){\n    code block of statements . . .\n}\n\
  ```\n\n### if 之后的语句\n\n让我们来完成一个例子。\n\n**问题：** 创建一个短的 PHP 程序，根据以下信息判断某人是否有权投票。\n\n\
  | 变量名 | 值 | 类型 |\n| :--- | :--- | :--- |\n| `$age` | 19 | 整数 |\n| `$isCitizen` |\
  \ TRUE | 布尔 |\n\n**解决方案：**\n\n**第 1 步：** 创建一个新的 HTML5 文档。在文档 `<body>` 中包含 PHP 的开始和结束标签。将文档命名为\
  \ `conditionals.php`。请参考随附图片进行指南。\n\n![](img/00078.jpeg)\n图 4.1: Komodo Edit 首页。\n\
