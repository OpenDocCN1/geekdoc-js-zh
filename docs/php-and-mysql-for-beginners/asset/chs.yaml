  \ 章总结\n\n这一章包含了大量的概念和技术。除了学习额外的 PHP 代码外，你还学习了如何使用 Web 应用程序 phpMyAdmin 对 MySQL 数据库进行数据库操作。你学习了如何构建\
  \ `SQL` 语句来在 MySQL 数据库中执行插入、更新和删除操作。你学习了如何使用应用程序编程接口（API），以便你的 PHP 代码能够访问数据库。通过所有这些方法，你构建了一个基础的\
  \ CRUD（创建、更新、删除）应用程序。关于使用 PHP 访问数据库，仍有很多内容需要学习和掌握，但如果你理解了这里的概念和技术，你已经在通往专家的道路上了。\n\
