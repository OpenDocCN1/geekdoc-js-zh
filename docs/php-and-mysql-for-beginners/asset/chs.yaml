  \ MySQL\n- 初学者 Python\n- Swift 基础：iOS 开发的语言\n## 第一章：你的第一个 PHP 脚本\n### 章节目标：\n- 你将能够识别并安装创建\
  \ PHP 脚本所需的软件开发工具。\n- 你将能够运行你的第一个 `PHP` 脚本。\n### 1.1 设置你的开发环境\n你可能认为在学习 `PHP` 编程时，你是在孤立地学习\
  \ `PHP` 语言。然而，`PHP` 是开发基于 `PHP` 应用程序的一系列技术的核心。从描述这套技术是一个良好的开始。\n`PHP` 是一种通用的、开源的服务器端脚本语言，专为\
  \ Web 开发设计。它用于生成动态网页。它是一种 Web 脚本语言，用于为网站添加基础 Web 功能。`PHP` 的用途示例包括创建用户名和密码登录界面、检查表单详情、创建论坛页面、图片库、调查问卷等。`PHP`\
  \ 是一门强大的语言，使开发人员能够创建他们想要的几乎任何类型的应用程序。\n与某些 Web 语言（如 `Javascript`）不同，`PHP` 并不是在你的浏览器中执行的，而是在服务器上执行——即存储页面并供互联网上的浏览器访问的台计算机。服务器处理来自\
  \ Web 浏览器的请求，然后返回请求的内容——通常是 `HTML` 格式。这就是 `PHP` 被称为“服务器端语言”的原因。\n`PHP` 既可以写在外部文档中，也可以嵌入\
  \ `HTML` 文档本身。`PHP` 代码由 Web 服务器（通常是 `Apache` 服务器）解释，该服务器拥有 `PHP` 处理器模块，该模块生成最终网页。其他与\
  \ `PHP` 类似的流行语言还有 `ASP`、`Python`、`Perl` 和 `Ruby`。\n像 `PHP` 这样的计算机语言的常见用途之一是与数据库或数据源建立接口。通常，`PHP`\
  \ 与 `MySQL` 数据库配合使用。我们将在本书的后部分讨论 `PHP` 和 `MySQL` 之间的交互。\n根据计算机历史，Rasmus Lerdorf\
  \ 开发了最初的 `PHP` 规范。据说 `PHP` 术词是从他的个人主页（Personal Home Page）项目演变为如今广泛使用的开源脚本语言，被称为\
  \ `Hypertext PreProcessor`（超文本预处理器）——这是大量开发者共同努力的结果。然而，它并没有遵循原始的缩写 `PHP`，因此不是 `Pre-Hypertext\
  \ Processor`（预超文本处理器）。脚本语言本身是使用 `C` 语言开发的。\n`Rasmus Lerdorf` 借鉴了许多来自 `C`、`Perl`\
  \ 和 `Java` 等语言的语法。`PHP` 是一种专注于 Web 设计的语言。它是为 Web 开发人员编写的语言。\n`PHP` 非常适合快速创建 Web\
  \ 前端后端系统——数据库的创建和操作、目录服务器的直接访问协议、目录服务器的简单网络管理协议，或为 Web 生成非 `HTML` 动态内容（如图像、Flash\
  \ 或 `PDF` 文档）。\n一个简单的 `PHP` 任务示例是从数据库中提取客户信息，并动态生成一个看起来专业的 `PDF` 发发票。（www.computerworld.com,\
  \ 与 Rasmus Lerdorf 的采访，2002 年 2 月 4 日）许多多人在线游戏服务器都是使用 `PHP` 构建的。\n`MySQL` 是一个基于标准\
  \ `SQL`（结构化查询语言）的免费数据库管理系统。`SQL` 在 1986 年成为标准数据库语言。它用于访问和操作数据库。`SQL` 语言从数据库引擎到数据库引擎具有相当的一致性——这意味着从一个数据库品牌切换到另一个是非常容易的。\n\
  `MySQL` 是一个开源关系型数据库管理系统 (RDBMS)，运行在服务器上，该服务器允许或提供对多个数据库的多用户访问。`MySQL` 的开发者是 `Oracle`（以前为\
  \ `Sun Microsystems`）。根据维基百科，它以联合创始人 `Michael Widenius` 的女儿 `My` 命名，将 `My` 作为 `SQL`\
  \ 的缀，因此是 `MySQL`。\n`MySQL` 是 Web 应用程序常用的数据库选项。它也是不同的开源 Web 语言栈的核心组件，即 `Linux`、`Apache`、`Perl`、`Python`\
  \ 等。但最常见的组合是 `PHP` 和 `MySQL`，因为它们都倾向于采用极简且非常直接的方法解决问题。\n通过 `MySQL`，你可以在数据库元素之间建立关系，这样每当在\
  \ Web 应用程序中再次处理数据时，就不需要重复数据。我们将在书中后半部分详细讨论 `MySQL`。\n`Apache` Web 服务器应用程序适用于多种操作系统。它是一个开源（意味着非专有的）`http`\
  \ 服务器程序，在 `Apache Foundation` 的赞助下开发和维护。它适用于 `UNIX`、`Solaris`、`Novell Netware`、`Mac\
  \ OS X`、`Microsoft Windows`、`OS/2`、`TPF` 和 `eComStation`。它根据 `Apache` 许可发布。传说 `Apache`\
  \ 名称的起源于对软件本身的描述——充满补丁的服务器 = APACHE。\n完成 `PHP` 编程环境所需的另一个应用程序是 `phpMyAdmin`。它是用\
  \ `PHP` 语言编写的应用程序，为 `MySQL` 数据库提供基于 Web 的界面。`phpMyAdmin` 是一个开源工具，旨在通过浏览器管理 `MySQL`。\n\
