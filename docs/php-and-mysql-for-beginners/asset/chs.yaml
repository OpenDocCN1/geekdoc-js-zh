  \ `includeMe.php` 代码如下：\n\n```php\n<?php\n    print(\"This statement is called from\
  \ the file includeMe.php using the include command.\");\n?>\n```\n\n代码在 `includeMe.php`\
  \ 中打印相同的语句并插入换行。\n\n![](img/00180.jpeg) 图 6.5：Komodo Edit 中 `includeMe.php` 的代码列表。保存并运行此脚本。输出如下：\n\
  \n```php\n<?php\n    print(\"This statement is called from the file includeMe.php\
  \ using the include command.\");\n?>\n```\n\n你的输出应该如下所示：\n\n![](img/00181.jpeg)\
  \ 图 6.6：运行 `include.php` 时的输出。可以通过在程序中多次重复 include 语句。通过复制以下代码修改 `include.php`：\n\
  \n```php\n<?php\n    print(\"This statement is called from the file includeMe.php\
  \ using the include command.\");\n    print(\"</br>\");\n    include(\"includeMe.php\"\
  );\n    print(\"</br>\");\n    include(\"includeMe.php\");\n    print(\"</br>\"\
  );\n    include(\"includeMe.php\");\n    print(\"</br>\");\n    include(\"includeMe.php\"\
  );\n?>\n```\n\n![](img/00182.jpeg) 图 6.7：修改后的 `include.php` 运行时的输出。这是新输出的样式。\n\n\
  现在，在我们之前的 `include.php` 代码中将 `include` 替换为 `require` 并添加几个 `print` 语句。如代码所示更改 `require`\
  \ 语句内部的文件，然后将其保存为 `include_2.php`。\n\n代码列表：`include_2.php`\n\n```php\n<?php\n  \
  \  print(\"This statement is called from the file includeMe.php using the include\
  \ command.\");\n    print(\"</br>\");\n    require(\"includeMeXX.php\");\n    print(\"\
  </br>\");\n    include(\"includeMe.php\");\n    print(\"</br>\");\n    include(\"\
  includeMe.php\");\n    print(\"</br>\");\n    include(\"includeMe.php\");\n    print(\"\
  </br>\");\n    include(\"includeMe.php\");\n    print(\"The following statement\
  \ is printed out using the include function.\");\n    print(\"</br>\");\n    print(\"\
  The following statement is printed out using the include function.\");\n    print(\"\
  </br>\");\n    print(\"The following statement is printed out using the include\
  \ function.\");\n    print(\"</br>\");\n?>\n```\n\n注意，当 `require` 语句中发现错误时，该语句之后的代码都没有被处理，程序停止了。\n\
  \n![](img/00183.jpeg) 图 6.8：运行 `include_2.php` 时的输出。\n\n对于 `include` 函数，不会产生错误，错误会被忽略。例如，在文件名\
  \ `include_3.php` 下输入并保存以下代码并运行输出：\n\n代码列表：`include_3.php`\n\n```php\n<?php\n  \
  \  print(\"This statement is called from the file includeMe.php using the include\
  \ command.\");\n    print(\"</br>\");\n    include(\"includeMeXX.php\");\n    print(\"\
  </br>\");\n    include(\"includeMe.php\");\n?>\n```\n\n\n\n\n\n```php\nprint(\"\
  The following statement below is printed out using the include function.\");\nprint(\"\
  </br>\");\nprint(\"The following statement below is printed out using the include\
  \ function.\");\nprint(\"</br>\");\nprint(\"The following statement below is printed\
  \ out using the include function.\");\nprint(\"</br>\");\n?>\n```\n\n如果所有的 `print`\
  \ 和 `include` 语句都经过处理，输出将显示六行。但由于其中一个 `include` 语句调用了一个不存在或“空”文件——`includeMeXX.php`，程序将把该部分代码解释为错误并在浏览器中打印错误语句。当使用\
  \ `require` 代替 `include` 时，程序也会停止。\n\n![](img/00184.jpeg)\n\n图 6.9: `include_3.php`\
  \ 运行时的输出。\n\n### 6.4 创建简单函数\n\n现在让我们来学习如何编写自己的函数。这是我们必须遵循的格式和语法：\n\n```php\nfunction\
  \ functionName( param1, param2, . . . paramN ) {\n    program statements;\n    return\
  \ expression;\n}\n```\n\n第一行必须以关键字 `function` 开始。接着是你的函数名称。该名称必须遵循某些规则。\n\n有效的 `functionName`\
  \ 以字母或下划线开头，后跟任意数量的字母、数字或下划线。函数名是不区分大小大小的。\n\n我们之前说过，函数是“执行特定任务的自包含程序语句集合”。当你为函数命名时，该名称应该让你对函数将执行的“特定任务”有一个概念。\n\
  \n函数名后面应该跟着括号 `()`。如果函数被设计为接收参数，则应在括号内放置用逗号分隔的参数列表（`param1`, `param2`, `. . . paramN`），用于接收这些参数。你可以指定任意数量的参数变量，但对于你指定的每个参数，在调用函数时必须传递相应的参数。换句话说，函数调用中参数的顺序和数量应该与函数定义中参数的顺序和数量匹配。无论你的函数是否接收参数，括号\
  \ `()` 都必须紧跟在函数后面。\n\n**注意：** 参数（arguments）和形（parameters）的区别是什么？参数是你传递给函数的数值，而形是函数内部接收参数的变量。在现实生活中，这两个术语是通用的。\n\
  \n括号之后是函数的主代码块，由大括号 `{}` 分隔。在这个代码块中，你可以编写任何 PHP 程序语句，包括对其他函数的调用（包括当前函数的调用），这种做法被称为递归。\n\
  \n`return` 语句返回 `expression`。\n\n**提示：** 以防你忘记什么是表达式，你可以复习第 4 章第 1 节“简单控制结构——If\
  \ 语句”。\n\n`return` 语句可以放置在函数代码块的任何位置，但一旦执行了 `return` 语句，函数将立即终止，控制权将返回给调用脚本，特别是函数调用后的第一个程序语句。\n\
  \n让我们创建一个简单函数。准备两个文件模板：一个 PHP 函数容器文件和一个将调用容器文件中函数的 HTML 文档。\n\n### 步骤 1：创建一个名为 `functions.php`\
  \ 的 PHP 模板。这将是我们的函数容器文件。点击新建文件（New File）。\n\n![](img/00185.jpeg)\n\n图 6.10: Komodo\
  \ Edit 首页。点击“新建文件”。\n\n![](img/00186.jpeg)\n\n图 6.11: Komodo Edit 的新建文件对话框。输入文件名\
  \ `functions.php` 并将其保存到你的 www 或 htdocs 文件夹中。\n\n一旦创建了 `functions.php` 文件，就开始编写第一个函数——`greeting()`。\n\
  \n### 步骤 2：在你的 `functions.php` 文件中输入以下代码。\n\n```php\n<?php\nfunction greeting()\n\
  {\n    echo(\"Hello! This is a greeting!\");\n}\n?>\n```\n\n![](img/00187.jpeg)\n\
  \n图 6.12: `functions.php` 运行时的输出。包含在起始和大括号之间的语句是需要该函数的 HTML 文档实际调用的代码。PHP 函数脚本容器文件必须正确包含这些函数，HTML\
  \ 文档必须正确地包含或引入这些函数。\n\n现在让我们向容器文件添加第二个函数 `loop()`。此循环例程将以三角形结构显示星号 (**)。\n\n```php\n\
  <?php\n    function greeting()\n    {\n        print(\"Hello! This is a greeting!</br>\"\
  );\n    }\n\n    function loop()\n    {\n        for($i=0; $i<=10; $i++) {\n   \
  \         for($j=0; $j<=$i; $j++) {\n                print(\"*\");\n           \
  \ }\n            print(\"<br>\");\n        }\n    }\n}\n```\n\n*(注：原文后部分存在大量重复和断裂的片段，已根据指令逻辑进行了清理和整合)*\n\
  \n\n\n\n函数的返回值它是为传递给它的特定 `$month` 和特定 `$year` 所计算的天数。实际调用函数以获取 2014 年 2 月的天数，如下所示：\n\
  \n```php\n$noDaysInMonth = days_in_month( 2, 2014 )\n```\n\n该函数将返回 28，该值将存储在变量 `$noDaysInMonth`\
  \ 中。\n\n现在，假设我们无法向函数传递参数。对于 `days_in_month()` 函数，我们必须为想要计算的每年的每个月都编写一个该版本的函数代码！\n\
  \n没有参数的函数将变得毫无用处！但有了参数，我们只需要一个函数就可以处理过去和未来所有年份的所有月份，直到永恒！\n\n以下是关于向函数传递参数的某些规则：\n\
  \na. 如果要向函数传递多个参数，这些参数必须用逗号隔开。\n\nb. 传递给函数的参数的数量和顺序必须与函数定义中声明的参数数量和顺序匹配。如果函数声明需要三个参数，则必须传递三个相应的参数。\n\
  \n让我们回顾之前的例子，一个声明了三个参数的函数。这是该函数的局部声明：\n\n```php\nFunction formInitials( $givname,\
  \ $midname, $surname) { \n    program statements\n}\n```\n\n对此函数的正确调用是：\n\n```php\n\
  $initials = formInitials( “George”, ”Walker”, “Bush”)\n```\n\n三个参数对应三个参数，参数的顺序与参数的顺序对应。参数“George”对应参数\
  \ `$givname`，参数“Walker”对应 `$midname`，参数“Bush”对应 `$surname`。改变参数的顺序就会得到错误的结果！\n\n\
  c. 参数可以是 PHP 八种数据类型中的任何一种，即：整数、浮点数、字符串、布尔值、数组、对象、资源（或句柄）甚至是 null。（尽管向函数传递 null 值是非常稀有的的。）\n\
  \nd. 向函数传递的参数数量没有限制。然而，使用超过五个或六个参数是不现实的。想象一下定义并使用一个需要超过六个参数的函数会有多困难和高错误概率！\n\n提示：通过数组，你可以向函数传递任意数量的参数，但仍然保持接口简单，因为你只向函数传递了一个变量，即数组。\n\
  \n让我们来看一些示例。\n\n### 第 1 ：在 PHP 模板创建一个新的 PHP 函数脚本容器文件，并使用文件名 `functionArgs.php`。\n\
