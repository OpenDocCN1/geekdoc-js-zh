  \ 图 4.51：将 `$grade` 的值改为 ‘85’ 或 ‘Xx’ 并查看输出。\n\n三元运算符——紧凑的 if-else\n\n在本章之前，我们讨论了运算符，特别是比较和逻辑运算符。三元运算符包含三个操作数，语法如下：\n\
  \n`表达式 1 ?表达式 2 : 3`\n\n如果 `表达式 1` 为真，则返回 `表达式 2` 的值；否则，返回 `表达式 3` 的值。三元运算符通常用于\
  \ `if-else` 语句的紧凑写法。\n\n例如：\n\n```php\nif ($age >= 18) {\n    echo \"You can vote.\"\
  ;\n} else {\n    echo \"You cannot vote.\";\n}\n```\n\n使用三元运算符，上述代码可以简化为一行：\n\n\
  ```php\n$voteStatus = ($age >= 18) ? \"You can vote.\" : \"You cannot vote.\";\n\
  echo $voteStatus;\n```\n\n这种方法使代码更加简洁。让我们来练习一个例子。\n\n**问题**：创建一个程序，判断用户的年龄是否大于等于\
  \ 18 岁。如果是，则显示“You can vote.”；否则，显示“You cannot vote.”。使用三元运算符来实现该逻辑。\n\n**解决方案**：\n\
  \n代码列表：`ternaryOperations.php` 的解决方案\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \    <title>Ternary Operator</title>\n</head>\n<body>\n    <?php\n        $age =\
  \ 19;\n        $voteStatus = ($age >= 18) ? \"You can vote.\" : \"You cannot vote.\"\
  ;\n        echo $voteStatus;\n    ?>\n</body>\n</html>\n```\n\n**步骤 1**：创建一个空白的\
  \ HTML5 文档，并将其保存为 `ternaryOperations.php`。\n\n![](img/00078.jpeg)\n图 4.54：Komodo\
  \ Edit 起页。\n\n![](img/0130.jpeg)\n图 4.55：创建一个名为 `ternaryOperations.php` 的新文件。\n\n\
  **步骤 2**：在 `<title>` 标签中输入“Ternary Operator”。在文档 `<body>` 中包含 PHP 的开始和结束标签。\n\n\
  ![](img/0131.jpeg)\n图 4.56：为文档添加标题和 PHP 标签。\n\n**步骤 3**：将初始值 19 分配给变量 `$age`。编码整个代码解决方案并保存文件。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Ternary Operator</title>\n\
  </head>\n<body>\n    <?php\n        $age = 19;\n        $voteStatus = ($age >= 18)\
  \ ? \"You can vote.\" : \"You cannot vote.\";\n        echo $voteStatus;\n    ?>\n\
  </body>\n</html>\n```\n\n**步骤 4**：启动浏览器，在地址栏中输入文件名并点击 Go 或按回车键。等待一两秒。\n\n![](img/0120.jpeg)\n\
