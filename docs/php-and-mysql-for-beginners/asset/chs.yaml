  1. **什么是条件语句？**\n    1. 定义条件的语句。\n    2. 将对值是否为空进行评估的属性。\n    3. 可以持有任何值并根据该值进行评估的逻辑陈语句。\n\
  \    4. 评估表达式条件为真或假，并执行与真或假值对应的操作的语句。\n\n2. **条件“<=”描述的是哪种条件运算符？**\n    1. 大于等于。\n\
  \    2. 等于。\n    3. 小于。\n    4. 小于等于。\n\n3. **复杂条件的示例是？**\n    1. If 语句。\n    2.\
  \ Switch 语句。\n    3. If-else 语句。\n    4. 一系列的 if-else-if 语句。\n\n4. **switch-case-break\
  \ 条件语句的最优定义是？**\n    1. if 语句的简写形式。\n    2. 基于随机拆分 case 的 switch。\n    3. 具有许多种\
  \ case 的条件语句。\n    4. if 语句的较长版本。\n\n5. **switch-case-break 对大小写敏感吗？**\n    1. 是。\n\
  \    2. 否。\n    3. 也许。\n    4. 默认情况下是，但可以通过添加多个 case 来自定义以移除大小写敏感。\n\n6. **什么是三元运算符？**\n\
  \    1. 与变量关联的一行 if-else 语句。\n    2. 条件语句具有复杂的条件。\n    3. 给变量赋值的运算符。\n    4. 评估条件并执行特定操作的运算符。\n\
  \n7. **语句中的符号 `?` 和 `:` 分别代表什么？**\n    1. If 和 else。\n    2. OR（或）和 AND（与）。\n  \
  \  3. 大于小于。\n\n## 本章练习\n\n1. 创建一个 PHP 程序，显示一个要求个人输入名、姓、年龄和国籍的表单。表单必须包含名、姓和年龄的文本输入；国籍的是/否单选按钮，以及“Register”和“Clear\
