  \n### 访问多维数组\n\n例如，假设我们要调用数组成员 `Executioner`（它属于 `Weapon` 子数组）并将其显示出来。正确的代码是：`echo($backpack['Weapon'][1]);`。如果你想访问数组中的其他成员，也采用相同的语法。让我们显示整个\
