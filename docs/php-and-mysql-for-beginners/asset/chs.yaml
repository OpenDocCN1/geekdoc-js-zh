  \ `dogAgeCalc()` 的函数并向函数传递参数 `$dogAge`。\n\n```php\n<?php\nfunction dogAgeCalc($dogAge)\n\
  {\n```\n\n### 第 4 ：编写将狗的年龄乘以七的代码。\n\n```php\n    $humanAge = $dogAge*7;\nprint(\"\
  The dog's age in human years is \" . $humanAge .\".\");\n```\n\n### 第 5 ：关闭脚本。\n\
  \n```php\n    }\n?>\n```\n\n此脚本将给定的年龄转换为人类年龄。例如，如果一只狗是 7 岁，它等同于一个 49 岁的人类。\n\n这里是狗年龄计算器的完整代码列表。\n\
  \n**代码列表：`functionArgs.php`**\n\n```php\n<?php\nfunction dogAgeCalc($dogAge)\n{\n\
