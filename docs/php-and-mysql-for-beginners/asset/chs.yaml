  \n图 5.36：第二组输入值的输出 - 本金：100，利率：10%，期限：（12 个月）1 年\n\n## 章节总结\n在本章中，你学习了 PHP 中不同循环或迭代结构的结构、语法以及大量的示例：`while-loop`、`do-while-loop`、`for-loop`\
  \ 和 `foreach-loop`。在这四种循环结构中，`foreach-loop` 是唯一一种专门设计用于处理所有类型数组的迭代结构，这使得能够轻易地对其进行操作。在下一章中，我们将讨论自定义\
  \ PHP 函数。\n\n# 第 6 章：自定义函数\n\n### 目标\n- 了解什么是函数\n- 学习定义和调用函数的格式与语法\n- 学习用于传递值的参数以及接收值的参数\n\
  - 学习如何从函数返回值\n- 了解 `include` 和 `require` 等内置函数\n\n### 6.1 介绍与概述\n函数是编程中不可或缺的特性，因为：\n\
  - 在良好的系统中，98% 的代码将位于函数中，\n- 面对象编程 (OOP) 的范式使得系统易于维护。\n\n我们将讨论的是函数的基础知识，这些是 `echo()`、`print()`\
  \ 和 `printf()`。\n\n以下是第 1 章中使用的这些函数的实际示例：\n\n```php\necho(\"<br>这是第二条语句\");\nprint(\"\
  Hello!\");\nprintf(\"我 %d 岁了\", 21);\n```\n\n在第 3 章中你使用了 `array()` 函数。该实例看起来比之前的示例复杂，但它遵循相同的函数调用格式和语法。\n\
  \n```php\n$salary = array(\n    \"Doe\" => 30000,\n    \"Smith\" => 28000,\n   \
  \ \"Rogers\" => 50000,\n    \"Adam\" => 120000,\n    \"Brown\" => 60000\n);\n```\n\
  \nTIP：2012 年 11 月 27 日，`stackoverflow.com` 的一位用户报告称 PHP 官方网站 `www.php.net` 列出了 5845\
  \ 个内置函数。此外，数百名开发者提供了经过测试和调试的函数库，它们大多是免费提供的。如果你正在寻找你想要为网站编写的功能或能力，可能该功能已经存在于某些开发者的函数库中了。\n\
  \n### 6.2 调用函数\n函数（在其他编程语言，特别是旧语言中称为子程序）是执行特定任务（特定函数）的自包含语句编译。例如，`echo()`、`print()`\
  \ 和 `printf()` 函数的主要工作是在浏览器中显示作为参数传递给它们的、位于括号内的字符串值。\n\n对于 `array()` 函数来说，它根据传递给函数的参数值创建一个数组。这些值成为数组的元素或成员。array()\
  \ 函数随后返回数组的变量引用。\n\n\n\n\n调用函数等同于一条程序语句。当你调用一个函数时，程序控制会跳转到函数的第一行。当函数执行完其代码后，程序控制将转移到函数调用之后的后续语句。\n\
  \n```\n$retValue = functionName(arg1, arg2,...); // function call\n```\n\n在 `functionName`\
  \ 执行完毕后，执行该程序语句。\n\n你可以通过向函数传递任意数量的值（称为参数）来选择性地控制函数的处理过程。\n\n例如，`echo()` 和 `print()`\
  \ 函数都各向传递了一个字符串类型的参数。这个字符串就是 `echo()` 和 `print()` 函数在浏览器中显示的内容。接下来，`printf()` 函数传递了两个参数，第一个是字符串，第二个是整数。字符串和整数都将在浏览器中显示为“I\
  \ am 21 years old.”最后，`array()` 函数传递了五个参数，这些参数将成为关联数组 `$salary` 的成员或元素。\n\n函数还可以选择性地向你返回一个值，称为返回值。\n\
  \n调用或执行一个函数会执行该函数的程序语句。当你调用或执行一个函数时，可以使用以下任何一种格式：\n\n1. `functionName();`\n2. `functionName(\
  \ arg1, arg2,..., argN );`\n3. `$returnValue = functionName();`\n4. `$returnValue\
  \ = functionName( arg1, arg2, . . .);`\n\n- `functionName` – 这是你赋予函数的唯一名称。没有两个函数可以有相同的名称。\n\
  - `arg1, arg2, . . ., argN` – 这是一个可选的、用逗号分隔的字面量或变量列表，称为参数，是传递给函数的值。你可以传递的参数数量没有限制。这些参数允许你控制函数的执行，并赋予了函数功能和灵活性。\n\
  - `$returnValue` – 这是一个可选的变量，用于接收并存储函数返回的可选值。通过使用变量来持有函数的返回值，我们可以让该值对脚本的其他部分可用。\n\
  \n让我们再看一个函数调用的例子，它使用了函数调用的所有可选组件——参数列表和返回值。我们将在在本章稍后的内容中多次引用这个例子。\n\n```\n$noDaysInMonth\
  \ = days_in_month( $month, $year );\n```\n\n`days_in_month()` 函数是由 [www.stackoverflow.com](http://www.stackoverflow.com)\
  \ 的用户编写并贡献的。它返回过去或未来某一年（`$year`）特定月份（`$month`）的天数，并考虑闰年。\n\n函数是任何编程语言不可或缺的组件。出于以下原因，你必须使用它们：\n\
  \n### a. 消除重复代码\n假设你写了一个例程，通过提取一个人的名、中间名和姓的首字母来形成一个三字母的大写字母缩写。（例如，George Walker\
  \ Bush 的缩写将是 GWB.）\n\n如果没有函数，你必须为你需要处理的每一个名字复制并粘贴这个例程。但如果有了函数，你可以将此例程放在一个函数中，调用该函数并将名、中间名和姓作为参数传递。然后，函数会将这三个字母的缩写作为返回值返回。例如：\n\
  \n```\n$givname = “George”;\n$midname = “Walker”;\n$surname = “Bush”;\n$initials\
  \ = formInitials( $givname, $midname, $surname);\n```\n\n之前的四行代码可以像这样压缩为一行：\n\n\
  ```\n$initials = formInitials( “George”, “Walker”, “Bush”);\n```\n\n在上述两种形式中，变量\
  \ `$initials` 都将包含大写字母“GWB”。\n\n### b. 函数可以在其他脚本中复用\n你现在有了一个无错误的 `formInitials()`\
  \ 函数，你（以及其他程序员）可以在未来的脚本中使用它。你甚至不需要阅读或了解哪些程序语句组成了函数。你只需要知道函数的名称、它的功能、要传递给它的参数，以及它的返回值（如果有的话）是什么。\n\
  \n### c. 函数可以极大地减少错误\n再次，假设如果没有函数，你不得不求助于复制和粘贴来复制程序语句。假设你复制并粘贴了二十次例程。现在出现了一种情况，你必须对该例程进行细微调整——这意味着你现在必须去那二十个地方进行这些更改。除了花费二十次独立编辑的时间和精力外，极可能会混入某些输入错误，从而完全破坏你的代码。而且在脚本实际崩溃之前，你都不会发现这一点！\n\
  \n但如果你的例程是作为函数创建的，你只需要修改一次。\n\n### d. 函数帮助你分而治之\n在编程（或编写实际代码）之前，应该进行长时间的、系统的分析。在房屋或建筑的地基之前，绝对花费了数周的时间来测量土地、分析土壤、选择合适的材料，然后起草并最终确定建筑蓝图。类似的分析和设计过程在编写第一行代码之前就已经执行了。\n\
  \n### 6.3 Include() 和 Require() 函数\n\n在上一节中，我们涵盖了调用或执行函数的所有方面，包括向函数传递参数以及检索和存储函数的返回值。我们将在下一节中详细介绍创建函数的细节。现在，我们将介绍如何组织你创建的各种函数以及如何轻松访问它们。我们所说的“组织”是指你在哪里或哪些文件中放置或存储你创建的函数，以便于被找到和访问？\n\
  \n\n\n\n\n函数应该存储在独立的 PHP 函数容器文件中，以便于整洁性、检索和维护。假设在一个项目中，开发团队编写、测试并调试了 100 个函数。假设每个函数平均长度为\
  \ 20 行，最短的函数只有两行，而最长的函数有 100 行。丰富的程序员不会将这 100 个函数全部放在一个 PHP 脚本文件中（这至少会有 2000 行代码，需要\
  \ 40 页纸质打印）。他们会先根据主要任务对函数进行分类和分组，然后将具有相似任务的函数存放在独立的 PHP 函数容器文件中。例如，处理图形的函数将放在 `graphics.php`\
  \ 中；处理计算折扣的函数将放在 `discounts.php` 中，依此类推。\n\n程序员可以根据需要，将任何函数容器文件读取到主脚本文件中。为了实现这一点，程序员可以使用以下四个函数中的任何一个：\n\
  \n```php\ninclude(\"phpScriptName\");\ninclude_once(\"phpScriptName\");\nrequire(\"\
  phpScriptName\");\nrequire_once(\"phpScriptName\");\n```\n\n这四个函数都允许将文件 `phpScriptName`\
  \ 中的函数集成到当前脚本文件中，就像代码被复制并粘贴过去一样。\n\n`include()` 和 `require()` 之间的唯一区别在于，如果找不到要包含的文件，`include()`\
  \ 只会引发 PHP 警告（`E_WARNING`），而 `require()` 会抛出一个致命错误（`E_COMPILE_ERROR`）并停止运行脚本。\n\n\
  `include_once()` 和 `require_once()` 用于防止嵌套包含。为了理解嵌套包含，让我们考虑 PHP 脚本——`1stScript.php`、`2ndScript.php`、`myFuncsA.php`\
  \ 和 `4thScript.php`。\n\n```php\n// 1stScript.php\n<?php\n    include(\"myFuncsA.php\"\
  )\n    validateParameters();\n?>\n\n// 2ndScript.php\n<?php\n    include(\"myFuncsA.php\"\
  )\n    function computeValues( param1, param2) {\n        program statements;\n\
  \        return $computedValue;\n    }\n    validateParameters();\n?>\n\n// myFuncsA.php\n\
  <?php\n    function validateParameters() {\n        program statements;\n      \
  \  return expression;\n    }\n?>\n\n// 4thScript.php\n<?php\n    include(\"1stScript.php\"\
  );\n    include(\"2ndScript.php\");\n?>\n```\n\n`1stScript.php` 和 `2ndScript.php`\
  \ 都包含了 `myFuncsA.php`，其中定义并编写了函数 `validateParameters()`。到目前为止一切良好！但现在出现了 `4thScript.php`，它同时包含了\
  \ `1stScript.php` 和 `2ndScript.php`。这就是我们的嵌套包含情况！\n\n当 `4thScript.php` 包含 `2ndScript.php`\
  \ 时就会出现问题，因为发生这种情况时 `2ndScript.php` 会包含 `myFuncA.php`，其中包含 `validateParameters()`\
  \ 的定义。但 `1stScript.php` 已经包含了 `myFuncA.php` 并在过程中定义了 `validateParameters()`。因此当\
  \ `2ndScript.php` 包含 `myFuncA.php` 时，它再次定义了 `validateParameters()`，从而导致显示长长错误信息的致命错误，其中部分内容为：`Cannot\
  \ redeclare validateParameters() (previously declared in myFuncA.php)`。\n\n为了解决这个问题，我们在\
  \ `4thScript.php` 中 使用了 `include_once()`。\n\n```php\n// 4thScript.php\n<?php\n \
  \   include_once(\"1stScript.php\");\n    include_once(\"2ndScript.php\");\n?>\n\
  ```\n\n`include_once()` 和 `require_once()` 在当前脚本执行期间只包含指定的或或一次。如果你再次调用 `include_once()`\
  \ 或 `require_once()` 来包含同一个文件或脚本，则什么都不会发生。`include()` 或 `require()` 函数调用应该放在 HTML\
  \ 文档的 `<head>` 部分。还需要理解的是，当你包含一个函数脚本文件时，并**不会**自动执行这些函数。函数只有通过格式正确且具有正确数量和顺序参数的调用才能执行。\n\
  \n让我们来看一些示例。\n\n![](img/00176.jpeg) 图 6.1：在 Komodo Edit 页面通过点击 New File（新建文件）开始创建文件。选择\
  \ New file 将弹出一个窗口。选择 PHP 模板并将 `www` 或 `htocs` 设置为目录，以保存名为 `includeMe.php` 的新文件。\n\
