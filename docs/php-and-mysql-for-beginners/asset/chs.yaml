  \ |\n\n\n\n\n\n# PHPMyAdmin\n这是一个用 `PHP` 编写的开源工具，可以在 浏览器中运行。它允许用户创建、修改或删除 `MySQL`\
  \ 数据库，以及数据库中的任何表，或任何表的行和字段。`PHPMyAdmin` 可以在数据库上执行 `SQL` 语句，并管理用户和权限。\n\n### 主键\n\
  这是一个列或字段或多个列或字段，其值确保了表中的每一行都是唯一的。\n\n### 查询字符串\n它是 `URL` 的一部分，包含要传递给 Web 应用程序的数据。\n\
  \n### 记录\n在数据库中，这是行的另一种称为术语。\n\n### 关系\n在数据库中，关系是两个表之间的链接。\n\n### 资源\n这是 `PHP` 八种数据类型之一。\n\
  \n### 返回值\n这是函数返回给调用者的可选值。\n\n### 行\n在数据库中，这是表中一组相关的数据。\n\n### 作用域\n这是编程中的一个重要概念，指变量在程序中的可见性或可访问性。具体来说，它指的是程序中可以访问变量的代码部分。`PHP`\
  \ 全局作用域和局部作用域。\n\n### 服务器\n这是一个系统（软件和合适的计算机硬件），旨在处理请求并通过局域网或互联网向其他计算机（客户端）传递数据。\n\
  \n### 会话\n这是服务器上的一个临时文件，你可以在其中存储数据。客户端浏览器在会话中存储数据以“维护浏览器请求之间的状态”，或者更具体地说，“在浏览器请求之间保留应用程序的状态”。\n\
  \n### SID\n这是会话 ID 的缩写。`SID` 由服务器生成，用于标识和保护会话。\n\n### SQL\n这意思是结构化查询语言（通常读作“see-qwell”）。它是一种用于在关系型数据库中搜索、排序、添加和提取数据的编程语言。\n\
  \n### 简单数组\n参见索引数组。\n\n### smtp\n这是简单邮件传输协议的缩写。当电子邮件从邮件客户端（如 Outlook Express）发送到邮件服务器，或者从一个邮件服务器发送到另一个邮件服务器时，使用的协议。`SMTP`\
  \ 使用端口 25。尽管如今，大多数邮件服务器使用 `ESMTP`，它是 `SMTP` 的更新版本。\n\n### 状态\n这个词用于“维护状态”短语中，或更具体地说“在浏览器请求之间保留应用程序的状态”。当浏览器从服务器请求\
  \ Web 页面时，浏览器和服务器都没有浏览器之前请求的记忆。Web 页面中任何变量的值在加载新页面时都会丢失。保留这些值就是“维护状态”的含义。\n\n###\
  \ 字符串\n这是 `PHP` 八种数据类型之一。它是一个任意长度的字符序列。\n\n### 子数组\n这是多维数组中的一个数组。\n\n### 超全局变量\n\
  这是 `PHP` 中一个内置（预定义）关联数组变量，对所有 `PHP` 代码自动可用，特别是在函数内部（全局作用域）。超级全局变量代表来自 URL、HTML 表单、Cookie、会话以及\
  \ Web 服务器本身的数据。\n\n### switch-语句\n这是 `PHP` 三种条件语句之一，用于创建分支控制结构。另外两个是 `if-statement`\
  \ 和 `if-else/if-elseif-statement`。\n\n### 表\n在数据库中，这是一组紧密相关的数据或列（或字段）的集合。\n\n###\
  \ 三元运算符\n该运算符作用于三个操作数，是 `if-else` 语句的紧凑形式。\n\n### 时间戳\n这是 1970 年 1 月 1 日午夜到当前日期和时间之间的秒数。`PHP`\
  \ 内部将时间戳存储为 10 位整数。\n\n### URL\n这意思是通用资源定位符。它是由 Web 浏览器和其他网络软件使用的特殊格式的文本字符串。它标识互联网上的网络资源。网络资源是文件，可以是纯\
  \ Web 页面、其他文本文档、图形或程序。`URL` 的示例是 `http://www.website.com/myfinename`。\n\n### 值\n\
  在 `MySQL` 数据库的表中，值是给定行和列中的数据。\n\n### 变量\n这是一个分配用于存储值的内存单元，该值可以是八种 `PHP` 数据类型中的任意一种，即：整数、浮点数、字符串、布尔值、数组、对象、资源（或句柄）和空。\n\
  \n### Web 浏览器\n参见浏览器。\n\n### 数据类型\n这是 `PHP` 八种数据类型之一。\n\n### while-循环\n这是 `PHP`\
  \ 四种循环控制结构之一。另外三个是：`do-while-loop`、`for-loop`、`foreach-loop`。\n\n![Development Club\
