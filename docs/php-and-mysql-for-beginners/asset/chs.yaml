  \n\n\n\n\n![](img/00070.jpeg)\n\n图 3.34：点击提交按钮后查看输出。\n\n## 章节练习\n\n1. 什么是数组？\n \
  \  a. 数组是用于存储多个同质类型数据的特殊变量。\n   b. 数组是多个变量的容器。\n   c. 数组是获取许多变量值并将其存储的特殊命令。\n  \
  \ d. 数组是创建多个数据的特殊函数。\n\n2. 如果要将数组的成员赋值为第四个成员，正确的语法应该是什么？\n   a. `$arrayName[3]=data;`\n\
  \   b. `arrayName[3]=data;`\n   c. `$arrayName[4]=data;`\n   d. `arrayName[4]=data;`\n\
  \n3. 在示例中，\n   ```php\n   $example = array(\n     \"Cooper\" => 25000,\n     \"\
  Oswald\" => 23500);\n   ```\n   哪些是键（key）？\n   a. Cooper, Oswald\n   b. 25000, 23500\n\
  \   c. $example\n   d. array\n\n4. 多维数组最简单的解释是什么？\n   a. 它们是持有特定键并在每个键中关联值的数组。\n\
  \   b. 它们是数组中的数组。\n   c. 它们是多个成员的数组。\n   d. 它们是拥有无限变量的数组。\n\n5. 简单数组和超全局数组之间的区别是什么？\n\
  \   a. 普通数组比超全局数组大。\n   b. 超全局数组来自 Web 服务器的用户输入、URL、Cookie 和 HTML 文件，而普通数组由程序员声明。\n\
  \   c. 普通数组占用的内存比超全局数组少。\n   d. 超全局数组比普通数组更容易处理。\n\n## 章节实验练习\n\n### 实验 1 1- 超全局单数据集\n\
