  >\n      <option <?php if($arr['department']==1) { print('selected'); } ?> value=\"\
  1\">Accounting</option>\n      <option <?php if($arr['department']==2) { print('selected');\
  \ } ?> value=\"2\">Sales</option>\n      <option <?php if($arr['department']==3)\
  \ { print('selected'); } ?> value=\"3\">Information Technology</option>\n      <option\
