  This statement is called from the file includeMe.php using the include command.\"\
  );\n?>\n```\n\n![](img/00178.jpeg) 图 6.3：Komodo Edit 中的 `includeMe.php` 代码。保存并运行此脚本。此代码将产生以下输出：\n\
