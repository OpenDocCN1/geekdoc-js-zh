  \n```php\n<?php\n  print(date(\"D F d, Y h:i:s\"));\n  print(\"<br/>\");\n  print(time());\n\
  \  $thirtyDays = 60 * 60 * 24 * 30;\n  print(\"<br/>30 days from right now: \" .\
  \ (time()+ $thirtyDays));\n?>\n```\n\n你应该得到类似这样的结果（当然，当前的日期时间取决于你执行此代码的时间）：\n\n\
