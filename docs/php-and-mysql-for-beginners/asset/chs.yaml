  \n(3) 每月余额也必须报告，且计算方式为：\n月余额 = `$principal + $monthlyInterest`\n\n(4) 投资期结束时的未来投资价值计算方式为：\n\
  总投资 = 最后一个月余额\n\n本金金额、年利率和期限必须被视为 `$superglobal variables`。\n\n为解决方案准备两个文档文件。超全局变量将由表单页面处理。计算由一个包含纯\
