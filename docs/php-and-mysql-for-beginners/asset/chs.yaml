  <?php\n$name = \"Mark\";\necho n;\n```\n\nPHP 的第二个特性是使用 heredoc 语法定义大型文本块。当你有一个包含许多双引号的字符串时，这种方法非常有用。\n\
  \n```php\n<?php\n$poem = <<<'\nRoses are Red\nViolets are Blue\nI'm no fan of Heredocs\n\
  But I can teach you.\n';\necho $poem;\n?>\n```\n\n在浏览器中，我们将看到：\n\n![](img/00295.jpeg)\n\
  \nPHP 的第二个特性是使用 heredoc 语法定义大型文本块。当你有一个包含许多双引号的字符串时，这种方法非常有用。\n\n```php\n<?php\n\
  $poem = <<<'\nRoses are Red\nViolets are Blue\nI'm no fan of Heredocs\nBut I can\
  \ teach you.\n';\necho $poem;\n?>\n```\n\nPHP 的第三个特性是 `nowdoc` 语法，它类似于 heredoc 但不允许字符串中的变量被解析。\n\
  \n```php\n<?php\n$name = \"World\";\n$poem = <<<'\nHello $name!\nThis is a nowdoc\
  \ example.\n';\necho $poem;\n?>\n```\n\n在浏览器中，我们将看到：\n\n```\nHello $name!\nThis\
  \ is a nowdoc example.\n```\n\nPHP 的第三个特性是 `nowdoc` 语法，它类似于 heredoc 但不允许字符串中的变量被解析。\n\
  \n## PHP 字符串总结\n\nPHP 定义字符串有四种主要方式：\n\n1. **单引号 (`'...'`)**：内部变量不会解析。\n2. **双引号\
  \ (`\"...\"`)**：内部变量会被解析。\n3. **Heredoc (`<<<'`)**：类似于双引号，允许多行字符串。\n4. **Nowdoc\
  \ (`<<<''`)**：类似于单引号，允许多行字符串。\n\n## 字符串函数\n\nPHP 提供了多种函数来处理字符串。以下是一些最常用的：\n\n- `strlen($string)`：返回字符串的长度。\n\
  - `strpos($string, $needle)`：返回子字符串首次出现的位置。\n- `substr($string, $start, $length)`：返回字符串的一部分。\n\
  - `str_replace($search, $replace, $string)`：将搜索内容替换为替换内容。\n- `strtolower($string)`：将字符串转换为小写。\n\
  - `toupper($string)`：将字符串转换为大写。\n\n## 字符串函数示例\n\n```php\n<?php\n$text = \"Hello\
  \ World!\";\necho strlen($text); // 输出: 12\necho strpos($text, \"World\"); // 输出:\
  \ 6\necho substr($text, 0, 5); // 输出: Hello\necho str_replace(\"Hello\", \"Universe\"\
  , $text); // 输出: Universe World!\necho strtolower($text); // 输出: hello world!\n\
  echo strupper($text); // 输出: HELLO WORLD!\n?>\n```\n\n\n\n\n\n在浏览器中我们将得到以下输出，其中前\
  \ 30 个字符作为子字符串显示：\n\n![](img/00300.jpeg)\n\n图 10.10：显示字符串的前 30 个字符。\n\nPHP 中提供了许多其他字符串函数（可以查看\
  \ [`www.php.net/manual/en/ref.strings.php`](http://www.php.net/manual/en/ref.strings.php)），你完全可以找到某个函数或多个函数的组合来完成特定的编程任务。\n\
  \n### 完整代码列表\n\n```php\n<?php\n\n$name = \"Mark\";\n\necho(\"My name is $name\"\
