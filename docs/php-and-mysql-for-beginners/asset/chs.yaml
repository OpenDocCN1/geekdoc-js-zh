  \n答案：a. 邮件传输协议（Simple Mail Transfer Protocol）。\n\n### 4. 什么是 HTML 邮件？\n\n答案：a. 一种嵌入了\
  \ HTML 标签的邮件类型。\n\n### 5. header MIME Version 的作用是什么？\n\n答案：a. 该头部指示邮件包含除 ASCII\
  \ 文本字符以外的字符。\n\n### 6. content type text/HTML 头的用途是什么？\n\n答案：d. 它定义了 HTML 邮件将使用的字符编码。\n\
