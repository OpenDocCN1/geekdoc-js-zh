  \n## 第 3 章：数组\n\n## 章节目标\n\n- 你将能够定义数组。\n- 你将能够描述 PHP 数组的类型：索引数组和关联。\n- 你将学习如何在\
  \ PHP 中声明和实例化数组。\n- 你将介绍一些 PHP 的超全局数组。\n\n### 3.1 简单数组或索引数组\n\n数组是用于存储多个值的变量。数组的每个值被称为一个元素（或成员），每个元素都通过其自己的整数索引（0,\
  \ 1, 2, 3 等）进行引用。索引还标识了元素在数组中的位置。（索引 0 表示第一个元素，索引 1 表示第二个元素，依此类推。） 可以在数组内对元素进行添加、删除、修改和重新排列（排序）。\n\
  \n存储在数组中的值可以是八种数据类型中的任何一种：整数、浮点数、字符串、布尔、对象、资源、null 和数组。数组被广泛用于存储列表值。例如，如果你想存储一个团队的所有成员，数组就是完美选择。\n\
  \n在 PHP 中，用于创建数组的函数是 `array()`。简单数组（或索引数组）是使用成员数字索引的数组。这种数字索引通常是顺序的，但允许随机或跳跃索引。在\
  \ PHP 中声明数组与在 PHP 中声明变量相似——美元符号（`$`）附在变量名之前。数组是零索引的，这意味着索引从零开始，且索引 0 始终指向数组的第一个成员。\n\
  \n声明数组从指定数组名称开始，后面跟着等号（`=`），然后是括号内的要存储在数组中的值。在下面的示例中，我们有：`$names = array(\"John\"\
  , \"Larry\", \"Jane\", \"Lily\");`\n\n如果我们仔细观察展示的数组，我们会看到第一个元素是 `$names[0]`，值为 \"\
  John\"，第二个元素是 `$names[1]`，值为 \"Larry\"，第三个是 `$names[2]`，值为 \"Jane\"，最后一个是 `$names[3]`，值为\
  \ \"Lily\"。数组也可以定义为：\n\n```php\n$names[0] = \"John\";\n$names[1] = \"Larry\";\n\
  $names[2] = \"Jane\";\n$names[3] = \"Lily\";\n```\n\n可以在变量上执行的操作或命令也可以在数组的每个成员上执行，例如\
  \ `print()`、`echo()`、拼接和数学运算。我们将使用数组演示这些操作中的每一种。创建一个新的 HTML 模板并将其保存到 `www`（Windows）或\
  \ `htdocs`（Mac）文件夹中，文件名命名为 `simple_array.php`。放置正确的起始和结束标签。\n\n在上面的系列截图中，我们已经声明了数组。另一种声明数组的方法是手动方法，即将数组的各个成员手动分配给它们对应的索引。我们将使用数组名称\
  \ `$fruit` 声明数组，并通过输入以下代码手动为数组的每个元素赋值：\n\n```php\n$fruit[0] = \"Berries\";\n$fruit[3]\
  \ = \"Mangos\";\n$fruit[4] = \"Apples\";\n```\n*(注：此处根据上下文逻辑翻译，原文示例代码中似乎漏了索引 1 和\
  \ 2 的赋值，但翻译遵循不翻译代码的原则，仅翻译描述。)*\n\n\n\n\n\n```php\n//Display the array member pairing\n\
  echo($first_names[0] . \" likes to eat \" . $fruit[5]);\necho(\"</br>\");\necho($first_names[1]\
  \ . \" likes to eat \" . $fruit[3]);\necho(\"</br>\");\necho($first_names[2] . \"\
  \ likes to eat \" . $fruit[4]);\necho(\"</br>\");\necho($first_names[3] . \" likes\
  \ to eat \" . $fruit[0]);\necho(\"</br>\");\n?>\n</body>\n</html>\n```\n\n### 第\
  \ 5 步：查看你的结果。输出应如所示：\n\n![](img/00042.jpeg)\n\n图 3.6：通过调用简单数组的成员来构建句子。\n\n### 3.2\
  \ 关联数组\n\n关联数组是为每个数组成员分配唯一键值对（key value）的数组。这些数组使用命名的键来识别其成员或元素，而不是用于简单数组的数字键（索引）。假设你想在一个数组中存储员工的薪水。数字索引数组不是存储这些值的最佳选择。在关联数组中，员工的姓名充当键，并根据他们的姓名关联其薪水率。\n\
  \n关联数组的声明与数字索引数组不同。数字索引数组遵循此数组声明格式：\n\n`$variable name [index number] = value;`\n\
  \n关联数组遵循此声明格式：\n\n`$variable name = array(key name => value, )`\n\n让我们尝试一下。\n\n\
  **第 1 步**：在你的文本编辑器中创建一个新的 HTML5 文档。使用文件名 `associative_array.php`。确保包含 PHP 的开始和结束标签。保存你的文件。\n\
  \n**第 2 步**：现在让我们创建一个包含四名员工及其相应薪水的数组。\n\n我们将拥有员工：“Doe”年薪 30,000 元，“Smith”年薪 28,000\
  \ 元，“Rogers”年薪 50,000 元，“Adam”年薪 120,000 元以及“Brown”年薪 60,000 元。\n\n关联数组的声明如下：\n\n\
  ```php\n$salary = array(\"Doe\" => 30000,\n    \"Smith\" => 28000,\n    \"Rogers\"\
  \ => 50000,\n    \"Adam\" => 120000,\n    \"Brown\" => 60000);\n```\n\n注意空格和对齐的使用，使代码更具可读性。我们可以用一行声明该数组，间距最小，如下所示：\n\
  \n`$salary = array(\"Doe\"=>30000,\"Smith\"=>28000,\"Rogers\"=>50000, Adam\"=>120000,Brown\"\
  =>75000);`\n\n但这样可读性没有之前的声明好。\n\n**第 3 步**：然后我们将使用 `echo()` 或 `print()` 配合字符串连接来显示输出，内容为“Full\
