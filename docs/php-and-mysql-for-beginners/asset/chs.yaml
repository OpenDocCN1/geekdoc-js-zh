  \ salary of $\" . $salary[\"Smith\"] . \".\");\necho(\"</br>\");\necho(\"Sam Rogers\
  \ has an annual salary of $\" . $salary[\"Rogers\"] . \".\");\necho(\"</br>\");\n\
