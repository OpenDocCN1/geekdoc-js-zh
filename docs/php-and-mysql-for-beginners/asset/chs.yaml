  \ PHP 分支控制结构的核心组件，以及这种结构是如何通过四个条件语句实现的，即：\n- `if`-语句\n- `if-else` 和 `elseif` 语句\n\
  - `switch`-语句\n- 以及三元运算符\n\n我们还涵盖了多个示例，以充分理解所有条件语句的语法、结构和实现。在接一章中，我们将讨论循环控制结构。\n\
  \n# 第 5 章：控制结构 - 循环\n\n### 目标\n- 你将能够理解并分析 PHP 中不同的循环或迭代控制结构。\n- 你将掌握 PHP 中 `while-loop`、`do-while-loop`、`for-loop`\
  \ 和 `foreach-loop` 语句的语法和结构。\n- 你将学习如何在实际代码中使用这些不同的循环。\n\n在上一章中，我们学习了分支控制结构，根据条件表达式求值的结果来执行或不执行特定的代码块。在本章中，我们学习循环控制结构（也称为迭代控制结构），即重复地执行或遍历特定的代码块。条件表达式求值的结果将决定我们循环或遍历代码块的次数。\n\
  \n一个循环控制结构由：\na. 一个条件表达式，\nb. 一个定义清晰的代码块组成。\n\n只要条件表达式求值为 `TRUE`，该代码块就会被反复执行。\n\n\
  **提示**：你应该完全理解表达式和条件表达式的概念，以及它们是如何由操作数、运算符、比较运算符和逻辑运算符构成的。这些概念在第 4 章中通过大量的示例进行了详细解释。\n\
  \nPHP 实现了以下循环语句来实现迭代控制结构：\na. `while-loop`\nb. `do-while-loop`\nc. `for-loop`\n\
  d. `foreach-loop`\n\n### 5.1 While 循环\n这是 `while-loop` 的语法和结构。\n\n```\nwhile (条件表达式)\
  \ {\n    代码块\n}\n```\n\n#### while 之后的语句\n`while-loop` 的执行通过评估声明的条件表达式开始。如果结果为 `TRUE`，则执行代码块。然后再次评估条件表达式，只要结果为\
  \ `TRUE`，就会执行代码块。一旦条件表达式求值为 `FALSE`，代码块将被忽略，程序跳转到 `while-loop` 之后的语句。\n\n注意，在 `while`\
  \ 语句的代码块中，必须存在某些语句导致条件表达式求值为 `FALSE`。例如，如果你的条件表达式是 `count < 10`，那么代码块中必须有一个语句（例如\
  \ `count++`）使 `count` 取值为 10 或其他。否则，循环永远不会停止！\n\n#### 让我们来看一个示例\n**问题**：创建一个从 1\
  \ 到 10 的 `while` 循环。每个数字应显示在单独的行。确保初始值为 `TRUE`。使用变量 `$number`。\n\n**解**：\n步骤 1：创建一个\
  \ HTML5 文档。命名为 `whileLoops_1.php`。将其保存到 `www` 或 `htdocs` 文件夹中。\n\n![](img/0141.jpeg)\n\
  图 5.1: 打开一个新的 HTML5 文档。\n\n步骤 2：在你的 PHP 文档中输入程序语句。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>循环示例 1</title>\n</head>\n<body>\n    <?php\n        $number\
  \ = 0;\n        while($number < 11) // 当 $number 小于 11 时\n            print($number);\
  \ // 显示 $number 的值\n            print(\"<br>\"); // 换行\n            $number++; //\
  \ $number 的值加 1\n        } \n    ?>\n</body>\n</html>\n```\n\n![](img/0142.jpeg)\n\
  图 5.2: 输入 `whileLoops.php` 的语句。\n\n步骤 3：再次保存你的文件。\n\n![](img/0143.jpeg)\n图 5.3:\
