  Roses are Red<br/>\n\nViolets are Blue<br/>\n\nI'm no fan of Heredocs<br/>\n\nBut\
  \ I can teach you!<br/>\n\n<br/>\n\nTEST;\n\necho($poem);\n\nprint_r(str_split($name));\n\
  \nprint(\"<br/>\");\n\nprint(strrev(\"Wheel of Fortune\"));\n\nprint(\"<br/>\");\n\
  \nprint(\"<br/>\");\n\nprint(substr($poem, 0, 30));\n\n?>\n```\n\n### 课习题\n\n1.\
  \ 用于显示 heredoc 的符号是：\na. <<<\nb. >>>\nc. +++\nd. ---\n\n2. 哪个函数将字符串转换为数组？\na. `strrev()`\n\
  b. `str_split()`\nc. `str_con()`\nd. `str_arr()`\n\n### 10.3 会话\n\n当你浏览互联网时，通过点击链接从一个网页移动到另一个。当你点击链接时，Web\
  \ 服务器将其解释为对你点击的链接所指向页面的请求。它加载页面并执行页面的 HTML 和 CSS 命令以及任何 PHP 脚本。\n\nPHP 变量将进行初始化，执行计算、格式化文本、调整图像大小并定位，然后将完全渲染的页面发送到你的浏览器。随后，Web\
  \ 服务器将从内存中删除该页面。任何 PHP 变量的值以及任何计算结果都会丢失。如果由于某种原因你以后再次点击同一个链接，Web 服务器将再次通过相同的过程，而不会记得以前渲染过此页面。这就是所谓的“无状态（stateless）”。\n\
  \n在互联网早期的原始阶段，这是可以的，因为大多数时间信息都是以格式良好的页面显示的。但现在，在电子商务和交互时代，网页之间的某些连接必须被维护。当你从一个网页移动到另一个网页并返回时，网页中的变量值必须被保留并传递给下一个网页。这就是所谓的“维护状态（maintaining\
  \ state）”，或者更具体地说，“在浏览器请求之间保留应用程序的状态”。\n\n例如，购物车应用程序必须记住你从访问过的各个网页中选择了哪些项目。在大型多人在线角色战术/角色扮演游戏（mmorpg）中，你的角色必须维护其健康状态、武器、法术等。不仅是在你从一个等级移动到另一个等级时，还包括你在某一天注销而在另一天登录时。\n\
  \nPHP 有几种机制可以维护网页之间的状态，即隐藏表单字段、查询字符串、cookies 和会话（sessions）。我们将只调查会话（在本节中）和 cookies（在下一节中），它们是维护浏览器请求之间状态的最常用的两种方法。\n\
  \nPHP 会话是服务器上的一个临时文件，你可以在其中存储数据。一个短的会话 ID（`SID`）用于识别和保护该文件。此 `SID` 由服务器作为 cookie\
  \ 的一部分发送给浏览器。当浏览器下次向服务器发送请求时，它会将 `SID` cookie 发回服务器，允许服务器检索它之前保存的任何会话数据，并使这些会话数据在全局数组\
  \ `$_SESSION` 中可用。（服务器生成的 `SID` 是唯一的、随机的，并且几乎无法猜测，这使得它以及你的会话数据免受黑客的攻击。）\n\n虽然你可以在服务器会话文件中存储相当数量的数据（比\
  \ 4kb 的 cookie 能存储的要要多），但请记住，会话主要用于存储临时数据以维护网页之间的状态。一旦你关闭浏览器，会话数据将不再可用。要永久地存储大量数据，数据库将是合适的工具。\n\
  \n在处理会话时，无论是创建会话还是从之前的会话中检索数据，我们总是从 `session_start()` 函数开始编写代码。该函数创建一个会话或根据 `SID`\
  \ 恢复一个会话。\n\n当你调用 `session_start()` 时，该函数将在客户端搜索现有的 `SID`，如果找到，它会将此 `SID` 发送给服务器。服务器随后使用此\
  \ `SID` 从之前的会话文件中检索数据。如果没有找到 `SID`，`session_start()` 将不会发送任何内容，服务器检测到这一点后将自动创建一个\
  \ `SID` 并将其发回浏览器，然后等待任何数据保存在它创建的会话文件中。这一切只需通过调用 `session_start()` 自动完成。\n\n不过，有一个警告。包含\
  \ `session_start()` 调用的代码应该放置在 HTML 文档的 `<head></head>` 部分。这是为了确保对 `session_start()`\
  \ 的调用在任何输出发送到浏览器之前发生。（当我们讨论 cookies 时，也存在同样的警告。）\n\n看看下面的代码并将其输入名为 `sessions.php`\
  \ 的脚本中。\n\n#### Sessions.php\n\n```php\n<?php\n\n    session_start();   \n\n   \
  \ $name = \"Mark\";\n\n    $_SESSION['name'] = $name;\n\n    $_SESSION['password']\
  \ = \"chops\";\n\n    $_SESSION['age'] = \"37\";\n\n?>\n\n<a href=\"sessions.php\"\
  >Sessions 2</a>\n```\n如你所见，我们的第一行代码是调用 `session_start()`。\n\n```php.php\n<?php\n\
  \n    session_start();\n\n    $name = $_SESSION['name'];\n\n    $pw = $_SESSION['password'];\n\
  \n    $age = $_SESSION['age'];\n\n    print(\"Stored in the session: $name $pw $age\"\
  );\n\n?>\n```\n现在，让我们运行 `sessions.php`。你将在浏览器中看到的内容。注意，这是一个超链接，不同的颜色和下划线证明了这一点。\n\
  \nSession 2\n\n当你点击此链接时，你会执行脚本 `sessions.php` 并在你的浏览器中得到此显示。\n\nStored in the session:\
  \ Mark chops 37\n\n当你退出浏览器时，会话会自动删除，但你可能会发现必要在自动删除之前删除会话数据。这是通过 `session_destroy()`\
  \ 函数实现的。在 `sessions.php` 脚本末尾添加以下两行代码。\n\n```php\nsession_destroy();\n\nprint(\"\
  Session Destroyed. Please go to <a='sessions3.php'>Sessions 3</a>.\")\n```\n`sessions2.php`\
  \ 现在将检索由 `sessions.php` 保存的会话值并删除会话。现在，为了验证会话确实已删除，我们将创建一个包含以下代码的 `sessions3.php`\
  \ 脚本。\n\n#### Sessions3.php\n\n```php\n<?php\n\n    session_start();\n\n    if(isset($_SESSION['name']))\n\
  \n    {\n        $name = $_SESSION['name'];\n\n        $pw = $_SESSION['password'];\n\
  \n        $age = $_SESSION['age'];\n\n    } else\n    {\n        print(\"Session\
  \ appears to have been terminated.\");\n    }\n\n?>\n```\n\n<a href=\"sessions.php\"\
  >Session 1</a>\n\n`isset()` 函数在变量未被设置为 `NULL` 时返回 TRUE。否则返回 FALSE。\n\n\n\n\n\n现在让我们连续执行脚本\
  \ `sessions.php`、`sessions2.php` 和 `sessions3.php`。这将产生以下三个屏幕。\n\n![](img/00301.jpeg)\n\
  图 10.11：脚本 `sessions.php` 的屏幕输出\n\n![](img/00302.jpeg)\n图 10.12：脚本 `sessions2.php`\
  \ 的屏幕输出\n\n![](img/00303.jpeg)\n图 10.13：脚本 `sessions3.php` 的屏幕输出\n\n## 完整代码列举\n\n\
  ### Sessions.php\n```php\n<?php\n    session_start();\n    $name=\"Mark\";\n   \
  \ $_SESSION['name'] = $name;\n    $_SESSION['password'] = \"lobsterchops\";\n  \
  \  $_SESSION['age'] = \"37\";  \n?>\n```\n<a href=\"sessions2.php\">Sessions 2</a>\n\
  \n### Sessions2.php\n```php\n<?php\n    session_start();\n    $name = $_SESSION['name'];\n\
  \    $pw = $_SESSION['password'];\n    $age = $_SESSION['age'];\n    print(\"Stored\
  \ in the session: $name $pw $age\");\n    session_destroy();\n    print(\" <br>\
  \ Session Destroyed. Please go to <a href='sessions3.php'>Sessions 3</a>. </br>\"\
  )\n?>\n```\n\n### Sessions3.php\n```php\n<?php\n    session_start();\n    if(isset($_SESSION['name']))\n\
  \    {\n    $name = $_SESSION['name'];\n    $pw = $_SESSION['password'];\n    $age\
  \ = $_SESSION['age'];\n    } else\n    {\n        print(\"Session appears to have\
  \ been terminated.\");\n    }\n?>\n```\n<a href=\"sessions.php\">Session 1</a>\n\
  \n## 复习题\n\n1. 使用哪个函数来启动每个会？\n   a. `session_start()`\n   b. `session_begin()`\n\
  \   c. `session_initiate()`\n   d. 以上均非\n\n2. 当我们不再需要某个会 时，使用哪个函数？\n   a. `session_end()`\n\
  \   b. `session_finish()`\n   c. `session_destroy()`\n   d. 以上均非\n\n## 10.4 Cookies\n\
  \n在上一节中，我们讨论了会（sessions），它们是服务器上的临时文件，客户端浏览器在其中存储数据以维持浏览器请求之间的状态。而 cookie 则是由服务器遗留在客户端计算机上的文件，大小不超过\
  \ 4kb。\n\n当浏览器向服务器请求页面时，服务器会在其对浏览器请求的响应头中向浏览器发送一个或多个 cookie。\n\n当浏览器下一次向留下该 cookie\
  \ 的同一服务器发送请求时，cookie 中的数据将通过请求自动发送到服务器。通过 cookie，服务器可以“记住”这个特定的浏览器客户端，并可以使用由该客户端发送的\
  \ cookie 中的数据，为该特定的客户端浏览器定制唯一的响应。\n\nCookie 只能由创建它的服务器进行检索，因此提供了一定程度的安全性。尽管如此，它们仍然容易受到黑客攻击，并且应仅用于非关键数据（例如用户偏好）。浏览器也可以禁用\
  \ cookie 支持，从而切断对 cookie 的任何访问。某些客户端可能完全不支持 cookie。客户端持有的 cookie 数量也有限制。每个域名仅允许\
  \ 20 个 cookie，且客户端一次只能持有 300 个 cookie。尽管如此，对于用户偏好等非安全关键数据，cookie 可以是维护状态的无比价值的工具。\n\
  \ncookie 中的数据应按照以下参数的顺序排列：\n\n| Cookie 字段 | 描述 |\n| :--- | :--- |\n| name | 特定 cookie\
  \ 的唯一名称。不允许有空格或分号。 |\n| value | 附加到此 cookie 的任意字符串值。 |\n| expire | cookie 的过期日期。过期时间指定为戳或自\
  \ 1970 年 1 月 1 日午夜 (GMT) 以来的秒数。 |\n| path | 浏览器仅对于此路径下的 URL 才会该 cookie。 |\n| domain\
  \ | 浏览器仅对于该域名内的 URL 返回该 cookie。 |\n| secure | 浏览器仅通过 https 连接传输 cookie。 |\n\n表 10.4：cookie\
  \ 参数的强制性顺序顺序。\n\n使用 `setcookie()` 函数创建 cookie 并将其发送到浏览器是简单的。该函数发送适当的 HTTP 头部以在浏览器中创建\
  \ cookie。`setcookie()` 函数的参数与上表所示的参数相同。通常情况下，你只需要提供前三个或前四个参数（name、value、expire 和\
  \ path），但应尽可能提供六个参数。\n\n`setcookie()` 函数也应该在向向浏览器发送任何输出之前调用，因为 `setcookie()` 在服务器的\
  \ HTTP 响应头部中发送 cookie。如果你在调用 `setcookie()` 之前向浏览器发送输出，PHP 将先发送响应头部。因此，`setcookie()`\
  \ 失去了随响应头部发送 cookie 的能力。正因如此，包含 `setcookie()`调用的代码被放置在文档的 `<head>` 部分。\n\n以下是创建名为\
  \ `band` 和 `food` 的两个 cookie 的代码。`band` 将在一个小时后过期，而 `food` 将在 30 天过期。\n\n### Cookies.php\n\
  ```php\n<?php\nsetcookie(\"band\", \"Journey\", time()+ 3600); // 一小时后过期\nsetcookie(\"\
  food\", \"pasta\", time()+ (60 * 60 * 24 * 30) ); // 30 天后\n?>\n```\n\n现在我们在浏览器中有了两个\
  \ cookie，获取它们就像创建它们一样简单。使用 `$_COOKIE` 关联数组，它包含了浏览器发送的所有 cookie。使用键来获取值。\n\n### Cookies2.php\n\
  ```php\n<?php\n$band = $_COOKIE['band'];\n$food = $_COOKIE['food'];\n\nprint(\"\
  Band: \" . $band);\nprint(\"<br/>Food: \" . $food);\n?>\n```\n显示结果应该是：\nJourney\n\
  Pasta\n\n要删除或“过期”一个 cookie，调用 `setcookie()` 并要删除的 cookie 名称、空字符串（或任何值）作为第二个参数，并将过去的戳作为第三个参数。例如：\n\
  \n```php\nsetcookie(\"food\", \"\", (time()-1));\n```\n\n现在将之前的调用加入 `sessions2.php`。运行脚本，你将获得与\
  \ `sessions.php` 的结果，因为我们对 `setcookie()` 使用了过去的戳。为了验证此 cookie 是否已删除，输入以下代码并将其保存为\
  \ `cookies3.php`。\n\n### Cookies3.php\n```php\n<?php\n$band = $_COOKIE['band'];\n\
  print(\"Band: \" . $band);\n\nif(isset($_COOKIE['food']))\n{\n    print(\"<br/>Food\
  \ set\");\n}\nelse\n{\n    print(\"<br/>No cookie found.\");\n}\n?>\n```\n`isset()`\
  \ 函数在变量被设置时返回 TRUE。否则返回 FALSE。当你运行 `cookies3.php` 时，你将在浏览器中得到以下结果：\nJourney\nNo\
  \ cookie found.\n\ncookie ‘food’ 已删除或过期。\n\n\n\n\n\na. 一个文件。\nb. 一个函数。\nc. 一个命令。\n\
  d. 以上都不是。\n\n2. 使用哪个函数来创建 cookie？\na. `setcookie()`\nb. `startcookie()`\nc. `createcookie()`\n\
  d. 以上都不是。\n\n# 第 10 章 实验题\n\n1. 确保你的 MAMP 或 WAMP 服务器堆栈已下载、安装并运行。\n2. 建立一个 HTML 文档，并在文档的\
  \ `<body>` 部分嵌入 PHP 的开始标签和结束标签。按照文中的描述，将该文档保存到你的 `www` 文件夹（Windows）或 `htdocs` 文件夹（Mac）中。\n\
  3. 创建一个短表单，让用户输入用户名。将用户名存储在会话（session）变量中。\n4. 创建第二个页面，从会话变量中读取用户名。向用户输出问候语。\n5.\
  \ 输出问候语后，销毁会话并将用户名存储在名为 `username` 的 cookie 中。设置 cookie 在 30 分钟后过期。\n6. 创建一个新页面并获取\
  \ cookie。使用 `date()` 函数在页面顶部显示当前日期。\n7. 将字符串“You have reached the end of PHP for\
  \ Beginners.” 存放在变量 `$message` 中。\n8. 输出字符串中的字符数量。\n9. 使用字符串函数和任何必要的代码，将所有元音替换为\
  \ X 并再次输出字符串。\n10. 使用字符串函数将字符串转换为数组，并使用循环输出数组的每个元素。（不要使用 `print_r`。）\n\n# 第 10 章\
  \ 实验答案\n\n### Lab.php:\n\n```php\n<!DOCTYPE html>\n<head>\n    <title>Lab 10</title>\n\
  \    <?php\n        $user;\n        if(isset($_REQUEST['user']))\n        {\n  \
  \          $user = $_REQUEST['user'];\n            session_start();\n          \
  \  $_SESSION['username'] = $user;\n            print(\"Session saved\");\n     \
  \   }\n    ?>\n</head>\n<body>\n    <form action=\"lab.php\" method=\"post\">\n\
  \        <label for=\"user\">Username:</label><input type=\"text\" id=\"user\" name=\"\
  user\" />\n        <br/><input type=\"submit\" value=\"Save Session\" />\n     \
  \   <br/><a href=\"lab2.php\">Go to page 2</a>a>\n    </form>\n</body>\n</html>\n\
  ```\n\n### Lab2.php\n\n```php\n<?php\n    session_start();\n    $username = $_SESSION['username'];\n\
  \    print(\"Hello \" . $username);\n    session_destroy();\n    setcookie(\"username\"\
  , $username, time() + 1800);\n    print(\"<br/><a href='lab3.php'>Go to page 3</a>\"\
  );\n?>\n```\n\n### Lab3.php\n\n```php\n<?php\n    print(date(\"D F d, Y h:i:s\"\
  ));\n    $username = $_COOKIE[\"username\"];\n    print(\"<br/>From Cookie: \" .\
  \ $username);\n    $message = \"You have reached the end of PHP for Beginners.\"\
  ;\n    print(\"<br/>\");\n    print(\"String length: \" . strlen($message));\n \
  \   print(\"<br/>\");\n    print(\"<br/>\");\n    $vowels = array(\"a\", \"e\",\
  \ \"i\", \"o\", \"u\", \"A\", \"E\", \"I\", \"O\", \"U\");\n    $newMessage = str_replace($vowels,\
  \ \"X\", $message);\n    print($newMessage);\n    print(\"<br/>\");\n    print(\"\
  <br/>\");\n    $messageArray = explode(\" \", $message);\n    for($i=0;$i<count($messageArray);$i++)\n\
  \    {\n        print($messageArray[$i] . \"<br/>\");\n    }\n?>\n```\n\n![](img/00304.jpeg)\n\
  图 10.14：脚本 `Lab.php` 的屏幕输出。用户名字段中已输入“Alison”。\n\n![](img/00305.jpeg)\n图 10.15：脚本\
  \ `Lab2.php` 的屏幕输出\n\n![](img/00306.jpeg)\n图 10.16：脚本 `Lab3.php` 的屏幕输出\n\n## 第 10\
  \ 章总结\n\n在本章中，你学习了如何使用 PHP 的 `date()` 和 `time()` 函数来访问和处理日期与时间。你还学习了操纵字符串的不同方法，以及\
  \ PHP 字符串的两种行为：单引号和双引号的使用以及 heredoc 表示法。我们探索了使用 session 和 cookie 来维护浏览器到服务器请求之间的状态。在我们结束最后一章之际，我们向你致意并赞扬你坚持完成了这本入门书的十章。你应该为自己感到自豪——干得好！现在让我给你提一个建议：我相信你一定熟悉“不用就会生废（use\
  \ it or lose it）”这句话。没错，这句话也适用于你的知识！确保你积极使用你的知识——经常练习和复习概念，以保持记忆的新颖。现在就用你所学的知识开始编程之旅吧！祝你好运！\n\
  \n# 答案页\n\n### 第 1 章：你的第一个脚本\n1. PHP 代表什么？\n答案：b. Pretext Processor（预文本处理器）。\n2.\
  \ WAMP 中的 A 代表什么？\n答案：a. Apache。\n3. 使用什么地址检查由 Windows Apache 服务器生成的首页？\n答案：a. `http://localhost`\n\
  4. 正确的开始标签是什么？\n答案：d. `<?php`\n5. 哪个命令可以输出格式化字符串？\n答案：d. `printf()`\n\n## 第 2 章：变量\n\
  1. 什么是变量？\n答案：a. 变量是数据的容器。\n2. 常见的算术运算符有哪些？\n答案：c. 加、减、除。\n3. 拼接字符串的正确语法是什么？\n答案：c.\
  \ `.`\n4. 给某个变量加 1 使用什么运算符？\n答案：a. `++`\n\n## 第 3 章：数组\n1. 什么是数组？\n答案：b. 数组是多个变量的容器。\n\
  2. 在示例中，`arrayName[]=` 赋值什么？\n答案：c\n3. 多维数组最简单的解释是什么？\n答案：b. 它们是数组中的数组。\n4. 简单数组和全局数组的区别是什么？\n\
  答案：b. 全局数组来自用户输入、URL、cookie，而简单数组是由程序员定义的。\n\n### 第 4 章：控制结构 - 选择\n1. 什么是条件语句？\n\
  答案：d. 判断一个表达式的真假并执行与真或假值相关的操作。\n2. 逻辑运算符 `<=` 表示什么？\n答案：d. 小于等于。\n3. 复杂条件的例子是？\n\
  答案：d. 一系列 if-else 语句。\n4. switch-case-break 条件最好定义为？\n答案：c. 有许多情况的条件。\n5. switch-case-break\
  \ 区分大小写吗？\n答案：d. 默认区分，可以通过添加多个情况来消除大小写。\n6. 三元运算符是什么？\n答案：a. 与变量相关的单行 if-else 语句。\n\
  7. 三元语句中的 `?` 和 `:` 分别代表什么？\n答案：a. If 和 else。\n\n# 第 5 章：控制结构 - 循环\n1. 什么是循环？\n\
  答案：c. 根据程序设置重复代码段的命令。\n2. while 循环和 do-while 循环的主要区别是什么？\n答案：c. do-while 即使初始值为\
  \ FALSE 也会执行一次；while 如果初始值为 FALSE 则忽略循环。\n3. 什么是 for 循环？\n答案：c. for 循环是将逻辑和参数都包含在一行的紧凑循环类型。\n\
  \n### 第 6 章：自定义 PHP 函数\n1. 什么是函数？\n答案：a. 存储在特定关键字下的相关代码块，可以被调用并重复使用。\n2. 什么是参数？\n\
  \n\n\n\n\n答案：a. 传递函数的值或字符串。\n\n### 3. return 语句是如何工作的？\n\n答案：a. return 结束函数的执行，并向函数的调用者返回一个值。\n\
  \n### 4. 哪个函数在传递的参数的文件名无法找到时会产生错误并终止脚本？\n\n答案：c. `require`\n\n## 第 7 章：服务器文件 I/O\n\
  \n### 1. File I/O 是什么意思？\n\n答案：a. 文件输入与输出（File Input and Output）。\n\n### 2. 获取服务器文本文件内容最快的方法是什么？\n\
