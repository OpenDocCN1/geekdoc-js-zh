  图 6.29: 章节练习解答。\n\n## 章节总结：\n\n在本章中，我们仅涵盖了函数的基础知识，即：\na. 如何调用或执行函数\nb. 如何创建自定义函数\n\
  c. 如何将函数组织在多个容器文件中\nd. 如何将容器文件中的函数引入 PHP 脚本中\ne. 如何将参数传递给函数参数以及\nf. 如何返回值\n\n在下一章中，我们将讨论服务器输入输出（I/O）。你将学习服务器如何处理文件，并介绍执行这些文件过程的不同命令和函数。\n\
  \n## 第 7 章：服务器文件 I/O\n\n### 章节目标：\n* 你能够定义什么是服务器文件。\n* 你能够描述服务器文件的基础知识。\n* 你将学习如何访问服务器上的文件：读取、写入、打开、关闭、追加和删除。\n\
  * 你能够描述什么是 CSV 文件以及如何处理和组织这些文件以可用的格式。\n\n\n\n\n\n以下是本章介绍的函数，它们用于 PHP 服务器文件的输入/输出操作：\n\
  \n| 函数 | 描述 | 参数 |\n| :--- | :--- | :--- |\n| `fopen()` | 打开文件。 | 文件指针，访问模式 |\n\
  | `fclose()` | 关闭文件。 | 文件指针，访问模式 |\n| `fwrite()` | 向在服务器中打开的文件写入内容。 | 文件指针，资源文件\
  \ |\n| `fgets()` | 从文件中读取单行。 | 资源文件，字符大小 |\n| `fgetc()` | 从文件中读取单个字符。 | 资源文件 |\n\
  | `file_get_contents()` | 将整个文件读取到字符串中。 | 资源文件，字符大小 |\n| `fread()` | 从已打开的文件中读取。\
  \ | 文件指针，字符大小 |\n| `fgetcsv()` | 读取保存的 CSV 文件。 | 文件指针，字符大小 |\n| `feof()` | 检查是否已到达“文件末尾”。局限性：以\
  \ w、a、x 模式打开的文件无法被读取。 | 文件指针 |\n| `unlink()` | 删除文件。 | 资源文件 |\n| `or die()` | 如果在输入输出过程中遇到错误，则终止程序。通常与函数\
  \ `fopen` 连接。 | 字符串参数 |\n| `filesize()` | 获取字节单位的文件大小。 | 空或整数值 |\n\n表 7.1 介绍的命令和函数列表。\n\
  \n某些文件函数需要特定的模式作为参数之一。这些模式指定了访问类型。以下是 PHP 调用 `fopen()` 函数时使用的模式列表。\n\n| 模式 | 描述\
  \ |\n| :--- | :--- |\n| `r` | 以仅只读模式打开文件。文件指针位于文件开头。 |\n| `r+` | 以读写模式打开文件。文件指针位于文件开头。\
  \ |\n| `w` | 以仅只写模式打开文件。打开并清空文件内容，如果文件不存在则创建一个新文件。在任何情况下，你都会获得一个新的空文件用于写入数据，且文件指针位于文件开头。\
  \ |\n| `w+` | 以读写模式打开文件。打开并清空文件内容，如果文件不存在则创建一个新文件。文件指针位于文件开头。 |\n| `a` | 以追加（写入）模式打开文件。将数据写入现有文件的末尾。如果文件不存在则创建一个新文件。文件指针位于文件末尾。\
  \ |\n| `a+` | 以追加（写入）和读取模式打开文件。将数据写入现有文件的末尾。如果文件不存在则创建一个新文件。文件指针位于文件末尾。 |\n| `x`\
  \ | 以仅只写模式打开文件。创建一个新文件。如果文件已存在，则返回 FALSE 并报错。 |\n| `x+` | 以读写模式打开文件。创建一个新文件。如果文件已存在，则返回\
  \ FALSE 并报错。 |\n\n表 7.2 PHP 文件访问模式。\n\n我们将从一个脚本开始，该脚本向文本文件写入数据，然后是另一个获取该同一文本文件内容的脚本。\n\
  \n### 问题\n编写一个 PHP 脚本，将包含名称的数据写入文本文件。\n\n### 解决方案\n\n### 步骤 1\n首先使用 Komodo Edit\
  \ 使用 HTML 文档模板创建一个 PHP 文档。\n\n![](img/00207.jpeg)\n\n图 7.1：在 Komodo Edit 中创建一个名为\
  \ `fileIO_1.php` 的新 HTML 模板。\n\n### 步骤 2\n将文件保存到你的 `www` 或 `htdocs` 文件夹下，名为 `fileIO_1.php`。\n\
  \n### 步骤 3\n我们要写入的文件名为 `\"names.txt\"`，我们将把此文件名存储在变量 `$fileName` 中。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>Saving Files into the Server</title>\n\
  </head>\n<body>\n    <?php\n    $fileName = \"names.txt\";\n```\n\n### 步骤 4\n接下来，我们将使用\
  \ `fopen()` 函数访问 `\"names.txt\"`，该函数接受两个参数：文件名和模式。这是 `fopen()` 函数的正确格式。\n\n```php\n\
  fopen($fileName, 'w')\n```\n\n我们使用的模式是 `'w'`，这意味着以只写模式打开文件。\n\n现在，`fopen()` 函数返回一个文件句柄，除了其他用途外，它是与我们打开的文件相关的指针，我们用它来访问文件内容。我们将文件句柄存储在变量\
  \ `$fp` 中。我们更新后的 `fopen()` 函数格式现在为：\n\n```php\n$fp = fopen($fileName, 'w')\n```\n\
  \n**提示：** 文件句柄是资源数据类型，是 PHP 八种数据类型之一。文件句柄而非文件名，是执行对文件执行输入输出操作的主要手段。我们的程序访问的每个文件必须分配一个唯一的文件句柄。\n\
  \n`fopen()` 函数通常与命令 `or die` 连接，如果在执行 `fopen()` 函数期间遇到错误，它将终止程序并显示错误信息 `\"Can’t\
  \ open the file\"`。我们为 `fopen()` 函数的最终程序语句是：\n\n```php\n$fp = fopen($fileName, 'w')\
  \ or die (\"Can't open the file\");\n```\n\n现在 `fopen()` 函数已通过返回句柄成功访问了 `names.txt`，我们可以开始写入它。我们使用返回的句柄来标识文件。\n\
  \n### 步骤 5\n关闭脚本和 HTML 文档。\n\n```php\nfclose($fp);\n```\n\n### 步骤 6\n代码列表将如下：\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Saving Files into the Server</title>\n\
  </head>\n<body>\n    <?php\n    $fileName = \"names.txt\";\n    $fp = fopen($fileName,\
  \ 'w') or die (\"Can't open the file\");\n    fclose($fp);\n    ?>\n</body>\n</html>\n\
  ```\n\n![](img/00208.jpeg)\n\n图 7.2：在 Komodo Edit 中看到的 `fileIO_1.php` 初始代码列表。\n\n\
  我们现在有了大多数 PHP 输入输出的骨架。指定文件名，调用 `fopen()` 函数，然后调用 `fclose()`。\n\n### 步骤 7\n声明数组 `$name`，其成员为\
  \ John, Guile, Lily, Ervin, Adam, Mary 和 Irene。\n\n```php\n$name = array(\"John\"\
  , \"Guile\", \"Lily\", \"Ervin\", \"Adam\", \"Mary\", \"Irene\");\n```\n\n### 步骤\
  \ 8\n现在，我们将数组 `$name` 中的名称存在 `names.txt`。我们通过遍历数组并使用 `fwrite()` 函数写入每个名称。在每个名称的末尾，我们追加换行符\
  \ `\"\\n\"`。换行符指示一个名称的结束和另一个的开始。它还指示了我们想要开始新的一行。\n\n```php\nfor($i = 0; $i<count($name);\
  \ $i++) {\n    fwrite($fp, $name[$i] . \"\\n\");\n}\n```\n\n### 最终结果\n`fwrite()`\
  \ 函数需要两个参数。第一个是 `fwrite()` 将要写入的文件句柄 `$fp`。第二个是待写入的数据——数组成员 `$name[$i]`。\n\n这是追加后的代码列表看起来应该是这样的：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Saving Files into the Server</title>\n\
  </head>\n<body>\n    <?php\n    $fileName = \"names.txt\";\n    $fp = fopen($fileName,\
  \ 'w') or die (\"Can't open the file\");\n    $name = array(\"John\", \"Guile\"\
  , \"Lily\", \"Ervin\", \"Adam\", \"Mary\", \"Irene\");\n    for($i = 0; $i<count($name);\
  \ $i++) {\n        fwrite($fp, $name[$i] . \"\\n\");\n    }\n    fclose($fp);\n\
  \    ?>\n</body>\n</html>\n```\n\n![](img/00209.jpeg)\n\n图 7.3：在 Komodo Edit 中看到的\
  \ `fileIO_1.php` 完整代码列表。\n\n\n\n\n我们现在运行程序，仅是为了检查 `names.txt` 文件是否已实际保存或写入你的本地服务器。请确保你已经保存了\
  \ `fileIO_1.php` 文件。\n\n在本地浏览器中运行 `fileIO_1.php`。目前，忽略显示的任何错误信息。\n\n![](img/00210.jpeg)\n\
  \n图 7.4：`fileIO_1.php` 首次运行时的输出。\n\n现在页面正在运行，我们可以检查特殊的 `htocs` 或 `www` 文件夹寻找 `names.txt`\
  \ 文件。\n\n打开你的 `wamp/www` 或 `mamp/htdocs` 文件夹：\n\n![](img/00211.jpeg)\n\n图 7.5：通过文档浏览器打开的\
  \ `Names.txt`。\n\n点击文件名并选择“使用记事本查看”。请注意，当你打开文本文件时，名称将作为连续的单个单词文本显示，因为记事本会忽略换行符。\n\
  \n![](img/00212.jpeg)\n\n图 7.6：使用记事本查看的 `Names.txt`。\n\n尝试使用 WordPad 等其他应用程序查看 `names.txt`\
  \ 文件，你会发现它将数组成员显示为列表：\n\n![](img/00213.jpeg)\n\n图 7.7：使用 WordPad 查看的 `names.txt`。\n\
  \n在这里我们可以看到在使用 `fwrite()` 函数将名称写入文本文件之前，我们在每个名称后面追加的换行符的效果：\n\n```php\nfwrite($fp,\
  \ $name[$i] . \"\\n\");\n```\n\nWordPad 将换行符解释为开始新一行的指示。相反，记事本忽略换行符。\n\n## 7.2 在服务器上读取文件\n\
  \n现在 `names.txt` 文件已经写入或保存到服务器中，我们将检索它的内容。我们将使用 PHP 中三个常用的文件数据检索的函数：`fread()`、`file_get_contents()`\
  \ 和 `fgets()`。\n\n`fread()` 函数从文件中读取一个字符字符串。它需要两个参数：一个文件句柄（资源数据类型）和要读取的字符数（整数数据类型）。示例如下：\n\
  \n```php\n$string = fread($fp, 20);\n```\n\n在那个示例中，从文件句柄 `$fp` 指向的文件读取 20 个字符，然后存储在变量\
  \ `$string` 中。之后，文件指针将位于文件的第 21 个字符处。\n\n**问题：** 使用 `fread()` 函数读取文件 `names.txt`\
  \ 的全部内容。\n\n**解决方案：**\n\n**步骤 1：** 在 Komodo Edit 中打开 `fileIO_1.php` 并删除 `fopen()`\
  \ 和 `fclose()` 函数调用之间的所有程序语句。\n\n**步骤 2：** 将 `<title>` 标签之间的文本从“Saving Files into\
  \ the Server”改为“Reading Files from the Server”。\n\n**步骤 3：** 在函数调用 `fopen()` 中，将第二个参数模式从\
  \ `'w'` 更改为 `'r'`。`'r'` 参数意味着我们将访问文件是为了读取其数据。\n\n![](img/00214.jpeg)\n\n图 7.8：根据图\
  \ 7.2 复制的程序文件 `fileIO_1.php`，我们将保存为 `readFile_1.php`。`fopen()` 和 `fclose()` 调用之间的所有代码已被删除。\n\
  \n**步骤 4：** 将你的文档保存为 `readfile_1.php`。这是此步骤后你的代码列表应有的样子：\n\n代码列表：`readFile_1.php`\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Reading Files From The Server</title>\n\
  </head>\n<body>\n    <?php\n        $fileName = \"names.txt\";\n        $fp = fopen($fileName,\
  \ 'r');\n        fclose($fp);\n    ?>\n</body>\n</html>\n```\n\n![](img/00215.jpeg)\n\
  \n图 7.9：在 Komodo Edit 中看到的 `readFile_1.php` 完整代码列表。\n\n**步骤 5：** 紧接 `fopen()` 调用之后，输入\
  \ `fread()` 的调用。\n\n```php\n$string = fread($fp, 20);\n```\n\n这是完整代码列表应有的样子：\n\n\
  代码列表：`readFile_2.php`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Reading\
  \ Files From The Server</title>\n</head>\n<body>\n    <?php\n        $fileName =\
  \ \"names.txt\";\n        $fp = fopen($fileName, 'r');\n        $string = fread($fp,\
  \ 20);\n        fclose($fp);\n        echo($string);\n    ?>\n</body>\n</html>\n\
  ```\n\n![](img/00216.jpeg)\n\n图 7.10：`readFile_2.php` 的完整代码列表。\n\n如果运行该脚本，输出将是这样的：\n\
  \n![](img/00217.jpeg)\n\n图 7.11：`readFile_2.php` 运行时的输出。\n\n如你所见，并不是所有的名称都显示在浏览器中，正如我们命令的那样，`fread()`\
  \ 只检索了 20 个字符。要确切从文件中读取多少字节，我们需要 `filesize()` 函数，它会告诉我们特定文件中究竟有多少字节。\n\n**步骤 1：**\
  \ 创建一个新文件并命名为 `readFile_3.php`。复制 `readFile_2.php` 中的代码。\n\n**步骤 2：** 找到调用 `fread()`\
  \ 的那一行。将其从：\n\n```php\n$string = fread($fp, 20);\n```\n\n改为：\n\n```php\n$string\
  \ = fread($fp, filesize($fileName));\n```\n\n注意 `filesize()` 函数接受一个参数，即文件句柄。\n\n\
  **步骤 3：** 创建整个文件。更新后的代码必须是：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Reading\
  \ Files From The Server</title>\n</head>\n<body>\n    <?php\n        $fileName =\
  \ \"names.txt\";\n        $fp = fopen($fileName, 'r');\n        $string = fread($fp,\
  \ filesize($fileName));\n        fclose($fp);\n        echo($string);\n    ?>\n\
  </body>\n</html>\n```\n\n![](img/00218.jpeg)\n\n图 7.12：`readFile_3.php` 的完整代码列表。\n\
  \n**步骤 4：** 运行脚本并查看输出。\n\n![](img/00219.jpeg)\n\n图 7.13：`readFile_3.php` 运行时的输出。\n\
  \n如你所见，`names.txt` 的全部内容现在显示在浏览器中。让我们使用 `fread()` 和 `filesize()` 函数读取另一个文本文件。\n\n\
  **步骤 5：** 创建一个新文件并将其命名为 `names.txt`。确保将该文本文件保存在 `www` 或 `htocs` 文件夹中。包含以下名称及其科学名称：\n\
  \n| 常用名称 | 科学名称 |\n| :--- | :--- |\n| 蚂 | Hymenoptera |\n| 蝙 | Chiroptera |\n| 熊\
  \ | Ursidae Carnivora |\n| 骆驼 | Camelidae |\n| 猫 | Felis Catus |\n| 犬 | Canis Familiaris\
  \ |\n| 蛙 | Anura Ranidae |\n| 狮 | Panthera Leo |\n| 羊 | Bovidae Ovis |\n| 虎 | Panthera\
  \ Tigris |\n\n表 7.3：`names.txt` 的名称列表。\n\n使用 Komodo Edit 创建并保存 `names.txt`。\n\n\
  ![](img/00220.jpeg)\n\n图 7.14：使用 Komodo Edit 创建的 `names.txt`。\n\n**步骤 6：** 将将“names.txt”赋值给变量\
  \ `$fileName` 的那行从：\n\n```php\n$fileName = \"names.txt\";\n```\n\n改为：\n\n```php\n\
  $fileName = \"names_2.txt\";\n```\n\n这是你完整代码列表应有的样子：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Reading Files From The Server</title>\n</head>\n<body>\n\
  \    <?php\n        $fileName = \"names_2.txt\";\n        $fp = fopen($fileName,\
  \ 'r');\n        $string = fread($fp, filesize($fileName));\n        fclose($fp);\n\
  \        echo($string);\n    ?>\n</body>\n</html>\n```\n\n**步骤 7：** 保存你的文件。\n\n\
  **步骤 8：** 运行你的代码并显示输出。\n\n![](img/00221.jpeg)\n\n图 7.15：`readFile_3.php` 运行时的输出。\n\
  \n![](img/00222.jpeg)\n\n图 7.16：`readFile_3.php` 运行时的全屏输出。\n\n图 7.16 是图 7.15 的全屏版本。注意，无论浏览器缩小、拉伸、调整大小还是最大化，你都会看到常用名称和科学名称作为连续的一行文本显示。\n\
  \n现在，让我们使用 `file_get_contents()` 函数读取 `names_2.txt`。该函数将整个文件的内容读取到字符串中，而无需文件句柄。因此，我们不需要调用\
  \ `fopen()` 和 `fclose()` 函数。\n\n**步骤 1：** 创建一个新的 HTML5 文档模板并将文件命名为 `readFile_4.php`。将其保存在你的\
  \ `www` 或 `htocs` 文件夹中。\n\n**步骤 2：** 按照你看到的输入以下代码。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Reading Files From The Server</title>\n</head>\n<body>\n\
  \    <?php\n        $file = \"names.txt\";\n        $string = file_get_contents($file);\n\
  \        echo($string);\n    ?>\n</body>\n</html>\n```\n\n\n\n你可以看到我们的代码要简单得多。我们不需要调用\
  \ `fopen()` 和 `fclose()` 函数。我们只需要调用 `file_get_contents()` 函数并传入两个参数：我们想要读取的文件名，以及一个\
  \ `true` 或 `false` 的布尔值。\n\n在 `$string` 赋值语句中，布尔参数 `TRUE` 仅意味着在访问文件时包含路径。由于我们的脚本和文本文件都在\
  \ `www` 或 `htdocs` 文件夹中，因此第二个参数没有影响。\n\n**提示：** `file_get_contents()` 函数最多可以接受五个参数。第一个参数\
  \ `filename` 是必须的，而其余四个是可选的。你可以访问 [`www.php.net/file_get_contents`](http://www.php.net/file_get_contents)\
  \ 了解更多关于该函数的详细信息。\n\n![](img/00223.jpeg)\n图 7.17：`readFile_4.php` 的代码列表。\n\n###\
  \ 步骤 3：保存文件并运行你的输出。\n\n![](img/00224.jpeg)\n图 7.18：`readFile_4.php` 运行时的输出。\n\n\
  `file_get_contents()` 函数仅通过几行代码就一次性提取了整个文件的内容。\n\n现在，我们将使用 `fgets()` 函数来读取文件。此函数需要一个文件句柄，因此我们必须用\
  \ `fopen()` 打开文件，并最终用 `fclose()` 关闭它。现在，`fgets()` 会从文件中读取字节，直到遇到换行符或文件结束标记。然后它会停止读取字节，并将文件指针留在遇到的换行符正之后的字符上。\n\
  \n### 步骤 1：打开一个 HTML5 文档模板，并将此程序保存为 `www` 或 `htdocs` 文件夹中的 `readFile_5.php`。\n\n\
  ### 步骤 2：通过包含 PHP 脚本标签开始编写你的代码。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  \
  \  <title>从服务器读取文件</title>\n</head>\n<body>\n    <?php\n```\n\n### 步骤 3：将字符串 “names.txt”\
  \ 存储在变量 `$fileName` 中。\n```php\n$fileName = \"names.txt\";\n```\n\n### 步骤 4：使用读取模式调用\
  \ `fopen()` 函数。\n```php\n$fp = fopen($fileName, 'r');\n```\n\n### 步骤 5：使用文件处理器变量\
  \ `$fp` 作为函数的参数调用 `fgets()` 函数。我们将 `fget()` 从文件中读取的字节存储在变量 `$string` 中。\n```php\n\
  $string = fgets($fp);\n```\n\n### 步骤 6：调用 `fclose()` 并使用 `echo()` 函数显示 `$string`\
  \ 的内容。\n```php\nfclose($fp);\necho($string);\n```\n\n### 步骤 7：关闭 PHP 脚本标签和 HTML\
  \ 文档。确保已保存你的文档。\n```php\n?>\n</body>\n</html>\n```\n\n### 步骤 8：你的完整代码列表看起来应该是应该是这样的：\n\
  **代码列表：`readFile_5.php`**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>从服务器读取文件</title>\n\
  </head>\n<body>\n    <?php\n        $fileName = \"names.txt\";\n        $fp = fopen($fileName,\
  \ 'r');\n        $string = fgets($fp);\n        fclose($fp);\n        echo($string);\n\
  \    ?>\n</body>\n</html>\n```\n\n### 步骤 9：运行你的脚本。\n\n![](img/00225.jpeg)\n图 7.19：`readFile_5.php`\
  \ 运行时的输出。\n\n你应该能在浏览器中看到显示 ‘John’。\n\n现在，让我们使用相同的脚本读取文件 `names_2.txt`。\n\n### 步骤\
  \ 1：在 Komodo Edit 中仍打开 `readFile_5.php` 的情况下，将字符串 “names_2.txt” 存储在变量 `$fileName`\
  \ 中。\n```php\n$fileName = \"names_2.txt\";\n```\n\n### 步骤 2：点击 文件 > 另存为... > 将文件保存为\
  \ `readFile_6.php`。\n\n![](img/00226.jpeg)\n图 7.20：另存为对话框。\n\n![](img/00227.jpeg)\n\
  图 7.21：将 `readFile_5.php` 保存为 `readFile_6.php`。\n\n### 步骤 3：运行你的脚本。\n\n![](img/00228.jpeg)\n\
  图 7.22：`readFile_6.php` 运行时的输出。\n\n你应该在浏览器中看到 “Ant => Hymenopterous formicidae”。\n\
  \n现在，`fgets()` 从文件中读取字节，直到遇到换行符或文件结束标记。然后它会停止读取字节，并将文件指针留在遇到的换行符正之后的字符上。那么，我们如何使用\
  \ `fgets()` 函数读取整个文件呢？\n\n我们使用一个 `while` 循环，其中使用布尔函数 `feof()` 作为条件表达式。当到达文件结束标记时，该函数返回\
  \ `TRUE`。\n\n### 步骤 1：创建一个新的 HTML5 模板。包含 PHP 标签并将文件命名为 `readFile_7.php`。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>从服务器读取文件</title>\n</head>\n<body>\n\
  \    <?php\n```\n\n### 步骤 2：将字符串 “names.txt” 存储在变量 `$fileName` 中。\n```php\n$fileName\
  \ = \"names.txt\";\n```\n\n### 步骤 3：使用读取模式调用 `fopen()` 函数。\n```php\n$fp = fopen($fileName,\
  \ 'r');\n```\n\n### 步骤 4：将 `$string` 初始化为空字符串。\n```php\n$string = \"\";\n```\n\n\
  ### 步骤 5：创建一个 `while` 循环，其中使用布尔函数 `feof()` 作为我们的条件表达式。当到达文件结束标记时，该函数返回 `TRUE`。我们需要这样做是因为\
  \ `fgets()` 每次从文件中读取一行，我们将这些行追加到 `$string`。\n```php\nwhile(!feof($fp)) {\n    $string\
  \ .= fgets($fp);\n    $string .= \"<br/>\";\n}\n```\n\n### 步骤 6：关闭文件句柄。\n```php\n\
  fclose($fp);\n```\n\n### 步骤 7：显示文件。\n```php\necho($string);\n```\n\n### 步骤 8：关闭\
  \ PHP 标签和 HTML 文档。\n```php\n?>\n</body>\n</html>\n```\n\n### 步骤 9：这是 `readFile_7.php`\
  \ 的完整代码：\n**代码列表：`readFile_7.php`**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \    <title>从服务器读取文件</title>\n</head>\n<body>\n    <?php\n        $fileName = \"\
  names.txt\";\n        $fp = fopen($fileName, 'r');\n        $string = \"\";\n  \
  \      while(!feof($fp)) {\n            $string .= fgets($fp);\n            $string\
  \ .= \"<br/>\";\n        }\n        fclose($fp);\n        echo($string);\n    ?>\n\
  </body>\n</html>\n```\n\n### 步骤 10：运行你的脚本。\n\n![](img/0229.jpeg)\n图 7.23：`readFile_7.php`\
  \ 的输出。\n\n每个名字都显示在不同的行上。\n\n现在，让我们调整脚本来读取 `names_2.txt`。将字符串 “names_2.txt” 存储在变量\
  \ `$fileName` 中，然后整个脚本保存为 `readFile_8.php`。这是完整的代码：\n\n**代码列表：`readFile_8.php`**\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>从服务器读取文件</title>\n</head>\n\
  <body>\n    <?php\n        $fileName = \"names_2.txt\";\n        $fp = fopen($fileName,\
  \ 'r');\n        $string = \"\";\n        while(!feof($fp)) {\n            $string\
  \ .= fgets($fp);\n            $string .= \"<br/>\";\n        }\n        fclose($fp);\n\
  \        echo($string);\n    ?>\n</body>\n</html>\n```\n\n运行 `readFile_8.php` 并查看输出。\n\
  \n![](img/0230.jpeg)\n图 7.24：`readFile_8.php` 的输出。\n\n这里有包含 `names_2.txt` 文件的动物及其科学名称列表。\n\
  \n## 7.3 追加和删除\n\n追加服务器文件意味着向文件中添加数据。新数据被添加到文件的末尾，因此被称为追加。修改或编辑文件中存在的数据更为复杂，这里不进行讨论。\n\
  \n要追加或删除文件，必须先打开文件。打开文件的函数是熟悉的 `fopen()`，但模式设置为 ‘a’，代表“追加”。\n\n`fwrite()` 是我们在第一个示例\
  \ `fileIO_1.php` 中使用的函数，用于向服务器文件追加数据。该函数需要两个参数：文件句柄和要写入或追加到文件的字符串。\n\n（同样注意，在第一个例子\
  \ `fileIO_1.php` 中，我们调用 `fopen()` 时使用的是 ‘w’ 模式。但在这里，我们使用的是 ‘a’ 模式。你认为这是为什么？）\n\n\
  现在，让我们离开一下，检查一下我们的 WAMP 服务器是否仍在运行并在线。我们应该看到的是：\n\n![](img/0231.jpeg)\n图 7.25：WAMP\
  \ 服务器菜单。\n\n### 步骤 1：使用 HTML5 模板创建一个新的 PHP 文件并将其保存到 `www` 或 `htdocs` 文件夹中。将文件保存为\
  \ `appendFile.php`。\n\n### 步骤 2：嵌入 PHP 标签，声明文件名变量 `$fileName` 并使用模式 ‘a’ 调用 `fopen()`\
  \ 函数。这应该是你的代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>从服务器追加文件</title>\n\
  </head>\n<body>\n    <?php\n        $fileName = \"names.txt\";\n        $fp = fopen($fileName,\
  \ 'a');\n```\n\n\n\n\n### 步骤 3\n我们将向 `names.txt` 文件中添加“John”和“Jane”这两个名字，但首先我们需要分别将这些名字存储在变量\
  \ `$name1` 和 `$name2` 中。\n\n```php\n$name1 = \"John\";\n$name2 = \"Jane\";\n```\n\
  \n### 步骤 4\n调用 `fwrite()` 函数并传入正确的参数数量和顺序：文件句柄和数据字符串。为我们将追加的每个名称末尾一个换行符。\n\n```php\n\
  fwrite($fp, $name1 . \"\\n\");\nfwrite($fp, $name2 . \"\\n\");\n```\n\n### 步骤 5\n\
  回到 `fopen()` 的调用处，添加 `or die` 子句，以便在 `names.txt` 文件不存在时向用户发出警告。\n\n```php\n$fp =\
  \ fopen($file, 'a') or die (\"Can't Open The File\");\n```\n\n### 步骤 6\n关闭文件指针。\n\
  \n```php\nfclose($fp);\n```\n\n### 步骤 7\n添加一个 `echo` 语句，通知用户新数据已添加。\n\n```php\n\
  echo(\"names.txt has been overwritten!\")\n```\n\n### 步骤 8\n关闭 PHP 脚本和 HTML 文档并再次保存你的文件。\n\
  \n```php\n?>\n</body>\n</html>\n```\n\n### 步骤 9\n现在，完整的代码列表看起来应该是是这样的：\n\n**代码列表：appendFile.php**\n\
  \n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <title>从服务器上追加和删除文件</title>\n</head>\n\
  <body>\n<?php\n    $file = \"names.txt\";\n    $fp = fopen($file, 'a') or die (\"\
  Can't Open The File\");\n    $name1 = \"John\";\n    $name2 = \"Jane\";\n    fwrite($fp,\
  \ $name1 . \"\\n\");\n    fwrite($fp, $name2 . \"\\n\");\n    fclose($fp);\n   \
  \ echo(\"New Data Has Been Added!\")\n?>\n</body>\n</html>\n```\n\n### 步骤 10\n运行你的脚本。\n\
  \n你应该能看到“New Data Has Been Added”的消息，但让我们直接访问 `names.txt` 文件，查看“John”和“Jane”这两个名字是否确实已经被添加。使用\
  \ `Komodo Edit` 或任何文本编辑器打开 `names.txt` 文件。\n\n![](img/00232.jpeg)\n图 7.26：验证 `names.txt`\
  \ 中新追加的名称“John”和“Jane”。\n\n![](img/00233.jpeg)\n图 7.27：通过 `Komodo Edit` 查看 `names.txt`\
  \ 文件的内容。\n\n![](img/00234.jpeg)\n图 7.28：通过 `Notepad` 查看 `names.txt` 文件的内容。\n\n现在两个名字“John”和“Jane”已经添加到\
  \ `names.txt` 文件中了。\n\n现在让我们使用 `unlink()` 函数从服务器上删除文件，该函数接受我们想要删除的文件的完整文件名作为其所需的第一个参数。例如：\n\
  \n```php\nunlink(\"filename.ext\");\n```\n\n就如此简单。不需要文件句柄，因此不需要使用 `fopen()` 和 `fclose()`。\n\
  \n但首先，让我们创建一个将删除的文件。它是一个简单的文本文件，命名为 `deletedMessage.txt`，包含文本“This file will be\
  \ deleted from the server.”。我们将它创建并保存到 `www` 或 `htocs` 文件夹中。\n\n### 步骤 1\n使用你的文本编辑器，点击“新建文件”（New\
  \ File）并选择“文本”（Text）。选择目录 `C:\\wamp\\www` 并输入文件名 `deletedMessage.txt`。点击“打开”（Open）。\n\
  \n### 步骤 2\n在文本编辑器输入“This file will be deleted from the server.”保存文件。\n\n![](img/00235.jpeg)\n\
  图 7.29：在 `Komodo Edit` 中看到的 `deletedMessage` 内容。\n\n现在文件 `deletedMessage` 已保存到服务器上。\n\
  \n检查 `www` 或 `htocs` 文件夹检查文本文件是否成功保存。\n\n![](img/00236.jpeg)\n图 7.30：从本地浏览器查看文件\
  \ `deletedMessage.txt`。\n\n该文本文件也可以使用 `Notepad` 保存。\n\n![](img/00237.jpeg)\n图 7.31：使用\
  \ `Notepad` 创建文件 `deletedMessage.txt`。\n\n确保你将此文件保存在 `www` 或 `htocs` 文件夹内。\n\n![](img/00238.jpeg)\n\
  图 7.32：本地磁盘 (`C:`) > `wamp` > `www` 文件夹。\n\n![](img/00239.jpeg)\n图 7.33：使用 `Notepad`\
  \ 保存的文件 `deletedMessage.txt`。\n\n### 步骤 3\n创建一个新的 HTML5 文档模板，并按照此处所示完全输入以下代码：\n\n\
  **代码列表：viewDeleteFile.php**\n\n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <title>从服务器上删除文件</title>\n\
  </head>\n<body>\n<?php\n    unlink(\"deletedMessage.txt\");\n    echo(\"</br> deletedMessage.txt\
  \ has been deleted!\")\n?>\n</body>\n</html>\n```\n\n### 步骤 4\n以文件名 `viewDeleteFile.php`\
  \ 保存脚本。\n\n![](img/00240.jpeg)\n图 7.34：`viewDeleteFile.php` 的输出。\n\n现在，检查 `www`\
  \ 或 `htocs` 文件夹查看文件是否还在。\n\n![](img/00241.jpeg)\n图 7.35：`www` 文件夹中的 `deletedMessage.txt`。\n\
  \n## 7.4 CSV 文件\n\nCSV 文件，或逗号分隔值文件（Comma-Separated Values），是由逗号分隔的文本文件。这种格式非常常见且流行，主要用于在\
  \ Excel 或其他软件之间转换数据。CSV 文件通过逗号分隔每个字段，并以换行符结束每一行。如下所示的 `deletedItems.csv` 示例：\n\n\
  | Category | Description | Price |\n| :--- | :--- | :--- |\n| meat | $12.00 | |\n\
  | veggies | $2.50 | | |\n| dairy | $1.50 | |\n| condiments | $1.00 | |\n| packaged\
  \ fruit | $3.00 | |\n| spices | $1.75 | |\n\n图 7.4：`deletedItems.csv` 列表。\n\nPHP\
  \ 有一个特殊函数 `fgetcsv()`，它可以从 CSV 文件读取一行并将其逗号分隔的字符串解析为数组。也就是说，逗号分隔的字符串变成了数组中的元素。\n\n\
  在此之前，让我们使用 `Komodo Edit` 创建 CSV 文件 `deletedItems.csv`。这是我们将使用 `fgetcsv()` 函数读取的文件。\n\
  \n### 步骤 1\n使用 `Komodo Edit` 在 `c:\\wamp\\www` 或 `c:\\wamp\\htocs` 文件夹中打开一个新的文本文件。\n\
  \n![](img/00242.jpeg)\n图 7.36：使用 `Komodo Edit` 创建 `deletedItems.csv`。\n\n### 步骤\
  \ 2\n在文本编辑器输入之前所示的 `deletedItems.csv` 内容，保存文件。\n\n![](img/00243.jpeg)\n图 7.37：新创建\
  \ `deletedItems.csv`。\n\n代码区域右侧的新列称为“显示地图”（Minimap）。你可以通过点击“视图”（View）然后取消勾选“显示地图”（View\
  \ Minimap）来防止其显示。\n\n![](img/00244.jpeg)\n图 7.38：在 `Komodo Edit` 中取消勾选“View Minimap”。\n\
  \n你得到了文件的最终视图。\n\n![](img/00245.jpeg)\n图 7.39：`Komodo Edit` 中 `deletedItems.csv`\
  \ 的纯视图。\n\n如果你愿意，可以调整窗口大小如所示，以便更清晰地查看图像。\n\n![](img/00243.jpeg)\n图 7.40：调整后的 `Komodo\
  \ Edit` 窗口。\n\n### 步骤 3\n现在，我们将编写脚本来读取 `deletedItems.csv` 的全部内容，并将每行显示为表格中的一行，并将行的每个逗号分隔值显示为表格中的单元格。\n\
  \n步骤 3：使用 HTML5 模板创建一个 PHP 文件。将文件保存为 `readCSV.php`。嵌入 PHP 开启标签。\n\n```php\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>读取 CSV 文件</title>\n</head>\n<body>\n<?php\n\
  ```\n\n![](img/00246.jpeg)\n图 7.41：为 `readCSV.php` 创建新的 HTML5 模板。\n\n\n\n\n\n###\
  \ 第 4 ：将字符串“deliveredItems.csv”存储在变量 `$fileName` 中。\n\n```php\n$fileName = \"deliveredItems.csv\"\
  ;\n```\n\n### 第 5 ：调用 `fopen()` 函数以‘r’模式访问 `deliveredItems.csv`。将返回的文件句柄存储在变量 `$fp`\
  \ 中。\n\n```php\n$fp = fopen($fileName, 'r');\n```\n\n此时，你的代码看起来应该是这样的：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>读取 CSV 文件</title>\n</head>\n<body>\n\
  <?php\n    $file = \"deliveredItems.csv\";\n    $fp = fopen($file, 'r');\n?>\n</body>\n\
  </html>\n```\n\n现在，我们将利用 `while` 循环逐行读取 `deliveredItems.csv`。当我们读取到某行时，我们将会把该行中用逗号分隔的值格式化为表格的一行，然后将该行追加到变量\
  \ `$output` 中，该变量最终将包含我们构建的所有行。\n\n### 第 6 ：在进入 `while` 循环之前，将变量 `$output` 初始化为空字符串\
  \ \"\"。\n\n```php\n$output = \"\";\n```\n\n### 第 7 ：现在使用条件表达式 `!feof($fp)` 声明 `while`\
  \ 循环。\n\n```php\nwhile(!feof($fp))\n```\n\n### 第 8 ：`while` 循环中的第一个语句是调用函数 `fgetcsv()`，该函数将从\
  \ `deliveredItems.csv` 读取一行，然后并将该行中每个用逗号分隔的值存储为数组 `$inventory` 中的一个元素。\n\n```php\n\
  $inventory = fgetcsv($fp, 1024);\n```\n\n此时，你的代码应该像这样：\n\n```php\n$output = \"\"\
  ;\nwhile(!feof($fp))\n{\n    $inventory = fgetcsv($fp, 1024);\n```\n\n在每次调用 `fgetcsv()`\
  \ 之后，`$inventory` 将包含包含四个元素的数组。这四个元素对应于 `deliveredItems.csv` 中某行的四个用逗号分隔的值。\n\n\
  - `m-000, meat, $12.00, 10`\n\n### 第 9：我们将在表格的一行（由四个单元格组成）中显示 `$inventory` 的四个元素。以下代码构建了表格的行。\n\
  \n```php\n$line = \"\";\n$line .= \"<tr>\";\n$line .= \"<td align='center'>\" .\
  \ $inventory[0] . \"</td>\";\n$line .= \"<td align='center'>\" . $inventory[1] .\
  \ \"</td>\";\n$line .= \"<td align='center'>\" . $inventory[2] . \"</td>\";\n$line\
  \ .= \"<td align='center'>\" . $inventory[3] . \"</td>\";\n$line .= \"</tr>\";\n\
  ```\n\n### 第 10：一旦构建好一行，它就会被追加到变量 `$output` 中，该变量最终将包含表格的所有行。\n\n```php\n$output\
  \ .= $line;\n```\n\n注意，我们在进入循环之前已经将 `$output` 初始化为空字符串 \"\"。\n\n### 第 11：当 `while`\
  \ 循环结束时（因为它已经到达了 `deliveredItems.csv` 的文件结束标记），我们可以以表格的形式显示输出。\n\n```php\nprint(\"\
  <table border='1' cellpadding='1'>\");\nprint($output);\nprint(\"</table>\");\n\
  ```\n\n### 第 12：关闭脚本标签和 HTML 文档并再次保存你的文件。\n\n**代码列表：readCSV.php**\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>读取 CSV 文件</title>\n</head>\n<body>\n<?php\n\
  \    $file = \"deliveredItems.csv\";\n    $fp = fopen($file, 'r');\n    $output\
  \ = \"\";\n    while(!feof($fp))\n    {\n        $inventory = fgetcsv($fp, 1024);\n\
  \        $line = \"\";\n        $line .= \"<tr>\";\n        $line .= \"<td align='center'>\"\
  \ . $inventory[0] . \"</td>\";\n        $line .= \"<td align='center'>\" . $inventory[1]\
  \ . \"</td>\";\n        $line .= \"<td align='center'>\" . $inventory[2] . \"</td>\"\
  ;\n        $line .= \"<td align='center'>\" . $inventory[3] . \"</td>\";\n     \
  \   $line .= \"</tr>\";\n        $output .= $line;\n    }\n    print(\"<table border='1'\
  \ cellpadding='1'>\");\n    print($output);\n    print(\"</table>\");\n?>\n</body>\n\
  </html>\n```\n\n### 第 13：运行你的程序并查看你的输出。\n\n提示：如果你想让表格中的项目描述显示为左对齐而不是居中，请将 readCSV.php\
  \ 列表中的表格 `<td>` 值从‘center’替换为‘left’。\n\n## 测验\n1. File I/O 是什么意思？\n   a. 文件输入和输出（File\
  \ Input and Output）。\n   b. 文件输入输出。\n   c. 文件进入和在。\n   d. 文件内部和外部。\n2. 获取服务器上文件内容最快的方法是？\n\
  \   a. `file_get_contents`\n   b. `fgets`\n   c. `fread`\n3. ‘a’ 代表什么？\n   a. Affix（附加）。\n\
  \   b. Append（追加）。\n   c. Arbitrary（任意的）。\n   d. Apprehend（理解）。\n4. 在服务器上通常用于打开文件？\n\
  \   a. Access（访问）。\n   b. Append（追加）。\n   c. Read（读取）。\n   d. Open（打开）。\n5. CSV\
  \ 代表什么？\n   a. Comma-separated Values（逗号分隔的值）。\n   b. Common System Volume。\n  \
  \ c. Computer System Vision。\n   d. Creative Standard Video。\n\n#### 练习\n1. File\
  \ I/O 是什么意思？\n2. 获取服务器上文件内容最快的方法是？\n3. ‘a’ 代表什么？\n4. 在服务器上通常用于打开文件？\n5. CSV 代表什么？\n\
  6. 创建一个包含以下内容的 PHP 脚本程序：\n   - 使用一个 `while` 循环逐行读取 `deliveredItems.csv`。\n   - 当我们读取某行时，我们将该行中用逗号分隔的值格式化为表格的一行。\n\
  \   - 然后将该行追加到变量 `$output` 中。\n   - 这四个元素对应于 `deliveredItems.csv` 中某行的四个用逗号分隔的值：\n\
  \     - `m-000, meat, $12.00, 10`\n   - 我们将在表格的一行（由四个单元格组成）中显示 `$inventory` 的四个元素。\n\
  \   - 一旦构建好一行，它就会被追加到变量 `$output` 中。\n   - 当 `while` 循环结束时（因为它已经到达了 `deliveredItems.csv`\
  \ 的文件结束标记），我们可以以表格的形式显示输出。\n   - 创建一个 HTML 表格，并使用 `border='1'` 和 `cellpadding='1'`\
