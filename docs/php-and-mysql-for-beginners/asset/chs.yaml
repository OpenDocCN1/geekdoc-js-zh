  \ 的输出。\n\n### 5.3 For-Loop\n\n到目前为止，我们学习了 `while-` 和 `do-while-` 语句这两种简单的 PHP 迭代结构。一种不那么简单的循环\
  \ 但紧凑且强大的迭代结构，是程序员最喜爱的 `for` 语句，其结构和语法如下：\n\n```\nfor (set-start; continue-condition;\
  \ increment){\n    // 要循环的代码块\n}\n```\n控制 for 循环逻辑的所有逻辑和参数都声明在它的第一行括号内。有三个语句必须声明在括号内。它们被恰地命名为\
  \ `set-start`、`test-condition` 和 `increment`，以表示每个语句的功能。注意只有前两个语句以分号结尾。\n\n\n\n\n\
  `set-start` 语句设置循环计数变量的初始值。计数变量用于记录循环执行的次数。变量如何递增（或递减）是在递增语句中设置的。\n\n`continue-condition`\
  \ 语句声明了循环继续执行的条件表达式。该条件在每次循环开始时进行求值。如果求值结果为 TRUE，则执行循环；否则，循环终止。\n\n`increment` 语句设置了每次执行循环时计数变量所递增（或递减）的数值。在大多数情况下，该变量每次递增\
  \ 1，但也允许任何值，包括负值。计数变量的当前值让我们随时知道循环已经经过了多少迭代。\n\n`for-loop` 语句的使用频率比 `while-` 和 `do-while-`\
  \ 高得多，尤其是当你知道需要迭代代码块多少次时。`for-loop` 成为程序员首选迭代结构的特征是：启动、继续和终止循环所需的所有逻辑都可以直接从 `for-loop`\
  \ 的第一行中读取。这与 `while-` 和 `do-while-` 循环不同，后者仅显式声明了循环继续执行的条件表达式。因此，在 `while-` 和 `do-while`\
  \ 循环中，你必须阅读并搜索代码以找到哪个变量（及其初始值）将用作循环计数器，以及它将按什么值递增。\n\n让我们分析一个从 1 计数到 10 的简单 `for-loop`。\n\
  \n```php\nfor ($i = 1; $i <= 10; $i++)\n{\n    echo ($i . </br>)\n}\n```\n\n`set-start`\
  \ 语句 `$i =1` 将计数变量 `$i` 设置为其初始值 1。在每次 `for-loop` 代码块执行结束时，`$i` 将递增 1（如递增语句 `$i++`\
  \ 中定义）。\n\n在 `for-loop` 执行的最开始处，会求值测试条件 `$i <=10`。由于执行开始时 `$i` 的值为 1，该条件表达式的结果将为\
  \ TRUE。在代码块的前 10 次迭代中它将为 TRUE，但在第 11 次迭代开始时，`$i` 将变为 11，从而导致 `for-loop` 终止。\n\n\
  现在让我们学习按二、三和倒序显示整数的 `for-loops` 示例。这需要按 1 以外的值进行递增和递减。\n\n### 问题\n创建一个 `for-loop`，按二和三计数，然后从\
  \ 40 到 4 递四计数。\n\n### 解决方案\n\n**步骤 1:** 创建一个新的 HTML5 文件并将其保存为 `forLoops_1.php`，放在你的\
  \ `www` 或 `htdocs` 文件夹中。\n\n![](img/00160.jpeg)\n图 5.20：在 Komodo Edit 中打开新的 HTML5\
  \ 文档。\n\n**步骤 2:** 输入以下程序语句。\n\n代码列表：`forLoops_1.php`\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>For-loop Example 1</title>\n</head>\n<body>\n    <?php\n\
  \        echo(\"Count by twos from 0 to 10:</br>\");\n        for($i = 0; $i <=10;\
  \ $i+=2)  //从 0 到 10 每隔二计数\n            {\n                echo($i . \"</br>\");\n\
  \            }\n        echo(\"Count by threes from 0 to 15:</br>\");\n        for($i\
  \ = 0; $i <=15; $i+=3)  //从 0 到 15 每隔三计数\n            {\n                echo($i\
  \ . \"</br>\");\n            }\n        echo(\"Count backwards by fours from 40\
  \ down to 4:</br>\");\n        for($i = 40; $i >=4; $i-=4)  //从 40 到 4 倒序每隔四计数\n\
  \            {\n                echo($i . \"</br>\");\n            }\n    ?>\n</body>\n\
  </html>\n```\n\n这是你的代码在 Komodo Edit 中看起来的样子：\n![](img/00161.jpeg)\n图 5.21：输入 `forLoops_1.php`\
  \ 的语句。\n\n**步骤 3:** 保存你的文件。\n**步骤 4:** 运行输出。\n![](img/00162.jpeg)\n图 5.22：`forLoops_1.php`\
  \ 的输出\n\n### 5.4 Foreach-Loops\n\n`foreach-loop` 语句是一种修改过的 `for-loop` 语句，它仅适用于数组和对象。它不适用于任何其他类型。（对象将在第\
  \ 10 章学习）。`foreach-loop` 的目的是方便连续检索任何数组的元素。\n\n提示：数组在第 3 章中介绍过，清楚理解索引数组（或简单数组）、关联数组和多维数组之间的区别至关重要。你应该知道如何创建任何数组、如何填充它们，以及如何引用它们的成员。\n\
  \n当用于迭代索引数组或简单数组的成员时，`foreach-loop` 的结构和语法是：\n```php\nforeach($arrayName as $element)\n\
  ```\n\n当用于迭代关联数组的成员时，`foreach-loop` 的结构和语法是：\n```php\nforeach($arrayName as $key\
  \ => $element)\n```\n\n\n\n\n\n```php\n        foreach ($gpas as $key => $value)\n\
  \n        {\n            print(\"Name: \" . $key);\n            print(\"<br/>GPA:\
  \ \" . $value);\n            print(\"<br/>\");\n        }          ?>\n\n</body>\n\
  \n</html\n```\n\n![](img/00164.jpeg)\n\n图 5.24：输入 `foreachLoops_1.php` 的语句\n\n第\
  \ 3 步：保存文件。\n\n第 4 步：运行输出。\n\n![](img/00165.jpeg)\n\n图 5.25：`foreachLoops_1.php`\
