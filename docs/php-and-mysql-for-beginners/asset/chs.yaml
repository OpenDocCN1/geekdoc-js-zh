  \ dogAgeCalc(5);\n    ?>\n</body>\n</html>\n```\n\n---\n\n### 6. 返回语句\n\nPHP 函数只返回一个值。`return`\
  \ 语句是可选的，但如果没有提供值，函数将返回 `null`。\n\n提示：如果你忘记了表达式，`return` 接受一个整数。如果你想返回多个值怎么办？使用数组！\n\
  \n让我们看看下面的例子：\n\n**代码列表：`returnExample1.php`**\n\n```php\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>Return Example 1</title>\n    <?php\nfunction square($value)\n{\n\
  \    $value = $value*$value;\n    return $value;\n}\n?>\n</head>\n<body>\n    <?php\n\
  \    print(\"The square of 2 is \" . square(2));\n    $result = square(2);\n   \
  \ </html>\n```\n\n![](img/00195.jpeg)\n\n图 6.20：`functionArgs.php` 的输出。\n\n现在，修改脚本使\
  \ `square()` 的返回值存储在变量 `$age` 中。\n\n```html\n<body>\n    <?php\n    print(\"The\
  \ square of 2 is \" . square(2));\n    $age = square(2);\n```\n\n现在，添加一个 `print()`\
  \ 语句来打印 `$age` 的值。\n\n更新后的代码列表应该是：\n\n**代码列表：`returnExample2.php`**\n\n```php\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Return Example 2</title>\n    <?php\nfunction\
  \ square($value)\n{\n    $value = $value*$value;\n    return $value;\n}\n?>\n</head>\n\
  <body>\n    <?php\n    print(\"The square of 2 is \" . square(2));\n    $age = square(2);\n\
  \    print(\"The square of 2 is \" . $age);\n    ?>\n</body>\n</html>\n```\n\n---\n\
  \n## 章节测试\n\n1. 什么是函数？\na. 存储在特定关键字下的相关代码块，可以被调用和重复使用。\nb. 产生曲线的方程。\nc. 在 PHP 中执行预设过程的完整代码列表。\n\
  d. 由代码、函数和命令组成的关键字。\n\n2. 什么是参数？\na. 传递给函数的值或字符串。\nb. 两种不同意见的冲突。\nc. 包含特定值的变量。\n\
  d. 完成函数的逗号隔开的值。\n\n3. 返回语句是如何工作的？\na. return 结束函数的执行并将值返回给该函数的调用者。\nb. return 将让代码从无值参数开始并重复自身。\n\
  \n\n\n\nc. `Return` 输出传递给函数的值。\n\nd. `Return` 处理操作列表并返回结果。\n\n## 4. 哪个函数在作为参数传递给函数的\
  \ la 无法找到时，会产生错误并终止脚本？\n\na. `include`\nb. `include_once`\nc. `require`\nd. 以上都不是。\n\
  \n## 章节练习题：\n\n1. 编写一个函数将摄氏度温度转换为华氏度。再编写另一个函数将华氏度温度转换为摄氏度。以下是公式。\n\n### 公式：\n- 华氏度转摄氏度：`Tc\
  \ = (5/9)*(Tf-32)`\n- 摄氏度转华氏度：`Tf = (9/5)*Tc+32`\n\n第一个练习中使用以下参数：\na. 待转换值：50\n\
  b. 函数名称：\n    - 华氏度转摄氏度 – `Celsius()`\n    - 摄氏度转华氏度 – `Fahrenheit()`\nc. 函数参数变量：`$temp`\n\
  \n使用双文档方法完成此任务。第一个文档应是命名为 `tempCalcFunc.php` 的函数容器文件。第二个文档是使用 HTML 文档模板保存的 `chap6Lab1_Sol.php`。\n\
  \n使用 `include` 函数引用容器文件。将结果显示为保留两位小数的浮点数。\n\n2. 修改你的程序，让用户可以使用表单输入温度值。使用单选按钮来指示温度是摄氏度还是华氏度。当用户点击提交按钮时，必须显示相应的结果。\n\
  \n使用与练习 1 相同的函数容器文件 `tempCalcFunc.php`。在 HTML 文档模板中为表单创建另一个 PHP 脚本文件。请使用文件名 `chap6Lab2_Sol.php`。\n\
  \n## 章节练习解答：\n\n### 代码列表：tempCalcFunc.php\n```php\n<?php\n    function Celsius($temp)\n\
  \    {\n        $temp = ((($temp*9)/5)+32);\n        print(\"The value in Fahrenheit\
  \ is \");\n        return($temp);\n    }\n    function Fahrenheit($temp)\n    {\n\
  \        $temp = (($temp-32)*5/9);\n        print(\"The value in Celsius is \");\n\
  \        return($temp);\n    }\n?>\n```\n![](img/00199.jpeg)\n图 6.24: 在 Komodo Edit\
