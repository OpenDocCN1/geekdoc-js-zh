  图 4.28：将 `$grade` 修改为 “A” 并查看输出。\n\n### 4.4 Switch 语句\n\n`switch-statement` 适用于需要对变量或表达式进行一组不同值测试的情况。这是\
  \ `switch-statement` 的结构和语法：\n\n```php\nswitch ($variable) {\n    case value1:\n\
  \        statements for value1. . .\n        break;\n    case value2:\n        statements\
  \ for value2. . .\n        break;\n    default:\n}\n```\n\n\n\n\n\n## switch 后的语句\n\
  \n第一行以 `switch` 关键字开头，后面紧跟括号内的测试变量名 `$variable`，这是要测试其值的变量。\n\n`case` 关键字定义了当 `case`\
  \ 关键字之后的值与测试变量 `$variable` 的当前值匹配时，将执行的程序语句。\n\n`break` 关键字用于终止 `switch-statement`。为什么需要\
  \ `break` 语句呢？当 case 值匹配测试变量的当前值时，会执行该 case 值的语句。执行后，程序将继续向下运行 `switch-statement`，依次执行所有其他\
  \ case 值的语句以及 `default` 分支，无论这些值是否与测试变量匹配！显显然，我们不希望这种情况发生，这就是为什么我们在每个 case 值的关联语句的最后要包含一个\
  \ `break` 语句。\n\n`default` 关键字定义了当没有任何 case 值与测试变量匹配时，将执行的语句。\n\n## 让我们来看一个例子\n\n\
  **问题：** 创建一个 `switch-statement` 例程，用于确定字母等级对应的数字分数范围，并相应地显示该分数范围的描述。请使用以下成绩表：\n\n\
  | 字母等级 | 输出消息 |\n| :--- | :--- |\n| A | A 意味着你的成绩在 91 到 100 之间。 |\n| B | B 意味着你的成绩在\
  \ 81 到 90 之间。 |\n| C | C 意味着你的成绩在 71 到 80 之间。 |\n| D | D 意味着你的成绩在 61 到 70 之间。 |\n\
  | F | F 意味着你的成绩在 51 到 60 之间。 |\n| default | 你输入的成绩无效。 |\n\n### 解决方案\n\n**代码列表：`switchCaseBreakConditional.php`\
  \ 的解决方案**\n\n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Switch-Case-Break\
  \ Conditionals</title>\n</head>\n<body>\n    <?php\n        $grade = 'A';\n    \
  \    switch($grade)\n        {\n            case 'A':\n                echo(\"A\
  \ means your grade is from 91-100.\");\n                break;\n            case\
  \ 'B':\n                echo(\"B means your grade is from 81-90.\");\n         \
  \       break;\n            case 'C':\n                echo(\"C means your grade\
  \ is from 71-80.\");\n                break;\n            case 'D':\n          \
  \      echo(\"D means your grade is from 61-70.\");\n                break;\n  \
  \          case 'F':\n                echo(\"F means your grade is from 51-60.\"\
  );\n                break;\n            default:\n                echo(\"The grade\
  \ you entered is invalid\");\n        }\n    ?>\n</body>\n</html>\n```\n\n**步骤 1：**\
  \ 创建一个空白 HTML5 文档并将其保存为文件名 `switchBreakConditional.php`。\n**步骤 2：** 在 `<title>`\
  \ 标签中输入“Switch-Case-Break”。在 `<body>` 中包含 PHP 的开始结束标签。\n**步骤 3：** 将初始值 ‘A’ 赋值给变量\
  \ `$grade`。编码整个解决方案并保存文件。\n\n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Switch-Case-Breakals</title>\n\
  </head>\n<body>\n    <?php\n        $grade = 'A';\n        switch($grade)\n    \
  \    {\n            case 'A':\n                echo(\"A means your grade is from\
  \ 91-100.\");\n                break;\n            case 'B':\n                echo(\"\
  B means your grade is from 81-90.\");\n                break;\n            case\
  \ 'C':\n                echo(\"C means your grade is from 71-80.\");\n         \
  \       break;\n            case 'D':\n                echo(\"D means your grade\
  \ is from 61-70.\");\n                break;\n            case 'F':\n          \
  \      echo(\"F means your grade is from 51-60.\");\n                break;\n  \
  \          default:\n                echo(\"The grade you entered is invalid\");\n\
  \        }\n    ?>\n</body>\n</html>\n```\n\n**步骤 4：** 启动浏览器，在地址栏中输入文件名并点击 `Go`\
  \ 或按回车键。等待一秒钟。\n**步骤 5：** 查看你的输出。如果 `$grade = ‘A’`。\n\n### 修改赋值的值\n\n**步骤 6：** 将\
  \ `$grade` 的值替换为 `B`、`C`、`D` 和 `F` 并查看结果。\n\n| 等级 | 预期输出消息 |\n| :--- | :--- |\n\
  | `$grade = ‘A’` | A 意味着你的成绩在 91 到 100 之间。 |\n| `$grade = ‘B’` | B 意味着你的成绩在 81 到\
  \ 90 之间。 |\n| `$grade = ‘C’` | C 意味着你的成绩在 71 到 80 之间。 |\n| `$grade = ‘D’` | D 意味着你的成绩在\
  \ 61 到 70 之间。 |\n| `$grade = ‘F’` | F 意味着你的成绩在 51 到 60 之间。 |\n| `$grade = ‘a’` |\
  \ 你输入的成绩无效。 |\n| `$grade = ‘E’` | 你输入的成绩无效。 |\n\n**步骤 7：** 查看输出。如果 `$grade = ‘B’`、`$grade\
  \ = ‘C’`、`$grade = ‘D’`、`$grade = ‘F’`。\n**步骤 8：** 将 `$grade` 替换为典型范围之外的值，例如 `‘a’`\
  \ 和 `‘E’`。注意结果。我们提到过 `switch-statement` 是区分大小写的，如果你尝试将“a”、“b”、“d”或“f”赋值给变量 `$grade`，就可以证明这一点。赋值任何这些小写字母会导致程序报告成绩无效。\n\
  \n`switch-statement` 可以通过在 case 之后添加另一个 case 来克服这一局限性。做法如下：\n\n```php\n<?php\n$variable\
  \ = value;\nswitch($variable)\n{\n    case 'A':\n    case 'a':\n        action;\n\
  \        break;\n    default:\n        default action;\n}\n?>\n```\n\n然而，这种 case\
  \ 序列仅适用于最多三个 case。如果已经有三个三个 case 需要串联，那么更实用的工具是使用包含多个条件的 `if-else` 语句并包含 OR 逻辑运算符。\n\
  \n为了加强这一讨论，我们在上一个示例 `switchCaseBreakConditional.php` 中应用 case 序列，以确保程序例程可以捕捉赋值给\
  \ `$grade` 的大写和小写等级。\n\n当代码中将 `$grade` 设置为 ‘a’` 时，查看 `switchCaseBreakConditionals_2.php`\
  \ 的输出会发生什么。\n\n```php\n<body>\n    <?php\n        $grade = 'a';\n```\n\n运行程序将得到结果：\n\
  \n\n\n\n\n![](img/00117.jpeg)\n\n图 4.40：将 `$grade` 的值改为 ‘a’ 并查看输出。\n\n这是因为现有代码没有提供小写字母\
