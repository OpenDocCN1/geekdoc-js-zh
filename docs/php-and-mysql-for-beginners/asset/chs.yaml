  \ Jared Sullinger | 0 | 3 |\n| Jason Terry | 9 | 10 |\n| D.J. White | 3 | 2 |\n\
  | Chris Wilcox | 1 | 2 |\n| Terrence Williams | 0 | 0 |\n\n### 问题 3\n创建一个程序来计算投资的每月收益。该程序必须生成包含以下信息的报告：\n\
