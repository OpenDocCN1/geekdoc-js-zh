  \ 和 ‘f’ 的情况。保持 `$grade` 的赋值为 ‘a’。\n\n**解决方案**：\n\n代码列表：`switchCaseBreakConditional_2.php`\
  \ 的解决方案\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Switch-Case-Break\
  \ Conditional 2</title>\n</head>\n<body>\n    <?php\n        $grade = 'a';\n   \
  \     switch($grade)\n        {\n            case 'A':\n            case 'a':\n\
  \                echo(\"A means your grade is from 91-100.\");\n            break;\n\
