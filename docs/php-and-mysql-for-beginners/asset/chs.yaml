  \ 标签源码。\n### 1.4 echo(), print() 和 printf() 命令\n本节将讨论使用 `PHP` 显示内容的基本命令。到目前，你已经熟悉了\
  \ `echo()` 命令。它只是可以显示文本并能容纳 HTML 标签的命令之一。其他同样向屏幕显示输出的命令是 `print()` 和 `printf()`。\n\
  `print()` 与 `echo()` 相同。它在浏览器中显示指定的文本。`echo()` 和 `print()` 之间没有太大区别。和 `echo()` 命令一样，`print()`\
  \ 可以在不需要括号 `()` 的情况下使用。例如：\n```php\n```\n\necho (\"Hello!\");\n\n\nprint \"Hello\"\
  ;\n将产生与相同的结果：\n```php\n```\n`printf()` 与 `print()` 不同。它也显示指定的输出，但使用了不同的格式：\n`printf(format,\
  \ arg1, arg2, argn);`\n`arg1`、`arg2` 和 `argn` 是指定的参数，它们将替换格式中插入的 `%` 号。例如：\n```php\n\
  ```\n`I am %d years old` 是格式，`21` 是参数。它打印出：I am 21 years old。`%d` 被称为标识符（signifier）。该标识符与整数配合使用——例如\
  \ `21`。\n使用 `printf()` 有几种不同的选项。例如，`%f` 标识符代表浮点数，即包含小数符号的数字，如 `-32.454`。`printf()`\
  \ 有许多可用的标识符，可以通过访问 [www.w3schools.com/php/func_string_printf.asp](http://www.w3schools.com/php/func_string_printf.asp)\
  \ 查看。\n你在 PHP 中实现这些命令的方式与实现 `echo()` 命令相同。现在让我们构造一个同时使用所有三个输出命令的程序，以便我们看到差异。\n**第\
  \ 1 步**：创建一个具有基础格式的 HTML 文档，并嵌入 `PHP` 开启和关闭标签。按照所给的格式使用我们刚刚学的命令：\n```html\n<html>\n\
  <title>output</title>\n<body>\n    echo \"This is echoed out\";\n    print (\"</br>This\
  \ line was displayed using print\");\n    printf (\"</br>Today is the year %d.\"\
  , 2013);\n?>\n</html>\n\n\n\n\n\n\n\n与 `print()` 相比，`Printf()` 有更多功能，并且由于格式化使得内容更容易理解。\n\
