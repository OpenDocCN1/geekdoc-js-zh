  \  \n</body>\n</html>\n```\n\n此表单的功能是显示一个员工的数据。放置在 HTML 文档 `<head></head>` 部分的以下\
  \ PHP 脚本执行了必要的数据库操作，以检索该员工的数据。\n\n```php\nrequire_once(\"connectInc.php\");\n$id=$_REQUEST['id'];\n\
  $sql = \"SELECT * FROM employee WHERE empid = '\" . $id . \"';\";\n$rs = $conn->query($sql);\n\
  if ( $rs === false ) {\n  trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error,\
  \ E_USER_ERROR);\n  die( \"Select Error: \" . $sql);\n} else {\n  $arr = $rs->fetch_array(\
  \ MYSQLI_ASSOC);\n}\n$conn->close();\n```\n\n当你阅读并分析这段代码时，请注意它也遵循我们最近在分析 `delete.php`\
  \ 代码时详细说明的 a-f 步骤模式。\n\na. 创建连接对象 `$conn`。\nb. 检查 `$conn` 是否成功创建。\nc. 构造 SQL 查询语句。\n\
  d. 使用连接对象的 `query` 方法执行查询。\ne. 检查查询是否执行成功。（对于 `SELECT` 查询，处理结果集对象 `$rs`。）\nf. 关闭连接。\n\
  \n我们不断重复这六步的原因是，这是任何访问 MySQL 数据库的 PHP 脚本的基本模式。理解并掌握这六步的逻辑将避免你以后在访问 MySQL 数据库时遇到任何烦恼！\n\
  \n现在，通过这一行代码将一个员工的数据存储在关联数组 `$arr` 中：\n\n`$arr = $rs->fetch_array( MYSQLI_ASSOC\
  \ );`\n\n该数组中的数据随后被表单元素用于显示。\n\n让我们分析以下显示关联数组 `$arr` 中数据的 HTML 和 PHP 代码：\n\n`<input\
  \ type=\"text\" value=\"<?php print($arr['lastname']) ?>\" name=\"last\"/>`\n\n\
  在这里，我们将 `<input>` 元素的 `value` 属性设置为数组 `$arr` 中某个元素的值，具体为键为 `lastname` 索引的元素。我们使用\
  \ PHP 代码来实现。在输入这一行时，你必须非常小心地将每个字符放在正确的位置，否则就会遇到各种错误。\n\n在部门（Department）字段的情况下，过程有所不同。在显示相应的\
  \ `department` 之前，我们必须对每个 `department` 值（1-4）进行单独测试。同样，在输入这一行时你必须非常小心，错位任何字符（特别是逗号、引号、斜杠、左括号或右大括号、括号），你都会遇到各种错误。\n\
  \n`<option <?php if($arr['department']==1) { print('selected'); } ?> value=\"1\"\
  >Accounting</option>`\n\n最后，我们必须处理 `empid` 字段。记住，该字段是主键，由 MySQL 数据库自动生成。一旦它分配给员工，就永远无法被修改。但我们需要从数据库中检索\
  \ `empid` 的值，并在更新过程中安全地保留此值，因为必须将其传回 MySQL 数据库，以识别员工表中已被我们的更改更新的确切记录。因此，我们将像这行代码所示使用一个隐藏字段：\n\
  \n`<input type=\"hidden\" name=\"id\" value=\"<?php print($id); />`\n\n将 `empid`\
  \ 存储在隐藏的 `<input>` 元素中确保该值也会包含在 post 方法中。现在考虑 `<form>` 元素的 `action` 属性。该属性被设置为 `updateProcess.php`。\n\
  \n`<form action=\"updateProcess.php\" method=\"post\">`\n\n为了确保更新的信息保存到数据库中，我们将创建\
  \ `updateProcess.php` 文件，代码如下：\n\n```php\n<?php\nrequire_once(\"ConnectInc.php\"\
  );\n$id = $_REQUEST['id'];\n$last = $_REQUEST['last'];\n$first = $_REQUEST['first'];\n\
  $department = $_REQUEST['department'];\n$position = $_REQUEST['position'];\n$salary\
  \ = $_REQUEST['salary'];\necho( $last . ' ' .\n$first . ' ' .\n$department . ' '\
  \ .\n$position . ' ' .\n$salary);\n$sql= \"UPDATE employee SET \" .\n\"lastname\
  \ = '\" . $last . \"', \" .\n\"firstname = '\" . $first . \"', \" .\n\"department\
  \ = '\" . $department . \"', \" .\n\"position = '\" . $position . \"', \" .\n\"\
  salary = '\" . $salary . \"' WHERE empid = '\" . $id . \"\";\nif ($conn->query($sql)\
  \ == false ) {\n  trigger_error('Wrong SQL: ' . $sql . ' Error: ' . $conn->error,\
  \ E_USER_ERROR);\n} else {\n  $affected_rows = $conn->affected_rows;\n  echo( \"\
  <br/>\" . $sql);\n  echo( \"<br/>Affected rows:  \" . $affected_rows );\n}\n$conn->close();\n\
  echo( \"<br/>User \" . $id . \" has been updated. <br/>Back to <a href='index.php'>Add-Upd-Del\
  \ Page</a>\");\n?>\n```\n\n在这里，我们使用了更新操作的 SQL 查询，我们将字段设置为新值，并使用 `where` 子句指示我们实际正在更新的记录。\n\
