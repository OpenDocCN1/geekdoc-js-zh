  );\n        }\n    ?>\n</body>\n</html>\n```\n\n### 步骤 5：重新加载 `conditionals_ifElse.php`\
  \ 并根据下表更改用户信息。\n\n| 年龄 | 国籍 |\n| :--- | :--- |\n| 21 | TRUE |\n| 16 | TRUE |\n|\
  \ 21 | FALSE |\n| 16 | FALSE |\n\n### 步骤 6：在每次输入后查看你的输出并确保结果正确。\n\n`if-statement`\
  \ 和 `if-else-statement` 只测试一个条件表达式。相比之下，`if-elseif-statement` 测试多个条件表达式。\n\n`if-statement`\
  \  own 一个代码块，`if-else-statement` 有两个代码块，而 `if-elseif-statement` 的代码块数量与其条件表达式的数量相同。\n\
  \n这是 `if-elseif-statement` 的语法。\n\n```php\nif (condexpr0){\n    code block for condexpr0\
  \ == TRUE . . .\n} elseif (condexpr1) {\n    code block for condexpr1 == TRUE .\
  \ . .\n} elseif (condexpr2) {\n    code block for condexpr2 == TRUE . . .\n} else\
  \ {\n    code block if all conditional expressions are FALSE\n}\n```\n\n#### if-elseif\
  \ 之后的语句\n\n关于 `if-elseif-statement` 有三点需要注意：\n\na. `else` 子句是可选的。\nb. 如果评估的任何一个条件表达式为\
  \ `TRUE`，则执行该条件表达式的代码块，然后控制跳转到 `if-elseif-statement` 之后的第一个语句。\nc. 如果 `if-elseif-statement`\
  \ 没有任何条件表达式评估为 `TRUE`，则执行与 `else` 子句关联的代码块（如果存在）。\n\n让我们来做一个例子。\n\n#### 问题：\n创建一个程序例程，根据识别出的数值分值显示相应的数值分值描述。该\
  \ PHP 脚本必须嵌入在 HTML 文档中。使用变量名 `$grade` 来存储数值分值的值。将默认成绩设置为 93。将文档保存为 `complexConditionals_2.php`。\n\
  \n| 条件 | 消息 |\n| :--- | :--- |\n| `$grade == 100 | Your grade is perfect! |\n| $grade\
  \ > 90 | Your grade is excellent! |\n| $grade > 80 | Your grade is great! |\n| $grade\
  \ > 70 | Your grade is good! |\n| $grade >= 60 | Your grade is average. |\n| $grade\
  \ <=50 | Your grade is below average. |\n| else | Either your grade is super low\
  \ or you entered an invalid grade :( |\n\n### 解决方案：\n**代码列表：complexConditionals_2.php\
  \ 的解决方案**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Complex Conditionals\
  \ 2</title>\n</head>\n<body>\n    <?php\n        $grade = 93;\n        if ($grade\
  \ == 100)\n        {\n            echo(\"Your grade is PERFECT!\");\n        }\n\
