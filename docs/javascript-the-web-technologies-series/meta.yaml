  md: '# Repeating Code


    The statements you have worked with so far execute one after the other in a linear
    fashion. The if, if...else, and switch statements select only one branch of code
    to execute, then continue to the statement that follows. But what if you want
    to repeat the same statement, function, or code section five times, ten times,
    or 100 times? For example, you might want to perform the same calculation until
    a specific number is found. In that case, you would need to use a loop statement,
    a control structure that repeatedly executes a statement or a series of statements
    while a specific condition is true or a specific condition becomes true. In this
    chapter, you''ll learn about three types of loop statements: while statements,
    do...while statements, and for statements.


    # while Statements


    One of the simplest types of loop statements is the while statement, which repeats
    a statement or series of statements as long as a given conditional expression
    evaluates to true. The syntax for the while statement is as follows:


    ```

    while (conditional expression) { statement(s); }

    ```


    The conditional expression in the while statement is enclosed within parentheses
    the keyword while. As long as the conditional expression evaluates to true, the
    statement or command block executes repeatedly. Each repetition of a looping statement
    is called an iteration. When the conditional expression evaluates to false, the
    loop ends and the next statement following the while statement executes.


    A while statement keeps repeating until its conditional expression evaluates to
    false. To ensure that the while statement ends after the desired tasks have been
    performed, you must include code that tracks the progress of the loop and changes
    the value produced by the conditional expression. You can track the progress of
    a while statement, or any other loop, with a counter. A counter is a variable
    that is incremented or decremented with each iteration of a loop statement.


    The following code shows a simple script that includes a while statement. The
    script declares a named count and assigns it an initial value of one. The count
    variable is then used in the while statement conditional expression (count <=
    5). As long as the count variable is less than or equal to five, the while statement
    loops.


    ![](bbox=[0.135, 0.545, 0.285, 0.865])'
