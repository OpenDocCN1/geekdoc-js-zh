  md: '# CHAPTER I Introduction to JavaScript


    graphic images and other objects in a document or Web page. Tags are enclosed
    in brackets (< >), and most consist of an opening tag and a closing tag that surround
    the text or other items they format. The closing tag must include a forward slash
    (/) immediately after the opening bracket to define it as a closing tag. For example,
    to make a line of text appear in boldface, use the opening tag <b> and the closing
    tag </b>. Any text contained between this pair of tags appears in bold-face when
    you open the HTML document in a Web browser.


    A tag pair and any data it contains are referred to as an element. The information
    contained within an element''s opening and closing tags is referred to as its
    content. Some elements do not require a closing tag. Elements that do not require
    a tag pair to enclose text or other elements. For instance, the <hr> element,
    which inserts a horizontal rule on a Web page, does not include a closing tag.
    You simply place the <hr> element anywhere in an HTML document where you want
    the horizontal rule to appear.


    There are literally hundreds of HTML elements. Table 1-1 lists some of the more
    common elements.


    ![](bbox=[0.085, 0.335, 0.285, 0.415])


    | HTML element | Description |

    | --- | --- |

    | <b></b> | Formats the enclosed text in a bold typeface |

    | <body></body> | Encloses the body of the HTML document |

    | <br> | Inserts a line break |

    | <center> | Centers a paragraph in the middle of a Web page |

    | <head></head> | Encloses the page header and contains information about the
    entire page |

    | <h1></h1> | Indicates heading level elements, where n represents a number from
    1 to 6 |

    | <hr> | Inserts a horizontal rule |

    | <html></html> | Begins and ends an HTML document; these are required elements
    |

    | <i></i> | Formats the enclosed text in an italic typeface |

    | <img src="..." alt=""> | Inserts an image file |

    | <p></p> | Identifies the enclosed text as a paragraph |

    | <u></u> | Formats the enclosed text as underlined |


    Table 1-1 Common HTML elements


    All HTML documents must use the <html> element as the root element. A root element
    contains all the other elements in a document. This element tells a Web browser
    to assemble any instructions between the tags into a Web page. The opening and
    closing'
