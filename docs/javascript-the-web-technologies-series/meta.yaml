    **Table 2-12** Operator precedence


    Operators in a grouping have precedence over operators (*) in a lower grouping.
    For example, the multiplication operator has a higher precedence than the addition
    operator (+). Therefore, the expression 5 + 2 * 8 evaluates as follows: the numbers
    2 and 8 are multiplied first for a total of 16, then the 5 is added, resulting
    in a total of 21. If the addition operator had a higher precedence than the multiplication
    operator, the statement would evaluate to 56, because 5 would be added to 2 for
    a total of 7, which would then be multiplied by 8.


