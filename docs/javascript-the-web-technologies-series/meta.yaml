  md: 'back() and forward() methods allow a script to move backward or forward in
    a Web browser''s history. To use the back() method, you must use the following:
    history.back().


    The go() method is used for navigating to a specific Web page that has been previously
    visited. The argument of the go() method is an integer that indicates how many
    pages in the history list, or backward, you want to navigate. For example, history.go(-2)
    opens the Web page that is two pages back in the history list; history.go(3) opens
    the Web page that is three pages forward in the history list. The statement history.go(-1)
    is equivalent to the back() method, and the statement history.go(1) is equivalent
    to using the forward() method.


    The History object contains a single property, the length property, which contains
    the specific number of documents that have been opened during the current browser
    session. To use the length property, you use the syntax history.length; the length
    property does not contain the URLs of the documents themselves, only an integer
    representing how many documents have been opened. The code uses an alert dialog
    box to display the number of Web pages that have been visited during a Web session:


    ```

    window.alert("You have visited " + history.length + " Web pages.");

    ```


    The History object is included in this chapter to introduce you to all of the
    major objects in the browser object model. However, you should avoid using the
    History object to navigate to pages that have been opened during a Web browser
    session. Instead, you should use the full URL with the href property of the Location
    object, as explained in the next section.


    # The Location Object


    When you want to allow users to open one Web page from another Web page, you usually
    create a hypertext link with the <a> element. You can also use JavaScript code
    and the Location object to open Web pages. The Location object allows you to change
    to a Web page from within JavaScript code. One reason you may want to change Web
    pages with JavaScript code is to redirect the Web site visitors to a different
    or updated URL. The Location object contains several properties and methods for
    working with the URL of the document currently open in a browser window. When
    you use a method or property of the Location object, you must include a reference
    to the Location object itself. For example, using the href property, you must
    write location.href = URL; Table 4-6 lists the Location object''s properties,
    and Table 4-7 lists the Location object''s methods.'
  merge: -1
