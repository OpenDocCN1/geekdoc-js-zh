    # Summing Up


    +   * Functions refer to a related group of JavaScript statements that are executed
    as a single unit.

    * The term "variable scope" refers to where in your program a declared variable
    can be used. A global variable is one that is declared outside a function and
    is available to all parts of your program. A local variable is declared inside
    a function and is only available within the function in which it is declared.

    * The values a program stores in computer memory are commonly variables.

    * The name you assign to a variable is called an identifier.

    * Reserved words, which are also called keywords, are special words that are part
    of the JavaScript language syntax.

    * A data type is the specific category of information that a variable contains.

    * JavaScript is a loosely typed programming language.

    * An integer is a positive or negative number with no decimal places.

    * A floating-point number is a number that contains decimal places or that is
    written in exponential notation.'
