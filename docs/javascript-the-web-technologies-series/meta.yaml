  md: '# CHAPTER 2 Working with Functions, Data Types, and Operators


    Functions do not have to contain parameters. Functions only perform a task and
    do not require external data. For example, you might create a function that displays
    the same message each user visits your Web site; this type of function needs to
    be executed and does not require any other information.


    named number would then be written as calculate_square_root(number). In this case,
    the function declaration is declaring a named number. Functions can contain multiple
    parameters separated by commas. To add three separate number parameters to the
    calculate_square_root() function), you would write the function as calculate_square_root(number1,
    number2, number3). Note that parameters (such as the number1, number2, and number3)
    receive their values when you call the function from elsewhere in your program.
    You will learn how to call functions in the next section.


    74


    Following the parentheses that contain function parameters is a set of braces
    (called function braces) that contain the function statements. Function statements
    are the statements that define the actual work of the function (such as calculating
    the square root of the parameter, or displaying a message on the screen) and must
    be contained within the function braces. The following is an example of a function
    that prints the names of several students using the write() method of the Document
    object. (Recall that functions are very similar to methods associated with an
    object.)


    ```

    function printStudentNames(student1, student2, student3) {

    document.write("<p>" + student1 + "</p>");

    document.write("<p>" + student2 + "</p>");

    document.write("<p>" + number3 + "</p>");

    }

    ```


    Notice how the preceding function is structured. The opening curly brace is on
    the same line as the function name, and the closing brace is on its own line following
    the function statements. Each statement between the curly braces is indented one-half
    inch. This structure is the preferred format among many JavaScript programs. However,
    for simple functions it uses braces, and statements on the same line. (Recall
    that JavaScript ignores line breaks, spaces, and tabs.) The only syntax requirement
    for spacing in JavaScript is that semicolons separate statements on the same line.


    A JavaScript program is composed of all the <script> sections within a document;
    each individual <script> section is not necessarily its own JavaScript program
    (although it could be if there are no other <script> sections in the document).


    Always put your functions within the document header, and place calls to a function
    within the body section. As you recall, the document head is rendered before the
    body. Thus, placing functions in the head section and function calls in the body
    section ensures that functions are created before they are actually called. If
    your program attempts to call a function before it has been created, you will
    receive an error.'
