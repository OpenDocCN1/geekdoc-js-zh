    # if...else Statements


    So far you''ve learned how to use an if statement (or statements) if a condition
    evaluates to true. In some situations, however, you may want to execute one set
    of statements when the condition evaluates to true and another set of statements
    when the condition evaluates to false. In that case, you need to use an else clause
    to your if statement. For instance, suppose that you create a script that displays
    a confirmation dialog box that asks users to'
  merge: -1
