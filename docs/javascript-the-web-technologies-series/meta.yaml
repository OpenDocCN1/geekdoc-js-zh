    data types do not change after they have been declared. Programming languages
    that do not require you to declare the data types of variables are called **loosely
    typed programming languages**. Loose typing is also known as **dynamic typing**
    because data types can change after they have been declared. JavaScript is a loosely
    typed programming language. In JavaScript, you are not required to declare the
