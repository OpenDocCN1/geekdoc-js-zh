    # Referring to Frames and Windows


    When working with multiple frames and windows, you need to be able to refer to
    individual frames and windows in JavaScript. When you create a new window, for
    instance, you may want to change the content displayed in that window. Or, if
    you have multiple frames in a window, you may need to change the content displayed
    in one frame, depending on which link is selected in another frame. Recall that
    the frames[] array contains all the frames in a window. The first frame in a window
    is referred to as frames[0], the second frame is referred to as frames[1], and
    so on. If a window contains no frames, the frames[] array is empty. To refer to
    a frame within the same window, use the parent property of the window object combined
    with the frame''s index number from the frames[] array. For example, if you have
    a Web page that creates four frames, the frames can be referred to as parent.frames[0],
    parent.frames[1], parent.frames[2], and parent.frames[3], respectively.


    In addition to the self property, another property that is used to refer to a
    window is the top property of the window object. The top property refers to the
    topmost window on a Web page. When working with frames, the top property refers
    to the window that constructed the frames. For example, if the code to create
    a parent frame is located in a document named FramesExample.html, then the statement
    top.location.href would return the full URL for the FramesExample.html document,
    no matter which frame it was in. When the top property is used on a Web page that
    does not contain frames, it refers to the window itself.


