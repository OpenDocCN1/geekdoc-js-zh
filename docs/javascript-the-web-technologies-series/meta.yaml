  md: '# CHAPTER 1 Introduction to JavaScript


    Unlike JavaScript, a server-side scripting language can''t access or manipulate
    a Web browser. In fact, a server-side scripting language cannot run on a client
    tier at all. Instead, a server-side scripting language exists and executes operates
    solely on a Web server, where it performs various types of processing or accesses
    databases. When a client requests a server-side script, the script is interpreted
    and executed by the Web server engine. After the Web server software translates
    the results of the script (such as the result of a calculation or the records
    returned from a database) into HTML or XHTML, it then returns to the client. In
    other words, a client will never see the server-side script, only the HTML or
    XHTML that the Web server returns from the script.

