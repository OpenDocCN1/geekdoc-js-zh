    # Logical Operators


    **Logical operators** are used for comparing two Boolean operands for equality.
    For example, a script for an automobile insurance company may need to determine
    whether a customer is **male** and **under** 21 in order to determine the correct
    insurance quote. With comparison operators, a Boolean value of true or false is
    returned after two operators are compared. Table 2-9 lists the JavaScript logical
    operators.


    | Name | Operator | Description |

    | --- | --- | --- |

    | And | && | Returns true if both the left operand and right operand return a
    value of true; otherwise, it returns a value of false |

    | Or | || | Returns true if either the left operand or right operand returns a
    value of true; if neither operand returns a value of true, then the expression
    containing the Or || operator returns a value of false |

    | Not | ! | Returns true if an expression is false, and returns false if expression
    is true |


    **Table 2-9** Logical operators'
