  md: '# CHAPTER 1 Introduction to JavaScript


    The original purpose of the World Wide Web (WWW) was to locate and display information.
    However, once the Web grew beyond a small academic and scientific community, people
    began to recognize that greater interactivity would make the Web more useful.
    As applications of the Web grew, the demand for more interactive and visually
    appealing Web sites also grew.


    To respond to the demand for greater interactivity, an entirely new Web programming
    language was needed. Netscape filled in the mid-1990s by developing the JavaScript
    programming language. Originally designed for use in the Navigator Web browser,
    JavaScript is now also used in most Web browsers, including Internet Explorer.


    Although JavaScript is considered a programming language, it is also a critical
    part of Web page design and authorizing. This is because the JavaScript language
    "lives" within a Web page''s elements. In other words, the JavaScript code you
    write is usually placed within the elements that make a Web page. JavaScript can
    turn static documents into applications as games or calculators. JavaScript code
    can change the contents of a Web page after a browser has rendered it. It can
    also create visual effects such as animation, and it can control the Web browser
    window itself. None of this was possible before the creation of JavaScript.


    In this chapter, you will learn the skills required to create basic JavaScript
    programs. In order to be successful in your JavaScript studies, you should ideally
    possess a strong knowledge of Web page-authoring techniques. The first part of
    this chapter provides a quick refresher on the history of the World Wide Web and
    the basics on how to create Web pages. Even if you are highly experienced with
    HTML, you might not be familiar with the formal terminology that is used in Web
    page authorizing. For this reason, it is better to read through these sections
    to ensure that you understand the terminology used in this book.


    For the most current Web page-authoring techniques, see Don Gosselin''s HTML,
    also published by Course Technology.


    # Introduction to the World Wide Web


    The Internet is a vast network that connects computers all over the world. The
    original plans for the Internet grew out of a series of memos written by J. C.
    R. Lickl of the Massachusetts Institute of Technology (MIT), in August 1962, discussing
    his concept of a "Galactic Network." Lickl envisioned a global computer network
    through which users could access data and programs from any site on the network.
    The Internet was actually developed in the 1960s by the Advanced Research Projects
    Agency (or ARPA) of the U.S. Department of Defense, which later changed its name
    to Advanced Research Projects Agency (or DARPA). The goal of the'
  merge: -1
  pgno: 27
- img_proc: false
  md: '# Introduction to the World Wide Web


    early Internet was to connect the main computer systems of various universities
    and research institutions that were funded by this agency. This first implementation
    of the Internet was referred to as the ARPANET. More computers were connected
    to the ARPANET in the years following its initial development in the 1960s, although
    access to the ARPANET was restricted by the U.S. government primarily to academic
    researchers, scientists, and the military.


    The 1980s saw the widespread development of local area networks (LANs) and the
    personal computer. At although one time restricted to academia and the military,
    computers became common in business and everyday life. By the end of the 1980s,
    businesses and individual computer users began to recognize the global communications
    capabilities and potential of the Internet, and they convinced the U.S. government
    to allow commercial access to the Internet.


    In 1990 and 1991, Tim Berners-Lee created what would become the World Wide Web,
    or the Web, at the European Laboratory for Particle Physics (CERN) in Geneva,
    Switzerland, as a way to easily access cross-referenced documents that existed
    on the CERN network. When other academics and scientists saw the usefulness of
    being able to easily access cross-referenced documents using Berners-Lee''s system,
    the Web we know it today. In fact, this method of accessing cross-referenced documents,
    known as hypertext linking, is probably the most important part of the Web because
    it allows you to open any Web pages. A hypertext link, or hyperlink or link, contains
    a reference to a specific Web page that you can click to open that Web page.


    > If you want to learn more about the history of the Internet, the Internet Society
    maintains a list of links to http://www.isoc.org/internet/.


    A common misconception is that the words "Web" and "Internet" are synonymous.
    The Web is only one part of the Internet and is a means of communicating on the
    Internet. The Internet is also composed of communication elements like e-mail
    systems that send and receive messages. However, because of its enormous influence
    on computing, communications, and the economy, the World Wide Web is arguably
    the most important part of the Internet today and is the primary focus of this
    book.


    A document on the Web is called a Web page and is identified by a unique address
    called the Uniform Resource Locator, or URL. A URL is a type of Uniform Resource
    Identifier (URI), which is a generic term for types of names and addresses on
    the World Wide Web. The Web site refers to the location on the Internet of the
    Web pages and related files (such as graphic and video files) that belong to a
    company, organization, or individual. You display a Web page on your computer
    screen by using a program Web browser. A person can retrieve and open a Web page
    in a Web browser by entering its


    ![](bbox=[0.705, 0.165, 0.972, 0.195])


    ![](bbox=[0.705, 0.435, 0.872, 0.575])


    ![](bbox=[0.068, 0.975, 0.672, 0.995])'
