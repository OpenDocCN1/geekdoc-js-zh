  md: '+   - When one decision-making statement is contained within another decision-making
    statement, they are referred to as nested decision-making structures.


    +   - The switch statement controls program flow by executing a specific set of
    statements, depending on the value of an expression.


    +   - A break statement is used to exit control statements, such as the switch,
    while, do...while, and for looping statements.


    +   - A loop statement is a structure that repeatedly executes a statement or
    series of statements while a specific condition is true or until a specific condition
    becomes true.


    +   - The while statement is used for repeating a statement or series of statements
    as long as a given conditional expression evaluates to true.


    +   - Each repetition of a looping statement is called an iteration.


    +   - An infinite loop is a situation in which a loop statement never ends because
    its conditional expression is never false.


    +   - The do...while statement executes a statement or statements once, then repeats
    the execution as long as a given conditional expression evaluates to true.


    +   - The for statement is used for repeating a statement or series of statements
    as long as a given conditional expression evaluates to true.


    +   - The continue statement halts a looping statement and restarts the loop with
    a new iteration.


