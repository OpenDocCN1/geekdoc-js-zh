    |


    Table 2-6 Arithmetic unary operators


    The increment (++) and decrement (--) unary operators can be used as prefix or
    postfix operators. A **prefix operator** is placed before a variable. A **postfix
    operator** is placed after a variable. The statements ++count; count++; both increase
    the count variable by one. However, the two statements return different values.
    When the increment operator as a prefix operator, the value of the operand is
    returned *after* it is increased by a value of one. When you use the increment
    operator as a postfix operator, the value of the operand is returned *before*
    it is increased by a value of one. Similarly, when you use the decrement operator
    as a prefix operator, the value of the operand is returned *after* it is decreased
    by a value of one. When you use the decrement operator as a postfix operator,
    the value of the operand is returned *before* it is decreased by a value of one.
    If you intend to assign the incremented or decremented value to another variable,
    then you whether use the prefix or postfix operator to make a difference.


