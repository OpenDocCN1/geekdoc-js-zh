  md: '# CHAPTER 4 Manipulating the Browser Object Model


    When you open a new browser window, you can customize its appearance by using
    the options argument of the window.open() method. Table 4-4 lists some common
    options that you can use with the window.open() method.


    If you are writing code that requires a user to click a link or a button, you
    can use an event handler to call the window.open() method, and the window will
    open successfully. However, if you include JavaScript code that opens a new window
    without a request from the user, then the pop-up blocker feature that is available
    in most current Web browsers will prevent the window from opening.


    | Name | Description |

    | --- | --- |

    | height | Sets the window''s height |

    | left | Sets the horizontal coordinate of the left of the window, in pixels |

    | location | Includes the URL Location text box |

    | menubar | Includes the menu bar |

    | resizable | Determines if the new window can be resized |

    | scrollbars | Includes scroll bars |

    | status | Includes the status bar |

    | toolbar | Includes the Standard toolbar |

    | top | Sets the vertical coordinate of the top of the window, in pixels |

    | width | Sets the window''s width |


    Table 4-4 Common options of the window object''s open() method


    All the options listed in Table 4-4, with the exception of the width and height
    options, are set values of "yes" or "no", or 1 for yes and 0 for no. To include
    the status bar, the options string should read "status=yes". You set the width
    and height options using integers representing pixels. For example, to create
    a new window that is 200 pixels wide by 300 pixels high, the string should read
    "height=200,width=300". When including multiple items in the options string, you
    must separate them by commas. If you exclude the options string of window.open()
    method, then all the standard options are included in the New Web browser window.
    However, if you include the options string, you must include all the components
    you want to create for the new window; that is, the new window is created with
    only the components you explicitly specify.


