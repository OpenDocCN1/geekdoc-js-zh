- img_proc: false
  md: "indicate whether they invest in the stock market by clicking an OK or Cancel\
    \ radio button. An if statement in the script might contain a conditional expression\
    \ that evaluates the user's input. If the condition evaluates to true (that is,\
    \ if the user clicked the OK button), then the if statement would display a Web\
    \ page on recommended stocks. If the condition evaluates to false (that is, if\
    \ the user clicked the Cancel button), then the statements in an else clause would\
    \ display a Web page on other types of investment opportunities.\n\nThe window.confirm()\
    \ method displays a confirm dialog box that contains an OK button and a Cancel\
    \ button. The syntax for the window.confirm() method is window.confirm(message);\
    \ When a user clicks the OK button in the confirm dialog box, a value of true\
    \ is returned. When a user clicks the Cancel button, a value of false is returned.\
    \ For example, the following statement displays the dialog\n\n```\nwindow.confirm(\"\
    Would you like a cup of coffee?\");\n```\n\n![](bbox=[0.068, 0.417, 0.473, 0.526])\n\
    \nFigure 3-3 Confirm dialog box\n\nAn if statement that includes an else clause\
    \ is called an if...else statement. You can think of an else clause as a backup\
    \ plan that is implemented when the condition returns a value of false. The syntax\
    \ for an if...else statement is as follows:\n\n```\nif (conditional expression)\n\
    \    statement;\nelse\n    statement;\n```\n\nYou can use command blocks to construct\
    \ an if...else statement as follows:\n\n```\nif (conditional expression) {\n \
    \   statements;\n}else {\n    statements;\n}\n```\n\n> An if statement can be\
    \ constructed without the else clause. However, the else clause can only be used\
    \ with an if statement."
