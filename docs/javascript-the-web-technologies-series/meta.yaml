  md: '# Escape Characters and Sequences


    You need to use extra care when using single quotation marks with possessives
    and contractions in strings, because the JavaScript interpreter always looks for
    the first closing single or double quotation mark to match an opening single or
    double quotation mark. For example, consider the following statement:

    `document.write(''<p>My zip code is 94558</p>'');`


    This statement causes an error. The JavaScript interpreter assumes the literal
    string ends with the apostrophe "city" and looks for the closing parentheses for
    the document.write() statement immediately following "city". To get around this
    problem, you include an escape character before the apostrophe in "city". An escape
    character tells the compiler or interpreter that the character follows it has
    a special purpose. In JavaScript, the escape character is the backslash\. Placing
    a backslash in front of an apostrophe tells the JavaScript interpreter that the
    apostrophe is to be treated as a regular keyboard character, such as "a","b",
    or "z", and not as part of a single quotation mark pair that encloses a text string.
    The backslash in the following statement tells the JavaScript interpreter to print
    the apostrophe following the word "city" as an apostrophe.

    `document.write(''<p>My zip code is 94558</p>'');`


    You can also use the escape character in combination with other characters to
    insert a special character into a string. When you combine the escape character
    with other characters, the combination is called an escape sequence. The backslash
    followed by an apostrophe (\'') and the backslash followed by a double quotation
    mark (\") are both examples of escape sequences. Most escape sequences carry out
    special functions. For example, the escape sequence \t inserts a tab into a string.
    Table 2-3 describes the escape sequences that can be added to a string in JavaScript.


    | Escape sequence | Character |

    |---|---|

    | \ | Backslash |

    | \b | Backspace |

    | \r | Carriage return |

    | \" | Double quotation mark |

    | \f | Form feed |

    | \t | Horizontal tab |

    | \n | Newline |


    Table 2-3 JavaScript escape sequences (continues)'
