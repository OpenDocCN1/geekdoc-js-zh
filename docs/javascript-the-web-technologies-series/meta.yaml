    # Should You Use Client-Side or Server-Side Scripting?


    An important question in the design of any client/server system is deciding how
    much processing to place on the client and how much to place on the server. In
    the context of client-side Web development, you must decide whether to use client-side
    JavaScript or a server-side script. This is an important consideration because
    the choice you make can greatly affect the performance of your program. In many
    cases, the decision is simple. For example, if you want to control the the Web
    browser, you must use JavaScript. If you want to access a database on a Web server,
    you must use a server-side script. However, there are tasks that both languages
    can accomplish, as validating forms and manipulating cookies. Furthermore, both
    languages can perform the same types of calculations and data processing.


    A general rule of thumb is to allow the client to handle the user interface processing
    and light processing, such as data validation, and data storage. But have the
    Web server perform intensive calculations, and that division of labor is especially
    important when dealing with clients and servers over the Web. Unlike with clients
    on a private network, it'
