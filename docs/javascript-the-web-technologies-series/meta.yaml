  md: "# Making Decisions\n\nWhen you write a computer program, regardless of the\
    \ programming language, you often need to execute different sets of statements\
    \ depending on some predetermined criteria. For example, you might create a program\
    \ that needs to execute one set of code in the morning and another set of code\
    \ at night. Or you might create a program that must execute one set of code when\
    \ it's running in Windows Explorer and another when it runs in Firefox. Additionally,\
    \ you might create a program that depends on user input to determine exactly what\
    \ to run. For instance, suppose you create a Web page when users place online\
    \ orders. If a user clicks the Add to Shopping Cart button, a set of statements\
    \ that builds a list of items to be purchased must execute. However, if the user\
    \ clicks the Checkout button, entirely different set of statements, which completes\
    \ the transaction, must execute. The process of determining the order in which\
    \ statements execute in a program is called decision-making or flow control. The\
    \ types of JavaScript statements used for making decisions are called decision-making\
    \ statements or decision-making structures. The most common type of decision-making\
    \ statement is the if statement, which you will study first.\n\n# if Statements\n\
    \nThe if statement is used to execute specific programming code if the evaluation\
    \ of a conditional expression returns a value of true. The syntax for a simple\
    \ if statement is as follows:\n\n```\nif (conditional expression)\n  statement;\n\
    ```\n\nThe if statement contains three parts: the keyword if, a conditional expression\
    \ enclosed within parentheses, and executable statements. Note that the conditional\
    \ expression must be enclosed within parentheses.\n\nThe condition being evaluated\
    \ returns a value of true, then the statement immediately following the conditional\
    \ expression executes. After the if statement executes, any subsequent code executes\
    \ normally. Consider the following code. Here, the if statement uses the equal(==)\
    \ comparison operator to determine whether the variable exampleVar is equal to\
    \ 5. (You learned about operators in Chapter 2.) Because the condition returns\
    \ a value of true, two alert dialog boxes appear. The first alert dialog box is\
    \ generated by the if statement when the condition returns a value of true, and\
    \ the second alert dialog box executes after the if statement is completed."
  merge: -1
  pgno: 165
- img_proc: false
  md: "# Making Decisions\n\n```\nvar exampleVar = 5; // CONDITION EVALUATES TO 'TRUE'\n\
    if (exampleVar == 5) {\n    window.alert(\"<p>The variable is equal to '5'.</p>\"\
    );\n    window.alert(\"<p>This dialog box is generated after\nthe statement.</p>\"\
    );\n}\n```\n\nThe statement immediately following the if statement can be written\
    \ on the same line as the if statement itself. However, using a line break and\
    \ indentation makes the code easier for the programmer to read.\n\n![](bbox=[0.715,\
    \ 0.045, 0.985, 0.135])\n\nIn contrast, the following code displays only the second\
    \ alert box. The condition evaluates to false, because exampleVar is assigned\
    \ the value 4 instead of 5.\n\n```\nvar exampleVar = 4; // CONDITION EVALUATES\
    \ TO 'FALSE'\nif (exampleVar == 5) {\n    window.alert(\"<p>This dialog box will\
    \ not appear.</p>\");\n    window.alert(\"<p>This is the only dialog box that\n\
    appears.</p>\");\n}\n```\n\nYou can use a command block to construct a decision-making\
    \ structure using multiple if statements. A command block is a set of statements\
    \ contained within a set of braces, similar to the function statements contained\
    \ within a set of braces. Each command block must have an opening brace { and\
    \ a closing brace }. If a command block is missing either the opening or closing\
    \ brace, an error occurs. The following code shows a script that runs a command\
    \ block if the conditional expression within the if statement evaluates to true.\n\
    \n```\nvar exampleVar = 5; { // CONDITION EVALUATES TO 'TRUE'\ndocument.write(\"\
    <p>The condition evaluates to\ntrue.</p>\");\ndocument.write(\"<p>exampleVar<code></>\
    \ is\nequal to 5.</p>\");\ndocument.write(\"<p>Each of these lines will be\nprinted.</p>\"\
    );\n}\ndocument.write(\"<p>This statement always executes\nafter the if statement.</p>\"\
    );\n```\n\nWhen an statement contains a command block, the statements in the command\
    \ block execute when the if condition evaluates to true. After the command block\
    \ executes, the code after the command block executes normally. When the condition\
    \ evaluates to false, the command block is skipped, and the statements after it\
    \ executes. If the conditional expression within the if statement in the preceding\
    \ code block evaluates to false, then only the write() statement following the\
    \ command block executes.\n\nNext, you will start working on a physics quiz for\
    \ a company named Gosselin Laboratories. You can find the physics quiz files in\
    \ a folder"
