    # Validating Web Pages


    When you open an XHTML document that is not well formed in a Web browser, the
    browser simply ignores the errors, as it would with an HTML document with errors,
    and renders the Web page as it can. The Web browser cannot tell whether the XHTML
    document is well formed. To ensure that a Web page is well formed and that its
    elements are valid, you need to use a validating parser. A validating parser is
    a program that checks whether a Web page is well formed and whether the document
    conforms to a specific DTD. The term validation refers to the process of verifying
    your document is well-formed and checking that the elements in your document are
    correctly written according to the element definitions in a specific DTD. If you
    do not validate a document and it contains errors, most Web browsers will properly
    treat it as an HTML document, ignore the errors, and render the page anyway. Validation
    can help you spot errors in your code. The most experienced Web page authors frequently
    introduce typos or some other types of errors into a document that prevents the
    document from being well formed.


    Various Web development tools, including Dreamweaver, offer validation capabilities.
    One of the best available is W3C Markup Validation'
