  md: "4. Open the PhysicsQuiz2.html document in your Web browser. The program should\
    \ function the same as when it contained only statements.\n\n5. Close your Web\
    \ browser window.\n\n# Nested if and...else Statements\n\nAs you have seen, you\
    \ can use a control structure such as an if or if...else statement to allow a\
    \ program to make decisions about which statements to execute. In some cases,\
    \ you may want the statements executed by the control structure to make other\
    \ decisions. For instance, you may have a program that uses an if statement to\
    \ ask users if they answer yes, you may want to run another statement that asks\
    \ whether they like team sports or individual sports. You can include any code\
    \ you like within the code block for an if or if...else statement, and that may\
    \ include other or if...else statements.\n\nWhen one decision-making statement\
    \ is contained within another decision-making statement, they are referred to\
    \ as nested decision-making structures. An if statement contained within an if\
    \ statement or an if...else statement is called a nested if or if...else statement.\
    \ Similarly, an if...else statement contained within an if or if...else statement\
    \ is called a nested... You use nested if and if...else statements to perform\
    \ conditional evaluations that must be executed after the original conditional\
    \ evaluation. For example, the following code evaluates two conditional expressions\
    \ where the window executes:\n\n```\nvar salesTotal = window.prompt(\"What is\
    \ the sales total?\", 0);\nif (salesTotal > 50)\n    document.write(\"<p>The sales\
    \ total is between \n    50 and 100.</p>\");\n```\n\nThe document.write() statement\
    \ in the preceding example only executes the conditional expressions in if statements\
    \ evaluate to true.\n\nThe preceding code uses the window.prompt() method, which\
    \ displays a dialog box with a message, a text box, an OK button, and a Cancel\
    \ button. Any text that is entered into a prompt dialog box by a user can be assigned\
    \ to a variable. The syntax for the window.prompt() method is variable = window.prompt(message,\
    \ default text); For example, the following code displays the dialog box shown\
    \ in Figure 3-4:"
