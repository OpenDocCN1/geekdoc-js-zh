  md: '# CHAPTER 1 Introduction to JavaScript


    # Introduction to Web Development


    **Web page design**, or Web design, refers to the visual design and creation of
    the documents that appear on the World Wide Web. Most businesses today—prominent
    and small—have Web sites. To attract and retain visitors, and to stand out from
    the crowd, Web sites must be exciting and visually stimulating. High-quality Web
    design plays an important role in attracting first-time and repeat visitors. However,
    the visual aspect of a Web site is only one part of the story. Equally important
    is the content of the Web site and how that content is structured.


    Web design is an extremely important topic. However, this book is not about Web
    design, even though you will certainly learn Web design concepts and techniques
    as you work through the chapters. Instead, this book touches on Web page authoring
    and development. **Web page authoring (or Web authoring)** refers to the creation
    and assembly of the tags, attributes, and data that make up a Web page. There
    is a subtle, distinction between Web design and Web page authoring: Web design
    refers to the visual and graphical design aspects of creating Web pages, whereas
    Web page authoring refers to the physical task of assembling the Web page tags
    and attributes. **Web development, or Web programming**, refers to the design
    of software applications for a Web site. Generally, a Web developer “behind the
    scenes” to develop software applications that access databases and file systems,
    communicate with other applications, and perform other advanced tasks. The programs
    created by a Web developer will not necessarily be from a visitor to a Web site,
    although the visitor will certainly use a Web developer’s programs, particularly
    if the Web site writes reads data to and from a database. Although JavaScript
    lives in the realm of Web page authoring, there is certain overlap between Web
    authoring and Web development, especially when it comes to sending and receiving
    data to and from a Web server.


    Another term that you might often see in relation to Web development is Webmaster.
    Although there is some dispute over what the term means, Webmaster refers to a
    person who is responsible for the day-to-day maintenance of a Web site, including
    the monitoring of Web traffic and ensuring that the Web site’s hardware and software
    are running properly. The duties of a Webmaster often require knowledge of Web
    page design, authoring, and development.


    If you would like to study the topic of Web page design itself, refer to Joel
    Sklar’s excellent book, Principles of Web Design, Fourth Edition, published by
    Course Technology/Cengage Learning.


    There are countless ways of combining the hundreds of HTML tags to create interesting
    Web pages. One technique that professional Web authors use to increase their HTML
    skill is examining the underlying HTML tags of a Web page that they admire. All
    Web browsers commands allow you to view the HTML code for a Web page that appears
    in the browser; in Firefox you select Page from the View menu, and in Internet
    Explorer you select Source


    The open nature of HTML makes it possible for anyone to easily see how another
    Web author created a Web page. However, you should


    ![](bbox=[0.135, 0.565, 0.165, 0.595])'
