  md: '# Case Sensitivity


    Like XHTML, JavaScript is case sensitive, and within JavaScript code, object names
    must always be all lowercase. This can be a source of confusion, because in written
    explanations about JavaScript, the names of objects are usually referred to with
    an initial capital letter. For example, throughout this book, the Document object
    is referred to with an uppercase D. However, you must use a lowercase d when referring
    to the Document object in a script. The statement Document.write("Can you hear
