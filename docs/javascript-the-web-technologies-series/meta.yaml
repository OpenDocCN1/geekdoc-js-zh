    # Understanding Web Browsers


    Prior to version 6, the Netscape browser was called Navigator or Netscape Navigator.
    With the release of version 6, however, Netscape dropped "Navigator" from the
    browser name, and now simply refers to it as "Netscape." For this reason, in this
    book "Web browser" refers to versions older than version 6, and "Netscape Web
    browser" refers to version 6 and later.


    You can choose from a number of different browsers, but at the time of this writing,
    Mozilla Firefox is the most popular browser on the market. Although Firefox is
    the most popular browser, it was not the first. NCSA Mosaic was created in 1993
    at the University of Illinois and was the first program to allow users to navigate
    the Web by using a graphical user interface (GUI). In 1994, Netscape Navigator,
    which controlled 75% of the market. Netscape maintained its control until 1996,
    when Microsoft entered the market with the release of Internet Explorer, and the
    so-called browser wars began, which Microsoft and Netscape fought for control
    of the browser market.


    ![](bbox=[0.105, 0.61, 0.285, 0.78])


    HTML is actually a combination of HTML, Cascading Style Sheets, and JavaScript.
    term term by the W3C for managing Web page formatting.


    The browser wars over DHTML, which is a combination of various technologies, including
    HTML and JavaScript, which allows a Web page to change after it has been loaded
    by a browser. Examples of DHTML include the ability to position text elements,
    change background color, and create effects such as animation. Earlier versions
    of Internet Explorer and Navigator introduced HTML elements that were incompatible.
    Furthermore, Microsoft and Netscape each wanted its version of DHTML to become
    the industry standard. To settle the argument, the World Web Consortium set out
    to create a platform-independent and browser-neutral version of DHTML. The World
    Web Consortium, or W3C, was established in 1994 at MIT to oversee the development
    of Web technologies. While the W3C was drafting a recommendation for DHTML, versions
    4 of Internet Explorer and Navigator each incompatible with the other browser.
    As a result, when working with advanced HTML techniques a programmer had to write
    a different set of code for each browser. Unfortunately for Netscape, the W3C
    adopted as the standard version of DHTML found in version 4 of Internet Explorer,
    which prompted many loyal Netscape followers to defect to.


    ![](bbox=[0.105, 0.85, 0.285, 0.98])


    The W3C does not actually release a version of a particular technology. Instead,
    it issues a formal recommendation for technology, which essentially means that
    the technology is a recognized industry standard.


    One benefit of the browser wars was that it forced the Web to rapidly develop
    and adopt advanced Web page standards (including JavaScript, CSS, and DHTML),
    which are consistent across browsers. In 2004, Internet Explorer appeared to be
