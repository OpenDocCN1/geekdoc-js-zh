    # JavaScript and Client-Side Scripting


    As mentioned earlier, HTML was not originally intended to control the appearance
    of pages in a Web browser. When HTML was first developed, Web pages were static—that
    is, they couldn''t change after the browser rendered them. However, after the
    Web grew beyond a small academic and scientific community, people began to recognize
    greater interactivity and better visual design would make the Web more useful.
    As commercial applications of the Web grew, the demand for more interactive and
    visually appealing Web sites also grew.


    HTML and XHTML could only be used to produce static documents. You can think of
    a static Web page written in HTML or XHTML as being approximately equivalent to
    a document created in a word-processing or desktop publishing program; the only
    thing you can do with it is to view it or print it. Thus, to respond to the demand
    for greater interactivity, an entirely new Web programming language was needed.
    Netscape filled it by developing JavaScript.


    **JavaScript** is a client-side scripting language that allows Web page authors
    to develop interactive Web pages and sites. **Client-side scripting** refers to
    a scripting language that runs on a local browser (on the client tier) instead
    of a Web server (on the processing tier). Originally designed for use in Navigator
    Web browsers, JavaScript is now also used in most other Web browsers, including
    Firefox and Internet Explorer.


    The term **scripting language** is a general term originally referred to fairly
    simple programming languages that did not contain the'
  merge: -1
  pgno: 42
- img_proc: false
  md: '# CHAPTER 1 Introduction to JavaScript


    advanced programming capabilities of languages such as Java or C++. When it comes
    to Web development, the term scripting language refers to any type of language
    that is capable of programmatically controlling a Web page or returning some response
    to a Web browser. It''s important to note that, although the term scripting language
    originally referred to simple programming languages, today''s Web-based scripting
    languages are anything but simple. The part of a browser that executes scripting
    language code is the scripting engine. A scripting engine is just one kind of
    interpreter, generally referring to any program that executes scripting language
    code. When a scripting engine loads a Web page, it interprets any programs in
    scripting languages, such as JavaScript. A browser that contains a scripting engine
    is called a scripting host. Firefox and Internet Explorer are examples of scripting
    hosts that can run JavaScript programs.


    JavaScript was first introduced in Navigator and was originally called Live. With
    the release of Navigator 2.0, the name was changed to JavaScript 1.0. Subsequently,
    Microsoft released its own version of JavaScript in Internet Explorer 4.0 and
    named it JScript.


    Many people think that JavaScript is related to or a simplified version of Java
    programming language. However, the languages are entirely different. Java is an
    advanced programming language that was created by Sun Microsystems and is considerably
    more difficult to master than JavaScript. Although Java can be used to create
    programs that run from a Web page, Java programs are usually external programs
    that execute independently of a browser. In contrast, JavaScript programs always
    run within a Web page and control the browser.


    When Microsoft released JavaScript, several major problems occurred. First, the
    Netscape and Microsoft versions of the JavaScript language differed so that programmers
    were required to write completely different JavaScript programs for Navigator
    and Internet Explorer. To avoid similar problems in the future, an international,
    standardized version of JavaScript, called ECMAScript, was created. The most recent
    version of ECMAScript is edition 3. Both Netscape JavaScript and Microsoft JScript
    each include unique programming features that are not supported by the other language.
    In this book, you will learn to create JavaScript programs with ECMAScript edition
    3, which is supported by all current Web browsers including Firefox, Netscape
    6, and Internet Explorer 4 and higher.


    Although JavaScript is considered a programming language, it is also a critical
    part of Web authoring. This is because the JavaScript language “lives” within
    a Web page''s elements. JavaScript gives you the ability to:


    +   - Turn static Web pages into applications as games or calculators.

    - Change the contents of a Web page after a browser has rendered it.

    - Control the Web window itself.'
  merge: -1
  pgno: 43
- img_proc: false
  md: '# Introduction to Web Development


    For security reasons, the JavaScript programming language cannot be used outside
    of the Web browser. For example, to prevent mischievous scripts from stealing
    information, such as your e-mail address or credit card you use for an online
    transaction, or from causing damage by changing or deleting files, JavaScript
    does not allow any file manipulation whatsoever. Similarly, JavaScript does not
    include any sort of mechanism for creating a network or accessing a database.
    This limitation prevents JavaScript from infiltrating a private network or intranet
    from which information might be stolen or damaged. Another limitation is the fact
    that JavaScript cannot run system commands or execute programs on a client. The
    ability to read and write cookies is the only type of access to a client that
    JavaScript has. Web browsers, however, strictly govern cookies and do not allow
    access to cookies from outside the domain that created them. This security also
    means that you cannot use JavaScript to interact directly with Web servers or
    at the processing tier. Although the programmer can employ a few tricks (such
    as forms and query strings) to allow JavaScript indirectly with a Web server,
    if you need true control over what''s happening on the server, you need to use
    a server-side scripting language, as explained in the next section.


    # Understanding Server-Side Scripting


    Server-side scripting refers to a scripting language that is executed from a Web
    server. Some of the most popular server-side scripting languages are PHP, Active
    Server Pages (ASP), and Java Server Pages (JSP). One of the primary reasons for
    using a server-side scripting language is to develop interactive Web sites that
    communicate with a database. Server-side scripting languages work in the processing
    tier and have the ability to handle communication between the client tier and
    the data storage tier. At the processing tier, a server-side scripting language
