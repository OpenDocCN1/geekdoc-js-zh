    # The Navigator Object


    The Navigator object is used to obtain information about the current Web browser.
    It gets its name from Netscape Navigator, but is also supported by Firefox, Internet
    Explorer, and other current browsers. Some browsers, including Internet Explorer,
    contain unique methods and properties of the Navigator object that cannot be used
    with other browsers. Table 4-8 lists properties of the Navigator object that are
    supported by most current Web browsers, including Firefox and Internet Explorer.


    | Properties | Description |

    |---|---|n| appName | The Web browser code name |

    |Name | The Web browser name |

    | appVersion | The Web browser version |

    | platform | The operating system use in the client computer |

    | userAgent | The string stored in the HTTP user-request header, which contains
    information about the browser, the platform name, and compatibility |


    Table 4-8 Properties of the Navigator object


    The Navigator object is most commonly used to determine which type of Web browser
    is running. Because of the incompatibilities between Firefox and Internet Explorer,
    it is important to be able to distinguish which browser is running in order to
    execute the correct code for a specific browser. (Cross-browser compatibility
    issues will be discussed in detail in Chapter 11.) The statement browserType =
    navigator.appName returns the name of the Web browser in which the code is running
    to the browserType variable. You can use the browserType variable to determine
    which code to run for the specific type of browser. With the with statement eliminates
    the need to retype the name of an object when properties of the same object are
    being referenced in a series. To use the with statement, you create a structure
    similar to an if statement and pass the name of the object as a conditional expression.
    You can then refer to all of the object properties'
