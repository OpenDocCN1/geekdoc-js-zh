    Two other HTML elements are the <head> element and the <body> element. The <head>
    element contains information that is used by the Web browser, and you place it
    at the beginning of an <html> tag. You place several elements within the <head>
    element to manage a document''s content, including the <title> element, which
    contains text that appears in a browser''s title bar. A <head> element must contain
    a <title> element. With the exception of the <title> element, elements contained
    in the <head> element do not affect the displaying of the HTML document. The <head>
    element and the elements it contains are referred to as the **document head**.


    Following the document head is the <body> element. The <body> element and the
    text and elements it contains are referred to as the **document body**.


    When you open an HTML document in a Web browser, the document is assembled and
    formatted according to the instructions contained in its elements. The process
    by which a Web browser assembles and formats an HTML document is called parsing
    or rendering. The following example shows how to make a paragraph appear in boldface
    in an HTML document:


    ```

    <p><b>Herbal treatments for migraines may help reduce the severity of pain and
    discomfort.</b></p>

    ```


    HTML is not case sensitive, so you can use <b> in place of <b> However, the next
    generation of HTML, a language called XHTML, is sensitive, and you must use lowercase
    letters for elements. For this reason, this book uses lowercase letters for all
    elements. (You will learn about XHTML shortly.)


    You use various parameters, called attributes, to configure many HTML elements.
    You place an attribute before the closing bracket of the opening tag, and separate
    it from the tag name or attribute by a space. You assign a value to an attribute
    using the syntax attribute="value". For example, you can configure the <img> element,
    which embeds an image in an HTML document, with a number of attributes, including
    the src attribute. The src attribute specifies the filename of an image file or
    video clip. To include the src attribute within the <img> element, you use <img
    src="graphic.gif">


    When a Web browser parses or renders an HTML document, it ignores nonprinting
    characters such as tabs and line breaks; the final document that appears in the
    Web browser includes only recognized HTML elements and text. You cannot use line
    breaks in the body of an HTML document to insert spaces before and after a paragraph:'
