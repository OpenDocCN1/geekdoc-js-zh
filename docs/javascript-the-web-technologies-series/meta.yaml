  md: '# Understanding Variable Scope


    When you use a variable in a JavaScript program, particularly a complex JavaScript
    program, you need to be aware of the **variable''s scope**—that is, you need to
    think about where in your program a declared variable can be used. A variable''s
    scope can be either global or local. A **global variable** is one that is declared
    outside a function and a **local variable** is declared inside a function and
    is only available within the function in which it is declared. Local variables
    exist when the function ends. If you attempt to use a local variable outside the
    function in which it is declared, you will receive an error message.


    You must use the var keyword when you declare a local variable. However, when
    you declare a global variable, the var keyword is optional. For example, you can
    write the statement `myVariable="This is a variable."; myFunction="This is a variable.";`
    If you declare a variable within a function and do not include the var keyword,
    the variable automatically becomes a global variable. However, it is considered
    good programming technique to always use the var keyword when declaring variables
    because it makes clear in your code where and intend to start using the variable.
    It is also considered poor programming technique to declare a global variable
    by not using the var keyword because it makes harder to identify the global variables
    in your scripts. Using the *var keyword* forces you to explicitly declare your
    global variables outside of any functions and local variables within a function.


    The following script includes a global variable named salesPrice and a function
    containing two variable declarations. The first variable declaration in the function,
    for the shippingPrice variable, is a global variable because it does not include
    the var keyword. The second variable declaration in the function, for the totalPrice
    variable, is a local variable because it includes the var keyword. Both the global
    variable and the function are contained in a script section in the document head.
    When the function is called from the document body, the global variables and the
    local variable print successfully from within the function. the global variables
