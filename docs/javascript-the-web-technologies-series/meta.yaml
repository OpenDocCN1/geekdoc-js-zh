  md: "So far, the code you have written consisted of simple statements placed within\
    \ script sections. However, almost programming languages, including JavaScript,\
    \ allow you to group programming statements in logical units. In JavaScript, groups\
    \ of statements that you can execute as a single unit are called functions. You'll\
    \ learn how to use functions in this chapter.\n\nIn addition to functions, one\
    \ of the most important aspects of programming is the ability to store values\
    \ in computer memory and manipulate those values. In the last chapter, you learned\
    \ how to store values in computer memory using variables. The values, or data,\
    \ contained in variables are classified into categories known as data types. In\
    \ this chapter, you will learn about JavaScript data types and the operations\
    \ that can be performed on them.\n\n# Working with Functions\n\nIn Chapter 1,\
    \ you learned that procedures associated with an object are methods. In JavaScript\
    \ programming, you can write your own procedures, called **functions**, which\
    \ refer to a related group of JavaScript statements that are executed as a single\
    \ unit. Functions are virtually identical to methods except that they are not\
    \ associated with an object the way the write() method is associated with the\
    \ `Document` object. Functions, like JavaScript code, must be contained within\
    \ a `<script>` element. In the following section, you'll learn more about incorporating\
    \ functions in your scripts.\n\n# Defining Functions\n\nBefore you can use a function\
    \ in a JavaScript program, you must create, or define, it. The lines that make\
    \ up a function are called the **function definition**. The syntax for defining\
    \ a function is:\n\n```\n```javascript\nfunction name_of_function(parameters)\
    \ {\n  statements;\n}\n```\n```\n\nParameters are placed within the parentheses\
    \ that follow a function name. A **parameter** is a variable that is used within\
    \ a function. Placing a parameter name within the parentheses of a function definition\
    \ is the equivalent of declaring a new variable. However, you do not need to include\
    \ the var keyword. For example, suppose that you want to write a function named\
    \ `calculate_square_root()` that calculates the square root of a number contained\
    \ in a parameter"
