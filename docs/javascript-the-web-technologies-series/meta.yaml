  md: '# Preface


    JavaScript is a client-side scripting language that allows Web page authors to
    develop interactive Web pages and sites. Although JavaScript is considered a programming
    language, it is also a critical part of Web page design and authoring. This is
    because the JavaScript language “lives” within a Web page’s elements. The language
    is relatively easy to learn, allowing non-programmers to quickly incorporate JavaScript
    functionality into a Web page. In fact, because it is used extensively in countless
    Web pages that are available on the World Wide Web, JavaScript is arguably the
    most widely used programming language in the world.


    JavaScript, Fifth Edition teaches JavaScript for students with little programming
    or database experience. Although no prior programming experience is required,
    knowledge of HTML and Web page design is helpful, but not required. This book
    covers the basics of ECMAScript Edition 3, which is compatible with recent Web
    browsers using Mozilla Firefox and Microsoft Internet Explorer, along with advanced
    topics including object-oriented programming, the Document Object Model (DOM),
    and AJAX. Further, this book presents JavaScript techniques using XML-compatible
    Web pages. After you complete this course, you will be able to use JavaScript
    to build professional quality, dynamic sites.


