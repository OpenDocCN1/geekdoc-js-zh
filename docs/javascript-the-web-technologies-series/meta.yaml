    never copy another Web page''s work and attempt to pass it off as your own. As
    a responsible member of the Web community, you should examine the HTML code behind
    a Web page only to improve your skills. The potential threat of another Web page
    author''s hard work and intellectual property is no small concern. Not only is
    stealing another Web page author''s code and Web page designs unscrupulous, but
    in many cases it is illegal, especially if the work is copyrighted. Throughout
