  md: '# Working with the History, Location, and Navigator Objects


    | Properties | Description |

    | --- | --- |

    | hash | A URL''s anchor |

    | host | The host and domain name (or IP address) of a network host |

    | hostname | A combination of the URL''s host name and port sections |

    | href | The full URL address |

    | pathname | The URL''s path |

    | port | The URL''s port |

    | protocol | The URL''s protocol |

    | search | A URL''s search or query portion |


    Table 4-6 Properties of the Location object


    | Method | Description |

    | --- | --- |

    | assign() | Loads a new Web page |

    | reload() | Causes the page that currently appears in the Web browser to open
    again |

    | replace() | Replaces the currently loaded URL with a different one |


    Table 4-7 Methods of the Location object


    The properties of the Location object allow you to modify individual portions
    of a URL. When you modify any properties of the Location object, the Web browser
    automatically attempts to open a new URL. Instead of modifying individual portions
    of a URL, it is usually easier to change the href property, which represents the
    entire URL. For example, the statement location href="www.google.com"; opens the
    Google home page.


    The assign() method of the Location object performs the same action as changing
    the href property: It loads a new Web page. The statement location.assign("http://www.google.com");
    is equivalent to the statement location.href = "http://www.google.com";


    The reload() method of the Location object is equivalent to the Reload button
    in Firefox or the Refresh button in Internet Explorer. It causes the page that
    currently appears in the Web browser to open again. You can use the reload() button
    without any arguments, as in location.reload(); or you can include a Boolean argument
    of true or false. Including an argument of true forces the current Web page to
    reload from the server where it is located, even if no changes have been made
    to it. For example, the statement location.reload(true); forces the current page
    to reload. If you include an argument of false, or do not include any argument
    at all, then the Web page reloads only if it has changed.'
