    Arithmetic operations can also be performed on a single variable using unary operators.
    Table 2-6 lists the arithmetic unary operators available in JavaScript.


    | Name | Operator | Description |

    | --- | --- | --- |

    | Increment | ++ | Increases an operand by a value of one |

    | Decrement | -- | Decreases an operand by a value of one |

