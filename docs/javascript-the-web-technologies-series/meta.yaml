    The Document branch of the browser object model is its own object called the Document
    Object, or DOM. You will learn more about the DOM in Chapter 10.


    # Referencing JavaScript Objects


    Some of the objects in the browser object model represent arrays. In Figure 4-1,
    those objects that are arrays are followed by brackets, such as forms[] or images[
    The arrays contain objects created from the corresponding elements on a Web page.
    For example, the images [] array contains all the <img> elements on a Web page.
    Image objects for each <img> element are assigned to the elements of the page
    [] in the order that they appear on the Web page. The first Image object is represented
    by images[0], the second Image object is represented by images[1], and so on.


    As you learned in Chapter 1, you can use JavaScript to reference any element on
    a Web page by using periods to append the element''s name to the name of any elements
    in which it is nested, starting with the Document object. For elements that are
    represented by arrays, you can reference the object through the array instead
    of with the element name. Consider an Image object, which contains a src property
    that contains the URL assigned to an <img> element''s attribute. Assuming that
    the image is assigned a name of company-Logo, use the following code to display
    the image in an alert dialog box:


    ```

    <img src="company_logo.gif" name="companyLogo" height="100" width="200" onclick="window.alert(''+This
    image is located at the following URL: ''+document.companyLogo.src+''Image of
    a company logo.'');">

    ```'
