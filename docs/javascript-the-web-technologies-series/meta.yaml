    predefined JavaScript object type |

    | Data type | typeof | Determines the data type of a variable |

    | Void | void | Evaluates an expression without returning a result |


    Table 2-10


    You will be introduced to the special JavaScript operators as necessary throughout
    this book. One special operator that you will use in this section is the typeof
    operator. This operator is useful because the data type of variables can change
    during the course of program execution. This can cause problems if you attempt
    to perform an arithmetic operation and one of the variables is a string or the
    null value. To avoid such problems, you can use the typeof operator to determine
    the data type of a variable. The syntax for the typeof operator is typeof(variab);
    You should use the typeof operator whenever you need to be sure that a variable
    is the correct data type. The values that can be returned by the typeof operator
    are listed in Table 2-11.'
