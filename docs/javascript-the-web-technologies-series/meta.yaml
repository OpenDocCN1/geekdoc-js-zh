  md: 'by using the keyword new and the Array() constructor with the

    following syntax:


    ```

    var arrayName = new Array(number of elements);

    ```


    Within the parentheses of the Array() construction, you include an

    integer that represents the number of elements to be contained in the

    array. Each piece of data contained in an array is called an element.

    The following code creates an array named cellPhones that has

    10 elements:


    ```

    var cellPhones = new Array(10);

    ```


    An index is an element''s numeric position within the array. The num-

    bering of elements within an array starts with an index number of

    zero (0). This numbering scheme can be very confusing for beginners.

    You to refer to a specific element by enclosing its index number in

    brackets at the end of the array name. For example, the first element

    the cellPhones array is cellPhones[0], the second element is

    cellPhones[1], the third element is cellPhones[2], and so on. This

    also means that if you have an array consisting of ten elements, then

    the10th element in the array would be referred to using an index of

    9. assign values to individual array elements in the same fashion

    as you assign values to a standard variable, except that you include

    the index for an individual element of the array. The following code

    assign values to the first three elements within the cellPhones array:


    ```

    cellPhones[0] = "BlackBerry Storm 9530"; // first element

    cellPhones[1] = "LG X8360"; // second element

    cellPhones[2] = "Motorola MOTO W755"; // third element

    ```


    When you create a new array with the Array() constructor, declar-

    ing the number of array elements is optional. You can create an array

    without any elements and add new elements to the array as necessary.

    The size of an array can change dynamically. If you assign a value to

    element that has not yet been created, the element is created auto-

    mmatically, along with any elements that might precede it. For example,

    the first statement in the following code creates the cellPhones array

    without any elements. The second statement then assigns "BlackBerry

    Storm 9530" to the third element, which also creates the first two ele-\ments
    (cellPhones[0] and cellPhones[1]) in the process. However,

    note that you assign values to them, cellPhones[0] and

    cellPhones[1] will both contain undefined values.


    ```

    cellPhones = new Array();

    cellPhones[2] = "BlackBerry Storm 9530";

    ```


