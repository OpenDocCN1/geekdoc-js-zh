    \ These events are also commonly used to change an element's style, such as the\
    \ formatting of a link when the mouse passes over it. To refer to a CSS style\
    \ in JavaScript, you use this reference and the style property in an event handler\
    \ within the element itself. You use the style property to modify an element's\
