  md: '- Web development, or Web programming, refers to the design of software applications
    for a Web site.


    - In traditional client/server architecture, the server is usually sort of database
    from which a client requests information.


    - A system consisting of a client and a server is known as a two-tier system.
    The Web is built on a two-tier client/server system, in which a Web browser (the
    client) requests documents from a Web server.


    - A three-tier, or multitier, client/server system consists of three distinct
    pieces: the client tier, the processing tier, and the data storage tier.


    - JavaScript is a client-side scripting language that allows Web page authors
    to develop interactive Web pages and sites. Client-side scripting refers to a
    scripting language that runs on a local browser (on the client tier) instead of
    a Web server (on the processing tier).


    - The part of a browser that executes scripting language code is just the browser''s
    scripting engine. A engine is just one kind of interpreter, with the term interpreter
    referring to any program that executes scripting language code. A Web browser
    that contains a scripting engine is called a scripting host. Firefox and Internet
    Explorer are examples of scripting hosts that can run JavaScript programs.


    - For security reasons, the JavaScript programming language can be used outside
    of the Web browser.


    - Server-side scripting refers to a scripting language that is executed from a
    Web server.


    - A general rule of thumb is to allow the client to handle the interface processing
    and light processing, such as data validation, but have the Web server perform
    intensive calculations and data storage.


    - The &lt;script&gt; element tells the Web browser that the scripting engine interprets
    its commands. The individual lines of code, or statements, that make up a JavaScript
    program in a document are contained within the &lt;script&gt; element.


    - An object is programming code and data that can be treated as an individual
    unit or component. The procedures associated with an object are called methods.
    A property is a piece of data, such as a color or name that is associated with
    an object.


    51'
