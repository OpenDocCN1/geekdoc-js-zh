    # Understanding Operator Precedence


    When using operators to create expressions in JavaScript, you need to be aware
    of the precedence of an operator. The term **precedence** refers to the order
    in which operations in an expression are evaluated. Table 2-12 shows the order
    of precedence for JavaScript operators. Operators in the same grouping in Table
    2-12 have the same order of precedence. When performing operations with operators
    in the same precedence group, the order of precedence is determined by the operator’s
    **associativity**—that is, the order in which operators of equal precedence execute.
    Associativity is evaluated from left-to-right or right-to-left, depending on the
    operators involved, as explained shortly.'
