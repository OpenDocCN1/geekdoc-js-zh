    # Placing JavaScript in the Document Head or Document Body


    You can place <script> elements in either the document head or document body.
    Where you place your <script> elements varies, depending on the program you are
    writing. The statements in a script are rendered in the order in which they appear
    in the document. As a general rule, then, it is a good idea to place as much of
    your JavaScript code as possible in the document head, because the head of a document
    is rendered before the document body. When placed in the document head, JavaScript
    code is processed before the main body of the document is displayed. It is especially
    important to place JavaScript code in the document head when your code performs
    behind-the-scenes tasks that are required by script sections located in the document
    body.


