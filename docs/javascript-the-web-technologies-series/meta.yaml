    to improve your own skills, not to hijack someone''s hard work.


    # Understanding Client/Server Architecture


    To be successful in Web development, you need to understand the basics of client/server
    architecture. There are many definitions of the terms client and server. In the
    traditional client/server architecture, the server is usually some sort of database
    from which a client requests information. A server fulfills a request for information
    by managing the request or serving the requested information to the client—hence
    the term, client/server. A system consisting of a client and a server is known
    as a two-tier system.


    One of the primary roles of the client, or front end, in a two-tier system is
    the presentation of an interface to the user. The user interface gathers information
    from the user, submits it to a server, or back end, then receives, formats, and
    presents the results returned from the server. The main responsibility of a server
    is usually data storage and management. Usually client/server systems, heavy processing,
    such as calculations, usually takes place on the server. As desktop computers
    become increasingly powerful, however, many client/server systems have begun placing
    at least some of the processing responsibilities on the client. In a typical client/server
    system, a client computer might contain a front end that is used for requesting
    information from a database on a server. The server records that meet the client
    request, performs some sort of processing, such as calculations on the data, and
    then returns the information to the client. The client computer can also perform
    some processing, such as building the queries that are sent to the server or formatting
    and presenting the returned data. Figure 1-3 illustrates the design of a two-tier
    server system.


    15'
