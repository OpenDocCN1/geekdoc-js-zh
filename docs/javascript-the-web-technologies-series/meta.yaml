    # Working with Timeouts and Intervals


    As you develop Web pages, you may need to have some JavaScript code executed repeatedly,
    without user intervention. Alternately, you may want to create animation or allow
    for some kind of task that executes automatically. For example, you may want to
    include an advertising image that changes automatically every few seconds. Or,
    you may want to use animation to change the ticking hands of an online analog
    clock (in which case position of the clock hands would require a separate image).


    Use the window object''s timeout and interval methods to create code that executes
    automatically. The setTimeout() method is used in JavaScript to execute after
    a specific amount of time has elapsed. Code executed with the setTimeout() method
    executes only the syntax for the setTimeout() method is var code, milliseconds);
    This statement declares the variable will refer to the setTimeout() method. The
    argument must be enclosed in double or single quotation marks and can be a single
    JavaScript statement, a series of JavaScript statements, or a function call. The
    amount of time of the Web browser should wait before executing the code argument
    of the setTimeout() method is expressed in milliseconds.


    > A millisecond is one thousandth of a second; there are 1000 milliseconds in
    a second. For example, five seconds is equal to 5,000 milliseconds.


    The clearTimeout() method is used to cancel a setTimeout() method before it executes.
    The clearTimeout() method receives a single argument, which is the variable that
    represents a setTimeout() method call. The variable that represents a setTimeout()
    method call must be declared as a global variable. (Recall from Chapter 2 that
    a global variable is a declared outside of a function and is available to all
    parts of a JavaScript program.).


    The script section in the following code contains a setTimeout() method and a
    clearTimeout() method call. The setTimeout() method is set to execute after 10,000
    milliseconds (10 seconds) have elapsed. If a user clicks the OK button, the buttonPressed
    function calls the clearTimeout() method.


    ![](bbox=[0.738, 0.615, 0.917, 0.755])'
