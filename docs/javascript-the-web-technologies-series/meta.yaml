  md: "As you can see in this example, the counter is initialized, evaluated, and\
    \ incremented within the parentheses. You do not need to include a declaration\
    \ for the count variable before the for statement, nor do you need to increment\
    \ the count within the body of the for statement. Figure 3-10 shows the output.\n\
    \n![](bbox=[0.068, 0.193, 0.663, 0.487])\n\n**Figure 3-10** Output of brightest\
    \ stars script\n\nUsing a for statement is more efficient than a while statement\
    \ because you do not need as many lines of code. Consider the following while\
    \ statement:\n\n```\nvar count = 1;\nwhile (count < brightestStars.length) {\n\
    \  document.write(count + \"<br />\");\n  ++count;\n}\n```\n\nYou could achieve\
    \ the same flow control more efficiently by using a for statement as follows:\n\
    \n```\nfor (var count = 1; count < brightestStars.length; ++count) {\n  document.write(count\
    \ + \"<br />\");\n}\n```\n\nThere are times, however, when a while statement is\
    \ preferable to using a for statement, especially for looping statements that\
    \ do not need to declare, initialize, or update a counter variable. The following\
    \ code relies on a Boolean value returned from a confirm dialog box, rather than\
    \ a counter, for program control."
