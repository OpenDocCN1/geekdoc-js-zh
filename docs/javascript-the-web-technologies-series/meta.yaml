  md: "+   11. Save the PhysicsQuiz.html document, validate it with the W3C Markup\
    \ Validation Service at validator.w3.org/file-upload.html, and fix any errors\
    \ that the document contains.\n\n+   12. Open the PhysicsQuiz.html document in\
    \ your Web browser. The program should function just as it did with the multiple\
    \ functions.\n\n+   13. Close your Web browser window.\n\n# switch Statements\n\
    \nAnother JavaScript statement that is used for controlling program flow is the\
    \ switch statement. The switch statement controls program flow by executing a\
    \ specific set of statements, depending on the value of an expression. The switch\
    \ statement compares the value of an expression to a value contained within a\
    \ case label. A case label in a switch statement represents a specific value and\
    \ contains one or more statements that execute if the value of the case label\
    \ matches the value of the switch statement's expression. For example, your script\
    \ for an insurance company might include a variable named customerAge. A switch\
    \ statement can evaluate the variable and compare it to a case label within the\
    \ switch construct. The switch statement might contain several case labels for\
    \ different age groups that calculate insurance rates based on a customer's age.\
    \ If the customerVariable is equal to 25, the statements that are part of the\
    \ \"25\" case label execute and calculate insurance rates for customers who are\
    \ 25 or older. Although you could accomplish the task using if or if... else statements,\
    \ a switch statement makes it easier to organize the different branches of code\
    \ that can be executed. The syntax for the switch statement is as follows:\n\n\
    ```\nswitch (expression) {\n  case label:\n    statement(s);\n  case label:\n\
    \    statement(s);\n  default:\n    statement(s);\n}\n```\n\nA label consists\
    \ of the keyword case, followed by a literal value or variable name, followed\
    \ by a colon. JavaScript compares the value returned from the switch expression\
    \ to the literal value or variable name following the case keyword. If a match\
    \ is found, the case label statements execute. For example, the case label 3.17\
    \ represents a floating-point integer value of 3.17. If the value"
  merge: -1
  pgno: 179
- img_proc: false
  md: "# Making Decisions\n\nof a switch statement expression equals 3.17, then the\
    \ case 3.17: label statements execute. You can use a variety of data types as\
    \ case labels within the same switch statement. The following code shows examples\
    \ of four case labels:\n\n```\ncase exampleVar:    // variable name\n    statement(s)\n\
    case \"text string\": // string literal\n    statement(s)\ncase 75:          \
    \   // integer literal\ncase -273.4:         // floating-point literal\n    statement(s)\n\
    ```\n\nAnother type of label used within switch statements is the default. The\
    \ default label contains statements that execute when the value returned by the\
    \ switch statement expression does not match a case label. A default label consists\
    \ of the keyword followed by a colon.\n\nWhen a switch statement executes, the\
    \ value returned by the expression is compared to each case label in the order\
    \ in which it is encountered. A matching label is found, its statements execute.\
    \ Unlike the if...else statement, a switch statement does not automatically stop\
    \ after particular label statements execute. Instead, the switch statement continues\
    \ evaluating the rest of the case labels in the list. Once a matching label is\
    \ found, evaluation of additional case labels is unnecessary. If you are working\
    \ with a large switch statement with many case labels, additional case labels\
    \ can potentially slow down your program.\n\nTo avoid slow performance, you need\
    \ to give some thought to how and to end a switch statement. A switch statement\
    \ ends automatically after the JavaScript interpreter encounters its closing brace\
    \ (). You can, however, use a special kind of statement, called a break statement,\
    \ to end a switch statement once it has performed its required task, such as the\
    \ switch, while, do...while, and for looping statements. To end a switch statement\
    \ once it performs its task, include a break statement within each case label.\n\
    \nThe following code shows a switch statement contained within a function. When\
    \ the function is called, it is passed an argument named americanCity. The switch\
    \ statement compares the contents of the americanCity argument to the case labels.\
    \ If a match is found, the city's state is returned and a break statement ends\
    \ the switch statement. If a match is not found, the value \"United States\" is\
    \ returned from the default label.\n\n> A single or multiple statements can follow\
    \ a case label. However, unlike if statements, multiple statements for a case\
    \ do not need to be enclosed within a command block.\n\n> Other programming languages,\
    \ such as Java and C++, require all case labels to be of the same data type."
