    Table 2-3, the backslash is ignored.


    Note one of the characters generated by an escape sequence is the backslash. Because
    the escape sequence itself is a backslash, you must use the escape sequence \
    to include a backslash as a character in a string. For example, to include the
    path "C:\JavaScript_Projects\Files" you must include two backslashes for every
    single backslash you want to appear in the string, as in the following statement:


    ```

