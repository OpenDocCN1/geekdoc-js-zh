    # Structuring JavaScript Code


    When you add JavaScript code to a document, you need to follow certain rules regarding
    the placement and organization of that code. The following sections describe some
    important rules to keep in mind when structuring your JavaScript code.


    # Including a <script> Element for Each Code Section


    You can include as many script sections as you like within a document. However,
    when you include multiple script sections in a document, you must include a <script>
    element for each section. The following document includes two separate script
    sections. The script sections create the information that is displayed beneath
    the <h2> headings. Figure 1-13 shows the output.


    ```

    <h1>Multiple Script Sections</h1>

    <h2>First Script Section</h2>

    <script type="text/javascript">

    document.write("<p>Output from the first script section.</p>");

    </script>

    <h2>Second Script Section</h2>

    <script type="text/javascript">

    document.write("<p>Output from the second script section.</p>");

    </script>

    ```'
