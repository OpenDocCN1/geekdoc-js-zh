    \ to yourself, or instructions to future programmers who may need to modify your\
    \ work.\n\n+   - The values a program stores in computer memory are commonly called\
    \ variables.\n\n+   - Reserved words (also called keywords) are special words\
    \ that are part of the JavaScript language syntax.\n\n+   - An expression is a\
    \ literal value or variable or a combination of literal values, variables, operators,\
    \ and other expressions that can be evaluated by the JavaScript interpreter to\
    \ produce a result.\n\nOperands are variables and literals contained in an expression.\n\
    \n+   - An event is a specific circumstance (such as an action performed by a\
    \ user, or an action performed by the browser) that is monitored by JavaScript\
    \ and that your script can respond to in some way. Code that executes in response\
    \ to a specific event is called an event handler.\n\n+   - You can save JavaScript\
    \ code in an external file called a JavaScript source file.\n\n+   - A validating\
