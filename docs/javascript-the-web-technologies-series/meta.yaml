  md: '# Haydur Agha


    # ...Got a Job in Computing


    Haydur Agha graduated from Fairleigh Dickinson University in 2007 with a BS in
    IT and is currently completing a MS at CUNY Baruch College. He is employed as
    an Information Security Risk Consultant at Protiviti Inc.


    What is the best career advice you could give to an IT student?

    IT students should keep in mind that their learning process is likely to never
    stop, even after they enter the professional world. As students, they should try
    to engage themselves in IT-related extracurricular activities. I learned a lot
    about programming and computer networking by working for the campus Services department
    and assisting my professors. Spending time on personal computing projects never
    hurts either. Personal projects are great resume additions when you start looking
    for your first job!


    What has surprised you most about the IT industry?

    What surprised me the most is that the industry has a multitude of options to
    choose from and are not limited to being a programmer or a network administrator.
    Initially, the number of specializations was overwhelming, but I did my research
    and chose exactly what I wanted to do as a career: Information Security.


    What is your favorite thing about your job?

    As an information security consultant, no two engagements are alike. Every assignment
    I get requires a thorough understanding of the client''s systems, network architecture,
    and applications. Of course, what is more fun is to break systems and applications
    and help developers fix vulnerabilities in their code. I also like the amount
    of exposure I get to both new and old technologies as well as people who are experts
    in them.


    Where do you see yourself in 10 years professionally?

    In 10 years I would like to be running my own Information Security program. Technology
    is advancing very rapidly in this segment of IT, and there''s an ever-growing
    need for qualified and experienced professionals. Being able to design and manage
    an enterprise-level Information Security program is a challenge I look forward
    to.


    Contribute. Contribute. Lead. www.cengage.com/coursetechnology


