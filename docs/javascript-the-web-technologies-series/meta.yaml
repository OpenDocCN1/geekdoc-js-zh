    # Understanding Numeric Data Types


    Numeric data types are an important part of any programming language and are particularly
    useful for arithmetic calculations. JavaScript supports two numeric types: integers
    and floating-point numbers. An **integer** is a positive or negative number without
    decimal places. An integer in JavaScript can range from -9007199254740991 (-2⁵³³)
    to 9007199254740991 (2⁵³³). The numbers -250, 13, 0, 2, 6, 10, 1000 are examples
    of integers. The numbers -6.16, -4.4 are not integers; they are floating-point
    numbers because they contain decimal places. **A floating-point number** is a
    number that contains decimal places or is written in exponential notation. **Exponential
    notation, or scientific notation**, is a shortened format for writing very large
    numbers or numbers with many decimal places. Numbers written in exponential notation
    are represented by a value between 1 and 10 multiplied by some power of ten. The
    value of 10 is written with an uppercase or lowercase *E*. For example, the number
    200,000,000,000 can be written in exponential notation as 2.e11, which means "two
    times to the eleventh power". Floating-point values in JavaScript range from approximately
    ±1.797693134862357 × 10⁻³⁰⁸ to ±5 × 10³⁰²⁴.


    ![](bbox=[0.685, 0.465, 0.775, 0.545])


    > Floating-point values that exceed the largest positive value of ±1.797693134862357
    × 10³⁰⁸⁸ result in a special value of Infinity. Floating-point values that exceed
    the smallest negative value of ±5 × 10³⁰²⁴ result in -Infinity.


    Next, you will create a script that uses values containing integers, floating-point
    numbers, and exponential to print the 20 prefixes of the metric system. A metric
    prefix, or SI prefix, is a name that precedes a metric unit of measure. For example,
    the metric prefix for centimeter is *centi*; it denotes a value of 1/100. In other
    words, the centimeter is a 1/100 of a meter.


