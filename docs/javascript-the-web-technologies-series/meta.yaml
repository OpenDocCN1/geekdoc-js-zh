  md: '# CHAPTER 1 Introduction to JavaScript


    it is easier to include the code in a .js source file. There are several reasons
    you may want to use a .js source file instead of adding the code directly to a
    document.


    +   - Your document will be neater. Lengthy JavaScript code in a document can
    be confusing. You may not be able to tell at a glance where the XHTML code ends
    and the JavaScript code begins.

    - The JavaScript code can be shared among multiple Web pages. For example, your
    Web site may contain many pages that allow users to order an item. Each Web page
    displays a different item but uses the same JavaScript code to gather order information.
    Instead of recreating the JavaScript order information within each document, the
    Web pages can share a central JavaScript source file. Sharing a single source
    file among multiple documents reduces disk space. In addition, when you share
    a source file among multiple documents, a Web browser needs to keep only one copy
    of it in memory, which reduces system overhead.

    - JavaScript source files hide code from incompatible browsers. If your document
    contains JavaScript code, incompatible browser displays that code as if it were
    standard text. Contrast, if you put your code in a source file, incompatible browsers
    simply ignore it.


    You can use a combination of embedded JavaScript code and JavaScript source files
    in your documents. The ability to combine embedded JavaScript code and JavaScript
    source files in a single Web page is advantageous if you have multiple Web pages,
    each of which requires individual JavaScript code statements, but all of which
    also share a single JavaScript source file.


    Suppose you have a Web site with multiple Web pages. Each page displays a product
    that your company sells. You may have a JavaScript source file that collects order
    information, such as a person''s name and address, that is shared by each of the
    Web pages. Each individual product page may also require other kinds of information
    that you need to collect using JavaScript code. For example, one of your products
    may be a shirt, for size and color information. On another Web page, you may sell
    jellybeans, which you need to collect quantity and flavor information. Each of
    these products can share a central JavaScript source file to collect standard
    information, but each may also include embedded JavaScript code to collect product-specific
    information.


