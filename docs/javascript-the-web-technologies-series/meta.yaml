    a Boolean value of false, because 5 is not less than 3. Table 2-8 lists the JavaScript
    operators.


    | Name | Operator | Description |

    |---|---|---|

    | Equal | == | Returns true if the operands are equal |

    | Strict equal | === | Returns true if the operands are equal and of the same
    type |

    | Not equal | != | Returns true if the operands are not equal |

    | Strict not equal | !== | Returns true if the operands are not equal or not of
    the same type |

    | Greater than | > | Returns true if the left operand is greater than the right
    operand |

    | Less | < | Returns true if the left operand is less than the right operand |

    | Greater than or | >= | Returns true if the left operand is greater than or equal
    to the right operand |

    | Less than or equal | <= | Returns true if the left operand is less than or equal
    to the right operand


    Table 2-8 Comparison operators


