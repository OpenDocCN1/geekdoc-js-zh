  md: '# Short Quiz 3


    +   1. Why is a counter critical to repetition statements?

    2. How do you break out of an infinite loop?

    3. Which type of repetition statement always executes its statements once, even
    if the conditional expression returns a value of false?

    4. What are the primary differences between the while statement and the for statement?

    5. How do you restart a repetition statement?


    # Summing Up


    +   * An array contains a set of data represented by a single variable name. You
    can think of an array as a collection of variables contained within a single variable.

    * A constructor is a special type of function that is used as the basis for creating
    reference variables (that is, variables whose data type is the reference type).

    * Each piece of data contained in an array is called an element.

    * An index is an element''s numeric position within the array.

    * The Array class contains a single property, the length property, which returns
    the number of elements in an array.

    * The process of determining the order in which statements execute in a program
    is decision making or flow control.

    * The if statement is used to execute specific programming code if the evaluation
    of a conditional expression returns a value of true.

    * A command block is a set of statements contained within a set of braces, similar
    to the way function statements are contained within a set of braces.

    * An if statement that includes an else clause is called an if...else statement.'
  merge: -1
