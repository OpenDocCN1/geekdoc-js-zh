  md: "# Building Arrays and Control Structures\n\n```\nvar i = true;\nwhile (i =\
    \ true)\n  window.confirm(\"Do you want to redisplay\\n  this dialog box?\");\n\
    ```\n\nYou could accomplish the same task in the preceding example by using a\
    \ for statement, but in this case, the third part of the statement, which updates\
    \ the counter, would be unnecessary. This is because the counter is updated by\
    \ the value returned from the window.confirm() method; a value of true would cause\
    \ the loop to iterate, while a value of false would cause the loop to exit. Therefore,\
    \ this code is better written using a while statement instead of a for statement\
    \ in the preceding example, you must not include the update section. You must\
    \ also remember to retain the semicolon that separates the conditional section\
    \ from the update section. If you include the update section, you could create\
    \ an infinite loop.\n\nThe following code shows an example of the Days of Week\
    \ script we saw earlier for a for statement. This time, however, the script includes\
    \ a for instead of a do...while statement. Notice the declaration of the count\
    \ variable are now all contained within the for statement. Using a for statement\
