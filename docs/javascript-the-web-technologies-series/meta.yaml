  md: '# Working with Data Types


    Variables can contain many different kinds of values—for example, the time of
    day, a dollar amount, or a person''s name. A data type is the specific category
    of information that a variable contains. The concept of data types is often difficult
    for beginning programmers to grasp in real life you don''t distinguish among different
    types of information. If someone asks you for your name, your age, or the current
    time, you don''t stop to consider that your name is a text string and that the
    current time are numbers. However, a variable''s specific data type is very important
    in programming because it determines how much memory the computer allocates for
    the data stored in the variable. The data type also governs the kinds of operations
    that can be performed on a variable.


    Data types that can be assigned only a single value are called primitive types.
    JavaScript supports the five primitive data types described in Table 2-2.


    | Data type | Description |

    |---|---|n| Number | Positive or negative numbers with or without decimal places,
    or number written using exponential notation |

    | Boolean | A logical value of true or false |

    | String | Text such as "Hello World" |

    | Undefined | A variable that has never had a value assigned to it, it has not
    been declared, or does not exist |

    | Null | An empty value |

    | JavaScript | Primitive JavaScript data types |


    The null value is a data type as well as a value that can be assigned to a variable.
    Assigning the value "null" to a variable indicates the variable does not contain
    a usable value. A variable with a value of "null" has a value assigned to it—null
    is really the value "no value". You assign the "null" to variable when you want
    to ensure that the variable does not contain any data. In contrast, an undefined
    variable is a variable that has never had a value assigned to it, or does not
    declared. The value undefined indicates that the variable has never been assigned
    a value—not even the null value. One use for an undefined variable is to determine
    whether a value is being used by another part of your script. As an example of
    an undefined variable, the following code declares a variable named stateVar without
    a value. The second statement uses the document.write() method to print the stateVar
    variable,'
