    # Summing Up


    +   - In 1990 and 1991, Tim Berners-Lee created what would become the World Wide
    Web, or the Web, at the European Laboratory for Particle Physics (CERN) in Geneva,
    Switzerland, as a way to easily access cross-referenced documents that existed
    on the CERN computer network. This method of accessing cross-referenced documents,
    known as hypertext linking, is probably the most important aspect of the Web because
    it allows you to open other Web pages quickly.

    - A document on the Web is called a Web page and is identified by a unique address
    called the Uniform Resource Locator, URL. A URL is a type of Uniform Resource
    Identifier (URI), which is a generic term for many types of names and addresses
    on the World Wide Web.

    - The World Wide Web Consortium, or W3C, was established in 1994 at MIT to oversee
    the development of Web technology standards.

    - Hypertext Markup Language, or HTML, is a markup language used to create the
    Web pages that appear on the World Wide Web. HTML documents are text documents
    that contain formatting instructions, called tags, which determine how data is
    displayed on a Web page. A tag pair and any data it contains is referred to as
    an element.

    - The process by which a Web browser assembles and formats an HTML document is
    called parsing or rendering.

    - Web page authoring (or Web authoring) refers to the creation and assembly of
    the tags, attributes, and data that make up a Web page.'
