  md: '# CHAPTER 2 Working Functions, Data Types, and Operators


    The Or (|) and the And (&&) operators are binary operators (requiring two operands),
    whereas the Not (!) operator is a unary operator (requiring a single operand).
    Logical operators are often used with comparison operators to evaluate expressions,
    allowing you to combine the results of several expressions into a single statement.
    For example, the And (&&) operator is used for determining whether two operands
    return an equivalent value. The operands themselves are often expressions. The
    following code uses the And operator to compare two separate expressions:


    ```

    var gender = "male";nvar age = 17;

    var riskFactor = gender=="male" && age<=21; // returns true

    ```


    In the preceding example, the variable expression evaluates to true because it
    is equal to "male", and the age variable evaluates to true because its value is
    less than or equal to 21. Because both expressions are true, riskFactor is assigned
    a value of true. The statement containing the (&&) and operator essentially says,
    "if variable gender is equal to "male" and age is less or to 21, assign a value
    of true to riskFactor. Otherwise, assign a value of false to riskFactor." In the
    following code, however, riskFactor is assigned a value of false, because the
    age variable does not evaluate to true:


    ```

    var gender = "male";nvar age = 28;

    var riskFactor = gender=="male" && age<=21; // returns false

    ```


    The Or (|) operator checks to see if either expression evaluates to true. For
    example, the statement in the following code says, "if the variable speedingTicket
    is greater than 0 or age is less or equal to 21, assign a value of true to riskFactor.
    Otherwise, assign a value of false to riskFactor."


    ```

    var speedingTicket = 2;

    var age = 28;

    var riskFactor = speedingTicket>0 || age<=21; // returns true

    ```


    The riskFactor in the variable above is assigned a value of true, because the
    speedingTicket variable evaluates to true, even though the age variable evaluates
    to false. This result occurs because the Or (|) statement returns true if either
    the left or right operand evaluates to true.


    The following code is an example of the Not (!) operator, which returns true if
    an operand evaluates to false and returns false if an operand evaluates to true.
    Notice that since the Not operator is unary, it requires only a single operand.


    > Logical operators are often used within conditional and looping statements such
    as if...else, for, and while statements. You will learn about conditional and
    looping statements in Chapter 3.


