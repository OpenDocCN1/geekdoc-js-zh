  md: "# CHAPTER 3 Building Arrays and Control Structures\n\na statement or series\
    \ of statements as long as a given conditional expression evaluates to true. The\
    \ statement performs essentially the same function as the while statement: If\
    \ a conditional expression within the statement evaluates to true, then the statement\
    \ executes and will continue to repeat until the conditional expression evaluates\
    \ to false.\n\nOne of the primary differences between the while statement and\
    \ the for statement is that, in addition to a conditional expression, the for\
    \ statement can also include code that initializes a counter and changes its value\
    \ with each iteration. This is useful because it provides a specific place for\
    \ you to declare and initialize a counter, and to update its value, which helps\
    \ prevent infinite loops. The syntax of the for statement is as follows:\n\n```\n\
    for (counter declaration and initialization; condition;\n  update statement);\n\
    }\n```\n\nWhen the JavaScript interpreter encounters a loop, the following steps\
    \ occur:\n\n+   1. The counter variable is declared and initialized. For example,\
    \ if the initialization expression in a for loop is var count = 1; then a named\
    \ count is declared and assigned an initial value of 1. The initialization expression\
    \ is only started once, when the loop is first encountered.\n2. The for condition\
    \ is evaluated.\n3. If the condition evaluation in Step 2 returns a value of true,\
    \ then the for loop executes, Step 4 occurs, and if the condition evaluation in\
    \ Step 2 returns a value of false, then the for statement ends and the next statement\
    \ following the for statement executes.\n4. The update statement in the for statement\
    \ is executed. Example, the counter variable may be incremented by one.\n\nYou\
    \ can omit any of the three parts of the statement, but you must include the semicolons\
    \ section. If you omit a section, but if you include code within the body of that\
    \ statement or your program may get caught in an infinite loop.\n\nThe following\
    \ script shows a for statement that prints the contents of an array:\n\n```\n\
    var brightStars = new Array();\nbrightStars[0] = \"Sirius\";\nbrightStars[1] =\
    \ \"Canopus\";\nbrightStars[2] = \"Arcturus\";\nbrightStars[3] = \"Rigel\";\n\
    brightStars[4] = \"Vega\";\nfor (var count = 0; count < brightStars.length; ++count)\
    \ {\n  document.write(brightStars[count] + \"<br/>\");\n}\n```\n\n168"
