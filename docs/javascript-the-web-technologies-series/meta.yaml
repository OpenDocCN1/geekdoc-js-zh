  md: '# CHAPTER 4


    You do not have to create any of the objects or arrays explicitly in the browser
    object model; they are created automatically when a Web browser opens a Web page.
    The top-level object in the browser object model is the window object, which represents
    a Web window. The Web browser automatically creates the window object for you.
    The window object is called the global object because all other objects in the
    browser object model are contained within it. For example, the window object contains
    the Document object, just as a Web browser contains a Web page document. You use
    the methods and properties of the Window object to control the Web browser, while
    you use the methods and properties of the Document object to control the Web page.
    Figure 4-2 illustrates the concepts of the window object and the Document object.


    ![](bbox=[0.078, 0.323, 0.269, 0.401])


    ![](bbox=[0.068, 0.553, 0.269, 0.626])


    ![](bbox=[0.289, 0.368, 0.915, 0.663])


    Figure 4-2 Window object and Document object


    # The Document Object


    The Document object is arguably the most important object in the browser object
    model because it represents the Web page displayed in a browser. You are already
    familiar with the write() methods, which refer to the Document object. The statement
    document.write("Go Patriots!"); adds the text "Go Patriots!" to a Web page when
