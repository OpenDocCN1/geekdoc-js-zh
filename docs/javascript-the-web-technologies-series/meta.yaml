  md: '# CHAPTER 4 Manipulating the Browser Object Model


    The replace() method of the Location object is used to replace the currently loaded
    URL with a different one. This method works some-what from loading a new document
    by changing the href property. The replace() method actually overwrites one document
    with another and replaces the old URL in the Browser''s history list. In contrast,
    the href property opens a different document and adds it to the history list.


