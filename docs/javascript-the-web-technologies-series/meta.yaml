    # Adding Comments to a JavaScript Program


    When you create a program, whether in JavaScript or any other programming language,
    it is considered good programming practice to add comments to your code. In this
    section, you will learn how to create JavaScript comments. Comments are nonprinting
    lines that you place in your code to contain various types of remarks, including
    the name of the program, your name and the date you created the program, notes
    to yourself, or instructions to future programmers who may need to modify your
    code. When you are working with long scripts, comments make it easier to decipher
    how a program is structured.


    JavaScript supports two kinds of comments: line comments and block comments. To
    create a line comment add two slashes // before the text you want to use as a
    comment. The // characters instruct the JavaScript interpreter to ignore all text
    immediately following the slashes to the end of the line. You can place a line
    comment either at the end of a line of code or on its own line. Block comments
    hide multiple lines of code. You create a block comment by adding /* to the first
    line that you wanted in the block, and close a block comment by placing /* after
    the last character in the block. Any text or lines between the opening /* and
    the closing /* characters are ignored by the JavaScript interpreter. The following
    code shows a <script> element containing line and block comments. If you open
    a document containing the following script in a Web browser, the browser does
    not render the text marked with comments.'
