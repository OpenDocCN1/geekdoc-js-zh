  md: '# CHAPTER Introduction to JavaScript


    URL in the browser''s Address box or by clicking a hypertext link. When a user
    wants to access a Web page, either by entering its URL in a browser''s Address
    box or by clicking a link, the user''s browser asks a server for the Web page
    in which is referred to as a request. A Web server is a computer that delivers
