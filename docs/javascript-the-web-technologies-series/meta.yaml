    # Opening a Window


    The problem with using the target attribute is that it''s deprecated in XHTML;
    you can only use it in the transitional or frameset DTDs. In order to open new
    windows in the strict DTD, you must use the `open()` method of the window object.
    The syntax for the `open()` method is as follows:


    ```

    window.open(url, name, options, replace);

    ```


    Table 4-3 lists the arguments of the window.open() method.


    | Argument | Description |

    |---|---|

    | URL | Represents the Web address or filename to be opened |

    | name | Assigns a value to a name property of the new window object |

    | options | Represents a string that allows you to customize the new Web browser''s
    appearance |

    | replace | A Boolean value that determines whether the URL should create a new
    entry in the Web browser''s history list or replace the entry |


    Table 4-3 Arguments of the window object''s open() method'
