    # Working with the History, Location, and Navigator Objects


    In this section, you will learn how to work with the History, Location, and Navigator
    objects.


    # The History Object


    The History object maintains an internal list (known as a history list) of all
    the documents that have been opened during the current Web browser session. Each
    Web browser window contains its own internal History object. You cannot view the
    URLs contained in the history list, but you can write a script that uses the history
    list to navigate to Web pages that have been opened during a Web session.'
