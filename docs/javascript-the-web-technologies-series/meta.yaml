  md: '# # Manipulating the Browser with the Window Object


    The window object includes several properties that contain information about the
    Web browser. For instance, the status property contains information displayed
    in a Web browser''s status bar. Also contained in the Window object are various
    methods that allow you to manipulate the Web browser window itself. You have already
    used some methods of the Window object, including the window.alert(), window.confirm(),
    and window.prompt() methods, which all display dialog boxes. Table 4-1 lists the
    window object properties, and Table 4-2 lists the window object methods.


    | Property | Description |

    |---|---|

    | closed | Returns a Boolean value that indicates whether a window has been closed
    |

    | defaultStatus | Sets the default text that is written to the status bar |

    | document | Returns a reference to the Document object |

    | history | Returns a reference to the History object |

    | location | Returns a reference to the Location object |

    | name | Returns the name of the window |

    | opener | Refers to the window that opened the current window |

    | parent | Refers to a frame within the same frameset |

    | self | Returns a self-reference to the window object; identical to the window
    object |

    | status | Specifies temporary text that is written to the status bar |

    | top | Returns the topmost window object |

    | window | Returns a self-reference to the Window object; identical to the self
    object |


    | Method | Description |

    |---|---|

    | alert() | Displays a simple message dialog box with an OK button |

    | blur() | Removes focus from a window |

    | setInterval() | Cancels an interval that was set with setInterval() |

    | setTimeout() | Cancels a timeout that was set with setTimeout() |

    | close() | Closes a Web browser window |

    | confirm() | Displays a confirmation dialog box with OK and Cancel buttons |

    | focus() | Makes a Window object the active window |

    | move() | Moves the window relative to the current position |'
  merge: -1
  pgno: 222
- img_proc: false
  md: '# CHAPTER 4 Manipulating the Browser Object Model


    (continued)


    | Method | Description |

    | --- | --- |

    | moveTo() | Moves the window to an absolute position |

    | open() | Opens a Web browser window |

    | print() | Prints the document displayed in the current window |

    | prompt() | Displays a dialog box prompting a user to enter information |

    | resizeBy() | Resizes a window by a specified amount |

    | resizeTo() | Resizes a window to a specified size |

    | scrollBy() | Scrolls the window by a specified amount |

    | scrollTo() | Scrolls the window by a specified position |

    | setInterval() | Repeatedly executes a function after a specified number of milliseconds
    have elapsed |

    | setTimeout() | Executes a function once after a specified number of milliseconds
    have elapsed |


    Table 4-2 Window object methods


    ![](bbox=[0.98, 0.448, 0.165, 0.503])


    Some browsers, including Internet Explorer, custom properties and methods for
    the Window object. This book describes only properties and methods that are common
    to browser objects in all current Web browsers.


    Another way of referring to the window object is by using the self property, which
    refers to the current Window object. Using the self property is identical to using
    the window property to refer to the Window object. For example, the following
    lines are identical:


    ```

    window.alert("Your order has been received.");

    self.alert("Your order has been received.");

    ```


    Some JavaScript programmers prefer to use the window property, while other JavaScript
    programmers prefer to use the self property. The choice is yours. However, when
    attempting to decipher JavaScript code created by other programmers, be aware
    that both of these properties refer to the current window object.


    Because a Web browser assumes that you are referring to the global object, you
    do not need to refer explicitly to the Window object when using one of its properties
    or methods. For example, the alert(text) is a method of the Window object. Throughout
    this text, you have used the full syntax of window.alert(text); although the syntax
    alert(text) (without the Window object) works equally well. However, it''s good
    practice to use the window or self references when referring to a property or
    method of the Window object in order to clearly identify them as belonging to
    the Window object. If you do not use the window or self reference, then you or
    another programmer might confuse a property or method of the Window object with
    JavaScript variables or functions.'
