  md: '# Understanding the Browser Object Model


    represent forms created with the <form> element, is contained within the Document
    object, which is contained within the Window object. The Radio object, which is
    used by JavaScript to represent a radio button created with an <input> element,
    is contained within the Form object, which is contained within the Document object,
