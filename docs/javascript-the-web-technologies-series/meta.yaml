  md: '# CHAPTER 1 Introduction to JavaScript


    ![](bbox=[0.318, 0.063, 0.803, 0.226])


    **Figure 1-3** The design of a two-tier client/server system


    The Web is built on a two-tier client/server system, in which a Web browser (the
    client) requests documents from a Web server. The Web browser is the client user
    interface. You can think of the Web server as a repository for Web pages. After
    a Web server returns the requested document, the Web browser (as the client interface)
    is responsible for formatting and presenting the document to the user. The requests
    and responses through which a Web browser and Web server communicate with HTTP.
    If a Web browser requests the URL http://www.course.com, the request is made with
    HTTP because the URL includes the HTTP protocol. The Web server then returns to
    the Web browser an HTTP response containing the header and the HTML (or XHTML)
    of Technology’s home page.


    After just adding databases and other types of applications to a Web, the client/server
    system evolves into what is known as a three-tier client/server architecture.
    A **three-tier**, or **multier, client/server system consists** of three distinct
    pieces: the client tier, the processing tier, and the data storage tier. The client
    tier, or user interface tier, is still the Web browser. However, the database
    portion of the two-tier client/server system is split into a processing tier and
    the data storage tier. The **processing tier, or middle tier**, handles the interaction
    between the Web browser client and the data storage tier. (The processing tier
    is sometimes called the processing bridge.) Essentially, the client tier makes
    a request of a database on a Web server. The processing tier performs any necessary
    processing or calculations based on the request from the client tier, and then
    reads or writes to the data storage tier. The processing tier also handles the
    return of any information to the client tier. Note that the processing tier is
    not the only place where processing can occur. The Web browser (client tier) still
    renders Web documents (which requires processing), and the database or application
    in the data storage tier might also perform some processing. Figure 1-4 illustrates
    the design of a three-tier client/server system.


    Two-tier client/server architecture is a physical arrangement in which the client
    and server are two separate computers. Three-tier client/server architecture is
    more conceptual than physical, because the storage tier can be located on the
    same server.


    Multier client/server architecture is also referred to as n-tier architecture.'
