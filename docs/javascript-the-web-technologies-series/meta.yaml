  md: '# Introduction to Web Development


    not possible to know in advancing computing capabilities of each client on the
    Web. You cannot assume that each client (browser) that accesses your client/server
    application (Web site) has the necessary power to perform the processing required
    by the application. For this reason, intensive processing should be performed
    on the server.


    Because servers are usually much more powerful than client computers, your first
    instinct might be to let the server handle all processing and only use the client
    to display a user interface. Although you do not want to overwhelm clients with
    processing they cannot handle, it is important to perform as much processing as
    possible on the client for several reasons:


    +   Distributing among multiple clients creates applications that are more powerful,
    because the processing power is not limited to the capabilities of a single computer.
    Client computers become more powerful every day, and advanced capabilities such
    as JavaScript are now available in local Web browsers. Thus, it makes sense to
    use a Web application to harness some of this power and capability. **Web application**
    is a program that executes on a server that clients access through a Web page
    loaded in browser.


    +   Local processing on client computers minimizes transfer times across the Internet
    and creates faster applications. If a client had to wait for all processing to
    be performed on the server, a Web application could be painfully slow over a busy
    Internet connection.


    +   Performing processing on client computers lightens the processing load on
    the server. If all processing in a three-tier client/server system is done on
    the server, for a popular Web site could become overwhelmed trying to process
    requests from numerous clients.


