  md: '# CHAPTER 3 Building Arrays and Control Structures


    The code you have written so far has been linear in nature. In other words, your
    programs start at the beginning and end when the last statement in the program
    executes. Decision-making and flow-control statements allow you to determine the
    order in which statements execute in a program. Controlling the flow of code and
    making decisions during program execution are two of the most fundamental skills
    required in programming. In this chapter, you will learn about both decision-making
    statements and flow-control statements. Before learning how to use decision-making
    statements and flow-control statements, you will first learn about a data type
    that is often used with these types of statements: arrays.


    # Storing Data in Arrays


    An array contains a set of data represented by a single variable name. You can
    think of an array as a collection of variables contained within a single variable.
    You use arrays when you want to store groups or lists of related information in
    a easily managed location. Lists of names, countries, test scores, and prices
    are typically stored in arrays. For example, Figure 3-1 shows that you can manage
    cell phone and models using a single array which makes this especially useful
    that you can use to refer to the individual phones without having to retype each
    make and model. You will learn how to refer to an individual item in an array
    later in this chapter.


    ![](bbox=[0.13, 0.405, 0.29, 0.76])


    | BlackBerry Storm 9530 | |

    | LG VX8360 | |

    | Motorola MOTO W755 | cellPhones array name |

    | Nokia 2605 Mirage | |

    | Samsung SCHu340 |


    Figure 3-1 Conceptual example of an array


    # Declaring and Initializing Arrays


    Arrays are represented in JavaScript by the Array object. The Array object contains
    a special constructor named Array() which is used for creating an array. A constructor
    is a special type of function that is used as the basis for creating reference
    variables (that is, variables whose data type is the reference data type). You
    create new arrays'
