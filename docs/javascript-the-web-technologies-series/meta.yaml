    In this book, objects in the browser object model are referred to with an initial
    uppercase letter (Document object). However, when you use the name in code, you
    must always use a lowercase letter. For example, the following statement refers
    to the Document object: document.write("Go Patriots!"); Note the use of the lowercase
    "d" in document.


