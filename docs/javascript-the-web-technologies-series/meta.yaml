  md: "# CHAPTER 3 Building Arrays and Control Structures\n\nYou can also assign values\
    \ to array elements when you first create the array. The following code assigns\
    \ values to the cellPhones array when it is created, prints each of the values,\
    \ using the array element numbers:\n\n```\ncellPhones = new Array(\"Blackberry\
    \ Storm 9530\",\n  \"LG VX8360\",\"Motorola MOTO W755\");\n```\n\nShould you declare\
    \ the number of array elements when you first create a new array or allow the\
    \ size of the array to change dynamically? The basic rule of thumb is you should\
    \ only declare the number of array elements if you know the exact number of elements\
    \ that the array will store. Your program will perform faster if it does not need\
    \ to continuously add new elements to an array. However, if you don't know how\
    \ many elements your array will require, you could receive a runtime error if\
    \ your script attempts to access an array element that does not exist or has not\
    \ been assigned value. So if you don't know how many elements your array will\
    \ require, it's better to allow the script to size the array dynamically.\n\n\
    Most programming languages require that all of the elements in an array be of\
    \ the same data type. However, in JavaScript the values assigned to array elements\
    \ can be of different data types. For example, the following code creates an array\
    \ and stores values with different data types in the array elements:\n\n```\n\
    var hotelReservation = new Array(4);\nhotelReservation[0]\n  = \"Don Gselin\"\
    ; // guest name (string)\nhotelReservation[1]\n  = 5; // # of nights (integer)\n\
    hotelReservation[2]\n  = 97.36; // price per night (floating point)\nhotelReservation[3]\
    \ = true; // non-smoking room (Boolean)\n```\n\n> You will study advanced array\
    \ techniques in Chapter 7.\n\n# Accessing Element Information\n\nYou access an\
    \ element's value just as you access the value of any other variable, except that\
    \ you include brackets and the element index. For example, the following code\
    \ prints the values contained in the first three elements of the cellPhones array:\n\
    \n```\ndocument.write(\n  cellPhones[0]; // prints \"Blackberry Storm 9530\"\n\
    document.write(\n  cellPhones[1]); // prints \"LG VX8360\"\ndocument.write(\n\
    \  cellPhones[2]); // prints \"Motorola MOTO W755\"\n```"
