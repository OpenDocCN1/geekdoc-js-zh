    # Creating a JavaScript Source File


    JavaScript is often incorporated directly into a Web page. However, you can also
    save JavaScript code in an external file called a JavaScript source file. You
    can then write a statement in the document that executes (or calls) the code saved
    in the source file. When a browser encounters a line calling a JavaScript source
    file, it looks in the JavaScript source file and executes it.


    A JavaScript source file is usually designated by the file extension .js and contains
    only JavaScript statements, although it can legally have any extension that you
    like. It does not contain a <script> element. Instead, the <script> element is
    located within the document that calls the source file. To access JavaScript code
    that is saved in an external file, you use the src attribute assign the URL of
    a JavaScript source file. For example, to call a JavaScript source file named
    scripts.js, you would include the following code in the document:


    ```

    <script type="javascript" src="scripts.js"></script>

    ```


    JavaScript source files cannot include XHTML elements. If you include XHTML elements
    in a JavaScript source file, it will be ignored or an error message will be generated,
    depending on which Web browser you use. In addition, if you specify a source file
    in your document using the src attribute, the browser ignores any other JavaScript
    code located within the <script> element. For example, consider the following
    JavaScript source file specified by the src attribute of the <script> element
    elements executes properly, but with the write() statement ignored.


    ```

    <script type="javascript" src="scripts.js">\document.write("<p>This statement
    will be ignored.</p>");</script>

    ```


    If the JavaScript code you intend to use in a document is fairly short, then it
    is usually easier to include JavaScript code in a <script> element within the
    document itself. However, for longer JavaScript code,


