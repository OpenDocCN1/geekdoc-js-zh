  md: "# CHAPTER 4 Manipulating the Browser Object Model\n\n| Properties | Description\
    \ |\n|---|---|\n| availHeight | Returns the height of the display screen, not\
    \ including operating system features such as the Windows taskbar |\n| availWidth\
    \ | Returns the width of the display screen, not including operating system features\
    \ such as the Windows taskbar |\n| colorDepth | Returns the display screen's bit\
    \ depth if a color palette is in use; if a color palette is not in use, returns\
    \ the value of the pixelDepth property |\n| height | Returns the height of the\
    \ display screen |\n| pixelDepth | Returns the display screen's color resolution\
    \ in bits per pixel |\n| width | Returns the width of the display screen |\n\n\
    +   **4-9** Properties of the Screen object\n\nThe colorDepth and pixelDepth properties\
    \ are most useful in determining the color resolution that the display supports.\
    \ For example, if the colorDepth property returns a value of 32, which indicates\
    \ high color resolution, you can use JavaScript to display a high color image.\
    \ However, if the colorDepth property returns a value of 16, which indicates medium\
    \ color resolution, you may want to use JavaScript to display a lower color image.\
    \ The following code illustrates how to use the colorDepth property to determine\
    \ which version of an image to display:\n\n```\nif (screen.colorDepth >= 32)\n\
    \    document.write(\"<img href=\"companyLogo_highres.jpg />\");\nelse if (screen.colorDepth\
    \ >= 16)\n    document.write(\"<img href=\"companyLogo_mediums.jpg />\");\nelse\n\
    \    document.write(\"<img href=\"companyLogo_lowres.jpg />\");\n```\n\nThe remaining\
    \ object properties determine the size of the display area. For example, on a\
    \ computer with a screen resolution of 1280 by 768, the following statements print\
    \ \"Your screen resolution is 1280 by 768:\".\n\n```\nvar screenWidth = screen.width;\n\
    var screenHeight = screen.height;\ndocument.write(\"<p>Your screen resolution\
    \ is \" + screenWidth + \" by \" + screenHeight + \".</p>\");\n```\n\nOne of the\
    \ most common uses of the Screen object properties is to center a browser window\
    \ in the display area. For windows generated with the window.open() method, you\
    \ can center a window when it first displays by assigning values to the left and\
    \ top options of the argument. To center a window horizontally, subtract the width\
    \ of the window from the screen width, divide the remainder by two, and assign\
    \ the result to the left option."
