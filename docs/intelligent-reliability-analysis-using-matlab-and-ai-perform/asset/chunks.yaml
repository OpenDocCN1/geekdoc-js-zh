    role to access the residual life of an electrolytic capacitor. Each and every
    estimation parameter has its own acceleration factor, which links real time operating
    condition with manufacturer specified operating conditions. When a product is
    manufactured, it is tested under various operating conditions and lifetime, as
    well as maximum-minimum range is calculated. But when the product is used in real
    time applications, the operating conditions may be varied, which affects the lifetime
    of the product. The acceleration factor explores the relation in between maximum
    rated condition and operating condition. For an electrolytic capacitor, its behaviour
    is analysed at various environmental conditions and electrical parameters. The
