    and reliability needed in our daily life?CHAPTER 3 Remaining Useful Lifetime Estimation
    Techniques Introduction As the electronics industry is growing on an accelerated
    pace, the electronics and electrical gadgets become obsolete after the invention
    of new technology. In 2014, a total of 41.8 metric kilo tonnes of waste electronics
    and electrical equipment was generated globally. Once the electronics and electrical
    product becomes outdated, their components become unaltered. These components
    can be reused, if their remaining useful lifetime can be predicted. The lifetime
    claimed by datasheet may vary according to real time applications. Structure In
    this chapter, we will discuss the following:  Remaining Useful Lifetime analysis Regression
    analysis Experimental techniques Empirical techniques Mathematical modelling Objectives After
    studying this chapter, you should be able to explore various statistical and test
    methods and techniques for remaining useful lifetime analysis, such as regression
    analysis, experimental techniques, as well as empirical techniques, such as military
    handbook MILHDBK217F. In the Arrhenius and acceleration factors based mathematical
    modelling, the condition and health of components are monitored Further, the Importance
    of analytical and empirical methods of failure prediction is analysed. Importance
    of failure prediction A failure of a single component can damage the whole equipment.
    So, failure prediction of electronic components is a critical issue to be targeted
    for successful operation of the device, as well as to minimise the electronic
    waste. Such an assessment is attempted to in this research work. The methodology
    involves selection of a suitable component for assessment, followed by the prediction
    of its failure. A review of the basics of reuse philosophy is made along with
    the merits of component reuse and is highlighted in this chapter. The development
    of the prediction model for the failure assessment is discussed and In this chapter,
    the development of a prediction model for each of the techniques is detailed.
    The later part discusses the regression model for prediction. The empirical method
    for RUL prediction is elaborated in the last section of this chapter. Reuse The
    definition of reuse of components is given by Fatida et al. (2009), “An action
    or operation by which components are used for the same purpose for which they
    were conceived without any prior treatment apart from disassembly, cleaning, testing,
    and reassembly.” Component reuse The option of component reuse exploits the fact
    that components, in general, have a much longer life cycle than the corresponding
    product. Some of the components may still be well-functioning even if the performance
    of the product as a whole is unacceptable. The following screenshot shows the
    well-known bathtub curve for a product and its components: ![](image-1d2y9vb8.jpg) Figure
    3.1: Bathtub curves for a product and its components The preceding screenshot
    implies that although a parent product as a whole fails, some of its components
    may be reusable due to their longer useful life (Parts A to D in Figure The traditional
    approach of discarding the whole product along with its components at its first
    life cycle (1 to 2 in Figure results in wastage of resources that could have been
    reused, now that the components A to D in Figure 3.1 are yet to complete their
    life cycle. Discarding them at this point of time amounts to wasting of resources
    that could otherwise have been used for a further period of time. The objective
    of the research is to develop a set of models to assess the RUL of used components,
    as also to highlight the potential of the reuse philosophy. Merits of component
    reuse Exploring the reuse potential of electronic and electrical components has
    the following merits:  Conservation of energy and resources Material going to
    land fill gets reduced Ensures a green environment Failure prediction of electronic
    components The concept of failure prediction life has originated from the fact
    that a certain number of components/parts of a product have an operating life
    that exceeds the life of the product itself. The unused potential of these components
    can be better utilised if there is a reliable method to accurately assess this
    potential or under real time applications, there is variation in environmental
    stress and electrical parameters, which can make a component vulnerable. Excessive
    range of operating parameters may reduce the life of a component. Sudden failure
    of a component may lead to catastrophic failure and shut down the complete system. Various
    definitions of failure prediction of a product are proposed in literature. In
    this thesis, failure prediction is defined as a function of the component’s overall
    life (total life) and the actual (used/consumed) life under the operating conditions
    of use. The failure prediction can also be estimated by subtracting the consumed
    life from the total useful life. It is similar to estimating residual life. ![](image-vrv5mllu.jpg) Figure
    3.2: Key factors of Failure Prediction Techniques for RUL prediction For predicting
    RUL, three major techniques are used:  Statistical technique Experimental technique Empirical
    technique Intelligent model For statistical multivariable regression is used,
    which can be implemented using Minitab 18.1. The experimental technique uses accelerated
    life testing, for estimating the residual lifetime. The empirical methods are
    the standard methods, which are used for condition monitoring of the electronic
    components. The intelligent model used artificial intelligence techniques such
    as Artificial Neural Networks, Fuzzy logic, and Adaptive Neuro Fuzzy Inference
    System models, which are used for predicting the remaining useful lifetime of
    the component. The proposed methodology predicts the failure and useful remaining
    life in two stages. Selection of components with reuse potential forms the first
    stage. The second stage deals with the prediction of the total residual life of
    these components using different techniques, which predicts the upcoming failure
    of that specific component. Figure 3.3 shows a procedural frame work employing
    the previously mentioned methods for the development of a failure prediction model. Selection
    of component for failure assessment Electronic components are the backbone of
    an electronic industry. In general, these components are found to have some useful
    life left even after their regular usage. When the manufacturer launches a component
    or equipment in real world, it often comes with a datasheet, which claims the
    operating range of parameters, as well as rated lifetime. But actual application
    or environmental condition may reduce or exceed its actual life. Predicting failure
    is a step to identifying the reuse potential, and it acts as a safety parameter
    for successful operation of gadget. An electrolytic capacitor is an application-oriented
    passive component, which is used in most of the electronic applications. Similar
    is the humidity sensor, which has usage from daily life to military applications.
    As such, the accurate assessment of failure of these components is of great significance
    in any electronics industry. This exercise will in turn reduce the overall repairing
    cost and help achieve enhanced productivity. This aspect of the failure prediction
    and re-use of the components has not been discussed sufficiently by researchers. ![](image-c0tqpqy5.jpg) Figure
    3.3: Analysis of Actual Lifetime (hours) Collection of failure data After selecting
    the electronic components, the next step is to explore their behaviour analysis.
    The critical parameters are decided based on literature. Based on these critical
    parameters, the behaviour of the components has been analysed. Using mathematical
    modelling, an analytical method has been suggested. It has been validated using
    practical approach. For experimental collection of failure data, accelerated life
    testing methodology is used. The failure of the components is analysed and collected
