    chamber. What is the relation between MTBF and FIT in terms of reliability? Reliability
    prediction can reduce the problem of e-waste to a great extent. Justify this statement
    using live examples.CHAPTER 2 Reliability Measures Introduction Nowadays, all
    the industries are making use of more and more automation in production. It results
    in the complexity of the industrial system, and therefore, requires special attention
    in the fault-free operation of the system as the failure of any component will
    definitely stop the working of the system. Many approaches have been used for
    improving the operation of a system, such as understanding of failure, improved
    manufacturing techniques, careful planning, design and so on, so that the reliability
    of a system is achieved. Structure In this chapter, we will discuss the following
    topics:  Reliability, availability, validity, and maintainability Reliability
    measures Need of reliability analysis Electronic component failure modes and mechanism Objectives After
    studying this chapter, the students should be able to understand the concepts
    of reliability, availability, and maintainability. The reliability evaluation
    parameters are highlighted for the condition monitoring of components, devices,
    and gadgets. The various failure modes, techniques, and mechanism of electronic
    components are further elaborated with the help of suitable applications and examples. Introduction In
    the modern era, systems and devices are operating under many environmental and
    operating conditions. These conditions affect the working of the components of
    the systems. Many times, the failure of the systems plays a crucial role. There
    are many systems where the failure of the components or devices plays an important
    role, such as failure in power plant, satellite communication, network system,
    telecommunication system, and so on. There are many other cases that affect the
    daily life of human beings, such as failure of different electronics home equipment. Reliability
    engineering is the branch of statistics and engineering. Reliability engineering
    covers both qualitative and quantitative part. Reliability measurements are indispensible
    for any system, but it cannot make a system reliable. However, the reliable design
    of the system can achieve the reliability target. Reliability analysis is also
    an important tool for failure free operation of other engineering systems such
    as power plant system, networking systems, etc. With the help of reliability analysis,
    we can identify the critical components of the various engineering systems. A
    satellite communication system provides a link between transmitter and receiver.
    There are many uses of satellite communication system, such as in broadcasting,
    internet, and military operations, etc. Cost effectiveness, availability, and
    multi-point communications are the main advantages of satellite communication.
    Many subsystems are affected by the failure of the satellite. So reliability analysis
    is very important for satellite communication system. With the reliability analysis,
    we can identify the availability, sensitivity, and the failure-free operation
    of the system. In adeveloping or developed country, a telephone is the essential
    part of life. The voice communication in local, national, or international is
    connected with public switched telecommunication network (PSTN). The video conferencing
    is done by using telecommunication network. The wireless communication is a revolution
    in a telecommunication network. Financial transactions, radio communication, etc.,
    are affected by the failure of the telecommunication system. Definition and scope
    of reliability The words reliable and unreliable areused for dependable and undependable
    of the system. The reliable system means failure free operation of the system
    in a given period of time. Reliability affects every device, ranging from small
    transistors to different components of satellite communication system. The main
    aim of reliability is to increase the ability of a system under given operating
    conditions. The reliability of a system is affected by many constraints, such
    as cost factor, economic benefit, operating conditions, etc. Different optimization
    techniques have also been applied in designing the reliable system. Reliability
    is necessary for a successful operation of a system. Generally, the word reliability
    means dependability or repeatability. Reliability of a system is a probability
    of failure-free operation of a system in a given specified period of time. Suppose,
    a person buys an LED bulb and the shopkeeper gives him a 3-year warranty on a
    particular brand, which means this particular brand of LED will provide light
    for 3 years without giving any trouble. Since reliability is a probability, therefore,
    its numerical value lies in between 0 and 1\. If the reliability of a system is
    1, thent he system is operable 100 percent failure-free. Reliability of a system
    at any time ‘t’ can be defined as the ratio of a number of holdovers at any time
    ‘t’ to the initial total numbers of holdovers. Reliability is also defined as
    the science of predicting, analysing, preventing, and mitigating failures over
    time. The main definition of reliability is as follows: Reliability is the probability
    of a device performing its purpose adequately for the period intended under the
    given operating conditions. This definition of reliability covers the 4 main factors,
    as shown in the following screenshot: ![](image-o9rlthai.jpg) Figure 2.1: Factors
    of reliability Probability Probability may be defined as the chance of occurrence
    of an event. Probability is the ratio of favorable outcomes and total possible
    outcomes. The value of probability lies in between 0 and 1\. If the probability
    is zero, then the event is called an impossible event, and if the probability
    is 1, then the event is called a sure event. Suppose the probability of hitting
    a target is 0.3, this means that if a person tries to hit the target 100 times,
    then the target will be hit 30 times. Therefore, taking another example of reliability
    as expressed in probability, we can say that if the reliability of the operation
    of a machine is 0.9, it means the reliability tested under the same condition
    would be satisfactory only 90 times out of 100\. Adequate performance It is the
    second factor of the definition of reliability. The adequate performance means
    the satisfactory performance of a system. For example, production limits of the
    machine are 100 to 105 units per hour; to be specific, if we say the production
    of the machine in the first hour is 104, in the second hour is 105, in the third
    hour is 104, and so on. This shows the adequate performance of the machine. Specified
    time Specified time is the third factor of the definition of reliability. It represents
    the period of satisfactory performance of a system. The production of the machine
    depreciates as the time passes, and at some point of time, the machine fails.
    The duration of satisfactory performance is also known as the duration of the
    adequate performance. Operating conditions The operating conditions or environment
    represents the working environment of the system in which a machine or system
    performs adequately. These conditions are like temperature, humidity, etc. It
    is essential to know the operating conditions, so that the system gives an outstanding
    performance. Significance of the operating conditions are as follows:  The operating
    condition or working environment of the system. The need of safety sides of men
    and system. The degree of uncertainty about the success of the operation and its
    improvements in system performance. Need for efficient, economic, and continuous
    operating system without any disturbances. A system failure raises the question
    in the minds of people regarding its reliability and its further use. Improvement
    in the confidence of the working personnel, particularly in the hazardous area
    because of safety reasons. Reliability measures The approximation or probability
    which confines that system is working as per the given set of instructions, and
    is known as reliability. Reliability The reliability of a system is the probability
    that a system will work properly, that is without any failure for a given period
    of time under given conditions. Mathematically, ReliabilityRel(t) is the probability
    of failure-free operation of the system in the interval 0 to t. If T is the time
    that a failure occurs in the system, then the system will not fail before time
    t. ![](image-8mw45cb3.jpg) Reliability is a function of time and it is a probability,
    therefore the value of reliability lies always in between 0 and 1\. ![](image-xpdil4ax.jpg) The
    unreliability, F(t) of the system is explained as the probability that a system
    is failed by the first failure of the component during the time interval 0 to
    t. The following relationship holds in reliability and unreliability of the system. ![](image-ogv33d59.jpg) In
    other words, the reliability may be calculated as follows, ![](image-p9sqi53k.jpg) Maintainability Maintainability
    is the probability that a failed component is moved on to operable condition in
    a specified time (down time) when the maintenance is performed under given conditions.
    Maintainability is also defined as the probability of down time that a failed
    component is not in operation due to maintenance. Availability Availability is
    an important characteristic used to calculate the performance of repairable systems.
    Availability uses properties of both reliability and maintainability. Availability
    is also a probability that a system is available for a specified period of time
    (up time). The value of availability lies in between 0 and 1 at any time t. ![](image-wr3dpap7.jpg) Availability
    can be classified into three different types, as shown in the following screenshot: ![](image-2enf1gy2.jpg) Figure
    2.2: Types of availability The various types of availability are point availability,
    mean availability, and steady-state availability. Point availability Point availability
    is also known as instantaneous availability. Point availability is the probability
    that a component will be operational at a particular time ‘t’. Point availability
    is same as the reliability function of the operable component at time ‘t’. The
    component will be operable if one of the following criteria holds:  The component
    will be operable from time 0 to t with probabilityRel(t). The component will be
    operable properly till the last repair at time γ, 0 < γ <t_ _="" span="">with
    probability, where f(γ)isthe renewal density function of the component.</t_> So,
    the point availability is defined as follows: ![](image-ckpvq9fg.jpg) Mean availability The
    proportion of time period that a component is available for operation is known
    as mean Mean availability is also known as average uptime availability. Mean availability
    represents the average value of instantaneous availability function over the time
    interval (0, T]. The Mean Availability is explained as follows: ![](image-x0klqkh5.jpg) Steady
    state availability The steady state availability is defined as the limit value
    of instantaneous availability taking time tends to infinity. It is also known
    as long run availability. It reveals the long-term availability after the establishment
    of the system. ![](image-r69fvpic.jpg) The steady state availability is further
    divided into the following three categories: Inherent availability Inherent availability
    is the steady state availability in which we consider the corrective maintenance
    down time of the system. Inherent availability is the probability that a system
    will operate properly under given conditions and support the environment without
    considering any preventive maintenance. The inherent availability can be expressed
    as follows: ![](image-50y5oyb9.jpg) Achieved availability Achieved availability
    is quite similar to inherent availability. In this availability, we include the
    preventive maintenance downtime. Achieved availability is the steady state availability
    in which we consider corrective and preventive downtime of the system. Achieved
    availability can be calculated by using the mean time between maintenance action
    (MTBM) and the mean maintenance downtime (M). It can be expressed asfollows: ![](image-2pin9z5k.jpg) Operational
    availability Operational availability is the real average availability over a
    period of time. It includes all sources of downtime. Operational availability
    is the ratio of uptime and total time. Mathematically, it can be expressed as
    follows: ![](image-kojnme90.jpg) Here, operating cycle represents the overall
    time period and the uptime is the operating time of the system. Mean Time to Failure
    (MTTF) Mean time to failure (MTTF) is the basic and important index of reliability
    indices. It is used for non-repairable items. It is the expected mean time or
    average value of the failures. ![](image-rgvzamsl.jpg) The Mean Time To Failure
    (MTTF) can also be obtained by taking Laplace transform of Rel(t): ![](image-68y4rb6w.jpg) the
    Laplace transform Mean Time to Repair (MTTR) The time used for repairing of a
    failure unit, is known as the Mean Time to Suppose a hardware part of the system
    fails, then MTTR is the mean time to repair the part. Nowadays, most of the companies
    purchase a spare part for replacing the failed part instead of repairing the part. If
    the repair time is exponentially distributed with the parameter μ, then the repair
    density function is defined as follows: ![](image-wy5bpm0p.jpg) The mean time
    to repair time is given as follows: ![](image-wjm96saw.jpg) ![](image-asfc6439.jpg) ![](image-bfcj7x7m.jpg) Thus,
    the MTTR is the reciprocal of repair rate μ. The MTTR is also known as mean down
    time. Mean Time Between Failure (MTBF) Mean time between failures (MTBF) is the
    basic reliability indices for a repairable system. Mean time between failures
    is the expected time between two consecutive failures of the system by assuming
    constant failure rate. In the non-repairable system, the mean time between failures
    is same as mean time to failure. If λisthe constant failure rate, then mean time
    between failures may be defined as follows: ![](image-pu8qv1np.jpg) Thus, the
    mean time between failures is the reciprocal of constant failure rate λ. Mean
    Time Between Maintenance (MTBM) The maintenance policy is very useful for improving
    the life time of the system [9]. Mean time between maintenance (MTBM) is another
    important reliability index. It is calculated when the preventive maintenance
    is used in the system. If preventive maintenance is equal to zero, then mean time
    between maintenance is same as the mean time between failures. If be the availability
    time period of the system keeping in consideration the preventive maintenance,
    then mean time between maintenance can be obtained by taking the mean of the precedingtime
    period. Mathematically, ![](image-ya45mi4r.jpg) Expected profit The risk is a
    very important factor to affect any system. If we have the exact information about
    the failures, then we can decrease the effect of risk and increase the profit.
    Expected profit is also a very important reliability index. Expected profit may
    be defined as the maximum attainable amount after deducting the overall cost. If
    we assume that the service facility is always available, then the expected profit
    during the time interval (0, t] is defined as [10], ![](image-pne94wm0.jpg) represents
    the revenue, is the service cost per unit, and Pup(t) represents the availability
    of the system. Sensitivity Analysis The sensitivity analysis is also known as
    the post optimality analysis. The main goal of the sensitivity analysis is to
    know how sensitive the solution is to the actual situation. The objective of the
    sensitivity analysis is to reduce the additional computation efforts which may
    arise in solving a problem. In many cases, it is not compulsory to solve the problem
    again, only a small amount of calculations applied to the old solution will be
    sufficient. Sensitivity analysis is the testing of the system under uncertainty.
    The extra care is necessary for high sensitive components. Sensitivity analysis
    can also be defined as the partial derivative of the function with respect to
    that factor. These factors are failure rates in the analysis. In reliability theory,
    we can find the sensitivity of reliability and sensitivity of MTTF. We can find
    out the sensitivity of reliability and sensitivity of MTTF by differentiating
    partially the equation of reliability and MTTF withrespect to different failures
    that occurred in the system. Systems The collection of components, subsystems
    arranged in a specified manner, is known as a A system can be completely or partially
    failed due to the failure of its components. In other words, the system is the
    collection of technical or socio-technical components. There are two types of
    systems in reliability theory. Repairable systems Repairable systems are those
    systems which can be re-established or restored by repairing the failure component
    of the system without replacing the overall system. The lifetime of the repairable
    system is the age of the system. The failure rate in the repairable system is
    the rate of occurrence of failures. Non-repairable systems Non-repairable systems
    are those systems which cannot be re-established or restored by repairing the
    failure component of the system. It is discarded when the failure occurs. The
    life time of the non-repairable system is a random variable. The failure rate
    in the non-repairable system is hazard rate of a life-time distribution. Failures
    and Failure modes A failure is the partial or complete loss of the system. Suppose
    a system is in working mode, but suddenly the system completely or partial fails
    due to the failure of a component of the system. There is a necessity to identify
    the main cause of failure of the system for a failure-free operation of the system.
    Based on the nature of the failure, the failures can be categorized into three
    different modes. Many a times, a large number of failures occur at an initial
    stage due to the manufacturing defect of the component of the system. This type
    of failure is known as an initial failure or early failure. Few failures occur
    randomly. This type of failure is categorized as catastrophic failure. After a
    useful life of the system, the failure rate increases due to a decrease in efficiency
    of the component of the system. This type of failure is known as wear-out failure
    [1]. A curve that shows the different modes of the failures, known as bath-tub
    curve, is shown in the following screenshot: ![](image-582xfajq.jpg) Figure 2.3:
    Bath tub curve There are many causes that play a very important role in the failure
    of the system. Some of these are covered in the next sections. Defects in the
    designing of the component The main cause of failure of the system is poor designing
    of the component of the system. Suppose a component of a system is improper in
    shape, using incorrect manufacturing techniques or materials, then it will affect
    the failure-free operation of the system [4]. So, proper designing and improved
    techniques are necessary for a proper utilization of the system. Operating conditions The
    operating conditions represent the conditions that are helpful for the operation
    of the system successfully. The operating conditions are not same for every component.
    The complete knowledge of operating conditions reduces the frequent occurrence
    of the failures. Major Failure A major failure is a failure in which the system
    completely fails. The maintenance time and cost is very high in a major failure.
    It can happen at any time of the operation of the system. The functioning of the
    system is a very time taking process. Minor Failure A minor failure is a failure
    by which the system fails partially. In this type of failure, the system can easily
    restore in functioning condition. Time and cost of the maintenance are very low.
    It can also happen at any time of the operation of the system. Common Cause Failure Common
    cause failure is a failure that occurs by a common fault in the operation of the
    system. Common cause failure is a failure of multiple components with respect
    to any common cause. The poor designing, improper maintenance, manufacturing defects
    in the components of the system etc., are the main factors of common cause failure. Catastrophic
    Failure Catastrophic failure is a failure that occurs due to a natural disaster,
    such as flood, earth quake etc. In this type of failure, the system fails for
    a long period of time. It is very difficult to predict the time of occurrence
    of a failure, so it is also known as a random failure. Human Error Day by day
    automatic techniques are involved in the operation of the system/machine, but
    it is not possible to eliminate the human involvement in the operation of them.
    A human error means an error that’s made by a human. In many situations, a human
    error may be present due to lack of knowledge in the operation of the equipment,
    unskilled worker, careless in working, improper mechanism and so on. It is not
    possible to eliminate all human errors, but we can reduce them by proper selection
    and training of the person [15, 16]. Failure Frequencies In reliability analysis,
    there are mainly three types of failure frequencies. Failure density If a component
    of the system operates at time zero, then the failure density is the probability
    per unit of time that the component gets its first failure at time t. Failure
    rate If a component operates at time zero and survives to time t, then the failure
    rate is the probability per unit time that a component gets failure at time t. Conditional
    Failure Intensity If a component was operating or after repairing it was operating
    from time zero to t, then the conditional failure intensity is defined as the
    probability per unit time that the component gets failure at time t. Maintenance The
    operating period is the most important period in the life cycle of the system.
    Every system is likely to fail since no system is perfect. But the life time of
    the system can be increased by the maintenance of the system. Maintenance Prevention
    is used for increasing the life cycle of the system. The main aim of maintenance
    prevention is to reduce maintenance cost and time. The main objectives of maintenance
    prevention are as follows:  For stable operation, it reduces the time of maintenance. It
    helps in the working of the system efficiently with minimum labor and balanced
    workload. It minimizes the maintenance cost and loss of new equipment. It improves
    the reliability of the system. Methodology used For reliability analysis and prediction,
    various models are used, such as Markov chain and Markov process, Weibull distribution
    and so on. Markov model Markov model is a powerful tool for reliability analysis.
    This model was developed by Andrei Andreyvich Markov. Markov chain and Markov
    process are the two basic Markov analysis methods. Markov chain is used in discrete
    state and discrete time variable, while the Markov process is used in discrete
    state and continuous time models. The Markov model has the following assumptions:  If
    λ is the failure rate, then λ ∆t represents the transitional probability from
