    analysis of Wireless Sensor Networks Using low cost, inexpensive, and untethered
    wireless sensor nodes, the purpose of sensing parameters and events over a region
    has dramatically removed the constraints associated with traditional wired methodologies,
    thus providing a paradigm shift in the approach towards the process of data acquisition.
    These nodes can be left unattended for long period of time, and they have the
    ability to self-organize to form a network, and ensure delivery of sensed information
    or event to each other for collaborative sensing, besides sending the information
    to a centralized data warehouse. Wireless Sensor Networks and data acquisition
    systems A key difference between the usage of Wireless Sensor Networks and the
    traditional data acquisition systems lies in the fact that the traditional systems
    focus on the accuracy of the sensed information at a specific point, while in
    the case of Wireless Sensor Networks, the focus is not on the degree of accuracy
    of the reading, but more on what can be inferred, at a remote location, by using
    a bunch of readings obtained from various low cost, low reliability sensor nodes
    measuring similar data in a given region. ![](image-wb3s9hgi.jpg) Figure 1.10:
    Wireless Sensor Networks (WSN) Therefore, having highly accurate and reliable
    sensors on-board the sensor nodes is not a key requirement in the Wireless Sensor
    nodes. This difference can be explained with the help of the following example. If
    the requirement is to measure the rate of flow of water passing through a pipe
    for the purpose of billing, then a single point reading made by a high accuracy
    sensor mounted on the pipe would be the correct methodology. However, if the requirement
    is to identify whether the soil in a large field is dry, slightly moist, or very
    moist, then one high accuracy sensor would not suffice. Having a large number
    of high accuracy sensors could be a possible solution to this problem; however,
    the solution would be very expensive and probably give much higher accuracy than
    what is needed, since the original requirement was to only identify regions with
    dry, slightly moist, or very moist soil. The solution of this problem could be
    met with reasonable reliability by deploying large number of low costs, low accuracy
    sensor nodes spread over the region, and infer the moistness of soil in the various
    parts of the field by studying the data obtained from these sensors. Thus, utilizing
    Wireless Sensor Network in this problem could actually be a more reasonable and
    realistic solution. The solution could be upgraded by introducing Actuator Nodes
    in the network, which could then control the amount of irrigation in specific
    regions based on the inferred information. However, the requirements in that scenario
    will be more stringent. Constraints of Wireless Sensor Networks The various constraints
    faced by a typical Wireless Sensor Network include the following:  The Wireless
    Sensor Nodes are battery operated, have short-range radios on board along with
    low cost low accuracy sensors, are small sized, and have low computing and memory
    resources. Thus, these nodes are energy constrained, have low computational capability,
    low accuracy of sensing, and are prone to hardware and communication failure. Since
    the nodes may be deployed in areas where they are exposed to harsh vagaries of
    the environment, including exposure to extreme temperatures, humidity, and other
    such physical factors, the probability of a node failure is high. The wireless
    medium itself is prone to irregular and unpredictable behaviour because of issues
    like interference and channel fading. Moreover, since the same medium is being
    used for communication by all the nodes in a network, the probability of loss
    of information because of packet loss and network congestion is high. Methods
    for Wireless Sensor Networks The standard methods adopted by Wireless Sensor Networks
    to get over these constraints are as follows:  Redundancy is introduced in the
    network by deploying significantly larger number of sensor nodes than what are
    actually needed for sensing and eventual reliable estimation and re-construction
    of the sensed event at the sink. This is done to counter the issue of node failure
    and packet loss during communication, since with a larger number of nodes participating,
    the probability of sufficient number of nodes remaining un-affected by the node
    and communication failure for reliable re-construction and estimation of the event
    sensed in the region of deployment is high. The adverse impact on the Network
    life-time because of energy constraint on the nodes is offset to an extent by
    making the nodes go into low power sleep mode when not sensing, thus conserving
    battery life. Mechanism is also introduced to ensure even loading of the nodes
    in a network, so that the overall network life time improves. Evolution of Wireless
    Sensor and Actuator networks Over time, the Wireless Sensor Networks have evolved
    into Wireless Sensor and Actuator Networks (WSAN), which consists of special nodes
    called Actuator nodes besides the typical Wireless Sensor Nodes. The Wireless
    Sensor Nodes perform the task of gathering information about the environment in
    which they are deployed. Additionally, special nodes called Actuator nodes are
    also introduced into the network and have the ability to actuate upon some control
    elements that have an impact on the environment in which the sensor nodes are
    deployed. Actuator Nodes are not energy constrained, have higher computational
    and memory capabilities, better communication capabilities, and are able to actuate
    upon some controllable element. With the introduction of Actuator Nodes into the
    network, the following two network architecture, as shown in the following screenshot,
    are generally observed:  Centralized Decision Making (Semi-Automated) Distributed
    Decision Making (Automated) ![](image-tqv37nay.jpg) Figure 1.11: a) Centralized
    Decision-Making Architecture, and b) Distributed Decision-Making Architecture Centralized
    decision-making architecture In the case of centralized decision-making approach,
    the sensor nodes pass on the sensed information to a centralized sink, where the
    decision on the control action to be taken by the multiple actuators is decided
    based on the gathered information. This information is subsequently passed on
    to the actuators for implementation by the actuators. Distributed decision-making
    architecture In the case of distributed decision-making approach, the sensor nodes
    send the gathered information to specific actuators, who then communicate and
    collaborate among themselves to take decision about the specific control action
    to be performed by each one of them. The second approach is more in tune with
    the actual definition of Wireless Sensor Networks, where the issue of collaborative
    deduction of an event and the response to it is highlighted. Wireless Sensor and
    Actuator Networks are expected to significantly accelerate the acceptability of
    Wireless Data Acquisition and Control systems in applications which are non-real
    time and do not employ very complex control action. However, with the evolution
    of Wireless Sensor and Actuator Networks additional constraints, scientists have
    been thrust upon the reliability of the data acquisition process of the network,
    since the decisions taken for control of actuating action depend upon the data
    acquired by the sensor network. These are as follows:  Since the Actuator Node/s
    are required to take a decision on implementation of the control action, based
    on the estimation or re-construction of the event relying on information delivered
    by the sensor Nodes, it is imperative that the control action is time coherent
    with the circumstances of the environment. This means that the delay between the
    time an event is sensed by the deployed nodes and the time when the action is
    taken by the actuators must be as less as feasible to ensure that the control
    action is not delayed. Thus, an additional constraint is placed on the Network
    Latency Time which becomes critical in the case of WSAN, i.e., the time lag between
    detection of event by a sensor node and the time the same is reported at the sink
    /actuator, TNLT, must be less than the desired Actuation Latency Time of the application. Modes
    of Data Acquisition The prime purpose of deployment of a WSN is to gather information
    about the environment in which it is deployed, and then pass on the collected
    information to the sink, which may be located remotely. The collected information
    is then assessed to estimate or re-construct the events occurring in the deployment
    area. The deployed nodes generally scan and collect information periodically but
    will send the gathered information to the sink depending upon the mode of Data
    Acquisition, which could be one of the following:  Periodic Data In this mode,
    the nodes will not only collect the information periodically, but will also transmit
    the collected information periodically to the sink. The frequency of data sampling
    would generally be much higher than the rate at which the collected information
    is transmitted to the sink. This is because the energy spent by the node on sensing
    and computing is generally significantly less than the energy spent in transmitting
    the information, although there are certain applications where the reverse has
    been found to be true. Event Based Data In this mode, the deployed nodes may scan
    and collect information periodically; however, they will transmit the information
    only when a specific pre-defined event occurs. The network life in this mode tends
    to be significantly higher as compared to Periodic Data Acquisition mode, since
    the nodes will not transmit periodically, thus saving considerable amount of energy.
    This mode is not suitable for applications where periodic updates about the event
    area are needed, e.g., habitat monitoring. Query Based Data In this mode, the
    deployed nodes may scan and collect information periodically; however, they will
    transmit the information only when they are specifically queried about the information.
    In this mode, the sink will initiate a query which will be propagated throughout
    the network, also known as interest propagation. Only those nodes which fulfil
    the criterion of the query will send the information available with them. One
    of the critical aspects of this mode is that the query needs to be propagated
    to all nodes in minimum amount of time, and with consumption of least amount of
    energy. Hybrid Data This mode is a combination of the previously mentioned modes.
    Different sections of the deployed nodes may be using one or more of the previously
    mentioned data acquisition modes. Generally speaking, the event based data acquisition
    mechanism will use the least amount of energy, followed by query-based, and then
    subsequently periodic-data acquisition. Reliable Data Acquisition The concept
    of reliability of data acquisition has been defined in different contexts as discovered
    during the literature survey. The traditional definition of reliability of a system,
    as mentioned in the theory of reliability is as follows: ![](image-e5jrg0xi.jpg) Here,
    λ is the failure rate. This definition indicates that for a given system under
    observation, if the failure rate is constant, then the reliability of the system
    will reduce with time in an exponential manner. Here, the constant failure rate
    means the average failure rate observed over a period of time. The traditional
    definition is valid in context of a Wireless Sensor Network, even though Wireless
    Sensor Network is a virtual entity composed of widely distributed physical sub-entities
    called Sensor Nodes. These nodes are not physically joined to each other; however,
    they are able to communicate and share information among themselves to collaboratively
    perform the task of sensing or detecting in the environment where they are deployed,
    and thus act as a system. In a Wireless Sensor Network, this definition of reliability
    can be observed in different contexts, as mentioned in the following screenshot: ![](image-dpsggysc.jpg) Figure
    1.12: Reliability context in WSN  In context of physical failure of nodes: If
    the rate of failure of nodes in a Wireless Sensor Network is constant, due to
    physical damage or draining out of the battery, then the reliability of the network
    to perform the assigned task of collecting information or detecting events in
    the environment of deployment, will decline exponentially with time. The validity
    of this statement is easily verified, since it is clear that as the nodes in a
    network die, the ability of the network to acquire information about the environment,
    in which it is deployed, drops significantly, since the number of sensing points
    reduce and the probability of missing out on the detection of an event increases.
    Thus, the Reliability of Coverage (or Sensing) will reduce exponentially as more
    nodes keep on failing on a regular basis. In context of failure of nodes to communicate: The
    medium of communication in a WSN is highly un-predictive and its characteristics
    and behaviour change constantly. This has an obvious impact on the ability of
    the nodes to communicate with each other and share the information collected,
    which is an issue at the core of the existence of the Wireless Sensor Network.
    As more and more nodes fail to communicate with each other, the ability of the
    network to pass on the acquired information to the sink reduces thus. This lack
    of ability to pass on the information collected by the nodes to the sink is reflected
    in a parameter called Packet Delivery Ratio [95], which is measured as follows: ![](image-vptxjurc.jpg) As
    the Packet Delivery Ratio of a Wireless Sensor Network drops constantly, the Reliability
    of Delivery of sensed information degrades exponentially. In context of lack of
    security of data communication among nodes: As the nodes are using the wireless
    medium for communication among them, the information transmitted by them in an
    open medium leaves the possibility of the transmitted information being intercepted
    by unauthorised or rouge nodes, which may ingratiate themselves into the network.
    This could have an adverse impact on the performance of the network as the information
    could be misused. Further, these rogue nodes may start feeding false information
    to the nodes or may even take control of the nodes within the network. If more
    and more nodes in the WSN get compromised, then the Reliability of Secure Data
    Exchange in the network will degrade exponentially. As can be seen, the definition
    of reliability could have different connotation in a Wireless Sensor Network. Another
    important parameter defined in the traditional theory of reliability is Availability
    of the system, which is defined as follows: ![](image-hl23cm72.jpg) Here, MTBF
    is Mean Time Between Failures and MTTR is Mean Time To Repair. ![](image-gq1dlts3.jpg) Figure
    1.13: Categorization and Definition of Reliability This parameter, also known
    as Operational is an indicator of the overall reliability of the system, as it
    indicates the probability that the system will be available to perform the assigned
    task at any given time. In context of Wireless Sensor Networks, availability may
    be seen in context with the service that the WSN is expected to provide, that
    is, sensing information or detecting a specific event, and then ensuring that
    the information gathered is successfully passed on to the sink, where subsequent
    action pertaining to the gathered information can be taken. If the WSN is unable
    to provide satisfactorily the task of gathering and passing on the information,
    then the network could be called as being un-available, or it could be stated
    that the Availability of the network is low. The non-availability of a network
    can be primarily because of the fact that large number of sensor nodes comprising
    the network may have failed due to physical failure or draining out of their battery.
    Thus, a network with long Network Lifetime would have higher Availability as compared
    to a network with low network life-time. The non-availability of the network could
    also be attributed to lack of ability of the WSN to deliver satisfactorily the
    service that it is expected to provide. Thus, if a Wireless Sensor Network is
    able to provide Reliable and satisfactory service, despite failure of some sensor
    nodes, the availability of the Wireless Sensor Network will be high. Within the
    Wireless Sensor Network, on a micro-level, Availability could also be construed
    as the availability of a neighbour of a sensor node for forwarding the information
    gathered towards the sink. Specific form of reliability required may change from
    application to application. Since the primary reason for deploying a Wireless
    Sensor Network is to sense information or detect event within the deployment zone
    remotely, and then be able to pass on this information to the sink for estimation
    and reconstruction at the sink, the Sink Reliability of Data Acquisition then
    becomes an important parameter which encompasses the various definitions of reliability
    and availability associated with a Wireless Sensor Network. From the perspective
    of the Sink, Reliable Data Acquisition could be defined as the ability of the
    Wireless Sensor Network to ensure delivery of sufficient amount of the gathered
    information by the deployed sensor nodes to the sink, for it to be able to faithfully
    and successfully re-construct the event sensed and detected by the nodes. This
    will further include the availability of the data acquisition service being provided
    by the network, for as long as possible without compromising on the ability of
    the centralized sink to faithfully re-construct the event sensed by it. Reliability
    also includes the ability of the network to be tolerant to faults, within a limit,
    without compromising on the basic issue as mentioned earlier. Issues in reliable
    data acquisition There are a few issues which are different in the case of a WSAN,
    and which have an impact on the definition of Reliable Data Acquisition. In the
    case of a Wireless Sensor and Actuator Network, the possibility of Distributed
    Decision making also exists, which requires that the data sensed by the deployed
    nodes should be sent to the closest Actuator rather than a centralized sink, therefore
    mechanism for this to happen reliably must exist. Further in the case of a WSAN,
    there is a time constraint on the Network Latency Time that is, the time difference
    between the sensing of information by the deployed node and the time at which
    the sensed information is received at the Centralized sink or the Actuator. This
    time constraint, although application specific, exists to ensure that the action
    taken by the actuators is in coherence with the sensing done by the deployed nodes,
    and the control action is not erratic and un-stable. Therefore, in context of
    a Wireless Sensor and Actuator Network, Reliable Data acquisition refers to the
    ability of the Wireless Sensor and Actuator Network to ensure delivery of sufficient
    amount of the gathered information by the deployed sensor nodes, in a time-bound
    and coherent manner to the centralized sink for it to be able to faithfully and
    successfully re-construct the event, and take necessary action in time. Coherent
    manner indicates that the sequence of delivery of data at the sink/actuator is
    in the same sequence in which the data is generated at the sensor nodes, that
    is, the sequence in which the nodes detect the occurrence of the event. Reliability
    further includes the availability of the data acquisition service being provided
    by the network for as long as possible, without compromising on the ability of
    the centralized sink to faithfully re-construct the event sensed by it. Reliability
    also includes the ability of the network to be tolerant to faults, within a limit,
    without compromising on the basic issue as mentioned earlier. Application areas
    of reliability Reliability has the vast area of applications starting from small
    toy to satellite. The application area of reliability is as follows:  Mechanical
    reliability Software reliability Electronics reliability Structural reliability Robot
    reliability and safety Power system reliability Mechanical reliability includes
    critical health assessment of mechanical components such as shafts, bearings,
    gear, and sliders, etc. The software reliability targets failure-free software
    operation for a specified time period. The structural reliability is concerned
    with the reliability of engineering structures, in particular civil engineering,
    whereas robotics reliability assures the successful operation of robots in confined
    environment. Conclusion This chapter highlights the need of reliability in the
    electrical and electronic systems for the successful operation under various conditions
    of environment and electrical parameters. Different types of evaluation parameters
    of reliability analysis are discussed in this chapter. The application area of
    reliability is highlighted in this chapter, along with the basic reliability issues
    such as data acquisition and data prediction etc. In next chapter, the various
    methods Markov model, Weibull distribution and so on, are discussed. Questions  What
