    variable technique Supplementary variable technique was first introduced by D.
    R. Cox in 1955\. This technique is used for the modelling of a system that contains
    constant failure rates and non-exponentially distribution repair rate. The construction
    of modelling is done by Markov process and supplementary variable technique. This
    technique provides a systematic solution for finding reliability and availability
    of the system. If the failure and repair rates are a function of time, then the
    system is non-Markovian. For converting the non-Markovian system into the Markovian
    system, we introduce some variables which are known as supplementary variables.
    By using these variables and using the Markov process, one can obtain the different
    transitional states’ probability of the different states. Laplace Transformation Laplace
