    accesses the health condition of the component based on the output response. Figure
    3.5 illustrates the estimation methods which can be used in predicting the failure
    of components. Mathematical model Mathematical model is an abstract model that
    uses mathematical language to describe the behaviour of system. Mathematical model
    may be represented using analytical, statistical, or numerical form of variables
    and response. Failure predicted of an electrolytic capacitor is explored using
    the mathematical model. Electrolytic capacitor An electrolytic capacitor is a
    type of passive component which uses an electrolyte to achieve larger capacitance
    than other types of capacitors. It is extensively used in manufacturing and design
    industries. The electrolytic capacitor is widely used due to its low cost and
    small size. ![](image-h8jhfmx8.jpg) Figure 3.6: An aluminum electrolytic capacitor
    (Image credit: To analyse the failure and behaviour of electrolytic capacitor,
    a fishbone diagram is represented in the following screenshot. It explores the
    cause of failure and effect on the behaviour of electrolytic capacitor. ![](image-a3ea9mbt.jpg) Figure
    3.7: Fishbone diagram of an electrolytic capacitor Furthermore, this cause and
    effect diagram explains the different parameters that can degrade the performance,
    as well as life of an electrolytic capacitor[2]. The failure of an electrolytic
    capacitor is detected, if there is significant change in capacitance, weight or
    ESR value. Literature shows that temperature, voltage, ripple current, and ESR
    parameters change the lifetime of the capacitor. The thorough study of variable
    input and output parameters is conducted to carry out health prognostics and condition
    monitoring of capacitor. After exploring, it is concluded that humidity is also
    an important variable which affects the performance of capacitor, along with other
    factors, such as temperature, voltage, ripple current and ESR. Behaviour analysis
    of electrolytic capacitor During design and manufacturing phase of an electronic
    component, its lifetime is explored at different operating conditions and a datasheet
    is prepared, which claims maximum rating parameters, as well as the lifetime of
    that specific component. But after releasing the component to the market, it may
    be put on off-shelf or installed on a critical environmental condition such as
    military or satellite applications. In such type of applications, the input parameters
    may vary on an accelerated pace. Due to severe operating conditions, the performance
    may deteriorate and simultaneously the lifetime may change as compared to the
    lifetime as claimed by datasheet. So, while designing mathematical model of electrolytic
    capacitor, input parameters are taken as temperature, voltage, current, ESR, as
    well as humidity and output parameters are residual lifetime, which indicates
    the failure time. The relation between input and output parameters are explored
    using mathematical relation. Effect of temperature on lifetime of capacitor Changes
    in temperature around the capacitor affect the value of the capacitance because
    of changes in the dielectric properties. If the air or surrounding temperature
    becomes too hot or too cold, the capacitance value of the capacitor may change
    so much as to affect the correct operation of the circuit. Generally, for electrolytic
    capacitors and especially aluminum electrolytic capacitor, at high temperatures,
    the electrolyte may be lost due to evaporation, and the body of the capacitors
    may become deformed due to the internal pressure and leak outright. Also, electrolytic
    capacitors cannot be used at low temperatures, below about -10°C, as the electrolyte
    jelly freezes [3]. Due to the property of electrolyte used, the capacitance can
    significantly decrease and ESR can increase, with rise in temperature. The reason
    is increase in viscosity and resistance of electrolyte induced from reduced ionic
    mobility. Operating conditions directly affect the life of an aluminium electrolytic
    capacitor. The ambient temperature has the largest effect on life. The relationship
    between life and temperature follows a chemical reaction formula called Arrhenius’
    Law of Chemical Activity. Simply put, the law says that life of a capacitor doubles
    for every 10 degree Celsius decrease in temperature (within limits) [4]. During
    operation, the electrolytic capacitors’ temperature rises above ambient temperature.
    In the steady state, the applied electrical power matches the heat power dissipated
    to the ambient [5]. The main cooling mechanisms for electrolytic capacitors are
    radiation and convection. Heat conduction is usually very small. The capability
    to radiate heat depends on the electrolytic capacitors surface material. The contribution
    of convection to the total cooling effect can be improved by forced cooling [6]. Effect
    of voltage on lifetime of electrolytic capacitor When the voltage is increased,
    it will accelerate the chemical reactions. The dielectric starts to form and leakage
    current starts increasing. As the leakage current enhances, it will automatically
    increase the temperature, which further cause the electrolytic capacitor to fail. Effect
    of ripple current on lifetime of electrolytic capacitor Due to larger value of
    tan δ in electrolytic capacitor as compared to other capacitors, the internal
    heat produced by capacitor is much more than other capacitors. The heat will significantly
    increase the temperature, and life may be affected. So, by considering the ripple
    current acceleration factor, the deviation in lifetime of an electrolytic capacitor
    is estimated. Compared with other types of capacitors, aluminum electrolytic capacitors
    have higher tan δ, and therefore are subject to greater internal heat generation
    when ripple currents exist. To assure the capacitor’s life, the maximum permissible
    ripple current of the product is specified. When ripple current flows through
    the capacitor, heat is generated by the power dissipated in the capacitor, accompanied
    by a temperature increase. Internal heating produced by ripple currents can be
    represented by the following formula: ![](image-aiccxqr9.jpg) Here, W is internal
    power loss; Ir is ripple current; is internal resistance (Equivalent Series Resistance);
    V is applied voltage, and is leakage current. Leakage currents at the maximum
    allowable operating temperature may be 5 to 10 times higher than the values measured
    at 20°C, but as compared to Ir, is very small and negligible. Effect of ESR on
    lifetime of electrolytic capacitor All the capacitors, which have ESR, that is,
    internal resistance in series with capacitance, depend on the construction and
    dielectric material of capacitor, which is further more connected with reliability
    and residual lifetime of the capacitor. The ESR value is further associated with
    reduced efficiency and power loss. As the temperature increases, the ESR value
    also increases. So, ESR and temperature is directly proportional to each other.
    When the electrolyte decreases or connection is not proper, the value of ESR increases. ![](image-cz2fe6s7.jpg) Figure
    3.8: ESR representation of capacitor ![](image-mxp40fs5.jpg) Here, is dissipation
    factor, is leakage losses, and is dielectric losses. ![](image-o1uqz2x4.jpg) Here,
    with increase in the value of frequency, the ESR value also increases simultaneously. Effect
    of humidity on lifetime of electrolytic capacitor The humidity is a critical factor
    for deciding the residual life or remaining useful life of the capacitor or any
    other electronic component. An increase in the humidity causes the electrolytic
    corrosion, which in turn reduces the value of capacitance. As per Peck’s law,
    if the capacitor works on degraded or enhanced value of humidity, the life of
    capacitor reduces exponentially. Mathematical modelling of electrolytic capacitor Mathematical
    or analytical model of an electrolytic capacitor is a representation of the capacitor’s
    behaviour in terms of numerical or statistical equations[14]. These models analyses
    the acceleration factor, a constant multiplier for different stress levels. Then
    the effect of this stress level acceleration factor is studied on the life, as
    claimed by datasheet. Considering all the electrical and environmental influencing
    parameters, the expected life has been calculated using mathematical modelling. Consider
    the case of an electrolytic capacitor, which is affected by various influencing
    parameters, as shown in Figure To explore its expected lifetime under applied
    conditions, its behaviour is analysed for all influencing inputs, that is, temperature,
    voltage, current, ESR, and humidity, and acceleration factors are considered. ![](image-pkqpyj17.jpg) Figure
    3.9: Mathematical modelling of an electrolytic capacitor Let’s assume the following: Lifetime
    claimed by manufacturer, as per datasheet = Lifetime (D) Lifetime expected under
