    or is faulty during the experimental process? If the failure in time for the capacitor
    is hours, then calculate the MTBF and the MTTR?CHAPTER 6 Experimental Testing
    of Active and Passive Components When a manufacturer releases a component in the
    market, a datasheet is provided along with it. The datasheet has all the input
    parameters with a specified range, as well as the performance parameters of the
    component. But, when it is used in a real life application, the environmental
    conditions may vary, which can break down the component, and automatically shut
    down the complete system. Structure In this chapter, we will discuss the following
    topics:  Reliability analysis of the active and passive components Accelerated
    life testing Calculation of FIT, MTBF and reliability Experimental setup Environmental
    conditions for the experiment Objectives After studying this chapter, the students
    should be able to understand the need for reliability prediction in active and
    passive components, learn about the experimental technique for the reliability
    production, and know the step-wise procedure and the experimental details for
    the failure prediction. Accuracy estimation and error analysis With the rapid
    evolution of the electronics device technology towards low cost and high performance,
    the electronics products become more complex, higher in density and speed, and
    lighter for easy portability. The electronic packaging engineers are integrating
    more and more chips and parts into the assembly. As the electronics industry has
    enhanced towards the miniaturization and increasing functionality, the use of
    green materials, and the trends toward the heterogeneous systems based on the
    system in chip system in package or system on package has also increased. In today’s
    competitive market, all the manufacturers need to increase performance and reduce
    the cost of their products, so that the customers get more attracted towards their
    products. The growing system complexity demands robust control to mitigate the
    system control and disturbances. The reliability aspects are of extreme importance
    for the assembly and packaging, which has become a limiting factor for both the
    cost and the performance of the electronic systems. As an electronic component
    or device is implanted in the real world applications, several factors affect
    its performance, as well as reliability. The failure prediction or the residual
    life estimation becomes a mandatory aspect for the successful operation of the
    electronic component or device. The lifetime claimed by the manufacturer, as per
    the datasheet can be varied, depending on the environmental conditions and the
    electrical parameters. Sometimes, these components or devices are quite often
    discarded without being used it to its full potential. Such discarded components
    are found to have some remaining useful life left. Considering these aspects,
    here an attempt is being made to assess the reuse potential of the used components.
    Predicting the remaining useful life is a step toward identifying the reuse potential.
    The following steps play a vital role in the assessment of the remaining useful
    life of the electronic component:  The methodology used to arrive at the reuse
    potential of the electronic component, The simplicity of the methodologies/techniques
    used for the analysis, and The capability of the models developed for an accurate
    prediction. With this end in view, here, a comprehensive methodology is developed
    for the failure prediction, which is based on the residual lifetime left, for
    a specific component or device. In order to operate the electronic device efficiently
    and fault free, the reliability of that component is calculated in the elevated
    environmental conditions, so that the user can be warned well before the end of
    life of the component. ![](image-02wkrdwq.jpg) Figure 6.1: Reliability Testing
    of Electronic Components The mean time between failure (MTBF) is calculated using
    the number of failed components with respect to the time and total number of components,
    as per the following equation (i): ![](image-m53fk3ic.jpg) The mean time to failure
    (MTTF) can be calculated using the following equation (ii), which interrelates
    the total number of components and the time taken by the whole experimental process. ![](image-j71ngcg5.jpg) The
    failure rate and the mean time to failure have an inverse relationship, as per
    the following equation (iii): ![](image-vcivovd6.jpg) The reliability can be calculated
    further, by considering the number of failures and the total experimental time.
    It is calculated as per the following equation (iv): ![](image-bmwp7unn.jpg) The
    reliability of the components tells the consistency of the performance of the
    previously said component in an elevated thermal environment. Evaluation of the
    reliability of the humidity sensor DHT11 The humidity sensor is used in various
    applications, for example, the lie detector, soil or dew measurement, the environmental
    condition monitoring etc. In this practical, a DHT11 is used as a humidity sensor.
    The reliability of the humidity sensor DHT11 is measured using the accelerated
    life testing. In the accelerated life testing, the stress parameters are kept
    more than the range specified in the datasheet, and the number of failures in
    a specified time period is observed. The DHT11 and the digital hot plate are shown
    in the following figure 6.2(a) and figure 6.2(b) for reference. ![](image-4f1bahp5.jpg) Figure
    6.2: (a) DHT11 Humidity Sensor (b) Digital hot plate The mean time between failure
    (MTBF) is calculated using the number of failed components with respect to time
    and the total number of components. The reliability of the components tells the
    consistency of the performance of the previously said component in an elevated
    thermal environment. Procedure for the experimental testing of the humidity sensor The
    following steps should be followed, with the prescribed precautions to analyse
    the reliability and assess the remaining useful lifetime of the components:  Choose
    the 100-150 samples of the humidity sensor DHT11\. Verify whether all the components
    are working properly. Explore the datasheet of DHT11 and the stress parameters.
    Observe the minimum and maximum range of the previously said component as specified
    in the datasheet given by the manufacturer, 0-50-degree Celsius in case of DHT11. Take
    the digital hot plate, which displays the temperature and note the time using
    a stop watch. Cover all the components with sand so that uniform heating can be
    provided and then put them on the hot plate. Start the digital hot plate. Set
    the initial temperature as 0 degree Celsius and maximum temperature range as 60
    degree Celsius. Augment the temperature in steps of 5-degree increase. Keep on
    verifying whether the components are working or not with the help of a multimeter. Note
    down the number of failed components and the time duration. Complete the process,
    then again note down the total time taken by the experimental process and the
    total number of failed components and the accurate ones. Find out the MTBF, MTTF,
    Failure rate, and the Reliability as per the equation (i-iv). Draw the graph between
    MTBF and Reliability. Evaluation of the reliability of temperature sensor LM35 The
