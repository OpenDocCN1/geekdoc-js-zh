    1 Reliability Fundamentals Introduction The reliability theory was introduced
    during the World War II, and it plays a critical role in systems design and development.
    A valuable contribution was made to the development of the theory of reliability
    by the mathematicians like Gnedenkov, Belgayev, Solovyeu, Polovoko, Barlow, and
    Proschan. Structure In this chapter, we will discuss the following topics:  Importance
    of reliability and life analysis Faults and failures Various configuration of
    reliability system Series, parallel, and hybrid arrangement Reliable data acquisition
    in wireless sensor networks Objectives After studying this chapter, students should
    be able to understand the basic concepts of reliability, application area, and
    its performance parameters. The need of reliability for electrical and electronics
    components and devices is specified in this chapter. It would help the students
    to differentiate between faults, defects, and failures. The fundamental techniques
    and methods for reliability assessment and condition monitoring are discussed. Reliability In
    the modern era of integration, millions of transistors and other electronic components
    are connected on a single chip. As the number of devices enhance, reliability
    and validity become a challenging and critical issue. In a series connection,
    if any one of the components fails or degrades its performance, the complete system
    shuts down immediately. So, reliability analysis of all the individual components
    are equally important and necessary for the long term quality performance of the
    complete device or system. The efficiency of the system which is performing a
    specific task, is described by the terms such as reliability, survivability. Reliability
    means the ability of the system to perform its intended function satisfactorily.
    The term reliability was defined by the Advisory Group on Reliability of Electronic
    Equipment as the "probability of a product performing its intended function satisfactorily
    under given condition for a specified period of The reliability evaluation techniques
    were adopted mostly in military applications and aerospace industry for the improvement
    of quality. The improvement of the effectiveness of components of various kinds
    has received special attention concerning with numerous problems because of the
    advanced technology. Sometimes effectiveness is also referred to as quality in
    literature. The concept of survivability is understood as the ability of the system
    to preserve the properties to serve its purpose under adverse conditions (viz,
    explosions, fine, inundation, and so on). The reliability of a system was determined
    by the properties of the system, namely, trouble proofness, reparability, and
    longevity. Trouble proofness is the property of a system to preserve its capability
    in the duration of a definite time under normal conditions. The prevention, detection,
    and elimination of failure are useful for improvement of the system that is called
    Longevity is the ability for a prolonged operation with the necessary technical
    maintenance including various kinds of repairs. Maintainability is defined as
    the probability that failed equipment is restored to operable condition in a specified
    time (known as down time). Availability is the measure of performance of repairable
    equipment. It is the combination of reliability and maintainability. Failure The
    word failure plays an important role in the context of reliability theory. The
    term failure is defined as the termination of the ability of an item to perform
    its intended function. The notion of failure is a useful characteristic of reliability
    analysis because it is mainly responsible for various numerical criteria of reliability
    analysis. Failures are classified into the following different ways – inherent
    weakness failure, sudden failure, gradual failure, catastrophic failure, and degradation
    failure. Some of the causes for failures of component in the system are poor designing
    of the components, lack of experience, poor maintenance policies, wrong manufacturing
    techniques, and human errors. Role of probability laws in reliability theory The
    reliability analysis of a system is based precisely on defined concepts like reliability
    function R (t), expected life E (T), hazard function h (t) and failure rate λ
    (t). A population of identical systems, which operate under identical conditions,
    fail at different duration of times and the failure phenomenon can only be described
    in probability terms. Thus, the reliability definition is based on the concept
    of probability theory. In practice, reliability evaluation is associated with
    some parameters which are described by probability distributions. The most useful
    continuous distributions in the theory of reliability are the exponential, weibull,
    gamma, normal, and log normal distributions, and the two most important discrete
    distributions are binomial and poisson. Hazard rate In the reliability theory,
    identifying failure model is an art. The concept of hazard rate is effectively
    used in reliability analysis to identify the failure distributions. For instance,
    if the hazard rate is more or less constant, then it would represent that time
    to failure follows exponential distribution. The exponential distribution is widely
    used in the theory of reliability. On the other hand, it is interesting to note
    that exponential distribution would arise as a particular case of weibull and
    gamma distributions which are most commonly used in life testing and reliability
    estimation. Weibull distribution Weibull distribution was named after the Swedish
    scientist Weibull, who proposed it for the first time in 1939 in connection with
    his studies on strength of materials. Weibull established that the distribution
    is also useful in describing the aging effect or wear-out failures KAO, proposing
    it as a failure model for vacuum tube failures, and Leiblin and Zelen used it
    for ball bearing failures. Mann et al has shown the number of situations where
    this model is applicable for other types of failure data. Normal distribution
    is also applicable as a failure model in the context of reliability. Davis observed
    that the failure data is fit to normal distribution in the case of incandescent
    lamps; Bozavsky also described the use of the normal distribution in reliability
    problems. Some important measures related to reliability analysis Reliability
    measures quantify the effectiveness of the system. In the reliability theory,
    some of the important measures are covered in the next sections. Probability of
    survival The probability of failure is similar to that of probability of The probability
    of survival is defined as the probability of a system operating without failure
    for a required period of time Y, and is given by the following formula: ![](image-c8yjud4o.jpg) Here,
    T is a random variable representing time to failure of the system, F (t) indicates
    the probability of the system failing by the time Y, and is defined as failure
    distribution. Mean Time Between Failures [E(T)] The definition of Mean Time Between
    Failure is the average time taken between any two failures of system. This is
    usually the mathematical expected value of time to failure of the system. ![](image-jo0ywhcq.jpg) Here,
    f(t) and R(t) are the failure density and reliability function respectively. Failure
    rate or Hazard rate The rate at which a failure will occur in a certain interval
    of time (t1 and t2) is defined as the failure rate during that interval. It is
    defined as the probability of a failure per unit time, given that the failure
    has not occurred prior to time point V, the beginning of the interval. Therefore,
    the failure rate is given by the following formula: ![](image-vgzb6xr0.jpg) The
    preceding expression in the interval (t, t + dt) and can be written in the following
    way: ![](image-887kpdou.jpg) Hazard function [h(t)] The hazard function [h (t)]
    is defined as the limiting value of the failure rate when the length of Interval
    approaches zero. Therefore, hazard function is defined as the instantaneous failure
    rate. ![](image-czoap75b.jpg) Therefore, h(t) dt is the probability that a component
    of age ''t'' fails in the interval of time (t, t + dt). Failure density function
    [f(t)] Failure density function can be expressed in terms of hazard function and
    reliability function. The hazard function and reliability function are related
    to each other. The hazard function can be rewritten as follows: ![](image-1b20bfta.jpg) Therefore,
    the failure density function f(t) is defined as follows: ![](image-4f079o2g.jpg) Problem
    statement 1 Consider a case of closed chamber humidity sensing device. What was
    the failure rate of individual parts, if the base failure rate is given as 0.033
    failures per hour, stress factor (environment) is 0.92, and quality factor is
    0.98? Solution: The failure rate of the closed chamber can be calculated as follows: ![](image-yd52g5tf.jpg) Configuration
    in the context of reliability analysis The reliability factor or the probability
    of failure of the system is to be determined, but it is very difficult to analyse
    such a system in its entirety. In practice, the system is decomposing it into
    subsystems or units and elements, whose individual reliability factors can be
    estimated. These subsystems and elements are connected to constitute the given
    system, the combinatorial rules of probability are applied to obtain the system
