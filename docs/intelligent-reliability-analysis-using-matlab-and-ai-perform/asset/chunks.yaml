    of input variables using the “Edit” menu. In the edit menu, go to the “Add variable”
    and then select the “input or output” according to the number of inputs and output: ![](image-c193baq4.jpg) Figure
    7.18: Adding input functions using fuzzy edit window in MATLAB The selected number
    of inputs will be available on the FIS editor window. Rename the inputs by changing
    the name in the dialog box beyond the “Name” that is shown in the following Fuzzy
    structure: ![](image-270fv9bl.jpg) Figure 7.19: Changing input functions names
    using the fuzzy edit window in MATLAB. In the same way, name of another input
    and output can be changed. ![](image-sq9eiy9s.jpg) Figure 7.20: Fuzzy edit window
    showing output parameter in MATLAB In the next step, the input and the output
    data are loaded in the input and output variables in the form of linguistic variables
    by selecting the particular variable. The variable will be selected by double
    clicking that particular variable and the membership function editor window will
    get opened: ![](image-y3vws5hk.jpg) Figure 7.21: Membership functions edit window The
    membership function can be of any type, such as triangular, Gaussian, or trap
    etc., and one of all these types will be selected according to the range of loaded
    data. The name of the membership functions can also be changed using the “Add
    MFs” from the edit menu. ![](image-b7levsxs.jpg) Figure 7.22: Adding membership
    functions using membership functions’ edit window in MATLAB The name and range
    of the membership functions are changed by selecting each of the membership function.
    The range of the input variables is also changed by editing the range in the edit
    box named as “Range”, as shown in the following figure: ![](image-x6hia33m.jpg) Figure
    7.23: Modifying membership functions using the membership functions’ edit window
    in MATLAB In the same way, the range and name of the membership functions of all
    the inputs and output will be changed as per the range of data. After editing
    all the input and output variables, the rules are defined using the edit menu,
    and then the rules: ![](image-wppn24rh.jpg) Figure 7.24: Rules window in MATLAB A
    rule editor window gets opened after selecting the rules by pressing on the right
    click: ![](image-8uldl7zd.jpg) Figure 7.25: Define rules using rules edit window
    in MATLAB The rules are defined for each combination of inputs with the output,
    such as when both the inputs (time and temperature) are at a lower range, the
    output (life) will be high. ![](image-hh733vu9.jpg) Figure 7.26: Adding another
    rule using rule edit window in MATLAB Similarly, the rules will be defined for
    every combination of the inputs and output, such as if the input has 3 membership
    functions – low, medium, and high – and if the output also has 3 membership functions,
    the 3*3 = 9 rules will be formed. Once all the rules are defined, the output is
    verified by viewing the rule viewer using the view menu and then by selecting
    “Rules”: ![](image-83kbrgsi.jpg) Figure 7.27: View rule using view window in MATLAB The
    rule viewer window gets opened and from this window, the output is obtained by
    giving the input data ranges in the input dialog box: ![](image-5nxiydtm.jpg) Figure
    7.28: Rule viewer window in MATLAB  Reliability Assessment Using Adaptive Neuro
    Fuzzy Inference System (ANFIS) Let us take a case of an electrolytic capacitor,
    where there are five input parameters, and a single output parameter. An expert
    system is designed using ANFIS as per the following steps:  Open MATLAB and ANFIS
    window by command anfisedit. On the right side, the workspace is there. Right
    click---new----name:  Double click – open excel Copy paste own data ![](image-fsg7ll18.jpg) Figure
    7.29: Function window in MATLAB ![](image-kk3er1bo.jpg) Figure 7.30: Edit input
    window in the workspace (MATLAB) Close it.  After writing >>anfisedit ![](image-9wrkvavp.jpg) Figure
    7.31: ANFIS edit window in MATLAB LOAD data—training—wrksp—click on load data: ![](image-7ghuqioz.jpg) Figure
    7.32: Load training data in ANFIS editor window (MATLAB) Generate FIS:  Select
    membership function—gaussian MF type—linear ![](image-o209h8hf.jpg) Figure 7.33:
    Select MF type in ANFIS editor window (MATLAB) Train now—epochs-50: ![](image-gqhxbugc.jpg) Figure
    7.34: Select epochs in ANFIS editor window (MATLAB) Test FIS: ![](image-9raeaesq.jpg) Figure
    7.35: Training window in the ANFIS editor window (MATLAB) Click on Structure: ![](image-tfj3sbv7.jpg) Figure
    7.36: Structure window in ANFIS editor window (MATLAB) Edit—FIS editor (to change
    the name and range): ![](image-5smxx874.jpg) Figure 7.37: Edit FIS in ANFIS editor
    window (MATLAB) Edit—membership function: ![](image-7nahr1as.jpg) Figure 7.38:
    Edit FIS data (MF) in ANFIS editor window (MATLAB) Edit—rules: ![](image-4x9wshb8.jpg) Figure
    7.39: Rule edit in ANFIS editor window (MATLAB) View—surface: ![](image-2muwyidd.jpg) Figure
    7.40: Surface viewer in ANFIS editor window (MATLAB) View-rule (for output values): ![](image-r1ajb9w7.jpg) Figure
    7.41: Rule viewer in ANFIS editor window (MATLAB)  You can get the new output
    by changing the input. Conclusion In this chapter, the step wise use of the MATLAB
    tool for ANN, Fuzzy, and ANFIS are depicted in detail. The case study of an electrolytic
    capacitor is elaborated with the help of the MATLAB tool. The step wise process
    for the health prognostics of an electrolytic capacitor, using the artificial
    neural networks, fuzzy logic, and adaptive neuro fuzzy inference system, is discussed
    with the help of the MATLAB. Questions  How to the design rules in a fuzzy logic
    system? What is the importance of a linguistic variable? How are the ANN and ANFIS
    co-related? What is the difference between the ANN, FL, and ANFIS? Which tool
    is used for the intelligent modelling? What are the commands for opening the ANN,
