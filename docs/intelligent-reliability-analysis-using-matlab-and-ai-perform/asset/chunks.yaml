    the real/operating conditions of use. Hence, these operating conditions must be
    taken into account while determining the total life and consumed life of the cutting
    tool. A methodology is proposed for failure estimation under different operating
    conditions. The total residual life of the component is determined using different
    techniques for a set of operating conditions. In the proposed methodology, statistical
    techniques like regression, machine learning techniques like Artificial Neural
    Network (ANN), Fuzzy logic, and Adaptive Neuro-Fuzzy Inference System (ANFIS)
    are used for predicting the residual life of the electronic components. The prediction
