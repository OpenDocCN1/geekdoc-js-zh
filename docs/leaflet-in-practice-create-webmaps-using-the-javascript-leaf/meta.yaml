    \ languages such as R and Python, JavaScript also uses the `for` loop to iterate\
    \ over items. In our case, and remembering that indexing in arrays begins from\
    \ 0, the marker popups will read the latitudes and longitudes which are at index\
    \ 1 and 2 respectively. The lat-lon are indicated by (`[branches[i][1], branches[i][2]]`).\
    \ The popup strings, which appear as the first elements in the `branches` array,\
