    \ assuming you had already created `main.js` already, (if not, create one now),\
    \ insert the following code into the `.js` file.\n\n```\nvar map = L.map('myMap').setView([-0.0884105,\
    \ 34.7299038], 13);\n```\n\nTake a pause.\n\nBreath in, breath out."
  - "[PAGE 21]\n\n# 2.2. BEAUTIFYING THE HOUSE\n\nYou are just about to learn something\
    \ very important here. In fact, it is the crux of what makes Leaflet work. Your\
    \ understanding of leaflet hinges on the small code above.\n\nThe L.map() class\
    \ we just used is what initializes the Leaflet map. Everything within the <div>\
    \ is displayed thanks to this class function. It is referred to as a factory function\
    \ because it uses the method map to return an object.\n\nThe setView method *sets\
    \ the view of the map (geographical center and zoom) with the given animation\
    \ options*. It's properties are Latitude-Longitude, zoom number and other options.\
    \ All Leaflet methods and functions are explained in the [Leaflet reference. Not\
    \ that we have inserted at Latitude, Longitude and zoom level respectively within\
    \ the setView method.\n\nTry loading your map.html. All you see is a grey canvas\
    \ with zoom options. This is because we haven't added a tilelayer yet. A tileLayer\
    \ is a set of web-accessible tiles that reside on a server. A tile consists individual\
    \ images or vector files from a server which are collectively joined together\
    \ to form a webmap. If you've zoomed into a webmap, say Google Maps and noticed\
    \ boxes appearing as you zoomed in or out, those are *tiles*.\n\nLet's load an\
    \ example of a common tile layer--the Open StreetMap--into Leaflet.\n\n```\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n```\n\nReload your HTML page again. You should\
    \ see an web map like the one below.\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/kisumu-leaflet.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_21_0.png)\n\nWhat L.tileLayer\
    \ has done is retrieve the web tiles from the Uniform Resource Locator (url) source\
    \ provided, and within the dictionary that follows the url,"
