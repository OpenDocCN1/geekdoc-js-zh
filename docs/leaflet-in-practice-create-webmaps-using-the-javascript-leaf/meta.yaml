  md: '# # Chapter 9


    # # Heatmaps


    # ## 9.1  What are heatmaps?


    Heatmaps are a type of maps that geographically visualize locations with patterns
    of higher than average occurrence of particular variables say crime, disease,
    service centres and et cetera.


    # ## 9.2  Loading the heatmap plugin


    Leaflet does not have a prepackaged tool for drawing heatmaps. Instead, we have
    to use an external plugin by the name of Leaflet.heat. The link to the zipfile
    is available here. Download and extract the folder to the same directory as your
    map.html.


    Once you have extracted the zip file contents, open your map.html and add the
    following <script> tag within your <head> element.


    ```

    <script src="Leaflet.heat-gh-pages\Leaflet.heat-gh-pages\dist\leaflet-heat.js"></script>

    ```


    Thereafter, we will have to think of a way of loading the GeoJson to a new JavaScript
    file called heatmap.js. This is where we shall write our heatmap code. You may
    think of using fetch or L.geoJson.ajax for this purpose but not so fast! The aforementioned
    methods failed in creating a heatmap. According to the documentation, heatmaps
    are created using L.heatLayer. Parsing fetch or L.geoJson.ajax into L.heatLayer
    to supposedly create a heatmap out of our GeoJSON points was not working. This
    is despite the two GeoJSON methods working well for various purposes in previous
    chapters. Thus, a new approach was needed.'
  merge: -1
  pgno: 95
- img_proc: true
  md: "After much internet searching, a code in Stack Overflow came to the rescue.\
    \ However, it only works after inserting another Ajax plugin. Luckily no download\
    \ is needed so insert this new <script> into your map.html.\n\n```\n<script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js\"></script>\n\
    ```\n\n# 9.3 Creating the Leaflet heatmap\n\nLet's call the usual suspects of\
    \ adding a basemap.\n\n```\nvar map = L.map('myMap').setView([0.3556, 37.5833],\
    \ 6.5);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {\n \
    \   attribution: '&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>\
    \ contributors'\n}).addTo(map);\n```\n\nThereafter, we add the following large\
    \ code chunks.\n\n```\nvar geoJsonUrl = \"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/seismic_events_usgs.json\"\
    ;\n\nvar geojsonLayer = $.ajax({\n    url : geoJsonUrl,\n    dataType : 'json',\n\
    \    jsonpCallback: 'getJson',\n    success : console.log(\"Data successfully\
    \ loaded!\"),\n    });\n\ngeoJson2heat = (geojson) => {\n    return geojson.features.map(function(feature)\
    \ {\n        return [parseFloat(feature.geometry.coordinates[1]),\n          \
    \      parseFloat(feature.geometry.coordinates[0])];\n    });\n};\n\n$.when(geojsonLayer).done(function()\
    \ {\n    // var kill = L.geoJSON(geojsonLayer.responseJSON);\n    var layer =\
