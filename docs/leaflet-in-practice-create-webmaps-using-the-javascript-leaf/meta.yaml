- md: "## 72 CHAPTER 7. CREATING AN INTERACTIVE CHOROPLETH MAP\n\nFirst, let’s create\
    \ a function that sets a hex colour code for each population category. We used\
    \ color brewer for this.\n\nTake a look at this code and we shall explain.\n\n\
    ```\n// Adding some color\nfunction getColor(d) {\n    return d > 1400 ? '#8c2d04'\
    \ :\n           d > 700 ? '#cc4c02' :\n           d > 400 ? '#ec7014' :\n    \
    \       d > 100 ? '#fe9929' :\n           d >  50 ?  '#fec44f':\n           d\
    \ > 25 ?  '#fee391':\n                   '#ffffd4';\n}\n```\n\nThe above function\
    \ uses a question mark `?` to act as the `if...else` statement. In JavaScript,\
    \ this is known as a ternary operator. A ternary operator? What’s that? How does\
    \ it work?\n\nFor a ternary operator, any statement to the right of the `?` is\
    \ returned as true if it agrees with the value to the left of the `?`. Reread\
    \ that last statement. If the value to the right of the `?` is false, then the\
    \ value after the colon `:` is returned. Reread that last statement for this ternary\
    \ operator concept to sink in.\n\nIf it still sounds fuzzy, the below image adapted\
    \ from FreeCodeCamp should help.\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/ternary.png\"\
    ))\n```\n\n## 7.3. COLORING THE COUNTIES\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_73_0.png)\n\
    \nIn other words, the ternary operator is a short form of writing the **if...else**\
    \ statement over several lines. Look at the below code which is simply the **if...else**\
    \ version of the ternary operator we've used above. Definitely, the ternary operator\
    \ wins the day in terms of brevity.\n\n```\nfunction getColor(d) {\n    if (d\
    \ > 1400) {\n        return '#8c2d04';\n    } else if (d > 700) {\n        return\
    \ '#cc4c02';\n    } else if (d > 400) {\n        return '#ec7014';\n    } else\
    \ if (d > 100) {\n        return '#fe9929';\n    } else if (d > 50) {\n      \
    \  return '#fec44f';\n    } else if (d > 25) {\n        return '#fee391';\n  \
    \  } else {\n        return '#ffffd4';\n    }\n}\n```\n\nNow that we've created\
    \ the function of setting colors to our json file on Leaflet, we next also have\
    \ to **create** a function that applies the color designation to the counties\
    \ in the GeoJSON file itself. Luckily, we have the **style** option from Leaflet\
    \ which is a function for precisely styling GeoJSON lines and polygons alone.\
    \ We saw it in Chapter 5 and we shall also use it here.\n\n```\nvar style = ((feature)=>\
    \ {\n    return {\n        fillColor: getColor(feature.properties.Pop_Density),\n\
    \        weight: 2,\n        opacity: 1,\n        color: 'gray',\n        fillOpacity:\
    \ 0.5\n    }\n})\n```\n\nThe above is an arrow function. Unlike regular JavaScript\
    \ function declarations which are in the format of **function** `<name of function>`\
    \ (`<parameter>`), we remove the **function** keyword, enclose everything in brackets\
    \ and put an arrow `=>` between the parameter brackets and function body. That's\
    \ just it. Arrow functions aren't so hard!\n\nRemember we assign the arrow function\
    \ to a variable called `var style` since we will parse it to the `L.geoJson` class.\n\
    \nFinally, we add the `style` variable to the `style` option of `L.geoJson` class.\n\
    \n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/counties_json.json\"\
    )\n  .then((response) =>{\n    return response.json()\n  })\n  .then((data) =>\
    \ {\n    L.geoJson(data, {style: style}).addTo(map);\n  })\n  .catch((error) =>\
    \ {\n    console.log(`This is the error: ${error}`)\n  })\n```\n\nSince the `style`\
    \ option is a key (and also a function), the value will be the `var style` which\
    \ we created. This value is in and by itself a function that iterates over every\
    \ county because of the `getColor(feature.properties.Pop_Density)` contained in\
    \ it as the `fillColor` value!\n\nEnough JavaScript for one day!\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuh/my-leaflet/images/choropleth-map.jpg\"))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_75_0.png)\n\
    \nOur choropleth map is beginning to take shape.\n\n### 7.4 Highlight features\n\
    \nGoing on from where we last left, we would like the choropleth map to highlight\
    \ any county that the screen pointer (or mouse) hovers over. Additionally, upon\
    \ clicking, the map should zoom to the clicked county as well as display its attributes.\
    \ The counties should also be reset to their default characteristics when the\
    \ screen pointer hovers out.\n\nAlright. It seems like we have our hands full.\n\
    \nLet's start simple, and scale upwards in terms of complexity.\n\nRemember the\
    \ fetch API we had used in retrieving our json file? We will tweak it a bit by\
    \ adding the var geojson just before calling the L.geoJson class. We shall parse\
    \ the variable var geojson to the L.geoJson class. We shall explain why we are\
    \ assigning L.geoJson to a variable (var geojson) when we know very well it can\
    \ work alone, as seen in the last two previous chapters.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/counties_json\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        var geojson;\n        geojson = L.geoJson(data, {\n          \
    \  style: style,\n            --snip--\n        })\n    })\n```\n\nWe had initially\
    \ mentioned that we wanted the county hovered over to be highlighted. The following\
    \ code will highlight with a white hue the county hovered over while also seemingly\
    \ popping it out above the rest.\n\n```\ngeojson = L.geoJson(data, {\n    style:\
    \ style,\n    onEachFeature: ((feature, layer) => {\n        layer.on('mouseover',\
    \ ((e) => {\n            var layer = e.target;\n\n            layer.setStyle({\n\
    \                weight: 5,\n                color: '#FFFFFF',\n             \
    \   dashArray: '',\n                fillOpacity: 0.7\n            });\n\n    \
    \        layer.bringToFront();\n        }))\n```\n\n### 7.4. HIGHLIGHT FEATURES\n\
    \nThe purpose of **on** method is to add an event listener. Event listeners in\
    \ JavaScript are functions that run a code when the browser user interacts with\
    \ the browser in a specific way. Now what **on** method does is that it triggers\
    \ the event listener **mouseover** for each county in our GeoJSON layer. The **mouseover**\
    \ event is what makes our counties be highlighted and ‘pop’ out when a screen\
    \ pointer is *over* them.\n\nSince the change in state of an element in HTML is\
    \ known as an event (denoted as **e** in our case), the **e.target** property\
    \ returns the element on which the event is occurring on. Since it’s a particular\
    \ county in our case, we proceed to change its symbology through the parameters\
    \ in the **setStyle** function. Thereafter we use the **bringToFront** method\
    \ to make the element in which the event has happened on to ‘pop’ out above the\
    \ rest.\n\nRemember we had mentioned we also want the counties to be reset to\
    \ their default status when one hovers out to some other county or outside the\
    \ map altogether. The following code does the job.\n\n```\nlayer.on('mouseout',\
    \ function() {\n             geojson.resetStyle(this);\n           })\n```\n\n\
    We use the **resetStyle** function to return the layer to default settings but\
    \ there is a twist. In the **resetStyle** case, we add the argument **this** in\
    \ parenthesis to refer to the element that was received. In other words, when\
    \ the mouse ‘hovers out’ of a county, the element will revert to its original\
    \ symbology.\n\nBefore, we end this monologue, we ensure we pass the variable\
    \ **geojson** to **resetStyle** function or else it won’t work. This appears to\
    \ be the *modus operandi* for resetting styles in Leaflet as shown in this Stack\
    \ Overflow question and also here.\n\nFinally, we mentioned we want to zoom to\
    \ a particular county upon clicking it. The following code fits our map to the\
    \ bounds of the particular county that was clicked. Note that **fitBounds** is\
    \ parsed **getBounds** which gets the boundaries of the county clicked upon. The\
    \ browser is able to identify the county clicked upon through the help of the\
    \ **e** parameter and **e.target**.\n\n```\nlayer.on('click', ((e) => {\n    \
    \         map.fitBounds(e.target.getBounds())\n           }))\n```\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/highlightable-map.jpg'))\n\
    ```"
  mdcn: "\n## 72 第7章. 创建交互式分级统计图\n\n首先，让我们创建一个为每个种群类别设置十六进制颜色代码的函数。我们为此使用了 color brewer。\n\
    \n看看这段代码，我们将进行解释。\n\n```\n// 添加一些颜色\nfunction getColor(d) {\n    return d > 1400\
    \ ? '#8c2d04' :\n           d > 700 ? '#cc4c02' :\n           d > 400 ? '#ec7014'\
    \ :\n           d > 100 ? '#fe9929' :\n           d >  50 ?  '#fec44f':\n    \
    \       d > 25 ?  '#fee391':\n                   '#ffffd4';\n}\n```\n\n上面的函数使用问号\
    \ `?` 来充当 `if...else` 语句。在 JavaScript 中，这被称为三元运算符。三元运算符？那是什么？它是如何工作的？\n\n对于三元运算符，如果\
    \ `?` 右侧的任何语句与 `?` 左侧的值相符，则返回为真。重新阅读最后这句话。如果 `?` 右侧的值为假，则返回冒号 `:` 之后的值。请重新阅读最后这句话，以理解这个三元运算符的概念。\n\
    \n如果听起来仍然模糊，下面这张改编自 FreeCodeCamp 的图片应该会有所帮助。\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/ternary.png\"))\n```\n\n## 7.3. 为县着色\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_73_0.png)\n\
    \n换句话说，三元运算符是在多行中编写 **if...else** 语句的简写形式。看看下面这段代码，它只是我们上面使用的三元运算符的 **if...else**\
    \ 版本。毫无疑问，在简洁性方面，三元运算符胜出了。\n\n```\nfunction getColor(d) {\n    if (d > 1400) {\n\
    \        return '#8c2d04';\n    } else if (d > 700) {\n        return '#cc4c02';\n\
    \    } else if (d > 400) {\n        return '#ec7014';\n    } else if (d > 100)\
    \ {\n        return '#fe9929';\n    } else if (d > 50) {\n        return '#fec44f';\n\
    \    } else if (d > 25) {\n        return '#fee391';\n    } else {\n        return\
    \ '#ffffd4';\n    }\n}\n```\n\n现在，我们已经创建了为 Leaflet 上的 json 文件设置颜色的函数，接下来我们还需要**创建**一个函数，将颜色指定应用到\
    \ GeoJSON 文件本身的各县中。幸运的是，我们有 Leaflet 的 **style** 选项，这是一个专门用于设置 GeoJSON 线条和多边形样式的函数。我们在第5章见过它，这里也将使用它。\n\
    \n```\nvar style = ((feature)=> {\n    return {\n        fillColor: getColor(feature.properties.Pop_Density),\n\
    \        weight: 2,\n        opacity: 1,\n        color: 'gray',\n        fillOpacity:\
    \ 0.5\n    }\n})\n```\n\n上面是一个箭头函数。与常规的 JavaScript 函数声明格式 **function** `<函数名>`\
    \ (`<参数>`) 不同，我们去掉了 **function** 关键字，将所有内容用括号括起来，并在参数括号和函数体之间放置一个箭头 `=>`。就是这样。箭头函数并不那么难！\n\
    \n记住，我们将箭头函数赋值给一个名为 `var style` 的变量，因为我们将在 `L.geoJson` 类中解析它。\n\n最后，我们将 `style`\
    \ 变量添加到 `L.geoJson` 类的 `style` 选项中。\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/counties_json.json\"\
    )\n  .then((response) =>{\n    return response.json()\n  })\n  .then((data) =>\
    \ {\n    L.geoJson(data, {style: style}).addTo(map);\n  })\n  .catch((error) =>\
    \ {\n    console.log(`This is the error: ${error}`)\n  })\n```\n\n由于 `style` 选项是一个键（也是一个函数），其值将是我们创建的\
    \ `var style`。这个值本身就是一个函数，它会遍历每个县，因为它包含 `getColor(feature.properties.Pop_Density)`\
    \ 作为 `fillColor` 值！\n\n今天的 JavaScript 内容到此为止！\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuh/my-leaflet/images/choropleth-map.jpg\"))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_75_0.png)\n\
    \n我们的分级统计图开始成形了。\n\n### 7.4 高亮显示功能\n\n从我们上次中断的地方继续，我们希望分级统计图在屏幕指针（或鼠标）悬停时能高亮显示任何县。此外，点击时，地图应缩放到被点击的县并显示其属性。当屏幕指针移出时，各县也应恢复其默认特征。\n\
    \n好的。看来我们手头的工作不少。\n\n让我们从简单的开始，并在复杂性上逐步提升。\n\n记得我们之前用于检索 json 文件的 fetch API 吗？我们将稍微调整一下，在调用\
    \ `L.geoJson` 类之前添加变量 `var geojson`。我们将把变量 `var geojson` 解析到 `L.geoJson` 类。我们将解释为什么我们要将\
    \ `L.geoJson` 赋值给一个变量 (`var geojson`)，因为我们很清楚它本身就可以工作，如前两章所示。\n\n```\nfetch(\"\
    https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/counties_json\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        var geojson;\n        geojson = L.geoJson(data, {\n          \
    \  style: style,\n            --snip--\n        })\n    })\n```\n\n我们最初提到，我们希望悬停的县被高亮显示。以下代码将用白色色调高亮显示悬停的县，同时使其似乎从其余部分中凸显出来。\n\
    \n```\ngeojson = L.geoJson(data, {\n    style: style,\n    onEachFeature: ((feature,\
    \ layer) => {\n        layer.on('mouseover', ((e) => {\n            var layer\
    \ = e.target;\n\n            layer.setStyle({\n                weight: 5,\n  \
    \              color: '#FFFFFF',\n                dashArray: '',\n           \
    \     fillOpacity: 0.7\n            });\n\n            layer.bringToFront();\n\
    \        }))\n```\n\n### 7.4. 高亮显示功能\n\n**on** 方法的目的是添加一个事件监听器。JavaScript 中的事件监听器是在浏览器用户以特定方式与浏览器交互时运行代码的函数。现在\
    \ **on** 方法的作用是为 GeoJSON 层中的每个县触发 **mouseover** 事件监听器。**mouseover** 事件使得我们的县在屏幕指针悬停*在它们上方*时被高亮显示并“弹出”。\n\
    \n由于 HTML 中元素状态的变化被称为事件（在我们的例子中表示为 **e**），**e.target** 属性返回事件正在发生的元素。由于在我们的例子中它是一个特定的县，我们继续通过\
    \ **setStyle** 函数中的参数更改其符号。之后，我们使用 **bringToFront** 方法使发生事件的元素从其余部分中“弹出”。\n\n\
    记住，我们也提到过，当鼠标移出到另一个县或完全移出地图时，我们希望各县恢复到其默认状态。以下代码完成了这项工作。\n\n```\nlayer.on('mouseout',\
    \ function() {\n             geojson.resetStyle(this);\n           })\n```\n\n\
    我们使用 **resetStyle** 函数将层恢复为默认设置，但有一个转折。在 **resetStyle** 的情况下，我们在括号中添加参数 **this**\
    \ 以指代被接收的元素。换句话说，当鼠标“移出”某个县时，该元素将恢复到其原始符号。\n\n在我们结束这段独白之前，我们确保将变量 **geojson**\
    \ 传递给 **resetStyle** 函数，否则它将无法工作。这似乎是 Leaflet 中重置样式的*操作方式*，如这个 Stack Overflow\
    \ 问题以及这里所示。\n\n最后，我们提到我们希望在点击某个县时缩放到该特定县。以下代码将地图适配到被点击县的边界。请注意，**fitBounds** 被解析为\
    \ **getBounds**，后者获取被点击县的边界。浏览器能够通过参数 **e** 和 **e.target** 的帮助识别被点击的县。\n\n```\n\
    layer.on('click', ((e) => {\n             map.fitBounds(e.target.getBounds())\n\
    \           }))\n```\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/highlightable-map.jpg'))\n\
    ```\n"
