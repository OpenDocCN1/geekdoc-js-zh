    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_105_1.png)\n\nUnless a developer would\
    \ like to be left with an egg on the face for assigning the same place names to\
    \ all hospitals, this should be dealt with expeditiously. Our code is alright,\
    \ since it works in other scenarios such as here. However, it is unacceptable\
    \ to assign wrong place names in the world wide web.\nTime to try a different\
    \ strategy: using **fetch** API. We have worked with **fetch** before so we will\
