  md: "# 10.4. ADDITIONAL FEATURES OF CLUSTER MARKER PLUGIN\n\nimportant functionality:\
    \ the mouseover event. A mouseover event triggers an action when a mouse hovers\
    \ of a feature in Leaflet.\n\nLet's demonstrate adding a hover event to our cluster\
    \ marker map, thanks to this answer.\n\n```\n////// Added `mouseover` event\n\n\
    fetch(url)\n  .then((response) => {\n    return response.json()\n  })\n  .then((data)\
    \ => {\n    var markers = L.markerClusterGroup({chunkedLoading: true}); // Splits\
    \ the add layers to s\n    var geojsonGroup = L.geoJSON(data, {\n      onEachFeature\
    \ : function(feature, layer){\n        layer.bindPopup(`<b>Facility Name:</b>\
    \ ${feature.properties.Facility_N} <br>\n          <b>Type:</b> ${feature.properties.Type}`);\n\
    \      },\n      pointToLayer: function (feature, latlng) {\n        return L.circleMarker(latlng).on('mouseover',\
    \ function(){\n          this.bindPopup(`Nearest_Center: ${feature.properties.Nearest_To}`).openPopup(\n\
    \        });\n      }\n    });\n\n    markers.addLayer(geojsonGroup);\n    map.addLayer(markers);\n\
    \n  })\n  .catch((error) => {\n    console.log(`This is the error: ${error}`)\n\
    \  })\n```\n\nFrom the above code, we added the mouseover event to each marker\
    \ point using the on method. The this keyword in this.bindPopup() ties popups\
    \ of selected variables to coordinates in the var geojsonGroup variable. We also\
    \ sped the rendering of our Leaflet map by adding chunkedLoading: true parameter\
    \ to L.markerCluster() function.\n\nHovering over each marker point will show\
    \ a value of the Nearest_To attribute which is an actual town centre in closest\
    \ proximity to the hospital marker.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/cluster-marker-mouseover.jpg'))\n\
    ```"
