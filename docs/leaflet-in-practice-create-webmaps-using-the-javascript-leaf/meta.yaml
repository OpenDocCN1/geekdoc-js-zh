    # 3.5 Summary


    This chapter took you further in enriching the content that can be displayed in
    a webmap. You have seen that a webmap can offer far more useful information than
    just mere markers and symbols on a web canvas. Popups are one way of displaying
    information, and they too can be customized further. Through the practicals in
    this chapter, you have learnt the following:


    +   - To create popups in Leaflet, we use the `bindPopup` method.

    - `openPopup` automatically opens the popups once the Leaflet map is loaded. They
    only disappear once you close them.

    - Markers can also work with HTML elements.

    - Apart from location pins, markers can also be circles and rectangles.

    - There exist methods in Leaflet that can automatically parse out information
    in popups without requiring any hardcoding from the programmer. For example, we
    used `getRadius` to display the circle radius in the popup without necessarily
    typing it out in the `bindPopup` method.

    - You comment out JavaScript code with `//!`'
