    This chapter will leave out the details of saving your files to Github. Nevertheless,
    as mentioned in Chapter 11, the name **index** in your HTML file is automatically
    considered the root HTML file by Github. With that said, here is the link to our
    eLearning website with a Leaflet webmap embedded therein.


    eLearning website'
