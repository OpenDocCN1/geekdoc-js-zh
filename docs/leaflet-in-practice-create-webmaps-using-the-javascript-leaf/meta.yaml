    - **Values**: Each property is assigned a value. This value indicates how to style\
    \ the property.\n\nUsing the example of our ProGMO website, this is how we would\
    \ specify the font and color of the `<body>` element of our webpage. In some cases,\
    \ the property values in CSS elements can be more than one, as in **font-family**\
    \ below.\n\n```\nbody {\n    font-family: \"Open Sans\", sans-serif;\n    color:\
    \ #444444;\n}\n```\n\nThe `body` in the CSS file is known as the selector. Selectors\
    \ in CSS are what tags are to HTML files. However, selectors can be more specific,\
    \ such as specifying the exact `<div>` that should be displayed in a particular\
    \ way. Using our HTML file example, if there were other `<div>`s apart from the\
    \ `<div id=\"division-1\">` above, we would specify the one with ID `division-1`\
    \ in a CSS document like so:\n\n```\n#division-1 {\n    font-family: \"Open Sans\"\
    , sans-serif;\n    color: #343a40;\n}\n```\n\nWe specify all specific IDs in an\
    \ HTML file with a prefix of `#`. Suppose there was a `<div id=\"division-2\"\
    >` somewhere in the HTML. We would similarly define some properties specific to\
    \ it in the manner below:"
