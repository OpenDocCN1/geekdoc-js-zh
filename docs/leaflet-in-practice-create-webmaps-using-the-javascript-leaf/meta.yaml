    # 2.3 Summary


    In this chapter, we created our first Leaflet map. Here are a couple of things
    that you have learnt at the first step of this web mapping journey.


    +   - Browsers read code scripts from top to bottom, much like skimming down a
    page.

    - The styles defined in the CSS style sheet, the `styles.css` in this case, will
    apply to the HTML elements in the `map.html` file.

    - We use the `src` attribute to link a different file other than HTML, such as
    a JavaScript file, to your HTML file. For example, the online script `leaflet.js`
    is connected to the HTML file through the `src` attribute of the `<script>` to
    enable the HTML file execute Leaflet functionalities such as web map creation,
    rendering and controls.

    - If HTML is the magnificent building, JavaScript acts like a good exterior designer.

    - The `L.map()` class is what initializes the Leaflet map.'
