    # 7.7  Summary


    This chapter was long and hard if not confusing. Nevertheless, here’s our take
    home from this chapter:


    +   * Choropleth maps are maps whose whose geographical areas or regions are colored,
    shaded or patterned in relation to a data variable. Good examples of choropleth
    maps are national population maps.

    * Ternary operators are short forms of the `if...else` statement. In a ternary
    operator, any statement to the right of the ? is returned as true if it agrees
    with the value to the left of the ?. Conversely, any value after the colon : is
    returned if the value to the right ? is false.

    * `style` is a special key in the `L.geoJson` class that applies custom styles
    to each layer in the GeoJSON file.

    * `mouseover` is an event listener that triggers a certain action when a screen
    pointer is over a certain feature.

    * We can reset features back to their defaults using `resetStyle`.'
