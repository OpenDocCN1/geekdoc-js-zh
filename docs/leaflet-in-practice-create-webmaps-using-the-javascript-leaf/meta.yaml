    \ (layer) {\n  return `City: ${layer.feature.properties.City},<br>\n  Population:\
    \ ${layer.feature.properties.Population}`;\n}).addTo(map);\n```\n\n```r\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/extra-markers.jpg\"))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_64_0.png)\n\
    \nThe custom markers are also clickable!\n\n## 6.6 Image overlays\n\nSometimes\
    \ an image can act as good a marker. Overlaying images on a map is fairly easy.\
    \ The below code inserts an image above a historical monument located in the Kenyan\
    \ capital, Nairobi.\n\n```javascript\n// Image overlays\nvar imageUrl = 'https://pbs.twimg.com/media/DddQBk5WsAAlbdJ?format=jpg&name=large';\n\
    var errorOverlayUrl = 'https://pbs.twimg.com/media/DddQBk5WsAAlbdJ?format=jpg&name=large';\n\
    var altText = 'The Galton - Fenzi Memorial: Source: Google and Twitter';\nvar\
    \ latLngBounds = L.latLngBounds([[-1.2861259,36.8172709], [-1.2886193,36.8230413]]);\n\
    \nvar imageOverlay = L.imageOverlay(imageUrl, latLngBounds, {\n    opacity: 0.8,\n\
    \    errorOverlayUrl: errorOverlayUrl,\n    alt: altText,\n    interactive: true\n\
    }).addTo(map);\n```\n\nHowever, finding an image of just one location over the\
    \ wide earth can be laborious, so we envelope it with a rectangle. The map.fitBounds\
    \ function enables the browser to automatically zoom to where our image is placed.\n\
    \n```javascript\nL.rectangle(latLngBounds).addTo(map);\nmap.fitBounds(latLngBounds);\n\
    ```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/geltan-fenzi.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_65_0.png)\n\nMind you that\
    \ landmark was set up in 1939 in honour of Lionel Douglas Galton-Fenzi; the first\
    \ motorist to drive from Nairobi to Mombasa as early as 1926. The landmark is\
    \ also inscribed with bearings to various East African cities but enough history\
    \ for today.\n\n## CHAPTER 6. CREATE YOUR OWN CUSTOM MARKERS\n\nAnyway, here is\
    \ a quick breakdown of the attributes used in **L.imageOverlay**:\na) the **var\
    \ latLngBounds** uses the **L.latLngBounds** class to set the lat-lon coordinates.\
    \ Notice they are two coordinate lists bound with a single **[]**. Failing to\
    \ enclose the two coordinates with **[]** results in an error. b) **var ImageUrl**\
    \ is the image source.\n\nFor the additional options parsed to the **L.imageOverlay()**\
    \ class, they are described below:\n\n-   1. **opacity** - defines the opacity\
    \ of the image overlay, it equals to 1.0 by default. Decrease this value to make\
    \ an image overlay transparent and to expose the underlying map layer.\n-   2.\
    \ **errorOverlayUrl** - is a URL to the overlay image to show in place of the\
    \ overlay that failed to load.\n-   3. **alt** - sets the HTML alt attribute to\
    \ provide an alternative text description of the image. It is quite helpful in\
    \ describing an image in text form just in case it fails to load due to poor network\
    \ connectivity. Moreover, it can improve the Search Engine Optimization (SEO)\
    \ of the website it is hosted in.\n-   4. **interactive** - is false by default.\
    \ If true, the image overlay will emit mouse events when clicked or hovered.\n\
    \nFull codes and files are here.\n\n## 6.7 Summary\n\nThis was quite a long chapter\
    \ that rendered justice on how to customize GeoJSON markers in Leaflet. Through\
    \ the various exercises you encountered in this chapter, you have learnt the following:\n\
    \n-   GeoJSON files, if in the correct format, can be rendered as a standalone\
    \ map from Github. An example is here.\n-   One can customize marker colour or\
    \ size based on the GeoJSON’s file attributes. In this chapter, the city population\
    \ values were used to define the marker’s size and colour.\n-   The **pointToLayer**\
    \ key, when used as an option in **L.geoJSON**, will parse a particular function\
    \ to every Lat-Lon coordinate of the GeoJSON object.\n-   It is also possible\
    \ to customize markers in the **fetch** API by simply specifying how they should\
    \ appear, in form of functions, within the **L.geoJson** options environment.\n\
    \n## 6.7. SUMMARY\n\n-   There exist plenty of custom made icons outside of, but\
    \ compatible with Leaflet. An example of such a library is Leaflet Awesome Markers.\n\
    -   Images can also be overlayed on a Leaflet map. This was done in the sub-chapter\
    \ of Image Overlays.\n\n# Chapter 7\n\n## Creating an interactive choropleth map\n\
    \n### 7.1 What is a choropleth map?\n\nWe will now move from markers to something\
    \ larger than life – choropleth maps. *What the heck are choropleth maps?* You\
    \ may ask. Geographers will roll their eyes over this term because they have come\
    \ across it innumerable times throughout their career. However, for the sake of\
    \ new readers, a choropleth map is a map whose geographical areas or regions are\
    \ colored, shaded or patterned in relation to a data variable. If during election\
    \ time you have seen a map that has draped the winning candidate in (a) particular\
    \ state(s) with their party theme colors, then that’s a choropleth map. Most population\
    \ maps are also choropleth maps. In this chapter, we will create a choropleth\
    \ map of Kenyan counties, and make it interactive by leveraging the area and population\
    \ characteristics of each county.\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/choropleth.png\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_70_0.png)\n\nSource: The Data\
    \ Visualisation Catalogue\n\n### 7.2 Creating a choropleth map: the start\n\n\
    Obviously by now, without going into much details, you can now create a basic\
    \ Leaflet map blindfolded. Anyway, seeing is believing, so lets start it right\
    \ away anyway. Create another new JavaScript file called **interactive-choropleth.js**.\
    \ To break the monotony, we shall use a different tile layer. Remember that Leaflet\
    \ has several tile layer servers, and CyclOSM, used in this chapter is just one\
    \ among many.\n\n```javascript\nvar map = L.map('myMap').setView([0.3556, 37.5833],\
    \ 6.5);\n\nL.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 20,\n    attribution: '<a href=\"https://github.com/cyclosm/cyclosm-cartocss-style/releases\"\
    '\n}).addTo(map); // the CyclOSM tile layer available from Leaflet servers\n```\n\
    \nNow to the big part –the GeoJSON files. We would like to mention it was quite\
    \ a hustle to set up the GeoJSON file to be in a format accessible by JavaScript’s\
    \ Fetch API. Only when we converted the GeoJSON to .json were we able to successfully\
    \ view it using fetch. The raw json file for our Kenyan counties which we shall\
    \ use in creating a choropleth map is available from here or here.\n\nLet's fetch\
    \ the counties json file.\n\n```javascript\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/counties_json.json\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        L.geoJson(data, {style: style}).addTo(map);\n    })\n    .catch((error)\
    \ => {\n        console.log(`This is the error: ${error}`)\n    })\n```\n\nSo\
    \ far, you should get a result like below.\n\n```r\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/kenya_json.jpg\"))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_71_0.png)\n\
    \n### 7.3 Coloring the counties\n\nAlright, we have been able to load our json\
    \ file to a Leaflet map. However, it looks dull and provides no meaningful information\
    \ to the casual observer. When making maps, aim to provide information at lightning\
    \ speed. That is, inform the reader at first glance. The code snippets that follow\
    \ have been heavily borrowed from Volodymyr’s interactive choropleth tutorial."
