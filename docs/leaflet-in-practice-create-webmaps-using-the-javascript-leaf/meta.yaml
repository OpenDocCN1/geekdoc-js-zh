  md: "# CHAPTER 7. CREATING AN INTERACTIVE CHOROPLETH MAP\n\n```\nlegend.addTo(map);\n\
    ```\n\nObviously the position of our legend is set using the position option in\
    \ L.control({position: 'bottomright'});.\n\nApart from the other elements we discussed\
    \ in our custom control info, we set the color interval of our legend through\
    \ the grades array. The for loop that follows iterates through the grades array\
    \ creating a color box for each interval.\n\nHonestly, the code to create the\
    \ legend color scheme is quite complicated. It has actually been copy pasted from\
    \ the one in the Leaflet choropleth tutorial. The strangely looking &ndash; within\
    \ the for loop of creating colors is simply how a hyphen (-) is written in HTML.\
    \ But anyway, getting back to the for loop, it essentially creates a range within\
    \ each interval, such as 0 - 25, 25 - 50 and so on. This takes place after the\
    \ ? ternary operator discussed earlier. Once it reaches the end of the loop, that\
    \ is, it goes out of the range, the + is appended to the last value from our grades\
    \ array. This last bit is made possible due to the : which returns values that\
    \ are false in JavaScript.\n\nThe legend also needs its CSS properties or else\
    \ it will not appear in the browser. The <div> class of info legend is also created\
    \ when the browser fires up. You may be wondering why info legend and not just\
    \ legend. Well, dear Golden Eye, the properties of .info class, such as background\
    \ color and others are also inherited by the legend class by virtue of the browser,\
    \ as in the case of HTML files, reading the CSS in a top-down format. The legend\
    \ class will only override those properties that also appear in the info legend\
    \ class. We also specify the CSS properties for the color intervals and text through\
    \ the .legend i class.\n\nHere's the CSS anyway.\n\n```\n.legend {\n    line-height:\
    \ 18px;\n    color: #555;\n}\n.legend i {\n    width: 18px;\n    height: 18px;\n\
    \    float: left;\n    margin-right: 8px;\n    opacity: 0.7;\n}\n```\n\nThe legend\
    \ is done and is finally added to the map."
