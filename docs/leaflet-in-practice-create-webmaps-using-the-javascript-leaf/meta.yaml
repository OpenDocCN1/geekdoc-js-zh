  md: "# 1.2. HOW DOES IT WORK?\n\nsection (<div>, <section>, <article>). With this\
    \ basic introduction, let's create a basic HTML page.\n\nTo create a HTML element\
    \ along with many other programming files, such as .js and .css which we shall\
    \ see later, we use a text editor. A good example of a text editor is VS code\
    \ or Pycharm. Check their websites on their installation methods for your personal\
    \ computer. For creating HTML and working with .js documents later, we shall use\
    \ VS Code unless otherwise stated.\n\nHere is a basic HTML webpage.\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n    <head>\n        <title>A basic html webpage</title>\n\
    \        <meta charset=\"utf-8\">\n        <link rel=\"stylesheet\" href=\"style.css\"\
    >\n    </head>\n    <body>\n        <div id=\"division-1\">\n            <p>Hello,\
    \ World!</p>\n        </div>\n        <script src=\"main.js\">\n\n        </script>\n\
    \n    </body>\n</html>\n```\n\nLet's go through each of the above tags one by\
    \ one.\n\n+   1. <!DOCTYPE html> - It is an “information” to the browser about\
    \ what document type to expect.\n2. <html lang=\"en\"> - It is the container for\
    \ all other HTML elements (except for the <!DOCTYPE> tag). The lang attribute\
    \ is used to assist web engines know which language the website uses.\n3. <head>\
    \ - It is not displayed on the webpage as other tags, but contains the metadata\
    \ of the webpage.\n4. <title> - Can you guess? You had it right. Defines the title\
    \ of the document. In our case, if you open the webpage assuming you created it\
    \ in VS Code, the webpage shall be titled A basic html webpage at the tab of your\
    \ web-browser."
  merge: -1
