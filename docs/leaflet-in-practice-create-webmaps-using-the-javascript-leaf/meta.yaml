    \ L.marker...`函数解析到每一个经纬度坐标上，从而在该点创建一个标记。\n\n### 6.3 在网页地图上区分自定义标记\n\n现在来看城市标记。我们希望标记能根据某个特定变量（比如人口）来区分城市。顺便说一句，城市规模通常由人口决定。以下代码将根据圆形标记的大小对城市进行分类，而这个大小将基于城市的人口。如果你在QGIS中见过点符号，准备好在Leaflet中看看它们的实际效果吧！\n\
    \n注释掉之前的代码并插入以下内容：\n\n```js\nL.geoJSON(cities, {\n    pointToLayer: function (feature,\
    \ latlng) {\n        if (feature.properties.Population <= 250000) {\n        \
    \  return L.circleMarker(latlng, {\n            radius: 4,\n            fillColor:\
    \ '#FFFF00',\n            color: '#000',\n            weight: 1,\n           \
    \ opacity: 1,\n            fillOpacity: 0.8\n          });\n        } else if\
    \ (feature.properties.Population <= 800000) {\n          return L.circleMarker(latlng,\
    \ {\n            radius: 8,\n            fillColor: '#ff9900',\n            color:\
    \ '#000',\n            weight: 1,\n            opacity: 1,\n            fillOpacity:\
    \ 0.8\n          });\n        } else {\n          return L.circleMarker(latlng,\
    \ {\n            radius: 12,\n            fillColor: '#FF0000',\n            color:\
    \ '#000',\n            weight: 1,\n            opacity: 1,\n            fillOpacity:\
    \ 0.8\n          });\n        }\n    }\n}).bindPopup(function (layer) {\n  return\
    \ `City: ${layer.feature.properties.City},<br>\n  Population: ${layer.feature.properties.Population}`;\n\
    }).addTo(map);\n```\n\n你将得到一个地图，其中圆形标记的大小已由城市人口决定。这一次，`pointToLayer()`函数体与**if/else\
    \ if**语句配合，来区分每个圆形标记的半径和颜色。在**if/else if**代码语句块内，为不同的人口类别插入了不同的圆形标记规格（半径和填充颜色）。任何人口超过800000的城市都被归入**else**块。\n\
    \n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/geojson-diff1.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_60_0.png)\n\n这就引出了我们之前为何将人口值从字符串改为整数的原因。如果我们使用原始的字符串值（如带引号的\"\
    1000000\"），那么任何超过1,000,000的值都会匹配**feature.properties.Population <= 250000**这个条件。也就是说，它会显示为与人口25,000或以下的城市相同的黄色配色方案。这就会传递错误的信息。使用字符串值导致这个明显错误的原因是：在JavaScript中，对字符串中的数字进行排序时，会按照第一个字符来排序，而不管实际值的大小。换句话说，1比9大，尽管后者数值更大。因此，一个\"\
    **800,000**\"人口的城市会被视为比\"**1,000,000**\"人口的城市更大。现在你就明白为什么我们的GeoJSON文件中，**Population**变量周围没有引号才能正确工作的逻辑了。\n\
    \n在下一个代码示例中，我们将创建城市标记图标，其颜色将由城市人口规模决定。我们将使用三种颜色：黄色、橙色和红色。黄色标记最小的城市，红色标记最大的城市。以下代码展示了如何实现这种分类。\n\
    \n```js\nL.geoJSON(cities, {\n    pointToLayer: function (feature, latlng) {\n\
    \        if (feature.properties.Population <= 250000) {\n            return L.marker(latlng,\
    \ {\n                icon: yellowIcon\n            });\n        } else if (feature.properties.Population\
    \ <= 800000) {\n          return L.marker(latlng, {\n            icon: orangeIcon\n\
    \          });\n        } else {\n          return L.marker(latlng, {\n      \
    \      icon: redIcon\n          });\n        }\n    }\n}).bindPopup(function (layer)\
    \ {\n  return `City: ${layer.feature.properties.City},<br>\n  Population: ${layer.feature.properties.Population}`;\n\
    }).addTo(map);\n```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/geojson-diff2.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_61_0.png)\n\n在上图中，人口超过800,000的大城市用红色标记分类，人口低于250,000的用黄色标记，介于两者之间的用橙色标记。在所有情况下，我们的`bindPopup()`仍然包含相同的设置，同时显示城市名称和人口规模。\n\
    \n`pointToLayer()`键的值被分配了一个函数，该函数检查城市人口是否在特定范围内。如果一个城市落在if语句指定的范围内，`L.marker()`函数就会返回一个特定的图标——无论是`yellowIcon`、`orangeIcon`还是`redIcon`。\n\
    \n### 6.4 使用 fetch\n\n还记得在前面章节中`fetch`如何帮助我们从服务器检索数据吗？虽然我们不会重复整个过程（你可以松一口气了），但区分标记图标的相同逻辑也可以插入到`fetch`\
