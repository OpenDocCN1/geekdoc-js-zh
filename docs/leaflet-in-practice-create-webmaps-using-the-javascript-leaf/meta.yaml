    function onLocationFound(e) {\n    var radius = e.accuracy;\n```"
  - "[PAGE 113]\n\n11.5.  ADD MARKER TO MOBILE USER'S GEOLOCATION 113\n\n```\nL.marker(e.latlng).addTo(map)\n\
    \    .bindPopup(\"You are within \" + Number((radius/1000).toFixed(2)) + \" kilometers\
    \ from this\")\n\nL.circle(e.latlng, radius).addTo(map);\n}\n```\n\nIncase you\
    \ forgot, the **on** method adds listeners. As a gentle reminder, listeners are\
    \ codes that run when an event is triggered, such as the simple hovering of a\
    \ mouse over a feature. In the below code, the listener 'locationfound' triggers\
    \ the **onLocationFound** function in case Leaflet successfully approximated the\
    \ user's location.\n\n```\nmap.on('locationfound', onLocationFound);\n```\n\n\
    The **locationfound** listener is responsible for the message bounded in red below\
    \ when a browser loads a Leaflet map. Clicking **Allow** will give the browser\
    \ the heads up to zoom to the user's location as it best can.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/location-found.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_113_0.png)\n\nWhat if, getting\
    \ the mobile user's geolocation is unsuccessful? We will create a function that\
    \ outputs the error event to our console, as shown below.\n\n```\n// Error displayed\
    \ after finding location failed\nfunction onLocationError(e) {\n    alert(e.message);\n\
    }\n```\n\nActually, **message** is an error event that displays the error message\
    \ of a parameter.  The **message** event is parsed to the **onLocationError**\
    \ function.  If the browser fails to approximate the user's location, the **onLocationError**\
    \ function returns 'true' which triggers an error alert on the browser.\n\n```\n\
    map.on('locationerror', onLocationError);\n```"
