- md: "## 5.6. LOADING THE GEOJSON INTO LEAFLET\n\nClick it and paste the json code\
    \ into your `geojson.js` file right above the other `L.map` and `L.tileLayer`\
    \ classes. The contents of your `geojson.js` should look like below.\n\n```\n\
    var cities = {\n    \"type\": \"FeatureCollection\",\n    \"features\": [\n  \
    \      {\n            \"type\": \"Feature\",\n            \"properties\": {\n\
    \                \"City\": \"Nairobi\",\n                \"Population\": \"4,\
    \ 300, 000\"\n            },\n            \"geometry\": {\n                \"\
    coordinates\": [\n                    36.8198475311531,\n                    -1.2952871483350066\n\
    \                ],\n                \"type\": \"Point\"\n            }\n    \
    \    },\n        -- snip ---\n        {\n            \"type\": \"Feature\",\n\
    \            \"properties\": {\n                \"City\": \"Malindi\",\n     \
    \           \"Population\": \"119, 859\"\n            },\n            \"geometry\"\
    : {\n                \"coordinates\": [\n                    40.10521499751357,\n\
    \                    -3.2138767356491655\n                ],\n               \
    \ \"type\": \"Point\"\n            }\n        }\n    ]\n};\n```\n\n```\nvar map\
    \ = L.map('myMap').setView([-1.295287148, 36.81984753], 7);\n```\n\n```\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n  maxZoom: 19,\n  attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n```\n\nRefresh your map.html. It's a map\
    \ of Kenya alright, but none of our .geojson features appear yet. We are about\
    \ to change that. Leaflet offers the L.geoJSON class to add GeoJSON data to a\
    \ map. The class name speaks for itself and therefore let's use it to add our\
    \ GeoJSON features. Add the following code below the other Leaflet map class layers.\n\
    \n```\nL.geoJSON(cities).addTo(map);\n```\n\nRefresh your map.html. The GeoJSON\
    \ features should now appear at their exact locations.\n\nHow about if we made\
    \ the markers more interactive? Say, like they display popups as we did in Chapter\
    \ 3? We would like the city names to appear upon a user’s click on the markers.\
    \ Easy. Just create a function that does so as in the logic provided here. We\
    \ customized it to our case to make sure it references to the City key which is\
    \ part of the dictionary attached to the properties key.\n\n```\nL.geoJSON(cities).bindPopup(function\
    \ (layer) {\n    return layer.feature.properties.City;\n}).addTo(map);\n```\n\n\
    There is one issue with this method. If we have a very long GeoJSON data structure,\
    \ it will clatter our JavaScript file. We only worked with seven cities, but it\
    \ is very common to work with data holding hundreds and even thousands of dictionaries.\
    \ That would make your JavaScript file stretch to ad infinitum.\n\nThis brings\
    \ us to the other two methods, that of using the Ajax plugin and using the Fetch\
    \ Application Programming Interface (API). Don’t let the words scare you. Take\
    \ a break, grab a glass of water and come back.\n\n### 5.6.2 Using the Ajax Plugin\n\
    \nAs the term ‘plugin’ suggests, this is an extension that offers additional functions\
    \ to the core Leaflet plugin. The Ajax plugin is available from this link. Download\
    \ it to your directory and preferably within the same directory as your map.html\
    \ and geojson.js. Alright. Right under the src for leaflet.js in your map.html,\
    \ add the following `<script>` tag.\n\n```\n<head>\n    -- snip --\n    <script\
    \ src=\"leaflet-ajax-gh-pages/dist/leaflet.ajax.js\"></script>\n\n</head>\n--\
    \ snip --\n```\n\nThis file will allow you to add .geojson files to your Leaflet\
    \ map. However, there is a catch. Both the Ajax and Fetch APIs only work with\
    \ GeoJSON file formats saved on a web server. Based on experience, they will not\
    \ work with local GeoJSON files. As a work around, we saved our GeoJSON file to\
    \ Github. For convenience, here is the link again to the raw file we had initially\
    \ created from geojson.io.\n\nWe shall call our GeoJSON file from Github using\
    \ Ajax as shown in the code below. Please remember to comment out your var cities\
    \ and L.geoJSON using `//` because they are irrelevant in this particular case.\n\
    \n```\nvar geojsonLayer = new L.geoJson.ajax(\"https://raw.githubusercontent.com/sammigachuhi/p\n\
    ```\n\nYour map should now show the markers of our cities. If you are hawk eyed,\
    \ you may have noticed that the syntax for Ajax is different from that of the\
    \ earlier L.geoJSON from Leaflet. Starting with the latter, we have instead used\
    \ L.geoJson and unlike in the Ajax creator's website where they used var geojsonLayer\
    \ = new L.GeoJSON.AJAX(<your-geojson-file>) we used the following syntax: L.geoJson.ajax()\
    \ (ajax and geoJson beginning with small case). Actually, that's what worked after\
    \ quite a lengthy web search.\n\nJust like using L.geoJSON, we can also add popups\
    \ after calling the .ajax method.\n\n```\nvar geojsonLayer = new L.geoJson.ajax(\"\
    https://raw.githubusercontent.com/sammigachuhi/p\n    .bindPopup(function (layer)\
    \ {\n        return layer.feature.properties.City;\n    }).addTo(map);\n```\n\n\
    Doing so should make the city names appear on clicking the markers on your Leaflet\
    \ map.\n\n### 5.6.3 Using Fetch API\n\nFetch API is a modern interface that allows\
    \ you to make HTTP requests to servers from web browsers. In other words, it searches\
    \ for a resource over the web, retrieves it, and brings it to you. Think of it\
    \ as a dog in which you throw a saucer and tell your faithful hound: “*Sabretooth,\
    \ fetch!*”. The dog runs after the saucer, grips it with its canines mid-air and\
    \ quickly brings it back to you. Same case with Fetch API!\n\nI had mentioned\
    \ I will show you how to retrieve our Github stored GeoJSON data and I shall stick\
    \ to the script! I shall also attempt to explain how this *mysterious* `fetch`\
    \ works.\n\nFirst things first. The `fetch` function shall be called and passed\
    \ to our Github url containing our GeoJSON text. Since `fetch` is an API, it retrieves\
    \ data from Github.io –the server in this case–and brings it to our laptop the\
    \ –the client. Enough IT. Let’s write it down.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n```\n\nOkay, next step. Once the server beams back the data to us, what do\
    \ we do with it? According to Digital Ocean, the response is not *actually* the\
    \ data in the original format but rather *a series of methods that can be used\
    \ depending on what you want to do with the information*. This sounds downright\
    \ confusing. Nevertheless, it is *at least* crystal clear that the end goal is\
    \ to have our fetched data in JSON format. Converting an object to JSON is done\
    \ using the `json()` method. We parse `.json()` to a `then` method which is an\
    \ asynchronous function¹. After the `fetch` function is successful, the object\
    \ is stored in the **response** argument, which is in brackets, and then the function\
    \ returns the result as a json object.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n```\n\
    \nAfter converting our response to JSON, it still needs to be processed further.\
    \ Processed to what? To a GeoJSON file and subsequently add it to our Leaflet\
    \ Map.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n  \
    \  .then(function(data) {\n        L.geoJson(data).addTo(map);\n    })\n```\n\n\
    We shall also add one more function -the `catch()` method. `catch()` is a method\
    \ that returns an action if our response to the server has been rejected. Let’s\
    \ demonstrate all this.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojso\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n  \
    \  .then(function(data) {\n        L.geoJson(data).addTo(map);\n    })\n    .catch(function(error)\
    \ {\n        console.log(`This is the error: ${error}`)\n    })\n```\n\nTo see\
    \ the `catch()` in action, omit the last letter in our url so that it reads **cities-geojson.geojso**.\
    \ Yeah, you read it right. Just omit the letter ‘n’ for now and reload your **map.html**.\
    \ Right click the webmap page and click on **Inspect** in the small interface\
    \ that appears. Head over to the console tab and see the error response. It should\
    \ read like in the below image.\n\nRestore the omitted letter ‘n’ and reload your\
    \ **map.html**. Your Leaflet map should have the city markers overlain just like\
    \ in the case of using Ajax plugin or hardcoding the Geojson data into **var cities**.\
    \ To stretch your Javascript skills further, we can shorten our code further by\
    \ retaining the arguments **response**, **data** and **error** and using the arrow\
    \ function `=>` to pass on the return statements, like so:\n\n¹Asynchronous programming\
    \ is a technique that enables your program to start a potentially long-running\
    \ task and still be able to be responsive to other events while that task runs,\
    \ rather than having to wait until that task has finished. Once that task has\
    \ finished, your program is presented with the result. See Mozilla"
