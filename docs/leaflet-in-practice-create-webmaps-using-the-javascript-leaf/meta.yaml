  - "[PAGE 35]\n\n# 4.3. A SIMPLE FOR LOOP FOR WEBMAP DISPLAY\n\n```\n];\n\nfor (var\
    \ i = 0; i < branches.length; i++) {\n    marker = new L.marker([branches[i][1],\
    \ branches[i][2]])\n        .bindPopup(branches[i][0])\n        .addTo(map);\n\
    }\n```\n\nFor the first time in this book, we are introducing the `for` loop.\
    \ As is the case in other languages such as R and Python, JavaScript also uses\
    \ the `for` loop to iterate over items. In our case, and remembering that indexing\
    \ in arrays begins from 0, the marker popups will read the latitudes and longitudes\
    \ which are at index 1 and 2 respectively. The lat-lon are indicated by (`[branches[i][1],\
    \ branches[i][2]]`). The popup strings, which appear as the first elements in\
    \ the `branches` array, are at index 0. The popup strings are indicated by `branches[i][0]`.\
    \ At the end of the chain the markers are added to the map with `.addTo`.\n\n\
    Alright. How about the keyword `new`?\n\nThe `new` keyword is a constructor. That\
    \ is, it creates an empty object. Many instances of the variable `marker` can\
    \ be created from the instance of `new` object. For more information on the `new`\
    \ keyword constructor, see this website. Be rest assured that the `new` keyword\
    \ isn't mandatory to make the webmap to work in our case but its helpful to learn\
    \ another JavaScript trick to add to your hat.\n\nBelow is a snapshot of how the\
    \ dummy Pro-GMO website looks like with our newly embedded webmap.\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/embedded.jpg\"))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_0.png)\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_1.png)\n\nOur Branches\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_2.png)\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_3.png)\n\n“How are we able to align\
    \ the webmap to the left and also make other text stand aside to it?” This is\
    \ all thanks to the CSS property `display: flex`. `display` is a CSS property\
    \ that deals with how HTML elements are displayed."
  - '[PAGE 36]


    # 36CHAPTER 4. EMBEDDING LEAFLET MAP TO AN EXTERNAL WEBSITE


    The `display` property aligns a HTML element to fill or shrink according to the
    space available within its assigned portion in the webpage. On the other hand,
    the CSS property `padding-left` just creates space all around the element, thus
    creating a neat space between the Leaflet map and the address text. Removing this
    will just make the address text and the Leaflet map touch each other edge to edge.
    The inspiration to use all these CSS properties and values in placing HTML elements
    side-by-side emanated from this example.


    Having done the above, you can consider you are as good a Leaflet mapper to undertake
    any task! Later on, in Chapter 13, we shall see how to insert a Leaflet map in
    a more sophisticated website. This was just a gentle introduction.


    # 4.4 Summary


    This chapter has introduced you on how you can use CSS to customize the appearance
    and positioning of your webmap. You have also encountered the use of `for` loop
    in JavaScript code to retrieve geospatial information, particularly from arrays.
    Here are some of the take aways from this chapter.


    +   * Leaflet maps can be embedded inside a website as demonstrated in the dummy
    Pro-GMO webpage.

    * One can use `for` loops to iterate over elements from an array and retrieve
    geospatial information. In this chapter, the `for` loop was used to retrieve both
    latitude-longitude coordinates and text from the `branches` array variable.

    * We can use CSS elements, such as `display` and `padding-left` to position and
    define how a webmap shall be displayed on our webpage.'
- md: "## Chapter 5\n\n## Using GeoJSON in Leaflet\n\n### 5.1 Creating a .geojson\
    \ file\n\nSo far, we have created a Leaflet map, added some aesthetics such as\
    \ markers, and even embedded a map into a dummy website. Alright, the website\
    \ wasn’t even close to good, but the methodology should be the same when working\
    \ with other fully functional and better looking websites. That may be enough\
    \ to give you confidence to start as a webmapper but not so fast! There is still\
    \ more territory to cover! I would like to introduce another format of storing\
    \ geospatial information – the use of .geojson files.\n\n### 5.2 What are .geojson\
    \ files?\n\n.geojson files, according to the GIS leader ESRI, are an open standard\
    \ geospatial data interchange format that represents simple geographic features\
    \ and their non-spatial attributes. GeoJSON is based on the JavaScript Object\
    \ Notation (JSON) file format which is a lightweight data exchange format that\
    \ is easily interpretable by both man and machine. In very few instances does\
    \ any data format please both sides of the divide but JSON does, and this site\
    \ provides examples. Anyway, just like you can tell from the name, JSON is based\
    \ on the JavaScript programming language. If you have worked with JavaScript before,\
    \ it looks very much like a data format based on dictionaries. In essence, JSON\
    \ is a large dictionary holding other *dictionaries* of data within it. A GeoJSON\
    \ is a JSON file that follows a certain structure and has spatial index and geometry\
    \ specifications in it. See this website for a GeoJSON example.\n\nAn example\
    \ of a GeoJSON file format structure is shown below:\n\n```json\n{\n  \"type\"\
    : \"FeatureCollection\",\n  \"features\": [\n    {\n      \"type\": \"Feature\"\
    ,\n      \"properties\": {\n        \"City\": \"Nairobi\",\n        \"Population\"\
    : \"4, 300, 000\"\n      },\n      \"geometry\": {\n        \"coordinates\": [\n\
    \          36.80617598261199,\n          -1.2868825246637812\n        ],\n   \
    \     \"type\": \"Point\"\n      }\n    },\n    {\n      \"type\": \"Feature\"\
    ,\n      \"properties\": {\n        \"City\": \"Kisumu\",\n        \"Population\"\
    : \"610, 082\"\n      },\n      \"geometry\": {\n        \"coordinates\": [\n\
    \          34.738718987625106,\n          -0.10390483386935045\n        ],\n \
    \       \"type\": \"Point\"\n      }\n    },\n    ---snip----\n```\n\nBelow is\
    \ an example of a json file structure.\n\n```json\n{\n  \"Influencers\" : [\n\
    \    {\n      \"name\" : \"Jaxon\",\n      \"age\" : 42,\n      \"Works At\" :\
    \ \"Tech News\"\n    },\n    {\n      \"name\" : \"Miller\",\n      \"age\" :\
    \ 35,\n      \"Works At\" : \"IT Day\"\n    }\n  ]\n}\n```\n\n### 5.3 Why geojson?\n\
    \nYours truly could be wrong, but one advantage of **geojson** and json is that\
    \ it's minimal on size compared to shapefiles and it is also more portable. Shapefiles\
    \ are dependent on other data formats that accompany it, such as .shx, .dbf, .prj\
    \ which provide auxiliary geospatial orientation, metadata, and attributes. On\
    \ the other hand, GeoJSON and JSON formats will come as single files but will\
    \ still as much data as all the components of a shapefile (.shx, .dbf, and .prj)\
    \ put together.\n\nSo when do I use shapefiles vis a vis GeoJson? If you want\
    \ to work with geospatial data in a web interface, **geojson** is the way to go.\
    \ Period.\n\n### 5.4 Creating a geojson file\n\nIt may look intimidating to create\
    \ a GeoJSON file without hardly making any errors, and it actually is, but luckily\
    \ the geojson.io website does the heavy lifting for us. We shall head over to\
    \ it and create a **geojson** file of some cities and their population.\n\nFirst,\
    \ of all, the website looks like below. Talk of a cool global map powered by Mapbox.\n\
    \n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/mapbox-front.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_40_0.png)\n\nOn your\
    \ right, under the <>JSON tab, the Mapbox folks have already given you a head\
    \ start by indicating what feature type and features will go into your geojson\
    \ file. These are important as any website uses these keywords when parsing information\
    \ from the GeoJSON file. Zoom to Kenya and click a point on top of the Nairobi\
    \ dot pin, like shown below. Use the highlighted pin in the image below to create\
    \ a marker over Nairobi.\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/nairobi-pin.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_40_1.png)\n\nBy doing\
    \ so, you will realize that a new dictionary of **type**, **properties** and **geometry**\
    \ appears within the **features** list. These new keys provide the additional\
    \ spatial and geometry data in their values which a website uses to place them\
    \ at their appropriate locations on the webmap.\n\nNow move over to the **Table**\
    \ tab and click new column as shown below.\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/table.jpg\"))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_41_0.png)\n\
    \nClick on it and in the graphic that appears, give your column the name **City**.\
    \ Click **Ok** and in the table cell that appears, type **Nairobi**.\n\n```\n\
    knitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/nairobi-named.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_41_1.png)\n\nNow create\
    \ a new pin over *Kisumu* and two things will happen: a new dictionary will appear\
    \ below that of Nairobi and a new table row will appear in the **Table** tab.\
    \ Create pins over the following cities: Mombasa, Nakuru, Nyeri, Machakos and\
    \ Malindi. Legally speaking, only the first four are cities by law, the rest are\
    \ just towns but for the sake of this tutorial, let’s corporately refer to them\
    \ as cities.\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/cities-named.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_42_0.png)\n\nAlright,\
    \ one process down, one more to go. We will fill these cities with their population\
    \ statistics. Create a new column with the heading **Population**. Fill each of\
    \ the cities with the following statistics.\n\n```\nread.csv(\"D:/gachuhi/my-leaflet-vs/data/points.csv\"\
    )[ , 1:2]\n```\n\n| City | Population |\n| :--- | :--- |\n| Nairobi | 4, 300,\
    \ 000 |\n| Kisumu | 610, 082 |\n| Mombasa | 1, 440, 000 |\n| Nakuru | 422, 000\
    \ |\n| Nyeri | 759, 164 |\n| Machakos | 1, 422, 000 |\n| Malindi | 119, 859 |\n\
    \nOnce done, head over to the top left of the geojson.io website, and click **Save**.\
    \ A list of options will appear, click on save as **geojson**. It should appear\
    \ somewhere in your *Downloads* directory.\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/geojson-save.jpg\"))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_43_0.png)\n\
    \n### 5.5 Saving the Geojson to Github\n\nNow, based on experience, loading a\
    \ local Geojson file (one within your computer directory) to JavaScript is a painful,\
    \ if not near impossible experience. The resulting errors had to with servers\
    \ or something. To get a way around this and still be able to display .geojson\
    \ data in Leaflet, the GeoJson file had to be stored on an online server, in this\
    \ case, Github. We would love to show you how to save data on Github, but this\
    \ would make this chapter way too long. Therefore, and with sincere apologies,\
    \ it would be best if you googled it out. Nevertheless, here is the GeoJSON file,\
    \ and it will come in handy in the last two sub-chapters of this exercise.\n\n\
    ### 5.6 Loading the GeoJSON into Leaflet\n\nAs they always say, there are many\
    \ ways of killing a rat. There are around three ways in which to load GeoJson\
    \ data into Leaflet, at least from our discovery. We shall start with the easiest\
    \ and most unreliable to what we consider the best. Let start with the easy one,\
    \ loading a .geojson file from within our Javascript file itself.\n\n#### 5.6.1\
    \ The easy way\n\nFirst of all create a blank JavaScript file called `geojson.js`.\
    \ Thereafter, go to your `map.html` file which you had created last in Chapter\
    \ 2. Open it. Within the `<script>` tag of the `<body>` element, change the `src`\
    \ attribute to read \"geojson.js\" like below.\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n    <head>\n        -- snip ---\n    </head>\n    <body>\n   \
    \     <div id=\"myMap\">\n            <script src=\"geojson.js\">\n          \
    \  </script>\n        </div>\n    </body>\n</html>\n```\n\nAlright. Head over\
    \ to your `geojson.js` and as always, add the Leaflet classes `L.map` and `L.tileLayer`.\
    \ We set the view of our new Leaflet map to that of Nairobi. Your blank `geojson.js`\
    \ should now be filled with the below code.\n\n```javascript\nvar map = L.map('myMap').setView([-1.295287148,\
    \ 36.81984753], 7);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n```\n\nOkay. Head over to geojson.io website\
    \ and right under the `</>`**JSON** you will see a copy icon.\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/geojson-copy.jpg\"))\n```"
  mdcn: "\n## 第五章\n\n## 在Leaflet中使用GeoJSON\n\n### 5.1 创建 .geojson 文件\n\n到目前为止，我们已经创建了一个Leaflet地图，添加了一些美学元素如标记，甚至将地图嵌入到了一个虚拟网站中。好吧，这个网站离优秀还差得远，但在处理其他功能完善且更美观的网站时，其方法论应该是相同的。这可能足以给你开始成为网络地图制作者的信心，但别急！还有更多领域需要探索！我想介绍另一种存储地理空间信息的格式——使用\
    \ .geojson 文件。\n\n### 5.2 什么是 .geojson 文件？\n\n根据GIS领域的领导者ESRI的定义，.geojson 文件是一种开放标准的地理空间数据交换格式，用于表示简单的地理要素及其非空间属性。GeoJSON基于JavaScript对象表示法（JSON）文件格式，这是一种轻量级的数据交换格式，易于人和机器解读。在极少数情况下，任何数据格式能同时满足双方的需求，但JSON做到了，本网站提供了示例。总之，就像你可以从名称中看出的那样，JSON基于JavaScript编程语言。如果你之前使用过JavaScript，它看起来非常像一种基于字典的数据格式。本质上，JSON是一个包含其他数据*字典*的大型字典。GeoJSON是一个遵循特定结构并包含空间索引和几何规范的JSON文件。有关GeoJSON示例，请参见此网站。\n\
    \nGeoJSON文件格式结构示例如下所示：\n\n```json\n{\n  \"type\": \"FeatureCollection\",\n  \"\
    features\": [\n    {\n      \"type\": \"Feature\",\n      \"properties\": {\n\
    \        \"City\": \"Nairobi\",\n        \"Population\": \"4, 300, 000\"\n   \
    \   },\n      \"geometry\": {\n        \"coordinates\": [\n          36.80617598261199,\n\
    \          -1.2868825246637812\n        ],\n        \"type\": \"Point\"\n    \
    \  }\n    },\n    {\n      \"type\": \"Feature\",\n      \"properties\": {\n \
    \       \"City\": \"Kisumu\",\n        \"Population\": \"610, 082\"\n      },\n\
    \      \"geometry\": {\n        \"coordinates\": [\n          34.738718987625106,\n\
    \          -0.10390483386935045\n        ],\n        \"type\": \"Point\"\n   \
    \   }\n    },\n    ---snip----\n```\n\n下面是一个json文件结构的例子。\n\n```json\n{\n  \"Influencers\"\
    \ : [\n    {\n      \"name\" : \"Jaxon\",\n      \"age\" : 42,\n      \"Works\
    \ At\" : \"Tech News\"\n    },\n    {\n      \"name\" : \"Miller\",\n      \"\
    age\" : 35,\n      \"Works At\" : \"IT Day\"\n    }\n  ]\n}\n```\n\n### 5.3 为什么使用geojson？\n\
    \n鄙人可能错了，但**geojson**和json的一个优点是与shapefile相比，它体积更小，也更便于携带。Shapefile依赖于随附的其他数据格式，例如\
    \ .shx、.dbf、.prj，这些文件提供辅助的地理空间方向、元数据和属性。另一方面，GeoJSON和JSON格式将以单个文件形式出现，但仍包含与shapefile所有组件（.shx、.dbf\
    \ 和 .prj）组合起来一样多的数据。\n\n那么我应该在什么情况下使用shapefile与GeoJson呢？如果你想在Web界面中处理地理空间数据，**geojson**就是你的选择。就这样。\n\
    \n### 5.4 创建一个geojson文件\n\n在几乎没有错误的情况下创建一个GeoJSON文件可能看起来令人生畏，事实上也确实如此，但幸运的是geojson.io网站为我们完成了繁重的工作。我们将前往该网站，创建一个包含一些城市及其人口的**geojson**文件。\n\
    \n首先，网站看起来如下所示。真是一个由Mapbox驱动的超酷全球地图。\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/mapbox-front.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_40_0.png)\n\n在你的右边，<>JSON标签下，Mapbox团队已经为你开了个头，指明了将放入你的geojson文件的要素类型和要素。这些很重要，因为任何网站在解析GeoJSON文件中的信息时都会使用这些关键字。放大到肯尼亚，然后点击内罗毕点标记上方的一个点，如下图所示。使用下面图片中突出显示的标记在内罗毕上方创建一个标记。\n\
    \n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/nairobi-pin.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_40_1.png)\n\n这样做之后，你会意识到一个包含**type**、**properties**和**geometry**的新字典出现在了**features**列表中。这些新键在它们的值中提供了额外的空间和几何数据，网站使用这些数据将它们放置在网络地图的适当位置上。\n\
    \n现在转到**Table**标签页，点击新建列，如下所示。\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/table.jpg\"\
    ))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_41_0.png)\n\n点击它，在出现的图形中，为你的列命名为**City**。点击**Ok**，然后在出现的表格单元格中，输入**Nairobi**。\n\
    \n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/nairobi-named.jpg\"\
