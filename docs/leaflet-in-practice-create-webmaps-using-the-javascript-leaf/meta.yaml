    \ => {\n        console.log(`This is the error: ${error}`)\n    })\n```\n\n##\
    \ 7.5 创建自定义信息框\n\n我们的分级统计图运行完美，但缺少一些交互性。如果在它旁边补充一个信息界面会怎样？自定义信息控件就是一种实现方式。可以将控件视为允许交互的UI元素。对于我们的分级统计图，我们希望自定义信息控件能提供鼠标悬停县区的名称、总人口和人口密度的详细信息。\n\
