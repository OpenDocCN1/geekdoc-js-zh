- img_proc: true
  md: '128 CHAPTER 13. STANDARD WEBSITE WITH LEAFLET PROJECT


    # 13.6 Summary


    Having the necessary Leaflet folders in the same directory as your HTML website''s
    files prevents the Leaflet map from failing to load due to a broken path. Here
    are other lesson''s we have encountered.


    +   - In order to embed a Leaflet map into your website, you have to load the
    requisite Leaflet `<link>` and `<script>` tags into your `<head>` and where necessary,
    `<div>` elements.

    - Insert the JavaScript code that fires up your Leaflet using the `<script>` tags.
    This was the method used to insert the JavaScript file `cluster-markers.js` into
    the eLeaflet dummy website.

    - It is also important to ensure your Leaflet map appears in the right place in
    all the child webpages. For example, Leaflet also had to be embedded in the webpages
    of `about.html`, `courses.html`, `team.html`, `testimonial.html` and `contact.html`
    at the Gallery section just as it was done for their parent file- `index.html`.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Chapter 14


    # ESRI and Leaflet


    # 14.1 An overview of ESRI


    Alright. If you are a GIS practitioner, you have probably heard about ESRI, one
    of the world''s leading geospatial software and services provider. You (might)
    have also come across various ESRI basemap servers, such as ESRI topographic,
    ESRI streets and ESRI Imagery layers. They also have plugins that allow Leaflet
    users to access the ArcGIS functionalities. For example, the ESRI plugins for
    Leaflet allow you to access some ESRI basemaps and products, while also al- lowing
    you to become an ESRI ArcGIS JavaScript developer.


    To use ESRI Leaflet, you have to create an ArcGIS Developer account and also get
    an API key. Kindly do so before proceeding.


    # 14.2 ESRI Leaflet plugins


    As we had mentioned earlier, you need ESRI Leaflet plugins to experience all the
    ArcGIS functionalities possible with your Application Programming Interface (API)
    key. Remember your `map.html` file? To experience Leaflet in ESRI, add the following
    `<script>` tags to the `<head>` element of your `map.html` file.


    ```

    <!-- Load Esri Leaflet from CDN -->

    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>

    <script src="https://unpkg.com/esri-leaflet-vector@4.0.2/dist/esri-leaflet-vector.js"></script>

    ```


    Create a new JavaScript file called `esri_leaflet.js` and get ready to enjoy ESRI
    services!'
  merge: -1
  pgno: 129
- img_proc: true
  md: "# 14.3 Creating an ESRI Leaflet map\n\nOn your blank `esri_leaflet.js` file,\
    \ create a variable to store your API Key. This key is important to access your\
    \ ESRI benefits, much like the magic phrase “Open Sesame” which would open a doorway\
    \ to a cave full of treasures in the legendary story of *Ali Baba and the Forty\
    \ Thieves*!\nBelow is an example of how to access your API key from your ArcGIS\
    \ Developer account.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/esri_leaflet_api.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_130_0.png)\n\nCopy paste that\
    \ key to your `esri_leaflet.js` file.\n\n```\nconst apiKey = \"Your key\";\n```\n\
    \nLet's proceed to create a basemap. To create one, just create a variable called\
    \ `basemapEnum` that stores the ESRI basemap identifier. In ESRI Leaflet, a basemap\
    \ is called by parsing the provider name and the desired style, like so: `{Provider}:{Style\
    \ name}` or `{Provider}:{Style name}:{Component}`. In our case, we want the ArcGIS\
    \ streets basemap layer.\n\n```\nconst basemapEnum = \"ArcGIS:Streets\";\n```\n\
    \nAlright. It's about time we fired up our mapping power. Create an ESRI Leaflet\
    \ map instance much like we have always been doing.\n\n```\nconst map = L.map(\"\
    myMap\", {\n    minZoom: 2\n}).setView([0.3556, 37.5833], 6.5);\n```"
  merge: -1
  pgno: 130
- img_proc: true
  md: "# 14.4. GEOCODE SEARCH\n\nWe had created a basemap variable earlier, so we\
    \ will parse it to the `L.esri.Vector.vectorBasemapLayer` class which is responsible\
    \ for creating basemaps. Actually one can also parse the `{Provider}:{Style name}`\
    \ to the `L.esri.vector.vectorBasemapLayer()` class but our method of using variable\
    \ names looks cleaner.\n\n```\nL.esri.Vector.vectorBasemapLayer(basemapEnum, {\n\
    \    apiKey: apiKey,\n}).addTo(map);\n```\n\nNow open your `map.html` file. It\
    \ should look like below.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/esri_leaflet_basemap.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_131_0.png)\n\nNow imagine there\
    \ are other basemap styles as shown in this webpage.\n\n# 14.4 Geocode search\n\
    \nOf course there are other ESRI Leaflet functionalities. Out of curiousity, a\
    \ brief search was made to find out an ESRI plugin that loads raster layers in\
    \ the hope it would be simpler in operation compared to the georaster plugin of\
    \ Leaflet. Although both have a plugin for downloading `.jpeg` and `.png` image\
    \ formats, none is good enough for loading geospatial raster files such as `.tiff`.\
    \ Nevertheless, there are other cool services that ESRI Leaflet offers, such as\
    \ geocode search¹.\n\nFor the rest of this chapter, we shall create a geocoding\
    \ service using ESRI Leaflet.\n\n¹Geocoding is the process of converting address\
    \ or place text into a location. The geocoding service provides address and place\
    \ geocoding as well as reverse geocoding"
  merge: -1
  pgno: 131
- img_proc: true
  md: "# 14.5 Add search bar\n\nAdd the following <link> and <script> to your <head>\
    \ element.\n\n```\n<!-- Load Esri Leaflet Geocoder from CDN -->\n<link rel=\"\
    stylesheet\" href=\"https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css\"\
    >\n<script src=\"https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js\"\
    ></script>\n```\n\nWe will first add a search control widget to the topright of\
    \ our ESRI Leaflet map. Search control widgets are created using the **L.esri.Geocoding.geosearch**\
    \ class. In the below code, we have parsed the **L.esri.Geocoding.geosearch**\
    \ to the variable **searchControl**.\n\n```\nconst searchControl = L.esri.Geocoding.geosearch({\n\
    \    position: \"topright\",\n    placeholder: \"Enter an address or place e.g.\
    \ 1 York St\",\n    useMapBounds: false,\n\n}).addTo(map);\n```\n\nJust like in\
    \ Leaflet, ESRI Leaflet constructors have their options. Please refer to the options\
    \ for this specific constructor here.\n\nAnother small thing; change your **const\
    \ basemapEnum** to read **ArcGis:Navigation**.\n\n```\nconst basemapEnum = \"\
    ArcGIS:Navigation\";\n```\n\nUpon refreshing your **map.html** file, apart from\
    \ having a new basemap style, you will see a new search bar at the top right.\
    \ However, it is non-functional. It takes us nowhere.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/search_bar.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_132_0.png)"
  merge: -1
  pgno: 132
- img_proc: true
  md: "# # 14.6 Make the search bar functional\n\nIn order to make the search bar\
    \ do what it says, we will set the value of the providers key to a `arcgisOnlineProvider`.\
    \ The latter is instantiated with the constructor `L.esri.Geocoding.arcgisOnlineProvider`.\
    \ ESRI has various open source tutorials on its platform that provide succinct\
    \ and concise explanation for most of its tools.\n\n```\nconst searchControl =\
    \ L.esri.Geocoding.geosearch({\n  position: \"topright\",\n  placeholder: \"Enter\
    \ an address or place e.g. 1 York St\",\n  useMapBounds: false,\n\n  // Add provider\n\
    \  providers: [\n    L.esri.Geocoding.arcgisOnlineProvider({\n      apikey: apiKey,\n\
    \      nearby: {\n        lat: 0.3556,\n        lng: 37.5833\n      }\n    })\n\
    \  ]\n\n}).addTo(map);\n```\n\nNow try your search bar again. Some location names\
    \ appear as you type them in, and if you press **Enter** it takes you to the exact\
    \ location. This is good except for one thing: there is no marker to pinpoint\
    \ that specific address. The following section outlines how to enable ESRI create\
    \ a marker on the fly at any searched location name.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/searchable.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_133_0.png)"
  merge: -1
  pgno: 133
- img_proc: true
  md: "134   CHAPTER 14. ESRI AND LEAFLET\n\n# 14.7  Adding an auto-generated location\
    \ pin\n\nFirst add a layer group to store the geocoding results.\n\n```\nconst\
    \ results = L.layerGroup().addTo(map);\n```\n\nWe will create an event handler\
    \ to access the data from the search results. We shall also add a clearLayers\
    \ call to remove the previous data from the layer group. This is beginning to\
    \ sound complicated, but if the reader desires further clarity, they should refer\
    \ to the ESRI Leaflet geocoding tutorial.\n\n```\nsearchControl.on(\"results\"\
    , (data) => {\n    results.clearLayers();\n\n});\n```\n\nThe following loop adds\
    \ the coordinates of the searched location to the marker. This loop goes into\
    \ the searchControl code block.\n\n```\nfor (let i = data.results.length - 1;\
    \ i >= 0; i--) {\n    const marker = L.marker(data.results[i].latlng);\n\n   \
    \ results.addLayer(marker);\n\n}\n```\n\nThe lngLatString variable below will\
    \ store the rounded coordinates, and our familiar bindPopup and openPopup will\
    \ show the coordinates and our address.\n\n```\nconst lngLatString = `${Math.round(data.results[i].latlng.lng\
    \ * 100000) / 100000}, ${\n    Math.round(data.results[i].latlng.lat * 100000)\
    \ / 100000\n}`;\nmarker.bindPopup(`<b>${lngLatString}</b><p>${data.results[i].properties.LongLabel}</p>`);\n\
    \nresults.addLayer(marker);\n\nmarker.openPopup();\n```\n\nThe entire searchControl\
    \ code block should look like below.\n\n```\nsearchControl.on(\"results\", (data)\
    \ => {\n    results.clearLayers();\n```"
  merge: -1
  pgno: 134
- img_proc: true
  md: "```\nfor (let i = data.results.length - 1; i >= 0; i--) {\n    const marker\
    \ = L.marker(data.results[i].latlng);\n\n    const lngLatString = `${Math.round(data.results[i].latlng.lng\
    \ * 100000) / 100000}, ${Math.round(data.results[i].latlng.lat * 100000) / 100000}`;\n\
    \    marker.bindPopup(`<b>${lngLatString}</b><p>${data.results[i].properties.LongLabel}</p>`);\n\
    \n    results.addLayer(marker);\n\n    marker.openPopup();\n\n}\n});\n```\n\n\
    So now when you search for a particular place in the search bar and press **Enter**,\
    \ a marker and with a pop up showcasing the address and longitude-latitude coordinates\
    \ of the location should appear.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/search_success.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_135_0.png)\n\nThe ArcGIS Developers\
    \ website provides several more tutorials on using ESRI Leaflet.\n\nHere are the\
    \ files used in this exercise.\n\n# 14.8  Summary\n\nUsing ESRI Leaflet brings\
    \ many of the ArcGIS functionalities to the open source Leaflet plugin."
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Here are the lessons learnt in this chapter.


    +   - An ArcGIS Developer account is needed to use ESRI Leaflet features.

    - An Application Programming Interface (API) key serves like a real life key in
    granting the user access to ESRI Leaflet functionalities and features.

    - The standalone Leaflet and ESRI Leaflet are similar in many respects. ArcGIS
    features can be built on top of Leaflet via various ESRI Leaflet constructors
    such as `L.esri.Geocoding.arcgisOnlineProvider`.'
  merge: -1
  pgno: 136
