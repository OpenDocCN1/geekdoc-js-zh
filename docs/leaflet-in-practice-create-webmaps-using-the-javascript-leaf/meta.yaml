    \ center\n}\n```\n\n```css\n#map {\n    height: 300px;\n    width: 90%\n}\n```\n\
    \n```css\n.text {\n    font-size: 15px;\n    padding-left: 20px;\n}\n```\n\n##\
    \ 4.3 用于网络地图显示的简单 for 循环\n\n回到我们虚构的 Pro-GMO Alliance 网页的 Leaflet 地图。我们是如何将 Leaflet\
    \ 放入其中的？在不到一分钟的时间里，将 JavaScript Leaflet 文件解析到 `<script>` 标签中，并使用 `src` 属性引用它，我们的网络地图就会出现在\
    \ HTML 文件的指定位置。我们解析到 HTML 文件中的 JavaScript 文件叫做 `example-main.js`。它包含以下代码：\n\n\
    ```javascript\nvar map = L.map('map').setView([-0.302765, 36.146147], 12);\n```\n\
    \n```javascript\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap contributors</a>'\n}).addTo(map);\n```\n\n```javascript\nvar branches\
    \ = [\n    [\"Potatoes\",-0.328858, 36.008474],\n    [\"Maize\",-0.302765, 36.146147],\n\
    \    [\"Sunflower\",-0.224832, 36.159880],\n    [\"Cotton\", -0.214189, 36.135847]\n\
    ];\n\nfor (var i = 0; i < branches.length; i++) {\n    marker = new L.marker([branches[i][1],\
    \ branches[i][2]])\n        .bindPopup(branches[i][0])\n        .addTo(map);\n\
    }\n```\n\n在本书中，我们首次引入了 `for` 循环。与其他语言（如 R 和 Python）一样，JavaScript 也使用 `for` 循环来遍历项目。在我们的例子中，并且记住数组中的索引从\
    \ 0 开始，标记的弹出窗口将读取分别位于索引 1 和 2 的纬度和经度。纬度和经度由 `[branches[i][1], branches[i][2]]`\
    \ 表示。作为 `branches` 数组中第一个元素的弹出字符串位于索引 0。弹出字符串由 `branches[i][0]` 表示。在链的末尾，标记通过\
    \ `.addTo` 被添加到地图上。\n\n好的。那么关键字 `new` 呢？\n\n`new` 关键字是一个构造函数。也就是说，它创建一个空对象。可以从\
    \ `new` 对象的实例创建变量 `marker` 的多个实例。有关 `new` 关键字构造函数的更多信息，请参阅此网站。请放心，`new` 关键字并非使我们的网络地图正常工作的必需品，但学习这个\
    \ JavaScript 技巧对你来说是有益的，可以增加你的知识储备。\n\n下面是虚构的 Pro-GMO 网站嵌入我们新的网络地图后的截图。\n\n```\n\
    knitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/embedded.jpg\"))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_0.png)\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_1.png)\n\
    \nOur Branches\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_2.png)\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_3.png)\n\
    \n“我们如何将网络地图左对齐，并让其他文本位于其旁边？”这都归功于 CSS 属性 `display: flex`。`display` 是一个处理 HTML\
    \ 元素如何显示的 CSS 属性。\n\n`display` 属性将 HTML 元素对齐，以根据其在网页中指定部分内的可用空间进行填充或收缩。另一方面，CSS\
    \ 属性 `padding-left` 只是在元素周围创建空间，从而在 Leaflet 地图和地址文本之间创建一个整洁的间距。移除它将使地址文本和 Leaflet\
    \ 地图紧挨着对方。将所有这些 CSS 属性和值用于将 HTML 元素并排放置的灵感来源于此示例。\n\n完成以上步骤后，你可以认为自己已经是一个熟练的 Leaflet\
    \ 制图师，可以承担任何任务了！稍后，在第 13 章中，我们将看到如何将 Leaflet 地图插入到一个更复杂的网站中。这只是一个简单的介绍。\n\n# 4.4\
    \ 总结\n\n本章向您介绍了如何使用 CSS 来自定义网络地图的外观和位置。您还接触到了在 JavaScript 代码中使用 `for` 循环来检索地理空间信息，特别是从数组中检索。以下是本章的一些要点。\n\
    \n*   如虚构的 Pro-GMO 网页所示，Leaflet 地图可以嵌入到网站内部。\n*   可以使用 `for` 循环来遍历数组中的元素并检索地理空间信息。在本章中，`for`\
    \ 循环被用于从 `branches` 数组变量中检索经纬度坐标和文本。\n*   我们可以使用 CSS 元素，如 `display` 和 `padding-left`，来定位和定义网络地图在我们的网页上如何显示。\n"
