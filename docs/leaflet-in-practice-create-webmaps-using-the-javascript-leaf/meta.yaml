    \ orange and red. Yellow shall mark the smallest city while red shall indicate\
    \ the largest. The below code shows how this categorization is worked out.\n\n\
    ```\nL.geoJSON(cities, {\n    pointToLayer: function (feature, latlng) {\n   \
    \     if (feature.properties.Population <= 250000) {\n            return L.marker(latlng,\
    \ {\n                icon: yellowIcon\n            });\n```"
