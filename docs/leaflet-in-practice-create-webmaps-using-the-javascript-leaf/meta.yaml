    : [\n                    36.8198475311531,\n                    -1.2952871483350066\n\
    \                ],\n                \"type\": \"Point\"\n            }\n    \
    \    },\n        -- snip ---\n        {\n            \"type\": \"Feature\",\n\
    \            \"properties\": {\n                \"City\": \"Malindi\",\n     \
    \           \"Population\": \"119, 859\"\n            },\n            \"geometry\"\
    : {\n                \"coordinates\": [\n                    40.10521499751357,\n\
    \                    -3.2138767356491655\n                ],\n               \
    \ \"type\": \"Point\"\n            }\n        }\n    ]\n};\n```\n\n```\nvar map\
    \ = L.map('myMap').setView([-1.295287148, 36.81984753], 7);\n```\n\n```\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n  maxZoom: 19,\n  attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n```\n\n刷新你的 `map.html`。这确实是肯尼亚的地图，但我们的 .geojson\
    \ 要素尚未出现。我们即将改变这一点。Leaflet提供了 `L.geoJSON` 类来将GeoJSON数据添加到地图中。类名不言自明，因此我们用它来添加我们的GeoJSON要素。在其他Leaflet地图类图层下方添加以下代码。\n\
    \n```\nL.geoJSON(cities).addTo(map);\n```\n\n刷新你的 `map.html`。GeoJSON要素现在应该出现在它们精确的位置上了。\n\
    \n如果我们让标记更具交互性会怎样？比如，像我们在第3章那样显示弹出窗口？我们希望城市名称在用户点击标记时出现。很简单。只需创建一个函数来实现这一点，如这里提供的逻辑。我们根据自己的情况对其进行了自定义，以确保它引用了附加在\
    \ `properties` 键下的字典中的 `City` 键。\n\n```\nL.geoJSON(cities).bindPopup(function\
    \ (layer) {\n    return layer.feature.properties.City;\n}).addTo(map);\n```\n\n\
    这种方法有一个问题。如果我们有非常长的GeoJSON数据结构，它会扰乱我们的JavaScript文件。我们只处理了七个城市，但处理包含数百甚至数千个字典的数据是很常见的。那会使你的JavaScript文件无限延伸。\n\
    \n这就引出了另外两种方法，即使用Ajax插件和使用Fetch应用程序编程接口（API）。别被这些词吓到。休息一下，喝杯水再回来。\n\n### 5.6.2\
    \ 使用Ajax插件\n\n正如术语“插件”所暗示的，这是一个为Leaflet核心插件提供额外功能的扩展。Ajax插件可从这个链接获取。将其下载到你的目录中，最好放在与\
    \ `map.html` 和 `geojson.js` 相同的目录下。好了。在你的 `map.html` 中 `leaflet.js` 的 `src` 标签正下方，添加以下\
    \ `<script>` 标签。\n\n```\n<head>\n    -- snip --\n    <script src=\"leaflet-ajax-gh-pages/dist/leaflet.ajax.js\"\
    ></script>\n\n</head>\n-- snip --\n```\n\n这个文件将允许你将 .geojson 文件添加到你的Leaflet地图中。但是，有一个注意事项。Ajax和Fetch\
    \ API只能处理保存在网络服务器上的GeoJSON文件格式。根据经验，它们无法处理本地GeoJSON文件。作为一种解决方法，我们将GeoJSON文件保存到了Github。为方便起见，这里再次提供我们最初从\
    \ geojson.io 创建的原始文件的链接。\n\n我们将使用Ajax从Github调用我们的GeoJSON文件，如下所示。请记住使用 `//` 注释掉你的\
    \ `var cities` 和 `L.geoJSON`，因为在这种特定情况下它们是无关的。\n\n```\nvar geojsonLayer = new\
    \ L.geoJson.ajax(\"https://raw.githubusercontent.com/sammigachuhi/p\n```\n\n你的地图现在应该显示我们城市的标记了。如果你眼尖，可能已经注意到Ajax的语法与之前Leaflet的\
    \ `L.geoJSON` 不同。从后者开始，我们改用了 `L.geoJson`，并且不同于Ajax创建者网站上使用的 `var geojsonLayer\
    \ = new L.GeoJSON.AJAX(<your-geojson-file>)`，我们使用了以下语法：`L.geoJson.ajax()`（ajax和geoJson以小写字母开头）。实际上，这是经过相当长时间的网络搜索后才生效的写法。\n\
    \n就像使用 `L.geoJSON` 一样，我们也可以在调用 `.ajax` 方法后添加弹出窗口。\n\n```\nvar geojsonLayer = new\
    \ L.geoJson.ajax(\"https://raw.githubusercontent.com/sammigachuhi/p\n    .bindPopup(function\
    \ (layer) {\n        return layer.feature.properties.City;\n    }).addTo(map);\n\
    ```\n\n这样做应该会使城市名称在Leaflet地图上点击标记时显示出来。\n\n### 5.6.3 使用Fetch API\n\nFetch API是一个现代接口，允许你从网页浏览器向服务器发出HTTP请求。换句话说，它通过网络搜索资源，检索它，并将其带给你。把它想象成一只狗，你扔出一个飞碟，对你的忠实猎犬说：“*Sabretooth,\
    \ 去捡回来！*”。狗跑去追飞碟，用犬齿在空中咬住它，然后迅速带回给你。Fetch API也是同样的道理！\n\n我曾提到过我将向你展示如何检索我们存储在Github上的GeoJSON数据，我会遵守诺言！我还将尝试解释这个\
    \ *神秘的* `fetch` 是如何工作的。\n\n首先，将调用 `fetch` 函数并传递包含我们GeoJSON文本的Github URL。由于 `fetch`\
    \ 是一个API，它从 Github.io（在此例中是服务器）检索数据，并将其带到我们的笔记本电脑（客户端）。好了，IT术语说够了。让我们把它写下来。\n\n\
    ```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n```\n\n好的，下一步。一旦服务器将数据传回给我们，我们该如何处理？根据Digital Ocean的说法，响应 *实际上* 并不是原始格式的数据，而是\
    \ *一系列可以根据你想要处理信息的方式而使用的方法*。这听起来令人困惑。然而， *至少* 很清楚的是，最终目标是将我们获取的数据转换为JSON格式。将对象转换为JSON是使用\
    \ `json()` 方法完成的。我们将 `.json()` 解析到 `then` 方法，这是一个异步函数¹。在 `fetch` 函数成功后，对象被存储在方括号中的\
    \ **response** 参数中，然后函数将结果作为json对象返回。\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n```\n\
    \n将响应转换为JSON后，它仍然需要进一步处理。处理成什么？处理成GeoJSON文件，然后将其添加到我们的Leaflet地图中。\n\n```\nfetch(\"\
    https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n  \
    \  .then(function(data) {\n        L.geoJson(data).addTo(map);\n    })\n```\n\n\
    我们还将添加一个函数——`catch()` 方法。`catch()` 是一个方法，当我们的服务器响应被拒绝时，它会返回一个操作。让我们来演示一下所有这些。\n\
    \n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojso\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n  \
    \  .then(function(data) {\n        L.geoJson(data).addTo(map);\n    })\n    .catch(function(error)\
    \ {\n        console.log(`This is the error: ${error}`)\n    })\n```\n\n要看到 `catch()`\
    \ 的实际效果，请省略我们URL中的最后一个字母，使其变为 **cities-geojson.geojso**。是的，你没看错。现在只需省略字母 'n' 并重新加载你的\
    \ **map.html**。右键单击网页地图页面，并在出现的小界面中单击 **检查**。转到控制台选项卡，查看错误响应。它应该如下图所示。\n\n恢复省略的字母\
    \ 'n' 并重新加载你的 **map.html**。你的Leaflet地图应该会像使用Ajax插件或将Geojson数据硬编码到 **var cities**\
    \ 中的情况一样，覆盖显示城市标记。为了进一步锻炼你的Javascript技能，我们可以通过保留参数 **response**、**data** 和 **error**，并使用箭头函数\
    \ `=>` 来传递返回语句，从而进一步缩短我们的代码，如下所示：\n\n¹异步编程是一种技术，它使你的程序能够启动一个可能耗时较长的任务，并且在该任务运行时仍能响应其他事件，而不是必须等到该任务完成。一旦该任务完成，程序就会呈现结果。参见Mozilla\n"
