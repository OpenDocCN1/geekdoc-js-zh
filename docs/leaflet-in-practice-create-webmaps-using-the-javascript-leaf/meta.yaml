    \n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/kisumu-museum-circle.jpg\"\
    ))\n```\n\n![基苏木博物馆上方的圆形](img/264f6ca7b7ac3fbb9517b8a021818465_26_0.png)\n\n下面的代码也将创建一个稍微类似的圆形标记点，唯一的区别是在前面的代码中我们没有插入选项，并且使用\
    \ `setRadius` 方法设置了半径。在下面的第二个代码中，我们非常具体地说明了我们想要的内容——我们的规格说明被放入了花括号 `{}` 中，然后才将圆形标记点添加到我们的地图中。JavaScript\
    \ 中的括号表示你正在处理一个字典。JavaScript 甚至 Python 中的字典用于表示键值对。\n\n```javascript\nvar circle\
    \ = L.circle([-0.107637, 34.7435975], {\n    color: 'blue',\n    fillColor: 'blue',\n\
    \    fillOpacity: .5,\n    radius: 2000\n}).addTo(map);\n```\n\n正如我们之前提到的，其他标记点元素，如圆形和矩形，也可以附加弹出窗口。准备好体验一些酷炫的东西了吗？我们将为我们的圆形附加一个弹出窗口。不是普通的硬编码弹出窗口，而是依赖其他\
    \ Leaflet JavaScript 方法来生成输出的弹出窗口。在我们的例子中，我们想要一个显示圆半径的弹出窗口，而无需我们手动输入到代码中。\n\n\
    ```javascript\n// Circle marker pop up for Kisumu Museum\nvar getRadius = circle.getRadius();\n\
    circle.bindPopup(\"Radius is: \" + getRadius.toString() + \" metres\");\n```\n\
    \n在我们上面的代码中，`getRadius` 获取我们圆形标记点的半径。`bindPopup` 如前所述，将弹出窗口内容绑定到我们的圆形标记点。但有一个注意事项。变量\
    \ `getRadius` 用于打印结果，当然是2000。然而，`bindPopup` 只理解字符串，所以我们使用 `toString()` 将我们的变量结果转换为字符串。我们还添加了其他字符串，以提供一个完整的结果，让每个人都（Tom,\
    \ Dick, Harry and Harriet）都能理解。\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/circle-radius.jpg\"\
    ))\n```\n\n![圆形半径弹出窗口](img/264f6ca7b7ac3fbb9517b8a021818465_27_0.png)\n\n最后，让我们尝试使用矩形。实际上，Leaflet\
    \ 允许我们创建多边形。让我们使用多边形类来创建一个包围给定位置的矩形。复制以下坐标。\n\n```javascript\n// Draw rectangle\
    \ around Kisumu Wildlife Impala Park\nvar impalaParkCoordinates = [\n    [-0.1144753,\
    \ 34.743418],\n    [-0.115097, 34.745242],\n    [-0.114238, 34.745071],\n    [-0.114002,\
    \ 34.746101],\n    [-0.115054, 34.746787],\n    [-0.115998, 34.745586],\n    [-0.118444,\
    \ 34.746208],\n    [-0.121255, 34.744684]\n];\n```\n\n现在使用 `L.polygon` 类和一些可选参数，让我们展示基苏木野生动物黑斑羚公园的位置。\n\
    \n```javascript\n// Create a polygon using the above coordinates\nvar impalaParkPolygon\
    \ = L.polygon(impalaParkCoordinates, {\n    color: 'brown',\n    fillOpacity:\
    \ 0.4\n}).addTo(map);\n```\n\n就像我们为圆形标记点所做的那样，我们将使我们的弹出窗口内容依赖于另一个变量，在这种情况下是 `getCenter`，它获取我们多边形的中心坐标。我们曾寻找更酷的东西，比如\
    \ Leaflet 中的 `getArea`，它能在弹出窗口中自动打印出多边形的面积。不幸的是，我们没能找到它。\n\n```javascript\n//\
    \ Add popup to the polygon of Kisumu Impala Park\nvar getCenter = impalaParkPolygon.getCenter();\n\
    impalaParkPolygon.bindPopup(\"Centre is at Lat-Lon: \" + getCenter.toString()).openPopup();\n\
    ```\n\n如果你觉得圆形标记点对矩形标记点构成了太大的阻碍，请随意使用 `//` 将其注释掉。\n\n```r\nknitr::include_graphics(rep(\"\
