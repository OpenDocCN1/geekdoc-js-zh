    # 6.5 Unique custom markers


    This part may not be necessary, but it has been inserted to show you that there
    are various markers apart from the defaults provided by Leaflet. One can create
    custom markers outside of Leaflet using the Leaflet.Awesome.Markers plugin. Just
    like in the case of Ajax, you will need to provide the path to the plugin''s dependencies
    using the <script> tag. Insert the following <script> tags into map.html.


    ```

    <script src="Leaflet.awesome-markers-2.0-develop\Leaflet.awesome-markers-2.0-develop\dist\leaflet.awesome-markers.js"></script>

