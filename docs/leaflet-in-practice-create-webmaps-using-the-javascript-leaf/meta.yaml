    # Creating an interactive choropleth map


    # 7.1 What is a choropleth map?


    We will now move from markers to something larger than life – choropleth maps.
    *What the heck are choropleth maps?* You may ask. Geographers will roll their
    eyes over this term because they have come across it innumerable times throughout
    their career. However, for the sake of new readers, a choropleth map is a map
    whose geographical areas or regions are colored, shaded or patterned in relation
    to a data variable. If during election time you have seen a map that has draped
    the winning candidate in (a) particular state(s) with their party theme colors,
    then that’s a choropleth map. Most population maps are also choropleth maps. In
    this chapter, we will create a choropleth map of Kenyan counties, and make it
    interactive by leveraging the area and population characteristics of each county.


    ```

    knitr::include_graphics(rep("D:/gachuhi/my-leaflet/images/choropleth.png"))

