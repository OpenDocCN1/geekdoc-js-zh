    \ 3.4 不同类型的标记点和弹出窗口\n\n到目前为止，你已经看到了图钉标记点，但还有其他类型的标记点，比如圆形和矩形。与我们一直在试验的图钉标记点不同，这些其他标记点需要额外的选项，例如圆的半径值和矩形的经纬度坐标。让我们逐一尝试。\n\
