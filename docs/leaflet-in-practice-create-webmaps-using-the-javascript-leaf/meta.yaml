  md: '# # Chapter 11


    ## Mobile Friendly Webapps


    # ## 11.1 The need for mobile friendly web apps


    Short story. Not too long ago I was the proud owner of a famous phone brand on
    the decline. One time, when taking a photo of the iconic Ngong Hills for Wikipedia’s
    Africa Climate photo contest, the phone just died. That was it. A quick visit
    to the authorized dealer was greeted with the unbelievable and bemusing words
    of, “We no longer ship the motherboard to the country anymore.” Some healing has
    taken place, but I was totally heartbroken, and occassionally suffer some nostalgia
    of the ‘good times’ I had with my phone.


    Now back to business. Webapps can be heavy, and they can load slowly on smaller
    devices such as smartphones. Apps that load slow can put off your web app users,
    so it is prudent to customize your webapp for your user’s phones.


    For this chapter, we will work on making our cluster marker app mobile friendly.
    We shall also add other functionalities to make the web app ‘heavier’ in order
    to test to destruction if our ambitions of making our app load faster have worked.


    In order to create a mobile friendly Leaflet experience, insert the below code
    within the <head> element of your map.html. The below meta tag tells the browser
    to disable unwanted scaling of the page and instead set it to its actual size.


    ```

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
    user-scalable=no">

    ```


    # ## 11.2 The basemaps


    If you have gone through Chapter 8 where we created controls, the following will
    look familiar. We will add some basemaps and later on create their control'
