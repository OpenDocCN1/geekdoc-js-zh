  md: "10.3. BEHOLD, A CLUSTER MARKER MAP! 103\n\nDon't underestimate them. These\
    \ CSS properties are necessary to style your cluster points in a nice way that's\
    \ easy on the eye. It is also assumed you have already inserted the name of your\
    \ JavaScript file, the `cluster-marker.js` within the `<script>` tag enclosed\
    \ by the `<body>` element of your `map.html` file. If you had done the small exercise\
    \ at the beginning of the chapter, the following code should be present.\n\n```\n\
    var map = L.map('myMap').setView([-1.295287148, 36.81984753], 7);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n```\n\n```\nurl = 'https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/selected_hospitals.json'\n\
    ```\n\n# 10.3 Behold, a cluster marker map!\n\nDelete the `L.geoJson.ajax(url).addTo(map);`,\
    \ we won't need it now. Our real work of creating a cluster marker map begins\
    \ with the `markerClusterGroup` class. Let's proceed!\n\n```\nvar markers = L.markerClusterGroup();\n\
    ```\n\nWe shall use Ajax again but this time round we shall parse in some functions\
    \ to customize the appearance and functionalities of our GeoJson markers.\n\n\
    ```\nL.geoJson.ajax(url, {\n    pointToLayer: ((feature, latLng) => {\n      \
    \  return markers.addLayer(L.circleMarker(latLng));\n    }),\n\n    onEachFeature:\
    \ ((feature, layer) => {\n        layer.bindPopup(`<b>Facility Name:</b> ${feature.properties.Facility_N}\
    \ <br>\n        <b>Type:</b> ${feature.properties.Type}`)\n    })\n}).addTo(map);\n\
    ```\n\nRemember `pointToLayer` of Leaflet GeoJSON files? It defines how the GeoJson\
    \ file will appear. The `pointToLayer` retrieves the Latitude-Longitude coordinates\
    \ before finally creating circle markers out of them as enabled by `...return\
    \ markers.addLayer(L.circleMarker(latLng)),`"
