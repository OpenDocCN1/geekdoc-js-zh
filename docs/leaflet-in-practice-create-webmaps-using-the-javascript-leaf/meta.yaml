    # # Preface


    This book was written to assist the budding GIS specialist, geographer or cartographer
    who has an interest in quickly learning how to create webmaps with minimal knowledge
    of JavaScript. The aim of this book is to bring the learner up to speed on how
    to create almost any kind of webmap using Leaflet. Written from the point of a
    self-taught programmer, this is more of a guide book on how to navigate the Leaflet
    JavaScript syntax at intermediate level. Nevertheless, it is the wish of this
    writer that the book appetites you to go deeper in using programming for not only
    Geographical Information Systems (GIS) purposes, but for any other purpose that
    fascinates your mind.


    # ## Usage


    Although the author would highly recommend the reader to sequentially go through
    the entire book, for the hasty learner, each chapter from Chapter 3 onwards is
    a stand alone exercise with a link to the source code at the end of every chapter.
    The link can be found just before the **Summary** subsection. All the code scripts
    used in this book are available from this Github folder.


    https://github.com/sammigachuhi/my-leaflet-project/tree/main/my-leaflet-vs


    For the images, they are available here.


    https://github.com/sammigachuhi/my-leaflet-project/tree/main/my-leaflet/images


    Finally, this book is also available as a Portable Document File (PDF) here. For
    convenience purposes, this book is better read as a web version available here.
    This is because the web version does not clip long code along the page margins
    as is the case with the pdf.'
