    # 5.3  Why geojson?


    Yours truly could be wrong, but one advantage of **geojson** and json is that
    it''s minimal on size compared to shapefiles and it is also more portable. Shapefiles
    are dependent on other data formats that accompany it, such as .shx, .dbf, .prj
    which provide auxiliary geospatial orientation, metadata, and attributes. On the
    other hand, GeoJSON and JSON formats will come as single files but will still
    as much data as all the components of a shapefile (.shx, .dbf, and .prj) put together.


    So when do I use shapefiles vis a vis GeoJson?  If you want to work with geospatial
    data in a web interface, **geojson** is the way to go. Period.


