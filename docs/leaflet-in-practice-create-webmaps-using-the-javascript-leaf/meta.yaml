    # Using GeoJSON in Leaflet


    # 5.1 Creating a .geojson file


    So far, we have created a Leaflet map, added some aesthetics such as markers,
    and even embedded a map into a dummy website. Alright, the website wasn’t even
    close to good, but the methodology should be the same when working with other
    fully functional and better looking websites. That may be enough to give you confidence
    to start as a webmapper but not so fast! There is still more territory to cover!
    I would like to introduce another format of storing geospatial information –the
    use of .geojson files.


    # 5.2 What are .geojson files?


    .geojson files, according to the GIS leader ESRI, are an open standard geospatial
    data interchange format that represents simple geographic features and their non-spatial
    attributes. GeoJSON is based on the JavaScript Object Notation (JSON) file format
    which is a lightweight data exchange format that is easily interpretable by both
    man and machine. In very few instances does any data format please both sides
    of the divide but JSON does, and this site provides examples. Anyway, just like
    you can tell from the name, JSON is based on the JavaScript programming language.
    If you have worked with JavaScript before, it looks very much like a data format
    based on dictionaries. In essence, JSON is a large dictionary holding other *dictionaries*
    of data within it. A GeoJSON is a JSON file that follows a certain structure and
    has spatial index and geometry specifications in it. See this website for a GeoJSON
    example.


    An example of a GeoJSON file format structure is shown below:


    ```

    {

    ```'
