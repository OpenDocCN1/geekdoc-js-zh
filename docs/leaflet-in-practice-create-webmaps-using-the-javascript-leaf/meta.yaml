    \ '#cc4c02';\n    } else if (d > 400) {\n        return '#ec7014';\n    } else\
    \ if (d > 100) {\n        return '#fe9929';\n    } else if (d > 50) {\n      \
    \  return '#fec44f';\n    } else if (d > 25) {\n        return '#fee391';\n  \
    \  } else {\n        return '#ffffd4';\n    }\n}\n```\n\nNow that we've created\
    \ the function of setting colors to our json file on Leaflet, we next also have\
    \ to **create** a function that applies the color designation to the counties\
    \ in the GeoJSON file itself. Luckily, we have the **style** option from Leaflet\
    \ which is a function for precisely styling GeoJSON lines and polygons alone.\
    \ We saw it in Chapter 5 and we shall also use it here.\n\n```\nvar style = ((feature)=>\
    \ {\n    return {\n        fillColor: getColor(feature.properties.Pop_Density),\n\
    \        weight: 2,\n        opacity: 1,\n        color: 'gray',\n        fillOpacity:\
    \ 0.5\n    }\n})\n```\n\nThe above is an arrow function. Unlike regular JavaScript\
    \ function declarations which are in the format of **function** `<name of function>`\
    \ (`<parameter>`), we remove the **function** keyword, enclose everything in brackets\
    \ and put an arrow **=>** between the parameter brackets and function body. That's\
    \ just it. Arrow functions aren't so hard!"
