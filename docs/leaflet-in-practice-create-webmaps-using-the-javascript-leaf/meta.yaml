    # 5.5 Saving the Geojson to Github


    Now, based on experience, loading a local Geojson file (one within your computer
    directory) to JavaScript is a painful, if not near impossible experience. The
    resulting errors had to with servers or something. To get a way around this and
    still be able to display .geojson data in Leaflet, the GeoJson file had to be
    stored on an online server, in this case, Github. We would love to show you how
    to save data on Github, but this would make this chapter way too long. Therefore,
    and with sincere apologies, it would be best if you googled it out. Nevertheless,
    here is the GeoJSON file, and it will come in handy in the last two sub-chapters
    of this exercise.


    # 5.6 Loading the GeoJSON into Leaflet


    As they always say, there are many ways of killing a rat. There are around three
    ways in which to load GeoJson data into Leaflet, at least from our discovery.
    We shall start with the easiest and most unreliable to what we consider the best.
    Let start with the easy one, loading a .geojson file from within our Javascript
    file itself.'
