  md: '5. `<meta charset="utf-8">` - This is part of the metadata hosted by the `<head>`
    tag. We had mentioned earlier that the `<head>` contains the metadata of the webpage.
    Now here we would like to add that the `<meta>` tag found within the `<head>`
    is what defines the metadata. You can think of it as **README** text file that
    comes with any software you download. The `<meta>` tag in our case defines the
    encoding of our HTML5 document with the attribute `charset="utf-8"`. Don''t think
    about this too much. HTML5 documents have `utf-8` as their encoding. You can try
    to look up what encoding is but it''s not useful for this tutorial!


    6. `<link>` - Defines the relationship between a document and an external resource.
    It has various attributes but `rel` and `href` have been used. The former specifies
    the relationship between the current document and the linked document/resource.
    The `rel` here references the `styles.css` file as the style sheet for our HTML.
    That is, the styles for our HTML are found in the `styles.css` file. `href` on
    the other hand points the HTML document to the path of the stylesheet - the `styles.css`
    file.


    7. `<body>` - This is the crux of your webpage. If nothing is within the `<body>`
    tags, your webpage will be as empty as a blank sheet of paper. This tag is the
    home for all the other contents of the webpage such as headings, paragraphs, images,
    tables etc.


    8. `<div>` - This is a special element that lets you group similar sets of content
    together on a web page. You can use it as a generic container for associating
    similar content. In the above HTML script, we have included an `<id>` attribute
    that is in other words, a unique identifier for this section of the webpage. `<id>`s
    are useful if you want to customize the appearance of a certain part of the webpage.
    `<class>`es behave in a similar way, but the difference between `<id>` and `<class>`
    is that `<id>` has to be unique, while `<class>`es can be used more than once.


    9. `<script>` - It is used to embed executable code or data. In most cases it
    refers to JavaScript, which enhances interactivity.


    If you may have noticed above, most HTML tags end with `</name-of-tag>`. With
    a few exceptions such as `<img>`, almost all HTML tags end this way.


    # 1.3 JavaScript


    JavaScript, shortened to `.js` is the language of the web. It introduces interactivity
    to HTML files. Without it our HTML files would just remain static. Have you ever
    clicked a link or a shiny button on a website and some visual or menu popped up?
    JavaScript was the engine behind all that. Think of `.js` as the life of the party
    while HTML is just the setting. Without `.js`, creating'
