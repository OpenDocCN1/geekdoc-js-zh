  md: "# # Chapter 10\n\n# ## Cluster to reduce the clutter\n\n# ### 10.1 A map full\
    \ of clutter\n\nThere comes a time when it is convenient to coalesce several points\
    \ into a single multi-cluster point. Consider the following example: you have\
    \ a GeoJSON file with over 10000 points of houses within a densely populated island\
    \ of 5km by 5km, if by any chance such a scenario exists. Will you want to display\
    \ such a gigantic number of points within such a small area? That would be an\
    \ overkill! Moreover, the map would be incomprehensible to the viewer. Consider\
    \ the following example we set up in a new JavaScript file which we fondly called\
    \ cluster-markers.js.\n\n```\nvar map = L.map('myMap').setView([-1.295287148,\
    \ 36.81984753], 7);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n\nurl = 'https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/selected_hospitals.json'\n\
    \nL.geoJson.ajax(url).addTo(map);\n\nvar markers = L.markerClusterGroup();\n```\n\
    \nThe following is the result."
