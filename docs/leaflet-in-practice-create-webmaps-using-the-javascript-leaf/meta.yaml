    \ in which one can parse the layers they wish to be displayed on the map.\n\n\
    ```\nvar map = L.map('myMap', {\n    layers: [osm, cyc1OSM]\n}).setView([-1.295287148,\
    \ 36.81984753], 7);\n```\n\nHowever, that will only add the first basemap variable\
    \ –that for `osm` while blocking out that of `cyc1OSM`. This is shown below.\n\
    \n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/no-control.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_86_0.png)\n\n# 8.3 Creating the\
    \ controls\n\nHowever, in order to give `cyc1OSM` a fair chance, we need to store\
    \ them in an object say `var basemaps` and parse it to `L.controls.layer` which\
