    # 12.4 Summary


    A Web Mapping Service (WMS) layer in many respects looks and acts like a basemap.
    Just like Open Street Map and other similar servers, WMS layers host data through
    the internet. Here are the take homes from this chapter.


    +   - A Web Mapping Service consists of geospatial data hosted through the internet
    with standards set by the Open Geospatial Consortium (OGS).

    - The most common formats of Web Mapping Services are Web Map Services (WMS),
    Web Feature Services (WFS), Web Coverage Services (WCS), Web Processing Services
    (WPS), Web Map Tile Services (WMTS), and Web Coverage Processing Services (WCPS).

    - The `L.tileLayer.wms` class is used to load WMS layers into Leaflet.

    - Just like any other basemap, one can parse WMS layer into Leaflet controls,
    as seen with `wmsLayerTopo` and `wmsLayerTopomask`.'
- md: "## Chapter 13: Standard Website with Leaflet Project\n\n### 13.1 Get the HTML\
    \ Template\n\nBack in Chapter 4 we inserted a Leaflet map into a pale looking\
    \ website. Taking that exercise a little further, we would like to demonstrate\
    \ how Leaflet can be added to a standard, professional looking HTML website. This\
    \ chapter will train you how to insert a Leaflet map into your company's, client's\
    \ or even colleague's website.\n\nThe template used in this exercise was acquired\
    \ from Free CSS.com and is available here. Extract the files and take a look at\
    \ the HTML documents. That is, the index.html, about.html, contact.html, courses.html,\
    \ team.html and testimonial.html files. Pay special attention to the `<head>`\
    \ element and the `<div>` containing the Gallery section of the website. The Gallery\
    \ `<div>` looks like so:\n\n```html\n<div class=\"col-lg-3 col-md-6\">\n    <h4\
    \ class=\"text-white mb-3\">Gallery</h4>\n    <div class=\"row g-2 pt-2\">\n \
    \       <div class=\"col-4\">\n            <img class=\"img-fluid bg-light p-1\"\
    \ src=\"img/course-1.jpg\" alt=\"\">\n        </div>\n        <div class=\"col-4\"\
    >\n            <img class=\"img-fluid bg-light p-1\" src=\"img/course-2.jpg\"\
    \ alt=\"\">\n        </div>\n        <div class=\"col-4\">\n            <img class=\"\
    img-fluid bg-light p-1\" src=\"img/course-3.jpg\" alt=\"\">\n        </div>\n\
    \    </div>\n</div>\n```\n\nHere is where the Gallery in the eLearning webpage\
    \ is situated (bounded in red).\n\n```r\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/gallery.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_122_0.png)\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_122_1.png)\n\
    \nWhy do we want to change the gallery, or rather, to insert a Leaflet map in\
    \ its place? It seemed a good idea to replace the pretty looking pictures with\
    \ a webmap since this website is for demonstration purposes only.\n\n### 13.2\
    \ Embed Leaflet to Standard HTML Website\n\nSince we want to integrate a Leaflet\
    \ map to the eLearning website, we will have to load the requisite Leaflet links\
    \ and scripts to the eLearning dummy website’s `<head>` element, just like we\
    \ used to do to our map.html. Thereafter, we shall replace the entire gallery\
    \ section with just one `<div>` that references one of our many Leaflet JavaScript\
    \ files.\n\nReady? Let’s go.\n\nAssuming you are working on VSCode, copy all the\
    \ plugin files for Leaflet, such as the Leaflet.markercluster-master folder and\
    \ all the others you have extracted at one point or another in previous chapters.\
    \ The names of these folders are enclosed with a red border in the image below.\n\
    \n```r\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/elearning-plugins.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_123_0.png)\n\nWhy are we ensuring\
    \ that the Leaflet plugin folders are in the same directory as our eLearning template\
    \ files? It is because we want to avoid the need of tinkering with the relative\
    \ path, which has to change if the (plugin) folders were located in a different\
    \ directory from that of our eLearning website.\n\nGo to the index.html file of\
    \ your eLearning template. From the `<head>` to `</head>` tags, replace the existing\
    \ code with the following:\n\n```html\n<meta charset=\"utf-8\">\n<!-- For leaflet\
    \ and mobile compatibility -->\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n\n<title>eLEARNING\
    \ - eLearning HTML Template</title>\n<meta content=\"width=device-width, initial-scale=1.0\"\
    \ name=\"viewport\">\n<meta content=\"\" name=\"keywords\">\n<meta content=\"\"\
    \ name=\"description\">\n\n<!-- Favicon -->\n<link href=\"img/favicon.ico\" rel=\"\
    icon\">\n\n<!-- Google Web Fonts -->\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\
    >\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\
    <link href=\"https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Jost:wght@500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n\n<!-- Icon Font Stylesheet -->\n<link href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css\"\
    \ rel=\"stylesheet\">\n<link href=\"https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css\"\
    \ rel=\"stylesheet\">\n\n<!-- Libraries Stylesheet -->\n<link href=\"lib/animate/animate.min.css\"\
    \ rel=\"stylesheet\">\n<link href=\"lib/owlcarousel/assets/owl.carousel.min.css\"\
    \ rel=\"stylesheet\">\n\n<!-- Customized Bootstrap Stylesheet -->\n<link href=\"\
    css/bootstrap.min.css\" rel=\"stylesheet\">\n\n<!-- Template Stylesheet -->\n\
    <link href=\"css/style.css\" rel=\"stylesheet\">\n\n<!-- For leaflet -->\n<link\
    \ rel=\"stylesheet\" href=\"https://unpkg.com/leaflet@1.9.3/dist/leaflet.css\"\
    \n      integrity=\"sha256-kLaT2GOSpHechsozzB+fInD+zUyjE2LlWPgU04xyI=\"\n    \
    \  crossorigin=\"\"/>\n<link rel=\"stylesheet\" href=\"Leaflet.Control.Opacity-master\\\
    Leaflet.Control.Opacity-master\\Leaflet.Control.Opacity.css\" />\n<!-- For Leaflet\
    \ marker clusters -->\n<link rel=\"stylesheet\" href=\"Leaflet.markercluster-master\\\
    Leaflet.markercluster-master\\dist\\MarkerCluster.css\" />\n<link rel=\"stylesheet\"\
    \ href=\"Leaflet.markercluster-master\\Leaflet.markercluster-master\\dist\\MarkerCluster.Default.css\"\
    \ />\n\n<!-- For leaflet scripts -->\n<script src=\"https://unpkg.com/leaflet@1.9.3/dist/leaflet.js\"\
    \n        integrity=\"sha256-WBkoXOwTeyKcl0HuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=\"\n\
    \        crossorigin=\"\"></script>\n<script src=\"leaflet-ajax-gh-pages\\dist\\\
    leaflet.ajax.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\dist\\leaflet.ajax.min.js\"\
    ></script>\n<script src=\"leaflet-ajax-gh-pages\\example\\leaflet.spin.js\"></script>\n\
    <script src=\"leaflet-ajax-gh-pages\\example\\spin.js\"></script>\n<script src=\"\
    Leaflet.heat-gh-pages\\Leaflet.heat-gh-pages\\dist\\leaflet-heat.js\"></script>\n\
    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js\"\
    ></script>\n<!-- For leaflet cluster markers -->\n<script src=\"Leaflet.markercluster-1.4.1\\\
    Leaflet.markercluster-1.4.1\\dist\\leaflet.markercluster.js\"></script>\n<script\
    \ src=\"Leaflet.markercluster-1.4.1\\Leaflet.markercluster-1.4.1\\dist\\leaflet.markercluster-src.js\"\
    ></script>\n```\n\nThe first alteration we will do to our eLearning website's\
    \ HTML folder is to add the relevant Leaflet `<link>` and `<script>` tags. These\
    \ `<link>` and `<script>` tags have just been copy pasted from the `map.html`\
    \ file we have been dealing with so far.\n\nNow that we have the requisite `<link>`\
