    \ creating webmaps would not be possible since adding JavaScript code to an HTML\
    \ file using `<script>` is what makes the map appear on any website!\n\n### 1.4\
    \ CSS files\n\nCSS stands for *Cascading Style Sheet*. The CSS defines how your\
