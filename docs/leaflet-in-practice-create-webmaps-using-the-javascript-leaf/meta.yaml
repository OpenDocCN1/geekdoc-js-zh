    Here are the full files used in this chapter.


    # 5.7 Summary


    Who thought that simple GeoJSON files would be so complicated to load and see?
    Lets recap what we''ve learnt.


    +   - GeoJSON files are an open standard geospatial data interchange format that
    represents simple geographic features and their nonspatial attributes.

    - GeoJSON is based on the JavaScript Object Notation (JSON) file format known
    for its lightweight nature.

    - GeoJSON files are the *lingua franca* of working with spatial information on
    the web.

    - The geojson.io website allows a user to create a GeoJSON file interactively
    and intuitively.

    - There are three main ways of loading a GeoJSON file in Leaflet. One is by hardcoding
    the dictionary of spatial attributes in a JavaScript file. This was the first
    method that we explored.

    - The other method is by using the Ajax plugin. We call Ajax into Leaflet by inserting
    into the `<head>` element the path to the extracted Ajax files.

    - The third and last method is through use of the `fetch` API. The `fetch` API
    searches for a resource over the web, retrieves it, and brings it to your computer.'
