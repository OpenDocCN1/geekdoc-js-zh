    \ references the specific name of that ID attribute from the countless HTML tags\
    \ in `index.html`. The above CSS selector references the `<div>` with the ID-\
    \ `#myMap`.\n\nAfter reloading **index.html**, this is how our Leaflet map looks\
    \ inside the eLearning template.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/location_elearning.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_127_0.png)\n\nGood.\n\n## 13.4\
    \ Embedding Leaflet to every webpage\n\nNow click the **About, Courses, Pages/Our\
    \ Team, Pages/Testimonial** and **Contact** web pages. Is the Leaflet map there\
    \ in each case? No. It's the same ol' gallery. Imagine you will have to replace\
    \ the `<head>` and Gallery `<div>` elements of the respective about.html, courses.html,\
    \ team.html, testimonial.html and contact.html webpages here as well with the\
    \ relevant Leaflet paths! Luckily, since you have hopefully got the gist of it,\
    \ the following link contains the eLearning folder with Leaflet map embedded in\
    \ all the aforementioned web-pages.\n\n```\nelearning_template_demo\n```\n\n##\
    \ 13.5 Posting the Html website to the world\n\nThis chapter will leave out the\
    \ details of saving your files to Github. Nevertheless, as mentioned in Chapter\
    \ 11, the name **index** in your HTML file is automatically considered the root\
    \ HTML file by Github. With that said, here is the link to our eLearning website\
    \ with a Leaflet webmap embedded therein.\n\neLearning website\n\n## 13.6 Summary\n\
    \nHaving the necessary Leaflet folders in the same directory as your HTML website's\
    \ files prevents the Leaflet map from failing to load due to a broken path. Here\
    \ are other lessons we have encountered.\n\n- In order to embed a Leaflet map\
    \ into your website, you have to load the requisite Leaflet `<link>` and `<script>`\
    \ tags into your `<head>` and where necessary, `<div>` elements.\n- Insert the\
    \ JavaScript code that fires up your Leaflet using the `<script>` tags. This was\
    \ the method used to insert the JavaScript file `cluster-markers.js` into the\
    \ eLeaflet dummy website.\n- It is also important to ensure your Leaflet map appears\
    \ in the right place in all the child webpages. For example, Leaflet also had\
    \ to be embedded in the webpages of `about.html`, `courses.html`, `team.html`,\
    \ `testimonial.html` and `contact.html` at the Gallery section just as it was\
    \ done for their parent file- `index.html`.\n\n# Chapter 14\n\n# ESRI and Leaflet\n\
    \n## 14.1 An overview of ESRI\n\nAlright. If you are a GIS practitioner, you have\
    \ probably heard about ESRI, one of the world's leading geospatial software and\
    \ services provider. You (might) have also come across various ESRI basemap servers,\
    \ such as ESRI topographic, ESRI streets and ESRI Imagery layers. They also have\
    \ plugins that allow Leaflet users to access the ArcGIS functionalities. For example,\
    \ the ESRI plugins for Leaflet allow you to access some ESRI basemaps and products,\
    \ while also allowing you to become an ESRI ArcGIS JavaScript developer.\n\nTo\
    \ use ESRI Leaflet, you have to create an ArcGIS Developer account and also get\
    \ an API key. Kindly do so before proceeding.\n\n## 14.2 ESRI Leaflet plugins\n\
    \nAs we had mentioned earlier, you need ESRI Leaflet plugins to experience all\
    \ the ArcGIS functionalities possible with your Application Programming Interface\
    \ (API) key. Remember your `map.html` file? To experience Leaflet in ESRI, add\
    \ the following `<script>` tags to the `<head>` element of your `map.html` file.\n\
    \n```\n<!-- Load Esri Leaflet from CDN -->\n<script src=\"https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js\"\
    ></script>\n<script src=\"https://unpkg.com/esri-leaflet-vector@4.0.2/dist/esri-leaflet-vector.js\"\
    ></script>\n```\n\nCreate a new JavaScript file called `esri_leaflet.js` and get\
    \ ready to enjoy ESRI services!\n\n## 14.3 Creating an ESRI Leaflet map\n\nOn\
    \ your blank `esri_leaflet.js` file, create a variable to store your API Key.\
    \ This key is important to access your ESRI benefits, much like the magic phrase\
    \ “Open Sesame” which would open a doorway to a cave full of treasures in the\
    \ legendary story of *Ali Baba and the Forty Thieves*!\nBelow is an example of\
    \ how to access your API key from your ArcGIS Developer account.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/esri_leaflet_api.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_130_0.png)\n\nCopy paste that\
    \ key to your `esri_leaflet.js` file.\n\n```\nconst apiKey = \"Your key\";\n```\n\
    \nLet's proceed to create a basemap. To create one, just create a variable called\
    \ `basemapEnum` that stores the ESRI basemap identifier. In ESRI Leaflet, a basemap\
    \ is called by parsing the provider name and the desired style, like so: `{Provider}:{Style\
    \ name}` or `{Provider}:{Style name}:{Component}`. In our case, we want the ArcGIS\
    \ streets basemap layer.\n\n```\nconst basemapEnum = \"ArcGIS:Streets\";\n```\n\
    \nAlright. It's about time we fired up our mapping power. Create an ESRI Leaflet\
    \ map instance much like we have always been doing.\n\n```\nconst map = L.map(\"\
    myMap\", {\n    minZoom: 2\n}).setView([0.3556, 37.5833], 6.5);\n```\n\n## 14.4\
    \ Geocode search\n\nWe had created a basemap variable earlier, so we will parse\
    \ it to the `L.esri.Vector.vectorBasemapLayer` class which is responsible for\
    \ creating basemaps. Actually one can also parse the `{Provider}:{Style name}`\
    \ to the `L.esri.vector.vectorBasemapLayer()` class but our method of using variable\
    \ names looks cleaner.\n\n```\nL.esri.Vector.vectorBasemapLayer(basemapEnum, {\n\
    \    apiKey: apiKey,\n}).addTo(map);\n```\n\nNow open your `map.html` file. It\
    \ should look like below.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/esri_leaflet_basemap.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_131_0.png)\n\nNow imagine there\
    \ are other basemap styles as shown in this webpage.\n\n## 14.4 Geocode search\n\
    \nOf course there are other ESRI Leaflet functionalities. Out of curiosity, a\
    \ brief search was made to find out an ESRI plugin that loads raster layers in\
    \ the hope it would be simpler in operation compared to the georaster plugin of\
    \ Leaflet. Although both have a plugin for downloading `.jpeg` and `.png` image\
    \ formats, none is good enough for loading geospatial raster files such as `.tiff`.\
    \ Nevertheless, there are other cool services that ESRI Leaflet offers, such as\
    \ geocode search¹.\n\nFor the rest of this chapter, we shall create a geocoding\
    \ service using ESRI Leaflet.\n\n¹Geocoding is the process of converting address\
    \ or place text into a location. The geocoding service provides address and place\
    \ geocoding as well as reverse geocoding\n\n## 14.5 Add search bar\n\nAdd the\
    \ following `<link>` and `<script>` to your `<head>` element.\n\n```\n<!-- Load\
    \ Esri Leaflet Geocoder from CDN -->\n<link rel=\"stylesheet\" href=\"https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css\"\
    >\n<script src=\"https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js\"\
    ></script>\n```\n\nWe will first add a search control widget to the topright of\
    \ our ESRI Leaflet map. Search control widgets are created using the **L.esri.Geocoding.geosearch**\
    \ class. In the below code, we have parsed the **L.esri.Geocoding.geosearch**\
    \ to the variable **searchControl**.\n\n```\nconst searchControl = L.esri.Geocoding.geosearch({\n\
    \    position: \"topright\",\n    placeholder: \"Enter an address or place e.g.\
    \ 1 York St\",\n    useMapBounds: false,\n\n}).addTo(map);\n```\n\nJust like in\
    \ Leaflet, ESRI Leaflet constructors have their options. Please refer to the options\
    \ for this specific constructor here.\n\nAnother small thing; change your **const\
    \ basemapEnum** to read **ArcGIS:Navigation**.\n\n```\nconst basemapEnum = \"\
    ArcGIS:Navigation\";\n```\n\nUpon refreshing your **map.html** file, apart from\
    \ having a new basemap style, you will see a new search bar at the top right.\
    \ However, it is non-functional. It takes us nowhere.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/search_bar.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_132_0.png)"
