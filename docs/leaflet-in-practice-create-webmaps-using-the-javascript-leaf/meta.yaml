    \n你可以在这里获取本练习中使用的文件。\n\n## 3.5 小结\n\n本章带你进一步丰富了网络地图中可以显示的内容。你已经看到，网络地图可以提供的有用信息远不止网络画布上的简单标记和符号。弹出窗口是显示信息的一种方式，它们也可以进一步定制。通过本章的实践，你学到了以下内容：\n\
