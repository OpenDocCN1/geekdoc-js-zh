    \neLearning网站\n\n## 13.6 总结\n\n将必要的Leaflet文件夹与你的HTML网站文件放在同一目录下，可以防止Leaflet地图因路径中断而无法加载。以下是我们遇到的其他经验教训。\n\
    \n- 为了将Leaflet地图嵌入你的网站，你必须将必要的Leaflet `<link>`和`<script>`标签加载到你的`<head>`以及必要的`<div>`元素中。\n\
