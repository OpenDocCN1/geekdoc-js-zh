    \ 125\n\n# 前言\n\n本书旨在帮助新兴的GIS专家、地理学家或制图师，他们有兴趣在掌握最少JavaScript知识的情况下快速学习如何创建网页地图。本书的目标是让学习者掌握如何使用Leaflet创建几乎任何类型的网页地图。本书从自学程序员的角度撰写，更像是一本中级水平的Leaflet\
    \ JavaScript语法导航指南。然而，作者希望本书能激发你的兴趣，深入使用编程不仅用于地理信息系统(GIS)目的，也用于任何其他令你着迷的目的。\n\n\
    ## 使用说明\n\n尽管作者强烈建议读者按顺序通读全书，但对于急于求成的学习者，从第3章开始的每一章都是一个独立的练习，并在每章末尾提供源代码链接。链接可以在**总结**小节之前找到。本书中使用的所有代码脚本均可从此Github文件夹获取。\n\
    \nhttps://github.com/sammigachuhi/my-leaflet-project/tree/main/my-leaflet-vs\n\
    \n图片可从此处获取。\n\nhttps://github.com/sammigachuhi/my-leaflet-project/tree/main/my-leaflet/images\n\
    \n最后，本书也提供可移植文档文件(PDF)版本，可在此处下载。为方便起见，本书最好阅读此处提供的网页版本。这是因为网页版本不会像PDF那样在页面边缘截断长代码。\n\
    \n## 关于作者\n\nSamuel Gachuhi Ngugi毕业于内罗毕大学，持有地理与环境研究学士学位。此外，他还持有环境影响评估(EIA)证书，以及来自欧洲中期天气预报中心(ECMWF)的谷歌地球引擎、场地规划以及天气与气候机器学习等认证。他于2021年开始对编程产生兴趣。他的第一本编程书籍是2022年出版的《A\
    \ Beginner Friendly Introduction to GIS Operations in R: A practical guide》。在此之前，他于2020年出版了一本GIS教程书籍《Basic\
    \ Raster and Vector Operations using Qgis: A tutorial》。两本书都受到了学术界的热烈欢迎。\n\n##\
    \ 版权声明\n\n本书《Leaflet in Practice: Create webmaps using the JavaScript Leaflet\
    \ library》是根据署名-非商业性使用-相同方式共享4.0国际许可协议(CC BY-NC-SA 4.0)创建的。\n\n这是许可协议的人类可读摘要（而非替代品）。免责声明。\n\
    \n**你可以自由地：**\n分享 — 在任何介质或格式中复制和重新分发材料\n改编 — 重新混合、转换和构建材料\n只要您遵循许可条款，许可人就不能撤销这些自由。\n"
