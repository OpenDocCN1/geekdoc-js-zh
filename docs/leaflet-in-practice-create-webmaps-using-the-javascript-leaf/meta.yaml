  - '[PAGE 66]


    # CHAPTER 6. CREATE YOUR OWN CUSTOM MARKERS


    Anyway, here is a quick breakdown of the attributes used in **L.imageOverlay**:

    a) the **var latLngBounds** uses the **L.latLngBounds** class to set the lat-lon
    coordinates. Notice they are two coordinate lists bound with a single **[]**.
    Failing to enclose the two coordinates with **[]** results in an error. b) **var
    ImageUrl** is the image source.


    For the additional options parsed to the **L.imageOverlay()** class, they are
    described below:


    +   1. **opacity** - defines the opacity of the image overlay, it equals to 1.0
    by default. Decrease this value to make an image overlay transparent and to expose
    the underlying map layer.

    2. **errorOverlayUrl** - is a URL to the overlay image to show in place of the
    overlay that failed to load.

    3. **alt** - sets the HTML alt attribute to provide an alternative text description
    of the image. It is quite helpful in describing an image in text form just in
    case it fails to load due to poor network connectivity. Moreover, it can improve
    the Search Engine Optimization (SEO) of the website it is hosted in.

    4. **interactive** - is false by default. If true, the image overlay will emit
    mouse events when clicked or hovered.


    Full codes and files are here.


    # 6.7 Summary


    This was quite a long chapter that rendered justice on how to customize GeoJSON
    markers in Leaflet. Through the various exercises you encountered in this chapter,
    you have learnt the following:


    +   * GeoJSON files, if in the correct format, can be rendered as a standalone
    map from Github. An example is here.

    * One can customize marker colour or size based on the GeoJSON’s file attributes.
    In this chapter, the city population values were used to define the marker’s size
    and colour.

    * The **pointToLayer** key, when used as an option in **L.geoJSON**, will parse
    a particular function to every Lat-Lon coordinate of the GeoJSON object.

    * It is also possible to customize markers in the **fetch** API by simply specifying
    how they should appear, in form of functions, within the **L.geoJson** options
    environment.'
