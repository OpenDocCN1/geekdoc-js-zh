- md: "## CHAPTER 6. CREATE YOUR OWN CUSTOM MARKERS\n\n```js\nreturn layer.feature.properties.City;\n\
    }).addTo(map);\n```\n\nWe got this.\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/geojson-markers.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_58_0.png)\n\nAll cities are\
    \ marked yellow irrespective of their population or jurisdictional significance.\
    \ From a cartographer's perspective, the webmap needs more styling but before\
    \ we get there, what was the purpose of the `pointToLayer()` function? According\
    \ to the Leaflet guide, the `pointToLayer()` function is a special function for\
    \ GeoJSON variables that specifies how they should be drawn. To be more descriptive,\
    \ the function parses the `return L.marker...` function to every Lat-Lon coordinate\
    \ to make a marker appear at that point.\n\n### 6.3 Differentiate custom markers\
    \ on a webmap\n\nNow to the city markers. We would appreciate if the markers would\
    \ differentiate the cities based on a particular variable, say population. By\
    \ the way, size of cities is generally determined by population. The below code\
    \ shall categorize cities by the size of circle markers which shall be based on\
    \ the city's population. If you've seen point symbols in QGIS, get ready to see\
    \ them in action in Leaflet!\n\nComment out the earlier code and insert this:\n\
    \n```js\nL.geoJSON(cities, {\n    pointToLayer: function (feature, latlng) {\n\
    \        if (feature.properties.Population <= 250000) {\n          return L.circleMarker(latlng,\
    \ {\n            radius: 4,\n            fillColor: '#FFFF00',\n            color:\
    \ '#000',\n            weight: 1,\n            opacity: 1,\n            fillOpacity:\
    \ 0.8\n          });\n        } else if (feature.properties.Population <= 800000)\
    \ {\n          return L.circleMarker(latlng, {\n            radius: 8,\n     \
    \       fillColor: '#ff9900',\n            color: '#000',\n            weight:\
    \ 1,\n            opacity: 1,\n            fillOpacity: 0.8\n          });\n \
    \       } else {\n          return L.circleMarker(latlng, {\n            radius:\
    \ 12,\n            fillColor: '#FF0000',\n            color: '#000',\n       \
    \     weight: 1,\n            opacity: 1,\n            fillOpacity: 0.8\n    \
    \      });\n        }\n    }\n}).bindPopup(function (layer) {\n  return `City:\
    \ ${layer.feature.properties.City},<br>\n  Population: ${layer.feature.properties.Population}`;\n\
    }).addTo(map);\n```\n\nWhat you get is a map where the size of the circle markers\
    \ has been defined by the city’s population. This time round, the `pointToLayer()`\
    \ function body worked with **if/else if** statement to differentiate the radius\
    \ and color of each circle marker. Under the **if/else if** code statement block,\
    \ different circle marker specifications of radius and fillColor were inserted\
    \ for each population category. Any city with a population beyond 800000 was fitted\
    \ into the **else** block.\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/geojson-diff1.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_60_0.png)\n\nThis brings us\
    \ to why we changed the population values from strings to integers. If we were\
    \ to work with the original string values (like “1000000” in quotes), any value\
    \ beyond 1,000,000 would receive the settings of **feature.properties.Population\
    \ <= 250000**. That is, it would be displayed in the same color scheme of yellow\
    \ as a city with a population say, 25,000 people and below. That would be passing\
    \ a wrong message. The explanation for this glaring error arising from use of\
    \ string values is this: when ordering numbers enclosed in strings in JavaScript,\
    \ they will be ordered by their first character irrespective of the size of the\
    \ value. In other words, 1 is greater than 9 even though the latter is more. Thus\
    \ a city of “**800,000**” people will be treated as bigger than a city of “**1,000,000**”.\
    \ Now you see the logic of working without the quotes around the **Population**\
    \ variable, as is the case with our GeoJSON file.\n\nIn the next code sample,\
    \ we shall create city marker icons whose colors shall be determined by the size\
    \ of the city’s population. We will work with three colors: yellow, orange and\
    \ red. Yellow shall mark the smallest city while red shall indicate the largest.\
    \ The below code shows how this categorization is worked out.\n\n```js\nL.geoJSON(cities,\
    \ {\n    pointToLayer: function (feature, latlng) {\n        if (feature.properties.Population\
    \ <= 250000) {\n            return L.marker(latlng, {\n                icon: yellowIcon\n\
    \            });\n        } else if (feature.properties.Population <= 800000)\
    \ {\n          return L.marker(latlng, {\n            icon: orangeIcon\n     \
    \     });\n        } else {\n          return L.marker(latlng, {\n           \
    \ icon: redIcon\n          });\n        }\n    }\n}).bindPopup(function (layer)\
    \ {\n  return `City: ${layer.feature.properties.City},<br>\n  Population: ${layer.feature.properties.Population}`;\n\
    }).addTo(map);\n```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/geojson-diff2.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_61_0.png)\n\nIn the above\
    \ map, large cities with populations above 800,000 have been categorized with\
    \ a red marker, those with populations below 250,000 with a yellow marker and\
    \ those in between with an orange marker. In all cases, our `bindPopup()` still\
    \ contains the same settings of showing both the city name and population size.\n\
    \nThe value to the `pointToLayer()` key was assigned a function that checks if\
    \ a city’s population is within a specific range. If a city falls within the range\
    \ specified by the if statement, a particular icon -whether `yellowIcon`, `orangeIcon`\
    \ or `redIcon` is returned by the `L.marker()` function.\n\n### 6.4 Using fetch\n\
    \nRemember how `fetch` helped us retrieve data from a server in a previous chapter?\
    \ Whereas we won't repeat the entire process again (you can breathe a sigh of\
    \ relief), the same iterations of differentiating a marker icon can also be inserted\
    \ into the `fetch` API. All this is done right within the options of `L.geoJson(data,\
    \ {options})`.\n\n```js\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        L.geoJson(data, {\n            pointToLayer: function (feature,\
    \ latlng) {\n                if (feature.properties.Population <= 250000) {\n\
    \                    return L.marker(latlng, {\n                        icon:\
    \ yellowIcon\n                    });\n                } else if (feature.properties.Population\
    \ <= 800000) {\n                    return L.marker(latlng, {\n              \
    \          icon: orangeIcon\n                    });\n                } else {\n\
    \                    return L.marker(latlng, {\n                        icon:\
    \ redIcon\n                    });\n                }\n            }\n       \
    \ }).bindPopup((layer) => {\n            return `City: ${layer.feature.properties.City},<br>\n\
    \            Population: ${layer.feature.properties.Population}`\n        }).addTo(map);\n\
    \    })\n    .catch((error) => {\n        console.log(`This is the error: ${error}`)\n\
    \    })\n```\n\nThe resulting map should look like the previous one.\n\n```r\n\
    knitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/cities_colored.jpg\"\
    ))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_63_0.png)\n\n### 6.5 Unique\
    \ custom markers\n\nThis part may not be necessary, but it has been inserted to\
    \ show you that there are various markers apart from the defaults provided by\
    \ Leaflet. One can create custom markers outside of Leaflet using the Leaflet.Awesome.Markers\
    \ plugin. Just like in the case of Ajax, you will need to provide the path to\
    \ the plugin's dependencies using the `<script>` tag. Insert the following `<script>`\
    \ tags into map.html.\n\n```html\n<script src=\"Leaflet.awesome-markers-2.0-develop/Leaflet.awesome-markers-2.0-develop/dist/leaflet.awesome-markers.js\"\
    ></script>\n```\n\n```html\n<script src=\"Leaflet.awesome-markers-2.0-develop/Leaflet.awesome-markers-2.0-develop/dist/leaflet.awesome-markers.css\"\
    ></script>\n```\n\nAnd also this `<link>` tag:\n\n```html\n<link href=\"http://netdna.bootstrapcdn.com/font-awesome/4.0.0/css/font-awesome.css\"\
    \ rel=\"stylesheet\" />\n```\n\nTo make the best use of time, following the example\
    \ on their site, we simply replace the value of our icon keys with the new `L.AwesomeMarkers.icon`.\
    \ We also tweaked the colors for each icon to match those used previously. Because\
    \ these markers signify various amenities, we made some overly simplified assumptions\
    \ for the sake of demonstrating their use ie. big cities with a population above\
    \ 1,000,000 have the best malls, those with a population between 250,000 and 800,000\
    \ must be having good coffee places, and those with populations below 250,000\
    \ obviously have respectable industries. We assume fair play has been exercised\
    \ in our assumptions. So here is the code."
  mdcn: "\n## 第六章 创建自定义标记\n\n```js\nreturn layer.feature.properties.City;\n}).addTo(map);\n\
