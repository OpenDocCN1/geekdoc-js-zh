    \nHeatmaps are one of the simplest forms of maps in geography. They use color\
    \ and hue to visualize the concentration of phenomena across space. Here are the\
    \ take home notes from this chapter.\n\n- Heatmaps are a type of maps that geographically\
    \ visualize locations with patterns of higher than average occurrence of particular\
    \ variables.\n- In order to draw heatmaps using Leaflet, we have to download the\
    \ Leaflet.heat plugin. Thereafter, the path to the plugin is parsed to the script\
    \ tag of your HTML file.\n- Apart from using L.heatLayer, the other alternative\
    \ of creating heatmaps from GeoJSON data is through a combination of Ajax and\
    \ jQuery.\n\n# Chapter 10\n\n## Cluster to reduce the clutter\n\n### 10.1 A map\
    \ full of clutter\n\nThere comes a time when it is convenient to coalesce several\
    \ points into a single multi-cluster point. Consider the following example: you\
    \ have a GeoJSON file with over 10000 points of houses within a densely populated\
    \ island of 5km by 5km, if by any chance such a scenario exists. Will you want\
    \ to display such a gigantic number of points within such a small area? That would\
    \ be an overkill! Moreover, the map would be incomprehensible to the viewer. Consider\
    \ the following example we set up in a new JavaScript file which we fondly called\
    \ cluster-markers.js.\n\n```\nvar map = L.map('myMap').setView([-1.295287148,\
    \ 36.81984753], 7);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n\nurl = 'https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/selected_hospitals.json'\n\
    \nL.geoJson.ajax(url).addTo(map);\n\nvar markers = L.markerClusterGroup();\n```\n\
    \nThe following is the result.\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/clutter-points.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_102_0.png)\n\nNot good at all. The\
    \ Leaflet.markercluster plugin is what transforms a clutter map into one of neatly\
    \ arranged clustered marker points.\n\n## 10.2 Preparations\n\nCreating a cluster\
    \ marker map is fairly easy. You will first have to insert the Leaflet.markerCluster\
    \ plugin into map.html. The plugin is available from here. Insert the following\
    \ `<script>` tag into the `<head>` element of your map.html.\n\n```\n<script src=\"\
    Leaflet.markercluster-1.4.1\\Leaflet.markercluster-1.4.1\\dist\\leaflet.markerc\n\
    ```\n\nYou will also have to insert the Leaflet.markercluster CSS properties via\
    \ the `<link>` tag too. Add the following `<link>` tag for Leaflet.markercluster.\
    \ For legibility and clean code, place below the other `<link>` properties.\n\n\
    ```\n<link rel=\"stylesheet\" href=\"Leaflet.markercluster-master\\Leaflet.markercluster-master\"\
    \n```\n\nDon't underestimate them. These CSS properties are necessary to style\
    \ your cluster points in a nice way that's easy on the eye. It is also assumed\
    \ you have already inserted the name of your JavaScript file, the `cluster-marker.js`\
    \ within the `<script>` tag enclosed by the `<body>` element of your `map.html`\
    \ file. If you had done the small exercise at the beginning of the chapter, the\
    \ following code should be present.\n\n```\nvar map = L.map('myMap').setView([-1.295287148,\
    \ 36.81984753], 7);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n}).addTo(map);\n```\n\n```\nurl = 'https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/selected_hospitals.json'\n\
    ```\n\n### 10.3 Behold, a cluster marker map!\n\nDelete the `L.geoJson.ajax(url).addTo(map);`,\
    \ we won't need it now. Our real work of creating a cluster marker map begins\
    \ with the `markerClusterGroup` class. Let's proceed!\n\n```\nvar markers = L.markerClusterGroup();\n\
    ```\n\nWe shall use Ajax again but this time round we shall parse in some functions\
    \ to customize the appearance and functionalities of our GeoJson markers.\n\n\
    ```\nL.geoJson.ajax(url, {\n    pointToLayer: ((feature, latLng) => {\n      \
    \  return markers.addLayer(L.circleMarker(latLng));\n    }),\n\n    onEachFeature:\
    \ ((feature, layer) => {\n        layer.bindPopup(`<b>Facility Name:</b> ${feature.properties.Facility_N}\
    \ <br>\n        <b>Type:</b> ${feature.properties.Type}`)\n    })\n}).addTo(map);\n\
    ```\n\nRemember `pointToLayer` of Leaflet GeoJSON files? It defines how the GeoJson\
    \ file will appear. The `pointToLayer` retrieves the Latitude-Longitude coordinates\
    \ before finally creating circle markers out of them as enabled by `...return\
    \ markers.addLayer(L.circleMarker(latLng)),`\n\nHow about for **onEachFeature**?\
    \ You can guess. It simply means- *On Each Feature, do this and that.* In our\
    \ case we bind a popup of facility name and type which will appear when a circle\
    \ marker is clicked upon.\n\nActually, the above code sort of finished the work\
    \ for us.\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/cluster-marker-map.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_104_0.png)\n\nZoom in and out and watch\
    \ the circle markers *spidefy* the individual points with a popup. I have restrained\
    \ from tweaking the markers because the defaults are already good enough. See\
    \ them from this Github Page.\n\nHowever, as good practice, we need to add the\
    \ **markers** global variable to the map. We do so by using the following code.\n\
    \n```\nmap.addLayer(markers)\n```\n\n**addLayers**, just like the name suggests,\
    \ adds the given layer to the map.\n\nThe L.circleMarker in the pointToLayer key\
    \ of the Ajax function can be replaced with L.marker(). Below is how some spiderfied\
    \ hospital markers look like, but they are less aesthetically pleasing than the\
