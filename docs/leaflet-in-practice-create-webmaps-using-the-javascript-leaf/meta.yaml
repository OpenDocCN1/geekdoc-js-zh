- md: "## CHAPTER 7. CREATING AN INTERACTIVE CHOROPLETH MAP\n\n![choropleth map](img/264f6ca7b7ac3fbb9517b8a021818465_78_0.png)\n\
    \nYour code within the fetch API should look like this.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/counties_json\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        var geojson;\n        geojson = L.geoJson(data, {\n          \
    \  style: style,\n            onEachFeature: ((feature, layer) => {\n        \
    \        layer.on('mouseover', ((e) => {  // highlight county on mouse hover\n\
    \                    var layer = e.target;\n\n                    layer.setStyle({\n\
    \                        weight: 5,\n                        color: '#FFFFFF',\n\
    \                        dashArray: '',\n                        fillOpacity:\
    \ 0.7\n                    });\n\n                    layer.bringToFront();\n\
    \                }))\n\n                layer.on('mouseout', function () { //\
    \ return to original symbology upon\n                    geojson.resetStyle(this);\n\
    \                })\n\n                layer.on('click', ((e) => {  // Zoom to\
    \ county upon clicking it\n                    map.fitBounds(e.target.getBounds())\n\
    \                }))\n            })\n        }).addTo(map);\n    })\n    .catch((error)\
    \ => {\n        console.log(`This is the error: ${error}`)\n    })\n```\n\n##\
    \ 7.5 Creating a custom info\n\nOur choropleth map works perfectly but lacks some\
    \ interactivity. How about complementing it with an information interface next\
    \ to it? Custom info controls are one way to do that. Think of a control as a\
    \ UI element that allows interactivity. For our choropleth map, we want the custom\
    \ control info to provide details of the name, total population and population\
    \ density of each county hovered over.\n\n```\n// Add control\nvar info = L.control();\n\
    \ninfo.onAdd = function (map) {\n    this.div = L.DomUtil.create('div', 'info');\n\
    \    this.update();\n    return this.div;\n};\n\n// Method that we will use to\
    \ update the control based on feature properties passed\ninfo.update = function\
    \ (props) {\n    this.div.innerHTML = '<h4>Kenya Population Density</h4>' + (props\
    \ ?\n        '<b>' + props.ADM1_EN + '</b><br />' + 'Total Population' + '<br>'\
    \ + props.County_pop +\n        props.Pop_Density + ' people / km<sup>2</sup>':\
    \ 'Hover over state')\n};\n\ninfo.addTo(map);\n```\n\nOkay. Let's go through the\
    \ above code bit by bit as best as we (hopefully!) can.\n\n```\nvar info = L.control();\n\
    ```\n\nThe above creates a variable **info** that holds the base class **L.control()**\
    \ for all map controls. For example, in **L.control.zoom**, the **L.control**\
    \ class creates a zoom control in the map.\n\n```\ninfo.onAdd = function (map)\
    \ {\n    this.div = L.DomUtil.create('div', 'info');\n    this.update();\n   \
    \ return this.div;\n};\n```\n\nThe above code returns the DOM element for the\
    \ control and creates a `<div>` of class info. This is done through the help of\
    \ L.DomUtil which, according to the Leaflet website, provides utility functions\
    \ to work with the Document Object Model (DOM)¹. Actually, this new `<div>` of\
    \ class info is created when you fire up your browser but will only exist in your\
    \ browser. Don't expect it to magically appear in your static map.html file.\n\
    \n![div info element](img/264f6ca7b7ac3fbb9517b8a021818465_80_0.png)\n\nIn the\
    \ above image, the `<div>` class bounded in red wasn't there before introducing\
    \ the function containing L.DomUtil. Moving on forward, this.update() simply updates\
    \ the content of the custom info control with the attributes of every newly clicked\
    \ county.\n\n```\n// Method that we will use to update the control based on feature\
    \ properties passed\ninfo.update = function (props) {\n    this.div.innerHTML\
    \ = '<h4>Kenya Population Density</h4>' + (props ?\n        '<b>' + props.ADM1_EN\
    \ + '</b><br />' + 'Total Population' + '<br>' + props.County_pop +\n        props.Pop_Density\
    \ + ' people / km<sup>2</sup>': 'Hover over state')\n};\n\ninfo.addTo(map);\n\
    ```\n\nThe above function updates the Leaflet map with the name, population and\
    \ population density for each county. This function is passed to the variable\
    \ info.update and thereafter added to the map using the method addTo. Inside this\
    \ function exists the this.div.innerHTML. The purpose of innerHtml is to return\
    \ the HTML content of an element. Since our map is rendered in a HTML page, the\
    \ features will be returned as HTML.\n\n> ¹ The Document Object Model (DOM) is\
    \ the data representation of the objects that comprise the structure and content\
    \ of a document on the web.\n\nBecause the custom control info is a UI element,\
    \ we need to set up its symbology in our CSS file. Paste the following to your\
    \ **styles.css** file.\n\nYou may ask, \"I thought I don't have to put CSS styles\
    \ to Leaflet because it seems to come with all batteries included, style 'n all\"\
    .\n\nI get your point, but remember we created a new `<div>` called **info** that\
    \ appears when our browser is powered up. And since this `<div class=\"info ...\"\
    >` must appear when the browser is powered up, CSS styles must be used to define\
    \ its looks as well.\n\n```\n.info {\n    padding: 6px 8px;\n    font: 14px/16px\
    \ Arial, Helvetica, sans-serif;\n    background: white;\n    background: rgba(255,255,255,0.8);\n\
    \    box-shadow: 0 0 15px rgba(0,0,0,0.2);\n    border-radius: 5px;\n}\n\n.info\
    \ h4 {\n    margin: 0 0 5px;\n    color: #777;\n}\n```\n\n## 7.6 Create a legend\n\
    \nHaving created a custom control info, the following code creates the legend.\n\
    \n```\nvar legend = L.control({position: 'bottomright'});\n\nlegend.onAdd = function\
    \ (map) {\n    var div = L.DomUtil.create('div', 'info legend'),\n    grades =\
    \ [0, 25, 50, 100, 400, 700, 1400],\n    labels = [];\n\n    // loop through our\
    \ density intervals and generate a label with a colored square for each interval\n\
    \    for (var i = 0; i < grades.length; i++) {\n        div.innerHTML +=\n   \
    \         '<i style=\"background:' + getColor(grades[i] + 1) + '\"></i> ' +\n\
    \            grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' :\
    \ '+');\n    }\n    return div;\n}\n\nlegend.addTo(map);\n```\n\nObviously the\
    \ position of our legend is set using the position option in `L.control({position:\
    \ 'bottomright'});`.\n\nApart from the other elements we discussed in our custom\
    \ control info, we set the color interval of our legend through the grades array.\
    \ The for loop that follows iterates through the grades array creating a color\
    \ box for each interval.\n\nHonestly, the code to create the legend color scheme\
    \ is quite complicated. It has actually been copy pasted from the one in the Leaflet\
    \ choropleth tutorial. The strangely looking &ndash; within the for loop of creating\
    \ colors is simply how a hyphen (-) is written in HTML. But anyway, getting back\
    \ to the for loop, it essentially creates a range within each interval, such as\
    \ 0 - 25, 25 - 50 and so on. This takes place after the ? ternary operator discussed\
    \ earlier. Once it reaches the end of the loop, that is, it goes out of the range,\
    \ the + is appended to the last value from our grades array. This last bit is\
    \ made possible due to the : which returns values that are false in JavaScript.\n\
    \nThe legend also needs its CSS properties or else it will not appear in the browser.\
    \ The `<div>` class of info legend is also created when the browser fires up.\
    \ You may be wondering why info legend and not just legend. Well, dear Golden\
    \ Eye, the properties of .info class, such as background color and others are\
    \ also inherited by the legend class by virtue of the browser, as in the case\
    \ of HTML files, reading the CSS in a top-down format. The legend class will only\
    \ override those properties that also appear in the info legend class. We also\
    \ specify the CSS properties for the color intervals and text through the .legend\
    \ i class.\n\nHere's the CSS anyway.\n\n```\n.legend {\n    line-height: 18px;\n\
    \    color: #555;\n}\n.legend i {\n    width: 18px;\n    height: 18px;\n    float:\
    \ left;\n    margin-right: 8px;\n    opacity: 0.7;\n}\n```\n\nThe legend is done\
    \ and is finally added to the map."
  mdcn: "\n## 第7章 创建交互式分级统计图\n\n![分级统计图](img/264f6ca7b7ac3fbb9517b8a021818465_78_0.png)\n\
