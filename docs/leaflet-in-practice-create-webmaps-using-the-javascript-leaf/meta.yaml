    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>

    <script src="https://unpkg.com/esri-leaflet-vector@4.0.2/dist/esri-leaflet-vector.js"></script>

    ```


    Create a new JavaScript file called `esri_leaflet.js` and get ready to enjoy ESRI
    services!'
  - "[PAGE 130]\n\n# 14.3 Creating an ESRI Leaflet map\n\nOn your blank `esri_leaflet.js`\
    \ file, create a variable to store your API Key. This key is important to access\
    \ your ESRI benefits, much like the magic phrase “Open Sesame” which would open\
    \ a doorway to a cave full of treasures in the legendary story of *Ali Baba and\
    \ the Forty Thieves*!\nBelow is an example of how to access your API key from\
    \ your ArcGIS Developer account.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/esri_leaflet_api.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_130_0.png)\n\nCopy paste that\
    \ key to your `esri_leaflet.js` file.\n\n```\nconst apiKey = \"Your key\";\n```\n\
    \nLet's proceed to create a basemap. To create one, just create a variable called\
    \ `basemapEnum` that stores the ESRI basemap identifier. In ESRI Leaflet, a basemap\
    \ is called by parsing the provider name and the desired style, like so: `{Provider}:{Style\
    \ name}` or `{Provider}:{Style name}:{Component}`. In our case, we want the ArcGIS\
    \ streets basemap layer.\n\n```\nconst basemapEnum = \"ArcGIS:Streets\";\n```\n\
    \nAlright. It's about time we fired up our mapping power. Create an ESRI Leaflet\
    \ map instance much like we have always been doing.\n\n```\nconst map = L.map(\"\
    myMap\", {\n    minZoom: 2\n}).setView([0.3556, 37.5833], 6.5);\n```"
  - "[PAGE 131]\n\n# 14.4. GEOCODE SEARCH\n\nWe had created a basemap variable earlier,\
    \ so we will parse it to the `L.esri.Vector.vectorBasemapLayer` class which is\
    \ responsible for creating basemaps. Actually one can also parse the `{Provider}:{Style\
    \ name}` to the `L.esri.vector.vectorBasemapLayer()` class but our method of using\
    \ variable names looks cleaner.\n\n```\nL.esri.Vector.vectorBasemapLayer(basemapEnum,\
    \ {\n    apiKey: apiKey,\n}).addTo(map);\n```\n\nNow open your `map.html` file.\
    \ It should look like below.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/esri_leaflet_basemap.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_131_0.png)\n\nNow imagine there\
    \ are other basemap styles as shown in this webpage.\n\n# 14.4 Geocode search\n\
    \nOf course there are other ESRI Leaflet functionalities. Out of curiousity, a\
    \ brief search was made to find out an ESRI plugin that loads raster layers in\
    \ the hope it would be simpler in operation compared to the georaster plugin of\
    \ Leaflet. Although both have a plugin for downloading `.jpeg` and `.png` image\
    \ formats, none is good enough for loading geospatial raster files such as `.tiff`.\
    \ Nevertheless, there are other cool services that ESRI Leaflet offers, such as\
    \ geocode search¹.\n\nFor the rest of this chapter, we shall create a geocoding\
    \ service using ESRI Leaflet.\n\n¹Geocoding is the process of converting address\
    \ or place text into a location. The geocoding service provides address and place\
    \ geocoding as well as reverse geocoding"
  - "[PAGE 132]\n\n# 14.5 Add search bar\n\nAdd the following <link> and <script>\
    \ to your <head> element.\n\n```\n<!-- Load Esri Leaflet Geocoder from CDN -->\n\
    <link rel=\"stylesheet\" href=\"https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css\"\
    >\n<script src=\"https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js\"\
    ></script>\n```\n\nWe will first add a search control widget to the topright of\
    \ our ESRI Leaflet map. Search control widgets are created using the **L.esri.Geocoding.geosearch**\
    \ class. In the below code, we have parsed the **L.esri.Geocoding.geosearch**\
    \ to the variable **searchControl**.\n\n```\nconst searchControl = L.esri.Geocoding.geosearch({\n\
    \    position: \"topright\",\n    placeholder: \"Enter an address or place e.g.\
    \ 1 York St\",\n    useMapBounds: false,\n\n}).addTo(map);\n```\n\nJust like in\
    \ Leaflet, ESRI Leaflet constructors have their options. Please refer to the options\
    \ for this specific constructor here.\n\nAnother small thing; change your **const\
    \ basemapEnum** to read **ArcGis:Navigation**.\n\n```\nconst basemapEnum = \"\
    ArcGIS:Navigation\";\n```\n\nUpon refreshing your **map.html** file, apart from\
    \ having a new basemap style, you will see a new search bar at the top right.\
    \ However, it is non-functional. It takes us nowhere.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/search_bar.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_132_0.png)"
- md: "## 14.6 Make the search bar functional\n\nIn order to make the search bar do\
    \ what it says, we will set the value of the providers key to a `arcgisOnlineProvider`.\
    \ The latter is instantiated with the constructor `L.esri.Geocoding.arcgisOnlineProvider`.\
    \ ESRI has various open source tutorials on its platform that provide succinct\
    \ and concise explanation for most of its tools.\n\n```javascript\nconst searchControl\
    \ = L.esri.Geocoding.geosearch({\n  position: \"topright\",\n  placeholder: \"\
    Enter an address or place e.g. 1 York St\",\n  useMapBounds: false,\n\n  // Add\
    \ provider\n  providers: [\n    L.esri.Geocoding.arcgisOnlineProvider({\n    \
    \  apikey: apiKey,\n      nearby: {\n        lat: 0.3556,\n        lng: 37.5833\n\
    \      }\n    })\n  ]\n}).addTo(map);\n```\n\nNow try your search bar again. Some\
    \ location names appear as you type them in, and if you press **Enter** it takes\
    \ you to the exact location. This is good except for one thing: there is no marker\
    \ to pinpoint that specific address. The following section outlines how to enable\
    \ ESRI create a marker on the fly at any searched location name.\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_133_0.png)\n\
    \n## 14.7 Adding an auto-generated location pin\n\nFirst add a layer group to\
    \ store the geocoding results.\n\n```javascript\nconst results = L.layerGroup().addTo(map);\n\
    ```\n\nWe will create an event handler to access the data from the search results.\
    \ We shall also add a clearLayers call to remove the previous data from the layer\
    \ group. This is beginning to sound complicated, but if the reader desires further\
    \ clarity, they should refer to the ESRI Leaflet geocoding tutorial.\n\n```javascript\n\
    searchControl.on(\"results\", (data) => {\n    results.clearLayers();\n});\n```\n\
    \nThe following loop adds the coordinates of the searched location to the marker.\
    \ This loop goes into the searchControl code block.\n\n```javascript\nfor (let\
    \ i = data.results.length - 1; i >= 0; i--) {\n    const marker = L.marker(data.results[i].latlng);\n\
    \    results.addLayer(marker);\n}\n```\n\nThe lngLatString variable below will\
    \ store the rounded coordinates, and our familiar bindPopup and openPopup will\
    \ show the coordinates and our address.\n\n```javascript\nconst lngLatString =\
    \ `${Math.round(data.results[i].latlng.lng * 100000) / 100000}, ${Math.round(data.results[i].latlng.lat\
    \ * 100000) / 100000}`;\nmarker.bindPopup(`<b>${lngLatString}</b><p>${data.results[i].properties.LongLabel}</p>`);\n\
    results.addLayer(marker);\nmarker.openPopup();\n```\n\nThe entire searchControl\
    \ code block should look like below.\n\n```javascript\nsearchControl.on(\"results\"\
    , (data) => {\n    results.clearLayers();\n    for (let i = data.results.length\
    \ - 1; i >= 0; i--) {\n        const marker = L.marker(data.results[i].latlng);\n\
    \        const lngLatString = `${Math.round(data.results[i].latlng.lng * 100000)\
    \ / 100000}, ${Math.round(data.results[i].latlng.lat * 100000) / 100000}`;\n \
    \       marker.bindPopup(`<b>${lngLatString}</b><p>${data.results[i].properties.LongLabel}</p>`);\n\
    \        results.addLayer(marker);\n        marker.openPopup();\n    }\n});\n\
    ```\n\nSo now when you search for a particular place in the search bar and press\
    \ **Enter**, a marker and with a pop up showcasing the address and longitude-latitude\
    \ coordinates of the location should appear.\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_135_0.png)\n\
    \nThe ArcGIS Developers website provides several more tutorials on using ESRI\
    \ Leaflet.\n\nHere are the files used in this exercise.\n\n## 14.8 Summary\n\n\
    Using ESRI Leaflet brings many of the ArcGIS functionalities to the open source\
    \ Leaflet plugin.\n\nHere are the lessons learnt in this chapter.\n\n- An ArcGIS\
    \ Developer account is needed to use ESRI Leaflet features.\n- An Application\
    \ Programming Interface (API) key serves like a real life key in granting the\
    \ user access to ESRI Leaflet functionalities and features.\n- The standalone\
    \ Leaflet and ESRI Leaflet are similar in many respects. ArcGIS features can be\
    \ built on top of Leaflet via various ESRI Leaflet constructors such as `L.esri.Geocoding.arcgisOnlineProvider`.\n\
    \n# Chapter 15\n\n# Conclusion\n\nNow here comes the end of our book. If you have\
    \ reached this far, then congratulations! You now have the power to continue using\
    \ Leaflet to create cool webmaps, even far better than those you've encountered\
    \ in this book.\n\nI hope this book has been helpful. For anything that you found\
    \ difficult to understand, or the text lacked sufficient clarity, it had nothing\
    \ to do with you. Totally. The author wishes they could explain everything concisely,\
    \ succinctly, sweetly and clearly as though they were composing a poem. Nevertheless,\
    \ it is the author's desire he could intuitively explain concepts from the computing\
    \ world as easily as he could geographical and GIS matters.\n\n*Finis!*"
  mdcn: "\n## 14.6 让搜索栏功能生效\n\n为了让搜索栏能够实现其名称所示的功能，我们将把 providers 键的值设置为一个 `arcgisOnlineProvider`。后者是通过构造函数\
    \ `L.esri.Geocoding.arcgisOnlineProvider` 进行实例化的。ESRI 在其平台上提供了各种开源教程，为大多数工具提供了简洁明了的说明。\n\
    \n```javascript\nconst searchControl = L.esri.Geocoding.geosearch({\n  position:\
    \ \"topright\",\n  placeholder: \"Enter an address or place e.g. 1 York St\",\n\
    \  useMapBounds: false,\n\n  // Add provider\n  providers: [\n    L.esri.Geocoding.arcgisOnlineProvider({\n\
    \      apikey: apiKey,\n      nearby: {\n        lat: 0.3556,\n        lng: 37.5833\n\
    \      }\n    })\n  ]\n}).addTo(map);\n```\n\n现在再次尝试你的搜索栏。输入时会显示一些地名，如果你按下 **Enter**\
    \ 键，它会将你带到确切的位置。这很好，但有一点不足：没有一个标记来精确指出那个特定地址。下一节将概述如何让 ESRI 在搜索到的任意地名处动态创建一个标记。\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_133_0.png)\n\n## 14.7 添加自动生成的位置图钉\n\
    \n首先添加一个图层组来存储地理编码结果。\n\n```javascript\nconst results = L.layerGroup().addTo(map);\n\
    ```\n\n我们将创建一个事件处理程序来访问搜索结果中的数据。我们还将添加一个 clearLayers 调用，以从图层组中移除先前的数据。这听起来开始有点复杂了，但如果读者希望进一步了解清楚，应参考\
    \ ESRI Leaflet 地理编码教程。\n\n```javascript\nsearchControl.on(\"results\", (data)\
    \ => {\n    results.clearLayers();\n});\n```\n\n以下循环将搜索位置的坐标添加到标记中。此循环放入 searchControl\
    \ 代码块内。\n\n```javascript\nfor (let i = data.results.length - 1; i >= 0; i--) {\n\
    \    const marker = L.marker(data.results[i].latlng);\n    results.addLayer(marker);\n\
    }\n```\n\n下面的 lngLatString 变量将存储四舍五入后的坐标，而我们熟悉的 bindPopup 和 openPopup 将显示坐标和我们的地址。\n\
    \n```javascript\nconst lngLatString = `${Math.round(data.results[i].latlng.lng\
    \ * 100000) / 100000}, ${Math.round(data.results[i].latlng.lat * 100000) / 100000}`;\n\
    marker.bindPopup(`<b>${lngLatString}</b><p>${data.results[i].properties.LongLabel}</p>`);\n\
    results.addLayer(marker);\nmarker.openPopup();\n```\n\n完整的 searchControl 代码块应如下所示。\n\
    \n```javascript\nsearchControl.on(\"results\", (data) => {\n    results.clearLayers();\n\
    \    for (let i = data.results.length - 1; i >= 0; i--) {\n        const marker\
    \ = L.marker(data.results[i].latlng);\n        const lngLatString = `${Math.round(data.results[i].latlng.lng\
    \ * 100000) / 100000}, ${Math.round(data.results[i].latlng.lat * 100000) / 100000}`;\n\
    \        marker.bindPopup(`<b>${lngLatString}</b><p>${data.results[i].properties.LongLabel}</p>`);\n\
    \        results.addLayer(marker);\n        marker.openPopup();\n    }\n});\n\
    ```\n\n所以现在，当你在搜索栏中搜索特定地点并按下 **Enter** 键时，应该会出现一个标记及其弹出窗口，展示该位置的地址和经纬度坐标。\n\n\
    ![](img/264f6ca7b7ac3fbb9517b8a021818465_135_0.png)\n\nArcGIS Developers 网站还提供了更多关于使用\
    \ ESRI Leaflet 的教程。\n\n以下是本练习中使用的文件。\n\n## 14.8 总结\n\n使用 ESRI Leaflet 将许多 ArcGIS\
    \ 功能带到了开源的 Leaflet 插件中。\n\n以下是本章学到的经验教训。\n\n- 需要一个 ArcGIS 开发者账户才能使用 ESRI Leaflet\
    \ 功能。\n- 应用程序编程接口（API）密钥就像现实世界中的钥匙，用于授予用户访问 ESRI Leaflet 功能和特性的权限。\n- 独立的 Leaflet\
    \ 和 ESRI Leaflet 在许多方面相似。可以通过各种 ESRI Leaflet 构造函数（如 `L.esri.Geocoding.arcgisOnlineProvider`）在\
    \ Leaflet 之上构建 ArcGIS 功能。\n\n# 第15章\n\n# 结语\n\n现在，我们的书即将结束。如果你已经读到了这里，那么恭喜你！你现在有能力继续使用\
    \ Leaflet 创建酷炫的网络地图了，甚至可能比你在本书中遇到的那些更好。\n\n我希望这本书对你有所帮助。对于任何你觉得难以理解的地方，或者文本表述不够清晰的地方，那绝不是你的问题。完全不是。作者希望他能够简洁、精炼、清晰明了地解释一切，就像在创作一首诗。然而，作者渴望能像解释地理和地理信息事务一样，直观地解释计算领域的概念。\n\
    \n*终！*\n"
