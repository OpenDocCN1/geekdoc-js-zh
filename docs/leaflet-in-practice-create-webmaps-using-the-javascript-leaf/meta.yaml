    \ 125\n\n# Preface\n\nThis book was written to assist the budding GIS specialist,\
    \ geographer or cartographer who has an interest in quickly learning how to create\
    \ webmaps with minimal knowledge of JavaScript. The aim of this book is to bring\
    \ the learner up to speed on how to create almost any kind of webmap using Leaflet.\
    \ Written from the point of a self-taught programmer, this is more of a guide\
    \ book on how to navigate the Leaflet JavaScript syntax at intermediate level.\
    \ Nevertheless, it is the wish of this writer that the book appetites you to go\
    \ deeper in using programming for not only Geographical Information Systems (GIS)\
    \ purposes, but for any other purpose that fascinates your mind.\n\n## Usage\n\
    \nAlthough the author would highly recommend the reader to sequentially go through\
    \ the entire book, for the hasty learner, each chapter from Chapter 3 onwards\
    \ is a stand alone exercise with a link to the source code at the end of every\
    \ chapter. The link can be found just before the **Summary** subsection. All the\
    \ code scripts used in this book are available from this Github folder.\n\nhttps://github.com/sammigachuhi/my-leaflet-project/tree/main/my-leaflet-vs\n\
    \nFor the images, they are available here.\n\nhttps://github.com/sammigachuhi/my-leaflet-project/tree/main/my-leaflet/images\n\
    \nFinally, this book is also available as a Portable Document File (PDF) here.\
    \ For convenience purposes, this book is better read as a web version available\
    \ here. This is because the web version does not clip long code along the page\
    \ margins as is the case with the pdf.\n\n## About the Author\n\nSamuel Gachuhi\
    \ Ngugi is a graduate of the University of Nairobi holding a Bachelor of Arts\
    \ degree in Geography and Environmental Studies. He also holds a certificate in\
    \ Environmental Impact Assessment (EIA) in addition to certifications in Google\
    \ Earth Engine, Site Planning and Machine Learning for Weather and Climate from\
    \ the European Commission for Medium Range Weather Forecasting (ECMWF) among others.\
    \ He began to gain an interest in programming in 2021. His first programming book\
    \ was *A Beginner Friendly Introduction to GIS Operations in R: A practical guide*\
    \ published in 2022. Prior to this he had also published a GIS tutorial book entitled\
    \ *Basic Raster and Vector Operations using Qgis: A tutorial* in 2020. Both have\
    \ been warmly received by the academic community.\n\n## Copyright\n\nThis book,\
    \ *Leaflet in Practice: Create webmaps using the JavaScript Leaflet library* has\
    \ been created under the Attribution-NonCommercial-ShareAlike 4.0 International\
    \ (CC BY-NC-SA 4.0).\n\nThis is a human-readable summary of (and not a substitute\
    \ for) the license. Disclaimer.\n\n**You are free to:**\nShare — copy and redistribute\
    \ the material in any medium or format\nAdapt — remix, transform, and build upon\
    \ the material\nThe licensor cannot revoke these freedoms as long as you follow\
    \ the license terms."
