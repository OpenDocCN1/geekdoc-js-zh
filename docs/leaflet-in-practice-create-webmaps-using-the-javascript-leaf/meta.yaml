    # 10.5 Summary


    Cluster marker points are a neat way of displaying several points. Upon zooming
    out, the spatially sparsed points coalesce to a single unit displaying a figure
    standing for the number of markers it holds. Upon zooming in, the points spiderfy,
    (think of spreading out) to their appropriate locations. Here are the lessons
    from this chapter.


    +   - Clustering points is at times useful for map neatness. In Leaflet, this
    is made possible with the `Leaflet.markercluster` plugin.

    - It is possible to customize how the spiderfied marker points will appear. For
    example, instead of settling for the default styles of individual markers, we
    used the circle markers to show individual points.

    - It is also possible to add events to the spiderfied marker points. When clicked,
    the spiderfied marker points can show a popup, or trigger any other event as specified
    in its code block.'
