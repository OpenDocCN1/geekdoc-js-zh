  md: '# 8.6 Summary


    Unlike paper maps, webmaps provide us the ability to include several basemaps
    and overlays all in one platform. Here''s is what you have learnt from this chapter.


    +   - Several basemaps and overlays can be parsed into Leaflet by holding the
    basemap and overlay variable names in a JavaScript dictionary object.

    - To create a layers control, parse the JavaScript object containing the basemap
    and overlay names to the `L.control.layers()` class.

    - GeoJSON features can also be parsed to the layer control. All that is needed
    is to save the function calling the GeoJSON file into a variable. For example,
    the Ajax function `var cities` was parsed to the `L.control.layers()` class.

    - Scales are useful for size and length estimation, even in webmaps. Leaflet provides
    the `L.control.scale` class to add custom scales to your webmap.'
