  md: "```\n}))\n    })\n    }).addTo(map);\n})\n.catch((error) => {\n    console.log(`This\
    \ is the error: ${error}`)\n})\n```\n\n# 7.5 Creating a custom info\n\nOur choropleth\
    \ map works perfectly but lacks some interactivity. How about complementing it\
    \ with an information interface next to it? Custom info controls are one way to\
    \ do that. Think of a control as an UI element that allows interactivity. For\
    \ our choropleth map, we want the custom control info to provide details of the\
    \ name, total population and population density of each county hovered over.\n\
    \n```\n// Add control\nvar info = L.control();\n\ninfo.onAdd = function (map)\
    \ {\n    this.div = L.DomUtil.create('div', 'info');\n    this.update();\n   \
    \ return this.div;\n};\n\n// Method that we will use to update the control based\
    \ on feature properties passed\ninfo.update = function (props) {\n    this.div.innerHTML\
    \ = '<h4>Kenya Population Density</h4>' + (props ?\n        '<b>' + props.ADM1_EN\
    \ + '</b><br />' + 'Total Population' + '<br>' + props.County_pop +\n        props.Pop_Density\
    \ + ' people / km<sup>2</sup>': 'Hover over state')\n};\n\ninfo.addTo(map);\n\
    ```\n\nOkay. Let's go through the above code bit by bit as best as we (hopefully!)\
    \ can.\n\n```\nvar info = L.control();\n```\n\nThe above creates a variable **info**\
    \ that holds the base class **L.control()** for all map controls. For example,\
    \ in **L.control.zoom**, the **L.control** class creates a zoom control in the\
    \ map."
