    8. `<div>` - This is a special element that lets you group similar sets of content\
    \ together on a web page. You can use it as a generic container for associating\
    \ similar content. In the above HTML script, we have included an `<id>` attribute\
    \ that is in other words, a unique identifier for this section of the webpage.\
    \ `<id>`s are useful if you want to customize the appearance of a certain part\
    \ of the webpage. `<class>`es behave in a similar way, but the difference between\
