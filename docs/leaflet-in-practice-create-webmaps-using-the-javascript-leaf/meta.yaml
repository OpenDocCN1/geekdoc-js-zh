  - "[PAGE 77]\n\n# 7.4. HIGHLIGHT FEATURES\n\nThe purpose of **on** method is to\
    \ add an event listener. Event listeners in JavaScript are functions that run\
    \ a code when the browser user interacts with the browser in a specific way. Now\
    \ what **on** method does is that it triggers the event listener **mouseover**\
    \ for each county in our GeoJSON layer. The **mouseover** event is what makes\
    \ our counties be highlighted and ‘pop’ out when a screen pointer is *over* them.\n\
    \nSince the change in state of an element in HTML is known as an event (denoted\
    \ as **e** in our case), the **e.target** property returns the element on which\
    \ the event is occurring on. Since it’s a particular county in our case, we proceed\
    \ to change its symbology through the parameters in the **setStyle** function.\
    \ Thereafter we use the **bringToFront** method to make the element in which the\
    \ event has happened on to ‘pop’ out above the rest.\n\nRemember we had mentioned\
    \ we also want the counties to be reset to their default status when one hovers\
    \ out to some other county or outside the map altogether. The following code does\
    \ the job.\n\n```\nlayer.on('mouseout', function() {\n             geojson.resetStyle(this);\n\
    \           })\n```\n\nWe use the **resetStyle** function to return the layer\
    \ to default settings but there is a twist. In the **resetStyle** case, we add\
    \ the argument **this** in parenthesis to refer to the element that was received.\
    \ In other words, when the mouse ‘hovers out’ of a county, the element will revert\
    \ to its original symbology.\n\nBefore, we end this monologue, we ensure we pass\
    \ the variable **geojson** to **resetStyle** function or else it won’t work. This\
    \ appears to be the *modus operandi* for resetting styles in Leaflet as shown\
    \ in this Stack Overflow question and also here.\n\nFinally, we mentioned we want\
    \ to zoom to a particular county upon clicking it. The following code fits our\
    \ map to the bounds of the particular county that was clicked. Note that **fitBounds**\
    \ is parsed **getBounds** which gets the boundaries of the county clicked upon.\
    \ The browser is able to identify the county clicked upon through the help of\
    \ the **e** parameter and **e.target**.\n\n```\nlayer.on('click', ((e) => {\n\
    \             map.fitBounds(e.target.getBounds())\n           }))\n```\n\n```\n\
