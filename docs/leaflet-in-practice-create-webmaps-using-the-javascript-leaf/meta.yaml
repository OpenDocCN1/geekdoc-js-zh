  - "[PAGE 60]\n\n# CHAPTER 6. CREATE YOUR OWN CUSTOM MARKERS\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_60_0.png)\n\
    \nThis brings us to why we changed the population values from strings to integers.\
    \ If we were to work with the original string values (like “1000000” in quotes),\
    \ any value beyond 1, 000, 000 would receive the settings of **feature.properties.Population\
    \ <= 250000**. That is, it would be displayed in the same color scheme of yellow\
    \ as a city with a population say, 25, 000 people and below. That would be passing\
    \ a wrong message. The explanation for this glaring error arising from use of\
    \ string values is this: when ordering numbers enclosed in strings in JavaScript,\
    \ they will be ordered by their first character irrespective of the size of the\
    \ value. In other words, 1 is greater than 9 even though the latter is more. Thus\
    \ a city of “**800, 000**” people will be treated as bigger than a city of “**1,\
    \ 000, 000**”. Now you see the logic of working without the quotes around the\
    \ **Population** variable, as is the case with our GeoJSON file.\n\nIn the next\
    \ code sample, we shall create city marker icons whose colors shall be determined\
