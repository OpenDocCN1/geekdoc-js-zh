    \    <div id=\"map\">\n      <script src=\"example-main.js\"></script>\n    </div>\n\
    \    <div class=\"text\">\n      <h1>Address</h1>\n      <p>\n        P.O. Box\
    \ 55044, Nakuru\n      </p>\n    </div>\n  </div>\n</body>\n</html>\n```\n\nSince\
    \ this is a geospatial book, we shall not go through every line of the HTML script\
    \ above. It just a webpage containing some text, some pictures and a webmap. The\
    \ webmap is the centre of our interest in this chapter. We at least do know how\
    \ to create a Leaflet map, but how do we fit it inside a webpage?\n\nBefore we\
    \ head there, let's insert the CSS file, which looks like this.\n\n```css\n/*\
    \ Three image containers (use 25% for four, and 50% for two, etc) */\n.column\
    \ {\n  float: left;\n  width: 33.33%;\n  padding: 5px;\n}\n\n/* Clear floats after\
    \ image containers */\n.row::after {\ncontent: \"\";\nclear: both;\ndisplay: table;\n\
    }\n```\n\n```css\n/* Styling the map */\n.container {\n    display: flex;\n  \
    \  align-items: center;\n    justify-content: center\n}\n```\n\n```css\n#map {\n\
    \    height: 300px;\n    width: 90%\n}\n```\n\n```css\n.text {\n    font-size:\
    \ 15px;\n    padding-left: 20px;\n}\n```\n\n## 4.3 A simple for loop for webmap\
    \ display\n\nBack to the Leaflet map of our dummy Pro-GMO Alliance webpage. How\
    \ did we put the Leaflet in there? In just under a minute, parsing the JavaScript\
    \ Leaflet file to the `<script>` tag and referencing it using the `src` attribute\
    \ makes our webmap appear at its placed position in the HTML file. The JavaScript\
    \ file we parsed to our HTML file is called `example-main.js`. It contains the\
    \ following code:\n\n```javascript\nvar map = L.map('map').setView([-0.302765,\
    \ 36.146147], 12);\n```\n\n```javascript\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap contributors</a>'\n}).addTo(map);\n```\n\n```javascript\nvar branches\
    \ = [\n    [\"Potatoes\",-0.328858, 36.008474],\n    [\"Maize\",-0.302765, 36.146147],\n\
    \    [\"Sunflower\",-0.224832, 36.159880],\n    [\"Cotton\", -0.214189, 36.135847]\n\
    ];\n\nfor (var i = 0; i < branches.length; i++) {\n    marker = new L.marker([branches[i][1],\
    \ branches[i][2]])\n        .bindPopup(branches[i][0])\n        .addTo(map);\n\
    }\n```\n\nFor the first time in this book, we are introducing the `for` loop.\
    \ As is the case in other languages such as R and Python, JavaScript also uses\
    \ the `for` loop to iterate over items. In our case, and remembering that indexing\
    \ in arrays begins from 0, the marker popups will read the latitudes and longitudes\
    \ which are at index 1 and 2 respectively. The lat-lon are indicated by (`[branches[i][1],\
    \ branches[i][2]]`). The popup strings, which appear as the first elements in\
    \ the `branches` array, are at index 0. The popup strings are indicated by `branches[i][0]`.\
    \ At the end of the chain the markers are added to the map with `.addTo`.\n\n\
    Alright. How about the keyword `new`?\n\nThe `new` keyword is a constructor. That\
    \ is, it creates an empty object. Many instances of the variable `marker` can\
    \ be created from the instance of `new` object. For more information on the `new`\
    \ keyword constructor, see this website. Be rest assured that the `new` keyword\
    \ isn't mandatory to make the webmap to work in our case but its helpful to learn\
    \ another JavaScript trick to add to your hat.\n\nBelow is a snapshot of how the\
    \ dummy Pro-GMO website looks like with our newly embedded webmap.\n\n```\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/embedded.jpg\"))\n```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_0.png)\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_1.png)\n\nOur Branches\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_2.png)\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_35_3.png)\n\n\"How are we able to align\
    \ the webmap to the left and also make other text stand aside to it?\" This is\
    \ all thanks to the CSS property `display: flex`. `display` is a CSS property\
    \ that deals with how HTML elements are displayed.\n\nThe `display` property aligns\
    \ a HTML element to fill or shrink according to the space available within its\
    \ assigned portion in the webpage. On the other hand, the CSS property `padding-left`\
    \ just creates space all around the element, thus creating a neat space between\
    \ the Leaflet map and the address text. Removing this will just make the address\
    \ text and the Leaflet map touch each other edge to edge. The inspiration to use\
    \ all these CSS properties and values in placing HTML elements side-by-side emanated\
    \ from this example.\n\nHaving done the above, you can consider you are as good\
    \ a Leaflet mapper to undertake any task! Later on, in Chapter 13, we shall see\
    \ how to insert a Leaflet map in a more sophisticated website. This was just a\
    \ gentle introduction.\n\n# 4.4 Summary\n\nThis chapter has introduced you on\
    \ how you can use CSS to customize the appearance and positioning of your webmap.\
    \ You have also encountered the use of `for` loop in JavaScript code to retrieve\
    \ geospatial information, particularly from arrays. Here are some of the take\
    \ aways from this chapter.\n\n* Leaflet maps can be embedded inside a website\
    \ as demonstrated in the dummy Pro-GMO webpage.\n* One can use `for` loops to\
    \ iterate over elements from an array and retrieve geospatial information. In\
    \ this chapter, the `for` loop was used to retrieve both latitude-longitude coordinates\
    \ and text from the `branches` array variable.\n* We can use CSS elements, such\
    \ as `display` and `padding-left` to position and define how a webmap shall be\
    \ displayed on our webpage."
