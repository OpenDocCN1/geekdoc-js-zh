  - "[PAGE 82]\n\n# CHAPTER 7. CREATING AN INTERACTIVE CHOROPLETH MAP\n\n```\nlegend.addTo(map);\n\
    ```\n\nObviously the position of our legend is set using the position option in\
    \ L.control({position: 'bottomright'});.\n\nApart from the other elements we discussed\
    \ in our custom control info, we set the color interval of our legend through\
    \ the grades array. The for loop that follows iterates through the grades array\
    \ creating a color box for each interval.\n\nHonestly, the code to create the\
    \ legend color scheme is quite complicated. It has actually been copy pasted from\
    \ the one in the Leaflet choropleth tutorial. The strangely looking &ndash; within\
    \ the for loop of creating colors is simply how a hyphen (-) is written in HTML.\
    \ But anyway, getting back to the for loop, it essentially creates a range within\
    \ each interval, such as 0 - 25, 25 - 50 and so on. This takes place after the\
    \ ? ternary operator discussed earlier. Once it reaches the end of the loop, that\
    \ is, it goes out of the range, the + is appended to the last value from our grades\
    \ array. This last bit is made possible due to the : which returns values that\
    \ are false in JavaScript.\n\nThe legend also needs its CSS properties or else\
    \ it will not appear in the browser. The <div> class of info legend is also created\
    \ when the browser fires up. You may be wondering why info legend and not just\
    \ legend. Well, dear Golden Eye, the properties of .info class, such as background\
    \ color and others are also inherited by the legend class by virtue of the browser,\
    \ as in the case of HTML files, reading the CSS in a top-down format. The legend\
    \ class will only override those properties that also appear in the info legend\
    \ class. We also specify the CSS properties for the color intervals and text through\
    \ the .legend i class.\n\nHere's the CSS anyway.\n\n```\n.legend {\n    line-height:\
    \ 18px;\n    color: #555;\n}\n.legend i {\n    width: 18px;\n    height: 18px;\n\
    \    float: left;\n    margin-right: 8px;\n    opacity: 0.7;\n}\n```\n\nThe legend\
    \ is done and is finally added to the map."
- md: "knitr::include_graphics('D:/gachuhi/my-leaflet/images/choropleth-legend.jpg')\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_83_0.png)\n\nThe full code files are\
    \ available from here.\nWhen creating choropleth maps, aim for challenging and\
    \ impacting the reader rather than merely informing.\n\n## 7.7 Summary\n\nThis\
    \ chapter was long and hard if not confusing. Nevertheless, here’s our take home\
    \ from this chapter:\n\n-   Choropleth maps are maps whose geographical areas\
    \ or regions are colored, shaded or patterned in relation to a data variable.\
    \ Good examples of choropleth maps are national population maps.\n-   Ternary\
    \ operators are short forms of the `if...else` statement. In a ternary operator,\
    \ any statement to the right of the ? is returned as true if it agrees with the\
    \ value to the left of the ?. Conversely, any value after the colon : is returned\
    \ if the value to the right ? is false.\n-   `style` is a special key in the `L.geoJson`\
    \ class that applies custom styles to each layer in the GeoJSON file.\n-   `mouseover`\
    \ is an event listener that triggers a certain action when a screen pointer is\
    \ over a certain feature.\n-   We can reset features back to their defaults using\
    \ `resetStyle`.\n-   The `L.control()` class is the base class for enabling most\
    \ Leaflet controls. For example, the `L.control.zoom` creates the zoom controls.\n\
    -   `L.control()` can also be used to customize the appearance and information\
    \ displayed by the legend.\n\n# Chapter 8: Layer Groups and Controls\n\n## 8.1\
    \ Purpose of layer groups and controls\n\nSometimes, one may wish for their webmap\
    \ to consist of several baselayers or overlay maps. Suppose you want your Leaflet\
    \ to have two basemap layers, and an additional overlay with the option of switching\
    \ to any of them, how would you proceed?\n\n## 8.2 Set up the basemaps\n\nIn order\
    \ to create controls, we have to parse the objects holding our map variables into\
    \ a `L.control.layers` class. Thereafter, the `L.controls.layers` class is used\
    \ to parse the object values to the Leaflet map and create a UI control. To demonstrate\
    \ this, open a new JavaScript file and name it `groups_controls.js`. Insert the\
    \ following code which will save our basemaps to the respective variables of `osm`\
    \ and `cyclOSM`.\n\n```javascript\nvar osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n});\n\nvar cyclOSM = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 20,\n    attribution: '<a href=\"https://github.com/cyclosm/cyclosm-cartocss-style/releases\"\
    \ title=\"Cyclosm\">'\n}); // the CyclOSM tile layer available from Leaflet servers\n\
    ```\n\nWe will pass the above two variables of `osm` and `cyclOSM` to the `L.map`\
    \ class which has an option of `layers` in which one can parse the layers they\
    \ wish to be displayed on the map.\n\n```javascript\nvar map = L.map('myMap',\
    \ {\n    layers: [osm, cyclOSM]\n}).setView([-1.295287148, 36.81984753], 7);\n\
    ```\n\nHowever, that will only add the first basemap variable –that for `osm`\
    \ while blocking out that of `cyclOSM`. This is shown below.\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/no-control.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_86_0.png)\n\n## 8.3 Creating the controls\n\
    \nHowever, in order to give `cyclOSM` a fair chance, we need to store them in\
    \ an object say `var basemaps` and parse it to `L.controls.layer` which shall\
    \ create a checkbutton for each basemap. The below code does just that.\n\n```javascript\n\
    // Set object for the basemaps\nvar basemaps = {\n    \"OpenStreetMap\": osm,\n\
    \    'cycleOsm': cyclOSM,\n}\n\nL.control.layers(basemaps).addTo(map);\n```\n\n\
    This is the result you get.\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/controls.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_87_0.png)\n\n## 8.4 Adding overlay\
    \ maps\n\nNow we have seen how to add two or more basemaps to Leaflet and make\
    \ all of them appear in the layer control. Adding an overlay map follows the same\
    \ procedure as well.\n\nThe first overlay we would like to create is a choropleth\
    \ map displaying the percentage of conventional households with access to main\
    \ sewers as per the 2019 census. For simplicity purposes and to bypass errors\
    \ we faced, we shall reuse the Ajax plugin for fetching GeoJSON files from online\
    \ servers. As a reminder, we load Ajax into Leaflet by inserting it to the following\
    \ `<script>` tags of our map.html.\n\n```html\n<script src=\"leaflet-ajax-gh-pages\\\
    dist\\leaflet.ajax.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\dist\\\
    leaflet.ajax.min.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\example\\\
    leaflet.spin.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\example\\spin.js\"\
    ></script>\n```\n\nUsing fetch API to load the json file brought up several errors\
    \ requiring out-of-the-box thinking to solve, but using the alternative Ajax plugin\
    \ was a safe landing. The following chunks of code will add the color function\
    \ and styling for our countrywide sanitation map. The resulting coloring function\
    \ shall be parsed to the Ajax function.\n\n```javascript\n//// Adding some color\n\
    function getColor(d) {\n    return d > 20 ? '#3288bd' :\n            d > 10 ?\
    \ '#99d594' :\n            d > 6 ? '#e6f598' :\n            d > 4 ? '#fee08b'\
    \ :\n            d > 2 ? '#fc8d59' :\n            '#d53e4f';\n}\n```\n\n```javascript\n\
    // Function for setting color (using arrow function)\nvar style = ((feature)=>\
    \ {\n    return {\n        fillColor: getColor(feature.properties.Human_waste_disposal),\n\
    \        weight: 2,\n        opacity: 1,\n        color: 'gray',\n        fillOpacity:\
    \ 0.9\n    }\n})\n```\n\nNow let's add the overlay map that will display the population's\
    \ accessibility to main sewer sanitation services. Spoiler alert: the statistics\
    \ are quite grim.\n\n```javascript\n// Adding the first overlay - map of household\
    \ access to main sewer\nvar countySanitation = new L.geoJson.ajax(\"https://raw.githubusercontent.com/sammigach/...\"\
    ,{\n    style: style\n})\n.bindPopup(function (layer) {\n    return `<b>County\
    \ Name: </b> ${layer.feature.properties.ADM1_EN} <br>\n    <b>Total County Population:\
    \ </b><br>\n    ${layer.feature.properties.County_pop.toString()} <br><br>\n \
    \   <b>% of Conventional Households with access to main sewer: </b><br><br>\n\
    \    ${layer.feature.properties.Human_waste_disposal.toString()}`\n}).addTo(map);\n\
    ```\n\nLet's add an accompanying legend for the above map. If you worked through\
    \ Chapter 7 that dealt with interactive choropleths, some of the below code should\
    \ look familiar.\n\n```javascript\n// Create a legend\nvar legend = L.control({position:\
    \ 'bottomright'});\n\nlegend.onAdd = function (map) {\n    var div = L.DomUtil.create('div',\
    \ 'info legend'),\n    grades = [0, 2, 4, 6, 10, 20],\n    labels = [];\n\n  \
    \  // loop through our density intervals and generate a label with a colored square\
    \ for...\n    for (var i = 0; i < grades.length; i++) {\n        div.innerHTML\
    \ +=\n            '<i style=\"background:' + getColor(grades[i] + 1) + '\"></i>\
    \ ' +\n            grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>'\
    \ : '+');\n    }\n    return div;\n}\n\nlegend.addTo(map);\n```\n\nNow set an\
    \ object to hold one of our two overlay maps.\n\n```javascript\nvar overlays =\
    \ {\n    'countySanitation': countySanitation,\n}\n```\n\nFinally parse the overlays\
    \ object to the L.controls.layer class.\n\n```javascript\n// Add layer controls\n\
    L.control.layers(basemaps, overlays).addTo(map);\n```\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/controls-overlay.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_89_0.png)\n\nIf you click in any one\
    \ of the counties, you will see popups appear.\nThere is one more overlay we will\
    \ add to our display to bring our experimentation with layer controls back full\
    \ circle. Remember the GeoJSON of our **cities** variable? Let’s call it back\
    \ to action. But first let’s load the custom icon markers that differentiate our\
    \ cities based on population."
  mdcn: "\nknitr::include_graphics('D:/gachuhi/my-leaflet/images/choropleth-legend.jpg')\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_83_0.png)\n\n完整代码文件可从这里获取。\n创建等级统计地图时，应旨在挑战读者并使其产生共鸣，而非仅仅提供信息。\n\
    \n## 7.7 总结\n\n本章篇幅较长，过程艰难，甚至可能令人困惑。尽管如此，以下是我们从本章中总结的要点：\n\n-   等级统计地图是指其地理区域或区域根据数据变量进行着色、阴影处理或图案填充的地图。全国人口地图是等级统计地图的很好示例。\n\
    -   三元运算符是 `if...else` 语句的简写形式。在三元运算符中，如果 `?` 右侧的语句与 `?` 左侧的值一致，则返回该语句；反之，如果 `?`\
    \ 右侧的值为假，则返回冒号 `:` 后面的任何值。\n-   `style` 是 `L.geoJson` 类中的一个特殊键，用于为 GeoJSON 文件中的每个图层应用自定义样式。\n\
    -   `mouseover` 是一个事件监听器，当屏幕指针悬停在某个要素上时，会触发特定操作。\n-   我们可以使用 `resetStyle` 将要素重置为其默认状态。\n\
    -   `L.control()` 类是启用大多数 Leaflet 控件的基础类。例如，`L.control.zoom` 用于创建缩放控件。\n-   `L.control()`\
    \ 也可用于自定义图例的外观和显示的信息。\n\n# 第 8 章：图层组与控件\n\n## 8.1 图层组与控件的目的\n\n有时，用户可能希望其网络地图由多个底图图层或叠加地图组成。假设您希望您的\
    \ Leaflet 地图包含两个底图图层，以及一个可切换显示任意底图的额外叠加图层，您将如何操作？\n\n## 8.2 设置底图\n\n为了创建控件，我们需要将保存地图变量的对象解析为\
    \ `L.control.layers` 类。之后，`L.control.layers` 类用于将对象值解析到 Leaflet 地图并创建用户界面控件。为此，打开一个新的\
    \ JavaScript 文件并将其命名为 `groups_controls.js`。插入以下代码，这将把我们的底图保存到各自的变量 `osm` 和 `cyclOSM`\
    \ 中。\n\n```javascript\nvar osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n});\n\nvar cyclOSM = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 20,\n    attribution: '<a href=\"https://github.com/cyclosm/cyclosm-cartocss-style/releases\"\
    \ title=\"Cyclosm\">'\n}); // 可从 Leaflet 服务器获取的 CyclOSM 瓦片图层\n```\n\n我们将把上面的两个变量\
    \ `osm` 和 `cyclOSM` 传递给 `L.map` 类，该类有一个 `layers` 选项，可以在其中解析希望在地图上显示的图层。\n\n```javascript\n\
    var map = L.map('myMap', {\n    layers: [osm, cyclOSM]\n}).setView([-1.295287148,\
    \ 36.81984753], 7);\n```\n\n然而，这将只会添加第一个底图变量（即 `osm`），同时屏蔽 `cyclOSM`。如下所示。\n\n\
    knitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/no-control.jpg'))\n\n\
    ![](img/264f6ca7b7ac3fbb9517b8a021818465_86_0.png)\n\n## 8.3 创建控件\n\n然而，为了给 `cyclOSM`\
    \ 一个公平的机会，我们需要将它们存储在一个对象中，比如 `var basemaps`，并将其解析到 `L.control.layers`，它将为每个底图创建一个复选按钮。下面的代码正是这样做的。\n\
    \n```javascript\n// 为底图设置对象\nvar basemaps = {\n    \"OpenStreetMap\": osm,\n \
    \   'cycleOsm': cyclOSM,\n}\n\nL.control.layers(basemaps).addTo(map);\n```\n\n\
    这是您得到的结果。\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/controls.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_87_0.png)\n\n## 8.4 添加叠加地图\n\n现在我们已经看到了如何向\
    \ Leaflet 添加两个或多个底图，并使它们全部显示在图层控件中。添加叠加地图也遵循相同的步骤。\n\n我们想要创建的第一个叠加图层是一个等级统计地图，显示根据\
    \ 2019 年人口普查数据，可接入主下水道的传统家庭百分比。为简单起见并避免我们遇到的错误，我们将重用 Ajax 插件从在线服务器获取 GeoJSON 文件。作为提醒，我们通过将其插入到地图\
    \ `html` 的以下 `<script>` 标签中来将 Ajax 加载到 Leaflet 中。\n\n```html\n<script src=\"leaflet-ajax-gh-pages\\\
    dist\\leaflet.ajax.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\dist\\\
    leaflet.ajax.min.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\example\\\
    leaflet.spin.js\"></script>\n<script src=\"leaflet-ajax-gh-pages\\example\\spin.js\"\
    ></script>\n```\n\n使用 fetch API 加载 json 文件带来了几个需要创造性思维来解决的问题，但使用替代的 Ajax 插件则是一个安全的选择。以下代码块将为我们全国性的卫生设施地图添加颜色函数和样式。最终生成的颜色函数将被解析到\
    \ Ajax 函数中。\n\n```javascript\n//// 添加一些颜色\nfunction getColor(d) {\n    return\
    \ d > 20 ? '#3288bd' :\n            d > 10 ? '#99d594' :\n            d > 6 ?\
    \ '#e6f598' :\n            d > 4 ? '#fee08b' :\n            d > 2 ? '#fc8d59'\
    \ :\n            '#d53e4f';\n}\n```\n\n```javascript\n// 设置颜色的函数（使用箭头函数）\nvar\
    \ style = ((feature)=> {\n    return {\n        fillColor: getColor(feature.properties.Human_waste_disposal),\n\
    \        weight: 2,\n        opacity: 1,\n        color: 'gray',\n        fillOpacity:\
    \ 0.9\n    }\n})\n```\n\n现在，让我们添加将显示人口接入主下水道卫生服务情况的叠加地图。剧透提醒：统计数据相当严峻。\n\n```javascript\n\
    // 添加第一个叠加图层 - 家庭接入主下水道的地图\nvar countySanitation = new L.geoJson.ajax(\"https://raw.githubusercontent.com/sammigach/...\"\
    ,{\n    style: style\n})\n.bindPopup(function (layer) {\n    return `<b>County\
    \ Name: </b> ${layer.feature.properties.ADM1_EN} <br>\n    <b>Total County Population:\
    \ </b><br>\n    ${layer.feature.properties.County_pop.toString()} <br><br>\n \
    \   <b>% of Conventional Households with access to main sewer: </b><br><br>\n\
    \    ${layer.feature.properties.Human_waste_disposal.toString()}`\n}).addTo(map);\n\
    ```\n\n让我们为上面的地图添加一个配套的图例。如果您学习了第 7 章关于交互式等级统计地图的内容，下面的部分代码应该看起来很熟悉。\n\n```javascript\n\
    // 创建图例\nvar legend = L.control({position: 'bottomright'});\n\nlegend.onAdd =\
    \ function (map) {\n    var div = L.DomUtil.create('div', 'info legend'),\n  \
    \  grades = [0, 2, 4, 6, 10, 20],\n    labels = [];\n\n    // 遍历我们的密度区间，并为...生成带有彩色方块的标签\n\
    \    for (var i = 0; i < grades.length; i++) {\n        div.innerHTML +=\n   \
    \         '<i style=\"background:' + getColor(grades[i] + 1) + '\"></i> ' +\n\
    \            grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' :\
    \ '+');\n    }\n    return div;\n}\n\nlegend.addTo(map);\n```\n\n现在，设置一个对象来保存我们的两个叠加图层之一。\n\
    \n```javascript\nvar overlays = {\n    'countySanitation': countySanitation,\n\
    }\n```\n\n最后，将叠加图层对象解析到 `L.control.layers` 类。\n\n```javascript\n// 添加图层控件\nL.control.layers(basemaps,\
    \ overlays).addTo(map);\n```\n\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/controls-overlay.jpg'))\n\
    \n![](img/264f6ca7b7ac3fbb9517b8a021818465_89_0.png)\n\n如果您点击任何一个县，将会看到弹出窗口出现。\n\
    我们还将添加一个叠加图层到我们的显示中，以完整地结束我们对图层控件的实验。还记得我们的 **cities** 变量对应的 GeoJSON 吗？让我们再次调用它。但首先，让我们加载根据人口区分城市的自定义图标标记。\n"
