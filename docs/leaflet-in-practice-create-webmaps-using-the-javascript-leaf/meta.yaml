    \ by angle brackets (`<>`) are what introduce any form of content into a webpage,\
    \ be it a paragraph (`<p>`), an image (`<img>`), video (`<video>`) and even an\
    \ entire section (`<div>`, `<section>`, `<article>`). With this basic introduction,\
    \ let's create a basic HTML page.\n\nTo create an HTML element along with many\
    \ other programming files, such as `.js` and `.css` which we shall see later,\
    \ we use a text editor. A good example of a text editor is VS Code or Pycharm.\
    \ Check their websites on their installation methods for your personal computer.\
    \ For creating HTML and working with `.js` documents later, we shall use VS Code\
    \ unless otherwise stated.\n\nHere is a basic HTML webpage.\n\n```\n<!DOCTYPE\
