- md: "## 5.6. Loading the GeoJSON into Leaflet\n\n```javascript\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then((response) => {\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        L.geoJson(data).addTo(map);\n    })\n    .catch((error) => {\n\
    \        console.log(`This is the error: ${error}`)\n    })\n```\n\nIt looks cryptic\
    \ but don't cry! We have only omitted the function() keyword and instead added\
    \ => between function() and the curly brackets {<code-to-run>} which is the function\
    \ body aka where the magic happens. Just like when using Ajax, we can also add\
    \ other functionalities to L.geoJSON within the fetch plugin. In here, and thanks\
    \ to the use of template literals (``), we can even add statements and refer to\
    \ our GeoJson keys (and in some cases, even variables) using ${}. Whatever is\
    \ within the ${} is executed and passed out as a string to the template literals.\n\
    \n```javascript\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then((response) => {\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        L.geoJson(data).bindPopup((layer) => {\n            return `City:\
    \ ${layer.feature.properties.City},<br>\n            Population: ${layer.feature.properties.Population}`\n\
    \        }).addTo(map);\n    })\n    .catch((error) => {\n        console.log(`This\
    \ is the error: ${error}`)\n    })\n```\n\nIn the return statement above, we added\
    \ the HTML tag `<br>` to separate the City and Population keys from our GeoJSON.\
    \ Doing so will return neat marker texts where the city name and population figures\
    \ are in two separate lines.\n\nEnough Javascript for a day!\n\n```r\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/city-population.jpg\"))\n```\n\n![image](img/264f6ca7b7ac3fbb9517b8a021818465_52_0.png)\n\
    \nHere are the full files used in this chapter.\n\n## 5.7 Summary\n\nWho thought\
    \ that simple GeoJSON files would be so complicated to load and see? Lets recap\
    \ what we've learnt.\n\n-   GeoJSON files are an open standard geospatial data\
    \ interchange format that represents simple geographic features and their nonspatial\
    \ attributes.\n-   GeoJSON is based on the JavaScript Object Notation (JSON) file\
    \ format known for its lightweight nature.\n-   GeoJSON files are the *lingua\
    \ franca* of working with spatial information on the web.\n-   The geojson.io\
    \ website allows a user to create a GeoJSON file interactively and intuitively.\n\
    -   There are three main ways of loading a GeoJSON file in Leaflet. One is by\
    \ hardcoding the dictionary of spatial attributes in a JavaScript file. This was\
    \ the first method that we explored.\n-   The other method is by using the Ajax\
    \ plugin. We call Ajax into Leaflet by inserting into the `<head>` element the\
    \ path to the extracted Ajax files.\n-   The third and last method is through\
    \ use of the `fetch` API. The `fetch` API searches for a resource over the web,\
    \ retrieves it, and brings it to your computer.\n\n## Chapter 6: Create your own\
    \ custom markers\n\n### 6.1 Setting the base\n\nHope you didn't trash away the\
    \ cities we created in the last chapter. In this chapter, we shall focus on creating\
    \ your own custom markers. We love a clean job, so we will create a new JavaScript\
    \ file and name it `custom-markers.js`. We understand the previous chapter was\
    \ quite long but believe you me, although creating custom markers sounds easier,\
    \ it took us way longer to get the hang around it. Good news, we received enough\
    \ punches on the face to teach you how to dodge the pain points.\n\nThe very first\
    \ thing to do is to create a basemap.\n\n```javascript\nvar map = L.map('myMap').setView([-1.295287148,\
    \ 36.81984753], 7);\n\nL.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
