    \ World!</p>\n        </div>\n        <script src=\"main.js\">\n\n        </script>\n\
    \n    </body>\n</html>\n```\n\nLet's go through each of the above tags one by\
    \ one.\n\n1. `<!DOCTYPE html>` - It is an \"information\" to the browser about\
    \ what document type to expect.\n2. `<html lang=\"en\">` - It is the container\
    \ for all other HTML elements (except for the `<!DOCTYPE>` tag). The `lang` attribute\
    \ is used to assist web engines know which language the website uses.\n3. `<head>`\
    \ - It is not displayed on the webpage as other tags, but contains the metadata\
