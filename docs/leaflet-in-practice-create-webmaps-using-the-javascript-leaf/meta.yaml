  md: "# CHAPTER 5. USING GEOJSON IN LEAFLET\n\nmap.html and geojson.js. Alright.\
    \ Right under the src for leaflet.js in your map.html, add the following <script>\
    \ tag.\n\n```\n<head>\n    -- snip --\n    <script src=\"leaflet-ajax-gh-pages\\\
    dist\\leaflet.ajax.js\"></script>\n\n</head>\n-- snip --\n```\n\nThis file will\
    \ allow you to add .geojson files to your Leaflet map. However, there is a catch.\
    \ Both the Ajax and Fetch APIs only work with GeoJson file formats saved on a\
    \ web server. Based on experience, they will not work with local GeoJson files.\
    \ As a work around, we saved our GeoJSON file to Github. For convenience, here\
    \ is the link again to the raw file we had initially created from geojson.io.\n\
    \nWe shall call our GeoJSON file from Github using Ajax as shown in the code below.\
    \ Please remember to comment out your var cities and L.geoJSON using \\\\ because\
    \ they are irrelevant in this particular case.\n\n```\nvar geojsonLayer = new\
    \ L.geoJson.ajax(\"https://raw.githubusercontent.com/sammigachuhi/p\n```\n\nYour\
    \ map should now show the markers of our cities. If you are hawk eyed, you may\
    \ have noticed that the syntax for Ajax is different from that of the earlier\
    \ L.geoJSON from Leaflet. Starting with the latter, we have instead used L.geoJson\
    \ and unlike in the Ajax creator's website where they used var geojsonLayer =\
    \ new L.GeoJSON.AJAX(<your-geojson-file>) we used the following syntax: L.geoJson.ajax()\
    \ (ajax and geoJson beginning with small case). Actually, that's what worked after\
    \ quite a lengthy web search.\n\nJust like using L.geoJSON, we can also add popups\
    \ after calling the .ajax method.\n\n```\nvar geojsonLayer = new L.geoJson.ajax(\"\
    https://raw.githubusercontent.com/sammigachuhi/p\n    .bindPopup(function (layer)\
    \ {\n        return layer.feature.properties.City;\n    }).addTo(map);\n```\n\n\
