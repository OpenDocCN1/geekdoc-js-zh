- md: "## CHAPTER 10. CLUSTER TO REDUCE THE CLUTTER\n\n```javascript\nfetch(url)\n\
    \    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        var markers = L.markerClusterGroup();\n\n        var geojsonGroup\
    \ = L.geoJSON(data, {\n            onEachFeature : function(feature, layer){\n\
    \                layer.bindPopup(`<b>Facility Name:</b> ${feature.properties.Facility_Name}\
    \ <br>\n                <b>Type:</b> ${feature.properties.Type}`);\n         \
    \   },\n            pointToLayer: function (feature, latlng) {\n             \
    \   return L.circleMarker(latlng);\n            }\n        });\n\n        markers.addLayer(geojsonGroup);\n\
    \        map.addLayer(markers);\n\n    })\n    .catch((error) => {\n        console.log(`This\
    \ is the error: ${error}`)\n    })\n```\n\n```r\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/cluster-marker-map-fixed.jpg'))\n\
    ```\n\n![Cluster marker map](img/264f6ca7b7ac3fbb9517b8a021818465_106_0.png)\n\
    \nNow all points have their rightful and respective names.\n\n### 10.4 Additional\
    \ Features of Cluster Marker Plugin\n\nThe official documentation of the plugin\
    \ lists many other features that come along with the tool. We can't go through\
    \ all of them but let's surmise just one important functionality: the mouseover\
    \ event. A mouseover event triggers an action when a mouse hovers over a feature\
    \ in Leaflet.\n\nLet's demonstrate adding a hover event to our cluster marker\
    \ map, thanks to this answer.\n\n```javascript\n////// Added `mouseover` event\n\
    \nfetch(url)\n  .then((response) => {\n    return response.json()\n  })\n  .then((data)\
    \ => {\n    var markers = L.markerClusterGroup({chunkedLoading: true}); // Splits\
    \ the add layers to s\n    var geojsonGroup = L.geoJSON(data, {\n      onEachFeature\
    \ : function(feature, layer){\n        layer.bindPopup(`<b>Facility Name:</b>\
    \ ${feature.properties.Facility_Name} <br>\n          <b>Type:</b> ${feature.properties.Type}`);\n\
    \      },\n      pointToLayer: function (feature, latlng) {\n        return L.circleMarker(latlng).on('mouseover',\
    \ function(){\n          this.bindPopup(`Nearest_Center: ${feature.properties.Nearest_To}`).openPopup();\n\
    \        });\n      }\n    });\n\n    markers.addLayer(geojsonGroup);\n    map.addLayer(markers);\n\
    \n  })\n  .catch((error) => {\n    console.log(`This is the error: ${error}`)\n\
    \  })\n```\n\nFrom the above code, we added the mouseover event to each marker\
    \ point using the on method. The `this` keyword in `this.bindPopup()` ties popups\
    \ of selected variables to coordinates in the `var geojsonGroup` variable. We\
    \ also sped the rendering of our Leaflet map by adding `chunkedLoading: true`\
    \ parameter to `L.markerCluster()` function.\n\nHovering over each marker point\
    \ will show a value of the `Nearest_To` attribute which is an actual town centre\
    \ in closest proximity to the hospital marker.\n\n```r\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/cluster-marker-mouseover.jpg'))\n\
    ```\n\n![Cluster marker map with mouseover](img/264f6ca7b7ac3fbb9517b8a021818465_108_0.png)\n\
    \nThe code files used for this chapter are available from here.\n\n### 10.5 Summary\n\
    \nCluster marker points are a neat way of displaying several points. Upon zooming\
    \ out, the spatially sparsed points coalesce to a single unit displaying a figure\
    \ standing for the number of markers it holds. Upon zooming in, the points spiderfy,\
    \ (think of spreading out) to their appropriate locations. Here are the lessons\
    \ from this chapter.\n\n- Clustering points is at times useful for map neatness.\
    \ In Leaflet, this is made possible with the `Leaflet.markercluster` plugin.\n\
    - It is possible to customize how the spiderfied marker points will appear. For\
    \ example, instead of settling for the default styles of individual markers, we\
    \ used the circle markers to show individual points.\n- It is also possible to\
    \ add events to the spiderfied marker points. When clicked, the spiderfied marker\
    \ points can show a popup, or trigger any other event as specified in its code\
    \ block.\n\n# Chapter 11\n\n## Mobile Friendly Webapps\n\n### 11.1 The Need for\
    \ Mobile Friendly Web Apps\n\nShort story. Not too long ago I was the proud owner\
    \ of a famous phone brand on the decline. One time, when taking a photo of the\
    \ iconic Ngong Hills for Wikipedia’s Africa Climate photo contest, the phone just\
    \ died. That was it. A quick visit to the authorized dealer was greeted with the\
    \ unbelievable and bemusing words of, “We no longer ship the motherboard to the\
    \ country anymore.” Some healing has taken place, but I was totally heartbroken,\
    \ and occasionally suffer some nostalgia of the ‘good times’ I had with my phone.\n\
    \nNow back to business. Webapps can be heavy, and they can load slowly on smaller\
    \ devices such as smartphones. Apps that load slow can put off your web app users,\
    \ so it is prudent to customize your webapp for your user’s phones.\n\nFor this\
    \ chapter, we will work on making our cluster marker app mobile friendly. We shall\
    \ also add other functionalities to make the web app ‘heavier’ in order to test\
    \ to destruction if our ambitions of making our app load faster have worked.\n\
    \nIn order to create a mobile friendly Leaflet experience, insert the below code\
    \ within the `<head>` element of your `map.html`. The below meta tag tells the\
    \ browser to disable unwanted scaling of the page and instead set it to its actual\
    \ size.\n\n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0,\
    \ maximum-scale=1.0, user-scalable=no\">\n```\n\n### 11.2 The Basemaps\n\nIf you\
    \ have gone through Chapter 8 where we created controls, the following will look\
    \ familiar. We will add some basemaps and later on create their control widgets.\n\
    \n```javascript\n// Basemaps\nvar osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a> contributors'\n});\n\nvar cyclOSM = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 20,\n    attribution: '<a href=\"https://github.com/cyclosm/cyclosm-cartocss-style/releases\"\
    >CyclOSM</a> | Map data: &copy; <a href=\"https://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a> contributors'\n}); // the CyclOSM tile layer available from\
    \ Leaflet servers\n```\n\nLet's add our basemaps to Leaflet.\n\n```javascript\n\
    // Add the Leaflet basemaps\nvar map = L.map('myMap', {\n    layers: [osm, cyclOSM]\n\
    }).setView([-1.295287148, 36.81984753], 7);\n```\n\n### 11.3 Adding the Features\n\
    \nRemember our hospital json layer? Let's call it again and transform it to a\
    \ cluster marker with fetch.\n\n```javascript\n// Add hospital dataset\n\nurl\
    \ = 'https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/selected_hosp.geojson'\n\
    \nvar cluster = fetch(url)\n    .then((response) =>{\n        return response.json()\n\
    \    })\n    .then((data) => {\n        var markers = L.markerClusterGroup();\n\
    \n        var geojsonGroup = L.geoJSON(data, {\n            onEachFeature : function(feature,\
    \ layer){\n                var popupContent = `<b>Facility Name:</b> ${feature.properties.Facility_Name}<br>\n\
    \                                    <b>Type:</b> ${feature.properties.Type}`;\n\
    \                layer.bindPopup(popupContent)\n            },\n            pointToLayer:\
    \ function (feature, latlng) {\n                return L.circleMarker(latlng);\n\
    \            }\n        });\n\n        markers.addLayer(geojsonGroup);\n     \
    \   map.addLayer(markers);\n\n    })\n    .catch((error) => {\n        console.log(`This\
    \ is the error: ${error}`)\n    })\n```\n\nWhy was the `fetch` code being parsed\
    \ to `var cluster`? Well, we were aiming for the stars. We wanted to have a layer\
    \ control for our `cluster` variable too but unfortunately this plan failed.\n\
    \nLet's put our `basemaps` and `cluster` variables into JavaScript objects in\
    \ order to create a layer control for each.\n\n```javascript\n// Set object for\
    \ the basemaps\nvar basemaps = {\n    \"OpenStreetMap\": osm,\n    'cycleOsm':\
    \ cyclOSM,\n}\n\n////Don't add the 'overlays' object. For demonstration purposes\
    \ only\n// Set object for the overlay maps\nvar overlays = {\n    'Hospitals':\
    \ cluster\n}\n```\n\nBefore you head on any further, inserting the `overlays`\
    \ object into the `L.control.layers()` class results in several errors. This is\
    \ why we were unable to create a control for the markers held in `var cluster`.\
    \ The image below shows the errors appearing in the console after inserting the\
    \ `overlays` object into `L.control.layers()`."
  mdcn: "\n## 第十章 通过聚类减少杂乱\n\n```javascript\nfetch(url)\n    .then((response) =>{\n\
    \        return response.json()\n    })\n    .then((data) => {\n        var markers\
    \ = L.markerClusterGroup();\n\n        var geojsonGroup = L.geoJSON(data, {\n\
