    \ class=\"text-white mb-3\">Gallery</h4>`标签正下方，用以下代码替换它，一直到`<img class=\"img-fluid\
    \ bg-light p-1\" src=\"img/course-1.jpg\" alt=\"\">`之后的`<div>`标签。\n\n```html\n\
    <div id=\"myMap\">\n    <script src=\"cluster-markers.js\">\n</div>\n```\n"
