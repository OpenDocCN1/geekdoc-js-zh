    As a simple exercise, can you try creating a marker for your home location using
    the setView method you have learned about so far?


    Alright, we have a marker. But what’s so special about it apart from it being
    a lone pin in the middle of somewhere? Let’s try to make this marker have some
    information, otherwise called attributes in GIS. Let’s say the attributes we want
    to add are the name of the airport and other auxillary data.


    # 3.3 A marker with a popup


    To create popups, Leaflet provides the bindPopup method. You just chain it to
    the variable, more like how you would add an extension to a browser to perform
    new functions but now in this case, these extra functions are added to the variable.
    In the below code, bindPopup is chained to the marker variable using a dot ..


    ```

    // Create popup of Kisumu international Airport

    marker.bindPopup("Kisumu International Airport.").openPopup();

    ```'
