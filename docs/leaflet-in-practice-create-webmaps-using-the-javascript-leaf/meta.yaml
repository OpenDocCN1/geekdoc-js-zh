  - "[PAGE 49]\n\n# 5.6.3  Using Fetch API\n\nFetch API is a modern interface that\
    \ allows you to make HTTP requests to servers from web browsers. In other words,\
    \ it searches for a resource over the web, retrieves it, and brings it to you.\
    \ Think of it as a dog in which you throw a saucer and tell your faithful hound:\
    \ “*Sabretooth, fetch!*”. The dog runs after the saucer, grips it with its canines\
    \ mid-air and quickly brings it back to you. Same case with Fetch API!\n\nI had\
    \ mentioned I will show you how to retrieve our Github stored GeoJSON data and\
    \ I shall stick to the script! I shall also attempt to explain how this *mysterious*\
    \ `fetch` works.\n\nFirst things first. The `fetch` function shall be called and\
    \ passed to our Github url containing our GeoJSON text. Since `fetch` is an API,\
    \ it retrieves data from Github.io –the server in this case–and brings it to our\
    \ laptop the –the client. Enough IT. Let’s write it down.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n```\n\nOkay, next step. Once the server beams back the data to us, what do\
    \ we do with it? According to Digital Ocean, the response is not *actually* the\
    \ data in the original format but rather *a series of methods that can be used\
    \ depending on what you want to do with the information*. This sounds downright\
    \ confusing. Nevertheless, it is *at least* crystal clear that the end goal is\
    \ to have our fetched data in JSON format. Converting an object to JSON is done\
    \ using the `json()` method. We parse `.json()` to a `then` method which is an\
    \ asynchronous function¹. After the `fetch` function is successful, the object\
    \ is stored in the **response** argument, which is in brackets, and then the function\
    \ returns the result as a json object.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then(function(response) {\n        return response.json()\n    })\n```\n\
    \nAfter converting our response to JSON, it still needs to be processed further.\
    \ Processed to what? To a GeoJSON file and subsequently add it to our Leaflet\
    \ Map.\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n```\n\n¹Asynchronous programming is a technique that enables your program to\
    \ start a potentially long-running task and still be able to be responsive to\
    \ other events while that task runs, rather than having to wait until that task\
    \ has finished. Once that task has finished, your program is presented with the\
    \ result. See Mozilla"
