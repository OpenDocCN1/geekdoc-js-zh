    \n## 3.3 带弹出窗口的标记点\n\n要创建弹出窗口，Leaflet 提供了 `bindPopup` 方法。你只需将其链接到变量上，这有点像为浏览器添加扩展以执行新功能，但在这个情况下，这些额外的功能是添加到变量上的。在下面的代码中，`bindPopup`\
    \ 通过点号 `.` 链接到标记点变量。\n\n```javascript\n// Create popup of Kisumu International\
    \ Airport\nmarker.bindPopup(\"Kisumu International Airport.\").openPopup();\n\
    ```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/kisumu-airport-popup.jpg\"\
    ))\n```\n\n![基苏木机场弹出窗口](img/264f6ca7b7ac3fbb9517b8a021818465_25_0.png)\n\n刚才发生的事情是，`bindPopup`\
    \ 将弹出窗口内容——“基苏木国际机场”绑定到标记点。在下面的代码中，我们添加了另一个方法 `openPopup`，它会*打开*指定经纬度处的弹出窗口。如果你删除或注释掉（使用\
    \ `//`）`openPopup` 方法，你就必须点击标记点才能看到弹出窗口内容。试试看吧。\n\n标记点也可以与HTML元素一起使用，例如，当你想显示额外的元数据时，比如地点的所有者、土地面积等。在下面的例子中，我们添加了基苏木机场位置的经纬度坐标。强烈建议不要在HTML标记点元素中包含冗长的信息。\n\
    \n```javascript\n// With html content\nmarker.bindPopup(\"<br>Name: Kisumu International\
    \ Airport</br><br>Latitude: -0.0819301</br><br>Longitude: 34.7269058</br>\")\n\
    ```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/marker-html.jpg\"\
