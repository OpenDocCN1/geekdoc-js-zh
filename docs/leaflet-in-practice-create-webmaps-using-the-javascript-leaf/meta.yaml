- md: "## 3.2 A marker\n\nMany people could possibly hardly know where Kisumu is,\
    \ so let's indicate its location with a simple pin marker. To be more specific,\
    \ let's pinpoint Kisumu International Airport.\n\n```javascript\n// Location of\
    \ Kisumu International Airport\nvar marker = L.marker([-0.0819301, 34.7260167]).addTo(map);\n\
    ```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/kisumu-international-airport.jpg\"\
    ))\n```\n\n![Kisumu International Airport](img/264f6ca7b7ac3fbb9517b8a021818465_24_0.png)\n\
    \nAs a simple exercise, can you try creating a marker for your home location using\
    \ the setView method you have learned about so far?\n\nAlright, we have a marker.\
    \ But what’s so special about it apart from it being a lone pin in the middle\
    \ of somewhere? Let’s try to make this marker have some information, otherwise\
    \ called attributes in GIS. Let’s say the attributes we want to add are the name\
    \ of the airport and other auxiliary data.\n\n## 3.3 A marker with a popup\n\n\
    To create popups, Leaflet provides the `bindPopup` method. You just chain it to\
    \ the variable, more like how you would add an extension to a browser to perform\
    \ new functions but now in this case, these extra functions are added to the variable.\
    \ In the below code, `bindPopup` is chained to the marker variable using a dot\
    \ `.`.\n\n```javascript\n// Create popup of Kisumu International Airport\nmarker.bindPopup(\"\
    Kisumu International Airport.\").openPopup();\n```\n\n```r\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/kisumu-airport-popup.jpg\"))\n```\n\n![Kisumu airport\
    \ popup](img/264f6ca7b7ac3fbb9517b8a021818465_25_0.png)\n\nWhat has just happened\
    \ is that `bindPopup` binds the popup content– “Kisumu International Airport”\
    \ to the marker. In the below code, we have added another method, `openPopup`\
    \ which *opens* the popup at that specified latitude longitude. If you remove,\
    \ or comment `//` out the `openPopup` method, you will have to click the marker\
    \ to see the popup content. Try it out.\n\nMarkers can also work with HTML elements,\
    \ such as when you want to display additional metadata, say the owner of the place,\
    \ size of land etc. In the below case, we have added the lat-lon coordinates of\
    \ Kisumu airport location. It is highly advised not to include lengthy information\
    \ in an HTML marker element.\n\n```javascript\n// With html content\nmarker.bindPopup(\"\
    <br>Name: Kisumu International Airport</br><br>Latitude: -0.0819301</br><br>Longitude:\
    \ 34.7269058</br>\")\n```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/marker-html.jpg\"\
    ))\n```\n\n![Marker with HTML content](img/264f6ca7b7ac3fbb9517b8a021818465_25_1.png)\n\
    \n## 3.4 Different markers and popups\n\nSo far you have seen pin markers, but\
    \ there are also other kinds of markers, such as circles and rectangles. Unlike\
    \ the pin markers we have been experimenting with, these other markers require\
    \ additional options, such as radius value for circle and lat-long coordinates\
    \ for rectangles. Let’s have a go with each type.\n\nStarting with a circle, let’s\
    \ start by drawing a radius around the location of Kisumu Museum.\n\n```javascript\n\
    // Circle over Kisumu Museum\nvar circle = L.circle([-0.107637, 34.7435975]).setRadius(2000).addTo(map);\n\
    ```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/kisumu-museum-circle.jpg\"\
    ))\n```\n\n![Circle over Kisumu Museum](img/264f6ca7b7ac3fbb9517b8a021818465_26_0.png)\n\
    \nThe below code will also create a slightly similar circle marker, the only difference\
    \ is that in the preceding one we didn't insert options and we set radius using\
    \ the `setRadius` method. In the second one below, we have been very specific\
    \ in what we want – our specifications going into the curly brackets `{}` before\
    \ eventually adding the circle marker to our map. Brackets in JavaScript indicate\
    \ you are dealing with a dictionary. A dictionary in JavaScript and even in Python\
    \ is used to denote key-value pairs.\n\n```javascript\nvar circle = L.circle([-0.107637,\
    \ 34.7435975], {\n    color: 'blue',\n    fillColor: 'blue',\n    fillOpacity:\
    \ .5,\n    radius: 2000\n}).addTo(map);\n```\n\nAs we had mentioned earlier, other\
    \ marker elements such as circles and rectangles can have popups attached to them.\
    \ Ready for something cool? We will attach a popup into our circle. Not just any\
    \ other ordinary hard coded popup but one which relies on other Leaflet JavaScript\
    \ methods to generate an output. In our case, we want a pop up that shows the\
    \ radius of our circle, without us typing it out into the code.\n\n```javascript\n\
    // Circle marker pop up for Kisumu Museum\nvar getRadius = circle.getRadius();\n\
    circle.bindPopup(\"Radius is: \" + getRadius.toString() + \" metres\");\n```\n\
    \nIn our above code, `getRadius` gets the radius of our circle marker. `bindPopup`\
    \ as has already been explained before binds the popup content to our circle marker.\
    \ But there is a catch. The variable `getRadius` is used to print out the results,\
    \ which is 2000 of course. However, `bindPopup` only understands strings so we\
    \ convert our variable result to a string using `toString()`. We also added other\
    \ strings to give the popup a wholesome result that is understandable to every\
    \ Tom, Dick, Harry and Harriet.\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/circle-radius.jpg\"\
    ))\n```\n\n![Circle radius popup](img/264f6ca7b7ac3fbb9517b8a021818465_27_0.png)\n\
    \nFinally, let’s try with a rectangle. Actually, Leaflet allows us to create polygons.\
    \ Let’s work with the polygon class to create a rectangle bounding a given location.\
    \ Copy the following coordinates.\n\n```javascript\n// Draw rectangle around Kisumu\
    \ Wildlife Impala Park\nvar impalaParkCoordinates = [\n    [-0.1144753, 34.743418],\n\
    \    [-0.115097, 34.745242],\n    [-0.114238, 34.745071],\n    [-0.114002, 34.746101],\n\
    \    [-0.115054, 34.746787],\n    [-0.115998, 34.745586],\n    [-0.118444, 34.746208],\n\
    \    [-0.121255, 34.744684]\n];\n```\n\nNow using the `L.polygon` class and a\
    \ few optional parameters, let’s showcase where the Kisumu Wildlife Impala Park\
    \ is situated.\n\n```javascript\n// Create a polygon using the above coordinates\n\
    var impalaParkPolygon = L.polygon(impalaParkCoordinates, {\n    color: 'brown',\n\
    \    fillOpacity: 0.4\n}).addTo(map);\n```\n\nJust like we did for the circle\
    \ marker, we will make our popup content rely on another variable, in this case\
    \ `getCenter` which gets the centroid coordinates of our polygon. We were looking\
    \ for something cooler such as `getArea` in Leaflet, one that automatically prints\
    \ out the area of a polygon in a popup. Unfortunately, we were unable to find\
    \ it.\n\n```javascript\n// Add popup to the polygon of Kisumu Impala Park\nvar\
    \ getCenter = impalaParkPolygon.getCenter();\nimpalaParkPolygon.bindPopup(\"Centre\
    \ is at Lat-Lon: \" + getCenter.toString()).openPopup();\n```\n\nIf you find the\
    \ circle marker too much of an obstruction to the rectangle marker, feel free\
    \ to comment it out using `//`.\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/polygon-marker.jpg\"\
    ))\n```\n\n![Polygon marker](img/264f6ca7b7ac3fbb9517b8a021818465_28_0.png)\n\n\
    You can get the files used in this exercise here.\n\n## 3.5 Summary\n\nThis chapter\
    \ took you further in enriching the content that can be displayed in a webmap.\
    \ You have seen that a webmap can offer far more useful information than just\
    \ mere markers and symbols on a web canvas. Popups are one way of displaying information,\
    \ and they too can be customized further. Through the practicals in this chapter,\
    \ you have learnt the following:\n\n- To create popups in Leaflet, we use the\
    \ `bindPopup` method.\n- `openPopup` automatically opens the popups once the Leaflet\
    \ map is loaded. They only disappear once you close them.\n- Markers can also\
    \ work with HTML elements.\n- Apart from location pins, markers can also be circles\
    \ and rectangles.\n- There exist methods in Leaflet that can automatically parse\
    \ out information in popups without requiring any hardcoding from the programmer.\
    \ For example, we used `getRadius` to display the circle radius in the popup without\
    \ necessarily typing it out in the `bindPopup` method.\n- You comment out JavaScript\
    \ code with `//`.\n\n# CHAPTER 3. ADD-ONS\n\n# Chapter 4\n\n## Embedding leaflet\
    \ map to an external website\n\n### 4.1 A website with a sense of direction\n\n\
    Now, we have succeeded in making a standalone leaflet map. However, we want to\
    \ do something that will quickly upscale you from a novice to a pro. That is,\
    \ embedding a Leaflet map into a website. An example of what we want is shown\
    \ below, which is a snapshot from the HDX website.\n\n```r\nknitr::include_graphics(rep(\"\
    D:/gachuhi/my-leaflet/images/webmap-in-web.jpg\"))\n```\n\n![Webmap in a website](img/264f6ca7b7ac3fbb9517b8a021818465_31_0.png)\n\
    \nFor this exercise, we shall embed a leaflet map to a simple HTML webpage. This"
  mdcn: "\n## 3.2 一个标记点\n\n很多人可能很难知道基苏木在哪里，所以让我们用一个简单的图钉标记点来指示它的位置。更具体地说，让我们精确标记基苏木国际机场。\n\
    \n```javascript\n// Location of Kisumu International Airport\nvar marker = L.marker([-0.0819301,\
    \ 34.7260167]).addTo(map);\n```\n\n```r\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/kisumu-international-airport.jpg\"\
    ))\n```\n\n![基苏木国际机场](img/264f6ca7b7ac3fbb9517b8a021818465_24_0.png)\n\n作为一个简单的练习，你能尝试使用目前为止学到的\
