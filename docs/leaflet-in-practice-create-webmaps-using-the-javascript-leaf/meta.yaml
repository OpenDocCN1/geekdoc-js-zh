    ArcGIS:Streets\";\n```\n\n好了。是时候启动我们的地图功能了。像我们一直做的那样创建一个ESRI Leaflet地图实例。\n\n\
    ```\nconst map = L.map(\"myMap\", {\n    minZoom: 2\n}).setView([0.3556, 37.5833],\
    \ 6.5);\n```\n\n## 14.4 地理编码搜索\n\n我们之前创建了一个底图变量，所以我们将把它解析到负责创建底图的`L.esri.Vector.vectorBasemapLayer`类。实际上，也可以将`{Provider}:{Style\
