    \ title of the document. In our case, if you open the webpage assuming you created\
    \ it in VS Code, the webpage shall be titled \"A basic html webpage\" at the tab\
    \ of your web-browser.\n5. `<meta charset=\"utf-8\">` - This is part of the metadata\
    \ hosted by the `<head>` tag. We had mentioned earlier that the `<head>` contains\
    \ the metadata of the webpage. Now here we would like to add that the `<meta>`\
    \ tag found within the `<head>` is what defines the metadata. You can think of\
    \ it as a **README** text file that comes with any software you download. The\
    \ `<meta>` tag in our case defines the encoding of our HTML5 document with the\
    \ attribute `charset=\"utf-8\"`. Don't think about this too much. HTML5 documents\
    \ have `utf-8` as their encoding. You can try to look up what encoding is but\
    \ it's not useful for this tutorial!\n6. `<link>` - Defines the relationship between\
    \ a document and an external resource. It has various attributes but `rel` and\
    \ `href` have been used. The former specifies the relationship between the current\
    \ document and the linked document/resource. The `rel` here references the `styles.css`\
    \ file as the style sheet for our HTML. That is, the styles for our HTML are found\
    \ in the `styles.css` file. `href` on the other hand points the HTML document\
    \ to the path of the stylesheet - the `styles.css` file.\n7. `<body>` - This is\
    \ the crux of your webpage. If nothing is within the `<body>` tags, your webpage\
    \ will be as empty as a blank sheet of paper. This tag is the home for all the\
