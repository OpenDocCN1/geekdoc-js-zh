  md: "# 72 CHAPTER 7. CREATING AN INTERACTIVE CHOROPLETH MAP\n\nFirst, let’s create\
    \ a function that sets a hex colour code for each population category. We used\
    \ color brewer for this.\n\nTake a look at this code and we shall explain.\n\n\
    ```\n//// Adding some color\nfunction getColor(d) {\n    return d > 1400 ? '#8c2d04'\
    \ :\n           d > 700 ? '#cc4c02' :\n           d > 400 ? '#ec7014' :\n    \
    \       d > 100 ? '#fe9929' :\n           d >  50 ?  '#fec44f':\n           d\
    \ > 25 ?  '#fee391':\n                   '#ffffd4';\n}\n```\n\nThe above function\
    \ uses a question mark ? to act as the `if...else` statement. In JavaScript, this\
    \ is known as a ternary operator. A ternary operator? What’s that? How does it\
    \ work?\n\nFor a ternary operator, any statement to the right of the ? is returned\
    \ as true if it agrees with the value to the left of the ?. Reread that last statement.\
    \ If the value to the right of the ? is false, then the value after the colon\
    \ : is returned. Reread that last statement for this ternary operator concept\
    \ to sink in.\n\nIf it still sounds fuzzy, the below image adapted from FreeCodeCamp\
    \ should help.\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/ternary.png\"\
    ))\n```"
  merge: -1
  pgno: 72
