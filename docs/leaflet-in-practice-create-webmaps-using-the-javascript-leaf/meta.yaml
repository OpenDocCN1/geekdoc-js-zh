  md: "# Chapter 12\n\n# Web Map Service Layers\n\n# 12.1 What are Web Map Service\
    \ (WMS) Layers?\n\nA Web Mapping Service (WMS) consists of geospatial data hosted\
    \ through the internet with standards set by the Open Geospatial Consortium (OGS).\n\
    \nA WMS enables the exchange of spatial information and viewing over the web in\
    \ the form of a map or image to your browser. The most common formats of Web Mapping\
    \ Services are Web Map Services (WMS), Web Feature Services (WFS), Web Coverage\
    \ Services (WCS), Web Processing Services (WPS), Web Map Tile Services (WMTS),\
    \ and Web Coverage Processing Services (WCPS). However, the Web Map Services (WMS)\
    \ layer is the most used. It offers basic panning, zooming and quick rendering\
    \ speeds.\n\n# 12.2 Loading a WMS server\n\nTo load a WMS layer into Leaflet,\
    \ we use the `L.tileLayer.wms` class. As simple as that. So let’s set up our Leaflet\
    \ map. Create a new JavaScript file named `wms_layers.js` and insert the following\
    \ code:\n\n```\nlet map = L.map('myMap').setView([-1.295287148, 36.81984753],\
    \ 7);\n\nlet tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n});\n```"
  merge: -1
  pgno: 117
- img_proc: true
  md: "118 CHAPTER 12. WEB MAP SERVICE LAYERS\n\nWe have added an OSM layer because\
    \ we want to create a layer control widget that also contains WMS layers so that\
    \ you can switch between an Open Street Map (OSM) layer and a WMS. For this exercise,\
    \ we shall add two WMS layers.\n\n```\nlet wmsLayerTopo = L.tileLayer.wms('https://www.gmrt.org/services/mapserver/wms_merc_m\n\
    ```\n\n```\n    layers: 'topo',\n    format: 'image/png'\n})\n```\n\n```\nlet\
    \ wmsLayerTopomask = L.tileLayer.wms('https://www.gmrt.org/services/mapserver/wms_me\n\
    ```\n\n```\n    layers: 'topo-mask',\n    format: 'image/png'\n})\n```\n\n# 12.3\
    \ Adding WMS to layer control\n\nLet's insert the above web map layers into a\
    \ JavaScript object before parsing it to a layer control.\n\n```\nvar basemaps\
    \ = {\n    OSM: tileLayer,\n    Topo: wmsLayerTopo,\n    Topo_mask: wmsLayerTopomask,\n\
    }\n```\n\nNow let's parse the object into a control. If you did Chapter 8 then\
    \ this should look familiar.\n\n```\nL.control.layers(basemaps).addTo(map);\n\
    ```\n\n```\nbasemaps.Topo.addTo(map);  // To have the Topo as the default map\
    \ layer\n```\n\nThe last line `basemaps.Topo.addTo(map)` serves to set up the\
    \ default layer that will appear when the map is loaded. In this case it is the\
    \ Topo key in var basemaps. If this last line is omitted, Leaflet will only show\
    \ a blank canvas unless one of the radioitems is selected.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/wms_layer.jpg'))\n\
    ```"
  merge: -1
  pgno: 118
