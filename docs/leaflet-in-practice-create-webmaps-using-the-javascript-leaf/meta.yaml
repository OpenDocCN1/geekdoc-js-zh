  md: "# 5.6. LOADING THE GEOJSON INTO LEAFLET 51\n\n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        L.geoJson(data).addTo(map);\n    })\n    .catch((error) => {\n\
    \        console.log(`This is the error: ${error}`)\n    })\n```\n\nIt looks cryptic\
    \ but don't cry! We have only ommitted the function() keyword and instead added\
    \ => between function() and the curly brackets {<code-to-run>} which is the function\
    \ body aka where the magic happens. Just like when using Ajax, we can also add\
    \ other functionalities to L.geoJSON within the fetch plugin. In here, and thanks\
    \ to the use of template literals (``), we can even add statements and refer to\
    \ our GeoJson keys (and in some cases, even variables) using ${}. Whatever is\
    \ within the ${} is executed and passed out as a string to the template literals.\n\
    \n```\nfetch(\"https://raw.githubusercontent.com/sammigachuhi/geojson_files/main/cities-geojson.geojson\"\
    )\n    .then((response) =>{\n        return response.json()\n    })\n    .then((data)\
    \ => {\n        L.geoJson(data).bindPopup((layer) => {\n            return `City:\
    \ ${layer.feature.properties.City},<br>\n            Population: ${layer.feature.properties.Population}`}).addTo(map);\n\
    \    })\n    .catch((error) => {\n        console.log(`This is the error: ${error}`)\n\
    \    })\n```\n\nIn the return statement above, we added the HTML tag <br> to separate\
    \ the City and Population keys from our GeoJSON. Doing so will return neat marker\
    \ texts where the city name and population figures are in two separate lines.\n\
    \nEnough Javascript for a day!\n\n```\nknitr::include_graphics(rep(\"D:/gachuhi/my-leaflet/images/city-population.jpg\"\
    ))\n```"
