- md: "## CHAPTER 11. MOBILE FRIENDLY WEBAPPS\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/mobile-friendly-error.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_112_0.png)\n\nTo get rid of the\
    \ error showcased above, just comment out the `overlays` object and remove it\
    \ from `L.control.layers()`. The `L.control.layers()` class should only contain\
    \ the `basemap` object.\n\n### 11.4 Zooming to the mobile user’s location\n\n\
    According to the Leaflet official documentation, Leaflet has a handy shortcut\
    \ of zooming in to the user’s location. If for some reason it will not pinpoint\
    \ the exact coordinates, it will create a buffer around the mobile user’s approximate\
    \ location.\n\n```\n// Zoom to your location\nmap.locate({setView: true, maxZoom:\
    \ 16});\n```\n\n### 11.5 Add marker to mobile user’s geolocation\n\nEven if the\
    \ location is off by a couple of miles, at least a marker to show the triangulated\
    \ position will help. At least you will not be *all over* the map! The following\
    \ code adds a marker to the mobile user’s triangulated Latitude-Longitude coordinates,\
    \ and displays a message showing the radius in which the mobile user is most likely\
    \ to be found from the marker point.\n\n```\n// Add marker at your location\n\
    function onLocationFound(e) {\n    var radius = e.accuracy;\n    L.marker(e.latlng).addTo(map)\n\
    \        .bindPopup(\"You are within \" + Number((radius/1000).toFixed(2)) + \"\
    \ kilometers from this\")\n    L.circle(e.latlng, radius).addTo(map);\n}\n```\n\
    \nIn case you forgot, the **on** method adds listeners. As a gentle reminder,\
    \ listeners are codes that run when an event is triggered, such as the simple\
    \ hovering of a mouse over a feature. In the below code, the listener 'locationfound'\
    \ triggers the **onLocationFound** function in case Leaflet successfully approximated\
    \ the user's location.\n\n```\nmap.on('locationfound', onLocationFound);\n```\n\
    \nThe **locationfound** listener is responsible for the message bounded in red\
    \ below when a browser loads a Leaflet map. Clicking **Allow** will give the browser\
    \ the heads up to zoom to the user's location as it best can.\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/location-found.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_113_0.png)\n\nWhat if, getting\
    \ the mobile user's geolocation is unsuccessful? We will create a function that\
    \ outputs the error event to our console, as shown below.\n\n```\n// Error displayed\
    \ after finding location failed\nfunction onLocationError(e) {\n    alert(e.message);\n\
    }\n```\n\nActually, **message** is an error event that displays the error message\
    \ of a parameter. The **message** event is parsed to the **onLocationError** function.\
    \ If the browser fails to approximate the user's location, the **onLocationError**\
    \ function returns 'true' which triggers an error alert on the browser.\n\n```\n\
    map.on('locationerror', onLocationError);\n```\n\n### 11.6 The mobile webmap app\n\
    \nYours truly has saved you the hustle of detailing how this chapter’s files have\
    \ been saved to Github and subsequently converted to a webpage. The key thing\
    \ to note is that the HTML file has to be named as `index.html` and not any other\
    \ name such as `map.html` since the name ‘index’ is the easiest way to render\
    \ a file on the fly on Github. Some additional steps exist to launch our Leaflet\
    \ map to the global web but to ensure brevity in this chapter, we suggest you\
    \ visit this authoritative Github page for further guidance. The link below should\
    \ nevertheless allow you to view the webapp on your phone.\n\nhttps://sammigachuhi.github.io/hospitals_webapp/\n\
    \n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/mobile-app.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_115_0.png)\n\nWe had initially\
    \ aimed for the stars by wanting to create a web app that in addition to the basemap\
    \ layers, it would also feature some layer controls. However, it seemed like we\
    \ landed on the skies instead. Nevertheless, this looks like a good hospital locations\
    \ app. The sky is only the baseline for what further features can be built on\
    \ top of this app.\n\nThe full code script is available from here.\n\n### 11.7\
    \ Summary\n\nEnabling a Leaflet map to be mobile friendly allows the Leaflet map\
    \ to load fast as well as scale efficiently on a smartphone. Here is what you've\
    \ learnt.\n\n-   A special `meta` tag is inserted in the `<head>` element of your\
    \ HTML file to enable the browser scale smoothly when a user is viewing a Leaflet\
    \ map on a smartphone.\n-   Leaflet has a special function, the `map.locate` that\
    \ geolocates and zooms to the user's exact coordinates. If for some reason precision\
    \ fails, it creates a buffer around the mobile user's approximate location.\n\
    -   In case Leaflet is unable to approximate the user's location, one can resort\
    \ to the `message` event which throws back an error on the browser.\n\n## Chapter\
    \ 12. Web Map Service Layers\n\n### 12.1 What are Web Map Service (WMS) Layers?\n\
    \nA Web Mapping Service (WMS) consists of geospatial data hosted through the internet\
    \ with standards set by the Open Geospatial Consortium (OGS).\n\nA WMS enables\
    \ the exchange of spatial information and viewing over the web in the form of\
    \ a map or image to your browser. The most common formats of Web Mapping Services\
    \ are Web Map Services (WMS), Web Feature Services (WFS), Web Coverage Services\
    \ (WCS), Web Processing Services (WPS), Web Map Tile Services (WMTS), and Web\
    \ Coverage Processing Services (WCPS). However, the Web Map Services (WMS) layer\
    \ is the most used. It offers basic panning, zooming and quick rendering speeds.\n\
    \n### 12.2 Loading a WMS server\n\nTo load a WMS layer into Leaflet, we use the\
    \ `L.tileLayer.wms` class. As simple as that. So let’s set up our Leaflet map.\
    \ Create a new JavaScript file named `wms_layers.js` and insert the following\
    \ code:\n\n```\nlet map = L.map('myMap').setView([-1.295287148, 36.81984753],\
    \ 7);\n\nlet tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',\
    \ {\n    maxZoom: 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n});\n```\n\nWe have added an OSM layer because we want to\
    \ create a layer control widget that also contains WMS layers so that you can\
    \ switch between an Open Street Map (OSM) layer and a WMS. For this exercise,\
    \ we shall add two WMS layers.\n\n```\nlet wmsLayerTopo = L.tileLayer.wms('https://www.gmrt.org/services/mapserver/wms_merc_m',\
    \ {\n    layers: 'topo',\n    format: 'image/png'\n})\n\nlet wmsLayerTopomask\
    \ = L.tileLayer.wms('https://www.gmrt.org/services/mapserver/wms_merc_m', {\n\
    \    layers: 'topo-mask',\n    format: 'image/png'\n})\n```\n\n### 12.3 Adding\
    \ WMS to layer control\n\nLet's insert the above web map layers into a JavaScript\
    \ object before parsing it to a layer control.\n\n```\nvar basemaps = {\n    OSM:\
    \ tileLayer,\n    Topo: wmsLayerTopo,\n    Topo_mask: wmsLayerTopomask,\n}\n```\n\
    \nNow let's parse the object into a control. If you did Chapter 8 then this should\
    \ look familiar.\n\n```\nL.control.layers(basemaps).addTo(map);\n\nbasemaps.Topo.addTo(map);\
    \  // To have the Topo as the default map layer\n```\n\nThe last line `basemaps.Topo.addTo(map)`\
    \ serves to set up the default layer that will appear when the map is loaded.\
    \ In this case it is the Topo key in var basemaps. If this last line is omitted,\
    \ Leaflet will only show a blank canvas unless one of the radioitems is selected.\n\
    \n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/wms_layer.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_119_0.png)\n\nAnd that’s it!\n\
    \nEven though we wanted to work with African-based WMS layers, of which Digital\
    \ Earth Africa provides plenty of them, for some reason this was not possible\
    \ despite diligently following their documentation. It is quite ironic that they\
    \ can be easily loaded in Qgis and not Leaflet.\n\nInterested in getting other\
    \ WMS layers? Go to Spartineo.com.\n\nThe files used in this chapter are available\
    \ here.\n\n### 12.4 Summary\n\nA Web Mapping Service (WMS) layer in many respects\
    \ looks and acts like a basemap. Just like Open Street Map and other similar servers,\
    \ WMS layers host data through the internet. Here are the take homes from this\
    \ chapter.\n\n-   A Web Mapping Service consists of geospatial data hosted through\
    \ the internet with standards set by the Open Geospatial Consortium (OGS).\n-\
    \   The most common formats of Web Mapping Services are Web Map Services (WMS),\
    \ Web Feature Services (WFS), Web Coverage Services (WCS), Web Processing Services\
    \ (WPS), Web Map Tile Services (WMTS), and Web Coverage Processing Services (WCPS).\n\
    -   The `L.tileLayer.wms` class is used to load WMS layers into Leaflet.\n-  \
    \ Just like any other basemap, one can parse WMS layer into Leaflet controls,\
    \ as seen with `wmsLayerTopo` and `wmsLayerTopomask`."
  mdcn: "\n## 第十一章 适配移动端的 Web 应用\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/mobile-friendly-error.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_112_0.png)\n\n要解决上面展示的错误，只需注释掉\
    \ `overlays` 对象并将其从 `L.control.layers()` 中移除。`L.control.layers()` 类应该只包含 `basemap`\
    \ 对象。\n\n### 11.4 缩放到移动端用户的位置\n\n根据 Leaflet 官方文档，Leaflet 提供了一个便捷的快捷方式，可以缩放到用户的位置。如果由于某些原因无法精确定位坐标，它会在移动用户的大致位置周围创建一个缓冲区。\n\
    \n```\n// Zoom to your location\nmap.locate({setView: true, maxZoom: 16});\n```\n\
    \n### 11.5 为移动用户地理定位添加标记\n\n即使位置偏差几英里，至少显示三角定位位置的标记会有所帮助。至少你不会在地图上*到处乱跑*！以下代码在移动用户三角定位的经纬度坐标处添加一个标记，并显示一条消息，说明移动用户最有可能位于该标记点半径范围内的区域。\n\
    \n```\n// Add marker at your location\nfunction onLocationFound(e) {\n    var\
    \ radius = e.accuracy;\n    L.marker(e.latlng).addTo(map)\n        .bindPopup(\"\
    You are within \" + Number((radius/1000).toFixed(2)) + \" kilometers from this\"\
    )\n    L.circle(e.latlng, radius).addTo(map);\n}\n```\n\n以防你忘记了，**on** 方法用于添加事件监听器。温和地提醒一下，监听器是在事件触发时运行的代码，例如鼠标悬停在某个要素上。在下面的代码中，如果\
    \ Leaflet 成功近似用户位置，监听器 'locationfound' 将触发 **onLocationFound** 函数。\n\n```\nmap.on('locationfound',\
    \ onLocationFound);\n```\n\n**locationfound** 监听器负责在浏览器加载 Leaflet 地图时，显示下面红色框住的消息。点击\
    \ **Allow** 将提示浏览器尽其所能缩放到用户的位置。\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/location-found.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_113_0.png)\n\n如果获取移动用户的地理定位失败怎么办？我们将创建一个函数，将错误事件输出到控制台，如下所示。\n\
    \n```\n// Error displayed after finding location failed\nfunction onLocationError(e)\
    \ {\n    alert(e.message);\n}\n```\n\n实际上，**message** 是一个错误事件，用于显示参数的错误消息。**message**\
    \ 事件被解析到 **onLocationError** 函数。如果浏览器无法近似用户位置，**onLocationError** 函数返回 'true'，这会触发浏览器上的错误警报。\n\
    \n```\nmap.on('locationerror', onLocationError);\n```\n\n### 11.6 移动端 Web 地图应用\n\
    \n本人已为你省去了详细说明本章文件如何保存到 Github 并随后转换为网页的麻烦。需要注意的关键是，HTML 文件必须命名为 `index.html`，而不是其他名称如\
    \ `map.html`，因为 'index' 这个名字是在 Github 上即时渲染文件的最简单方式。还有一些额外的步骤可以将我们的 Leaflet 地图发布到全球网络，但为了确保本章的简洁性，我们建议你访问这个权威的\
    \ Github 页面以获取进一步指导。不过，以下链接应该能让你在手机上查看该 Web 应用。\n\nhttps://sammigachuhi.github.io/hospitals_webapp/\n\
    \n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/mobile-app.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_115_0.png)\n\n我们最初的目标是星辰大海，想要创建一个除了底图图层外还具有一些图层控件的\
    \ Web 应用。然而，看起来我们似乎只够到了天空。尽管如此，这看起来像是一个不错的医院位置应用。天空只是在此应用基础上构建更多功能的基准。\n\n完整代码脚本可在此处获取。\n\
    \n### 11.7 总结\n\n启用 Leaflet 地图适配移动端，使其能够在智能手机上快速加载并高效缩放。以下是您学到的内容。\n\n-   在 HTML\
    \ 文件的 `<head>` 元素中插入一个特殊的 `meta` 标签，以便在用户于智能手机上查看 Leaflet 地图时，浏览器能够平滑缩放。\n-  \
    \ Leaflet 有一个特殊函数 `map.locate`，可以进行地理定位并缩放到用户的精确坐标。如果由于某种原因精度失败，它会在移动用户的大致位置周围创建一个缓冲区。\n\
    -   如果 Leaflet 无法近似用户位置，可以使用 `message` 事件，该事件会在浏览器上返回一个错误。\n\n## 第十二章 Web 地图服务图层\n\
    \n### 12.1 什么是 Web 地图服务（WMS）图层？\n\nWeb 地图服务（WMS）由通过互联网托管的地理空间数据组成，其标准由开放地理空间信息联盟（OGS）制定。\n\
    \nWMS 允许通过网络交换空间信息，并以地图或图像的形式在浏览器中查看。Web 地图服务最常见的格式包括 Web 地图服务（WMS）、Web 要素服务（WFS）、Web\
    \ 覆盖服务（WCS）、Web 处理服务（WPS）、Web 地图瓦片服务（WMTS）和 Web 覆盖处理服务（WCPS）。然而，Web 地图服务（WMS）图层是使用最广泛的。它提供基本的平移、缩放和快速渲染速度。\n\
    \n### 12.2 加载 WMS 服务器\n\n要将 WMS 图层加载到 Leaflet 中，我们使用 `L.tileLayer.wms` 类。就这么简单。那么让我们设置我们的\
    \ Leaflet 地图。创建一个名为 `wms_layers.js` 的新 JavaScript 文件，并插入以下代码：\n\n```\nlet map\
    \ = L.map('myMap').setView([-1.295287148, 36.81984753], 7);\n\nlet tileLayer =\
    \ L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {\n    maxZoom:\
    \ 19,\n    attribution: '&copy; <a href=\"http://www.openstreetmap.org/copyright\"\
    >OpenStreetMap</a>'\n});\n```\n\n我们添加了一个 OSM 图层，因为我们要创建一个图层控件小部件，其中也包含 WMS 图层，这样你就可以在\
    \ Open Street Map（OSM）图层和 WMS 之间切换。在这个练习中，我们将添加两个 WMS 图层。\n\n```\nlet wmsLayerTopo\
    \ = L.tileLayer.wms('https://www.gmrt.org/services/mapserver/wms_merc_m', {\n\
    \    layers: 'topo',\n    format: 'image/png'\n})\n\nlet wmsLayerTopomask = L.tileLayer.wms('https://www.gmrt.org/services/mapserver/wms_merc_m',\
    \ {\n    layers: 'topo-mask',\n    format: 'image/png'\n})\n```\n\n### 12.3 将\
    \ WMS 添加到图层控件\n\n让我们将上述 Web 地图图层插入到一个 JavaScript 对象中，然后将其解析给图层控件。\n\n```\nvar\
    \ basemaps = {\n    OSM: tileLayer,\n    Topo: wmsLayerTopo,\n    Topo_mask: wmsLayerTopomask,\n\
    }\n```\n\n现在让我们将该对象解析到控件中。如果你学过第八章，这应该看起来很熟悉。\n\n```\nL.control.layers(basemaps).addTo(map);\n\
    \nbasemaps.Topo.addTo(map);  // To have the Topo as the default map layer\n```\n\
    \n最后一行 `basemaps.Topo.addTo(map)` 用于设置地图加载时显示的默认图层。在本例中，它是 `var basemaps` 中的 Topo\
    \ 键。如果省略最后一行，除非选择了某个单选按钮项，否则 Leaflet 只会显示一个空白画布。\n\n```\nknitr::include_graphics(rep('D:/gachuhi/my-leaflet/images/wms_layer.jpg'))\n\
    ```\n\n![](img/264f6ca7b7ac3fbb9517b8a021818465_119_0.png)\n\n就是这样！\n\n尽管我们希望使用基于非洲的\
    \ WMS 图层（Digital Earth Africa 提供了很多），但由于某些原因，尽管我们认真遵循了其文档，还是无法成功。颇具讽刺意味的是，它们在\
    \ Qgis 中可以轻松加载，而在 Leaflet 中却不行。\n\n有兴趣获取其他 WMS 图层吗？请访问 Spartineo.com。\n\n本章使用的文件可在此处获取。\n\
    \n### 12.4 总结\n\nWeb 地图服务（WMS）图层在许多方面看起来和表现得像一个底图。就像 Open Street Map 和其他类似服务器一样，WMS\
    \ 图层通过互联网托管数据。以下是本章的要点。\n\n-   Web 地图服务由通过互联网托管的地理空间数据组成，其标准由开放地理空间信息联盟（OGS）制定。\n\
    -   Web 地图服务最常见的格式包括 Web 地图服务（WMS）、Web 要素服务（WFS）、Web 覆盖服务（WCS）、Web 处理服务（WPS）、Web\
    \ 地图瓦片服务（WMTS）和 Web 覆盖处理服务（WCPS）。\n-   `L.tileLayer.wms` 类用于将 WMS 图层加载到 Leaflet\
    \ 中。\n-   就像任何其他底图一样，可以将 WMS 图层解析到 Leaflet 控件中，如 `wmsLayerTopo` 和 `wmsLayerTopomask`\
    \ 所示。\n"
