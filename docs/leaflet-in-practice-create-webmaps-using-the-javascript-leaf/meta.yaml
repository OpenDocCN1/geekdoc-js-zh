    # 9.3. CREATING THE LEAFLET HEATMAP


    Heatmaps are one of the simplest forms of maps in geography. They use color and
    hue to visualize the concentration of phenomena across space. Here are the take
    home notes from this chapter.


    +   - Heatmaps are a type of maps that geographically visualize locations with
    patterns of higher than average occurrence of particular variables.

    - In order to draw heatmaps using Leaflet, we have to download the Leaflet.heat
    plugin. Thereafter, the path to the plugin is parsed to the script tag of your
    HTML file.

    - Apart from using L.heatLayer, the other alternative of creating heatmaps from
    GeoJSON data is through a combination of Ajax and jQuery.'
