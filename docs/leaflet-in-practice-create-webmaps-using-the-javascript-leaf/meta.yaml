    \n```\nvar info = L.control();\n```\n\n上面这行代码创建了一个名为 **info** 的变量，它保存了所有地图控件的基类\
    \ **L.control()**。例如，在 **L.control.zoom** 中，**L.control** 类会在地图中创建一个缩放控件。\n\n\
    ```\ninfo.onAdd = function (map) {\n    this.div = L.DomUtil.create('div', 'info');\n\
    \    this.update();\n    return this.div;\n};\n```\n\n上面的代码返回控件的DOM元素，并创建一个class为info的`<div>`。这是通过L.DomUtil的帮助完成的，根据Leaflet网站，它提供了用于处理文档对象模型(DOM)的实用函数¹。实际上，这个新的class为info的`<div>`是在你启动浏览器时创建的，但它只存在于你的浏览器中。不要期望它会神奇地出现在你的静态map.html文件中。\n\
    \n![div info 元素](img/264f6ca7b7ac3fbb9517b8a021818465_80_0.png)\n\n在上图中，红色框内的`<div>`\
    \ class在引入包含L.DomUtil的函数之前并不存在。继续向前，`this.update()`只是使用每个新点击县区的属性来更新自定义信息控件的内容。\n\
    \n```\n// 我们将根据传递的要素属性使用此方法更新控件\ninfo.update = function (props) {\n    this.div.innerHTML\
    \ = '<h4>肯尼亚人口密度</h4>' + (props ?\n        '<b>' + props.ADM1_EN + '</b><br />'\
    \ + '总人口' + '<br>' + props.County_pop +\n        props.Pop_Density + ' 人 / km<sup>2</sup>':\
    \ '将鼠标悬停在州上')\n};\n\ninfo.addTo(map);\n```\n\n上述函数使用每个县区的名称、人口和人口密度更新Leaflet地图。该函数被传递给变量`info.update`，然后使用`addTo`方法添加到地图中。此函数内部包含`this.div.innerHTML`。innerHTML的目的是返回一个元素的HTML内容。由于我们的地图是在HTML页面中渲染的，因此要素将以HTML形式返回。\n\
    \n> ¹ 文档对象模型(DOM)是网页上构成文档结构和内容的对象的数据表示。\n\n因为自定义信息控件是一个UI元素，我们需要在其CSS文件中设置其样式。将以下内容粘贴到你的**styles.css**文件中。\n\
    \n你可能会问，“我以为Leaflet不需要设置CSS样式，因为它似乎已经自带了所有样式”。\n\n我明白你的意思，但请记住我们创建了一个名为 **info**\
    \ 的新`<div>`，它在浏览器启动时出现。而且由于这个`<div class=\"info ...\">`必须在浏览器启动时出现，因此必须使用CSS样式来定义其外观。\n\
    \n```\n.info {\n    padding: 6px 8px;\n    font: 14px/16px Arial, Helvetica, sans-serif;\n\
    \    background: white;\n    background: rgba(255,255,255,0.8);\n    box-shadow:\
    \ 0 0 15px rgba(0,0,0,0.2);\n    border-radius: 5px;\n}\n\n.info h4 {\n    margin:\
    \ 0 0 5px;\n    color: #777;\n}\n```\n\n## 7.6 创建图例\n\n创建了自定义信息控件后，接下来的代码创建图例。\n\
    \n```\nvar legend = L.control({position: 'bottomright'});\n\nlegend.onAdd = function\
    \ (map) {\n    var div = L.DomUtil.create('div', 'info legend'),\n    grades =\
    \ [0, 25, 50, 100, 400, 700, 1400],\n    labels = [];\n\n    // 遍历我们的密度区间，并为每个区间生成一个带有彩色方块的标签\n\
    \    for (var i = 0; i < grades.length; i++) {\n        div.innerHTML +=\n   \
    \         '<i style=\"background:' + getColor(grades[i] + 1) + '\"></i> ' +\n\
    \            grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' :\
    \ '+');\n    }\n    return div;\n}\n\nlegend.addTo(map);\n```\n\n显然，我们的图例位置是通过`L.control({position:\
    \ 'bottomright'});`中的`position`选项设置的。\n\n除了我们在自定义信息控件中讨论的其他元素外，我们还通过`grades`数组设置了图例的颜色区间。随后的for循环遍历`grades`数组，为每个区间创建一个彩色方块。\n\
    \n老实说，创建图例配色方案的代码相当复杂。它实际上是从Leaflet分级统计图教程中复制粘贴而来的。循环中看起来奇怪的`&ndash;`只是连字符(-)在HTML中的写法。但无论如何，回到for循环，它本质上在每个区间内创建一个范围，例如0-25、25-50等等。这发生在前面讨论的?三元运算符之后。当循环到达末尾时，即超出范围时，会将`+`附加到`grades`数组的最后一个值上。最后这一步之所以可能，是因为JavaScript中的`:`会返回假值。\n\
    \n图例也需要它的CSS属性，否则它不会出现在浏览器中。class为`info legend`的`<div>`也是在浏览器启动时创建的。你可能会想知道为什么是`info\
    \ legend`而不是`legend`。嗯，亲爱的火眼金睛，由于浏览器（如HTML文件的情况）以自上而下的格式读取CSS，`.info`类的属性（如背景色等）也会被图例类继承。`legend`类只会覆盖那些也出现在`info\
    \ legend`类中的属性。我们还通过`.legend i`类指定了颜色区间和文本的CSS属性。\n\n以下是CSS。\n\n```\n.legend {\n\
    \    line-height: 18px;\n    color: #555;\n}\n.legend i {\n    width: 18px;\n\
    \    height: 18px;\n    float: left;\n    margin-right: 8px;\n    opacity: 0.7;\n\
    }\n```\n\n图例制作完成，最终被添加到地图上。\n"
