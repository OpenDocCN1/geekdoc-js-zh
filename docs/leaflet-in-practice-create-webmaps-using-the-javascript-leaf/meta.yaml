  md: "webmaps would not be possible since adding JavaScript code to a HTML file using\
    \ `<script>` is what makes the map appear on any website!\n\n# 1.4 CSS files\n\
    \nCSS stands for *Cascading Style Sheet*. The CSS defines how your HTML is to\
    \ appear, such as color and size of text, background color of the HTML as well\
    \ as the structure of your HTML page.\n\nCSS is quite a huge field despite appearing\
    \ simple to the novice's eye. However, the html elements of a webpage are accompanied\
    \ by a curly bracket containing the specified properties and values. The CSS terms\
    \ 'Properties' and 'Values' are described below.\n\n+   - Properties: These are\
    \ human-readable identifiers that indicate which stylistic features you want to\
    \ modify. For example, font-size, width, background-color.\n- Values: Each property\
    \ is assigned a value. This value indicates how to style the property.\n\nUsing\
    \ the example of our ProGMO website, this is how we would specify the font and\
    \ color of the `<body>` element of our webpage. In some cases, the property values\
    \ in CSS elements can be more than one, as in **font-family** below.\n\n```\n\
    body {\n    font-family: \"Open Sans\", sans-serif;\n    color: #444444;\n}\n\
    ```\n\nThe body in the CSS file is known as the selector. Selectors in CSS are\
    \ what tags are to HTML files. However, selectors can be more specific, such as\
    \ specifying the exact `<div>` that should be displayed in a particular way. Using\
    \ our HTML file example, if there were other `<div>`s apart from the `<div id=\"\
    division-1\">` above, we would specify the one with ID `division-1` in a CSS document\
    \ like so:\n\n```\n#division-1 {\n    font-family: \"Open Sans\", sans-serif;\n\
    \    color: #343a40;\n}\n```\n\nWe specify all specific IDs in a HTML file with\
    \ a prefix of #. Suppose there was a `<div id=\"division-2\">` somewhere in the\
    \ HTML. We would similarly define some properties specific to it in the manner\
    \ below:"
