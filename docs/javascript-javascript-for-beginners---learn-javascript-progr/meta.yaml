  md: "# Using JavaScript sensibly and responsibly\n\nThere is not much you cannot\
    \ do with JavaScript — especially when you mix it with other technologies like\
    \ Canvas or SVG. However, with great power comes responsibility, and you should\
    \ always remember the following when using JavaScript.\n\n+   - JavaScript might\
    \ not be available — this is easy to test for not really a problem. Things that\
    \ depend on JavaScript should be created with this in mind however, and you should\
    \ be careful that your site does not break (ie essential functionality is not\
    \ available) if JavaScript is not available.\n If the use of JavaScript does not\
    \ aid the user in reaching a goal q quickly and efficiently you are probably using\
    \ it wrong.\n Using JavaScript we often break conventions that people have got\
    \ used over the years of using the web (for example clicking links to other pages,\
    \ or a little basket icon meaning “shopping cart”). Whilst these usage patterns\
    \ might be outdated and inefficient, changing them still means users change their\
    \ ways — and this makes humans feel uneasy. We like being in control and once\
    \ we understand something, it is hard for us to deal with change. Your JavaScript\
    \ solutions feel naturally better than the previous interaction, but not so different\
    \ that the user cannot relate to it their previous experience. If you manage to\
    \ get a site visitor saying “ah ha — this means I don’t have to wait” or “Cool\
    \ — now I don’t have to extract this annoying step”— you have got yourself a great\
    \ use for JavaScript.\n JavaScript should never be a security measure. If you\
    \ need to prevent users from accessing data or you are likely to handle sensitive\
    \ data then don’t rely on JavaScript. Any JavaScript protection can easily be\
    \ reverse engineered and overcome, as all"
