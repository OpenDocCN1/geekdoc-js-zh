    # 进入 DOM 脚本


    当浏览器开始支持并实现文档对象模型（DOM）时，这允许我们与网页进行更丰富的交互，JavaScript 也开始变得越来越有趣。


    DOM 是文档的对象的表示。例如，上一个段落（通过“查看网页源代码”检查其源码）在 DOM 语言中，它是一个 `nodeName` 为 `p` 的元素节点。它包含三个子节点——一个
    `nodeValue` 为“When browsers started supporting and implementing the ”的文本节点，一个
    `nodeName` 为 `a` 的元素节点，以及另一个 `nodeValue` 为“, which allows us to have much richer
    interaction with web pages, JavaScript started to get more interesting.”的文本节点。该元素子节点还有一个名为
    `href` 的属性节点（其有一个值）以及一个 `nodeValue` 为“Document Object Model(DOM).”的文本节点子节点。


    你也可以使用树形图视觉化地表示这个段落，如图 2 所示。


    ![](img/1e18b19faf30def5147209a8ed4cbe90_11_0.png)


    图 2：我们的示例 DOM 树的可视化表示。


    用人类的话来说，你可以说 DOM 解释了文档中所有内容的类型、值和层次结构——目前你不需要了解更多。


    - 访问文档中的任何元素并操纵其外观、内容和属性。

    - 创建新的元素和内容，并在需要时将其应用到文档中。


    这意味着我们不再需要依赖窗口（windows）、框架（frames）、表单（forms）和丑的提示框（alerts），可以通过良好的样式在文档中为用户提供反馈，如图
    3 所示。


    ![](img/1e18b19faf30def5147209a8ed4cbe90_12_0.png)


    图 3：使用 DOM 你可以创建更漂亮且干扰更错误消息。


    结合事件处理，这是一个创建交互性和美观界面的强大武器。


    事件处理意味着我们的代码对浏览器中发生的事情做出反应。这些可能是自动发生的事情——例如页面加载完成——但大多数时候，我们对用户浏览器的操作做出反应。


    用户可能会调整窗口大小、滚动页面、按下某些键，或使用鼠标点击链接、按钮和元素。通过事件处理，我们可以等待这些事情发生，并让网页按照我们的意愿响应这些操作。过去，点击任何链接都会将访问者带到另一个文档，而我们现在可以劫持此功能并执行其他事情，比如显示或隐藏面板，或者获取链接中的信息并用它连接到网络服务。


    # JavaScript 的其他现代用途


    这基本上就是我们现在使用 JavaScript 所做的。我们增强了旧的、经典的 Web 界面——点击链接、输入信息和提交表单等——使其对终端用户产生响应。例如：


    注册表单可以在你输入用户名时检查其是否可用，防止你不得不忍受令人沮丧的页面刷新。


    搜索框可以在你打字时根据你目前输入的内容提供建议结果（例如，输入“bi”可以调出包含该字符串的建议，如“bird”、“big”和“bicycle”）。这种使用模式被称为自动补全。


    不断变化的信息可以定期加载而无需用户交互，例如体育比赛结果或股市行情。


    对于那些“锦上添花”但对某些用户来说可能冗余的信息，可以在用户选择访问时再加载。例如，一个网站的导航菜单可能有 6 个链接，但当用户激活菜单项时，可以按需显示更深层页面的链接。


    JavaScript 可以修复布局问题。使用 JavaScript，你可以找到页面上任何元素的位置和区域，以及浏览器窗口的尺寸。利用这些信息你可以防止元素重叠和其他问题。例如，假设你有一个多级菜单；在显示子菜单之前检查是否有足够的空间让其出现，你可以防止滚动条或菜单项重叠。


    JavaScript 可以增强 HTML 为我们提供的界面。虽然有一个文本输入框很不错，但你可能想要一个组合框（combo box），允许你从预设值列表中选择或输入自己的值。使用
    JavaScript，你可以增强普通的输入框来实现这一功能。


    你可以使用 JavaScript 制作页面元素的动画——例如显示和隐藏信息，或高亮页面的特定部分——这可以带来更好用、更丰富的用户体验。


    # 明智且负责任地使用 JavaScript


    没有什么是 JavaScript 办不到的——尤其是当你将其与 Canvas 或 SVG 等技术结合时。然而，能力越大责任越大，在使用 JavaScript
    时你应该始终记住以下几点：


    - JavaScript 可能不可——这很容易测试，并不是真正的问题。然而，依赖 JavaScript 的东西在创建时应该考虑到这一点，你应该确保当 JavaScript
    不可用时，你的网站不会崩溃（即核心功能不可用）。

    - 如果使用 JavaScript 没有帮助用户快速、高效地实现目标，你可能用错方法了。


    # 开始使用 JavaScript


    ## 入门：设置你的代码


    JavaScript 代码放在哪里？嗯，在页面的 `html` 标签内的任何地方。你的代码以 `<script type="text/javascript">`
    开始，以 `</script>` 结束。


    ```

    <html>

    <head><title>This is an example page</title></head>

    <body>

    Welcome to the JavaScript course!

    <script type="text/javascript">

    <!--

    document.write("Hi here. This text is written using JavaScript!")

    -->

    </script>

    </body>

    </html>

    ```


    输出：Hi here. This text is written using JavaScript!


    所示，我们用 `<script type="text/javascript">` 开始了脚本。红色部分是完全可选的，因为浏览器默认认为 `<script>`
    标签是 JavaScript，尽管出于验证原因，你仍然应该包含它。上述示例中的第二和第三行是 `<!--` 和 `-->`，它们是为 JavaScript
    定制的 HTML 注释标签。建议包含它们，以防止不支持 JavaScript 的非常旧的浏览器显示你的代码。如果你不包含它们且有人在使用这种浏览器，浏览器会将你的所有代码作为文本倾倒到屏幕上，换句话说，并不好看！这个脚本唯一的“功能部分”是
    `document.write("......")` 部分。它基本上会将你引号内的任何内容写入页面。现在不要太担心为什么这样做，我们稍后会详细讨论。我们用
    `</script>` 结束整个代码，这终止了脚本并回到 html。


    像 HTML 一样，你可以在 JavaScript 代码中插入注释。JavaScript 注释与 HTML 注释不同，后者是注释掉脚本中的行，使其不被解释。JavaScript
    注释的语法是：


    ```javascript

    //注释内容

    ```


    用于单行注释，或者


    ```javascript

    /*

    注释内容

    */

    ```


    用于多行注释：


    '
