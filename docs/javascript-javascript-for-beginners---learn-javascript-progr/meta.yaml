    2005年全球军费支出高达数千亿美元，但对于美国营销策略家阿尔尔·里斯（Al Ries）所描述的“……广告肮脏的小秘密：它没有任何实际用处”来说，这合理吗？


    那么……


    我们想要挑战国民总值的问题：仅用这笔钱的一部分就能拯救多少饥饿的人、多少种濒临灭的动物物种以及多少雨林？这是一个有趣且非常重要的讨论，但在本期中，我们决定专注于局面的业务部分。我们对今天的广告格局有一种替代方案，因为我们认为通过开发新产品和服务来建立信赖的沟通和品牌更为合适。这完全关乎创意、创新和设计。我们称之为“信誉环路”（The
    Credibility Loop）。


    ## 线条之前 (Before the line)


    在当今市场上，你需要一套卫生因素才能立足。所有的竞争对手都有良好的质量、良好的服务、良好的渠道、良好的人员、良好的价格、良好的沟通以及等方面……在索尼有句说法，所有产品的功能、性能、技术和价格都是相同的。他们的产品与竞争对手的唯一区别就是设计。为什么不把大部分精力放在开发良好的设计上呢？


    创意行业内部有大量关于线上广告（ATL）和线下广告（BTL）沟通的讨论。红角坐着的是 ATL，它涉及杂志、广播、电视和户外印刷等传统广告。在蓝色区域我们将找到
    BTL，它涉及公关（PR）、网络、直邮营销（DM）、零售沟通等。如果你问我们，ATL 已经被击倒了。但我们又向前了一步，引入了自己的 BTL：线条之前（Before
    the Line）。我们的 BTL 像蝴蝶一样飞舞，又像蜜蜂一样刺人……


    ## 更快的马 (Faster horses)


    直到今天，营销人员一直负责将新产品引入市场，这（仅仅）是因为他们的工作是了解人们喜欢和想要什么。但他们真的知道人们需要什么吗？观察人们在做什么比听他们说什么更有趣。看看你的孩子；他们喜欢你，但他们不喜欢你让他们做的事。如果让亨利·福特（Henry
    Ford）在直接询问人们的需求时，他可能得到的答案是“更快的马”，而不是“四四轮汽车”。


    我们认为营销人员经常具有同样的狭隘思维。他们中的许多人看不透现有类别，往往追求已经存在且可能的东西。


    所以，让一种创意设计文化席卷组织，将研发部门的创新思维与营销部门外向的随者相结合。只有通过结合不同的技能和思维，你才能创造出真正的创新，获得改变未来的可能。


    既然你无法赢得广告战，不如在“信誉环路”中兜一圈吧！


    让产品自己说话。给它们一个存在的理由（raison d''être）、个性和灵魂！这可能是差异化产品供应的最佳方式。从纯粹的财务角度来看：为什么不生产那些能够进行高效沟通的产品呢？


    为什么不将资金和精力从产品周期的末端（广告）转移到开始（研发）？通过这样做，公司可以更具创新性，并使其能够从开始就将沟通特性融入到产品中。通过赋予产品和服务更好的意义，目标群体自发寻找它们的机会会大得多。


    一个很好的例子：当苹果在2001年推出 iPod时，他们耗费了2450万美元来发布该产品。这是一笔巨款，但可能只是使用一个不那么吸引力的产品来达到同样的全球成功所需成本的十分之一。良好的设计和口碑完成了大部分工作。


    正如伟大的瑞典平面设计师奥莱·埃克斯塞尔（Ole Eksksell）在1964年描述的那样：设计 = 经济。最后：这一切关乎掌控局面。


    ## 设计策略触无处不在 (A design strategy has its tentacles everywhere)


    我们坚信，公司将通过良好的设计和创新策略建立更具信誉的品牌，而不是在最后只用广告包装产品。广告资金应该更好地用于那些能产生影响并造福业务和社会的创新。谁不想通过开发更具吸引力和可持续性的产品或服务来让人们的生活变得更好、更平等、更快乐呢？


    有些人可能会认为一切都会被复制：产品或服务。当然会，如果它足够成功。当每个人都拥有相同的技术时，复制永远存在。因此，你必须差异化并保持独特性，你需要更聪明、更主动。前进的良好方法是少技术官僚主义而多关注文化，因为企业的价值观是抄袭者最难复制的蓝图。通过在公司战略中整合设计策略（与营销、人力资源、研发、财务等一起），你会走得非常远。


    我们都熟悉从80年代起关于品牌的讨论：“我们的品牌是我们最宝贵的资产”。今天这已是常谈，一种卫生因素。如今，设计策略是“新的”品牌策略。


    像苹果这样拥有清晰设计策略的成功公司已经明白，设计问题必须在最高管理层进行讨论和决定。


    设计策略在公司战略中应该触无处不在，这就是为什么它是必要的且是一个不可战胜的竞争优势。它超越了企业形象和平面设计：它关乎你公司中发生的一切。你的客户服务如何响应？你的办公室里有鲜花和水果吗？接待室播放的是什么音乐？你的物流是否完全优化？你的产品或服务是如何包装的？你是如何展示它的？一切都关重要，没有什么是是不重要的，你必须具备全局视角并管理这个过程——设计过程。这是你最重要的过程，因为设计帮助你在沟通中取得成功。通过良好的沟通，你将触达客户并成为他们脑海中快乐且可能积极的一部分。


    总结这场永无止境的品牌讨论：品牌及其价值是设计过程的结果。


    ## 我们的总结 (Our windup)


    今天我们都知道我们必须进行开发、创新并寻找新的生存方式——无论是业务、个人还是环境考量。在 David Report，我们承担责任并关注一个业务困境——当你可以做一些更有力的事情，并且通过创新的研发同时建立你的品牌并售出更多产品/服务时，为什么要打广告？


    当你阅读上面的内容时，我们主张从广告转向以设计为中心的研发。在我们看来，这是通往明天社会业务生活的唯一途径。设计也是视觉化你的品牌和业务战略的最佳方式。


    表现得聪明，质疑广告标准，并在我们的信誉环路中兜一圈，换句话说：通过智能的设计策略建立你的品牌。


    ## C# .Net 中的数组 (Arrays in C# .Net)


    什么是数组？


    简单来说，数组是一个有组织的集合。它可以是任何东西的集合。要记住的重要的是它是一个集合。


    我们每天都使用数组


    一包 M&M 糖是数组的一个绝佳例子。我们很容易想象这一袋糖。当我们从袋子里取出每一颗 M&M 时，我们可以想象它们。它们基本上是相同的，但颜色不同。尽管颜色不同，但它们都是带有硬壳的巧克力糖果


    一袋 M&M 糖是 M&M 类型的数组。它是一个糖果的集合。


    如何声明一个数组？


    声明数组与声明其他变量非常相似。唯一的区别在于你正在声明一个包含多个值的变量。让我们比较一下这两个声明。


    ```

    String strEmotion = "happy";

    ```


    ```

    String[]strEmotions = {"happy","sad","elated","afraid","angry","peaceful"};

    ```


    上述两个变量 strEmotion 和 strEmotions 都是使用显式声明创建的，这意味着在创建它们的同时设置了值。通过使用括号 `[]`，编译器知道变量
    strEmotions 多个值。


    在这种情况下，我们将数组的大小设置为 6，因为我们添加了 6 个值。


    如何获取特定的特定值？


    一旦你理解了数组如何引用每个项，获取每个项的值并不难。起初这可能会有点困惑，因为数组使用零基引用。这意味着列表中的第一个项在 0 位置。


