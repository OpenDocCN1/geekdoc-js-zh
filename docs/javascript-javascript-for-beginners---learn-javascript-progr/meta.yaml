- md: '

    # Enter DOM scripting


    When browsers started supporting and implementing the Document Object Model (DOM),
    which allows us to have much richer interaction with web pages, JavaScript started
    to get more interesting.


    The DOM is an object representation of the document. The previous paragraph, for
    example (check out its source using view source), in DOM speak, is an element
    node with a nodeName of p. It contains three child nodes — a text node containing
    “When browsers started supporting and implementing the ” as its nodeValue, an
    element node with a nodeName of a, and another text node with a nodeValue of “,
    which allows us to have much richer interaction with web pages, JavaScript started
    to get more interesting.”. The child node also has an attribute node called href
    with a value and a child node that is a text node with a node-Value of “Document
    Object Model(DOM).”


    You could also represent this paragraph visually using a tree diagram, as seen
    in Figure 2.


    ![](img/1e18b19faf30def5147209a8ed4cbe90_11_0.png)


    Figure 2: A visual representation of our sample DOM tree.


    In human words you can say that the DOM explains both the types, the values and
    the hierarchy of everything in the document — you don''t need to know anything
    more for now.


    - Access any element in the document and manipulate its look, content and attributes.

    - Create new elements and content and apply them to the document when and if they
    are needed.


    This means that we don''t have to rely on windows, frames, forms and ugly alerts
    any longer, and can give feedback to the user in the document in a nicely styled
    manner, as indicated in Figure 3.


    ![](img/1e18b19faf30def5147209a8ed4cbe90_12_0.png)


    Figure 3: Using the DOM you can create nicer and less intrusive error messages.


    Together with event handling this is a very powerful arsenal to create interactive
    and beautiful interfaces.


    Event handling means that our code reacts to things that happen in the browser.
    This could be things that happen automatically — like the page finishing loading
    — but most of the time we react to what the user did to the browser.


    Users might resize the window, scroll the page, press certain keys or click on
    links, buttons and elements using the mouse. With event handling we can wait for
    these things to happen and tell the web page to respond to these actions as we
    wish. Whereas in the past, clicking any link would take the site visitor to another
    document, we can now hijack this functionality and do something else like showing
    and hiding a panel or taking the information in the link and using it to connect
    to a web service.


    # Other modern uses of JavaScript


    And this is basically what we are doing these days with JavaScript. We enhance
    the old, tried and true web interface — clicking links, entering information and
    sending off forms, etc. — to be responsive to the end user. For example:


    A sign-up form can check if your user name is available when you enter it, preventing
    you from having to endure a frustrating reload of the page.


    A search box can give you suggested results while you type, based on what you''ve
    entered so far (for example “bi” could bring up suggestions to choose from that
    string, as “bird”, “big” and “bicycle”). This usage pattern is called autocomplete.


    Information that changes constantly can be loaded periodically without the need
    for user interaction, for example sports match results or stock market tickers.


    Information that is a nice-to-have and runs the risk of being redundant to some
    users can be loaded when and if the user chooses to access it. For example the
    navigation menu of a site could be 6 links but display links to deeper pages on-demand
    when the user activates a menu item.


    JavaScript can fix layout issues. Using JavaScript you can find the position and
    area of any element on the page, and the dimensions of the browser window. Using
    this information you can prevent overlapping elements and other issues. Say for
    example you have a menu with several levels; by checking that there is space for
    the sub-menu to appear before showing it you can prevent scroll-bars or overlapping
    menu items.


    JavaScript can enhance the interfaces HTML gives us. While it is nice to have
    a text input box you might want to have a combo box allowing you to choose from
    a list of preset values or enter your own. Using JavaScript you can enhance a
    normal input box to do that.


    You can use JavaScript to animate elements on a page — for example to show and
    hide information, or highlight specific sections of a page — this can make for
    a more usable, richer user experience.


    # Using JavaScript sensibly and responsibly


    There is not much you cannot do with JavaScript — especially when you mix it with
    other technologies like Canvas or SVG. However, with great power comes responsibility,
    and you should always remember the following when using JavaScript.


    - JavaScript might not be available — this is easy to test for not really a problem.
    Things that depend on JavaScript should be created with this in mind however,
    and you should be careful that your site does not break (ie essential functionality
    is not available) if JavaScript is not available.

    - If the use of JavaScript does not aid the user in reaching a goal quickly and
    efficiently you are probably using it wrong.

    - Using JavaScript we often break conventions that people have got used over the
    years of using the web (for example clicking links to other pages, or a little
    basket icon meaning “shopping cart”). Whilst these usage patterns might be outdated
    and inefficient, changing them still means users change their ways — and this
    makes humans feel uneasy. We like being in control and once we understand something,
    it is hard for us to deal with change. Your JavaScript solutions feel naturally
    better. JavaScript should never be a security measure. Any protection can easily
    be reverse engineered and overcome, as all the code is available to read.


    # Get started with JavaScript


    ## Getting Started: Setting Up your code.


    Where do your JavaScript go? Well, anywhere inside the `html` tags of your page.
    The beginning of your code begins with `<script type="text/javascript">` and ends
    with `</script>`.


    ```

    <html>

    <head><title>This is an example page</title></head>

    <body>

    Welcome to the JavaScript course!

    <script type="text/javascript">

    <!--

    document.write("Hi here. This text is written using JavaScript!")

    -->

    </script>

    </body>

    </html>

    ```


    Output: Hi here. This text is written using JavaScript!


    As you can see, we began our script with the tag `<script type="text/javascript">`.
    The part in red is purely optional, as the browser by default assumes a `<script>`
    tag to be JavaScript, though you should include it nevertheless for validation
    reasons. The second and next lines of the above example are `<!--` and `-->`,
    which are HTML comment tags tailored for JavaScript. It is recommended you include
    them to hide your code against very old browsers that don''t support JavaScript.
    If you don''t include them and someone is using such a browser, the browser will
    just "dump" all your code as text onto the screen, in other words, not a pretty
    sight! The only "functional part" of this script is the `document.write("......")`
    part. It basically writes to the page whatever you put inside the quotes. Don''t
    worry so much about why this is so yet, we will discuss this in detail later.
    We end this entire code with `</script>` This terminates your script, and brings
    you back to html.


    Like html, you can insert comments in your JavaScript codes. JavaScript comments
    are different from HTML comments, with the later commenting out lines within your
    script so they don''t get interpreted. The syntax for JavaScript comments are:


    ```javascript

    //comment here

    ```


    for single-lined comments, or


    ```javascript

    /*

    comment here

    */

    ```


    for multiple ones:


    For example:


    ```javascript

    <script language="JavaScript">

    //----

    ```

