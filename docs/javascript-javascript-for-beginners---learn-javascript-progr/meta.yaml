    \ adding the block property to it, and then using auto margins. The CSS would\
    \ look like this:\n\n```css\n#div1 {\n  display: block;\n  margin: auto;\n  width:\
    \ anything under 100%;\n}\n```\n\nThe reason I put “anything under 100%” for width\
    \ is because if it was 100% wide, then it would be full-width and wouldn’t need\
    \ centering. It is best to have a fixed width, like 60% or 550px, etc.\n\n- 5.\
