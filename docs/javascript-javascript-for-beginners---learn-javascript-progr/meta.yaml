  - '[PAGE 39]


    # Why Create a jQuery plugin


    Sometimes its is useful to have a piece of functionality available throughout
    your code. Maybe you want a single function you can call on a jQuery selector
    that performs a specific action on such selector. Or maybe you wrote a utility
    function in one of your projects and now you want to be able to move it easily
    to other projects. In any case writing a plugin is your best option.


    jQueryis great. It''s cross-browser, easy to learn, and helps you make very user-friendly
    interfaces. It also comes with a lot of useful plugins to do almost whatever you
    want.


    But sometimes a lot is not enough, what if you can''t find just the right plugin
    to suit your needs? Or maybe there exist a plugin but its too large, and you just
    want part of it. The solution might be to roll up your selves and write your own
    stuff. After all it sound more complicated than it really is. This short tutorial
    will go through the the process of writing a simple plugin, adding some options,
    and even perform a callback.'
  - '[PAGE 40]


