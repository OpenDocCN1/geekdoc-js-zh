  md: '# The jQuery Plugin Structure


    jQuery is packed with all the necessary hooks to aid you in the development of
    our plugin. But is good to keep up the JavaScript good practices, so we must make
    sure everything is kept inside a local scope. Let''s start with the basic shell
    of a jQuery plugin:


    ```

    function($) {


    $.fn.simpleAccordion = function() {


    //TODO: code for simple accordion plugin


    }(jQuery));

    ```


    Let''s q uickly go through what''s going on here. By including everything in the
    (function() {}) self-enclosed JavaScript pattern, we''re making sure that the
    variables in our plugin will stay safely outside of the global namespace. We don''t
    run into conflicts with any other javascript running in this page, so we must
    isolate our code as we did above.


    The other thing you might notice is that we''re defining our plugin as if jQuery
    was in it''s "no-conflict" mode. Again, we''re seeking to avoid colliding with
    other JavaScript on the page, and thus we want to make sure that our plugin isn''t
    reliant on the default $, which could be used by another library.'
