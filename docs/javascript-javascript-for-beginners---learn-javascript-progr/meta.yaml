  md: '# 17. Drop caps


    Everyone loves drop caps. It reminds us of the traditional printed book, and is
    a great way to start a page of content. That 1st, larger letter really grabs your
    attention. There’s an easy way to create a drop cap in css, and it’s by using
    the pseudo element: :first letter. Here’s an example :


    ```

    p:first-letter {

    display:block;

    float:left;

    margin:3px;

    color:#f00;

    font-size:300%;

    }

    ```


    What this does is set the letter to 3x the size of the other letters. It sets
    3px of space around the letter to prevent overlapping, and sets the color of the
    letter to red.


    # 18. Force text to be all caps, all lowercase, or capitalized


    It would be absurd to type an entire section in all caps. Imagine having to go
    back and fix that later when the format of the website changes, or it gets updated.
    Instead, use the following css styles to force text to a certain formatting. This
    css targets the h2 title tag.


    ```

    h2 { text-transform: uppercase; } – all caps

    ```'
