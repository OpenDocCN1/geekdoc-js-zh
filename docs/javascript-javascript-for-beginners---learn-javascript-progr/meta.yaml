  md: '# Syntax of CSS


    First, CSS can be written within any text editor. But the text file must be saved
    with a CSS extension.


    The syntax of CSS consists of the selector and the declaration. The selector is
    the identifier within the body of your web page; the declaration is the code that
    identifies the style that you want to put into place as property and rule. Lets
    say you want all your H headlines to be green, with the font Arial. the code for
    CSS would be as follows:


    Note: Do not include q quotes around the code.


    ```

    "selector {property: rule;}"

    ```


    ```

    "H1 {color: green; font-family: Arial;}"

    ```


    Note: Notice that the property and rule must be enclosed in {}.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Placement of CSS


    There are three places to put your CSS code:


    In the Head (Internal), in an external file, or within an individual tag (Inline
    style).


    Internal -is used within a single web page that may have a uni que style.


    Inline - mixes code with content. Sometimes you may need to use it, but this style
    does seem to eliminate the need of even using a CSS style sheet.


    External - The CSS is separate from the body of the web page and is linked with
    the web page. Thus, to link an external file into a web page you will need to
    use the link tag.


    Example:


    ```

    <link rel="stylesheet" type="text/css" href="NameofCSS.css">

    ```


    (Goes in the head section after the title tag)


    Which way do you go? If you have a large site or a site that will be expanding,
    an external file would be a better way to q quickly and easily manipulate all
    your web pages at once.'
