  - '[PAGE 83]


    # CSS syntax comprises of three elements.


    Selector: The selector is the element within your HTML document you want to style.
    For instance, if you have placed a paragraph tag within your HTML, your selector
    would be "p" - the standard paragraph tag in CSS. If you wanted to apply styles
    to the entire body of your website, you would use "body" as the selector. At a
    later time, you''ll learn how to create your own selectors using the "class" and
    "id" tags.


    Property: Property are those elements that can be applied to a particular selector.
    Lets take the paragraph from the above example. A few properties you could use
    to style selector include font-family, font-size, color and a few others.


    Value: The value is the shape, size, dimension, etc. applied to a particular property.
    For instance, you would apply a value of 20px to the property above if you wanted
    your paragraph copy to display at 20px.


    Selector:


    ```

    p {

    ```


    Selector + Property:


    ```

    p {font-size:}

    ```


    Selector + Property + Value


    ```

    p {font-size: 20px};

    ```


    Now, lets get into the application of CSS. There are three ways you can apply'
  - '[PAGE 84]


    styles to your document.'
  - '[PAGE 85]


    # Inline Styles


    Inline styles simply mean you are placing the style for a particular element within
    the tag itself. For instance, if you wanted to color the text color of a paragraph
    blue, you would apply " blue;" within your paragraph tag.


    This method is okay, but not recommended. If you had a website 100 pages deep
    and each page used inline styles, when a change needs to be made, you would have
    to change all 100 pages independently.'
  - '[PAGE 86]


    # Internal Styles


    Internal styles mean including your styles within the HTML document itself. At
    the beginning of your HTML document, there are head tags. Your styles would be
    placed between these tags for reference. You might use this method if you had
    a single page website.'
  - '[PAGE 87]


    # External Styles


    Using external styles are the most effective way of using CSS. Your styles are
    held in an outside document that all HTML files connect to. This makes making
    global changes a breeze. Say you wanted to change the color of links on your 100
    page website. Instead of changing each page independently, you could change the
    style within the external document and there you have it. All pages would be changed
    - because they are all linked to the same style sheet.'
- md: "\n## Why is case sensitivity so much more important in JavaScript?\n\nIt's\
    \ the nature of the beast. Script is written in plain text, for starters, but\
    \ it is not just markup like HTML (which is largely case-insensitive) it is code,\
    \ and as such, subject to much more scrutiny by the browser's internal workings\
    \ (DOM APIs).\n\nvar names, Names;\n\nThe two variables look alike, almost, but\
    \ to JS they are worlds apart. What is important is that we recognize it, not\
    \ by its importance, but by its very nature. It is what it is.\n\n```\nfunction\
    \ Person(name, age){\n  this.name = name;\n  this.age = age;\n}\nvar person =\
    \ new Person(\"Zach\", 29);\n```\n\nWe can ignore the makeup of this code since\
    \ objects may not have been covered yet. The point here is to show that person\
    \ and Person are two completely different objects. Person is an object constructor\
    \ function, and person is an instance of that constructor class.\n\n```\nconsole.log(person);\n\
    // { name: 'Zach', age: 29 }\n```\n\nand,\n\n```\nconsole.log(Person);\n// [Function]\n\
    ```\n\nAs it stands, we all have to check our capitalization or meet possible\
    \ negative consequences such as syntax errors, reference errors and other exceptions.\
    \ Develop a keen eye, and keep a reminder that JS is case sensitive. Nothing we\
    \ can do to change this.\n\n## Understanding Comments\n\nYou can enter and track\
    \ comments about individuals and organizations. You can review all comments about\
    \ an individual or organization or all comments entered by a specific individual.\
    \ Because personal comments are subjective and often confidential, carefully analyze\
    \ your institution's needs and requirements for entering and tracking comments.\
    \ You should also be familiar with administrative functions and 3C group security\
    \ before setting up or creating comments in your system.\n\nWith the appropriate\
    \ security access, you can click the Create Comments button while on a page in\
    \ a functional area about that individual or organization to attach or review\
    \ comments to an individual's or an organization's record.\n\nYou can also navigate\
    \ through the menus to access the comments pages described in this documentation.\n\
    \n## Colons Used in Sentences\n\n- There are two choices at this time: run away\
    \ or fight.\n- We knew who win the game: the Eagles\n- He wanted to see three\
    \ cities in Italy: Rome, Florence and Venice\n- Remember: Two can play at that\
    \ game.\n- She kept repeating: “I really want that car!”\n- Barry wanted to know\
    \ why I didn’t respond to his text: I hadn’t received it.\n- Here are three states\
    \ that begin with M: Michigan, Mississippi and Maine.\n- You can come pick me\
    \ now: I am feeling much better.\n- Never forget this point: Think before you\
    \ speak.\n- This house has everything I need: two bedrooms, a backyard and a garage.\n\
    - The town reminded me of my childhood vacations: both were on the beach.\n- I\
    \ have several favorite genres of movies: drama, science fiction and mystery.\n\
    - This was first said by Shakespeare: \"To thine one self be true.\"\n- I bought\
    \ a lot of meat at the store: bacon, turkey, chicken and tuna.\n- The world is\
    \ a stage: play your role well.\n- The new boss has many nice traits: friendly,\
    \ outgoing and fair.\n- These are my favorite colors: purple, turquoise, pink\
    \ and yellow.\n\n## Semicolons in Sentences\n\n- Dad is going bald; his hair is\
    \ getting thinner and thinner.\n- I really like beef, with mushroom sauce; pasta,\
    \ with Alfredo sauce; and salad, with French dressing.\n- You should stop eating\
    \ so much food; you will have to go on a diet.\n- You need new brakes; otherwise\
    \ you may not be able to stop in time.\n- Star Trek is my favorite television\
    \ show during the 1960s; in fact, it is my favorite television show of all time.\n\
    - I had a huge meal; however, I am already hungry again.\n- The Christmas ornaments\
    \ are finally packed away: small, shiny ones; big, bright ones; and the homemade\
    \ ones.\n- She had self-defense training; consequently warded off the assailant.\n\
    - We had students from Lima, Peru; Santiago, Chile; and Caracas, Venezuela.\n\
    - We had too many fumbles; we lost the game.\n- I know you don't like broccoli;\
    \ nevertheless it is very good for you.\n- Michelle drives a Jaguar; Sonya drives\
    \ a Porsche.\n- I have finished the main course; now I have to make dessert.\n\
    - Spring brings gentle rains and warmer weather; in addition to thunderstorms\
    \ and hail.\n- She calls it the bathroom; I call it the loo.\n- Mom wants the\
    \ chores completed; moreover she wants them done properly.\n- I will be there\
    \ as soon as I finish working; that is a promise I will definitely keep.\n- She\
    \ didn’t see the other car coming; now her car has a huge dent.\n- There is mounting\
    \ evidence of global warning; of course some people will never believe it.\n\n\
    ## The Credibility Loop\n\nNow and then\n\nIn the old world we went to school\
    \ to get information, we trusted legal and other authorities and we consumed advertising\
    \ as entertainment. Most people at the age 30+ remember a time when everybody\
    \ arrived to the cinema minutes before the movie started just to see the commercials.\
    \ Today we get information nearly everywhere. We question authorities as they\
    \ serve the system, not the people, and advertising has become or soon will be\
    \ the most unreliable kind of information. Advertising is one-way communication\
    \ today the consumer want and demand interaction.\n\nWe are getting more critical,\
    \ well-informed and we want to search and find information ourselves. It's more\
    \ or less a rule that we frequently ask friends or small communities/subcultures\
    \ about references; we certainly don't believe an ad at page 3. The advertising\
    \ industry has for a long time produced refine but over-paid material, and this\
    \ will not be possible in the future. We all know that in today's media buzz it's\
    \ hard to get your voice heard, and one more advertising campaign is not the best\
    \ solution to get you through the noise.\n\nIt's the phenomena of advertising\
    \ ourselves we question, and the all (in all other senses) smart business men/women\
    \ that are holding yesterdays advertising culture under their wings. There are\
    \ lots of examples that advertising doesn't boost sales. So why do we still have\
    \ a culture of an \"advertising-landscape\", with expensive ads that do not generate\
    \ what they should generate?\n\nFear\n\nWhich fundamentals are used for setting\
    \ up a media budget? We can only speculate, but we can certainly say that the\
    \ psychological impact is heavy. The hunger for safety and the fear for failure\
    \ are stronger than questioning what's done before and the outcome of it.\n\n\
    An expensive and unsuccessful advertising campaign can't be justified due to financial\
    \ or rational arguments. But with emotional and psychological reasons this often\
    \ happens. What we are seeing is a global mass psychosis where a group of companies\
    \ (advertising agencies) with success are selling a product much overrated. How\
    \ could this happen? Has advertising turned into a very insurance premium?\n\n\
    ## Perception\n\nThe perception of the recipient has changed. With Internet, and\
    \ in some parts the globalisation (from a positive point of view) people have\
    \ a unique possibility to est the power of advertising. Yesterday it took days\
    \ or months to spread information that today only takes a second. Nowadays people\
    \ prefer to get their values, impacts and advices directly from search engines\
    \ on the web, from friends, influent sub groups or editorial press. An example:\
    \ If you going to New York and want to stay at a really special hotel, would you\
    \ check the hotel ads? Not likely. You rather ask a friend or read the hotel reviews.\
    \ Very few would trust the hotel ads: they are subjective and only deliver the\
    \ hotels message. How trustworthy is that?\n\n## GNP\n\nSome companies advertise\
    \ for more than some countries GNP. One trillion, or one thousand billions (1\
    \ 000,000,000,000) US dollars, low estimated, was spent on advertising in 2004\
    \ worldwide. Only in the US it was spent at least 500 billions (Procter & Gamble\
    \ spends most: 2,9 billions).\n\nCompare this with the 1.1 trillion dollars (1,118,000,000,000)\
    \ that was spent\n"
  mdcn: "\n\n## 为什么 JavaScript 对大小写敏感如此重要？\n\n这是由本质决定的。首先，脚本是用纯文本编写的，但它不仅仅是 HTML（HTML\
    \ 在很大程度上不区分大小写）那样的标记，它是代码，因此受到浏览器内部机制（DOM APIs）更严格的审查。\n\nvar names, Names;\n\n\
    这两个变量看起来几乎一样，但对 JS 来说，它们之间是天壤之别。重要的是我们要意识到这一点，不是因为它的重要性，而是因为它的本质。它就是它本该的样子。\n\n\
    ```\nfunction Person(name, age){\n  this.name = name;\n  this.age = age;\n}\n\
    var person = new Person(\"Zach\", 29);\n```\n\n我们可以忽略这段代码的构成，因为可能还没有介绍对象。这里的重点是展示\
    \ `person` 和 `Person` 是两个完全不同的对象。`Person` 是一个对象构造函数，而 `person` 是该构造类的实例。\n\n```\n\
    console.log(person);\n// { name: 'Zach', age: 29 }\n```\n\n以及，\n\n```\nconsole.log(Person);\n\
    // [Function]\n```\n\n目前，我们都必须检查自己的大小写，否则可能会遇到负面后果，如语法错误、引用错误和其他异常。培养敏锐的眼力，并记住\
    \ JS 是区分大小写的。对此我们无能为力。\n\n## 理解注释\n\n你可以输入并跟踪有关个人和组织的注释。你可以查看关于某个个人或组织的所有注释，或者查看特定个人输入的所有注释。由于个人注释是主观的且是机密的，请仔细分析你机构对输入和跟踪注释的需求和要求。在系统中设置或创建注释之前，你还应该熟悉管理功能和\
    \ 3C 组安全。\n\n在拥有相应的安全权限的情况下，你可以在该个人或组织的功能区域页面上点击“创建注释”按钮，以便为个人或组织的记录添加或查看注释。\n\
    \n你也可以通过菜单访问本文档中描述的注释页面。\n\n## 句子中的冒号\n\n- 此时有两个选择：逃跑或战斗。\n- 我们知道谁会赢比赛：老鹰队。\n\
    - 他想看意大利的三个城市：罗马、佛罗伦斯和威尼斯。\n- 记住：棋场如棋。\n- 她不断重复着：“我真的想要那辆车！”\n- Barry 想知道为什么我没有回他的短信：我没收到。\n\
    - 以下是三个以 M 开头的州：密歇根州、密西西比州和缅因州。\n- 你现在可以来接我：我感觉好多了。\n- 永远不要忘记这一点：言前思考。\n- 这房子有我需要的一切：两个卧室、一个后院和一个车库。\n\
    - 这个小镇让我想起童年的假期：两次都是在海边过的。\n- 我有几种喜欢的电影类型：剧情、科幻和悬疑。\n- 这是莎士比亚最早说过的：“对你自己忠实。”\n\
    - 我在商店买了很多肉：培根、火鸡肉、鸡肉和金枪鱼。\n- 世界是一个舞台：演好你的角色。\n- 新老板有很多优良特质：友善、外向和公平。\n- 这些是我喜欢的颜色：紫色、青松石、粉色和黄色。\n\
    \n## 句子中的分号\n\n- 爸爸正在秃顶；他的头发变得越来越稀少。\n- 我很喜欢配蘑菇酱的牛肉；配阿尔弗瑞多酱的意大利面；以及配法式酱的沙拉。\n\
    - 你应该少吃点食物了；你得减肥了。\n- 你需要新的刹车；否则你可能无法及时停下。\n- 《星际迷航》是我 20 世纪 60 年代喜欢的电视节目；事实上，它是我历史上喜欢的电视节目。\n\
    - 我吃了一大顿；然而，我已经饿了。\n- 圣诞装饰终于收好了：小的、发光的；大的、明亮的；还有手工做的。\n- 她接受过自防训练；因此击退了袭击者。\n\
    - 我们有来自秘鲁利马、智利圣地亚哥和委内瑞拉的加拉加斯的学生。\n- 我们失误了太多球；我们输掉了比赛。\n- 我知道你不喜欢西兰花；尽管如此它对你很有好处。\n\
    - Michelle 开的是捷豹；Sonya 开的是保时捷。\n- 我已经完成了主菜；现在我得做甜点了。\n- 春天带来了细雨和更温暖的天气；此外还有雷暴和冰。\n\
    - 她管那里叫浴室；我叫它厕所。\n- 妈妈希望家务能完成；而且她希望干得体面。\n- 我一结束工作就过去；那是我一定会会遵守的承诺。\n- 她没看到另一辆车开过来；现在她的车有一个巨大的凹痕。\n\
    - 全球变暖的证据日益增加；当然，有些人永远不会相信。\n\n## 信誉循环\n\n时而时地\n\n在旧世界，我们去学校获取信息，我们信任法律和其他权威，并将广告当作娱乐。大多数\
    \ 30 岁以上的人还记得，每个人在电影开始前几分钟到达电影院，只为了看广告。今天，我们几乎随处都能获得信息。我们质疑权威，因为他们服务的是系统而不是人民，而广告已经或很快将成为最不可信的信息。今天的广告是单向交流，而消费者想要并要求互动。\n\
    \n我们变得越来越具有批判性、见多识广，并希望自己搜索和发现信息。经常向朋友或小社区/亚文化寻求参考，多或是一个规则；我们绝不相信第 3 页的广告。广告业长期以来产生精良但价格过高的材料，这在未来将是不可能的。我们都知道，在如今的媒体喧嚣中，很难让自己的声音被听到，增加一次广告活动并不是让你穿过噪音的最佳解决方案。\n\
    \n我们质疑的是广告本身的现象，以及所有（在所有其他意义上）将昨天的广告文化护在手中的聪明男/女人们。有很多例子表明广告并没有提高销量。那么为什么我们仍然有这种“广告景观”文化，拥有那些没有产生预期效果的昂贵广告呢？\n\
    \n恐惧\n\n哪些基本要素被用于设定媒体预算？我们只能推测，但我们完全可以说，心理影响是巨大的。对安全的渴望和对失败的恐惧比质疑以前做过的事情及其结果更强大。\n\
    \n一个昂贵且失败的广告活动无法从财务或理性角度合理化。但从情感和心理原因来说，这种情况经常发生。我们看到的是一种全球性的精神幻觉，一群成功的公司（广告代理商）正在销售被被夸大的产品。这怎么会发生？广告已经变成了一种保险费吗？\n\
    \n## 感知\n\n接收者的感知已经发生了。随着互联网以及某些地区的全球化（从积极角度），人们有了评估广告能力的独特可能。过去传播信息需要几天或几个月，而今天只需要几秒钟。如今人们更倾向于直接从网络上的搜索引擎、朋友、有影响的小群体或编辑媒体中获取他们的价值观、影响和建议。例如：如果你去纽约并想住一家非常特别酒店，你会查看酒店广告吗？不太可能。你更倾向于问朋友或阅读酒店评论。很少有人会信任酒店广告：它们是主观的，只传递酒店的信息。这有多可信？\n\
    \n## GNP\n\n某些公司的广告费超过了某些国家的 GNP（国内总值）。1 万亿或一千亿（1,000,000,000,000）美元是 2004 年全球广告支出的低端估计值。仅在美国，支出就至少了\
    \ 5000 亿（宝洁支出最多：29 亿）。\n\n将其与花费的 1.1 万亿（1,118,000,000,000）进行对比\n\n"
