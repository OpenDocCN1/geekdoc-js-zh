  mdcn: "\n# 上浮动画\n\n上浮动画是元素悬停时一种非常棒的特效。\n\n快速上手：\n\n只需在你的任何元素上添加 `.of-push-up-animation`\
    \ 类即可。\n\n# 自定义\n\n你可以通过编辑 `src/base/breakpoints.less` 文件中的值来修改网格断点，然后重新编译项目。\n\
    \n```bash\n$ npm install && grunt release\n```\n\n# 命令行值\n\n此外，还可以向 `grunt` 命令传递网格断点的所需的值：\n\
    \n```bash\n$ npm install && grunt release --breakpoints='xxsm 0px, xsm 460px,\
    \ sm 606px, md 800px, lg 1164px, xlg 1440px, xxlg 1740px'\n```\n\n此 `breakpoints`\
    \ 参数将覆盖 `src/base/breakpoints.less` 中指定的默认值。它必须是一个由逗号分隔的 lessscss 数组值。\n\n每个断点由\
    \ `<name><space><width>` 组成：\n\n- `<name>` 是一个字符串，用于识别你的断点，其类名将使用该名称\n- `<space>`\
    \ 是一个分隔名称和宽度的简单空格\n- `<width>` 是以 px 为单位的值（正确的值如：0px, 300px, 500px 等）\n\n# 每位设计师都应该知道的\
    \ 20 个核心 CSS 技巧\n\n- 1. 绝对定位\n\n如果你希望始终控制元素在网站上的显示位置，绝对定位是实现这一点的关键。如果你将浏览器看作一个大边界框，绝对定位允许你精确控制元素留在框内的哪个位置。使用\
    \ `top`、`right`、`bottom` 和 `left` 配合像素值来控制元素停留的位置。\n\n```css\nposition:absolute;\n\
    top:20px;\nright:20px;\n```\n\n上述 CSS 将元素的位置设置为距离浏览器顶部和右边缘 20px。你也可以在 `div` 内部使用绝对定位。\n\
    \n- 2. `* +` 选择器\n\n`*` 允许你选择特定选择器的所有元素。例如，如果你使用了 `*p` 并对其添加 CSS 样式，它将应用于文档中所有带有\
    \ `<p>` 标签的元素。这使得能够全局地定位网站的部分区域变得简单。\n\n- 3. 覆盖所有样式\n\n这种方法应谨慎使用，因为如果你对所有内容都这样做，长远来看你会遇到麻烦。但是，如果你想为特定元素覆盖另一个\
    \ CSS 样式，请在 CSS 样式后使用 `!important`。例如，如果我想让网站特定区域的 H2 标题变为红色而不是蓝色，我会使用以下 CSS：\n\
    \n```css\n.section h2 { color:red!important; }\n```\n\n- 4. 居中\n\n居中很复杂，因为它取决于你想要居中什么。让我们根据内容来看下待居中元素的\
    \ CSS。\n\n### 文本\n\n文本使用 `text-align:center;` 居中。如果你希望它位于左侧或右侧，而不是居中。\n\n### 内容\n\
    \n通过为 `div`（或任何其他元素）添加 `block` 属性并使用 `auto` 外边距可以实现居中。CSS 看起来如下：\n\n```css\n#div1\
    \ {\n  display: block;\n  margin: auto;\n  width: anything under 100%;\n}\n```\n\
    \n我之所以将宽度设置为“100% 以下的任意值”，是因为如果宽度为 100%，那么它就是全宽的，就不需要居中了。最好的方法是设置固定宽度，例如 60% 或\
    \ 550px 等。\n\n- 5. 垂直对齐（针对单行文本）\n\n我几乎可以保证你会在 CSS 导航菜单中使用它。关键是让菜单的高度和文本的行高（line-height）保持一致。当我回去为客户修改现有网站时，我经常看到这种技术。这是一个示例：\n\
    \n```css\n.nav li {\n  line-height:50px;\n  height:50px;\n}\n```\n\n- 6. 悬停特效\n\
    \n这用于按钮、文本链接、网站的区块区域、图标等。如果你希望某个元素在鼠标悬停时时改变颜色，请使用 `hover` 选择器。这是一个示例：\n\n```css\n\
    .nav li:hover {\n  color: red;\n}\n```\n"
