  md: '# HTML Basics


    If you know nothing about html, you should definitely start from the basics; probably
    do some thorough reading online. Once you''ve grasped the html basics, the rest
    should be very simple. However, like in every subject, html basics must be learnt
    with care. You mustn''t miss a step. It''s advisable to follow one aspect of html
    basics at a time, and move on to advanced steps only if you understand the simpler
    ones. Just one more piece of advice - don''t get discouraged because html basics
    may seem to take forever to learn; it will all be worth it.


