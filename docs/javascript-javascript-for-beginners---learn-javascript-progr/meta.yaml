    多种语言绑定使得它可以在其他环境中可用。它是一种非交互式布局语言。它可以对文本和图形进行布局，并提供颜色、**粗体**、闪烁字体等。HTML 也是一种超文本标记语言。超文本是指任何格式的文本，但增加了一个功能：文本的部分链接到文本的其他部分，使得可以很容易地从文本的一个部分跳转到另一部分。


    它的目的不仅仅是包含内容，它还包含了描述自身和引用更多内容的数据。网络上的文本不仅仅是线性的，它是超文本。它的目的并不是重现艺术家梦想中视觉效果的精确外观。相反，它是为了让信息以结构化的方式组织，以便从设计的宽屏专业工作站到文本模式
    VT100 终端，再到盲人的语音文本阅读器，都能以易理解的方式进行渲染。它就是代码，仅此而已。


    它不是一种编程语言——它是一种“标记”语言，通过将简单的代码嵌入到描述文档结构、布局和格式的叙述中来实现功能。这些代码由网络浏览器进行“解释”或“解析”，并希望页面能按照设计的意图进行显示。它通常在
    Firefox 或 Internet Explorer 等网络浏览器中读取，并作为网页显示在用户的屏幕上。由于许多网页的默认属性未定义，由相同 HTML 代码编写的网页在不同的浏览器中可能看起来不同。它本质上是人们在万维网上进行通信和认可彼此的方式，因为它是核心标记语言。最新版本的超文本标记语言
    HTML5 最近发布，并带有值得自豪的新功能和元素。


    它本身并不是一种语言。它由放置在元素周围的标签组成，这些标签会改变这些被包围元素的属性。HTML 是一种复杂的脚本语言，而这个免费文本编辑器可能就是轻松创建网站的关键。它由一系列标签组成，类似于命令，告诉网络浏览器要做什么。这些标签可以输入到任何普通的文本编辑器（如记事本或
    Simple text）中，并且在顺序正确的情况下，就能形成网页。


    它是一个较弱的超文本实现的基础。早期的超文本系统具有诸如类型链接、包含和源头跟踪等功能。它是主要用于设计网页的语言。通过 HTML 的帮助，我们可以进行格式设置和表单设计。它的读法是一个字母一个字母地读，就像拼出
    HTML 这个单词。它不读作“hitmill”，而且它**不是**一种编程语言。它的设计并不是用于控制文档布局的这些方面。你应该做的是使用它来标记标题、段落、列表、超链接以及文档的其他结构部分，并添加样式表来单独指定布局，就像你可以在传统的桌面出版软件包中做的那样。它是万维网上最基础、常见的语言，而且相对容易学习。


    大多数开发者和内容创建者将其视为纯粹以人为本的技术。但日益增加机器处理（无论是通过搜索引擎、屏幕阅读器等辅助功能设备，还是浏览器本身）对于在线信息来说，变得像内容的类读者一样重要。Mozilla
    和 Safari 均推荐它而非 HTML，而且所有主流浏览器对它的支持通常也比 XHTML 好。它是（简而言之，且略过许多争议领域）用 SGML 创建的许多标记语言之一，而且是迄为止使用最广泛的语言。SGML
    本身有一种语法，它所有的应用（即所有用它创建的语言）都必须遵循该语法，但其本身（带过几个与本文讨论无关的问题）并没有语义。


    HTML 是一系列代码，用于在 MySpace 上创建网站页面，以及更改显示的特征。若要学习一个简单易懂的 HTML MySpace 教程，应该先创建一个
    MySpace 账号。HTML 由网络浏览器读取和处理。当浏览器读取你 HTML 文档中的 JavaScript 代码时，它会处理该代码，然后在网页内显示任何输出。


    # 如果你正在构建网站，为什么你应该了解 HTML 代码！


    回20年前，当互联网还处于婴儿阶段时，构建网页的唯一方法是使用简单的 Microsoft Windows 提供的免费文本编辑器记事本。现在，随着互联网已成为音乐、特效和
    Flash 的集合，编写 HTML 代码的艺术正在流失给 Microsoft FrontPage 和 Macromedia Dreamweaver MX 等
    HTML 编辑器。然而，无论你喜不喜欢，为了有效地构建网站，你仍然需要知道至少基础的 HTML 代码。


    让我解释一下……


    HTML 或超文本标记语言在本质上就是万维网的语言。没有 HTML，我们像 Netscape、Internet Explorer 或 Firefox 这样的网络浏览器就无法解析我们的网页。HTML
    由一系列标签组成，描述了你希望展示网页的内部机制和结构。现在认真地说，你可能可以在不知道一丁点 HTML 的情况下生存构建网页，但要在网络上取得真正的成功并非如此。


    搜索引擎现在是网络上使用的主要工具之一，你每天看到微软的 MSN、雅虎和 Google 在争夺搜索引擎的第一名，但作为程序员，能够让你的网站在搜索引擎中排名可能是最重要的技能之一。你首先需要知道如何正确格式化网页的头部标签，因为没有正确格式化的头部标签，搜索引擎就不知道你的网站关于什么，以及你希望关联的关键词。我在某些
    HTML 编辑器中看到的一个大问题是，它们提供的弹出表单可以帮助你设置描述和关键词，但忽略了其他重要的元数据，例如搜索引擎是否应该索引所有页面、网页的语言以及你创建的文档类型。


    我需要说明的一点是，仅仅提供这些信息并不意味着：


    - a) 所有搜索引擎都使用这些信息

    - b) 你保证能在搜索引擎中获得顶位置


    记住


