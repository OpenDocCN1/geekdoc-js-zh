  md: '# 20 Essential CSS Tricks Every Designer Should Know


    +   1. Absolute positioning


    If you want control over where an element lives on our website at all times, absolute
    positioning is the key to making this happen. If you think of your browser as
    one big bounding box, absolute positioning allows you to control exactly where
    in that box an element will stay. Use top, right, bottom and left, accompanied
    by a pixel value to control where an element stays.


    ```

    position:absolute;

    top:20px;

    right:20px

    ```


    The CSS above sets the position of an element to stay 20px from the top and right
    edges of your browser. You can also use absolute positioning inside of a div.


    +   2. * + selector


    The * enables you to select all elements of a particular selector. For example,
    if you used *p and then added CSS styles to that, it would do it to all elements
    in your document with a <p> tag. This makes it easy to target parts of your website
    globally.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 3. Overriding all styles


    This should be used sparingly, because if you do this for everything, you’re going
    to find yourself in trouble in the long run. However, if you want to override
    another CSS style for a specific element, use !important after the style in your
    css. For example, if I wanted the H2 headers in a specific section of my site
    to be red instead of blue, I would use the following CSS:


    ```

    .section h2 { color:red!important; }

    ```


    # 4. Centering


    Centering is tricky, because it depends on what you’re trying to center. Let’s
    take a look at the CSS of items to be centered, based on content.


    Text


    Text is centered using the text-align:center;. If you want it to either side,
    left or right instead of center.


    Content


    A div (or any other element) can be centered by adding the block property to it,
    and then using auto margins. The CSS would look like this:


    ```

    #div1 {

    display: block;

    margin: auto;

    ```'
