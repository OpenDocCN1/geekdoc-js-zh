- img_proc: true
  md: 'the current date are all examples of non-HTML objects that you can work with
    by using JavaScript.


    Together, all the objects that make up a Web site — HTML objects, browser-and
    platform-related objects, and special objects built right into the JavaScript
    language — are known as the document object model (DOM).'
