    # Push up animation\n\nPush up animation is a nice effect for hovering on elements.\n\
    \nQuick start:\n\nJust append `.of-push-up-animation` class to any of your elements.\n\
    \n# Customization\n\nIt is possible to edit the grid breakpoints by editing the\
    \ values in the src/base/breakpoints.less file and then recompiling the project.\n\
    \n```bash\n$ npm install && grunt release\n```\n\n# Command Line Values\n\nIn\
    \ addition to this, it is possible to pass in, to the grunt command, the desired\
    \ values for the grid breakpoints:\n\n```bash\n$ npm install && grunt release\
    \ --breakpoints='xxsm 0px, xsm 460px, sm 606px, md 800px, lg 1164px, xlg 1440px,\
    \ xxlg 1740px'\n```\n\nThis breakpoints argument will override the default value\
    \ specified in src/base/breakpoints.less. It has to be a lessscss array value\
    \ separated by comma.\n\nThen each breakpoint is made of <name><space><width>:\n\
    \n- <name> is a string and it will be used to identify your breakpoint, its classes\
    \ will use this\n- <space> a simple space to separate the name and the width\n\
    - <width> a value expressed in px (correct values are like: 0px, 300px, 500px\
    \ and so on)\n\n# 20 Essential CSS Tricks Every Designer Should Know\n\n- 1. Absolute\
    \ positioning\n\nIf you want control over where an element lives on our website\
    \ at all times, absolute positioning is the key to making this happen. If you\
    \ think of your browser as one big bounding box, absolute positioning allows you\
    \ to control exactly where in that box an element will stay. Use top, right, bottom\
    \ and left, accompanied by a pixel value to control where an element stays.\n\n\
    ```css\nposition:absolute;\ntop:20px;\nright:20px;\n```\n\nThe CSS above sets\
    \ the position of an element to stay 20px from the top and right edges of your\
    \ browser. You can also use absolute positioning inside of a div.\n\n- 2. * +\
    \ selector\n\nThe * enables you to select all elements of a particular selector.\
    \ For example, if you used `*p` and then added CSS styles to that, it would do\
    \ it to all elements in your document with a <p> tag. This makes it easy to target\
    \ parts of your website globally.\n\n- 3. Overriding all styles\n\nThis should\
    \ be used sparingly, because if you do this for everything, you’re going to find\
    \ yourself in trouble in the long run. However, if you want to override another\
    \ CSS style for a specific element, use !important after the style in your css.\
    \ For example, if I wanted the H2 headers in a specific section of my site to\
    \ be red instead of blue, I would use the following CSS:\n\n```css\n.section h2\
    \ { color:red!important; }\n```\n\n- 4. Centering\n\nCentering is tricky, because\
    \ it depends on what you’re trying to center. Let’s take a look at the CSS of\
    \ items to be centered, based on content.\n\n### Text\n\nText is centered using\
