  md: '# Common uses of JavaScript


    The usage of JavaScript has changed over the years we''ve been using it. At first,
    JavaScript interaction with the site was mostly limited to interacting forms,
    giving feedback to the user and detecting when they do certain things. We used
    alert() to notify the user of something (see Figure 1), confirm() to ask if something
    is OK to do or not and either prompt() or a form field to get user input.


    ![](img/1e18b19faf30def5147209a8ed4cbe90_10_0.png)


    Figure 1: Telling the end user about errors using an alert() statement was all
    we could do in the early days of JavaScript. Neither pretty nor subtle.


    This lead mostly to validation scripts that stopped the user to send a form to
    the server when there was a mistake, and simple converters and calculators. In
    addition, we also managed to build highly useless things like prompts asking the
    user for their name to print it out immediately afterwards.


    Another thing we used was document.write() to add content to the document. We
    also worked with popup windows and frames and lost many a nerve and pulled out
    fair hair trying to make them talk to each other. Thinking about most of these
    technologies should make any developer forward and backward and curl up into a
    fetal position stammering “make them go away”, so let’s not dwell on these things
    — there are better ways to use JavaScript!'
  merge: -1
  pgno: 10
