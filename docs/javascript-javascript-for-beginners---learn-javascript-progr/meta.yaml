    # classList API


    We''ve used all the addClass, removeClass, and toggleClass methods in our favorite
    JavaScript libraries. For the sake of supporting older browsers, each library
    would grab the element''s className (in its string format) and appending/removing
    the class, then updates the className string. There''s a newer API for adding,
    removing, and toggling classes, and it''s called classList:


