  md: '# Introduction to JavaScript


    JavaScript is an interpreted programming language, built on the ECMAScript standard.
    The language definition is really broad since it can be defined as aprocedural
    language based on prototypes, imperative, weakly typed, and dynamic.


    JavaScript is mainly used as a client side programming language implemented as
    part of a web browser to allow developers an improved way to implement user interface
    and dynamic features in web pages, although there are implementations of JavaScript
    on the server side (SSJS) the popularity of the language is due to the client
    side implementations alone. JavaScript can also be found outside web applications,
    for example as a way to add interactivity to PDF documents and desktop widgets.


    JavaScript was designed with a similar syntax as C, although it takes names and
    conventions from the Java programming language. However, despite the name Java
    and JavaScript are not related and have different semantics and purposes.


    JavaScript was originally developed by Brendan Eich of Netscape under the name
    Mocha, which was later renamed to LiveScript, to finally called JavaScript. The
    name change coincided approximately with the moment in which Netscape added support
    for Java technology in its web browser Netscape Navigator version 2.0B3 in late
    1995. The name JavaScript was confusion, giving the impression that the language
    is an extension of Java, and it has been characterized by many as a marketing
    strategy for Netscape to gain prestige and innovate in what were the new web programming
    languages.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'The following year Microsoft implemented a similar client side programming
    languages as part of its Internet Explorer 3.0 web browser. Microsoft called its
    client side language "jscript", to avoid problems related to the brand. The Jscript
    term seems so similar that the both "javascript" and "jscript" are often used
    interchangeably, but the specification of JScript is not 100% compatible with
    the ECMA specifications.


    To avoid these incompatibilities, the World Wide Web Consortium (W3C) designed
    the standard Document Object Model (DOM, or document object model), which was
    incorporated in the version 6 of Internet Explorer and Netscape Navigator, Opera
    version 7, Mozilla Firefox since its first release, and all modern thereafter.


    In 1997 there was a proposal to submit JavaScript to the standard of the European
    Computer Manufacturers '' Association ECMA, which despite its name is not European
    but international, based in Geneva. In June 1997, it was adopted as an ECMA standard
    under the name of ECMAScript. JavaScript also became an ISO standard.


    Because of its standardization and the great adoption of the internet, JavaScript
    has become the most used programming language in the planet.


    Note: JavaScript is a registered trademark of Oracle Corporation. It is used under
    license by the products created by Netscape Communications and current entities
    such as the Mozilla Foundation.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# Uses of JavaScript


    JavaScript is present in most web pages today. Chances are that the page you are
    looking at right now contains the code for JavaScript. Try this activity: Right-click
    on a web page, then click ''View Source''. You should be able to find the word
    JavaScript somewhere in the code of the page.


    While HTML markup language allows web developers to format content, JavaScript
    allows them to make the page dynamic. For example, HTML allows for making text
    bold, creating text boxes, and creating buttons, whereas JavaScript allows for
    changing text on the page, creating pop-up messages, and validating text in text
    boxes to make sure re q fields have been filled. JavaScript makes web pages more
    dynamic by allowing users to interact with web pages, click on elements, and change
    the pages.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# # What JavaScript can do for you


    Let''s take a step back and count the merits of JavaScript:


    +   - JavaScript is very easy to implement. All you need to do is put your code
    in the HTML document and tell the browser that it is JavaScript.

    - JavaScript works on web users’ computers - even when they are offline!

    - JavaScript allows you to create highly responsive interfaces that improve your
    user experience and provide dynamic functionality, without having to wait for
    the server to react and show another page.

    - JavaScript can load content into the document if and when the user needs it,
    without reloading the entire page — this is commonly referred to as Ajax.

    - JavaScript can test for what is possible in your browser and react accordingly
    — this is called Principles of unobtrusive JavaScript or sometimes defensive Scripting.

    - JavaScript can help fix browser problems or patch holes in browser support —
    for example fixing CSS layout issues in certain browsers.


    That is a lot for a language that until recently was laughed at by programmers
    ‘higher programming languages’. One part of the renaissance of JavaScript is that
    we are building more and more complex web applications these days, and high interactivity
    requires Flash (or other plugins) or scripting. JavaScript is arguably the best
    way to go, as it is a web standard, or is supported natively across browsers (more
    or less — some things differ across browsers, and these differences are discussed
    in appropriate places in the articles that follow this one), and it is compatible
    with other open web standards.'
  merge: -1
  pgno: 8
