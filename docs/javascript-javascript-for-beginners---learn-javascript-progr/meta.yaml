- md: "\nthough every search engine is different and that the algorithms they use\
    \ for website placement is incredibly complex and certainly a well guarded secret\
    \ but if you add these elements at least you will get a few points in the positive\
    \ direction.\n\nThere is another reason for putting this information into your\
    \ website. Not having some of this information can also affect the ability of\
