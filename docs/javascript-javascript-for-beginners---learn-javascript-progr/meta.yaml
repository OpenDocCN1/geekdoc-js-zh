    You can download the entire project from GitHub


    For this tutorial, we will be creating a simple accordion plugin. Let''s create
    a js file and put it in the "js" directory of our website. It''s tradition to
    start all js plugin''s files with "j q query dot" followed by the actual plugin
    name, so we''ll call ours "j q query-simple-accordion.js".


    +   - Our plugin file inside the js directory inside our website directory


    Now we need to include our plugin file along with the jQuery library to our main
    HTML page (index.html). It is best practice to include the jQuery library directly
    from the Google api servers, since they are distributed across the world instead
    of your single server location: Closer servers usually means faster response times
    for the visitor. Another advantage of having jQuery included from Google, is that
    when a visitor comes to your site they may already have the jQuery script in their
    local cache. Pre-cached content usually means faster load times for the visitor.'
