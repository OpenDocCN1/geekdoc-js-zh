    \n让我们快速回顾一下这段代码的作用。首先，你需要理解 jQuery 是一个扩展了 JavaScript 语言的库。在创建任何 jQuery 插件时，你本质上是在扩展你的插件扩展\
    \ jQuery 库的方式，而这又是在扩展 JavaScript。真正理解你的插件如何扩展 jQuery 库，需要理解 JavaScript 的 `prototype`（原型）属性。虽然它没有被直接使用，但\
    \ JavaScript `prototype` 属性通过 jQuery 属性 `fn` 在后台使用，`fn` 是原生 JavaScript `prototype`\
    \ 属性的 jQuery 别名。\n\n简单来说，你通过 `fn.\"your-plugin-name\"` 从 jQuery 扩展你的插件。\n\n此外，我们还可以添加选项来传递给我们的插件。一个\
    \ jQuery 插件可以包含默认值和选项。选项（options）是你传递给插件的参数。与其发送多个参数，不如使用一个选项对象，你可以发送多个属性，这是 jQuery\
    \ 的标准做法。在插件中允许选项时，最佳实践是使用 `defaults` 对象设置默认选项。与选项一样，`defaults` 是一个对象字面量，它应该包含你允许传递给插件的属性。\n\
    \n让我们快速为插件添加选项，以展示它是有多简单。我们将传递一个选项参数，在插件初次加载时打开折风琴的第一部分。\n\n```javascript\n(function($)\
    \ {\n  $fn.simpleAccordion = function(options) {\n    var state = $.extend({},\
    \ {open: false}, options);\n\n    return this.each(function() {\n      var dts\
    \ = $(this).children('dt');\n\n      dts.click(accordionClick);\n\n      dts.each(reset);\n\
    \n      if(state.open)\n        $(this).children('dt:first-child').next().show();\n\
    \    });\n\n    function accordionClick() {\n      $(this).siblings('dt').each(hide);\n\
    \      $(this).next().slideDown('fast');\n\n      return false;\n    }\n\n   \
    \ function hide() {\n      $(this).next().slideUp('fast');\n    }\n\n    function\
    \ reset() {\n      $(this).next().hide();\n    }\n  });\n})(jQuery);\n```\n\n\
    如果你注意到，我们使用了 `open:false` 的默认值，所以如果没有传递任何选项，插件将假设你希望在初次加载时关闭折风琴。当插件接收到选项时，你可以依赖\
    \ `$.extend` 方法执行实际的覆盖。`$.extend` 方法的作用是合并两个或多个对象。\n\n## JavaScript 与 CSS\n\n\
    CSS 和 JavaScript：随着每个浏览器的发布，界限似乎变得模糊了。它们的作用一直非常不同，但最终它们都是前端技术，因此需要紧密配合。我们有 `.js`\
    \ 文件和 `.css` 文件，但这并不意味着 CSS 和 JS 的交互可以比基础 JavaScript 框架允许的更密切。这里是 JavaScript 和\
    \ CSS 工作的五种你可能不知道的方法！\n\n## 使用 JavaScript 获取伪元素属性\n\n我们知道可以通过 `style` 属性获取元素的基础\
    \ CSS 样式值，但伪元素（pseudo-element）属性呢？是的，JavaScript 甚至可以访问它们！\n\n```javascript\n//\
    \ 获取 .element:before 的颜色值\nvar color = window.getComputedStyle(\n  document.querySelector('.element'),\
    \ ':before'\n).getPropertyValue('color');\n\n// 获取 .element:before 的内容值\nvar content\
    \ = window.getComputedStyle(\n  document.querySelector('.element'), ':before'\n\
    ).getPropertyValue('content');\n```\n\n## classList API\n\n我们在喜爱的 JavaScript 库中使用过所有的\
    \ `addClass`、`removeClass` 和 `toggleClass` 方法。为了支持旧版浏览器，每个库都会获取元素的 `className`（其字符串格式）并添加/删除类名，然后更新。而\
    \ `classList` API 是一个更现代的方法，它允许我们添加、移除和切换类：\n\n```javascript\nmyDiv.classList.add('class');\
    \ // 添加类\n\nmyDiv.classList.remove('class'); // 移除类\n\nmyDiv.classList.toggle('class');\
    \ // 切换类\n```\n\n## 直接向表中添加和移除样式\n\n我们熟悉通过 `style` 属性修改样式，但你是否知道可以通过 JavaScript\
    \ 直接操作样式规则？这比基础 JavaScript 框架允许的更直接。\n\n```javascript\nfunction addCSSRule(selector,\
    \ rules) {\n  if (sheet.insertRule) {\n    sheet.insertRule(selector + \"{\" +\
    \ rules + \"}\");\n  } else {\n    sheet.style.setPropertyRule(selector, rules,\
    \ index);\n  }\n}\n\n// 使用它！\naddCSSRule(document.styleSheets[0], \"float: left\"\
    );\n```\n\n## 懒加载 CSS 文件\n\n我们可以通过 JavaScript 懒加载如图像、JSON 等资源，但你是否知道你可以在回调函数中处理样式表呢？\n\
    \n```javascript\ncurl([\n  \"namespace/MyWidget\",\n  \"namespace/css\"\n], function(MyWidget)\
    \ {\n  // 处理 MyWidget\n});\n```\n\n## CSS 核心\n\n## pointer-events\n\n`pointer-events`\
    \ 属性很有趣，它几乎可以像 JavaScript 一样工作，当值为 `none` 时可以禁用元素。\n\n```css\n.disabled { pointer-events:\
    \ none; }\n```\n\n## 使用\n\n通过 bower 安装包：\n\n```bash\nbower install ess\n```\n\n\
    使用时：\n\n```html\n<link rel=\"stylesheet\" href=\"bower_components/ess/dist/ess.min.css\"\
    >\n```\n\n通过 npm：\n\n```bash\nnpm install ess\n```\n\n## 基础\n\n我们需要超过 3-4 个断点（breakpoints）来真正适应屏幕，所以我们定义了：\n\
    \n```css\n@media-xsm: 460px;\n@media-sm: 606px;\n@media-md: 800px;\n@media-lg:\
    \ 1164px;\n@media-xlg: 1440px;\n@media-xxlg: 1740px;\n```\n\n## 浏览器支持\n\n我们倾向于支持\
    \ `n-1`，其中 `n` 是浏览器的版本。\n\n## 网格\n\n基于 24 列的网格使用 flex 创建。\n\n快速开始：\n\n```html\n\
