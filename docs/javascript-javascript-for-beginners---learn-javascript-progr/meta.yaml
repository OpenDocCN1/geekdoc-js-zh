    This the brakpoints argument will override the default value specified in src/base/breakpoints.less.
    It has to be a lessscss array value separated by comma.


    Then each breakpoint is made of <name><space><width>:


    +   - <name> is a string and it will be used to identify your breakpoint, its
    classes will use this

    - <space> a simple space to separate the name and the width

    - <width> a value expressed in px (correct values are like: 0px, 300px, 500px
    and so on)'
