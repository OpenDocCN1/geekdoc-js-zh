    What this does is it changes the color of your h2 tag from black to red when someone
    hovers over it. The great thing about using :hover is that you don''t have to
    declare the font-size or weight again, if it isn''t changing. It only changes
    what you specify.


    Transition


    For hover effects, like with menus or on images in your website, you don''t want
    colors snapping too quickly to the end result. You ideally want to ease the change
    in gradually, which is where the transition property comes into play.


    ```

    .entry h2:hover {

    color:#f00;

    transition: all 0.3s ease;

    }

    ```


    This makes the change happen over .3 seconds, instead of just instantly'
