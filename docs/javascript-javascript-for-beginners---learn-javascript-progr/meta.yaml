- img_proc: true
  md: '# Faster horses


    Up to today the marketing people have been in charge for entering new products
    to the market, and this (only) because their job is to know what people like and
    want. But do they really know what people need? It''s more interesting to see
    what people are doing instead of listening what they are saying. Look at your
    children; they do like you, do not like you tell them to do. And Henry Ford would
    probably got the answer "faster horses" instead of "a vehicle with four wheels"
    on a direct q uestion about peoples'' needs.


    We think the marketing people q uite often have the same narrow-minded thinking.
    A lot of them don''t see beyond existing categories and often goes for what''s
    already available and possible.


    So, let a creative design culture sweep through the organisation and combine the
    innovative minds from the R&D department with the outgoing ditto from the marketing
    department. It is only by combining different skills and mindsets you can create
    real innovations give you the possibility to change the future.


    As you can''t the advertising battle - go for a ride with the Credibility Loop!


    Let the products talk themselves. Give them a raison d''être, personality and
    a soul! It''s probably the best way to differentiate a product offer. And out
    of a strictly financial point of view: what are the reasons not produce products
    that communicate efficient itself?


    Why not transfer money and efforts from the end (advertising) to the start (R&D)
    of a product life cycle? By doing this companies can be much more innovative and
    it will give them the possibility to build-in communicative qalities into the
    products from the start. And by giving products and services a better meaning,
    the chance is much greater that the'
