  md: '```

    <INPUT TYPE="button" NAME="processOrder" VALUE="Click to process your order"

    OnClick="processOrder();"

    ...


    </HTML>

    ```


    You can use the <SCRIPT> and </SCRIPT> tags to include a separate, external JavaScript
    file (a file containing only JavaScript statements bearing a .js extension) into
    an HTML file.


    In the example below, the JavaScript processOrder() function is defined in the
    myJSfile.js file. The function is triggered, or called, when the user clicks the
    Click Here to Process Your Order link.


    ```

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript" SRC="myJSfile.js">

    </SCRIPT>

    </HEAD>

    <BODY>

    <A HREF="javascript:processOrder();">Click here to process your order.</A>

    ...

    </BODY>

    </HTML>

    ```


    Because Web pages aren’t made of HTML alone, JavaScript provides access to more
    than just HTML objects. JavaScript also provides access to browser-and platform-specific
    objects. Browser plug-ins (such as RealPlayer and Adobe Acrobat), the name and
    version of a particular viewer’s browser, and'
  merge: -1
