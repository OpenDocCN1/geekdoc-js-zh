    \ through this tutorial, you will.\n\n## JavaScript and HTML\n\nYou can think\
    \ of JavaScript as an extension to HTML; an add-on. Here’s how it works. HTML\
    \ tags create objects; JavaScript lets you manipulate those objects. For example,\
    \ to create a Web page as shown in Table 1, after that document is created you\
    \ can interact with it using JavaScript. For example, you can use a special construct\
    \ called the onload handler to trigger an action — perhaps when the document is\
    \ loaded onto a browser. Examples of other HTML objects that you interact with\
    \ JavaScript include windows, text fields, images, and applets.\n\nTable 1: Creating\
    \ and Working with Objects\n\n| Object | HTML Tag | JavaScript |\n| :--- | :---\
    \ | :--- |\n| Web page | `<body>...</body>` | document |\n| Image | `<img name=\"\
    myimage\">` | document.myimage |\n| HTML form | `<form name=\"myForm\">...</form>`\
    \ | document.myForm |\n| Button | `<input type='button' name=\"myButton\">` |\
    \ document.myButton |\n\nTo add JavaScript to a Web page, all you have to do is\
    \ embed JavaScript code in an HTML file. Below the line in which you embed code,\
    \ you can reference or call that JavaScript code in response to an event handler.\
    \ You have two choices when it comes to embedding JavaScript code in an HTML file:\n\
    \nYou can use the `<script>` tags to include JavaScript code directly into an\
    \ HTML file. In the example below, a JavaScript function called myFunction is\
    \ defined at the top of the HTML file. Further down in the HTML file, the function\
    \ is associated with an event handler — specifically the onclick event. (In other\
    \ words, the JavaScript code contained in the myFunction function runs when a\
    \ user clicks the button.)\n\n```html\n<html>\n<head>\n<script language=\"JavaScript\"\
    >\n// JavaScript statements go here\nfunction myFunction() {\n// More JavaScript\
    \ statements go here\n}\n</script>\n</head>\n<body>\n<form name=\"myForm\">\n\
    <input type=\"button\" name=\"myButton\" value=\"Click to order\" onclick=\"myFunction();\"\
    >\n</form>\n</body>\n</html>\n```\n\nYou can use the `<script>` tags to include\
    \ a separate external JavaScript file (a file containing only JavaScript statements\
    \ bearing a .js extension) into an HTML file. In the example below, the JavaScript\
    \ function is defined in myfile.js. The function is triggered or called when the\
    \ user clicks the link.\n\n```html\n<html>\n<head>\n<script language=\"JavaScript\"\
    \ src=\"myfile.js\"></script>\n</head>\n<body>\n<a href=\"javascript:myFunction();\"\
    >Click here</a></a>\n</body>\n</html>\n```\n\nBecause Web pages aren’t made of\
    \ HTML alone, JavaScript provides access to more than just HTML objects. JavaScript\
    \ also provides access to browser-specific objects. Browser plugins (such as RealPlayer\
    \ and Adobe Acrobat), the name and version of a particular viewer, and the current\
    \ date are all examples of non-HTML objects that you can work with using JavaScript.\n\
    \nTogether, all the objects that make up a website — HTML objects, browser-related\
    \ objects, and special objects built right into the language — are known as the\
    \ document object model (DOM).\n\n## HTML Basics\n\nIf you know nothing about\
    \ HTML, you should definitely start from the basics and do some thorough reading\
    \ online. Once you've grasped the basics, the rest should be very simple. However,\
