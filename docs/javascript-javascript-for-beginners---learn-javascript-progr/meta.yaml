  md: '# The Credibility Loop


    Now and then


    In the old world we went to school to get information, we trusted legal and other
    authorities and we consumed advertising as entertainment. Most people at the age
    30+ remember a time when everybody arrived to the cinema minutes before the movie
    started just to see the commercials. Today we get information nearly everywhere.
    We question authorities as they serve the system, not the people, and advertising
    has become or soon will be the most unreliable kind of information. Advertising
    is one-way communication today the consumer want and demand interaction.


    We are getting more critical, well-informed and we want to search and find information
    ourselves. It''s more or less a rule that we frequently ask friends or small communities/subcultures
    about references; we certainly don''t believe an ad at page 3. The advertising
    industry has for a long time produced refine but over-paid material, and this
    will not be possible in the future. We all know that in today''s media buzz it''s
    hard to get your voice heard, and one more advertising campaign is not the best
    solution to get you through the noise.


    It''s the phenomena of advertising ourselves we question, and the all (in all
    other senses) smart business men/women that are holding yesterdays advertising
    culture under their wings. There are lots of examples that advertising doesn''t
    boost sales. So why do we still have a culture of an "advertising-landscape",
    with expensive ads that do not generate what they should generate?


    Fear'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'Which fundamentals are used for setting up a media budget? We can only speculate,
    but we can certainly say that the psychological impact is heavy. The hunger for
    safety and the fear for failure are stronger than q questioning what''s done before
    and the outcome of it.


    An expensive and unsuccessful advertising campaign can''t be justified due to
    financial or rational arguments. But with emotional and psychological reasons
    this often happens. What we are seeing is a global mass psychosis where a group
    of companies (advertising agencies) with success are selling a product much overrated.
    How could this happen? Has advertising turned into a very expensive insurance
    premium?


    # Perception


    The perception of the recipient has changed. With Internet, and in some parts
    the globalisation (from a positive point of view) people have a unique possibility
    to q est the power of advertising. Yesterday it took days or months to spread
    information that today only takes a second. Nowadays people prefer to get their
    values, impacts and advices directly from search engines on the web, from friends,
    influent sub groups or editorial press. An example: If you going to New York and
    want to stay at a really special hotel, would you check the hotel ads? Not likely.
    You rather ask a friend or read the hotel reviews. Very few would trust the hotel
    ads: they are subjective and only deliver the hotels message. How trustworthy
    is that?


    GNP


    Some companies advertise for more than some countries GNP. One trillion, or one
    thousand billions (1 000 000 000 000) US dollars, low estimated, was spent on
    advertising in 2004 worldwide. Only in the US it was spent at least 500 billions
    (Procter & Gamble spends most: 2,9 billions).


    Compare this with the 1.1 trillion dollars (1 118 000 000 000) that was spent'
  merge: -1
  pgno: 94
- img_proc: true
  md: '2005 worldwide in military expenses, or is this reasonable for something that
    Al Ries, the US marketing strategist describes as "...advertising''s dirty little
    secret: it serves no useful purpose?"


    So...


    We would like to challenge the GNP question; how many starving people, which amount
    of animal species under threat of extermination and how much rain forest could
    be saved with just a fragment of this money? An interesting and very important
    discussion, but in this issue we have decided to concentrate on the business part
    of the situation. We have an alternative to today''s advertising-landscape as
    we think it''s more appropriate to create trustworthy communication and brands
    by development of new products and services. It''s all about creativity, innovation
    and design. We call it The Credibility Loop.


    Before the line


    You need an arsenal of hygiene factors to be on the market nowadays. All competitors
    have good quality, good service, good distribution, good personnel, good price,
    good communication and good whatsoever...At Sony there is a saying that all products
    have the same function, performance, technology and price. The only thing that
    differentiates their products from their competitors is design. Why not putting
    most efforts in developing good design?


    There''s lot of talking going on inside the creative industries concerning Above
    the Line (ATL) and Below the Line (BTL) communication. In the red corner sits
    ATL, which concerns traditional advertising in magazines, radio, TV and outdoor
    prints. In the blue color we will find BTL, which concerns PR, web, DM, retail
    communication etc. If you ask us, ATL is knocked down. But we take the issue one
    step further and introduce our own BTL: Before the Line. Our BTL dances like a
    butterfly and stings like a bee...'
  merge: -1
