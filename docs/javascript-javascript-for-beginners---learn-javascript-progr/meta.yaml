    \ Club or where the best Golfing Clubs and ranges can be found.\n\nWhen you are\
    \ submitting your articles to places like EzineArticles.com, GoArticles.com or\
    \ ArticlesON.com will ask you to use certain html tags to help accentuate your\
    \ article. For example generally in the body of your article you can only use\
    \ things like bold, italics, underline and list items but in other areas where\
    \ you put your details you can add things like Hyperlinks and Hypertext. Now in\
    \ the three article submission sites mentioned before, if you want to add a Hyperlink\
    \ then you must know your basic HTML code, because they do not build your links\
    \ for you, you have to write the HTML Tags from scratch.\n\nWhen you are building\
    \ your hyperlinks to link back to your webpage, you will want to make sure one\
    \ things -\n\n- 1. The Hyperlink, that is the webpage or website you are linking\
    \ to contains the keywords in either domain name, folder name or webpage name.\n\
    - 2. Make sure the Hypertext or better known as anchor text uses your keywords\
    \ as well.\n\nLet us look at a basic example. If I had written a really cool article\
    \ on a brand new Golf Club that I knew was going to sell millions and had a lot\
    \ of interest in the market then my link back to the webpage that provides more\
    \ information on the Golf Club would be built in the way shown below. Let us say\
    \ the name of the Golf Club is called the Lion Heart X9.\n\n# Learning JQuery\n\
    \n# Why Create a jQuery plugin\n\nSometimes its is useful to have a piece of functionality\
    \ available throughout your code. Maybe you want a single function you can call\
    \ on a jQuery selector that performs a specific action on such selector. Or maybe\
    \ you wrote a utility function in one of your projects and now you want to be\
    \ able to move it easily to other projects. In any case writing a plugin is your\
    \ best option.\n\njQuery is great. It's cross-browser, easy to learn, and helps\
    \ you make very user-friendly interfaces. It also comes with a lot of useful plugins\
    \ to do almost whatever you want.\n\nBut sometimes a lot is not enough, what if\
    \ you can't find just the right plugin to suit your needs? Or maybe there exist\
    \ a plugin but its too large, and you just want part of it. The solution might\
    \ be to roll up your yourselves and write your own stuff. After all it sound more\
    \ complicated than it really is. This short tutorial will go through the process\
    \ of writing a simple plugin, adding some options, and even perform a callback.\n\
    \n# Setting Up\n\nYou can download the entire project from GitHub\n\nFor this\
    \ tutorial, we will be creating a simple accordion plugin. Let's create a js file\
    \ and put it in the \"js\" directory of our website. It's tradition to start all\
    \ js plugin's files with \"jquery.plugin\" followed by the actual plugin name,\
    \ so we'll call ours \"jquery-simple-accordion.js\".\n\n- Our plugin file inside\
    \ the js directory inside our website directory\n\nNow we need to include our\
    \ plugin file along with the jQuery library to our main HTML page (index.html).\
    \ It is best practice to include the jQuery library directly from the Google api\
    \ servers, since they are distributed across the world instead of your single\
    \ server location: Closer servers usually means faster response times for the\
    \ visitor. Another advantage of having jQuery included from Google, is that when\
    \ a visitor comes to your site they may already have the jQuery script in their\
    \ local cache. Pre-cached content usually means faster load times for the visitor.\n\
    \n# The jQuery Plugin Structure\n\njQuery is packed with all the necessary hooks\
    \ to aid you in the development of our plugin. But is good to keep up the JavaScript\
    \ good practices, so we must make sure everything is kept inside a local scope.\
    \ Let's start with the basic shell of a jQuery plugin:\n\n```\nfunction($) {\n\
    \n$.fn.simpleAccordion = function() {\n\n//TODO: code for simple accordion plugin\n\
    \n}(jQuery));\n```\n\nLet's quickly go through what's going on here. By including\
    \ everything in the (function() {}) self-enclosed JavaScript pattern, we're making\
    \ sure that the variables in our plugin will stay safely outside of the global\
    \ namespace. We don't run into conflicts with any other javascript running in\
    \ this page, so we must isolate our code as we did above.\n\nThe other thing you\
    \ might notice is that we're defining our plugin as if jQuery was in it's \"no-conflict\"\
    \ mode. Again, we're seeking to avoid colliding with other JavaScript on the page,\
    \ and thus we want to make sure that our plugin isn't reliant on.\n\nFinally,\
    \ $.fn is jQuery's way of allowing you to define our plugin, which we've named\
    \ simpleAccordion. With all of our pieces in place, let's get cooking!\n\n# Adding\
    \ Functionalities to Our Plugin\n\nWhat is great about jQuery is that it lets\
    \ you use any selector you want. However, you must keep in mind that our plug-in\
    \ can be dealing with several element types. Using the \"this\" keyword lets our-in\
    \ apply the associated functions by accessing each element in a loop.\n\nGetting\
    \ The HTML Part - Structuring The Accordion\n\nSince we are building an accordion\
    \ we are going to need structure for it, so here we go:\n\n## Cras dolor elit,\
    \ porttitor ac diam bibendum, eleifend ali qam erat.\n\n## Donecc blandit nec\
    \ est tristi interdum.\n\n## Fusce sit amet arcu id malesuada faucibus.\n\n##\
    \ Ali qam tincidunt lobortis sem porttitor.\n\nThis is a simple accordion structure,\
    \ defining four titles and their respective content areas. So the idea is that\
    \ our plugin will turn this HTML code into a functional accordion, where an user\
    \ can open and collapse sections.\n\nThis is how it should look like:\n\nJust\
    \ to make it look pretty we should add some simple styles. So here we go:\n\n\
    ```\n.accordion {\n\nwidth: 600px;\n\nborder: 1px solid #ccc;\n\nborder-bottom:\
    \ none;\n}\n\n.accordion dt,.accordion dd {\n\nborder-bottom: 1px solid #ccc;\n\
    }\n\n```\n\n```css\nmargin: 0px;\n}\n\n.accordion dt {\n  background: rgba(193,\
    \ 221, 252, 0.24);\n  cursor: pointer;\n  padding: 8px 4px;\n  font-size: 14px;\n\
    \  font-weight: bold;\n}\n\n.accordion dd {\n  padding: 12px 8px;\n}\n```\n\n\
    Now our accordion structure should look like this:\n\n# The jQuery Part - Time\
    \ To Make It Do Something!\n\nTo add functionality to our plugin we are going\
    \ to edit the js file and add the following code:\n\n```\nfunction($) {\n\n$fn.simpleAccordion\
    \ = function(options) {\n\nreturn this.each(function() {\n\nvar dts = $(this).children('dt');\n\
    \ndts.click(accordionClick);\n\ndts.each(reset);\n\n});\n\nfunction accordionClick()\
    \ {\n\n$(this).siblings('dt').each(hide);\n\n$(this).next().slideDown('fast');\n\
    \nreturn false;\n}\n```\n"
  mdcn: "\n虽然每个搜索引擎都各不相同，而且它们用于网站排名的算法极其复杂，且无疑是严密保护的秘密，但如果你添加了这些元素，至少你会在积极的方向上获得一些加分。\n\
    \n将这些信息放入你的网站还有另一个原因。没有包含其中的一些信息也会影响视障人士查看你网站的能力。这听起来可能有点奇怪，但视障人士拥有工具可以将网页转换为盲文信息。然而，在某些情况下，如果没有在元数据标签（meta\
    \ tags）中包含如内容语言和字符集等上述信息，可能会影响他们的盲文软件是否能正确读取你的网站。因此，如果你的客户群建立在 30% 的视障人士市场基础上，那么你就是在损失金。\n\
    \n你应该学会如何编写基础的 HTML 代码的其他关键原因之一是帮助你构建指向你网页的反向链接（incoming links）。构建这些反向链接的一种技术是编写文章，为人们提供关于你业务的信息。例如，如果你有一个销售所有高尔夫用品的网站，你可能会考虑写关于如何选择高尔夫球杆或在哪里可以找到最好的高尔夫俱乐部和练习场的文章。\n\
    \n当你将文章提交到 EzineArticles.com、GoArticles.com 或 ArticlesON.com 等地方时，它们会要求你使用某些 HTML\
    \ 标签来突出你的文章。例如，通常在文章正文中，你只能使用加粗、斜体、下划线和列表项等，但在放置详细信息的其他区域，你可以添加超链接和超文本等。现在，在之前提到的三个文章提交网站中，如果你想添加超链接，就必须掌握基础的\
    \ HTML 代码，因为它们不会为你构建链接，你必须从零开始编写 HTML 标签。\n\n当你构建链接回你网页的超链接时，你需要确保一点——\n\n- 1.\
    \ 超链接（即你所链接的网页或网站）在域名名、文件夹名或网页名中包含关键词。\n- 2. 确保超文本（或更广为人知的锚点文本）也使用了你的关键词。\n\n\
    让我们来看一个简单的例子。如果我为一款全新的全新的高尔夫球杆写了一篇非常酷的文章，我知道它将售出数百万支，并在市场上引起极大关注，那么我指向提供该高尔夫球杆更多信息的网页的链接将如下所示构建。假设这款高尔夫球杆的名字叫\
    \ Lion Heart X9。\n\n# 学习 jQuery\n\n# 为什么要创建一个 jQuery 插件\n\n有时，在整个代码中提供某项功能是很有用的。也许你想要一个单一函数，可以在\
    \ jQuery 选择器上调用它，并对该选择器执行特定操作。或者可能你已经在其中一个项目中写了一个工具函数，现在你想能够轻松地将其移动到其他项目中。无论何种，编写插件都是你的最佳选择。\n\
    \njQuery 非常棒。它是跨浏览器的、易学习的，并且帮助你创建非常友好的界面。它还带有很多实用的插件，几乎可以胜任你想做的任何事情。\n\n但有时仅仅是不够的，如果你找不到刚好适合你需求的插件怎么办？或者可能存在某个插件但它太大了，而你只需要其中的一部分。解决方案可能是自己卷起袖子写些你自己的东西。毕竟，这听起来比实际上要复杂。这个简短的教程将介绍编写简单插件、添加一些选项甚至执行回调函数的过程。\n\
    \n# 设置\n\n你可以从 GitHub 下载整个项目\n\n在本教程中，我们将创建一个简单的手折叠面板（accordion）插件。让我们创建一个 js\
    \ 文件并将其放在网站的 \"js\" 目录下。按照传统，所有的 js 插件文件都以 \"jquery.plugin\" 开头，后跟实际插件名称，所以我们将命名为\
    \ \"jquery-simple-accordion.js\"。\n\n- 我们网站目录下 js 目录下的插件文件\n\n现在我们需要将插件文件与 jQuery\
    \ 库一起引入我们的主 HTML 页面 (index.html)。最佳实践直接从 Google api 服务器引入 jQuery 库，因为它们遍布全球，而不是你的单一服务器位置：更近的服务器通常意味着访问者的响应速度更快。从\
    \ Google 引入 jQuery 的另一个优势是，当访问访问你的网站时，他们的本地缓存中可能已经有了 jQuery 脚本。预缓存内容通常意味着访问者的加载速度更快。\n\
    \n# jQuery 插件结构\n\njQuery 包含了所有必要的钩子，以帮助你开发插件。但保持 JavaScript 的良好实践是好事，因此我们必须确保一切都保持在本地作用域内。让我们从\
    \ jQuery 插件的基础外壳开始：\n\n```\nfunction($) {\n\n$.fn.simpleAccordion = function()\
    \ {\n\n//TODO: simple折叠面板插件代码\n\n}(jQuery));\n```\n\n让我们快速过一遍这里发生了什么。通过将所有内容包含在\
    \ (function() {}) 自闭的 JavaScript 模式中，我们确保插件中的变量将安全地留在全局命名空间之外。我们不会与此页面运行的任何其他\
    \ JavaScript 发生冲突，所以我们必须像上面那样隔离代码。\n\n你可能注意到的另一个点是，我们定义插件的方式就像 jQuery 处于“无冲突”（no-conflict）模式。同样，我们寻求避免与页面上的其他\
    \ JavaScript 冲突，因此我们想确保我们的插件不依赖于它。\n\n最后，$.fn 是 jQuery 允许你定义插件的方法，我们将其命名为 simpleAccordion。所有组件就绪后，让我们开始制作吧！\n\
    \n# 为我们的插件添加功能\n\njQuery 的伟大之处在于它允许你使用任何需要的选择器。然而，你必须记住，我们的插件可能会处理多种元素类型。使用 \"\
    this\" 关键字让我们的插件通过循环访问每个元素来应用关联函数。\n\n获取 HTML 部分 - 构建折叠面板\n\n由于我们正在构建一个折叠面板，我们需要为它准备结构，现在开始：\n\
    \n## Cras dolor elit, porttitor ac diam bibendum, eleifend ali qam erat.\n\n##\
    \ Donecc blandit nec est tristi interdum.\n\n## Fusce sit amet arcu id malesuada\
    \ faucibus.\n\n## Ali qam tincidunt lobortis sem porttitor.\n\n这是一个简单的折叠面板结构，定义了四个标题及其各自的内容区域。所以，想法是我们的插件将这段\
    \ HTML 代码转换为一个功能性的折叠面板，用户可以打开和折叠部分。\n\n它看起来应该是这样的：\n\n为了让它看起来美观，我们应该添加一些简单的样式。现在开始：\n\
    \n```\n.accordion {\n\nwidth: 600px;\n\nborder: 1px solid #ccc;\n\nborder-bottom:\
    \ none;\n}\n\n.accordion dt,.accordion dd {\n\nborder-bottom: 1px solid #ccc;\n\
    }\n\n```\n\n```css\nmargin: 0px;\n}\n\n.accordion dt {\n  background: rgba(193,\
