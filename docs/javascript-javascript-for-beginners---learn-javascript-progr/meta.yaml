    \nConclusion\n\n# Introduction to JavaScript\n\nJavaScript is an interpreted programming\
    \ language, built on the ECMAScript standard. The language definition is really\
    \ broad since it can be defined as a procedural language based on prototypes,\
    \ imperative, weakly typed, and dynamic.\n\nJavaScript is mainly used as a client\
    \ side programming language implemented as part of a web browser to allow developers\
    \ an improved way to implement user interface and dynamic features in web pages,\
    \ although there are implementations of JavaScript on the server side (SSJS) the\
    \ popularity of the language is due to the client side implementations alone.\
    \ JavaScript can also be found outside web applications, for example as a way\
    \ to add interactivity to PDF documents and desktop widgets.\n\nJavaScript was\
    \ designed with a similar syntax as C, although it takes names and conventions\
    \ from the Java programming language. However, despite the name Java and JavaScript\
    \ are not related and have different semantics and purposes.\n\nJavaScript was\
    \ originally developed by Brendan Eich of Netscape under the name Mocha, which\
    \ was later renamed to LiveScript, to finally called JavaScript. The name change\
    \ coincided approximately with the moment in which Netscape added support for\
    \ Java technology in its web browser Netscape Navigator version 2.0B3 in late\
    \ 1995. The name JavaScript was confusion, giving the impression that the language\
    \ is an extension of Java, and it has been characterized by many as a marketing\
    \ strategy for Netscape to gain prestige and innovate in what were the new web\
    \ programming languages.\n\nThe following year Microsoft implemented a similar\
    \ client side programming languages as part of its Internet Explorer 3.0 web browser.\
    \ Microsoft called its client side language \"jscript\", to avoid problems related\
    \ to the brand. The Jscript term seems so similar that the both \"javascript\"\
    \ and \"jscript\" are often used interchangeably, but the specification of JScript\
    \ is not 100% compatible with the ECMA specifications.\n\nTo avoid these incompatibilities,\
    \ the World Wide Web Consortium (W3C) designed the standard Document Object Model\
    \ (DOM, or document object model), which was incorporated in the version 6 of\
    \ Internet Explorer and Netscape Navigator, Opera version 7, Mozilla Firefox since\
    \ its first release, and all modern thereafter.\n\nIn 1997 there was a proposal\
    \ to submit JavaScript to the standard of the European Computer Manufacturers'\
    \ Association ECMA, which despite its name is not European but international,\
    \ based in Geneva. In June 1997, it was adopted as an ECMA standard under the\
    \ name of ECMAScript. JavaScript also became an ISO standard.\n\nBecause of its\
    \ standardization and the great adoption of the internet, JavaScript has become\
    \ the most used programming language in the planet.\n\nNote: JavaScript is a registered\
    \ trademark of Oracle Corporation. It is used under license by the products created\
    \ by Netscape Communications and current entities such as the Mozilla Foundation.\n\
    \n# Uses of JavaScript\n\nJavaScript is present in most web pages today. Chances\
    \ are that the page you are looking at right now contains the code for JavaScript.\
    \ Try this activity: Right-click on a web page, then click 'View Source'. You\
    \ should be able to find the word JavaScript somewhere in the code of the page.\n\
    \nWhile HTML markup language allows web developers to format content, JavaScript\
    \ allows them to make the page dynamic. For example, HTML allows for making text\
    \ bold, creating text boxes, and creating buttons, whereas JavaScript allows for\
    \ changing text on the page, creating pop-up messages, and validating text in\
    \ text boxes to make sure required fields have been filled. JavaScript makes web\
    \ pages more dynamic by allowing users to interact with web pages, click on elements,\
    \ and change the pages.\n\n# What JavaScript can do for you\n\nLet's take a step\
    \ back and count the merits of JavaScript:\n\n- JavaScript is very easy to implement.\
    \ All you need to do is put your code in the HTML document and tell the browser\
    \ that it is JavaScript.\n- JavaScript works on web users’ computers - even when\
    \ they are offline!\n- JavaScript allows you to create highly responsive interfaces\
    \ that improve your user experience and provide dynamic functionality, without\
    \ having to wait for the server to react and show another page.\n- JavaScript\
    \ can load content into the document if and when the user needs it, without reloading\
    \ the entire page — this is commonly referred to as Ajax.\n- JavaScript can test\
    \ for what is possible in your browser and react accordingly — this is called\
    \ Principles of unobtrusive JavaScript or sometimes defensive Scripting.\n- JavaScript\
    \ can help fix browser problems or patch holes in browser support — for example\
    \ fixing CSS layout issues in certain browsers.\n\nThat is a lot for a language\
    \ that until recently was laughed at by programmers ‘higher programming languages’.\
    \ One part of the renaissance of JavaScript is that we are building more and more\
    \ complex web applications these days, and high interactivity requires Flash (or\
    \ other plugins) or scripting. JavaScript is arguably the best way to go, as it\
    \ is a web standard, or is supported natively across browsers (more or less —\
    \ some things differ across browsers, and these differences are discussed in appropriate\
    \ places in the articles that follow this one), and it is compatible with other\
    \ open web standards.\n\n# Common uses of JavaScript\n\nThe usage of JavaScript\
    \ has changed over the years we've been using it. At first, JavaScript interaction\
    \ with the site was mostly limited to interacting forms, giving feedback to the\
    \ user and detecting when they do certain things. We used alert() to notify the\
    \ user of something (see Figure 1), confirm() to ask if something is OK to do\
    \ or not and either prompt() or a form field to get user input.\n\n![](img/1e18b19faf30def5147209a8ed4cbe90_10_0.png)\n\
    \nFigure 1: Telling the end user about errors using an alert() statement was all\
    \ we could do in the early days of JavaScript. Neither pretty nor subtle.\n\n\
    This lead mostly to validation scripts that stopped the user to send a form to\
    \ the server when there was a mistake, and simple converters and calculators.\
    \ In addition, we also managed to build highly useless things like prompts asking\
    \ the user for their name to print it out immediately afterwards.\n\nAnother thing\
    \ we used was document.write() to add content to the document. We also worked\
    \ with popup windows and frames and lost many a nerve and pulled out fair hair\
    \ trying to make them talk to each other. Thinking about most of these technologies\
    \ should make any developer forward and backward and curl up into a fetal position\
    \ stammering “make them go away”, so let’s not dwell on these things — there are\
    \ better ways to use JavaScript!\n"
  mdcn: "\n\n# JAVASCRIPT\n轻松学习 JAVASCRIPT\n\n![](img/1e18b19faf30def5147209a8ed4cbe90_0_0.png)\n\
    \n从初学者到专家\n耗时不到一周\n\nSTEPHEN BLUMENTHAL\n\n# JavaScript\n\n作者：\n\nStephen Blumenthal\n\
    \n# 版权声明\n\n本电子书版权所有 © 2017 ‘Stephen Blumenthal’，保留所有权利。全部或部分复制、分发本电子书或创建衍生作品都是非法的。在没有作者明确书面、注明日期并签名的许可的情况下，不得以任何形式（电子或机械，包括光复复制、录制或通过任何信息存储或检索系统）复制或传输本报告的任何部分。\n\
    \n# 目录\n\n- JavaScript 简介\n- JavaScript 的用途\n    - JavaScript 能为你做什么\n    - JavaScript\
    \ 的常见用途\n    - 接触 DOM 脚本\n    - JavaScript 的其他现代用途\n    - 明智且负责任地使用 JavaScript\n\
    - 开始学习 JavaScript\n    - 入门：设置你的代码。\n- JavaScript 和 HTML\n    - HTML 基础\n    -\
    \ 你知道 HTML 是什么吗？\n- 为什么如果你正在构建网站，你应该了解 HTML 代码！\n- 学习 jQuery\n    - 为什么要创建一个 jQuery\
    \ 插件\n    - 设置\n    - jQuery 插件结构\n    - 为我们的插件添加功能\n- JavaScript 和 CSS\n    -\
    \ 使用 JavaScript 获取伪元素属性\n    - classList API\n    - 直接向样式表添加和删除规则\n    - 使用加载器加载\
    \ CSS 文件\n- CSS 基础\n    - CSS pointer-events\n\n加载旋转器\n\n文本截断\n\n上推动画\n\n自定义\n\
    \n命令行值速览\n\n每个设计师都应该知道的 20 个必备 CSS 技巧\n\n运行 JavaScript 函数的不同方法\n\n学习 CSS 语法和正确应用\n\
    \n- CSS 语法由三个元素组成。\n- 内联样式\n- 外部样式\n- 为什么大小写敏感在 JavaScript 中如此重要？\n- 理解注释\n\n\
    可信誉循环\n\nJavaScript 和 Ajax\n\nCSS - 基础\n\n- 什么是 CSS？\n- 你可以用 CSS 做什么\n- 如何让搜索引擎看到你的文案\n\
    - CSS 语法\n- CSS 的放置\n- 注意垃圾邮件\n\n结论\n\n# JavaScript 简介\n\nJavaScript 是一种解释型编程语言，基于\
    \ ECMAScript 标准构建。该语言的定义非常广泛，因为它可以被定义为基于原型的、命令式的、弱类型的和动态的语言。\n\nJavaScript 主要作为客户端编程语言使用，作为\
    \ 浏览器的一部分实现，允许开发者以更改进的方式实现网页中的用户界面和动态功能；尽管也存在服务器端的 JavaScript 实现（SSJS），但该语言的流行完全归功于客户端的实现。JavaScript\
    \ 也可以用于 Web 之外，例如为 PDF 文档和桌面小组件添加交互功能。\n\nJavaScript 的语法与 C 语言相似，尽管它借鉴了 Java 编程语言的名称和约定。然而，尽管名字相似，但\
    \ Java 和 JavaScript 之间并没有关系，并且具有不同的语义和目的。\n\nJavaScript 最初由 Netscape 的 Brendan\
    \ Eich 以 Mocha 的命名开发，后来被重命名为 LiveScript，最后称为 JavaScript。名称的更改恰好赶上 1995 年底 Netscape\
    \ 在其网页浏览器 Netscape Navigator 2.0B3 版本中增加对 Java 技术支持的时刻。JavaScript 这一名称引起了误解，给人一种该语言是\
    \ Java 扩展的印象，许多人将其描述为 Netscape 为了获得声誉并在新的 Web 编程语言中进行创新而采取的营销策略。\n\n第二年，微软在其 Internet\
    \ Explorer 3.0 浏览器中实现了类似的客户端编程语言。微软将其客户端语言称为“jscript”，以避免与品牌相关的问题。Jscript 这个词看起来非常相似，以至于\
    \ \"javascript\" 和 \"jscript\" 经常被通用，但 JScript 的规范并非 100% 兼容 ECMA 规范。\n\n为了避免这些不兼容性，世界网联盟（W3C）设计了标准的文档对象模型（DOM，或\
    \ document object model），它被包含在 Internet Explorer 6 版、Netscape Navigator、Opera\
    \ 7 版、Mozilla Firefox 自首次发布起及之后的所有现代版本中。\n\n1997 年，有一项建议将 JavaScript 提交给欧洲计算机制造商协会\
    \ ECMA 的标准，尽管其名为欧洲，但它并不是欧洲的，而是国际性的，总部位于日内瓦。1997 年 6 月，它以 ECMAScript 的名称被采用 ECMA\
    \ 标准。JavaScript 也成为了 ISO 标准。\n\n由于其标准化和互联网的广泛采用，JavaScript 已成为地球上最常用的编程语言。\n\n\
    注意：JavaScript 是 Oracle 公司的注册商标。由 Netscape Communications 创建的产品以及当前的实体（如 Mozilla\
    \ 基金会）获得许可使用。\n\n# JavaScript 的用途\n\n今天的大多数网页中都存在 JavaScript。很有可能你现在正在查看的页面包含了\
    \ JavaScript 代码。尝试一下这个活动：在网页上点击右键，然后点击“查看源代码”。你应该能在页面代码的某处找到“JavaScript”这个词。\n\
    \n虽然 HTML 标记语言允许 Web 开发人员格式化内容，但 JavaScript 允许他们让页面动态化。例如，HTML 允许将文本加粗、创建文本框和创建按钮，而\
    \ JavaScript 允许更改页面上的文本、创建弹出窗口消息，并对文本框中的文本进行验证，以确保必填字段已填写。JavaScript 通过允许用户与网页进行交互、点击元素并更改页面，使\
    \ Web 页面变得更加动态。\n\n# JavaScript 能为你做什么\n\n让我们退一步，数一数 JavaScript 的优点：\n\n- JavaScript\
    \ 非常容易实现。你只需要将代码放在 HTML 文档中并告诉浏览器它是 JavaScript 即可。\n- JavaScript 在用户的计算机上运行——即使在他们离线时也是如此！\n\
    - JavaScript 允许你创建高度响应的界面，提高用户体验并提供动态功能，而无需等待服务器响应并显示另一个页面。\n- JavaScript 可以在用户需要将内容加载到文档中，而无需重新加载整个页面——这通常被称为\
    \ Ajax。\n- JavaScript 可以测试浏览器中可能的功能并做出相应反应——这被称为非侵入性 JavaScript 原则，有时被称为防御性脚本。\n\
    - JavaScript 可以帮助修复浏览器问题或修补浏览器支持的漏洞——例如修复某些浏览器中的 CSS 布局问题。\n\n对于一种直到最近还被“高级编程语言”程序员所嘲笑的语言来说，这已经非常多了。JavaScript\
    \ 复兴的一个原因是，我们现在正在构建越来越复杂的 Web 应用程序，而高交互性需要 Flash（或其他插件）或脚本。JavaScript 无疑是最佳选择，因为它是\
    \ Web 标准，或者被跨浏览器原生支持（在某种程度上——某些东西在浏览器之间有所不同，这些差异将在后续文章的相关位置讨论），并且与其他开放的 Web 标准兼容。\n\
    \n"
