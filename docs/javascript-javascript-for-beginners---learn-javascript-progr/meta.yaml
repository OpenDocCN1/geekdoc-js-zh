    好了，我们现在准备好开始真正的编程了！


    JavaScript 与许多编程语言一样，依赖于对象、函数和事件处理器来创建可运行程序。如果你对这些术语以及如何使用它们一无所知，不要担心。在我们完成本教程时，你将掌握它们。


    ## JavaScript 与 HTML


    你可以将 JavaScript 视为 HTML 的扩展；即一个插件。以下是它的工作原理：HTML 标签创建对象；JavaScript 允许你操作这些对象。例如，为了像表
    1 所示创建一个网页，在创建文档之后，你可以使用 JavaScript 与其进行交互。例如，你可以使用一个名为 `onload` 句器的特殊结构来触发动作——也许当文档加载到浏览器中时。你通过
    JavaScript 交互的其他 HTML 对象还包括窗口、文本字段、图像和应用程序。


    表 1：创建和操作对象


    | 对象 | HTML 标签 | JavaScript |

    | :--- | :--- | :--- |

    | 网页 | `<body>...</body>` | document |

    | 图像 | `<img name="myimage">` | document.myimage |

    | HTML 表单 | `<form name="myForm">...</form>` | document.myForm |

    | 按钮 | `<input type=''button'' name="myButton">` | document.myButton |


    要在网页中添加 JavaScript，你需要做的只是将 JavaScript 代码嵌入到 HTML 文件中。在你嵌入代码的行下方，你可以响应事件处理器的要求引用或调用该
    JavaScript 代码。在向 HTML 文件中嵌入 JavaScript 代码时，你有两个选择：


    你可以使用 `<script>` 标签将 JavaScript 代码直接包含在 HTML 文件中。在下面的示例中，一个名为 `myFunction` 的 JavaScript
    函数定义在 HTML 文件的顶部。在 HTML 文件的下方，该函数与一个事件处理器关联——具体是 `onclick` 事件。（换句话说，当用户点击按钮时，`myFunction`
    函数中包含的 JavaScript 代码就会运行。）


    ```html

    <html>

    <head>

    <script language="JavaScript">

    // JavaScript 语句放在这里

    function myFunction() {

    // 更多 JavaScript 语句放在这里

    }

    </script>

    </head>

    <body>

    <form name="myForm">

    <input type="button" name="myButton" value="Click to order" onclick="myFunction();">

    </form>

    </body>

    </html>

    ```


    你可以使用 `<script>` 标签将一个独立的外部 JavaScript 文件（仅包含 .js 扩展名的 JavaScript 语句的文件）包含到 HTML
    文件中。在示例中，JavaScript 函数定义在 `myfile.js` 中。当用户点击链接时，该函数会被触发或调用。


    ```html

    <html>

    <head>

    <script language="JavaScript" src="myfile.js"></script>

    </head>

    <body>

    <a href="javascript:myFunction();">点击这里</a>

    </body>

    </html>

    ```


    因为网页不仅仅由 HTML 组成，所以 JavaScript 提供的不仅仅是 HTML 对象。JavaScript 还提供了对浏览器特定对象的访问。浏览器插件（如
    RealPlayer 和 Adobe Acrobat）、特定查看器的名称和版本以及当前日期，都是你可以使用 JavaScript 处理的非 HTML 对象示例。


    构成网站的所有对象——HTML 对象、浏览器相关对象以及内置在语言中的特殊对象——统称为文档对象模型 (DOM)。


    ## HTML 基础


    如果你对 HTML 一无所知，你绝对应该从基础开始，并在网上进行彻底的阅读。一旦你掌握了基础，其余部分应该非常简单。然而，像每个学科一样，HTML 基础必须细心学习。你不能跳过任何步骤。建议一次只关注
    HTML 基础的一个方面，只有在理解了较简单内容后，再进入高级阶段。再给一个建议——不要气馁，因为 HTML 基础看起来可能需要很长时间才能学习；这一切都是值得的。


    首先，你必须知道 HTML 是什么以及为什么要用它。嗯，HTML 代表 HyperText Markup Language（超文本标记语言），它是一种脚本语言。简单来说，HTML
    是一个纯文本文件，除了标记标签外什么都没有。当浏览器收到打开网页的指令时，它会查找页面中的 HTML 代码。然后浏览器会将这些代码转换为布局、图像和指向其他网站的链接。你必须记住的其他基础之一是，HTML
    文件是文本文件，因此可以使用最简单的文本编辑器编写。一些流行的文本编辑器，如 FrontPage 和 Dreamweaver 将允许你使用 Word 创建页面。现在，这有多容易呢？


    为了让事情变得更简单，这里有一些你无疑非常有吸引力的更多 HTML 基础。一旦你通过一个简单的文本编辑器完成了页面布局，你可以让专业的编辑器来完成 HTML
    部分。这会花费你很少的费用。此外，如果你仍在自己进行 HTML 编码，还有其他有用资源可以参考。例如，如果你觉得某个效果很酷，你甚至可以从其他页面借鉴代码。你只需要编写代码、保存它，并给文件加上
    .html 扩展名。


    在 HTML 基础方面，你必须知道的另一个重要点是标签。标签告诉浏览器如何解码文本。然后你当然必须关注页面结构。页面结构由头部 `<head>`（不可见的文本和标签）和主体
    `<body>`（可见的）组成。你必须对每个部分以及高级结构进行深入研究。一旦你掌握了窍门，一切都应该是有趣且简单的，并且你会喜欢最终的结果。


