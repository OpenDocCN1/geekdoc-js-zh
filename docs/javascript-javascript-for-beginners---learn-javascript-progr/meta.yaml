    \nQuickly let's go over what this code is doing. First, you need to understand\
    \ that jQuery is a library that extends the JavaScript language. When creating\
    \ any jQuery plug-in, you're essentially extending how your plug-in extends the\
    \ jQuery library, which is extending JavaScript. Truly understanding how your\
    \ plug-in extends the jQuery library requires an understanding of the JavaScript\
    \ prototype property. Although it is not used directly, the JavaScript prototype\
    \ property is used behind the scenes through the jQuery property fn, which is\
    \ a jQuery alias for the native JavaScript prototype property.\n\nSo in simpler\
    \ terms, you extend your plugin from jQuery by using fn.\"your-plugin-name\"\n\
    \nIn addition, we could add options to pass to our plugin. A jQuery plug-in can\
    \ include defaults and options. Options are arguments that you could pass to your\
    \ plug-in. Rather than sending several arguments, with an options object you can\
    \ send multiple properties, which is the standard jQuery practice. When allowing\
    \ options in your plug-in, it is a best practice to set default options using\
    \ the defaults object. Like options, defaults are an object literal that should\
    \ include the properties you are allowing to be passed to your plugin.\n\nLet's\
    \ quickly add options to our plugin to show how simple this is. We are going to\
    \ pass an option parameter to open the first section of our accordion when it\
    \ is first loaded.\n\n```javascript\n(function($) {\n  $fn.simpleAccordion = function(options)\
    \ {\n    var state = $.extend({}, {open: false}, options);\n\n    return this.each(function()\
    \ {\n      var dts = $(this).children('dt');\n\n      dts.click(accordionClick);\n\
    \n      dts.each(reset);\n\n      if(state.open)\n        $(this).children('dt:first-child').next().show();\n\
    \    });\n\n    function accordionClick() {\n      $(this).siblings('dt').each(hide);\n\
    \      $(this).next().slideDown('fast');\n\n      return false;\n    }\n\n   \
    \ function hide() {\n      $(this).next().slideUp('fast');\n    }\n\n    function\
    \ reset() {\n      $(this).next().hide();\n    }\n  });\n})(jQuery);\n```\n\n\
    If you notice, we are using default value of `open:false`, so if no option is\
    \ passed, the plugin will assume that you want your accordion closed when first\
    \ loaded. When the plug-in receives options, you can rely on the $.extend method\
    \ to do the actual overriding. What the $.extend method does is that it merges\
    \ two or more objects.\n\n## Javascript and CSS\n\nCSS and JavaScript: the lines\
    \ seemingly get blurred by each browser release. They have always done a very\
    \ different job but in the end they are both front-end technologies so they need\
    \ to work closely. We have our .js files and our .css, but that doesn't mean CSS\
    \ and JS can interact more closely than the basic JavaScript frameworks will allow.\
    \ Here are five ways that JavaScript and CSS work together that you may not know\
    \ about!\n\n## Get Pseudo-Element Properties with JavaScript\n\nWe know that we\
    \ can get basic CSS style values for an element with the style property, but what\
    \ about pseudo-element properties? Yes, JavaScript can even access those too!\n\
    \n```javascript\n// Get the color value of .element:before\nvar color = window.getComputedStyle(\n\
    \  document.querySelector('.element'), ':before'\n).getPropertyValue('color');\n\
    \n// Get the content value of .element:before\nvar content = window.getComputedStyle(\n\
    \  document.querySelector('.element'), ':before'\n).getPropertyValue('content');\n\
    ```\n\n## classList API\n\nWe've used all the addClass, removeClass, and toggleClass\
    \ methods in our favorite JavaScript libraries. For the sake of supporting older\
    \ browsers, each library would grab the element's className (in its string format)\
    \ and appending/removing the class, then updates the className string. There's\
    \ a newer-er API for adding, removing, and toggling classes, and it's called classList:\n\
    \n```javascript\nmyDiv.classList.add('myCssClass'); // Adds a class\n\nmyDiv.classList.remove('myCssClass');\
    \ // Removes a class\n\nmyDiv.classList.toggle('myCssClass'); // Toggles a class\n\
    ```\n\nclassList has been implemented for a long time in most browsers, but this\
    \ API hit IE at version 10.\n\n## Add and Remove Rules Directly to Stylesheets\n\
    \nWe're all well versed in modifying styles via the element.style.propertyName\
    \ method, and we've used JavaScript toolkits to do it, but did you know you can\
    \ actually read and write rules within new and existing stylesheets? The API is\
    \ actually quite simple too!\n\n```javascript\nfunction addCSSRule(selector, rules,\
    \ index) {\n  if(sheet.insertRule) {\n    sheet.insertRule(selector + \"{\" +\
    \ rules + \"}\", index);\n  }\n  else {\n    sheet.addRule(selector, rules, index);\n\
    \  }\n}\n\n// Use it!\naddCSSRule(document.styleSheets[0], \"header\", \"float:\
    \ left\");\n```\n\nThe most common use case is creating a new stylesheet, but\
    \ if you want to modify an existing stylesheet, go for it.\n\n## Load CSS Files\
    \ with a Loader\n\nLazy-loading resources like images, JSON, and scripts is a\
    \ great way to decrease load time. We can load those external resources with JavaScript\
    \ loaders like curl.js, but did you know you can lazy load stylesheets and get\
    \ that notification within the same callback?\n\n```javascript\ncurl(\n  [\n \
    \   \"namespace/MyWidget\",\n    \"css!namespace/resources/MyWidget.css\"\n  ],\n\
    \  function(MyWidget) {\n    // Do something with MyWidget\n    // The CSS reference\
    \ isn't in the signature because we don't care about it;\n    // we just care\
    \ that it is now in the page\n  }\n);\n```\n\n## Essentials of CSS\n\n## CSS pointer-events\n\
    \nCSS' pointer-events property is interesting in that it almost acts in a JavaScript-like\
    \ way, effectively disabling an element when the value is none but otherwise allowing\
    \ the element to function per usual when the value isn't none. You may be saying\
    \ \"so what?!\" but pointer-events even prevent JavaScript events from firing!\n\
    \n```css\n.disabled { pointer-events: none; }\n```\n\n## Usage\n\nPackage is available\
    \ through bower\n\n```bash\nbower install css-ess\n```\n\nusage\n\n```html\n<link\
    \ rel=\"stylesheet\" href=\"bower_components/css-essentials/dist/css-essentials-min.css\"\
    >\n```\n\nor through npm\n\n```bash\nnpm install css-essentials\n```\n\n## Basic\n\
    \nWe have determination that we need more than 3-4 breakpoints to really adjust\
    \ the design to all screen. So we have defined:\n\n```css\n@of-xsm: 460px;\n@of-sm:\
    \ 606px;\n@of-md: 800px;\n@of-lg: 1164px;\n@of-xlg: 1440px;\n@of-xxlg: 1740px;\n\
    ```\n\n## Browser support\n\nWe tend to support at least n-1, where n is the current\
    \ version of any browser.\n\n## Grid\n\n24 columns based grid, is created using\
    \ flex.\n\nQuick start:\n\n```html\n<div class=\"of-row\">\n  <div class=\"xxsm-col-24\
    \ xsm-col-18 sm-col-12 md-col-6 lg-col-4 xlg-col-2 xxlg-col-1\">\n    Some content\n\
    \  </div>\n</div>\n```\n\n(Wait, continuing...)\n\n## Loading spinner\n\nLoading\
    \ spinner can be used to indicate loading.\n\nQuick start:\n\n```html\n<div class=\"\
    of-row\">\n  <div class=\"xxsm-col-24\">\n    <div id=\"loading-bar-spinner\"\
    >\n      <div class=\"spinner-icon\">\n      </div>\n    </div>\n  </div>\n</div>\n\
    ```\n\n## Truncate text\n\nTruncate text is useful, when you want to display text\
    \ in one line and truncate it, if it exceeds the width of a line.\n\nQuick start:\n\
    \n```html\n<div class=\"of-row\">\n  <div class=\"xxsm-col-12\">\n    <div class=\"\
    truncate-text\">\n      Lorem ipsum dolor sit amet, consectetur adipiscing elit.\
