    We would like to challenge the GNP question; how many starving people, which amount
    of animal species under threat of extermination and how much rain forest could
    be saved with just a fragment of this money? An interesting and very important
    discussion, but in this issue we have decided to concentrate on the business part
    of the situation. We have an alternative to today''s advertising-landscape as
    we think it''s more appropriate to create trustworthy communication and brands
    by development of new products and services. It''s all about creativity, innovation
    and design. We call it The Credibility Loop.


    ## Before the line


    You need an arsenal of hygiene factors to be on the market nowadays. All competitors
    have good quality, good service, good distribution, good personnel, good price,
    good communication and good whatsoever... At Sony there is a saying that all products
    have the same function, performance, technology and price. The only thing that
    differentiates their products from their competitors is design. Why not putting
    most efforts in developing good design?


    There''s lot of talking going on inside the creative industries concerning Above
    the Line (ATL) and Below the Line (BTL) communication. In the red corner sits
    ATL, which concerns traditional advertising in magazines, radio, TV and outdoor
    prints. In the blue color we will find BTL, which concerns PR, web, DM, retail
    communication etc. If you ask us, ATL is knocked down. But we take the issue one
    step further and introduce our own BTL: Before the Line. Our BTL dances like a
    butterfly and stings like a bee...


    ## Faster horses


    Up to today the marketing people have been in charge for entering new products
    to the market, and this (only) because their job is to know what people like and
    want. But do they really know what people need? It''s more interesting to see
    what people are doing instead of listening what they are saying. Look at your
    children; they do like you, do not like you you tell them to do. And Henry Ford
    would probably got the answer "faster horses" instead of "a vehicle with four
    wheels" on a direct question about peoples'' needs.


    We think the marketing people quite often have the same narrow-minded thinking.
    A lot of them don''t see beyond existing categories and often goes for what''s
    already available and possible.


    So, let a creative design culture sweep through the organisation and combine the
    innovative minds from the R&D department with the outgoing ditto from the marketing
    department. It is only by combining different skills and mindsets you can create
    real innovations give you the possibility to change the future.


    As you can''t the advertising battle - go for a ride with the Credibility Loop!


    Let the products talk themselves. Give them a raison d''être, personality and
    a soul! It''s probably the best way to differentiate a product offer. And out
    of a strictly financial point of view: what are the reasons not produce products
    that communicate efficient itself?


    Why not transfer money and efforts from the end (advertising) to the start (R&D)
    of a product life cycle? By doing this companies can be much more innovative and
    it will give them the possibility to build-in communicative qualities into the
    products from the start. And by giving products and services a better meaning,
    the chance is much greater that the target group will source them voluntarily.


    A good example: When iPod was introduced year 2001 Apple spent 24,5 million dollars
    to launch the product. A huge amount of money, but still probably just a tenth
    of how much the cost would have been to reach the same global success with a less
    attractive product. Good design and word-of-mouth most of the job.


    Design = Economy as the great Swedish graphic designer Ole Eksksell described
    it already back in 1964. Finally: It''s all about taking charge of the situation.


    ## A design strategy has its tentacles everywhere


    We are certain that companies will build a much more credible brand with good
    design and innovation strategies instead of only wrapping up the products with
    ads in the end. The advertising money is much better used for innovations that
    make a difference and benefit both business and society. Who doesn''t want to
    make peoples life better, more equal and happier by developing more attractive
    and sustainable products or services?


    Some may argue that everything will be copied: product or service. Course it will,
    if it''s successful enough. When everybody has the same technology copies will
    always exist. So you have to differentiate and be unique, you need to be smarter
    and pro-active. A good way forward is to less technocratic and more pro-cultural,
    because the cultural values of a corporation are the most difficult blueprint
    by the copycats. By having an integrated design strategy within the corporate
    strategy (together with marketing, HR, R&D, finance etc.) you will come very far.


    We are all familiar with the discussion from the eighties and forward about brands:
    "Our brand is our most valuable asset". Today it''s common talks, and a hygiene
    factor. Nowadays the design strategy is the "new" brand strategy.


    Successful companies with a clear design strategy like Apple have understood that
    the design issues must be discussed and decided at the highest management levels.


    A design strategy should have its tentacles everywhere in a corporate strategy,
    that''s why it''s necessary and an unbeatable competitive advantage. It''s beyond
    corporate identity and graphic design: it''s about everything that happens in
    your company. How does your customer service respond, do you have fresh flowers
    and fruit in your office, what kind of music is played in the reception, is your
    logistics fully optimised, how is your product or service packed and how do you
    expose it? Everything counts, nothing is unimportant, you have to have holistic
    view and manage the process - the design process. It''s your most important process,
    because design helps you to succeed with your communication. And with good communication
    you will reach out and become a happy and hopefully positive part of your costumers''
    minds.


    To summarise the everlasting brand discussion: A brand and its value is the outcome
    of a design process.


    ## Our windup


    Today we all know that we have to develop, innovate and find new ways to survive
    - either it''s business, personal or environmental concerns. At David Report we
    take our responsibility and focus on a business dilemma - why advertise when you
    can do something more powerful and actually both build your brand and sell more
    products/services by innovative R&D?


    As you read above we argue for a shift from advertising into a design focused
    R&D. According to us this is the only way forward into tomorrow''s society and
    business life. Design is also the best way to visualising your brand and your
    business strategy.


    Be smart, question the advertising standard and go for a ride in our credibility
    loop, or in other words: build your brand through a smart design strategy.


    ## Arrays in C# .Net


    What is an array?


    In simplest terms, an array is an organized collection. It can be a collection
    of anything. The important thing to remember is that it is a collection.


    We use arrays every day


    A pack of M&Ms is a great example of an array. It''s easy for us to imagine a
    bag of this candy. We can imagine each one of the MMs as they are taken from the
    bag. They are all basically the same but different colors. Even though they are
    different colors, they are all chocolate candy with a hard candy


    A bag of M&''s is an array of datatype M&''s. It is a collection of candy.


    How do I declare an array?


    Declaring an array is very much like declaring other variables. The only difference
    is that you are declaring a variable that will hold more than one. Let''s compare
    these two declarations.


    ```

    String strEmotion = "happy";

    ```


    ```

    String[]strEmotions = {"happy","sad","elated","afraid","angry","peaceful"};

    ```


    Both of the variables above, strEmotion and strEmotions, have been declared using
    Explicit Declaration which means the value is set at the same time they are created.
    By using the brackets [] , the compiler knows that the variable strEmotions hold
    more than one value.


    The number of items and the values is set with = {"happy","sad","elated","afraid","angry","peaceful"};


    In this case, we have set the size of the array to 6 because we have added 6 values.


    How do I get a specific value?


    Getting the value of each item isn''t hard once you understand how the array refers
    to each item. At first it might be a little confusing because arrays use a zero
    based reference. This means that the first item in the list is in the 0 position.

