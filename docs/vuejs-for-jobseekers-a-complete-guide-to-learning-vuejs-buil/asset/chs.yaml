  \n![](img/fm1.png)\n\n# 第 12 章：构建表单和处理用户输入\n\n## 引言\n\n到为止，我们已经涵盖了组件的设计与构建、页面链接以及事件处理。我们缺失的部分是从用户那里收集数据。这些数据可以以许多形式存在，但它们都需要以某种方式进行管理。\n\
  \n这是关于核心功能的最后一章；从下一章开始，我们将查看 Vue.js 生态系统中更广泛的工具，以便更容易构建应用程序。\n\n## 结构\n\n本章将涵盖以下主题：\n\
  \n- 值绑定与 `v-model`\n- 创建表单和使用表单组件\n- `v-model` 修饰符\n- 处理表单数据和数据验证\n- 在组件中使用 `v-model`\n\
  \n## 目标\n\n在本章中，我们将在组件级别探索处理用户数据；这意味着收集、验证，并在必要时将其传递给应用程序的其他部分。一旦我们理解了 Vue.js 如何看待数据，就可以开始使用\
  \ HTML 提供的并由 Vue 增强的各种表单控件来构建动态表单并让我们的用户满意。\n\n本章的一部分将是使用我们新学的工具增强 Speedy Pizza\
  \ 原型应用程序。\n\n## 值绑定与 v-model\n\n为了让 Vue.js 理解你想使用数据，你需要绑定一个值。在 Vue 2 中，这是通过选项模型中的\
  \ `data` 选项实现的；在 Vue 3 中，它简单得多：在指定数据时只需使用 `reactive()` 或 `ref()` 函数即可。这只是你已经熟悉的简单值绑定。\n\
  \n然而，要在表单控件中使用这些数据，Vue.js 提了一个简单的辅助属性 `v-model`。\n\n当你向控件上添加 `v-model` 时，Vue.js\
  \ 会在后台设置一个 getter 和一个事件处理器；这允许它透明地处理数据变化。\n\n这个辅助属性让 Vue.js 透明地创建如下述列表所示的代码，这些代码会挂载到控件上：\n\
  \n1. // 简单的文本输入 (v-model 属性)\n2. `<input type=\"text\" v-model=\"dataValue\" />`\n\
  3. // 简单的文本输入 (没有 v-model 的绑定要求)\n4. `<input type=\"text\" :value=\"dataValue\"\
  \ @input=\"event => dataValue = event.target.value\" />`\n5. // 复选框 (v-model 属性)\n\
  6. `<input type=\"checkbox\" v-model=\"dataValue\" />`\n7. // 复选框 (没有 v-model 的绑定要求)\n\
  8. `<input type=\"checkbox\" :checked=\"dataValue\" @change=\"event => dataValue\
  \ = event.target.value\" />`\n9. // 选择框 (v-model 属性)\n10. `<select v-model=\"dataValue\"\
  >option...</select>`\n11. // 选择框 (没有 v-model 的绑定要求)\n12. `<select :value=\"dataValue\"\
  \ @change=\"event => dataValue = event.target.value\">option...</select>`\n\n正如你可能察觉到的，使用\
  \ `v-model` 让代码变得更易读；此外，它使用正确的值和更新来为你管理组件。\n\n注意：如果你的用户群需要输入法（IME），例如中文、日语或韩语等，那么\
  \ `v-model` 将无法工作。你需要提供自己的监听器和值绑定。\n\n然而，理解 `v-model` 在后台是如何运作的，这在我们查看如何使用它创建表单组件很重要。\n\
  \n## 创建表单和使用表单组件\n\n在传统的表单中，你会有类似下面示例的 HTML：\n\n1. `<form method=\"post\" action=\"\
  serverUrl\" enctype=\"multipart/form-data\" autocomplete=\"on\">`\n2. `<input type=\"\
  hidden\" name=\"hiddenValue\" value=\"value\" />`\n3. `<fieldset>`\n4. `<legend>输入详情</legend>`\n\
  5. `<label for=\"firstname\">名字</label>`\n6. `<input type=\"text\" name=\"firstname\"\
  \ id=\"firstname\" class=\"form-control\" />`\n7. `<label for=\"lastname\">姓</label>`\n\
  8. `<input type=\"text\" name=\"lastname\" id=\"lastname\" class=\"form-control\"\
  \ />`\n9. `<input type=\"submit\" value=\"发送详情\" />`\n10. `</fieldset>`\n11. `</form>`\n\
  \n对于这样的表单，你必须进行全 HTTP 提交，或者使用 JavaScript 拦截提交，然后执行处理和/或调用远程资源，通常但但不限于 AJAX 服务。\n\
  \n通过 `v-model` 和事件系统，如果你需要从用户那里获取数据，你只需要设置所需的表单元素即可。如果不需要，你完全不需要使用 `form` 标签，尽管有时为了你采用的\
  \ CSS 框架，在语义上标记某些内容为表单是有意义的。\n\n以下代码示例涵盖了你在需要用户数据时会遇到的常见用例。\n\n第一个示例仅涉及一个收集单条数据的简单表单元素——对于这种类型，只需放置所需的表单字段并绑定所需的变量——通常是通过\
  \ `v-model` 绑定到 `ref` 或 `reactive`，正如之前讨论的那样。\n\n1. `<template>`\n```\n\n\n\n\n\
  ```html\n<!-- component content -->\n<input v-model=\"value\" />\n<!-- component\
  \ content -->\n</template>\n\n<script setup lang=\"ts\">\nimport { ref } from 'vue'\n\
  const value = ref('')\n</script>\n```\n\n这种方法也适用于多个表单字段——你已经见过它的实际应用。对于大多数数据收集场景，这足够了，但对于较大的表单，它可能会变得不实用。\n\
  \n尽管这被认为是一种糟糕的用户体验（UX），但有时（特别是在业务或企业环境中），输入或编辑大量数据可能会导致包含许多动态或移动部分的庞大表单。\n\n有几种方法可以处理这个问题：\n\
  \n*   将表单数据封装在 `reactive()` 中，而不是许多独立的 `ref()`，以此对整个表单的数据建模；这样做的好处是将所有数据聚合在一起，但会让页面模型变得非常大且可能难以管理。\n\
  *   将表单拆分为单独的组件（在同一个“页面”上），并通过 `props` 机制传递数据，并通过发射事件传回数据变化；我们将在本章稍后部分介绍如何构建此类组件。\n\
  *   设计数据和/或导航流来限制对数据和表单元素的访问。这种“向导式”类型的构建具有更好的用户体验，但初始构建工作量大得多。这样做的好处在于维护和扩展性。\n\
  \n根据企业文化，在 UI 中如何管理这些数据完全取决于你（开发者）、整个开发团队，或者业务的其他部分，例如业务分析师、UX 设计师或数据/信息设计师。\n\n\
  ### v-model 修饰符\n\n`v-model` 对象提供了三个修饰符，允许你在任何正式验证之前，在字段级别上修改 `v-model` 属性的行为。这三个修饰符分别是\
  \ `lazy`、`trim` 和 `number`。\n\n此时你可能会有一个疑问：“为什么需要修饰符呢？”修饰符本身执行基本操作，具体细节我们将在后续内容中讨论，但在通常情况下，它们让生活变得简单了一些，并增强了框架本身的声明式特性。\n\
  \n#### .number\n\n`number` 修饰符的作用是将字段中收集的数据值从字符串（所有字段的标准数据类型）强制转换为数字类型，除非给定值无法使用\
  \ `parseFloat()` 转换，在这种情况下，修饰符将原样返回字符串。如果你使用 `type=\"number\"` 的输入框，那么 Vue.js 会自动应用此修饰符。\n\
  \n下面的代码列表显示了你在模板代码中使用 `number` 修饰符的几种场景：\n\n```html\n<!-- 在文本控件上使用 number 修饰符 -->\n\
  <input type=\"text\" v-model.number=\"data\" />\n<!-- type=\"number\" 不需要 -->\n\
  <input type=\"number\" v-model=\"data\" />\n```\n\n#### .trim\n\n`trim` 修饰符是 JS\
  \ `trim` 函数的简单封装；它会自动移除 `v-model` 数据周围的任何空白字符。\n\n它的用法通常应限制在预期会有多行数据的字段中，但也可以作为通用方案添加到任何字段中。\n\
  \n下面的代码列表显示了如何将其应用于 v-model 属性：\n\n```html\n<!-- 移除文本输入中的空白 -->\n<input type=\"\
  text\" v-model.trim=\"data\" />\n<!-- 移除文本区域中的空白 -->\n<textarea v-model.trim=\"\
  data\"></textarea>\n```\n\n#### .lazy\n\n`lazy` 修饰符是目前最有趣的。通常，`v-model` 在每次输入事件时更新（除非使用了前文描述的\
  \ IME 组合输入）。如果你有一个在数据变化时需要执行的耗昂操作，你不希望它在每次按键事件时都执行。这就是 `lazy` 修饰符的用场：它只在字段变化事件时将数据同步到\
  \ `v-model`，因此这些耗昂操作被限制在字段变化时触发。\n\n与其他修饰符一样，`.lazy` 写在 `v-model` 属性之后，如下所示：\n\n\
  ```html\n<!-- 在 change 事件而非 input 事件上同步 -->\n<input type=\"number\" v-model.lazy=\"\
  data\" />\n```\n\n修饰符是可以链式调用的，因此如果有必要，你可以为表单字段的 v-model 应用多个（或所有）修饰符，如下例所示：\n\n\
  ```html\n<!-- 链式应用修饰符 -->\n<input type=\"text\" v-model.lazy.trim.number=\"data\"\
  \ />\n```\n\nVue 提供的可用 v-model 修饰符仅限于这三个。然而，框架很容易添加自定义修饰符。要做到这一点，我们需要为组件添加修饰符。为了查看这可能如何工作，假设你的项目需要如下组件：\n\
  \n```html\n<template>\n  <input v-model=\"value\" />\n</template>\n\n<script setup\
  \ lang=\"ts\">\nimport { computed } from 'vue'\nimport { formatPattern } from '@package'\n\
  \ninterface Props {\n  modelValue?: number;\n  modelModifiers?: Record<string, boolean>;\n\
  }\n\nconst props = withDefaults(defineProps<Props>(), {\n  modelValue: 0,\n  modelModifiers:\
  \ () => ({}),\n})\n\nconst emit = defineEmits(['update:modelValue'])\n\n// modelModifiers\
  \ 接收 { asPattern: true }\nconst value = computed({\n  get() {\n    if (props.modelModifiers.asPattern)\
  \ {\n      return formatPattern(props.modelValue)\n    }\n    return props.modelValue\n\
  \  },\n  set(value) {\n    value = props.modelModifiers.asPattern\n      ? formatPattern(value)\n\
  \      : value;\n    emit('update:modelValue', value)\n  },\n})\n</script>\n```\n\
  \n### 处理表单数据和验证\n\n从用户那里收集数据总是充满危险。即使在最小的用户群体中，也会有人恶意尝试通过输入错误数据来破坏系统，或者有人并不知道该做什么而误中输入了错误数据。客户端验证用于检查在\
  \ UI 中输入的数据符合预期的格式、值范围和类型，并处理当输入数据超出这些设定参数时 UI 的响应方式。\n\n\n\n\n\n# 注意：请记住，如果你负责项目/应用程序的客户端和服务器端构建，你需要在所有数据入口点构建数据验证机制，特别是当你通过\
  \ API 向服务器推送数据时。永远不要信任数据，**任何数据**，无论其来源如何。是的，这条信息正在重复。这非常重要。\n\n在验证数据时有两种方法可以采用：你可以自己实现一套，也可以使用验证库。\n\
  \n如果你正在使用框架，例如 `Quasar`（我们将在第 18 章“使用 Quasar 构建多户应用程序”中介绍它），数据验证功能可能内置在提供的组件中，或者文档可能会推荐一个验证库。与其他所有事情一样，对于什么是合适的观点会有所不同。\n\
  \n自己实现验证听起来很有趣，对你自己的学习来说可能是一个有用的练习，但在工作环境中，拥有一个一致、经过测试且易于使用的验证库是有价值的。这样，每个人都按照相同的标准进行构建，并可以轻松识别出值参数是什么以及边界情况在哪里。你处理的是外部数据；你必须基于数据可能是坏的和/或恶意的假设来工作。\n\
  \n虽然你的组织对于什么是良好的验证库可能有自己的见解，但我们将在本书中使用 `Vuelidate` ([`vuelidate-next.netlify.app`](https://vuelidate-next.netlify.app))。这是一个健壮、经过良好测试且文档齐全、易于学习、使用和扩展的库，专为在\
  \ `Vue.js` 应用程序组件架构内工作而设计。\n\n有很多其他的验证库；你的首选应该是 `VueAwesome` ([`github.com/vuejs/awesome-vue`](https://github.com/vuejs/awesome-vue))，它提供了许多库的链接。\n\
  \n验证数据的通用格式对于任何验证库都是相同的：解析表单字段中的数据并对数据运行规则以确保其符合预期模式；如果数据在可接受范围内，则继续处理；否则停止处理并向用户标记问题。对所有表单字段执行此操作。这主要是全部，但最终选择的库在实现这一过程上有很大差异。\n\
  \n## 让我们进入正题\n\n与所有的依赖一样，你需要使用 `NPM`（或 `yarn`）将库添加到你的项目中：\n\n```\nnpm install @vuelidate/core\
  \ @vuelidate/validators\n```\n\n安装完成后，我们就可以访问 `Vuelidate` 的组合式（composables）。\n\n\
  **注意：** 对于 `Vue2`，使用像 `Vuelidate` 这样的验证库你需要将库注入到全局 `Vue` 实例中，以便在整个项目中可用，否则它需要单独添加到每个需要它的组件中。添加这些内容会很快变得枯燥。\n\
  \n使用 `Vuelidate` 的推荐方式如下：\n\n```javascript\nimport { reactive } from 'vue'\nimport\
  \ { useVuelidate } from '@vuelidate/core'\n// 导入所需的验证规则\nimport { required, alphaNum,\
  \ numeric, alpha } from '@vuelidate/validators'\n\nconst state = reactive({\n  title:\
  \ '',\n  author: '',\n  price: {\n    value: 0.0,\n    currency: 'GBP'\n  }\n})\n\
  \nconst rules = {\n  title: { required, alphaNum },\n  author: { required, alpha},\n\
  \  price: {\n    value: { required, numeric, minValue: minValue(0), maxValue: maxValue(100)\
  \ },\n    currency: { alpha }\n  }\n}\n\nconst v$ = useVuelidate(rules, state)\n\
  \nasync function handleSubmit() {\n  // v$ 是一个 ComputedRef，所以使用 .value\n  const\
  \ formValid = await v$.value.validate()\n  if (!formValid) {\n    return // 表单无效，在\
  \ UI 中显示错误\n  }\n  // 处理验证成功\n}\n```\n\n注意，验证规则的格式遵循组件数据的形状。在这里，我们使用 `reactive()`\
  \ 函数来创建组件状态，但如果偏好是使用 `ref()`，那么传递给 `useVuelidate` 的状态将是一个收集了所有需要通过验证器的 `ref` 指针的对象。例如，前面的列表可以更改为：\n\
  \n1. 将第 2 行切换为导入 `ref` 而不是 `reactive`。\n2. 将第 7 到 13 行更改如下：\n   ```javascript\n\
  \   const title = ref('')\n   const author = ref('')\n   const price = ref({value:\
  \ 0.0, currency: 'GBP'})\n   ```\n将第 22 行更改为：\n\n```javascript\nconst v$ = useVuelidate(rules,\
  \ { title, author, price })\n```\n\n两个列表具有等效的行为。\n\n## Vuelidate 中的标准验证器\n\nVuelidate\
  \ 自带了几个标准验证器，它们非常擅长隐藏大量的模板代码。使用这些提供的验证器可以涵盖绝大部分所需的类型。\n\n| 验证器 | 用法 |\n| --- | ---\
  \ |\n| required | 将字段标记为所需，即非空 |\n| requiredIf | 仅当提供的数据/函数解析为 true 时将字段标记为所需 |\n\
  | requiredUnless | 将字段标记为所需，但仅当提供的数据解析为 false 时 |\n| minLength & maxLength | 期望数据具有最小（最大）长度\
  \ |\n| minValue & maxValue | 期望数据具有最小（最大）值 |\n| between | 期望数据位于两个值之间 |\n| alpha\
  \ & alphaNum | 期望数据仅为字母 – alpha，或字母和数字 – alphaNum |\n| numeric & integer | 期望数据为数字\
  \ (numeric)，仅整数 (integer) 或小数 (decimal) |\n| email | 确认输入的值符合标准的电子邮件格式 |\n| sameAs\
  \ | 确保此字段输入的值与其他处的值相同——非常适合密码检查 |\n| or & and & not | 这些允许规则组合以构建复杂的验证方案；它们的行为正如你预期的布尔运算符\
  \ |\n\n## 指定配置选项\n\n`useVuelidate()` 接受第三参数，用于传递控制验证执行方式的不同设置。此对象包含有限的键，如本节末尾表格所示。使用配置选项的方法如下代码所示：\n\
  \n```javascript\nconst $externalResults = ref({})\nconst v$ = useVuelidate(rules,\
  \ state, {\n  $autoDirty: true,\n  $lazy: true,\n  $externalResults\n})\n```\n\n\
  配置参数可以接受表格所示的键：\n\n| 配置选项 | 类型（及默认值） | 说明 |\n| --- | --- | --- |\n| $autoDirty |\
  \ Boolean (false) | 使 Vuelidate 自动跟踪状态变化 |\n| $externalResults | ServerErrors Ref<ServerErrors>\
  \ EPFO ServerErrors | 用于传入外部验证错误的地方——这些错误需要与状态匹配，但错误的实际来源无关 |\n| $lazy | Boolean\
  \ (false) | 为 false 时，在初始化时调用验证规则，否则仅在 $dirty 为 true 时调用 |\n| $registerAs | String\
  \ | 将自定义组件注册到父 Vuelidate 实例中 |\n| $rewardEarly | Boolean | 使 Vuelidate 在手动触发验证之前不使字段失效\
  \ |\n\n\n\n\n\n| $scope | Boolean | String | Symbol | Number (true) |\n| --- | ---\
  \ | --- | --- | --- |\n| | | | | 创建一个验证范围；如果为 true：收集所有验证响应；如果为 false：不收集；任何其他值指定一个范围——同一范围内的所有值都会收集，忽略其他所有值\
  \ |\n| $stopPropagation | Boolean (false) | 防止验证结果向层级结构的上层继续发射，无论范围如何 | |\n\n**表\
  \ 12.2: Vuelidate 配置选项**\n\n### Vuelidate 中的自定义验证器\n\n要创建一个自定义验证器，你只需要一个返回布尔值作为结果的纯函数。该函数可以像标准验证器一样，用在字段的规则中。\n\
  \n下面的代码列表通过创建两个自定义验证器来演示了这一点：第一个用于检查表单字段是否包含字母 `Rex`，第二个用于检查字段中是否输入了 ‘T’ 或 `Tyrannosaurus`。同时，我们还使用了一些\
  \ Vuelidate 提供的验证器辅助函数：`req` 用于表示某某值是必填的；以及 `regex`，允许在验证器中使用自定义正则表达式。\n\n```html\n\
  <template>\n  <!-- form controls here -->\n</template>\n\n<script setup=\"ts\">\n\
  import { useVuelidate } from '@vuelidate/core'\nimport { helpers } from '@vuelidate/validators'\n\
  import { reactive } from 'vue'\n\nconst { req, regex } = helpers\nconst customRexValidator\
  \ = (value) => \n  !req(value) || value.endsWith('Rex')\nconst customTyrannoValidator\
  \ = regex(/^Tyrannosaurus\\s/i, /^T\\s/i)\nconst state = reactive({})\nconst rules\
  \ = {\n  formField: { customRexValidator, customTyrannoValidator }\n}\nconst v$\
  \ = useVuelidate(rules, state)\n<!-- other setup stuff -->\n</script>\n```\n\n验证器模块带有几个辅助函数，可以用于构建自定义验证器或仅用于自定义标准验证器的输出；详情请参见**表\
  \ 12.3**：\n\n| 辅助函数名称 | 描述和用法 |\n| --- | --- |\n| forEach | `forEach()` 辅助函数用于方便简单的集合验证；它设计设计用于配合\
  \ `$each()` 迭代器，但仅限于嵌套验证无法迁移的情况。`$each()` 在版本 2 中已弃用——嵌套验证已成为验证集合的推荐方法。关于如何验证组件集合的内容在“验证集合和其他高级主题”章节中介绍。\
  \ |\n| len | 此辅助函数为所提供的值的类型返回相应的长度值，因此这可以是数组/字符串的长度，或者是对象的键计数。 |\n| regex | `regex`\
  \ 辅助函数设计用于轻松创建依赖正则表达式的验证器。该辅助函数包含了处理可选输入（根据 `req`）和 `$params` 集合（如 `withParams()`\
  \ 定义）的能力。在之前提供的示例列表中，有多个关于如何使用 `regex` 辅助函数的示例。 |\n| req | `req` 是一个允许处理可选字段的辅助函数。它类似于必填项验证器，并允许自定义验证器在需要可选字段时表现良好。前列表创建的\
  \ `customRexValidator()` 使用了 `req()` 辅助函数作为演示。 |\n| unwrap | 它从给定的 `ref`、`reactive`\
  \ 或 `computed` 属性中提取值：`const data = helpers.unwrap(param)` |\n| withAsync | `withAsync()`\
  \ 处理返回 promise 的验证器。该辅助函数通过跟踪状态和持有响应值来处理 promise 状态。`withAsync()` 接受两个参数：验证器和一个单个\
  \ `ref/computed` 值、一个 `ref/computed` 值列表，或一个返回 `reactive/computed` 值的函数。 |\n| withMessage\
  \ | 此辅助函数允许你为内置和自定义验证器创建自定义消息。`withMessage()` 辅助函数可以接受一个函数，该函数注入的对象为输出函数提供以下属性：$invalid`:\
  \ 验证状态 | `$model`: 验证值 | `$params`: 使用 `withParams()` 提供的值 | `$pending`: promise\
  \ 的解析状态 | `validator: helpers.withMessage(({ $pending, invalid, params, model })\
  \ => outputString, validator) } }` |\n| withParams | 有时验证器需要额外的参数或元数据来支持验证。在验证函数中访问这些数据是通过\
  \ `$params` 对象完成的。如果验证函数是需要提供额外响应属性的高阶函数，则需要在内部函数周围包裹 `withParams()` 包装。下面的列表涵盖了上述两种场景：`const\
  \ singleValidator = helpers.withParams({ key: fieldValue }, (value) => !helpers.req(value)\
  \ || fieldValue === value)` <!-- additional reactive params validation --> `const\
  \ paramsValidator = (param) => helpers.withParams({ key1: fieldValue, key2: param\
  \ }, (value) => !helpers.req(value) || value.includes(param))` |\n\n**表 12.3: Vuelidate\
  \ 辅助函数**\n\n### 检查并处理验证失败\n\n当一个（或多个）验证函数返回 `false` 时，验证失败。此时，验证对象被标记为 `$dirty`，且\
  \ `$invalid` 属性被设置为 true。如果 `$dirty` 和 `$invalid` 状态均为 true，则 `$error` 状态也会被设置为\
  \ true，并且 `$errors` 和 `$silentErrors` 数组将填充错误信息。\n\n要验证单个字段，或者如果表单中的每个单独字段都需要验证，可以为字段绑定到\
  \ `blur` 或 `change` 事件（或两者）的事件处理器；在这种情况下，处理程序是 `$touch`，如下下面的代码示例所示：\n\n```html\n\
  <input v-model=\"fieldName\" @blur=\"v$.fieldName.$touch\">\n```\n\n这会导致字段被标记为 `$dirty`，并按照我们刚刚描述的方式对字段进行验证并记录错误。\n\
  \n验证表单中的所有字段（包括嵌套字段）可以通过 `v$.$touch()` 方法或使用异步的 `v$.$validate()` 方法完成。虽然 `$touch()`\
  \ 可以附加到表单中的任何字段，但它主要与提交按钮配合使用。然而，通常的做法是在表单提交处理器中使用 `$validate()`：\n\n```html\n<template>\n\
  \  <form @submit.prevent=\"handleSubmit\">\n    ... form fields ...\n  </form>\n\
  </template>\n\n<script setup=\"ts\">\n  ... setup 验证器和规则 ...\n  const v$ = useVuelidate(rules,\
  \ state)\n\n  async function handleSubmit() {\n    const isFormValid = await v$.$validate()\n\
  \    // 如果表单无效，及早返回以防止表单提交\n    if (!isFormValid) {\n      return\n    }\n    //\
  \ 实际提交表单\n  }\n</script>\n```\n\n一旦表单被标记为 `$error=\"true\"`（即 `$dirty` 和 `$invalid`\
  \ 均 true），提交处理器需要返回 false 以停止处理或发生任何数据提交。\n\n当 `$error=\"true\"` 时，`$errors` 属性将以字段名为键填充集合，并返回与该字段相关的错误列表。\n\
  \n访问这些错误消息可以通过 `v-for` 迭代器完成。这里有一个在一个处遍历所有表单错误的列表；对于最小的表单，它并不有用：\n\n```html\n<form\
  \ @submit.prevent=\"handleSubmit\">\n  <input v-model=\"fieldName\">\n  <!-- 遍历所有表单错误\
  \ -->\n  <p v-for=\"error of v$.$errors\" :key=\"error.$uid\">\n    {{ error.$validator\
  \ }} 属性 {{ error.$property }} 说：{{ error.$message }}\n  </p>\n</form>\n```\n\n在单个字段上访问错误更符合用户体验，如下所示：\n\
  \n```html\n<form @submit.prevent=\"handleSubmit\">\n  <input v-model=\"fieldName\"\
  >\n  <!-- 遍历单个字段 (fieldName) 错误 -->\n  <ul v-if=\"v$.fieldName.$error\">\n    <li\
  \ v-for=\"error of v$.fieldName.$errors\">\n```\n\n\n\n\n\n```html\n<li :key=\"\
  error.$uid\">\n<!-- 访问与上方列表相同的所有字段 -->\n</ul>\n</form>\n```\n\n这些都是标准的用法模式，可以在 Vuelidate\
  \ 文档中找到。这些内容本身并不应该让你感到意外；正如如此，同测试一样（我们将在第 14 章 测试 Vue.js 应用中介绍测试），你将进行的大部分工作将是确保提供的数据是有效的，并且不会对服务器或数据库造成危险。\n\
  \n在涵盖基础知识后，我们将简要介绍一下 Vuelidate 允许你进行的一些高级操作。\n\n## 验证集合及其他高级主题](#contents.xhtml_sc3_273a)\n\
  \n在本节中，我们将涵盖一些偶尔会出现边缘情况。这些是你的验证工具箱（当使用 Vuelidate 时）的一部分，可以帮助你摆脱困境。\n\n### 使用 ref's、reactive\
  \ 和 computed 数值以及规则](#contents.xhtml_sc3_274a)\n\n在使用 `reactive` 状态时，向 `useVuelidate`\
  \ 提供状态与我们之前讨论的没有区别：需要将单个 `ref` 和 `computed` 值作为对象提供给组合。如果你需要混合不同类型的状态，即 `refs`、`reactive`\
  \ 和/或 `computed`，则使用如下相同的机制：\n\n```javascript\nimport { ref, computed, reactive\
  \ } from 'vue'\nimport { useVuelidate } from '@vuelidate/core'\nimport { ... } from\
  \ '@vuelidate/validators'\n\nconst reactiveState = reactive({ name: 'T-Rex' })\n\
  const refState = ref('')\nconst computedState = computed({\n  get () { ... }\n \
  \ set (value) { ... }\n})\nconst rules = []\nconst v$ = useVuelidate(\n  rules,\
  \ {reactiveState, refState, computedState}\n)\n```\n\n### 嵌套验证、验证范围和仅收集器组件](#contents.xhtml_sc3_275a)\n\
  \n管理嵌套集合的推荐方法是创建一个可以嵌套的组件，该组件有自己的 set 验证规则，并让 `useVuelidate` 收集所有的错误（作为 `$errors`\
  \ 和 `$silentErrors`）；在父组件上使用 `$touch` 会导致在所有嵌套组件上调用 `$touch`。\n\n这种行为意味着你只需要对父组件调用验证，所有子组件将同时进行验证；在下面的代码示例所示：\n\
  \n```html\n<template>\n  <div>\n    <ChildComponent v-for=\"c in components\" :key=\"\
  c.id\" />\n    <!-- 这将包含来自所有 <ChildComponents/> 的所有 $errors/$silentErrors -->\n\
  \    <p v-for=\"error of v$.$errors\" :key=\"error.$uid\">\n      {{ error.$message\
  \ }}\n    </p>\n  </div>\n</template>\n\n<script setup lang=\"ts\">\n  import {\
  \ ref } from 'vue'\n  import { useVuelidate } from '@vuelidate/core'\n  import ChildComponent\
  \ from '@/components/ChildComponent'\n\n  const components = ref([ ... ])\n  //\
  \ 这将收集所有组件的验证结果\n  const v$ = useVuelidate()\n</script>\n```\n\n对于任何涉及集合的用例，创建嵌套组件都不是可行的解决方案，那么\
  \ Vuelidate（在 `@vuelidate/components` 包中）提供了 `ValidateEach` 组件。此包装组件接受验证规则、集合和任何所需的模板（作为默认插），并将\
  \ Vuelidate 实例传递给父组件和任何子组件，以便通过层次结构进行验证。参见下文列表示例：\n\n```html\n<template>\n  <ValidateEach\n\
  \    v-for=\"(item, index) in collection\"\n    :key=\"index\" :state=\"item\" :rules=\"\
  rules\">\n    <template #default=\"{ v }\">\n      <div>\n        <!-- 此处放置内容 -->\n\
  \      </div>\n    </template>\n  </ValidateEach>\n</template>\n\n<script setup\
  \ lang=\"ts\">\n  import { reactive } from 'vue'\n  import { useVuelidate } from\
  \ '@vuelidate/core'\n  import { ValidateEach } from '@vuelidate/components'\n  import\
  \ { ... } from '@vuelidate/validators'\n\n  const rules = {}\n  const collection\
  \ = reactive([ ... ])\n  const v$ = useVuelidate()\n</script>\n```\n\n使用嵌套组件时，存在某些父验证收集的数据需要限制的情况；这就是范围控制（scoping）的作用的地方。为了处理范围控制，Vuelidate\
  \ 提供了 `$scope` 和 `$stopPropagation` 选项。通过这些选项，你可以控制父组件何时收集嵌套数据。\n\n `$scope` 接受三个值：\n\
  - `true`: 这是默认行为。\n- `false`: 强制验证器不收集任何数据。\n- `<string | number | symbol>`: 此值标记一个范围，任何具有此范围的子组件都将被该验证器收集和管理。\n\
  \n```javascript\n// $scope = false\nimport { useVuelidate } from '@vuelidate/core'\n\
  // ... 其他初始化\nconst v$ = useVuelidate(rules, state, { $scope: false })\n\n// 父组件:\
  \ $scope = 'thisScope'\nimport { useVuelidate } from '@vuelidate/core'\nimport {\
  \ h } from 'vue'\nimport ChildComponent from './ChildComponent'\nconst scope = 'thisScope'\n\
  const v$ = useVuelidate(rules, state, { $scope: scope })\n\nfunction render() {\n\
  \  return h(ChildComponent)\n}\n\n// 子组件: $scope = 'thisScope'\nimport { useVuelidate\
  \ } from '@vuelidate/core'\nconst props = defineProps(['scope'])\nconst v$ = useVuelidate(rules,\
  \ state, { $scope: props.scope })\n```\n\n`$stopPropagation` 告诉验证器不要将结果传递给父组件，但继续从任何子组件收集；这对于提供自己的验证但不应让父组件可见的上下文非常有用。下面展示了如何实现：\n\
  \n```javascript\nimport ChildComponent from '@/components/ChildComponent'\n// 收集\
  \ ChildComponent 的验证但不传递给父组件\nconst v = useVuelidate(validations, state, {\n  $stopPropagation:\
  \ true\n})\n```这些机制允许丰富的交互表单验证。\n\n由于之前提到的 `useVuelidate` 会自动收集子结果，父组件可以设置为“仅收集器”组件。这种顶级组件只定义父验证器，将验证规则留给每个嵌套组件。此父验证器有一个可选配置对象，用于提供有关范围和任何可用配置选项的信息；请参见\
  \ [`vuelidate-next.netlify.app/api/configuration.html`](https://vuelidate-next.netlify.app/api/configuration.html)\
  \ 获取更多有关可用配置选项的用法。\n\n### 修改验证器返回的数据](#contents.xhtml_sc3_276a)\n\n在大多数情况下，默认的布尔返回值就足够了。但在某些情况下，你可能需要提供有关遇到错误的更多信息以便理解失败。在这种情况下，验证函数可以返回一个对象；唯一的规定是该对象有一个\
  \ `$valid` 键来存储验证状态。根据需要可以返回任何其他信息。\n\n访问返回对象中的数据是通过验证和错误对象的 `$response` 属性完成的。代码块显示如何在验证函数的\
  \ `$response` 属性中进行这些更改：\n\n```javascript\nconst validationFunction = (value) =>\
  \ {\n  if (value === 'value') {\n    return true\n  }\n  return {\n    $valid: false,\n\
  \    message: '某些消息',\n    data: [],\n    moreData: {}\n  }\n}\n```\n\n### 从服务器端或\
  \ API 验证返回错误](#contents.xhtml_sc3_277a)\n\n\n\n\n\n在服务器端拥有更严格的验证规则并不罕见，这可以保护数据入口点和数据存储。因此，某些可能通过客户端（前端）验证的数据，在随后传递给服务器处理时可能会失败。\n\
  \n为了处理这种情况，`useVuelidate` 允许你将数据传递给 `$externalResults` 配置属性；这些数据需要是响应式的（即 `reactive()`\
  \ 或 `ref()`），以便验证引擎对其进行跟踪。\n\n下面的代码示例演示了如何使用 `$externalResults`：\n\n```javascript\n\
  const state = reactive({ ... })\n// 外部结果占位符\nconst $externalResults = ref({})\n\
  const rules = { ... }\nconst v = useVuelidate(rules, state, { $externalResults })\n\
  // validate 方法\nasync function validate () {\n  if (!await v.value.$validate())\
  \ return\n  const resp = await asyncFunction(state)\n  //将错误添加到外部结果对象中\n  $externalResults.value\
  \ = resp?.errors\n}\n```\n\n大多数情况下，这些外部数据将由 Vuelidate 跟踪和清除（如果你使用了 `$model`，即通过\
  \ `v-model`，或 `$autoDirty` 配置选项）。如果这两者都不适用且你需要清除 `$externalResults`，Vuelidate 为每个验证值提供了一个\
  \ `$clearExternalResults()` 方法，使你能够手动处理数据的清除，如如下列表所示：\n\n```javascript\nasync function\
  \ validationFunction () {\n  // 清除旧结果\n  v.value.$clearExternalResults()\n  // 然后\n\
  \  if (!await v.value.$validate()) return\n}\n```\n\n## 支持国际化 (i18n)\n\n在各个应用程序中，能够用多种语言（即用户本地配置的默认语言）与用户进行交互正变得越来越重要；验证响应也不例外例外。Vuelidate\
  \ 同样涵盖了这一场景。\n\n为了支持国际化（i18n），你需要向项目添加 i18n 库及其依赖项：推荐的包是 `@/i18n` 配合 `vue-i18n`。在准备好这些包后，你需要创建所需的包装器和函数，如下列表所示：\n\
  \n```javascript\nimport { createI18nMessage, required as v_r, minLength as v_ml\
  \ } from '@vuelidate/validators'\nimport { i18n } from '@//i18n'\nconst withI18nMessage\
  \ = createI18nMessage(\n  { t: i18n.global.t.bind(i18n) }\n)\n// 包装每个需要的验证器\nexport\
  \ const required = withI18nMessage(v_r)\nexport const minLength = withI18nMessage(v_ml,\
  \ { withArguments: true })\n```\n\n设置好后，使用 i18n 验证器对开发者来说是透明的。默认情况下，验证消息预期在如下对象中指定：\n\
  \n```json\n{\n  \"validations\": {\n    \"required\": \"{property} 是必填的。\",\n  \
  \  \"minLength\": \"{property} 最小长度不能少于 {min}。\"\n  }\n}\n```\n\n可以在各个命名包的文档中找到更多配置选项。\n\
  \n## 异步 setup 函数\n\n在 `<script setup>` 中使用顶层 `await` 时，编译器会将其转换为 `async setup()`\
  \ 函数。要在在此类型的设置中使用 Vuelidate，你需要访问当前的 Vue 实例并将其传递给 `useVuelidate` 的配置。下面的列表显示了在异步设置中设置\
  \ Vuelidate 的一种方法：\n\n```javascript\nconst currentVueInstance = getCurrentInstance()?.proxy\n\
  // 顶层 await\nconst result = await asyncFunction()\nconst vuelidate = useVuelidate(rules,\
  \ result.state, \n  { currentVueInstance }\n)\n```\n\n如此，我们现在可以讨论如何将 `v-model` 与组件结合，为我们组件的用户提供易于使用的\
  \ API。\n\n## 在组件中使用 v-model\n\n在项目构建过程中，有时通过元素创建表单是不够的，或者你的任务是构建一个标准组件库，供组织内的多个项目复用。在这种情况下，表单元素可能会作为组件的一部分提供。因此问题是：我们如何将\
  \ `v-model` 的便利性传播到组件中，使其既易用又一致？答案可以在之前介绍过的“值绑定与 `v-model`”章节中找到。如果你记得，`v-model`\
  \ 是值绑定（默认为 `modelValue`）和事件绑定（默认为 `update:modelValue`）的语法糖：即字段数据以及字段更新时触发的事件。\n\n\
  作为提醒，下面的代码列表是等价的；第一种使用了 `v-model` 的便利性：\n\n```html\n<input v-model=\"fieldValue\"\
  />\n```\n\n第二种使用了扩展形式：\n\n```html\n<input :modelValue=\"fieldValue\" @update:modelValue=\"\
  value = value\"/>\n```\n\n因此，为了构建一个接受 `v-model` 的组件，该组件需要接受 `modelValue` 属性并触发 `update:modelValue`\
  \ 事件。在实践中，这可以通过多种方式实现，取决于个人偏好以及你使用的 API；这里我们将使用 Composition API 构建一个简单形式的组件包装器（`SimpleComponent.vue`）：\n\
  \n```vue\n<!-- SimpleComponent.vue -->\n<template>\n  <input type=\"text\" :value=\"\
  modelValue\" @input=\"$emit('update:modelValue', $event.target.value)\">\n</template>\n\
  <script setup>\ndefineProps(['modelValue'])\ndefineEmits(['update:modelValue'])\n\
  </script>\n```\n\n如果你的偏好是使用计算属性来处理这种交互，推荐使用列表所示模式：\n\n```vue\n<!-- ComputedComponent.vue\
  \ -->\n<template>\n  <input type=\"text\" v-model=\"value\"/>\n</template>\n<script\
  \ setup>\nimport { computed } from 'vue'\nconst props = defineProps(['modelValue'])\n\
  const emit = defineEmits(['update:modelValue'])\nconst value = computed({\n  get()\
  \ {\n    return props.modelValue\n  },\n  set(value) {\n    emit('update:modelValue',\
  \ value)\n  }\n})\n</script>\n```\n\n再次，这两种方法都是有效的；取决于你的个人偏好。\n\n你可能没有注意到，上面的列表处理的是单个属性——即单个数据。在许多情况下，请求的功能可能依赖于多一个数据点。为了解决这个问题，`v-model`\
  \ 接受一个参数，该参数绑定到数据值而不是默认的 `modelValue`。使用 `v-model` 参数时，你在 `v-model` 属性上使用绑定操作符（`:`）来分配名称，如下所示：\n\
  \n```html\n<!-- 绑定到 SimpleComponent 上的 inputValue 属性 -->\n<SimpleComponent v-model:input-value=\"\
  this_value\"/>\n```\n\n这样使用时，组件需要提供一个同名的属性，并要求触发一个自定义更新事件。使用之前讨论的简单组件格式，你将如下所示构建组件：\n\
  \n```vue\n<!-- 带有 inputValue 参数的 SimpleComponent -->\n<template>\n  <input type=\"\
  text\" :value=\"inputValue\" @input=\"$emit('update:inputValue', $event.target.value)\"\
  >\n</template>\n<script setup>\ndefineProps(['inputValue'])\ndefineEmits({ \n  (e:\
  \ 'update:inputValue', inputValue: string): void\n}>()\n</script>\n```\n\n这对我们的帮助在于，现在我们有了工具传递多个命名的\
  \ `v-model`，并让组件内部管理属性和事件。作为一个简单的演示，如下列表给出了接受多个属性的简单组件：\n\n```html\n<!-- MultiPropComponent\
  \ - Book -->\n<template>\n```\n\n\n\n\n\n```html\n<input type=\"text\" v-model=\"\
  title\">\n<input type=\"text\" v-model=\"author\">\n<input type=\"number\" v-model=\"\
  price\">\n</template>\n\n<script setup lang=\"ts\">\nimport { computed } from 'vue'\n\
  \ninterface Book {\n...\n}\n\nconst props = defineProps<Book>()\n// 这里使用运行时定义以节省空间\n\
  const emit = defineEmits(['update:title', 'update:author', 'update:price'])\nconst\
  \ title = computed({\n  get () { return props.title },\n  set (title) { emit('update:title',\
  \ title) }\n})\n... 定义其他 props，如 title ...\n</script>\n```\n\n使用此后，`MultiPropComponent`\
  \ 的使用方法变得如下简单：\n\n```html\n<MultiPropComponent \n  v-model:title=\"Vue.js for Job\
  \ Seekers\"\n  v-model:author=\"Clive Harber\"\n  v-model:price=\"24.99\"\n/>\n\
  ```\n\n为使用 `v-model` 参数值的组件添加修饰符（modifiers），只需设置一个使用“参数名+修饰符”作为名的 prop 即可，例如 `titleModifiers`\
  \ 或 `authorModifiers`。组件对于修饰符表现出的行为与我们之前讨论的相同。\n\n希望你能看到，可以构建任意复杂的基于表单元素的自定义组件，这些组件将遵循标准的数据输入和事件模式。遵循这些模式使得此类组件在不同项目和团队之间更易使用。\n\
  \n考虑到这一点，我们可以开始考虑为我们的示例应用程序添加一些表单。\n\n### 向示例应用程序中添加表单\n\n现在我们已经理解了如何构建表单以及如何在发送数据之前对其进行验证，我们可以查看我们为正在构建的示例应用需要的一些表单。\n\
  \n此处将提供表单的部分包括用于菜单和商品显示页的 `AddToCartComponent`、结账页面上的多个组件，以及 `LoginComponent`。\n\
  \n### AddToCartComponent\n\n该组件用于多个处，并在当商品被添加到用户购物车时管理商品数量。\n\n因此，我们需要构建此组件，使其接受一个描述\
  \ `ItemComponent` 的对象——这些数据来自组件的父级，并允许增加或减少所需的数量。我们将在接下来的几个列表中提供此组件的主要元素，以便你可以看到主要部分是如何组合在一起的。我们将探索的第一部分是模板（template）部分：\n\
  \n```html\n<template>\n  <div class=\"...\">\n    <div class=\"...\">{{ formatAsCurrency(item.price)\
  \ }}</div>\n    ...\n    <button type=\"button\" @click=\"incrementCount\">\n  \
  \    <icon ... />\n    </button>\n    <input type=\"text\" class=\"...\" v-model=\"\
  itemCount\"/>\n    <p v-for=\"error of v$.itemCount.$errors\" :key=\"error.$uid\"\
  >\n      <strong>{{ error.$message }}</strong>\n    </p>\n    <button type=\"button\"\
  \ =\"...\" @click=\"decrementCount\">\n      <icon ... />\n    </button>\n    ...\n\
  \    <button type=\"button\" class=\"...\" @click=\"addToCart\">\n      加入购物车\n\
  \    </button>\n    ...\n  </div>\n</template>\n```\n\n如你所见，模板非常简单：它有一些点击处理器；一个格式化函数（可以是普通函数，也可以是计算属性）；最后是一个处理错误信息的简单循环。\n\
  \n下一个列表详细说明了脚本（script）部分的第一部分，在其中设置了组件数据并规定了验证规则：\n\n```typescript\n<script setup\
  \ lang=\"ts\">\nimport { ref } from 'vue'\nimport { useCart } from '../../composables/useCart'\n\
  import { useVuelidate } from '@vuelidate/core'\nimport { integer, minValue, maxValue\
  \ } from '@vuelidate/validators'\n\ntype Item = { ... }\n\nconst props = defineProps<{\
  \ item: Item }>()\nconst { addItem } = useCart()\nconst itemCount = ref(1)\nconst\
  \ rules = {\n  itemCount: {\n    integer,\n    minValue: minValue(1),\n    maxValue:\
  \ maxValue(10)\n  }\n}\nconst v$ = useVuelidate(rules, { itemCount }, { $autoDirty:\
  \ true })\nconst decrementCount = () => {\n  if (itemCount.value > 1) {\n    itemCount.value\
  \ -= 1\n  }\n}\nconst incrementCount = () => itemCount.value++\n```\n\n上一个列表中最有趣的部分是定义和使用规则的地方。下一部分展示了如何使用规则定义：\n\
  \n```typescript\nasync function addToCart() {\n  const isCorrect = await v$.validate();\n\
  \  if (!isCorrect) return;\n  addItem({\n    id: props.item.id,\n    name: props.item.name,\n\
  \    price: props.item.price,\n    qty: itemCount.value,\n    extras: [],\n  });\n\
  }\n</script>\n```\n\n这是一个简单的表单；`ManageOrderComponent` 的结构类似，但它管理的数据不同。由于相似之处，有机会抽象出差异并通过插槽（slot）将它们注入。这个练习留给你完成。\n\
  \n### CartAddressComponent\n\n该组件初始的设计非常简单；然而，我们将添加更多信息，以便我们可以构建地址的详细规则，特别是邮编。这种新设计见图\
  \ 12.1：images/figure12.png\n\n#### 图 12.1：CartAddressComponent\n\n通过这些设计，我们组件的 HTML\
  \ 模板如下：\n\n```html\n<div v-for=\"(control, key) in formControls\" :key=\"key\">\n\
  \  <div class=\"...\">\n    <label>{{ control.label }}</label>\n  </div>\n  <div\
  \ class=\"...\">\n    <input v-model=\"formState[key]\" :placeholder=\"control.placeholder\"\
  >\n    <p class=\"...\">{{ v$[key].errors.join(',') }}</p>\n  </div>\n</div>\n```\n\
  \n从模板部分你可以看到组件将使用的模型类型；接下来的列表将关注变动部分。让我们从添加导入开始：\n\n```typescript\nimport { reactive\
  \ } from 'vue'\nimport { useVuelidate } from '@vuelidate/core'\nimport { required,\
  \ alpha, helpers } from '@vuelidate/validators'\n```\n\n前面的代码是简单的样板设置，随后是创建构建表单所需的有用接口：\n\
  \n```typescript\ninterface FormControl {\n  ...\n}\ninterface CheckoutForm {\n \
  \ ...\n}\nconst formControls: CheckoutForm = {\n  name: { label: '姓名' },\n  address1:\
  \ { label: '地址第一行', placeholder: '门牌、街道名' },\n  address2: { label: '地址第二行', placeholder:\
  \ '当地地区' },\n  town: { label: '城市' },\n  county: { label: '郡州' },\n  postcode: {\
  \ label: '邮编' },\n};\n```\n\n完成这些后，我们设置表单状态：\n\n```typescript\nconst formState =\
  \ reactive({\n  name: '',\n  address1: '',\n  address2: '',\n  town: '',\n  county:\
  \ '',\n  postcode: '',\n})\n```\n\n之后，我们将使用 `regex()` 辅助函数为地址行和邮编添加自定义验证器，以便我们可以构建验证器所需的规则。实际代码在下一个代码段中：\n\
  \n```typescript\nconst addressLineValidator = helpers.regex(/[a-z0-9\\s\\,\\.]+/i);\n\
  const postcodeValidator = helpers.regex(\n  /^[A-Z]{1,2}[0-9R][0-9A-Z]*[0-9][ABD-HJLNP-UW-Z]{2}$/i\n\
  );\nconst rules = {\n  name: { required, alpha },\n  address1: { required, addressLineValidator\
  \ },\n  address2: { addressLineValidator },\n  town: { required, addressLineValidator\
  \ },\n  county: { required, addressLineValidator },\n  postcode: { required, postcodeValidator\
  \ },\n};\nconst v$ = useVuelidate(rules, formState, { $autoDirty: true });\n```\n\
  \n我们将讨论的下一个组件是处理优惠券和/或折扣码的组件。\n\n### ApplyVoucherToCartComponent\n\n\n\n\n将优惠券或折扣码应用于购物车，需要外部服务来验证所提供的代码是否有效，然后将该信息传递给购物车，以确保为客户应用正确的定价。\n\
  \n这将需要使用 `$externalResults` 配置设置并访问相关的 API。\n\n首先，这里是模板的重要部分：\n\n1. `<div class=\"\
  ...\">`\n2. `<form @submit=\"submitValidationCode\">`\n3. `<div class=\"...\">`\n\
  4. `<label class=\"...\">Voucher Code</label>`\n5. `<input class=\"...\" v-model=\"\
  validationCode\"`\n6. `placeholder=\"Enter discount code\"/>`\n7. `<button type=\"\
  submit\" class=\"...\">Apply</button>`\n8. `</div>`\n9. `</form>`\n10. `</div>`\n\
  \n以下是脚本部分的更改：\n\n1. `...`\n2. `import { alpha } from '@vuelidate/validators';`\n\
  4. `const validationCode: Ref<string> = ref('');`\n5. `const $externalResults =\
  \ ref({});`\n6. `const v$ = useVuelidate({ validationCode: { alpha } },`\n7. `{\
  \ validationCode }, { $externalResults });`\n9. `async function submitValidationCode()\
  \ {`\n10. `const formValid = await v$.value.$validate();`\n11. `if (!formValid)\
  \ return;`\n12. `const resp = await validateVoucherCode(validationCode.value)`\n\
  13. `$externalResults.value = resp?.errors;`\n14. `}`\n16. `async function validateVoucherCode(code:\
  \ string): Promise<Record<string, string[]>> {`\n17. `return { errors: [] };`\n\
  18. `}`\n\n# LoginComponent\n\n这是一个简单的组件，只有两个字段和一个按钮。这里的验证器需要检查给定的用户名和密码；用户名使用电子邮件地址，密码应确保符合以下标准：\n\
  \n* 超过 8 个字符\n* 少于 20 个字符\n* 字母和数字（区分大小写）\n* 有限的特殊字符集\n\n模板非常简单：\n\n1. `...`\n2.\
  \ `<label class=\"...\">Email</label>`\n3. `<input class=\"...\" v-model=\"userEmail\"\
  \ type=\"email\"`\n4. `placeholder=\"Registered Email\" />`\n5. `<p v-if=\"v$.userEmail.$errors\"\
  \ class=\"...\">`\n6. `<span v-for=\"error in v$.userEmail.$errors\" :key=\"error\"\
  >`\n7. `{{ error }}</span>`\n8. `</p>`\n9. `...`\n10. `<label class=\"...\">Password</label>`\n\
  11. `<input class=\"...\" v-model=\"password\" type=\"password\"`\n12. `placeholder=\"\
  Account password\" />`\n13. `<p v-if=\"v$.password.$errors\" class=\"...\">`\n14.\
  \ `<span v-for=\"error in v$.password.$errors`\n15. `:key=\"error.$uid\">{{ error\
  \ }}</span>`\n16. `</p>`\n\n脚本部分如下：\n\n1. `import { ref, Ref } from 'vue';`\n2.\
  \ `import { ServerErrors, useVuelidate } from '@vuelidate/core';`\n3. `import {\
  \ required, helpers, email } from '@vuelidate/validators';`\n4. `import { useRouter\
  \ } from 'vue-router';`\n\n我们在这里解构验证辅助工具以帮助树摇优化（tree-shaking），并在用户详情正确时使用路由器进行重定向：\n\
  \n1. `const { regex, withMessage } = helpers;`\n2. `const $externalResults: Ref<ServerErrors>\
  \ = ref({});`\n3. `const passwordValidation = regex(/[a-zA-Z0-9\\!\\@\\*\\.\\%\\\
  $\\£\\'\\+]{8,20}/);`\n\n在这里，我们正在使用 `withMessage()` 辅助工具构建规则，以改进返回给用户信息：\n\n1. `const\
  \ rules = {`\n2. `userEmail: {`\n3. `required: withMessage('Account email is required',\
