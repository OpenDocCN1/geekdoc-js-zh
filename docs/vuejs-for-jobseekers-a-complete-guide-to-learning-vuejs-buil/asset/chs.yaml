  在 JS 中，通过前面描述的 `const` 这样处理原始数据是简单的。如果你所有的原始数据都是通过这样创建的，当你尝试覆盖这样创建的数据时，你的应用程序将会报错。\n\
  \n如果一个函数的设计时考虑了纯性，它只需要对被提供的数据进行操作，并返回可预测的且与提供的数据一致的值。纯函数应该是幂等的：对于给定一组输入，无论外部条件如何，预期的输出都不应该变化。你不会期望\
  \ `99 + 1` 永远不等于 `100`，那么为什么你应该期望在给它相同数据时，函数的输出会给你不同的答案呢？答案是你不应该这样做；你应该尝试编写代码（至少是应用程序的业务逻辑）而不产生副作用。\n\
  \n*   使用迭代器而非循环或递归\nJS 原生不支持部分应用和柯里化。然而，它提供了通过使用语法和函数的一等特性来模拟这种操作的支持，如下：\n利用这些知识并更进一步，我们得到了组合。组合是将许多函数结合以创建复杂性不断增加的流，避免指令流（如你从命令式编程中获得的流）。通过将处理的各种复杂性抽象为基于简单和/纯函数的操作，你可以避免命令式的循环和创建配谱式的指令：\n\
  \  multiplyBy10,\n由于 `fetch()` 是异步的，它返回一个 `Promise`，这使得处理返回的 `Response` 对象变得简单。基础层面是你向\
