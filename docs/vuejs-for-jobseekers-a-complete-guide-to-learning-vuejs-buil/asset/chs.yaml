  \ `Body` 对象的其中一个函数进行提取，如下：\n  method: HTTP_VERB, // 例如 GET, POST, DELETE 等。\n</div>\n\
  /* eslint-disable no-console */\nconst wss = new WebSocket.Server({ server })\n\
  const var3: boolean = false\n\n当遇到生命周期钩子时，钩子的 `this` 上文会自动绑定到实例，这样钩子就可以访问实例的数据、方法和计算属性。\n\
  \n\n\n# 构建应用](#contents.xhtml_sc3_95a)\n```html\n\n### 在 Vue.js 应用中包含 TypeScript\
  \ 支持\n## 要记忆的点\n\n        这里是一些插槽文本\n      </custom-component>\n    </section>\n\
  \  </main>\n</template>\n```\n\n我们稍后会介绍标准指令，但它们为模板提供了基本的循环和决策逻辑，你也可以在需要时创建自己的指令。\n\
  \n脚本部分\n\n\n\n\n\n`script` 部分是放置组件定义的地方。如果你仔细想想，这是符合逻辑的；毕竟我们处理的是 JavaScript 组件。\n\
  \n在这里，我们放置了组合一个组件所需的所有部分。与构建标准的 JavaScript 代码一样，`script` 部分包含了支持该组件所需的所有相关导入（imports）。它还需要使用默认导出（default\
  \ export）来导出组件定义。\n\n```javascript\n<script>\n  import CustomComponent from '@/components/CustomComponent.vue'\n\
  \n  export default {\n    name: 'sample-component',\n    components: { CustomComponent\
  \ },\n    data: () => ({\n      list: ['item 1', 'item 2', 'item 3']\n    })\n \
  \ }\n</script>\n```\n\n## 渲染函数 (Render function)\n\n尽管建议使用模板（templates）来构建 HTML，但在某些情况下你可能更密切地控制\
  \ HTML 的生成；这就是 `render` 函数大用用场，它是一种更接近编译器的替代方案。\n\n当你有一个抽象组件需要输出特定上下文的 HTML，而这些\
  \ HTML 在模板中编写会非常繁琐或重复时，这种方法最为有用。\n\n让我们简单地凑出一个示例来说明这一点。\n\n我们的目标是构建一个简单的卡片组件。这是一种常见的组件类型，老实说，它作为模板组件更好，但对于此演示已经足够了。\n\
  \n该组件包含以下 HTML：\n\n```html\n<div class=\"...\">\n  <img src=\"...\" class=\"...\"\
  \ alt=\"...\">\n  <div class=\"...\">\n    <h5 class=\"...\">标题文本</h5>\n    <p class=\"\
  ...\">这是一句为该组件提供一些基础正文内容的简短描述。</p>\n    <a href=\"#\" class=\"...\">行动链接 (Call to\
  \ action link)</a>\n  </div>\n</div>\n```\n\n这是一个相对简单的 DOM 树，有几层子节点。我们将将其构造为一个基于渲染函数的组件。该组件包含以下代码：\n\
  \n```javascript\nconst { createApp, h } = Vue\nconst app = createApp()\napp.component('card-component',\
  \ {\n  render () {\n    return h('div', { class: '...' }, [\n      h('img', { src:\
  \ '#', class: '...', alt: '...' }),\n      h('div', { class: '...' }, [\n      \
  \  h('h5', { class: '...' }, this.title),\n        h('p', { class: '...' }, this.$slots.default()),\n\
  \        h('a', {\n          href: this.url,\n          class: '...',\n        \
  \  onClick: $event => { \n            console.log('clicked', $event.target)\n  \
  \        }\n        }, this.link_text)\n      ])\n    ])\n  },\n  props: {\n   \
  \ title: {\n      type: String,\n      required: true\n    },\n    url: {\n    \
  \  type: String,\n      required: true,\n      default: '#'\n    },\n    link_test:\
  \ {\n      type: String,\n      required: true\n    }\n  }\n})\n```\n\n通常情况下，组件的格式与任何其他组件相同。这里的巨大区别是使用了\
  \ `render` 函数而不是 `<template/>` 标签。\n\n任何渲染函数的依据都是 `h()` 函数。`h()` 是一个虚拟节点工厂函数；它根据提供的数据生成虚拟节点，并具有以下签名：\n\
  \n```javascript\n// @returns {VNode}\nh('div', {}, [])\nh(\n  // 必须\n  // {String\
  \ | Object | Function} tag\n  // 一个 HTML 标签名、一个组件、一个异步组件\n  // 或函数组件\n  tag,\n \
  \ // 可选\n  // {Object} props | null\n  // 一个对应于属性、props 和事件的对象\n  // 我们在模板中会使用的那些。\n\
  \  {},\n  // 可选\n  // {String | Array | Object} children\n  // 子节点 VNodes，使用 'h()'\
  \ 构建，\n  // 或使用字符串获取 'text VNodes' 或\n  // 使用带有带插槽 (slots) 的对象。\n  []\n)\n```\n\n\
  如果你熟悉 Elm，这个签名会让你联想到 `Html` 模块提供的函数。这里没有魔术；`h()` 函数是 Vue 中所有渲染的依据，也是 `template`\
  \ 标签被处理的方式。\n\n正如你在示例所示，在 `render()` 函数中访问 `props` 的方式与标准模板中相同；参见第 10 行和第 18 行。\n\
  \n渲染函数与标准模板的区别在于事件的编写方式以及项目的生成方式。\n\n在事件处，即你会使用 `v-on`（或 `@`）的地方，你需要使用 HTML 的等效写法；因此\
  \ `@click` 是 `onClick`（如第 15–17 行所示），`@change` 是 `onChange`以此此类推。\n\n当你想要重复渲染元素（`v-for`）或条件渲染某些内容（`v-if`）时，你需要参考\
  \ `Array.map()` 函数和 `if{}` 结构。\n\n由于示例代码中没有这些构造，我们将在后面查看首先是 `v-if` 然后是它的等效写法：\n\n\
  ```html\n// template\n<template>\n  <p v-if='show'>为真时显示</p>\n  <p v-else>为假时显示</p>\n\
  </template>\n```\n\n```javascript\n// render function\nrender () {\n  if (this.show)\
  \ {\n    h('p', null, '为真时显示')\n  } else {\n    h('p', null, '为假时显示')\n  }\n},\n\
  ```\n\n以及 `v-for`：\n\n```html\n// template\n<template>\n  <ul>\n    <li v-for=\"\
  (ele, idx) in list\" :key=\"idx\">{{ ele }}</li>\n  </ul>\n</template>\n```\n\n\
  ```javascript\n// render function\nrender() {\n  return h('ul', null, this.list.map((ele,\
  \ idx) => {\n    return h('li', { key: idx }, ele)\n  }))\n}\n```\n\n渲染函数与模板之间还有几点我们需要讨论，但我们还没有讨论\
  \ `v-model` 或动态组件。\n\n## 样式部分 (Style Section)\n\n`style` 部分包含了组件特定的样式覆盖。此部分不需要是\
  \ CSS，这是默认；任何被 babel 理解的样式语言（例如 Sass、SCSS、Less 或 Stylus）只要标记了相关的 `lang` 属性即可。\n\n\
  此部分也可以标记为 `scoped`，以便样式仅作用于此组件而不是全局范围。\n\n查看以下列表以理解如何实现这一点：\n\n```html\n<style></style>\n\
  <style scoped></style>\n<style lang=\"stylus\"></style>\n<style lang=\"scss\" scoped></style>\n\
  <style lang=\"less\" module></style>\n<style module=\"myModule\"></style>\n```\n\
  \n我们看到的是定义组件样式的各种方式：\n\n- 第 1 行：标准的全局可用 CSS\n- 第 5 行：标准的 CSS，但局部于组件\n- 第 9 行：使用\
  \ Stylus 格式化样式并使其全局可用\n- 第 13 行：使用 SCSS 格式化样式并局部化\n- 第 17 行：将使用的 CSS 语言设置为 Less\
  \ 并作为纯 CSS 模块，可以在 HTML 中通过 `$style` 引用\n- 第 21 行：使用普通 CSS 样式作为命名 CSS 模块，类规则在 HTML\
  \ 中引用时带有名称前缀\n\n当样式被标记为 `scoped` 时，编译器会为所有样式加上一个随机字符串，然后将其注入到生成的 HTML 中以隔离组件样式。\n\
  \n定义作用域样式的方法如下：\n\n```html\n<style scoped>\n.example {\n  font-weight: bold;\n \
  \ font-size: 3.5em;\n}\n</style>\n\n<template>\n  <div class=\"example\">样式作用于此处</div></div>\n\
  </template>\n```\n\n在这里，引擎利用 PostCSS 将前述转换为以下内容：\n\n```html\n<style>\n.example[data-v-a6d7g2]\
  \ {\n  font-weight: bold;\n  font-size: 3.5em;\n}\n</style>\n\n<template>\n  <div\
  \ class=\"example\" data-v-a6d7g2>样式作用于此处</div></div>\n</template>\n```\n\n\n\n\n\
  通过组件构建 UI 通常涉及确定需要哪些组件，并逐一构建每个部分。组件可以直接由 HTML 构建，也可以由其他组件构建，亦或是两者的结合。\n\n组件可以使用其他组件作为构建块进行构建，这是基于组件的\
  \ UI 的一个基本属性，特别是对于 `Vue.js`，并且被称为组合（composition）。\n\n这种抽象允许创建小小的、自包含的、可复用的组件，这些组件可以被用于构建大型\
  \ Web 应用程序。就像 HTML DOM 可以用元素树表示一样，你可以使用相同的模型来思考如何使用 `Vue` 组件构建界面。例如，让我们考虑下面的图，它显示了一个简单界面的线框图：\n\
  \n![Graphical user interface, text, application Description automatically generated](img/figure_5.1.png)\n\
  \n**图 5.1：组件组合线框图**\n\n根据这个线框图，我们可能会考虑按照以下代码所示的方式构建界面：\n\n```html\n<template>\n\
  \  <layout-component>\n    <header-component :title=\"title\" />\n    <hero-component\n\
  \      :image=\"image\"\n      :call-to-action-text=\"ctaText\"\n    />\n    <description-component>\n\
  \      <p>This is some description text</p>\n    </description-component>\n  </layout-component>\n\
  </template>\n\n<script>\nimport LayoutComponent from '@/components/layout/LayoutComponent.vue'\n\
  import {HeaderComponent, HeroComponent} from '@/components/layout/GeneralComponents.vue'\n\
  import DescriptionComponent from '@/components/text/DescriptionComponent.vue'\n\n\
  export default {\n  components: {\n    HeaderComponent,\n    HeroComponent,\n  \
  \  LayoutComponent,\n    DescriptionComponent\n  },\n  data() {\n    return {\n\
  \      title: 'Some title',\n      image: 'image.png',\n      ctaText: 'Some action\
  \ text'\n    }\n  }\n}\n</script>\n```\n\n如你所见，组件定义了属性并拥有子元素，就像普通的 HTML 一样。这正是 `Vue`\
  \ 中的模板变得如此灵活且强大的原因；它只是你已经熟悉的内容的扩展。\n\n### 理解数据流\n\n你构建的大多数组件都需要提供数据才能有效地渲染。虽然显然有例外，但通常情况下，一个只渲染静态\
  \ HTML 的组件用处不大。\n\n这意味着几乎所有内容都需要某种数据或状态。虽然每个组件通常维护自己的内部状态，但更常见的做法是父组件将每个子组件所需的状态传递给它们。这种“单向”数据流允许构建一个简单的、响应式的组件系统；如果父组件中的数据发生变化，它将级联传递给所有需要它的子组件，正如上一章过的，这将产生更小的\
  \ diff。请看下面的图：\n\n![Diagram Description automatically generated](img/figure_5.2.png)\n\
  \n**图 5.2：从父组件到子组件的数据流**\n\n图 5.2 显示了从父子的简单数据流，但如果需要父组件提供数据的组件嵌套得很深，这可能会变得繁琐且容易出错。在这种情况下，`Vue`\
  \ 有一种 `provide/inject` 机制，它是 `Composition API` 的一部分。\n\n使用 `Providers` 和 `Injectors`\
  \ 时，父组件被标记了其允许提供的数据，子组件被标记了其允许接收的数据。\n\n下面的图演示了这一功能：\n\n![Diagram Description automatically\
  \ generated](img/figure_5.3.png)\n\n**图 5.3：Provide 和 Inject，父组件定义提供什么，子组件定义它接收什么**\n\
  \n使用 `provide/inject` 有一个小的注意事项。该机制默认不是响应式的，这意味着当父组件中的数据发生变化时，它不会自动更新任何依赖于该变化数据的子组件。\n\
  \n为了让 `provide/inject` 属性具有响应式（如果这是此的话），则需要将提供的数据放在响应式包装器中，使用 `ref()`、`reactive()`、`computed()`\
  \ 或类似的方法；参考下面的代码示例：\n\n```html\n<template>\n  <parent-component>\n    ...\n  </parent-component>\n\
  </template>\n\n<script>\nexport default {\n  data () {\n    return {\n      item1:\
  \ 'data_point'\n    }\n  },\n  provide () {\n    return {\n      data_point: ref(this.item1)\n\
  \    }\n  }\n}\n</script>\n```\n\n单向数据流并不意味着子组件不能影响父组件的状态，但机制是不同的：它涉及向上传递的事件。事件\
  \ API 提供了许多标准修饰符，可以用于影响事件的处理方式，这对应于你可能想要做的典型操作：阻止传播、触发一次或阻止默认。还有其他几个修饰符，但这三个是最常用的。其他的事件和键修饰符可以在\
  \ [`v3.vuejs.org/guide/events.html#event-modifiers`](https://v3.vuejs.org/guide/events.html#event-modifiers)\
  \ 找到。\n\n下面的图片显示了组件如何发射和处理事件：\n\n![](img/figure_5.4.png)\n\n**图 5.4：子组件发射由父组件处理的事件**\n\
  \n我们将在第 11 章“使用事件与 UI 交互”中深入讨论事件。\n\n### 设计组件\n\n组件的定义是灵活的。组件可以根据其设计旨在完成的任务足够小或足够大。通常，一个组件只处理界面中的一个元素或一组相关的交互。\n\
  \n组件的范围范围因此的大小由你作为架构师来决定。设计过程的一部分是确保你的组件足够小、灵活、可复用且可测试，并具有良好且易于使用的接口，而不会笨肿、过大或功能过载。\n\
  \n### 函数式组件\n\n函数式组件（FCs）之于组件就像 JavaScript 中的箭头函数之于普通函数；它们是精简的、轻量级版本，功能受到限制。\n\n\
  函数式组件与普通组件的区别在于，它们主要不持有或维护自己的状态——它们没有组件实例，并跳过了组件生命周期，类似于箭头函数，没有 `this` 实例或自己的作用域（以及其他其他点）。\n\
  \n\n\n创建一个函数式组件相对简单，你不需要使用配置对象（Options API 或 Composition API），而是使用一个简单的普通函数，该函数接收两个参数：`props`\
  \ 和 `context`；如下所示。`context` 对象提供了三个会被注入的属性：`attrs`、`emit` 和 `slots`；这些等同于普通组件对应的\
  \ `$attrs`、`$emit` 和 `$slots`。\n\n```javascript\n// simple type\n// render function\
  \ body\nconst functionalComponent = (props, ctx) => {\n\n}\n\n// using destructing\n\
  const functionalComponent = (props, {attrs, emit, slots}) => {\n  // render function\
  \ body\n}\n```\n\n在这种情况下，你正在创建一个只包含一个 `render()` 函数的组件。\n\n如果你想定义 `FC` 接收的 `props`\
  \ 或 `FC` 触发的事件，可以通过如下方式将它们作为属性来实现：\n\n```javascript\n// simple type\nconst functionalComponent\
  \ = (props, {emits}) => {\n  // render function body\n}\nfunctionalComponent.props\
  \ = {\n  prop1: String,\n  prop2: {\n    type: Boolean,\n    default: false\n  }\n\
  }\nfunctionalComponent.emits = ['customEvent']\n```\n\n如果你没有定义 `props`，那么你的 `FC`\
  \ 将接收到相同的 `props` 和 `attrs` 对象，但这些对象不会经过验证，且属性名称也不会转换为驼峰命名（就像在普通组件中预期的那样）。\n\n`FCs`\
  \ 可以在任何可以使用普通组件的地方使用，但要求所有数据和事件都从持有它的父组件传递：\n\n```html\n<template>\n  <functional-component\
  \ prop1=\"String\" :prop2=\"false\" />\n</template>\n\n<script>\nimport FunctionalComponent\
  \ from '@//compontents/functional/FunctionalComponent.js'\nexport default {\n  name:\
  \ 'StandardComponent',\n  components: { FunctionalComponent }\n}\n</script>\n```\n\
  \n掌握了这些信息后，我们准备好开始研究一个设计，并思考如何使用组件将其拆解，然后确定组合这些组件的最佳方式，以构建一个功能性的 Web 应用程序。让我们接下来开始吧。\n\
  \n### 作为组件集的示例应用程序\n\n为了设计一个 Web 应用程序，我们需要一个项目——你工作的网络代理公司接到了一快速增长的披萨外公司 Speedy\
  \ Pizza 的请求，要求他们为新的销售门户制作原型，因为他们目前的门户已经老旧且运行缓慢。他们想要更好的东西，并为代理公司提供了一个待构建的设计方案。\n\n\
  这是一个纯虚构的名字，与任何名称此名的公司（无论真实与）的关联纯属巧合。\n\n正如你从图中看到的，这是一个相当的设计，包含几个页面。\n\n#### 落地页\n\
  \n这是一个简单的落地页，带有顶部菜单、主视觉区域（hero section）、一些“热门优惠”以及进入菜单和账户部分的入口。\n\n## 设计\n\n该页面有四个主要部分：顶部菜单和页脚，这两者实际上都应该是网站布局的一部分（我们稍后会将它们提取出来）；主视觉区域；以及优惠部分，它包含多个优惠。\n\
  \n如下图所示：\n\n![包含文本、食物、菜肴描述的自动生成图片](img/figure_5.5.png)\n\n图 5.5：客户为示例网站设计的原型方案\n\
  \n#### 线框（Wireframe）\n\n从组件的角度来看，这个线框可以被拆分为一小组简单的组件，如下图所示：\n\n![用户界面、应用程序描述的自动生成图像](img/figure_5.6.png)\n\
  \n图 5.6：显示如何将设计拆分为线框\n\n这里的层次结构相当扁平：唯一的父子关系是 `OfferComponent` 和 `OffersComponent`，即使这也不复杂。\n\
  \n#### 建议的组件\n\n由于为组件使用语义化命名是合理的，我们将组件名称与之前已经使用的术语匹配。因此，落地页需要以下内容：\n\n*   `MenuBarComponent`：包含顶部菜单元素和子组件。\n\
  *   `HeroComponent`：处理主视觉组件。\n*   `OffersComponent`：展示 Speedy Pizza 想在落地页向访问者强调的优惠/活动。由于\
  \ `OffersComponent` 是所有 `OfferComponents` 的父组件，它将持有显示所有优惠所需的数据，并仅向每个子组件传递所需的数据。\n\
  *   `OfferComponent`：包含单个优惠详情的组件，包括一个行动号召按钮（call-to-action button）。\n*   `FooterComponent`：持有适用于页脚的信息。\n\
  \n#### 列表/菜单页\n\n这是我们将处理的内部页面；它是所有可用披萨类型的简单列表。起初，你将与静态列表一起，但在本书后面我们讨论从服务器获取数据时，我们会考虑将其切换。\n\
  \n处理此页面将使我们有机会提取在布局方面跨站保持一致的页面部分。此时，引入路由器也是一个好主意。\n\n## 设计\n\n此页面将简单地列出所有可用项目。该设计中的某些功能部分将留到稍后处理。这样做是为了让它们能与构成购物车的数据结构集成。\n\
  \n#### 线框\n\n如前所述，该页面实际上是一个列表；下所示线框突出了这一点：\n\n![](img/figure_5.7.png)\n\n图 5.7：列表页线框\n\
  \n#### 建议的组件\n\n页面的主体由单个组件 `ItemListingComponent` 组成，它持有所有的 `ItemComponents`，因此我们还将构建布局文件和组件。可以说，这可以在第一个页面完成，但在这里做更合理。此外，我们将添加一些基础路由。\n\
  \n*   `MainLayoutComponent`：该组件将持有我们已经构建的用于处理布局的 `HeaderComponent` 和 `FooterComponents`。布局文件还将持有\
  \ `SideBarComponent`。\n*   `SideBarComponent`：持有订单和其他辅助信息。\n*   `SmallListComponent`：购物车中所有项目的高级列表，并具有增加/减少/删除项目的功能。\n\
  *   `SmallCartPriceComponent`：由于购物车将持有价格信息，告知用户需要多少钱是合理的，但这可以只是一个函数式组件。\n*   `NavigateCheckoutComponent`：该组件处理两个操作：第一个是完全清除购物车（取消链接），另一个是导航到购物车、识别用户是否登录并路由到相关的结算入口点。\n\
  *   `ItemListingComponent`：它是 `ItemComponents` 的父组件，因此将持有显示项目所需的所有数据。\n*   `ItemComponent`：每个独立的列表组件，每个组件将成为\
  \ `ImageComponent` 和 `AddCartComponent` 的父组件。\n*   `ImageComponent`：持有图片的函数式组件。\n\
  *   `AddCartComponent`：用于管理对购物车的更改。\n\n\n\n\n\n# 商品详情页\n\n这将是单品详情页，与其它电子商务网站的类似页面保持一致。它将包含所选披萨的图片、一些详情和定价信息，以及加入购物车的选项。客户还希望包含一组推荐和可用优惠。\n\
  \n## 设计\n\n我们在这里将几个组件组合在一起，用于实际选定的商品，其中一些将是功能性组件：专门用于图像和标签页主体元素。我们还将复用定价和订单组件。\n\
  \n## 线框图\n\n这里的线框图重用了许多已经构建的组件；其中一些来自布局，另一些来自其他页面。这就是使用组件构建 UI 的强大和吸引之处；我们现在拥有一套可重用的工具包，可以以新颖且的方式将其整合。参见下图：\n\
  \n![](img/figure_5.8.png)\n\n图 5.8：单品线框图\n\n这里有一些新组件，但与我们构建的其他组件相比，它们非常简单。\n\n##\
  \ 建议组件\n\n除了已经讨论过的组件外，此页面还需要 `ProductDescriptionComponent`，这是一个由标签栏和多个标签内容组成的组件。我们将将其构建为一组小型功能性组件，由父组件负责跟踪应该显示哪个标签页。\n\
  \n## 结算页面\n\n这将是一个标准的结算页，列出当前购物车中的所有物品。还有一个弹窗用于收集送货信息，以及用户是应用程序的访客，还是想从其账户将订单交付到替代地址。\n\
  \n## 设计\n\n该设计旨在清晰地显示放入购物车的物品，包括任何请求的特殊订单/更改、每个项目的当前价格以及订单的总额。用户还具有添加额外信息以及编辑数量或删除物品的能力。这些都是预期的接受功能。\n\
  \n## 线框图\n\n此页面上的组件大部分是新的。有几个是复用的，即 `ImageComponent` 和 `SmallCartPriceComponent`，还有几个与我们已经构建的其他组件非常相似，但由于它们需要封装不同的功能，因此使用独立的组件来处理这些功能更有意义。\n\
  \n下图没有标记我们已经讨论过的布局元素：\n\n![图形用户界面 自动生成](img/figure_5.9.png)\n\n图 5.9：结算页线框图\n\n\
  当点击 `PlaceOrderComponent` 中的订单按钮时，响应将是两种情况之一：\n\n1. 用户是新用户或尚未登录，因此我们显示一个弹窗让他们登录、创建账户，或者提供他们作为访客用户下单的选择。一旦收集了这些信息，用户就可以进入支付环节。弹窗线框图所示：\n\
  \n   ![](img/figure_5.10.png)\n\n   图 5.10：带有登录弹窗的结算\n\n2. 用户已登录账户，因此默认送货数据已可用，用户可以直接进入支付环节，我们选择使用\
  \ Stripe。请参考 图 5.11：\n\n   ![](img/figure_5.11.png)\n\n   图 5.11：Stripe 支付弹窗线框图\n\
  \n## 建议组件\n\n以下是上述设计所需的组件列表：\n\n*   `OrderItemListComponent`: 这是 `OrderItemComponents`\
  \ 的父组件。\n*   `OrderItemComponent`: 这些子组件是 `ImageComponent`、`ManageOrderComponent`\
  \ 以及订单中每行包含的相关文本数据的混合。\n*   `ManageOrderComponent`: 这与 `AddCartComponent` 类似，但允许删除物品并显示行价格。\n\
  *   `PlaceOrderComponent`: 根据用户的登录状态，它要么完全清空购物车，要么将用户引导到下一步。参见接下来的两幅图。\n*   `CartAddressComponent`:\
  \ 此组件将在可用时持有送货地址详情，如果不可则允许编辑。\n*   `ApplyVoucherToCartComponent`: 此组件接收与可能的优惠码相关的数据。它用于动态检查代码是否有效（包括格式和内容），然后将其应用于购物车并相应更新显示。\n\
  *   `ModalComponent`: 这是一个标准的弹窗组件，通过插接受多个内部内容。\n*   `LoginComponent`: 收集并管理用户登录数据或收集访客结算数据。\n\
  *   `StripePaymentComponent`: 用于处理 Stripe 支付网关的封装组件。\n\n# 登录与注册页面\n\n这些是标准的登录和注册页面。这里没有任何争议。\n\
  \n## 设计\n\n线框图展示了这些页面有多简单。由于基于组件的特性，构成表单的元素被提取到单独的组件中，以便在其他地方复用。\n\n## 线框图\n\n如前所述，这些页面由极少数组件构建而成。参见\
  \ 图 5.12：\n\n![](img/figure_12.png)\n\n图 5.12：登录页线框图\n\n从结构上说，登录和创建账户页面是相似的。除了 `MainLayoutComponent`，\
  \ de 有一个包装组件以及所需的功能。\n\n下图显示了创建账户的线框图，其呈现方式同样极简主义：\n\n![图形用户界面 自动生成](img/figure_5.13.png)\n\
  \n图 5.13：创建账户线框图\n\n## 建议组件\n\n以下是上述设计所需的组件列表：\n\n*   `UserWrapperComponent`: 这是一个简单的包装组件，接受信息和组件引用，以便为两个页面创建相同的布局。\n\
  *   `LoginComponent`: 登录组件之前已讨论过并在此处复用。\n*   `RegisterComponent`: 这与 `LoginComponent`\
  \ 类似，但形成向服务器的消息以便使用户注册账户。\n\n# 订单页面\n\n此页面是用户下单的所有订单的简单摘要，并可以选择重新订购完全相同的选择。\n\n\
  ## 设计\n\n这将是一个简单的网格，如 图 5.14 中的线框图所示，显示账户中之前的订单；这是一个简单的便利设计功能，直接将数据带到用户的结算页。\n\n\
  ## 线框图\n\n线框是一个卡片列表，保存了描述之前订单的数据。\n\n![图形用户界面 自动生成](img/figure_5.14.png)\n\n图 5.14：之前的订单摘要页线框图\n\
  \n## 建议组件\n\n以下是上述设计所需的组件列表：\n\n*   `OrderGridComponent`: 这仅仅是一个提供相关数据的父组件；你现在应该熟悉这种模式了。\n\
  *   `OrderCardComponent`: 这些是每个数据库条目的个别显示组件。卡片中的按钮用于告诉应用程序根据数据构建新购物车并引导用户直接进入结算。\n\
  \n### 结语\n\n\n\n\n这是一个极具野心的构建示例，但它处理的是真实世界的工作。在构建此 UI 和处理所有事件方面，始终有不同的方法与我们在这里的方法不同；某些方法可能更适合不同的用例，但这是构建此特定示例应用的一种逻辑方式。\n\
  \n## 结论\n\n在本章中，我们学习了 `Vue.js` 组件的不同部分，并理解了它们在组件内部以及跨组件层级之间是如何相互关联的。\n\n我们还深入研究了如何让组件相互通信（至少在非常基础的水平），以及如何处理用户事件。\n\
  \n最后，我们探索了如何将组件组合在一起形成复杂的组件，并完成了一个示例应用。在该应用中，我们应用这些知识来帮助将设计拆解为各个组成部分，从而提供一个简单的框架，以便在其之上构建所需的视图。\n\
  \n本章主要侧重于使用 `Options API` 构建组件；下一章将描述如何使用 `Composition API`。这两个 API 都是构建组件的有效形式，需要结合探索。\n\
  \n## 记忆点\n\n- `Options API` 组件由三个部分组成：Script（脚本）、Template（模板）和 Style（样式）。这些部分都是可选的。\n\
  - 如果需要对组件模板的渲染进行严格控制，可以使用渲染函数（render function）。这是通过封装 `h()` 函数实现的。\n- `h()` 函数是所有\
  \ `Vue.js` 模板渲染的基础；这里没有魔法。\n- 当不需要管理内部状态的组件时，可以并且应该使用函数组件（Functional components）。\n\
  - 组件可以由其他组件组成，虽然很少见，也可以是递归的。\n- 将设计拆分为组件不需要复杂。组件应该管理单一关注点，或者作为多个关注点的脚手架，但绝不要两者兼顾。\n\
  - 只有事件可以处理用户输入或操作。事件可以是 HTML DOM 事件，如 `onClick` 或 `onChange`。事件也可以是自定义；这些类型的事件用于在父组件之间传递数据。\n\
  - 深层组件结构应该使用 `provide/inject` 机制来帮助组件父级向子组件提供数据。\n\n### 核心术语\n\n- Template section（模板部分）\n\
  - Script section（脚本部分）\n- Style section（样式部分）\n- Props（属性）\n- Render function（渲染函数）\n\
  - Functional component（函数组件）\n- Events（事件）\n\n### 加入我们书籍的 Discord 空间\n\n加入书籍的 Discord\
