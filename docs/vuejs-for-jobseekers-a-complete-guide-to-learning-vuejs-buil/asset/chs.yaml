  14. `const v$ = useVuelidate(rules, { validationCode }, { $externalResults });`\n\
  \n```javascript\nasync function submitValidationCode() {\n  const formValid = await\
  \ v$.value.$validate();\n  if (!formValid) return;\n  const resp = await validateVoucherCode(validationCode.value)\n\
  \  $externalResults.value = resp?.errors;\n}\n\nasync function validateVoucherCode(code:\
  \ string): Promise<Record<string, string[]>> {\n  return { errors: [] };\n}\n```\n\
  \n# 第 13 章 使用 Pinia 管理状态与 API 通信 (contents.xhtml_ch13)\n\n## 言\n\n将优惠券或折扣码应用于购物车，需要外部服务来验证所提供的代码是否有效，然后将该信息传递给购物车，以确保为客户应用正确的定价。\n\
  \n这将需要使用 `$externalResults` 配置设置并访问相关的 API。\n\n首先，这里是模板的重要部分：\n（为了简洁，省略了模板代码）\n\n\
  以下是脚本部分的更改：\n（为了简洁，省略了脚本代码）\n\n## 结论\n\n将优惠券或折扣码应用于购物车，需要外部服务来验证所提供的代码是否有效，然后将该信息传递给购物车，以确保为客户应用正确的定价。\n\
  \n这将需要使用 `$externalResults` 配置设置并访问相关的 API。\n\n## 结构\n\n随着应用程序的增长，需要在许多组件之间维持一致的状态变得很有必要；此外，数据可能来自后端服务器。\n\
  \n本章将涵盖以下主题：\n\n* 在 Vue 中管理状态\n* Pinia 存储简介\n* 与 Pinia 协作\n* 从组件中使用 Fetch API\n\
  * 将 Axios 集成到应用程序中\n* 基于 GraphQL 的 API 访问\n\n## 目标\n\n在许多情况下，对于中小型应用程序，将你的应用程序状态维护在\
  \ Composables（组合式函数）中可能就足够了。然而，将许多 Composables 导入组件可能是很麻烦的，虽然这不会增加包的大小，但会增加你作为开发者的认知负担，试图记住哪些数据来自应用程序的哪个部分。\n\
  \n## 关键术语\n\n* v-model\n* 验证\n* 表单\n* 表单控件\n* 值绑定\n* 用户\n\n## 注意事项\n\n* 表单可以是你需要的任何形式。\n\
  * 验证总是必要的。\n* 表单可以从以下内容构建\n\n\n\n\n\n\nPinia 允许你在一个地方定义状态（state）以及访问和操作这些状态的方法。它还提供了低级\
  \ API，在必要时允许完全的扩展。\n\n你可以根据个人偏好或应用边界创建任意数量的 store（仓库），取决于哪种方式最适合你。Store 可以进行组合，这给人一种嵌套的印象，尽管\
  \ store 被设计为扁平结构。\n\n所有这些特性结合在一起，让你作为开发者在处理应用程序状态方面拥有极大的灵活性和威力。\n\n# Pinia store\
  \ 简介\n\n添加和设置 Pinia 相对简单：\n\n要安装，只需使用 NPM 即可：\n\n```bash\nnpm i pinia\n```\n\n要使用\
  \ Pinia，你需要让你的应用程序知道它，首先创建一个 `Pinia` 实例，然后通过 `.use()` 将添加到应用中。\n\n在你的 `main.js`/`ts`\
  \ 文件中，按照下方列表第 2、5 和 8 行所示添加代码：\n\n```javascript\nimport { createApp } from 'vue'\n\
  import { createPinia } from 'pinia'\nimport App from './App.vue'\n\nconst pinia\
  \ = createPinia()\nconst app = createApp(App)\n\napp.use(pinia)\napp.mount('#app')\n\
  ```\n\n有了这些模板代码，我们就可以开始定义我们的 store 了。\n\n此此的最佳方法（尽管这取决于个人偏好）是在 `src/` 文件夹下创建一个 `stores`\
  \ 文件夹，与应用程序的所有其他代码并列。\n\n在该文件夹（`src/stores/`）内部，为你需要的每个 store 放置一个文件。这些文件通常根据功能边界创建，例如管理用户账户数据；购买数据或购物车；设置或偏好数据；任何你需要或设计文档中详细说明的内容。\n\
  \n每一个文件都包含一个 `defineStore` 函数，示例如下：\n\n```javascript\nimport { defineStore } from\
  \ 'pinia'\nexport const useStore = defineStore('store', () => {\n  // 在此处定义 store\
  \ state, actions 和 getters\n})\n```\n\n在创建单个 store 时，有几种不同的语法可以使用。它们分别称为 Option\
  \ stores（选项式 store）和 Setup stores（组合式 store），这镜像了应用程序构建的方式，即作为 Options API 或 Composition\
  \ API 组件。虽然没有必要专门为 Options API 创建 Options Stores 而为 Composition API 创建 Setup Stores，但保持代码的一致性可以为团队中的所有成员以及任何后续人员提供便利。同样，这取决于个人偏好或可用设计。这两种不同类型将在后面详细介绍。\n\
  \n到目前为止，我们讨论了 store 中不同的元素，但还没有详细说明它们具体是什么。\n\n一个 store 由标记为 `state` 的数据组成。该状态是可以公开访问的，但实际上它应该被视为\
  \ store 的私有，通过 `getters` 读取状态，通过 `actions` 更改状态。直接访问 `state` 无论多么诱人，都可能导致复杂问题。本质上，Pinia\
  \ store 是全局的，因此保持一点纪律永远无害处。\n\n首先，我们将讨论创建 store 的两种方法，然后我们将讨论组成 store 的每个部分的具体细节。\n\
  \n# Option Store 类型定义\n\n要将 store 定义为 Option Store 类型，你需要定义一个具有唯一名称 store 和一个包含以下三个键的对象：`state`\
  \ – 存储在 store 中的数据，`getters` – 用于访问 store 中数据的计算属性，以及 `actions` – 用于更改 store 中存储数据的方法，如下所示：\n\
  \n```javascript\nimport { defineStore } from 'pinia'\nexport const useNameStore\
  \ = defineStore('name', {\n  state: () => ({ name: 'Anon' }),\n  getters: {\n  \
  \  getName: (state) => state.name,\n    getUppercaseName: (state) => state.name.toUppercase(),\n\
  \  },\n  actions: {\n    updateName(name) {\n      this.name = name\n    }\n  }\n\
  })\n```\n\n上述列表中的任何内容都不应该理解。\n\n以这种方式创建 store 实际上看起来非常直观。\n\n# Setup Store 定义\n\n\
  如果你需要更灵活的特性，你需要使用 Setup store，因为它允许你使用组合式函数（Composables）。创建一个 Setup store，不是向 `defineStore`\
  \ 函数提供一个对象，而是提供一个函数，如下：\n\n```javascript\nimport { ref, computed } from 'vue'\n\
  import { defineStore } from 'pinia'\nexport const useNameStore = defineStore('name',\
  \ () => {\n  const name = ref('Anon')\n  const getName = computed(() => name.value)\n\
  \  const getUppercaseName = computed(() => name.value.toUppercase())\n  function\
  \ updateName(newName) {\n    name.value = newName\n  }\n  return { name, getName,\
  \ getUppercaseName, updateName }\n})\n```\n\n使用 Setup 时适用以下规则：\n- `ref()` 是 state\n\
  - `computed()` 值是 getters\n- `function()` 值是 actions\n\n### State\n\n当使用 TypeScript\
  \ 时，没有没有提供类型，但对作者有帮助。对作者而言，这是一种代码风格。以下是一个实现这一点的示例：\n\n```typescript\nimport { defineStore\
  \ } from 'pinia'\nexport enum HobbyType {\n  Art = \"ART\",\n  Creative = \"CREATIVE\"\
  ,\n  Design = \"DESIGN\",\n  Build = \"BUILD\"\n}\n\ninterface HobbyInfo {\n  name:\
  \ string;\n  age: number;\n  hobbies: HobbyType[];\n}\n\ninterface State {\n  name:\
  \ string | null;\n  age: number | null;\n  hobbies: HobbyInfo[];\n}\n\nexport const\
  \ useHobbyStore = defineStore('hobbies', {\n  state(): State => {\n    return {\n\
  \      name: null,\n      age: null,\n      hobbies: []\n    }\n  }\n})\n```\n\n\
  还有另一种方法为 store 中的数据创建接口，但这涉及对每个 state 进行逐个类型定义。直接访问（即同时读取和写入）store 的状态是默认行为。store\
  \ 中的所有数据都是公开的。更多细节请见下文：\n\n```vue\n<script setup=\"ts\">\n// 使用之前定义的 nameStore\n\
  import { useNameStore } from '/path/to/store'\n\nconst store = useNameStore()\n\n\
  // 直接读取 store\nconsole.log(store.name)\n\n// 直接访问更新 store 属性\nstore.name = 'new\
  \ name'\n\n// 使用 $patch 方法变异 store 数据\nstore.$patch({ name: 'patched name' })\n\n\
  // 不可能，因为在 name store 中未定义\nstore.age = 10\n</script>\n```\n\n上一个列表使用了 `$patch`\
  \ 方法。该方法允许我们原子地对 store 应用多次或复杂的更改。\n\n同时更改多个状态属性是通过传递一个部分状态对象来实现的。这只是包含 state 中定义的某些或全部属性的对象，其值为要更改该属性的值。\n\
  \n复杂或计算密集型操作（例如通过 push、remove 或 splice 修改集合，并返回新集合），可以通过提供给 `$patch()` 的函数来实现，该函数接收\
  \ store 状态作为参数。如何实现这一点在示例中详细所示：\n\n```vue\n<script setup=\"ts\">\n// 使用之前定义的 hobbiesStore\n\
  import { usePersonHobbyStore, HobbyType } from '/path/to/store'\n</script>\n```\n\
  \n\n\n\n\n```javascript\nconst store = usePersonHobbyStore()\n\nstore.$patch((state)\
  \ => {\n  state.hobbies.push({ name: 'a new hobby', type: HobbyType.Art })\n  state.age\
  \ = 12\n})\n</script>\n```\n\n需要记住的一点是，`Pinia` store 持有的状态是响应式的，因此不能被直接替换；只能进行补丁（patch）。\n\
  \n提示：如果你需要为整个应用程序设置初始状态，可以通过以下方式更改基础 `Pinia` 实例的状态来完成：\n\n```javascript\npinia.state.value\
  \ = {}\n```\n\n除了 `$patch()` 之外，store 还提供了以下方法：\n\n-   $dispose()`：从 `Pinia` 注册表中移除该\
  \ store\n-   $onAction()`：接受一个回调函数，该回调会在任何 action 执行之前被调用，并可以设置在 action 完成或发生错误时调用的回调\n\
  -   $reset()`：将 store 重置为初始状态\n-   $subscribe()`：接受一个回调函数，在状态发生变化时都会调用；在一次 patch\
  \ 完成后，订阅只会触发一次，而 `watch()` 则每次都会触发；除非在定义中传递了 `{ detached: true }` 选项，否则在运行它的组件卸载时，订阅会自动清理\n\
  \n### Getters\n\nGetters 的设计用于在 store 中对应组件的计算属性。\n\nGetter 是一个同步操作，它接收单个参数：当前状态。由于\
  \ getter 是计算属性，它们不会接受任何其他参数；由于其性质，getter 的返回值会被应用程序缓存，并且仅在 store 的值改变时才会更新。\n\n\
  此处的示例将展示两种可用的语法，以便你判断哪种更适合你自己在工作中使用：\n\n#### 1. Setup Store 语法\n\n```javascript\n\
  export const useCookieStore = defineStore('cookieStore', () => {\n  const numberInBatch:\
  \ Ref<number> = ref(5)\n  const isWarm: Ref<boolean> = ref(true)\n  // Getters\n\
  \  const currentTotalInBatch = computed(() => numberInBatch.value)\n  const isBatchFresh\
  \ = computed(() => isWarm.value)\n  return { //返回对象 }\n})\n```\n\n#### 2. Options\
  \ Store 语法\n\n```javascript\nexport const useCookieStore = defineStore('cookieStore',\
  \ {\n  state: () => ({\n    numberInBatch: 5,\n    isWarm: true\n  }),\n  getters:\
  \ {\n    currentTotalInBatch: (state) => state.numberInBatch,\n    isBatchFresh:\
  \ (state) => state.isWarm\n  }\n})\n```\n\n如果你发现自己需要向 getter 传递额外数据，可以通过返回一个函数并在调用时接收这些值来\
  \ get，如下所示：\n\n#### 1. Setup Store 语法\n\n```javascript\nexport const useCookieStore\
  \ = defineStore('cookieStore', () => {\n  ...\n  const totalCookies: Ref<number>\
  \ = ref(50)\n  // Getters\n  const totalBoxed = computed(() => (numberOfBoxes: number)\
  \ => Math.floor(totalCookies.value / (numberOfBoxes * numberInBatch.value)))\n \
  \ return { //返回对象 }\n})\n```\n\n#### 2. Options Store 语法\n\n```javascript\nexport\
  \ const useCookieStore = defineStore('cookieStore', {\n  state: () => ({\n    ...\n\
  \    totalCookies\n  },\n  getters: {\n    ...\n    totalBoxed: (state) : number\
  \ =>\n    (numberOfBoxes: number) =>\n    Math.floor(state.totalCookies / (numberOfBoxes\
  \ * state.numberInBatch))\n  }\n})\n```\n\n注意：通常缓存的是 getter 本身而非 getter 的结果。当你使用它们来接收额外值时，它们将不再被缓存；它们仅仅会被调用，这可能会引入性能问题。在这种情况下，通过在\
  \ getter 体中计算任何中间结果而不是在返回的函数中计算，是有意义的（即性能更高）。\n\n最后，getter 本身是可以组合的。单个 getter 可以访问其本地\
  \ store 中提供的所有其他 getter（通过 `this` 变量），并且可以通过导入访问应用程序中其他 store 提供的任何 getter：\n\n\
  #### 1. Setup Store 语法\n\n```javascript\nexport const useCookieStore = defineStore('cookieStore',\
  \ () => {\n  // 状态数据\n  ...\n  // 虽然不需要返回类型，但这是一个良好的实践\n  const bakeMoreCookies:\
  \ ComputedRef<boolean> = computed(\n    () => !isBatchFresh()\n  )\n})\n```\n\n\
  #### 2. Options Store 语法\n\n```javascript\nexport const useCookieStore = defineStore('cookieStore',\
  \ {\n  state: () => ({\n    // 状态数据\n  }),\n  getters: {\n    ...\n    bakeMoreCookies(state):\
  \ boolean {\n      return !this.isBatchFresh()\n    }\n  }\n})\n```\n注意：当基于其他 getter\
  \ 的返回值定义 getter 时，使用 TypeScript 的一个注意事项是你需要提供返回类型。\n\n### Actions\n\n我们已经看到 getters\
  \ 是 store 的计算值；这使得 actions 成为 store 方法。像 getters 一样，actions 可以通过 `this` 整个 store，但与\
  \ getters 不同，它们可以接收任意数量的参数并且可以是异步的：\n\n#### Setup Store 语法\n\n```javascript\nexport\
  \ const useCookieStore = defineStore('cookieStore', () => {\n  // 状态数据\n  ...\n\
  \  // ... actions actions\n  bake() {\n    if (totalCookies.value < 10) {\n    \
  \  // 确保有足够的 50\n      totalCookies.value += 50 - totalCookies.value\n    }\n  }\n\
  \  async getMenu() {\n    // ... 其他处理\n    menu.value = await api.get()\n  }\n \
  \ return { // ... }\n})\n```\n\n### Options Store 语法\n\n```javascript\nexport const\
  \ useCookieStore = defineStore('cookieStore', {\n  state: () => ({\n    ...\n  \
  \  menu: [] as MenuItem[]\n  }),\n  actions: {\n    // ...\n    bake() {\n     \
  \ if (this.totalCookies < 10) {\n        // 确保有足够的 50\n        this.totalCookies\
  \ += 50 - this.totalCookies\n      }\n    },\n    async getMenu() {\n      // ...\
  \ 其他处理\n      this.menu = await api.get()\n    }\n  }\n})\n```\nActions 必要时可以使用\
  \ getters 获取 store 值，但 getters 不应该依赖于任何 actions；它们应该是无副作用的（即纯函数）。副作用需要由 action 发起，任何结果都需要那里进行处理。\n\
  \n#### 使用 Pinia Store\n\n使用 Pinia store 就像使用任何其他组合式（composables）一样。由于 store 中定义的任何属性在\
  \ Options store 中都是公开的，或者如果从 Setup store 返回则是可以响应式访问的，可以直接访问它们：\n\n#### 使用上述 useCookieStore\
  \ - 组合式 API 组件\n\n```javascript\n<script setup lang=\"ts\">\nimport { useCookieStore\
  \ } from 'cookieStore'\nimport { storeToRefs } from 'pinia'\nconst store = useCookieStore()\n\
  // 直接访问 store 状态因为它被包装在 reactive 中\nstore.totalCookies = 100\nstore.numberInBatch\
  \ = 10\n\n// 使用 storeToRefs 解构状态属性和 getter\n// 否则响应式会丢失\nconst { totalCookies, numberInBatch\
  \ } = storeToRefs(store)\n\ntotalCookies = 200\n</script>\n```\n\n#### Options API\
  \ 组件 - 无 setup()\n\n```javascript\n<script lang=\"ts\">\nimport { mapState } from\
  \ 'pinia'\nimport { useCookieStore } from 'cookieStore'\n</script>\n```\n\n\n\n\n\
  \n```javascript\nexport default {\n  computed: {\n    // 当不使用 setup(), mapState()\
  \ 和/或 mapWriteableState() 辅助函数时\n    // 可以访问 store 状态数据\n    ...mapState(useCookieStore,\
  \ ['totalCookies', 'numberInBatch']),\n    haveFresh(store) {\n      // 可以同时访问 'this'\
  \ 和 store\n      return this.totalCookies > 0 && store.isWarm\n    }\n  }\n}\n```\n\
  </script>\n\n// Options API 组件 - 使用 setup()\n<script lang=\"ts\">\nimport { mapState\
  \ } from 'pinia'\nimport { useCookieStore } from 'cookieStore'\n\nexport default\
  \ {\n  setup() {\n    const store = useCookieStore()\n    return { store }\n  },\n\
  \  computed: {\n    haveFresh(store) {\n      // 通过 'this' 访问 store\n      return\
  \ this.store.totalCookies > 0 && this.store.isWarm\n    }\n  }\n}\n</script>\n```\n\
  \n正如前面提到的，尽管对 store 状态的访问是公开的，但应该将其视为私有的，并且应该通过 getters 和 actions 进行访问。这样一来，对状态的更改是可以被控制的，因为可能会被页面上的多个组件查看/访问。从技术角度上说，你正在改变一个全局可观测单例对象的状态，而意外、不受控制的更改是设计不当、甚至是开发规范性较差的表现。\n\
  \n组件订阅 store 的状态可能是有益的。这样，订阅代码在执行补丁（patched）时只会触发一次；而使用 `watch()` 则会在每个状态属性改变时触发更改事件。下面的示例演示了这一点：\n\
  \n### Composition API 组件\n\n```javascript\n<script setup lang=\"ts\">\nimport {\
  \ useCookieStore } from 'cookieStore'\nconst store = useCookieStore()\n\nstore.$subscribe((mutation,\
  \ state) => {\n  // const { type, storeId, payload } = mutation\n  // type => 'direct'\
  \ | 'patch object' | 'patch function'\n  // storeId => 被修改的 store 的 $id\n  // 即\
  \ cookieStore\n  // payload => 补丁对象\n  // (仅当 type 为 'patch object' 时使用)\n  // state\
  \ => 更改后 store 的完整状态\n  <在此处处理状态变化>\n}, { options object })\n</script>\n```\n\n\
  访问 store 的 getters 与访问状态属性是相同的。\n\n下面的示例演示了组件使用 store 的三种不同方式；每种方式取决于组件的构建：\n\n\
  #### 1. Composition API 组件\n\n```javascript\n<script setup lang=\"ts\">\nimport\
  \ { useCookieStore } from 'cookieStore'\nconst store = useCookieStore()\nconsole.log(store.currentTotalInBatch)\
  \ // 5\n</script>\n```\n\n#### 2. Options API 组件 - 不使用 setup()\n\n```javascript\n\
  <script lang=\"ts\">\nimport { mapState } from 'pinia'\nimport { useCookieStore\
  \ } from 'cookieStore'\n\nexport default {\n  computed: {\n    // 访问 getters 与访问状态相同\n\
  \    ...mapState(useCookieStore, [...])\n  }\n}\n</script>\n```\n\n#### 3. Options\
  \ API 组件 - 使用 setup()\n\n```javascript\n<script lang=\"ts\">\nimport { useCookieStore\
  \ } from 'cookieStore'\n\nexport default {\n  setup() {\n    const store = useCookieStore()\n\
  \    return { store }\n  },\n  computed: {\n    // 访问 getters 与访问状态相同\n    doubleCookies()\
  \ {\n      return this.store.totalCookies * 2\n    }\n  }\n}\n</script>\n```\n\n\
  尽管访问机制是相同的，但使用 getters 访问状态比重复访问状态更高效；计算属性会被 Vue 缓存。类似地，触发 store 的 actions 只是在 store\
  \ 上调用函数并传递任何数据的情况。如果需要，也可以从 store 中解构 actions。最后，如果在使用不带 `setup()` 生命周期周期的 Options\
  \ API 组件中使用，你需要使用 `mapActions()` 辅助函数将 actions 提取到组件的方法中。\n\n下面的代码展示了这三种方法：\n\n\
  ### API 组件\n\n```javascript\n<script setup lang=\"ts\">\nimport { useCookieStore\
  \ } from 'cookieStore'\nconst store = useCookieStore()\n// actions 可以被解构\nconst\
  \ { processOrder } = store\n// 或者可以直接在 store 上调用\nstore.processOrder({...orderDetails})\n\
  </script>\n```\n\n### Options API 组件 - 不使用 setup()\n\n```javascript\n<script lang=\"\
  ts\">\nimport { mapActions } from 'pinia'\nimport { useCookieStore } from 'cookieStore'\n\
  \nexport default {\n  methods: {\n    // 通过 mapActions 辅助函数访问 actions\n    ...mapActions(useCookieStore,\
  \ ['processOrder'])\n  }\n}\n</script>\n```\n\n### Options API 组件 - 使用 setup()\n\
  \n```javascript\n<script lang=\"ts\">\nimport { useCookieStore } from 'cookieStore'\n\
  \nexport default {\n  setup() {\n    const store = useCookieStore()\n    return\
  \ { store }\n  },\n  methods: {\n    // 访问 getters 的方式与访问状态完全相同...\n    buyNow()\
  \ {\n      this.store.processOrder({...orderDetails})\n    }\n  }\n}\n</script>\n\
  ```\n\n此外，可以使用 store 实例提供的 `$onAction()` 函数对 actions 进行观察并触发回调，见下文：\n\n```javascript\n\
  import { useCookieStore } from 'cookieStore'\nconst store = useCookieStore()\n\n\
  const func = store.$onAction(params => {\n  // const { name, store, args, after,\
  \ onError } = params\n  // name => action 名称\n  // store => store 实例\n  // args\
  \ => 以数组形式传递给 action 的参数\n  // after => action 完成后调用的回调\n  // onError => action\
  \ 报错时调用的回调\n  <在 action 执行前执行的功能>\n}, <boolean?>)\n```\n\noptions 对象允许你传入一个布尔值，以将订阅从组件实例中分离，否则该功能将在组件卸载时被移除。这与\
  \ `$subscribe()` 处理状态变化的方式类似。\n\n### 使用 Fetch API 与服务器通信\n\n没有任何 Web 应用程序是孤立运行的。所有应用程序（即使是最小的）都会依赖来自外部源的数据，无论是由你控制的服务或\
  \ API，还是第三方服务。无论如何，你的应用程序都需要通过获取或发送数据来与该服务进行交互。\n\nJS 生态系统中有很多库可以促进这种通信，但在 Vue 生态系统中，通常有两种被认可的库来实现这种操作：`Fetch\
  \ API` 和 `Axios`。使用哪种库与远程 API 交互并不重要，如果要在 Pinia 的异步 action 中使用，它需要返回一个 `Promise`。由于这些交互\
  \ API 的库通常都是异步的，因此这不应该是问题。\n\n在组件中使用 `Fetch API` 非常简单。下面的示例将 `fetch` 的调用封装在一个函数中，以便于复用和错误处理，但也可以在顶层使用它，按需为生命周期的任何部分获取数据：\n\
  \n```javascript\n<script lang=\"ts\">\nimport { onUpdated, onBeforeMounted, ref,\
  \ Ref } from 'vue'\nconst data: Ref<DataType> = ref({})\n\nasync function getData()\
  \ {\n  try {\n    const response = await fetch('API-endpoint')\n    data.value =\
  \ await response.json()\n  } catch (err) {\n    // 处理错误\n  }\n}\n\n// 在组件挂载之前以及\n\
  // 组件更新时获取数据\nonBeforeMounted(() => { getData() }) \nonUpdated(() => { getData()\
  \ })\n</script>\n```\n\n\n\n然而，在专业环境中，通常不是这样创建这些交互的。大多数情况下，会创建一个接口层，或者更有可能是在 `Vue`\
  \ 中创建一个组合式函数（composable），这样只需要编写一次即可在整个应用程序中复用。实现这一点在很大程度上是一个组织架构问题。实现这一点的一种方法是使用\
  \ `VueUse` 提供的 `useFetch` 组合式函数，它拥有功能齐全且经过测试的 API：\n\n```typescript\n<script setup\
  \ lang=\"ts\">\nimport { useFetch } from '@vueuse/core'\n...\nconst data: Ref<DataType>\
  \ = ref({})\nconst { responseData } = await useFetch('API-endpoint')\ndata.value\
  \ = await responseData\n</script>\n```\n\n## 将 Axios 集成应用程序](#contents.xhtml_sc2_301a)\n\
  \n传统上，`Vue` 应用与 API 交互的默认库一直是 `Axios`。随着 `Fetch` API 或其他现代库的出现，它不再是该领域的唯一库，但它仍然是访问远程\
  \ API 最流行的方式。\n\n通过 `Vue`、组合式 API 和 `VueUse`，现在在组件级别使用 `Axios` 就像在上一个示例中展示 `Fetch`\
  \ API 一样简单。同样，使用此功能的最佳方法是将其提取到可复用的函数中，以便在整个应用程序中保持使用的一致。\n\n使用 `Axios` 和 `Fetch`\
  \ API 之间存在细微差异。首先，需要安装 `axios` 包，因为它是一个第三方包。这通过通常的 `NPM` 或 `Yarn` 方式完成。\n\n```bash\n\
  $ npm i axios\n```\n\n然后，在你的应用程序代码库中某个方便的位置创建一个文件（例如 `src/composables/useRemote.ts`）：\n\
  \n```typescript\nimport axios from 'axios'\nimport { useAxios } from '@vueuse/integrations/useAxios'\n\
  const instance = axios.create({\n  baseURL: 'API-endpoint',\n  ...\n})\nexport async\
  \ function get(url, params = {}) {\n  const { execute } = useAxios(url, instance)\n\
  \  return await execute(params)\n}\n```\n\n与所有的第三方集成一样，阅读附文档是有价值的。\n\n从这里开始，你应该能够看到如何轻松地将远程数据获取集成或组合到你的本地状态存储中。在伪代码层面，你告诉存储执行一个操作，该操作反过来从远程获取数据并更新应用程序状态。从那里，你只需要获取驱动组件所需的状态。`Vue`\
  \ 通过 `Pinia`、`VueUse`、`Suspense` 和过渡动画使这在很大程度上变得透明。\n\n## 基于 GraphQL 的 API 访问](#contents.xhtml_sc2_302a)\n\
  \n使用 `GraphQL` 端点比仅仅发送远程 API 获取请求要复杂一点。使用 `GraphQL` 的便利性体现在开发时间上的前期投入，但一旦数据定义、查询和变更调用到位，访问和理解从\
  \ API 接收到的数据在很大程度上就变得透明了。\n\n如果你不了解 `GraphQL`，可以在 [`graphql.org/learn/`](https://graphql.org/learn/)\
  \ 找到一份优秀的入门指南，因为我们在这里不会详细介绍基础知识。然而，读者应该理解，责任在于消费者仅需定义运行应用程序所需的数据，而 API 的责任是提供跨数据集的访问权限，但仅提供请求的内容。API\
  \ 消费者与提供服务之间的关系在某种程度上是反转的。基本思想通过减少请求时发送的数据包大小来减少数据表面，因为消费者决定需要哪些数据，而不是发送所有数据。\n\n\
  制作 `GraphQL` 请求的通常方法是通过 `Apollo`。`Apollo` 提供了等式的两个部分：处理请求的服务器端（这不在本书的范围内）以及一个接收参数并根据已知定义接收和分解响应的客户端。\n\
  \n在 `Vue` 应用中使用 `GraphQL`，你需要引入一些额外的依赖：\n\n* `Apollo Client` (`@apollo/client`)\n\
  * 来自 `Vue` 的 `Apollo-Composable` (`@vue/apollo-composable`)\n* `GraphQL` (`graphql`)\n\
  * `GraphQL-Tag` (`graphql-tag`)\n\n你需要做的第一件事是让 `Vue` 实例提供 `Apollo` 客户端；关于此操作的逐步说明可以在\
  \ [`v4.apollo.vuejs.org/guide/installation.html`](https://v4.apollo.vuejs.org/guide/installation.html)\
  \ 查看。\n\n你可以将通过 `Fetch` API 或 `Axios` 的组件远程 API 调用直接放在组件的 setup 中，但不应该这样做；你也可以通过\
  \ `@vue/apollo-composable` 包对 `GraphQL` 请求执行同样的操作。这里是一个简单的示例：\n\n```html\n<template>\n\
  \  <div>\n    <p>{{ templateData }}</p>\n    <button @click=\"refetch()\">Update\
  \ Template</button>\n  </div>\n</template>\n\n<script setup>\nimport { useQuery\
  \ } from '@vue/apollo-composable'\nimport gql from 'graphql-tag'\nimport { computed,\
  \ watch } from 'vue'\n\nconst { result, refetch } = useQuery(gql`\n  query getResult($param:\
  \ Type) {\n    returnData($param) {\n      id\n    }\n  }\n`, {})\n\nwatch(() =>\
  \ { console.log(result) })\nconst templateData = computed(() => result.value?.id\
  \ ?? '')\n</script>\n```\n\n\n\n\n到为止，我们只讨论了如何构建应用程序。然而，这只是开发者工作的一部分。在本章中，我们将简要介绍如何测试应用程序的部分，以确保其功能符合预期。这是一个相对宽泛但深度较浅的章节。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n* 测试的益处\n* 测试的类型以及使用的工具\n* 在 Vue 项目中添加测试\n* 测试组件\n* 测试事件\n\
  * 测试可组合函数 (composables)\n* 测试 Pinia 和路由\n* 使用 Nightwatch 进行端到端 (E2E) 测试\n\n## 目标\n\
  \n本章将介绍测试的基础知识。测试本身是一个非常重要的课题，内容多到可以写好几本书，因此这将是一个关于如何为你的应用程序添加测试覆盖率的高级视角，并足以让你开始上手。\n\
  \n我们将简要介绍组件、事件、路由和 Pinia action 的测试（以及扩展出的可组合函数测试），最后，我们将介绍端到端测试。\n\n## 测试的益处\n\n\
  软件测试是软件开发周期中不可或缺的一部分。无论你的团队遵循 TDD、BDD 还是其他表示测试实践的缩写，无论你的测试是在开发后编写的，这并不重要。重点在于任何编写的代码都需要测试。作为一名专业的开发者，你被期望能够充分地测试你的代码。\n\
  \n除了雇主对软件正确性和用户需求的期望外，你还需要提供高质量、可靠且易于理解的代码。在某些环境中，测试被用作活跃的项目文档。\n\n在此处有几点需要注意的微调：\n\
  \n* 即使测试覆盖了应用程序代码，也不意味着该代码执行了预期操作、满足了用户需求或得到了充分的保护。在开发（或审查）测试时，请确保处理了边界情况（edge cases），并确保功能产生了预期的结果。\n\
  \n* 拥有 100% 的测试覆盖率并不总是代码库健康的标志。除非你的应用程序处理的是人的健康或金钱，否则编写测试的收益会递减，且可能不需要 100% 的覆盖。请确保核心功能被覆盖，并确保你的每个组件的外部接口至少有一些测试覆盖；这对于大多数\
  \ Web 应用程序来说足够了。我们在这里并不主张固定的百分比覆盖率；这是一个包含许多因素的组织决策。\n\n在编写测试时，你不仅在确保代码在功能和质量方面符合预期标准，还在帮助下一个接触代码的人，或者帮助未来的你记住这些事物是如何运作的：这被称为“活跃文档”（living\
  \ documentation）。在实践中，在进行任何代码更改之前，应该运行测试以确保代码按预期执行；当代码更新时，测试也需要更新，以反映新功能。\n\n##\
  \ 测试的类型以及使用的工具\n\n测试根据它们与代码的接近程度以及测试覆盖的整体范围进行分类。\n\n本节涵盖了工作中的开发者通常遇到的测试，以及 Vue.js\
  \ 及更广泛的 JS/TS 生态系统中可用的一些测试工具。用于测试代码的工具众多，而空间有限，因此我们将介绍使用 `Vitest`（配合 `VitestUI`）、`Testing-library/vue`、`Istanbul`\
  \ 和 `Nightwatch`。我们将在下方的“在 Vue 项目中添加测试”中介绍添加这些包及其配置。\n\n### 单元测试\n\n离代码最近且测试单个单元的测试被称为单元测试，这些测试通常覆盖非常小的功能、一个函数或一个小型组件，或者范围有限的代码。\n\
  \n单元测试应该是短小且易于理解的。它们应该只测试代码的一个方面，以便多个测试覆盖同一段代码。理想情况下，每个代码单元至少应该有两个单元测试：一个正向地执行代码；它测试代码单元的输出是否以正确的格式返回预期数据；另一个则衡量预期的失败或错误输出。这这是一条指南。编写测试是为了证明代码按预期方式工作，并确保在发生意外情况时它的行为表现正常。\n\
  \n当使用基于组件的框架（如 Vue.js）构建应用程序时，根据你的定义，代码单元可以是一个组件或一个可组合函数（composable）。然而，取决于组件的范围，它可能是功能的一部分。在某些情况下，测试组件可能被视为集成测试，这取决于视角问题。\n\
  \n在本书中，单元测试将使用 `Vitest` 创建，这是一个与 `Jest` 具有相同语义的新型框架。建议在新的项目中使用 `Vitest` 而非 `Jest`，只有在你已经基于\
  \ `Jest` 构建了测试套件时才使用 `Jest`。这些并不是你拥有的唯一选项，但它们是最可能被使用的选项。\n\n### 组件/集成测试\n\n集成测试用于确保你的组件按预期协同工作。正如前面提到的，取决于定义，集成测试可能还会涵盖单个功能。\n\
  \n组件测试必须涵盖 `props`、`events`、`slots`、`styles`、`classes` 和 `hooks`。这意味着你必须衡量提供预期信息时发生了什么，以及在未提供这些信息时发生了什么。\n\
  \n每个组件都应该有自己的测试，理想情况下放在它自己的测试文件中。这样，你就可以避免需要模拟（mock）子组件。这些测试应该确保组件按照预期方式交互，就像用户与它们交互一样。再次，你关注的是公共接口，并对功能的作用和性能感兴趣；那不是测试的关注点。这样，实现方式可能会改变，但测量的输出保持不变。\n\
  \n关于集成测试的建议包括使用 `Vitest` 配合 `@testing-library/vue`（我们将在本书中使用的设置）或 `Cypress` 组件测试。这两种方法都有优缺点，而我们倾向于速度而非范围。请参考以下链接获取更多详情：\n\
  \nhttps://vuejs.org/guide/scaling-up/testing.html#component-testing\n\n### 端到端测试\n\
  \n端到端 (E2E) 测试旨在模拟用户未竟尚未完成的整个历程，例如浏览网站、选择产品、成功或失败完成支付，以及注册和账户注册。这些测试的一个共同点是它们必须镜像用户的行为，因此必须通过浏览器执行任务。对于非简单的任务，创建和运行\
  \ E2E 测试在执行时间和开发工作方面通常是非常昂贵的。然而，E2E 测试可以捕捉单元和组件测试无法捕捉的问题，例如网络中断、状态管理失败、数据库故障、资源丢失等。\n\
  \n由于由于，E2E 测试通常在独立的分阶段环境中执行，该环境尽可能地模拟生产或部署环境，因此，它是作为持续集成或持续部署流水线的一部分，在代码发布到外界之前的最后安全网。\n\
  \n\n\n\n要为 Vue.js 项目添加测试，你必须包含相关的包，包括测试运行器/测试框架、代码覆盖工具以及端到端测试包。虽然并非所有组织都重视 e2e 测试并选择其他类型的用户测试，但了解行业内使用的工具是有价值的。\n\
  \n## 添加 Vitest 和 VitestUI\n\n首先要添加的是 Vitest，它的安装方式与其他任何 NPM 包完全一样：\n\n```bash\n\
  npm i -D vitest @vitest/ui jsdom\n```\n\n安装完成后后，你必须提供一个配置文件来定义你期望测试运行器如何工作。这将会是你配置大部分测试环境的地方。虽然有许多选项供你探索，但你需要在应用程序根目录下创建一个\
  \ `vitest.config.ts`，它与 `tsconfig.js`、`package.json` 和 `vite.config.ts` 文件并列。\n\n\
  该文件的内容如下：\n\n```typescript\nimport { defineConfig } from 'vitest/config'\nimport\
  \ Vue from '@vitejs/plugin-vue'\n\nexport default defineConfig({\n  plugins: [Vue()],\n\
  \  test: {}\n})\n```\n\n此文件设置了默认配置；没有覆盖配置。\n\n在 `test` 对象中添加以下内容：\n\n```typescript\n\
  test: {\n  globals: true,\n  environment: 'jsdom',\n  ...\n}\n```\n\n这允许我们针对模板代码运行测试，因为默认环境是\
  \ node。\n\n现在你可以在 `package.json` 文件中添加一些脚本定义来处理测试运行。更新 `scripts` 部分包含以下内容：\n\n```json\n\
  ...,\n  \"scripts\": {\n    ...,\n    \"test\": \"vitest dev\",\n    \"test-ui\"\
  : \"vitest --ui\",\n    \"coverage\": \"vitest --coverage\",\n  },\n...\n```\n\n\
  我们在这里添加了覆盖率行，接下来将进行添加。\n\n## 添加 Istanbul 代码覆盖提供程序\n\n向应用程序设置中添加 Istanbul 有两种方法。简单的方法将其添加到配置中，然后让测试运行器在需要时安装它。\n\
  \n更新 `vitest.config.ts` 文件，在 `test` 部分添加以下内容：\n\n```typescript\ntest: {\n  ...\n\
  \  coverage: {\n    provider: 'istanbul',\n    reporter: ['html']\n  },\n  ...\n\
  }\n```\n\n当你第一次调用覆盖率脚本（`npm run coverage`）时，测试运行器将查找并安装相关包。我们在这里只添加了 HTML reporter，但根据需要添加其他的。\n\
  \n要手动安装 Istanbul，你需要执行以下操作：\n\n```bash\nnpm i -D @vitest/coverage-istanbul\n```\n\
  \n为了测试组件，我们将进行挂载（mount），本质上是创建一个测试脚手架，允许我们隔离测试组件。接下来我们将安装它。\n\n## 使用 @testing-library/vue\
  \ 进行组件挂载\n\n通过在终端运行以下命令完成安装（并配置）：\n\n```bash\nnpm i -D @testing-library/vue\n```\n\
  \n我们最后添加的是 Nightwatch，以便进行端到端测试。\n\n## 添加 Nightwatch\n\n熟悉 Vue2 的人可能也熟悉 Nightwatch，因为它是使用\
  \ Vue CLI 创建项目时的默认工具；在写作期间，Nightwatch 与 Cypress 竞争这一领域。添加 Cypress 的内容在 Vitest 文档中有，而\
  \ Nightwatch 则没有。\n\n第一步是安装相关依赖，通过以下命令完成：\n\n```bash\nnpm init nightwatch\n```\n\
  \n该脚本会询问几个问题，相应的答案顺序如下：\n\n* y\n* End-to-end testing\n* Either JS/default or TS/default\n\
  * Any 你喜欢的浏览器\n* e2e-tests\n* http://localhost:9000\n* On localhost\n* Your preference\n\
  * 你的 preference\n\n这将为你创建一个包含所有相关配置设置的 `nightwatch.conf.js` 文件。\n\n我们需要修改项目根目录下的此\
  \ `nightwatch.conf.js` 文件，添加以下内容：\n\n```javascript\nmodule.exports = {\n  plugins:\
  \ ['vite-plugin-nightwatch']\n}\n```\n\n我们还需要告诉 Vite 我们正在使用该插件，并使用以下内容修改 `vite.config.js`\
  \ 文件：\n\n```javascript\nimport { defineConfig } from 'vite'\nimport nightwatchPlugin\
  \ from 'vite-plugin-nightwatch'\n\nexport default defineConfig({\n  plugins: [\n\
  \    // ... 其他插件，如 vue() 或 react()\n    nightwatchPlugin({\n      componentType:\
  \ 'vue'\n    })\n  ]\n})\n```\n\n为了测试这一切是否正常工作，运行 Nightwatch 提供的以下测试脚本：\n\n```bash\n\
  npx nightwatch ./nightwatch/examples/basic/ecosia.js\n```\n\n如果有成功响应，说明 Nightwatch\
  \ 已安装并正常工作。你现在可以更新 `package.json` 添加相关脚本。\n\n## 测试组件\n\n测试组件需要组件在测试治架中挂载（通常是隔离的），这样就可以方便地控制输入并测量输出。我们将使用的测试脚架由\
  \ Vue Testing Library 提供，它拥有功能齐全 API，你将最频繁地使用 `render()` 函数。该函数在内存中生成组件 DOM 和相关的子组件，以便我们注入\
  \ props 并断言返回的输出是正确的。\n\n`render()` 函数提供了一组查询，你可以对返回的组件 DOM 使用它们以帮助检查，我们稍后会讨论。`render`\
  \ 函数还提供了对 DOM 的访问。\n\n\n\n\n\n在这里，我们正在寻找某些包含菜单的文本，并期望这些文本包含在一个 `HTMLButtonElement`\
  \ 中，且其 CSS 类列表包含 `red-button`。我们现在不是在测试按钮是否执行了导航，但我们会在编写 E2E 测试时进行该测试。\n\n在终端上运行\
  \ `npm run test`，你应该能看到类似下面的输出：\n\n1. ✓ tests/components/pages/site/landing-page/hero-component.test.js\
  \ (1)\n3. Test Files 1 passed (1)\n4. Tests 1 passed (1)\n5. Start at 21:45:59\n\
  6. Duration 2.52s (transform 1.09s, setup 0ms, collect 1.07s, tests 30ms)\n9. PASS\
  \ Waiting for file changes...\n10. press h to show help, press q to quit\n\n`npm`\
  \ 脚本运行测试并设置一个监听器，当测试发生变化时重新运行测试套件，这样你每次都能获得反馈。\n\n如果你退出此并转而运行 `test-ui` 脚本（`npm\
  \ run test-ui`），你将启动 Vitest UI，它提供了更多信息并允许你探索更多关于测试的细节。\n\n如果你将以下内容放入 `offer-component.test.js`\
  \ 文件并保存，`VitestUI` 将随最新的测试信息进行更新。正如你可能看出的，`VitestUI` 是构建测试结构的一项非常有用的工具。考虑以下代码：\n\
  \n```javascript\nimport { render } from '@testing-library/vue'\nimport OfferComponent\
  \ from 'src/components/pages/site/landing-page/OfferComponent.vue'\n\ndescribe('OfferComponent',\
  \ () => {\n  test('should render', async () => {\n    const { getByTestId } = await\
  \ render(OfferComponent, {\n      props: { id: 1, text: 'Test', image: 'image.png'\
  \ }\n    })\n    const component = getByTestId('offer')\n    expect(component).toBeInstanceOf(HTMLElement)\n\
  \  })\n  test('should have a red button', async () => {\n    const { getByText }\
  \ = await render(OfferComponent, {\n      props: { id: 1, text: 'Test', image: 'image.png'\
  \ }\n    })\n    const component = getByText(/Test/)\n    expect(component).toBeInstanceOf(HTMLButtonElement)\n\
  \  })\n  test('should render a received image', async () => {\n    const { html\
  \ } = await render(OfferComponent, {\n      props: { id: 1, text: 'Test', image:\
  \ 'image.png' }\n    })\n    const componentHTML = html()\n    expect(componentHTML).toContain('image.png')\n\
  \  })\n})\n```\n\n更改后的测试代码将导致 `VitestUI` 输出的变化，如图 14.2 所示：\n\n![自动生成的文本描述](img/Figure_14.2.jpg)\n\
  \n图 14.2：更改测试后 VitestUI 的输出\n\n这里的测试只是冰山一角；你仍然组件测试方面仍有大量工作要做。到目前为止，我们只查看了模板测试，还没有触及组件触发事件。我们将在下一节中介绍这部分。\n\
  \n### 测试事件\n\n至少在使用测试库时，事件测试与你测试组件的方式非常相似。你会在测试功能是否正确渲染的同时，尝试组件事件。\n\n要进行事件测试，请从\
  \ `testing-library/vue` 导入 `fireEvent` 方法。查看下面的代码示例了解如何操作。\n\n在原则上，你将使用 `render()`\
  \ 创建被测对象，找到绑定了事件的元素，触发事件并检查结果。这些事件主要将连接到表单控件、按钮、链接、列表和表格。这不是详尽的列表，因为事件可以绑定到任何组件。\n\
  \n文档中包含了一个简单的示例，它涵盖了一个标准的计数器示例，其逻辑大致如下：\n\n```javascript\nimport Counter from './counter.vue';\n\
  import { render, fireEvent } from '@testing-library/vue';\n\ndescribe('Counter',\
  \ () => {\n  it('should increment value', async () => {\n    const { getByText }\
  \ = render(Counter, { props: { initialValue: 0 } })\n    getByText('0') // 隐式断言\n\
  \    const btn = getByText('increment')\n    await fireEvent.click(btn)\n    getByText('1')\n\
  \  })\n})\n```\n\n`fireEvent` 方法重新导出了在链接中详细说明的所有事件：`https://github.com/testing-library/dom-testing-library/blob/src/event-map.js`。该列表包含了所有的事件：`click`；`change`；`touch`；`mouseover/up/down/enter`；`drag/drop\
  \ events`；`cut/paste` 等。花些时间查看该列表是值得的。\n\n在许多方面，测试库断言事件执行了预期的操作，至少在组件层面就像组件测试一样简单。考虑以下代码：\n\
  \n```javascript\nimport AddToCart from '/src/AddToCartComponent.vue'\nimport { render,\
  \ fireEvent } from '@testing-library/vue'\n\ndescribe('AddToCartComponent', () =>\
  \ {\n  it('should increment a counter', async () => {\n    const { getByTestId,\
  \ getByText, getLabelText } = render(AddToCart, {\n      props: {\n        id: 1,\n\
  \        image: 'image.png',\n        description: 'this is a description',\n  \
  \      name: 'test1',\n        price: 23.99,\n      },\n    })\n    const incButton\
  \ = getByTestId('incrementButton')\n    const decButton = getByTestId('decrementButton')\n\
  \    const outputControl = getLabelText(/itemcount/i)\n    getByText(/23.99/)\n\
  \    getByText('Add to Cart')\n    expect(outputControl.value).toBe('1')\n    await\
  \ fireEvent.click(incButton)\n    expect(outputControl.value).toBe('2')\n    await\
  \ fireEvent.click(decButton)\n    expect(outputControl.value).toBe('1')\n  })\n\
  })\n```\n\n接下来，我们需要确保发射事件的组件会影响父组件的状态并提供数据。我们通过 `emitted()` 函数来实现这一点，如下所示：\n\n```javascript\n\
  import CheckoutPageComponent from '../../../../../components/pages/site/checkout-page/CheckoutPage.vue'\n\
  import { render, fireEvent } from '@testing-library/vue'\n\ndescribe('CheckoutPage',\
  \ () => {\n  it('should emit a updateCartoucherCode event', async () => {\n    const\
  \ { getLabelText, emitted, getByText } = render(CheckoutPageComponent)\n    const\
  \ testCode = 'voucherCode'\n    await fireEvent.update(getByLabelText('Voucher Code'),\
  \ testCode)\n    await fireEvent.click(getByText('Apply'))\n    expect(emitted().updateCartoucherCode).toBeTruthy()\n\
  \    expect(emitted().updateCartoucherCode.length).toBe(1)\n    expect(emitted().updateCartoucherCode[0]).toEqual([testCode])\n\
  \  })\n})\n```\n\n\n\n\n\nVitest 开箱即用了我们许多所需的工具，编写单元测试与编写组件测试没有太大区别。唯一的区别在于组合式函数（composable）没有被挂载（渲染）。\n\
  \n让我们来看一些简单的例子。恰好，我们在 `useCart` 中有一个非常优秀的组合式函数，它包含了一些我们可以测试的逻辑和函数。\n\n### 初始设置\n\
  让我们从设置开始。我们将检查是否可以获取购物车，并确保在首次初始化时它是空的：\n\n```typescript\nimport { useCart } from\
  \ '../../src/composables/useCart.ts'\n\ndescribe('useCart', () => {\n  it('should\
  \ return an empty cart on initialisation', () => {\n    const { getCart } = useCart()\n\
  \    const cart = getCart()\n    expect(cart.value).toHaveProperty('items')\n  \
  \  expect(cart.value.items.length).toBe(0)\n  })\n})\n```\n\n非常简单，获取购物车，检查内容，并确保它们的长度为\
  \ 0。\n\n### 操作购物车内容\n接下来，我们必须确保可以通过添加（仅限 `CartItems`）和移除项目来操作购物车的内容。考虑以下代码：\n\n\
  ```typescript\nit('should allow you to add and remove items', () => {\n  const testItem\
  \ = {\n    id: 1, name: 'test item', qty: 1, price: 10.0\n  }\n  const { addItem,\
  \ removeItem, getCart } = useCart()\n  addItem(testItem)\n  expect(getCart().value.items).not.toHaveLength(0)\n\
  \  expect(getCart().value.items).toHaveLength(1)\n  removeItem(1)\n  expect(getCart().value.items).toHaveLength(0)\n\
  })\n```\n\n然而，考虑一种我们尝试添加 `CartItem` 以外内容的情况，我们的 IDE 可能会友好地对此报错，如下：\n\n```typescript\n\
  it('should not accept non-CartItem contents', () => {\n  const { addItem, getCart\
  \ } = useCart()\n  const cart = addItem(1)\n  expect(getCart().value.items).toHaveLength(0)\n\
  })\n```\n\n我们目前对 `addItem()` 函数的实现未能通过测试。尽管 `1` 不是 `CartItem`，但在 JavaScript 层面它仍然被接受了。我们在这里遇到的是\
  \ JavaScript 在类型方面的动态性。我们必须更新被测试的组合式函数的代码以通过测试。\n\n为了实现这一点，我们将为购物车添加一个类型守卫函数（type\
  \ guard），并更新 `addItem` 函数以使用它，尽管我们可以忽略错误数据。我们将让函数抛出异常；我们只期望 `CartItems`，因此任何其他内容都意味着问题。考虑以下代码：\n\
  \n```typescript\nfunction isCartItem(item: any): item is CartItem {\n  if ((item\
  \ as CartItem).id) {\n    return true\n  }\n  return false\n}\n\nfunction addItem(item:\
  \ CartItem): Cart {\n  if (isCartItem(item)) {\n    cart.value.items.push(item);\n\
  \    return cart;\n  }\n  throw new Error(\"Requires a CartItem to be supplied\"\
  )\n}\n```\n\n重新运行测试仍然失败，但这是正确的。测试没有检查错误响应，所以我们也必须更新它。\n\n```typescript\nit('should\
  \ not accept non-CartItem contents', () => {\n  const { addItem } = useCart()\n\
  \  expect(() => addItem(1)).toThrowError(/incorrect type/i)\n})\n```\n\n通过这个测试，我们已经考虑了在发送错误类型时预期会产生错误的情况。\n\
  \n### 更新购物车\n下一个测试涵盖了更新购物车。从代码角度来看，预期是购物车的内容被更新，内部的项目项目列表被替换。这遵循函数式编程模型，即进行数据转换而不是就地修改。测试类似于下面的代码：\n\
  \n```typescript\nit('should allow you to update the cart items', () => {\n  const\
  \ testItem = { id: 1, name: 'test item', qty: 1, price: 10.0 }\n  const { addItem,\
  \ updateCart, getCart } = useCart()\n  addItem(testItem)\n  expect(getCart().value.items).toHaveLength(1)\n\
  \  const newItem = { ...testItem, qty: 2 }\n  const newCart = updateCart([newItem])\n\
  \  expect(newCart.value.items).toHaveLength(1)\n  expect(newCart.value.items[0].qty).toBe(2)\n\
  \  // 不传递值将重置购物车\n  updateCart()\n  expect(getCart().value.items).toHaveLength(0)\n\
  })\n```\n\n### 计算属性\n最后，购物车的一车的计算属性应该被视为标准。我们将测试这些属性：\n\n```typescript\nit('should\
  \ compute totals across the cart', () => {\n  const { subtotal, tax, delivery, total\
  \ } = useCart()\n  const testItems = [\n    { id: 1, name: 'test item', qty: 1,\
  \ price: 10.0 },\n    { id: 2, name: 'test item', qty: 1, price: 5.0 },\n    { id:\
  \ 3, name: 'test item', qty: 2, price: 17.99 }\n  ]\n  updateCart(testItems)\n \
  \ expect(subtotal.value).toBe(50)\n  expect(tax.value).toBe(10)\n  expect(delivery.value).toBe(5)\n\
  \  expect(total.value).toBe(66)\n})\n```\n\n\n\n\n\n```javascript\nconst store =\
  \ useUserAccountStore()\n\nconst { queryAllByText } = render(component)\n\nexpect(store.getOrderSubtotal(1)).toBe(5)\n\
  expect(store.getOrderSubtotal(2)).toBe(105)\nexpect(store.getOrderTotal(1)).toBe(12)\n\
  expect(queryAllByText(/^test item 1$/)).toHaveLength(2)\n```\n\n在这里，我们正在创建一个包含一些初始数据的测试实例，并确保这些数据在\
  \ store 中可用可用。由于测试实例默认会存根（stub）动作，因此我们传递了 `(stubActions)` 开关来关闭该功能；随后我们查看渲染的内容，以检查它是否渲染了预期的范围。到目前为止，我们只编写了通过的用例。作为你的练习，请编写一些衡量失败机制的测试（你可能需要修改\
  \ store 代码来处理失败情况）。如果你打算在多个测试中使用相同的 store 设置，那么将设置放在 `beforeEach()` 句柄中将是很有划算的。\n\
  \nPinia 测试实例还有更多内容可以涵盖。阅读 Pinia 测试文档是一个好主意：\n\n`https://pinia.vuejs.org/cookbook/testing.html`\n\
  \n## VueRouter\n\n路由测试是通过在抽象模式下创建路由器，然后将其传递到 `render` 函数的选项对象完成的。使用抽象模式的路由器可以防止路由存储导航更改的默认行为。初始化程序通常被抽象成辅助函数，以便在需要的地方使用。考虑以下代码：\n\
  \n```javascript\nimport { render } from '@testing-library/vue'\nimport { createRouter,\
  \ createWebHistory } from 'vue-router'\n\nexport async function renderWithRouter(component,\
  \ routes, renderOptions) {\n  const router = new VueRouter({\n    history: createWebHistory(),\n\
  \    routes\n  })\n  const result = render(component, {\n    ...renderOptions,\n\
  \    global: { plugins: [router]},\n  })\n  await router.push('/')\n  return result\n\
  }\n```\n\n此实用函数允许你管理测试中使用的路由器。第 6 行持有抽象模式设置。第 15 行的 `router.push()` 是至关重要的，因为初始栈是空的，这会创建一个初始状态值。\n\
  \n该函数随后被作为测试库提供的 `render()` 函数的替代品。然而，组件之间的导航处理是通过异步处理程序完成的。考虑以下代码：\n\n```javascript\n\
  import { render, waitFor, fireEvent } from '@testing-library/vue'\n...\nimport App\
  \ from '/src/App.vue'\nimport { renderWithRouter } from './render-with-router.js'\n\
  \ndescribe('Landing page navigation', () => {\n  it('should navigate', async ()\
  \ => {\n    const { queryByText, getByText } = await renderWithRouter(App, [\n \
  \     ... routes array ...\n    ])\n    const menuButton = await getByText('View\
  \ Our Menu')\n    await fireEvent.click(menuButton)\n    await waitFor(() => {\n\
  \      expect(window.location.href).toContain('/menu')\n    })\n    await queryByText(/Menu\\\
  sPage/i)\n  })\n})\n```\n\n要使此成功工作，你需要渲染一个带有 `<router-view>` 的组件，并包裹了你想要导航的组件；否则，路由无法发生。\n\
  \n完成之后，你可以看到通过简单的用户导航测试单个组件之间的路由是多么简单。下一节将涵盖跨应用程序的用户旅程，并讨论端到端测试。\n\n## 使用 Nightwatch\
  \ 进行 E2E 测试\n\n使用 Nightwatch 编写端到端测试与我们为此应用程序构建其他类型测试非常相似。\n\n然而，存在细微的。请记住你正在像用户一样通过活动应用程序运行点击路径。为了做到这一点，你必须初始化一个浏览器实例并将其指向入口\
  \ URI。浏览器实例提供的流式接口随后被用于创建用户流，像用户一样导航应用程序，并对用户在页面上应该看到进行断言，并模拟用户交互和 UI 响应。\n\n通常，e2e\
  \ 旅程涵盖以下内容：\n\n*   登录过程和导航到注册用户专属资源\n*   注册过程\n*   产品购买过程，也称为\n\n作为入门，请检查以下：\n\n\
  ```javascript\ndescribe('Create a test', () => {\n  before((browser) => {\n    browser.navigateTo('http://localhost:9000/')\n\
  \  })\n\n  it('should navigate', (browser) => {\n    browser.assert.visible('h1')\n\
  \    browser.assert.textContains('body', 'View Our Menu')\n    browser.click('button[type=button]')\n\
  \    browser.assert.visible('input[name=itemCount]')\n    browser.setValue('input[name=itemCount]',\
  \ 2)\n    browser.click('button[type=button]')\n  })\n\n  after((browser) => {\n\
  \    browser.end()\n  })\n})\n```\n\n\n\n\n\n* 使用 Nuxt 创建项目并管理依赖\n* 构建 Nuxt 应用程序的客户端\n\
  * 管理状态和跨组件功能\n* 构建 Nuxt 应用程序的服务端\n\n## 目标\n\nNuxt 是一个非常广泛的话题，理应由专门的一本书来详细介绍；本章将仅涵盖如何启动项目的基础、不同元素存放的位置，以及\
  \ Nuxt 与 Vue 相比的特殊之处。\n\nNuxt3 是该框架的最新版本，拥有最新的工具链和基础设施。如果你有 Meteor 等类似框架的经验，那么其中一些知识是可以迁移的。\n\
  \n## Nuxt.js 基础与 SSR\n\n正如其文档所言，Nuxt 是一个全栈框架，具有混合渲染能力。Nuxt 提供了许多便利性，使项目的构建和管理变得更加简单：\n\
  \n* 多种渲染技术，取决于路由配置\n* 标准的目录结构\n* 项目范围内的自动导入\n* Vue.js 视图引擎\n* 内置服务器引擎 (`Nitro`)\n\
  * 模块化构建\n* 透明的 TypeScript 集成\n\n## 多种渲染技术\n\nNuxt 是一个基于服务器的应用程序框架，它可以预渲染客户端内容（被称为“通用渲染”，Universal\
  \ Rendering），或者按照标准 Vue.js 那样进行传统的客户端渲染。在编写时，流水线中还有几种渲染模式：一种基于路由的混合方法，根据配置将应用程序的不同部分渲染为\
  \ SSR 或客户端渲染。此外，正在进行使用 CDN Edge 节点进行渲染内容的工作。\n\nNuxt 团队对于应用程序的结构组织有坚定的观点。这种结构具有简单性；如果你熟悉\
  \ Ruby on Rails 等框架，那么该框架使用的结构应该不是问题。主要的区别在于，在 Nuxt 中，当你生成应用程序时并不会提供目录结构。你需要手动添加所需的部分。这保持了应用程序的轻量化；只有在你需要某项功能时才会添加相应的目录。\n\
  \n下图显示了完整的目录结构所需的内容：\n\n![图形用户界面描述，置信度低](img/Figure_15.1.jpg)\n\n图 15.1：标准 Nuxt\
  \ 目录结构\n\n虽然这些在很多情况下是可选的，但 Nuxt 拥有一个智能编译器，允许实现如下所需的便利功能：\n\n* **自动导入**：框架会自动导入功能，如组合式函数\
  \ (composables)、插件和组件。自动导入在框架结构内的多个目录中进行。如果需要，可以关闭自动导入或改为显式导入。\n* **Vue.js 视图引擎和\
  \ Nitro 服务器引擎**：Vue.js 部分不言自明；这就是为什么我们在书中讨论它的原因。`Nitro` 是内置的 Web 服务器，它是全新的且专门为 `Nuxt3`\
  \ 创建的。它提供了此列表中的许多便利功能。你可以在 [`nitro.unjs.io`](https://nitro.unjs.io) 查看更多信息。\n* **模块化构建**：Nuxt\
  \ 拥有模块系统，可以方便地扩展第三方服务。Nuxt 本身由几个核心包组成，共同工作交付框架。\n* **TypeScript 集成**：TypeScript\
  \ 是构建语言，框架透明地暴露了这一点；它甚至可以为你自动生成类型。\n\n**Nuxt 的 SSR**：在许多方面，在服务器上使用 Nuxt 与其他更传统的服务器技术（如\
  \ PHP 或 Ruby-on-Rails）类似。然而，使用通用渲染时，服务器首先响应静态页面，随后将动态页面代码作为单独的代码包发送。这样做是为了让初始页面加载（静态页面数据）快得多，即减少了渲染时间，但随后会额外的功能以确保任何交互性或过渡（即用户体验\
  \ UX）不会丢失。这被称为“水合”（hydration）。这种方法受到推崇的优点之一是，如果爬虫（如 Google 的索引蜘蛛）确实足够先进，它们可以在没有\
  \ JS 渲染开销的情况下索引网站。\n\n## 使用 Nuxt.js 创建项目并管理依赖\n\n这些步骤中的许多会感到熟悉，而且我们处理的是 JavaScript\
  \ 生态系统中的项目。\n\n创建 Nuxt 应用程序最简单的方法是使用 `NPX nuxi` 脚本，如下：\n\n1. `$npx nuxi init <project-name>`\n\
  \n随后 Nuxi 会安装应用程序的基础。参考下图：\n\n![自动生成的描述](img/Figure_15.2.png)\n\n图 15.2：显示 `nuxi`\
  \ 输出的截图\n\n完成后，按照屏幕上的指令操作，即移动应用程序目录并使用 `npm i` 安装依赖。\n\n注意：如果你用 VSCode 打开应用程序文件夹，它可能会标记\
  \ `tsconfig.json` 文件有问题。要解决这个问题，请运行 `$npm i -D @types/node`。\n\n完成后，你将得到一个与下方图片类似的项目文件夹。任何差异都取决于你在构建脚本中做出的选择。参考下图：\n\
  \n![图形用户界面，应用程序描述，自动生成](img/Figure_15.3.jpg)\n\n图 15.3：新 Nuxt 项目的结构\n\n运行项目的方法是运行\
  \ `npm dev` 脚本：\n\n1. `$npm run dev`\n\n然后你可以打开浏览器指向 'http://localhost:3000' 上的应用程序，显示如下：\n\
  \n![](img/Figure_15.4.png)\n\n图 15.4：基础落地页\n\n从这里开始，你可以向目录结构中添加元素、布局 (layouts) 和组件\
  \ (components)，如图 15.1 所示。\n\n## 构建 Nuxt 应用程序的客户端\n\n有三个可以放置 UI 元素的主要区域：布局目录、页面目录和组件目录。将组件放置在这些地方可以确保它们被自动导入到项目中使用。我们将依次讨论每个部分，从组成页面的最小元素组件开始到最大的布局。\n\
  \n### Nuxt 组件\n\n这些是标准的 Vue.js 组件，如你所见。这里没有魔法。魔法在于自动导入，它使得目录中的所有组件在项目中可用。导入器足够智能，还可以导入被引用的模块所需的任何依赖组件。\n\
  \n组件使用文件路径和文件名作为组件名称自动注册。\n\n作为此示例，所示：\n\n```\n1. /components/MyComponent.vue\n\
  2. <template>\n3. <MyComponent />\n4. </template>\n6. /components/deeply/nested/Component.vue\n\
  7. <!-- 嵌套组件带有路径前缀 -->\n8. <template>\n9. <DeeplyNestedComponent />\n10. </template>\n\
  ```\n\n如果你不想使用文件路径前缀，则你需要在 `nuxt.config.ts` 中通过 `pathPrefix` 选项更新 Nuxt 配置，如下：\n\n\
  ```\n1. export default defineNuxtConfig({\n2. components: [\n3. {\n4. path: '~/components/',\n\
  5. pathPrefix: false,\n6. },\n7. ],\n8. });\n```\n\n使用此选项意味着上述的嵌套示例可以变为：\n\n```\n\
  1. /components/deeply/nested/Component.vue\n2. <template>\n3. <Component />\n4.\
  \ </template>\n```\n\n使用哪种方法取决于个人偏好或团队的编码标准。\n\n在使用自动导入功能时，你可能会遇到使用动态组件遇到问题。解决此问题的推荐方法是使用\
  \ Vue 的 `resolveComponent()` 辅助函数：\n\n```\n1. <template>\n```\n\n\n\n\n\n```html\n\
  <component :is=\"someCondition ? MyComponent : OtherComponent\" />\n```\n\n```html\n\
  </template>\n```\n\n```html\n<script lang=\"ts\">\nconst MyComponent = resolveComponent('MyComponent')\n\
  const OtherComponent = resolveComponent('OtherComponent')\nconst someCondition =\
  \ computed(() => ...)\n</script>\n```\n\n有全局导入组件的方法，这样就不需要使用 `resolveComponent()`\
  \ 了。这些方法并不被认为是良好的实践，且不被推荐。\n\n另一种你可能会用到的模式是懒加载组件，特别是当组件在初始组件渲染期间不需要时。使用如下所示的 `Lazy`\
  \ 前缀可以解决这个问题：\n\n```html\n<template>\n<MyComponent />\n<<LazyOtherComponent v-if=\"\
  visible\" />\n</template>\n```\n\n```html\n<script lang=\"ts\">\nconst visible =\
  \ ref(false)\n</script>\n```\n\n在处理组件时，我们还需要解决最后两个两个问题。第一个是仅在客户端渲染组件，第二个是关于组件水合（hydration）的问题。这两个问题是相互相关的。\n\
  \n注意：我们已经提到过水合，但作为提醒，它是指组件在服务器上静态渲染，并与组件的动态代码一起发送到客户端，后者负责交互性和/或过渡效果。\n\n为了解决这两个相关问题，Nuxt\
  \ 提供了两个文件名后缀：`.client` 和 `.server`。\n\n如果文件被标记为 `.client`，它将仅在客户端渲染。这意味着它们只会在挂载后渲染，正如你通常预期\
  \ Vue.js 组件的那样。\n\n如果你使用 `.server` 作为后缀，组件将仅在服务器端渲染，并且没有水合。\n\n在某些情况下，你可能会将组件拆分为\
  \ `.server` 和 `.client` 部分，因为这允许对水合进行更细粒度的控制，或者允许你在水合后创建并渲染 UI 的独立实现。\n\n## Nuxt\
  \ Pages\n\n页面是 Vue.js 组件，包含了构成页面的一个或多个组件的引用。`components/` 目录下的组件与 `pages/` 目录下的组件的主要区别在于路由。页面具有路由，路由基于子目录和文件名。\n\
  \n注意：在构建页面组件时，你需要确保该组件只有一个根元素。HTML 注释也被视为元素。\n\n由于页面之间的路由是由文件名和目录名处理的，处理动态路由可能会有点复杂。\n\
  \n为了方便这一点，在构建目录和文件名时可以使用一种特殊的语法来提供这种功能。对于强制性路由参数，参数名括在 `[]` 中；对于可选参数，你需要使用 `[[]]`。参见以下示例：\n\
  \n```text\n--> pages/\n----> index.vue\n----> product-[group]/\n------> [[product_id]].vue\n\
  ```\n\n在给出的目录列表中，你可以看到 `group` 是必须的，并且很可能在模板中使用；然而，`product_id` 是可选的。如果没有它，我们可能假设页面将显示不同的内容，例如产品组中所有项目的列表。因此，我们可能会看到如下所示：\n\
  \n```html\n<template>\n<main>\n<h1>{{ $route.params.group }}</h1>\n<section v-if=\"\
  $route.params.product_id\">\n<!-- 显示特定产品的详情 -->\n</section>\n<section v-else>\n\
  <!-- 显示分组列表组件 -->\n</section>\n</main>\n</template>\n```\n\n在模板中（或使用 Options API）访问路由参数是通过标准的\
  \ `$route` 对象实现的。使用 Composition API 访问这些参数是通过 `useRoute()` 组合函数完成的。\n\n路由嵌套（即子路由）要求你在每个父组件中使用\
  \ `<NuxtPage />` 组件，以确保子组件在它应该出现的地方。在使用 `<NuxtPage />` 组件时，可以使用 `pageKey` 属性控制渲染或过渡。\n\
  \n页面还可以使用 `definePageMeta()` 编译器宏来设置元数据。在整个应用程序中可以使用几个特殊的元数据键。这些键的说明可以在文档中找到。\n\n\
  \n\n\n\nNuxt 提供了一个名为 `useState()` 的组合式（composable）。该组合式是 SSR 环境下 `ref` 或 `reactive`\
  \ 数据的无缝替换。如果你已经熟悉 React Hooks，那么它的原理是相同的。\n\n由于它被直接用于支持 SSR，在使用时需要注意以下几点：\n\n- `useState()`\
  \ 只能在 `script setup` 或生命周期钩子中使用。\n- 内部包含的数据需要是 JSON 可序列化的。\n- 数据在注水（hydration）过程中会被保留。\n\
  - 存储的状态通过一个唯一的键（key）在所有使用它的组件之间共享。\n- 存储的状态是响应式的。\n\n使用此组合式有两种方式：使用键或不使用键；在后一种情况下，Nuxt\
  \ 会自动为你生成一个唯一的键。你提供的初始值可以是被 `ref()` 包装的值，也可以是函数的返回值，只要该值是 JSON 可序列化的即可。以下代码示例展示了如何使用此组合式：\n\
  \n```javascript\nconst value = useState(/* primitive value */\nconst value = useState('value',\
  \ () => /* return value */)\nconst value = useState('value') // Accesses value\n\
  \n// 全局类型安全状态 (例如：composables/x.ts)\nexport const useLetterX = () => useState<string>('letterX',\
  \ () => 'x')\n\n// 使用自动导入\n<script setup>\nconst x = useLetterX() // 等同于 useState('letterX')\n\
  </script>\n```\n\n我们用于管理功能的下一个部分是生命周期钩子。\n\n## 生命周期钩子 (Lifecycle Hooks)\n\n由于 Nuxt\
  \ 是一个现代 Web 开发框架，使用 `Vue.js` 作为显示层，它允许开发者通过“钩入（hook）”应用生命周期，从而选择处理设置操作和执行远程数据调用。\n\
  \n在 Nuxt 中，钩子可以定义在构建时或运行时执行，且涵盖前端应用和服务器。\n\n钩子的数量非常多，书中无法全部列出。完整的列表可以在 [`nuxt.com/docs/api/advanced/hooks`](https://nuxt.com/docs/api/advanced/hooks)\
  \ 找到。\n\n钩子在模块、插件和中间件中使用时会变得有用得多。\n\n接下来，我们将查看如何获取远程数据。\n\n## 远程数据 (Remote data)\n\
  \n我们已经熟悉 `useFetch()` 及其相关函数。在 Nuxt 中，这些组合式仅在 `script setup` 和生命周期钩子可用，但在整个应用范围内都是通用的。\n\
  \n在构建应用时，你可能需要访问 API 数据。理解的是，访问远程数据可能需要传递头部数据（如 cookies 或授权），而在服务器环境中无法直接访问这些数据。为了处理这种情况，Nuxt\
  \ 提供了 `useRequestHeaders()` 函数，用于提供相关的头部数据。\n\n文档中有一个关于最佳实践的章节，你应该阅读：[`nuxt.com/docs/getting-started/data-fetching#best-practices`](https://nuxt.com/docs/getting-started/data-fetching#best-practices)。\n\
  \n## 错误处理 (Error handling)\n\n与所有框架一样，Nuxt 应用可能会成为某些不可避免的运行时错误的来源。\n\n在应用的生命周期中，有几个点是这些错误发生且最可能被处理的地方：\n\
  \n- SSR 和 SPA 的客户端渲染生命周期：\n  渲染期间的错误可以通过 `onErrorCaptured()` 函数或 `vue:error` 钩子捕获。如果你使用全局错误处理器，可以通过创建一个插件并通过\
  \ `vueApp.config.errorHandler()` 封装全局处理器来捕获。创建此类封装的典型示例所示：\n\n```javascript\nexport\
  \ default defineNuxtPlugin((nuxtApp) => {\n  nuxtApp.vueApp.config.errorHandler\
  \ = (error, context) => {\n    // ...\n  }\n})\n```\n\n- SSR 和 SPA 的服务器和客户端启动：\n\
  \  如果 Nuxt 在启动时遇到错误，它会调用 `app:error` 钩子。\n- 服务器/API 生命周期：\n  如果在服务器生命周期期间发生错误，至少在编写时，无法定义服务器端处理器。对此的最佳实践是渲染一个错误页面，清除错误并重定向到新页面。要查看示例，请访问\
  \ [`nuxt.com/docs/getting-started/error-handling#example`](https://nuxt.com/docs/getting-started/error-handling#example)。\n\
  \n## 组合式 (Composables)\n\n应用的组合式放在 `composables/` 目录下。从这里它们会被自动导入，以便在整个应用中使用。为了让编译器自动生成类型文件（`.nuxt/imports.d.ts`），需要运行标准运行脚本之一：`nuxi\
  \ prepare`、`nuxi dev` 或 `nuxi build`；否则 TypeScript 编译器会报错，显示找不到正确的类型。\n\n## 中间件\
  \ (Middleware)\n\nNuxt 支持两种形式的中间件：客户端中间件影响 UI 路由，服务端中间件应用于 `Nitro` 运行。\n\n### 路由中间件\
  \ (Router middleware)\n\n路由中间件通常用于对请求头或参数进行查询，以确定哪个端点处理器或页面最适合响应。通常，路由中间件处理身份验证、角色管理或授权、CORS\
  \ 和 XSS 攻击，但它们也可以用于重定向到特殊的产品页面、优惠活动或基于特定用户的营销或功能。\n\n在编写 `Vue.js` 代码时，你可以通过三种方式影响应用路由的应用：\n\
  \n- 内联或匿名，直接定义在页面上\n- 放置在 `middleware/` 目录下的具名中间件，它会被自动导入，且通常基于文件名命名\n- 全局可用，类似于具名中间件，但带有全局后缀\n\
  \n前两种类型可以使用 `definePageMeta()` 函数应用于页面级，传入中间件键的列表：\n\n```javascript\n<script setup>\n\
  definePageMeta({\n  middleware: [\"auth-handler\", \"my-middleware\"]\n})\n</script>\n\
  ```\n\n路由中间件的格式是一个导航守卫，接受两个参数 `to`（去向哪里）和 `from`（来自哪里），Nuxt 暴露了 `navigateTo()` 和\
  \ `abortNavigation()` 辅助函数。如果这两个者都没有返回（参见下例），控制权将传递给下一个中间件或完成路由导航：\n\n```javascript\n\
  export default defineNuxtRouteMiddleware((to, from) => {\n  if (/* 错误条件*/) {\n \
  \   return abortNavigation()\n  }\n  if (/* 重定向条件*/) {\n    return navigateTo('/')\n\
  \  }\n  // 无返回 - 下一个中间\n})\n```\n\n### 服务端中间件 (Server middleware)\n\n服务端中间件位于 `server/middleware/`\
  \ 目录，会被 Nuxt 自动导入。定义在此文件夹中的中间件处理器将在服务器路由到组件之前应用于每个请求。服务端中间件处理器可以用于调查头部、记录请求、扩展请求对象或抛出错误。用于返回响应。参考以下代码：\n\
  \n```javascript\n// server/middleware/auth.ts\nexport default defineEventHandler((event)\
  \ => {\n  ...\n  event.context.auth = <auth context>\n})\n```\n\n## 插件 (Plugins)\n\
  \nNuxt 插件用于为 Vue 库和其他外部模块提供封装。如果插件文件仅在客户端或服务器需要，可以分别加上 `.client` 或 `.server` 后缀。\n\
  \n包含在 `plugins/` 根目录的文件会被自动导入，子目录中的任何 `index.(js|ts)` 文件也是如此。\n\n注意：插件按字母-数字顺序导入。如果某个特定插件依赖另一个插件，则你需要确保依赖项先加载。这可以通过在文件名前加缀数字（如\
  \ 1、2 等）来实现。\n\n\n\n\n插件文件导出 `defineNuxtPlugin()` 函数的结果，该函数接收 `nuxtApp` 作为参数：\n\n\
  ```javascript\nimport ... from Vue\n\nexport default defineNuxtPlugin((nuxtApp)\
  \ => {\n  nuxtApp.use(...)\n})\n```\n\n# 其他文件夹\n\nNuxt 应用中还有许多其他文件夹，但它们通常用于处理或管理状态。你可以在\
  \ [`nuxt.com/docs/guide/auto-imports`](https://nuxt.com/docs/guide/auto-imports)\
  \ 中探索。\n\n# Nuxt 应用的服务器端\n\nNuxt 应用的服务器部分通常用于创建 API 端点，并配合暴露的 `useFetch()` 组合式使用。\n\
  \n`server/` 目录结构可以包含任意数量子目录，包括 `api/`、`routes/` 和 `middleware/`。这些会被扫描注册 API 和处理器。\n\
  \nNuxt 期望这些目录中的文件导出一个使用 `defineEventHandler()` 函数的默认函数。处理器接收一个 `event` 对象并应该返回 JSON\
  \ 数据、`Promise<T>`。\n\nNitro 提供的文档可以在 [`nitro.js.io/guide/`](https://nitro.js.io/guide/)\
  \ 找到。\n\n## 事件处理器基础\n\n为 Nuxt 应用创建的所有事件处理器都具有相同的签名：\n\n```typescript\n// 类型签名\n\
  declare function defineEventHandler<T = any>(handler: EventHandler<T>): EventHandler<T>;\n\
  \nexport default defineEventHandler(\n  (event: H3Event) => {\n    return\n  }\n\
  )\n```\n\n处理器在构建时自动映射到 URI；以下章节描述了如何定义各种类型的处理器来访问请求。\n\n### 处理 body\n\n具有 body 内容请求需要从\
  \ `event` 中提取内容。这是异步的：\n\n```typescript\n// server/api/my-handler.post.ts\nexport\
  \ default defineEventHandler(async (event) => {\n  const body = await readBody(event)\n\
  \  return { body }\n})\n```\n\n### Query 参数\n\n处理查询参数与处理 body ：\n\n```typescript\n\
  // server/api/my-handler.get.ts\nexport default defineEventHandler((event) => {\n\
  \  const query = getQuery(event)\n  return { ... }\n})\n```\n\n### Headers\n\n访问请求头遵循类似的模式：\n\
  \n```typescript\n// server/api/my-handler.ts\nexport default defineEventHandler((event)\
  \ => {\n  const headers = getRequestHeaders(event)\n  return { ... }\n})\n```\n\n\
  还有几个其他函数可以处理请求和响应体，可以在 `h3.unijs.org/https` 找到。\n\n### 访问 API\n\n使用 Nuxt 暴露的 `$fetch`\
  \ API 访问服务器 API 端点。\n\n在需要来自 API 组件中，你可以像接示例所示发出请求：\n\n```javascript\n// GET 请求\
  \ – 映射到 server/api/endpoint.get.ts\n$fetch('/api/endpoint')\n\n// POST 请求 – 映射到\
  \ server/api/endpoint.post.ts\n$fetch('/api/endpoint', { method: 'post', body: {\
  \ test: 'abc' } })\n\n// DELETE 请求 – 映射到 server/api/endpoint.delete.ts\n$fetch('/api/endpoint',\
  \ { method: 'delete', body: { id: 1 } })\n```\n\n`fetch` (`ofetch`) 的文档可以在 [`github.com/unjs/ofetch`](https://github.com/unjs/ofetch)\
  \ 找到，其中详细说明了更多可用 API。\n\n# 路由\n\n路由是根据我们讨论过的自动构建的。以下章节涵盖了服务器级别提供的各种路由元素。\n\n###\
  \ 路由匹配\n\n`routes/` 目录根据文件名构建路由，其中 `[]` 中的段会被提取到 `event.context.params`。Nuxt 期望这些目录中的文件导出一个使用\
  \ `defineEventHandler()` 函数的默认函数。处理器接收一个 `event` 对象。\n\n例如，在 `server/routes/[id].ts`\
  \ 中：\n\n```javascript\n// server/routes/[id].ts\nexport default defineEventHandler((event)\
  \ => {\n  // 访问 event.context.params.id\n})\n```\n\n## 通配路由\n\n创建一个名为 `...` 的文件会创建一个匹配嵌套路径的通配路由。\n\
  \n## 状态码、重定向\n\nNuxt 提供了多种用于影响响应的函数。它还从 `event` 提供了 cookie。\n\n```javascript\nexport\
  \ default defineEventHandler((event) => {\n  // 设置状态或重定向\n  // 处理 cookie\n})\n```\n\
  \n## 服务器存储解决方案\n\nNuxt 的服务器层带有一个用于类似 Redis 的键值存储的简单解决方案。文档中有一个如何集成 Redis 的简单示例：[`nuxt.com/guide/directory-structure/server-storage`](https://nuxt.com/guide/directory-structure/server-storage)。\n\
  \n然而，你需要一个像 MongoDB 这样全面的解决方案；为了让 MongoDB 在 Nuxt 中工作，你需要在 `nuxt.config.ts` 中定义配置：\n\
  \n```typescript\n// nuxt.config.ts\nimport { defineNuxtConfig } from \"nuxt\";\n\
  \nexport default defineNuxtConfig({\n  runtimeConfig: {\n    mongoUrl: process.env.MONGO_URL,\n\
  \  },\n});\n```\n\n## 插件\n\n插件有两种设置方式。第一种是从 `server/plugins` 目录自动导入。在此目录工作时，你需要使用\
  \ `defineNitroPlugin()` 函数创建插件，该函数接收 `nitroApp` 作为参数。通过这样做，你可以扩展运行时行为。\n\n```javascript\n\
  export default defineNitroPlugin((nitroApp) => {\n  // 钩入 nitro 生命周期事件\n})\n```\n\
  \n对于其他类型的插件，你需要将它们添加到 `nuxt.config.ts` 文件中，位于 `nitro.plugins` 键下：\n\n```typescript\n\
  nitro: {\n  plugins: [\"~/server/path/to/plugin.ts\"],\n},\n```\n\n关于 MongoDB 的设置，将此添加到应用程序中的最佳方式如下：\n\
  \n```typescript\nimport mongoose from \"mongoose\";\n\nmongoose.set('strictQuery',\
  \ true);\n\nexport default defineNitroPlugin(async () => {\n  try {\n    await mongoose.connect(useRuntimeConfig().mongoUrl)\n\
  \    // ... 其余设置 ...\n  } catch (err) {\n    // ... 处理 err ..\n  }\n});\n```\n\n\
  \n\n\n正常情况下，Nitro 服务器将返回 200 OK 响应；如果出现任何未捕获的错误，则返回 500 Internal Server Error。如果你需要响应不同的错误类型，则需要使用\
  \ `createError()` 函数抛出异常，并传入错误详情和所需的 `statusCode`。这与之前提到的 `setResponseStatus()`\
  \ 函数不同。参考以下代码：\n\n```javascript\nexport default defineEventHandler((event) => {\n\
  \  if (false) {\n    throw createError({\n      statusCode: 400,\n      statusMessage:\
  \ 'This is a failure message',\n    })\n  }\n  return 'Ok'\n})\n```\n\n### 其他目录\n\
  Nitro 会自动从此处未列出的其他目录中导入内容。更多细节可以在 [`nuxt.com/docs/guide/directory-structure/server`](https://nuxt.com/docs/guide/directory-structure/server)找到。\n\
  \n## 结论\nNuxt3 是一个大型框架，这个简短的章节很难完全展现它的面貌。我们在这里仅仅触了皮毛，但它足以让你入门，并为你提供足够寻找更多信息的线索。\n\
  \n客户端和服务器之间使用的模式存在显著的重叠，为开发者在处理应用程序这两个部分时提供了统一的体验。这种上下文或语言切换的缺失意味着 Nuxt 应用构建更快、更易于维护。\n\
  \n### 需要记忆的点\n* Nuxt3 使用 Vue3 作为视图层。\n* Nuxt3 有一个名为 Nitro 的内置 Web 服务器。\n* Nuxt 会从一些标准目录自动导入。\n\
  * 默认 UI 渲染被称为通用渲染（Universal Rendering）。\n* 在服务器上渲染的 UI（SSR）会在客户端进行注水（Hydrated）。\n\
  * 中间件用于影响服务器路由。\n\n## 关键术语\n* 通用渲染\n* 服务端渲染 (SSR)\n* 注水 (Hydration)\n* 构建时间\n* 运行时\n\
  * 中间件\n* 路由\n* Nitro\n* 错误处理\n* 请求\n* 响应\n* 自动导入\n* Fetch API\n* 存储\n* 路径\n\n加入我们的书籍\
  \ Discord 空间\n加入书籍 Discord 工作区以获取最新更新、优惠、全球技术动态、新发布以及与作者的座谈会：\n**[`discord.bpbonline.com`](https://discord.bpbonline.com)**\n\
  ![](img/fm1.png)\n\n# 第 16 章 使用 Quasar 构建多租户应用\n\n## 引言\n如上一章所述，使用 Nuxt.js 构建应用程序有一个小小的限制，这对于某些人来说是一个问题。正如你在上一章看到的，你可以用\
  \ Nuxt.js 快速构建 Web 应用，但如果你需要构建针对多个平台的应用程序（特别是如果你考虑移动原生应用），Nuxt 就无法为你提供帮助。为此，你需要\
  \ Quasar。通过利用多个构建流水线和编译器，Quasar 应用可以为几乎任何输出设备构建程序。\n\n## 结构\n本章涵盖了以下主题：\n* 背景下的\
  \ Quasar\n* 入门\n* 多平台\n* 构建多租户应用\n* 使用 Quasar 构建应用程序\n* 将你的应用程序发布到世界\n\n## 目标\n\
  Quasar 是一个结合了组件库、框架和布局引擎的工具，允许用户构建可以编译到多个目标的应用程序。本章涵盖了使用 Quasar 构建应用程序的一些方面。从根本上说，使用它与构建任何\
  \ Vue.js 应用是相同的。区别恰恰在于 CLI、平台检测 API、组件库以及应用程序部署。\n\n### 背景下的 Quasar\n为了介绍 Quasar\
  \ 的背景，我们需要定义几个你可能不熟悉的术语。这些是：输出目标、构建上下文、组件库和启动文件（boot file）。\n\n### 输出目标\n输出目标指的是我们编译应用程序运行的平台：桌面/笔记本电脑浏览器、移动端浏览器、移动原生原生应用等。输出目标是一个\
  \ CLI 选项，描述了使用哪种编译器。[图 16.1] 描述了输出目标：\n\n![](img/figure_16.1.png)\n图 16.1：输出目标\n\
  \n下表显示了每个输出目标可用的编译器：\n\n| 目标 | 编译器 | 备注 |\n| --- | --- | --- |\n| SPA | Default\
  \ | |\n| SSR | ssr | |\n| PWA | pwa | |\n| Capacitor | capacitor | 需要 Android SDK\
  \ 和/或 Xcode；目标为 iOS 或 Android |\n| Cordova | cordova | 需要 Android SDK 和/或 Xcode；需要安装\
  \ Cordova；目标为 iOS 或 Android |\n| Desktop | electron | |\n| 浏览器扩展程序 | bex | |\n\n\
  表 16.1：输出目标\n\n### 构建上下文\n这意味着几点：应用程序是 SSR 还是渲染的，以及应用程序是为开发还是生产环境构建的。这些通过 `quasar.config.js`\
  \ 或 CLI 控制。\n\n### 组件库\n我们还没有详细讨论组件库，但之前在 Nuxt 中已经简要提到过它。组件库是一组提供的、开箱即用的组件，是一种划分\
  \ UI 的方式。\n\n### 启动文件 (Boot file)\n启动文件是一个在主 Vue 实例可用之前所需的服务的文件。可以在 [`quasar.dev/quasar-cli/boot-files`](https://quasar.dev/quasar-cli/boot-files)\
  \ 找到几个很好的启动文件。\n\n### 入门\n最简单的入门方法是全局安装 Quasar：\n\n```bash\nnpm i -g @quasar/cli\n\
  ```\n安装 CLI 后，可以通过 `init` 脚本创建新项目，它会询问一系列问题，详文所示：\n\n```bash\nnpm init quasar\n\
  ```\n需要安装以下包：\n`create-quasar@1.1`\n是否继续？(y) `y`\n✔ 你想构建什么？`App with Quasar CLI,\
  \ let's go!`\n✔ 项目文件夹：`quasar-project`\n✔ Quasar 版本：`Quasar v2 (latest and greatest)`\n\
  ✔ 脚本类型：`Typescript`\n✔ Quasar App CLI 变体：`Quasar App with Vite`\n✔ 包名：`quasar-project`\n\
  ✔ 项目名称：（构建移动应用时必须以字母开头）`Quasar App`\n✔ 项目描述：`A Quasar Project`\n✔ 作者\n✔  Vue 组件样式：`Composition\
  \ API`\n✔ 选择你的 CSS 预处理器：`Sass with SCSS syntax`\n✔ 检查项目需要的功能：`ESLint, 状态管理 (Pinia),\
  \ Axios`\n✔ 选择 ESLint 预设：`Prettier`\n\n然后，你可以添加所需的目标平台：\n\n```bash\ncd <project-folder>\n\
  quasar add [ssr | pwa | capacitor | cordova | electron | bex]\n```\n\n\n\n\n当项目依赖就绪后，可以使用\
  \ Quasar 构建脚本完成构建：\n\n### 开发环境构建\n1. // Development builds\n2. `$quasar dev`\n3.\
  \ `$quasar dev -m [ ssr | pwa | electron | hex ] <options>`\n4. `$quasar dev -m\
  \ [ capacitor | cordova ] -T [ ios | android ] <options>`\n\n### 生产环境构建\n6. // Production\
  \ builds\n7. `$quasar build`\n8. `$quasar build -m [ ssr | pwa | electron | hex\
  \ ] <options>`\n9. `$quasar build -m [ capacitor | cordova ] -T [ ios | android\
  \ ] <options>`\n\n现在我们已经知道了如何安装框架、创建和构建项目，接下来可以看看使用 Quasar 创建应用与使用任何其他组件库构建网站有何不同。\n\
  \n## 多平台\n\n如前所述，在许多方面，使用 Quasar 与使用你可能遇到的任何其他组件库非常相似。\n\nQuasar 提供了了自己的组件库、CSS\
  \ 框架以及若干平台辅助工具（helpers）。这些辅助工具专门用于，旨在帮助你构建不同类型的应用程序，或者说，能够在不同的构建输出中使用相同的代码库。\n\n\
  我们将在下一节中详细介绍这些辅助工具。\n\n与 Nuxt 不同，Quasar 不支持自动导入 JS/TS ，因为它具有不同的树摇（tree-shaking）机制，并且对包大小和执行效率有不同的要求，这在很大程度上取决于输出目标。\n\
  \n尽管使用 Quasar 构建不同类型的 Web 应用对于许多 Web 开发者来说并不陌生，但对于那些以前接触过移动原生或桌面应用的人来说，这些领域起初可能会非常令畏。使用\
  \ Quasar 意味着你不需要学习新的编程语言：你可以坚定地留在 JS/TS 世界来为这些其他平台构建应用。访问浏览器沙箱之外的硬件服务开启了许多待探索的新途径和范式。\n\
  \n特别是在为原生移动端构建时，你可能需要跳出熟悉的编辑器（最可能是 `VS Code`）。在为 iOS 构建时，由于平台限制，你需要在 Apple 电脑上使用\
  \ `XCode`；而对于 Android，你需要访问 `Android SDK`（以及 `Android Studio`）。\n\n这些平台并不是 Web 浏览器，而是有各种工具让你视觉化并访问你的应用程序。在应用程序开发的早期，这意味着将访问这些环境提供的设备模拟器。在开发的后期和部署之前，你需要访问目标平台的至少一个硬件设备。如果你同时为\
  \ iOS 和 Android 构建，你需要一个 Android 设备（如 `Google Pixel` 或 `Samsung device`）以及一台用于 iOS\
  \ 的 `Apple iPhone`。\n\n这些设备不需要是顶配或全新的，只需要是能反映你预期用户群体中典型用户特征的设备。如果你或你的组织负担得起，提供多种屏幕尺寸的设备和几个不同操作系统的示例进行测试，将让你有最大的机会满足受众的需求。\n\
  \n## 构建多租户应用\n\n在构建需要在不同平台间使用的应用程序，甚至使用该框架的 JS 基础构建移动或桌面应用时，你需要了解使用 Quasar 时可用的一些元素。\n\
  \n## Quasar 实例 - $q\n\n我们首先介绍的是 Quasar 实例，按照惯称为 `$q`：\n\n## Composition API\n```javascript\n\
  // Composition API API<script setup lang=\"ts\">\nimport { useQuasar } from 'quasar'\n\
  const $q = useQuasar()\n...\n</script>\n```\n\n### 或者\n```javascript\n// OR\n<script>\n\
  import { useQuasar } from 'quasar'\nexport default {\n  setup () {\n    const $q\
  \ = useQuasar()\n    ...\n  }\n}\n</script>\n```\n\n### Options API\n```javascript\n\
  // Options API\n<script>\nexport default {\n  methods: {\n    func () {\n      this.$q.platform...\n\
  \    }\n  }\n}\n</script>\n```\n\n`$q` 对象/实例类似于 vue 实例，它是一个全局可用的对象，提供了构建你的应用程序所需的行为。这个辅助工具提供了有关构建环境的信息、任何国际化数据，以及对你可能配置的任何\
  \ Quasar 级插件的访问。\n\n从 `$q` 获取的最重要的信息类型如下：\n* `$q.platform` 用于查询平台\n* `$q.screen`\
  \ 获取尺寸\n* `$q.lang` 用于 i18n\n\n对于原生移动端，你还可以访问 `$q.cordova` 或 `$q.capacitor`，以便访问原生功能。\n\
  \n## 平台检测\n\n在跨平台工作时（特别是在原生平台上），你需要轻松判断自己处于哪种平台。下表提供了 `$q` 中可用属性的非穷举列表：\n\n| is\
  \ | has | within |\n| :--- | :--- | :--- |\n| mac | | |\n| mobile | | |\n| desktop\
  \ | | |\n| iframe | | |\n\n该辅助工具可以同时在模板和脚本上下文中使用：\n\n```html\n<!-- template -->\n\
  <div v-if=\"$q.platform.is.mac\">\n  <!-- 在 mac 上渲染 -->\n</div>\n<div v-if=\"$q.platform.is.mobile\"\
  >\n  <!-- 在移动端渲染 -->\n</div>\n<div v-if=\"$q.platform.is.desktop\">\n  <!-- 在桌面端渲染\
  \ -->\n</div>\n```\n\n### 组件\n```javascript\n// Components\n<script setup lang=\"\
  ts\">\nimport { useQuasar } from 'quasar'\nconst $q = useQuasar()\n\nconst func\
  \ = () => {\n  if ($q.platform.is.electron) {\n    // 在 electron 上渲染\n  } else if\
  \ ($q.platform.is.nativeMobile) {\n    // 在原生移动端渲染\n  }\n\n  if ($q.platform.has.touch)\
  \ {\n    // 触摸功能\n  }\n\n  if ($q.platform.is.chrome && $q.platform.version < 70)\
  \ {\n    // 针对 chrome 版本 <70 的补丁\n  }\n}\n</script>\n```\n\n在使用此辅助工具时需要注意的是，在模板中工作时，你可能可以使用\
  \ CSS 框架实现相同的视觉输出。使用 CSS 方法的缺点是，即使元素不可见，它们也会渲染，无论平台如何。有时这是所需的行为；由你决定什么最适合你的应用。\n\
  \n需要注意的是 `$q.platform.is.mobile` 返回的是应用是否运行在移动浏览器中，而不是原生移动应用。要获取原生移动详情，请使用 `platform.is.cordova`\
  \ 或 `platform.is.capacitor`。\n\n## 屏幕检测\n\nQuasar 提供了一个屏幕插件，可以在代码级别管理动态和响应式 UI。建议使用\
  \ CSS。你可以在 `https://quasar.dev/style/window-width-related` 使用许多响应式类。\n\n尽管此功能封装在插件中，但它是自动可用的。这意味着\
  \ `$q.screen` 已经挂载到 `$q` 实例上。\n\n在构建组件中使用 `$q.screen` 的示例如下列表所示：\n\n```html\n<template>\n\
  \  <q-list v-if=\"$q.screen.gt.md\">\n    <q-item>\n      <q-item-section>列表内容</q-item-section>\n\
  \    </q-item>\n    <q-item>\n      <q-item-section>列表内容</q-item-section>\n    </q-item>\n\
  \  </q-list>\n  <q-button :class=\"buttonColor\" />\n</template>\n```\n\n\n\n\n\n\
  ```html\n<script...>\nimport { useQuasar } from 'quasar'\nimport { computed } from\
  \ 'vue'\n\nconst $q = useQuasar()\n\nconst buttonColor = computed(() => {\n  return\
  \ $q.screen.lt.md\n  ? 'primary'\n  : 'secondary'\n})\n</script>\n```\n\n`Screen`\
  \ 插件也可以用于重新定义组件响应的各种断点。它不会改变 CSS 断点。然而，要实现这一点，你需要向 `setSizes()` 函数提供一个对象，该对象定义了你想要做的更改。该对象只接受有限数量的键。可以覆盖的断点标识符有\
  \ `sm`、`md`、`lg` 和 `xl`。\n\n考虑以下代码：\n\n```html\n<script setup>\nimport { Screen\
  \ } from 'quasar'\nScreen.setSizes({ sm: 300, md: 500, xl: 2000 })\n</script>\n\
  ```\n\n此外，该插件还可以向构建中添加几个额外的响应式 CSS 类；这有一个已知问题，会显著增加部署包的权重，足以增加首次有效内容绘制的时间。更多细节可以在文档\
  \ `https://quasar.dev/options/screen-plugin` 中找到。\n\n## 国际化 (i18n)\n\n在 Quasar 中，当你考虑到\
  \ i18n 构建应用时，需要考虑两个元素。在这两个元素中，一个仅适用于 Quasar 组件语言包，另一个适用于你自己的组件：使用 `vue-i18n` 和 `@intlifty/vue-i18n-loader`\
  \ 是支持 i18n 的推荐方法。\n\n这些包的安装和设置可能会变得相当复杂，因此最好熟悉文档中的相关部分。在两种情况下，你都会非常熟悉启动文件（boot file）的设置。\n\
  \n若要处理 Quasar 组件和语言包，文档请访问 `https://quasar.dev/options/quasar-language-packs`。\n\
  \n为你自己的组件添加 i18n 的文档可以在 `https://quasar.dev/options/app-internationalization` 找到。\n\
  \n## 插件、扩展和工具类\n\n尽管 Quasar 是一个功能齐全、箱箱即用的框架，但它也有几个可以在需要时使用的可选额外扩展。这些扩展根据功能在应用程序中的应用方式分为几种类型。\n\
  \n### 插件\n\n插件用于增强你可用的 UI 组件。它们通常通过 `quasar.conf.js` 文件中的 `plugins` 属性添加。这里有一个简单的示例：\n\
  \n```javascript\n// quasar.config.js\nreturn {\n  framework: {\n    plugins: [ 'Notify',\
  \ 'Meta', ... ]\n  }\n}\n```\n\n插件随后通常（除非文档另有说明）可以通过 Quasar 实例可用：\n\n```html\n<template>\n\
  \  <q-btn @click=\"show\" label=\"Show Notification\" />\n</template>\n\n<script\
  \ setup lang=\"ts\">\nimport { useQuasar } from 'quasar'\n\nconst $q = useQuasar()\n\
  \nfunction show() {\n  $q.notify({ ... })\n}\n...\n</script>\n```\n\n### 应用扩展 (App\
  \ Extensions)\n\n扩展提供了具有额外依赖项的功能库，这些依赖可能需要启动文件（额外的配置细节）、自定义模板和自定义逻辑。它们可以用于扩展 Quasar\
  \ 核心和 CLI。\n\n构建你自己的扩展可能会复杂，但从 App Extension 库中安装一个是简单的，并且通过 Quasar CLI 完成。考虑以下代码：\n\
  \n```bash\n$ quasar ext add <extension-name>\n```\n\n由于每个扩展都是自定义的，任何导入的扩展可能需要额外的设置，详细请见其文档。\n\
  \n扩展适用于多个不同的用途，例如添加以下内容：\n\n* 预构建的测试工具\n* 将 TypeScript 引入项目\n* 音频/视频播放器\n* 日历、时间线和其他复杂的\
  \ UI\n\n官方扩展列表可以在此处找到：`https://quasar.dev/app-extensions/discover`\n\n此页面也有社区提供的扩展的链接。\n\
  \n### 工具类 (Utilities)\n\n工具类是有用功能的库。它们可以直接从 Quasar 导入并且是完全支持摇抖优化（tree shakeable）。\n\
  \nQuasar 提供了多个工具类，无需安装第三方库即可让任务更容易。以下是有限列表：\n\n* 日期 (Date)\n* 颜色 (Color)\n* 格式化\
  \ (Formatter)\n* 防抖 (Debounce) 和节流 (Throttle)\n* 事件处理\n\n使用工具类简单，只需导入然后解构。看下面的示例：\n\
  \n```html\n<script>\nimport { dom } from 'quasar'\n\n// 解构\nconst { offset, height,\
  \ width } = dom\n\n// 使用函数\nconsole.log(offset)\nconsole.log(height)\nconsole.log(width)\n\
  </script>\n```\n\n在 Quasar 核心之外，有很多功能可以访问，以帮助你的应用程序。\n\n## 使用 Quasar 构建应用程序\n\n\
  为了理解如何使用此框架，我们将从零构建一个小型应用程序。该应用程序将从海洋和大气管理局（Oceanic and Atmospheric Administration）获取数据。\n\
  \n## 创建应用程序\n\n开始，我们将使用 CLI 生成一个项目：\n\n```bash\n$ npm init quasar\n```\n\n提供的项目将根据以下选择进行构建：\n\
  \n* 你想构建什么？`App with Quasar CLI`\n* 项目文件夹：`noaa-weather-project`\n* Quasar 版本:`<recommended>`\n\
  * 脚本类型：`Typescript`\n* Quasar 变体:`<recommended>`\n* 包名:`quasar-test-project`\n*\
  \ 产品名称:`quasar-test-project`\n* 项目描述:`<default>`\n* 作者:`<default>`\n* Vue 组件样式:`<recommended>`\n\
  * CSS 预处理器:`<default>`\n* 项目需要的特性:`ESLint, Axios`\n* ESLint 预设:`<default>`\n* 安装项目依赖？`Yes,\
  \ use npm`\n\n在项目根目录下运行 `quasar dev` 将启动默认开发服务器并打开你的默认浏览器以显示脚架化的基础应用程序。这并不是我们完全想要的，但它是检查基础应用程序是否安装正确的良好测试。\n\
  \n现在，你添加了开始工作时运行的编译器。在我们的情况下，我们将设置一个 Capacitor 应用：\n\n```bash\n$ quasar mode add\
  \ capacitor\n```\n\n使用此模式需要额外的依赖，CLI 将为你安装。一旦添加了平台，你将看到一个新的 `src-<platform>` 目录。该目录包含支持\
  \ capacitor 需要的所有平台相关插件和工具类。大部分应用程序配置由 `quasar.config.js` 管理，但平台特定的配置存储在 `src-<platform>`\
  \ 目录中。检查相关文档以确定哪些内容放在哪里。\n\n要在 capacitor 模式下运行应用程序，你需要停止 SPA 开发服务器并使用以下命令重启它：\n\n\
  ```bash\n$ quasar dev -m capacitor -T ios\n```\n\n\n\n\n\n本示例是在 Mac 上构建的。如果你没有可用设备，请将\
  \ `-T ios` 更改 `-T android`。此外，对于 iOS 生产环境构建，你必须在 `Signing & Capabilities` 下添加开发团队引用，这意味着你需要购买开发许可许可。\n\
  \n此命令将以 capacitor 模式重新构建项目并打开相关的 IDE。初始构建可能需要一些时间才能完成。一旦 IDE 打开，`ios` 将运行 `Xcode`，`android`\
  \ 将运行 `Android Studio`，通过点击构建按钮打开本地设备模拟器来运行项目。\n\n默认应用程序将在模拟器中启动。\n\n在保持这些运行的同时，我们现在可以将注意力转向\
  \ `src/` 目录下的代码，就像一个默认的 SPA 应用一样。\n\n## 构建应用程序 #contents.xhtml_sc3_386a\n\n在开发服务器上运行的应用是热构建的，更改会随着源代码的变化反映在模拟器中。\n\
  \n设计非常简单。只有两个“页面”、一些可组合函数（composables）以及一些配置。\n\n我们首先查看的是为 Axios 服务添加基础 URL。为此，你需要将\
  \ `src/boot/axios.ts` 文件中的 API 定义更新如下内容：\n\n1. `const api = axios.create({ baseURL:\
  \ 'http://w1.weather.gov/xml/current_obs/' });`\n\n你还需要更新 `/quasar.config.js`，将\
  \ axios 文件添加到 boot 选项中（第 30 行）：\n\n1. `boot: ['axios'],`\n\n接下来要查看的是路由器：\n\n```javascript\n\
  children: [\n  {\n    path: '',\n    component: () => import('pages/IndexPage.vue'),\n\
  \    name: 'landing',\n  }, {\n    path: 'station/:id',\n    component: defineAsyncComponent(()\
  \ => import('pages/StationPage.vue')),\n    props: true,\n    name: 'station',\n\
  \  }\n```\n\n之后，需要对 `layouts/MainLayout.vue` 进行一个微小的调整：\n\n```html\n<q-toolbar>\n\
  \  <q-btn flat dense icon=\"arrow_back_ios\"\n    @click=\"goBack\"\n    v-if=\"\
  $q.platform.is.ios && !onIndex()\" />\n  <q-btn flat dense v-else icon=\"\"></q-btn>\n\
  \  <q-toolbar-title>Local Weather</q-toolbar-title>\n</q-toolbar>\n```\n\n第 4 行在这里很重要。它会检查平台和当前页面路径，以判断是否适合显示按钮。\n\
  \n落地页（`pages/IndexPage.vue`）显示了一个简单的表单，几乎不需要覆盖。\n\n站点页（`pages/StationPage.vue`）通过\
  \ `onMounted` 生命周期钩子获取所需数据：\n\n```javascript\nonMounted(async () => {\n  pageData.value\
  \ = getObservationData(\n    await api.get(`${props.id}.xml`, { responseType: 'text'\
  \ })\n  );\n});\n```\n\n数据来自 NOAA API 的 XML 馈。API 调用被封装在一个可组合函数中，该函数提取数据并返回相同数据的\
  \ JSON 表示，如下：\n\n```javascript\nconst parser = new XMLParser();\nexport function\
  \ useXmlExtract() {\n  const getObservationData = (xml: { data: string | Buffer\
  \ }): ObservationData => {\n    return parser.parse(xml.data).current_observation\n\
  \  }\n  return { getObservationData }\n}\n```\n\n`ObservationData` 数据类型定义在 `components/model.ts`\
  \ 文件中。\n\n这是一个基础应用程序，因此它不应局限于模拟器，但可以使用构建脚本为设备构建：\n\n```bash\nquasar build -m capacitor\
  \ -T iOS\n```\n\n完整的构建说明可以在 https://quasar.dev/quasar-cli-vite/developing-capacitor-apps/publishing-to-store\
  \ 找到。\n\n## 将你的应用程序发布到世界 #contents.xhtml_sc2_387a\n\n一旦构建并测试了应用程序，下一步就是将其推向现实世界，即让人们看到。\n\
  \n如果你的应用程序是 Web 类型应用（SPA、PWA 或 SSR），那么你的选择与其他任何纯前端项目相同。由于应用程序的后端是远程的（基于 JSON 或 GraphQL\
  \ API 的服务器应用），可以将后端和数据库托管在一个地方。在许多情况下，后端服务托管在 Amazon Web Services、Heroku 或某些共享托管平台上。前端可以托管在其他地方，例如\
  \ Netlify 或 Vercel。\n\n移动原生应用程序的部署过程更为复杂。尽管你可以自己托管应用包并提供安装说明，但通过提交并让你的应用接受且在移动应用商店中使用，你会获得更好的收益。\n\
  \n## 结论 #contents.xhtml_sc2_388a\n\n为移动原生进行构建，你仅触及了 Quasar 可用功能的皮毛，它开启了一系列新的能力。\n\
  \n本章仅触及了 Quasar 可用功能的皮毛，但希望你能看到它的潜力。\n\n这是最后一章。下一章将涵盖面试中可能会问的问题。\n\n## 需要记忆的点 #contents.xhtml_sc2_389a\n\
  \n- 框架允许你从 Web 添加和删除多个目标。\n- Quasar 具有实用程序，让与不同平台的工作变得更简单。\n- Cordova 插件让你免于处理设备能力的底层细节。\n\
  - 由于其插件化本质，该框架易于扩展。\n- 你拥有一个单一代码库，可以交叉编译到多个输出目标；通过使用内置的平台检测，你可以提供特定平台的功能。\n- 部署到应用商店可能是复杂的、耗时的，并且有时带有相关成本。\n\
  \n## 关键术语 #contents.xhtml_sc2_390a\n\n- 多租户 (Multi-tenancy)\n- 单一代码库 (Single codebase)\n\
  - Cordova\n- Capacitor\n- PWA\n- SSR\n- SPA\n- 移动原生 (Mobile native)\n- 扩展 (Extensions)\n\
  - 插件 (Plugins)\n- 实用程序 (Utilities)\n- 组件 (Components)\n- 屏幕检测 (Screen detection)\n\
  - 平台检测 (Platform detection)\n- 输出目标 (Output target)\n- 构建上下文 (Build context)\n-\
  \ 组件库 (Component library)\n- 启动文件 (Boot file)\n- Quasar 实例 (Quasar instance)\n-\
  \ 设备模拟器 (Device simulator)\n- iOS\n- Android\n- 应用商店 (App store)\n- Google Play\
  \ 商店\n\n\n\n\n\n# 问题：使用 TypeScript 替代 JavaScript 有什么好处？你能提到一些相关的优势或缺点吗？\n\n答案：`TypeScript`\
  \ 在许多方面与 `JS` 相同；事实上，它就是 `JS`，正如第 3 章以及额外积分 `HTML`、`CSS` 和 `JS/TS` 所解释的那样。主要区别在于能够显式地定义特定变量或数据结构应该具有的类型。这些额外信息仅供\
  \ `TS` 类型检查器和编译器使用，以确保可用正确的数据。在运行时，这些类型标记并不存在，这可能会让缺乏经验的开发者感到一些困扰。类型检查器使用的严格性是可以更改的，但最佳实践是使用严格模式。许多\
  \ `IDEs` 可以提供显著的支持。\n\n通过这种方式，`JS` 中存在的一整类错误（错误或不可用的数据）可以被消除。这改进了开发者体验，并在某种程度上降低了应用的维护成本。你确实需要考虑初始开发成本的略微增加，但通过预先合理选择类型，可以将这种成本降到最低。\n\
  \n通过编译器，`TS` 还可以通过编译掉版本不兼容的语法并在必要时允许填充（poly-fills）来针对不同的 `JS` 版本或平台。\n\n虽然 `TS`\
  \ 在更新和改进原始 `JS` 方面取得了巨大进步，但它仍然存在 `JS` 开发者所经历的许多根本问题。它绝不是完美的。\n\n来自 `JS` 世界时，变量中存储的数据是动态的且没有显式说明，`TS`\
  \ 的严格性可能会带来学习曲线。当花费时间“取悦编译器”时，这可能会带来一些额外的挫败，但回报通常大于总成本。再加上类型定义被放置在代码标记之间的这一额外因素，增加了行内噪声，并取决于类型命名规范，增加了行长度。\n\
  \n需要记住的一个小问题是，`TS` 使用的类型推断引擎与其他推断引擎（如 `Haskell`、`Idris`、`OCaML` 甚至 `Scala` 使用的引擎）相比仍然相当不成熟。在处理旨在用于许多不同数据类型的高度抽象函数代码时，它有时会出错。这使得某些\
  \ `Haskell` 等语言中可用的功能在 `TS` 中无法实现。\n\n# 问题：使用组件构建 UI 与传统的 Web UI 方法有何不同？\n\n答案：在传统意义上构建网站时，通常将标记（`HTML`）与样式（`CSS`）以及事件处理或动态元素（`JS`）分离。即使一个网站可能由数百个文件组成，但每个文件的内容很大程度上都致力于上述的某一方面。当你考虑可能穿插在整个代码库中的服务器端编码时，可能还会进一步的边界（或缺乏边界），特别是在处理模板引擎以及（如果运气好，程度较小的话）数据库或业务逻辑时。\n\
  \n即使是处理简单的基于客户端-服务器模型的应用程序，做出相对简单或无害的更改也可能影响许多元素：模板或代码文件、`CSS` 规则、`JS` 行为，所有这些都需要测试。在这种情况下，测试不能仅针对更改区域，而需要对网站的“不相关”部分进行更广泛的、通常是手工的回归测试：更改可能会导致意外之外的泄漏。尽管这可能是“最坏情况”，但\
  \ Web 的很大一部分都是这样构建的。\n\n在使用基于组件的框架时，前端和后端代码是严格分离的。通常，这些框架主张数据通过远程 `API` 访问，使得服务器端独立于渲染后的前端。\n\
  \n在大多数基于组件的框架中，描述组件的代码通常一起保持在同一个代码文件中，由编译器为你管理所有不同的部分。组件文件将相关的模板、`CSS` 和 `JS/TS`\
  \ 代码结合在一起。一个主要的后果是，当需要对组件进行维护时，该更改的影响被降到了最低；它可以作为一个孤立的实例进行单元测试。回归测试也可以大部分实现自动化，将人为因素和变数排除在考虑。\n\
  \n轻微的缺点是某些业务逻辑想法、范式或代码可能会在服务器和客户端之间重复，这会产生维护成本；遗憾的是，没有免费的午餐。\n\n# 问题：什么是 SOLID？它是如何应用于\
  \ JS/TS 的？它真的适用吗？\n\n答案：`SOLID` 是那些被挂在嘴边的缩写词之一，你可能在不知道或未详细理解的情况下就一直在使用它。这个记忆法描述了在设计良好的对象代码中应该利用的思想。\n\
  \n将其拆解为单个元素，我们得到以下内容：\n\n* **单职责原则 (S)**：一个对象应该只负责一件事。如果接收者需要更改，或者需要从其（调用者）职责之外接收东西，对象应该向其他对象发送消息（通常通过方法调用）。设计良好的\
  \ `OOP` 代码应该是所有共同工作的对象的网格。\n* **开闭原则 (O)**：对象应该对扩展开放，但对修改关闭。这意味着在实践中，对象应该已经经过了完全测试，因此更改它们往往会引入错误。通过仅进行扩展和使用多态替换（继承层次结构或接口），可以写出可维护的代码。\n\
  * **里氏基夫替换原则 (L)**：简单来说，这个原则意味着任何从父类派生的子类都应该能够替代父类——一个（派生的）子类不会改变已建立的行为。\n* **接口\
  \ (I)**：代码应该根据特定的合同来构建：即 `interface`。接口应该是小的，使用它们的类应该实现许多接口，而不是有一个单一的“神级”接口。以这种方式构建的代码对象是可交换的，元素可以更专门。\n\
  * **依赖倒转原则 (D)**：该原则涵盖了通过抽象实现类之间的解耦。不成熟的 `OOP` 代码使用类的实例化——导致类之间的耦合。通过 `DI`，所需的对象在许多情况下通过依赖倒转（或注入）容器提供。通过这种方式，具体类的相关性显著降低。\n\
  \n这些概念适用于像 `JS` 这样的语言吗？答案是，这取决于。如果公司的风格主要是 `OOP`，那么答案是肯定的。它适用。这是在使用 `OOP` 语言时的当前最佳实践，也是面试中经常被问的问题之一，特别是在使用\
  \ `Java`、`C#`、`Ruby`、`Python` 和/或 `PHP` 的企业环境中。如果你在利用 `FP` 的软件公司工作，不太适用，但你应该了解它。\n\
  \n关于此点的更多细节可以在 Robert Martin 的原始著作中找到：[`web.archive.org/web/20150906155800/http:/www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf`](https://web.archive.org/web/20150906155800/http:/www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf)。\n\
  \n# 问题：什么是 OOP？什么是 FP？哪种更好？\n\n答案：这些是描述软件工程不同方面的范式。这些通常是工业界使用的两种主要的范式，但也有其他的。你最可能使用的范式是面向对象编程，其次是函数式编程。它们是根本上不同的范式。\n\
  \n\n\n\n\n# 编程范式\n\n## OOP（面向对象编程）\n面向对象编程是一种基于“对象”概念的编程范式，对象可以包含数据和代码。数据以属性的形式存在，代码以方法的形式存在（改写自\
  \ [`en.wikipedia.org/wiki/Object-oriented_programming`](https://en.wikipedia.org/wiki/Object-oriented_programming)）。\n\
  \n## FP（函数式编程）\n函数式编程是一种通过应用和组合函数来构建程序的编程范式。它是一种声明式编程范式，其中函数是表达式的树，用于将值映射到其他值，而不是更新程序运行状态的命令式语句序列（取自\
  \ [`en.wikipedia.org/wiki/Functional_programming`](https://en.wikipedia.org/wiki/Functional_programming)）。\n\
  \n许多传统上坚定支持 OOP 的语言正开始引入 FP 思想和流程，以吸引尽可能广泛的受众，并为现代时代提供顶尖的工具。人们日益认识到，一种方法并不适用于所有情况，工程师的需求是至关重要的，而不是语言设计者的哲学。\n\
  \n至于哪种范式更好，这最好交由个人或职业选择。作者倾向于在可能的情况下 FP，但理解有时针对特定情况的最优工具是将问题领域描述为一组共同工作的对象。务实而非教条可以促进更好的软件和工作实践蓬勃发展。\n\
  \n## MVC 模式\n\n**问题：** 什么是 MVC？MVC 是否适用于基于组件的应用程序结构？\n\n**回答：** `MVC` 是一种标准的设计模式，代表模型-视图-控制器（Model-View-Controller）。这些元素协同工作，如图\
  \ 17.1\n\n图 17.1：模型、视图、控制器设计模式\n\n**模型（Model）**：模型描述并管理数据以及对数据存储的访问。\n\n**视图（View）**：视图用户界面的描述；它包含\
  \ HTML 元素和 UI 事件处理器。视图本质上是“笨”的。\n\n**控制器（Controller）**：控制器协调另外两个元素协同工作。\n\n虽然 `MVC`\
  \ 是许多事务的优秀模式，并在 Web 2.0 革命中处于基础地位，但它并不适用于前端框架。一些更好的模式，如`模型、视图、视图模型`（`MVVM`）或`模型、视图、演示器`（`MVP`），允许比传统的\
  \ `MVC` 使用更智能的视图逻辑。\n\n![自动生成的图描述](img/figure_17.2.png)\n\n图 17.2：MVVM 设计模式\n\n\
  **问题：** 组合 API（Composition API）还是选项 API 更好？为什么？\n\n**回答：** 这类问题的答案具有高度主观性。符合面试官偏好的回答无论你如何想，都可能让你获得分数。如果你发现你的视图与面试官一致，那就太好了。\n\
  \n假设你需要对这个问题采取更稳妥的策略。最好的方法是说明每种方法都有自己的优点。`Options API` 是一个成熟且文档齐全的 API。它是 `Vue2`\
  \ 中构建组件的方式，因此可能会有大量的迁移代码。使用这样的代码，很容易构建相关组件的层级结构，但并不容易隔离跨组件的功能。`Composition`（组合）是使用\
  \ `Vue3` 构建应用程序更现代的方式。这种想法解决了上述问题，允许更精简的组件和跨功能的、可重用的代码。\n\n**问题：** 你如何处理需要将信息从子组件传回父组件的事件？\n\
  \n**回答：** `Vue.js` 处理数据的通用方式是父组件通过 `props` 机制向子组件提供数据；这是单向数据流。这里有一些替代方案：\n\n*  \
  \ 最适用于深层层次结构的 `provides/injects` 机制\n*   可组合服务（Composable services）\n*   如 `Pinia`\
  \ 等状态管理工具\n\n为了将数据传回父组件，需要使用自定义事件，这可以确保输出是正确的。在使用 UFF（工具优先框架）时，需要通过 `prop` 来确保数据流，这在某些情况下是可行的。\n\
  \n此外，为了将数据传递回父组件，需要使用自定义事件，这可以确保输出是正确的。这种自定义事件通常需要更多工作，但这种方式是比较脆弱的。\n\n![自动生成的图](img/figure_17.3.png)\n\
  \n图 17.3：单向数据流\n\n再次，数据流的替代方案是像 `Pinia` 这样的状态管理工具。\n\n**问题：** 解释测试。\n\n**回答：** 我们在第\
  \ 14 章](#ch14) 中详细介绍过测试。对于 Vue.js，测试策略由以下部分组成：\n\n*   **单元测试（Unit tests）**：这些是简单的测试，通过输入来验证输出是否正确。\n\
  *   **集成测试（Integration tests）**：这些是跨多个单元协同工作的测试。\n*   **端到端测试（End-to-end tests）**：这些测试模拟整个用户旅程。\n\
  \n其他测试类型还包括负载测试、回归测试、黑盒测试、冒烟测试和压力测试。\n\n良好的测试机制可以确保交付的代码更加可靠。这种增加的确定性有助于维护任务。在构建可测试代码时，需要考虑创建单元测试的开发投入。在构建测试时需要注意以下几点：\n\
  \n*   确保测试不取决于特定的实现。它们不应该关注输入之间的情况，而需要在给定输入的情况下确保输出是正确的。\n*   检查合理的边缘情况比实现 100%\
  \ 代码覆盖率更重要。\n*   如果使用不当，测试可能会变成一种粗器工具。需要投入思考以确保测试具有意义。任何不可测试的代码都应该重构以确保其正确性。\n\n\
  **问题：** 基于组件的 CSS 框架（如 Twitter Bootstrap）与工具优先框架（如 TailwindCSS）之间有什么区别？什么情况下适用于某一种？\n\
  \n**回答：** 像 Twitter Bootstrap 或 Zurb Foundation 这样主要的基于组件的 CSS 框架，对底层 HTML 的结构有固定的意见。这可以将\
  \ HTML 简化为从框架文档中复制粘贴的操作，以实现正确的样式。\n\n虽然以这种方式构建代码可以使元素在站点之间保持一致，但在使用 Vue 等前端框架工作时，这种对特定\
  \ HTML 布局的要求可能会具有限制性。\n\n在使用像 TailwindCSS 这样的工具优先框架（UFF）时，样式规则基于规则的功能而不是构建 UI 的某个方面。这意味着可用规则更多。它们更容易组合和组合以创建应用程序所需的样式方案。UFF\
  \ 通常比基于组件的框架更容易进行主题化和配置。\n\n适用性取决于具体情况以及内部风格或偏好。UFF 更灵活，但实现时间较长，且通常需要编译器支持，但它们的输出尺寸较小。相反，基于组件的框架虽然输出较大，但它们为你提供了一种依赖有限设置的一致构建方式。\n\
  \n\n\n\n\n## 问题\n\n## 问题：解释 HTML 文档的结构。在哪里提供样式信息最为合适？用户交互或页面行为又该如何处理？\n\n类似于：解释\
  \ HTML 提供的不同类型的元素。\n\n**答案：** HTML 文档由一个简单的文本文件组成，包含由 `<` 和 `>` 标识的标签。\n\n在基础的 `<html>`\
  \ 标签内，HTML 文档包含两个主要部分：`<head>` 和 `<body>`。\n\n`<head>` 部分包含所有相关的页面元数据，并为任何属于样式表和脚本类别的外部资源设置请求。它还存储了有关\
  \ SEO 的信息，如页面标题、关键词、Facebook 和/或 Twitter（或其他社交媒体）详情以及页面字符集类型等。除了页面标题外，这些元素对访问者来说是不可见的。\n\
  \n`<body>` 部分包含页面内容、视觉元素以及你希望向访问者或用户展示的交互性。这些视觉标签可以进一步细分为结构性（块级）标签和表现性（内联）标签。\n\n\
  结构性标签（如 `<main>`、`<section>` 或 `<div>`）表示页面部分，并用于创建页面层级结构。结构性标签可以包含其他结构性标签以及表现性标签。\n\
  \n表现性标签（如 `<h1>`、`<b>`、`<span>`）用于提供基础样式信息，这些信息可以通过样式表进行增强或取代。表现性标签只能包含其他表现性标签，不能包含结构性标签。\n\
  \n## 问题：你对无障碍性（accessibility）如何理解？它为什么重要？HTML 提供了什么帮助满足无障碍标准？你能列出相关的无障碍标准吗？\n\n\
  **答案：** 我们没有为这个问题提供标准类型的答案，而是提供一些提示，因为这个问题的答案取决于你所在的地理位置。\n\n你需要明确你就业所在地管辖区的无障碍性规则。这是因为尽管有\
  \ `WCAG` 指南，但世界不同地区对无障碍性有不同的规定，特别是欧盟国家或美国。重点是你需要意识到这一点，特别是如果你在某个管辖区（例如印度）构建 Web\
  \ 应用，而它将在另一个地方（例如欧盟）使用。欧盟有管理无障碍性的特定严格法律，你需要根据这些法律调整产品，否则将无法进入市场。\n\n许多网站构建者认为为 Web\
  \ 应用添加无障碍功能是事后考虑的或麻烦，但事实并非如此。构建无障碍的 Web 应用应该是从初始设计阶段开始的要求；这些问题需要从一开始就进行评估、考虑和实施，以确保无论能力如何，尽可能多的人都能访问你构建的产品。\n\
  \n在最基础的，你应该了解当前的 `WCAG 2.x` 标准，该标准可以在 `https://www.w3.org/WAI/standards-guidelines/wcag/`\
  \ 找到。如果你需要对该主题的介绍，应该访问 `https://www.w3.org/WAI/standards-guidelines/wcag/faq/#start`。\n\
  \n## 问题：剩余运算符（rest operator）和扩展运算符（spread operator）之间有什么区别？\n\n**答案：** 从视觉上看，剩余运算符和扩展运算符使用的标记是相同的。然而，它们在功能上是不同的。\n\
  \n*   **剩余运算符（Rest Operator）：** 用于函数定义，将多个参数收集到一个数组中。\n*   **扩展运算符（Spread Operator）：**\
  \ 与剩余运算符相反。它将数组或对象展开为单独的元素。\n\n## 问题：什么是解构赋值（destructuring assignment）？\n\n**答案：**\
  \ 解构赋值允许你将数组中的值或对象中的属性解包到不同的变量中。这是现代 JavaScript 中一种常见的模式，使代码更具可读性。\n\n## 问题：解释 Vue.js\
  \ 的生命周期。\n\n**答案：** Vue.js 生命周期是指组件从创建到销毁所经历的阶段。Vue 提供了各种生命周期钩子（hooks），允许开发者接入每个阶段以执行特定的逻辑。\n\
  \n## 问题：在 Vue Router 中哪里检查权限最为合适？\n\n**答案：** 最佳实践是使用导航守卫（navigation guards）检查权限。这允许你在组件加载之前拦截导航请求。\n\
