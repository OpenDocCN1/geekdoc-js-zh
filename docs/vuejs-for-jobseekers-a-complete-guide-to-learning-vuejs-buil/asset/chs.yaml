  ![图形用户界面、文本、应用程序、电子邮件描述自动生成](img/figure_7.5.png)\n\n图 7.5: 预设页面\n\n从这里，我们将进入配置界面：\n\
  \n![图形用户界面、文本、应用程序 描述自动生成](img/figure_7.6.png)\n\n图 7.6: 功能配置界面\n\n从那里，我们将按照下面的图配置\
  \ Vue 版本和其他内容：\n\n![图形用户界面、文本、应用程序 描述自动生成](img/figure_7.7.png)\n\n图 7.7: 配置界面\n\n\
  当你在此处创建项目时，将面临一个将配置保存为预设的选项：\n\n![图形用户界面、文本、应用程序 描述自动生成](img/figure_7.8.png)\n\n\
  图 7.8: 保存预设界面\n\n完成此表单或继续保存预设；UI 向导将开始构建你的项目，之后你将到达这里：\n\n![图形用户界面、应用程序、网站 描述自动生成](img/figure_7.9.png)\n\
  \n图 7.9: 完成向导后显示的项目仪表板\n\n当你到达这里时，项目的设置方法与上一节相同，但在这里你可以探索额外的插件、依赖项、配置和任务。我们现在不会从这里安装任何其他东西，但请花时间熟悉一下。这些屏幕上有很多非常有用的内容。\n\
  \n## 使用 Vite 创建项目\n\n使用 `Vite` 设置项目更加简单，而且它正迅速成为项目脚手架的标准方式。\n\n以下代码创建了应用的基础，速度非常快：\n\
  \n1. `npm create vite@latest speedy-pizza-e-commerce-prototype -- --template vue-ts`\n\
  2. `npx: installed 6 in 1.247s`\n3. `Scaffolding project in /speedy-pizza-e-commerce-prototype...`\n\
  4. `Done. Now run:`\n5. `cd speedy-pizza-e-commerce-prototype`\n6. `npm install`\n\
  7. `npm run dev`\n\n最后三行是下载所有所需依赖项并以开发模式启动项目的指令。\n\n## 总结\n\n本章介绍了设置和管理项目及其依赖项的基础知识。这些基础知识包括使用\
  \ `NPM` 和 `Git`，以及设置 `Vue.js` 项目。\n\n这里介绍的工具都是行业标准；你将在 Web 项目中经常使用这些工具。然而，像 `Git`\
  \ 这样与语言无关的工具也用于许多其他类型的项目；这是一个非常重要、需要了解并加入你的技能树的工具。\n\n## 要记忆的点\n\n### Git\n\n`Git`\
  \ 是一个分布式代码管理系统。通常，远程仓库被视为单一事实来源。\n\n通常，在克隆仓库后，代码库通过分支进行管理，做出所需的更改，将代码更改添加（或暂存）到提交中，执行提交，然后将这些更改推送到远程仓库。你的本地副本通过从远程获取和拉取代码来保持更新。\n\
  \n代码提交也可能被重基（rebase，以管理历史）或检选（cherry-pick）到源分支。\n\n源代码的管理在很大程度上由你组织的文档或流程规定或控制。\n\
  \n### NPM\n\nJavaScript 项目依赖项使用包管理工具进行管理；我们在本书中选择的是标准的 `NPM`。这意味着除了安装 node 之外，我们不需要担心安装任何东西来帮助管理依赖项。其他工具可用，例如\
  \ `Yarn`，但一旦你理解了如何使用 `NPM`，学习 `Yarn` 就会轻而易举。\n\n`NPM` 用于从项目中安装、更新和删除包。它是同时用于 Web\
  \ 和服务器（Node.js）应用程序的标准工具。来自其他生态系统的许多服务器端工具也可能使用 `NPM` 来管理客户端依赖项。\n\n项目所需的所有内容通常存储并管理在\
  \ `package.json` 文件中。很多情况下，这就是你应用程序的代码。\n\n### Vue.js CLI\n\n`CLI` 主要是用于创建和管理 `Vue2`\
  \ 应用的工具。对于 `Vue3`，它大部分已被 `Vite` 代代。\n\n使用 `CLI` 创建应用有完善的文档，而且相对简单。\n\n### Vue.js\
  \ UI\n\n`UI` 是 `CLI` 的视觉封装。你通过 `CLI` 可以获得的所有功能在 `UI` 中都可用。`UI` 以更清晰的格式呈现信息，使管理变得更容易。\n\
  \n### Vite\n\n`Vite` 是 `Vue.js` 全新的脚手架工具。它简单且快速。这是处理 `Vue3` 应用的首选工具。\n\n## 关键术语\n\
  \n*   Checkout（检出）\n*   Cloning（克隆）\n*   Pull（拉取）\n*   Push（推送）\n*   History（历史）\n\
  *   Repository（仓库）\n*   Rebase（重基）\n*   Cherry-pick（检选）\n*   Remote（远程）\n*   Merge（合并）\n\
  *   Patch（补丁）\n*   Origin（源）\n*   Package.json\n*   NPM\n*   Init（初始化）\n*   Audit（审计）\n\
  *   CLI\n*   UI\n*   Vite\n*   Dependency（依赖项）\n*   Packages（包）\n\n## 问题\n\n1. 在本地初始化一个新的\
  \ git 仓库。\n2. 注册 GitHub 或 Bitbucket 并你创建的仓库链接到此远程仓库。\n3. 使用 `Vite` 在之前创建的 git 中创建应用脚手架，添加代码，创建初始提交，并将更改推送到远程。\n\
  4. 检查远程仓库以确保你的代码已到达。\n\n加入我们书籍的 Discord\n\n加入书籍 Discord 空间获取最新更新、优惠、全球科技动态、新发布以及与作者的交流会：\n\
  \n**[`discord.bpbonline.com`](https://discord.bpbonline.com)**\n\n![](img/fm1.png)\n\
  \n# 第 8 章在混合中加入 CSS 框架 —— TailwindCSS、Bootstrap 或 Foundation](#contents.xhtml_ch08a)\n\
  \n## 引言\n\n在上一节中，我们启动了项目；项目文件已就绪，等待我们新组件的构建。本节将加快节奏，我们将查看一个 CSS 库，在本例中为 Tailwind。\n\
  \n## 结构\n\n在本节中，我们将探讨以下主题：\n\n*   TailwindCSS 及其在 Web 开发生态中的地位\n*   TailwindCSS\
  \ 配置基础\n*   使用 TailwindCSS\n*   将 Tailwind 引入 Vue.js 项目\n*   添加纯 CSS 框架\n*   Twitter\
  \ Bootstrap\n*   Zurb Foundation\n\n## 目标\n\n在本节中，我们将稍微偏移。不再假设集成和使用 CSS 框架是简单的，而是这样做。对于本书，我们将使用\
  \ TailwindCSS，这是一种 CSS-in-JS 框架，目前是业界之星。\n\n我们还将查看如何集成其他更传统的 CSS 框架 —— Twitter Bootstrap\
  \ 和 Zurb Foundation。\n\n\n\n\n\n前段提到的 CSS 框架主要是基于组件的框架。这意味着 CSS 的设计初是为了与以特定方式编写的\
  \ HTML 以及特定的 CSS 类配合使用，以构建各种“组件”。这些组件的构建方式有时与你需要构建的组件的逻辑关注点冲突。这并不是说这些框架没有用，它们在现代\
  \ Web 开发中有其用武，并且许多公司在使用它们。\n\n`TailwindCSS` 采用了不同的哲学。它不是将“组件”概念作为开发的基本单元，而是（Tailwind）通过将可用的工具类限制在一组标准的选择器中，这些选择器可以根据需要进行自定义。\n\
  \n这种“实用优先”（utility-first）的方法意味着，作为一个开发者，你不需要花费精力去思考 CSS 类名、设计自定义 CSS，或者去应付不同浏览器的\
  \ CSS 要求。这一概念的意义在于你拥有一组集中的 CSS，而不需要增加你的 CSS 文件的大小；你所需的一切都是从配置文件编译而来的。在实践中，这意味着你是在本地\
  \ HTML 级别进行工作，并可以使用从全局工具类中复用的 CSS 类。\n\n`Tailwind` 与其他更传统的框架略有不同之处在于它是一个 CSS-in-JS\
  \ 框架。这意味着它使用 JavaScript 从设置文件中编译出所需的全局 CSS。\n\n现在我们已经对 `Tailwind CSS` 是什么有了基本的了解，我们将详细查看如何使用它。\n\
  \n## TailwindCSS 配置与基础\n\n我们将在下一节中介绍如何在 Vue.js 项目中安装 Tailwind；在这一节中，我们将讨论如何配置 Tailwind\
  \ 以及使用它的基础。在构建应用程序的过程中，你将获得更多练习，但如果你从未见过它，这有助于你建立对该技术的基础。\n\n### 配置\n\n自定义是使用 Tailwind\
  \ 的核心。因为可用选项很多，起初可能会相当困惑。\n\n首先，所有配置都放在一个名为 `tailwind.config.js` 的文件中，该文件需要放在项目的根目录下，项目的\
  \ `package.json` 文件旁边。此文件是可选的；如果不存在，Tailwind 将回退到默认配置。此外，未未定义的任何元素都将回退到此默认配置。你可以在\
  \ GitHub 的 `https://github.com/tailwindlabs/tailwindcss/blob/master/stubs/defaultConfig.stub.js`\
  \ 查看 Tailwind 的默认值。\n\n最简单的方法是使用 `npm tailwindcss init -p` 让 Tailwind CLI 为你生成基础文件，它会创建一个包含最小所需选项的文件，这些选项也会回退到默认值。这还将\
  \ Tailwind 设置为 postcss 插件。\n\n该文件的内容是一个导出的 JSON 集合，具有以下一个或多个键：\n\n* `content`\n\
  * `theme`\n* `plugins`\n* `presets`\n* `prefix`\n* `important`\n* `separator`\n\
  * `corePlugins`\n\n在这些键中，我们只讨论前三个。其余部分超出了本文的范围。\n\n### 配置选项\n\n有多种方法可以提供配置选项；让我们来看每一个。\n\
  \n#### 作为键值对\n\n这是为特定键分配单一值最简单的方法：\n\n```javascript\nmodule.exports = {\n  //...\n\
  \  colors: {\n    white: '#fff',\n    //  ...\n  },\n  //...\n}\n```\n\n#### 作为选项列表\n\
  \n与键值对类似，它根据给定的列表针对设置键生成相应的 CSS：\n\n```javascript\nmodule.exports = {\n  //...\n\
  \  fontFamily: {\n    sans: ['Raleway', 'Serenity', 'sans-serif'],\n    ...\n  }\n\
  \  //...\n}\n```\n\n#### 作为选项对象\n\n选项对象允许你针对父键设置子键值对，这样当编译最终的 CSS 时，它将成为规则 `<type>-<parent>-<child>`\
  \ 的一部分，例如列表所示的 `border-green-100`：\n\n```javascript\nmodule.exports = {\n  //...\n\
  \  colors: {\n    green: {\n      100: '#ebf4ea',\n      200: '#bedfc4',\n     \
  \ //...\n    }\n    //...\n  },\n  //...\n}\n```\n\n#### 作为主题引用闭包\n\n在构建 CSS 配置时，你可能需要访问作为主题一部分定义的数值。为了实现这一点，你可以提供一个匿名函数，该函数提供一个\
  \ `theme()` 函数，可以使用该函数来访问这些值。\n\n注意，你不能访问此函数来返回简单值；这种类型的函数只能应用于顶层，即 CSS 选择器级别；请参见示例。此外，由于\
  \ Tailwind 使用了嵌套对象语法，检索到的值必须使用点符号或方括号符号，如下所示：\n\n```javascript\nmodule.exports =\
  \ {\n  theme: {\n    borderColor: (theme) => ({\n      ...theme('colors').blue.100\n\
  \    })\n  }\n}\n```\n\n#### 作为默认主题\n\n如果你需要引用默认主题中的值，可以通过导入默认主题来实现：\n\n```javascript\n\
  const defaultTheme = require('tailwindcss/defaultTheme')\nmodule.exports = {\n \
  \ theme: {\n    extend: {\n      fontFamily: [\n        ...defaultTheme.font\n \
  \     ]\n    }\n  }\n}\n```\n\n### Content\n\n`content` 部分是使用 Tailwind 类的路径列表。\n\
  \n```javascript\nmodule.exports = {\n  content: [\n    \"./index.html\",\n    \"\
  ./src/**/*.{vue,js,tsx}\"\n  ]\n}\n```### Theme\n\nTheme 部分是你定义构建视觉效果所需选项的地方。我们指的是实际的配置选项：颜色；字体和大小；间距等。\n\
  \n#### 颜色、间距和屏幕\n\ncolors 键键用于设置项目的调色板。颜色可以定义为颜色名称与 CSS 颜色值（如 `blue`）、颜色十六进制代码（如\
  \ `#000` 或 `#c5f4e1`）或 RGB 字符串（如 `rgb(4 65 255)/75`）之间的映射。你也可以设置一个颜色对象来提供相同颜色的不同深浅，按任意数量分级，如默认主题示例中所示：\n\
  \n```javascript\nmodule.exports = {\n  theme: {\n    colors: {\n      orange: {\n\
  \        50: '#fff7ed',\n        100: '#ffedd5',\n        200: '#fed7aa',\n    \
  \    300: '#fdba74',\n        400: '#fb923c',\n        500: '#f97316',\n       \
  \ 600: '#ea580c',\n        700: '#c2410c',\n        800: '#9a3412',\n        900:\
  \ '#7c2d12'\n      }\n    }\n  }\n}\n```\n\n这允许你将相似的颜色分组，以便可以使用点符号进行访问，例如 `text-orange-600`。\n\
  \n类似地，我们可以配置间间距和屏幕尺寸断点。然而，与其覆盖所有提供的设置，不如对其进行扩展以满足你自己的需求。这样，你就可以受益于设计默认值所花费的无数工时，并且可以说不需要重新发明轮子。\n\
  \n\n\n\n例如，扩展主题间距可以通过添加如下所示的设置来实现， 17、18 和 19：\n\n```javascript\nmodule.exports\
  \ = {\n  theme: {\n    extend: {\n      spacing: {\n        '17': '4.25rem',\n \
  \       '18': '4.5rem',\n        '19': '4.75rem'\n      }\n    }\n  }\n}\n```\n\n\
  默认的间距设置和其他信息可以在 https://tailwindcss.com/docs/customizing-spacing#default-spacing-scale\
  \ 找到，那里列出了所有提供的尺寸列表。\n\n间距设置用于为 padding（内边距）、margin（外边距）、width 和 height 等 CSS 规则提供宽度设置，例如\
  \ `px-4`；`m-10`。\n\n`screens` 部分用于定义项目所需的断点——Tailwind 本身为 `min-width` 媒体查询设置提供了一组合理的默认值。它们像任何其他提供的值一样被扩展或覆盖。\n\
  \n如果你提供一个包含 `max` 键的对象，那么生成的断点将返回 `max-width` 而不是 `min-width`，如下：\n\n```javascript\n\
  module.exports = {\n  theme: {\n    screens: {\n      '2xl': {'max': '1900px'},\n\
  \      // => @media (max-width: 1900px) { ... }\n      ...\n    }\n  }\n}\n```\n\
  \n`screens` 设置用于为类添加前缀，以便在该断点应用选定的类，例如 `sm:text-right` `md:text-center`。\n\n在 `theme`\
  \ 部分中，当你创建一个规则时，你会针对一个键构建样式定义——该键就是样式的名称。这个键被映射到一个函数，称为 `plugin`（插件）。插件是下一节的主题。\n\
  \n## 插件 (Plugins)\n\nTailwind CSS 类定义由插件提供。插件的名称方便地与 JS CSS API 样式规则名称相同，例如 CSS\
  \ 的 `border-width` 是 `borderWidth`，以此此类推。\n\n插件也可以自定义创建，通过 JS 将样式注入到项目样式表中，而不是手动编写\
  \ CSS。\n\n有一些在 Tailwind 核心安装包之外维护的官方插件。它们如下：\n\n* `@tailwindcss/typography`\n* `@tailwindcss/forms`\n\
  * `@tailwindcss/line-clamp`\n* `@tailwindcss/aspect-ratio`\n\n如果你想使用它们，首先需要使用 NPM\
  \ 将它们添加到项目中，然后添加到配置文件中：\n\n```javascript\nmodule.exports = {\n  // ...\n  plugins:\
  \ [\n    require('@tailwindcss/typography'),\n    require('@tailwindcss/forms'),\n\
  \    require('@tailwindcss/line-clamp'),\n    require('@tailwindcss/aspect-ratio'),\n\
  \  ]\n}\n```\n\n构建自定义插件需要你导入 Tailwind 插件函数。当使用此函数时，Tailwind 为匿名回调函数提供一个单一对象参数，该参数可以解构为一些辅助函数，其中最重要的函数如下：\n\
  \n* `addUtilities` - 用于注册新的静态工具样式\n* `matchUtilities` - 用于注册新的动态工具样式\n* `addComponents`\
  \ - 用于注册新的静态组件样式\n* `theme` - 用于在用户的主题配置中查找值\n* `config` - 用于在用户的 Tailwind 配置中查找值\n\
  \n以下列表显示了如何使用 `plugin` 函数：\n\n```javascript\nconst plugin = require('tailwindcss/plugin')\n\
  \nmodule.exports = {\n  plugins: [\n    plugin(function({ addUtilities, theme })\
  \ {\n      // 在此处添加你的自定义样式\n    }),\n    ...\n  ]\n}\n```\n\n我们不会对自定义插件进行更多详细介绍，因为它们超出了本书的范围，但更多细节可以在\
  \ https://tailwindcss.com/docs/plugins 找到。\n\n## 使用 TailwindCSS\n\n一旦配置完成，使用 Tailwind\
  \ 实际上非常简单。你只需要提供 CSS 类来样式化描述内容的 HTML 骨架。\n\n（注：输入文本包含大量重复内容，已根据要求合并并清理为唯一的逻辑结构。）\n\
  \n\n\n\n3. ```javascript\nimport \"bootstrap/dist/css/bootstrap.min.css\"\n```\n\
  4. import \"bootstrap\"\n\n当你完成此更改并运行项目时，你将可以使用 Bootstrap CSS 和组件。从这里开始，你可以使用 Bootstrap\
  \ 的数据属性来根据需要提供数据和功能，也可以用 Vue.js 组件封装 Bootstrap 提供的组件，并构建一个你自己的组件库来使用。关于 Bootstrap\
  \ 的更多详细信息，可以在 [`getbootstrap.com`](http://getbootstrap.com) 找到。\n\n## Zurb Foundation\n\
  \n从执行相关的导入开始：\n\n1. ```bash\nnpm i jquery what-input motion-ui foundation-sites\n\
  ```\n\n使用 CSS 最简单的方法是将其直接导入到主文件中，就像 Bootstrap 一样；添加以下内容：\n\n1. ```javascript\n//\
  \ ./src/main.{js,ts}\n```\n\n3. `import 'foundation-sites/dist/css/foundation.min.css'`\n\
  4. `import 'foundation-sites/dist/js/foundation.min'`\n\n在这些导入都准备就绪后，你就可以使用 Foundation\
  \ CSS 了。\n\n## 结论\n\n在本章中，我们涵盖了集成和使用 TailwindCSS 的内容。这里有很多细节，因为它是一个相对新的框架，正受到工业界的广泛关注。\n\
  \n最后，我们查看了如何集成旧的、更著名的 CSS 框架。\n\n## 关键术语\n\n- TailwindCSS\n- CSS-in-JS\n- 优先实用 (Utility-first)\n\
  - 层 (Layers)\n- 组件 (Components)\n- Bootstrap\n- Foundation\n- 插件 (Plugins)\n- 间距\
  \ (Spacing)\n- 主题 (Theme)\n\n加入我们的书籍 Discord 空间\n\n加入书籍 Discord 工作空间获取最新更新、优惠、全球科技动态、新发布以及与作者的交流：\n\
  \n**[`discord.bpbonline.com`](https://discord.bpbonline.com)**\n\n![](img/fm1.png)\n\
  \n# 第 9 章 使用组件构建用户界面\n\n## 引言\n\n到为止，我们已经开始了原型项目并添加了一些基本的 Tailwind 样式定义。\n\n在本章中，我们将构建第\
  \ 5 章 设计基于组件的 UI 和单页应用程序中所讨论页面基础组成部分。在构建了这些较小的组件后，将在将在结束时完成设计的主内容区域的构建。这些将形成我们将进行迭代的构建块，以便我们在接下来的几章中构建额外的功能。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n- 设置可用的文件夹结构\n- 构建基础原型模板\n\n本章要涵盖的内容很多，让我们让我们开始吧。\n\n##\
  \ 目标\n\n本章的主要目标是开始在实际项目的背景下查看 Vue.js。到为止，我们学习了大量的理论，并看到了应用程序在高级层次是如何组合在一起的。现在，我们将熟悉编码，并查看如何结构化项目。\n\
  \n我们将从最开始的地方逐步完成所有设置工作，以便有一个坚固且可用的基础来构建。然后，我们将填充已创建的目录结构。\n\n本章将构成我们示例项目的基础。\n\n\
  ## 设置 – 管理项目文件夹和文件\n\nVue.js 不关心你如何组织文件，只要它能找到它们即可。代码库的结构纯粹是以人为本的活动——一个逻辑的文件夹结构，使用有帮助的甚至是语义化的命名规范，有助于开发工程师和随后的维护工程师快速找到代码所在地。你真正追求的是一种平衡：结构既不能太扁平（导致所有文件都放在同一个文件夹中），也不能太深（以至于在找到要找的内容之前搜索许多分支）。理想情况下，我们设计的结构在\
  \ `/src` 文件夹下最多三或四层。这给了我们足够的范围来构建合理的东西；毕竟我们没有在使用 Java。\n\n当我们使用 `Vite` 生成项目时——正如我们在第\
  \ 7 章 使用 Vue CLI 和 Vite 创建并设置 Vue.js 中所做的那样——我们会得到这样的结构：\n\n![](img/figure_9.1.png)\n\
  \n图 9.1：标准的 Vite 生成的文件夹结构\n\n虽然对于小项目这很好，但一旦项目增长到几个组件或多个关注点，它就不那么有用了。\n\n我们将从 components\
  \ 文件夹中删除 `HelloWorld.vue` 文件，清空 `App.vue` 文件，然后在 `src/` 文件夹中添加以下文件夹：\n\n- `components/pages`\n\
  - `components/pages/site`\n- `components/pages/profile`\n\n这些目录将包含页面组件——每个页面都有自己的文件夹。\n\
  \n- `components/layouts`\n- `components/layouts/common`\n\n这些文件夹将帮助管理定义布局的组件。当我们使用路由构建页面时，这个文件夹将被填充。\n\
  \n- `components/partials`\n\n此文件夹包含小型模板部分，即“部分”模板元素，它们在代码库中被重复用，按关注点组织。\n\n- `composables`\n\
  \n这是我们将放置组合式函数（composable）的地方。\n\n- `routes`\n\n这是路由信息存放的地方。\n\n- `store`\n\n当我们我们需要考虑应用全局状态时，我们将开始填充此文件夹。\n\
  \n图 9.2 显示了你现在的结构：\n\n![](img/figure_9.2.png)\n\n图 9.2：目录\n\n代码组织完成后，我们就可以开始了。\n\
  \n## 构建基础原型模板\n\n在构建组件问题的不同方法中，我们对落地页采用从外向内的方法。我们将在第 10 章使用 `VueRouter` 时讨论构建布局。\n\
  \n## 落地页模板\n\n页面布局\n\n页面布局只是包含所有其他组件的封装组件；它相对简单，正如你所看到的，它紧密遵循线框。\n\n我们将在 `components/pages/site`\
  \ 中创建一个名为 `LandingPage.vue` 的文件：\n\n```vue\n<template>\n  <div class=\"container\
  \ mx-auto h-screen\">\n    <menu-bar-component></menu-bar-component>\n    <div class=\"\
  container mx-auto\">\n      <hero-component></hero-component>\n      <offers-component></offers-component>\n\
  \    </div>\n    <footer-component></footer-component>\n  </div>\n</template>\n\n\
  <script setup lang=\"ts\">\n  import MenuBarComponent from '/src/components/layouts/common/MenuBarComponent.vue'\n\
  \  import HeroComponent from './HeroComponent.vue'\n  import OffersComponent from\
  \ './OffersComponent.vue'\n  import FooterComponent from '/src/components/layouts/common/FooterComponent.vue'\n\
  </script>\n```\n\n作为对我们要构建内容的回顾，图 9.3 是第 5 章 设计基于组件的 UI 和单页应用程序中线框的副本：\n\n![Graphical\
  \ user interface,application Description generated](img/figure_9.3.png)\n\n图 9.3：落地页线框\n\
  \n\n\n\n\n我们将稍后展望一下 `MenuBarComponent` 和 `FooterComponent` 文件的存放位置，并将它们直接放入 `components/layouts/common`\
  \ 目录。\n\n如你所见，这些代码并不复杂；它包含了一些导入和一个相当较小的模板部分。但是，如果你尝试运行它，编译器会报错；因为我们还没有构建这些组件，所以它找不到可以查找或构建的内容，从而导致了问题。\n\
  \n我们将处理的第一个组件是 `MenuBarComponent`。\n\n### MenuBarComponent\n\nMenuBar 是页面的主头部，包含网站\
  \ Logo 和主导航。创建 `components/layouts/common/MenuBarComponent.vue` 文件并将以下代码放入其中：\n\n\
  ```html\n<template>\n  <div class=\"mt-1\">\n    <div class=\"bg-gray-300 border-b\
  \ border-gray-500 rounded-lg px-4 pt-2\">\n      <div class=\"container mx-auto\
  \ flex justify-between\">\n        <div class=\"mb-1\">\n          <h1 class=\"\
  logo text-5xl font-bold text-logo-red\">Speedy</h1>\n          <h1 class=\"logo\
  \ text-5xl font-bold ml-16 text-logo-red mb-1\">Pizza</h1>\n        </div>\n   \
  \     <menu-items></menu-items>\n      </div>\n    </div>\n  </div>\n</template>\n\
  \n<script setup lang=\"ts\">\n  import MenuItem from './MenuItemsComponent.vue'\n\
  </script>\n```\n\n我们将实际的菜单拆分为一个子组件，该组件仅在这两个组件中使用，这意味着我们只需要在一个地方进行编辑。我们将这个子组件放在 `HeaderComponent`\
  \ 和 `FooterComponent` 旁边，并命名为 `MenuItemsComponent.vue`：\n\n```html\n<template>\n\
  \  <div class=\"flex w-1/6 justify-between font-bold\">\n    <a href=\"#\">Home</a>\n\
  \    <a href=\"#\">Menu</a>\n    <a href=\"#\">Profile</a>\n  </div>\n</template>\n\
  ```\n\n正如你可能注意到的，我们只是先占用了这些链接占位符；当我们引入路由器时，我们会回来修改这些内容，让它们指向正确的位置。在较大的项目中，你应该预期路由会先就绪，这样任何新页面都可以在构建之前被添加到路由配置中。我们将在第\
  \ 10 章《使用 VueRouter 在页面间路由》中详细介绍路由器。\n\n### FooterComponent\n\n将 `FooterComponent.vue`\
  \ 文件放在 `MenuBarComponent` 旁边，并将以下代码添加到该文件中：\n\n```html\n<template>\n  <div class=\"\
  container mx-auto fixed bottom-1 left-2 right-2 py-4 px-8 bg-gray-300 font-bold\
  \ border-t border-gray-500 rounded-lg\">\n    <div class=\"container mx-auto flex\
  \ justify-between\">\n      <div>copy; Speedy Pizzas & Clive Harber 2022</div>\n\
  \      <menu-items></menu-items>\n    </div>\n  </div>\n</template>\n\n<script setup\
  \ lang=\"ts\">\n  import MenuItem from './MenuItemsComponent.vue'\n</script>\n```\n\
  \n这同样非常简单，只是一组指向相关页面的样式化链接。由于我们正在构建一个一个小型的原型，你会发现提供的设计中缺少了一些在真实的面向公众的网站中必不可少的内容：指向网站条款和条件政策、数据处理与管理、以及\
  \ Cookie 跟踪政策的链接。根据你所处的世界，你可能需要在每个页面都链接其中部分或全部内容，特别是如果你打算收集和使用来自欧盟公民的数据。如果你位于欧盟或打算向欧盟国家销售/提供服务，你有一系列需要注意的法律框架，这些框架在世界其他地区可能不存在。\n\
  \n这些组件就绪后，我们就可以开始构建内部部分了；如果你运行编译器，它会通过指出缺失的内容来提供帮助。现在尝试一下：`npm run dev`。你将在终端看到输出，如图\
  \ 9.4 所示：\n\n![自动生成的文本描述](img/figure_9.4.png)\n\n图 9.4：缺少组件导致的错误\n\n如你所见，我们可以接下来处理\
  \ Hero 部分。\n\n### HeroComponent\n\n“Hero”组件是用户看到的第一个东西。通常，Hero 占据屏幕的 50% 到 75%。它是网站上主要的行动号召（CTA），通常包含一张图片和一个按钮。\n\
  \n该代码如下：\n\n```html\n<template>\n  <div class=\"hero\">\n    <div class=\"btn\"\
  >\n      <button class=\"red\">Our Menu</button>\n    </div>\n  </div>\n</template>\n\
  \n<style scoped>\n  .hero {\n    background: url(src/assets/hero.jpg);\n    @apply\
  \ mx-auto mt-1 flex flex-col;\n  }\n</style>\n```\n\n### OffersComponent\n\n从模板的角度来看，`OffersComponent`\
  \ 看起来相当简单，但它是我们目前为止构建的最复杂的组件。我们正在使用一个包含项目集合的数据对象，该对象用于驱动循环并输出多个组件，每个组件显示列表中的单个项目。这里有很多内容需要拆解：\n\
  \n```html\n<template>\n  <div class=\"flex justify-center space-x-16 mt-4\">\n \
  \   <offer-component\n      v-for=\"offer in offers\"\n      :key=\"offer.id\"\n\
  \      :id=\"offer.id\"\n      :text=\"offer.btn_text\"\n      :image=\"offer.image\"\
  \n    ></offer-component>\n  </div>\n</template>\n```\n\n这里的模板使用 `v-for` 指令遍历 `offers`\
  \ 数据，依次提取每个 `offer`。我们提供了 `offer id` 作为必需的 `:key` 属性，以便 Vue 在需要时跟踪更改。循环的每次都会注入一个\
  \ `OfferComponent`，它接收提供的属性并进行渲染。\n\n\n\n\n\n第二部分定义了数据对象（目前如此），它通过定义符合子组件所需的 `props`\
  \ 类型的 `offers` 对象，使我们能够构建 `OfferComponents` 的循环。如果不符合此接口，子组件将无法渲染。这样写是为了当我们把组件更改为从\
  \ `Pinia` 获取数据时，可以直接删除整个部分代码：\n\n```html\n<script lang=\"ts\">\nimport { defineComponent\
  \ } from \"vue\";\n\nexport default defineComponent({\n  data: () => ({\n    offers:\
  \ [\n      { id: 1, image: \"\", btn_text: \"Offer 1\" },\n      { id: 2, image:\
  \ \"\", btn_text: \"Offer 2\" },\n      { id: 3, image: \"\", btn_text: \"Offer\
  \ 3\" },\n    ],\n  }),\n});\n</script>\n```\n\n一旦有了这个循环，我们只需要构建 `OfferComponent`\
  \ 即可，这是接下来的工作。\n\n### OfferComponent\n\n这里的 `OfferComponent` 仅描述了如何显示单个优惠（offer），并根据提供的数据提供了一个行动号召（CTA）。最终，这将变成一个动态路由的示例，但目前我们只需先留出\
  \ CTA 部分，以便其与页面的其他部分风格一致。参见下列表：\n\n```html\n<template>\n  <div class=\"offer\" :style=\"\
  { backgroundImage: bgImage }}\">\n    <div class=\"btn-placement-b\">\n      <button\
  \ class=\"red-button\">{{ text }}</button>\n    </div>\n  </div>\n</template>\n\n\
  <script setup lang=\"ts\">\nimport { computed } from 'vue';\n\ninterface Props {\n\
  \  id: number;\n  text: string;\n  image: string;\n}\n\nconst props = defineProps<Props>();\n\
  const imageBaseUrl = 'src/assets/';\nconst bgImage = computed(() => \n  `url(${imageBaseUrl}${props.image})`);\n\
  </script>\n\n<style scoped>\n.offer {\n  @apply bg-cover bg-no-repeat bg-center\
  \ w-64 text-center h-64 flex flex-col border rounded;\n}\n</style>\n```\n\n在这里，我们定义了一个接口来设置从\
  \ `props` 对象中期望的数据。我们还动态设置了内联样式，以便 `OfferComponent` 的背景可以从传递的数据中注入。在此阶段，我们是硬编码路径的。当我们从\
  \ API 获取数据时，将替换它并完全依赖传递的数据。\n\n这是渲染主页所需的最后一个组件；为了让程序按照计划运行，我们需要对 `App.vue` 文件进行一些细微调整。需要告诉它在应用程序启动时我们想要它渲染的内容。\n\
  \n### App.vue 的更改\n\n需要对 `App.vue` 文件进行以下更改：\n\n```html\n<template>\n  <landing-page></landing-page>\n\
  </template>\n\n<script setup lang=\"ts\">\nimport LandingPage from \"./components/pages/site/landing-page/LandingPage.vue\"\
  \n</script>\n```\n\n完成这些更改后，从终端启动应用程序：\n\n```bash\n$ npm run dev\n```\n\n打开浏览器，如果使用\
  \ Vite 2，指向 `http://localhost:3000`，如果使用 Vite 3，指向 `http://localhost:5173`。随着最后一项工作的完成，页面现在可以正确编译。当你切换到浏览器时，你会看到你所有的努力成果呈现在面前。给自己鼓个掌并休息一下吧；我们在短时间内做了很多工作。\n\
  \n此时，将你的更改推送到 Git 仓库是有意义的：\n\n```bash\n$ git add .\n$ git commit -m '<your commit\
  \ message>'\n$ git push origin <branch>\n```\n\n在下一章中，我们将开始构建路由器，提取描述我们称之为“布局（layout）”的公共元素，并完成许多其他页面内部组件的构建。\n\
  \n## 结论\n\n此时，将你的更改推送到 Git 仓库是有意义的：\n\n在下一章中，我们将开始构建路由器，提取描述我们称之为“布局（layout）”的公共元素，并完成许多其他页面内部组件的构建。\n\
  \n\n\n\n\n```javascript\nconst app = createApp(App)\napp.use(router)\napp.mount('#app')\n\
  ```\n\n当添加路由器时，你需要完成几个阶段来使应用程序感知到路由。步骤如下：\n\n1. 导入 `createRouter()` 函数和所需的历史模式函数（即\
  \ `createWebHistory()`）；第 2 行\n2. 导入（或定义）路由列表；第 3 行\n3. 使用 `createRouter()` 函数创建路由器；第\
  \ 6 行\n4. 使用 `app.use()` 将定义的路由器添加到应用中；第 12 行\n\n此时，`routes/routes.js` 文件只需要导出一个空数组，但这并没有什么用处。\n\
  \n下一节将介绍如何构建路由，然后我们将构建原型应用所需的路由。\n\n## 构建路由定义\n\n路由器接受一个对象列表，这些对象定义了 `path`（或 URL）与该路径所需渲染的组件之间的映射。这些对象需要符合\
  \ [`router.vuejs.org/api/#routerecordraw`](https://router.vuejs.org/api/#routerecordraw)\
  \ 中定义的 `RouterRecordRaw` 对象。最常用的选项是 `path`、`component(s)`、`name`、`children`、`beforeEnter`\
  \ 和 `props`。这些项将在接下来的章节中进行讨论。还有其他不常用的选项，如 `alias` 和 `redirect`。常用的选项所示所示：\n\n```typescript\n\
  [{\n  path: String,\n  name: String?,\n  component: Component?,\n  props: Boolean?,\n\
  \  beforeEnter: (NavigationGuard|NavigationGuard[])?,\n  children: [RouterRecordRaw]?\n\
  }]: [RouterRecordRaw]\n```\n\n注意：`NavigationGuard` 是用于保护路由或执行重定向的函数；我们稍后会讨论这些。\n\
  \n## RouterRecordRaw 对象\n\n`RouterRecordRaw` 对象（以及类似的对象，如 `RouterRecordNormalised`）包含了之前提供的定义，它是路由器用于匹配\
  \ `path`（相对 URL）到输出组件所需的映射。根据页面的需求，此 `path` 可以是静态的也可以是动态的。让我们来看看最常用的每个部分。\n\n###\
  \ Path\n\n`path` 是一个模式，可以是简单的字符串，也可以是复杂的模式，该模式可以分解为一组值，这些值可以传递给组件，使其能够从本地值、应用本地存储（如\
  \ `Pinia`）或远程源提取数据。\n\n各种路径类型的示例所示：\n\n```javascript\n// 字符串\npath: '/'\npath: '/cars/show/all'\n\
  \n// 动态段\npath: '/cars/:id'\npath: '/cars/:id/edit'\n\n// id 可通过 $route.params.id\
  \ 获取\n// partId 可通过 $route.params.partId 获取\npath: '/cars/:id/show/:partId'\n\n\
  // 自定义正则\n// 将多个段匹配到 missingPath\npath: '/:missingPath)*'\n// 将部分匹配到 make 和 model\n\
  path: '/cars-:make)-:model)'\n// 匹配到 doors 并确保为数字\npath: '/cars(\\\\d+)'\n// 可选匹配\
  \ id\npath: '/cars/:id?'\n```\n\n如你在动态路径所示，可以通过在名称前加冒号（`:`）将值提取到变量中，并在组件中使用它。访问这些数据有三种方式：通过传递给\
  \ Options API 组件的 `$route` 对象、用于 Composition API 的 `useRoute()` 函数，或者通过 `props`。\n\
  \n`$route` 对象（或 Composition API 的替代方案）在需要时提供了路由的其他部分，如 `query`、`hash` 或重定向。如果你是按照\
  \ REST 风格构建项目，那么不太可能频繁使用 `$route.query`，如果你不使用 hash 导航，那么 `$route.hash` 同样不太可能使用，但这些选项在需要时可用。\n\
  \n注意：REST（表述状态转换）是关于如何构建 API 的一组原则或约束。这些约束能够设计轻量级、互联网规模的 API，将 URI 映射到资源，从而隐藏底层的实现。更多信息请参阅\
  \ [`en.wikipedia.org/wiki/Representational_state_transfer`](https://en.wikipedia.org/wiki/Representational_state_transfer)。\n\
  \n我们将在本章的稍后部分重新构建原型的导航，因此我们到时会进一步讨论。\n\n### Name\n\n`name` 属性允许你为路由分配特定的名称。这让你作为开发者具有灵活性，可以根据需要创建和维护路由，而无需修改项目中的所有文件。使用命名路由是一种推荐的做法。\n\
  \n当你想要使用命名路由时，``:to` 属性将接收一个对象，该对象提供了名称以及构建路径所需的任何路由参数。编译器随后根据路由器信息和提供的参数构建正确的路径。任何参数都会自动进行\
  \ URL 编码。下面的示例展示了路由器配置及其在模板中的用法：\n\n```javascript\nconst routes = [\n  {\n    path:\
  \ '/item/:id(\\\\d+)',\n    name: 'item',\n    component: ItemPage\n  }\n]\n\n<router-link\
  \ :to=\"{name: 'item', params: {id: 123}}\">意大利肉丸</router-link>\n```\n\n项目中的每个路由名称必须是唯一的。如果任何路由名称冲突，编译器将停止构建项目并返回错误报告。\n\
  \n### Component(s)\n\n此设置指定了在访问该路径时模板渲染所需的组件（或多个组件）。\n\n如果目标模板仅使用默认的 `router-view`，则需要单个\
  \ `component` 属性：\n\n```html\n<template>\n  <router-view></router-view>\n</template>\n\
  \nconst routes = [\n  {\n    path: '/',\n    component: Component\n  }\n]\n```\n\
  \n如果目标模板使用了命名视图（即多个路由出口），则它需要 `components` 属性，它接受一个将命名的/默认视图映射到所需组件的对象，如下所示：\n\n\
  ```html\n<template>\n  <div>\n    <router-view name='SideBar'></router-view>\n \
  \ </div>\n  <router-view></router-view>\n</template>\n\nconst routes = [\n  {\n\
  \    path: '/',\n    components: {\n      default: Home,\n      SideBar\n    }\n\
  \  }\n]\n```\n\n如果路由记录发生重定向，则它没有 `component` 或 `components` 属性。\n\n### Props\n\n\
  `props` 属性决定了编码在路径的数据是否作为 `props` 对象的一部分对组件可用。对于单视图组件，这是一个布尔属性，因此它是开启或关闭的——以下将其设置为\
  \ true 从而开启：\n\n```javascript\nprops: true\n```\n\n对于多视图或命名视图组件，此对象为每个视图提供按名称设置，如下所示：\n\
  \n```javascript\nprops: {\n  SideBar: true,\n  default: false\n}\n```\n\n如果提供的 `props`\
  \ 对象包含一个与视图不对应的键，它将原封不动地合并到供给组件的 `props` 对象中。这是提供静态 props 数据的一种简单方法，如下所示：\n\n```javascript\n\
  props: {\n  SideBar: true,\n  default: false,\n  NewValue: '传递到组件'\n}\n```\n\n最后，如果你向此属性提供一个函数，它会将\
  \ `route` 对象作为参数注入，你可以对其进行查询以创建你需要的任何数据组合：\n\n```javascript\n// /search/searchTerm\
  \ => props: {params: 'searchTerm'}\nconst routes = [\n  {\n    path: '/search/:name',\n\
  \    component: SearchComponent,\n    props: route => ({ params: route.params.name\
  \ })\n  }\n]\n```\n\n\n\n\n\n`beforeEnter` 被称为导航守卫；该功能将在目标组件渲染之前执行，以便根据需要对导航进行重定向、取消或更改。路由定义中的\
  \ `beforeEnter` 钩子是影响导航的多种方法之一；导航守卫将在本章后面的部分进行讨论。\n\n要添加 `beforeEnter` 守卫，你需要提供该属性，该属性接收一个函数（或函数列表），该函数接受两个参数：\n\
  \n- `to`: 导航的目标路由\n- `from`: 发起导航的源路由\n\n该属性的使用方法如下：\n\n```javascript\n// 单个匿名函数\n\
  const routes = [\n  {\n    path: '/profile/:id',\n    component: ProfileInfoPage,\n\
  \    beforeEnter: (to, from) => {\n      // 拒绝导航\n      return false\n    },\n \
  \ },\n]\n\n// 应用多个函数\nconst applicativeOne = (to, from) => { return true }\nconst\
  \ applicativeTwo = (to, from) => { return false }\n\nconst routes = [\n  {\n   \
  \ path: '/profile/:id',\n    component: ProfileInfoPage,\n    beforeEnter: [applicativeOne,\
  \ applicativeTwo]\n  },\n  {\n    path: '/profile/:id/edit',\n    component: ProfileEditPage,\n\
  \    beforeEnter: [applicativeTwo]\n  },\n]\n```\n\n与所有其他导航守卫一样，执行的函数的返回值决定了导航的发生结果。\n\
  \n此路由属性用于你需要对少数路由应用导航守卫的情况；否则，使用全局导航守卫之一会更有意义。\n\n## 子路由\n\n`children` 属性允许你定义嵌套路由和组件层级结构。一种常见的做法是让\
  \ URL 结构（即段）与一组嵌套组件对应。\n\n在构建嵌套路由时，父路由按预期方式编写，即绝对路径（以 `/` 开头），并且每个子路由都相对于此路径定义（不带\
  \ `/` 前缀）。这允许路由器透明地构建路径并利用嵌套结构，而无需为每个子路由手动构建 URL：\n\n```javascript\nconst routes\
  \ = [\n  {\n    path: '/profile',\n    component: ProfilePage,\n    children: [\n\
  \      {\n        // /profile/info\n        path: 'info',\n        name: 'profile_info',\n\
  \        component: InfoComponent\n      },\n      {\n        // /profile/orders\n\
  \        path: 'orders',\n        name: 'profile_orders',\n        component: OrderComponent\n\
  \      }\n    ]\n  }\n]\n```\n\n如果你构建的子路由路径以 `/` 开头，路由器将认为这是一个根路径并进行相应的处理。这可能是也可能不是你想要的，但它会跳过父路径的定义。\n\
  \n每个父路由都需要一个出口（outlet）来渲染相应的子内容。\n\n然而，还有一点点尚未介绍：路由器如何知道应该使用哪个路径，以及路由器在哪里渲染路由输出？对此，VueRouter\
  \ 提供了两个实用的小组件：`<router-link>` 和 `<router-view>`。\n\n## Router Link\n\n`<router-link>`\
  \ 组件用于替代模板中的 `<a>` 标签（或任何可点击标签）；它会为你生成正确的标签和 URL 内容。\n\n该组件有一个必选的 `to` 属性和一个默认插槽（slot）。该属性接受以下内容：\n\
  \n- 一个字符串，你希望让用户导航到的目标路径。\n- 一个对象，包含 `path` 或 `name` 键，以及可选的 `params`、`query` 或\
  \ `hash` 对象，这些对象包含了路径构建器所需的键值对数据。\n\n以下展示了 `<router-link>` 标签的各种用法：\n\n```html\n\
  // 使用静态字符串作为路径\n<router-link to=\"/users\">Users</router-link>\n\n// 使用 JS 字符串作为路径，注意\
  \ :to\n<router-link :to=\"/users\">Users</router-link>\n\n// 使用带有 path 属性的对象\n<router-link\
  \ :to=\"{ path: '/users' }\">Users</router-link>\n\n// 使用具名路由\n<router-link :to=\"\
  { name: 'users' }\">Users</router-link>\n\n// 使用带有参数的具名路由\n<router-link :to=\"{\
  \ name: 'user', params: { id: 12 } }\">Users</router-link>\n\n// 使用带有 query 的具名路由\n\
  <router-link :to=\"{ name: 'user', query: { page: '1' } }\">Users</router-link>\n\
  \n// 使用带有 hash 的具名路由\n<router-link :to=\"{ name: 'user', hash: '#profile' }\">Users</router-link>\n\
  ```\n\n与所有其他导航守卫一样，执行的函数的返回值决定了导航的发生结果。\n\n此路由属性用于你需要对少数路由应用导航守卫的情况；否则，使用全局导航守卫之一会更有意义。\n\
  \n\n\n\n\n我们需要做的第一件事是向项目中添加 `VueRouter` 并创建路由方案。\n\n让我们向项目中添加 `VueRouter`：\n\n1.\
  \ `npm install vue-router@4`\n\n然后，我们将在 `main.ts` 中对其进行配置：\n\n```typescript\nimport\
  \ { createApp } from 'vue'\nimport { createRouter, createWebHistory } from 'vue-router'\n\
  import routes from './routes/index.ts'\nimport App from './App.vue'\nimport './assets/index.css'\n\
  \nconst router = createRouter({\n  history: createWebHistory(),\n  routes\n})\n\n\
  const app = createApp(App)\napp.use(router)\napp.mount('#app')\n```\n\n我们已经告诉了 `main.ts`\
  \ 可以在 `./routes/index.ts` 找到路由定义，因此我们需要向项目中添加该文件并在其中放入以下内容：\n\n```typescript\nimport\
  \ { RouteRecordRaw } from 'vue-router'\n\nconst routes: RouteRecordRaw[] = []\n\n\
  export default routes\n```\n\n准备好该文件后，我们就可以开始添加路由定义了。\n\n首先，我们将添加一些包装模板；完成后，这些模板将包含常见的导航元素，但目前，它们只是在模板部分持有路由出口（route\
  \ outlet），以便页面能够渲染。\n\n在 `./routes/index.ts` 文件顶部的导入部分添加这些导入：\n\n```typescript\n\
  import { RouteRecordRaw } from 'vue-router'\n// 页面包装\nimport FullPageWrapper from\
  \ '../components/layouts/page_wrappers/FullPage.vue'\nimport SlimPageWrapper from\
  \ '../components/layouts/page_wrappers/SlimPage.vue'\nimport ProfileWrapper from\
  \ '../components/layouts/page_wrappers/ProfileWrapper.vue'\n// ... 文件的其余部分 ...\n\
  ```\n\n有了这些导入后，我们可以按照如下方式添加第一个路由定义：\n\n```typescript\nconst routes: RouteRecordRaw[]\
  \ = [\n  {\n    path: '/',\n    component: FullPageWrapper,\n    children: []\n\
  \  },\n  {\n    path: '/',\n    component: SlimPageWrapper,\n    children: []\n\
  \  },\n  {\n    path: '/profile',\n    component: ProfileWrapper,\n    children:\
  \ []\n  }\n]\n```\n\n你可以看到，我们在这里使用了 `children` 属性。为了让它们按预期工作，我们需要在每个导入位置创建一个文件：\n\
  \n1. `components/layouts/page_wrappers/FullPage.vue`\n2. `components/layouts/page_wrappers/SlimPage.vue`\n\
  3. `components/layouts/page_wrappers/ProfileWrapper.vue`\n\n并向每个文件中添加以下内容：\n\n```html\n\
  <template>\n  <router-view></router-view>\n</template>\n```\n\n现在，我们将添加嵌套路由定义，首先添加到\
  \ `FullPageWrapper` 下的 `children` 数组中。首先，我们将如下所示添加所有所需的导入：\n\n```typescript\n//\
  \ ... 之前的导入 ...\n// 站点页面组件\nimport LandingPage from '../components/pages/site/landing-page/LandingPage.vue'\n\
  import MenuPage from '../components/pages/site/menu-page/MenuPage.vue'\nimport ItemPage\
  \ from '../components/pages/site/item-page/ItemPage.vue'\nimport CheckoutPage from\
  \ '../components/pages/site/checkout-page/CheckoutPage.vue'\n// ... 文件的其余部分 ...\n\
  ```\n\n现在我们添加实际的路由定义：\n\n```typescript\n// ... 之前的内容 ...\n{\n  path: '/',\n  component:\
  \ FullPageWrapper,\n  children: [\n    {\n      path: '',\n      name: 'home',\n\
  \      component: LandingPage\n    },\n    {\n      path: 'menu',\n      name: 'menu',\n\
  \      component: MenuPage\n    },\n    {\n      path: 'item/:id',\n      name:\
  \ 'item',\n      component: ItemPage\n    },\n    {\n      path: 'checkout/:basket',\n\
  \      name: 'checkout',\n      component: CheckoutPage\n    }\n  ]\n},\n// .. 文件的其余部分\
  \ ...\n```\n\n接两个嵌套模板部分使用了相同的模式，该模式在下面的列表中被压缩了：\n\n```typescript\n// ... 之前的文件内容\
  \ ...\nimport LogInPage from '../components/pages/site/login-page/LogInPage.vue'\n\
  import LogOutPage from '../components/pages/site/login-page/LogOutPage.vue'\nimport\
  \ RegistrationPage from '../components/pages/site/registration-page/RegistrationPage.vue'\n\
  // 个人资料页\nimport ProfileInfoPage from '../components/pages/site/info-page/ProfilePage.vue'\n\
  import ProfileOrdersPage from '../components/pages/site/orders-page/ProfilePage.vue'\n\
  \nconst routes: RouteRecordRaw[] = [\n  {\n    path: '/',\n    component: SlimPageWrapper,\n\
  \    children: [\n      {\n        path: 'login',\n        name: 'login',\n    \
  \    component: LogInPage\n      },\n      {\n        path: 'logout',\n        name:\
  \ 'logout',\n        component: LogOutPage\n      },\n      {\n        path: 'register',\n\
  \        name: 'register',\n        component: RegistrationPage\n      }\n    ]\n\
  \  },\n  {\n    path: '/profile',\n    component: FullPageWrapper,\n    children:\
  \ [\n      {\n        path: '',\n        name: 'info',\n        component: ProfileInfoPage\n\
  \      },\n      {\n        path: 'orders',\n        name: 'orders',\n        component:\
  \ ProfileOrdersPage\n      }\n    ]\n  }\n]\n```\n\n如果仍然有应用，不要对只看到白页面感到意外；我们还没有放置新文件。修复这个问题出奇地简单。\n\
  \n### VueRouter 导航守卫\n\n路由级守卫 `beforeEnter` 并不是可用于保护路由的唯一类型；你还有全局和组件内导航守卫。\n\n每当导航事件触发时，`VueRouter`\
  \ 会运行一个与 Vue 钩子类似的导航解析流。\n\n顺序如下：\n\n1. 触发导航事件\n2. 在激活的组件上调用 `beforeRouteLeave()`\n\
  3. 调用全局 `beforeEach()` 守\n4. 在所有重用的组件中调用 `beforeRouteUpdate()`\n5. 调用路由配置 `beforeEnter()`\n\
  6. 解析异步路由组件\n7. 在新组件中调用 `beforeRouteEnter()`\n8. 调用全局 `beforeResolve()` 守\n9. 确认导航\n\
  10. 调用全局 `afterEach()` 守\n11. 更新 DOM\n12. 触发 `beforeEnter()` 中的 `next()` 回调\n\n\
  每个导航守卫接收两个参数：`to` —— 导航目标和 `from` —— 源页面。可选地，还有第三个参数即 `next()`；虽然它在函数中可以被多次调用，但在守卫的任何特定路径中只能被调用一次。如果你使用\
  \ `next()`，你需要对你的逻辑非常小心，否则会导致你的守卫永远无法解析。\n\n导航守卫遵循尽早失败的原则，因此如果守卫返回空、true 或 undefined，则它被接受为有效，并允许导航继续到下一个导航守卫或导航解析流的下一步。\n\
  \n然而，如果任何守卫返回 `false`，则导航事件将被取消。\n\n如果导航守卫返回一个路由位置对象，则导航将重定向到返回的路径并针对新的端点重启导航解析流。\n\
  \n最后，如果守卫抛出 `Error`，则导航将被取消并调用 `router.onError()` 回调来解决问题。\n\n### 通过代码导航\n\n\n\n\
  \n你经常需要根据组件状态或事件（例如数据存储操作或错误状态）来管理导航。路由器提供了一个简单的 API 允许你执行这一操作，它提供了三个函数：`push()`、`replace()`\
  \ 和 `go()`。路由器 API 还有其他几个函数，但到目前为止这三个是最重要的。\n\n访问路由的方法取决于你正在使用哪种组件 API 来编写你的组件。\n\
  \n如果你使用的是 Options API，那么路由器会自动暴露给你的组件，并命名为 `$router`，因此你会使用 `this.$router`。参考下面的示例：\n\
  \n```html\n<script lang=\"ts\">\nexport default {\n  methods: {\n    eventHandler:\
  \ function (evt) {\n      this.$router.push({ name: 'pathName' })\n    }\n  }\n\
  }\n</script>\n```\n\nComposition API 要求你在组件的 `<script setup>` 部分使用 `useRouter()`\
  \ 组合式函数，如下所示：\n\n```html\n<script setup lang=\"ts\">\nimport { useRouter } from\
  \ 'vue-router'\nconst router = useRouter()\nrouter.push({ name: 'pathName' })\n\
  </script>\n```\n\n使用 VueRouter 进行前端导航会操作当前的历史记录，以实现与浏览器内置控件（如后退按钮）的完全集成。\n\n###\
  \ `push()`\n\n`push()` 函数会将新条目推入历史记录，这使得浏览器后退按钮功能可用，从而保持用户体验。\n\n`push()` 方法是 `<router-link\
  \ />` 组件内部发起的调用。它接受与你预期应用于 `to` 属性的所有相同参数。\n\n```javascript\n// 如果使用 Options API，将\
  \ router 替换为 this.$router\n// 使用路径\n// 等同于 <router-link to='stringPath' />\nrouter.push('stringPath')\n\
  \n// 使用路由对象 - 如果与 path 配合使用，则会忽略 params\n// 等同于 <router-link :to=\"{ path: 'stringPath'\
  \ }\" />\nrouter.push({ path: 'stringPath' })\n\n// 使用命名路由\n// 等同于 <router-link\
  \ \n// :to=\"{ name: 'pathName', params: { key: 'value' }}\" \n// />\nrouter.push({\
  \ name: 'pathName', params: { key: 'value' } })\n```\n\n### `replace()`\n\n`replace()`\
  \ 与 `push()` 类似；但不同之处在于它是替换历史记录中的最后一个条目，而不是推入条目。\n\n这等同于 `<router-link replace />`：\n\
  \n```javascript\n// 如果使用 Options API，将 router 替换为 this.$router\n// 使用路径\n// 等同于\
  \ <router-link to='stringPath' replace/>\nrouter.replace('stringPath')\n\n// 使用路由对象\
  \ - 如果与 path 配合使用，则会忽略 params\n// 等同于 <router-link :to=\"{ path: 'stringPath' }\"\
  \ replace/>\nrouter.replace({ path: 'stringPath' })\n\n// 使用命名路由\n// 等同于 <router-link\
  \ \n// :to=\"{ name: 'pathName', params: { key: 'value' }}\" \n//   replace\n//\
  \ />\nrouter.replace({ name: 'pathName', params: { key: 'value' } })\n```\n\n`replace()`\
  \ 会改变导航条目，因此在在使用浏览器提供的控件时，可能会对用户体验产生突兀的影响。\n\n### `forward()`/`back()`/`go()`\n\n\
  这三个方法允许你操作自己在历史记录中的位置：\n\n*   `forward()` 将你移动到下一个条目。\n*   `back()` 将你移动到上一个条目。\n\
  *   `go(n)` 接受一个整数并将移动到指定的数字。\n\n如果请求的条目在历史记录中不存在，导航将静默失败。下面的列表提供了一些用法示例：\n\n```javascript\n\
  // 如果使用 Options API，将 router 替换为 this.$router\n// 使用路径\n// 等同于 <router-link to='stringPath'\
  \ />\nrouter.push('stringPath')\n\n// 使用路由对象 - 如果与 path 配合使用，则会忽略 params\n// 等同于\
  \ <router-link :to=\"{ path: 'stringPath' }\" />\nrouter.push({ path: 'stringPath'\
  \ })\n\n// 使用命名路由\n// 等同于 <router-link \n// :to=\"{ name: 'pathName', params: {\
  \ key: 'value' }}\" \n// />\nrouter.push({ name: 'pathName', params: { key: 'value'\
  \ } })\n```\n\n等等，上面的示例显示的是 `push`。让我们看看其他的：\n\n```javascript\nrouter.forward()\n\
  router.back()\nrouter.go(-1)\n```\n\n### 结语\n\n路由器将路径映射到组件；有时，使用命名路由构建简单的路由器原型并完善细节，比在开始就设计一个全面的路由方案要容易。\n\
  \n## 总结\n\n在本章中，我们探索了前端路由，然后讨论了如何在项目中集成和使用 VueRouter。接着我们查看了示例应用程序并更新了它。最后，我们查看了程序化导航。\n\
  \n## 注意事项\n\n*   一旦导入，你需要在整个应用范围内管理导航。\n*   如果给路由命名，从长远来看更具可维护性。\n*   路由定义可以根据需要深层嵌套子路由；开发者必须确保有足够的路由出口（router\
  \ outlets）以便所有子路由正确渲染。\n*   使用导航守卫（navigation guards）来保护路由，但仅在需要时使用。有时构建小型用途的守卫并在适当的地方复用它们，比构建一组应用于每个导航事件的全局守卫要好。\n\
  *   如果目标组件包含命名视图（named views），则模板中有多个路由出口，路由定义必须使用 `components` 键。如果组件仅使用默认值，则使用\
  \ `component` 键。\n\n### 核心术语\n\n*   前端路由\n*   路由定义\n*   路由出口\n*   `<router-link>`\n\
  *   `<router-view>`\n*   程序化导航\n*   路由路径\n*   命名路由\n*   嵌套路由\n*   包装器\n*   命名视图\n\
  \n\n\n在本章中，我们将讨论事件。首先，我们将看看事件是什么以及 Vue.js 是如何看待它们的。然后，我们将涵盖可以使用不同类型的事件、适用的使用场景，以及在使用时可能遇到的问题。\n\
  \n在本章中，我们将通过构建示例应用程序的一部分，来实践所将涵盖的理论。\n\n由于我们希望在整个过程中专注于事件代码，我们将留给读者（你）来决定如何获取构建我们感兴趣的页面的\
  \ HTML/CSS 代码。如果你愿意，在第 5 章设计基于组件的 UI 和单页应用]中提供了足够的信息来完成这一操作。否则，直接使用书中附带的代码示例即可。\n\
  \n## Vue.js 中的事件\n\n事件是对用户或其他代码其他部分所执行的操作的响应。事件可以被处理，也可以向组件层级结构向上传递。\n\n在 Vue.js\
  \ 中，框架可以响应两种类型的事件：DOM 事件（如 `click` 或 `change`）和自定义事件。\n\n从代码的角度来看，这两种类型的事件都由某些 JSON\
  \ 表示，其中包含了已触发的事件类型、与该触发相关的任何数据以及事件元数据。在这方面，Vue.js 事件与 HTML DOM 事件的发送（触发）和处理方式非常相似。\n\
  \n需要处理的事件是通过在 HTML 模板中使用 `v-on:` 前缀或作为属性编写的 `@` 快捷语法来绑定的。这以及添加处理程序将在下一节介绍。\n\n##\
  \ 触发和处理标准 DOM 事件\n\n标准的 DOM 事件是响应用户操作触发的——例如点击按钮、在表单控件中更改、移动滑块等。浏览器应该理解的所有标准 DOM\
  \ 事件都是可用的。最常用的事件包括：\n\n* Click（点击）\n* Change（改变）\n* `<event>` 等\n\n要处理标准的 DOM 事件，你需要添加一个事件处理程序。事件处理程序简单来说就是被添加到\
  \ Options API 组件的 `methods` 部分的函数，如下所示：\n\n```html\n<template>\n  <button value=\"\
  Click me\" @click=\"handle_click\" />\n</template>\n\n<script>\nexport default {\n\
  \  methods: {\n    handle_click: function (evt) {\n      console.log('You clicked\
  \ me')\n    }\n  }\n}\n</script>\n```\n\n如果你在使用组合 API，则事件处理程序需要添加到 `script setup`\
  \ 中（如下列表所示），或者作为可选添加的 script 章节中的额外方法（未显示）：\n\n```html\n<template>\n  <button value=\"\
  Click me\" @click=\"handle_click\" />\n</template>\n\n<script setup>\nfunction handle_click(evt)\
  \ {\n  console.log('You clicked me')\n}\n</script>\n```\n\n将触发的事件传递给处理程序是可选的；如果你的处理程序在编写时没有参数，则事件信息将被静默丢弃，如下所示：\n\
  \n```html\n<template>\n  <button value=\"Click me\" @click=\"handle_click\" />\n\
  </template>\n\n<script setup>\n// 事件没有被使用，所以不需要传递它\nfunction handle_click() {\n\
  \  console.log('You clicked me')\n}\n</script>\n```\n\n标准 DOM 事件的事件处理程序可以根据需要触发额外的事件，无论是\
  \ DOM 事件还是更常见的自定义事件。\n\n让我们在示例项目中开始付诸实践——理解它们的最好的方法就是实践。我们将查看 `PageComponent` (`components/pages/menu-page/MenuPage.vue`)。如果你查看了第\
  \ 5 章设计基于组件的 UI 和单页应用中的该页面设计，你会我们需要为每个项目上的所有用户交互提供事件，以及运行 `SideComponent` 所需的事件。\n\
  \n根据设计推断，菜单列表需要添加以下事件来实现数据收集和用户交互：\n\n* `incrementCount`：增加要添加到订单的物品数量\n* `decrementCount`：与之前相同但方向相反\n\
  * `addToCart`：将选定的项目和数量添加到购物车\n\n为了帮助实现，源代码提供了一个 `useCart` 组合式函数 (`src/composables/useCart.ts`)\
  \ 来提供基础购物功能。这个简单的组合式函数仅提供了一个管理数据的接口；我们将在查看 Pinia 时对其进行完善。\n\n如果你还没有源代码，现在是获取它并返回的好时机。此时，我们将更改源代码中从第\
  \ 8 行开始的按钮。请使用以下内容对其进行更新；参见下文列表中的第 4 行：\n\n```html\n<button type=\"button\" class=\"\
  mr-1 relative inline-flex items-center space-x-2 px-2 py-1 border text-sm font-medium\
  \ rounded-md red-sm\" @click=\"incrementCount\">\n```\n\n这添加了 `@click` 处理程序，并告诉你如果触发了事件，它将使用\
  \ `incrementCount()` 函数来处理。作为一个练习，尝试尝试自己编写该处理程序。它需要能够增加 `itemCount` 引用持有的值。如果你卡住了，或者只是感兴趣，这里有一个解决方案：\n\
  \n```javascript\nlet itemCount = ref(1)\nconst incrementCount = () => itemCount.value++\n\
  ```\n\n在完成此后，让我们看看如何添加另一个事件处理程序：\n\n```html\n<button type=\"button\" class=\"ml-1\
  \ relative inline-flex items-center space-x-1 px-2 py-1 border text-sm font-medium\
  \ rounded-md red-sm\" @click=\"decrementCount\">\n```\n\n这个按钮的功能增加按钮相反，但它不允许用户在按下按钮时添加少于一个物品：\n\
  \n```javascript\nconst decrementCount = () => {\n  if (itemCount.value > 1) {\n\
  \    itemCount.value -= 1\n  }\n};\n```\n\n这里的代码并不复杂，应该是显而易懂的。我们将添加的最后一个事件是处理 `addToCart`\
  \ 按钮的点击事件：\n\n```html\n<button type=\"button\" class=\"red-button sm ml-4\" @click=\"\
  addToCart\">\n  加入购物车\n</button>\n```\n\n在这里，我们想要获取项目数据并与数量数据合并，以在购物车列表中创建一个条目。幸运的是，我们可以将向购物车的操作委托给\
  \ `useCart` 组合式函数：\n\n```typescript\nimport { useCart } from \"../../composables/useCart\"\
  ;\n\ntype Item = {\n  id: number;\n  image: string;\n  description?: string;\n \
  \ name: string;\n  price: number;\n};\n\nconst props = defineProps<{ item: Item\
  \ }>();\n\nconst { addItem } = useCart();\n\nfunction addToCart() {\n  addItem({\n\
  \    id: props.item.id,\n    name: props.item.name,\n    price: props.item.price,\n\
  \    qty: itemCount.value,\n    extras: [],\n  });\n}\n```\n\n\n\n\n我们在此阶段将添加的最后一个处理器是取消事件（cancel\
  \ event）：\n\n```html\n<a href=\"#\" class=\"text-red-400 font-medium hover:text-red-600\"\
  \ @click=\"cancel\"> ></a>\n```\n\n该部分的代码已经在上一个列表中添加。\n\n这里涵盖的每个处理器都非常简单。它们都将处理过程推给了其他部分。这是一种常见的模式：UI\
  \ 处理交互，但数据处理被移动到服务（service）或组合式（composable）。数据管理随后被抽象化为如 `Pinia` 这样的数据存储，或者通过 API\
  \ 传输到服务器。\n\n### 创建自定义事件\n\n除了为标准的 HTML DOM 事件编写处理器外，你还可以创建自己的事件。由于数据绑定的单向性，这些事件通常传递给子组件，用于处理从\
  \ DOM 层次级向上传回父组件的数据。\n\n要创建一个自定义事件，你需要绑定一个名称（你想要给事件命的名字）和一个处理器；你可以像处理其他事件一样，使用 `v-on:`\
  \ 绑定或 `@` 快捷方式来实现。\n\n这将在接下来的章节中介绍。\n\n### 使用自定义事件进行父子组件之间的通信\n\n父组件可以使用 `props`\
  \ 将数据传递给直接子组件，因此在整个组件层次结构中获取数据相对容易，特别是结合 `provide`/`inject` 使用时。这很容易，因为这是组件行为的自然方式：父组件告诉子组件做什么。\n\
  \n将数据从子组件传回父组件稍微困难。这需要子组件触发（使用 `$emit` 方法）一个事件，将任何数据传递给父组件中所需的处理器。\n\n**注意：** 自定义事件不会跨整个层次结构传播（即它们不会冒泡），因此必须由直接父组件处理。\n\
  \n在下面的示例中，我们将有一个典型的父子层次结构；子组件将触发一个事件供父组件处理：\n\n```javascript\n// 子组件 - 在模板中使用 $emit\n\
  <template>\n  <button @click=\"$emit('sendMessage')\">Click Me</button>\n</template>\n\
  \n// 或者\n// 子组件 - 使用方法\n<template>\n  <button @click=\"clickHandler\">Click Me</button>\n\
  </template>\n\n<script setup>\n  const emit = defineEmits(['sendMessage'])\n\n \
  \ function clickHandler() {\n    emit('sendMessage')\n  }\n</script>\n```\n\n当父组件中使用该子组件时，你如下所示设置事件处理器：\n\
  \n```javascript\n// 父组件，使用 @\n<template>\n  <child-component @send-message=\"handleChildEvent\"\
  \ />\n</template>\n\n<script setup>\n  function handleChildEvent() {\n    console.log('handling\
  \ event')\n  }\n</script>\n```\n\n如果需要发送任何数据，它将在调用处理器的过程中完成，就像任何内置事件一样；你只是是在调用回调函数——参见下方的第\
  \ 3 行：\n\n```javascript\n// 子组件\n<template>\n  <button @click=\"$emit('sendMessage',\
  \ 'This is the sent message')\">Click Me</button>\n</template>\n\n// 父组件\n<template>\n\
  \  <child-component @send-message=\"handleChildEvent\" />\n</template>\n\n<script\
  \ setup>\n  function handleChildEvent(message) {\n    console.log(message)\n  }\n\
  </script>\n```\n\n使用自定义事件是一个简单的问题，因为它利用了 Vue.js 的事件机制。\n\n### 定义和验证事件\n\n为了正确记录你的自定义事件，Vue.js\
  \ 提供了 `defineEmits()` 宏，它可以像 `defineProps()` 一样被使用。\n\n`defineEmits()` 可以接受一个简单的列表，仅声明哪些事件可用，如下：\n\
  \n```javascript\n<script setup>\n  const emit = defineEmits(['custom-event-1', 'custom-event-2'])\n\
  </script>\n```\n\n我们也可以为 `defineEmits()` 提供一个对象，如如下列表所示：\n\n```javascript\n<script\
  \ setup>\n  const emit = defineEmits({\n    // 定义一个没有验证的事件\n    'custom-event-1':\
  \ null,\n    // 返回验证状态的布尔值\n    'custom-event-2': (...args) => {\n      if (areValid(args))\
  \ {\n        return true\n      } else {\n        return false\n      }\n    }\n\
  \  })\n</script>\n```\n\n该对象可以用于验证。使用 TypeScript 时，你还可以定义类型：\n\n```typescript\n\
  <script setup>\n  const emit = defineEmits<{\n    'custom-event-1': void,\n    'custom-event-2':\
  \ (...args: any[]) => boolean\n  }>()\n</script>\n```\n\n\n\n\n\n```javascript\n\
  17.  this.eventBus.emit('event-name', data)\n18. }\n19. }\n20. }\n```\n\n请记住，这种事件总线是不推荐的。如你所见，事件处理器可以位于组件层次结构中的任何位置，当当组件很多时，维护工作会变得困难。这种方法非常脆弱。\n\
  \n更好的方法是使用 `Pinia`，它集中了事件处理，并提供了一种发布事件和管理应用状态的标准方法。\n\n如果该功能可以提取为一个单一的关注点，那么组合式函数（composable）通常是最佳选择。\n\
  \n## 结论\n\nVue.js 让事件处理变得非常简单。框架提供了许多选项来处理组件之间的数据交换。\n\n在这一章中，我们探索了创建和使用事件的几种方法，还触及了一些旧的实践，并讨论了为什么它们不再是必要的或不再作为最佳实践使用。我们继续了讨论，并理解了构建事件处理器的现代方法，包括何时使用组合式函数来处理数据和/组件状态。这种理解的一部分是基于在示例应用程序中构建事件的实践经验。\n\
  \n在下一章中，我们将详细探讨表单、表单组件和数据验证。在构建表单时，事件被广泛使用，既用于管理验证的表单状态，用于与用户交互并在发生问题时提供必要的反馈。\n\
  \n## 注意事项\n\n- **DOM 事件**：所有标准 DOM 事件都在模板中通过 `@` 语法进行设置，将事件链接到处理器。这些事件由框架提供，以便你能够处理所有标准事件。\n\
  - **自定义事件**：自定义事件用于管理父子组件之间的数据传递。有时使用组合式函数或如 `Pinia` 这样的应用管理层更好。\n- **全局事件总线**：不建议在\
  \ Vue 应用中使用全局事件总线。有更好的解决方案来解决在整个组件层次结构发送事件或数据的问题。不过，如果你在维护旧的 Vue.js 应用程序，可能会遇到这种模式。\n\
  \n## 关键术语\n\n- DOM 事件\n- 自定义事件\n- 全局事件总线\n- 处理器 (Handler)\n- 触发器 (Emitter)\n- 应用状态层\
  \ (Application State Layer)\n- 组合式函数 (Composable)\n- 触发 (Trigger)\n- `@click`\n\
  - `@change`\n- `@submit`\n- `@eventName`\n- `v-on:eventName`\n\n加入我们书籍的 Discord\
