  \n![](img/fm1.png)\n\n# 第 6 章 使用 Composition API 管理组件逻辑\n\n## 引言\n\n在本章中，我们将探索 `Composition\
  \ API`；如果你回想起第 4 章“理解 `Vue.js` 实例”，在其中我们详细探讨了 `Options API`，我们提到过会回到这个话题。如果你是来自\
  \ React 领域，这个想法就类似于在 `Hooks API` 中探索的理念。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- `Composition\
  \ API`\n- 该 API 解决的问题\n- `Composition API` 生命周期与响应式属性\n- 创建可组合的工具类（Composable utilities）\n\
  - 处理依赖注入 - Provide 和 Inject\n- 使用 `Teleport` 和 `Suspense`\n- `VueUse` 工具库\n\n##\
  \ 目标\n\n在学习本章之后，你将理解如何使用 `Vue.js Composition API` 以及它如何与 `Options API` 有所不同。你还将理解如何构建可组合的工具类，如何使用\
  \ `Suspense` 管理用户预期，以及如何使用 `Teleport` 操作 HTML DOM。最后，我们将查看如何从 `VueUse` 库导入工具类，以使你的代码更加灵活且可维护性。\n\
  \n## Composition API\n\n`Composition API` 允许通过导入的函数来构建组件，而不是创建一个供 `Vue` 实例接收的选项对象。`Vue.js`\
  \ 的文档指出这是一个术语，涵盖了三个 API：\n\n- 响应式 API (Reactivity API)\n- 生命周期钩子 (Life cycle Hooks)\n\
  - 依赖注入 (Dependency Injection)\n\n这些 API 中的每一个将在本章后面详细介绍。\n\n如果你正在运行使用 `Vue2` 的旧项目，你仍然可以从\
  \ `Composition API` 中获益，但你需要使用 `@vue/composition-api` 插件，否则它已经是内置的了。\n\n## Composition\
  \ API 解决的问题\n\n尽管 `Options API` 非常灵活，但在跨应用程序复用逻辑方面它存在一些缺点，主要是混入（mixins）的问题。如果你还记得，我们在第\
  \ 4 章“理解 `Vue.js` 实例”中介绍过混入。\n\n使用 `Composition API` 的应用程序不再使用混入，而且当组件的尺寸或复杂度达到一定程度时，它不再受到\
  \ `Options API` 的限制，因此代码的组织变得更加灵活。这意味着更容易管理处理特定关注点的代码；所有代码都组合在一起，而不是分散在基于 `Options\
  \ API` 的组件的许多行和不同部分中。所有管理特定关注点的代码都保持在一起这一事实，意味着它可以（并且应该）被提取成一个可复用的工具类；这在 `Options\
  \ API` 组件中很难实现；这使我们又回到了混入的问题。\n\n虽然这不影响在 JavaScript 中构建的组件，但随着 `TypeScript` 的日益普及，在\
  \ `Options API` 中使用类型推断可能非常困难。文档使用了极其复杂的类型体操；要让混入和依赖注入与类型正常工作可能极其困难或耗费时间，以至于在实现上变得不实际。由于大多数\
  \ `Composition API` 功能都可以使用纯 `JS/TS` 值和函数来实现，且这些值对类型是友好的，手动编写类型签名通常变得多余，从而节省了时间和精力。\n\
  \n现在为 `Vue.js` 开发者提供的灵活性使得你可以构建如下的应用程序：\n\n- 纯使用 `Options API`\n- 纯使用 `Composition\
  \ API`\n- 在适当的情况下混合使用两种 API\n\n对于单个组件或整个应用程序使用哪种方法很大程度上取决于偏好和经验。在本书编写期间，行业倾向于使用\
  \ `Composition API` 构建组件，但这可以被视为为了追求最新变化而不是为了最佳设计；我们的建议是根据组件的需求进行设计，而不是现在的潮流。\n\n\
  ## Composition API 生命周期与响应式属性\n\n如果你记得我们对 `Options API` 生命周期的讨论，我们了如何使用组件定义中的各种可用选项来挂钩组件生命周期：`created()`、`mounted()`、`updated()`\
  \ 等。为了实现这一点，`Composition API` 提供了一个 `setup()` 方法，在其中指定所有的启动钩子和组件操作的状态引用。`Composition\
  \ API` 对生命周期的更改如图 6.1 所示：\n\n![](img/Figure_6.1.png)\n\n图 6.1：Composition API 生命周期图，包含\
  \ setup 钩子\n\n这种变化在代码中的表达式如下：\n\n```\n1. // 作为选项\n2. <script>\n3. import { reactive\
  \ } from 'vue'\n4. export default {\n5. setup () {\n6. const state = reactive({state:\
  \ 0})\n7. const func = () => { console.log('这个函数的输出') }\n8. return {\n9. state,\n\
  10. func\n11. }\n12. },\n13. created(() => {\n14. // 在 created 钩子上执行的代码\n15. })\n\
  16. }\n17. </script>\n```\n\n\n\n\n`setup` 方法的访问取决于组件构建的方式，但在构建 SFC（单文件组件）时，框架为\
  \ `script` 标签提供了一个方便的 `setup` 属性。设置组件所需的所有代码都放置在组件定义中的 `<script setup>` 部分；你可以将其视为普通的\
  \ `script` 标签，但你也可以选择添加另一个未标记的 `script` 标签来处理第三方库或非基于组合 API 的代码，如下所示：\n\n```\n//\
  \ 在 <script setup> 块中\n<script setup>\nimport { reactive, onCreated } from 'vue'\n\
  const state = reactive({state: 0})\nconst func = () => { console.log('this functions\
  \ output') }\nonCreated(() => {\n// 在 created 钩子上执行的代码\n})\n</script>\n\n<script>\n\
  // 在组合 API 之外执行的代码\n</script>\n```\n\n对比这些示例，你可能已经注意到当使用 `setup()` 钩子时，你需要返回一个对象，该对象包含或说暴露了驱动组件模板所需的某些或属性和函数。当使用\
  \ `<script setup>` 时，这些将为你透明地处理；这是因为将 SFC 转换成底层对象结构时需要额外的构建步骤。\n\n作为 Options API\
  \ 部分可用的所有生命周期钩子仍然可用，但形式略有不同；它们都必须在 `setup()` 函数或 `<script setup>` 中作为回调函数指定。回调函数本身稍后会列出作为回顾，但它们在很大程度上语义上与下方列表所示的\
  \ Options API 生命周期周期钩子是相同的：\n\n```javascript\n<script setup lang=\"ts\">\nimport\
  \ { ref, onCreated, onMounted, onUpdated } from 'vue'\nconst state = ref(0)\nonCreated(()\
  \ => {\n// 在 created 钩子上执行的代码\n})\nonMounted(() => {\n// 在 mounted 钩子上执行的代码\n})\n\
  onUpdated(() => {\n// 在 updated 钩子上执行的代码\n})\n</script>\n```\n\n此外，由于 `setup()`\
  \ 步骤在 `beforeCreate()` 钩子之前同步运行，无法无法 `this` 变量。为了让组件状态（组件内部数据）对模板编译器可用，组合 API（通过暴露的响应式\
  \ API）提供了两个函数：`reactive()` 和 `ref()`。\n\n### `reactive()`\n\n`reactive()` 函数允许我们为一个对象创建一个\
  \ JS 代理，反过来允许 Vue 跟踪被包装对象的内部。`reactive()` 只作用于对象类型，而不作用于原始类型。下面的列表演示了这一点：\n\n```javascript\n\
  <script setup>\nimport { reactive } from 'vue'\nconst value = reactive({ key: 'value'\
  \ })\nfunction mutateValue (newValue) {\n  value.key = newValue\n}\n</script>\n\
  ```\n\n当 `reactive` 状态发生变化时，DOM 会自动更新。与其他 DOM 更新一样，Vue 会缓存更改而不是同步应用它们（即在发生更改的时刻）。缓冲区会在下一个\
  \ tick 事件处清除，以确保组件只更新一次，无论缓存了多少次状态更改。\n\nVue 中的状态是深层响应式的，这意味着即使更改发生在嵌套对象（包括数组）中，变动也会被追踪，如下所示：\n\
  \n```javascript\n<script setup>\nimport { reactive } from 'vue'\nconst obj = reactive({\n\
  \  parent: { child: { count: 0 } },\n  greekLetterNames: ['alpha', 'beta']\n})\n\
  function deepMutation() {\n  // 这些将按预期工作。\n  obj.parent.child.count++\n  obj.greekLetterNames.push('gamma')\n\
  }\n</script>\n```\n\n然而，任何尝试将响应式对象赋值或解构到局部变量的操作都会导致与原始声明状态对象中响应性的连接中断。\n\n如果你发现自己需要管理原始类型状态或解决\
  \ `reactive()` 的问题，Vue 提供了 `ref()` 函数，我们将在之后讨论。\n\n### `ref()`\n\n`ref()` 也会创建响应式状态，但方式不同。`ref()`\
  \ 将值包装在一个具有 `value` 属性的对象中。这些是对底层值的响应式引用，如下所示：\n\n```javascript\n<script setup\n\
  import { ref } from 'vue'\n// 原始类型值包装\nconst myValue = ref(0) \n// 对象值包装\nconst\
  \ myObject = ref({ obj: 0 })\n</script>\n```\n\n数据的包装和解包会自动处理，但仅当所访问的属性是顶层属性时——即在模板内部，如下所示：\n\
  \n```javascript\n// 这种工作不符合预期\n<script setup lang=\"ts\">\nimport { ref } from 'vue'\n\
  const myObject = { prop1: ref(1) }\n</script>\n<template>\n  <div>{{myObject.prop1++}}</div>\n\
  </template>\n```\n\n```javascript\n// 这是正确的\n<script setup lang=\"ts\">\nimport\
  \ { ref } from 'vue'\nconst myObject = { prop1: ref(1) }\nconst { prop1 } = myObject\n\
  </script>\n<template>\n  <div>{{prop1++}}</div>\n</template>\n```\n\n用 `ref()` 包装的对象中的值在解构或传递到函数调用时仍保持响应式，如下所示：\n\
  \n```javascript\n<script setup lang=\"ts\">\nconst myObject = {\n  prop1: ref(1),\n\
  \  prop2: ref(2)\n}\n// 函数仍然需要通过 .value 访问值\n// 因为它是 ref()，但它将保持响应式\n</>\n```\n\n\
  在模板中解构 `ref()` 时不需要访问 `.value`；它是自动的。见下方的列表：\n\n```javascript\n<script setup lang=\"\
  ts\">\nimport { ref } from 'vue'\nconst counter = ref(0)\nfunction incrementCounter()\
  \ {\n  counter.value++\n}\n</script>\n<template>\n  <button @click=\"incrementCounter\"\
  >\n    {{counter}}\n  </button>\n</template>\n```\n\n### 组合 API 生命周期钩子\n\n下面是可用生命周期钩子的简要回顾。\n\
  \n`setup()` 钩子（或 `<script setup>` 块）将是组合 API 时常用的钩子；它将完成原本放在不同生命周期钩子中的所有设置工作：创建状态的引用、函数和事件监听器的引用。\n\
  \n我们已经涵盖了 `reactive` 和 `ref`。\n\n下面是 `setup()` 的一个小示例。我们之前见过它，并在整个应用程序构建中使用它，因此你会有大量的练习：\n\
  \n```javascript\n<script setup lang=\"ts\">\nimport {\n  ref,\n  onCreated,\n  onMounted,\n\
  \  onUpdated,\n  onBeforeCreate,\n  onBeforeMount,\n  onBeforeUpdate,\n  onBeforeUnmount,\n\
  \  onUnmounted,\n} from 'vue'\nconst state = ref(0)\nonBeforeCreate(() => {})\n\
  onCreated(() => {})\nonBeforeMount(() => {})\nonMounted(() => {})\nonBeforeUpdate(()\
  \ => {})\nonUpdated(() => {})\nonBeforeUnmount(() => {})\nonUnmounted(() => {})\n\
  </script>\n```\n\n每个 Options API 生命周期方法都有其组合 API 对应项，如下表所示：\n\n| 组合 API 生命周期回调 |\
  \ Options API 对应项 |\n| --- | --- |\n| `onBeforeCreate(callback: () => void): void`\
  \ | `beforeCreate` |\n| `onCreated(callback: () => void): void` | `created` |\n\
  | `onBeforeMount(callback: () => void): void` | `beforeMount` |\n| `onMounted(callback:\
  \ () => void): void` | `mounted` |\n| `onBeforeUpdate(callback: () => void): void`\
  \ | `beforeUpdate` |\n| `onUpdated(callback: () => void): void` | `updated` |\n\n\
  \n\n\n\n| `onBeforeUnmount(callback: () => void): void` | beforeUnmount |\n| `onUnmounted(callback:\
  \ () => void): void` | unmounted |\n\n### 表 6.1：Composition API 与 Options API 生命周期方法的对比\n\
  \n由于我们已经了解了如何使用 Options API 的生命周期方法，因此 Composition API 的回调函数实际上并没有太大区别。\n\n## Composition\
  \ API 组件之间的数据流\n\n到目前为止，我们还没有探索过如何在使用 Composition API 构建的组件之间传递数据。在大多数情况下，我们为 Options\
  \ API 讨论的内容仍然适用，但由于我们绝大多数情况下使用的不是 options 对象，而是 `<script setup>`，因此在组件之间设置数据流元素的方式会略有不同。\n\
  \n我们将首先查看如何设置（声明）props，因为它们需要显式声明。\n\n### Props\n\n在 `<script setup>` 中声明 props\
  \ 时，会使用 `defineProps()` 宏。传递给宏的值与你提供的 props 选项是相同的。\n\n```typescript\n// 简单的 props\
  \ 设置\n<script setup lang=\"ts\">\ndefineProps(['prop1', 'prop2'])\n</script>\n```\n\
  \n```typescript\n// 带有校验的 props 设置\n<script setup lang=\"ts\">\ndefineProps({\n\
  \  // 基本类型检查\n  prop1: Number,\n  // 多个可能的类型\n  prop2: [String, Number],\n  // 必要的字符串\n\
  \  prop3: {\n    type: String,\n    required: true\n  },\n  // 带有默认值的数字\n  prop4:\
  \ {\n    type: Number,\n    default: 100\n  },\n  // 带有默认值的对象\n  prop5: {\n    type:\
  \ Object,\n    // 对象/数组默认值需要从工厂函数返回\n    default() {\n      return { message: 'hello'\
  \ }\n    }\n  },\n  // 基于类的自定义类型\n  prop6: {\n    type: CustomClassType\n  }\n})\n\
  </script>\n```\n\n使用 `defineProps()`  props 的规则与在 Options API props 选项中声明的规则相同。\n\
  \n使用 TS 时，我们也可以根据 TS 类型来定义 props；其语法略有不同，如下例使用 `defineProps<{}>()` 所示：\n\n```typescript\n\
  <script setup lang=\"ts\">\ndefineProps<{\n  // 验证为数字\n  prop1: number,\n  // 验证为字符串\n\
  \  prop2?: string\n}>()\n</script>\n```\n\n使用 TS 时，`defineProps()` 可以接收对象字面量（如之前所示），也可以接收在同一文件中提供的接口或对象字面量的引用：\n\
  \n```typescript\n<script setup lang=\"ts\">\ninterface Props {\n  // 验证为数字\n  prop1:\
  \ number,\n  // 验证为字符串\n  prop2?: string\n}\ndefineProps<Props>()\n</script>\n```\n\
  \n遗憾的是，由于组件编译的方式，这并不意味着你可以从其他文件导入接口或对象字面量——编译器目前不会检查导入文件的源类型，且组件本身是孤立编译的。\n\n在使用\
  \ TS 仅限类型的 `defineProps` 时，有一个限制，即你失去了在创建 props 时提供默认值的能力。Vue 提供了一个 `withDefaults`\
  \ 宏来帮助解决这个问题；其使用方法详见以下示例：\n\n```typescript\n<script setup lang=\"ts\">\ninterface\
  \ Props {\n  prop1: number\n  prop2?: string\n}\nconst props = withDefaults(defineProps<{Props}>(),\
  \ {\n  prop1: 0,\n  prop2: 'A string'\n})\n</script>\n```\n\n将数据传递给模板的方法保持不变。Props\
  \ 会自动供模板渲染器。\n\n### Data\n\n它不是组件间数据流的直接组成，但重要的是，虽然 Composition API 组件可以像 Options\
  \ API 通过 `data()` 函数一样使用该选项，但最好通过 `<script setup>` 和 `reactive()`/`ref()` 函数来使用状态。\n\
  \n### Events\n\n向 HTML 中添加事件的方法是相同的，无论是 Options API 还是 Composition API；毕竟这都是模板。在\
  \ Composition API 中定义事件处理器使用 `defineEmits()` 宏。`defineEmits()` 可以接收字符串列表或对象。\n\n\
  ```typescript\n// 作为函数定义事件处理器\n<script setup lang=\"ts\">\ndefineEmits(['event_1',\
  \ 'event_2'])\nfunction event_1(evt) { ... }\nfunction event_2(evt) { ... }\n</script>\n\
  ```\n\n```typescript\n// 作为对象定义事件处理器\n<script setup lang=\"ts\">\ndefineEmits({\n\
  \  event_1(evt) { ... },\n  event_2(evt) { ... }\n})\n</script>\n```\n\n```typescript\n\
  // 基于类型定义事件处理器\n<script setup lang=\"ts\">\ndefineEmits<{\n  (e: 'event_1', value:\
  \ number): void\n  (e: 'event_2', value: string): void\n}>()\n</script>\n```\n\n\
  虽然可以直接创建事件处理器，但它们终究是普通函数，最好的做法是通过 `defineEmits()` 定义它们，以防止属性透传（attribute fall through）问题。\n\
  \n### Computed properties\n\n计算属性使用 `computed()` 函数创建，该函数接收一个执行计算的回调函数。通常计算属性是只读的，但你需要创建\
  \ getter 和 setter 来使计算属性可变：\n\n```typescript\n// 计算一个简单的值\n<script setup lang=\"\
  ts\">\nimport { computed, ref } from 'vue'\nconst price = ref(29.99)\nconst asPrice\
  \ = computed(() => {\n  return `£ ${price.value.toFixed(2)}`\n})\n</script>\n```\n\
  \n```typescript\n// 让计算属性可写\n<script setup lang=\"ts\">\nimport { computed, ref\
  \ } from 'vue'\nconst price = ref(0)\nconst asPrice = computed({\n  get() {\n  \
  \  return `£ ${price.value.toFixed(2)}`\n  },\n  set(newPrice) {\n    price.value\
  \ = newPrice\n  }\n})\n</script>\n```\n\n在 TS 中工作时，返回类型会被推断。如果你需要指定返回类型，可以通过泛型参数实现；在下面的示例中，返回值标记为字符串：\n\
  \n```typescript\n// 设置返回类型\n<script setup lang=\"ts\">\nimport { computed, ref }\
  \ from 'vue'\nconst price = ref(29.99)\nconst asPrice = computed<string>(() => {\n\
  \  return `£ ${price.value.toFixed(2)}`\n})\n</script>\n```\n\n### Watchers\n\n\
  在 Composition API 中使用监听器与计算属性一样简单。\n\n使用监听器时，你需要定义两个参数以及值变化时发生的操作。\n\n传递给监听器的函数可以执行副作用，如下所示：\n\
  \n```typescript\n<script setup lang=\"ts\">\nimport { ref, watch } from 'vue'\n\
  const data: Ref<T> = ref({ as T);\nconst { watchedValue } = remote data fetch\n\
  watch(watchedValue, value => {\n  data.value = value?.getValue();\n});\n</script>\n\
  ```\n\n### Template Refs\n\n创建模板元素的引用需要一些思考。\n\n首先，我们在模板中使用特殊的 `ref` 属性来标记要追踪的元素：\n\
  \n```html\n<template>\n  <div ref=\"templateRef\">Div Content</div>\n</template>\n\
  ```\n\n下一个部分是在 `<script setup>` 中创建引用以便访问模板元素。为了实现这一点，我们使用 Vue 的 `ref()` 函数，并赋予它与模板中元素\
  \ ref 相同的名称。这只能在组件已挂载后的生命周期钩子中进行，否则它将返回 `null`：\n\n```typescript\n<script setup\
  \ lang=\"ts\">\nimport { ref, onMounted } from 'vue'\n// 这与模板中定义的名称相同\nconst templateRef\
  \ = ref(null)\n\nonMounted(() => {\n  templateRef.value.innerHTML = '<p>New content</p>'\n\
  })\n</script>\n```\n\n### 透传属性 (Fall-through attributes)\n\n\n\n\n\n透传属性（Fall-through\
  \ attributes）是指传递给子组件但未被显式声明为 prop 或 emit 的属性；常见的包括 `class`、`style`、`id` 属性以及事件监听器。这些属性会被传递到子组件的\
  \ DOM 中。\n\n当 `class` 和 `style` 属性透传时，它们会在输出 DOM 中自动合并：\n\n```html\n<!-- SubmitComponent\
  \ 模板 -->\n<input type=\"submit\" class=\"btn-lg\">Save</input>\n\n<!-- 在父组件中使用组件\
  \ -->\n<SubmitComponent class=\"bg-blue-400 text-white\" />\n\n<!-- 渲染后的输出 DOM -->\n\
  <input type=\"submit\" class=\"btn-lg bg-blue-400 text-white\">Save</input>\n```\n\
  \n在将透传属性绑定到具有多个根节点的模板时，有一些注意事项，主要的点是它们需要使用 `v-bind` 进行显式绑定。\n\n通过以下方式使用 `useAttrs()`\
  \ 函数可以方便在 JavaScript 中访问组件属性：\n\n```javascript\n<script setup>\nimport { useAttrs\
  \ } from 'vue'\nconst attrs = useAttrs()\n</script>\n```\n\n## 创建组合式函数工具 (Composable\
  \ utilities)\n\n使用 `setup()` 最大的问题是它包含了几乎控制组件功能的所有代码，因此当需要管理多种类型状态的组件时，这个函数可能会变得非常大。\n\
  \n转向这种 API 的核心意义是将管理特定关注点的所有功能放在一个地方，并在整个应用程序中复用。如果所有代码都放在 `setup()` 函数中，就无法实现这一点。\n\
  \n由于组合式 API 的特性（它使用标准的 JS 纯函数），因此通过将这些功能抽象为“工具函数”来组合组件功能成为可能。按照惯例，这些工具函数的名称带有 `use`\
  \ 前缀，例如 `useRef()`、`useCallback()` 等。\n\n提取此类代码允许我们创建所谓的“组合式函数（Comables）”——一组与特定关注点相关的功能集合，它们可以被导入到组件中，并像是组件的一部分一样被使用。\n\
  \n以下代码示例演示了如何将一些简单的功能提取到组合式函数中并导入备使用。\n\n假设我们正在构建一个需要获取自身数据的组件；为此，我们将使用 `Fetch API`。在简单简单的示例中，我们有如下组件：\n\
  \n```typescript\n<script setup lang=\"ts\">\nimport { ref } from 'vue'\nconst resp\
  \ = ref(null)\nconst err = ref(null)\nfetch('http://www.example.com')\n  .then(res\
  \ => res.json())\n  .then(json => { data.value = json })\n  .catch(e => { err.value\
  \ = e })\n</script>\n<template>\n  <div v-if=\"error\">{{ err.message }} Encountered</div>\n\
  \  <div v-else-if=\"data\">\n    Response received: <pre>{{ resp }}</pre>\n  </div>\n\
  \  <div v-else>Awaiting Response</div>\n</template>\n```\n\n这种样板代码并不是我们希望写在每个需要获取自身数据的组件中的；我们想要一种可以调用的东西，我们提供一些数据，然后它执行操作；核心点在于我们正在创建一个可以在代码库中复用的东西，甚至更好，可以在项目之间复用的东西。\n\
  \n处理这种情况的方法是将功能部分提取到 `use*` 函数中；在这种情况下，将其命名为 `useFetch()` 是合理的。我们创建一个包含导出的命名函数的文件：\n\
  \n```javascript\n// useFetch.js\nimport { ref } from 'vue'\nexport function useFetch(url)\
  \ {\n  const resp = ref(null)\n  const err = ref(null)\n  fetch(url)\n    .then(res\
  \ => res.json())\n    .then(json => { data.value = json })\n    .catch(e => { err.value\
  \ = e })\n  return { resp, err }\n}\n```\n\n此更改意味着我们可以将组件中的代码减少到如下：\n\n```typescript\n\
  <script setup lang=\"ts\">\nimport { useFetch } from './useFetch.js'\nconst { resp,\
  \ err } = useFetch('http://www.example.com')\n</script>\n```\n\n这是一个简单的示例，可以扩展；显然，这个特定的组合式函数示例仅在\
  \ setup 时获取，并且没有监听 URL 以便再次请求。\n\n组合式函数不仅有助于提取和复用功能，对于组织代码也有用。组合式 API 组件提供的可能性意味着所有功能都可以提取为更小的函数或组合式函数。组合式函数根据逻辑关注点形成，并根据需要导入，以提高可读性、导航性和理解代码的能力。\n\
  \n由于共享和复用专用功能的概念在行业内无处不在（既然可以借用已经做成的，为什么要重复造轮子呢），一个不断增长的工具库 `VueUse` 作为一个中央仓库或分发枢纽，处理社区遇到的不同关注点。我们接下来来看。\n\
  \n## VueUse – 组合式 API 工具库\n\nVueUse 文档可以在 [`github.com/vueuse/vueuse`](https://github.com/vueuse/vueuse)\
  \ 找到。\n\n将 Vue Use 引入项目与任何其他 NPM 包一样：\n\n```bash\nnpm i @vueuse/core\n```\n\n添加后，任何工具都可以通过\
  \ `setup()` 的常规通道导入。考虑此示例：\n\n```typescript\n<script setup lang=\"ts\">\nimport\
  \ { useStorage } from '@vueuse/core'\nconst state = useStorage('storageKey', {})\n\
  </script>\n```\n\n建议你仔细查看 VueUse 提供的 200 多个工具；那里某个工具可以让你任何项目变得更简单。\n\n## 处理依赖注入\
  \ - Provide 和 Inject\n\n我们已经在 [第 5 章] 设计组件的 UI 和单页应用中见过如何在 Options API 设置中使用 Provide\
  \ 和 Inject，尽管它是框架组合式 API 的补充。\n\n“属性钻取（props drilling）”问题——即必须跨组件层级传递属性，以便深层子组件能够访问根组件的数据——是非常脆弱的。这意味着我们必须在整个层级中维护传递的数据，即使中间组件对其没有用，这本质上扩大了所有中间组件的作用范围，让它们感知不需要的数据。\n\
  \n使用组合式 API `provide/inject` 比 Options API 更简单；你在 `setup()` 函数中使用 `provide()` 和\
  \ `inject()` 函数。\n\n我们将通过一个简单的示例来说明——首先，让我们设置一个提供某些数据的根父组件：\n\n```typescript\n<script\
  \ setup lang=\"ts\">\nimport { provide, ref } from 'vue'\n// 从父根提供一些 ref 数据\nconst\
  \ value = ref('value')\nprovide('key', value)\n</script>\n```\n\n这是设置一个可以被任何子组件通过\
  \ `key` 值提取的值，无论嵌套多深。\n\n深层子组件，例如根父组件的孙孙，需要该父提供的数据；这需要 `inject()`：\n\n```typescript\n\
  <script setup lang=\"ts\">\nimport { inject } from 'vue'\n// 注入父根的 ref 数据\nconst\
  \ value = inject('key', 'default value')\n</script>\n```\n\n`inject()` 函数中的可选默认值可以是任何类型，包括针对开销操作的工厂函数（在不需要该操作时）。\n\
  \n\n\n\n\n如果你发现需要修改一个提供的值，最佳做法是从父根组件提供一个变异函数。这样，数据和变异操作就被保留在一起，改进了维护体验，并消除了在各个组件代码库中创建重复代码的需求。Vue.js\
  \ 文档中提供了很好的示例，你可以在那里找到：[`vuejs.org/guide/components/provide-inject.html`](https://vuejs.org/guide/components/provide-inject.html)。\n\
  \n我们到为止还没有讨论的是，`provide` 键可以是字符串，也可以是 `Symbol`。当你的项目依赖大量的提供者，或者你正在向其他开发者提供组件时，使用\
  \ `Symbols` 作为 provide 键是有意义的；因为你需要确保键不会冲突。\n\n实现此点的最佳方法是创建一个专门的文件，导出所有的 `Symbol`\
  \ 键，并在需要的地方导入。由于 `Symbols` 在整个项目中是唯一值，因此可以避免冲突。\n\n拥有专门的文件还允许组件的维护者轻松查看项目中哪些键可用，而无需感知所有需要这些键的组件。\n\
  \n使用专门的 `Symbols` 文件用于提供者（providers）和注入器（injectors）的方法如例所示：\n\n```ts\n// keys.ts\n\
  export const mySymbolKey1 = Symbol()\nexport const mySymbolKey2 = Symbol()\n```\n\
  \n所需的键会被导入到提供者组件以设置数据，并导入注入器组件进行文件检索，如下所示：\n\n```vue\n// provider component\n<script\
  \ setup lang=\"ts\">\nimport { provide, ref } from 'vue'\nimport { mySymbolKey1,\
  \ mySymbolKey2 } from './keys.ts'\nprovide(mySymbolKey1, 'value')\nprovide(mySymbolKey2,\
  \ ref({}))\n</script>\n\n// first injector component\n<script setup lang=\"ts\"\
  >\nimport { inject } from 'vue'\nimport { mySymbolKey1 } from './keys.ts'\nconst\
  \ providedValue = inject(mySymbolKey1)\n</script>\n\n// second injector component\n\
  <script setup lang=\"ts\">\nimport { inject } from 'vue'\nimport { mySymbolKey2\
  \ } from './keys.ts'\nconst providedValue = inject(mySymbolKey2)\n</script>\n```\n\
  \n与所有事情一样，请谨慎使用这种技术。过度依赖提供者可能被视为一种反模式，特别是当你的组件树非常浅时。\n\n## 使用 Teleport 和 Suspense\n\
  \n在任何项目中，你都会发现从逻辑上讲，层次结构中的某个组件应该处理某些关注点/数据/显示。然而，该组件深度嵌套在 HTML 树中，但该组件的 HTML 输出需要附加到\
  \ HTML 的其他部分才能正确显示。\n\n这就是 `Teleport` 发挥作用的地方。简单来说，`Teleport` 允许我们将组件模板的一部分挂载到组件\
  \ DOM 树之外的 DOM 上。\n\n`Suspense` 处理的是另一个问题，但仍然涉及 HTML DOM 树的操作。通过 `Suspense`，你可以在\
  \ HTML 层级中协调多个异步依赖，而无需让这些组件每个处理自己的加载/错误状态。通过 `Suspense`，你可以避免页面上出现多个加载动画，并在内容到达的不同间隔将其交付给用户。`Suspense`\
  \ 允许从顶层组件进行管理；这个内置组件将在本章节中进一步讨论。\n\n## Teleport\n\n`Teleport` 是一个内置组件，用于封装组件 HTML\
  \ 树中任何需要挂载到页面 DOM 其他地方的部分。\n\n这个描述似乎有点模糊，所以一个示例可能会有所帮助。\n\n首先，我们将在父组件设置组件标签：\n\n\
  ```html\n<div class=\"...\">\n  <div><!-- component inner content --></div>\n  <div>\n\
  \    <FullScreenModal />\n  </div>\n</div>\n```\n\n从这里开始，内部结构如下：\n\n```html\n<template>\n\
  \  <div v-if=\"isOpen\" class=\"...\">\n    <div><!-- modal content area --></div>\n\
  \    <div><button @click=\"toggleModal\">Close</button></div>\n  </div>\n  <button\
  \ @click=\"toggleModal\">Open</button>\n</template>\n\n<script setup lang=\"ts\"\
  >\nimport { ref } from 'vue'\n// ... 针对 isOpen 和 toggleModal 的逻辑\n</script>\n```\n\
  \n（注：提供的原始文本在 Teleport 部分包含了一些重复/重叠的片段，已根据提供的上下文进行了清理，以保持逻辑流顺畅。）\n\n\n\n\n\n每个命名的状态（即\
  \ `pending`、`resolve` 和 `fallback`）都可以用于显示加载指示（旋转器、进度条等）或其他增强用户体验的反馈。\n\n使用 `Suspense`\
  \ 组件与使用任何其他组件没有区别：\n\n```html\n<template>\n  <Suspense>\n    <!-- 这是默认插槽 -->\n \
  \   <DefaultComponent />\n    <!-- fallback 模板插槽 -->\n    <template #fallback>\n\
  \      <FallbackComponent />\n    </template>\n  </Suspense>\n</template>\n```\n\
  \n在使用 `Suspense` 时，你会频繁使用 `<Transition>`（我们尚未涵盖这部分），以及 `<KeepAlive>` 和 `<RouterView>`\
  \ 组件。然而，这些组件的嵌套顺序非常重要，否则这些组件将无法正常工作。如果你遵循给定的模式，这些组件将按预期工作：\n\n```html\n<RouterView\
  \ v-slot=\"{ Component }\">\n  <template v-if=\"Component\">\n    <Transition mode=\"\
  mode\">\n      <KeepAlive>\n        <Suspense>\n          <!-- 动态注入 Component -->\n\
  \          <!-- 这是默认插槽 -->\n          <component :is=\"Component\"></component>\n\
  \          <!-- fallback 模板插槽 -->\n          <template #fallback>\n            <FallbackComponent\
  \ />\n          </template>\n        </Suspense>\n      </KeepAlive>\n    </Transition>\n\
  \  </template>\n</RouterView>\n```\n\nVue Router 支持组件的懒加载；我们将在第 10 章 使用 Vue Router\
  \ 在页面间跳转]中介绍 Vue Router。\n\n结论\n\n在本章中，我们探索了 Composition API。我们看到了它如何以及为什么可以使用它来简化关注点的代码，以及这如何使得这些关注点的代码更具维护性。\n\
  \n我们还涵盖了如何创建有助于复用的可组合功能，即可以在多个项目中复用的较小代码片段，这引出了我们能够使用并贡献于 VueUse 库。\n\n核心术语\n\n\
  *   Composition API\n*   `<script setup>`\n*   响应式 (Reactivity)\n*   依赖注入 (Dependency\
  \ Injection)\n*   灵活性 (Flexibility)\n*   组合 (Composing)\n*   VueUse 库\n*   Teleport\
  \ (传送)\n*   Suspense\n\n加入我们书籍的 Discord 空间\n\n加入书籍的 Discord 工作区以获取最新更新、优惠、全球科技动态、新发布以及与作者的交流会议：\n\
  \n**[`discord.bpbonline.com`](https://discord.bpbonline.com)**\n\n![](img/fm1.png)\n\
  \n# 第 7 章 使用 Vue CLI 和 Vite 创建并设置 Vue.js  (#contents.xhtml_ch07a)\n\n引言\n\n从这一章开始，你将按照第\
  \ 5 章 设计基于组件的 UI 和单页应用]中所讨论的内容，构建原型应用程序。你可能某些人可能不熟悉制作此或任何成功项目所需的某些工具。本章对于任何使用 Vue.js\
  \ 的项目都是基础性的；事实上，你在这里学到的一些技能将是许多其他项目（基于 JavaScript 的或其他其他语言）的基础。\n\n我们将首先介绍 Node\
  \ 包管理器 `NPM`，对于那些从未接触过版本管理或使用过 `Git` 的人，我们也涵盖这部分内容。\n\n最后，我们将涵盖如何使用行业中用于 Vue.js\
  \ 项目的三种可用工具启动项目。\n\n那么，让我们从用于任何 JavaScript 项目的工具开始介绍：`Git` 和 `NPM`。\n\n结构\n\n我们本章将涵盖以下主题：\n\
  \n*   `Git`\n*   `NPM`\n*   Vue CLI\n*   Vue UI\n*   Vite\n\n目标\n\n本章的目标是让你熟悉在行业中遇到的标准工具。\n\
  \n如果你熟悉 `Git` 和/或 `NPM`，可以安全地跳过本章的这些部分。\n\n熟悉设置 Vue.js 项目非常重要。即使你已经了其中某些方法，经常回顾一下它们也是值得的。\n\
  \nGit 和 NPM 入门\n\n在本节中，我们将涵盖 `Git` 和 `NPM` 基础工具。`Git` 是行业中使用的少数无处不在工具之一，无论技术如何，你将在许多项目中使用它。`NPM`\
  \ 是你可能遇到的包管理器之一。其他的还有 `Yarn` 和 `pnpm`。我们将使用 `NPM`，因为它是安装 `Node` 时自带的标准工具，所以它已经是可用的，而不是你需要在\
  \ `Node` 之上额外安装的第三方工具。\n\nGit 入门\n\n`Git` 是最可用且最流行的工具。\n\n`Git` 是一套分布式版本控制系统 (DVCS)。\n\
  \n`SHA` 是分支历史中某点的引用。每个 `SHA` 在仓库中都是唯一的，且长度为 32 位。\n\n`Branch`（分支）是 `Git` 中的基本单元。分支存在于远程或本地，每个分支都是作为基础的分支副本，加上所做的更改。分支可以被创建、检出、提交、推送到和合并。除了分支中包含的代码外，每个分支都保留了所有所做更改的记录；这被称为分支历史，是\
  \ `Git` 工作原理的基础。分支有名称，由你在创建分支时分配。通常，主分支/第一个分支被称为 `master` 或 `main`。根据你公司/团队使用的分支策略，你可能还有诸如\
  \ `development`、`feature`、`integration`、`release`、`bug` 和 `hot fix` 等名称的二级分支。下面的列表提供了示例：\n\
  \n```bash\n### 从当前分支创建分支\ngit branch <source-branch> <new-branch>\ngit branch master\
  \ new-branch\n\n### 切换到新分支\ngit switch new-branch\n\n### 删除分支 - 合并后\ngit branch\
  \ -d new-branch\n\n### 强制删除分支\ngit branch -D new-branch\n```\n\n有很多视觉化工具可以帮助你：：GitKraken,\
  \ SourceTree, TortiseGit, `git-gui` 和 `gitk`。使用 GUI 似乎是一种更简单的方法，但如果不理解底层在执行什么，你会发现很难修复问题。\n\
  \n基础术语\n\n在本节中，我们将涵盖使用 `Git` 时常用的基础术语，并提供在命令行中使用它们的示例：\n\n```bash\n### 列出本地分支\n\
  git branch --list\n```\n\n\n\n\n\n### 列出远程分支\n\n```bash\ngit branch --list --remote\n\
  ```\n\n有时候需要重命名分支，这可以通过 `-m` 选项来实现：\n\n### 重命名本地分支\n\n```bash\ngit branch -m renamed-branch\n\
  ```\n\n## 仓库 (Repository)\n\n仓库（`repo`）是存放分支、因此存放项目文件的地方。仓库通常（但并非一定）存储在远程位置；这可以是像\
  \ GitHub 或 BitBucket 这样的仓库托管主机，可以是公司网络上的私有托管服务器（本地部署），也可以是你本地机器上的。由于 Git 的 分布式特性，使用远程主机是最好的，且远程通常被视为绝对的真理来源（absolute\
  \ source of truth）。\n\n设置本地仓库相对简单：\n\n### 初始化仓库\n```bash\ngit init\n```\n\n### 如果你想添加当前目录中的现有代码\n\
  ```bash\ngit add .\ngit commit\n```\n\n设置远程仓库则更为复杂。大多数公司倾向于使用 GitHub 或 BitBucket\
  \ 这样的远程托管服务来存储代码。\n\n## 远程 (Origin)\n\n远程通常（但不是必须）被称为 `origin`。它只是一个网络地址的别名，方便记忆。origin\
  \ 是你克隆或拉取代码的地方，也是默认的推送目标。然而，对于任何事物，它都可以重新指向；Git 允许你很方便地做到这一点。你也可以为代码分发设置多个远程端点，但通常你只需要或只会使用名为\
  \ `origin` 的那。\n\n### 列出远程\n```bash\ngit list --remote\n```\n\n### 添加远程\n```bash\n\
  git remote add branch-name\n```\n\n### 修改远程 URL\n```bash\ngit remote set-url new-url\n\
  ```\n\n所有这些命令都会更改你本地 git 配置文件中的设置：\n\n### 编辑配置文件 / 打开编辑器\n```bash\ngit config -e\n\
  ```\n\n```ini\n[core]\nrepositoryformatversion = 0\nfilemode = true\nbare = false\n\
  logallrefupdates = true\nignorecase = true\nprecomposeunicode = true\n[remote \"\
  origin\"]\nurl = git@remote-url/branch.git\nfetch = +refs/heads/*:refs/remotes/origin/*\n\
  [branch \"master\"]\nremote = origin\nmerge = refs/heads/master\n[pull]\nrebase\
  \ = false\n[remote \"heroku\"]\nurl = https://git.heroku.com/branch.git\nfetch =\
  \ +refs/heads/*:refs/remotes/heroku/*\n[branch \"new-branch\"]\nremote = origin\n\
  merge = refs/heads/new-branch\n```\n\n你可以手动更改这些内容，但请注意，如果你不知道在做什么，可能会导致无法访问远程仓库的访问，这是不建议的。\n\
  \n## 本地 (Local)\n\n你的本地指的就是本地，即你在本地编辑代码的地方。通常，这是你的本地开发环境，但也可以是远程开发服务，如 Eclipse Che。\n\
  \n## 克隆 (Clone)\n\n克隆是指对远程仓库和分支创建一个引用，制作该远程分支所有代码的副本，并将其下载到指定的本地（即你的本地）。一旦仓库被克隆，你就可以检出（checkout）或创建一个工作分支。\n\
  \n要克隆，执行以下命令：\n\n### 克隆远程分支\n```bash\ngit clone http://repo.com/path/to/repo branch-name\n\
  ```\n\n## 检出/切换 (Checkout/Switch)\n\n当你执行 checkout 时，你主要是在分支之间切换，但 checkout 命令也可以用于创建一个新的本地分支并切换过去。\n\
  \n如果只是切换分支，执行以下操作：\n\n### 切换到分支（新功能 实验性）\n```bash\ngit switch branch-name\n```\n\
  \n### 检出分支\n```bash\ngit checkout branch-name\n```\n\n要从当前检出的分支创建新分支并切换，执行以下操作：\n\
  \n### 创建并切换到新分支（新功能 实验性）\n```bash\ngit switch -c branch-name\n```\n### 或\n```bash\n\
  git checkout -b branch-name\n```\n### 检出上分支\n```bash\ngit checkout -\n```\n\n`switch`\
  \ 和 `checkout` 之间的主要区别（除了 `switch` 是实验性的因此存在可能会改变）在于，`switch` 不需要干净的索引（index）和工作树（working\
  \ tree），但如果切换会导致更改丢失，它将终止。\n\n## 获取 (Fetch)\n\n当你执行 fetch 时，你是在拉取分支历史的副本而不是分支的更改，这样你就可以判断是否有需要拉取或推送的更改，如下：\n\
  \n### 从 origin 获取所有历史\n```bash\ngit fetch\n```\n### 或获取特定分支\n```bash\ngit fetch\
  \ git://path/to/repo/branch.git\n```\n\n## 拉取 (Pull)\n\n当你从远程拉取代码时，你会获得分支历史的副本（如果还没有最新版本），以及需要在本地应用的所有代码更改的补丁，以便使分支与远程保持同步，如下：\n\
  \n### 从远程分支拉取更改\n```bash\ngit pull origin branch-name\n```\n\n当你处于有多人想要向同一分支提交代码的团队中时，你通常需要在推送之前拉取。\n\
  \n## 提交 (Commit)\n\n提交意味着将你在本地制作的未提交的更改应用到本地分支，见下：\n\n### 将所有本地更改添加到工作分支历史\n```bash\n\
  git add .\n```\n### 提交代码并打开编辑器窗口添加提交信息\n```bash\ngit commit\n```\n### 仅提交已跟踪的文件并打开编辑器\n\
  ```bash\ngit commit -a\n```\n### 命令行中带消息提交\n```bash\ngit commit -m 'Message here'\n\
  ```\n### 添加、提交并包含消息\n```bash\ngit commit -am 'Message here'\n```\n\n此命令更新本地分支历史。这是将你的代码更改推送到远程分支进行检查和分发的先驱。\n\
  \n## 合并 (Merge)\n\n当你执行合并时，你在本地将从一个分支的代码更改应用到另一个分支，合并分支历史：\n\n### 从命名分支合并代码\n```bash\n\
  git merge prev-branch\n```\n### 从之前检出的分支合并代码\n```bash\ngit merge -\n```\n\n有时，如果同一代码位置存在多个更改，合并可能会导致冲突——分支上的代码冲突需要在继续进行合并（如果合并中有许多文件）或在推送到远程之前进行解决。\n\
  \n## 推送 (Push)\n\n推送会将远程分支历史与你的本地保持一致，并向远程发送包含本地代码更改的补丁文件；它将你的本地代码合并到同名的远程分支，如下：\n\
  \n### 将代码推送到远程 - origin\n```bash\ngit push origin branch-name\n```\n\n远程分支历史可以独立管理，这样就可以进行代码质量检查、远程测试、构建和集成，如果你的公司有这些操作的话。\n\
  \n\n\n\n暂存（Stashing）在你需要从远程拉取代码时最有用，但你意识到可能会产生冲突，需要保护你的更改，以便在拉取/合并后以受控的方式应用。\n\n\
  ## Diff（差异）\n\nDiff 允许你比较分支之间（本地或远程）或分支不同状态之间的代码更改。列表列出了使用 diff 的多种方式：\n\n1. `diff`\
  \ 当前分支相对于 `HEAD` 做的更改\n2. `git diff`\n3. `diff` 将当前分支与另一个分支进行比较\n4. `git diff branch-1\
  \ branch-2`\n\n能够查看 diff 可以让你看到代码更改可能在何时或何处引起冲突，或者是否存在破坏性变更（breaking change）需要你将其定位。\n\
  \n在阅读 diff 或任何更改的描述时，`+` 符号（通常在绿色行）表示该行的新增内容，`–` 符号（通常在红色行）表示该行的删除内容。没有更改的行通常显示为灰色。\n\
  \n## Patch（补丁）\n\nPatch 将 diff 导出到一个文件中。然后可以根据需要发送该文件。通常不需要创建 patch。推送/拉取和合并是移动代码最有效且易于管理的方式。\n\
  \n## Rebase（变基）\n\n有时你需要重写分支历史，将多个 commit 合并为一个 commit，或者你需要选择性地操作/重新排列 commit；为此，你需要\
  \ `rebase`。\n\nRebase 是一个强大的工具，需要一些练习才能学会正确使用。能力越大，责任越大；由于你正在重写历史，如果不小心，很容易丢失更改。\n\
  \n## Cherry-pick（挑选）\n\n顾如其名，cherry-picking 意味着你从你需要的分支中选择 commit，并将它们各自的历史合并到当前分支中。这同样是一个不应轻率使用的强大工具。\n\
  \n## NPM 入门\n\nNode Package Manager（Node 包管理器）顾如其名，就是一个包管理器。大多数情况下，你与它的交互是向项目中添加包或更新这些包。有时，你会用它来启动项目。除非你是包维护者，否则你基本上就是用它做这些。\n\
  \n### 初始化项目\n\n启动 JavaScript/TypeScript 项目有许多方法。即使是使用 Vue.js，也有至少三种方法可以实现相同的功能。不同的前端生态系统有它们自己的实现方式。尽管如此，这些每种方法在最基础的上都是对\
  \ `package.json` 的封装。\n\n`package.json` 文件是任何 JS 项目的核心，因为它定义了项目依赖、项目元数据、运行项目的脚本以及启动点。\n\
  \n即使没有生态系统工具，创建一个 JS 项目也是简单的：\n\n```bash\nnpm init\n```\n\n一旦创建了此文件，你就可以开始向项目添加依赖、元数据和其他元素。随着我们后续的进行，将会讨论\
  \ `package.json` 文件。\n\n### 安装新包\n\n向项目中安装新包的最简单方法是通过 `npm i <package-name>`。`i`\
  \ 是 `install` 的快捷选项。你完全可以写 `npm install <package-name>`，但 `i` 更短。\n\n这个简单的命令会更新\
  \ `package.json` 文件，添加一行引用所命名包的最新版本的引用，获取该包并将其放入项目本地的 `node_modules` 文件夹中。然后它会读取该\
  \ `package.json` 文件，并对该文件中列出的所有依赖执行相同的操作，直到所有依赖都汇集到 `node_modules` 目录下。它还会检查所有必需包中命名的版本是否兼容；如果不兼容，它会发出警告，并在你可能需要添加该命名包要求的“对等依赖”的其他内容时通知你。最后，它创建一个\
  \ `package-lock.json` 文件，其中包含所有相同的信息，但在项目在其他环境中部署时锁定版本。如果已存在锁文件，将优先使用它，以确保跨部署的各个版本在提供的版本限制范围内尽可能相似。使用如此小的命令节省了大量工作。它的简易性隐藏了所有这些细节。\n\
  \n如果你发现自己需要一个与最新版本不同的包版本，那么可以将安装命令更改为包含特定版本，例如：`npm i <package-name>@<version>`。\n\
  \n`npm i` 命令还接受几个不同的选项。你所有想要使用的包对于生产部署并不是必要或适当的；这些包括你测试代码所需的包，或者用于从 js 构建 css 并进行编译的工具。对于这些包，你需要使用以下：\n\
  \n```bash\nnpm i --save-dev <package-name>\n```\n\n这执行与之前描述相同的安装序列，但仅用于你的本地开发。该包的引用也被放置在\
  \ `package.json` 文件稍有不同的部分，以便将生产包与仅在开发环境中需要的包分开。\n\n如果你在不带任何包名的情况下运行 `npm i` 命令，它将检查本地\
  \ `package.json` 文件并安装其中列出的所有依赖。这允许你手动调整 `package.json` 文件的引用，然后运行命令重新安装所有包。删除 `node_modules`\
  \ 目录并重新安装依赖也未闻新鲜。\n\n最后要提到的一点：某些包可能需要全局安装，即在项目 `node_modules` 目录之外。这是因为如果它是本地工具、测试包、格式化程序或可执行文件（此类推），那么它需要在系统范围内可用。要实现这一点，你需要在命令中包含\
  \ `-g`（全局）。此开关会将包（及其依赖）安装在系统可用位置，以便从命令行终端访问。\n\n### 更新已安装的包\n\nNPM 生态系统有多种工具可以帮助更新，但\
  \ NPM 本身使用 `npm outdated` 来指出需要更新的包并提供如何操作的信息。\n\n需要记住的一点是，尽管 `npm outdated` 标记了包需要更新，但这并不意味着应该更新。更新时涉及许多因素，因为最新版本可能会向项目中引入不兼容或不稳定性。其中一些问题可以通过手动或自动化测试处理，但你仍然需要构建并运行你的项目以测试由更新包引起的问题。\n\
  \n再次，根据经验，你可以手动更新 `package.json` 文件到你想要使用的包版本，然后运行 `npm i` 安装更新。\n\n## 执行包安全审计\n\
  \n作为一名专业开发者，除了构建功能性产品外，你的首要考虑应该是构建一个安全的产。\n\n你的 Vue.js 项目将交付给全球用户，其中某些用户可能并没有预期的功能意。所有的代码（即使经过了编译并位于\
  \ `node_modules` 中）对浏览器可见，因此对浏览器内部开发工具也是可见。所以，任何人都可以查看代码的作用或 Web 应用在本地存储了什么数据。你应该假设所有的依赖以及任何与外部服务器资源（第三方或其他）通信的代码在本质上是不安全的。\n\
  \nNPM 提供了一项服务，查询在线资源以确定任何项目依赖是否被标记为不安全、危险或某些方面不兼容，并提供如何解决这些问题的建议。大多数情况下，修复方法是将包更新到最新版本，但在某些情况下，你需要更谨慎地处理不安全的包。有时，Google\
  \ 是你的朋友。\n\n\n\n要运行包安全审计，请在终端中执行以下命令：\n\n1. `npm audit`\n\n这将返回一个任何被标记为存在问题的包列表。\n\
  \n在某些情况下，包可以自动更新；要执行此操作，可以使用以下命令：\n\n1. `npm audit --fix`\n\n任何无法以此方式更新的包将在执行此命令后仍被标记，并提供可能的解决方案的提示。\n\
  \n请记住，不要信任你的项目依赖或任何第三方系统、你的代码、你的生产环境或你的用户。所有这些都是可能的攻击向量，可能会让你的用户或应用程序数据面临风险。\n\n\
  # package.json 文件\n\n`package.json` 文件是任何 JS/TS 项目的骨干。它是定义所有项目元数据的地方：项目和开发依赖；执行和测试脚本；关键词、NPM\
  \ 和项目设置；项目入口点。\n\n由于它是一个 JSON 文件，它需要符合 JSON 验证规则。\n\n关于你可以使用的所有选项的详尽信息，可以在 [`docs.npmjs.com/cli/v8/configuring-npm/package-json`](https://docs.npmjs.com/cli/v8/configuring-npm/package-json)\
  \ 找到。\n\n你对该文件进行大部分更改的主要选项位于以下章节中：\n\n* `scripts`\n* `config`\n* `dependencies`\n\
  * `devDependencies`\n* `peerDependencies`\n* `engines`\n\n其他工具可能也想在 `package.json`\
  \ 文件中存储数据；典型的有 babel、`typescript`、`postcss`、`prettier` 和 `eslint`。\n\n在上面的链接中有很多关于如何指定依赖版本的详细信息，但我们将在稍后进行详细讨论，当我们需要直接修改\
  \ `package.json` 文件时。\n\n现在我们已经掌握了所有这些信息，我们准备好按照在第 5 章“设计基于组件的 UI 和单页应用”中所讨论的开始创建项目了。第一步将提醒我们如何使用可用的三种主要方法之一来创建项目。这将是一个简短的回顾，以便我们进入第\
  \ 8 章“为项目添加 CSS 框架——TailwindCSS、Bootstrap 或 Foundation”中更有趣的工作。\n\n## 使用 Vue CLI\
  \ 创建项目\n\n在本节和接下来的两个章节中，我们将创建要在后续章节中构建的项目基础，每个章节将回顾一种不同的方法，但仍然形成了项目所需的基础。\n\n由你或你的团队来选择最适合你当前情况的方法，因为每种方法产生的结果略有不同。\n\
  \n我们将项目命名为 `speedy-pizza-e-commerce-prototype`，其含义不言自知。此时，我们还将为代码设置 git 跟踪和远程托管。\n\
  \n此时，我们假设你已经安装了运行 CLI 的前提条件。\n\n在你的命令行中执行此命令：\n\n```bash\nvue create speedy-pizza-e-commerce-prototype\n\
  ```\n\n这将启动 CLI 向向并向你显示内容：\n\n1. Vue CLI v5.0.1\n2. `? Please pick a preset:`\n\
  3. `standard-setup ([Vue 2] router, vuex, sass, babel, pwa, eslint, unit-jest, e2e-nightwatch)`\n\
  4. `clives-setup ([Vue 2] router, vuex, babel, pwa, eslint)`\n5. `Default ([Vue\
  \ 3] babel, eslint)`\n6. `Default ([Vue 2] babel, eslint)`\n7. `❯ Manually select\
  \ features`\n\n我们将手动选择功能——最后一个选项。\n\n这会打开一个选择菜单，其中 Babel 和 Linter 功能已经被选中。我们将添加\
  \ TypeScript、PWA 支持、Router 和单元测试：\n\n1. Vue CLI v5.0.1\n2. `? Please pick a preset:\
  \ Manually select features`\n3. `? Check the features needed for your project: (Press\
  \ <space> to select, <a> to toggle all, <i> to invert selection, and <enter> to\
  \ proceed)`\n4. ◉ Babel\n5. ◉ TypeScript\n6. ◉ Progressive Web App (PWA) Support\n\
  7. ◉ Router\n8. ◯ Vuex\n9. ◯ CSS Pre-processors\n10. ◉ Linter / Formatter\n11. ◉\
  \ Unit Testing\n12. ◯ E2E Testing\n\n从这里开始，我们继续选择我们想要使用的 Vue 版本；CLI 默认选择 3.x 版本：\n\
  \n1. `? Choose a version of Vue.js that you want to start the project with (Use\
  \ arrow keys)`\n2. `❯ 3.x`\n3. `2.x`\n\n接下来，我们将强制应用程序使用类样式的组件：\n\n1. `? Choose a\
  \ version of Vue.js that you want to start the project with (Use arrow keys)`\n\
  2. `❯ 3.x` (等等，这里显示的也是 3.x，但按照流程操作)\n3. `? Use class-style component syntax? (y/N)`\n\
  \n下一个选项选是：\n\n1. `? Use class-style component syntax? Yes`\n2. `? Use Babel alongside\
  \ TypeScript (required for modern mode, auto-detected polyfills, transpiling JSX)?\
  \ (Y/n)`\n\n我们将在历史模式中使用 Router：\n\n1. `? Use class-style component syntax? Yes`\n\
  2. `? Use Babel alongside TypeScript (required for modern mode, auto-detected polyfills,\
  \ transpiling JSX)? Yes`\n3. `? Use history mode for router? (Requires server setup\
  \ for index fallback in production) (Y/n)`\n\n最后，我们添加 ESLint 和 Prettier：\n\n1. `?\
  \ Use Babel alongside TypeScript (required for modern mode, auto-detected polyfills,\
  \ transpiling JSX)? Yes`\n2. `? Use history mode for router? (Requires server setup\
  \ for index fallback in production) Yes`\n3. `? Pick a linter/formatter config:`\n\
  4. `ESLint with prevention only`\n5. `ESLint + Airbnb config`\n6. `ESLint + Standard\
  \ config`\n7. `❯ ESLint + Prettier`\n\n我们面临的下一个选项是告诉 ESLint 在保存时进行 lint；这强制了风格的一致性。向导移动到测试框架：\n\
  \n1. `? Pick a unit testing solution: (Use arrow keys)`\n2. `❯ Jest`\n\n最后，我们将让脚架工具将配置放在单独的文件中，这长期来看更易维护：\n\
  \n1. `? Where do you prefer config for Babel, ESLint, etc.? (Use arrow keys)`\n\
  2. `❯ dedicated files`\n\n最后一个问题是否是将这些选项保存为预设。对于本节，我们将回答“no”，但一旦你对一组选项感到满意，最好在这个问题上回答“yes”：\n\
  \n1. `? Save this as a preset for future projects? (y/N)`\n\n一旦完成，项目将开始构建：\n\n```\n\
