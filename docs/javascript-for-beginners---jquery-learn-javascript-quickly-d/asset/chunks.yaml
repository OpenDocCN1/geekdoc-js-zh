  trans: '


    通常情况下，JavaScript 应用采用自底向上的方法。用户界面始终处于开发的中心。用户界面与服务器通过后端代码直接相连。


    这种 JavaScript 架构主要用于简单的程序，例如不需要复杂框架的网站。它无法应对更复杂的程序。它允许你与屏幕进行交互，但并不具备处理大型应用的能力。


    SPA 或单页应用利用了典型的 JavaScript 架构。它们很容易更新，并且在今天仍然很有需求。SPA 只能在网页浏览器中使用，因此它们非常依赖 JavaScript。SPA
    的速度通常比移动端应用更快，因为用于构建它们的脚本只需要加载一次。从那时刻起，它的唯一工作就是在用户和服务器之间传输数据。


    ## 基于框架的架构

    随着时间的推移，典型应用架构的能力已无法满足全球范围内程序员的需求。因此，基于框架的架构运而生。它可以解决更复杂的问题，因为它利用了 `MVC` 或 `MVVM`
    模式。


    `MVC` 代表 `Model View Controller`（模型-视图-控制器）。它将较大的应用程序分为不同的部分，每个部分都有独特的功能。每个部分都负责处理应用程序的不同方面。模型代表所有与数据相关的内容。它从控制器接收命令，然后执行用户的输入。视图控制所有与用户界面相关的内容。它从用户获取输入，然后将模型的数据呈现给用户。控制器是两者之间的连接。它处理并操作来自双方的数据，然后产生输出。


    `MVC` 有不同的变体：


    - `HMVC`–代表 `Hierarchical Model view controller`（分层模型视图控制器）。它本质上与 `MVC` 相同，但具有层次和更多功能。它将
    `MVC` 重应用于应用程序的不同部分。分层对应用开发大有奇效。你可以轻松地重用代码，而不必担心持续维护。

    - `MVA`–代表 `Model View Adapter`（模型-视图-适配器）。通常数据从控制器传输到模型，但在 `MVA` 中，控制器是中间人，`Model`
    和 `View` 必须通过它传递。`View` 和 `Model` 实际上并不交叉。在这里，`Controller` 充当适配器。

    - `MVP`–代表 `Model View Presenter`（模型-视图-演示器）。这与 `MVC` 取不同。演示器负责应用程序中所有的数据。它将这些数据发送到模型进行处理，接收返回，然后将其传递给
    `View`。

    - `MVVM`–代表 `Model-View ViewModel`（模型-视图-视图模型），类似于 `MVC` 和 `MVP` 的混合，因为它借鉴了它们的模式。数据和信息与用户界面完全分离。控制器被
    `Viewmodel` 取代，它连接了 `Model` 和 `View`。`Viewmodel` 每次接收到输入都会更新 `Model`，并在发送到 `View`
    之前对该数据进行适配。


    框架拥有功能丰富的运行时，用于渲染并输出应用程序。我们可以将运行时环境比为一个容器。它包含了运行 JavaScript 代码所需的所有内容，即：

    - `Engine`（引擎）

    - `Web API’s`

    - `Event loops`（事件循环）

    - `Call back queue`（回调队列）

    - `Micro task queue`（微任务队列）


    ## JavaScript 引擎

    引擎将 JavaScript JavaScript 的复杂代码转换为机器可以理解的代码。每个浏览器都有自己的引擎。一些著名的引擎是 `V8`、`SpiderMonkey`
    和 `JavaScript Core`。


    ### V8

    没有两个引擎是相同的，它们的运行方式不同，但最终做的事情相同。在 `V8` 引擎中，一切始于 `Parser`（解析器）。`Parser` 检查语法和语义。语法是代码输入的结构，而语义指的是代码中某些单词和符号的含义。然后
    `parser` 分析并拆解代码，生成抽象语法树 (`AST`)。`AST` 是源代码的树形表示。`AST` 然后进入 `Interpreter`（解释器）。`Interpreter`
    将 `AST` 转换为字节码 (`Byte Code`)。这被称为 `ignition`。有时代码会重复高达千次。当这种情况发生时，`Profiler`（分析器）会检查代码重复并尝试对其优化。一旦获得优化后的代码，它就会移动到
    `Compiler`（编译器）。V8 引擎中的编译器被称为 `TurboFan`。`Turbofan` 以最优化的形式发布 `Byte Code`。


    ### SpiderMonkey

    `SpiderMonkey` 实际上是第一个引擎，创建于 1995 年。Mozilla 基金一直在维护它，并在今天在使用。该引擎首先将 JavaScript
    代码转换为 `ByteCode`，然后将其发送给 `Interpreter` 和 `JIT Compiler`。`JIT` 代表 `Just in Time`（即时编译）。`JIT
    Compiler` 优化代码并将任何未使用的代码发送到 `Garbage collector`（垃圾回收器）。


    ### Web API’s

    `API` 代表 Application Programming Interface（应用程序接口）。它是一个为用户一组函数的接口，同时隐藏了该函数的底层机制。`Web
    API’s` 实际上并不是 JavaScript 的一部分。它们位于浏览器中，但它们允许我们访问 `JavaScript Engine`。


    `Web API’s` 包含：

    - 一组 timeout–允许你在经过特定时间（由你定义）后执行一段代码。

    - `DOM API’s` - 由定义 HTML 中每个元素如何工作方式的接口组成。这包括它们可能依赖的任何支持类型和接口。

    - `Fetch`–`API` 让 JavaScript 能够操作 `Call Stack`（调用栈）中的请求和响应。

    - `Local storage`–让 JavaScript 应用无限期保存重要的键值对。

    - `Console`–注册由 JavaScript 代码记录的所有日志消息。

    - `Location`–允许浏览器用户在任何时候共享他们的地理位置。


    ### Event Loops

    JavaScript 是单线程代码。这意味着它一次只能运行一个命令。这些命令是同步的，因为它们一个接一个地运行。这在编程中并不总是有效，所以有方法让 JavaScript
    异步执行。像 `Call stacks`（调用栈）这样的机制有助于避免同步线程中可能发生的任何阻塞。


    `Call stack` 是解释器用于跟踪函数及其在任何给定脚本中位置的机制。它允许函数并发运行。当脚本调用函数时，解释器将其放入调用栈中然后执行该函数。


    `Callback Queue`（回调队列）像一个安全屋，未执行的脚本行留在那里，直到到了运行时间。


    `Event Loop`（事件循环）的工作是检查 `Call Stack` 和 `Callback Queue`。如果 `Call Stack` 为空，`Event
    Loop` 将提取 `Callback Queue` 中的语句并推入 `Call Stack`。这看起来是一个非常直接的过程，但有一个被称为 `MicroTask
    Queue`（微任务队列）。`MicroTask queue` 几乎是 `Callback Queue` 的副本，但它具有更高的优先级，这意味着其中的任何函数都将先执行。


