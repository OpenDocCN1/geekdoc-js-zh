    up and you can get started by trying out some simple comments. The downside is
    that if you refresh the page, the code will disappear and you will have to start
    from scratch. You can also only execute one command at a time.


    If you are developing, you are going to need the able to save your code and execute
    multiple commands at any given time. For that you are going to want to write JavaScript
    in a simple text file and then send it to the browser to execute.

