    尽管框架架构（Framework Architecture）比典型架构具有更多功能，但在构建大型应用时仍然有其局限性。它增长以适应更大应用的唯一方法就是持续的维护和开发。`MVC`
    和 `MVVM` 模式虽然方便并允许开发者复用代码，但它们在框架中存在问题。由于控制器在操作视图的同时与服务器进行通信，导致用户界面受到了损害。人们开始需要功能更丰富的架构，于是“高级
    JavaScript 架构”（Advanced JavaScript Architecture）应运而生。在这种架构中，用户界面与服务器的通信完全分离工作，因此可以轻松应对大型应用可能提出的任何需求。


    在这种情况下，数据计算和用户界面是完全分离的。用户界面不再处于中心，因此应用程序变得更容易管理和使用。


    ## 通用应用


    正式称为同构应用（Isomorphic applications），它们由于代码较少，因此提供了更快的浏览器连接。它们在客户端和服务器端均运行，确保了更简单的交互，并减少了程序员的工作量。唯一的缺点是它们非常难以调试。


    # 第 4 章：JavaScript 和 JQuery


    让我们回顾 JavaScript 的一些重要特性，以便让你更好地了解它的工作原理。第一个特性是变量（Variables）。变量就像存储值的容器。数据可以存放在这些容器中，然后你可以通过命名容器来引用它。每项有价值的编程任务都需要一个变量。如果值无法改变，你的网页交互性将会降低。在
    JavaScript 程序中使用变量之前，你必须先声明它。变量的关键字（如第一章所示）是 `var`。


    ```html

    <script type="text/javascript">

    <! --

    var age;

    var race;

    // -- >

    </script>

    ```


    你也可以使用相同的关键字声明不同的变量。它看起来像：


    ```html

    <script type="text/javascript">

    <! --

    var age, race;

    // -- >

    </script>

    ``` (JavaScript - Syntax, n.d.)


    当我们在变量中存储值时，就会发生初始化。你可以在任何时间添加值。我们创建了一个名为 `race` 的变量，因此我们可以稍后向它添加值‘black’，并可以在初始化时添加
    `age` 的值。它看起来像：


    ```html

    <script type="text/javascript">

    <! --

    var age = "39"

    var race;

    race= black;

    // -- >

    </script>

    ``` (JavaScript - Syntax, n.d.)


    `var` 关键字只需要在初始化时使用一次。


    变量的作用域（scope）是程序中定义它的区域。在 JavaScript 中只有两种：


    -   **全局变量 (Global Variables)**：可以在 JavaScript 代码的任何地方定义。

    -   **局部变量 (Local Variables)**：仅在定义的函数范围内可见。


    在函数体内部，局部变量的优先级高于同名的全局变量。当局部变量或函数参数与全局变量同名时，全局变量实际上被隐藏了。例如：


    ```html

    <html>

    <body onload = checkscope();>

    <script type="text/javascript">

    <! --

    var myVar = "global"; // 全局变量

    function checkscope() {

    var myVar = "local"; // 局部变量

    document.write(myVar);

    }

    // —->

    </script>

    <body>

    </html>

    ``` (JavaScript - Syntax, n.d.)


    变量的命名遵循规则。变量名对大小写敏感，因此 `race` 和 `Race` 是两个不同的变量。变量名不能以数字开头。它们必须以字母或下划线开头。如果你的变量命名为
    `345age`，它是无效的。但如果命名为 `_345age`，它是有效的。


    有一组 JavaScript 保留关键字列表不能作为变量名。列表如下：


    | abstract | boolean | break | byte | case | catch |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | char | class | const | continue | debugger | default |

    | delete | do | double | else | enum | export |

    | extends | false | final | finally | float | for |

    | function | goto | if | implements | import | in |

    | instanceof | int | interface | long | native | new |

    | null | package | private | protected | public | return |

    | short | static | super | switch | synchronized | this |

    | throw | throws | transient | true | try | typeof |

    | var | void | volatile | while | with | |


    (JavaScript - Syntax, n.d.)


    大多数应用程序的运行是因为客户端与远程服务器之间的交互。客户端指的是终端用户设备。客户端向服务器请求数据，服务器接收并处理请求，然后客户端以可读格式获取数据。在大多数情况下，我们确实需要客户端服务器模型，但通过
    JavaScript 我们可以完全避免。JavaScript 通过在无需从服务器输入的情况下验证表单来减少流量。


    JavaScript 引擎是将源代码翻译成计算机理解的语言的程序。如今所有的浏览器都带有 JavaScript 引擎，每个引擎都有两个组件：`MemoryHeap`（内存堆）和
    `Call Stack`（调用栈）。`Memory Heap` 是任何时刻分配内存的地方。`Call Stack` 处理来自脚本添加的信息。


    ## JavaScript 框架


    JavaScript 框架允许语言以最少的设置发挥最佳性能。它们为开发者提供了创建 JavaScript 应用所需的构建组件。这些构建组件是一组代码库。库生成的代码为正在开发的各类应用触发专门的功能。框架建立了整个应用程序的结构。目前有很多
    JavaScript 框架，但最流行的有：


    | 框架 |  |

    | :--- | :--- |

    | Node.js | Node.js 是一个跨平台、开源的后端 JavaScript 运行时环境，利用 V8 引擎在 Web 浏览器之外执行 JavaScript
    代码。 |

    | Vue.js | Vue.js 是一个用于创建界面和单页应用程序的开源 JavaScript 框架。它使用了模型-视图-视图模型（MVVM）架构模式。
    |

    | AngularJS | AngularJS 是一个基于 JavaScript 的构建单页应用程序的开源前端框架。 |

    | Ember.js | Ember.js 是一个用于构建 Web 应用的开源 JavaScript 客户端框架。它通过提供包含数据管理和应用程序流的全面解决方案来实现客户端应用程序的。
    |

    | React | React 是一个用于使用 UI 组件创建界面的 JavaScript 工具包。 |


    ## JQuery 的特性


    ### HTML 操作

    HTML 文档中的元素可以被操作，因为 JQuery 允许用户访问 DOM。


    ### DOM 操作

    JQuery 提供了对 DOM API 的访问，以便你对 HTML 文档进行任何更改。你可以根据意愿添加、删除和重新排列元素。通过这种方式，你的网页无需刷新多次即可显示更新的信息。


    ### CSS 操作

    JQuery 库包含用于控制和更改 CSS 和 DOM 元素的代码。


    ### 效果与动画

    JQuery 有一个 `animate` 函数，可以更容易在网页上添加不同的效果和动画。它还可以通过操作 CSS 来动画化 HTML 元素。这些效果包括：`show`、`hide`、`fade
    in`、`fade out` 和 `slide`。


    ### Ajax

    Ajax 代表异步 JavaScript 和 XML。它允许你在不刷新网站的情况下，将来自服务器或数据库的内容放置到你的网站上。如果你访问的是一个不断接收数据的网站，每次都刷新页面将非常不方便。


    ### 工具函数


