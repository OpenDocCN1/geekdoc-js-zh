    Functions are used to wrap a specific piece of your code so you can reuse it without
    having to type it out more than once. Sometimes a developer needs the same action
    to take place on different parts or pages of the same website. Functions can be
    broken down into three parts:


    Function Statement


    The function statement reveals a function. The function gets saved and only works
    when it is called for.


    Function Expression


    A function expression does not give the name of the function. The name can be
    left out of the line of code and create an anonymous function.


    Function Declaration


    Names a function with its special parameters


    ## Three Ways to Write Your First Line of Code


    The first way you can practice writing some code is to write it directly into
    the Browser. It’s really easy because you don’t need to set anything up and you
    can start off by trying out some simple comments.


    ● First, open your web browser and find the search box.


    ● Type in about:blank and click enter–Your browser tab should be empty.


    ● Click on the menu and choose tools or more tools depending on your browser.


    ● Choose Developer tools–A developer tag should appear.


    ● Click on Console.


    ● Type your first line of code!


    Once you have gotten used to writing and using some basic HTML tags and content,
    you are going to need to be able to save your code and you might want to use lots
    of commands at the same time. For that you have to write your code in a simple
    text file and then send it to the browser so you can view it. Browsers accept
    files with the extension .html. You can create HTML files with Notepad in windows
    and with Textedit on Mac. Once you have written your code into the file, you need
    to change the format to HTML.


    On Windows:


    ● Open Notepad


    ● Define the document type by typing in <!DOCTYPE html>


    ● Type in some tags and content e.g.:


    <h1>I AM SMART</h1>


    <p> I can code! </p>


    ● Click on file in the top left corner


    ● Click on Save as


    ● Look for: Save as type


    ● Click on the drop down menu and choose the .html file extension.


    ● Save your document


    On Mac:


    ● Open Textedit


    ● Go to the very top of the page and click on preferences


    ● Choose the plain text option


    ● Define the document type


    ● Type in some tags and content


    ● Click save and type .html at the end of your document name


    ● Save your document


    You have to be very careful, because you will be writing code all by yourself.


    Another way you can write your code is with Special Code Editors. Special Code
    Editors know lots of programming languages and they have special features to help
    you write your code. They highlight different keywords and let you know when there
    is a syntax error. An editor that is available for free online is Visual Studio
    Code.


    Now that you have a basic knowledge of HTML and JavaScript, challenge yourself
    and do even more research. By the end of your coding journey you should be able
    to create beautiful websites, build games and construct really cool mobile apps.


    # Conclusion


    When you’re learning something new it’s not advisable to jump in at the deep end.
    What you have here is a ten thousand foot view of JavaScript.Having a theoretical
    knowledge of it will always be beneficial to you and it’s something nobody can
    take away from you. Both theoretical and practical knowledge are important when
    learning how to code, but having purely practical knowledge can be limiting. You
    need to have an understanding of the concepts behind the code you’ve set out to
    learn. Problem solving while coding will come easily to you, because you will
    have an in-depth knowledge of how everything works from the bottom up.


    The software development field is constantly growing and changing, so knowing
    the fundamentals of JavaScript means that you will always be able to keep up with
    any updates.


    Whenever we say JavaScript is everywhere, we’re not just saying that, it is literally
    everywhere! It’s not just something we use on web browsers. It can also be used
    to program electronic toys, wifi connected coffee machines and mobile apps.


    According to the 2021 StackOverflow developer survey, JavaScript is used by 94.5%
    of all websites.


    As far as career opportunities go, the possibilities are endless. The tech industry
    is always hiring and is one of the only career fields that is employee centric.
    They understand that employee satisfaction leads to productivity. You are constantly
    learning and also very likely to move up the ladder fairly quickly because there’s
    always room to grow.


    You can become a front-end, back-end or full stack developer.


    A front-end developer uses HTML, CSS and JavaScript to build websites from scratch.
    It’s an exciting job because every website is different, so the chances of doing
    the same thing everyday are slim. Front end developers need to ensure they are
    up to date with all the changes happening in the field, so if there is a downside
    it’s that they need to constantly do research.'
