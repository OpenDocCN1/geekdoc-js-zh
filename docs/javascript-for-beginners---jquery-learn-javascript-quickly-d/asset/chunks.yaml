    Pinpoint the main components of `JavaScript` and study them more intensively.
    Do not feel the need to study everything equally. The Pareto principle states
    that in certain situations, 80% of the effects result from 20% of the causes.
    So, if you focus on 20% of the content in this book that will bring about 80%
    of the results you desire, you will be able to learn in record time. Key areas
    to focus on are `Functions`, `Variables`, `Conditional statements`, `Objects`
    and `Arrays`.


    ### 2. Be diligent.


    Watching tutorials and reading is extremely helpful when learning something new.
    But, it would serve you better to devote more of your time to practicing. When
    you learn to ride a bike, you have to actively move your limbs in order to move
    forward. The same thing applies when learning `JavaScript`, you learn faster by
    writing code on your machine. In addition to this, dedicating your time is essential.
    Setting aside an hour to practice and write code at least five times a week will
    greatly improve your knowledge.


    Challenge yourself, and build an actual project with `JavaScript`, no matter how
    small. Doing this will just cement everything you’ve learned. You will also be
    able to identify what you might be struggling with and apply extra effort in those
    areas.


    ### 3. Learn how to troubleshoot errors.


    When learning `JavaScript` you will come across bugs. Harnessing the skill to
    solve those problems will always be useful. It will make you sharp as a programmer
    and allow you to finish projects faster.


    ## What Is JQuery ?


    Many years ago, when programmers wanted to change the look and feel of the attributes
    on their web pages, they had to include lots of font tags and color attributes.
    This made their HTML pages become overloaded with code and it was very hard to
    maintain. This meant that all web pages had to be maintained and modified manually.
    After the invention of CSS they were able to change the appearance of websites
    without having to write endless lines of code for each page. When `JavaScript`
    came along, programmers began writing the `JavaScript` code into their HTML documents
    because they weren’t well versed on it at the time. Eventually, they applied the
    CSS theory to `JavaScript` and `JavaScript` libraries were born. Among all the
    libraries in existence at the time, `JQuery` stood out and we still use it today.


    When you google `JQuery`, all that comes up is that it is a `JavaScript` library,
    but there is more to it than that. It simplifies the scripting of HTML on the
    client-side. Its main objective is to make using `JavaScript` easier for you.
    It can also be used to make adding animation easier. It basically takes a whole
    lot of common tasks that need several lines of `JavaScript` to run and attaches
    them to form a single line of code.


    What do client-side mean and server-side mean?


    Client-side and server-side are also referred to as front end and back end even
    though they aren’t entirely the same thing. Client side is where the application
    code runs and server-side is where the source code is stored.


    Some of the most well known features of `JQuery` are:


    - HTML manipulation

    - DOM manipulation

    - CSS manipulation

    - Effects and Animation

    - Ajax

    - Utilities


    `JQuery` became popular because there was a demand in the market for a tool to
    simplify the coding experience. `JQuery` is faster than its counterparts and is
    constantly being extended. It aids in writing User Interface function codes in
    as few lines as possible. It is compatible with all browsers and is up to date
    with their latest features.


    # Chapter 1: JavaScript for Beginners


    Before you can begin learning how to code, there are some Prerequisites. You have
    to at least have a basic knowledge of `HTML` and `CSS`.


    `HTML` stands for Hypertext Markup language. It is not considered a programming
    language. Like its name suggests, it is a Markup language that is used when structuring
    a web page. At its core, it is a very simple language that incorporates the elements
    applied to text to give it a distinct meaning. You can use these elements to wrap,
    markup or enclose components on your page and make them look or act a particular
    way. It can determine whether the text in your document comes in the form of a
    paragraph, has bullet points or comes in the form of a table. It can also embed
    pictures and videos onto your page.


    When you go on to any website, a number of files are dhed out to you. At a rudimentary
    level your website will present you with an `HTML` page and a `script.js` page.
    The `HTML` page is the bare bones of the web page. It tells the browser what to
    show and where everything goes. So if there needs to be a title at the top, a
    paragraph in the middle and a picture at the bottom, the `HTML` file is responsible
    for relaying that information to the browser. This is all well and good but it’s
    very limiting because the page will always be static and the data cannot change.
    That’s where `JavaScript` comes in. `JavaScript` is able to manipulate the appearance
    of the website by accessing the `DOM`. `DOM` stands for Document Object Model.
    It tells `JavaScript` what is on the page and then allows it to make changes to
    elements of the page. `DOM` makes it easier to read, access and obtain the content
    of an `HTML` document. If we break it down even further, the `Document` is the
    `HTML` file, the `object` is the tags and elements within the `HTML` file and
    the `Model` is the Layout or structure. Without `DOM`, `JavaScript` would not
    have a perception of any of the elements on a web page and would therefore not
    be able to change or manipulate them. The `DOM` information is available through
    an `API`. `API` stands for Application Programming Interface. It basically gives
    `JavaScript` an opening to control things on the `HTML` page. The `API` acts as
    the go between `JavaScript` and `HTML`.


    `HTML` syntax is simply the way `HTML` is written. `HTML` elements are structured
    a certain way; they are made up of the opening tag, the content and the closing
    tag. The opening tag is where the element commences. Visually, it is the name
    of the element wrapped in opening and closing angle brackets. For example, when
    your element is a paragraph, the opening tag would look like this: `<p>`. The
    content of the element goes in the middle, in this case it would be the text in
    the paragraph. The closing tag marks where the element ends. It is similar to
    the opening tag, but it has a forward slash after the first bracket. In this case
    it would look like this: `</p>`. If you forget to insert the forward slash or
    fail to include the closing tag altogether, you may not achieve the desired results.


    Elements are split into two categories, namely: Block level and inline elements.
    Block-level elements create blocks that you can actually see on a page, they take
    up the full width of a web page by creating a line break. Inline elements take
    up only as much as they need and are able to add content to a page without any
    line breaks.


    `CSS` or Cascading Style Sheets is a styling language used for describing the
    appearance of a document written in `HTML`. It is used in the formatting and layout
    of web pages. It is basically responsible for making your web page look really
    good. `CSS` syntax is pretty straightforward. The first part of the syntax is
    the `selector`, it is followed by opening and closing curly brackets. The brackets
    are used to show the start and the end of the style that is going to be applied
    to the `selector`. It can look something like this: `selector { property1: value;}`.
    `Property` refers to color, size or length, while value refers to the text or
    image the property is being applied to.


    ## Syntax


    In order to execute `JavaScript`, we have to put statements inside of `script`
    HTML tags on a web page. For example:

    ```

    <script> JavaScript code </script> own```

    The `script` tags are made up of two properties:


    - **Language**: Defines the scripting language you are working with. The value
    will always be `JavaScript`.

    - **Type**: Stipulates the scripting language being used and should always be
    set to ‘text/javascript’.

