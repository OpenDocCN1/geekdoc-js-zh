  raw: 'Utilities are software programs that optimize a computer’s performance. Some
    utility programs are good for keeping your computer virus free and others just
    make your desktop look good.


    JQuery can be considered legacy code because it was introduced in 2006\. It has
    stood the test of time and can be used in most applications that exist today.
    JQuery is used on most, if not all wordpress sites. There are a whopping 455 million
    of them as of 2022\. It teaches you a lot about JavaScript and is the easiest
    coding library to use.


    # Chapter 5: JavaScript for Kids


    It may be hard to believe, but there was a time when there was no internet! And
    before that, no computers either! It’s probably really hard to imagine a world
    without the two, but people used to exist and get by with fewer electronics.


    Before the invention of cellphones, people used to communicate via telephone or
    by writing letters and sending them through the post. Before online shopping,
    people had to physically go to the shops and kids had to have their friends in
    the room in order to play TV or computer games together.


    With time, all those things changed. Things became faster and easier to do, and
    we have computers to thank for that. A computer is a gadget that takes different
    kinds of information and processes it, then gives us an answer. It works the same
    way as a calculator. You tell the calculator the sum you want it to work out and
    it gives you an answer.


    Computers work with Operating systems. An operating system is a form of software
    that basically runs the computer. It controls the hardware by taking information
    in and giving information out. It is also responsible for the connection between
    us, the users, and the computer.


    These days, most people use computers to get on to the internet. The internet
    is a network that connects millions of computers around the world. There are so
    many websites that we can’t even count. The thing that makes these websites look
    cool and do amazing things is JavaScript.


    JavaScript is a language that we use to tell the computer what to do and how to
    do it. When you type something on your keyboard or scroll around a page with your
    mouse, the web page you are using responds to that. That’s because of JavaScript.


    As amazing as JavaScript is, you can’t use it on its own to build your website.
    Websites are built using three languages. HTML, CSS and JavaScript.


    HTML lets you put content on your webpage. So all the things you can see, like
    text and pictures.


    CSS takes the content on your page and changes how it looks. So with CSS you can
    make your text and pictures big or small. You can change colors that appear on
    your page too !


    And lastly, JavaScript tells the content on your page how to behave. That means
    that it can make your text or pictures move around, and it can even add animation.


    ## HTML and CSS


    HTML is really easy to learn. It’s where some of the most successful programmers
    and software developers started, and who knows? You could be the next Mark Zuckerberg!


    HTML stands for Hypertext Markup Language. Hypertext describes the words or pictures
    on your web page that are hyperlinks. A hyperlink is something you can click on
    that takes you either to a different page or to a different part of the page you
    are already on. Markup Language is a collection of letters called tags that tell
    our web page how it should look.


    HTML can be written in the notepad app on your computer.


    In order to create a tag, we put them inside brackets that look like this <>.
    Some of the most common tags are <h> for heading, <p> for paragraph and <img>
    for images.


    Tags can’t be alone, they always need something in between them. The thing we
    put inside the tag is called content. The content is what actually shows up on
    your web page. We can think of the tags like ‘the boss’ because the content will
    always do what the tag says. Here’s how:


    At the top of your web page, you’re going to want to have a heading. Your main
    heading is going to be called <h1> so that the computer knows that it goes at
    the very top of your web page. Your heading can be whatever you want it to be,
    but for today it’s going to be ‘I am smart’. Once you put it inside the tags it’s
    going to look like this: <h1>I am smart</h1>. The two tags show where your heading
    should start and stop.


    CSS stands for Cascading Style Sheets. Cascading means things that happen in a
    sequence, or one after the other. If we think of it like a waterfall, styles can
    fall from one sheet to another. This makes it possible for lots of different styles
    to appear on the same HTML sheet and then on a webpage. Style sheets are files
    that have font and styling settings.


    ### Important JavaScript Terms


    We can write JavaScript from scratch, but we don’t have to. There are coding libraries
    that exist to make it easier to write script. A coding library is a collection
    of code that has already been written. Most coding libraries are open source,
    which means they are free to download and use. An example of a coding library
    is JQuery.


    In JQuery’s collection of code you will find:


    Variables–We can liken a variable to a case filled with something. Variables hold
    one word or number at a time and can be sorted into one of three parts; type,
    name and value.


    Keywords–Keywords are words with special meanings that have been set aside by
    programmers.


    Functions–Are words within the script that we can use to get a task done


    Parameters–Sometimes functions need to have a bit of extra information in them
    so they can perform properly. That extra information is called a parameter. Sometimes
    they are called arguments too.


    Arrays–Arrays are like a bigger box for variables. They take variables that are
    alike and group them together.


    ### Data Types in JavaScript


    A language is something people use to communicate. All Languages have words that
    are unique to them. The same goes for programming languages. They each compose
    their data a certain way. JavaScript has Primitive values and Objects.


    Primitive Values are forms of data that cannot change. In JavaScript there are
    seven:


    ● Number type


    The number type is used to represent all numbers. It includes integers and floating
    point values. Floating point values are numbers that have fractions.


    ● BigInt type


    BigInt is short for Big Integer. An integer is a whole number without fractions.
    5 is an integer but 5.5 is not. This data type was created for JavaScript in early
    2020 because there was a problem with the number data type. It didn’t have a number
    big enough for programmers to use, so in some situations they had problems when
    coding.


    ● Null type


    Null is the value we use to show that there is no object. In real life, Imagine
    if you really wanted a glass of milk. You walk over to the fridge, grab a carton
    of milk and start to pour into your glass, but nothing comes out. Your carton
    of milk has a null value because it’s empty.


    ● Undefined type


    We can compare Undefined to something that is unclear. A variable that can’t be
    identified by its characteristics becomes undefined in JavaScript. A lot of people
    are unsure what the difference between Null and Undefined is.


    ● Symbol type


    A symbol is the newest primitive data type, it got added to JavaScript recently.
    Symbols have a unique value and cannot be recreated. We use them when we want
    to assign a specific value to an object so that it doesn’t clash with another
    object.


    ● String type


    A string is a chain of symbols. It could include anything from letters to numbers.


    ● Boolean type


    A Boolean is a value that can represent a true or a false statement. We usually
    use it with conditional statements when coding.


    Objects are values that have their own characteristics and can be organized by
    type. We assign characteristics to an object by using variables.


    ### Variables'
