    JavaScript 中的函数式编程


    在这种语境下，函数式编程是指创建仅关注结果而非过程的纯函数。纯函数是不可变的，这意味着你不能改变它们的状态。它们在执行计算时使用条件表达式和递归。它们不依赖参数之外的任何内容，因此它们是可预测的。如果你提供相同的参数，结果将始终是相同的。递归是程序员当一行代码可以被拆分为几个相似但更简单的任务时使用的模式。


    ### 函数的类型

    一等函数被视为独立的实体。它们是独立的。我们可以像处理数据一样使用它们。函数式编程将参数、返回值和变量作为函数，以创建更复杂的代码。一等函数具有较强的活性，因此某些面向对象的对象的语言也包含了它们。


    ### 高阶函数

    高阶函数作用于其他函数，并将它们作为参数传入。它们还会返回其他函数作为输出。


    函数式编程不支持循环语句或像 `if` 这样的条件语句。


    ### 什么是条件语句？

    条件语句查看 JavaScript 代码中的条件，并据此做出决定。正如名称所示，一个语句可以是真，也可以为假。只有当条件为真时，代码才会被执行。条件语句有四种：


    - `if` 语句：如果条件为真，执行部分代码。

    - `else` 语句：如果条件为假，执行与 `else` 相关的代码。

    - `else if` 语句：如果第一个 `if` 条件为假，则指定并测试一个新的条件。

    - `switch-case` 语句：根据特定条件指定多个待执行的替换块。


    # 面向对象编程

    JavaScript 本身不是基于面向对象的语言，但在编程时我们仍然可以使用它。虽然函数式编程以函数和逻辑为中心，但 OOP（或面向对象编程）不是。它是一种更关注对象的模型。它是将你的数据组织成类，然后根据这些类组织成对象的过程。在这种情况下，对象是一个具有自身特征和属性的数据字段。OOP
    适用于需要不断更新和维护的大型程序。但这会降低它们的运行速度并导致消耗大量内存。


    在开始任何之前，你想要先理解数据建模。数据建模是你取所有想要处理的对象并对其进行比较。如果你的对象是汽车，你将根据品牌、颜色和大小对它们进行比较。


    构成面向对象程序的要素有：

    - 类 (Classes)：用于创建对象的模型。

    - 对象 (Objects)：拥有特征并可以按类型组织的单元。

    - 方法 (Methods)：让 JavaScript 能够操作或更改其内部的数据。

    - 属性 (Attributes)：我们放在 `html` 元素开始和结束标签中的词，用于控制标签的作用。


    ### 对象

    对象由特征组成。如果一个特征具有函数，它被认为是一个`method`。如果它没有函数，它只是一个属性。属性可以是任何原始数据类型，但它们通常是位于对象中的变量。


    OOP 的原理是：

    - 封装 (Encapsulation)：用于在对象内部持有重要信息并防止额外信息暴露的方法。它为其他对象提供了受控的访问并有助于防止任何数据损坏。

    - 抽象 (Abstraction)：仅在对象之间共享相关的属性并隐藏任何不必要的代码

    - 继承 (Inheritance)：类从另一个类获取属性（如字段）的操作。

    - 多态 (Polymorphism)：以不同形式表示同一事的过程。在 JavaScript 中，这意味着不同的对象可以共享相同的属性。


    OOP 更容易管理，并且类似于现实世界，因此更容易理解。


    # 过程化编程

    过程化编程有一种直接组织代码的方法。它的目标是将程序分解为过程。在这种情况下，过程是按顺序执行的函数。它告诉计算机顺序执行函数，直到达到预期结果。


    ### 过程化编程的基本特征

    - 预定义函数 (Predefined Functions)：预定义函数是由名称标识的命令。它们包含在复杂的编程语言中，但它们存储在 JavaScript
    库中而不是程序本身中。

    - 局部变量 (Local Variable)：局部`Variable`在方法的结构结构声明，不能存在特定字段之外。局部变量只能在编写它们的方法。如果程序员尝试在方法之外编写它们，代码将失败。

    - 全局变量 (Global Variable)：全局变量写在方法之外，可以在所有函数中使用。

    - 模块化 (Modularity)：模块化是指两个不同的系统被赋予不同的任务，但组合在一起首先执行单一任务。每个组将按顺序执行其任务直到完成。

    - 参数传递 (Parameter Passing)：参数传递是用于向函数、子程序或过程传递指南的操作。它们可以通过值、引用、结果和名称传递执行。


    ### JavaScript 编程的应用

    JavaScript 几乎出现在软件开发的每一个方面。某些方面包括：

    - HTML 操作：JavaScript 允许你添加、删除和更改任何 `HTML` 元素的外观，以适应任何设备设备。

    - 用户通知：在将用户输入发送到服务器之前双检查用户输入至关重要，因此 JavaScript 在前端验证这些输入。

    - 后端数据加载：`Ajax` 库允许在进行其他处理时加载后端数据。这确保了客户端不会中断。

    - 演示文：JavaScript 让你构建演示文以增强网站的外观。

    - 服务器应用程序：服务器应用程序与客户端应用程序几乎相同，因为它们都交付和接收数据。它们之间的唯一区别是连接到服务器的方式不同。

    - 客户端验证：有助于整体用户体验。这是一个运行的初始检查，用于识别客户端上的任何无效数据，以便用户可以进行修复。


    我们应该扩展的一个经常出现的术语是“客户端（client）”。


    客户端（Client-Side）和服务端（Server-Side）是用于定义应用程序代码执行位置的表达式。在“无服务器”框架中，供应商将资源分发到所有发生在服务器端的进程。云服务提供商仍然利用服务器为开发者运行代码，因此该名称可能具有误导性。


    客户端服务器模型（Client-Server Model）是位于网络上的框架。它将计算机分为两个部分。第一部分请求服务（客户端），第二部分为客户端提供服务（服务器）。服务器位于高性能计算机内部但它本身并不是计算机。服务器是辅助客户端功能的程序。客户端-服务器模型是请求和响应的持续循环。它被使用是因为它的容量更大，因此比用户设备更可靠。


    现在你已经了解编程实际上包含什么，你已经准备好学习应用程序的骨架以及构建它的要素了。


    # 第 3 章：JavaScript 架构

    理解 JavaScript 架构对于你学习编程非常有帮助。如果你对 JavaScript 在网络上如何工作有良好的理解，你就处于优势。


    有三种 JavaScript 架构。典型的、基于框架的和高级的。


    ## 典型的 JavaScript 架构


    '
- fmt: '

    Ordinarily, JavaScript applications use the bottom-up approach. The User Interface
    is put at the center of development at all times. The User Interface and the server
    link directly to the code from behind.


    This JavaScript architecture is mostly used for simple programs like websites
    that don’t require intricate frameworks. It simply can’t keep up with more complex
    programs. It does allow you to interact with the screen, but it just does not
    have the capacity for a large scale application.


    SPAs or Single page applications make use of typical JavaScript Architecture.
    They can be updated easily and they are still in demand today. SPAs can only be
    used in a web browser, so they rely a lot on JavaScript. SPAs tend to be faster
    than mobile apps because the script that was used to build them only needs to
    be loaded once. From that point on its only job is to send data between the user
    and the server.


    ## Framework-Based Architecture

    As time progressed, The capabilities of Typical application architecture were
    not able to keep up with the needs of programmers around the world. Thus Framework
    based Architecture was born. It is able to solve more complex problems because
    it makes use of either the `MVC` or the `MVVM` patterns.


    `MVC` stands for `Model View Controller`. It splits larger applications into different
    sections that all have distinct functions. Each section is equipped to handle
    different aspects of an application. The model represents everything data related.
    It gets its commands from the controller and then carries out the user’s input.
    The view controls everything User Interface related. It gets the input from the
    user and then presents the data from the model to the user. The controller is
    the connection between the two. It processes and manipulates data from either
    side and then produces an output.


    There are different adaptations of `MVC`:


    - `HMVC`–Which stands for `Hierarchical Model view controller`. It is essentially
    the same thing as `MVC`, but with layers and more capabilities It takes `MVC`
    and repeats it in different parts of the application. Having it in layers does
    wonders for app development. You can easily reuse the code and not have to worry
    about constant maintenance.

    - `MVA`–Which stands for `Model View Adapter`. Usually data travels from the controller
    to the model, but with `MVA` the controller is the go-between and the `Model`
    and `View` must pass it. `View` and `Model` do not actually intersect. Here, the
    `Controller` acts as an adapter.

    - `MVP`–Which stands for `Model View Presenter`. This one is slightly different
    from `MVC`. The presenter is in charge of all the data in the application. It
    sends that data to the model to process, receives it back and then passes it onto
    the `View`.

    - `MVVM`–Stands for `Model-View ViewModel` and is like an amalgamation of `MVC`
    and `MVP` because it borrows from their patterns. Data and information are completely
    separate from the User Interface. The controller is replaced by the `Viewmodel`
    which connects the `Model` and the `View`. The `Viewmodel` updates the `Model`
    every time it receives input and then adapts that data before sending it off to
    the `View`.


    The framework has a feature rich Runtime environment that renders and puts out
    the Application. We can liken the Runtime environment to a vessel. It consists
    of all the things we need to run JavaScript code. Namely:

    - The `Engine`

    - `Web API’s`

    - `Event loops`

    - `Call back queue`

    - `Micro task queue`


    ## JavaScript Engines

    Engines take the intricate code written in JavaScript and convert it into a code
    that the machine can understand. Each browser has its own engine. A few notable
    engines are `V8`, `SpiderMonkey` and `JavaScript Core`.


    ### V8

    No two engines are the same, they all run differently but ultimately do the same
    thing. In the `V8` engine, everything starts in the `Parser`. The `Parser` checks
    for syntax and semantics. Syntax is the structure that the code comes in and Semantics
    refers to what certain words and symbols in the code mean. The `parser` then analyzes
    and breaks the code down to make it into Abstract Syntax Tree(AST)`. `AST` is
    the representation of the source code in tree form. The `AST` then goes into the
    `Interpreter`. The `Interpreter` converts the `AST` into `Byte Code`. This is
    known as `ignition`. Sometimes code gets repeated up to one thousand times. When
    this happens, the `Profiler` checks for the code repetition and tries to optimize
    it. Once it gets the optimized code, it moves it on to the `Compiler`. The compiler
    in the `V8` engine is called `TurboFan`. `Turbofan` releases the `Byte Code` in
    its most optimized form.


    ### SpiderMonkey

    `SpiderMonkey` was actually the first engine and it was created in 1995. The Mozilla
    foundation has kept it going and still makes use of it today. The engine converts
    the JavaScript code into `ByteCode` first and then sends it to the `Interpreter`
    and the `JIT Compiler`. `JIT` stands for `Just in Time`. The `JIT Compiler` optimizes
    the code and sends any unused code to the `Garbage collector`.


    ### Web API’s

    `API` stands for Application Programming Interface. It is an interface that gives
    the User a set of functions, while concealing the underlying mechanism of that
    function. `Web API’s` are not actually part of JavaScript. They are located in
    the browser, but they do give us access to the `JavaScript Engine`.


    `Web API’s` are comprised of:

    - A set timeout–Allows you to execute a block of code after a certain amount of
    time (defined by you) has passed

    - `DOM API’s` - Are made up of the interfaces that define how each of the elements
    in HTML function. That includes any supporting types and interfaces they may rely
    on.

    - `Fetch`–`API` Gives JavaScript access to manipulate requests and responses in
    the `Call Stack`

    - `Local storage`–Lets JavaScript apps save important value pairs indefinitely

    - `Console`–Registers any and all messages logged by JavaScript code

    - `Location`–Allows users of the browser to share their Geographical location
    at any given time


    ### Event Loops

    JavaScript is a single threaded code. This means that it can only run one command
    at a time. These commands are synchronous because they run one after the other.
    This doesn’t always work in programming so there are ways to make JavaScript asynchronous.
    Things like `Call stacks` help to avoid any blocking that might happen in a synchronous
    thread.


    A `Call stack` is a mechanism used by the interpreter to keep track of functions
    and their place in any given script. It allows functions to run concurrently.
    When the script calls a function, the interpreter puts it in the call stack and
    then conducts the function.


    A `Callback Queue` is like a safe house where an unexecuted line of script stays
    until it’s time for it to run.


    The `Event Loop`’s job is to check the `Call Stack` and `Callback Queue`. If the
    `Call Stack` is empty, `Event Loop` will take the statement in the `Callback Queue`
    and push it to the `Call Stack`. It appears to be a pretty straightforward process,
    but there is something called the `MicroTask Queue`. The `MicroTask queue` is
    pretty much a carbon copy of the `Callback Queue` but it has a higher priority,
    which means that any functions in it will be executed first.


    `MPAs` or Multi Page applications are better built with Framework based architecture.
    They are obviously larger than Single Page Applications and take more time to
    build. Because it’s data heavy, a lot of information has to go back and forth
    between the browser and the server. This makes it slower than an SPA.

