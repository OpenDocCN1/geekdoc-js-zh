    ### How to Get Started Writing JavaScript


    There are three methods of writing JavaScript. The first, is to write it directly
    into the Browser. This is the easiest way because you don’t need to set anything
    up and you can get started by trying out some simple comments. The downside is
    that if you refresh the page, the code will disappear and you will have to start
    from scratch. You can also only execute one command at a time.


    If you are developing, you are going to need to be able to save your code and
    execute multiple commands at any given time. For that you are going to want to
    write JavaScript in a simple text file and then send it to the browser to execute.
    Browsers accept files with the extension .html. You can create HTML files with
    Notepad in windows and with Textedit on Mac. Once you have written your code into
    the file, you need to change the format to HTML. You can achieve this by selecting
    the html extension when saving.


    Even though you can write multiple lines of code and include various comments
    and variables, there are some disadvantages to using a simple text editor. You
    have to be extremely meticulous because they don’t help you in writing code. Keywords
    are not highlighted, syntax errors cannot be detected and code completion is completely
    up to you.


    Another way you can write your code is with Special Code Editors. Special Code
    Editors support various programming languages and have specialized features to
    help you write your code. They highlight different keywords and alert you when
    there is a syntax error. An editor that is available for free online is Visual
    Studio Code.


    When you are coding, you can put your code anywhere on the file, but the most
    popular way to do it is either in the head or the body. We put script in the head
    section if we want it to run when a user clicks on something. It will look something
    like this:


    <html>


    <head>


    <script type = “text/javascript”>


    < ! - -


    function sayHello() {


    alert(“Hi there testing”)


    }


    //- - >


    </script>


    </head>


    <body>


    <input type = “button” onclick = “sayHello()” value = “Say Hello”


    </body>


    <html>  (JavaScript - Syntax, n.d.)


    That code would produce a button, and once you click on that button there would
    be a pop up that says Hi there testing.


    ### Datatypes in JavaScript


    Data Types are the values that are supported by a programming language. In JavaScript
    you will work with six; Numbers, BigInt, Strings, Null, Undefined and Booleans.


    #### Numbers


    Before we can understand the numbers value, we need to have an idea of what ECMAscript
    is. ECMA is a firm that sets standards for technology. ECMAScript is one of those
    standards. ECMAScript carries specifications for scripting languages, numbers
    and BigInt are built into it. JavaScript keeps to the ECMAScript specification.
    This means that when we are actually coding we make use of JavaScript and not
    ECMAScript. The number type is used to represent integer values and floating point
    values. Integers do not have decimal points, and floating numbers do.


    #### BigInt


    BigInt is an abbreviation for Big Integer. An integer is a whole number without
    decimals. This data type was created for JavaScript in early 2020 because the
    number data type was limited. When the script encountered numbers higher than
    2^53 - 1 they tended to lack accuracy thus affecting the efficacy of applications.


    #### Strings


    A string is a chain of one or more symbols. It could include anything from letters
    to numbers. Strings are primitive which means they cannot change.


    #### Null


    Null is the value shown when there is no object.


    #### Undefined


    A variable that can’t be identified by its characteristics becomes undefined in
    JavaScript. A lot of people are unsure what the difference between Null and Undefined
    is. Undefined is a variable that has no value, while null is an empty value assigned
    to a variable.


    #### Booleans


    Booleans only have two possible values. True or false. Boolean is usually used
    with conditional statements in JavaScript.


    Once you have a firm grasp on the Syntax and all the jargon, you’ll want to turn
    your attention to programming, because it’s the fun part, but it is also going
    to determine how your apps and websites turn out.


    # Chapter 2: JavaScript Programming


    The best way to get started with JavaScript programming, is having an understanding
    of programming paradigms. We should be able to differentiate between them. There
    are three paradigms; Functional programming, Object-oriented programming and Procedural
    programming. A paradigm is a set of concepts and standards that make up legitimate
    contributions to any given field. With regards to JavaScript, it’s really just
    how you write and arrange your code.


