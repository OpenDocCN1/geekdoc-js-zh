- fmt: '

    Even though Framework Architecture has more capabilities than typical architecture,
    it still has its limits when it comes to constructing larger applications. The
    only way it could grow to accommodate larger apps would be through constant maintenance
    and development. `MVC` and `MVVM` patterns are convenient and allow for developers
    to reuse code, but they present problems in the framework. The User Interface
    became compromised because the controller was corresponding with the server while
    manipulating the view. The need for a more feature rich architecture arose, then
    Advanced JavaScript Architecture came to be. In this architecture the User interface
    and server correspondence work completely separately, so it is easy to keep up
    with any demands that larger apps might have.


    Data computation and User Interface are completely separate in this instance.
    The User Interface is no longer at the center, so the app becomes easier to manage
    and use.


    ## Universal Applications


    Formally known as Isomorphic applications, they provide faster browser connection
    because there is less code. They work on both the client and server side, ensuring
    much easier engagement and less work for the programmer. The one downside is that
    they are quite hard to debug.


    # Chapter 4: JavaScript and JQuery


    Let’s go through some of JavaScript’s most important features to give you a better
    idea of how it works. The first feature is Variables. Variables are like storage
    containers for values. Data can be placed in these containers and then you can
    refer to it by naming the container. Every worthwhile programming task needs a
    variable. If values were unable to change, your webpage would be less interactive.
    You must declare your variable before you can use it in a JavaScript program.
    The keyword for variable (as seen in Chapter One) is `var`.


    ```html

    <script type="text/javascript">

    <! --

    var age;

    var race;

    // -- >

    </script>

    ```


    You can also declare different variables with the same keyword. It would look
    like this:


    ```html

    <script type="text/javascript">

    <! --

    var age, race;

    // -- >

    </script>

    ``` (JavaScript - Syntax, n.d.)


    Variable initialization happens when we store a value in a variable. You can add
    values at any point in time. We have created a variable called `race`, so we can
    add the value ‘black’ to it at a later point and we can add the value for `age`
    at the time of initialization. It would look like this:


    ```html

    <script type="text/javascript">

    <! --

    var age = "39"

    var race;

    race= black;

    // -- >

    </script>

    ``` (JavaScript - Syntax, n.d.)


    The `var` keyword only needs to be used once, at the time of initialization.


    A variable’s scope is the area of your program where it is defined. In JavaScript,
    there are only two:


    - **Global Variables**: Can be defined anywhere in your JavaScript code.

    - **Local Variables**: Is only visible within the scope of the function in which
    it is defined.


    Local variables take precedence over global variables with the same name within
    the body of a function. When a local variable or a function parameter has the
    same name as a global variable, the global variable is effectively hidden. For
    example:


    ```html

    <html>

    <body onload = checkscope();>

    <script type="text/javascript">

    <! --

    var myVar = "global"; // Global variable

    function checkscope() {

    var myVar = "local"; // Local variable

    document.write(myVar);

    }

    // —->

    </script>

    <body>

    </html>

    ``` (JavaScript - Syntax, n.d.)


    There are rules to naming your variables. The names of your variables are case
    sensitive, so `race` and `Race` are two different variables. Variable names cannot
    start with a number. They either have to start with a letter or an underscore.
