    在学习 `JavaScript` 时，你会遇到 Bug。掌握解决问题的技能将始终有用。它会让你成为一名敏锐的程序员，并让你能够更快地完成项目。


    ## 什么是 JQuery？


    许多年前，当程序员想要更改网页属性的外观和感受时，他们必须包含大量的字体标签和颜色属性。这导致他们的 HTML 页面充满了代码，非常难以维护。这意味着所有的网页都必须手动进行维护和修改。在
    CSS 发明后，他们能够改变网站的外观，而无需为每个页面编写无尽的代码。当 `JavaScript` 出现时，程序员开始将 `JavaScript` 代码写在他们的
    HTML 文档中，因为他们当时并不精通它。最终，他们将 CSS 理论应用于 `JavaScript`，`JavaScript` 库之诞生了。在当时存在的所有库中，`JQuery`
    脱颖而出，我们今天仍在使用它。


    当你谷歌搜索 `JQuery` 时，出现的只有它是一个 `JavaScript` 库，但它不止于此。它简化了客户端 HTML 的脚本编写。它的主要目标是让你使用
    `JavaScript` 变得更容易。它还可以用于让添加动画变得更容易。它基本上将许多需要几行 `JavaScript` 才能运行的常见任务合并在一起，形成单行代码。


    什么是客户端，什么是服务器端？


    客户端和服务器端也被称为前端和后端，尽管它们并不完全相同。客户端是应用程序代码运行的地方，服务器端是存储源代码的地方。


    `JQuery` 的一些最著名的特性包括：


    - HTML 操作

    - DOM 操作

    - CSS 操作

    - 效果和动画

    - Ajax

    - 工具函数


    `JQuery` 变得流行是因为市场对能够简化编码体验的工具的需求。`JQuery` 比它的同类产品更快，并且不断被扩展。它有助于以尽可能少的行数编写用户界面函数代码。它兼容所有浏览器，并与最新功能保持同步。


    # 第 1 章：初学者 JavaScript


    在开始学习如何编码之前，有一些先决条件。你至少必须具备 `HTML` 和 `CSS` 的基础知识。


    `HTML` 代表超文本标记语言。它不被视为编程语言。正如其名称所示，它是一种用于构建网页结构的标记语言。从核心上说，它是一种非常简单的语言，包含了应用于文本的元素以赋予其独特的含义。你可以使用这些元素来包裹、标记或封闭页面上的组件，并让它们看起来或表现具有特定的方式。它可以决定你文档中的文本是以段落形式、项目列表还是表格的形式出现。它还可以在页面上嵌入图片和视频。


    当你访问任何网站时，会有许多文件发送给你。在基础层面上，你的网站将向你展示一个 `HTML` 页面和一个 `script.js` 页面。`HTML` 页面是网页的骨架。它告诉浏览器显示什么以及每个东西放在哪里。所以，如果顶部需要一个标题，中间一个段落，底部需要一张图片，`HTML`
    文件负责将这些信息传递给浏览器。这很好，但它的限制很大，因为页面将始终是静态的，数据无法更改。这就是 `JavaScript` 发挥用场的地方。`JavaScript`
    能够通过访问 `DOM` 来操作网站的外观`DOM` 代表文档对象模型。它告诉 `JavaScript` 页面上有什么，然后允许它更改页面元素。`DOM`
    使读取、访问和获取 `HTML` 文档的内容变得更容易。如果我们进一步拆分，`Document`（文档）是 `HTML` 文件，`object`（对象）是
    `HTML` 文件中的标签和元素，而 `Model`（模型）是布局或结构。没有 `DOM`，`JavaScript` 将对网页上的任何元素都无法感知，因此无法更改或操纵它们。`DOM`
    信息通过 `API` 提供。`API` 代表应用程序编程接口。它基本上为 `JavaScript` 提供了一个控制 `HTML` 页面事务的入口。`API`充当了
    `JavaScript` 和 `HTML` 之间的桥梁。


    `HTML` 语法简单来说 `HTML` 的编写方式。`HTML` 元素以特定方式构造；它们由起始标签、内容和结束标签组成。起始标签是元素开始的地方。从视觉上看，它是包裹在起始和结束角括号中的元素名称。例如，当你的元素是一个段落时，起始标签看起来像这样：`<p>`。元素的内容放在中间，在这种情况下，就是段落中的文本。结束标签标记元素结束的地方。它与起始标签相似，但在第一个括号之后有一个斜杠。在这种情况下，它看起来像这样：`</p>`。如果你忘记插入斜杠或完全没有包含结束标签，可能无法达到预期的结果。


    元素分为两类，即：块级元素和内联元素。块级元素创建你可以在页面上实际看到的块，它们通过创建换行来占据网页的完整宽度。内联元素仅占据它们所需的空间，并且能够在产生任何换行的情况下向页面添加内容。


    `CSS` 或级联样式表是一种用于描述用 `HTML` 编写的文档外观的样式语言。它用于网页的格式和布局。它基本上负责让你的网页看起来非常漂亮。`CSS`
    语法非常直观。语法的第一部分是 `selector`（选择器），后面跟着起始和结束大括号。括号用于显示将应用于 `selector` 的样式的开始和结束。它看起来像这样：`selector
    { property1: value;}`。`Property`（属性）指颜色、大小或长度，而 `value`（值）指属性应用的文本或图像。


    ## 语法


    为了执行 `JavaScript`，我们必须将语句放在网页的 `script` HTML 标签内部。例如：

    ```

    <script> JavaScript code </script>```

    `script` 标签由两个属性组成：


    - **Language**（语言）：定义你正在使用的脚本语言。值将始终是 `JavaScript`。

    - **Type**（类型）：规定正在使用的脚本语言，并应始终设置为‘text/javascript’。


