- fmt: "\nThe word variable means something that doesn’t stay the same, something\
    \ that can change at any time. In `JavaScript`, Variables hold on to values that\
    \ can be changed at any time. Because of this, variables cannot have the same\
    \ name. Variables have declarations and definitions. A `Declaration` is the part\
    \ of the code where the variable is before any action takes place. The definition\
    \ is where the variable is placed once it has a value and a place in the code.\n\
    \n### Arrays\nIn `JavaScript`, an `Array` is one variable that we can use to keep\
    \ different elements. Keeping several items of the same kind together makes it\
    \ easier to work out where each element is by adding an offset to a base value.\
    \ A real life example would be if a teacher had all her students sitting at their\
    \ desks. The teacher would be able to pinpoint any student by knowing what number\
    \ desk they’re sitting at. It makes coding easier, because we can have access\
    \ to a whole list of elements just by typing in one word.\n\n### Objects\nObjects\
    \ are words in your script that have characteristics and can be organized by type.\
    \ Those characteristics are usually variables determined by the programmer.\n\n\
    ### Conditionals and Loops\nConditional statements work out what is happening\
    \ in your `JavaScript` code and then use boolean phrases to decide on the outcome.\
    \ So the outcome on a conditional statement will either be true or false. There\
    \ are four types of conditional statements:\n\n- The `if` statement: Runs a certain\
    \ part of the code if the condition is true.\n- The `else` statement: Runs the\
    \ part of the code related to `else` if the condition is false.\n- The `else if`\
    \ statement: Gives and tests a new condition if the first `if` condition is false.\n\
    - The `switch-case` statement: Gives a number of substitute code blocks to be\
    \ carried out based on specific conditions.\n\nLoop statements help to keep your\
    \ code short and sweet. Sometimes, you are going to have to perform the same action\
    \ a number of times on your web application. If loop statements didn’t exist,\
    \ a programmer would have to write the same line of code over and over again.\
    \ There are three types of Loop statements:\n\n- The `while` loop: The `while`\
    \ loop is straightforward. The `while` loop carries out a conditional statement\
    \ over and over again if the statement is true. As soon as the statement becomes\
    \ false, the loop stops running.\n- The `for` loop: The `for` loop is a bit more\
    \ complex. It only runs a specific number of times and it’s made up of three parts:\n\
    \    - The `Loop Initialization`: This gets your code ready to receive a starting\
    \ value. This happens before the loop starts.\n    - The `Test Statement`: Tests\
    \ if a condition is true. If it is true, then the loop will run. If it’s not true,\
    \ then the loop will not run.\n    - The `Iteration Statement`: Lets you increase\
    \ or decrease the number of times your loop runs.\n- The `for..in` loop: As we\
    \ read before, objects have properties. The `for..in` loop’s purpose is to loop\
    \ through an object’s characteristics.\n\n### Functions\nFunctions are used to\
    \ wrap a specific piece of your code so you can reuse it without having to type\
    \ it out more than once. Sometimes a developer needs the same action to take place\
    \ on different parts or pages of the same website. Functions can be broken down\
    \ into three parts:\n\n- `Function Statement`: The function statement reveals\
    \ a function. The function gets saved and only works when it is called for.\n\
    - `Function Expression`: A function expression does not give the name of the function.\
    \ The name can be left out of the line of code and create an anonymous function.\n\
    - `Function Declaration`: Names a function with its special parameters.\n\n##\
    \ Three Ways to Write Your First Line of Code\nThe first way you can practice\
    \ writing some code is to write it directly into the Browser. It’s really easy\
    \ because you don’t need to set anything up and you can start off by trying out\
    \ some simple comments.\n\n- First, open your web browser and find the search\
    \ box.\n- Type in `about:blank` and click enter–Your browser tab should be empty.\n\
    - Click on the menu and choose tools or more tools depending on your browser.\n\
    - Choose Developer tools–A developer tag should appear.\n- Click on `Console`.\n\
    - Type your first line of code!\n\nOnce you have gotten used to writing and using\
    \ some basic `HTML` tags and content, you are going to be able to save your code\
    \ and you might want to use lots of commands at the same time. For that you have\
    \ to write your code in a simple text file and then send it to the browser so\
    \ you can view it. Browsers accept files with the extension `.html`. You can create\
    \ `HTML` files with Notepad in windows and with Textedit on Mac. Once you have\
    \ written your code into the file, you need to change the format to `HTML`.\n\n\
    **On Windows:**\n- Open Notepad\n- Define the document type by typing in `<!DOCTYPE\
    \ html>`\n- Type in some tags and content e.g.:\n```html\n<h1>I AM SMART</h1>\n\
    <p> I can code! </p>\n```\n- Click on file in the top left corner\n- Click on\
    \ Save as\n- Look for: Save as type\n- Click on the drop down menu and choose\
    \ the `.html` file extension.\n- Save your document\n\n**On Mac:**\n- Open Textedit\n\
    - Go to the very top of the page and click on preferences\n- Choose the plain\
    \ text option\n- Define the document type\n- Type in some tags and content\n-\
    \ Click save and type `.html` at the end of your document name\n- Save your document\n\
    \nYou have to be very careful, because you will be writing code all by yourself.\n\
    \nAnother way you can write your code is with Special Code Editors. Special Code\
    \ Editors know lots of programming languages and they have special features to\
    \ help you write your code. They highlight different keywords and let you know\
    \ when there is a syntax error. An editor that is available for free online is\
    \ `Visual Studio Code`.\n\nNow that you have a basic knowledge of `HTML` and `JavaScript`,\
    \ challenge yourself and do even more. By the end of your coding journey you should\
    \ be able to create beautiful websites, build games and construct really cool\
    \ apps.\n\n# Conclusion\nWhen you’re learning something new it’s not advisable\
    \ to jump in the deep end. What you have here is a ten thousand foot view of `JavaScript`.\
    \ Having a theoretical knowledge of it will always be beneficial to you and it’s\
    \ something nobody can take away from you. Both theoretical and practical knowledge\
    \ are important when learning to code, but having purely practical knowledge can\
    \ be limiting. You need to have an understanding of the concepts behind the code\
    \ you’ve set out to learn. Problem solving while coding will come easily to you,\
    \ because you will have an in-depth knowledge of how everything works from the\
    \ bottom up.\n\nThe software development field is constantly growing and changing,\
    \ so knowing the fundamentals of `JavaScript` means that you will always be able\
    \ to keep up with any updates.\n\nWhenever we say `JavaScript` is everywhere,\
    \ we’re not just saying that, it is literally everywhere! It’s not just something\
    \ we use on web browsers. It can also be used to program electronic toys, wifi\
    \ connected coffee machines and mobile apps.\n\nAccording to the 2021 StackOverflow\
    \ developer survey, `JavaScript` is used by 94.5% of all websites.\n\nAs far as\
    \ career opportunities go, the possibilities are endless. The tech industry is\
    \ always hiring and is one of the only career fields that is employee centric.\
    \ They understand that employee satisfaction leads to productivity. You are constantly\
    \ learning and also very likely to move up the ladder fairly quickly because there’s\
    \ always room to grow.\n\nYou can become a front-end, back-end or full stack developer.\n\
    \nA front-end developer uses `HTML`, `CSS` and `JavaScript` to build websites\
    \ from scratch. It’s an exciting job because every website is different, so the\
    \ chances of doing the same thing everyday are slim. Front end developers need\
    \ to ensure they are up to date with all the changes happening in the field, so\
    \ if there is a downside it’s that they need to constantly do research.\n"
