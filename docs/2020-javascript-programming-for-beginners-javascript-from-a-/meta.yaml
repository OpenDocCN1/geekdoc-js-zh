    # CONTINUOUS STATEMENT


    If a continuous state in a loop is found on JavaScript, it finishes running the
    current iteration and moves back to the beginning of the loop and begins the next
    iteration. The example below shows only even numbers.


    ```

    1. for (var i = 1; i <= 10; i++)

    2. {

    3.     if ((i % 2) != 0) {

    4.         continue;

    5.     }

    6.     alert(i);          // => 2, 4, 6, 8, 10

    7. }

    ```


    In other loops, the continuous phrase is also found. However, in a for-loop it
    acts differently than in a time-loop. The for-loop first tests the i++ and then
    examines the I < = 50 condition in the example above. Now notice the time loop:'
