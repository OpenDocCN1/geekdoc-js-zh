    # LOOPS


    Loops are used in JavaScript to perform frequent tasks on the basis of a condition.
    Conditions typically return true or false when evaluated. The loop will continue
    to run until the stated condition returns false.


    # DIFFERENT KINDS OF LOOP

    JavaScript contains a range of loop types:


    +   1. For-Loops a number of times via a code block

    2. For / in-Loops through an object''s properties

    3. For / of -loops through the values of even an iterable object'
  - '[PAGE 23]


    +   4. While-loops through a code block while the stated condition is true

    5. Do / while-also loops through a code block while the stated condition is true


    # WHILE LOOP


    JavaScript loops have been used repeatedly to run a code block unless certain
    requirements have been met. When developers think about iteration or iteration,
    say, an array, it''s the same as looping. JavaScript provides several options
    for repeatedly running a code block, like while, do while, for and for-in.


    # Example


    ```

    1. var sum = 0;

    2. var number = 1;

    3. while (number <= 50) {  // -- condition

    4.   sum += number;        // -- body

    5.   number++;             // -- updater

    6. }

    7. alert("Sum = " + sum);  // => Sum = 1275

    ```


    The condition is assessed first. If valid, the block of statements that follow
    the while statement will be executed. This is repeated until the condition is
    incorrect. It is known as a pre-test loop since it tests the condition before
    the block is executed.


    The number++ statement will be called the updater. Removing it will result in
    an endless loop. You must always provide a statement in the loop to ensure that
    the loop is terminated or else you will run into this problem.


    # DO WHILE LOOP


    ```

    1. var sum = 0;

    2. var number = 1;

    3. do {

    4.   sum += number;        // -- body

    5.   number++;             // -- updater

    6. } while (number <= 50); // -- condition

    7. alert("Sum = " + sum);  // => Sum = 1275

    ```'
  - '[PAGE 24]


    The next do block is executed first, and then the state is evaluated. If the while
    condition is valid, the block will be executed again and repeated until the condition
    is false. This is known as a post-test loop as the condition is tested after the
    block has been executed.


    ```

    1. do {

    2.     // read a character from keyboard in the body

    3. } while (if ch === ''0'');    // => terminate loop if ''0'' is entered

    ```


    # FOR LOOP


    ```

    1. var sum = 0;

    2. for (var i = 1; i <= 50; i++) {

    3.     sum = sum + i;

    4. }

    5. alert("Sum = " + sum);    // => Sum = 1275

    ```


    This consists of three sections, separated by semi-colons. The first is the initializer
    (var I = 1) which initializes the loop and is executed only once at the start
    of the loop. The second is the state of the test I < = 50). When the conditional
    expression is evaluated to true, the loop body is executed. The loop stops when
    it''s right. The third element is an updater (i++) that is invoked after each
    iteration. Usually, the updater raises or reduces the loop counter.


    In a for-loop, all three phases, i.e. initializer, test condition, and updater,
    are written together in such a single line (called iteration statement), while
    in a while they are scattered and lying in different places.


    # FOR IN LOOP


    ```

    1. var student = { name:"Bill", age: 25, degree: "Masters" };

    2. for (var item in student) {

    3.     alert(student[item]);    // => "Bill", then 25, then "Masters"

    4. }

    ```


    With each iteration, JavaScript applies the name of the property (string value)
    to the variable object. In the example above, the following are: name, age and
    degree.'
- md: "## BREAK STATEMENT\n\nWhen JavaScript experiences a break statement in a loop,\
    \ it instantly exits the loop without running any other loop statements. The power\
    \ is passed immediately to the statement following the loop structure. Here is\
    \ an example of this:\n\n```\nvar sum = 0;\nfor (var i = 1; i <= 10000; i++) {\n\
    \    sum += i;\n    if (i === 50) {\n        break;    // immediately transfers\
    \ control outside the for block\n    }\n}\nalert(\"Sum = \" + sum);        //\
    \ => Sum = 1275\n```\n\nWhen an infinite loop is deliberately created, you can\
    \ use a break statement to control the end of the loop, as follows:\n\n```\nvar\
    \ number = 1;\nvar sum = 0;\nwhile (true)   // equivalent to for ( ; ; ), called\
    \ 'forever' loop\n{\n    sum += number;\n    if (number === 50) {\n        break;\
    \  // immediately transfers control outside while block\n    }\n    number++;\n\
    }\nalert(\"Sum = \" + sum);      // => Sum = 1275\n```\n\nThe number++; assertion\
    \ will not be executed when the loop is entered for the 50th time.\n\n## CONTINUOUS\
    \ STATEMENT\n\nIf a continuous state in a loop is found on JavaScript, it finishes\
    \ running the current iteration and moves back to the beginning of the loop and\
    \ begins the next iteration. The example below shows only even numbers.\n\n```\n\
    for (var i = 1; i <= 10; i++)\n{\n    if ((i % 2) != 0) {\n        continue;\n\
    \    }\n    alert(i);          // => 2, 4, 6, 8, 10\n}\n```\n\nIn other loops,\
    \ the continuous phrase is also found. However, in a for-loop it acts differently\
    \ than in a time-loop. The for-loop first tests the i++ and then examines the\
    \ i <= 50 condition in the example above. Now notice the time loop:\n\n```\nvar\
    \ number = 0;\nwhile (number <= 10) {\n    number++;\n    if ((number % 2) !=\
    \ 0) {\n        continue;\n    }\n    alert(number);    // => 2, 4, 6, 8, 10\n\
    }\n```\n\nThe power will be restored directly to the testing state when the continuous\
    \ statement is carried out (number <= 50), and the number++ is not evaluated to\
    \ create an infinite loop. The lesson here is that you can't simply replace a\
    \ for loop with a time loop; you have to be careful, particularly when a continuous\
    \ statement is involved.\n\n## ITERATORS\n\nIterator is a way to extract data\
    \ from a one-to-one-time data structure, it requires to introduce an iterator\
    \ interface.\n\nIt's an object or pattern that helps us to go through a list or\
    \ a set. Iterators define the sequences and enforce the iterator protocol that\
    \ returns the object using the next() method that holds the value and is done.\
    \ The value represents the next value of the sequence of the iterator, and the\
    \ completed value is the true or false boolean value, if the last value of the\
    \ sequence has been consumed, then the true value is false. We can check whether\
    \ an entity is iterable by default or not.\n\n## ITERATION PROTOCOL\n\nThere can\
    \ be two iteration protocols available: the Iterable protocol and the Iterator\
    \ protocol.\n\n## ITERATOR PROTOCOL\n\nAn object is an iterator when an interface\
    \ (or an API) is implemented that addresses two questions:\n1. Is there an aspect\
    \ left?\n2. If there is something, what is the element?\n\nAn object is qualified\
    \ as an iterator when it has a next() method which returns an object with two\
    \ properties:\n\n- Done: a boolean value implying whether or not there are any\
    \ other elements that could be iterated.\n- Value: this is the current dimension.\n\
    \nEvery time you call the next() returns the next value in the compilation:\n\n\
    ```\n{ value: 'next value', done: false }\n```\n\nWhen the final value returns,\
    \ the following returns the result object as following if you call the next()\
    \ method:\n\n```\n{done: true, value: undefined}\n```\n\nThe value of the finished\
    \ property means that there is no interest to return and that the value of the\
    \ property is set to undefined.\n\n## ITERABLE PROTOCOL\n\nAn object is iterable\
    \ if it includes a method called [Symbol.iterator] that does not use an argument\
    \ and recovers an object that conforms to the iterator protocol. The [Symbol.iterator]\
    \ is one of the excellently-known symbols of the ES6.\n\n## ITERATORS\n\nSince\
    \ ES6 provides built-in iterators for the Array, Set, and Map collection forms,\
    \ you don't need to create iterators for these objects.\n\nWhen you have a custom\
    \ form and want to make it iterable so that you can use a loop construct, you\
    \ need to enforce iteration protocols.\nThe following code generates a sequence\
    \ object that returns a list of numbers within the range (start, end) with an\
    \ interval between subsequent numbers.\n\n```\nclass Sequence {\n    constructor(\
    \ start = 0, end = Infinity, interval = 1 ) {\n        this.start = start;\n \
    \       this.end = end;\n        this.interval = interval;\n    }\n\n    [Symbol.iterator]()\
    \ {\n        let counter = 0;\n        let nextIndex = this.start;\n\n       \
    \ return  {\n            next: () => {\n                if ( nextIndex <= this.end\
    \ ) {\n                    let result = { value: nextIndex,  done: false }\n \
    \                   nextIndex += this.interval;\n                    counter++;\n\
    \                    return result;\n                }\n                return\
    \ { value: counter, done: true };\n            }\n        }\n    }\n};\n```\n\n\
    The following code uses the Series Iterator for ... the loop:\n\n## OUTPUT\n\n\
    ```\n2\n4\n6\n8\n10\n```\n\nYou can directly access [Symbol.iterator]() as shown\
    \ in the following script:\n\n```\nlet evenNumbers = new Sequence(2, 10, 2);\n\
    let iterator = evenNumbers[Symbol.iterator]();\n\nlet result = iterator.next();\n\
    \nwhile( !result.done ) {\n    console.log(result.value);\n    result = iterator.next();\n\
    }\n```\n\n## CLEANING UP\n\nIn additional to the next() method, the [Symbol.iterator]()\
    \ can optionally return the return() method.\nThe return() method is invoked automatically\
    \ when the iteration is stopped early. It's where you can set up a application\
    \ to clean up your tools.\n\nThe following example uses the return() method for\
    \ the Sequence object:\n\n```\nclass Sequence {\n    constructor( start = 0, end\
    \ = Infinity, interval = 1 ) {\n        this.start = start;\n        this.end\
    \ = end;\n        this.interval = interval;\n    }\n\n    [Symbol.iterator]()\
    \ {\n        let counter = 0;\n        let nextIndex = this.start;\n        return\
    \ {\n            next: () => {\n                if ( nextIndex <= this.end ) {\n\
    \                    let result = { value: nextIndex, done: false }\n        \
    \            nextIndex += this.interval;\n                    counter++;\n   \
    \                 return result;\n                }\n                return {\
    \ value: counter, done: true };\n            },\n            return: () => {\n\
    \                console.log('cleaning up...');\n                return { value:\
    \ undefined, done: true };\n            }\n        }\n    }\n}\n```\n\nThe following\
    \ snippet uses the pattern object to generate an odd number sequence from 1 to\
    \ 10. However, the iteration ends prematurely. As a consequence, the return()\
    \ method is invoked automatically.\n\n## OUTPUT\n\n```\n1\n3\n5\n7\ncleaning up...\n\
    ```\n\n## OBJECTS\n\nJavaScript is designed for a simple object-based paradigm.\
    \ An object is a set of properties, and a property is a combination of a name\
    \ (or key) and a value. The value of the property may be a function, in which\
    \ case the property is known as a process.\n\nObjects in JavaScript, like in many\
    \ other programming languages, can be compared to objects in real life. The definition\
    \ of artifacts in JavaScript can be understood with real life, with tangible objects.\n\
    \nThrough JavaScript, an object is a stand-alone entity with properties and class.\
    \ For example, compare it to a cup. A cup is an entity that has properties. A\
    \ cup has a color, a pattern, a weight, a material made of it, etc. In the same\
    \ way, JavaScript objects can have properties that describe their characteristics.\n\
    \n## CREATING OBJECT IN JAVASCRIPT\n\nThere are three ways to create objects.\n\
    \n1. By a literal object\n2. By generating the Object instance directly (using\
    \ the new keyword)\n3. Use an object constructor (using a new keyword)"
  mdcn: "## BREAK 语句\n\n当 JavaScript 在循环中遇到 break 语句时，它会立即退出循环，不再执行任何其他循环语句。控制权会立即传递给循环结构之后的语句。下面是一个示例：\n\
    \n```\nvar sum = 0;\nfor (var i = 1; i <= 10000; i++) {\n    sum += i;\n    if\
    \ (i === 50) {\n        break;    // 立即将控制权转移到 for 代码块之外\n    }\n}\nalert(\"Sum\
    \ = \" + sum);        // => Sum = 1275\n```\n\n当故意创建一个无限循环时，你可以使用 break 语句来控制循环的结束，如下所示：\n\
    \n```\nvar number = 1;\nvar sum = 0;\nwhile (true)   // 等同于 for ( ; ; )，称为“永久”循环\n\
    {\n    sum += number;\n    if (number === 50) {\n        break;  // 立即将控制权转移到\
    \ while 代码块之外\n    }\n    number++;\n}\nalert(\"Sum = \" + sum);      // => Sum\
    \ = 1275\n```\n\n当循环第 50 次进入时，`number++;` 断言将不会被执行。\n\n## CONTINUE 语句\n\n如果在 JavaScript\
    \ 的循环中发现一个 continue 语句，它会完成当前迭代的运行，然后返回到循环的开头，开始下一次迭代。下面的示例仅显示偶数。\n\n```\nfor\
    \ (var i = 1; i <= 10; i++)\n{\n    if ((i % 2) != 0) {\n        continue;\n \
    \   }\n    alert(i);          // => 2, 4, 6, 8, 10\n}\n```\n\n在其他循环中，也会发现 continue\
    \ 语句。然而，在 for 循环中，它的行为与在 while 循环中不同。在上面的示例中，for 循环首先测试 `i++`，然后检查 `i <= 50` 条件。现在注意\
    \ while 循环：\n\n```\nvar number = 0;\nwhile (number <= 10) {\n    number++;\n \
    \   if ((number % 2) != 0) {\n        continue;\n    }\n    alert(number);   \
    \ // => 2, 4, 6, 8, 10\n}\n```\n\n当执行 continue 语句时，控制权将直接恢复到测试条件（`number <= 50`），而\
    \ `number++` 不会被求值，从而避免了无限循环。这里的教训是，你不能简单地将 for 循环替换为 while 循环；你必须小心，特别是当涉及 continue\
    \ 语句时。\n\n## 迭代器\n\n迭代器是一种从一次性数据结构中提取数据的方式，它需要引入一个迭代器接口。\n\n它是一个帮助我们遍历列表或集合的对象或模式。迭代器定义了序列并强制执行迭代器协议，该协议返回一个使用\
    \ `next()` 方法的对象，该方法持有值和完成状态。值表示迭代器序列的下一个值，完成值是一个布尔值（true 或 false），如果序列的最后一个值已被消耗，则完成值为\
    \ false。我们可以检查一个实体是否默认可迭代。\n\n## 迭代协议\n\n可以有两种迭代协议可用：可迭代协议和迭代器协议。\n\n## 迭代器协议\n\
    \n当一个对象实现了一个接口（或 API）来解决以下两个问题时，它就是一个迭代器：\n1. 是否还有元素？\n2. 如果有，元素是什么？\n\n当一个对象具有\
    \ `next()` 方法时，它就被认为是一个合格的迭代器，该方法返回一个具有两个属性的对象：\n\n- Done：一个布尔值，表示是否还有其他元素可以迭代。\n\
    - Value：这是当前的值。\n\n每次调用 `next()` 都会返回序列中的下一个值：\n\n```\n{ value: 'next value',\
    \ done: false }\n```\n\n当返回最后一个值时，如果你调用 `next()` 方法，将返回以下结果对象：\n\n```\n{done:\
    \ true, value: undefined}\n```\n\n完成属性的值意味着没有更多值需要返回，并且该属性的值被设置为 undefined。\n\n\
    ## 可迭代协议\n\n如果一个对象包含一个名为 `[Symbol.iterator]` 的方法，该方法不使用参数并返回一个符合迭代器协议的对象，那么这个对象就是可迭代的。`[Symbol.iterator]`\
    \ 是 ES6 中众所周知的符号之一。\n\n## 迭代器\n\n由于 ES6 为 Array、Set 和 Map 集合形式提供了内置迭代器，因此你不需要为这些对象创建迭代器。\n\
    \n当你有一个自定义形式并希望使其可迭代以便可以使用循环构造时，你需要强制执行迭代协议。\n以下代码生成一个序列对象，该对象返回一个在范围（start, end）内的数字列表，相邻数字之间有间隔。\n\
    \n```\nclass Sequence {\n    constructor( start = 0, end = Infinity, interval\
    \ = 1 ) {\n        this.start = start;\n        this.end = end;\n        this.interval\
    \ = interval;\n    }\n\n    [Symbol.iterator]() {\n        let counter = 0;\n\
    \        let nextIndex = this.start;\n\n        return  {\n            next: ()\
    \ => {\n                if ( nextIndex <= this.end ) {\n                    let\
    \ result = { value: nextIndex,  done: false }\n                    nextIndex +=\
    \ this.interval;\n                    counter++;\n                    return result;\n\
    \                }\n                return { value: counter, done: true };\n \
    \           }\n        }\n    }\n};\n```\n\n以下代码使用序列迭代器进行...循环：\n\n## 输出\n\n```\n\
    2\n4\n6\n8\n10\n```\n\n你可以直接访问 `[Symbol.iterator]()`，如下所示：\n\n```\nlet evenNumbers\
    \ = new Sequence(2, 10, 2);\nlet iterator = evenNumbers[Symbol.iterator]();\n\n\
    let result = iterator.next();\n\nwhile( !result.done ) {\n    console.log(result.value);\n\
    \    result = iterator.next();\n}\n```\n\n## 清理\n\n除了 `next()` 方法，`[Symbol.iterator]()`\
    \ 还可以选择性地返回 `return()` 方法。\n当迭代提前停止时，`return()` 方法会被自动调用。这是你可以设置应用程序来清理资源的地方。\n\
    \n以下示例在 Sequence 对象中使用了 `return()` 方法：\n\n```\nclass Sequence {\n    constructor(\
    \ start = 0, end = Infinity, interval = 1 ) {\n        this.start = start;\n \
    \       this.end = end;\n        this.interval = interval;\n    }\n\n    [Symbol.iterator]()\
    \ {\n        let counter = 0;\n        let nextIndex = this.start;\n        return\
    \ {\n            next: () => {\n                if ( nextIndex <= this.end ) {\n\
    \                    let result = { value: nextIndex, done: false }\n        \
    \            nextIndex += this.interval;\n                    counter++;\n   \
    \                 return result;\n                }\n                return {\
    \ value: counter, done: true };\n            },\n            return: () => {\n\
