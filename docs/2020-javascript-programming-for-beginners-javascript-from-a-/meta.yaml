    \n## 嵌套函数\n\nJavaScript 中可以使用一个或多个内部函数。这些嵌套函数位于外部函数内部。内部函数将控制外部函数的变量和参数。外部函数无法访问内部函数指定的变量。\n\
    \n![](img/c8bda18d83895f80a2442fa61b57b147_12_0.png)\n\n## 要记住的要点\n\n- 1) JavaScript\
