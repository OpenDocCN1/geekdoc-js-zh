    # OBJECTS


    JavaScript is designed for a simple object-based paradigm. An object is a set
    of properties, and a property is a combination of a name (or key) and a value.
    The value of the property may be a function, in which case the property is known
    as a process.


    Objects in JavaScript, like in many other programming languages, can be compared
    to objects in real life. The definition of artifacts in JavaScript can be understood
    with real life, with tangible objects.


    Through JavaScript, an object is a stand-alone entity with properties and class.
    For example, compare it to a cup. A cup is an entity that has properties. A cup
    has a color, a pattern, a weight, a material made of it, etc. In the same way,
    JavaScript objects can have properties that describe their characteristics.


