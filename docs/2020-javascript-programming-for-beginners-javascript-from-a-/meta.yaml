    \ JavaScript 数组是否密集并不重要。通常，这些是有用的特性；但如果你的特定用途不适合这些特性，你应该考虑使用类型化数组。数组不会使用字符串作为索引元素（如在关联数组中），而必须使用整数。设置或访问非整数符号不会从数组列表本身设置或检索元素，而是设置或访问与数组对象的首选项相关的变量。数组对象的属性和数组元素的列表是不同的，数组的遍历和变异操作不能应用于这些命名属性。\n\
    \n数组是一种特殊类型的变量，可以使用不同的语法存储多个值。每个值都与从 0 开始的数字索引相关联。\n\n## 数组初始化"
