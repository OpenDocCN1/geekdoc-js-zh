    \ 函数将始终返回一个值。使用 Async 只是意味着将返回 Promise，如果 Promise 没有返回，JavaScript 会自动用其值包装 Promise。\n\
    \n```javascript\nconst getData = async() => {\n    var data = \"Hello World\"\
