    \ promises。\n\n除了 JavaScript Promise，Async / await 语句是语法糖。它们允许我们编写基于 Promise 的代码，但无需主线程，就像它是同步的一样。\n\
    \n## ASYNC:\n\n它只是帮助我们编写同步代码的 Promise，并确保我们不会中断运行的线程。它通过事件循环异步操作。Async 函数永远返回一个值。你做出一个承诺，Javascript\
