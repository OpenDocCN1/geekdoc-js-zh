    \ 语句设置函数返回的值。不带表达式的 `return` 关键字将导致函数返回 `undefined`。没有 `return` 语句或类似语句的函数，例如\
    \ `makeNoise`，同样返回 `undefined`。\n函数参数充当常规绑定，但它们的初始值由函数调用者提供，而不是由函数自身提供。\n\n##\
