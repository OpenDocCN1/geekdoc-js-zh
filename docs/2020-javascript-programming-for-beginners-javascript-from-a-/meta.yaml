- md: '# 2020 JavaScript Programming for Beginners


    ![](img/c8bda18d83895f80a2442fa61b57b147_0_0.png)


    JavaScript from A to Z : Learn The JavaScript Programming Language Completely
    From Scratch


    Robert Kean


    # TABLE OF CONTENT


    1. INTRODUCTION

    2. CONDITIONALS

    3. FUNCTIONS

    4. SCOPE

    5. ARRAYS

    6. LOOPS

    7. ITERATORS

    8. OBJECTS

    9. CLASSES

    10. BROWSER COMPATIBILITY AND TRANSPILATION

    11. MODULES

    12. PROMISES

    13. ASYNC-AWAIT

    14. REQUESTS

    15. GLOSSARY

    16. CONCLUSION


    # AN INTRODUCTION TO JAVASCRIPT


    JavaScript is a strong client-side scripting language. JavaScript is primarily
    used to improve the user''s engagement with the website. In other words, with
    the help of JavaScript, you can make your website more lively and informative.
    JavaScript is also commonly used for graphics rendering and mobile device development.


    There are also more sophisticated server side variants of JavaScript, such as
    Node.js, which enable you to attach more features to your website than merely
    uploading files (such as real-time communication between several computers). Inside
    the client environment (for example, a web browser), JavaScript can be connected
    to the climate objects to provide programmatic control over them.


    It is widely recognized for web page creation, and several non-browser applications
    use it as well. JavaScript can be used for both client-side and server-side developments.
    JavaScript contains a series of basic objects such as sequence, Date and maths
    and a core set of linguistic structures such as operators, control structures
    and phrases.


    # CLIENT SIDE


    It supplies objects for the use of the user and its Document Object Model (DOM).
    As though Client-side extensions enable an application to position items on an
    HTML form and answer to user events such as mouse clicks, template data, and page
    navigation. Using complete client-side frameworks like AngularJS, ReactJS, VueJS
    and so many more.


    # SERVER SIDE


    It supplies objects that are important to running JavaScript on a server. As if
    server-side extensions allow an application to interact with a database, to provide
    continuity of details from one invocation to another, or to execute file manipulations
    on a server. The useful framework that is the most famous of these days is node.js.


    # FEATURES OF JAVASCRIPT


    According to a recent Stack Overflow survey, JavaScript is the most major platform
    on earth.

    With advancements in web development and JavaScript having migrated to the server
    through Node.js and other applications, JavaScript is capable of even more. Here
    are some things we can do with JavaScript:


    - I. JavaScript was first developed for DOM manipulation. Earlier websites were
    mostly static after the creation of dynamic websites for JS.

    - II. JS functions are objects. We can have properties and methods much like a
    particular entity. They may be transmitted as arguments for other purposes.

    - III. This will accommodate the date and period.

    - IV. Performs Form Validation even though forms are generated using HTML.

    - V. No compiler was required.


    # PLATFORM FOR JAVASCRIPT


    **Web Development**: Introducing interactivity and actions to static JavaScript
    pages was developed to do so in 1995. When utilizing AngularJS, this can be done
    very quickly.


    **Web Applications:** Through development, the apps have advanced to the point
    that a language is required to build reliable web applications. If we''re looking
    at a map in Google Maps, we just need to click and drag the mouse. All the informative
    display is only a button away, and that is only possible because of JavaScript.
    Uses Application Programming Interfaces (APIs) that give extra power to the computer.
    Electron and React is really helpful in this section.


    **Server Applications:** With the support of Node.js, JavaScript has found its
    way from client to server, and node.js is the most strong on the application side.


    **Games:** Not only on websites, JavaScript also helps in the creation of leisure
    games. The combination of JavaScript and HTML 5 allows JavaScript common in game
    creation. This offers an EaseJS repository that offers options for operating with
    rich graphics.


    **Smart watches:** JavaScript is used in all feasible systems and platforms. This
    offers a PebbleJS library that is used in smartwatch apps. It system operates
    with programs that allow the internet to run.


    **Art:** Artists and designers will build anything they want using JavaScript
    to sketch on HTML 5 canvas, render sound more powerful and use the p5.js software.


    **Machine Learning:** This collection of JavaScript ml5.js can be used for software
    creation through machine learning.


    # HOW TO RUN JAVASCRIPT?


    As a scripting language, JavaScript can not operate on its own. Ultimately, the
    application is liable for running the JavaScript file. When a user requests a
    JavaScript-based HTML page, the script is sent to the browser and it is up to
    the browser to execute it. JavaScript is supported by all modern web browsers
    and is the biggest benefit of JavaScript. So, you don''t have to think over whether
    the site client is using Internet Explorer, Google Chrome, Firefox or some other
    application. JavaScript is supported. Often, JavaScript is working on every operating
    system, like Windows, Linux or Mac. Therefore, JavaScript overcomes the key drawbacks
    of VBScript (now deprecated) and is restricted to IE and window.


    # TOOLS YOU NEED


    In order to begin with, you need a text editor to write your code and a browser
    to view your web pages. You should use the text editor of your choosing, like
    Notepad++, Visual Studio Code, Sublime Text, Atom or some other text editor that
    you''re happy with. You may use any web browser that includes Google Chrome, Safari,
    Microsoft Edge, Internet Explorer, etc.


    # JAVASCRIPT AND JAVA


    JavaScript and Java are in some ways identical but in others completely different.
    JavaScript is similar to Java, but has no static typing and strong type control
    of Java. This is the reason why JavaScript has been reconstructed from LiveScript
    to Javascript, adopting most Java expression syntax, naming conventions and the
    basic control flow constructions.


    JavaScript follows a runtime framework based on the limited number of data types
    representing integer, boolean and string values, unlike the compile-time class
    structure of Java. Instead of a class model, JavaScript has a prototype-based
    object model. The prototype model has a dynamic inheritance, which can change
    for individual objects. What is inherited. Functions without unique declaration
    specifications are often provided by JavaScript. Functions may be object resources,
    usable as methods loosely typed.


    In contrast to Java, JavaScript is a very open language. All variables, classes
    and methods are not required to be declared. You must not worry about public,
    private or safeguarding methods and you do not need to implement interfaces. No
    explicitly typing variables, parameters and return function types.


    Java is a class programming language built for fast output and protection of type.
    Type Security means, for example, that a Java integer can not be thrown into an
    object reference or private memory by altering Java bytecodes. The class-based
    paradigm of Java means that only courses and their methods are comprised of programming.
    The heritage and strong style of Java class typically includes tightly related
    hierarchies of artifacts. Such specifications hinder the programming of Java than
    those of JavaScript.


    JavaScript, by contrast, comes down spiritually from a series of smaller, dynamic
    languages, such as HyperTalk and dBASE. Their simple syntax, advanced built-in
    functionality and low specifications to construct structures provide a larger
    audience of programming resources.


    # CONDITIONALS


    Conditional statements are used for various actions depending on varying circumstances.

    Conditional statements govern JavaScript behavior and decide whether pieces of
    code will run or not.

    Within JavaScript there are various kinds of requirements, including:


    - 1) "If" statements: that if there is a valid condition it is used for a sequence
    of code execution.

    - 2) "Else" statements: where it defines an execution for a block of code if the
    same assertion is false.

    - 3) "Else if": a new question is stated if the first condition is incorrect.
    Now that you have the basic JavaScript terms, let us show each of the examples.


    # IF STATEMENT EXAMPLE


    The If sentence only runs while the condition in parenthesis () is true. Thus
    the commonest form of conditional.'
  mdcn: '# 2020年面向初学者的JavaScript编程


    ![](img/c8bda18d83895f80a2442fa61b57b147_0_0.png)


    JavaScript从入门到精通：从零开始完全掌握JavaScript编程语言


    Robert Kean


    # 目录


    1. 引言

    2. 条件语句

    3. 函数

    4. 作用域

    5. 数组

    6. 循环

    7. 迭代器

    8. 对象

    9. 类

    10. 浏览器兼容性与转译

    11. 模块

    12. Promise

    13. Async-Await

    14. 网络请求

    15. 术语表

    16. 结论


    # JavaScript简介


    JavaScript是一种强大的客户端脚本语言。JavaScript主要用于提升用户与网站的互动性。换句话说，在JavaScript的帮助下，你可以让你的网站更生动、信息更丰富。JavaScript也常用于图形渲染和移动设备开发。


    JavaScript也有更复杂的服务器端变体，例如Node.js，它使你能够为网站添加更多功能，而不仅仅是上传文件（例如多台计算机之间的实时通信）。在客户端环境（例如Web浏览器）中，JavaScript可以连接到环境对象，以提供对它们的编程控制。


    它因网页创建而广为人知，一些非浏览器应用程序也使用它。JavaScript可用于客户端和服务器端开发。JavaScript包含一系列基本对象，如序列、日期和数学，以及一组核心语言结构，如运算符、控制结构和语句。


    # 客户端


    它为用户及其文档对象模型（DOM）的使用提供对象。客户端扩展使应用程序能够在HTML表单上放置元素，并响应用户事件，如鼠标点击、模板数据和页面导航。使用完整的客户端框架，如AngularJS、ReactJS、VueJS等等。


    # 服务器端


    它提供在服务器上运行JavaScript所需的重要对象。服务器端扩展允许应用程序与数据库交互，以提供从一次调用到另一次调用的细节连续性，或在服务器上执行文件操作。目前最流行的实用框架是node.js。


    # JavaScript的特性


    根据最近的Stack Overflow调查，JavaScript是全球最主要的平台。

    随着Web开发的进步以及JavaScript通过Node.js和其他应用程序迁移到服务器端，JavaScript能够做更多的事情。以下是我们可以用JavaScript做的一些事情：


    - I. JavaScript最初是为DOM操作而开发的。早期的网站大多是静态的，后来通过JS创建了动态网站。

    - II. JS函数是对象。我们可以像特定实体一样拥有属性和方法。它们可以作为参数传递给其他用途。

    - III. 这将处理日期和时间。

    - IV. 即使表单是使用HTML生成的，也能执行表单验证。

    - V. 不需要编译器。


    # JavaScript的平台


    **Web开发**：为静态JavaScript页面引入交互性和操作，这是在1995年开发的。使用AngularJS时，这可以非常快速地完成。


    **Web应用程序**：通过发展，应用程序已经进步到需要一种语言来构建可靠的Web应用程序。如果我们正在查看Google地图中的地图，我们只需要点击和拖动鼠标。所有信息显示都只需一个按钮即可，而这只有通过JavaScript才成为可能。使用应用程序编程接口（API）为计算机提供额外的功能。Electron和React在这方面非常有帮助。


    **服务器应用程序**：在Node.js的支持下，JavaScript已经从客户端找到了通往服务器的道路，而node.js在应用端是最强大的。


    **游戏**：JavaScript不仅在网站上，还在休闲游戏的创建中发挥作用。JavaScript和HTML 5的结合使得JavaScript在游戏创建中很常见。这提供了EaseJS库，为处理丰富的图形提供了选项。


    **智能手表**：JavaScript用于所有可行的系统和平台。这提供了PebbleJS库，用于智能手表应用程序。该系统运行允许互联网运行的程序。


    **艺术**：艺术家和设计师可以使用JavaScript在HTML 5画布上绘制任何他们想要的东西，渲染更强大的声音，并使用p5.js软件。


    **机器学习**：这个JavaScript ml5.js集合可用于通过机器学习进行软件开发。


    # 如何运行JavaScript？


    作为脚本语言，JavaScript不能独立运行。最终，应用程序负责运行JavaScript文件。当用户请求基于JavaScript的HTML页面时，脚本被发送到浏览器，由浏览器执行它。JavaScript被所有现代Web浏览器支持，这是JavaScript最大的好处。因此，你不必考虑网站客户端使用的是Internet
    Explorer、Google Chrome、Firefox还是其他应用程序。JavaScript是被支持的。通常，JavaScript在所有操作系统上都能工作，如Windows、Linux或Mac。因此，JavaScript克服了VBScript（现已弃用）的主要缺点，后者仅限于IE和Windows。


    # 你需要的工具


    为了开始，你需要一个文本编辑器来编写代码，以及一个浏览器来查看你的网页。你应该使用你选择的文本编辑器，如Notepad++、Visual Studio Code、Sublime
    Text、Atom或其他你满意的文本编辑器。你可以使用任何Web浏览器，包括Google Chrome、Safari、Microsoft Edge、Internet
    Explorer等。


    # JavaScript与Java


    JavaScript和Java在某些方面相似，但在其他方面完全不同。JavaScript类似于Java，但没有Java的静态类型和强类型控制。这就是为什么JavaScript从LiveScript重构为Javascript，采用了大多数Java表达式语法、命名约定和基本控制流结构的原因。


    JavaScript遵循基于有限数据类型的运行时框架，这些数据类型表示整数、布尔值和字符串值，这与Java的编译时类结构不同。JavaScript没有类模型，而是基于原型的对象模型。原型模型具有动态继承，可以为单个对象更改继承的内容。JavaScript通常提供没有唯一声明规范的函数。函数可以是对象资源，作为松散类型的方法使用。


    与Java相比，JavaScript是一种非常开放的语言。所有变量、类和方法都不需要声明。你不必担心public、private或protected方法，也不需要实现接口。不需要显式声明变量、参数和返回函数类型。


    Java是一种为快速输出和类型安全而构建的类编程语言。类型安全意味着，例如，Java整数不能通过修改Java字节码被抛入对象引用或私有内存。Java的基于类的范式意味着编程仅由类及其方法组成。Java类的继承和强类型通常包括紧密相关的对象层次结构。这些规范阻碍了Java的编程，使其不如JavaScript灵活。


    相比之下，JavaScript在精神上源自一系列更小、更动态的语言，如HyperTalk和dBASE。它们简单的语法、高级的内置功能和构建结构的低要求，为更广泛的编程资源受众提供了便利。


    # 条件语句


    条件语句用于根据不同情况执行不同的操作。

    条件语句控制JavaScript的行为，并决定代码片段是否运行。

    在JavaScript中，有多种类型的条件，包括：


    - 1) "If"语句：如果条件有效，则用于执行一系列代码。

    - 2) "Else"语句：如果同一断言为假，则定义一个代码块的执行。

    - 3) "Else if"：如果第一个条件不正确，则陈述一个新问题。现在你有了基本的JavaScript术语，让我们展示每个示例。


    # IF语句示例


    If语句仅在括号()中的条件为真时运行。因此，这是最常见的条件形式。'
