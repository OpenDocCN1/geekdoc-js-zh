    # BREAK STATEMENT


    When JavaScript experiences a break statement in a loop, it instantly exits the
    loop without running any other loop statements. The power is passed immediately
    to the statement following the loop structure. Here is an example of this:


    ```

    1. var sum = 0;

    2. for (var i = 1; i <= 10000; i++) {

    3.     sum += i;

    4.     if (i === 50) {

    5.         break;    // immediately transfers control outside the for block

    6.     }

    7. }

    8. alert("Sum = " + sum);        // => Sum = 1275

    ```


    When an infinite loop is deliberately created, you can use a break statement to
    control the end of the loop, as follows:'
