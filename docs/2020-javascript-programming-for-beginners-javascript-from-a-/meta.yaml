- md: "## SUMMARY\n\n1. An object which returns a value in the future is a promise.\n\
    2. A promise begins in the state to be fulfilled or denied in the State to be\
    \ fulfilled.\n3. Using then() method to schedule a callback for fulfillment of\
    \ the pledge, and catch() method to schedule a callback for rejection.\n4. In\
    \ the finally() process, place the code you want to execute whether the promise\
    \ is fulfilled or rejected.\n\n## CONCLUSION\n\nPromised words have become an\
    \ integral component of many JavaScript idioms, including the WHATWG Fetch standard,\
    \ which is used to synchronize most of modern ajax requests, and the Async Functions\
    \ standard. At the time of this writing, Async functions are Stage 3, but I predict\
    \ that these will soon become a plausible approach for asynchronous JavaScript\
    \ programming, which means that in the coming years JavaScript developers will\
    \ need to learn to appreciate their promises.\n\nFor example, I suggest that when\
    \ you use Redux, you check redux-saga: a library used to manage side-effects in\
    \ Redux that depends on async functions across the whole documentation.\n\n##\
    \ ASYNC-AWAIT\n\nWe all recognize that Javascript is a Synchronous, which means\
    \ it has an event loop to queue an operation that will not be completed until\
    \ sometime after the code has ended the operation. But in our software there are\
    \ many functionalities that make our code asynchronous. One is the interface Async\
    \ / Await.\n\nAsync / Await extends the guarantees that we provide in the language\
    \ as support. Please refer to Javascript promises for more information.\n\nIn\
    \ addition to JavaScript Promise, Async / await statement is syntactic sugar.\
    \ They allow us to write promise-based code, but without the main thread, as if\
    \ it were synchronous.\n\n## ASYNC:\n\nIt simply helps us to write promises of\
    \ a synchronous code and makes sure we do not interrupt the running thread. It\
    \ operates by means of the event loop asynchronously. Async functions return a\
    \ value forever. You make a commitment and javascript immediately bundles it into\
    \ a contract that is solved with its value if it is not returned.\n\nAsync functions\
    \ allow us not to block the implementation thread, but to write promise codes\
    \ as synchronous. It operates asynchronously through an event-loop. The Async\
    \ function will always return a value. Using Async simply means that the promise\
    \ will be returned, and if the promise is not returned, JavaScript automatically\
    \ wraps the promise with its value.\n\n```javascript\nconst getData = async()\
    \ => {\n    var data = \"Hello World\";\n    return data;\n}\n\ngetData().then(data\
    \ => console.log(data));\n```\n\nOUTPUT: Hello World\n\n## AWAIT:\n\nAwait function\
    \ has been used to wait for a promise. Only in the async block can it be used.\
    \ It causes the code to wait for a result of the promise. It's just waiting for\
    \ the async block.\n\nThe Await operator is used to wait for a promise. It can\
    \ only be used inside the Async block. The keyword Await causes JavaScript to\
    \ wait until the promise returns the result. It should be noted that this only\
    \ causes the asynchronous function block to wait and not the entire program to\
    \ run.\n\n```javascript\nconst getData = async() => {\n    var y = await \"Hello\
    \ World\";\n    console.log(y);\n}\n\nconsole.log(1);\ngetData();\nconsole.log(2);\n\
    ```\n\n**OUTPUT: Hello World**\n\nNote that the console prints 2 in front of \"\
    Hello World.\" This is due to the use of the keyword waiting for you.\n\n## SUPPORTED\
    \ BROWSERS:\n\nThe Async / Await Function supported browsers are listed below:\n\
    \n- Google's Chrome\n- Firefox Firewall\n- Apple's Safari\n- Opera\n\n## CONCLUSION\n\
    \nAnd here you can – async / await provides a good, easier to read and maintain\
    \ async code. Even with browser support becoming more limited than other asynchronous\
    \ code mechanisms at the time of writing, it is very well worth learning and contemplating\
    \ for use, now and in the coming years.\n\n## REQUEST\n\nA resource request is\
    \ defined by the Fetch API Request interface.\n\nUsing the Request( )constructor\
    \ to generate a new Request object; however, as a result of another API operation\
    \ such as a FetchEvent.request service worker it is likely to have a Request object\
    \ returning.\n\nThe absence of navigation or reload of a page includes the capability\
    \ of requesting and processing server data asynchronously. That is Ajax (or AJAX\
    \ if you'd like to yell). This acronym is the word that Ajax was the buzzword\
    \ everybody used to describe the kind of web apps we now take it for granted —\
    \ apps like Twitter , Facebook, Google Maps and Gmail, and more, as you interact\
    \ with the page constantly without requiring a full page reload! This is a sign\
    \ for Asynchronous JavaScript and XML.\n\n## SEND A REQUEST TO SERVER\n\nWe use\
    \ open( )and send( )methods for the XMLHttpRequest object to send a request to\
    \ a server:\n\nOpen(method, url, async) Into the application form\n\n- Method:\
    \ the application type: GET or POST\n- URL: position of the server (file)\n- Async:\
    \ true(asynchronous) or false (synchronous)\n- Send() request (used for GET) to\
    \ the server\n- Send(string) Sends the to the server program (POST-used)\n\n##\
    \ GET OR POST?\n\nIn most cases the GET is easier and quicker than POST. Use POST\
    \ requests, however, when:\n\n- No cached file (update a file or server database)\
    \ is open.\n- Send a lot of data to the server (POST does not have any size restrictions).\n\
    - POST is more robust and reliable than GET when sending user inputs (which may\
    \ contain unknown characters).\n\n## GET REQUESTS:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n\n<h2>The XMLHttpRequest Object</h2>\n\n<button type=\"button\"\
    \ onclick=\"loadDoc()\">Request data</button>\n\n<p id=\"demo\"></p>\n\n<script>\n\
    function loadDoc() {\n  var xhttp = new XMLHttpRequest();\n  xhttp.onreadystatechange\
    \ = function() {\n    if (this.readyState == 4 && this.status == 200) {\n    \
    \  document.getElementById(\"demo\").innerHTML = this.responseText;\n    }\n \
    \ };\n  xhttp.open(\"GET\", \"demo_get.asp\", true);\n  xhttp.send();\n}\n</script>\n\
    \n</body>\n</html>\n```\n\n# The XMLHttpRequest Object\n\nRequest data\n\nThis\
    \ content was requested using the GET method.\n\nRequested at: 8/10/2020 4:48:28\
    \ PM\n\nIf you want to use the GET method to send information, add it to the URL:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h2>The XMLHttpRequest Object</h2>\n\
    \n<button type=\"button\" onclick=\"loadDoc()\">Request data</button>\n\n<p id=\"\
    demo\"></p>\n\n<script>\nfunction loadDoc() {\n  var xhttp = new XMLHttpRequest();\n\
    \  xhttp.onreadystatechange = function() {\n    if (this.readyState == 4 && this.status\
    \ == 200) {\n      document.getElementById(\"demo\").innerHTML = this.responseText;\n\
    \    }\n  };\n  xhttp.open(\"GET\", \"demo_get2.asp?fname=Henry&lname=Ford\",\
    \ true);\n  xhttp.send();\n}\n</script>\n\n</body>\n</html>\n```\n\n# The XMLHttpRequest\
    \ Object\n\nRequest data\n\nHello Henry Ford\n\n## POST REQUESTS\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n\n<h2>The XMLHttpRequest Object</h2>\n\n<button\
    \ type=\"button\" onclick=\"loadDoc()\">Request data</button>\n\n<p id=\"demo\"\
    ></p>\n\n<script>\nfunction loadDoc() {\n  var xhttp = new XMLHttpRequest();\n\
    \  xhttp.onreadystatechange = function() {\n    if (this.readyState == 4 && this.status\
    \ == 200) {\n      document.getElementById(\"demo\").innerHTML = this.responseText;\n\
    \    }\n  };\n  xhttp.open(\"POST\", \"demo_post.asp\", true);\n  xhttp.send();\n\
    }\n</script>\n\n</body>\n</html>\n```\n\n# The XMLHttpRequest Object\n\nRequest\
    \ data\n\nThis content was requested using the POST method.\n\nRequested at: 8/10/2020\
    \ 4:49:01 PM\n\nAdd an HTTP header using setRequestHeader( ) to the POST data\
    \ as an HTML type. In send( )method, enter the data you want to send:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n\n<h2>The XMLHttpRequest Object</h2>\n\n<button\
    \ type=\"button\" onclick=\"loadDoc()\">Request data</button>\n\n<p id=\"demo\"\
    ></p>\n\n<script>\nfunction loadDoc() {\n  var xhttp = new XMLHttpRequest();\n\
    \  xhttp.onreadystatechange = function() {\n    if (this.readyState == 4 && this.status\
    \ == 200) {\n      document.getElementById(\"demo\").innerHTML = this.responseText;\n\
    \    }\n  };\n  xhttp.open(\"POST\", \"demo_post2.asp\", true);\n  xhttp.setRequestHeader(\"\
    Content-type\", \"application/x-www-form-urlencoded\");\n  xhttp.send(\"fname=Henry&lname=Ford\"\
    );\n}\n</script>\n\n</body>\n</html>\n```\n\n# The XMLHttpRequest Object\n\nRequest\
    \ data\n\nHello Henry Ford\n\nAdds HTTP headers to request in setRequestHeader(header,\
    \ value).\n\n- Header: Enter the name of the header\n- Value: sets the value of\
    \ the header\n\n## ASYNCHRONOUS- TRUE OR FALSE?"
