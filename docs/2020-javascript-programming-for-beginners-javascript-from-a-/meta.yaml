    1. var number = 1;

    2. var sum = 0;

    3. while (true)   // equivalent to for ( ; ; ), called ''forever'' loop

    4. {

    5.     sum += number;

    6.     if (number === 50) {

    7.         break;  // immediately transfers control outside while block

    8.     }

    9.     number++;

    10. }

    11. alert("Sum = " + sum);      // => Sum = 1275

    ```


    The number++; assertion will not be executed when the loop is entered for the
