- md: "## JavaScript Array\n\nIn JavaScript array can be described and initialized\
    \ in two ways, the literal array and the syntax of the constructor array.\nThe\
    \ array of literal syntax is simple. It consists of a list of values separated\
    \ by a comma and enclosed in square brackets.\nThe following example illustrates\
    \ how to describe and initialize an array using a literal syntax array.\n\n```html\n\
    <body>\n    <h1>JavaScript Array</h1>\n    <p id=\"p1\"></p>\n    <p id=\"p2\"\
    ></p>\n    <p id=\"p3\"></p>\n    <p id=\"p4\"></p>\n    <p id=\"p5\"></p>\n\n\
    \    <script>\n        var stringArray = [\"one\", \"two\", \"three\"];\n\n  \
    \      var numericArray = [1, 2, 3, 4];\n\n        var decimalArray = [1.1, 1.2,\
    \ 1.3];\n\n        var booleanArray = [true, false, false, true];\n\n        var\
    \ mixedArray = [1, \"two\", \"three\", 4];\n\n        document.getElementById(\"\
    p1\").innerHTML = stringArray;\n        document.getElementById(\"p2\").innerHTML\
    \ = numericArray;\n        document.getElementById(\"p3\").innerHTML = decimalArray;\n\
    \        document.getElementById(\"p4\").innerHTML = booleanArray;\n        document.getElementById(\"\
    p5\").innerHTML = mixedArray;\n    </script>\n</body>\n```\n\nJavaScript Array\n\
    one,two,three\n1,2,3,4\n1.1,1.2,1.3\ntrue,false,false,true\n1,two,three,4\n\n\
    The JavaScript array can store multiple elements of different data types. It is\
    \ not necessary to store the same data type value in an array.\n\n## ARRAY CONSTRUCTOR\n\
    \nYou can initialize an array with the syntax of the Array constructor using a\
    \ new keyword.\nThe following example illustrates how to describe an array using\
    \ the syntax of the Array constructor.\n\n## COMMON OPERATIONS\n\n### CREATE AN\
    \ ARRAY\n\n```javascript\nlet fruits = ['Apple', 'Banana']\n\nconsole.log(fruits.length)\n\
    // 2\n```\n\n### ACCESS AN ITEM USING AN ARRAY ITEM\n\n```javascript\nlet first\
    \ = fruits[0]\n// Apple\n\nlet last = fruits[fruits.length - 1]\n// Banana\n```\n\
    \n### LOOP OVER AN ARRAY\n\n```javascript\nfruits.forEach(function(item, index,\
    \ array) {\n  console.log(item, index)\n})\n// Apple 0\n// Banana 1\n```\n\n###\
    \ ADD AN ITEM TO THE STARTING OF AN ARRAY\n\n```javascript\nlet newLength = fruits.unshift('Strawberry')\
    \ // add to the front\n// [\"Strawberry\", \"Banana\"]\n```\n\n### REMOVE AN ITEM\
    \ BY INDEX POSITION\n\n```javascript\nlet removedItem = fruits.splice(pos, 1)\
    \ // this is how to remove an item\n\n// [\"Strawberry\", \"Mango\"]\n```\n\n\
    ### ACCESSING ARRAY ELEMENT\n\nThe JavaScript arrays is zero-indexed: the first\
    \ item of the array is index 0, so the last element is index equal to length property\
    \ value of the array minus 1. Returns undefined using an incorrect index number.\n\
    \n```javascript\nlet arr = ['this is the first element', 'this is the second element',\
    \ 'this is the last element']\nconsole.log(arr[0])           // logs 'this is\
    \ the first element'\nconsole.log(arr[1])           // logs 'this is the second\
    \ element'\nconsole.log(arr[arr.length - 1]) // logs 'this is the last element'\n\
    ```\n\nThere's nothing special about the JavaScript arrays and the properties\
    \ that make it happen. The properties of JavaScript that begin with a digit can\
    \ not be referenced with dot notation and must be accessed with bracket notation.\n\
    \nFor example, if you have an object called 3d, it can only be referenced using\
    \ a bracket notation.\nNote that '3d' had to be mentioned in the 3d example. This\
    \ is also possible to quote the indexes of the JavaScript list (e.g. years['2']\
    \ instead of years[2]), although this is not essential.\n\n## ARRAY PROPERTIES\n\
    \n- **Constructor** - Returns the function that generated the prototype of the\
    \ Array object\n- **Length** - Sets or returns the number of items in the list\n\
    - **Prototype** - Allows you to add properties and methods to your Array set.\n\
    \n## ARRAY METHODS\n\n1. Concat() Joins two or more arrays and returns a copy\
    \ of the attached arrays.\n2. CopyWithin() Copies the array elements to and from\
    \ the specified positions within the array.\n3. Entries() Returns the Array Iteration\
    \ Object key / value pair\n4. Every() Tests whether any element in an array passes\
    \ a test.\n5. Fill() Fill the items in the array with a static value\n6. Filter()\
    \ Creates a new array for every element in the array that passes the test.\n7.\
    \ Find() Returns the value of the very first component in the test sequence.\n\
    8. FindIndex() Returns the index of the first item in the array that passes the\
    \ test.\n9. ForEach() Calls a function for each element of the array\n10. From()\
    \ Creates an array from that of an object\n11. Includes() Check that the array\
    \ contains the required element\n12. IndexOf() Scan the array for an element and\
    \ return its location\n13. IsArray() Checks whether an object is an array\n14.\
    \ Join() Connect all the array elements in a list\n15. Keys() Returns an Iteration\
    \ Object array containing the keys of the original array\n16. LastIndexOf() Find\
    \ an element array, start at the end of the array and return its location.\n17.\
    \ Map() Generates a new array, resulting in the function being named for each\
    \ array element.\n18. Pop() Removes the very last element of the array and returns\
    \ the element to a array.\n19. Push() Adds new elements to the end of the array\
    \ and returns the new length of the list\n20. Reduce() Reduce the values of the\
    \ collection to a single value (going left to right)\n21. ReduceRight() Reduces\
    \ the values of the array to a single value (going from right to left)\n22. Reverse()\
    \ Reverses the order of the objects in the list\n23. Shift() Removes the first\
    \ element of the array and returns the element\n24. Some() Checks if any of the\
    \ elements in the array have passed the test.\n25. Sort() Sorts the array elements\n\
    26. Splice() Add / Remove elements via an array\n27. ToString() Converts a string\
    \ array and returns the result.\n28. Unshift() Adds new elements to the start\
    \ of the array, and returns a new length\n29. ValueOf() Returns the primary value\
    \ of the list\n\n## LOOPS\n\nLoops are used in JavaScript to perform frequent\
    \ tasks on the basis of a condition. Conditions typically return true or false\
    \ when evaluated. The loop will continue to run until the stated condition returns\
    \ false.\n\n### DIFFERENT KINDS OF LOOP\n\nJavaScript contains a range of loop\
    \ types:\n\n1. For-Loops a number of times via a code block\n2. For / in-Loops\
    \ through an object's properties\n3. For / of -loops through the values of even\
    \ an iterable object\n4. While-loops through a code block while the stated condition\
    \ is true\n5. Do / while-also loops through a code block while the stated condition\
    \ is true\n\n### WHILE LOOP\n\nJavaScript loops have been used repeatedly to run\
    \ a code block unless certain requirements have been met. When developers think\
    \ about iteration or iteration, say, an array, it's the same as looping. JavaScript\
    \ provides several options for repeatedly running a code block, like while, do\
    \ while, for and for-in.\n\n#### Example\n\n```javascript\nvar sum = 0;\nvar number\
    \ = 1;\nwhile (number <= 50) {  // -- condition\n  sum += number;        // --\
    \ body\n  number++;             // -- updater\n}\nalert(\"Sum = \" + sum);  //\
    \ => Sum = 1275\n```\n\nThe condition is assessed first. If valid, the block of\
    \ statements that follow the while statement will be executed. This is repeated\
    \ until the condition is incorrect. It is known as a pre-test loop since it tests\
    \ the condition before the block is executed.\n\nThe number++ statement will be\
    \ called the updater. Removing it will result in an endless loop. You must always\
    \ provide a statement in the loop to ensure that the loop is terminated or else\
    \ you will run into this problem.\n\n### DO WHILE LOOP\n\n```javascript\nvar sum\
    \ = 0;\nvar number = 1;\ndo {\n  sum += number;        // -- body\n  number++;\
    \             // -- updater\n} while (number <= 50); // -- condition\nalert(\"\
    Sum = \" + sum);  // => Sum = 1275\n```\n\nThe next do block is executed first,\
    \ and then the state is evaluated. If the while condition is valid, the block\
    \ will be executed again and repeated until the condition is false. This is known\
    \ as a post-test loop as the condition is tested after the block has been executed.\n\
    \n```javascript\ndo {\n    // read a character from keyboard in the body\n} while\
    \ (if ch === '0');    // => terminate loop if '0' is entered\n```\n\n### FOR LOOP\n\
    \n```javascript\nvar sum = 0;\nfor (var i = 1; i <= 50; i++) {\n    sum = sum\
    \ + i;\n}\nalert(\"Sum = \" + sum);    // => Sum = 1275\n```\n\nThis consists\
    \ of three sections, separated by semi-colons. The first is the initializer (var\
    \ i = 1) which initializes the loop and is executed only once at the start of\
    \ the loop. The second is the state of the test (i <= 50). When the conditional\
    \ expression is evaluated to true, the loop body is executed. The loop stops when\
    \ it's right. The third element is an updater (i++) that is invoked after each\
    \ iteration. Usually, the updater raises or reduces the loop counter.\n\nIn a\
    \ for-loop, all three phases, i.e. initializer, test condition, and updater, are\
    \ written together in such a single line (called iteration statement), while in\
    \ a while they are scattered and lying in different places.\n\n### FOR IN LOOP\n\
    \n```javascript\nvar student = { name:\"Bill\", age: 25, degree: \"Masters\" };\n\
    for (var item in student) {\n    alert(student[item]);    // => \"Bill\", then\
    \ 25, then \"Masters\"\n}\n```\n\nWith each iteration, JavaScript applies the\
    \ name of the property (string value) to the variable object. In the example above,\
    \ the following are: name, age and degree."
  mdcn: "## JavaScript 数组\n\n在 JavaScript 中，数组可以通过两种方式描述和初始化：字面量数组和构造函数数组语法。\n字面量语法的数组很简单。它由逗号分隔的值列表组成，并用方括号括起来。\n\
    以下示例说明了如何使用字面量语法数组来描述和初始化数组。\n\n```html\n<body>\n    <h1>JavaScript Array</h1>\n\
    \    <p id=\"p1\"></p>\n    <p id=\"p2\"></p>\n    <p id=\"p3\"></p>\n    <p id=\"\
    p4\"></p>\n    <p id=\"p5\"></p>\n\n    <script>\n        var stringArray = [\"\
    one\", \"two\", \"three\"];\n\n        var numericArray = [1, 2, 3, 4];\n\n  \
    \      var decimalArray = [1.1, 1.2, 1.3];\n\n        var booleanArray = [true,\
    \ false, false, true];\n\n        var mixedArray = [1, \"two\", \"three\", 4];\n\
    \n        document.getElementById(\"p1\").innerHTML = stringArray;\n        document.getElementById(\"\
    p2\").innerHTML = numericArray;\n        document.getElementById(\"p3\").innerHTML\
    \ = decimalArray;\n        document.getElementById(\"p4\").innerHTML = booleanArray;\n\
    \        document.getElementById(\"p5\").innerHTML = mixedArray;\n    </script>\n\
    </body>\n```\n\nJavaScript 数组\none,two,three\n1,2,3,4\n1.1,1.2,1.3\ntrue,false,false,true\n\
    1,two,three,4\n\nJavaScript 数组可以存储不同数据类型的多个元素。数组中不必存储相同数据类型的值。\n\n## 数组构造函数\n\n\
    你可以使用 `new` 关键字和 `Array` 构造函数语法来初始化数组。\n以下示例说明了如何使用 `Array` 构造函数语法来描述数组。\n\n##\
    \ 常用操作\n\n### 创建数组\n\n```javascript\nlet fruits = ['Apple', 'Banana']\n\nconsole.log(fruits.length)\n\
    // 2\n```\n\n### 使用数组索引访问元素\n\n```javascript\nlet first = fruits[0]\n// Apple\n\
    \nlet last = fruits[fruits.length - 1]\n// Banana\n```\n\n### 遍历数组\n\n```javascript\n\
    fruits.forEach(function(item, index, array) {\n  console.log(item, index)\n})\n\
    // Apple 0\n// Banana 1\n```\n\n### 在数组开头添加元素\n\n```javascript\nlet newLength\
    \ = fruits.unshift('Strawberry') // 添加到开头\n// [\"Strawberry\", \"Banana\"]\n```\n\
    \n### 通过索引位置移除元素\n\n```javascript\nlet removedItem = fruits.splice(pos, 1) //\
    \ 这是移除元素的方法\n\n// [\"Strawberry\", \"Mango\"]\n```\n\n### 访问数组元素\n\nJavaScript\
    \ 数组是零索引的：数组的第一个元素索引为 0，因此最后一个元素的索引等于数组的 `length` 属性值减 1。使用不正确的索引号将返回 `undefined`。\n\
    \n```javascript\nlet arr = ['this is the first element', 'this is the second element',\
    \ 'this is the last element']\nconsole.log(arr[0])           // 输出 'this is the\
    \ first element'\nconsole.log(arr[1])           // 输出 'this is the second element'\n\
    console.log(arr[arr.length - 1]) // 输出 'this is the last element'\n```\n\nJavaScript\
    \ 数组及其属性没有什么特别之处。以数字开头的 JavaScript 属性不能用点表示法引用，必须使用方括号表示法访问。\n\n例如，如果你有一个名为 `3d`\
    \ 的对象，它只能使用方括号表示法引用。\n注意，在 `3d` 示例中必须提及 '3d'。也可以引用 JavaScript 列表的索引（例如 `years['2']`\
    \ 而不是 `years[2]`），尽管这不是必需的。\n\n## 数组属性\n\n- **Constructor** - 返回生成数组对象原型的函数\n\
    - **Length** - 设置或返回列表中的项目数量\n- **Prototype** - 允许你向数组集合添加属性和方法。\n\n## 数组方法\n\n\
    1.  Concat() 连接两个或多个数组，并返回连接后数组的副本。\n2.  CopyWithin() 在数组内将数组元素复制到指定位置。\n3.  Entries()\
    \ 返回数组迭代对象的键/值对。\n4.  Every() 测试数组中的所有元素是否都通过了测试。\n5.  Fill() 用静态值填充数组中的项目。\n\
    6.  Filter() 为数组中通过测试的每个元素创建一个新数组。\n7.  Find() 返回测试序列中第一个组件的值。\n8.  FindIndex()\
    \ 返回数组中第一个通过测试的项目的索引。\n9.  ForEach() 为数组的每个元素调用一个函数。\n10. From() 从一个对象创建数组。\n\
    11. Includes() 检查数组是否包含所需的元素。\n12. IndexOf() 在数组中搜索一个元素并返回其位置。\n13. IsArray()\
    \ 检查一个对象是否是数组。\n14. Join() 将所有数组元素连接成一个字符串。\n15. Keys() 返回一个包含原始数组键的迭代对象数组。\n\
    16. LastIndexOf() 查找一个元素数组，从数组末尾开始并返回其位置。\n17. Map() 生成一个新数组，结果是对每个数组元素调用函数。\n\
    18. Pop() 移除数组的最后一个元素，并将该元素返回到数组。\n19. Push() 将新元素添加到数组的末尾，并返回列表的新长度。\n20. Reduce()\
    \ 将集合的值归约为单个值（从左到右）。\n21. ReduceRight() 将数组的值归约为单个值（从右到左）。\n22. Reverse() 反转列表中对象的顺序。\n\
    23. Shift() 移除数组的第一个元素并返回该元素。\n24. Some() 检查数组中是否有任何元素通过了测试。\n25. Sort() 对数组元素进行排序。\n\
    26. Splice() 通过数组添加/移除元素。\n27. ToString() 将数组转换为字符串并返回结果。\n28. Unshift() 将新元素添加到数组的开头，并返回新长度。\n\
    29. ValueOf() 返回列表的原始值。\n\n## 循环\n\nJavaScript 中使用循环来基于条件执行重复任务。条件在求值时通常返回 `true`\
    \ 或 `false`。循环将持续运行，直到指定的条件返回 `false`。\n\n### 不同类型的循环\n\nJavaScript 包含多种循环类型：\n\
    \n1.  For-循环 通过代码块执行多次。\n2.  For/in-循环 遍历对象的属性。\n3.  For/of-循环 遍历可迭代对象的值。\n4.\
    \  While-循环 当指定条件为真时，遍历代码块。\n5.  Do/while-循环 当指定条件为真时，也遍历代码块。\n\n### While 循环\n\
    \nJavaScript 循环被反复用于运行代码块，直到满足某些条件。当开发者考虑迭代或遍历，比如一个数组时，这与循环相同。JavaScript 提供了多种选项来重复运行代码块，如\
    \ `while`、`do while`、`for` 和 `for-in`。\n\n#### 示例\n\n```javascript\nvar sum =\
    \ 0;\nvar number = 1;\nwhile (number <= 50) {  // -- 条件\n  sum += number;    \
    \    // -- 循环体\n  number++;             // -- 更新器\n}\nalert(\"Sum = \" + sum);\
    \  // => Sum = 1275\n```\n\n首先评估条件。如果有效，将执行 `while` 语句后面的语句块。这将重复，直到条件不正确。由于它在执行代码块之前测试条件，因此被称为前测试循环。\n\
    \n`number++` 语句将被称为更新器。移除它将导致无限循环。你必须始终在循环中提供一个语句，以确保循环终止，否则你将遇到这个问题。\n\n### Do\
    \ While 循环\n\n```javascript\nvar sum = 0;\nvar number = 1;\ndo {\n  sum += number;\
    \        // -- 循环体\n  number++;             // -- 更新器\n} while (number <= 50);\
    \ // -- 条件\nalert(\"Sum = \" + sum);  // => Sum = 1275\n```\n\n首先执行 `do` 块，然后评估状态。如果\
    \ `while` 条件有效，将再次执行该块并重复，直到条件为假。由于条件在代码块执行后测试，因此被称为后测试循环。\n\n```javascript\n\
    do {\n    // 在循环体中从键盘读取一个字符\n} while (if ch === '0');    // => 如果输入 '0' 则终止循环\n\
    ```\n\n### For 循环\n\n```javascript\nvar sum = 0;\nfor (var i = 1; i <= 50; i++)\
    \ {\n    sum = sum + i;\n}\nalert(\"Sum = \" + sum);    // => Sum = 1275\n```\n\
    \n它由三个部分组成，用分号分隔。第一个是初始化器 (`var i = 1`)，它初始化循环，并且只在循环开始时执行一次。第二个是测试状态 (`i <= 50`)。当条件表达式求值为\
    \ `true` 时，执行循环体。当条件为真时，循环停止。第三个元素是更新器 (`i++`)，它在每次迭代后调用。通常，更新器会增加或减少循环计数器。\n\n\
    在 `for` 循环中，所有三个阶段，即初始化器、测试条件和更新器，都写在这样的一行中（称为迭代语句），而在 `while` 中它们是分散的，位于不同的位置。\n\
    \n### For In 循环\n\n```javascript\nvar student = { name:\"Bill\", age: 25, degree:\
    \ \"Masters\" };\nfor (var item in student) {\n    alert(student[item]);    //\
    \ => \"Bill\", 然后 25, 然后 \"Masters\"\n}\n```\n\n在每次迭代中，JavaScript 将属性的名称（字符串值）应用于变量对象。在上面的示例中，这些是：`name`、`age`\
    \ 和 `degree`。"
