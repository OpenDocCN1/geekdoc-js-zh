    \ 模块模式\n\n模块模式用于模拟类定义（因为JavaScript不原生支持类），以便能够在单个对象中存储公共和私有方法及变量——就像其他编程语言（如Java或Python）中的模块一样。它帮助我们创建一个公共API，同时维护一组私有的变量和方法。\n\
    \n## JavaScript Promises\n\nJavaScript中的异步操作是通过Promise完成的。多个异步操作可以轻松处理，而调用可能产生难以管理的代码。回调地狱。\n\
    \n在Promise之前，使用事件和回调函数，但功能有限，代码创建也受限。\n在处理异步操作时，事件效果不佳。\n\nPromise是管理异步操作最简单的方式。你可以轻松处理多个异步活动，并比调用和事件更好地管理错误。\n\
    \n## Promise的好处\n\n- 增强代码可读性\n- 更好地管理异步操作\n- 最佳的异步逻辑控制描述流\n- 有效处理错误\n\nPromise是一个承诺时未知值的符号。它使你能够将处理程序与异步操作的最终成功值或失败原因结合起来。这允许异步方法像同步方法一样返回值：异步方法返回一个承诺，承诺在未来提供值，而不是立即返回最终值。\n\
    \n## Promise有三种状态\n\n**Fulfilled:** Promise操作成功\n**Rejected:** Promise失败被拒绝\n\
    **Pending:** Promise仍在等待中，尚未被履行或拒绝。如果Promise不是pending状态（它已被接受或拒绝），则Promise已履行。\n\
    通常人们是果断和坚决的：他们不必犹豫。\n\n一旦Promise被履行，就不能重新部署。同样，调用resolve()或reject()不会产生任何效果。一个重要特性是已履行Promise的不可变性。\n\
    \n原生JavaScript的Promise不显示Promise状态。你应该将承诺视为一个黑盒。只有创建Promise的任务才能理解承诺状态或有权克服或拒绝。\n\
    \n## 可以使用Promise构造函数创建Promise\n\n- Promise构造函数只接受一个请求，一个函数回调。\n- 两个点，解析和拒绝函数回调。\n\
    - 在回调函数中执行操作，如果一切顺利则调用resolve。\n- 如果执行不顺利，则调用reject。\n\n```\nvar promise = new\
    \ Promise(function(resolve, reject) {\n  const x = \"geeksforgeeks\";\n  const\
    \ y = \"geeksforgeeks\"\n  if(x === y) {\n    resolve();\n  } else {\n    reject();\n\
    \  }\n});\n\npromise.\n    then(function () {\n        console.log('Success, You\
    \ are a GEEK');\n    }).\n    catch(function () {\n        console.log('Some error\
    \ has occured');\n    });\n```\n\n输出：Success you are a Geek\n\n## 1. Then( )\n\
    \n如果Promise被接受或拒绝，则调用Then()。\n\n## 参数\n\n- 如果Promise被履行并获得测试，则执行第一个任务。\n- 如果Promise被忽略并发生错误，则执行第二个任务。它是可选的，最好使用.catch()方法来查找错误。\n\
    \n## 示例：Promise已解决\n\n```\nvar promise = new Promise(function(resolve, reject)\
    \ {\n    resolve('Geeks For Geeks');\n})\n\npromise\n    .then(function(successMessage)\
    \ {\n        //成功处理函数被调用\n        console.log(successMessage);\n    }, function(errorMessage)\
    \ {\n        console.log(errorMessage);\n    })\n```\n\n输出：Geeks for Geeks\n\n\
    ## 示例：Promise被拒绝\n\n```\nvar promise = new Promise(function(resolve, reject) {\n\
    \    reject('Promise Rejected')\n})\n\npromise\n    .then(function(successMessage)\
    \ {\n        console.log(successMessage);\n    }, function(errorMessage) {\n \
    \       //错误处理函数被调用\n        console.log(errorMessage);\n    })\n```\n\n输出：Promise\
    \ Rejected\n\n## 2. CATCH()\n\n当Promise被拒绝或执行过程中发生错误时，调用catch()。\n\n## 示例：Promise被拒绝\n\
    \n```\nvar promise = new Promise(function(resolve, reject) {\n    reject('Promise\
    \ Rejected')\n})\n\npromise\n    .then(function(successMessage) {\n        console.log(successMessage);\n\
    \    })\n    .catch(function(errorMessage) {\n        //错误处理函数被调用\n        console.log(errorMessage);\n\
    \    });\n```\n\n输出：PROMISE REJECTED\n\n## 示例：Promise被拒绝\n\n```\nvar promise =\
    \ new Promise(function(resolve, reject) {\n    throw new Error('Some error has\
    \ occured')\n})\n\npromise\n    .then(function(successMessage) {\n        console.log(successMessage);\n\
    \    })\n    .catch(function(errorMessage) {\n        //错误处理函数被调用\n        console.log(errorMessage);\n\
    \    });\n```\n\n输出：SOME ERROR HAS OCCURRED\n\n## 3. FINALLY()\n\n通常，无论Promise是履行还是拒绝，你都想执行相同的代码。\n\
    例如：\n\n```\nfunction createApp() {\n    // ...\n}\n\nlearnJS\n    .then(\n   \
    \     (success) => {\n            console.log(success);\n            createApp();\n\
    \        }\n    ).catch(\n        (reason) => {\n            console.log(reason);\n\
    \            createApp();\n        }\n    );\n```\n\n如你所见，对于then()和catch()方法，对createApp()的调用是重复的。\n\
    你使用finally()方法来删除这种重复，并在Promise被履行或拒绝时执行createApp()：\n\n```\nlearnJS\n    .then(success\
    \ => console.log(success))\n    .catch(reason => console.log(reason))\n    .finally(()\
    \ => createApp());\n```\n\n## 应用：\n\n- 1. Promise用于异步处理错误\n- 2. Promise用于处理异步HTTP请求。"
