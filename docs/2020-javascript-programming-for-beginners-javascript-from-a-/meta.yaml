- md: "## ELSE STATEMENT EXAMPLE\n\n```javascript\nif (10 > 5) {\n    var outcome\
    \ = \"if block\";\n}\n\noutcome;\n\nOUTPUT\n\n\"if block\"\n```\n\nFor the case\
    \ above, that's what happening:\nThe keyword `if` says the conditional statement\
    \ should be started by JavaScript. `(10 > 5)` is a statistical condition that\
    \ is true — 10 is greater than 5 in this situation. That is the code block to\
    \ be run, which is the portion of curly braces `{}`. The variable `outcome` is\
    \ assigned the value `\"if block\"` as the condition passes.\n\n## ELSE STATEMENT\
    \ EXAMPLE\n\nThe `if` statement with an `else` statement, adding another block\
    \ to run if the conditional does not pass, may be expanded.\n\n```javascript\n\
    if (\"cat\" === \"dog\") {\n    var outcome = \"if block\";\n} else {\n    var\
    \ outcome = \"else block\";\n}\noutcome;\n\nOUTPUT\n\n\"else block\"\n```\n\n\
    In the above case, `\"cat\"` and `\"dog\"` are not identical, so that the other\
    \ block is run and that the result of the variable is `\"else block\"`.\n\n##\
    \ ELSE IF STATEMENT EXAMPLE\n\nYou can also extend a declaration `if` with another\
    \ declaration an `else if` which adds another conditional on its block.\n\n```javascript\n\
    if (false) {\n    var outcome = \"if block\";\n} else if (true) {\n    var outcome\
    \ = \"else if block\";\n} else {\n    var outcome = \"else block\";\n}\n\noutcome;\n\
    \nOUTPUT\n\n\"else if block\"\n```\n\nYou may use multiple `if else` conditionals,\
    \ but note that the first `else if` block is going run. After running the first\
    \ one which passes, JavaScript skips all remaining conditions.\n\n## JAVASCRIPT\
    \ FUNCTIONS\n\nA JavaScript function is a code block designed to accomplish a\
    \ particular task. When anything expresses it (calls it), a JavaScript function\
    \ is executed.\n\n## DEFINING FUNCTIONS\n\nA function description (also called\
    \ a function declaration, or function statement) contains of the keyword `function`\
    \ followed by:\n- The title of the function.\n- A list of function parameters,\
    \ surrounded in parentheses and separated by commas.\n- The statements of JavaScript\
    \ which define the function, included in curly brackets, `{...}`\n\nExample, this\
    \ code defines a `square` to refer to a function that generates a square of a\
    \ given number:\nA function may have multiple parameters or no parameters or anything.\
    \ In the following example, `makeNoise` does not list any names for the parameters,\
