    \ async 函数。\n\n## ASYNC-AWAIT\n\n我们都认识到 Javascript 是同步的，这意味着它有一个事件循环来排队一个操作，该操作在代码结束该操作后一段时间才会完成。但在我们的软件中，有许多功能使我们的代码异步。其中之一就是\
