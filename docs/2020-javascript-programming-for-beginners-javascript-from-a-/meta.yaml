    \n## ARGUMENTS 对象\n\n所有 JavaScript 函数都以参数值开始。每个参数的值都包含在一个 `arguments` 变量中。\n`arguments`\
    \ 对象是一个类数组对象。使用类数组索引来访问其值。但是，不支持数组方法。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
