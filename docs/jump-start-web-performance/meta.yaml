  - "[PAGE 60]\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <title>My page</title>\n\n  <!-- preload script -->\n  <link rel=\"\
    preload\" href=\"script.js\" as=\"script\" />\n\n  <link rel=\"stylesheet\" href=\"\
    styles.css\" />\n</head>\n<body>\n\n  <h1>My page</h1>\n  <p>Lots of content...</p>\n\
    \n  <!-- load script (may be ready) -->\n  <script src=\"script.js\"></script>\n\
    \n</body>\n</html>\n```\n\nThe larger the HTML page, the greater the preloading\
    \ benefit.\n\nThe optional `as` attribute allows the browser to prioritize and\
    \ cache assets more effectively. That is, a script is downloaded before a video\
    \ because it's more critical to the page's operation. Permitted values are:\n\n\
    +   - **audio** : an audio file used in an `<audio>` element\n- **document** :\
    \ an HTML document embedded in a `<frame>` or `<iframe>`\n- **embed** : a resource\
    \ embedded inside an `<embed>` element\n- **fetch** : a URL required by an Ajax\
    \ fetch or XHR request\n- **font** : a font file\n- **image** : an image file\n\
    - **object** : a resource embedded in an `<object>` element\n- **script** : a\
    \ JavaScript file\n- **style** : a CSS style sheet\n- **track** : a video subtitle\
    \ WebVTT file\n- **video** : a video file used in a `<video>` element"
  - '[PAGE 61]


    +   - `worker`: a JavaScript web worker or shared worker


    A further optional `type` attribute defines the resource''s MIME type, so the
    browser can make further optimizations or avoid downloading unsupported assets.
    For example:


    ```

    <link rel="preload" href="video.mp4" as="video" type="video/mp4" />

    ```


    > **Other Attributes and an API**


    The `prefetch` attribute is similar to `preload`, except that it''s intended to
    fetch resources that will be in the next navigation/page load. Browsers give `prefetch`
    a lower priority.


    Similarly, `prerender` can be used to render a specified web page in the background.
    Since this potentially wastes bandwidth, browsers often limit processing and memory
    use.


    The `dns-prefetch` attribute can be used to resolve a domain name to an IP address
    before resources are requested, while `preconnect` establishes a connection to
    a server.


    Finally, look out for `Portals`, which renders a page in the background and allows
    the user to instantly navigate to it. The technology is new and yet to be fully
    implemented in any browser.


    # Remove Unused Assets


    Features will be added and dropped as your website or application evolves. Unfortunately,
    it''s easy to leave stray, unused resources lingering in the codebase, which negatively
    affects performance. Easier assets to remove include:


    +   - CMS plugins. Disable or delete CMS (WordPress) plugins you''re no longer
    using.'
  - '[PAGE 62]


    Unused fonts, weights, and styles. Try removing suspicious fonts and retest the
    site. This can improve page weight by several hundred kilobytes, and critical
    fonts will normally fall back to reasonable alternatives.


    Unused CSS and JavaScript. Check that any removed HTML components have their associated
    styles and functionality deleted.


    Duplicate dependencies. Make sure you aren''t including similar assets more than
    once. This can be an issue in a CMS where different plugins use slightly different
    versions of Bootstrap or jQuery.


    # Code for Specific Pages


    Consider removing code from pages that don''t use a particular feature. For example,
    if a page doesn''t require a carousel, its styles and functionality could be omitted.


    This is less beneficial when concatenated CSS and JavaScript files have been downloaded
    and cached in the browser. These would contain unnecessary code for that page,
    but providing a smaller alternative would incur a further download. Analyze your
    code to determine what could offer the best performance:


    +   1. A single, concatenated file served to every page that can be cached on
    first use.

    2. Multiple source files served over HTTP/2.

    3. A compromise solution, such as core styles loaded on every page, plus article
    styles used on news pages, pagination styles used on search results, and so on.


    # Assess Analytics Performance


    Site owners should be given an easy way to measure page views, journey flows,
    and feature usage. Tracking via server access logs is possible, but richer statistics
    are normally available using client-side systems such as Google Analytics. These
    systems may be free to use, but can have a negative impact on page performance.
    Try temporarily removing all analytics code from your site to assess'
