    tools

    3. as a [Node.js module](https://www.npmjs.com/package/lighthouse), through which
    command-line and automated tests can be executed


    It’s easiest to start with Chrome’s DevTools. Navigate to any page in Chrome,
    press `Ctrl|Cmd + Shift + I` or `F12` to open the DevTools panel, and click the
    **Audits** tab:'
