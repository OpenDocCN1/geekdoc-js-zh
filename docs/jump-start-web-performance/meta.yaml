    本书为提升网站性能提供建议、技巧和最佳实践。\n\n## 谁应该阅读本书？\n\n后续章节描述的性能优化选项，范围从快速的五分钟配置更改，到重大的网站改造。我们主要关注前端活动和服务器配置，以优化交付给浏览器的代码。\n\
