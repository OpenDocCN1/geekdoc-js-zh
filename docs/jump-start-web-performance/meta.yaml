  md: "# # Check the Save-Data Header\n\nThe `Save-Data` field is an HTTP request\
    \ header indicating that reduced data usage is preferred. It's named **Lite mode**\
    \ in Chrome and can be enabled or disabled by the user.\n\nWhen enabled, the `Save-Data`\
    \ header is sent with every browser request. For example:\n\n```\nGET /image.jpg\
    \ HTTP/1.0\nHost: example.com\nSave-Data: on\n```\n\nA server can respond accordingly\
    \ when `Save-Data` is detected. For example, it can respond by:\n\n+   - reducing\
    \ the volume of HTML content—such as returning 100 rows of table data rather than\
    \ 500\n- providing low-resolution versions of an image even when high-resolution\
    \ options are requested\n- removing non-essential JavaScript such as trackers\
    \ or advertising scripts\n\nTo ensure the minimal content is not cached and reused\
    \ after the user disables `Save-Data`, the server should set the following header\
    \ in the HTTP response:\n\n```\nVary: Accept-Encoding, Save-Data\n```\n\nThe `Save-Data`\
    \ header can also be detected using client-side JavaScript:\n\n```\nif ('connection'\
    \ in navigator && navigator.connection.saveData) {\n  // Save-Data enabled\n}\n\
    ```\n\nAn optimum solution could presume data-saving by default, but add a `full-data`\
    \ class to the HTML element when the header is *not* enabled:"
