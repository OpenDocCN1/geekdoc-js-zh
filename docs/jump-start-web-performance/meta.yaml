    An element, image, or background image can be manipulated using CSS3 effects rather
    than having to create multiple variations. For example:


    +   - The clip-path and mask properties can partially or fully hide parts of an
    image or element to create non-rectangular shapes.

    - The shape-outside, shape-margin, and shape-image-threshold properties can be
    used to define non-rectangular text flows around or within an element.

    - The transform property can rotate, scale, and skew an element.

    - The filter property offers possibilities such as blurring, brightness, contrast,
    hue rotation, inversion, saturation, grayscale, sepia, opacity, and shadows.

    - Both background-blend-mode and mix-blend-mode control how backgrounds and images
