  md: "# Consider Image Sprites\n\nOften-used images can be packaged into a single\
    \ **sprite** file so individual items can be accessed in CSS. This is an old optimization\
    \ technique, but it continues to offer advantages:\n\n+   1. A single HTTP request\
    \ is required for many images (although this is less beneficial with HTTP/2).\n\
    2. A single image will normally result in a smaller overall file size than the\
    \ total weight of the individual images.\n3. All referenced images appear instantly\
    \ after the sprite has loaded.\n\nThe following image defines five 64x64px icons\
    \ in a single 320x64px 24-bit PNG:\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_90_0.png)\n\
    \nBackground position offsets are then defined in CSS:\n\n```\n.sprite {\n  width:\
    \ 64px;\n  padding: 64px 0 10px 0;\n  text-align: center;\n  background: url(\"\
    browser-sprite.png\") 0 0 no-repeat;\n}\n\n.sprite.edge { background-position:\
    \ -64px 0; }\n.sprite.firefox { background-position: -128px 0; }\n.sprite.opera\
    \ { background-position: -192px 0; }\n.sprite.safari { background-position: -256px\
    \ 0; }\n```\n\nIndividual images can then be referenced in HTML using class names:"
