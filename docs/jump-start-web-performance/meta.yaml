    \ assets\n-   a screen reader or older device is used"
  mdcn: "\n## 前言\n\n尽管每天都在和网络打交道，但很少有开发者对自己创造的这个“怪物”有好评。充斥着网页空间的，是令人痛苦地缓慢的网站、烦人的叠加层、Cookie协议、即时通知和侵入式广告。\n\
