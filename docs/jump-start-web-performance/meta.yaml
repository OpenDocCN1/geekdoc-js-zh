    Performance monitoring can help discover problems when specific actions are performed
    in a site or app. However, it may become necessary to profile JavaScript execution
    by logging messages to the console when events occur. Modern browsers support
    various [Performance Timing APIs](https://developer.mozilla.org/en-US/docs/Web/API/Performance_Timing_API)
    that can help to analyze code.


    # performance.now()


    _performance.now()_ returns the elapsed time in milliseconds since the page was
    loaded. Unlike `Date.now()`, it returns a floating-point number representing fractions
    of a millisecond:


    ```

    let t0 = performance.now();

    doSomething();

    let t1 = performance.now();

    console.log(`doSomething() executed in ${ t1 - t0 }ms`);

    ```


    # Performance Marks and Measures


