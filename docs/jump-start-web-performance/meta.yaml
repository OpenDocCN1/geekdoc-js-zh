  - "[PAGE 88]\n\noptimization clean-up in <u>svgo</u> or <u>SVGOMG</u>.\n\nThere\
    \ are three primary ways to add an SVG to a web page. Choose the most appropriate\
    \ option for each graphic you're using.\n\n# 1. Add SVGs Using an <img> Tag\n\n\
    The SVG acts like any normal image: it can be cached and reused on other pages.\n\
    \nFor security reasons, browsers will disable embedded scripts, links, and other\
    \ types of interactivity. Some browsers won't apply style sheet rules defined\
    \ in a separate CSS file.\n\nThe lesser-used `<object>`, `<embed>`, and `<iframe>`\
    \ elements can circumvent these restrictions, but the browser treats the image\
    \ as another document, so performance could be affected.\n\n# 2. Add SVGs as CSS\
    \ Background Images\n\nAn SVG can be referenced as a URL in a background image:\n\
    \n```\n.mysvgbackground {\n    background-image: url('image.svg');\n}\n```\n\n\
    It can also be embedded inline:\n\n```\n.mysvgbackground {\n    background-image:\
    \ url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/\\nsvg\" viewBox=\"\
    0 0 800 600\"><circle cx=\"400\" cy=\"300\" r=\"50\" stroke-width=\"5\"\\nstroke=\"\
    #f00\" fill=\"#ff0\" /></svg>');\n}\n```\n\nLike `<img>`, the browser will block\
    \ embedded scripts, links, and other SVG interactions, but backgrounds can be\
    \ useful for regularly used icons."
  - "[PAGE 89]\n\n> Inline Data for Larger Images\nInline data should be avoided for\
    \ larger images, especially when regular changes will invalidate the whole style\
    \ sheet cached in the browser.\n\n# 3. Embed SVGs into the Page\n\nAn SVG can\
    \ be embedded directly into the HTML:\n\n```\n<body>\n  <svg class=\"mysvg\" xmlns=\"\
    http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n    <circle cx=\"400\"\
    \ cy=\"300\" r=\"50\" />\n  </svg>\n</body>\n```\n\nThe SVG nodes become part\
    \ of the DOM and can be styled or animated directly using CSS:\n\n```\ncircle\
    \ {\n  stroke-width: 1em;\n}\n\n.mysvg {\n  stroke-width: 5px;\n  stroke: #f00;\n\
    \  fill: #ff0;\n}\n```\n\nThis reduces SVG code weight by reusing CSS styles,\
    \ and it offers additional flexibility such as alternative colors, hover effects,\
    \ animation of specific elements, and so on.\n\nUnfortunately, the SVG must be\
    \ embedded into every page where it's required. This will increase HTML weight,\
    \ so embedding is generally best for small or infrequently used SVGs."
- md: "## Consider Image Sprites\n\nOften-used images can be packaged into a single\
    \ **sprite** file so individual items can be accessed in CSS. This is an old optimization\
    \ technique, but it continues to offer advantages:\n\n1.  A single HTTP request\
    \ is required for many images (although this is less beneficial with HTTP/2).\n\
    2.  A single image will normally result in a smaller overall file size than the\
    \ total weight of the individual images.\n3.  All referenced images appear instantly\
    \ after the sprite has loaded.\n\nThe following image defines five 64x64px icons\
    \ in a single 320x64px 24-bit PNG:\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_90_0.png)\n\
    \nBackground position offsets are then defined in CSS:\n\n```\n.sprite {\n  width:\
    \ 64px;\n  padding: 64px 0 10px 0;\n  text-align: center;\n  background: url(\"\
    browser-sprite.png\") 0 0 no-repeat;\n}\n\n.sprite.edge { background-position:\
    \ -64px 0; }\n.sprite.firefox { background-position: -128px 0; }\n.sprite.opera\
    \ { background-position: -192px 0; }\n.sprite.safari { background-position: -256px\
    \ 0; }\n```\n\nIndividual images can then be referenced in HTML using class names:\n\
    \n```\n<div class=\"sprite chrome\">Chrome</div>\n<div class=\"sprite edge\">Edge</div>\n\
    <div class=\"sprite firefox\">Firefox</div>\n<div class=\"sprite opera\">Opera</div>\n\
    <div class=\"sprite safari\">Safari</div>\n```\n\nThe result:\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_91_0.png)\n\
    \n4-10. The rendered sprite icons\n\nImage sprites can be generated in a graphics\
    \ package, using tools such as [SpriteCow](https://www.spritecow.com/) or [Instant\
    \ Sprite](http://instantsprite.com/), or in your build process.\n\n## Consider\
    \ OS Fonts\n\nIt's possible to add dozens of fonts to a page ... but that doesn't\
    \ mean you should!\n\n1.  Designers recommend [using fonts sparingly](using fonts\
    \ sparingly), with one or two typefaces per document.\n2.  A custom font typically\
    \ requires a few hundred kilobytes of data. The more you add, the larger the page\
    \ weight, and the worse the performance.\n3.  The days of every site using standard\
    \ OS fonts are over. Perhaps Helvetica, Times New Roman, or Comic Sans would look\
    \ good on your site?!\n\nUsing an OS font provides a noticeable performance boost;\
    \ there's no download delay or flash of unstyled or invisible text.\n\nEach platform\
    \ supplies different default fonts, but fallbacks can be specified as well as\
    \ the generic font family names of serif, sans-serif, monospace, cursive, fantasy,\
    \ and system-ui. For example:\n\n```\nbody {\n  font-family: Arial, Helvetica,\
    \ sans-serif;\n}\n```\n\nWeb apps may also feel more native if they use a standard\
    \ system font. The following stack implemented on GitHub.com targets system fonts\
    \ available across all popular platforms:\n\n```\nbody {\n  font-family: -apple-system,\
    \ BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica,\n  Arial, sans-serif, \"\
    Apple Color Emoji\", \"Segoe UI Emoji\", \"Segoe UI Symbol\";\n}\n```\n\nSimilar\
    \ variations are used by Medium.com and the WordPress administration panels:\n\
    \n```\nbody {\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\"\
    , Roboto, Oxygen-Sans, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif;\n}\n\
    ```\n\nAlternatively, the CSS `@font-face` `local()` function can be used to locate\
    \ a font on the user’s system first, but load from a URL when it can’t be found:\n\
    \n```\n@font-face {\n    font-family: MyHelvetica;\n    src: local(\"Helvetica\
    \ Neue\"),\n         local(\"HelveticaNeue\"),\n         url(\"/fonts/Helvetica-webfont.woff2\"\
    ) format(\"woff2\"),\n         url(\"/fonts/Helvetica-webfont.woff\") format(\"\
    woff\");\n}\n```\n\nAn OS font should be your first choice if it closely matches\
    \ branding requirements.\n\n## Embed Web Fonts with <link>\n\nMany designers will\
    \ be horrified by the suggestion of using OS fonts, so web font use is inevitable.\
    \ The most popular option is to use a repository that serves fonts from a CDN.\
    \ Popular options include:\n\n-   Google Fonts: [fonts.google.com](https://fonts.google.com)\n\
    -   Font Library: [fontlibrary.org](https://fontlibrary.org)\n-   Adobe Edge:\
    \ [edgewebfonts.adobe.com](https://edgewebfonts.adobe.com)\n\nWhere possible,\
    \ load fonts using a `<link>` in your HTML `<head>`. For example:\n\n```\n<link\
    \ href=\"https://fonts.googleapis.com/css?family=Open+Sans\" rel=\"stylesheet\"\
    >\n```\n\nThis downloads the font in parallel with other fonts and style sheets.\n\
    \nA CSS `@import` method may be offered by the repository, but this blocks processing\
    \ of the style sheet until the font has been downloaded and parsed.\n\n## Limit\
    \ Font Styles and Text\n\nOnly request the fonts, weights, and styles you require—and\
    \ definitely remove *any fonts you aren’t using!*\n\nHere’s an example of two\
    \ Google Font URLs:\n\n-   https://fonts.googleapis.com/css?family=Inconsolata:500,700\n\
    -   https://fonts.googleapis.com/css?family=Roboto:bolditalic\n\nBoth fonts can\
    \ be contained in a single URL:\n\n-   https://fonts.googleapis.com/css?family=Inconsolata:500,700|Roboto:bolditalic\n\
    \nIn some cases, you may only need specific characters—perhaps for a regularly\
    \ used title or logo. The text “Hello” requires just four characters from a specific\
    \ font:\n\n-   https://fonts.googleapis.com/css?family=Inconsolata&text=Helo\n\
    \nFinally, you could benefit from hosting the fonts locally or [using more popular\
    \ fonts](https://fonts.google.com/) that have a higher chance of being pre-cached\
    \ in the user’s browser.\n\n## Use a Good Font-loading Strategy\n\nA web font\
    \ can take several seconds to download. The browser will choose one of two options:\n\
    \n1.  Show a **flash of unstyled text** (FOUT). The first available font fallback\
    \ is used immediately. It’s replaced by the web font once it’s loaded. This process\
    \ is used by IE, Edge 18 and below, and older editions of Firefox and Opera.\n\
    2.  Show a **flash of invisible text** (FOIT). No text is displayed until the\
    \ web font has loaded. This process is used in all modern browsers, which typically\
    \ wait three seconds before reverting to a fallback.\n\n## Jump Start Web Performance\n\
    \nEither option can be jarring and affect perceived performance.\n\nThe CSS font-display\
    \ property allows you to define the font-handling process. The options are:\n\n\
    -   **auto**: the browser's default behavior (usually FOIT).\n-   **block**: effectively\
    \ FOIT. The text may be invisible for up to three seconds. There's no font swap,\
    \ but text can't be read immediately.\n-   **swap**: effectively FOUT. The first\
    \ fallback is used until the web font is available. Text can be read immediately,\
    \ but the font swap effect may be jarring if not managed effectively.\n-   **fallback**:\
    \ a compromise between FOIT and FOUT. Text is invisible for a short period (typically\
    \ 100ms) then the first fallback is used until the web font is available. Text\
    \ is readable as the page loads, but the font swap can still be problematic.\n\
    -   **optional**: the same as fallback, except no font swapping occurs. The web\
    \ font will only be used if it's available within the initial period. The first\
    \ page view is likely to show a fallback font while the web font is downloaded\
    \ and cached. Subsequent page views will use the web font.\n\n> **Similar Web\
    \ and OS Fonts**\n>\n> optional could be a reasonable choice if the web and OS\
    \ fallback fonts are similar, but if that's the case, using an OS font throughout\
    \ would offer better performance!\n\nExample CSS:\n\n```\n@font-face {\n  font-family:\
    \ 'mytypeface';\n  src: url('mytypeface-webfont.woff2') format('woff2'),\n   \
    \    url('mytypeface-webfont.woff') format('woff');\n  font-weight: 500;\n  font-style:\
    \ normal;\n  font-display: swap;\n}\n```\n\nGoogle Fonts also provides a `display`\
    \ URL query string parameter. For example:\n\nhttps://fonts.googleapis.com/css?family=Inconsolata:500,700&display=swap\n\
    \n> \U0001F4A1 **Settings for Specific Text Types**\n>\n> Different text blocks\
    \ could use different `font-display` settings. For example, body text could use\
    \ `swap` (FOUT) so it can be read immediately, while menus and heading text use\
    \ `block` (FOIT).\n\nA pragmatic compromise could be considered, which uses a\
    \ fallback font with similar weights, line heights, and spacing to the web font.\
    \ `font-display: swap` (FOUT) can then be used, but the replacement effect is\
    \ less noticeable.\n\nA tool such as [Font Style Matcher](https://meowni.ca/font-style-matcher/)\
    \ can be used to find suitable fallback parameters."
  mdcn: "\n## 考虑使用图像精灵\n\n常用图像可以打包成单个**精灵**文件，以便在 CSS 中访问各个图像。这是一种较早的优化技术，但仍具有以下优势：\n\
    \n1.  许多图像只需一个 HTTP 请求（尽管在 HTTP/2 下此优势有所减弱）。\n2.  单个图像的总文件大小通常小于所有单独图像大小之和。\n\
    3.  精灵加载后，所有引用的图像会立即显示。\n\n下图定义了五个 64x64 像素的图标，包含在一个 320x64 像素、24 位的 PNG 图像中：\n\
    \n![](img/d93d5aab668f52eb84bb477fd9a96986_90_0.png)\n\n然后在 CSS 中定义背景位置偏移量：\n\n\
    ```\n.sprite {\n  width: 64px;\n  padding: 64px 0 10px 0;\n  text-align: center;\n\
    \  background: url(\"browser-sprite.png\") 0 0 no-repeat;\n}\n\n.sprite.edge {\
    \ background-position: -64px 0; }\n.sprite.firefox { background-position: -128px\
    \ 0; }\n.sprite.opera { background-position: -192px 0; }\n.sprite.safari { background-position:\
    \ -256px 0; }\n```\n\n随后在 HTML 中可以使用类名引用各个图像：\n\n```\n<div class=\"sprite chrome\"\
    >Chrome</div>\n<div class=\"sprite edge\">Edge</div>\n<div class=\"sprite firefox\"\
    >Firefox</div>\n<div class=\"sprite opera\">Opera</div>\n<div class=\"sprite safari\"\
    >Safari</div>\n```\n\n结果：\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_91_0.png)\n\
    \n4-10. 渲染后的精灵图标\n\n图像精灵可以通过图形软件包生成，使用诸如 [SpriteCow](https://www.spritecow.com/)\
    \ 或 [Instant Sprite](http://instantsprite.com/) 等工具，也可以在构建过程中生成。\n\n## 考虑使用系统字体\n\
    \n可以为页面添加数十种字体……但这并不意味着你应该这么做！\n\n1.  设计师建议[谨慎使用字体](using fonts sparingly)，每个文档使用一到两种字体。\n\
    2.  自定义字体通常需要几百千字节的数据。添加的字体越多，页面大小越大，性能越差。\n3.  每个网站都使用标准系统字体的时代已经过去了。也许 Helvetica、Times\
    \ New Roman 或 Comic Sans 在你的网站上看起来会不错？！\n\n使用系统字体可以显著提升性能；没有下载延迟，也不会出现无样式或不可见文本的闪烁。\n\
    \n每个平台都提供不同的默认字体，但可以指定后备字体以及通用字体族名称，如 serif、sans-serif、monospace、cursive、fantasy\
    \ 和 system-ui。例如：\n\n```\nbody {\n  font-family: Arial, Helvetica, sans-serif;\n\
    }\n```\n\n如果 Web 应用使用标准系统字体，可能会感觉更原生。以下在 GitHub.com 上实现的字体堆栈针对所有流行平台上可用的系统字体：\n\
    \n```\nbody {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\"\
    , Roboto, Helvetica,\n  Arial, sans-serif, \"Apple Color Emoji\", \"Segoe UI Emoji\"\
    , \"Segoe UI Symbol\";\n}\n```\n\nMedium.com 和 WordPress 管理面板使用了类似的变体：\n\n```\n\
    body {\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto,\
    \ Oxygen-Sans, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif;\n}\n```\n\n\
    或者，可以使用 CSS `@font-face` 的 `local()` 函数首先在用户系统中查找字体，如果找不到，则从 URL 加载：\n\n```\n\
    @font-face {\n    font-family: MyHelvetica;\n    src: local(\"Helvetica Neue\"\
    ),\n         local(\"HelveticaNeue\"),\n         url(\"/fonts/Helvetica-webfont.woff2\"\
    ) format(\"woff2\"),\n         url(\"/fonts/Helvetica-webfont.woff\") format(\"\
    woff\");\n}\n```\n\n如果系统字体与品牌要求紧密匹配，应将其作为首选。\n\n## 通过 <link> 嵌入网络字体\n\n许多设计师对使用系统字体的建议会感到震惊，因此网络字体的使用不可避免。最流行的选项是使用从\
    \ CDN 提供字体的仓库。热门选项包括：\n\n-   Google Fonts: [fonts.google.com](https://fonts.google.com)\n\
    -   Font Library: [fontlibrary.org](https://fontlibrary.org)\n-   Adobe Edge:\
    \ [edgewebfonts.adobe.com](https://edgewebfonts.adobe.com)\n\n如果可能，请在 HTML `<head>`\
    \ 中使用 `<link>` 加载字体。例如：\n\n```\n<link href=\"https://fonts.googleapis.com/css?family=Open+Sans\"\
    \ rel=\"stylesheet\">\n```\n\n这将与其他字体和样式表并行下载字体。\n\n仓库可能提供 CSS `@import` 方法，但这会阻塞样式表的处理，直到字体下载和解析完成。\n\
    \n## 限制字体样式和文本\n\n只请求你需要的字体、字重和样式——并务必移除*任何你未使用的字体！*\n\n以下是两个 Google Font URL\
    \ 的示例：\n\n-   https://fonts.googleapis.com/css?family=Inconsolata:500,700\n- \
    \  https://fonts.googleapis.com/css?family=Roboto:bolditalic\n\n两个字体可以包含在单个 URL\
    \ 中：\n\n-   https://fonts.googleapis.com/css?family=Inconsolata:500,700|Roboto:bolditalic\n\
    \n在某些情况下，你可能只需要特定字符——也许是为了常用标题或徽标。文本“Hello”只需要特定字体中的四个字符：\n\n-   https://fonts.googleapis.com/css?family=Inconsolata&text=Helo\n\
    \n最后，你可以从本地托管字体或[使用更流行的字体](https://fonts.google.com/)中受益，这些字体在用户浏览器中被预缓存的机会更高。\n\
    \n## 使用良好的字体加载策略\n\n网络字体可能需要几秒钟下载。浏览器将选择以下两种选项之一：\n\n1.  显示**无样式文本闪烁**（FOUT）。立即使用第一个可用的后备字体。一旦网络字体加载完成，它将被替换。此过程用于\
    \ IE、Edge 18 及以下版本，以及旧版 Firefox 和 Opera。\n2.  显示**不可见文本闪烁**（FOIT）。在加载网络字体之前不显示任何文本。此过程用于所有现代浏览器，通常在恢复到后备字体之前等待三秒钟。\n\
    \n## 启动 Web 性能\n\n无论哪种选项都可能令人不适，并影响感知性能。\n\nCSS 的 `font-display` 属性允许你定义字体处理过程。选项包括：\n\
    \n-   **auto**：浏览器的默认行为（通常是 FOIT）。\n-   **block**：实际上是 FOIT。文本可能不可见长达三秒。没有字体替换，但文本无法立即阅读。\n\
    -   **swap**：实际上是 FOUT。使用第一个后备字体，直到网络字体可用。文本可以立即阅读，但如果不有效管理，字体替换效果可能会令人不适。\n-\
    \   **fallback**：FOIT 和 FOUT 之间的折衷。文本在短时间内（通常 100ms）不可见，然后使用第一个后备字体，直到网络字体可用。页面加载时文本可读，但字体替换仍可能有问题。\n\
    -   **optional**：与 fallback 相同，但不会发生字体替换。仅当网络字体在初始时间段内可用时才会使用。首次页面访问可能显示后备字体，而网络字体正在下载和缓存。后续页面访问将使用网络字体。\n\
    \n> **类似的网络和系统字体**\n>\n> 如果网络和系统后备字体相似，`optional` 可能是一个合理的选择，但如果是这种情况，始终使用系统字体将提供更好的性能！\n\
    \n示例 CSS：\n\n```\n@font-face {\n  font-family: 'mytypeface';\n  src: url('mytypeface-webfont.woff2')\
    \ format('woff2'),\n       url('mytypeface-webfont.woff') format('woff');\n  font-weight:\
    \ 500;\n  font-style: normal;\n  font-display: swap;\n}\n```\n\nGoogle Fonts 也提供\
    \ `display` URL 查询字符串参数。例如：\n\nhttps://fonts.googleapis.com/css?family=Inconsolata:500,700&display=swap\n\
    \n> \U0001F4A1 **针对特定文本类型的设置**\n>\n> 不同的文本块可以使用不同的 `font-display` 设置。例如，正文文本可以使用\
    \ `swap`（FOUT），以便立即阅读，而菜单和标题文本可以使用 `block`（FOIT）。\n\n可以考虑一个务实的折衷方案，即使用与网络字体具有相似字重、行高和间距的后备字体。然后可以使用\
    \ `font-display: swap`（FOUT），但替换效果会不太明显。\n\n可以使用诸如 [Font Style Matcher](https://meowni.ca/font-style-matcher/)\
    \ 之类的工具来查找合适的后备参数。\n"
