- md: '## Chapter 3 Quick Snacks


    42 Jump Start Web Performance


    This chapter lists a selection of tasty yet simple, practical, and cost-effective
    performance solutions that can be implemented on any site within a few minutes.
    It’s best to read the following sections in order, since they start with simpler
    hosting and server settings before moving on to quick image, CSS, and JavaScript
    improvements.


    ## Consider Your Hosting Plan


    Hosting will affect the performance of your website or application. The range
    of choices and prices may be bewildering, but hosting services are segregated
    into four primary types.


    ## Shared Hosting


    Your website is hosted on a physical server alongside hundreds, if not thousands,
    of other sites. Each customer shares resources, so disk space, RAM, CPU time,
    and other facilities may be limited to ensure the server remains responsive.


    Pros:


    - They’re inexpensive, with services starting from a few dollars per month.

    - They offer fully managed backups, security, maintenance, and upgrades.

    - They may provide simple, one-click installations for CMS, forum, wiki and other
    applications.

    - They sometimes offer specialist expertise, such as WordPress management.

    - Technical support is often included in the price.


    Cons:


    - Servers may be over-sold, in which case performance and page load times can
    suffer.

    - A problem with another site can affect yours—such as high traffic, denial of
    service attacks, and so on.

    - Hardware failures can take your site offline for a considerable period.

    - It can be difficult to scale anything other than disk space or bandwidth.

    - Support expertise and response times will vary from host to host.


    ## Dedicated Server Hosting


    Your website is hosted on a physical server (or servers) which you own. The hardware
    is exclusively used by you, so it can be configured to your exact requirements.


    Pros:


    - You get fast performance, with little possibility of other sites affecting speed.

    - You have access to further resources such as RAM, disks, CPUs, and other servers
    can be added.


    Cons:


    - Unless the server is fully managed, skilled technical staff will be required
    to maintain server updates, backups, security, and so on.

    - Hardware failures can still occur.

    - They''re expensive—typically a few hundred dollars per month.


    ## Virtual Private Server (VPS) Hosting


    A VPS is your own remote virtual machine. It *feels* like a dedicated server,
    but is effectively a software emulation running on one or more real servers.


    Pros:


    - A VPS is quicker to set up and more affordable than a dedicated server.

    - It''s fast, flexible, and easier to scale.

    - It''s more robust: your server is just data that can be moved to or run from
    other hardware.


    Cons:


    - Resources are still shared and the host''s network can be swamped.

    - A VPS still requires skilled technical staff to maintain server updates, backups,
    security, and so on (unless you pay extra for a "managed" VPS).


    ## Cloud Hosting


    Cloud hosting comes in many different guises, but it normally abstracts the hardware
    infrastructure into a set of services that can be accessed on demand. For example,
    your web application may require server-side processing, a database, and file
    store services, which are provisioned separately. You could opt to use serverless
    functions, which implement an application as a series of small micro-services
    rather than as a single monolithic program.


    Pros:


    - It''s robust and reliable.

    - It offers scalability and flexibility, as resources can be instantly scaled
    up when demand increases.

    - It''s cost efficient, as you only pay for what you use.


    Cons:


    - Cloud hosting has a steep learning curve, with each host offering a different
    service, concepts, and terminology.

    - Costs can be extremely difficult to determine up front.

    - There''s vendor lock-in, as it can be more difficult to move away from bespoke
    services.

    - Support can be a costly extra service.


    ## Switch to a More Appropriate Hosting Option


    Performance will be affected as your site increases in popularity. Shared hosting
    plans are especially susceptible to surges in demand, such as links from Reddit,
    Hacker News, and so on. Your site could be blocked as soon as it reaches processing,
    storage, or bandwidth thresholds.


    Contact your host first, as they may be able to suggest options for switching
    your site to another service or platform. For example, [SiteGround](https://www.siteground.com)
    provides standard web hosting accounts where you can manually install a WordPress
    CMS. However, they also offer fully managed WordPress hosting in the US, UK, Europe,
    and Australia. Your site can be transferred for free to take advantage of application-specific
    performance optimizations such as caching, compression, minification, image optimization,
    and lazy loading.


    However, be aware that you''ll always be limited by your host''s infrastructure
    and location. For example, a European company should consider a US-based host
    if the majority of their clients are based in North America.


    > **CDNs to the Rescue**

    > The next section describes content delivery networks, which can offset the effects
    of physical server locations.


    ## Scale Resources


    Most hosting services provide scaling options to increase processor, memory, disk
    space, or bandwidth capacity. This is usually simpler with cloud and VPS hosting,
    which have less reliance on physical hardware. It may even be possible to move
    resources to alternative geographical locations.


    An additional monthly fee for extra resources will normally apply, although dedicated
    server providers can make a one-off charge. Some cloud services scale and charge
    according to demand, although there are often fixed-price elements such as disk
    space.


    ## Switch Hosts


    Switching hosts can have a positive impact on performance if your new host has
    a faster infrastructure based in a location closer to users. Improved hosting
    is unlikely to solve all your performance problems, but it can be a cost-effective
    solution for back-end speed issues.


    ## What to Look for in a New Host


    These are some performance-related features to look for in a new host:


    - a global infrastructure, or data centers geographically close to your main users

    - specialist support for applications you''re using, such as WordPress

    - HTTP/2 and simple SSL certificate installation

    - domain nameserver and DNS configuration

    - gzip and Brotli compression enabled

    - options for automatic minification, caching, and image optimization

    - attack detection and prevention

    - usage and speed reports

    - automated issue alerts

    - good, independent reviews

    - a knowledgeable and fast support service


    Don''t be swayed by worthless 99.9% up-time claims. Reputable hosts are reliable
    and those that aren''t won''t provide proof or guarantees. Besides, it still equates
    to nine hours of downtime per year, which will inevitably coincide with your product
    launch!


    ## Use a Content Delivery Network


    A content delivery network can provide a performance boost to any website by distributing
    the load and serving assets from locations geographically closer to users. If
    your site is hosted on servers in California, for example, and you don''t have
    a CDN, all users must connect to the server in California directly:


    ![](img/d93d5aab668f52eb84bb477fd9a96986_46_0.png)

    3-1. No CDN


    Using a CDN service allows a user from Australia to access assets from closer
    servers hosted in Melbourne:


    ![](img/d93d5aab668f52eb84bb477fd9a96986_46_1.png)

    3-2. Active CDN


    The response is faster, users are happier, and your hosting requirements may be
    reduced.


    You may already be using a CDN for static assets such as CSS or JavaScript frameworks.
    For example, jQuery can be referenced at `https://code.jquery.com/jquery-3.4.1.slim.min.js`
    in a `<script>` tag. This type of CDN offers several benefits:


    - Files are available on fast servers replicated across the globe.

    - Files are hosted on a domain other than your website''s, which increases the
    number of concurrent assets the browser can download.

    - Files may already be cached in the user''s browser, since many sites may reference
    that URL.


    Unfortunately, simple static-file CDNs can be frustrating to manage, and third-party
    scripts have performance, privacy, and security risks (see **Chapter 4**).


    More recently, CDN services have appeared that automatically proxy requests to
    your site. This usually requires your domain to point at the CDN''s name servers
    or set specific DNS records. The benefits of this include:


    - a faster, high-capacity infrastructure with more efficient delivery from many
    locations around the globe

    - high availability: a CDN can continue to deliver cached files even when a host''s
    server fails

    - improved SEO: Google rewards sites with faster response times

    - cheaper costs: adopting a CDN is likely to cost less than scaling server resources


    CDNs may provide additional services regardless of your host''s server facilities
    and limitations, such as:


    - SSL certificates for HTTPS encryption

    - load balancing, data compression, and the HTTP/2 protocol for faster transmission

    - automatic file minification, image optimization, video transcoding, and email'
