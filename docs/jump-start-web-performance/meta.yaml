    \ |\n| DOM Elements（DOM元素） | DOM元素的数量 |\n| Document Complete（文档完成） | 与[DOMContentLoaded](https://developer.mozilla.org/en-US/docs/Web/Events/DOMContentLoaded)事件相关的一组指标，此时HTML已完全加载，但其他资产（如图像和字体）可能仍在加载中\
    \ |\n| Fully Loaded（完全加载） | 与窗口[load](https://developer.mozilla.org/en-US/docs/Web/Events/load)事件相关的一组指标，此时所有页面资产已下载并渲染完成\
    \ |\n\n**Performance Review（性能评估）**面板显示关于文件压缩、浏览器缓存和CDN使用效率的信息。\n\n**Content Breakdown（内容细分）**面板按类型（HTML、CSS、JavaScript、图像等）提供了资产列表，包括请求数、大小、网络响应时间和渲染事件。\n\
    \n**Domains（域名）**面板显示了对页面和第三方域名（如CDN、字体库、分析工具、广告商、社交媒体小部件等）发出的请求数量和大小。\n\n**Processing\
    \ Breakdown（处理细分）**面板显示浏览器进程所花费的时间，包括加载、脚本执行、布局和绘制。\n\n**Screenshot（截图）**面板在特定时间点（如首个内容出现的时间、主图像显示的时间以及完全加载视图）显示帧和/或视频。\n\
    \n其他面板提供指向额外服务的链接，如图像优化器和域名请求地图。\n\n更多信息，请参考：\n\n- [WebPageTest文档](WebPageTest\
    \ documentation)\n- [精益网站，第三章](Lean Websites, Chapter 3)\n\n## WebPageTest API\n\
    \nWebPageTest提供了一个[REST API](REST API)，以便在构建过程中以编程方式自动执行测试或获取结果。\n\n测试限制为每天200次页面加载。用于评估缓存加载因素的重复视图也计为一次页面加载。开发者必须[申请API密钥](apply\
    \ for an API key)才能开始使用。\n\n通过请求一个URL来发起测试。在此示例中，对`mysite.com`进行了两次测试：\n\n```\n\
    http://www.webpagetest.org/runtest.php?k=my-api-key&url=mysite.com&runs=2&f=json\n\
    ```\n\n成功的请求会返回一个JSON响应，包含测试ID和一组结果URL：\n\n```\n{\n  \"data\": {\n    \"testId\"\
    : \"1234567890\",\n    \"ownerKey\": \"ceb6128dbf05e09a1969ad\",\n    \"jsonUrl\"\
