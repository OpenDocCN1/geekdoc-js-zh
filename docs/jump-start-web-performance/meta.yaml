    \ one or more of the following values in a space-separated list:\n\n- `none` :\
    \ containment is not applied.\n- `layout` : the internal layout of the element\
    \ is isolated from the rest of the page. Its content cannot have any effect on\
    \ ancestor elements.\n- `paint` : children of the element will not be displayed\
    \ outside its boundary. Any overflows will not be visible (similar to `overflow:\
