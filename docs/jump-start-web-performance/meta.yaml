  md: '# Be Wary of Expensive CSS Properties


    Not all CSS properties are created equally. Those that take longer to paint than
    others include:


    +   - border-radius

    - box-shadow

    - opacity

    - transform

    - filter

    - position: fixed


    This doesn’t mean you shouldn’t use them, but be wary of applying expensive effects
    to hundreds of elements, as it will affect rendering and scrolling performance.


    > **Keeping Selectors Simple**


    Try to simplify CSS selectors where possible. CSS performance improvements may
    be negligible, but simpler selectors are easier to maintain, reduce page weight,
    and have a better chance of working in older browsers.


    # Embrace CSS3 Animations


    Native CSS3 [transitions](https://developer.mozilla.org/en-US/docs/Web/CSS/transition)
    and [animations](https://developer.mozilla.org/en-US/docs/Web/CSS/animation) will
    always be faster and require less code than JavaScript-powered equivalents. It
    shouldn’t be necessary to add a library or framework for typical fade, show, hide,
    and move effects. Very old browsers may not support the properties, but CSS degrades
    gracefully, and users will rarely know they’re missing anything.


    JavaScript animations should only be considered when fine-grained control is required—such
    as for HTML5 games, interactive charts, <canvas> manipulation, and so on.'
