    \ 仍然会阻塞渲染，但阻塞时间更短，因为文件更小。页面可以更快地变得可用，因为每个组件是按顺序渲染的；在其余内容加载时，页面顶部就可以被查看。Web Components\
    \ 通常也采用类似的方法，它们将 CSS 封装在代码中。\n\n这种技术在内容决定布局（如 Flexbox 和表格）的模板中可能不太实用，因为在页面加载过程中，随着更多内容的出现，会更频繁地触发回流。基于\
    \ Grid 的页面布局通常更合适。\n\n[浏览器对渐进式渲染的处理方式存在一些差异](https://link)，但最坏的情况是浏览器会阻塞渲染，直到所有发现的\
    \ CSS 文件都加载完毕。这并不比在 `<head>` 中加载每个文件更差。\n\n渐进式渲染对于那些由不同组件组合构建的大型网站的各个页面可能会有所裨益。\n\
    \n## 使用服务器端渲染\n\n哪个过程更快？\n\n过程 1（JavaScript 框架通常采用）：\n\n1.  请求一个 URL。\n2.  用一个（基本）空的\
    \ HTML 文件进行响应。\n3.  下载并执行 JavaScript。\n4.  使用 Ajax 或类似技术根据 URL 获取内容。\n5.  将内容加载到页面主体中。\n\
    \n过程 2（传统方法）：\n\n1.  请求一个 URL。\n2.  用完整的 HTML 进行响应。\n\n对于初始页面加载，服务器端渲染总是更快。\n\n\
    在过程 1 中，加载第二个页面可能更快，因为它可以从第 4 步开始。样式表、JavaScript 和图像等资源可能已经可用并被解析。不幸的是，很大一部分访问者可能只查看单个页面，而且由于需要更大量的\
    \ JavaScript，载荷会更高。\n\n这是一个性能更好的过程：\n\n1.  请求一个 URL。\n2.  直接从服务器将 HTML 加载到浏览器中。\n\
    3.  下载并执行 JavaScript。可能需要一些 *重新水合* 来使用 HTML 数据初始化组件。\n4.  使用 Ajax 或类似技术根据 URL\
    \ 导航变化获取和填充内容。\n\n这可能更难以管理，因为并非所有 JavaScript 框架都提供使用 Node.js、PHP、Ruby、Python 等的服务器端渲染功能。\n\
    \n## 你是否需要 JavaScript 或 CSS 框架？\n\nCSS 和/或 JavaScript 框架可以为在大型网站或应用程序上工作的团队提供良好的开发结构。然而，大多数是通用工具：它们提供一系列你可能不需要或可能需要适应的功能。优化性能通常很困难，因为核心代码不受你控制。\n\
    \n虽然框架对于原型设计肯定有用，但总要质疑它对于最终网站或应用程序是否必要。它增加了多少负担？它会提高性能吗？它可以轻松更新吗？当它最终被放弃时会发生什么？\n\
    \n花时间研究这些选择。不进行调查，每个应用程序在理解特定“锤子”的开发者眼中都像一颗钉子。你当然应该避免使用多个框架——可能的例外是服务器端选项，或像 [Svelte](https://svelte.dev/)\
    \ 这样的编译器，它们会将自己从生产代码中移除。\n\n即使你选定了一个框架，也可能存在模块化或轻量级的替代方案，例如用 [Preact](https://preactjs.com/)\
    \ 代替 React，或用 [bling.js](https://github.com/ryanmcdermott/bling.js) 代替 jQuery。\n\
    \n最终，最高效和适应性最强的框架将是专门为你的应用程序编写的框架。\n\n## 使用静态站点生成器\n\n大多数人通过创建（静态的）HTML、CSS，可能还有\
    \ JavaScript 文件开始 Web 开发。生成的资源可以托管在任何地方，并且速度很快，因为它们不使用服务器端或客户端处理。\n\n主要的缺点是内容管理：添加一个新页面可能涉及更改网站中每个页面的硬编码导航菜单。此时，开发者通常会转向服务器端语言或数据库驱动的\
    \ CMS，这两者都有各自的挑战。\n\n如果你可以创建一个快速的静态网站，但当添加或删除内容时能以编程方式跨站点更改，那会怎样？这正是 **静态站点生成器**\
    \ 的工作。它获取内容——通常定义在 markdown 文件中——并构建一组静态网页。构建过程可以构建菜单、导入图像、生成样式等，并且可以在任何内容更改时重新运行。生成的网站与服务器解耦，通常被称为使用\
    \ **JAMstack**：JavaScript、API 和标记语言。\n\n大多数静态站点生成器构建一组基于文件夹的 HTML 文件及相关资源，这些可以上传到任何能够提供静态内容的\
    \ Web 服务器。基于 Ruby 的 [Jekyll](https://jekyllrb.com/) 是最早的静态站点生成器之一，但 [StaticGen.com](https://www.staticgen.com/)\
    \ 列出了几十种适用于各种语言的替代方案。[Gatsby](https://www.gatsbyjs.org/) 等选项还会创建基于 React 的 JavaScript\
    \ 应用程序，而不仅仅是 HTML 文件。*（这是否是个优点另当别论！）*\n\n静态网站可以提供最佳的网站性能，因为它只渲染一次，然后原样交付给所有用户。没有服务器端依赖，可靠性提高，版本控制容易，并且可以消除安全问题。\n\
    \n也存在一些缺点：\n\n- 配置和设置需要时间，并且比 CMS 更困难\n- 静态站点生成器很少适合非技术编辑\n- 没有用户角色或权限的概念\n- 网站一致性可能更难强制执行，因为编辑可以添加任何客户端代码\n\
    - 重新构建过程可能很慢，尤其是在较大的网站上\n\n静态站点生成器非常适合变化相对不频繁的网站，但许多问题可以通过从无头 CMS 导入数据或自动化构建过程来克服。\n\
    \n## 使用构建系统\n\n即使是最尽责的开发者也可能忘记压缩 CSS 文件、优化图像或移除调试用的 `console` 语句。无论你使用什么技术来创建网站或应用程序，**构建过程**\
    \ 可以自动执行平凡的任务，以确保没有疏忽。此外，它们可以运行测试、验证代码并部署到预发布或生产服务器。\n\n创建一个构建过程可能需要一两天时间，但从长远来看应该能节省时间。流行的通用构建工具包括\
    \ [Gulp.js](https://gulpjs.com/)、[Grunt.js](https://gruntjs.com/)、[Broccoli.js](http://broccolijs.com/)\
    \ 和 [Brunch](https://brunch.io/)，它们允许你在文件更改时手动定义和运行任务。\n"
