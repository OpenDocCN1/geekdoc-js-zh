    \ a site can only be viewed by those with a recent device on a fast connection.\n\
    \nWould your revenues increase if more people could access your service? Are you\
    \ considering explosive web growth in markets such as Asia, Africa, and South\
    \ America, where smartphone and network capacity may be more limited?\n\n### Excuse\
