  md: '# What to Look for in a New Host


    These are some performance-related features to look for in a new host:


    +   - a global infrastructure, or data centers geographically close to your main
    users

    - specialist support for applications you''re using, such as WordPress

    - HTTP/2 and simple SSL certificate installation

    - domain nameserver and DNS configuration

    - gzip and Brotli compression enabled

    - options for automatic minification, caching, and image optimization

    - attack detection and prevention

    - usage and speed reports

    - automated issue alerts

    - good, independent reviews

    - a knowledgeable and fast support service


    Don''t be swayed by worthless 99.9% up-time claims. Reputable hosts are reliable
    and those that aren''t won''t provide proof or guarantees. Besides, it still equates
    to nine hours of downtime per year, which will inevitably coincide with your product
    launch!


    # Use a Content Delivery Network


    A content delivery network can provide a performance boost to any website by distributing
    the load and serving assets from locations geographically closer to users. If
    your site is hosted on servers in California, for example, and you don''t have
    a CDN, all users must connect to the server in California directly:'
