    support newer standards](https://caniuse.com/brotli).


    > ### CDNs and Asset Compression

    A CDN can implement asset compression even if it''s not enabled on your primary
    server.


    # Activate HTTP/2


    [HTTP/2](https://en.wikipedia.org/wiki/HTTP/2) improves upon the HTTP transmission
    protocol originally devised by Sir Tim Berners-Lee when he invented the Web in
    1989. HTTP/2 reduces latency by:'
