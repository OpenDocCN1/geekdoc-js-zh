    # Are Videos Necessary?


    Videos can offer an engaging experience. Few do, yet they have a higher bandwidth
    and performance cost than any other web asset. Here are some recommendations:


    +   1. Do you really need to show that tedious CEO presentation to every visitor?
    Remove all media assets where possible.

    2. Ensure the video is as short as possible, removing scenes where practical.

    3. Transcode the video into multiple formats using the minimum dimensions with
    optimal compression. Many video CDNs and services will handle this for you.

    4. Only play the video on demand—not as the user accesses the page (see Chapter
    4).


