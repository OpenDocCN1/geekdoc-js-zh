  - "[PAGE 123]\n\nDrop support for browsers without ES6 support (primarily IE). Your\
    \ site or application can remain usable if you adopt server-side rendering and\
    \ progressive enhancement techniques.\n\n# Modify the DOM Effectively\n\nSome\
    \ modern JavaScript frameworks implement a virtual DOM. As you change page elements,\
    \ the virtual DOM works out what’s been altered and determines how and when to\
    \ make modifications. Ultimately, it must still change the real DOM, and you can\
    \ make similar optimizations to improve performance without the additional overhead\
    \ of virtual DOM calculations.\n\n# Cache Regularly Used Nodes\n\nRegularly used\
    \ DOM nodes should be stored as JavaScript variables so they don't need to be\
    \ re-fetched. The DOM references are retained even when other tree nodes are modified:\n\
    \n```\nconst\n    main    = document.getElementsByTagName('main')[0],\n    heading\
    \ = main.querySelector('h1'),\n    tables  = main.getElementsByTagName('table');\n\
    ```\n\n> ## Search from Any Node\n\nRather than searching the whole tree from\
    \ `document`, many DOM methods allow you to start from any node. The example above\
    \ searches for the first heading and tables within the `<main>` element.\n\n`querySelector()`\
    \ and `querySelectorAll()` can find elements using jQuery-like CSS selectors.\
    \ They're usually slower than `getElementById()`, `getElementsByTagName()` and\
    \ `getElementsByClassName()`, although the speed difference is unlikely to affect\
