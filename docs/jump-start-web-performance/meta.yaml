    # Use JavaScript Sparingly


    If a browser can do something in HTML and/or CSS alone, that should be your preferred
    option. You can still apply progressive enhancements where necessary (discussed
    below).


    Modern browsers have implemented many regularly used features that previously
    required scripting, such as form validation, field auto-complete, animations,
    video, expanding text, modal dialogs, and more. There will be challenges—ask anyone
    who''s ever tried styling a `<select>` drop-down—but using a native feature will
    always be faster and use less code.


    Consider the choice of using an HTML `<button>` verses a `<div>` as a form submit.
    The HTML code starts in a similar way:


    ```

    <button>submit</button>

    ```


    Styling a DIV in CSS may be easier:


    ```

    <div class="button">submit</div>

    ```


    However, the HTML `<button>` :


    +   1. offers default styling to look like an OS button

    2. works on all browsers even when CSS or JavaScript fails

    3. works immediately, as the page loads and before JavaScript has started executing

    4. will automatically submit its parent `<form>` (if validity checks pass)

    5. can be operated with a mouse, touch screen, keyboard, or any other input device'
