  md: "# Play Audio and Video on Demand\n\nAuto-playing media saps bandwidth, degrades\
    \ performance, and is unlikely to be appreciated by users. Modern browsers will\
    \ also block or silence auto-playing by default.\n\nIn most cases, it's preferable\
    \ to show a thumbnail image—perhaps with a *play* icon overlay—which the user\
    \ can click to start the media. Both the `<video>` and `<audio>` elements support\
    \ this feature with the following attributes:\n\n+   - `autoplay=\"false\"` to\
    \ stop auto-playing\n- `preload=\"none\"` to prevent media preloading or `preload=\"\
    metadata\"` to fetch meta data such as the video duration\n- `poster=\"image.jpg\"\
    ` to show a thumbnail image\n- `controls=\"true\"` to enable native playback controls\n\
    \nHere's an example:\n\n```\n<video controls=\"true\"\n       autoplay=\"false\"\
    \n       preload=\"metadata\"\n       poster=\"videothumb.jpg\">\n  <source src=\"\
    video.mp4\" type=\"video/mp4\">\n  <source src=\"video.webm\" type=\"video/webm\"\
    >\n</video>\n```\n\nAlternatively, a JavaScript solution could be implemented\
    \ that replaces a (lazy loaded) `<img>` with appropriate `<video>` or `<audio>`\
    \ elements when clicked. The solution could also work for third-party video providers\
    \ such as YouTube and Vimeo, which provide custom video players.\n\n# Replace\
    \ Images with CSS3 Effects\n\nThe days of slicing and dicing images in a graphic\
    \ package to create custom fonts, rounded corners, shadows, linear gradients,\
    \ and transparency effects have long gone. CSS3 options such as web fonts, border-radius,\
    \ text-shadow, box-shadow, opacity, and gradients have been supported by most\
    \ browsers for some time."
  merge: -1
  pgno: 86
- img_proc: true
  md: 'shadow, color gradients, and opacity are quicker to implement, easier to change,
    and require far fewer bytes than images.


    An element, image, or background image can be manipulated using CSS3 effects rather
    than having to create multiple variations. For example:


    +   - The clip-path and mask properties can partially or fully hide parts of an
    image or element to create non-rectangular shapes.

    - The shape-outside, shape-margin, and shape-image-threshold properties can be
    used to define non-rectangular text flows around or within an element.

    - The transform property can rotate, scale, and skew an element.

    - The filter property offers possibilities such as blurring, brightness, contrast,
    hue rotation, inversion, saturation, grayscale, sepia, opacity, and shadows.

    - Both background-blend-mode and mix-blend-mode control how backgrounds and images
    blend with each other in a similar way to Photoshop layers. Options include normal,
    multiply, screen, overlay, darken, lighten, color-dodge, color-burn, hard-light,
    soft-light, difference, exclusion, hue, saturation, color, and luminosity.


    > **CSS3 Effects Can Be Costly**


    CSS shadows, gradients, and filters may be costly during browser repaints. Use
    the effects sparingly and test their impact on scrolling and animation performance.


    # Use SVGs Effectively


    **Scalable Vector Graphics** define points, lines, and shapes as vectors in XML.
    Unlike bitmaps, SVG images can be scaled to any dimensions without increasing
    the file size or losing quality. This makes them ideal for logos, charts, and
    diagrams.


    It’s possible to create and manipulate SVGs manually, on the server, or in client-side
    JavaScript. However, more complex images will require a graphics package such
    as Adobe Illustrator, Affinity Designer, Inkscape, or SVG edit, followed by an'
  merge: -1
