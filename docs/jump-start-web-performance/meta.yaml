    # Optimize JavaScript Code


    HTML is a robust technology; even the oldest browsers without HTML5 support will
    show content. Similarly, CSS can fail to download or have coding errors, but the
    page remains viewable. By contrast, JavaScript is fragile and computationally
    expensive. A single error, unsupported command, or long-running task can prevent
    further code from running.


    It''s difficult to recommend JavaScript optimizations, since all applications
    will be different, but there are a few general tips that could improve performance.
    That said, be wary of micro-optimizations, which may shave a few milliseconds
    but aren''t called frequently enough to make a difference. Use your browser''s'
- md: "## Use JavaScript Sparingly\n\nIf a browser can do something in HTML and/or\
    \ CSS alone, that should be your preferred option. You can still apply progressive\
    \ enhancements where necessary (discussed below).\n\nModern browsers have implemented\
    \ many regularly used features that previously required scripting, such as form\
    \ validation, field auto-complete, animations, video, expanding text, modal dialogs,\
    \ and more. There will be challenges—ask anyone who's ever tried styling a `<select>`\
    \ drop-down—but using a native feature will always be faster and use less code.\n\
    \nConsider the choice of using an HTML `<button>` versus a `<div>` as a form submit.\
    \ The HTML code starts in a similar way:\n\n```\n<button>submit</button>\n```\n\
    \nStyling a DIV in CSS may be easier:\n\n```\n<div class=\"button\">submit</div>\n\
    ```\n\nHowever, the HTML `<button>`:\n\n1. offers default styling to look like\
    \ an OS button\n2. works on all browsers even when CSS or JavaScript fails\n3.\
    \ works immediately, as the page loads and before JavaScript has started executing\n\
    4. will automatically submit its parent `<form>` (if validity checks pass)\n5.\
    \ can be operated with a mouse, touch screen, keyboard, or any other input device\n\
    6. can receive focus, and accepts keypress shortcuts\n7. requires no ARIA roles\
    \ or other accessibility assistance\n\nA button that's simulated in CSS and JavaScript\
    \ requires significant effort, and it will never function as effectively as the\
    \ native HTML alternative.\n\n## Avoid Long-running Tasks\n\nLong-running tasks\
    \ often trigger *unresponsive browser* messages, which prompt the user to halt\
    \ JavaScript execution. Complex processing is best handled by a **Web Worker**,\
    \ which allows a script to run in a background thread.\n\nWeb Worker scripts are\
    \ limited. They can't interact with the page DOM, and must communicate with the\
    \ main script using a message API, but they're able to perform Ajax requests and\
    \ launch their own child workers.\n\n## Bind Events Sparingly\n\nApplications\
    \ can have dozens of event handlers. A handler function is registered to an event\
    \ when it's triggered on a specific DOM element—such as running the `doSomething()`\
    \ function when a click is detected on the `myElement` node:\n\n```\nmyElement.addEventListener('click',\
    \ doSomething);\n```\n\nEach bound event has a performance hit. Ideally, you should\
    \ only add events you require, return from handler functions quickly, and unbind\
    \ using `removeEventListener` when an event is no longer necessary.\n\nAlso be\
    \ wary of quick-firing events such as `mousemove` and `scroll`, which can trigger\
    \ rapid and wasteful rerunning of handler functions. One way around this is to\
    \ use throttling to ensure an event is called no more than once every *N* milliseconds.\
    \ For example:\n\n```\n// throttle event to delay ms\nfunction eventThrottle(element,\
    \ event, callback, delay = 300) {\n\n    let throttle;\n    element.addEventListener(event,\
    \ (e) => {\n\n        throttle = throttle || setTimeout(() => {\n            throttle\
    \ = null;\n            callback(e);\n        }, delay);\n\n    }, false);\n\n\
    }\n\n// call windowScrollHandler no more than once every 300ms\neventThrottle(window,\
    \ 'scroll', windowScrollHandler);\n```\n\nAlternatively, **debouncing** can be\
    \ used to ensure a handler is only called after the event has stopped being triggered\
    \ for *N* milliseconds:\n\n```\n// debounce event until it no longer occurs for\
    \ delay ms\nfunction eventDebounce(element, event, callback, delay = 300) {\n\n\
    \    let debounce;\n    element.addEventListener(event, (e) => {\n        clearTimeout(debounce);\n\
    \        debounce = setTimeout(() => callback(e), delay);\n    }, false);\n\n\
    }\n\n// call windowScrollHandler when at least 300ms has elapsed since the last\
    \ event\neventDebounce(window, 'scroll', windowScrollHandler);\n```\n\nFinally,\
    \ remember to make effective use of event delegation. For example, presume you\
    \ have an HTML `<table>` with thousands of cells and want to react to a `<td>`\
    \ being clicked. Attaching an event to each cell requires significant processing\
    \ and would need to be reapplied if the table changed. Instead, you can attach\
    \ a single event handler to the `<table>` element and examine the target. For\
    \ example:\n\n```\n// handle a click on any <td> element\ndocument.getElementById('mytable').addEventListener('click',\
    \ (e) => {\n\n    let t = e.target.closest('td');\n    if (!t) return;\n\n   \
    \ console.log('clicked cell', t);\n\n});\n```\n\n## Analyze Modified Code\n\n\
    It's rare to encounter code that hasn't been modified before it reaches the browser!\n\
    \n- Minifiers attempt optimizations such as rearranging lines or expanding loops.\n\
    - Transpilers such as Babel convert ES6 to ES5 so the code runs in older browsers.\n\
    - Compilers such as TypeScript, CoffeeScript, and Flow convert alternative or\
    \ superset syntaxes to JavaScript.\n- Projects such as [Blazor](https://blazor.net)\
    \ convert C# to [WebAssembly](https://webassembly.org)—a low-level, assembly-like\
    \ language that offers near-native OS performance in JavaScript engines.\n\nAll\
    \ offer stability and performance benefits, but check that the conversion is optimal\
    \ and that it's not unnecessarily importing several kilobytes of transpiler library\
    \ code. For example, consider the following 32-byte [ES6 for...of](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...of)\
    \ loop:\n\n```\nfor (let p of n) console.log(p);\n```\n\nThis results in 598 bytes\
    \ of Babel-transpiled code. Each additional loop adds a similar quantity of code,\
    \ and none will execute in IE11—which partly defeats the point of transpiling!\
    \ Options to consider:\n\n- Use ES5 or more transpiler-efficient ES6 code to achieve\
    \ the same result.\n- Use differential loading to serve [ES6 module-based code](https://web.dev/modules/)\
    \ to modern browsers and larger transpiled scripts to older applications.\n- Drop\
    \ support for browsers without ES6 support (primarily IE). Your site or application\
    \ can remain usable if you adopt server-side rendering and progressive enhancement\
    \ techniques.\n\n## Modify the DOM Effectively\n\nSome modern JavaScript frameworks\
    \ implement a virtual DOM. As you change page elements, the virtual DOM works\
    \ out what's been altered and determines how and when to make modifications. Ultimately,\
    \ it must still change the real DOM, and you can make similar optimizations to\
    \ improve performance without the additional overhead of virtual DOM calculations.\n\
    \n## Cache Regularly Used Nodes\n\nRegularly used DOM nodes should be stored as\
    \ JavaScript variables so they don't need to be re-fetched. The DOM references\
    \ are retained even when other tree nodes are modified:\n\n```\nconst\n    main\
    \    = document.getElementsByTagName('main')[0],\n    heading = main.querySelector('h1'),\n\
    \    tables  = main.getElementsByTagName('table');\n```\n\n> ### Search from Any\
    \ Node\n\nRather than searching the whole tree from `document`, many DOM methods\
    \ allow you to start from any node. The example above searches for the first heading\
    \ and tables within the `<main>` element.\n\n`querySelector()` and `querySelectorAll()`\
    \ can find elements using jQuery-like CSS selectors. They're usually slower than\
    \ `getElementById()`, `getElementsByTagName()` and `getElementsByClassName()`,\
    \ although the speed difference is unlikely to affect most applications.\n\n>\
    \ ### Running Benchmarks\n\nTools such as [jsPerf.com](http://jsPerf.com) provide\
    \ a way to create code snippets and run benchmarks on any browser to prove the\
    \ efficiency—or inefficiency—of alternative functions.\n\n`getElementsByTagName()`\
    \ and `getElementsByClassName()` also return *live* HTMLCollections, which update\
    \ automatically as the DOM is modified—so that it's not necessary to rerun the\
    \ query.\n\n## Minimize Reflows\n\nWhen an element is added, modified, or removed\
    \ from a page, it can trigger a cascade of layout changes to surrounding elements.\
    \ For example, increasing a width by 1px could result in a neighboring element\
    \ wrapping to the next line, which pushes all subsequent content down the page.\
    \ It's therefore more efficient to make changes that can't impact the layout.\
    \ For example:\n\n- use `opacity` and/or `transform` to translate (move), scale,\
    \ or rotate an element\n- limit the scope of the reflow by changing elements low\
    \ in the DOM tree (those without deeply nested children)\n- update elements in\
    \ their own `position: absolute;` or `position: fixed;` layer\n- modify hidden\
    \ elements (`display: none;`), then show them after the change has been applied\n\
    \n## Batch-update Styles\n\nThe following example could cause three reflows:\n\
    \n```\nlet myelement = document.getElementById('myelement');\nmyelement.width\
    \ = '100px';\nmyelement.height = '200px';\nmyelement.style.margin = '10px';\n\
    ```"
  mdcn: "\n## 谨慎使用 JavaScript\n\n如果浏览器仅通过 HTML 和/或 CSS 就能实现某项功能，这应该是你的首选方案。必要时仍可应用渐进增强（下文会讨论）。\n\
    \n现代浏览器已实现许多常用功能，这些功能之前需要通过脚本实现，例如表单验证、字段自动完成、动画、视频、可展开文本、模态对话框等。当然会遇到挑战——问问任何曾尝试为\
    \ `<select>` 下拉菜单设置样式的开发者——但使用原生功能总是更快且代码更少。\n\n以选择使用 HTML `<button>` 还是 `<div>`\
    \ 作为表单提交按钮为例。HTML 代码的开头相似：\n\n```\n<button>submit</button>\n```\n\n在 CSS 中为 DIV\
    \ 设置样式可能更简单：\n\n```\n<div class=\"button\">submit</div>\n```\n\n然而，HTML `<button>`\
    \ 具有以下优势：\n\n1.  默认样式看起来像操作系统按钮\n2.  即使 CSS 或 JavaScript 失效，也能在所有浏览器上工作\n3.  立即生效，在页面加载时即工作，无需等待\
    \ JavaScript 开始执行\n4.  如果验证检查通过，会自动提交其父级 `<form>`\n5.  可以通过鼠标、触摸屏、键盘或任何其他输入设备操作\n\
    6.  可以接收焦点，并接受键盘快捷键\n7.  不需要 ARIA 角色或其他无障碍辅助功能\n\n一个通过 CSS 和 JavaScript 模拟的按钮需要大量工作，且其功能永远无法达到原生\
    \ HTML 替代方案的效果。\n\n## 避免长时间运行的任务\n\n长时间运行的任务经常会触发*浏览器无响应*消息，提示用户停止 JavaScript\
    \ 执行。复杂处理最好由 **Web Worker** 处理，它允许脚本在后台线程中运行。\n\nWeb Worker 脚本是受限的。它们无法与页面 DOM\
    \ 交互，必须使用消息 API 与主脚本通信，但它们能够执行 Ajax 请求并启动自己的子 Worker。\n\n## 谨慎绑定事件\n\n应用程序可以拥有数十个事件处理程序。当特定\
    \ DOM 元素上触发事件时，会注册一个处理函数——例如，当在 `myElement` 节点上检测到点击时运行 `doSomething()` 函数：\n\n\
    ```\nmyElement.addEventListener('click', doSomething);\n```\n\n每个绑定的事件都会带来性能开销。理想情况下，你应该只添加需要的事件，让处理函数快速返回，并在事件不再需要时使用\
    \ `removeEventListener` 解绑。\n\n同时要小心快速触发的事件，如 `mousemove` 和 `scroll`，它们可能导致处理函数频繁且浪费性地重新运行。一种解决方法是使用节流，确保事件每\
    \ *N* 毫秒最多调用一次。例如：\n\n```\n// 将事件节流到延迟毫秒数\nfunction eventThrottle(element, event,\
    \ callback, delay = 300) {\n\n    let throttle;\n    element.addEventListener(event,\
    \ (e) => {\n\n        throttle = throttle || setTimeout(() => {\n            throttle\
    \ = null;\n            callback(e);\n        }, delay);\n\n    }, false);\n\n\
    }\n\n// 每300毫秒最多调用一次 windowScrollHandler\neventThrottle(window, 'scroll', windowScrollHandler);\n\
    ```\n\n或者，可以使用**防抖**来确保只有在事件停止触发 *N* 毫秒后才调用处理函数：\n\n```\n// 对事件进行防抖，直到其停止发生延迟毫秒数\n\
    function eventDebounce(element, event, callback, delay = 300) {\n\n    let debounce;\n\
    \    element.addEventListener(event, (e) => {\n        clearTimeout(debounce);\n\
    \        debounce = setTimeout(() => callback(e), delay);\n    }, false);\n\n\
    }\n\n// 在最后一次事件后至少300毫秒才调用 windowScrollHandler\neventDebounce(window, 'scroll',\
    \ windowScrollHandler);\n```\n\n最后，记住要有效利用事件委托。例如，假设你有一个包含数千个单元格的 HTML `<table>`，并且想要响应\
    \ `<td>` 的点击。为每个单元格附加事件需要大量处理，并且如果表格更改则需要重新应用。相反，你可以将单个事件处理程序附加到 `<table>` 元素并检查目标。例如：\n\
    \n```\n// 处理任何 <td> 元素上的点击\ndocument.getElementById('mytable').addEventListener('click',\
    \ (e) => {\n\n    let t = e.target.closest('td');\n    if (!t) return;\n\n   \
    \ console.log('clicked cell', t);\n\n});\n```\n\n## 分析修改后的代码\n\n遇到的代码在到达浏览器之前未被修改的情况很少见！\n\
    \n-   压缩工具尝试进行优化，例如重排代码行或展开循环。\n-   Babel 等转译器将 ES6 转换为 ES5，以便代码能在旧版浏览器中运行。\n\
    -   TypeScript、CoffeeScript 和 Flow 等编译器将备选或超集语法转换为 JavaScript。\n-   [Blazor](https://blazor.net)\
    \ 等项目将 C# 转换为 [WebAssembly](https://webassembly.org)——一种类似汇编的低级语言，在 JavaScript\
    \ 引擎中提供接近原生操作系统的性能。\n\n所有这些都提供稳定性和性能优势，但需要检查转换是否最优，以及是否不必要地引入了几千字节的转译器库代码。例如，考虑以下\
    \ 32 字节的 [ES6 for...of](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...of)\
    \ 循环：\n\n```\nfor (let p of n) console.log(p);\n```\n\n这会产生 598 字节的 Babel 转译代码。每个额外的循环都会添加类似数量的代码，而且都不会在\
    \ IE11 中执行——这在一定程度上违背了转译的意义！需要考虑的选项：\n\n-   使用 ES5 或对转译器更高效的 ES6 代码来实现相同结果。\n\
    -   使用差异加载，为现代浏览器提供 [基于 ES6 模块的代码](https://web.dev/modules/)，为旧版应用程序提供较大的转译脚本。\n\
    -   放弃对不支持 ES6 的浏览器（主要是 IE）的支持。如果你采用服务端渲染和渐进增强技术，你的网站或应用程序仍然可以保持可用。\n\n## 高效修改\
    \ DOM\n\n一些现代 JavaScript 框架实现了虚拟 DOM。当你更改页面元素时，虚拟 DOM 会计算出哪些内容被修改，并确定如何以及何时进行修改。最终，它仍然必须更改真实的\
    \ DOM，而你可以进行类似的优化来提高性能，而无需虚拟 DOM 计算的额外开销。\n\n## 缓存常用节点\n\n常用的 DOM 节点应存储为 JavaScript\
    \ 变量，这样就不需要重新获取。即使其他树节点被修改，DOM 引用也会被保留：\n\n```\nconst\n    main    = document.getElementsByTagName('main')[0],\n\
    \    heading = main.querySelector('h1'),\n    tables  = main.getElementsByTagName('table');\n\
    ```\n\n> ### 从任意节点开始搜索\n\n许多 DOM 方法允许你从任意节点开始搜索，而不是从 `document` 搜索整个树。上面的示例在 `<main>`\
    \ 元素内搜索第一个标题和表格。\n\n`querySelector()` 和 `querySelectorAll()` 可以使用类似 jQuery 的 CSS\
    \ 选择器查找元素。它们通常比 `getElementById()`、`getElementsByTagName()` 和 `getElementsByClassName()`\
    \ 慢，尽管速度差异不太可能影响大多数应用程序。\n\n> ### 运行基准测试\n\n像 [jsPerf.com](http://jsPerf.com)\
    \ 这样的工具提供了一种创建代码片段并在任何浏览器上运行基准测试的方法，以证明替代函数的效率——或低效性。\n\n`getElementsByTagName()`\
    \ 和 `getElementsByClassName()` 还会返回*动态的* HTMLCollections，当 DOM 被修改时它们会自动更新——因此不需要重新运行查询。\n\
    \n## 最小化回流\n\n当元素被添加到页面、被修改或从页面中移除时，它可能会触发周围元素的一系列布局更改。例如，将宽度增加 1px 可能导致相邻元素换行到下一行，这会将所有后续内容向下推。因此，进行不会影响布局的更改会更有效。例如：\n\
    \n-   使用 `opacity` 和/或 `transform` 来平移（移动）、缩放或旋转元素\n-   通过更改 DOM 树中较低位置（没有深层嵌套子节点）的元素来限制回流范围\n\
    -   在元素自己的 `position: absolute;` 或 `position: fixed;` 层中更新元素\n-   修改隐藏元素（`display:\
    \ none;`），然后在更改应用后再显示它们\n\n## 批量更新样式\n\n以下示例可能导致三次回流：\n\n```\nlet myelement =\
    \ document.getElementById('myelement');\nmyelement.width = '100px';\nmyelement.height\
    \ = '200px';\nmyelement.style.margin = '10px';\n```\n"
