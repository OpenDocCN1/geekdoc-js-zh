  md: 'The response is faster, users are happier, and your hosting requirements may
    be reduced.


    You may already be using a CDN for static assets such as CSS or JavaScript frameworks.
    For example, jQuery can be referenced at `https://code.jquery.com/jquery-3.4.1.slim.min.js`
    in a `<script>` tag. This type of CDN offers several benefits:


    +   - Files are available on fast servers replicated across the globe.

    - Files are hosted on a domain other than your website''s, which increases the
    number of concurrent assets the browser can download.

    - Files may already be cached in the user''s browser, since many sites may reference
    that URL.


    Unfortunately, simple static-file CDNs can be frustrating to manage, and third-party
    scripts have performance, privacy, and security risks (see **Chapter 4**).


    More recently, CDN services have appeared that automatically proxy requests to
    your site. This usually requires your domain to point at the CDN''s name servers
    or set specific DNS records. The benefits of this include:


    +   - a faster, high-capacity infrastructure with more efficient delivery from
    many locations around the globe

    - high availability: a CDN can continue to deliver cached files even when a host''s
    server fails

    - improved SEO: Google rewards sites with faster response times

    - cheaper costs: adopting a CDN is likely to cost less than scaling server resources


    CDNs may provide additional services regardless of your host''s server facilities
    and limitations, such as:


    +   - SSL certificates for HTTPS encryption

    - load balancing, data compression, and the HTTP/2 protocol for faster transmission

    - automatic file minification, image optimization, video transcoding, and email'
