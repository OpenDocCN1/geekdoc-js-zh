  - '[PAGE 66]


    The tips provided in this chapter will require a little more effort, but the performance
    results on new and existing sites may be more dramatic. Some of the simplest but
    most effective database optimizations are tackled first before delving into images,
    media, fonts, CSS animations, and some controversial topics.


    # Optimize Your Database


    Database access is often the biggest processing bottleneck on the server. Optimizing
    front-end performance may be futile if your database is struggling to cope with
    user demand.


    There are a vast array of database types, but common performance solutions are
    described in the following sections.


    # Use a Query Analyzer


    Most databases provide tools that describe how a query has been processed. These
    can identify missing indexes or other performance issues. Many SQL and NoSQL databases
    offer an `EXPLAIN` clause or option:


    +   - MySQL EXPLAIN

    - PostgreSQL EXPLAIN

    - SQLite EXPLAIN

    - SQL Server EXPLAIN

    - Oracle EXPLAIN PLAN

    - MongoDB .explain()

    - Couchbase EXPLAIN


    The output can be complex, verbose, and beyond the scope of this book. Consult
    the documentation and look for tools that can help understand the issues.


    The database logs can usually be tuned to record long-running queries, and you
    may find open-source or commercial products to help optimize data.'
  - '[PAGE 67]


    # Create Indexes


    Many database performance issues will be solved with an index. An **index** works
    identically to those in a book: it allows a database to quickly jump to a record
    given a list of items defined in a specific order.


    Consider a `user` table containing an ID (number), name, email, and hashed password.
    The ID is likely to be the primary key and the table is ordered by that value.
    A query for a specific ID is fast, because the database can use an efficient searching
    algorithm. For example, it can start at the middle record and, if its ID is higher,
    it knows the record must be in the first half of the table.


    However, a login form requesting a user''s email address and password must query
    by that email. Those will be randomly ordered in the `user` table, so the database
    has to check every record until it locates a match. The larger the table, the
    slower the query. An index can define a list of emails in alphabetical order (or
    any order that''s practical). The searching algorithm can then use that index
    to locate a record by email, just as fast as searching by ID.


    Indexes should therefore be considered on any field commonly used in search queries
    (typically `WHERE` or `JOIN` clauses in an SQL `SELECT`). It''s tempting to add
    indexes for every field, but the more you create, the more space is required,
    and the slower write operations become, as all indexes must be updated.


    # Simplify Queries


    The less work the database has to do, the faster a result will be returned. Examine
    your codebase for complex or multiple dependent queries, especially those that
    are generated or contain sub-queries. It will usually be possible to make the
    search more efficient.


    For example, consider a query that retrieves the top five selling books. In MySQL-compatible
    SQL:


    ```

    SELECT title, author_id FROM book ORDER BY sales DESC LIMIT 5;

    ```'
- md: "The results contain an `author_id` reference, so five further queries are made\
    \ to fetch author names. For example:\n\n```\nSELECT firstname, lastname FROM\
    \ author WHERE author_id = 14;\nSELECT firstname, lastname FROM author WHERE author_id\
    \ = 52;\nSELECT firstname, lastname FROM author WHERE author_id = 50;\nSELECT\
    \ firstname, lastname FROM author WHERE author_id = 22;\nSELECT firstname, lastname\
    \ FROM author WHERE author_id = 20;\n```\n\nThis is known as the **N+1 problem**:\
    \ a large set of queries must be made for the parent records and each result.\n\
    \nA more efficient option would be to fetch all the authors in a single query:\n\
    \n```\nSELECT firstname, lastname FROM author WHERE author_id IN (14,52,50,22,20);\n\
    ```\n\nPerformance can be improved further with a single query that can be optimized\
    \ by the database:\n\n```\nSELECT book.title, author.firstname, author.lastname\n\
    FROM book\nLEFT JOIN author ON book.author_id = author.id\nORDER BY sales DESC\
    \ LIMIT 5;\n```\n\n## Create Additional Database Connections\n\nMany web applications\
    \ create a single database connection object that's used for all queries and updates.\
    \ Unfortunately, some databases queue all incoming requests from a single connection\
    \ and process them in order. If one user runs a complex operation that takes 20\
    \ seconds to complete, every other user will have to wait at least 20 seconds\
    \ for their operation to be processed.\n\nConnection queuing issues will be more\
    \ evident on continually running applications such those implemented in Node.js.\
    \ PHP applications are usually served by a web server, which creates separate\
    \ threads with new connection objects on every request, although pooling solutions\
    \ may be in place.\n\n## Jump Start Web Performance\n\nTo prevent database request\
    \ queuing problems, consider these options:\n\n- creating single-use connection\
    \ objects for queries that could take time\n- creating multiple connection objects\
    \ for specific uses or which can be used in request order\n\nHowever, be wary\
    \ of creating too many in-memory connection objects, which could lead to stability\
    \ issues.\n\n## Consider a Server or Memory Upgrade\n\nDatabases work more effectively\
    \ when they have plenty of RAM. RAM allows the system to optimize frequently used\
    \ queries and cache results in memory for fast access.\n\nAlternatively, you could\
    \ consider using either:\n\n- a separate database server\n- multiple servers that\
    \ either share processing or shard data into smaller silos\n- a third-party database\
    \ provider that handles the hard work for you\n\n## Cache Results\n\nIt may not\
    \ be necessary to perform queries every time a user requests a resource. Consider\
    \ a statistical dashboard displaying various charts that are computationally expensive\
    \ to create. The data could be fetched once from the database, cached in memory\
    \ or a file, then returned on every subsequent request. The charts would be updated\
    \ either when:\n\n- data has changed\n- a specific time has elapsed (such as ten\
    \ minutes)\n- a combination of factors is satisfied (such as when data has changed\
    \ and it's at least five minutes since the last calculation)\n\nSolutions such\
    \ as [Redis](https://redis.io/) and [memcached](https://memcached.org/) are often\
    \ used for caching purposes.\n\n## Use Background Processing\n\nConsider a web\
    \ application where a user can upload multiple images. These have metadata extracted,\
    \ are resized, and have filters applied before data is stored in various tables.\n\
    \nRather than doing all this work in the web application at the point the request\
    \ is made, the server could return a result immediately and offload processing\
    \ to one or more background tasks. The application will feel more responsive,\
    \ even though the final results may take a short while to appear.\n\n## Use Alternative\
    \ Data Systems\n\nExamine alternative systems such as [Elasticsearch](https://www.elastic.co/),\
    \ which provides faster, richer, and more appropriate search results than standard,\
    \ full-text database queries. Background processes could populate Elasticsearch\
    \ indexes, which are then used for search queries. While this now means you have\
    \ two database systems to manage and optimize, it could reduce bottlenecks and\
    \ improve functionality.\n\n## Remove or Optimize Social Media Buttons\n\nSocial\
    \ media sharing buttons are regularly added to websites to improve engagement\
    \ and publicize content on other platforms:\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_70_0.png)\n\
    \nThose innocent buttons have a high cost: *Facebook's share button downloads\
    \ 786KB of code (216KB gzipped)*. Twitter adds a further 151KB (52KB) and LinkedIn\
    \ 182KB (55KB). Adding a few buttons considerably increases page weight, and processing\
    \ a megabyte or two of JavaScript has a detrimental effect on performance—especially\
    \ on mobile devices. That could be the start of your problems, for various reasons\
    \ listed below.\n\n- The code is not sitting idle. Regardless of whether or not\
    \ someone clicks a button, your visitors are being monitored across your site\
    \ and others.\n- You may be liable for the use—or misuse—of personal data. The\
    \ European Court of Justice ruled in 2019 that sites voluntarily sharing visitor\
    \ information with a social network are considered joint data controllers.\n-\
    \ Third-party JavaScript is a security risk (see the next section).\n- Supporting\
    \ every social media platform is impossible. You’re likely to miss options, and\
    \ some services don’t provide sharing facilities.\n- Site engagement can be reduced\
    \ if your visitors are tempted to stay on the social network.\n\nThe risks are\
    \ high, given just 0.2% of visitors use the buttons. (Sources: [GOV.UK](http://GOV.UK)\
    \ and [Moovweb](http://Moovweb).)\n\nIf your site owners understand the hazards\
    \ but still want to keep the buttons, there’s a couple of options for retaining\
    \ sharing without adversely affecting performance, privacy, and security.\n\n\
    ## Use URL-based Share Links\n\nAny page can be shared on Facebook with a link\
    \ like this:\n\n```\nhttps://www.facebook.com/sharer/sharer.php?u=${url}\n```\n\
    \nLikewise for Twitter:\n\n```\nhttps://twitter.com/intent/tweet?url=${url}&text=${title}\n\
    ```\n\nAnd LinkedIn:\n\n```\nhttps://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${title}\n\
    ```\n\nIn these examples, `${url}` is the page URL and `${title}` is the title\
    \ (perhaps the text contained in the page's `<title>` tag).\n\nMost social networks\
    \ offer similar URL-based APIs. They're lightweight and only activate when a user\
    \ chooses to engage with the platform. You can implement these in standard `<a>`\
    \ tags and, if necessary, intercept the click with JavaScript to open the link\
    \ in a new window.\n\n## Use the Web Share API\n\nVisitors can use their browser's\
    \ **Share** facility to post URLs to social media apps as well as email, messaging,\
    \ Pocket, WhatsApp, and more.\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_72_0.png)\n\
    \n4-2. Browser share options\n\nThe option is normally provided on mobile browsers,\
    \ but it may not be obvious to users. Progressive Web Apps (see [Chapter 5](chapter5_url))\
    \ can also hide the browser interface.\n\nFortunately, the [Web Share API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Share_API)\
    \ was introduced in [Chrome 76 on Android, Safari 12.3 on iOS, and Safari 12.1\
    \ on macOS](https://caniuse.com/#feat=web-share). The API hands information to\
    \ the host operating system, which knows which apps support sharing.\n\nThe sharing\
    \ UI can be shown in response to a user click. The following JavaScript checks\
    \ whether the Web Share API is supported, then adds a button click handler that\
    \ passes a `ShareData` object to `navigator.share()`:\n\n```\n// is the Web Share\
    \ API supported?\nif ( navigator.share ) {\n\n  // share button click handler\n\
    \  document.getElementById('share').addEventListener('click', () => {\n\n    //\
    \ share page information\n    navigator.share({\n      url: 'https://example.com/',\n\
    \      title: 'My example page',\n      text: 'An example page implementing the\
    \ Web Share API.'\n    });\n\n  });\n\n}\n```\n\nThe `ShareData` object contains:\n\
    \n- `url`: the URL being shared (an empty string denotes the current page)\n-\
    \ `title`: the document title (perhaps the page's HTML `<title>` string)\n- `text`:\
    \ arbitrary body text (perhaps the page's `description` meta tag)\n\nUnlike with\
    \ share buttons, it's possible to share a page `#target` such as an individual\
    \ section or comment rather than the primary URL.\n\n`navigator.share()` returns\
    \ a Promise so `.then()` and `.catch()` blocks can be used if you need to perform\
    \ other actions or react to failures."
  mdcn: "\n结果中包含一个 `author_id` 引用，因此需要进行五次额外查询来获取作者姓名。例如：\n\n```\nSELECT firstname,\
    \ lastname FROM author WHERE author_id = 14;\nSELECT firstname, lastname FROM\
    \ author WHERE author_id = 52;\nSELECT firstname, lastname FROM author WHERE author_id\
    \ = 50;\nSELECT firstname, lastname FROM author WHERE author_id = 22;\nSELECT\
    \ firstname, lastname FROM author WHERE author_id = 20;\n```\n\n这就是所谓的 **N+1 问题**：必须为父记录和每条结果执行大量查询。\n\
    \n一个更高效的选项是通过单次查询获取所有作者：\n\n```\nSELECT firstname, lastname FROM author WHERE\
    \ author_id IN (14,52,50,22,20);\n```\n\n通过使用单次查询并利用数据库优化，性能可以进一步提升：\n\n```\n\
    SELECT book.title, author.firstname, author.lastname\nFROM book\nLEFT JOIN author\
    \ ON book.author_id = author.id\nORDER BY sales DESC LIMIT 5;\n```\n\n## 创建额外的数据库连接\n\
    \n许多 Web 应用程序会创建一个单一的数据库连接对象，用于所有查询和更新。不幸的是，某些数据库会将来自单一连接的所有请求排队，并按顺序处理它们。如果一个用户执行一个需要\
    \ 20 秒才能完成的复杂操作，那么其他所有用户将不得不至少等待 20 秒才能处理他们的操作。\n\n连接排队问题在像 Node.js 这样持续运行的应用程序上会更加明显。PHP\
    \ 应用程序通常由 Web 服务器提供服务，该服务器在每次请求时会创建带有新连接对象的独立线程，尽管可能已经部署了连接池解决方案。\n\n## 快速启动 Web\
    \ 性能\n\n为防止数据库请求排队问题，请考虑以下选项：\n\n-   为可能耗时的查询创建单次使用的连接对象\n-   为特定用途或可按请求顺序使用的场景创建多个连接对象\n\
    \n但是，请注意不要创建过多的内存连接对象，这可能导致稳定性问题。\n\n## 考虑服务器或内存升级\n\n当数据库拥有充足的 RAM 时，其工作效率更高。RAM\
    \ 允许系统优化常用查询，并将结果缓存在内存中以实现快速访问。\n\n或者，您可以考虑使用以下方案之一：\n\n-   一个独立的数据库服务器\n-   多台服务器，共享处理或数据分片到较小的独立单元\n\
    -   第三方数据库服务商，为您处理繁重的工作\n\n## 缓存结果\n\n可能没有必要在每次用户请求资源时都执行查询。考虑一个展示各种图表的统计仪表板，其创建在计算上开销很大。数据可以从数据库中一次性获取，缓存在内存或文件中，然后在后续每次请求时返回。图表可以在以下情况下更新：\n\
    \n-   数据已更改\n-   经过了特定时间（例如十分钟）\n-   满足组合因素（例如，当数据已更改且距离上次计算至少五分钟）\n\n像 [Redis](https://redis.io/)\
    \ 和 [memcached](https://memcached.org/) 这样的解决方案通常用于缓存目的。\n\n## 使用后台处理\n\n考虑一个用户可以上传多张图片的\
    \ Web 应用程序。这些图片在存储到各种表中之前，需要提取元数据、调整大小并应用滤镜。\n\n与其在请求到达时在 Web 应用程序中完成所有这些工作，服务器可以立即返回一个结果，并将处理任务卸载到一个或多个后台任务。即使最终结果可能需要短暂的时间才能出现，应用程序的响应速度也会感觉更快。\n\
    \n## 使用替代数据系统\n\n研究替代系统，例如 [Elasticsearch](https://www.elastic.co/)，它比标准的全文数据库查询提供更快、更丰富、更合适的搜索结果。后台进程可以填充\
    \ Elasticsearch 索引，然后用于搜索查询。虽然现在这意味着您有两个数据库系统需要管理和优化，但它可以减少瓶颈并改善功能。\n\n## 移除或优化社交媒体按钮\n\
    \n社交媒体分享按钮经常被添加到网站上，以提高参与度并在其他平台上宣传内容：\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_70_0.png)\n\
    \n那些看似无害的按钮成本高昂：*Facebook 的分享按钮下载 786KB 的代码（压缩后 216KB）*。Twitter 额外增加 151KB（52KB），LinkedIn\
    \ 增加 182KB（55KB）。添加几个按钮会显著增加页面体积，而处理一两兆字节的 JavaScript 会对性能产生不利影响——尤其是在移动设备上。这可能是您问题的开始，原因如下所列。\n\
    \n-   代码并非空闲。无论是否有人点击按钮，您的访问者都在您的网站和其他网站上被监控。\n-   您可能因个人数据的使用或滥用而承担责任。欧洲法院在 2019\
    \ 年裁定，自愿与社交网络共享访问者信息的网站被视为联合数据控制者。\n-   第三方 JavaScript 存在安全风险（参见下一节）。\n-   支持每个社交媒体平台是不可能的。您很可能会遗漏选项，而且某些服务不提供分享功能。\n\
    -   如果您的访问者被诱惑停留在社交网络上，网站参与度可能会降低。\n\n考虑到只有 0.2% 的访问者使用这些按钮，风险很高。（来源：[GOV.UK](http://GOV.UK)\
    \ 和 [Moovweb](http://Moovweb)。）\n\n如果您的网站所有者理解这些风险但仍然想保留这些按钮，有几种选项可以在不影响性能、隐私和安全性的情况下保留分享功能。\n\
    \n## 使用基于 URL 的分享链接\n\n任何页面都可以通过像这样的链接在 Facebook 上分享：\n\n```\nhttps://www.facebook.com/sharer/sharer.php?u=${url}\n\
    ```\n\nTwitter 同理：\n\n```\nhttps://twitter.com/intent/tweet?url=${url}&text=${title}\n\
    ```\n\nLinkedIn：\n\n```\nhttps://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${title}\n\
    ```\n\n在这些示例中，`${url}` 是页面 URL，`${title}` 是标题（可能是页面 `<title>` 标签中包含的文本）。\n\n大多数社交网络提供类似的基于\
    \ URL 的 API。它们是轻量级的，仅在用户选择与平台互动时才会激活。您可以在标准的 `<a>` 标签中实现这些功能，并在必要时使用 JavaScript\
    \ 拦截点击事件，在新窗口中打开链接。\n\n## 使用 Web Share API\n\n访问者可以使用其浏览器的 **分享** 功能，将 URL 发布到社交媒体应用程序以及电子邮件、消息、Pocket、WhatsApp\
    \ 等。\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_72_0.png)\n\n4-2. 浏览器分享选项\n\n\
    此选项通常在移动浏览器上提供，但用户可能不会明显感知到。渐进式 Web 应用（参见 [第 5 章](chapter5_url)）也可以隐藏浏览器界面。\n\n\
    幸运的是，[Web Share API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Share_API)\
    \ 已在 [Android 上的 Chrome 76、iOS 上的 Safari 12.3 和 macOS 上的 Safari 12.1](https://caniuse.com/#feat=web-share)\
    \ 中引入。该 API 将信息交给主机操作系统，操作系统知道哪些应用程序支持分享。\n\n分享 UI 可以在用户点击时显示。以下 JavaScript 检查是否支持\
    \ Web Share API，然后添加一个按钮点击处理程序，将 `ShareData` 对象传递给 `navigator.share()`：\n\n```\n\
    // 是否支持 Web Share API？\nif ( navigator.share ) {\n\n  // 分享按钮点击处理程序\n  document.getElementById('share').addEventListener('click',\
    \ () => {\n\n    // 分享页面信息\n    navigator.share({\n      url: 'https://example.com/',\n\
    \      title: 'My example page',\n      text: 'An example page implementing the\
    \ Web Share API.'\n    });\n\n  });\n\n}\n```\n\n`ShareData` 对象包含：\n\n-   `url`：正在分享的\
    \ URL（空字符串表示当前页面）\n-   `title`：文档标题（可能是页面的 HTML `<title>` 字符串）\n-   `text`：任意正文文本（可能是页面的\
    \ `description` 元标签）\n\n与分享按钮不同，可以分享页面的 `#target`（例如特定部分或评论）而不是主 URL。\n\n`navigator.share()`\
    \ 返回一个 Promise，因此如果需要执行其他操作或对失败做出反应，可以使用 `.then()` 和 `.catch()` 块。\n"
