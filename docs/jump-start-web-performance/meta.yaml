    The performance techniques described in this chapter are more radical and could
    be difficult to apply to an existing project. Fortunately, there are no such limitations
    when embarking on a new site or app, so we look deeper into CMS issues, JavaScript
    optimization, DOM handling, server-side rendering, static site generators (SSGs),
    and development processes.


    # Evaluate CMS Templates and Plugins


    Content management systems such as WordPress don’t generate bloated, badly performing
    pages ... *until you start adding stuff!*


    Free or commercial templates make financial sense. Why employ a developer when
    an off-the-shelf solution does everything you need for a few dollars? Unfortunately,
    there’s a hidden cost. Generic templates must sell hundreds of copies—if not thousands—to
    recoup the development effort. To attract buyers, the developers bundle every
    conceivable feature. Your site may only use a fraction of those facilities, but
    they can still be present in the code, so the download weight and processing are
    affected.


    Similarly, be wary about plugins, since their quality and effectiveness vary.
    The best plugins can improve performance by optimizing database tables, caching
    data, and removing redundant code. The worst will duplicate assets, make convoluted
    configuration changes (such as `.htaccess` files), add unnecessary bloat, and
    affect responsiveness even though they’re inactive on a particular page.


    Always evaluate page cost and performance when considering new templates and plugins.
    Where possible, choose more lightweight options, even if the purchase price is
    higher.


    # Reduce Client-side Code


    Blindingly obvious statement alert: *smaller files results in faster pages*.


    Not all assets are created equal, though. 500KB of image data has a relatively
    low performance hit, since it’s downloaded once, cached in the browser, and'
