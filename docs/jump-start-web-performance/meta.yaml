  md: '# Be Wary of Third-party Scripts


    Analytics systems, advertising platforms, social media buttons, and custom widgets
    often require you to add a third-party `<script>` (from another domain). Those
    scripts may be huge or grow without you realizing.


    Third-party scripts also run with the same site-wide rights and permissions as
    your own code. As well as hindering performance, they can track users, upload
    data elsewhere, change your content, redirect to other pages, trigger ecommerce
    transactions, auto-click advertisements, or perform any other malicious actions.


    Your performance, privacy, and security is only as good as the weakest provider.
    Ensure third-party scripts:


    +   * are delivered over HTTPS to eliminate man-in-the-middle attacks

    * use `<script crossorigin="anonymous">` to ensure there''s no exchange of user
    credentials via cookies or other technologies

    * set a `<script>` `integrity` attribute with a file hash to reject any script
    that''s been changed by the provider (refer to Subresource Integrity on MDN)


    Ideally, move the script to your domain or remove it entirely.


    > ### Third-party Script Used to Target Site

    British Airways was fined US$232 million in 2018 when 500,000 customers had their
    names, email addresses, and full credit card information stolen during website
    transactions. The attack originated from a third-party script that was modified
    to target BA, possibly without the knowledge or consent of its supplier.


    # Use Responsive Images


    The `<img>` tag offers optional `srcset` and `size` attributes which are well-supported
    in most browsers (except IE). These allow specific images to be'
  merge: -1
  pgno: 74
- img_proc: true
  md: "requested according to the size of the element and pixel density.\n\n# CSS\
    \ Resolution\n\nModern smartphones offer screens with very high native resolutions,\
    \ known as HiDPI or Retina displays. Each pixel is almost invisible to the naked\
    \ eye, so the browser implements a **CSS resolution** such as 360x760px, where\
    \ the native resolution could be 1440x3040px. The **display density** is therefore\
    \ 4x, and a single CSS pixel will be using 4x4 (16) physical pixels.\n\nGiven\
    \ a 100x100px space, it's usually optimal to load a 100x100px image. However,\
    \ the image quality can look comparatively poor on a 4x display density, so a\
    \ 400x400px image could be preferable. The `srcset` attribute can define appropriate\
    \ images in a standard `<img>` tag:\n\n```\n<img width=\"100\" height=\"100\"\n\
    \     alt=\"responsive image\"\n     src=\"img-100.jpg\"\n     srcset=\"img-100.jpg\
    \ 1x,\n             img-200.jpg 2x,\n             img-300.jpg 3x,\n          \
    \   img-400.jpg 4x\" />\n```\n\nThe browser will select and download the most\
    \ appropriate image for the display density. This ensures the best image quality\
    \ without end users having to download unnecessarily large images on all devices.\n\
    \nThe image referenced in the `src` attribute is used when the browser doesn't\
    \ support `srcset`."
  merge: -1
  pgno: 75
- img_proc: true
  md: "# image-set() and Media Queries\n\nThe `CSS image-set() function` offers similar\
    \ options for background images, but `support is currently limited`.\n\nAn alternative\
    \ that works in most browsers is the `CSS resolution media query`, although the\
    \ code is more verbose.\n\nAlternatively, you can target images based on the rendered\
    \ width of the `<img>` element:\n\n```\n<img alt=\"responsive image\"\n    src=\"\
    small.jpg\"\n    srcset=\"small.jpg 400w\n            large.jpg 800w\" />\n```\n\
    \nThe `w` unit defines the image file's actual **width** in pixels. Don't use\
    \ `px` as you would normally expect.\n\n`small.jpg` is used when the viewport\
    \ is below 400px, but `large.jpg` is used on screens where the CSS or physical\
    \ pixels exceed 400px.\n\nThis example is only practical when the image is the\
    \ full width of the viewport. The `sizes` attribute defines the size of the image\
    \ in relation to the viewport so the width can be calculated:\n\n```\n<img alt=\"\
    responsive image\"\n    src=\"small.jpg\"\n    srcset=\"small.jpg 200w\n     \
    \       large.jpg 400w\"\n    sizes=\"50vw\" />\n```\n\nThe image width is `50vw`\
    \ —half the viewport. `small.jpg` is used when the image width is `200px` or less\
    \ (the viewport is therefore less than `400px` ), but `large.jpg` is used when\
    \ the image width is greater."
  merge: -1
  pgno: 76
- img_proc: true
  md: "The `sizes` attribute can contain complex media queries and a final fallback\
    \ size to determine the image width in multiple viewport dimensions. For example:\n\
    \n```\n<img alt=\"responsive image\"\n    sizes=\"(max-width: 299px) 100vw,\n\
    \           (min-width: 300px) and (max-width: 799px) calc(100vw - 60px),\n  \
    \         50vw\" />\n```\n\n# The Bandwidth Cost of Larger Images\n\nA 400x400px\
    \ image could have a file size 16x greater than its 100x100px equivalent. It requires\
    \ considerably more bandwidth, which could lead to a poor experience on a mobile\
    \ network.\n\nPresume smaller images are 20KB and the larger version is 200KB.\
    \ Each page contains five images and 1,000 page views are made per day. The daily\
    \ bandwidth saved by using smaller images is 900MB—or *330GB per year*.\n\nA compromise—perhaps\
    \ 200x200px—could look reasonable without adversely affecting performance.\n\n\
    # Define Responsive Image Aspect Ratios\n\nSince the advent of responsive web\
    \ design, developers have been advised not to set `width` and `height` attributes\
    \ on `<img>` tags. The CSS then sets `width: 100%` or `max-width: 100%` to ensure\
    \ the image is sized to the width of its container or the maximum dimensions of\
    \ the image accordingly.\n\nThe technique has an unfortunate side-effect: *when\
    \ images start to load, the page must reflow to allocate space*. You'll often\
    \ experience this on mobile devices, where the text you're reading suddenly moves\
    \ off-screen because an image suddenly appears further up the page.\n\nAn aspect\
    \ ratio defines the relationship between the height and width, so it becomes possible\
    \ to calculate the size when only one dimension is known. From"
  merge: -1
  pgno: 77
- img_proc: true
  md: "Firefox 71 and Chrome 79, the browser parses `<img>` `width` and `height` attributes\
    \ to calculate the aspect ratio. The appropriate space can then be reserved so\
    \ reflows aren't required:\n\n```\n<!-- image has a 4:3 aspect ratio -->\n<img\
    \ src=\"image.jpg\" width=\"400\" height=\"300\" alt=\"my image\" />\n```\n\n\
    > **Choosing Height and Width**\n\nAny appropriate width or height can be used\
    \ to set the aspect ratio, since it will be resized using CSS. For example, `width=\"\
    4\" height=\"3\"`. That said, it's best to set a reasonable size to ensure the\
    \ image is visible in very old browsers, or when CSS fails to load or is disabled.\n\
    \nThe following CSS ensures the image uses the full width of its container and\
    \ sets a height according to the aspect ratio:\n\n```\nimg {\n  width: 100%;\n\
    \  height: auto; /* this is essential */\n}\n```\n\nThe browser will reserve appropriate\
    \ space on the page so re-flows become unnecessary. Browsers that don't calculate\
    \ the aspect ratio won't reserve any space, but there are no downsides. The image\
    \ will remain responsive.\n\n> **HTML and CSS Proposals for Defining Aspect Ratios**\n\
    \nThere are also proposals to define aspect ratios using an HTML `intrinsicssize=\"\
    400x300\"` attribute or a CSS `aspect-ratio: 4/3` property. These would provide\
    \ alternative options for avoiding reflows, so keep an eye on new browser releases!"
