    The result:


    ![](img/d93d5aab668f52eb84bb477fd9a96986_91_0.png)


    4-10. The rendered sprite icons


    Image sprites can be generated in a graphics package, using tools such as [SpriteCow](https://www.spritecow.com/)
    or [Instant Sprite](http://instantsprite.com/), or in your build process.'
  - "[PAGE 92]\n\n# Consider OS Fonts\n\nIt's possible to add dozens of fonts to a\
    \ page ... but that doesn't mean you should!\n\n+   1. Designers recommend [using\
    \ fonts sparingly](using fonts sparingly), with one or two typefaces per document.\n\
    2. A custom font typically requires a few hundred kilobytes of data. The more\
    \ you add, the larger the page weight, and the worse the performance.\n3. The\
    \ days of every site using standard OS fonts are over. Perhaps Helvetica, Times\
    \ New Roman, or Comic Sans would look good on your site?!\n\nUsing an OS font\
    \ provides a noticeable performance boost; there's no download delay or flash\
    \ of unstyled or invisible text.\n\nEach platform supplies different default fonts,\
    \ but fallbacks can be specified as well as the generic font family names of serif,\
    \ sans-serif, monospace, cursive, fantasy, and system-ui. For example:\n\n```\n\
    body {\n  font-family: Arial, Helvetica, sans-serif;\n}\n```\n\nWeb apps may also\
    \ feel more native if they use a standard system font. The following stack implemented\
    \ on GitHub.com targets system fonts available across all popular platforms:\n\
    \n```\nbody {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\"\
    , Roboto, Helvetica,\n  Arial, sans-serif, \"Apple Color Emoji\", \"Segoe UI Emoji\"\
    , \"Segoe UI Symbol\";\n}\n```\n\nSimilar variations are used by Medium.com and\
    \ the WordPress administration panels:"
  - "[PAGE 93]\n\n```\nbody {\n    font-family: -apple-system, BlinkMacSystemFont,\
    \ \"Segoe UI\", Roboto, Oxygen-Sans, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif;\n\
    }\n```\n\nAlternatively, the CSS `@font-face` `local()` function can be used to\
    \ locate a font on the user’s system first, but load from a URL when it can’t\
    \ be found:\n\n```\n@font-face {\n    font-family: MyHelvetica;\n    src: local(\"\
    Helvetica Neue\"),\n         local(\"HelveticaNeue\"),\n         url(\"/fonts/Helvetica-webfont.woff2\"\
    ) format(\"woff2\"),\n         url(\"/fonts/Helvetica-webfont.woff\") format(\"\
    woff\");\n}\n```\n\nAn OS font should be your first choice if it closely matches\
    \ branding requirements.\n\n# Embed Web Fonts with <link>\n\nMany designers will\
    \ be horrified by the suggestion of using OS fonts, so web font use is inevitable.\
    \ The most popular option is to use a repository that serves fonts from a CDN.\
    \ Popular options include:\n\n+   - Google Fonts: [fonts.google.com](https://fonts.google.com)\n\
    - Font Library: [fontlibrary.org](https://fontlibrary.org)\n- Adobe Edge: [edgewebfonts.adobe.com](https://edgewebfonts.adobe.com)\n\
    \nWhere possible, load fonts using a `<link>` in your HTML `<head>`. For example:\n\
    \n```\n<link href=\"https://fonts.googleapis.com/css?family=Open+Sans\" rel=\"\
    stylesheet\">\n```\n\nThis downloads the font in parallel with other fonts and\
    \ style sheets.\n\nA CSS `@import` method may be offered by the repository, but\
    \ this blocks processing of the style sheet until the font has been downloaded\
    \ and parsed."
  - '[PAGE 94]


    # Limit Font Styles and Text


    Only request the fonts, weights, and styles you require—and definitely remove
    *any fonts you aren’t using!*


    Here’s an example of two Google Font URLs:


    +   - https://fonts.googleapis.com/css?family=Inconsolata:500,700

    - https://fonts.googleapis.com/css?family=Roboto:bolditalic


    Both fonts can be contained in a single URL:


    +   - https://fonts.googleapis.com/css?family=Inconsolata:500,700|Roboto:bolditalic


    In some cases, you may only need specific characters—perhaps for a regularly used
    title or logo. The text “Hello” requires just four characters from a specific
    font:


    +   - https://fonts.googleapis.com/css?family=Inconsolata&text=Helo


    Finally, you could benefit from hosting the fonts locally or [using more popular
    fonts](https://fonts.google.com/) that have a higher chance of being pre-cached
    in the user’s browser.


    # Use a Good Font-loading Strategy


    A web font can take several seconds to download. The browser will choose one of
    two options:


    +   1. Show a **flash of unstyled text** (FOUT). The first available font fallback
    is used immediately. It’s replaced by the web font once it’s loaded. This process
    is used by IE, Edge 18 and below, and older editions of Firefox and Opera.

    2. Show a **flash of invisible text** (FOIT). No text is displayed until the web
    font has loaded. This process is used in all modern browsers, which typically
    wait three seconds before reverting to a fallback.'
  - "[PAGE 95]\n\n# Jump Start Web Performance\n\nEither option can be jarring and\
    \ affect perceived performance.\n\nThe CSS font-display property allows you to\
    \ define the font-handling process. The options are:\n\n+   - **auto**: the browser's\
    \ default behavior (usually FOIT).\n- **block**: effectively FOIT. The text may\
    \ be invisible for up to three seconds. There's no font swap, but text can't be\
    \ read immediately.\n- **swap**: effectively FOUT. The first fallback is used\
    \ until the web font is available. Text can be read immediately, but the font\
    \ swap effect may be jarring if not managed effectively.\n- **fallback**: a compromise\
    \ between FOIT and FOUT. Text is invisible for a short period (typically 100ms)\
    \ then the first fallback is used until the web font is available. Text is readable\
    \ as the page loads, but the font swap can still be problematic.\n- **optional**:\
    \ the same as fallback, except no font swapping occurs. The web font will only\
    \ be used if it's available within the initial period. The first page view is\
    \ likely to show a fallback font while the web font is downloaded and cached.\
    \ Subsequent page views will use the web font.\n\n> **Similar Web and OS Fonts**\n\
    \noptional could be a reasonable choice if the web and OS fallback fonts are similar,\
    \ but if that's the case, using an OS font throughout would offer better performance!\n\
    \nExample CSS:\n\n```\n@font-face {\n  font-family: 'mytypeface';\n  src: url('mytypeface-webfont.woff2')\
    \ format('woff2'),\n       url('mytypeface-webfont.woff') format('woff');\n  font-weight:\
    \ 500;\n  font-style: normal;\n  font-display: swap;\n}\n```"
  - '[PAGE 96]


    ```

    }

    ```


    Google Fonts also provides a `display` URL query string parameter. For example:


    https://fonts.googleapis.com/css?family=Inconsolata:500,700&display=swap


    > 💡 **Settings for Specific Text Types**


    Different text blocks could use different `font-display` settings. For example,
    body text could use `swap` (FOUT) so it can be read immediately, while menus and
    heading text use `block` (FOIT).


    A pragmatic compromise could be considered, which uses a fallback font with similar
    weights, line heights, and spacing to the web font. `font-display: swap` (FOUT)
    can then be used, but the replacement effect is less noticeable.


    A tool such as [Font Style Matcher](https://meowni.ca/font-style-matcher/) can
    be used to find suitable fallback parameters.'
- md: "## 4-11. Font Style Matcher\n\n## Consider Variable Fonts\n\nOpenType 1.8 introduced\
    \ **variable fonts**, and they're [supported in most browsers](https://example.com)\
    \ (except IE). Rather than creating multiple files for each variation of the same\
    \ typeface, a font is defined with minimum and maximum vector limits along an\
    \ axis.\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_98_0.png)\n\nAny weight between\
    \ the two extremes can be interpolated. A single variable font can therefore be\
    \ used instead of several variations in order to reduce page weight and improve\
    \ performance.\n\nOpen-source and commercial variable fonts can be found at sites\
    \ including:\n\n- [Variable Fonts](https://v-fonts.com)\n- [Axis Praxis](https://axis-praxis.org)\n\
    - [Font Playground](https://play.typedetail.com)\n- [Recursive](https://www.recursive.design/)—a\
    \ revolutionary font that includes monospace and casual settings\n\nThese can\
    \ then be loaded using `@font-face` with a woff2-variations format and the allowable\
    \ ranges. For example:\n\n```\n@font-face {\n  font-family: 'VariableFont';\n\
    \  src: 'variablefont.woff2' format('woff2-variations');\n  font-weight: 200 800;\n\
    }\nfont-stretch: 75% 125%;\nfont-style: oblique 0deg 20deg;\n}\n```\n\nBrowser\
    \ support for variable fonts can be tested using @supports with `font-variation-settings`:\n\
    \n```\nbody {\n  font-family: sans-serif;\n}\n\n@supports (font-variation-settings:\
    \ 'wght' 500) {\n  body {\n    font-family: 'VariableFont';\n  }\n}\n```\n\nAspects\
    \ of the typeface can then be adjusted in CSS, including the weight (typically\
    \ 0 to 1000):\n\n```\nfont-weight: 500;\n/* or */\nfont-variation-settings: 'wght'\
    \ 500;\n```\n\nAlso width—or stretch—can be adjusted to produce condensed and\
    \ extended variations (100% is normally the default, with lower values creating\
    \ narrower fonts and higher values creating wider fonts):\n\n```\nfont-stretch:\
    \ 80%;\n/* or */\nfont-variation-settings: 'wdth' 80;\n```\n\nWhether or not italics\
    \ are required can also be set (either on or off, since italics are often defined\
    \ as a different character set):\n\n```\nfont-style: italic;\n/* or */\nfont-variation-settings:\
    \ 'ital' 1;\n```\n\nAlso slant—or *oblique*—can be adjusted, which modifies the\
    \ axis in a different way from italic (typically between 0 and 20 degrees):\n\n\
    ```\nfont-style: oblique 10deg;\n/* or */\nfont-variation-settings: 'slnt' 10;\n\
    ```\n\nThe shorthand `font-variation-settings` property allows multiple font aspects\
    \ to be set:\n\n```\nfont-variation-settings: 'wght' 300, 'wdth' 100, 'slnt' 0;\n\
    ```\n\n> ### OS Fonts as Variable Font Fallback\n> It’s possible to download a\
    \ single variable font but retain multiple fonts for older browsers. Unfortunately,\
    \ modern browsers will download every font specified, which negates any performance\
    \ benefit. It’s therefore preferable to use an OS font as the fallback.\n\n##\
    \ Use Modern CSS3 Layouts\n\nFor many years, it’s been necessary to use CSS `floats`\
    \ to lay out pages. The technique was always a hack and required considerable\
    \ code, along with endless margin/padding tweaking to make the layout work. Even\
    \ then, floats break at smaller screen sizes unless media queries are used.\n\n\
    Floats are no longer necessary:\n\n- **Flexbox** should be used for one-dimensional\
    \ layouts, which (can) wrap to the next row according to the widths of each block.\
    \ It’s ideal for menus, image galleries, cards, etc. [Flexbox is supported by\
    \ most browsers](https://caniuse.com/flexbox) including IE10+.\n- **Grid** is\
    \ for two-dimensional layouts with explicit rows and columns. It’s ideal for page\
    \ layouts. **Grid is supported by most browsers**, although IE10/11 use an older\
    \ version of the standard.\n\nBoth options are simpler to develop, use far less\
    \ code, can adapt to any screen size, can remove the need for media queries, and\
    \ render faster than floats because the browser can natively determine an optimum\
    \ layout.\n\n> ## Fallbacks for Older Browsers\n> It’s possible to use float-based\
    \ fallbacks for older browsers. However, it’s often better to use a simpler, single-column\
    \ layout rather than trying to emulate what you achieved using Flexbox or Grid.\
    \ Pixel perfection is futile!\n\n## Remove Unused CSS\n\nThe smaller your style\
    \ sheet, the quicker it will download, the sooner it will parse, and the faster\
    \ your page will become.\n\nWe all start with good intentions, but CSS can bloat\
    \ over time as the number of features increases. It’s easier to retain old, unnecessary\
    \ code than remove it and risk breaking something. Those using a CSS framework\
    \ such as Bootstrap may find they’re only using a fraction of the facilities.\n\
    \nCSS removal recommendations:\n\n1. Organize CSS into smaller files (partials)\
    \ with clear responsibilities (which can be concatenated into a single file at\
    \ build time). It’s easier to remove a carousel widget if the CSS is clearly defined\
    \ in `widgets/_carousel.css`.\n2. Consider naming methodologies such as **BEM**\
    \ to aid the development of discrete components.\n3. Avoid deeply nested Sass/pre-processor\
    \ declarations. The expanded code can become unexpectedly large.\n4. Avoid using\
    \ `!important` to override the cascade.\n5. Avoid inline styles in HTML.\n\nChrome’s\
    \ **Coverage** panel helps locate unused CSS and JavaScript code. Select **Coverage**\
    \ from the DevTools **More tools** sub-menu, then hit the record button and browse\
    \ your application. Click any file to open its source. Unused code is highlighted\
    \ in red in the line number gutter.\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_102_0.png)\n\
    \n4-13. Chrome code coverage\n\nChrome doesn't remember used/unused code as you\
    \ navigate to new pages! The Coverage panel is only practical for single-page\
    \ applications.\n\nThe following tools provide options to analyze HTML and CSS\
    \ usage either at build time or by crawling URLs so that redundant code can be\
    \ identified. Note that some configuration will be required to ensure styles triggered\
