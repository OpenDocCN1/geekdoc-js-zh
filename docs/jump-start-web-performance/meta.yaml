    You should also consider:


    +   1. **SVG:** Scalable Vector Graphics define lines, paths, and shapes in XML
    rather than individual pixels. They''re best suited to logos and diagrams, since
    they can be scaled to any size without loss of quality.

    2. **GIF:** these can be animated and sometimes result in smaller files than similar
    8-bit PNGs.

    3. **WebP:** this format can compress any type of image, but is <u>not currently
    supported in IE, Safari, and older browsers</u>.


    New image formats such as HEIC and AVIF may become viable in future.


    # Avoid Base64 Encoding


    Images can be encoded into a base64 string within a data URI defined in an HTML
    `<img>` tag or CSS `background` property:'
  - "[PAGE 55]\n\n```\n.myimg {\n    background-image: url('data:image/png;base64,ABCDEF+etc+etc+etc');\n\
    }\n```\n\nThis reduces the number of HTTP requests, but it rarely boosts performance:\n\
    \n+   1. Base64 encoding is typically 30% larger than the binary equivalent.\n\
    2. The browser must parse the string before an image can be used.\n3. Altering\
    \ an image invalidates the whole (cached) HTML or CSS file.\n\nOnly consider base64\
    \ encoding if:\n\n+   - it’s a practical option for your application—such as when\
    \ images are generated\n- the encoded string is very small—perhaps not much longer\
    \ than a URL\n\nThere may also be a case for reusable SVG icons defined as CSS\
    \ `background-image` properties. For example:\n\n```\n.mysvgbackground {\n   \
    \ background-image: url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/\\\
    n→svg\" viewBox=\"0 0 800 600\"><circle cx=\"400\" cy=\"300\" r=\"50\" stroke-width=\"\
    5\"\\n→stroke=\"#f00\" fill=\"#ff0\" /></svg>');\n}\n```\n\n# Compress Images\
    \ Effectively\n\nImage tools can reduce file sizes by stripping metadata, simplifying\
    \ details, and increasing compression factors. Ideally, image compression will\
    \ be handled automatically in a build process using options such as `imagemin`\
    \ and `svgo` (see Chapter 5), but several online tools are available for one-off\
    \ tasks:\n\n+   - [Compressor.io](http://Compressor.io): online, all image types\n\
    - [jpeg.io](http://jpeg.io): online, any format to JPG\n- [RIOT](http://RIOT):\
    \ Windows application, bitmaps"
  - '[PAGE 56]


    +   - [ShrinkMe](https://shrinkme.io): online, all

    - [Squoosh](https://squoosh.app): online, all

    - [SVGOMG](https://jakearchibald.github.io/svgomg/): online, SVGs

    - [TinyPNG / TinyJPG](https://tinypng.com): online, bitmaps


    # # Concatenate and Minify CSS


    Multiple style sheets can be loading using HTML `<link>` elements and CSS `@import`
    at-rules.


    Loading separate files is usually inefficient, because each `@import` blocks the
    browser’s rendering process; the imported file could have further nested `@import`
    rules. Performance can therefore be improved using:


    +   1. **Concatenation**: all partials are combined into a single large file in
    the necessary source order.

    2. **Minification**: unnecessary comments, whitespace, and characters are removed
    to minimize the file size.


    A build process (see [Chapter 5](https://example.com)) or pre-processor can automate
    CSS concatenation and minification, but online tools are also available:


    +   - [CSS Minifier](https://cssminifier.com)

    - [minifier.org](https://minifier.org)

    - [CSS Compressor](https://csscompressor.com)

    - [CSS Minify](https://cssminify.com)

    - [Online Compressor](https://www.toptal.com/developers/cssminifier)'
  - '[PAGE 57]


    > **HTTP/2 and Multiple Files**


    HTTP/2 lessens the need for file concatenation because it reduces the overhead
    of transmitting multiple files:

    - pipelining allows the server to send responses in any order

    - multiplexing permits any number of request and response messages on the same
    TCP connection at the same time

    - the server can use Server Push to send assets before they''re requested


    In theory, separate files may be a benefit on large, regularly updated applications,
    because just the modified assets can be sent. However, testing is recommended.
    There are unlikely to be many downsides of concatenation and minification.


    # Concatenate and Minify JavaScript


    Application code is normally split into multiple files with related or self-contained
    functionality. This makes development more practical: files are easier to understand,
    each can be tested individually, and reuse in other projects is easier. However,
    dependencies must be declared in some way to ensure script A is loaded before
    it''s referenced in script B.


    Multiple JavaScript files can be loaded in a single web page using:


    +   1. more than one HTML `<script>` element defined in dependency order

    2. [ES6 modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules),
    which `import` dependencies when they''re required within a script

    3. older run-time module loaders such as [RequireJS](https://requirejs.org/),
    which provide dependency management in ES5 and below


    Like CSS, JavaScript benefits from concatenation and minification: dependencies
    can be determined at build time, a single HTTP request is required, and the download
    file is smaller. Some minification tools can also optimize code for improved performance.'
  - '[PAGE 58]


    A build process using modules such as [Babel](https://babeljs.io/), [rollup.js](https://rollupjs.org/),
    or [preprocess](https://www.npmjs.com/package/preprocess) can manage dependencies
    and create a single JavaScript file that''s minified with [terser](https://terser.org/)
    (see [Chapter 5](#chapter5)). Alternatively, the process can be handled manually
    to improve performance on an existing site:


    +   - [JSCompress](https://jscompress.com/)

    - [minifier.org](https://www.minifier.org/)

    - [Minify your JavaScript](https://javascript-minifier.com/)

    - [Online Compressor](https://www.toptal.com/developers/javascript-minifier)

    - [Packer](https://dean.edwards.name/packer/)


    > ## Pre-minified Third-party Code


    Third-party JavaScript frameworks and libraries often provide pre-minified versions
    of the source code. Consult the documentation or look for file names containing
    `min`, such as `jquery-3.4.1.min.js`.


    # Minify HTML


    HTML can also be minified to remove comments, white space, and even unnecessary
    quotes around attributes. HTML code is often smaller than CSS and JavaScript,
    so performance gains will be less noticeable, but minification can be simple with
    a CMS plugin, framework module, or build system (refer to [Chapter 5](#chapter5)).


    # Load JavaScript at the End of the Page


    When the browser encounters a `<script>` tag in the HTML, it halts all other operations
    while it downloads and parses the code. This is known as a **render-blocking**
    process.


    It''s normally more effective to place `<script>` tags at the bottom of the page
    before the closing `</body>` tag. This improves page performance, since the content
    is viewable before an attempt is made to process JavaScript.'
  - '[PAGE 59]


    # 60 Jump Start Web Performance


    Two attributes can be added to a `<script>` tag to ensure JavaScript is loaded
    in the background without blocking the render process:


    +   1. `defer` : the script is executed when the DOM is ready and shortly before
    the **DOMContentLoaded event**. All deferred scripts are run in the order they’re
    referenced on the page.

    2. `async` : the script is executed once it has downloaded. This could occur at
    any point during or after the page has loaded, so it can’t have other script dependencies.


    Both attributes are well supported across modern browsers, but they’re not suited
    to all scripts. For example, deferred scripts run when the DOM is ready, but this
    can occur before the CSS Object Model has been parsed. A script that analyses
    applied CSS colors can therefore fail randomly. Scripts placed at the bottom of
    the page are never affected by this issue, and preloading may help (discussed
    next).


    > **Loading CSS**


    CSS is also render-blocking. However, if it were loaded at the end of the page,
    the browser would show unstyled HTML as the page loaded, then re-layout the content
    after the CSS had been parsed. This looks somewhat ugly and has a negative effect
    on performance. An alternative option is “critical CSS”, as described in [Chapter
    4](#).


    # Preload Assets


    The HTML `<link>` tag has a **preload attribute**. This specifies resources the
    page requires so downloading can start immediately rather than waiting for its
    reference in the HTML.


    For example, a page with a `<script>` tag just before the closing `</body>` can
    be preloaded in the HTML `<head>` :'
- md: "## Remove Unused Assets\n\nFeatures will be added and dropped as your website\
    \ or application evolves. Unfortunately, it's easy to leave stray, unused resources\
    \ lingering in the codebase, which negatively affects performance. Easier assets\
    \ to remove include:\n\n- CMS plugins. Disable or delete CMS (WordPress) plugins\
    \ you're no longer using.\n- Unused fonts, weights, and styles. Try removing suspicious\
    \ fonts and retest the site. This can improve page weight by several hundred kilobytes,\
    \ and critical fonts will normally fall back to reasonable alternatives.\n- Unused\
    \ CSS and JavaScript. Check that any removed HTML components have their associated\
    \ styles and functionality deleted.\n- Duplicate dependencies. Make sure you aren't\
    \ including similar assets more than once. This can be an issue in a CMS where\
    \ different plugins use slightly different versions of Bootstrap or jQuery.\n\n\
    ## Code for Specific Pages\n\nConsider removing code from pages that don't use\
    \ a particular feature. For example, if a page doesn't require a carousel, its\
    \ styles and functionality could be omitted.\n\nThis is less beneficial when concatenated\
    \ CSS and JavaScript files have been downloaded and cached in the browser. These\
    \ would contain unnecessary code for that page, but providing a smaller alternative\
    \ would incur a further download. Analyze your code to determine what could offer\
    \ the best performance:\n\n1. A single, concatenated file served to every page\
    \ that can be cached on first use.\n2. Multiple source files served over HTTP/2.\n\
    3. A compromise solution, such as core styles loaded on every page, plus article\
    \ styles used on news pages, pagination styles used on search results, and so\
    \ on.\n\n## Assess Analytics Performance\n\nSite owners should be given an easy\
    \ way to measure page views, journey flows, and feature usage. Tracking via server\
    \ access logs is possible, but richer statistics are normally available using\
    \ client-side systems such as Google Analytics. These systems may be free to use,\
    \ but can have a negative impact on page performance. Try temporarily removing\
    \ all analytics code from your site to assess the speed gains.\n\nFortunately,\
    \ it is possible to retain your statistics and improve performance:\n\n1. Use\
    \ a single analytics provider. Using more than one will adversely affect speed\
    \ and give mismatching reports. Traffic analysis is based on a stack of assumptions;\
    \ it's often impossible to compare results.\n2. Test analytics systems to determine\
    \ which offers the best performance for the information provided. Google alternatives\
    \ include **Matomo**, **Clicky**, **Heap**, **FoxMetrics**, and **Woopra**. Some\
    \ can be hosted locally to improve performance further.\n3. Consider alternative\
    \ code. For example, **minimalanalytics.com** removes lesser-used features to\
    \ provide a 1.5KB, Analytics-compatible script compared to Google's 73KB original\
    \ (although it will be more stable).\n4. Load analytics scripts after all other\
    \ JavaScript functionality has completed. Rather than placing code in the `<head>`,\
    \ the analytics scripts could be the last in the page or loaded after a timeout:\n\
    \n```javascript\n// load Google analytics after one second\nsetTimeout(() => {\n\
    \  let\n    uaId = 'UA-12345678-9', // Analytics ID\n    script = document.createElement('script');\n\
    \n  script.src = 'https://www.googletagmanager.com/gtag/js?id=' + uaId;\n  script.async\
    \ = 1;\n  script.onload = function() {\n    // initialize Analytics\n    dataLayer\
    \ = window.dataLayer || [];\n    window.gtag = function() { dataLayer.push(arguments);\
    \ }\n    gtag('js', new Date());\n    gtag('config', uaId);\n  };\n\n  document.head.appendChild(script);\n\
    }, 1000);\n```\n\n## Something More Substantial?\n\nTasty snacks may satisfy hunger\
    \ for a while, but you’ll soon be ravenous again! The next chapter provides more\
    \ substantial, performance-improving recipes.\n\n# Simple Recipes\n\n## Chapter\
    \ 4\n\nThe tips provided in this chapter will require a little more effort, but\
    \ the performance results on new and existing sites may be more dramatic. Some\
    \ of the simplest but most effective database optimizations are tackled first\
    \ before delving into images, media, fonts, CSS animations, and some controversial\
    \ topics.\n\n## Optimize Your Database\n\nDatabase access is often the biggest\
    \ processing bottleneck on the server. Optimizing front-end performance may be\
    \ futile if your database is struggling to cope with user demand.\n\nThere are\
    \ a vast array of database types, but common performance solutions are described\
    \ in the following sections.\n\n## Use a Query Analyzer\n\nMost databases provide\
    \ tools that describe how a query has been processed. These can identify missing\
    \ indexes or other performance issues. Many SQL and NoSQL databases offer an `EXPLAIN`\
    \ clause or option:\n\n- MySQL EXPLAIN\n- PostgreSQL EXPLAIN\n- SQLite EXPLAIN\n\
    - SQL Server EXPLAIN\n- Oracle EXPLAIN PLAN\n- MongoDB .explain()\n- Couchbase\
    \ EXPLAIN\n\nThe output can be complex, verbose, and beyond the scope of this\
    \ book. Consult the documentation and look for tools that can help understand\
    \ the issues.\n\nThe database logs can usually be tuned to record long-running\
    \ queries, and you may find open-source or commercial products to help optimize\
    \ data.\n\n## Create Indexes\n\nMany database performance issues will be solved\
    \ with an index. An **index** works identically to those in a book: it allows\
    \ a database to quickly jump to a record given a list of items defined in a specific\
    \ order.\n\nConsider a `user` table containing an ID (number), name, email, and\
    \ hashed password. The ID is likely to be the primary key and the table is ordered\
    \ by that value. A query for a specific ID is fast, because the database can use\
    \ an efficient searching algorithm. For example, it can start at the middle record\
    \ and, if its ID is higher, it knows the record must be in the first half of the\
    \ table.\n\nHowever, a login form requesting a user's email address and password\
    \ must query by that email. Those will be randomly ordered in the `user` table,\
    \ so the database has to check every record until it locates a match. The larger\
    \ the table, the slower the query. An index can define a list of emails in alphabetical\
    \ order (or any order that's practical). The searching algorithm can then use\
    \ that index to locate a record by email, just as fast as searching by ID.\n\n\
    Indexes should therefore be considered on any field commonly used in search queries\
    \ (typically `WHERE` or `JOIN` clauses in an SQL `SELECT`). It's tempting to add\
    \ indexes for every field, but the more you create, the more space is required,\
    \ and the slower write operations become, as all indexes must be updated.\n\n\
    ## Simplify Queries\n\nThe less work the database has to do, the faster a result\
    \ will be returned. Examine your codebase for complex or multiple dependent queries,\
    \ especially those that are generated or contain sub-queries. It will usually\
    \ be possible to make the search more efficient.\n\nFor example, consider a query\
    \ that retrieves the top five selling books. In MySQL-compatible SQL:\n\n```sql\n\
    SELECT title, author_id FROM book ORDER BY sales DESC LIMIT 5;\n```"
  mdcn: "\n## 移除未使用的资源\n\n随着网站或应用的发展，功能会不断添加或移除。不幸的是，代码库中很容易遗留未使用的零散资源，这会负面影响性能。以下是一些较易移除的资源：\n\
    \n-   CMS 插件。禁用或删除不再使用的 CMS（如 WordPress）插件。\n-   未使用的字体、字重和样式。尝试移除可疑字体并重新测试网站。这可能会减少数百KB的页面体积，并且关键字体通常会回退到合理的备选字体。\n\
    -   未使用的 CSS 和 JavaScript。确保任何已移除的 HTML 组件的相关样式和功能也已删除。\n-   重复的依赖项。确保没有多次包含类似的资源。在\
    \ CMS 中这可能是个问题，因为不同的插件可能使用了略有不同的 Bootstrap 或 jQuery 版本。\n\n## 为特定页面优化代码\n\n考虑从不使用特定功能的页面中移除相关代码。例如，如果一个页面不需要轮播图，那么它的样式和功能就可以省略。\n\
    \n当合并后的 CSS 和 JavaScript 文件已被下载并缓存在浏览器中时，这种方法的好处就较小了。这些文件会包含该页面不需要的代码，但提供一个更小的替代文件又需要额外的下载。分析你的代码以确定什么能提供最佳性能：\n\
    \n1.  一个合并的、可被缓存的单一文件，服务于所有页面。\n2.  通过 HTTP/2 提供的多个源文件。\n3.  折衷方案，例如在每个页面加载核心样式，然后加上新闻页面使用的文章样式、搜索结果页面使用的分页样式等等。\n\
    \n## 评估分析工具的性能\n\n网站所有者应有一种简便的方法来衡量页面浏览量、用户旅程流和功能使用情况。虽然可以通过服务器访问日志进行跟踪，但使用客户端系统（如\
    \ Google Analytics）通常能提供更丰富的统计数据。这些系统可能免费使用，但可能会对页面性能产生负面影响。尝试临时从网站中移除所有分析代码，以评估速度提升情况。\n\
    \n幸运的是，可以同时保留统计数据并提升性能：\n\n1.  使用单一的分析提供商。使用多个会负面影响速度并导致报告不一致。流量分析基于一系列假设；比较结果通常是不可能的。\n\
    2.  测试分析系统，以确定在提供所需信息的情况下，哪个性能最佳。Google 的替代品包括 **Matomo**、**Clicky**、**Heap**、**FoxMetrics**\
    \ 和 **Woopra**。其中一些可以本地托管以进一步提升性能。\n3.  考虑替代代码。例如，**minimalanalytics.com** 移除了较少使用的功能，提供了一个\
    \ 1.5KB、与 Analytics 兼容的脚本，而 Google 的原版脚本为 73KB（尽管后者可能更稳定）。\n4.  在所有其他 JavaScript\
    \ 功能完成后加载分析脚本。与其将代码放在 `<head>` 中，分析脚本可以放在页面末尾，或在超时后加载：\n\n```javascript\n// load\
    \ Google analytics after one second\nsetTimeout(() => {\n  let\n    uaId = 'UA-12345678-9',\
    \ // Analytics ID\n    script = document.createElement('script');\n\n  script.src\
    \ = 'https://www.googletagmanager.com/gtag/js?id=' + uaId;\n  script.async = 1;\n\
    \  script.onload = function() {\n    // initialize Analytics\n    dataLayer =\
    \ window.dataLayer || [];\n    window.gtag = function() { dataLayer.push(arguments);\
    \ }\n    gtag('js', new Date());\n    gtag('config', uaId);\n  };\n\n  document.head.appendChild(script);\n\
    }, 1000);\n```\n\n## 想来点更实在的？\n\n美味的小零食或许能暂时缓解饥饿，但很快你又会饥肠辘辘！下一章将提供更实在、更能提升性能的优化方案。\n\
    \n# 简易优化方案\n\n## 第 4 章\n\n本章提供的技巧需要付出更多努力，但对新旧网站产生的性能提升可能更为显著。在深入探讨图像、媒体、字体、CSS\
    \ 动画以及一些有争议的话题之前，我们首先解决一些最简单但最有效的数据库优化问题。\n\n## 优化你的数据库\n\n数据库访问通常是服务器上最大的处理瓶颈。如果你的数据库难以应对用户需求，那么优化前端性能可能是徒劳的。\n\
    \n数据库类型多种多样，但常见的性能解决方案将在以下部分描述。\n\n## 使用查询分析器\n\n大多数数据库提供工具来描述查询是如何被处理的。这些工具可以识别缺失的索引或其他性能问题。许多\
    \ SQL 和 NoSQL 数据库提供了 `EXPLAIN` 子句或选项：\n\n- MySQL EXPLAIN\n- PostgreSQL EXPLAIN\n\
    - SQLite EXPLAIN\n- SQL Server EXPLAIN\n- Oracle EXPLAIN PLAN\n- MongoDB .explain()\n\
    - Couchbase EXPLAIN\n\n输出结果可能很复杂、冗长，并且超出了本书的范围。请查阅相关文档，并寻找能帮助理解问题的工具。\n\n通常可以调整数据库日志以记录长时间运行的查询，你可能会发现一些开源或商业产品来帮助优化数据。\n\
    \n## 创建索引\n\n许多数据库性能问题可以通过索引来解决。**索引**的工作原理与书中的索引相同：它允许数据库根据按特定顺序定义的条目列表，快速跳转到一条记录。\n\
    \n考虑一个 `user` 表，包含 ID（数字）、姓名、电子邮件和哈希后的密码。ID 可能是主键，表按该值排序。查询特定 ID 很快，因为数据库可以使用高效的搜索算法。例如，它可以从中间的记录开始，如果其\
    \ ID 较高，则知道该记录必然在表的前半部分。\n\n然而，一个要求输入用户电子邮件和密码的登录表单必须通过电子邮件进行查询。这些电子邮件在 `user`\
    \ 表中是随机排序的，因此数据库必须检查每条记录，直到找到匹配项。表越大，查询就越慢。索引可以定义一个按字母顺序（或任何实用的顺序）排列的电子邮件列表。然后搜索算法可以使用该索引，通过电子邮件定位记录，其速度与通过\
    \ ID 搜索一样快。\n\n因此，应考虑在搜索查询中常用的任何字段（通常是 SQL `SELECT` 语句中的 `WHERE` 或 `JOIN` 子句）上创建索引。为每个字段添加索引很诱人，但创建的越多，所需空间越大，写入操作也越慢，因为所有索引都必须更新。\n\
    \n## 简化查询\n\n数据库需要做的工作越少，返回结果就越快。检查你的代码库中复杂的或多个依赖的查询，特别是那些自动生成或包含子查询的查询。通常可以提高搜索效率。\n\
    \n例如，考虑一个检索最畅销的五本书的查询。在兼容 MySQL 的 SQL 中：\n\n```sql\nSELECT title, author_id FROM\
    \ book ORDER BY sales DESC LIMIT 5;\n```\n"
