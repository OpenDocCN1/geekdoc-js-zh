    \ address during testing.\n\n### 2. Create a Web App Manifest\n\nThe web app manifest\
    \ provides information about your application, such as the name, description,\
    \ and images. These are used by the OS to configure home screen icons, splash\
    \ pages, and viewport settings.\n\nThe manifest is a JSON text file in the root\
    \ of your app. It must be served with a `Content-Type: application/manifest+json`\
    \ or `Content-Type: application/json` HTTP header:\n\n```\n{\n  \"lang\"     \
