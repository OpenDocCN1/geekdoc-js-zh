  md: "# Consider OS Fonts\n\nIt's possible to add dozens of fonts to a page ... but\
    \ that doesn't mean you should!\n\n+   1. Designers recommend [using fonts sparingly](using\
    \ fonts sparingly), with one or two typefaces per document.\n2. A custom font\
    \ typically requires a few hundred kilobytes of data. The more you add, the larger\
    \ the page weight, and the worse the performance.\n3. The days of every site using\
    \ standard OS fonts are over. Perhaps Helvetica, Times New Roman, or Comic Sans\
    \ would look good on your site?!\n\nUsing an OS font provides a noticeable performance\
    \ boost; there's no download delay or flash of unstyled or invisible text.\n\n\
    Each platform supplies different default fonts, but fallbacks can be specified\
    \ as well as the generic font family names of serif, sans-serif, monospace, cursive,\
    \ fantasy, and system-ui. For example:\n\n```\nbody {\n  font-family: Arial, Helvetica,\
    \ sans-serif;\n}\n```\n\nWeb apps may also feel more native if they use a standard\
    \ system font. The following stack implemented on GitHub.com targets system fonts\
