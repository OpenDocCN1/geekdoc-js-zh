    \ | 0 | 0 |\n| font | 0 | 0 |\n| other | 0 | 0 |\n| video | 0 | 0 |\n\n2-9. WebPageTest.org报告\n\
    \n顶部显示从A（好）到F（差）的评级报告：\n\n- **首字节时间**：接收第一个字节所花费的时间\n- **启用Keep-alive**：是否使用了持久HTTP连接？\n\
