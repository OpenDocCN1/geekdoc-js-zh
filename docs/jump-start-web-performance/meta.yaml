- img_proc: true
  md: "> Inline Data for Larger Images\nInline data should be avoided for larger images,\
    \ especially when regular changes will invalidate the whole style sheet cached\
    \ in the browser.\n\n# 3. Embed SVGs into the Page\n\nAn SVG can be embedded directly\
    \ into the HTML:\n\n```\n<body>\n  <svg class=\"mysvg\" xmlns=\"http://www.w3.org/2000/svg\"\
    \ viewBox=\"0 0 800 600\">\n    <circle cx=\"400\" cy=\"300\" r=\"50\" />\n  </svg>\n\
    </body>\n```\n\nThe SVG nodes become part of the DOM and can be styled or animated\
    \ directly using CSS:\n\n```\ncircle {\n  stroke-width: 1em;\n}\n\n.mysvg {\n\
    \  stroke-width: 5px;\n  stroke: #f00;\n  fill: #ff0;\n}\n```\n\nThis reduces\
    \ SVG code weight by reusing CSS styles, and it offers additional flexibility\
    \ such as alternative colors, hover effects, animation of specific elements, and\
    \ so on.\n\nUnfortunately, the SVG must be embedded into every page where it's\
    \ required. This will increase HTML weight, so embedding is generally best for\
    \ small or infrequently used SVGs."
