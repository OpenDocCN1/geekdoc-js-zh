    # Avoid Long-running Tasks


    Long-running tasks often trigger *unresponsive browser* messages, which prompt
    the user to halt JavaScript execution. Complex processing is best handled by a
    **Web Worker**, which allows a script to run in a background thread.


    Web Worker scripts are limited. They can’t interact with the page DOM, and must
    communicate with the main script using a message API, but they’re able to perform
    Ajax requests and launch their own child workers.


    # Bind Events Sparingly


    Applications can have dozens of event handlers. A handler function is registered
    to an event when it’s triggered on a specific DOM element—such as running the
    `doSomething()` function when a click is detected on the `myElement` node:


    ```

    myElement.addEventListener(''click'', doSomething);

    ```


    Each bound event has a performance hit. Ideally, you should only add events you
    require, return from handler functions quickly, and unbind using `removeEventListener`
    when an event is no longer necessary.


    Also be wary of quick-firing events such as `mousemove` and `scroll`, which can
    trigger rapid and wasteful rerunning of handler functions. One way around this
    is to use throttling to ensure an event is called no more than once every *N*
    milliseconds. For example:


    ```

    // thottle event to delay ms

