    ,\n      \"sizes\"           : \"512x512\",\n      \"type\"            : \"image/png\"\
    \n    }\n  ]\n}\n```\n\nA list of [manifest properties can be found on MDN](https://developer.mozilla.org),\
    \ or you can use the [Generate Web Manifest tool](https://app-manifest-serializer.netlify.app/).\n\
    \nA link to the manifest file is required in the `<head>` of all your pages:\n\
    \n```\n<link rel=\"manifest\" href=\"/app.webmanifest\">\n```\n\n### 3. Create\
