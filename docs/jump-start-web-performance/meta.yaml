    # Minimize Reflows


    When an element is added, modified, or removed from a page, it can trigger a cascade
    of layout changes to surrounding elements. For example, increasing a width by
    1px could result in a neighboring element wrapping to the next line, which pushes
    all subsequent content down the page. It''s therefore more efficient to make changes
    that can''t impact the layout. For example:


    +   - use `opacity` and/or `transform` to translate (move), scale, or rotate an
    element

    - limit the scope of the reflow by changing elements low in the DOM tree (those
    without deeply nested children)

    - update elements in their own `position: absolute;` or `position: fixed;` layer

    - modify hidden elements (`display: none;`), then show them after the change has
    been applied


