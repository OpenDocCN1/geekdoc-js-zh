    \nAMP 项目于 2015 年 10 月宣布。这是 Google 与 30 多家新闻出版商之间的合作项目，旨在提升移动网络性能。**AMP** 是一个开源\
    \ Web 组件框架，宣称“你可以轻松创建以用户为先的网站、故事、电子邮件和广告。”\n\nAMP 要求你将现有或原创内容发布为 AMP HTML 页面。AMP\
    \ HTML 是 HTML5 的一个子集，提供了一套有限的 Web 组件、样式、图片、视频和广告。功能和样式受到刻意限制，你无法添加自定义 JavaScript。大多数\
    \ AMP 页面都通过 Google 的 AMP 缓存提供服务——这是一个基于代理的 CDN，会为页面分配一个 Google 特定的 URL。这确保了通过\
    \ Google 的全球网络进行最优的内容分发。\n\nAMP 很快，因此本书会提到它。然而，尽管该项目可能始于崇高的目标，但 AMP 因更多地服务于 Google\
    \ 而非出版商和用户而受到批评，原因如下：\n\n-   AMP 不一定比你自己优化过的网站更快或更高效。\n-   除非你完全采用 AMP，否则必须复制现有的内容页面。\n\
    -   替代 URL 可能会让用户感到困惑。\n-   Google 获得了对你的内容、访客和数据的控制权。\n-   AMP 可能被视为开放网络的封闭替代方案。\n\
    \nGoogle 希望网络更快，但即使原始网站效率更高，AMP 页面在移动搜索结果中也会受到优待。\n\n最终，决定权在你手中。有 [WordPress 插件](https://wordpress.org/plugins/search/AMP/)和\
