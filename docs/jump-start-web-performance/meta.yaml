    > ### OS Fonts as Variable Font Fallback

    It’s possible to download a single variable font but retain multiple fonts for
    older browsers. Unfortunately, modern browsers will download every font specified,
    which negates any performance benefit. It’s therefore preferable to use an OS
    font as the fallback.


    # Use Modern CSS3 Layouts


    For many years, it’s been necessary to use CSS `floats` to lay out pages. The
    technique was always a hack and required considerable code, along with endless
    margin/padding tweaking to make the layout work. Even then, floats break at smaller
    screen sizes unless media queries are used.


    Floats are no longer necessary:


    +   - **Flexbox** should be used for one-dimensional layouts, which (can) wrap
    to the next row according to the widths of each block. It’s ideal for menus, image
    galleries, cards, etc. [Flexbox is supported by most browsers](https://caniuse.com/flexbox)
    including IE10+.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '**Grid** is for two-dimensional layouts with explicit rows and columns. It’s
    ideal for page layouts. **Grid is supported by most browsers**, although IE10/11
    use an older version of the standard.


    Both options are simpler to develop, use far less code, can adapt to any screen
    size, can remove the need for media queries, and render faster than floats because
    the browser can natively determine an optimum layout.


    > ## Fallbacks for Older Browsers

    It’s possible to use float-based fallbacks for older browsers. However, it’s often
    better to use a simpler, single-column layout rather than trying to emulate what
    you achieved using Flexbox or Grid. Pixel perfection is futile!


    # Remove Unused CSS


    The smaller your style sheet, the quicker it will download, the sooner it will
    parse, and the faster your page will become.


    We all start with good intentions, but CSS can bloat over time as the number of
    features increases. It’s easier to retain old, unnecessary code than remove it
    and risk breaking something. Those using a CSS framework such as Bootstrap may
    find they’re only using a fraction of the facilities.


    CSS removal recommendations:


    +   1. Organize CSS into smaller files (partials) with clear responsibilities
    (which can be concatenated into a single file at build time). It’s easier to remove
    a carousel widget if the CSS is clearly defined in `widgets/_carousel.css`.

    2. Consider naming methodologies such as **BEM** to aid the development of discrete
    components.

    3. Avoid deeply nested Sass/pre-processor declarations. The expanded code can
    become unexpectedly large.'
