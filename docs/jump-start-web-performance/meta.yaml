- img_proc: true
  md: 'Admitting your site has a performance problem is the first step on the road
    to recovery! This chapter provides a list of testing tools to help you understand
    issues using real data, showing how:


    +   1. the largest assets can be discovered

    2. the slowest network responses can be identified

    3. the reasons for poor browser performance can be diagnosed


    It may be necessary to run tests a few times to establish a measurable performance
    baseline. The same tests can then be rerun to evaluate performance improvements—or
    deteriorations—after code has been updated.


    # Create a Test Plan


    You should test your websites and applications for defects, ease of use, accessibility,
    quality assurance, and other factors. Evaluating performance is no different,
    and it''s best to follow a plan that lays out:


    +   1. who''s responsible for running tests

    2. what tools and settings will be used for each test

    3. how results will be recorded and fed back into the development process


    Use performance analysis tools manually at first to understand the reports and
    determine optimization priorities.


    As your processes evolve, it *may* become possible to automate these tests so
    developers are warned about potential problems and perhaps blocked from committing
    poorly optimized code. [Chapter 5](Chapter 5) describes several options for improving
    your workflow with build processes and performance budgets.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '**Automated vs Manual Testing**


    Automated tests are never a substitute for manual user testing! Tests are good
    at repeating operations to report faults, but they''re unlikely to discover issues
    you weren’t expecting.


    It’s possible to build a wholly [unusable site that fully passes automated testing](http://example.com).
    For example, a button could trigger a fast change to the page that shows skeleton
    content, while the real results take an hour to appear!


    # Identify Performance Bottlenecks


    Knowing you have a performance problem is one thing. Finding and fixing the causes
    is another matter.


    The first step is to identify whether the fault occurs server-side or client-side.
    A slow network response, either on the initial page load or during an Ajax request,
    will normally indicate a server issue. Database queries are often the culprit,
    but you’ll need to prove that! Existing tools and logs can help, but it may be
    necessary to output diagnostic information to a file in a similar way to other
    debugging activities.


    Client-side issues can be diagnosed using browser developer tools, as described
    below. Performance is affected when the browser has considerable work to do—such
    as a long-running JavaScript function, a DOM update that causes the page to re-layout,
    or CSS changes that affect many elements. The tips in Chapters 3, 4, and 5 provide
    solutions to typical problems.


    # Performance Tool Concepts


    Most of the tools described in this chapter diagnose a particular “page” in your
    site within the context of a web browser. They primarily analyze front-end performance,
    although a back-end server or database could be to blame for a large or slow response.
    ([Chapter 4](http://example.com) provides further information about potential
    back-end issues and database tools.)'
  merge: -1
