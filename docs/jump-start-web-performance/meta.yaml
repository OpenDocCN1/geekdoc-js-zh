  md: "optimization clean-up in <u>svgo</u> or <u>SVGOMG</u>.\n\nThere are three primary\
    \ ways to add an SVG to a web page. Choose the most appropriate option for each\
    \ graphic you're using.\n\n# 1. Add SVGs Using an <img> Tag\n\nThe SVG acts like\
    \ any normal image: it can be cached and reused on other pages.\n\nFor security\
    \ reasons, browsers will disable embedded scripts, links, and other types of interactivity.\
    \ Some browsers won't apply style sheet rules defined in a separate CSS file.\n\
    \nThe lesser-used `<object>`, `<embed>`, and `<iframe>` elements can circumvent\
    \ these restrictions, but the browser treats the image as another document, so\
    \ performance could be affected.\n\n# 2. Add SVGs as CSS Background Images\n\n\
    An SVG can be referenced as a URL in a background image:\n\n```\n.mysvgbackground\
    \ {\n    background-image: url('image.svg');\n}\n```\n\nIt can also be embedded\
    \ inline:\n\n```\n.mysvgbackground {\n    background-image: url('data:image/svg+xml;utf8,<svg\
    \ xmlns=\"http://www.w3.org/2000/\\nsvg\" viewBox=\"0 0 800 600\"><circle cx=\"\
    400\" cy=\"300\" r=\"50\" stroke-width=\"5\"\\nstroke=\"#f00\" fill=\"#ff0\" /></svg>');\n\
    }\n```\n\nLike `<img>`, the browser will block embedded scripts, links, and other\
    \ SVG interactions, but backgrounds can be useful for regularly used icons."
