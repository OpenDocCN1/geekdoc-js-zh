- md: "## Jump Start Web Performance\n\n4-4. A smartphone landscape image\n\nUsing\
    \ art direction, we can serve a more appropriate image showing the main subject\
    \ with less background detail:\n\n4-5. A portrait image\n\nThis looks better on\
    \ a smartphone held in portrait orientation and, in this case, the file size is\
    \ 65% smaller (59KB compared to 168KB):\n\n4-6. A smartphone portrait image\n\n\
    The `<source>` items in a `<picture>` element can set media queries to determine\
    \ which image is requested. For example, use `landscape.jpg` when the viewport\
    \ width is greater than the height, or fall back to `portrait.jpg` otherwise:\n\
    \n```html\n<picture>\n  <source srcset=\"landscape.jpg\"\n          media=\"(min-aspect-ratio:1/1)\"\
    \ />\n  <img src=\"portrait.jpg\" alt=\"portrait image\" />\n</picture>\n```\n\
    \nAny number of `<source>` images can be defined with differing media queries.\
    \ Each is processed in the specified order until a match is found. A default `<img>`\
    \ should always be set as a fallback when no match is available, or for older\
    \ browsers that don't support `<picture>`.\n\n## Lazy Load Images and Iframes\n\
    \nThe average web page requests almost 1MB of images. Half of all websites load\
    \ significantly more! These images (and embedded `<iframe>` elements) download\
    \ regardless of whether they're viewed or not. A large off-screen image requires\
    \ bandwidth and processing even when the user clicks a link at the top of the\
    \ page and never scrolls down.\n\nLoad times, bandwidth, and device requirements\
    \ can be reduced by lazy loading images and iframes when they're scrolled into\
    \ the viewport. Chrome 76 and above support native lazy loading with the new `loading`\
    \ attribute:\n\n```html\n<img src=\"image.png\" loading=\"lazy\" alt=\"lazy load\"\
    \ />\n<iframe src=\"https://site.com/\" loading=\"lazy\"></iframe>\n```\n\nThe\
    \ following values can be set:\n\n-   `auto`: the browser's default behavior (identical\
    \ to not using the attribute)\n-   `lazy`: defer loading until the resource reaches\
    \ a distance from the viewport\n-   `eager`: load the resource immediately\n\n\
    The *distance from the viewport* can vary according to the type of resource, the\
    \ network connection, and whether Lite mode/Save-Data is enabled. (Lite mode/Save-Data\
    \ is covered later in this chapter.)\n\nNative lazy loading is new, so non-Chrome\
    \ and older browsers require JavaScript-based solutions such as [progressive-image.js](https://progressive-image.js/).\
    \ These analyze scroll and resize events or use the [Intersection Observer API](https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API)\
    \ to determine when an element is in view. As well as supporting more browsers,\
    \ they can also implement attractive loading effects.\n\n4-7. The initial, low-resolution\
    \ image loaded in the browser\n\n4-8. The full image in view\n\n## Play Audio\
    \ and Video on Demand\n\nAuto-playing media saps bandwidth, degrades performance,\
    \ and is unlikely to be appreciated by users. Modern browsers will also block\
    \ or silence auto-playing by default.\n\nIn most cases, it's preferable to show\
    \ a thumbnail image—perhaps with a *play* icon overlay—which the user can click\
    \ to start the media. Both the `<video>` and `<audio>` elements support this feature\
    \ with the following attributes:\n\n-   `autoplay=\"false\"` to stop auto-playing\n\
    -   `preload=\"none\"` to prevent media preloading or `preload=\"metadata\"` to\
    \ fetch meta data such as the video duration\n-   `poster=\"image.jpg\"` to show\
    \ a thumbnail image\n-   `controls=\"true\"` to enable native playback controls\n\
    \nHere's an example:\n\n```html\n<video controls=\"true\"\n       autoplay=\"\
    false\"\n       preload=\"metadata\"\n       poster=\"videothumb.jpg\">\n  <source\
    \ src=\"video.mp4\" type=\"video/mp4\">\n  <source src=\"video.webm\" type=\"\
    video/webm\">\n</video>\n```\n\nAlternatively, a JavaScript solution could be\
    \ implemented that replaces a (lazy loaded) `<img>` with appropriate `<video>`\
    \ or `<audio>` elements when clicked. The solution could also work for third-party\
    \ video providers such as YouTube and Vimeo, which provide custom video players.\n\
    \n## Replace Images with CSS3 Effects\n\nThe days of slicing and dicing images\
    \ in a graphic package to create custom fonts, rounded corners, shadows, linear\
    \ gradients, and transparency effects have long gone. CSS3 options such as web\
    \ fonts, border-radius, text-shadow, box-shadow, opacity, and gradients have been\
    \ supported by most browsers for some time.\n\nShadow, color gradients, and opacity\
    \ are quicker to implement, easier to change, and require far fewer bytes than\
    \ images.\n\nAn element, image, or background image can be manipulated using CSS3\
    \ effects rather than having to create multiple variations. For example:\n\n-\
    \   The clip-path and mask properties can partially or fully hide parts of an\
    \ image or element to create non-rectangular shapes.\n-   The shape-outside, shape-margin,\
    \ and shape-image-threshold properties can be used to define non-rectangular text\
    \ flows around or within an element.\n-   The transform property can rotate, scale,\
    \ and skew an element.\n-   The filter property offers possibilities such as blurring,\
    \ brightness, contrast, hue rotation, inversion, saturation, grayscale, sepia,\
    \ opacity, and shadows.\n-   Both background-blend-mode and mix-blend-mode control\
    \ how backgrounds and images blend with each other in a similar way to Photoshop\
    \ layers. Options include normal, multiply, screen, overlay, darken, lighten,\
    \ color-dodge, color-burn, hard-light, soft-light, difference, exclusion, hue,\
    \ saturation, color, and luminosity.\n\n> **CSS3 Effects Can Be Costly**\n>\n\
    > CSS shadows, gradients, and filters may be costly during browser repaints. Use\
    \ the effects sparingly and test their impact on scrolling and animation performance.\n\
    \n## Use SVGs Effectively\n\n**Scalable Vector Graphics** define points, lines,\
    \ and shapes as vectors in XML. Unlike bitmaps, SVG images can be scaled to any\
    \ dimensions without increasing the file size or losing quality. This makes them\
    \ ideal for logos, charts, and diagrams.\n\nIt’s possible to create and manipulate\
    \ SVGs manually, on the server, or in client-side JavaScript. However, more complex\
    \ images will require a graphics package such as Adobe Illustrator, Affinity Designer,\
    \ Inkscape, or SVG edit, followed by an optimization clean-up in [svgo](https://github.com/svg/svgo)\
    \ or [SVGOMG](https://jakearchibald.github.io/svgomg/).\n\nThere are three primary\
    \ ways to add an SVG to a web page. Choose the most appropriate option for each\
    \ graphic you're using.\n\n### 1. Add SVGs Using an `<img>` Tag\n\nThe SVG acts\
    \ like any normal image: it can be cached and reused on other pages.\n\nFor security\
    \ reasons, browsers will disable embedded scripts, links, and other types of interactivity.\
    \ Some browsers won't apply style sheet rules defined in a separate CSS file.\n\
    \nThe lesser-used `<object>`, `<embed>`, and `<iframe>` elements can circumvent\
    \ these restrictions, but the browser treats the image as another document, so\
    \ performance could be affected.\n\n### 2. Add SVGs as CSS Background Images\n\
    \nAn SVG can be referenced as a URL in a background image:\n\n```css\n.mysvgbackground\
    \ {\n    background-image: url('image.svg');\n}\n```\n\nIt can also be embedded\
    \ inline:\n\n```css\n.mysvgbackground {\n    background-image: url('data:image/svg+xml;utf8,<svg\
    \ xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\"><circle cx=\"400\"\
    \ cy=\"300\" r=\"50\" stroke-width=\"5\" stroke=\"#f00\" fill=\"#ff0\" /></svg>');\n\
    }\n```\n\nLike `<img>`, the browser will block embedded scripts, links, and other\
    \ SVG interactions, but backgrounds can be useful for regularly used icons.\n\n\
    > Inline Data for Larger Images\n>\n> Inline data should be avoided for larger\
    \ images, especially when regular changes will invalidate the whole style sheet\
    \ cached in the browser.\n\n### 3. Embed SVGs into the Page\n\nAn SVG can be embedded\
    \ directly into the HTML:\n\n```html\n<body>\n  <svg class=\"mysvg\" xmlns=\"\
    http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n    <circle cx=\"400\"\
    \ cy=\"300\" r=\"50\" />\n  </svg>\n</body>\n```\n\nThe SVG nodes become part\
    \ of the DOM and can be styled or animated directly using CSS:\n\n```css\ncircle\
    \ {\n  stroke-width: 1em;\n}\n\n.mysvg {\n  stroke-width: 5px;\n  stroke: #f00;\n\
    \  fill: #ff0;\n}\n```\n\nThis reduces SVG code weight by reusing CSS styles,\
    \ and it offers additional flexibility such as alternative colors, hover effects,\
    \ animation of specific elements, and so on.\n\nUnfortunately, the SVG must be\
    \ embedded into every page where it's required. This will increase HTML weight,\
    \ so embedding is generally best for small or infrequently used SVGs."
  mdcn: "\n## 快速提升 Web 性能\n\n4-4. 智能手机横屏图片\n\n通过运用艺术设计方向，我们可以提供更合适的图片，在显示主要主题的同时减少背景细节：\n\
    \n4-5. 竖屏图片\n\n这张图片在竖屏持握的智能手机上看起来更好，而且在这种情况下，文件大小减少了 65%（59KB 对比 168KB）：\n\n4-6.\
    \ 智能手机竖屏图片\n\n`<picture>` 元素中的 `<source>` 项可以设置媒体查询，以确定请求哪张图片。例如，当视口宽度大于高度时使用\
    \ `landscape.jpg`，否则回退到 `portrait.jpg`：\n\n```html\n<picture>\n  <source srcset=\"\
    landscape.jpg\"\n          media=\"(min-aspect-ratio:1/1)\" />\n  <img src=\"\
    portrait.jpg\" alt=\"portrait image\" />\n</picture>\n```\n\n可以定义任意数量的带有不同媒体查询的\
    \ `<source>` 图片。每个 `<source>` 按指定的顺序处理，直到找到匹配项。当没有匹配项可用，或者对于不支持 `<picture>` 的旧版浏览器，应始终设置一个默认的\
    \ `<img>` 作为后备方案。\n\n## 延迟加载图片和 Iframe\n\n平均每个网页请求近 1MB 的图片。其中一半的网站加载的图片量远超于此！这些图片（以及嵌入的\
    \ `<iframe>` 元素）无论是否被查看都会下载。即使用户点击页面顶部的链接并且从不向下滚动，一张大的屏幕外图片也需要消耗带宽和处理资源。\n\n通过延迟加载图片和\
    \ iframe，可以在它们滚动进入视口时减少加载时间、带宽和设备要求。Chrome 76 及更高版本通过新的 `loading` 属性支持原生延迟加载：\n\
    \n```html\n<img src=\"image.png\" loading=\"lazy\" alt=\"lazy load\" />\n<iframe\
    \ src=\"https://site.com/\" loading=\"lazy\"></iframe>\n```\n\n可以设置以下值：\n\n- \
    \  `auto`：浏览器的默认行为（与不使用该属性相同）\n-   `lazy`：延迟加载，直到资源距离视口一定距离\n-   `eager`：立即加载资源\n\
    \n*距离视口的距离*可能因资源类型、网络连接以及是否启用了精简模式/节省数据功能而异。（精简模式/节省数据功能将在本章后面介绍。）\n\n原生延迟加载是一项新功能，因此非\
    \ Chrome 浏览器和旧版浏览器需要基于 JavaScript 的解决方案，例如 [progressive-image.js](https://progressive-image.js/)。这些解决方案分析滚动和调整大小事件，或使用\
    \ [Intersection Observer API](https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API)\
    \ 来确定元素何时进入视图。除了支持更多浏览器外，它们还可以实现吸引人的加载效果。\n\n4-7. 浏览器中加载的初始低分辨率图片\n\n4-8. 进入视图的完整图片\n\
    \n## 按需播放音频和视频\n\n自动播放媒体会消耗带宽，降低性能，而且用户不太可能喜欢。现代浏览器默认也会阻止或静音自动播放。\n\n在大多数情况下，最好显示一个缩略图——可能带有叠加的*播放*图标——用户可以点击它来开始播放媒体。`<video>`\
    \ 和 `<audio>` 元素都支持此功能，并具有以下属性：\n\n-   `autoplay=\"false\"` 以停止自动播放\n-   `preload=\"\
    none\"` 以防止媒体预加载，或 `preload=\"metadata\"` 以获取元数据，如视频持续时间\n-   `poster=\"image.jpg\"\
    ` 以显示缩略图\n-   `controls=\"true\"` 以启用原生播放控件\n\n以下是一个示例：\n\n```html\n<video controls=\"\
    true\"\n       autoplay=\"false\"\n       preload=\"metadata\"\n       poster=\"\
    videothumb.jpg\">\n  <source src=\"video.mp4\" type=\"video/mp4\">\n  <source\
    \ src=\"video.webm\" type=\"video/webm\">\n</video>\n```\n\n或者，可以实现一个 JavaScript\
    \ 解决方案，在点击时将一个（延迟加载的）`<img>` 替换为适当的 `<video>` 或 `<audio>` 元素。该解决方案也适用于第三方视频提供商，如\
    \ YouTube 和 Vimeo，它们提供自定义视频播放器。\n\n## 用 CSS3 效果替代图片\n\n在图形软件包中切割拼凑图片以创建自定义字体、圆角、阴影、线性渐变和透明效果的时代早已过去。CSS3\
    \ 选项，如网络字体、边框半径、文本阴影、框阴影、不透明度和渐变，已被大多数浏览器支持了一段时间。\n\n阴影、颜色渐变和不透明度的实现速度更快，更改更容易，并且比图片所需字节数少得多。\n\
    \n可以使用 CSS3 效果来操纵一个元素、图片或背景图片，而无需创建多个变体。例如：\n\n-   `clip-path` 和 `mask` 属性可以部分或完全隐藏图片或元素的部分，以创建非矩形形状。\n\
    -   `shape-outside`、`shape-margin` 和 `shape-image-threshold` 属性可用于定义围绕或位于元素内部的非矩形文本流。\n\
    -   `transform` 属性可以旋转、缩放和倾斜元素。\n-   `filter` 属性提供了多种可能性，如模糊、亮度、对比度、色相旋转、反转、饱和度、灰度、深褐色调、不透明度和阴影。\n\
    -   `background-blend-mode` 和 `mix-blend-mode` 都控制背景和图片如何相互混合，其方式类似于 Photoshop\
    \ 图层。选项包括正常、正片叠底、滤色、叠加、变暗、变亮、颜色减淡、颜色加深、强光、柔光、差值、排除、色相、饱和度、颜色和明度。\n\n> **CSS3 效果可能代价高昂**\n\
    >\n> CSS 阴影、渐变和滤镜在浏览器重绘期间可能代价高昂。谨慎使用这些效果，并测试它们对滚动和动画性能的影响。\n\n## 有效使用 SVG\n\n\
    **可缩放矢量图形**在 XML 中将点、线和形状定义为矢量。与位图不同，SVG 图片可以缩放到任意尺寸而不会增加文件大小或损失质量。这使得它们非常适合用于徽标、图表和图形。\n\
    \n可以手动创建和操作 SVG，在服务器端操作，或在客户端 JavaScript 中操作。但是，更复杂的图片将需要图形软件包，如 Adobe Illustrator、Affinity\
    \ Designer、Inkscape 或 SVG Edit，然后在 [svgo](https://github.com/svg/svgo) 或 [SVGOMG](https://jakearchibald.github.io/svgomg/)\
    \ 中进行优化清理。\n\n将 SVG 添加到网页有三种主要方式。为每个使用的图形选择最合适的选项。\n\n### 1. 使用 `<img>` 标签添加 SVG\n\
    \nSVG 的行为类似于任何普通图片：它可以被缓存并在其他页面上重用。\n\n出于安全原因，浏览器会禁用嵌入的脚本、链接和其他类型的交互性。一些浏览器不会应用在单独\
    \ CSS 文件中定义的样式表规则。\n\n较少使用的 `<object>`、`<embed>` 和 `<iframe>` 元素可以规避这些限制，但浏览器将图片视为另一个文档，因此性能可能会受到影响。\n\
    \n### 2. 将 SVG 添加为 CSS 背景图片\n\nSVG 可以在背景图片中作为 URL 引用：\n\n```css\n.mysvgbackground\
    \ {\n    background-image: url('image.svg');\n}\n```\n\n它也可以内联嵌入：\n\n```css\n\
    .mysvgbackground {\n    background-image: url('data:image/svg+xml;utf8,<svg xmlns=\"\
    http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\"><circle cx=\"400\" cy=\"\
    300\" r=\"50\" stroke-width=\"5\" stroke=\"#f00\" fill=\"#ff0\" /></svg>');\n\
    }\n```\n\n与 `<img>` 类似，浏览器会阻止嵌入的脚本、链接和其他 SVG 交互，但对于经常使用的图标，背景图片会很有用。\n\n> 较大图片的内联数据\n\
    >\n> 对于较大的图片，应避免使用内联数据，尤其是当经常性的更改会使浏览器中缓存的整个样式表失效时。\n\n### 3. 将 SVG 嵌入页面\n\nSVG\
    \ 可以直接嵌入 HTML：\n\n```html\n<body>\n  <svg class=\"mysvg\" xmlns=\"http://www.w3.org/2000/svg\"\
    \ viewBox=\"0 0 800 600\">\n    <circle cx=\"400\" cy=\"300\" r=\"50\" />\n  </svg>\n\
    </body>\n```\n\nSVG 节点成为 DOM 的一部分，可以直接使用 CSS 设置样式或动画：\n\n```css\ncircle {\n  stroke-width:\
    \ 1em;\n}\n\n.mysvg {\n  stroke-width: 5px;\n  stroke: #f00;\n  fill: #ff0;\n\
    }\n```\n\n这通过重用 CSS 样式减少了 SVG 代码的体积，并提供了额外的灵活性，例如替代颜色、悬停效果、特定元素的动画等。\n\n不幸的是，SVG\
    \ 必须嵌入到需要它的每个页面中。这将增加 HTML 的体积，因此嵌入通常最好用于小型或不经常使用的 SVG。\n"
