    \n# 第 1 章：Web 性能的重要性\n\n## 性能低下的代价\n\n网络臃肿、下载缓慢和性能低下影响着每一个人——网站用户、在线企业主，甚至那些从未访问过网络的人。\n\
    \n## 用户代价\n\n在2020年初，一个典型的网页包含：\n\n-   27KB 的 HTML 内容\n-   64KB 的 CSS，分布在七个样式表中\n\
    -   四种字体，总计 122KB\n-   410KB 的 JavaScript，分布在 20 个源文件中\n-   31 张图片，需要 980KB 的带宽（*其中三分之一在屏幕外，可能永远不会被查看！*）\n\
    \n## 2020 年平均页面大小：1,940KB\n\n![1-1. 2020年平均页面大小](img/d93d5aab668f52eb84bb477fd9a96986_12_0.png)\n\
    \n总计：1,940KB 的数据通过 74 个 HTTP 请求传输，在全球普通用户的桌面上完全显示需要七秒。在移动设备上，这个时间会增加到令人沮丧的20秒。（来源：[HTTP\
    \ Archive](https://httparchive.org/)，该网站分析了五百万个热门内容网站。）\n\n在美国，使用典型手机下载这个网页需要花费\
    \ 0.20 美元。在瓦努阿图、毛里塔尼亚和马达加斯加浏览的用户，为了查看单个页面需要支付超过其日收入 1% 的费用——尽管该页面仅包含 27KB 潜在可读的内容。（来源：[whatdoesmysitecost.com](https://whatdoesmysitecost.com/)。）\n\
    \n## 商业代价\n\n缓慢、臃肿的页面对业务不利：\n\n1.  页面下载量越大，用户体验越差，用户考虑购买或回访的可能性就越低。\n2.  55% 的访问者使用移动设备。这些设备功能更有限，并且可能连接到更慢的网络，这加剧了问题。（来源：statcounter.com。）\n\
    3.  谷歌的页面速度算法会降低慢速网站的排名，这损害了搜索引擎优化工作。\n4.  更多的数据会导致更高的托管、存储和带宽成本。\n5.  你的代码库越大，更新和维护所需的时间就越长。\n\
    \n## 环境代价\n\n互联网消耗 420 太瓦时（TWh）——或*高达10%*——的全球电力消耗。这占全球温室气体排放量的 4%，与航空业相当。考虑到网络基础设施和流量，一次页面加载估计会排放\
    \ 1.3 克二氧化碳。（来源：websitecarbon.com。）\n\n虽然网络通过提供旅行和邮递的虚拟替代方案减少了能源使用，但那些 1MB 的主图仍然对环境有影响。\n\
    \n## 糟糕网络状况的原因\n\n当性能差的网站运行成本更高、访问者更少、转化率更低时，它们为何还能如此普遍？\n\n主要原因是：*与其他功能相比，性能优先级较低*。\n\
    \n添加更多东西很容易。优化或移除不必要的垃圾则更困难。我们害怕破坏网站或访客使用模式，因此更容易为不解决性能问题找借口。\n\n### 借口 #1：“我们没有性能问题！”\n\
    \n你使用的是最新的电脑或智能手机，并且连接在快速的网络上吗？试试中端、两年前的设备。试试将带宽限制到你所在国家的平均速度。试试在VPN或酒店Wi-Fi上使用你的网站。\n\
    \n### 借口 #2：“我们的用户从不抱怨？”\n\n可能是因为他们放弃了你的网站并且再也没回来。当竞争内容和服务只需点击几下即可获得时，很少有人会费心投诉。\n\
    \n### 借口 #3：“我们的用户拥有高端设备”\n\n当网站只能在拥有最新设备和快速连接的人群中查看时，这种假设就变成了一个自我实现的预言。\n\n如果更多的人能够访问你的服务，你的收入会增加吗？你是否考虑了亚洲、非洲和南美等市场的网络爆炸式增长，那里的智能手机和网络容量可能更有限？\n\
    \n### 借口 #4：“我们的用户使用现代浏览器”\n\n一个常见的误解是，1%的用户会禁用JavaScript或阻止其他浏览器功能，如图片或CSS——例如，那些使用屏幕阅读器的用户。这可能是一个相当大的数量，但这却被用作借口，以歧视某些群体为代价来简化开发，并避免在能力较弱的设备上解决性能问题。\n\
    \n实际上，阻止资源的不是1%的*用户*，而是1%的*访问量*。每个用户最终都会遇到某些东西损坏的情况，例如当：\n\n-   一个或多个文件下载失败\n\
    -   防火墙或互联网服务提供商阻止某些资源\n-   使用屏幕阅读器或较旧的设备时\n"
