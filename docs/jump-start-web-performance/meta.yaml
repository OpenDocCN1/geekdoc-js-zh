  md: 'The results contain an `author_id` reference, so five further queries are made
    to fetch author names. For example:


    ```

    SELECT firstname, lastname FROM author WHERE author_id = 14;

    SELECT firstname, lastname FROM author WHERE author_id = 52;

    SELECT firstname, lastname FROM author WHERE author_id = 50;

    SELECT firstname, lastname FROM author WHERE author_id = 22;

    SELECT firstname, lastname FROM author WHERE author_id = 20;

    ```


    This is known as the **N+1 problem**: a large set of queries must be made for
    the parent records and each result.


    A more efficient option would be to fetch all the authors in a single query:


    ```

    SELECT firstname, lastname FROM author WHERE author_id IN (14,52,50,22,20);

    ```


    Performance can be improved further with a single query that can be optimized
    by the database:


    ```

    SELECT book.title, author.firstname, author.lastname

    FROM book

    LEFT JOIN author ON book.author_id = author.id

    ORDER BY sales DESC LIMIT 5;

    ```


    # Create Additional Database Connections


    Many web applications create a single database connection object that''s used
    for all queries and updates. Unfortunately, some databases queue all incoming
    requests from a single connection and process them in order. If one user runs
    a complex operation that takes 20 seconds to complete, every other user will have
    to wait at least 20 seconds for their operation to be processed.


    Connection queuing issues will be more evident on continually running applications
    such those implemented in Node.js. PHP applications are usually served by a web
    server, which creates separate threads with new connection objects on every request,
    although pooling solutions may be in place.'
