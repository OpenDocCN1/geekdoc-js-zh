    浏览器不支持特定功能

    -   浏览器扩展程序会阻止、破坏或修改代码

    -   浏览器在慢速连接时会禁用 JavaScript


    构建能够应对这些情况的健壮、高性能应用程序是完全可能的。你的应用做到了吗？


    ## 借口 #5：“我们稍后再处理性能问题”


    > 过早优化是万恶之源。


    这句话被认为出自唐纳德·克努特，来自他的论文《使用 `go to` 语句的结构化编程》。它指的是程序员在非紧急问题上浪费时间进行优化——例如，一家初创公司试图确保其应用程序能够扩展到数百万用户。


    在完整语境下的引述是：


    > 我们应该忘掉小的效率提升，大约97%的时间都应如此：过早优化是万恶之源。然而，我们不应放弃那关键的3%的机会。


    在你拥有数百万用户之前，你需要确保最初几十个人愿意使用你的产品。在早期阶段，后端服务器或数据库的低效不太可能成为主要问题。


    然而，前端性能可以成就或毁掉一个应用。它可能是你“关键的3%”的一部分，并且从一开始就着手优化会更容易。


    # Web 性能至关重要


    ## 借口 #6：“某些系统需要更多带宽和处理能力”


    像 Gmail、地图、社交网络、游戏和图片库这样的复杂 Web 应用，将比内容网站需要更多的带宽和处理能力。性能仍然是一个关键问题，但可以预期更高的页面体积和更慢的加载时间。


    然而，[HTTP Archive](http://httparchive.org) 爬取的是文章和在线商店。它并不查看 Web 应用程序。平均 2MB 的网站页面体积相当于莎士比亚所有戏剧的一半，或者
    [DOOM](http://doom.com) 在 1993 年的磁盘发行版——*而单个页面通常只包含几段内容*。因此，没有理由不去关注性能。


    ## 借口 #7：“页面体积膨胀是进步的代价”


    对于某些边缘情况，这可能是真的。然而，在 1990 年代末的拨号上网时代，开发者们努力将页面大小保持在 100KB 以下。自那时起，Web 内容的质量或速度提高了
    20 倍吗？


    ## 借口 #8：“精简页面意味着降低功能，减少特性和效果”


    性能通常可以通过最小的努力来提升，而不会损失功能。


    随着 Web 浏览器的进化，你可以用更少的资源做更多事。考虑一下 CSS3 的 `border-radius` 属性：添加圆角现在只需要几字节的代码，而十年前则需要多种图片技巧。


    ## 借口 #9：“提高性能会增加复杂性和维护工作”


    移除未使用或不必要的图片、视频、字体、CSS 和 JavaScript 将会简化你的网站。这应该会减少复杂性和维护工作。


    ## 借口 #10：“我们的客户很满意！”


    客户聘请你是出于你的专业能力，将优化作为一个卖点将使你的业务从其他竞争对手中脱颖而出。


    Web 性能是 Web 开发者工作的重要组成部分。一点努力就能为每个人带来相当大的回报：


    -   需要的代码更少

    -   用户获得更流畅的体验

    -   搜索引擎排名得到提升

    -   转化率提高

    -   托管成本降低


    > *没有人会批评你构建了一个超快、响应迅速的网站！*


    ## 我该从哪里开始？


    下一章将介绍帮助你识别问题的工具。紧接着是几章以美食为灵感的章节：


    **第 3 章：快速零食** 一系列简单、实用、高性价比的性能解决方案，可以在几分钟内应用于任何网站。


    **第 4 章：简单食谱** 一些更复杂的开发选项，可能需要几小时或几天来实施，但可能产生更大的积极影响。


    **第 5 章：改变生活的饮食** 更激进的开发考虑因素和技术，最好从项目一开始就采用。


    页面体积缩减和优化技巧通常被归类为相似的概念，其中最容易或最有益的会先被介绍。


    那些试图改进现有网站的人应该按顺序阅读每一章。那些开始新项目的人可能会从逆序阅读章节中受益，因为更激进的方法在那时会变得可行。


    # 测试工具


    ## 第 2 章


    承认你的网站存在性能问题是迈向康复的第一步！本章提供了一份测试工具列表，帮助你利用真实数据理解问题，展示如何：


    1.  发现最大的资源

    2.  识别最慢的网络响应

    3.  诊断浏览器性能不佳的原因


    可能需要运行几次测试以建立可测量的性能基线。然后可以重新运行相同的测试来评估代码更新后的性能提升——或恶化。


    ## 创建测试计划


    你应该测试你的网站和应用程序的缺陷、易用性、可访问性、质量保证和其他因素。评估性能也无不同，最好遵循一个计划，明确：


    1.  谁负责运行测试

    2.  每个测试将使用哪些工具和设置

    3.  如何记录结果并将其反馈到开发流程中


    首先手动使用性能分析工具，以理解报告并确定优化优先级。


    随着流程的发展，*可能*可以实现这些测试的自动化，以便开发者收到潜在问题的警告，甚至可能阻止提交优化不佳的代码。[第 5 章](Chapter 5) 描述了使用构建流程和性能预算来改进工作流程的几种选择。


    ### 自动化测试与手动测试


    自动化测试永远无法替代手动用户测试！测试擅长重复操作以报告故障，但不太可能发现你意想不到的问题。


    有可能构建一个完全[无法使用但能通过所有自动化测试的网站](http://example.com)。例如，一个按钮可能触发页面的快速变化，显示骨架内容，而真正的结果需要一个小时才能出现！


    ## 识别性能瓶颈


    知道存在性能问题是一回事。找到并修复原因则是另一回事。


    第一步是识别故障发生在服务器端还是客户端。缓慢的网络响应，无论是在初始页面加载期间还是在 Ajax 请求期间，通常表明是服务器问题。数据库查询往往是罪魁祸首，但你需要证明这一点！现有的工具和日志可以提供帮助，但可能需要将诊断信息输出到文件中，类似于其他调试活动。


    客户端问题可以使用浏览器开发者工具进行诊断，如下所述。当浏览器需要执行大量工作时，性能会受到影响——例如，一个长时间运行的 JavaScript 函数、一个导致页面重新布局的
    DOM 更新，或影响许多元素的 CSS 变更。第 3、4、5 章的提示为典型问题提供了解决方案。


    ## 性能工具概念


    本章中描述的大多数工具都是在 Web 浏览器的上下文中诊断网站中的特定“页面”。它们主要分析前端性能，尽管后端服务器或数据库可能是大型或缓慢响应的罪魁祸首。（[第
    4 章](http://example.com) 提供了有关潜在后端问题和数据库工具的更多信息。）


    ## 浏览器渲染过程


    当用户首次访问一个网站或应用时，会发生以下步骤：


    1.  浏览器向特定 URL 发出 HTTP 请求。在底层，多个网络进程正在进行，将域名解析为 IP 地址并将请求路由到服务器。

    2.  服务器接收并解析请求。它会引用一个特定的 URL，并且可能在查询字符串、HTTP 头或消息体中附加了数据。它返回一个响应，在这种情况下，我们假设是
    HTML 内容。

    3.  浏览器开始接收 HTML 数据并进行解析。文档可能引用更多资源，如图片、字体、样式表和 JavaScript，这会触发对同一服务器或另一台服务器的额外
    HTTP 请求。

    4.  最终，浏览器有足够的信息开始渲染过程。在幕后，它已经开始构建 HTML DOM（文档对象模型），该模型以分层树结构定义页面。样式计算还确定哪些 CSS
    规则适用于每个 DOM 节点，并为 JavaScript 交互创建了 CSSOM（CSS 对象模型）。

    5.  浏览器启动**布局**（或**回流**）阶段。这计算每个元素的尺寸以及它如何影响周围元素的大小或位置。

    6.  布局之后是**绘制**阶段。这将每个元素的视觉部分绘制到单独的图层上——即文本、颜色、图片、边框、阴影等。

    7.  最后，**合成**阶段按正确的顺序将每个图层绘制到屏幕上。


    页面现在处于初始可查看状态。在渲染期间或之后，JavaScript 可以运行以发出进一步的 HTTP 请求（Ajax 或 WebSocket 调用）、执行计算、更新
    DOM 或应用 CSS 规则。这可能会触发进一步的布局、绘制和/或合成阶段。

