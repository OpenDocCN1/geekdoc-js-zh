  - '[PAGE 68]


    The results contain an `author_id` reference, so five further queries are made
    to fetch author names. For example:


    ```

    SELECT firstname, lastname FROM author WHERE author_id = 14;

    SELECT firstname, lastname FROM author WHERE author_id = 52;

    SELECT firstname, lastname FROM author WHERE author_id = 50;

    SELECT firstname, lastname FROM author WHERE author_id = 22;

    SELECT firstname, lastname FROM author WHERE author_id = 20;

    ```


    This is known as the **N+1 problem**: a large set of queries must be made for
    the parent records and each result.


    A more efficient option would be to fetch all the authors in a single query:


    ```

    SELECT firstname, lastname FROM author WHERE author_id IN (14,52,50,22,20);

    ```


    Performance can be improved further with a single query that can be optimized
    by the database:


    ```

    SELECT book.title, author.firstname, author.lastname

    FROM book

    LEFT JOIN author ON book.author_id = author.id

    ORDER BY sales DESC LIMIT 5;

    ```


    # Create Additional Database Connections


    Many web applications create a single database connection object that''s used
    for all queries and updates. Unfortunately, some databases queue all incoming
    requests from a single connection and process them in order. If one user runs
    a complex operation that takes 20 seconds to complete, every other user will have
    to wait at least 20 seconds for their operation to be processed.


    Connection queuing issues will be more evident on continually running applications
    such those implemented in Node.js. PHP applications are usually served by a web
    server, which creates separate threads with new connection objects on every request,
    although pooling solutions may be in place.'
  - '[PAGE 69]


    # Jump Start Web Performance


    To prevent database request queuing problems, consider these options:


    +   1. creating single-use connection objects for queries that could take time

    2. creating multiple connection objects for specific uses or which can be used
    in request order


    However, be wary of creating too many in-memory connection objects, which could
    lead to stability issues.


    # Consider a Server or Memory Upgrade


    Databases work more effectively when they have plenty of RAM. RAM allows the system
    to optimize frequently used queries and cache results in memory for fast access.


    Alternatively, you could consider using either:


    +   1. a separate database server

    2. multiple servers that either share processing or shard data into smaller silos

    3. a third-party database provider that handles the hard work for you


    # Cache Results


    It may not be necessary to perform queries every time a user requests a resource.
    Consider a statistical dashboard displaying various charts that are computationally
    expensive to create. The data could be fetched once from the database, cached
    in memory or a file, then returned on every subsequent request. The charts would
    be updated either when:


    +   1. data has changed

    2. a specific time has elapsed (such as ten minutes)

    3. a combination of factors is satisfied (such as when data has changed and'
  - '[PAGE 70]


    it''s at least five minutes since the last calculation)


    Solutions such as [Redis](https://redis.io/) and [memcached](https://memcached.org/)
    are often used for caching purposes.


    # Use Background Processing


    Consider a web application where a user can upload multiple images. These have
    metadata extracted, are resized, and have filters applied before data is stored
    in various tables.


    Rather than doing all this work in the web application at the point the request
    is made, the server could return a result immediately and offload processing to
    one or more background tasks. The application will feel more responsive, even
    though the final results may take a short while to appear.


    # Use Alternative Data Systems


    Examine alternative systems such as [Elasticsearch](https://www.elastic.co/),
    which provides faster, richer, and more appropriate search results than standard,
    full-text database queries. Background processes could populate Elasticsearch
    indexes, which are then used for search queries. While this now means you have
    two database systems to manage and optimize, it could reduce bottlenecks and improve
    functionality.


    # Remove or Optimize Social Media Buttons


    Social media sharing buttons are regularly added to websites to improve engagement
    and publicize content on other platforms:


    ![](img/d93d5aab668f52eb84bb477fd9a96986_70_0.png)


    Those innocent buttons have a high cost: *Facebook''s share button downloads 786KB
    of code (216KB gzipped)*. Twitter adds a further 151KB (52KB) and LinkedIn 182KB
    (55KB). Adding a few buttons considerably increases page weight, and processing
    a megabyte or two of JavaScript has a detrimental effect on performance—especially
    on mobile devices. That could be the start of your'
  - '[PAGE 71]


    problems, for various reasons listed below.


    +   - The code is not sitting idle. Regardless of whether or not someone clicks
    a button, your visitors are being monitored across your site and others.

    - You may be liable for the use—or misuse—of personal data. The European Court
    of Justice ruled in 2019 that sites voluntarily sharing visitor information with
    a social network are considered joint data controllers.

    - Third-party JavaScript is a security risk (see the next section).

    - Supporting every social media platform is impossible. You’re likely to miss
    options, and some services don’t provide sharing facilities.

    - Site engagement can be reduced if your visitors are tempted to stay on the social
    network.


    The risks are high, given just 0.2% of visitors use the buttons. (Sources: [GOV.UK](http://GOV.UK)
    and [Moovweb](http://Moovweb).)


    If your site owners understand the hazards but still want to keep the buttons,
    there’s a couple of options for retaining sharing without adversely affecting
    performance, privacy, and security.


    # Use URL-based Share Links


    Any page can be shared on Facebook with a link like this:


    ```

    https://www.facebook.com/sharer/sharer.php?u=${url}

    ```


    Likewise for Twitter:


    ```

    https://twitter.com/intent/tweet?url=${url}&text=${title}

    ```


    And LinkedIn:


    ```

    https://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${title}

    ```


    In these examples, `${url}` is the page URL and `${title}` is the title (perhaps'
  - '[PAGE 72]


    the text contained in the page''s <title> tag).


    Most social networks offer similar URL-based APIs. They''re lightweight and only
    activate when a user chooses to engage with the platform. You can implement these
    in standard `<a>` tags and, if necessary, intercept the click with JavaScript
    to open the link in a new window.


    # Use the Web Share API


    Visitors can use their browser''s **Share** facility to post URLs to social media
    apps as well as email, messaging, Pocket, WhatsApp, and more.


    ![](img/d93d5aab668f52eb84bb477fd9a96986_72_0.png)


    4-2. Browser share options


    The option is normally provided on mobile browsers, but it may not be obvious
    to users. Progressive Web Apps (see [Chapter 5](chapter5_url)) can also hide the
    browser interface.'
  - "[PAGE 73]\n\nFortunately, the [Web Share API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Share_API)\
    \ was introduced in [Chrome 76 on Android, Safari 12.3 on iOS, and Safari 12.1\
    \ on macOS](https://caniuse.com/#feat=web-share). The API hands information to\
    \ the host operating system, which knows which apps support sharing.\n\nThe sharing\
    \ UI can be shown in response to a user click. The following JavaScript checks\
    \ whether the Web Share API is supported, then adds a button click handler that\
    \ passes a `ShareData` object to `navigator.share()`: \n\n```\n// is the Web Share\
    \ API supported?\nif ( navigator.share ) {\n\n  // share button click handler\n\
    \  document.getElementById('share').addEventListener('click', () => {\n\n    'share'//\
    \ share page information\n    navigator.share({\n      url: 'https://example.com/',\n\
    \      title: 'My example page',\n      text: 'An example page implementing the\
    \ Web Share API.'\n    });\n\n  });\n\n}\n```\n\nThe `ShareData` object contains:\n\
    \n+   - `url`: the URL being shared (an empty string denotes the current page)\n\
    - `title`: the document title (perhaps the page's HTML `<title>` string)\n- `text`:\
    \ arbitrary body text (perhaps the page's `description` meta tag)\n\nUnlike with\
    \ share buttons, it's possible to share a page `#target` such as an individual\
    \ section or comment rather than the primary URL.\n\n`navigator.share()` returns\
    \ a Promise so `.then()` and `.catch()` blocks can be used if you need to perform\
    \ other actions or react to failures."
- md: "## Be Wary of Third-party Scripts\n\nAnalytics systems, advertising platforms,\
    \ social media buttons, and custom widgets often require you to add a third-party\
    \ `<script>` (from another domain). Those scripts may be huge or grow without\
    \ you realizing.\n\nThird-party scripts also run with the same site-wide rights\
    \ and permissions as your own code. As well as hindering performance, they can\
    \ track users, upload data elsewhere, change your content, redirect to other pages,\
    \ trigger e-commerce transactions, auto-click advertisements, or perform any other\
    \ malicious actions.\n\nYour performance, privacy, and security is only as good\
    \ as the weakest provider. Ensure third-party scripts:\n\n- are delivered over\
    \ HTTPS to eliminate man-in-the-middle attacks\n- use `<script crossorigin=\"\
    anonymous\">` to ensure there's no exchange of user credentials via cookies or\
    \ other technologies\n- set a `<script>` `integrity` attribute with a file hash\
    \ to reject any script that's been changed by the provider (refer to Subresource\
    \ Integrity on MDN)\n\nIdeally, move the script to your domain or remove it entirely.\n\
    \n### Third-party Script Used to Target Site\n\nBritish Airways was fined US$232\
    \ million in 2018 when 500,000 customers had their names, email addresses, and\
    \ full credit card information stolen during website transactions. The attack\
    \ originated from a third-party script that was modified to target BA, possibly\
    \ without the knowledge or consent of its supplier.\n\n## Use Responsive Images\n\
    \nThe `<img>` tag offers optional `srcset` and `sizes` attributes which are well-supported\
    \ in most browsers (except IE). These allow specific images to be requested according\
    \ to the size of the element and pixel density.\n\n## CSS Resolution\n\nModern\
    \ smartphones offer screens with very high native resolutions, known as HiDPI\
    \ or Retina displays. Each pixel is almost invisible to the naked eye, so the\
    \ browser implements a **CSS resolution** such as 360x760px, where the native\
    \ resolution could be 1440x3040px. The **display density** is therefore 4x, and\
    \ a single CSS pixel will be using 4x4 (16) physical pixels.\n\nGiven a 100x100px\
    \ space, it's usually optimal to load a 100x100px image. However, the image quality\
    \ can look comparatively poor on a 4x display density, so a 400x400px image could\
    \ be preferable. The `srcset` attribute can define appropriate images in a standard\
    \ `<img>` tag:\n\n```html\n<img width=\"100\" height=\"100\"\n     alt=\"responsive\
    \ image\"\n     src=\"img-100.jpg\"\n     srcset=\"img-100.jpg 1x,\n         \
    \    img-200.jpg 2x,\n             img-300.jpg 3x,\n             img-400.jpg 4x\"\
    \ />\n```\n\nThe browser will select and download the most appropriate image for\
    \ the display density. This ensures the best image quality without end users having\
    \ to download unnecessarily large images on all devices.\n\nThe image referenced\
    \ in the `src` attribute is used when the browser doesn't support `srcset`.\n\n\
    ## image-set() and Media Queries\n\nThe `CSS image-set() function` offers similar\
    \ options for background images, but support is currently limited.\n\nAn alternative\
    \ that works in most browsers is the `CSS resolution media query`, although the\
    \ code is more verbose.\n\nAlternatively, you can target images based on the rendered\
    \ width of the `<img>` element:\n\n```html\n<img alt=\"responsive image\"\n  \
    \  src=\"small.jpg\"\n    srcset=\"small.jpg 400w\n            large.jpg 800w\"\
    \ />\n```\n\nThe `w` unit defines the image file's actual **width** in pixels.\
    \ Don't use `px` as you would normally expect.\n\n`small.jpg` is used when the\
    \ viewport is below 400px, but `large.jpg` is used on screens where the CSS or\
    \ physical pixels exceed 400px.\n\nThis example is only practical when the image\
    \ is the full width of the viewport. The `sizes` attribute defines the size of\
    \ the image in relation to the viewport so the width can be calculated:\n\n```html\n\
    <img alt=\"responsive image\"\n    src=\"small.jpg\"\n    srcset=\"small.jpg 200w\n\
    \            large.jpg 400w\"\n    sizes=\"50vw\" />\n```\n\nThe image width is\
    \ `50vw` — half the viewport. `small.jpg` is used when the image width is `200px`\
    \ or less (the viewport is therefore less than `400px` ), but `large.jpg` is used\
    \ when the image width is greater.\n\nThe `sizes` attribute can contain complex\
    \ media queries and a final fallback size to determine the image width in multiple\
    \ viewport dimensions. For example:\n\n```html\n<img alt=\"responsive image\"\n\
    \    sizes=\"(max-width: 299px) 100vw,\n           (min-width: 300px) and (max-width:\
    \ 799px) calc(100vw - 60px),\n           50vw\" />\n```\n\n## The Bandwidth Cost\
    \ of Larger Images\n\nA 400x400px image could have a file size 16x greater than\
    \ its 100x100px equivalent. It requires considerably more bandwidth, which could\
    \ lead to a poor experience on a mobile network.\n\nPresume smaller images are\
    \ 20KB and the larger version is 200KB. Each page contains five images and 1,000\
    \ page views are made per day. The daily bandwidth saved by using smaller images\
    \ is 900MB — or *330GB per year*.\n\nA compromise — perhaps 200x200px — could\
    \ look reasonable without adversely affecting performance.\n\n## Define Responsive\
    \ Image Aspect Ratios\n\nSince the advent of responsive web design, developers\
    \ have been advised not to set `width` and `height` attributes on `<img>` tags.\
    \ The CSS then sets `width: 100%` or `max-width: 100%` to ensure the image is\
    \ sized to the width of its container or the maximum dimensions of the image accordingly.\n\
    \nThe technique has an unfortunate side-effect: *when images start to load, the\
    \ page must reflow to allocate space*. You'll often experience this on mobile\
    \ devices, where the text you're reading suddenly moves off-screen because an\
    \ image suddenly appears further up the page.\n\nAn aspect ratio defines the relationship\
    \ between the height and width, so it becomes possible to calculate the size when\
    \ only one dimension is known. From Firefox 71 and Chrome 79, the browser parses\
    \ `<img>` `width` and `height` attributes to calculate the aspect ratio. The appropriate\
    \ space can then be reserved so reflows aren't required:\n\n```html\n<!-- image\
    \ has a 4:3 aspect ratio -->\n<img src=\"image.jpg\" width=\"400\" height=\"300\"\
    \ alt=\"my image\" />\n```\n\n### Choosing Height and Width\n\nAny appropriate\
    \ width or height can be used to set the aspect ratio, since it will be resized\
    \ using CSS. For example, `width=\"4\" height=\"3\"`. That said, it's best to\
    \ set a reasonable size to ensure the image is visible in very old browsers, or\
    \ when CSS fails to load or is disabled.\n\nThe following CSS ensures the image\
    \ uses the full width of its container and sets a height according to the aspect\
    \ ratio:\n\n```css\nimg {\n  width: 100%;\n  height: auto; /* this is essential\
    \ */\n}\n```\n\nThe browser will reserve appropriate space on the page so re-flows\
    \ become unnecessary. Browsers that don't calculate the aspect ratio won't reserve\
    \ any space, but there are no downsides. The image will remain responsive.\n\n\
    ### HTML and CSS Proposals for Defining Aspect Ratios\n\nThere are also proposals\
    \ to define aspect ratios using an HTML `intrinsicssize=\"400x300\"` attribute\
    \ or a CSS `aspect-ratio: 4/3` property. These would provide alternative options\
    \ for avoiding reflows, so keep an eye on new browser releases!\n\n## Implement\
    \ Art Direction\n\nThe HTML `<picture>` element is similar to `<audio>` and `<video>`\
    \ in that it will request one of its child elements according to browser support\
    \ and conditions. For example, it can be used to load a smaller WebP image or\
    \ fall back to a standard JPG:\n\n```html\n<picture>\n  <source type=\"image/webp\"\
    \ srcset=\"image.webp\" />\n  <img src=\"image.jpg\" alt=\"JPG image\" />\n</picture>\n\
    ```\n\n### CDN and Server-side Solutions\n\nSome image CDNs and server-side solutions\
    \ can deliver the most optimum image based on the HTTP request, so just an `<img>`\
    \ tag would be required.\n\nThe `<picture>` element can also be used for art direction.\
    \ Different images are requested according to the dimensions and orientation of\
    \ a device. Consider the following hero photograph:\n\n![A landscape image](img/d93d5aab668f52eb84bb477fd9a96986_80_0.png)\n\
    \nThe landscape image looks reasonable on a typical desktop monitor, but detail\
    \ is lost on smaller devices held in portrait orientation. It would also become\
    \ difficult to overlay text in the smaller space."
  mdcn: "\n## 警惕第三方脚本\n\n分析系统、广告平台、社交媒体按钮以及自定义小部件通常需要你添加来自另一个域名的第三方`<script>`。这些脚本可能体积庞大，或在你未察觉的情况下不断增长。\n\
    \n第三方脚本也与你自己的代码一样，拥有相同的网站权限和许可。它们不仅会阻碍性能，还可能跟踪用户、将数据上传到其他地方、修改你的内容、重定向到其他页面、触发电子商务交易、自动点击广告或执行任何其他恶意操作。\n\
    \n你的性能、隐私和安全仅取决于最薄弱的提供者。请确保第三方脚本：\n\n- 通过 HTTPS 传输，以消除中间人攻击\n- 使用 `<script crossorigin=\"\
    anonymous\">` 以确保不会通过 cookies 或其他技术交换用户凭证\n- 设置带有文件哈希的 `<script>` `integrity`\
    \ 属性，以拒绝任何被提供者修改过的脚本（参考 MDN 上的子资源完整性）\n\n理想情况下，将脚本移至你自己的域名或完全移除。\n\n### 用于针对网站的第三方脚本\n\
    \n2018年，英国航空公司因50万名客户的姓名、电子邮件地址和完整的信用卡信息在网站交易过程中被盗而被罚款2.32亿美元。这次攻击源于一个被修改以针对 BA\
    \ 的第三方脚本，其供应商可能并不知情或未同意。\n\n## 使用响应式图片\n\n`<img>` 标签提供了可选的 `srcset` 和 `sizes`\
    \ 属性，这些属性在大多数浏览器（IE 除外）中得到了很好的支持。它们允许根据元素大小和像素密度来请求特定的图片。\n\n## CSS 分辨率\n\n现代智能手机提供了具有极高原生分辨率的屏幕，称为\
    \ HiDPI 或 Retina 显示屏。每个像素肉眼几乎看不见，因此浏览器会实现一个 **CSS 分辨率**，例如 360x760px，而原生分辨率可能是\
    \ 1440x3040px。**显示密度**因此是 4 倍，一个 CSS 像素将使用 4x4（16）个物理像素。\n\n假设一个 100x100px 的空间，通常加载\
    \ 100x100px 的图片是最优的。然而，在 4 倍显示密度下，图片质量可能看起来相对较差，因此 400x400px 的图片可能更合适。`srcset`\
    \ 属性可以在标准的 `<img>` 标签中定义合适的图片：\n\n```html\n<img width=\"100\" height=\"100\"\n\
    \     alt=\"responsive image\"\n     src=\"img-100.jpg\"\n     srcset=\"img-100.jpg\
    \ 1x,\n             img-200.jpg 2x,\n             img-300.jpg 3x,\n          \
    \   img-400.jpg 4x\" />\n```\n\n浏览器将为显示密度选择并下载最合适的图片。这确保了最佳的图片质量，而最终用户无需在所有设备上下载不必要的大图片。\n\
    \n当浏览器不支持 `srcset` 时，将使用 `src` 属性引用的图片。\n\n## image-set() 和媒体查询\n\n`CSS image-set()\
    \ 函数` 为背景图片提供了类似的选项，但目前支持有限。\n\n在大多数浏览器中可用的替代方案是 `CSS 分辨率媒体查询`，尽管代码更冗长。\n\n或者，你可以根据\
    \ `<img>` 元素的渲染宽度来定位图片：\n\n```html\n<img alt=\"responsive image\"\n    src=\"\
    small.jpg\"\n    srcset=\"small.jpg 400w\n            large.jpg 800w\" />\n```\n\
    \n`w` 单位定义图片文件的实际**宽度**（以像素为单位）。不要像通常预期的那样使用 `px`。\n\n当视口宽度低于 400px 时，使用 `small.jpg`，但在\
    \ CSS 或物理像素超过 400px 的屏幕上，则使用 `large.jpg`。\n\n此示例仅在图片宽度为视口全宽时实用。`sizes` 属性定义了图片相对于视口的大小，以便计算宽度：\n\
    \n```html\n<img alt=\"responsive image\"\n    src=\"small.jpg\"\n    srcset=\"\
    small.jpg 200w\n            large.jpg 400w\"\n    sizes=\"50vw\" />\n```\n\n图片宽度为\
    \ `50vw` —— 视口的一半。当图片宽度为 `200px` 或更小（因此视口宽度小于 `400px`）时，使用 `small.jpg`，但当图片宽度更大时，则使用\
    \ `large.jpg`。\n\n`sizes` 属性可以包含复杂的媒体查询和最终的回退大小，以确定在多个视口尺寸下的图片宽度。例如：\n\n```html\n\
    <img alt=\"responsive image\"\n    sizes=\"(max-width: 299px) 100vw,\n       \
    \    (min-width: 300px) and (max-width: 799px) calc(100vw - 60px),\n         \
    \  50vw\" />\n```\n\n## 大尺寸图片的带宽成本\n\n一张 400x400px 的图片的文件大小可能是其 100x100px 等效图片的\
    \ 16 倍。它需要相当多的带宽，这可能导致移动网络上的体验不佳。\n\n假设较小的图片为 20KB，较大的版本为 200KB。每个页面包含五张图片，每天有\
    \ 1000 次页面浏览。通过使用较小的图片，每天可节省的带宽为 900MB —— 或 *每年 330GB*。\n\n折中方案 —— 也许是 200x200px\
    \ —— 看起来可能合理，而不会对性能产生不利影响。\n\n## 定义响应式图片宽高比\n\n自响应式网页设计出现以来，开发者一直被建议不要在 `<img>`\
    \ 标签上设置 `width` 和 `height` 属性。然后 CSS 设置 `width: 100%` 或 `max-width: 100%`，以确保图片根据其容器的宽度或图片的最大尺寸进行调整。\n\
    \n该技术有一个不幸的副作用：*当图片开始加载时，页面必须重新排列以分配空间*。你经常会在移动设备上遇到这种情况，你正在阅读的文本突然移出屏幕，因为页面上方突然出现了一张图片。\n\
    \n宽高比定义了高度和宽度之间的关系，因此当只有一个维度已知时，就可以计算大小。从 Firefox 71 和 Chrome 79 开始，浏览器会解析 `<img>`\
    \ 的 `width` 和 `height` 属性以计算宽高比。然后可以预留适当的空间，从而无需重新排列：\n\n```html\n<!-- 图片的宽高比为\
    \ 4:3 -->\n<img src=\"image.jpg\" width=\"400\" height=\"300\" alt=\"my image\"\
    \ />\n```\n\n### 选择高度和宽度\n\n任何合适的宽度或高度都可以用来设置宽高比，因为它将使用 CSS 进行调整大小。例如，`width=\"\
    4\" height=\"3\"`。也就是说，最好设置一个合理的大小，以确保图片在非常旧的浏览器中可见，或者在 CSS 无法加载或被禁用时也能显示。\n\n\
    以下 CSS 确保图片使用其容器的全部宽度，并根据宽高比设置高度：\n\n```css\nimg {\n  width: 100%;\n  height:\
    \ auto; /* 这是必需的 */\n}\n```\n\n浏览器将在页面上预留适当的空间，因此不需要重新排列。不计算宽高比的浏览器不会预留任何空间，但没有任何缺点。图片将保持响应式。\n\
    \n### 定义宽高比的 HTML 和 CSS 提案\n\n还有一些提案建议使用 HTML `intrinsicssize=\"400x300\"` 属性或\
    \ CSS `aspect-ratio: 4/3` 属性来定义宽高比。这些将为避免重排提供替代选项，因此请关注新的浏览器版本！\n\n## 实现艺术指导\n\
    \nHTML `<picture>` 元素类似于 `<audio>` 和 `<video>`，它将根据浏览器支持和条件请求其子元素之一。例如，它可以用于加载较小的\
    \ WebP 图片或回退到标准 JPG：\n\n```html\n<picture>\n  <source type=\"image/webp\" srcset=\"\
    image.webp\" />\n  <img src=\"image.jpg\" alt=\"JPG image\" />\n</picture>\n```\n\
    \n### CDN 和服务器端解决方案\n\n一些图片 CDN 和服务器端解决方案可以根据 HTTP 请求传递最优的图片，因此只需要一个 `<img>` 标签。\n\
    \n`<picture>` 元素也可用于艺术指导。根据设备的尺寸和方向请求不同的图片。考虑以下主图：\n\n![A landscape image](img/d93d5aab668f52eb84bb477fd9a96986_80_0.png)\n\
    \n这张风景图在典型的桌面显示器上看起来合理，但在以纵向握持的较小设备上会丢失细节。在较小的空间上也很难叠加文字。\n"
