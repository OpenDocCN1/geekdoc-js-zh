- md: "## Preface\n\nDespite working on the web every day, few developers have a good\
    \ word to say about the monster they’ve created. Achingly slow sites with annoying\
    \ overlays, cookie agreements, instant notifications, and obtrusive ads litter\
    \ the web landscape.\n\nWhile there may be some excuses for complex web applications,\
    \ there’s little justification for sluggish content-based and ecommerce sites.\
    \ People are notoriously impatient, and an unresponsive site receives fewer visitors\
    \ and conversions.\n\nThis book provides advice, tips, and best practice for improving\
    \ website performance.\n\n## Who Should Read This Book?\n\nThe performance options\
    \ described in the following chapters range from quick, five-minute configuration\
    \ changes to major website overhauls. We primarily concentrate on front-end activities\
    \ and server configurations to optimize the code delivered to a browser.\n\nSome\
    \ back-end tips are provided, but this is often specific to your application,\
    \ framework, database, and usage patterns. Server-side performance can often be\
    \ improved with additional or more powerful computing resources.\n\nIdeally, everyone\
    \ involved in a project would consider performance from the start. Somewhat understandably,\
    \ that rarely occurs, because no one can appreciate the speed of a website or\
    \ application before it’s been created. Many of the tips can therefore be applied\
    \ after your project has been delivered.\n\n## Conventions Used\n\nYou’ll notice\
    \ that we’ve used certain typographic and layout styles throughout this book to\
    \ signify different types of information. Look out for the following items.\n\n\
    ## Code Samples\n\nCode in this book is displayed using a fixed-width font, like\
    \ so:\n\n```html\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for\
    \ a walk in the park.\nThe birds were singing and the kids were all back at school.</p>\n\
    ```\n\nWhere existing code is required for context, rather than repeat all of\
    \ it, `:` will be displayed:\n\n```javascript\nfunction animate() {\n    :\n \
    \   new_variable = \"Hello\";\n}\n```\n\nSome lines of code should be entered\
    \ on one line, but we've had to wrap them because of page constraints. An `↵`\
    \ indicates a line break that exists for formatting purposes only, and should\
    \ be ignored:\n\n```javascript\nURL.open(\"https://www.sitepoint.com/responsive-web-\n\
    ↵design-real-user-testing/?responsive1\");\n```\n\n## Tips, Notes, and Warnings\n\
    \n> **Hey, You!**\n\nTips provide helpful little pointers.\n\n> **Ahem, Excuse\
    \ Me ...**\n\nNotes are useful asides that are related—but not critical—to the\
    \ topic at hand. Think of them as extra tidbits of information.\n\n> **Make Sure\
    \ You Always ...**\n\n... pay attention to these important points.\n\n> **Watch\
    \ Out!**\n\nWarnings highlight any gotchas that are likely to trip you up along\
    \ the way.\n\n## Supplementary Materials\n\n-   [https://www.sitepoint.com/community/](https://www.sitepoint.com/community/)\
    \ are SitePoint's forums, for help on any tricky problems.\n-   **books@sitepoint.com**\
    \ is our email address, should you need to contact us to report a problem, or\
    \ for any other reason.\n\n# Chapter 1: Web Performance Matters\n\n## The Cost\
    \ of Poor Performance\n\nWeb obesity, slow downloads, and poor performance hit\
    \ everyone—site users, online business owners, and even those who’ve never accessed\
    \ the Web.\n\n## User Costs\n\nAt the start of 2020, the average web page comprises:\n\
    \n-   27KB of HTML content\n-   64KB of CSS split over seven style sheets\n- \
    \  four fonts, totaling 122KB\n-   410KB of JavaScript in 20 source files\n- \
    \  31 images, requiring 980KB of bandwidth (a *third of these are off screen and\
    \ may never be viewed!*)\n\n## Average Page Weight 2020: 1,940KB\n\n![1-1. Average\
    \ page weight in 2020](img/d93d5aab668f52eb84bb477fd9a96986_12_0.png)\n\nThe total:\
    \ 1,940KB of data made over 74 HTTP requests, which takes seven seconds to fully\
    \ appear on the average user's desktop worldwide. This increases to a frustrating\
    \ 20 seconds on mobile devices. (Source: [HTTP Archive](https://httparchive.org/),\
    \ which analyzes five million popular content websites.)\n\nDownloading this web\
    \ page on a typical mobile phone costs US users $0.20. Those browsing in Vanuatu,\
    \ Mauritania, and Madagascar pay more than 1% of their daily income for the privilege\
    \ of viewing a single page—despite it containing a mere 27KB of potentially readable\
    \ content. (Source: [whatdoesmysitecost.com](https://whatdoesmysitecost.com/).)\n\
    \n## Business Costs\n\nSlow, bloated pages are bad for business:\n\n1.  The larger\
    \ the page download, the slower the user experience, and the less likely that\
    \ person will consider making a purchase or returning.\n2.  55% of visitors use\
    \ a mobile device. These have more limited capabilities and may be connected to\
    \ a slower network, which exacerbates the problem. (Source: statcounter.com.)\n\
    3.  Google's page speed algorithms downgrade slower sites, which harms search\
    \ engine optimization efforts.\n4.  More data results in higher hosting, storage,\
    \ and bandwidth costs.\n5.  The larger your codebase, the longer it takes to update\
    \ and maintain.\n\n## Environmental Costs\n\nThe Internet consumes 420TWh—or *up\
    \ to 10%*—of the world's electricity consumption. This accounts for 4% of global\
    \ greenhouse gas emissions, which is comparable to the aviation industry. Taking\
    \ the web infrastructure and traffic into account, a single page load is estimated\
    \ to emit 1.3g of CO2. (Source: websitecarbon.com.)\n\nWhile the Web has reduced\
    \ energy use by providing a virtual alternative to travel and postage, those 1MB\
    \ hero images still have an environmental impact.\n\n## The Reason for the Woeful\
    \ Web\n\nHow have badly performing sites become ubiquitous when they cost more\
    \ money to run, receive fewer visitors, and decrease conversions?\n\nThe main\
    \ reason: *performance is a lower priority compared to other features*.\n\nIt's\
    \ easy to add more stuff. Optimizing or removing unnecessary junk is more difficult.\
    \ We fear breaking the site or visitor usage patterns, so it becomes easier to\
    \ make excuses for not addressing performance.\n\n### Excuse #1: “We Don’t Have\
    \ a Performance Problem!”\n\nAre you using the latest PC or smartphone on a fast\
    \ network? Try a mid-range, two-year-old device. Try limiting bandwidth to your\
    \ country’s average speed. Try using your site on a VPN or hotel Wi-Fi.\n\n###\
    \ Excuse #2: “Our Users Never Complain?”\n\nPossibly because they abandon your\
