    Web Performance Matters 17


    # Excuse #6: “Some Systems Require More Bandwidth and Processing”


    Complex web apps such as Gmail, maps, social networks, games, and image galleries
    will require more bandwidth and processing capacity than content websites. Performance
    remains a critical issue, but a higher page weight and slower load time can be
    expected.


    However, the [HTTP Archive](http://httparchive.org) crawls articles and online
    shops. It’s not looking at web applications. The average 2MB website page weight
    is the equivalent of half of all Shakespeare’s plays, or the 1993 disk-based distribution
    of [DOOM](http://doom.com)—*on a single page often containing only a few paragraphs
    of content*. There’s little excuse for not addressing performance.


    # Excuse #7: “Expanding Page Weight is the Price of Progress”


    This may be true for some edge cases. However, developers strived to keep pages
    under 100KB during the dial-up days of the late 1990s. Has web content become
    20x better or faster since that time?


    # Excuse #8: “Slimming Pages Means Dumbing Down, with Fewer Features and Effects”


    Performance can often be improved with minimal effort and no loss of functionality.


    You can do more with less as web browsers evolve. Consider the CSS3 `border-radius`
    property: adding rounded corners now requires a few bytes of code compared to
    the multiple image shenanigans of a decade ago.


    # Excuse #9: “Improving Performance Increases Complications and Maintenance”


    Removing unused or unnecessary images, videos, fonts, CSS, and JavaScript will
    simplify your site. It should result in fewer complications and less maintenance.'
