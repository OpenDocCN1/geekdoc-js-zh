    \ it returns a floating-point number representing fractions of a millisecond:\n\
    \n```\nlet t0 = performance.now();\ndoSomething();\nlet t1 = performance.now();\n\
    console.log(`doSomething() executed in ${ t1 - t0 }ms`);\n```\n\n## Performance\
    \ Marks and Measures\n\n`performance.now()` can become arduous to manage as an\
    \ application grows. The API also allows you to **mark** when an event occurs\
    \ and **measure** the time elapsed between two marks. A mark is defined by passing\
    \ a name string to performance.mark():\n\n```\nperformance.mark('script:start');\n\
    \nperformance.mark('doSomething1:start');\ndoSomething1();\nperformance.mark('doSomething1:end');\n\
    \nperformance.mark('doSomething2:start');\ndoSomething2();\nperformance.mark('doSomething2:end');\n\
    performance.mark('script:end');\n```\n\nEach `mark()` call adds a `PerformanceMark`\
    \ object to an array, which defines the `name` and `startTime`.\n\n> Navigation\
    \ and Resource Entries\n\nThe array is likely to contain other automatically generated\
    \ browser entries for `navigation` and `resource` timings.\n\nA mark can be cleared\
    \ with `performance.clearMarks(markName)`. All marks are cleared when no name\
    \ is passed.\n\nThe elapsed time between two marks can be calculated by creating\
    \ a `performance.measure()` by passing the measure name, start mark, and end mark:\n\
    \n```\nperformance.measure('doSomething1', 'doSomething1:start', 'doSomething1:end');\n\
    performance.measure('script', 'script:start', 'doSomething1:end');\n```\n\nOmitting\
    \ the start mark measures from the moment the page loaded. Omitting the end mark\
    \ measures to the current time. Each `measure()` call adds a `PerformanceEntry`\
    \ object to the same array, which defines the `name`, `startTime`, and `duration`.\n\
    \nA measure can be cleared with `performance.clearMeasures(measureName)`. All\
    \ measures are cleared when no name is passed.\n\nMarks and measures can be accessed\
    \ with:\n\n- `performance.getEntriesByType(type)`, where `type` is either \"mark\"\
    \ or \"measure\"\n- `performance.getEntriesByName(name)`, where `name` is a mark\
    \ or measure\n- `performance.getEntries()`, to access all items in the array.\n\
    \nThe name and duration of every measure can therefore be output:\n\n```\nperformance.getEntriesByType('measure')\n\
    \    .forEach(m => console.log(`${m.name}: ${m.duration}ms`));\n```\n\n## WebPageTest.org\n\
    \nDespite its retro look, WebPageTest.org reports performance information from\
    \ global locations using emulated devices with a range of settings.\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_35_0.png)\n\
    \n2-8. WebPageTest.org\n\nDevTool-like reports take a few minutes to generate.\n\
    \n## Content breakdown by MIME type (First View)\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_36_0.png)\n\
    \n| MIME Type | Requests |\n|---|---|\n| image | 13 |\n| html | 5 |\n| js | 3\
    \ |\n| css | 1 |\n| flash | 0 |\n| font | 0 |\n| other | 0 |\n| video | 0 |\n\n\
    | MIME Type | Bytes | Uncompressed |\n|---|---|---|\n| js | 226,883 | 719,829\
    \ |\n| html | 41,939 | 136,727 |\n| image | 23,150 | 24,992 |\n| css | 2,986 |\
    \ 15,482 |\n| flash | 0 | 0 |\n| font | 0 | 0 |\n| other | 0 | 0 |\n| video |\
    \ 0 | 0 |\n\n2-9. WebPageTest.org report\n\nAn A (good) to F (bad) report is shown\
    \ at the top:\n\n- **First byte time**: the time taken for the first byte to be\
    \ received\n- **Keep-alive enabled**: are persistent HTTP connections used?\n\
    - **Compress transfer**: are assets gzip compressed?\n- **Compress images**: can\
    \ images be compressed further?\n- **Cache static content**: does the site leverage\
    \ browser caching?\n- **Effective use of a CDN**: are content delivery networks\
    \ used?\n\n> **Content Delivery Networks**\n\nThe benefits of using a CDN are\
    \ described in [Chapter 3].\n\nThe **Summary** and **Details** panels provide\
    \ a table and waterfall chart showing network metrics, where lower figures indicate\
    \ better performance:\n\n| Performance Metric | Description |\n| :--- | :--- |\n\
    | Load Time | the time taken from the initial request to the browser load event\
    \ |\n| First Byte | the time taken for the first byte to be received |\n| Start\
    \ Render | the time taken for the browser to start rendering content on the page\
    \ |\n| Speed Index | the average time at which visible parts of the page are displayed\
    \ ([more information](https://www.webpagetest.org/help/glossary#SpeedIndex)) |\n\
    | DOM Elements | the number of DOM elements |\n| Document Complete | a set of\
    \ metrics relating to the [DOMContentLoaded](https://developer.mozilla.org/en-US/docs/Web/Events/DOMContentLoaded)\
    \ event, when the HTML has fully loaded but other assets such as images and fonts\
    \ may still be in progress |\n| Fully Loaded | a set of metrics relating to the\
    \ window [load](https://developer.mozilla.org/en-US/docs/Web/Events/load) event\
    \ when all page assets have been downloaded and rendered |\n\nThe **Performance\
    \ Review** panel shows information about effective use of file compression, browser\
    \ caching, and CDN usage.\n\nThe **Content Breakdown** panel provides a list of\
    \ assets by type (HTML, CSS, JavaScript, images, and others) with requests, size,\
    \ network response times, and rendering events.\n\nThe **Domains** panel shows\
    \ the number and size of requests made to the page and third-party domains such\
    \ as CDNs, font repositories, analytics, advertisers, social media widgets, and\
    \ so on.\n\nThe **Processing Breakdown** panel shows the time taken for browser\
    \ processes including loading, scripting, layout, and painting.\n\nThe **Screenshot**\
    \ panel shows frames and/or a video at specific points, such as the time the first\
    \ content appeared, when a hero image was shown, and the fully loaded view.\n\n\
    Other panels provide links to additional services such as image optimizers and\
    \ domain request maps.\n\nFor more information, refer to:\n\n- [WebPageTest documentation](WebPageTest\
    \ documentation)\n- [Lean Websites, Chapter 3](Lean Websites, Chapter 3)\n\n##\
    \ WebPageTest API\n\nWebPageTest offers a [REST API](REST API) to programmatically\
    \ automate tests or obtain results during a build process.\n\nTests are limited\
    \ to 200 page loads per day. Repeated views to evaluate cached loading factors\
    \ also count as a page load. Developers must [apply for an API key](apply for\
    \ an API key) to get started.\n\nTests are initiated by requesting a URL. In this\
    \ example, `mysite.com` tests are run twice:\n\n```\nhttp://www.webpagetest.org/runtest.php?k=my-api-key&url=mysite.com&runs=2&f=json\n\
    ```\n\nA successful request returns a JSON response with a test ID and a set of\
    \ result URLs:\n\n```\n{\n  \"data\": {\n    \"testId\": \"1234567890\",\n   \
    \ \"ownerKey\": \"ceb6128dbf05e09a1969ad\",\n    \"jsonUrl\": \"https://www.webpagetest.org/jsonResult.php?test=1234567890\"\
    ,\n    \"xmlUrl\": \"https://www.webpagetest.org/xmlResult/1234567890/\",\n  \
    \  \"userUrl\": \"https://www.webpagetest.org/result/1234567890/\",\n    \"summaryCSV\"\
    : \"https://www.webpagetest.org/result/1234567890/page_data.csv\",\n    \"detailCSV\"\
    : \"https://www.webpagetest.org/result/1234567890/requests.csv\"\n  }\n}\n```\n\
    \nThe status of a test can be checked by passing the `testId` to the `testStatus.php`\
    \ URL. An HTTP 200 is returned when the result URLs are ready:\n\n```\nhttp://www.webpagetest.org/testStatus.php?k=my-api-key&f=json&test=1234567890\n\
    ```\n\nThe completed results are stored for up to 30 days and can be accessed\
    \ from the URLs shown in the initial `runtest.php` request.\n\nA Node.js [webpagetest\
    \ module](https://www.webpagetest.org/) is available to help with API processing.\n\
    \n## More Performance Assessment Tools\n\nA variety of other free tools, browser\
    \ extensions, and commercial services (often with free tiers or trials) are available,\
    \ which can provide performance monitoring, usage tracking, and improvement advice:\n\
    \n- sitespeed.io\n- webhint\n- Pingdom Website Speed Test\n- GMetrix\n- Uptrends\n\
    - Sentry.io\n\nFinally, don't forget to test your system using a combination of\
    \ real devices, operating systems, input types, and browsers on a range of network\
    \ speeds. Consult your analytics reports to help determine what systems and connections\
    \ your visitors typically use."
  mdcn: "\n第四章和第五章针对这些问题提供了常见解决方案。\n\n## 开发者工具的控制台日志\n\n性能监控有助于发现网站或应用执行特定操作时出现的问题。然而，当事件发生时，可能需要通过向控制台输出日志消息来分析JavaScript执行情况。现代浏览器支持多种[性能计时API](https://developer.mozilla.org/en-US/docs/Web/API/Performance_Timing_API)，这些API可以帮助分析代码。\n\
    \n## performance.now()\n\n`performance.now()`返回自页面加载以来经过的毫秒数。与`Date.now()`不同，它返回一个浮点数，表示毫秒的小数部分：\n\
    \n```\nlet t0 = performance.now();\ndoSomething();\nlet t1 = performance.now();\n\
    console.log(`doSomething() executed in ${ t1 - t0 }ms`);\n```\n\n## Performance\
    \ Marks and Measures（性能标记与测量）\n\n随着应用程序的增长，`performance.now()`的管理可能变得繁琐。该API还允许你在事件发生时**标记**（mark），并**测量**（measure）两个标记之间经过的时间。通过向`performance.mark()`传递一个名称字符串来定义标记：\n\
    \n```\nperformance.mark('script:start');\n\nperformance.mark('doSomething1:start');\n\
    doSomething1();\nperformance.mark('doSomething1:end');\n\nperformance.mark('doSomething2:start');\n\
    doSomething2();\nperformance.mark('doSomething2:end');\nperformance.mark('script:end');\n\
    ```\n\n每次调用`mark()`都会向一个数组添加一个`PerformanceMark`对象，该对象定义了`name`（名称）和`startTime`（开始时间）。\n\
    \n> 导航和资源条目\n\n该数组可能包含其他自动生成的用于`navigation`（导航）和`resource`（资源）计时的浏览器条目。\n\n可以使用`performance.clearMarks(markName)`清除标记。如果不传递名称，则清除所有标记。\n\
    \n两个标记之间经过的时间可以通过创建`performance.measure()`来计算，该方法需要传递度量名称、起始标记和结束标记：\n\n```\n\
    performance.measure('doSomething1', 'doSomething1:start', 'doSomething1:end');\n\
    performance.measure('script', 'script:start', 'doSomething1:end');\n```\n\n省略起始标记则从页面加载的时刻开始测量。省略结束标记则测量到当前时间。每次调用`measure()`都会向同一个数组添加一个`PerformanceEntry`对象，该对象定义了`name`、`startTime`和`duration`（持续时间）。\n\
    \n可以使用`performance.clearMeasures(measureName)`清除度量。如果不传递名称，则清除所有度量。\n\n可以通过以下方式访问标记和度量：\n\
    \n- `performance.getEntriesByType(type)`，其中`type`可以是`\"mark\"`或`\"measure\"`\n\
    - `performance.getEntriesByName(name)`，其中`name`是一个标记或度量的名称\n- `performance.getEntries()`，用于访问数组中的所有项目。\n\
    \n因此可以输出每个度量的名称和持续时间：\n\n```\nperformance.getEntriesByType('measure')\n    .forEach(m\
    \ => console.log(`${m.name}: ${m.duration}ms`));\n```\n\n## WebPageTest.org\n\n\
    尽管外观复古，WebPageTest.org使用具有各种设置的模拟设备从全球位置报告性能信息。\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_35_0.png)\n\
    \n2-8. WebPageTest.org\n\n类开发工具的报告需要几分钟生成。\n\n## 按MIME类型划分的内容细分（首次查看）\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_36_0.png)\n\
