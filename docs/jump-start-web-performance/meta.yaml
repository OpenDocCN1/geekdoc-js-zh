    A VPS is your own remote virtual machine. It *feels* like a dedicated server,
    but is effectively a software emulation running on one or more real servers.


    Pros:


    +   - A VPS is quicker to set up and more affordable than a dedicated server.

    - It''s fast, flexible, and easier to scale.

    - It''s more robust: your server is just data that can be moved to or run from
    other hardware.


    Cons:


    +   - Resources are still shared and the host''s network can be swamped.

    - A VPS still requires skilled technical staff to maintain server updates, backups,
    security, and so on (unless you pay extra for a "managed" VPS).'
  - '[PAGE 43]


    # Cloud Hosting


    Cloud hosting comes in many different guises, but it normally abstracts the hardware
    infrastructure into a set of services that can be accessed on demand. For example,
    your web application may require server-side processing, a database, and file
    store services, which are provisioned separately. You could opt to use serverless
    functions, which implement an application as a series of small micro-services
    rather than as a single monolithic program.


    Pros:


    +   - It''s robust and reliable.

    - It offers scalability and flexibility, as resources can be instantly scaled
    up when demand increases.

    - It''s cost efficient, as you only pay for what you use.


    Cons:


    +   - Cloud hosting has a steep learning curve, with each host offering a different
    service, concepts, and terminology.

    - Costs can be extremely difficult to determine up front.

    - There''s vendor lock-in, as it can be more difficult to move away from bespoke
    services.

    - Support can be a costly extra service.


    # Switch to a More Appropriate Hosting Option


    Performance will be affected as your site increases in popularity. Shared hosting
    plans are especially susceptible to surges in demand, such as links from Reddit,
    Hacker News, and so on. Your site could be blocked as soon as it reaches processing,
    storage, or bandwidth thresholds.


    Contact your host first, as they may be able to suggest options for switching
    your site to another service or platform. For example, [SiteGround](https://www.siteground.com)
    provides standard web hosting accounts where you can manually install a WordPress
    CMS. However, they also offer fully managed WordPress hosting in the US, UK, Europe,'
  - '[PAGE 44]


    and Australia. Your site can be transferred for free to take advantage of application-specific
    performance optimizations such as caching, compression, minification, image optimization,
    and lazy loading.


    However, be aware that you''ll always be limited by your host''s infrastructure
    and location. For example, a European company should consider a US-based host
    if the majority of their clients are based in North America.


    > CDNs to the Rescue

    The next section describes content delivery networks, which can offset the effects
    of physical server locations.


    # Scale Resources


    Most hosting services provide scaling options to increase processor, memory, disk
    space, or bandwidth capacity. This is usually simpler with cloud and VPS hosting,
    which have less reliance on physical hardware. It may even be possible to move
    resources to alternative geographical locations.


    An additional monthly fee for extra resources will normally apply, although dedicated
    server providers can make a one-off charge. Some cloud services scale and charge
    according to demand, although there are often fixed-price elements such as disk
    space.


    # Switch Hosts


    Switching hosts can have a positive impact on performance if your new host has
    a faster infrastructure based in a location closer to users. Improved hosting
    is unlikely to solve all your performance problems, but it can be a cost-effective
    solution for back-end speed issues.'
  - '[PAGE 45]


    # What to Look for in a New Host


    These are some performance-related features to look for in a new host:


    +   - a global infrastructure, or data centers geographically close to your main
    users

    - specialist support for applications you''re using, such as WordPress

    - HTTP/2 and simple SSL certificate installation

    - domain nameserver and DNS configuration

    - gzip and Brotli compression enabled

    - options for automatic minification, caching, and image optimization

    - attack detection and prevention

    - usage and speed reports

    - automated issue alerts

    - good, independent reviews

    - a knowledgeable and fast support service


    Don''t be swayed by worthless 99.9% up-time claims. Reputable hosts are reliable
    and those that aren''t won''t provide proof or guarantees. Besides, it still equates
    to nine hours of downtime per year, which will inevitably coincide with your product
    launch!


    # Use a Content Delivery Network


    A content delivery network can provide a performance boost to any website by distributing
    the load and serving assets from locations geographically closer to users. If
    your site is hosted on servers in California, for example, and you don''t have
    a CDN, all users must connect to the server in California directly:'
  - '[PAGE 46]


    ![](img/d93d5aab668f52eb84bb477fd9a96986_46_0.png)


    3-1. No CDN


    Using a CDN service allows a user from Australia to access assets from closer
    servers hosted in Melbourne:


    ![](img/d93d5aab668f52eb84bb477fd9a96986_46_1.png)


    3-2. Active CDN'
  - '[PAGE 47]


    The response is faster, users are happier, and your hosting requirements may be
    reduced.


    You may already be using a CDN for static assets such as CSS or JavaScript frameworks.
    For example, jQuery can be referenced at `https://code.jquery.com/jquery-3.4.1.slim.min.js`
    in a `<script>` tag. This type of CDN offers several benefits:


    +   - Files are available on fast servers replicated across the globe.

    - Files are hosted on a domain other than your website''s, which increases the
    number of concurrent assets the browser can download.

    - Files may already be cached in the user''s browser, since many sites may reference
    that URL.


    Unfortunately, simple static-file CDNs can be frustrating to manage, and third-party
    scripts have performance, privacy, and security risks (see **Chapter 4**).


    More recently, CDN services have appeared that automatically proxy requests to
    your site. This usually requires your domain to point at the CDN''s name servers
    or set specific DNS records. The benefits of this include:


    +   - a faster, high-capacity infrastructure with more efficient delivery from
    many locations around the globe

    - high availability: a CDN can continue to deliver cached files even when a host''s
    server fails

    - improved SEO: Google rewards sites with faster response times

    - cheaper costs: adopting a CDN is likely to cost less than scaling server resources


    CDNs may provide additional services regardless of your host''s server facilities
    and limitations, such as:


    +   - SSL certificates for HTTPS encryption

    - load balancing, data compression, and the HTTP/2 protocol for faster transmission

    - automatic file minification, image optimization, video transcoding, and email'
- md: '## Use Image and Video CDNs


    Specialist image and video CDNs can be used in addition to or instead of a standard
    CDN. Popular options include:


    - Cloudimage

    - Cloudinary

    - ImageEngine

    - imgix

    - piio

    - imagekit.io

    - pixboost

    - Uploadcare


    The main benefits are described in the following sections.


    ## Asset Management


    Image CDNs allow you to upload original images—perhaps directly from users—where
    they can be stored, optimized, and managed via a user interface or API.


    ## Optimal Formatting and Compression


    Regardless of the media uploaded, an image CDN can serve the file in the most
    optimal format. For example, you could upload a JPG image but have it served to
    Chrome and Firefox users in the more efficient WebP format. Browsers without WebP
    support would receive the next most appropriate image format.


    Video can also be transcoded using a range of alternative codecs so all popular
    browsers are supported.


    ## Art Direction, Sizing, and Effects


    Some image CDNs offer an API that allows you to crop, resize, transform, or apply
    filters without affecting the original image. For example, [Cloudinary''s URL-based
    API](https://cloudinary.com/documentation/api_overview) allows an image of a person
    to be cropped to 400px around any detected face, resized to 200px, and served
    in the most appropriate format:


    https://res.cloudinary.com/demo/image/upload/w_400,h_400,g_face,r_max/w_200/f_auto/portrait


    ## Activate Server Compression


    Assets can be compressed on a web server prior to transmission, then uncompressed
    on the browser. For text-based files such as HTML, SVG, CSS, and JavaScript, this
    can often reduce bandwidth by 60% or more. According to [W3Techs 2019 reports](https://w3techs.com/technologies/details/ce-gzipcompression),
    compression was not activated on one in five websites.


    > ### Compression Won’t Fix Bloated Code

    > Compression reduces network transfer times, but the file must still be uncompressed
    and parsed when it reaches the browser. Bloated code may arrive sooner, but it
    won’t magically become more efficient!


    Most good web hosts enable compression by default, or do the work for you. Gzip
    compression can be activated on all popular web servers including [Apache](https://httpd.apache.org/docs/2.4/mod/mod_deflate.html),
    [NGINX](https://nginx.org/en/docs/http/ngx_http_gzip_module.html), [IIS](https://docs.microsoft.com/en-us/iis/configuration/system.webserver/httpcompression/),
    and [Express.js compression middleware](https://www.npmjs.com/package/compression).


    [Brotli](https://en.wikipedia.org/wiki/Brotli) is a more modern compression algorithm
    that reduces file sizes further. It can be enabled on all popular web servers
    alongside gzip, which must be provided for [IE and older browsers that don''t
    support newer standards](https://caniuse.com/brotli).


    > ### CDNs and Asset Compression

    > A CDN can implement asset compression even if it''s not enabled on your primary
    server.


    ## Activate HTTP/2


    [HTTP/2](https://en.wikipedia.org/wiki/HTTP/2) improves upon the HTTP transmission
    protocol originally devised by Sir Tim Berners-Lee when he invented the Web in
    1989. HTTP/2 reduces latency by:


    - sending data in a binary rather than text format

    - compressing HTTP headers

    - sending more than one file on the same TCP connection

    - implementing Server Push, which can send a file before it has been requested


    All popular servers and CDNs support HTTP/2 but [fall back to HTTP/1.1 for older
    browsers](https://caniuse.com/http2). More recently, [HTTP/3](https://en.wikipedia.org/wiki/HTTP/3)
    has been announced, which will further optimize performance. Browser and server
    support will increase over the coming years.


    ## Leverage Browser Caching


    When a browser downloads an asset from a URL, it stores that file locally so it
    can be referenced and used again. Infrequently-changing files such as images,
    CSS, and JavaScript are therefore downloaded once and used across multiple pages
    on a site. Without caching, the Web would be considerably slower and more unreliable.


    The server should set appropriate [Expires headers, Last-Modified](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Expires)
    dates, and/or adopt [ETag hashes](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/ETag)
    in the HTTP header. Most servers should have reasonable defaults, but you can
    set custom options. For example, in an Apache `.htaccess` file you can do this:


    ```apache

    <IfModule mod_expires.c>


    ExpiresActive On


    # Expire images after one year

    <FilesMatch "\.(jpg|jpeg|png|gif|svg|ico)$">

    ExpiresDefault "access plus 1 year"

    </FilesMatch>


    # Expire CSS and JavaScript after one month

    ExpiresByType text/css "access plus 1 month"

    ExpiresByType text/javascript "access plus 1 month"


    # default expiry to one week

    ExpiresDefault "access plus 1 week"

    </IfModule>

    ```


    ## Enable CMS Page Caching


    By default, content management systems such as WordPress construct and return
    a page on every user visit:


    1. The URL is examined.

    2. The appropriate content is extracted from the database.

    3. The content is inserted into template code and returned to the user.


    This process is repeated every time—even when the same page content is seen by
    all site visitors.


    Fortunately, caching plugins are available, which store the generated HTML after
    the first visit so all subsequent visitor requests receive the same page. The
    cached page is then invalidated when content is changed or after a specific time
    has elapsed. CMS caching can have a dramatic effect on performance and site reliability.


    Popular [caching plugins for WordPress](https://wordpress.org/plugins/) include:


    - LiteSpeed Cache

    - W3 Total Cache

    - WP Fastest Cache

    - WP-Optimize

    - WP Super Cache


    > ### CDN vs Plugin Caching

    > A CDN can also cache the HTML page, but most CMS plugins perform other optimizations
    such as cleaning databases, minifying code, adding HTTP expiry headers, and so
    on.


    ## Are Videos Necessary?


    Videos can offer an engaging experience. Few do, yet they have a higher bandwidth
    and performance cost than any other web asset. Here are some recommendations:


    1. Do you really need to show that tedious CEO presentation to every visitor?
    Remove all media assets where possible.

    2. Ensure the video is as short as possible, removing scenes where practical.

    3. Transcode the video into multiple formats using the minimum dimensions with
    optimal compression. Many video CDNs and services will handle this for you.

    4. Only play the video on demand—not as the user accesses the page (see Chapter
    4).


    ## Check Your Primary Images


    While images don’t have the same processing and rendering overheads as HTML, CSS
    and JavaScript, they usually account for a large proportion of page weight and
    perceived performance.


    Examine your regularly used images, such as those appearing in headers, footers,
    home page hero blocks. The following tips can dramatically reduce file sizes,
    although using an image CDN can do some of the hard work for you.


    ## Resize Large Bitmaps


    An entry-level smartphone or digital camera takes multi-megapixel images that'
