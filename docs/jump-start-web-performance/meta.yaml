- md: 'Most tools make reference to these phases, while also introducing their own
    metrics that often combine two or more stages. In essence, the fewer steps you
    require, the better the performance. Taking steps to minimize HTTP requests and
    reduce browser processing will result in a snappier user experience.


    ## Google Lighthouse/Chrome Audits


    [Lighthouse](https://developer.chrome.com/docs/lighthouse/overview) is an open-source
    tool that helps evaluate the performance and quality of your page or app. You
    can access it in the following ways:


    1.  from within Chrome’s DevTools

    2.  as the online [web.dev](https://web.dev/) or [PageSpeed Insights](https://developers.google.com/speed/pagespeed/insights/)
    tools

    3.  as a [Node.js module](https://www.npmjs.com/package/lighthouse), through which
    command-line and automated tests can be executed


    It’s easiest to start with Chrome’s DevTools. Navigate to any page in Chrome,
    press `Ctrl|Cmd + Shift + I` or `F12` to open the DevTools panel, and click the
    **Audits** tab:


    24 Jump Start Web Performance


    ![](img/d93d5aab668f52eb84bb477fd9a96986_23_0.png)


    2-1. The Lighthouse Audits tab


    Select the device, audit types, network speed, and check **Clear storage** to
    ensure there’s no influence from browser caching. The results screen appears shortly
    after clicking **Run audits**:


    ![](img/d93d5aab668f52eb84bb477fd9a96986_24_0.png)


    2-2. Lighthouse audit results


    > **Browser Extensions**


    Browser extensions can affect results, but Chrome will warn you about potential
    issues. It may be necessary to run tests in an Incognito window since it disables
    extensions by default.


    The Performance, Accessibility, Best Practices, and SEO scores provide a quick-view
    percentage result, which can be clicked for more information.


    Performance information includes:


    | Performance Metric | Description |

    | --- | --- |

    | First Contentful Paint | the time when the first text or image is painted |

    | First Meaningful Paint | when the primary content is visible |

    | Speed Index | how quickly the contents of a page are visibly populated |

    | First CPU Idle | the time when the main thread is able to handle input |

    | Time to Interactive | the time taken for the page to become fully interactive
    |

    | Max Potential First Input Delay | the time when the browser is able to respond
    to interaction |


    The lower the figures, the better the page performance. This is followed by an
    **Opportunity** section, which suggests potential improvements and estimated savings.


    ### Progressive Web Apps


    The PWA section in [Chapter 4] describes the benefits of progressive web app technologies,
    which allow a web application to be installed and cached, and to work offline.


    ## DevTools'' Network Panel


    The developer tools in most browsers provide a **Network** panel that shows a
    log of all network activity during page load and any subsequent file, Ajax, or
    WebSocket data flows.


    # Testing Tools 27


    ![](img/d93d5aab668f52eb84bb477fd9a96986_26_0.png)


    2-3. DevTools’ Network panel


    The status bar at the bottom summarizes the number of requests, total data transfer
    (possibly compressed), the total size of all uncompressed resources, the total
    download time, and the time when the document DOMContentLoaded and window load
    events were triggered.


    Further options are provided at the top:


    -   **Preserve log**: don''t clear the log between page loads

    -   **Disable cache**: load all files from the network to make a better assessment
    of first-time page access

    -   **Throttle network speed**: select or define download speed profiles


    Assets can be displayed, hidden, or reordered by clicking a table heading. Ordering
    by size or download time will help find the largest or most costly resources.


    The **Filter** box allows you to search for specific assets or enter criteria
    such as:


    -   `is:running` : show any incomplete or unresponsive requests

    -   `larger-than:s` : limit to files larger than *s*, which can be expressed as
    bytes ( *10000* ) Kilobytes ( *1000k* ), or megabytes ( *1M* )

    -   `-larger-than:s` : limit to files smaller than *s*

    -   `-domain:*.yourdomain.com` : show third-party requests that aren’t from your
    primary domain


    > ### 🟢 Assets from Other Domains

    > Most sites request assets from other domains, such as CDNs (content delivery
    networks), fonts repositories, analytics trackers, advertising networks, social
    media share buttons, and so on. While useful, those resources can have a negative
    impact on performance, privacy, and security. Refer to [Chapter 4](https://example.com)
    for further information.


    ## Chrome’s Performance Monitor


    Chrome’s new **Performance Monitor** can be accessed from the DevTools’ **More
    tools** sub-menu (although this may vary across Chrome versions).


    ![](img/d93d5aab668f52eb84bb477fd9a96986_28_0.png)


    2-4. Starting the Performance Monitor


    It appears in the lower Console drawer panel, and charts are updated in real time
    as you use a page.


    ![](img/d93d5aab668f52eb84bb477fd9a96986_29_0.png)


    2-5. The Chrome DevTools'' Performance Monitor


    Monitors can be displayed and hidden by clicking the heading in the left:


    | Performance Monitor | Description |

    | :--- | :--- |

    | CPU usage | processor utilization from 0% to 100% |

    | JS heap size | memory required for JavaScript objects |

    | DOM Nodes | the number of elements in the HTML document |

    | JS event listeners | the number of registered JavaScript event listeners |

    | Documents | the number of document resources including the page, CSS, JS, etc.
    |

    | Document Frames | the number of frames, iframes, and worker scripts |

    | Layouts / sec | the rate at which the browser has to re-layout the DOM |

    | Style recalcs / sec | the rate at which the browser has to recalculate styles
    |


    The Performance Monitor could be used to discover unusual spikes in activity—such
    as rising memory use or layout recalculations when an element has been added to
    the page. Further investigation can then be carried out in the **Performance Panel**.


    ## Developer Tools'' Performance Panel


    The developer tools provided in Chrome, Firefox, Safari, and Edge provide a **Performance**
    tab that allows you to record a snapshot of browser activity when particular actions
    are made. Unlike the Performance Monitor, you must record a profile before it
    can be analyzed.


    To use Chrome''s version, open DevTools and navigate to the **Performance** pane.
    The **Settings** cog allows you to select network and CPU throttling options before
    clicking the **Record** icon.


    ![](img/d93d5aab668f52eb84bb477fd9a96986_30_0.png)


    Load or use your site as required, then hit **Stop** to generate the performance
    report.


    ![](img/d93d5aab668f52eb84bb477fd9a96986_31_0.png)


    2-7. A DevTools Performance report


    The report can be daunting, but it can be saved and reloaded later for further
    analysis.


    The top timeline chart shows frames per second, CPU usage, network usage, screenshots,
    and the heap memory size. An area can be selected with the mouse to focus on a
    specific point.


    Result panes can be expanded and collapsed. Versions of Chrome differ, but panes
    may include:


    -   **Network**: loading times for individual files

    -   **Frames**: screenshots at points on the timeline

    -   **Interactions**: input and animation timings

    -   **Timings**: events such as DOMContentLoaded and the First Meaningful Paint

    -   **Main**: thread activities such as function calls and event handlers


    These are followed by a chart showing the JavaScript memory heap, number of documents,
    number of nodes, event listeners, and GPU memory usage.


    The final **Summary** panel changes as you click items in the upper panes. The
    breakdown may include function call and event details as well as timings where
    appropriate:


    -   **Loading**: time to load assets from the network

    -   **Scripting**: JavaScript execution resulting in visual changes (which can
    also include CSS animations and transitions)

    -   **Rendering**: the browser process of calculating which CSS rules apply and
    how layout is affected

    -   **Painting**: the browser process of filling in pixels and drawing layers
    in the correct order

    -   **System**: other browser activities

    -   **Idle**: no activity


    The panel can typically be used to discover inefficient activities, including:


    -   expensive event handlers, such as those attached to scroll or mouseover actions

    -   long-running JavaScript functions

    -   slow or badly throttled network requests

    -   a continually rising JavaScript Heap, which could result from memory leaks
    or poor garbage collection

    -   style changes that affect many DOM elements

    -   animations that incur frequent layout changes'
