    # Leverage Browser Caching


    When a browser downloads an asset from a URL, it stores that file locally so it
    can be referenced and used again. Infrequently-changing files such as images,
    CSS, and JavaScript are therefore downloaded once and used across multiple pages
    on a site. Without caching, the Web would be considerably slower and more unreliable.


    The server should set appropriate [Expires headers, Last-Modified](Expires headers,
    Last-Modified) dates, and/or adopt [ETag hashes](ETag hashes) in the HTTP header.
    Most servers should have reasonable defaults, but you can set custom options.
    For example, in an Apache `.htaccess` file you can do this:


    ```

    <IfModule mod_expires.c>


    ExpiresActive On


    # Expire images after one year

    <FilesMatch "\.(jpg|jpeg|png|gif|svg|ico)$">

    ExpiresDefault "access plus 1 year"

    </FilesMatch>


    # Expire CSS and JavaScript after one month

    ExpiresByType text/css "access plus 1 month"

    ExpiresByType text/javascript "access plus 1 month"


    # default expiry to one week

    ExpiresDefault "access plus 1 week"

    </IfModule>

    ```'
