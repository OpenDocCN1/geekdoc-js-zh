  md: '# Limit Font Styles and Text


    Only request the fonts, weights, and styles you require—and definitely remove
    *any fonts you aren’t using!*


    Here’s an example of two Google Font URLs:


    +   - https://fonts.googleapis.com/css?family=Inconsolata:500,700

    - https://fonts.googleapis.com/css?family=Roboto:bolditalic


    Both fonts can be contained in a single URL:


    +   - https://fonts.googleapis.com/css?family=Inconsolata:500,700|Roboto:bolditalic


    In some cases, you may only need specific characters—perhaps for a regularly used
    title or logo. The text “Hello” requires just four characters from a specific
    font:


    +   - https://fonts.googleapis.com/css?family=Inconsolata&text=Helo


    Finally, you could benefit from hosting the fonts locally or [using more popular
    fonts](https://fonts.google.com/) that have a higher chance of being pre-cached
    in the user’s browser.


    # Use a Good Font-loading Strategy


    A web font can take several seconds to download. The browser will choose one of
    two options:


    +   1. Show a **flash of unstyled text** (FOUT). The first available font fallback
    is used immediately. It’s replaced by the web font once it’s loaded. This process
    is used by IE, Edge 18 and below, and older editions of Firefox and Opera.

    2. Show a **flash of invisible text** (FOIT). No text is displayed until the web
    font has loaded. This process is used in all modern browsers, which typically
    wait three seconds before reverting to a fallback.'
  merge: -1
  pgno: 94
- img_proc: true
  md: "# Jump Start Web Performance\n\nEither option can be jarring and affect perceived\
    \ performance.\n\nThe CSS font-display property allows you to define the font-handling\
    \ process. The options are:\n\n+   - **auto**: the browser's default behavior\
    \ (usually FOIT).\n- **block**: effectively FOIT. The text may be invisible for\
    \ up to three seconds. There's no font swap, but text can't be read immediately.\n\
    - **swap**: effectively FOUT. The first fallback is used until the web font is\
    \ available. Text can be read immediately, but the font swap effect may be jarring\
    \ if not managed effectively.\n- **fallback**: a compromise between FOIT and FOUT.\
    \ Text is invisible for a short period (typically 100ms) then the first fallback\
    \ is used until the web font is available. Text is readable as the page loads,\
    \ but the font swap can still be problematic.\n- **optional**: the same as fallback,\
    \ except no font swapping occurs. The web font will only be used if it's available\
    \ within the initial period. The first page view is likely to show a fallback\
    \ font while the web font is downloaded and cached. Subsequent page views will\
    \ use the web font.\n\n> **Similar Web and OS Fonts**\n\noptional could be a reasonable\
    \ choice if the web and OS fallback fonts are similar, but if that's the case,\
    \ using an OS font throughout would offer better performance!\n\nExample CSS:\n\
    \n```\n@font-face {\n  font-family: 'mytypeface';\n  src: url('mytypeface-webfont.woff2')\
    \ format('woff2'),\n       url('mytypeface-webfont.woff') format('woff');\n  font-weight:\
    \ 500;\n  font-style: normal;\n  font-display: swap;\n}\n```"
  merge: -1
