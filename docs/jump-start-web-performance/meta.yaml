    \n| 性能指标 | 描述 |\n| :--- | :--- |\n| Load Time（加载时间） | 从初始请求到浏览器加载事件所花费的时间 |\n\
    | First Byte（首字节） | 接收第一个字节所花费的时间 |\n| Start Render（开始渲染） | 浏览器开始在页面上渲染内容所花费的时间\
