  - '[PAGE 131]


    Alternatively, you could opt for web-specific module bundlers such as [webpack](https://webpack.js.org/)
    or [Parcel](https://parceljs.org/), which *understand* HTML, CSS, and JavaScript
    so they can parse and build optimized code, through operations like these:


    +   - dead asset elimination

    - code splitting and dependency handling

    - ES6 to ES5 transpiling

    - minification

    - source map generation

    - cache-busting

    - live reloading

    - enforcing performance budgets (discussed below)


    > > Module bundlers often promise zero configuration ... *although the reality
    may be somewhat different!*


    A few tips to get started:


    +   - Choose a build system and stick with it for a while.

    - Automate the most frustrating tasks first.

    - Try not to overcomplicate your build process. Spend an hour or two creating
    an initial setup, then evolve it over time.

    - Do as much during the build process as possible. For example, an HTML template
    could be partially constructed from known data and partials rather than parsing
    everything at render time.


    Further reading:


    +   - [A Guide to Using npm as a Build Tool](https://medium.com/nicholas-dykes/a-guide-to-using-npm-as-a-build-tool-785d08731039)

    - [An Introduction to Gulp.js](https://www.sitepoint.com/introduction-gulp-js/)

    - [A Beginner''s Guide to Webpack](https://www.sitepoint.com/webpack-beginner-guide/)

    - [A Beginner''s Guide to Parcel](https://www.sitepoint.com/parcel-beginner-guide/)


    # # Use Progressive Enhancement


    **Progressive enhancement** is a development approach rather than a technology.'
  - '[PAGE 132]


    Each site or app feature starts with a baseline minimum viable implementation—perhaps
    an HTML-only solution. Enhancements are then added progressively when they’re
    supported by the user’s device. Consider a simple search box:


    +   1. The base solution is an HTML `<input type="search" />` field which, when
    a string is entered, triggers a new page load showing search results.

    2. HTML5 [constraint validation](https://developer.mozilla.org/en-US/docs/Web/Guide/HTML/HTML5/Constraint_validation)
    can be applied to ensure searching only occurs when a minimum of three characters
    has been entered.

    3. CSS styles are applied, showing basic formatting such as fonts, colors, borders,
    etc.

    4. When the field has focus, CSS animations could enlarge the field, show a submit
    button, etc.

    5. JavaScript could show suggestions as the user types characters.

    6. JavaScript could show a simple list of search results without the user having
    to leave the current page.

    7. PWA service workers could be used to cache suggestions and search results for
    later use.


    Where necessary, the code tests that a feature is supported before attempting
    the enhancement. For example, suggestions could be implemented when JavaScript
    is running, events are supported, and the HTML5 `<datalist>` element is available.'
  - '[PAGE 133]


    # Adding Missing Features with Polyfills


    It''s often possible to use a polyfill to add a missing feature to browsers without
    native support. This can range from additional prototypes, such as the [String.padStart()
    method](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/padStart),
    through to full APIs, such as one to [provide geolocation support using IP lookups](https://github.com/nicktomlin/polyfill-geolocation).


    [Polyfill.io](https://polyfill.io) provides a custom set of polyfills. However,
    be wary about the performance cost of attempting to polyfill everything. It may
    be preferable to offer IE users a fast, rudimentary feature than a slow, fully
    polyfilled experience.


    In the search box example above, progressive enhancement offers the following
    benefits:


    +   - The search box is device agnostic and works in all browsers—old, current,
    and those released tomorrow.

    - Assuming the HTML loads, the search box is always operational. This includes
    the period before CSS and/or JavaScript is downloaded and parsed. In performance
    terms, the feature is responsive immediately.

    - The user gets the best possible experience their device can handle. Performance
    isn''t affected when an enhancement can''t be added.

    - The search box is fault-tolerant: any enhancement can work or fail without breaking
    the system. It doesn''t matter whether CSS and/or JavaScript are blocked, are
    slow to arrive, or fail to download.

    - It''s the responsible option, and doesn''t require more development effort in
    most situations.


    The approach has no downsides. Progressive enhancement only breaks when:


    +   1. It isn''t considered from the start. It may be difficult to retrospectively
    enhance a feature that already requires a high base-level of CSS and JavaScript.

    2. You try to support all browsers equally. It''s futile to expect a decade-old
    version of IE to behave the same as a modern application. Progressive'
  - '[PAGE 134]


    enhancement means you never need to worry about old browsers. Their users may
    not receive the best experience, but the feature remains usable.


    # Adopt a Performance Budget


    A performance budget imposes a limit on related metrics. Typical options include:


    +   - quantity-based limits, such as the maximum number of fonts, images, scripts,
    etc.

    - time-based limits, such as the first meaningful paint or interactive times

    - rule-based limits, such as a minimum performance and accessibility score in
    Lighthouse audits


    You should experiment and discuss options with stakeholders to establish baseline
    criteria, such as:


    +   - the total size of a page must not exceed 500KB

    - a single image must be no more than 150KB

    - the home page must deliver less than 100KB of JavaScript

    - all pages must be readable within five seconds on a mid-range mobile device
    operating on an average 3G connection


    Ideally, these criteria can be added to your build process. Tools such as the
    Lighthouse module and file size plugins can report—and potentially block—any deviation
    from the budget. Exceeding the budget means you must either:


    +   1. optimize an existing feature/asset

    2. lazy load an existing feature/asset on demand

    3. remove an existing feature/asset

    4. reject the new feature/asset


    The limitations can help teams prioritize features. Increasing the budget should
    always be tougher than implementing another solution! For example, a budget increase
    must be discussed, justified, and agreed to by a two-thirds majority at a'
  - '[PAGE 135]


    monthly progress meeting!


    Performance budget tools:


    +   - [performancebudget.io](http://performancebudget.io): estimate file sizes
    according to download timings

    - [bundlesize](http://bundlesize): calculate file sizes during the build process

    - [SpeedCurve](http://SpeedCurve): track real-world performance (commercial)


    # Create a Style Guide


    A style guide is a set of agreed brand, content, design, and coding standards
    for teams generally working on large codebases developed over a long period. A
    good style guide promotes consistency and illustrates how developers should approach
    solutions. Front-end components can be demonstrated with example code that shows
    styling, animation, functionality, and restrictions. The benefits include:


    +   - new team members can become productive quickly

    - components are reused: developers are less likely to introduce their own HTML,
    CSS, and JavaScript

    - it becomes easier to update, maintain, and improve component performance when
    the same code is used throughout

    - code can be tested and quality assurance becomes simpler

    - users receive a consistent UI experience


    A style guide can be as rigid or as flexible as you require. It’s often best to
    develop it as a set of HTML pages that can demonstrate code and be updated quickly.
    Example documents are available from [styleguides.io](http://styleguides.io).


    # Simplify and Streamline


    Performance problems often start because stakeholders equate more features with
    more customers. This is rarely the case; most people prefer simplicity. They’re
    not using your site/app on a daily basis and just want to get a task done quickly
    and easily.'
  - '[PAGE 136]


    Average page weight reached 2MB because developers let it happen. We''re under
    pressure to deliver more in a shorter time, but are we doing the job effectively
    when it results in a slow, clunky application no one wants to use? Few clients
    will understand the intricacies of web performance, so it''s our responsibility
    to use efficient coding practices and to highlight potential pitfalls in layman''s
    terms.


    +   1. Be wary of the performance cost of any added features.

    2. Use analytics to monitor and identify little-used features.

    3. Fully remove unnecessary features or replace them with sleeker, lightweight
    alternatives.


    Look after the bytes and the megabytes will take care of themselves!


    # Learn to Love the Web


    The Web evolved from a document publishing platform to an application delivery
    system that revolutionized the way we distribute and use software. Unfortunately,
    this has resulted in an alarming tendency to over-engineer solutions when simpler
    options could be more effective. Rather than choose a native HTML control, we
    import the latest JavaScript module. Instead of adding a few styles, we copy vast
    quantities of CSS from Stack Overflow and Bootstrap.


    If there''s one piece of advice to take away from this book, it''s *learn the
    basics*. Somewhat contradictorily, HTML and CSS are either disregarded as too
    simplistic to warrant respect or considered impenetrable technologies that must
    be fixed using JavaScript. Yet they''re the fundamental building blocks of the
    Web:


    +   - HTML5 has around 120 elements. Half of those will rarely be used, but there''s
    usually a better alternative to `<div>` and `<span>`.

    - There are almost 400 CSS3 properties and more are being added. No one could
    name them all, but they''re modularized. The foundations can be learned quickly,
    but experimentation and experience is required to understand the concepts.'
- md: '## Chapter 6

    ### Check, Please!


    Learning HTML and CSS will make you a better web developer and advance your JavaScript
    skills. A little knowledge will considerably improve your application''s performance.


    I hope you''re feeling full after your extensive buffet of performance delicacies.
    Not all dishes will have been to your taste, but you should have found a few recipes
    to try.


    The main reason we don''t have a fast and responsive web is because we let it
    become slow and bloated. Performance is rarely given equal priority with other
    features. In most cases, it''s never even acknowledged until someone complains
    about speed. Like SEO or usability, it''s possible to improve performance toward
    the end of a project—but it''s far more effective to implement it from the start.


    Software development is a complex process, and it will always be possible to make
    optimizations. However, if you target the big, easy wins first, the tougher refactoring
    or rewrites will become less necessary. Ideally, you should consider performance
    every time you add a feature or asset to your site or application. It will make
    you a more conscientious developer and will win the respect of your peers and
    users.


    *Let''s strive to build a better web!*


    Further reading:


    - [MDN web performance](https://developer.mozilla.org/en-US/docs/Web/Performance)

    - [The Cost of JavaScript](https://medium.com/@addyosmani/the-cost-of-javascript-in-2019-2e09a158f9f)

    - [The Ethics of Web Performance](https://www.smashingmagazine.com/2019/03/ethics-web-performance/)'
