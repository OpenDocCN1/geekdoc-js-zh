  md: "Retrofit Your Website as a Progressive Web App\n\n# Power Down Inactive Tabs\n\
    \nAlthough we're mostly concerned with page performance when a user interacts\
    \ with our site, we should also be responsible when the tab is inactive.\n\nBrowsers\
    \ normally throttle events such as [requestAnimationFrame](https://google.com),\
    \ [intervals](https://google.com), and [timeouts](https://google.com) on inactive\
    \ tabs, but we can take this further to auto-pause and resume games, animations,\
    \ video playback, Ajax polling, WebSocket handling, background loading, notifications,\
    \ and so on. The less work an inactive tab does, the longer the smartphone battery\
    \ will last, and the more likely the user can return to your site!\n\nThe [Page\
    \ Visibility API](https://google.com) can be used to detect whether or not a tab\
    \ is active and trigger an event when visibility changes. The following code adds\
    \ a `tab-active` class to the `<html>` element when the tab is being viewed:\n\
