    \n## Consider Inlining Critical CSS\n\nGoogle page analysis tools often make a\
    \ suggestion to \"inline critical CSS\" or \"reduce render-blocking style sheets\"\
    . Loading a CSS file blocks rendering, so performance can be improved by:\n\n\
    1.  Extracting the styles used to render elements above the fold. Tools such as\
    \ [critical](https://github.com/addyosmani/critical) and [criticalCSS](https://github.com/filamentgroup/criticalCSS)\
    \ can help.\n2.  Inlining those styles in a `<style>` element in the HTML `<head>`.\n\
    3.  Loading the main CSS file asynchronously using JavaScript at the bottom of\
    \ the page, or perhaps once the DOM is ready.\n\nThe technique noticeably improves\
    \ performance—even on a fast connection—and will boost audit scores. It could\
    \ benefit progressive web or single-page apps with consistent interfaces, but\
    \ may be more difficult to manage on other sites:\n\n- The “fold” is different\
    \ on every device.\n- Many sites have a variety of page layouts. Each could require\
    \ different critical CSS, so a build tool becomes essential.\n- Critical CSS tools\
    \ can struggle with specific frameworks, HTML generated by client-side code, or\
    \ dynamic, event-driven changes.\n- The technique mostly benefits the user’s first\
    \ page load. CSS is cached for subsequent pages so additional inlined styles will\
    \ increase page weight.\n\n## Provide Accelerated Mobile Pages (AMP)\n\nThe AMP\
