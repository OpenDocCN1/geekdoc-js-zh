  md: '# # Excuse #10: “Our Client is Happy!”


    Clients employ you for your expertise, and pitching optimization as a selling
    point will differentiate your business from others.


    Web performance is an essential part of a web developer’s job. A little effort
    can reap considerable rewards for everyone:


    +   - less code is required

    - users receive a slicker experience

    - search engine rankings improve

    - conversions increase

    - hosting costs decrease


    > *No one will criticize you for building a super-fast, responsive site!*


    # # Where do I Start?


    The next chapter introduces tools to help you identify issues. This is followed
    by a delicious buffet of food-inspired chapters:


    **Chapter 3: Quick Snacks** A selection of simple, practical, cost-effective performance
    solutions that can be implemented on any site in minutes.


    **Chapter 4: Simple Recipes** Some more complex development options that may take
    a few hours or days to implement but could have a larger positive impact.


    **Chapter 5: Life-changing Diets** More radical development considerations and
    techniques that are best adopted from the start of your project.


    Page weight reduction and optimization tips are generally grouped into similar
    concepts, with the easiest or most beneficial covered first.


    Those attempting to improve an existing site should read each chapter in order.
    Those starting a new project may benefit from reading the chapters in reverse
    order, since more radical approaches then become viable.'
