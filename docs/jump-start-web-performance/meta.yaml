  md: "# Avoid Animating Expensive Properties\n\nOnce the browser has parsed the HTML\
    \ document and styles, it renders elements in three stages:\n\n+   1. **Layout:**\
    \ the calculation of how much space an element requires and how it affects elements\
    \ around it\n2. **Paint:** the filling of pixels with color\n3. **Composite:**\
    \ the drawing of layers in the correct order when they overlap\n\nAnimating the\
    \ dimensions or position of an element can cause the whole page to re-layout on\
    \ every frame. Performance can therefore be improved if an animation only affects\
    \ the compositing stage. The most efficient animations only use:\n\n+   1. `opacity`\
    \ and/or\n2. `transform` to translate (move), scale, skew, or rotate an element\
    \ (the original space the element used is not altered so the layout is not affected)\n\
    \nBrowsers often use the hardware-accelerated GPU to render these effects in their\
    \ own layer. If neither property is ideal for your animation, consider taking\
    \ the element out of the page flow with `position: absolute;` or similar to avoid\
    \ complex layout changes.\n\n# Indicate Which Elements Will Animate\n\nThe **will-change**\
    \ property allows CSS authors to indicate how an element will be animated so the\
    \ browser can make performance optimizations in advance—for example, to declare\
    \ that an element will have a transform applied:\n\n```\n.myelement {\n    will-change:\
    \ transform;\n}\n```\n\nAny number of comma-separated properties can be defined.\
    \ However:"
  merge: -1
  pgno: 105
- img_proc: true
  md: '+   - Only use `will-change` as a last resort to fix animation issues. *It
    should not be used to anticipate performance problems.*

    - Don''t apply it to too many elements.

    - Give it sufficient time to work. Don''t begin animations immediately.


    # Use CSS Containment


    CSS Containment is a new (experimental) feature that indicates when an element''s
    subtree is independent from the rest of the page. This can improve rendering performance
    during animations or when elements are added, modified, or removed from the DOM.
    The new CSS `contain property` accepts one or more of the following values in
    a space-separated list:


    +   - `none` : containment is not applied.

    - `layout` : the internal layout of the element is isolated from the rest of the
    page. Its content cannot have any effect on ancestor elements.

    - `paint` : children of the element will not be displayed outside its boundary.
    Any overflows will not be visible (similar to `overflow: hidden;` ).

    - `size` : the size of the element can be determined without checking its children.
    The dimensions are independent of the content.

    - `style` : counters and quotes cannot appear outside the element. *(This value
    may be dropped from the specification.)*


    Two special values are also available:


    +   - `strict` : all containment rules except `style` are applied. This is equivalent
    to `contain: layout paint size;` .

    - `content` : all containment rules except `size` and `style` are applied. This
    is equivalent to `contain: layout paint;` .


    Imagine you have a page with an unordered `<ul>` list containing one thousand
    child `<li>` list elements. If you change the contents of a single item that has
    `contain: strict;` applied, the browser won''t attempt to recalculate the size
    or position of that item, others in the list, or any other elements on the page.'
