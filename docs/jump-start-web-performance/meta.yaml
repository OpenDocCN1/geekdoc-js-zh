    大多数工具会引用这些阶段，同时引入自己的指标，这些指标通常结合了两个或更多阶段。本质上，所需的步骤越少，性能就越好。采取措施最小化 HTTP 请求并减少浏览器处理，将带来更流畅的用户体验。


    ## Google Lighthouse / Chrome 审计


    [Lighthouse](https://developer.chrome.com/docs/lighthouse/overview) 是一个开源工具，有助于评估你的网页或应用的性能和质量。你可以通过以下方式访问它：


    1.  在 Chrome 的开发者工具中

    2.  通过在线工具 [web.dev](https://web.dev/) 或 [PageSpeed Insights](https://developers.google.com/speed/pagespeed/insights/)

    3.  作为 [Node.js 模块](https://www.npmjs.com/package/lighthouse)，通过它可以执行命令行和自动化测试


    从 Chrome 的开发者工具开始是最简单的。在 Chrome 中导航到任意页面，按 `Ctrl|Cmd + Shift + I` 或 `F12` 打开开发者工具面板，然后点击
    **Audits** 标签页：


    24 快速启动 Web 性能


    ![](img/d93d5aab668f52eb84bb477fd9a96986_23_0.png)


    2-1. Lighthouse Audits 标签页


    选择设备、审计类型、网络速度，并勾选 **Clear storage** 以确保不受浏览器缓存的影响。点击 **Run audits** 后，结果屏幕很快就会出现：


    ![](img/d93d5aab668f52eb84bb477fd9a96986_24_0.png)


    2-2. Lighthouse 审计结果


    > **浏览器扩展**


    浏览器扩展会影响结果，但 Chrome 会警告你潜在的问题。可能需要在无痕窗口中运行测试，因为它默认禁用扩展。


    性能、可访问性、最佳实践和 SEO 分数提供了快速查看的百分比结果，可以点击以获取更多信息。


    性能信息包括：


    | 性能指标 | 描述 |

    | --- | --- |

    | 首次内容绘制 | 第一个文本或图像被绘制的时间 |

    | 首次有意义绘制 | 主要内容可见时 |

    | 速度指数 | 页面内容可见填充的速度 |

    | 首次 CPU 空闲 | 主线程能够处理输入的时间 |

    | 可交互时间 | 页面变得完全可交互所需的时间 |

    | 最大潜在首次输入延迟 | 浏览器能够响应交互的时间 |


    数字越低，页面性能越好。接下来是 **Opportunity** 部分，它建议了潜在的改进和估计的节省。


    ### 渐进式 Web 应用


    [第 4 章] 中的 PWA 部分描述了渐进式 Web 应用技术的好处，这些技术允许 Web 应用被安装和缓存，并可以离线工作。


    ## 开发者工具的 Network 面板


    大多数浏览器中的开发者工具提供了一个 **Network** 面板，它显示了页面加载期间以及后续任何文件、Ajax 或 WebSocket 数据流期间的所有网络活动日志。


    # 测试工具 27


    ![](img/d93d5aab668f52eb84bb477fd9a96986_26_0.png)


    2-3. 开发者工具的 Network 面板


    底部的状态栏总结了请求数量、总数据传输量（可能已压缩）、所有未压缩资源的总大小、总下载时间以及文档 DOMContentLoaded 和 window load
    事件触发的时间。


    顶部提供了进一步的选项：


    -   **Preserve log**：不在页面加载之间清除日志

    -   **Disable cache**：从网络加载所有文件，以便更好地评估首次页面访问

    -   **Throttle network speed**：选择或定义下载速度配置文件


    可以通过点击表格标题来显示、隐藏或重新排序资源。按大小或下载时间排序将有助于找到最大或最昂贵的资源。


    **Filter** 框允许你搜索特定的资源或输入标准，例如：


    -   `is:running` ：显示任何未完成或无响应的请求

    -   `larger-than:s` ：限制为大于 *s* 的文件，可以用字节（ *10000* ）、千字节（ *1000k* ）或兆字节（ *1M* ）表示

    -   `-larger-than:s` ：限制为小于 *s* 的文件

    -   `-domain:*.yourdomain.com` ：显示非来自你的主域名的第三方请求


    > ### 🟢 来自其他域的资源

    > 大多数网站从其他域请求资源，例如 CDN（内容分发网络）、字体仓库、分析跟踪器、广告网络、社交媒体分享按钮等。虽然有用，但这些资源可能会对性能、隐私和安全产生负面影响。更多信息请参考[第
    4 章](https://example.com)。


    ## Chrome 的 Performance Monitor


    Chrome 新的 **Performance Monitor** 可以从开发者工具的 **More tools** 子菜单中访问（尽管这可能因 Chrome
    版本而异）。


    ![](img/d93d5aab668f52eb84bb477fd9a96986_28_0.png)


    2-4. 启动 Performance Monitor


    它出现在底部的控制台抽屉面板中，并在你使用页面时实时更新图表。


    ![](img/d93d5aab668f52eb84bb477fd9a96986_29_0.png)


    2-5. Chrome 开发者工具的 Performance Monitor


    可以通过点击左侧的标题来显示和隐藏监视器：


    | 性能监视器 | 描述 |

    | :--- | :--- |

    | CPU 使用率 | 处理器利用率从 0% 到 100% |

    | JS 堆大小 | JavaScript 对象所需的内存 |

    | DOM 节点数 | HTML 文档中的元素数量 |

    | JS 事件监听器 | 已注册的 JavaScript 事件监听器数量 |

    | 文档数 | 包括页面、CSS、JS 等的文档资源数量 |

    | 文档帧数 | 框架、内联框架和工作线程脚本的数量 |

    | 布局次数 / 秒 | 浏览器必须重新布局 DOM 的速率 |

    | 样式重算次数 / 秒 | 浏览器必须重新计算样式的速率 |


    Performance Monitor 可用于发现活动中的异常峰值——例如，当页面添加元素时内存使用或布局重计算增加。然后可以在 **Performance
    Panel** 中进行进一步调查。


    ## 开发者工具的 Performance 面板


    Chrome、Firefox、Safari 和 Edge 中提供的开发者工具提供了一个 **Performance** 标签页，允许你在执行特定操作时录制浏览器活动的快照。与
    Performance Monitor 不同，你必须先录制配置文件才能对其进行分析。


    要使用 Chrome 版本，打开开发者工具并导航到 **Performance** 窗格。**Settings** 齿轮允许你选择网络和 CPU 节流选项，然后点击
    **Record** 图标。


    ![](img/d93d5aab668f52eb84bb477fd9a96986_30_0.png)


    根据需要加载或使用你的网站，然后点击 **Stop** 以生成性能报告。


    ![](img/d93d5aab668f52eb84bb477fd9a96986_31_0.png)


    2-7. 开发者工具的性能报告


    报告可能看起来很复杂，但可以保存并在以后重新加载以进行进一步分析。


    顶部的时间线图表显示了每秒帧数、CPU 使用率、网络使用率、屏幕截图和堆内存大小。可以选择一个区域以专注于特定点。


    结果窗格可以展开和折叠。Chrome 的版本不同，但窗格可能包括：


    -   **Network**：单个文件的加载时间

    -   **Frames**：时间线上各点的屏幕截图

    -   **Interactions**：输入和动画计时

    -   **Timings**：例如 DOMContentLoaded 和首次有意义绘制等事件

    -   **Main**：线程活动，例如函数调用和事件处理程序


    紧随其后的是显示 JavaScript 内存堆、文档数量、节点数量、事件监听器和 GPU 内存使用情况的图表。


    最后的 **Summary** 面板会随着你在上方窗格中点击项目而变化。细分可能包括函数调用和事件详细信息，以及适当的计时：


    -   **Loading**：从网络加载资源的时间

    -   **Scripting**：导致视觉变化的 JavaScript 执行（这也可以包括 CSS 动画和过渡）

    -   **Rendering**：浏览器计算哪些 CSS 规则适用以及布局如何受影响的过程

    -   **Painting**：浏览器按正确顺序填充像素和绘制图层的过程

    -   **System**：其他浏览器活动

    -   **Idle**：无活动


    该面板通常可用于发现低效的活动，包括：


    -   昂贵的事件处理程序，例如附加到滚动或鼠标悬停操作的处理程序

    -   运行时间长的 JavaScript 函数

    -   缓慢或严重节流的网络请求

    -   持续上升的 JavaScript 堆，这可能是内存泄漏或垃圾收集不佳导致的

    -   影响许多 DOM 元素的样式更改

    -   导致频繁布局更改的动画

    '
