    # Lazy Load Images and Iframes


    The average web page requests almost 1MB of images. Half of all websites load
    significantly more! These images (and embedded `<iframe>` elements) download regardless
    of whether they''re viewed or not. A large off-screen image requires bandwidth
    and processing even when the user clicks a link at the top of the page and never
    scrolls down.


    Load times, bandwidth, and device requirements can be reduced by lazy loading
    images and iframes when they''re scrolled into the viewport. Chrome 76 and above
    support native lazy loading with the new `loading` attribute:


    ```

    <img src="image.png" loading="lazy" alt="lazy load" />

    <iframe src="https://site.com/" loading="lazy"></iframe>

    ```


    The following values can be set:


    +   - `auto`: the browser''s default behavior (identical to not using the attribute)

    - `lazy`: defer loading until the resource reaches a distance from the viewport

    - `eager`: load the resource immediately


    The *distance from the viewport* can vary according to the type of resource, the
    network connection, and whether Lite mode/Save-Data is enabled. (Lite mode/Save-Data
    is covered later in this chapter.)


    Native lazy loading is new, so non-Chrome and older browsers require JavaScript-based
    solutions such as [progressive-image.js](https://progressive-image.js/). These
    analyze scroll and resize events or use the [Intersection Observer API](https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API)
    to determine when an element is in view. As well as supporting more browsers,
    they can also implement attractive loading effects.'
