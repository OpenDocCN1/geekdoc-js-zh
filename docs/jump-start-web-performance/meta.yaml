  - "[PAGE 86]\n\n# Play Audio and Video on Demand\n\nAuto-playing media saps bandwidth,\
    \ degrades performance, and is unlikely to be appreciated by users. Modern browsers\
    \ will also block or silence auto-playing by default.\n\nIn most cases, it's preferable\
    \ to show a thumbnail image—perhaps with a *play* icon overlay—which the user\
    \ can click to start the media. Both the `<video>` and `<audio>` elements support\
    \ this feature with the following attributes:\n\n+   - `autoplay=\"false\"` to\
    \ stop auto-playing\n- `preload=\"none\"` to prevent media preloading or `preload=\"\
    metadata\"` to fetch meta data such as the video duration\n- `poster=\"image.jpg\"\
    ` to show a thumbnail image\n- `controls=\"true\"` to enable native playback controls\n\
    \nHere's an example:\n\n```\n<video controls=\"true\"\n       autoplay=\"false\"\
    \n       preload=\"metadata\"\n       poster=\"videothumb.jpg\">\n  <source src=\"\
    video.mp4\" type=\"video/mp4\">\n  <source src=\"video.webm\" type=\"video/webm\"\
    >\n</video>\n```\n\nAlternatively, a JavaScript solution could be implemented\
    \ that replaces a (lazy loaded) `<img>` with appropriate `<video>` or `<audio>`\
    \ elements when clicked. The solution could also work for third-party video providers\
    \ such as YouTube and Vimeo, which provide custom video players.\n\n# Replace\
    \ Images with CSS3 Effects\n\nThe days of slicing and dicing images in a graphic\
    \ package to create custom fonts, rounded corners, shadows, linear gradients,\
    \ and transparency effects have long gone. CSS3 options such as web fonts, border-radius,\
    \ text-shadow, box-shadow, opacity, and gradients have been supported by most\
    \ browsers for some time."
