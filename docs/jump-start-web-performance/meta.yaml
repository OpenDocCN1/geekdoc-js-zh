    # Provide Accelerated Mobile Pages (AMP)


    The AMP project was announced in October 2015. A collaboration between Google
    and more than 30 news publishers aimed to improve mobile web performance. **AMP**
    is an open-source web component framework which claims that “you can easily create
    user-first websites, stories, emails, and ads.”


    AMP requires you to publish existing or original content as an AMP HTML page.
    AMP HTML is a subset of HTML5, providing a limited set of web components, styles,
    images, videos, and advertisements. Features and styling are purposely restricted,
    and you can’t add custom JavaScript. Most AMP pages are served from Google’s AMP
    cache—a proxy-based CDN that assigns a Google-specific URL to the page. This ensures
    optimal delivery using Google’s global network.


    AMP is fast, so it’s mentioned in this book. However, while the project may have
    started with noble aims, AMP has been criticized for serving Google more than
    publishers and users, for reasons such as this:


    +   - AMP is not necessarily faster or more efficient than your own optimized
    website.

    - Unless you go AMP-only, you must duplicate existing content pages.

    - Alternative URLs may be confusing to users.

    - Google gains control of your content, visitors, and data.'
