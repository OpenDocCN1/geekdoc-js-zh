  md: '# The Cost of Poor Performance


    Web obesity, slow downloads, and poor performance hit everyone—site users, online
    business owners, and even those who’ve never accessed the Web.


    # User Costs


    At the start of 2020, the average web page comprises:


    +   - 27KB of HTML content

    - 64KB of CSS split over seven style sheets

    - four fonts, totaling 122KB

    - 410KB of JavaScript in 20 source files

    - 31 images, requiring 980KB of bandwidth (a *third of these are off screen and
    may never be viewed!*)'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Average Page Weight 2020: 1,940Kb


    ![](img/d93d5aab668f52eb84bb477fd9a96986_12_0.png)


    1-1. Average page weight in 2020


    The total: 1,940KB of data made over 74 HTTP requests, which takes seven seconds
    to fully appear on the average user''s desktop worldwide. This increases to a
    frustrating 20 seconds on mobile devices. (Source: [HTTP Archive](https://httparchive.org/),
    which analyzes five million popular content websites.)


    Downloading this web page on a typical mobile phone costs US users $0.20. Those
    browsing in Vanuatu, Mauritania, and Madagascar pay more than 1% of their daily
    income for the privilege of viewing a single page—despite it containing a mere
    27KB of potentially readable content. (Source: [whatdoesmysitecost.com](https://whatdoesmysitecost.com/).)'
  merge: -1
