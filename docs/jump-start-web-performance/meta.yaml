    # Excuse #1: “We Don’t Have a Performance Problem!”


    Are you using the latest PC or smartphone on a fast network? Try a mid-range,
    two-year-old device. Try limiting bandwidth to your country’s average speed. Try
    using your site on a VPN or hotel Wi-Fi.


    # Excuse #2: “Our Users Never Complain?”


    Possibly because they abandon your site and never return. Few people bother to
    make a complaint when competing content and services are a few clicks away.


    # Excuse #3: “Our Users Have High-end Devices”


    This presumption becomes a self-fulfilling prophecy when a site can only be viewed
    by those with a recent device on a fast connection.


    Would your revenues increase if more people could access your service? Are you
    considering explosive web growth in markets such as Asia, Africa, and South America,
    where smartphone and network capacity may be more limited?


    # Excuse #4: “Our Customers Use Modern Browsers”


    There’s a common myth that 1% of users disable JavaScript or block other browser
    features such as images or CSS—for example, those using screen readers. This could
    be a considerable number, yet it’s used as an excuse to discriminate against certain
    groups in order to make development easier and avoid addressing performance on
    less capable devices.


