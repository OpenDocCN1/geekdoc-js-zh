    为方便商标所有者，本书仅以编辑方式使用商标名称，并非意图侵犯商标，而非每次出现商标名称都予以标明。\n\n![](img/d93d5aab668f52eb84bb477fd9a96986_0_0.png)\n\
    \n由 SitePoint Pty. Ltd. 出版\n地址：Level 1, 110 Johnston St, Fitzroy\nVIC Australia\
    \ 3065\n网址：www.sitepoint.com\n邮箱：books@sitepoint.com\nISBN 978-1-925836-33-2 (电子书)\n\
    在美国印刷和装订\n\n## 关于 Craig Buckler\n\n[Craig](https://www.sitepoint.com/) 是一名自由开发者、作家和演讲者，对网络技术有着永不枯竭的热情。\n\
    \n他于 20 世纪 80 年代开始编程，当时应用程序必须挤进几 KB 的内存中。20 世纪 90 年代中期，随着 28K 调制解调器成为典型配置，100KB\
    \ 的页面被视为奢侈，他对网络的热情被点燃。\n\n在过去的十年里，随着网络标准的演进，Craig 为 SitePoint 撰写了 1,200 篇教程。尽管生活在一个技术上令人惊叹的未来，他从未忘记用有限资源可以实现什么。\n\
    \n## 关于 SitePoint\n\nSitePoint 专注于为网络专业人士发布有趣、实用且易于理解的内容。访问 [https://www.sitepoint.com/](https://www.sitepoint.com/)\
    \ 即可访问我们的博客、书籍、时事通讯、文章和社区论坛。您将在这里找到大量关于 JavaScript、PHP、Ruby、移动开发、设计等方面的信息。\n\n\
