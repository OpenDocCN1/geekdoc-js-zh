    ## 第六章

    ### 结账，谢谢！


    学习 HTML 和 CSS 将使你成为更出色的 Web 开发者，并提升你的 JavaScript 技能。掌握一些基础知识将显著提高你的应用程序性能。


    希望你在享用这场性能优化的盛宴后感到满足。并非所有菜肴都合你口味，但你应该已经找到了几道想要尝试的食谱。


    我们未能拥有快速响应的 Web，主要原因在于我们任其变得迟缓臃肿。性能很少能与其他功能获得同等重视。在大多数情况下，直到有人抱怨速度问题，性能才会被关注。与
    SEO 或可用性类似，在项目后期也有可能提升性能——但从一开始就规划实施效果要好得多。


    软件开发是一个复杂的过程，优化总是存在的空间。然而，如果你优先攻克那些重大且易于实现的改进点，那么后续更艰巨的重构或重写工作就会变得不那么必要。理想情况下，你应该在为网站或应用程序添加任何功能或资源时都考虑性能因素。这将使你成为更负责任的开发者，并赢得同行和用户的尊重。


    *让我们努力构建一个更好的 Web！*


    延伸阅读：


    - [MDN Web 性能](https://developer.mozilla.org/en-US/docs/Web/Performance)

    - [JavaScript 的代价](https://medium.com/@addyosmani/the-cost-of-javascript-in-2019-2e09a158f9f)

    - [Web 性能的伦理](https://www.smashingmagazine.com/2019/03/ethics-web-performance/)

