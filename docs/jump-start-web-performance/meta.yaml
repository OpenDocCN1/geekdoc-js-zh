    - a screen reader or older device is used'
- md: 'the browser doesn''t support specific features

    - a browser extension blocks, breaks, or modifies code

    - the browser disables JavaScript on slow connections


    It is possible to build robust, high-performance applications that can cope with
    these situations. Does yours?


    ## Excuse #5: “We’ll Address Performance Later”


    > Premature optimization is the root of all evil.


    This quote is attributed to Donald Knuth, from his paper “Structured Programming
    with `go to` Statements”. It relates to programmers wasting time on efficiencies
    that aren''t an immediate problem—such as a small start-up trying to ensure their
    application scales to millions of users.


    The full quote in context:


    > We should forget about small efficiencies, say about 97% of the time: premature
    optimization is the root of all evil. Yet we should not pass up our opportunities
    in that critical 3%.


    Before you reach millions of users, you need to ensure the first few dozen people
    want to use your product. Back-end server or database inefficiencies are unlikely
    to be a major issue in the early days.


    However, front-end performance can make or break an application. It could be part
    of your “critical 3%”, and it''s easier to address optimization from the start.


    # Web Performance Matters


    ## Excuse #6: “Some Systems Require More Bandwidth and Processing”


    Complex web apps such as Gmail, maps, social networks, games, and image galleries
    will require more bandwidth and processing capacity than content websites. Performance
    remains a critical issue, but a higher page weight and slower load time can be
    expected.


    However, the [HTTP Archive](http://httparchive.org) crawls articles and online
    shops. It’s not looking at web applications. The average 2MB website page weight
    is the equivalent of half of all Shakespeare’s plays, or the 1993 disk-based distribution
    of [DOOM](http://doom.com)—*on a single page often containing only a few paragraphs
    of content*. There’s little excuse for not addressing performance.


    ## Excuse #7: “Expanding Page Weight is the Price of Progress”


    This may be true for some edge cases. However, developers strived to keep pages
    under 100KB during the dial-up days of the late 1990s. Has web content become
    20x better or faster since that time?


    ## Excuse #8: “Slimming Pages Means Dumbing Down, with Fewer Features and Effects”


    Performance can often be improved with minimal effort and no loss of functionality.


    You can do more with less as web browsers evolve. Consider the CSS3 `border-radius`
    property: adding rounded corners now requires a few bytes of code compared to
    the multiple image shenanigans of a decade ago.


    ## Excuse #9: “Improving Performance Increases Complications and Maintenance”


    Removing unused or unnecessary images, videos, fonts, CSS, and JavaScript will
    simplify your site. It should result in fewer complications and less maintenance.


    ## Excuse #10: “Our Client is Happy!”


    Clients employ you for your expertise, and pitching optimization as a selling
    point will differentiate your business from others.


    Web performance is an essential part of a web developer’s job. A little effort
    can reap considerable rewards for everyone:


    - less code is required

    - users receive a slicker experience

    - search engine rankings improve

    - conversions increase

    - hosting costs decrease


    > *No one will criticize you for building a super-fast, responsive site!*


    ## Where do I Start?


    The next chapter introduces tools to help you identify issues. This is followed
    by a delicious buffet of food-inspired chapters:


    **Chapter 3: Quick Snacks** A selection of simple, practical, cost-effective performance
    solutions that can be implemented on any site in minutes.


    **Chapter 4: Simple Recipes** Some more complex development options that may take
    a few hours or days to implement but could have a larger positive impact.


    **Chapter 5: Life-changing Diets** More radical development considerations and
    techniques that are best adopted from the start of your project.


    Page weight reduction and optimization tips are generally grouped into similar
    concepts, with the easiest or most beneficial covered first.


    Those attempting to improve an existing site should read each chapter in order.
    Those starting a new project may benefit from reading the chapters in reverse
    order, since more radical approaches then become viable.


    # Testing Tools


    ## Chapter 2


    Admitting your site has a performance problem is the first step on the road to
    recovery! This chapter provides a list of testing tools to help you understand
    issues using real data, showing how:


    1. the largest assets can be discovered

    2. the slowest network responses can be identified

    3. the reasons for poor browser performance can be diagnosed


    It may be necessary to run tests a few times to establish a measurable performance
    baseline. The same tests can then be rerun to evaluate performance improvements—or
    deteriorations—after code has been updated.


    ## Create a Test Plan


    You should test your websites and applications for defects, ease of use, accessibility,
    quality assurance, and other factors. Evaluating performance is no different,
    and it''s best to follow a plan that lays out:


    1. who''s responsible for running tests

    2. what tools and settings will be used for each test

    3. how results will be recorded and fed back into the development process


    Use performance analysis tools manually at first to understand the reports and
    determine optimization priorities.


    As your processes evolve, it *may* become possible to automate these tests so
    developers are warned about potential problems and perhaps blocked from committing
    poorly optimized code. [Chapter 5](Chapter 5) describes several options for improving
    your workflow with build processes and performance budgets.


    ### Automated vs Manual Testing


    Automated tests are never a substitute for manual user testing! Tests are good
    at repeating operations to report faults, but they''re unlikely to discover issues
    you weren’t expecting.


    It’s possible to build a wholly [unusable site that fully passes automated testing](http://example.com).
    For example, a button could trigger a fast change to the page that shows skeleton
    content, while the real results take an hour to appear!


    ## Identify Performance Bottlenecks


    Knowing you have a performance problem is one thing. Finding and fixing the causes
    is another matter.


    The first step is to identify whether the fault occurs server-side or client-side.
    A slow network response, either on the initial page load or during an Ajax request,
    will normally indicate a server issue. Database queries are often the culprit,
    but you’ll need to prove that! Existing tools and logs can help, but it may be
    necessary to output diagnostic information to a file in a similar way to other
    debugging activities.


    Client-side issues can be diagnosed using browser developer tools, as described
    below. Performance is affected when the browser has considerable work to do—such
    as a long-running JavaScript function, a DOM update that causes the page to re-layout,
    or CSS changes that affect many elements. The tips in Chapters 3, 4, and 5 provide
    solutions to typical problems.


    ## Performance Tool Concepts


    Most of the tools described in this chapter diagnose a particular “page” in your
    site within the context of a web browser. They primarily analyze front-end performance,
    although a back-end server or database could be to blame for a large or slow response.
    ([Chapter 4](http://example.com) provides further information about potential
    back-end issues and database tools.)


    ## The Browser Rendering Process


    When a site or app is first accessed by a user, the following steps occur:


    1. The browser makes an HTTP request for a specific URL. Under the hood, several
    network processes are taking place to resolve the domain name to an IP address
    and route the request to a server.

    2. The server receives and parses the request. It will reference a specific URL
    and may have data appended as a query string, in the HTTP header, or message body.
    It returns a response which, in this case, we''ll presume is HTML content.

    3. The browser starts to receive HTML data, which it parses. The document may
    reference further assets, such as images, fonts, style sheets, and JavaScript,
    which trigger additional HTTP requests to the same or another server.

    4. Eventually, the browser has enough information to start the rendering process.
    Behind the scenes, it has started to build the HTML DOM (document object model)
    which defines the page in a hierarchical tree structure. Style calculations also
    determine which CSS rules apply to each DOM node, and a CSSOM (CSS object model)
    is created for JavaScript interaction.

    5. The browser initiates the **layout** (or **reflow**) phase. This calculates
    the dimensions of each element and how it affects the size or positioning of elements
    around it.

    6. The layout is followed by a **paint** phase. This draws the visual parts of
    each element onto separate layers—that is, text, colors, images, borders, shadows,
    and so on.

    7. Finally, a **composite** phase draws each layer to the screen in the correct
    order.


    The page is now in an initial viewable state. During or after the render, JavaScript
    can run to make further HTTP requests (Ajax or WebSocket calls), perform calculations,
    update the DOM, or apply CSS rules. This could trigger further layout, paint,
    and/or composite phases.'
