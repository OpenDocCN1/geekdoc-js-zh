    # DevTools'' Console Logs


    Performance monitoring can help discover problems when specific actions are performed
    in a site or app. However, it may become necessary to profile JavaScript execution
    by logging messages to the console when events occur. Modern browsers support
    various [Performance Timing APIs](https://developer.mozilla.org/en-US/docs/Web/API/Performance_Timing_API)
    that can help to analyze code.


    # performance.now()


    _performance.now()_ returns the elapsed time in milliseconds since the page was
    loaded. Unlike `Date.now()`, it returns a floating-point number representing fractions
    of a millisecond:


    ```

    let t0 = performance.now();

    doSomething();

    let t1 = performance.now();

    console.log(`doSomething() executed in ${ t1 - t0 }ms`);

    ```


    # Performance Marks and Measures


    `performance.now()` can become arduous to manage as an application grows. The
    API also allows you to **mark** when an event occurs and **measure** the time
    elapsed between two marks. A mark is defined by passing a name string to _performance.mark()_:


    ```

    performance.mark(''script:start'');


    performance.mark(''doSomething1:start'');

    doSomething1();

    performance.mark(''doSomething1:end'');


    performance.mark(''doSomething2:start'');

    doSomething2();

    ```'
  merge: -1
  pgno: 33
- img_proc: true
  md: '```

    performance.mark(''doSomething2:end'');

    performance.mark(''script:end'');

    ```


    Each `mark()` call adds a `PerformanceMark` object to an array, which defines
    the `name` and `startTime`.


    > Navigation and Resource Entries


    The array is likely to contain other automatically generated browser entries for
    `navigation` and `resource` timings.


    A mark can be cleared with `performance.clearMarks(markName)`. All marks are cleared
    when no name is passed.


    The elapsed time between two marks can be calculated by creating a `performance.measure()`
    by passing the measure name, start mark, and end mark:


    ```

    performance.measure(''doSomething1'', ''doSomething1:start'', ''doSomething1:end'');

    performance.measure(''script'', ''script:start'', ''doSomething1:end'');

    ```


    Omitting the start mark measures from the moment the page loaded. Omitting the
    end mark measures to the current time. Each `measure()` call adds a `PerformanceEntry`
    object to the same array, which defines the `name`, `startTime`, and `duration`.


    A measure can be cleared with `performance.clearMeasures(measureName)`. All measures
    are cleared when no name is passed.


    Marks and measures can be accessed with:


    +   1. `performance.getEntriesByType(type)`, where `type` is either "mark" or
    "measure"

    2. `performance.getEntriesByName(name)`, where `name` is a mark or measure'
