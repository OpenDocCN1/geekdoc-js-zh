    \n## 感觉饱了吗？\n\n我们可能减轻了体重，但要确保长期受益，唯一的方法就是改变我们的开发态度！下一章将提供改变人生的饮食方案。\n\n# 第五章\n\
    改变人生的饮食\n\n本章描述的性能技术更为激进，可能难以应用于现有项目。幸运的是，在开发新网站或应用时则没有这些限制，因此我们将更深入地探讨 CMS 问题、JavaScript\
    \ 优化、DOM 处理、服务器端渲染、静态站点生成器 (SSG) 以及开发流程。\n\n## 评估 CMS 模板和插件\n\n像 WordPress 这样的内容管理系统不会生成臃肿、性能差的页面……*直到你开始添加东西！*\n\
    \n免费或商业模板在经济上是合理的。当现成的解决方案只需要几美元就能完成你需要的一切时，为什么要聘请开发者呢？不幸的是，这里有隐藏的成本。通用模板必须销售数百份——如果不是数千份——才能收回开发成本。为了吸引买家，开发者会捆绑所有能想到的功能。你的网站可能只使用其中一小部分功能，但它们仍然会存在于代码中，因此会增加下载体积和处理负担。\n\
    \n同样，对插件也要保持警惕，因为它们的质量和效果参差不齐。最好的插件可以通过优化数据库表、缓存数据和移除冗余代码来提升性能。最差的则会复制资源、进行复杂的配置更改（如\
    \ `.htaccess` 文件）、增加不必要的臃肿，即使它们在特定页面上处于非活跃状态，也会影响响应速度。\n\n在考虑新模板和插件时，务必评估页面成本和性能。尽可能选择更轻量的选项，即使购买价格更高。\n\
    \n## 减少客户端代码\n\n显而易见的提醒：*文件越小，页面加载越快*。\n\n然而，并非所有资源都是平等的。500KB 的图像数据对性能的影响相对较小，因为它只下载一次，缓存在浏览器中，并定位在页面上。同等数量的\
    \ HTML、CSS 或 JavaScript 会产生大得多的影响，因为它们必须被下载、解析和处理。\n\n理想情况下，HTML DOM 节点的数量应减少到最少。较浅的树深度意味着渲染和回流可以更高效地执行。Flexbox\
    \ 和 Grid 等现代布局工具允许你移除在基于浮动的设计中可能必需的包装元素。保持文档小巧，并留意 DIV 过度使用的迹象！\n\n同样，你需要的 CSS\
    \ 规则越少，文档渲染就越快。注意复杂的选择器，尤其是在使用 Sass 等预处理器时，它们会扩展深度嵌套的规则集。检查你编译后的样式表输出，确保它尽可能高效。\n\
    \n尝试拥抱 CSS 级联，而不是与之对抗！一点理解可以减少代码并提升性能。例如，你可以设置默认字体、颜色、大小、表格、网格和表单字段，它们会被普遍应用，但也可以为单个组件进行微调。\n\
