    `getElementsByTagName()` and `getElementsByClassName()` also return *live* HTMLCollections,
    which update automatically as the DOM is modified—so that it''s not necessary
    to rerun the query.


    # Minimize Reflows


    When an element is added, modified, or removed from a page, it can trigger a cascade
    of layout changes to surrounding elements. For example, increasing a width by
    1px could result in a neighboring element wrapping to the next line, which pushes
    all subsequent content down the page. It''s therefore more efficient to make changes
    that can''t impact the layout. For example:


    +   - use `opacity` and/or `transform` to translate (move), scale, or rotate an
    element

    - limit the scope of the reflow by changing elements low in the DOM tree (those
    without deeply nested children)

    - update elements in their own `position: absolute;` or `position: fixed;` layer

    - modify hidden elements (`display: none;`), then show them after the change has
    been applied


    # Batch-update Styles


    The following example could cause three reflows:


    ```

    let myelement = document.getElementById(''myelement'');

    myelement.width = ''100px'';

    myelement.height = ''200px'';

    myelement.style.margin = ''10px'';

    ```'
- md: "Performance can be improved by appending a class:\n\n```javascript\nlet myelement\
    \ = document.getElementById('myelement');\nmyelement.classList.add('newstyles');\n\
    ```\n\nThis applies CSS properties in one reflow operation:\n\n```css\n.newstyles\
    \ {\n    width: 100px;\n    height: 200px;\n    margin: 10px;\n}\n```\n\n## Batch-update\
    \ Elements\n\nTry to minimize the number of times you interact with the DOM. An\
    \ empty DocumentFragment can be used to build elements in memory before applying\
    \ those changes to the page. For example, you can create an unordered list with\
    \ three items like so:\n\n```javascript\n// create list\nlet\n    frag = document.createDocumentFragment(),\n\
    \    ul = frag.appendChild( document.createElement('ul') );\n\nfor (let i = 1;\
    \ i <= 3; i++) {\n    let li = ul.appendChild( document.createElement('li') );\n\
    \    li.textContent = 'item ' + i;\n}\n\n// append list to the DOM\ndocument.body.appendChild(frag);\n\
    ```\n\nThe DOM is only modified on the last line.\n\n## Use requestAnimationFrame\n\
    \nThe window.requestAnimationFrame() method calls a function just before the browser\
    \ performs the next repaint—normally once every sixtieth of a second (approximately\
    \ every 17ms, presuming no other render-blocking processes are occurring). It's\
    \ normally used for animating frames in HTML5 games, although running it before\
    \ any DOM update will be beneficial. For example:\n\n```javascript\nfunction updateDOM()\
    \ {\n  let p = document.createElement('p');\n  p.textContent = 'new element';\n\
    \  document.body.appendChild( p );\n}\n\nrequestAnimationFrame( updateDOM );\n\
    ```\n\n## Consider Progressive Rendering\n\nRather than using a single site-wide\
    \ CSS file, **progressive rendering** is a technique that defines individual style\
    \ sheets for separate components. Each is loaded immediately before the component\
    \ is referenced in the HTML:\n\n```html\n<head>\n    <!-- core styles used across\
    \ components -->\n    <link rel='stylesheet' href='base.css' />\n</head>\n<body>\n\
    \    <!-- header component -->\n    <link rel='stylesheet' href='header.css' />\n\
    \    <header>...</header>\n\n    <!-- primary content -->\n    <link rel='stylesheet'\
    \ href='content.css' />\n    <main>\n        <!-- form styling -->\n        <link\
    \ rel='stylesheet' href='form.css' />\n        <form>...</form>\n    </main>\n\
    \n    <!-- footer component -->\n    <link rel='stylesheet' href='footer.css'\
    \ />\n    <footer>...</footer>\n</body>\n```\n\nEach `<link>` still blocks rendering,\
    \ but for a shorter time, because the file is smaller. The page is usable sooner,\
    \ since each component renders in sequence; the top of the page can be viewed\
    \ while remaining content loads. A similar approach is often adopted by Web Components,\
    \ which encapsulate CSS within the code.\n\nThe technique can be less practical\
    \ in templates where the content dictates the layout (Flexbox and tables), since\
    \ reflows are triggered more frequently as the page loads. Grid-based page layouts\
    \ are generally more suitable.\n\nThere's [some variation in how browsers treat\
    \ progressive rendering](https://link), but the worst-case scenario is that the\
    \ browser blocks rendering until all discovered CSS files have loaded. That's\
    \ no worse than loading each in the `<head>`.\n\nProgressive rendering could benefit\
    \ large sites where individual pages are constructed from a varied selection of\
    \ different components.\n\n## Use Server-side Rendering\n\nWhich process is quicker?\n\
    \nProcess 1 (typically used by JavaScript frameworks):\n\n1. Request a URL.\n\
    2. Respond with a (mostly) empty HTML file.\n3. Download and execute JavaScript.\n\
    4. Use Ajax or similar techniques to fetch content according to the URL.\n5. Load\
    \ the content into the page body.\n\nProcess 2 (old-school method):\n\n1. Request\
    \ a URL.\n2. Respond with the full HTML.\n\nServer-side rendering is always quicker\
    \ for the initial page load.\n\nLoading a second page can be faster in Process\
    \ 1, since it's able to start at step 4. Assets such as style sheets, JavaScript,\
    \ and images may already be available and parsed. Unfortunately, a large proportion\
    \ of visitors may only view a single page, and the payload is higher because a\
    \ larger quantity of JavaScript is necessary.\n\nThis is a better-performing process:\n\
    \n1. Request a URL.\n2. Load HTML directly from the server into the browser.\n\
    3. Download and execute JavaScript. Some *rehydration* may be necessary to initiate\
    \ components with HTML data.\n4. Use Ajax or similar techniques to fetch and populate\
    \ content according to URL navigation changes.\n\nThis can be more difficult to\
    \ manage, since not all JavaScript frameworks provide server-based rendering capabilities\
    \ using Node.js, PHP, Ruby, Python, and so on.\n\n## Do You Need a JavaScript\
    \ or CSS Framework?\n\nA CSS and/or JavaScript framework can provide a good development\
    \ structure for teams working on larger sites or applications. However, most are\
    \ general-purpose tools: they provide a range of features you may not need or\
    \ may have to adapt. Optimizing performance is often difficult because the core\
    \ code isn't under your control.\n\nWhile a framework is certainly useful for\
    \ prototyping, always question whether it's necessary for the final site or application.\
    \ How much weight does it add? Will it improve performance? Can it be updated\
    \ easily? What happens when it's eventually abandoned?\n\nInvest time in researching\
    \ the choices. Without investigation, every application looks like a nail to developers\
    \ who understand a specific hammer. You should certainly avoid using more than\
    \ one framework—with the possible exception of server-side options, or compilers\
    \ such as [Svelte](https://svelte.dev/), which remove themselves from production\
    \ code.\n\nEven once you settle on a chosen framework, there may be modular or\
    \ lightweight alternatives such as [Preact](https://preactjs.com/) instead of\
    \ React, or [bling.js](https://github.com/ryanmcdermott/bling.js) instead of jQuery.\n\
    \nUltimately, the most efficient and adaptable framework will be one written specifically\
    \ for your application.\n\n## Use a Static Site Generator\n\nMost people start\
    \ web development by creating (static) HTML, CSS, and possibly JavaScript files.\
    \ The resulting assets can be hosted anywhere and are fast because they don't\
    \ use server- or client-side processing.\n\nThe main downside is content management:\
    \ adding a new page could involve changing hard-coded navigation menus on every\
    \ page in the site. At this point, developers often turn to server-side languages\
    \ or a database-driven CMS, both of which have their own set of challenges.\n\n\
    What if you could create a fast, static site but make cross-site changes programmatically\
    \ when something is added or removed? That's exactly what a **static site generator**\
    \ (SSG) does. It takes content—typically defined in markdown files—and builds\
    \ a set of static web pages. The build-time process can construct menus, import\
    \ images, generate styles, and so on, and can be rerun when anything changes.\
    \ The resulting site is decoupled from a server and is often referred to as using\
    \ a **JAMstack**: JavaScript, APIs, and markup.\n\nMost SSGs build a set of folder-based\
    \ HTML files with associated assets that can be uploaded to any web server capable\
    \ of serving static content. The Ruby-based [Jekyll](https://jekyllrb.com/) was\
    \ one of the first SSGs, but [StaticGen.com](https://www.staticgen.com/) lists\
    \ dozens of alternatives for a range of languages. Options such as [Gatsby](https://www.gatsbyjs.org/)\
    \ also create React-based JavaScript applications rather than HTML files. *(Whether\
    \ or not that's a benefit is another matter!)*\n\nA static site can offer the\
    \ best site performance, since it's rendered once, then delivered to all users\
    \ as is. There are no server-side dependencies, reliability is improved, version\
    \ control is easy, and security issues can be eradicated.\n\nThere are some downsides:\n\
    \n- configuration and setup takes time and is more difficult than a CMS\n- SSGs\
    \ are rarely suitable for non-technical editors\n- there's no concept of user\
    \ roles or permission rights\n- site consistency can be more difficult to enforce,\
    \ as editors can add any client-side code\n- the rebuild process can be slow,\
    \ especially on larger sites\n\nSSGs are ideal for sites that change relatively\
    \ infrequently, but many of the issues can be overcome by importing data from\
    \ a headless CMS or automating the build process.\n\n## Use a Build System\n\n\
    Even the most conscientious developer can forget to minimize a CSS file, optimize\
    \ an image, or remove debugging `console` statements. Whatever technology you\
    \ use to create a site or app, a **build process** can automate mundane tasks\
    \ to ensure there are no oversights. Additionally, they can run tests, verify\
    \ code, and deploy to staging or live servers.\n\nCreating a build process can\
    \ take a day or two, but it should save time over the long term. Popular generic\
    \ build tools include [Gulp.js](https://gulpjs.com/), [Grunt.js](https://gruntjs.com/),\
    \ [Broccoli.js](http://broccolijs.com/), and [Brunch](https://brunch.io/), which\
    \ allow you to define and run tasks manually or when files are changed."
