    \ JavaScript 概念。\n\n## 第 10 章：JavaScript 模块与模块化开发\n\n在本章中，我们将探索 JavaScript 模块和模块化开发。模块允许我们将代码组织成可重用和封装的单元，使我们的代码库更具可维护性和可扩展性。我们将涵盖模块的基础知识、模块语法、导出和导入，以及模块化开发的一些最佳实践。\n\
    \n## 10.1 JavaScript 模块简介\n\nJavaScript 模块是自包含的单元单元，可以导出并导入到我们应用程序的其他部分中使用。它们提供了一种封装相关功能、变量和类的方法，防止它们污染全局命名空间并促进代码的重用。\n\
    \n在 JavaScript 引入原生模块之前，开发者使用各种模块系统（如 CommonJS 和 AMD）来实现 模块化开发。然而，随着 ECMAScript\
    \ 2015 (ES6) 的发布，引入了对模块的原生支持，使得无需第三方库或框架就能更轻松地处理模块。\n\n## 10.2 模块语法：导出与导入\n\n\
    在 ES6 模块中，我们使用 `export` 和 `import` 关键字来定义模块的哪些部分可以在外部访问，并将这些导出的实体导入到其他模块中。\n\n\
    要从模块导出实体，我们使用 `export` 关键字。我们可以导出变量、函数、类，甚至是一个默认导出。这是一个示例：\n\n```javascript\n\
    // module.js\nexport const PI = 3.14;\n\nexport function double(number) {\n  return\
    \ number * 2;\n}\n\nexport default function greet(name) {\n  return `Hello, ${name}!`;\n\
    }\n```\n\n在这个示例中，我们导出了常量 `PI`、一个函数 `double()` 和一个默认导出函数 `greet()`。默认导出通过使用 `export\
    \ default` 语法表示。\n\n要从模块导入实体，我们使用 `import` 关键字。我们可以导入特定的实体、将所有实体作为命名空间，或导入默认导出。以下是如何从\
    \ `module.js` 模块导入实体的方法：\n\n```javascript\n// main.js\nimport { PI, double } from\
    \ './module.js';\n\nconsole.log(PI); // 输出: 3.14\nconsole.log(double(5)); // 输出:\
    \ 10\n```\n\n在这个示例中，我们从 `module.js` 模块导入了常量 `PI` 和函数 `double()`。然后我们可以在我们的 `main.js`\
    \ 模块中使用这些导入的实体。\n\n## 10.3 模块最佳实践\n\n在处理 JavaScript 模块时，遵循一些最佳实践以确保代码整洁且可维护是非常重要的：\n\
    \n-   保持模块聚焦：每个模块应该具有单一职责或专注于特定功能。这有助于保持代码库组织有序并使其更容易维护。\n-   使用显式导出：与其依赖默认导出，建议显式导出你想要从模块中暴露的实体。这可以明确哪些内容打算供其他模块使用。\n\
    -   谨慎使用默认导出：默认导出在某些场景下很有用，但应该节节使用。使用命名导出更便于理解从模块中导入了什么。\n-   最小化模块依赖：避免创建对其他模块过度依赖的模块。这减少了循环依赖的风险并简化了重构或移除模块的过程。\n\
    -   注意模块大小：虽然模块促进了组织结构，但寻求平衡并避免创建过大的模块也很重要。如果一个模块变得太大或太复杂，考虑将其重构为更小、更集中的模块。\n\n\
    通过遵循这些最佳实践，你可以确保你的模块化 JavaScript 代码是可维护、可重用且易理解的。\n\n## 10.4 模块环境与工具\n\nJavaScript\
    \ 模块可以在不同的环境中使用，例如 浏览器和 Node.js。然而，支持的具体模块语法和功能可能会取决于环境。\n\n在 Web 浏览器中，现代浏览器支持原生模块系统。然而，如果你需要支持旧浏览器或有更复杂的需求，你可能需要使用如\
    \ webpack 或 Rollup 这样的打包器将你的模块转换并打包成与旧浏览器兼容的单个 JavaScript 文件。\n\n在 Node.js 中，传统上\
    \ CommonJS 模块系统。然而，从 Node.js 版本 12 开始，增加了对 ECMAScript 模块 (ESM) 的支持，允许你在 Node.js\
    \ 应用中使用原生模块语法。\n\n"
