    \n## 11.5 总结\n\nJavaScript 中的面向对象编程提供了一种利用对象、封装、继承和多态来构建和组织代码的强大方法。通过理解 OOP 的原则和技术，我们可以创建更模块化、可用且易于维护的\
    \ JavaScript 应用程序。在本章中，我们探索了 JavaScript 面向对象编程的基础，包括对象、继承和多态。我们还讨论了如何使用构造函数和 ES6\
