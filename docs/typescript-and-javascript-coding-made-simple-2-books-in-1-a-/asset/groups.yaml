    \ 构造函数。这里有一个示例：\n\n```javascript\nvar car = new Object();\ncar.make = \"Toyota\"\
    ;\ncar.model = \"Camry\";\ncar.year = 2022;\n```\n\n在这个示例中，我们使用 `Object()` 构造函数创建了一个名为\
    \ `car` 的对象，并使用点符号为其分配属性。\n\n## 6.3 访问对象属性\n\n我们可以使用点符号或括号表示来访问对象的属性。点符号涉及使用对象名后跟一个点\
    \ `.` 和属性名。这里有一个示例：\n\n```javascript\nconsole.log(person.name); // Output: \"\
    John Doe\"\nconsole.log(car.make); // Output: \"Toyota\"\n```\n\n在这个示例中，我们使用点符号访问了\
    \ `person` 对象的 `name` 属性和 `car` 对象的 `make` 属性。\n\n括号表示涉及使用方括号 `[]` 并将属性名作为字符串。这里有一个示例：\n\
    \n```javascript\nconsole.log(person['age']); // Output: 30\nconsole.log(car['year']);\
    \ // Output: 2022\n```\n\n在这个示例中，我们使用括号表示访问了 `person` 对象的 `age` 属性和 `car` 对象的\
    \ `year` 属性。\n\n## 6.4 修改对象属性\n\nJavaScript 中的对象是可变的，这意味着我们可以在创建它们后修改它们的属性。我们可以使用点符号或括号表示来重新分配属性的值。这里有一个示例：\n\
    \n```javascript\nperson.age = 35;\ncar['year'] = 2023;\n```\n\n在这个示例中，我们修改了 `person`\
    \ 对象的 `age` 属性和 `car` 对象的 `year` 属性。\n\n## 6.5 添加和删除对象属性\n\n我们可以通过简单向之前不存在的属性赋值来向对象添加新属性。同样，我们可以使用\
    \ `delete` 关键字删除属性。这里有一个示例：\n\n```javascript\nperson.gender = \"Male\";\ndelete\
    \ car.model;\n```\n\n在这个示例中，我们为 `person` 对象添加了 `gender` 属性，并从 `car` 对象中删除了 `model`\
    \ 属性。\n\n## 6.6 对象方法\n\n除了属性之外，JavaScript 中的对象还可以包含方法。方法是与对象关联的函数，并可以使用点符号调用。\n\
    \nJavaScript 中的方法是与对象关联的函数，可以使用对象的属性执行操作。让我们来看一个示例：\n\n```javascript\nvar calculator\
    \ = {\n  add: function (a, b) {\n    return a + b;\n  },\n  subtract: function\
    \ (a, b) {\n    return a - b;\n  }\n};\nconsole.log(calculator.add(5, 3)); //\
    \ Output: 8\nconsole.log(calculator.subtract(10, 4)); // Output: 6\n```\n\n在这个示例中，我们创建了一个名为\
