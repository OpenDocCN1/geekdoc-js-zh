    \ of OOP and how they are implemented in TypeScript.\n\n# Classes and Objects:\n\
    \nAt the core of OOP is the concept of classes and objects. A class is a blueprint\
    \ or template that defines the structure and behavior of objects. Objects are\
    \ instances of classes, representing specific entities or instances in a program.\
    \ Classes encapsulate data (properties) and behavior (methods) related to a particular\
    \ concept or entity.\n\n```typescript\nclass Circle {\n  radius: number;\n\n \
    \ constructor(radius: number) {\n    this.radius = radius;\n  }\n\n  getArea():\
    \ number {\n    return Math.PI * this.radius ** 2;\n  }\n\n  getCircumference():\
    \ number {\n    return 2 * Math.PI * this.radius;\n  }\n}\n\nconst myCircle =\
    \ new Circle(5);\nconsole.log(myCircle.getArea()); // Output: 78.5398163397483\n\
    console.log(myCircle.getCircumference()); // Output: 31.41592653589793\n```\n\n\
    # Inheritance:\n\nInheritance is a mechanism in OOP that allows classes to inherit\
    \ properties and methods from other classes. TypeScript supports single inheritance,\
    \ where a class can inherit from a single parent class. This promotes code reuse\
    \ and facilitates the creation of hierarchical relationships between classes.\n\
    \n```typescript\nclass Shape {\n  color: string;\n  constructor(color: string)\
    \ {\n    this.color = color;\n  }\n  getColor(): string {\n    return this.color;\n\
    \  }\n}\n\nclass Rectangle extends Shape {\n  width: number;\n  height: number;\n\
    \  constructor(color: string, width: number, height: number) {\n    super(color);\n\
    \    this.width = width;\n    this.height = height;\n  }\n}\n\nconst myRectangle\
    \ = new Rectangle(\"blue\", 10, 20);\nconsole.log(myRectangle.getColor()); //\
    \ Output: blue\n```\n\n# Encapsulation:\n\nEncapsulation is the practice of bundling\
    \ properties and methods within a class and controlling direct access to them.\
    \ In TypeScript, we use access modifiers (`public`, `private`, `protected`) to\
    \ restrict visibility of class members.\n\n```typescript\nclass BankAccount {\n\
    \  private balance: number;\n\n  constructor(initialBalance: number) {\n    this.balance\
    \ = initialBalance;\n  }\n\n  deposit(amount: number): void {\n    this.balance\
    \ += amount;\n  }\n\n  withdraw(amount: number): void {\n    if (amount <= this.balance)\
    \ {\n      this.balance -= amount;\n    }\n  }\n\n  getBalance(): number {\n \
    \   return this.balance;\n  }\n}\n\nconst account = new BankAccount(1000);\naccount.deposit(500);\n\
    account.withdraw(200);\nconsole.log(account.getBalance()); // Output: 1300\n```\n\
    \n# Polymorphism:\n\nPolymorphism allows objects of different classes to be treated\
    \ as instances of a common super-class. Method overriding enables derived classes\
    \ to provide own implementation of inherited methods.\n\n```typescript\nclass\
    \ Animal {\n  makeSound(): void {\n    console.log(\"Animal makes a sound\");\n\
    \  }\n}\n\nclass Dog extends Animal {\n  makeSound(): void {\n    console.log(\"\
    Dog barks\");\n  }\n}\n\nclass Cat extends Animal {\n  makeSound(): void {\n \
    \   console.log(\"Cat meows\");\n  }\n}\n\nfunction makeAnimalSound(animal: Animal):\
    \ void {\n  animal.makeSound();\n}\n\nconst dog = new Dog();\nconst cat = new\
    \ Cat();\n\nmakeAnimalSound(dog); // Output: Dog barks\nmakeAnimalSound(cat);\
    \ // Output: Cat meows\n```\n\n# Interfaces:\n\nInterfaces in TypeScript define\
    \ a contract for classes to follow. They specify the structure and behavior that\
    \ a class must adhere to.\n\n```typescript\ninterface Printable {\n  print():\
    \ void;\n}\n\nclass Document implements Printable {\n  content: string;\n\n  constructor(content:\
    \ string) {\n    this.content = content;\n  }\n\n  print(): void {\n    console.log(this.content);\n\
    \  }\n}\n\nclass Invoice implements Printable {\n  amount: number;\n\n  constructor(amount:\
    \ number) {\n    this.amount = amount;\n  }\n\n  print(): void {\n    console.log(`Invoice\
    \ amount: ${this.amount}`);\n  }\n}\n\nconst document = new Document(\"Sample\
    \ document\");\nconst invoice = new Invoice(1000);\ndocument.print(); // Output:\
    \ Sample document\ninvoice.print(); // Output: Invoice amount: 1000\n```\n\nObject-Oriented\
    \ Programming with TypeScript provides a solid foundation for building modular,\
    \ reusable, and maintainable applications. By utilizing classes, objects, inheritance,\
    \ encapsulation, polymorphism, and interfaces, you can design and develop software\
    \ systems that are both efficient and flexible. OOP principles promote code organization,\
    \ reusability, and scalability, making TypeScript a powerful language for building\
    \ complex applications.\n\n# Chapter 8: Generics in TypeScript\n\nIntroduction:\n\
    Generics in TypeScript provide a powerful tool for creating reusable and type-safe\
