    语法、运算符和表达式。这些基础概念将为编写更复杂交互的 JavaScript 代码铺平道路。


    ## 2.1 JavaScript 语法


    语法是指规范编程语言中如何编写代码的规则set。正确的语法可以确保代码结构正确，并且能够被人类和机器理解。让我们探索 JavaScript 语法的一些基本方面。


    ### 2.1.1 语句和分号


    在 JavaScript 中，语句是代码的构建块。语句是执行特定操作的指令。JavaScript 中的每个语句都以分号;) 结束，表示语句的完成。虽然分号在
    JavaScript 中并非总是强制，但一致地使用分号被认为是良好的习惯，可以避免潜在的问题。


    例如，以下语句为变量赋值：


    ```javascript

    var name = "John";

    var age = 25;

    ```


    ### 2.1.2 注释


    注释用于在代码中添加解释性说明。JavaScript 引擎会忽略这些注释，其目的是为开发者提供背景信息并提高代码的可读性。JavaScript 中有两种类型的注释：


    -   单行注释：用两个正斜杠 (//) 表示。// 之后的所有内容都被视为注释，不会被浏览器执行。


    ```javascript

    // 这是一个单行注释

    ```


    -   多行注释：包含在 /* 和 */ 之间。多行注释可以跨多行，适用于提供较详细的解释或注释掉代码段。


    ```javascript

    /*

    这是一个多行注释。

    它可以跨多行。

    */

    ```


    ## 2.2 JavaScript 运算符


    JavaScript 中的运算符是会对操作数（值或变量）执行操作的符号。它们允许我们执行数学计算、比较值、赋值等操作。让我们探索 JavaScript 中一些常用的运算符。


    ### 2.2.1 算术运算符


    算术运算符用于执行数学计算。JavaScript 包含以下算术运算符：


    -   加法 (+)：相两个数字或拼接字符串。

    -   减法 (-)：从一个数字中减去另一个。

    -   乘法 (*)：两个数字相乘。

    -   除法 (/)：将一个数字除以另一个。

    -   取模 (%)：返回除法后的余数。

    -   自增 (++)：将值加 1。

    -   自减 (--)：将值减 1。


    这里是一个使用算术运算符的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var sum = x + y; // 7

    var difference = x - y; // 3

    var product = x*y; // 10

    var quotient = x / y; // 2.5

    var remainder = x % y; // 1

    x++; // x 现在是 6

    y--; // y 现在是 1

    ```


    ### 2.2.2 赋值运算符


    赋值运算符用于给变量赋值。它们将赋值运算符 (=) 与其他算术或逻辑运算符结合。常见的赋值运算符有：


    -   `=`：给变量赋值。

    -   `+=`：将值加到变量当前值并将结果赋值。

    -   `-=`：从变量当前值中减去值并将结果赋值。

    -   `*=`：将变量当前值乘以一个值并将结果赋值。

    -   `/=`：将变量当前值除以一个值并将结果赋值。


    这里有一个使用赋值运算符的示例：


    ```javascript

    var x = 5;

    var y = 2;

    x += y; // 等于 x = x + y; (x 现在是 7)

    y -= 1; // 等于 y = y - 1; (y 现在是 1)

    ```


    ### 2.2.3 比较运算符


    比较运算符用于比较值并返回布尔结果。以下是一些比较运算符：


    -   `==`：检查两个值是否相等。

    -   `!=`：检查值是否不相等。

    -   `>`：检查左值是否大于右值。

    -   `<`：检查左值是否小于右值。

    -   `>=`：检查左值是否大于等于右值。

    -   `<=`：检查左值是否小于等于右值。

    -   `===`：检查两个值是否严格相等（值和类型）。


    这里有一个使用比较运算符的示例：


    ```javascript

    var x = 5;

    var y = 2;

    console.log(x == y); // false

    console.log(x != y); // true

    console.log(x > y); // true

    console.log(x < y); // false

    console.log(x >= y); // true

    console.log(x <= y); // false

    console.log(x === 5); // true

    ```


    ## 2.3 表达式


    表达式是值、变量和运算符的组合，用于产生结果。它们可以简单到只有一个值，也可以复杂到包含多个运算符。理解表达式对于编写动态交互 JavaScript 代码至关重要。


