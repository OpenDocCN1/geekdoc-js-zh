    \ Promise 链中捕获错误以及使用 try/catch 块。\n\n最后，我们引入了生成器，这是一种允许函数暂停和恢复执行的强大特性。生成器为处理迭代算法和异步任务提供了一种灵活且表现力的方式。\n\
