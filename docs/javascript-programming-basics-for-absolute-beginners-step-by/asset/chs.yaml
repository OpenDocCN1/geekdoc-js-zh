  ```\n\n这将一直持续到所有 12 个月份都以小写列出并关联相应的数字。\n\n## While and Do While Statements\n\n`While`\
  \ 语句连续执行语句块，直到条件被判定为真。\n\n### Syntax\n\n```java\nWhile (expression) {\n    Statement(s)\n\
  }\n```\n\n`While` 语句将评估表达式并返回一个布尔语句。当发现条件为真时，`while` 块中的语句将被执行。`while` 语句将测试语句并执行它，直到它被证明为假。\n\
  \n### Example\n\n```java\nClass WhileDemo {\n    Public static void main(String[]\
  \ args) {\n        Int count = 1 ;\n        While (count < 11) {\n            System.out.println(“\
  \ Count is: “ + count) ;\n            Count++;\n        }\n    }\n}\n```\n\n无限循环通过这种语法在\
  \ `while` 语句中实现。\n\n### Example\n\n```java\nWhile (true){\n    // your code goes\
  \ here\n}\n```\n\n`Do while` 语句也是 JavaScript 的一部分。\n\n### Example\n\n```java\nDo\
  \ {\n    Statement(s)\n} while (expression) ;\n```\n\n区别在于在循环底部评估方程，而不是位于顶部的方程。循环中的每个部分至少会被评估一次。\n\
  \n### Example\n\n```java\nClass DoWhileDemo {\n    Public static void main(String[]\
  \ args) {\n        Int count = 1\n        Do {\n            System.out.println (“Count\
  \ is: “ + count) ;\n            Count++;\n        } while (count < 11) ;\n    }\n\
  }\n```\n\n## For Statement\n\n该语句将提供了一种迭代范围内数值的紧凑方式。这被称为 `for` 循环，因为它会一直循环，直到设置的条件被满足为止。\n\
  \n### Syntax\n\n```java\nFor (initialization; termination;\n    Increment) {\n \
  \   Statement(s)\n}\n```\n\n你应该记住，增量表达式在循环迭代后被调用。该表达式对值进行增加或减少都是可以的。初始化表达式将初始化循环并在循环开始时执行一次。终止将在循环停止时评估为假。\n\
