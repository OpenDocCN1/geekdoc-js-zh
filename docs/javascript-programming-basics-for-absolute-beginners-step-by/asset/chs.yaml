- "# JavaScript：绝对初学者编程基础指南（循步渐进 JavaScript 第 1 册）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n#\
  \ 引言\n\n恭喜你购买《JavaScript：零基础学者编程入门》，感谢你的支持。\n\n接下来的章节将讨论你将如何利用 JavaScript 来创造优势。读完本书后，尽管你以前从未用过它，也将学会如何使用\
  \ JavaScript。你可能无法做到一切，但你将掌握基础知识。\n\n市场上有许多关于这个主题的书，再次感谢你选择这一本！我们尽力确保它包含尽可能有用的信息，请尽情享受！\n\
  \n# 什么是 JavaScript?\n\n编程中使用的语言之一是 JavaScript。它经常被用于设计网页，使其能够与用户进行交互。用户的计算机无需下载任何内容即可运行\
  \ JavaScript。很多时候，JavaScript 可以用于创建测验和投票。\n\n作为一种高级程序，JavaScript 是动态的、无类型的且解释型的。在你通常在网上看到的所有内容中，是用\
  \ JavaScript 或另外两种技术创建的。许多主流浏览器、电子邮件服务器和网站都运行在 JavaScript 代码上。\n\nJavaScript 包含原型的一等函数，这使其成为一种多范式语言。\n\
  \n\n\n\nJavaScript 实际上并不是 HTML 代码。在你编写 JavaScript 代码时，你需要允许浏览器理解你正在向 HTML 中输入 JavaScript。JavaScript\
  \ 的函数是 `<script>`。`<script type = “text/javascript”> <script>` 函数将允许页面确切知道 JavaScript\
  \ 代码从哪里开始到哪里结束。\n\n## 示例\n\n```html\n<<html>>\n<head>\n<title> 我的 JavaScript 页面\
  \ </title>\n</head>\n<body>\n<script type = “text/javascript”>\nAlert (“Welcome\
  \ to my world!!!”);\n</script>\n</body>\n</html>\n```\n\n`alert` 单词会在你的屏幕上弹出一个提示框。为了让它消失以便你继续正在做的工作，你必须点击“ok”。当浏览器需要识别代码为\
  \ JavaScript 时，会输入 `alert` 命令。每当你没有在代码中放置 `<script>`，浏览器都会认为你输入的内容是普通文本。你可以在 HTML\
  \ 编写的文档的 `head` 和 `body` 部分中都放置 JavaScript。你应该尝试将尽可能多的代码保留在 `head` 部分。\n\n## 第一个脚本\n\
  \n在使用 JavaScript 编写第一个程序之前，你不仅需要知道要把代码放在哪里，还需要了解更多事情。JavaScript 代码行必须以分号结束。所有代码都可以放在同一行，而不必担心破坏其性能。尽管这不会影响代码的性能，但它会破坏你脚本的外观。你的文本应该放在一组引号内。当你忘记给文本加引号时，它会被视为变量。大写字母和小写字母的含义不同。大写字母应该只放在正确的位置，以免弄乱你的脚本。\n\
  \n## 示例\n\n```html\n<<html>>\n<head>\n<title> 我的 JavaScript 页面 </title>\n</head>\n\
  <body>\n<script type = “text/javascript”>\n</script>\nDocument.write (“Welcome to\
  \ my world!!!”);\n</script>\n</body>\n</html>\n```\n\n`Document.write` 将告诉用户将括号中的内容放入文档中。你将获得类似于\
  \ Python 测试文件中的 Hello World! 的输出。\n\n## 示例\n\n```html\n<<html>>\n<head>\n<title>\
  \ 我的 JavaScript 页面 </title>\n</head>\n<body>\nHello!!! <br>\n<script>\nDocument.write\
  \ (“Welcome to my world!!!”);\n</script>\nEnjoy your stay…<br>\n</body>\n</html>\n\
  ```\n\n输出：\nHello!!!\nWelcome to my world!!!\nEnjoy your stay…\n\n文本将写入它在 HTML 代码中所在的位置。许多\
  \ HTML 标签是用 `document.write` 编写的。\n\n## 大写字母\n\n在 JavaScript 中，`yourname` 和 `YOURNAME`\
  \ 是两个不同的变量。\n\n## 示例\n\n```html\n<<html>>\n<head>\n<title> 我的页面 </title>\n</head>\n\
  <body>\n<script>\nmyvalue =2;\nmyvalue =5;\nresult = myvalue + myvalue;\ndocument.write(result)\
  \ ;\n</script>\n</body>\n</html>\n```\n\n## 示例\n\n```html\n<<html>>\n<head>\n<title>\
  \ 我的页面 </title>\n</head>\n<body>\n<script>\nmyvalue =2;\nMyValue =5;\nresult = myvalue\
  \ + MyValue;\ndocument.write(result) ;\n</script>\n</body>\n</html>\n```\n\n两者的变量都是不一样的，因此它们会有不同的输出。不要混合使用语法。你使用哪种语法并不如你在整个代码中保持一致重要。\n\
  \n## 弹出窗口\n\n使用 JavaScript 时你会得到三个弹出框：警告框（alert）、确认框（confirm）和提示框（prompt）。\n\n###\
  \ Alert（警告）\n\n语法将提示你输入的文本。你需要点击“ok”继续。你将被通知必须知道的信息。\n\n### Confirm（确认）\n\n此框用于确认你的文本。你需要点击“ok”或“cancel”。你将被强制接受某些东西。点击“ok”时，值为\
  \ true。点击“cancel”时，值将为 false。\n\n## 示例\n\n```javascript\nIf (confirm(“Do you agree”))\
  \ {alert)”You agree”)}\nElse(alert (“You do not agree”)) ;\n```\n\n### Prompt（提示）\n\
  \n此框将你的文本与默认值进行提示。你必须点击“ok”或“cancel”。在继续访问页面之前，你必须输入一些内容。“okay”将返回输入的内容。“cancel”将表示返回为空。\n\
  \n## 示例\n\n```javascript\nUsername = prompt (“Please enter your name” , “Enter your\
  \ name here”) ;\n```\n\n# JavaScript 语法\n\n语法是关于 JavaScript 代码如何构建的基础规则。\n\n## 程序\n\
  \n程序将包含一组指令列表，规定计算机程序需要执行的内容，以便程序或网站正常运行。这些指令被视为语句。这些语句由分号分隔。\n\n## 示例\n\n```javascript\n\
  Var x = 5;\nVar y = 7;\nVar z = x + y;\n```\n\nJavaScript 程序将在网络浏览器内部执行。\n\n## 语句\n\
  \nJavaScript 语句包含五个部分：关键字、值、运算符、注释和表达式。\n\n## 值\n\n有两种不同的值类型：固定值和变量。固定值也称为字面量。\n\
  \n## 字面量\n\n在编写固定值时有规则。固定值可以使用小数点。\n\n## 示例\n\n```\n10.50\n```\n\n字符串位于双引号或单引号内。\n\
  \n## 示例\n\n```\n“Jane Doe”\n'Jane Doe'\n```\n\n## 变量\n\n存储数据的变量是定义。`Var` 告诉 JavaScript\
  \ 这是一个变量。\n\n## 示例\n\n```javascript\nVar x;\nX = 6;\n```\n\n## 运算符\n\n运算符用于为变量赋值。赋值运算符是等号。\n\
  \n## 示例\n\n```javascript\nVar x = 8\nVar y = 9\n```\n\n你也可以使用算术运算符，如加法、减法、乘法和除法。\n\
  \n## 表达式\n\n运算符、变量和值的组合构成表达式。计算值的过程称为求值。\n\n## 示例\n\n```\n10 * 20\n```\n\n输出将是 200。表达式也可以包含变量。\n\
  \n## 示例\n\n```javascript\nx = 5\n```\n\n值可以是数字或字符串类型。\n\n## 示例\n\n```\n“Jane” +\
  \ “Doe”\n```\n\n输出是 Jane Doe\n\n## 关键字\n\n关键字标识需要执行的动作。`Var` 告诉浏览器创建一个变量。\n\n##\
  \ 示例\n\n```javascript\nVar x = 6 + 8;\nVar y = x * 15;\n```\n\n## 注释\n\n所有注释都不会被执行。代码后面的双斜杠是注释。注释会被忽略，因为它们是为了帮助程序员理解编写的代码。\n\
  \n## 示例\n\n```javascript\nVar x = 9; //我将被执行以给你输出。\n// var x = 7; //这不会被执行，因为它前面有双斜杠，因此它只是一个注释。\n\
  ```\n\n## 标识符\n\n标识符是 JavaScript 中发现的各种事物的名称。标识符命名各种变量、函数、标签和关键字。合法名称与其他任何编程语言规则相同。起始字符必须是美元符号、下划线或字母。后面的字符可以是任何符号、数字或字母。数字不允许作为标识符的首字母，因为\
  \ JavaScript 会认为数字而不是名称。\n\n## 大写敏感\n\n标识符对大小写敏感。像 `middleName` 和 `middlename` 这样的变量是不同的变量。\n\
  \n## 示例\n\n```javascript\nlastName = “Mann”;\nlastname = “Johnson”;\n```\n\n然而，`var`\
  \ 和 `VAR` 是相同的。\n\n## 变量连接\n\n通常有 3 种连接单词形成单个变量的方法：\n\n### 字符\n\n连字符（如 `My-name-is`）在\
  \ JavaScript 中是不允许的。它们被保留用于减法。\n\n### 下划线\n\n`My_name_is`\n\n### 驼峰命名法\n\n有两个或多个大写字母，如\
  \ `myNameIs`。想象驼背上的峰。大多数程序员会让第一个字母小写。\n\n## 字符集\n\n\n\n\nJavaScript 包含一组 Unicode\
  \ 字符集。大部分字符、标点符号和符号将由 Unicode 覆盖。\n\n# JavaScript 变量\n\n变量是带有名称的盒子。变量用于存储值。你盒子的名称将是变量名。盒子的内容将与变量有关。这就像计算机的内存，信息被放在内存中，就像内容被放在变量中。变量将引用你给它的名称。\n\
  \n## 示例\n\n```html\n<<html>>\n<head>\n<title> 我的 JavaScript 页面 </title>\n</head>\n\
  <body>\n<script>\nMyname = “Susann” ;\nDocument.write(myname) ;\n</script>\n</body>\n\
  </html>\n```\n\n你想要存储在变量中的文本需要包含在引号中。这将允许程序区分变量和普通文本。\n\n## 示例\n\n```html\n<html>\n\
  <head>\n<title> 我的 JavaScript 页面 </title>\n</head>\n<body>\n<script>\nSusann = “my\
  \ first name” ;\nMyname = Susann ;\nDocument.write (myname) ;\n</script>\n</body>\n\
  </html>\n```\n\n输出结果是：\n\n*   `Susan` 是变量\n*   它位于 `myname` 变量中\n*   `myname` 将被置于文档\n\
  *   最终结果是 my first name\n\n## 赋值给变量的值\n\n将值赋予变量的最常用方法是等号。\n\n## 运算符\n\n像 `++` 和\
  \ `--` 这样的运算符是你最可能不想使用的。你可以使用其他运算符来完成与这些运算符相同的工作。但它们会让你的代码输入速度更快，因此许多程序员使用它们来使编码运行得更快。运算符\
  \ `++` 会增加 1。`--` 会减少 1。百分比符号将返回两个数相除后余数的模。\n\n## 变量比较\n\n你有多种方法可以比较变量。最简单的方法是双等号。当你忘记不使用双等号时，你并没有比较变量。列在左侧的变量将被赋值右侧列的值。\n\
  \n## 示例\n\n```javascript\nIf (firstname = “Susann”) {alert(“Nice name!!!”)}\n```\n\
  \n这是常见的，但它会导致你的脚本运行方式不同。你可以在 JavaScript 中使用你在小学学过的运算符：\n\n*   `==` 等于\n*   `!=`\
  \ 不等于\n*   `<` 小于\n*   `>` 大于\n*   `<=` 等于或小于\n*   `=` 等于或大于\n\n# JavaScript 中的函数\n\
  \nJavaScript 中的函数将被封装在代码中，旨在执行特定任务。函数将在每次被调用或请求时执行。\n\n## 示例\n\n```javascript\n\
  Function myFunction(p1, p2) {\nReturn p1 * p2;\n// 你的函数将返回 p1 和 p2 的乘积\n}\n```\n\
  \n## 函数语法\n\n函数由关键字 `function` 定义。名称后跟着一组圆括号。名称将包含数字、下划线、字母和美元符号。它们遵循与变量相同的规则。括号内将用逗号分隔的参数名。所有要执行的代码都将放在花括号中。\n\
  \n## 示例\n\n```javascript\nFunctionname(parameter1, parameter2, parameter3) {\n要执行的代码\n\
  }\n```\n\n参数是定义函数中已经存在的名称。参数包含函数在被调用时所接受的真实值。参数的行为类似于局部变量。\n\n## 调用\n\n当代码被放入函数中时，它将在被调用后被使用。代码在以下情况下被调用：\n\
  \n*   从脚本中被调用\n*   发生事件，例如按钮被点击时\n*   它是自调用的\n\n## 返回\n\n代码将到达一个已返回的语句，这意味着它将停止运行。当语句返回到调用语句之后的执行代码中时，代码将被调用。函数将评估返回的值。返回的值将返回给原始调用者。\n\
  \n## 示例\n\n```javascript\nVar x = myFunction (4, 3); //此函数已被调用，并将返回值为 x。\n\nFunction\
  \ myFunction(a, b) {\nReturn a * b; //函数返回 a 乘以 b 的乘积\n}\n```\n\n`X` 将是 `12`，这将是你的输出。\n\
  \n## 为什么使用函数？\n\n函数将允许代码被复用。代码将被定义一次，然后可以多次使用。相同的代码将使用不同的参数获得不同的结果。\n\n## 示例\n\n\
  ```javascript\nFunction toCelsius (Fahrenheit) {\nReturn ( 5/9) * (Fahrenheit -32);\n\
  }\n\nDocument.getElementById(“demo”).innerHTML = toCelsius(77);\n```\n\n## 圆括号运算符\n\
  \n要在不使用圆括号的情况下访问函数，你将获得一个定义。\n\n## 示例\n\n```javascript\nFunction toCelsius( Fahrenheit)\
  \ {\nReturn ( 5/9) * (Fahrenheit – 32);\n}\n\nDocument.getElementById(“demo”). innerHTML\
  \ = toCelsius;\n```\n\n## 函数中的变量\n\n函数可以像变量一样使用。它们将用于公式、赋值和计算。\n\n## 示例\n\n```javascript\n\
  Var x = toCelsius(77);\n```\n\n JavaScript 决策\n\n有不同的语句用于决策。\n\n## If 语句\n\n语句将检查条件是否为真或假。条件将是一个表达式。语句将被执行。\n\
  \n### 语法\n\n```javascript\nIf(condition)\n{\n语句\n}\n```\n\n如果有一个语句，将不使用花括号。如果有多个语句，则需要括号。\n\
  \n建议使用花括号，这样你的代码更容易管理和清晰。\n\n## 示例\n\n```html\n<script>\nIf (6 > 2)\n{\nDocument.write(\
  \ “yes 6 is greater than 2”);\nDocument.write“<br />” + “JavaScript is easy”);\n\
  Document.write(<br />);\n}\n</script>\n```\n\n输出：\n\nYes 6 is greater than 2.JavaScript\
  \ is easy.\n\n## 示例\n\n```javascript\nIf(true)\nDocument.write (“Ah! A Boolean inside.\
  \ Also, I am not using curly brackets”);\n```\n\n//不使用花括号也可以\n\n## 示例\n\n```javascript\n\
  If ( 2 == 4)\n{\nDocument.write (“This is not going to be printed”);\n}\n```\n\n\
  //由于条件为假，语句将被执行。\n\n## Else 语句\n\n语句将与 if 语句一起使用。当条件为假时，else 语句将被执行。\n\n在使用 else\
  \ 语句时会去掉花括号。这只有在需要执行单个语句时才会发生。\n\n## 示例\n\n```html\n<script>\nIf 5 > 7\n{\nDocument.write(“True”);\n\
  }\n\nElse\n{\nDocument.write(“False”);\n}\n</script>\n```\n\n输出将是 false。\n\n## Else\
  \ If 语句\n\n有很多条件需要检查，那么将需要大量的 if 语句。if 条件将同时被检查。如果一个条件失败，检查将停止。这就是你使用 else if 语句的时候。\n\
  \n### 语法\n\n```javascript\nIf(condition)\n{\n语句\n}\n\nElse if (condition)\n{\n语句\n\
  }\n\nElse\n{\n语句\n}\n```\n\n当所有条件都失败时，最后的 else 语句将被执行。\n\n## 示例\n\n```html\n<script>\n\
  Var a = 3;\n\nVar b = 4;\n\nIf (a > b)\n{\n```\n\n\n\n\n```javascript\nDocument.write(“a\
  \ is greater than b”);\n} else if (a < b) {\n  Document.write(“ a is smaller than\
  \ b”);\n} else {\n  Document.write(“Nothing worked”);\n}\n</script>\n```\n\n## Switch\
  \ 语句（Switch）\n\nSwitch 语句的作用与 `else if` 语句相同。当存在多个条件时，会使用 `switch` 语句。Switch 语句的性能比\
  \ `else if` 语句更好。\n\n### 语法\n\n```java\nSwitch(expression)\n{\n  Case value -1:\
  \ statements; break;\n  Case value -2: statements; break;\n  Case value 3: statements;\
  \ break;\n  ….\n  Case value-n: statements; break;\n  Default: statements; break;\n\
  }\n```\n\n`switch` 语句会评估待检查的语句并查看是否匹配任何 `case`。如果匹配，则将执行 `case` 内部的语句，随后执行 `break`\
  \ 语句。`Break` 语句可以确保其他 `case` 语句不再执行。\n\n如果一个 `expression` 无法匹配到 `case` 值，则将执行 `default`\
  \ 情况。无论 `case` 中是什么种类型的语句都不重要。不必须使用大括号。如果 `default` 构建是 `switch` 中找到的最后一个语句，则会省略\
  \ `Break` 语句。\n\n## 示例\n\n```javascript\n<script>\nVar a = 8\nSwitch(a)\n{\n  Case\
  \ 1: document.write(“one”); break;\n  Case 2: document.write( “two”); break;\n \
  \ Case 3: document.write( “three”); break;\n  Case 4: document.write( “four”); break;\n\
  \  Case 5: document.write( “five”); break;\n  Default: document.write(“number not\
  \ found”);\n}\n// 输出 five\n</script>\n```\n\nCase 值可以是字符串、字符和数字。\n\n## 示例\n\n```javascript\n\
  <script>\nVar I = ‘j’;\nSwitch(i)\n{\n  Case ‘a’: document.write(“a found”); break;\n\
  \  Case ‘b’: document.write(‘b found”); break;\n  Case ‘c’: document.write(“c found”);\
  \ break;\n  Case ‘j’: document.write(“j found”); break;\n  Case ‘string’: document.write(“string\
  \ found”); break;\n  Default: document.write(“nothing found”);\n}\n// 输出 j found\n\
  </script>\n```\n\n## 三元运算符（Ternary）\n\n三元运算符是许多程序员使用的运算符。三元运算符有三个操作数。\n\n### 语法\n\
  \n```java\nCondition ? if-true-execute-this : if-false-execute-this;\n```\n\n如果\
  \ `condition` 为真，则将执行冒号之前的语句。如果该语句返回假，则将执行冒号后的语句。不能使用多种语句，因为 JavaScript 不允许这样做。可以使用函数并在发现条件为真或假时对该函数命名来执行多条语句。\n\
  \n## 示例\n\n```javascript\n<script>\nTrue ? document.write (“True value found”) :\
  \ document.write(“False value found”);\nDocument.write(“<br />”);\n// 输出 True value\
  \ found.\n( 6 > 5 && 3 == 2) ? document.write(“True”) : document.write(“False”);\n\
  Document.write(“ <br />”);\n// 输出 False\nVar a = (true) ? 1 : 2;\nDocument.write(a);\n\
  // 输出 1\n</script>\n```\n\n## 嵌套的 If Else 和 Switch 语句\n\n你可以在另一个条件中放入 `if`、`or`、`else`\
  \ 或 `switch` 语句。你将将其称为嵌套。`Else, if` 或 `switch` 语句可以嵌套任意深度。但代码会比以前更加复杂。\n\n### 语法\n\
  \n```java\nIf(condition)\n{\n  If (other condition)\n  {\n    Statements;\n  }\n\
  }\nElse\n{\n  If (other condition)\n  {\n    Statements;\n  }\n  Else\n  {\n   \
  \ Switch(expression)\n    {\n      Case value-1: statements; break;\n      …\n \
  \   }\n  }\n}\n```\n\n# JavaScript 中的控制流语句\n\n当你找到一个源文件时，其中的叙述将按照列出的顺序执行，就像阅读书籍一样。控制流语句处理运算符如何在分支、循环、决策中流转，并允许程序基于某些条件的特定代码块正确运行。\n\
  \n## If-Then（条件分支）\n\n`if then` 语句是控制语句中最简单的语句。`if then` 语句仅在求值为为真时才会执行代码段。\n\n\
  ## 示例\n\n```java\nVoid applyBrakes() {\n  // “if” 子句：汽车必须在移动\n  If (isMoving) {\n\
  \    // “then” 子句：减小当前速度\n    currentSpeed -- ;\n  }\n}\n```\n\n如果 `condition` 为假，控制将移动到下一个\
  \ `if then` 语句。如果大括号中的语句被证明是唯一的语句，那么大括号是可选的。\n\n## 示例\n\n```java\nVoid applyBreaks()\
  \ {\n  // 如上所示，大括号是不必要的\n  If (isMoving)\n  CurrentSpeed --\n}\n```\n\n如果你决定省略大括号，`switch`\
  \ 语句将是脆弱的。如果 `default` 是 `switch` 中找到的最后一个语句，则会省略 `Break` 语句。后续的 `then` 子句会产生错误结果。\n\
  \n## If-Then-Else（条件-分支-否则）\n\n`if-then-else` 语句会在 `if` 子句失败时提供路径。\n\n## 示例\n\n\
  ```java\nVoid applyBreaks() {\n  If (isMoving) {\n    CurrentSpeed --\n  } else\
  \ {\n  }\n```\n\n## Switches（Switch 语句）\n\nSwitch 语句有多种路径。Switch 语句适用于 `byte`、`char`\
  \ 和 `int` 类型。\n\n## 示例\n\n```java\nPublic class SwitchDemo {\n  public void main\
  \ (String[] args) {\n    Int month = 8 ;\n    String monthString ;\n    Switch (month)\
  \ {\n      Case 1: monthString = “January”; break;\n      Case 2: monthString =\
  \ “February”; break;\n      Case 3: monthString = “March”; break;\n      Case 4:\
  \ monthString = “April”; break;\n      Case 5: monthString = “May”; break;\n   \
  \   Case 6: monthString = “June”; break;\n      Case 7: monthString = “July”; break;\n\
  \      Case 8: monthString = “August”; break;\n      Case 9: monthString = “September”;\
  \ break;\n      Case 10: monthString = “October”; break;\n      Case 11: monthString\
  \ = “November”; break;\n      Case 12: monthString = “December”; break;\n      Default:\
  \ monthString = “Invalid month”; break;\n    }\n    System.out.println(monthString);\n\
  \  }\n}\n```\n\n`switch` 语句部分是 `switch` 块。`switch` 语句在执行前会评估表达式。所有成功的语句都带有相同的标签。`if-then-else`\
  \ 语句将用于标记月份。\n\n```javascript\nInt month = 8\nIf (month == 1) {\n  System.out.println\
  \ (“January”)\n} else if (month == 2) {\n  System.out.println (“February”)\n}\n\
  ```\n\n`if-then-else` 语句用于检查表达式的清晰。`if-then-else` 语句将根据整数、枚举值和字符串值测试表达式。`Break`\
  \ 语句将结束 `switch` 语句。\n\n控制流将继续执行 `switch` 块之后的注释。如果 `switch` 块发生穿透（未使用 `break`），则所有语句将按照它们出现的顺序执行，无论\
  \ case 标签是什么，直到到达列为 `break` 的语句为止。\n\n## 示例\n\n```java\nPublic class SwitchDemoFallThrough\
