  \n### Example\n\n```java\nClass BreakDemo {\n    Public static void main(String[]\
  \ args) {\n        Int[] arrayOfs = {32, 87, 3, 589, 12, 1076, 2000, 8, 622, 127,\
  \ 77, 955};\n        Int searchfor = 12;\n        Int i;\n        Boolean foundIt\
  \ = false;\n        For (i = 0; i < arrayOfs.length; i++) {\n            If (arrayOfs[i]\
  \ == searchfor) {\n                foundIt = true;\n                break;\n   \
  \         }\n        }\n        If (foundIt) {\n            System.out.println(“found\
  \ ” + searchfor + “ at “ + i);\n        } else {\n            System.out.println(searchfor\
  \ + “ not in the array”);\n        }\n    }\n}\n```\n\nLabeled breaks 用于终止嵌套循环。示例将展示如何使用带标签的\
  \ `break`。\n\n### Example\n\n```java\nClass BreakLabelDemo {\n    Public static\
  \ void main(String[] args) {\n        Int[][] arrayOfs = {\n            {32, 87,\
  \ 3, 589},\n            {12, 1076, 2000, 8},\n            {622, 127, 77, 955}\n\
  \        };\n        Int searchfor = 12;\n        Int i;\n        Int j = 0\n  \
  \      Boolean foundIt = false;\n        Search:\n        For (i = 0; i < arrayOfs.length;\
  \ i++) {\n            For (j = 0; j < arrayOfs[i].length; j++) {\n             \
  \   If (arrayOfs[i][j] == searchfor) {\n                    foundIt = true;\n  \
  \                  break search;\n                }\n            }\n        }\n\
  \        If (foundIt) {\n            System.out.println(“Found ” + searchfor + “\
  \ at “ + i + “, “ + j);\n        } else {\n            System.out.println(searchfor\
  \ + “ not in the array”);\n        }\n    }\n}\n```\n\n## Continue Statement\n\n\
  `Continue` 语句跳过 `for`、`do-while`、`while` 和 `for` 循环中的迭代。未标记的形式将跳到循环体内部的部分，然后评估主导循环的布尔方程。示例将展示遍历字符串的路径，同时计算字母\
  \ `p` 出现的次数。\n\n### Example\n\n```java\nClass ContinueDemo {\n    Public static\
  \ void main(String[] args) {\n        String searchMe = “Peter Piper picked a “\
  \ + “peck of pickled peppers”;\n        Int max = searchMe.length();\n        Int\
  \ numPs=0;\n        For (int i =0; i<max; i++) {\n            if (searchMe.charAt(i)\
  \ != 'p') {\n                continue;\n            }\n            numPs++;\n  \
  \      }\n        System.out.println(\"Number of p's: \" + numPs);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nfor (int I = 0; I < max; I++) {\n    // 只对 p’s 感\n    if (searchMe.charAt(i)\
  \ != ‘p’) {\n        continue;\n    }\n    // 处理 p’s\n    numPs++;\n}\nSystem.out.println(found”\
  \ + numPs + “ p’s in the string. \");\n```\n\n输出是 9 个 p。如果你删除了 `continue` 语句，将会有\
  \ 35 个 p。带有标签的 `continue` 语句将跳过带有标签的外层循环的当前迭代。在下面的示例中，有两个嵌套循环，用于在字符串中搜索子字符串。为了遍历子字符串以及任何可能被搜索的字符串，需要两个嵌套循环。\n\
  \n## 示例\n\n```java\nclass ContinueWithLabelDemo {\n    public static void main(String[]\
  \ args) {\n        String searchMe = “Look for a substring in me” ;\n        String\
  \ substring = “sub”;\n        Boolean foundIt = false;\n        Int max = searchMe.length()\
  \ – Substring.length();\n        Test:\n        for (int I = 0; I <= max; i++) {\n\
  \            Int n = substring.length();\n            Int j = I;\n            Int\
  \ k = 0;\n            while (n -- != 0) {\n                if (searchMe.charAt(j++)\
  \ != substring.charAt((k++))) {\n                    continue test;\n          \
  \      }\n            }\n            foundIt = true;\n            break test;\n\
  \        }\n        System.out.println(foundIt ? “Found it” : “Didn’t find it”);\n\
  \    }\n}\n```\n\n## 返回语句 (Returned Statements)\n\n返回语句位于分支语句的最后。返回语句是当前控制流中的退出方法，当方法首次被调用时将返回到此处。返回语句有两种形式。其中一种的值将被返回，而另一种的值不会返回。要返回一个值，你需要在关键字后面有一个要返回的值。\n\
  \n语法是 `return ++ count;`。\n\n在返回数据类型后，它必须与方法声明的类型相匹配。当方法声明返回值为 `void` 时，返回的形式将不会提供值。\n\
  \n不作为值的值的语法为 `return;`。\n\n## 在 JavaScript 中的位置 (Placement in JavaScript)\n\nJavaScript\
  \ 在实际放入 HTML 文档时的位置是非常灵活的。不过，有一种首选的方法将其放入文档，以便代码知道它需要执行什么以及何时执行。\n\n*   `<head>`\
  \ 中的脚本将位于 `</head>`\n*   `<body>` 中的脚本将位于 `</body>`\n*   `<body> </body>` 和 `<head>\
  \ </head>` 区域中的脚本\n*   `<head>` 部分中的外部文件区域将位于 `</head>`\n\n## Head 部分中的脚本 (Script\
  \ in the Head Sections)\n\n每当你因为某个事件（例如用户点击鼠标）需要运行脚本时，你必须将脚本放置在 head 部分，以便事件能够正常工作。\n\
  \n## 示例\n\n```html\n<html>\n<head>\n<script type = “text/javascript”>\n//! –\nfunction\
  \ sayHello() {\n    alert(“Hello Earth”)\n}\n// - >\n</script>\n</head>\n<body>\n\
  <input type = “button” onclick =” sayHello()” value = “Say Hello” />\n</body>\n\
  </html>\n```\n\n此代码的输出将是 Hello Earth。\n\n## Body 部分中的脚本 (Script in the Body Sections)\n\
  \n当你需要在脚本在页面加载时运行时，以便它能生成页面上的内容，你的脚本需要存放在文档的 body 部分才能正确运行。\n\n## 示例\n\n```html\n\
  <html>\n<head>\n</head>\n<body>\n<script type = “text/javascript”>\n// - -\ndocument.write\
  \ (“Hello Universe”)\n// - - >\n</script>\n<p> This is web page body </p>\n</body>\n\
  </html>\n```\n\n这段代码的结果将是：\nHello Universe.\nThis is web page body\n\n## Body 和\
  \ Head 部分中的代码 (Code in the Body and Head Sections)\n\n代码可以同时放置在两个部分中，以产生与仅放置在其中一个部分不同的结果。\n\
  \n## 示例\n\n```html\n<html>\n<head>\n<script type = “text/javascript”>\n// - -\n\
  function sayHello() {\n    alert (“Hello people of Earth”)\n}\n// - - >\n</script>\n\
  </head>\n<body>\n<script type = “text/javascript”>\n// - -\ndocument.write( “Hello\
  \ people of Earth”)\n// - - >\n</script>\n<input type = “button” onclick = “sayHello()”\
  \ value = “Say Hello” />\n</body>\n</html>\n```\n\n你的结果将是 Hello people of Earth。\n\
  \n## 外部文件 (External Files)\n\n当你更深入处理 JavaScript 代码时，你会发现某些情况下，相同的代码将放置在单个网站的多个页面上。你不需要在多个\
  \ HTML 文件中使用重复相同的代码。`script` 标签将为你提供将代码存储在外部文件的位置，以便你可以正确地处理 HTML 文件。\n\n## 示例\n\
  \n```html\n<html>\n<head>\n<script type = “text/javascript” src = “filename.js”\
  \ ></script>\n</head>\n<body>\n…..\n</body>\n</html>\n```\n\n当在外部文件中使用 JavaScript\
  \ 时，你必须写出：\n\n## 示例\n\n```javascript\nfunction sayHello() {\n    alert(“Hello Earth”)\n\
  }\n```\n\n## Cookies\n\nCookies 是你用于存储在计算机上的数据。网站通过这种方式获取信息。\n\n## 创建 Cookie (Creating\
  \ Cookies)\n\n使用 JavaScript，你可以使用 `document.cookie` 创建、删除和读取 Cookie。\n\n## 示例\n\n\
  ```javascript\ndocument.cookie = “username = Mary Jane”\n```\n\n## 示例\n\n```javascript\n\
  document.cookie = “username = Mary Jane; expires Wed 9, 2016 12:01:00 UTC”\n```\n\
  \n## 读取 Cookie (Reading Cookies)\n\nJavaScript 使用 `var x = document.cookie` 来读取任何\
  \ Cookie。\n\n## 修改 Cookie (Changing Cookies)\n\nCookie 的修改方式与其创建时一样。\n\n## 删除 Cookie\
  \ (Deleting Cookies)\n\n当你想要删除 Cookie 时，你需要设置一个参数，使日期已经过去。\n\n## 示例\n\n```javascript\n\
  document.cookie = “username = ; expires Sat 01 Jan 1980 00:00:00 UTC”\n```\n\n##\
  \ 字符串 (Strings)\n\n`document.cookie` 看起来像是一个普通的文本字符串，尽管它实际上不是。\n\n### 设置 Cookie\
  \ 的函数示例\n\n首先必须创建该函数，以便将用户名存储在 Cookie 中。\n\n```javascript\nfunction setCookie(cname,\
  \ cvalue, exdays) {\n    var d = new Date();\n    d.setTime(d.getTime() + (exdays\
  \ * 24 *60 *60 *1000));\n    var expires = “expires=” + d.toUTCString();\n}\n```\n\
  \n\n\n\n\n`document.cookie = cname + “=” + cvalue + “;” + expires + “;path=/”;`\n\
  \n这些参数将定义 cookie 的名称 (`cname`)，值将是 (`cvalue`)，而过期日期将是 (`exdays`)。cookie 将通过将名称、值和过期日期拼接成字符串来设置。\n\
  \n## 获取 Cookie 的函数\n\n每当你创建一个函数时，返回值将是特定 cookie 的值。\n\n## 示例\n\n```javascript\n\
  Function getCookie(cname) {\n  Var name = cname +”=”\n  Var ca = document.cookie.split(‘;’);\n\
  \  For (var I = 0; i <ca.length; i++) {\n    Var c = ca[i];\n    While (c.charAt(o)\
  \ == ‘ ‘) {\n      C = c.substring(1);\n    }\n    If (c.indexOf(name) == 0) {\n\
  \      Return c.substring(name.length, c.length);\n    }\n  }\n  Return “”;\n}\n\
  ```\n\ncookie 的名称将被视为参数。为了创建一个变量，你需要名称和文本，以便能够使用 (`cname + “=”`) 进行正确搜索。\n\n`document.cookie`\
  \ 将通过分号进行分割，得到一个名为 `ca` 的数组。遍历 `ca` 数组将读取提供的每个值。一旦找到 cookie，将返回该值。如果没有找到，则返回 `\"\
  \"`。\n\n## 检查 Cookie\n\n在设置 cookie 后，将显示设置时对应的问候语。如果尚未设置，则不会显示问候语，但会弹出一个提示框询问用户的名称，以便使用\
  \ `setCookie` 函数将 cookie 保存长达。\n\n## 示例\n\n```javascript\nFunction checkCookie()\
  \ {\n  Var username = getCookie (“username”);\n  If (username! = “”) {\n    Alert(\
  \ “Welcome again “ + username);\n  } else {\n    Username = prompt (“Please enter\
  \ your name:” , “”);\n    If (username != “” && username != null) {\n      setCookie\
  \ (“username”, username, 365);\n    }\n  }\n}\n```\n\n## 整合在一起\n\n下面的示例将在页面加载时使用\
  \ `checkCookie()`。\n\n## 示例\n\n```javascript\nFunction setCookie( cname, cvalue,\
  \ exdays) {\n  Var d = new Date();\n  d.setTime(d.getTime() + (exdays* 24 *60 *60\
  \ *1000));\n  var expires = “expires=”+d.toUTCString();\n  document.cookie = cname\
  \ + “=” + cvalue + “;” + expires + “;path=/”;\n}\n\nFunction getCookie(cname) {\n\
  \  Var name = cname + “=”;\n  Var ca = document.cookie.split(‘;’);\n  For( var I\
  \ = 0; I < ca.length; I++) {\n    Var c = ca[i];\n    While (c.charAt(0) == ‘ ‘)\
  \ {\n      C = c.substring(1);\n    }\n    If (c.indexOf(name) == 0) {\n      Return\
  \ c.substring(name.length, c.length);\n    }\n  }\n  Return “”;\n}\n\nFunction checkCookie()\
  \ {\n  Var user = getCookie(“username”);\n  If (user != “”) {\n    Alert (“Welcome\
  \ again + user);\n  } else {\n    User = prompt (“Please enter your name:” , “”);\n\
  \    If (user != “” && user != null) {\n      setCookie( “username”, user, 365);\n\
  \    }\n  }\n}\n```\n\n# 你用 JavaScript 可以做什么和不能做什么\n\n有些事情你可以用 JavaScript 来的。就像任何其他程序一样，JavaScript\
  \ 允许你做的事情是有限制的。\n\n## 用 JavaScript 可以做什么？\n\n* 与表单交互\n* 提供反馈\n* 检测用户正在做什么\n* 通知用户某些事项\n\
  * 询问某事是否正确\n* 让用户输入数据\n* 验证停止的脚本\n* 转换\n* 计算\n* 为文档添加内容\n* 弹出窗口操作\n* DOM 脚本编写\n\
  * 注册表单\n* 搜索框\n* 不断变化的信息\n* 表单信息\n* 布局问题\n* 增强 HTML 界面\n* 元素动画\n\n## 你用 JavaScript\
  \ 不能做什么\n\n* 在没有帮助的情况下在服务器上写文件\n* 访问数据库\n* 从客户端读取或写入文件\n* 关闭它未打开的窗口\n* 访问另一个域的网页\n\
  * 保护页面源码或图像\n\n# 常见陷阱\n\n* 混淆相等运算符 (`==`) 和不等于运算符 (`!=`)。\n* 混淆严格相等运算符 (`===`) 和严格不等于运算符\
  \ (`!==`)。\n* 因为 JavaScript 基于真假陈述，所以存在两种运算符。\n* 当你期望操作数类型相同时，`==` / `!=` 可以工作；如果它们类型不同，这些运算符将尝试强制它们转换。\n\
  * 真值（Truthy）和假值（Falsy）是为了假装成布尔值的非布尔表达式设计的。\n* 这些值将被评估为假：`NaN`、`False`、`Null`、`0`、空字符串\
  \ (`\"\"`)。\n* `===` 和 `!==` 比 `==` 和 `!=` 更好。\n* `NaN` 不是数字，只在边缘情况下有用。\n* 如果你必须...\n\
  \n# 技巧与窍门\n\n## 从不同数组追加元素\n更好的选项是通过代码使用原生 JavaScript 排序函数来实现随机排序。\n\n## 字符串修剪函数\n\
  \nJavaScript 和其他编程语言中经典的修剪函数，用于移除字符串中 JavaScript 不会发生的空白字符，以便可以附加到字符串对象上。现代 JavaScript\
  \ 引擎使用了原生的 `trim()` 函数。\n\n\n\n\n\n## 验证给定参数是否为数组\n\n注意：如果 `toString()` 方法被重写，你将无法通过此种技巧获得预期的结果。如果你没有在多个帧中工作，你也可以也可以执行\
  \ `instanceof`。但是，如果你有不同的上下文，你将得到错误的结果。\n\n## 获取数字数组中的最大值最小值\n\n`Var numbers = [5,\
  \ 458, 120, -215, 228, 400, 122205, -85411];`\n\n`varmaxInNumbers = Math.max.apply\
  \ (Math, numbers) ;`\n\n`var minInNumbers = Math.min.apply (Math, numbers) ;`\n\n\
  ## 清空数组\n\n`Var myArray = [12, 222, 1000 ];`\n\n`myArray.length = 0; //myArray 将等于[]`\n\
  \n## 不要使用 delete 移除数组中的项\n\n如果你想从数组中删除项，请使用 `splice` 函数而不是 `delete` 函数。当你使用 `delete`\
  \ 函数时，它会将该项替换为 `undefined` 变量，而不是从数组中删除它。\n\n## 使用 length 截断数组\n\n`Var myArray =\
  \ [12, 222, 1000, 124, 98, 10];`\n\n`myArray.length = 4; //myArray 将等于 [12, 222,\
  \ 1000, 124]`\n\n## 在条件判断中使用 AND/ OR 逻辑\n\n逻辑 OR 也用于为函数参数中的函数设置默认值。\n\n## 使用 map()\
  \ 函数循环遍历数组项\n\n`Var squares = [1,2,3]. Map(function (val) {`\n\n`Return val*val`\n\
  \n`)) ;\n//squares 将等于 [1, 4, 9]`\n\n## 将数字舍入到小数位\n\n`Var num = 2.4432432;`\n\n\
  `Num = num.toFixed(4); //num 将等于 2.4432`\n\n`toFixed()` 函数将返回字符串而不是数字。\n\n## 浮点数问题\n\
  \n`0.1+0.2` 将等于 `0.3000000000000004`。你需要了解的知识是，JavaScript 中的所有数字都是内部用 64 位表示的浮点数。\n\
  \n## 在 for-in 循环时检查对象的属性\n\n此代码段有助于避免遍历对象的属性。\n\n`For (var name in object) {`\n\n\
  `If (object.hasOwnProperty(name)) {`\n\n`// 对 name 执行某些操作`\n\n`}`\n\n## 逗号运算符\n\n\
  `Var a = 0;`\n\n`Var b = (a++, 99) ;`\n\n`Console.log(a); // a 将等于 0`\n\n`Console.log(b);\
  \ // b 将等于 99`\n\n## 缓存计算或查询的变量\n\njQuery 选择器将缓存 DOM 元素\n\n`Var navright = document.querySelector('#right');`\n\
  \n`Var navleft = document.querySelector('#left');`\n\n`Var navup = document.querySelector('#up');`\n\
  \n`Var navdown = document.querySelector('#down');`\n\n## 在传递给 isFinite() 之前验证参数\n\
  \n`isFinite(0) ; // false`\n\n`isFinite(\"10\") //true`\n\n## 避免在数组中使用负索引\n\n`Var\
  \ numbersArray = [1, 2, 3, 4, 5];`\n\n`Var from = numbersArray.indexOf(\"foo\");\
  \ //from 等于 -1`\n\n`numbersArray.splice(from,2); //将返回 [5] 任何通过 splice 的参数都不应为负数。`\n\
  \n# 循环\n\n当一个操作被重复执行时，它被视为循环。循环包含若干条指令，在条件返回真或假之前（取决于需要），继续执行相同的代码块。为了控制循环，你需要一个在每次循环重复时增加或减少的变量。JavaScript\
  \ 中使用了两种循环类型：`For` 循环和 `while` 循环。语句在循环循环时执行效果最佳。如果你使用 `break`，可以 `continue` 循环内部的语句。\n\
  \n## For 循环\n\n`For` 循环将一直执行直到条件返回假。语法与每种编程语言相同。`for` 循环有三个参数：\n\n```\nFor (initialization;\
  \ condition; increment)\n{\n    // 语句\n}\n```\n\n循环语句只有在以下情况下才能执行：\n- 语句和控制进入第二步。\n\
  - 执行等式且条件为真。如果值为假，则将执行语句，然后终止循环。\n- 执行开头的表达式。这将初始化一个或多个不同的循环，因为它们在通过语法时允许来自各种复杂性和程度的表达式。\n\
  - 增量定义被移除、更新或执行。\n\n## 示例\n\n```html\n<script type=\"text/javascript\">\nDocument.write(\"\
  <h1>乘法表</h1>\");\nDocument.write(\"<table border=2 width=50%\");\nFor (var I = 1;\
  \ I <=9;i++) { //这是外层循环\nDocument.write(\"<tr>\");\nDocument.write(\"<td>\" + I\
  \ + \"</td>\");\nFor (var j = 1; j <= 9; j++) { //这是内层循环\nDocument.write(\"<td>\"\
  \ + I * j + \"</td>\");\n}\nDocument.write(\"</tr>\");\n}\nDocument.write(\"</table>\"\
  );\n</script>\n```\n*(注：原文示例中的 HTML 结构存在未闭合标签，翻译时保持了逻辑并微调了可读性)*\n\n`For` 循环将一直执行直到条件返回假。语法与每种编程语言相同。\n\
  \n## While 循环\n\nWhile 循环在 JavaScript 中很常见。while 语句会重复循环直到条件为真。如果条件为假，语句将停止并传递到循环后面的语句。\n\
  \n### 语法\n\n```\nWhile (condition)\n{\n    // 语句\n}\n```\n\n下面的示例将展示如何定义一个从 `I =\
  \ 0` 开始的循环，直到 `I` 变量大于 10。每当通过循环时，`I` 都会增加一次。\n\n## 示例\n\n```javascript\n<script\
  \ type=\"text/javascript\">\nVar I = 0;\nWhile (I<=10) // 输出 0 到 10 的值\n{\nDocument.write(I\
  \ + \"<br>\");\nI++;\n}\n</script>\n```\n\n无论你当前编写什么循环，都需要确保条件最终会变为假。如果没有发生这种情况，循环将永远不会终止并无限运行。\n\
  \n## Break 和 Continue\n\n有时循环在启动时没有任何真/假条件的限制。但是，位于括号内的语句将决定何时退出循环。在循环内部可以找到两条语句：`break`\
  \ 语句和 `continue` 语句。\n\n`continue` 语句将在任何 `for` 或 `while` 循环中停止语句块，并在下一个起始点继续循环。`break`\
  \ 语句将停止 `while` 或 `for` 循环，并在执行循环后面的脚本（如果有的话）。\n\n## 示例\n\n```javascript\n<script\
  \ type=\"text/javascript\">\nDocument.write(\"<p><b>使用 break 语句的示例：</b></p>\");\n\
  Var I = 0;\nFor (i=0; i<=10; i++) {\n    If (i==3){break}\n    Document.write (\"\
  数字是 \" +i);\n    Document.write(\"<br />\");\n}\n</script>\n```\n\n\n\n\n\n```javascript\n\
  Document.write(“<p><b>使用 continue 语句的示例： </b><p>”);\n\nVar I = 0;\n\nFor (I = 0;\
  \ i <= 10; i++) {\n  If ( i==3) (continue)\n  Document.write(“数字是 “ + i);\n  Document.write(“<br\
  \ />”)\n}\n```\n\n# JavaScript 中的运算符\n\n表达式包含运算符和操作数。操作数是表达式中使用的数字，运算符是算术符号。JavaScript\
  \ 支持的运算符类型有：\n\n* 算术\n* 比较\n* 逻辑\n* 位运算\n* 赋值\n* 条件\n* Typeof\n\n## 算术\n\n* 加法：将两个操作数相加。\n\
  * 减法：从第一个操作数中减去第二个操作数。\n* 乘法：将两个操作数相乘。\n* 除法：将被除数除以除数。\n* 取模：余数是除法后剩余的整数。\n* 增增：整数加一。\n\
  * 递减：整数减一。\n\n## 示例\n\n```html\n<html>\n<<body>\n<script type = “text/javascript”>\n\
  <! - -\nVar a = 33;\nVar b = 10;\nVar c = “test”;\nVar linebreak = “<br />”;\n\n\
  Document.write(“a + b =”);\nResult = a + b;\nDocument.write (result) ;\nDocument.write(linebreak);\n\
  \nDocument.write (“ a – b = “);\nResult = a – b;\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write(“a / b = “);\nResult = a / b;\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write(“ a % b = “);\nResult = a % b;\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write( “a + b + c = “);\nResult = a + b + c;\nDocument.write(result);\n\
  Document.write(linebreak);\n\nA = ++a;\nDocument.write (“++a = “);\nResult = ++a;\n\
  Document.write(result);\nDocument.write(linebreak);\n\nB = --b\nDocument.write(“\
  \ - - b = “);\nResult = - - b;\nDocument.write(result);\nDocument.write(linebreak);\n\
  \n// 给变量设置不同的值并尝试一下。\n</</body>>\n</</html>\n```\n\n你的输出将会是：\na = 43\nb = 23\nc\
  \ = 34\nb = 3\n++a = 35\n--b = 8\n\n## 比较\n\n* 等于：检查两个操作数的值以判断是否相等。如果相等，则条件为真（true）。\n\
  * 不等于：检查操作数是否相等，如果不相等，则条件为真（true）。\n* 大于：表示左侧的值大于右侧的值，如果是，则该条件为真。\n* 小于：表示左侧的数字小于右侧，如果是，则条件为真。\n\
  * 大于等于：检查左侧的值是否大于或等于右侧的值。如果是，则条件为真。\n* 小于等于：表示左侧的值小于或等于右侧的值，如果是，则条件为真。\n\n## 示例\n\
  \n```html\n<html>\n<body>\n<script type = “text/javascript”>\n<! - -\nVar a = 10;\n\
  Var b = 20;\nVar linebreak = “<br />”;\n\nDocument.write((a == b) => “);\nResult\
  \ = (a == b);\nDocument.write(result);\nDocument.write(linebreak);\n\nDocument.write(\
  \ (a < b) => “);\nResult = (a < b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write( (a > b) => “ );\nResult = (a > b);\nDocument.write(result);\n\
  Document.write(linebreak);\n\nDocument.write (a != b) => “);\nResult = a != b);\n\
  Document.write(result);\nDocument.write(linebreak);\n\nDocument.write( (a >= b)\
  \ => “);\nResult = (a >= b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write( (a <= b) => “);\nResult = (a <= b);\nDocument.write(result);\n\
  Document.write(linebreak);\n</script>\n</</body>>\n</html>\n```\n\n此示例的输出将会是：\n\
  a == b = false\na < b = true\na > b = false\na != b = true\na >= b = false\na <=\
  \ b = true\n\n## 逻辑\n\n* 逻辑与（AND）：表示两个操作数都为非零。如果是，则条件为真。\n* 逻辑或（OR）：表示至少有一个操作数为非零。如果发现一个是非零，则这是一个真命题。\n\
  * 逻辑非（NOT）：根据操作数的状态反转逻辑状态。如果条件为真，由于“非”操作将变为假。\n\n## 示例\n\n```html\n<html>\n<body>\n\
  <script type = “text/javascript”>\n<! - -\nVar a = true;\nVar b = false;\nVar linebreak\
  \ = “<br />”;\n\nDocument.write(a && b);\n\nResult = (a && b);\nDocument.write(result);\n\
  Document.write(linebreak);\n\nDocument.write(a || b = true);\nResult = (a || b);\n\
  Document.write(result);\nDocument.write(linebreak);\n\nDocument.write(a || b);\n\
  Result = (a || b);\nDocument.write(result);\nDocument.write(linebreak);\n\nDocument.write(!a\
  \ = false);\nResult = (!a);\nDocument.write(result);\nDocument.write(linebreak);\n\
  </script>\n</body>\n</html>\n```\n\n上述示例的结果为：\na && b = false\na || b = true\n!a\
  \ = false\n\n## 位运算\n\n* 位与（AND）：对操作数进行位与运算。\n* 位或（OR）：对操作数进行位或运算。\n* 位异或（XOR）：对操作数进行位异或运算。\n\
  * 位非（NOT）：对位进行取反。\n* 左移：将操作数向左移动指定的位数。\n* 右移：将操作数向右移动指定的位数。\n\n## 示例\n\n```html\n\
  <html>\n<body>\n<script type = “text/javascript”>\n<! - -\nVar a = 2; // 二进制为 10\n\
  Var b = 3; // 二进制为 11\nVar linebreak = “<br />”;\n\nDocument.write(a & b = “);\n\
  Result = (a & b);\nDocument.write(result);\nDocument.write(linebreak);\n\nDocument.write(a\
  \ | b = “);\nResult = (a | b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write(a ^ b = “);\nResult = (a ^ b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write(~b = “);\nResult = (~b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write(a << b = “);\nResult = (a << b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  \nDocument.write(a >> b = “);\nResult = (a >> b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  </script>\n</body>\n</html>\n```\n\n结果：\na & b = 2\na | b = 3\na ^ b = 1\n~b = -4\n\
  a << b = 16\na >> b = 0\n\n## 赋值\n\n* 赋值：将右侧的值赋值给左侧。\n* 加法赋值：将右操作数加到左侧，然后赋值给左侧。\n\
  * 减法赋值：从左侧减去右侧的值并赋值给左侧。\n* 乘法赋值：将操作数相乘后将结果赋值给左侧。\n* 除法赋值：将左侧除以右侧并将结果赋值给左侧。\n* 取模赋值：对两个操作数取模并将结果赋值给左侧。\n\
  * 位赋值运算符变为 `<<=`、`>>=`、`&=`、`|=` 和 `^=`。\n\n## 示例\n\n```html\n<html>\n<body\n<script\
  \ type = “text/javascript”>\n<! - -\nVar a = 33;\nVar b = 10;\nVar linebreak = “<br\
  \ />”;\n\nDocument.write(“a 的值变为 (a = b) => ”);\nResult = (a = b);\nDocument.write(result);\n\
  Document.write(linebreak);\n\nDocument.write(“a += b => ”);\nResult = (a += b);\n\
  Document.write(result);\nDocument.write(linebreak);\n\nDocument.write(“a *= b =>\
  \ ”);\nResult = (a *= b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  ```\n\n\n\n\n\n```javascript\nResult = (a /= b);\nDocument.write(result);\nDocument.write(linebreak);\n\
  Document.write (“Value of a => (a %= b) => “);\nResult = (a %= b);\nDocument.write(result);\n\
  Document.write(linebreak);\n```\n\n输出:\n```\nValue of a => (a =b) = 10\nValue of\
  \ a => (a += b) = 20\nValue of a => (a -=b) = 10\nValue of a => (a *= b) = 100\n\
  Value of a => ( a /= b) = 10\nValue of a => (a %= b) = 0\n```\n\n## 条件判断\n\n- 条件运算符会在语句执行之前对表达式进行求值以得到真或假值，具体的执行语句取决于求值的结果。\n\
  - 如果条件为真，则语句的值将是 x；如果不是，则你将移动到另一个语句。\n\n## 示例\n\n```html\n<html>\n<body>\n<script\
  \ type = “text/javascript”>\n<! - -\nVar a = 10;\nVar b = 20;\nVar linebreak = “<br\
  \ />”;\nDocument.write (“ ((a >b) ? 100 : 200) => “);\nResult = (a > b) ? 100 :\
  \ 200;\nDocument.write(result);\nDocument.write(linebreak);\nDocument.write (“ ((\
  \ a < b) ? 100 : 200) => “);\nResult = (a < b) ? 100 : 200;\nDocument.write(result);\n\
  Document.write(linebreak);\n// - - >\n</script>\n</body>\n</html>\n```\n\n结果如下：\n\
  ```\n(( a > ) ? 100 : 200 => 200\n((a < b) ? 100 : 200 => 100\n```\n\n## Typeof\n\
  \n- `Typeof` 运算符是一一元运算符。它位于单个操作数之前。操作数可以是任何类型。\n- 结果将变成一个字符串，显示所使用的数据类型。\n- 只有当根据求值结果为真或假时，`Typeof`\
  \ 运算符才会评估字符串、数字和布尔值。\n- 使用 `typeof` 运算符返回的值：`Number = number`、`Object = object`、`Null\
  \ = object`、`String = string`、`Function = function`、`Undefined = undefined`。\n\n\
  ## 示例\n\n```html\n<html>\n<body>\n<script type “text/javascript”>\n<! - -\nVar a\
  \ = 10\nVar b = “String”;\nVar linebreak = “<br />”;\nResult = (typeof b == “string”\
  \ ? “B is String” : “B is Numeric”);\nDocument.write( “Result => “);\nDocument.write(result);\n\
  Document.write(linebreak);\nResult = (typeof a == “string” ? “A is String” : “A\
  \ is Numeric”);\nDocument.write(“result => “);\nDocument.write(result);\nDocument.write(linebreak);\n\
  // - ->\n</script>\n</body>\n</html>\n```\n\n结果：\n```\nResult => B is String\nResult\
  \ => A is Numeric\n```\n\n# 使用 JavaScript 打印页面\n\n你可能需要一个允许将页面内容打印到实际打印机的按钮。JavaScript\
  \ 有一个可以实现此点的函数。`window.print()` 函数将打印你当前查看的任何页面。此函数也被认为是一个 `onclick` 事件。\n\n## 示例\n\
  \n```html\n<html>\n<head>\n<script type = “text/javascript”>\n<! - -\n// - - >\n\
  </script>\n</head>\n<body>\n<form>\n<input type = “button” value = “Print” onclick\
  \ = “window.print()” />\n</form>\n</body>\n</html>\n```\n\n这可以帮助你获取你正在查看内容的打印副本，但当你想要打印页面时，并不建议使用它。有一个打印友好的页面，它不会包含通常出现在网页侧边缘的广告等图像。\n\
  \n为了使页面适用于打印，你需要：\n- 复制页面上的文本，且不包含任何你不想要的图片。\n- 如果你不需要额外的副本，则需要使用适当的注释制作可打印的文本。\n\
  - `<! – PRINT STARTS HERE - - > <! - - PRINT ENDS HERE - - >`\n\n如果这些步骤不起，请使用浏览器上的工具栏打印页面。文件路径为\
  \ `file – print – okay`\n\n# 结论\n\n感谢你读完《JavaScript 编程基础：零基础初学者入门》，希望这本书对你有所启发，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\
  \n下一步是将你新学到的知识应用于创建 JavaScript 代码。\n\n你一直有无尽的内容供你学习，如果你感兴趣，你可以在网上找到书籍和其他资源来进一步丰富你的知识，以便你能够使用\
  \ JavaScript 做更多事情。\n\n如果你的脚本第一次运行没有按照你的预期工作，请不要气馁，这需要耐心和练习才能让你的脚本运行正确。\n\n最后，如果你发现这本书对你有任何帮助，我们将非常感谢你在亚马逊上的好评！\n\
