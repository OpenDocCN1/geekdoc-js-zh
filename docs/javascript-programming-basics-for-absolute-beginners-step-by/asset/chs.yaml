  \ 语句也将用于表达式的终止。如果变量是 `for` 语句中的，它将不会在循环外部使用。它将在初始化过程中声明变量。名称 `i`、`k` 和 `j` 用于循环控制。在初始化表达式中声明后，其寿命将缩短且错误数量会减少。`for`\
  \ 语句也将用于表达式的终止。无限循环这种语法在 `for` 语句中。\n\n### Example\n\n```java\nWhile (true){\n \
