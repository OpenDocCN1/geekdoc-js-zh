    # Loops


    When an operation is repeated, it is considered to be a loop. Loops have several
    instructions that considered in continuing with the same code block until the
    condition has been returned as true or false depending on which one is needed.
    To govern loops, you have to have a variable that is conflicting that is going
    to increase or decrease each time that a loop is repeated.


    There are two loop types used in JavaScript. For loops and while loops. Statements
    will be executed at their best when they have been used in a loop. If you use
    a break, you can continue the statement inside of the loop.


    ## For Loop


    For loops are going to be executed until the condition returns as false. The syntax
    is the same as every other programming language. There are three arguments with
    a for loop.


    ### Example


    For (initialization; condition; increment)


    {


    // statements


    }


    Loop statements can only be executed if:


    *   The statement and the control go to step two.


    *   The equation is performed and the condition is true. Then the statement will
    be carried out if the value is false and the loop will then be terminated.


    *   The expression at the beginning is executed. This expression will initialize
    one or several different loops as they move through the syntax to allow expressions
    from various complexities and degrees.


    *   The increment definition is removed, updated, or executed.


    ### Example


    <script type = “text/ javascript”>


