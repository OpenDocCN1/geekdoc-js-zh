    \n# 循环\n\n当一个操作被重复执行时，它被视为循环。循环包含若干条指令，在条件返回真或假之前（取决于需要），继续执行相同的代码块。为了控制循环，你需要一个在每次循环重复时增加或减少的变量。JavaScript\
    \ 中使用了两种循环类型：`For` 循环和 `while` 循环。语句在循环循环时执行效果最佳。如果你使用 `break`，可以 `continue` 循环内部的语句。\n\
    \n## For 循环\n\n`For` 循环将一直执行直到条件返回假。语法与每种编程语言相同。`for` 循环有三个参数：\n\n```\nFor (initialization;\
    \ condition; increment)\n{\n    // 语句\n}\n```\n\n循环语句只有在以下情况下才能执行：\n- 语句和控制进入第二步。\n\
    - 执行等式且条件为真。如果值为假，则将执行语句，然后终止循环。\n- 执行开头的表达式。这将初始化一个或多个不同的循环，因为它们在通过语法时允许来自各种复杂性和程度的表达式。\n\
    - 增量定义被移除、更新或执行。\n\n### 示例\n\n```html\n<script type=\"text/javascript\">\nDocument.write(\"\
    <h1>乘法表</h1>\");\nDocument.write(\"<table border=2 width=50%\");\nFor (var I =\
    \ 1; I <=9;i++) { //这是外层循环\nDocument.write(\"<tr>\");\nDocument.write(\"<td>\"\
    \ + I + \"</td>\");\nFor (var j = 1; j <= 9; j++) { //这是内层循环\nDocument.write(\"\
    <td>\" + I * j + \"</td>\");\n}\nDocument.write(\"</tr>\");\n}\nDocument.write(\"\
    </table>\");\n</script>\n```\n*(注：原文示例中的 HTML 结构存在未闭合标签，翻译时保持了逻辑并微调了可读性)*\n\n\
    `For` 循环将一直执行直到条件返回假。语法与每种编程语言相同。\n\n## While 循环\n\nWhile 循环在 JavaScript 中很常见。while\
    \ 语句会重复循环直到条件为真。如果条件为假，语句将停止并传递到循环后面的语句。\n\n### 语法\n\n```\nWhile (condition)\n\
    {\n    // 语句\n}\n```\n\n下面的示例将展示如何定义一个从 `I = 0` 开始的循环，直到 `I` 变量大于 10。每当通过循环时，`I`\
    \ 都会增加一次。\n\n### 示例\n\n```javascript\n<script type=\"text/javascript\">\nVar I\
    \ = 0;\nWhile (I<=10) // 输出 0 到 10 的值\n{\nDocument.write(I + \"<br>\");\nI++;\n\
    }\n</script>\n```\n\n无论你当前编写什么循环，都需要确保条件最终会变为假。如果没有发生这种情况，循环将永远不会终止并无限运行。\n\n\
    ## Break 和 Continue\n\n有时循环在启动时没有任何真/假条件的限制。但是，位于括号内的语句将决定何时退出循环。在循环内部可以找到两条语句：`break`\
    \ 语句和 `continue` 语句。\n\n`continue` 语句将在任何 `for` 或 `while` 循环中停止语句块，并在下一个起始点继续循环。`break`\
    \ 语句将停止 `while` 或 `for` 循环，并在执行循环后面的脚本（如果有的话）。\n\n### 示例\n\n```javascript\n<script\
    \ type=\"text/javascript\">\nDocument.write(\"<p><b>使用 break 语句的示例：</b></p>\"\
    );\nVar I = 0;\nFor (i=0; i<=10; i++) {\n    If (i==3){break}\n    Document.write\
    \ (\"数字是 \" +i);\n    Document.write(\"<br />\");\n}\n</script>\n```\n\n"
- fmt: "\n```javascript\nDocument.write(“<p><b>Example of using the continue statement:\
