    \ 变量\n\n变量是带有名称的盒子。变量用于存储值。你盒子的名称将是变量名。盒子的内容将与变量有关。这就像计算机的内存，信息被放在内存中，就像内容被放在变量中。变量将引用你给它的名称。\n\
    \n### 示例\n\n```html\n<<html>>\n<head>\n<title> 我的 JavaScript 页面 </title>\n</head>\n\
    <body>\n<script>\nMyname = “Susann” ;\nDocument.write(myname) ;\n</script>\n</body>\n\
    </html>\n```\n\n你想要存储在变量中的文本需要包含在引号中。这将允许程序区分变量和普通文本。\n\n### 示例\n\n```html\n<html>\n\
    <head>\n<title> 我的 JavaScript 页面 </title>\n</head>\n<body>\n<script>\nSusann =\
    \ “my first name” ;\nMyname = Susann ;\nDocument.write (myname) ;\n</script>\n\
    </body>\n</html>\n```\n\n输出结果是：\n\n*   `Susan` 是变量\n*   它位于 `myname` 变量中\n*  \
    \ `myname` 将被置于文档\n*   最终结果是 my first name\n\n## 赋值给变量的值\n\n将值赋予变量的最常用方法是等号。\n\
    \n## 运算符\n\n像 `++` 和 `--` 这样的运算符是你最可能不想使用的。你可以使用其他运算符来完成与这些运算符相同的工作。但它们会让你的代码输入速度更快，因此许多程序员使用它们来使编码运行得更快。运算符\
    \ `++` 会增加 1。`--` 会减少 1。百分比符号将返回两个数相除后余数的模。\n\n## 变量比较\n\n你有多种方法可以比较变量。最简单的方法是双等号。当你忘记不使用双等号时，你并没有比较变量。列在左侧的变量将被赋值右侧列的值。\n\
    \n### 示例\n\n```javascript\nIf (firstname = “Susann”) {alert(“Nice name!!!”)}\n\
    ```\n\n这是常见的，但它会导致你的脚本运行方式不同。你可以在 JavaScript 中使用你在小学学过的运算符：\n\n*   `==` 等于\n*\
    \   `!=` 不等于\n*   `<` 小于\n*   `>` 大于\n*   `<=` 等于或小于\n*   `=` 等于或大于\n\n# JavaScript\
    \ 中的函数\n\nJavaScript 中的函数将被封装在代码中，旨在执行特定任务。函数将在每次被调用或请求时执行。\n\n### 示例\n\n```javascript\n\
    Function myFunction(p1, p2) {\nReturn p1 * p2;\n// 你的函数将返回 p1 和 p2 的乘积\n}\n```\n\
    \n## 函数语法\n\n函数由关键字 `function` 定义。名称后跟着一组圆括号。名称将包含数字、下划线、字母和美元符号。它们遵循与变量相同的规则。括号内将用逗号分隔的参数名。所有要执行的代码都将放在花括号中。\n\
    \n### 示例\n\n```javascript\nFunctionname(parameter1, parameter2, parameter3) {\n\
    要执行的代码\n}\n```\n\n参数是定义函数中已经存在的名称。参数包含函数在被调用时所接受的真实值。参数的行为类似于局部变量。\n\n## 调用\n\n\
    当代码被放入函数中时，它将在被调用后被使用。代码在以下情况下被调用：\n\n*   从脚本中被调用\n*   发生事件，例如按钮被点击时\n*   它是自调用的\n\
    \n## 返回\n\n代码将到达一个已返回的语句，这意味着它将停止运行。当语句返回到调用语句之后的执行代码中时，代码将被调用。函数将评估返回的值。返回的值将返回给原始调用者。\n\
    \n### 示例\n\n```javascript\nVar x = myFunction (4, 3); //此函数已被调用，并将返回值为 x。\n\n\
    Function myFunction(a, b) {\nReturn a * b; //函数返回 a 乘以 b 的乘积\n}\n```\n\n`X` 将是\
    \ `12`，这将是你的输出。\n\n## 为什么使用函数？\n\n函数将允许代码被复用。代码将被定义一次，然后可以多次使用。相同的代码将使用不同的参数获得不同的结果。\n\
    \n### 示例\n\n```javascript\nFunction toCelsius (Fahrenheit) {\nReturn ( 5/9) *\
    \ (Fahrenheit -32);\n}\n\nDocument.getElementById(“demo”).innerHTML = toCelsius(77);\n\
    ```\n\n## 圆括号运算符\n\n要在不使用圆括号的情况下访问函数，你将获得一个定义。\n\n### 示例\n\n```javascript\nFunction\
    \ toCelsius( Fahrenheit) {\nReturn ( 5/9) * (Fahrenheit – 32);\n}\n\nDocument.getElementById(“demo”).\
    \ innerHTML = toCelsius;\n```\n\n## 函数中的变量\n\n函数可以像变量一样使用。它们将用于公式、赋值和计算。\n\n###\
    \ 示例\n\n```javascript\nVar x = toCelsius(77);\n```\n\n JavaScript 决策\n\n有不同的语句用于决策。\n\
    \n## If 语句\n\n语句将检查条件是否为真或假。条件将是一个表达式。语句将被执行。\n\n### 语法\n\n```javascript\nIf(condition)\n\
    {\n语句\n}\n```\n\n如果有一个语句，将不使用花括号。如果有多个语句，则需要括号。\n\n建议使用花括号，这样你的代码更容易管理和清晰。\n\n\
    ### 示例\n\n```html\n<script>\nIf (6 > 2)\n{\nDocument.write( “yes 6 is greater\
    \ than 2”);\nDocument.write“<br />” + “JavaScript is easy”);\nDocument.write(<br\
    \ />);\n}\n</script>\n```\n\n输出：\n\nYes 6 is greater than 2.JavaScript is easy.\n\
    \n### 示例\n\n```javascript\nIf(true)\nDocument.write (“Ah! A Boolean inside. Also,\
    \ I am not using curly brackets”);\n```\n\n//不使用花括号也可以\n\n### 示例\n\n```javascript\n\
    If ( 2 == 4)\n{\nDocument.write (“This is not going to be printed”);\n}\n```\n\
    \n//由于条件为假，语句将被执行。\n\n## Else 语句\n\n语句将与 if 语句一起使用。当条件为假时，else 语句将被执行。\n\n在使用\
    \ else 语句时会去掉花括号。这只有在需要执行单个语句时才会发生。\n\n### 示例\n\n```html\n<script>\nIf 5 > 7\n\
    {\nDocument.write(“True”);\n}\n\nElse\n{\nDocument.write(“False”);\n}\n</script>\n\
    ```\n\n输出将是 false。\n\n## Else If 语句\n\n有很多条件需要检查，那么将需要大量的 if 语句。if 条件将同时被检查。如果一个条件失败，检查将停止。这就是你使用\
    \ else if 语句的时候。\n\n### 语法\n\n```javascript\nIf(condition)\n{\n语句\n}\n\nElse if\
    \ (condition)\n{\n语句\n}\n\nElse\n{\n语句\n}\n```\n\n当所有条件都失败时，最后的 else 语句将被执行。\n\
    \n### 示例\n\n```html\n<script>\nVar a = 3;\n\nVar b = 4;\n\nIf (a > b)\n{\n```\n"
- fmt: "\n```javascript\nDocument.write(“a is greater than b”);\n} else if (a < b)\
    \ {\n  Document.write(“ a is smaller than b”);\n} else {\n  Document.write(“Nothing\
    \ worked”);\n}\n</script>\n```\n\n## Switches\n\nSwitch statements will do the\
    \ same thing as the `else if` statement. The `switch` statement will be used when\
    \ there are multiple conditions. Switch statements are used to perform better\
    \ than an `else if` statement.\n\n### Syntax\n\n```java\nSwitch(expression)\n\
    {\n  Case value -1: statements; break;\n  Case value -2: statements; break;\n\
    \  Case value 3: statements; break;\n  ….\n  Case value-n: statements; break;\n\
    \  Default: statements; break;\n}\n```\n\nA `switch` statement will assess the\
    \ statement to check and see if it matches any cases. If it matches, then the\
    \ statement that is inside the `case` will be executed before being followed by\
    \ a `break` statement. `Break` statements make it to where no other `case` statements\
    \ are executed.\n\nIf an `expression` cannot be matched to a `case` value, then\
    \ the `default` case is going to be the one executed. It does not matter what\
    \ kind of statement is in the `case`. Curly brackets do not have to be used. `Break`\
    \ statements will be omitted if the `default` construction is the last statement\
    \ that is found in the `switch`.\n\n### Example\n\n```javascript\n<script>\nVar\
    \ a = 8\nSwitch(a)\n{\n  Case 1: document.write(“one”); break;\n  Case 2: document.write(\
    \ “two”); break;\n  Case 3: document.write( “three”); break;\n  Case 4: document.write(\
    \ “four”); break;\n  Case 5: document.write( “five”); break;\n  Default: document.write(“number\
    \ not found”);\n}\n// outputs five\n</script>\n```\n\nCase values are able to\
    \ be strings, characters, and numbers.\n\n### Example\n\n```javascript\n<script>\n\
    Var I = ‘j’;\nSwitch(i)\n{\n  Case ‘a’: document.write(“a found”); break;\n  Case\
    \ ‘b’: document.write(‘b found”); break;\n  Case ‘c’: document.write(“c found”);\
    \ break;\n  Case ‘j’: document.write(“j found”); break;\n  Case ‘string’: document.write(“string\
    \ found”); break;\n  Default: document.write(“nothing found”);\n}\n//outputs j\
    \ found\n</script>\n```\n\n## Ternary\n\nTernary operators are the operators that\
    \ many programmers use. There are three operands for a ternary operator.\n\n###\
    \ Syntax\n\n```java\nCondition ? if-true-execute-this : if-false-execute-this;\n\
    ```\n\nIf the `condition` is right, then the statement will be before a colon\
    \ in order to be executed. If the statement is returned false, the statement after\
    \ the colon will be executed. A variety of statements cannot be used because JavaScript\
    \ will not allow it. Multiples statements can be executed by using functions and\
    \ naming that function should the condition be found true or false.\n\n### Example\n\
    \n```javascript\n<script>\nTrue ? document.write (“True value found”) : document.write(“False\
    \ value found”);\nDocument.write(“<br />”);\n// outputs True value found.\n( 6\
    \ > 5 && 3 == 2) ? document.write(“True”) : document.write(“False”);\nDocument.write(“\
    \ <br />”);\n// outputs False\nVar a = (true) ? 1 : 2;\nDocument.write(a);\n//outputs\
    \ 1\n</script>\n```\n\n## If Else and Switch Statements That Are Nested\n\nYou\
    \ can put an `if`, `or`, `else` or `switch` statement in another condition. You\
    \ are going to come to know this as nesting. `Else, if`, or `switch` statements\
    \ can be nested to any level. But the code is going to be more confusing than\
    \ it was before.\n\n### Syntax\n\n```java\nIf(condition)\n{\n  If (other condition)\n\
    \  {\n    Statements;\n  }\n}\nElse\n{\n  If (other condition)\n  {\n    Statements;\n\
    \  }\n  Else\n  {\n    Switch(expression)\n    {\n      Case value-1: statements;\
    \ break;\n      …\n    }\n  }\n}\n```\n\n# Control Flow Statements in JavaScript\n\
    \nWhen you find a source file, the narratives in it are going to execute in the\
    \ sequence that they are listed much like how you read a book. Flow statements\
    \ are going to deal with how the operators flow through branching, looping, decision-making,\
    \ and enabling the program to operate correctly because of specific chunks of\
    \ code that are based on certain conditions.\n\n## If-Then\n\nThe `if then` statement\
    \ will be the simplest statement in a control statement. `If then` statements\
    \ are going to perform a code segment only if it evaluates as true.\n\n### Example\n\
    \nDriver’s Ed class will only enable the brakes to decrease the car’s speed only\
    \ if the car is already in motion.\n\n```java\nVoid applyBrakes() {\n  // the\
    \ “if” clause: car must be moving\n  If (isMoving) {\n    // the “then” clause:\
    \ decrease current speed\n    currentSpeed -- ;\n  }\n}\n```\n\nIf the `condition`\
    \ is false, the control will move to the following `if then` statement. Open and\
    \ closed curly brackets are optional if the clause found in them turns out to\
    \ be the only statement.\n\n### Example\n\n```java\nVoid applyBreaks() {\n  //\
    \ same as above example, only the curly brackets are not going to be here.\n \
    \ If (isMoving)\n  CurrentSpeed -- ;\n}\n```\n\nIf you decide to omit the curly\
    \ brackets, this is going to be your choice. But, if you omit them, you are making\
    \ your code fragile. When a second statement is later, adding a `then` clause\
    \ will cause you to possibly forget the curly brackets. The compiler will not\
    \ catch the mistake and you are going to get improper results.\n\n## If-Then-Else\n\
    \nThe `if-then-else` statement will add a secondary path for the code to use if\
    \ the `if` clause fails.\n\n### Example\n\n```java\nVoid applyBreakes() {\n  If\
    \ (isMoving) {\n    CurrentSpeed -- ;\n  } else {\n    System.err.print(“The car\
    \ is not moving!”\n  }\n}\n```\n\n## Switches\n\nSwitch statements have a variety\
    \ of paths. Switch statements work with `byte`, `char`, `short`, and `int` data\
    \ types.\n\n### Example\n\n```java\nPublic class SwitchDemo {\n  public void main\
    \ (String[] args) {\n    Int month = 8 ;\n    String monthString ;\n    Switch\
    \ (month) {\n      Case 1: monthString = “January” ; break;\n      Case 2: monthString\
    \ = “February” ; break;\n      Case 3: monthString = “March” ; break;\n      Case\
    \ 4: monthString = “April” ; break;\n      Case 5: monthString = “May” ; break;\n\
    \      Case 6: monthString = “June” ; break;\n      Case 7: monthString = “July”\
    \ ; break;\n      Case 8: monthString = “August” ; break;\n      Case 9: monthString\
    \ = “September” ; break;\n      Case 10: monthString = “October” ; break;\n  \
    \    Case 11: monthString = “November” ; break;\n      Case 12: monthString =\
    \ “December” ; break;\n      Default: monthString = “Invalid month” ; break;\n\
    \    }\n    System.out.println(monthString) ;\n  }\n}\n```\n\nThe main `switch`\
    \ statement part is a `switch` block. The comments that fall in the `switch` will\
    \ point out multiple `cases` or `default`. `Switch` statements evaluate expressions\
    \ before they are executed. All the statements that succeed are going to be labeled\
    \ with identical tags. Month’s names are going to be used with an `if-then-else`\
    \ statement.\n\n```javascript\nInt month = 8\nIf (month == 1) {\n  System.out.println\
    \ (“January”)\n} else if (month == 2) {\n  System.out.println (“February”)\n}\n\
    ```\n\nAn `if-then-else` statement will be used if the clarity of the expression\
    \ needs to be examined. The `if-then-else` statement will test an expression if\
    \ the conditions and values are needing to be tested based on integers, enumerated\
    \ values, and string values. `Break` statements will end the `switch` statements.\n\
    \nControl flow will continue with the comment that follows the `switch` block.\
    \ `Break` statements are used if the `switch` block falls through, therefore all\
    \ statements are going have identical labels to be executed in the order that\
    \ they appear no matter what case labels there are or until the statement that\
    \ is listed as a `break` has been reached.\n\n### Example\n\n```java\nPublic class\
    \ SwitchDemoFallThrough {\n  public static void main (String[] args) {\n    Java.util.ArrayList<String>\
    \ futureMonths = New java.util.ArrayList<String> ();\n    Int month = 8 ;\n  \
    \  Switch (month) {\n      Case 1: futureMonths.add (“January”);\n      Case 2:\
    \ futureMonths.add (“February”);\n      Case 3: futureMonths.add (“March”);\n\
    \      Case 4: futureMonths.add (“April) ;\n      Case 5: futureMonths.add (“May”);\n\
    \      Case 6: futureMonths.add (“June”);\n      Case 7: futureMonths.add (“July”);\n\
