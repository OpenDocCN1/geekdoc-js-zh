    JavaScript is not actually HTML code. As you are creating JavaScript code, you
    will be required to allow your browser to understand that you are inputting JavaScript
    to the HTML. JavaScript function is `<script>`. The function `<script type = “text/javascript”>
    <script>` is going to allow the page to know exactly where the JavaScript coding
    is going to start and where ends.


    ### Example


    ```html

    <html>

    <head>

    <title> My JavaScript Page </title>

    </head>

    <body>

    <script type = “text/javascript”>

    Alert (“Welcome to my world!!!”);

    </script>

    </body>

    </html>

    ```


    The word `alert` is going to cause an alert box to pop up on your screen. To make
    it go away so that you can continue with what you are doing, you are going to
    have to click “ok”. The alert command will be entered when the browser needs to
    recognize the code as JavaScript. Whenever you do not put `<script>` in the coding,
    the browser will think that what you have entered is regular text. You can put
    JavaScript in both the head and the body of a document that is written in HTML.
    You should try to keep as much of your code in the head section.


    ## First Script


    Before you are able to make your first program using JavaScript, you have to know
    more things than where you need to put your code. JavaScript lines have to end
    with semicolons. All code can be placed in one line without the worry of destroying
    how it performs. Even though it is not going to affect how the code performs,
    it is going to destroy how your script looks. Your text should be inside of a
    set of quotations. When you forget to put text in quotations, it is going to be
    considered variables. Capitals are going to mean something different than lowercase
    letters. Capitals should only be placed in their correct places so that your script
    is not messed up.


    ### Example


    ```html

    <html>

    <head>

    <title> My JavaScript Page </title>

    </head>

    <body>

    <script type = “text/javascript”>

    </script>

    Document.write (“Welcome to my world!!!”);

    </script>

    </body>

    </html>

    ```


    `Document.write` will tell the users to place the contents in the parentheses
    into the document. You will have an output similar to the Python test file of
    Hello World!


    ### Example


    ```html

    <html>

    <head>

    <title> My JavaScript Page </title>

    </head>

    <body>

    Hello!!! <br>

    <script>

    Document.write (“Welcome to my world!!!”);

    </script>

    Enjoy your stay…<br>

    </body>

    </html>

    ```


    Output:

    Hello!!!

    Welcome to my world!!!

    Enjoy your stay…


    Text will be written where it has been placed in the HTML code. Many HTML tags
    are written with `document.write`.


    ## Capitals


    In JavaScript, `yourname` and `YOURNAME` are two different variables.


    ### Example


    ```html

    <html>

    <head>

    <title> My Page </title>

    </head>

    <body>

    <script>

    myvalue =2;

    myvalue =5;

    result = myvalue + myvalue;

    document.write(result) ;

    </script>

    </body>

    </html>

    ```


    ### Example


    ```html

    <html>

    <head>

    <title> My Page </title>

    </head>

    <body>

    <script>

    myvalue =2;

    MyValue =5;

    result = myvalue + MyValue;

    document.write(result) ;

    </script>

    </body>

    </html>

    ```


    Both have different variables, therefore they will have different outputs. Do
    not mix and match syntax. Which syntax you use is not as important as you sticking
    with it all through your code.


    ## Pop-ups


    You will get three pop-up boxes when using JavaScript. The alert box, confirm
    box, and the prompt box.


    ### Alert


    The syntax is going to alert to something that is in the text that you entered.
    You need to click “ok” to continue. You are going to be notified of information
    you have to know.


    ### Confirm


    This box is to confirm your text. You will need to click “ok” or “cancel”. You
    are going to be forced to accept something. When “ok” is clicked, the value is
    true. When “cancel” is clicked, the value will be found as false.


    ### Example


    ```javascript

    If (confirm(“Do you agree”)) {alert)”You agree”)}

    Else(alert (“You do not agree”)) ;

    ```


    ### Prompt


    This box is going to prompt your text vs the default value. You will have to click
    “ok” or “cancel”. Before you can continue on the page, you will have to input
    something. “okay” is going to return the entry. “cancel” is going to say that
    the return was empty.


    ### Example


    ```javascript

    Username = prompt (“Please enter your name” , “Enter your name here”) ;

    ```


    # Syntax of JavaScript


    Syntax is a basic set of rules on how JavaScript code is constructed.


    ## Programs


    The program is going to have a set list of instructions as to what needs to be
    executed by the computer program so that the program or website works correctly.
    These instructions are considered to be statements. These statements are separated
    by semicolons.


    ### Example


    ```javascript

    Var x = 5;

    Var y = 7;

    Var z = x + y;

    ```


    JavaScript programs are going to be executed inside of a web browser.


    ## Statements


    There are five components of a statement in JavaScript: Keywords, Values, Operators,
    Comments and expressions.


    ## Values


    There are two different value types. Fixed and variable. Fixed values are also
    known as literals. Variable values are nothing more than regular variables.


    ## Literals


    There are rules when writing fixed variables. You will need to write numbers with
    the appropriate decimal points.


    ### Example


    ```

    10.50

    1001

    ```


    Strings are going to be inside of quotes no matter if it is double quotes or single
    quotes.


    ### Example


    ```

    “Jane Doe”

    ‘Jane Doe''

    ```


    ## Variables


    Stored data from values is the definition of a variable. `Var` is going to tell
    JavaScript that it is a variable. The equals sign is going to tag a value to the
    variable.


    ### Example


    ```javascript

    Var x;

    X = 6;

    ```


    ## Operators


    Assignment operators are used to assign values to variables. The assignment operator
    is going to be the equals sign.


    ### Example


    ```javascript

    Var x = 8

    Var y = 9

    ```


    You can also use arithmetic operators like addition, subtraction, multiplication,
    and division.


    ## Expressions


    The combination of operators, variables, and values will make up an expression.
    Operators, values, and variables will compute to equal some sort of value. The
    process of computing the value is called an evaluation.


    ### Example


    ```

    10 * 20

    ```


    The output will be 200\. The expression can also have a variable value.


    ### Example


    ```javascript

    x * 5

    ```


    Values will be different types of data like numbers or strings.


    ### Example


    ```

    “Jane” + “ “ + “Doe”

    ```


    The output is Jane Doe


    ## Keywords


    Keywords identify any action that needs to be performed. `Var` is going to tell
    the browser to make a new variable.


    ### Example


    ```javascript

    Var x = 6 + 8;

    Var y = x * 15;

    ```


    ## Comments


    All comments will not be executed. Double dashes after a code or between is going
    be a comment. Comments are ignored because they are there to help programmers
    understand the code that has been written.


    ### Examples


    ```javascript

    Var x = 9; //I am going to be executed in order to give you an output.

    // var x = 7; //this is not going to be executed because it has a double dash
    before the code, therefore making it to where it is just a comment.

    ```


    ## Identifier


    Identifiers are names for different things that you are going to find in JavaScript.
    Identifiers name the various variables, functions, labels and keywords. Legal
    names have the same rules as any other programming language. First characters
    will have to be dollar signs, underscore, or letter. Characters that come after
    can be any sign, number, or letter. Numbers are not allowed to be the first letter
    in an identifier because JavaScript will think it is a number, not a name.


    ## Case Sensitive


    Identifiers are very case sensitive. Variables like `middleName` and `middlename`
    are going to be different variables.


    ### Example


    ```javascript

    lastName = “Mann”;

    lastname = “Johnson”;

    ```


    However, `var` and `VAR` are the same.


    ## Joining Variables


    There are 3 ways that words are usually joined to make a single variable:


    ### Hyphen


    Hyphens, such as `My-name-is`, are not allowed in JavaScript. They are reserved
    for subtraction only.


    ### Underscore


    `My_name_is`


    ### Camel case


    There will be two or more capital letters, such as `myNameIs`. Think of the humps
    on a camel. Most programmers leave the first letter lowercased.


    ## Character Set

