    # Operators in JavaScript


    Expressions are going to have operators and operands. Operands are the numbers
    that are used in the expression and the operator is the arithmetic sign. The types
    of operators supported by JavaScript are:


    *   Arithmetic


    *   Comparison


    *   Logical


    *   Bitwise


    *   Assignment


    *   Conditional


    *   Typeof


    ## Arithmetic


    *   Addition where the operands are added together.


    *   Subtraction where the second operand is going to be subtracted from the first.


    *   Multiplication where both operands are multiplied together.


    *   Division where the numerator is divided by the denominator.


    *   Modulus where the remainder is going to be an integer that is left over from
    division.


    *   Increment where the integer increases by one.


    *   Decrement where the integer decreases by one.


    ### Example


    <html>


    <body>


    <script type = “text/javascript”>


    <! - -


    Var a = 33;


    Var b = 10;


    Var c = “test”;


    Var linebreak = “<br />”;


    Document.write(“a + b =”);


    Result = a + b;


    Document.write (result) ;


    Document.write(linebreak);


    Document.write (“ a – b = “);


    Result = a – b;


    Document.write(result);


    Document.write(linebreak);


    Document.write(“a / b = “);


    Result = a / b;


    Document.write(result);


    Document.write(linebreak);


    Document.write(“ a % b = “);


    Result = a % b;


    Document.write(result);


    Document.write(linebreak);


    Document.write( “a + b + c = “);


    Result = a + b + c;


    Document.write(result);


    Document.write(linebreak);


    A = ++a;


    Document.write (“++a = “);


    Result = ++a;


    Document.write(result);


    Document.write(linebreak);


    B = --b


    Document.write(“ - - b = “);


    Result = - - b;


    Document.write(result);


    Document.write(linebreak);


    // - - >


    < / script>


    Set the variables to a different value and try it yourself.


    </body>


    </html>


    Your output is going to be:


    A + b = 43


    A – b = 23


    A / b = 3.3


    A % b = 3


    A + b + c = 43Test


    ++a = 35


    -- b = 8


    ## Comparison


    *   Equal is going to be the value from two operands that will check to see if
    they are equal or not. If they are equal, then the condition is true.


    *   Not equal will check to see if the operands are equal, if they are not, then
    the condition is true.


    *   Greater than will say that the left value is going to be greater than the
    one found on the right and if it is, then the condition for it is true.


    *   Less than says that the left number should be less than that on the right
    and if it is, then it is true.


    *   Equal to or greater than will check to see if the left value is larger than
    or equal to the value found on the right. If it is, then it is true.


    *   Less than or equal to is going to state that the value on the left should
    be of lesser value or of equal value on the right and if it is found to be, then
    the condition is true.


    ### Example


    <html>


    <body>


    <script type = “text/javascript”>


    <! - - 


    Var a = 10;


    Var b = 20;


    Var linebreak = “<br />”;


    Document.write( “(a == b) => “);


    Result = ( a == b);


    Document.write(result);


    Document.write(linebreak);


    Document.write( “ (a < b) => “);


    Result = (a < b);


    Document.write(result);


    Document.write(linebreak);


    Document.write( “ (a > b) => “ );


    Result = (a > b);


    Document.write(result);


    Document.write(linebreak);


    Document.write ( “ (a != b) => “);


    Result = a != b);


    Document.write(result);


    Document.write(linebreak);


    Document.write( “ (a >= b) => “);


    Result = ( a >= b);


    Document.write(result);


    Document.write(linebreak);


    Document.write( “ (a <= b) => “);


    Result = (a <= b);


    Document.write(result);


    Document.write(linebreak);


    // - - >


    </script>


    </body>


    </html>


    The output for this example is going to be:


    (a == b) = false


    (a < b) = true


    (a > b) = false


    (a != b) = true


    (a >= b) = false


    (a <= b) = true


    ## Logical


    *   Logical AND states that both operands have to be non-zero. If they are then
    the condition is found to be true.


    *   Logical OR says that at least one of the operands has to be non-zero. If one
    is found to be non-zero, then it is a true statement.


    *   Logical NOT says that the logical state is going to be reversed based on the
    operands state. If the condition is true, then it will be false because of the
    logical NOT.


    ### Example


    <html>


    <body>


    <script type = “text/javascript”>


    <! - -


    Var a = true;


    Var b = false;


    Var linebreak = “<br />”;


    Document.write (“ (a && b) => “);


    Result = (a && b);


    Document.write(result);


    Document.write(linebreak);


    Document.write (“ (a || b) = > “);


    Result = (a || b);


    Document.write(result);


    Document.write(linebreak);


    Document.write( “! (a && b) => “);


    Result = (! (a && b));


    Document.write(result);


    Document.write(linebreak);


    // - - >


    </script>


    </body>


    </html>


    The results for this example is going to be:


    (a && b) = false


    (a || b) = true


    !(a && b) = true


    ## Bitwise


    *   Bitwise AND takes the Boolean value and the operation for every bit with the
    individual arguments.


    *   Bitwise OR takes the Boolean and it is performed or the operation of every
    integer is performed.


    *   Bitwise XOR is a Boolean exclusive and that is what will be performed or the
    operation for the integers. Either the operand on the right or the one on the
    left can be exclusively true, both cannot be.


    *   Bitwise not is a unary operation that is going to reverse all bits that can
    be found in the operand.


    *   A left shift is when the first operand moves to the left however many bits
    are in the second operand.


    *   A right shift is going to be a binary shift to the right the number of bits
    that is found in the right operand.


    *   A right shift with zero is going to make the operand move to the right but
    the bits on the left are always going to be zero.


    ### Example


    <html>


    <body>


    <script type = “text/javascript”>


    <! –


    Var a = 2; // bit is going to be presented as 10


    Var b = 3; // bit will be presented as 11


    Var linebreak = “<br />”;


    Document.write (“ (a & b => “);


    Result = (a & b);


    Document.write(result);


    Document.write(linebreak);


    Document.write (“ (a | b) => “);


    Result = ( a | b);


    Document.write(result);


    Document.write(linebreak);


    Document.write(“ (a ^ b) => “);


    Result = (a ^ b);


    Document.write(result);


    Document.write(linebreak);


    Document.write(“ (~b) => “);


    Result = (~b);


    Document.write(result);


    Document.write(linebreak);


    Document.write(“ (a << b) => “);


    Result (a << b);


    Document.write(result);


    Document.write(linebreak);


    Document.write(“ (a >> b) => “);


    Result = (a >> b);


    Document.write(result);


    Document.write(linebreak);


    //- - >


    </script>


    </body>


    </html>


    Results:


    (a & b) = 2


    (a | b) = 3


    (a ^ b) = 1


    (~b) = -4


    (a << b) = 16


    (a >> b) = 0


    ## Assignment


    *   Simple assignment will assign the value on the right to the left.


    *   Add and assign will take the right operand, add it to the left, and then assign
    it to the left.


    *   Subtract and assign is going to subtract the right value from the left and
    assign it to the left.


    *   Multiply and assign will multiply the operands together and then assign the
    value to the left.


    *   Divide and assign will divide the left from the right and assign the value
    to the left.


    *   Modulus and assign will take the modulus from both operands and assign the
    remaining value to the left.


    *   Bitwise operators are going to become <<=, >>=, &=, |= and ^=


    ### Example


    <html>


    <body>


    <script type = “text/javascript”>


    <! - -


    Var a = 33;


    Var b = 10;


    Var linebreak = “<br />”;


    Document.write(“value of a => (a = b) => “);


    Result = (a = b);


