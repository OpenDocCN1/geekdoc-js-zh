    ## Ternary


    Ternary operators are the operators that many programmers use. There are three
    operands for a ternary operator.


    ### Syntax


    Condition ? if-true-execute-this : if-false-execute-this;


    If the condition is right, then the statement will be before a colon in order
    to be executed. If the statement is returned false, the statement after the colon
    will be executed. A variety of statements cannot be used because JavaScript will
    not allow it. Multiples statements can be executed by using functions and naming
    that function should the condition be found true or false.


    ### Example


