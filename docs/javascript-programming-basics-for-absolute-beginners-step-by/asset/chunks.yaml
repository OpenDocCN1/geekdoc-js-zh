  raw: 'document.cookie = cname + “=” + cvalue + “;” + expires + “;path=/”;


    The parameters will name the cookie (cname) and then the value is going to be
    (cvalue) while the expiration date is going to be (exdays). The cookie is going
    to be set by stringing the name, value, and expiration date together in the string.


    ## Functions for Getting Cookies


    Whenever you create a function, the return is going to be for one specific cookie’s
    value.


    ### Example


    Function getCookie(cname) {


    Var name = cname +”=”


    Var ca = document.cookie.split(‘;’);


    For (var I = 0; I <ca.length; i++) {


    Var c = ca[i];


    While (c.charAt(o) == ‘ ‘) {


    C = c.substring(1);


    }


    If (c.indexOf(name) == 0 {


    Return c.substring(name.length, c.length);


    }


    }


    Return “”;


    }


    The name of the cookie will be considered the parameter. To create a variable,
    you will need the name and the text so that you can search properly using (cname
    + “=”.


    The document.cookie will be split with semicolons so that there is an array that
    is called ca. Loops through the ca array are going to read every value that has
    been provided. Once the cookie is found, the value is going to be returned. If
    it is not found, then your return is going to be return””.


    ## Checking Cookies


    After the cookie has been set, the greeting it was set to is going to be displayed.
    If it has not been set, then no greeting will be displayed but a prompt box will
    appear and ask for the user’s name so that it can store the cookie for up to a
    year with the setCookie function.


    ### Example


    Function checkCookie() {


    Var username = getCookie (“username”);


    If (username! = “”) {


    Alert( “Welcome again “ + username);


    } else {


    Username = prompt (“Please enter your name:” , “”);


    If (username != “” && username != null) {


    setCookie (“username”, username, 365);


    }


    }


    }


    ## All Together Now


    The following example is going to use checkCookie() when the page has loaded.


    ### Example


    Function setCookie( cname, cvalue, exdays) {


    Var d = new Date();


    d.setTime(d.getTime() + (exdays* 24 *60 *60 *1000));


    var expires = “expires=” +d.toUTCString();


    document.cookie = cname + “=” + cvalue + “;” + expires + “;path=/”;


    }


    Function getCookie(cname) {


    Var name = cname + “=”;


    Var ca = document.cookie.split(‘;’);


    For( var I = 0; I < ca.length; I++) {


    Var c = ca[i];


    While (c.charAt(0) == ‘ ‘) {


    C = c.substring(1);


    }


    If (c.indexOf(name) == 0) {


    Return c.substring(name.length, c.length);


    }


    }


    Return “”;


    }


    Function checkCookie() {


    Var user = getCookie(“username”);


    If (user != “”) {


    Alert (“Welcome again + user);


    } else {


    User = prompt (“Please enter your name:” , “”);


    If (user != “” && user != null) {


    setCookie( “username”, user, 365);


    }


    }


    }


    # What You Can and Cannot Do with JavaScript


    There are some things that you are going to be able to do with JavaScript. Just
    like any other program, there are going to be limitations as to what JavaScript
    is going to allow you to do.


    ## What Can I Do With JavaScript?


    *   Interact with forms


    *   Give feedback


    *   Detect what a user is doing


    *   Notify users of things


    *   Ask if something is correct or not


    *   Get the user to input data


    *   Validate a stopped script


    *   Conversions


    *   Calculations


    *   Add content to documents


    *   Work with pop-up windows


    *   Dom scripting


    *   Sign up forms


    *   Search boxes


    *   Constantly changing information


    *   Information for forms


    *   Layout issues


    *   Enhance HML interfaces


    *   Animate elements


    ## Things You Cannot Do With JavaScript


    *   Write files on a server without help


    *   Access databases


    *   Read or write on files from clients


    *   Close a window it did not open


    *   Access web pages in another domain


    *   Protect your pages source or images


    # Common Pitfalls


    *   Confusing the equals operator ( = =) and the does not equal operator ( !=).


    *   Confusing the strict equals operator ( = = =) and the strict does not equals
    operator ( ! = =).


    *   There are two types of operators because of JavaScript’s premise of true and
    false statements.


    *   ==/ != works when you expect the operands to be the same type, if they aren’t
    these operators will try to force them to be.


    *   Truthy and falsy values  are for non-Boolean expressions  by pretending they
    are Boolean.


    *   These values will be evaluated as false: NaN, False, Null, 0, Empty string
    (“”).


    *   === and !== are better to use than == and !=.


    *   NaN is not a number that is only helpful in edge cases.


    *   If you have to use NaN use isNan().


    *   Eval() is a function that tries to do everything.


    *   Script is going to need to be allowed to run dynamically.


    *   Eval() can be used for JSON.


    *   However, try and stay away from eval().


    *   JavaScript may be dynamic, but it has to be organized for maintenance experience.


    # Tips and Tricks


    ### Don’t forget the var keyword when assigning values


    Assignments can be undeclared variables that get results thanks to a global variable
    that is created to avoid global variables.


    ### Use = = = not = =


    == and != is going to perform an automatic conversion if it is needed. === and
    !== cannot perform conversions. It will however compare types and values faster
    than ==.


    ### Null, 0, false, undefined, NaN and empty string (“”) are all falsy


    ### Use a semicolon for the termination of a line


    Semicolons are a good way to practice line terminations. In many problems, it
    is inserted by JavaScript parser.


    ### Create object constructors


    Function Person(firstName, lastName) {


    This. firstName = firstName;


    This. lastName = lastName;


    }


    Var Nathan = new Person(“Nathan”, “Clark”) ;


    ### Be careful as you use instance of, constructor, and typeof


    Typeof is a unary operator that returns strings to represent primitive variable
    types. Typeof null is going to return “object” for many object types.


    Constructor is the property of internal prototype property. It can be written
    over by code.


    Instanceof will check the chain from the constructor to see if it is going to
    be returned true or false.


    ### Create functions that are self-calling


    Also known as a self-invoked anonymous function or immediately invoked function
    expression, the function will automatically execute when it is created.


    ### Get random items from arrays


    Var items = [12, 548, ‘a’, 2, 5478, ‘foo’8852, ‘Doe’, 2145, 119];


    Var randomItem = items [Math.floor (Math . random() * items. Length)];


    ### Get random numbers in a particular range


    This code is useful when you are trying to create false data for testing reasons
    like a salary that is between two sets of numbers.


    Var x = Math.floor (Math.random() * (max – min + 1)) + min;


    ### Generate an array of numbers with numbers from 0 to max


    Var numbersArray = [] * (max – min +1)) + min;


    For( var I = 1; numbersArray.push (i++) < max;) ; // numbers = [1, 2, 3 …100]


    ### Generate random sets of alphanumeric characters


    Function generateRandomAlphaNum (len) {


    Var rdmString = “”;


    For( ; rdmString.length < len; rdmString += Math.random() .toString(36). Substr
    (2)) ;


    Return rdmString.substr (0, len);


    }


    ### Shuffle arrays of numbers


    The better option is to implement random sort orders by their code by using native
    JavaScript sort functions.


    ### String trim functions


    A trim function that is classic from JavaScript and other programming languages
    that remove any whitespace from the string that is not going to happen in JavaScript
    so it can be tacked to a string object. Native implementations of trim() function
    is used in more current JavaScript engines.


    ### Append to arrays from different arrays


    Var array1 = [12, “foo”, {name “Joe”} , -2458];


    Var array2 = {“Doe” , 555, 100};


    Array.prototype.push.apply (array1, array2) ;


    /*array1 will be equal to [12, “foo”, {name “Joe”}, -2458, “Doe”, 555, 100]


    ### Turn argument objects into arrays


    Var argArray = Array.prototype.slice.call(arguments) ;


    ### Verify given arguments with a number


    Function isNumber(n) {


    Return !isNaN(parseFloat (n)) && isFinite(n);


