    Variables are boxes with a name tied to it. Variables store values. Your box’s
    name is going to be the name of the variable. The contents of the box will pertain
    to the variable. It is much like the memory of a computer where information is
    put on the memory like the contents are put on the variables. Variables will refer
    to the name you give it.


    ### Example


    ```html

    <html>

    <head>

    <title> My Javascript Page </title>

    </head>

    <body>

    <script>

    Myname = “Susann” ;

    Document.write(myname) ;

    </script>

    </body>

    </html>

    ```


    The text that you want to be stored on a variable will need to be in a set of
    quotes. This is going to allow the program to know the difference between a variable
    and normal text.


    ### Example


    ```html

    <html>

    <head>

    <title> My Javascript Page </title>

    </head>

    <body>

    <script>

    Susann = “my first name” ;

    Myname = Susann ;

    Document.write (myname) ;

    </script>

    </body>

    </html>

    ```


    The output is:


    *   `Susan` is the variable

    *   It is located in the `myname` variable

    *   The `myname` is going to be placed in the document

