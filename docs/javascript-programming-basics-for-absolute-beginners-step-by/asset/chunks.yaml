    \n# Operators in JavaScript\n\nExpressions are going to have operators and operands.\
    \ Operands are the numbers that are used in the expression and the operator is\
    \ the arithmetic sign. The types of operators supported by JavaScript are:\n\n\
    * Arithmetic\n* Comparison\n* Logical\n* Bitwise\n* Assignment\n* Conditional\n\
    * Typeof\n\n## Arithmetic\n\n* Addition where the operands are added together.\n\
