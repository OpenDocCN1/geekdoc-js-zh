    ## Values Assigned to Variables


    The most common way for a value to be assigned to a variable is going to be an
    equals sign.


    ## Operators


    Operators like `++` and `--` will be ones that you are most likely not going to
    want to use. You can use other operators to do the exact same job as these operators.
    But, they are going to make typing out your code faster, so many programmers use
    them so that their coding goes quicker. The operator `++` will increase by an
    increment of one. `--` will decrease by an increment of one. The percentage sign
    is going to return the modulus of the remainder of two numbers that have been
    divided.


    ## Variables Compared


    There are multiple ways you can compare variables. The simplest way is double
    equals sign. When you forget do not use double equals, you are not going to be
    comparing variables. The variable that is listed on the left is going to be assigned
    to the value that is listed on the right.


