    ## Conditional


    *   The conditional operator will evaluate the expression for a true or false
    value before the statements are executed depending on what the result is once
    it has been evaluated.


    *   Conditional statements will be true if the condition is true, then the statement’s
    value is going to be x. if it is not, then you will move on to the other statement.


    ### Example


    <html>


    <body>


    <script type = “text/javascript”>


    <! - -


    Var a = 10;


    Var b = 20;


    Var linebreak = “<br />”;


    Document.write (“ ((a >b) ? 100 : 200) => “);


    Result = (a > b) ? 100 : 200;


    Document.write(result);


    Document.write(linebreak);


    Document.write (“ (( a < b) ? 100 : 200) => “);


    Result = (a < b) ? 100 : 200;


    Document.write(result);


    Document.write(linebreak);


    // - - >


    </script>


    </body>


    </html>


    The results are:


    (( a > ) ? 100 : 200 => 200


    ((a < b) ? 100 : 200 => 100


    ## Typeof


    *   Typeof operators are unary operators. It is placed before a single operand.
    The operand can be any type.


    *   The value will become a string that is going to show the data types that have
    been used.


    *   Typeof operators evaluate strings, numbers, and Boolean only if the value
    is true or false based on the evaluation of them.


    *   These are the values that are returned with typeof operators: Number = number,
    Object = object, Null = object, String = string, Function = function, Undefined
    = undefined.


    ### Example


    <html>


    <body>


    <script type “text/javascript”>


    <! - -


    Var a = 10


    Var b = “String”;


    Var linebreak = “<br />”;


    Result = (typeof b == “string” ? “B is String” : “B is Numeric”);


    Document.write( “Result => “);


    Document.write(result);


    Document.write(linebreak);


    Result = (typeof a == “string” ? “A is String” : “A is Numeric”);


    Document.write(“result => “);


    Document.write(result);


    Document.write(linebreak);


    // - ->


    </script>


    </body>


    </html>


    Results:


    Result => B is String


    Result => A is Numeric


    # Page Printing with JavaScript


    You may find that you want a button that allows you to print the page’s contents
    to an actual printer. JavaScript has a function that makes this possible. The
    window.print() function is going to print whatever page you are currently viewing.
    This function is also considered an onclick event.


    ### Example


    <html>


    <head>


    <script type = “text/javascript”>


    <! - -


    // - - >


    </script>


    </head>


    <body>


    <form>


    <input type = “button” value = “Print” onclick = “window.print()” />


    </form>


    </body>


    <html>


    This is going to aide you in getting a printout of what you were looking at, but
    it is not recommended to use when you want to print a page. There is a printer
    friendly page that will not have any images such as the ads that usually appear
    on the sides of web pages.


    In order to make a page printer friendly, you need to:


    *   Make a copy of the text on the page without any of the images that you do
    not want.


    *   If you do not want extra copies then you are going to need to make the printable
    text with the appropriate comments.


    *   <! – PRINT STARTS HERE - - > <! - - PRINT ENDS HERE - - >


    If those steps do not work, then use the toolbar on the browser to print the page.
    The file path is file – print – okay


