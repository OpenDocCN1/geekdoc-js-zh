    Document.write (“Value of a => (a %= b) => “);

    Result = (a %= b);

    Document.write(result);

    Document.write(linebreak);

    ```


    输出:

    ```

    Value of a => (a =b) = 10

    Value of a => (a += b) = 20

    Value of a => (a -=b) = 10

    Value of a => (a *= b) = 100

    Value of a => ( a /= b) = 10

    Value of a => (a %= b) = 0

    ```


    ## 条件判断


    - 条件运算符会在语句执行之前对表达式进行求值以得到真或假值，具体的执行语句取决于求值的结果。

    - 如果条件为真，则语句的值将是 x；如果不是，则你将移动到另一个语句。


    ### 示例


    ```html

    <html>

    <body>

    <script type = “text/javascript”>

    <! - -

    Var a = 10;

    Var b = 20;

    Var linebreak = “<br />”;

    Document.write (“ ((a >b) ? 100 : 200) => “);

    Result = (a > b) ? 100 : 200;

    Document.write(result);

    Document.write(linebreak);

    Document.write (“ (( a < b) ? 100 : 200) => “);

    Result = (a < b) ? 100 : 200;

    Document.write(result);

    Document.write(linebreak);

    // - - >

    </script>

    </body>

    </html>

    ```


    结果如下：

    ```

    (( a > ) ? 100 : 200 => 200

    ((a < b) ? 100 : 200 => 100

    ```


    ## Typeof


    - `Typeof` 运算符是一一元运算符。它位于单个操作数之前。操作数可以是任何类型。

    - 结果将变成一个字符串，显示所使用的数据类型。

    - 只有当根据求值结果为真或假时，`Typeof` 运算符才会评估字符串、数字和布尔值。

    - 使用 `typeof` 运算符返回的值：`Number = number`、`Object = object`、`Null = object`、`String
    = string`、`Function = function`、`Undefined = undefined`。


    ### 示例


    ```html

    <html>

    <body>

    <script type “text/javascript”>

    <! - -

    Var a = 10

    Var b = “String”;

    Var linebreak = “<br />”;

    Result = (typeof b == “string” ? “B is String” : “B is Numeric”);

    Document.write( “Result => “);

    Document.write(result);

    Document.write(linebreak);

    Result = (typeof a == “string” ? “A is String” : “A is Numeric”);

    Document.write(“result => “);

    Document.write(result);

    Document.write(linebreak);

    // - ->

    </script>

    </body>

    </html>

    ```


    结果：

    ```

    Result => B is String

    Result => A is Numeric

    ```


    # 使用 JavaScript 打印页面


    你可能需要一个允许将页面内容打印到实际打印机的按钮。JavaScript 有一个可以实现此点的函数。`window.print()` 函数将打印你当前查看的任何页面。此函数也被认为是一个
    `onclick` 事件。


    ### 示例


    ```html

    <html>

    <head>

    <script type = “text/javascript”>

    <! - -

    // - - >

    </script>

    </head>

    <body>

    <form>

    <input type = “button” value = “Print” onclick = “window.print()” />

    </form>

    </body>

    </html>

    ```


    这可以帮助你获取你正在查看内容的打印副本，但当你想要打印页面时，并不建议使用它。有一个打印友好的页面，它不会包含通常出现在网页侧边缘的广告等图像。


    为了使页面适用于打印，你需要：

    - 复制页面上的文本，且不包含任何你不想要的图片。

    - 如果你不需要额外的副本，则需要使用适当的注释制作可打印的文本。

    - `<! – PRINT STARTS HERE - - > <! - - PRINT ENDS HERE - - >`


    如果这些步骤不起，请使用浏览器上的工具栏打印页面。文件路径为 `file – print – okay`


