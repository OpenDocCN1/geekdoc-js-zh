    \ 将等于 [12, 222, 1000, 124]`\n\n### 在条件判断中使用 AND/ OR 逻辑\n\n逻辑 OR 也用于为函数参数中的函数设置默认值。\n\
    \n### 使用 map() 函数循环遍历数组项\n\n`Var squares = [1,2,3]. Map(function (val) {`\n\n\
    `Return val*val`\n\n`)) ;\n//squares 将等于 [1, 4, 9]`\n\n### 将数字舍入到小数位\n\n`Var num\
