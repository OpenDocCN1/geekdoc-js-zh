    # What is JavaScript?


    One of the languages that is used in programming is JavaScript. Many times it
    is used to design webpages so they have the ability to be interactive with users.
    The user’s computer is going to run JavaScript without any content needing to
    be downloaded. A lot of the time, JavaScript can be used in creating quizzes and
    polls.


    As a high-level program, JavaScript is dynamic, untyped, and interpreted. Out
    of all the content that you typically see online, it is created with JavaScript
    or two other technologies. Many major web browsers, email servers, and website
    run on JavaScript code.


    JavaScript contains first class functions that are a prototype which makes it
    a multi-paradigm language with the ability to support programming styles that
    are object oriented. The API is used for when you are working with text, regular
    expressions, and dates. But, this is not going to include any input or output
    when it comes to storage or networking.


    JavaScript is not Java! There are going to be similarities between the two programs,
    but they are two very different programs that are going to influence how a program
    works in different ways.


    JavaScript is not limited to creating things that go online. You are also going
    to have the ability create PDF files, browsers that are site specific, and widgets
    that can be used on your desktop. Thanks to the new JavaScript platforms, the
    new virtual machines that you see are faster. Because of the new virtual machines,
    JavaScript has increased in popularity on the server site.


    On the client side of things, JavaScript is going to be an interpreted language
    similar to Python. The browsers that have come out recently are going to perform
    on JavaScript as a just in time compilation.


    Taking JavaScript a step further, it can be used to make mobile applications,
    desktops, and games. You are also going to be able to create a network that works
    side by side with the server to use runtime environments.


