    # 什么是 JavaScript?


    编程中使用的语言之一是 JavaScript。它经常被用于设计网页，使其能够与用户进行交互。用户的计算机无需下载任何内容即可运行 JavaScript。很多时候，JavaScript
    可以用于创建测验和投票。


    作为一种高级程序，JavaScript 是动态的、无类型的且解释型的。在你通常在网上看到的所有内容中，是用 JavaScript 或另外两种技术创建的。许多主流浏览器、电子邮件服务器和网站都运行在
    JavaScript 代码上。


    JavaScript 包含原型的一等函数，这使其成为一种多范式语言。


