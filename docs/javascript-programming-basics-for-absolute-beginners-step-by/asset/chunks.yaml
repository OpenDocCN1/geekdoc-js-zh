    operators that you learned when you were in elementary school in JavaScript:


    *   `==` equaled to

    *   `!=` not equaled to

    *   `<` less than

    *   `>` greater than

    *   `<=` equal to or less than

    *   `=` equal to or greater than


    # Functions in JavaScript


    Functions in JavaScript will be blocked in a code that is designed to operate
    a specific task. Functions will be used to execute whenever it has been invoked
    or called upon.


    ### Example


    ```javascript

    Function myFunction(p1, p2) {

    Return p1 * p2;

    // you function is going to return the product of p1 and p2

    }

    ```


    ## Function Syntax


    The function will be defined by a keyword `function`. The name is followed by
    a set of parentheses. Names will have digits, underscores, letters, and dollar
    signs. They follow the same rules variables use. The parentheses will have parameter
    names that are separated by the use of a comma. All the code that is to be performed
    will be in curly brackets.


    ### Example


    ```javascript

    Functionname(parameter1, parameter2, parameter3) {

    Code to be executed

    }

    ```


    Parameters will be names already in the definition function. Arguments are going
    to contain real values that the function has accepted when it has been invoked.
    The arguments will behave like local variables.


    ## Invocation


    When a code is put into a function, it will be used after it has been invoked.
    The code is invoked when:


    *   It is invoked from the script

    *   An event occurs like when a button has been clicked.

    *   It is self-invoked


    ## Returns


    The code will come to a statement that has been returned which will mean that
    it is going to stop functioning. The code is going to be invoked when the statement
    is returned to an executed code that comes after a statement has been invoked.
    The function will evaluate a returned value. The returned value is going to be
    returned to the original caller.


    ### Example


    ```javascript

    Var x = myFunction (4, 3); //this function has been called upon and is going to
    be returned with the value being x.


    Function myFunction(a, b) {

    Return a * b; //function returns the product of a times be

    }

    ```


    `X` is going to be `12` which is going to be your output.


    ## Why Functions?


    Functions are going to enable codes to be reused. Codes will be defined once and
    then it can be used multiple times over. The same code will be used with different
    arguments to get different results.


    ### Example


    ```javascript

    Function toCelsius (Fahrenheit) {

    Return ( 5/9) * (Fahrenheit -32);

    }


    Document.getElementById(“demo”).innerHTML = toCelsius(77);

    ```


    ## Parentheses Operator


    To access a function without using parentheses, you are going to get a definition
    returned.


    ### Example


    ```javascript

    Function toCelsius( Fahrenheit) {

    Return ( 5/9) * (Fahrenheit – 32);

    }


    Document.getElementById(“demo”). innerHTML = toCelsius;

    ```


    ## Variable Values in Functions


    Functions can be used like a variable is used. They are going to be used in formulas,
