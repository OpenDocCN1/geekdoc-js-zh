    to be checked less than how many choices have been selected. If it is successful,
    then the comment and the variable I are going to increase by one each time it
    passes through the loop.


    ### Example


    <script type = “text/javascript”>


    Function howMany (selectItem) {


    Var numberSelected = 0


    For (var I = 0; I < selectItem.options.length; i++) {


    If (selectedItem.options[i] . selected == true)


    numberSelected++;


    }


    Return numberSelected


    }


    </script>


    <form name = “selectForm”>


