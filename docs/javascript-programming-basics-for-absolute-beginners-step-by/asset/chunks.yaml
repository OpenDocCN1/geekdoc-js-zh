    ## Switches


    Switch statements will do the same thing as the else if statement. The switch
    statement will be used when there are multiple conditions. Switch statements are
    used to perform better than an else if statement.


    ### Syntax


    Switch(expression)


    {


    Case value -1: statements; break;


    Case value -2: statements; break;


    Case value 3: statements; break;


    ….


    Case value-n: statements; break;


    Default: statements; break;


    }


    A switch statement will assess the statement to check and see if it matches any
    cases. If it matches, then the statement that is inside the case will be executed
    before being followed by a break statement. Break statements make it to where
    no other case statements are executed.


    If an expression cannot be matched to a case value, then the default case is going
    to be the one executed. It does not matter what kind of statement is in the case.
    Curly brackets do not have to be used. Break statements will be omitted if the
    default construction is the last statement that is found in the switch.


    ### Example


    <script>


    Var a = 8


    Switch(a)


    {


    Case 1: document.write(“one”); break;


    Case 2: document.write( “two”); break;


    Case 3: document.write( “three”); break;


    Case 4: document.write( “four”); break;


    Case 5: document.write( “five”); break;


    Default: document.write(“number not found”);


    }


    // outputs five


    </script>


    Case values are able to be strings, characters, and numbers.


    ### Example


