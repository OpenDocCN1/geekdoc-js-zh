  trans: "\n\n`document.cookie = cname + “=” + cvalue + “;” + expires + “;path=/”;`\n\
    \n这些参数将定义 cookie 的名称 (`cname`)，值将是 (`cvalue`)，而过期日期将是 (`exdays`)。cookie 将通过将名称、值和过期日期拼接成字符串来设置。\n\
    \n## 获取 Cookie 的函数\n\n每当你创建一个函数时，返回值将是特定 cookie 的值。\n\n### 示例\n\n```javascript\n\
    Function getCookie(cname) {\n  Var name = cname +”=”\n  Var ca = document.cookie.split(‘;’);\n\
    \  For (var I = 0; i <ca.length; i++) {\n    Var c = ca[i];\n    While (c.charAt(o)\
    \ == ‘ ‘) {\n      C = c.substring(1);\n    }\n    If (c.indexOf(name) == 0) {\n\
    \      Return c.substring(name.length, c.length);\n    }\n  }\n  Return “”;\n\
    }\n```\n\ncookie 的名称将被视为参数。为了创建一个变量，你需要名称和文本，以便能够使用 (`cname + “=”`) 进行正确搜索。\n\n\
    `document.cookie` 将通过分号进行分割，得到一个名为 `ca` 的数组。遍历 `ca` 数组将读取提供的每个值。一旦找到 cookie，将返回该值。如果没有找到，则返回\
    \ `\"\"`。\n\n## 检查 Cookie\n\n在设置 cookie 后，将显示设置时对应的问候语。如果尚未设置，则不会显示问候语，但会弹出一个提示框询问用户的名称，以便使用\
    \ `setCookie` 函数将 cookie 保存长达。\n\n### 示例\n\n```javascript\nFunction checkCookie()\
    \ {\n  Var username = getCookie (“username”);\n  If (username! = “”) {\n    Alert(\
    \ “Welcome again “ + username);\n  } else {\n    Username = prompt (“Please enter\
    \ your name:” , “”);\n    If (username != “” && username != null) {\n      setCookie\
    \ (“username”, username, 365);\n    }\n  }\n}\n```\n\n## 整合在一起\n\n下面的示例将在页面加载时使用\
    \ `checkCookie()`。\n\n### 示例\n\n```javascript\nFunction setCookie( cname, cvalue,\
    \ exdays) {\n  Var d = new Date();\n  d.setTime(d.getTime() + (exdays* 24 *60\
    \ *60 *1000));\n  var expires = “expires=”+d.toUTCString();\n  document.cookie\
    \ = cname + “=” + cvalue + “;” + expires + “;path=/”;\n}\n\nFunction getCookie(cname)\
    \ {\n  Var name = cname + “=”;\n  Var ca = document.cookie.split(‘;’);\n  For(\
    \ var I = 0; I < ca.length; I++) {\n    Var c = ca[i];\n    While (c.charAt(0)\
    \ == ‘ ‘) {\n      C = c.substring(1);\n    }\n    If (c.indexOf(name) == 0) {\n\
    \      Return c.substring(name.length, c.length);\n    }\n  }\n  Return “”;\n\
    }\n\nFunction checkCookie() {\n  Var user = getCookie(“username”);\n  If (user\
    \ != “”) {\n    Alert (“Welcome again + user);\n  } else {\n    User = prompt\
    \ (“Please enter your name:” , “”);\n    If (user != “” && user != null) {\n \
    \     setCookie( “username”, user, 365);\n    }\n  }\n}\n```\n\n# 你用 JavaScript\
    \ 可以做什么和不能做什么\n\n有些事情你可以用 JavaScript 来的。就像任何其他程序一样，JavaScript 允许你做的事情是有限制的。\n\n\
    ## 用 JavaScript 可以做什么？\n\n* 与表单交互\n* 提供反馈\n* 检测用户正在做什么\n* 通知用户某些事项\n* 询问某事是否正确\n\
    * 让用户输入数据\n* 验证停止的脚本\n* 转换\n* 计算\n* 为文档添加内容\n* 弹出窗口操作\n* DOM 脚本编写\n* 注册表单\n* 搜索框\n\
    * 不断变化的信息\n* 表单信息\n* 布局问题\n* 增强 HTML 界面\n* 元素动画\n\n## 你用 JavaScript 不能做什么\n\n\
    * 在没有帮助的情况下在服务器上写文件\n* 访问数据库\n* 从客户端读取或写入文件\n* 关闭它未打开的窗口\n* 访问另一个域的网页\n* 保护页面源码或图像\n\
    \n# 常见陷阱\n\n* 混淆相等运算符 (`==`) 和不等于运算符 (`!=`)。\n* 混淆严格相等运算符 (`===`) 和严格不等于运算符 (`!==`)。\n\
    * 因为 JavaScript 基于真假陈述，所以存在两种运算符。\n* 当你期望操作数类型相同时，`==` / `!=` 可以工作；如果它们类型不同，这些运算符将尝试强制它们转换。\n\
    * 真值（Truthy）和假值（Falsy）是为了假装成布尔值的非布尔表达式设计的。\n* 这些值将被评估为假：`NaN`、`False`、`Null`、`0`、空字符串\
    \ (`\"\"`)。\n* `===` 和 `!==` 比 `==` 和 `!=` 更好。\n* `NaN` 不是数字，只在边缘情况下有用。\n* 如果你必须...\n\
    \n# 技巧与窍门\n\n### 从不同数组追加元素\n更好的选项是通过代码使用原生 JavaScript 排序函数来实现随机排序。\n\n### 字符串修剪函数\n\
    \nJavaScript 和其他编程语言中经典的修剪函数，用于移除字符串中 JavaScript 不会发生的空白字符，以便可以附加到字符串对象上。现代 JavaScript\
    \ 引擎使用了原生的 `trim()` 函数。\n\n"
- fmt: "\n### Verify that a given argument is an array\n\nNote: if the `toString()`\
    \ method is written over. You are not going to receive the results you expect\
    \ by using this trick. You are also able to execute `instanceof` if you do not\
    \ work with several frames. But, if you have various contexts, you are going to\
    \ get the wrong result.\n\n### Get the max and min in an array of numbers\n\n\
    `Var numbers = [5, 458, 120, -215, 228, 400, 122205, -85411];`\n\n`varmaxInNumbers\
    \ = Math.max.apply (Math, numbers) ;`\n\n`var minInNumbers = Math.min.apply (Math,\
    \ numbers) ;`\n\n### Empty an array\n\n`Var myArray = [12, 222, 1000 ];`\n\n`myArray.length\
    \ = 0; //myArray will be equal to[]`\n\n### Do not delete to remove items from\
    \ arrays\n\nUse the `splice` function instead of the `delete` function if you\
    \ want to remove items from an array. When you use the `delete` function, it is\
    \ going to replace the item with an `undefined` variable instead of deleting it\
    \ from the array.\n\n### Truncate arrays by using length\n\n`Var myArray = [12,\
    \ 222, 1000, 124, 98, 10];`\n\n`myArray.length = 4; //myArray will be equal to\
    \ [12, 222, 1000, 124]`\n\n### Use logic of AND/ OR for conditions\n\nLogical\
    \ OR is also going to be used in setting a default value for function in an argument.\n\
    \n### Use map() functions to loop through an array’s item.\n\n`Var squares = [1,2,3].\
    \ Map(function (val) {`\n\n`Return val*val`\n\n`)) ;\n//squares will be equal\
    \ to [1, 4, 9]`\n\n### Rounding a number to decimal place\n\n`Var num = 2.4432432;`\n\
    \n`Num = num.toFixed(4); //num will be equal to 2.4432`\n\nThe `toFixed()` function\
    \ is going to return a string instead of number.\n\n### Floating point problems\n\
    \n`0.1+0.2` is going to equal `0.3000000000000004`. The knowledge that you need\
    \ to know is that all the numbers in JavaScript are floating points that are represented\
    \ by 64 bit internally.\n\n### Check the properties of an object when used in\
    \ for-in loop\n\nThe code snippet is going to help avoid iterating through the\
    \ properties of objects.\n\n`For (var name in object) {`\n\n`If (object.hasOwnProperty(name))\
    \ {`\n\n`// do something with name`\n\n`}`\n\n### Comma operator\n\n`Var a = 0;`\n\
    \n`Var b = (a++, 99) ;`\n\n`Console.log(a); // a is going to equal to 0`\n\n`Console.log(b);\
    \ // be is going to equal to 99`\n\n### Cache variables that have to be calculated\
    \ or queried\n\nThe jQuery selector is going to cache the DOM element\n\n`Var\
    \ navright = document.querySelector('#right');`\n\n`Var navleft = document.querySelector('#left');`\n\
    \n`Var navup = document.querySelector('#up');`\n\n`Var navdown = document.querySelector('#down');`\n\
    \n### Verify arguments before passing it to isFinite()\n\n`isFinite(0) ; // false`\n\
    \n`isFinite(\"10\") //true`\n\n### Stay away from negative indexes in arrays\n\
    \n`Var numbersArray = [1, 2, 3, 4, 5];`\n\n`Var from = numbersArray.indexOf(\"\
    foo\"); //from is equal to -1`\n\n`numbersArray.splice(from,2); //will return\
    \ [5] Any arguments that pass through `splice` should not be negative.`\n\n# Loops\n\
    \nWhen an operation is repeated, it is considered to be a loop. Loops have several\
    \ instructions that considered in continuing with the same code block until the\
    \ condition has returned as true or false depending on which one is needed. To\
    \ govern loops, you have to have a variable that is going to increase or decrease\
    \ each time that a loop is repeated. There are two loop types used in JavaScript.\
    \ `For` loops and `while` loops. Statements will be executed at their best when\
    \ they have been used in a loop. If you use `break`, you can `continue` the statement\
    \ inside the loop.\n\n## For Loop\n\n`For` loops are going to be executed until\
    \ the condition returns as false. The syntax is the same as every programming\
    \ language. There are three arguments with `for` loop\n\n```\nFor (initialization;\
    \ condition; increment)\n{\n    // statements\n}\n```\n\nLoop statements can only\
    \ be executed if:\n- The statement and the control go to step two.\n- The equation\
    \ is performed and the condition is true. Then the statement will be carried out\
    \ if the value is false and the loop will then terminated.\n- The expression at\
    \ the beginning is executed. This will initialize one or several different loops\
    \ as they move through the syntax to allow expressions from various complexities\
    \ and degrees.\n- The increment definition is removed, updated, or executed.\n\
    \n### Example\n\n```html\n<script type=\"text/javascript\">\nDocument.write(\"\
    <h1>Multiplication table</h1>\");\nDocument.write(\"<table border=2 width=50%\"\
    );\nFor (var I = 1; I <=9;i++) { //this is the outer loop\nDocument.write(\"<tr>\"\
    );\nDocument.write(\"<td>\" +I + \"</td>\");\nFor (var j = 2; j <= 9; j++) { //\
    \ inner loop\nDocument.write (\"<td>\" +I *j + \"</td>\");\n}\nDocument.write(\"\
    </tr>\");\n}\nDocument.write(\"</table>\");\n</script>\n```\n\nThe example below\
    \ will have a `for` statement that is going to count the number of options that\
    \ have been selected in the list. The `for` statement is going to declare any\
    \ variables of `I` and initialize them to zero. The `I` variable is going to be\
    \ checked less than how many choices have been selected. If it is successful,\
    \ then the comment and the variable `I` are going to increase by one each time\
    \ it passes through the loop.\n\n### Example\n\n```javascript\n<script type=\"\
    text/javascript\">\nFunction howMany (selectItem) {\nVar numberSelected = 0;\n\
    For (var I = 0; I < selectItem.options.length; i++) {\n    If (selectItem.options[i]\
    \ . selected == true)\n    numberSelected++;\n}\nReturn numberSelected\n}\n</script>\n\
    <form name=\"selectForm\">\n<p>Choose some book types, then click the button below:\
    \ </p>\n<select multiple name=\"bookTypes\" size=\"8\">\n<option selected>Classic</option>\n\
    <option>Information Books</option>\n<option>Fantasy</option>\n<option>Mystery</option>\n\
    <option>Poetry</option>\n<option>Humor</option>\n<option>Biography</option>\n\
    <option>Fiction</option>\n</select>\n<input type=\"button\" value=\"How many are\
    \ selected?\"\nOnclick=\"alert ('Name of options selected: ' + howMany(document.selectForm.bookTypes))\"\
    >\n</form>\n```\n\nHowever many books the user selected will be the output.\n\n\
    ## While Loops\n\nWhile loops is a loop that is commonly found in JavaScript,\
    \ but it is not the most common. The `while` statement will repeat its loop until\
    \ the condition is found to be true. If the condition is false, then the statement\
    \ will stop and the control is going to be passed to the statement that follows\
