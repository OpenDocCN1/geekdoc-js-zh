    “>


    </form>


    However many books the user selected will be the output. For each user, the output
    is going to be different. But, the output will always be somewhere between zero
    and eight for this example.


    ## While Loops


    While loops is a loop that is commonly found in JavaScript, but it is not the
    most common. The while statement will repeat its loop until the condition is found
    to be true. If the condition is false, then the statement will stop and the control
    is going to be passed to the statement that follows the loop.


    ### Syntax


    While (condition)


    {


    // statements


    }


    The following example is going to show how to define a loop that begins with a
    variable of I = 0 so that it will continue to run until the I variable is more
    than 10\. Every statement that passes through the loop, I is going to increase
    by one.


    ### Example


    <script type = “text/javascript”>


    Var I = o;


    While (i<=10) // output from the value from 0 to 10


    {


    Document.write(I + “<br>”)


    I++;


    }


    </script>


    No matter what loop you are currently writing, you need to ensure that the conditions
    are going to eventually turn out to be false. If this does not happen, then the
    loop will never terminate and it will go on forever.


    ## Break and Continue


    Sometimes loops may start without any constraints by a true/false condition. But,
    the statements that are located inside of the brackets are going to decide when
    it is time to exit the loop. Two statements can be found inside of a loop, the
    break statement and the continue statement.


    Continue statement is going to stop the statement block for any for or while loops
    before continuing the loop at the next starting point. Break statements are going
    to stop the while or for loop before continuing with the script that trails the
    loop should there be any.


