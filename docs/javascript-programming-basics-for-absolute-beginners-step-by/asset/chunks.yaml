    \n// Set variables to a different value and try yourself.\n</body>\n</html>\n\
    ```\n\nYour output is going to be:\na = 43\nb = 23\nc = 34\nb = 3\n++a = 35\n\
    --b = 8\n\n## Comparison\n\n* Equal is going to be the value from two operands\
    \ that will check to see if they are equal or not. If they are equal, then the\
    \ condition is true.\n* Not equal will check to see if the operands are equal,\
    \ if they are not, then the condition is true.\n* Greater than will say that the\
    \ left value is going to be greater than the one on the right and if it is, then\
    \ the condition for it is true.\n* Less than says that the left number should\
    \ be less than that the right and if it is, then it is true.\n* Equal or greater\
    \ than will check to see if the left value is larger or equal to the value found\
    \ on the right. If it is, then it is true.\n* Less than equal to is going to state\
    \ that the value on the left should be lesser value or equal value the right and\
    \ if it is found to be, the condition is true.\n\n### Example\n\n```html\n<html>\n\
    <body>\n<script type = “text/javascript”>\n<! - -\nVar a = 10;\nVar b = 20;\n\
    Var linebreak = “<br />”;\n\nDocument.write((a == b) => “);\nResult = (a == b);\n\
    Document.write(result);\nDocument.write(linebreak);\n\nDocument.write( (a < b)\
    \ => “);\nResult = (a < b);\nDocument.write(result);\nDocument.write(linebreak);\n\
    \nDocument.write( (a > b) => “ );\nResult = (a > b);\nDocument.write(result);\n\
    Document.write(linebreak);\n\nDocument.write (a != b) => “);\nResult = a != b);\n\
    Document.write(result);\nDocument.write(linebreak);\n\nDocument.write( (a >= b)\
    \ => “);\nResult = (a >= b);\nDocument.write(result);\nDocument.write(linebreak);\n\
    \nDocument.write( (a <= b) => “);\nResult = (a <= b);\nDocument.write(result);\n\
    Document.write(linebreak);\n</script>\n</body>\n</html>\n```\n\nThe output for\
    \ this example is going to be:\na == b = false\na < b = true\na > b = false\n\
    a != b = true\na >= b = false\na <= b = true\n\n## Logical\n\n* Logical AND states\
    \ that both operands have to be non-zero. If they are then the condition is found\
    \ to be true.\n* Logical OR says that at least one of the operands has to be non-zero.\
    \ If one is found to be non-zero, then it is a true statement.\n* Logical NOT\
    \ says that the logical state is going to be reversed based on the operands state.\
    \ If the condition is true, then it will be false because of the NOT.\n\n### Example\n\
    \n```html\n<html>\n<body>\n<script type = “text/javascript”>\n<! - -\nVar a =\
    \ true;\nVar b = false;\nVar linebreak = “<br />”;\n\nDocument.write (“ (a &&\
    \ b) => “);\nResult = (a && b);\nDocument.write(result);\nDocument.write(linebreak);\n\
    \nDocument.write (“ (a || b) = > “);\nResult = (a || b);\nDocument.write(result);\n\
    Document.write(linebreak);\n\nDocument.write( ! (a && b) => “);\nResult = (! (a\
    \ && b));\nDocument.write(result);\nDocument.write(linebreak);\n</script>\n</body>\n\
    </html>\n```\n\nThe results for this example is going to be:\na && b = false\n\
    a || b = true\n!(a && b) = true\n\n## Bitwise\n\n* Bitwise AND takes the Boolean\
    \ value and the operation for every bit with the individual arguments.\n* Bitwise\
    \ OR takes the Boolean and it is performed or the operation of every integer is\
    \ performed.\n* Bitwise XOR is a Boolean exclusive and that is what will be performed\
    \ or the operation for the integers. Either the operand on the right or the one\
    \ on the left can be exclusively true, both cannot be.\n* Bitwise not is a unary\
    \ operation that is going to reverse all bits that can be found in the operand.\n\
    * A left shift is when the first operand moves to the left however many bits are\
