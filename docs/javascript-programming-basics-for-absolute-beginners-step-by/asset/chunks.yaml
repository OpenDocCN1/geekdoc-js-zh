    # Introduction


    Congratulations on purchasing JavaScript: Programming Basics for Absolute Beginners
    and thank you for doing so.


    The following chapters will discuss how you are going be be able to use JavaScript
    to your advantage. By the end of this book, you are going to know how to use JavaScript
    despite the fact that you have never used it before. You will not be able to do
    everything but you are going to know the basics.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # What is JavaScript?


    One of the languages that is used in programming is JavaScript. Many times it
    is used to design webpages so they have the ability to be interactive with users.
    The user’s computer is going to run JavaScript without any content needing to
    be downloaded. A lot of the time, JavaScript can be used in creating quizzes and
    polls.


    As a high-level program, JavaScript is dynamic, untyped, and interpreted. Out
    of all the content that you typically see online, it is created with JavaScript
    or two other technologies. Many major web browsers, email servers, and website
    run on JavaScript code.


    JavaScript contains first class functions that are a prototype which makes it
    a multi-paradigm language.


    # Turning JavaScript On and Off


    JavaScript is supported by almost every browser. There is no way to not, but you
    can turn it off if you are worried about people using it. JavaScript will be based
    on the web pages you are using. It is also determining if you input into the website.


    ## Internet Explorer 7 & 8


    - Open `tools`

    - Go to `internet options`

    - Select `security`

    - Click on `internet`

    - Go to `custom`

    - Under `scripting`

    - Select the radio button next to `JavaScript` to determine if you want on or
    off

    - Close everything and your settings will be saved


    ## Internet Explorer 6


    - Open `tools`

    - Go to `internet options`

    - Select `security`

    - Click on `globe`

    - Go to `custom`

    - Move to `scripting`

    - Select if you want `JavaScript` enabled or not

    - Close out all dialog boxes


    ## Firefox


    - Open `tools`

    - Select `preferences`

    - Select `content`

    - Enable or disable `JavaScript`

    - Close the boxes


    ## Chrome


    - Locate the `spanner` icon on the top of the menu

    - Go to `options`

    - In `options` go to under the bonnet

    - Click on `content settings`

    - Open `privacy settings`

    - Enable or disable `JavaScript`

    - You will have the option of allowing all sites to run `JavaScript` or no sites

    - Close `content settings`


    ## Opera


    - Open `tools`

    - Hover over `quick preferences`

    - In the submenu, click enable or disable


    ## Safari


    - Open the `safari` menu

    - Click on `preferences`

    - Open the `security` icon

    - Go to `web content` so you can enable or disable `JavaScript`


    ## Camino


    - Open `Camino` menu

    - Click on `preferences`

    - Select `web features`

    - In `control content`, you will be able to enable or disable `JavaScript`


    ## Sea Monkey


    - Open the `edit` menu

    - Select `preferences`

    - Go to the `plus` side under `advanced`

    - In `scripts and plug-ins`, you will be able to enable or disable `JavaScript`


