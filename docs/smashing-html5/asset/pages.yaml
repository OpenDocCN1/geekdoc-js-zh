    **CHAPTER**


    SOUND


    10


    ADDING SOUND TO Web pages allows


    developers to create a wide range of Web sites.


    Sites that play music, provide instruction, or add


    sound eff ects certainly widen the range of


    possibilities of what you can do with HTML5\.


    Th is chapter examines how to prepare sound for


    the Web and how you can use sound to help your


    Web pages make some noise.


    You’ll learn how to work with the diff erent


    <audio> tag attributes and settings. Also, you’ll


    see how diff erent browsers handle sound and


    diff erent sound fi les. As with graphics, special-


    ized programs are available to create audio and


    edit it. So, aft er examining the basic HTML5


    elements and attributes, this chapter goes on to


    show you how to create sounds for your Web site.


