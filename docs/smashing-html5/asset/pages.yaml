    When you assign values to a JavaScript variable, you can assign any kind you want
    and then


    change it to a diff erent type. First, though, you need to have an idea of the
    diff erent types of


    data that are available. Th e following list provides a brief description of each:


    „  **String:** Treated as text, typically in quotation marks


    „  **Number:** An actual number (integer or real) that responds to math operations


    „  **Boolean:** A two-state (true or false, 0 or 1) data type


    „  **Function:** A set of JavaScript operations contained in a module


    „  **Object:** An encapsulated collection of properties (variables/arrays) and
    methods


    (functions)


    You’ve seen how string variables work. When you put numbers into a string, they’re
    treated as


    text instead of numbers. For example, the following string treats the “123” exactly
    like “Elm


    Street” — as text.


