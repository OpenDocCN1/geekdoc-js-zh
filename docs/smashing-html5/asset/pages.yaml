    Author’s Acknowledgments


    I became aware of the immediate importance of HTML5 thanks to Michael Wilson,
    Zach


    Dunn, and Nick Greenfi eld, who brought it to my attention. Th ey also introduced
    me to


    *Smashing Magazine* and a number of other emerging new trends. Chris Webb of Wiley
    guided


    the direction of the book and, in concert with Margot Hutchinson of Waterside
    Productions,


    was able to clear a path for the book to move ahead. Ellie Scott of Wiley helped
    take care of


    the many details necessary in forging the book’s inception. Elizabeth Kuball worked
    as an able


    editor to clarify and smoothen everything I wrote, and Harvey Chute, the technical
    editor,


    worked to make sure that all the code was done correctly and off ered suggestions
    for improve-


    ment. Finally, my colleagues at the University of Hartford’s Multimedia Web Design
    and


    Development program, John Gray and Brian Dorn, helped when asked, including one
    terrible


    moment when a missing semicolon wrecked havoc on a program.


    About the Author


    **Bill Sanders** is one of the founding faulty members of the University of Hartford’s
    Multimedia


    Web Design and Development program where he teaches courses covering HTML5, informa-


    tion and interface design, CSS3, Flash, ActionScript 3.0, ASP.NET, C#, PHP, and
    streaming


    video. He has written numerous books on Internet computing, on topics ranging
    from


    JavaScript to ActionScript 3.0 Design Patterns. He lives in rural Connecticut
    with his wife,


    Delia, and one and a half dogs.


