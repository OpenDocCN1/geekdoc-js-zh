    Before getting to something practical, the fi rst few steps describe some basic
    syntaxes and


    operations of PHP. PHP has many unique features, but it’s very much like JavaScript
    with a


    slightly diff erent set of symbols. Th e most important fundamentals begin with
    PHP “catching”


    data sent from the client. In order to emphasize the diff erence between client-side
    and


    server-side operations, the PHP code will be divorced from an HTML5 wrapper.


