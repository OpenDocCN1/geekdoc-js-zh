    USING JAVASCRIPT TO CALL A LINKED PAGE


    Any global navigation system needs a way to call diff erent Web pages and the
    drop-down


    menus need a way to call a selected item. Up to this point, the <a> tag has done
    a good job


    of taking care of links, but you probably noticed the drop-down menus have no
    links. Th e


    <select> tag needs to work with the form element (which is covered in detail in
    Chapter 14)


    and a JavaScript function. (Chapter 12 has more details on getting started with
    and using


    JavaScript.) On the HTML5 side, the following snippet shows the essentials:


    <form name=”menuNow”>


    <label for=”animals”>Animals</label>


    <select id=”animals” name=”global1” onChange=”optionMenu()”>


    <option value=”animals/horses.html”>Horses</option>


    <option value=”animals/dogs.html”>Dogs</option>


