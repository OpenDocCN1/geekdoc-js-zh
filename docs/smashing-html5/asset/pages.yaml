    When discussing an image’s size, two diff erent meanings are used:


    Th e size of the fi le in terms of its dimensions


    Th e number of bytes it takes up


    Usually, in this discussion the context should make it clear which sense of size
    is being used,


    but for the most part, the term size refers to the number of bytes in a fi le,
    and dimensions


    refers to the size of the image on the screen.


