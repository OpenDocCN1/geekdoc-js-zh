    ADDING CHARACTER TO YOUR SITE WITH METADATA


    To this point, we’ve used the <meta> tag to establish that your site uses the
    UTF-8 character


    set, but the meta element can do much more. Th ink of the meta element as the
    one that


    performs multitasks. One of the most important attributes of the meta element
    is the name


    and contents pair. With the name attribute set to keywords, you can specify the


    contentson your site. In this way, the search engines can fi nd your site when
    people are


    trying to fi nd your products or services — or just the topics you’d like to include
    on your Web


    pages. For example, suppose your site has links to blogs and other sites on topics
    about dog


    kennels. Your meta tag would look something like this:


    <meta name=”keywords” content=”kennels, dog fences, pet containment”>


    Each of the content values must be separated by a comma. Th ese tokens can be
    directly


    related to your content or what someone might look for. Content meta tags are
    easy to set and


    you can help users fi nd their way to your site.


