    issue of creating videos and saving them on your computer. Th e range of types
    of video


    available for showing on the Web is wide, and making and storing them is equally
    varied.


    Here only four are considered:


    „  Webcams


    „  Small camcorders


    „  Standard camcorders


    „  Screen video capture


    Th e focus is on getting the materials from the camera into a fi le format that
    can be used


    immediately or converted for use with HTML5.


