    (Be *very* careful because you’re going to be using the built-in Terminal in your
    Mac


    and you’ll be changing some key fi les.) Th is Web site shows you how to set up
    both


    PHP and your built-in Apache server.


    „  **Th e easiest method for all users:** If you want to download and install
