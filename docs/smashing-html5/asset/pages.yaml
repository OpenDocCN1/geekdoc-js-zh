    **CHAPTER**


    ADDING FORMS


    14


    ONE OF THE most important features of any


    Web page is its ability to interact with a person.


    In computer science lingo, there’s a subfi eld called


    human computer interface, which treats humans


    as another type of interface like a printer, USB


    drive, or Webcam. Th is doesn’t dehumanize


    people using computers. Instead, it treats people


    like something they’re not, and that’s bound to


    get you in trouble sooner or later. Th is chapter


    shows both how to add interactive forms and


    treat people like people.


