    from 0 to 255\.


    Using hexadecimal values, you need only two digits (actually, hexadecimal integers)
    to


    represent all 256 values in an 8-bit byte. It’s neater.


    Th is leads to using hexadecimal integers in assigning color values. Using six
    values — two


    each for red, green, and blue — all the color values can be assigned using six
    hex integers. So


    returning to the value 6F001C, we can see the following:


    Red: 6F


    Blue: 00


    Green: 1C


    Getting used to hexadecimal can take some time, but once you do, it’s easy to
    add color values


    with them. Also, you can understand them in the same way as RGB decimal integers,
    but


