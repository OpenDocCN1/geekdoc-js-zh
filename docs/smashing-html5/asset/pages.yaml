    tested extensively and is reasonably priced is at www.jtl.net. (Th e Linux minimum
    service


    is all you need.)


    If you want to install PHP on your computer do the following:


    „  **Windows only:** Go to http://windows.php.net/download and download the


    latest stable version of PHP5\. (You’ll fi nd “What version do I choose?” in the
    left column


    to help you choose what you need for your system.) You’ll also need to install
    an Apache


    server; you can get one free from www.apache.org.


    „  **Macintosh only:** Go to http://foundationphp.com/tutorials/php_


