    Figure 6-6: A table with equal-size cells and a table with rowspan and colspan.


    Figure 6-6 shows that the fi rst cell in Row 2 in the bottom table took up the
    space of three


    cells in Row 2 in the top table. In Col 5 of the bottom table, both Row 1 and
    Row 2 were


