    ***113***


    Tabular data can be anything from a set of numbers to graphics to descriptive
    text. If you’ve


    ever ordered parts for your car (or just about anything else), chances are, the
    parts are listed in


    a tabular format. Usually, you’ll fi nd a description of the part, the part number,
    the year model


    the part is for, the car model, and the price.


    Th e key to understanding tabular data is that it’s laid out in rows and columns
    for displaying


    information in common categories. Further, the purpose of a table is to clarify
    information so


    that the user can fi nd what she needs.


    TABLE BASICS


    Th e basic elements of a table are


    „  Th e table itself, <table>


    „  Th e table rows, <tr>


    „  Th e table cells, <td>


    „  Th e table headers, <th>


    Generally, a table caption <caption> is used at the top of the table. A clear
    table generally


    has clearly marked column and row headings. Th e cell in the upper-left corner
    is oft en left


    blank so that the fi rst column doesn’t label the row heads; however, the standards
    state that no


    cell be left empty. So, the corner cell in BasicTable.html contains “r/c” to fi
    ll the space — for


    now, at least. Th e following example shows the basic table elements in a simple
    table. Th e row


    and columns both have headings, and the data cells represent data placed in the
    labeled rows


    and columns.


    <!DOCTYPE HTML>


    <html>


