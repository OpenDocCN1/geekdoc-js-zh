    GETTING AROUND A Web site is generally


    known as *navigation,* and HTML5 recognizes


    that fact by introducing a <nav> tag. With


    simple sites, navigation is simple. However, bad


    or inadequate navigation can invade virtually any


    Web site. By the same token, good navigation can


    make even the most complex site easy for the


    user to fi nd what he wants.


    Because this book focuses on HTML5, this


    chapter shows how to set up diff erent navigation


    systems using specifi c HTML5 elements. How-


    ever, before starting on the more specifi c tags that


    are to be used, you need to understand some


