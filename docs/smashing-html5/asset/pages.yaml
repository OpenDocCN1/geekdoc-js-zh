    CREATING WITH TAGS: AN OVERVIEW


    Most of the content on the Internet is created with HyperText Markup Language
    (HTML).


    You may be surprised to learn that several applications you use every day — for
    example, your


    word processor — also were created with markup languages. However, like all computer


    languages, with HTML, all you see is the content, not the underlying language.
    Th e language


    works like the frame of a building — you know it’s there underneath all that paint
    and


    drywall, but you can’t see it. In this book, I make the language of HTML very
    visible and show


    you how to use it to build your own structures.


    If you’re familiar with previous versions of HTML and XHTML, you’ll be able to
    transfer the


    bulk of your knowledge to HTML5\. And if you’re brand-new to working with HTML,
    you’ll


    fi nd HTML5 quite simple. Essentially, all you have to do is place your content
    between an


    opening tag and a closing tag, called a container, and the container will style
    your text or


    display your graphics and media on the Web page. Figure 1-1 illustrates containers:


    ![](img/a104289af2238490d8a60576b41416c5_21_2.png)


    Element name


    Opening tag


    Closing tag


    Container = between


    opening and closing tags.


    The <p> tag is inside the


    <body> container and


    ‘Hello’ is inside the <p>


    container.


    Figure 1-1: Containers in HTML5.


    For example, the following line,


    <h1>This is big text.</h1>


    tells the interpreter in your browser to create big text that looks like this:


    Th is is big text.


    Th e text inside the arrow brackets < > is the code. In this case, h1 is the code
    for big text.


    Th e arrow brackets tell where to begin the container (<h1>) and where to end
    the container


    (</h1>). Everything inside the container is confi gured to the size and style
    of the tag, which


    is either built into the tag or created using CSS3.


    While we’re getting started here, you can have a little fun creating and viewing
    some HTML5


    with little examples. All you have to do is type any of the code provided in this
    chapter in a


    text editor such as Notepad if you’re running Windows or TextEdit if you’re on
    a Mac. Save


    the fi le with the extension .html, and then open it in an HTML5 browser. To open
    a Web


