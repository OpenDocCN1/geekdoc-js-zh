    — from


    Jane Austen to Ivan the Terrible.)


    Before we get rolling on creating your own drawings, let’s look at one more way
    that you can


    keep out of hot water with non-HTML5 users. In addition to adding text, you can
    add photos


    or anything else in the <canvas> container. For example, the following script
    (Canvas-


    Photo.html in this chapter’s folder at www.wiley.com/go/smashinghtml5) provides


    an alternative to a more sophisticated presentation of a photo image using canvas.


