    A LITTLE MORE ORGANIZATION


    One of the basic conventions in Web design is placing the logo in the upper-left
    corner of the


    page. Likewise, Web pages place links organized into a coherent system of navigation.
    By


    adding two more tags, you can go a long way toward organizing your page:


    „  <br>: Generates a single-space line break


    „  <wbr>: Generates a line break opportunity


