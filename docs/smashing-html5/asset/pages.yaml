    VIDEO AND BROWSER COMPATIBILITY


    Two very diff erent issues must be addressed when discussing HTML5 Web video and


    compatibility. One is simply which browsers work with which video formats. I’ll
    be using the


    term video format to refer to a combination of video containers (wrappers in which
    actual


    videos are enclosed) and codecs (code-decode technology) — primarily by referring
    to the


    extension associated with the fi les. Technically, there’s a lot more about video
    fi les than I have


    room to discuss here, but to get rolling with video, you need to recognize diff
    erent fi les by


    their video extensions and what browsers they’ll play on.


