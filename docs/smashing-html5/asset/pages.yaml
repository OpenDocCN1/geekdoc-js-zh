    ADDING AND ADJUSTING OBJECTS


    IN HTML5 WEB PAGES


    When HTML was fi rst released, it couldn’t do much, so developers began using
    programs like


    Java and Flash, which provided the functionality that HTML could not. Much of
    that is no


    longer true with HTML5, but even though HTML5 can do far more than earlier versions
    of


    HTML, later versions of Flash and Java can still do far more.


    Much can be said about the relative merits of Adobe Flash CS5 (the latest version
    of Flash as


    of this writing) and HTML5, but for the foreseeable future, they’ll most likely
    be working


    together, despite the fact that the Apple iPhone and iPad do not support the Flash
    Player.


    Besides the fact that Flash can do a great deal, it has also provided consistency
    between


    diff erent platforms and browsers. So, even if diff erent browser makers had diff
    erent versions


    of the HTML DOM and diff erent ideas about what was the best CSS and JavaScript
    imple-


    mentation, the Flash plug-in was consistent across all browsers and platforms.
    So, when


    designers and developers used Flash, they were assured of a consistent presentation.


