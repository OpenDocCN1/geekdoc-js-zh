    ***91***


    A DESIGN IN SECTIONS


    One of the major changes in HTML5 compared with older HTML versions is in the
    sections.


    Prior to HTML5, you could pretty well think of sections in terms of the body element
    and


    some <h> tags. In HTML5, a page can be envisioned in terms of a number of sections
    with


    subsections. A larger context in a Web page is an article, and just like an article
    in a


    magazine, you can fi nd diff erent sections that constitute the building blocks
    of the article.


    Figure 5-4 provides an overview of the sections in an HTML5 page.


    ![](img/a104289af2238490d8a60576b41416c5_104_2.png)


    Figure 5-4: Some sections that make up a page.


    In looking at Figure 5-4, you can see diff erent blocks of information, but the
    tags used


    generally don’t have any inherent capacity to structure the information visually.
    Th e <h> tags,


    which are section elements, certainly confi gure text to diff erent sizes. However,
    the other


    section tags are as much for helping to organize a page as they are for specifying
    the visual


    display of the page.


    Th e section elements include the following:


    „  Body


    „  Section


    „  Nav


    „  Article


    „  Aside


    „  H1 . . . H6


    „  Hgroup


