    Circles and gradients


    Th us far, only a single type of fi ll has been used — a solid one. In this section,
    you’ll see how


    to make a circle using an arc and fi ll it with a gradient.


    First, making circles is easy using the context.arc() method. Th e radian parameters
    are 0


    and Math.PI*2. And the anticlockwise parameter is false. (Th at’s the trick.)
    For instance,


    this next example uses the following line to create a big circle that will be
    fi lled with a gradi-


    ent, to make it look like a sunset:


    contextNow.arc(200,200,150,0,Math.PI*2,false);


    To create a gradient fi ll, both linear and radial, is fairly straightforward.
    Th e fi rst step is using


    the canvas DOM context.createLinearGradient() method. Th e method expects four


    parameters: x0, y0, x1, y1. Th e gradient fi ll moves from x0 to x1 and from y0
    to y1. A


    straight linear gradient from left to right would have a single value in x1, and
    the rest would be


    0\. A gradient from top to bottom would have value in either y0 or y1, with the
    rest set to 0.


    To set the gradient colors, use the gradient.addColorStop() method. It expects
    two


    parameters. Th e fi rst is a zero-based number from 0 to 1 and the second is the
    color. Once


    that’s completed, assign the context.fillStyle the gradient. Th e following snippet


    shows the steps in adding a gradient fi ll:


    sunsetGradient=contextNow.createLinearGradient(0, 0, 0,379);


