    BASIC PHP PROGRAM STRUCTURES


    In this short introduction to PHP, you still can learn enough to make a practical
    application.


    However, fi rst, you’ll want to learn some of the basic structures of PHP. If
    you know JavaScript


    or some other scripting or programming languages, the structures will be familiar.
    PHP does


    have its idiosyncrasies, though, and many readers are unfamiliar with programming,
    so this


    discussion is basic and focused.


    TEMPORARY DATA STORAGE


    All languages include a certain way of storing data temporarily in containers
    called variables,


    constants, or some kind of object such as an array. Some languages are strongly
    typed and


    others are weakly typed. Java, C#, and ActionScript 3.0 are all strongly typed.
    Th at means that


