    PART I: THE LANGUAGE OF THE WEB


    Th e fi rst part of the book starts off looking at the diff erent browsers available
    for HTML5—


    including mobile browsers—and gives you a handle on where to start working with
    this


    newest version of HTML. It also deals with the details of working with diff erent
    fi le types and


    getting organized so that creating Web pages and sites is an orderly process.
    It explains how to


    use HTML5 tags (elements) and the diff erent attributes and values that can be
    assigned to


    tags. Also, you learn how to get going with CSS3\. At the end of the fi rst part,
    you learn about


    using color and diff erent color codes with HTML5 and how to put together color
    schemes to


    enhance any site.


    PART II: PAGES, SITES, AND DESIGNS


    Th e second part looks at the bigger picture of creating Web page and Web sites.
    At one time,


    designers and developers just needed to concern themselves with how a page appeared
    on a


    computer screen—as screen real estate expanded to monitors reminiscent of drive-in
    theater


    screens. Suddenly, users with mobile devices were looking at Web pages, and design
    strategies


    had to be reformulated to include mobile users. Th roughout the book, you’ll see
    Web pages


    presented in mobile confi gurations for devices like the iPhone and Droid. So,
    expect to see


    screenshots of Windows 7 and Macintosh OS X browsers interspersed with screenshots
    taken


    on mobile devices displayed in Mini Opera and mobile Safari browsers—as well as
    other new


    mobile browsers you didn’t even know existed. It’s not your father’s Web! (It’s
    not even your


    older sister’s Web anymore.)


    PART III: MEDIA IN HTML5


    Only one of the three chapters in this part deals with media that was available
    in earlier


    versions of HTML—Chapter 9, on images. Th e other two chapters deal with audio
    and video,


    both new to HTML5\. In addition to the general types of media, HTML5 brings with
    it


    diff erent decisions about media formats. Several of the video formats are relatively
    new and


    were developed for use on the Web in a number of versions. Not all HTML5 browsers
    use the


    same video formats, but, fortunately, HTML5 has structures whereby it can check
    the video


    formats until it fi nds one that will run on a given browser. In addition to the
    new elements for


    audio and video come several new attributes and values available to optimize media
    on the


    Web, and I cover these attributes and values in this part.


    PART IV: DYNAMIC HTML5 TAGS PLUS A LITTLE


    JAVASCRIPT AND PHP


    One of the most anticipated features of HTML5 has been the canvas element. However,
    in


    order to get the most out of canvas, you need both JavaScript and CSS3\. So, in
    this part, you


    learn enough JavaScript with the HTML5 Document Object Model (DOM) to work eff
    ec-


    tively with canvas and CSS3\. Likewise, HTML5 brought with it several new form
    attributes,


    but as with most forms, they need help for processing the information. Using JavaScript,


