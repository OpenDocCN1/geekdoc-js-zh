    For example, in the “Types of data” section earlier in this chapter, you saw how
    the naviga-


    tor.platform property was used to fi nd the type of computer in use.


    Th e HTML5 DOM itself has far more objects, and the most used is the Document
    property.


    Th e list of objects is the same as the list of elements. So, a list of all the
    DOM objects is a list of


    all elements, plus some others that are used in conjunction with the DOM. For
    example, the


    following are included in the HTML5 DOM but aren’t exactly elements:


    „  Document


    „  Event


    „  Image


    „  Link


    „  Meta


    Some of these objects we see in tags. For example, the image object is seen in
    the <img> tags.


    Its properties are similar to the img element’s attributes. Others, like document
    are implied


    in that a Web page is the document. Th e event object is employed in event handling
    with


    methods such as onClick. Th e rest are elements, so they should be familiar. But
    instead


    of attributes in a tag, expect to fi nd properties with the same names and functions
    as equiva-


    lent attributes.


