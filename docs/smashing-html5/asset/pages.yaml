    OBJECTS


    Th e fi nal data type used to store values is an object. (Wasn’t the Array an
    object? Yep. You’re


    already ahead of the game!) All objects are similar to arrays in that they can
    hold more than a


    single value. However, objects have several built-in properties. Th e properties
    have either


    fi xed values (called constants) or values that change depending on the circumstances.
    Even


    the Array object has a built-in property — length. It returns the number of elements
    in the


    array. So, if you add the following two lines to the array program in the previous
    section,


    you’ll see how big the array is:


    ...


    document.write(fruit[1]);


    //Add the following two lines


    document.write(“<br>”);


    document.write(fruit.length);


