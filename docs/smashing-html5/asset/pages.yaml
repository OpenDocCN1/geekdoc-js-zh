    CHOOSING A BROWSER TO INTERPRET HTML5


    If you want to start a lively discussion with other HTML5 developers, just ask,
    “What’s the


    best browser?” You should be most concerned with what browser those who will be
    viewing


    your Web site use — not which browser other developers use. In general, developers
    use the


    best browser until another best browser comes along, so they may actually use
    more advanced


    and better browsers than the average Web user. If you want the people who visit
    your site to


    have the best experience possible, try to fi nd out what browser they’re most
    likely to use. An


    even better idea when developing soft ware for yourself or a client is to test
    your Web pages on


    all major browsers and on at least the two major platforms — Macintosh and Windows.
    Th e


    major browser developers also make browsers for the Linux OS, but very few people
    use their


    Linux box for browsing the Web.


    In looking at the major browsers that support HTML5, most can be used either by
    Windows


    or by Macintosh operating systems, but sometimes a browser will require a newer
    OS. So if


    you have an older system, be sure that the requirements for the browser you use
    work with


    your OS.


    Several years ago, Microsoft quit making Internet Explorer (IE) for the Macintosh.


    However, Apple does make a version of its browser, Safari, for Windows. Th ree
    browser


    developers — Google, Mozilla, and Opera — do not make operating systems for computers


    but make browsers. In this section, I review Firefox, Chrome, Opera, Safari, and
    IE9.


    Keep in mind that browsers’ features change all the time. What’s here is current
    as of this


    writing, but it may have changed by the time you read it.


