    Creating your own objects


    If you create a few of your own objects, you can get an idea of how objects work
    in the DOM.


    Also, to help clarify things, from now on, a reference to an object’s properties
    in general refers


    to both properties and methods. However, when I get specifi c in talking about
    an object’s


    individual parts, the reference will be either to a property (some characteristic
    of the object)


    or a method (a function associated with the object).


    Making objects is similar to declaring variables and assigning them values. Th
    e object itself is


    sort of a base of operations for doing a lot of diff erent things and having diff
    erent characteris-


    tics. Th e fi rst step is simply to use a name and the keyword new. For example,
    the following


    declares an object named AddingMachine:


    AddingMachine=new Object();


    Next, to add a property, you invent a new name for the property and assign it
    a value. Th e


    object name and its property are separated by a dot (.). For example, the following
    adds a


    property named firstNumber and assigns it a value of 4:


    AddingMachine.firstNumber=4;


    Just like a variable, you can change the firstNumber value to something else.


    To add a method (a function) is just as easy. However, instead of using a named
    function, you


    use an anonymous one. For example, the following adds the value of two properties
    for the


    AddingMachine object and sends them to the screen:


    AddingMachine.total=function()


    {


    document.write(this.firstNumber + this.secondNumber);


    }


    Th e keyword this is a reference to AddingMachine. It’s the same as writing Adding


    Machine.firstNumber. Notice also that function() has no name — it’s anonymous.


