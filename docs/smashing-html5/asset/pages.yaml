    Drop-down menus and global navigation


    An alternative approach to global navigation using text links is to use elements
    that can


    provide more information in a smaller place. One such element is the <select>
    tag. Th e


    select element displays the fi rst item in a list of options that can be seen
    only when the user


    clicks on the select window that appears. Th e format is made up of a <select>
    tag along


    with an <option> tag nested within the select container. Each option container


    contains an object that is visible when the drop-down menu opens. Th e following
    snippet


    shows the basic format:


    <select id=”animals” name=”global1”>


    <option value=”horses”>Horses</option>


    <option value=”dogs”>Dogs</option>


    ...


    </select>


