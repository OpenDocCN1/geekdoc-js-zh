    SRC


    Th e type attribute is part of the <source> tag. As shown at the beginning of
    the chapter,


    the src attribute is used to select a video fi le to play. If the browser can’t
    play the assigned


    fi le type, it drops down to the next fi le in the source list. To speed up that
    process, the type


    attribute lets the browser know what kind of fi le is waiting to be played and
    contains a MIME


    parameter that tells it which codec is in use. Th is saves the browser from attempting
    to load


    the fi le and failing. Instead, it determines from the type information whether
    the video fi le


    is compatible.


    <source src=”fileName.ext” type=”video/type; codecs=’c1, c2’”>


    Th e type assignment can be made with or without the codec. If you don’t know
    the codec, you


    can leave it blank and rely on the type to let the browser know whether it can
    play the fi le. If


    you know the codec or multiple codecs, you can place more than one codec in the
    codecs


    assignment list. Where you’re not sure you’re better off leaving the codecs assignment
    blank.


    Th e following (TypeVideoSource.html in this chapter’s folder at www.wiley.com/go/


    smashinghtml5) shows the type assignments for the four major types of video fi
    les you can


    use on the Web.


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>


    <title>Selective Video</title>


    </head>


    <body>


    <video controls preload=”auto”>


    <source src=”mbAux1.3gp” type=”video/3gpp; codecs=’mp4v.20.8’”>


    <source src=”mbAux1small.mp4” type=”video/mp4; codecs=’mp4v.20.8’”>


    <source src=”mbAux1small.ogv” type=”video/ogg; codecs=’theora, vorbis’”  >


    <source src=”mbAux1small.webm” type=”video/webm; codecs=’vorbis,vp8’”  >


    </video>


    </body>


    </html>


    To determine the type and codec of a fi le, you can fi nd several diff erent programs
    on the Web.


    One available at no cost with versions for Windows, Macintosh, and several diff
    erent Linux


    operating systems is MediaInfo available at http://mediainfo.sourceforge.net/en.


