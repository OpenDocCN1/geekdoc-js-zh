  md: '![](img/a104289af2238490d8a60576b41416c5_14_0.png)


    Introduction


    In 1992, I was stumbling the Internet (we used to stumble prior to surfi ng) with
    a program


    using the Gopher protocol. From El Paso, Texas, I was able to look up the train
    schedule


    between London and Cambridge in England. At the time, it was like a miracle. Here
    I was in


    West Texas with a London-Cambridge train schedule. Unbelievable!


    Shortly aft er that time when I didn’t think it could get any better than Gopher
    on the Internet,


    up popped the Mosaic browser and the World Wide Web. Netscape Navigator soon sup-


    planted Mosaic, and I discovered HTML. Now I was able to see graphics and text
    plus I could


    link to other Web pages. In short order, I worked out how to create my own Web
    pages using


    a text editor and the new markup language, HTML. Some of the guys in computer
    services set


    up a host for me, and I was in business.


    For a while, it seemed that a new version of HTML was coming out every year or
    so. CSS and


    JavaScript were introduced and more and more browsers became available. It just
    kept getting


    better and better, but aft er HTML4 (in its many forms, including XHTML), things
    seemed to


    stagnate. Th is HTML Dark Ages lasted from about 2000 to 2008\. Th en the World
    Wide Web


    Consortium (W3C) published the HTML5 Working Draft in 2008\. However, aft er publication


    of the HTML5 standards in a draft format, everything was back to a crawl as far
    as getting my


    hands on an HTML5 browser. Th e team developing the standards has been methodical
    in the


    development process and was planning on implementing the fi nal draft of the standards
    in


    browsers in 2012!


    Th en one day in 2009 or 2010, I read about a beta version of a browser that supported


    HTML5, or at least some of its features. By 2010, several browsers were supporting
    HTML5,


    including browsers made for mobile devices. Online blogs like www.smashingmagazine.


    com were publishing posts about HTML5 and so, ready or not, HTML5 was here! Somehow


    HTML5 has escaped from the zoo, and the race was on to produce HTML5 browsers.
    We


    have offi cially entered the HTML Renaissance Period. Th e excitement is back!


    HTML5 is so big that I had to select a focus that would encompass the essence
    of the markup


    language without devolving into a mere reference or encyclopedia attempting to
    touch on


    everything and explain nothing. Naturally, the new features were going to be a
    major focal


    point, but they exist in the context of a host of other tags, and readers learning
    HTML for the


    fi rst time need foundational elements. Also, I had to drop the discontinued elements
    like a


    bad habit and show how the continued and new elements work in concert. Further,
    CSS3 and


    JavaScript play an important role, but they’re only introduced insofar as they
    relate to


    HTML5\. (Smashing JavaScript and Smashing CSS cover these important features in
    detail.) So


    I’ve divided Smashing HTML5 into four parts that bring together the heart and
    soul of


    HTML5.


    -intro.indd 1


