    Fixing TextEdit on your Mac


    If TextEdit on your Mac has its default settings, you may have had problems saving
    plain HTML ﬁ les.


    That’s because the default ﬁ le type that TextEdit saves ﬁ les as is Rich Text
    Format (.rtf) and not plain


    text (.txt). With .rtf, your text is saved with other code that you don’t want
    in your Web pages.


    Here’s what you need to do to ﬁ x it for writing Web pages:


    **1\.** Open TextEdit.


    **2\.** In the TextEdit menu at the top of the screen, choose Preferences.


    The Preferences dialog box appears.


    **3\.** Select the Plain Text radio button (see the ﬁ gure).


    ![](img/a104289af2238490d8a60576b41416c5_43_3.png)


    Changing TextEdit from Rich Text to Plain Text.


    Now when you create an HTML5 page in TextEdit, when you save the ﬁ le, it defaults
    to .txt and


    you can just change that to .html using Save As.


