    UNDERSTANDING RGB COLOR


    If you’ve ever mixed colors in anything from fi nger paints to a watercolor set,
    you have a sense


    of what happens when you mix colors. For computer screens, red, green and blue
    lights are


    mixed to generate diff erent colors. For example, if you mix equal amounts of
    red and green,


    you get yellow.


    To mix colors for Web pages, diff erent values are mixed using integers, percentages,
    and


    hexadecimal numbers. CSS3 also has a limited number of named colors available
    that can


    help while fi guring out the other color-mixing methods. HTML5 and CSS3 have some
    very


    sophisticated elements such as canvas that can do more with color and drawings
    than has


    been possible in previous versions of HTML. Th ese advanced elements require a
    bit of


    JavaScript, and you’ll fi nd them discussed in detail in Chapter 13\. For now,
    we’ll get started


    with the basics.


