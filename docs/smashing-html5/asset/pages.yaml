    <head>


    <meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>


    Different pixel density


    When you’re creating Web pages for output ranging from large desktops to mobile
    devices, you


    have to consider more than just the number of pixels on the vertical and horizontal
    planes. In the


    example CSS3 external style sheet, the width is set to 480 with the code max-width:480px;
    for


    an iPhone with 480-pixel horizontal resolution. However, when you run the application
    on your


    mobile device, the text may be way too big or way too small. What’s going on?


    We tend to think of screen resolution in terms of the number of pixels — the more
    pixels, the higher


    the resolution. So, if you set your screen to 1680 x 1050, it has a higher resolution
    than if I set it to


    1024 x 768\. However, the resolution actually depends on the number of pixels
    relative to the size of


    the display area. More important than the number of pixels is the number of pixels
    stuffed into your


    viewing area or pixels per inch (PPI) — pixel density. If you develop your Web
    page on a typical


    computer screen, the pixel density is around 100\. However, your mobile device
    is likely to have a


    much higher pixel density. For example, my iPhone 3GS has a pixel density of 132
    and a resolution


    of 480 x 320\. If I upgrade to an iPhone 4, my pixel density will be 326 and the
    resolution will be


    960 x 640\. However, the phones both have a 3¹⁄2-inch viewing area. The iPhone
    4’s resolution is


    double that of the iPhone 3GS, and its ppi is about 2¹⁄2 times greater. For my
    Web page, that means


    a width setting of 480 will show up as coming only about halfway on an iPhone
    4 even though it ﬁ lls


    the width of iPhone 3GS models.


    However, because I do my development on a computer with a ppi of 99 on a 20-inch
    screen, the best


    I can get is an estimation of what it will look like on any mobile device. I can
    estimate what a Web


    page will look like on different mobile devices by changing the size of the browser
    window, but


    ultimately, you need to actually see what your HTML5 Web page looks like on the
    target mobile


    device.


