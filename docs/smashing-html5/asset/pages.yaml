    ***225***


    SCREEN VIDEO CAPTURE


    Screen video capture treats your desktop as a video recording, and a microphone
    connected


    to or built into your computer as a video-recording microphone. For example, one
    of the most


    established screen-video-capture soft ware packages is Camtasia. It’s easy to
    use and has


    several features for zooming, panning, and generally simulating a camcorder aimed
    at your


    screen. Figure 11-7 shows the basic controls.


    ![](img/a104289af2238490d8a60576b41416c5_238_2.png)


    Figure 11-7: Screen-video-capture software makes a live recording of your desktop.


    Basically, all that Camtasia requires is for the user to select the screen and
    the microphone


    and click the Rec button (as shown in Figure 11-7). Available for Windows 7 and
    Macintosh


    OS X, it’s a widely used soft ware package for trainers and educators who work
    on a project on


    the screen so that viewers can follow along.


    Another screen video capture application can be found as part of the Apple Quick-Time


    Player. It automatically saves fi les in .mov (.mp4) format that are ready to
    be used with an


    HTML5 Web site. Th e recording process is extremely easy, and other than selecting
    the


    microphone, it’s a one-step start-and-stop recording operation.


    VIDEO AND SOURCE ATTRIBUTES


    Several diff erent attributes for the <video> and <source> tags are essential
    for successful


    video deployment in HTML5\. Once you’ve created, edited, and converted video for
    the Web,


    the next step is to place them in the Web page. Th is section covers the following
    video


    element attributes:


    „  src


    „  poster


    „  preload


    „  loop


    „  autoplay


    „  controls


    „  width and height


    Th ese attributes of the <video> tag are discussed in concert with the <source>
    tag because


    not all browsers read the same fi le types, so several diff erent sources must
    be listed. Th e


    <source> tag allows the browsers to choose which video fi le is compatible with
    their own


    video display functions (as was shown at the beginning of the chapter).


