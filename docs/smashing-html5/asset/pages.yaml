    A certain


    percent of red, green, and blue will give diff erent colors. In setting colors
    in CSS3, you can use


    percentages in two diff erent ways. First, you can assign a color value using
    the following


    format:


    rgb(r%,g%,b%);


    Th e fi rst value is the percent red; the second, green; and the third, blue.
    For example, the


    setting, rgb(43.9%,50.2%,56.5%) generates the color that the Los Angeles Dodgers
    use.


    Th e three percentage values add up to more than 100 percent, so you know that
