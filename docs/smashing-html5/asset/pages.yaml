    (You can spot methods in JavaScript by looking for the parentheses.) Also, note
    that to fi re off


    the method, the name of the object and function are listed and off it goes. When
    you test it,


    you’ll see that the results are the total of the two properties.


    Back to the Document Object Model and browser objects


    Th is chapter has covered a lot of territory very quickly. In fact, the last section
    is the fi rst step


    in Object-Oriented Programming (OOP). So, if you didn’t pick up everything, don’t
    worry.


    Th e purpose is to make you more comfortable with the DOM in HTML5\. If you understand


    terms like properties and methods, they won’t seem as foreign.


    As we get into many of the newer features in HTML5, you’ll be better able to navigate
    through


    all the terms and understand what’s going on. In other words, it’ll be easier
    to learn. Th at


    doesn’t mean you have to become an OOP programmer to understand this stuff . It
    just means


    that a little OOP goes a long way toward helping you understand the DOM and browser


    objects that come in handy when using elements like canvas.


    Th roughout the book, you’ve seen objects that belong to the browser. I didn’t
    discuss them as


    such, but that’s what they are. Th e browser has the following objects that are
    important to


    using HTML5\. Included are the following:


    „  History


    „  Location


