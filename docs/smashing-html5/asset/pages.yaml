    VERTICAL AND HORIZONTAL NAVIGATION


    Besides using the horizontal plane along the top and bottom of a page for navigation,
    inter-


    face designers oft en reserve part of the side of a Web page for navigation. Figure
    8-6 shows


    the general design for this approach.


    Global links


    ![](img/a104289af2238490d8a60576b41416c5_173_2.png)


    Topic links


    Content area


    Figure 8-6: Vertical and horizontal navigation.


    When using horizontal and vertical link planes, the user can see all the global
    links and the


    links for the current topic simultaneously. More of the viewing area is taken
    up by the


    navigation system, but with the larger monitors becoming standard on computers,
    this isn’t


    that much of a problem. With electronic tablets like the iPad that have smaller
    screens, it cuts


    into the usable viewing area, but not a great deal. However, on mobile phones,
    especially


    when viewed vertically, the content space is severely reduced.


    To create an area for a vertical link area with HTML5, you just need to set up
    a two-column


    page below the area generally reserved for the logo and global navigation bar.


