    We can fi x that if we want by adding indents to the <h..>tags. We could do this
    by adding


    margins using CSS3 as you’ll see in the next section. However, the purpose of
    the h element


    and the <hgroup> is not to set indents but to help with more general outlines.
    Th e


    <hgroup> tag sets the highest level <h..> tag in the hgroupcontainer as the outline


    element. For example, since Wittenstein wrote Tractatus Logico-Philosophicus wholly
    in


    outline, his entire work using the hgroup element would look exactly like the
    outline in his


    actual Abstract to the work.


