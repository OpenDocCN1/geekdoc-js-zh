    INCORPORATING THE NEW HTML5 ELEMENTS


    A tag is made up of an element and attributes. Th e tag is identifi ed by its
    element, such as


    <h1> — h1 is the element. When we speak of a tag, we’re usually referring to its
    element, but


    actually a tag is its element and attributes. Attributes are the diff erent characteristics
    or


    properties of an element that you can code to change features of the content in
    the tag’s


    container. For now, I’m just going to deal with the element, so I’ll use the terms
    *tag* and


    *element* interchangeably.


    To give you a sense of the new elements in HTML5, Table 1.1 shows all the new
    elements,


    along with a brief description of each. Later in this book, I give lots of examples
    and explain


    how to use these elements.


