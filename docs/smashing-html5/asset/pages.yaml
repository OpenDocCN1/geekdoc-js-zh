    LINK ICONS


    Next to using the rel attribute for assigning style sheets, the most used value
    is for setting up


    a small icon to represent the page. Graphic icons can be assigned to the rel attribute
    using


    the following format:


    <link rel=”icon” href=”graphic.png” sizes=”32x32”/>


    In earlier versions of HTML, the relation value was shortcut icon but just icon
    works


    as well.


