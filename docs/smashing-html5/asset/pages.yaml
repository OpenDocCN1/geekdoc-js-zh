    Grayscale on Internet Explorer


    One interesting note in working through fi le sizes is the use of a special CSS
    property recog-


    nized only by Internet Explorer. Some designers use grayscale settings to reduce
    the size of


    their graphics or for the eff ect of grayscale. If you want an interesting option
    using Microsoft


    Internet Explorer, you can write a little CSS code to convert color fi les to
    grayscale. Use the


    following snippet in a style defi nition:


    <style type=”text/css”>


    img {


    filter:gray;


    }


    </style>


    Figure 9-11 shows a color fi gure (Figure 9-8) that is turned into a grayscale
    using CSS only.


    ![](img/a104289af2238490d8a60576b41416c5_201_2.png)


    Figure 9-11: Using Internet Explorer CSS grayscale ﬁ lter.


    Using this technique is a quick way to see how the fi gure looks in a grayscale
    before rendering


    it in a grayscale mode. If you’re updating a site, and you want to view the images
    on the page


    in grayscale, you can add the CSS and test it on Internet Explorer fi rst. If
    you want to keep the


    fi le size down and the quality up, a JPEG image in grayscale instead of color
    will cut the fi le


    size in half.


