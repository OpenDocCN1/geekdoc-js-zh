    **CHAPTER**


    EMBEDDING OBJECTS


    AND STORING


    INFORMATION


    15


    FOR YEARS, USERS have been able to do


    some pretty remarkable things on the Web


    thanks to diff erent kinds of plug-ins loaded


    inside the browser. Generally speaking, two key


    plug-ins are installed with most browsers: Adobe


    Flash Player and Java.


    Some of the new HTML5 features work best in


    concert with either special plug-ins directly


    related to the new feature or through a URL that


    serves the new feature. HTML5 has a number of


    such objects, and one of the most interesting is


    the geolocation object. So, it’ll be the fi rst to


    examine before looking at how Java and Flash


    work with HTML5.


    -ch15.indd 305


