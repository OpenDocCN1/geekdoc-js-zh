    Th e iframe element declares an inline frame. Using inline frames, you can load
    other Web


    pages or other media within a single Web page. Th e element represents what is
    called a nested


    browsing context. Th e “Targets” section in this chapter discusses diff erent
    browsing contexts


    in terms of diff erent windows and tabs. A *nested browsing context* occurs when
    one page is


    nested inside another page. Essentially, an <iframe> tag places one Web page inside
    another.


