    A line break (<br>) forces a break in the lines of text. You can think of it as
    a single space


    between lines, or if you’re old school, a carriage return. HTML5 has added something
    new


    called a line break opportunity. Sometimes you’ll have a very long word, especially
    in URLs


    and e-mail addresses. Th e wbr element doesn’t force a line break, but you can
    place the <wbr>


    tag where you would like a word to break in case the page is compressed. Th is
    consideration is


    especially important for mobile devices because they have small screens. For example,
    suppose


    you have a very long URL that is being shown as a non-linking description like,


    www.eatatjoesfinerestaurant.com


    If the link name is not broken up, and if the page is compressed, you’ll see a
    big gap in the text


    or the word broken where you don’t want it to be. Th e <wbr> tag helps you keep
    your text


    broken where you want it. Consider the following script (BasicBreaks.html in this


    chapter’s folder at www.wiley.com/go/smashinghtml5), which uses both of the


    line-breaking tags:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>


    <title>Adding ine Breaks and ine Break Opportunities</title>


    </head>


    <body>


    <img src=”logo.png”><br>


    This is text. You don’t need a tag for Plain Old Text (POT).<br>


    <br>


