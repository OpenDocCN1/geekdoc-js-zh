    ![](img/a104289af2238490d8a60576b41416c5_215_3.png) ![](img/a104289af2238490d8a60576b41416c5_215_4.png)
    ![](img/a104289af2238490d8a60576b41416c5_215_5.png) ![](img/a104289af2238490d8a60576b41416c5_215_6.png)


    Figure 10-1: Using audio player controls.


    PRELOAD


    Th e preload attribute of the <audio> tag can be an important one because it starts


    preloading the audio before it’s played. In that way, users don’t have to sit
    and twiddle their


    thumbs while the audio loads aft er they press play. Th e simplest format for
    the preload


    attribute is just like the controls and autoplay — it just needs to be added without
    a value, as


    the following shows:


    <audio src=”Shadows.wav” preload controls></audio>


    When preload is employed, you can use autoplay, but I’m not sure that it makes
    much sense to


    do so. Autoplay starts the audio playing as soon as the page loads, while preload
    is used to


    load an audio fi le before the play command is issued by the controller.


    You can assign values to the preload attribute:


    „  none: Having none as a value may seem strange, but some browsers may be set
    to


    automatically preload audio fi les. However, if the chance of using a particular
    audio is


    remote, the developer may decide not to use Internet resources and so assigns
    the none


    value to the preload attribute.


