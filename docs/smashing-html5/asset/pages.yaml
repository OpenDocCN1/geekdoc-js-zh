    SERVER-SIDE LANGUAGES AND HTML5


    Using HTML5, all of the processing is done on the client — your browser on your
    computer.


    In a larger context, that’s called client-side processing. Your browser parses
    the HTML5 tags


    and displays the Web page that it retrieves from a Web server. All the Web server
    does is serve


    you the HTML, and your browser does the rest.


    Server-side processing is diff erent. Th e server — a PHP server, in this case
    — processes the


    information it gets from diff erent sources and sends HTML to your browser to
    show on your


    computer. Th e big diff erence is that the server can interact with other kinds
    of data that your


    browser cannot. For example, it can interact with a database that stores data
    that anyone can


    send in via the Web.


    Going back to our example of rewriting your Web page every time you want to make
    a blog entry


    or comment, that’s pretty much what PHP does. Imagine that PHP is a little (overcaff
    einated)


    mouse that lives in the server and is really good at writing HTML5\. Whenever
    you make a blog


    entry or someone posts a comment, the mouse quickly rewrites the HTML5 so that
    your Web


    page refl ects the changes. Th at’s how PHP works. Figure 16-1 shows an illustration
    of the process.


    **Client-side processing**


    Client


    Server


    Requests HTML5 Page


    Returns HTML5


