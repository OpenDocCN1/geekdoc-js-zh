    STARTING OFF WITH THE BASIC HTML TAG


    If you’re familiar with HTML4 and describing the document type, you know that
    you can add


    a great deal of detail to tell the browser what’s up with your page. So, the fi
    rst tag that you


    need to consider is not really an HTML tag but instead a tag that communicates
    with the


    browser to tell it that you’re writing HTML5 and not one of the many versions
    of HTML4 or


    XHTML. Here it is:


    <!DOCTYPE HTML>


    Th at’s it! Nothing fancy, it just announces to the browser, “You can expect an
    HTML5


    document type.” Every Web page you make should begin with that tag, and you do
    not need a


    closing tag. Th e exclamation mark (!) tells you it’s not an HTML tag, but something
    a little


    diff erent.


    DESCRIBING YOUR PAGE WITH TAGS


    Right aft er the fi rst tag that tells the browser what it can expect, you begin
    your HTML


    container (everything between the opening and closing tags). Th is tag announces
    the begin-


    ning of HTML code and ends when the browser encounters the closing tag. Th e closing


    HTML tag is at the end of every HTML page.


    Following the HTML element is the <head> container. Th ink of the head area as
    the house-


    keeping portion of a page. Whatever is in the head will be loaded fi rst, no matter
    where it’s


    used in the rest of the HTML page. To get started, all that’s going into the head
    is the page’s


    title. Th e title appears at the top of the Web page when you run it. For example,
    consider the


    following title:


    <title>Seriously Sweet Page</title>


    Th at title appears on the page’s Windows and tabs. If you don’t put it in, you’ll
    end up with a


    blank or default title. Figure 2-1 shows how the title appears in diff erent browsers.


    As you can see, the title Seriously Sweet Page appears in diff erent places on
    the four main


    browsers. On some, it appears at the top of the window and the tab, only at the
    top of the


    page, and only on the tab. Th is helps the user fi nd your page when multiple
    pages are open


    simultaneously — or simply reminds the user which page he’s viewing. Lots of other
    content


    goes in the <head> container, such as CSS and JavaScript, but for now, just remember
    to


    include a title.


    Moving right along, the <body> tag demarcates the beginning of the page’s content.
    As the


    name implies, the body is the main part of any Web page, and only content inside
    the


    <body> container is visible on the page. Between the opening and closing body
    elements,


    you put everything you want on your page. Th e following set of tags should go
    on every page


    you create — in fact, you might as well use it as a template and save it somewhere
    so you don’t


    have to start off with an empty page to code.


    -ch02.indd 32


