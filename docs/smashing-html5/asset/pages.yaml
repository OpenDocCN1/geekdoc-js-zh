    /* CSS Document */


    /*3C371E,8C5F26,BCA55F,F2CC6E,F26205 */


    body


    {


    background-color:#F2CC6E;


    font-family:”Lucida Sans Unicode”,  “Lucida Grande”, sans-serif;


    color:#8C5F26;


    font-size:11px;


    max-width:480px;


