    not going to return. So, how do you control sound? Th e easiest way is to add
    the controls


    attribute. As with autoplay, you don’t have to give it a value. Just include it
    within the


    <audio> tag, and it automatically appears. Try the following program (Controls.html


    in this chapter’s folder at www.wiley.com/go/smashinghtml5):


