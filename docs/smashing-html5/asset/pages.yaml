    Now you’ll be able to see all your ﬁ le extensions. So, when you want to load
    a graphic ﬁ le, you’ll


    know whether it’s a .png, .jpg, or .gif ﬁ le just by looking at the ﬁ lename displayed
    on your


    computer screen.


