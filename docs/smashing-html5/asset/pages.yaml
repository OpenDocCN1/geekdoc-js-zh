    Because the canvas element is a crucial part of HTML5 and works only with HTML5-


    compatible browsers, the fi rst thing you want to do is to let users know that
    they need an


    HTML5 browser. Several methods are available to fi nd out whether canvas works
    with their


    browser, but the easiest and most informative (to the user) is to place a message
    in the


    <canvas> container. Only users without HTML5-compatible browsers see the text
    in the


    container. For example, the following line, easily mistaken for the outcry of
    a drama queen,


    gets the message across. At the same time it remains invisible to users who have
    HTML5


    browsers:


    <canvas id=”colorScheme”  width=”600”  height=”100” >Come on, Jack & Jill! You


    <i>really</i> need to get an HTML5 Compatible browser. You’re missing <b>canvas!</


    b></canvas>


