    CREATING CSS3 CLASSES AND IDS


    CSS3 classes and IDs are ways to extend a style to any element. For example, suppose
    you


    have a feature that you want to add to just some items such as a yellow highlight.
    If you defi ne


    a div or a p element’s background color as yellow, all the text in either of those
    containers


    will be bright yellow — not what you want. On the other hand, if you have a class
    that defi nes


    a yellow background, all you have to do is to assign that class to an element
    to lighten it up.


    CSS3 classes


    You create style classes in an almost identical way as you do element styles.
    Th e “dot” (.)


    defi nitions used to create a class in CSS3 are labels you make up instead of
    using element


    names. Figure 3-12 shows how to create a CSS3 class defi nition.


