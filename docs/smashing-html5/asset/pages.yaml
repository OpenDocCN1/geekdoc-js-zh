    Th e purpose of sections is to divide the page into coherent parts. Th ey’re an
    organizational set


    of elements, and while they can be used for formatting, that isn’t their main
    purpose. For


    adding formatting to a paragraph or group of paragraphs, the W3C Standards encourage
    the


    use of the <div> tag.


    Figure 5-5 shows what the page looks like. Although it isn’t an attractive design,
    it is a


    functional one. Th e article is about pilots and fl ying. Th e article’s header
    announces the topic


    (pilots and planes) and provides a quote from a pilot using a <q> tag. Aft er
    the header, the


    fi rst section is about fl ying stories. Nested within the fi rst section are
    two other <section>


    tags that separate out the two stories.


    A somewhat related section about the veracity of pilot stories is placed in a
    separate aside


    element container. In Figure 5-4, you may have noticed that the aside was placed
    in a separate


    column, but in and of itself, an aside element is a reference to the sense of
    the page. It is not


    a formatting element as such.


    ![](img/a104289af2238490d8a60576b41416c5_106_2.png)


    Figure 5-5: A page organized with section elements.


