    TAKE THE WHEEL


    Th is fi rst exercise is a Web treasure hunt. You can fi nd a lot of free tools
    on the Web that can


    be used to alter the size of a graphic fi le — both in terms of dimensions and
    number of bytes


    in the image. Even if you have a tool like Adobe Photoshop or Microsoft Paint,
    go fi nd an


    application on the Web that works on your computer. (You can fi nd several if
    you want.)


    Take an existing graphic fi le that is not in JPEG, PNG, or GIF format. For example,
    fi nd


    a graphic with a .tif or .tiff extension. (It can be a digital photograph or a
    drawn


    graphic — or some combination of both.) Th en do the following:


    **1\.** **Convert the fi le to JPEG, PNG,** ***and*** **GIF format.**


    Now you have four fi les — the original and three Web formats.


    **2\.** **Make a second copy of all Web graphics, naming the second one so that
    it indicates it**


    **will be low quality.**


    For example, if you have a fi le named car.jpg, copy it and name the second copy


    carLow.jpg.


    **3\.** **Using the image application you found on the Web, create the highest-
    and lowest-**


    **quality fi le for each of the three fi le types.**


