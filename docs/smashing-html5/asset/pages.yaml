    STORAGE IN HTML5


    Other than cookies that store data on the user’s browser, when you think about
    storage,


    typically a database and other programs like PHP and ASP.NET come to mind. However,
    the


    HTML5 DOM now has a storage object that can be used in four contexts:


    „  Session storage


    „  Global storage


    „  Local storage


    „  Database storage


    Not all browsers support all these storage contexts, but as browsers are continuously
    updated


    to include HTML5, they include more contexts. At the time of this writing, Safari,
    Chrome,


    and Opera supported all the contexts except global storage; Firefox supported
    them all except


    database storage.


