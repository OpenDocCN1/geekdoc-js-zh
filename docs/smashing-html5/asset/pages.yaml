    Content goes here: A Really Swell Page


    </body>


    </html>


    As you proceed in this book, you’ll fi nd more and more structural elements to
    include.


    However, the preceding few lines will get you off and running with your Web pages.


    IDENTIFYING THE PARTS OF A TAG


    Up to this point, I’ve used the terms tag and element more or less interchangeably.
    However,


    the element is just one part of a tag. Each tag has attributes and the attributes
    have values. So,


    tags are better conceived of in the following terms:


    „  **Element:** Th e name


    „  **Attribute:** Some characteristic of the element


    „  **Values:** A state or condition of the attribute


