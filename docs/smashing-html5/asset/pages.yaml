    GENERAL FORM ATTRIBUTES


    Th e form (think the mother ship) has several attributes that impact every input
    element in the


    form container. However, the fi rst focus is on the form itself. It has the following
    attributes:


    „  accept-charset


    „  action


    „  autocomplete


    „  enctype


    „  method


    „  name


    „  novalidate


    „  target


    Many of these attributes are rarely used and some only make sense when you start
    using


    programs like PHP and ASP.NET where you pass data to and from a database. However,
    we’ll


    examine them all.


    Accept-charset, enctype, and novalidate


    Th e accept-charset attribute, if specifi ed at all, usually assigns utf-8 as
    the character


    encoding to be used with the form data. Th at is, it treats all input as utf-8
    encoding. A


    simple statement like the following is suffi cient:


    <form  name=motherShip accept-charset=utf-8>


    If no character encoding is assigned, it is assumed to be unknown and uses the
    default


    character encoding. When using multiple encodings, each is separated by a space
    in HTML5


    instead of by commas and semicolons as in earlier versions of HTML.


    Most of the time, the enctype attribute is left blank and uses the default state.
    Th e enctype


    attribute has three keywords and states (keyword/state):


    „  application/x-www-form-urlencoded (default)


    „  multipart/form-data


    „  text/plain


    A form may be set up to accept plain text and would be assigned the following:


    <form  enctype=”text/plain”>


    For the most part, though, this is another attribute that is not included in the
    <form> tag.


    Th at’s because the default (urlencoded) is what you want.


    -ch14.indd 286


    -ch14.indd 286


