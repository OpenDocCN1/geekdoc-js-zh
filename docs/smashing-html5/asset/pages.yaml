    Although many diff erent formats are around for digital video, the ones that will
    be used for


    illustration and discussed in this chapter are the following:


    „  **H.264:**  .mp4 and .mov


    „  **OGG:**  .ogv


    „  **WebM:**  .webm


    „  **3GP:**  .3gp


    At the time of this writing (and quite possibly for the future) diff erent formats
    are going to


    run on diff erent browsers. However, using the <source> tag, you can easily reference
    several


    diff erent browsers. For example, the following code (SimpleVideoSource.html in
