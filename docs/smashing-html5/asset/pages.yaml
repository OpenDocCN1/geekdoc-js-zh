    That will give your


    ﬁ les a cleaner appearance, but if you have to decide between selecting a graphic
    ﬁ le with a .psd


    extension or a .png extension, you need to see what the extension is. Here’s what
    to do:


    **1\.** Open the Control Panel.


    **2\.** Choose Appearance and Personalization → Folder Options → Show Hidden Files
    and


    Folders.


    **3\.** Uncheck Hide Extensions for Known File Types (see the ﬁ gure).


    ![](img/a104289af2238490d8a60576b41416c5_42_3.png)


