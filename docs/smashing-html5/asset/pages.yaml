    DISPLAYING DATA


    WITH TABLES


    6


    WHEN HTML WAS in its infancy, the table


    element was used for the bulk of page formatting.


    Th e advent of CSS introduced a whole new set of


    rules for formatting and the table was abandoned


    as a formatting tool — and for good reason.


    However, certain table features in CSS3 have


    been reintroduced for specifi c types of format-


    ting. So, although tables still are not general


    formatting tools, they have key functions for


    displaying data sets and for CSS3 general


    formatting.


    Th is chapter explores the new CSS3 properties


    that you can use for accomplishing general


    formatting layouts, but the chapter’s main focus is


    on tabular data display. *Tabular data* is nothing


    more than data laid out in a table for ease of


    reading and not primary layout structures.


