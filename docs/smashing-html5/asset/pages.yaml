    ***189***


    PLACING IMAGES AND CREATING FLEXIBLE


    WEB PAGES


    Th e <img> tag is the primary one used to call up graphics, and although CSS3
    is the primary


    tool for getting things to go where you want on a Web page, you can use certain
    <img>


    attributes to help out. Th is section examines options you have for placing text
