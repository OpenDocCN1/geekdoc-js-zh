    helps to keep


    users from getting lost because graphic symbols with text are easy for the user
    to spot and


    understand.


    SINGLE-PAGE WEB SITES WITH IFRAMES


    Th ink of a Web site as a loading zone. Whenever, you click a link, you load another
    page —


    graphics and all. Sometimes, all you want to do is load just one thing. Th at
    saves the user from


    having to wait for all the other stuff to load or reload. If you know a bit of
    JavaScript and Ajax,


    you can do that, but what about with just HTML5? Th e answer is yes!


    Th is section examines how to link to graphics and change the graphic in an iframe.
    When


    creating applications designed specifi cally for mobile devices, you want to use
    as little


    bandwidth as possible. By changing just one thing on a Web page, the mobile device
    just has


    to load or reload a single item, so the response time is less.


    LINKING TO A GRAPHIC


    Generally, when we think of adding graphics to a page, we think of the <img> tag.
    Aft er


    all, that tag is what we use to place graphics on a Web page. However, you also
    can use the


    <a href> tag to load a graphic. Instead of assigning a Web page path to the href
    assignment,


    assign a graphic. For example, the following line of code loads a blank page with
    a graphic:


    <a href=”myGraphic.jpg”>My Graphic</a>


