    ***97***


    As you can see in the listing, the div element allowed two diff erent background
    styles in the


    section containers without having to add classes to the <section> tag. Overall,
    though,


    keep in mind that both <p> and <div> are more generalized elements, and at all
    times, you


    should use elements that are the most descriptive of your object on the Web page.


    Besides grouping and styling using the <div> tag, lists also serve to outline
    data. HTML5 still


    uses the <ul> tags to group baby names for boys and girls. However, a subtle yet
    important


    diff erence is built into ordered (<ol>) and unordered lists (<ul>).


    Th e use of unordered or ordered lists depends on the context. For example, in
    the 2010


    Fédération Internationale de Football Association (FIFA) World Cup in South Africa,
    four of


    the teams competing for the championship were Germany, Netherlands, Spain, and
    Uruguay.


    If you were listing them at the beginning of the competition, you might use an
    unordered list.


    At the end of the competition, you may want to use an ordered list to show the
    fi nal results.


    Th e following Web page (ol_ul.html in this chapter’s folder at www.wiley.com/go/


    smashinghtml5) refl ects the diff erent groupings depending on the context and
    the mean-


    ing that accompanies the context.


    <!DOCTYPE HTML>


