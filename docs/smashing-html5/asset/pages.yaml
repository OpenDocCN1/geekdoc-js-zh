    NESTING TAGS


    When you create an HTML page, you may nest tags —you can place one HTML5 container


    within another container. In fact, I’ve been doing that all along. Th e rule is:
    Add an end tag


    inside of a container before the container’s end tag. So, if you’re writing a
    tag within another


    tag’s container, be sure to close the inside container before closing the outside
    container. Look


    at the following examples to see what I mean.


    When to use (and not use) comment tags


    A general problem with comment tags is that they’re not used sufﬁ ciently in a
    Web page. Sometimes


    a few comments sufﬁ ce — and if a page only needs a few, you shouldn’t add more.
    Other times, a


    page needs a good deal more comments than it has. The number of comments required
    depends


    completely on the size and scope of the Web project and whether you’re working
    by yourself or with


    other developers.


    However, sometimes developers get carried away and have so many comment tags that
    you can’t see


    the ﬂ ow of the HTML code. A page with a long comment after every tag can act
    like barbed wire in a


    ﬁ eld — you keep tripping over it and can’t reach your destination. If a large
    number of comments are


    required for a complex page, put them together in a single container, and then
    the other developers


    can see the HTML code and understand how it’s used.


