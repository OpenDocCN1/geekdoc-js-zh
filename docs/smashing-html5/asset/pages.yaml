    for all PHP


    operators, the one examined in the next few sections will have you up and running.


    Assignment


    To assign a value to a variable or object, the equal sign (=) serves as the assignment
    operator.


    Compound PHP operators assign the value of the current variable plus, minus, multiplied
    by,


    or divided by the assigned value. Th e following example (assignment.php in this
    chapter’s


    folder at www.wiley.com/go/smashinghtml5), shows the key uses of assignment


    operators:


    <?php


    $sampleNum=20;


    $sampleString=”Hurricane”;


    $sampleNum  +=  50;


    $sampleString  .=  “ is coming.”;


    echo $sampleNum,”<br>”;


    $sampleNum  *=  2;


    echo $sampleNum,”<br>”;


    $sampleNum  /=  4;


    echo $sampleNum,”<br>”;


    echo $sampleString;


    ?>


