    ***221***


    CONVERTING TO 3GP: ADOBE MEDIA ENCODER CS5


    In converting to 3GP format for displaying on mobile devices, Adobe Media Encoder
    CS5


    (AME) was found to provide many advantages. Th e encoder ships with several diff
    erent


    Adobe products, and for this book I tested it with Adobe Premier while editing
    MP4 fi les


    generated by a high-defi nition (HD) video camera.


    Besides having the ability to convert fi les into 3GP format, AME was able to
    do some basic


    editing itself. Th e most important function was to reduce the dimensions of the
    video and,


    therefore, the fi le size and the amount of time it took to stream the video over
    the Internet.


    Th is is especially crucial for mobile devices.


    Figure 11-4 shows a fi le that natively was saved in a 720 x 480 format. Th en
    it was reduced to


    320 x 212\. Typically, videos are formatted in a 4:3 ratio. However, HD format
    of the video


    camera used is 16:9, so the dimensions are wider than what you could expect in
    a video


    created using a built-in webcam on your computer. When preparing video for the
    Web, that


    can be a major consideration. Likewise, when setting the width and height attributes
    in a


    <video> tag, don’t forget the changed dimensions.


    ![](img/a104289af2238490d8a60576b41416c5_234_2.png)


    Figure 11-4: Converting ﬁ les using Adobe Media Encoder.


    As you can see in Figure 11-4, AME provides a good deal of fi le information.
    In the left panel,


    it visually displays the fi le you’re currently working with.


