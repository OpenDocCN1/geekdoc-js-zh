    CSS3 TABLE PROPERTIES FOR HTML5


    In a classic statement of double messages, the World Wide Web Consortium (W3C),
    the


    offi cial body that sets the standards for HTML5, states emphatically, “Tables
    must not be used


    as layout aids.” Th en in a note following that admonition, the same document
    states, “Th ere


    are a variety of alternatives to using HTML tables for layout, primarily using
    CSS positioning


    and the CSS table model.”


    What this means is that, in general, table elements should not be used for layouts
    other than


    tabular data. However, if you need tables in layouts, use CSS3 table properties.


    Th e reason for this admonition is that when CSS became available, all layout
    was to be done


    with CSS. In order not to dissuade designers and developers from using the CSS3
    table


    properties (only), W3C added the note that it was okay to use CSS3 table properties
    and


    attributes in layout. So, if you’re familiar with all the old warnings about not
    using table


    elements in layout, rest assured that CSS3 table properties are fi ne for design
    — up to a point.


    In order to see what this CSS3 feature can do for a design, the fi rst step is
    to look at the CSS3


    display property value of table and table-cell. Th e display property can be envi-


    sioned as a layout statement. Th e values within the display map out how the display
    is to be


    arranged. One of the easiest ways to make a display is to use the table and table-cell
    values. It


    might be helpful to think of the table property as a big container and the table-cells
    as the


    individual cells in the container. As far as more sophisticated designs are concerned,
    table-


    cells are pretty close to a table as a design tool and all the associated problems
    inherent in it.


