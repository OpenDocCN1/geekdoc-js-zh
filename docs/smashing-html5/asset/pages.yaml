    <head>


    <script type=”text/javascript”>


    AddingMachine=new Object();


    //Object properties


    AddingMachine.firstNumber=4;


    AddingMachine.secondNumber=66;


    //Object method


    AddingMachine.total=function()


    {


    document.write(this.firstNumber + this.secondNumber);


    }


    //Fire off the method!


    AddingMachine.total();


    </script>


