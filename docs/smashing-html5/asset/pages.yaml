    Hue and light are fairly intuitive to understand, but saturation can be a little
    murky. Essen-


    tially, saturation is the amount of colorfulness in a given color. A 100 percent
    saturation is the


    full colorfulness of a hue in a given light, while a lower percent subtracts from
    a hue — some-


    thing like a color fading. For all colors, a midpoint light is going to be gray
    when saturation is


    0 percent. Sometimes a faded or muted color is preferred, like blue jeans that
    have been


    washed many times.


