    THE LIST ATTRIBUTE, THE URL TYPE, AND DATALISTS


    One of the new attributes that can be used with forms is list. At the beginning
    of this


    chapter, I noted that Web pages should be smooth, interactive experiences for
    users. Th e less


    work that users have to put into an interactive form the better. Th e list attribute
    provides a


    list of suggested items in an input element, and users may select from the list
    or type in a


    response. However, the list attribute is actually a reference to a <datalist>
    tag elsewhere


    in the Web page. Further, if you place the <datalist> container within a <form>
    con-


    tainer, the <input> elements aft er the data list don’t show up on the page. So,
    what you have


    to do is to provide an id attribute in the <datalist> tag and assign it to the
    list attribute


    in the <input> tag. Th e data list is kept outside of the <form> container but
    is connected


    through the data list’s id.


