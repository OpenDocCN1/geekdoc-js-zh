    think that we can look at four diff erent kinds of fi le containers and codecs
    and use the four


    listed at the beginning of the chapter. Th e 3GP container format is related to
    MPEG-4, but it’s


    actually an H.263 format, and its primary adoption has been for mobile devices
    like the


    iPhone. Table 11.1 shows the compatibility matrix of the major browsers on which
    video tests


    have been made or decisions have been made.


