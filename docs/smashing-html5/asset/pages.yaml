    USING THE DOCUMENT OBJECT MODEL


    Th e Document Object Model (DOM) for HTML5 represents a hierarchy tree. At the
    base


    (root) of every Web page or document is the <html> tag, and the rest of the elements
    in the


    page are a branch somewhere along the tree. JavaScript uses the DOM for addressing
    and


    manipulating a Web page beyond what you can do with HTML5 alone. Th e entire DOM
    tree


    is a representation of the document that resides in your computer’s memory.


    When any part of the DOM tree is addressed, it does so by referencing an element
    within the


    tree, beginning with document. Each element in the tree is addressed in order
    of the


    hierarchy beginning with document. Th e diff erent elements in a Web page are
    the diff erent


