    THE TOP OF THE HTML5 DOCUMENT


    Th e fi rst four chapters of this book explain much of how the information above
    the <body>


    tag is put to use. Th e code above the <body> tag adds no content to the Web page,
    but it


    infl uences how the page appears and informs the browser that it’s a Web page
    and what kind


    of Web page it is. Figure 5-1 shows the general organization of the fi rst part
    of the Web page.


    ![](img/a104289af2238490d8a60576b41416c5_99_2.png)


    Figure 5-1: Organizing the top of a Web page.


    Th e <html> tag is the root element, and within that element, you can include
    a language


    attribute. Th en within the <head> container are metadata elements. Also in the
    <head>


    container are the scripting elements; they, too, are briefl y covered in this
    section and


    expanded upon in Part IV of this book.


    Other than the CSS3 scripts, the examples so far have not put a lot of tags into
    the head of


    the HTML5 document. Th e <meta> tag has many uses, but so far, we’ve used it only
    to


    specify the character set. Th is chapter shows more uses for the <meta> tag.


