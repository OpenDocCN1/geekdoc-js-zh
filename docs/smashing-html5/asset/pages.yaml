    TAKE THE WHEEL


    Setting up a Web site of your own can be a lot of fun, and one of the tasks is
    to get all the links


    working in concert. In the next chapter, you’ll learn about navigation strategies,
    but for now


    you need some practice in getting a set of links and icons ready. Here’s your
    challenge:


    **1\.** Create three Web pages. Include several sections with headings and subheadings
    so that


    each will go beyond a vertical screen viewing area. (In other words, the viewer
    would


    have to scroll down in order to see the bottom sections.)


    **2\.** On each of the Web pages, set up a link to an icon (see “Link icons” in
    this chapter). It’s


    up to you whether you want each page to have a page icon (all diff erent) or a
    site icon (all


    the same).


    **3\.** Create two diff erent CSS3 style sheets (external) and provide alternate
    styles and access to


    them on all the pages (see “Alternate style sheets” in this chapter).


    **4\.** Create a third style sheet that has nothing but IDs that will be used
    as anchors. Place an


    ID in each section of your pages.


    **5\.** Finally, create links on each of the three pages that will link to the
    other two pages and all


    the IDs on each page.


    Make this exercise fun for yourself. You can create pages to do anything you want.
    Th ere’s no


    reason to be serious (unless you have a client in mind!). So, don’t worry about
    the content, but


    make it exactly what you’d like.


