    Given the array of compatibility between browsers and fi le formats, you need
    to know how


    to convert between the diff erent formats. Th is next section examines how to
    do that. Th e


    conversion needs to happen fi rst between the fi le type used by the recording
    instrument (a


    camera or screen-sharing application) or video-editing soft ware. Th e second
    type of conver-


    sion is between the video fully prepared for the Web and the possible types of
    fi les required


    for HTML5 pages. Once all the types of fi les needed are ready, all you have to
    do is place them


    in <source> tags within a <video> container.


    MAKE MINE WEBM: THE MIRO VIDEO CONVERTER


    Of all the fi le formats tested, only Opera worked with the WebM format. However,
    several


    other companies who make browsers are also involved in the WebM project, and so
    in the


    Letting the pundits do their job


    Technology pundits seem to dwell on the complex and interesting issues surrounding
    why different


    companies have chosen particular formats. Apple, Microsoft, Google, Opera, Adobe,
    and Mozilla


    selected the ﬁ le formats they did for reasons that have to do with patents, use
    rights, licenses, and


    ﬁ nancial considerations, as well as integrating the technology into other plans
    they may have. All you


    need to be concerned with is what works for your Web sites — wondering why one
    technology is


    preferred over another by the browser providers is best left to the pundits. You
    just need to know what


    will work and how to implement it.


