    DATE PICKER


    Th e last input attribute we have space to cover in this chapter is simple to
    implement but has


    impressive results. Th e new date attribute for the input element is powerful
    and easy to


    include in a form. Several new date and time attributes have been added to the
    input element,


    but only the date attribute itself is shown. Th e following program (Pickers.html
    in this


    chapter’s folder at www.wiley.com/go/smashinghtml5) shows you how to set it up
    and


    use it to send information.


    <!DOCTYPE HTML>


    <html>


    <head>


    <script  type=”text/javascript”>


    FormMaster=new Object();


    FormMaster.resolveForm=function()


    {


    alert(document.calendar.dateNow.value);


    }


    </script>


    <meta  http-equiv=”Content-Type”  content=”text/html; charset=UTF-8”>


    <title>Date</title>


    </head>


    <body >


    <form  name=calendar>


    <input  name=dateNow type=”date”  onChange=”FormMaster.resolveForm()”>


    </form>


    </body>


    </html>


    With just that little markup in the form container, you’re able to build a complete
    calendar.


    You can use the onChange event handler to capture the date selected from the calendar.


    Figure 14-6 shows the application in an Opera browser (the only one found to work
    so far


    with this new input attribute) in a Windows 7 environment.


    In this particular implementation, as soon as the user makes a selection, the
    alert window


    opens and shows the selected date, as shown in Figure 14-7.


    Th e purpose is to show how easy it is to pass the selected date value. Such data
    could be stored


    in a database to make online reservations.


