    All storage is done in key/value pairs. Th e key is an identifi er for a given
    value. (Th e key is


    something like a variable with a label and an assigned value.) Th e next two sections
    explain


    how to work with session and local storage. Global and database storage are less
    universally


    implemented at this time, so I’m setting them aside.


    SESSION STORAGE


    Session storage allows users to store data for a single Web page as long as that
    Web page is


    being viewed. As soon as the user leaves the page, all stored data is lost. For
    interactive games,


    calculators, and any other kind of page that needs temporary storage while the
    page is viewed,


    you can use session storage.


    To get started, you’ll need to take look at the setters and getters of session
    storage. Here’s the


    basic format for setting (storing) a value:


