    If you look at the original Wittgenstein, you’ll fi nd that his style of writing
    used an indented


    outline that appeared as the following:


    1 Th e world is all that is the case.


    1.1 Th e world is the totality of facts, not of things.


    1.11 Th e world is determined by the facts, and by their being all the facts.


    1.12 For the totality of facts determines what is the case, and also whatever


