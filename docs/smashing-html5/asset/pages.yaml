    categories:


    „  Animal


    „  Vegetable


    „  Mineral


    Th at’s certainly global and links would fi t nicely on every page like the following:


    Animal | Vegetable | Mineral


    However, within each of those general categories, you’re going to need something
    more


    specifi c. For example, suppose a user wants to fi nd a breed of dog — a Greater
    Swiss Moun-


    tain Dog. Th e following path would be a possible one depending on the designer:


    Animal


    Mammal


    Dog


    Breeds


    Greater Swiss Mountain Dog


    Each submenu will have lots of choices, so let’s consider what elements are available
    in


    HTML5 to handle these navigation paths from global navigation.


