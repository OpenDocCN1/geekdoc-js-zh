    1 Th e world is all that is the case.


    2 What is the case — a fact — is the existence of states of aff airs.


    3 A logical picture of facts is a thought.


    4 A thought is a proposition with a sense.


    5 A proposition is a truth-function of elementary propositions. (An elementary
    proposi-


    tion is a truth-function of itself.)


    6 Th e general form of a truth-function is [p, E, N(E)]. Th is is the general
    form of a


    proposition.


    7 What we cannot speak about we must pass over in silence.


    Th e hgroup element is tied into the outline algorithm in HTML5, and although
    it’s unlikely


    that you’ll be using it for writers like Wittenstein, it is useful for helping
    you think about your


    page in terms of the structure within an HTML5 page. One way to think about the


    <hgroup> tag is as a mask (or even a Romulan cloaking device) over other h elements
    below


    the highest-level element in the hgroup container. In our example, the h3 and
    h4 are


    masked and only the h2 element is recognized as part of the outline.


    ADDING STYLE TO TEXT WITH CSS3


    Th roughout the book, the reference to Cascading Style Sheets will be to CSS3\.
    Th at’s because


    HTML5 and CSS3 are paired in many aspects, but like other elements I discuss in
    this book,


    those continued from earlier versions have been incorporated in the newest version
    of HTML


    and CSS. We really have a mix of new and old in CSS3, just as in HTML5\. So, if
    you’re familiar


    with older versions of CSS and you see the same properties in CSS3 references,
    just treat it as


    a continued feature.


    STYLING HTML5 ELEMENTS WITH CSS3 PROPERTIES


    In Chapters 1 and 2, you saw examples of CSS3 but were given no explanation of
    what was


    going on to add a new style to an existing element. Here, the focus is on adding
    style to h


    elements. In the next three chapters, you’ll see far more aspects of using CSS3\.
    Here, I focus


    on the basics of incorporating CSS3 into your HTML5.


    All style sheets can be added in three ways:


    „  You can use the <style> tag to defi ne the properties of elements in the HTML5
    page.


    „  You can use external style sheets, which are text fi les where you store a
    style you may


    want to reuse.


    Most professional developers and designers prefer the CSS3 external style sheets
    because


    perfecting the desired style takes a lot of work. When you want to make a change
    to the


    design of a Web site, you can make changes to many pages that use an external
    style sheet, just


    by changing the one style sheet. It’s just more effi cient than having to change
    the <style>


    attributes in each individual Web page.


