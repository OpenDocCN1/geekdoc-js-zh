    message,


    that means (alas) you don’t have an HTML5 browser. (But you can see the photo
    and


    caption.)<br>


    <figure>  <img  src=”fisherkid.jpg”  width=”300”  height=”272”  alt=”kid fishing”/><br>


    <figcaption>Kid Fishing</figcaption>


    </figure>


    </canvas>


    </body>


    </html>


