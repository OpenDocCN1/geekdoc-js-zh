    Hierarchical and sequential link types


    You can organize your links using both hierarchical and sequential link types.
    Th e hierarchi-


    cal rel values include index and up. Th e up value refers to a level up in the
    hierarchy, and


    index refers to the very top. For example, the following code references a directory
    that is


    the top of the hierarchy, three levels up from the calling page.


    <a href=”/” rel=”index up up up”>Home</a>


    Th e clearest path in the example is made by referencing both the index and the
    number of


    up levels.


    Th e sequential link types include first, last, next, and prev with each keyword
    relative


    to a page within a sequence. For example, the following code goes to the next
    page relative to


    a page in the sequence:


    <a href=”page4.html” rel=”next”>Page 4</a>


    Th e implementation of these link types is diff erent for diff erent browsers,
    and they’re better


    used with the link element to map out a site’s organization relative to a given
    page than to


    direct a page using the a element.


