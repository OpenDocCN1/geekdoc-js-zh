    **CHAPTER**


    ORGANIZING


    A PAGE


    5


    MANY OF THE new tags in HTML5 are


    organizational tags. In previous chapters some


    have been used but not really explained. Th is


    chapter looks closely at organizing HTML5 pages


    with the help of CSS3 and a way of understand-


    ing this organizational process. Some of the


    organizational elements become clear only once


    you start using JavaScript, but if you set up your


    page according to HTML5 guidelines, your page


    will be good to go when you start adding a little


    JavaScript.


