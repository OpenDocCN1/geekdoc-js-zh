    ***149***


    linked item. In order for the MoMA site to work, some fancy coding was required
    under


    the hood. Th e code would warm the cockles of any developer’s heart, but it led
    to a disaster


    because, like the designer, the developer was thinking about what a talented coder
    he was and


    not about the user experience. Getting the link name to pop up when the mouse
    moves over it


    takes some coding talent that the designer did not posses. So, if you want to
    make a really


    terrible navigation system combine the best designer and the best developer!


    Can you be a good designer and/or developer and still create good interfaces?
    Sure, but you


    have to think about it. You must take the view of your typical user into consideration.
    Who


    are your users? Are they children or adults? Is your audience men, women, or both?
    What


    age group? What is the user’s style? Are they businesspeople? If so, what kind
    of business and


    where are they in the organization? Are they managers or are they the people who
    do the


    actual work? Find out who your users are. (You already know who you are.)


    If you’re a designer and you’re making a Web site for other Web designers, do
    you want to


    show them what a good designer you are or how they can become better designers?
    Likewise,


    if you’re a developer and you’re making a site for other developers, you defi
    nitely want to


    show them code that will allow them to do some seriously sick programming. Developers


    want to see some code. However, designers do not want to see code — they’re more
    interested


    in design tools and techniques, not code. (Of course designers, love CSS3 code!)
    Work what


    your user base wants into your navigation plan.


    Th e very best way to fi nd out if your interface is good is to test it with typical
    users. If you’re


    making an educational site for third-graders, you want third-graders to test it.
    Likewise, if


    you’re selling haute couture to wealthy women, you don’t want teenage girls to
    test your


    navigation. It may take a little extra time, but you’ll have a far better site
    if you test your site


    with the type of audience who will use it.


    Knowing your users does not mean that you have to have dowdy design or use low-end


    technology in your site. What it means is that you need to get to know your users
    and fi nd out


    what they think your site will do for them. You’re not going to change your users.
    Make your


    site for them, not for you. If the site is not for your users, they won’t return.


    GLOBAL NAVIGATION


    Global navigation in Web pages refers to broad navigation categories that can
    be placed on


    every page in a Web site. Global navigation helps users keep track of where they
    are in a site,


    so no matter where they go, they’ll see a familiar road map.


    In mapping out a trip from Santa Barbara, California, to Ocean City, New Jersey,
    you’ll fi nd


    major interstate highways. Th e links go from I-210 > I-15 > I-40 > I-44 > I-70
    and fi nally to


    I-76\. Th ese might be considered the global elements in the 3,000-mile trip from
    coast to coast.


    However, between the major interstate highways, you’ll fi nd smaller connector
    roads such as


    CA-134E that connects US-101 with I-210.


