    <h2>  <a href=”#” onDblClick=”detectDoubleClick()”>Double-Click This</a>


    </h2>


    </hgroup>


    </body>


    </html>


    Th e JavaScript functions can be whatever you want them to be, which enables you
    to interact


    far more with the users. You can provide instructions, options, cautions, or whatever
