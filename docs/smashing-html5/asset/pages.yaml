    TEXT TAGS AND


    A LITTLE CSS3


    3


    A WEB PAGE is unlike the kind of page you put


    in your word processor and start typing. Web


    pages are designed for computer screens of some


    sort — whether it’s a big desktop, a laptop, or


    even a mobile device. You’re not dealing with an


    8¹⁄2-by-11-inch sheet of paper — you’re dealing


    with a far more dynamic viewing platform. So,


    the fi rst thing you want to think about is how


    your page is going to look on a digital screen.


