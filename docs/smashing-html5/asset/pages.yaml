    CREATING AUDIO FILES


    Both Windows 7 and Macintosh OS X include programs that you can use to create
    your own


    audio fi les. Th ey come loaded on your computer, and unless you removed them,
    you should


    be all set to get started making sound recordings.


    Earlier versions of Windows also have a Sound Recorder application, but it looks
    diff erent


    from the one used in the example. Also, the Sound Recorder that is part of Windows
    XP saves


    fi les to .wav format, so they’re all ready for a Web page. However, the newer
    version of Sound


    Recorder that ships with Windows 7 only saves fi les in .wma format and must be
    converted to


    a fi le type recognized by HTML5 browsers.


    WINDOWS 7 SOUND RECORDER


    Th e fi rst thing you want to do when you make a recording is to set up some kind
    of micro-


    phone for the recording. Most computers that run Windows 7 have built-in microphones,
    and


    you can use those. Otherwise, you’ll need to plug in the microphone you plan to
    use and


    make sure it’s properly confi gured. Usually, your computer can fi nd the audio
    drivers you


    need, but some microphones come with soft ware drivers that you need to install.
    Directions


    for such installations will come with the microphone.


    To select a microphone, use the following path: Control Panel > Hardware and Sound
    >


    Manage Audio Devices. When the Sound window opens, select the Recording tab. You’ll
    see


    the selections shown in Figure 10-2.


    Your recording selections may be diff erent, but in general you’ll either have
    a line-in or a


    built-in microphone. When you make a selection, click OK, and you’re now ready
    to open the


    Sound Recorder application.


    From the Start menu, select All Programs > Accessories > Sound Recorder. (If you’re
    running


    Windows XP, choose All Programs > Accessories > Entertainment > Sound Recorder.)
    Figure


    10-3 shows what the Sound Recorder looks like when it’s ready to record (top)
    and while it’s


    recording (bottom).


