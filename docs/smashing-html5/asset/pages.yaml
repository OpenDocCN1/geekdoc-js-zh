    far more portable. Th ey were designed from the ground up for use in creating
    videos for


    social-networking sites like Facebook and YouTube; as a result, their native output
    fi les are


    custom-ordered for displaying with HTML5 video elements.


    STANDARD CAMCORDERS


    Th e term standard here refers to handheld camcorders with such features as zoom
    lenses,


    mini DV tape cassette storage, fl ash memory cards, and other features that can
    be placed on


    larger platforms. Th e gamut of camcorders has widened to the point where the
    range is from


    inexpensive ones used for personal family recordings all the way to those used
    by independ-


    ent fi lmmakers.


    Like the (really) small camcorders the standard ones come with USB or IEEE 1394
    Firewire


    connectors. Th e connectors can them be fed directly into video-editing soft ware
    like Adobe


    Premier, Apple Final Cut, or Vegas. Th e edited video can then be saved to a format
    that can be


    used by HTML5 browsers.


