    Changing JPEG ﬁ le sizes


    Beginning with a very large TIFF fi le that must be converted to either a PNG,
    JPEG, or GIF


    fi le, the fi le-editing process begins with three levels of quality — maximum,
    medium, and low.


    Figure 9-5 shows the original TIFF fi le and three JPEG renderings.


    Th e original TIFF image in the top-left corner is over a half a megabyte, and
    it needs to be


    slimmed down signifi cantly and converted into a format that HTML5 browsers can
    read. Th e


    top-right fi gure in JPEG format is set to the maximum quality — 100\. On the
    bottom row, the


    bottom-left fi gure is low quality set to 2, and the bottom-right fi gure is considered
    medium


    quality, set at 60\. Th e smallest Web fi le is only 8.6K and the largest is 127.1K.
    A quick glance


    shows very little diff erence with this particular image.


    To get a more defi nitive idea, the two extremes of Web quality settings are saved
    to disk. Th en


    (on a Macintosh) each is viewed for the size settings as shown in Figure 9-6.


    ![](img/a104289af2238490d8a60576b41416c5_196_2.png)


    Figure 9-6: Checking image ﬁ le properties.


    In looking at Figure 9-6, you can see that both have identical dimensions (432
    x 343), but one


    has 12 KB of information and the other has 139 KB. Th e reason for beginning adjustments
    by


    comparing the best and the worst quality as implied in the fi le size is that
    visual diff erences


    are more apparent. Perception studies have found that examining minute diff erences
    tends to


    gloss over those diff erences, whereas extreme diff erences are clear, so when
    you begin making


    adjustments, it’s better to start with the big diff erences. Figure 9-7 shows
    the two fi les on a


    Web page.


