    Making the drawing


    Before going on to the actual drawing, you may be wondering about the canvasNow
    and


    contextNow objects. Aren’t those really variables? Aft er all, variables can be
    assigned


    objects. Well, that’s one way to think about them, but the variables are assigned
    objects with


    their own methods and properties. So, aren’t they actually instances of objects?
    When a


    variable is assigned a real number, it is, for all intents and purposes, a number.
    You can do


    math operations just as you can with a literal number. Instead of quibbling about
    whether the


    program structures are really variables or objects, just treat them as objects
    (just as variables


    with text or numbers can be treated as strings or numbers).


    First, assign the drawing a color. You can use any of the techniques available
    to create a color


    as described in Chapter 4\. Th is example uses the hexadecimal format:


    contextNow.fillStyle = ‘#cc0000’;


    Th e fillStyle property is only for the fi ll color and not the stroke (outline)
    of the object.


    Next, the fi ll color needs a shape to fi ll. To fi ll a rectangle, use the following:


    contextNow.fillRect(5,20,100,100);


    To explain everything in that last piece of code, Figure 13-4 breaks it down.


    ![](img/a104289af2238490d8a60576b41416c5_271_2.png)


    X position


    Y position


    Width


    Height


    Figure 13-4: Details of the fillRect() method.


    Th e fi rst two values place it within the canvas area — not the whole Web page
    — and the


    second two values specify the width and height of the rectangle.


    Th e last requirement is actually to carry out fi lling the rectangle with the
    specifi ed color. Th e


    next line performs that task:


    contextNow.fill();


    No matter how many operations are defi ned, a single fill() method takes care
    of all the


    fi lls defi ned in the larger method.


