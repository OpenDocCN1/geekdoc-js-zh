    easily convert their .ai fi les to .svg fi les containing parts that can be dynamically
    changed


    using HTML5.To give you an idea how it works, the following example begins with
    a simple


    graphic image in AI. It has two layers, and on one of the layers, the designer
    wants variable


    color that can be coded in HTML5\. Th e layer to be given a variable feature is
    selected and


    viewed in the Appearance panel (as shown in Figure 9-15).


