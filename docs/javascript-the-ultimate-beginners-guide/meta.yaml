  md: '# The “onsubmit” Event


    This event happens whenever a user submits a form. Typically, programmers link
    their form validations to this kind of event.


    # The “onmouseout” and “onmouseover” Events


    These two kinds of events can help you add cool effects (e.g. text, images, etc.)
    into your HTML documents. Basically, “onmouseout” runs once the user moves the
    mouse out of an element. On the other hand, “onmouseover” runs once when the user
    brings the mouse over an element.


    # The Standard Events in HTML 5


    The following table shows the standard events supported by HTML 5.


    | Attribute | Explanation |

    | --- | --- |

    | onblur | This event happens whenever a window loses focus. |

    | Offline | This event occurs when the HTML file becomes offline. |

    | oncanplay | It happens when a playable media is present. The playable media
    might need to stop because of buffering. |

    | onabort | It occurs during an abort situation. |

    | onbeforeprint | This event occurs before the system prints the HTML document.
    |

    | onafterprint | This event happens once system has printed the HTML document.
    |

    | onclick | It happens when the user clicks the left-side button of his mouse.
    |

    | ondblblclick | This event occurs when the user double-clicks the left-side button
    of his mouse. |

    | ondrag | It happens when the user drags an HTML element. |

    | onchange | It occurs when an HTML element changes. |

    | ondragend | It happens once the user stops dragging an HTML element. |

    | onmouseup | This event occurs whenever the user |'
