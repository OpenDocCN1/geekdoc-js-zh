    }\n```\n\n重要说明：此部分是完全可选的。\n\n- 3. \"finally\" 部分 – 它包含在执行完之前的部分后将运行的语句。放置在 \"\
    finally\" 部分的语句无论程序是否遇到异常，都会运行。此外，即使语句没有 \"catch\" 部分，该部分内的语句仍然会运行。\n\n通常情况下，程序员使用此部分在发生异常时为项目设置优雅退出。例如，他们可能需要释放受问题脚本影响的一些资源。下图将帮助你理解该部分是如何运作的。\n\
