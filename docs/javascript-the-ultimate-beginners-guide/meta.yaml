    \ function. To determine the\nquantity of arguments inside a function, you may\
    \ use arguments.length. Then, you may use the\n“arguments” object to access the\
    \ function’s arguments.\n\n# The Parameters of a Function\n\nCurrently, JavaScript\
    \ supports two types of parameters: default and rest.\n\n# The Default Parameters\n\
    \nIn the JavaScript language, the default parameter of any function is “undefined.”\
    \ In most situations\nhowever, it is beneficial to change this default value.\
    \ The default parameters can help you in this\nregard.\n\nBefore, the usual approach\
    \ for setting a default value was to check parameter values inside the\nfunction’s\
    \ body and assign a new value if the system shows “undefined.” With the default\
    \ parameters,\nyou’t have to check the function’s body anymore. You may just assign\
    \ numbers or strings as the\nnew default value of your functions.\n\n# The Rest\
    \ Parameters\n\nThis kind of parameter allows you to represent any number of arguments\
    \ as a simple array. In the\ncode below, you’ll use rest parameters to get the\
    \ second, third and fourth arguments. You can then\nultiply them using the first\
    \ argument.\n\n```\nfunction multiply(multiplier, ...theArgs) {\n  return theArgs.map(x\
    \ => multiplier * x);\n}\n\nvar arr = multiply(2, 1, 2, 3);\nconsole.log(arr);\
    \ // [2, 4, 6]\n```"
  merge: -1
