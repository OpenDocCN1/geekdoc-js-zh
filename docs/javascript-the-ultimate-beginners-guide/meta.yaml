    \ objects. The main difference between functions and other JavaScript objects\
    \ is that you can invoke them whenever you need to.\n\n### What is a Function?\n\
    \nIn JavaScript, each function is treated as a unique object. Also, functions\
    \ are different from procedures. Functions return a value 100% of the time, while\
    \ some procedures don’t.\n\nYou must add a “return” statement in functions if\
    \ you want them to return a value. The “return” statement specifies the value/s\
    \ that must be returned. Functions that don’t have a return statement give a default\
    \ value. In most cases, the default value of a function is “undefined”.\n\nThe\
    \ arguments of a function are the parameters used in calling it. JavaScript uses\
    \ values to pass to arguments to a function. If a function modifies an argument’s\
    \ value, the modification will not appear globally or inside the function itself.\
    \ However, an object reference is a value too (and a special one at) – if a function\
    \ alters the properties of a referred object, the alteration/s will appear globally.\n\
    \n### How to Define a Function\n\nIn JavaScript, you can define functions in different\
    \ ways. Let’s discuss each approach in detail:\n\n- Using the function statement\
    \ – JavaScript offers a special syntax that you can use to declare a function.\
    \ The syntax is:\n\n```javascript\nfunction name([param, param[, ... param]])\
    \ {\n  statements\n}\n```\n\nThat syntax has three different parts, which are:\n\
    \n- name – This is the name of the function. You may replace this with any valid\
    \ identifier.\n- param – This is the argument/parameter that you want to pass\
    \ to the function. JavaScript allows you to include up to 255 parameters in each\
    \ function.\n- statements – This section holds the statements (i.e. the body)\
    \ of a function.\n\n- Through the function expression – This approach is similar\
    \ to the previous one. In fact, it uses the syntax (below):\n\n```javascript\n\
    function [name]([param, ... param]) {\n  statements\n}\n```\n\n- JavaScript’s\
    \ “Function Constructor” – JavaScript allows you to generate one using “new” (i.e.\
    \ a JavaScript operator). Here is the syntax that you must use:\n\n```javascript\n\
    new Function(arg1, arg2, ... argN, functionBody)\n```\n\nThe syntax given above\
    \ has the following parts:\n\n- arg1, arg2, ... argN – This part holds the name/s\
    \ you want to use as the formal parameter/s.\n- functionBody – This is a string\
    \ that holds JavaScript statements (i.e. the body of the function).\n\n## How\
    \ to Call a Function\n\nWhen defining a function, you are naming that function\
    \ and assigning what to be done once the function is invoked/called. Call a function\
    \ if you want it to perform the assigned actions. For instance, if you have defined\
    \ the “square” function, you may call it using the following code:\n\n```javascript\n\
    square(2);\n```\n\nThe code given above calls the “square” function and assigns\
    \ 2 as the argument. The function runs its statements and gives 4 as the resulting\
    \ value. Your functions must be within the proper scope when you call them. However,\
    \ you can hoist (i.e. to the top) your function declarations. Here’s an example:\n\
    \n```javascript\n1 console.log(square(5));\n2 /* ... */\n3 function square(n)\
    \ { return n*n }\n```\n\nA function’s arguments may hold different programming\
