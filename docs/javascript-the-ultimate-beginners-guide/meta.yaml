  md: '# Chapter 11: Debugging


    Programmers are humans – they make mistakes every now and then. Mistakes in a
    script or a program are called “bugs.”


    The act of searching for and resolving bugs is known as “debugging” Programmers
    consider debugging as an important aspect of the development procedure. This chapter
    will discuss the tools and methods that you can use to perform debugging tasks.


    # The Error Messages in Internet Explorer


    The simplest approach to find errors is by activating the “Error Information”
    option of a web browser. Internet Explorer, for instance, displays an icon in
    its status bar whenever an error occurs on a webpage. Here’s a screenshot:


    ![](img/5f2b3a2ec7b622cf6e5316b81058bdcc_45_0.png)


    If you’ll double-click on that icon, Internet Explorer will display a dialog box
    containing details about the error it encountered.


    Since you can easily overlook this icon, Internet Explorer allows you to set the
    system so that it will display the error dialog box each time an error happens.
    To turn on that option, just click on “Tools” and hit “Internet Options.” Click
    on the tab named “Advanced” and put a check on the box that says “Display a Notification
    about Every Script Error.”


    Here’s a screenshot:'
  merge: -1
  pgno: 45
- img_proc: true
  md: '![](img/5f2b3a2ec7b622cf6e5316b81058bdcc_46_0.png)


    # The Error Messages in Netscape and Firefox


    Netscape and Firefox send error details to a window named "Error Console" or "JavaScript
    Console." You can view this window by clicking on "Tools" and selecting "Error
    Console."


    However, because these two browsers don''t have an error icon, you have to keep
    the Error Console open as you execute your JavaScript codes.


    # The Error Notifications


    The error notifications that you see on your browser (e.g. Internet Explorer,
    Netscape, Firefox, etc.) are caused by runtime and syntax errors. These notifications
    contain detailed information (e.g. line numbers) regarding the error. That means
    you can use these error notifications to find and solve errors quickly.


    If you are using Mozilla Firefox, you may click on the errors listed in the Console
    to check the exact line that caused the problem.


    # Debugging your Scripts


    JavaScript offers a powerful approach in debugging a script:


    **Using a validator** – In JavaScript, you may use a validator to ensure that
    your codes follow the syntax rules of this language. Validators (also known as
    validating passers) usually come with premium JavaScript and HTML editors.


    JavaScript Lint, which was developed by Douglas Crockford, is one of the leading
    validators today You can use it for free here: http://www.jslint.com/


    Just access that webpage, paste the Javascript code onto the editing area, and
    hit the button that says "JSLint." This computer program will analyze your code,
    making sure that each of its parts follows the right syntax.'
