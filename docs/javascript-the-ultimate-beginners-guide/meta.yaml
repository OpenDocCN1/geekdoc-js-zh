    ## Introduction\n\nI want to thank you and congratulate you for getting my book...\n\
    \n“JavaScript: The Ultimate Beginner’s Guide!”\n\nThis book will help you become\
    \ an effective JavaScript user. If you want to learn the basics of the JavaScript\
    \ language quickly and easily, then you must get this book now.\n\nThis book will\
    \ explain important facts regarding the JavaScript language. It doesn’t contain\
    \ any irrelevant information. Each page holds valuable lessons, instructions and\
    \ examples. After reading this book, you’ll be familiar with objects, functions,\
    \ variables, statements and other JavaScript elements.\n\nThanks again for purchasing\
    \ this book, I hope you enjoy it!\n\n## Chapter 1: General Information\n\nJavaScript\
    \ is an object-oriented scripting language that you can use in different platforms.\
    \ Within host environments (e.g. web browsers), you may use JavaScript to gain\
    \ programmatic control over an object.\n\nThis scripting language comes with a\
    \ rich standard library. This library holds objects (e.g. Math, Date, Array, etc.)\
    \ and core language elements (e.g. statements, operators, control structures,\
    \ etc.). As of now, programmers extend JavaScript's basic features by adding extra\
    \ objects. They do this to improve the language's effectiveness in completing\
    \ certain tasks.\n\nHere are two of the most popular variants of JavaScript:\n\
    \n- Server-side JavaScript – This variant is designed to help programmers run\
    \ JavaScript or a web server. For instance, server-side extensions help applications\
    \ to interact with databases, conduct file changes and provide a continuous flow\
    \ of information.\n\n- Client-side JavaScript – This form of JavaScript is created\
    \ for browsers and their respective DOM (i.e. Document Object Model). For instance,\
    \ client-side JavaScript helps applications to save elements into an HTML document\
    \ and react to user actions (e.g. form input, mouse clicks, page navigation, etc.).\n\
    \n## JavaScript and the Java Language\n\nJava and JavaScript are two different\
    \ programming languages. JavaScript has some similarities with Java (e.g naming\
    \ conventions, expression syntax, control-flow structures, etc.). However, it\
    \ doesn't have two of Java's distinctive characteristics: powerful type checking\
    \ and static typing.\n\nAccording to many people, these languages are completely\
    \ unrelated. Netscape (the company who developed JavaScript) changed the name\
    \ of the language from LiveScript to JavaScript to exploit the popularity enjoyed\
    \ by Java; thus, the similarity between the names of these languages emerged because\
    \ of marketing considerations.\n\nAt this point, we discuss the main differences\
    \ between these programming languages. This piece of information will help you\
    \ in improving your knowledge about JavaScript and general programming.\n\nJavaScript\
    \ – This is a free-form computer language. When using JavaScript, you don't have\
    \ to declare all of the methods, classes and variables. You don't have to worry\
    \ about the types of methods you'll use (i.e. whether they are private, public\
    \ or protected). Additionally, you won't have to implement any interface for JavaScript.\n\
    \nJava – This class-based computer language is created for type safety and quick\
    \ implementation. It means that you have to use classes and their respective methods\
    \ to create your programs. Java's data typing and class inheritance require strict\
    \ object hierarchies. Simply put, the Java language is more complicated than JavaScript.\n\
    \n# How to Get Started?\n\nYou don't have to download files or install programs\
    \ into your computer just to use JavaScript. You can simply access your favorite\
    \ web browser to create your own JavaScript applications. Firefox is one of the\
    \ best browsers when you come to JavaScript programming. Because of that, this\
    \ book will focus on the tools available in Firefox browsers. If your computer\
    \ doesn't have Firefox, you are advised to visit this site: https://www.mozilla.org.\
    \ This browser is free and easy to use; thus, you can easily master the basics\
    \ of JavaScript without spending any money.\n\nOnce you have downloaded Firefox,\
    \ you'll see two powerful tools created specifically for JavaScript programming.\
    \ These tools are:\n\n- 1. Web Console\n\nThis tool displays information about\
    \ the webpage loaded on the screen. It also has a command line feature that you\
    \ may use to run JavaScript statements on the loaded page. To access Web Console,\
    \ you must launch Firefox, click on “Tools,” and choose “Web Console” from the\
    \ menu titled “Developer.” After activating Web Console, you'll see a command\
    \ line at the bottom of your screen. You may enter JavaScript expressions into\
    \ that line, then the pane in the middle of the screen will show you the results\
    \ of the expressions you entered. This feature shows results immediately – you'll\
    \ quickly know if you have entered codes incorrectly.\n\nHere's a screenshot of\
    \ the Web Console tool:\n\n- 2. Scratchpad\n\nFirefox's Web Console is excellent\
    \ for running single JavaScript expressions. Although you can use it to run multiple\
    \ lines, you'll find this task extremely inconvenient. Additionally, you can't\
    \ use that tool.\n\nFortunately, Firefox has another tool that solves the problems\
    \ discussed above. This tool, you have to do the following:\n\nTo access this\
    \ tool:\n\n1. Launch the Firefox browser.\n2. Click on Tools.\n3. Look for the\
    \ “Developer” section and choose “Scratchpad.”\n\nThis tool is a separate Firefox\
    \ window that acts like a text editor. You can use it to write and run JavaScript\
    \ codes on your browser. Additionally, you may use Scratchpad to save your new\
    \ codes or load existing ones.\n\nThe screenshot below shows an image of the Scratchpad\
    \ tool:\n\n## Your First JavaScript Application\n\nIn this section, you'll write\
    \ your first application using JavaScript. This simple activity will give you\
    \ a taste of JavaScript’s features and programming environment.\n\nLaunch Scratchpad\
    \ and enter the code below:\n\n```\nfunction greetMe(userName) {\n    alert(\"\
    Hello \" + userName);\n}\ngreetMe(\"World\");\n```\n"
