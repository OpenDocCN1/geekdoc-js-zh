- md: "\n# The “onsubmit” Event\n\nThis event happens whenever a user submits a form.\
    \ Typically, programmers link their form validations to this kind of event.\n\n\
    # The “onmouseout” and “onmouseover” Events\n\nThese two kinds of events can help\
    \ you add cool effects (e.g. text, images, etc.) into your HTML documents. Basically,\
    \ “onmouseout” runs once the user moves the mouse out of an element. On the other\
    \ hand, “onmouseover” runs once when the user brings the mouse over an element.\n\
    \n# The Standard Events in HTML 5\n\nThe following table shows the standard events\
    \ supported by HTML 5.\n\n| Attribute | Explanation |\n| --- | --- |\n| onblur\
    \ | This event happens whenever a window loses focus. |\n| Offline | This event\
    \ occurs when the HTML file becomes offline. |\n| oncanplay | It happens when\
    \ a playable media is present. The playable media might need to stop because of\
    \ buffering. |\n| onabort | It occurs during an abort situation. |\n| onbeforeprint\
    \ | This event occurs before the system prints the HTML document. |\n| onafterprint\
    \ | This event happens once system has printed the HTML document. |\n| onclick\
    \ | It happens when the user clicks the left-side button of his mouse. |\n| ondblblclick\
    \ | This event occurs when the user double-clicks the left-side button of his\
    \ mouse. |\n| ondrag | It happens when the user drags an HTML element. |\n| onchange\
    \ | It occurs when an HTML element changes. |\n| ondragend | It happens once the\
    \ user stops dragging an HTML element. |\n| onmouseup | This event occurs whenever\
    \ the user releases a mouse button. |\n| onmousewheel | It happens when the user\
    \ rotates the wheel of his mouse. |\n| onpagehide | This event happens when the\
    \ user hides. |\n| onredo | This occurs when the user conducts a redo on the HTML\
    \ document. |\n| onstorage | This event occurs whenever an HTML file loads. |\n\
