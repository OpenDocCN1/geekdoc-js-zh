    \ screen.\n\nThe next chapter will discuss the syntax and features of JavaScript;\
    \ thus, you will be able to create applications that are more complex than the\
    \ one given above.\n\n## Chapter 2: The Basic Elements of the JavaScript Language\n\
    \nIn this chapter, you'll learn about JavaScript's grammar, variables, data types,\
    \ and constants/literals.\n\n## General Information\n\nThe syntax of this programming\
    \ language is similar to that of Awk, Perl, Java, and Python. Additionally, it\
    \ is case-sensitive and utilizes Unicode characters.\n\nWhen using JavaScript,\
    \ programmers refer to computer instructions as “statements.” You should separate\
    \ statements using a semicolon. JavaScript also supports whitespaces (e.g. tabs,\
    \ spaces, and newline characters). This means you may use these characters to\
    \ improve the readability of your JavaScript statements.\n\nThe JavaScript compiler\
    \ scans source codes from left to right and converts them into groups of input\
    \ objects (i.e. comments, whitespaces, tokens, line terminators, and control characters).\n\
    \n## Comments\n\nJavaScript's syntax for writing comments is similar to that of\
    \ most programming languages. You must use two slashes (i.e. //) to create a single-line\
    \ comment. However, to create a comment that spans multiple lines, you must use\
    \ /* and */ at the start and end of the comment, respectively. The screenshot\
    \ below will show you how to use these characters in writing your own codes:\n\
    \n```\n// a one line comment\n\n/* this is a longer,\n   multi-line comment\n\
    \   */\n```\n\nImportant Note: JavaScript doesn't support nested comments (i.e.\
    \ comments placed inside another comment).\n\n## The Declarations in JavaScript\n\
    \nThe JavaScript programming language supports three types of declarations. These\
    \ are:\n\n- var – Use this declaration to create a new variable. During the declaration,\
    \ you may assign a value to the variable.\n- let – This declaration allows you\
    \ to create a local variable. You may place a value on the variable during the\
    \ declaration phase.\n- const – Use this to create a constant. Constants are read-only:\
    \ you can’t change their value after the declaration.\n\nLet’s discuss these declarations\
    \ in detail:\n\n### The \"var\" Declaration\n\nThe syntax of this declaration\
    \ is:\n\n```\nvar varname1 [= value1 [, varname2 [, varname3 ... [, varnameN]]]\n\
    ```\n\nYou can replace “varname1” with any valid identifier. JavaScript has reserved\
    \ keywords – words that cannot be used in naming variables, constants, objects,\
    \ etc. You’ll learn about these keywords later.\n\nIn this syntax, “value1” represents\
    \ the value of the variable. You may replace it with any valid JavaScript expression.\n\
    \n### How Does It Work?\n\nThe JavaScript interpreter prioritizes variable declarations\
    \ over any type of code. The variable’s scope declared through “var” serves as\
    \ its active execution context (i.e. either local or global).\n\nIf you'll assign\
    \ a value to a variable that you haven't declared yet, you'll get a global variable\
    \ (i.e. a variable that can be accessed at any part of your program). Here are\
    \ the major differences between a declared variable and an undeclared variable:\n\
    \n- A declared variable is limited to the function through which it was declared.\
    \ That means a function cannot access the declared variables created inside other\
    \ functions. Undeclared variables, on the other hand, are global 100% of the time.\n\
    - JavaScript’s interpreter will create declared variables before running any code.\
    \ Undeclared variables, however, can only exist once the interpreter has run the\
    \ necessary codes.\n- A declared variable is a non-changeable attribute of its\
    \ respective function. Thus, a function cannot edit or delete the declared variables\
    \ it contains. Undeclared variables, on the other hand, allow modifications. That\
    \ means you can edit or delete them, depending on your needs.\n\nBecause of the\
    \ differences outlined above, you'll probably get unexpected or undesirable results\
    \ from your program if you'll fail to declare variables properly. Thus, it’s a\
    \ good programming behavior to declare variables, regardless of their scope.\n\
    \n### The \"let\" Declaration\n\nHere is the syntax of this declaration:\n\n```\n\
    let var1 = value1[], var2 = value2[], ..., varN = valueN];\n```\n\nYou may replace\
    \ “var1” with the name you’d like to use for your variable.\n\nIf you want to\
    \ assign a value to the new variable, just replace “value1” with the appropriate\
    \ data.\n\n### How Does It Work?\n\nThis declaration allows you to create variables\
    \ that are restricted in scope to the expression, block or statement where you\
    \ used them.\n\nIf you’ll use “let”, the variables that you’ll get will consider\
    \ their container as scope. In this aspect, “let” is similar to “var”. The major\
    \ difference is that a “var” variable’s scope is the whole function that encloses\
    \ it.\n\n### The “const” Declaration\n\nWith this declaration, you can create\
    \ a read-only reference to any value. Basically, you can still edit these references\
    \ whenever you need to. It’s just that you won’t be able to transfer or reassign\
    \ them after the declaration phase. The syntax of this declaration is:\n\n```\n\
    const name1 = value1 [, name2 = value2 [, ... name = valueN]];\n```\n\n### How\
    \ Does It Work?\n\nWith this declaration, you can generate a constant (also known\
    \ as “literal”) that can be local or global. The syntax given above requires an\
    \ initializer. That means you have to specify the variable’s value at the time\
    \ of declaration.\n\nA constant is block-scoped. In this aspect, constants are\
    \ similar to variables declared through “let”.\n\nImportant Note: You cannot change\
    \ a constant’s value through reassignment or “re-declaration.”\n\n## JavaScript\
