    \ following output:\n"
  mdcn: "\n\n```javascript\nfor (variable of object) {\n  statement\n}\n```\n\n##\
    \ \"for... in\" 语句\n\n\"for... in\" 语句会在任何对象的属性上重复执行赋值的语句。JavaScript 将为每个属性执行赋值的语句。\"\
    for... in\" 语句的语法如下：\n\n```javascript\nfor (variable in object) {\n  statements\n\
    }\n```\n\n## \"continue\" 语句\n\n你可以使用此语句来重启其他语句（例如 for、while、do... while 和 label）。在使用\
    \ \"continue\" 语句时，你必须记住以下两个规则：\n\n- 如果你不在 `continue` 语句中包含标签（label），它将终止当前内层循环的进程，并继续执行下一个。与\
    \ `break` 语句不同，`continue` 语句不能终止整个循环。如果用于 `while` 循环，控制流将返回到赋值的条件。另一方面，如果用于 `for`\
    \ 循环，控制流将返回到增量表达式。\n- 如果你在 `continue` 语句中包含标签，它将只影响与该标签关联的语句。\n\n`continue` 语句的语法有两种形式，如下：\n\
    \n```javascript\n1. continue;\n2. continue label;\n```\n\n## 第5章：JavaScript 函数\n\
    \n通常情况下，函数充当“子程序”，你可以通过内部/外部代码调用它们。与完整程序类似，函数有一组被称为“体”的语句。JavaScript 允许你向函数传递值。此外，函数可以返回一个值。\n\
    \nJavaScript 将函数视为一等对象，因为它们拥有在其他编程对象中发现的方法和属性。函数与其他 JavaScript 对象之间的主要区别是，你可以在需要时调用它们。\n\
    \n### 什么是函数？\n\n在 JavaScript 中，每个函数都被视为一个唯一的对象。此外，函数与过程（procedures）不同。函数 100%\
    \ 的情况下都会返回值，而某些过程不会。\n\n如果你希望函数返回值，必须在函数中添加 `return` 语句。`return` 语句指定了必须返回的值。没有\
    \ `return` 语句的函数给出一个默认值。在大多数情况下，函数的默认值是 \"undefined\"。\n\n函数的参数是在调用函数时使用的参数。JavaScript\
    \ 使用值来传递给函数的参数。如果函数修改了参数的值，该修改不会在全局或函数内部内部出现。然而，对象引用也是一种值（而且是特殊的引用）——如果函数更改了所引用对象的属性，这些更改将在全局生效。\n\
    \n### 如何定义函数\n\n在 JavaScript 中，你可以以不同的方式定义函数。让我们详细讨论每种方法：\n\n- 使用函数声明（function\
    \ statement）——JavaScript 提供了一种你可以用于声明函数的特殊语法。该语法如下：\n\n```javascript\nfunction\
    \ name([param, param[, ... param]]) {\n  statements\n}\n```\n\n该语法有三个不同的部分，分别是：\n\
    \n- name – 这是函数的名称。你可以将其替换为任何有效的标识符。\n- param – 这是你想传递给函数的参数/参数。JavaScript 允许每个函数中包含最多\
    \ 255 个参数。\n- statements – 这部分包含函数的语句（即函数体）。\n\n- 通过函数表达式（function expression）——这种方法与上一种方法类似。事实上，它使用了下面的语法：\n\
    \n```javascript\nfunction [name]([param, ... param]) {\n  statements\n}\n```\n\
    \n- JavaScript 的“函数构造函数”（Function Constructor）——JavaScript 允许你使用 `new`（即 JavaScript\
    \ 运算符）来生成函数。你必须使用的语法如下：\n\n```javascript\nnew Function(arg1, arg2, ... argN, functionBody)\n\
    ```\n\n上述语法包含以下部分：\n\n- arg1, arg2, ... argN – 这部分包含你想用作形式参数的名字。\n- functionBody\
    \ – 这是一个包含 JavaScript 语句的字符串（即函数体）。\n\n## 如何调用函数\n\n在定义函数时，你正在为该函数命名，并分配了一旦函数被调用/执行时要执行的操作。如果你想让它执行分配的操作，请调用该函数。例如，如果你定义了\
    \ \"square\" 函数，你可以使用以下代码调用它：\n\n```javascript\nsquare(2);\n```\n\n上面的代码调用了 \"\
    square\" 函数并将 2 作为参数传递。函数运行其语句并给出 4 作为结果值。在调用函数时，你的函数必须在适当的作用域内。但是，你可以对函数声明进行提升（即，即提升到顶部）。这里有一个例子：\n\
    \n```javascript\n1 console.log(square(5));\n2 /* ... */\n3 function square(n)\
    \ { return n*n }\n```\n\n函数的参数可以包含不同的编程元素（即不仅仅是数字和字符串）。JavaScript 允许你将整个对象赋值给函数。例如，`show_props()`（即一个内置的\
    \ JavaScript 函数）接受对象作为参数。\n\n## 函数的作用域\n\n如果你在函数内部定义变量，你将无法从函数外部访问该变量。这是因为你只在函数的作用域内定义了变量。然而，函数可以访问在其定义所在的作用域内创建的所有变量和其他函数。简单来说，全局函数可以访问全局变量。嵌套函数（即放置在另一个内部的函数）可以访问在其“母函数”内部创建的变量。\n\
    \n## 函数的参数\n\nJavaScript 将参数视为数组对象。在函数内部，你可以使用以下语法访问 `arguments[i]`：\n\n### arguments[n]\n\
    \n在此语法中，“n”代表参数的序号，从零开始。这意味着函数的初始参数是 `arguments[0]`。\n\n如果你使用名为 \"arguments\"\
    \ 的 JavaScript 对象，你可以调用参数比代码中声明的参数更多的函数。这个对象可能非常有用，特别是当你不知道必须给函数分配多少个参数时。要确定函数内部参数的数量，你可以使用\
    \ `arguments.length`。然后，你可以使用 `arguments` 对象来访问函数的参数。\n\n## 函数的形式参数\n\n目前，JavaScript\
    \ 支持两种类型的参数：默认参数（default）和剩余参数（rest）。\n\n### 默认参数\n\n在 JavaScript 语言中，任何函数的默认参数都是\
    \ \"undefined\"。但在大多数情况下，更改此默认值是有益的。默认参数可以在这方面为你提供帮助。\n\n以前，设置默认值的常用方法是在函数体内部检查参数值并分配新值。有了默认参数，你就不再需要检查函数体了。你只需要将数字或字符串赋值为函数的默认值。\n\
    \n### 剩余参数\n\n这种参数允许你将任意数量的参数表示为一个简单的数组。在下面的代码中，你将使用剩余参数获取第二个、第三和第四个参数。然后可以使用第一个参数对它们进行乘法。\n\
    \n```javascript\nfunction multiply(multiplier, ...theArgs) {\n  return theArgs.map(x\
    \ => multiplier * x);\n}\n\nvar arr = multiply(2, 1, 2, 3);\nconsole.log(arr);\
    \ // [2, 4, 6]\n```\n\n## 第6章：事件\n\n### 事件 基础\n\n当用户或浏览器控制网页时，JavaScript 代码与 HTML\
    \ 内容交互。系统将这些交互处理为事件。\n\n基本上，“事件”一词指的是在网页上进行的任何操作（例如点击按钮、调整网页大小、按下按键、关闭弹出窗口等）。\n\
    \n作为一名 JavaScript 程序员，你可以使用事件来运行某些响应（例如关闭窗口、显示消息、验证记录等）。\n\n事件属于 DOM（文档对象模型）3\
    \ 级。此外，每个 HTML 元素都包含可以触发 JavaScript 代码的事件集合。\n\n本章将讨论一些流行的网页事件。这些材料将帮助你理解事件与 JavaScript\
    \ 语言之间的关系。\n\n### “onclick” 事件\n\nJavaScript 用户经常遇到这种事件。基本上，\"onclick\" 事件发生在用户点击其鼠标左侧按钮时。你可以将警告、验证和其他内容关联到此事件中。\n\
    \n这里有一个例子：\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n<!--\n\
    function sayHello() {\n  document.write(\"Hello World\")\n}\n-->\n</script>\n\
    </head>\n<body>\n<p> 点击下面的按钮并查看结果</p>\n<input type=\"button\" onclick=\"sayHello()\"\
    \ value=\"Say Hello\" />\n</body>\n</html>\n```\n\n如果你运行该代码，你将得到以下输出：\n\n"
