    # The “Switch” Statement


    This kind of statement allows an application to check an expression and compare
    it with a predetermined set of cases. If there’s a match, the application runs
    the assigned command. Here is the syntax of a basic switch statement:


    ![](img/5f2b3a2ec7b622cf6e5316b81058bdcc_23_0.png)


    First, the application will search for a case with a label that matches the expression/s.
    Then, it will pass the control flow to that particular case, performing the assigned
    statement/s. If no match is found, the application will check the default case
    (which is optional) and pass the control flow to that clause, running the assigned
    statement/s. If the statement has no default clause, the application will simply
    run the statement after the switch. Typically, the final clause of a switch statement
    serves as the default clause, but it isn''t mandatory.


    You may also add a break statement in your switches. A break statement makes sure
    that the application will get out of the switch statement once a match is found.
    When the application gets out of the switch, the system will run the statement
    right after the switch statement. If your code doesn’t have a break, the application
    will simply run all of the commands within your switch statement.


