    \ 循环可能永远不会运行。这意味着在 JavaScript 程序中创建 “while” 循环时必须格外小心。\n\n# “do... while” 循环\n\
    \n这种循环在检查分配的条件之前会运行一次语句。在创建 do... while 循环时，你必须使用以下代码：\n\n```\ndo\n  statement\n\
    while (condition);\n```\n\n此过程将持续直到条件变为假。一旦条件评估为假，控制流将跳转到循环后的语句。\n\n# label（标签）语句\n\
    \n这种语句允许你对语句进行“标记”（即分配一个标识符）。通过标记你的 JavaScript 语句，你可以轻松地在应用程序的任何部分重复它们。例如，你可以标记某个循环，并利用其他语句来继续或中断它的执行。\n\
    \n以下是 “label” 语句的语法：\n\n```\nlabel :\n  statement\n```\n\n在创建标签时，可以使用任何不是 JavaScript\
    \ 关键字的标识符。你可以对任何语句使用上述语法。\n\n# “break” 语句\n\n程序员使用此语句来结束循环或 switch 语句。在使用 “break”\
    \ 语句时，必须记住以下规则：\n\n- 如果你的 break 语句没有标签，它将终止最内层的循环/switch，并将控制流传递给下一个语句。\n- 如果你的\
