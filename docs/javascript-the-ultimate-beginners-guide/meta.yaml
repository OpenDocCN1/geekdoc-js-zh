    \n## 目录\n\n引言\n第一章：JavaScript – 通用信息\n第二章：JavaScript 语言的基本元素\n第三章：JavaScript 的控制流语句\n\
    第四章：JavaScript 中不同类型的循环\n第五章：JavaScript 函数\n第六章：事件\n第七章：JavaScript 与 Cookie\n\
    第八章：页面跳转\n第九章：对话框\n第十章章：如何使用 Void 关键字\n第十一章章：调试\n结论\n\n## 引言\n\n感谢你的购买并祝贺你购买了我的书……\n\
    \n《JavaScript：终极入门指南！》\n\n这本书将帮助你成为一名高效的 JavaScript 用户。如果你想快速轻松地学习 JavaScript\
    \ 语言的基础知识，那么你现在必须拥有这本书。\n\n这本书将解释有关 JavaScript 语言的重要事实。它不包含任何无关信息。每一页都包含了宝贵的课程、指令和示例。阅读完这本书后，你将熟悉对象、函数、变量、语句和其他\
    \ JavaScript 元素。\n\n再次感谢购买此书，希望你喜欢它！\n\n## 第一章：通用信息\n\nJavaScript 是一种面向对象的脚本语言，你可以在不同的平台上使用它。在宿主环境（例如，网络浏览器）中，你可以使用\
    \ JavaScript 对对象进行程序化控制。\n\n这种脚本语言带有一个丰富的标准库。该库包含了对象（例如 Math、Date、Array 等）和核心语言元素（例如语句、操作符、控制结构等）。截至目前，程序员们通过添加额外的对象来扩展\
    \ JavaScript 的基本功能。他们这样做是为了提高该语言在完成某些任务时的效率。\n\n以下是 JavaScript 最流行的两种变体：\n\n-\
    \ 服务端 JavaScript – 该变体旨在帮助程序员运行 JavaScript 或 Web 服务器。例如，服务端扩展可以帮助应用程序与数据库交互、进行文件更改并提供连续的信息流。\n\
    \n- 客户端 JavaScript –这种形式的 JavaScript 是为浏览器及其相应的 DOM（即文档对象模型）创建的。例如，客户端 JavaScript\
    \ 可以帮助应用程序将元素保存到 HTML 文档中，并对用户操作做出响应（例如表单输入、鼠标点击、页面导航等）。\n\n## JavaScript 与 Java\
    \ 语言\n\nJava 和 JavaScript 是两种不同的编程语言。JavaScript 与 Java 有一些相似之处（例如命名规范、表达式语法、控制流结构等）。然而，它不具备\
    \ Java 的两个独特特征：强大的类型检查和静态类型检查。\n\n根据许多人的观点，这两种语言是完全无关的。Netscape（开发 JavaScript\
    \ 的公司）将语言名称从 LiveScript 改为 JavaScript，以利用 Java 的流行性；因此，这些语言名称之间的相似性是因为营销考虑而产生的。\n\
    \n在此，我们将讨论这些编程语言之间的主要区别。这些信息将帮助你加深对 JavaScript 和通用编程的了解。\n\nJavaScript – 这是一种自由形式的计算机语言。在使用\
    \ JavaScript 时，你不需要声明所有的方法、类和变量。你不需要担心你将使用的方法类型（例如它们是私有的、公有的还是保护的）。此外，你不需要为 JavaScript\
    \ 实现任何接口。\n\nJava – 这种基于类的计算机语言是为了类型安全和快速实现而创建。这意味着你必须使用类及其对应的方法来创建程序。Java 的数据类型和类继承需要严格的对象层次结构。简单来说，Java\
    \ 语言比 JavaScript 更复杂。\n\n# 如何开始？\n\n你不需要为了使用 JavaScript 而下载文件或在电脑上安装程序。你只需要访问你喜爱的网络浏览器来创建自己的\
    \ JavaScript 应用程序。在 JavaScript 编程方面，Firefox 是最好的浏览器之一。因此，这本书将关注 Firefox 浏览器中提供的工具。如果你的电脑没有\
    \ Firefox，建议你访问此网站：https://www.mozilla.org。该浏览器免费且易用；因此，你可以轻松掌握 JavaScript 基础而无需付费。\n\
    \n一旦下载了 Firefox，你将看到两个专门为 JavaScript 编程创建的强大工具。这些工具是：\n\n- 1. Web 控制台\n\n此工具显示屏幕上加载的网页信息。它还具有一个命令行功能，你可以用它在加载的页面上运行\
    \ JavaScript 语句。要访问 Web 控制台，你必须启动 Firefox，点击“工具”，并在名为“开发者”菜单中选择“Web 控制台”。激活 Web\
    \ 控制台后，你会在屏幕底部看到一个命令行。你可以在该行输入 JavaScript 表达式，然后屏幕中间的面板将向你显示输入表达式的结果。此功能会立即显示结果——你将迅速判断自己是否输入了错误。\n\
    \n这是 Web 控制台工具的截图：\n\n- 2. 笔记本 (Scratchpad)\n\nFirefox 的 Web 控制台非常适合运行单个 JavaScript\
    \ 表达式。虽然你可以用它运行多行，但你会发现这项任务极其不便。此外，你无法使用该工具。\n\n幸运的是，Firefox 还有另一个解决上述问题的工具。使用此工具，你需要执行以下操作：\n\
    \n访问此工具：\n\n1. 启动 Firefox 浏览器。\n2. 点击工具。\n3. 寻找“开发者”部分并选择“笔记本”。\n\n此工具是一个独立的 Firefox\
    \ 窗口，类似于文本编辑器。你可以用它在浏览器中编写和运行 JavaScript 代码。此外，你可以使用笔记本保存新代码或加载现有代码。\n\n下面的截图显示了笔记本工具的图像：\n\
    \n## 你的第一个 JavaScript 应用程序\n\n在本节中，你将使用 JavaScript 编写你的第一个应用程序。这个简单的活动将让你体验 JavaScript\
    \ 的功能和编程环境。\n\n启动笔记本并输入以下代码：\n\n```\nfunction greetMe(userName) {\n    alert(\"\
    Hello \" + userName);\n}\ngreetMe(\"World\");\n```\n\n"
