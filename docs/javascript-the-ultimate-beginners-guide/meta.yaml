    \ these interactions as events.\n\nBasically, the term “event” refers to any manipulation\
    \ done on a webpage (e.g. clicking on a button, resizing the webpage, pressing\
    \ a key, closing a pop-up window, etc.).\n\nAs a JavaScript programmer, you may\
    \ use events to run certain responses (e.g. closing a window, displaying a message,\
    \ validating records, etc.).\n\nEvents belong to DOM (Document Object Model) Level\
