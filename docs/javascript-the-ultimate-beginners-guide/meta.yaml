    # How to Escape a Character


    In JavaScript, quotation marks are used to start and terminate strings. However,
    in some situations, you have to include a quotation mark into your codes - that
    is, you want an ordinary quotation mark (not the JavaScript symbol). In this case,
    you must introduce the quotation mark using a backslash (i.e. \). This technique
    is called "escaping the character." Typing a backslash before a special symbol
    turns that symbol into an ordinary one.


    Important Note: Sometimes, you have to add an ordinary backslash into your statements.
    Well, you can do that quickly and easily. You just have to type two backslashes
    (i.e. \). This action "escapes" the backslash character itself.


    # Floating-Point Literals


    Floating-point literals have the following parts:


    +   - A decimal integer

    - An exponent

    - A fraction

    - A decimal point


    You must use "E" or "e" to represent the exponent section of your floating-point
    literals. After indicating the exponent, you should place the integer (which can
    be preceded by "-" or "+")."). In general, floating-point literals should have
    at least one number and either either an exponent or decimal point.


    Here is the syntax of a floating-point literal:


    ```

    1 |([+-])[digits][.digits][(E|e)|([+-])digits]

    ```


    Here are some examples of floating-point literals:


    +   - 2e-34

    - 3.15

    - -.145

