  md: 'common reasons:


    +   - You are transferring your website to a new domain. In this case, you need
    to forward all of your website traffic to the new domain. You don''t have to delete
    the old website. You can keep it and use page redirection to all the web traffic.
    This approach can help you keep your previous customers who may not be aware of
    your new site.


    +   - You created webpages based on certain criteria (e.g. browser types, the
    customers’ name, the country where the customer resides, etc.). Rather than redirecting
    visitors through server-side mechanisms, you may employ client-side redirection
    to forward your visitors to the correct webpage.


    +   - You want to retain the traffic from your SEO campaign even though you have
    switched to a new website. Search engines may ban your website from their search
    results pages if you''ll use page redirection to get illegal web traffic.


    # Page Refresh


    In JavaScript, you may refresh webpages using the **location.reload** method.
    You can call this method automatically or when a user clicks on a certain link.
    If you like to refresh a webpage based on mouse clicks, use the code below:


    ```

    <a href="javascript:location.reload(true)">Refresh Page</a>

    ```


    # Automatic Refresh


    JavaScript allows you to refresh a webpage after a certain amount of time. You
    just have to use **setTimeout() (i.c. a pre-installed JavaScript function) to
    run a different function after a predetermined time interval.


    # How Does Page Redirection Work?


