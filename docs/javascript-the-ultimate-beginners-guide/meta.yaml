    visitors. Visitors have to enter the required information and hit the OK button.


    To display a prompt box on a webpage, you must use the prompt() method. This method
    accepts two parameters: (1) the label that you want to show in the dialog box
    and (2) the text string that you want to show in the dialog box. On the other
    hand, the prompt() method will submit


    Similar to a confirmation box, a prompt box has an OK button and a Quit/Cancel
    button. If the visitor hits OK, the prompt() method will submit the data entered
    into the text box. If the visitor hits Quit/Cancel, on the other hand, the prompt()
    method will submit null to the webserver


