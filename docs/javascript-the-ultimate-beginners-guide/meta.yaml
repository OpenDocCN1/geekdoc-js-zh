    \ is true. It involves an “else” clause (which is optional). The “else” clause\
    \ holds a statement that will run if the assigned condition is false. The syntax\
    \ of a basic “if… else” statement is:\n\nSince your condition must get either\
    \ \"true\" or \"false,\" you must use Boolean expressions when writing a conditional\
    \ statement. If the condition is true, the first statement will run; otherwise,\
    \ the second one will run.\n\nJavaScript allows you to set multiple conditions\
    \ in your conditional statements. You just have to combine several \"if\" and\
    \ \"else\" clauses in a conditional statement. Here's the syntax that you must\
    \ use:\n\n```\nif (condition_1) {\n  statement_1;\n} else if (condition_2) {\n\
    \  statement_2;\n} else if (condition_n) {\n  statement_n;\n} else {\n  statement_last;\n\
    }\n```\n\nTo run multiple statements, you must place them inside a block statement\
    \ (i.e. { ... }). Programming experts claim that it's best to utilize block statements,\
    \ particularly when combining if statements. Check the following example:\n\n\
    ```\nif (condition) {\n  statement_1_runs_if_condition_is_true;\n  statement_2_runs_if_condition_is_true;\n\
    } else {\n  statement_3_runs_if_condition_is_false;\n  statement_4_runs_if_condition_is_false;\n\
    }\n```\n\nIf possible, avoid using simple assignments in your conditional expressions.\
    \ This is because simple assignments are often confused with equality when checking\
    \ JavaScript codes. For instances, you must not add the following code into your\
    \ statements:\n\n```\nif (a = b) {\n  /* sample_statement */\n}\n```\n\nIf you\
    \ really need to use a simple assignment in your conditional expressions, place\
    \ it between a pair of parentheses. Here's an example:\n\n```\nif ((x = y)) {\n\
    \  /* sample_statement */\n}\n```\n\n### The Falsy Values\n\n\"falsy value\" is\
    \ a value that evaluates to false. Here are the falsy values you will encounter\
    \ while using JavaScript:\n\n- 0\n- null\n- false\n- undefined\n- NaN\n- (\" \"\
    ) (i.e. an empty string)\n\nAny value not listed above evaluates to true in conditional\
    \ statements.\n\n### The “Switch” Statement\n\nThis kind of statement allows an\
    \ application to check an expression and compare it with a predetermined set of\
    \ cases. If there’s a match, the application runs the assigned command. Here is\
    \ the syntax of a basic switch statement:\n\n![](img/5f2b3a2ec7b622cf6e5316b81058bdcc_23_0.png)\n\
    \nFirst, the application will search for a case with a label that matches the\
    \ expression/s. Then, it will pass the control flow to that particular case, performing\
    \ the assigned statement/s. If no match is found, the application will check the\
    \ default case (which is optional) and pass the control flow to that clause, running\
    \ the assigned statement/s. If the statement has no default clause, the application\
    \ will simply run the statement after the switch. Typically, the final clause\
    \ of a switch statement serves as the default clause, but it isn't mandatory.\n\
    \nYou may also add a break statement in your switches. A break statement makes\
    \ sure that the application will get out of the switch statement once a match\
    \ is found. When the application gets out of the switch, the system will run the\
    \ statement right after the switch statement. If your code doesn’t have a break,\
    \ the application will simply run all of the commands within your switch statement.\n\
