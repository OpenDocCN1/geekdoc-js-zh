    \ the quantity of arguments inside a function, you may use arguments.length. Then,\
    \ you may use the “arguments’ object to access the function’s arguments.\n\n##\
    \ The Parameters of a Function\n\nCurrently, JavaScript supports two types of\
    \ parameters: default and rest.\n\n### The Default Parameters\n\nIn the JavaScript\
