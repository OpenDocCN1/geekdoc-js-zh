  md: '# # Chapter 1: General Information


    JavaScript is an object-oriented scripting language that you can use in different
    platforms. Within host environments (e.g. web browsers), you may use JavaScript
    to gain programmatic control over an object.


    This scripting language comes with a rich standard library. This library holds
    objects (e.g. Math, Date, Array, etc.) and core language elements (e.g. statements,
    operators, control structures, etc.). As of now, programmers extend JavaScript''s
    basic features by adding extra objects. They do this to improve the language''s
    effectiveness in completing certain tasks.


    Here are two of the most popular variants of JavaScript:


    +   - Server-side JavaScript – This variant is designed to help programmers run
    JavaScript or a web server. For instance, server-side extensions help applications
    to interact with databases, conduct file changes and provide a continuous flow
    of information.


    +   - Client-side JavaScript – This form of JavaScript is created for browsers
    and their respective DOM (i.e. Document Object Model). For instance, client-side
    JavaScript helps applications to save elements into an HTML document and react
    to user actions (e.g. form input, mouse clicks, page navigation, etc.).


    # ## JavaScript and the Java Language


    Java and JavaScript are two different programming languages. JavaScript has some
    similarities with Java (e.g naming conventions, expression syntax, control-flow
    structures, etc.). However, it doesn''t have two of Java''s distinctive characteristics:
    powerful type checking and static typing.


    According to many people, these languages are completely unrelated. Netscape (the
    company who developed JavaScript) changed the name of the language from LiveScript
    to JavaScript to exploit the popularity enjoyed by Java; thus, the similarity
    between the names of these languages emerged because of marketing considerations.


    At this point, we discuss the main differences between these programming languages.
    This piece of information will help you in improving your knowledge about JavaScript
    and general programming.


    JavaScript – This is a free-form computer language. When using JavaScript, you
    don''t have to declare all of the methods, classes and variables. You don''t have
    to worry about the types of methods you''ll use (i.e. whether they are private,
    public or protected). Additionally, you won''t have to implement any interface
    for JavaScript.


    Java – This class-based computer language is created for type safety and quick
    implementation. It means that you have to use classes and their respective methods
    to create your programs. Java''s data typing and class inheritance require strict
    object hierarchies. Simply put, the Java language is more complicated than JavaScript.'
