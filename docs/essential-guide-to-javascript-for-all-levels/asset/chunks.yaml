    modules. c. It provides a mechanism for routing HTTP requests. d. It enables code
    to reactively respond to events such as incoming HTTP requests.


    Answer: d. It enables code to reactively respond to events such as incoming HTTP
    requests.


    10.  Which database is commonly used with Node.js and Express.js? a. MongoDB b.
    MySQL c. PostgreSQL d. All of the above


    Answer: d. All of the above


    11.  Which design pattern ensures that only a single instance of a class is created?
    a) Singleton Pattern b) Observer Pattern c) Factory Pattern d) Adapter Pattern


    Answer: a) Singleton Pattern


    12.  In the Observer pattern, what is the role of the subject? a) It creates multiple
    instances of observers. b) It maintains a list of observers and notifies them
    of any state changes. c) It encapsulates the object creation logic. d) It establishes
    a one-to-one relationship between objects.


    Answer: b) It maintains a list of observers and notifies them of any state changes.


    13.  Which design pattern provides a central factory class for creating objects
    based on specific criteria? a) Singleton Pattern b) Observer Pattern c) Factory
    Pattern d) Decorator Pattern


    Answer: c) Factory Pattern


    14.  Which coding convention emphasizes using consistent and descriptive names
    for variables, functions, classes, and constants? a) Proper Variable and Function
    Naming b) Consistent Bracing and Parentheses c) Indentation and Formatting d)
    Use of Comments


    Answer: a) Proper Variable and Function Naming


    15.  What is the purpose of using comments in code? a) To enhance code readability
    by providing consistent indentation. b) To group expressions or enhance clarity
    using parentheses. c) To explain the purpose, logic, and important details within
    the code. d) To maintain consistency in the use of semicolons and quotes.


    Answer: c) To explain the purpose, logic, and important details within the code.


    16.  Which principle suggests that each function or module should have a single
    responsibility? a) Single Responsibility Principle (SRP) b) DRY Principle (Don''t
    Repeat Yourself) c) Open/Closed Principle (OCP) d) Liskov Substitution Principle
    (LSP)


    Answer: a) Single Responsibility Principle (SRP)


    17.  What does the DRY principle aim to reduce in code? a) Code redundancy b)
    Code complexity c) Code maintainability d) Code readability


    Answer: a) Code redundancy


    18.  Which refactoring technique involves extracting duplicate code into reusable
    functions or modules? a) Single Responsibility Principle (SRP) b) DRY Principle
    (Don''t Repeat Yourself) c) Proper Variable and Function Naming d) Code Comments
    and Documentation


    Answer: b) DRY Principle (Don''t Repeat Yourself)


    19.  What is the purpose of adding comments and documentation in code? a) To improve
    code readability by enhancing indentation and formatting. b) To clarify the purpose,
    behavior, and usage of functions, classes, and complex logic. c) To eliminate
    code smells such as long functions, excessive conditional statements, or complex
    logic. d) To ensure consistency in the use of semicolons and quotes.


    Answer: b) To clarify the purpose, behavior, and usage of functions, classes,
    and complex logic.'
