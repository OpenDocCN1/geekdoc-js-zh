    ### 数组方法


    JavaScript 提供了多种内置方法来处理数组。一些常用的数组方法包括 `push()`、`pop()`、`shift()`、`unshift()`、`slice()`、`splice()`、`concat()`、`join()`
    等。


    ## 对象


    对象是一个无序的键值对集合，其中每个键都是一个字符串（或符号），映射到一个值。对象可以存储不同类型的值，甚至其他对象或数组。


    ### 创建对象


