    \ be accessed. |\n| Closure | A function that has access to its own scope, the\
    \ scope in which it was defined, and the global scope. |\n| Callback | A function\
    \ passed as an argument to another function and invoked at a later time. |\n|\
    \ Event | An action or occurrence that happens in the browser, such as a click,\
    \ keypress, or page load. |\n| Prototype | An object from which other objects\
    \ inherit properties and methods. |\n| JSON | JavaScript Object Notation, a lightweight\
    \ data interchange format. |\n| DOM | Document Object Model, a programming interface\
    \ for HTML and XML documents. |\n| AJAX | Asynchronous JavaScript and XML, a technique\
    \ for updating parts of a web page without reloading it. |\n| Promise | An object\
    \ representing the eventual completion or failure of an asynchronous operation.\
    \ |\n| Callback Hell | A situation where multiple callbacks are nested within\
    \ each other, making code difficult to read. |\n\n## Advanced Terminologies\n\n\
    | Term | Definition |\n| --- | --- |\n| Hoisting | The process in which JavaScript\
    \ moves variable and function declarations to the top of their scope. |\n| Lexical\
    \ Scope | The scope determined by the placement of variables and blocks in the\
    \ source code, also known as static scope. |\n| Asynchronous | A programming model\
    \ that allows code to execute independently of the main execution flow. |\n| Event\
    \ Loop | The mechanism that handles asynchronous callbacks by continually checking\
    \ the call stack and event queue. |\n| IIFE | Immediately Invoked Function Expression,\
    \ a function that is executed immediately after it's defined. |\n| Closure | A\
    \ combination of a function and the lexical environment within which that function\
    \ was declared. |\n| Generator | A function that can pause its execution and resume\
    \ it later, producing a sequence of values. |\n| Transpiler | A tool that converts\
    \ code from one programming language to another, such as transpiling ES6 to ES5.\
    \ |\n| Module | A self-contained piece of code that encapsulates related functions,\
    \ variables, and classes. |\n| Web Worker | A JavaScript script that runs in the\
    \ background independently of the main browser thread. |\n\nThese terminologies\
    \ cover a wide range of JavaScript concepts, starting from the basic building\
    \ blocks to more advanced and nuanced topics.\n\nHere's an explanation of some\
    \ common symbols and signs used in JavaScript coding:\n\n1.  Parentheses (`(`\
    \ `)`): Used for grouping expressions, defining function parameters, and invoking\
    \ functions.\n2.  Curly braces (`{` `}`): Used to define blocks of code, such\
    \ as for loops, if statements, and object literals.\n3.  Square brackets (`[`\
    \ `]`): Used for creating arrays and accessing elements within arrays or objects.\n\
    4.  Semi-colon (`;`): Used to mark the end of a statement. While not always required\
    \ in JavaScript, it is recommended to use them to separate statements.\n5.  Comma\
    \ (`,`): Used to separate items within an array or object literal, function arguments,\
    \ or to separate variables in a variable declaration.\n6.  Period (`.`): Used\
    \ to access properties and methods of an object.\n7.  Assignment operator (`=`):\
    \ Used to assign a value to a variable or property.\n8.  Comparison operators:\
    \ Used to compare values and return a Boolean result.\n    *   `==`: Equal to\n\
    \    *   `===`: Strict equal to (checks both value and type)\n    *   `!=`: Not\
    \ equal to\n    *   `!==`: Strict not equal to (checks both value and type)\n\
    \    *   `>`: Greater than\n    *   `<`: Less than\n    *   `>=`: Greater than\
    \ or equal to\n    *   `<=`: Less than or equal to\n9.  Arithmetic operators:\
    \ Used for mathematical calculations.\n    *   `+`: Addition\n    *   `-`: Subtraction\n\
