    # Design patterns (Singleton, Observer, Factory, etc.)


    Design patterns are widely used solutions to common software design problems.
    They provide a structured approach to solving specific design challenges and promote
    code reusability, maintainability, and extensibility. Let''s explore some popular
    design patterns in JavaScript with daily examples:


    ## Singleton Pattern


    *   Daily example: Suppose you''re developing a logging service for your application,
    and you want to ensure that only a single instance of the logger is created.

    *   How it works: The Singleton pattern restricts the instantiation of a class
    to a single instance. Here''s an example:


    ![](image_rsrc2U5.jpg)


    In this example, the `Logger` class ensures that only one instance of the logger
    is created by checking if an instance already exists. The instance is stored in
    a static property `Logger.instance`.


    ## Observer Pattern


    *   Daily example: Imagine you''re developing a real-time chat application, and
    you want to notify multiple components when a new message arrives.

    *   How it works: The Observer pattern establishes a one-to-many relationship
    between objects, where the subject (publisher) maintains a list of observers (subscribers)
    and notifies them of any state changes.


    Here''s an example:


    ![](image_rsrc2U6.jpg)


    In the example, the `Subject` class maintains a list of observers and provides
    methods to add, remove, and notify them. The `Observer` class defines the update
    behavior when a notification is received.


    ## Factory Pattern


    *   Daily example: Suppose you''re developing a car manufacturing application
    and need a way to create different types of cars.

    *   How it works: The Factory pattern provides a central factory class that creates
    objects based on specific criteria, encapsulating the object creation logic.


    Here''s an example:


    ![](image_rsrc2U7.jpg)


    In the example, the `CarFactory` class creates different types of cars based on
    the input. The client code uses the factory to create specific car objects.


    These examples illustrate the Singleton, Observer, and Factory patterns. Design
    patterns provide well-defined solutions to recurring design problems and can greatly
    improve the structure and maintainability of your JavaScript code. By understanding
    and applying design patterns appropriately, you can create more robust and flexible
    applications.


    # Coding conventions and style guides


    Coding conventions and style guides help maintain a consistent and readable codebase,
    making it easier to understand, collaborate, and maintain code. While different
    teams and organizations may have their own specific conventions, there are common
    conventions and style guides that can be followed. Let''s explore some coding
    conventions and style guide principles in JavaScript with daily examples:


    ## Naming Conventions


    *   Daily example: Suppose you''re developing a JavaScript function to calculate
    the area of a rectangle.

    *   How it works: Follow consistent naming conventions for variables, functions,
    classes, and constants. Use descriptive names that convey the purpose or meaning
    of the code element. For example:


    ![](image_rsrc2U8.jpg)


    In this example, the function name `calculateRectangleArea` and variable names
    `rectangleLength`, `rectangleWidth`, and `area` are all descriptive and follow
    camel case naming convention.


    ## Indentation and Formatting


    *   Daily example: Imagine you''re working on a JavaScript code snippet that involves
    conditional statements.

    *   How it works: Use consistent indentation and formatting to enhance code readability.
    Generally, two or four spaces are used for indentation. Properly format code blocks,
    such as loops and conditionals, with appropriate spacing and line breaks.


    For example:


    ![](image_rsrc2U9.jpg)


    ## Use of Comments


    *   Daily example: Let''s say you''re working on a JavaScript function that performs
    a complex calculation.

    *   How it works: Use comments to explain the purpose, logic, and any important
    details within your code. Commenting can make the code more understandable for
    others and your future self. For example:


    ![](image_rsrc2UA.jpg)


    In this example, the comment above the function explains what the function does,
    providing clarity to anyone reading the code.


    ## Consistent Bracing and Parentheses


    *   Daily example: Suppose you''re working on a JavaScript function that includes
    conditional statements and loops.

    *   How it works: Use consistent placement of braces and parentheses to enhance
    code readability. Place opening braces at the end of a line and closing braces
    on a new line. Use parentheses for grouping expressions or to enhance clarity.
    For example:


    ![](image_rsrc2UB.jpg)


    In this example, the placement of braces and parentheses follows a consistent
    style, making the code more readable.


    ## Consistency with Semicolons and Quotes


    *   Daily example: Let''s consider you''re working on a JavaScript file that includes
    multiple statements.

    *   How it works: Maintain consistency in your use of semicolons and quotes. Choose
    either to use or not use semicolons at the end of statements, and choose either
    single or double quotes for string literals. Consistency improves code clarity
    and avoids unnecessary confusion. For example:


    ![](image_rsrc2UC.jpg)


    In this example, single quotes are used consistently for string literals, and
    semicolons are used at the end of statements.


    These examples demonstrate some of the coding conventions and style guide principles
    in JavaScript. It''s important to follow a consistent coding style and adhere
    to any existing style guide within your team or organization. Consistency and
    readability are key to writing maintainable and collaborative code.


    # Refactoring and code maintainability


    Refactoring is the process of improving existing code without changing its external
    behavior. It aims to enhance code readability, maintainability, and performance.
    Let''s explore refactoring techniques and code maintainability principles in JavaScript
    with daily examples:


    ## Single Responsibility Principle (SRP)


    *   Daily example: Suppose you have a JavaScript function that performs multiple
    tasks, such as validating user input and sending an API request.

    *   How it works: Refactor the function to adhere to the SRP, where each function
    or module should have a single responsibility. Split the function into smaller,
    focused functions, each responsible for a specific task. For example:


    ![](image_rsrc2UD.jpg)


    In this example, the initial function is refactored into three separate functions,
    each with a single responsibility. The `processUserInput` function now delegates
    to the other functions.


    ## DRY Principle (Don''t Repeat Yourself)


    *   Daily example: Imagine you have a JavaScript code snippet where the same piece
    of code is repeated in multiple places.

    *   How it works: Apply the DRY principle by extracting the duplicate code into
    reusable functions or modules. This reduces redundancy, improves code maintainability,
    and avoids potential issues when modifying duplicated code. For example:


    ![](image_rsrc2UE.jpg)


    In this example, the code for calculating the discounted price is extracted into
    a reusable function, `calculateDiscount`. This allows the code to be reused across
    multiple places without duplication.


    ## Proper Variable and Function Naming

