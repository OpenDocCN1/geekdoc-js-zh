    \ 代码转译为与旧版浏览器兼容的版本。\n*   开始编码：设置好开发环境后，你就可以开始使用最新版本的 JavaScript 进行编码了。创建你的 JavaScript\
    \ 文件，导入任何必要的库或模块，并使用该语言提供的最新语法和特性编写代码。\n\n请记住，要参考你所使用的特定库、框架和工具的官方文档和资源，以获取详细的说明和最佳实践。\n\
    \n# 变量和数据类型\n\n变量：在 JavaScript 中，变量使用 `let`、`const` 或 `var` 关键字声明。`let` 和 `const`\
    \ 关键字是在 ECMAScript 2015（ES6）中引入的，由于它们具有块级作用域，通常比 `var` 更受推荐。\n\n![](img/image_rsrc2NF.jpg)\n\
    \n数据类型：JavaScript 支持多种内置数据类型：\n\n1.  原始数据类型：\n    *   `Number`：表示数值，包括整数和浮点数。\n\
    \    *   `String`：表示用单引号或双引号括起来的字符序列。\n    *   `Boolean`：表示逻辑值，`true` 或 `false`。\n\
    \    *   `Null`：表示任何对象值的故意缺失。\n\n"
- fmt: "\n*   `Undefined`: Represents an uninitialized variable or missing property.\n\
    \n2.  Structural Data Types:\n\n    *   `Object`: Represents a collection of key-value\
    \ pairs, or properties.\n    *   `Array`: Represents an ordered list of values,\
    \ accessed by numeric indices.\n    *   `Map`: Represents a collection of key-value\
    \ pairs where the keys can be of any data type.\n    *   `Set`: Represents a collection\
    \ of unique values.\n\n3.  Other Data Types:\n\n    *   `Symbol`: Represents a\
    \ unique and immutable value that can be used as an identifier for object properties.\n\
    \    *   `BigInt`: Represents arbitrary precision integers, useful for working\
    \ with extremely large numbers.\n\nHere are some examples demonstrating the usage\
    \ of different data types:\n\n![](image_rsrc2NG.jpg)\n\nIt's worth noting that\
    \ JavaScript is a dynamically typed language, meaning variables can hold values\
    \ of any data type, and the data type can change during runtime.\n\nRemember to\
    \ consult the latest documentation and resources to ensure you have the most up-to-date\
    \ information regarding JavaScript's data types and their usage.\n\nLet's explain\
    \ variables and data types in JavaScript using relatable real-world examples:\n\
    \nVariables: In JavaScript, a variable is like a named container that holds a\
    \ value. It's similar to a box where you can store things. You can give the box\
    \ a name so that you can refer to it later and access what's inside.\n\nFor example,\
    \ let's imagine you have a box called `age` where you want to store your age:\n\
    \n![](image_rsrc2NH.jpg)\n\nNow you can use the variable `age` to represent your\
    \ age throughout your program. You can assign different values to the variable\
    \ as needed.\n\nData Types: Data types define the kind of values that variables\
    \ can hold. They describe the nature of the information you want to store. Let's\
    \ go through some common data types using everyday examples:\n\n1.  `Number`:\
    \ The `Number` data type represents numeric values like quantities. Think of it\
    \ as the representation of counting objects, like the number of apples you have:\n\
    \n![](image_rsrc2NJ.jpg)\n\n2.  `String`: The `String` data type represents sequences\
    \ of characters, such as text. You can think of it as a series of letters forming\
    \ words or sentences. For example, your name can be stored as a string:\n\n![](image_rsrc2NK.jpg)\n\
    \n3.  `Boolean`: The `Boolean` data type represents two values: `true` or `false`.\
    \ It's like a switch that can be either on or off. For instance, you can use it\
    \ to represent a condition, such as whether it's raining or not:\n\n![](image_rsrc2NM.jpg)\n\
    \n4.  `Array`: An `Array` is like a list where you can store multiple values together.\
    \ You can think of it as an array of items, such as a grocery shopping list:\n\
    \n![](image_rsrc2NN.jpg)\n\n5.  `Object`: An `Object` is like a collection of\
    \ related information stored together. You can think of it as a person with various\
    \ properties. For example, you can represent a person with their name and age:\n\
    \n![](image_rsrc2NP.jpg)\n\nThese are just a few basic examples to help you understand\
    \ variables and data types in JavaScript. As you progress, you'll learn more about\
    \ advanced data types and their usage.\n\nRemember, in JavaScript, variables can\
    \ hold different types of data, and you can change their values as needed throughout\
    \ your program.\n\n# Operators and expressions\n\nOperators and expressions in\
    \ JavaScript allow you to perform operations and manipulate data. They are fundamental\
