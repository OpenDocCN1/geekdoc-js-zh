  trans: "\n\n6. 路由与中间件：设想一个博客平台，用户可以在其中创建和发布文章。`Express.js` 可以轻松地为应用的不同部分定义路由，例如用于创建、读取、更新和删除文章的路由。此外，`Express.js`\
    \ 允许你使用中间件函数对传入的请求进行额外处理。例如，你可以创建中间件，在授予对某些路由的访问权限之前对用户进行身份验证，或者记录请求详情以供分析。`Express.js`\
    \ 简化了处理 HTTP 请求的过程，并为你的博客平台增加了灵活性。\n\n这些示例展示了如何将 `Node.js` 和 `Express.js` 应用于实际场景，提供高效的服务器端处理、处理并发请求，并为构建\
    \ Web 应用和 API 提供精简的开发框架。\n\n# 使用 JavaScript 构建 RESTful API\n\n使用 JavaScript 构建\
    \ RESTful API 是 `Node.js` 和 `Express.js` 的常见用例。REST（表述性状态转移）是一种使用 HTTP 方法和 URL\
    \ 与资源交互的架构风格。让我们通过日常示例来探索使用 JavaScript 构建 RESTful API 的过程：\n\n1. 创建待办事项列表 API：假设你正在构建一个任务管理应用，并希望创建一个用于管理待办事项列表的\
    \ API。借助 `Node.js` 和 `Express.js`，你可以定义路由来处理各种操作，例如创建、读取、更新和删除任务。\n\n   * 创建任务：用户可以向\
    \ `/tasks` 端点发送 `POST` 请求，并在请求体中包含任务详情。`Node.js` 和 `Express.js` 将处理此请求，验证输入，并将任务保存到数据库。\n\
    \n   * 读取任务：用户可以向 `/tasks` 端点发送 `GET` 请求，以获取所有任务的列表。服务器将从数据库获取任务，并以 JSON 格式返回包含任务数据的响应。\n\
    \n   * 更新任务：用户可以向 `/tasks/:taskId` 端点发送 `PUT` 或 `PATCH` 请求，在 URL 中提供任务 ID，并在请求体中提供更新后的任务详情。服务器将在数据库中找到对应的任务，进行更新，并返回表示成功的响应。\n\
    \n   * 删除任务：用户可以向 `/tasks/:taskId` 端点发送 `DELETE` 请求，在 URL 中提供任务 ID。服务器将在数据库中找到并删除该任务，并返回确认删除的响应。\n\
    \n2. 构建天气 API：假设你想创建一个根据用户位置提供天气信息的 API。使用 `Node.js` 和 `Express.js`，你可以实现以下功能：\n\
    \n   * 获取天气数据：用户可以向 `/weather/:location` 端点发送 `GET` 请求，其中 `:location` 表示所需位置。服务器将处理此请求，查询天气\
    \ API（例如 OpenWeatherMap），获取指定位置的天气数据，并以 JSON 格式返回给用户。\n\n3. 用户认证 API：设想构建一个处理用户注册、登录和访问受保护资源的\
    \ API。借助 `Node.js` 和 `Express.js`，你可以为以下操作创建端点：\n\n   * 用户注册：用户可以向 `/register`\
    \ 端点发送 `POST` 请求，在请求体中提供所需的用户名、电子邮件和密码。服务器将验证输入，对密码进行哈希处理，并将用户详情存储到数据库。\n\n  \
    \ * 用户登录：用户可以向 `/login` 端点发送 `POST` 请求，在请求体中提供用户名/电子邮件和密码。服务器将验证用户凭据，生成 JSON Web\
    \ 令牌（JWT），并将其作为响应返回给用户。\n\n   * 访问受保护资源：用户可以通过在请求头中包含 JWT 来向受保护端点发送经过身份验证的请求。服务器将验证\
    \ JWT，如果令牌有效则授予对请求资源的访问权限，并相应地返回数据。\n\n这些示例展示了如何使用 `Node.js` 和 `Express.js` 为各种应用构建\
    \ RESTful API。`Express.js` 提供的灵活性和易用性，加上 `Node.js` 的强大功能，使它们成为使用 JavaScript 创建健壮且可扩展\
    \ API 的热门选择。\n\n# 使用数据库\n\n使用数据库是构建 Web 应用的关键方面，而 `Node.js` 以及像 `Express.js` 这样的框架提供了与各种数据库交互的便捷方式。让我们通过日常示例来探索如何使用\
    \ MongoDB、MySQL 和 PostgreSQL 等流行数据库：\n\n1. MongoDB：MongoDB 是一种 NoSQL 数据库，以灵活的、类似\
    \ JSON 的文档形式存储数据。以下是一个如何使用 MongoDB 与 `Node.js` 和 `Express.js` 配合使用的示例：\n\n   *\
    \ 构建博客平台：假设你正在开发一个博客平台，用户可以在其中创建和发布文章。你可以使用 MongoDB 将文章数据存储为文档。借助 `Node.js` 和\
    \ `Express.js`，你可以定义路由来处理 CRUD 操作：\n\n     * 创建文章：用户可以向 `/articles` 端点发送 `POST`\
    \ 请求，并在请求体中包含文章详情。`Node.js` 和 `Express.js` 将接收此请求，验证输入，并将文章数据作为文档存储到 MongoDB。\n\
    \n     * 读取文章：用户可以向 `/articles` 端点发送 `GET` 请求，以获取文章列表。服务器将从 MongoDB 获取文章文档，并返回包含文章数据的响应。\n\
    \n     * 更新文章：用户可以向 `/articles/:articleId` 端点发送 `PUT` 或 `PATCH` 请求，在 URL 中提供文章\
    \ ID，并在请求体中提供更新后的文章详情。服务器将在 MongoDB 中找到对应的文章文档，进行更新，并返回表示成功的响应。\n\n     * 删除文章：用户可以向\
    \ `/articles/:articleId` 端点发送 `DELETE` 请求，在 URL 中提供文章 ID。服务器将在 MongoDB 中找到并删除对应的文章文档，并返回确认删除的响应。\n\
    \n2. MySQL：MySQL 是一种广泛使用的关系型数据库管理系统。以下是一个如何使用 MySQL 与 `Node.js` 和 `Express.js`\
    \ 配合使用的示例：\n\n   * 构建电商平台：假设你正在创建一个电商平台，用户可以在其中浏览和购买商品。你可以使用 MySQL 将商品信息存储在结构化的表中。借助\
    \ `Node.js` 和 `Express.js`，你可以定义路由来处理数据库操作：\n\n     * 获取商品详情：用户可以向 `/products/:productId`\
    \ 端点发送 `GET` 请求，在 URL 中提供商品 ID。`Node.js` 和 `Express.js` 将接收此请求，查询 MySQL 数据库中具有指定\
    \ ID 的商品，并返回商品详情作为响应。\n\n     * 将商品添加到购物车：用户可以向 `/cart` 端点发送 `POST` 请求，在请求体中提供商品\
    \ ID 和数量。服务器将接收此请求，验证输入，并将购物车信息存储到 MySQL 数据库。\n\n     * 更新购物车：用户可以向 `/cart/:cartItemId`\
    \ 端点发送 `PUT` 或 `PATCH` 请求，在 URL 中提供购物车项 ID，并在请求体中提供更新后的数量。服务器将在 MySQL 数据库中找到对应的购物车项，进行更新，并返回表示成功的响应。\n\
    \n     * 下订单：用户可以向 `/orders` 端点发送 `POST` 请求以提交订单。服务器将处理订单详情，将其存储到 MySQL 数据库，并返回确认订单提交的响应。\n\
    \n3. PostgreSQL：PostgreSQL 是一种开源的关系型数据库管理系统，以其可靠性和高级功能而闻名。以下是一个如何使用 PostgreSQL\
    \ 与 `Node.js` 和 `Express.js` 配合使用的示例：\n\n"
- fmt: "\n*   Building a user management system: Suppose you're developing a user\
    \ management system where users can register, login, and manage their profiles.\
    \ You can use `PostgreSQL` to store user information in tables. With `Node.js`\
    \ and `Express.js`, you can define routes for the following operations:\n\n  \
    \  *   User registration: Users can send a `POST` request to the `/register` endpoint,\
    \ providing their desired username, email, and password in the request body. The\
    \ server will receive this request, validate the input, and store the user details\
    \ in the `PostgreSQL` database.\n\n    *   User login: Users can send a `POST`\
    \ request to the `/login` endpoint, providing their username/email and password\
    \ in the request body. The server will authenticate the user's credentials by\
    \ querying the `PostgreSQL` database, generate a JSON Web Token (`JWT`), and return\
    \ it as a response.\n\n    *   Updating user profile: Authenticated users can\
    \ send a `PUT` or `PATCH` request to the `/profile` endpoint, providing the updated\
    \ user details in the request body. The server will find the user's record in\
    \ the `PostgreSQL` database, update it with the new information, and return a\
    \ response indicating success.\n\n    *   Deleting a user account: Authenticated\
    \ users can send a `DELETE` request to the `/users/:userId` endpoint, providing\
    \ their user ID in the URL. The server will find and delete the corresponding\
    \ user record from the `PostgreSQL` database, and return a response confirming\
    \ the account deletion.\n\nThese examples illustrate how `Node.js`, `Express.js`,\
    \ and different databases can be used together to handle various data operations.\
    \ Whether it's working with NoSQL databases like `MongoDB`, relational databases\
    \ like `MySQL` and `PostgreSQL`, or other database systems, `Node.js` provides\
    \ powerful libraries and frameworks that simplify database integration and data\
    \ management in your web applications.\n\n# Authentication and security\n\nAuthentication\
    \ and security are crucial aspects of building web applications to protect user\
    \ data and ensure secure access. Let's explore how you can implement authentication\
    \ and security measures in JavaScript with daily examples:\n\n1.  User Authentication\
    \ with `JWT`:\n\n    *   Daily example: Imagine you're developing a messaging\
    \ application. To secure user communication, you can implement user authentication\
    \ using JSON Web Tokens (`JWT`). Here's how it works:\n\n        *   User registration:\
    \ When a user registers, their credentials (e.g., username and password) are securely\
    \ stored in the database.\n\n        *   User login: When a user logs in with\
    \ their credentials, the server verifies the information, generates a `JWT`, and\
    \ sends it back to the client.\n\n        *   Protecting routes: For protected\
    \ routes, the client includes the `JWT` in the request headers. On the server\
    \ side, middleware validates the token and allows or denies access to the requested\
    \ resources accordingly.\n\n2.  Password Hashing and Salting:\n\n    *   Daily\
    \ example: Let's say you're building a social media platform. To securely store\
    \ user passwords, you can use hashing and salting techniques:\n\n        *   User\
    \ registration: When a user registers, their password is hashed using a one-way\
    \ hashing algorithm like `bcrypt`. Additionally, a unique salt is generated and\
    \ stored alongside the hashed password.\n\n        *   User login: When a user\
    \ logs in, their entered password is hashed with the stored salt, and the result\
    \ is compared against the stored hashed password. If they match, access is granted.\n\
    \n3.  Input Validation and Sanitization:\n\n    *   Daily example: Consider an\
    \ e-commerce application where users can submit product reviews. To prevent malicious\
    \ input and ensure data integrity:\n\n        *   Input validation: When a user\
    \ submits a review, the server validates the input to ensure it meets specified\
    \ criteria (e.g., length, format). This prevents malicious code injections and\
    \ protects against potential vulnerabilities.\n\n        *   Input sanitization:\
    \ The server sanitizes the user input by removing potentially harmful characters\
    \ or encoding them correctly. This helps prevent cross-site scripting (XSS) attacks\
    \ and improves application security.\n\n4.  Rate Limiting:\n\n    *   Daily example:\
    \ Suppose you're building a public API that provides weather data. To prevent\
    \ abuse and ensure fair usage, you can implement rate limiting:\n\n        * \
    \  Throttling requests: The server tracks the number of requests per user or IP\
    \ address within a specified time window. If the limit is exceeded, subsequent\
    \ requests are blocked or delayed, protecting the server from potential denial-of-service\
    \ (DoS) attacks or resource abuse.\n\n5.  HTTPS and SSL/TLS:\n\n    *   Daily\
    \ example: When building any web application that handles sensitive data, it's\
    \ essential to use HTTPS and SSL/TLS encryption:\n\n        *   Secure communication:\
    \ By enabling HTTPS and configuring an SSL/TLS certificate, data transmitted between\
    \ the client and server is encrypted, preventing unauthorized interception or\
    \ tampering.\n\nThese examples highlight some common authentication and security\
    \ measures implemented in JavaScript applications. By following best practices\
    \ and using appropriate security libraries and techniques, you can ensure the\
    \ confidentiality, integrity, and availability of your application and protect\
    \ user data from unauthorized access or malicious activities.\n\n# Deployment\
    \ and hosting options\n\nDeployment and hosting options are crucial considerations\
    \ when it comes to launching your web application. Let's explore different deployment\
    \ and hosting options with daily examples:\n\n1.  Shared Hosting:\n\n    *   Daily\
    \ example: Consider you're building a personal blog. Shared hosting can be a cost-effective\
    \ option for small-scale applications.\n\n    *   How it works: You purchase a\
    \ hosting plan from a shared hosting provider. Your application shares server\
    \ resources with other websites on the same server. The provider handles server\
    \ management and maintenance.\n\n2.  Virtual Private Server (VPS) Hosting:\n\n\
    \    *   Daily example: Suppose you're developing a custom e-commerce platform.\
    \ VPS hosting offers more control and resources compared to shared hosting.\n\n\
    \    *   How it works: With VPS hosting, you have dedicated virtual resources\
    \ on a physical server. You have more control over server configuration, and you\
    \ can install and manage your own software and applications.\n\n3.  Platform as\
    \ a Service (PaaS):\n\n    *   Daily example: Let's say you're developing a customer\
    \ relationship management (CRM) application. PaaS provides a managed environment,\
    \ allowing you to focus on application development.\n\n    *   How it works: You\
    \ deploy your application on a PaaS provider's platform, and they handle server\
    \ infrastructure, scaling, and maintenance. You can focus on writing code and\
    \ managing your application.\n\n4.  Infrastructure as a Service (IaaS):\n\n  \
    \  *   Daily example: Imagine you're creating a complex enterprise application.\
    \ IaaS offers the highest level of control and flexibility.\n\n    *   How it\
    \ works: With IaaS, you rent virtualized computing resources like virtual machines,\
    \ storage, and networks from a provider. You have complete control over the server\
    \ infrastructure, including the operating system, software installations, and\
    \ scaling.\n\n5.  Containerization and Orchestration (e.g., `Docker` and `Kubernetes`):\n\
    \n    *   Daily example: Suppose you're building a microservices-based application.\
    \ Containerization and orchestration provide scalability and easy management of\
    \ individual components.\n\n    *   How it works: Containers encapsulate your\
    \ application and its dependencies into portable units. Tools like `Docker` enable\
    \ you to package and deploy these containers. Orchestration tools like `Kubernetes`\
    \ help manage containerized applications, handle scaling, and ensure high availability.\n\
    \n6.  Serverless Computing:\n\n    *   Daily example: Consider you're developing\
    \ a serverless function for image processing. Serverless computing allows you\
    \ to run code without provisioning or managing servers.\n"
  raw: "*   Building a user management system: Suppose you're developing a user management\
    \ system where users can register, login, and manage their profiles. You can use\
    \ PostgreSQL to store user information in tables. With Node.js and Express.js,\
    \ you can define routes for the following operations:\n\n    *   User registration:\
    \ Users can send a POST request to the /register endpoint, providing their desired\
    \ username, email, and password in the request body. The server will receive this\
    \ request, validate the input, and store the user details in the PostgreSQL database.\n\
    \n    *   User login: Users can send a POST request to the /login endpoint, providing\
    \ their username/email and password in the request body. The server will authenticate\
    \ the user's credentials by querying the PostgreSQL database, generate a JSON\
    \ Web Token (JWT), and return it as a response.\n\n    *   Updating user profile:\
    \ Authenticated users can send a PUT or PATCH request to the /profile endpoint,\
    \ providing the updated user details in the request body. The server will find\
    \ the user's record in the PostgreSQL database, update it with the new information,\
    \ and return a response indicating success.\n\n    *   Deleting a user account:\
    \ Authenticated users can send a DELETE request to the /users/:userId endpoint,\
    \ providing their user ID in the URL. The server will find and delete the corresponding\
    \ user record from the PostgreSQL database, and return a response confirming the\
    \ account deletion.\n\nThese examples illustrate how Node.js, Express.js, and\
    \ different databases can be used together to handle various data operations.\
    \ Whether it's working with NoSQL databases like MongoDB, relational databases\
    \ like MySQL and PostgreSQL, or other database systems, Node.js provides powerful\
    \ libraries and frameworks that simplify database integration and data management\
    \ in your web applications.\n\n# Authentication and security\n\nAuthentication\
    \ and security are crucial aspects of building web applications to protect user\
    \ data and ensure secure access. Let's explore how you can implement authentication\
    \ and security measures in JavaScript with daily examples:\n\n1.  User Authentication\
    \ with JWT:\n\n    *   Daily example: Imagine you're developing a messaging application.\
    \ To secure user communication, you can implement user authentication using JSON\
    \ Web Tokens (JWT). Here's how it works:\n\n        *   User registration: When\
    \ a user registers, their credentials (e.g., username and password) are securely\
    \ stored in the database.\n\n        *   User login: When a user logs in with\
    \ their credentials, the server verifies the information, generates a JWT, and\
    \ sends it back to the client.\n\n        *   Protecting routes: For protected\
    \ routes, the client includes the JWT in the request headers. On the server side,\
    \ middleware validates the token and allows or denies access to the requested\
    \ resources accordingly.\n\n2.  Password Hashing and Salting:\n\n    *   Daily\
    \ example: Let's say you're building a social media platform. To securely store\
    \ user passwords, you can use hashing and salting techniques:\n\n        *   User\
    \ registration: When a user registers, their password is hashed using a one-way\
    \ hashing algorithm like bcrypt. Additionally, a unique salt is generated and\
    \ stored alongside the hashed password.\n\n        *   User login: When a user\
    \ logs in, their entered password is hashed with the stored salt, and the result\
    \ is compared against the stored hashed password. If they match, access is granted.\n\
    \n3.  Input Validation and Sanitization:\n\n    *   Daily example: Consider an\
    \ e-commerce application where users can submit product reviews. To prevent malicious\
    \ input and ensure data integrity:\n\n        *   Input validation: When a user\
    \ submits a review, the server validates the input to ensure it meets specified\
    \ criteria (e.g., length, format). This prevents malicious code injections and\
    \ protects against potential vulnerabilities.\n\n        *   Input sanitization:\
    \ The server sanitizes the user input by removing potentially harmful characters\
    \ or encoding them correctly. This helps prevent cross-site scripting (XSS) attacks\
    \ and improves application security.\n\n4.  Rate Limiting:\n\n    *   Daily example:\
    \ Suppose you're building a public API that provides weather data. To prevent\
    \ abuse and ensure fair usage, you can implement rate limiting:\n\n        * \
    \  Throttling requests: The server tracks the number of requests per user or IP\
    \ address within a specified time window. If the limit is exceeded, subsequent\
    \ requests are blocked or delayed, protecting the server from potential denial-of-service\
    \ (DoS) attacks or resource abuse.\n\n5.  HTTPS and SSL/TLS:\n\n    *   Daily\
    \ example: When building any web application that handles sensitive data, it's\
    \ essential to use HTTPS and SSL/TLS encryption:\n\n        *   Secure communication:\
    \ By enabling HTTPS and configuring an SSL/TLS certificate, data transmitted between\
    \ the client and server is encrypted, preventing unauthorized interception or\
    \ tampering.\n\nThese examples highlight some common authentication and security\
    \ measures implemented in JavaScript applications. By following best practices\
    \ and using appropriate security libraries and techniques, you can ensure the\
    \ confidentiality, integrity, and availability of your application and protect\
    \ user data from unauthorized access or malicious activities.\n\n# Deployment\
    \ and hosting options\n\nDeployment and hosting options are crucial considerations\
    \ when it comes to launching your web application. Let's explore different deployment\
    \ and hosting options with daily examples:\n\n1.  Shared Hosting:\n\n    *   Daily\
    \ example: Consider you're building a personal blog. Shared hosting can be a cost-effective\
    \ option for small-scale applications.\n\n    *   How it works: You purchase a\
    \ hosting plan from a shared hosting provider. Your application shares server\
    \ resources with other websites on the same server. The provider handles server\
    \ management and maintenance.\n\n2.  Virtual Private Server (VPS) Hosting:\n\n\
    \    *   Daily example: Suppose you're developing a custom e-commerce platform.\
    \ VPS hosting offers more control and resources compared to shared hosting.\n\n\
    \    *   How it works: With VPS hosting, you have dedicated virtual resources\
    \ on a physical server. You have more control over server configuration, and you\
    \ can install and manage your own software and applications.\n\n3.  Platform as\
    \ a Service (PaaS):\n\n    *   Daily example: Let's say you're developing a customer\
    \ relationship management (CRM) application. PaaS provides a managed environment,\
    \ allowing you to focus on application development.\n\n    *   How it works: You\
    \ deploy your application on a PaaS provider's platform, and they handle server\
    \ infrastructure, scaling, and maintenance. You can focus on writing code and\
    \ managing your application.\n\n4.  Infrastructure as a Service (IaaS):\n\n  \
    \  *   Daily example: Imagine you're creating a complex enterprise application.\
    \ IaaS offers the highest level of control and flexibility.\n\n    *   How it\
    \ works: With IaaS, you rent virtualized computing resources like virtual machines,\
    \ storage, and networks from a provider. You have complete control over the server\
    \ infrastructure, including the operating system, software installations, and\
    \ scaling.\n\n5.  Containerization and Orchestration (e.g., Docker and Kubernetes):\n\
    \n    *   Daily example: Suppose you're building a microservices-based application.\
    \ Containerization and orchestration provide scalability and easy management of\
    \ individual components.\n\n    *   How it works: Containers encapsulate your\
    \ application and its dependencies into portable units. Tools like Docker enable\
    \ you to package and deploy these containers. Orchestration tools like Kubernetes\
    \ help manage containerized applications, handle scaling, and ensure high availability.\n\
    \n6.  Serverless Computing:\n\n    *   Daily example: Consider you're developing\
    \ a serverless function for image processing. Serverless computing allows you\
    \ to run code without provisioning or managing servers."
