    \    *   `BigInt`：表示任意精度的整数，适用于处理极大的数字。\n\n以下是一些演示不同数据类型用法的示例：\n\n![](img/image_rsrc2NG.jpg)\n\
    \n值得注意的是，JavaScript 是一种动态类型语言，这意味着变量可以保存任何数据类型的值，并且数据类型可以在运行时改变。\n\n请务必查阅最新的文档和资源，以确保你掌握关于\
