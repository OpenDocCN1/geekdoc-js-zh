  trans: "\n24.  哪个 API 为发起 HTTP 请求提供了比 `XMLHttpRequest` 等旧方法更灵活、更强大的替代方案？  \n   \
    \ a. Fetch API  \n    b. MediaDevices API  \n    c. Audio API  \n    d. Local\
    \ Storage API  \n\n    答案：a\n\n25.  使用 Babel 作为转译器的目的是什么？  \n    a. 优化 JavaScript\
    \ 代码的性能。  \n    b. 将 ES6 代码转换为等效的 ES5 代码，以便与旧版浏览器兼容。  \n    c. 在 JavaScript 中处理多媒体元素。\
    \  \n    d. 为 ECMAScript 特性提供 polyfill。  \n\n    答案：b\n\n26.  使用 CSS Grid polyfill\
    \ 的目的是什么？  \n    a. 为本身不支持 CSS Grid 功能的浏览器提供其实现。  \n    b. 优化 CSS Grid 布局的性能。\
    \  \n    c. 在 CSS 中处理多媒体元素。  \n    d. 将 CSS 样式转换为 JavaScript 代码。  \n\n    答案：a\n\
    \n27.  在 JavaScript 中进行客户端表单验证的目的是什么？  \n    a. 确保数据的完整性和安全性。  \n    b. 增强 Web\
    \ 应用的交互性和功能性。  \n    c. 处理表单中的多媒体元素。  \n    d. 确保表单与不同浏览器的兼容性。  \n\n    答案：a\n\
    \n28.  如何在 JavaScript 中访问表单元素？  \n    a. 通过使用 `getElementById()` 或 `querySelector()`\
    \ 等方法。  \n    b. 通过包含与表单相关的 polyfill。  \n    c. 通过使用 Audio 和 Video 对象。  \n   \
    \ d. 通过动态修改 CSS 属性。  \n\n    答案：a\n\n29.  除了客户端验证之外，服务器端验证的目的是什么？  \n    a. 减少服务器往返的需求。\
    \  \n    b. 向用户提供即时反馈。  \n    c. 确保数据的完整性和安全性。  \n    d. 增强 Web 应用的交互性和功能性。  \n\
    \n    答案：c\n\n30.  如何使用 JavaScript 动态更改网页上元素的外观？  \n    a. 通过使用 style 属性修改元素的内联样式。\
    \  \n    b. 通过包含与 CSS 相关的 polyfill。  \n    c. 通过使用 Audio 和 Video 对象操作音频和视频播放。\
    \  \n    d. 通过优化多媒体元素的性能。  \n\n    答案：a\n\n![](img/image_rsrc2TY.jpg)![](img/image_rsrc2TZ.jpg)\n\
    \n# Node.js 和 Express.js 简介\n\nNode.js 是一个运行时环境，允许你在 Web 浏览器之外执行 JavaScript 代码。它基于\
    \ V8 JavaScript 引擎构建，该引擎也是 Google Chrome 浏览器的核心引擎。Node.js 提供了一种强大且高效的方式，使用 JavaScript\
    \ 运行服务器端应用程序。\n\nExpress.js 是一个用于 Node.js 的 Web 应用框架。它旨在提供一种简单而灵活的方式来构建 Web 应用和\
    \ API。Express.js 构建在 Node.js 提供的核心功能之上，增加了额外的特性和抽象，使得处理 HTTP 请求、路由、中间件等更加容易。\n\
    \n使用 Node.js 和 Express.js 的主要优势之一在于它们的非阻塞、事件驱动架构。这意味着服务器可以同时处理多个请求，而不会阻塞其他代码的执行。这使得\
    \ Node.js 和 Express.js 特别适合构建可扩展且高性能的 Web 应用。\n\n以下是 Node.js 和 Express.js 相关的一些关键概念：\n\
    \n1.  **服务器端 JavaScript**：Node.js 允许你编写在服务器上运行的 JavaScript 代码，使你能够在应用的前端和后端使用同一种语言和技能。\n\
    \n2.  **异步编程**：Node.js 采用异步、非阻塞的 I/O 模型，这意味着它可以并发处理多个请求。这使得它在处理大量并发连接时非常高效。\n\n\
    3.  **事件驱动架构**：Node.js 使用事件驱动架构，通过回调函数或事件监听器来处理诸如传入 HTTP 请求等事件。这使你能够以响应式的方式编写代码来响应事件。\n\
    \n4.  **模块与包管理**：Node.js 内置了模块系统，允许你将代码组织成可复用的模块。Node 包管理器（`npm`）是一个强大的工具，可帮助你管理\
    \ Node.js 项目的外部库和依赖项。\n\n5.  **路由与中间件**：Express.js 提供了一种路由机制，允许你定义 URL 模式并将其映射到特定的函数或控制器。中间件函数可用于对传入请求进行额外处理，或在将响应发送回客户端之前修改响应。\n\
    \n6.  **模板引擎**：Express.js 支持多种模板引擎，例如 EJS、Pug（原名 Jade）和 Handlebars。模板引擎通过将 HTML\
    \ 模板与数据结合，帮助你生成动态 HTML 页面。\n\n以上只是 Node.js 和 Express.js 相关的一些基本概念。它们提供了一种强大且高效的方式，使用\
    \ JavaScript 构建服务器端应用，因此成为 Web 开发的热门选择。\n\n让我们用日常例子来解释 Node.js 和 Express.js 的概念：\n\
    \n1.  **Node.js**：想象你正在运营一个送餐服务。当客户在你的网站上下单时，你需要一种方式来处理订单并通知厨房。Node.js 就像幕后引擎，负责处理这一过程。它允许你在服务器上执行\
    \ JavaScript 代码，因此你可以实时接收订单详情、处理付款并向厨房工作人员发送通知。Node.js 使你能够高效地运行送餐服务的服务器端操作。\n\
    \n2.  **Express.js**：继续以送餐为例，Express.js 就像一个用于管理订单流程的简化系统。它提供了一个框架，简化了处理传入请求和管理路由的过程。在这种情况下，Express.js\
    \ 帮助你定义接收订单请求、处理付款验证以及与厨房协调的路由。它提供了一种灵活且有条理的方式来构建驱动送餐服务的 Web 应用。\n\n3.  **异步编程**：考虑一个社交媒体应用，用户可以上传和分享照片。借助\
    \ Node.js 及其异步编程模型，你可以同时处理多个照片上传，而不会阻塞其他进程。这意味着当一个用户正在上传照片时，其他用户可以继续使用应用并执行其他操作，例如评论帖子或发送消息。Node.js\
    \ 让你的社交媒体应用能够高效处理多个并发任务，提供流畅的用户体验。\n\n4.  **事件驱动架构**：想象一个聊天应用，用户可以发送即时消息。Node.js\
    \ 及其事件驱动架构非常适合这种场景。当用户发送消息时，Node.js 监听该事件并触发回调函数来处理消息。这种事件驱动的方法让你的聊天应用能够响应式地响应用户操作，确保消息实时发送和接收。\n\
    \n5.  **模块与包管理**：假设你正在构建一个电子商务平台，用户可以浏览和购买商品。借助 Node.js，你可以将代码库拆分为模块化组件。例如，你可以创建用于处理用户认证、商品列表、购物车管理和付款处理的模块。Node.js\
    \ 提供了内置的模块系统，允许你组织并在应用中复用这些组件。此外，借助 Node 包管理器（`npm`），你可以轻松管理电子商务平台所需的外部库和依赖项。\n"
- fmt: "\n6. Routing and middleware: Consider a blogging platform where users can\
    \ create and publish articles. `Express.js` makes it easy to define routes for\
    \ different parts of your application, such as routes for creating, reading, updating,\
    \ and deleting articles. Additionally, `Express.js` allows you to use middleware\
    \ functions to perform additional processing on incoming requests. For example,\
    \ you can create middleware to authenticate users before granting access to certain\
    \ routes or to log request details for analysis. `Express.js` simplifies the process\
    \ of handling HTTP requests and adds flexibility to your blogging platform.\n\n\
    These examples demonstrate how `Node.js` and `Express.js` can be applied to real-world\
    \ scenarios, providing efficient server-side processing, handling concurrent requests,\
    \ and offering streamlined development frameworks for building web applications\
    \ and APIs.\n\n# Building RESTful APIs with JavaScript\n\nBuilding RESTful APIs\
    \ with JavaScript is a common use case for `Node.js` and `Express.js`. REST (Representational\
    \ State Transfer) is an architectural style that uses HTTP methods and URLs to\
    \ interact with resources. Let's explore the process of building RESTful APIs\
    \ with JavaScript using daily examples:\n\n1. Creating a Todo List API: Imagine\
    \ you're building a task management application, and you want to create an API\
    \ for managing todo lists. With `Node.js` and `Express.js`, you can define routes\
    \ to handle various operations such as creating, reading, updating, and deleting\
    \ tasks.\n\n   * Creating a task: Users can send a `POST` request to the `/tasks`\
    \ endpoint with the task details in the request body. `Node.js` and `Express.js`\
    \ will handle this request, validate the input, and save the task to a database.\n\
    \n   * Reading tasks: Users can send a `GET` request to the `/tasks` endpoint\
    \ to retrieve a list of all tasks. The server will fetch the tasks from the database\
    \ and send the response with the task data in JSON format.\n\n   * Updating a\
    \ task: Users can send a `PUT` or `PATCH` request to the `/tasks/:taskId` endpoint,\
    \ providing the task ID in the URL and the updated task details in the request\
    \ body. The server will find the corresponding task in the database, update it,\
    \ and return a response indicating success.\n\n   * Deleting a task: Users can\
    \ send a `DELETE` request to the `/tasks/:taskId` endpoint, providing the task\
    \ ID in the URL. The server will find and delete the task from the database, and\
    \ return a response confirming the deletion.\n\n2. Building a Weather API: Let's\
    \ say you want to create an API that provides weather information based on a user's\
    \ location. Using `Node.js` and `Express.js`, you can implement the following\
    \ functionality:\n\n   * Retrieving weather data: Users can send a `GET` request\
    \ to the `/weather/:location` endpoint, where `:location` represents the desired\
    \ location. The server will handle this request, query a weather API (such as\
    \ OpenWeatherMap), fetch the weather data for the specified location, and return\
    \ it to the user in JSON format.\n\n3. User Authentication API: Consider building\
    \ an API that handles user registration, login, and access to protected resources.\
    \ With `Node.js` and `Express.js`, you can create endpoints for the following\
    \ operations:\n\n   * User registration: Users can send a `POST` request to the\
    \ `/register` endpoint, providing their desired username, email, and password\
    \ in the request body. The server will validate the input, hash the password,\
    \ and store the user details in a database.\n\n   * User login: Users can send\
    \ a `POST` request to the `/login` endpoint, providing their username/email and\
    \ password in the request body. The server will authenticate the user's credentials,\
    \ generate a JSON Web Token (JWT), and return it to the user as a response.\n\n\
    \   * Accessing protected resources: Users can send authenticated requests to\
    \ protected endpoints by including the JWT in the request headers. The server\
    \ will validate the JWT, grant access to the requested resources if the token\
    \ is valid, and return the data accordingly.\n\nThese examples demonstrate how\
    \ `Node.js` and `Express.js` can be used to build RESTful APIs for various applications.\
    \ The flexibility and ease of use provided by `Express.js`, along with the powerful\
    \ capabilities of `Node.js`, make them a popular choice for creating robust and\
    \ scalable APIs with JavaScript.\n\n# Working with databases\n\nWorking with databases\
    \ is a crucial aspect of building web applications, and `Node.js`, along with\
    \ frameworks like `Express.js`, provides convenient ways to interact with various\
    \ databases. Let's explore how you can work with popular databases like MongoDB,\
    \ MySQL, and PostgreSQL using daily examples:\n\n1. MongoDB: MongoDB is a NoSQL\
    \ database that stores data in flexible, JSON-like documents. Here's an example\
    \ of how you can use MongoDB with `Node.js` and `Express.js`:\n\n   * Building\
    \ a blogging platform: Suppose you're developing a blogging platform where users\
    \ can create and publish articles. You can use MongoDB to store the article data\
    \ as documents. With `Node.js` and `Express.js`, you can define routes to handle\
    \ CRUD operations:\n\n     * Creating an article: Users can send a `POST` request\
    \ to the `/articles` endpoint with the article details in the request body. `Node.js`\
    \ and `Express.js` will receive this request, validate the input, and store the\
    \ article data as a document in MongoDB.\n\n     * Reading articles: Users can\
    \ send a `GET` request to the `/articles` endpoint to retrieve a list of articles.\
    \ The server will fetch the article documents from MongoDB and send the response\
    \ with the article data.\n\n     * Updating an article: Users can send a `PUT`\
    \ or `PATCH` request to the `/articles/:articleId` endpoint, providing the article\
    \ ID in the URL and the updated article details in the request body. The server\
    \ will find the corresponding article document in MongoDB, update it, and return\
    \ a response indicating success.\n\n     * Deleting an article: Users can send\
    \ a `DELETE` request to the `/articles/:articleId` endpoint, providing the article\
    \ ID in the URL. The server will find and delete the corresponding article document\
    \ from MongoDB, and return a response confirming the deletion.\n\n2. MySQL: MySQL\
    \ is a widely-used relational database management system. Here's an example of\
    \ how you can use MySQL with `Node.js` and `Express.js`:\n\n   * Building an e-commerce\
    \ platform: Let's say you're creating an e-commerce platform where users can browse\
    \ and purchase products. You can use MySQL to store product information in structured\
    \ tables. With `Node.js` and `Express.js`, you can define routes to handle database\
    \ operations:\n\n     * Retrieving product details: Users can send a `GET` request\
    \ to the `/products/:productId` endpoint, providing the product ID in the URL.\
    \ `Node.js` and `Express.js` will receive this request, query the MySQL database\
    \ for the product with the specified ID, and return the product details as a response.\n\
    \n     * Adding a product to the cart: Users can send a `POST` request to the\
    \ `/cart` endpoint, providing the product ID and quantity in the request body.\
    \ The server will receive this request, validate the input, and store the cart\
    \ information in the MySQL database.\n\n     * Updating the cart: Users can send\
