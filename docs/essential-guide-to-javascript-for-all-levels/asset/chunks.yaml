    ## 2. Classes:


    ES6 introduced the `class` syntax, providing a more traditional way to define
    and create objects using a blueprint. Classes can have properties and methods,
    and you can create instances of the class using the `new` keyword.


    ![](image_rsrc2RZ.jpg)


    ## 3. Inheritance:


    JavaScript supports prototypal inheritance, where objects can inherit properties
    and methods from other objects. The `extends` keyword is used to create a subclass
    that inherits from a superclass.


    ![](image_rsrc2S0.jpg)


    ## 4. Encapsulation:


    Encapsulation is the principle of bundling data and related methods together within
    an object, hiding internal implementation details. In JavaScript, you can use
    closures or class methods to achieve encapsulation.


    ![](image_rsrc2S1.jpg)


