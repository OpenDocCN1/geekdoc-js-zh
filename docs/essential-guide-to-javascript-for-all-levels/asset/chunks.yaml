    # Functions


    A function in JavaScript is a reusable block of code that performs a specific
    task or calculates a value. Functions are defined with a name, a set of parameters
    (optional), and a block of code.


    ## Function Declaration


    ![](image_rsrc2P5.jpg)


    ## Function Expression (anonymous function)


    ![](image_rsrc2P6.jpg)


    ## Arrow Function (ES6+)


    ![](image_rsrc2P7.jpg)


    ## Function Invocation


    To execute a function, you "invoke" or "call" it by using its name followed by
    parentheses. You can pass arguments (values) into the function.


    ![](image_rsrc2P8.jpg)


    ## Function Return


    A function can return a value using the `return` statement. This allows the function
    to provide an output that can be stored in a variable or used in further calculations.


    ![](image_rsrc2P9.jpg)


    ## Scope


    Scope refers to the visibility and accessibility of variables and functions in
    different parts of your code.


    ### Global Scope


    Variables declared outside of any function or block have global scope. They can
    be accessed from anywhere in your code.


    ![](image_rsrc2PA.jpg)


    ### Local Scope


    Variables declared inside a function have local scope. They can only be accessed
    within that function.


    ![](image_rsrc2PB.jpg)


    ### Block Scope (ES6+)


    Variables declared with `let` or `const` inside a block (within curly braces)
    have block scope. They are only accessible within that block.


    ![](image_rsrc2PC.jpg)


    Understanding functions and scope is crucial for organizing and modularizing your
    code, as well as managing variable accessibility and preventing naming conflicts.


    # Arrays and objects


    Arrays and objects are two important data structures in JavaScript that allow
    you to store and manipulate collections of values. Here''s an explanation of arrays
    and objects in JavaScript:


    ## Arrays


    An array is an ordered collection of values, where each value is assigned a numeric
    index starting from 0. Arrays can hold multiple values of different types, such
    as numbers, strings, booleans, or even other arrays.


    ### Creating an Array


    ![](image_rsrc2PD.jpg)


    ### Accessing Array Elements


    ![](image_rsrc2PE.jpg)


    ### Modifying Array Elements


    ![](image_rsrc2PF.jpg)


    ### Array Methods


    JavaScript provides various built-in methods for working with arrays. Some commonly
    used array methods include `push()`, `pop()`, `shift()`, `unshift()`, `slice()`,
    `splice()`, `concat()`, `join()`, and more.


    ## Objects


    An object is an unordered collection of key-value pairs, where each key is a string
    (or symbol) that maps to a value. Objects can store different types of values
    and even other objects or arrays.


    ### Creating an Object


    ![](image_rsrc2PG.jpg)


    ### Accessing Object Properties


    ![](image_rsrc2PH.jpg)


    ### Modifying Object Properties


    ![](image_rsrc2PJ.jpg)


    ### Adding New Properties


    ![](image_rsrc2PK.jpg)


    ### Object Methods


    Objects can also contain functions, which are referred to as object methods. These
    methods can be used to perform actions or calculations related to the object.


    ![](image_rsrc2PM.jpg)


    Arrays and objects are powerful tools for organizing and manipulating data in
    JavaScript. Understanding their syntax and available methods will help you work
    with complex data structures efficiently.


    # Working with strings


    Working with strings in JavaScript involves performing various operations on textual
    data. Here are some practical and simple examples of working with strings:


    ## Creating a String


    You can create a string by enclosing the text within single quotes (`''`) or double
    quotes (`"`).


    ![](image_rsrc2PN.jpg)


    ## String Concatenation


    You can concatenate strings using the `+` operator or the `concat()` method.


    ![](image_rsrc2PP.jpg)


    ## Accessing Characters


    You can access individual characters in a string using square brackets (`[]`)
    and the zero-based index.


    ![](image_rsrc2PR.jpg)


    ## String Length


    To find the length (number of characters) in a string, use the `length` property.


    ![](image_rsrc2PS.jpg)![](image_rsrc2PT.jpg)![](image_rsrc2PU.jpg)


    These are just a few examples of working with strings in JavaScript. Understanding
    and utilizing string operations will help you manipulate and process textual data
    effectively in your code.


    # Introduction to the DOM


    ![](image_rsrc2PV.jpg)


    The Document Object Model (DOM) is a programming interface for web documents.
    It represents the structure of an HTML or XML document as a tree-like structure,
    where each node in the tree corresponds to a part of the document. The DOM provides
    methods and properties to manipulate and interact with the document dynamically
    using JavaScript. Here''s a brief introduction to the DOM in JavaScript:


    ## Accessing the DOM


    You can access the DOM using the global `document` object, which represents the
    entire web page.


    ![](image_rsrc2PW.jpg)


    ## Selecting Elements


    The DOM provides several methods to select elements from the document based on
    their ID, class, tag name, or other attributes.


    - `getElementById()`: Selects an element with a specific ID.

    - `getElementsByClassName()`: Selects elements with a specific class name.

    - `getElementsByTagName()`: Selects elements with a specific tag name.

    - `querySelector()`: Selects the first element that matches a CSS selector.

    - `querySelectorAll()`: Selects all elements that match a CSS selector.


    ![](image_rsrc2PX.jpg)


    ## Modifying Elements


    You can modify elements'' properties, attributes, and content using various DOM
    methods and properties.


    - `textContent`: Gets or sets the text content of an element.

    - `innerHTML`: Gets or sets the HTML content of an element.

    - `setAttribute()`: Sets the value of an attribute for an element.

    - `style`: Allows you to manipulate the CSS properties of an element.


    ![](image_rsrc2PY.jpg)


    ## Handling Events


    The DOM allows you to respond to user interactions and events, such as clicking
    a button or submitting a form.


    - `addEventListener()`: Attaches an event listener to an element to handle a specific
    event.


    ![](image_rsrc2PZ.jpg)


    ## Creating and Modifying Elements


    You can dynamically create new elements and append them to the document using
    DOM methods.


    - `createElement()`: Creates a new element.

    - `appendChild()`: Appends a new element as a child to another element.


    ![](image_rsrc2R0.jpg)


    The DOM provides a powerful way to interact with HTML documents dynamically using
    JavaScript. It allows you to manipulate elements, respond to events, create new
    elements, and much more. Understanding the DOM is essential for building interactive
    web applications.


    # Accessing and manipulating DOM elements


    To access and manipulate DOM elements in JavaScript, you can use various methods
    and properties provided by the Document Object Model (DOM). Here''s an overview
    of commonly used techniques:


    ## Accessing Elements


    You can select elements from the DOM using methods like `getElementById()`, `getElementsByClassName()`,
    `getElementsByTagName()`, `querySelector()`, and `querySelectorAll()`.


    ![](image_rsrc2R1.jpg)


    ## Modifying Element Content


    You can manipulate the content of elements using properties like `textContent`
    and `innerHTML`.


    ![](image_rsrc2R2.jpg)


    ## Modifying Element Attributes


    You can update the attributes of an element using methods like `setAttribute()`
    and `getAttribute()`.


    ![](image_rsrc2R3.jpg)


    ## Manipulating Element Styles


    You can modify the CSS styles of an element using the `style` property.


    ![](image_rsrc2R4.jpg)


    ## Adding and Removing Classes


    You can add or remove CSS classes from an element using the `classList` property.


    ![](image_rsrc2R5.jpg)


    ## Handling Events


    You can attach event listeners to elements using the `addEventListener()` method
    to respond to user interactions.


    ![](image_rsrc2R6.jpg)


    ## Creating and Appending Elements


    You can dynamically create new elements and append them to the DOM using methods
    like `createElement()` and `appendChild()`.


