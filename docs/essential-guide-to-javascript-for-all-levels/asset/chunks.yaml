    # 字符串操作


    在 JavaScript 中操作字符串涉及对文本数据执行各种操作。以下是一些实用且简单的字符串操作示例：


    ## 创建字符串


    你可以通过将文本括在单引号（`''`）或双引号（`"`）中来创建字符串。


    ![](img/image_rsrc2PN.jpg)


    ## 字符串拼接


    你可以使用 `+` 运算符或 `concat()` 方法来拼接字符串。


    ![](img/image_rsrc2PP.jpg)


    ## 访问字符


    你可以使用方括号（`[]`）和基于 0 的索引来访问字符串中的单个字符。


    ![](img/image_rsrc2PR.jpg)


    ## 字符串长度


