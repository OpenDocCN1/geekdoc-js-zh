    Manipulating Images: Once an image is loaded, you can perform various operations
    on it, such as resizing, cropping, applying filters, and drawing on a canvas using
    the 2D context.


    Example:


    ![](image_rsrc2TK.jpg)


    In this example, the `drawImage()` method is used to draw the loaded image onto
    a canvas element.


    Audio and Video Playback: JavaScript provides the `Audio` and `Video` objects
    to handle audio and video playback. You can create an `Audio` or `Video` object,
    set the source URL, and control playback using methods and properties.


    Example:


