    audio and video media devices. Once access is granted, you can access the media
    stream and its audio and video tracks.


    These are just a few examples of how you can work with multimedia in JavaScript.
    JavaScript also provides additional APIs and libraries, such as HTML5 Canvas,
    WebGL, Web Audio API, and video.js, which offer more advanced capabilities for
    multimedia manipulation and presentation.


    # Manipulating CSS styles


    Manipulating CSS styles with JavaScript allows you to dynamically change the appearance
    and behavior of elements on a web page. You can modify CSS properties, add or
    remove classes, and manipulate inline styles using JavaScript. Here''s an overview
    of how you can manipulate CSS styles:


    Accessing Elements: Start by accessing the HTML element(s) you want to manipulate
    using JavaScript. This can be done using methods like `getElementById()`, `querySelector()`,
    or `getElementsByClassName()`.


    Example:


    ![](image_rsrc2TR.jpg)![](image_rsrc2TS.jpg)


    Modifying Inline Styles: You can directly modify the inline styles of an element
    using the `style` property. The `style` property provides access to all the inline
    CSS properties of an element, and you can change them dynamically.


    Example:


    ![](image_rsrc2TT.jpg)


    In this example, the background color of `myDiv` is changed to red, and the font
    size is set to 20 pixels.


    Adding and Removing Classes: You can manipulate CSS classes on elements using
    the `classList` property. The `classList` property provides methods like `add()`,
    `remove()`, and `toggle()` to add, remove, or toggle classes on an element.


    Example:


    ![](image_rsrc2TU.jpg)


    In this example, the class highlight is added to `myDiv`, and the class box is
    removed.


    Modifying CSS Properties: You can directly modify individual CSS properties of
    an element using the `style` property. You can access properties like `backgroundColor`,
    `fontSize`, `display`, etc., and change their values.


    Example:


    ![](image_rsrc2TV.jpg)


    In this example, the background color is changed to blue, the font size is set
    to 24 pixels, and the element is hidden by setting the `display` property to none.


    CSS Transitions and Animations: You can use JavaScript to add or remove CSS classes
    that define transitions or animations. This allows you to create dynamic and interactive
    effects on elements.


    Example:


    ![](image_rsrc2TW.jpg)![](image_rsrc2TX.jpg)


    In this example, the fade-in class is added to `myDiv`, which triggers a fade-in
    effect defined in CSS with a transition property.


    By manipulating CSS styles with JavaScript, you can create dynamic effects, respond
    to user interactions, and modify the appearance of elements on your web page.
    Keep in mind that manipulating styles with JavaScript can be powerful, but it''s
    important to maintain a separation of concerns and use CSS for defining the overall
    styling and JavaScript for dynamic changes.


