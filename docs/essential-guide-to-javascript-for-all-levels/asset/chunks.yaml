    # Prototypes and inheritance


    Prototypes and inheritance are fundamental concepts in JavaScript that allow objects
    to inherit properties and methods from other objects. Let''s explore prototypes
    and inheritance in JavaScript with examples:


    ## 1. Prototypes:


    In JavaScript, every object has a prototype, which acts as a blueprint for that
    object. The prototype contains properties and methods that are shared among all
    instances of an object.


    ![](image_rsrc2S3.jpg)


    In this example, `personPrototype` is an object that serves as the prototype for
    `person`. `person` inherits the `greet` method from its prototype.


    ## 2. Constructor Functions:


    Constructor functions are a way to create objects with shared properties and methods.
    They use the `this` keyword to refer to the current instance being created.


    ![](image_rsrc2S4.jpg)


    In this example, `Person` is a constructor function that creates instances of
    `Person` objects. The `greet` method is added to the `Person.prototype`, and each
    instance of `Person` inherits the `greet` method.


    ## 3. Inheritance:


    JavaScript uses prototype chaining to achieve inheritance. Objects can inherit
    properties and methods from their prototypes.


    ![](image_rsrc2S5.jpg)


    In this example, `Animal` is the superclass, and `Dog` is the subclass that inherits
    from `Animal`. The `Object.create()` method is used to establish the prototype
    chain, and `Animal.call(this, name)` is used to invoke the superclass constructor
    within the subclass.


    ## 4. Object.getPrototypeOf():


    The `Object.getPrototypeOf()` method allows you to retrieve the prototype of an
    object.


    ![](image_rsrc2S6.jpg)


    In this example, `Object.getPrototypeOf()` returns the prototype of the `person`
    object, which is `Object.prototype`.


    Prototypes and inheritance in JavaScript provide a mechanism for sharing properties
    and methods among objects, allowing for code reuse and creating hierarchical relationships
    between objects. By leveraging prototypes and inheritance, you can create more
    flexible and extensible code structures in your JavaScript applications.


    # Working with built-in objects


    Working with built-in objects in JavaScript, such as `Array`, `Math`, `Date`,
    and others, allows you to leverage their predefined properties and methods to
    perform common operations. Here''s an overview of working with some of the commonly
    used built-in objects:


    ## 1. Array:


    The `Array` object is used to store and manipulate collections of elements. It
    provides various methods for adding, removing, and modifying elements in an array.


    ![](image_rsrc2S7.jpg)


    ## 2. Math:


    The `Math` object provides a set of mathematical operations and constants. It
    offers methods for performing calculations, such as rounding, random number generation,
    trigonometric functions, and more.


    ![](image_rsrc2S8.jpg)


    ## 3. Date:


    The `Date` object is used to work with dates and times. It provides methods for
    retrieving and manipulating various components of a date, such as the year, month,
    day, hour, minute, second, etc.


    ![](image_rsrc2S9.jpg)


    ## 4. String:


    Although not an object in the strictest sense, the `String` object provides methods
    for working with strings, such as extracting substrings, converting case, replacing
    characters, and more.


    ![](image_rsrc2SA.jpg)


    These are just a few examples of working with built-in objects in JavaScript.
    JavaScript provides a rich set of built-in objects that offer a wide range of
    functionality for various programming tasks. By understanding and utilizing these
    built-in objects, you can perform common operations more efficiently and effectively
    in your JavaScript code.


