    *第6 章*


    **[99]**


    现在当我们查看代码时，可以看到一个名为 `AuthorName` 的简单函数，它持有 `author` 参数。该函数使用了在*第 2 章*《使用 JSLint
    提高代码性能》中讨论过的 `use strict` 语句，它强制开发者工具或其他类似的检查器将该作用范围内的任何警告视为错误。然后，我们使用 `return`
    关键字返回 `author` 参数。


    这看起来相当正常；然而，让许多 JavaScript 开发者感到困惑的是函数名的结构。注意 `AuthorName` 是大写字母 *A* 开头的。在 JavaScript
    中，当我们用大字母声明函数名时，我们实际上是在告诉 JavaScript 解释器我们在声明一个构造函数。构造函数本质上就是一个 JavaScript 函数，它的工作方式与其他任何函数都相同。我们甚至可以像截图所示，使用**开发者工具**通过一个简单的
