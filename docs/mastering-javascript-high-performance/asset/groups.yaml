    *Chapter 6*


    **[99]**


    Now, when we look at the code, what we can see is a simple function named AuthorName
    holding the author parameter. The function uses a use strict statement discussed
    in *Chapter 2*, *Increasing Code Performance with JSLint*, which forces Developer
    tools or other similar inspectors to treat any kind of warnings in that scope
    as errors. We then return the author parameter using the return keyword.


    This looks fairly normal; however something that trips up many JavaScript developers
    is how the function name is structured. Notice that AuthorName starts with a capital
    *A*. In JavaScript, when we declare a function name with a capital letter, we
    are actually telling the JavaScript interpreter that we are declaring a constructor.
    A constructor is simply a JavaScript function, and it works the same way as any
    other function. We can even print an author''s name to the console using a simple
    console.log function as shown in the following screenshot using **Developer tools**:


    ![](img/1005cbc7df81f2054919decd848f91da_117_0.png)


    If we run this in an about:blank Developer tools console or dummy HTML page with
    this code, we will see the console output as the name just as we would expect.
    The problem is that, in order to efficiently use constructors, we need to use
    them with the new keyword.


    Now you may ask how we can possibly know if any of our existing JavaScript code
    uses constructors. Imagine a very large code base with functions everywhere; how
    can we check this if even the Developer tools option doesn''t inform us that we
    need to use an instance using new rather than a static function call?


    *Constructors, Prototypes, and Arrays*


    **[100]**


    Luckily, there is a way. If we remember in *Chapter 2*, *Increasing Code Performance
    with JSLint*, JSLint can show us if we need to use a new keyword. I''ve added
    the preceding code sample and enabled the **console** and **browser** objects
    in JSLint. Check out the error presented by JSLint in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_118_0.png)


    As we can see from JSLint, on line 11 we''re given an error, Missing ''new'' as
    our only error, indicating that we have a constructor and we need to use it as
    such.


    *Chapter 6*


    **[101]**


    ## Understanding instances


    Now the easy way to fix this issue is to change the name of the AuthorName function
    to camel case; that is, we change A to lowercase (a). But here we''re going to
    indicate this as an instance, and you may ask why? Well in JavaScript, every time
    we write an object, a variable, a function, an array, and so on, we are creating
    objects.


    By using instances, we keep our object usage down. In JavaScript, an instance
    is only counted once in memory. For example, let''s say we use a document.getElementById()
    method. Every variable saved with that object is given a memory count of one but,
    if it''s in an object we declare with the new keyword, that count is only counted
    once rather than reused for every occurrence of getElementById().


    By using the new keyword, we create an instance of our constructor (in this case
    AuthorName) that allows us to reuse that function in the same manner that we typically
    use it.


    ### Creating instances with ''new''


    Creating a new instance is pretty easy; we can simply call a new instance to run
    a function, as shown in the following screenshot, using the new keyword in our
    console.log function on line number 11:


    ![](img/1005cbc7df81f2054919decd848f91da_119_0.png)


    If we run this code inside a blank page or a simple HTML page, we will see that
    our log doesn''t output the way we expect. But we can see an object return AuthorName
    {} in the **Console** panel of the **Development tools** in Chrome. What this
    shows us is that we are actually logging a new instance of an object, but not
    the author''s name.


    *Constructors, Prototypes, and Arrays*


    **[102]**


    In order to properly display this name, we will need a keyword to declare a reference
    to the instance of this constructor. To do that, we will use the this keyword;
    in JavaScript, this is a reference to the exact point in execution in a scope.


    The this keyword in JavaScript refers to the scope and variable that exists at
    that point of script execution when it is used. For example, when you use a this
    keyword in a function, it can reference a variable that is also in the same scope
    (or inside a function). By using a this keyword, we can point to variables and
    objects at a certain point in a code''s execution.


    A **scope** is simply a block of JavaScript code with its own variables and properties.
    Scopes can include a global-level scope of a single JavaScript object, meaning
    an entire JavaScript file, a function-level scope where variables and properties
    are set inside a function, or, as discussed earlier, a constructor since a constructor
    is a function.


    Let''s rewrite our AuthorName constructor with this keyword so that we can reference
    our scope and print our value to the **Console** panel. We will need to create
    an initializer inside our constructor in order to get our scoped variables returned.
    An initializer (sometimes called an init function) specifies certain variables
    inside our constructor and assigns properties on creation.


    Here, we create a variable with a this keyword prefixed to indicate that we are
    referencing our instance inside our constructor followed by our function called
    init, which equals a function, just as we would use a variable to declare a function.
    Let''s take a look at this in the code shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_120_0.png)


    *Chapter 6*


    **[103]**


    Take a look at line numbers 13 and 15; on 13 we declare a variable author1, with
    a new AuthorName constructor having Chad Adams as the string parameter. In this
    example author1 is an instance of the AuthorName constructor with Chad Adams as
    the only parameter.


    Also notice that, on line number 15 in our console.log, we have an init() function
    that is an inner function of our constructor. We can create other functions in
    our constructor as well, for instance printing a custom log message like this
    as shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_121_0.png)


    As we can see on line number 11, we have now added a helloInfo() function, scoped
    to our AuthorName constructor, that prints out a custom message using the author
    parameter. Then, on line number 20, we call this outside a console.log by simply
    calling the function of the constructor, which has its own console.info function
    wrapped inside.


    *Constructors, Prototypes, and Arrays*


    **[104]**


    This is helpful in keeping our logic confined to a single object inside our code
    base and keeps our code nicely organized. This is called object orientation; it''s
    great for reusing code but might cause issues with performance in JavaScript.
    Let''s try an example. Here, we have two examples of the same code, each wrapped
    in a console.time and console.timeEnd function. The following screenshot shows
    our reviewed code and the resulting time:


    ![](img/1005cbc7df81f2054919decd848f91da_122_0.png)


    So our total time here is roughly 2.5 milliseconds. This isn''t too bad, but now
    let''s see what happens if we use simple non-constructor functions and what the
    speed of rendering the same output would be. As shown in the updated screenshot,
    I''ve pulled apart our constructor and created two separate functions.


    *Chapter 6*


    **[105]**


    I''ve also called the main authorName function within the secondary function in
    the exact same manner as on our console.log function to print an author''s name.
    Let''s run the code shown in the next screenshot, and see if this runs faster
    or slower than our constructor methods. However, do keep in mind that, depending
    on our system''s speed and browser, the results may vary.


    ![](img/1005cbc7df81f2054919decd848f91da_123_0.png)


    So, with static functions our results hover right around 4 milliseconds, which
    is longer than our instance-built object. So, that''s a great use of static functions
    over prototype functions in JavaScript!

