    In the early days of the Web, we as web developers didn''t think about the DOM
    too


    much. If we think about how far JavaScript has come, we can see that many changes


    have come to the world of web development. If we reminisce about the pre-Google


    days of the web, we know that websites were pretty simplistic, and user interaction


    was mainly limited to hyperlink tags and an occasional JavaScript window.alert()


    function to show some form of application interaction.


    As time passed, we encountered Web 2.0, or rather the point where **Asynchronous**


    **JavaScript and XML** (**AJAX**) came into being. If you''re not familiar with
    AJAX, I


    would like to sum it up: AJAX web applications allow developers to pull content


    from external sources, typically XML files, (this is the X in AJAX).


    With AJAX, website content suddenly became dynamic, meaning developers didn''t


    have to rely on backend technologies to refresh a web page with updated data.


    Suddenly, a need for stronger JavaScript came into play. Businesses and their
    clients


    no longer wanted to have a website responding with page flashes (or sites that
    used


    backend technologies to update the page with a POST submission method), all the


    more so with sites such as Google Maps and Gmail seemingly pushing the idea of


    the web as a platform for software rather than a desktop operating system.


    **Don''t we need an MV-whatever library?**


    Today, we have frameworks that help with the heavy lifting of some of this type
    of


    application; AngularJS, Backbone.js, Knockout.js, and jQuery are a few libraries
    that


    come to mind.


    For this book, however, we will stick to vanilla JavaScript for two reasons. The
    first


    reason is that entire books are dedicated to many of these libraries and talk
    about


    performance and various levels of experience, all of which are good but beyond
    the


    scope of this book. The second reason is that most developers typically don''t
    need


    these libraries to build a project.


    Remember that all the JavaScript libraries mentioned here, as well as those found
    on


    the Web, are again all JavaScript! For most projects, we shouldn''t need a library
    to


    make a project the way we want to build it; moreover, many of these libraries
    come


    with extra code.'
