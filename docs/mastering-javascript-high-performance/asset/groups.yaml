    ## [149]

    # Optimizing JavaScript for iOS Hybrid Apps


    In this chapter, we are going to take a look at the process of optimizing JavaScript
    for iOS web apps (also known as hybrid apps). We will take a look at some common
    ways of debugging and optimizing JavaScript and page performance, both in a device''s
    web browser and a standalone app''s web view.


    Also, we''ll take a look at the Apple Web Inspector and see how to use it for
    iOS development. Finally, we will also gain a bit of understanding about building
    a hybrid app and learn the tools that help to better build JavaScript-focused
    apps for iOS. Moreover, we''ll learn about a class that might help us further
    in this.


    We are going to learn about the following topics in the chapter:


    - Getting ready for iOS development

    - iOS hybrid development


    ## Getting ready for iOS development


    Before starting this chapter with Xcode examples and using iOS Simulator in a
    JavaScript performance book, I will be displaying some native code and will use
    tools that haven''t been covered in this course. Mobile app developments, regardless
    of platform, are books within themselves. When covering the build of the iOS project,
    I will be briefly going over the process of setting up a project and writing *non-JavaScript*
    code to get our JavaScript files into a hybrid iOS WebView for development. This
    is essential due to the way iOS secures its HTML5-based apps. Apps on iOS that
    use HTML5 can be debugged, either from a server or from an app directly, as long
    as the app''s project is built and deployed in its debug setting on a host system
    (meaning the developers'' machine).


    *Optimizing JavaScript for iOS Hybrid Apps*


    ## [150]


    Readers of this book are not expected to know how to build a native app from the
    beginning to the end. And that''s completely acceptable, as you can copy-and-paste,
    and follow along as I go. But I will show you the code to get us to the point
    of testing JavaScript code, and the code used will be the smallest and the fastest
    possible to render your content.


    All of these code samples will be hosted as an Xcode project solution of some
    type on Packt Publishing''s website, but they will also be shown here if you want
    to follow along, without relying on code samples. Now with that said, let''s get
    started…


    ## iOS hybrid development


    Xcode is the IDE provided by Apple to develop apps for both iOS devices and desktop
    devices for Macintosh systems. As a JavaScript editor, it has pretty basic functions,
    but Xcode should be mainly used in addition to a project''s toolset for JavaScript
    developers. It provides basic code hinting for JavaScript, HTML, and CSS, but
    not more than that.


    To install Xcode, we will need to start the installation process from the Mac
    App Store. Apple, in recent years, has moved its IDE to the Mac App Store for
    faster updates to developers and subsequently app updates for iOS and Mac applications.
    Installation is easy; simply log in with your Apple ID in the Mac App Store and
    download Xcode; you can search for it at the top or, if you look in the right
    rail among popular free downloads, you can find a link to the Xcode Mac App Store
    page. Once you reach this, click **Install** as shown in the following screenshot:


    *Chapter 9*


    ## [151]


    ![](img/1005cbc7df81f2054919decd848f91da_169_0.png)


    *Optimizing JavaScript for iOS Hybrid Apps*


    ## [152]


    It''s important to know that, for the sake of simplicity in this chapter, we will
    not deploy an app to a device; so if you are curious about it, you will need to
    be actively enrolled in Apple''s Developer Program. The cost is 99 dollars a year,
    or 299 dollars for an enterprise license that allows deployment of an app outside
    the control of the iOS App Store.


    If you''re curious to learn more about deploying to a device, the code in this
    chapter will run on the device assuming that your certificates are set up on your
    end. For more information on this, check out Apple''s iOS Developer Center documentation
    online at https://developer.apple.com/library/ios/documentation/IDEs/Conceptual/AppDistributionGuide/Introduction/Introduction.html#//apple_ref/doc/uid/TP40012582.


    Once it''s installed, we can open up Xcode and look at the iOS Simulator; we can
    do this by clicking **Xcode**, followed by **Open Developer Tool**, and then clicking
    on **iOS Simulator**. Upon first opening iOS Simulator, we will see what appears
    to be a simulation of an iOS device, shown in the next screenshot. Note that this
    is a simulation, *not* a real iOS device (even if it feels pretty close).


    ![](img/1005cbc7df81f2054919decd848f91da_170_0.png)


    A neat trick for JavaScript developers working with local HTML files outside an
    app is that they can quickly drag-and-drop an HTML file. Due to this, the simulator
    will open the mobile version of Safari, the built-in browser for iPhone and iPads,
    and render the page as it would do on an iOS device; this is pretty helpful when
    testing pages before deploying them to a web server.


    *Chapter 9*


    ## [153]

    ## Setting up a simple iOS hybrid app


    JavaScript performance on a built-in hybrid application can be much slower than
    the same page run on the mobile version of Safari. To test this, we are going
    to build a very simple web browser using Apple''s new programming language **Swift**.
    Swift is an iOS-ready language that JavaScript developers should feel at home
    with.


    Swift itself follows a syntax similar to JavaScript but, unlike JavaScript, variables
    and objects can be given types allowing for stronger, more accurate coding. In
    that regard, Swift follows syntax similar to what can be seen in the *ECMAScript
    6* and *TypeScript* styles of coding practice. If you are checking these newer
    languages out, I encourage you to check out Swift as well.


    Now let''s create a simple web view, also known as a **UIWebView**, which is the
    class used to create a web view in an iOS app. First, let''s create a new iPhone
    project; we are using an iPhone to keep our app simple. Open Xcode and select
    the **Create new** **Xcode project** project; then, as shown in the following
    screenshot, select the **Single** **View Application** option and click the **Next**
    button.


    ![](img/1005cbc7df81f2054919decd848f91da_171_0.png)


    *Optimizing JavaScript for iOS Hybrid Apps*


    ## [154]


    On the next view of the wizard, set the product name as JS_Performance, the language
    to **Swift**, and the device to **iPhone**; the organization name should autofill
    with your name based on your account name in the OS. The organization identifier
    is a reverse domain name unique identifier for our app; this can be whatever you
    deem appropriate. For instructional purposes, here''s my setup:


    ![](img/1005cbc7df81f2054919decd848f91da_172_0.png)


    Once your project names are set, click the **Next** button and save to a folder
    of your choice with **Git repository** left unchecked. When that''s done, select
    **Main.storyboard** under your **Project Navigator**, which is found in the left
    panel. We should be in the storyboard view now. Let''s open the **Object Library**,
    which can be found in the lower-right panel in the subtab with an icon of a square
    inside a circle.


    *Chapter 9*


    ## [155]


    Search for Web View in the **Object Library** in the bottom-right search bar,
    and then drag that to the square view that represents our iOS view.


    ![](img/1005cbc7df81f2054919decd848f91da_173_0.png)


    We need to consider two more things before we link up an HTML page using Swift;
    we need to set constraints as native iOS objects will be stretched to fit various
    iOS device windows. To fill the space, you can add the constraints by selecting
    the **UIWebView** object and pressing *Command* + *Option* + *Shift* + *= on your
    Mac keyboard. Now you should see a blue border appear briefly around your UIWebView.

