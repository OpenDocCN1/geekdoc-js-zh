    *Chapter 2*


    **[33]**


    Now let''s re-run our finalized code thru JSLint and we should see a screen like
    this:


    ![](img/1005cbc7df81f2054919decd848f91da_51_0.png)


    We can see that we now have no errors in JSLint, and we can also see a **Function
    Report** panel, indicating a variable scope as a note of what variables are global
    to the file and what variables and functions exist inside a function, including
    our anonymous function example.


    Before we wrap up this chapter, let''s try the console.time method on both our
    2_03_01.js and 02_03_03.js code files with the console.time function wrapped around.
    The time I get on my end for the former is 0.441ms, and the optimized code with
    JSLint is 0.211ms! Not bad; *double* the performance!


    *Increasing Code Performance with JSLint*


    **[34]**


    **Summary**


    In this chapter, we learned the basics of the console.time and console.timeEnd
    methods, and we also learned about JSLint and how it can improve our JavaScript
    performance. In the next chapter, we will take a quick look at JSLint and get
    our hands dirty by integrating it into a build system!


    **[35]**


    ## Understanding JavaScript Build Systems


    In this chapter, we will learn about JavaScript build systems and their advantages
    for JavaScript performance testing and deployment. We will also incorporate JavaScript
    code testing into our build system using the knowledge we gained about JSLint
    in the last chapter.


    In short, we are going to cover the following topics in this chapter:


    - What is a build system?

    - Setting up our build system

    - Creating a distribution


    ### What is a build system?


    Typically, a **build system** is an automated process that assists developers
    dewriting clean optimized code. We may think that such a thing would be standard
    across all programming languages. Now, compiled languages usually have a compiler;
    a **compiler** takes a program written by following a language specification,
    and creates output code compatible with the target machine.


    *Understanding JavaScript Build Systems*


    **[36]**


    ### Compiling code by example


    Compilers typically work through a spec when a code file is sent for processing.
    To keep a compiler from crashing from bad code, a compiler is set up with many
    error checkers that stop the compiler beforehand and display an alert, thus blocking
    the compiling process. Now some IDEs allow you to see some of your mistakes before
    attempting to run your code. The following screenshot shows a simple Xcode Swift
    file being checked while editing:


    ![](img/1005cbc7df81f2054919decd848f91da_54_0.png)


    Without getting too technical in iOS development, we can see that, on assigning
    a constant variable in Swift, if I attempt to change the variable as in the preceding
    screenshot, my code flags an error.


    Now if I change the let authors_name constant to a dynamic var variable (just
    like in JavaScript), the error itself corrects, as shown in the following screenshot,
    and removes the error displayed in the IDE:


    *Chapter 3*


    **[37]**


    ![](img/1005cbc7df81f2054919decd848f91da_55_0.png)


    ### Error-checking in a JavaScript build system


    In the past, HTML editors for JavaScript and HTML content, such as Dreamweaver,
    have done this since the creation of early web code editors.


    The difference between what''s done in Xcode for a compiled language and what''s
    done in a JavaScript IDE is slightly different. With a compiled language, an error
    must be fixed before a code file can run; this is usually considered as static
    type checking. JavaScript, however, can run with an error, even when overridden
    with a try-catch block. Simply put, as stated in *Chapter 2*, *Increasing Code
    Performance with JSLint*, JavaScript is an interpreted language, and the *only*
    language that is really tested for errors at run time.


    With that in mind, how do editors such as Dreamweaver, WebStorm, or Visual Studio
    check for errors then? Well, if you remember in *Chapter 2*, *Increasing Code
    Performance with JSLint*, we saw how linting tools provide feedback on potential
    or verifiable bugs in JavaScript code; this returns a list of errors.


    With an IDE, the editor is coded keeping this in mind and takes each error to
    display it with the associated line and column in the JavaScript file.


    *Understanding JavaScript Build Systems*


    **[38]**


    So, to make a build system, we will need to incorporate this sort of error checking
    just like using http://jslint.com/ but in a more automated fashion. This allows
    lightweight editors to use the same checking tools that are used in more expensive
    and heavier IDEs.


    ### Adding optimization beyond coding standards


    Like our Xcode example earlier in the chapter, we want our final output to be
    optimized for our project; to do this, we will add minification to our build system,
    allowing us to keep a developer version or source project to be saved in a directory
    with a distribution in another directory. Simply put, minification allows us to
    compress our JavaScript code causing our web applications to download faster,
    and run more efficiently.


    This can be helpful if we are using source control to maintain our project, allowing
    us to quickly grab a stable distribution that''s optimized, but not easily debuggable,
    and debug it with our source directory''s files.


    Now as JavaScript developers, we can even add other minification build options
    that we may need for the project, such as an image optimizer for our project''s
    image directory, or minify our CSS file and add information comment blocks on
    top of our JavaScript files. By compressing our JavaScript, the JavaScript interpreter
    doesn''t have to guess the distance in whitespace in our code, which creates more
    efficient and better-performing code.


    ### Creating a build system from scratch using Gulp.js


    Now that we''ve introduced build systems and the reason for their use, let''s
    go ahead and create a simple build system. Our goal is to create a distribution
    build from our source directory, a copy that''s optimized and ready for production.
    We will also integrate JSLint, as we learned from the last chapter, to check our
    code for any issues that might have been missed.


    *Chapter 3*


    **[39]**


    In this chapter, we are going create a build system to test our JavaScript project.
    We will also incorporate minification into our build system, and copy files to
    our build directory. So when we are ready to deploy, our code base is already
    set to be deployed.


    Before setting off on this project, we will need to understand a few technologies
    specific to JavaScript, particularly the build system that we will want to take
    into account; we will especially deal with technologies such as Node.js, NPM,
    Grunt, and Gulp. If you have only heard about these before, or maybe have tinkered
    with some of these and never got further than that, don''t worry; we will go over
    each of these one-by-one and understand their advantages and disadvantages.


    ### Node.js


    **Node.js** is a JavaScript interpreter for your operating system. For JavaScript
    developers, the concept of JavaScript code working as a backend code base like
    Java or C# may seem odd, but has been shown to work in new creative ways. For
    example, the community of Node.js developers has created plugins to create custom-built,
    JavaScript-based applications for the desktop.


    This puts JavaScript in a very new place. When traditional application developers
    complain about JavaScript, one of the main complaints is that JavaScript cannot
    read or write files to a hard drive, which is usually a very basic feature for
    a programming language. Node.js allows custom objects to interact with the operating
    system. These include objects such as FS or FileSystem that allow for reading
    and writing files and work pretty much like a console in a web browser.

    '
