    **[178]**


    在这里，我们可以看到测试是如何编写的；在第 2 行，我们使用了 `describe` 关键字，如果我们有一个更大的测试文件，它可以将我们的测试封装在单个容器中。


    我们从文档规范中的所有测试都可以通过每个 `it` 关键字找到；第 1 个测试位于第 4 行，在第 5 行，我们有了第一个测试的 `expect` 关键字，用于检查
    `newCustomers.CustomerID` 的类型，我们期望它是一个数字。


    注意，所比较的类型使用的是字符串而不是数字，正如你在控制台中可能预期的那样。这是因为 `typeof`（用于返回变量或属性类型的 JavaScript 关键字）返回的是字符串形式的类型名称；因此，为了匹配，我们在这里也使用了带有类型的字符串。


    我们从随后的行中看到，我们使用相同的比较方式为其他测试添加了剩余的测试。完成后，让我们打开 `SpecRunner.html` 页面；我们可以在下面截图的
    **Spec List**（规格列表）视图中查看测试执行情况：


    ![](img/1005cbc7df81f2054919decd848f91da_196_0.png)


    糟糕！这里有三个错误，这一点也不好。在这里，我们预期会有一个错误，即客户名称没有正常显示。但，我们的单元测试发现我们的应用程序规范没有按照编写的方式执行。在
    Jasmine 框架中，这种页面布局非常常见；在初始加载时，你会看到完整的错误列表。如果你想查看所有通过和失败的测试列表，可以点击顶部的 **Spec List**，我们就能像前面的截图所示看到完整列表。


    *第 10 章*


    **[179]**


    在这里失败的测试会在浏览器中显示为红色，而通过的测试显示为绿色。你可能会在 **Failures**（失败）视图和 **Spec List** 视图中看到绿色圆圈和红色
    X，表示有多少测试通过和失败了。


    ## 修复我们的代码


    现在我们的测试代码可以运行了，我们可以修改它以确保其正常工作。为此，我们需要更新 `10_01.js` 文件和 `newCustomer` 数据，它位于 `10_01.js`
    文件的第 56 到 63 行。让我们回顾一下我们的示例客户数据哪里出了问题：


    - 第一个失败的测试是第 2 个，它要求客户姓名被创建一个对象数组，其中名字作为数组的第一个项，姓氏作为对象数组的第二个项。

    - 第二个失败的是第 3 个测试，它要求 `customerBalance` 类型为数字。

    - 第三个错误是第 6 个测试，它要求客户的婚姻状态为布尔值而不是字符串。


    让我们更新 `newCustomer` 数据；你可以在下面的截图看到我已完成了操作：


