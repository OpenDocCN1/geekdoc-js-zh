    \n*Detecting Performance*\n\n**[80]**\n\nGetting Suggestions for JavaScript quality\n\
    \nIf we're only checking for JavaScript performance, uncheck the **Network Utilization**\n\
    \noption and run the test as well; we need to keep this in mind if we're testing\
    \ for a\n\nspecific point in our application. We will need to switch the radio\
    \ button to **Audit**\n\nPresent State, and click **Run** to get suggestions for\
    \ the current state of the web\n\napplication. Let's run the test on https://www.packtpub.com/,\
    \ and then select the\n\nfile under **Results**. Let's take a look at the performance\
    \ improvement suggestions as\n\nshown in the following screenshot:\n\n![](img/1005cbc7df81f2054919decd848f91da_98_0.png)\n\
    \n*Chapter 4*\n\n**[81]**\n\n**The Console panel**\n\nThe **Console** panel is\
    \ the last type of events and typically is used in updating the\n\nUI. Unlike\
    \ **Rendering** event, the **Painting** event occurs when the browser redraws\n\
    \nan image on the screen. For desktop JavaScript development, **Painting** events\
    \ aren't\n\nusually a concern, but become strongly concerning when we start looking\
    \ at mobile\n\nweb browsers.\n\nTypically the **Painting** event is forced when\
    \ an element's display is updated from its\n\noriginal. They can also be triggered\
    \ by updates to an element, such as an element's\n\ntop or left positioning.\n\
    \n**The Profile panel**\n\nThe **Profile** panel helps a developer analyze a web\
    \ page's CPU profile and take heap\n\nsnapshots of the JavaScript used. A CPU\
    \ profile snapshot is helpful when it comes\n\nto checking large complex applications\
    \ to see what files may cause issues in terms of\n\nobject size.\n\nA JavaScript\
    \ heap snapshot is a compiled list of objects found in the page's overall\n\n\
    JavaScript. This includes not only the code written by us, but also the code built\
    \ into\n\nthe browser, such as the document or console objects, giving an overall\
    \ list of all\n\npossible objects in an application.\n\nUsing the **Profile**\
    \ panel is similar to the **Timeline** panel; select either the **Take**\n\nHeap\
    \ Snapshot or the **Collect JavaScript CPU Profile** option, and then click **Start**,\n\
    \nfollowed by reloading the page. In the following screenshot, I have selected\
    \ the\n\n**Collect JavaScript CPU Profile** option:\n\n![](img/1005cbc7df81f2054919decd848f91da_95_0.png)\n\
