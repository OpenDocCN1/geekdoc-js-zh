- md: '

    *Chapter 1*


    [ 7 ]


    ![](img/1005cbc7df81f2054919decd848f91da_25_0.png)


    Typically, IDEA is known best as a Java-focused IDE, but it includes the same
    tools as WebStorm plus many more. Like Visual Studio, it can handle multiple languages,
    but that comes at the cost of performance. For example, if we started working
    in both environments on a slower system, we might notice more lag on IDEA than
    WebStorm when working day-to-day on JavaScript projects.


    Again, this is due to the large number of features the IDEs require to be running
    in the background to make our code better, which is more marked on IDEA; so, again,
    starting off in an IDE is great to build a well-structured code base early on,
    but as time progresses and we work repeatedly in a slow editor, we will need something
    faster with a good base already set up.


    With that in mind, many developers who don''t see performance issues with an IDE
    tend to stick with the IDE they''ve chosen; other developers, however, move on
    to editors such as the ones in the next section.


    *The Need for Speed*


    [ 8 ]


    ## Mid-range editors


    Mid-range editors work very well with projects already past the early phases of
    development or projects that are very small. An exception to using an IDE early
    on is small projects. These are typically content-management system-based sites,
    such as WordPress, Joomla, Drupal, and so on, where most of the JavaScript is
    written for the developer and tested already.


    They are also useful for light code hinting, and some can connect to either a
    source repository or an FTP to push code up. The real differences between these
    and an IDE are the speed of the editor and the lack of code quality features.
    Many of these editors only look for glaringly obvious errors in the code, such
    as missing a semicolon in JavaScript. Nevertheless, they are very useful all-round
    editors.


    ### Panic''s Coda editor


    Coda is a Mac-only editor, but it supports HTML, CSS, and JavaScript coding. The
    following screenshot shows you the user interface of Coda:


    ![](img/1005cbc7df81f2054919decd848f91da_26_0.png)


    It also has some support for Python and PHP, but it''s not dedicated to running
    non-web code on its own. It also features a manual validation checker of JavaScript
    rather than one that''s continuous so, again, there''s some support to improve
    your JavaScript and web code, but it does not always check for errors fully while
    you code.


    ### The Microsoft WebMatrix editor


    WebMatrix is Microsoft''s lighter website editor in this mid-range category. It
    has Git and Team Foundation Server support as well as support for ASP.NET projects,
    PHP, and NodeJS. The user interface of WebMatrix can be seen in the following
    screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_27_0.png)


    WebMatrix is an example of a mid-range editor where you may want to consider an
    editor''s features when choosing which editor you want to use for your project.


    [ 10 ]


    For example, if you needed Mac support with Python, then Coda is a good fit, while
    WebMatrix gives a different set of features, including ASP.NET support. This is
    a common theme in mid-range editors, where many of them are really designed to
    do certain things and give just about the minimum support for a code base while
    keeping the editor as speedy as possible.


    With any editors of this type, we can see that they allow us to connect to an
    existing project easily and perform some code-checking while working on a fairly
    fast editor.


    ## Lightweight editors


    There are times where we as JavaScript developers *just don''t care* about the
    backend platform a project is using and only need a simple text editor to write
    a bit of JavaScript code or update an HTML file. This is where lightweight editors
    come in.


    ### The Sublime Text editor


    Sublime Text is a very popular, cross-platform, lightweight editor. Its user interface
    can be seen in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_28_0.png)


    It is well known for its start-up and usage speeds as well as some basic editing
    features, such as language color hinting and basic code-hinting with multiple
    language support.


    It also has its own package manager called **Package Control**, which allows you
    to augment Sublime Text to automate some common code-editing and compiling processes.
    Freshly downloaded, though, it''s extremely lightweight and allows developers
    to add in common plugins required for their development workflow.


    ### The Notepad++ editor


    The user interface of the Notepad++ editor is shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_29_0.png)


    On Windows, a JavaScript editor that is exclusive to the Windows platform and
    that''s actually an editor and not an IDE is Notepad++. Similar to Sublime Text,
    Notepad++ is mostly used as a text editor and has plugin support but doesn''t
    use a package manager such as Sublime Text, so the application runs extremely
    fast even with plugin support. It also has code-hinting support for some project
    files, including JavaScript.


    In the case of either of these editors, or any other lightweight editor, as they
    typically don''t have code validation included, they make code updates easily
    and quickly with validation running in the background, at the risk of writing
    slow or broken code.


    ## Cloud-based editors


    Lastly, cloud- or web-based editors are the shiny new tools new to the web developer''s
    tool belt. They allow a developer to work on a code base inside a browser either
    as a plugin to a web browser or purely online, and it allows a developer to work
    on any OS platform, Chrome OS, iPad, or Android operating systems that you might
    not consider writing JavaScript in!


    The advantage of writing code in a browser is that the project code is hosted
    online, either in Git or simply in the editor''s hosted service. Some plugin editors
    allow you to work from your computer''s hard drive like any other editor but are
    written in HTML and JavaScript with a backend (such as Python, PHP, or ASP.NET)
    like any other website.


    Typically, these editors fit inside the mid-range editor space in terms of features.
    However, some of them can offer very little in terms of features beyond being
    online without installing an editor to a computer, which is why they fall in this
    category. The upcoming sections give a few examples of popular cloud editors.


    ### The Cloud9 editor


    Cloud9 editor, available at http://c9.io/, is a general web application IDE but
    is a cloud app with HTML5, PHP, Node.js, Rails, Python/Django, and WordPress support.
    The following screenshot displays the user interface of the Cloud9 editor:


    ![](img/1005cbc7df81f2054919decd848f91da_31_0.png)


    It also allows you to clone from a Git URL or from a GitHub project, so you can
    choose to have your code hosted in Cloud9 or synced to your own Git repository.
    Another feature of Cloud9 is virtual-machine support from the browser for iOS
    simulator testing as well as console support for Node.js — again, in a browser.


    [ 14 ]


    ### The Codenvy editor


    Another online IDE—Codenvy—is available at http://codenvy.com/. Its user interface
    can be seen in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_32_0.png)


    This editor is pretty similar to Cloud9, but it hosts cloud service projects,
    such as Google''s App Engine. It can also build apps for Android while having
    full JavaScript support for popular libraries in AngularJS or jQuery.


    An issue with cloud editors is that, when JavaScript libraries are involved in
    a project, an online editor may not be able to recognize library-specific JavaScript
    or HTML tag conventions used, so it''s important to consider features when selecting
    a cloud editor.


    For cloud editors, you can see that they follow a mid-range editor feature-set
    but allow for quick connection and updates for existing projects.

    '
