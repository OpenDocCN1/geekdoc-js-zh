    **Writing tests using Jasmine**


    In Jasmine, there are three keywords specific to the testing framework that we
    need


    to know. The first is describe; describe is like a class in testing. It groups
    our tests


    in one container to be referenced later. In the previous list from our application
    spec,


    we can use New Customer data test as our describe value.


    The second keyword is it; it is a Jasmine function that takes two parameters,
    a


    string that we use as our test description. For example, one it test could contain


    a description such as Customer''s ID should be a number. This tells the user


    reviewing the test what exactly we are testing for. The other parameter is a function


    where we can inject code or set up code if needed. Remember that all of this is
    being


    run in the same page, so if we would like to change any variables, or prototypes
    for


    a test, we can do that within this function before we run our test. Keep in mind
    that,


    while writing the test, we don''t need to modify our code in order to test properly;


    this is done only in case we don''t have a code sample for review.


    The last keyword to remember is expect; expect is a function specific to Jasmine


    that takes a value and compares it with some other value. In Jasmine, this is
    done


    using the toEqual function that is a part of the expect function. Think of each


    test as readable like this: We expect the typeof newCustomer.customerID to


    equal a number. Now this is pretty simple if we think about it, but what does
    that


    look like in a spec file? Well, if we look at the following screenshot, we can
    see our


    Chapter_10_01Spec.js file with each of the tests written ready for Jasmine:


