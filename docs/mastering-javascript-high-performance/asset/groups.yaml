    ## Chapter 4

    ## 67

    ### The Network panel


    The **Network** panel displays page download speeds of all the resources and the
    code


    it contains. Let''s test this out by going to http://www.packtpub.com/ and opening


    the **Network** panel (located right next to **Elements**). Click the record button
    on the


    top left of the panels as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_85_0.png)


    Now, let''s refresh the page with the record button on. We can see which page


    resources are taking longer to load in our web page. This is important when


    considering loading resources in JavaScript. If we target an element or a script


    that doesn''t yet exist in our DOM, an error could occur.


    ### Detecting Performance


    ## 68


    If we take a look at the following screen, we can see that the blog-banner.png


    graphic is taking the longest time to load on http://www.packtpub.com/.


    ![](img/1005cbc7df81f2054919decd848f91da_86_0.png)


    We can also select a resource as well; let''s click on one of the image resources.
    (I''ll


    choose blog-banner.png, this may or may not exist on your page. If you are testing


    on first load, give the site a few moments to load). When we select it, we can
    see a


    new sub-panel appear showing a preview of the image if it''s a graphic or the
    source


    code if it''s a JavaScript or JSON file.


    ## 69


    We also have tabs in the subpanel, one of which is called **Response**. This gives


    information to POST event resources found by DevTools. We also have a tab called


    **Headers**. The **Headers** tab displays request information for that file, including
    (more


    importantly) whether the image uses any server-side caching. In this case, our
    blog-


    banner.png file has a Cache-control: max-age value indicating a maximum cache


    age of 3153600000 seconds or ten years. We can also see the full Request URL noting


    that it''s using a cloudfront.net URL, so we can infer that the image is using
    Amazon


    S3 for caching and distribution, as shown for both in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_87_0.png)


    ## 70

    ### The Sources panel


    Here we are going to learn about the **Sources** panel, with the help of the following


    aspects:


    Debuggerger basic usage


    The **Sources** panel is home to most JavaScript developers; it''s where we debug
    our


    JavaScript applications. Using it is pretty simple; click the pause button up
    on the


    top left section right near the **Watch Expressions** option, as shown in the
    following


    screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_88_0.png)


    #### Testing the debugger


    Let''s try out the debugger. Open the 01 folder inside the Chapter_4 folder, in
    our


    Exercise_Files folder in the code bundle provided by Packt Publishing''s website.


    Inside it, we can see a very simple code sample, and we also have an HTML5 index.


    html page, which looks like the following screenshot in our source view:


    ![](img/1005cbc7df81f2054919decd848f91da_89_0.png)


    We can see that we have a very empty web page with some styling added for the


    body tag; we''ve also added a main.js external JavaScript file handling all of
    our


    page logic. What we are going to do here is inspect a function with a while


    loop inside.


    The loop will append the document.body tag with the paragraphTag variable,


    each with an index variable called as a global variable named my_integer outside


    the while loop, which is contained in a loopingTo5k() function. This is called
    on


    line 14, where it is being triggered by a window.onload event, as shown in the
    next


    screenshot displaying the main.js source view:


    ![](img/1005cbc7df81f2054919decd848f91da_89_1.png)


    ## 72


    With our source code in place, let''s go ahead and run our page in Chrome with
    our


    **Sources** panel open. If we look at the screen, we can see a set of numbers
    moving


    down the page in a sequential order ending at **5000** on the last line of the
    document.


    Let''s select the main.js file in our **Sources** panel, add a breakpoint to line
    8 of our


    source code, and see what the **Sources** panel can do. Now with our breakpoint
    set,


    let''s refresh the page. When we do this, we can see the page graying out with
    a note


    in yellow at the top indicating that we are paused in our debugger, and line #8
    in our


    main.js file is highlighted in blue, noting where the debugger paused.


    We can also see the **Scope Variables** option, which shows all the properties
    and


    objects of a given scope at the time of execution; in this case, the scope is
    inside the


    loopingTo5k() function. To get more information, we can refer to the right section


    of the **Sources** panel and look at the Local tree for information, or we can
    mouse


    over the objects in our code file for more information. As shown in the following


    screenshot, I''ve highlighted the document.body object in my function''s scope,


    creating a new paragraph object in JavaScript.


    ![](img/1005cbc7df81f2054919decd848f91da_90_0.png)


    ## 73


    When we''re finished with debugging, we can press the play button highlighted
    blue


    in the **Sources** panel, or we can **Step Over** our function via the control
    next to the


    play button and move on to our next function. Keep in mind that, if we have any


    further breakpoints, they will break further down the source file in our web page.
    To


    remove breakpoints, we can drag them off our line number column and press play
    to


    resume without debugging.


    ### Using the debugger keyword


    A little known feature in JavaScript programming is the **debugger** keyword;
    it''s a


    very simple helper function. When running code, it will trigger the **Sources**
    panel or


    another JavaScript debugger connected to break automatically; this is helpful
    when


    going over large code bases or having trouble breaking on a certain line.


    Let''s say that, in our example code thus far, we had a while loop, causing an
    issue


    with our code at the 555 iteration of my_integer. If we had to step through this,


    it would take 555 presses of the play button to get there. However, there is a
    way


    around this.


    To demonstrate this, I''ve set up a copy of these source files and saved them
    in the 02


    folder in the code bundle provided to you through Packt Publishing''s website
    under


    the Chapter_03 folder in the Exercise_Files folder. I''ve only made one change
    here


    in the code: adding a conditional if statement on lines 12 through 14, ensuring
    my-


    integer is equal to 555. If that is applied, I would call the debugger by simply
    writing


    debugger with a semicolon to end the line, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_91_0.png)


    ## 74


    Now calling debugger is easy. Let''s load our index.html file again with our


    debugger code, and here we can see that, without setting a breakpoint, our **Sources**


    panel automatically detects the line and sets the breakpoint without iterating


    through each loop (as shown in the following screenshot):


    ![](img/1005cbc7df81f2054919decd848f91da_92_0.png)


    ## 75

    ### The Timeline panel


    Here, we are going to learn about the **Timeline** panel, with the help of the
    following


    aspects:


    Using the Timeline panel


    The **Timeline** panel allows us to detect the overall web page performance with


    respect to JavaScript; it also allows us to inspect browser rendering events.
    To use


    the **Timeline** panel, all we need to do is click the record button and reload
    the page


    in Chrome.


    In the **Timeline** inspector, there are four types of events that the **Timeline**
    panel


    shows. These are **Loading**, **Scripting**, **Rendering**, and **Painting** events.
    I''ve loaded


    the example file (02), discussed in an earlier section, showing the events running


    through the **Timeline** panel, as seen in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_93_0.png)


    #### The Loading event


    The **Loading** event handles requests and responses; typically these are loading


    external scripts and files as well as POST requests for data leaving the page.
    Loading


    events also include the initial parsing of HTML code. In Google Chrome''s **Timeline**,


    these show up in blue.

