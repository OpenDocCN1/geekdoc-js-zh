    ## Operators, Loops, and Timers


    [84]


    ### Operators


    In this section, we are going to learn efficient ways to create for loops using
    the comparison operator.


    ### The comparison operator


    The comparison operator, `==`, is an operator that''s common in JavaScript development
    (typically in if statements); it equates one object with another and returns a
    boolean, (true or false) value. It''s pretty straightforward and is very common
    in C-based languages.


    Because of this, it''s easy to take advantage of this operator and use it across
    a large code base. The reality of this is that the equals operator is slow compared
    to using the `===` strict comparison operator, which also compares object types
    as well as the object''s value. As the JavaScript interpreter doesn''t have to
    confirm the type before checking the equality, it operates faster than using the
    double equals operator.


    ### Is strict faster?


    Let''s test this using the console.time method. In the following screenshot we
    have a 05_01.js code sample; we can also see this sample in the example files
    of this book, provided on the Packt Publishing''s website:


    ![](img/1005cbc7df81f2054919decd848f91da_102_0.png)


    [85]


    Here, we have three variables on lines 5, 6, and 7; two of these variables are
    floats referencing the pi value, and the last variable is a string with the same
    pi value. We then have an anonymous function with a test variable on line number
    12, which equates both our floats with a double equals operator. Wrapped around
    the function, we have console.time and console.timeEnd functions on lines 9 and
    14, respectively.


    Let''s run this in the Chrome browser; open up Chrome followed by **Developer
    tools** from the **More tools** option on an about:blank tab, and then open the
    **Snippets** tab in the right-hand side column under the **Sources** panel. The
    **Snippets** tab is like a scratchboard built to test JavaScript code; right-click
    in the tab content area, and select **New**. Save your snippet with a name and
    copy the code from the example, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_103_0.png)


    Next, right-click on the code snippet in the left-hand side rail and click on
    **Run**. You''ll notice the console appear at the bottom of the **Developer tools**
    window. We can also see a Check PI: 0.016ms console message. This shows us that
    running the comparison operator on this simple evaluation takes 0.016 ms to complete.
    What if we changed the comparison operator to a strict comparison operator to
    see what the result would be?


    [86]


    On changing the operator, we can see that our second console.time message is Check
    PI: 0.007ms. This is a simple example, sure, but it proves that the code runs
    faster using strict type checking with strict comparison operators.


    ![](img/1005cbc7df81f2054919decd848f91da_104_0.png)


    ### Loops


    In this section, we are going to learn efficient ways to create for loops in detail.


    ### How loops affect performance


    Loops are a very common way to iterate through large blobs of data or objects
    and iterating through each instance of a DOM object or a piece of data. Let''s
    say we have a simple loop that generates a `<p>` paragraph tag and appends the
    page with an inner text value of the `i` integer in the loop, with a maximum limit
    of 9000. Let''s take a look at the following code sample and see how this is done.
    I''ve created a simple HTML5 page with a script tag that includes the code on
    line 10, as shown next:


    ![](img/1005cbc7df81f2054919decd848f91da_105_0.png)


    So, how is this code process-intensive? For starters, if we look at line number
    17, we can see a variable called `ptag` that was created to create a blank paragraph
    tag in our DOM. We then apply the integer''s current value in the loop to the
    `innerText` property of the `ptag`; and lastly, we apply the newly created paragraph
    tag into the DOM with the value we specified at that point in the loop. For performance
    testing, we also wrapped the for loop in a console.time wrapper to check the speed.
    If we run this in Chrome, we should get a page with a line created in the for
    loop along with a console.time method with a process label, as shown in the following:


    ![](img/1005cbc7df81f2054919decd848f91da_105_1.png)


    [88]


    Looking at our process label, we can see that processing this block of code takes
    about 18 milliseconds. This is not great, but we can make it better; let''s update
    our code and move the `ptag` variable and our `i` variable outside the for loop
    so they don''t get recreated with each iteration of the for loop. Let''s see what
    this looks like by updating our code, in the following:


    ![](img/1005cbc7df81f2054919decd848f91da_106_0.png)


    Notice that, on line number 16, we''ve moved the `i` and `ptag` variables outside
    the loop, and we are reassigning values in the loop rather than creating a unique
    scope for each loop pass. If we rerun our page, we should see the same tag updated
    with a slightly smaller performance than before; in the following case, it should
    run in 15–17 milliseconds:


    ![](img/1005cbc7df81f2054919decd848f91da_107_0.png)


    ### The reverse loop myth


    A new idea that seems to have appeared in JavaScript circles is the concept of
    a reverse for loop. A reverse for loop is written just like a loop, but the loop
    counts backward rather than forward. The idea behind a reverse loop is that, by
    counting backward, some JavaScript interpreters run loops faster. Let''s test
    this and see whether this actually improves the speed of a for loop. First, let''s
    create a for loop counting forward from 9000; we won''t include any logic in the
    for loop, with the exception of adding an external variable called `result`.


    [90]


    Using our `result` variable with an increment, we can determine whether we are
    counting as we should and triggering a line of code at the end of 9000 in both
    a reverse loop and a standard for loop. In our case, a console.timeEnd function,
    as shown in the following code, is in its own HTML page, with a script tag at
    the bottom.


    ![](img/1005cbc7df81f2054919decd848f91da_108_0.png)


    Let''s take a look at the code sample. On line 13, we can see that we declare
    our `result` variable before starting our for loop while, on line number 14, we
    start the console.time wrapper method that has a label called Time Up. On line
    15, we start our for loop and increment `result` on line 16. Finally, on line
    18, we have a condition where we ask whether the `result` is equal to 9000, and
    we execute our `timeEnd` function on line 19.


    If we load the page with our for loop script inside the body tag, our console
    in **Developer tools** should output the following information:


    ![](img/1005cbc7df81f2054919decd848f91da_109_0.png)


    So, our console.time object tells us that our standard for loop with a maximum
    value of 9000 takes roughly 0.15 milliseconds to process in Google Chrome. Having
    nothing else included on the HTML page, which isn''t hosted on a server, ensures
    that network lag isn''t a factor. This is a good baseline with which we can compare
    a reverse loop. Now, let''s test a reverse for loop; here, we''ve created an updated
    version of the for loop, including our `result` variable. This is similar to the
    previous process, but let''s take a look at the code sample in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_109_1.png)


    [92]


    If we look at line number 15 in this code sample, we can see that we''ve altered
    this line a bit so that the loop counts backward rather than forward. We start
    by setting the decrement variable, `i` in this case, with a value of 9000, and
    then we test whether `i` is greater than 0. If it is, we decrease the `i` value
    by one. On line 17, we still increment our `result` variable as we did previously.
    This way, rather than using the for loop''s decrement variable `i`, the result
    variable exists as our count outside the loop, counting up. This is called by
    the *reverse* loop. When the `result` equals 9000 on line 18, then on line 19
    the `timeEnd` function is executed.


    Let''s test this in the **Developer tools** option in our Chrome browser and see
    what value we get, as shown here:

