    关于作者


    **Chad R. Adams** 是一位移动前端架构师，目前在 Intouch Solutions 工作，探索构建 HTML5 驱动的内容以及原生 iOS、Android
    / Windows Runtime 应用的创意方法。他与妻子 Heather 和儿子 Leo 住在密苏里州的 Raymore。


    过去，Chad 曾担任大型网站的 Web 开发人员，例如 MSN.com、Ford.ca、Xbox.com、WindowsPhone.com 和 Copia.com。他还经常在堪萨斯市地区的开发者会议和小组中就
    HTML5 和移动开发进行主题演讲，并是 *Learning Python Data Visualization*（Packt Publishing 出）的作者。


    你可以通过 LinkedIn（http://www.linkedin.com/in/chadradams）、Twitter (@chadradams）或他的个人网站（http://chadradams.com）联系
    Chad。


    关于审稿员


    **Yaroslav Bigus** 是构建跨平台 Web 和移动应用程序的专家。他拥有超过 5 年的开发经验，曾在利兹和纽约的公司工作过。他曾使用 .NET
    Framework 栈开发后端系统，使用 JavaScript、AngularJS、jQuery、Underscore 开发前端，并使用 Xamarin 开发移动设备。


    Yaroslav 在一家名为 Tangiblee 的以色列初创公司工作。他审阅过 Paul F. Johnson 写的 *Xamarin Mobile Application
    Development for iOS*（Packt Publishing）、Dimitris Tavlikos 写的 *iOS Development with
    Xamarin CookBook*（Packt Publishing）以及 Loiane Groner 写的 *Learning JavaScript Data
    Structures and Algorithms*（Packt Publishing）。


    感谢我的朋友和家人的支持与爱。


    **Andrea Chiarelli** 拥有超过 20 年的软件工程师和技术写作者经验。在职业生涯中，他为参与的项目使用了多种技术，从 C#、JavaScript
    和 ASP.NET 到 AngularJS、REST 以及 PhoneGap/Cordova。


    Andrea 曾为许多在线和线下杂志做出贡献，如 *Computer Programming* 和 *ASP Today*，并合著出版了由 Wrox Press
    出版的几本书。目前，Andrea 是 Apparound 意大利办公室的高级软件工程师，这是一家位于硅谷中心的移动软件公司。他还是意大利 Web 技术在线杂志
    http://www.HTML.it 的定期撰稿人。


    **Vishal Rajpal** 是一位丰富的软件工程师，从2011年开始开发专业软件。他主要从事 Java、JavaScript 和多平台移动应用开发，包括
    PhoneGap 和 Titanium。


    Vishal 正在东北大学西雅图校读计算机科学硕士学位，并从事过 C、Java 和 JavaScript。他住在西雅图，可以通过 vishalarajpal@gmail.com
    联系他。你也可以通过 https://github.com/vishalrajpal/ 和 http://www.vish-rajpal.blogspot.in
    了解更多他的工作。


    Vishal 还参与了 Packt Publishing 的书籍，例如 *PhoneGap 3.x Mobile Application Development
    HOTSHOT* 和 *Learning Javascript, Data Structures, and Algorithms*。


