    ## Hands off the DOM


    [114]


    In the early days of the Web, we as web developers didn''t think about the DOM
    too much. If we think about how far JavaScript has come, we can see that many
    changes have come to the world of web development. If we reminisce about the pre-Google
    days of the web, we know that websites were pretty simplistic, and user interaction
    was mainly limited to hyperlink tags and an occasional JavaScript window.alert()
    function to show some form of application interaction.


    As time passed, we encountered Web 2.0, or rather the point where **Asynchronous
    JavaScript and XML (AJAX)** came into being. If you''re not familiar with AJAX,
    I would like to sum it up: AJAX web applications allow developers to pull content
    from external sources, typically XML files, (this is the X in AJAX).


    With AJAX, website content suddenly became dynamic, meaning developers didn''t
    have to rely on backend technologies to refresh a web page with updated data.
    Suddenly, a need for stronger JavaScript came into play. Businesses and their
    clients no longer wanted to have a website responding with page flashes (or sites
    that used backend technologies to update the page with a POST submission method),
    all the more so with sites such as Google Maps and Gmail seemingly pushing the
    idea of the web as a platform for software rather than a desktop operating system.


    ### Don''t we need an MV-whatever library?


    Today, we have frameworks that help with the heavy lifting of some of this type
    of application; AngularJS, Backbone.js, Knockout.js, and jQuery are a few libraries
    that come to mind.


    For this book, however, we will stick to vanilla JavaScript for two reasons. The
    first reason is that entire books are dedicated to many of these libraries and
    talk about performance and various levels of experience, all of which are good
    but beyond the scope of this book. The second reason is that most developers typically
    don''t need these libraries to build a project.


    Remember that all the JavaScript libraries mentioned here, as well as those found
    on the Web, are again all JavaScript! For most projects, we shouldn''t need a
    library to make a project the way we want to build it; moreover, many of these
    libraries come with extra code.


    *Chapter 7*


    [115]


    What I mean by this is that the libraries come with features that might not be
    needed in a given project and, unless a library is modular, it''s difficult to
    use it without removing features that aren''t needed. This is even harder if you''re
    working in a team environment where others may be using a shared library for certain
    areas of the application that may use some features, but not all of them.


    We''ll look into mobile JavaScript performance later in *Chapter 9, Optimizing
    JavaScript for iOS Hybrid Apps*. We will find these libraries become even more
    of a burden. Now with that said, let''s look at some common ways to break the
    DOM, and what we can do to make it perform better.


    ### Creating new objects using the createElement function


    Here, we will learn to create new objects using the createElement function along
    with the following three topics:


    - Working around the createElement function

    - Working with the createElement function

    - When to use the createElement function


    ### Working around the createElement function


    In JavaScript, we can create new page elements using the document.createElement()
    function and text objects to place inside our generated elements using the document.createTextNode()
    function. Typically, creating new elements to inject into our DOM can be a bit
    of a drain on rendering resources as well as interaction performance if done with
    multiple generated elements.


    *Hands off the DOM*


    [116]


    ### Working with the createElement function


    Let''s test how well the createElement function renders content to a screen. Here''s
    our test: we are going to create a table with a lot of data using a for loop.
    We will populate a table cell with a text object with the count of the iteration
    of our for loop. Then, we will look at an alternate version creating the same
    effect with a different code implementation, and compare both. Let''s take a look
    at the first option using the createElement function shown as follows:


    ![](img/1005cbc7df81f2054919decd848f91da_134_0.png)


    *Chapter 7*


    [117]


    Here, we have a simple HTML5 page with some formatting CSS styles in the head
    section and an empty placeholder div element on line number 21 with an id set
    as datainsert. On line 25, we have an anonymous function to run as soon as it''s
    loaded into the browser; also on line 26, we start a console.time function to
    start counting how long our JavaScript performs. We then create a table element
    variable called tableElem on line 27; on lines 28 through 31, we set some attributes
    to help style the formatting of our table.


    Then on line 33, we start our for loop; in the scope of our for loop we create
    a table row element, a table cell element, and a text node to insert text into
    our generated table cell, starting with the cellContent variable on line 35, the
    tableTr variable on line 36, and the tableTd variable on line 37. On lines 39-41,
    we append the table with our generated cell and continue the loop for 10000 times.
    Lastly, we append the table element to our datainsert div element on the page
    to render our content. Let''s run this in our browser and see how long it takes
    for the content to render using Chrome Developer tools options.


    ![](img/1005cbc7df81f2054919decd848f91da_135_0.png)


    *Hands off the DOM*


    [118]


    As we can see, this took quite a bit of processing time, roughly 140 milliseconds
    in Chrome, which is a pretty lengthy render. You can consider doing something
    like this in building a messaging client or displaying data from JSON. Whatever
    the case, the cost of using the createElement function is quite large and should
    only be used in small portions.


    The other way to generate data on a table like this, but without the use of the
    createElement function, is to use the innerHTML property. This property provides
    a simple way to completely replace the contents of an element and assign values
    in the same manner as assigning value to a variable. When the innerHTML property
    is used, you can change the page''s content without refreshing the page. This
    can make your website feel quicker and responsive to user input. This property
    can also be appended using the += append operator. Knowing this, we can structure
    our code base in a slightly different way. What we are doing is shown in the following
    screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_136_0.png)


    *Chapter 7*


    [119]


    The layout for this should be pretty similar to our createElement function example.
    On line 21, we have the same datainsert div; on line 25 our Anonymous function
    is started off. Now on line 28, we see something quite different; here, we can
    see the start of a string variable called tableContents, with the start of an
    HTML table with the same properties as that of the preceding example set to it.
    This is just like what we did using the createElement function except that we
    used just a JavaScript string of HTML markup rather than a DOM object this time.


    Next on line 30, we start our for loop and append the tableContents string with
    an appended string adding in our table row and table cell, with the for loop''s
    iteration count inserted into the cell, again counting 10,000 times.


    When the loop is finished on line 35, we append our string with the closing brackets
    for our table. Finally on line 37 and 38, we use the innerHTML property and write
    our table into the innerHTML property of the datainsert div element. Let''s run
    this example in a browser and take a look at its processing time.


    ![](img/1005cbc7df81f2054919decd848f91da_137_0.png)


    This time our table''s render time is roughly 40 milliseconds, which is almost
    four times faster than we would get if we used the createElement function. Now
    that''s a great speed improvement! And it''s even visually faster in Chrome as
    well.

