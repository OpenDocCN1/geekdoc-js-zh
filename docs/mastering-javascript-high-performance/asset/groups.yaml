    \n**The Audits panel**\n\nHere, we are going to learn about the **Audits** panel,\
    \ with the help of the following\n\naspects.\n\n*Chapter 4*\n\n**[79]**\n\nInteracting\
    \ with the Audits panel\n\nThe **Audits** panel *audits* the full web page's application\
    \ **Network Utilization**\n\nand overall **Web Page Performance**; this is one\
    \ of the easier to use and more\n\nstraightforward panels in the **Developer tools**\
    \ options provided by the browser.\n\nUsing the **Audits** panel is easy as well.\
    \ First, open up Packt Publishing's website\n\nagain, select the **Audits** panel\
    \ using the **Developer tools** option, and then check\n\nthe **Select All** option;\
    \ this will test network speeds and the overall web page\n\nperformance. Lastly,\
    \ be sure to set the radio button **Reload Page and Audit on**\n\nLoad, prior\
    \ to clicking the **Run** button. This will ensure that the audit test checks\n\
    \nfor network usage properly rather than a cached state, just as its is shown\
