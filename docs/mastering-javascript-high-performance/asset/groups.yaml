    ## 远离 DOM


    [114]


    在 Web 的早期阶段，我们作为 Web 开发者并没有过多考虑 DOM。考虑到 JavaScript 已经发展了如此巨大的进步，我们可以看到 Web 开发领域发生了许多变化。如果我们回顾
    Google 出现之前的 Web 时代，会发现当时的网站非常简单，用户交互主要局限于超链接标签，以及偶尔使用 JavaScript `window.alert()`
    函数来显示某种形式的程序交互。


    随着时间的推移，我们遇到了 Web 2.0，或者更准确地说是**异步 JavaScript 和 XML (AJAX)** 诞生的节点。如果你对 AJAX 并不熟悉，我想这样总结一下：AJAX
    Web 应用程序允许开发者从外部源（通常是 XML 文件，这就是 AJAX 中的 X）获取内容。


    有了 AJAX，网站内容突然变得动态化，这意味着开发者不再需要依赖后端技术来通过更新数据来刷新 页面。突然之间，对更强大的 JavaScript 的需求应运而生。企业及其客户不再希望看到网站通过页面闪烁来响应（或那些使用后端技术通过
    POST 提交方法来更新页面的站点），尤其是像 Google Maps 和 Gmail 这样的网站，它们似乎在推行 Web 作为软件平台而非桌面操作系统的理念。


    ### 我们不需要一个 MV-whatever 库吗？


    今天，我们已经有了框架来帮助处理此类应用的繁重工作；AngularJS、Backbone.js、Knockout.js 和 jQuery 是我们想到的几个库。


    然而，对于本书，我们将坚持使用原生 JavaScript，原因有两个。第一个原因是有整本书的书专门介绍了其中许多库，并讨论了性能和各种水平的经验，这些都很好，但超出了本书的范围。第二个原因是，大多数开发者在构建项目时通常不需要这些库。


    记住，这里提到的所有 JavaScript 库以及在 Web 上找到的库，本质上都是 JavaScript！对于大多数项目，我们不需要库来按照我们想要的方式来构建项目；而且，这些库中的许多都带有额外的代码。


    *第 7 章*


    [115]


    我的意思是，这些库带有在特定项目中可能并不需要的特性，除非某个库是模块化的，否则很难在不移除不需要的功能的情况下使用它。如果你在团队环境中工作，情况会更加困难，因为其他人可能在应用程序的某些区域使用共享库，而那些区域可能使用了其中的某些功能，而不是全部。


    我们稍后的*第 9 章《为 iOS 混合应用优化 JavaScript》中将探讨移动 JavaScript 性能。我们会发现这些库会变成更大的负担。话虽如此，让我们来看一些破坏
    DOM 的常见方法，以及我们可以做什么来让它的性能更好。


    ### 使用 createElement 函数创建新对象


    在这里，我们将学习使用 `createElement` 函数创建新对象，并涵盖以下三个主题：


    - 绕过 createElement 函数

    - 使用 createElement 函数

    - 何时使用 createElement 函数


    ### 绕过 createElement 函数


    在 JavaScript 中，我们可以使用 `document.createElement()` 函数创建新的页面元素，并使用 `document.createTextNode()`
    函数创建文本对象以将其放置在我们生成的元素中。通常，如果使用多个生成的元素来创建新元素并注入到 DOM 中，可能会消耗渲染资源并影响交互性能。


    *远离 DOM*


    [116]


    ### 使用 createElement 函数


    让我们测试一下 `createElement` 函数将内容渲染到屏幕上的效果如何。这里是我们的测试：我们将使用 `for` 循环创建一个包含大量数据的表格。我们将用一个文本对象填充表格单元格，其内容为
    `for` 循环的迭代次数。然后，我们将查看使用不同代码实现创建相同效果的版本，并对两者进行比较。让我们看看第一个使用 `createElement` 函数的选项，如下：


    ![](img/1005cbc7df81f2054919decd848f91da_134_0.png)


    *第 7 章*


    [117]


    在这里，我们有一个简单的 HTML5 页面，在 `head` 部分有一些格式化 CSS 样式，第 21 行有一个空的占位 `div` 元素，id 设置为 `datainsert`。在第
    25 行，我们有一个匿名函数会在它加载到浏览器时立即运行；同样在第 26 行，我们启动了 `console.time` 函数开始计数我们的 JavaScript
    执行时间。接着我们在第 27 行创建名为 `tableElem` 的表格元素变量；在第 28 行到 31 行，我们设置了一些属性来帮助格式化我们的表格。


    然后到第 33 行，我们启动了 `for` 循环；在 `for` 循环的作用范围内，我们创建了一个表格行元素、一个表格单元格元素和一个用于向生成的表格单元格插入文本的文本节点，从第
    35 行的 `cellContent` 变量、第 36 行的 `tableTr` 变量和第 37 行的 `tableTd` 变量开始。在第 39-41 行，我们将生成的单元格附加到表格并继续循环
    10000 次。最后，我们将表格元素附加到页面上的 `datainsert` div 元素中以渲染我们的内容。让我们在浏览器中运行，并使用 Chrome 开发者工具选项查看内容渲染需要多久。


    ![](img/1005cbc7df81f2054919decd848f91da_135_0.png)


    *远离 DOM*


    [118]


    正如我们所见，这花费了相当长的时间，在 Chrome 中大约是 140 毫秒，这是一个相当漫长的渲染。你可以考虑在构建消息客户端或从 JSON 显示数据时此类操作。无论情况如何，使用
    `createElement` 函数的成本是非常大的，应该只在小部分使用。


    在这样的表格上生成数据的另一种方法是不使用 `createElement` 函数，是使用 `innerHTML` 属性。该属性提供了一种简单的方法来完全替换元素的内容，并以给变量赋值的方式进行赋值。当使用
    `innerHTML` 属性时，你可以在不刷新面的面的更改页面内容。这可以让你的网站感觉更快并对用户输入做出响应。该属性还可以使用 `+=` 附加运算符进行追加。知道这一点，我们可以以稍微不同的方式构建我们的代码库。我们所的操作如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_136_0.png)


    *第 7 章*


    [119]


    这个布局应该与我们的 `createElement` 函数示例相似。在第 21 行，我们有相同的 `datainsert` div；在第 25 行，我们的匿名函数启动。现在在第
    28 行，我们看到了完全不同的东西；在这里，我们可以看到名为 `tableContents` 的字符串变量的开始，其中包含一个 HTML 表格开始，并设置了与前一个示例相同的属性。这与我们使用
    `createElement` 函数所做的相似，只是这次我们使用的是 JavaScript 字符串 HTML 标记，而不是 DOM 对象。


