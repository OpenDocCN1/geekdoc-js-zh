    `new` 关键字使用它们。


    现在你可能会问，我们如何知道现有的 JavaScript 代码中是否使用了构造函数。想象一个非常大的代码库，到处都是函数；如果即使开发者工具选项也没有告诉我们需要使用
    `new` 来实例化而不是使用静态函数调用，我们该如何检查此呢？


    *构造函数、原型与数组*


    **[100]**


    幸运的是，有一种方法。如果我们还记得*第 2 章*《使用 JSLint 提高代码性能》中提到的，JSLint 可以告诉我们是否需要使用 `new` 关键字。我添加了之前的代码示例，并在
    JSLint 中启用了 **console** 和 **browser** 对象。查看下截图中 JSLint 呈现的错误：


    ![](img/1005cbc7df81f2054919decd848f91da_118_0.png)


    正如我们从 JSLint 中看到的，在第 11 行，我们得到了一个错误，唯一的错误是 `Missing ''new''`，这表明我们有一个构造函数，并且我们需要像使用构造函数那样使用它。


    *第6 章*


    **[101]**


    ## 理解实例


    现在解决此问题的简单方法是将 `AuthorName` 函数的名字更改为驼峰法；即我们将 *A* 改为小写 (*(a*))。但在这里我们要将其标记为实例，你可能会问为什么？嗯，在
    JavaScript 中，每当我们写一个对象、变量、函数、数组等时，我们都在创建对象。


    通过使用实例，我们减少了对对象的使用。在 JavaScript 中，一个实例在内存中只计算一次。例如，假设我们使用 `document.getElementById()`
    方法。保存该对象的每个变量都会获得 1 的内存计数，但如果它是我们用 `new` 关键字声明的对象，那么该计数只计算一次，而不是在每次出现 `getElementById()`
    调用时都重复计算。


    通过使用 `new` 关键字，我们创建了构造函数的实例（在本例中为 `AuthorName`），这允许我们按照通常使用的方式重用该函数。


    ### 使用 ''new'' 创建实例


    创建一个新实例非常简单；我们可以简单地调用一个新实例来运行一个函数，如下所示所示，在第 11 行的 `console.log` 函数中使用 `new` 关键字：


    ![](img/1005cbc7df81f2054919decd848f91da_119_0.png)


    如果我们在空白页面或简单的 HTML 页面中运行此代码，我们将发现日志的输出并不是我们预期的方式。但我们可以在 Chrome **开发者工具**的 **控制台**
    面板中看到返回了 `AuthorName {}` 的对象。这告诉我们，我们实际上记录的是对象的新实例，而不是作者的姓名。


    *构造函数、原型与数组*


    **[102]**


    为了正确显示此名称，我们需要一个关键字来声明对该构造函数实例的引用。为了做到这一点，我们将使用 `this` 关键字；在 JavaScript 中，`this`
    是对作用域内执行精确切点的引用。


    JavaScript 中的 `this` 关键字在被使用时，指的是脚本执行该点存在的作用域和变量。例如，当你在函数中使用 `this` 关键字时，它可以引用位于相同作用域（或函数内部）的变量。通过使用
    `this` 关键字，我们可以指向代码执行中某个点的变量和对象。


    **作用域**（scope）简单来说就是具有自己的变量和属性的 JavaScript 代码块。作用域可以包括单个 JavaScript 对象的全局级作用域（意味着整个
    JavaScript 文件）、函数内部设置变量和属性的函数级作用域，或者如之前讨论过的构造函数，因为构造函数是一个函数。


    让我们用 `this` 关键字重写我们的 `AuthorName` 构造函数，以便我们引用我们的作用域并将值打印到 **控制台** 面板。我们需要在构造函数内部创建一个初始化器，以便返回我们的作用域变量。初始化器（有时称为
