    \n查看我们的代码示例，我们可以在第 13 行看到我们添加了一个名为 `callback` 的参数。重要的是，在这里，我们回调方法的命名并不重要，但为函数包含一个占位符参数是重要的。我们将作为回调函数的占位符函数是\
