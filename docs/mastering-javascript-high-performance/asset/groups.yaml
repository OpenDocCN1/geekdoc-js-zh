    *检测性能*


    **[76]**


    脚本事件（Scripting event）


    **脚本**事件发生在浏览器读取和解释 JavaScript 代码时。


    在**时间线（Timeline）**面板中，你可以展开一个**脚本**事件，并查看浏览器在何时接收到某个函数。**脚本**事件在 Google Chrome
    中显示为黄色线条。


    渲染事件（Rendering event）


    **渲染**事件发生在图像文件和脚本影响 DOM 时；这可能发生在加载图像时未在图像标签中指定大小，或者当 JavaScript 文件在页面加载后更新页面的
    CSS 时发生。


    绘制图事件（Painting event）


    **绘制图**事件是最后一类事件，通常用于更新 UI。与**渲染**事件不同，**绘制图**事件发生在浏览器在屏幕上重绘图像时。对于桌面 JavaScript
    开发，**绘制图**事件通常不需要担心，但当我们开始考虑移动网络浏览器时，它们就会变得非常关键。


    通常，当元素的显示从原始状态更新时，会强制触发**绘制图**事件。它们也可以由元素的更新触发，例如元素的顶部或左侧位置更新。


    **分析面板（The Profile panel）**


    **分析**面板帮助开发者分析网页页的 CPU 配置文件，并对使用的 JavaScript 拍摄堆快照（heap snapshots）。CPU 配置文件快照在检查大型复杂应用程序时非常有帮助，可以查看哪些文件可能导致对象大小方面的问题。


    JavaScript 堆快照是页面整体 JavaScript 中找到对象的编译列表。这不仅包括我们编写的代码，还包括浏览器内置的代码（例如 `document`
    或 `console` 对象），从而提供了应用程序中所有可能对象的完整列表。


    *第 4 章*


    **[77]**


    使用**分析**面板与使用**时间线**面板）面板相似；选择**拍摄堆快照（Take Heap Snapshot）**或**收集 JavaScript CPU
    配置文件（Collect JavaScript CPU Profile）**选项，然后点击**开始（Start）**，并重新加载页面。在下面的截图中，我选择了**收集
    JavaScript CPU 配置文件**选项：


    ![](img/1005cbc7df81f2054919decd848f91da_95_0.png)


    **资源面板（The Resources panel）**


    **资源**面板列出了在**开发者工具**选项中查看的网页相关的所有文件，每个文件都可以按文件类型排序；开发者可以单独查看每个文件。它还显示页面上的图像及其信息，如**尺寸（Dimensions）**、**文件大小（File
    size）**、**MIME 类型**和源 **URL**。


    重要的是，**资源**面板是任何浏览器数据存储的所在地，包括**Web SQL**、**IndexedDB、本地存储（Local Storage）、会话存储（Session
    Storage）**以及 **Cookies**。用户可以在浏览器的存储数据中查看页面的**键-**值（Key-Value）**对。这对于测试存储状态和在
    JavaScript 代码中存储值非常有帮助。


    *检测性能*


    **[78]**


    查看键值对很容易；在**资源**面板中，选择存储类型并查看键值表，如下截图所示（在查看本地存储时使用 Packt Publishing 的网站所示）：


    ![](img/1005cbc7df81f2054919decd848f91da_96_0.png)


    **审核面板（The Audits panel）**


    在这里，我们将通过以下方面学习**审核（Audits）**面板。


    *第 4 章*


    **[79]**


    与审核面板交互


    **审核**面板*审核*整个网页应用的**网络利用率（Network Utilization）**和整体**网页性能（Web Page Performance）**；这是浏览器提供的**开发者工具**选项中最易使用且更直观的面板之一。


    使用**审核**面板也很。首先，再次打开 Packt Publishing 的网站，使用**开发者工具**选项选择**审核**面板，然后勾选**全选（Select
    All）**选项；这将测试网络速度和整体网页性能。最后，在点击**运行（Run）**按钮之前，确保设置单选按钮**加载时重新加载并审核（Reload Page
    and Audit on）**。这将确保审核测试正确检查网络使用情况，而不是缓存状态，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_97_0.png)


    *检测性能*


    **[80]**


    获取 JavaScript 质量建议


    如果我们只检查 JavaScript 性能，请取消勾选**网络利用率**选项并运行测试；如果我们测试应用程序的特定点，则需要记住这一点。我们需要将单选按钮切换到**审核当前状态（Audit
    Present State）**，并点击**运行**以获取 Web 当前状态的建议。让我们在 https://www.packtpub.com/ 上运行测试，然后选择**结果（Results）**下的文件。让我们看看如下所示的性能改进建议：


    ![](img/1005cbc7df81f2054919decd848f91da_98_0.png)


