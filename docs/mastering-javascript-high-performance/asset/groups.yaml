    Web Workers and Promises


    In the previous chapters, we addressed some common performance issues


    while dealing with common JavaScript issues that come up in general JavaScript


    development. Now, we come to the point where, assuming that our projects can


    support newer JavaScript features, we can make our code perform even better


    than before.


    This is where web workers and promises come into play. In this chapter, we will


    take a look at both and see how and when to use them. We will also discover their


    limitations and understand their benefits in terms of high-performance JavaScript.


    **Understanding the limitations first**


    Before diving into web workers and promises, we need to understand a concern


    with the JavaScript language itself. As mentioned in past chapters, JavaScript
    is


    single-threaded and cannot support two or more methods running at the same time.


    For many years, we as JavaScript developers never really had to concern ourselves


    with threading, let alone the JavaScript memory issues that we have covered in
    the


    course of this book. Most of our code existed inside a browser, and ran on the
    same


    page either inline, or linked externally to a file on the same server, for basic
    web


    page functionality.


    As the Web moves forward, with originally frontend coding becoming more and


    more necessary for high-performing applications, newer ways of handling larger


    JavaScript applications are needed. Today, we consider these newer features as
    a


    part of the *ECMAScript 5* feature set.


    In ECMAScript 5, many of these features were rolled into what many consider to
    be


    the HTML5 stack. This stack consists of HTML5 (the DOCTYPE and HTML tags), CSS


    version 3.0, and ECMAScript 5.'
  - '[PAGE 152]


    *Web Workers and Promises*


    **[** **134** **]**


    These technologies make the Web much more powerful than the days of AJAX and


    XHTML development. The limitation is that these features are cutting-edge and
    may


    or may not work with every browser. So, using these newer features usually requires


    a bit for forethought before their implementation in a project.


    We''ve talked about some of these features since *Chapter 2*, *Increasing Code
    Performance*


    *with JSLint*, including the use strict statement, which forces the browser to
    throw


    an error if something in JavaScript isn''t strictly written or coded correctly.
    Now


    you may ask why we are using the use strict statement if it isn''t supported in
    all


    browsers. The trick with the use strict statement is that, when it''s coded for
    an


    older browser, it shows up as a string and is ignored.


    This is a great thing because, even if it is ignored in older browsers, we can
    still use


    this newer feature and write more efficient code. Unfortunately, that doesn''t
    translate


    to all features in ECMAScript 5; this includes web workers and promises.


    So in this chapter, let''s keep in mind that henceforth, while working with code


    samples, we need to focus our testing and coding on a newer browser such as Google


    Chrome, Opera, Firefox, or Apple''s Safari, and even newer versions of Internet


    Explorer that follow the same standards.


    **Web workers**


    Web workers give JavaScript developers like us a way to build multi-threaded


    JavaScript applications; this works in newer browsers as we have an object called
    a


    **worker**. A worker object is simply an external JavaScript file that we pass
    logic to.


    Now, this may seem a little odd. Haven''t we worked with external JavaScript files,


    since the beginning of JavaScript? Fair enough, but web workers are a bit new
    in


    terms of how a browser handles the execution of files in the DOM. Let''s take
    a


    look at the following sample diagram on how a browser reads a file:


    ![](img/1005cbc7df81f2054919decd848f91da_152_0.png)'
