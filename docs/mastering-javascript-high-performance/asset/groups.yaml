    *Web Workers and Promises*


    [142]


    So, on line 19, we''ve removed the reference to the worker file, which is a .js
    file, and moved the for loop into the page. Here it will loop one thousand times
    and print to the console. Now on line 32, we have our window.load event listener,
    and we sequentially call our functions as 1, 2, and 3.


    We then again use the console.time function to track how long a process occurs.
    As this code sample is now single-threaded, we should see a longer time for the
    timeEnd function to fire. Let''s run our code and take a look at the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_160_0.png)


    That''s not bad! Here, our time is much longer than our multi-threaded Worker
    example, which is roughly 70 milliseconds slower than our web worker. That''s
    not a bad performance boost; it''s minor but still helpful. Now, one issue with
    workers is that they take a lot of time to trigger the next function that exists
    on a separate thread from the main thread. We need to have some way to call a
    function when a function completes asynchronously, and for that we have JavaScript
    promises.


    **Promises**


    JavaScript promises are also a new way to optimize our JavaScript code; the idea
    of promises is you have a function that is chained to a main function, and is
    fired in sequential order as it''s written. Here is how it''s structured. First,
    we create a new object using the Promise object, and, inside the parentheses,
    we write the main function, and assign the new promise object to a variable.


    One thing to note before continuing is that JavaScript promises are EcmaScript
    6-specific. So, for this section, we will need to test our code in an EcmaScript
    6-ready browser such as Google Chrome.


    *Chapter 8*


    [143]


    Next, with our promise variable, we use the then keyword, which in actuality works
    just like a function. But it only fires when our root promise function is completed.
    Also, we can chain the then keywords one after another and sequentially fire JavaScript
    asynchronously to ensure that the variables scoped in our promise will, of course,
    promise to the next then function that those variables will have set values. Let''s
    take a look at a sample promise and see how this works:


    ![](img/1005cbc7df81f2054919decd848f91da_161_0.png)


    In our code sample, we have an HTML5 page with an embedded script tag. We have
    two elements on our page that we interact with or view using a button tag with
    the makeAPromise() function as an attached onclick event on line 13. On line 15,
    we have a div tag with an id of results, with its inner HTML left empty.


    *Web Workers and Promises*


    [144]


    Next, on line 19 we create our makeAPromise function and set a count variable
    on line number 20 called promiseCount. Now here''s where we create our promise.
    On line number 22, we create a variable called promiseNo1, and we assign it with
    a new Promise object. Here you can notice how we start opening the parenthesis
    with a function as parameter that starts on line 23, and we have a resolve parameter
    inside that function. We''ll discuss that later.


    In our Promise function, we have a simple for loop that multiplies the value from
    the for loop by 5, and the then function assigns it to our promiseCount variable.
    To finish our Promise object''s function, notice a new type of keyword, resolve!
    The resolve keyword is a type of return used specifically for promises; it sets
    a promise''s return value. There are also other promise return types such as reject,
    which allows us to return a failed value if we want. For this example, however,
    we are keeping it simple and only using resolve.


    Now, if you remember on line 23, our Promise function had an internal function
    with the resolve parameter. Though this may look a little odd, it is required
    to make our promise work; by adding resolve to our function, we are telling our
    promise that we need to use the resolve function inside our Promise function.
    For example, if we needed resolve and reject, we would write it as function (resolve,
    reject) {}.


    Back on line 29, we assign our resolve with a string that outputs our value with
    some copy to fill our div, but we don''t assign the innerHTML property here; that''s
    done using our promiseNo1.then function. This works like a function that follows
    the promise''s resolve function.


    Finally on line 32, we call our promiseNo1 variable''s instance, use the then
    function, and again wrap the parenthesis with its own internal function. We may
    notice that, on line 33, we''ve passed in an argument called promiseCount. This
    is our resolve value that ended our Promise function declared on line 22. We then
    use that again in line 33, where we assign our results div element with its innerHTML
    property.


    **Testing a true asynchronous promise**


    For this simple example, we can see how a promise is structured and how each firing
    is needed when chained; when we chain promises, we can see how a promise can still
    fire a chained function even when we create a bit of single-threaded JavaScript
    code that causes a delay in execution. In this case, it''s a setTimeout function;
    let''s take a look at this new code sample shown in the following screenshot:


    *Chapter 8*


    [145]


    ![](img/1005cbc7df81f2054919decd848f91da_163_0.png)


    For this simple example, we can see how promise chains function without breaking
    the thread. Here, we set a timerCount variable on line 20; then we will print
    to an empty results div element found on line 15. Next, by reusing our promiseNo1
    variable with its own promise instance, we create a for loop that randomizes the
    timerCount using Math.random(), which allows a random number to be generated and
    then multiplied to 10000 in the for loop when it finishes.


    *Web Workers and Promises*


    [146]


    Lastly, we use the resolve function to return our promise, which is chained to
    our then function on line 31; here we have an argument called response to serve
    as our resolve function''s value. Now on line 33, we have a variable called totalCount,
    where we have the response argument and the timerCount function added together.
    Next, we create a setTimeout function that appends the results div element with
    a second line, printing the amount of time set by the totalCount variable declared
    by us, while still using the timerCount function as our timeout value.


    Now, the last part of our chain is another then function on line number 40. Here,
    we append the results div element again, but you need to note that we are printing
    from our second chained then function. Let''s take a look at how that works in
    Chrome, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_164_0.png)


    Take a look at the output. Here, we can see that, with each button click, we get
    a numeric count for each point of the promise chain. We have a value of 0 on the
    First count, and a random larger number on the Third count. Wait! Is that the
    third count? Yes, note that the third count comes after first; this demonstrates
    that, even when we were waiting for our for loop to process, the third promise
    continued.


    *Chapter 8*


    [147]


    On the next line, we see an even larger number value with the Second count noted
    in our line; if we continue clicking the button, we should see a consistent pattern.
    Using promises can help us multi-thread code as long as we don''t need a specific
    value in the chain immediately. We also get performance benefits by moving some
    of our code off our main JavaScript thread using promises.


    **Summary**


    In this chapter, we reviewed how to use web workers, and the limitations web workers
    have technically and conceptually in a real-life application. We also worked with
    JavaScript promises, where we learned common keywords related to promises such
    as respond and reject. We saw how to use the then function to chain our promises
    in sync with our main application thread, to create a multi-threaded JavaScript
    function.


    In the next chapter, we will see how working from a mobile device such as iOS
    and Android can affect our performance and how to debug performance on a device.

    '
