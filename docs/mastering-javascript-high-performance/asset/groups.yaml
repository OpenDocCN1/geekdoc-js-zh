    ## What are timers and how do they affect performance?


    Timers are built-in functions of JavaScript that allow the execution of either
    inline JavaScript code or permit functions to be called at a specific point of
    time after, or repeatedly during, the life cycle of a JavaScript application.


    Timers are a great tool in a JavaScript developer''s toolbelt, but they have their
    own issues when it comes to performance. Consider the fact that the JavaScript
    language is single-threaded, which means that every line of code in our application
    cannot be fired at the exact same time as another piece of code in our application.
    To get around this, we use a built-in function called setTimeout.


    The setTimeout method takes two parameters to delay a block of code from executing;
    the first is either the name of a function with our code or a line of JavaScript
    code by itself, followed by an integer specifying the extent by which we want
    to delay code execution which is in milliseconds.


    On the surface, the setTimeout function may seem harmless, but consider this.
    Let''s say we have two functions, both being triggered by one setTimeout function
    each with a for loop that prints an incremented value of the for loop to the console
    window. Each function will have a different maximum value and the lower count
    function will be called slightly after the first larger functions of the for loop.
    Let''s take a look at the code sample here:


    ![](img/1005cbc7df81f2054919decd848f91da_111_0.png)


    *Operators, Loops, and Timers*


    94


    We can see that this is an empty HTML5 page with a script tag with our code on
    line number 9. On lines 13 and 20, we have the start of two similar functions:
    one called delay300000() and another called delay3000(), with each function containing
    a for loop that prints each step of the loop to the console using the console.info
    statement. The console.info statement is a type of console print that simply formats
    the console line to indicate information.


    Now, on line 27, we will trigger both functions inside a window.onload function,
    with the larger delay function called 50 milliseconds after the page load and
    the shorter function called slightly later at 150 milliseconds. Let''s try this
    in Chrome and see what happens in Dev Tools, as shown next:


    ![](img/1005cbc7df81f2054919decd848f91da_112_0.png)


    Here, we can notice quite a bit of lag as we print all these lines to the console.
    We can also see that we triggered both in a given timeout. In the preceding screenshot,
    we can see that our delay3000() isn''t triggered until after our larger function,
    delay300000(), is completed.


    ### Working around single-threading


    Sadly, with plain JavaScript, we simply can''t "multithread" a function like these
    two at the same time, but we can incorporate something like a callback method
    in our code. A callback method is simply a JavaScript function that''s triggered
    when a function is completed. Let''s set up our delay300000() function to call
    back our delay3000() method once it''s completed. Here''s what it would look like:


    *Chapter 5*


    95


    ![](img/1005cbc7df81f2054919decd848f91da_113_0.png)


    Looking at our code sample, we can see on line number 13 that we''ve added a parameter
    with the name callback. It''s important to know that here, the naming of our callback
    method isn''t important but including a placeholder parameter for a function is.
    Our placeholder function that will serve as our callback function is Delay3000().


    Notice how we renamed Delay3000 on line 22, capitalizing the *d*. The purpose
    of this is to indicate to the JavaScript interpreter that this is a **constructor**,
    a function that requires it to be initialized in memory. This is done by capitalizing
    the first letter in the function''s name. You may recall from *Chapter 2, Increasing
    Code Performance with JSLint*, if we use a capitalized function name JSLint will
    return a warning that it "thinks" a constructor is being used even if it''s a
    plain function. To keep our interpreter from second-guessing itself, we want to
    ensure we are writing our functions and objects as we intended.


    *Operators, Loops, and Timers*


    96


    Finally, we have updated our onload function''s logic by removing the extra setTimeout
    for delay3000, and we added the newly renamed Delay3000 (without parentheses)
    as a parameter inside our delay300000() function in the setTimeout function. Let''s
    run this again in our browser, and take a look at our console''s output. If we
    scroll down near the bottom of the console log (after processing the initial delay300000()
    function call), we can see that our Delay3000 log message appears after completing
    the initial function. Using callbacks is a great way to efficiently manage your
    application''s thread and ensure proper load stacking of a heavy application,
    allowing you to pass parameters after an initial function is completed.


    ### Closing the loop


    Lastly, as we can see in this callback method example, it''s usually not a great
    idea to use large hundred thousand scaled loops for performance reasons. Always
    look for better and more efficient ways to break up large loops and call other
    functions to help balance out the workload.


    Also, I encourage you to check out JavaScript **promises**, an EcmaScript 6 feature.
    While not quite ready for discussion yet in this book, as at the time of writing,
    promises are still experimental. I encourage you, dear reader, to follow up and
    learn about what will be a successor to callbacks in JavaScript when it''s finalized.
    You can learn more about promises on Mozilla''s Developer Network site at https://developer.mozilla.org/en-US/.


    ### Summary


    In this chapter, we learned about conditionals and how efficient strict comparisons
    help our JavaScript perform better at runtime. We also learned about loops and
    how to optimize loops, preventing objects that are not required for our code base
    from being repeated over and over in a for loop and thus, keeping our code as
    efficient as possible.


    Lastly, we also learned about timers and single-threading in JavaScript applications
    and how we can use callbacks to keep our code running as smoothly as possible
    even when we overload it. Next, we cover arrays and prototype creation performance
    and find out how best to work with them in JavaScript.


    Constructors, Prototypes, and and Arrays


    Now that we are getting comfortable with optimizing JavaScript without a linter
    or an IDE testing our code for us, it''s time to dive into more complex optimization,
    specifically when it comes to memory and object creation. In this chapter, we''re
    going to take a look at optimizing larger JavaScript code bases using constructors,
    prototypes, and arrays.


    We are planning to cover the following topics in the chapter:


    - Building with constructors and instance functions

    - Alternate constructor functions using prototypes

    - Array performance


    *Constructors, Prototypes, and Arrays*


    98


    ## Building with constructors and instance functions


    Here, we will learn about building with constructors and instance functions in
    the following ways:


    ### A quick word


    Depending on skill level, some of us following this book may or may not know exactly
    what prototypes are in JavaScript. If you''re one of the readers who''ve heard
    of prototypes in JavaScript but don''t use them on a daily basis, you need not
    worry as we will quickly cover the basic concepts and how to apply them to JavaScript
    performance.


    If you''re one of those who know what closures, inheritance, parent and child
    relations, and so on are, feel you fall into the latter category and so want to
    skip this chapter, I would encourage you to keep reading, at least to skim through
    the chapter, because, we as JavaScript developers tend to forget common concepts
    while working with JavaScript for many years and continuously focusing on just
    the factors that affect our performance.


    ### The care and feeding of function names


    Take a close look at this simple function shown below and see if you spot anything
    unusual about this function.


    ![](img/1005cbc7df81f2054919decd848f91da_116_0.png)

