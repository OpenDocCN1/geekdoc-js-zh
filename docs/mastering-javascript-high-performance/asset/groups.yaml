    *Understanding JavaScript Build Systems*


    **58**


    ## Summary


    In this chapter, we learned how to create a simple JavaScript build system using
    Node.js with Gulp. We also explored other plugins and checked out Grunt Task Runner,
    which works similar to Gulp but contains many more plugins for your work. Build
    systems help your performance greatly without much effort; keep in mind that gulp
    files can be reused for other projects, and so experiment and find out what works
    best for your projects.


    In the next chapter, we will learn tips and tricks on how to use Chrome''s **Developer
    tools** to better optimize our web application code.


    **59**


    ## Detecting Performance


    In this chapter, we''ll cover our work environment and the tools needed; we will
    also cover the features and JavaScript optimization tools found in the Google
    Chrome Web Inspector, and create some test samples that show us how to use and
    test JavaScript and HTML page code.


    We will cover the following topics in the chapter:


    - Web Inspectors in general

    - The Elements panel

    - The Network panel

    - The Timeline panel

    - The Profile panel

    - The Resources panel

    - The Audits panel

    - The Console panel


    ### Web Inspectors in general


    Before diving in to an in-depth exploration of Chrome''s Web Inspector, it''s
    important to note that there are many different Web Inspectors for different web
    browsers, typically developed by the browser''s vendor for debugging a web page''s
    application content and performance.


    It''s important to understand that, for developers to properly debug a web application,
    they should use the inspector designed for the browser with a detected issue.


    *Detecting Performance*


    **60**


    ### The Safari Web Inspector


    Apple''s Web Inspector is a WebKit-based inspector built for Safari. The Web Inspector
    is built pretty similar to Chrome''s Web Inspector. We will cover more on the
    Safari **Web Inspector** later in *Chapter 9*, *Optimizing JavaScript for iOS
    Hybrid Apps*, mainly because Safari''s **Web Inspector** can debug web content
    in iOS development. Apple has pretty comprehensive documentation on its tools
    at https://developer.apple.com/safari/tools/ and shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_78_0.png)


    ### Firefox Developer tools


    Mozilla''s Firefox web browser also has its own inspector. Originally Firefox
    was the only browser with an inspector; it was called Firebug, was developed as
    a plugin, and was not included with the main browser.


    *Chapter 4*


    **61**


    Since the advent of Firefox 3, Mozilla developed its own browser inspector not
    just for their own browser but also as a debug tool for Firefox OS, Mozilla''s
    mobile OS that uses HTML5 for application development. Firefox **Developer tools**
    also allow debugging for fairly new and even experimental forms of HTML5 and JavaScript
    development.


    We can check out more information on the types of developers that the Firefox
    **Developer tools** allow for at Mozilla''s Developer Network at https://developer.mozilla.org/en-US/docs/Tools,
    as shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_79_0.png)


    ### Internet Explorer developer tools


    In the past, Internet Explorer was considered the black sheep in the web developer''s
    toolbox. Before the advent of Internet Explorer 11, Microsoft offered a simple
    DOM inspector plugin for Internet Explorer version 6 and above; though it was
    very helpful for Internet Explorer''s browser issue, its feature set lacked behind
    other vendors'' inspector tools.


    *Detecting Performance*


    **62**


    Since the release of Internet Explorer 11, Microsoft is positioning itself to
    support HTML development more than it did in the past, and its new **F12 developer
    tools** do just that. Most of the features found in the **F12 developer tools**
    are found just as good as Chrome''s **Developer tools** and Safari''s **Web Inspector**,
    with more releases anticipated in future. We can read more on how to use those
    tools at http://msdn.microsoft.com/en-us/library/ie/bg182326(v=vs.85).aspx, as
    shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_80_0.png)


    ### Chrome''s Developer tools


    Chrome''s Inspector was originally developed using the open-source WebKit browser''s
    Web Inspector, which was also used at one point in Apple''s Safari. Later, when
    Chrome decided to fork WebKit into their own browser runtime called Blink, Google
    rebuilt the Inspector for Blink from the ground up, optimizing the user interface
    and adding features not found in the open source Webkit Inspector.


    Another reason for rebuilding the inspector was the introduction of Chrome for
    Android and Chrome OS applications. This allows developers to access JavaScript-based
    console objects specific to development on those platforms. It also features tools
    to optimize responsive content, and debug mobile content without being on a device.


    *Chapter 4*


    **63**


    Because of the rich features mentioned here, we will cover how to use the Web
    Inspector for Chrome. If you''re concerned about knowing a feature on another
    inspector, refer to the previously mentioned links and research a topic listed
    in this chapter.


    Lastly, Chrome''s update cycle for new features is pretty frequent and even more
    so for its beta version of Chrome called Chrome Canary, which is essentially Chrome
    with experimental features enabled including any early speed improvements for
    Blink. You can download Canary at https://www.google.com/intl/en/chrome/browser/canary.html,
    as shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_81_0.png)


    Chromium''s **Developer tools** include many more advanced features typically
    found in Firefox **Developer tools**. For this chapter, I''ll be using the default
    Chrome **Developer tools**, but please check out Chromium''s **Developer tools**
    as well to stay informed on what''s available in the future.


    *Detecting Performance*


    **64**


    Check out https://developer.chrome.com/devtools for **Chrome DevTools Overview**,
    as shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_82_0.png)


    ### Getting familiar with Chrome''s Developer tools


    To install Chrome''s **Developer tools**, download chrome from http://www.chrome.com/,
    and that''s it! Chrome''s **Developer tools** are included with Chrome with no
    extra installation needed.


    First, open a new window in Chrome and type about:blank in the omnibox (or the
    address bar). Next, let''s open up the **Developer tools** by using the keystrokes
    *Ctrl* + *Shift* + *I* (or *Command* + *Option* + *I* on the Mac). We should see
    a blank screen with **Developer tools** showing up, as shown in the next screenshot:


    *Chapter 4*


    **65**


    ![](img/1005cbc7df81f2054919decd848f91da_83_0.png)


    By default, Chrome''s **Developer tools** will either be displayed in dock mode,
    as shown before, or in its own window; if you want to undock or redock the **Developer
    tools**, select the dock button.


    Holding down the dock button allows us to dock the **Developer tools** to the
    side of the browser window. You can find the dock button flagged in the following
    screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_83_1.png)


    *Detecting Performance*


    **66**


    The **Developer tools** are broken up into different panels, that are shown at
    the top of the window, each panel containing different features and debugging
    options for a web application. We will focus on the JavaScript-specific panels,
    but we will cover each panel briefly for anyone who''s not so familiar with them.


    ### The Elements panel


    The **Elements** panel displays both the HTML page''s source code and DOM Explorer,
    allowing developers to inspect changes in the DOM. We can highlight elements by
    either placing the mouse over the DOM tree, or by using the magnifying lens as
    indicated in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_84_0.png)

