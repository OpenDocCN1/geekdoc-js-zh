    *应用性能测试*


    **[180]**


    一旦我们更新了 `10_01.js` 文件中的 `newCustomer` 信息，我们应该能够重新运行 Jasmine 并重新测试我们的代码示例。如果所有测试都通过，我们将看到默认的
    **Spec List** 以绿色显示所有结果；让我们像下面的截图所示重新打开页面，看看我们的测试是否通过：


    ![](img/1005cbc7df81f2054919decd848f91da_198_0.png)


    太好了，所有六规格都通过了！做得好！通过确保我们应用程序的所有数据都使用正确的类型，我们还可以确保我们的 JavaScript 应用程序不仅运行良好，而且以其预期的高准确度运行。


    *第 10 章*


    **[181]**


    当应用程序偏离开发者的设计时，可能会导致性能问题并影响应用程序的整体稳定性。在 Jasmine 中，我们可以看到测试的完成时间；注意，最后一个测试的性能比带有错误的那个要快得多。在下面的截图中，我们有没有错误的最终应用程序页面，如
    Chrome 中的 **Developer tools**（开发者工具）选项所示：


    ![](img/1005cbc7df81f2054919decd848f91da_199_0.png)


    *应用性能测试*


    **[182]**


    这里需要注意的最后一个事实是 JavaScript 开发者可以使用的不同方法。一种是**测试驱动开发** (**TDD**) 方法，即我们在编写应用程序代码之前先编写测试。许多
    JavaScript 开发者测试应用程序的另一种方法称为**行为驱动开发** (**BDD**) 方法。这是通过先编写应用代码，然后与应用交互的，包括打开一个弹窗并确认代码按预期工作。这两种都是构建应用程序的有效方法，但对于使用必须准确数据的
    JavaScript 应用程序，TDD 才是不之选！


    ## 总结


    在本章中，我们涵盖了 JavaScript 应用程序单元测试的基础知识。我们介绍了 Jasmine，这一个针对 JavaScript 的行为驱动单元测试框架。我们共同创建了一个没有技术错误但导致应用程序问题的现实应用。


    我们回顾了如何读取和编写应用程序规范，以及如何使用应用程序规范在 Jasmine 中编写测试。然后我们针对代码运行了测试，并快速更新了客户数据以反映规范，使我们的单元测试通过。最后，我们了解到对代码进行单元测试可以提高我们的
    JavaScript 性能，并最大限度地降低应用程序的风险。


