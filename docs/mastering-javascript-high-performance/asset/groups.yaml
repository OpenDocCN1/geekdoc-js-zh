    *第一章*


    [ 7 ]


    ![](img/1005cbc7df81f2054919decd848f91da_25_0.png)


    通常，IDEA 被认为是最以 Java 为中心的 IDE，但它包含了与 WebStorm 相同的工具以及更多。像 Visual Studio 一样，它可以处理多种语言，但这是以性能为代价的。例如，如果我们在较慢的系统上在两个环境中工作，那么在日常处理
    JavaScript 项目时，我们可能会发现 IDEA 上的延迟比 WebStorm 更明显。


    再次，这是因为 IDE 需要在后台运行大量功能来优化我们的代码，而这在 IDEA 上表现得更为明显；因此，起初使用 IDE 对于构建结构良好的代码库是非常棒的，但随着时间的推移，当我们反复在一个缓慢的编辑器中工作时，我们需要一个已经设置好基础且速度更快的工具。


    考虑到这一点，许多没有发现 IDE 性能问题的问题的开发者倾向于坚持他们选择的 IDE；然而，其他开发者会转向下一节介绍的编辑器。


    *对速度的需求*


    [ 8 ]


    ## 中级编辑器


    中级编辑器非常适合已经度过开发早期阶段的项目或非常小的项目。在开发早期使用 IDE 的例外是小型项目。这些项目通常是基于内容管理系统的网站，例如 WordPress、Joomla、Drupal
    等，在这些系统中，大多数 JavaScript 已经由开发者编写并测试完毕。


    它们对于轻量级代码提示很有用，有些编辑器可以连接到源代码仓库或 FTP 以推送代码。这些编辑器与 IDE 之间的真正区别在于编辑器的速度以及缺乏代码质量功能。许多此类编辑器只寻找代码中显而易见的错误，例如
    JavaScript 中缺少分号。尽管如此，它们仍然是非常实用的全能编辑器。


    ### Panic 的 Coda 编辑器


    Coda 是一个仅限 Mac 的编辑器，但它支持 HTML、CSS 和 JavaScript 编码。下面的截图显示了 Coda 的用户界面：


    ![](img/1005cbc7df81f2054919decd848f91da_26_0.png)


    它对 Python 和 PHP 有一些支持，但它并不是专门用于运行非 Web 代码的。它还具有 JavaScript 手动验证检查器，而不是持续检查器，因此，它确实提供了一些改进你的
    JavaScript 和 Web 代码的支持，但它并不会在你编码时始终完全检查错误。


    ### Microsoft WebMatrix 编辑器


    WebMatrix 是微软在这一中级类别中较轻级的网站编辑器。它支持 Git 和 Team Foundation Server，还支持 ASP.NET 项目、PHP
    和 NodeJS。WebMatrix 的用户界面可以在下面的图中看到：


    ![](img/1005cbc7df81f2054919decd848f91da_27_0.png)


    WebMatrix 是中级编辑器的一个例子，在选择你想要为项目选用的哪种编辑器时，你可能需要考虑该编辑器的功能。


    [ 10 ]


    例如，如果你需要支持 Python 的 Mac，那么 Coda 是一个不错的选择，而 WebMatrix 则提供了不同的功能集，包括对 ASP.NET 的支持。这是中级编辑器的共同主题，许多编辑器实际上被设计用于执行某些任务，并在保持编辑器尽可能快速的同时，仅为代码库提供最少的支持。


    对于此类类型的编辑器，我们可以看到它们允许我们轻松连接到现有项目，并在相当快的编辑器上工作时进行一些代码检查。


    ## 轻量级编辑器


    有时，作为 JavaScript 开发者，我们*根本不在乎*项目使用的后端平台，只需要一个简单的文本编辑器来编写一些 JavaScript 代码或更新 HTML
    文件。这就是轻量级编辑器大显身场的地方。


    ### Sublime Text 编辑器


    Sublime Text 是一个非常流行的、跨平台的轻量级编辑器。它的用户界面可以在下面的图中看到：


    ![](img/1005cbc7df81f2054919decd848f91da_28_0.png)


    它以启动和使用速度以及一些基础编辑功能（如语言颜色提示和支持多语言的基础代码提示）而闻名。


    它还拥有自己的的、名为 **Package Control** 的包管理器，这允许你扩展 Sublime Text 以自动化一些常见的代码编辑和编译过程。不过，新下载的它是极其轻量级的，允许开发者添加其开发工作流所需的常用插件。


    ### Notepad++ 编辑器


    Notepad++ 编辑器的用户界面如附图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_29_0.png)


    在 Windows 上，一种仅限 Windows 平台、且实际上是编辑器而非 IDE 的 JavaScript 编辑器就是 Notepad++。与 Sublime
    Text 类似，Notepad++ 主要作为文本编辑器使用并具有插件支持，但不使用像 Sublime Text 那样的包管理器，因此即使有插件支持，该应用程序运行得极快。它对某些项目文件（包括
    JavaScript）具有代码提示支持。


    在这些编辑器或任何其他轻量级编辑器的情况下，由于它们通常不包含代码验证，它们允许在后台运行验证的同时轻松、快速地更新代码，但面临着编写缓慢或损坏代码的风险。


    ## 云端编辑器


    最后，云端或基于 Web 的编辑器是 Web 开发者工具箱中的新颖工具。它们允许开发者在浏览器内部处理代码库，无论是作为 浏览器的插件还是纯在线运行，并且它允许开发者在任何操作系统上工作——Chrome
    OS、iPad 或 Android 操作系统——这些系统你可能没想过在那里编写 JavaScript！


    在浏览器中编写代码的优势是项目代码托管在网上，要么在 Git 中，要么在编辑器的托管服务中。某些插件编辑器允许你像其他编辑器一样从计算机硬盘进行工作，但它们是用
    HTML 和 JavaScript 编写的，并带有像其他网站一样的后端（如 Python、PHP 或 ASP.NET）。


    通常，这些编辑器在功能上处于中级编辑器的范围内。然而，其中某些除了无需在计算机上安装编辑器在线之外，提供的功能非常少，这就是为什么它们属于这一类。接下来的章节将提供几个流行的云编辑器的例子。


    ### Cloud9 编辑器


    Cloud9 编辑器可在 http://c9.io/，是一个通用的 Web 应用程序 IDE，但它是支持 HTML5、PHP、Node.js、Rails、Python/Django
    和 WordPress 的云端应用。下面的截图显示了 Cloud9 编辑器的用户界面：


    ![](img/1005cbc7df81f2054919decd848f91da_31_0.png)


    它还允许你从 Git URL 或 GitHub 项目克隆，因此你可以选择将代码托管在 Cloud9 中或同步到你自己的 Git 仓库。Cloud9 的另一个特性是支持从浏览器虚拟机进行
    iOS 模拟器测试，以及对 Node.js 的控制台支持——同样是在浏览器中。


    [ 14 ]


    ### Codenvy 编辑器


    另一个在线 IDE——Codenvy 可位于 http://codenvy.com/。它的用户界面可以在下面的图中看到：


    ![](img/1005cbc7df81f2054919decd848f91da_32_0.png)


    这个编辑器与 Cloud9 非常相似，但它托管云服务项目，例如 Google 的 App Engine。它还可以构建 Android 应用程序，同时对 AngularJS
    或 jQuery 等流行库具有完整的 JavaScript 支持。


    云端编辑器的一个问题是，当项目涉及 JavaScript 库时，在线编辑器可能无法识别使用的库特定 JavaScript 或 HTML 标签约定，因此在选择云端编辑器时考虑功能是重要的。


    对于云端编辑器，我们可以看到它们遵循中级编辑器的功能集，但允许快速连接并更新现有项目。


