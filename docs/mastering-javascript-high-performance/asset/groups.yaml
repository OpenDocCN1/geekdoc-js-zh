    how


    many tests passed and failed in both the **Failures** view and the **Spec List**
    view.


    **Fixing our code**


    With our test code working now, we can modify it to ensure this works properly.
    For


    this, we will need to update the 10_01.js file and the newCustomer data, which
    is


    on lines 56 through 63 in the 10_01.js file. Let''s review what went wrong with
    our


    sample customer data:


    •


    The first test that failed was 2, which required the customer''s name to be


    created as an object array, with the first name as an array item followed by


    the last name as the second item in the object array


    •


    The second that failed was test 3, which required the customerBalance to be


    a type of number


    •


    The third error was test 6, which required the customer''s marriage status to


    be a boolean and not a string


    Let''s update our newCustomer data; you can see that I''ve done that in the following


