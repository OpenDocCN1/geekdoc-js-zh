    **[33]**


    现在让我们通过 JSLint 重新运行我们最终的代码，我们应该会看到这样的界面：


    ![](img/1005cbc7df81f2054919decd848f91da_51_0.png)


    我们可以看到现在 JSLint 中已经没有错误了，我们还可以看到一个**函数报告（Function Report）**面板，它作为变量作用域的注释说明了哪些变量是文件的全局变量，以及函数内部哪些变量和函数（包括我们的匿名函数示例）。


    在结束本章之前，让我们尝试在 `2_03_01.js` 和 `02_03_03.js` 代码文件中尝试 `console.time` 方法，在代码周围包裹
    `console.time` 函数。我这边得到的前者运行时间是 0.441ms，而经过 JSLint 优化后的代码是 0.211ms！看起来不错；性能提升了*双倍*！


    *使用 JSLint 提高代码性能*


    **[34]**


    **总结**


    在本章中，我们学习了 `console.time` 和 `console.timeEnd` 方法的基础知识，还学习了 JSLint 以及它如何提高我们的 JavaScript
    性能。在下一章中，我们将快速查看 JSLint，并通过将其集成到构建系统中来亲手实践！


    **[35]**


    ## 理解 JavaScript 构建系统


    在本章中，我们将学习 JavaScript 构建系统以及它们在 JavaScript 性能测试和部署方面的优势。我们还把利用在上一章中学到的关于 JSLint
    的知识，将 JavaScript 代码测试集成到我们的构建系统中。


    简而言之，我们将在本章中涵盖以下主题：


    - 什么是构建系统？

    - 设置我们的构建系统

    - 创建发布版本（distribution）


    ### 什么是构建系统？


    通常，**构建系统**是一个协助开发者编写整洁优化代码的自动化过程。我们可能认为这种东西在所有编程语言中都是标准配置。现在，编译型语言通常有一个编译器；**编译器**读取遵循语言规范编写的程序，并创建与目标机器兼容的输出代码。


    *理解 JavaScript 构建系统*


    **[36]**


    ### 通过示例编译代码


    当代码文件被发送进行处理时，编译器通常会根据规范进行工作。为了防止编译器因错误代码而崩溃，编译器设置了许多错误检查器，这些检查器会提前停止编译器并显示警报，从而阻塞编译过程。现在某些
    IDE 允许你在尝试运行代码之前查看一些错误。下面的截图显示了一个在编辑时正在检查的简单 Xcode Swift 文件：


    ![](img/1005cbc7df81f2054919decd848f91da_54_0.png)


    在不涉及过多 iOS 开发技术细节的情况下下，我们可以看到，在 Swift 中为常量变量赋值时，如果我尝试像上一个截图那样更改该变量，我的代码会标记一个错误。


    现在，如果我将 `let authors_name` 常量更改为动态 `var` 变量（就像在 JavaScript 中一样），错误本身就消失了，如下所示所示，并移除了
    IDE 中显示的错误：


    *第3章*


    **[37]**


    ![](img/1005cbc7df81f2054919decd848f91da_55_0.png)


    ### JavaScript 构建系统中的错误检查


    在过去，像 Dreamweaver 这样用于 JavaScript 和 HTML 内容的 HTML器自早期网页代码编辑器诞生以来就在做此了。


    在 Xcode 中对编译型语言所的操作与在 JavaScript IDE 中所的操作之间略有不同。对于编译型语言，在代码文件运行之前必须修复错误；这通常被认为是静态类型检查。然而，JavaScript
    即使在被 `try-catch` 块覆盖的情况下也可以带错误运行。简单来说，正如*第2章**使用 JSLint 提高代码性能*中所述的，JavaScript
    是一种解释型语言，也是*唯一*一种在运行时真正进行错误测试的语言。


    考虑到这一点，Dreamweaver、WebStorm 或 Visual Studio 等编辑器又是如何检查错误的呢？嗯，如果你还记得在*第2章**使用 JSLint
    提高代码性能*中，我们看到过 lint 工具如何对 JavaScript 代码中潜在或可验证的 bug 提供反馈；这会返回一个错误列表。


    在 IDE 中，编辑器的编写就考虑了这一点，并获取每个错误，并在 JavaScript 文件中相关的行和列处显示它。


    *理解 JavaScript 构建系统*


    **[38]**


    因此，为了制作构建系统，我们需要引入这种错误检查，就像使用 http://jslint.com/ 一样，但方式要更加自动化。这允许轻量级编辑器使用与更昂贵、更重的
    IDE 相同的检查工具。


    ### 在编码标准之外添加优化


    就像本章早些的 Xcode 示例一样，我们希望最终输出针对我们的项目进行优化；为了实现这一点，我们将在构建系统中添加代码压缩（minification），允许我们保持开发者版本或源项目保存在目录中，而在另一个目录中保存发布版本。简单来说，代码压缩允许我们压缩
    JavaScript 代码，从而使 Web 应用程序下载更快、运行更高效。


    如果我们使用版本控制来维护项目，这会有帮助，允许我们快速获取一个优化过的但不易调试的稳定发布版本，并使用源目录的文件对其进行调试。


    现在作为 JavaScript 开发者，我们甚至可以添加项目所需的其他代码压缩构建选项，例如为项目的图像目录添加图像优化器，或者压缩我们的 CSS 文件并在
    JavaScript 文件的顶部添加信息注释块。通过压缩 JavaScript，JavaScript 解释器就不需要猜测代码中空白字符的距离，从而创建出更高效、性能代码。


    ### 使用 Gulp.js 从零开始构建构建系统


    现在我们已经介绍了构建系统以及使用它们的原因，让我们创建一个简单的构建系统吧。我们的目标是从源目录创建一个发布构建，这是一个经过优化并准备好用于生产的副本。我们还将像从上一章中学的那样集成
    JSLint，以检查代码中可能被遗漏的任何问题。


    *第3章*


    **[39]**


    在本章中，我们将创建一个构建系统来测试我们的 JavaScript 项目。我们还把代码压缩集成到构建系统中，并将文件复制到我们的构建目录。这样当我们准备好部署时，我们的代码库已经准备好部署了。


    在启动这个项目之前，我们需要了解一些 JavaScript 特有的技术，特别是我们想要考虑的构建系统；我们将特别处理如 Node.js、NPM、Grunt
    和 Gulp 等技术。如果你以前只是听过这些，或者可能尝试过其中一些但从未深入过，不要担心；我们将一个一个介绍这些内容，并理解它们的优缺点。


    ### Node.js


    **Node.js** 是适用于你操作系统的 JavaScript 解释器。对于 JavaScript 开发者来说，JavaScript 代码像 Java
    或 C# 一样作为后端代码库可能看起来很奇怪，但已被证明可以用新的创意方式工作。例如，Node.js 开发者社区已经创建了插件，用于为桌面创建自定义的基于
    JavaScript 的应用程序。


    这让 JavaScript 进入了一个非常新的位置。当传统应用程序开发者抱怨 JavaScript 时，主要抱怨之一是 JavaScript 无法读取或写入硬盘上的文件，而这通常是编程语言的一个非常基础的功能。Node.js
    允许自定义对象与操作系统交互。这些包括 FS 或 FileSystem 等对象，它们允许读取和写入文件，并且工作方式与浏览器中的控制台非常相似。


