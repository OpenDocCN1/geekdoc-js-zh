    ## [149]

    # 为 iOS 混合应用优化 JavaScript


    在本章中，我们将介绍为 iOS 网页应用（也称为混合应用）优化 JavaScript 的过程。我们将探讨在设备浏览器和独立 App 的 WebView（网页视图）中调试和优化
    JavaScript 以及页面性能的常用方法。


    此外，我们还将查看 Apple Web Inspector（Safari 检查器），并学习如何将其用于 iOS 开发。最后，我们对对构建混合应用会有一些了解，并学习有助于更好地为
    iOS 构建以 JavaScript 为核心的应用的工具。此外，我们还将学习一个可能进一步我们提供帮助的类。


    在本章中，我们将学习以下主题：


    - 为 iOS 开发做准备

    - iOS 混合开发


    ## 为 iOS 开发做准备


    在开始本章的 Xcode 示例并在本关于 JavaScript 性能的书中中使用 iOS 模拟器之前，我将展示一些原生代码，并使用本课程未涵盖的工具。无论什么种平台，移动应用开发本身都是一门学问。在介绍
    iOS 项目的构建时，我将简要介绍设置项目以及编写*非 JavaScript* 代码的过程，以便将我们的 JavaScript 文件放入混合 iOS WebView
    中进行开发。由于 iOS 安全其基于 HTML5 的应用的方式，这一点至关重要。使用 HTML5 的 iOS 应用可以从服务器或直接从 App 进行调试，只要应用项目在主机系统（即开发者的机器）上以调试设置进行构建并部署即可。


    *为 iOS 混合应用优化 JavaScript*


    ## [150]


    不要求本书读者从一开始就知道如何从头到尾构建原生应用。这完全可以接受，因为你可以复制、粘贴并跟随我的步骤操作。但我将向你展示代码以达到测试 JavaScript
    代码节点，且所使用的代码将是渲染你的内容最小且最快的。


    所有这些代码示例将以某种 Xcode 项目解决方案的形式托管在 Packt Publishing 网站上，但如果你想在这里跟进，而不依赖代码示例，它们也会在这里显示。话虽如此，让我们开始吧……


    ## iOS 混合开发


    Xcode 是 Apple 提供的用于为 iOS 设备和 Macintosh 系统的桌面设备开发应用的 IDE。作为一个 JavaScript 编辑器，它的功能相当基础，但
    Xcode 主要应该作为 JavaScript 开发者项目工具集的补充使用。它为 JavaScript、HTML 和 CSS 提供基础的代码提示，但仅此而已。


    要安装 Xcode，我们需要从 Mac App Store 开始安装过程。Apple 近年来已将其 IDE 移动到 Mac App Store，以便为开发者提供更快的更新，随后更新
    iOS 和 Mac 应用的应用。安装非常简单；只需在 Mac App Store 中登录你的 Apple ID 并下载 Xcode；你可以在顶部搜索它，或者如果你在右侧栏的热门免费下载中查看，可以找到
    Xcode Mac App Store 页面的链接。到达此处后，点击如下截图所示的**Install**（安装）：


    *第 9 章*


    ## [151]


    ![](img/1005cbc7df81f2054919decd848f91da_169_0.png)


    *为 iOS 混合应用优化 JavaScript*


    ## [152]


    重要的是，为了本章的简单起见，我们不会将应用部署到设备；所以如果你对此好奇，你需要积极加入 Apple 开发者计划（Apple Developer Program）。费用为每年
    99 美元，或者 299 美元的企业级许可，该许可允许在 iOS App Store 控制之外部署应用。


    如果你好奇了解更多关于部署到设备的知识，假设你那边已设置好证书，本章中的代码将在设备上运行。有关此的更多信息，请查看 Apple iOS 开发者中心在线文档：https://developer.apple.com/library/ios/documentation/IDEs/Conceptual/AppDistributionGuide/Introduction/Introduction.html#//apple_ref/doc/uid/TP40012582。


    一旦安装完成，我们可以打开 Xcode 并查看 iOS 器；我们可以通过点击 **Xcode**，然后点击 **Open Developer Tool**（打开开发者工具），最后点击
    **iOS Simulator**。第一次打开 iOS Simulator 时，我们将看到一个看似 iOS 设备的模拟，如下一截图所示。注意，这是一个模拟，*而不是*真实的
    iOS 设备（即使它感觉很接近）。


    ![](img/1005cbc7df81f2054919decd848f91da_170_0.png)


    对于在 App 外处理本地 HTML 文件的 JavaScript 开发者来说，一个巧妙的技巧是他们快速拖放 HTML 文件。由于由于，模拟器将打开 Safari
    的移动版（iPhone 和 iPad 的内置浏览器），并像在 iOS 设备上那样的渲染页面；这对于在将页面部署到网络服务器之前测试它们非常有帮助。


    *第 9 章*


    ## [153]

    ## 设置简单的 iOS 混合应用


    内置混合应用上的 JavaScript 性能可能比在 Safari 移动版运行相同的页面慢得多。为了测试这一点，我们将使用 Apple 的新编程语言 **Swift**
    构建一个简单的网页浏览器。Swift 是一种适用于 iOS 的语言，JavaScript 开发者应该感到亲切。


    Swift 本身遵循与 JavaScript 类似的语法，但与 JavaScript 不同，变量和对象可以赋予类型，允许更强大、更准确的编码。在这方面，Swift
    遵循的类似于 *ECMAScript 6* 和 *TypeScript* 编码实践的语法。如果你正在查看这些新语言，我鼓励你也查看 Swift。


    现在让我们创建一个简单的网页视图，也称为 **UIWebView**，它是用于在 iOS 应用中创建网页视图的类。首先，创建一个新的 iPhone 项目；我们使用
    iPhone 以保持应用简单。打开 Xcode 并选择 **Create new**（新建）**Xcode project**（Xcode 项目）；然后，如下截图所示，选择
    **Single**（单个）**View Application**（视图应用程序）选项并点击 **Next**（下一步）按钮。


    ![](img/1005cbc7df81f2054919decd848f91da_171_0.png)


    *为 iOS 混合应用优化 JavaScript*


    ## [154]


    在向导的下一个视图中，将产品名称设置为 JS_Performance，语言设置为 **Swift**，设备设置为 **iPhone**；组织名称应根据你在操作系统中的帐户名称自动填充为你的名称。组织标识符（Organization
    identifier）是我们应用的反向域名唯一标识符；这可以是任何你认为合适的值。为了教学目的，这里是我的设置：


    ![](img/1005cbc7df81f2054919decd848f91da_172_0.png)


    设置好项目后，点击 **Next** 按钮并保存到你选择的文件夹，同时取消勾选 **Git repository**（Git 仓库）。完成后，在左侧面板的
    **Project Navigator**（项目导航器）中选择 **Main.storyboard**。我们现在应该处于 storyboard 视图了。打开
    **Object Library**（对象库），它可以在右下面板中带有圆内正方形图标的子标签页中找到。


    *第 9 章*


    ## [155]


    在右下角的 **Object Library** 搜索栏中搜索 Web View，然后将其拖到代表我们 iOS 视图的正方形视图上。


    ![](img/1005cbc7df81f2054919decd848f91da_173_0.png)


    在使用 Swift 链接 HTML 页面之前，我们需要考虑另外点：我们需要设置约束，因为原生 iOS 对象将被拉伸以适应各种 iOS 设备窗口。为了填充空间，你可以通过选择
    **UIWebView** 对象并在 Mac 键盘上按下 *Command* + *Option* + *Shift* + *= 来添加约束。现在你应该看到
    UIWebView 周围短暂地出现一个蓝色框。


