    ## Chapter 3


    [49]


    Like Grunt, Gulp also has a plugin reference page found at http://gulpjs.com/plugins/,
    and shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_67_0.png)


    ### Installing Gulp


    To install Gulp, we will open our terminal and type the following into our prompt:


    **sudo npm install --global gulp**


    ### Understanding JavaScript Build Systems


    [50]


    This will install Gulp globally to our Node.js and NPM resource path. If we are
    running a Windows system, sudo isn''t in Windows''s Shell, so we will need to
    run the Command Prompt as Administrator. Now, if everything is successful, we
    should see a bunch of URL requests for files, and our Terminal should return to
    the prompt shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_68_0.png)


    With our global ("global" meaning installed for all folders in our system) dependencies
    for Gulp installed, we can install our developer dependencies, which allow our
    build system to be more portable when uploading to a source control. Essentially,
    these dependencies need to be in our root project file to enable our build system
    to run in our project directory.


    [51]


    We can do it by typing the following code into our Terminal (again, sudo for Mac/Linux
    users and **Run as Administrator** for Windows users):


    **sudo npm install --save-dev gulp**


    If successful, your bash prompt should show again, pulling many URL sources and
    installing them to your project''s node_modules directory under gulp as shown
    in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_69_0.png)


    ### Creating a gulpfile


    A gulpfile is a file that Gulp checks for to run a list of tasks at the root of
    our project directory. To create one, we will create a simple JavaScript file
    called gulpfile.js (note the case of the filename). Inside the file we are going
    to reference Gulp as a variable and create a default task, called Default.


    [52]


    This is the main task we need to run for every gulpfile.js; inside it, we can
    include other tasks or output log message, just like in a web browser. As a simple
    code example for a Gulp task is shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_70_0.png)


    ### Running a Gulp project


    Running a Gulp project is easy. In your project''s root directory, type gulp in
    the Terminal and press *Enter*. You should see the output in your terminal as
    shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_70_1.png)


    That''s nice. If we look at the fourth line of our Terminal''s output, we should
    see our output message as **Default task ran**. Good job! This is the same console.log
    message we created for our Default task in our gulpfile.js.


    So you may ask, How did all this help optimize the JavaScript code? Well, if you
    remember *Chapter 2*, *Increasing Code Performance with JSLint*, we used JSLint
    to review JavaScript code, make improvements, and optimize files. What if we could
    run that test tool, while copying files and minifying (or even testing minified
    code) through JSLint? Well, we can, and that''s the point of using build systems.


    With a build system, we are improving it and optimizing our code before modifying
    it, even before it is deployed out as a web application.


    [53]


    ### Integrating JSLint into Gulp


    Earlier, we talked about Gulp''s plugin page; well one of those plugins is a JSLint
    plugin, and the installation process is pretty easy. First, check out the JSLint
    plugin page found at https://www.npmjs.org/package/gulp-jslint/, and as shown
    in the following figure:


    ![](img/1005cbc7df81f2054919decd848f91da_71_0.png)


    So, in the same way we installed Gulp, we will run the npm command shown on the
    page, but will include sudo for administrator permissions and the -g command.
    This is a global flag to install JSLint to the full system, as follows:


    **sudo npm install -g gulp-jslint**


    Next, we will install the developer dependencies for our project, so again we
    will point to our root project directory in the Terminal and then type our npm
    command but with the -save-dev flag this time, as follows:


    **sudo npm install --save-dev gulp-jslint**


    [54]


    To verify the installation, we can check the node_modules folder in our project
    directory, and see the gulp-jslint folder, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_72_0.png)


    ### Testing our example file


    Now, our build system needs a source file, and I''ve written an example while
    adding it to a new src project directory created in Finder. I haven''t tested
    this yet, and it''s shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_72_1.png)


    [55]


    So we have a simple Toddler JavaScript class, and it displays messages based on
    the prototype functions called; it''s pretty basic and it does have some intended
    errors, so let''s find these. Let''s go back to gulpfile.js; I''ve updated it
    with some JSLint examples using the same common options enabled by us and mentioned
    in *Chapter 2*, *Increasing Code Performance with JSLint*. Take a look at the
    updated gulpfile.js file, shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_73_0.png)


    On lines 6 and 7, we can see conventions such as, gulp.src() and pipe(). The src
    function is a Gulp-specific function that sets the source file or files using
    a JavaScript array; the pipe function, which is also Gulp-related, allows us to
    create a list of tasks that will take the source files from gulp.src() and *pipe*
    them through our build system. Lines 5 to 19 here show a new gulp.task called
    JSLint. If we look at lines 9 to 12, we can see the same options used from JSLint.com;
    the option names can be found under JSLint Directives at the bottom of the page
    when we select different options on the page.


    [56]


    On line 22, we added an array after our *default* task, adding our *JSLint* task
    name into an array. We can add multiple tasks here, but for now we just need the
    lint task. Now let''s run the script and check our terminal.


    ![](img/1005cbc7df81f2054919decd848f91da_74_0.png)


    Excellent! The red lines shown in the terminal report errors with the script that
    gives us our lint feedback in the terminal and, as we can see, we forgot some
    common things such as using *use strict*, missing semicolons, and so on. So we
    can see how we can automate the process of testing our code during a build using
    Node.js and Gulp.


    ### Creating a distribution


    Saving the best part for last, let''s have Gulp handle minifying the JavaScript
    source code, copying the output to the dist folder, and then linting the output
    for testing. I''ve modified the ExampleScript.js file to fix most of the issues
    found earlier. Now we need to download a minification tool for Gulp called **Uglify**,
    available at https://www.npmjs.org/package/gulp-uglify. It''s a common minifier
    for JavaScript for Gulp-based projects; its installation is easy and follows the
    same procedure used for installing Gulp and JSLint for Gulp. The following command
    is used for installing the tool:


    **sudo npm install --save-dev gulp-uglify**


    [57]


    Now I''ve updated our gulpfile.js with a new minify task and added it to the array
    as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_75_0.png)


    Now, run Gulp in the Terminal window and notice the output (shown in the next
    screenshot); in the finder folder, you''ll see a brand-new minified file in the
    dist directory of your root project folder, while retaining your developer source
    and getting performance linting at the same time!


    ![](img/1005cbc7df81f2054919decd848f91da_75_1.png)

