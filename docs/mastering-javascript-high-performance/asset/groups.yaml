    *Hands off the DOM*


    [120]


    ## When to use the createElement function?


    Though the createElement function is slow, on occasion it can be more helpful
    in


    generating HTML through a complex layout, where a complex application generates


    many more elements than an innerHTML property can be styled to accommodate.


    If this is the case, this is done more for convenience and usability for the


    development team when modifying the element''s type rather than for updating a


    full string to fit the needs of the application. In any case, if you need to create
    HTML


    elements, the innerHTML property is always faster.


    ## Animating elements


    One of the more impressive uses of JavaScript came around the *Web 2.0* age of


    JavaScript while AJAX was gaining popularity; another interesting idea came about


    in the form of JavaScript animations. These are animations that are created by
    simply


    iterating over and over an element''s styles that are left- and top-positioned
    using a


    setInterval function, and then dismissing it after the element reached its end
    point.


    This allows the div to appear to tween or animate on the page itself.


    ## Animating the old-fashioned way


    Most JavaScript developers are familiar with doing animations using jQuery, the


    popular DOM manipulation library for JavaScript, using the animate function to


    create DOM animations. But, as we are talking about pure JavaScript in this book,


    let''s take a look at an example of how to build this from the ground up. Check
    out


    the code in the following screenshot:


    *Chapter 7*


    [121]


    ![](img/1005cbc7df81f2054919decd848f91da_139_0.png)


    In this example, I''ve simply created a WebKit-friendly animation using just


    JavaScript, (meaning this will only display properly in the Google Chrome and


    Apple Safari browsers). On line 7, we set up some basic styles including a black


    dot div element with the id set as dot.


    *Hands off the DOM*


    [122]


    Now on line 27 and 28, we declare the dot and i variables respectively. Then,
    on


    line 31, we create a variable called interval, which is actually a parameter passed
    to


    the setInterval function. In the case of this code, it''s for every millisecond,
    which


    is shown on line 38. Inside the setInterval function we increment the i variable''s


    count by 1, and update the position of the dot element. Finally, when the value
    of


    the i variable is strictly equal to 450, we dismiss our interval variable using
    the


    clearInterval function, which stops the setInterval function from processing


    any further. If we look at this, we can see a simple animation tween using pure


    JavaScript in our browser. This is shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_140_0.png)


    Now, you may think that creating a setInterval function in this manner may be


    a cause of concern, and you might be correct. Fortunately, we as developers now


    have an alternative when it comes to creating animations like this for our HTML5


    applications!


    ## Animating using CSS3


    Let''s rebuild this example using CSS3 and JavaScript only to trigger the animation.


    Again, we will simply style for WebKit-focused browsers, just for simplicity.
    Let''s


    take a look at the updated code sample shown in the following screenshot:


    *Chapter 7*


    [123]


    ![](img/1005cbc7df81f2054919decd848f91da_141_0.png)


    With this example, we can see that our JavaScript has much fewer lines, and that''s
    a


    good thing; it keeps our content styles purely CSS-based rather than styling content


    using JavaScript logic.


    Now, on the JavaScript side, we can see that we are using the same kind of


    Anonymous function on line 39, except that we are setting a timeout to trigger
    the


    dot element to add an active class property that triggers the animation in CSS3.


    This is shown on lines 19 through 30 in our example.


    *Hands off the DOM*


    [124]


    ## An unfair performance advantage


    In many code examples in this book, I''ve used console.time, and console.timeEnd


    to review performance, and this example is no exception. You may have noticed
    that


    I''ve wrapped each animation example in a time and timeEnd function to measure


    the processing time. As we can see in the following screenshot, it''s a bit one-sided:


    ![](img/1005cbc7df81f2054919decd848f91da_142_0.png)


    *Chapter 7*


    [125]


    As we can see in the preceding screenshot, the JavaScript processing time is roughly


    1,900 milliseconds, and the CSS3 animation is around 0.03 milliseconds. Now, before


    we conclude that the CSS3 method is better, we must bear in mind that we are using


    CSS3 only to render the page, and JavaScript is handling only the trigger of the


    animation. It''s still more efficient, but it should be noted that JavaScript
    handles


    less code.


    Now for newer browsers, this is the recommended way of building content


    animations given the performance improvements seen thus far, whether made by


    JavaScript or not. However, some projects require older browser support, where


    projects may not have access to CSS3 transitions and animations, or we''re upgrading


    a part of an application''s animation while still maintaining compatibility. Here''s
    one


    way of doing just that while using the same JavaScript-based animation as earlier:


    ![](img/1005cbc7df81f2054919decd848f91da_143_0.png)


    *Hands off the DOM*


    [126]


    Here we''ve modified our initial JavaScript example by updating the position of
    the


    dot element; however, we''ve added two CSS lines on lines 17 and 18. The first
    one is


    a -webkit-transform and translate3d property that only sets the element to not


    change position; in older browsers or non-webkit-focused browsers, this property


    will be ignored. But here it''s simply setting the position of the element to
    its initial


    position, which sounds silly, and in a way it is!


    What this really does is tell the DOM runtime that this needs to run as a unique


    graphics process; it also tells the **graphics processing unit** (**GPU**) on
    the browser''s


    device to draw this element fast! The same can be said for will-change, which
    is


    a similar property that does the same thing as the translate3d property with the


    exception that it''s not updating the position but simply telling the GPU to redraw


    this element at a very high rate and to expect it to change in the DOM. Now, this


    practice is called adding elements to a composite layer. We will get more into


    composite layers in *Chapter 9*, *Optimizing JavaScript for iOS Hybrid Apps*.
    But for now,


    this is what we are doing here; this way, newer browsers can still get some visual


    speed improvements using legacy JavaScript animations.


    ## Understanding paint events


    Paint events are DOM events that cause a web browser to paint the web page as
    the


    DOM is updated with JavaScript. For browsers with low memory, this can be a bit
    of


    issue as paint events take a sizable amount of processing and graphics rendering


    to show updates in large quantities.


    ## How to check for paint events?


    Typically, paint events can be found in your Web Inspector''s timeline view. Since


    paint events are displayed chronologically during a page''s execution in a web


    browser, these appear slightly differently in Chrome''s **Developer tools** options.


    *Chapter 7*


    [127]


    Open Chrome''s **Developer tools** options and click the drawer icon (it''s the
    icon


    next to the gear icon on the upper right of the **Developer tools** options).
    Next, open the


    **Rendering** tab in the drawer, and click **Show paint rectangles** option. Once
    that''s


    finished, refresh the page. We will see the page highlighted green in various
    areas as


    the page loads. These are paint events in action as they are loaded on screen.
    Here''s


    an example using our animation and showing paint rectangles enabled in Chrome''s


    **Developer tools** options:


    ![](img/1005cbc7df81f2054919decd848f91da_145_0.png)

