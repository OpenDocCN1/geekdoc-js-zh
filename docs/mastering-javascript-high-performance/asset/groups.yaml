    *Hands off the DOM*


    **[ 128 ]**


    ## Testing paint events


    To test this, we''ve set up a JavaScript animation with a built-in bug as shown
    here:


    ![](img/1005cbc7df81f2054919decd848f91da_146_0.png)


    Much of this should seem pretty similar to earlier animations we''ve built in
    this chapter. But if we take a look at lines 35 through 38, we can see that we
    have a conditional else if statement checking to see if our increment variable
    i is within the 250-258 range count; if so, the left style is removed from the
    dot element.


    When we run this, we should encounter a flicker right the animation hits this
    point. We can verify whether this is truly a JavaScript issue by enabling continuous
    page repainting in Chrome''s **Developer tools**.


    *Chapter 7*


    **[ 129 ]**


    To do this, open the **Developer tools** options, open the drawer, and click the
    **Rendering** tab in the drawer. Then we can check the **Enable continuous page
    repainting** and **Show paint rectangles** options. When we do this, our web page
    should show a green overlay and display an information box in the upper right
    of our browser window. This is shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_147_0.png)


    Now, when we reload the page and the animation is replayed, our dot element should
    show a green box drawn around it during the whole animation this time. This is
    Chrome forcing the page to constantly redraw as the animation updates. As we can
    see, the box is still on the dot even when we hit our premade bug, indicating
    a JavaScript issue. If this was a true paint issue, the box would disappear when
    a redraw issue occurs.


    **Pesky mouse scrolling events**


    Paint events (or a lack thereof) are not the only issues when it comes to web
    application performance when you''re working with JavaScript. Scrolling events
    applied to a browser window or document can cause havoc on an application; it''s
    never a good idea to continuously trigger events by scrolling a mouse, let alone
    multiple events.


    *Hands off the DOM*


    **[ 130 ]**


    If we''re coding an application, we know whether our application has one or many
    events added. But if we are handed a web application to update, there is a tool
    in Chrome''s **Developer tools** that lets us visually check for scroll events.


    Let''s create a quick example to show how this feature works and what it looks
    for when trying to optimize the DOM interface. For this, I''ve created a mousewheel
    event that will capture the *X* and *Y* coordinates of a mouse pointer''s position
    with respect to the page, and print that to an input field with an id set as txtfield;
    it will trigger every time I move the mouse wheel. Let''s take a look at the following
    code sample:


    ![](img/1005cbc7df81f2054919decd848f91da_148_0.png)


    We can see here that the page itself is pretty light but, on line 23, we can see
    the mousewheel event listener in play adding a continuous event using the getMouseLocation
    function on line 26. Then on line 27, our input field with an id of txtfield is
    assigned a string with the mouse event information, grabbing the mouse pointer''s
    X and Y coordinates and applying it to the value of txtfield. Now let''s see **Developer
    tools** highlight performance issues with scrolling.


    Open up the drawer, open the **Rendering** tab, and then click **Show potential
    scroll bottlenecks**. This will highlight the block areas that have scroll events
    assigned in JavaScript; here''s what our example looks like with the filter enabled:


    *Chapter 7*


    **[ 131 ]**


    ![](img/1005cbc7df81f2054919decd848f91da_149_0.png)


    Now, this by itself isn''t too bad when it comes to performance, but applications
    with multiple mouse movement events can potentially cause issues, even more so
    if the movement areas overlap. If we add the same event listener to the text area
    and remove the listener from the document, will we see multiple instances of the
    scroll listener showing in our **Developer tools** filter? Let''s find it out
    by looking at the output of the final example file for this chapter, 07_08.html:


    ![](img/1005cbc7df81f2054919decd848f91da_149_1.png)


    *Hands off the DOM*


    **[ 132 ]**


    Nope! As we can see, even when a mousewheel event is enabled on a single element,
    the entire page becomes highlighted. As the mousewheel event can be checked at
    the top of the DOM, the whole page is affected even if an application focuses
    only on one small element for a mousewheel event.


    **Summary**


    In this chapter, we covered how JavaScript can affect the DOM''s performance;
    we reviewed the createElement function and learned how to better write our JavaScript
    to optimize generating elements from code.


    We also reviewed JavaScript animations, and compared their performance to modern
    CSS3 animations. We also learned how to optimize existing or legacy JavaScript
    animations.


    Lastly, we reviewed paint events in the DOM and saw how the DOM redraws its content
    after JavaScript manipulates it; we also covered mousewheel events and saw how
    they can potentially slow down the DOM.


    In the next chapter, we will take a look at JavaScript''s new best friend for
    performance: *web workers*, and how we can make JavaScript perform like a multithreaded
    application.


    **[ 133 ]**


    ## Web Workers and Promises


    In the previous chapters, we addressed some common performance issues while dealing
    with common JavaScript issues that come up in general JavaScript development.
    Now, we come to the point where, assuming that our projects can support newer
    JavaScript features, we can make our code perform even better than before.


    This is where web workers and promises come into play. In this chapter, we will
    take a look at both and see how and when to use them. We will also discover their
    limitations and understand their benefits in terms of high-performance JavaScript.


    **Understanding the limitations first**


    Before diving into web workers and promises, we need to understand a concern with
    the JavaScript language itself. As mentioned in past chapters, JavaScript is single-threaded
    and cannot support two or more methods running at the same time. For many years,
    we as JavaScript developers never really had to concern ourselves with threading,
    let alone the JavaScript memory issues that we have covered in the course of this
    book. Most of our code existed inside a browser, and ran on the same page either
    inline, or linked externally to a file on the same server, for basic webpage functionality.


    As the Web moves forward, with originally frontend coding becoming more and more
    necessary for high-performing applications, newer ways of handling larger JavaScript
    applications are needed. Today, we consider these newer features as a part of
    the *ECMAScript 5* feature set.


    In ECMAScript 5, many of these features were rolled into what many consider to
    be the HTML5 stack. This stack consists of HTML5 (the DOCTYPE and HTML tags),
    CSS version 3.0, and ECMAScript 5.


    *Web Workers and Promises*


    **[ 134 ]**


    These technologies make the Web much more powerful than the days of AJAX and XHTML
    development. The limitation is that these features are cutting-edge and may or
    may not work with every browser. So, using these newer features usually requires
    a bit for forethought before their implementation in a project.


    We''ve talked about some of these features since *Chapter 2*, *Increasing Code
    Performance with JSLint*, including the use strict statement, which forces the
    browser to throw an error if something in JavaScript isn''t strictly written or
    coded correctly. Now you may ask why we are using the use strict statement if
    it isn''t supported in all browsers. The trick with the use strict statement is
    that, when it''s coded for an older browser, it shows up as a string and is ignored.


    This is a great thing because, even if it is ignored in older browsers, we can
    still use this newer feature and write more efficient code. Unfortunately, that
    doesn''t translate to all features in ECMAScript 5; this includes web workers
    and promises.


    So in this chapter, let''s keep in mind that henceforth, while working with code
    samples, we need to focus our testing and coding on a newer browser such as Google
    Chrome, Opera, Firefox, or Apple''s Safari, and even newer versions of Internet
    Explorer that follow the same standards.


    **Web workers**


    Web workers give JavaScript developers like us a way to build multi-threaded JavaScript
    applications; this works in newer browsers as we have an object called a **worker**.
    A worker object is simply an external JavaScript file that we pass logic to. Now,
    this may seem a little odd. Haven''t we worked with external JavaScript files,
    since the beginning of JavaScript? Fair enough, but web workers are a bit new
    in terms of how a browser handles the execution of files in the DOM. Let''s take
    a look at the following sample diagram on how a browser reads a file:


    ![](img/1005cbc7df81f2054919decd848f91da_152_0.png)

