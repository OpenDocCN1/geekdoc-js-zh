    *Optimizing JavaScript for iOS Hybrid Apps*


    **[156]**


    Lastly, we need to connect our **UIWebView** to our Swift code; for this, we need
    to open the **Assistant Editor** by pressing *Command* + *Option* + *Return* on
    the keyboard.


    We should see **ViewController.swift** open up in a side panel next to our **Storyboard**.


    To link this as a code variable, right-click (or option-click the **UIWebView**
    object) and, with the button held down, drag the **UIWebView** to line number
    12 in the **ViewController.swift** code in our **Assistant Editor**. This is shown
    in the following diagram:


    ![](img/1005cbc7df81f2054919decd848f91da_174_0.png)


    Once that''s done, a popup will appear. Now leave everything the same as it comes
    up, but set the name to webview; this will be the variable referencing our UIWebView.
    With that done, save your Main.storyboard file and navigate to your ViewController.swift
    file.


    Now take a look at the Swift code shown in the following screenshot, and copy
    it into the project; the important part is on line 19, which contains the filename
    and type loaded into the web view; which in this case, this is index.html.


    *Chapter 9*


    **[157]**


    ![](img/1005cbc7df81f2054919decd848f91da_175_0.png)


    Now obviously, we don''t have an index.html file, so let''s create one. Go to
    **File** and then select **New** followed by the **New File** option. Next, under
    **iOS** select **Empty Application** and click **Next** to complete the wizard.
    Save the file as index.html and click **Create**. Now open the index.html file,
    and type the following code into the HTML page:


    <br />Hello <strong>iOS</strong>


    Now click **Run** (the play button in the main iOS task bar), and we should see
    our HTML page running inside our own app, as shown here:


    ![](img/1005cbc7df81f2054919decd848f91da_175_1.png)


    *Optimizing JavaScript for iOS Hybrid Apps*


    **[158]**


    That''s nice work! We built an iOS app with Swift (even if it''s a simple app).
    Let''s create a structured HTML page; we will override our Hello iOS text with
    the HTML shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_176_0.png)


    Here, we use the standard console.time function and print a message to our UIWebView
    page when finished; if we hit **Run** in Xcode, we will see the Loop Completed
    message on load. But how do we get our performance information? How can we get
    our console.timeEnd function code on line 14 on our HTML page?


    ### Using Safari Web Inspector for JavaScript


    **performance**


    Apple does provide a Web Inspector for UIWebViews, and it''s the same inspector
    for desktop Safari. It''s easy to use, but has an issue: the inspector only works
    on iOS Simulators and devices that have started from an Xcode project. This limitation
    is due to security concerns for hybrid apps that may contain sensitive JavaScript
    code that could be exploited if visible.


    *Chapter 9*


    **[159]**


    Let''s check our project''s embedded HTML page console. First, open desktop Safari
    on your Mac and enable developer mode. Launch the **Preferences** option. Under
    the **Advanced** tab, ensure that the **Show develop menu in menu bar** option
    is checked, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_177_0.png)


    Next, let''s rerun our Xcode project, start up iOS Simulator and then rerun our
    page. Once our app is running with the **Loop Completed** result showing, open
    desktop Safari and click **Develop**, then **iOS Simulator**, followed by **index.html**.


    *Optimizing JavaScript for iOS Hybrid Apps*


    **[160]**


    If you look closely, you will see iOS simulator''s UIWebView highlighted in blue
    when you place the mouse over **index.html**; a visible page is seen as shown
    in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_178_0.png)


    Once we release the mouse on **index.html**, we Safari''s **Web Inspector** window
    appears featuring our hybrid iOS app''s DOM and console information. The Safari''s
    **Web Inspector** is pretty similar to Chrome''s **Developer tools** in terms
    of feature sets; the panels used in the **Developer tools** also exist as icons
    in **Web Inspector**.


    *Chapter 9*


    **[161]**


    Now let''s select the **Console** panel in **Web Inspector**. Here, we can see
    our full console window including our Timer console.time function test included
    in the for loop. As we can see in the following screenshot, the loop took 0.081
    milliseconds to process inside iOS.


    ![](img/1005cbc7df81f2054919decd848f91da_179_0.png)


    ### Comparing UIWebView with Mobile Safari


    What if we wanted to take our code and move it to Mobile Safari to test? This
    is easy enough; as mentioned earlier in the chapter, we can drag-and-drop the
    index.html file into our iOS Simulator, and then the OS will open the mobile version
    of Safari and load the page for us.


    With that ready, we will need to reconnect Safari **Web Inspector** to the **iOS
    Simulator** and reload the page. Once that''s done, we can see that our console.time
    function is a bit faster; this time it''s roughly 0.07 milliseconds, which is
    a full .01 milliseconds faster than UIWebView, as shown here:


    ![](img/1005cbc7df81f2054919decd848f91da_179_1.png)


    *Optimizing JavaScript for iOS Hybrid Apps*


    **[162]**


    For a small app, this is minimal in terms of a difference in performance. But,
    as an application gets larger, the delay in these JavaScript processes gets longer
    and longer. We can also debug the app using the debugging inspector in the Safari''s
    **Web Inspector** tool. Click **Debugger** in the top menu panel in Safari''s
    **Web Inspector**. We can add a break point to our embedded script by clicking
    a line number and then refreshing the page with *Command* + *R*. In the following
    screenshot, we can see the break occurring on page load, and we can see our scope
    variable displayed for reference in the right panel:


    ![](img/1005cbc7df81f2054919decd848f91da_180_0.png)


    We can also check load times using the timeline. Click **Timelines** at the top
    of **Web Inspector** and now we will see a timeline similar to Chrome''s **Resources**.
    Note that after a few seconds, the timeline stops as well in Chrome''s Developer
    tools.


    *Chapter 9*


    **[163]**


    ![](img/1005cbc7df81f2054919decd848f91da_181_0.png)


    **Common ways to improve performance**


    With hybrid apps, we can use all the techniques we''ve learned in the past:

    - using a build system such as Grunt.js or Gulp.js

    - with NPM

    - using JSLint to better optimize our code

    - writing code in an IDE to create better structure for apps

    - using strings to apply HTML rather than creating objects for them


    *Optimizing JavaScript for iOS Hybrid Apps*


    **[164]**


    Sadly, the fact that hybrid apps do not perform as well as native apps still holds
    true. Now, don''t let that dismay you as hybrid apps do have a lot of good features!
    Some of these as follows:

    - they are (typically) faster to build than using native code

    - they are easier to customize

    - they allow for rapid prototyping concepts

    - they are easier to hand off to other JavaScript developers than finding a native
    developer

    - they are portable; they can be reused for another platform (with some modification)
    for Android devices, Windows Modern apps, Windows Phone apps, Chrome OS, and even
    Firefox OS

    - they can interact with native code using helper libraries such as Cordova*


    At some point, however, application performance will be limited to the hardware
    of the device, and it''s recommended you move to native code. But, how do we know
    when to move? Well, this can be done using **Color Blended Layers**. The **Color
    Blended Layers** option applies an overlay that highlights slow-performing areas
    on the device display, for example, green for good performance and red for slow
    performance; the darker the color is, the more impactful will be the performance
    result.


    Rerun your app using Xcode and, in the Mac OS toolbar for iOS Simulator, select
    **Debug** and then **Color Blended Layers**. Once we do that, we can see that
    our iOS Simulator shows a green overlay with the exception of the status bar elements,
    which take up more render memory as they overlay the web view and have to be redrawn
    over that object repeatedly.

