    About the Author


    **Chad R. Adams** is a mobile frontend architect, currently working at Intouch
    Solutions, where he looks at creative ways of building HTML5-driven content and
    native iOS, Android / Windows Runtime applications. He lives in Raymore, Missouri,
    with his wife, Heather, and son, Leo.


    In the past, Chad worked as a web developer for large websites, such as MSN.com,
    Ford.ca, Xbox.com, WindowsPhone.com, and Copia.com. He also speaks at developer
    conferences and groups in the Kansas City area on HTML5 and mobile development
    and is the author of *Learning Python Data Visualization*, *Packt Publishing*.


    You can contact Chad on LinkedIn (http://www.linkedin.com/in/chadradams), Twitter
    (@chadradams), or his website (http://chadradams.com).


    About the Reviewers


    **Yaroslav Bigus** is an expert in building cross-platform web and mobile applications.
    He has over 5 years'' experience in development and has worked for companies in
    Leeds and New York. He has used the .NET Framework stack to develop backend systems,
    JavaScript, AngularJS, jQuery, Underscore for frontends, and Xamarin for mobile
    devices.


    Yaroslav is working for an Israeli start-up called Tangiblee. He has reviewed
    *Xamarin Mobile Application Development for iOS*, *Packt Publishing*, written
    by Paul F. Johnson; *iOS Development with Xamarin CookBook*, *Packt Publishing*,
    written by Dimitris Tavlikos; and *Learning JavaScript Data Structures and Algorithms*,
    *Packt Publishing*, written by Loiane Groner.


    I am thankful to my friends and family for their support and love.


    **Andrea Chiarelli** has over 20 years'' experience as a software engineer and
    technical writer. In his professional career, he has used various technologies
    for the projects he was involved in, from C#, JavaScript, and ASP.NET to AngularJS,
    REST, and PhoneGap/Cordova.


    Andrea has contributed to many online and offline magazines, such as *Computer
    Programming* and *ASP Today*, and coauthored a few books published by Wrox Press.
    Currently, Andrea is a senior software engineer at the Italian office of Apparound,
    a mobile software company founded in the heart of Silicon Valley. He is a regular
    contributor to http://www.HTML.it, an Italian online magazine focused on web technologies.


    **Vishal Rajpal** is an experienced software engineer who started developing professional
    software applications in 2011. He has worked primarily on Java, Javascript, and
    multiplatform mobile application development, including PhoneGap and Titanium.


    Vishal is pursuing his master''s degree in computer science from Northeastern
    University, Seattle, and has worked on C, Java, and JavaScript. He lives in Seattle
    and can be contacted at vishalarajpal@gmail.com. You can also read more about
    his work at https://github.com/vishalrajpal/ and http://www.vishal-rajpal.blogspot.in.


    Vishal has also worked on books by Packt Publishing, such as *PhoneGap 3.x Mobile
    Application Development HOTSHOT* and *Learning Javascript, Data Structures, and
    Algorithms*.


