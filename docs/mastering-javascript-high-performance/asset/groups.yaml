    ## 第1章


    ## [ 15 ]


    ### 总结


    在本章中，我们回顾了 JavaScript 性能的历史，并了解了它如何成为开发者和企业的关注焦点。我们还回顾了四种 JavaScript 代码编辑器，现在我们理解了如何为新项目摒弃大型
    IDE，转而使用轻量级编辑器来处理小规模的更新和改动工作。


    在下一章中，我们将探讨在使用轻量级编辑器时，如何保持代码性能的高水准。


    ## [ 17 ]


    ### 使用 JSLint 提高代码性能


    在本章中，我们将学习如何在 JavaScript 中确认性能修复，并将学习 JSLint。这里有两个非常出用的 JavaScript 验证和优化工具，我们将学习如何使用这两种工具，以及如何设置选项以获得最佳的代码性能优化结果。


    因此，我们本章将涵盖以下主题：


    - 检查 JavaScript 代码性能

    - 什么是 JavaScript 静态分析（linting）？

    - 使用 JSLint


    ### 检查 JavaScript 代码性能


    在开始讨论如何提高 JavaScript 性能之前，我们必须问自己一个棘手的问题：到底什么样的代码改进能提高 JavaScript 应用程序的运行？在 JavaScript
    开发的早期，许多性能改进主要是基于已知的 JavaScript 编码标准实现的，例如留意未声明就使用的全局变量、保持变量作用范围一致等，除了网站内部的视觉效果之外，并没有进行太多的验证。


    今天，我们已经了新的 API 来利用这个问题，并为代码的较小部分提供了解决方案。


    ## *使用 JSLint 提高代码性能*


    ## [ 18 ]


    ### 关于 console.time API


    为了解决这个问题，现代浏览器实现了新的控制台函数，称为 `console.time` 和 `console.timeEnd`。这两个函数的作用是允许开发者为
    `console.time` 和 `console.timeEnd` 函数指定一个标签，测量代码块在 `time` 和 `timeEnd` 实例之间运行所需的时间，最后在控制台中显示结果。


    让我们通过一个工作中的示例来看如何使用 `console.time()` 和 `console.timeEnd()`。在我们的 `02_01.js` 示例文件中，我们有一个简单的代码块，它在
    `for` 循环中使用 `new` 关键字创建了 100 个简单的 JavaScript 对象，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_36_0.png)


    ### 下载示例代码


    您可以从 http://www.packtpub.com 账户下载您购买的所有 Packt 书目的示例代码文件。如果您是在其他地方购买的这本书，可以访问 http://www.packtpub.com/support
    并注册，让文件直接通过电子邮件发送给您。


    ## *第2章*


    ## [ 19 ]


    正如第 5 行所示，我们调用了 `console.time` 函数，并在其参数中为我们的代码块指定了 `Loop` 标签的 100 个对象。然后我们在第 7
    行添加了 `NewObj` 对象构造函数。随后，我们在第 11 行有一个简单的 JavaScript `for` 循环，它创建了 100 个 `NewObj`
    构造函数的实例，并将第 13 行 `for` 循环中每个实例的值传递进去。最后，在第 16 行，我们使用 `console.timeEnd` 函数结束时间块，使用我们在时间实例开始时定义的相同标签。


    让我们在浏览器中尝试这段代码；我将使用 Google Chrome，但任何现代浏览器（如最新版本的 Firefox、Internet Explorer 或
    Safari）都应该是可以的。我们在浏览器的 URL 中打开 `about:blank`，以便拥有一个简单的测试环境，然后打开 Web 检查器或浏览器调试器，将代码片段粘贴到控制台中并按下
    *Enter* 键。


    这是我的浏览器中显示的结果：


    ![](img/1005cbc7df81f2054919decd848f91da_37_0.png)


    ## *使用 JSLint 提高代码性能*


    ## [ 20 ]


    如果我们在 `undefined` 之前查看 `console.time` 的输出，会看到 `Loop` 中是 100。因此，通过性能测试，我们可以看到调优代码会发生什么。这里是更新后的
    `02_01.js` 示例：


    ![](img/1005cbc7df81f2054919decd848f91da_38_0.png)


    ## *第2章*


    ## [ 21 ]


    ![](img/1005cbc7df81f2054919decd848f91da_39_0.png)


    ### 何时使用 console.time


    `console.time()` 方法允许开发者了解什么影响性能，什么不影响。使用 `console.time()` 时，结果可能会根据你使用的浏览器而有所。


    ### 什么是 JavaScript 静态分析（linting）？


    在讨论 JSLint 之前，我们需要泛泛讨论静态分析工具（linters），它们是什么以及如何影响性能。简单来说，lint 就是代码验证检查器。它允许开发者指向一个代码文件并检查从空格问题到纯代码错误的各种错误或潜在问题。


    静态分析工具通常接收文件内容并构建源码树。在 JavaScript 的情况下，这可以是全局变量、函数、原型、数组等对象。在创建树后，分析器将获取源码树的部分，并报告分析器编写时标记的任何内容。最后，在运行分析器之前标记的任何规则读取器或参数将查找任何要忽略选项并生成最终报告。


    ### 关于 JSLint


    JSLint 是一种 JavaScript 代码分析工具，由 Douglas Crockford 用 JavaScript 编写，他也帮助了 JSON 在软件开发中的普及。正如*第1章*，《速度的需求》中提到的，JSLint
    可以以多种方式使用。许多 IDE 具有超出代码编辑之外的功能；其中一些功能包括错误检查，在某些情况下，IDE 会使用 JSLint 的版本。


    ## [ 23 ]


    在本章中，我们将讨论如何使用官方 JSLint 在线网站 http://www.jslint.com 使用 JSLint，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_41_0.png)


