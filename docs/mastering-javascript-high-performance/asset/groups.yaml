    *Chapter 9*


    ** 165 **


    Let''s make a copy of our project and call it JS_Performance_CBL, and let''s update
    our index.html code with this code sample, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_183_0.png)


    Here, we have a simple page with an empty div; we also have a button with an onclick
    function called start. Our start function will update the height continuously
    using the setInterval function, increasing the height every millisecond. Our empty
    div also has a background gradient assigned to it with an inline style tag.


    CSS background gradients are typically a huge performance drain on mobile devices
    as they can potentially re-render themselves over and over as the DOM updates
    itself. Some other issues include listener events; some earlier or lower-end devices
    do not have enough RAM to apply an event listener to a page. Typically, it''s
    a good practice to apply onclick attributes to HTML either inline or through JavaScript.


    *Optimizing JavaScript for iOS Hybrid Apps*


    ** 166 **


    ** back to the gradient example, let''s run this in **iOS Simulator** and enable
    **Color Blended Layers** after clicking our HTML button to trigger the JavaScript
    animation.


    ![](img/1005cbc7df81f2054919decd848f91da_184_0.png)


    As expected, our div element that we''ve expanded now has a red overlay indicating
    that this is a confirmed performance issue, which is unavoidable. To correct this,
    we would need to remove the CSS gradient background, and it would show as green
    again. However, if we had to include a gradient in accordance with a design spec,
    a native version would be required.


    When faced with UI issues such as these, it''s important to understand tools beyond
    normal developer tools and Web Inspectors, and take advantage of the mobile platform
    tools that provide better analysis of our code. Now, before we wrap this chapter,
    let''s take note of something specific for iOS web views.


    **The WKWebView framework**


    At the time of writing, Apple has announced the WebKit framework, a first-party
    iOS library intended to replace UIWebView with more advanced and better performing
    web views; this was done with the intent of replacing apps that rely on HTML5
    and JavaScript with better performing apps as a whole.


    *Chapter 9*


    ** 167 **


    The WebKit framework, also known in developer circles as **WKWebView,** is a newer
    web view that can be added to a project. WKWebView is also the base class name
    for this framework. This framework includes many features that native iOS developers
    can take advantage of. These include listening for function calls that can trigger
    native Objective-C or Swift code. For JavaScript developers like us, it includes
    a faster JavaScript runtime called *Nitro*, which has been included with Mobile
    Safari since iOS6.


    Hybrid apps have always run worse than native code. But with the Nitro JavaScript
    runtime, HTML5 has equal footing with native apps in terms of performance, assuming
    that our view doesn''t consume too much render memory as shown in our color blended
    layers example.


    WKWebView does have limitations though; it can only be used for iOS8 or higher
    and it doesn''t have built-in Storyboard or XIB support like UIWebView. So, using
    this framework may be an issue if you''re new to iOS development. **Storyboards**
    are simply XML files coded in a specific way for iOS user interfaces to be rendered,
    while **XIB** files are the precursors to Storyboard. XIB files allow for only
    one view whereas Storyboards allow multiple views and can link between them too.


    If you are working on an iOS app, I encourage you to reach out to your iOS developer
    lead and encourage the use of WKWebView in your projects.


    For more information, check out Apple''s documentation of WKWebView at their developer
    site at https://developer.apple.com/library/IOs/documentation/WebKit/Reference/WKWebView_Ref/index.html.


    **Summary**


    In this chapter, we learned the basics of creating a hybrid-application for iOS
    using HTML5 and JavaScript; we learned about connecting the Safari Web Inspector
    to our HTML page while running an application in iOS Simulator. We also looked
    at Color Blended Layers for iOS Simulator, and saw how to test for performance
    from our JavaScript code when it''s applied to device-rendering performance issues.


    Now we are down to the wire. As for all JavaScript web apps before they go live
    to a production site, we need to smoke-test our JavaScript and web app code and
    see if we need to perform any final improvements before final deployment. This
    is discussed in the next chapter.


    ** 169 **


    ## Application Performance Testing


    In this book, we''ve covered various ways of increasing our JavaScript''s application
    performance at different stages of a project''s life cycle. This includes activities
    ranging from choosing a proper editor at various stages in a project''s lifespan,
    incorporating JavaScript linters to help proof our JavaScript before deployment
    to using build systems, and creating a deployment package or build separating
    final code from the developer-friendly code base.


    The real secret in crafting high performing JavaScript is not the amount of JavaScript
    knowledge in our heads, but knowing the key "pain points" of the language itself;
    some of these pain points are the for loops, object creation, not incorporating
    strict operators, timers, and so on. Moreover, this category also includes incorporating
    these tools to better check our code before it is deployed.


    Like all major web application projects, there is always some form of pre-flight
    check here, a final list of to-dos before a web application goes live. If we incorporate
    the tools covered in this book to this point, our JavaScript should be solid enough
    for deployment. But here, we will take it one step further.


    In this chapter, we are going to take a look at **Jasmine**, a JavaScript testing
    framework that will allow us to test our code in ways we haven''t realized yet.
    Unlike past linter tools such as, JSLint, these tests will rely on an application''s
    property types, and also on a concept we have yet to cover: unit testing in JavaScript.


    In short, we will be covering the following topics:


    - What is unit testing in JavaScript?

    - Unit testing with Jasmine


    *Application Performance Testing*


    ** 170 **


    ### **What is unit testing in JavaScript?**


    Unit testing, simply put, is an application framework or toolset designed to test
    JavaScript or the code of any other programming languages in a specific way that''s
    unique to any application. Unit tests typically cover error checking that doesn''t
    exist inside standard linters. They are designed to check for application-specific
    errors. In other programming languages, unit tests are typically designed to check
    a project''s classes and models, and to ensure that applications are running efficiently
    and correctly.


    Now JavaScript and unit-testing practices have never been associated well with
    one another, primarily due to the dynamic nature of JavaScript. Some factors that
    hamper their association include the many mistakes created unknowingly by developers,
    passing wrong values to variables that shouldn''t have specific variable type,
    assigning a string when an application''s object property requires a number, and
    so on.


    Moving forward, however, for client-side applications using JavaScript, whether
    they''re on the web in a web browser or hosted inside a mobile app''s web view,
    testing becomes more and more necessary. Now there are dozens of frameworks out
    there designed for JavaScript testing, but here, I will cover one in particular
    called Jasmine. Keep in mind that there are alternative testing frameworks such
    as Mocha or QUnit, but we will cover Jasmine as it doesn''t require third-party
    frameworks to run.


    ### **Unit testing with Jasmine**


    Jasmine is a JavaScript unit-testing framework; it allows us to write JavaScript
    without relying on external libraries such as jQuery. This is helpful for an application
    that requires a very tiny footprint in memory such as our JavaScript application
    in iOS, discussed in *Chapter 9*, *Optimizing JavaScript for iOS Hybrid Apps*.
    It also restricts the code to the code we''ve written, and there''s no bug due
    to a framework in a current build of another vendor''s library.

    '
