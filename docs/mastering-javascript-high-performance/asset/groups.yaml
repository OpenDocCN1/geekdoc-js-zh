    按钮下方看到一个错误列表，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_43_0.png)


    *使用 JSLint 提高代码性能*


    [ 26 ]


    另另这些剩余的错误：


    ![](img/1005cbc7df81f2054919decd848f91da_44_0.png)


    ### 检查错误


    在查看这些错误之前，让我们看看错误列表的底部；我们会看到一个错误：Stopping。（已扫描 52%）。这是一个警告，表示 JSLint 发现了太多错误，以至于
    JSLint 内部的分析工具直接放弃了检查。在查看 JSLint 消息时，记住这一点很重要；因为只有 52% 的代码被检查了，当我们修复它们后，可能会出现额外的错误。


    *第 2 章*


    [ 27 ]


    好了，既然我们已经理解了 JSLint 的局限性，让我们修复这些错误。在使用 JSLint 工作时，请从上到下处理错误列表，因此错误 1 是 Unexpected
    character ''(space)..。嗯，这意味着什么呢？解释一下，JSLint 对 JavaScript 文件中的空格方式*非常*挑剔。JavaScript
    解释器假设某些 JavaScript 对象和变量内部具有特定的间距。


    这个空格在代码中任何其他错误出现之前显示，我们可以假设此错误出现在任何代码出现之前，事实也如此。如果我们查看 02_03.js 文件，实际上第 4 行导致了问题，即注释表头与我们的
    my_count 全局变量之间的空格。


    ### 配置混乱的空白字符


    我们可以通过两种方式处理间距错误：我们可以逐行检查每个空格并纠正它，或者如果我们正在使用压缩器，我们可以告诉 JSLint 忽略空行和必要的行。要这样做，我们将导航到页面底部的
    **Options**（选项），并将 **messy white space**（混乱的空白字符）选项设置为 **true**。这将告诉 JSLint 忽略任何与代码解释没有相关的间距问题，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_45_0.png)


    *使用 JSLint 提高代码性能*


    [ 28 ]


    一旦将其设置为 **true**，我们会在选项下方看到一个新面板，称为 **JSLint Directives**（JSLint 指令）。**JSLint
    Directives** 面板提供了 JSLint 在执行验证器之前检查代码时传递的参数快速列表。如果我们尝试将此配置复制并粘贴到另一个 JSLint 实例中，例如构建系统……在这里看到指令非常有帮助，但稍后会介绍。


    在忽略混乱的空白字符后，我们可以对代码重新运行 JSLint 并看到更新后的错误列表，如下：


    ![](img/1005cbc7df81f2054919decd848f91da_46_0.png)


    现在，我们检查 JSLint 检测到了多少代码。这次，如果我们看最后一个错误，我们可以看到 JSLint 停止在 84% 处，这比以前好得多，但我们还可以做得更好。看看第一个新错误。在错误列表的顶部，我们可以看到错误显示
    ''my_count'' 在定义之前被使用。这是 **Errors**（错误）面板中的第 5 行第 1 个字符。


    *第 2 章*


    [ 29 ]


    这表明我们忘记在 my_count 变量之前声明 `var`，所以让我们按照如下所示所示更新它，在第 5 行的 my_count 上添加 `var`，然后重新运行
    JSLint。你可以参考练习文件中的更新版本 02_03_01.js：


    ![](img/1005cbc7df81f2054919decd848f91da_47_0.png)


    接下来，在用更新后的代码重新运行 JSLint 后，让我们看看接下来两行。第一行显示 Unexpected TODO comment。这非常直观；在 JSLint
    中，我们可以指定在 JavaScript 代码中允许 **TODO comments**（TODO 注释），这非常实用！让我们允许它吧，因为我们现在只是在
    JSLint 中改进代码，目前还没有完成文件。看看我高亮的选项，你可以在那里设置是否允许 TODO：


    ![](img/1005cbc7df81f2054919decd848f91da_47_1.png)


    我们现在将 **Options**（选项）面板中的 **TODO comments**（TODO 注释）设置为 **true**；接下，让我们看看剩余的错误。


    *使用 JSLint 提高代码性能*


    [ 30 ]


    ### 理解 use strict 语句


    所以，现在我们的 JSLint 错误列表中剩下这些内容，如下所示。我们看到的下一个错误是 Missing ''use strict'' statement..
    现在，如果你以前没有在 JavaScript 中见过 use strict 语句，我来解释一下：


    ![](img/1005cbc7df81f2054919decd848f91da_48_0.png)


    use strict 语句是向浏览器启用严格模式的提示。使用 use strict 的优点之一是它允许解释器运行更快。实现 strict 语句并不困难，我们可以这样在函数内部添加它：


    ![](img/1005cbc7df81f2054919decd848f91da_48_1.png)


    *第 2 章*


    [ 31 ]


    我们也可以通过在第一行上方添加来全局包含，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_49_0.png)


    让我们完成这些剩余的问题；在第 9 行，我们将添加 "use strict" 然后跟一个分号。我们的最终代码应该像下面：


    ![](img/1005cbc7df81f2054919decd848f91da_49_1.png)


    *使用 JSLint 提高代码性能*


    [ 32 ]


    ### 在 JSLint 中使用 console


    我们几乎完成了这段代码。然而，在执行它时我们得到了错误列表，其中第一行（看起来很奇怪）显示：''console'' 在定义之前被使用。JSLint 可以验证并非为浏览器设计的
    JavaScript；例如这是一个 Node.js 脚本。为了启用浏览器对象，我们需要在 JSLint **Options**（选项）面板中启用 **console,
    alert,** 和 **a browser** 选项；这些设置为 **true**，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_50_0.png)


    启用这些后，让我们重新运行脚本；剩余的错误应该是直观的。第一个错误抱怨我们应该将其与之前的 ''var'' 语句合并..我们可以移除 number1 和 number2
    变量，并直接赋值 my_count = 42;.


    最后，我们的 if 语句还可以改进。首先，JSLint 抱怨我们在 if 语句中使用松散条件（双等号进行比较）。如果我们使用三等号进行比较，我们也将比较类型。通过这样做，我们的代码运行速度将比以前更快。此外，if
    语句没有在条件代码周围包含大括号，这会减慢解释器的速度，所以让我们加上它们。我们的最终代码应该像下面：


    ![](img/1005cbc7df81f2054919decd848f91da_50_1.png)


