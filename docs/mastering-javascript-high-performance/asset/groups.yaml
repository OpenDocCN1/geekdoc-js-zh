    ![](img/1005cbc7df81f2054919decd848f91da_61_0.png)


    *理解 JavaScript 构建系统*


    **[44]**


    ### 在终端中检查 NPM 安装


    现在，为了检查我们的 NPM 安装，我们将直接调用 NPM，它应该返回已安装 NPM 模块的帮助目录。要做到这一点，只需打开终端并输入 `npm` 命令。现在，我们应该看到终端窗口填充了大量的
    NPM 帮助文档和示例终端命令，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_62_0.png)


    #### 使用 NPM 的基础


    学习使用 NPM 是一个很容易的过程。在为项目设置 NPM 之前，我们需要做的第一件事是创建一个项目根目录；我将第一个项目标记为 npm_01，但你可以用你喜欢的任何名称命名根目录。现在，我们将打开终端并更改我们的
    bash 目录以匹配我创建的目录路径。


    *第 3 章*


    **[45]**


    要在终端中更改工作目录，命令是 Change Directory 或 `cd`。使用 `cd` 非常简单；只需输入以下命令：


    **cd [~/path/to/project_dir]**


    这里需要注意的几点是，终端在 Mac 和 Linux 上始终指向你的用户目录，波浪号（~）是指向你路径的快捷方式。例如，如果你的文件夹在用户名下的文档目录下，使用
    `cd` 的示例路径是 `cd ~/Documents/[your_project_path]`。


    如果终端信息太杂，你可以使用 "clear" 命令清理终端内容，而无需更改目录。


    ### 使用 NPM 安装 jQuery


    一个常见的 JavaScript 库是 jQuery，它是 NPM 上一个非常流行的库。我们甚至可以在 npmjs.org 上查看它的仓库信息，地址为 https://www.npmjs.org/package/jquery。


    ![](img/1005cbc7df81f2054919decd848f91da_63_0.png)


    *理解 JavaScript 构建系统*


    **[46]**


    如果我们看这个页面，我们可以看到一个终端命令：`npm install jQuery`。所以，让我们在终端输入输入并按下 *Enter* 看看会发生什么。如果你是
    Mac 或 Linux 用户，你可以将文件夹拖入终端，在你输入 `cd` 命令后，它会自动为你写下文件夹的路径。


    在终端中，看起来下载了一些文件，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_64_0.png)


    现在，如果我们打开我们的项目目录，可以看到创建了一个名为 `node_modules` 的新文件夹。在这个文件夹内部，了另一个名为 `jquery` 的文件夹。jquery
    文件夹的内容如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_64_1.png)


    *第 3 章*


    **[47]**


    在 jquery 文件夹内部，有一些有趣的文件。我们有一个 `README.md` 文件（.md 是 markdown 的缩写，一种文本格式）来解释 jQuery。


    文件夹有两个 JSON 文件，一个叫 `bower.json`，另一个是 `package.json`。`package.json` 文件处理 NPM 信息，而
    `bower.json` 文件处理任何依赖包并通知 NPM 同样包含这些包。如果你好奇 `bower.json` 文件的作用，它本质上是从存储库更新源码的另一种方式。就像
    NPM 仓库一样，`bower.json` 使用自己的设置。


    最后，最重要的两个文件夹是 `src` 文件夹（源代码）和 `dist` 文件夹（发布目录）。这种文件结构是 NPM 的通用规范，项目的源码保存在 `src`
    文件夹中，而最终输出位于 `dist` 文件夹。由于我们不需要调试 jQuery 的源码，我们只需要关注 `dist` 文件夹，在那里我们可以找到 `jquery.js`
    文件和 `jquery.min.js` 文件——这是 jQuery 项目常用的库文件。我们将这些文件复制到我们构建系统的发布文件夹中。


    ### 设置我们的构建系统


    现在我们已经学习了 Node.js 和 NPM 的基础，让我们实际构建一个构建系统。我们将让终端指向我们的项目根目录，然后我们将安装我们的构建系统（也称为任务运行器）。


    #### 关于 Grunt.js 和 Gulp.js


    Grunt 最初设计用于自动化 JavaScript 和 Web 开发中的任务，由于其可用性，许多开发者创建了插件；你可以在如下所示的 Grunt 插件仓库中查看它们：


    ![](img/1005cbc7df81f2054919decd848f91da_66_0.png)


    #### 关于 Gulp


    Gulp 是另一个 Node.js 的构建系统；使用 Gulp 的优势是它是异步的，通常运行自动化任务的速度比 Grunt 快得多。由于这本书完全关于性能，我们将使用
    Gulp 作为构建系统的示例。这并不意味着 Grunt 是不好的；它也可以像 Gulp.js 一样创建构建系统，但可能没有 Gulp 快。


