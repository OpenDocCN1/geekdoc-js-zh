    ## Constructors, Prototypes, and Arrays


    [106]


    ### Alternate constructor functions using prototypes


    Here, we will learn about the concept of alternate constructor functions using
    prototypes.


    ### Understanding prototypes in terms of memory


    We''ve covered how to create instance functions inside a constructor, and we''ve
    also learned about scope inside one as well using the this keyword. But, there
    is one more thing to cover: the ability to append a constructor with another instance
    method outside the constructor, which is helpful in many ways. First, it allows
    us, as developers, to create functions outside the pre-written constructor if
    needed. Next, it also keeps our memory usage small. Before diving into this, let''s
    rework our constructor code to use prototypes, as shown in the next screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_124_0.png)


    *Chapter 6*


    [107]


    Now looking at this code updated, we can see that the constructor functions have
    been removed but pulled outside the constructor: they were then moved to prototypes
    of the AuthorName function using the same function names used earlier. Now, you
    can notice that, on lines 10 and 13, we can use this in our prototype function
    because we are referring our constructor''s instance to print that instance''s
    specific variables.


    ### Which is faster, a prototype or a constructor function?


    You may also notice that I''ve again added console.time and console.timeEnd functions
    to our function calls on lines 16 through 22. So do you think that prototypes
    will be faster or slower when compared to standard constructor functions? Well,
    here in the next screenshot we can take a look at the results:


    ![](img/1005cbc7df81f2054919decd848f91da_125_0.png)


    Wow, 4.2 milliseconds to fire the prototypes when compared with 2.1 milliseconds
    using constructor method; what happened here? We essentially created functions
    after the constructor. The output is slow, but this is to be expected with prototypes,
    as the intention is to append a constructor with a prototype.


    *Constructors, Prototypes, and Arrays*


    [108]


    At this point, we may think "Oh wow I never knew that, I should never code a prototype
    again!" Now, before we start deleting prototypes from our project files, I want
    to explain scalability with prototypes. It is true that prototypes, when called
    for a constructor function, can be slower… "*in the small*. What do I mean by
    in the small?" Well, for small uses of prototypes such as this particular example,
    we can see prototypes run slower than a traditional constructor method.


    Now here''s the rub; for larger projects, a constructor in a large-scale application
    may have 50 functions, 200 functions, and so on. When we call those larger constructors
    over and over, it gets pretty expensive in terms of memory just by calling the
    instance of a constructor since it has to read all the functions contained inside.
    By using prototype methods, those initial constructor calls are stored in memory
    once. For small uses of prototypes the performance benefits aren''t visible since
    we use the memory in-place as if we had a simple static function but, once it''s
    set up, it''s in memory and doesn''t have to be recalled or reprocessed like a
    static JavaScript function.


    One more thing about prototypical inheritance, though performance issues can arise
    from its use over static functions, it can be very helpful for large codebases.
    If a project has scope concerns or uses libraries that may cause conflicts, consider
    using a namespace. This works similar to prototype classes but function like simple
    static functions that prepend with a namespace to prevent conflict.


    ### Array performance


    We typically don''t think about arrays when dealing with performance, but it''s
    worth mentioning a few things here. First, large arrays can be messy and performance
    hogs when you''re trying to work with a large amount of data. Typically with arrays,
    we only need to worry about two things: searching and array size.


    *Chapter 6*


    [109]


    ### Optimizing array searches


    Let''s create an array that has a lot of values in it; here I''ve created an array
    called myArray which has 1001 values within, with a string value of key and the
    index of the array. You can grab the full version in the 06_09.js file inside
    the Chapter_6 folder of the example code on the Packt Publishing''s website. Here''s
    a part of the code sample of the total array:


    ![](img/1005cbc7df81f2054919decd848f91da_127_0.png)


    There are two ways to look up a value in an array; the first uses the indexOf()
    function, which is an array-specific function that looks up each value and returns
    the index of that searched value. The other way is to specify the index value
    directly, which returns the value (assuming we know the index of the value we
    need).


    *Constructors, Prototypes, and Arrays*


    [110]


    Let''s try an experiment where we are going to use a pre-made myArray of 1001
    values and iterate through them with the indexOf() function, and then again with
    just an array. We have appended the code after our myArray, and we''ve wrapped
    this code block in console.time and console.timeEnd functions, as shown here with
    the time rendered in Chrome **Developer tools**:


    ![](img/1005cbc7df81f2054919decd848f91da_128_0.png)


    This shows that our result for searching that large array was roughly 5.9 milliseconds.
    Now, for our comparison, I''m going to keep our indexFound variable even though
    we can simply specify the index of the array value we want. We will also search
    using the same index value, which is 541. Let''s update our code as shown here
    and view our results in Chrome **Developer tools**:


    *Chapter 6*


    [111]


    ![](img/1005cbc7df81f2054919decd848f91da_129_0.png)


    It looks like our results trim our index searching performance time by quite a
    bit. So, when you''re structuring arrays in JavaScript, only use indexOf if you
    need to and try to directly call the index if possible. So why was the time output
    so different? It''s simple; in this second example, we indicated the position
    of the array manually rather than having JavaScript look up the key on its own.
    This sped up the JavaScript interpreter as it iterated through our array and provided
    a value.


    *Constructors, Prototypes, and Arrays*


    [112]


    ### Summary


    In this chapter, we learned about the proper use of constructors. We learned about
    instances in JavaScript using the new keyword, and found that we can speed up
    static code with constructors while scoping our code at the same time.


    We learned about prototypes and how they scale well for large applications while
    adding little value for smaller projects. Finally, we also learned about searching
    arrays and about performance loss with arrays by using the indexOf function.


    In the next chapter, we are going to look at how to write our JavaScript to optimize
    our Document Object Model for our projects.


    [113]


    ## Hands off the DOM


    In this chapter, we will review the DOM in relation to writing high-performance
    JavaScript, and see how to optimize our JavaScript to render our web applications
    visibly faster.


    We will also take a look at JavaScript animations and test their performance against
    modern CSS3 animations; we will also test for paint redraw events in the DOM and
    quickly test for scrolling events attached to a page that may affect performance.


    We will cover the following topics in the chapter:


    - Why worry about the DOM?

    - Don''t we need a MV-whatever library?

    - Creating new objects using the createElement function

    - Animating elements

    - Understanding paint events

    - Pesky mouse scrolling events


    ### Why worry about the DOM?


    The **Document Object Model** (**DOM**) is how our HTML content is presented in
    our web browser. It''s not quite the same as the source code; the DOM is the live
    updated version of our source code as we make updates to a web application''s
    page in a web browser.


    We can say that fast, optimized JavaScript will certainly help our applications
    run and perform better, as we learned in previous chapters. But it''s important
    to understand that the DOM is just as important to JavaScript performance as understanding
    how to optimize a for loop.

