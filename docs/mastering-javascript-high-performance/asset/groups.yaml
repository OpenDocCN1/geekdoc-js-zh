    assuming that our view doesn''t consume too much render memory as shown


    in our color blended layers example.


    WKWebView does have limitations though; it can only be used for iOS8 or higher


    and it doesn''t have built-in Storyboard or XIB support like UIWebView. So, using


    this framework may be an issue if you''re new to iOS development. **Storyboards**


    are simply XML files coded in a specific way for iOS user interfaces to be rendered,


    while **XIB** files are the precursors to Storyboard. XIB files allow for only
    one view


    whereas Storyboards allow multiple views and can link between them too.


    If you are working on an iOS app, I encourage you to reach out to your iOS


    developer lead and encourage the use of WKWebView in your projects.


    For more information, check out Apple''s documentation of WKWebView at their


    developer site at https://developer.apple.com/library/IOs/documentation/


    WebKit/Reference/WKWebView_Ref/index.html.


    **Summary**


    In this chapter, we learned the basics of creating a hybrid-application for iOS
    using


    HTML5 and JavaScript; we learned about connecting the Safari Web Inspector to
    our


    HTML page while running an application in iOS Simulator. We also looked at Color


    Blended Layers for iOS Simulator, and saw how to test for performance from our


    JavaScript code when it''s applied to device-rendering performance issues.


    Now we are down to the wire. As for all JavaScript web apps before they go live


    to a production site, we need to smoke-test our JavaScript and web app code and


    see if we need to perform any final improvements before final deployment. This
    is


    discussed in the next chapter.'
