    ## Fixing our code


    With our test code working now, we can modify it to ensure this works properly.
    For this, we will need to update the 10_01.js file and the newCustomer data, which
    is on lines 56 through 63 in the 10_01.js file. Let''s review what went wrong
    with our sample customer data:


    - The first test that failed was 2, which required the customer''s name to be
    created as an object array, with the first name as an array item followed by the
    last name as the second item in the object array

    - The second that failed was test 3, which required the customerBalance to be
    a type of number

    - The third error was test 6, which required the customer''s marriage status to
    be a boolean and not a string


    Let''s update our newCustomer data; you can see that I''ve done that in the following
    screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_197_0.png)


    *Application Performance Testing*


    **[180]**


    Once we''ve updated the newCustomer information in our 10_01.js file, we should
    be able to rerun Jasmine and retest our code sample. If all tests pass, we will
    see the default **Spec List** showing all results in green; let''s reopen our
    page as shown in the following screenshot and see whether our tests pass:


    ![](img/1005cbc7df81f2054919decd848f91da_198_0.png)


    Nice, all six specs have passed! Great work! By ensuring that all our application''s
    data is using the correct type, we can also ensure that our JavaScript application
    is not only performing well but also performing with a high degree of accuracy,
    as it was intended to be used.


    *Chapter 10*


    **[181]**


    When applications deviate from the developers'' design, they can cause performance
    issues and affect the overall stability of the application. In Jasmine, we can
    see the completion time of the test; note that the performance on the final test
    is much faster than the one with errors. In the following screenshot, we have
    our final application page with no errors, as shown by **Developer tools** option
    in Chrome:


    ![](img/1005cbc7df81f2054919decd848f91da_199_0.png)


    *Application Performance Testing*


    **[182]**


    One final fact to note here is the different approaches that can be used by JavaScript
    developers. One is the **Test Driven Development** (**TDD**) approach, where we
    write our tests before writing our application code. Another way in which many
    JavaScript developers test applications is called **Behavior Driven Development**
    (**BDD**) approach. This works by writing app code first and then interacting
    with an app, which includes opening a popup and confirming that the code worked
    as intended. Both of these are valid methods to build applications, but for JavaScript
    applications, which use a bit of data that must be accurate, TDD is the way to
    go!


    ## Summary


    In this chapter, we covered the basics of unit testing JavaScript applications.
    We introduced Jasmine, a behavior-driven unit-testing framework for JavaScript.
    Together we created a real-world application that had no technical errors but
    was causing application issues.


    We reviewed how to read and write an application spec and how to write tests in
    Jasmine using the applications spec. We then ran our test against our code and
    quickly updated our customer data to reflect the spec, allowing our unit test
    to pass. Lastly, we learned that unit-testing our code improves our JavaScript
    performance, and also minimizes risk to our application.


