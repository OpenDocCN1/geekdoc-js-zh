    *Application Performance Testing*


    **[** **182** **]**


    One final fact to note here is the different approaches that can be used by JavaScript


    developers. One is the **Test Driven Development** (**TDD**) approach, where we
    write


    our tests before writing our application code. Another way in which many JavaScript


    developers test applications is called **Behavior Driven Development** (**BDD**)


    approach. This works by writing app code first and then interacting with an app,


    which includes opening a popup and confirming that the code worked as intended.


    Both of these are valid methods to build applications, but for JavaScript applications,


    which use a bit of data that must be accurate, TDD is the way to go!


    **Summary**


    In this chapter, we covered the basics of unit testing JavaScript applications.


    We introduced Jasmine, a behavior-driven unit-testing framework for JavaScript.


    Together we created a real-world application that had no technical errors but
    was


    causing application issues.


    We reviewed how to read and write an application spec and how to write tests


    in Jasmine using the applications spec. We then ran our test against our code
    and


    quickly updated our customer data to reflect the spec, allowing our unit test
    to pass.


    Lastly, we learned that unit-testing our code improves our JavaScript performance,


    and also minimizes risk to our application.'
