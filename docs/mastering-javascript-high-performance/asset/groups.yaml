    Lastly, our if statement could use some work. First, JSLint complains that we
    are


    using a loose conditional (a double equals for comparison) in our if statement.
    If


    we use triple equals for comparison, we compare the type as well. By doing this,


    our code will run the comparison faster than before. Also, the if statement doesn''t


    include brackets around the conditional code, and this can slow the interpreter


    down, so let''s add them. Our final code should resemble the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_50_1.png)'
