    ## 第 4 章

    ## 67

    ### 网络面板 (Network panel)


    **Network**面板显示了所有资源及其包含代码的页面下载速度。让我们通过访问 http://www.packtpub.com/ 并打开 **Network**
    面板（位于 **Elements** 面板的右侧）来测试一下。点击面板左上角的录制按钮，如下幅截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_85_0.png)


    现在，让我们在开启录制按钮的情况下刷新页面。我们可以看到网页中哪些资源加载耗时较长。在考虑在 JavaScript 中加载资源时，这一点非常重要。如果我们针对一个
    DOM 中尚不存在的元素或脚本，可能会发生错误。


    ### 检测性能


    ## 68


    如果我们看下面的屏幕，可以看到在 http://www.packtpub.com/ 上，blog-banner.png 图形的加载时间最长。


    ![](img/1005cbc7df81f2054919decd848f91da_86_0.png)


    我们也可以选择某个资源；点击其中一个图像资源。（我将选择 blog-banner.png，这在你的页面上可能存在也可能不存在。如果你是在首次加载时进行测试，请给网站留几秒钟加载）。当我们选择它时，可以看到一个新的子面板出现，如果是图形则会显示图像预览，如果是
    JavaScript 或 JSON 文件则会显示源代码。


    ## 69


    子面板中还有几个标签页，其中一个叫做 **Response**（响应）。它提供了 DevTools 找到的 POST 事件资源信息。我们还有一个名为 **Headers**（标头）的标签页。**Headers**标签显示了该文件的请求信息，包括（更重要的是）图像是否使用了任何服务器端缓存。在这种情况下，我们的
    blog-banner.png 文件具有 `Cache-control: max-age` 值，表示最大缓存时间为 3153600000 秒，即十年。我们还可以看到完整的
    Request URL，并注意到它正在使用 cloudfront.net 的 URL，因此我们可以推断该图像正在使用 Amazon S3 进行缓存和分发，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_87_0.png)


    ## 70

    ### 源代码面板 (Sources panel)


    在这里我们将通过以下方面来学习 **Sources** 面板：


    调试器基本用法


    **Sources** 面板是大多数 JavaScript 开发者的聚集地；它是我们调试 JavaScript 应用程序的地方。使用它非常简单；点击左上角靠近
    **Watch Expressions**（监视表达式）选项附近的暂停按钮，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_88_0.png)


    #### 测试调试器


    让我们尝试一下调试器。在 Packt Publishing 网站提供的代码包中，打开 `Exercise_Files` 文件夹下的 `Chapter_4`
    文件夹中的 `01` 文件夹。在里面我们可以我们可以看到一个简单的代码示例，还有一个 HTML5 `index.html` 页面，它在源代码视图中看起来如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_89_0.png)


    我们可以看到一个非常空的网页，并为 `body` 标签添加了一些样式；我们还添加了一个 `main.js` 外部 JavaScript 文件来处理我们所有的页面逻辑。我们在这里要做的是检查一个带有
    `while` 循环的函数。


    该循环使用 `paragraphTag` 变量追加 `document.body` 标签，每个标签都有一个名为 `index` 的变量，该变量在 `while`
    循环外被定义为全局变量 `my_integer`，该循环包含在 `loopingTo5k()` 函数中。它在第 14 行被调用，由 `window.onload`
    事件触发，如下一个显示 `main.js` 源代码视图的所示：


    ![](img/1005cbc7df81f2054919decd848f91da_89_1.png)


    ## 72


    源代码就绪后，让我们在打开 **Sources** 面板的情况下在 Chrome 中运行我们的页面。如果我们观察屏幕，可以看到一组数字按顺序向下向下移动，并在文档的最后一行结束于
    **5000**。让我们在 **Sources** 面板中选择 `main.js` 文件，在源代码的第 8 行添加一个断点，看看 **Sources** 面板能做什么。现在设置好断点后，让我们刷新页面。当我们这样做时，可以看到页面变灰，顶部有一条黄色注释指示我们正在调试器中暂停，并且
    `main.js` 文件中的第 8 行被蓝色高亮，标记了调试器暂停的位置。


    我们还可以看到 **Scope Variables**（作用域变量）选项，它显示了执行时给定作用域的所有属性和对象；在这种情况下，作用域在 `loopingTo5k()`
    函数内部。要获取更多信息，我们可以参考 **Sources** 面板的右侧部分并查看 Local（局部）树获取信息，或者可以将鼠标悬停在代码文件中的对象上获取更多信息。如下截图所示，我高亮了函数作用域中的
    `document.body` 对象，在 JavaScript 中创建了一个新的段落对象。


    ![](img/1005cbc7df81f2054919decd848f91da_90_0.png)


    ## 73


    当我们完成调试后，可以点击 **Sources** 面板中蓝色高亮的播放按钮，或者通过播放按钮旁边的控件 **Step Over**（单步跳）我们的函数并进入下一个函数。请记住，如果我们有任何进一步的断点，它们将在网页源代码的更下位置中断。要移除断点，我们可以将它们从行号列拖走并按播放键以不带调试的方式继续。


    ### 使用 debugger 关键字


    JavaScript 编程中一个不为人知的功能是 **debugger** 关键字；它是一个非常简单的辅助函数。在运行代码时，它会触发 **Sources**
    面板或连接的另一个 JavaScript 调试器自动中断；这在查看大型代码库或难以在某行设置中断时很有帮助。


    假设在我们目前为止的示例代码中，有一个 `while` 循环，导致 `my_integer` 在第 555 次迭代时代码出现问题。如果我们必须单步执行，将需要点击
    555 次播放按钮到达那里。然而，有一种绕过的方法。


    为了演示这一点，我设置了这些源文件的副本，并将它们保存在 Packt Publishing 网站提供的代码包中 `Exercise_Files` 文件夹下
    `Chapter_03` 文件夹的 `02` 文件夹中。我只在代码中做了一处更改：在第 12 到 14 行添加了一个条件 `if` 语句，确保 `my_integer`
    等于 555。如果应用了该语句，我只需编写 `debugger` 并用分号结束行即可调用调试器，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_91_0.png)


    ## 74


    现在调用 debugger 非常简单。让我们再次带有我们的 debugger 代码加载 `index.html` 文件，在这里可以看到在没有设置断点的情况下，我们的
    **Sources** 面板会自动检测到该行并设置断点（如下所示）：


    ![](img/1005cbc7df81f2054919decd848f91da_92_0.png)


    ## 75

    ### 时间轴面板 (Timeline panel)


    在这里我们将通过以下方面来学习 **Timeline** 面板：


    使用时间轴面板


    **Timeline**面板允许我们检测相对于 JavaScript 的整体网页性能；它还允许我们检查浏览器渲染事件。要使用 **Timeline**面板，我们只需要点击录制按钮并在
    Chrome 中刷新页面。


    在 **Timeline**检查器中，**Timeline**面板显示了四种事件。这些是 **Loading**（加载）、**Scripting**（脚本）、**Rendering**（渲染）和
    **Painting**（绘制）事件。我加载了之前讨论过的示例文件（02），显示了通过 **Timeline**面板运行的事件，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_93_0.png)


    #### 加载事件


    **Loading**事件处理请求和响应；通常这些是加载外部脚本文件以及离开页面的 POST 请求。加载事件还包括 HTML 代码的初始解析。在 Google
    Chrome 的 **Timeline** 中，这些显示为蓝色。


