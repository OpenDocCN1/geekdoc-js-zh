    *理解 JavaScript 构建系统*


    **58**


    ## 总结


    在本章中，我们学习了如何使用 Node.js 和 Gulp 创建一个简单的 JavaScript 构建系统。我们还探索了其他插件，并查看了 Grunt Task
    Runner，它的工作原理与 Gulp 类似，但为你的工作提供了更多插件。构建系统可以在不费太大精力的情况下极大提升性能；请记住，gulp 文件可以在其他项目中重用，因此请尽管尝试并找到最适合你项目的方案。


    在下一章中，我们将学习如何使用 Chrome 的**开发者工具**（Developer tools）来优化我们的 Web 应用程序代码。


    **59**


    ## 检测性能


    在本章中，我们将介绍工作环境和所需的工具；我们还将涵盖 Google Chrome Web 检查器（Web Inspector）中的功能和 JavaScript
    优化工具，并创建一些测试样本，展示我们如何使用和测试 JavaScript 以及 HTML 页面代码。


    我们将在本章涵盖以下主题：


    - 通用 Web 检查器

    - Elements面板（Elements panel）

    - 网络面板（Network panel）

    - 时间线面板（Timeline panel）

    - 概览面板（Profile panel）

    - 资源面板（Resources panel）

    - 审计面板（Audits panel）

    - 控制台面板（Console panel）


    ### 通用 Web 检查器


    在深入探索 Chrome Web 检查器之前，重要的是，不同的 Web 浏览器有许多不同的 Web 检查器，它们通常由浏览器厂商开发，用于调试网页的应用程序内容和性能。


    需要理解的是，为了让能够正确调试 Web 应用程序，他们应该使用针对出现问题的浏览器而设计的检查器。


    *检测性能*


    **60**


    ### Safari Web 检查器


    Apple 的 Web Inspector 是一个基于 WebKit 的、为 Safari 构建的检查器。其构建方式与 Chrome 的 Web 检查器非常相似。我们将在后的第
    9 章《为 iOS 混合应用优化 JavaScript》中更多地介绍 Safari **Web Inspector**，主要是因为 Safari 的 **Web
    Inspector** 可以调试 iOS 开发中的 Web 内容。Apple 对其工具提供了详尽的文档，地址为 https://developer.apple.com/safari/tools/，并如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_78_0.png)


    ### Firefox 开发者工具


    Mozilla 的 Firefox 网页浏览器也有自己的检查器。最初，Firefox 是唯一一个带有检查器的浏览器；它被称为 Firebug，作为插件形式开发，并且不包含在主浏览器中。


    *第 4 章*


    **61**


    自从 Firefox 3 问以来，Mozilla 开发了了自己的浏览器检查器，不仅是为了他们自己的浏览器，也是作为 Firefox OS 的调试工具——Firefox
    OS 是一个使用 HTML5 进行应用程序开发的移动操作系统。Firefox **开发者工具**还允许对相当新甚至是实验性的 HTML5 和 JavaScript
    开发形式进行调试。


    我们可以在 Mozilla 开发者网络（Developer Network）查看更多关于 Firefox **开发者工具** 允许的开发者类型的信息，地址为
    https://developer.mozilla.org/en-US/docs/Tools，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_79_0.png)


    ### Internet Explorer 开发者工具


    过去，Internet Explorer 被视为 Web 开发者工具箱中的“害群之”。在 Internet Explorer 11 出现之前，微软为 Internet
    Explorer 6 及以上版本提供了一个简单的 DOM 检查器插件；尽管它对 Internet Explorer 的浏览器问题很有帮助，但其功能集落后于其他厂商的检查工具。


    *检测性能*


    **62**


    自从 Internet Explorer 11 发布以来，微软将其定位为比过去更多地支持 HTML 开发，而其新的 **F12 开发者工具**正做到了这一点。**F12
    开发者工具**中发现的大部分功能与 Chrome 的**开发者工具**以及 Safari 的 **Web Inspector** 一样出色，并预计未来会有更多发布。我们可以在
    http://msdn.microsoft.com/en-us/library/ie/bg182326(v=vs.85).aspx 阅读更多关于如何使用这些工具的信息，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_80_0.png)


    ### Chrome 开发者工具


    Chrome 器最初是使用开源 WebKit 浏览器的 Web Inspector 开发的，该检查器也曾被 Apple 的 Safari 使用。后来，当 Chrome
    决定将 WebKit 分叉为他们名为 Blink 的自己的浏览器运行时时，Google 从头开始为 Blink 重建了检查器，优化了用户界面并添加了开源 Webkit
    检查器中没有的功能。


    重建检查器的另一个原因是引入了 Chrome for Android 和 Chrome OS 应用程序。这允许开发者访问针对这些平台开发的特定 JavaScript
    控制台对象。它还具有优化响应式内容的工具，并可以在没有设备的情况下调试移动端内容。


    *第 4 章*


    **63**


    由于这里提到的丰富功能，我们将涵盖如何使用 Chrome 的 Web 检查器。如果你担心知道另一个检查器上的某个功能，请参考之前提到的链接并研究本章列出的的话题。


    最后，Chrome 对新功能的更新周期非常频繁，对于其名为 Chrome Canary 的 Chrome 测试版本更是如此，这 本质上是启用了实验性功能的
    Chrome，包括对 Blink 的任何早期速度改进。你可以在 https://www.google.com/intl/en/chrome/browser/canary.html
    下载 Canary，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_81_0.png)


    Chromium 的**开发者工具**包含了许多在 Firefox **开发者工具**中常见的更高级的功能。对于本章，我将使用默认的 Chrome **开发者工具**，但请也查看
    Chromium 的**开发者工具**，以了解未来哪些可用。


    *检测性能*


    **64**


    访问 https://developer.chrome.com/devtools 查看 **Chrome DevTools 概述**，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_82_0.png)


    ### 熟悉 Chrome 开发者工具


    要安装 Chrome 的**开发者工具**，从 http://www.chrome.com/ 下载 chrome 即可！Chrome 的**开发者工具**包含在
    Chrome 中，不需要额外安装。


    首先，在 Chrome 中打开一个新窗口并在地址栏（或地址栏）输入 `about:blank`。接下来，让我们使用快捷键 *Ctrl* + *Shift*
    + *I*（Mac 上为 *Command* + *Option* + *I*）打开**开发者工具**。我们应该能看到一个显示**开发者工具**的空白屏幕，如下截图所示：


    *第 4 章*


    **65**


    ![](img/1005cbc7df81f2054919decd848f91da_83_0.png)


    默认情况下，Chrome 的**开发者工具**将以停靠模式显示（如之前所示或在其单独窗口中显示；如果你想取消停靠或重新停靠**开发者工具**，请选择停靠按钮。


    按住停靠按钮允许我们将**开发者工具**停靠在浏览器窗口侧侧。你可以在下面的图中找到标记停靠按钮：


    ![](img/1005cbc7df81f2054919decd848f91da_83_1.png)


    *检测性能*


    **66**


    **开发者工具**被分为不同的面板，显示在窗口顶部，每个面板包含 Web 应用程序的不同功能和调试选项。我们将关注 JavaScript 特定的面板，但我们将为不熟悉这些的人简要介绍每个面板。


    ### Elements 面板


    **Elements** 面板显示 HTML 页面的源代码和 DOM 资源器，允许开发者检查 DOM 的更改。我们可以通过将鼠标悬停在 DOM 树上，或使用下图所示的放大镜来高亮元素：


    ![](img/1005cbc7df81f2054919decd848f91da_84_0.png)


