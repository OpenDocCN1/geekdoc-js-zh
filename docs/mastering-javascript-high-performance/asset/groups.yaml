    ## 运算符、循环与计时器


    [84]


    ### 运算符


    在本节中，我们将学习如何使用比较运算符来高效地创建 `for` 循环。


    ### 比较运算符


    比较运算符 `==` 是 JavaScript 开发中常见的一种运算符（通常用于 `if` 语句）；它将一个对象与另一个对象相等并返回一个布尔值（`true`
    或 `false`）。它非常直观，并且在基于 C 的语言中非常常见。


    正因如此，很容易利用这个运算符并在大型代码库中使用它。但事实是，与使用 `===` 严格比较运算符相比，等号运算符的速度较慢，后者不仅会比较对象的类型，还会比较对象的值。由于
    JavaScript 解释器在检查相等性之前不需要确认类型，因此它的运行速度比使用双等号运算符更快。


    ### 严格比较更快吗？


    让我们使用 `console.time` 方法来测试这一点。在下面的截图中，我们有一个 `05_01.js` 代码示例；我们也可以在 Packt Publishing
    网站提供的书籍示例文件中看到这个示例：


    ![](img/1005cbc7df81f2054919decd848f91da_102_0.png)


    [85]


    在这里，我们在第 5、6、7 行上有三个变量；其中两个变量是引用 pi 值的浮点数，最后一个变量是具有相同 pi 值的字符串。接着我们在第 12 行有一个匿名函数，其中包含一个测试变量，它使用双等号运算符比较我们的两个浮点数。在函数周围，我们在第
    9 行和 14 行分别封装了 `console.time` 和 `console.timeEnd` 函数。


    让我们在 Chrome 浏览器中运行它；打开 Chrome，在 `about:blank` 标签页上通过**更多工具**选项打开**开发者工具**，然后打开右侧栏
    **Sources**（源代码）面板下的 **Snippets**（代码段）标签。**Snippets**标签就像一个用于测试 JavaScript 代码的草稿板；在标签内容区域点击右键，并选择**新建**。用名称保存您的代码段并从示例中复制代码，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_103_0.png)


    接下来，右键点击左侧边栏中的代码段并点击**运行**。你会发现**开发者工具**窗口底部出现了控制台。我们还可以看到一条 `Check PI: 0.016ms`
    的控制台消息。这告诉我们，在这个简单的评估上运行比较运算符需要 0.016 毫秒即可完成。如果我们将比较运算符改为严格比较运算符，结果会怎样呢？


    [86]


    更改运算符后，我们可以看到第二个 `console.time` 信息是 `Check PI: 0.007ms`。虽然这是一个简单的例子，但它证明了使用严格类型检查的严格比较运算符时代码运行得更快。


    ![](img/1005cbc7df81f2054919decd848f91da_104_0.png)


    ### 循环


    在本节中，我们将详细学习创建 `for` 循环的高效方法。


    ### 循环如何影响性能


    循环是遍历大型数据块或对象、以及遍历每个 DOM 对象实例或每段数据的非常常见方式。假设我们有一个简单的循环，它生成一个 `<p>` 段落标签，并将循环中的整数
    `i` 作为内部文本值添加到页面中，最大限制为 9000。让我们看看下面的代码示例，看看它是如何实现的。我创建了一个简单的 HTML5 页面，其中包含一个
    `<script>` 标签，其第 10 行的代码如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_105_0.png)


    那么，这段代码为什么是计算密集型的呢？首先，如果我们看第 17 行，可以看到一个名为 `ptag` 的变量，它被创建用于在 DOM 中创建一个空白段落标签。然后，我们将循环中整数的当前值应用到
    `ptag` 的 `innerText` 属性；最后，我们在循环中该点指定的值将新创建的段落标签应用到 DOM 中。为了性能测试，我们还将 `for` 循环封装在
    `console.time` 封装中以检查速度。如果我们在 Chrome 中运行它，应该得到一个页面，其中包含 `for` 循环创建的行，以及一个带有处理标签的
    `console.time` 方法，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_105_1.png)


    [88]


    查看我们的处理标签，可以看到处理此块代码大约需要 18 毫秒。这并不理想，但我们可以做得更好；让我们更新代码，将 `ptag` 变量和 `i` 变量移动到
    `for` 循环之外，这样它们就不会在每次 `for` 循环迭代时被重新创建。让我们通过更新更新代码来查看它的样子：


    ![](img/1005cbc7df81f2054919decd848f91da_106_0.png)


    注意，在第 16 行，我们将 `i` 和 `ptag` 变量移动到了循环外，我们在循环中进行重新赋值，而不是为每次循环通过创建一个唯一的作用域。如果我们重新运行页面，我们应该看到相同的标签已更新，但性能比以前略好；在以下情况下，它应该在
    15–17 毫秒内运行：


    ![](img/1005cbc7df81f2054919decd848f91da_107_0.png)


    ### 反向循环的迷思


    JavaScript 圈似乎出现了一个新概念，即反向 `for` 循环。反向 `for` 循环的写法与普通循环一样，但循环倒序计数而不是向前计数。反向循环的原理是，通过倒序计数，某些
    JavaScript 解释器运行循环的速度更快。让我们测试一下这是否真的能提高 `for` 循环的速度。首先，让我们创建一个从 9000 向前计数的 `for`
    循环；我们不会在循环中包含任何逻辑，除了添加一个名为 `result` 的外部变量外。


    [90]


    使用带有递增的 `result` 变量，我们可以确定计数是否符合预期，以及是否在反向循环和标准 `for` 循环的 9000 次结束时触发了一行代码。在我们的情况下，`console.timeEnd`
    函数（如下代码所示）位于自己的 HTML 页面中，底部有一个 `<script>` 标签。


    ![](img/1005cbc7df81f2054919decd848f91da_108_0.png)


    让我们看看代码示例。在第 13 行，我们在开始 `for` 循环之前声明了 `result` 变量，而在第 14 行，我们启动了带有“Time Up”标签的
    `console.time` 封装方法。第 15 行，我们开始 `for` 循环并在第 16 行增加 `result`。最后，在第 18 行，我们有一个条件询问
    `result` 是否等于 9000，并在第 19 行执行 `timeEnd` 函数。


    如果我们加载带有 `for` 循环脚本的 `body` 标签的页面，**开发者工具**中的控制台应该输出以下信息：


    ![](img/1005cbc7df81f2054919decd848f91da_109_0.png)


    所以，我们的 `console.time` 对象告诉我们，最大值为 9000 的标准 `for` 循环在 Chrome 中处理大约需要 0.15 毫秒。由于页面没有托管在服务器上，这确保了网络延迟不是因素。这是一个很好的基准，可以用来比较反向循环。现在，让我们测试反向
    `for` 循环；在这里，我们创建了 `for` 循环的更新版本，包含了 `result` 变量。与之前的过程类似，但让我们看看后续截图中的代码示例：


    ![](img/1005cbc7df81f2054919decd848f91da_109_1.png)


