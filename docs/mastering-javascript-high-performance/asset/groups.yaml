    ## 第3章


    [49]


    像 Grunt 一样，Gulp 也有一个插件参考页面，地址为 http://gulpjs.com/plugins/，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_67_0.png)


    ### 安装 Gulp


    要安装 Gulp，我们将打开终端并在提示符中输入以下内容：


    **sudo npm install --global gulp**


    ### 理解 JavaScript 构建系统


    [50]


    这会将 Gulp 全局安装到我们的 Node.js 和 NPM 资源路径中。如果我们运行的是 Windows 系统，Windows 的 Shell 中没有
    sudo 命令，因此我们需要以管理员身份运行命令提示符。现在，如果一切顺利，我们应该会看到一系列针对文件的 URL 请求，我们的终端应该返回到如下截图所示的提示符：


    ![](img/1005cbc7df81f2054919decd848f91da_68_0.png)


    在我们安装了 Gulp 的全局依赖（“global”意味着安装到系统的所有文件夹）后，我们可以安装开发依赖，这使得我们的构建系统在上传到源码控制系统时更具移植性。本质上，这些依赖需要存在于项目根文件中，以便我们的构建系统能够在项目目录中运行。


    [51]


    我们可以通过在终端中输入以下代码来实现（再次提醒，Mac/Linux 用户使用 sudo，Windows 用户使用**以管理员身份运行**）：


    **sudo npm install --save-dev gulp**


    如果成功，你的 bash 提示符应该再次显示，拉取许多 URL 源并将它们安装到项目 `node_modules` 目录下的 `gulp` 文件夹中，如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_69_0.png)


    ### 创建 gulpfile


    gulpfile 是 Gulp 会在项目根目录下检查并运行一系列任务列表的文件。要创建一个此类文件，我们将创建一个名为 `gulpfile.js` 的简单
    JavaScript 文件（注意文件名的大小写）。在文件中，我们将 Gulp 引用为一个变量，并创建一个名为 `Default` 的默认任务。


    [52]


    这是我们为每个 `gulpfile.js` 需要运行的主任务；在其中，我们可以包含其他任务或输出日志消息，就像在浏览器中一样。Gulp 任务的简单代码示例如下所示：


    ![](img/1005cbc7df81f2054919decd848f91da_70_0.png)


    ### 运行 Gulp 项目


    运行 Gulp 项目非常简单。在项目的根目录中，在终端中输入 `gulp` 并按 *Enter*。你应该能在终端中看到如下截图所示的输出：


    ![](img/1005cbc7df81f2054919decd848f91da_70_1.png)


    太棒了。如果我们查看终端输出的第四行，应该能看到输出消息为 **Default task ran**。干得好！这是我们在 `gulpfile.js` 中为
    Default 任务所创建的同一个 `console.log` 消息。


    所以你可能会问，这一切是如何帮助优化 JavaScript 代码的？嗯，如果你还记得*第2章*，*使用 JSLint 提高代码性能*，我们曾使用 JSLint
    来审查 JavaScript 代码、进行改进并优化文件。如果我们可以在复制文件并通过 JSLint 压缩（甚至测试压缩后的代码）的同时运行那个测试工具会怎样呢？嗯，我们可以做到，这就是使用构建系统的意义所在。


    通过构建系统，我们可以在修改代码之前、甚至在部署为 Web 应用程序之前，对其进行改进和优化。


    [53]


    ### 将 JSLint 集成到 Gulp


    之前我们提到了 Gulp 的插件页面；其中一个插件就是 JSLint 插件，其安装过程非常简单。首先，查看 JSLint 插件页面：https://www.npmjs.org/package/gulp-jslint/，如下图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_71_0.png)


    所以，与安装 Gulp 的方式一样，我们将运行页面上显示的 npm 命令，但会包含用于管理员权限的 `sudo` 和 `-g` 命令。这是一个将 JSLint
    安装到整个系统的全局标记，如下：


    **sudo npm install -g gulp-jslint**


    接下来，我们将为项目安装开发依赖，因此再次在终端中指向我们的项目根目录，然后输入 npm 命令，但这次带有 `-save-dev` 标记，如下：


    **sudo npm install --save-dev gulp-jslint**


    [54]


    为了验证安装情况，我们可以检查项目目录下的 `node_modules` 文件夹，查看 `gulp-jslint` 文件夹，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_72_0.png)


    ### 测试我们的示例文件


    现在，我们的构建系统需要一个源文件，我在 Finder 中新建了一个 `src` 项目目录并在添加时编写了一个示例。我还没有测试过它，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_72_1.png)


    [55]


    这里我们有一个简单的 Toddler JavaScript 类，它根据调用的原型链函数显示消息；它非常基础，并且包含了一些刻意的错误，所以让我们找到这些错误。回到
    `gulpfile.js`；我使用一些 JSLint 示例更新了它，并使用了我们开启的并在*第2章*，*使用 JSLint 提高代码性能*中提到的相同常用选项。查看更新后的
    `gulpfile.js` 文件，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_73_0.png)


    在第 6 行和第 7 行，我们可以看到如 `gulp.src()` 和 `pipe()` 等约定。`src` 函数是 Gulp 特有的函数，使用 JavaScript
    数组设置源文件或多个文件；`pipe` 函数也与 Gulp 相关，允许我们创建一个任务列表，这些任务将从 `gulp.src()` 获取源文件并将其*管道*到我们的构建系统中。这里的第
    5 到 19 行显示了一个名为 `JSLint` 的新 `gulp.task`。如果我们查看第 9 到 12 行，我们可以看到来自 JSLint.com 使用的相同选项；当我们在页面上选择不同的选项时，可以在页面底部的
    JSLint Directives 下找到选项名称。


    [56]


    在第 22 行，我们在 *default* 任务之后添加了一个数组，将我们的 *JSLint* 任务名称加入数组。我们可以在这里添加多个任务，但目前我们只需要
    lint 任务。现在运行脚本并检查我们的终端。


    ![](img/1005cbc7df81f2054919decd848f91da_74_0.png)


    极了！终端中显示的红线报告了脚本中的错误，为我们在终端中提供了 lint 反馈，正如我们所见，我们忘记了一些常见点，例如使用 *use strict*、缺少分号等。所以我们可以看到如何使用
    Node.js 和 Gulp 在构建期间自动化代码测试过程。


    ### 创建发行版本


    把最好的部分留到最后，让 Gulp 处理 JavaScript 源代码的压缩，将输出到 `dist` 文件夹，然后对输出进行测试。我修改了 `ExampleScript.js`
    文件以修复了之前发现的大部分问题。现在我们需要为 Gulp 下载一个名为 **Uglify** 的压缩工具，地址为 https://www.npmjs.org/package/gulp-uglify。它是基于
    Gulp 的项目常用的 JavaScript 压缩工具；其安装方法与安装 Gulp 和 JSLint for Gulp 相同。使用以下命令安装该工具：


    **sudo npm install --save-dev gulp-uglify**


    [57]


    现在我们更新了 `gulpfile.js` 添加了一个新的 minify 任务并将其加入数组，如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_75_0.png)


    现在，在终端窗口中运行 Gulp 并注意输出（如下截图所示）；在 Finder 文件夹中，你会在项目根目录的 `dist` 看到一个全新的压缩文件，同时保留开发源码并获得性能测试！


    ![](img/1005cbc7df81f2054919decd848f91da_75_1.png)


