    *不要操作 DOM*


    [120]


    ## 什么时候使用 createElement 函数？


    虽然 `createElement` 函数执行较慢，但在某些通过复杂布局生成 HTML 的情况下，它可以更有帮助。在这种情况下，复杂应用程序生成的元素远比
    `innerHTML` 属性能够样化的适应量要多得多。


    如果是这样，这样做更多是为了开发团队在修改元素类型时的方便和易用，而不是为了更新整个字符串以适应应用程序的需求。无论何情况下，如果你需要创建 HTML 元素，`innerHTML`
    属性始终是最快的。


    ## 元素动画


    JavaScript 令人印象深刻的用途之一出现在 JavaScript 的 *Web 2.0* 时代，当时 AJAX 正在流行；另一个有趣的主意是以 JavaScript
    动画的形式出现的。这些动画通过使用 `setInterval` 函数不断地遍历一个使用 `left` 和 `top` 定位的元素样式来创建的，并在元素到达终点后将其移除。这使得
    `div` 元素可以在页面上产生补间动画（tween）或动画效果。


    ## 使用旧方法制作动画


    大多数 JavaScript 开发者都熟悉使用 jQuery（一种流行的 JavaScript DOM 操作库）中的 `animate` 函数来创建 DOM
    动画。但是，由于我们在书中讨论的是纯 JavaScript，让我们来看一个如何从零构建它的示例。请查看以下截图中的代码：


    *第 7 章*


    [121]


    ![](img/1005cbc7df81f2054919decd848f91da_139_0.png)


    在这个示例中，我仅使用 JavaScript 就创建了一个 WebKit 友好的动画（这意味着它只会在 Google Chrome 和 Apple Safari
    浏览器中正常显示）。在第 7 行，我们设置了一些基础样式，包括一个 id 为 `dot` 的黑色点 `div` 元素。


    *不要操作 DOM*


    [122]


    现在在第 27 行和 28 行，我们分别声明了 `dot` 和 `i` 变量。然后，第 31 行，我们创建了一个名为 `interval` 的变量，它实际上是传递给
    `setInterval` 函数的参数。在此代码中，它是每毫秒一次，如第 38 行所示。在 `setInterval` 函数内部，我们将 `i` 变量的计数加
    1，并更新 `dot` 元素的位置。最后，当 `i` 变量的值严格等于 450 时，我们使用 `clearInterval` 函数移除 `interval`
    变量，这会停止 `setInterval` 函数继续处理。如果我们观察这个，可以看到在浏览器中使用了纯 JavaScript 实现了一个简单的补补间动画。这如下截图所示：


    ![](img/1005cbc7df81f2054919decd848f91da_140_0.png)


    现在，你可能认为以这种方式创建 `setInterval` 函数可能会引起关注，你可能是对的。幸运的是，作为开发者，现在为我们的 HTML5 应用程序创建这样的动画时，我们有另一种替代方案！


    ## 使用 CSS3 制作动画


    让我们使用 CSS3 和仅用 JavaScript 触发动画来重新构建这个示例。再次，为了简单起见，我们将仅针对关注 WebKit 的浏览器进行样式设置。让我们看看以下截图中的更新代码示例：


    *第 7 章*


    [123]


    ![](img/1005cbc7df81f2054919decd848f91da_141_0.png)


    通过这个示例，我们可以看到 JavaScript 的代码行要少得多，这是一件好事；它让我们的内容样式保持纯基于 CSS，而不是使用 JavaScript 逻辑来设置内容设置。


    现在，在 JavaScript 侧，我们看到我们在第 39 行使用了相同的匿名函数，不同在于我们设置了一个超时来触发 `dot` 元素添加 `active`
    类属性，从而触发 CSS3 中的动画。这在我们的示例的第 19 行到第 30 行中所示。


    *不要操作 DOM*


    [124]


    ## 不公平的性能优势


    在本书的许多代码示例中，我使用了 `console.time` 和 `console.timeEnd` 来审查性能，这个示例也不例外。你可能注意到我将每个动画示例封装在
    `time` 和 `timeEnd` 函数中以测量处理时间。正如如下截图所示，这有点片面性：


    ![](img/1005cbc7df81f2054919decd848f91da_142_0.png)


    *第 7 章*


    [125]


    正如上一个截图所示，JavaScript 的处理时间大约为 1900 毫秒，而 CSS3 动画约为 0.03 毫秒。现在，在我们得出 CSS3 方法更好之前，我们必须记住我们只使用
    CSS3 来渲染页面，而 JavaScript 仅处理动画的触发。它仍然更高效，但应该注意到 JavaScript 处理的代码更少。


    现在对于较新的浏览器，考虑到目前为止看到的性能改进（无论是否由 JavaScript 实现），这是构建内容动画推荐的方法。然而，某些项目需要对旧版浏览的支持，这些项目可能无法使用
    CSS3 过渡和动画，或者我们在保持兼容性的同时正在升级应用程序的部分动画。这里有一种在使用与之前相同的基于 JavaScript 的动画的情况下实现这一目标的方法：


    ![](img/1005cbc7df81f2054919decd848f91da_143_0.png)


    *不要操作 DOM*


    [126]


    在这里，我们通过更新 `dot` 元素的位置修改了最初的 JavaScript 示例；但是，我们在第 17 行和第 18 行添加了两行 CSS 代码。第一行是
    `-webkit-transform` 和 `translate3d` 属性，它仅设置元素不改变位置；在旧版浏览器或非关注 WebKit 的浏览器中，该属性将被忽略。但在这里它仅仅是将元素的位置设置为其初始位置，这听起来很傻，在某种意义上确实如此！


    这实际上的作用是告诉 DOM 运行时，这需要作为一个唯一的图形进程运行；它还告诉浏览器设备上的**图形处理器**（**GPU**）快速绘制此元素！`will-change`
    属性也是如此，它是一个类似的属性，作用与 `translate3d` 属性相同，不同之处它不是更新位置，而是简单地告诉 GPU 以极高的速率重绘此元素，并预料它会在
    DOM 中发生变化。现在，这种做法被称为将元素添加到复合层（composite layer）。我们将在*第 9 章，《为 iOS 混合应用优化 JavaScript***
    中更深入地讨论复合层。但目前，我们在这里做的是这些；这样，较新的浏览器仍然可以使用旧的 JavaScript 动画获得一些视觉速度上的提升。


    ## 理解绘图事件（paint events）


    绘图事件是 DOM 事件，当 DOM 通过 JavaScript 更新时，它会导致 Web 浏览器绘制网页。对于内存较小的浏览器，这可能是一个问题，因为绘图事件需要大量的处理和图形渲染来在大范围内显示更新。


    ## 如何检查绘图事件？


    通常，绘图事件可以在 Web 检查器的时间线视图（timeline view）中找到。由于绘图事件在网页浏览器执行期间期间按时间顺序显示，因此在 Chrome
    的**开发者工具**（Developer tools）选项中显示略有不同。


    *第 7 章*


    [127]


    打开 Chrome 的**开发者工具**选项并点击抽屉图标（它是**开发者工具**选项右上角齿轮旁边的图标）。接下来，在抽屉中打开**渲染**（Rendering）标签，并点击**显示绘图矩形**（Show
    paint rectangles）选项。完成后，刷新页面。我们将看到页面在加载时各个区域高亮为绿色。这些是在加载到屏幕时工作的绘图事件。这是一个使用我们的动画并在
    Chrome 的**开发者工具**选项中启用显示绘图矩形的示例：


    ![](img/1005cbc7df81f2054919decd848f91da_145_0.png)


