    *Understanding JavaScript Build Systems*


    **[40]**


    For this project, we won''t discuss Node.js in depth (that''s another book), but
    we will be installing Node.js into our OS so that we can run and test our build
    system. So let''s download Node.js and get started. First, navigate to http://nodejs.org/
    and click the green **INSTALL** button, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_58_0.png)


    Node.js is cross-platform, and so most of these instructions should work for you.
    I''ll be using a Mac with OS X for this installation''s introduction. For most
    platforms, Node.js will come with either a .pkg or .exe install wizard, as shown
    in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_58_1.png)


    *Chapter 3*


    **[41]**


    From here, follow the wizard, accept the user licenses and install for all users.
    By installing for all users, we allow Node.js to have full system access which
    we do want, since some plugins for Node.js may require certain features that are
    not accessible by a single user or non-administrator.


    When you''ve finished installing Node.js, keep in mind the paths set by the installer;
    if you want to remove Node.js in future, check out the following screenshot to
    see where the installer has added Node.js:


    ![](img/1005cbc7df81f2054919decd848f91da_59_0.png)


    ### Testing a Node.js installation


    To ensure that Node.js is properly installed, we want to check two things. The
    first thing is to check whether Node.js works in the Terminal. To validate the
    installation, we will check the current version of Node.js that''s installed.


    *Understanding JavaScript Build Systems*


    **[42]**


    First, let''s open Terminal (or Command Prompt, if using Windows), and insert
    the node --version command as shown in the following screenshot, and press *Enter*:


    ![](img/1005cbc7df81f2054919decd848f91da_60_0.png)


    If successful, we should see the version number (in my case, it''s v0.10.32; your
    version may be greater than my version number when attempting this) as shown on
    the next line in the Terminal in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_60_1.png)


    *Chapter 3*


    **[43]**


    ### Testing Node Package Manager''s installation


    Great job! Now, the next thing to be checked for a full installation is whether
    Node Package Manager is installed as well. Before testing, let me explain what
    Node Package Manager is, especially to those who might not know what it is and
    why we need it.


    #### About Node Package Manager


    The **Node Package Manager** (**NPM**) connects to the NPM registry, an online
    repository of software libraries for Node.js. By using NPM, we can quickly set
    up a JavaScript build system and install libraries for our HTML-based JavaScript
    projects automatically, which allows us to ensure that our JavaScript libraries
    are up-to-date with the latest version of each library.


    NPM also has a website you can use to research various JavaScript libraries at
    https://www.npmjs.org. This is also shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_61_0.png)


    *Understanding JavaScript Build Systems*


    **[44]**


    ### Checking NPM installation in the Terminal


    Now, to check our installation of NPM, we are going to call NPM directly, which
    should return a help directory for the NPM module installed. To do this, simply
    open the Terminal and insert the npm command. Now, we should see our Terminal
    window populating with a bunch of NPM help documentation and sample terminal commands,
    as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_62_0.png)


    #### The basics of using NPM


    Using NPM is a pretty easy process to learn. The first thing that we need to do
    before setting up NPM for a project is to create a project root directory; I''m
    going to mark this as npm_01 for the first project, but you can name your root
    as whatever you would like. Now, we are going to open Terminal and change our
    bash directory to match the path to the directory I created.


    *Chapter 3*


    **[45]**


    To change your working directory in the Terminal, the command is Change Directory
    or cd. Using cd is pretty easy; simply type the following command:


    **cd [~/path/to/project_dir]**


    A few things to note here are that the Terminal always points to your user home
    directory on Mac and Linux, and the tilda key (or~*) is a shortcut to point to
    your path. For example, if your folder is in your documents directory under your
    username, an example path using cd would be cd ~/Documents/[your_project_path].


    If the Terminal is getting cluttered with information, you can use the "clear"
    command to clean your terminal''s contents, without changing your directory.


    ### Installing jQuery with NPM


    A common JavaScript library is jQuery, a very popular library on NPM. We can even
    check out its repository information on npmjs.org, found at https://www.npmjs.org/package/jquery.


    ![](img/1005cbc7df81f2054919decd848f91da_63_0.png)


    *Understanding JavaScript Build Systems*


    **[46]**


    If we look at this page, we can see a command for our terminal, npm install jQuery.
    So, let''s type that into our terminal and press *Enter* to see what happens.
    If you''re a Mac or Linux user, you can drag-and-drop a folder into the Terminal,
    and it will auto-write the path of your folder for you after you type the cd command.


    In the Terminal, it looks like some files were downloaded, as indicated in the
    following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_64_0.png)


    Now, if we open our project directory, we can see that a new folder named node_modules
    has been created. Inside this folder, another folder is created named jquery.
    The contents of the jquery folder are shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_64_1.png)


    *Chapter 3*


    **[47]**


    Inside the jquery folder, there are some interesting files. We have a README.md
    (.md is short for markdown, a type of text format) file explaining jQuery.


    The folder has two JSON files, one called bower.json and another package.json.
    The package.json file handles the NPM information while the bower.json file handles
    any dependent packages and notifies NPM to include those as well. If you''re wondering
    what bower.json file does, it''s essentially another way to update source code
    from a repository. Like the NPM registry, bower.json uses its own setting.


    Lastly, the most important two folders are the src folder (source folder) and
    the dist folder (distribution folder). This file structure is a common convention
    for NPM, where the source of a project is saved in src folder, while the final
    output lives in dist folder. Since we aren''t debugging the source for jQuery,
    all we need to worry about is the dist folder, where we can find the jquery.js
    file and the jquery.min.js file—the same library files typically used in jQuery
    projects. We will want to copy those into the distribution folder for our build
    system.


    ### Setting up our build system


    Now that we have learned the basics of Node.js and NPM, let''s actually build
    a build system. We will want to point our Terminal to our project''s root directory,
    and then we will want to install our build system (also called Task Runner).


    #### About Grunt.js and Gulp.js


    Grunt was designed originally for automating tasks in JavaScript and, web development
    and, due to its availability, many developers have created plugins; you can view
    them in Grunt''s plugin repository shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_66_0.png)


    #### About Gulp


    Gulp is another build system for Node.js; the advantage of using Gulp is that
    it''s asynchronous, and typically runs automated tasks much faster than Grunt.
    Since this book is all about performance, we will use Gulp for our build system
    as an example. That doesn''t mean that Grunt is bad; it can create built systems
    as well as Gulp.js, but it may not be as fast as Gulp.

