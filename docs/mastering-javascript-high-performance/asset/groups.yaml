- md: "\n*Detecting Performance*\n\n**[76]**\n\nThe Scripting event\n\nThe **Scripting**\
    \ event occurs when the browser reads and interprets JavaScript code.\n\nIn the\
    \ **Timeline** panel, you can expand a **Scripting** event and see at what point\
    \ a\n\nfunction was received in the browser. **Scripting** events appear as yellow\
    \ lines in\n\nGoogle Chrome.\n\nThe Rendering event\n\nThe **Rendering** event\
    \ occurs when image files and scripts affect the DOM; this can be\n\nwhen an image\
    \ is loaded without a size specified in an image tag, or if a JavaScript\n\nfile\
    \ updates the CSS of a page after the page is loaded.\n\nThe Painting event\n\n\
    The **Painting** event is the last type of events and typically is used in updating\
    \ the\n\nUI. Unlike **Rendering** event, the **Painting** event occurs when the\
    \ browser redraws\n\nan image on the screen. For desktop JavaScript development,\
    \ **Painting** events aren't\n\nusually a concern, but become strongly concerning\
    \ when we start looking at mobile\n\nweb browsers.\n\nTypically the **Painting**\
    \ event is forced when an element's display is updated from its\n\noriginal. They\
    \ can also be triggered by updates to an element, such as an element's\n\ntop\
    \ or left positioning.\n\n**The Profile panel**\n\nThe **Profile** panel helps\
    \ a developer analyze a web page's CPU profile and take heap\n\nsnapshots of the\
    \ JavaScript used. A CPU profile snapshot is helpful when it comes\n\nto checking\
    \ large complex applications to see what files may cause issues in terms of\n\n\
    object size.\n\nA JavaScript heap snapshot is a compiled list of objects found\
    \ in the page's overall\n\nJavaScript. This includes not only the code written\
    \ by us, but also the code built into\n\nthe browser, such as the document or\
    \ console objects, giving an overall list of all\n\npossible objects in an application.\n\
    \n*Chapter 4*\n\n**[77]**\n\nUsing the **Profile** panel is similar to the **Timeline**\
    \ panel; select either the **Take**\n\nHeap Snapshot** or the **Collect JavaScript\
    \ CPU Profile** option, and then click **Start**,\n\nfollowed by reloading the\
    \ page. In the following screenshot, I have selected the\n\n**Collect JavaScript\
    \ CPU Profile** option:\n\n![](img/1005cbc7df81f2054919decd848f91da_95_0.png)\n\
    \n**The Resources panel**\n\nThe **Resources** panel lists all files associated\
    \ with the web page being viewed in the\n\n**Developer tools** option, each of\
    \ which can be sorted by the type of file; developers\n\ncan individually view\
    \ each file. It also shows images on the page along with their\n\ninformation\
