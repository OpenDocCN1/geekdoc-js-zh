    **提高性能的方法**


    对于混合应用，我们可以使用过去学习的所有技术：

    - 使用如 Grunt.js 或 Gulp.js 等构建系统

    - 使用 NPM

    - 使用 JSLint 更好地优化我们的代码

    - 在 IDE 中编写代码为应用创建更好的结构

    - 使用字符串应用 HTML 而不是为它们创建对象


    *为 iOS 混合应用优化 JavaScript*


    **[164]**


    遗憾的是，混合应用性能仍然不如原生应用这一事实是真的。现在，不要因此感到沮丧，因为混合应用确实有很多优点！有些如下：

    - 它们的构建速度（通常情况下）比使用原生代码更快

    - 它们更容易自定义

    - 它们允许快速的原型设计

    - 它们比寻找原生开发者更容易交付给其他 JavaScript 开发者

    - 它们具有可移植性；它们可以在经过某些修改后，复用在 Android 设备、Windows Modern 应用、Windows Phone 应用、Chrome
    OS 甚至 Firefox OS 上

    - 它们可以使用如 Cordova* 等辅助库与原生代码交互


    然而，在某个时刻，应用程序性能将受到设备硬件的限制，建议你迁移到原生代码。但我们如何知道何时迁移呢？这可以通过 **Color Blended Layers**（颜色混合层）来实现。**Color
    Blended Layers** 选项会应用覆盖层，突出显示设备屏幕上性能缓慢的区域，例如，绿色表示性能良好，红色表示缓慢；颜色越深，对性能的影响越大。


    使用 Xcode 重新运行你的应用，并在 Mac OS 的 iOS 模拟器工具栏中选择 **Debug** 然后选择 **Color Blended Layers**。一旦我们这样做，就可以看到
