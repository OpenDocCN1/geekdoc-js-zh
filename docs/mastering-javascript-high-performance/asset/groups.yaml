    ![](img/1005cbc7df81f2054919decd848f91da_184_0.png)


    正如预期的，我们扩展的 `div` 元素现在有一个红色覆盖层，表明这是一个确认的性能问题，这是不可避免的。要纠正这个问题，我们需要移除 CSS 渐变背景，它将再次显示为绿色。然而，如果我们必须设计规范包含渐变，则需要原生版本。


    当面对此类 UI 问题时，了解普通开发者工具和 Web 检查器之外的工具，并利用提供更好代码分析的移动平台工具是非常重要的。现在，在结束本章之前，让我们注意针对
    iOS 视图的一些特定内容。


    **WKWebView 框架**


    在编写本文时，苹果发布了 WebKit 框架，这是一个原生的 iOS 库，旨在用更先进、性能更好的网页视图替换 UIWebView；其目的是用整体性能更好的应用来替换依赖
    HTML5 和 JavaScript 的应用。


    *第 9 章*


    ** 167 **


    WebKit 框架在开发者圈中也被称为 **WKWebView**，它是可以添加到项目中的较新的网页视图。WKWebView 也是该框架的基类名称。该框架包含了原生
    iOS 开发者可以利用许多特性。这些包括监听触发原生 Objective-C 或 Swift 代码的函数调用。对于我们这样的 JavaScript 开发者来说，它包含了一个名为
    *Nitro* 的快速 JavaScript 运行时，该运行时从 iOS6 起就包含在 Mobile Safari 中。


    混合型应用的运行情况一直比原生代码差。但有了 Nitro JavaScript 运行时，假设我们的视图不会消耗过多的渲染内存（正如我们的颜色混合层示例所示），HTML5
    在性能方面就与原生应用具有平起平坐的地位。


    不过，WKWebView 确实有局限性；它只能用于 iOS8 或更高版本，而且它不像 UIWebView 那样具有内置的 Storyboard 或 XIB
    支持。因此，如果你是 iOS 开发的新手，使用此框架可能会是一个问题。**Storyboards** 仅仅是为渲染 iOS 用户界面而以特定方式编写的 XML
    文件，而 **XIB** 文件是 Storyboard 的前身。XIB 文件只允许一个视图，而 Storyboard 允许多个视图并可以在它们之间建立链接。


    如果你正在开发 iOS 应用，我鼓励你联系你的 iOS 开发主管，鼓励在项目中使用 WKWebView。


    如需更多信息，请查看苹果开发者网站上的 WKWebView 文档：https://developer.apple.com/library/IOs/documentation/WebKit/Reference/WKWebView_Ref/index.html。


    **总结**


    在本章中，我们学习了使用 HTML5 和 JavaScript 创建 iOS 混合应用的基础知识；学习了如何在 iOS 模拟器中运行应用程序并将 Safari
    Web 检查器连接到我们的 HTML 页面。我们还查看了 iOS 模拟器的颜色混合层，并了解了当 JavaScript 代码应用到设备渲染性能问题时，如何对其进行性能测试。


    现在我们已经到了最后的关头。对于所有上线到生产环境网站之前的 JavaScript Web 应用，我们需要对 JavaScript 和 Web 应用代码进行烟雾测试，并查看我们是否需要在最终部署之前进行任何最后的改进。这将在下一章中讨论。


    ** 169 **


    ## 应用性能测试


    在本书中，我们涵盖了在项目生命周期不同阶段提高 JavaScript 应用性能的各种方法。这包括从在项目生命周期的各个阶段选择合适的编辑器，到引入 JavaScript
    检查工具以帮助在部署前验证 JavaScript，再到使用构建系统，以及创建部署包或将最终代码与开发者友好的代码库分离。


    编写高性能 JavaScript 的真正秘密不在于我们脑海中的 JavaScript 知识量，而在于了解语言本身的关键“痛点”；其中一些痛点是 `for`
    循环、对象创建、未包含严格运算符、定时器等。此外，这一类还包括引入这些工具以便在部署之前更好地检查代码。


    与所有主要的 Web 应用项目一样，这里总会有某种形式的飞行检查，即 Web 应用上线前的最终待办事项。如果我们到目前为止结合了书中涵盖的工具，我们的 JavaScript
    应该足够稳固可以进行部署。但在这里，我们将更进一步。


    在本章中，我们将查看 **Jasmine**，这是一种 JavaScript 测试框架，它允许我们以我们尚未意识到的方式来测试代码。与过去如 JSLint
    等静态检查工具不同，这些测试将取决于应用程序的属性类型，还取决于一个我们尚未涵盖的概念：JavaScript 中的单元测试。


    简而言之，我们将涵盖以下主题：


    - 什么是 JavaScript 单元测试？

    - 使用 Jasmine 进行单元测试


    *应用性能测试*


    ** 170 **


    ### **什么是 JavaScript 单元测试？**


    简单来说，单元测试是一种应用程序框架或工具集，旨在以特定方式测试 JavaScript 或任何其他编程语言的代码，这种特定方式对于任何应用程序都是独特的。单元测试通常涵盖了标准静态检查工具中不存在的错误检查。它们被设计用于检查应用程序特定的错误。在其他编程语言中，单元测试通常设计用于检查项目的类和模型，并确保应用程序运行高效且正确。


    现在，JavaScript 和单元测试实践之间从未很好地结合在一起，这主要是由于 JavaScript 的动态性质。阻碍它们结合的某些因素包括开发者在无意中创建的许多错误，例如向不应具有特定变量类型的变量传递错误值、在应用程序对象属性需要数字时分配字符串等。


    然而，对于使用 JavaScript 的客户端应用程序，无论它们是在 Web 浏览器的 Web 上运行，还是托管在移动 App 的网页视图中，测试都变得越来越必要。现在市上有几十种专为
    JavaScript 测试设计的框架，但在这里，我将特别介绍一个名为 Jasmine 的框架。请记住，还有其他的测试框架如 Mocha 或 QUnit，但我们将涵盖
    Jasmine，因为它不需要第三方框架即可运行。


    ### **使用 Jasmine 进行单元测试**


    Jasmine 是一个 JavaScript 单元测试框架；它允许我们在不依赖 jQuery 等外部库的情况下编写 JavaScript。这对于一个需要极小内存占用的应用程序非常有帮助，例如我们在
    *第 9 章，为 iOS 混合型应用优化 JavaScript* 中讨论的 iOS JavaScript 应用。它还将代码限制在我们编写的代码中，并且不会因为其他供应商库的当前版本存在
    Bug 而产生问题。


