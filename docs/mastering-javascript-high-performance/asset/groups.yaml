    the newCustomers.CustomerID type, where we expect a number.


    Note that the type being compared is using a string rather than number, as you


    would expect in a console. This is because typeof, the JavaScript keyword for


    returning the type of a variable or property, returns the type name using a string;


    so, in order to match it, we use strings with the type name here as well.


    We can see on subsequent lines that we''ve added the remaining tests using the


    same style of comparison for each of the other tests. With that done, let''s open
    the


    SpecRunner.html page; we can see how our tests did in the **Spec List** view in
    the


    following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_196_0.png)


    Yikes! Three errors here, which is not good at all. Here, we were expecting a
    single


    error with the name of the customer not being displayed properly. But, our unit
    test


    has discovered that our application spec isn''t being followed as it was written.
    In the


    Jasmine framework, this page layout is pretty common; on initial load, you will
    see


    a full error list. If you wish to see the list of all the tests that passed and
    failed, we


    can click **Spec List** at the top, and we will see the full list as shown in
    the preceding


    screenshot.'
