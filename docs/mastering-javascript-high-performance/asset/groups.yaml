    前言


    欢迎阅读 *精通 JavaScript 高性能*。在书中，我们以一种有助于任何 JavaScript 开发者的方式介绍了 JavaScript 性能，无论你是该语言的新手还是经验老兵。本书涵盖了常见的性能瓶颈、如何在代码中查找性能问题以及如何轻松地修正它们。


    我们还回顾了优化 JavaScript 代码的现代方法，不仅依赖于对 JavaScript 的纯知识，还利用工具来帮助我们优化代码。这些工具包括 Gulp
    和 Node.js（它们有助于创建高性能的构建版本），以及 Jasmine（这一个 JavaScript 单元测试框架，可以帮助发现 JavaScript
    中的应用程序流问题）。我们还使用 Apple Xcode 针对 HTML 和 JavaScript 的调试工具对混合应用进行了调试。


    **本书涵盖的内容**


    *第 1 章*，*对速度的需求*，解释了对快速 JavaScript 的需求，讨论了为什么 JavaScript 代码在传统上很缓慢，并展示了可以帮助我们编写更快
    JavaScript 的编辑器类型，而无需改变我们的编码风格。


    *第 2 章*，*通过 JSLint 提高代码性能*，探索了 JavaScript 中的性能修复，并介绍了 JSLint——这是一个非常好的 JavaScript
    验证和优化工具。


    *第 3 章*，*理解 JavaScript 构建系统*，教你 JavaScript 构建系统及其对 JavaScript 性能测试和部署的优势。


    *第 4 章*，*检测性能*，涵盖了 Google 开发工具选项，并包含了关于如何使用 Web Inspector 提高我们 JavaScript 代码性能的审查。


    *前言*


    **[vi]**


    *第 5 章*，*运算符、循环和计时器*，解释了 JavaScript 语言中的运算符、循环和计时器，并展示了它们对性能的影响。


    *第 6 章*，*构造函数、原型和数组*，涵盖了 JavaScript 语言中的构造函数、原型和数组，并展示了它们对性能的影响。


    *第 7 章*，*放手 DOM*，包含了与编写高性能 JavaScript 相关的 DOM 顾，并展示了如何优化 JavaScript 使我们的 Web 应用程序渲染更快。我们还查看了
    JavaScript 动画并与现代 CSS3 动画进行了性能对比。


    *第 8 章*，*Web Workers 和 Promises*，演示了 web workers 和 promises。本章向你展示如何使用它们，包括它们的局限性。


    *第 9 章*，*为 iOS 混合应用优化 JavaScript*，涵盖了为移动 iOS Web 应用（也称为混合应用）优化 JavaScript。此外，我们查看了
    Apple Web Inspector 并了解如何将其用于 iOS 开发。


    *第 10 章*，*应用性能测试*，引入了 Jasmine，这是一个允许我们对 JavaScript 代码进行单元测试的 JavaScript 测试框架。


    **阅读本书所需的准备**


    对于本书，你需要对 JavaScript 有基础了解，了解如何在 JavaScript 中编写函数和变量，了解如何使用 HTML 和 CSS 等基础 Web
    技术，以及一些使用 Web Inspector（如 Chrome 开发者工具或 Firebug）的基础调试技能。


    你需要一个文本编辑器，最好是用于编写 HTML 和 JavaScript 代码的；可选范围已在*第 1 章*，*对速度的需求*中介绍。选择编辑器以及你所工作系统的管理员权限取决于你，也取决于你的预算。此外，*第
    9 章*，*为 iOS 混合应用优化 JavaScript* 严格涵盖了 iOS 开发中的 JavaScript；对于这一点，你需要一个 Xcode 版本和一个基于
    Intel 芯片的 Mac。如果你没有这些，你仍然可以跟着读，但理想情况下，大部分工作是在 Mac 上完成的。


    **本书的读者**


    本书是为中级 JavaScript 开发者编写的。如果你在 JavaScript 单元测试和编写自己的框架方面很有经验，并且能够理解 JavaScript
    中基于实例与基于静态的区别，那么这本书可能不适合你。此外，如果你对 JavaScript 非常新——比方说“我该如何使用函数？”——我建议也找一本初级 JavaScript
    书籍看看。


    *前言*


    **[vii]**


    但是，如果你已经接触 JavaScript 一段时间了，但对 node 风格性能测试、grunt 或 gulp 项目部署以及 JavaScript 单元测试还不熟悉，或者如果你想了解更多关于如何编写更快
    JavaScript 的知识，或者你只是想让你的代码库在不重构编码风格的情况下不落后，那么你读对了书。


    **约定**


    在书中，你会发现多种风格的文本，以区分不同类型的信息。以下是这些风格的示例及其含义解释。


    文本中的代码单词、数据库表名、文件夹名、文件名、文件扩展名、路径、虚拟 URL、用户输入和 Twitter 账号显示如下：“为了解决这个问题，现代浏览器已经实现了名为
    console.time 和 console.timeEnd 的新控制函数。”


    代码块设置如下：


    ```html

    <!DOCTYPE html>

    <html

    <head>

    <meta charset="utf-8">

    <title>Jasmine Spec Runner v2.1.3</title>

    ```


    **新术语**和**重要词汇**用粗体显示。你在屏幕、菜单或对话框中看到的单词看起来像这样：“点击**下一步**按钮将你带到下一个屏幕。”


    警告或重要注释出现在像这样的框中。


    提示和技巧以像这样所示。


    **读者反馈**


    我们随时欢迎读者的反馈。让我们告诉我们对这本书的看法——你喜欢或可能不喜欢的地方。


    *前言*


    **[viii]**


    如需向我们发送一般性反馈，只需向 feedback@packt.com 发送电子邮件，并在邮件主题中注明书名即可。


    如果你有自己擅长的领域，并对编写或贡献书籍感兴趣，请参阅我们在 www.packt.com/authors 上的作者指南。


    **客户支持**


    既然你现在是 Packt 书籍的幸运所有者，我们有很多方法帮助你充分利用购买。


    **下载示例代码**


    你可以通过 http://www.packt.com 账户下载你购买的所有 Packt 书的示例代码。如果你是在其他地方购买的这本书，可以访问 http://www.packt.com/support
    并注册以便我们将文件发送给你。


    **下载本书的彩色图像**


    我们还为你提供了一个包含书中截图/图表的彩色 PDF 文件。彩色图像将帮助你更好地理解输出的变化。你可以从此处下载该文件：https://www.packt.com/sites/default/files/downloads/7296OS_ColorImages.pdf。


    **错误**


    尽管我们尽力确保内容的准确性，但错误会出现。如果你在我们的书籍中发现错误——可能是文本或代码中的错误——如果你能向我们报告，我们将不胜感激。这样做可以避免其他读者沮丧，并帮助我们改进本书的后续版本。如果你发现任何错误，请通过访问
    http://www.packt.com/submit-errata 进行报告，选择你的书籍，点击**错误提交提交表单**链接并输入错误详情。一旦你的错误通过验证，你的提交将被接受，错误将上传到我们的网站，或添加到该标题下的任何现有错误列表中。你可以通过
