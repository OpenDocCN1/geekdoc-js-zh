    ## Chapter 1


    ## [ 15 ]


    ### Summary


    In this chapter, we looked at the history of JavaScript''s performance and learned
    how it became a focus for developers and businesses. We also reviewed the four
    types of JavaScript code editors, and we now understand how to move away from
    large IDEs for brand new projects, working down to lightweight editors for small
    updates and changes.


    In the next chapter, we will look at how we can keep our code''s performance quality
    high when using a lightweight editor.


    ## [ 17 ]


    ### Increasing Code Performance with JSLint


    In this chapter, we will learn about confirming performance fixes in JavaScript,
    and we will also learn about JSLint. There are two very good JavaScript validation
    and optimization tools, and we will learn how to use both and how to set the options
    to get the best code performance optimization results.


    So, we are going to cover the following topics in this chapter:


    - Checking the JavaScript code performance

    - What is JavaScript linting?

    - Using JSLint


    ### Checking the JavaScript code performance


    Before we can start talking about how to improve our JavaScript performance, we
    have to ask ourselves a hard question about what code improvements actually improve
    the JavaScript application speed. In the earlier days of JavaScript development,
    many performance improvements were mainly implemented based on known JavaScript
    coding standards, watching for global variables without the variable being declared,
    keeping the variable scope in line, and so on without much verification beyond
    anything visual inside a website.


    Today, we have new APIs to take advantage of this problem and scope solutions
    for small parts of our code.


    ## *Increasing Code Performance with JSLint*


    ## [ 18 ]


    ### About the console time API


    To solve this issue, modern browsers implemented new console functions called
    console.time and console.timeEnd. What these two functions do is allow a developer
    to specify a label for the console.time and console.timeEnd functions, measure
    the amount of time a code block between the time and timeEnd instances would need
    to function, and finally, show the result in a console.


    Let''s take a look at how to use console.time() and console.timeEnd() in a working
    example. Here, in our 02_01.js example file, we have a simple code block creating
    100 simple JavaScript objects using the new keyword inside a for loop, as shown
    in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_36_0.png)


    ### Downloading the example code


    You can download the example code files for all Packt books you have purchased
    from your account at http://www.packtpub.com. If you purchased this book elsewhere,
    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.


    ## *Chapter 2*


    ## [ 19 ]


    As we can see on line 5, we call the console.time function and, inside as its
    parameters, we have the 100 objects in Loop string label for our code block. We
    then add a NewObj object constructor on line 7. Following that, we have a simple
    JavaScript for loop on line 11 that creates 100 instances of the NewObj constructor,
    passing in the value from each instance from the for loop on line 13. Finally,
    on line 16, we end the time block with the console.timeEnd function, using the
    same label we declared at the start of the time instance.


    Let''s try this code out in a browser; I''ll be using Google Chrome for this,
    but any modern browser, such as the latest version of Firefox, Internet Explorer,
    or Safari, should be fine. We''ll open about:blank in our browser''s URL so that
    we can have a simple test environment to work in, and then we will open our Web
    Inspectors or browser debuggers, paste the code snippet into our console, and
    press *Enter*.


    Here are the results that are displayed in my browser:


    ![](img/1005cbc7df81f2054919decd848f91da_37_0.png)


    ## *Increasing Code Performance with JSLint*


    ## [ 20 ]


    If we take a look just before the undefined we check the console.time output,
    we see 100 in Loop. So, with performance-testing, we can see what happens if we
    tweak our code. Here is an updated sample of 02_01.js:


    ![](img/1005cbc7df81f2054919decd848f91da_38_0.png)


    ## *Chapter 2*


    ## [ 21 ]


    ![](img/1005cbc7df81f2054919decd848f91da_39_0.png)


    ### When to use console.time


    The console.time() method allows developers to understand what affects performance
    and what doesn''t. When using console.time(), there may be some variation in results
    depending on what browser you are using.


    ### What is JavaScript linting?


    Before we talk about JSLint, we need to discuss linters in general, what they
    are, and how they influence performance. A lint is, simply put, a code-validation
    checker. It allows a developer to point to a code file and check for errors or
    potential issues ranging from spacing issues to pure code errors.


    Linters typically receive the contents of a file and build a source tree. In the
    case of JavaScript, this can be objects such as global variables, functions, prototypes,
    arrays, and so forth. After the tree is created, analyzers will take parts of
    the source tree and report anything an analyzer was written would flag. Lastly,
    any rule readers or parameters flagged before running the linter will look for
    any options to ignore and generate a final report.


    ### About JSLint


    JSLint is a JavaScript code analysis tool that was written in JavaScript by Douglas
    Crockford, who also helped in popularizing JSON in software development. JSLint
    can be used in many ways, as mentioned in *Chapter 1*, *The Need for Speed*. Many
    IDEs have features beyond just editing code; some of these features include things
    such as error checking and, in some cases, the IDEs use a version of JSLint.


    ## [ 23 ]


    For this chapter we will discuss how to use JSLint using the official JSLint online
    site at http://www.jslint.com/, as shown in the following screenshot:


    ![](img/1005cbc7df81f2054919decd848f91da_41_0.png)

