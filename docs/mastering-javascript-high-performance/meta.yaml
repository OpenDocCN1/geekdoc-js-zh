    # Node.js


    Node.js is a JavaScript interpreter for your operating system. For JavaScript
    developers, the concept of JavaScript code working as a backend code like Java
    or C# may seem odd, but has been shown to work in new ways. For example, the community
    of Node.js developers has created plugins to create custom-built, JavaScript-based
    applications for the desktop.


    This puts JavaScript in a very new place. When traditional application developers
    complain about JavaScript, one of the main complaints is that JavaScript cannot
    read or write files to a hard drive, which is usually a very basic feature for
    a programming language. Node.js allows custom objects to interact with the operating
    system. These include objects such as FS or FileSystem that allow for reading
    and writing files and work pretty much like a console in a web browser.'
