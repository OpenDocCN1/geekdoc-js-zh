  md: '# # 7 Hands off the DOM


    In this chapter, we will review the DOM in relation to writing high-performance
    JavaScript, and see how to optimize our JavaScript to render our web applications
    visibly faster.


    We will also take a look at JavaScript animations and test their performance against
    modern CSS3 animations; we will also test for paint redraw events in the DOM and
    quickly test for scrolling events attached to a page that may affect performance.


    We will cover the following topics in this chapter:


    +   - Why worry about the DOM?

    - Don''t need a MV-whatever library?

    - Creating new objects using the createElement function

    - Animating elements

    - Understanding paint events

    - Pesky mouse scrolling events


    # Why worry about the DOM?


    The Document Object Model (DOM) is how our HTML content is presented in our web
    browser. It''s not quite the same as the source code; the DOM is the live updated
    version of our source code as we make updates to a web application in a web browser.


    We can say that fast, optimized JavaScript will certainly help our applications
    run and perform better, as we learned in previous chapters. But it''s important
    to understand that the DOM is just as important as JavaScript performance as understanding
    how to optimize a for loop.'
  merge: -1
  pgno: 131
- img_proc: false
  md: 'In the early days of the Web, as we web developers didn''t think about the
    DOM too much. If we think about how far JavaScript has come, we can see that many
    changes have come to the world of web development. If we reminisce about the pre-Google
    days of the Web, we know websites were pretty simplistic, and user interaction
    was mainly limited to hyperlink tags and another JavaScript window.alert() function
    to show some form of interaction ater.


    As time passed, we encountered Web 2.0, or rather the point where Asynchronous
    JavaScript and XML (AJAX) came into being. If you''re not familiar with AJAX,
    I would like to sum it up: AJAX applications allow developers to pull content
    from external sources, typically XML files (this is the X in AJAX).


    With AJAX, website content became dynamic, meaning developers didn''t have to
    rely on for backend technologies to refresh a web page with updated data. Suddenly,
    the need for stronger JavaScript came into play. Businesses and their clients
    no longer wanted to have a website responding with page flashes (or sites that
    used backend technologies to update the page with a POST submission method), all
    the more so with sites such as Google Maps and Gmail seemingly pushing the idea
    of the web as a platform for software rather than a desktop operating system.


    # Don''t we need an MV-whatever library?


    Today, we have frameworks that help with the heavy lifting of some type of this
    application; AngularJS, Backbone.js, Knockout.js, and jQuery are a few libraries
    that come to mind.


    For this book, however, we will stick to vanilla JavaScript for two reasons. The
    first reason is that entire books are dedicated to many of these libraries and
    talk about performance and various levels of experience, all of which are good
    but beyond the scope of this book. The second reason is that most developers typically
    don''t need these libraries to build a project.


    Remember that all the JavaScript libraries mentioned here, are also found on the
    Web, are again all JavaScript! For most projects, we shouldn''t need a library
    to make the project we want to build it; moreover, many of these libraries come
    with extra code.'
  merge: -1
