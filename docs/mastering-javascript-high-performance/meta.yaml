    pattern.

    Using promises can help us multi-thread code as long as we don''t need a specific
    value in the chain immediately. We also get performance benefits by moving some
    of our code off our main JavaScript thread using promises.


    # Summary


    In this chapter, we reviewed how to use web workers, and the limitations web workers
    have technically and conceptually in a real-life application. We also worked with
    JavaScript promises, where we learned common keywords related to promises such
    as respond and revoke. We saw how to use the then function to chain our promises
    in sync with our main application thread, to create a multi-threaded JavaScript
    function.


    In the next chapter, we will see how working from a mobile device such as iOS
    and Android can affect our performance and how to debug performance on a device.'
