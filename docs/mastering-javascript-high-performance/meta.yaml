  md: '# Optimizing JavaScript for iOS Hybrid Apps


    Sadly, the fact that hybrid apps do not perform as well as native apps still holds
    true. Now, don''t let that dismay you as hybrid apps have a lot of good features!
    Some of these are as follows:


    +   - They are (typically) faster to build than using native code

    - They are easier to customize

    - They allow for prototyping concepts for apps

    - They are easier to hand off to other JavaScript developers rather than finding
    a native developer

    - They are portable; they can be reused for another platform (with some modification)
    for Android devices, Windows Modern apps, Windows Phone apps, Chrome OS, and even
    Firefox

    - They can interact with native code using helper libraries such as Cordova


    At some point, application performance will be limited to the hardware of the
    device, and it is recommended you to move to native code. But, how do we know
    when to move? Well, this can be done using **Color Blended Layers**. The **Color
    Blended Layers** applies an overlay that highlights slow-performing areas on the
    device display, for example, green for good performance and red for slow performance;
    the darker the color, the more impactful will be the performance.


    Rerun your app using Xcode, and in the Mac OS toolbar for iOS Simulator, select
    **Debug** and then **Color Blended Layers**. Once we do that, we can see that
    our iOS Simulator shows a green overlay; this shows how memory iOS is using to
    process our rendered view, both native and non-native code, as shown here:


    | iOS Simulator - iPhone 6 - iPhone 6 / iOS 8.1 (12B411) |

    | Carrier | 3:12 PM |

    | Loop Completed! |


    Currently, we can see a mostly green overlay with the exception of the status
    bar elements, which take up more render memory as they overlay the web view and
    have to be redrawn over that object repeatedly.'
  merge: -1
