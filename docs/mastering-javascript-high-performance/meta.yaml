  md: "# Web Workers and Promises\n\nThe postMessage function is a built-in function\
    \ for ECMAScript that either sends data to an assigned worker, or if no worker\
    \ is assigned, it posts a message back to any parent JavaScript worker that might\
    \ be listening. Now let's go back to our HTML page script and take a look at line\
    \ 20; this is shown in the following screenshot:\n\n```\nfunction function2()\
