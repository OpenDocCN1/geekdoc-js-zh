  md: '# Chapter 4


    In the Timeline inspector, there are four types of events that the Timeline panel
    shows. These are Loading, Scripting, Rendering, and Painting events. I''ve loaded
    the example file (032), discussed in an earlier section, showing the events running
    through the Timeline panel, as seen in the following screenshot:


    ![](bbox=[0.176, 0.23, 0.821, 0.638])


    # The Loading event


    The Loading event handles requests and responses; typically these are loading
    external scripts and files as POST requests for data leaving the page. Loading
    events also include the initial parsing of HTML code. In Google Chrome''s Timeline,
    these show up in blue.


    [ 75 ]'
  merge: -1
  pgno: 93
- img_proc: false
  md: '# The Scripting event


    The Scripting event occurs when the browser reads and interprets JavaScript code.
    In the Timeline panel, you can expand Scripting event and see at what point a
    function was received in the browser. Scripting events appear as yellow lines
    in Google Chrome.


    # The Rendering event


    The Rendering event occurs when image files and scripts affect the DOM; this can
    be when an image is loaded without a size specified in an image tag, or if a JavaScript
    file updates the CSS of a page after the page is loaded.


    # The Painting event


    The Painting event is the last type of events and typically is used in updating
    the UI. Unlike Rendering event, the Painting event occurs when the browser redraws
    an image on the screen. For desktop JavaScript development, Painting events aren''t
    usually a concern, but strongly concerning when we start looking at mobile browsers.


    Typically the Painting event is forced when an element''s display is updated from
    its original. They can also be triggered by updates to an element, such as an
    element''s top or left positioning.


    # The Profile panel


    The Profile panel helps a developer analyze a web page''s CPU profile and take
    heap snapshots of the JavaScript used. A CPU profile snapshot is helpful when
    it comes to checking large complex applications to see what files may cause issues
    in terms of object size.


    A JavaScript heap snapshot is a compiled list of objects found in the page''s
    overall JavaScript. This includes not only the code written by us, but also the
    code built into the browser, such as the document or console objects, giving an
    overall list of all possible objects in an application.'
