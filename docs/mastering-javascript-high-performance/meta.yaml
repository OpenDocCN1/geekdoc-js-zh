    We then use console.time function to track how long a process occurs. As this
    code is now single-threaded, we would see a longer time for the timeEnd function.
    Let''s run our code and take a new look at the screenshot:


    ![](bbox=[0.176, 0.287, 0.823, 0.513])


    That''s not bad; here time is much slower than our multi-threaded Worker example.
    That''s not a bad performance boost; it''s minor but still helpful. Now, one web
    worker takes a lot of time to trigger the next function that exists on a separate
    thread from the main thread. We need to have some way to call a function when
    a function completes asynchronously, and for that have JavaScript promises.


    # Promises


    JavaScript promises are also a JavaScript code; the idea of promises is you have
    a function that is chained to a main function, and is fired in sequential order
    as it is. Here is how it is structured. We create a new object using the Promise
    object, and inside the parentheses, we write the main function, and assign the
    new promise to a variable.


    One thing to note before is that JavaScript promises are EcScript 6-specific.
    So, for this section, we will need to test our code in an ECMScript 6-ready browser
    such as Chrome.'
