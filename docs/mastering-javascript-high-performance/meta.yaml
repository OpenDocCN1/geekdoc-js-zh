    # # IntelliJ IDEA 13.1

    Work Miracles in Java and Beyond


    Typically, IDEA is known best as a Java-focused IDE, but it includes the same
    tools as WebStorm many more. Like Visual Studio, it can handle multiple languages,
    but that comes at the cost of performance. For example, if we started in both
    environments on a slower system, we might notice much less on IDEA than WebStorm
    when working day-to-day on JavaScript projects.


    Again, this is due to the large number of features the IDEs require to be running
    in the background which is more marked on IDEA; so, again, starting off in an
    IDE is great to build a well-structured code base early on, but as time progresses
    and we work repeatedly in a slow editor, we will need something faster with a
    good base already set.


    With in mind, many developers who don''t see performance issues with an IDE tend
    to stick with the IDE they''ve chosen; other developers, however, move on to editors
    such as the ones in the next section.


