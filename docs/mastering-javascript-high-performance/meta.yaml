  md: 'The WebKit framework, also known in developer circles as WKWebView, is a newer
    web view that can be added to a project. WKWebView is also the base class name
    for this framework. This framework includes many features that native iOS developers
    can take advantage of. These include listening for function calls that trigger
    native Objective-C or Swift code. For JavaScript developers like us, includes
    a faster JavaScript runtime Nitro, which has been included with Mobile Safari
    since iOS6.


    Hybrid apps always run that native code. But with the Nitro JavaScript runtime,
    HTML5 has footing with native apps in terms of performance, assuming that your
    view doesn''t consume too much memory as shown in our color blended examples.


    WKWebView does limitations though; it can only be used for iOS8 or it doesn''t
    have built-in Storyboard or XIB support like UIWebView. So, using this framework
    may be an issue if you''re new to iOS development. Storyboards are simply XML
    files coded in a specific way for iOS user interfaces to be rendered, XIB files
    are the precursors to Storyboard. XIB files allow for only one view whereas Storyboards
    allow multiple views and link between them them.


    If you are working on an iOS app, I encourage you to reach out to your iOS developer
    lead and encourage the use of WKWebView in your projects.


    For more information, check Apple''s documentation of WKWebView at their developer
    site at https://developer.apple.com/library/ios/documentation/WebKit/WKWebView_Ref/index.html.


    # # Summary


    In this chapter, we learned the basics of creating a hybrid-application for iOS
    using HTML5 and JavaScript; we learned about connecting the Safari Web Inspector
    to our HTML page while running an application in iOS Simulator. We also looked
    at Color Blended Layers for iOS Simulator, and saw how to test performance from
    our JavaScript code when it''s applied to device-rendering performance issues.


    Now we are down to the wire. As for all JavaScript web apps before they go to
    a production site, we need to smoke-test your JavaScript and web app code and
    see if we need to perform any final improvements before final deployment. This
    is discussed in the next chapter.'
