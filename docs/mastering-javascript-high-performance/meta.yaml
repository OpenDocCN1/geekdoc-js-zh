  md: '# Application Performance Testing


    Here, we can see how our tests are written; on line 2, we have our describe keyword
    that wraps our tests in a single container should have a larger test file. All
    tests from our documentation spec can be found with each keyword; test number
    1 is on line 4 and on line 5, we have the first test''s expect keyword checking
    the newCustomers.CustomerID type, where we expect a number.


    Note that the type being compared is a string rather than number, as you would
    expect in a console. This is because typeof, the JavaScript keyword for returning
    the type of a value or property, returns the type name as string; so, in order
    to match it, we use strings with the type name here as well.


