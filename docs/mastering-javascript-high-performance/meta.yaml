  md: '# 10

    Application Performance

    Testing


    In this book, we''ve covered various ways of increasing our JavaScript''s application
    performance at different stages of a project''s life cycle. This includes activities
    ranging from choosing a proper editor at various stages of a project''s lifespan,
    incorporating JavaScript linters to help proof our JavaScript before deployment
    to using build systems, and creating a deployment package or build separating
    final code from the developer-friendly code base.


    The real secret in crafting high performing JavaScript is not the amount of JavaScript
    knowledge in our heads, but knowing the key "pain points" of the language itself;
    some of these pain points are the few loops, object creation, not incorporating
    strict operators, timers, and so on. Moreover, this category also includes incorporating
    these tools to better check our code before it is deployed.


    Like all major web application projects, there is always some form of pre-flight
    check here, a final list of to-dos before a web application goes live. If we incorporate
    the tools covered in this book to this point, our JavaScript should be solid enough
    for deployment. But here, we will take one step further.


    In this chapter, we are going to take a look at Jasmine, a JavaScript testing
    framework that will allow us to test our code in ways we haven''t realized yet.
    Unlike past linters such as, JSLint, these tests will rely on an application''s
    property types, and also on a concept we have yet to cover: unit testing in JavaScript.


    In short, we will be covering the following topics:


    +   * What is unit testing in JavaScript?

    * Unit testing with Jasmine'
  merge: -1
  pgno: 187
- img_proc: false
  md: '# What is unit testing in JavaScript?


    Unit testing, simply put, is an application framework or toolset designed to test
    JavaScript or the code of any other programming languages in a specific way that''s
    unique to any application. Unit tests typically cover error checking that doesn''t
    exist inside linters. They are designed for application-specific errors. In other
    programming languages, unit tests are typically designed to check a project''s
    classes and models, and to ensure that applications are running efficiently and
    correctly.


    Now JavaScript and unit-testing practices have never been associated well with
    one another, primarily due to the dynamic nature of JavaScript. Some factors that
    hamper the association include many mistakes created unknowingly by developers,
    passing wrong values to variables that shouldn''t have specific variable type,
    assigning a string when an application''s object property requires a number, and
    so on.


    Moving forward, however, for client-side applications using JavaScript, whether
    they''re on the web in a web browser or hosted inside a mobile app''s web view,
    testing becomes more and more necessary. Now there are dozens of frameworks out
    designed for JavaScript testing, but here, I will cover one in particular called
    Jasmine. Keep in mind that there are alternative testing frameworks such as Mocha
    or QUnit, but we will cover Jasmine as it doesn''t require third-party frameworks
    to run.


    # Unit testing with Jasmine


    Jasmine is a JavaScript unit-testing framework; it allows us to write JavaScript
    without relying on external libraries such as jQuery. This is helpful for an application
    that requires a very tiny footprint in memory such as our JavaScript application
    in iOS, described in Chapter 9, Optimizing JavaScript for iOS Hybrid Apps. It
    also restricts the code that we''ve written, and there''s no bug due to a framework
    in a current build of another vendor''s library.'
  merge: -1
