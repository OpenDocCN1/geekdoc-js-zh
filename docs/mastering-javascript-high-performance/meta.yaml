  md: '# Mid-range editors


    Mid-range editors work well with projects already the early phases of development
    or projects that are very small. An exception to using an IDE early on small projects.
    These are typically content-management system-based sites, such as WordPress,
    Joomla, Drupal, and so on, where most of the JavaScript is written for the developer
    and tested easily.


    They are also useful for light code hinting, and some connect to either a repository
    or from FTP to push code. The real differences between these and an IDE are the
    speed of development and the lack of code quality features. Many of these editors
    only look for glaringly obvious errors in the code, such as missing a semicolon
    in JavaScript, they are very useful all-round editors.


    # Panic''s Coda editor


    Coda is a Mac-only editor, but it supports HTML, CSS, and JavaScript coding. The
    following screenshot shows the user interface of Coda:


