  md: '# Operators, Loops, and Timers


    In previous chapters, we reviewed the basic tools used in JavaScript development.
    We looked at IDEs, code editors, and JSLint, a JavaScript code validator that
    not only showed where our code contained issues, but it also gave us warnings
    and suggestions on how to improve our code.


    We also learned about `console.time` and `console.time` methods that allowed us
    to quickly test our code execution performance. Finally, we learned about creating
    a basic system to ensure our final code is optimized and bug-free.


    It''s important to say that all of these tools and techniques are essential to
    write high-performance code, not because of the JavaScript you know, but because
    of the JavaScript is a language that anyone can pick up and start writing code
    without knowing object-oriented programming or knowing a pattern such as **Model
    View Controller (MVC)**: over the years, however it has been modified to accommodate
    these higher-level programming concepts (hacked or otherwise).


    The flip of an easy-to-use language is that it''s very easy to write bugs or even
    non-optimized code; this effect is doubled and even tripled if we''re writing
    complex JavaScript. As mentioned in past chapters, one characteristic of JavaScript
    developers in general is that *we are human, and we make mistakes*. Much of this
    is a lack of awareness on the part of the developer, which is using building systems
    and code checkers such as JSLint is important, long before we write perfect high-performance
    JavaScript; if we don''t, these tools have covered us.


    In this chapter, we are leaving tools and build systems behind and are getting
    into JavaScript performance concepts head-on, breaking up the subject matter across
    two chapters, starting with following topics:


    +   * Operators

    * Loops

    * Timers'
