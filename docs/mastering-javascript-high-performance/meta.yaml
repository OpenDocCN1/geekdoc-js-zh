    \ (which cannot be changed).\n    let authors_name = \"Chad Adams\";\n\n    override\
    \ func viewDidLoad() {\n        // If you have an error here, our compiler complains\
    \ that we can't change the name of \"authors_name\"\n        authors_name = \"\
    Chad Adams\"; // Cannot assign to variable in let\n    }\n\n    override func\
    \ didReceiveMemoryWarning() {\n        // Dispose of any resources that can be\
    \ recreated.\n    }\n}\n```\n\nWithout getting too technical in iOS development,\
    \ we can see that, on assigning a constant variable in Swift, if I attempt to\
    \ change the variable as in the preceding screenshot, my code flags an error.\n\
    \nNow if I change the let authors_name constant to a dynamic variable (just like\
    \ in JavaScript), the error itself corrects, as in the following screenshot, and\
    \ removes the error displayed in the IDE:"
