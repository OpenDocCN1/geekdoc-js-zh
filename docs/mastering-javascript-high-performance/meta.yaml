  md: '# 3 Understanding JavaScript Build Systems


    In this chapter, we will learn about JavaScript build systems and their advantages
    for JavaScript performance testing and deployment. We will also incorporate JavaScript
    code testing into our build system using the knowledge we gained about JSLint
    in the last chapter.


    In short, we are going to cover the following topics in this chapter:


    +   - What is a build system?

    - Setting up our build system

    - Creating a distribution


    # What is a build system?


    Typically, a build system is an automated process that assists developers writing
    clean optimized code. Now, we may think that such thing would be standard across
    all programming languages. Now, compiled languages usually have a compiler; a
    compiler takes a program written by following a language specification, and creates
    output code compatible with the target machine.'
  merge: -1
  pgno: 53
- img_proc: false
  md: "# Compiling code by example\n\nCompilers typically work through a spec when\
    \ a code file is set for processing. To keep a compiler from crashing from bad\
    \ code, a compiler is set up with many error checkers that stop the compiler beforehand\
    \ and display an alert, blocking the compilation process. Some IDEs allow you\
    \ to see some of your mistakes before attempting to run your code. The following\
    \ screenshot shows a simple Swift file being checked while editing:\n\n```\n//\
    \ ViewController.swift\n// compilerError\n// Created by Chad Adams on 9/28/14.\n\
