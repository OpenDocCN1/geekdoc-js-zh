  md: '# Getting faster


    JavaScript, by nature, is a pretty easy language to build. One advantage that
    JavaScript has that JavaScript is an interpreted language, which means that the
    code developed can be deployed, and even work, according to a project''s specifications.


    Non-compiling code is both good and bad. Without the need to compile, a developer
    can quickly build a web page on a full web application in a very short amount
    of time. Also, it''s very approachable for new- or intermediate-level developers
    in general, making staffing for web projects bit easier.


    Now, what''s about not using a compiled language that JavaScript doesn''t compile
    and common errors tend to get missed by the developers involved; even if the code
    appears to be working, it may not be working efficiently. During the days we were
    most likely to be Notepad on Windows and a web browser, any errors were apparent
    to a user only, leaving out any issues with regard to code performance.


    Today, we have various tools set and build systems on top of our JavaScript skills.
    It''s important to understand that having deep JavaScript knowledge can help you
    write and review better JavaScript code, but in many cases, as developers are
    only human, and we make common mistakes that affect our JavaScript code–not adding
    spaces after a function''s brackets or forgetting a semicolon at the end of our
    code statements, for example.


    Choosing a proper editor for a given project that includes basic error-checking
    before writing a single line of JavaScript can improve the performance and quality
    of our codebase dramatically, without learning anything new in terms of the inner
    workings of JavaScript.


    # Selecting an effective editor


    Picking a good editor can greatly affect your code quality as well as your productivity
    in terms of how fast a project can be coded. Noted in the preceding section, we
    developers are human, and we make mistakes, and it''s easy for us to write bad
    JavaScript, no matter what the skill level of the developer is. So, it''s important
    for us to know when it is appropriate to use one editor over the other. To cover
    this, I will be breaking different JavaScript code editors into one of four categories
    follows:


    +   - Integrated Development Environments


    +   - Mid-range editors


    +   - Lightweight editors


    +   - Cloud-based editors'
  merge: -1
  pgno: 21
- img_proc: false
  md: '# The Need for Speed


    Each type of editor has its own strengths and weaknesses, and we will review when
    to use one over the other, starting with the biggest. The intent is to show when
    it''s appropriate to move from a larger code editor to a smaller editor in terms
    of JavaScript development.


    # Integrated Development Environments (IDEs)


    Integrated Development Environments (IDEs) are very high-end software tools that
    not only provide code editing, but also code-organization tools, built-in testing
    tools, code-optimization scripts, source-control integration, and usually deep
    code hinting and completion support.


    The downside of using an IDE is that the IDE is designed to constantly check the
    code as the file is being updated while code is being written. This causes the
    editor to be sluggish and unresponsive at times and painful to use on slower systems.
    Typically, JavaScript developers tend to dislike the sluggishness of these IDEs
    and move on to faster editors.


    This can cause issues when large projects kick off, and users use an editor that
    is ill-suited to structure JavaScript in a proper manner. It''s usually recommended
    that you start with an IDE and work down when a project only requires minor tweaks.


    Some popular IDEs for JavaScript are discussed in the upcoming sections.


