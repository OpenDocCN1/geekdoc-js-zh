  md: "# Understanding instances\n\nNow the way to fix this issue is to change the\
    \ name of the AuthorName function to camel case; that is, we change A to lowercase\
    \ (a). But here we're going to indicate this as an instance, and we may ask why?\
    \ Well in JavaScript, we write a new object, a variable, a function, and an array,\
    \ and so on, we are creating objects.\n\nBy using instances, we keep object usage\
    \ down. In JavaScript, an instance is only counted once in memory. For example,\
    \ let's say we use a document getElementById() method. Every variable saved with\
    \ that if it's an object we create with the new keyword, count is only counted\
    \ once rather than reused for every occurrence of getElementById(). By using the\
    \ new keyword, we create an instance of our constructor (in this case AuthorName)\
    \ that allows us to reuse that function in the same manner that we typically use\
    \ it.\n\n# Creating instances with 'new'\n\nCreating a new instance is pretty\
    \ easy; we can simply call a new instance to run a function, as shown in the following\
    \ screenshot, using the new keyword in our console.log on line number 11:\n\n\
    ```\n```javascript\n/*\n * Chapter 6 - 03\n */\n\nfunction AuthorName(author)\
    \ {\n  \"use strict\";\n  return author;\n}\n\nconsole.log(new AuthorName('Chad\
    \ Adams'));\n```\n```\n\nIf we run this code inside a blank page or a simple HTML\
    \ page, we will see that our log doesn't output the way we expect. But we can\
    \ see an object return AuthorName {} in the Console panel of the Development tools\
    \ in Chrome. What this shows us is that we are actually logging a new instance\
    \ of an object, but not the author's name."
  merge: -1
