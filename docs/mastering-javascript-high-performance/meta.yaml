  md: "# What timers and how do they affect performance?\n\nTimers are built-in functions\
    \ of JavaScript that allow the execution of inline JavaScript code or permit functions\
    \ to be called at a specific point of time after, or repeatedly, the life cycle\
    \ of a JavaScript application.\n\nTimers are a great tool in a JavaScript developer'sにつ,\
    \ but they have their own issues when it comes to performance. Consider the fact\
    \ that the JavaScript language is single-threaded, which means that every line\
    \ of code in our application cannot be fired at the exact same time as another\
    \ piece of code in our application. To get around this, we use a built-in function\
    \ setTimeout.\n\nThe setTimeout method takes two parameters to delay a block of\
    \ code from executing; the first is either the name of a function with our code\
    \ or a line of JavaScript code it, followed by an integer specifying the extent\
    \ by which we want to delay code execution which is in milliseconds.\n\nOn the\
    \ surface, the setTimeout may seem harmless, but consider this. Let's say we have\
    \ two functions, both triggered by one setTimeout with a for loop that prints\
    \ an incremented value of the for loop to the console window. Each function will\
    \ have a different maximum value and the lower count will be slightly after the\
    \ larger functions of the for loop. Let's take a look at the code sample here:\n\
    \n![](bbox=[0.218, 0.525, 0.781, 0.823])\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta http-equiv=\"Content-Type\" type=\"text/html; charset=UTF-8\" />\n<title>Chapter\
    \ 5 - 07</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nfunction\
    \ delay30000() {\n  console.log('delay30000()');\n  for(var i=0; i<30000; i++)\
    \ {\n    console.write(\"Writing to the console.\" + i);\n  }\n}\n\nfunction delay30000()\
    \ {\n  console.log('delay30000()');\n  for(var i=0; i<30000; i++) {\n    console.write(\"\
    Writing to the console.\" + i);\n  }\n}\n\nwindow.onload = function() {\n  setTimeout(delay30000(),\
    \ 50);\n  setTimeout(delay30000(), 150);\n};\n</script>\n</body>\n</html>\n```"
  merge: -1
  pgno: 111
