    is working; the standalone version includes some sample JavaScript''s been set
    up with unit tests. To run a set of unit tests in Jasmine, we will need to structure
    a SpecRunner page. A SpecRunner is a Jasmine-specific HTML page displaying the
    unit results. If we open the standalone versions SpecRunner.html file in our browser,
    we can see the example test results demonstrating all tests that passed, as shown
    in the following screenshot:


