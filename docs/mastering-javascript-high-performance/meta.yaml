  md: '# Chapter 3


    Inside the jquery folder, there are some interesting files. We have a README.md
    (.md is short for markdown, a type of text format) explaining jQuery.


    The folder has two JSON files, one called bower.json and another called package.json.
    The package.json file handles the NPM package information while the bower.json
    file handles any dependent packages and notifies NPM to include those as on installation
    request.


    If you''re wondering what the bower.json file does, it''s another way to update
    source code from a repository. Like the NPM registry, the bower.json file uses
    its own; the difference is that it can use a JSON file in a project and update
    based on the setting stored in the JSON file.


    Lastly, the most important folders are the src folder (or source folder) and the
    dist folder structure is a common convention for NPM, where the source of a project
    with debug information is saved in the src folder, while the final tested output
    lives in the dist folder.


    Since we aren''t debugging the source for Query, all we really need to worry about
    the dist folder, where we can find the jquery.js file and the jquery.min.js file—the
    same library files typically used in jQuery projects. It''s important to know
    this for our build systems as we will want to copy those into the distribution
    folder for our build system.


