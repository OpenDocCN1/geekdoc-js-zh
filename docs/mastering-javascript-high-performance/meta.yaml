    # Using the debugger keyword


    A little feature in JavaScript programming is the debugger keyword; it''s a very
    simple helper function. When running code, it will trigger the Sources panel or
    another JavaScript debugger connected to break automatically; this is helpful
    when going over large code bases or having trouble breaking on a certain line.


    Let''s say that our example code thus far had a while loop, causing an issue with
    our code at the 555 iteration of my._integer. If we had to step through this,
    it would take 555 presses of the play button to get there. However, there is a
    way around this.


    To demonstrate this


    ![](bbox=[0.176, 0.532, 0.821, 0.785])


    ```

    1 var My_Integer = 0;

    3 function loopingToSk() {

    4   while (my._integer < 5000) {

    5     my._integer += 1;

    6     var paragraphTag = document.createElement("p");

    7     paragraphTag.innerText = my._integer;

    8     document.body.appendChild(paragraphTag);

    9   }

    10

    11 /** Break in debugger */

    12 if (my._integer === 555) {

    13   debugger;

    14 }

    15

    16 /** Triggering loop */

    17 window.onload = loopingToSk; }

    ```


