  md: 'At this point, we may think "Oh wow I never knew that, I should never code
    a prototype again!" Now, before we start deleting prototypes from our project
    files, I want to explain scalability with prototypes. It is true that prototypes,
    when called for a constructor function, can be slower...*in the small*. What do
    I mean by in the small? Well, for small uses of prototypes such as this particular
    example, we can see prototypes slower than a traditional constructor method.


    Now here''s the rub; for larger projects, a constructor in a large-scale application
    may have 50 functions, and so on.. When we call those larger constructors over
    and over, it gets pretty expensive in memory just by calling the instance of a
    constructor since it has to ready all the functions contained inside.


    By using prototype methods, those initial constructor calls are stored in memory
    once. For small uses of prototypes the performance benefits aren''t visible since
    we use the memory in-place as if we had a simple static function, but once it''s
    set up, it''s in memory and doesn''t have to be recalled or reprocessed like a
    static JavaScript function.


    One more thing about prototypical inheritance, though performance issues can arise
    from use static functions, it can be very helpful for large codebases. If a project
    has scope concerns or use libraries that may cause conflicts, consider using a
    namespace. This works similar to prototype classes but function like simple static
    functions that prepend with a namespace to prevent conflict.


    # Array performance


    We typically don''t think about arrays when dealing with performance, but it''s
    worth mentioning a few things here. First, large arrays can be messy and performance
    hogs when you''re trying to work with a large amount of data. Typically with arrays,
    we only need to worry about two things: searching and array size.'
