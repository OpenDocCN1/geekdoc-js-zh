    # ## Web Inspectors in general


    Before diving in an in-depth exploration of Chrome''s Web Inspector, it''s important
    to note that there are many different Web Inspectors for different web browsers,
    typically developed by the browser''s vendor for debugging a web page''s application
    content and performance.


