    # Reviewing an application''s spec for writing tests


    When writing unit tests, there need to be well-defined instructions for writing
    the tests; in the case of the code sample shown in the previous screenshot, we
    want to ensure that our tests follow a few rules, and to help us write these tests,
    we''ll use the rules listed in the following table with our code.


    Consider the following list as an application specification, or documentation
    based on which the application should be built. Let''s look at the table and see
    what our code should be doing with the data being used:


    | Test Number | Test Description |

    |---|---|

    | Test #1 | New Customer data test:

    Customer''s ID should be a number. |

    | Test #2 | New Customer data test:

    Customer''s name should be in an array object, (ex [''FirstName'', ''LastName'']).
    |

    | Test #3 | New Customer data test:

    Customer''s bank balance should be a number. |

    | Test #4 | New Customer data test:

    Customer''s city name should be a string. |

    | Test #5 | New Customer data test:

    Customer''s gender should be a number. |

