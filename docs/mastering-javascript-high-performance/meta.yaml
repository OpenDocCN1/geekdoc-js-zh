  md: '# Preface


    Welcome to Mastering JavaScript High Performance. In this book, we have covered
    JavaScript performance in a way that helps any JavaScript developer, whether they
    are new to the language or experienced veterans. This book covers common performance
    bottlenecks, how to look for performance issues within code, and how to correct
    them easily.


    We also review modern ways of optimizing your JavaScript code not just by relying
    on sheer knowledge of JavaScript, but by using tools to help optimize for us.
    These tools include Gulp and Node.js, which help create great performing builds,
    and Jasmine, a JavaScript unit-testing framework that helps discover application
    flow issues in JavaScript. We also debug a hybrid app using Apple Xcode debugging
    tools for HTML and JavaScript.


    # What this book covers


    Chapter 1, The Need for Speed, explains the need for faster JavaScript, discusses
    how JavaScript code is traditionally slow, and covers the types of code editors
    that can help us write faster JavaScript, without changing our coding style.


    Chapter 2, Increasing Code Performance with ESLint, explores performance fixes
    in JavaScript, and covers ESLint, a very good JavaScript validation and optimization
    tool.


    Chapter 3, Understanding JavaScript Build Systems, teaches you JavaScript build
    systems and their advantages for JavaScript performance testing and deployment.


    Chapter 4, Detecting Performance, covers Google''s Development Tools options and
    contains a review of how to use a Web Inspector to improve your JavaScript''s
    code performance.'
  merge: -1
  pgno: 13
- img_proc: false
  md: 'Preface


    Chapter 5, Operators, Loops, and Timers, explains operators, loops, and timers
    in the JavaScript language and shows their effect on performance.


    Chapter 6, Constructors, Prototypes, and Arrays, covers constructors, prototypes,
    and arrays in the JavaScript language and shows their effect on performance.


    Chapter 7, Hands off the DOM, contains a review of the DOM in relation to writing
    high-performance JavaScript, and shows how to optimize our web applications vastly
    faster. We also take a look at JavaScript animation and test performance against
    modern CSS3 animation.


    Chapter 8, Workers and Promises, demonstrates web workers and promises. This chapter
    also shows you how to use them, including their limitations.


    Chapter 9, Optimizing JavaScript for iOS Hybrid Apps, covers optimizing JavaScript
    for mobile iOS web apps (also known as hybrid apps). Also, we take a look at the
    Apple Web Inspector and see how to use it for iOS development.


    Chapter 10, Application Performance Testing, introduces Jasmine, a JavaScript
    testing framework that allows us to unit-test your JavaScript code.


    # What this book is for


    For this book, you will need a basic understanding of JavaScript, how to write
    functions and variables in JavaScript, how to use basic web technologies as HTML
    and CSS, as well as some basic debugging skills using a Web Inspector such as
    Chrome Developer tools or Firefox, to name a few.


    You will need a text editor, preferably for HTML and JavaScript coding; Choosing
    the editor and the admin rights is up to the system you''re working on, and it
    also depends on your budget. Chapter 1, The Need for Speed. Chapter 9, Optimizing
    JavaScript for iOS Hybrid Apps, strictly covers JavaScript in iOS development;
    for that, you will need a copy of Xcode and an Intel-based Mac. If you don''t
    have these, you can still read along but, ideally, most of this work is done with
    a Mac.


    # Who this book is for


    This book is written for intermediate JavaScript developers. If you are experienced
    with unit-testing JavaScript and writing your own frameworks, and are able to
    understand what instance-based versus static-based is in JavaScript, this book
    may not be for you. Also, if you''re very new to JavaScript—as in, "How do I use
    a function?"—I recommend looking for a beginner''s JavaScript book as well.'
  merge: -1
