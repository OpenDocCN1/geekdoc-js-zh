- img_proc: false
  md: "# Constructors, Prototypes, and Arrays\n\nIn order to properly display this\
    \ name, we will need a keyword to declare a reference to the instance of this\
    \ constructor. To do that, we will use the this keyword; in JavaScript, this is\
    \ a reference to the exact point in execution in a scope.\n\nThe this keyword\
    \ in JavaScript refers to the scope and variable that exists at that point of\
    \ script execution when it is used. For example, when you use a this keyword in\
    \ a function, it can reference a variable that is also in the same scope (or inside\
    \ a function). By using a this keyword, we can point to variables and objects\
    \ at a certain point in a code's execution.\n\nA scope is simply a block of JavaScript\
    \ with its own variables and properties. Scopes can include a global-level JavaScript\
    \ object, meaning an entire JavaScript file, a function-level scope where variables\
    \ and properties are set inside a function, or as discussed earlier, a constructor\
    \ is a function.\n\nLet's rewrite our AuthorName with this keyword so that we\
    \ can reference our scope and print our value to the Console. We will need to\
    \ create an initializer inside our constructor to get our scoped variables returned.\
    \ An initializer (sometimes called an init function) specifies certain variables\
    \ inside our constructor and assigns properties on creation.\n\nHere, we create\
    \ a variable with a this keyword prefixed to indicate that we are referencing\
    \ our instance followed by our function called init, which equals a function,\
    \ just as we would use a variable to declare a function. Let's take a look at\
    \ this in the code shown in the next screenshot:\n\n![](bbox=[0.282, 0.535, 0.718,\
    \ 0.775])\n\n```\n/*\n * Chapter 6 - 04\n */\n\nfunction AuthorName(author) {\n\
    \  'use strict';\n  this.init = function() {\n    return author;\n  };\n}\n\n\
    var author1 = new AuthorName('Chad Adams');\nconsole.log(author1.init());\n```"
  merge: -1
