  md: '# Chapter 9


    Let''s make a copy of our project and call it JS_Performance_CBL, and let''s update
    our index.html code with this code sample, in the following screenshot:


    ![](bbox=[0.176, 0.196, 0.823, 0.513])


    Here, we have a simple page with an empty div; we also have a button with an onclick
    function called start. Our start function will update the height continuously
    using the setInterval function, increasing the height every millisecond. Our empty
    div has a background gradient assigned to it with an inline style lag.


    CSS background gradients are typically a huge performance drain on mobile devices
    as they can potentially re-render themselves over and over as the DOM updates
    itself. Other issues include listener events; when older or lower-end devices
    do not have enough RAM to apply an event listener to. Typically, it is a good
    practice to use onclick attributes to HTML either or through JavaScript.


