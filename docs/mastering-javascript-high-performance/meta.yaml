    \ = function (event) {\n    console.log(\"func2_Worker says: \" + event.data);\n\
    \  };\n\nfunc2_Worker.postMessage(\"Processing a high performance JavaScript worker...\"\
    );\n}\n\nfunction function3() {\n  console.info(\"function3(): Called.\");\n \
    \ console.timeEnd(\"Worker\");\n}\n\nwindow.addEventListener('DOMContentLoaded',\
    \ function () {\n  console.log(\"DOM Loaded\");\n}, false);\nwindow.addEventListener('load',\
