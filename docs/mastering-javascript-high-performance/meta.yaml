  md: 'We''ve modified our initial JavaScript example by updating the position of
    the dot element; however, we''ve added two CSS lines on lines 17 and 18. The first
    one is a -webkit-transform and translate3d property that only sets the element
    to not change position; in older browsers or not webkit-focused browsers, this
    will be ignored. But here it''s simply setting the position of the element to
    its initial position, which sounds silly, and in a way it is!


    What really does tell the DOM runtime that needs to run as a unique graphics process;
    it also tells the processing unit (GPU) of the browser''s device to draw this
    element fast! The same can be said for will-change, which is a similar property
    that does the same thing as the translate3d property with the exception that it''s
    not updating the DOM but simply setting the GPU to redraw this element at a very
    high rate and expect it to change in the DOM. Now, this practice is called adding
    elements to a composite layer. We will get more into composite layers in Chapter
    9, Optimizing JavaScript for iOS Hybrid Apps. But for now, this is what we are
    doing here; this way, newer browsers can still get some visual speed improvements
    using legacy JavaScript animations


    # Understanding paint events


    Paint events are DOM events that cause a web browser to paint the web page as
    the DOM is updated with JavaScript. For browsers with low memory, this can be
    a bit of issue as paint events take a sizable amount of processing and graphics
    rendering to show updates in large quantities.


    # How to check for paint events?


    Typically, paint events can be found in your Web Inspector''s timeline view. Since
    paint events are displayed chronologically during a page''s execution in a web
    browser, these appear slightly differently in Chrome''s Developer tools options.'
  merge: -1
