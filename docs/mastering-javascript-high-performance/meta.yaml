    with NPM, using ESLint to better optimize our code, writing code in an IDE to
    create better structure for our apps, and helping to check for any excess code
    or unused variables in our code.


    We can use best performance practices such as using strings to apply an HTML page
    (like the innerHTML property) rather than creating objects for them and applying
    them to the page that way, and so on.'
