  md: '# When to use the createElement function?


    Though the createElement function is slow, on occasion it can be more helpful
    in generating HTML through a complex layout, where a complex application generates
    many more elements than an innerHTML property can be styled to accommodate.


    If this is the case, this is done for convenience and usability for the development
    team when modifying the element type rather than for updating a full string to
    fit the needs of the application. In any case, if you need to create HTML elements,
    the innerHTML property is always faster.


    # Animating elements


    One of the more impressive uses of JavaScript came around the Web 2.0 age of JavaScript
    while AJAX was gaining popularity; another interesting idea came about the form
    of JavaScript animations. These are animations that are created by simply iterating
    over and over an element''s styles that are left- and top-positioned using setInterval
    function, and then dismissing it after the element reached its end point. This
    allows the div to appear to tween or animate on the page itself.


    # Animating the old-fashioned way


