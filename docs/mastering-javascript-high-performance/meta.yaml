    to finish our Promise object''s function, notice the new type of keyword, resolve!
    The resolve keyword is a type of return used specifically for promises; it sets
    a promise''s return value. There are also other return types such as reject, which
    allows us to return a failed value if we want. For example, we are keeping it
    simple and using only resolve.


    Now, if you remember on line 23, our Promise function has an internal function
    with the resolve parameter. This might look a bit odd, it is required to make
    our promise work; by adding resolve to function, we are telling our promise that
    we need to use the resolve function inside our Promise function. For example,
    if we needed resolve and reject, we would write it as function (resolve, revoke)
    { }


