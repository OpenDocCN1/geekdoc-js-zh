    # What is JSLint linting?


    Before we talk about JSLint, we need to discuss linters in general, what they
    are, and how they influence JavaScript performance. A lint is, simply put, a code-validation
    checker. It allows a developer to point to a file and check for errors or potential
    issues ranging from spacing to pure code errors.


    Linters typically receive the contents of a file and build a source tree. In the
    case of JavaScript, this can be objects as global variables, functions, prototypes,
    arrays, and so forth. After the tree is constructed, analyzers will take parts
    of the source tree and report anything an analyzer that was written would flag.
    Lastly, any rule readers or parameters flagged before running the linter will
    look for options to ignore and generate a final report.


    Common rule readers for JavaScript options would be settings such as checking
    for EcScript 3, allowing white space, allowing the continue keyword, allowing
    non-strict conditionals for the if statements, and so on.


    # About JSLint


    JSLint is a JavaScript code analysis tool that was written in JavaScript by Douglas
    Crockford, who also helped in popularizing JSON in software development. JSLint
    can be used in many ways, as mentioned in Chapter 1, The Need for Speed. Many
    IDEs have features beyond just editing code; some of these features include things
    such as error checking and, in some cases, the IDEs use a version of JSLint.'
