    # # Error-checking in a JavaScript build system


    In the past, HTML editors for JavaScript and HTML content, such as Dreamweaver,
    have done this since the creation of early web code editors.


    The difference between what''s done in Xcode for a compiled language and what''s
    done in a JavaScript IDE is slightly different. With a compiled language, an error
    must be fixed before a code file can run; this is usually considered as static
    type checking, however, can run with an error, even when overridden by a `try-catch`
    block. Simply put, as stated in Chapter 2, Increasing Code Performance with JSLint,
    JavaScript is an interpreted language, and the *only* language that is really
    tested for errors at runtime.


    With in mind, how do editors such as Dreamweaver, WebStorm, or Visual Studio check
    for errors then? Well, if you remember in Chapter 2, Increasing Code Performance
    with JSLint, we saw how linting tools provide feedback on potential or verifiable
    bugs in JavaScript code; this returns a list of errors.


    With an IDE, the editor is keeping this in mind and takes each error to display
    it with the associated line and column in the JavaScript file.


    [ 37 ]'
