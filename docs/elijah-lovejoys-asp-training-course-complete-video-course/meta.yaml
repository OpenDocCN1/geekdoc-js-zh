  md: "# onselectionchanged: An ASP.NET event\n\n+   - When a user clicks on a date\
    \ generated by the calendar control, the onselectionchanged event is triggered,\
    \ and its associated function is executed.\n\n+   - Syntax to determine what date\
    \ the user clicked on:\n  `<calendar_control_name>.SelectedDate.ToShortDateString()`\n\
    \n+   - The syntax for triggering a function with a calendar event is again an\
    \ issue of adding attributes, this time to the calendar tag.\n  - Name the calendar\
    \ using an id attribute.\n  - Create an event handler attribute:\n    - name =\
    \ event\n    - value = function\n  - For example:\n    - `<asp:Calendar id=Calendar1\
    \ onselectionchanged=\"Date_Selected\" runat=\"server\"/>`\n  - Result: when the\
    \ onselectionchanged event happens, the Date_Selected() function is executed.\n\
    \n+   - Here's a function that collects the current selected date and assigns\
    \ it to a variable:\n\n```\nfunction Date_Selected(sender: Object, e: EventArgs)\
    \ {\n    selected_date = \"Selected date is: \" + Calendar1.SelectedDate.ToShortDateString()\n\
    \    // Having collected a date, you'd then do something with it...\n}\n```"
  merge: -1
  pgno: 215
