  - '[PAGE 97]


    # ASP Session Object


    ASP includes a built-in facility for keeping track of unique visitors (using cookies):
    the Session object. Because the ASP Session object keeps track of unique visitors,
    once a user has been authenticated using a password check, it is very easy to
    use the Session object to verify that a user requesting access to a script does,
    in fact, have permission to use that script.


    # Notes:'
  - "[PAGE 98]\n\n# ## Session Password Mechanism\n\n+   - Using the Session object\
    \ to exclude nonauthenticated users from using certain scripts requires two elements:\n\
    \  - Code that sets a value in the Session object when a user matches a certain\
    \ criterion (in this case, when a user knows a password).\n  - Code that checks\
    \ to make sure that the desired value is stored in the Session object before granting\
    \ a user access to a sensitive script or HTML page.\n\n**Notes:**"
- md: " ## Collecting a Password and Setting a Session Variable\n\n- Here is a very\
    \ simple form that contains a text box and a Submit button, allowing the user\
    \ to type in a password:\n\n```\n<form action=\"<%=\nString(Request.ServerVariables(\"\
    SCRIPT_NAME\")) %>\">\n<p>Password Please:\n<input type=password name=password\
    \ >\n<input type=submit name=\"toss\" value=\"Submit\">\n</form>\n```\n\n- This\
    \ code looks at the incoming password (a form field called password) and compares\
    \ it to a string that is hard coded into the script, in this case \"password\"\
    :\n\n```\nif (String(Request(\"password\")) == \"password\"){\n\tSession(\"edit_db_pass\"\
    ) =\n\tString(Request(\"password\"));\n\tResponse.Redirect(\"yet_another_page.asp\"\
    );\n}\n```\n\n**Notes:**\n\n## Checking for Valid Session Variable\n\n- Once a\
    \ Session variable has been set, the next step is to check for it any time a script\
    \ is generating a page to which you want to control access. In the case of the\
    \ code we just examined, this is done by checking to make sure that the value\
    \ of the Session variable edit_db_pass is set to the correct value:\n\n```\nif\
    \ (Session(\"edit_db_pass\") != \"password\"){\nResponse.Redirect(\"password_form.asp\"\
    );\n}\n//... balance of the script\n```\n\n## Notes:\n\n## Using SQL to Update\
    \ Records\n\n- An update statement can be used to change the description field\
    \ of a specific record in the categories table:\n\n| category_uid | category_name\
    \ | category_description |\n|-------------|---------------|----------------------|\n\
    | 3 | Web Sites | Web sites that relate to our industry or are of general interest\
    \ |\n\nTo do this, the statement is written so that it applies to only those records\
    \ where the value of category_uid is 3.\n\n- Because the category_uid field is\
    \ the primary key of the table and therefore can contain only unique values, this\
    \ effectively constrains the statement to acting on the single record shown here.\
    \ To wit:\n\n```\nupdate categories set category_description = 'Spiffy sites!'\n\
    \  where data_uid = 3\n```\n\nThis statement modifies the value of a single field,\
    \ category_description. As a result, the record is modified so that it now looks\
    \ like this:\n\n| category_uid | category_name | category_description |\n|-------------|---------------|----------------------|\n\
    | 3 | Web Sites | Spiffy sites! |\n\n## Using the Request.QueryString Object to\
    \ Collect Form Data\n\n- All that's required to collect all the information sent\
    \ to a script via the Get method is to iterate through the Request.QueryString\
    \ object:\n\n```\nfor ( field_number = 1; field_number <=\nRequest.QueryString.count\
    \ ; field_number++ ){\n  temp_field = String(Request.QueryString.Key(field_number));\n\
    \  temp_content = String(Request.QueryString.Item(temp_field))\n  Response.Write\
    \ (\"<br>\" + temp_field + \": \" + temp_content );\n}\n```\n\n- Here's how it\
    \ works:\n\n- Request.QueryString.count returns the number of form variables in\
    \ the incoming form.\n\n- If we give Request.QueryString.Key() a number less than\
    \ the number of incoming form variables, the Request object gives us the name\
    \ of a field.\n\n- If we put that field name in Request.QueryString.Item(), we\
    \ get the value of that field.\n\n## Notes:\n\n## Using a Regular Expression to\
    \ Examine the Contents of a String (String.search(//,\"\"))\n\n- Let's say that\
    \ you have a variable called name, and you want to check to see whether it contains\
    \ the string \"Bob\" so that your script can react appropriately:\n\n```\nif (name.search(/Bob/)\
    \ >= 0 ){\n    Response.Write(\"Bob! \\n<p>So how the heck are\n            you?\"\
    )\n}\nelse{\n    Response.Write(\"Oh.<p>Hi.<p>How are you?\")\n}\n```\n\n- To\
    \ check for more than one value, you can separate patterns with the pipe (\"|\"\
    ) symbol:\n\n```\nif (name.search(/Bob|Dolores/) >= 0 ){\n            //... do\
    \ something\n}\n```\n\n## Notes:\n\n## The JavaScript substring() Function\n\n\
    The substring( ) function lets you remove a small piece of a string. For example,\
    \ it can be used to remove the last character from a string:\n\n```\nsentence\
    \ = \"Nothing will happen here.\"\nsentence = sentence.substring(0,(sentence.length-1));\n\
    ```\n\nwhich will remove the period from the string sentence, leaving you with\
    \ the string\n\n```\nNothing will happen here\n```\n\n## Notes:\n\n## Code to\
    \ Edit Database\n\n- A script that collects a password and checks to see whether\
    \ it's any good.\n\n- An include file that is shared by most of the scripts in\
    \ this lecture that does different things.\n\n## Notes:\n\n## How the Scripts\
    \ Fit Together\n\n| | |\n|:---|:---|\n| **Visible to Users** | |\n| Start Here\
    \ | ch4_password_form.asp |\n| | bad password → good password |\n| | ch4_delete_category.asp*\
    \ |\n| | Delete Button |\n| | ch4_list_categories.asp* |\n| | Select category\
    \ to edit category name or description |\n| | ch4_edit_category_form.asp* |\n\
    | | Save Change Button → ch4_update_category.asp* |\n| | ch4_include.js |\n| |\
    \ (* indicates that script uses include file) |\n| | Select a category to view\
    \ records in that category |\n| | ch4_insert_subcategory.asp* |\n| | Create New\
    \ Subcategory Button |\n| | ch4_delete_subcategory.asp* |\n| | Delete Subcategory\
    \ Button |\n| | ch4_edit_subcategories_form.asp* |\n| | ch4_list_records.asp*\
    \ |\n| | Edit Subcategory Button |\n| | Select specific record to edit |\n| |\
    \ ch4_edit_record_form.asp* |\n| | Save Change Button → ch4_update_record.asp*\
    \ |\n| | Delete Button → ch4_delete_record.asp* |\n| **Not Visible to Users**\
    \ | |\n\n## Script 4-1\n\n### ch4_password_form.asp\n\n```\n1. <%@ Language=JavaScript\
    \ %>\n2.\n3. <%\n4. if (String(Request(\"password\")) == \"password\"){\n5.\n\
    6.     Session(\"edit_db_pass\") = \"OK\";\n7.     Response.Redirect(\"ch4_list_categories.asp\"\
    );\n8. }\n9. %>\n10.\n11. <html><head></head><body>\n12. <form action=\"<% =\n\
    \     String(Request.ServerVariables(\"SCRIPT_NAME\")) %>\"> \n13. <p>Password\
    \ Please:\n14. <input type=password name=password >\n15. <input type=submit name=\"\
    toss\" value=\"Submit\">\n16. </form>\n17. </body></html>\n```\n\nNotes:\n\n##\
    \ Script 4-2\n\n### ch4_include.js\n\n```\n1. <%\n2. if (Session(\"edit_db_pass\"\
    ) != \"OK\"){\n3.\n4.     Response.Redirect(\"ch4_password_form.asp\");\n5. }\n\
    6.\n7. var out = \"\";\n8.\n9. var this_script_url =\n    String(Request.ServerVariables(\"\
    SCRIPT_NAME\"));\n10.\n11. var current_category =\n    String(Request(\"current_category\"\
    )); // category uid\n12. var current_subcategory =\n    String(Request(\"current_subcategory\"\
    )); // subcategory string\n13. var current_record =\n    String(Request(\"current_record\"\
    )); // data uid\n14.\n15. // display scripts\n16. var list_categories_script =\n\
    \    \"ch4_list_categories.asp\";\n17. var list_records_script = \"ch4_list_records.asp\"\
    ;\n18.\n19. var edit_record_form_script =\n    \"ch4_edit_record_form.asp\";\n\
    20. var blank_record_form_script =\n    \"ch4_blank_record_form.asp\";\n21.\n\
    22. var edit_category_form_script =\n    \"ch4_edit_category_form.asp\";\n23.\
    \ var blank_category_form_script =\n    \"ch4_blank_category_form.asp\";\n24.\n\
    25. var edit_subcategories_form_script =\n    \"ch4_edit_subcategories_form.asp\"\
    ;\n26.\n27. // db scripts\n28. var update_record_script = \"ch4_update_record.asp\"\
    ;\n29. var insert_record_script = \"ch4_insert_record.asp\";\n30. var delete_record_script\
    \ = \"ch4_delete_record.asp\";\n31.\n32. var update_category_script =\n    \"\
    ch4_update_category.asp\";\n33. var insert_category_script =\n    \"ch4_insert_category.asp\"\
    ;\n34. var delete_category_script =\n    \"ch4_delete_category.asp\";\n```\n\n\
    ```\n35.\n36. var insert_subcategory_script =\n    \"ch4_insert_subcategory.asp\"\
    ;\n37. var delete_subcategory_script =\n    \"ch4_delete_subcategory.asp\";\n\
    38.\n39. /////////////////////////////////////////////////////////////////\n40.\
    \ // create connection to database\n41. DSN = \"DSN=ch3db\";\n42. Conn = Server.CreateObject(\"\
    ADODB.Connection\");\n43. Conn.Open(DSN);\n44.\n45.\n46. /////////////////////////////////////////////////////////////////\n\
    47. // create cat_object, the category object. Because\n    category information\
    \ is used\n48. // on almost every page, this code is executed every\n    time.\n\
    49. sql = \"SELECT * FROM categories order by\n    category_name\";\n50. rs =\
    \ Server.CreateObject(\"ADODB.RecordSet\");\n51. rs.Open (sql, Conn);\n52.   \
    \      if (rs.EOF){  // check to see if rs is empty\n53.             out += \"\
    no records found in categories\n    table. something is probably wrong.\";\n54.\
    \ }\n55.     else{                    // rs not empty\n56.         cat_object\
    \ = new Object ();\n57.         temp_counter = 0;\n58.\n59.         while (! (rs.EOF)){\n\
    60.             cat_object[temp_counter] = new\n    Object ();\n61.          \
    \       cat_object[temp_counter].uid =\n    parseInt(rs.fields.item\n    (\"category_uid\"\
    ))\n62.                 cat_object[temp_counter].name =\n    String(rs.fields.item\n\
    \    (\"category_name\"))\n63.                 cat_object[temp_counter].desc =\n\
    \    String(rs.fields.item\n    (\"category_description\"))\n64.\n65.        \
    \ rs.move(1);\n66.         cat_object.qty =\n    (temp_counter + 1);\n67.    \
