  - '[PAGE 111]


    # Code to Edit Categories


    The next series of scripts are used to review and edit category information as
    detailed below.


    +   - ch4_list_categories.asp: Displays a list of categories in the database and
    lets user go to ch4_list_records.asp, ch4_edit_category_form.asp, or ch4_blank_category_form.asp.

    - ch4_edit_category_form.asp: Lets user change category information or delete
    a category.

    - ch4_update_category.asp: Updates the database with edits created, using ch4_edit_category_form.asp.

    - ch4_delete_category.asp: Deletes a category.

    - ch4_blank_category_form.asp: Creates a blank form that users can use to create
    a new category.

    - ch4_insert_category.asp: Inserts a new category using information typed into
    ch4_blank_category_form.asp.


