  md: '# Storing Information in Tables


    These tables show how two kinds of information used by the scripts in this lecture
    are organized into tables. The first one stores information about categories.
    The second shows a list of the actual people, events, and Web sites that are stored
    in the database:


    # Category


    | category_uid | category_name | category_description |

    | --- | --- | --- |

    | 1 | People | A list of people, their phone numbers, and information about them
    |

    | 2 | Events | A list of scheduled events and important dates |

    | 3 | Web Sites | Web sites that relate to our industry or are of general interest
    |


    # Data


    | data_uid | data_name | data_category | data_subcategory | data_description |

    | --- | --- | --- | --- | --- |

    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |

    | 2 | yahoo! | 3 | General Interest | old-school search engine |

    | 3 | jane doe | 1 | Employees | VP of something or other |

    | 9 | new event | 2 | Company Events | new product release |


    A few things to note about tables:


    +   - Each row in the table is stored information about one piece of information
    and is called a record.

    - Each record is broken up into a number of fields.

    - Each field contains a different type of information.'
