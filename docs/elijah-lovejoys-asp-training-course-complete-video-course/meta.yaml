  md: '# Number (JavaScript Data Type)


    A number is an integer or real number that can be represented by a literal variable
    or as a literal. Here are a few examples:


    ```

    9                          // the number 9

    3.45                       // the number 3.45

    3 + 2                      // the number 5

    number = 12                // the variable "number" has been set to 12

    number + 2                 // the number 15

    ```


    # Notes:'
  merge: -1
  pgno: 19
- img_proc: true
  md: "# String (JavaScript Data Type)\n\n+   - A string is a sequence of letters,\
    \ numbers, spaces, and various other characters, which, like numbers, can be expressed\
    \ literally or stored in a variable. For example:\n\n```\n\"Hello World\"    \
    \          // the archetypal string.\n\"Tel: 805-966-0611\"        // another\
    \ literal string.\nName = \"Wilbur\"            // a variable called name with\
    \ a value\n                           // of \"Wilbur\"\n```\n\n# Notes:"
  merge: -1
  pgno: 20
- img_proc: true
  md: "# Array (JavaScript Data Type)\n\n+   - An array is an ordered sequence of\
    \ values:\n  - `(1,2,3)` // the numbers one, two, and three\n  - `(\"Wilbur\"\
    ,\"Fred\",\"Gordon\")` // three names.\n  - `name_array = (\"Wilbur\",\"Fred\"\
    ,\"Gordon\")` // a variable called name_array storing three names\n\n+   - Because\
    \ arrays are ordered, it is possible to invoke a particular value in an array\
    \ by referring to its index value:\n  - `name_array[0]` // returns \"Wilbur\"\n\
    \  - `name_array[2]` // returns \"Gordon\"\n  - `name_array[3] = \"Becky\"` //\
    \ name_array is now //(\"Wilbur\",\"Fred\",\"Gordon\",\"Becky\")\n\nNotes:"
  merge: -1
  pgno: 21
- img_proc: true
  md: "# Concatenation (JavaScript \"+\" Operator)\n\n+   - Concatenation makes it\
    \ possible to make a single string out of two strings by \"concatenating\" them:\n\
    \  `full_name = \"jane\" + \" \" + \"doe\"  // full_name is //set to \"jane doe\"\
    `\n- Note that in concatenating the strings \"jane\" and \"doe\" it was necessary\
    \ to put a space between them (\" \") to prevent the value of full_name being\
    \ set to \"janedoe\".\n\n```\nfull_name = \"jane\" + \" \" + \"doe\"\n```\n\n\
    // full_name is //set to \"jane doe\"\n\n# Notes:"
  merge: -1
