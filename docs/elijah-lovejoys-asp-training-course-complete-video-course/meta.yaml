  - '[PAGE 69]


    # ADO, ADODB, ODBC, DSN, Etc. ...


    There are three steps involved in creating database-driven ASP pages:


    +   1. Create a database (this could be an Access database or any other database
    that has an ODBC driver).


    +   2. On your Web server, create a DSN (a Data Source Name, which is an ODBC
    data source). This makes it possible for your script to find your database and
    connect to it.


    +   3. Write an ASP script that uses ADO (ActiveX Data Objects) to create one
    or more recordsets and perhaps give SQL instructions to your database.


    # Notes:'
  - "[PAGE 70]\n\n# ***The Database Connection Object***\n\n+   - To create a connection\
    \ to a DSN called ch3db:\n\n```\n1. DSN = \"DSN=ch3db\";\n2. Conn = Server.CreateObject(\"\
    ADODB.Connection\");\n3. Conn.Open(DSN);\n4. // now that the connection is open\n\
    5. // you can do something with it here\n6. Conn.Close ();\n```\n\n+   - There\
    \ are two things you can do once you have a connection:\n\n+   - Execute SQL statements\
    \ that do not return records.\n\n+   - Create a Recordset object to collect the\
    \ results of an SQL select statement.\n\n+   - \\\n\n+   - These SQL statements\
    \ do not return records:\n\ninsert  \nupdate  \ndelete\n\n+   - Once a connection\
    \ is established, the Execute() method of the Connection object can be used to\
    \ execute an SQL statement:\n\n```\nConn.Execute(SQL_statement);\nConn.Execute(\"\
    update categories set\n        category_description = 'Spiffy sites!'\n      \
    \  where category_uid = 3\");\n```\n\nSometimes it's easier to assign the SQL\
    \ statement to a variable first:\n\n```\nvar insert_statement = \"insert into\
    \ data (data_name,\n        data_category, data_subcategory, data_description)\n\
    \        values ('prentice hall', 3, 'General Interest', '\n        web site for\
    \ this book')\";\nConn.Execute(insert_statement);\n```"
  - '[PAGE 71]


    # The Recordset Object


    Let''s consider this categories table, which we''ve seen before in this lecture:


    # Category


    | category_uid | category_name | category_description |

    | --- | --- | --- |

    | 1 | People | A list of people, their phone numbers, and information about them
    |

    | 2 | Events | A list of scheduled events and important dates |

    | 3 | Web Sites | Web sites that relate to our industry or are of general interest
    |


    Here, we''ll create code can be used to add its contents to a Web page:


    ```

    <%@ Language=JavaScript %>

    <%

    DSN = "DSN=ch3db";

    Conn = Server.CreateObject("ADODB.Connection");

    Conn.Open(DSN);


    sql = "SELECT * FROM categories ";

    rs = Server.CreateObject("ADODB.RecordSet");

    rs.Open (sql, Conn);


    out = "<table border=1>";

    out += "<tr><td><pre>category_uid</pre></td><td><pre>category_name</pre></td><td><pre>category_description</pre></td></tr>";

    while (! (rs.EOF)){

    out += "<tr><td>";

    out += String(rs.fields.item("category_uid")) + "</td><td>";

    out += String(rs.fields.item("category_name")) + "</td><td>";

    out += String(rs.fields.item("category_description")) + "</td><tr>";

    rs.move(1);

    } // end while recordset

    out += "</table>";


    rs.Close ();

    ```'
- md: " # LECTURE 3  DATABASE-DRIVEN PAGES\n\n```\n24. Conn.Close ();\n25. %>\n26.\
    \ <html><head><title>recordset\n    example</title></head><body>\n27. <%= out\
