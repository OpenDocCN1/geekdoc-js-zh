- img_proc: true
  md: "# Using SQL to Update Records\n\n+   - An update statement can be used to change\
    \ the description field of a specific record in the categories table:\n\n| category_uid\
    \ | category_name | category_description |\n|-------------|---------------|----------------------|\n\
    | 3 | Web Sites | Web sites that relate to our industry or are of general interest\
    \ |\n\nTo do this, the statement is written so that it applies to only those records\
    \ where the value of category_uid is 3.\n\n+   - Because the category_uid field\
    \ is the primary key of the table and therefore can contain only unique values,\
    \ this effectively constrains the statement to acting on the single record shown\
    \ here. To wit:\n\n```\nupdate categories set category_description = 'Spiffy sites!'\n\
    \  where data_uid = 3\n```\n\nThis statement modifies the value of a single field,\
    \ category_description. As a result, the record is modified so that it now looks\
    \ like this:\n\n| category_uid | category_name | category_description |\n|-------------|---------------|----------------------|\n\
    | 3 | Web Sites | Spiffy sites! |"
  merge: -1
  pgno: 101
- img_proc: true
  md: "# Using the Request.QueryString Object to Collect Form Data\n\n+   - All that's\
    \ required to collect all the information sent to a script via the Get method\
    \ is to iterate through the Request.QueryString object:\n\n```\nfor ( field_number\
    \ = 1; field_number <=\nRequest.QueryString.count ; field_number++ ){\n  temp_field\
    \ = String(Request.QueryString.Key(field_number));\n  temp_content = String(Request.QueryString.Item(temp_field))\n\
    \  Response.Write (\"<br>\" + temp_field + \": \" + temp_content );\n}\n```\n\n\
    +   - Here's how it works:\n\n+   - Request.QueryString.count returns the number\
    \ of form variables in the incoming form.\n\n+   - If we give Request.QueryString.Key()\
    \ a number less than the number of incoming form variables, the Request object\
    \ gives us the name of a field.\n\n+   - If we put that field name in Request.QueryString.Item(),\
    \ we get the value of that field.\n\n# Notes:"
  merge: -1
  pgno: 102
- img_proc: true
  md: "# Using a Regular Expression to Examine the Contents of a String (String.search(//,\"\
    \"))\n\n+   - Let's say that you have a variable called name, and you want to\
    \ check Lift check to see whether it contains the string \"Bob\" so that your\
    \ script can react appropriately:\n\n```\nif (name.search(/Bob/) >= 0 ){\n   \
    \ Response.Write(\"Bob! \\n<p>So how the heck are\n            you?\")\n}\nelse{\n\
    \    Response.Write(\"Oh.<p>Hi.<p>How are you?\")\n}\n```\n\n+   - To check for\
    \ more than one value, you can separate patterns with the pipe (\"|\") symbol:\n\
    \n```\nif (name.search(/Bob|Dolores/) >= 0 ){\n            //... do something\n\
    }\n```\n\n# Notes:"
