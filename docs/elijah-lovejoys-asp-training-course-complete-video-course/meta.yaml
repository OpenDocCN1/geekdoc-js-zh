  md: '# Security


    +   - Communication between a browser and a server can be encrypted using SSL.


    +   - The script in this lecture stores payment information (credit cards, prepaid
    Internet cards, etc. ...) unencrypted on the server. If you do store unencrypted
    information on your server, make sure it''s as secure as you can make it and take
    the information off the server quickly.


    +   - If you ship products to someone using stolen credit cards, you are liable
    for the product. So make sure that your credit card validation process includes
    antifraud measures.


    +   - Take simple precautions:


    +   — Password-protect computers that store important information


    +   — Don''t share passwords.


    +   — Keep computers in locked rooms.


    +   — Exercise common sense!


