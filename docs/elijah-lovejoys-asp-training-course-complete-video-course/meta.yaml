    \n# New ASP Features\n\n- Response.Redirect(): Redirecting Users to Another Page\
    \ with the Response Object\n- ASP Session Object\n- Session Password Mechanism\n\
    - Using SQL to Update Records\n- Using the Request.Querystring Object to Collect\
    \ Form Data\n- Using a Regular Expression to Examine the Contents of a String\
    \ (String.search(//,\"\"))\n- The JavaScript substring() Function\n\nNotes:\n\n\
    # Response.Redirect(): Redirecting Users to Another Page with the Response Object\n\
    \n- In ASP, you can redirect a browser from one page to another using the Response\
    \ object:\n\n```\nResponse.Redirect(\"Page.asp\")\n```\n\n# Notes:\n\n# ASP Session\
    \ Object\n\nASP includes a built-in facility for keeping track of unique visitors\
    \ (using cookies): the Session object. Because the ASP Session object keeps track\
    \ of unique visitors, once a user has been authenticated using a password check,\
    \ it is very easy to use the Session object to verify that a user requesting access\
    \ to a script does, in fact, have permission to use that script.\n\n# Notes:\n\
    \n## Session Password Mechanism\n\n- Using the Session object to exclude nonauthenticated\
    \ users from using certain scripts requires two elements:\n  - Code that sets\
    \ a value in the Session object when a user matches a certain criterion (in this\
    \ case, when a user knows a password).\n  - Code that checks to make sure that\
    \ the desired value is stored in the Session object before granting a user access\
    \ to a sensitive script or HTML page.\n\n**Notes:**"
