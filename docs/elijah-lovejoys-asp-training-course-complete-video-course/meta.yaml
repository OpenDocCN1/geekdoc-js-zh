    \ of values:\n  - `(1,2,3)` // the numbers one, two, and three\n  - `(\"Wilbur\"\
    ,\"Fred\",\"Gordon\")` // three names.\n  - `name_array = (\"Wilbur\",\"Fred\"\
    ,\"Gordon\")` // a variable called name_array storing three names\n\n+   - Because\
    \ arrays are ordered, it is possible to invoke a particular value in an array\
    \ by referring to its index value:\n  - `name_array[0]` // returns \"Wilbur\"\n\
    \  - `name_array[2]` // returns \"Gordon\"\n  - `name_array[3] = \"Becky\"` //\
    \ name_array is now //(\"Wilbur\",\"Fred\",\"Gordon\",\"Becky\")\n\nNotes:"
  - "[PAGE 22]\n\n# Concatenation (JavaScript \"+\" Operator)\n\n+   - Concatenation\
    \ makes it possible to make a single string out of two strings by \"concatenating\"\
    \ them:\n  `full_name = \"jane\" + \" \" + \"doe\"  // full_name is //set to \"\
    jane doe\"`\n- Note that in concatenating the strings \"jane\" and \"doe\" it\
    \ was necessary to put a space between them (\" \") to prevent the value of full_name\
    \ being set to \"janedoe\".\n\n```\nfull_name = \"jane\" + \" \" + \"doe\"\n```\n\
    \n// full_name is //set to \"jane doe\"\n\n# Notes:"
