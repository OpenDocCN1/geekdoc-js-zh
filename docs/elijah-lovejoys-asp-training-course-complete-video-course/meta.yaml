    \n# Notes:\n\n## Code to Edit Records\n\nJust as the scripts discussed in the\
    \ previous section allow users to review, edit, and create categories, the scripts\
    \ in this section let Web users look at a list of records in a category, create\
    \ new records, and edit or delete existing records. Briefly:\n\n- ch4_list_records.asp:\
    \ Lists the records for a given category. Provides a link to edit a specific record\
    \ (ch4_edit_record_form.asp) and a button to create a new record (ch4_blank_record_form.asp).\n\
    \n- ch4_edit_record_form.asp: A form used to edit a specific record. Edits are\
    \ forwarded to ch4_update_record.asp.\n\n- ch4_update_record.asp: Saves changes\
    \ made to a record using ch4_edit_record_form.asp.\n\n- ch4_delete_record.asp:\
    \ Deletes a single record when a user hits the Delete Record button on ch4_edit_record_form.asp.\n\
    \n- ch4_blank_record_form.asp: Creates a blank form that lets user create a new\
    \ record.\n\n- ch4_insert_record.asp: Saves a record created using ch4_blank_record_form.asp.\n\
    \n# Notes:\n\n## Scripts Used to Edit Records\n\n| | |\n|:---|:---|\n| ch4_list_records.asp\\\
    * | Select specific record to edit |\n| ch4_edit_record_form.asp\\* | Save Change\
    \ Button |\n| ch4_update_record.asp\\* | |\n| ch4_delete_record.asp\\* | Delete\
    \ Button |\n| | Create New Record Button |\n| ch4_insert_record.asp\\* | Create\
    \ New Record Button |\n| ch4_blank_record_form.asp\\* | |\n\n## Script 4-9\n\n\
    ### ch4_list_records.asp\n\n```\n1. <%@ Language=JavaScript %>\n2. <!-- #include\
    \ file=\"ch4_include.js\" -->\n3.\n4. <html><head><title>List Records</title></head><body>\n\
    5.\n6. <% = nav_header %>\n7. <center><font size=\"+2\"> List of records in <%=\
