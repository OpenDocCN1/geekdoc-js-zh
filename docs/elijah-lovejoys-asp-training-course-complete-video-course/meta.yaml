  mdcn: "\n — 它将来宾登记簿的内容显示为 HTML 页面：\n\n## ASP 新增功能\n\n- 处理 HTML 表单，包括：\n  - 收集访客提交的信息\n\
    \  - 向脚本发送操作指令\n  - 使用 Request 对象收集传入的表单信息\n  - undefined，一个特殊的 JavaScript 值\n\
    \  - 向文件追加信息\n  - 在 JavaScript 中处理换行、特殊字符以及使用 \"\\\" 进行转义\n\n## 注释：\n\n##  messengersp\
    \  处理 HTML 表单\n\n- 来宾登记簿脚本展示了表单的两种最常见用途。\n  1. 将访客在表单中输入的信息提交给脚本（来宾登记簿表单让访客能够向来宾登记簿添加信息）。\n\
    \  2. 提交嵌入在链接或表单中的指令，告诉脚本执行什么操作。\n\n## 注释：\n\n## 收集访客提交的信息\n\n- 下面是一个简单的表单示例，允许访客提交电子邮件地址：\n\
    \n```\n1. <form action=\"script_url.asp\">\n2. Email: <input type=text name=email\
    \ value=\"\">\n3. <input type=submit name=submit_button value=\"Click Here to\
    \ Submit\">\n4. </form>\n```\n\n## 注释：\n\n## 向脚本发送操作指令\n\n以下表单和下面的链接将实现相同的功能：\n\
    \n### 表单：\n\n```\n<form action=\"script_url.asp\">\n<input type=hidden name=to_do\
    \ value=\"perform_task\">\n<input type=submit name=submit_button value=\"Perform\
    \ Task\">\n</form>\n```\n\n### 链接：\n\n```\n<a href=\"script_url.asp?to_do=Perform+Task\"\
    > Perform Task </a>\n```\n\n## 注释：\n\n## 使用 Request 对象收集传入的表单信息\n\n- ASP Request\
    \ 对象使收集表单信息变得轻而易举。例如，如果脚本需要收集表单元素 to_do 的值，并将其放入名为 \"form_instruction\" 的变量中，可以这样做：\n\
    \n```\nvar form_instruction = String(Request(\"to_do\"));\n```\n\n- 请注意，在这一行中发生了三件事：\n\
    \  1. Request 对象的 to_do 属性被作为参数传递给名为 String() 的 JavaScript 函数。\n  2. String()\
    \ 函数将此值转换为字符串。\n  3. 所得的字符串被赋值给变量 form_instruction。\n\n- 由于所有表单信息都存储在 Request\
    \ 对象中，因此查找表单元素的值只需获取该对象的相应属性即可。\n\n## 注释：\n\n## undefined，一个特殊的 JavaScript 值\n\
    \n- 请考虑以下代码行：\n\n```\nvar form_instruction = String(Request(\"to_do\"));\n```\n\
    \n如果在指向该脚本的表单或链接中未设置 \"to_do\"，这将返回 undefined。因此，如果脚本使用的表单变量可能尚未设置，有时需要检查 undefined\
    \ 值。\n\n## 注释：\n\n## 向文件追加信息\n\n- 以下代码将把字符串 \"hello world\" 追加到文本文件 c:\\file.txt\
    \ 中。\n\n```\n1. fso = new ActiveXObject(\"Scripting.FileSystemObject\");\n2. fs_stream\
    \ = fso.OpenTextFile(\"c:\\\\file.txt\",ForAppending);\n3. fs_stream.Write(\"\
    hello world\");\n```\n\n- 通常，在向文件追加内容时，您还需要添加一个换行符（下一节将介绍）以保持可读性。例如：\n\n```\n\
    fs_stream.Write(\"\\n hello world\");\n```\n\n## 注释：\n\n## 在 JavaScript 中处理换行、特殊字符以及使用\
    \ \"\\\" 进行转义\n\n- 要创建包含以下内容的字符串：\n\n```\nHe said \"No way!\"\n```\n\n可以将字符串用单引号括起来，或者使用反斜杠字符对双引号进行转义：\n\
    \n```\nvar dialog = 'He said \"No Way!\"';\n```\n\n或\n\n```\nvar dialog = \"He\
    \ said \\\"No Way!\\\"\";\n```\n\n- 添加换行会使情况稍微复杂一些。要创建包含以下内容的字符串：\n\n```\nHe said\
    \ \"No way!\"\nShe said \"Way!\"\n```\n\n现在需要使用换行符 \"\\n\"：\n\n```\nvar dialog\
    \ = 'He said \"No Way!\" \\nShe said \"Way!\"';\n```\n\n## 注释：\n\n## 常见转义序列\n\n\
    | 转义序列 | 含义 |\n|---|---|\n| \\n | 换行 |\n| \\t | 制表符 |\n| \\' | 单引号 |\n| \\\" |\
    \ 双引号 |\n| \\\\ | 反斜杠 |\n\n## 注释：\n\n## 脚本 2-2\n\n### guest_book.asp\n\n```\n\
    <%@ Language=JavaScript %>\n<HTML><HEAD><TITLE>Guest Book</TITLE></HEAD><BODY\
    \ BGCOLOR=\"#FFFFFF\" >\n<center><font size=+1>Guest Book</font></center>\n\n\
    <%\nvar to_do = String(Request(\"to_do\"));\nvar this_script_url = String(Request.ServerVariables(\"\
    SCRIPT_NAME\"));\n\n//////////////////////////////////////////////////////////\n\
    // If the \"to_do\" variable does not contain any\n// instructions, create\n//\
    \ a form that lets visitors add an entry to the\n// guest book.\n\nif (to_do ==\
    \ \"undefined\"){\n\n\t// since most of the next few lines are html,\n\t// the\
