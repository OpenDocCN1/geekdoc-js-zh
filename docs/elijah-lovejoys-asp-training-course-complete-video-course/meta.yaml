  md: "# Creating a JavaScript Function\n\nA function is a way of encapsulating code\
    \ that is frequently used. For example, suppose you had to constantly sent the\
    \ string \"Hello World\" to the browser:\n\n```\nResponse.Write(\"Hello World\"\
    );\n```\n\nYou could create a function that would do this for you:\n\n```\nFunction\
    \ hello (){\n    Response.Write(\"Hello World\");\n}\n```\n\nso that all you'd\
    \ have to type would be:\n\n```\nhello();\n```\n\n# Notes:"
