    # Appending Information to a File


    +   This code would append the string "hello world" to the text file c:\file.txt.


    ```

    1. fso = new ActiveXObject("Scripting.FileSystemObject");

    2. fs_stream = fso.OpenTextFile("c:\file.txt",ForAppending);

    3. fs_stream.Write("hello world");

    ```


    +   Often, when appending to a file, you''ll also want to throw in a line-break
    (described next) to keep things readable. For example:


    ```

    fs_stream.Write("\n hello world");

    ```


