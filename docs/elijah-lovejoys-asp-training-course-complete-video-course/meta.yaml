- md: " # Summary\n\n- Tell IIS what language you are using with an \"@\" directive:\n\
    \  `<%@ Language=JavaScript %>`\n\n- ASP code goes inside of `<% ... %>` tags.\n\
    \n- Use `Response.Write()` to send stuff to the browser.\n\n- The JavaScript `Date()`\
    \ object makes working with dates a lot easier.\n\n# Lecture 2\n\n## Reading &\
    \ Writing\n\n### Objectives\n\n- Add Data from a Text File to a Web Page\n- Write\
    \ Form Data to a Text File\n\n## LESSON 2.1\n\nAdd Data from a Text File to a\
    \ Web Page\n\n### Tip of the Day\n\n- It's common these days for programs to have\
    \ a feature that displays a tip every time someone starts the program. This page\
    \ illustrates how the script can be incorporated into a Web site's home page.\
    \ The tips themselves are drawn from a text data file:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_28_0.png)\n\
    \n### New ASP Features\n\n- Request Object Server Variables\n- Regular Expressions\
    \ (JavaScript)\n- Using a Text File as a Database\n- while() (JavaScript Statement)\n\
    - Using FileSystemObject and the TextStream Object to Read Data from a File\n\
    - JavaScript if ... else Statements\n- Generating a Random Integer with the JavaScript\
    \ Math Object\n\n#### Notes:\n\n### Request Object Server Variables\n\nThis script\
    \ uses the PATH_TRANSLATED variable, which is the fully qualified path to the\
    \ current script. For example:\n`c:\\inetpub\\wwwroot\\tips\\tip_of_the_day.asp`\n\
    \nThe syntax for obtaining this information and assigning it to a variable is\
    \ as follows:\n\n```\nvar abs_path =  String(Request.ServerVariables(\"PATH_TRANSLATED\"\
    ));\n```\n\nRequest object server variables can be used to collect:\n\n- The path\
    \ to a file\n- HTTP header information\n- Name and IP address of the server on\
    \ which the script is being used\n\n#### Notes:\n\n### Regular Expressions (JavaScript)\n\
    \n• This script uses the `replace()` method, a regular expression method that\
    \ can be applied to any string to replace a pattern found within that string.\
    \ For example, if we have a string variable called url:\n\n```\nvar url = \"http://www.lovejoy.com\"\
    ;\n```\n\nthen we can use a regular expression to find and replace a pattern within\
    \ the url variable:\n\n```\nResponse.Write(url.replace(/http/,\"http\"));\n```\n\
    \nwhich would print a correct URL on the HTML page being generated (note how \"\
    htp\" has become \"http\"):\n\n```\nhttp://www.lovejoy.com\n```\n\n• The `replace\
    \ ()` method takes two arguments:\n  — The first is the regular expression specifying\
    \ the pattern we are looking for (\"/http/\").\n  — The second is the string with\
    \ which we want to replace it (\"http\").\n\n### Using a Text File as a Database\n\
    \n- For large amounts of information, it's best to use a database application,\
    \ such as MS SQL Server, Oracle, or MySQL.\n\n- For small, simple sets of data,\
    \ using a text file as a database is the best bet.\n\n- The tip database used\
    \ by tip_of_the_day.asp is a simple database that uses a text file as the database.\n\
    \n#### Notes:\n\n### while() (JavaScript Statement)\n\n- The while() command is\
    \ used to generate a loop that is repeated so long as a condition is true. The\
    \ while() command is, thus, ideal when you need your script to pull information\
    \ from a text file. This is done using the following logic:\n\n```\nwhile ( not\
    \ end-of-file ){ // this isn't real code!!\n\tdo something with a line from the\
    \ file...\n}\n```\n\n#### Notes:\n\n### Using FileSystemObject and the TextStream\
    \ Object to Read Data from a File\n\nThis code illustrates how a FileSystemObject\
    \ can be created, then used to create a TextStream object, which can, in turn,\
    \ be used to print the contents of a text file to a Web page:\n\n```\nfso = new\
    \ ActiveXObject(\"Scripting.FileSystemObject\");\nfile_stream = fso.OpenTextFile(\"\
    c:\\docs\\file.txt\");\nwhile (! file_stream.AtEndOfStream){\n    Response.Write(file_stream.ReadLine());\n\
    }\nfile_stream.close();\n```\n\n#### Notes:\n\n### JavaScript if ... else Statements\n\
    \nAn if statement will be executed if a condition is true. For example:\n\n```\n\
    if (1 > 0){\n    // code here should always be executed\n    // since 1 is always\
    \ greater than zero.\n}\n```\n\nAlternatively, a script might perform one task\
    \ if a condition is true and another task if it isn't.\n\n```\nif (number > 0){\n\
    \    Response.Write(\"number is greater than zero\");\n}\nelse {\n    Response.Write(\"\
    number is less than or equal to zero\");\n}\n```\n\nTwo points to remember:\n\n\
    - An if statement defines a block of code that will be executed only if a condition\
    \ is true.\n- Parentheses \"()\" go around the condition, and curly brackets \"\
    {}\" go around the statement.\n\n### Generating a Random Integer with the JavaScript\
    \ Math Object\n\n- JavaScript includes a built-in Math object that makes it easy\
    \ to take advantage of a number of mathematical functions that are built into\
    \ the JavaScript language. For example, the Math.random() function returns a random\
    \ number between 0.0 and 1.0:\n\n  `random_number = Math.random();`\n\n  This\
    \ might output one of these values:\n\n  `0.18359177861083936 rounding due to,\
    \ 0.16630404388409887, 0.7250774196619358,`\n  `0.450792710578013564, 0.19805329447345815,\
    \ 0.6124185344364772,`\n  `0.23355290088725944, etc. ...`\n\n- Because integers\
    \ are often more useful than floating point values, the floating point output\
    \ of Math.random() can be rounded to the nearest integer:\n\n  `random_number\
    \ = Math.round(Math.random());`\n\n- The random number generated this way will\
    \ always be either one or zero. To obtain numbers drawn from a larger pool, all\
    \ you need to do is multiply the output of Math.random() by an integer greater\
    \ than one. For example, this code will generate a number between zero and five:\n\
    \n  `random_number = Math.round(5 * Math.random());`\n\n## Script 2-1-1\n\ntips.txt\n\
    \n1. What do 8 of the 10 most profitable pharmaceutical companies in the world\
    \ have in common? Successful partnerships with Shelley Biotechnologies, Inc.\n\
    \n2. Need to talk to a sales engineer that will actually understand the technical\
    \ requirements of your project? <a href=\"contact.asp\">Contact Us</a>\n\n3. With\
    \ a 3-1 record, the Shelley Softball team shows how team- work can develop great\
    \ results even outside the lab.\n\nNotes:\n\n## Script 2-1-2\n\ntip_of_the_day.asp\n\
    \n```\n<%@ Language=JavaScript %>\n<HTML><HEAD><TITLE>Tip of the day</TITLE></HEAD><BODY\
    \ BGCOLOR=\"#FFFFFF\" >\n<center><h1>Tip Of The Day:</h1>\n\n<%\ntips_file = \"\
    tips.txt\"\n\n// this gives us the absolute path of this script which we'll use\n\
    // to get the path to the current directory so we can open a\n// file in it (the\
    \ tips_file, above).\nvar abs_path =\nString(Request.ServerVariables(\"PATH_TRANSLATED\"\
    ));\n\n// get rid of script name in absolute path\n// and replace with name of\
    \ file we want to open\nvar file_to_open =\nabs_path.replace(/\\\\\\w*\\.asp/,\
    \ \"\\\\\") + tips_file;\n\nfso = new\nActiveXObject(\"Scripting.FileSystemObject\"\
    );\n\n//Make sure we can find tips file before we get\n// carried away\nif (fso.FileExists(file_to_open)){\n\
    \n\t// open file and read contents:\n\tfile_stream = fso.OpenTextFile(file_to_open);\n\
    \n\ttips_array = new Array ();\n\t// loop through file and collect tips\n\twhile\
    \ (! file_stream.AtEndOfStream ){\n\t\tline_num = file_stream.Line;\n\t\ttip =\
    \ file_stream.ReadLine();\n\t\ttips_array[line_num-1] = tip;\n\t}\n\tfile_stream.close();\n\
    \n\t// generate random number based on number of tips\n\t// we found and print\
    \ one.\n\trandom_number = Math.round((tips_array.length-1)\n\t\t* Math.random());\n\
    \tResponse.Write(\"<p>\" +\n\ttips_array[random_number]);\n\n} // end of if file\
    \ exists\n specialising39.\n40. // if we can't find file\n41. else {\n42.    \
    \ Response.Write(\"<p>Sorry, the tips file seems to\n    be missing\")\n43. }\n\
    44. %>\n45. </center></BODY></HTML>\n```\n\n#### Notes:\n\n# LECTURE 2 READING\
    \ & WRITING\n\n## LESSON 2.2\n\nWrite Form Data to a Text File\n\n### Guest Book\
    \ Script\n\n- The guest book script performs three tasks required to maintain\
    \ a guest book:\n  - It generates a form to let visitors submit entries to the\
    \ guest book:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_41_0.png)\n\n- It collects\
    \ an entry from a visitor and adds it to the guest book:"
  mdcn: "\n # 摘要\n\n- 使用\"@\"指令告诉 IIS 你使用的语言：\n  `<%@ Language=JavaScript %>`\n\n\
    - ASP 代码放在 `<% ... %>` 标签内。\n\n- 使用 `Response.Write()` 将内容发送到浏览器。\n\n- JavaScript\
    \ 的 `Date()` 对象让日期处理变得更加容易。\n\n# 第 2 讲\n\n## 读写\n\n### 目标\n\n- 将文本文件中的数据添加到网页\n\
    - 将表单数据写入文本文件\n\n## 2.1 课\n\n将文本文件中的数据添加到网页\n\n### 每日提示\n\n- 如今，程序常见的一个功能是在每次启动时显示一条提示。本页面展示了如何将脚本整合到网站的首页中。这些提示本身来自一个文本数据文件：\n\
    \n![](img/bb6d9d5758805a03d9304333e9a2e084_28_0.png)\n\n### 新增 ASP 特性\n\n- Request\
    \ 对象服务器变量\n- 正则表达式（JavaScript）\n- 使用文本文件作为数据库\n- while()（JavaScript 语句）\n- 使用\
    \ FileSystemObject 和 TextStream 对象从文件中读取数据\n- JavaScript if ... else 语句\n- 使用\
    \ JavaScript Math 对象生成随机整数\n\n#### 注释：\n\n### Request 对象服务器变量\n\n此脚本使用 PATH_TRANSLATED\
    \ 变量，即当前脚本的完整路径。例如：\n`c:\\inetpub\\wwwroot\\tips\\tip_of_the_day.asp`\n\n获取此信息并将其赋值给变量的语法如下：\n\
    \n```\nvar abs_path =  String(Request.ServerVariables(\"PATH_TRANSLATED\"));\n\
    ```\n\nRequest 对象服务器变量可用于收集：\n\n- 文件路径\n- HTTP 头信息\n- 脚本所用服务器的名称和 IP 地址\n\n####\
    \ 注释：\n\n### 正则表达式（JavaScript）\n\n• 此脚本使用 `replace()` 方法，这是一个正则表达式方法，可应用于任何字符串以替换其中找到的某个模式。例如，如果我们有一个名为\
    \ url 的字符串变量：\n\n```\nvar url = \"http://www.lovejoy.com\";\n```\n\n那么我们可以使用正则表达式在\
    \ url 变量中查找并替换某个模式：\n\n```\nResponse.Write(url.replace(/http/,\"http\"));\n```\n\
    \n这将在生成的 HTML 页面上打印出正确的 URL（注意 \"htp\" 如何变成了 \"http\"）：\n\n```\nhttp://www.lovejoy.com\n\
    ```\n\n• `replace()` 方法接受两个参数：\n  — 第一个是正则表达式，指定我们要查找的模式（\"/http/\"）。\n  — 第二个是我们想用来替换它的字符串（\"\
    http\"）。\n\n### 使用文本文件作为数据库\n\n- 对于大量信息，最好使用数据库应用程序，如 MS SQL Server、Oracle 或 MySQL。\n\
    \n- 对于小型、简单的数据集，使用文本文件作为数据库是最佳选择。\n\n- tip_of_the_day.asp 使用的提示数据库就是一个使用文本文件作为数据库的简单数据库。\n\
    \n#### 注释：\n\n### while()（JavaScript 语句）\n\n- while() 命令用于生成一个循环，只要条件为真，该循环就会重复执行。因此，当你需要脚本从文本文件中提取信息时，while()\
    \ 命令非常理想。这使用以下逻辑：\n\n```\nwhile ( 未到文件末尾 ){ // 这不是真正的代码!!\n\t对文件中一行内容执行操作...\n\
    }\n```\n\n#### 注释：\n\n### 使用 FileSystemObject 和 TextStream 对象从文件中读取数据\n\n此代码展示了如何创建\
    \ FileSystemObject，然后使用它创建 TextStream 对象，而 TextStream 对象又可以用来将文本文件的内容打印到网页上：\n\
    \n```\nfso = new ActiveXObject(\"Scripting.FileSystemObject\");\nfile_stream =\
    \ fso.OpenTextFile(\"c:\\docs\\file.txt\");\nwhile (! file_stream.AtEndOfStream){\n\
    \    Response.Write(file_stream.ReadLine());\n}\nfile_stream.close();\n```\n\n\
    #### 注释：\n\n### JavaScript if ... else 语句\n\n如果条件为真，则执行 if 语句。例如：\n\n```\nif (1\
    \ > 0){\n    // 这里的代码应该始终执行\n    // 因为 1 总是大于零。\n}\n```\n\n或者，脚本可能在条件为真时执行一项任务，在条件为假时执行另一项任务。\n\
    \n```\nif (number > 0){\n    Response.Write(\"number is greater than zero\");\n\
    }\nelse {\n    Response.Write(\"number is less than or equal to zero\");\n}\n\
    ```\n\n需要记住的两点：\n\n- if 语句定义了一个代码块，仅在条件为真时才会执行。\n- 圆括号 \"()\" 包围条件，花括号 \"{}\"\
    \ 包围语句。\n\n### 使用 JavaScript Math 对象生成随机整数\n\n- JavaScript 包含一个内置的 Math 对象，可以轻松利用\
    \ JavaScript 语言中内置的许多数学函数。例如，Math.random() 函数返回一个 0.0 到 1.0 之间的随机数：\n\n  `random_number\
    \ = Math.random();`\n\n  这可能输出以下值之一：\n\n  `0.18359177861083936 rounding due to,\
    \ 0.16630404388409887, 0.7250774196619358,`\n  `0.450792710578013564, 0.19805329447345815,\
    \ 0.6124185344364772,`\n  `0.23355290088725944, etc. ...`\n\n- 由于整数通常比浮点值更有用，Math.random()\
    \ 的浮点输出可以四舍五入到最接近的整数：\n\n  `random_number = Math.round(Math.random());`\n\n- 以这种方式生成的随机数将始终为一或零。要获取来自更大范围的数字，只需将\
    \ Math.random() 的输出乘以一个大于一的整数。例如，以下代码将生成一个零到五之间的数字：\n\n  `random_number = Math.round(5\
    \ * Math.random());`\n\n## 脚本 2-1-1\n\ntips.txt\n\n1. 全球 10 家最赚钱的制药公司中有 8 家有什么共同点？与\
    \ Shelley Biotechnologies, Inc. 的成功合作。\n\n2. 需要与一位真正理解您项目技术需求的销售工程师交谈吗？<a href=\"\
    contact.asp\">联系我们</a>\n\n3. 凭借 3-1 的战绩，Shelley 垒球队展示了团队合作如何在实验室之外也能取得优异成绩。\n\n\
    注释：\n\n## 脚本 2-1-2\n\ntip_of_the_day.asp\n\n```\n<%@ Language=JavaScript %>\n\
    <HTML><HEAD><TITLE>Tip of the day</TITLE></HEAD><BODY BGCOLOR=\"#FFFFFF\" >\n\
    <center><h1>Tip Of The Day:</h1>\n\n<%\ntips_file = \"tips.txt\"\n\n// this gives\
    \ us the absolute path of this script which we'll use\n// to get the path to the\
    \ current directory so we can open a\n// file in it (the tips_file, above).\n\
    var abs_path =\nString(Request.ServerVariables(\"PATH_TRANSLATED\"));\n\n// get\
    \ rid of script name in absolute path\n// and replace with name of file we want\
    \ to open\nvar file_to_open =\nabs_path.replace(/\\\\\\w*\\.asp/, \"\\\\\") +\
    \ tips_file;\n\nfso = new\nActiveXObject(\"Scripting.FileSystemObject\");\n\n\
    //Make sure we can find tips file before we get\n// carried away\nif (fso.FileExists(file_to_open)){\n\
    \n\t// open file and read contents:\n\tfile_stream = fso.OpenTextFile(file_to_open);\n\
    \n\ttips_array = new Array ();\n\t// loop through file and collect tips\n\twhile\
    \ (! file_stream.AtEndOfStream ){\n\t\tline_num = file_stream.Line;\n\t\ttip =\
    \ file_stream.ReadLine();\n\t\ttips_array[line_num-1] = tip;\n\t}\n\tfile_stream.close();\n\
    \n\t// generate random number based on number of tips\n\t// we found and print\
    \ one.\n\trandom_number = Math.round((tips_array.length-1)\n\t\t* Math.random());\n\
    \tResponse.Write(\"<p>\" +\n\ttips_array[random_number]);\n\n} // end of if file\
    \ exists\n specialising39.\n40. // if we can't find file\n41. else {\n42.    \
    \ Response.Write(\"<p>Sorry, the tips file seems to\n    be missing\")\n43. }\n\
    44. %>\n45. </center></BODY></HTML>\n```\n\n#### 注释：\n\n# 第 2 讲 读写\n\n## 2.2 课\n\
    \n将表单数据写入文本文件\n\n### 访客留言簿脚本\n\n- 访客留言簿脚本执行维护留言簿所需的三项任务：\n  - 生成一个表单，让访客提交留言：\n\
    \n![](img/bb6d_TOPIC_todo6302dbb6d9d5758805a03d9304333e9a2e084_41_0.png)\n\n ánè\
    \  )收集访客的留言并将其添加到留言簿中：\n"
