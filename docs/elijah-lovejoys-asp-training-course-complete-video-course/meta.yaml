    \ with a browser and TCP/IP connection\n\nNotes:\n\n## Tour of This Lecture's\
    \ Project\n\n- The scripts in this chapter use a very simple password mechanism.\
    \ To edit the database, a Web user has to know that password:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_91_0.png)\n\
