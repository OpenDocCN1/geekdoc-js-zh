    \n![](img/bb6d9d5758805a03d9304333e9a2e084_58_0.png)\n\n- 事件按子类别组织，然后按日期列出：\n\n\
    ![](img/bb6d9d5758805a03d9304333e9a2e084_59_0.png)\n\n## 第三讲 数据库驱动页面\n\n55\n\n\
    - 数据库存储关于人员的一套相当标准的联系信息：\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_60_0.png)\n\
    \n该脚本生成一个链接，使用户可以访问存储在数据库中的网站：\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_61_0.png)\n\
    \n## 新增 ASP 功能\n\n- 关系数据库\n- 结构化查询语言（**SQL**）\n- *Microsoft Access*\n- ADO、ADODB、ODBC、DSN\
    \ 等……\n- 数据库连接对象\n- 记录集对象\n- 创建 JavaScript `for()` 循环\n- 创建 JavaScript 函数\n- 使用\
    \ Include 文件共享代码\n- 创建 JavaScript 对象存储信息\n\n备注：\n\n## 关系数据库\n\n- 需要理解的两个概念：\n\
    \  - 信息如何存储在表中？\n  - 一个表中的信息如何与另一个表中的信息关联？\n\n备注：\n\n## 将信息存储在表中\n\n这些表格展示了本讲脚本使用的两种信息如何组织成表。第一个存储关于类别的信息。第二个显示了实际存储在数据库中的人员、事件和网站的列表：\n\
    \n## 类别\n\n| category_uid | category_name | category_description |\n| --- | ---\
    \ | --- |\n| 1 | People | A list of people, their phone numbers, and information\
    \ about them |\n| 2 | Events | A list of scheduled events and important dates\
    \ |\n| 3 | Web Sites | Web sites that relate to our industry or are of general\
    \ interest |\n\n## 数据\n\n| data_uid | data_name | data_category | data_subcategory\
    \ | data_description |\n| --- | --- | --- | --- | --- |\n| 1 | lovejoy.com | 3\
    \ | General Interest | overrated Web site |\n| 2 | yahoo! | 3 | General Interest\
    \ | old-school search engine |\n| 3 | jane doe | 1 | Employees | VP of something\
    \ or other |\n| 9 | new event | 2 | Company Events | new product release |\n\n\
    关于表格需要注意的几点：\n\n- 表中的每一行存储一条信息，称为一条**记录**。\n- 每条记录被分成若干个**字段**。\n- 每个字段包含不同类型的信息。\n\
    \n## 关联存储在不同表中的信息\n\n- **主键**是用于唯一标识表中一条记录的字段。\n- **外键**是用于将表中的字段与另一表中记录的主键关联起来的字段。\n\
    \n备注：\n\n## 使用 SQL 从数据库检索数据\n\n- 要选择数据表中的所有信息，可以使用以下查询：\n\n  `select * from data`\n\
    \n  数据库将返回一组记录，称为**记录集**，如下所示：\n\n| data_uid | data_name | data_category | data_subcategory\
    \ | data_description |\n|----------|-----------|---------------|------------------|------------------|\n\
    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |\n| 2 | yahoo!\
    \ | 3 | General Interest | old-school search engine |\n| 3 | jane doe | 1 | EmployeesExtraterrestrial\
    \ | VP of something or other |\n| 9 | new event | 2 | Company Events | new product\
    \ release |\n\n- 要将查询范围限制(category 3)，可以在 select 语句中添加 where 子句，将语句范围限制为满足特定条件的字段值记录：\n\
    \n  `select * from data where data_category = 3`\n\n  这将结果记录集限制为两条记录：\n\n| data_uid\
    \ | data_name | data_category | data_subcategory | data_description |\n|----------|-----------|---------------|------------------|------------------|\n\
    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |\n| 2 | yahoo!\
    \ | 3 | General Interest | old-school search engine |\n\n- 其他时候，可能不需要获取表中的所有字段。在这种情况下，查询可以请求特定字段，而不是使用\
    \ `*` 通配符。例如：\n\n  `select data_name, data_description from data where data_category\
    \ = 3`\n\n  这将生成以下记录集：\n\n| data_uid | data_description |\n|----------|------------------|\n\
    | 1 | overrated Web site |\n| 2 | old-school search engine |\n\n- 最后，通常需要对记录集进行排序，以便结果有序。这可以通过在查询后附加\
    \ order by 子句来实现：\n\n  `select data_name from data order by data_name`\n\n  这将返回按字母顺序排序的名称列表：\n\
    \n| data_name |\n|-----------|\n| jane doe |\n| lovejoy.com |\n| new event |\n\
    | yahoo! |\n\n## Microsoft Access\n\n本课程使用 *Microsoft Access* 的三个原因：\n\n1. 许多人已经拥有\
    \ MS Access 的副本。\n2. MS Access 的 ODBC 驱动程序与各种 Windows 操作系统捆绑在一起。\n3. MS Access\
    \ 数据库是文件，易于通过 ftp 传输或放在软盘或 CD-ROM 上。\n\n备注：\n\n## ADO、ADODB、ODBC、DSN 等……\n\n创建数据库驱动的\
    \ ASP 页面涉及三个步骤：\n\n1. 创建数据库（可以是 Access 数据库或任何具有 ODBC 驱动程序的其他数据库）。\n\n2. 在 Web\
    \ 服务器上，创建一个 DSN（数据源名称，即 ODBC 数据源）。这使您的脚本能够找到并连接到您的数据库。\n\n3. 编写一个使用 ADO（ActiveX\
    \ 数据对象）的 ASP 脚本，创建一个或多个记录集，并可能向数据库提供 SQL 指令。\n\n备注：\n\n## ***数据库连接对象***\n\n- 要创建与名为\
    \ ch3db 的 DSN 的连接：\n\n```\n1. DSN = \"DSN=ch3db\";\n2. Conn = Server.CreateObject(\"\
    ADODB.Connection\");\n3. Conn.Open(DSN);\n4. // 现在连接已打开\n5. // 您可以在这里对它执行操作\n\
    6. Conn.Close ();\n```\n\n- 建立连接后，可以执行两种操作：\n\n- 执行不返回记录的 SQL 语句。\n\n- 创建记录集对象以收集\
    \ SQL select 语句的结果。\n\n- \\\n\n- 这些 SQL 语句不返回记录：\n\ninsert  \nupdate  \ndelete\n\
    \n- 建立连接后，可以使用连接对象的 Execute() 方法执行 SQL 语句：\n\n```\nConn.Execute(SQL_statement);\n\
    Conn.Execute(\"update categories set\n        category_description = 'Spiffy sites!'\n\
    \        where category_uid = 3\");\n```\n\n有时，先将 SQL 语句赋值给变量会更方便：\n\n```\nvar\
    \ insert_statement = \"insert into data (data_name,\n        data_category, data_subcategory,\
    \ data_description)\n        values ('prentice hall', 3, 'General Interest', '\n\
    \        web site for this book')\";\nConn.Execute(insert_statement);\n```\n\n\
    ## 记录集对象\n\n让我们考虑这个类别表，我们在本讲中已经见过：\n\n## 类别\n\n| category_uid | category_name\
    \ | category_description |\n| --- | --- | --- |\n| 1 | People | A list of people,\
    \ their phone numbers, and information about them |\n| 2 | Events | A list of\
    \ scheduled events and important dates |\n| 3 | Web Sites | Web sites that relate\
    \ to our industry or are of general interest |\n\n在这里，我们将创建可用于将其内容添加到网页的代码：\n\n\
    ```\n<%@ Language=JavaScript %>\n<%\nDSN = \"DSN=ch3db\";\nConn = Server.CreateObject(\"\
    ADODB.Connection\");\nConn.Open(DSN);\n\nsql = \"SELECT * FROM categories \";\n\
    rs = Server.CreateObject(\"ADODB.RecordSet\");\nrs.Open (sql, Conn);\n\nout =\
    \ \"<table border=1>\";\nout += \"<tr><td><pre>category_uid</pre></td><td><pre>category_name</pre></td><td><pre>category_description</pre></td></tr>\"\
    ;\nwhile (! (rs.EOF)){\nout += \"<tr><td>\";\nout += String(rs.fields.item(\"\
    category_uid\")) + \"</td><td>\";\nout += String(rs.fields.item(\"category_name\"\
    )) + \"</td><td>\";\nout += String(rs.fields.item(\"category_description\")) +\
    \ \"</td><tr>\";\nrs.move(1);\n} // end while recordset\nout += \"</table>\";\n\
    \nrs.Close ();\n```\n"
