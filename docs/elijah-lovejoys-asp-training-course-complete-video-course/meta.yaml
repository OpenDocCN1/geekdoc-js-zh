  md: "# CDONTS: Email and Why Microsoft Should Hire More Poets\n\n+   - CDONTS stands\
    \ for Collaboration Data Objects for Windows NT Server. You can use CDONTS to\
    \ create an object called a \"NewMail object.\" For example:\n  1. mail_ob = Server.CreateObject(\"\
    CDONTS.NewMail\");\n  2. mail_ob.Send(\"sender@lovejoy.com\",\"\n     recipient@lovejoy.com\"\
    ,\"subject\",\"body\");\n\n+   - The only required argument to the Send() method\
    \ is a From address, which means that it's possible to set the To address, subject,\
    \ and body of the message using properties of the NewMail object before using\
    \ the Send() method. For example:\n  1. mail_ob = Server.CreateObject(\"CDONTS.NewMail\"\
    );\n  2. mail_ob.Subject = \"Tomorrow's Meeting\";\n  3. mail_ob.Body = \"Jane,\
    \ I won't be able to make the\n     meeting. Can we reschedule?\";\n  4. mail_ob.To\
    \ = \"Jane@lovejoy.com\";\n  5. mail_ob.Send(\"Elijah@lovejoy.com\");\n\n+   -\
    \ Functionally, there's no difference between this snippet with five lines of\
    \ code and the previous block with two lines of code. Breaking it up like this\
    \ makes it easier to read, which is nice, but it's simply a matter of taste."
  merge: -1
