  md: '# Response.Write()


    +   - Response.Write() is the Write() method of the Response object. The Response
    object is the ASP object that manages anything that involves delivering information
    to the browser.

    - The Write() method is a lot like the "print" command used in many programming
    languages: It is used to write information to the HTML page that is delivered
    to the browser. For example:


    ```

    Response.Write("<h1>Hello World</h1>");

    ```


    will create a heading on the Web page that is output from your script, as shown
    here.


