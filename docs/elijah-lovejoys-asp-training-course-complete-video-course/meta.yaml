    \ special characters, and escaping with \"\\\" in JavaScript\n\n## Notes:\n\n\
    ## Working with HTML Forms\n\n- The guest book script illustrates two of the most\
    \ common uses of forms.\n  1. Submitting information that the visitor types into\
    \ a form to a script (the guest book form lets visitors add information to the\
    \ guest book).\n  2. Submitting instructions embedded within a link or a form\
    \ that tells a script what to do.\n\n## Notes:\n\n## Collecting Information Submitted\
    \ by a Visitor\n\n- Here's an example of a simple form that lets a visitor submit\
    \ an e-mail address:\n\n```\n1. <form action=\"script_url.asp\">\n2. Email: <input\
    \ type=text name=email value=\"\">\n3. <input type=submit name=submit_button value=\"\
    Click Here to Submit\">\n4. </form>\n```\n\n## Notes:\n\n## Instructions Telling\
    \ a Script What to Do\n\nBoth this form and the following link will do the same\
    \ thing:\n\n### FORM:\n\n```\n<form action=\"script_url.asp\">\n<input type=hidden\
    \ name=to_do value=\"perform_task\">\n<input type=submit name=submit_button value=\"\
    Perform Task\">\n</form>\n```\n\n### LINK:\n\n```\n<a href=\"script_url.asp?to_do=Perform+Task\"\
    > Perform Task </a>\n```\n\n## Notes:\n\n## Using the Request Object to Collect\
    \ Incoming Form Information\n\n- The ASP Request object makes collecting form\
    \ information a breeze. For example, if a script needs to collect the value of\
    \ the form element to_do and put this into a variable called \"form_instruction\"\
    , you could do this:\n\n```\nvar form_instruction = String(Request(\"to_do\"));\n\
    ```\n\n- Note that three things are happening in this line:\n  1. The to_do property\
    \ of the Request object is being passed as an argument to a JavaScript function\
    \ called String().\n  2. The String() function is converting this value into a\
    \ string.\n  3. The resulting string is being assigned to the variable form_instruction.\n\
    \n- Because all form information is stored in the Request object, finding the\
    \ value of a form element is simply a matter of obtaining that property of the\
    \ Request object.\n\n## Notes:\n\n## undefined, a Special JavaScript Value\n\n\
    - Consider this line:\n\n```\nvar form_instruction = String(Request(\"to_do\"\
    ));\n```\n\nIf \"to_do\" was not set in the form or link that points to the script,\
    \ this will return undefined. As a result, if a script is using a form variable\
    \ that may not have been set, it is sometimes necessary to check for the value\
    \ undefined.\n\n## Notes:\n\n## Appending Information to a File\n\n- This code\
    \ would append the string \"hello world\" to the text file c:\\file.txt.\n\n```\n\
    1. fso = new ActiveXObject(\"Scripting.FileSystemObject\");\n2. fs_stream = fso.OpenTextFile(\"\
    c:\\\\file.txt\",ForAppending);\n3. fs_stream.Write(\"hello world\");\n```\n\n\
    - Often, when appending to a file, you'll also want to throw in a line-break (described\
    \ next) to keep things readable. For example:\n\n```\nfs_stream.Write(\"\\n hello\
    \ world\");\n```\n\n## Notes:\n\n## Working with Linebreaks, Special Characters,\
    \ and Escaping with \"\\\" in JavaScript\n\n- To create the string containing:\n\
    \n```\nHe said \"No way!\"\n```\n\neither enclose the string in single quotes\
    \ or escape the double quotes using the backslash character:\n\n```\nvar dialog\
    \ = 'He said \"No Way!\"';\n```\n\nor\n\n```\nvar dialog = \"He said \\\"No Way!\\\
    \"\";\n```\n\n- Add a linebreak and it gets a little more tricky. To create a\
    \ string that contains:\n\n```\nHe said \"No way!\"\nShe said \"Way!\"\n```\n\n\
    it is now necessary to use a linebreak \"\\n\" symbol:\n\n```\nvar dialog = 'He\
    \ said \"No Way!\" \\nShe said \"Way!\"';\n```\n\n## Notes:\n\n## Common Escape\
    \ Sequences\n\n| Escape Sequence | Meaning |\n|---|---|\n| \\n | Newline |\n|\
    \ \\t | Tab |\n| \\' | Single quote |\n| \\\" | Double quote |\n| \\\\ | Backslash\
    \ |\n\n## Notes:\n\n## Script 2-2\n\n### guest_book.asp\n\n```\n<%@ Language=JavaScript\
    \ %>\n<HTML><HEAD><TITLE>Guest Book</TITLE></HEAD><BODY BGCOLOR=\"#FFFFFF\" >\n\
    <center><font size=+1>Guest Book</font></center>\n\n<%\nvar to_do = String(Request(\"\
    to_do\"));\nvar this_script_url = String(Request.ServerVariables(\"SCRIPT_NAME\"\
    ));\n\n//////////////////////////////////////////////////////////\n// If the \"\
    to_do\" variable does not contain any\n// instructions, create\n// a form that\
    \ lets visitors add an entry to the\n// guest book.\n\nif (to_do == \"undefined\"\
    ){\n\n\t// since most of the next few lines are html,\n\t// the ASP tag is closed\n\
    \t// and normal html is added to the page. Only\n\t// the name of the script is\n\
    \t// dynamically generated, so that the script\n\t// will still work if its name\n\
    \t// is changed down the road.\n%>\n<p>Please use the form below to submit an\
    \ entry\n   to our guest book:<hr>\n<form action = \"<%= this_script_url %>\"\
    >\n   Name: <br><input type=text name=\"Name\" value=\"\" size=50><br>\n   Email:\
    \ <br><input type=text name=\"Email\" value=\"\" size=50><br>\n   Comments: <br><textarea\
    \ name=\"Comments\" cols=50 rows=5></textarea><br>\n   <input type=submit name=\"\
    Submit Button\" value=\"Click Here to Submit\">\n   <input type=hidden name=\"\
    to_do\" value=\"add_entry\">\n</form>\n\n<%\n} // end if (to_do == \"undefined\"\
    )\nelse {\n\n//////////////////////////////////////////////////////////\n// If\
    \ the \"to_do\" variable is defined, we need to create a file system\n// object\
    \ that will let us read or write to the guest book file\n```\n\n## ASP TRAINING\
