- md: " Elijah Lovejoy's ASP TRAINING COURSE WORKBOOK\n\n- Easy-to-follow companion\
    \ workbook\n- Contains slides and graphics from video lectures\n\nActive Server\
    \ Pages\n\nACTIVE SERVER PAGES\n\nElijah Lovejoy's ASP Training Course\n\nELIJAH\
    \ LOVEJOY\n\nPrentice Hall PTR\nUpper Saddle River, New Jersey 07458\nCopyright\
    \ © 2002 Prentice Hall PTR\n\n## Contents\n\n- Lecture 1 Keeping Time 1\n- Lecture\
    \ 2 Reading & Writing 21\n- Lecture 3 Database-Driven Pages 51\n- Lecture 4 Editing\
    \ Records 83\n- Lecture 5 Shopping Cart 143\n- Lecture 6 Email 191\n- Lecture\
    \ 7 Exploring ASP.NET 201\n\n## Lecture 1\n\n### Keeping Time\n\n#### Objectives\n\
    \n- Add the Date to an HTML Page Using ASP and the JavaScript `Date()` Function\n\
    - Generate a Date \"On the Fly\" and Send It to the Browser\n\n#### LESSON 1.1\n\
    \n##### Add the Date to an HTML Page Using ASP and the JavaScript `Date()` Function\n\
    \n##### New ASP Features\n\n- `<% ... %>` (The ASP Tag)\n- `<%@ Language=JavaScript\
    \ %>`\n- new Operator\n- Date() Object\n- Response.Write( )\n\nNotes:\n\n#####\
    \ <% ... %> (The ASP Tag)\n\n- Any code enclosed in ASP tags will be executed\
    \ on the server. Furthermore, this code will be removed from the page after it\
    \ is executed.\n\n- For example, the \"=\" is equivalent to \"print\" in many\
    \ languages and is used here to put the words \"Hello World\" into a page of HTML:\n\
    \n```\n1. <HTML><HEAD><TITLE>Simple Date</TITLE></HEAD>\n2. <BODY BGCOLOR=\"#FFFFFF\"\
    \ >\n3.\n4. <h1><% = \"Hello World\" %></h1>\n5.\n6. </BODY></HTML>\n```\n\n-\
    \ This will generate and send the following HTML page to the browser:\n\n```\n\
    1. <HTML><HEAD><TITLE>Simple Date</TITLE></HEAD>\n2. <BODY BGCOLOR=\"#FFFFFF\"\
    \ >\n3.\n4. <h1>Hello World</h1>\n5.\n6. </BODY></HTML>\n```\n\n- Note how line\
    \ 4 has changed from the source to the code that is actually sent to the browser.\n\
    \n##### ASP vs. HTML\n\n- ASP files end with the .asp extension so the Web server\
    \ knows what it is.\n- ASP files include server-side code that contain instructions\
    \ for the server.\n\nNotes:\n\n##### <%@ Language=JavaScript %>\n\n- It's good\
    \ practice to make JavaScript the default language in all of your scripts. To\
    \ specify JavaScript, add this line to the beginning of all of your script:\n\
    \  `<%@ Language=JavaScript %>`\n\n```\n<%@ Language=JavaScript %>\n```\n\nNotes:\n\
    \n##### new Operator\n\n- new operator is used to create a new object or array.\n\
    - Objects are organized around particular areas of activity.\n\nObjects consist\
    \ of methods that do things for us and properties that contain information.\n\n\
    Notes:\n\n##### Date() Object\n\n- Use the new operator to create a date object:\n\
    \  `date_object = new Date();`\n- This method returns the data as a human-readable\
    \ string:\n  `date_object.toString()`\n\nNotes:\n\n##### Response.Write()\n\n\
    - Response.Write() is the Write() method of the Response object. The Response\
    \ object is the ASP object that manages anything that involves delivering information\
    \ to the browser.\n- The Write() method is a lot like the \"print\" command used\
    \ in many programming languages: It is used to write information to the HTML page\
    \ that is delivered to the browser. For example:\n\n```\nResponse.Write(\"<h1>Hello\
    \ World</h1>\");\n```\n\nwill create a heading on the Web page that is output\
    \ from your script, as shown here.\n\n##### Script 1-1\n\n**date_simple.asp**\n\
    \n```\n<%@ Language=JavaScript %>\n\n<HTML><HEAD><TITLE>Simple Date</TITLE></HEAD>\n\
    <BODY BGCOLOR=\"#FFFFFF\" >\n\n<%\ndate_object = new Date();\nResponse.Write(date_object.toString())\n\
    %>\n\n</BODY></HTML>\n```\n\n#### LESSON 1.2\n\n##### Generate a Date \"On the\
    \ Fly\" and Send It to the Browser\n\n##### New ASP Features\n\n- // (Comment)\n\
    - Number (JavaScript Data Type)\n- String (JavaScript Data Type)\n- Array (JavaScript\
    \ Data Type)\n- Concatenation (JavaScript \"+\" Operator)\n\nNotes:\n\n##### //\
    \ (Comment)\n\n- Comments make it easier to share your code with others. Here\
    \ is some commented code:\n  1. // For some reason, it's traditional to show people\
    \ how to 'print' things by printing 'hello world'.\n  2. // In ASP, this is done\
    \ using the Response.Write ( ) command\n  3. // (The Write method of the ASP Response\
    \ object. This looks like:\n  4. Response.Write (\"Hello World\");\n\nNotes:\n\
    \n##### Number (JavaScript Data Type)\n\nA number is an integer or real number\
    \ that can be represented by a literal variable or as a literal. Here are a few\
    \ examples:\n\n```\n9                          // the number 9\n3.45         \
    \              // the number 3.45\n3 + 2                      // the number 5\n\
    number = 12                // the variable \"number\" has been set to 12\nnumber\
    \ + 2                 // the number 15\n```\n\nNotes:\n\n##### String (JavaScript\
    \ Data Type)\n\n- A string is a sequence of letters, numbers, spaces, and various\
    \ other characters, which, like numbers, can be expressed literally or stored\
    \ in a variable. For example:\n\n```\n\"Hello World\"              // the archetypal\
    \ string.\n\"Tel: 805-966-0611\"        // another literal string.\nName = \"\
    Wilbur\"            // a variable called name with a value\n                 \
    \          // of \"Wilbur\"\n```\n\nNotes:\n\n##### Array (JavaScript Data Type)\n\
    \n- An array is an ordered sequence of values:\n  - `(1,2,3)` // the numbers one,\
    \ two, and three\n  - `(\"Wilbur\",\"Fred\",\"Gordon\")` // three names.\n  -\
    \ `name_array = (\"Wilbur\",\"Fred\",\"Gordon\")` // a variable called name_array\
    \ storing three names\n\n- Because arrays are ordered, it is possible to invoke\
    \ a particular value in an array by referring to its index value:\n  - `name_array[0]`\
    \ // returns \"Wilbur\"\n  - `name_array[2]` // returns \"Gordon\"\n  - `name_array[3]\
    \ = \"Becky\"` // name_array is now //(\"Wilbur\",\"Fred\",\"Gordon\",\"Becky\"\
    )\n\nNotes:\n\n##### Concatenation (JavaScript \"+\" Operator)\n\n- Concatenation\
    \ makes it possible to make a single string out of two strings by \"concatenating\"\
    \ them:\n  `full_name = \"jane\" + \" \" + \"doe\"  // full_name is //set to \"\
    jane doe\"`\n\n- Note that in concatenating the strings \"jane\" and \"doe\" it\
    \ was necessary to put a space between them (\" \") to prevent the value of full_name\
    \ being set to \"janedoe\".\n\n```\nfull_name = \"jane\" + \" \" + \"doe\"\n//\
    \ full_name is //set to \"jane doe\"\n```\n\nNotes:\n\n##### Script 1-2\n\n**date_fancy.asp**\n\
    \n```\n<%@ Language=JavaScript %>\n\n<HTML><HEAD><TITLE>Fancy Date</TITLE></HEAD>\n\
    <BODY BGCOLOR=\"#FFFFFF\" >\n\n<%\nvar now, days, months, day_of_week_int,\nday_of_month_int,\
    \ month_int, year, today_date;\nnow = new Date();\n\ndays = new Array (\"Sunday\"\
    ,\"Monday\",\"Tuesday\",\n\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\");\n\
    months = new Array (\"January\",\"February\",\"March\",\n\"April\",\"May\",\"\
    June\",\"July\",\"August\",\"September\",\n\"October\",\"November\",\"December\"\
    );\nday_of_week_int  = now.getDay();\nday_of_month_int = now.getDate();\nmonth_int\
    \ = now.getMonth();\nyear = now.getFullYear();\n\ntoday_date = days[day_of_week_int]\
    \ + \", \" +\nmonths[month_int] + \" \" + day_of_month_int + \", \" +\nyear;\n\
    \nResponse.Write (today_date);\n%>\n\n</BODY></HTML>\n```"
  mdcn: "\nElijah Lovejoy 的 ASP 培训课程练习册\n\n- 易于使用的配套练习册\n- 包含视频讲座中的幻灯片和图表\n\nActive\
    \ Server Pages\n\n活动服务器页面\n\nElijah Lovejoy 的 ASP 培训课程\n\nELIJAH LOVEJOY\n\nPrentice\
    \ Hall PTR\nUpper Saddle River, New Jersey 07458\n版权所有 © 2002 Prentice Hall PTR\n\
    \n## 目录\n\n- 讲座 1 时间记录 1\n- 讲座 2 读写操作 21\n- 讲座 3 数据库驱动页面 51\n- 讲座 4 编辑记录 83\n\
    - 讲座 5 购物车 143\n- 讲座 6 电子邮件 191\n- 讲座 7 探索 ASP.NET 201\n\n## 讲座 1\n\n### 时间记录\n\
    \n#### 目标\n\n- 使用 ASP 和 JavaScript 的 `Date()` 函数将日期添加到 HTML 页面\n- 动态生成日期并将其发送到浏览器\n\
    \n#### 课程 1.1\n\n##### 使用 ASP 和 JavaScript 的 `Date()` 函数将日期添加到 HTML 页面\n\n#####\
    \ 新的 ASP 特性\n\n- `<% ... %>`（ASP 标签）\n- `<%@ Language=JavaScript %>`\n- new 运算符\n\
    - Date() 对象\n- Response.Write( )\n\n注释：\n\n##### <% ... %>（ASP 标签）\n\n- 任何包含在\
    \ ASP 标签中的代码都将在服务器上执行。此外，此代码在执行后将从页面中移除。\n\n- 例如，\"=\" 在许多语言中等同于 \"print\"，此处用于将\
    \ \"Hello World\" 这两个词放入 HTML 页面中：\n\n```\n1. <HTML><HEAD><TITLE>Simple Date</TITLE></HEAD>\n\
    2. <BODY BGCOLOR=\"#FFFFFF\" >\n3.\n4. <h1><% = \"Hello World\" %(open_box)%></h1>\n\
    5.\n6. </BODY></HTML>\n```\n\n- 这将生成并向浏览器发送以下 HTML 页面：\n\n```\n1. <HTML><HEAD><TITLE>Simple\
    \ Date</TITLE></HEAD>\n2. <BODY BGCOLOR=\"#FFFFFF\" >\n3.\n4. <h1>Hello World</h1>\n\
    5.\n6. </BODY></HTML>\n```\n\n- 注意第 4 行从源代码到实际发送到浏览器的代码是如何变化的。\n\n##### ASP 与\
    \ HTML 的对比\n\n- ASP 文件以 .asp 扩展名结尾，以便 Web 服务器识别其类型。\n- ASP 文件包含服务器端代码，其中包含对服务器的指令。\n\
    \n注释：\n\n##### <%@ Language=JavaScript %>\n\n- 在所有脚本中将 JavaScript 设为默认语言是很好的做法。要指定\
    \ JavaScript，请在所有脚本的开头添加以下行：\n  `<%@ Language=JavaScript %>`\n\n```\n<%@ Language=JavaScript\
    \ %>\n```\n\n注释：\n\n##### new 运算符\n\n- new 运算符用于创建新对象或数组。\n- 对象是围绕特定活动领域组织的。\n\
    \n对象由为我们执行操作的方法以及包含信息的属性组成。\n\n注释：\n\n##### Date() 对象\n\n- 使用 new 运算符创建日期对象：\n\
    \  `date_object = new Date();`\n- 此方法将数据返回为人类可读的字符串：\n  `date_object.toString()`\n\
    \n注释：\n\n##### Response.Write()\n\n- Response.Write() 是 Response 对象的 Write() 方法。Response\
    \ 对象是 ASP 中管理任何涉及向浏览器传递信息的对象。\n- Write() 方法类似于许多编程语言中使用的 \"print\" 命令：它用于将信息写入发送到浏览器的\
    \ HTML 页面中。例如：\n\n```\nResponse.Write(\"<h1>Hello World</h1>\");\n```\n\n将在网页上创建一个标题，该标题从您的脚本输出，如下所示。\n\
    \n##### 脚本 1-1\n\n**date_simple.asp**\n\n```\n<%@ Language=JavaScript %>\n\n<HTML><HEAD><TITLE>Simple\
    \ Date</TITLE></HEAD>\n<BODY BGCOLOR=\"#FFFFFF\" >\n\n<%\ndate_object = new Date();\n\
    Response.Write(date_object.toString())\n%>\n\n</BODY></HTML>\n```\n\n#### 课程 1.2\n\
    \n##### 动态生成日期并将其发送到浏览器\n\n##### 新的 ASP 特性\n\n- //（注释）\n- Number（JavaScript 数据类型）\n\
    - String（JavaScript 数据类型）\n- Array（JavaScript 数据类型）\n- Concatenation（JavaScript\
    \ \"+\" 运算符）\n\n注释：\n\n##### //（注释）\n\n- 注释使您更容易与他人分享代码。以下是带注释的代码：\n  1. // 出于某种原因，传统上通过打印\
    \ 'hello world' 来向人们展示如何 '打印' 内容。\n  2. // 在 ASP 中，这是通过 Response.Write( ) 命令完成的\n\
    \  3. //（ASP Response 对象的 Write 方法。看起来像这样：\n  4. Response.Write (\"Hello World\"\
    );\n\n注释：\n\n##### Number（JavaScript 数据类型）\n\n数字是可以用字面变量或字面量表示的整数或实数。以下是几个示例：\n\
    \n```\n9                          // 数字 9\n3.45                       // 数字 3.45\n\
    3 + 2                      // 数字 5\nnumber = 12                // 变量 \"number\"\
    \ 已设置为 12\nnumber + 2                 // 数字 15\n```\n\n注释：\n\n##### String（JavaScript\
    \ 数据类型）\n\n- 字符串是由字母、数字、空格和各种其他字符组成的序列，与数字一样，可以按字面表示或存储在变量中。例如：\n\n```\n\"Hello\
    \ World\"              // 典型的字符串\n\"Tel: 805-966-0611\"        // 另一个字面字符串\nName\
    \ = \"Wilbur\"            // 一个名为 name 的变量，值为\n                           // \"\
    Wilbur\"\n```\n\n注释：\n\n##### Array（JavaScript 数据类型）\n\n- 数组是有序的值序列：\n  - `(1,2,3)`\
    \ // 数字一、二和三\n  - `(\"Wilbur\",\"Fred\",\"Gordon\")` // 三个名字\n  - `name_array\
    \ = (\"Wilbur\",\"Fred\",\"Gordon\")` // 一个名为 name_array 的变量，存储三个名字\n\n- 由于数组是有序的，因此可以通过引用其索引值来调用数组中的特定值：\n\
    \  - `name_array[0]` // 返回 \"Wilbur\"\n  - `name_array[2]` // 返回 \"Gordon\"\n\
    \  - `name_array[3] = \"Becky\"` // name_array 现在为 //(\"Wilbur\",\"Fred\",\"Gordon\"\
    ,\"Becky\")\n\n注释：\n\n##### Concatenation（JavaScript \"+\" 运算符）\n\n- 连接使通过 \"\
    连接\" 两个字符串来创建单个字符串成为可能：\n  `full_name = \"jane\" + \" \" + \"doe\"  // full_name\
    \ 被 //设置为 \"jane doe\"`\n\n- 请注意，在连接字符串 \"jane\" 和 \"doe\" 时，需要在它们之间放置一个空格 (\"\
    \ \")，以防止 full_name 的值被设置为 \"janedoe\"。\n\n```\nfull_name = \"jane\" + \" \" +\
    \ \"doe\"\n// full_name 被 //设置为 \"jane doe\"\n```\n\n注释：\n\n##### 脚本 1-2\n\n**date_fancy.asp**\n\
    \n```\n<%@ Language=JavaScript %>\n\n<HTML><HEAD><TITLE>Fancy Date</TITLE></HEAD>\n\
    <BODY BGCOLOR=\"#FFFFFF\" >\n\n<%\nvar now, days, months, day_of_week_int,\nday_of_month_int,\
    \ month_int, year, today_date;\nnow = new Date();\n\ndays = new Array (\"Sunday\"\
    ,\"Monday\",\"Tuesday\",\n\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\");\n\
    months = new Array (\"January\",\"February\",\"March\",\n\"April\",\"May\",\"\
    June\",\"July\",\"August\",\"September\",\n\"October\",\"November\",\"December\"\
    );\nday_of_week_int  = now.getDay();\nday_of_month_int = now.getDate();\nmonth_int\
    \ = now.getMonth();\nyear = now.getFullYear();\n\ntoday_date = days[day_of_week_int]\
    \ + \", \" +\nmonths[month_int] + \" \" + day_of_month_int + \", \" +\nyear;\n\
    \nResponse.Write (today_date);\n%>\n\n</BODY></HTML>\n```\n"
