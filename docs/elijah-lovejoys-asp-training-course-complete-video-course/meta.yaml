    # Using Include Files for Shared Code


    • If you find yourself using the same code over and over in different scripts,
    you may want to consider using include files to share the same set of code among
    many files. For example, let''s say you have a file with an include:


    ```

    <%@ Language=JavaScript %>

    <html><head></head><body>

    <!-- #include file="include.js" -->

    <p>example asp page

    </body></html>

    ```


    and the include file consisted of a small amount of ASP code:


    ```

    <%

    Response.Write("Yet another")

    %>

    ```


    This would be the same as having a single file:


    ```

    <%@ Language=JavaScript %>

    <html><head></head><body>

    <

    Response.Write("Yet another")

    %>

    <p>example asp page

    </body></html>

    ```'
  - '[PAGE 78]


    # Creating a JavaScript Object to Store Information


    Here''s how to store information in an object. For example, let''s say that you
    need to keep track of information about Bill in a script. You could write this:


    ```

    bill = new Object();

    bill.name = "bill smith";

    bill.age = "8";

    bill.favorite_colour = "purple!";

    bill.birthday = "10/18/99";

    ```


    Then it would be easy to use this information later. For example:


    ```

    Response.Write("Happy Birthday, " + bill.name + ". I can''t be-

    lieve you''re already" + bill.age );

    ```


    which would send the string "Happy Birthday bill smith. I can''t believe you''re
    already 8" to the browser.


    If all you''re doing is keeping track of information about Bill, this might not
    make so much sense. But if you needed to keep track of the same information for
    Miranda and Wilbur and Veronica as well, all of a sudden, using an object might
    help make keeping track of everything a lot easier.


    Knowing, for example, that we had objects named after each with the appropriate
    age stored in each object, we could then access their ages using a consistent
    syntax, like this:


    ```

    bill.name

    miranda.name

    wilbur.name

    veronica.name

    ```'
