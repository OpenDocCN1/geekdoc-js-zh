    \ %>\n23.    </td><td valign=top>\n24.    <% = items[key].description %><p>\n\
    25.    <!------ start item option information --------->\n26.       <% for (key2\
    \ in items[key].options){\n27.       if (String(items[key].options[key2].\n  \
    \     description) != \"none\"){\n28.       %>\n29.       <div align=right><%\
    \ =\n       items[key].options[key2].description %>: $<% =\n       items[key].options[key2].price\
