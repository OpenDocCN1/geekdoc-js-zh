    ## 小结\n\n以下是本讲涵盖的主题列表：\n\n- 学习一些巧妙的技术来收集表单提交的数据，即使您不知道数据是什么。\n- 将这些数据存储在数据库中。\n\
    - 创建基于模板的界面。\n- 使用密码来限制谁可以使用脚本。\n- 组织一组脚本，使其相对高效地协同工作。\n\n## 第五讲\n\n### 购物车\n\n\
    **学习目标**\n\n- 构建一个购物车\n\n## 课程 5.1\n\n### 构建购物车\n\n## 安全性\n\n- 浏览器与服务器之间的通信可以使用\
    \ SSL 加密。\n\n- 本讲中的脚本将支付信息（信用卡、预付互联网卡等……）以未加密形式存储在服务器上。如果您确实要在服务器上存储未加密的信息，请确保其安全性尽可能高，并尽快将该信息从服务器上移走。\n\
    \n- 如果您使用被盗的信用卡向某人发货，您将对该产品负责。因此，请确保您的信用卡验证流程包含防欺诈措施。\n\n- 采取简单的预防措施：\n\n- 对存储重要信息的计算机进行密码保护\n\
    \n- 不要共享密码。\n\n- 将计算机放在上锁的房间内。\n\n- 运用常识！\n\n备注：\n\n## 快速概览\n\n- 该购物车允许买家按类别浏览或通过关键词搜索商品：\n\
    \n![](img/bb6d9d5758805a03d9304333e9a2e084_151_0.png)\n\n## 第五讲 购物车\n\n- 一个链接让购物者可以在准备就绪时结账：\n\
    \n![](img/bb6d9d5758805a03d9304333e9a2e084_152_0.png)\n\n购买的第一步要求买家提交配送信息：\n\n\
    | 货号 | 名称 | 描述 | 数量 | 价格 | 小计 |\n| --- | --- | --- | --- | --- | --- |\n| BK1\
    \ | 衬衫 1 | 1 型衬衫（重量系数 2） | 1 | $12.95 | $12.95 |\n| CK1CHOK | 手帕 | 真正的男士配饰（丝绸）（重量系数\
    \ 1） | 1 | $2.25 | $2.25 |\n| | | | | 小计 | $15.20 |\n| | | | | 运费 | $17.55 |\n\
    \n升级配送：\n2 天 ○（额外费用 $15.00）\n次日达 ○（额外费用 $21.00）\n\n联系信息：\n\n名字：john\n\n姓氏：doe\n\
    \n电子邮箱：john_doe@lovejoy.com\n\n电话号码：805-966-0611\n\n配送信息（仅限美国！）：\n\n地址 1：18 Main\
    \ St\n\n地址 2：\n\n城市：santa barbara\n\n州：CA ▾\n\n邮政编码：93101\n\n## 第五讲 购物车\n\n- 下一步是提供账单信息：\n\
    \n| SKU | 产品 | 描述 | 数量 | 价格 | 总计 |\n|-----|---------|-------------|-----|-------|-------|\n\
    | BK1 | 衬衫 1 | 1 型衬衫（重量系数：2） | 1 | $12.95 | $12.95 |\n| CK1CHOK | 手帕 | 真正的男士配饰（丝绸）（重量系数：1）\
    \ | 1 | $2.25 | $2.25 |\n| | | | 小计 | $15.20 | |\n| | | | 运费 | $17.55 | |\n| |\
    \ | | 税费 | $1.33 | |\n| | | | 总计 | $22.38 | |\n\n该订单将配送至：\n\njohn doe\n8 Main\
    \ St.\nsanta barbara, CA 93101\n\n使用预付网页卡支付：\n\n卡号：4111 1111 1111 1111\nPIN 码：5678\n\
    [提交]\n\n使用信用卡支付：\n\n支付方式：[Visa ▼]\n卡号：411_tor_color_#0000FF\">4111 1111 1111 1111\n\
    到期日期：02/03\n\n如果账单地址与配送地址不同，您必须填写下方的账单地址：\n\n名字：[____________________]\n姓氏：[_____________________]\n\
    地址 1：[_____________________]\n地址 2：[_____________________]\n城市：[_________________________]\n\
    州：[▼]\n邮政编码：[______________________]\n\n[提交]\n\n- 购物车最终会生成一个订单确认屏幕：\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_155_0.png)\n\
    \n## 第五讲 购物车\n\n- 同时，订单会被写入 Web 服务器硬盘上的一个文件夹中，便于收集：\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_156_0.png)\n\
    \n## 新增的 ASP 特性\n\n- 在 Session 对象中存储信息\n- 创建模板\n- 在两个文本文件中存储相关数据\n\n备注：\n\n##\
    \ 在 Session 对象中存储信息\n\n- 本讲中的脚本在 Session 对象中存储两组信息：\n  - 用户放入购物车中的商品\n  - 用户提供的关于他们自己的信息\n\
    \n备注：\n\n## **cart_items**\n\n- cart_items 存储：\n  - 商品货号\n  - 数量\n  - 名称\n  -\
    \ 描述\n  - 价格\n  - 等等\n\n**备注：**\n\n## **order_info**\n\n- order_info 存储：\n  -\
    \ 配送信息\n  - 账单信息\n  - 收集到的关于用户的其他信息\n\n**备注：**\n\n## 创建会话字符串和对象\n\n- 字符串：\n  `Session(\"\
    color\") = blue`\n- 对象：\n  `Session(\"order_info\") = new Object();`\n- 该对象的属性：\n\
    \  `Session(\"order_info.first_name\") = Bill`\n\n备注：\n\n## 在两个文本文件中存储相关数据\n\n\
    - 两个文本文件用于存储关于商品的信息：\n  - catalog_file.txt 包含所有在售商品\n  - option_file.txt 包含每件商品的选项\n\
    \n| catalog_file.txt | | option_file.txt | | | |\n| 货号 | 描述 | 货号 | 扩展 | 选项描述 |\
    \ 价格 |\n| b_shrt | 一件漂亮的蓝色衬衫 | b_shrt | -Sm | 小号 | $12.00 |\n| | | b_shrt | -Md\
    \ | 中号 | $15.00 |\n| | | b_shrt | -Lg | 大号 | $17.00 |\n| w_shrt | 一件优质的白色衬衫 |\
    \ w_shrt | | 均码 | $16.00 |\n\n此表说明了两种情况：蓝色衬衫有三种尺寸可选，白色衬衫只有一种尺寸可选。两款衬衫在 catalog_file.txt\
    \ 中均只有一行信息。然而，在 option_file.txt 中情况则有所不同：蓝色衬衫有三种选项，因此有三行信息；白色衬衫只有一种选项，因此有一行信息。\n\
    \n请注意，货号字段同时出现在两个文件中，这使得目录文件中的记录可以与选项文件中的记录对应起来。一件商品的完整货号由货号字段和扩展字段拼接而成（如果一件商品只有一种选项，则扩展字段可以为空）。因此，w_shrt\
    \ 和 b_shrt-sm 是有效的货号，而 b_shirt 不是有效的货号，因为它没有包含扩展名，而蓝色衬衫有不止一种选项。\n"
