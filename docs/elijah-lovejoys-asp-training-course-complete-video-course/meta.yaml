  - '[PAGE 228]


    # DataSet vs. Recordset Differences


    +   - Applications using Recordsets frequently interact with a database; a DataSet
    is not connected to a database.

    - DataSets are able to produce and consume XML.

    - DataSets interact with all the other new ADO.NET objects.


