  md: '# Summary


    Critical issues covered include:


    +   - Using ASP to get data via ODBC: publishing database information is a matter
    of creating a connection to the database using a database connection object, and
    then creating a Recordset object to collect and publish one or more records stored
    in the database.


    +   - Displaying the resultant data in templates: Data have to be presented to
    users in an accessible manner. Thus different templates were used for people,
    Web sites, and events.


    +   - Passing instructions between scripts using form variables. As in Lesson
    2, form variables were used to pass instructions to a script. In this case, the
    form information determined what kind of query was performed against the database.


    +   - Using an SQL database: While the database used for this lesson had only
    a few records in it, it only takes a few dozen records to make a database truly
    useful. Over the years, I''ve seen many examples of companies investing enormous
    amounts of resources managing and publishing information that could have much
    more easily been managed in a database. Simply maintaining and distributing a
    phone list for a company with 30–60 employees can be a significant task that can
    be much more effectively performed if the phone list is published on an intranet.'
