    # <% ... %> (The ASP Tag)


    +   - Any code enclosed in ASP tags will be executed on the server. Furthermore,
    this code will be removed from the page after it is executed.


    +   - For example, the "=" is equivalent to "print" in many languages and is used
    here to put the words "Hello World" into a page of HTML:


    ```

    1. <HTML><HEAD><TITLE>Simple Date</TITLE></HEAD>

    2. <BODY BGCOLOR="#FFFFFF" >

    3.

    4. <h1><% = "Hello World" %></h1>

    5.

    6. </BODY></HTML>

    ```


    +   - This will generate and send the following HTML page to the browser:


    ```

    1. <HTML><HEAD><TITLE>Simple Date</TITLE></HEAD>

    2. <BODY BGCOLOR="#FFFFFF" >

    3.

    4. <h1>Hello World</h1>

    5.

    6. </BODY></HTML>

    ```


    +   - Note how line 4 has changed from the source to the code that is actually
    sent to the browser.'
