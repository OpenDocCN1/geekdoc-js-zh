- md: " # LECTURE 5  SHOPPING CART\n\n## Script 5-13\n\n### view_session_contents.asp\n\
    \n```\n1. <%@ Language=JavaScript %>\n2. <!-- #include file=\"cart.js\" -->\n\n\
    3. <%\n4. session_contents()\n5. %>\n```\n\n## Notes:\n\n## Summary\n\nHere are\
    \ the lessons from this lecture:\n\n- JavaScript objects don't behave quite as\
    \ you might think when you throw them into the Session object. But you can put\
    \ them there, and it sure beats having to have a bunch of unorganized strings\
    \ lying about. If you can get through cart.js, you'll understand how objects in\
    \ the Session work without having to resort to trial and error.\n\n- You can store\
    \ small amounts of information in text files rather than using a database. I'm\
    \ not sure that this is all that much simpler in the end, but it is more low tech,\
    \ so it has the advantage of not having to monkey with some database application.\
    \ And sometimes, you just need something quick and dirty.\n\n- A great deal of\
    \ the code in this chapter was squirreled away in an include file so that the\
    \ pages that include design elements could be as clean as possible. Using an approach\
    \ like this makes it possible to hand off design to someone else without forcing\
    \ them to work around a whole lot of code. For example, most of the code in cart_list_items_for_sale.asp,\
    \ while obviously not HTML, look like funky HTML tags, and I've been able to hand\
    \ this code off to a designer and emerge with a working application with very\
    \ little debugging—yes, the designer broke the code. Of course! but only a little.\n\
    \n# Lecture 6\n\n# Email\n\n## Objectives\n\n- Build a Simple Email Script\n\n\
    # LESSON 6.1\n\n## Build a Simple Email Script\n\n### Simple Email Script\n\n\
    - The script we'll build in this lecture implements one of the most common Web\
    \ applications out there—it redirects the output of a form to an email. The form\
    \ is fairly standard, as shown here.\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_198_0.png)\n\
    \nThe form's output is then put into an email. In this case, the information is\
    \ sent to the email address form-recipient@lovejoy.com:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_199_0.png)\n\
    \n## New ASP Features\n\n- SMTP, POP, IMAP, Etc.\n- CDONTS\n\n**Notes:**\n\n#\
    \ SMTP, POP, IMAP, Etc.\n\n- Email addresses come in the form: `Elijah@Lovejoy.com`\n\
    \n  That's two parts:\n  - Internet domain name = `Lovejoy.com`\n  - Unique name\
    \ mapped to mail account = `Elijah`\n\n- Mailboxes are maintained by mail servers\
    \ for local users. POP3 are the most common; IMAP are fancier.\n\n  Two things\
    \ about mailboxes:\n  - People tend to forget their passwords since most email\
    \ software remember for them.\n  - Mailboxes are usually stored on servers with\
    \ a different domain name than the email address.\n\n- Mail servers are applications\
    \ in charge of getting email where it needs to go. Most mail servers (or \"message\
    \ transfer agents\") support SMTP, which is the Internet standard for mail.\n\n\
    **Notes:**\n\n# CDONTS: Email and Why Microsoft Should Hire More Poets\n\n- CDONTS\
    \ stands for Collaboration Data Objects for Windows NT Server. You can use CDONTS\
    \ to create an object called a \"NewMail object.\" For example:\n\n  1. mail_ob\
    \ = Server.CreateObject(\"CDONTS.NewMail\");\n  2. mail_ob.Send(\"sender@lovejoy.com\"\
    ,\"recipient@lovejoy.com\",\"subject\",\"body\");\n\n- The only required argument\
    \ to the Send() method is a From address, which means that it's possible to set\
    \ the To address, subject, and body of the message using properties of the NewMail\
    \ object before using the Send() method. For example:\n\n  1. mail_ob = Server.CreateObject(\"\
    CDONTS.NewMail\");\n  2. mail_ob.Subject = \"Tomorrow's Meeting\";\n  3. mail_ob.Body\
    \ = \"Jane, I won't be able to make the meeting. Can we reschedule?\";\n  4. mail_ob.To\
    \ = \"Jane@lovejoy.com\";\n  5. mail_ob.Send(\"Elijah@lovejoy.com\");\n\n- Functionally,\
    \ there's no difference between this snippet with five lines of code and the previous\
    \ block with two lines of code. Breaking it up like this makes it easier to read,\
    \ which is nice, but it's simply a matter of taste.\n\n# Script 6-1\n\n## form.asp\n\
    \n```html\n<HTML><HEAD><TITLE></TITLE></HEAD><BODY>\n\n<center><h1>Email Us</h1>\n\
    \n<p>Use form below to send an email to our sales team:\n<hr>\n<form action=\"\
    catch_form.asp\">\n<table align=center border=1>\n <tr>\n   <td align=right>Your\
    \ Name:</td>\n   <td><input type=text name=name value=\"\" size=60></td>\n </tr>\n\
    \ <tr>\n   <td align=right>Your Email Address:</td>\n   <td><input type=text name=email\
    \ value=\"\" size=60></td>\n </tr>\n <tr>\n   <td align=right>Subject</td>\n \
    \  <td><input type=text name=subject value=\"\" size=60></td>\n </tr>\n <tr>\n\
    \   <td align=right valign=top>Message:</td>\n   <td><textarea name=message cols=60\
    \ rows=10></textarea><br>(include your phone number if you'd like us to call you.)</td>\n\
    \ </tr>\n</table>\n<input type=submit name=toss value=\"Send Message\">\n<form>\n\
    <hr>\n</center>\n</BODY></HTML>\n```\n\n# LECTURE 6 EMAIL\n\n## Script 6-2\n\n\
    ### catch_form.asp\n\n```\n1. <%@ Language=JavaScript %>\n2. <%\n3. mail_ob =\
    \ Server.CreateObject(\"CDONTS.NewMail\");\n4.\n5. mail_ob.Body = String(\"Message\
    \ From: \" +\n   String(Request(\"email\")) + \" < \" +\n   String(Request(\"\
    name\")) + \" >\"+ \"\\n\\n\" +\n   Request(\"message\"));\n6.\n7. mail_ob.Subject\
    \ = String(Request(\"subject\"));\n8.\n9. mail_ob.To = \"form-recipient@lovejoy.com\"\
    ;\n10.\n11. mail_ob.Importance = 1; // 0=low; 1=normal; 2=high\n12.\n13. mail_ob.Send(\"\
    form@lovejoy.com\");\n14.\n15. %>\n16. <HTML><HEAD><TITLE></TITLE></HEAD><BODY>\n\
    17.\n18. <center>Email Sent Successfully!</center>\n19. </BODY></HTML>\n```\n\n\
    ## Notes:\n\n## Summary\n\n- Because CDONTS will do most of the work for us, once\
    \ CDONTS is installed, there's really not a whole lot to it.\n\n- In fact, Sending\
    \ email is so easy, might as well recap with the code:\n\n  1. mail_ob = Server.CreateObject(\"\
    CDONTS.NewMail\");\n  2. mail_ob.Send(\"sender@lovejoy.com\",\"recipient@lovejoy.com\"\
    ,\"subject\",\"body\");\n\n```\nmail_ob = Server.CreateObject(\"CDONTS.NewMail\"\
    );\n```\n\n```\nmail_ob.Send(\"sender@lovejoy.com\",\"recipient@lovejoy.com\"\
    ,\"subject\",\"body\");\n```\n\n- Of course, sending the same message over and\
    \ over again probably won't do you a great deal of good, so you'll probably want\
    \ to create a form that collects the information you want to send, and then create\
    \ a script that's smart enough to email you the information collected by the form.\n\
    \n- CDONTS is included with Windows 2000, and can be obtained for NT by getting\
    \ NT Option Pack 4.\n\n# Lecture 7\n\n# Exploring ASP.NET\n\n## Objectives\n\n\
    - Build a Simple Calendar with ASP.NET Calendar Control\n- Generate Web Pages\
    \ from a Database with ASP.NET DataGrid Control\n\n# LESSON 7.1\n\n## Build a\
    \ Simple Calendar with ASP.NET Calendar Control\n\n### A Really Simple ASP.NET\
    \ Script\n\n- Here's a calendar you can put on your page with just a couple of\
    \ lines of code that visitors to your site can use to select a date:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_208_0.png)\n\
    \n## New ASP Features:\n\n- The .aspx File Extension\n- New @ Language Directive\n\
    - The Feast.tonnr>.Shea.her s.shr.w.c.a.mpli,\n- The ASP.NET Calendar Control\n\
    - Getting ASP.NET to Take Care of Your Forms for You\n- onselectionchanged: An\
    \ ASP.NET Event\n- Using Functions with ASP.NET\n\n## Notes:\n\n# The .aspx File\
    \ Extension\n\n- ASP pages use the .asp extension.\n- ASP.NET pages use the new\
    \ .aspx extension.\n- You can have both .asp and .aspx pages at your site.\n\n\
    ## Notes:\n\n# ASP.NET Syntax\n\n- ASP Syntax:\n  `<%@ Language=JavaScript %>`\n\
