  md: "# Generating a Random Integer  \nwith the JavaScript Math Object\n\n+   - JavaScript\
    \ includes a built-in Math object that makes it easy to take advantage of a number\
    \ of mathematical functions that are built into the JavaScript language. For example,\
    \ the Math.random() function returns a random number between 0.0 and 1.0:\n\n\
    \  `random_number = Math.random();`\n\n  This might output one of these values:\n\
    \n  `0.18359177861083936 rounding due to, 0.16630404388409887, 0.7250774196619358,`\n\
    \  `0.450792710578013564, 0.19805329447345815, 0.6124185344364772,`\n  `0.23355290088725944,\
    \ etc. ...`\n\n+   - Because integers are often more useful than floating point\
    \ values, the floating point output of Math.random() can be rounded to the nearest\
    \ integer:\n\n  `random_number = Math.round(Math.random());`\n\n+   - The random\
    \ number generated this way will always be either one or zero. To obtain numbers\
    \ drawn from a larger pool, all you need to do is multiply the output of Math.random()\
    \ by an integer greater than one. For example, this code will generate a number\
    \ between zero and five:\n\n  `random_number = Math.round(5 * Math.random());`"
