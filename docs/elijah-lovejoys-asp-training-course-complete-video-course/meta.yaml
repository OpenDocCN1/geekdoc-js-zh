  - '[PAGE 47]


    # Using the Request Object to Collect Incoming Form Information


    • The ASP Request object makes collecting form information a breeze. For example,
    if a script needs to collect the value of the form element to_do and put this
    into a variable called “form_instruction”, you could do this:


    ```

    var form_instruction = String(Request("to_do"));

    ```


    +   • Note that three things are happening in this line:

    1. The to_do property of the Request object is being passed as an argument to
    a JavaScript function called String().

    2. The String() function is converting this value into a string.

    3. The resulting string is being assigned to the variable form_instruction.


    • Because all form information is stored in the Request object, finding the value
    of a form element is simply a matter of obtaining that property of the Request
    object.


    # Notes:


    ![](img/bb6d9d5758805a03d9304333e9a2e084_47_0.png)'
