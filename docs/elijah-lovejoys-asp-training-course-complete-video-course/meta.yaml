  md: '# Microsoft Access


    Three reasons Microsoft Access is used in this course:


    +   1. Many people already own a copy of MS Access.

    2. The ODBC drivers for MS Access are bundled with the various Windows Operating
    Systems.

    3. MS Access databases are files that are easy to ftp or put on a floppy disk
    or CD-ROM.


    # Notes:'
