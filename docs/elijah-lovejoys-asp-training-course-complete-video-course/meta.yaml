  md: "# The @ Import Directive\n\n+   - Active Server Pages: Easy to use Windows\
    \ Scripting Objects and other ActiveX/COM objects from within a simple script.\n\
    - ASP.NET: You need to import one or more ADO.NET namespaces. Then you can use\
    \ the objects that are in that namespace inside of your script.\n- For example,\
    \ these are used to pull information out of an Access database:\n  `System.Data`\n\
    \  and\n  `System.Data.OleDb`\n- By importing\n  `System.Data.OleDb`\n  you can\
    \ use all objects in that namespace. That way, you can connect to any database\
    \ that has the requisite OLEDB plumbing.\n\n**Notes:**"
