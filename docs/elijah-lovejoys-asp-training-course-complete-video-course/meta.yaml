    # Summary


    Here are the lessons from this lecture:


    +   - JavaScript objects don''t behave quite as you might think when you throw
    them into the Session object. But you can put them there, and it sure beats having
    to have a bunch of unorganized strings lying about. If you can get through cart.js,
    you''ll understand how objects in the Session work without having to resort to
    trial and error.


    +   - You can store small amounts of information in text files rather than using
    a database. I''m not sure that this is all that much simpler in the end, but it
    is more low tech, so it has the advantage of not having to monkey with some database
    application. And sometimes, you just need something quick and dirty.


    +   - A great deal of the code in this chapter was squirreled away in an include
    file so that the pages that include design elements could be as clean as possible.
    Using an approach like this makes it possible to hand off design to someone else
    without forcing them to work around a whole lot of code. For example, most of
    the code in cart_list_items_for_sale.asp, while obviously not HTML, look like
    funky HTML tags, and I''ve been able to hand this code off to a designer and emerge
    with a working application with very little debugging—yes, the designer broke
    the code. Of course! but only a little.'
