    \    var form_instruction = String(Request(\"to_do\"));\nIf \"to_do\" was not\
    \ set in the form or link that points to the script, this will return undefined.\
    \ As a result, if a script is using a form variable that may not have been set,\
    \ it is sometimes necessary to check for the value undefined.\n\n# Notes:"
