  - "[PAGE 33]\n\n# while() (JavaScript Statement)\n\n+   - The while() command is\
    \ used to generate a loop that is repeated so long as a condition is true. The\
    \ while() command is, thus, ideal when you need your script to pull information\
    \ from a text file. This is done using the following logic:\n\n```\nwhile ( not\
    \ end-of-file ){ // this isn't real code!!\n\tdo something with a line from the\
    \ file...\n}\n```\n\n# Notes:"
  - "[PAGE 34]\n\n# Using FileSystemObject and the TextStream Object to Read Data\
    \ from a File\n\nThis code illustrates how a FileSystemObject can be created,\
    \ then used to create a TextStream object, which can, in turn, be used to print\
    \ the contents of a text file to a Web page:\n\n```\nfso = new ActiveXObject(\"\
    Scripting.FileSystemObject\");\nfile_stream = fso.OpenTextFile(\"c:\\docs\\file.txt\"\
    );\nwhile (! file_stream.AtEndOfStream){\n    Response.Write(file_stream.ReadLine());\n\
    }\nfile_stream.close();\n```\n\n# Notes:"
  - "[PAGE 35]\n\n# JavaScript if ... else Statements\n\nAn if statement will be executed\
    \ if a condition is true. For example:\n\n```\nif (1 > 0){\n    // code here should\
    \ always be executed\n    // since 1 is always greater than zero.\n}\n```\n\n\
    Alternatively, a script might perform one task if a condition is true and another\
    \ task if it isn't.\n\n```\nif (number > 0){\n    Response.Write(\"number is greater\
    \ than zero\");\n}\nelse {\n    Response.Write(\"number is less than or equal\
    \ to zero\");\n}\n```\n\nTwo points to remember:\n\n+   - An if statement defines\
    \ a block of code that will be executed only if a condition is true.\n- Parentheses\
    \ \"()\" go around the condition, and curly brackets \"{}\" go around the statement."
  - "[PAGE 36]\n\n# Generating a Random Integer  \nwith the JavaScript Math Object\n\
    \n+   - JavaScript includes a built-in Math object that makes it easy to take\
    \ advantage of a number of mathematical functions that are built into the JavaScript\
    \ language. For example, the Math.random() function returns a random number between\
    \ 0.0 and 1.0:\n\n  `random_number = Math.random();`\n\n  This might output one\
    \ of these values:\n\n  `0.18359177861083936 rounding due to, 0.16630404388409887,\
    \ 0.7250774196619358,`\n  `0.450792710578013564, 0.19805329447345815, 0.6124185344364772,`\n\
    \  `0.23355290088725944, etc. ...`\n\n+   - Because integers are often more useful\
    \ than floating point values, the floating point output of Math.random() can be\
    \ rounded to the nearest integer:\n\n  `random_number = Math.round(Math.random());`\n\
    \n+   - The random number generated this way will always be either one or zero.\
    \ To obtain numbers drawn from a larger pool, all you need to do is multiply the\
    \ output of Math.random() by an integer greater than one. For example, this code\
    \ will generate a number between zero and five:\n\n  `random_number = Math.round(5\
    \ * Math.random());`"
