  md: '# ASP Session Object


    ASP includes a built-in facility for keeping track of unique visitors (using cookies):
    the Session object. Because the ASP Session object keeps track of unique visitors,
    once a user has been authenticated using a password check, it is very easy to
    use the Session object to verify that a user requesting access to a script does,
    in fact, have permission to use that script.


    # Notes:'
  merge: -1
  pgno: 97
- img_proc: true
  md: "# ## Session Password Mechanism\n\n+   - Using the Session object to exclude\
    \ nonauthenticated users from using certain scripts requires two elements:\n \
    \ - Code that sets a value in the Session object when a user matches a certain\
    \ criterion (in this case, when a user knows a password).\n  - Code that checks\
    \ to make sure that the desired value is stored in the Session object before granting\
    \ a user access to a sensitive script or HTML page.\n\n**Notes:**"
  merge: -1
  pgno: 98
- img_proc: true
  md: "# **Collecting a Password and Setting a Session Variable**\n\n+   - Here is\
    \ a very simple form that contains a text box and a Submit button, allowing the\
    \ user to type in a password:\n\n```\n<form action=\"<%= \nString(Request.ServerVariables(\"\
    SCRIPT_NAME\")) %>\">\n<p>Password Please:\n<input type=password name=password\
    \ >\n<input type=submit name=\"toss\" value=\"Submit\">\n</form>\n```\n\n+   -\
    \ This code looks at the incoming password (a form field called password) and\
    \ compares it to a string that is hard coded into the script, in this case \"\
    password\":\n\n```\nif (String(Request(\"password\")) == \"password\"){\n\tSession(\"\
    edit_db_pass\") =\n\tString(Request(\"password\"));\n\tResponse.Redirect(\"yet_another_page.asp\"\
    );\n}\n```\n\n**Notes:**"
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Checking for Valid Session Variable


    +   - Once a Session variable has been set, the next step is to check for it any
    time a script is generating a page to which you want to control access. In the
    case of the code we just examined, this is done by checking to make sure that
    the value of the Session variable edit_db_pass is set to the correct value:


    ```

    if (Session("edit_db_pass") != "password"){

    Response.Redirect("password_form.asp");

    }

    //... balance of the script

    ```


