    # Publishing Data from a DataSet Object with a DataGrid Object


    +   - Putting a DataGrid onto a page is pretty easy:


    ```

    <asp:DataGrid id="MyDataGrid" runat="server" />

    ```


    +   - This is the code that makes the data in a DataSet accessible to a DataGrid:


    ```

    MyDataGrid.DataSource=ds.Tables("event_data").DefaultView

    MyDataGrid.DataBind()

    ```


