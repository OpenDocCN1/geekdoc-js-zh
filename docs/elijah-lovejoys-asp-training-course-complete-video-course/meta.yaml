    \n# LECTURE 4  EDITING RECORDS\n\n- This form lets users edit the category names\
    \ and descriptions:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_92_0.png)\n\n\
    # The Edit link lets a user edit a record:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_93_0.png)\n\
