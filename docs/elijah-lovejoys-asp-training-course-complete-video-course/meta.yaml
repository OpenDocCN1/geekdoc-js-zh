  - "[PAGE 162]\n\n# Storing Related Data in Two Text Files\n\n+   - Two text files\
    \ for storing information about items:\n  - catalog_file.txt contains every item\
    \ for sale\n  - option_file.txt contains each item's options\n\n| catalog_file.txt\
    \ | | option_file.txt | | | |\n| Part Number | Description | Part Number | Extension\
    \ | Option Desc. | Price |\n| b_shrt | A nice blue shirt | b_shrt | -Sm | Small\
    \ | $12.00 |\n| | | b_shrt | -Md | Medium | $15.00 |\n| | | b_shrt | -Lg | Large\
    \ | $17.00 |\n| w_shrt | A good white shirt | w_shrt | | One size fits all | $16.00\
    \ |\n\nThis table illustrates two cases: a blue shirt, which is available in three\
    \ sizes, and a white shirt, which is available in only one size. Both shirts have\
    \ a single line of information in catalog_file.txt. In option_file.txt, however,\
    \ it's a different story: Here, there are three lines for the blue shirt, which\
    \ has three options, and one line for the white shirt, which has one option.\n\
    \nNote that the part number field appears in both files, which makes it possible\
    \ to map records in the catalog file to records in the option file. The full part\
    \ number of an item consists of a concatenation of the part number and the extension\
    \ fields (extensions can be blank if an item has only one option). Thus, w_shrt\
    \ and b_shrt-sm are valid part numbers, whereas b_shirt is not a valid part number,\
    \ because it does not include an extension, and there is more than one option\
    \ for the blue shirt."
- md: " # How the Pieces Fit Together\n\n# LECTURE 5  SHOPPING CART\n\n## Script 5-1\n\
    \n```\n1. <%@ Language=JavaScript %>\n2. <!-- #include file=\"cart.js\" -->\n\
    3.\n4.\n5. <%\n6. cart_header();\n7. items = create_items_object ();\n8. %>\n\
