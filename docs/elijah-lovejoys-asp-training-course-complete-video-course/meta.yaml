- img_proc: true
  md: '# ## Summary


    +   - One of the great virtues of ASP.NET is that it will never matter how much
    of the .NET environment a developer wants to leverage: The point will always be
    to find something that helps to solve a problem that is at hand in an expeditious
    way. Developers should be able to look for controls and objects that meet their
    needs and leverage those to focus on the details of a solution rather than building
    something from scratch.


    +   - As this quick look at the Calendar and DataGrid controls and ADO.NET has
    hopefully demonstrated, small parts of ASP.NET should be able to play big roles
    in helping to quickly and effectively create effective web solutions.'
