    13. <body>\n14. <%\n15.     HelloWorld();\n16. %>\n17. </body>\n18. </html>\n\
    ```\n\n### Notes:\n\n## Script 7-5\n\ncalendar.aspx\n\n```\n<%@ Page Language=\"\
    JScript\"%>\n<html>\n<body>\n\n<script runat=\"server\">\nvar selected_date =\
    \ \"\";\n\nfunction Date_Selected(sender: Object, e: EventArgs) {\n    selected_date\
    \ = \"Selected date is: \" +\n        Calendar1.SelectedDate.ToShortDateString()\n\
    \    // Having collected a date, you'd then do something with\n    it...\n}\n\
    </script>\n\n<form runat=server>\n<asp:Calendar id=Calendar1 onselectionchanged=\"\
    Date_Selected\" runat=\"server\"/>\n</form>\n\n<% = selected_date %>\n\n</body>\n\
    </html>\n```\n\n## LESSON 7.2\n\n# Generate Web Pages from a Database Using ASP.NET\
    \ DataGrid Control\n\n### A Not-So-Simple ASP.NET Script\n\n- The first script\
    \ in this lesson will display a list of the categories of information stored in\
    \ the database, and will provide links to the second script, which will provide\
    \ a list of the records in each catgory:\n\n## First Script:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_220_0.png)\n\
    \n## Second Script:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_220_1.png)\n\n\
    ### New ASP Features:\n\n- Importing a Namespace with the @ Import Directive\n\
    - Declare Variables\n- ADO.NET\n- The OleDbConnection Object\n- Creating a Command\
    \ Object\n- Retrieving Data with a DataSet Object\n- Using a DataAdapter Object\
    \ to Put Data into a DataSet\n- Publishing Data from a DataSet Object with a DataGrid\
    \ Object\n- Prettying Up a DataGrid\n\n### Notes:\n\n### The @ Import Directive\n\
    \n- Active Server Pages: Easy to use Windows Scripting Objects and other ActiveX/COM\
    \ objects from within a simple script.\n- ASP.NET: You need to import one or more\
    \ ADO.NET namespaces. Then you can use the objects that are in that namespace\
    \ inside of your script.\n- For example, these are used to pull information out\
    \ of an Access database:\n  `System.Data`\n  and\n  `System.Data.OleDb`\n- By\
    \ importing\n  `System.Data.OleDb`\n  you can use all objects in that namespace.\
    \ That way, you can connect to any database that has the requisite OLEDB plumbing.\n\
    \n**Notes:**\n\n### Declare Variables\n\n- To declare a string you should always\
    \ use the var keyword and optionally use a \": <type>\" declaration.\n\n  var\
    \ sql : String = \"select * from categories\";\n  or\n  var sql = \"select * from\
    \ categories\";\n\n- You can no longer use a variable without declaring it. The\
    \ following line, which would previously have worked with ASP:\n\n  sql = \"select\
    \ * from categories\";\n  Will generate this error message:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_223_0.png)\n\
    \n### ADO.NET\n\n- As it seems, ASP.NET includes two \"providers\":\n  - One for\
    \ MS SQL Server\n  - One for OleDb (everything else)\n\n### Notes:\n\n## Script\
    \ 7-6\n\n### open_and_close_connection.aspx\n\n```\n<%@ Page Language=\"JScript\"\
    %>\n<%@ Import Namespace=\"System.Data\" %>\n<%@ Import Namespace=\"System.Data.OleDb\"\
    \ %>\n<html>\n<body>\n\n<%\nvar conn : OleDbConnection = new\nOleDbConnection(\"\
    Provider=Microsoft.Jet.OLEDB.4.0; Data Source=\" + Server.MapPath(\"ch3db.mdb\"\
    ) + \";\");\n\nconn.Open();\nResponse.Write(\"<br>Opened Connection to \" + conn.ConnectionString()\
    \ )\n\nconn.Close();\nResponse.Write(\"<br>Connection closed criticized.\")\n\
    %>\n</body>\n</html>\n```\n\n- The result is a script that claims to have established\
    \ a database connection:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_225_0.png)\n\
    \n### Creating a Command Object\n\n- Once you've created an ADO Connection object,\
    \ you can create an ADO Command object to give instructions to a database:\n\n\
    ![](img/bb6d9d5758805a03d9304333e9a2e084_226_0.png)\n\n| Database | |\n|:---|:---|\n\
    | 1. Create an ASP.NET Connection object | |\n| 2. Use an ADO.NET Command object\
    \ to execute an SQL statement or a stored procedure | |\n\nASP.NET page\n\n##\
    \ Script 7-7\n\n### insert_record.aspx\n\n```\n<%@ Page Language=\"JScript\"%>\n\
    <%@ Import Namespace=\"System.Data\" %>\n<%@ Import Namespace=\"System.Data.OleDb\"\
    \ %>\n\n<html><body>\n<%\n\nvar connString  = \"Provider=Microsoft.Jet.OLEDB.4.0;\
    \ \";\n    connString += \"Data Source=\" +\nServer.MapPath(\"ch3db.mdb\") + \"\
    ;\";\n\nvar sql = \"INSERT INTO categories (category_name,\ncategory_description)\
    \ Values ('test','this is -- get this\n-- a test record')\";\n\nvar conn = new\
    \ OleDbConnection(connString);\n\nconn.Open();\nResponse.Write(\"<br>Opened Connection\
    \ to \" + conn.ConnectionString() );\n\nvar mySqlCommand = new OleDbCommand(sql,\
    \ conn);\n\nmySqlCommand.ExecuteNonQuery();\nResponse.Write(\"<br>Record inserted...\"\
    \ );\n\nconn.Close();\nResponse.Write(\"<br>Connection closed.\");\n\n%>\n</body></html>\n\
    ```\n\n### DataSet vs. Recordset Differences\n\n- Applications using Recordsets\
    \ frequently interact with a database; a DataSet is not connected to a database.\n\
    - DataSets are able to produce and consume XML.\n- DataSets interact with all\
    \ the other new ADO.NET objects.\n\nNotes:\n\n### Using a DataAdapter Object to\
    \ Put Data into a DataSet\n\n- First you create a Connection object, then a DataAdapter,\
    \ and that gives you a DataSet:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_229_0.png)\n\
    \n## LECTURE 7  EXPLORING ASP.NET\n\n## Script 7-8\n\n### simple_db_example.aspx\n\
    \n```\n1.  <%@ Page Language=\"JScript\"%>\n2.  <%@ Import Namespace=\"System.Data\"\
    \ %>\n3.  <%@ Import Namespace=\"System.Data.OleDb\" %>\n4.\n5.  <%\n6.\n7.  var\
    \ conn : OleDbConnection = new\n    OleDbConnection(\"Provider=Microsoft.Jet.OLEDB.4.0;\
    \ Data\n    Source=\" + Server.MapPath(\"ch3db.mdb\") + \";\");\n8.\n9.  var sql\
    \ : String = \"select * from categories\";\n10.\n11. var myCommand : OleDbDataAdapter\
    \ = new OleDbDataAdapter(sql,\n    conn)\n12.\n13. var ds : DataSet = new DataSet();\n\
    14.\n15. myCommand.Fill(ds, \"event_data\")\n16.\n17. MyDataGrid.DataSource=ds.Tables(\"\
    event_data\").DefaultView\n18. MyDataGrid.DataBind()\n19.\n20. %>\n21.\n22. <html>\n\
    23. <body>\n24.\n25. <asp:DataGrid id=\"MyDataGrid\" runat=\"server\"/>\n26.\n\
    27. </body>\n28. </html>\n```\n\n### Publishing Data from a DataSet Object with\
    \ a DataGrid Object\n\n- Putting a DataGrid onto a page is pretty easy:\n\n```\n\
    <asp:DataGrid id=\"MyDataGrid\" runat=\"server\" />\n```\n\n- This is the code\
    \ that makes the data in a DataSet accessible to a DataGrid:\n\n```\nMyDataGrid.DataSource=ds.Tables(\"\
    event_data\").DefaultView\nMyDataGrid.DataBind()\n```\n\n- Here's the ASP.NET\
    \ DataGrid object in action:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_231_0.png)"
