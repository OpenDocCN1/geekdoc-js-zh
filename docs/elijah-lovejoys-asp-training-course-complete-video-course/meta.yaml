  md: '# The JavaScript substring() Function


    The substring( ) function lets you remove a small piece of a string. For example,
    it can be used to remove the last character from a string:


    ```

    sentence = "Nothing will happen here."

    sentence = sentence.substring(0,(sentence.length-1));

    ```


    which will remove the period from the string sentence, leaving you with the string


    ```

    Nothing will happen here

    ```


