- img_proc: true
  md: '# Code to Edit Records


    Just as the scripts discussed in the previous section allow users to review, edit,
    and create categories, the scripts in this section let Web users look at a list
    of records in a category, create new records, and edit or delete existing records.
    Briefly:


    +   - ch4_list_records.asp: Lists the records for a given category. Provides a
    link to edit a specific record (ch4_edit_record_form.asp) and a button to create
    a new record (ch4_blank_record_form.asp).


    +   - ch4_edit_record_form.asp: A form used to edit a specific record. Edits are
    forwarded to ch4_update_record.asp.


    +   - ch4_update_record.asp: Saves changes made to a record using ch4_edit_record_form.asp.


    +   - ch4_delete_record.asp: Deletes a single record when a user hits the Delete
    Record button on chr_edit_record_form.asp.


    +   - ch4_blank_record_form.asp: Creates a blank form that lets user create a
    new record.


    +   - ch4_insert_record.asp: Saves a record created using ch4_blank_record_form.asp.


    # Notes:'
