- md: " ## Lecture 3\n\n## Database-Driven Pages\n\n## Objectives\n\n- Generate Web\
    \ Pages from a Database\n\n## LESSON 3.1\n\n## Generate Web Pages from a Database\n\
    \n- The scripts in this lecture use a simple database that stores three kinds\
    \ of information:\n  - people\n  - Web sites\n  - events\n- Each type of information\
    \ is stored in a different category, which can be selected from a menu like this:\n\
    \n![](img/bb6d9d5758805a03d9304333e9a2e084_58_0.png)\n\n- Events are organized\
    \ into subcategories, then listed by date:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_59_0.png)\n\
    \n## LECTURE 3  DATABASE-DRIVEN PAGES\n\n55\n\n- The database stores a fairly\
    \ standard set of contact information about people:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_60_0.png)\n\
    \nThe script generates a link so that users can go to Web sites stored in the\
    \ database:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_61_0.png)\n\n## New ASP\
    \ Features\n\n- Relational Databases\n- Structured Query Language (SQL)\n- Microsoft\
    \ Access\n- ADO, ADODB, ODBC, DSN, Etc. ...\n- The Database Connection Object\n\
    - The Recordset Object\n- Creating a JavaScript for() Loop\n- Creating a JavaScript\
    \ Function\n- Using Include Files for Shared Code\n- Creating a JavaScript Object\
    \ to Store Information\n\nNotes:\n\n## Relational Databases\n\n- Two concepts\
    \ to understand:\n  - How is information stored in tables?\n  - How is information\
    \ in one table related to information in another table?\n\nNotes:\n\n## Storing\
    \ Information in Tables\n\nThese tables show how two kinds of information used\
    \ by the scripts in this lecture are organized into tables. The first one stores\
    \ information about categories. The second shows a list of the actual people,\
    \ events, and Web sites that are stored in the database:\n\n## Category\n\n| category_uid\
    \ | category_name | category_description |\n| --- | --- | --- |\n| 1 | People\
    \ | A list of people, their phone numbers, and information about them |\n| 2 |\
    \ Events | A list of scheduled events and important dates |\n| 3 | Web Sites |\
    \ Web sites that relate to our industry or are of general interest |\n\n## Data\n\
    \n| data_uid | data_name | data_category | data_subcategory | data_description\
    \ |\n| --- | --- | --- | --- | --- |\n| 1 | lovejoy.com | 3 | General Interest\
    \ | overrated Web site |\n| 2 | yahoo! | 3 | General Interest | old-school search\
    \ engine |\n| 3 | jane doe | 1 | Employees | VP of something or other |\n| 9 |\
    \ new event | 2 | Company Events | new product release |\n\nA few things to note\
    \ about tables:\n\n- Each row in the table is stored information about one piece\
    \ of information and is called a record.\n- Each record is broken up into a number\
    \ of fields.\n- Each field contains a different type of information.\n\n## Relating\
    \ Information Stored in Different Tables\n\n- A primary key is a field used to\
    \ uniquely identify a record in a table.\n- A foreign key is a field used to relate\
    \ fields in a table to the primary key of a record in another table.\n\nNotes:\n\
    \n## Using SQL to Retrieve Data from a Database\n\n- To select all of the information\
    \ in the data table, you could use this query:\n\n  `select * from data`\n\n \
    \ The database would return a set of records, called a recordset, which would\
    \ look like this:\n\n| data_uid | data_name | data_category | data_subcategory\
    \ | data_description |\n|----------|-----------|---------------|------------------|------------------|\n\
    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |\n| 2 | yahoo!\
    \ | 3 | General Interest | old-school search engine |\n| 3 | jane doe | 1 | Employees\
    \ | VP of something or other |\n| 9 | new event | 2 | Company Events | new product\
    \ release |\n\n- To limit the scope of the query to Web sites (category 3), a\
    \ where clause can be applied to the select statement, limiting the scope of the\
    \ statement to those records where the value of a field meets a specific criterion:\n\
    \n  `select * from data where data_category = 3`\n\n  This limits the resulting\
    \ recordset to two records:\n\n| data_uid | data_name | data_category | data_subcategory\
    \ | data_description |\n|----------|-----------|---------------|------------------|------------------|\n\
    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |\n| 2 | yahoo!\
    \ | 3 | General Interest | old-school search engine |\n\n- Other times, it might\
    \ be not be necessary to get all of the fields in a table. In this case, the query\
    \ can request specific fields instead of using the \"*\" wildcard. For example:\n\
    \n  `select data_name, data_description from data where data_category = 3`\n\n\
    \  This would generate the following recordset:\n\n| data_uid | data_description\
    \ |\n|----------|------------------|\n| 1 | overrated Web site |\n| 2 | old-school\
    \ search engine |\n\n- Finally, it's often useful to sort a recordset so that\
    \ the results will be in order. This is done by appending an order by clause to\
    \ a query:\n\n  `select data_name from data order by data_name`\n\n  This would\
    \ return an alphabetically sorted list of names:\n\n| data_name |\n|-----------|\n\
    | jane doe |\n| lovejoy.com |\n| new event |\n| yahoo! |\n\n## Microsoft Access\n\
    \nThree reasons Microsoft Access is used in this course:\n\n1. Many people already\
    \ own a copy of MS Access.\n2. The ODBC drivers for MS Access are bundled with\
    \ the various Windows Operating Systems.\n3. MS Access databases are files that\
    \ are easy to ftp or put on a floppy disk or CD-ROM.\n\nNotes:\n\n## ADO, ADODB,\
    \ ODBC, DSN, Etc. ...\n\nThere are three steps involved in creating database-driven\
    \ ASP pages:\n\n1. Create a database (this could be an Access database or any\
    \ other database that has an ODBC driver).\n\n2. On your Web server, create a\
    \ DSN (a Data Source Name, which is an ODBC data source). This makes it possible\
    \ for your script to find your database and connect to it.\n\n3. Write an ASP\
    \ script that uses ADO (ActiveX Data Objects) to create one or more recordsets\
    \ and perhaps give SQL instructions to your database.\n\nNotes:\n\n## ***The Database\
    \ Connection Object***\n\n- To create a connection to a DSN called ch3db:\n\n\
    ```\n1. DSN = \"DSN=ch3db\";\n2. Conn = Server.CreateObject(\"ADODB.Connection\"\
    );\n3. Conn.Open(DSN);\n4. // now that the connection is open\n5. // you can do\
    \ something with it here\n6. Conn.Close ();\n```\n\n- There are two things you\
    \ can do once you have a connection:\n\n- Execute SQL statements that do not return\
    \ records.\n\n- Create a Recordset object to collect the results of an SQL select\
    \ statement.\n\n- \\\n\n- These SQL statements do not return records:\n\ninsert\
    \  \nupdate  \ndelete\n\n- Once a connection is established, the Execute() method\
    \ of the Connection object can be used to execute an SQL statement:\n\n```\nConn.Execute(SQL_statement);\n\
    Conn.Execute(\"update categories set\n        category_description = 'Spiffy sites!'\n\
    \        where category_uid = 3\");\n```\n\nSometimes it's easier to assign the\
    \ SQL statement to a variable first:\n\n```\nvar insert_statement = \"insert into\
    \ data (data_name,\n        data_category, data_subcategory, data_description)\n\
    \        values ('prentice hall', 3, 'General Interest', '\n        web site for\
    \ this book')\";\nConn.Execute(insert_statement);\n```\n\n## The Recordset Object\n\
    \nLet's consider this categories table, which we've seen before in this lecture:\n\
    \n## Category\n\n| category_uid | category_name | category_description |\n| ---\
    \ | --- | --- |\n| 1 | People | A list of people, their phone numbers, and information\
    \ about them |\n| 2 | Events | A list of scheduled events and important dates\
    \ |\n| 3 | Web Sites | Web sites that relate to our industry or are of general\
    \ interest |\n\nHere, we'll create code can be used to add its contents to a Web\
    \ page:\n\n```\n<%@ Language=JavaScript %>\n<%\nDSN = \"DSN=ch3db\";\nConn = Server.CreateObject(\"\
    ADODB.Connection\");\nConn.Open(DSN);\n\nsql = \"SELECT * FROM categories \";\n\
    rs = Server.CreateObject(\"ADODB.RecordSet\");\nrs.Open (sql, Conn);\n\nout =\
    \ \"<table border=1>\";\nout += \"<tr><td><pre>category_uid</pre></td><td><pre>category_name</pre></td><td><pre>category_description</pre></td></tr>\"\
    ;\nwhile (! (rs.EOF)){\nout += \"<tr><td>\";\nout += String(rs.fields.item(\"\
    category_uid\")) + \"</td><td>\";\nout += String(rs.fields.item(\"category_name\"\
    )) + \"</td><td>\";\nout += String(rs.fields.item(\"category_description\")) +\
    \ \"</td><tr>\";\nrs.move(1);\n} // end while recordset\nout += \"</table>\";\n\
    \nrs.Close ();\n```"
  mdcn: "\n ## 第三讲\n\n## 数据库驱动页面\n\n## 学习目标\n\n- 从数据库生成网页\n\n## 课程 3.1\n\n## 从数据库生成网页\n\
