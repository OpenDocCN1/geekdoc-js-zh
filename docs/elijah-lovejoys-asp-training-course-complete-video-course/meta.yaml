    15. %>\n```\n\n## Notes:\n\n## Summary\n\nHere's a list of the topics covered\
    \ in this lecture:\n\n- Learning some neat tricks to collect data submitted by\
    \ a form, even if you don't know what the data is.\n- Storing that data in a database.\n\
    - Creating template-driven interfaces.\n- Using a password to limit who can use\
    \ a script.\n- Organizing a set of scripts to work together relatively efficiently.\n\
    \n## Lecture 5\n\n### Shopping Cart\n\n**Objectives**\n\n- Build a Shopping Cart\n\
    \n## LESSON 5.1\n\n### Build a Shopping Cart\n\n## Security\n\n- Communication\
    \ between a browser and a server can be encrypted using SSL.\n\n- The script in\
    \ this lecture stores payment information (credit cards, prepaid Internet cards,\
    \ etc. ...) unencrypted on the server. If you do store unencrypted information\
    \ on your server, make sure it's as secure as you can make it and take the information\
    \ off the server quickly.\n\n- If you ship products to someone using stolen credit\
    \ cards, you are liable for the product. So make sure that your credit card validation\
    \ process includes antifraud measures.\n\n- Take simple precautions:\n\n- Password-protect\
    \ computers that store important information\n\n- Don't share passwords.\n\n-\
    \ Keep computers in locked rooms.\n\n- Exercise common sense!\n\nNotes:\n\n##\
    \ A Quick Tour\n\n- This cart lets buyers browse items for sale by category or\
    \ via keyword search:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_151_0.png)\n\
    \n## LECTURE 5 SHOPPING CART\n\n- A link lets shoppers check out when they're\
    \ ready:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_152_0.png)\n\nThe first step\
    \ to purchase requires that the buyer submit shipping information:\n\n| p/n |\
    \ name | desc | qty | price | ext. price |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| BK1 | Shirt 1 | Type 1 Shirt (Weight Factor 2) | 1 | $12.95 | $12.95 |\n\
    | CK1CHOK | Handkerchief | Truly a man's accessory (Silk) (Weight Factor 1) |\
    \ 1 | $2.25 | $2.25 |\n| | | | | subtotal | $15.20 |\n| | | | | shipping cost\
    \ | $17.55 |\n\nUpgrade Shipping:\n2 day ○ (costs $15.00 extra)\novernight ○ (costs\
    \ $21.00 extra)\n\nContact Information:\n\nFirst Name: john\n\nLast Name: doe\n\
    \nEmail Address: john_doe@lovejoy.com\n\nPhone Number: 805-966-0611\n\nShipping\
    \ Information (US Only!):\n\nAddress 1: 18 Main St\n\nAddress 2:\n\nCity: santa\
    \ barbara\n\nState: CA ▾\n\nZip Code: 93101\n\n## LECTURE 5 SHOPPING CART\n\n\
    - The next step is to supply billing information:\n\n| SKU | Product | Description\
    \ | Qty | Price | Total |\n|-----|---------|-------------|-----|-------|-------|\n\
    | BK1 | Shirt 1 | Type 1 Shirt (Weight Factor: 2) | 1 | $12.95 | $12.95 |\n| CK1CHOK\
    \ | Handkerchief | Truly a man's accessory (Silk) (Weight Factor: 1) | 1 | $2.25\
    \ | $2.25 |\n| | | | subtotal | $15.20 | |\n| | | | shipping cost | $17.55 | |\n\
    | | | | tax | $1.33 | |\n| | | | total | $22.38 | |\n\nThis order will be shipped\
    \ to:\n\njohn doe\n8 Main St.\nsanta barbara, CA 93101\n\nPay with Prepaid Web\
    \ Card:\n\nCard Number: 4111 1111 1111 1111\nPIN Number: 5678\n[submit]\n\nPay\
    \ with Credit Card:\n\nMethod of Payment: [Visa ▼]\nCard Number: 411_tor_color_#0000FF\"\
    >4111 1111 1111 1111\nExpiration Date: 02/03\n\nIf billing address is different\
    \ from shipping address, you must fill out billing address below:\n\nFirst Name:\
    \ [____________________]\nLast Name: [_____________________]\nAddress 1: [_____________________]\n\
    Address 2: [_____________________]\nCity: [_________________________]\nState:\
    \ [▼]\nZip Code: [______________________]\n\n[submit]\n\n- The cart finally generates\
    \ an order acknowledgment screen:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_155_0.png)\n\
    \n## LECTURE 5 SHOPPING CART\n\n- At the same time, orders are written to a folder\
    \ on the hard drive of the Web server, where they can easily be collected:\n\n\
    ![](img/bb6d9d5758805a03d9304333e9a2e084_156_0.png)\n\n## New ASP Features\n\n\
    - Storing Information in the Session Object\n- Creating Templates\n- Storing Related\
    \ Data in Two Text Files\n\nNotes:\n\n## Storing Information in the Session Object\n\
    \n- Scripts in this lecture store two sets of information in the Session object:\n\
    \  - Items users place in their carts\n  - Information users give about themselves\n\
    \nNotes:\n\n## **cart_items**\n\n- cart_items stores:\n  - item part numbers\n\
    \  - quantities\n  - names\n  - descriptions\n  - prices\n  - etc.\n\n**Notes:**\n\
    \n## **order_info**\n\n- order_info stores:\n  - shipping information\n  - billing\
    \ information\n  - other information collected about a user\n\n**Notes:**\n\n\
    ## Creating Session Strings and Objects\n\n- A string:\n  `Session(\"color\")\
    \ = blue`\n- An object:\n  `Session(\"order_info\") = new Object();`\n- A property\
    \ of that object:\n  `Session(\"order_info.first_name\") = Bill`\n\nNotes:\n\n\
    ## Storing Related Data in Two Text Files\n\n- Two text files for storing information\
    \ about items:\n  - catalog_file.txt contains every item for sale\n  - option_file.txt\
    \ contains each item's options\n\n| catalog_file.txt | | option_file.txt | | |\
    \ |\n| Part Number | Description | Part Number | Extension | Option Desc. | Price\
    \ |\n| b_shrt | A nice blue shirt | b_shrt | -Sm | Small | $12.00 |\n| | | b_shrt\
    \ | -Md | Medium | $15.00 |\n| | | b_shrt | -Lg | Large | $17.00 |\n| w_shrt |\
    \ A good white shirt | w_shrt | | One size fits all | $16.00 |\n\nThis table illustrates\
    \ two cases: a blue shirt, which is available in three sizes, and a white shirt,\
    \ which is available in only one size. Both shirts have a single line of information\
    \ in catalog_file.txt. In option_file.txt, however, it's a different story: Here,\
    \ there are three lines for the blue shirt, which has three options, and one line\
    \ for the white shirt, which has one option.\n\nNote that the part number field\
    \ appears in both files, which makes it possible to map records in the catalog\
    \ file to records in the option file. The full part number of an item consists\
    \ of a concatenation of the part number and the extension fields (extensions can\
    \ be blank if an item has only one option). Thus, w_shrt and b_shrt-sm are valid\
    \ part numbers, whereas b_shirt is not a valid part number, because it does not\
    \ include an extension, and there is more than one option for the blue shirt."
