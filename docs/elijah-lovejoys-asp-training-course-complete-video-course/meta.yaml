- img_proc: true
  md: "# SMTP, POP, IMAP, Etc.\n\n+   - Email addresses come in the form: `Elijah@Lovejoy.com`\n\
    \  That's two parts:\n  - Internet domain name = `Lovejoy.com`\n  - Unique name\
    \ mapped to mail account = `Elijah`\n\n+   - Mailboxes are maintained by mail\
    \ servers for local users. POP3 are the most common; IMAP are fancier.\n  Two\
    \ things about mailboxes:\n  - People tend to forget their passwords since most\
    \ email software remember for them.\n  - Mailboxes are usually stored on servers\
    \ with a different domain name than the email address.\n\n+   - Mail servers are\
    \ applications in charge of getting email where it needs to go. Most mail servers\
    \ (or \"message transfer agents\") support SMTP, which is the Internet standard\
    \ for mail.\n\n**Notes:**"
