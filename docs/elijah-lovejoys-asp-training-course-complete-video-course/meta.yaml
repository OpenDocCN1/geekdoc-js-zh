    \n## Collecting Field Names from a Recordset Object\n\nThe previous script can\
    \ be changed as follows to collect field names from the recordset itself:\n\n\
    ```\n<%@ Language=JavaScript %>\n<%\nDSN = \"DSN=ch3db\";\nConn = Server.CreateObject(\"\
    ADODB.Connection\");\nConn.Open(DSN);\n\n\tsql = \"SELECT * FROM categories \"\
    ;\n\trs = Server.CreateObject(\"ADODB.RecordSet\");\n\trs.Open (sql, Conn);\n\n\
    \t\tout = \"<table border=1><tr>\";\n\t\tfield_array = new Array()\n\t\tfor (\
    \ field_number = 0; field_number < rs.fields.count ; field_number++ ){\n\t\t\t\
    out += \"<td><pre>\" + \n\t\t\trs.fields(field_number).Name + \n\t\t\t\"</pre></td>\"\
    ;\n\t\t\tfield_array[field_number] =\n\t\t\trs.fields(field_number).Name;\n\t\t\
    }\n\t\tout += \"</tr>\";\n\n\t\twhile (! (rs.EOF)){\n\t\t\tout += \"<tr>\";\n\t\
    \t\tfor (i=0; i<field_array.length ; i++)\n\t\t\t{\n\t\t\t\tout +=\"<td>\" +\n\
    \t\t\t\tString(rs.fields.item(field_\n\t\t\t\tarray[i])) + \"</td>\"\n\t\t\t}\n\
    \t\t\tout += \"</tr>\";\n\t\t\trs.move(1);\n\t\t} // end while recordset\n\t\t\
    out += \"</table>\";\n\n\t\trs.Close ();\n\nConn.Close ();\n%>\n<html><head><title>recordset\n\
    example</title></head><body>\n<%= out %>\n</body></html>\n```\n\n## Creating a\
    \ JavaScript `for()` Loop\n\n- `for()` loops are useful when you need to iterate\
    \ through a known number of items. For example, to count from one to ten:\n\n\
    ```\nfor (i=1; i<=10; i++){\n    Response.Write(i + \"<br>\");\n}\n```\n\nwhich\
    \ creates results shown here:\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_74_0.png)\n\
    \n- A similar system can be used to iterate through an array using the length\
    \ property of arrays, which contains the integer value for the number of elements\
    \ in the array. For example,\n\n```\nnames_array = new Array\n    (\"bob\", \"\
    marla\", \"jonathan\", \"dede\");\nfor (i=0; i<names_array.length ; i++) {\n \
    \   Response.Write(names_array[i] + \"<br>\");\n}\n```\n\nwill create the results\
    \ shown here.\n\n![](img/bb6d9d5758805a03d9304333e9a2e084_75_0.png)\n\n## Creating\
    \ a JavaScript Function\n\nA function is a way of encapsulating code that is frequently\
    \ used. For example, suppose you had to constantly sent the string \"Hello World\"\
    \ to the browser:\n\n```\nResponse.Write(\"Hello World\");\n```\n\nYou could create\
    \ a function that would do this for you:\n\n```\nFunction hello (){\n    Response.Write(\"\
    Hello World\");\n}\n```\n\nso that all you'd have to type would be:\n\n```\nhello();\n\
    ```\n\n## Using Include Files for Shared Code\n\n- If you find yourself using\
    \ the same code over and over in different scripts, you may want to consider using\
    \ include files to share the same set of code among many files. For example, let's\
    \ say you have a file with an include:\n\n```\n<%@ Language=JavaScript %>\n<html><head></head><body>\n\
    <!-- #include file=\"include.js\" -->\n<p>example asp page\n</body></html>\n```\n\
    \nand the include file consisted of a small amount of ASP code:\n\n```\n<%\nResponse.Write(\"\
    Yet another\")\n%>\n```\n\nThis would be the same as having a single file:\n\n\
    ```\n<%@ Language=JavaScript %>\n<html><head></head><body>\n<%\nResponse.Write(\"\
    Yet another\")\n%>\n<p>example asp page\n</body></html>\n```\n\n## Creating a\
    \ JavaScript Object to Store Information\n\nHere's how to store information in\
    \ an object. For example, let's say that you need to keep track of information\
    \ about Bill in a script. You could write this:\n\n```\nbill = new Object();\n\
    bill.name = \"bill smith\";\nbill.age = \"8\";\nbill.favorite_colour = \"purple!\"\
    ;\nbill.birthday = \"10/18/99\";\n```\n\nThen it would be easy to use this information\
    \ later. For example:\n\n```\nResponse.Write(\"Happy Birthday, \" + bill.name\
    \ + \". I can't be-\nlieve you're already\" + bill.age );\n```\n\nwhich would\
    \ send the string \"Happy Birthday bill smith. I can't believe you're already\
    \ 8\" to the browser.\n\nIf all you're doing is keeping track of information about\
    \ Bill, this might not make so much sense. But if you needed to keep track of\
    \ the same information for Miranda and Wilbur and Veronica as well, all of a sudden,\
    \ using an object might help make keeping track of everything a lot easier.\n\n\
    Knowing, for example, that we had objects named after each with the appropriate\
    \ age stored in each object, we could then access their ages using a consistent\
    \ syntax, like this:\n\n```\nbill.name\nmiranda.name\nwilbur.name\nveronica.name\n\
    ```\n\n## Code for View Database Scripts\n\n- There are three scripts and a database\
    \ provided for this example:\n  - ch3_include.js\n  - ch3_view_categories.asp\n\
    \  - ch3_view_records.asp\n  - ch3db.mdb\n- These files must be placed in the\
    \ same folder.\n\n# LECTURE 3  DATABASE-DRIVEN PAGES\n\n## Script 3-1\n\n### ch3_include.js\n\
    \n```\n1. <%\n2. var out = \"\";\n3. var current_category =\n   String(Request(\"\
    current_category\")); // category uid\n4. var view_categories_script =\n   \"\
