  - '[PAGE 64]


    # Storing Information in Tables


    These tables show how two kinds of information used by the scripts in this lecture
    are organized into tables. The first one stores information about categories.
    The second shows a list of the actual people, events, and Web sites that are stored
    in the database:


    # Category


    | category_uid | category_name | category_description |

    | --- | --- | --- |

    | 1 | People | A list of people, their phone numbers, and information about them
    |

    | 2 | Events | A list of scheduled events and important dates |

    | 3 | Web Sites | Web sites that relate to our industry or are of general interest
    |


    # Data


    | data_uid | data_name | data_category | data_subcategory | data_description |

    | --- | --- | --- | --- | --- |

    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |

    | 2 | yahoo! | 3 | General Interest | old-school search engine |

    | 3 | jane doe | 1 | Employees | VP of something or other |

    | 9 | new event | 2 | Company Events | new product release |


    A few things to note about tables:


    +   - Each row in the table is stored information about one piece of information
    and is called a record.

    - Each record is broken up into a number of fields.

    - Each field contains a different type of information.'
  - '[PAGE 65]


    # Relating Information Stored in Different Tables


    +   - A primary key is a field used to uniquely identify a record in a table.

    - A foreign key is a field used to relate fields in a table to the primary key
    of a record in another table.


    # Notes:'
  - "[PAGE 66]\n\n# ## Using SQL to Retrieve Data from a Database\n\n+   - To select\
    \ all of the information in the data table, you could use this query:\n\n  `select\
    \ * from data`\n\n  The database would return a set of records, called a recordset,\
    \ which would look like this:\n\n| data_uid | data_name | data_category | data_subcategory\
    \ | data_description |\n|----------|-----------|---------------|------------------|------------------|\n\
    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |\n| 2 | yahoo!\
    \ | 3 | General Interest | old-school search engine |\n| 3 | jane doe | 1 | Employees\
    \ | VP of something or other |\n| 9 | new event | 2 | Company Events | new product\
    \ release |\n\n+   - To limit the scope of the query to Web sites (category 3),\
    \ a where clause can be applied to the select statement, limiting the scope of\
    \ the statement to those records where the value of a field meets a specific criterion:\n\
    \n  `select * from data where data_category = 3`\n\n  This limits the碗 resulting\
    \ recordset to two records:\n\n| data_uid | data_name | data_category | data_subcategory\
    \ | data_description |\n|----------|-----------|---------------|------------------|------------------|\n\
    | 1 | lovejoy.com | 3 | General Interest | overrated Web site |\n| 2 | yahoo!\
    \ | 3 | General Interest | old-school search engine |"
  - "[PAGE 67]\n\n+   - Other times, it might be not be necessary to get all of the\
    \ fields in a table. In this case, the query can request specific fields instead\
    \ of using the \"**\" wildcard. For example:\n\n  `select data_name, data_description\
    \ from data where data_category = 3`\n\n  This would generate the following recordset:\n\
    \n| data_uid | data_description |\n|----------|------------------|\n| 1 | overrated\
    \ Web site |\n| 2 | old-school search engine |\n\n+   - Finally, it's often useful\
    \ to sort a recordset so that the results will be in order. This is done by appending\
    \ an order by clause to a query:\n\n  `select data_name from data order by data_name`\n\
    \n  This would return an alphabetically sorted list of names:\n\n| data_name |\n\
    |-----------|\n| jane doe |\n| lovejoy.com |\n| new event |\n| yahoo! |"
