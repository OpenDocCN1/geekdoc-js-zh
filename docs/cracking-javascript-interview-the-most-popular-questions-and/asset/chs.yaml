  \n# 第 3 章：对象与原型\n\n在 JavaScript 中，对象几乎是所有事物的基础。它们不仅是数据容器，还是继承、封装和动态行为的支柱。本章将探讨 JavaScript\
  \ 基于原型的架构中的面向对象编程（OOP）原则。无论你是在处理简单对象还是构建复杂的类层次结构，理解对象及其原型对于掌握这门语言至关重要。\n\nJavaScript\
  \ 的对象模型是独特的，它将函数式编程概念与传统 OOP 模式相结合，使其既灵活又有时具有挑战性。原型作为对象的蓝图，支持继承和共享行为等特性。通过理解对象、原型以及现代类语法的复杂性，你将释放\
  \ JavaScript 作为动态、灵活语言的全部力量。\n\n## 本章你将学到什么\n\n1.  **对象创建模式**：学习创建对象的不同方式，从字面量、构造函数到\
  \ `Object.create()`，以及何时使用每种模式以获得最大的灵活性和性能。\n2.  **原型与继承**：深入探讨原型链、继承模型以及 `__proto__`\
  \ 在 JavaScript 运行时行为中的作用。\n3.  **现代 OOP 特性**：理解 ES6 类语法如何简化原型的使用，探索静态方法，并利用混入（mixins）实现可组合的行为。\n\
  4.  **对象克隆与复制**：掌握深拷贝和浅拷贝的技术，并学习在现实场景中何时使用每种方法，以防止数据损坏或意外副作用。\n\n## 为什么本章很重要\n\n\
  *   **设计灵活性**：对象在 JavaScript 中无处不在，从普通的数据结构到 React 或 Vue 等框架的构建块。理解它们的创建和继承模式对于设计可扩展的系统至关重要。\n\
