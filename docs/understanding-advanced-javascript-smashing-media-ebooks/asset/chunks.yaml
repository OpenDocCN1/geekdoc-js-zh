- fmt: "\nYour website works. Now let's make it work faster. Website performance is\
    \ about two things: how fast the page loads, and how fast the code on it runs.\
    \ Plenty of services make your website load faster, from [minimizers](http://stackoverflow.com/questions/3520285/is-there-a-good-javascript-minimizer)^([1](#chapter-6.xhtml_fn6_1))\
    \ to [CDNs](http://en.wikipedia.org/wiki/Content_delivery_network)^([2](#chapter-6.xhtml_fn6_2)),\
    \ but making it run faster is up to you.\n\nLittle changes in your code can have\
    \ gigantic performance impacts. A few lines here or there could mean the difference\
    \ between a blazingly fast website and the dreaded “Unresponsive Script” dialog.\
    \ This chapter shows you a few ways to find those lines of code with [Chrome Developer\
    \ Tools](http://code.google.com/chrome/devtools/docs/overview.html)^([3](#chapter-6.xhtml_fn6_3)).\n\
    \n## Establish A Baseline\n\nWe'll look at a simple application called a color\
    \ sorter, which presents a grid of rainbow colors that you can drag and drop to\
    \ mix up. Each dot is a `div` tag with a little CSS to make it look like a circle.\n\
    \n[![The Color Sorter](images/color_sorter.png \"The Color Sorter\")](http://zgrossbart.github.com/jsprofarticle/index1.htm)\n\
    \nGenerating my rainbow colors was a little tricky, so I got help from “[Making\
    \ Annoying Rainbows in JavaScript](http://krazydad.com/tutorials/makecolors.php)^([4](#chapter-6.xhtml_fn6_4)).\n\
    \nThe page loads pretty fast, but it still takes a moment and blinks a little\
    \ before it paints. Time to profile the page and make it faster.\n\nAlways start\
    \ performance-improvement projects with a baseline understanding of how fast or\
    \ slow your application already is. The baseline will let you know whether you're\
    \ making improvements and help you make tradeoffs. For this chapter, we'll use\
    \ [Chrome Developer Tools](http://code.google.com/chrome/devtools/docs/overview.html)^([5](#chapter-6.xhtml_fn6_5)).\n\
    \nThe profiler is part of Chrome Developer Tools, which is always available in\
    \ Chrome. Click the “Tools” menu under the little wrench to open it. [Firebug](http://getfirebug.com)^([6](#chapter-6.xhtml_fn6_6))\
    \ has some profiling tools, too, but the WebKit browsers (Chrome and Safari) are\
    \ best at profiling code and showing timelines. Chrome also offers an excellent\
    \ tool for event tracing, called [Speed Tracer](https://developers.google.com/web-toolkit/speedtracer/)^([7](#chapter-6.xhtml_fn6_7)).\n\
    \nTo establish our baseline, we'll start recording in the “Timeline” tab, load\
    \ our page and then stop the recording. (To start recording once Chrome Developer\
    \ Tools is open, click the “Timeline” tab, and then the small black circle icon\
    \ for “Record” at the very bottom of the window.) Chrome is smart about not starting\
    \ to record until the page starts to load. I run it three times and take the average,\
    \ in case my computer runs slowly during the first test.\n\n![Performance baseline\
    \ 1](images/baseline1.png \"Performance baseline 1\")\n\nMy average baseline—i.e.\
    \ the time between the first request for the page and the final painting of the\
    \ page in the browser—is 1.25 seconds. That's not bad, but it's not great for\
    \ such a small page.\n\nI want to make my code run faster, but I'm not sure what's\
    \ making it slow. The profiler helps me find out.\n\n## Create A Profile\n\nThe\
    \ timeline tells us how long our code took to run, but that doesn't help us know\
    \ what's going on while it's running. We could make changes and run the timeline\
    \ again and again, but that's just shooting in the dark. The “Profiles” tab gives\
    \ us a better way to see what's going on.\n\nProfilers show us which functions\
    \ take the most time. Let's make our baseline profile by switching to the “Profiles”\
    \ tab in Chrome Developer Tools, where three types of profiling are offered:\n\
    \n- **JavaScript CPU profile**: Shows how much CPU time our JavaScript is taking.\n\
    - **CSS selector profile**: Shows how much CPU time is spent processing CSS selectors.\n\
    - **Heap snapshot**: Shows how memory is being used by our JavaScript objects.\n\
    \nWe want to make our JavaScript run faster, so we'll use the CPU profiling. We\
    \ start the profile, refresh the page and then stop the profiler.\n\n![The first\
    \ profile](images/profile1.png \"The first profile\")\n\nThe first thing that's\
    \ clear from the profile is that a lot is going on. The color sorter uses jQuery\
    \ and jQuery UI, which are doing a lot of stuff like managing plugins and parsing\
    \ regular expressions. I can also see that two of my functions are at the top\
    \ of the list: `decimalToHex` and `makeColorSorter`. These two functions take\
    \ a total of 13.2% of my CPU time, so they're a good place to start making improvements.\n\
    \nWe can click the arrow next to the function calls to open the complete function-call\
    \ stack. Expanding them, I see that `decimalToHex` is called from `makeColorSorter`,\
    \ and `makeColorSorter` is called from `$(document).ready`.\n\nHere's the code:\n\
    \n```\n$(document).ready(function() {\n    makeColorSorter(.05, .05, .05, 0, 2,\
    \ 4);\n});\n```\n\n## Isolate The Problem\n\nThe timeline tells us how long our\
    \ code took to run, but that doesn't help us know what's going on while it's running.\
    \ We could make changes and run the timeline again and again, but that's just\
    \ shooting in the dark. The “Profiles” tab gives us a better way to see what's\
    \ going on. (Wait, let me re-align with the provided text logic flow). \n\n*Correction\
    \ based on the provided text content for \"Isolate The Problem\":*\n\nInstead\
    \ of loading the colorter when the document is ready, I'll make it clickable.\
    \ Let's call the new function `testColorSorter` and bind it to button:\n\n```\n\
    function testColorSorter() {\n    makeColorSorter(.05, .05, .05, 0, 2, 4);\n}\n\
    ```\n\n```\n<button id=\"clickMe\" onclick=\"testColorSorter();\">Click me</button>\n\
    ```\n\nChanging the application before we profile could alter the performance\
    \ unexpectedly. This change looks pretty safe, but I still want to run the profiler\
    \ again to see whether I've changed anything. I'll create this new profile by\
    \ starting the profiler, pressing the button in the app and then stopping the\
    \ profile.\n\n![The second profile](images/profile2.png \"The second profile\"\
    )\n\nThe first thing to notice is that the `decimalToHex` function is now taking\
    \ up 4.23% of the time; it's what the code spends the most time on. Let's create\
    \ a new baseline to see how much the code improves in this scenario.\n\n![The\
    \ second baseline](images/baseline2.png \"The second baseline\")\n\nA few events\
    \ occur before I press the button, but I only care about how long it took between\
    \ the times the mouse was clicked and the browser painted the color sorter. The\
    \ mouse button was clicked at 390 milliseconds, and the paint event happened at\
    \ 726 milliseconds; 726 minus 390 equals my baseline of 336 milliseconds. Just\
    \ as with the first baseline, I ran it three times and took the average time.\n\
    \n## Make It Faster\n\nThe profile only tells us which function is causing the\
    \ problem, so we need to look into it and understand what it does.\n\n```javascript\n\
    function decimalToHex(d) {\n    var hex = Number(d).toString(16);\n    hex = \"\
    00\".substr(0, 2 - hex.length) + hex; \n\n    console.log('converting ' + d +\
    \ ' to ' + hex);\n    return hex;\n}\n```\n"
