    从零开始编写 Web 应用程序时，很容易觉得我们只需要依赖一个 [DOM](https://developer.mozilla.org/en/DOM/About_the_Document_Object_Model)^(1)
    操作库（如 [jQuery](http://jquery.com)^(2))以及一些实用工具插件就能应付了。这样做的问题在于，很快你就会迷失在嵌套的 jQuery
    回调和 DOM 元素中，而我们的应用程序并没有建立任何真正的结构。


    简而言之，我们陷入了[意大利条面代码](http://en.wikipedia.org/wiki/Spaghetti_code)^(3)的困境。幸运的是，现代
    JavaScript 框架可以帮助我们为项目引入结构和组织，提高其长期的可维护性。


    ## 什么是 MVC，或者说什么是 MV*？


    这些现代框架为开发者提供了一种易于组织代码的路径，使用了各种名为 [MVC](http://addyosmani.com/resources/essentialjsdesignpatterns/book/#detailmvcmvp)^(4)（模型-视图-控制器）的模式。MVC
    将应用程序中的关注点拆分为三个部分：


    - **模型（Models）**代表应用程序中的特定领域知识和数据。可以将其看作你可以建模的数据“类型”，例如用户（User）、照片（Photo）或笔记（Note）。模型应该在其状态变化时通知观察者（例如视图）。

    - **视图（Views）**通常被认为是应用程序的用户界面（例如你的标记和模板），但也不一定如此。它们应该知道模型的存在以便观察它们，但不会直接与模型进行通信。

    - **控制器（Controllers）**处理应用程序中的输入（例如点击、用户操作），而视图可以被视为处理输出。当一个 `Controller` 更新模型的状态（例如编辑照片的说明文字）时，它不会直接告诉视图。这正是视图和模型之间关系中观察者模式的作用所在。


    帮助我们结构化代码的 JavaScript “MVC”框架并不总是严格遵循上述模式。某些框架会将控制器的职责包含在视图中（例如 [Backbone.js](http://backbonejs.org)^(5)），而另一些框架则会将自己的见解组件加入其中，因为它们认为这样更有效。


    出于这个原因，我们将此类框架称为遵循 MV* 模式，也就是说，你可能有一个视图和一个模型，但更有可能还包含其他内容。


    **注意：** 还存在 MVC 的变体，被称为 MVP（模型-视图-演示器）和 MVVM（模型-视图-视图模型）。如果你是初学者并觉得信息量太大，不要担心。理解这些模式可能需要一点时间，但在我的在线书籍[学习
    JavaScript 设计模式](http://addyosmani.com/resources/essentialjsdesignpatterns/book/#detailmvcmvp)^(6)中，我对上述模式编写了更多详细的内容，以备你需要进一步帮助。


    ![](img/juggling-monkey.jpg "cover")


    ## 你什么时候需要 JavaScript MV* 框架？


    在使用 JavaScript 构建单页应用时，无论是涉及复杂的用户界面，还是仅仅为了减少加载新视图所需的 HTTP 请求，你都可能发现自己正在发明许多构成像
    Backbone 或 Ember 这样的 MV* 框架的组件。


    在开始阶段，编写一个提供*某些*约定性方式来避免意大利条面代码的应用程序框架并不困难，但如果说写出达到 Backbone 水平的东西轻而易举，将是一个极其错误的假设。


    构建应用程序涉及的内容比组合 DOM 操作、模板和路由多得多。成熟的 MV* 框架不仅包含了你可能会发现编写的许多部分，还包含了你以后遇到问题的解决方案。这是一种你不应该低估的价值。


    那么，你什么时候需要 MV* 框架，什么时候不需要？


    如果你正在编写一个需要与 API 或后端服务通信的应用程序，其中大部分数据查看或操作将在浏览器中进行，你可能会发现 MV* 框架很有用。


    这类应用的良好示例是 [Gmail](http://gmail.com)^(7) 和 [Google Docs](http://docs.google.com)^(8)。这些应用程序通常包含了用户所需的所有脚本、样式表和标记，并在后台执行大量的额外行为。你不需要应用程序重新渲染整个页面。


    然而，如果你构建的应用程序仍然依赖服务器进行大部分视图/页面渲染，而你只是在使用 JavaScript 或 jQuery 让其更具交互性，那么 MV 框架可能就太重过了。


    ## 选择的挑战：选项太多了吗？


    JavaScript 社区在过去几年中经历了一场复兴，开发者用它构建了更大、更复杂的应用程序。这种语言与经典软件工程师熟悉的语言（C++、Java）以及 Web
    开发者使用的语言（PHP、Python、.Net 等）仍很大不同。这意味着在许多情况下，我们是从这些其他语言中借用概念。


    在我的演讲[消化 JavaScript MVC：模式滥用还是进化](http://addyosmani.com/blog/digesting-javascript-mvc-pattern-abuse-or-evolution/)^(9)中，我提出了一个观点：在构建
    JavaScript 应用程序方面目前选择太多了。部分问题的根源于不同的 JavaScript 开发者对如何组织可扩展的 JavaScript 应用程序有不同的解释，导致每周都有不同
    MV* 视角的框架诞生，最终增加了噪音，因为我们仍在尝试建立正确的方法。


    ### TodoMVC：一个用于学习和比较的常用应用程序


    在过去的几年里，此类 MV* 框架的发布数量激增。


    '
- fmt: '

    [Backbone.js](http://backbonejs.org), [Ember.js](http://emberjs.com), [AngularJS](http://angularjs.com),
    [Spine](http://spinejs.com), [CanJS](http://canjs.us) … The list of new and stable
    solutions continues to grow each week and developers can quickly find themselves
    lost in a sea of options. From minds who have had to work on complex applications
    that inspired these solutions (such as [Yehuda Katz](http://github.com/wycats)
    and [Jeremy Ashkenas](http://github.com/jashkenas)), there are many strong contenders
    for what developers should consider using. The question is, what to use and how
    do you choose?


    We understood this frustration and wanted to help developers simplify their selection
    process as much as possible. To help solve this problem, we created [TodoMVC](http://todomvc.com)—a
    project which offers the same Todo application implemented in most of the popular
    JavaScript `MV* frameworks of today—think of it as speed dating for frameworks.
    Solutions look and feel the same, have a common feature set, and make it easy
    for us to compare the syntax and structure of different frameworks, so we can
    select the one we feel the most comfortable with or at least, narrow down our
    choices.


    ![](images/screenshot11.jpg "screenshot1")


    This week we''re releasing a brand new version of [TodoMVC](http://www.todomvc.com),
    which you can find more details about lower down in the apps section.


    In the near future we want to take this work even further, providing guides on
    how frameworks differ and recommendations for which options to consider for particular
    types of applications you may wish to build.


    ### Our Suggested Criteria For Selecting A Framework


    Selecting a framework is of course about more than simply comparing the Todo app
    implementations. This is why, once we''ve filtered down our selection of potential
    frameworks to just a few, it''s recommend to spend some time doing a little due
    diligence. The framework we opt for may need to support building non-trivial features
    and could end up being used to maintain the app for years to come.


    - **What is the framework really capable of?**


    Spend time reviewing both the source code of the framework and official list of
    features to see how well they fit with your requirements. There will be projects
    that may require modifying or extending the underlying source and thus make sure
    that if this might be the case, you''ve performed due diligence on the code.


    - **Has the framework been proved in production?**


    i.e Have developers actually built and deployed large applications with it that
    are publicly accessible? `Backbone` has a strong portfolio of these (SoundCloud,
    LinkedIn) but not all frameworks do. `Ember` is used in number of large apps,
    including the user tools in Square. `JavaScriptMVC` has been used to power applications
    at `IBM` amongst other places. It''s not only important to know that a framework
    works in production, but also being able to look at real world code and be inspired
    by what can be built with it.


    - **Is the framework mature?**


    We generally recommend developers don''t simply “pick one and go with it”. New
    projects often come with a lot of buzz surrounding their releases but remember
    to take care when selecting them for use on a production-level app. You don''t
    want to risk the project being canned, going through major periods of refactoring
    or other breaking changes that tend to be more carefully planned out when a framework
    is mature. Mature projects also tend to have more detailed documentation available,
    either as a part of their official or community-driven docs.


    - **Is the framework flexible or opinionated?**


    Know what flavor you''re after as there are plenty of frameworks available which
    provide one or the other. Opinionated frameworks lock (or suggest) you to do things
    in a specific way (theirs). By design they are limiting, but place less emphasis
    on the developer having to figure out how things should work on their own.


    - **Have you really played with the framework?**


    Write a small application without using frameworks and then attempt to refactor
    your code with a framework to confirm whether it''s easy to work with or not.
    As much as researching and reading up on code will influence your decision, it''s
    equally as important to write actual code using the framework to make sure you''re
    comfortable with the concepts it enforces.


    - **Does the framework have a comprehensive set of documentation?**


    Although demo applications can be useful for reference, you''ll almost always
    find yourself consulting the official framework docs to find out what its `API`
    supports, how common tasks or components can be created with it and what the gotchas
    worth noting are. Any framework worth it''s salt should have a detailed set of
    documentation which will help guide developers using it. Without this, you can
    find yourself heavily relying on `IRC` channels, groups and self-discovery, which
    can be fine, but are often overly time-consuming when compared to a great set
    of docs provided upfront.


    - **What is the total size of the framework, factoring in minification, gzipping
    and any modular building that it supports?**


    What dependencies does the framework have? Frameworks tend to only list the total
    filesize of the base library itself, but don''t list the sizes of dependencies.
    This can mean the difference between opting for a library that initially looks
    small, but be relatively large if say, depends on `jQuery` and other libraries.


    - **Have you reviewed the community around the framework?**


    Is there an active community of project contributors and users who would be able
    to assist if you run into issues? Have enough developers been using the framework
    that there are existing reference applications, tutorials and maybe even screencasts
    that you can use to learn more?


    ### Dojo And Rise Of The JavaScript Frameworks


    As many of us know, [Dojo](http://dojotoolkit.org) was one of the first efforts
    to provide developers a means to developing more complex applications and some
    might say it in-part inspired us to think more about the needs of non-trivial
    applications. I sat down to ask Dojos [Dylan Schiemann](http://dylanschiemann.com),
    `Kitson Kelly`, and `James Thomas` what their thoughts were on the rise of JavaScript
    `MV* frameworks`.


    **Q: Didn''t Dojo already solve all of this?**


    Years ago, while the JavaScript landscape evolved from adding simple `Ajax` and
    chrome to a page, `Dojo` was evangelizing a “toolkit” approach to building complex
    Web applications.


    Many of those features were way ahead of most developers needs. With the emergence
    of the browser as the dominant application platform, many of the innovations pioneered
    in The Dojo Toolkit now appear in newer toolkits. `MVC` was just another package
    that `Dojo` has provided for quite some time, along with modular code packages,
    `OO` in `JS`, `UI widgets`, cross-browser graphics, templating, internationalization,
    accessibility, data stores, testing frameworks, a build system and much, much
    more.


    JavaScript libraries shouldn''t end at “query”, which is why `Dojo`, early on,
    focussed on completing the picture for enterprise grade application development.
    This is the same focus that is has today with `MVC`, it''s just another “tool
    in the arsenal”.

    '
