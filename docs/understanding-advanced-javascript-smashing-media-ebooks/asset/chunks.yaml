    \n# Introduction To JavaScript Unit Testing\n\nBy Jörn Zaefferer\n\nYou probably\
    \ know that testing is good, but the first hurdle to overcome when trying to write\
    \ unit tests for client-side code is the lack of any actual units; JavaScript\
    \ code is written for each page of a website or each module of an application\
    \ and is closely intermixed with back-end logic and related HTML. In the worst\
    \ case, the code is completely mixed with HTML, as inline events handlers.\n\n\
    This is likely the case when no JavaScript library for some DOM abstraction is\
    \ being used; writing inline event handlers is much easier than using the `DOM`\
    \ APIs to bind those events. More and more developers are picking up a library\
    \ such as `jQuery` to handle the DOM abstraction, allowing them to move those\
    \ inline events to distinct scripts, either on the same page or even in a separate\
    \ JavaScript file. However, putting the code into separate files doesn't mean\
    \ that it is ready to be tested as a unit.\n\nWhat is a unit anyway? In the best\
    \ case, it is a pure function that you can deal with in some way—a function that\
    \ always gives you the same result for a given input. This makes unit testing\
    \ pretty easy, but most of the time you need to deal with side effects, which\
    \ here means DOM manipulations. It's still useful to figure out which units we\
    \ can structure our code into and to build unit tests accordingly.\n\n### Building\
    \ Unit Tests\n\nWith that in mind, we can obviously say that starting with unit\
    \ testing is much easier when starting something from scratch. But that's not\
    \ what this chapter is about. This chapter is to help you with the harder problem:\
    \ extracting existing code and testing the important parts, potentially uncovering\
    \ and fixing bugs in the code.\n\nThe process of extracting code and putting it\
    \ into a different form, without modifying its current behavior, is called `refactoring`.\
    \ Refactoring is an excellent method of improving the code design of a program;\
    \ and because any change could actually modify the behaviour of the program, it\
    \ is safest to do when unit tests are in place.\n\nThis chicken-and-egg problem\
    \ means that to add tests to existing code, you have to take the risk of breaking\
    \ things. So, until you have solid coverage with unit tests, you need to continue\
    \ manually testing to minimize that risk.\n\nThat should be enough theory for\
    \ now. Let's look at a practical example, testing some JavaScript code that is\
    \ currently mixed in with and connected to a page. The code looks for links with\
    \ `title` attributes, using those titles to display when something was posted,\
    \ as a relative time value, like “5 days ago”:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    \ />\n<title>Mangled date examples</title>\n<script>\nfunction prettyDate(time){\n\
    \tvar date = new Date(time || \"\"),\n\t\tdiff = (new Date().getTime() - date.getTime())\
    \ / 1000,\n\t\tday_diff = Math.floor(diff / 86400);\n\n\tif (isNaN(day_diff) ||\
    \ day_diff < 0 || day_diff >= 31) {\n\t\treturn;\n\t}\n\n\treturn day_diff ==\
    \ 0 &&\n\t\t\tdiff < 60 && \"just now\" ||\n\t\t\tdiff < 120 && \"1 minute ago\"\
    \ ||\n\t\t\tdiff < 3600 && Math.floor( diff / 60 ) + \" minutes ago\" ||\n\t\t\
    \tdiff < 7200 && \"1 hour ago\" ||\n\t\t\tdiff < 86400 && Math.floor( diff / 3600\
    \ ) + \" hours ago\") ||\n\t\tday_diff == 1 && \"Yesterday\" ||\n\t\tday_diff\
    \ < 7 && day_diff + \" days ago\" ||\n\t\tday_diff < 31 && Math.ceil( day_diff\
    \ / 7 ) + \" weeks ago\";\n}\n\nwindow.onload = function(){\n\tvar links = document.getElementsByTagName(\"\
    a\");\n\tfor (var i = 0; i < links.length; i++) {\n\t\tif (links[i].title) {\n\
    \t\t\tvar date = prettyDate(links[i].title);\n\t\t\tif (date) {\n\t\t\t\tlinks[i].innerHTML\
    \ = date;\n\t\t\t}\n\t\t}\n\t}\n</script>\n</head>\n<body>\n\n<ul>\n<li class=\"\
    entry\" id=\"post57\">\n\t<p>blah blah blah…</p>\n\t<small class=\"extra\">\n\t\
