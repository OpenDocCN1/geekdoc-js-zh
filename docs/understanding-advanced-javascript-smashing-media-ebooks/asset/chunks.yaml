  trans: "\n\n- 正如前面提到的，手动取消引用的更好替代方案是使用具有适当作用域的变量。也就是说，与其使用一个置为 null 的全局变量，不如直接使用在不再需要时就会超出作用域的函数局部变量。这意味着代码更整洁，需要担心的问题也更少。\n\
    - 确保在不再需要事件监听器时将它们解绑，特别是当它们所绑定的 DOM 对象即将被移除时。\n- 如果你在本地使用数据缓存，请确保清理该缓存或使用老化机制，以避免存储大量可能无法重用的数据块。\n\
    \n## 函数 (Functions)\n\n接下来，让我们来看函数。正如我们已经说过的，垃圾回收是通过回收不再可达的内存块（对象）来工作的。为了形象地说明这一点，这里有几个示例。\n\
    \n```\nfunction foo() {\n    var bar = new LargeObject();\n    bar.someCall();\n\
    }\n```\n\n当 `foo` 返回时，`bar` 指向的对象将自动可以进行垃圾回收，因为已经没有其他东西持有它的引用了。\n\n将其与此对比：\n\n\
    ```\nfunction foo() {\n    var bar = new LargeObject();\n    bar.someCall();\n\
    \    return bar;\n}\n\n// 其他地方\nvar b = foo();\n```\n\n我们现在拥有了该对象的引用，它在调用后存活，直到调用者为\
    \ `b` 赋值其他值（或者 `b` 超出作用域）。\n\n## 闭包 (Closures)\n\n当你看到一个返回内部函数的函数时，即使在外部函数执行完毕后，该内部函数仍然可以访问外部作用域。这基本上上是一个[闭包](http://robertnyman.com/2008/10/09/explaining-javascript-scope-and-closures/)^(9)——一个可以与特定上下文中设置的变量工作的表达式。例如：\n\
    \n```\nfunction sum (x) {\n    function sumIt(y) {\n        return x + y;\n  \
    \  };\n    return sumIt;\n}\n\n// 使用\nvar sumA = sum(4);\nvar sumB = sumA(3);\n\
    console.log(sumB); // 返回 7\n```\n\n在调用 `sum` 的执行环境中创建的函数对象无法被垃圾回收，因为它被全局变量引用，并且仍然可以访问。它仍然可以通过\
    \ `sumA(n)` 进行执行。\n\n让我们来看另一个例子。在这里，我们可以访问 `largeStr` 吗？\n\n```\nvar a = function\
    \ () {\n    var largeStr = new Array(1000000).join('x');\n    return function\
    \ () {\n        return largeStr;\n    };\n}();\n```\n\n是的，我们可以通过 `a()` 访问，所以它不会被回收。那么这一个呢？\n\
    \n```\nvar a = function () {\n    var smallStr = 'x';\n    var largeStr = new\
    \ Array(1000000).join('x');\n    return function (n) {\n        return smallStr;\n\
    \    };\n}();\n```\n\n我们无法再访问它了，它是垃圾回收的候选对象。\n\n## 定时器 (Timers)\n\n泄漏最糟糕的地方之一是在循环或\
    \ `setTimeout()`/`setInterval()` 中，但这种情况非常常见。\n\n考虑以下示例。\n\n```\nvar myObj = {\n\
    \    callMeMaybe: function () {\n        var myRef = this;\n        var val =\
    \ setTimeout(function () { \n            console.log('Time is running out!');\
    \ \n            myRef.callMeMaybe();\n        }, 1000);\n    }\n};\n```\n\n如果我们然后运行：\n\
    \n```\nmyObj.callMeMaybe();\n```\n\n为了启动计时器，我们可以每秒看到一次“Time is running out!”。如果然后运行：\n\
    \n```\nmyObj = null;\n```\n\n计时器将继续运行，因为 `myRef` 在闭包中引用了 `this`。即使 `myObj` 被置为\
    \ null，闭包仍然持有对它的引用，导致对象无法被回收。这就是一个典型的内存泄漏。\n\n## 注意性能陷阱 (Be Aware Of Performance\
    \ Traps)\n\n在某些情况下，直接使用 `DocumentFragment` 和原生 DOM 方法比使用 jQuery 性能更好。在我们的示例中，jQuery\
    \ 在循环中多次调用 `append()` 绑定每一个 `td` 并不是最高效的。\n\n"
- fmt: "\nWe might then look to other ways of improving performance. You may have\
    \ read somewhere that using the prototypal pattern is more optimal than the module\
    \ pattern (we confirmed it wasn't earlier), or heard that using JavaScript templating\
    \ frameworks are highly optimized. Sometimes they are, but use them because they\
    \ make for readable code. Also, precompile!. Let's test and find out how true\
    \ this hold in practice.\n\n```javascript\nmoduleG = function () {};\n\nmoduleG.prototype.data\
    \ = dataArray;\nmoduleG.prototype.init = function () {\n    this.addTable();\n\
    \    this.addEvents();\n};\nmoduleG.prototype.addTable = function () {\n    var\
    \ template = _.template($('#template').text());\n    var html = template({'data'\
    \ : this.data});\n    $tbody.append(html);\n};\nmoduleG.prototype.addEvents =\
    \ function () {\n   $('table').on('click', 'td', function () {\n       $(this).toggleClass('active');\n\
    \   });\n};\n\nvar modG = new moduleG();\n```\n\nAs it turns out, in this case\
    \ the performance benefits are negligible. [Opting for templating and prototypes](http://jsperf.com/second-pass)^([12](#chapter-7.xhtml_fn7_12))\
    \ didn't really offer anything more than what we had before. That said, performance\
    \ isn't really the reason modern developers use either of these things—it's the\
    \ readability, inheritance model and maintainability they bring to your codebase.\n\
    \nMore complex problems include [efficiently drawing images using canvas](http://jsperf.com/canvas-drawimage-vs-webgl-drawarrays)^([13](#chapter-7.xhtml_fn7_13))\
    \ and [manipulating pixel data](http://jsperf.com/canvas-pixel-manipulation/30)^([14](#chapter-7.xhtml_fn7_14))\
    \ with or without [typed arrays](http://jsperf.com/typed-arrays-for-pixel-manipulation)^([15](#chapter-7.xhtml_fn7_15))\n\
    \nAlways give micro-benchmarks a close lookover before exploring their use in\
    \ your application. Some of you may recall the [JavaScript templating shoot-off](http://jsperf.com/dom-vs-innerhtml-based-templating/473)^([16](#chapter-7.xhtml_fn7_16))\
    \ and the [extended shoot-off that followed](http://jsperf.com/javascript-templating-shootoff-extended/26)^([17](#chapter-7.xhtml_fn7_17)).\
    \ You want to make sure that tests aren't being impacted by constraints you're\
    \ unlikely to see in real world applications—test optimizations together in actual\
    \ code.\n\n### V8 Optimization Tips\n\nWhilst detailing every V8 optimization\
    \ is outside the scope of this chapter, there are certainly many tips worth noting.\
    \ Keep these in mind and you'll reduce your chances of writing unperformant code.\n\
    \n- Certain patterns will cause V8 to bail out of optimizations. A `try-catch`,\
    \ for example, will cause such a bailout. For more information on what functions\
    \ can and can't be optimized, you can use `--trace-opt file.js` with the `d8`\
    \ shell utility that comes with V8.\n- If you care about speed, try very hard\
    \ to keep your functions monomorphic, i.e make sure that variables (including\
    \ properties, arrays and function parameters) only ever contain objects with the\
    \ same hidden class. For example, don't do this:\n\n```javascript\nfunction add(x,\
    \ y) { \n   return x+y;\n} \n\nadd(1, 2); \nadd('a','b'); \nadd(my_custom_object,\
    \ undefined);\n```\n- Don't load from uninitialized or deleted elements. This\
    \ won't make a difference in output, but it will make things slower.\n- Don't\
    \ write enormous functions, as they are more difficult to optimize\n\nFor more\
    \ tips, watch Daniel Clifford's Google I/O talk [Breaking the JavaScript Speed\
    \ Limit with V8](http://www.youtube.com/watch?v=UJPdhx5zTaw)^([18](#chapter-7.xhtml_fn7_18))\
    \ as it covers these topics well. [Optimizing For V8—A Series](http://floitsch.blogspot.co.uk/2012/03/optimizing-for-v8-introduction.html)^([19](#chapter-7.xhtml_fn7_19))\
    \ is also worth a read.\n\n#### Objects Vs. Arrays: Which Should I Use?\n\n- If\
    \ you want to store a bunch of numbers, or a list of objects of the same type,\
    \ use an array.\n- If what you semantically need is an object with a bunch of\
    \ properties (of varying types), use an object with properties. That's pretty\
    \ efficient in terms of memory, and it's also pretty fast.\n- Integer-indexed\
    \ elements, regardless of whether they're stored in an array or an object, are\
    \ [much faster to iterate over than object properties](http://jsperf.com/performance-of-array-vs-object/3)^([20](#chapter-7.xhtml_fn7_20)).\n\
    - Properties on objects are quite complex: they can be created with setters, and\
    \ with differing enumerability and writability. Items in arrays aren't able to\
    \ be customized as heavily—they either exist or they don't. At an engine level,\
    \ this allows for more optimization in terms of organizing the memory representing\
    \ the structure. This is particularly beneficial when the array contains numbers.\
    \ For example, when you need vectors, don't define a class with properties `x`,\
    \ `y`.\n\nThere's really only one major difference between objects and arrays\
    \ in JavaScript, and that's the arrays' magic `length` property. If you're keeping\
    \ track of this yourself, objects in V8 should be as fast as arrays.\n\n#### Tips\
    \ When Using Objects\n\n- Create objects using a constructor function. This ensures\
    \ that all objects created with it have the same hidden class and helps avoid\
    \ changing these classes. As an added benefit, it's slightly faster than `Object.create()`http://jsperf.com/object-create-vs-constructor-vs-object-literal/7)^([21](#chapter-7.xhtml_fn7_21))\n\
    - There are no restrictions on the number of different object types you can use\
    \ in your application or on their complexity (within reason: long prototype chains\
    \ tend to hurt, and objects with only a handful of properties get a special representation\
    \ that's a bit faster). For “hot” objects, try to keep the prototype chains short\
    \ and the field count low.\n\n### Object Cloning\n\nObject cloning is a common\
    \ problem for app developers. While it's possible to benchmark how various implementations\
    \ work with this type of problem in V8, be very careful when copying anything.\
    \ Copying big things is generally slow—don't do it. `for..in` loops in JavaScript\
    \ are particularly bad for this, as they have a devilish specification and will\
    \ likely never be fast in any engine for arbitrary objects.\n\nWhen you absolutely\
    \ do need to copy objects in a performance-critical code path (and you can't get\
    \ out of this situation), use an array or a custom “copy constructor” function\
    \ which copies each property explicitly. This is probably the fastest way to do\
    \ it:\n\n```javascript\nfunction clone(original) {\n  this.foo = original.foo;\n\
    \  this.bar = original.bar;\n}\nvar copy = new clone(original);\n```\n\n### Cached\
    \ Functions in the Module Pattern\n\nCaching your functions when using the module\
    \ pattern can lead to performance improvements. See below for an example where\
    \ the variation you're used to seeing is slower as it forces new copies of the\
    \ member functions to be created all the time.\n\n![Performance improvements](images/Screen-Shot-2012-11-06-at-10.42.10.png\
    \ \"Performance Improvements When Using The Module And Prototypal Patterns\")\n\
    \n*Performance improvements when using the module or prototypal patterns.*\n\n\
    Here is a [test of prototype versus module pattern performance](http://jsperf.com/prototypal-performance/12)^([22](#chapter-7.xhtml_fn7_22))\n"
  raw: "We might then look to other ways of improving performance. You may have read\
    \ somewhere that using the prototypal pattern is more optimal than the module\
    \ pattern (we confirmed it wasn't earlier), or heard that using JavaScript templating\
    \ frameworks are highly optimized. Sometimes they are, but use them because they\
    \ make for readable code. Also, precompile!. Let's test and find out how true\
    \ this hold in practice.\n\n```\nmoduleG = function () {};\n\nmoduleG.prototype.data\
    \ = dataArray;\nmoduleG.prototype.init = function () {\n    this.addTable();\n\
    \    this.addEvents();\n};\nmoduleG.prototype.addTable = function () {\n    var\
    \ template = _.template($('#template').text());\n    var html = template({'data'\
    \ : this.data});\n    $tbody.append(html);\n};\nmoduleG.prototype.addEvents =\
    \ function () {\n   $('table').on('click', 'td', function () {\n       $(this).toggleClass('active');\n\
    \   });\n};\n\nvar modG = new moduleG();\n```\n\nAs it turns out, in this case\
    \ the performance benefits are negligible. [Opting for templating and prototypes](http://jsperf.com/second-pass)^([12](#chapter-7.xhtml_fn7_12))\
    \ didn't really offer anything more than what we had before. That said, performance\
    \ isn't really the reason modern developers use either of these things—it's the\
    \ readability, inheritance model and maintainability they bring to your codebase.\n\
    \nMore complex problems include [efficiently drawing images using canvas](http://jsperf.com/canvas-drawimage-vs-webgl-drawarrays/6)^([13](#chapter-7.xhtml_fn7_13))\
    \ and [manipulating pixel data](http://jsperf.com/canvas-pixel-manipulation/30)^([14](#chapter-7.xhtml_fn7_14))\
    \ with or without [typed arrays](http://jsperf.com/typed-arrays-for-pixel-manipulation)^([15](#chapter-7.xhtml_fn7_15))\n\
    \nAlways give micro-benchmarks a close lookover before exploring their use in\
    \ your application. Some of you may recall the [JavaScript templating shoot-off](http://jsperf.com/dom-vs-innerhtml-based-templating/473)^([16](#chapter-7.xhtml_fn7_16))\
    \ and the [extended shoot-off that followed](http://jsperf.com/javascript-templating-shootoff-extended/26)^([17](#chapter-7.xhtml_fn7_17)).\
    \ You want to make sure that tests aren't being impacted by constraints you're\
    \ unlikely to see in real world applications—test optimizations together in actual\
    \ code.\n\n### V8 Optimization Tips\n\nWhilst detailing every V8 optimization\
    \ is outside the scope of this chapter, there are certainly many tips worth noting.\
    \ Keep these in mind and you'll reduce your chances of writing unperformant code.\n\
    \n•Certain patterns will cause V8 to bail out of optimizations. A try-catch, for\
    \ example, will cause such a bailout. For more information on what functions can\
    \ and can't be optimized, you can use `--trace-opt file.js` with the d8 shell\
    \ utility that comes with V8.\n\n•If you care about speed, try very hard to keep\
    \ your functions monomorphic, i.e. make sure that variables (including properties,\
    \ arrays and function parameters) only ever contain objects with the same hidden\
    \ class. For example, don't do this:\n\n```\nfunction add(x, y) { \n   return\
    \ x+y;\n} \n\nadd(1, 2); \nadd('a','b'); \nadd(my_custom_object, undefined);\n\
    ```\n\n•Don't load from uninitialized or deleted elements. This won't make a difference\
    \ in output, but it will make things slower.\n\n•Don't write enormous functions,\
    \ as they are more difficult to optimize\n\nFor more tips, watch Daniel Clifford's\
    \ Google I/O talk [Breaking the JavaScript Speed Limit with V8](http://www.youtube.com/watch?v=UJPdhx5zTaw)^([18](#chapter-7.xhtml_fn7_18))\
    \ as it covers these topics well. [Optimizing For V8—A Series](http://floitsch.blogspot.co.uk/2012/03/optimizing-for-v8-introduction.html)^([19](#chapter-7.xhtml_fn7_19))\
    \ is also worth a read.\n\n#### Objects Vs. Arrays: Which Should I Use?\n\n•If\
    \ you want to store a bunch of numbers, or a list of objects of the same type,\
    \ use an array.\n\n•If what you semantically need is an object with a bunch of\
    \ properties (of varying types), use an object with properties. That's pretty\
    \ efficient in terms of memory, and it's also pretty fast.\n\n•Integer-indexed\
    \ elements, regardless of whether they're stored in an array or an object, are\
    \ [much faster to iterate over than object properties](http://jsperf.com/performance-of-array-vs-object/3)^([20](#chapter-7.xhtml_fn7_20)).\n\
    \n•Properties on objects are quite complex: they can be created with setters,\
    \ and with differing enumerability and writability. Items in arrays aren't able\
    \ to be customized as heavily—they either exist or they don't. At an engine level,\
    \ this allows for more optimization in terms of organizing the memory representing\
    \ the structure. This is particularly beneficial when the array contains numbers.\
    \ For example, when you need vectors, don't define a class with properties x,\
    \ y, z; use an array instead..\n\nThere's really only one major difference between\
    \ objects and arrays in JavaScript, and that's the arrays' magic `length` property.\
    \ If you're keeping track of this property yourself, objects in V8 should be just\
    \ as fast as arrays.\n\n#### Tips When Using Objects\n\n•Create objects using\
    \ a constructor function. This ensures that all objects created with it have the\
    \ same hidden class and helps avoid changing these classes. As an added benefit,\
    \ it's also [slightly faster than `Object.create()`](http://jsperf.com/object-create-vs-constructor-vs-object-literal/7)^([21](#chapter-7.xhtml_fn7_21))\n\
    \n•There are no restrictions on the number of different object types you can use\
    \ in your application or on their complexity (within reason: long prototype chains\
    \ tend to hurt, and objects with only a handful of properties get a special representation\
    \ that's a bit faster than bigger objects). For “hot” objects, try to keep the\
    \ prototype chains short and the field count low.\n\n**Object Cloning**\n\nObject\
    \ cloning is a common problem for app developers. While it's possible to benchmark\
    \ how well various implementations work with this type of problem in V8, be very\
    \ careful when copying anything. Copying big things is generally slow—don't do\
    \ it. `for..in` loops in JavaScript are particularly bad for this, as they have\
    \ a devilish specification and will likely never be fast in any engine for arbitrary\
    \ objects.\n\nWhen you absolutely do need to copy objects in a performance-critical\
    \ code path (and you can't get out of this situation), use an array or a custom\
    \ “copy constructor” function which copies each property explicitly. This is probably\
    \ the fastest way to do it:\n\n```\nfunction clone(original) {\n  this.foo = original.foo;\n\
    \  this.bar = original.bar;\n}\nvar copy = new clone(original);\n```\n\n**Cached\
    \ Functions in the Module Pattern**\n\nCaching your functions when using the module\
    \ pattern can lead to performance improvements. See below for an example where\
    \ the variation you're probably used to seeing is slower as it forces new copies\
    \ of the member functions to be created all the time.\n\n![Performance improvements](images/Screen-Shot-2012-11-06-at-10.42.10.png\
    \ \"Performance Improvements When Using The Module And Prototypal Patterns\")\n\
    \n*Performance improvements when using the module or prototypal patterns.*\n\n\
    Here is a [test of prototype versus module pattern performance](http://jsperf.com/prototypal-performance/12)^([22](#chapter-7.xhtml_fn7_22))"
