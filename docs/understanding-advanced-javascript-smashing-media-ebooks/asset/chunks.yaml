    19. [Boomerang 项目](http://github.com/bluesmoon/boomerang/)\n\n# JavaScript 单元测试简介\n\
    \n作者 Jörn Zaefferer\n\n你可能知道测试是好事，但在尝试为客户端代码编写单元测试时，要克服的首要障碍是缺乏真正的单元；JavaScript\
    \ 代码是为网站的每个页面或应用程序的每个模块编写的，并且与后端逻辑及相关的 HTML 紧密混合。在最坏的情况下，代码与 HTML 完全混合，以内联事件处理器的形式存在。\n\
    \n当没有使用某些 DOM 抽象的 JavaScript 库时，通常如此；编写内联事件处理器比使用 `DOM` API 绑定这些事件简单得多。越来越多的开发者开始使用如\
    \ `jQuery` 等库来处理 DOM 抽象，允许他们将这些内联事件移动到独立的脚本中，可以在同一个页面上，甚至是单独的 JavaScript 文件中。然而，将代码放入单独的文件并不意味着它已经准备好作为一个单元进行测试。\n\
    \n到底什么是单元？在理想情况下，它是一个你可以以某种方式处理的纯函数——一个对于给定的输入始终给你相同结果的函数。这使得单元测试变得非常简单，但大多数时候，你需要处理副作用，在这里意味着\
    \ DOM 操作。弄清楚我们可以将代码结构化为哪些单元并据此构建单元测试，仍然是有用的。\n\n### 构建单元测试\n\n考虑到这一点，我们显然可以说，在从零开始某项任务时，从单元测试开始要容易得多。但这并不是本章的主题。本章旨在帮助你解决一个更困难的问题：提取现有代码并测试重要部分，可能发现并修复代码中的错误。\n\
    \n提取代码将其转换为不同形式而不改变其当前行为的过程被称为 `refactoring`（重构）。重构是改进程序代码设计的极方法；因为任何更改实际上都会修改程序的行为，所以当已有单元测试时进行重构是最安全的。\n\
    \n这个“鸡生蛋蛋”的问题意味着，要为现有代码添加测试，你必须承担破坏东西的风险。因此，在你拥有稳固的单元测试覆盖之前，你需要继续手动测试以最小化这种风险。\n\
    \n目前理论应该足够了。让我们来看一个实际示例，测试一些当前与页面混合并连接的 JavaScript 代码。代码寻找带有 `title` 属性的链接，使用这些标题来显示内容发布的时间，这是一个相对时间值，例如“5\
    \ 天前”：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\"\n<title>Mangled examples</title>\n<script>\n\
    function prettyDate(time){\n\tvar date = new Date(time || \"\"),\n\t\tdiff = (new\
    \ Date().getTime() - date.getTime()),\n\t\tday_diff = Math.floor(diff / 86400);\n\
    \n\tif (isNaN(day_diff) || day_diff < 0 || day_diff >= 31) {\n\t\treturn;\n\t\
    }\n\n\treturn day_diff == 0 &&\n\t\t\tdiff < 60 && \"just now\" ||\n\t\t\tdiff\
    \ < 120 && \"1 minute ago\" ||\n\t\t\tdiff < 3600 && Math.floor( diff / 60 ) +\
    \ \" minutes ago\" ||\n\t\t\tdiff < 7200 && \"1 hour ago\" ||\n\t\t\tdiff < 86400\
    \ && Math.floor( diff / 3600 ) + \" hours ago\") ||\n\t\tday_diff == 1 && \"Yesterday\"\
    \ ||\n\t\tday_diff < 7 && day_diff + \" days ago\" ||\n\t\tday_diff < 31 && Math.ceil(\
    \ day_diff / 7 ) + \" weeks ago\";\n}\n\nwindow.onload = function(){\n\tvar links\
    \ = document.getElementsByTagName(\"a\");\n\tfor (var i = 0; i < links.length;\
    \ i++) {\n\t\tif (links[i].title) {\n\t\t\tvar date = prettyDate(links[i].title);\n\
    \t\t\tif (date) {\n\t\t\t\tlinks[i].innerHTML = date;\n\t\t\t}\n\t\t}\n\t}\n</script>\n\
    </head>\n<body>\n\n<ul>\n<li class=\"entry\" id=\"post57\">\n\t<p>blah blah blah…</p>\n\
    \t<small class=\"extra\">\n\t\tPosted <a href=\"/2008/01/blah/57/\" title=\"2008-01-28T20:24:17Z\"\
    >January 28th, 2008</a> by <a href=\"/john/\">John Resig</a>\n\t</small>\n</li>\n\
    \n<ul>\n\n</body>\n</html>\n```\n\n如果你运行那个示例，你会发现一个问题：没有任何日期被替换。不过代码是可以工作的。它遍历页面上所有的锚并检查\
    \ `title` 属性。如果有，将其传递给 `prettyDate` 函数。如果 `prettyDate` 返回结果，就会更新链接的 `innerHTML`。\n\
    \n### 使变得可测试\n\n问题是，对于任何超过 31 天的日期，`prettyDate` 只返回 `undefined`（隐式通过单个 `return`\
    \ 语句），保留了锚点的文本不变。因此，为了看到应该发生什么，我们可以硬编码一个“当前”日期：\n\n```\n<!DOCTYPE html>\n<html>\n\
