    \  -ms-transition: 0.5s;\n  -o-transition: 0.5s;\n  transition: 0.5s;\n}\n```\n\
    \nJavaScript 部分：\n\n```javascript\nvar cb = document.querySelector('input[type=checkbox]');\n\
    cb.addEventListener('click', function(ev) {\n  plot.classList.toggle('smooth');\n\
    }, false);\n```\n\nCSS 与 JavaScript 事件之间的交互一直非常强大，但在较新的浏览器中变得更出色了。正如你可能猜到的，CSS\
    \ 过渡（transitions）和动画（animations）拥有它们自己的事件。\n\n#### 按键按下了多长时间？\n\n正如你之前在可用事件列表中看到的，浏览器也给了我们机会来响应键盘输入，并告诉我们用户何时按下了按键。遗憾的是，在浏览器中正确处理按键很难，正如\
    \ [Jan Wolter 详细解释的那样](http://unixpapa.com/js/key.html)^(20)。然而，作为一个简单的示例，让我们看看如何以毫秒为单位测量用户按钮多长时间。查看[这个\
    \ keytime 演示](http://thewebrocks.com/demos/smashing-events/keytime.html)^(21)\
    \ 示例。按下按键，你会看到输出字段在按键按住期间不断增长。一旦松开按键，你将看到按下按钮的毫秒数。代码一点也不难：\n\n```javascript\n\
    var resources = document.querySelector('#resources'),\n    log = document.querySelector('#log'),\n\
    \    time = 0;\n\ndocument.addEventListener('keydown', keydown, false);\ndocument.addEventListener('keyup',\
    \ keyup, false);\n\nfunction keydown(ev) {\n  if (time === 0) { \n    time = ev.timeStamp;\
    \ \n    log.classList.add('animate');\n  }\n}\nfunction keyup(ev) {\n  if (time\
    \ !== 0) {\n    log.innerHTML = ev.timeStamp - time;\n    time = 0;\n    log.classList.remove('animate');\n\
    \  }\n}\n```\n\n我们定义了想要元素，并将 `time` 设置为 `0`。然后我们对文档（document）应用了两个事件处理器，一个针对 `keydown`，另一个针对\
    \ `keyup`。\n\n在 `keydown` 处理器中，我们检查 `time` 是否为 `0`，如果是，我们将 `time` 设置为事件的 `timeStamp`。我们为输出元素分配一个\
    \ CSS 类，这会启动一个 CSS 动画（具体实现方式请参见 CSS 部分）。\n\n`keyup` 处理器检查 `time` 是否仍为 `0`（因为在按键按住期间\
    \ `keydown` 会被连续触发），如果不是，则计算时间戳之差。我们将 `time` 设回 `0` 并移除该类以停止动画。\n\n#### 使用 CSS\
    \ 过渡（以及动画）工作\n\n[CSS 过渡](https://developer.mozilla.org/en/CSS/CSS_transitions)^(22)\
    \ 会触发一个单一事件，你可以在 JavaScript 中监听该事件，名为 `transitionend`。该事件对象随后有两个属性：`propertyName`（包含发生过渡的属性）和\
    \ `elapsedTime`（告诉你花费了多长时间）。查看[这个演示](http://thewebrocks.com/demos/smashing-events/transition.html)^(23)\
    \ 查看其运行效果。代码非常简单。这里是 CSS：\n\n```css\n.plot {\n  background:rgb(175,50,50);\n \
    \ width: 20px;\n  height: 20px;\n  border-radius: 20px;\n  display: block;\n \
    \ -webkit-transition: 0.5s;\n  -moz-transition: 0.5s;\n  -ms-transition: 0.5s;\n\
    \  -o-transition: 0.5s;\n  transition: 0.5s;\n}\n\n.plot:hover {\n  width: 50px;\n\
    \  height: 50px;\n  border-radius: 100px;\n  background: blue;\n}\n```\n\n以及 JavaScript\
    \ 部分：\n\n```javascript\nplot.addEventListener('transitionend', function(ev) {\n\
    \  log.innerHTML += ev.propertyName + ':' + ev.elapsedTime + 's ';\n}, false);\n\
    ```\n\n然而，这现在只在 Firefox 中有效，因为 Chrome 和 Safari 使用带有厂商前缀的事件。[David Calhoun 的 gist](https://gist.github.com/702)^(24)\
    \ 所示，你需要检测浏览器支持的内容并定义事件名称。[CSS 动画事件](https://developer.mozilla.org/en/CSS/animations)^(25)\
    \ 的工作方式相同，但你有三个事件而不是一个：`animationstart`、`animationend` 和 `animationiteration`。[MDN\
    \ 有一个关于它的演示](https://developer.mozilla.org/samples/css/animations.html)^(26)。\n\
    \n#### 速度、距离和角度\n\n检测事件的发生是一回事。如果你想对它们进行一些美观且吸引人心的操作，你就需要更进一步，并在其中加入一些数学元素。所以，让我们尝试使用几个处理器来计算当用户在屏幕上拖动元素时移动的角度、距离和速度。[先查看此演示。](http://thewebrocks.com/demos/smashing-events/speedangle.html)^(27)\n\
    \n```javascript\nvar plot = document.querySelector('.plot'),\n    log = document.querySelector('output'),\n\
    \    offset = plot.offsetWidth / 2,\n    pressed = false,\n    start = 0, x =\
    \ 0, y = 0, end = 0, ex = 0, ey = 0, mx = 0, my = 0, \n    duration = 0, dist\
    \ = 0, angle = 0;\n\ndocument.addEventListener('mousedown', onmousedown, false);\n\
    document.addEventListener('mouseup', onmouseup, false);\ndocument.addEventListener('mousemove',\
    \ onmousemove, false);\n\nfunction onmousedown(ev) {\n  if (start === 0 && x ===\
    \ 0 && y === 0) {\n    start = ev.timeStamp;\n    x = ev.clientX;\n    y = ev.clientY;\n\
    \    moveplot(x, y);\n    pressed = true;\n  }\n}\nfunction onmouseup(ev) {\n\
    \  end = ev.timeStamp;\n  duration = end - start;\n  ex = ev.clientX;\n  ey =\
    \ ev.clientY;\n  mx = ex - x;\n  my = ey - y;\n  dist = Math.sqrt(mx * mx + my\
    \ * my);\n  start = x = y = 0;\n  pressed = false;\n  angle = Math.atan2( my,\
    \ mx ) * 180 / Math.PI;\n  log.innerHTML = '<strong>' + (dist>>0) +'</strong>\
    \ 像素在 <strong>'+\n                  duration +'</strong> 毫秒内 (<>' +\n        \
    \          twofloat(dist/duration) +'</strong> 像素/毫秒) 角度为 <>' +\n            \
    \      twofloat(angle) + '</</> 度';\n}\nfunction onmousemove (ev) {\n  if (pressed)\
    \ {\n    moveplot(ev.pageX, ev.pageY);\n  }\n}\nfunction twofloat(val) {\n  return\
    \ Math.round((val*100))/100;\n}\nfunction moveplot(x, y) {\n  plot.style.left\
    \ = (x - offset) + 'px';\n  plot.style.top = (y - offset) + 'px';\n}\n```\n\n\
    好了，我承认：这里发生了很多事情。但它并没有看起来那么难。在 `onmousedown` 和 `onmouseup` 中，我们通过 `clientX` 和\
    \ `clientY` 读取鼠标位置，以及事件的 `timeStamp`。鼠标事件带有时间戳可以告诉我们发生的时间。当鼠标移动时，我们做的只是检查鼠标按钮是否按下（通过在\
    \ `mousedown` 处理器中设置布尔值），并用鼠标移动元素。\n\n其余的是几何学——经典的[毕股哥定理](http://en.wikipedia.org/wiki/Pythagorean_theorem)^(28),准确来说。我们通过检查\
    \ `mousedown` 和 `mouseup` 之间时间差内的像素数来获取移动速度。移动的像素数是通过开始和结束时 x 和 y 之差的平方的平方根得到的。我们通过计算三角形的正切来获取角度。所有这些都包含在“[JavaScript\
    \ 动画数学快速探秘](http://coding.smashingmagazine.com/2011/10/04/quick-look-math-animations-javascript/)^(29)”中；或者你可以玩玩下面的\
    \ JSFiddle 示例：\n\n![Demo](http://jsfiddle.net/codepo8/bAwUf/embedded/result,js,html,css)\n\
    \n"
- fmt: '

    Both video and audio fire a lot of events that we can tap into. The most interesting
    are the time events that tell you how long a song or movie has been playing. A
    nice little demo to look at is the [MGM-inspired dinosaur animation](http://hacks.mozilla.org/2012/03/making-the-dino-roar-syncing-audio-and-css-transitions/)
    on MDN; I recorded a [six-minute screencast](http://www.youtube.com/watch?v=aFIJ_ZpV-8Q)
    explaining how it is done.


    If you want to see a demo of all the events in action, the JPlayer team has a
    great [demo page showing media events](http://www.jplayer.org/HTML5.Media.Event.Inspector/).


    ## Input Options


    Traditionally, browsers gave us mouse and keyboard interaction. Nowadays, this
    is not enough because we use hardware that offers more to us. [Device orientation](https://developer.mozilla.org/en/DOM/DeviceOrientationEvent),
    for example, allows you to respond to the tilting of a phone or tablet; [touch
    events](https://developer.mozilla.org/en/DOM/Touch_events) are a big thing on
    mobiles and tablets; [the Gamepad API](http://hacks.mozilla.org/2011/12/paving-the-way-for-open-games-on-the-web-with-the-gamepad-and-mouse-lock-apis/)
    allows us to read out game controllers in browsers; [postMessage](https://developer.mozilla.org/en/DOM/window.postMessage)
    allows us to send messages across domains and browser windows; [pageVisibility](https://developer.mozilla.org/en/DOM/Using_the_Page_Visibility_API)
    allows us to react to users switching to another tab. We can even detect [when
    the history object of the window has been manipulated](https://developer.mozilla.org/en/DOM/window.onpopstate).
    Check the list of events in the `window` object to find some more gems that might
    not be quite ready but should be available soon for us to dig into.


    Whatever comes next in browser support, you can be sure that events will be fired
    and that you will be able to listen to them. The method works and actually rocks.


    ## Go Out And Play


    And that is it. Events are not hard; in most cases, you just need to subscribe
    to them and check what comes back as the event object to see what you can do with
    it. Of course, a lot of browser hacking is still needed at times, but I for one
    find incredible the number of ways we can interact with our users and see what
    they are doing. If you want to get really creative with this, stop thinking about
    the use cases we have now and get down the nitty gritty of what distances, speed
    and input can mean to an interface. If you think about it, playing Angry Birds
    to the largest degree means detecting the start and end of a touch and detecting
    the direction that the bird should take off. So, what is stopping you from creating
    something interactive and cool?


    1. [http://nodejs.org/]

    2. [http://www.onlinetools.org/articles/untrusivejavascript/chapter4.html]

    3. [https://developer.mozilla.org/en/DOM/element.addEventListener]

    4. [http://dev.w3.org/2006/webapi/DOM-Level-3-Events/DOM3-Events.html#eventsTarget-addEventListener]

    5. [https://www.wealthfront.com/designerwanted]

    6. [http://2011.beercamp.com/]

    7. [http://eng.wealthfront.com/2012/03/scrolling-z-axis-with-css-3d-transforms.html]

    8. [http://hakim.se/scroll-effects/]

    9. [http://joelb.me/scrollpath/]

    10. [http://www.w3.org/TR/DOM-Level-Events/#event-flow]

    11. [http://dev.opera.com/articles/event-capture-explained/]

    12. [http://thewebrocks.com/demos/smashing-events/eventproperties.html]

    13. [https://developer.mozilla.org/en/DOM/event#Properties]

    14. [http://www.w3.org/TR/selectors-api/]

    15. [https://developer.mozilla.org/En/Code_snippets/QuerySelector]

    16. [http://thewebrocks.com/demos/smashing-events/preventdefault.html]

    17. [http://thewebrocks.com/demos/smashing-events/eventdelegation.html]

    18. [https://developer.mozilla.org/en/DOM/event.pageX]

    19. [http://thewebrocks.com/demos/smashing-events/mouseposition.html]

    20. [http://unixpapa.com/js/key.html]

    21. [http://thewebrocks.com/demos/smashing-events/keytime.html]

    22. [https://developer.mozilla.org/en/CSS/CSS_transitions]

    23. [http://thewebrocks.com/demos/smashing-events/transitionevent.html]

    24. [https://gist.github.com/702866]

