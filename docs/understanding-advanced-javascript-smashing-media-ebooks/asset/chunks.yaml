  trans: "\n\n颜色分类器中的每个点都采用[十六进制格式](http://en.wikipedia.org/wiki/Hexadecimal)^(10)的背景颜色值，例如\
    \ `#86F01B` 或 `#2456FE`。这些值代表颜色的红、绿、蓝值。例如，\n\n![Blue dot](img/bluedot.png \"Blue\
    \ dot\")\n\n其背景颜色为 `#2456FE`，这意味着红色值为 36，绿色值为 86，蓝色值为 254。每个值都必须在 0 到 255 之间。\n\
    \n`decimalToHex` 函数将这些 [RGB](http://en.wikipedia.org/wiki/Rgb)^(11) 颜色转换为我们页面上使用的十六进制颜色。\n\
    \n这个函数非常简单，但我在里面留了一个 `console.log` 消息，那只是一些我们可以删除的调试代码。\n\n`decimalToHex` 函数还会在数字开头添加填充字符。这非常重要，因为某些十进制数字会产生单个十六进制数字；十进制的\
    \ 12 在十六进制中是 C，但 CSS 要求两位。我们可以通过让它变得不那么通用来提高转换速度。我知道需要填充的数字每个都是一位，所以我们可以这样重写该函数：\n\
    \n```\nfunction decimalToHex(d) {\n    var hex = Number(d).toString(16);\n   \
    \ return hex.length === 1 ? '0' + hex : hex; }\n```\n\n颜色分类器的[第三版本](http://zgrossbart.github.com/jsprofarticle/index3.htm)^(12)\
    \ 仅在需要填充时才更改字符串，而不需要调用 `substr`。有了这个新函数，我们的运行时间为 137 毫秒。通过再次对代码进行分析，我看到 `decimalToHex`\
    \ 函数现在仅占总时间的 0.04%——已经排到了列表的末尾。\n\n![The third profile](img/profile3.png \"The\
    \ third profile\")\n\n我们还可以看到使用 CPU 最多的函数是 jQuery 中的 `e.extend.merge`。我不确定那个函数是做什么的，因为代码被压缩了。我可以添加\
    \ jQuery 的开发版本，但我可以看到该函数是从 `makeColorSorter` 中调用的，所以下次让它也变快。\n\n### 减少内容变化\n\n\
    颜色分类器中的彩虹色是由正弦波生成的。代码查看光谱中的中心点，并在指定的宽度内通过该中心点创建一个波。这把颜色变成了彩虹图案。我们还可以通过改变红、绿、蓝的频率来改变彩虹的颜色。\n\
    \n```\nfunction makeColorSorter(frequency1, frequency2, frequency3,\n  phase1,\
    \ phase2, phase3,\n  center, width, len) {\n\n    for (var i = 0; i < len; ++i)\n\
    \    {\n       var red = Math.floor(Math.sin(frequency1 * i + phase1) * width\
    \ + center);\n       var green = Math.floor(Math.sin(frequency2 * i + phase2)\
    \ * width + center);\n       var blue = Math.floor(Math.sin(frequency3 * i + phase3)\
    \ * width + center);\n\n       console.log('red: ' + decimalToHex(red));\n   \
    \    console.log('green: ' + decimalToHex(green));\n       console.log('blue:\
    \ ' + decimalToHex(blue));\n\n       var div = $('<div class=\"colorBlock\"></div>');\n\
    \       div.css('background-color', '#' + decimalToHex(red) + decimalToHex(green)\
    \ + decimalToHex(blue));\n       $('#colors').append(div);\n\n    }\n}\n```\n\n\
    我们可以移除更多的 `console.log` 函数。这些调用特别糟糕，因为每个调用都会同时调用一次 `decimalToHex` 函数，这意味着 `decimalToHex`\
    \ 被调用的频率比应该的高出了一倍。\n\n这个函数频繁地更改 DOM。每次循环运行时，它都会向 `colors` div 标签添加一个新的 `div`。这让我怀疑\
    \ `e.extend.merge` 函数是否也是在这么操作。性能分析器让我们通过一个简单的实验就能判断出来。\n\n与其每次循环运行时都添加一个新的 `div`，我想一次性添加所有的\
    \ `div` 标签。让我们创建一个变量来保存它们，然后在最后一次性添加。\n\n```\nfunction makeColorSorter(frequency1,\
    \ frequency2, frequency3,\n  phase1, phase2, phase3,\n  center, width, len) {\n\
    \n    var colors = \"\";\n    for (var i = 0; i < len; ++i)\n    {\n       var\
    \ red = Math.floor(Math.sin(frequency1 * i + phase1) * width + center);\n    \
    \   var green = Math.floor(Math.sin(frequency2 * i + phase2) * width + center);\n\
    \       var blue = Math.floor(Math.sin(frequency3 * i + phase3) * width + center);\n\
    \n       colors += '<div class=\"colorBlock\" style=\"background-color: #' +\n\
    \           decimalToHex(red) + decimalToHex(green) + decimalToHex(blue) + '\"\
    ></div>';\n    }\n\n    $('#colors').append(colors);\n}\n```\n注：由于原文提供的第二个代码块中存在括号闭合错误（提前闭合），在翻译时保持了逻辑结构并修正了格式以确保可读性。\n\
    \n[第五个版本](http://zgrossbart.github.com/jsprofarticle/index5.htm)^(14) 运行时间为 26\
    \ 毫秒，使用了 18 行代码。\n\n### 应用中的 JavaScript 性能分析\n\n真实的应用程序比这个分类器复杂得多，但对它们进行分析遵循相同的步骤：\n\
    \n- **建立基准**，以便知道从哪里开始。\n- **隔离问题**，使其与其他运行的代码隔离开。\n- **提高速度**，在受控的环境中进行。\n\n\
    在优化时，还有一些规则需要遵守：\n\n- **从最慢的部分开始**，这样可以在投入的时间内获得最大的改进。\n- **控制环境**。如果你更换了计算机或进行了任何重大更改，请运行新的基准。\n\
    - **重复分析**，以防止计算机上的异常影响结果。\n\n每个人都希望自己的网站运行更快。你必须开发新功能，但新功能通常会让网站运行变慢。因此，投入时间优化性能是有回报的。\n\
    \n性能分析和优化让[最终的颜色分类器](http://zgrossbart.github.com/jsprofarticle/index6.htm)^(15)\
    \ 的运行时间缩短了 92% 以上。你的网站可以变快多少？\n\n"
