  raw: "> I spent almost a year trying to solve that very problem, but eventually\
    \ I came to the realization that shoehorning it into MV* was not a viable solution.\
    \ I was dealing with an “amorphous model” and that's where it all fell apart.\
    \ In other words, if you don't have a well-defined model, most modern JavaScript\
    \ frameworks can't help you.\n\n> \n\n> That's where [Core J2EE Patterns](http://java.sun.com/blueprints/corej2eepatterns/Patterns/)^([71](#chapter-4.xhtml_fn4_71))\
    \ come in. I got turned on to them while read­ing [PHP Objects, Patterns, and\
    \ Practice](http://www.amazon.com/Objects-Patterns-Practice-Matt-Zandstra/dp/1590599098)^([72](#chapter-4.xhtml_fn4_72))\
    \ by Matt Zand­stra, and I'm glad I did! The J2EE Patterns basically outline a\
    \ request-driven process, where the URL drives the behavior of the application.\
    \ In a nutshell, a request is created, modified, and then used to determine the\
    \ view to render.\n\n> \n\n> I've expanded on my experiences with [request driven\
    \ Javascript applications and J2EE patterns](http://dblogit.com/archives/3895)^([73](#chapter-4.xhtml_fn4_73))\
    \ for anyone who would like to learn more. ”\n\n> \n\n> *— Dustin Boston, co-author,\
    \ Aura*\n\n### Conclusions\n\nWhile there are several choices for what to use\
    \ for structuring your JavaScript Web applications these days, it's important\
    \ to be **diligent** in the selection process – spend time thoroughly evaluating\
    \ your options in order to make a decision which results in sustainable, **maintainable**\
    \ code. Framework diversity fosters innovation, while too much similarity just\
    \ creates noise.\n\nProjects like TodoMVC can help narrow down your selections\
    \ to those you feel might be the most interesting or most comfortable for a particular\
    \ project. Remember to take your time choosing, don't feel too constrained by\
    \ using a specific pattern and keep in mind that it's completely acceptable to\
    \ build on the solution you select to best fit the needs of your application.\n\
    \nExperimenting with different frameworks will also give you different views on\
    \ how to solve common problems which will in turn make you a better programmer.\n\
    \n*Thanks to my fellow TodoMVC team-member [Sindre Sorhus](http://sindresorhus.com/)^([74](#chapter-4.xhtml_fn4_74))\
