  trans: '


    ### Backbone


    **缺点：** 我不喜欢 `extend` 方法的工作方式——它将父对象的内容拷贝到新对象中。原型继承才是万岁（FTW）。有时我觉得文档示例中缺少真实世界的应用场景。此外，在读完
    TODO 教程后，还需要大量的研究来确定如何构建更大的应用。


    我发现来自 DocumentCloud 的项目中缺少了官方的 AMD 支持（BB, _）。[注意：这在 `RequireJS 2.0` 的新的 `RequireJS
    shim()` 方法中不应该是一个问题]。


    **优点：** 在最初经历了理解 Backbone 运行机制的大脑风暴后，它是非常有用的。有用体现在：支持良好、轻量级，并且在合理的范围内不断更新。它与天然的朋友
    Underscore、`jQuery/Zepto` 结合，这些都是我工作室大多数项目都会使用的工具。


    **缺点：** 关于如何使用 Backbone 的教程数量极不均衡，且分布在 Backbone 生命周期的不同时期。我曾让其他开发者看看 Backbone，他们写的竟然是
    `v0.3` 版本的代码。完全不顾现状。虽然这不是 Backbone 自身可以解决的问题，但这无疑是与该框架相关的重大槽点。


    我假设在理论上你可以将其应用于任何地方，但在我看来，Backbone 是反复出现的。见鬼，我甚至看到几个月前的文章在使用古老的 Backbone 方法和模式。


    我对框架本身存在的任何不满，已经通过社区合理的黑客手段和方法得到了纠正。对我来说，这就是 Backbone 这么棒的原因——有社区的支持。


    **优点：** 提供了恰到好处的抽象且没有偏见——允许你根据项目需求对其进行定制。


    **缺点：** 我会重写（可能删除）`Backbone.sync`。它内置了典型的客户端发起的 HTTP 通信假设，不能很好地适应 `WebSockets`
    的推送特性。


    **优点：** 它非常容易上手，为基于 MV* 的框架提供了一个很好的入口。它具有很强的定制性，而且还有很多人在使用它，使得寻找帮助或支持变得容易。


    **缺点：** 事实是默认没有视图绑定（尽管你可以修复这一点）。当单个属性变化时重新渲染整个视图是浪费的。


    RESTful API 有很多优点，但缺乏批量保存功能（诚然这是 REST 本身的问题，但仍然如此），以及在不同操作上让不同的 URI 方案正常运行的困难非常糟糕。


    ### AngularJS


    **优点：**


    a) 双向数据绑定非常强大。你倾向于更多地考虑模型及其所处的状态，而不是一系列需要发生的事件。模型是单一真理源。


    b) 性能。`AngularJS` 下载包很小。它的模板使用 DOM 节点而不是将字符串转换为 DOM 节点，性能应该更好。


    c) 如果你针对的是现代浏览器并且/或者稍微小心，你也可以从依赖中剔除 `jQuery`。


    **缺点：** 我希望能够为从模型变化传播出来的 UI 状态更改指定过渡。特别是对于使用 `ng-show` 或 `ng-hide` 的元素，我希望以一种简单的声明式方式使用淡入或滑入效果。


    **优点：** 它非常直观，拥有优秀的文档。我喜欢他们的数据绑定方法、基于 HTML 的视图以及嵌套作用。我从 `Backbone/Thorax` 切换到
    `Angular` 后再也没有回头过。一个新的 Chrome 扩展程序 `Batarang` 与 Chrome 开发者工具集成，并提供了对 `Angular`
    数据结构的实时访问。


    **缺点：** 我希望内置支持如 `drag''n''drop` 之类的功能，不过可以使用 GitHub 上的外部组件来添加。我也希望看到更多可复用的第三方组件。我认为
    `AngularJS` 生态系统变得更加成熟只是时间问题，那时这些组件就会像 `jQuery` 社区中一样随处可用。


    **优点：** 它极大地减少了样板代码，允许通过组件进行良好的代码复用，扩展了 HTML 语法，使得许多复杂功能最终变得像在 HTML 中应用一个指令（属性）一样简单，并且由于对依赖注入的完全投入，它非常容易测试。


    你可以不使用 `jQuery` 或不直接操作 `DOM` 来编写一个复杂的应用程序。这确实是一个了不起。


    **缺点：** 它的学习曲线比 `Backbone`（后者很容易掌握）稍微陡一些，但收益是值得的。文档可以更好。


    ### KnockoutJS


    **优点：** 我并不一定总是使用它，但 `KnockoutJS` 对于单页应用来说太棒了。订阅实时排序非常容易；使用可观察数组，为 Backbone 中所谓的“集合视图”提供了好得多的
    API。以及在可观察对象上使用自定义事件来实现效果等。


    **缺点：** 感觉 `API` 很难扩展，在较大的应用中可能更倾向于折腾 `Backbone`。（但这部分也是由于社区支持的原因）。


    **优点：** 我喜欢数据绑定机制，并觉得使用它非常舒服。我特别喜欢他们如何用控制流绑定替换模板。


    **缺点：** 我不喜欢在应用结构方面没有指导或最佳实践。除了有一个视图模型之外，框架并没有帮助你定义一个结构良好的视图模型。很容易导致产生巨大且不可维护的函数。


    ### Dojo


    **优点：** 从语法上说，`Dojo` 非常简单。它允许动态且健壮的构建，在某些情况下初始加载文件仅为 6k。它兼容 AMD，使其极具可移植性，并且箱箱提供了大量功能，从基础的
    DOM 交互到复杂的 SVG、VML 和 canvas 功能。小部件系统 `Dijit` 在易用性和扩展性方面是无与伦比的。这是一个非常完备且完整的工具包。


    **缺点：** `dojo/_base/declare` 功能并非 100% 遵循严格模式，目前由于向下兼容性存在一些开销，尽管这会在 `Dojo 2.0`
    发布时大部分消失。


    **优点：** 良好的组件：标签页、数据网、表单管理器——跨浏览器渲染相同。兼容 AMD。易于使用 mock 进行测试。与其他框架集成得良好，感谢 AMD。


    **缺点：** 组件的默认设计已过时。不完全支持 HTML5。文档平平。模板系统很糟糕（无自动绑定）。


    ### YUI


    **优点：** `YUI3` 是一个模块化且随用随用的组件库，包含了 Backbone 的所有优点以及更多。它甚至（在我看来）通过解耦某些内容改进了 Backbone
    的某些概念（例如，属性是一个独立的模块，可以混合到任何对象中——事件模块也可以类似地混合）。


    **缺点：** 我希望看到 `YUI3` 支持 `Ember` 的某些自动装配（可选）。我认为这是 `Ember` 的真正胜利；否则，我将 `YUI3` 视为一个可以挑选所需内容的卓越组件库。我也希望看到更兼容
    AMD 的模块加载器。现在的加载器工作得很好；但如果我能基于 AMD 模块启动新项目，并引入特定的 `YUI3` 组件以及其他地方的其他东西，就更完美了。


    ### JavascriptMVC


    **优点：** 包含了所有工具，只需运行命令并开始构建。我已经使用了六个月了，它一直非常好。


    **缺点：** 我唯一会做的是加速下一个版本的开发。开发者们意识到了问题并正在修复，可能还需要三个月四个月，我想要修复的问题才能解决，但那时我可能可以提交补丁并进行拉取请求。


    ### Maria


    **优点：** 因为 `Maria` 是一个纯粹的 MVC 框架，专注于仅仅做一个 MVC 框架。不多也不少。它简洁简单。


    '
- fmt: '

    **Cons:** A little more usage documentation outside of the source code, plus a
    few more test cases. A tutorial that drives home the real use of MVC with Maria
    would be good too.


    ### Cujo.js


    **Pros:** Real apps almost never fit perfectly into an `MV*` box, and the most
    important stuff is often outside the box. With `cucho.js`, you define the box.


    Yes, `cucho.js` has high-level `MV*`-like features for creating views, models,
    controllers, etc., but every app is different, and no framework can ever be a
    100% solution. Rather than try to be all things, `cucho.js` also provides lower
    level tools, architectural plumbing, and a rich plugin system that can even be
    used to integrate and extend other `MV*` frameworks.


    Create the architecture that best suits your application, rather than constraining
    your app to fit inside someone else''s predefined architecture.


    **Cons:** The broader JavaScript community is totally unprepared and untrained
    to take on large-scale applications. Most of us dont even know that design patterns
    and architectural patterns exist.


    Since `cucho.js` is so different from other frameworks, it needs more than a simple
    API reference and code snippets. Without tutorials, educational materials, and
    step-by-step examples, `cucho.js` might look strange and overwhelming to the untrained
    eye but documentation is supposed to be coming soon.


    ### ExtJS


    **Pros:** I think `ExtJS` works best in combination with `Ext Designer`. It gives
    it an edge beyond the other GUI frameworks by letting non-programmers mock up
    the UI so programmers can fill in the blanks. I think comparing it to MVC frameworks
    like `Backbone` doesnt not do it justice – its strength lies in creating rich
    GUIs, not lean Web apps.


    For rich, commercial back-office applications I think `ExtJS` remains the best
    choice when it comes to JavaScript solutions (i.e not `GWT` etc). For public-facing
    Web apps I''d rather have something that gives me more control over the markup
    (and ideally something that degrades gracefully).


    **Cons:** It has a steeper learning curve than many of the other modern structural
    frameworks. One can argue that if you''re investing in `ExtJS` for the long-term
    this time spent learning will pay off, however I think solutions like it should
    aim to better minimize the time it takes to train teams up in using it.


    **Pros:** I think a big feature of `ExtJS 4` is that it throws you into the MVC
    mindset and the preferred filesystem structure right from the bat. With `Dojo`
    the initial tutorials seem to be mostly about augmenting existing websites whereas
    `ExtJS` assumes you''re starting from scratch.


    Using `ExtJS` doesnt really “feel” like you''re dealing with HTML at all. The
    component library is rich enough to let you go a long way without touching more
    HTML than what is needed to bootstrap your app.


    It''d be interesting to see how both compare when Web components become more widely
    supported. This would finally allow manipulating the `DOM` without being afraid
    of breaking any widgets or causing your app''s internal state to become inconsistent.


    **Cons:** The licensing is considered restrictive and difficult to understand
    by some. More people would be investing in `ExtJS` if it was clearer what the
    upfront and long-term costs of using it are. This isnt not a concern with some
    other structural solutions but probably isnt''t as much a worry for larger businesses.


    **Pros:** `ExtJS` is a fantastic package for rapidly building out RIAs for internal
    use. I for one, love to build with HTML and JavaScript, and for me there''s great
    satisfaction in mucking around at that level. Even though `ExtJS` makes it feel
    like you''re not really working with HTML it still offers a great deal of power,
    especially if you''re using it to create a complex UI.


    **Cons:** That said…I absolutely agree that it''s very heavy and I dont think
    I''d recommend it for an external facing Web application. My biggest beef with
    the package overall is actually that it''s more of a PITA to test with than I''d
    would like. Our tester actually ended up switching to `Sikuli` because it was
    becoming too much of a battle trying to work with it in `Selenium`.


    ### Batman


    **Pros:** It has a great and easy to use view bindings system. Plays with `Rails`
    very nicely and is all about convention over configuration.


    **Cons:** The documentation could be a lot better and I feel `Shopify` wont''
    be adding the features that they say that they will.


    ### Don''t Be Afraid To Experiment


    Whilst it''s unlikely for a developer to need to learn how to use more than a
    handfull of these frameworks, I do encourage exploration of those you''re unfamiliar
    with. There''s more than mountain of interesting facts and techniques that can
    be learned in this process.


    In my case: I discovered that `Batman.js` required the least hand-written lines
    of code for an implementation. I''m neither a frequent `CoffeeScript` nor `Batman.js`
    user but that in itself gave me some food for thought. Perhaps I could take some
    of what made this possible and bring it over to the frameworks I do use. Or, maybe,
    I''d simply use `Batman.js` in a future project if I found the community and support
    around it improved over time.


    Regardless of whether you end up using a different solution, at the end of the
    day all you have to gain from exploration is more knowledge about what''s out
    there.


    ### Going Beyond MV* Frameworks


    Whilst the `MV*` family of patterns are quite popular for structuring applications,
    they''re limited in that they dont not address any kind of application layer,
    communication between Views, services that perform work or anything else. Developers
    may thus find that they sometimes need to explore beyond just MVC—there are times
    when you absolutely need to take what they have to offer further.


    We reached out to developers that have been taking MVC further with their own
    patterns or extensions for existing frameworks to get some insights on where you
    need something more.

    '
