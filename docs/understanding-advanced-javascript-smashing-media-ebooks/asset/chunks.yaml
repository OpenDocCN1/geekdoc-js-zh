  trans: "\n\n73. [`dblogit.com/archives/3895`](http://dblogit.com/archives/3895)\n\
    \n74. [`sindresorhus.com/`](http://sindresorhus.com/)\n\n# JavaScript 事件与用户响应\n\
    \n：Christian Heilmann\n\n每当人们问我 JavaScript 和 DOM 中最强大的功能时，我很快就会联想到事件。这是因为浏览器中的事件极其有用。此外，将功能与事件解耦是一个强大的思想，这也就是为什么\
    \ [Node.js](http://nodejs.org/)^(1) 成为如此热门的话题的原因。\n\n今天，让我们回到事件的基础，让你进入开始玩转它们的状态，而不仅仅是给所有元素都加上点击处理器，或者使用\
    \ `<a href=\"javascript:void(0)\">` 链接破坏 Web，又用 `onclick=\"foo()\"` 内联处理器弄乱我们的\
    \ HTML（我在 2005 年曾详细解释过[**为什么这些是糟糕的主意**](http://www.onlinetools.org/articles/unobtrusivejavascript/chapter4.html)^(2)）。\n\
    \n注意：本章节使用原生 JavaScript，不使用任何库。我们在这里讨论的很多内容在 jQuery、YUI 或 Dojo 中更容易实现，但理解基础是非常重要的，因为你会发现自己处于一种无法使用库但仍需提供出色解决方案的境地。\n\
    \n**免责声明**：我们在这里使用的事件语法是 [`addEventListener()`](https://developer.mozilla.org/en/DOM/element.addEventListener)^(3)，定义在“[DOM\
    \ Level 3 Events](http://dev.w3.org/2006/webapi/DOM-Level-3-Events/html/DOM3-Events.html#events-EventTarget-addEventListener)^(4)”规范中，它适用于目前使用的的所有浏览器，Internet\
    \ Explorer 9 以下版本除外。不过，我们将展示的许多内容可以通过 jQuery 实现，它也支持旧版浏览器。想起来，在 `DOMContentLoaded`\
    \ 上使用一个简单的 `addEventListener()` 是确保你的脚本不在旧版浏览器上运行的极佳方法。这是一件好事。如果我们想让 Web 演进，我们需要停止向旧浏览器提供复杂且要求刻的代码。如果你以正确的方式构建解决方案，那么\
    \ IE 6 就不需要任何 JavaScript 来显示一个可行的（尽管更简单的）解决方案。把你的产品想象成电扶梯：如果你的 JavaScript 没有执行，网站仍然应该作为楼梯使用。\n\
    \n在我们进入事件细节以及如何使用它们之前，请查看几个巧妙利用滚动事件来实现非常出色的效果的演示：\n\n•在寻找设计师时，Wealthfront Engineering\
    \ 使用了[沿 Z 轴滚动并移动内容](https://www.wealthfront.com/designerwanted)^(5)。这是 [Beercamp\
    \ 2011 网站](http://2011.beercamp.com/)^(6) 的重要部分。Wealthfront [详细记录了博客](http://eng.wealthfront.com/)^(5)。\n\
    \n•在 `DOMContentLoaded` 上使用一个简单的 `addEventListener()` 是确保你的脚本不在旧版浏览器上运行的极佳方法。\n\
    \n•[滚动路径](http://joim.se/scroll/)^(9) 就是我们得到的结果。\n\n•[jQuery](http://www.jquery.com/)^(2)\
    \ 处理了大部分此类。\n\n### 基础：什么是事件？\n\n你可以为同一个事件分配多个事件处理器，也可以为多个事件分配同一个处理器（如此演示所示）。\n\
    \n`ev` 是我们从事件中获取的对象。而且（再次，在我的情况下，在 Firefox 中）它包含许多有趣的内容：\n\n```javascript\nvar\
    \ log = document.getElementById('log'),\n    out = '';\n```\n\n例如：\n\n```javascript\n\
    var i, log = document.getElementById('log'),\n    out = [];\nfor (i in window)\
    \ {\n  if (on/.test(i)) { out.length = i; }\n}\n```\n\n将 `useCapture` 设置为 `false`\
    \ 意味着我们捕获事件冒泡，而不是捕获阶段。这是一个[长期而艰巨的话题](http://www.w3.org/TR/DOM-Level-Events/#event-flow)^(10)。我们只需说通过将\
    \ `useCapture` 设置为 `false`，在 99.7434% 的情况下你没问题（这是一个粗略的估算）。该参数在 Opera 之外的所有浏览器中都是可选的。\n\
    \n现在，事件处理器函数从事件获取一个对象作为参数，这个对象充满了我们可以操作的棒属性。如果你[尝试我的示例](http://thewebrocks.com/demos/smashing-events/eventproperties.html)^(12)，你将看到以下代码的作用：\n\
    \n```javascript\nvar log = document.getElementById('log'),\n    out = '';\n\n\
    document.addEventListener('click', logeventinfo, false);\ndocument.addEventListener('keypress',\
    \ logeventinfo, false);\n\nfunction logeventinfo (ev) {\n  log.innerHTML = '';\n\
    \  out = '<ul>';\n  for (var i in ev) {\n    if (typeof ev[i] === 'function' ||\
    \ i === i.toUpperCase()) {\n      continue;\n    }\n    out += '<li><span>'+i+'</span>:\
    \ '+ev[i]+'</li>';\n  }\n  log.innerHTML += out + '</ul>';\n}\n```\n\n"
