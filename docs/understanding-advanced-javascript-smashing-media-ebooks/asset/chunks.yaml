  trans: '


    视频和音频都会触发许多我们可以利用的事件。其中最有趣的是时间事件，它们可以告诉你歌曲或电影已经播放了多久。MDN 上那个[受 MGM 灵感的恐龙动画](http://hacks.mozilla.org/2012/03/making-the-dino-roar-syncing-audio-and-css-transitions/)
    是一个非常棒的小型演示；我录制了一个[六分钟的录屏视频](http://www.youtube.com/watch?v=aFIJ_ZpV-8Q) 来解释它是如何实现的。


    如果你想看到所有事件运行的演示，JPlayer 团队提供了一个非常棒的[显示媒体事件演示页面](http://www.jplayer.org/HTML5.Media.Event.Inspector/)。


    ## 输入选项


    传统上，浏览器为我们提供鼠标和键盘交互。如今，这已经不够了，因为我们使用的硬件能提供更多功能。例如，[设备方向](https://developer.mozilla.org/en/DOM/DeviceOrientationEvent)允许你响应手机或平板电脑的倾斜；[触摸事件](https://developer.mozilla.org/en/DOM/Touch_events)在移动设备和平电脑上非常重要；[Gamepad
    API](http://hacks.mozilla.org/2011/12/paving-the-way-for-open-games-on-the-web-with-the-gamepad-and-mouse-lock-apis/)允许我们在浏览器中读取游戏控制器；[postMessage](https://developer.mozilla.org/en/DOM/window.postMessage)允许我们跨域和跨浏览器窗口发送消息；[页面可见性](https://developer.mozilla.org/en/DOM/Using_the_Page_Visibility_API)允许我们对用户切换到另一个标签页时做出反应。我们甚至可以检测[窗口的历史对象何时被操作过](https://developer.mozilla.org/en/DOM/window.onpopstate)。检查
    `window` 对象中的事件列表，可以发现更多可能尚未完全就绪、但很快就能供我们挖掘的“宝藏”。


    无论浏览器后续支持什么新功能，你都可以确定事件将会被触发，并且你将能够监听它们。这种方法切实有效，而且非常酷。


    ## 出去实践吧


    就是这些。事件并不难；在大多数情况下，你只需要订阅它们，并检查返回的事件对象以看看你可以用它做什么。当然，有时仍然需要大量的浏览器“黑客技巧（hacking）”，但我个人认为，我们与用户交互以及观察他们在做什么的方式多到令人难以置信。如果你如果你想在这方面真正发挥创意，请停止考虑我们现在的用例，去深入研究距离、速度和输入对界面意味着什么。如果你仔细想想，从最大程度上玩《愤怒的小鸟》意味着检测触摸的开始和结束，并检测小鸟起飞的方向。所以，还有什么在阻碍你创造一些互动又酷的东西呢？


