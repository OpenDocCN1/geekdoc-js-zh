    As you can see, whilst these applications are functionally equivalent to something
    you might write with an MVC framework, there''s no separation of concerns and
    the code becomes harder to read and maintain as the codebase grows.


    We feel honored that over the past year, some framework authors have involved
    us in discussions about how to improve their solutions, helping bring our experience
    with a multitude of solutions to the table. We''ve also slowly moved towards TodoMVC
