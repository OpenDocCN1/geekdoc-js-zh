    Remember to care about optimization, but stop short of opting for micro-optimization
    at the cost of convenience. For example, some developers opt for `.forEach` and
    `Object.keys` over `for` and `for in` loops, even though they''re slower, for
    the convenience of being able to scope. Do make sanity calls on what optimizations
    your application absolutely needs and which ones it could live without.


    Also, be aware that although JavaScript engines continue to get faster, the next
    real bottleneck is the DOM. Reflows and repaints are just as important to minimize,
    so remember to only touch the DOM if it''s absolutely required. And do care about
    networking. HTTP requests are precious, especially on mobile, and you should be
    using HTTP caching to reduce the size of assets.


    Keeping all of these in mind will ensure that you get the most out of the information
    from this post. I hope you found it helpful!'
