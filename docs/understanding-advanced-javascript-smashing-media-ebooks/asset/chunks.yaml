  trans: '

    性能分析始于获取代码当前性能的基准，这可以通过 `Timeline`（时间线）发现。它会告诉我们代码运行了多长时间。`Profiles`（配置文件）标签页则让我们更好地了解应用程序正在发生的情况。`JavaScript`
    CPU 配置文件显示了我们的代码消耗了多少 CPU 时间，`CSS` 选择器配置文件显示了处理选择器花费了多少时间，而 `Heap`（堆）快照则显示了对象占用了多少内存。


    通过这些工具，我们可以进行隔离、调整和重新性能分析，以评估我们对特定函数或操作的修改是否改进了性能。


    ![配置文件标签页提供了有关你代码性能的信息。](img/profiling2.jpg "The Profile Tab Gives Information
    About Your Code''s Performance")


    *Profile 标签页为你提供了有关代码性能的信息。*


    要深入介绍性能分析，请阅读 Zack Grossbart 编写的[使用 Chrome 开发者工具进行 JavaScript 性能分析](http://coding.smashingmagazine.com/2012/06/12/javascript-profiling-chrome-developer-tools/)^(34)。


    提示：理想情况下，你希望确保性能分析不受已安装扩展或应用程序的影响，因此请使用 `--user-data-dir <empty_directory>` 标志运行
    Chrome。大多数情况下，这种优化测试方法足够了，但有时你可能更多。这时 `V8` 就可以派上用场。


    ## 避免内存泄漏——发现泄漏的三种快照技术


    在 Google 内部，`Gmail` 等团队大量地使用 `Chrome Developer Tools` 来帮助我们发现并消除内存泄漏。


    ![Chrome 开发者工具中的内存统计。](img/devtools.jpg "Memory Statistics In Chrome Developer
    Tools")


    *Chrome 开发者工具中的内存统计。*


    我们团队关注的一些内存统计包括私有内存使用、`JavaScript` 堆大小、`DOM` 节点计数、存储清理、事件监听器计数以及垃圾回收的情况。对于熟悉事件驱动架构的人来说，你可能会感兴趣：我们以前遇到的最常见问题之一是只有
    `listen()` 而没有对应的 `unlisten()`（闭包），以及创建事件监听器的对象缺少了 `dispose()`。


    幸运的是，`DevTools` 可以帮助定位其中的一些问题，Loreena Lee 有一个非常精彩的演示，记录了在 `DevTools` 中寻找泄漏的[“三快照技术](https://docs.google.com/presentation/d/1wUVmf78gG-ra5aOxvTfYdiLkdGaR9OhXRnOlIcEmu2s/pub?start=false&loop=false&delayms=3000#slide=id.g1d65bdf6_0_0)^(35)，我强烈推荐大家反复阅读。


    该技术的核心思想是：记录应用程序中的一系列操作，强制进行垃圾回收，检查 `DOM` 节点数量是否没有回到预期的基准，然后分析三个堆快照以确定是否存在泄漏。


    ## 单页应用中的内存管理


    在编写现代单页应用（例如 `AngularJS`、`Backbone`、`Ember`）时，内存管理非常重要，因为它们几乎不会刷新。这意味着内存泄漏可能会变得明显。对于移动端单页应用，这是一个巨大的陷阱，因为内存有限；对于电子邮件客户端或社交网络应用等长时间运行的程序也是如此。**能力越大，责任越大。**


    有多种方法可以防止这种情况。在 `Backbone` 中，确保始终使用 `dispose()` 释放旧视图和引用（目前在 [Backbone (edge)](https://github.com/documentcloud/backbone/blob/master/backbone.js#L1234)^(36)
    中可用）。该函数是最近添加的，会移除视图“events”对象中添加的任何处理器，以及将视图作为第三参数（回调上下文）传递的任何集合或模型监听器。`dispose()`
    也会由视图的 `remove()` 调用，在元素[从屏幕上清除](https://github.com/documentcloud/backbone/blob/master/backbone.js#L1235)^(37)
    时处理大部分基础内存清理需求。其他库如 `Ember` 会在检测到元素已从视图中移除时会[清理观察者](https://github.com/emberjs/ember.js/blob/d8f76a7fdde741ae3d1e07b12df9cb6718170e48/packages/ember-handlebars/lib/helpers/binding.js#L296)^(38)，以避免内存泄漏。


    来自 Derick Bailey 的忠智建议：


    > “除了意识到事件在引用方面如何工作外，只需遵循 JavaScript 管理内存的标准规则就没问题了。如果你正在向一个包含 `User` 对象的 `Backbone`
    集合中加载数据，并且你希望该集合被清理以不再占用内存，那么你必须移除对该集合及其其中单个对象的所有引用。一旦删除了所有引用，就会被清理。这只是标准的 JavaScript
    垃圾回收规则。”


    在他的文章中，Derick 涵盖了在使用 `Backbone` 时遇到的许多常见的[内存陷阱](http://lostechies.com/derickbailey/2012/03/19/backbone-js-and-javascript-garbage-collection/)^(39)。还有一个非常有用的[文档片段
    (DocumentFragment)](https://www.w3.org/TR/DOM-Level-2-Core.html#ID-B6ED1A3)^(40)，这是一个轻量级的文档对象。可以将其视为提取文档的一部分，或创建一个新的文档“片段”的方法。我们不需要不断向
    DOM 添加内容，而是可以使用文档片段构建所需的所有内容，然后只执行一次插入 DOM 操作，以避免过多的重流。


