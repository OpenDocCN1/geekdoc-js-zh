    # 编写快速且内存高效的 JavaScript


    作者：Addy Osmani


    像 Google 的 [V8](http://code.google.com/p/v8/)^(1)（Chrome, Node）这样的 JavaScript
    引擎专为大型 JavaScript 程序的[快速执行](http://www.html5rocks.com/en/tutorials/speed/v8/)^(2)
    设计。在开发过程中，如果你关注内存使用和性能，你应该意识到用户浏览器 JavaScript 引擎背后正在发生。


    无论是 V8、[SpiderMonkey](https://developer.mozilla.org/en-US/docs/SpiderMonkey)^(3)
    (Firefox)、[Carakan](http://my.opera.com/ODIN/blog/carakan-faq)^(4) (Opera)、[Chakra](http://en.wikipedia.org/wiki/Chakra_(JScript_engine))^(5)
    (IE) 还是其他引擎，了解这些都能帮助你**更好地优化应用程序**。这并不是说应该针对某个特定的浏览器或引擎进行优化。永远不要这样做。


    然而，你应该问自己一些问题：


    • 在我的代码中，是否有我可以做得更高效的地方？

    • 流行的 JavaScript 引擎做了哪些（常见的）优化？

    • 引擎无法对哪些内容进行优化？垃圾回收器能够清理我预期的内容吗？


    ![仪表盘](http://dhybridcars.com/toyota-hybrid/2013-scion-fr-s-sexy-sport-car/media/2013-scion-fr-s-speed-gauge-img-8/)


    *快速加载的网站——就像快汽车一样——需要使用专门工具。图片来源：[dHybridcars](http://dhybridcars.com/toyota-hybrid/2013-scion-fr-s-sexy-sport-car/media/2013-scion-fr-s-speed-gauge-img-8/)^(6)*


    在编写内存高效且快速的代码时，有很多常见的陷阱，在本章中，我们将探索一些经过测试的方法，以编写性能更好的代码。


    ### 那么，JavaScript 在 V8 中是如何工作的？


    虽然在不深入理解 JavaScript 引擎的情况下也可以开发大型应用程序，但任何车主都会告诉你，他们至少查看过一次引擎盖。由于 Chrome 是我的首选浏览器，我将稍微谈谈它的
    JavaScript 引擎。V8 由几个核心部分组成。


    • 一个**基础编译器（base compiler）**，它在执行之前解析你的 JavaScript 并生成原生机器代码，而不是执行字节码或简单地解释。这些代码最初并没有经过高度优化。


    • V8 在**对象模型（object model）**中表示你的对象。在 JavaScript 中，对象表示为关联数组，但在 V8 中，它们通过[隐藏类（hidden
    classes)](https://developers.google.com/v8/design)^(7) 表示，这是一种用于优化查找的内部类型系统。


    • **运行时性能分析器（runtime profiler）**监控正在运行的系统并识别“热点”函数（即最终运行时间很长的代码）。


    • **优化编译器（optimizing compiler）**重新编译并优化运行时性能分析器识别出的“热点”代码，并执行诸如内联（即将函数调用点替换为被调用函数的体）等优化。


    • V8 支持**去优化（deoptimization）**，这意味着如果优化编译器发现对优化代码所做的某些假设过于乐观，它可以从生成的代码中退回。


    • 它拥有一个**垃圾回收器（garbage collector）**。理解它的工作原理对你有帮助。


    ### 垃圾回收


    理解它的工作原理可以帮助你。垃圾回收是**内存管理的一种**。在许多语言中，你必须手动管理内存，但在 JavaScript 中，垃圾回收器会自动完成。然而，你需要了解它以避免内存泄漏。垃圾回收器通过识别不可达的对象并回收其内存来工作。如果存在从根到对象的路径，则对象是可达的。如果对象不可达，它就可以被垃圾回收。垃圾回收并不是自动的，至少在这方面你需要意识到它何时运行。在编写内存高效且快速的代码时，有很多常见的陷阱，在本章中我们将探索一些经过测试的方法，以编写性能更好的代码。


    关于 解引的误区


    在关于回收 JavaScript 内存的很多讨论中，`delete` 关键字被提及，尽管它本用于从映射中删除键，但某些开发者认为可以用它强制解除引用。尽可能避免
    `delete`。在下面的示例中，`delete o.x` 害大于利，因为它改变了 o 的隐藏类。


    ```javascript

    var o = { x: 1 };

    delete o.x; // true

    o.x; // undefined

    ```


    尽管如此，你几乎可以在许多流行的 JavaScript 库中找到 `delete` 的引用——它在语言中确实有用。这里的主要结论是避免在运行时修改对象的结构。JavaScript
    引擎可以检测此类“热点”对象并对其进行优化。如果对象的结构在其生命周期内变化不很大，这将更容易。


    关于 `null` 如何工作也有误解。将对象引用设置为 `null` 并不会“删除”对象。它只是将对象引用设置为 `null`。使用 `o.x = null`
    比使用 `delete` 好，但可能并不必要。


    ```javascript

    var o = { x: 1 };

    o = null;

    o; // null

    o.x // TypeError

    ```


    ### 全局变量


    在全局变量方面，垃圾回收不是自动的。另一个重要的注意事项是，全局变量在页面生命周期内不会被垃圾回收清理。无论页面打开多长时间，作用于 JavaScript
    运行时全局对象的变量都会存在。


    ```javascript

    var myGlobalNamespace = {};

    ```


    全局变量会在刷新页面、导航到其他页面、关闭标签或退出浏览器时清理。函数作用域变量在离开作用时会被清理。当函数退出且没有对它的引用时，变量就会被清理。


    #### 通用规则


    为了让垃圾回收器尽可能早地收集尽可能的对象，**不要保留不再需要的对象**。这大部分情况下是自动的；这里有几点需要的事项。


