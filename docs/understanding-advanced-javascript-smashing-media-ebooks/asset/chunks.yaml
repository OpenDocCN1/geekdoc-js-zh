  trans: '


    [Backbone.js](http://backbonejs.org), [Ember.js](http://emberjs.com), [AngularJS](http://angularjs.com),
    [Spine](http://spinejs.com), [CanJS](http://canjs.us) …… 新旧稳定解决方案的列表每周都在增长，开发者可能会发现自己迷失在选项的海洋中。从那些为了处理复杂应用而开发出这些解决方案的人（如
    [Yehuda Katz](http://github.com/wycats) 和 [Jeremy Ashkenas](http://github.com/jashkenas)），有很多有很多开发者应该考虑使用的有力竞争者。问题是，用什么，以及如何选择？


    我们理解这种挫败感，并希望帮助开发者尽可能简化他们的选择过程。为了解决这个问题，我们创建了 [TodoMVC](http://todomvc.com)——该项目在如今大多数流行的
    JavaScript `MV* frameworks` 中实现了相同的 Todo 应用程序——可以将其看作是框架的“快速相亲”。这些解决方案的外观感觉相同，具有共同的功能集，并让我们能够轻松地比较不同框架的语法和结构，从而选择出我们最熟悉的一个，或者至少缩小我们的选择。


    ![](img/screenshot11.jpg "screenshot1")


    本周我们发布了 [TodoMVC](http://www.todomvc.com) 的全新版本，你可以在下方的应用部分找到更多详细信息。


    在不久的将来，我们希望这项工作推得进一步，提供关于框架之间差异的指南，并针对你可能想要构建的特定类型的应用提供考虑选项建议。


    ### 我们建议的选择框架的标准


    选择框架显然不仅仅是比较 Todo 应用程序的实现。这就是为什么，一旦我们将潜在框架的选择缩小到仅剩几个，建议花些时间进行一些尽职调查。我们选择的框架可能需要支持构建非平凡的功能，并可能在未来几年内被用于维护应用程序。


    - **该框架到底能做什么？**


    花时间审查框架的源代码和官方功能列表，看看它们与你的需求的匹配程度如何。有些项目可能需要修改或扩展底层源代码，因此确保如果可能出现这种情况，你已经对代码进行了尽职调查。


    - **该框架是否在生产环境中得到过验证？**


    即：开发者是否真的用它构建并部署了可以公开访问的大型应用程序？`Backbone` 拥有此类强大的案例（SoundCloud, LinkedIn），但并非所有框架都如此。`Ember`
    已用于许多大型应用，包括 Square 中的用户工具。`JavaScriptMVC` 已被用于 `IBM` 等其他地方的应用。不仅知道一个框架在生产环境中运行很重要，能够查看真实世界的代码并从用它能构建的内容中获得灵感同样重要。


    - **该框架是否成熟？**


    我们通常建议开发者不要简单地“选一个就用哪个”。新项目在发布时通常伴随着大量热度，但请记住，在生产级应用中选择它们时要加小心。你不想承担项目被废弃、经历重大重构时期或或其他破坏性变更的风险，而这些变化在框架成熟时往往会规划得更周全。成熟的项目通常会有更详细的文档可用，这些文档作为官方文档或社区驱动文档的一部分。


    - **该框架是灵活的还是带有主偏的（opinionated）的？**


    了解你想要哪种风格，因为有很多框架可以提供其中一种。带有主偏的框架会锁定（或建议）你以特定的方式（它们的方式）来做事。从设计上来说，它们具有局限性，但减少了开发者必须自己琢磨事情应该如何运作的负担。


    - **你真的玩过这个框架吗？**


    不使用框架写一个小型应用程序，然后尝试用框架重构你的代码，以确认它是否易于使用。尽管研究和阅读代码会影响你的决定，但使用该框架编写实际代码以确保你对它强制执行的概念感到熟悉同样重要。


    - **该框架是否有完善的文档？**


    虽然演示应用可以作为参考，但你几乎总是发现自己在查阅框架官方文档，以它的 `API` 支持什么、如何用它创建常见任务或组件，以及有哪些值得注意的陷阱。任何有价值的框架都应该有一套详细的文档来指导使用它的开发者。如果没有这些，你可能会发现自己严重依赖
    `IRC` 频道、群组和自我发现，这也许可以，但与预先提供的优秀文档相比，通常过于耗费时间。


    - **考虑到压缩、gzip 压缩以及它支持的任何模块化构建，框架的总大小是多少？**


    该框架有哪些依赖？框架倾向于只列出基础库本身的总大小，而不会列出依赖项。这可能意味着选择了一个最初看起来很小的库，但如果它依赖于 `jQuery` 和其他库，则可能会变得很大。


    - **你是否查看过框架周围的社区？**


    是否有一个活跃的项目贡献者和用户社区，在当你遇到问题时能够提供帮助？是否有足够的开发者在使用该框架，以至于有现成的参考应用、教程甚至是屏幕录制供你学习更多？


    ### Dojo 与 JavaScript 框架的兴起


    正如我们许多人所知，[Dojo](http://dojotoolkit.org) 是为开发者提供开发更复杂应用手段尝试之一，有人可能会说它在某种程度上启发了我们去思考非平凡应用的需求。我坐下来询问
    Dojo 的 [Dylan Schiemann](http://dylanschiemann.com)、`Kitson Kelly` 和 `James Thomas`
    他们对 JavaScript `MV* frameworks` 崛起的看法。


    **Q：Dojo 不是不是已经解决了这一切吗？**


    几年前，当 JavaScript 领域从向页面添加简单的 `Ajax` 和 chrome 进化时，`Dojo` 正在推倡一种构建复杂 Web 应用的“工具包”方法。


    其中许多功能远超大多数开发者的需求。随着浏览器成为主导应用程序平台，在 Dojo Toolkit 中开创的许多创新现在出现在较新的工具包中。`MVC` 只是
    `Dojo` 长期以来提供的另一个包，还有模块化代码包、`JS` 中的 `OO`、`UI widgets`、跨浏览器图形、模板化、国际化、可访问性、数据存储、测试框架、构建系统等等，非常多。


    JavaScript 库不应止于“query”，这就是为什么 `Dojo` 早期就专注于完成企业级应用开发的蓝图。这与它今天在 `MVC` 上拥有的关注点是相同的，它只是“军备库中的另一种工具”。


    '
- fmt: 'Why is Dojo not the dominant toolkit? Its goal was never to be the only choice.
    The goal was to provide an open collection of tools that could be used with anything
    else, within projects, and liberally copied into other work as well. Dojo was
    criticized for being slow and even after that was addressed, it was criticized
    for being slow. Trying to shake that perception is challenging. It is very hard
    to document a feature-rich toolkit. There are 175 sub-packages in `Dojo 1.8` and
    over 1,400 modules.


    That is not only a challenge from a documentation purpose, it also means that
    there isn''t one thing that Dojo does. Which is good if you are building software,
    but very difficult when you are starting out trying to figure out where to start.
    These are all things we have been trying to work on for `Dojo 1.8`, in the form
    of tutorials and significantly improved documentation.


    **Q: Why should developers still consider Dojo and what ideas do you have lined
    up for the future of the project? I hear 1.8 will be another major milestone.**


    In `Dojo 1.8`, `dojox/mvc` takes another step towards full maturity. There has
    been a lot of investment in time, effort, testing and community awareness into
    the package. It focuses on providing an MVC model that leverages the rest of Dojo.
    Coupled with `dojox/app`, an application framework that is designed to make it
    easier to build rich applications across desktop and mobile, it makes a holistic
    framework for creating a client-side application.


    In the typical Dojo way, this is just one of many viable ways in which to build
    applications with Dojo.


    In `1.8`, not only does the MVC sub-module become more mature, it is built upon
    a robust framework. It doesn''t just give you markup language to create your views,
    express your models or develop a controller. It is far more then just wiring up
    some controls to a data source. Because it is leveraging the rest of Dojo, you
    can draw in anything else you might need.


    In `Dojo 2.0` we will be looking to take modularity to a new level, so that it
    becomes even easier to take a bit of this and a bit of that and string it all
    together. We are also exploring the concepts of isomorphism, where it should be
    transparent to the end-user where your code is being executed, be it client side
    or server side and that ultimately it should be transparent to the developer.


    ### The TodoMVC Collection


    In our brand new release, Todo implementations now exist for the most popular
    frameworks with a large number of other commonly used frameworks being worked
    on in Labs. These implementations have gone through a lot of revision, often taking
    on board best practice tips and suggestions from framework authors, contributors
    and users from within the community.


    ![](images/screenshot2.jpg "screenshot2")


    Following on from comments previously made by Backbone.js author Jeremey Ashkenas
    and Yehuda Katz, TodoMVC now also offers consistent implementations based on an
    official application specification as well as routing (or state management).


    We don''t pretend that more complex learning applications aren''t possible (they
    certainly are), but the simplicity of a Todo app allows developers to review areas
    such as code structure, component syntax and flow, which we feel are enough to
    enable a comparison between frameworks and prompt further exploration with a particular
    solution or set of solutions.


    Our applications include:


    - •[Backbone.js](http://documentcloud.github.com/backbone)^([21](#chapter-4.xhtml_fn4_21))

    - •[Ember.js](http://emberjs.com)^([22](#chapter-4.xhtml_fn4_22))

    - •[AngularJS](http://angularjs.org)^([23](#chapter-4.xhtml_fn4_23))

    - •[Spine.js](http://spinejs.com)^([24](#chapter-4.xhtml_fn4_24))

    - •[KnockoutJS](http://knockoutjs.com)^([25](#chapter-4.xhtml_fn4_25)) (MVVM)

    - •[Dojo](http://dojotoolkit.org)^([26](#chapter-4.xhtml_fn4_26))

    - •[YUI](http://yuilibrary.com)^([27](#chapter-4.xhtml_fn4_27))

    - •[Batman.js](http://batmanjs.org)^([28](#chapter-4.xhtml_fn4_28))

    - •[Closure](http://code.google.com/closure/library/)^([29](#chapter-4.xhtml_fn4_29))

    - •[Agility.js](http://agilityjs.com)^([30](#chapter-4.xhtml_fn4_30))

    - •[Knockback.js](http://kmalakoff.github.com/knockback)^([31](#chapter-4.xhtml_fn4_31))


    For those interested in AMD versions:


    - •[Backbone.js](http://documentcloud.github.com/backbone)^([32](#chapter-4.xhtml_fn4_32))
    + [RequireJS](http://requirejs.org)^([33](#chapter-4.xhtml_fn4_33)) (using AMD)

    - •[Ember.js](http://emberjs.com)^([34](#chapter-4.xhtml_fn4_34)) + [RequireJS](http://requirejs.org)^([35](#chapter-4.xhtml_fn4_35))
    (using AMD)


    And our Labs include:


    - •[CanJS](http://canjs.us)^([36](#chapter-4.xhtml_fn4_36))

    - •[Maria.js](https://github.com/petermichaux/maria)^([37](#chapter-4.xhtml_fn4_37))

    - •[cujo.js](http://cujojs.github.com)^([38](#chapter-4.xhtml_fn4_38))

    - •[Meteor](http://meteor.com)^([39](#chapter-4.xhtml_fn4_39))

    - •[SocketStream](http://www.socketstream.org)^([40](#chapter-4.xhtml_fn4_40))
    + [jQuery](http://jquery.com)^([41](#chapter-4.xhtml_fn4_41))

    - •[Ext.js](http://www.sencha.com/products/extjs)^([42](#chapter-4.xhtml_fn4_42))

    - •[Sammy.js](http://sammyjs.org)^([43](#chapter-4.xhtml_fn4_43))

    - •[JavaScriptMVC](http://javascriptmvc.com)^([44](#chapter-4.xhtml_fn4_44))

    - •[Google Web Toolkit](https://developers.google.com)^([45](#chapter-4.xhtml_fn4_45))

    - •[TroopJS](https://github.com/troopjs)^([46](#chapter-4.xhtml_fn4_46))

    - •[Stapes.js](http://hay.github.com/stapes)^([47](#chapter-4.xhtml_fn4_47))

    - •[somajs](http://github.com/somajs)^([48](#chapter-4.xhtml_fn4_48))

    - •[DUEL](https://bitbucket.org/mckamey/duel)^([49](#chapter-4.xhtml_fn4_49))

    - •[Fidel](https://github.com/jgallen23/fidel)^([50](#chapter-4.xhtml_fn4_50))

    - •[Olives](https://github.com/flams/olives)^([51](#chapter-4.xhtml_fn4_51))

    - •[PlastronJS](https://github.com/rhysbowen/PlastronJS)^([52](#chapter-4.xhtml_fn4_52))

    - •[Dijon](https://github.com/creynders/dijon-framework)^([53](#chapter-4.xhtml_fn4_53))

    - •[rAppid.js](http://www.rappid.com)^([54](#chapter-4.xhtml_fn4_54))

    - •[Broke](https://github.com/brokenseal/broke)^([55](#chapter-4.xhtml_fn4_55))

    - •[o_O](http://weepy.github.com/o_O)^([56](#chapter-4.xhtml_fn4_56))

    - •[Fun](https://github.com/marcuswestin/fun)^([57](#chapter-4.xhtml_fn4_57))

    - •[AngularJS](http://angularjs.org)^([58](#chapter-4.xhtml_fn4_58)) + [RequireJS](http://requirejs.org)^([59](#chapter-4.xhtml_fn4_59))
    (using AMD)


    **Note:** We''ve implemented a version of our Todo application using [just JavaScript](https://github.com/addyosmani/todomvc/blob/master/vanilla-examples/vanillajs/js/app.js)^([60](#chapter-4.xhtml_fn4_60))
    and another using primarily [jQuery conventions](https://github.com/addyosmani/todomvc/blob/master/architecture-examples/jquery/js/app.js)^([61](#chapter-4.xhtml_fn4_61)).


    ### Frameworks: When To Use What?


    To help you get started with narrowing down frameworks to explore, we would like
    to offer the below high-level framework summaries which we hope will help steer
    you towards a few specific options to try out.

