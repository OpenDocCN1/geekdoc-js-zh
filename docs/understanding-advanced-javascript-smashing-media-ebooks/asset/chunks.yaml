- fmt: "\n73. [http://dblogit.com/archives/3895](http://dblogit.com/archives/3895)\n\
    \n74. [http://sindresorhus.com/](http://sindresorhus.com/)\n\n# JavaScript Events\
    \ And Responding To The User\n\nBy Christian Heilmann\n\nWhenever people ask me\
    \ about the most powerful things in JavaScript and the DOM, I quickly arrive at\
    \ events. The reason is that events in browsers are incredibly useful. Furthermore,\
    \ decoupling functionality from events is a powerful idea, which is why [Node.js](http://nodejs.org/)^([1](#chapter-5.xhtml_fn5_1))\
    \ became such a hot topic.\n\nToday, let's get back to the basics of events and\
    \ get you in the mood to start playing with them, beyond applying click handlers\
    \ to everything or breaking the Web with `<a href=\"javascript:void(0)\">` links\
    \ or messing up our HTML with `onclick=\"foo()\"` inline handlers (I explained\
    \ in detail in 2005 [why these are bad ideas](http://www.onlinetools.org/articles/unobtrusivejavascript/chapter4.html)^([2](#chapter-5.xhtml_fn5_2))).\n\
    \nNote: This chapter uses plain JavaScript and not any libraries. A lot of what\
    \ we'll talk about here is easier to achieve in jQuery, YUI or Dojo, but understanding\
    \ the basics is important because you will find yourself in situations where you\
    \ cannot use a library but should still be able to deliver an amazing solution.\n\
    \n**Disclaimer**: The event syntax we'll be using here is [`addEventListener()`](https://developer.mozilla.org/en/DOM/element.addEventListener)^([3](#chapter-5.xhtml_fn5_3)),\
    \ as defined in the “[DOM Level 3 Events](http://dev.w3.org/2006/webapi/DOM-Level-3-Events/html/DOM3-Events.html#events-EventTarget-addEventListener)^([4](#chapter-5.xhtml_fn5_4))”\
    \ specification, which works in all browsers in use now except for Internet Explorer\
    \ below version 9\\. A lot of the things we'll show can be achieved with jQuery,\
    \ though, which also supports legacy browsers. Come to think of it, one simple\
    \ `addEventListener()` on `DOMContentLoaded` is a great way to make sure your\
    \ script does not run on legacy browsers. This is a good thing. If we want the\
    \ Web to evolve, we need to stop giving complex and demanding code to old browsers.\
    \ If you build your solutions the right way, then IE 6 would not need any JavaScript\
    \ to display a workable, albeit simpler, solution. Think of your product as an\
    \ escalator: if your JavaScript does not execute, the website should still be\
    \ usable as stairs.\n\nBefore we get into the details of events and how to use\
    \ them, check out a few demos that use scroll events in a clever way to achieve\
    \ pretty sweet results:\n\n•In its search for a designer, Wealthfront Engineering\
    \ uses [scrolling and shifting content along the Z axis](https://www.wealthfront.com/designerwanted)^([5](#chapter-5.xhtml_fn5_5)).\
    \ This was a big part of the [Beercamp 2011 website](http://2011.beercamp.com/)^([6](#chapter-5.xhtml_fn5_6)).\
    \ Wealthfront [blogged in detail](http://eng.wealthfront.com/)^([5](#chapter-5.xhtml_fn5_5)).\n\
    \n•One simple `addEventListener()` on `DOMContentLoaded` is a great way to make\
    \ sure your script does not run on legacy browsers.\n\n•[Scroll Path](http://joim.se/scroll/)^([9](#chapter-5.xhtml_fn5_9))\
    \ is what we get.\n\n•[jQuery](http://www.jquery.com/)^([2](#chapter-5.xhtml_fn5_2))\
    \ takes a lot of this.\n\n### Basics: What Is Event?\n\nYou can assign several\
    \ event handlers to the same event, or the same handler to various events (as\
    \ shown in this demo).\n\nThe `ev` is what we get back from the event. And (again,\
    \ in my case, in Firefox) a lot of interesting things are in it:\n\n```javascript\n\
    var log = document.getElementById('log'),\n    out = '';\n```\n\nFor example:\n\
    \n```javascript\nvar i, log = document.getElementById('log'),\n    out = [];\n\
    for (i in window) {\n  if (on/.test(i)) { out.length = i; }\n}\n```\n\nSetting\
    \ `useCapture` to `false` means that we capture the event bubbling, rather than\
    \ the capturing phase. This is a [long and arduous topic](http://www.w3.org/TR/DOM-Level-Events/#event-flow)^([10](#chapter-5.xhtml_fn5_10)).\
    \ Let's just say that by setting `useCapture` to `false`, you will be fine in\
    \ 99.7434% of cases (a rough approximation). The parameter is actually optional\
    \ in all browsers but Opera.\n\nNow, the event handler function gets an object\
    \ as a parameter from the event, which is full of awesome properties we can play\
    \ with. If you [try out my example](http://thewebrocks.com/demos/smashing-events/eventproperties.html)^([12](#chapter-5.xhtml_fn5_12)),\
    \ you'll see what the following code does:\n\n```javascript\nvar log = document.getElementById('log'),\n\
    \    out = '';\n\ndocument.addEventListener('click', logeventinfo, false);\ndocument.addEventListener('keypress',\
    \ logeventinfo, false);\n\nfunction logeventinfo (ev) {\n  log.innerHTML = '';\n\
    \  out = '<ul>';\n  for (var i in ev) {\n    if (typeof ev[i] === 'function' ||\
    \ i === i.toUpperCase()) {\n      continue;\n    }\n    out += '<li><span>'+i+'</span>:\
    \ '+ev[i]+'</li>';\n  }\n  log.innerHTML += out + '</ul>';\n}\n```\n"
  raw: "73.[http://dblogit.com/archives/3895](http://dblogit.com/archives/3895)\n\n\
    74.[http://sindresorhus.com/](http://sindresorhus.com/)\n\n# JavaScript Events\
    \ And Responding To The User\n\nBy Christian Heilmann\n\nWhenever people ask me\
    \ about the most powerful things in JavaScript and the DOM, I quickly arrive at\
    \ events. The reason is that events in browsers are incredibly useful. Furthermore,\
    \ decoupling functionality from events is a powerful idea, which is why [Node.js](http://nodejs.org/)^([1](#chapter-5.xhtml_fn5_1))\
    \ became such a hot topic.\n\nToday, let's get back to the basics of events and\
    \ get you in the mood to start playing with them, beyond applying click handlers\
    \ to everything or breaking the Web with `<a href=\"javascript:void(0)\">` links\
    \ or messing up our HTML with `onclick=\"foo()\"` inline handlers (I explained\
    \ in detail in 2005 [why these are bad ideas](http://www.onlinetools.org/articles/unobtrusivejavascript/chapter4.html)^([2](#chapter-5.xhtml_fn5_2))).\n\
    \nNote: This chapter uses plain JavaScript and not any libraries. A lot of what\
    \ we'll talk about here is easier to achieve in jQuery, YUI or Dojo, but understanding\
    \ the basics is important because you will find yourself in situations where you\
    \ cannot use a library but should still be able to deliver an amazing solution.\n\
    \n**Disclaimer**: The event syntax we'll be using here is [`addEventListener()`](https://developer.mozilla.org/en/DOM/element.addEventListener)^([3](#chapter-5.xhtml_fn5_3)),\
    \ as defined in the “[DOM Level 3 Events](http://dev.w3.org/2006/webapi/DOM-Level-3-Events/html/DOM3-Events.html#events-EventTarget-addEventListener)^([4](#chapter-5.xhtml_fn5_4))”\
    \ specification, which works in all browsers in use now except for Internet Explorer\
    \ below version 9\\. A lot of the things we'll show can be achieved with jQuery,\
    \ though, which also supports legacy browsers. Come to think of it, one simple\
    \ `addEventListener()` on `DOMContentLoaded` is a great way to make sure your\
    \ script does not run on legacy browsers. This is a good thing. If we want the\
    \ Web to evolve, we need to stop giving complex and demanding code to old browsers.\
    \ If you build your solutions the right way, then IE 6 would not need any JavaScript\
    \ to display a workable, albeit simpler, solution. Think of your product as an\
    \ escalator: if your JavaScript does not execute, the website should still be\
    \ usable as stairs.\n\nBefore we get into the details of events and how to use\
    \ them, check out a few demos that use scroll events in a clever way to achieve\
    \ pretty sweet results:\n\n•In its search for a designer, Wealthfront Engineering\
    \ uses [scrolling and shifting content along the Z axis](https://www.wealthfront.com/designerwanted)^([5](#chapter-5.xhtml_fn5_5)).\
    \ This was a big part of the [Beercamp 2011 website](http://2011.beercamp.com/)^([6](#chapter-5.xhtml_fn5_6)).\
    \ Wealthfront [blogged in detail](http://eng.wealthfront.com/2012/03/scrolling-z-axis-with-css-3d-transforms.html)^([7](#chapter-5.xhtml_fn5_7))\
    \ about how it achieved this.\n\n•[Stroll.js](http://lab.hakim.se/scroll-effects/)^([8](#chapter-5.xhtml_fn5_8))\
    \ takes a slightly similar approach, showing how lovely transitions can be when\
    \ the user scrolls a list.\n\n•[jQuery Scroll Path](http://joelb.me/scrollpath/)^([9](#chapter-5.xhtml_fn5_9))\
    \ is a plugin to move content along a path when the user scrolls the page.\n\n\
    All of this is based on event handling and reading out what the browser gives\
    \ us. Now, let's look at repeating the basics of that.\n\n### Basics: What Is\
    \ An Event?\n\n```\nvar log = document.getElementById('log'),\n    i = '', \n\
    \    out = [];\nfor (i in window) {\n  if ( /^on/.test(i)) { out[out.length] =\
    \ i; }\n}\nlog.innerHTML = out.join(', ');\n```\n\nIn my case, running Firefox,\
    \ I get this:\n\n```\n onmouseenter, onmouseleave, onafterprint, onbeforeprint,\
    \ onbeforeunload, onhashchange, onmessage, onoffline, ononline, onpopstate, onpagehide,\
    \ onpageshow, onresize, onunload, ondevicemotion, ondeviceorientation, onabort,\
    \ onblur, oncanplay, oncanplaythrough, onchange, onclick, oncontextmenu, ondblclick,\
    \ ondrag, ondragend, ondragenter, ondragleave, ondragover, ondragstart, ondrop,\
    \ ondurationchange, onemptied, onended, onerror, onfocus, oninput, oninvalid,\
    \ onkeydown, onkeypress, onkeyup, onload, onloadeddata, onloadedmetadata, onloadstart,\
    \ onmousedown, onmousemove, onmouseout, onmouseover, onmouseup, onmozfullscreenchange,\
    \ onmozfullscreenerror, onpause, onplay, onplaying, onprogress, onratechange,\
    \ onreset, onscroll, onseeked, onseeking, onselect, onshow, onstalled, onsubmit,\
    \ onsuspend, ontimeupdate, onvolumechange, onwaiting, oncopy, oncut, onpaste,\
    \ onbeforescriptexecute, onafterscriptexecute\n```\n\nThat is a lot to play with,\
    \ and the way to do that is by using `addEventListener()`:\n\n```\nelement.addEventListener(event,\
    \ handler, useCapture);\n```\n\nFor example:\n\n```\nvar a = document.querySelector('a');\
    \ // grab the first link in the document\na.addEventListener('click', ajaxloader,\
    \ false);\n```\n\nThe `element` is the element that we apply the handler to; as\
    \ in, “Hey you, link! Make sure you tell me when something happens to you.” The\
    \ `ajaxloader()` function is the event listener; as in, “Hey you! Just stand there\
    \ and keep your ears and eyes peeled in case something happens to the link.” Setting\
    \ the `useCapture` to `false` means that we are content to capture the event on\
    \ bubbling, rather than the capturing phase. This is a [long and arduous topic](http://www.w3.org/TR/DOM-Level-3-Events/#event-flow)^([10](#chapter-5.xhtml_fn5_10)),\
    \ well [explained on Dev.Opera](http://dev.opera.com/articles/view/event-capture-explained/)^([11](#chapter-5.xhtml_fn5_11)).\
    \ Let's just say that by setting the `useCapture` to `false`, you will be fine\
    \ in 99.7434% of cases (a rough approximation). The parameter is actually optional\
    \ in all browsers but Opera.\n\nNow, the event handler function gets an object\
    \ as a parameter from the event, which is full of awesome properties that we can\
    \ play with. If you [try out my example](http://thewebrocks.com/demos/smashing-events/eventproperties.html)^([12](#chapter-5.xhtml_fn5_12)),\
    \ you'll see what the following code does:\n\n```\nvar log = document.getElementById('log'),\n\
    \    out = '';\n\ndocument.addEventListener('click', logeventinfo, false);\ndocument.addEventListener('keypress',\
    \ logeventinfo, false);\n\nfunction logeventinfo (ev) {\n  log.innerHTML = '';\n\
    \  out = '<ul>';\n  for (var i in ev) {\n    if (typeof ev[i] === 'function' ||\
    \ i === i.toUpperCase()) {\n      continue;\n    }\n    out += '<li><span>'+i+'</span>:\
    \ '+ev[i]+'</li>';\n  }\n  log.innerHTML += out + '</ul>';\n}\n```\n\nYou can\
    \ assign several event handlers to the same event, or the same handler to various\
    \ events (as shown in this demo).\n\nThe `ev` is what we get back from the event.\
    \ And (again, in my case, in Firefox) a lot of interesting things are in it:"
