    # About The Authors


    ### Addy Osmani


    Addy Osmani is a Developer Programs Engineer on the Chrome team at Google. A passionate
    JavaScript developer, he has written open-source books like ''Learning JavaScript
    Design Patterns'' and ''Developing Backbone Applications'', having also contributed
    to open-source projects like Modernizr and jQuery. He is currently working on
    ''Yeoman'' - an opinionated workflow for building beautiful applications.


    ### Christian Heilmann


    Christian Heilmann is an international Developer Evangelist working for Mozilla
    in the lovely town of London, England.


    ### Jörn Zaefferer


    Jörn is a freelance web developer, consultant and trainer, residing in Cologne,
    Germany. Jörn evolved jQuery''s testsuite into QUnit, a JavaScript unit testing
    framework, and maintains it. He created and maintains a number of popular plugins.
    As a jQuery UI development lead, he focuses on the development of new plugins,
    widgets and utilities.


    ### Philip Tellis


    Philip Tellis is a geek, speedfreak and co-founder of [lognormal.com](http://lognormal.com/)^([1](#chapter-9.xhtml_fn9_1))
    where he tries to infer various characteristics of web users'' networks. When
    he isn''t at his computer, he reads, cooks, bikes or falls off his skateboard.


    ### Rodney Rehm


    Rod is a Web Developer based in Lottstetten, Germany. He is mainly developing
    in PHP and JavaScript. He''s quite decent with databases and distributed systems
    for scalability and redundancy. Created URI.js, jQuery Context Menu, Apple''s
    PList in PHP and works on Smarty - PHP Template Engine.


    ### Zack Grossbart


    Zack Grossbart is an [engineer](http://www.zackgrossbart.com/hackito/)^([2](#chapter-9.xhtml_fn9_2)),
    designer, and [author](http://www.zackgrossbart.com/blog/toc/)^([3](#chapter-9.xhtml_fn9_3)).
    He''s a founding member of the [Spiffy UI](http://www.spiffyui.org/)^([4](#chapter-9.xhtml_fn9_4))
    project, the architect of the [WordPress Editorial Calendar](http://stresslimitdesign.com/editorial-calendar-plugin)^([5](#chapter-9.xhtml_fn9_5)),
    and an Architecting Engineer and Human Factors Specialist with [NetIQ](http://www.netiq.com/)^([6](#chapter-9.xhtml_fn9_6)).
    Zack began loading DOS from a floppy disk when he was five years old. He first
    worked professionally with computers when he was 15 and started his first software
    company when he was 16\. Zack lives in Cambridge, Massachusetts with his wife
    and daughter.


    ## About Smashing Magazine


    [Smashing Magazine](http://www.smashingmagazine.com)^([7](#chapter-9.xhtml_fn9_7))
    is an online magazine dedicated to Web designers and developers worldwide. Its
    rigorous quality control and thorough editorial work has gathered a devoted community
    exceeding half a million subscribers, followers and fans. Each and every published
    article is carefully prepared, edited, reviewed and curated according to the high
    quality standards set in Smashing Magazine''s own [publishing policy](http://www.smashingmagazine.com/publishing-policy/)^([8](#chapter-9.xhtml_fn9_8)).


    Smashing Magazine publishes articles on a daily basis with topics ranging from
    business, visual design, typography, front-end as well as back-end development,
    all the way to usability and user experience design. The magazine is—and always
    has been—a professional and independent online publication neither controlled
    nor influenced by any third parties, delivering content in the best interest of
    its readers. These guidelines are continually revised and updated to assure that
    the quality of the published content is never compromised.


    ## About Smashing Media GmbH


    [Smashing Media GmbH](http://www.smashing-media.com)^([9](#chapter-9.xhtml_fn9_9))
    is one of the world''s leading online publishing companies in the field of Web
    design. Founded in 2009 by Sven Lennartz and Vitaly Friedman, the company''s headquarters
    is situated in southern Germany, in the sunny city of Freiburg im Breisgau. Smashing
    Media''s lead publication, Smashing Magazine, has gained worldwide attention since
    its emergence back in 2006, and is supported by the vast, global Smashing community
    and readership. Smashing Magazine had proven to be a trustworthy online source
    containing high quality articles on progressive design and coding techniques as
    well as recent developments in the Web design industry.


