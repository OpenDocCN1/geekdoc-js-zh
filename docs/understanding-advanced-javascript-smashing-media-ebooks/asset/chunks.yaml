    \ name);\n    }\n\n    for (var key in map) {\n      set.call(this, name, map[key]);\n\
    \    }\n\n    return this;\n  };\n}\n\nDateInterval.prototype.values = wrapFlexibleAccessor(\n\
    \  function(name) { \n    return name !== undefined \n      ? this.values[name]\n\
    \      : this.values;\n  },\n  function(name, value) {\n    this.values[name]\
    \ = value;\n  }\n);\n```\n\nDigging into the art of writing DRY code is well beyond\
    \ this chapter. [Rebecca Murphey](https://twitter.com/rmurphey)^([31](#chapter-8.xhtml_fn8_31))\
    \ wrote [Patterns for DRY-er JavaScript](http://rmurphey.com/blog/2010/07/12/patterns-for-dry-er-javascript/)^([32](#chapter-8.xhtml_fn8_32))\
    \ and [Mathias Bynens'](https://twitter.com/mathias)^([33](#chapter-8.xhtml_fn8_33))\
    \ slide deck on [how DRY impacts JavaScript performance](http://slideshare.net/mathiasbynens/how-dry-impacts-javascript-performance-faster-javascript-execution-for-the-lazy-developer)^([34](#chapter-8.xhtml_fn8_34))\
    \ are a good start, if you're new to the topic.\n\n### The Reference Horror\n\n\
    Unlike other languages, JavaScript doesn't know the concepts of *pass by reference*\
    \ nor *pass by value*. Passing data by value is a safe thing. It makes sure data\
    \ passed to your API and data returned from your API may be modified outside of\
    \ your API without altering the state within. Passing data by reference is often\
    \ used to keep memory overhead low, values passed by reference can be changed\
    \ anywhere outside your API and affect state within.\n\nIn JavaScript there is\
    \ no way to tell if arguments should be passed by reference or value. Primitives\
    \ (strings, numbers, booleans) are treated as *pass by value*, while objects (any\
    \ object, including Array, Date) are handled in a way that's comparable to *by\
    \ reference*. If this is the first you're hearing about this topic, let the following\
    \ example enlighten you:\n\n```\n// by value\nfunction addOne(num) {\n  num =\
    \ num + 1; // yes, num++; does the same\n  return num;\n}\n\nvar x = 0;\nvar y\
    \ = addOne(x);\n// x === 0 <--\n// y === 1\n\n// by reference\nfunction addOne(obj)\
    \ {\n  obj.num = obj.num + 1;\n  return obj;\n}\n\nvar ox = {num : 0};\nvar oy\
    \ = addOne(ox);\n// ox.num === 1 <--\n// oy.num === 1\n```\n\nThe *by reference*\
    \ handling of objects can come back and bite you if you're not careful. Going\
    \ back to the `DateInterval` example, check out this bugger:\n\n```\nvar startDate\
    \ = new Date(2012, 0, 1);\nvar endDate = new Date(2012, 11, 31)\nvar interval\
    \ = new DateInterval(startDate, endDate);\nendDate.setMonth(0); // set to january\n\
    var days = interval.days(); // got 31 but expected 365 - ouch!\n```\n\nUnless\
    \ the constructor of DateInterval *made a copy* (`clone` is the technical term\
    \ for a copy) of the values it received, any changes to the original objects will\
    \ reflect on the internals of DateInterval. This is *usually* not what we want\
    \ or expect.\n\nNote that the same is true for values returned from your API.\
    \ If you simply return an internal object, any changes made to it outside of your\
    \ API will be reflected on your internal data. This is most certainly not what\
    \ you want. [jQuery.extend()](http://api.jquery.com/jQuery.extend/)^([35](#chapter-8.xhtml_fn8_35)),\
    \ [_.extend()](http://underscorejs.org/#extend)^([36](#chapter-8.xhtml_fn8_36))\
    \ and Protoype's [Object.extend](http://api.prototypejs.org/language/Object/extend/)^([37](#chapter-8.xhtml_fn8_37))\
    \ allow you to easily escape the reference horror.\n\nIf this summary did not\
    \ suffice, read the excellent chapter [By Value Versus by Reference](http://docstore.mik.ua/orelly/webprog/jscript/ch11_02.htm)^([38](#chapter-8.xhtml_fn8_38))\
    \ from O'Reilly's [JavaScript – The Definitive Guide](http://docstore.mik.ua/orelly/webprog/jscript/index.htm)^([39](#chapter-8.xhtml_fn8_39)).\n\
    \n### The Continuation Problem\n\nIn a fluent interface, all methods of a chain\
    \ are executed, regardless of the state that the base object is in. Consider calling\
    \ a few methods on a jQuery instance that contain no DOM elements:\n\n```\njQuery('.wont-find-anything')\n\
    \  // executed although there is nothing to execute against\n  .somePlugin().someOtherPlugin();\n\
    ```\n\nIn non-fluent code we could have prevented those functions from being executed:\n\
    \n```\nvar $elem = jQuery('.wont-find-anything');\nif ($elem.length) {\n  $elem.somePlugin().someOtherPlugin();\n\
    }\n```\n\nWhenever we chain methods, we lose the ability to prevent certain things\
    \ from happening—we can't escape from the chain. As long as the API developer\
    \ knows that objects can have a state where methods don't actually do anything\
    \ but `return this;`, everything is fine. Depending on what your methods do internally,\
    \ it may help to prepend a trivial `is-empty` detection:\n\n```\njQuery.fn.somePlugin\
    \ = function() {\n  if (!this.length) {\n    // \"abort\" since we've got nothing\
    \ to work with\n    return this;\n  }\n\n  // do some computational heavy setup\
    \ tasks\n  for (var i = 10000; i > 0; i--) {\n    // I'm just wasting your precious\
    \ CPU!\n    // If you call me often enough, I'll turn\n    // your laptop into\
    \ a rock-melting jet engine\n  }\n\n  return this.each(function() {\n    // do\
    \ the actual job\n  });\n};\n```\n\n### Handling Errors\n\n![Fail Faster](images/fail-faster.jpg\
    \ \"Fail Fast\")\n\nI was lying when I said we couldn't escape from the chain—there\
    \ is an `Exception` to the rule (pardon the pun ☺).\n\nWe can always eject by\
    \ throwing an Error (Exception). Throwing an Error is considered a deliberate\
    \ abortion of the current flow, most likely because you came into a state that\
    \ you couldn't recover from. But beware—not all Errors are helping the debugging\
    \ developer:\n\n```\n// jQuery accepts this\n$(document.body).on('click', {});\n\
    \n// on click the console screams\n//   TypeError: ((p.event.special[l.origType]\
    \ || {}).handle || l.handler).apply is not a function \n//   in jQuery.min.js\
    \ on Line 3\n```\n\nErrors like these are a major pain to debug. Don't waste other\
    \ people's time. Inform an API user if he did something stupid:\n\n```\nif (Object.prototype.toString.call(callback)\
    \ !== '[object Function]') { // see note\n  throw new TypeError(\"callback is\
    \ not a function!\");\n}\n```\n\nNote: `typeof callback === \"function\"` should\
    \ not be used, as older browsers may report objects to be a `function`, which\
    \ they are not. In Chrome (up to version 12) `RegExp` is such a case. For convenience,\
    \ use [jQuery.isFunction()](http://api.jquery.com/jQuery.isfunction/)^([40](#chapter-8.xhtml_fn8_40))\
    \ or [_.isFunction()](http://underscorejs.org/#isFunction)^([41](#chapter-8.xhtml_fn8_41))."
