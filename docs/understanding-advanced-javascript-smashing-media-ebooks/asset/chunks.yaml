    A Good API and Why it Matters](http://www.youtube.com/watch?v=heh4OeB9A-c)^([59](#chapter-8.xhtml_fn8_59))
    at Google Tech Talks. While his talk did not focus on JavaScript, the basic principles
    that he explained still apply.


    Now that you''re up to speed on designing APIs, have a look at [Essential JS Design
    Patterns](http://addyosmani.com/resources/essentialjsdesignpatterns/book/)^([60](#chapter-8.xhtml_fn8_60))
    by [Addy Osmani](https://twitter.com/addyosmani)^([61](#chapter-8.xhtml_fn8_61))
    to learn more about how to structure your internal code.


