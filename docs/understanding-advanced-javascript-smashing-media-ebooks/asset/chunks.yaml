    # Writing Fast, Memory-Efficient JavaScript


    By Addy Osmani


    JavaScript engines such as Google''s [V8](http://code.google.com/p/v8/)^([1](#chapter-7.xhtml_fn7_1))
    (Chrome, Node) are specifically designed for the [fast execution](http://www.html5rocks.com/en/tutorials/speed/v8/)^([2](#chapter-7.xhtml_fn7_2))
    of large JavaScript applications. As you develop, if you care about memory usage
    and performance, you should be aware of some of what''s going on in your user''s
    browser''s JavaScript engine behind the scenes.


    Whether it''s V8, [SpiderMonkey](https://developer.mozilla.org/en-US/docs/SpiderMonkey)^([3](#chapter-7.xhtml_fn7_3))
    (Firefox), [Carakan](http://my.opera.com/ODIN/blog/carakan-faq)^([4](#chapter-7.xhtml_fn7_4))
    (Opera), [Chakra](http://en.wikipedia.org/wiki/Chakra_(JScript_engine))^([5](#chapter-7.xhtml_fn7_5))
    (IE) or something else, doing so can help you **better optimize your applications**.
    That''s not to say one should optimize for a single browser or engine. Never do
    that.


    You should, however, ask yourself questions such as:


    • Is there anything I could be doing more efficiently in my code?

    • What (common) optimizations do popular JavaScript engines make?

    • What is the engine unable to optimize for, and is the garbage collector able
    to clean up what I''m expecting it to?


    [![Dashboard Speedometer](images/fast_memory.jpg "Dashboard Speedometer")](http://dhybridcars.com/toyota-hybrid/2013-scion-fr-s-sexy-sport-car/media/2013-scion-fr-s-speed-gauge-img-8/)


    *Fast-loading Web sites—like fast cars—require the use of specialized tools. Image
    source: [dHybridcars](http://dhybridcars.com/toyota-hybrid/2013-scion-fr-s-sexy-sport-car/media/2013-scion-fr-s-speed-gauge-img-8/)^([6](#chapter-7.xhtml_fn7_6)).*


    There are many common pitfalls when it comes to writing memory-efficient and fast
    code, and in this chapter we''re going to explore some test-proven approaches
    for writing code that performs better.


    ### So, How Does JavaScript Work In V8?


    While it''s possible to develop large-scale applications without a thorough understanding
    of JavaScript engines, any car owner will tell you they''ve looked under the hood
    at least once. As Chrome is my browser of choice, I''m going to talk a little
    about its JavaScript engine. V8 is made up of a few core pieces.


    • A **base compiler**, which parses your JavaScript and generates native machine
    code before it is executed, rather than executing bytecode or simply interpreting
    it. This code is initially not highly optimized.


    • V8 represents your objects in an **object model**. Objects are represented as
    associative arrays in JavaScript, but in V8 they are represented with [hidden
    classes](https://developers.google.com/v8/design)^([7](#chapter-7.xhtml_fn7_7)),
    which is an internal type system for optimized lookups.


    • The **runtime profiler** monitors the system being run and identifies “hot”
    functions (i.e. code that ends up spending a long time running).


    • An **optimizing compiler** recompiles and optimizes the “hot” code identified
    by the runtime profiler, and performs optimizations such as inlining (i.e. replacing
    a function call site with the body of the callee).


    • V8 supports **deoptimization**, meaning the optimizing compiler can bail out
    of code generated if it discovers that some of the assumptions it made about the
    optimized code were too optimistic.


    • It has a **garbage collector**. Understanding how it works can help you.


    ### Garbage Collection


    Understanding how it works can help you. Garbage collection is **a form of memory
    management**. In many languages, you have to manage memory manually, but in JavaScript
    the garbage collector does it for you. However, you need to understand how it
    works to avoid memory leaks.


    The garbage collector works by identifying objects that are no longer reachable
    and reclaiming their memory. An object is reachable if there is a path from the
    root to the object. If an object is not reachable, it can be garbage collected.


    The garbage collector is not automatic in the sense that you need to be aware
    of when it will run. There are many common pitfalls when it comes to writing memory-efficient
    and fast code, and in this chapter we''re going to explore some test-proven approaches
    for writing code that performs better.


    ### De-Referencing Misceptions


    In quite a few discussions about reclaiming memory in JavaScript, the `delete`
    keyword is brought up, although it was supposed to be for removing keys from a
    map, some developers think you can force de-referencing using it. Avoid `delete`
    if you can. In the below example, `delete o.x` does more harm than good, as it
    changes `o`''s hidden class and makes it slow.


    ```javascript

    var o = { x: 1 };

    delete o.x; // true

    o.x; // undefined

    ```


    That said, you are almost certain to find references to `delete` in many popular
    JavaScript libraries – it does have a purpose in the language. The main takeaway
    here is to avoid modifying the structure of hot objects at runtime. JavaScript
    engines can detect such “hot” objects and attempt to optimize them. This is easier
    if the object''s structure doesn''t heavily change over its lifetime.


    There are also misconceptions about how `null` works. Setting an object reference
    to `null` doesn''t “null” the object. It sets the object reference to `null`.
    Using `o.x = null` is better than using `delete`, but it''s probably not even
    necessary.


    ```javascript

    var o = { x: 1 };

    o = null;

    o; // null

    o.x // TypeError

    ```


    ### Global Variables


    The garbage collector is not automatic when it comes to global variables. Another
    important note to be aware of is that global variables are not cleaned up by the
    garbage collector during the life of your page. Regardless of how long the page
    is open, variables scoped to the JavaScript runtime global object will stick around.


    ```javascript

    var myGlobalNamespace = {};

    ```


    Globals are cleaned up when you refresh the page, navigate to a different page,
    close tabs or exit your browser. Function-scoped variables get cleaned up when
    a variable falls out of scope. When functions have exited and there aren''t any
    more references to it, the variable gets cleaned up.


    #### Rules of Thumb


    To give the garbage collector a chance to collect as many objects as possible
    as early as possible, **don''t hold on to objects you no longer need**. This mostly
    happens automatically; here are a few things to keep in mind.

