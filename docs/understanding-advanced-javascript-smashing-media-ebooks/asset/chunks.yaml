  trans: "\n\n我们可能会考虑其他改进性能的方法。你可能可能在某处读到使用原型模式（prototypal pattern）比模块模式（module pattern）更优（我们之前已经证实并非如此），或者听说使用\
    \ JavaScript 模板框架经过高度优化。有时确实如此，但使用它们是因为它们让代码更具可读性。此外，要预编译！让我们来测试并看看这在实践中有多大真实。\n\
    \n```javascript\nmoduleG = function () {};\n\nmoduleG.prototype.data = dataArray;\n\
    moduleG.prototype.init = function () {\n    this.addTable();\n    this.addEvents();\n\
    };\nmoduleG.prototype.addTable = function () {\n    var template = _.template($('#template').text());\n\
    \    var html = template({'data' : this.data});\n    $tbody.append(html);\n};\n\
    moduleG.prototype.addEvents = function () {\n   $('table').on('click', 'td', function\
    \ () {\n       $(this).toggleClass('active');\n   });\n};\n\nvar modG = new moduleG();\n\
    ```\n\n事实证明，在这种情况下，性能收益微乎其微。[选择模板和原型模式](http://jsperf.com/second-pass)^(12) 并没有提供比我们之前更多的任何东西。尽管如此，性能并不是现代开发者使用这两种方式的真正原因——它们为代码库带来的是可读性、继承模型和可维护性。\n\
    \n更复杂的问题包括[使用 canvas 高效绘制图像](http://jsperf.com/canvas-drawimage-vs-webgl-drawarrays)^(13)\
    \ 以及在使用（或不使用[类型数组](http://jsperf.com/typed-arrays-for-pixel-manipulation)^(15)\
    \ 的情况下[操作像素数据](http://jsperf.com/canvas-pixel-manipulation/30)^(14)\n\n在你的应用程序中使用这些技术之前，请务必仔细观察微基准（micro-benchmarks）。你们中的一些可能还记得\
    \ [JavaScript 模板对决](http://jsperf.com/dom-vs-innerhtml-based-templating/473)^(16)\
    \ 和[随后的扩展对决](http://jsperf.com/javascript-templating-shootoff-extended/26)^(17)。你希望确保测试不会受到你在现实应用中不太可能看到的限制的影响——请在实际代码中一起测试优化。\n\
    \n### V8 优化技巧\n\n虽然详细阐述每个 V8 优化超出了本章的范围，但确实有许多值得注意的技巧。记住这些点，你就能减少编写低性能代码的机会。\n\
    \n- 某些模式会导致 V8 放弃优化（bail out）。例如，一个 `try-catch` 就会导致这种放弃。关于哪些函数可以和不能被优化的更多信息，你可以使用\
    \ V8 自带的 `d8` 实用工具配合 `--trace-opt file.js`。\n- 如果你在意速度，请尽量保持函数是单态的（monomorphic），即确保变量（包括属性、数组和函数参数）始终包含具有相同隐藏类（hidden\
    \ class）的实例。例如，不要这样做：\n\n```javascript\nfunction add(x, y) { \n   return x+y;\n\
    } \n\nadd(1, 2); \nadd('a','b'); \nadd(my_custom_object, undefined);\n```\n- 不要从未初始化或已删除的元素中加载。这不会改变输出结果，但会让速度变慢。\n\
    - 不要编写巨大的函数，因为它们更难以优化。\n\n获取更多技巧，请观看 Daniel Clifford 的 Google I/O 演讲 [使用 V8 突破\
    \ JavaScript 速度限制](http://www.youtube.com/watch?v=UJPdhx5zTaw)^(18)，它很好地涵盖了这些主题。[针对\
    \ V8 优化——系列](http://floitsch.blogspot.co.uk/2012/03/optimizing-for-v8-introduction.html)^(19)\
    \ 也值得一。\n\n#### 对象对比数组：我应该用哪一个？\n\n- 如果你想存储一组数字，或相同类型的对象列表，请使用数组。\n- 如果你语义上需要一个具有许多属性（不同类型）的对象，请使用带有属性的对象。这在内存方面非常高效，而且速度也很快。\n\
    - 整数索引的元素，无论存储在数组还是对象中，其[迭代速度都比对象属性快得多](http://jsperf.com/performance-of-array-vs-object/3)^(20)。\n\
    - 对象上的属性相当复杂：它们可以使用 setter 创建，并具有不同的枚举性（enumerability）和可写性（writability）。数组中的项无法进行如此深层次的自定义——它们要么存在，要么不存在。在引擎层面，这允许在组织表示该结构的内存方面进行更多优化。这在数组包含数字时特别有利。例如，当你需要向量时，*不要*定义一个带有\
    \ `x`、`y` 属性的类。\n\nJavaScript 中对象和数组之间只有一个主要的区别，那就是数组的魔术属性 `length`。如果你自己手动跟踪这个属性，那么\
    \ V8 中的对象应该和数组一样快。\n\n#### 使用对象的技巧\n\n- 使用构造函数创建对象。这确保了所有用该函数创建的对象都具有相同的隐藏类，并有助于避免更改这些类。作为额外益处，它比\
    \ `Object.create()`http://jsperf.com/object-create-vs-constructor-vs-object-literal/7)^(21)\
    \ 稍微一点。\n- 对于应用程序中使用的不同对象类型数量或其复杂度没有限制（在合理范围内：长的原型链往往会损害性能，而只有少数属性的对象会获得一种快一点的特殊表示）。对于“热点”对象，尝试保持短的原型链和低字段数量。\n\
    \n### 对象克隆\n\n对象克隆是应用开发人员面临常见问题。虽然可以基准 V8 中各种实现处理此类类型问题的工作情况，但在复制任何内容时要务必小心。复制大型对象通常很慢——不要这样做。JavaScript\
    \ 中的 `for..in` 循环对此来说特别糟糕，因为它们的规范非常复杂，并且在任何引擎中可能永远不会快。\n\n当你绝对需要在性能关键代码路径中复制对象时（且你无法避免这种局面），请使用数组或自定义的“拷贝构造”函数来显式地复制每个属性。这可能是最快的方法：\n\
    \n```javascript\nfunction clone(original) {\n  this.foo = original.foo;\n  this.bar\
    \ = original.bar;\n}\nvar copy = new clone(original);\n```\n\n### 模块模式中的缓存函数\n\
    \n在使用模块模式时缓存函数可以带来性能提升。请看下方的示例，其中你熟悉的变体较慢，因为它不断创建成员函数的新副本。\n\n![性能改进](img/Screen-Shot-2012-11-06-at-10.42.10.png\
    \ \"使用模块和原型模式时的性能改进\")\n\n*使用模块或原型模式时的性能改进。*\n\n这是一个[原型与模块模式性能的测试](http://jsperf.com/prototypal-performance/12)^(22)。\n\
    \n"
- fmt: "\n```\n // Prototypal pattern\n  Klass1 = function () {}\n  Klass1.prototype.foo\
    \ = function () {\n      log('foo');\n  }\n  Klass1.prototype.bar = function ()\
    \ {\n      log('bar');\n  }\n\n  // Module pattern\n  Klass2 = function () {\n\
    \      var foo = function () {\n          log('foo');\n      },\n      bar = function\
    \ () {\n          log('bar');\n      };\n\n      return {\n          foo: foo,\n\
    \          bar: bar\n      }\n  }\n\n  // Module pattern with cached functions\n\
    \  var FooFunction = function () {\n      log('foo');\n  };\n  var BarFunction\
    \ = function () {\n      log('bar');\n  };\n\n  Klass3 = function () {\n     \
    \ return {\n          foo: FooFunction,\n          bar: BarFunction\n      }\n\
    \  }\n\n  // Iteration tests\n\n  // Prototypal\n  var i = 1000,\n      objs =\
    \ [];\n  while (i--) {\n      var o = new Klass1()\n      objs.push(new Klass1());\n\
    \      o.bar;\n      o.foo;\n  }\n\n  // Module pattern\n  var i = 1000,\n   \
    \   objs = [];\n  while (i--) {\n      var o = Klass2()\n      objs.push(Klass2());\n\
    \      o.bar;\n      o.foo;\n  }\n\n  // Module pattern with cached functions\n\
    \  var i = 1000,\n      objs = [];\n  while (i--) {\n      var o = Klass3()\n\
    \      objs.push(Klass3());\n      o.bar;\n      o.foo;\n  }\n// See the test\
    \ for full details\n```\n\n**Note:** If you don't require a class, avoid the trouble\
    \ of creating one. [Here'shttp://jsperf.com/prototypal-performance/54](http://jsperf.com/prototypal-performance/54)\
    \ an example of how to gain performance boosts by removing the class overhead\
    \ altogether.\n\n## Tips When Using Arrays\n\nNext let's look at a few tips for\
    \ arrays. In general, **don't delete array elements**. It would make the array\
    \ transition to a slower internal representation. When the key set becomes sparse,\
    \ V8 will eventually switch elements to dictionary mode, which is even slower.\n\
    \n### Array Literals\n\nArray literals are useful because they give a hint to\
    \ the VM about the size and type of the array. They're typically good for small\
    \ to medium sized arrays.\n\n```\n// Here V8 can see that you want a 4-element\
    \ array containing numbers:\nvar a = [1, 2, 3, 4];\n\n// Don't do this:\na = [];\
    \ // Here V8 knows nothing about the array\nfor(var i = 1; i <= 4; i++) {\n  \
    \   a.push(i);\n}\n```\n\n### Storage of Single Types Vs. Mixed Types\n\nIt's\
    \ never a good idea to mix values of different types (e.g. numbers, strings, undefined\
    \ or true/false) in the same array (i.e. `var arr = [1, “1”, undefined, true,\
    \ “true”]`)\n\n[Test of type inference](http://jsperf.com/type-inference-performance/24)\
    \ As we can see from the results, the array of `ints` is the fastest.\n\n### Sparse\
    \ Arrays vs. Full Arrays\n\nWhen you use sparse arrays, be aware that accessing\
    \ elements in them is much slower than in full arrays. That's because V8 doesn't\
    \ allocate a flat store for the elements if only a few of them are used. Instead,\
    \ it manages them in a dictionary, which saves space, but costs time on access.\n\
    \n[Test of sparse arrays versus full arrays](http://jsperf.com/sparse-arrays-full-arrays/25)\
    \ The full array `sum` and `sum` of all elements without zeros were actually the\
    \ fastest. Whether the full array contains zeroes or not should not make difference.\n\
    \n### Packed Vs. Holey Arrays\n\nAvoid “holes” in an array (created by deleting\
    \ elements or `a[x] = foo` with `x > a.length`). Even if a single element is deleted\
    \ from an otherwise “full” array, things will much slower.\n\n[Test of packed\
    \ versus holey arrays](http://jsperf.com/packed-vs-holey-arrays/26)\n\n### Pre-allocating\
    \ Arrays Vs. Growing As Go\n\nDon't pre-allocate large arrays (i.e. greater than\
    \ 64K) to their maximum size, instead grow as you go. Before we get to the performance\
    \ tests for this tip, keep in mind that this is specific to some JavaScript engines.\n\
    \n![Test of empty literal versus pre-allocated arrays in various browsers.](images/graph2.jpg\
    \ \"Empty Literal. Pre-Allocated Array In Various Browsers\")\n\nNitro (Safari)\
    \ actually treats pre-allocated arrays more favorably. However, in other engines\
    \ (`V8`, `SpiderMonkey`), not pre-allocating is more efficient.\n\n[Test of pre-allocated\
    \ arrays](http://jsperf.com/pre-allocated-arrays/27)\n\n```\n// Empty array\n\
    var arr = [];\nfor (var i = 0; i < 1000000; i++) {\n    arr[i] = i;\n}\n\n// Pre-allocated\
    \ array\nvar arr = new Array(1000000);\nfor (var i = 0; i < 1000000; i++) {\n\
    \    arr[i] = i;\n}\n```\n\n## Optimizing Your Application\n\nIn the world of\
    \ Web applications, **speed is everything**. No user wants a spreadsheet application\
    \ to take seconds to sum an entire column or a summary of their messages to take\
    \ a minute before it's ready. This is why squeezing every drop of extra performance\
    \ you out of code can sometimes be critical.\n\n[![An old phone on the screen\
    \ of an iPad.](images/improving-apps.jpg \"Old Phone On iPad\")](http://www.flickr.com/photos/peroloffberg/669174587/in/photostream/)\n\
    \n*Image source: [Per Olof Forsberg](http://www.flickr.com/photos/peroloffberg/669174587/in/photostream/).\
    \ While understanding and improving your application performance is useful, it\
    \ can also be difficult. We recommend the following steps to fix performance points:*\n\
    \n• Measure it: Find the slow spots in your application (~45%)\n• Understand it:\
    \ Find out what the actual problem is (~45%)\n• Fix it! (~10%)\n\nSome of the\
    \ tools and techniques recommended below can assist this process.\n\n### Benchmarking\n\
    \nThere are many ways to run benchmarks on JavaScript snippets to test their performance—the\
    \ general assumption being that benchmarking is simply two timestamps. One such\
    \ pattern was pointed out by the [jsPerf](http://jsperf.com/) team, and happens\
    \ to be used in [SunSpider](http://www.webkit.org/perf/sunspider/sunspider.html)‘s\
    \ and [Kraken](http://krakenbenchmark.mozilla.org/)‘s benchmark suites:\n\n```\n\
    var totalTime,\n    start = new Date,\n    iterations = 1000;\nwhile (iterations--)\
    \ {\n  // Code snippet goes here\n}\n// totalTime → the number of milliseconds\
    \ taken \n// to execute the code snippet 1000 times\ntotalTime = new Date - start;\n\
    ```\n\nHere, the code to be tested is placed within a loop and run a set number\
    \ of times (e.g. six). After this, the start date is subtracted from the end date\
    \ to find the time taken to perform the operations in the loop.\n\nHowever, this\
    \ oversimplifies how benchmarking should be done, especially if you want to run\
    \ the benchmarks in multiple browsers and environments. Garbage collection itself\
    \ can have an impact on your results. Even if you're using a solution like `window.performance`,\
    \ you still have to account for these pitfalls.\n\nRegardless of whether you are\
    \ simply running benchmarks against parts of your code, writing a test suite or\
    \ coding a benchmarking library, there's a lot more to JavaScript benchmarking\
    \ than you might think. For a more detailed guide to benchmarking, I highly recommend\
    \ reading [JavaScript Benchmarking](http://mathiasbynens.be/notes/javascript-benchmarking)\
    \ by Mathias Bynens and John-David Dalton.\n\n### Profiling\n\nThe Chrome Developer\
    \ Tools have good support for [JavaScript profiling](https://developers.google.com/chrome-developer-tools/docs/profiles).\
    \ You can use this feature to detect what functions are eating up the most of\
    \ your time so that you can then optimize them. This is important, as even small\
    \ changes to your codebase can have serious impacts on your overall performance.\n\
    \n![Profiles panel in Chrome Developer Tools.](images/profiling.jpg \"Profiles\
    \ Panel In Chrome Developer Tools\")\n\n*Profiles Panel in Chrome Developer Tools.*\n"
  raw: "```\n // Prototypal pattern\n  Klass1 = function () {}\n  Klass1.prototype.foo\
    \ = function () {\n      log('foo');\n  }\n  Klass1.prototype.bar = function ()\
    \ {\n      log('bar');\n  }\n\n  // Module pattern\n  Klass2 = function () {\n\
    \      var foo = function () {\n          log('foo');\n      },\n      bar = function\
    \ () {\n          log('bar');\n      };\n\n      return {\n          foo: foo,\n\
    \          bar: bar\n      }\n  }\n\n  // Module pattern with cached functions\n\
    \  var FooFunction = function () {\n      log('foo');\n  };\n  var BarFunction\
    \ = function () {\n      log('bar');\n  };\n\n  Klass3 = function () {\n     \
    \ return {\n          foo: FooFunction,\n          bar: BarFunction\n      }\n\
    \  }\n\n  // Iteration tests\n\n  // Prototypal\n  var i = 1000,\n      objs =\
    \ [];\n  while (i--) {\n      var o = new Klass1()\n      objs.push(new Klass1());\n\
    \      o.bar;\n      o.foo;\n  }\n\n  // Module pattern\n  var i = 1000,\n   \
    \   objs = [];\n  while (i--) {\n      var o = Klass2()\n      objs.push(Klass2());\n\
    \      o.bar;\n      o.foo;\n  }\n\n  // Module pattern with cached functions\n\
    \  var i = 1000,\n      objs = [];\n  while (i--) {\n      var o = Klass3()\n\
    \      objs.push(Klass3());\n      o.bar;\n      o.foo;\n  }\n// See the test\
    \ for full details\n```\n\n**Note:** If you don't require a class, avoid the trouble\
    \ of creating one. [Here'shttp://jsperf.com/prototypal-performance/54](http://jsperf.com/prototypal-performance/54)\
    \ an example of how to gain performance boosts by removing the class overhead\
    \ altogether.\n\n#### Tips When Using Arrays\n\nNext let's look at a few tips\
    \ for arrays. In general, **don't delete array elements**. It would make the array\
    \ transition to a slower internal representation. When the key set becomes sparse,\
    \ V8 will eventually switch elements to dictionary mode, which is even slower.\n\
    \n**Array Literals**\n\nArray literals are useful because they give a hint to\
    \ the VM about the size and type of the array. They're typically good for small\
    \ to medium sized arrays.\n\n```\n// Here V8 can see that you want a 4-element\
    \ array containing numbers:\nvar a = [1, 2, 3, 4];\n\n// Don't do this:\na = [];\
    \ // Here V8 knows nothing about the array\nfor(var i = 1; i <= 4; i++) {\n  \
    \   a.push(i);\n}\n```\n\n**Storage of Single Types Vs. Mixed Types**\n\nIt's\
    \ never a good idea to mix values of different types (e.g. numbers, strings, undefined\
    \ or true/false) in the same array (i.e. `var arr = [1, “1”, undefined, true,\
    \ “true”]`)\n\n[Test of type inference performance](http://jsperf.com/type-inference-performance/2)^([24](#chapter-7.xhtml_fn7_24))\n\
    \nAs we can see from the results, the array of `ints` is the fastest.\n\n**Sparse\
    \ Arrays vs. Full Arrays**\n\nWhen you use sparse arrays, be aware that accessing\
    \ elements in them is much slower than in full arrays. That's because V8 doesn't\
    \ allocate a flat backing store for the elements if only a few of them are used.\
    \ Instead, it manages them in a dictionary, which saves space, but costs time\
    \ on access.\n\n[Test of sparse arrays versus full arrays](http://jsperf.com/sparse-arrays-vs-full-arrays)^([25](#chapter-7.xhtml_fn7_25)).\n\
    \nThe full array `sum` and `sum` of all elements on an array without zeros were\
    \ actually the fastest. Whether the full array contains zeroes or not should not\
    \ make a difference.\n\n**Packed Vs. Holey Arrays**\n\nAvoid “holes” in an array\
    \ (created by deleting elements or `a[x] = foo` with `x > a.length`). Even if\
    \ only a single element is deleted from an otherwise “full” array, things will\
    \ be much slower.\n\n[Test of packed versus holey arrays](http://jsperf.com/packed-vs-holey-arrays)^([26](#chapter-7.xhtml_fn7_26)).\n\
    \n**Pre-allocating Arrays Vs. Growing As You Go**\n\nDon't pre-allocate large\
    \ arrays (i.e. greater than 64K elements) to their maximum size, instead grow\
    \ as you go. Before we get to the performance tests for this tip, keep in mind\
    \ that this is specific to only some JavaScript engines.\n\n![Test of empty literal\
    \ versus pre-allocated arrays in various browsers.](images/graph2.jpg \"Empty\
    \ Literal VS. Pre-Allocated Array In Various Browsers\")\n\n*Test of empty literal\
    \ versus pre-allocated array in various browsers.*\n\nNitro (Safari) actually\
    \ treats pre-allocated arrays more favorably. However, in other engines (V8, SpiderMonkey),\
    \ not pre-allocating is more efficient.\n\n[Test of pre-allocated arrays](http://jsperf.com/pre-allocated-arrays)^([27](#chapter-7.xhtml_fn7_27)).\n\
    \n```\n// Empty array\nvar arr = [];\nfor (var i = 0; i < 1000000; i++) {\n  \
    \  arr[i] = i;\n}\n\n// Pre-allocated array\nvar arr = new Array(1000000);\nfor\
    \ (var i = 0; i < 1000000; i++) {\n    arr[i] = i;\n}\n```\n\n### Optimizing Your\
    \ Application\n\nIn the world of Web applications, **speed is everything**. No\
    \ user wants a spreadsheet application to take seconds to sum up an entire column\
    \ or a summary of their messages to take a minute before it's ready. This is why\
    \ squeezing every drop of extra performance you can out of code can sometimes\
    \ be critical.\n\n[![An old phone on the screen of an iPad.](images/improving-apps.jpg\
    \ \"Old Phone On iPad Screen\")](http://www.flickr.com/photos/perolofforsberg/6691744587/in/photostream/)\n\
    \n*Image source: [Per Olof Forsberg](http://www.flickr.com/photos/perolofforsberg/6691744587/in/photostream/)^([28](#chapter-7.xhtml_fn7_28)).*\n\
    \nWhile understanding and improving your application performance is useful, it\
    \ can also be difficult. We recommend the following steps to fix performance pain\
    \ points:\n\n•Measure it: Find the slow spots in your application (~45%)\n\n•Understand\
    \ it: Find out what the actual problem is (~45%)\n\n•Fix it! (~10%)\n\nSome of\
    \ the tools and techniques recommended below can assist with this process.\n\n\
    #### Benchmarking\n\nThere are many ways to run benchmarks on JavaScript snippets\
    \ to test their performance—the general assumption being that benchmarking is\
    \ simply comparing two timestamps. One such pattern was pointed out by the [jsPerf](http://jsperf.com)^([29](#chapter-7.xhtml_fn7_29))\
    \ team, and happens to be used in [SunSpider](http://www.webkit.org/perf/sunspider/sunspider.html)^([30](#chapter-7.xhtml_fn7_30))‘s\
    \ and [Kraken](http://krakenbenchmark.mozilla.org/)^([31](#chapter-7.xhtml_fn7_31))‘s\
    \ benchmark suites:\n\n```\nvar totalTime,\n    start = new Date,\n    iterations\
    \ = 1000;\nwhile (iterations--) {\n  // Code snippet goes here\n}\n// totalTime\
    \ → the number of milliseconds taken \n// to execute the code snippet 1000 times\n\
    totalTime = new Date - start;\n```\n\nHere, the code to be tested is placed within\
    \ a loop and run a set number of times (e.g. six). After this, the start date\
    \ is subtracted from the end date to find the time taken to perform the operations\
    \ in the loop.\n\nHowever, this oversimplifies how benchmarking should be done,\
    \ especially if you want to run the benchmarks in multiple browsers and environments.\
    \ Garbage collection itself can have an impact on your results. Even if you're\
    \ using a solution like `window.performance`, you still have to account for these\
    \ pitfalls.\n\nRegardless of whether you are simply running benchmarks against\
    \ parts of your code, writing a test suite or coding a benchmarking library, there's\
    \ a lot more to JavaScript benchmarking than you might think. For a more detailed\
    \ guide to benchmarking, I highly recommend reading [JavaScript Benchmarking](http://mathiasbynens.be/notes/javascript-benchmarking)^([32](#chapter-7.xhtml_fn7_32))\
    \ by Mathias Bynens and John-David Dalton.\n\n#### Profiling\n\nThe Chrome Developer\
    \ Tools have good support for [JavaScript profiling](https://developers.google.com/chrome-developer-tools/docs/profiles)^([33](#chapter-7.xhtml_fn7_33)).\
    \ You can use this feature to detect what functions are eating up the most of\
    \ your time so that you can then go optimize them. This is important, as even\
    \ small changes to your codebase can have serious impacts on your overall performance.\n\
    \n![Profiles panel in Chrome Developer Tools.](images/profiling.jpg \"Profiles\
    \ Panel In Chrome Developer Tools\")\n\n*Profiles Panel in Chrome Developer Tools.*"
