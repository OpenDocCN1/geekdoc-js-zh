    ```\n\n• [Run this example.](http://provide.smashingmagazine.com/introduction-to-js-unit-testing-code/3-first-test.html)\
    \ (Make sure to enable a console such as Firebug or Chrome's Inspector.)\n\nThis\
    \ will create an ad-hoc testing framework, using only the console for output.\
    \ It has no dependencies to the DOM at all, so you could as well run it in a non-browser\
    \ environment, such as `Node.js` or `Rhino`, by extracting the code in the `script`\
    \ tag to its own file. If a test fails, it will output the expected and actual\
    \ result for that test. In the end, it will output a test summary with the total,\
    \ failed and passed number of tests. If all tests have passed, like they should\
    \ here, you would see the following in the console:\n\n> Of 6 tests, 0 failed,\
    \ 6 passed.\n\nTo see what a failed looks like, we can change something to break\
    \ it:\n\n> Expected 2 day ago, but was 2 days ago.\n\n> Of 6 tests, 1 failed,\
    \ 5 passed.\n\nWhile this ad-hoc approach is interesting as a proof of concept\
    \ (you really write a test runner in just a few lines of code), it's much more\
    \ practical to use an existing unit testing framework that provides better output\
    \ and more infrastructure for writing and organizing tests.\n\n### The QUnit Test\
    \ Suite\n\nThe choice of framework is mostly a matter of taste. For the rest of\
    \ this chapter, we'll use [QUnit](http://docs.jquery.com/Qunit) (pronounced “q-unit”),\
    \ because its style of describing tests is close to our ad-hoc test framework.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\" />\n<title>Refactored date examples</title>\n\
    \n<link rel=\"stylesheet\" href=\"qunit.css\" />\n<script src=\"qunit.js\"></script>\n\
    <script src=\"prettydate.js\"></script>\n\n<script>\ntest(\"prettydate basics\"\
    , function() {\n\tvar now = \"2008/01/28 22:25:00\";\n\tequal(prettyDate(now,\
    \ \"2008/01/28 22:24:30\"), \"just now\");\n\tequal(prettyDate(now, \"2008/01/28\
    \ 22:23:30\"), \"1 minute ago\");\n###equal(prettyDate(now, \"2008/01/28 21:23:30\"\
    ), \"1 hour ago\");\n\tequal(prettyDate(now, \"2008/01/27 22:23:30\"), \"Yesterday\"\
    );\n\tequal(prettyDate(now, \"2008/01/26 22:23:30\"), \"2 days ago\");\n\tequal(prettyDate(now,\
    \ \"2007/01/26 22:23:30\"), undefined);\n});\n</script>\n</head>\n<body>\n\t<div\
    \ id=\"qunit\"></div>\n</body>\n</html>\n```\n\n• [Run this example.](http://provide.smashingmagazine.com/introduction-to-js-unit-testing-code/4-qunit-test.html)\n\
    \nThree sections are worth a closer look here. Along with the usual HTML boilerplate,\
    \ we have three included files: two files for QUnit (`qunit.css` and `qunit.js`)\
    \ and the previous `prettydate.js`.\n\nThen, there's another script block with\
    \ the actual tests. The `test` method is called once, passing a string as the\
    \ first argument (naming the test) and passing a function as the second argument\
    \ (which will run the actual code for this test). This code then defines the `now`\
    \ variable, which gets reused below, then calls the `equal` method a few times\
    \ with varying arguments. The `equal` method is one of several assertions that\
    \ QUnit provides. The first argument is the result of a call to `prettyDate`,\
    \ with the `now` variable as the first argument and a `date` string as the second.\
    \ The second argument to `equal` is the expected result. If the two arguments\
    \ to `equal` are the same value, then the assertion will pass; otherwise, it will\
    \ fail.\n\nFinally, in the body element is some QUnit-specific markup. These elements\
    \ are optional. If present, QUnit will use them to output the test results.\n\n\
    The result is this:\n\n![images/4a-green.png](http://media.smashingmagazine.com/wp-content/uploads/2012/03/4a-green.png)\n\
    \nWith a failed test, the result would look something like this:\n\n![images/4b-red.png](http://media.smashingmagazine.com/wp-content/uploads/2012/03/4b-red.png)\n\
