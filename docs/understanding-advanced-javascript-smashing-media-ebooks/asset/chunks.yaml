  trans: "\nJavaScript 提供了多种类型转换的方法。如果你处理的是原始类型（字符串、数字、布尔），它可以变得非常简单（如所谓的“短写法”）：\n\
    \n```javascript\nfunction castaway(some_string, some_integer, some_boolean) {\n\
    \  some_string += \"\";\n  some_integer += 0; // parseInt(some_integer, 10) 是更安全的做法\n\
    \  some_boolean = !!some_boolean;\n}\n```\n\n我不提倡你在任何地方、任何时候这样做。但这些看起来无害的代码在集成代码时可能会节省时间并减少一些痛苦。\n\
    \n#### 将 `undefined` 视为预期值\n\n总会有那么，`undefined` 是你的 API 实际期望用于设置属性的一个值。这可能是为了“取消设置”某个属性，或者仅仅是为了优雅地处理错误输入，使你的\
    \ API 更健壮。要识别你的方法是否真的传递了 `undefined` 值，你可以检查 [`arguments`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Functions_and_function_scope/arguments)\
    \ 对象：\n\n```javascript\nfunction testUndefined(expecting, someArgument) {\n  if\
    \ (someArgument === undefined) {\n    console.log(\"someArgument was undefined\"\
    );\n  }\n  if (arguments.length > 1) {\n    console.log(\"but was actually passed\
    \ in\");\n  }\n}\n\ntestUndefined(\"foo\");\n// 输出: someArgument was undefined\n\
    testUndefined(\"foo\", undefined);\n// 输出: someArgument was undefined, but was\
    \ actually passed in\n```\n\n#### 命名参数\n\n```javascript\nevent.initMouseEvent(\n\
    \  \"click\", true, true, window, \n  123, 101, 202, 101, 202, \n  true, false,\
    \ false, false, \n  1, null);\n```\n\n[Event.initMouseEvent](https://developer.mozilla.org/en-US/docs/DOM/event.initMouseEvent)\
    \ 的函数签名简直是一场噩梦成真。如果不查阅文档，没有任何开发者能记得那个 `1`（倒数第二个参数）意味着什么。无论你的文档写得多么好，请尽可能努力让人们不需要去查阅！\n\
    \n#### 其他人是如何做的\n\n跳出我们喜爱的语言，我们发现 Python 拥有一种名为[命名参数](http://www.diveintopython.net/power_of_introspection/optional_arguments.html)\
    \ 的概念。它允许你在声明函数时为参数提供默认值，允许在调用上下文中指定属性名称：\n\n```javascript\nfunction namesAreAwesome(foo=1,\
    \ bar=2) {\n  console.log(foo, bar);\n}\n\nnamesAreAwesome();\n// 输出: 1, 2\n\n\
    namesAreAwesome(3, 4);\n// 输出: 3, 4\n\nnamesAreAwesome(foo=5, bar=6);\n// 输出:\
    \ 5, 6\n\nnamesAreAwesome(bar=6);\n// 输出: 1, 6\n```\n\n采用这种方案，`initMouseEvent()`\
    \ 可以看起来是一个自解释的函数调用：\n\n```javascript\nevent.initMouseEvent(\n  type=\"click\"\
    , \n  canBubble=true, \n  cancelable=true, \n  view=window, \n  detail=123,\n\
    \  screenX=101, \n  screenY=202, \n  clientX=101, \n  clientY=202, \n  ctrlKey=true,\
    \ \n  altKey=false, \n  shiftKey=false, \n  metaKey=false, \n  button=1, \n  relatedTarget=null);\n\
    ```\n\n在 JavaScript 中，这目前是不可能的。虽然“JavaScript 的下一个版本”（通常称为 ES.next, ES6 或 Harmony）将拥有[默认参数值](http://wiki.ecmascript.org/doku.php?id=harmony:parameter_default_values)和[剩余参数](http://wiki.ecmascript.org/doku.php?id=harmony:rest_parameters)，但目前还没有命名参数的迹象。\n\
    \n#### 参数映射\n\n由于 JavaScript 并不是 Python（而且 ES.next 还遥不可及），我们用来克服“参数森林”障碍的选择并不多。jQuery（以及几乎所有其他优秀的\
    \ API）都选择了使用“配置对象”的概念。[`jQuery.ajax()`](http://api.jquery.com/jquery.ajax/) 的签名提供了一个很好的例子。与其接受大量参数，我们只接收一个对象：\n\
    \n```javascript\nfunction nightmare(accepts, async, beforeSend, cache, complete,\
    \ /* 还有 28 个 */) {\n  if (accepts === \"text\") {\n    // 接收纯文本\n  }\n}\n\nfunction\
    \ dream(options) {\n  options = options || {};\n  if (options.accepts === \"text\"\
    ) {\n    // 接收纯文本\n  }\n}\n```\n\n这不仅防止了过长的函数签名，还让函数调用更具描述性。\n"
- fmt: "\nWith option objects, we've covered the topic of extensible configuration.\
    \ Let's talk about allowing the API user to extend the core and API itself. This\
    \ is an important topic, as it allows your code to focus on the important things,\
    \ while having API users implement edge-cases themselves. Good APIs are concise\
    \ APIs. Having a hand full of configuration options is fine, but having a couple\
    \ dozen of them makes your API feel bloated and opaque. Focus on the primary-use\
    \ cases, only do the things most of your API users will need. Everything else\
    \ should be left up to them. To allow API users to extend your code to suit their\
    \ needs, you have a couple of options…\n\n### Callbacks\n\nCallbacks can be used\
    \ to achieve extensibility by configuration. You can use callbacks to allow the\
    \ API user to override certain parts of your code. When you feel specific tasks\
    \ may be handled differently than your default code, refactor that code into a\
    \ configurable callback function to allow an API user to easily override that:\n\
    \n```\nvar default_options = {\n  // ...\n  position: function($elem, $parent)\
    \ {\n    $elem.css($parent.position());\n  }\n};\n\nfunction Widget(options) {\n\
    \  this.options = jQuery.extend({}, default_options, options || {});\n  this.create();\n\
    };\n\nWidget.prototype.create = function() {\n  this.$container = $(\"<div></div>\"\
    ).appendTo(document.body);\n  this.$thingie = $(\"<div></div>\").appendTo(this.$container);\n\
    \  return this;\n};\n\nWidget.protoype.show = function() {\n  this.options.position(this.$thingie,\
    \ this.$container);\n  this.$thingie.show();\n  return this;\n};\n```\n\n```\n\
    var widget = new Widget({\n  position: function($elem, $parent) {\n    var position\
    \ = $parent.position();\n    // position $elem at the lower right corner of $parent\n\
    \    position.left += $parent.width();\n    position.top += $parent.height();\n\
    \    $elem.css(position);\n  }\n});\nwidget.show();\n```\n\nCallbacks are also\
    \ a generic way to allow API users to customize elements your code has created:\n\
    \n```\n// default create callback doesn't do anything\ndefault_options.create\
    \ = function($thingie){};\n\nWidget.prototype.create = function() {\n  this.$container\
    \ = $(\"<div></div>\").appendTo(document.body);\n  this.$thingie = $(\"<div></div>\"\
    ).appendTo(this.$container);\n  // execute create callback to allow decoration\n\
    \  this.options.create(this.$thingie);\n  return this;\n};\n```\n\n```\nvar widget\
    \ = new Widget({\n  create: function($elem) {\n    $elem.addClass('my-style-stuff');\n\
    \  }\n});\nwidget.show();\n```\n\nWhenever you accept callbacks, be sure to document\
    \ their signature and provide examples to help API users customize your code.\
    \ Make sure you're consistent about the context (where `this` points to) in which\
    \ callbacks are executed in, and the arguments they accept.\n\n### Events\n\n\
    Events come naturally when working with the DOM. In larger application we use\
    \ events in various forms (e.g. PubSub) to enable communication between modules.\
    \ Events are particularly useful and feel most natural when dealing with UI widgets.\
    \ Libraries like jQuery offer simple interfaces allowing you to easily conquer\
    \ this domain.\n\nEvents interface best when there is something happening—hence\
    \ the name. Showing and hiding a widget could depend on circumstances outside\
    \ of your scope. Updating the widget when it's shown is also a very common thing\
    \ to do. Both can be achieved quite easily using jQuery's event interface, which\
    \ even allows for the use of delegated events:\n\n```\nWidget.prototype.show =\
    \ function() {\n  var event = jQuery.Event(\"widget:show\");\n  this.$container.trigger(event);\n\
    \  if (event.isDefaultPrevented()) {\n    // event handler prevents us from showing\n\
    \    return this;\n  }\n\n  this.options.position(this.$thingie, this.$container);\n\
    \  this.$thingie.show();\n  return this;\n};\n```\n\n```\n// listen for all widget:show\
    \ events\n$(document.body).on('widget:show', function(event) {\n  if (Math.random()\
    \ > 0.5) {\n    // prevent widget from showing\n    event.preventDefault();\n\
    \  }\n\n  // update widget's data\n  $(this).data(\"last-show\", new Date());\n\
    });\n\nvar widget = new Widget();\nwidget.show();\n```\n\nYou can freely choose\
    \ event names. Avoid using [native events](https://developer.mozilla.org/en-US/docs/DOM/DOM_event_reference)^([28](#chapter-8.xhtml_fn8_28))\
    \ for proprietary things and consider namespacing your events. jQuery UI's event\
    \ names are comprised of the widget's name and the event name `dialogshow`. I\
    \ find that hard to read and often default to `dialog:show`, mainly because it\
    \ is immediately clear that this is a custom event, rather than something some\
    \ browser might have secretly implemented.\n\n### Hooks\n\nTraditional getter\
    \ and setter methods can especially benefit from hooks. Hooks usually differ from\
    \ callbacks in their number and how they're registered. Where callbacks are usually\
    \ used on an instance level for a specific task, hooks are usually used on a global\
    \ level to customize values or dispatch custom actions. To illustrate how hooks\
    \ can be used, we'll take a peek at [jQuery's cssHooks](http://api.jquery.com/jQuery.cssHooks/)^([29](#chapter-8.xhtml_fn8_29)):\n\
    \n```\n// define a custom hook\njQuery.cssHooks.box = {\n  get: function(element,\
    \ prop) {\n    return $(element).css(prop);\n  },\n  set: function(element, prop,\
    \ value) {\n    $(element).css(prop, value);\n    return value;\n  }\n};\n```\n"
  raw: "With option objects, we've covered the topic of extensible configuration.\
    \ Let's talk about allowing the API user to extend the core and API itself. This\
    \ is an important topic, as it allows your code to focus on the important things,\
    \ while having API users implement edge-cases themselves. Good APIs are concise\
    \ APIs. Having a hand full of configuration options is fine, but having a couple\
    \ dozen of them makes your API feel bloated and opaque. Focus on the primary-use\
    \ cases, only do the things most of your API users will need. Everything else\
    \ should be left up to them. To allow API users to extend your code to suit their\
    \ needs, you have a couple of options…\n\n#### Callbacks\n\nCallbacks can be used\
    \ to achieve extensibility by configuration. You can use callbacks to allow the\
    \ API user to override certain parts of your code. When you feel specific tasks\
    \ may be handled differently than your default code, refactor that code into a\
    \ configurable callback function to allow an API user to easily override that:\n\
    \n```\nvar default_options = {\n  // ...\n  position: function($elem, $parent)\
    \ {\n    $elem.css($parent.position());\n  }\n};\n\nfunction Widget(options) {\n\
    \  this.options = jQuery.extend({}, default_options, options || {});\n  this.create();\n\
    };\n\nWidget.prototype.create = function() {\n  this.$container = $(\"<div></div>\"\
    ).appendTo(document.body);\n  this.$thingie = $(\"<div></div>\").appendTo(this.$container);\n\
    \  return this;\n};\n\nWidget.protoype.show = function() {\n  this.options.position(this.$thingie,\
    \ this.$container);\n  this.$thingie.show();\n  return this;\n};\n```\n\n```\n\
    var widget = new Widget({\n  position: function($elem, $parent) {\n    var position\
    \ = $parent.position();\n    // position $elem at the lower right corner of $parent\n\
    \    position.left += $parent.width();\n    position.top += $parent.height();\n\
    \    $elem.css(position);\n  }\n});\nwidget.show();\n```\n\nCallbacks are also\
    \ a generic way to allow API users to customize elements your code has created:\n\
    \n```\n// default create callback doesn't do anything\ndefault_options.create\
    \ = function($thingie){};\n\nWidget.prototype.create = function() {\n  this.$container\
    \ = $(\"<div></div>\").appendTo(document.body);\n  this.$thingie = $(\"<div></div>\"\
    ).appendTo(this.$container);\n  // execute create callback to allow decoration\n\
    \  this.options.create(this.$thingie);\n  return this;\n};\n```\n\n```\nvar widget\
    \ = new Widget({\n  create: function($elem) {\n    $elem.addClass('my-style-stuff');\n\
    \  }\n});\nwidget.show();\n```\n\nWhenever you accept callbacks, be sure to document\
    \ their signature and provide examples to help API users customize your code.\
    \ Make sure you're consistent about the context (where `this` points to) in which\
    \ callbacks are executed in, and the arguments they accept.\n\n#### Events\n\n\
    Events come naturally when working with the DOM. In larger application we use\
    \ events in various forms (e.g. PubSub) to enable communication between modules.\
    \ Events are particularly useful and feel most natural when dealing with UI widgets.\
    \ Libraries like jQuery offer simple interfaces allowing you to easily conquer\
    \ this domain.\n\nEvents interface best when there is something happening—hence\
    \ the name. Showing and hiding a widget could depend on circumstances outside\
    \ of your scope. Updating the widget when it's shown is also a very common thing\
    \ to do. Both can be achieved quite easily using jQuery's event interface, which\
    \ even allows for the use of delegated events:\n\n```\nWidget.prototype.show =\
    \ function() {\n  var event = jQuery.Event(\"widget:show\");\n  this.$container.trigger(event);\n\
    \  if (event.isDefaultPrevented()) {\n    // event handler prevents us from showing\n\
    \    return this;\n  }\n\n  this.options.position(this.$thingie, this.$container);\n\
    \  this.$thingie.show();\n  return this;\n};\n```\n\n```\n// listen for all widget:show\
    \ events\n$(document.body).on('widget:show', function(event) {\n  if (Math.random()\
    \ > 0.5) {\n    // prevent widget from showing\n    event.preventDefault();\n\
    \  }\n\n  // update widget's data\n  $(this).data(\"last-show\", new Date());\n\
    });\n\nvar widget = new Widget();\nwidget.show();\n```\n\nYou can freely choose\
    \ event names. Avoid using [native events](https://developer.mozilla.org/en-US/docs/DOM/DOM_event_reference)^([28](#chapter-8.xhtml_fn8_28))\
    \ for proprietary things and consider namespacing your events. jQuery UI's event\
    \ names are comprised of the widget's name and the event name `dialogshow`. I\
    \ find that hard to read and often default to `dialog:show`, mainly because it\
    \ is immediately clear that this is a custom event, rather than something some\
    \ browser might have secretly implemented.\n\n### Hooks\n\nTraditional getter\
    \ and setter methods can especially benefit from hooks. Hooks usually differ from\
    \ callbacks in their number and how they're registered. Where callbacks are usually\
    \ used on an instance level for a specific task, hooks are usually used on a global\
    \ level to customize values or dispatch custom actions. To illustrate how hooks\
    \ can be used, we'll take a peek at [jQuery's cssHooks](http://api.jquery.com/jQuery.cssHooks/)^([29](#chapter-8.xhtml_fn8_29)):\n\
    \n```\n// define a custom css hook\njQuery.cssHooks.custombox = {\n  get: function(elem,\
    \ computed, extra) {\n    return $.css(elem, 'borderRadius') == \"50%\"\n    \
    \  ? \"circle\"\n      : \"box\";\n  },\n  set: function(elem, value) {\n    elem.style.borderRadius\
    \ = value == \"circle\"\n      ? \"50%\"\n      : \"0\";\n  }\n};\n\n// have .css()\
    \ use that hook\n$(\"#some-selector\").css(\"custombox\", \"circle\");\n```\n\n\
    By registering the hook `custombox` we've given jQuery's `.css()` method the ability\
    \ to handle a CSS property it previously couldn't. In my article [jQuery hooks](http://blog.rodneyrehm.de/archives/11-jQuery-Hooks.html)^([30](#chapter-8.xhtml_fn8_30)),\
    \ I explain the other hooks that jQuery provides and how they can be used in the\
    \ field. You can provide hooks much like you would handle callbacks:\n\n```\n\
    DateInterval.nameHooks = {\n  \"yesterday\" : function() {\n    var d = new Date();\n\
    \    d.setTime(d.getTime() - 86400000);\n    d.setHours(0);\n    d.setMinutes(0);\n\
    \    d.setSeconds(0);\n    return d;\n  }\n};\n\nDateInterval.prototype.start\
    \ = function(date) {\n  if (date === undefined) {\n    return new Date(this.startDate.getTime());\n\
    \  }\n\n  if (typeof date === \"string\" && DateInterval.nameHooks[date]) {\n\
    \    date = DateInterval.nameHooks[date]();\n  }\n\n  if (!(date instanceof Date))\
    \ {\n    date = new Date(date);\n  }\n\n  this.startDate.setTime(date.getTime());\n\
    \  return this;\n};\n```\n\n```\nvar di = new DateInterval();\ndi.start(\"yesterday\"\
    );\n```\n\nIn a way, hooks are a collection of callbacks designed to handle custom\
    \ values within your own code. With hooks you can stay in control of almost everything,\
    \ while still giving API users the option to customize.\n\n### Generating Accessors\n\
    \n![Duplication](images/duplication.jpg \"Duplication\")\n\nAny API is likely\
    \ to have multiple accessor methods (getters, setters, executors) doing similar\
    \ work. Coming back to our `DateInterval` example, we're most likely providing\
    \ `start()` and `end()` to allow manipulation of intervals. A simple solution\
    \ could look like:\n\n```\nDateInterval.prototype.start = function(date) {\n \
    \ if (date === undefined) {\n    return new Date(this.startDate.getTime());\n\
    \  }\n\n  this.startDate.setTime(date.getTime());\n  return this;\n};\n\nDateInterval.prototype.end\
    \ = function(date) {\n  if (date === undefined) {\n    return new Date(this.endDate.getTime());\n\
    \  }\n\n  this.endDate.setTime(date.getTime());\n  return this;\n};\n```\n\nAs\
    \ you can see we have a lot of repeating code. A DRY (Don't Repeat Yourself) solution\
    \ might use this generator pattern:\n\n```\nvar accessors = [\"start\", \"end\"\
    ];\nfor (var i = 0, length = accessors.length; i < length; i++) {\n  var key =\
    \ accessors[i];\n  DateInterval.prototype[key] = generateAccessor(key);\n}\n\n\
    function generateAccessor(key) {\n  var value = key + \"Date\";\n  return function(date)\
    \ {\n    if (date === undefined) {\n      return new Date(this[value].getTime());\n\
    \    }\n\n    this[value].setTime(date.getTime());\n    return this;\n  };\n}\n\
    ```"
