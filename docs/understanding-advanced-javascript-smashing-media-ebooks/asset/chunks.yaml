  trans: '


    - [JavaScript 内存优化](http://blog.tojicode.com/2012/03/javascript-memory-optimization-and.html)^(45)
    和 [查找内存泄漏](http://gent.ilcore.com/2011/08/finding-memory-leaks.html)^(46)


    ## JavaScript 内存泄漏检测器


    为了帮助发现 JavaScript 内存泄漏，我的两位 Google 同事（Marja Hölttä 和 Jochen Eisinger）开发了一个可以与
    Chrome 开发者工具（具体为远程检查协议）协同工作的工具，它可以获取堆栈快照并检测哪些对象导致了泄漏。


    ![一个用于检测 JavaScript 内存泄漏的工具。](img/leak.jpg "用于检测 JavaScript 内存泄漏的工具")


    *一个用于检测 JavaScript 内存泄漏的工具。*


    关于[如何使用该工具](http://google-opensource.blogspot.de/2012/08/leak-finder-new-tool-for-javascript.html)^(47)
    有专门的一篇文章，我鼓励你查看或者访问 [Leak Finder 项目页面](http://code.google.com/p/leak-finder-for-javascript/)^(48)。


    更多信息：如果你在好奇为什么像这样的工具还没有集成到我们的开发者工具中，原因有两个。它最初被开发是为了帮助我们捕获 Closure Library 中某些特定的内存场景，而且作为外部工具更有意义（如果以后实现了堆栈分析扩展
    API，它甚至可以作为一个扩展存在）。


    ## 用于调试优化和垃圾回收的 V8 标志


    Chrome 支持通过 `js-flags` 标志直接向 V8 传递多个标志，用以获取有关引擎优化情况的更详细输出。例如，这可以追踪 V8 的优化情况：


    ```

    "/Applications/Google Chrome/Google Chrome" --js-flags="--trace-opt --trace-deopt"

    ```


    Windows 用户将需要运行 `chrome.exe --js-flags="--trace-opt --trace-deopt"`


    在开发应用程序时，可以使用以下 V8 标志：


    • `trace-opt` – 记录已优化函数的名称，并显示优化器因无法解决某些问题而跳过代码的地方。


    • `trace-deopt` – 记录运行期间必须去优化的代码列表。


    • `trace-gc` – 在每次垃圾回收时记录一条追踪行。


    V8 的帧处理脚本用 `*`（星号）标记已优化函数，用 `~`（波浪号）标记未优化函数。


    如果你感兴趣了解更多关于 V8 标志以及 V8 内部工作原理，我强烈建议阅读 Vyacheslav Egorov 关于[V8 内部机制的优秀文章](http://mrale.ph/blog/2011/12/18/v8-optimization-checklist.html)^(49),它总结了目前关于该领域的最佳资源。


    ## 高分辨率时间和导航计时 API


    [高分辨率时间](http://www.w3.org/TR/hr-time/)^(50) (HRT) 是一个 JavaScript 接口，提供亚毫秒精度的当前时间，且不受系统时钟偏移或用户调整的影响。将其视为一种比我们之前使用
    `new Date` 和 `Date.now()` 更精确的测量方法。这在我们编写性能基准时非常有帮助。


    ![高分辨率时间 (HRT) 提供亚毫秒精度的当前时间。](img/perfnow.jpg "高分辨率时间 (HRT) 提供亚毫秒精度的当前时间")


    *高分辨率时间 (HRT) 提供亚毫秒精度的当前时间。*


    HRT 目前在 Chrome（稳定版）中通过 `window.performance.webkitNow()`可用，但前缀在 Chrome Canary 中已被移除，使其可以通过
    `window.performance.now()` 使用。Paul Irish 在 HTML5Rocks 的一文中写了[更多关于 HRT 的内容](http://updates.html5rocks.com/2012/08/When-milliseconds-are-not-enough-performance-now)^(51)。


    所以，我们现在知道了当前时间，但我们需要一个用于准确测量 Web 性能的 API 呢？


    嗯，现在该 API 也可用 [导航计时 API](http://dvcs.w3.org/hg/webperf/raw-file/tip/specs/NavigationTiming/Overview.html)^(52)
    了。该 API 提供了一种简单的方法来获取网页加载并展示给用户时记录的准确且详细的时间测量。计时信息通过 `window.performance.timing`
    暴露，你可以直接在控制台中使用：


    ![控制台中显示计时信息。](img/performance.jpg "控制台中显示计时信息")


    *控制台中显示计时信息。*


    通过查看上述数据，我们可以提取出一些非常有用的信息。例如，网络延迟为 `responseEnd-fetchStart`，页面从服务器接收后到加载完成的时间为
    `loadEventEnd-responseEnd`，而从导航到页面加载之间的处理时间为 `loadEventEnd-navigationStart`。


    ## about:memory 和 about:tracing


    Chrome 中的 `tracing` 提供了浏览器性能的直观视图。


    ![tracing 提供了浏览器性能的直观视图。](img/tracing.jpg "Tracing 提供了浏览器性能的直观视图")


    *`tracing` 提供了浏览器性能的直观视图。*


    该工具真正有用的地方在于它允许捕获 Chrome 正在执行的分析数据。Lilli Thompson 写了一篇关于使用 `tracing` 对 WebGL 进行分析的[优秀文章](http://www.html5rocks.com/en/games/abouttracing/)^(54。在
    Chrome 中导航到 `memory` 也很有用，它可以显示每个标签页内存内存有助于有助于内存内存。关于导航计时的更多细节，请阅读 Sam Dutton
    出色的[测量页面速度](http://www.html5rocks.com/en/webperformance/basics/)^(53)。


    ## 结论


    正如我们看到的，JavaScript 引擎世界存在许多隐藏的性能陷阱，并没有可以提高性能的“银弹”。只有当在（真实的）测试环境中结合多种优化方案时，才能获得最大的收益。但即便如此，理解引擎如何解释和优化你的代码也能为你提供调整应用程序的见解。


    **测量它。理解它。修复它。** 循环复始。


    ![测量。](http://www.flickr.com/photos/38891164@N02/426660987/)


    *图片来源：[Sally Hunter](http://www.flickr.com/photos/38891164@N02/426660987/)^(55).*


