    # 设计更好的 JavaScript API


    作者 Rodney Rehm


    在某些时刻，你会发现自己编写的 JavaScript 代码超过了 jQuery 插件的几行代码。你的代码将执行很多功能；（理想情况下）将被许多以不同方式处理代码的人使用。他们有不同的需求、知识和期望。


