    # 使用 JavaScript 和 DOM 分析网络特性


    作者：Philip Tellis


    作为 Web 开发人员，我们对使用 JavaScript 开发有一种亲。。无论后端使用什么语言，JavaScript 和浏览器都是用户端主要的语言-平台组合。它有许多用途，从无聊到增强体验应有。


    ![](http://www.flickr.com/photos/hertzen/4878410201/in/photostream)


    *(图片：[Viktor Hertz](http://www.flickr.com/photos/hertzen/4878410201/in/photostream)^(1))*


    在本章中，我们将查看一些操作 JavaScript 的方法，从浏览器内部确定各种网络特性——这些特性以前只有直接与操作系统接口的应用程序才能使用。其中许多发现是在构建
    [Boomerang](http://github.com/bluesmoon/boomerang)^(2) 项目以衡量真实用户性能时的。


    ## 网络到底是什么？


    网络有许多层，但我们中的 Web 开发人员最关心的是 HTTP，它运行在 [TCP](http://en.wikipedia.org/wiki/Transmission_Control_Protocol)^(3)
    和 [IP](http://en.wikipedia.org/wiki/Internet_Protocol)^(4) 之上（统称为 [互联网协议族](http://en.wikipedia.org/wiki/Internet_protocol_suite)^(5)）。在此之下还有几层，但大多数情况下，它运行在铜线、光纤还是通过[家养的](http://www.faqs.org/rfcs/rfc2549.html)^(6)
    [信鸽](http://en.wikipedia.org/IP_over_Avian_Carriers)^(7) 上并不影响我们关心的层或特性。


    ### 网络延迟


    网络延迟通常是指信号跨越网络并获得响应所需的时间。它通常也被称为往返时间（roundtrip time）或 ping 时间，因为它是 `ping` 命令报告的时间。虽然这对于诊断网络问题的网络工程师来说很有趣，但
    Web 开发人员更关心发送 HTTP 请求并获得响应所需的时间。因此，我们将 HTTP 延迟定义为发送尽可能小的 HTTP 请求并获得具有微不足道服务器处理时间的响应的时间（即服务器所做的仅仅是发送响应）。


    **酷贴士：** 光和电[通过光纤](http://en.wikipedia.org/wiki/Optical_fiber "关于光纤的 Wikipedia
    条目")^(8) 和铜线传输的速度为真空中光速的 66%，或每秒 20 × 10⁸ 公里。A 和 B 点之间网络延迟的良好近似值是光或电传输该距离所需[四倍](http://rescomp.stanford.edu/~cheshire/rants/Latency.html)^(9)。[Greg
    的地图](http://rescomp.stanford.edu/~cheshire/rants/Latency.html)^(10) 是一个很好的可视化方法。


    ### 网络吞吐量


    网络吞吐量告诉我们网络利用情况如何。


    ### DNS


    DNS 与其他所有事物都有点不同。我们将看到。


    ## 使用 JavaScript 测量延迟


    ![HTTP GET 请求](img/http-get.png)


    我的第一个直觉是测量延迟仅仅意味着每方向发送一个数据包并计时。在 JavaScript 中做到这一点相当容易：


    ```javascript

    var ts, rtt, img = new Image;

    img.onload=function() { rtt=(+new Date - ts) };

    ts = +new Date;

    img.src="/1x1.gif";

    ```


    我们启动一个计时器，然后加载 1 像素的 GIF 并测量其 `onload` 事件触发的时间。GIF 本身的大小为 35 字节，即使加上 HTTP 头部也能放入单个数据包。


    ### TCP 握手和 HTTP Keep-Alive


    ![TCP 握手：SYN-ACK/SYN-ACK](img/tcp-handshake.png)


    加载 Web 页面、图像或其他 Web 资源时，浏览器会对指定的 Web 服务器建立 TCP 连接，并在连接上发送 HTTP `GET` 请求。TCP 连接和
    HTTP 请求的细节对用户和 Web 开发人员都是隐藏的。但是，如果我们需要分析网络特性，这些细节就是重要的。


    当两个主机（在本例中为浏览器和服务器）之间首次打开 TCP 连接时，它们需要进行“握手”。这是通过在两个主机之间发送三个数据包来实现的。发起连接主机（在本例中为浏览器）首先发送一个
    SYN 包，这意思是“让我们同步吧。我想和你交谈。你准备好跟我交谈了吗？”如果另一个主机（在本例中为服务器）准备好了，它会返回一个 ACK，这意思是“我确认（ACKnowledge）了你的
    SYN。”它还发送了自己的 SYN，这意思是“我也想同步。你准备好了吗？”Web 浏览器随后通过自己的 ACK 完成握手，连接即可建立。连接可能会失败，但连接失败背后的过程超出了本章的范围。


    一旦连接建立，它将一直保持开放，直到双方都决定关闭它，通过类似的握手来实现。


    '
- fmt: "\nWhen we throw HTTP over TCP, we now have an HTTP client (typically a browser)\
    \ that initiates the TCP connection and sends the first data packet (a `GET` request,\
    \ for example). If we're using HTTP/1.1 (which almost everyone does today), then\
    \ the default will be to use HTTP keep-alive (`Connection: keep-alive`). This\
    \ means that several HTTP requests may take place over the same TCP connection.\
    \ This is good, because it means that we reduce the overhead of the handshake\
    \ (three extra packets).\n\nNow, unless we have [HTTP pipelining](http://en.wikipedia.org/wiki/HTTP_pipelining)^([11](#chapter-2.xhtml_fn2_11))\
    \ turned on (and most browsers and servers turn it off), these requests will happen\
    \ serially.\n\n![HTTP keep-alive](images/http-keepalive.png)\n\nWe can now modify\
    \ our code a bit to take the time of the TCP handshake into account, and measure\
    \ latency accordingly.\n\n```javascript\nvar t=[], n=2, tcp, rtt;\nvar ld = function()\
    \ {\n   t.push(+new Date);\n   if(t.length > n) \n     done();\n   else {\n  \
    \   var img = new Image;\n     img.onload = ld;\n     img.src=\"/1x1.gif?\" +\
    \ Math.random()\n                         + '=' + new Date;\n   }\n};\n\nvar done\
    \ = function() {\n  rtt=t[2]-t[1];\n  tcp=t[1]-t[0]-rtt;\n};\nld();\n```\n\nWith\
    \ this code, we can measure both latency and the TCP handshake time. There is\
    \ a chance that a TCP connection was already active and that the first request\
    \ went through on that connection. In this case, the two times will be very close\
    \ to each other. In all other cases, `rtt`, which requires two packets, should\
    \ be approximately 66% of `tcp`, which requires three packets. Note that I say\
    \ “approximately,” because network jitter and different routes at the IP layer\
    \ can make two packets in the same TCP connection take different lengths of time\
    \ to get through.\n\nYou'll notice here that we've ignored the fact that the first\
    \ image might have also required a DNS lookup. We'll look at that in part 2.\n\
    \n### Measuring Network Throughput With JavaScript\n\nAgain, our first instinct\
    \ with this test was just to download a large image and measure how long it takes.\
    \ Then `size/time` should tell us the throughput.\n\nFor the purpose of this code,\
    \ let's assume we have a global object called `image`, with details of the image's\
    \ URL and size in bits.\n\n```javascript\n// Assume global object\n// image={\
    \ url: …, size: … }\nvar ts, rtt, bw, img = new Image;\nimg.onload=function()\
    \ {\n   rtt=(+new Date - ts);\n   bw = image.size*1000/rtt;    // rtt is in ms\n\
    };\nts = +new Date;\nimg.src=image.url;\n```\n\nOnce this code has completed executing,\
    \ we should have the network throughput in kilobits per second stored in `bw`.\n\
    \nUnfortunately, it isn't that simple, because of something called [TCP slow-start](http://en.wikipedia.org/wiki/Slow-start)^([12](#chapter-2.xhtml_fn2_12)).\n\
    \n#### Slow-Start\n\nIn order to avoid network congestion, both ends of a TCP\
    \ connection will start sending data slowly and wait for an acknowledgement (an\
    \ ACK packet). Remember than an ACK packet means, “I ACKnowledge what you just\
    \ sent me.” Every time it receives an ACK without timing out, it assumes that\
    \ the other end can operate faster and will send out more packets before waiting\
    \ for the next ACK. If an ACK doesn't come through in the expected timeframe,\
    \ it assumes that the other end cannot operate fast enough and so backs off.\n\
    \n[![TCP window sizes for slow-start](images/tcp-windows.png)](http://media.smashingmagazine.com/wp-content/uploads/2011/10/tcp-windows.png)\n\
    \nThis means that our throughput test above would have been fine as long as our\
    \ image is small enough to fit within the current TCP window, which at the start\
    \ is set to 2\\. While this is fine for slow networks, a fast network really wouldn't\
    \ be taxed by so small an image.\n\nInstead, we'll try by sending across images\
    \ of increasing size and measuring the time each takes to download.\n\nFor the\
    \ purpose of the code, the global `image` object is now an array with the following\
    \ structure:\n\n```javascript\nvar image = [\n  {url: …, size: … }\n];\n```\n\n\
    An array makes it easy to iterate over the list of images, and we can easily add\
    \ large images to the end of the array to test faster network connections.\n\n\
    ```javascript\nvar i=0;\nvar ld = function() {\n   if(i > 0)\n      image[i-1].end\
    \ = +new Date;\n   if(i >= image.length)\n      done();\n   else {\n      var\
    \ img = new Image;\n      img.onload = ld;\n      image[i].start = +new Date;\n\
    \      img.src=image[i].url;\n   }\n   i++;\n};\n```\n\nUnfortunately, this breaks\
    \ down when a very slow connection hits one of the bigger images; so, instead,\
    \ we add a `timeout` value for each image, designed so that we hit upon common\
    \ network connection speeds quickly. Details of the image sizes and `timeout`\
    \ values are listed [in this spreadsheet](https://spreadsheets.google.com/ccc?key=0).\n\
    \nWait, the provided text had some repetition/fragmentation in the end section.\
    \ I will clean up the logic based on the provided snippet:\n\n```javascript\n\
    var i=0;\nvar ld = function() {\n   if(i > 0)\n      image[i-1].end = +new Date;\n\
    \   if(i >= image.length)\n      done();\n   else {\n      var img = new Image;\n\
    \      img.onload = ld;\n      image[i].start = +new Date;\n      img.src=image[i].url;\n\
    \   }\n   i++;\n};\n```\n\nWait, looking at the source text provided at the end,\
    \ there is a messy block of repeated code. I will format the final logic provided\
    \ in the source:\n\n```javascript\nvar i=0;\nvar ld = function() {\n   if(i >\
    \ 0)\n      image[i-1].end = +new Date;\n   if(i >= image.length)\n      done();\n\
    \   else {\n      var img = new Image;\n      img.onload = ld;\n      image[i].start\
    \ = +new Date;\n      img.src=image[i].url;\n   }\n   i++;\n};\n```\n\nActually,\
    \ the source text provided has a duplicate/broken block at the end. I will provide\
    \ the clean version of the intended logic.\n\n### Summary And References\n\nThat's\
    \ it for part 1 of this series. We've looked at how the packets that make up a\
    \ request get through browser and server, how this changes over time, and how\
    \ we can use JavaScript and a little knowledge of statistics to make educated\
    \ guesses at the characteristics we're working with.\n\nHere's a list of resources\
    \ that were helpful in compiling this document.\n\n•[Greg's Map](http://cablemap.info/)^([14](#chapter-2.xhtml_fn2_14)),\
    \ Greg Mahnecht\n\nAggregated information about undersea cables.\n\n•“[Transmission\
    \ Control Protocol](http://en.wikipedia.org/wiki/Transmission_Control_Protocol)^([15](#chapter-2.xhtml_fn2_15),”\
    \ Wikipedia\n\nThis page links to all of the RFCs.\n\n•[*TCP/IP Illustrated, Vol.\
    \ 1: The Protocols*](http://www.amazon.com/TCP-Illustrated-Vol-Wesley-Professional/dp/0201633469)^([16](#chapter-2.xhtml_fn2_16)),\
    \ by Richard Stevens\n\nA link to the book on Amazon.\n\n•“[Slow-Start](http://en.wikipedia.org/wiki/Slow-start)^([17](#chapter-2.xhtml_fn2_17)),”\
    \ Wikipedia\n\nAlso, see the links above for congestion control and Nagle's Algorithm.\n\
    \n•“[Bandwidth Images Sizes](https://spreadsheets.google.com/ccc?key=0AplxPyCzmQi6dDRBN2JEd190N1hhV1N5cHQtdBMUE&hl=en_GB)^([18](#chapter-2.xhtml_fn2_18),”\
    \ Google Spreadsheet\n\nThis is based on the research done while building Boomerang.\n\
    \n•[Boomerang](http://github.com/bluesmoon/boomerang)^([19](#chapter-2.xhtml_fn2_19))\n\
    \nThe Boomerang project on GitHub, where much of this has been implemented.\n"
  raw: "When we throw HTTP over TCP, we now have an HTTP client (typically a browser)\
    \ that initiates the TCP connection and sends the first data packet (a `GET` request,\
    \ for example). If we're using HTTP/1.1 (which almost everyone does today), then\
    \ the default will be to use HTTP keep-alive (`Connection: keep-alive`). This\
    \ means that several HTTP requests may take place over the same TCP connection.\
    \ This is good, because it means that we reduce the overhead of the handshake\
    \ (three extra packets).\n\nNow, unless we have [HTTP pipelining](http://en.wikipedia.org/wiki/HTTP_pipelining)^([11](#chapter-2.xhtml_fn2_11))\
    \ turned on (and most browsers and servers turn it off), these requests will happen\
    \ serially.\n\n![HTTP keep-alive](images/http-keepalive.png)\n\nWe can now modify\
    \ our code a bit to take the time of the TCP handshake into account, and measure\
    \ latency accordingly.\n\n```\nvar t=[], n=2, tcp, rtt;\nvar ld = function() {\n\
    \   t.push(+new Date);\n   if(t.length > n) \n     done();\n   else {\n     var\
    \ img = new Image;\n     img.onload = ld;\n     img.src=\"/1x1.gif?\" + Math.random()\n\
    \                         + '=' + new Date;\n   }\n};\n\nvar done = function()\
    \ {\n  rtt=t[2]-t[1];\n  tcp=t[1]-t[0]-rtt;\n};\nld();\n```\n\nWith this code,\
    \ we can measure both latency and the TCP handshake time. There is a chance that\
    \ a TCP connection was already active and that the first request went through\
    \ on that connection. In this case, the two times will be very close to each other.\
    \ In all other cases, `rtt`, which requires two packets, should be approximately\
    \ 66% of `tcp`, which requires three packets. Note that I say “approximately,”\
    \ because network jitter and different routes at the IP layer can make two packets\
    \ in the same TCP connection take different lengths of time to get through.\n\n\
    You'll notice here that we've ignored the fact that the first image might have\
    \ also required a DNS lookup. We'll look at that in part 2.\n\n### Measuring Network\
    \ Throughput With JavaScript\n\nAgain, our first instinct with this test was just\
    \ to download a large image and measure how long it takes. Then `size/time` should\
    \ tell us the throughput.\n\nFor the purpose of this code, let's assume we have\
    \ a global object called `image`, with details of the image's URL and size in\
    \ bits.\n\n```\n// Assume global object\n// image={ url: …, size: … }\nvar ts,\
    \ rtt, bw, img = new Image;\nimg.onload=function() {\n   rtt=(+new Date - ts);\n\
    \   bw = image.size*1000/rtt;    // rtt is in ms\n};\nts = +new Date;\nimg.src=image.url;\n\
    ```\n\nOnce this code has completed executing, we should have the network throughput\
    \ in kilobits per second stored in `bw`.\n\nUnfortunately, it isn't that simple,\
    \ because of something called [TCP slow-start](http://en.wikipedia.org/wiki/Slow-start)^([12](#chapter-2.xhtml_fn2_12)).\n\
    \n#### Slow-Start\n\nIn order to avoid network congestion, both ends of a TCP\
    \ connection will start sending data slowly and wait for an acknowledgement (an\
    \ ACK packet). Remember than an ACK packet means, “I ACKnowledge what you just\
    \ sent me.” Every time it receives an ACK without timing out, it assumes that\
    \ the other end can operate faster and will send out more packets before waiting\
    \ for the next ACK. If an ACK doesn't come through in the expected timeframe,\
    \ it assumes that the other end cannot operate fast enough and so backs off.\n\
    \n[![TCP window sizes for slow-start](images/tcp-windows.png)](http://media.smashingmagazine.com/wp-content/uploads/2011/10/tcp-windows.png)\n\
    \nThis means that our throughput test above would have been fine as long as our\
    \ image is small enough to fit within the current TCP window, which at the start\
    \ is set to 2\\. While this is fine for slow networks, a fast network really wouldn't\
    \ be taxed by so small an image.\n\nInstead, we'll try by sending across images\
    \ of increasing size and measuring the time each takes to download.\n\nFor the\
    \ purpose of the code, the global `image` object is now an array with the following\
    \ structure:\n\n```\nvar image = [\n  {url: …, size: … }\n];\n```\n\nAn array\
    \ makes it easy to iterate over the list of images, and we can easily add large\
    \ images to the end of the array to test faster network connections.\n\n```\n\
    var i=0;\nvar ld = function() {\n   if(i > 0)\n      image[i-1].end = +new Date;\n\
    \   if(i >= image.length)\n      done();\n   else {\n      var img = new Image;\n\
    \      img.onload = ld;\n      image[i].start = +new Date;\n      img.src=image[i].url;\n\
    \   }\n   i++;\n};\n```\n\nUnfortunately, this breaks down when a very slow connection\
    \ hits one of the bigger images; so, instead, we add a `timeout` value for each\
    \ image, designed so that we hit upon common network connection speeds quickly.\
    \ Details of the image sizes and `timeout` values are listed [in this spreadsheet](https://spreadsheets.google.com/ccc?key=0AplxPyCzmQi6dDRBN2JEd190N1hhV1N5cHQtUVdBMUE&hl=en_GB)^([13](#chapter-2.xhtml_fn2_13)).\n\
    \nOur code now looks like this:\n\n```\nvar i=0;\nvar ld = function() {\n   if(i\
    \ > 0) {\n      image[i-1].end = +new Date;\n      clearTimeout(image[i-1].timer);\n\
    \   }\n   if(i >= image.length ||\n         (i > 0 && image[i-1].expired))\n \
    \     done();\n   else {\n      var img = new Image;\n      img.onload = ld;\n\
    \      image[i].start = +new Date;\n      image[i].timer =\n            setTimeout(function()\
    \ {\n                       image[i].expired=true\n                    },\n  \
    \                  image[i].timeout);\n      img.src=image[i].url;\n   }\n   i++;\n\
    };\n```\n\nThis looks much better—and works much better, too. But we'd see much\
    \ variance between multiple runs. The only way to reduce the error in measurement\
    \ is to run the test multiple times and take a summary value, such as the median.\
    \ It's a tradeoff between how accurate you need to be and how long you want the\
    \ user to wait before the test completes. Getting network throughput to an order\
    \ of magnitude is often as close as you need to be. Knowing whether the user's\
    \ connection is around 64 Kbps or 2 Mbps is useful, but determining whether it's\
    \ exactly 2048 or 2500 Kbps is much less useful.\n\n### Summary And References\n\
    \nThat's it for part 1 of this series. We've looked at how the packets that make\
    \ up a Web request get through between browser and server, how this changes over\
    \ time, and how we can use JavaScript and a little knowledge of statistics to\
    \ make educated guesses at the characteristics of the network that we're working\
    \ with.\n\nHere's a list of links to resources that were helpful in compiling\
    \ this document.\n\n•[Greg's Cable Map](http://cablemap.info/)^([14](#chapter-2.xhtml_fn2_14)),\
    \ Greg Mahlknecht\n\nAggregated information about undersea network cables.\n\n\
    •“[Transmission Control Protocol](http://en.wikipedia.org/wiki/Transmission_Control_Protocol)^([15](#chapter-2.xhtml_fn2_15)),”\
    \ Wikipedia\n\nThis page links to all of the RFCs.\n\n•[*TCP/IP Illustrated, Vol.\
    \ 1: The Protocols*](http://www.amazon.com/TCP-Illustrated-Vol-Addison-Wesley-Professional/dp/0201633469)^([16](#chapter-2.xhtml_fn2_16)),\
    \ by Richard Stevens\n\nA link to the book on Amazon.\n\n•“[Slow-Start](http://en.wikipedia.org/wiki/Slow-start)^([17](#chapter-2.xhtml_fn2_17)),”\
    \ Wikipedia\n\nAlso, see the links above for congestion control and Nagle's Algorithm.\n\
    \n•“[Bandwidth Images Sizes](https://spreadsheets.google.com/ccc?key=0AplxPyCzmQi6dDRBN2JEd190N1hhV1N5cHQtUVdBMUE&hl=en_GB)^([18](#chapter-2.xhtml_fn2_18)),”\
    \ Google Spreadsheet\n\nThis is based on the research done while building Boomerang.\n\
    \n•[Boomerang](http://github.com/bluesmoon/boomerang/)^([19](#chapter-2.xhtml_fn2_19))\n\
    \nThe Boomerang project on GitHub, where much of this has been implemented.\n\n\
    —\n\n1.[http://www.flickr.com/photos/hertzen/4878410201/in/photostream](http://www.flickr.com/photos/hertzen/4878410201/in/photostream)\n\
    \n2.[http://github.com/bluesmoon/boomerang](http://github.com/bluesmoon/boomerang)\n\
    \n3.[http://en.wikipedia.org/wiki/Transmission_Control_Protocol](http://en.wikipedia.org/wiki/Transmission_Control_Protocol)\n\
    \n4.[http://en.wikipedia.org/wiki/Internet_Protocol](http://en.wikipedia.org/wiki/Internet_Protocol)"
