    \ use variables with an appropriate scope. I.e. instead of a global variable that's\
    \ nulled out, just use a function-local variable that goes out of scope when it's\
    \ no longer needed. This means cleaner code with less to worry about.\n\n•Ensure\
    \ that you're unbinding event listeners where they are no longer required, especially\
    \ when the DOM objects they're bound to are about to be removed\n\n•If you're\
    \ using a data cache locally, make sure to clean that cache or use an aging mechanism\
    \ to avoid large chunks of data being stored that you're unlikely to reuse\n\n\
