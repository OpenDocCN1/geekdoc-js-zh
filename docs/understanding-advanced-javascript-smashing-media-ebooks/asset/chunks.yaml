    **缺点：** 源代码之外需要多一些用法文档，再加上多几个测试用例。如果能有一个深入讲解如何在 Maria 中真实使用 MVC 的教程就就更好了。


    ### Cujo.js


    **优点：** 真实的应用几乎从不完美地契合 `MV*` 框架，最重要的部分往往在框之外。使用 `cucho.js`，你可以定义这个框。


    是的，`cucho.js` 拥有类似 `MV*` 的高级功能，用于创建视图、模型、控制器等，但每个应用都是不同的，没有任何框架能提供 100% 的解决方案。`cucho.js`
    并不试图涵盖一切，它还提供了底层工具、架构支撑和丰富的插件系统，这些甚至可以用于集成和扩展其他 `MV*` 框架。


    创建最适合你应用程序的架构，而不是让你的应用程序去迎合别人预定义的架构。


    **缺点：** 更广泛的 JavaScript 社区完全没有准备好，也没有经过训练来处理大型应用程序。我们大多数人甚至不知道设计模式和架构模式的存在。


    由于 `cucho.js` 与其他框架如此不同，它需要的不仅仅是简单的 API 参考和代码片段。如果没有教程、教育材料和分步示例，`cucho.js` 在未经过训练的眼睛眼中可能看起来很奇怪且难以捉摸，但文档预计很快推出。


    ### ExtJS


    **优点：** 我认为 `ExtJS` 与 `Ext Designer` 结合使用效果最好。通过让非程序员模拟 UI，让程序员可以填补空白，这使其具有了于其他
    GUI 框架的优势。我认为将其与如 `Backbone` 类的 MVC 框架进行比较并不能体现它的真正价值——它的优势在于创建丰富的 GUI，而不是轻量级的
    Web 应用。


    对于复杂的商业化后台应用程序，我认为在所有 JavaScript 解决方案中，`ExtJS` 仍然是最佳选择（即不是 `GWT` 等）。对于面向公众的 Web
    应用，我更倾向于使用能让我对标记有更多控制权的（理想情况下是能够优雅降级的方案）。


    **缺点：** 与许多其他现代结构化框架相比，它的学习曲线更陡。有人可能会认为，如果你现在是为了长期投资 `ExtJS`，那么花费这些时间学习是值得的；然而，我认为这类解决方案应该旨在尽可能地缩短团队上手使用它的时间。


    **优点：** 我认为 `ExtJS 4` 的一个大特点是它从一开始就带入 MVC 思维和首选的文件系统结构。与 `Dojo` 不同，初始教程似乎大多关于增强现有网站，而
    `ExtJS` 则假设你是从零开始的。


    使用 `ExtJS` 真的完全感觉不像在处理 HTML。组件库足够丰富，可以让你在不触碰比启动应用所需的更多 HTML 的情况下，让工作走得很远。


    当 Web 组件（Web components）得到更广泛的支持时，看到两者的对比将非常有趣。这最终将允许操作 `DOM`，而无需担心破坏任何组件或导致应用程序的内部状态变得不一致。


    **缺点：** 许可协议被某些人认为具有限制性且难以理解。如果使用它的前期成本和长期成本更清晰，会有更多人投资 `ExtJS`。这在某些其他结构化解决方案中不是担心的问题，但对于大型企业来说可能也不是大问题。


    **优点：** `ExtJS` 是快速构建内部使用的 RIA（富交互应用程序）的优秀包。我个人非常喜欢使用 HTML 和 JavaScript 进行构建，对我来说，在那个层级折腾非常有成就感。尽管
    `ExtJS` 让你感觉不像真的在处理 HTML，但它仍然提供了很多，尤其是当你用它来创建一个复杂的 UI 时。


    **缺点：** 话如此……我完全同意它非常沉重，我不认为会将其推荐面向外部的 Web 应用。我对整个包最大的意见其实是它测试起来比我预期的要麻烦得多。我们的测试人员最终实际上切换到了
    `Sikuli`，因为在 `Selenium` 中与它协作已经变成了一场战斗。


    ### Batman


    **优点：** 它有一个非常棒且易于使用的视图绑定系统。与 `Rails` 配合得非常好，并且完全遵循“约定优于配置”。


    **缺点：** 文档可以做得更好，我感觉 `Shopify` 不会添加他们所说要添加的功能。


    ### 不要害怕实验


    虽然开发者不太可能需要学习使用这些框架中的好几个，但我确实鼓励探索那些你不熟悉的框架。在这个过程中，可以学到多如山般的有趣事实和技术。


    在我的案例中：我发现 `Batman.js` 实现所需的手写代码行最少。我既不是频繁的 `CoffeeScript` 或 `Batman.js` 用户，但这本身就给了我一些思考。也许我可以采取一些使这成为可能的元素，并将它们带到我使用的框架中。或者，如果我发现它的社区和支持随时间推移有所改进，我会在未来的项目中使用
    `Batman.js`。


    无论你最终是否使用不同的解决方案，归根结底，你从探索中获得的只有关于现有世界的更多知识。


    ### 超越 MV* 框架


    虽然 `MV*` 模式族在结构化应用程序方面非常流行，但它们的局限性在于，它们没有解决任何类型的应用层、视图之间的通信、执行工作的服务或任何其他问题。因此，开发者可能会发现，他们有时需要探索
    MVC 之外的内容——有些时候你绝对需要将他们提供的东西更进一步。


    我们联系了那些通过自己的模式或对现有框架进行扩展来进一步推进 MVC 的开发者，以获取关于你何时需要更多内容的见解。


    '
- fmt: '

    I spent almost a year trying to solve that very problem, but eventually I came
    to the realization that shoehorning it into `MV` was not a viable solution. I
    was dealing with an “amorphous model” and that''s where it all fell apart. In
    other words, if you don''t have a well-defined model, most modern JavaScript frameworks
    can''t help you.


    > That''s where [Core J2EE Patterns](http://java.sun.com/blueprints/corej2eepatterns/Patterns/)^([71](#chapter-4.xhtml_fn4_71))
    come in. I got turned on to them while reading [PHP Objects, Patterns, and Practice](http://www.amazon.com/Objects-Patterns-Practice-Matt-Zandstra/dp/1590599098)^([72](#chapter-4.xhtml_fn4_72))
    by Matt Zandstra, and I''m glad I did! The J2EE Patterns basically outline a request-driven
    process, where the URL drives the behavior of the application. In a nutshell,
    a request is created, modified, and then used to determine the view to render.


    > I''ve expanded on my experiences with [request driven Javascript applications
    and J2EE patterns](http://dblogit.com/archives/3895)^([73](#chapter-4.xhtml_fn4_73))
    for anyone who would like to learn more.

    > *— Dustin Boston, co-author, Aura*


    ## Conclusions


    While there are several choices for what to use for structuring your JavaScript
    Web applications these days, it''s important to be **diligent** in the selection
    process – spend time thoroughly evaluating your options in order to make a decision
    which results in sustainable, **maintainable** code. Framework diversity fosters
    innovation, while too much similarity just creates noise.


    Projects like `TodoMVC` can help narrow down your selections to those you feel
    might be the most interesting or most comfortable for a particular project. Remember
    to take your time choosing, don''t feel too constrained by using a specific pattern
    and keep in mind that it''s completely acceptable to build on the solution you
    select to best fit the needs of your application.


    Experimenting with different frameworks will also give you different views on
    how to solve common problems which will in turn make you a better programmer.


