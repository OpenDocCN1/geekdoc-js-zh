    \ It!\n\nUsing the `target` property of the event object, you can find out which\
    \ element the event occurred on.\n\nEvents happen by going down the whole document\
    \ tree to the element that you interacted with and back up to the main window.\
    \ This means that if you add an event handler to an element, you will get all\
    \ of the child elements for free. All you need to do is test the event target\
    \ and respond accordingly. [See my example of a list](http://thewebrocks.com/demos/smashing-events/eventdelegation.html)^([17](#chapter-5.xhtml_fn5_17)):\n\
    \n```\n<ul id=\"resources\">\n  <li><a href=\"http://developer.mozilla.org\">MDN</a></li>\n\
    \  <li><a href=\"http://html5doctor.com\">HTML5 Doctor</a></li>\n  <li><a href=\"\
    http://html5rocks.com\">HTML5 Rocks</a></li>\n  <li><a href=\"http://beta.theexpressiveweb.com/\"\
    >Expressive Web</a></li>\n  <li><a href=\"http://creativeJS.com/\">CreativeJS</a></li>\n\
    </ul>\n```\n\nHover your mouse over the list in this example and you will see\
    \ that one event handler is enough to get the links, the list item and the list\
    \ itself. All you need to do is compare the `tagName` of the event target to what\
    \ you want to have.\n\n```\nvar resources = document.querySelector('#resources'),\n\
    \    log = document.querySelector('#log');\n\nresources.addEventListener('mouseover',\
    \ showtarget, false);\n\nfunction showtarget(ev) {\n  var target = ev.target;\n\
    \  if (target.tagName === 'A') {\n    log.innerHTML = 'A link, with the href:'\
    \ + target.href;\n  }\n  if (target.tagName === 'LI') {\n    log.innerHTML = 'A\
    \ list item';\n  }\n  if (target.tagName === 'UL') {\n    log.innerHTML = 'The\
    \ list itself';\n  }\n}\n```\n\nThis means you can save a lot of event handlers—each\
    \ of which is expensive to the browser. Instead of applying an event handler to\
    \ each link and responding that way—as most people would do in jQuery with `$('a').click(...)`\
    \ (although jQuery's `on` is OK)—you can assign a single event handler to the\
    \ list itself and check which element was just clicked.\n\nThe main benefit of\
    \ this is that you are independent of the HTML. If you add more links at a later\
    \ stage, there is no need to assign new handlers; the event handler will know\
    \ automatically that there is a new link to do things with.\n\n### Events For\
    \ Detection, CSS Transitions For Smoothness\n\nIf you remember the list of properties\
    \ earlier in this chapter, there is a lot of things we can use. In the past, we\
    \ used events for simple hover effects, which now have been replaced with effects\
    \ using the `:hover` and `:focus` CSS selectors. Some things, however, cannot\
    \ be done with CSS yet; for example, finding the mouse's position. With an event\
    \ listener, this is pretty simple. First, we define an element to position, like\
    \ a ball. The HTML:\n\n```\n<div class=\"plot\"></div>\n```\n\nAnd the CSS:\n\n\
    ```\n.plot {\n  position:absolute;\n  background:rgb(175,50,50);\n  width: 20px;\n\
    \  height: 20px;\n  border-radius: 20px;\n  display: block;\n  top:0;\n  left:0;\n\
    }\n```\n\nWe then assign a click handler to the document and position the ball\
    \ at [`PageX`](https://developer.mozilla.org/en/DOM/event.pageX)^([`18`](#chapter-5.xhtml_fn5_18))\
    \ and `pageY`. Notice that we need to subtract half the width of the ball in order\
    \ to center it on the mouse pointer:\n\n```\nvar plot = document.querySelector('.plot'),\n\
    \    offset = plot.offsetWidth / 2;\ndocument.addEventListener('click', function(ev)\
    \ {\n  plot.style.left = (ev.pageX - offset) + 'px';\n  plot.style.top = (ev.pageY\
    \ - offset) + 'px';\n}, false);\n```\n\nClicking anywhere on the screen will now\
    \ move the ball there. However, it's not smooth. If you [enable the checkbox in\
    \ the demo](http://thewebrocks.com/demos/smashing-events/mouseposition.html)^([19](#chapter-5.xhtml_fn5_19)),\
    \ you will see that the ball moves smoothly. We could animate this with a library,\
    \ but browsers can do better these days. All we need to do is add a transition\
    \ to the CSS, and then the browser will move the ball smoothly from one position\
    \ to another. To achieve this, we define a new class named `smooth` and apply\
    \ it to the plot when the checkbox in the document is clicked. The CSS:"
