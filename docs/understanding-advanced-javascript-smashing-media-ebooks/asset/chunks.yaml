    \ bar=6);\n// prints: 5, 6\n\nnamesAreAwesome(bar=6);\n// prints: 1, 6\n```\n\n\
    Given this scheme, `initMouseEvent()` could've looked like a self-explaining function\
    \ call:\n\n```javascript\nevent.initMouseEvent(\n  type=\"click\", \n  canBubble=true,\
    \ \n  cancelable=true, \n  view=window, \n  detail=123,\n  screenX=101, \n  screenY=202,\
    \ \n  clientX=101, \n  clientY=202, \n  ctrlKey=true, \n  altKey=false, \n  shiftKey=false,\
    \ \n  metaKey=false, \n  button=1, \n  relatedTarget=null);\n```\n\nIn JavaScript\
    \ this is not possible today. While “the next version of JavaScript” (frequently\
    \ called ES.next, ES6, or Harmony) will have [default parameter values](http://wiki.ecmascript.org/doku.php?id=harmony:parameter_default_values)\
    \ and [rest parameters](http://wiki.ecmascript.org/doku.php?id=harmony:rest_parameters),\
    \ there is still no sign of named parameters.\n\n#### Argument Maps\n\nJavaScript\
    \ not being Python (and ES.next being light years away), we're left with fewer\
    \ choices to overcome the obstacle of “argument forests”. jQuery (and pretty much\
    \ every other decent API out there) chose to work with the concept of “option\
    \ objects”. The signature of [`jQuery.ajax()`](http://api.jquery.com/jquery.ajax/)\
    \ provides a pretty good example. Instead of accepting numerous arguments, we\
    \ only accept an object:\n\n```javascript\nfunction nightmare(accepts, async,\
    \ beforeSend, cache, complete, /* and 28 more */) {\n  if (accepts === \"text\"\
    ) {\n    // prepare for receiving plain text\n  }\n}\n\nfunction dream(options)\
    \ {\n  options = options || {};\n  if (options.accepts === \"text\") {\n    //\
    \ prepare for receiving plain text\n  }\n}\n```\n\nNot only does this prevent\
    \ insanely long function signatures, it also makes calling the function more descriptive:\n\
    \n```javascript\nnightmare(accepts, async, beforeSend, cache, complete, /* and\
    \ 28 more */)\n```\n[/content] (Wait, I see I'm repeating myself due to an error.\
    \ I will just provide the final output once.)\n\n[content]\nJavaScript allows\
    \ type casting a number of ways. If you're dealing with primitives (string, number,\
    \ boolean) it can get as simple (as in “short”) as:\n\n```javascript\nfunction\
    \ castaway(some_string, some_integer, some_boolean) {\n  some_string += \"\";\n\
    \  some_integer += 0; // parseInt(some_integer, 10) is the safer bet\n  some_boolean\
    \ = !!some_boolean;\n}\n```\n\nI'm not advocating you to do this everywhere and\
    \ at all times. But these innocent looking lines may save time and some suffering\
    \ while integrating your code.\n\n#### Treating `undefined` as an Expected Value\n\
    \nThere will come a time when `undefined` is a value that your API actually expects\
    \ to be given for setting an attribute. This might happen to “unset” an attribute,\
    \ or simply to gracefully handle bad input, making your API more robust. To identify\
    \ if the value `undefined` has actually been passed by your method, you can check\
    \ the [`arguments`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Functions_and_function_scope/arguments)\
    \ object:\n\n```javascript\nfunction testUndefined(expecting, someArgument) {\n\
    \  if (someArgument === undefined) {\n    console.log(\"someArgument was undefined\"\
    );\n  }\n  if (arguments.length > 1) {\n    console.log(\"but was actually passed\
    \ in\");\n  }\n}\n\ntestUndefined(\"foo\");\n// prints: someArgument was undefined\n\
    testUndefined(\"foo\", undefined);\n// prints: someArgument was undefined, but\
    \ was actually passed in\n```\n\n#### Named Arguments\n\n```javascript\nevent.initMouseEvent(\n\
    \  \"click\", true, true, window, \n  123, 101, 202, 101, 202, \n  true, false,\
    \ false, false, \n  1, null);\n```\n\nThe function signature of [Event.initMouseEvent](https://developer.mozilla.org/en-US/docs/DOM/event.initMouseEvent)\
    \ is a nightmare come true. There is no chance any developer will remember what\
    \ that `1` (second to last parameter) means without looking it up in the documentation.\
    \ No matter how good your documentation is, do what you can so people don't have\
    \ to look things up!\n\n#### How Others Do It\n\nLooking beyond our beloved language,\
    \ we find Python knowing a concept called [named arguments](http://www.diveintopython.net/power_of_introspection/optional_arguments.html).\
    \ It allows you to declare a function providing default values for arguments,\
    \ allowing your attributed names to be stated in the calling context:\n\n```javascript\n\
    function namesAreAwesome(foo=1, bar=2) {\n  console.log(foo, bar);\n}\n\nnamesAreAwesome();\n\
    // prints: 1, 2\n\nnamesAreAwesome(3, 4);\n// prints: 3, 4\n\nnamesAreAwesome(foo=5,\
    \ bar=6);\n// prints: 5, 6\n\nnamesAreAwesome(bar=6);\n// prints: 1, 6\n```\n\n\
    Given this scheme, `initMouseEvent()` could've looked like a self-explaining function\
    \ call:\n\n```javascript\nevent.initMouseEvent(\n  type=\"click\", \n  canBubble=true,\
    \ \n  cancelable=true, \n  view=window, \n  detail=123,\n  screenX=101, \n  screenY=202,\
    \ \n  clientX=101, \n  clientY=202, \n  ctrlKey=true, \n  altKey=false, \n  shiftKey=false,\
    \ \n  metaKey=false, \n  button=1, \n  relatedTarget=null);\n```\n\nIn JavaScript\
    \ this is not possible today. While “the next version of JavaScript” (frequently\
    \ called ES.next, ES6, or Harmony) will have [default parameter values](http://wiki.ecmascript.org/doku.php?id=harmony:parameter_default_values)\
    \ and [rest parameters](http://wiki.ecmascript.org/doku.php?id=harmony:rest_parameters),\
    \ there is still no sign of named parameters.\n\n#### Argument Maps\n\nJavaScript\
    \ not being Python (and ES.next being light years away), we're left with fewer\
    \ choices to overcome the obstacle of “argument forests”. jQuery (and pretty much\
    \ every other decent API out there) chose to work with the concept of “option\
    \ objects”. The signature of [`jQuery.ajax()`](http://api.jquery.com/jquery.ajax/)\
    \ provides a pretty good example. Instead of accepting numerous arguments, we\
    \ only accept an object:\n\n```javascript\nfunction nightmare(accepts, async,\
    \ beforeSend, cache, complete, /* and 28 more */) {\n  if (accepts === \"text\"\
    ) {\n    // prepare for receiving plain text\n  }\n}\n\nfunction dream(options)\
    \ {\n  options = options || {};\n  if (options.accepts === \"text\") {\n    //\
    \ prepare for receiving plain text\n  }\n}\n```\n\nNot only does this prevent\
    \ insanely long function signatures, it also makes calling the function more descriptive:\n\
    \n```javascript\nnightmare(accepts, async, beforeSend, cache, complete, /* and\
    \ 28 more */)\n```\n"
  raw: "JavaScript allows type casting a number of ways. If you're dealing with primitives\
    \ (string, number, boolean) it can get as simple (as in “short”) as:\n\n```\n\
    function castaway(some_string, some_integer, some_boolean) {\n  some_string +=\
    \ \"\";\n  some_integer += 0; // parseInt(some_integer, 10) is the safer bet\n\
    \  some_boolean = !!some_boolean;\n}\n```\n\nI'm not advocating you to do this\
    \ everywhere and at all times. But these innocent looking lines may save time\
    \ and some suffering while integrating your code.\n\n#### Treating `undefined`\
    \ as an Expected Value\n\nThere will come a time when `undefined` is a value that\
    \ your API actually expects to be given for setting an attribute. This might happen\
    \ to “unset” an attribute, or simply to gracefully handle bad input, making your\
    \ API more robust. To identify if the value `undefined` has actually been passed\
    \ by your method, you can check the [`arguments`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Functions_and_function_scope/arguments)^([18](#chapter-8.xhtml_fn8_18))\
    \ object:\n\n```\nfunction testUndefined(expecting, someArgument) {\n  if (someArgument\
    \ === undefined) {\n    console.log(\"someArgument was undefined\");\n  }\n  if\
    \ (arguments.length > 1) {\n    console.log(\"but was actually passed in\");\n\
    \  }\n}\n\ntestUndefined(\"foo\");\n// prints: someArgument was undefined\ntestUndefined(\"\
    foo\", undefined);\n// prints: someArgument was undefined, but was actually passed\
    \ in\n```\n\n#### Named Arguments\n\n```\nevent.initMouseEvent(\n  \"click\",\
    \ true, true, window, \n  123, 101, 202, 101, 202, \n  true, false, false, false,\
    \ \n  1, null);\n```\n\nThe function signature of [Event.initMouseEvent](https://developer.mozilla.org/en-US/docs/DOM/event.initMouseEvent)^([19](#chapter-8.xhtml_fn8_19))\
    \ is a nightmare come true. There is no chance any developer will remember what\
    \ that `1` (second to last parameter) means without looking it up in the documentation.\
    \ No matter how good your documentation is, do what you can so people don't have\
    \ to look things up!\n\n#### How Others Do It\n\nLooking beyond our beloved language,\
    \ we find Python knowing a concept called [named arguments](http://www.diveintopython.net/power_of_introspection/optional_arguments.html)^([20](#chapter-8.xhtml_fn8_20)).\
    \ It allows you to declare a function providing default values for arguments,\
    \ allowing your attributed names to be stated in the calling context:\n\n```\n\
    function namesAreAwesome(foo=1, bar=2) {\n  console.log(foo, bar);\n}\n\nnamesAreAwesome();\n\
    // prints: 1, 2\n\nnamesAreAwesome(3, 4);\n// prints: 3, 4\n\nnamesAreAwesome(foo=5,\
    \ bar=6);\n// prints: 5, 6\n\nnamesAreAwesome(bar=6);\n// prints: 1, 6\n```\n\n\
    Given this scheme, initMouseEvent() could've looked like a self-explaining function\
    \ call:\n\n```\nevent.initMouseEvent(\n  type=\"click\", \n  canBubble=true, \n\
    \  cancelable=true, \n  view=window, \n  detail=123,\n  screenX=101, \n  screenY=202,\
    \ \n  clientX=101, \n  clientY=202, \n  ctrlKey=true, \n  altKey=false, \n  shiftKey=false,\
    \ \n  metaKey=false, \n  button=1, \n  relatedTarget=null);\n```\n\nIn JavaScript\
    \ this is not possible today. While “the next version of JavaScript” (frequently\
    \ called ES.next, ES6, or Harmony) will have [default parameter values](http://wiki.ecmascript.org/doku.php?id=harmony:parameter_default_values)^([21](#chapter-8.xhtml_fn8_21))\
    \ and [rest parameters](http://wiki.ecmascript.org/doku.php?id=harmony:rest_parameters)^([22](#chapter-8.xhtml_fn8_22)),\
    \ there is still no sign of named parameters.\n\n#### Argument Maps\n\nJavaScript\
    \ not being Python (and ES.next being light years away), we're left with fewer\
    \ choices to overcome the obstacle of “argument forests”. jQuery (and pretty much\
    \ every other decent API out there) chose to work with the concept of “option\
    \ objects”. The signature of [jQuery.ajax()](http://api.jquery.com/jquery.ajax/)^([23](#chapter-8.xhtml_fn8_23))\
    \ provides a pretty good example. Instead of accepting numerous arguments, we\
    \ only accept an object:\n\n```\nfunction nightmare(accepts, async, beforeSend,\
    \ cache, complete, /* and 28 more */) {\n  if (accepts === \"text\") {\n    //\
    \ prepare for receiving plain text\n  }\n}\n\nfunction dream(options) {\n  options\
    \ = options || {};\n  if (options.accepts === \"text\") {\n    // prepare for\
    \ receiving plain text\n  }\n}\n```\n\nNot only does this prevent insanely long\
    \ function signatures, it also makes calling the function more descriptive:\n\n\
    ```\nnightmare(\"text\", true, undefined, false, undefined, /* and 28 more */);\n\
    \ndream({\n  accepts: \"text\",\n  async: true,\n  cache: false\n});\n```\n\n\
    Also, we do not have to touch the function signature (adding a new argument) should\
    \ we introduce a new feature in a later version.\n\n#### Default Argument Values\n\
    \n[jQuery.extend()](http://api.jquery.com/jQuery.extend/)^([24](#chapter-8.xhtml_fn8_24)),\
    \ [_.extend()](http://underscorejs.org/#extend)^([25](#chapter-8.xhtml_fn8_25))\
    \ and Protoype's [Object.extend](http://api.prototypejs.org/language/Object/extend/)^([26](#chapter-8.xhtml_fn8_26))\
    \ are functions that let you merge objects, allowing you to throw your own preset\
    \ options object into the mix:\n\n```\nvar default_options = {\n  accepts: \"\
    text\",\n  async: true,\n  beforeSend: null,\n  cache: false,\n  complete: null,\n\
    \  // …\n};\n\nfunction dream(options) {\n  var o = jQuery.extend({}, default_options,\
    \ options || {});\n  console.log(o.accepts);\n}\n\n// make defaults public\ndream.default_options\
    \ = default_options;\n\ndream({ async: false });\n// prints: \"text\"\n```\n\n\
    You're earning bonus points for making the default values publicly accessible.\
    \ With this, anyone can change `accepts` to “json” in a central place, and thus\
    \ avoid specifying that option over and over again. Note that the example will\
    \ always append `|| {}` to the initial read of the option object. This allows\
    \ you to call the function without an argument given.\n\n#### Good Intentions—a.k.a.\
    \ “Pitfalls”\n\nNow that you know how to be truly flexible in accepting arguments,\
    \ we need to come back to an old saying:\n\n> “With great power comes great responsibility!”\n\
    \n> \n\n> — Voltaire\n\nAs with most weakly-typed languages, JavaScript does automatic\
    \ casting when it needs to. A simple example is testing the truthfulness:\n\n\
    ```\nvar foo = 1;\nvar bar = true;\n\nif (foo) {\n  // yep, this will execute\n\
    }\n\nif (bar) {\n  // yep, this will execute\n}\n```\n\nWe're quite used to this\
    \ automatic casting. We're so used to it, that we forget that although something\
    \ is truthful, it may not be the boolean truth. Some APIs are so flexible they\
    \ are *too smart* for their own good. Take a look at the signatures of [jQuery.toggle()](http://api.jquery.com/toggle/)^([27](#chapter-8.xhtml_fn8_27)):\n\
    \n```\n.toggle( /* int */ [duration] [, /* function */  callback] )\n.toggle(\
    \ /* int */ [duration] [, /* string */  easing] [, /* function */ callback] )\n\
    .toggle( /* bool */ showOrHide )\n```\n\nIt will take us some time decrypting\
    \ why these behave *entirely* different:\n\n```\nvar foo = 1;\nvar bar = true;\n\
    var $hello = jQuery(\".hello\");\nvar $world = jQuery(\".world\");\n\n$hello.toggle(foo);\n\
    $world.toggle(bar);\n```\n\nWe were *expecting* to use the `showOrHide` signature\
    \ in both cases. But what really happened is `$hello` doing a toggle with a `duration`\
    \ of one millisecond. This is not a bug in jQuery, this is a simple case of *expectation\
    \ not met*. Even if you're an experienced jQuery developer, you *will* trip over\
    \ this from time to time.\n\nYou are free to add as much convenience / sugar as\
    \ you like—but do not sacrifice a clean and (mostly) robust API along the way.\
    \ If you find yourself providing something like this, think about providing a\
    \ separate method like `.toggleIf(bool)` instead. Whatever choice you make, keep\
    \ your API consistent!\n\n### Extensibility\n\n![Developing Possibilities](images/developing-possibilities.jpg\
    \ \"Developing Possibilities\")"
