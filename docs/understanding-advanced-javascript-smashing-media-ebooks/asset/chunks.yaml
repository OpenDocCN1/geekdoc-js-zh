  trans: "\n\n```\n // 原型模式\n  Klass1 = function () {}\n  Klass1.prototype.foo = function\
    \ () {\n      log('foo');\n  }\n  Klass1.prototype.bar = function () {\n     \
    \ log('bar');\n  }\n\n  // 模块模式\n  Klass2 = function () {\n      var foo = function\
    \ () {\n          log('foo');\n      },\n      bar = function () {\n         \
    \ log('bar');\n      };\n\n      return {\n          foo: foo,\n          bar:\
    \ bar\n      }\n  }\n\n  // 带有缓存函数的模块模式\n  var FooFunction = function () {\n \
    \     log('foo');\n  };\n  var BarFunction = function () {\n      log('bar');\n\
    \  };\n\n  Klass3 = function () {\n      return {\n          foo: FooFunction,\n\
    \          bar: BarFunction\n      }\n  }\n\n  // 迭代测试\n\n  // 原型\n  var i = 1000,\n\
    \      objs = [];\n  while (i--) {\n      var o = new Klass1()\n      objs.push(new\
    \ Klass1());\n      o.bar;\n      o.foo;\n  }\n\n  // 模块模式\n  var i = 1000,\n\
    \      objs = [];\n  while (i--) {\n      var o = Klass2()\n      objs.push(Klass2());\n\
    \      o.bar;\n      o.foo;\n  }\n\n  // 带有缓存函数的模块模式\n  var i = 1000,\n      objs\
    \ = [];\n  while (i--) {\n      var o = Klass3()\n      objs.push(Klass3());\n\
    \      o.bar;\n      o.foo;\n  }\n// 详细信息请查看测试\n```\n\n**注意：** 如果你不需要类，请避免创建类的麻烦。[这里有一个\
    \ http://jsperf.com/prototypal-performance/54](http://jsperf.com/prototypal-performance/54)\
    \ 示例了如何通过完全移除类的开销来获得性能提升。\n\n## 使用数组的技巧\n\n接下来，让我们来看一些关于数组的技巧。通常情况下，**不要删除数组元素**。这会导致数组转换为更慢的内部表示。当键集变得稀疏时，V8\
    \ 最终会将元素切换到字典模式，这会更慢。\n\n### 数组字面量\n\n数组字面量非常有用，因为它们为虚拟机（VM）提供了关于数组大小和类型的提示。它们通常适用于中等规模的数组。\n\
    \n```\n// 这里 V8 可以看到你想要一个包含 4 个数字的数组：\nvar a = [1, 2, 3, 4];\n\n// 不要这样做：\na =\
    \ []; // 在这里 V8 对该数组一无所知\nfor(var i = 1; i <= 4; i++) {\n     a.push(i);\n}\n\
    ```\n\n### 单一类型 vs 混合类型的存储\n\n在同一个数组中混合不同类型的值（例如数字、字符串、undefined 或 true/false，即\
    \ `var arr = [1, “1”, undefined, true, “true”]）永远不是一个好主意。\n\n[类型推断测试](http://jsperf.com/type-inference-performance/24)\
    \ 我们从结果可以看出，`ints` 数组是最快的。\n\n### 稀疏数组 vs 完整数组\n\n当你使用稀疏数组时，请注意访问其中的元素比访问完整数组慢得多。这是因为如果只使用了少数元素，V8\
    \ 不会为元素分配平坦存储。相反，它在字典中管理这些元素，这节省了空间，但增加了访问成本。\n\n[稀疏数组与完整数组的测试](http://jsperf.com/sparse-arrays-full-arrays/25)\
    \ 完整数组 `sum` 以及不包含零的所有元素的 `sum` 实际上是最快的。完整数组是否包含零不应该产生区别。\n\n### 紧密数组 vs 空洞数组\n\
    \n避免数组中出现“空洞”（通过删除元素或在 `x > a.length` 时执行 `a[x] = foo` 创建）。即使从一个原本“完整”的数组中删除单个元素，速度也会变慢得多。\n\
    \n[紧密数组与空洞数组的测试](http://jsperf.com/packed-vs-holey-arrays/26)\n\n### 预分配数组 vs\
    \ 随需增长\n\n不要预分配大大数组（即大于 64K）到最大尺寸，而是要根据需要增长。在我们进行此技巧的性能测试之前，请记住这特定于某些 JavaScript\
    \ 引擎。\n\n![各种浏览器中空字面量与预分配数组的测试。](img/graph2.jpg \"空字面量。各种浏览器中的预分配数组\")\n\nNitro\
    \ (Safari) 实际上对预分配数组更友好。然而，在其他引擎（`V8`, `SpiderMonkey`）中，不预分配更高效。\n\n[预分配数组的测试](http://jsperf.com/pre-allocated-arrays/27)\n\
    \n```\n// 空数组\nvar arr = [];\nfor (var i = 0; i < 1000000; i++) {\n    arr[i]\
    \ = i;\n}\n\n// 预分配数组\nvar arr = new Array(1000000);\nfor (var i = 0; i < 1000000;\
    \ i++) {\n    arr[i] = i;\n}\n```\n\n## 优化你的应用程序\n\n在 Web 应用的世界，**性能就是一切**。想要从代码中挤出每一分性能是关键的。\n\
    \n![屏幕上的旧手机。](img/improving-apps.jpg)\n\n图片来源：[Olof Forsberg](http://www.flickr.com/photos/peroffberg/6691745/)\
    \ 虽然理解并改进性能很有用，但也可能困难。我们建议采取以下步骤：\n\n• 测量（45%）\n• 理解（45%）\n• 修复它！（10%）\n\n下面的工具和技术可以帮助这一过程。\n\
    \n"
- fmt: '

    Profilinging starts with obtaining a baseline for your code''s current performance,
    which can be discovered using the `Timeline`. This will tell us how long our code
    took to run. The `Profiles` tab then gives us a better view into what''s happening
    in our application. The `JavaScript` CPU profile shows us how much CPU time is
    being used by our code, the `CSS` selector profile shows us how much time is spent
    processing selectors and `Heap` snapshots show how much memory is being used by
    our objects.


    Using these tools, we can isolate, tweak and reprofile to gauge whether changes
    we''re making to specific functions or operations are improving performance.


    ![The profile tab gives information about your code''s performance.](images/profiling2.jpg
    "The Profile Tab Gives Information About Your Code''s Performance")


    *The Profile tab gives you information about your code''s performance.*


    For a good introduction to profiling, read [JavaScript Profiling With The Chrome
    Developer Tools](http://coding.smashingmagazine.com/2012/06/12/javascript-profiling-chrome-developer-tools/)^([34](#chapter-7.xhtml_fn7_34)),
    by Zack Grossbart.


    Tip: Ideally, you want to ensure that your profiling isn''t being affected by
    extensions or applications you''ve installed, so run Chrome using the `--user-data-dir
    <empty_directory>` flag. Most of the time, this approach to optimization testing
    should be enough, but there are times when you need more. This is where `V8` flags
    can be of help.


    ## Avoiding Memory Leaks—Three Snapshot Techniques for Discovery


    Internally at Google, the `Chrome Developer Tools` are heavily used by teams such
    as `Gmail` to help us discover and squash memory leaks.


    ![Memory statistics in Chrome Developer Tools.](images/devtools.jpg "Memory Statistics
    In Chrome Developer Tools")


    *Memory statistics in Chrome Developer Tools.*


    Some of the memory statistics that our teams care about include private memory
    usage, `JavaScript` heap size, `DOM` node counts, storage clearing, event listener
    counts and what''s going on with garbage collection. For those familiar with event-driven
    architectures, you might be interested to know that one of the most common issues
    we used to have were `listen()`''s without `unlisten()`''s (Closure) and missing
    `dispose()`''s for objects that create event listeners.


    Luckily the `DevTools` can help locate some of these issues, and Loreena Lee has
    a fantastic presentation available documenting the [“3 snapshot” technique](https://docs.google.com/presentation/d/1wUVmf78gG-ra5aOxvTfYdiLkdGaR9OhXRnOlIcEmu2s/pub?start=false&loop=false&delayms=3000#slide=id.g1d65bdf6_0_0)^([35](#chapter-7.xhtml_fn7_35))
    for finding leaks within the `DevTools` that I can''t recommend reading through
    enough.


    The gist of the technique is that you record a number of actions in your application,
    force a garbage collection, check if the number of `DOM` nodes doesn''t return
    to your expected baseline and then analyze three heap snapshots to determine if
    you have a leak.


    ## Memory Management in Single-Page Applications


    Memory management is quite important when writing modern single-page applications
    (e.g. `AngularJS`, `Backbone`, `Ember`) as they almost never get refreshed. This
    means that memory leaks can become apparent quite quickly. This is a huge trap
    on mobile single-page applications, because of limited memory, and on long-running
    applications like email clients or social networking applications. **With great
    power comes great responsibility.**


    There are various ways to prevent this. In `Backbone`, ensure you always dispose
    old views and references using `dispose()` (currently available in [Backbone (edge)](https://github.com/documentcloud/backbone/blob/master/backbone.js#L1234)^([36](#chapter-7.xhtml_fn7_36))).
    This function was recently added, and removes any handlers added in the view''s
    ‘events'' object, as well as any collection or model listeners where the view
    is passed as the third argument (callback context). `dispose()` is also called
    by the view''s `remove()`, taking care of the majority of basic memory cleanup
    needs when the element is [cleared from the screen](https://github.com/documentcloud/backbone/blob/master/backbone.js#L1235)^([37](#chapter-7.xhtml_fn7_37)).
    Other libraries like `Ember` [clean up observers](https://github.com/emberjs/ember.js/blob/d8f76a7fdde741ae3d1e07b12df9cb6718170e48/packages/ember-handlebars/lib/helpers/binding.js#L296)^([38](#chapter-7.xhtml_fn7_38))
    when they detect that elements have been removed from view to avoid memory leaks.


    Some sage advice from Derick Bailey:


    > “Other than being aware of how events work in terms of references, just follow
    the standard rules for manage memory in JavaScript and you''ll be fine. If you
    are loading data in to a `Backbone` collection full of `User` objects you want
    that collection to be cleaned up so it''s not using anymore memory, you must remove
    all references to the collection and the individual objects in it. Once you remove
    all references, things will be cleaned up. This is just the standard JavaScript
    garbage collection rule.”


    In his article, Derick covers many of the common [memory pitfalls](http://lostechies.com/derickbailey/2012/03/19/backbone-js-and-javascript-garbage-collection/)^([39](#chapter-7.xhtml_fn7_39))
    when working with `Backbone`. There is also a helpful [DocumentFragment](https://www.w3.org/TR/DOM-Level-2-Core.html#ID-B6ED1A3)^([40](#chapter-7.xhtml_fn7_40)),
    a lightweight document object. Think of it as a way to extract a portion of a
    document, or create a new “fragment” of a document. Rather than constantly adding
    to the DOM, we can use document fragments to build up all we need and only perform
    a single insert into the DOM to avoid excessive reflow.

