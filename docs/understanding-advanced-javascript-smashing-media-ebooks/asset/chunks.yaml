    was one of the first efforts to provide developers a means to developing more
    complex applications and some might say it in-part inspired us to think more about
    the needs of non-trivial applications. I sat down to ask Dojos [Dylan Schiemann](http://dylanschiemann.com)^([20](#chapter-4.xhtml_fn4_20)),
    Kitson Kelly, and James Thomas what their thoughts were on the rise of JavaScript
    MV* frameworks.


    **Q: Didn''t Dojo already solve all of this? Why hasn''t it been the dominent
    solution for developers wishing to build more structured (and more non-trivial)
    applications?**


    Years ago, while the JavaScript landscape evolved from adding simple Ajax and
    chrome to a page, Dojo was evangelizing a “toolkit” approach to building complex
    Web applications.


    Many of those features were way ahead of most developers needs. With the emergence
    of the browser as the dominant application platform, many of the innovations pioneered
    in The Dojo Toolkit now appear in newer toolkits. MVC was just another package
    that Dojo has provided for quite some time, along with modular code packages,
    OO in JS, UI widgets, cross-browser graphics, templating, internationalization,
    accessibility, data stores, testing frameworks, a build system and much, much
    more.


    JavaScript libraries shouldn''t end at “query”, which is why Dojo, early on, focussed
    on completing the picture for enterprise grade application development. This is
    the same focus that is has today with MVC, it''s just another “tool in the arsenal”.'
