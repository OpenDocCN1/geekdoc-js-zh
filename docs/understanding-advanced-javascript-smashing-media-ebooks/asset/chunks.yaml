    \ primitives (string, number, boolean) it can get as simple (as in “short”) as:\n\
    \n```javascript\nfunction castaway(some_string, some_integer, some_boolean) {\n\
    \  some_string += \"\";\n  some_integer += 0; // parseInt(some_integer, 10) is\
    \ the safer bet\n  some_boolean = !!some_boolean;\n}\n```\n\nI'm not advocating\
    \ you to do this everywhere and at all times. But these innocent looking lines\
    \ may save time and some suffering while integrating your code.\n\n#### Treating\
    \ undefined as an Expected Value\n\nThere will come a time when `undefined` is\
    \ a value that your API actually expects to be given for setting an attribute.\
    \ This might happen to “unset” an attribute, or simply to gracefully handle bad\
    \ input, making your API more robust. To identify if the value `undefined` has\
    \ actually been passed by your method, you can check the [`arguments`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Functions_and_function_scope/arguments)\
    \ object:\n\n```javascript\nfunction testUndefined(expecting, someArgument) {\n\
    \  if (someArgument === undefined) {\n    console.log(\"someArgument was undefined\"\
    );\n  }\n  if (arguments.length > 1) {\n    console.log(\"but was actually passed\
    \ in\");\n  }\n}\n\ntestUndefined(\"foo\");\n// prints: someArgument was undefined\n\
    testUndefined(\"foo\", undefined);\n// prints: someArgument was undefined, but\
    \ was actually passed in\n```\n\n#### Named Arguments\n\n```javascript\nevent.initMouseEvent(\n\
    \  \"click\", true, true, window, \n  123, 101, 202, 101, 202, \n  true, false,\
    \ false, false, \n  1, null);\n```\n\nThe function signature of [Event.initMouseEvent](https://developer.mozilla.org/en-US/docs/DOM/event.initMouseEvent)\
    \ is a nightmare come true. There is no chance any developer will remember what\
    \ that `1` (second to last parameter) means without looking it up in the documentation.\
    \ No matter how good your documentation is, do what you can so people don't have\
    \ to look things up!\n\n#### How Others Do It\n\nLooking beyond our beloved language,\
    \ we find Python knowing a concept called [named arguments](http://www.diveintopython.net/power_of_introspection/optional_arguments.html).\
    \ It allows you to declare a function providing default values for arguments,\
    \ allowing your attributed names to be stated in the calling context:\n\n```javascript\n\
    function namesAreAwesome(foo=1, bar=2) {\n  console.log(foo, bar);\n}\n\nnamesAreAwesome();\n\
    // prints: 1, 2\n\nnamesAreAwesome(3, 4);\n// prints: 3, 4\n\nnamesAreAwesome(foo=5,\
    \ bar=6);\n// prints: 5, 6\n\nnamesAreAwesome(bar=6);\n// prints: 1, 6\n```\n\n\
    Given this scheme, `initMouseEvent()` could've looked like a self-explaining function\
    \ call:\n\n```javascript\nevent.initMouseEvent(\n  type=\"click\", \n  canBubble=true,\
    \ \n  cancelable=true, \n  view=window, \n  detail=123,\n  screenX=101, \n  screenY=202,\
    \ \n  clientX=101, \n  clientY=202, \n  ctrlKey=true, \n  altKey=false, \n  shiftKey=false,\
    \ \n  metaKey=false, \n  button=1, \n  relatedTarget=null);\n```\n\nIn JavaScript\
    \ this is not possible today. While “the next version of JavaScript” (frequently\
    \ called ES.next, ES6, or Harmony) will have [default parameter values](http://wiki.ecmascript.org/doku.php?id=harmony:parameter_default_values)\
    \ and [rest parameters](http://wiki.ecmascript.org/doku.php?id=harmony:rest_parameters),\
    \ there is still no sign of named parameters.\n\n#### Argument Maps\n\nJavaScript\
    \ not being Python (and ES.next being light years away), we're left with fewer\
    \ choices to overcome the obstacle of “argument forests”. jQuery (and pretty much\
    \ every other decent API out there) chose to work with the concept of “option\
    \ objects”. The signature of [`jQuery.ajax()](http://api.jquery.com/jquery.ajax/)`\
    \ provides a pretty good example. Instead of accepting numerous arguments, we\
    \ only accept an object:\n\n```javascript\nfunction nightmare(accepts, async,\
    \ beforeSend, cache, complete, /* and 28 more */) {\n  if (accepts === \"text\"\
    ) {\n    // prepare for receiving plain text\n  }\n}\n\nfunction dream(options)\
    \ {\n  options = options || {};\n  if (options.accepts === \"text\") {\n    //\
    \ prepare for receiving plain text\n  }\n}\n```\n\nNot only does this prevent\
    \ insanely long function signatures, it also makes calling the function more descriptive:\n\
