  trans: "\n当我们将 HTTP 运行在 TCP 之上时，现在有了一个 HTTP 客户端（通常是浏览器），它发起了 TCP 连接并发送第一个数据包（例如，一个\
    \ `GET` 请求）。如果我们使用 HTTP/1.1（现在几乎所有人都在使用），那么默认将是使用 HTTP 保持存活连接（`Connection: keep-alive`）。这意味着多个\
    \ HTTP 请求可能会在同一个 TCP 连接上发生。这是好事，因为这意味着我们减少了握手的开销（额外的三个数据包）。\n\n\n\n现在，除非我们开启了\
    \ [HTTP 管道化传输](http://en.wikipedia.org/wiki/HTTP_pipelining)^(11)（大多数浏览器和服务器都禁用了它），否则这些请求将串顺序发生。\n\
    \n![HTTP keep-alive](img/http-keepalive.png)\n\n我们现在可以稍微修改代码，将 TCP 握手时间考虑进来，并相应测量延迟。\n\
    \n```javascript\nvar t=[], n=2, tcp, rtt;\nvar ld = function() {\n   t.push(+new\
    \ Date);\n   if(t.length > n) \n     done();\n   else {\n     var img = new Image;\n\
    \     img.onload = ld;\n     img.src=\"/1x1.gif?\" + Math.random()\n         \
    \                + '=' + new Date;\n   }\n};\n\nvar done = function() {\n  rtt=t[2]-t[1];\n\
    \  tcp=t[1]-t[0]-rtt;\n};\nld();\n```\n\n通过这段代码，我们可以同时测量延迟和 TCP 握手时间。有一种可能是 TCP\
    \ 连接已经处于状态，并且第一个请求通过该连接发送。在这种情况下，这两个时间将非常接近。在所有其他情况下，需要两个数据包的 `rtt` 应该是需要三个数据包的\
    \ `tcp` 的大约 66%。注意我用的是“大约”这个词，因为网络抖动和 IP 层的不同路由可能会导致同一个 TCP 连接中的两个数据包在通过时花费不同的时间。\n\
    \n你会注意到，这里我们忽略了第一张图片可能也需要 DNS 查找这一事实。我们将在第 2 部分讨论这一点。\n\n### 使用 JavaScript 测量网络吞吐量\n\
    \n同样，我们对这个测试的第一直觉只是下载一张大图片并测量它需要多长时间。然后 `size/time` 应该就能告诉我们吞吐量。\n\n为了这段代码，让我们假设我们有一个名为\
    \ `image` 的全局对象，其中包含图片的 URL 和位大小的细节。\n\n```javascript\n// 假设全局对象\n// image={ url:\
    \ …, size: … }\nvar ts, rtt, bw, img = new Image;\nimg.onload=function() {\n \
    \  rtt=(+new Date - ts);\n   bw = image.size*1000/rtt;    // rtt 单位是 ms\n};\n\
    ts = +new Date;\nimg.src=image.url;\n```\n\n一旦这段代码执行完成，我们应该会将每秒千比特的网络吞吐量存储在 `bw`\
    \ 中。\n\n遗憾的是，这并不简单，因为存在所谓的 [TCP 慢启动](http://en.wikipedia.org/wiki/Slow-start)^(12)\n\
    \n#### 慢启动\n\n为了避免网络拥塞，TCP 连接的双方都将缓慢地发送数据并等待确认（ACK 数据包）。记住，ACK 数据包意味着“我确认了你刚刚发送给我的内容”。每当在没有超时的情况下收到\
    \ ACK 时，它假设对方可以运行得更快，并在等待下一个 ACK 之前发送更多数据包。如果在一个预期的时间内没有收到 ACK，它就假设对方运行得不够快，从而进行回退。\n\
    \n![用于慢启动的 TCP 窗口大小](http://media.smashingmagazine.com/wp-content/uploads/2011/10/tcp-windows.png)\n\
    \n这意味着，只要我们的图片足够小，能够放入当前的 TCP 窗口（在在开始时设置为 2），那么我们上面的吞吐量测试就是没问题的。虽然这对于慢网络来说没问题，但对于快速网络来说，如此小的图片并不会产生真正的负担。\n\
    \n相反，我们将尝试发送大小递增的图片，并测量每张图片下载所需的时间。\n\n为了代码实现，全局 `image` 对象现在是一个具有如下结构的数组：\n\n\
    ```javascript\nvar image = [\n  {url: …, size: … }\n];\n```\n\n使用数组使得遍历图片列表变得简单，我们可以轻松地在数组末尾添加大图片来测试更快的网络连接。\n\
    \n```javascript\nvar i=0;\nvar ld = function() {\n   if(i > 0)\n      image[i-1].end\
    \ = +new Date;\n   if(i >= image.length)\n      done();\n   else {\n      var\
    \ img = new Image;\n      img.onload = ld;\n      image[i].start = +new Date;\n\
    \      img.src=image[i].url;\n   }\n   i++;\n};\n```\n\n遗憾的是，当非常慢的连接遇到一张较大的图片时，这种方法就会失效；因此，我们为每张图片添加一个\
    \ `timeout` 值，设计旨在快速触及常见的网络连接速度。图片大小和 `timeout` 值的详细信息列在[此表格](https://spreadsheets.google.com/ccc?key=0)中。\n\
    \n等待，提供的文本在结尾处有重复。我们将根据表格清理逻辑：\n\n```javascript\nvar i=0;\nvar ld = function()\
    \ {\n   if(i > 0)\n      image[i-1].end = +new Date;\n   if(i >= image.length)\n\
    \      done();\n   else {\n      var img = new Image;\n      img.onload = ld;\n\
    \      image[i].start = +new Date;\n      img.src=image[i].url;\n   }\n   i++;\n\
    };\n```\n\n实际上，源文本在结尾处有重复的块。我们将提供最终的逻辑：\n\n```javascript\nvar i=0;\nvar ld = function()\
    \ {\n   if(i > 0)\n      image[i-1].end = +new Date;\n   if(i >= image.length)\n\
    \      done();\n   else {\n      var img = new Image;\n      img.onload = ld;\n\
    \      image[i].start = +new Date;\n      img.src=image[i].url;\n   }\n   i++;\n\
    };\n```\n\n### 总结与参考文献\n\n这就是本系列的第一部分的全部。我们查看了构成请求的数据包是如何通过浏览器和服务器的，它们如何随时间变化，以及我们如何使用\
    \ JavaScript 和一些统计知识对我们面对的特征做出合理的推断。\n\n以下是编写本文档有帮助的资源列表：\n\n- [Greg 的地图](http://cablemap.info/)^(14),Greg\
    \ Mahne\n\n关于海底缆的聚合信息。\n\n- [传输控制协议](http://en.wikipedia.org/wiki/Transmission_Control_Protocol)^(15),维基百科\n\
    \n该页面链接了所有的 RFC。\n\n- [*TCP/IP 详解卷卷 1：协议*](http://www.amazon.com/TCP-Illustrated-Vol-Wesley-Professional/dp/0201633469)^(16),Richard\
    \ 著\n\nAmazon 上的书籍链接。\n\n- [慢启动](http://en.wikipedia.org/wiki/Slow-start)^(17),维基百科\n\
    \n此外，参见上面的拥塞控制和 Nagle 算法。\n\n- [带宽图片大小](https://spreadsheets.google.com/ccc?key=0AplxPyCzmQi6dDRBN2JEd190N1hhV1N5cHQtdBMUE&hl=en_GB)^(18),Google\
    \ 表格\n\n这是基于构建 Boomerang 时的研究。\n\n- [Boomerang](http://github.com/bluesmoon/boomerang)^(19)\n\
    \nGitHub 上的 Boomerang 项目，许多内容在此已实现。\n"
