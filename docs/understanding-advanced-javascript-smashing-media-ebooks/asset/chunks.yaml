- fmt: "\n- As mentioned earlier, a better alternative to manual de-referencing is\
    \ to use variables with an appropriate scope. I.e. instead of a global variable\
    \ that's nulled out, just use a function-local variable that goes out of scope\
    \ when it's no longer needed. This means cleaner code with less to worry about.\n\
    - Ensure that you're unbinding event listeners where they are no longer required,\
    \ especially when the DOM objects they're bound to are about to be removed.\n\
    - If you're using a data cache locally, make sure to clean that cache or use an\
    \ aging mechanism to avoid large chunks of data being stored that you're unlikely\
    \ to reuse.\n\n## Functions\n\nNext, let's look at functions. As we've already\
    \ said, garbage collection works by reclaiming blocks of memory (objects) which\
    \ are no longer reachable. To better illustrate this, here are some examples.\n\
    \n```\nfunction foo() {\n    var bar = new LargeObject();\n    bar.someCall();\n\
    }\n```\n\nWhen `foo` returns, the object which `bar` points to is automatically\
    \ available for garbage collection, because there is nothing left that has a reference\
    \ to it.\n\nCompare this to:\n\n```\nfunction foo() {\n    var bar = new LargeObject();\n\
    \    bar.someCall();\n    return bar;\n}\n\n// somewhere else\nvar b = foo();\n\
    ```\n\nWe now have a reference to the object which survives the call and persists\
    \ until the caller assigns something else to `b` (or `b` goes out of scope).\n\
    \n## Closures\n\nWhen you see a function that returns an inner function, that\
    \ inner function will have access to the outer scope even after the outer function\
    \ is executed. This is basically a [closure](http://robertnyman.com/2008/10/09/explaining-javascript-scope-and-closures/)^([9](#chapter-7.xhtml_fn7_9))—an\
    \ expression which can work with variables set within a specific context. For\
    \ example:\n\n```\nfunction sum (x) {\n    function sumIt(y) {\n        return\
    \ x + y;\n    };\n    return sumIt;\n}\n\n// Usage\nvar sumA = sum(4);\nvar sumB\
    \ = sumA(3);\nconsole.log(sumB); // Returns 7\n```\n\nThe function object created\
    \ within the execution context of the call to `sum` can't be garbage collected,\
    \ as it's referenced by a global variable and is still very much accessible. It\
    \ can still be executed via `sumA(n)`.\n\nLet's look at another example. Here,\
    \ can we access `largeStr`?\n\n```\nvar a = function () {\n    var largeStr =\
    \ new Array(1000000).join('x');\n    return function () {\n        return largeStr;\n\
    \    };\n}();\n```\n\nYes, we can, via `a()`, so it's not collected. How about\
    \ this one?\n\n```\nvar a = function () {\n    var smallStr = 'x';\n    var largeStr\
    \ = new Array(1000000).join('x');\n    return function (n) {\n        return smallStr;\n\
    \    };\n}();\n```\n\nWe can't access it anymore and it's a candidate for garbage\
    \ collection.\n\n## Timers\n\nOne of the worst places to leak is in a loop, or\
    \ in `setTimeout()`/`setInterval()`, but this is quite common.\n\nConsider the\
    \ following example.\n\n```\nvar myObj = {\n    callMeMaybe: function () {\n \
    \       var myRef = this;\n        var val = setTimeout(function () { \n     \
    \       console.log('Time is running out!'); \n            myRef.callMeMaybe();\n\
    \        }, 1000);\n    }\n};\n```\n\nIf we then run:\n\n```\nmyObj.callMeMaybe();\n\
    ```\n\nto begin the timer, we can see every second “Time is running out!” If we\
    \ then run:\n\n```\nmyObj = null;\n```\n\nthe timer will still fire. `myObj` won't\
    \ be garbage collected as the closure passed to `setTimeout` has to be kept alive\
    \ in order to be executed. In turn, it holds references to `myObj` as it captures\
    \ `myRef`. This would be the same if we'd passed the closure to any other function,\
    \ keeping references to it.\n\nIt is also worth keeping in mind that references\
    \ inside a `setTimeout`/`setInterval` call, such as functions, will need to execute\
    \ and complete before they can be garbage collected.\n\n## Be Aware Of Performance\
    \ Traps\n\nIt's important never to optimize code until you actually need to. This\
    \ can't be stressed enough. It's easy to see a number of micro-benchmarks showing\
    \ that N is more optimal than M in V8, but test it in a real module of code or\
    \ in an actual application, and the true impact of those optimizations may be\
    \ much more minimal than you were expecting.\n\n[![Speed trap.](images/speed-trap.jpg\
    \ \"Speed Trap\")](http://www.flickr.com/photos/tim_uk/7717078488/sizes/c/in/photostream/)\n\
    \n*Doing too much can be as harmful as not doing anything. Image source: [Tim\
    \ Sheerman-Chase](http://www.flickr.com/photos/tim_uk/7717078488/sizes/c/in/photostream/)^([10](#chapter-7.xhtml_fn7_10)).*\n\
    \nLet's say we want to create a module which:\n- Takes a local source of data\
    \ containing items with a numeric ID,\n- Draws a table,\n- Adds event for toggling\
    \ class\n\nNote: This is NOT what you should be doing\n\n```\nvar moduleA = function\
    \ () {\n    return {\n        data: dataArray,\n        init: function () {\n\
    \            this.addTable();\n            this.addEvents();\n        },\n\n \
    \       addTable: function () {\n            for (var i = 0; i < rows; i++) {\n\
    \                $tr = $('<tr></tr>');\n                for (var j = 0; j < this.data.length;\
    \ j++) {\n                    $tr.append('<td>' + this.data[j] + '</td>');\n \
    \               }\n                $tr.appendTo($tbody);\n            }\n    \
    \    },\n        addEvents: function () {\n            $('table td').on('click',\
    \ function () {\n                $(this).toggleClass('active');\n            });\n\
    \        }\n    };\n}();\n```\n\nSimple, but it gets the job done.\n\nIn this\
    \ case however, the only data we're iterating are IDs, a standard array. Interestingly,\
    \ directly using `DocumentFragment` and native DOM methods are more optimal than\
    \ using jQuery (in this manner) for table generation, and of course, event delegation\
    \ is typically more performant than binding each `td` individually.\n\nNote that\
    \ jQuery does use `DocumentFragment` internally behind the scenes, but in our\
    \ example, the code is calling `append()` within a loop and each of these calls\
    \ has little knowledge of the other so it may not be able to optimize for this\
    \ example. This should hopefully not be a pain point, but be sure to benchmark\
    \ your own code to be sure.\n\nIn our case, adding in these changes results in\
    \ some good (expected) performance gains. Event delegation provides decent improvement\
    \ over simply binding, and opting for `documentFragment`](http://jsperf.com/first-pass)^([11](#chapter-7.xhtml_fn7_11))\
    \ was a real booster.\n\n```\nvar moduleD = function () {\n    return {\n    \
    \    data: dataArray,\n        init: function () {\n            this.addTable();\n\
    \            this.addEvents();\n        },\n        addTable: function () {\n\
    \            var td, tr;\n            var frag = document.createDocumentFragment();\n\
    \            var frag2 = document.createDocumentFragment();\n\n            for\
    \ (var i = 0; i < rows; i++) {\n                tr = document.createElement('tr');\n\
    \                for (var j = 0; j < this.data.length; j++) {\n              \
    \      td = document.createElement('td');\n                    td.appendChild(document.createTextNode(this.data[j]));\n\
    \n                    frag2.appendChild(td);\n                }\n            \
    \    tr.appendChild(frag2);\n                frag.appendChild(tr);\n         \
    \   }\n        },\n        addEvents: function () {\n            $('table').on('click',\
    \ 'td', function () {\n                $(this).toggleClass('active');\n      \
    \      });\n        }\n    };\n}();\n```\n"
