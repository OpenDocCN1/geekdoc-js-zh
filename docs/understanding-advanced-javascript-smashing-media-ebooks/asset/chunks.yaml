  trans: '

    我需要一个灵活的方案，为我的应用程序提供关注点分离的极简解决方案。它应该支持持久化层和 RESTful 同步、模型、视图（带控制器）、事件驱动通信、模板渲染和路由。它应该是命令式的，允许在模型变化时更新视图。我希望架构方面的一些决策能由我来决定。理想情况下，许多大型公司已经使用该方案构建了非复杂的应用程序。由于我可能会构建复杂的系统，我希望该框架周围有一个活跃的扩展社区，他们已经尝试解决更大的问题（[Marionette](https://github.com/derickbailey/backbone.marionette)^(62),
    [Chaplin](https://github.com/chaplinjs/chaplin)^(63), [Aura](https://github.com/addyosmani/backbone-aura/)^(64),
    [Thorax](https://github.com/walmartlabs/thorax)^(65)）。理想情况下，该方案还有可脚手架工具（[grunt-bbb](https://github.com/backbone-boilerplate/grunt-bbb)^(66),
    [brunch](http://brunch.io/)^(67)）。使用 `Backbone.js.`。


    我需要一个尝试解决 Web 端桌面级应用开发的方案。它应该是有主见的、模块化的，支持某种变体 MVC，避免需要手动连接应用程序中的所有内容，支持持久化、计算属性并具有自动更新（实时）模板。它应该支持良好的状态管理，而不是许多其他框架提倡使用的手动路由解决方案。它还应该带有详尽的文档，当然还有模板渲染。它也应该提供脚手架工具（ember.gem,
    ember for brunch）。使用 `Ember.js.`。


    我需要一个更轻量级的，支持实时绑定模板、路由、与主流库（如 `jQuery` 和 `Dojo`）集成，并针对性能进行了优化。它还应该支持一种实现模型、视图和控制器的方法。它可能还没有用于许多大型公共应用，但具有潜力。理想情况下，该方案应该由具有创建许多复杂应用经验的人构建。使用
    `CanJS.`。


    我需要一个声明式的、通过视图来推导行为的方案。它专注于通过自定义 HTML 标签和组件来指定应用程序意图。它应该支持易于测试、URL 管理（路由）以及通过变体
    MVC 实现关注点分离。它采取了与大多数框架不同的方法，提供了一个 HTML 编译器来在 HTML 中创建自己的 DSL。它可能受到即将推出的 Web 平台特性（如
    Web Components）的启发，并且有自己的脚手架工具（angular-seed）。使用 `AngularJS.`。


    我需要一个能为构建大规模应用提供极佳基础的方案。它应该支持成熟的组件基础设施、支持懒加载且可以异步的模块、与 CDN 的简单集成、广泛的组件模块（图形、图表、网格等）以及对国际化（i18n,
    l10n）的强大支持。它应该支持 OOP、MVC 以及构建更复杂架构的构建块。使用 `Dojo.`。


    我需要一个受益于 YUI 扩展基础设施的方案。它应该支持模型、视图和路由器，并让编写支持路由、视图切换等更多的多视图应用程序变得简单。虽然体积较大，但它是一个完整的解决方案，包含了组件/插件以及创建组织良好的应用程序架构所需的工具。它可能有脚手架工具（yuiproject），但这些工具需要更新。使用
    `YUI.`。


    我需要一个简单的、重视异步接口且无任何依赖的方案。它应该是有主见的，但在构建应用的方式上是灵活的。该框架应该提供模型、视图、控制器、事件和路由等核心功能，同时保持极轻量。它应该针对
    CoffeeScript 的使用进行优化，并附带完整的文档。使用 `Spine.`。


    我需要一个能够通过的底层数据模型和声明式绑定轻松构建动态 UI 的方案。它应该通过双向绑定在模型变化时自动更新我的 UI，并支持对模型数据的依赖跟踪。我应该能够在我喜欢的任何框架甚至现有应用中使用它。它还应该内置模板渲染并易于扩展。使用
    `KnockoutJS.`。


    我需要一个帮助我构建简单 Web 应用程序和网站的方案。我不预期涉及大量的代码，因此代码组织不需要太担心。该方案应该抽象浏览器差异，以便我可以专注于有趣的部分。它应该让我轻松绑定事件、与远程服务交互、具有可扩展性并拥有巨大的插件社区。使用
    `jQuery.`。


    ### 开发者如何看待最流行的框架？


    作为我们对 TodoMVC 的 MV* 框架研究以及本文的一部分，我们决定进行一项调查，以汇总使用这些解决方案的人的经验。我们询问开发者发现自己最常用哪个框架，更重要的是，他们为什么要向其他人推荐它们。我们还询问了他们认为所选项目中仍然缺失了什么。


    我们在下方按框架对一些最有趣的回复进行了归类。


    #### Ember.js


    **优点：** 实时模板和可观察对象的结合改变了我编写 JavaScript 的方式。起初可能需要花点时间理解，但最终你会获得良好的职责分离。我发现一旦我设置好了一切，添加相当复杂的功能只需要几行代码。如果没有
    `Ember`，实现这些相同的功能将是痛苦。


    **缺点：** Ember 尚未达到 1.0。许多事情仍然处于变动中，例如 `router` 和 `ember-data`。新网站非常有帮助，但 `Ember`
    的文档仍然不像其他框架那样丰富。此外，由于框架中存在许多“魔法”，这可能会让人害怕。担心如果某些东西坏了，你无法找出原因。噢，而且 `ember` 给你的错误信息通常很糟糕。


    **优点：**


    关键因素：


    a) 允许我避免大量模板代码的功能（绑定、计算属性、带有酷炫的 的视图层）。


    b) 核心团队：我是一个 Rails 开发者，了解 Yehuda Katz 的工作。我信任这个家伙 =)


    **缺点：** 文档。非常遗憾的是 `Ember` 没有像 `Backbone`、`Angular` 或其他框架那样良好的文档、教程、视频。目前，我们通过浏览代码来寻找文档，这并不理想。


    **优点：** 约定优于配置。`Ember` 为你做了许多微小决策，它无疑是目前构建客户端应用最简单的方法。


    **缺点：** 学习曲线。它缺少像 `Backbone` 等框架所拥有的入门指南，这部分是因为社区较小，但我认为更多是因为代码库在 1.0 之前处于变动状态。


    **优点：** 简单、绑定、与 `Handlebars` 的紧密集成、在自己的代码中实现模块化的便利性。


    **缺点：** 我希望与 `ember-data` 有稳定的集成，并有与 REST API 同步的内置 `localStorage` 支持，但嘿，那是某一天会实现的幻想；-;


    #### Backbone.js


    **优点：** 简单——只有 4 个核心组件（`Collection`, `Model`, `View`, `Router`）。庞大的社区（生态系统）以及
    StackOverflow 上有许多解决方案。像 `Marionette` 或 `Vertebrae` 这样的高阶框架内部包含许多巧妙的代码。有些人可能喜欢“低级”——需要编写大量的模板代码，但可以获得定制的应用程序架构。


