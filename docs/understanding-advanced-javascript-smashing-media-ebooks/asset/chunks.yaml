  trans: "\n本章涵盖了在你编写自己的工具类和库之前及编写期间需要考虑的最重要事项。我们将关注如何让你的代码对其他开发者具有`可访问性`（accessible）。为了演示，某些主题会涉及到\
    \ `jQuery`，但本章既不是关于 `jQuery`，也不是关于为它编写插件。\n\n彼得·德鲁克（（Peter Drucker）曾说过：“电脑是个白痴。”不要为白痴写代码，要为人类写代码！让我们深入设计开发者喜爱使用的\
    \ API 吧。\n\n## 流式接口\n\n[流式接口](http://en.wikipedia.org/wiki/Fluent_interface#JavaScript)^(1)\
    \ 通常被称为`方法链`（Method Chaining，尽管这只是 true 事实的一半）。对于初学者来说，它看起来像 `jQuery 风格`。虽然我相信\
    \ API 风格是 `jQuery` 成功的关键因素之一，但它并不是由他们发明的——这似乎归功于马丁·福勒（Martin Fowler），他在 2005 年[创造了这一术语](http://martinfowler.com/bliki/FluentInterface.html)^(2)，大约在\
    \ `jQuery` 发布的一年前。不过，福勒只是给它起了一个名字——流式接口已经存在很长时间了。\n\n除了重大的简化，`jQuery` 甚至提供了平滑浏览器之间巨大差异的方法。这一直是我在这个极其成功的库中最喜欢的`流式接口`。我已经非常喜欢这种特定的\
    \ API 风格，以至于显而易见，我想在 [URI.js](http://medialize.github.com/URI.js/)^(3) 中也使用这种风格。在调优\
    \ `URI.js` API 时，我不断查看 `jQuery` 的源码，寻找那些让我的实现尽可能简单的小技巧。我发现我在这件事上并不孤单。[Lea Verou](https://twitter.com/leaverou)^(4)\
    \ 创建了 [chainvas](http://lea.verou.me/chainvas/)^(5)——一个将普通的 getter/setter API\
    \ 包装成优雅的流式接口的工具。Underscore 的 [`_.chain()`](http://underscorejs.org/#chain)^(6)\
    \ 也做了类似的事情。事实上，大多数新一代的库都支持方法链。\n\n### 方法链\n\n[方法链](http://en.wikipedia.org/wiki/Method_chaining)^(7)\
    \ 的核心思想是实现尽可能流畅可读的代码，从而更快地理解。通过`方法链`，我们可以将代码组织成类似句子的序列，使代码易读，同时减少过程中的噪音：\n\n```\n\
    // 使用普通 API 调用更改某些颜色并添加事件监听\nvar elem = document.getElementById(\"foobar\");\n\
    elem.style.background = \"red\";\nelem.style.color = \"green\";\nelem.addEventListener('click',\
    \ function(event) {\n  alert(\"hello world!\");\n}, true);\n\n// (想象中的)方法链 API\n\
    DOMHelper.getElementById('foobar')\n  .setStyle(\"background\", \"red\")\n  .setStyle(\"\
    color\", \"green\")\n  .addEvent(\"click\", function(event) {\n    alert(\"hello\
    \ world\");\n  });\n```\n\n注意，我们不需要将元素的引用赋值给变量并反复重复。\n\n### 命令与查询分离\n\n[命令与查询分离](http://en.wikipedia.org/wiki/Command-query_separation)^(8)\
    \ (CQS) 是继承自命令式编程的概念。改变对象状态（内部值）的函数称为`命令`（commands），获取状态的函数称为`查询`（queries）。\n"
- fmt: "\n```javascript\nString.prototype.foo = function() {\n  return new Foo(this);\n\
    }\n\n\"I'm a native object\".foo()\n  .iAmACustomFunction();\n```\n\nWith this\
    \ approach your functions are still within your namespace, but made accessible\
    \ through another object. Make sure your equivalent of `.foo()` is a non-generic\
    \ term, something highly unlikely to collide with other APIs. Make sure you provide\
    \ proper `.valueOf()`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/valueOf)\
    \ and `.toString()`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/toString)\
    \ methods to convert back to the original primitive types.\n\n### Consistency\n\
    \n[Jake Archibald](https://twitter.com/jaffathecake) once had a slide defining\
    \ *Consistency*. It simply read [*Not PHP*](http://www.slideshare.net/slideshow/embed_code/5426258?startSlide=59).\
    \ Do. Not. Ever. Find yourself naming functions like `str_repeat()`, `strpos()`,\
    \ `substr()`. Also, don't ever shuffle around positions of arguments. If you declared\
    \ `find_in_array(haystack, needle)` at some point, introducing `findInString(needle,\
    \ haystack)` will invite an angry mob of zombies to rise from their graves to\
    \ hunt you down and force you to write delphi for the rest of your life!\n\n###\
    \ Naming Things\n\n> “There are only two hard problems in computer science: cache-invalidation\
    \ and naming things.”\n\n> — Phil Karlton\n\nI've been to numerous talks and sessions\
    \ trying to teach me the finer points of naming things. I haven't left any of\
    \ them without having heard the above said quote, nor having learnt how to actually\
    \ name things. My advice boils down to *keep it short but descriptive and go with\
    \ your gut*. But most of all, keep it consistent.\n\nThe `DateInterval` example\
    \ above introduced a method called `until()`. We could have named that function\
    \ `interval()`. The latter would have been closer to the returned value, while\
    \ the former is more *humanly readable*. Find a line of wording you like and stick\
    \ with it. Consistency is 90% of what matters. Choose one style and keep that\
    \ style—even if you find yourself disliking it at some point in the future.\n\n\
    ### Handling Arguments\n\n![Good Intentions](images/good-intention.jpg \"Good\
    \ Intentions\")\n\nHow your methods accept data is more important than making\
    \ them chainable. While method chaining is a pretty generic thing that you can\
    \ easily make your code do, handling arguments is not. You'll need to think about\
    \ how the methods you provide are most likely going to be used. Is code that uses\
    \ your API likely to repeat certain function calls? Why are these calls repeated?\
    \ How could your API help the developer to reduce the noise of repeating method\
    \ calls?\n\njQuery's [`css()`](http://api.jquery.com/css/) method can set styles\
    \ on a DOM element:\n\n```javascript\njQuery(\"#some-selector\")\n  .css(\"background\"\
    , \"red\")\n  .css(\"color\", \"white\")\n  .css(\"font-weight\", \"bold\")\n\
    \  .css(\"padding\", 10);\n```\n\nThere's a pattern here! Every method invocation\
    \ is naming a style and specifying a value for it. This calls for having the method\
    \ accept a map:\n\n```javascript\njQuery(\"#some-selector\").css({\n  \"background\"\
    \ : \"red\",\n  \"color\" : \"white\",\n  \"font-weight\" : \"bold\",\n  \"padding\"\
    \ : 10\n});\n```\n\njQuery's [`on()`](http://api.jquery.com/on/) method can register\
    \ event handlers. Like `css()` it accepts a map of events, but takes things even\
    \ further by allowing a single handler to be registered for multiple events:\n\
    \n```javascript\n// binding events by passing a map\njQuery(\"#some-selector\"\
    ).on({\n  \"click\" : myClickHandler,\n  \"keyup\" : myKeyupHandler,\n  \"change\"\
    \ : myChangeHandler\n});\n\n// binding a handler to multiple events:\njQuery(\"\
    #some-selector\").on(\"click keyup change\", myEventHandler);\n```\n\nYou can\
    \ offer the above function signatures by using the following *method pattern*:\n\
    \n```javascript\nDateInterval.prototype.values = function(name, value) {\n  var\
    \ map;\n\n  if (jQuery.isPlainObject(name)) {\n    // setting a map\n    map =\
    \ name;\n  } else if (value !== undefined) {\n    // setting a value (on possibly\
    \ multiple names), convert to map\n    keys = name.split(\" \");\n    map = {};\n\
    \    for (var i = 0, length = keys.length; i < length; i++) {\n      map[keys[i]]\
    \ = value;\n    }\n  } else if (name === undefined) {\n    // getting all values\n\
    \    return this.values;\n  } else {\n    // getting specific value\n    return\
    \ this.values[name];\n  }\n\n  for (var key in map) {\n    this.values[name] =\
    \ map[key];\n  }\n\n  return this;\n};\n```\n\nIf you are working with collections,\
    \ think about what you can do to reduce the number of loops an API user would\
    \ probably have to make. Say we had a number of `<input>` elements for which we\
    \ want to set the default value:\n\n```html\n<input type=\"text\" value=\"\" data-default=\"\
    foo\">\n<input type=\"text\" value=\"\" data-default=\"bar\">\n<input type=\"\
    text\" value=\"\" data-default=\"baz\">\n```\n\nWe'd probably go about this with\
    \ a loop:\n\n```javascript\njQuery(\"input\").each(function() {\n  var $this =\
    \ jQuery(this);\n  $this.val($this.data(\"default\"));\n});\n```\n\nWhat if we\
    \ could bypass that method with a simple callback that gets applied to each `<input>`\
    \ in the collection? jQuery developers have thought of that and allow us to write\
    \ less™:\n\n```javascript\njQuery(\"input\").val(function() {\n  return jQuery(this).data(\"\
    default\");\n});\n```\n\nIt's the little things like accepting maps, callbacks\
    \ or serialized attribute names, that make using your API not only cleaner, but\
    \ more comfortable and efficient to use.\n\n### Handling Types\n\nWhenever you\
    \ define a function that will accept arguments, you decide what that function\
    \ accepts. A function to calculate the number of days between two dates could\
    \ look like:\n\n```javascript\nDateInterval.prototype.days = function(start, end)\
    \ {\n  return Math.floor((end - start) / 864000);\n};\n```\n\nAs you can see,\
    \ the function expects numeric input—a millisecond timestamp, to be exact. While\
    \ the function does what we intended it to do, it is not versatile. What if we're\
    \ working with `Date` objects or a string representation of a date? Is the user\
    \ of this function supposed to cast data all the time? No! Simply verifying the\
    \ input and casting it to whatever we need it to be should be done in a central\
    \ place, not cluttered throughout the code using our API:\n\n```javascript\nDateInterval.prototype.days\
    \ = function(start, end) {\n  if (!(start instanceof Date)) {\n    start = new\
    \ Date(start);\n  }\n  if (!(end instanceof Date)) {\n    end = new Date(end);\n\
    \  }\n\n  return Math.floor((end.getTime() - start.getTime()) / 864000);\n};\n\
    ```\n\nBy adding these six lines we've given the function the power to accept\
    \ a Date object, a numeric timestamp, or even a string representation like `Sat\
    \ Sep 08 2012 15:34:35 GMT+0200 (CEST)`. We do not know how and for what people\
    \ are going to use our code, but with a little foresight, we can make sure there\
    \ is little pain with integrating our code.\n\nThe experienced developer can spot\
    \ another problem in the example code. We're assuming `start` comes before `end`.\
    \ If the API user accidentally swapped the dates, he'd be given a negative value\
    \ for the number of days between `start` and `end`. Stop and think about these\
    \ situations carefully. If you've come to the conclusion that a negative value\
    \ doesn't make sense, fix it:\n\n```javascript\nDateInterval.prototype.days =\
    \ function(start, end) {\n  if (!(start instanceof Date)) {\n    start = new Date(start);\n\
    \  }\n  if (!(end instanceof Date)) {\n    end = new Date(end);\n  }\n\n  return\
    \ Math.abs(Math.floor((end.getTime() - start.getTime()) / 864000));\n};\n```\n"
