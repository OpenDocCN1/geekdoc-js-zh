  trans: "\n\n通过选项对象（option objects），我们已经涵盖了扩展配置的主题。现在让我们讨论如何允许 API 用户扩展核心代码和 API\
    \ 本身。这是一个重要的课题，因为它允许你的代码专注于重要的事情，同时让 API 用户自己去实现边缘情况（edge-cases）。良好的 API 是简洁的\
    \ API。拥有少数几个配置选项是可以接受的，但拥有几十个选项会让你的 API 显得臃肿且不透明。专注于主要的使用用例，只做大多数 API 用户需要的事情。其他所有事情都留给他们来处理。为了允许\
    \ API 用户扩展你的代码以适应他们的需求，你有几种选择……\n\n### 回调函数 (Callbacks)\n\n回调函数可以通过配置来实现扩展性。你可以使用回调函数允许\
    \ API 用户覆盖你代码的某些部分。当你认为特定任务的处理方式可能与默认代码不同时，可以将该代码重构为可配置的回调函数，以便允许 API 用户轻松地覆盖它：\n\
    \n```\nvar default_options = {\n  // ...\n  position: function($elem, $parent)\
    \ {\n    $elem.css($parent.position());\n  }\n};\n\nfunction Widget(options) {\n\
    \  this.options = jQuery.extend({}, default_options, options || {});\n  this.create();\n\
    };\n\nWidget.prototype.create = function() {\n  this.$container = $(\"<div></div>\"\
    ).appendTo(document.body);\n  this.$thingie = $(\"<div></div>\").appendTo(this.$container);\n\
    \  return this;\n};\n\nWidget.protoype.show = function() {\n  this.options.position(this.$thingie,\
    \ this.$container);\n  this.$thingie.show();\n  return this;\n};\n```\n\n```\n\
    var widget = new Widget({\n  position: function($elem, $parent) {\n    var position\
    \ = $parent.position();\n    // 将 $elem 放置在 $parent 的右下角\n    position.left +=\
    \ $parent.width();\n    position.top += $parent.height();\n    $elem.css(position);\n\
    \  }\n});\nwidget.show();\n```\n\n回调函数也是一种允许 API 用户自定义你代码创建的元素的通用方法：\n\n```\n\
    // 默认的 create 回调什么都不做\ndefault_options.create = function($thingie){};\n\nWidget.prototype.create\
    \ = function() {\n  this.$container = $(\"<div></div>\").appendTo(document.body);\n\
    \  this.$thingie = $(\"<div></div>\").appendTo(this.$container);\n  // 执行 create\
    \ 回调以允许装饰\n  this.options.create(this.$thingie);\n  return this;\n};\n```\n\n\
    ```\nvar widget = new Widget({\n  create: function($elem) {\n    $elem.addClass('my-style-stuff');\n\
    \  }\n});\nwidget.show();\n```\n\n每当你接受回调函数时，务必记录它们的签名（signature）并提供示例以帮助 API\
    \ 用户自定义你的代码。确保回调执行时的上下文（`this` 指向哪里）以及它们接受的参数是一致的。\n\n### 事件 (Events)\n\n在处理 DOM\
    \ 时，事件是自然而。在较大的应用程序中，我们使用各种形式的事件（例如 PubSub）来实现模块之间的通信。在处理 UI 组件时，事件显得特别有用且最符合习惯。像\
    \ jQuery 这样的库提供了简单的接口，让你能够轻松攻克这一领域。\n\n事件接口在某些事情发生时效果最好——这也是名称由来。显示和隐藏组件可能取决于你范围之外的情况。在组件显示时更新组件也是非常常见的操作。这两者都可以使用\
    \ jQuery 的事件接口轻松实现，它甚至允许使用委托事件（delegated events）：\n\n```\nWidget.prototype.show\
    \ = function() {\n  var event = jQuery.Event(\"widget:show\");\n  this.$container.trigger(event);\n\
    \  if (event.isDefaultPrevented()) {\n    // 事件处理器阻止了我们的显示\n    return this;\n\
    \  }\n\n  this.options.position(this.$thingie, this.$container);\n  this.$thingie.show();\n\
    \  return this;\n};\n```\n\n```\n// 监听所有的 widget:show 事件\n$(document.body).on('widget:show',\
    \ function(event) {\n  if (Math.random() > 0.5) {\n    // 防止组件显示\n    event.preventDefault();\n\
    \  }\n\n  // 更新组件数据\n  $(this).data(\"last-show\", new Date());\n});\n\nvar widget\
    \ = new Widget();\nwidget.show();\n```\n\n### 钩子 (Hooks)\n\n传统的 getter 和 setter\
    \ 方法可以从钩子中特别获益。钩子与回调的区别通常在于它们的数量和注册方式。回调通常在实例级别上用于特定任务，而钩子通常在全局级别上用于自定义值或分发自定义操作。为了说明钩子如何使用，我们将查看一眼\
    \ [jQuery 的 cssHooks](http://api.jquery.com/jQuery.cssHooks/)^(29):\n\n```\n//\
    \ 定义一个自定义钩子\njQuery.cssHooks.box = {\n  get: function(element, prop) {\n    return\
    \ $(element).css(prop);\n  },\n  set: function(element, prop, value) {\n    $(element).css(prop,\
    \ value);\n    return value;\n  }\n};\n```\n\n"
- fmt: "\nThis approach allows you to generate multiple similar accessor methods,\
    \ rather than defining every method separately. If your accessor methods require\
    \ more data to setup than just a simple string, consider something along the lines\
    \ of:\n\n```\nvar accessors = {\"start\" : {color: \"green\"}, \"end\" : {color:\
    \ \"red\"}};\nfor (var key in accessors) {\n  DateInterval.prototype[key] = generateAccessor(key,\
    \ accessors[key]);\n}\n\nfunction generateAccessor(key, accessor) {\n  var value\
    \ = key + \"Date\";\n  return function(date) {\n    // setting something up \n\
    \    // using `key` and `accessor.color`\n  };\n}\n```\n\nIn the chapter `Handling\
    \ Arguments` we talked about a method pattern to allow your getters and setters\
    \ to accept various useful types like maps and arrays. The method pattern itself\
    \ is a pretty generic thing and could easily be turned into a generator:\n\n```\n\
    function wrapFlexibleAccessor(get, set) {\n  return function(name, value) {\n\
    \    var map;\n\n    if (jQuery.isPlainObject(name)) {\n      // setting a map\n\
    \      map = name;\n    } else if (value !== undefined) {\n      // setting a\
    \ value (on possibly multiple names), convert to map\n      keys = name.split(\"\
    \ \");\n      map = {};\n      for (var i = 0, length = keys.length; i < length;\
    \ i++) {\n        map[keys[i]] = value;\n      }\n    } else {\n      return get.call(this,\
    \ name);\n    }\n\n    for (var key in map) {\n      set.call(this, name, map[key]);\n\
    \    }\n\n    return this;\n  };\n}\n\nDateInterval.prototype.values = wrapFlexibleAccessor(\n\
    \  function(name) { \n    return name !== undefined \n      ? this.values[name]\n\
    \      : this.values;\n  },\n  function(name, value) {\n    this.values[name]\
    \ = value;\n  }\n);\n```\n\nDigging into the art of writing DRY code is well beyond\
    \ this chapter. [Rebecca Murphey](https://twitter.com/rmurphey)^([31](#chapter-8.xhtml_fn8_31))\
    \ wrote [Patterns for DRY-er JavaScript](http://rmurphey.com/blog/2010/07/12/patterns-for-dry-er-javascript/)^([32](#chapter-8.xhtml_fn8_32))\
    \ and [Mathias Bynens'](https://twitter.com/mathias)^([33](#chapter-8.xhtml_fn8_33))\
    \ slide deck on [how DRY impacts JavaScript performance](http://slideshare.net/mathiasbynens/how-dry-impacts-javascript-performance-faster-javascript-execution-for-the-lazy-developer)^([34](#chapter-8.xhtml_fn8_34))\
    \ are a good start, if you're new to the topic.\n\n### The Reference Horror\n\n\
    Unlike other languages, JavaScript doesn't know the concepts of `pass by reference`\
    \ nor `pass by value`. Passing data by value is a safe thing. It makes sure data\
    \ passed to your API and data returned from your API may be modified outside of\
    \ your API without altering the state within. Passing data by reference is often\
    \ used to keep memory overhead low, values passed by reference can be changed\
    \ anywhere outside your API and affect state within.\n\nIn JavaScript there is\
    \ no way to tell if arguments should be passed by reference or value. Primitives\
    \ (strings, numbers, booleans) are treated as `pass by value`, while objects (any\
    \ object, including Array, Date) are handled in a way that's comparable to `by\
    \ reference`. If this is the first you're hearing about this topic, let the following\
    \ example enlighten you:\n\n```javascript\n// by value\nfunction addOne(num) {\n\
    \  num = num + 1; // yes, num++ does the same\n  return num;\n}\n\nvar x = 0;\n\
    var y = addOne(x);\n// x === 0 <--\n// y === 1\n\n// by reference\nfunction addOne(obj)\
    \ {\n  obj.num = obj.num + 1;\n  return obj;\n}\n\nvar ox = {num : 0};\nvar oy\
    \ = addOne(ox);\n// ox.num === 1 <--\n// oy.num === 1\n```\n\nThe `by reference`\
    \ handling of objects can come back and bite you if you're not careful. Going\
    \ back to the `DateInterval` example, check out this bugger:\n\n```javascript\n\
    var startDate = new Date(2012, 0, 1);\nvar endDate = new Date(2012, 11, 31)\n\
    var interval = new DateInterval(startDate, endDate);\nendDate.setMonth(0); //\
    \ set to january\nvar days = interval.days(); // got 31 but expected 365 - ouch!\n\
    ```\n\nUnless the constructor of `DateInterval` `made a copy` (`clone` is the\
    \ technical term for a copy) of the values it received, any changes to the original\
    \ objects will reflect on the internals of `DateInterval`. This is `usually` not\
    \ what we want or expect.\n\nNote that the same is true for values returned from\
    \ your API. If you simply return an internal object, any changes made to it outside\
    \ of your API will be reflected on your internal data. This is most certainly\
    \ not what you want. [jQuery.extend()](http://api.jquery.com/jQuery.extend/)^([35](#chapter-8.xhtml_fn8_35))\n\
    \n### The Continuation Problem\n\nIn a fluent interface, we can't escape from\
    \ the chain. Depending on what methods do, it may help to prepend a trivial `is-empty`\
    \ detection:\n\n```javascript\njQuery.fn.somePlugin = function() {\n  if (!this.length)\
    \ {\n    // abort since we've got nothing\n    return this;\n  }\n\n  // do some\
    \ computational tasks\n  for (var i = 10000; i > 0; i--) {\n    // I'm wasting\
    \ your precious CPU!\n    // If you call me often enough, I'll turn\n    // your\
    \ laptop into a rock-melting engine\n  }\n\n  return this.each(function() {\n\
    \    // do the actual job\n  });\n};\n```\n\nIn non-fluent code, we could have\
    \ prevented functions from happening:\n\n```javascript\nvar $elem = jQuery('.wont-anything');\n\
    if ($elem.length) {\n  // jQuery accepts this\n  $somePlugin();\n}\n```\n\n###\
    \ Handling Errors\n\n![Fail Faster](images/fail-faster.jpg \"Fail Fast\")\n\n\
    I was lying when I said we couldn't escape from the chain—there is an `Exception`\
    \ to the rule (pardon the pun ☺).\n\nWe can always eject by throwing an `Error`.\
    \ Throwing an `Error` is considered a deliberate abortion of the current flow,\
    \ most likely because you came into a state you couldn't recover from. But beware—not\
    \ all Errors are helping the debugging developer:\n\n```javascript\n// jQuery\
    \ accepts this\n$(document.body).on('click', {});\n\n// on click the console screams\n\
    //   TypeError: ((p.event.special[l.origType] || {}).handle || l.handler).apply\
    \ is not a function \n//   in jQuery.min.js on Line 3\n```\n\nErrors like these\
    \ are a major pain to debug. Don't waste other people' time. Inform an API user\
    \ if he did something stupid:\n\n```javascript\nif (Object.prototype.toString.call(callback)\
    \ !== '[object Function]') {\n  throw new TypeError(\"callback is not a function!\"\
    );\n}\n```\n\nNote: `typeof callback === \"function\"` should not be used, as\
    \ older browsers may report objects to be a `function`, which they are not. In\
    \ Chrome (up to version 12) `RegExp` is such a case. For convenience, use [jQuery.isFunction()](http://api.jquery.com/jQuery.isfunction/)^([40](#chapter-8.xhtml_fn8_40))\
    \ or [_.isFunction()](http://underscorejs.org/#isFunction)^([41](#chapter-8.xhtml_fn8_41)).\n"
