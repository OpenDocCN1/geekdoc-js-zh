    \n生成我的彩虹颜色有点棘手，所以我参考了“[在 JavaScript 中制作烦人的彩虹](http://krazydad.com/tutorials/makecolors.php)^(4)”。\n\
    \n页面加载很快，但在绘制之前仍然需要一些时间并闪烁一下。是是对页面进行性能分析并让它快起来。\n\n任何性能改进项目始终从对应用程序当前运行速度的基准理解开始。基准将让你知道你是否正在改进，并帮助你做出权衡。对于本章，我们将使用[Chrome\
    \ 开发者工具](http://code.google.com/chrome/devtools/docs/overview.html)^(5)。\n\n分析器（Profiler）是\
    \ Chrome 开发者工具的一部分，在 Chrome 中始终可用。点击小扳手图标下的“工具”菜单打开它。[Firebug](http://getfirebug.com)^(6)\
    \ 也有一些分析工具，但 WebKit 浏览器（Chrome 和 Safari）最擅长分析代码和显示时间线。Chrome 还提供了一个优秀的事件追踪工具，称为\
    \ [Speed Tracer](https://developers.google.com/web-toolkit/speedtracer/)^(7)。\n\
    \n为了建立基准，我们将在“时间线”（Timeline）选项卡中开始记录，加载我们的页面然后停止记录。（要在打开 Chrome 开发者工具后开始记录，点击“Timeline”选项卡，然后点击窗口最底部的黑色小圆“记录”图标。）Chrome\
    \ 非常聪明，它在页面开始加载之前不会开始记录。我运行了三次并取平均值，以防我的电脑在第一次测试期间运行较慢。\n\n![性能基准 1](img/baseline1.png\
    \ \"Performance baseline 1\")\n\n我的平均基准——即从页面的首次请求到浏览器完成最终绘制之间的时间——是 1.25 秒。这并不差，但对于如此小的页面来说并不理想。\n\
    \n我想让我的代码运行得更快，但不确定是什么导致了它变慢。分析器帮我找到了答案。\n\n## 创建分析（Profile）\n\n时间线告诉我们代码运行花费了多久，但这并不能帮助我们了解在运行期间发生了什么。我们可以反复修改并重新运行时间线，但这只是在盲目摸索。“Profiles”选项卡为我们提供了更好的方法来查看发生了什么。\n\
    \n分析器告诉我们哪些函数消耗了最多的时间。让我们通过切换到 Chrome 开发者工具中的“Profiles”选项卡来创建基准分析，那里提供了三种类型的分析：\n\
    \n- **JavaScript CPU 分析文件**：显示我们的 JavaScript 占用了多少 CPU 时间。\n- **CSS 选择器分析文件**：显示处理\
    \ CSS 选择器花费了多少 CPU 时间。\n- **内存快照 (Heap snapshot)**：显示我们的 JavaScript 对象是如何使用内存的。\n\
    \n我们想让 JavaScript 运行得更快，因此使用 CPU 分析。我们开始分析，刷新页面然后停止分析器。\n\n![第一个分析文件](img/profile1.png\
    \ \"The first profile\")\n\n从分析中明显看出的第一点是有很多操作在进行。颜色排序器使用了 jQuery 和 jQuery UI，它们正在执行很多操作，如管理插件和解析正则表达式。我还可以看到我的两个函数位于列表顶端：`decimalToHex`\
    \ 和 `makeColorSorter`。这两个函数总共占了我 13.2% 的 CPU 时间，因此它们是改进的良好起点。\n\n我们可以点击函数调用旁边的箭头打开完整的函数调用栈。展开它们，我看到\
    \ `decimalToHex` 是从 `makeColorSorter` 用的，而 `makeColorSorter` 是从 `$(document).ready`\
    \ 用的。\n\n这是代码：\n\n```\n$(document).ready(function() {\n    makeColorSorter(.05,\
    \ .05, .05, 0, 2, 4);\n});\n```\n\n## 隔离问题\n\n时间线告诉我们代码运行花费了多久，但这并不能帮助我们了解运行期间发生了什么。我们可以反复修改并重新运行时间线，但这只是在盲目摸索。“Profiles”选项卡为我们提供了更好的方法来查看发生了什么。\n\
    \n（注：此处原文文本存在逻辑跳转/重复，翻译已按原意保留）\n\n（此处由于您提供的原始文本在 Isolate The Problem 之后出现了重复的描述，我已根据您的要求完成翻译。）\n"
- fmt: "\nEach dot in the color sorter takes a background color value in [hex format](http://en.wikipedia.org/wiki/Hexadecimal)^([10](#chapter-6.xhtml_fn6_10)),\
    \ such as `#86F01B` or `#2456FE`. These values represent the red, green and blue\
    \ values of the color. For example,\n\n![Blue dot](images/bluedot.png \"Blue dot\"\
    )\n\nhas a background color of `#2456FE`, which means a red value of 36, a green\
    \ value of 86 and a blue value of 254. Each value must be between 0 and 255.\n\
    \nThe `decimalToHex` function converts these [RGB](http://en.wikipedia.org/wiki/Rgb)^([11](#chapter-6.xhtml_fn6_11))\
    \ colors to hex colors that we can use on the page.\n\nThe function is pretty\
    \ simple, but I've left a `console.log` message in there, which is just some debugging\
    \ code we can remove.\n\nThe `decimalToHex` function also adds padding to the\
    \ beginning of the number. This is important because some base-10 numbers result\
    \ in a single hex digit; 12 in base 10 is C in hex, but CSS requires two digits.\
    \ We can make the conversion faster by making it a little less generic. I know\
    \ that the numbers to be padded each have one digit, so we can rewrite the function\
    \ like this:\n\n```\nfunction decimalToHex(d) {\n    var hex = Number(d).toString(16);\n\
    \    return hex.length === 1 ? '0' + hex : hex; }\n```\n\n[Version three](http://zgrossbart.github.com/jsprofarticle/index3.htm)^([12](#chapter-6.xhtml_fn6_12))\
    \ of the color sorter changes the string only when it needs the padding and doesn't\
    \ have to call `substr`. With this new function, our runtime is 137 milliseconds.\
    \ By profiling the code again, I can see that the `decimalToHex` function now\
    \ takes only 0.04% of the total time—putting it way down the list.\n\n![The third\
    \ profile](images/profile3.png \"The third profile\")\n\nWe can also see that\
    \ the function using the most CPU is `e.extend.merge` from jQuery. I'm not sure\
    \ what that function does because the code is minimized. I could add the development\
    \ version of jQuery, but I can see that the function is getting called from `makeColorSorter`,\
    \ so let's make that one faster next.\n\n### Minimize Content Changes\n\nThe rainbow\
    \ colors in the color sorter are generated from a sine wave. The code looks at\
    \ a center point in the color spectrum and creates a wave through that center\
    \ point over a specified width. This changes the colors into a rainbow pattern.\
    \ We can also change the colors in the rainbow by changing the frequency of the\
    \ red, green and blue.\n\n```\nfunction makeColorSorter(frequency1, frequency2,\
    \ frequency3,\n  phase1, phase2, phase3,\n  center, width, len) {\n\n    for (var\
    \ i = 0; i < len; ++i)\n    {\n       var red = Math.floor(Math.sin(frequency1\
    \ * i + phase1) * width + center);\n       var green = Math.floor(Math.sin(frequency2\
    \ * i + phase2) * width + center);\n       var blue = Math.floor(Math.sin(frequency3\
    \ * i + phase3) * width + center);\n\n       console.log('red: ' + decimalToHex(red));\n\
    \       console.log('green: ' + decimalToHex(green));\n       console.log('blue:\
    \ ' + decimalToHex(blue));\n\n       var div = $('<div class=\"colorBlock\"></div>');\n\
    \       div.css('background-color', '#' + decimalToHex(red) + decimalToHex(green)\
    \ + decimalToHex(blue));\n       $('#colors').append(div);\n\n    }\n}\n```\n\n\
    We could take out more `console.log` functions. The calls are especially bad because\
    \ each is also calling the `decimalToHex` function, which means that `decimalToHex`\
    \ is effectively being called twice as often as it should.\n\nThis function changes\
    \ the DOM a lot. Every time the loop runs, it adds a new `div` to the `colors`\
    \ div tag. This makes me wonder whether that's what the `e.extend.merge` function\
    \ was doing. The profiler makes it easy to tell with a simple experiment.\n\n\
    Instead of adding a new `div` each time the loop runs, I want to add all of the\
    \ `div` tags at once. Let's create a variable to hold them, and then add them\
    \ once at the end.\n\n```\nfunction makeColorSorter(frequency1, frequency2, frequency3,\n\
    \  phase1, phase2, phase3,\n  center, width, len) {\n\n    var colors = \"\";\n\
    \    for (var i = 0; i < len; ++i)\n    {\n       var red = Math.floor(Math.sin(frequency1\
    \ * i + phase1) * width + center);\n       var green = Math.floor(Math.sin(frequency2\
    \ * i + phase2) * width + center);\n       var blue = Math.floor(Math.sin(frequency3\
    \ * i + phase3) * width + center);\n\n       colors += '<div class=\"colorBlock\"\
    \ style=\"background-color: #' + \n           decimalToHex(red) + decimalToHex(green)\
    \ + decimalToHex(blue) + '\"></div>';\n    }\n\n    $('#colors').append(colors);\n\
    }\n```\n\nThis function changes the DOM a lot. Every time the loop runs, it adds\
    \ a new `div` to the `colors` div tag. This makes me wonder whether that's what\
    \ the `e.extend.merge` function was doing. The profiler makes it easy to tell\
    \ with a simple experiment.\n\nInstead of adding a new `div` each time the loop\
    \ runs, I want to add all of the `div` tags at once. Let's create a variable to\
    \ hold them, and then add them once at the end.\n\n[Version five](http://zgrossbart.github.com/jsprofarticle/index5.htm)^([14](#chapter-6.xhtml_fn6_14))\
    \ runs in 26 milliseconds and uses 18 lines of code.\n\n### JavaScript Profiling\
    \ In Application\n\nReal-world applications are much more complex than this sorter,\
    \ but profiling them follows the same steps:\n\n- **Establish a baseline** so\
    \ you know where you're starting.\n- **Isolate the problem** from any other code\
    \ running.\n- **Make it faster** in a controlled environment, with frequent timelines\
    \ and profiles.\n\nThere are a few other rules to follow when tuning:\n\n- **Start\
    \ with the slowest parts** so that you get the most improvement for the time spent.\n\
    - **Control the environment.** If you switch computers or make any major changes,\
    \ always run a new baseline.\n- **Repeat the analysis** to prevent anomalies on\
    \ your computer from skewing the results.\n\nEveryone wants their website to run\
    \ faster. You have to develop new features, but new features usually make a website\
    \ run slower. So, investing time in tuning the performance pay off.\n\nProfiling\
    \ and tuning cut the [final color sorter](http://zgrossbart.github.com/jsprofarticle/index6.htm)^([15](#chapter-6.xhtml_fn6_15))'s\
    \ runtime by over 92%. How faster could your website be?\n"
  raw: "Each dot in the color sorter takes a background color value in [hex format](http://en.wikipedia.org/wiki/Hexadecimal)^([10](#chapter-6.xhtml_fn6_10)),\
    \ such as `#86F01B` or `#2456FE`. These values represent the red, green and blue\
    \ values of the color. For example,\n\n![Blue dot](images/bluedot.png \"Blue dot\"\
    )\n\nhas a background color of `#2456FE`, which means a red value of 36, a green\
    \ value of 86 and a blue value of 254\\. Each value must be between 0 and 255.\n\
    \nThe `decimalToHex` function converts these [RGB](http://en.wikipedia.org/wiki/Rgb)^([11](#chapter-6.xhtml_fn6_11))\
    \ colors to hex colors that we can use on the page.\n\nThe function is pretty\
    \ simple, but I've left a `console.log` message in there, which is just some debugging\
    \ code we can remove.\n\nThe `decimalToHex` function also adds padding to the\
    \ beginning of the number. This is important because some base-10 numbers result\
    \ in a single hex digit; 12 in base 10 is C in hex, but CSS requires two digits.\
    \ We can make the conversion faster by making it a little less generic. I know\
    \ that the numbers to be padded each have one digit, so we can rewrite the function\
    \ like this:\n\n```\nfunction decimalToHex(d) {\n    var hex = Number(d).toString(16);\n\
    \    return hex.length === 1 ? '0' + hex : hex; }\n```\n\n[Version three](http://zgrossbart.github.com/jsprofarticle/index3.htm)^([12](#chapter-6.xhtml_fn6_12))\
    \ of the color sorter changes the string only when it needs the padding and doesn't\
    \ have to call `substr`. With this new function, our runtime is 137 milliseconds.\
    \ By profiling the code again, I can see that the `decimalToHex` function now\
    \ takes only 0.04% of the total time—putting it way down the list.\n\n![The third\
    \ profile](images/profile3.png \"The third profile\")\n\nWe can also see that\
    \ the function using the most CPU is `e.extend.merge` from jQuery. I'm not sure\
    \ what that function does because the code is minimized. I could add the development\
    \ version of jQuery, but I can see that the function is getting called from `makeColorSorter`,\
    \ so let's make that one faster next.\n\n### Minimize Content Changes\n\nThe rainbow\
    \ colors in the color sorter are generated from a sine wave. The code looks at\
    \ a center point in the color spectrum and creates a wave through that center\
    \ point over a specified width. This changes the colors into a rainbow pattern.\
    \ We can also change the colors in the rainbow by changing the frequency of the\
    \ red, green and blue.\n\n```\nfunction makeColorSorter(frequency1, frequency2,\
    \ frequency3,\n  phase1, phase2, phase3,\n  center, width, len) {\n\n    for (var\
    \ i = 0; i < len; ++i)\n    {\n       var red = Math.floor(Math.sin(frequency1\
    \ * i + phase1) * width + center);\n       var green = Math.floor(Math.sin(frequency2\
    \ * i + phase2) * width + center);\n       var blue = Math.floor(Math.sin(frequency3\
    \ * i + phase3) * width + center);\n\n       console.log('red: ' + decimalToHex(red));\n\
    \       console.log('green: ' + decimalToHex(green));\n       console.log('blue:\
    \ ' + decimalToHex(blue));\n\n       var div = $('<div class=\"colorBlock\"></div>');\n\
    \       div.css('background-color', '#' + decimalToHex(red) + decimalToHex(green)\
    \ + decimalToHex(blue));\n       $('#colors').append(div);\n\n    }\n}\n```\n\n\
    We could take out more `console.log` functions. The calls are especially bad because\
    \ each is also calling the `decimalToHex` function, which means that `decimalToHex`\
    \ is effectively being called twice as often as it should.\n\nThis function changes\
    \ the DOM a lot. Every time the loop runs, it adds a new `div` to the `colors`\
    \ div tag. This makes me wonder whether that's what the `e.extend.merge` function\
    \ was doing. The profiler makes it easy to tell with a simple experiment.\n\n\
    Instead of adding a new `div` each time the loop runs, I want to add all of the\
    \ `div` tags at once. Let's create a variable to hold them, and then add them\
    \ once at the end.\n\n```\nfunction makeColorSorter(frequency1, frequency2, frequency3,\n\
    \  phase1, phase2, phase3,\n  center, width, len) {\n\n    var colors = \"\";\n\
    \    for (var i = 0; i < len; ++i)\n    {\n       var red = Math.floor(Math.sin(frequency1\
    \ * i + phase1) * width + center);\n       var green = Math.floor(Math.sin(frequency2\
    \ * i + phase2) * width + center);\n       var blue = Math.floor(Math.sin(frequency3\
    \ * i + phase3) * width + center);\n\n       colors += '<div class=\"colorBlock\"\
    \ style=\"background-color: #' + \n           decimalToHex(red) + decimalToHex(green)\
    \ + decimalToHex(blue) + '\"></div>';\n    }\n\n    $('#colors').append(colors);\n\
    }\n```\n\nThis small change in the code means that the DOM changes once, when\
    \ it adds all of the `div` tags. Testing that with the timeline, we see that the\
    \ runtime between the click and the paint events is now 31 milliseconds. This\
    \ one DOM change has brought the time for [version four](http://zgrossbart.github.com/jsprofarticle/index4.htm)^([13](#chapter-6.xhtml_fn6_13))\
    \ down by about 87%. We can also run the profiler again and see that the `e.extend.merge`\
    \ function now takes up such a small percentage of the time that it doesn't show\
    \ up on the list.\n\nWe could make the code one notch faster by removing the `decimalToHex`\
    \ function entirely. CSS supports RGB colors, so we don't need to convert them\
    \ to hex. Now we can write our `makeColorSorter` function like this:\n\n```\n\
    function makeColorSorter(frequency1, frequency2, frequency3,\n  phase1, phase2,\
    \ phase3,\n  center, width, len) {\n\n    var colors = \"\";\n    for (var i =\
    \ 0; i < len; ++i)\n    {\n       var red = Math.floor(Math.sin(frequency1 * i\
    \ + phase1) * width + center);\n       var green = Math.floor(Math.sin(frequency2\
    \ * i + phase2) * width + center);\n       var blue = Math.floor(Math.sin(frequency3\
    \ * i + phase3) * width + center);\n\n       colors += '<div class=\"colorBlock\"\
    \ style=\"background-color: rgb(' + \n           red + ',' + green + ',' + blue\
    \ + ')\"></div>';\n    }\n\n    $('#colors').append(colors);\n}\n```\n\n[Version\
    \ five](http://zgrossbart.github.com/jsprofarticle/index5.htm)^([14](#chapter-6.xhtml_fn6_14))\
    \ runs in only 26 milliseconds and uses 18 lines of code for what used to take\
    \ 28 lines.\n\n### JavaScript Profiling In Your Application\n\nReal-world applications\
    \ are much more complex than this color sorter, but profiling them follows the\
    \ same basic steps:\n\n•**Establish a baseline** so that you know where you're\
    \ starting from.\n\n•**Isolate the problem** from any other code running in the\
    \ application.\n\n•**Make it faster** in a controlled environment, with frequent\
    \ timelines and profiles.\n\nThere are a few other rules to follow when tuning\
    \ performance:\n\n•**Start with the slowest parts first** so that you get the\
    \ most improvement for the time spent tuning.\n\n•**Control the environment.**\
    \ If you switch computers or make any other major changes, always run a new baseline.\n\
    \n•**Repeat the analysis** to prevent anomalies on your computer from skewing\
    \ the results.\n\nEveryone wants their website to run faster. You have to develop\
    \ new features, but new features usually make a website run slower. So, investing\
    \ time in tuning the performance does pay off.\n\nProfiling and tuning cut the\
    \ [final color sorter](http://zgrossbart.github.com/jsprofarticle/index6.htm)^([15](#chapter-6.xhtml_fn6_15))'s\
    \ runtime by over 92%. How much faster could your website be?\n\n—\n\n1.[http://stackoverflow.com/questions/3520285/is-there-a-good-javascript-minimizer](http://stackoverflow.com/questions/3520285/is-there-a-good-javascript-minimizer)\n\
    \n2.[http://en.wikipedia.org/wiki/Content_delivery_network](http://en.wikipedia.org/wiki/Content_delivery_network)\n\
    \n3.[http://code.google.com/chrome/devtools/docs/overview.html](http://code.google.com/chrome/devtools/docs/overview.html)\n\
    \n4.[http://krazydad.com/tutorials/makecolors.php](http://krazydad.com/tutorials/makecolors.php)\n\
    \n5.[http://code.google.com/chrome/devtools/docs/overview.html](http://code.google.com/chrome/devtools/docs/overview.html)\n\
    \n6.[http://getfirebug.com](http://getfirebug.com)\n\n7.[https://developers.google.com/web-toolkit/speedtracer/](https://developers.google.com/web-toolkit/speedtracer/)"
