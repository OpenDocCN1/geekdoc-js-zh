    When writing a Web application from scratch, it''s easy to feel like we can get
    by simply by relying on a [DOM](https://developer.mozilla.org/en/DOM/About_the_Document_Object_Model)^([1](#chapter-4.xhtml_fn4_1))
    manipulation library (like [jQuery](http://jquery.com)^([2](#chapter-4.xhtml_fn4_2)))
    and a handful of utility plugins. The problem with this is that it doesn''t take
    long to get lost in a nested pile of jQuery callbacks callbacks and DOM elements
    without any real structure in place for our applications.


    In short, we''re stuck with [spaghetti code](http://en.wikipedia.org/wiki/Spaghetti_code)^([3](#chapter-4.xhtml_fn4_3)).
    Fortunately there are modern JavaScript frameworks that can assist with bringing
    structure and organization to our projects, improving how easily maintainable
    they are in the long-run.


    ## What Is MVC, Or Rather MV*?


    These modern frameworks provide developers an easy path to organizing their code
    using variations of a pattern known as [MVC](http://addyosmani.com/resources/essentialjsdesignpatterns/book/#detailmvcmvp)^([4](#chapter-4.xhtml_fn4_4))
    (Model-View-Controller). MVC separates the concerns in an application down into
    three parts:


    - **Models** represent the domain-specific knowledge and data in an application.
    Think of this as being a ‘type'' of data you can model—like a User, Photo or Note.
    Models should notify anyone observing them about their current state (e.g Views).

    - **Views** are typically considered the User-interface in an application (e.g
    your markup and templates), but don''t have to be. They should know about the
    existence of Models in order to observe them, but don''t directly communicate
    with them.

    - **Controllers** handle the input (e.g clicks, user actions) in an application
    and Views can be considered as handling the output. When a `Controller` updates
    the state of a model (such as editing the caption on a Photo), it doesn''t directly
    tell the View. This is what the observing nature of the View and Model relationship
    is for.


    JavaScript ‘MVC'' frameworks that can help us structure our code don''t always
    strictly follow the above pattern. Some frameworks will include the responsibility
    of the Controller in the View (e.g [Backbone.js](http://backbonejs.org)^([5](#chapter-4.xhtml_fn4_5)))
    whilst others add their own opinionated components into the mix as they feel this
    is more effective.


    For this reason we refer to such frameworks as following the MV* pattern, that
    is, you''re likely to have a View and a Model, but more likely to have something
    else also included.


    **Note:** There also exist variations of MVC known as MVP (Model-View-Presenter)
    and MVVM (Model-View ViewModel). If you''re new to this and feel it''s a lot to
    take in, don''t worry. It can take a little while to get your head around patterns,
    but I''ve written more about the above patterns in my online book [Learning JavaScript
    Design Patterns](http://addyosmani.com/resources/essentialjsdesignpatterns/book/#detailmvcmvp)^([6](#chapter-4.xhtml_fn4_6))
    in case you need further help.


    ![](images/juggling-monkey.jpg "cover")


    ## When Do You Need A JavaScript MV* Framework?


    When building a single-page application using JavaScript, whether it involves
    a complex user interface or is simply trying to reduce the number of HTTP requests
    required for new Views, you will likely find yourself inventing many of the pieces
    that make up an MV* framework like Backbone or Ember.


    At the outset, it isn''t terribly difficult to write an application framework
    that offers *some* opinionated way to avoid spaghetti code, however to say that
    it is equally as trivial to write something of the standard of Backbone would
    be a grossly incorrect assumption.


    There''s a lot more that goes into structuring an application than tying together
    a DOM manipulation library, templating and routing. Mature MV* frameworks typically
    not only include many of the pieces you would find yourself writing, but also
    include solutions to problems you''ll find yourself running into later on down
    the road. This is a time-saver that you shouldn''t underestimate the value of.


    So, where will you likely need an MV* framework and where won''t you?


    If you''re writing an application that will likely only be communicating with
    an API or back-end data service, where much of the heavy lifting for viewing or
    manipulating that data will be occurring in the browser, you may find a JavaScript
    MV* framework useful.


    Good examples of applications that fall into this category are [GMail](http://gmail.com)^([7](#chapter-4.xhtml_fn4_7))
    and [Google Docs](http://docs.google.com)^([8](#chapter-4.xhtml_fn4_8)). These
    applications typically download a single payload containing all the scripts, stylesheets
    and markup users need for common tasks and then perform a lot of additional behavior
    in the background. It''s trivial to switch between reading an email or document
    to writing one and you don''t need to ask the application to render the whole
    page again at all.


    If, however, you''re building an application that still relies on the server for
    most of the heavy-lifting of Views/pages and you''re just using a little JavaScript
    or jQuery to make things a little more interactive, an MV framework may be overkill.
    There certainly are complex Web applications where the partial rendering of views
    can* be coupled with a single-page application effectively, but for everything
    else, you may find yourself better sticking to a simpler setup.


    ## The Challenge Of Choice: Too Many Options?


    The JavaScript community has been going through something of a renaissance over
    the last few years, with developers building even larger and more complex applications
    with it. The language still greatly differs from those more classic Software engineers
