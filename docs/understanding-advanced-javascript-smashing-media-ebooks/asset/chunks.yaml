- fmt: '

    ### Backbone


    **Cons:** I don''t like how `extend` method works—it copies content of parent
    objects into new one. Prototypal inheritance FTW. Sometime I miss real world scenarios
    in docs examples. Also there is a lot of research needed to figure out how to
    build a bigger app after reading the TODO tutorial.


    I''m missing official AMD support in projects from DocumentCloud (BB, _). [Note:
    this shouldn''t be an issue with the new `RequireJS shim()` method in `RequireJS
    2.0`].


    **Pros:** After the initial brain-warp of understanding how Backbone rolls, it
    is incredibly useful. Useful as in, well supported, lightweight, and constantly
    updated in a valid scope. Ties in with natural friends Underscore, `jQuery/Zepto`,
    tools that most of my studio''s projects would work with.


    **Cons:** The amount of tutorials on how to do things with Backbone is inconsistent
    and at different periods of Backbones lifespan. I''ve asked other devs to have
    a look at Backbone, and they would be writing code for `v0.3`. Un-aware. Whilst
    not a problem Backbone can fix itself, it is certainly a major dislike associated
    with the framework.


    I suppose in theory, you could apply this to anything else, but, Backbone is a
    recurrent one in my eyes. Hell, I''ve even seen month old articles using ancient
    Backbone methods and patterns.


    Whatever dislikes I would have on the framework strictly itself, has been rectified
    by the community through sensible hacks and approaches. For me, that is why Backbone
    is great, the community backing it up.


    **Pros:** Provides just enough abstraction without unreasonable opinions—enabling
    you to tailor it to the needs of the project.


    **Cons:** I would re-write (or possibly remove) `Backbone.sync`. It has baked
    in assumptions of typical client-initiated HTTP communications, and doesn''t adapt
    well to the push nature of `WebSockets`.


    **Pros:** It''s extremely easy to get into, offering a nice gateway to MV* based
    frameworks. It''s relatively customizable and there are also tons of other people
    using it, making finding help or support easy.


    **Cons:** The fact that there''s no view bindings by default (although you can
    fix this). Re-rendering the whole view when a single property changes is wasteful.


    The RESTful API has a lot of positives, but the lack of bulk-saving (admittedly
    a problem with REST itself, but still) and the difficulty in getting different
    URI schemes to work on different types of operations sucks.


    ### AngularJS


    **Pros:**


    a) 2-way data binding is incredibly powerful. You tend to think more about your
    model and the state that it is in instead of a series of events that need to happen.
    The model is the single source of truth.


    b) Performance. `AngularJS` is a small download. It''s templating uses DOM nodes
    instead of converting strings into DOM nodes and should perform better.


    c) If you are targeting modern browsers and/or are a little careful, you can drop
    `jQuery` from your dependencies too.


    **Cons:** I''d like to be able to specify transitions for UI state changes that
    propgate from a model change. Specifically for elements that use `ng-show` or
    `ng-hide` I''d like to use a fade or slide in in an easy declarative way.


    **Pros:** It''s very intuitive, has excellent documentation. I love their data
    binding approach, HTML based views, nested scopes. I switched from `Backbone/Thorax`
    to `Angular` and never looked back. A new Chrome extension `Batarang` integrates
    with Chrome Developer''s Tools and provides live access the `Angular` data structures.


    **Cons:** I''d like to have a built-in support to such functions as `drag''n''drop`,
    however this can be added using external components available on GitHub. I''d
    also like to see more 3rd party components available for reuse. I think it''s
    just a matter of time for the ecosystem around `AngularJS` to get more mature
    and then these will be available just like they are in communities like `jQuery`.


    **Pros:** It minimizes drastically the boilerplate code, allows for nice code
    reuse through components, extends the HTML syntax so that many complex features
    end up being as simple as applying a directive (attribute) in the HTML, and is
    super-easily testable thanks to a full commitment to dependency injection.


    You can write a non-trivial app without `jQuery` or without directly manipulating
    the `DOM`. That''s quite a feat.


    **Cons:** Its learning curve is somewhat steeper than `Backbone` (which is quite
    easy to master), but the gain is appreciative. Documentation could be better.


    ### KnockoutJS


    **Pros:** I don''t necessarily use it all the time, but `KnockoutJS` is just fantastic
    for single page applications. Extremely easy subscribing to live sorting; much
    better API for so called “collection views” in Backbone using observable arrays.
    And custom event on observables for effects, etc.


    **Cons:** Feel like the `API` is quite hard to scale, and would probably prefer
    to wrangle `Backbone` on the bigger applications. (But that''s also partially
    due to community support).


    **Pros:** I like the data binding mechanism and feel very comfortable using it.
    In particular I like how they have replaced templates with control flow binding.


    **Cons:** I don''t like that there is no guidance or best practice in terms of
    application structure. Aside from having a view model, the framework doesn''t
    help you in defining a well structured view model. It''s very easy to end up with
    a large unmaintainable function.


    ### Dojo


    **Pros:** Syntactically, `Dojo` is very simple. It allows for dynamic and robust
    builds, with the initial loader file being as low as 6k in some cases. It is AMD
    compatible, making it extremely portable, and comes out-of-the-box with a ton
    of features ranging from basic dom interactions to complex SVG, VML, and canvas
    functionality. The widget system, `Dijit`, is unmatched in it ease-of-use and
    ability to be extended. It''s a very well-rounded and complete toolkit.


    **Cons:** The `dojo/_base/declare` functionality is not 100% strict mode compliant
    and there is currently some overhead due to backwards compatibility, though this
    will mostly go away in the `Dojo 2.0` release.


    **Pros:** Good components : tabs, datrid, formManager– Renders the same cross
    browser. AMD compliant. Easy to test with mocks.Integrates well with other frameworks
    thks amd


    **Cons:** Default design for components out of fashion. Not fully html5\. So-so
    documentation Poor templating system (no auto binding).


    ### YUI


    **Pros:** `YUI3` is a modular and use-at-will type of component library which
    includes all the goodies of Backbone and more. It even (in my opinion) improves
    upon some of the concepts in Backbone by de-coupling some things (i.e. attribute
    is a separate module that can be mixed into any object – the event module can
    be mixed in similarly).


    **Cons:** I''d love to see `YUI3` support some of the auto-wiring (optional) of
    `Ember`. I think that is really the big win for `Ember`; otherwise, I see `YUI3`
    as a superior component library where I can cherry-pick what I need. I''d also
    like to see a more AMD-compatible module loader. The loader today works very well;
    however, it would be nicer if I could start a new projects based on AMD modules
    and pull in certain `YUI3` components and other things from other places that
    are also using AMD.


    ### JavascriptMVC


    **Pros:** Has all tools included, just need to run commands and start building.
    I have used for the last 6 months and it''s been really good.


    **Cons:** The only thing I would do is to speed up development of the next version.
    Developers are aware of problems and fixing issues its going going be another
    ¾ months before some issues I want fixed are addressed, but then I could probably
    patch and do a pull request.


    ### Maria


    **Pros:** Because `Maria` is a pure MVC framework that is focused on being just
    an MVC framework. No more and no less. Its clean and simple.

