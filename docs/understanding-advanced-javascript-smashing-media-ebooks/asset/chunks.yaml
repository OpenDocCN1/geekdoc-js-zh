    \ clearing, event listener counts and what's going on with garbage collection.\
    \ For those familiar with event-driven architectures, you might be interested\
    \ to know that one of the most common issues we used to have were `listen()`'s\
    \ without `unlisten()`'s (Closure) and missing `dispose()`'s for objects that\
    \ create event listeners.\n\nLuckily the DevTools can help locate some of these\
    \ issues, and Loreena Lee has a fantastic presentation available documenting the\
    \ [“3 snapshot” technique](https://docs.google.com/presentation/d/1wUVmf78gG-ra5aOxvTfYdiLkdGaR9OhXRnOlIcEmu2s/pub?start=false&loop=false&delayms=3000#slide=id.g1d65bdf6_0_0)^([35](#chapter-7.xhtml_fn7_35))\
    \ for finding leaks within the DevTools that I can't recommend reading through\
    \ enough.\n\nThe gist of the technique is that you record a number of actions\
    \ in your application, force a garbage collection, check if the number of DOM\
    \ nodes doesn't return to your expected baseline and then analyze three heap snapshots\
    \ to determine if you have a leak.\n\n#### Memory Management in Single-Page Applications\n\
    \nMemory management is quite important when writing modern single-page applications\
    \ (e.g. AngularJS, Backbone, Ember) as they almost never get refreshed. This means\
    \ that memory leaks can become apparent quite quickly. This is a huge trap on\
    \ mobile single-page applications, because of limited memory, and on long-running\
    \ applications like email clients or social networking applications. **With great\
    \ power comes great responsibility.**\n\nThere are various ways to prevent this.\
    \ In Backbone, ensure you always dispose old views and references using `dispose()`\
    \ (currently available in [Backbone (edge)](https://github.com/documentcloud/backbone/blob/master/backbone.js#L1234)^([36](#chapter-7.xhtml_fn7_36))).\
    \ This function was recently added, and removes any handlers added in the view's\
    \ ‘events' object, as well as any collection or model listeners where the view\
    \ is passed as the third argument (callback context). `dispose()` is also called\
    \ by the view's `remove()`, taking care of the majority of basic memory cleanup\
    \ needs when the element is [cleared from the screen](https://github.com/documentcloud/backbone/blob/master/backbone.js#L1235)^([37](#chapter-7.xhtml_fn7_37)).\
    \ Other libraries like Ember [clean up observers](https://github.com/emberjs/ember.js/blob/d8f76a7fdde741ae3d1e07b12df9cb6718170e48/packages/ember-handlebars/lib/helpers/binding.js#L296)^([38](#chapter-7.xhtml_fn7_38))\
    \ when they detect that elements have been removed from view to avoid memory leaks.\n\
    \nSome sage advice from Derick Bailey:\n\n> “Other than being aware of how events\
    \ work in terms of references, just follow the standard rules for manage memory\
    \ in JavaScript and you'll be fine. If you are loading data in to a Backbone collection\
    \ full of User objects you want that collection to be cleaned up so it's not using\
    \ anymore memory, you must remove all references to the collection and the individual\
    \ objects in it. Once you remove all references, things will be cleaned up. This\
    \ is just the standard JavaScript garbage collection rule.”\n\nIn his article,\
    \ Derick covers many of the common [memory pitfalls](http://lostechies.com/derickbailey/2012/03/19/backbone-js-and-javascript-garbage-collection/)^([39](#chapter-7.xhtml_fn7_39))\
    \ when working with Backbone.js and how to fix them.\n\nThere is also a helpful\
    \ tutorial available for [debugging memory leaks in Node](https://github.com/felixge/node-memory-leak-tutorial)^([40](#chapter-7.xhtml_fn7_40))\
    \ by Felix Geisendörfer worth reading, especially if it forms a part of your broader\
    \ SPA stack.\n\n#### Minimizing Reflows\n\nWhen a browser has to recalculate the\
    \ positions and geometrics of elements in a document for the purpose of re-rendering\
    \ it, we call this [reflow](https://www.youtube.com/watch?feature=player_embedded&v=ZHxbs5WEQzE)^([41](#chapter-7.xhtml_fn7_41)).\
    \ Reflow is a user-blocking operation in the browser, so it's helpful to understand\
    \ how to improve reflow time.\n\n![Chart of reflow time.](images/reflow.jpg \"\
    Chart Of Reflow Time\")\n\n*Chart of reflow time.*\n\nYou should batch methods\
    \ that [trigger reflow](http://stackoverflow.com/questions/510213/when-does-reflow-happen-in-a-dom-environment)^([42](#chapter-7.xhtml_fn7_42))\
    \ or that repaint, and use them sparingly. It's important to process off DOM where\
    \ possible. This is possible using [DocumentFragment](http://www.w3.org/TR/DOM-Level-2-Core/core.html#ID-B63ED1A3)^([43](#chapter-7.xhtml_fn7_43)),\
    \ a lightweight document object. Think of it as a way to extract a portion of\
    \ a document's tree, or create a new “fragment” of a document. Rather than constantly\
    \ adding to the DOM using nodes, we can use document fragments to build up all\
    \ we need and only perform a single insert into the DOM to avoid excessive reflow.\n\
    \nFor example, let's write a function that adds 20 `div`s to an element. Simply\
    \ appending each new `div` directly to the element could trigger 20 reflows.\n\
    \n```\nfunction addDivs(element) {\n  var div;\n  for (var i = 0; i < 20; i ++)\
    \ {\n    div = document.createElement('div');\n    div.innerHTML = 'Heya!';\n\
    \    element.appendChild(div);\n  }\n}\n```\n\nTo work around this issue, we can\
    \ use `DocumentFragment`, and instead, append each of our new `div`s to this.\
    \ When appending to the `DocumentFragment` with a method like `appendChild`, all\
    \ of the fragment's children are appended to the element triggering only one reflow.\n\
    \n```\nfunction addDivs(element) {\n  var div; \n  // Creates a new empty DocumentFragment.\n\
    \  var fragment = document.createDocumentFragment();\n  for (var i = 0; i < 20;\
    \ i ++) {\n    div = document.createElement('a');\n    div.innerHTML = 'Heya!';\n\
    \    fragment.appendChild(div);\n  }\n  element.appendChild(fragment);\n}\n```\n\
    \nYou can read more about this topic at [Make the Web Faster](https://developers.google.com/speed/articles/javascript-dom)^([44](#chapter-7.xhtml_fn7_44)),"
