    ![about:tracing offers an intimate view of the browser''s performance.](images/tracing.jpg
    "About:Tracing Offers An Intimate View Of The Browser''s Performance")


    *`About:Tracing` offers an intimate view of the browser''s performance.*


    What''s really useful about this tool is that it allows you to capture profiling
    data about what Chrome is doing under the hood, so you can properly adjust your
    JavaScript execution, or optimize your asset loading.


    Lilli Thompson has an excellent [write-up for games developers](http://www.html5rocks.com/en/tutorials/games/abouttracing/)^([54](#chapter-7.xhtml_fn7_54))
