- fmt: '

    I want something flexible which offers a minimalist solution to separating concerns
    in my application. It should support a persistence layer and RESTful sync, models,
    views (with controllers), event-driven communication, templating and routing.
    It should be imperative, allowing one to update the View when a model changes.
    I''d like some decisions about the architecture left up to me. Ideally even many
    large companies have used the solution to build non-trivial applications. As I
    may be building something complex, I''d like there to be an active extension community
    around the framework that have already tried addressing larger problems ([Marionette](https://github.com/derickbailey/backbone.marionette)^([62](#chapter-4.xhtml_fn4_62)),
    [Chaplin](https://github.com/chaplinjs/chaplin)^([63](#chapter-4.xhtml_fn4_63)),
    [Aura](https://github.com/addyosmani/backbone-aura/)^([64](#chapter-4.xhtml_fn4_64)),
    [Thorax](https://github.com/walmartlabs/thorax)^([65](#chapter-4.xhtml_fn4_65))).
    Ideally, there are also scaffolding tools ([grunt-bbb](https://github.com/backbone-boilerplate/grunt-bbb)^([66](#chapter-4.xhtml_fn4_66)),
    [brunch](http://brunch.io/)^([67](#chapter-4.xhtml_fn4_67))) available for the
    solution. Use `Backbone.js.`.


    I want something that tries to tackle desktop-level application development for
    the Web. It should be opinionated, modular, support a variation of MVC, avoid
    the need to wire everything in my application together manually, support persistence,
    computed properties and have auto-updating (live) templates. It should support
    proper state management rather than the manual routing solution many other frameworks
    advocate being used. It should also come with extensive docs and of course, templating.
    It should also have scaffolding tools available (ember.gem, ember for brunch).
    Use `Ember.js.`.


    I want something more lightweight which supports live-binding templates, routing,
    integration with major libraries (like `jQuery` and `Dojo`) and is optimized for
    performance. It should also support a way to implement models, views and controllers.
    It may not be used on as many large public applications just yet, but has potential.
    Ideally, the solution should be built by people who have previous experience creating
    many complex applications. Use `CanJS.`.


    I want something declarative that uses the View to derive behavior. It focuses
    on achieving this through custom HTML tags and components that specify your application
    intentions. It should support being easily testable, URL management (routing)
    and a separation of concerns through a variation of MVC. It takes a different
    approach to most frameworks, providing a HTML compiler for creating your own DSL
    in HTML. It may be inspired by upcoming Web platform features such as Web Components
    and also has its own scaffolding tools available (angular-seed). Use `AngularJS.`.


    I want something that offers me an excellent base for building large scale applications.
    It should support a mature widget infrastructure, modules which support lazy-loading
    and can be asynchronous, simple integration with CDNs, a wide array of widget
    modules (graphics, charting, grids, etc) and strong support for internationalization
    (i18n, l10n). It should have support for OOP, MVC and the building blocks to create
    more complex architectures. Use `Dojo.`.


    I want something which benefits from the YUI extension infrastructure. It should
    support models, views and routers and make it simple to write multi-view applications
    supporting routing, View transitions and more. Whilst larger, it is a complete
    solution that includes widgets/components as well as the tools needed to create
    an organized application architecture. It may have scaffolding tools (yuiproject),
    but these need to be updated. Use `YUI.`.


    I want something simple that values asynchronous interfaces and lack any dependencies.
    It should be opinionated but flexible on how to build applications. The framework
    should provide bare-bones essentials like model, view, controller, events, and
    routing, while still being tiny. It should be optimized for use with CoffeeScript
    and come with comprehensive documentation. Use `Spine.`.


    I want something that will make it easy to build complex dynamic UIs with a clean
    underlying data model and declarative bindings. It should automatically update
    my UI on model changes using two-way bindings and support dependency tracking
    of model data. I should be able to use it with whatever framework I prefer, or
    even an existing app. It should also come with templating built-in and be easily
    extensible. Use `KnockoutJS.`.


    I want something that will help me build simple Web applications and websites.
    I don''t expect there to be a great deal of code involved and so code organisation
    won''t be much of a concern. The solution should abstract away browser differences
    so I can focus on the fun stuff. It should let me easily bind events, interact
    with remote services, be extensible and have a huge plugin community. Use `jQuery.`.


    ### What Do Developers Think About The Most Popular Frameworks?


    As part of our research into MV* frameworks for TodoMVC and this article, we decided
    to conduct a survey to bring together the experiences of those using these solutions.
    We asked developers what framework they find themselves using the most often and
    more importantly, why they would recommend them to others. We also asked what
    they felt was still missing in their project of choice.


    We''ve grouped some of the most interesting responses below, by framework.


    #### Ember.js


    **Pros:** The combination of live templates and observable objects has changed
    the way I write JavaScript. It can be a bit much to wrap your head around at first,
    but you end up with a nice separation of responsibility. I found that once I have
    everything set up, adding fairly complex features only takes a couple lines of
    code. Without `Ember`, these same features would''ve been hellish to implement.


    **Cons:** Ember has yet to reach 1.0. Many things are still in flux, such as the
    `router` and `ember-data`. The new website is very helpful, but there''s still
    not as much documentation for `Ember` as there is for other frameworks, specifically
    `Backbone`. Also, with so much magic in the framework, it can be little scary.
    There''s the fear that if something breaks you won''t be able to figure out why.
    Oh, and the error messages that `ember` gives you often suck.


    **Pros:**


    The key factors:


    a) Features that let me avoid a lot of boilerplate (bindings, computer properties,
    view layer with the cool handlebars).


    b) the core team: I''m a Rails developer and know the work of Yehuda Katz. I trust
    the guy =)


    **Cons:** Documentation. It''s really sad that `Ember` doesn''t have good documentation,
    tutorials, screencast like `Backbone`, `Angular` or other frameworks. Right now,
    we browse the code looking for docs which isn''t ideal.


    **Pros:** Convention over configuration. `Ember` makes so many small decisions
    for you it''s by far the easiest way to build a client-side application these
    days.


    **Cons:** The learning curve. It is missing the mass of getting started guides
    that exist for other frameworks like `Backbone`, this is partly because of the
    small community, but I think more because of the state of flux the codebase is
    in pre-1.0.


    **Pros:** Simplicity, bindings, tight integration with `Handlebars`, ease of enabling
    modularity in my own code.


    **Cons:** I''d like to have a stable integration with `ember-data`, and integrated
    `localStorage` support synced with a REST API, but hey that''s fantasy that one
    day will surely come true;-


    #### Backbone.js


    **Pros:** Simplicity—only 4 core components (`Collection`, `Model`, `View`, `Router`).
    Huge community (ecosystem) and lots of solutions on StackOverflow. Higher order
    frameworks like `Marionette` or `Vertebrae` with lots of clever code inside. Somebody
    might like "low-levelness"—need to write lots of boilerplate code, but get customized
    application architecture.

