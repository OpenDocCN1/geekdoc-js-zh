    [JavaScript Memory Optimization](http://blog.tojicode.com/2012/03/javascript-memory-optimization-and.html)^([45](#chapter-7.xhtml_fn7_45))
    and [Finding Memory Leaks](http://gent.ilcore.com/2011/08/finding-memory-leaks.html)^([46](#chapter-7.xhtml_fn7_46)).


    ## JavaScript Memory Leak Detector


    To help discover JavaScript memory leaks, two of my fellow Googlers (Marja Hölttä
    and Jochen Eisinger) developed a tool that works with the Chrome Developer Tools
    (specifically, the remote inspection protocol), and retrieves heap snapshots and
    detects what objects are causing leaks.


    ![A tool for detecting JavaScript memory leaks.](images/leak.jpg "A Tool For Detecting
    JavaScript Memory Leaks")


    *A tool for detecting JavaScript memory leaks.*


    There''s a whole post on [how to use the tool](http://google-opensource.blogspot.de/2012/08/leak-finder-new-tool-for-javascript.html)^([47](#chapter-7.xhtml_fn7_47)),
    and I encourage you to check it out or view the [Leak Finder project page](http://code.google.com/p/leak-finder-for-javascript/)^([48](#chapter-7.xhtml_fn7_48)).


    Some more information: In case you''re wondering why a tool like this isn''t already
    integrated with our Developer Tools, the reason is twofold. It was originally
    developed to help us catch some specific memory scenarios in the Closure Library,
    and it makes more sense as an external tool (or maybe even an extension if we
    get a heap profiling extension API in place).


    ## V8 Flags for Debugging Optimizations & Garbage Collection


    Chrome supports passing a number of flags directly to V8 via the `js-flags` flag
    to get more detailed output about what the engine is optimizing. For example,
    this traces V8 optimizations:


    ```

    "/Applications/Google Chrome/Google Chrome" --js-flags="--trace-opt --trace-deopt"

    ```


    Windows users will want to run `chrome.exe --js-flags="--trace-opt --trace-deopt"`


    When developing your application, the following V8 flags can be used.


    • `trace-opt` – log names of optimized functions and show where the optimizer
    is skipping code because it can''t figure something out.


    • `trace-deopt` – log a list of code it had to deoptimize while running.


    • `trace-gc` – logs a tracing line on each garbage collection.


    V8''s tick-processing scripts mark optimized functions with an `*` (asterisk)
    and non-optimized functions with `~` (tilde).


    If you''re interested in learning more about V8′s flags and how V8′s internals
    work in general, I strongly recommend looking through Vyacheslav Egorov''s [excellent
    post on V8 internals](http://mrale.ph/blog/2011/12/18/v8-optimization-checklist.html)^([49](#chapter-7.xhtml_fn7_49)),
    which summarizes the best resources available on this at the moment.


    ## High-Resolution Time and Navigation Timing API


    [High Resolution Time](http://www.w3.org/TR/hr-time/)^([50](#chapter-7.xhtml_fn7_50))
    (HRT) is a JavaScript interface providing the current time in sub-millisecond
    resolution that isn''t subject to system clock skews or user adjustments. Think
    of it as a way to measure more precisely than we''ve previously had with `new
    Date` and `Date.now()`. This is helpful when we''re writing performance benchmarks.


    ![High Resolution Time (HRT) provides the current time in sub-millisecond resolution.](images/perfnow.jpg
    "High Resolution Time (HRT) Provides The Current Time In Sub-Millisecond Resolution")


    *High Resolution Time (HRT) provides the current time in sub-millisecond resolution.*


    HRT is currently available in Chrome (stable) as `window.performance.webkitNow()`,
    but the prefix is dropped in Chrome Canary, making it available via `window.performance.now()`.
    Paul Irish has written [more about HRT](http://updates.html5rocks.com/2012/08/When-milliseconds-are-not-enough-performance-now)^([51](#chapter-7.xhtml_fn7_51))
    in a post on HTML5Rocks.


    So, we now know the current time, but what if we wanted an API for accurately
    measuring performance on the web?


    Well, one is now also available in the [Navigation Timing API](http://dvcs.w3.org/hg/webperf/raw-file/tip/specs/NavigationTiming/Overview.html)^([52](#chapter-7.xhtml_fn7_52)).
    This API provides a simple way to get accurate and detailed time measurements
    that are recorded while a webpage is loaded and presented to the user. Timing
    information is exposed via `window.performance.timing`, which you can simply use
    in the console:


    ![Timing information is shown in the console.](images/performance.jpg "Timing
    Information Is Shown In The Console")


    *Timing information is shown in the console.*


    Looking at the data above, we can extract some very useful information. For example,
    network latency is `responseEnd-fetchStart`, the time taken for a page load once
    it''s been received from the server is `loadEventEnd-responseEnd` and the time
    taken to process between navigation and page load is `loadEventEnd-navigationStart`.


    ## about:memory and about:tracing


    `tracing` in Chrome offers an intimate view of the browser''s performance.


    ![tracing offers an intimate view of the browser''s performance.](images/tracing.jpg
    "Tracing Offers An Intimate View Of The Browser''s Performance")


    *`tracing` offers an intimate view of the browser''s performance.*


    What''s really useful about this tool is that it allows to capture profiling data
    about what Chrome is doing. Lilli Thompson has an excellent [write-up for games](http://www.html5rocks.com/en/games/abouttracing/)^([54](#chapter-7.xhtml_fn7_54))
    on using `tracing` to profile WebGL. Navigating to `memory` in Chrome is also
    useful as it shows the amount of memory used by each tab, which is helpful for
    tracking potential leaks. For more details on Navigation Timing, read Sam Dutton''s
    great [Measuring Page Speed](http://www.html5rocks.com/en/webperformance/basics/)^([53](#chapter-7.xhtml_fn7_53)).


    ## Conclusion


    As we''ve seen, there are many hidden performance gotchas in the world of JavaScript
    engines, and no silver bullet available to improve performance. It''s only when
    you combine a number of optimizations in a (real-world) testing environment that
    you can realize the largest gains. But even then, understanding how engines interpret
    and optimize your code can give you insights to tweak your applications.


    **Measure It. Understand it. Fix it.** Rinse and repeat.


    [![Measuring.](images/barometer.jpg "Measuring")](http://www.flickr.com/photos/38891164@N02/426660987/)


    *Image source: [Sally Hunter](http://www.flickr.com/photos/38891164@N02/426660987/)^([55](#chapter-7.xhtml_fn7_55)).*

    '
