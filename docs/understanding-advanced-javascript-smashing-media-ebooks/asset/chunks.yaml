    \ {\n  console.log(\"async()\");\n  // do something asynchronous\n  window.setTimeout(callback,\
    \ 500);\n  return this;\n};\nApi.protoype.method = function() {\n  console.log(\"\
    method()\");\n  return this;\n};\n```\n\n```\n// running things\napi.async(function()\
    \ {\n  console.log('callback()');\n}).method();\n\n// prints: async(), method(),\
    \ callback()\n```\n\nThis example illustrates how the asynchronous method `async()`\
    \ begins its work but immediately returns, leading to `method()` being invoked\
    \ before the actual task of `async()` completed. There are times when we want\
    \ this to happen, but generally we expect `method()` to execute *after* `async()`\
    \ has completed its job.\n\n#### Deferreds (Promises)\n\nTo some extent we can\
    \ counter the mess that is a mix of asynchronous and synchronous API calls with\
    \ [Promises](http://wiki.commonjs.org/wiki/Promises/A)^([42](#chapter-8.xhtml_fn8_42)).\
    \ jQuery knows them as [Deferreds](http://api.jquery.com/category/deferred-object/)^([43](#chapter-8.xhtml_fn8_43)).\
    \ A Deferred is returned in place of your regular `this`, which forces you to\
    \ eject from method chaining. This may seem odd at first, but it effectively prevents\
    \ you from continuing synchronously after invoking an asynchronous method:\n\n\
    ```\nApi.protoype.async = function() {\n  var deferred = $.Deferred();\n  console.log(\"\
    async()\");\n\n  window.setTimeout(function() {\n    // do something asynchronous\n\
    \    deferred.resolve(\"some-data\");\n  }, 500);\n\n  return deferred.promise();\n\
    };\n```\n\n```\napi.async().done(function(data) {\n  console.log(\"callback()\"\
    );\n  api.method();\n});\n\n// prints: async(), callback(), method()\n```\n\n\
    The Deferred object let's you register handlers using `.done()`, `.fail()`, `.always()`\
    \ to be called when the asynchronous task has completed, failed, or regardless\
    \ of its state. See [Promise Pipelines In JavaScript](http://sitr.us/2012/07/31/promise-pipelines-in-javascript.html)^([44](#chapter-8.xhtml_fn8_44))\
    \ for a more detailed introduction to Deferreds.\n\n### Debugging Fluent Interfaces\n\
    \nWhile *Fluent Interfaces* are much nicer to develop with, they do come with\
    \ certain limitations regarding de-buggability.\n\nAs with any code, *Test Driven\
    \ Development* (TDD) is an easy way to reduce debugging needs. Having written\
    \ URI.js in TDD, I have not come across major pains regarding debugging my code.\
    \ However, TDD only *reduces* the need for debugging—it doesn't replace it entirely.\n\
    \nSome voices on the internet suggest writing out each component of a chain in\
    \ their separate lines to get proper line-numbers for errors in a stack trace:\n\
    \n```\nfoobar.bar()\n  .baz()\n  .bam()\n  .someError();\n```\n\nThis technique\
    \ does have its benefits (though better debugging is not a solid part of it).\
    \ Code that is written like the above example is even simpler to read. Line-based\
    \ differentials (used in version control systems like SVN, GIT) might see a slight\
    \ win as well. Debugging-wise, it is only Chrome (at the moment), that will show\
    \ `someError()` to be on line four, while other browsers treat it as line one.\n\
    \nAdding a simple method to logging your objects can already help a lot—although\
    \ that is considered “manual debugging” and may be frowned upon by people used\
    \ to “real” debuggers:\n\n```\nDateInterval.prototype.explain = function() {\n\
    \  // log the current state to the console\n  console.dir(this);\n};\n\nvar days\
    \ = (new Date(2012, 0, 1))\n  .until(2012, 11, 31) // returns DateInterval instance\n\
    \  .explain() // write some infos to the console\n  .days(); // 365\n```\n\n####\
    \ Function names\n\nThroughout this chapter you've seen a lot of demo code in\
    \ the style of `Foo.prototype.something = function(){}`. This style was chosen\
    \ to keep examples brief. When writing APIs you might want to consider either\
    \ of the following approaches, to have your console properly identify function\
    \ names:\n\n```\nFoo.prototype.something = function something() {\n  // yadda\
    \ yadda\n};\n```\n\n```\nFoo.prototype.something = function() {\n  // yadda yadda\n\
    };\nFoo.prototype.something.displayName = \"Foo.something\";\n```\n\nThe second\
    \ option `displayName` was introduced by WebKit and later adopted by Firebug /\
    \ Firefox. `displayName` is a bit more code to write out, but allows arbitrary\
    \ names, including a namespace or associated object. Either of these approaches\
    \ can help with anonymous functions quite a bit.\n\nRead more on this topic in\
    \ [Named function expressions demystified](http://kangax.github.com/nfe/)^([45](#chapter-8.xhtml_fn8_45))\
    \ by [kangax](https://twitter.com/kangax)^([46](#chapter-8.xhtml_fn8_46)).\n\n\
    ### Documenting APIs\n\nOne of the hardest tasks of software development is documenting\
    \ things. Practically everyone hates doing it, yet everybody laments about bad\
    \ or missing documentation of the tools they need to use. There is a wide range\
    \ of tools that supposedly help and automate documenting your code:\n\n•[YUIDoc](http://yui.github.com/yuidoc/)^([47](#chapter-8.xhtml_fn8_47))\
    \ (requires Node.js, npm)\n\n•[JsDoc Toolkit](https://github.com/p120ph37/node-jsdoc-toolkit)^([48](#chapter-8.xhtml_fn8_48))\
    \ (requires Node.js, npm)\n\n•[Markdox](https://github.com/cbou/markdox)^([49](#chapter-8.xhtml_fn8_49))\
    \ (requires Node.js, npm)\n\n•[Dox](https://github.com/visionmedia/dox)^([50](#chapter-8.xhtml_fn8_50))\
    \ (requires Node.js, npm)\n\n•[Docco](http://jashkenas.github.com/docco/)^([51](#chapter-8.xhtml_fn8_51))\
    \ (requires Node.js, Python, CoffeeScript)\n\n•[JSDuck](https://github.com/senchalabs/jsduck)^([52](#chapter-8.xhtml_fn8_52))\
    \ (reqires Ruby, gem)\n\n•[JSDoc 3](https://github.com/jsdoc3/jsdoc)^([53](#chapter-8.xhtml_fn8_53))\
    \ (requires Java)"
