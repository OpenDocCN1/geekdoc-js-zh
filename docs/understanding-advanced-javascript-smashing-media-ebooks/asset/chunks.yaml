    # Analyzing Network Characteristics Using JavaScript And The DOM


    By Philip Tellis


    As Web developers, we have an affinity for developing with JavaScript. Whatever
    the language used in the back end, JavaScript and the browser are the primary
    language-platform combination available at the user''s end. It has many uses,
    ranging from silly to experience-enhancing.


    [![](images/Network.jpg)](http://www.flickr.com/photos/hertzen/4878410201/in/photostream)


    *(Image: [Viktor Hertz](http://www.flickr.com/photos/hertzen/4878410201/in/photostream)^([1](#chapter-2.xhtml_fn2_1)))*


    In this chapter, we''ll look at some methods of manipulating JavaScript to determine
    various network characteristics from within the browser—characteristics that were
    previously available only to applications that directly interface with the operating
    system. Much of this was discovered while building the [Boomerang](http://github.com/bluesmoon/boomerang)^([2](#chapter-2.xhtml_fn2_2))
    project to measure real user performance.


    ## What''s In A Network Anyway?


    The network has many layers, but the Web developers among us care most about HTTP,
    which runs over [TCP](http://en.wikipedia.org/wiki/Transmission_Control_Protocol)^([3](#chapter-2.xhtml_fn2_3))
    and [IP](http://en.wikipedia.org/wiki/Internet_Protocol)^([4](#chapter-2.xhtml_fn2_4))
    (otherwise known jointly as the [Internet protocol suite](http://en.wikipedia.org/wiki/Internet_protocol_suite)^([5](#chapter-2.xhtml_fn2_5))).
    Several layers are below that, but for the most part, whether it runs on copper,
    fiber or [homing](http://www.faqs.org/rfcs/rfc2549.html)^([6](#chapter-2.xhtml_fn2_6))
    [pigeons](http://en.wikipedia.org/IP_over_Avian_Carriers)^([7](#chapter-2.xhtml_fn2_7))
    does not affect the layers or the characteristics that we care about.


    ### Network Latency


    Network latency is typically the time it takes to send a signal across the network
    and get a response. It''s also often called roundtrip time or ping time because
    it''s the time reported by the `ping` command. While this is interesting to network
    engineers who are diagnosing network problems, Web developers care more about
    the time it takes to make an HTTP request and get a response. Therefore, we''ll
    define HTTP latency as the time it takes to make the smallest HTTP request possible,
    and to get a response with insignificant server-processing time (i.e. the only
    thing the server does is send a response).


    **Cool tip:** Light and electricity [travel through fiber](http://en.wikipedia.org/wiki/Optical_fiber
    "Wikipedia Article about Optical Fiber")^([8](#chapter-2.xhtml_fn2_8)) and copper
    at 66% the speed of light in a vacuum, or 20 × 10⁸ kilometres per second. A good
    approximation of network latency between points A and B is [four times](http://rescomp.stanford.edu/~cheshire/rants/Latency.html)^([9](#chapter-2.xhtml_fn2_9))
    the time it takes light or electricity to travel the distance. [Greg''s Map](http://rescomp.stanford.edu/~cheshire/rants/Latency.html)^([10](#chapter-2.xhtml_fn2_10))
    is a good way to visualize.


    ### Network Throughput


    Network throughput tells us how well a network is utilized.


    ### DNS


    DNS is a little different from everything else. We''ll see how.


    ## Measuring Latency With JavaScript


    ![HTTP Get Request](images/http-get.png)


    My first instinct was that measuring latency simply entailed sending one packet
    each way and timing it. It''s fairly easy to do this in JavaScript:


    ```javascript

    var ts, rtt, img = new Image;

    img.onload=function() { rtt=(+new Date - ts) };

    ts = +new Date;

    img.src="/1x1.gif";

    ```


    We start a timer, then load a 1 pixel GIF and measure when its `onload` event
    fires. The GIF itself is 35 bytes in size and so fits in a single packet even
    with HTTP headers added.


    ### TCP Handshake and HTTP Keep-Alive


    ![TCP handshake: SYN-ACK/SYN-ACK](images/tcp-handshake.png)


    When loading a Web page or image or any other Web resource, a browser opens a
    TCP connection to the specified Web server, and then makes an HTTP `GET` request
    over this connection. The details of the TCP connection and HTTP request are hidden
    from users and from Web developers as well. They are important, though, if we
    need to analyze the network''s characteristics.


    The first time a TCP connection is opened between two hosts (the browser and the
    server, in our case), they need to “handshake.” This takes place by sending three
    packets between the two hosts. The host that initiates the connection (the browser
    in our case) first sends a SYN packet, which kinda means, “Let''s SYNc up. I''d
    like to talk to you. Are you ready to talk to me?” If the other host (the server
    in our case) is ready, it responds with an ACK, which means, “I ACKnowledge your
    SYN.” And it also sends a SYN of its own, which means, “I''d like to SYNc up,
    too. Are you ready?” The Web browser then completes the handshake with its own
    ACK, and the connection is established. The connection could fail, but the process
    behind a connection failure is beyond the scope of this chapter.


    Once the connection is established, it remains open until both ends decide to
    close it, by going through a similar handshake.

