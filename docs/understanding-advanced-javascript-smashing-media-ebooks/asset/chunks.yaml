  trans: "\n\n这种方法允许你生成多个类似的访问器方法，而不是单独定义每一个方法。如果你的访问器方法需要比简单的字符串更多的数据来完成设置，可以考虑如下代码：\n\
    \n```\nvar accessors = {\"start\" : {color: \"green\"}, \"end\" : {color: \"red\"\
    }};\nfor (var key in accessors) {\n  DateInterval.prototype[key] = generateAccessor(key,\
    \ accessors[key]);\n}\n\nfunction generateAccessor(key, accessor) {\n  var value\
    \ = key + \"Date\";\n  return function(date) {\n    // 设置一些内容 \n    // 使用 `key`\
    \ 和 `accessor.color`\n  };\n}\n```\n\n在`处理参数`（Handling Arguments）章节中，我们讨论了一种方法模式，允许你的\
    \ getter 和 setter 接受各种有用类型，如 map 和数组。方法模式本身是非常通用的，可以很容易转换为生成器：\n\n```\nfunction\
    \ wrapFlexibleAccessor(get, set) {\n  return function(name, value) {\n    var\
    \ map;\n\n    if (jQuery.isPlainObject(name)) {\n      // 设置一个 map\n      map\
    \ = name;\n    } else if (value !== undefined) {\n      // 设置一个值（可能针对多个名称），转换成\
    \ map\n      keys = name.split(\" \");\n      map = {};\n      for (var i = 0,\
    \ length = keys.length; i < length; i++) {\n        map[keys[i]] = value;\n  \
    \    }\n    } else {\n      return get.call(this, name);\n    }\n\n    for (var\
    \ key in map) {\n      set.call(this, name, map[key]);\n    }\n\n    return this;\n\
    \  };\n}\n\nDateInterval.prototype.values = wrapFlexibleAccessor(\n  function(name)\
    \ { \n    return name !== undefined \n      ? this.values[name]\n      : this.values;\n\
    \  },\n  function(name, value) {\n    this.values[name] = value;\n  }\n);\n```\n\
    \n深入编写 DRY 代码的艺术远超本章的范围。[Rebecca Murphey](https://twitter.com/rmurphey)^(31) 编写的[更\
    \ DRY 的 JavaScript 模式](http://rmurphey.com/blog/2010/07/12/patterns-for-dry-er-javascript/)^(32)\
    \ 以及 [Mathias Bynens'](https://twitter.com/mathias)^(33) 关于[DRY 如何影响 JavaScript\
    \ 性能](http://slideshare.net/mathiasbynens/how-dry-impacts-javascript-performance-faster-javascript-execution-for-the-lazy-developer)^(34)\
    \ 的幻灯片，如果你是该话题的新手，这是一个很好的开始。\n\n### 引用的恐怖之处\n\n与其他语言不同，JavaScript 并不理解“按引用传递”或“按值传递”的概念。按值传递数据是安全的。它确保了传递给\
    \ API 的数据和从 API 返回的数据可以在 API 外部被修改，而不会改变内部状态。按引用传递通常用于保持低内存开销，按引用传递的值可以在 API 外部任何地方被更改，并影响内部状态。\n\
    \n在 JavaScript 中，没有办法告诉参数应该是按引用传递还是按值传递。原始类型（字符串、数字、布尔值）被视为`按值传递`，而对象（任何对象，包括\
    \ Array、Date）的处理方式类似于`按引用`。如果这是你第一次听到这个话题，请看下面的示例来大开眼界：\n\n```javascript\n// 按值传递\n\
    function addOne(num) {\n  num = num + 1; // 是的，num++ 是一样的\n  return num;\n}\n\n\
    var x = 0;\nvar y = addOne(x);\n// x === 0 <--\n// y === 1\n\n// 按引用传递\nfunction\
    \ addOne(obj) {\n  obj.num = obj.num + 1;\n  return obj;\n}\n\nvar ox = {num :\
    \ 0};\nvar oy = addOne(ox);\n// ox.num === 1 <--\n// oy.num === 1\n```\n\n如果你不小心，对象的`按引用`处理可能会反过来噬噬你。回到\
    \ `DateInterval` 的例子，看看这个讨厌蛋的 Bug：\n\n```javascript\nvar startDate = new Date(2012,\
    \ 0, 1);\nvar endDate = new Date(2012, 11, 31)\nvar interval = new DateInterval(startDate,\
    \ endDate);\nendDate.setMonth(0); // 设置为 1 月\nvar days = interval.days(); // 得到了\
    \ 31 但预期是 365 - 哎！\n```\n\n除非 `DateInterval` 的构造函数对接收到的值进行了`拷贝`（`clone` 是拷贝的专业术语），否则对原始对象的任何更改将反映在\
    \ `DateInterval` 内部。这`通常`不是我们想要或期望的。\n\n注意，从 API 返回的值也是如此。如果你简单地返回一个内部对象，在你的 API\
    \ 外部对其进行的任何更改将反映在你的内部数据上。这绝对不是你想要的。[jQuery.extend()](http://api.jquery.com/jQuery.extend/)^(35)\n\
    \n### 持续链问题\n\n在链式接口中，我们无法跳出链式。根据方法的作用，预判一个微小的`空值`检测可能有帮助：\n\n```javascript\n\
    jQuery.fn.somePlugin = function() {\n  if (!this.length) {\n    // 因为我们无内容而终止\n\
    \    return this;\n  }\n\n  // 执行计算任务\n  for (var i = 10000; i > 0; i--) {\n \
    \   // 我在浪费你宝贵的 CPU\n    // 如果你调用得足够频繁，我会把你的笔记本变成熔炉\n  }\n\n  return this.each(function()\
    \ {\n    // 执行实际工作\n  });\n};\n```\n\n在非链式代码中，我们可以防止函数的发生：\n\n```javascript\n\
    var $elem = jQuery('.wont-anything');\nif ($elem.length) {\n  //  这种\n  $somePlugin();\n\
    }\n```\n\n### 处理错误\n\n![快速失败](img/fail-faster.jpg \"Fail Fast\")\n\n我说无法跳出链式是在撒谎——规则有一个`例外`（原谅这个双关\
    \ ☺）。\n\n我们总是可以通过抛出 `Error` 来退出。抛出 `Error` 被视为主动中止当前流程，很可能是因为你进入了一个无法恢复的状态。但注意——并不是所有的错误都能帮助调试人员：\n\
    \n```javascript\n// jQuery 接受这个\n$(document.body).on('click', {});\n\n// 点击时控制台大尖叫\n\
    //   TypeError: ((p.event.special[l.origType] || {}).handle || l.handler).apply\
    \ is not a function \n//   in jQuery.min.js on Line 3\n\n这类错误非常难以调试。不要浪费别人的时间。如果\
    \ API 用户做了愚蠢的事，告知他们：\n\n```javascript\nif (Object.prototype.toString.call(callback)\
    \ !== '[object Function]') {\n  throw new TypeError(\"callback 不是函数!\");\n}\n\
    ```\n\n注意：不应该使用 `typeof callback === \"function\"`，因为旧浏览器可能会报告对象为`函数`，但它们并不是。在\
    \ Chrome（截至版本 12）中 `RegExp` 就是这样一种情况。为了方便起见，请使用 [jQuery.isFunction()](http://api.jquery.com/jQuery.isfunction/)^(40)\
    \ 或 [_.isFunction()](http://underscorejs.org/#isFunction)^(41)。\n\n"
- fmt: "\nMost libraries that I have come across, regardless of language (within the\
    \ weak-typing domain) don't care about rigorous input validation. To be honest,\
    \ my own code only validates where I anticipate developers stumbling. Nobody really\
    \ does it, but all of us should. Programmers are a lazy bunch—we don't write code\
    \ just for the sake of writing code or for some cause we don't truly believe in.\
    \ The developers of Perl6 have recognized this being a problem and decided to\
    \ incorporate something called `Parameter Constraints`. In JavaScript, their approach\
    \ might look something like this:\n\n```javascript\nfunction validateAllTheThings(a,\
    \ b {where typeof b === \"numeric\" and b < 10}) {\n  // Interpreter should throw\
    \ an Error if b is\n  // not a number or greater than 9\n}\n```\n\nWhile the syntax\
    \ is as ugly as it gets, the idea is to make validation of input a top-level citizen\
    \ of the language. JavaScript is nowhere near being something like that. That's\
    \ fine—I couldn't see myself cramming these constraints into the function signature\
    \ anyways. It's admitting the problem (of weakly-typed languages) that is the\
    \ interesting part of this story.\n\nJavaScript is neither weak nor inferior,\
    \ we just have to work a bit harder to make our stuff really robust. Making code\
    \ robust does not mean accepting any data, waving your wand and getting some result.\
    \ Being robust means not accepting rubbish *and telling the developer about it*.\n\
    \nThink of input validation this way: A couple of lines of code behind your API\
    \ can make sure that no developer has to spend hours chasing down weird bugs because\
    \ they accidentally gave your code a string instead of a number. This is the one\
    \ time you can tell people *they're wrong* and they'll actually love you for doing\
    \ so.\n\n## Going Asynchronous\n\nSo far we've only looked at synchronous APIs.\
    \ Asynchronous methods usually accept a callback function to inform the outside\
    \ world, once a certain task is finished. This doesn't fit too nicely into our\
    \ fluent interface scheme, though:\n\n```javascript\nApi.protoype.async = function(callback)\
    \ {\n  console.log(\"async()\");\n  // do something asynchronous\n  window.setTimeout(callback,\
    \ 500);\n  return this;\n};\nApi.protoype.method = function() {\n  console.log(\"\
    method()\");\n  return this;\n};\n```\n\n```javascript\n// running things\napi.async(function()\
    \ {\n  console.log('callback()');\n}).method();\n\n// prints: async(), method(),\
    \ callback()\n```\n\nThis example illustrates how the asynchronous method `async()`\
    \ begins its work but immediately returns, leading to `method()` being invoked\
    \ before the actual task of `async()` completed. There are times when we want\
    \ this to happen, but generally we expect `method()` to execute *after* `async()`\
    \ has completed its job.\n\n### Deferreds (Promises)\n\nTo some extent we can\
    \ counter the mess that is a mix of asynchronous and synchronous API calls with\
    \ [Promises](http://wiki.commonjs.org/wiki/Promises/A)^([42](#chapter-8.xhtml_fn8_42)).\
    \ jQuery knows them as [Deferreds](http://api.jquery.com/category/deferred-object/([([43](#chapter-8.xhtml_fn8_43)).\
    \ A `Deferred` is returned in place of your regular `this`, which forces you to\
    \ eject from method chaining. This may seem odd at first, but it effectively prevents\
    \ you from continuing synchronously after invoking an asynchronous method:\n\n\
    ```javascript\nApi.protoype.async = function() {\n  var deferred = $.Deferred();\n\
    \  console.log(\"async()\");\n\n  window.setTimeout(function() {\n    // do something\
    \ asynchronous\n    deferred.resolve(\"some-data\");\n  }, 500);\n\n  return deferred.promise();\n\
    };\n```\n\n```javascript\napi.async().done(function(data) {\n  console.log(\"\
    callback()\");\n  api.method();\n});\n\n// prints: async(), callback(), method()\n\
    ```\n\nThe `Deferred` object let's you register handlers using `.done()`, `.fail()`,\
    \ `.always()` to be called when the asynchronous task has completed, failed, or\
    \ regardless of its state. See [Promise Pipelines In JavaScript](http://sitr.us/2012/07/31/promise-pipelines-in-javascript.html)^([44](#chapter-8.xhtml_fn8_44))\
    \ for a more detailed introduction to Deferreds.\n\n## Debugging Fluent Interfaces\n\
    \nWhile *Fluent Interfaces* are much nicer to develop with, they do come with\
    \ certain limitations regarding de-buggability.\n\nAs with any code, *Test Driven\
    \ Development* (TDD) is an easy way to reduce debugging needs. Having written\
    \ `URI.js` in TDD, I have not come across major pains regarding debugging my code.\
    \ However, TDD only *reduces* the need for debugging—it doesn't replace it entirely.\n\
    \nSome voices on the internet suggest writing out each component of a chain in\
    \ their separate lines to get proper line-numbers for errors in a stack trace:\n\
    \n```javascript\nfoobar.bar()\n  .baz()\n  .bam()\n  .someError();\n```\n\nThis\
    \ technique does have its benefits (though better debugging is not a solid part\
    \ of it). Code that is written like the above example is even simpler to read.\
    \ Line-based differentials (used in version control systems like SVN, GIT) might\
    \ see a slight win as well. Debugging-wise, it is only Chrome (at the moment),\
    \ that will show `someError()` to be on line four, while other browsers treat\
    \ it as line one.\n\nAdding a simple method to logging your objects can already\
    \ help a lot—although that is considered “manual debugging” and may be frowned\
    \ upon by people used to “real”:\n\n```javascript\nDateInterval.prototype.explain\
    \ = function() {\n  // log current state\n  console.dir(this);\n};\n\nvar days\
    \ = (new Date(2012, 0, 31))\n  .explain() // write some infos to the console\n\
    \  .days();\n```\n\n### Function names\n\nThroughout this chapter you've seen\
    \ a lot of demo code in the style `Foo.prototype.something={}` This style was\
    \ chosen to keep examples brief. When writing APIs you might want to consider\
    \ either of the following, to have function names:\n\n```javascript\nFoo.prototype.something\
    \ = function() {\n  // yadda\n};\n```\n\n```javascript\nFoo.prototype.something\
    \ = function() {\n  // yadda\n};\nFoo.prototype.displayName = \"Foo.something\"\
    ;\n```\n\nThe second option `displayName` was introduced by WebKit and later adopted\
    \ by Firefox. `displayName` is a bit more code to write, but allows arbitrary\
    \ names, including a namespace or associated object. Either of these approaches\
    \ can help with anonymous functions quite a bit. Read more on this topic in [Named\
    \ function expressions demystified](http://kangax.github.com/nfe/)^([45](#chapter-8.xhtml_fn8_45))\
    \ by [kangax](https://twitter.com/kangax)^([46](#chapter-8.xhtml_fn8_46)).\n\n\
    ## Documenting APIs\n\nOne of the hardest tasks of software development is documenting\
    \ things. Practically everyone hates doing it, yet everybody laments about bad\
    \ or missing documentation of the tools they need to use. There is a wide range\
    \ of tools that supposedly help and automate your code:\n\n- [YUIDoc](http://yui.github.com/yuidoc)^([47](#chapter-8.xhtml_fn8_47))\
    \ (requires Node.js, npm)\n- [JsDoc Toolkit](https://github.com/p120ph37/node-jsdoc-toolkit)^([48](#chapter-8.xhtml_fn8_48))\
    \ (requires Node.js, npm)\n- [Markdox](https://github.com/cbou/markdox)^([49](#chapter-8.xhtml_fn8_49))\
    \ (requires Node.js, npm)\n- [Dox](https://github.com/visionmedia/dox)^([50](#chapter-8.xhtml_fn8_50))\
    \ (requires Node.js, npm)\n- [Docco](http://jashkenas.github.com/docco/)^([51](#chapter-8.xhtml_fn8_51))\
    \ (requires Node.js, Python, CoffeeScript)\n- [JSDuck](https://github.com/senchalabs/jsduck)^([52](#chapter-8.xhtml_fn8_52))\
    \ (reqires Ruby, gem)\n- [JSDoc 3](https://github.com/jsdoc3/jsdoc)^([53](#chapter-8.xhtml_fn8_53))\
    \ (requires Java)\n"
