  trans: "\n\n我遇到过的多数库，无论使用什么语言（在弱类型领域内），都不关心严格的输入验证。坦率地说，我自己的代码只会在我预见到开发者会绊倒的地方进行验证。并没有真的有人这样做，但我们所有人都应该这样做。程序员是一群懒汉——我们写代码并不是为了写代码而写代码，也不是为了某些我们并不真正认同的事业。Perl6\
    \ 的开发者意识到了这个问题，并决定引入一种名为 `Parameter Constraints`（参数约束）的东西。在 JavaScript 中，他们的方法可能看起来如下：\n\
    \n```javascript\nfunction validateAllTheThings(a, b {where typeof b === \"numeric\"\
    \ and b < 10}) {\n  // Interpreter should throw an Error if b is\n  // not a number\
    \ or greater than 9\n}\n```\n\n虽然这种语法极其难看，但其核心思想是将输入验证成为语言层面的“一等公民”。JavaScript\
    \ 远没有达到那种程度。这没关系——反正我也没法把自己把这些约束塞进函数签名中。承认这个问题（弱类型语言的问题）才是这个故事中有趣的地方。\n\nJavaScript\
    \ 既不弱也不低级，我们只是需要付出更多的努力来让我们的东西真正健壮。让代码健壮并不意味着接受任何数据并挥挥魔棒就能得到结果。健壮意味着不接受垃圾，*并且告诉开发者这件事*。\n\
    \n可以这样看待输入验证：在你 API 后面的几行代码，可以确保没有开发者需要花费几个小时去追溯奇怪的 bug，只因为他们不小心给了你的代码一个字符串而不是数字。这是你唯一可以告诉人们*他们错了*，而他们实际上会因为你这样做而喜欢你。\n\
    \n## 异步化\n\n到目前为止，我们只看了同步 API。异步方法通常接受一个回调函数，以便在特定任务完成后通知外部。不过，这与我们的流式接口方案并不太契合：\n\
    \n```javascript\nApi.protoype.async = function(callback) {\n  console.log(\"async()\"\
    );\n  // do something asynchronous\n  window.setTimeout(callback, 500);\n  return\
    \ this;\n};\nApi.protoype.method = function() {\n  console.log(\"method()\");\n\
    \  return this;\n};\n```\n\n```javascript\n// running things\napi.async(function()\
    \ {\n  console.log('callback()');\n}).method();\n\n// prints: async(), method(),\
    \ callback()\n```\n\n这个示例说明了异步方法 `async()` 如何开始工作但立即返回，导致 `method()` 在 `async()`\
    \ 实际任务完成之前就被调用。某些时候我们希望这种情况发生，但通常我们期望 `method()` 在 `async()` 完成其任务*后*执行。\n\n###\
    \ 延迟 (Promises)\n\n在某种程度上，我们可以通过 [Promises](http://wiki.commonjs.org/wiki/Promises/A)^(42)\
    \ 来应对异步和同步 API 调用混合带来的混乱。jQuery 将它们称为 [Deferreds](http://api.jquery.com/category/deferred-object/(([43)。返回一个\
    \ `Deferred` 对象来代替常规的 `this`，这迫使你离开链式调用。这初看起来看起来可能很奇怪，但它有效地防止了你在调用异步方法后继续进行同步操作：\n\
    \n```javascript\nApi.protoype.async = function() {\n  var deferred = $.Deferred();\n\
    \  console.log(\"async()\");\n\n  window.setTimeout(function() {\n    // do something\
    \ asynchronous\n    deferred.resolve(\"some-data\");\n  }, 500);\n\n  return deferred.promise();\n\
    };\n```\n\n```javascript\napi.async().done(function(data) {\n  console.log(\"\
    callback()\");\n  api.method();\n});\n\n// prints: async(), callback(), method()\n\
    ```\n\n`Deferred` 对象允许你使用 `.done()`、`.fail()`、`.always()` 注册处理器，在异步任务完成、失败或无论状态如何时调用。请参阅\
    \ [JavaScript 中的 Promise Pipeline](http://sitr.us/2012/07/31/promise-pipelines-in-javascript.html)^(44)\
    \ 以获取关于 Deferred 的更详细介绍。\n\n## 调试流式接口\n\n虽然*流式接口*（Fluent Interfaces）开发起来方便得多，但它们在调试性方面确实存在某些局限性。\n\
    \n与任何代码一样*测试驱动开发*（TDD）是减少调试需求的简单方法。由于是用 TDD 编写的 `URI.js`，我并没有遇到过调试代码的主要痛苦。然而，TDD\
    \ 只是*减少*了调试需求——它并没有完全取代调试。\n\n互联网上有些声音建议将链中的每个组件写在单独的行上，以便堆栈跟踪中的错误获得正确的行号：\n\n\
    ```javascript\nfoobar.bar()\n  .baz()\n  .bam()\n  .someError();\n```\n\n这种技术确实有其优势（尽管更好的调试并不是其固有的部分）。像上面示例那样编写的代码甚至更易读。基于行的差异（用于\
    \ SVN、GIT 等版本控制系统）也可能获得细微的优势。在调试方面，目前只有 Chrome 会显示 `someError()` 在第四行，而其他浏览器将其视为第一行。\n\
    \n为你的对象添加一个简单的日志方法就已经很有帮助了——尽管这被认为是“手动调试”，并可能被习惯了“真实”调试的人所鄙弃：\n\n```javascript\n\
    Date.prototype.explain = function() {\n  // log current state\n  console.dir(this);\n\
    };\n\nvar days = (new Date(2012, 0, 31))\n  .explain() // write some infos to\
    \ the console\n```\n\n### 函数名\n\n在本章中，你看到了大量的 `Foo.prototype.something={}` 风格的代码。在编写\
    \ API 时，你可能考虑以下两种方式的函数名：\n\n```javascript\nFoo.prototype.something = function()\
    \ {\n  // yadda\n};\n```\n\n```javascript\nFoo.prototype.something = function()\
    \ {\n  // yadda\n};\nFoo.prototype.displayName = \"Foo.something\";\n```\n\n第二种方案\
    \ `displayName` 由 WebKit 引入后被 Firefox 采用。`displayName` 编写起来稍微复杂，但允许任意名称，包括命名空间或关联对象。这两种方法对匿名函数都有帮助。关于这个主题，请阅读\
    \ [kangax](https://twitter.com/kangax)^(46) 的[命名命名函数表达式 (Named function expressions)](http://kangax.github.com/nfe)。\n\
    \n## 文档编写\n\n软件开发中最困难的任务之一就是编写文档。几乎每个人都讨厌它，但每个人都在抱怨他们使用的工具文档糟糕或缺失。有很多工具据称可以帮助并自动化你的代码：\n\
    \n-   [YUIDoc](http://yui.github.com/yuidoc)^(47) (需要 Node.js, npm)\n-   [JsDoc\
    \ Toolkit](https://github.com/p120ph37/node-jsdoc-toolkit)^(48) (需要 Node.js, npm)\n\
    -   [Markdox](https://github.com/cbou/markdox)^(49) (需要 Node.js, npm)\n-   [Dox](https://github.com/visionmedia/dox)^(50)\
    \ (需要 Node.js, npm)\n-   [Docco](http://jashkenas.github.com/docco/)^(51) (需要\
    \ Node.js, Python, CoffeeScript)\n-   [JSDuck](https://github.com/senchalabs/jsduck)^(52)\
    \ (需要 Ruby, gem)\n-   [JSDoc 3](https://github.com/jsdoc3/jsdoc)^(53) (需要 Java)\n\
    \n"
- fmt: '

    At one point or another all of these tool won''t fail to disappoint. JavaScript
    is a very dynamic language and thus particularly diverse in expression. This makes
    a lot of things extremely difficult for these tools. The following list features
    a couple of reasons why I''ve decided to prepare documentation in vanilla HTML,
    markdown or [DocBook](http://en.wikipedia.org/wiki/DocBook) (if the project is
    large enough). jQuery, for example, has the same issues and doesn''t document
    their APIs within their code at all.


    - Function signatures aren''t the only documentation you need, but most tools
    focus only on them.

    - Example code goes a long way in explaining how something works. Regular API
    docs usually fail to illustrate that with a fair trade-off.

    - API docs usually fail horribly at explaining things behind the scenes (flow,
    events, etc.).

    - Documenting methods with multiple signatures is usually a real pain.

    - Documenting methods using option objects is often not a trivial task.

    - Generated Methods aren''t easily documented, neither are default callbacks.


    If you can''t (or don''t) want to adjust your code to fit one of the listed documentation
    tools, projects like [Document-Bootstrap](http://gregfranko.com/Document-Bootstrap)
    might save you some time setting up your home brew documentation.


    Make sure your Documentation is more than just some generated API doc. Your users
    will appreciate any examples you provide. Tell them how your software flows and
    which events are involved when doing something. Draw them a map, if it helps their
    understanding of whatever it is your software is doing. And above all: keep your
    docs in sync with your code!


    ## Self-Explanatory Code


    Providing good documentation will not keep developers from actually reading your
    code—your code is a piece of documentation itself. Whenever the documentation
    doesn''t suffice (and every documentation has its limits), developers fall back
    to reading the actual source to get their questions answered. Actually, you are
    one of them as well. You are most likely reading your own code again and again,
    with weeks, months or even years in between.


    You should be writing code that explains itself. Most of the time this is a non-issue,
    as it only involves you thinking harder about naming things (functions, variables,
    etc) and sticking to a core concept. If you find yourself writing code comments
    to document how your code does something, you''re most likely wasting time—your
    time, and the reader''s as well. Comment on your code to explain *why* you solved
    the problem this particular way, rather than explaining *how* you solved the problem.
    The *how* should become apparent through your code, so don''t repeat yourself.
    Note that using comments to mark sections within your code or to explain general
    concepts is totally acceptable.


    ## Conclusion


    - An API is a contract between you (the provider) and the user (the consumer).
    Don''t just change things between versions.

    - You should invest as much time into the question *How will people use my software?*
    as you have put into *How does my software work internally?*

    - With a couple of simple tricks you can greatly reduce the developer''s efforts
    (in terms of the lines of code).

    - Handle invalid input as early as possible—throw `Errors`.

    - Good APIs are flexible, better APIs don''t let you make mistakes.


    Continue with [Reusable Code for good or for awesome](http://vimeo.com/35689836)
    ([slides](http://www.slideshare.net/jaffathecake/reusable-code-for-good-or-for-awesome)),
    a Talk by [Jake Archibald](https://twitter.com/jaffathecake) on designing APIs.
    Back in 2007 Joshua Bloch gave the presentation [How to Design A Good API and
    Why it Matters](http://www.youtube.com/watch?v=heh4OeB9A-c).

    '
