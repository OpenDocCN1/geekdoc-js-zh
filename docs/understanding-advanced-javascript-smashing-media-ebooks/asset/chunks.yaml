    \ be to add a function to the Date object in order to return an interval:\n\n\
    ```\n// DateInterval creator for fluent invocation\nDate.prototype.until = function(end)\
    \ {\n\n  // if we weren't given a date, make one\n  if (!(end instanceof Date))\
    \ {\n    // create date from given arguments,\n    // proxy the constructor to\
    \ allow for any parameters\n    // the Date constructor would've taken natively\n\
    \    end = Date.apply(null, \n      Array.prototype.slice.call(arguments, 0)\n\
    \    );\n  }\n\n  return new DateInterval(this, end);\n};\n```\n\nNow we can create\
    \ that `DateInterval` in a fluent, easy to type-and-read fashion:\n\n```\nvar\
    \ startDate = new Date(2012, 0, 1);\nvar interval = startDate.until(2012, 11,\
    \ 31);\nvar days = interval.days(); // 365\n\n// condensed fluent interface call:\n\
    var days = (new Date(2012, 0, 1))\n  .until(2012, 11, 31) // returns DateInterval\
    \ instance\n  .days(); // 365\n```\n\nAs you can see in this last example, there\
    \ are less variables to declare, less code to write, and the operation almost\
    \ reads like an english sentence. With this example you should have realized that\
    \ method chaining is only a part of a fluent interface, and as such, the terms\
    \ are not synonymous. To provide fluency, you have to think about code streams—where\
    \ are you coming from and where you are headed.\n\nThis example illustrated fluidity\
    \ by extending a native object with a custom function. This is as much a religion\
    \ as using semicolons or not. In [Extending built-in native objects. Evil or not?](http://perfectionkills.com/extending-built-in-native-objects-evil-or-not/)^([10](#chapter-8.xhtml_fn8_10))\
    \ [kangax](https://twitter.com/kangax)^([11](#chapter-8.xhtml_fn8_11)) explains\
    \ the ups and downs of this approach. While everyone has their opinions about\
    \ this, the one thing everybody agrees on is keeping things consistent. As an\
    \ aside, even the followers of “Don't pollute native objects with custom functions”\
    \ would probably let the following, still somewhat fluid trick slide:"
