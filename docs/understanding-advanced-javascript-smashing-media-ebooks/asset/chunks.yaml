- fmt: "\nThis chapter covers the most important things that you will need to consider\
    \ before and while writing your own utilities and libraries. We'll focus on how\
    \ to make your code `accessible` to other developers. A couple of topics will\
    \ be touching upon `jQuery` for demonstration, yet this chapter is neither about\
    \ `jQuery` nor about writing plugins for it.\n\nPeter Drucker once said: “The\
    \ computer is a moron.” Don't write code for morons, write for humans! Let's dive\
    \ into designing the APIs that developers will love using.\n\n## Fluent Interface\n\
    \nThe [Fluent Interface](http://en.wikipedia.org/wiki/Fluent_interface#JavaScript)^([1](#chapter-8.xhtml_fn8_1))\
    \ is often referred to as `Method Chaining` (although that's only half the truth).\
    \ To beginners it looks like the `jQuery style`. While I believe the API style\
    \ was a key ingredient in `jQuery`'s success, it wasn't invented by them—credits\
    \ seem to go to Martin Fowler who [coined the term](http://martinfowler.com/bliki/FluentInterface.html)^([2](#chapter-8.xhtml_fn8_2))\
    \ back in 2005, roughly a year before `jQuery` was released. Fowler only gave\
    \ the thing a name, though—Fluent Interfaces have been around for a much longer\
    \ time.\n\nAside from major simplifications, `jQuery` offered to even out severe\
    \ browser differences. It has always been the `Fluent Interface` that I have loved\
    \ most about this extremely successful library. I have come to enjoy this particular\
    \ API style so much that it became immediately apparent that I wanted this style\
    \ for [URI.js](http://medialize.github.com/URI.js/)^([3](#chapter-8.xhtml_fn8_3)),\
    \ as well. While tuning up the `URI.js` API, I constantly looked through the `jQuery`\
    \ source to find the little tricks that would make my implementation as simple\
    \ as possible. I found out that I was not alone in this endeavor. [Lea Verou](https://twitter.com/leaverou)^([4](#chapter-8.xhtml_fn8_4))\
    \ created [chainvas](http://lea.verou.me/chainvas/)^([5](#chapter-8.xhtml_fn8_5))—a\
    \ tool to wrap regular getter/setter APIs into sweet fluent interfaces. Underscore's\
    \ [`_.chain()`](http://underscorejs.org/#chain)^([6](#chapter-8.xhtml_fn8_6))\
    \ does something similar. In fact, most of the newer generation libraries support\
    \ method chaining.\n\n### Method Chaining\n\nThe general idea of [Method Chaining](http://en.wikipedia.org/wiki/Method_chaining)^([7](#chapter-8.xhtml_fn8_7))\
    \ is to achieve code that is as fluently readable as possible and thus quicker\
    \ to understand. With `Method Chaining` we can form code into sentence-like sequences,\
    \ making code easy to read, while reducing noise in the process:\n\n```\n// regular\
    \ API calls to change some colors and add an event-listener\nvar elem = document.getElementById(\"\
    foobar\");\nelem.style.background = \"red\";\nelem.style.color = \"green\";\n\
    elem.addEventListener('click', function(event) {\n  alert(\"hello world!\");\n\
    }, true);\n\n// (imaginary) method chaining API\nDOMHelper.getElementById('foobar')\n\
    \  .setStyle(\"background\", \"red\")\n  .setStyle(\"color\", \"green\")\n  .addEvent(\"\
    click\", function(event) {\n    alert(\"hello world\");\n  });\n```\n\nNote how\
    \ we didn't have to assign the element's reference to a variable and repeat that\
    \ over and over again.\n\n### Command Query Separation\n\n[Command and Query Separation](http://en.wikipedia.org/wiki/Command-query_separation)^([8](#chapter-8.xhtml_fn8_8))\
    \ (CQS) is a concept inherited from imperative programming. Functions that change\
    \ the state (internal values) of an object are called `commands`, functions that\
    \ retrieve values are called `queries`. In principle, queries return data, commands\
    \ change the state—but neither does both. This concept is one of the foundations\
    \ of the everyday getter and setter methods we see in most libraries today. Since\
    \ `Fluent Interfaces` return a self-reference for chaining method calls, we're\
    \ already breaking the rule for `commands`, as they are not supposed to return\
    \ anything. On top of this (easy to ignore) trait, we (deliberately) break with\
    \ this concept to keep APIs as simple as possible. An excellent example for this\
    \ practice is `jQuery`'s [`css()`](http://api.jquery.com/css/)^([9](#chapter-8.xhtml_fn8_9))\
    \ method:\n\n```\nvar $elem = jQuery(\"#foobar\");\n\n// CQS - command\n$elem.setCss(\"\
    background\", \"green\");\n// CQS - query\n$elem.getCss(\"color\") === \"red\"\
    ;\n\n// non-CQS - command\n$elem.css(\"background\", \"green\");\n// non-CQS -\
    \ query\n$elem.css(\"color\") === \"red\";\n```\n\nAs you can see, getter and\
    \ setter methods are merged into a single method. The action to perform (namely,\
    \ `query` or `command`) is decided by the amount of arguments passed to the function,\
    \ rather than by which function was called. This allows us to expose fewer methods\
    \ and in turn type less to achieve the same goal.\n\nIt is not necessary to compress\
    \ getters and setters into a single method in order to create a fluid interface—it\
    \ boils down to personal preference. Your documentation should be very clear with\
    \ the approach you've decided on. I will get into documenting APIs later, but\
    \ at this point I would like to note that multiple function signatures may be\
    \ harder to document.\n\n### Going Fluent\n\nIt is not necessary to compress getters\
    \ and setters into a single method in order to create a fluid interface—it boils\
    \ down to personal preference. Your documentation should be very clear with the\
    \ approach you've decided on. I will get into documenting APIs later, but at this\
    \ point I would like to note that multiple function signatures may be harder to\
    \ document.\n\nWhile method chaining already does most of the job, you're not\
    \ off yet. To illustrate the next step, we come up with this:\n\n```\nvar startDate\
    \ = new Date(2012, 0, 1);\nvar endDate = new Date(2012, 11, 31);\nvar interval\
    \ = new DateInterval(startDate, endDate);\nvar days = interval.days(); // 365\n\
    ```\n\nWhile this looks right at first, this example shows what's wrong:\n\n```\n\
    var startDate = new Date(2012, 0, 1);\nvar endDate = new Date(2012, 11, 31);\n\
    var interval = new DateInterval(startDate, endDate);\nvar days = interval.days();\
    \ // 365\n```\n\nWe're writing out whole bunch of variables and stuff. A nice\
    \ solution to the problem would be to add a function to the Date object:\n\n```\n\
    Date.prototype.until = function(end) {\n\n  // if we weren't given a date, make\
    \ one\n  if (!(end instanceof Date)) {\n    // create date from given arguments,\n\
    \    // proxy the constructor to allow for any\n    // the Date constructor would've\
    \ taken\n    end = Date.apply(null,\n      Array.prototype.slice.call(arguments,\
    \ 0)\n    );\n  }\n\n  return new DateInterval(this, end);\n};\n```\n\nNow we\
    \ can create that `Date` in a fluent, easy-to-read fashion:\n\n```\nvar startDate\
    \ = new Date(2012, 0, 1);\nvar interval = startDate.until(2012, 11, 31);\nvar\
    \ days = interval.days(); // 365\n\n// condensed fluent interface call:\nvar days\
    \ = (new Date(2012, 0, 1))\n  .until(2012, 11, 31) // returns DateInterval instance\n\
    \  .days(); // 365\n```\n\nThis example illustrated fluidity by extending a native\
    \ object with a custom function. This is as much a religion as using semicolons\
    \ or not. In [Extending built-in native objects. Evil or not?](http://perfectionkills.com/extending-built-in-native-objects-evil-or-not/)^([10](#chapter-8.xhtml_fn8_10))\
    \ [kangax](https://twitter.com/kangax)^([11](#chapter-8.xhtml_fn8_11)) explains\
    \ the ups and downs of this approach.\n"
