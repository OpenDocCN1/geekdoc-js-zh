    \n### The Last Of The Basics: Preventing Execution And Getting The Target\n\n\
    Two more things are important when it comes to events in the browser: we have\
    \ to stop the browser from carrying out its default action for the event, and\
    \ we have to find out which element the event fired on. The former is achieved\
    \ with the `ev.preventDefault()` method, and the latter is stored in `ev.target`.\n\
    \nSay you want to know that a link has been clicked, but you don't want the browser\
    \ to follow it because you have a great idea of what to do with that event instead.\
    \ You can do this by subscribing to the click event of the link, and you can stop\
    \ the browser from following it by calling `preventDefault()`. Here is the HTML:\n\
    \n```html\n<a class=\"prevent\" href=\"http://smashingmagazine.com\">Smashing,\
    \ my dear!</a>\n<a class=\"normal\" href=\"http://smashingmagazine.com\">Smashing,\
    \ my dear!</a>\n```\n\nAnd the JavaScript:\n\n```javascript\nvar normal = document.querySelector('.normal'),\n\
    \    prevent = document.querySelector('.prevent');\n\nprevent.addEventListener('click',\
    \ function(ev) {\n  alert('fabulous, really!');\n  ev.preventDefault();\n}, false);\n\
    \nnormal.addEventListener('click', function(ev) {\n  alert('fabulous, really!');\n\
    }, false);\n```\n\nNote: `document.querySelector()` is the standard way to get\
    \ an element in the DOM. It is what the `$()` method in jQuery does. You can read\
    \ the [W3C's specification](http://www.w3.org/TR/selectors-api/)^([14](#chapter-5.xhtml_fn5_14))\
    \ for it and get some [explanatory code snippets](https://developer.mozilla.org/En/Code_snippets/QuerySelector)^([15](#chapter-5.xhtml_fn5_15))\
    \ on the Mozilla Developer Network (MDN).\n\nIf you now click the link, you will\
    \ get an alert. And when you hit the “OK” button, nothing more happens; the browser\
    \ does not go to `http://smashingmagazine.com`. Without the `preventDefault()`,\
    \ the browser will show the alert and follow the link. [Try it out.](http://thewebrocks.com/demos/smashing-events/preventdefault.html)^([16](#chapter-5.xhtml_fn5_16))\n\
    \nThe normal way to access the element that was clicked or hovered over or that\
    \ had a key pressed is to use the `this` keyword in the handler. This is short\
    \ and sweet, but it's actually limiting because `addEventListener()` gives us\
    \ something better: the event target. It could also be confusing because `this`\
    \ might already be bound to something else, so using `ev.currentTarget` as noted\
    \ in the specification is a safer bet.\n\n### Event Delegation: It Rocks. Use\
