  trans: "\n\n```javascript\nString.prototype.foo = function() {\n  return new Foo(this);\n\
    }\n\n\"I'm a native object\".foo()\n  .iAmACustomFunction();\n```\n\n通过这种方法，你的函数仍然位于你的命名空间内，但可以通过另一个对象访问。确保你的\
    \ `.foo()` 等效项是一个非通用的术语，极不可能与其他 API 发生冲突。同时，确保你提供了适当的 `.valueOf()`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/valueOf)\
    \ 和 `.toString()`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Object/toString)\
    \ 方法来转换回原始类型。\n\n### 一致性 (Consistency)\n\n[Jake Archibald](https://twitter.com/jaffathecake)\
    \ 曾经有一张幻灯片定义过*一致性*。上面的内容仅仅是：[*不是 PHP*](http://www.slideshare.net/slideshow/embed_code/5426258?startSlide=59)。千万、永远不要发现自己在命名诸如\
    \ `str_repeat()`、`strpos()`、`substr()` 的函数。此外，永远不要打乱参数的顺序。如果你在某个时刻声明了 `find_in_array(haystack,\
    \ needle)`，那么引入 `findInString(needle, haystack)` 将引发一群愤怒的僵尸从坟墓爬起追杀你，并迫使你余生都在写\
    \ Delphi 语言！\n\n### 命名 (Naming Things)\n\n> “计算机科学中只有两个困难的问题：缓存失效和命名。”\n\n> —\
    \ Phil Karlton\n\n我参加过许多讲座和会议，试图教我如何命名的精妙之处。我没有离开任何一次会议时是没听过上述名言，也没有真正学会如何如何命名。我的建议可以总结为：*保持简洁且具有描述性，并遵循你的直觉*。但最重要的是，保持一致性。\n\
    \n上面的 `DateInterval` 示例引入了一个名为 `until()` 的方法。我们本可以将该函数命名为 `interval()`。后者更接近返回值，而前者更*符合人类阅读习惯*。找到一行你喜欢的表述并坚持使用它。一致性是至关重要的\
    \ 90% 因素。选择一种风格并坚持下去——即使你自己在未来的某时刻发现自己并不喜欢它。\n\n### 处理参数 (Handling Arguments)\n\
    \n![良好的意图](img/good-intention.jpg \"Good Intentions\")\n\n方法接受数据的方式比让它们支持链式调用更重要。虽然链式调用是非常通用的特性，你可以轻松让代码实现这一点，但处理参数并非如此。你需要思考你提供的方法最可能如何被使用。使用你\
    \ API 的代码是否可能会重复某些函数调用？为什么这些调用会被重复？你的 API 如何能帮助开发者减少重复调用方法调用的噪点？\n\njQuery 的 [`css()`](http://api.jquery.com/css/)\
    \ 方法可以为 DOM 元素设置样式：\n\n```javascript\njQuery(\"#some-selector\")\n  .css(\"background\"\
    , \"red\")\n  .css(\"color\", \"white\")\n  .css(\"font-weight\", \"bold\")\n\
    \  .css(\"padding\", 10);\n```\n\n这里有一个模式！每次方法调用都在命名一种样式并为其指定一个值。这要求方法接受一个映射（map）：\n\
    \n```javascript\njQuery(\"#some-selector\").css({\n  \"background\" : \"red\"\
    ,\n  \"color\" : \"white\",\n  \"font-weight\" : \"bold\",\n  \"padding\" : 10\n\
    });\n```\n\njQuery 的 [`on()`](http://api.jquery.com/on/) 方法可以注册事件处理器。像 `css()`\
    \ 一样，它接受事件映射，但更进了一步，允许为多个事件注册单个处理器：\n\n```javascript\n// 通过传递映射来绑定事件\njQuery(\"\
    #some-selector\").on({\n  \"click\" : myClickHandler,\n  \"keyup\" : myKeyupHandler,\n\
    \  \"change\" : myChangeHandler\n});\n\n// 将一个处理器绑定到多个事件：\njQuery(\"#some-selector\"\
    ).on(\"click keyup change\", myEventHandler);\n```\n\n你可以通过以下*方法模式*提供上述函数签名：\n\
    \n```javascript\nDateInterval.prototype.values = function(name, value) {\n  var\
    \ map;\n\n  if (jQuery.isPlainObject(name)) {\n    // 设置一个映射\n    map = name;\n\
    \  } else if (value !== undefined) {\n    // 设置一个值（可能针对多个名称），并转换为映射\n    keys\
    \ = name.split(\" \");\n    map = {};\n    for (var i = 0, length = keys.length;\
    \ i < length; i++) {\n      map[keys[i]] = value;\n    }\n  } else if (name ===\
    \ undefined) {\n    // 获取所有值\n    return this.values;\n  } else {\n    // 获取特定值\n\
    \    return this.values[name];\n  }\n\n  for (var key in map) {\n    this.values[name]\
    \ = map[key];\n  }\n\n  return this;\n};\n```\n\n如果你正在处理集合（collections），请考虑可以做什么来减少\
    \ API 用户可能必须进行的循环次数。假设我们有一些 `<input>` 元素需要为它们设置默认值：\n\n```html\n<input type=\"\
    text\" value=\"\" data-default=\"foo\">\n<input type=\"text\" value=\"\" data-default=\"\
    bar\">\n<input type=\"text\" value=\"\" data-default=\"baz\">\n```\n\n我们可能会通过这种方式处理：\n\
    \n```javascript\njQuery(\"input\").each(function() {\n  var $this = jQuery(this);\n\
    \  $this.val($this.data(\"default\"));\n});\n```\n\n### 类型处理 (Handling Types)\n\
    \n每当你定义一个接受参数的函数时，都要决定它接收什么。计算两个日期之间天数的函数如下：\n\n```javascript\nDateInterval.prototype.days\
    \ = function(start, end) {\n  return Math.floor((end - start) / 86400);\n};\n\
    ```\n\n正如你所见，该函数期望的是输入。\n\n```javascript\nDateInterval.prototype.days = function(start,\
    \ end) {\n  if (!(start instanceof Date)) {\n    start = new Date(start);\n  }\n\
    \  if (!(end instanceof Date)) {\n    end = new Date(end);\n  }\n\n  return Math.floor((end.getTime()\
    \ - start.getTime()) / 86400);\n};\n```\n\n通过添加这几行代码，我们让函数能够接受 Date 对象、数字时间戳，甚至是像\
    \ `Sat Sep 08 2012 15:34:35 GMT+0200 (CEST)` 这样的字符串表示。我们不知道人们将如何以及为何使用我们的代码，但通过这种预见性，我们可以确保集成我们的代码时保持痛苦。\n\
    \n丰富的开发者可以发现示例代码中的另一个问题。我们假设 `start` 在 `end` 之前。如果 API 用户不小心交换了日期，他得到的两个日期之间的天数将是一个负值。停下来仔细考虑这些情况。如果你得出负值没有意义，请修复它：\n\
    \n```javascript\nDateInterval.prototype.days = function(start, end) {\n  if (!(start\
    \ instanceof Date)) {\n    start = new Date(start);\n  }\n  if (!(end instanceof\
    \ Date)) {\n    end = new Date(end);\n  }\n\n  return Math.abs(Math.floor((end.getTime()\
    \ - start.getTime()) / 86400));\n};\n```\n\n"
