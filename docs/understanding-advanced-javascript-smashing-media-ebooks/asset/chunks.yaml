    isTrusted: true\n```\n\n它也因事件而异。尝试点击演示并按下按键，你会发现得到不同的结果。你也可以参考[标准 `event` 属性完整列表](https://developer.mozilla.org/en/DOM/event#Properties)^(13)。\n\
    \n### 基础知识的最后：阻止执行和获取目标\n\n在浏览器事件方面，还有两点非常重要：我们必须阻止浏览器对事件执行默认操作，并且我们必须找到事件是在哪个元素上触发的。前者通过\
    \ `ev.preventDefault()` 方法实现，后者存储在 `ev.target` 中。\n\n假设你想知道一个链接是否被点击，但你不想让浏览器跳转，因为你对如何处理该事件有了一个极佳的主意。你可以通过订阅链接的点击事件来实现这一点，并通过调用\
    \ `preventDefault()` 来阻止浏览器跳转。以下是 HTML：\n\n```html\n<a class=\"prevent\" href=\"\
    http://smashingmagazine.com\">Smashing, my dear!</a>\n<a class=\"normal\" href=\"\
    http://smashingmagazine.com\">Smashing, my dear!</a>\n```\n\n以及 JavaScript：\n\n\
    ```javascript\nvar normal = document.querySelector('.normal'),\n    prevent =\
    \ document.querySelector('.prevent');\n\nprevent.addEventListener('click', function(ev)\
    \ {\n  alert('fabulous, really!');\n  ev.preventDefault();\n}, false);\n\nnormal.addEventListener('click',\
    \ function(ev) {\n  alert('fabulous, really!');\n}, false);\n```\n\n注意：`document.querySelector()`\
    \ 是在 DOM 中获取元素的标准方法。它就是 jQuery 中 `$()` 方法所做的事情。你可以阅读 [W3C 规范](http://www.w3.org/TR/selectors-api/)^(14)并在\
    \ Mozilla 开发者网络 (MDN) 上获取一些[解释代码片段](https://developer.mozilla.org/En/Code_snippets/QuerySelector)^(15)。\n\
    \n如果你现在点击链接，你会得到一个弹窗。当你点击“确定”按钮时，没有再发生其他事情了；浏览器不会访问 `http://smashingmagazine.com`。如果没有\
    \ `preventDefault()`，浏览器将显示弹窗并跳转到链接。[尝试一下。](http://thewebrocks.com/demos/smashing-events/preventdefault.html)^(16)\n\
    \n访问被点击、悬停或按下按键的元素的普通方法是在处理程序中使用 `this` 关键字。这种方法简洁明了，但实际上是有局限性的，因为 `addEventListener()`\
    \ 给了我们更好的东西：事件目标。这可能会引起混淆，因为 `this` 可能已经绑定到了其他东西，所以正如规范所示，使用 `ev.currentTarget`\
    \ 是更稳妥的选择。\n\n### 事件委托：它太棒了。用起来吧！\n\n使用事件对象的 `target` 属性，你可以找出事件发生在哪个元素上。\n\n\
    事件的发生是通过遍历整个文档树到达你交互的元素，然后返回主窗口。这意味着，如果你在一个元素上添加事件处理程序，你将免费获得所有的子元素。你只需要测试事件目标并做出相应的响应即可。[查看我的列表示例](http://thewebrocks.com/demos/smashing-events/eventation.html)^(17):\n\
    \n```html\n<ul id=\"resources\">\n  <li><a href=\"http://example.com/item 1\"\
    >item 1</a></li>\n  <li><a href=\"http://example.com/item 2\">item 2</a></li>\n\
    \  <li><a href=\"http://example.com/item 3\">item 3</a></li>\n</ul>\n```\n\n```javascript\n\
    var resources = document.getElementById('resources'),\n    log = document.getElementById('log');\n\
    \nresources.addEventListener('click', function(ev) {\n  if (ev.target.tagName\
    \ === 'A') {\n    console.log('Clicked link: ' + ev.target.href);\n  }\n}, false);\n\
    ```\n\n"
- fmt: "\n```css\n.smooth {\n  -webkit-transition: 0.5s;\n  -moz-transition: 0.5s;\n\
    \  -ms-transition: 0.5s;\n  -o-transition: 0.5s;\n  transition: 0.5s;\n}\n```\n\
    \nThe JavaScript:\n\n```javascript\nvar cb = document.querySelector('input[type=checkbox]');\n\
    cb.addEventListener('click', function(ev) {\n  plot.classList.toggle('smooth');\n\
    }, false);\n```\n\nThe interplay between CSS and JavaScript events has always\
    \ been powerful, but it got even better in newer browsers. As you might have guessed,\
    \ CSS transitions and animations have their own events.\n\n#### How Long Was A\
    \ Key Pressed?\n\nAs you might have seen in the list of available events earlier,\
    \ browsers also give us a chance to respond to keyboard entry and tell us when\
    \ the user has pressed a key. Sadly, though, key handling in a browser is hard\
    \ to do properly, as [Jan Wolter explains in detail](http://unixpapa.com/js/key.html)^([20](#chapter-5.xhtml_fn5_20)).\
    \ However, as a simple example, let's look how we can measure in milliseconds\
    \ how long a user has pressed a button. See [this keytime demo](http://thewebrocks.com/demos/smashing-events/keytime.html)^([21](#chapter-5.xhtml_fn5_21))\
    \ for an example. Press a key, and you will see the output field grow while the\
    \ key is down. Once you release the key, you'll see the number of milliseconds\
    \ that you pressed it. The code is not hard at all:\n\n```javascript\nvar resources\
    \ = document.querySelector('#resources'),\n    log = document.querySelector('#log'),\n\
    \    time = 0;\n\ndocument.addEventListener('keydown', keydown, false);\ndocument.addEventListener('keyup',\
    \ keyup, false);\n\nfunction keydown(ev) {\n  if (time === 0) { \n    time = ev.timeStamp;\
    \ \n    log.classList.add('animate');\n  }\n}\nfunction keyup(ev) {\n  if (time\
    \ !== 0) {\n    log.innerHTML = ev.timeStamp - time;\n    time = 0;\n    log.classList.remove('animate');\n\
    \  }\n}\n```\n\nWe define the elements we want and set the `time` to `0`. We then\
    \ apply two event handlers to the document, one on `keydown` and one on `keyup`.\n\
    \nIn the `keydown` handler, we check whether `time` is `0`, and if it is, we set\
    \ `time` to the `timeStamp` of the event. We assign a CSS class to the output\
    \ element, which starts a CSS animation (see the CSS for how that is done).\n\n\
    The `keyup` handler checks whether `time` is still `0` (as `keydown` gets fired\
    \ continuously while the key is pressed), and it calculates the difference in\
    \ the time stamps if it isn't. We set `time` back to `0` and remove the class\
    \ to stop the animation.\n\n#### Working With CSS Transitions (And Animations)\n\
    \n[CSS transitions](https://developer.mozilla.org/en/CSS/CSS_transitions)^([22](#chapter-5.xhtml_fn5_22))\
    \ fire a single event that you can listen for in JavaScript called `transitionend`.\
    \ The event object then has two properties: `propertyName`, which contains the\
    \ property that transitioned, and `elapsedTime`, which tells you how long it took.\
    \ Check out [the demo](http://thewebrocks.com/demos/smashing-events/transition.html)^([23](#chapter-5.xhtml_fn5_23))\
    \ to see it in action. The code is simple. Here is the CSS:\n\n```css\n.plot {\n\
    \  background:rgb(175,50,50);\n  width: 20px;\n  height: 20px;\n  border-radius:\
    \ 20px;\n  display: block;\n  -webkit-transition: 0.5s;\n  -moz-transition: 0.5s;\n\
    \  -ms-transition: 0.5s;\n  -o-transition: 0.5s;\n  transition: 0.5s;\n}\n\n.plot:hover\
    \ {\n  width: 50px;\n  height: 50px;\n  border-radius: 100px;\n  background: blue;\n\
    }\n```\n\nAnd the JavaScript:\n\n```javascript\nplot.addEventListener('transitionend',\
    \ function(ev) {\n  log.innerHTML += ev.propertyName + ':' + ev.elapsedTime +\
    \ 's ';\n}, false);\n```\n\nThis, however, works only in Firefox now because Chrome\
    \ and Safari have vendor-prefixed events. [David Calhoun's gist](https://gist.github.com/702)^([24](#chapter-5.xhtml_fn5_24))\
    \ shows, you need to detect what the browser supports and define the event's name.\
    \ [CSS animation events](https://developer.mozilla.org/en/CSS/animations)^([25](#chapter-5.xhtml_fn5_25))\
    \ work the same way, but you have three events instead of one: `animationstart`,\
    \ `animationend` and `animationiteration`. [MDN has a demo](https://developer.mozilla.org/samples/css/animations.html)^([26](#chapter-5.xhtml_fn5_26))\
    \ of it.\n\n#### Speed, Distance And Angle\n\nDetecting events happening is one\
    \ thing. If you want to do something with them that is beautiful and engaging,\
    \ then you need to go further and put some math into it. So, let's have a go at\
    \ using a few handlers to calculate the angle, distance and speed of movement\
    \ when user drags an element across the screen. [Check out the demo first.](http://thewebrocks.com/demos/smashing-events/speedangle.html)^([27](#chapter-5.xhtml_fn5_27))\n\
    \n```javascript\nvar plot = document.querySelector('.plot'),\n    log = document.querySelector('output'),\n\
    \    offset = plot.offsetWidth / 2,\n    pressed = false,\n    start = 0, x =\
    \ 0, y = 0, end = 0, ex = 0, ey = 0, mx = 0, my = 0, \n    duration = 0, dist\
    \ = 0, angle = 0;\n\ndocument.addEventListener('mousedown', onmousedown, false);\n\
    document.addEventListener('mouseup', onmouseup, false);\ndocument.addEventListener('mousemove',\
    \ onmousemove, false);\n\nfunction onmousedown(ev) {\n  if (start === 0 && x ===\
    \ 0 && y === 0) {\n    start = ev.timeStamp;\n    x = ev.clientX;\n    y = ev.clientY;\n\
    \    moveplot(x, y);\n    pressed = true;\n  }\n}\nfunction onmouseup(ev) {\n\
    \  end = ev.timeStamp;\n  duration = end - start;\n  ex = ev.clientX;\n  ey =\
    \ ev.clientY;\n  mx = ex - x;\n  my = ey - y;\n  dist = Math.sqrt(mx * mx + my\
    \ * my);\n  start = x = y = 0;\n  pressed = false;\n  angle = Math.atan2( my,\
    \ mx ) * 180 / Math.PI;\n  log.innerHTML = '<strong>' + (dist>>0) +'</strong>\
    \ pixels in <strong>'+\n                  duration +'</strong> ms ( <strong>'\
    \ +\n                  twofloat(dist/duration) +'</strong> pixels/ms)'+\n    \
    \              ' at <strong>' + twofloat(angle) +\n                  '</strong>\
    \ degrees';\n}\nfunction onmousemove (ev) {\n  if (pressed) {\n    moveplot(ev.pageX,\
    \ ev.pageY);\n  }\n}\nfunction twofloat(val) {\n  return Math.round((val*100))/100;\n\
    }\nfunction moveplot(x, y) {\n  plot.style.left = (x - offset) + 'px';\n  plot.style.top\
    \ = (y - offset) + 'px';\n}\n```\n\nOK, I admit: quite a lot is going on here.\
    \ But it is not as hard as it looks. For both `onmousedown` and `onmouseup`, we\
    \ read the mouse's position with `clientX` and `clientY` and the `timeStamp` of\
    \ the event. Mouse events have time stamps that tell you when they happened. When\
    \ the mouse moves, all we check is whether the mouse button has been pressed (via\
    \ a boolean set in the `mousedown` handler) and move the plot with the mouse.\n\
    \nThe rest is geometry—good old [Pythagoras](http://en.wikipedia.org/wiki/Pythagorean_theorem)^([28](#chapter-5.xhtml_fn5_28)),\
    \ to be precise. We get the speed of the movement by checking the number of pixels\
    \ traveled in the time difference between `mousedown` and `mouseup`. We get the\
    \ number of pixels traveled as the square root of the sum of the squares of the\
    \ difference between x and y at the start and end of the movement. And we get\
    \ the angle by calculating the arctangent of the triangle. All of this is covered\
    \ in “[A Quick Look Into the Math of Animations With JavaScript](http://coding.smashingmagazine.com/2011/10/04/quick-look-math-animations-javascript/)^([29](#chapter-5.xhtml_fn5_29))”;\
    \ or you can play with the following JSFiddle example:\n\n[![Demo](images/js-demo.png)](http://jsfiddle.net/codepo8/bAwUf/embedded/result,js,html,css)\n"
