  \ Web 服务器的响应](img/img-f4.8.html)\n\n    **图 4.8**     通过本地 Web 服务器的响应\n\n*   你是否可以将数据存储到互联网服务器上？如果可以，你可以将涉及的两个文件——`form_submit.htm`\
  \ 和 `form_submit.php`——上传到互联网服务器的某个目录中。我已将这些文件保存到我的域名 [theisweb.de](http://www.theisweb.de)\
  \ 下的 `jse` 目录中。该目录的地址是 [`theisweb.de/jse`](https://theisweb.de/jse)，你可以在那里找到本书所有程序的超链接，并按它们在章节中出现的顺序排列。本章中的其他示例均通过我的域名访问，即使并非所有程序都需要这样做。\n\
