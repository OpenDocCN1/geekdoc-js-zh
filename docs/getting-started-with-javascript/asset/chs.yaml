  \ = \"Monica\";`语句将导致错误。\n\n### 6.1.2    多维数组\n\n你可以创建包含数组本身的数组。通过这种方式，你可以创建多维数组。例如，表格的数据可以保存在二维数组中，如下面程序的第一部分所示：\n\
