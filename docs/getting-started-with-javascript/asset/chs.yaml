  \ 4，循环就会执行。由于循环包含多条语句，必须使用花括号。在循环内部，总和增加一个随机值并输出，你可以在图 2.22 中看到可能的输出。\n![“while”循环用于相加随机数](img/img-f2.22.html)\n\
