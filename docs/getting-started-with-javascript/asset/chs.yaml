  \n![检索节点和节点值](img/img-f5.4.html)\n\n**图 5.4**    检索节点和节点值\n\n## 5.3    子节点\n\n节点及其子节点都使用\
  \ `node` 对象表示。`hasChildNodes()` 方法返回节点是否拥有子节点的信息，节点的 `childNodes` 属性包含一个字段，其中包含节点的子节点。\n\
  \n`nodeType` 属性包含节点的类型。值 `1` 表示元素节点（此处为 HTML 元素节点），值 `3` 表示文本节点。文本节点的文本内容位于 `nodeValue`\
  \ 属性中，HTML 元素节点的标签名称位于 `nodeName` 属性中。\n\n以下示例程序使用前面描述的属性和方法以及一个递归函数，遍历文档 DOM 树的一部分：\n\
  \n```\n... <head> ...\n   <script> \n```\n\n```\n function nodes(reference, level)\n\
  \      {\n         for(let i=0; i<reference.childNodes.length; i++)\n         {\n\
  \            const ch = reference.childNodes[i];\n            if(ch.nodeType ==\
  \ 3)\n               document.write(\"Level:\" + level + \", Text: \"\n        \
  \          + ch.nodeValue + \"<br>\");\n            else if(ch.nodeType == 1)\n\
  \               document.write(\"Level:\" + level + \", Tag: \"\n              \
  \    + ch.nodeName + \"<br>\");\n            if(ch.hasChildNodes())\n          \
  \  {\n               level++;\n               nodes(ch, level);\n              \
  \ level--;\n            }\n         }\n      } \n```\n\n\n\n\n\n```\n </script>\n\
  </head>\n<body>\n   <p id=\"idParagraph\">\n      This <span style=\"font-style:italic;\"\
  >is</span> a paragraph\n      <span style=\"font-weight:bold;\">with tags\n    \
  \  <span style=\"font-style:italic;\">on multiple\n      </span></span>levels</p>\n\
  \   <script> \n```\n\n```\n const level = 0;\n      nodes(document.getElementById(\"\
  idParagraph\"), level); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 5.3**    \
  \ `dom_children.htm` 文件\n\n我们正在查看包含第一个段落的 DOM 树部分，并且递归函数 `nodes()` 首次被调用，参数是对该段落的引用。\n\
  \n变量 `level` 表示树中的当前层级。段落的子节点位于层级 0，它们的子节点位于层级 1，而它们的子节点位于层级 2。\n\n在 `nodes()` 函数中，使用\
  \ `for` 循环遍历当前元素的子节点字段，并在循环中设置对当前字段元素的引用以简化代码。如果字段元素是对文本节点的引用，则输出其值；但如果是对 HTML 元素节点的引用，则显示其名称。\n\
  \n如果当前字段元素本身有子节点，则层级数递增，并再次调用 `nodes()` 函数。\n\n通过这种方式，你可以遍历 DOM 树的所有分支。在某个时刻，你会确定每个分支都没有子节点，递归将返回。层级数会再次减少，最终回到层级\
  \ 0。\n\n程序的输出如图 图 5.5 所示。\n\n![第一个段落的子节点](img/img-f5.6.html)\n\n**图 5.5**     第一个段落的子节点\n\
  \n## 5.4    添加节点\n\n在本节中，我们将创建文本节点、HTML 元素节点和属性节点，并将它们添加到文档中。我们使用 `document` 对象的以下两个方法：\n\
  \n*   `createTextNode()` 方法，用于创建文本节点。该方法的参数是一个包含文本的字符串。\n*   `createElement()` 方法，用于创建\
  \ HTML 元素节点。该方法的参数是一个包含标签名称的字符串，不带尖括号。\n\n此外，`node` 对象还使用了三个方法：\n\n*   `appendChild()`\
  \ 方法，用于向节点添加子节点，添加在子节点字段的末尾。该方法的参数是对要添加的节点的引用。\n*   `setAttribute()` 方法，用于设置属性节点的值。如果属性节点尚不存在，则会先创建它。该方法的参数是两个字符串，分别包含属性的名称和新值。\n\
  *   `insertBefore()` 方法，用于在另一个子节点之前向节点添加子节点。该方法的参数是两个引用：一个是对要添加的节点的引用，另一个是对插入位置之前的节点的引用。\n\
  \n以下是程序代码：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n function append()\n\
  \      {\n         const text = document.createTextNode(\"Appended\");\n       \
  \  const par = document.createElement(\"p\");\n         par.appendChild(text);\n\
  \         par.setAttribute(\"style\", \"font-weight:bold;\");\n         document.getElementById(\"\
  idBody\").appendChild(par);\n      }\n\n      function insert()\n      {\n     \
  \    const text = document.createTextNode(\"Inserted\");\n         const par = document.createElement(\"\
  p\");\n         par.appendChild(text);\n         par.setAttribute(\"style\", \"\
  font-style:italic;\");\n         document.getElementById(\"idBody\").insertBefore(par,\n\
  \            document.getElementById(\"idParagraph3\"));\n      } \n```\n\n```\n\
