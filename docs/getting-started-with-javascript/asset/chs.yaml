  \ PHP 响应代码\n\n如果你重置表单而不是提交它，响应将如图 4.7 所示。\n\n![重置表单的响应](img/img-f4.7.html)\n\n**图\
  \ 4.7**     重置表单的响应\n\n### 4.2.2    作为替代方案的 Web 服务器\n\n如果你想在 Web 服务器上跟踪整个传输过程，有两种替代方案：\n\
  \n*   你可以在自己的计算机上使用本地 Web 服务器，并通过该 Web 服务器调用表单。为此，你需要安装免费提供的 XAMPP 程序包，并将涉及的两个文件——`form_submit.htm`\
  \ 和 `form_submit.php`——保存到 Web 服务器的某个目录中。例如，这可以是基础目录下的 `jse` 目录。调用 `form_submit.htm`\
