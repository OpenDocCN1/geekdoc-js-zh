  \n**图 4.9**     通过互联网服务器的响应\n\n如果你不使用这两种替代方案，而只是从目录中调用带有表单的程序，也没有问题。你仍然可以使用 JavaScript\
  \ 代码。\n\n### 4.2.3    提交代码\n\n以下是包含提交表单的文件的代码：\n\n```\n... <head> ...\n   <script>\
  \ \n      function submit()\n      {\n         const tx = document.getElementById(\"\
  idText\");\n         const entry = tx.value;\n         alert(\"Form will be sent\\\
  nEntry: \" + entry);\n      }\n\n      function reset()\n      {\n         alert(\"\
  Form will be reset\");\n      } \n   </script>\n</head>\n<body>\n   <form id=\"\
  idForm\" method=\"post\" action=\"form_submit.php\">\n      <p><input id=\"idText\"\
  \ name=\"entry\"> Enter text</p>\n      <p><input type=\"submit\"> <input type=\"\
  reset\"></p>\n   </form>\n   <script>\n      const fo = document.getElementById(\"\
  idForm\");\n      fo.addEventListener(\"submit\", submit);\n      fo.addEventListener(\"\
  reset\", reset);\n   </script>\n</body></html> \n```\n\n**清单 4.2**     form_submit.htm\
  \ 文件\n\n该表单具有唯一 ID `idForm`，并使用 `method` 属性的 `post` 值来定义安全的传输方法 post，所有示例均采用此方法。`action`\
  \ 属性的值引用了响应的 PHP 程序，我们假设该程序位于同一目录中。\n\n输入字段具有唯一 ID `idText`，这是使用 JavaScript 访问字段内容所必需的。输入字段还具有\
  \ `name` 属性，此处值为 `entry`，这是使用 PHP 访问字段内容所必需的。\n\n两个 `input` 元素的 `type` 属性的 `submit`\
  \ 和 `reset` 值将它们标识为用于提交或重置表单的按钮。\n\n`fo` 变量引用了表单，`addEventListener()` 方法用于将 `submit`\
  \ 和 `reset` 事件与命名函数 `submit()` 和 `reset()` 关联起来。\n\n### 4.2.4    接收代码\n\n如前所述，你无需学习\
  \ PHP——但为了提供信息和说明，这里例外地给出了接收 PHP 文件的代码，正如你在图 4.6 中已经看到的那样：\n\n```\n<!DOCTYPE html><html\
  \ lang=\"en-us\">\n<head>\n   <meta charset=\"utf-8\">\n   <title>Response from\
  \ the web server</title>\n   <link rel=\"stylesheet\" href=\"js5.css\">\n</head>\n\
  <body><p>\n<?php\n   echo \"Entry: \" . htmlentities($_POST[\"entry\"]) . \"<br>\"\
  ; \n?></p>\n</body>\n</html> \n```\n\n**清单 4.3**     form_submit.php 文件\n\n这是一个标准的\
  \ HTML 文档，PHP 代码嵌入在 `<?php` 和 `?>` 之间的容器中。语言元素 `echo` 用于在屏幕上输出，点号（`.`）用于连接各个文本部分，类似于\
  \ JavaScript 中的加号（`+`）。\n\n表单中具有 `name` 属性的元素会自动以其属性值成为 PHP 字段 `$_POST` 的元素。具体如下：`name=\"\
  entry\"` 变为 `$_POST[\"entry\"]`。\n\n`htmlentities()` 函数用于防范恶意用户可能通过输入字段向 Web 服务器传输的恶意代码的影响。\n\
  \n本书中几乎所有表单示例都配有相应的 PHP 文件，以说明处理过程。\n\n## 4.3    必填字段与检查\n\n你可以使用 HTML 轻松验证表单中的条目（即检查其有效性）。还可以使用\
  \ JavaScript 对表单中输入或选择的内容进行进一步验证。\n\n在以下示例中，必须在两个必填字段中输入姓氏和密码（参见图 4.10），并且可以在多行输入字段中输入评论。单击“提交”按钮时会发生以下情况：\n\
  \n*   如果两个必填字段中有一个为空，则会在表单内显示一条错误消息（参见图 4.11），并且表单不会被提交。\n\n\n\n\n\n如果输入的密码少于三个字符或多于八个字符，JavaScript\
  \ 会显示一条错误消息（参见图 4.12），并且表单不会提交。\n\n如果两个必填字段都已填写且密码长度正确，则表单会提交。\n\n当你对字符串的结构和处理有了更多了解后，可以执行进一步的检查。在第\
  \ 6 章的第 6.2.5 节中，你可以找到一个更长的示例。\n\n![必填字段和多行输入字段](img/img-f4.10.html)\n\n**图 4.10**    \
  \ 必填字段和多行输入字段\n\n![来自 HTML 的错误消息](img/img-f4.11.html)\n\n**图 4.11**     来自 HTML\
  \ 的错误消息\n\n![来自 JavaScript 的错误消息](img/img-f4.12.html)\n\n**图 4.12**     来自 JavaScript\
  \ 的错误消息\n\n以下是包含表单的文件代码：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n function\
  \ submit(e)\n      {\n         const pw = document.getElementById(\"idPassword\"\
  ).value;\n         if(pw.length < 3 || pw.length > 8)\n         {\n            alert(\"\
  Password must contain 3-8 characters\");\n            e.preventDefault();\n    \
  \        return false;\n         }\n\n         alert(document.getElementById(\"\
  idFamilyName\").value\n            + \"\\n\" + document.getElementById(\"idPassword\"\
  ).value\n            + \"\\n\" + document.getElementById(\"idComment\").value);\n\
  \      } \n```\n\n```\n </script>\n</head>\n<body>\n   <form id=\"idForm\" method=\"\
  post\" action=\"form_text.php\">\n      <p><input id=\"idFamilyName\" name=\"familyName\"\
  \n            required=\"required\"> Family name (*)</p>\n      <p><input id=\"\
  idPassword\" name=\"password\"\n            type=\"password\" required=\"required\"\
  > Password (*)</p>\n      <p><textarea id=\"idComment\" rows=\"3\" cols=\"25\"\n\
