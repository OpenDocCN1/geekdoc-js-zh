  **图 1.8**    JavaScript 已禁用\n# 2    编程的基本原则\n变量、运算符、分支、循环和函数是开始编程所需的基本元素。\n在本章中，您将学习\
  \ JavaScript 编程的基础知识：变量、运算符、分支、循环和函数。这些元素构成了许多编程语言的基础，并将使您以后更容易入门其他领域。\n## 2.1    存储值\n\
  文本或数字通常需要在程序序列中保存，它们既可以来自程序开发过程中的赋值，也可以来自使用程序时的输入。这些保存的值在程序的后续点中会再次用到。\n本节讨论使用变量存储文本、数字和真值，变量可以是可变的或不可变的。不可变的变量也称为常量。在本节中，您还将了解两个用于简单输入和输出的对话框。\n\
  JavaScript 中的变量没有定义的类型。您可以在变量中保存一个字符串（即文本），如果变量是可变的，您以后可以在同一个变量中保存一个数字。\n### 2.1.1    格式化字符串\n\
  文本由单个字符组成，整体称为字符串。变量用于存储值。以下程序包含一些示例：\n```\n<body><p>\n```\n```\n      helloText\
  \ = \"Hello world\";\n      helloText = \"Good morning\";\n\n      document.write(\"\
  Text: \" + text2 + \"<br>\");\n      let text3 = 'With single quotation marks';\n\
  \n      document.write(\"Text: \" + text4 + \"<br>\");\n      // document.write(\"\
  Text: \" + text5 + \"<br>\");\n      // document.write(\"Text: \" + text5 + \"<br>\"\
  );\n      const text6 = \"Cannot be changed\";\n      // text6 = \"Not allowed\"\
  ;\n```\n```\n</body></html> \n\n\n\n\n\n\n一个输出可以由多个部分组成。这可能包括一个用双引号括起来的字符串，其中也可以包含\
  \ HTML 标签。然而，它也可以是一个变量，其当前值被输出。各个部分通过 `+` 运算符组合成一个更长的字符串。\n使用 `text2` 变量，声明和赋值被合并到一条语句中。\n\
  字符串的值也可以写在单引号之间，正如你在 `text3` 变量中看到的那样。\n`text4` 变量被声明了，但在程序代码中没有被赋值。因此它的值为 `undefined`。\n\
  对尚未声明且尚未赋值的变量进行读取访问是不允许的。第一条包含 `text5` 变量的程序行会导致错误并终止程序，因此该行已被注释掉。\n虽然允许对尚未声明的变量进行写入访问，但不推荐这样做，因为该变量更容易被意外修改，也更难控制。因此，其他包含\
  \ `text5` 变量的程序行也被注释掉了。\n如果你想将一个变量标记为不可更改，同时确保其值在程序的后续过程中不能被修改，你应该使用 `const` 关键字而不是\
  \ `let`。变量 `text6` 就是这样一个不可更改的变量（即常量）。\n给常量赋新值会导致错误并终止程序，因此这一行也被注释掉了。\n你可以为了测试目的，暂时取消上述某个错误程序行的注释。单词\
  \ `End` 的输出会告诉你程序是运行到了结尾还是提前终止了。\n程序的输出如图 2.1 所示。\n![字符串的输出](img/img-f2.1.html)\n\
  **图 2.1**     字符串的输出\n### 注意\n变量也可以使用 `var` 关键字声明，但这些变量更容易被意外修改，也更难控制。这在由大量程序段组成的较长程序中尤其不利，因此使用这些变量更容易导致程序错误。相反，你应该始终使用\
  \ `let` 和 `const` 关键字，就像本书所有示例中所做的那样。\n### 2.1.2    命名规则\n以下是命名变量的一些规则：\n*   名称可以由大写和小写字母、数字以及下划线（`_`）组成。\n\
  *   名称开头不能是数字。\n*   名称中不允许出现特殊字符，例如德语变音字母 ä、ö、ü、Ä、Ö、Ü，ß 或空格。\n*   名称不能与 JavaScript\
  \ 关键字之一相同。关键字列表见 附录 A 的 A.2 节。\n此外，还有两个常见的约定：\n*   变量名称应具有自解释性（即，它应能说明其内容）。如果要保存姓氏，你应该将变量命名为\
  \ `familyName`。\n*   较长的变量名称尤其具有自解释性。驼峰式命名法已成为惯例：名称以小写字母开头，每个新单词以大写字母开头（例如 `buttonStart`、`buttonStop`）。\n\
  ### 2.1.3    字符串的输入与输出\n在本节中，你将学习两个有用的方法：\n*   `prompt()` 方法，它会打开一个对话框，提示你输入文本\n\
  *   `alert()` 方法，它会打开一个显示消息的对话框\n这两个方法都使用字符串，并导致程序在其运行过程中暂停，之后，只有在输入完成或消息被确认后，程序才会重新开始运行。这让你有机会进行交互、请求输入或启动输出的读取。\n\
  以下是一个示例：\n```\n<body>\n const input = prompt(\"输入：\\n 请进行输入：\",\n      alert(\"\
  你的输入：\\n\" + input + \"\\n 非常感谢\"); \n</body></html> \n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n...\n   <script> \n\n let number;\n      const anotherNumber\
  \ = number + 30.8;\n      const bigNumber = 5.2e6;\n\n      document.write(\"Another\
  \ number: \" + anotherNumber + \"<br>\");\n      document.write(\"Addition correct:\
  \ \" + (anotherNumber + 25) + \"<br>\");\n      document.write(\"Big number: \"\
  \ + bigNumber + \"<br>\");\n```\n```\n</body></html> \n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n...\n   <script> \n\n let saved;\n      const done = false;\n      document.write(\"\
  Done: \" + done + \"</p>\"); \n\n </script>\n```\n**清单 2.4**    bool.htm 文件\n`saved`\
