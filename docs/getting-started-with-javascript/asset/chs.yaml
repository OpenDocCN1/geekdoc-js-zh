  \     + \", Displacement: \" + kpower.getAttribute(\"displacement\")\n         \
  \         + \", Cylinders: \" + kpower.getAttribute(\"cylinders\");\n         }\n\
  \      } \n   </script>\n</head>\n<body>\n   <p>Car data:</p>\n   <p><a id=\"idLink0\"\
