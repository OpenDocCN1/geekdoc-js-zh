  \ `ons-icon` 组件创建图标。`icon` 属性引用图标的名称，名称的开头表明其来源自广泛使用的图标集合：`fa` 代表 Font Awesome，`md`\
  \ 代表 Material Design Iconic Font。\n\n你可以使用 `color` CSS 属性更改图标的颜色，并使用 `size` 属性设置大小。`spin`\
  \ 属性使图标持续旋转，而 `rotate` 属性则用于将图标顺时针旋转 90、180 或 270 度。你还可以将图标集成到其他元素中，例如这里的按钮上。\n\n\
  FAB 通常位于屏幕的某个角落，通常是右下角，但也可以使用 `bottom`、`right`、`top` 和 `left` 值进行定位。FAB 会覆盖该位置的屏幕内容。如果没有特殊定位，FAB\
  \ 会显示在正常屏幕内容中而不覆盖它。点击 FAB 后，其外观如图 12.8 所示。\n\n![点击 FAB 后](img/img-f12.8.html)\n\n\
  **图 12.8**     点击 FAB 后\n\n### 12.2.2    标准对话框\n\n你已经熟悉了使用 `ons.notification.alert()`\
  \ 方法的简单标准对话框。还有另外三种标准对话框，具有以下特点：\n\n*   `ons.notification.confirm()` 方法对应于用于确认或拒绝的\
  \ JavaScript `confirm()` 方法。\n*   `ons.notification.prompt()` 方法对应于用于输入文本的 JavaScript\
  \ `prompt()` 方法。\n*   `ons.notification.toast()` 方法用于引起对某条信息的注意。它会从屏幕底部以消息形式推入，让人联想到从烤面包机中弹出的吐司。\n\
  \n在图 12.9 中，你可以看到一个包含四个按钮的应用程序，用于调用这四种不同的标准对话框。\n\n![调用四种标准对话框的应用程序](img/img-f12.9.html)\n\
  \n**图 12.9**     调用四种标准对话框的应用程序\n\n现在，让我们看看用于评估输入的程序：\n\n```\n...\n<body>\n<ons-page>\n\
  \  <ons-list>\n\n    <ons-list-item>\n      <ons-button id=\"idInfo\">Information</ons-button>\n\
  \    </ons-list-item>\n\n    <ons-list-item>\n      <ons-button id=\"idConfirmation\"\
  >Confirmation</ons-button>\n    </ons-list-item>\n\n    <ons-list-item>\n      <ons-button\
  \ id=\"idInput\">Input</ons-button>\n    </ons-list-item>\n\n    <ons-list-item>\n\
  \      <ons-button id=\"idToast\">Toast</ons-button>\n    </ons-list-item>\n\n \
  \ </ons-list>\n</ons-page>\n\n<script> \n```\n\n\n\n\n\n```\n function info()\n\
  \   {\n     ons.notification.alert(\"Info\");\n   }\n\n   const confirmation = function()\
  \ {\n     ons.notification.confirm(\"Confirmation?\")\n       .then(function(sch)\
  \ {\n         if(sch==0) ons.notification.alert(\"Canceled\");\n         else ons.notification.alert(\"\
  Confirmed\");\n       });\n   };\n\n   const input = function() {\n     ons.notification.prompt(\"\
  Please make an entry\")\n       .then(function(tx) {\n         if(tx==\"\") ons.notification.alert(\"\
  No input\");\n         else ons.notification.alert(\"Input: \" + tx);\n       });\n\
  \   };\n\n   function toast()\n   {\n     ons.notification.toast(\"The toast\",\
  \ {timeout: 2000});\n   }\n\n   document.getElementById(\"idInfo\").addEventListener(\"\
  click\", info);\n   document.getElementById(\"idConfirmation\")\n      .addEventListener(\"\
  click\", confirmation);\n   document.getElementById(\"idInput\").addEventListener(\"\
  click\", input);\n   document.getElementById(\"idToast\").addEventListener(\"click\"\
  , toast); \n```\n\n```\n</script>\n</body></html> \n```\n\n**清单 12.5**     onsen_dialog.htm\
  \ 文件\n\n用于调用对话框的按钮在此处显示在列表项中。\n\n`ons.notification.confirm()` 方法会调用一个包含问题的消息窗口（参见图\
  \ 12.10）。你可以使用两个按钮：确定和取消。你点击的按钮的内部编号会作为返回值返回，并可以通过 `then()` 方法进行评估。在这里，该值作为参数传递给一个匿名函数。点击取消按钮后，该值为\
  \ 0。\n\n![标准确认对话框](img/img-f12.10.html)\n\n**图 12.10**     标准确认对话框\n\n`ons.notification.prompt()`\
  \ 方法会调用一个包含输入字段的消息窗口（参见图 12.11）。同时会显示一个键盘（此处不可见）。输入完成后，你必须点击确定按钮。\n\n![标准输入对话框](img/img-f12.11.html)\n\
  \n**图 12.11**     标准输入对话框\n\n输入的文本随后被返回，也可以通过 `then()` 方法进行评估。在这里，文本同样作为参数传递给一个匿名函数。如果文本是空字符串，则显示相应的消息；否则，显示该字符串本身。\n\
  \n你可以将 `timeout` 参数（以毫秒为单位）传递给 `ons.notification.toast()` 方法。在这种情况下，消息会在指定时间后消失；否则，它会一直保留。在图\
  \ 12.12 中，你可以看到 toast 的显示效果。\n\n![标准 Toast 对话框](img/img-f12.12.html)\n\n**图 12.12**\
  \     标准 Toast 对话框\n\n### 12.2.3    输入字段\n\n`ons-input` 类型的组件在功能上对应于 HTML 的 `input`\
  \ 元素。你可以使用不同类型的输入字段，用于数字、日期和时间、电话号码、URL、电子邮件地址、文件、颜色、纯文本和密码（另请参见第 4 章，第 4.9 节）。\n\
  \n你还可以添加带有帮助文本的标签和占位符。选择其中一个输入字段后，会显示相应的键盘或选择选项。\n\n`ons-search-input` 类型的组件比带有\
  \ `search` 子类型的 `ons-input` 组件更适合输入搜索词。\n\n如果你想从特定范围中选择一个数字，`ons-range` 类型的组件比带有\
  \ `range` 子类型的 `ons-input` 组件更合适。更多信息，请参见第 12.2.5 节。\n\n在图 12.13 和图 12.14 中，你可以看到我们提到的带有占位符的类型的示例。\n\
  \n输入表单的末尾有两个按钮。你可以使用第一个按钮显示输入的值以供检查，如图 12.15 所示。第二个按钮将数据发送到 PHP 程序。\n\n![输入字段，上半部分](img/img-f12.13.html)\n\
  \n**图 12.13**     输入字段，上半部分\n\n![输入字段，下半部分](img/img-f12.14.html)\n\n**图 12.14**\
  \     输入字段，下半部分\n\n![用于检查的输入值](img/img-f12.15.html)\n\n**图 12.15**     用于检查的输入值\n\
  \n以下是程序代码：\n\n```\n... <head> ...\n  <script> \n\n function values()\n    {\n  \
  \    ons.notification.alert(\n        \"Search: \" + document.getElementById(\"\
