  \ 文件\n\n首先来看函数的定义。函数名后的括号是空的，函数调用时传递的所有参数不仅可以在这些括号内使用，还可以在 `arguments` 对象中使用。该对象类似于一个字段，你可以通过\
  \ `arguments[0]` 访问第一个参数，通过 `arguments[1]` 访问第二个参数，以此类推。`length` 属性包含参数的数量。\n\n\
  为了计算总和，使用 `for` 循环遍历所有参数。确定参数的总和，并将其作为函数的返回值返回。\n\n在程序中，你会看到对该函数的三种不同调用：一次有两个参数，一次有四个参数，一次没有参数。确定并输出参数的总和，不带参数的调用表明参数数量确实是任意的。\n\
  \n程序的输出如图 2.41 所示。\n\n![任意数量的参数](img/img-f2.41.html)\n\n**图 2.41** 任意数量的参数\n\n\n\
  \n\n\n### 2.6.9    参数的默认值\n\n定义函数时，可以在参数列表末尾为个别参数分配默认值。这为你提供了另一种调用函数的方式，即使用不同数量的参数。\n\
  \n示例如下：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n function add(a, b, c\
  \ = 0, d = 0)\n      {\n         const sum = a + b + c + d;\n         return sum;\n\
  \      } \n```\n\n```\n </script>\n</head>\n<body><p>\n   <script> \n```\n\n```\n\
  \ document.write(\"两个数：\" + add(3, 5) + \"<br>\");\n      document.write(\"三个数：\"\
  \ + add(3, 5, 4) + \"<br>\");\n      document.write(\"四个数：\" + add(3, 5, 4, 9));\
  \ \n```\n\n```\n </script></p>\n</body></html> \n```\n\n**清单 2.35**    function_default.htm\
  \ 文件\n\n`add()` 函数用于对两个、三个或四个值进行求和。最后两个参数的默认值为 0，因此总和不会失真。程序的输出如图 2.42 所示。\n\n![带默认值的函数](img/img-f2.42.html)\n\
  \n**图 2.42**    带默认值的函数\n\n### 2.6.10    变量的有效性\n\n使用 `let` 或 `const` 声明的变量的有效性取决于声明的位置：\n\
  \n*   如果在花括号块外部声明，则在整个程序中有效。\n*   如果在花括号块内部声明，则仅在该块内有效。该块也可以是一个函数，并且可以在不同块中声明多个同名变量。在块内，具有更大有效性的同名变量会被隐藏。\n\
  \n函数的参数仅在相关函数内有效，并且不能在所讨论函数的顶层声明同名变量。\n\n在以下程序中，你可以看到上述关系：\n\n```\n... <head> ...\n\
  \   <script> \n```\n\n```\n function oscar(x)\n      {\n         const a = 52;\n\
  \         const d = 45;\n         document.write(\"在函数内：a:\" + a + \", b:\" + b\n\
  \            + \", x:\" + x + \", d:\" + d + \"<br>\");\n         if(true)\n   \
  \      {\n            const a = 62;\n            document.write(\"在块内：a:\" + a +\
  \ \", b:\" + b\n               + \", x:\" + x + \", d:\" + d + \"<br>\");\n    \
  \     }\n      } \n```\n\n```\n </script>\n</head>\n<body><p>\n   <script> \n```\n\
  \n```\n const a = 42;\n      const b = 43;\n      const c = 44;\n      document.write(\"\
  在整个程序中：a:\"\n         + a + \", b:\" + b + \", c:\" + c + \"<br>\");\n      oscar(c);\
  \ \n```\n\n```\n </script></p>\n</body></html> \n```\n\n**清单 2.36**    function_validity.htm\
  \ 文件\n\n变量 `a`、`b` 和 `c` 在文档的下半部分声明。它们在整个程序中有效，并且当调用 `oscar()` 函数时，变量 `c` 被传递。`oscar()`\
  \ 函数中的变量 `x` 是 `c` 的副本，并且仅在函数内有效。\n\n### 注意\n\n你也可以在函数中使用原始的 `c` 变量，但在函数内部，应尽可能少地使用适用于整个程序的变量。如果函数外部需要某个变量，则应将其作为参数传递。这样更容易控制，也更难被意外更改。\n\
  \n函数内部声明了另一个名为 `a` 的变量。它隐藏了上述同名变量，并在整个函数内有效，变量 `d` 也在整个函数内有效。\n\n在 `if` 之后的块内再次声明了一个名为\
  \ `a` 的变量。该变量隐藏了上述所有同名变量，并在整个 `if` 块内有效。\n\n在图 2.43 中，你可以看到变量及其值。\n\n![变量的有效性](img/img-f2.43.html)\n\
  \n**图 2.43**    变量的有效性\n\n### 注意\n\n应始终在尽可能靠近变量使用的位置声明变量（即在函数或块内，且在使用之前）。这样更容易控制，也更难被意外更改。\n\
  \n### 2.6.11    递归函数\n\n函数也可以调用其他函数。这被称为嵌套调用，程序每次都会返回到调用点。函数也可以调用自身，这一过程称为递归。递归函数必须包含一个终止递归的分支；否则会导致无限的自调用链。解决某些问题最优雅的方式就是递归。\n\
  \n在以下程序中，一个数字被不断减半，直到达到或低于某个限制值。程序的输出如图 2.44 所示。\n\n![递归函数](img/img-f2.44.html)\n\
  \n**图 2.44**    递归函数\n\n以下是示例程序的代码：\n\n```\n... <head> ...\n   <script> \n```\n\n\
  ```\n function halve(value, i)\n      {\n         document.write(i + \") \" + value\
  \ + \"<br>\");\n         value /= 2;\n         i++;\n         if(value > 0.1)\n\
  \            halve(value, i);\n         document.write(\"结束 \" + (i-1) + \")<br>\"\
  );\n      } \n```\n\n```\n </script>\n</head>\n<body><p>\n   <script> \n```\n\n\
  ```\n const value = 3.5, i = 1;\n      halve(value, i);\n      document.write(\"\
  程序结束\"); \n```\n\n```\n </script></p>\n</body></html> \n```\n\n**清单 2.37**    function_recursive.htm\
  \ 文件\n\n`halve()` 函数以初始值 3.5 被调用。输出该值，然后将其减半，如果值大于限制值 0.1，则函数再次调用自身。当达到或低于限制值时，递归结束。变量\
  \ `i` 在此用作调用次数的计数器。\n\n在此示例中，递归在第六次调用时结束，函数首次终止。执行顺序返回到第五次运行的末尾，然后到第四次运行的末尾，依此类推，直到第一次运行的末尾。最后，程序结束。\n\
  \n本书中还有更多递归的示例，例如第 5 章的第 5.3 节。\n\n### 2.6.12    匿名函数\n\n到目前为止，我们一直在使用命名函数（即具有名称的函数）。然而，还有匿名函数（即没有名称的函数）。它们乍看起来有点不寻常，但在某些情况下，它们可以显著缩短程序代码。例如，匿名函数用于处理事件（参见第\
  \ 4 章）或使用庞大的 jQuery 库（参见第 11 章）。\n\n此外，你不仅可以处理对字段或对象的引用，还可以处理对函数的引用。可以将对函数的引用赋值给变量，也可以将对函数的引用作为参数传递。\n\
  \n以下是一个示例程序：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n const greeting =\
  \ function()\n      {\n         document.write(\"Hello world<br>\");\n      }\n\n\
  \      const sum = function(a,b)\n      {\n         const s = a + b;\n         return\
  \ s;\n      }\n\n      function oscar(welcome)\n      {\n         welcome();\n \
  \     } \n```\n\n```\n </script>\n</head>\n<body><p>\n   <script> \n```\n\n\n\n\n\
  \n```\n greeting();\n      oscar(greeting);\n\n      const result = sum(35, 7);\n\
  \      document.write(result + \"<br>\");\n\n      const add = sum;\n      document.write(add(45,\
  \ 17) + \"<br>\");\n\n      document.write((function() { return \"Good morning<br>\"\
  ; })());\n      document.write((function(a, b) { return a * b; })(12, 6)); \n```\n\
  \n```\n </script></p>\n</body></html> \n```\n\n**清单 2.38**     `function_anonymous.htm`\
  \ 文件\n\n第一个匿名函数输出文本 `Hello world`，且定义时没有参数。该函数的引用被赋值给 `greeting` 变量。\n\n在第二个匿名函数中，两个传入的参数相加，结果作为返回值返回。该函数的引用被赋值给\
  \ `sum` 变量。\n\n这两个匿名函数都通过变量名后跟括号的方式调用，就像命名函数一样：`greeting()` 或 `sum(35, 7)`。\n\n\
  你可以将函数的引用传递给另一个函数。这里在调用 `oscar()` 函数时就发生了这种情况。在 `oscar()` 函数内部，`welcome` 名称引用了第一个匿名函数，因此\
  \ `welcome()` 调用会产生相同的结果。\n\n引用函数的变量值可以赋值给另一个变量。这里将变量 `sum` 赋值给了变量 `add`，然后就可以使用\
  \ `add(...)` 调用来启动第二个匿名函数。\n\n在程序末尾，你可以看到两个匿名函数，它们没有赋值给任何变量，而是直接调用：\n\n*   第一个函数没有参数，返回文本\
  \ `\"Good morning\"`。返回的文本通过 `document.write()` 输出。\n\n*   第二个匿名函数有参数 `a` 和 `b`，返回这两个参数的乘积。这里以值\
  \ 12 和 6 调用它，同样，返回结果通过 `document.write()` 输出。\n\n要调用匿名函数，必须将其整个定义括在圆括号中。后面跟着参数括号（如果有的话）。请始终留意多级括号。在图\
  \ 2.45 中你可以看到程序的运行结果。\n\n![匿名函数](img/img-f2.45.html)\n\n**图 2.45**     匿名函数\n\n\
  ### 2.6.13    回调函数\n\n函数的引用可以传递给另一个函数供内部使用。在此上下文中，传递的函数被称为回调函数。你可以将命名函数和匿名函数作为回调函数传递。回调函数也用于处理事件（参见第\
  \ 4 章）。\n\n在下面的程序中，`output()` 函数被调用了两次。它用于输出一个常规的值序列。然后对每个值执行数学计算，计算结果显示在值旁边。\n\n\
  数学计算可以自由选择。它在一个函数中定义，并在调用时将该函数的引用传递给 `output()` 函数：\n\n*   第一次调用传递了命名函数 `square()`\
  \ 的引用，该函数返回传入值的平方。\n\n*   第二次调用传递了一个匿名函数，该函数返回传入值的倒数。\n\n程序如下：\n\n```\n... <head>\
  \ ...\n   <script> \n```\n\n```\n function square(x)\n      {\n         return x\
  \ * x;\n      }\n\n      function output(from, to, step, fct)\n      {\n       \
  \  for(let p = from; p < to + step / 2.0; p += step)\n            document.write(p\
  \ + \" \" + fct(p) + \"<br>\");\n         document.write(\"<br>\");\n      } \n\
  ```\n\n```\n </script>\n</head>\n<body><p>\n   <script> \n```\n\n```\n output(5.0,\
  \ 15.0, 2.5, square);\n      output(3.0, 7.0, 1.0, function(p) { return 1 / p; });\
  \ \n```\n\n```\n </script></p>\n</body></html> \n```\n\n**清单 2.39**     `function_callback.htm`\
  \ 文件\n\n第一次调用计算从 5 到 15、步长为 2.5 的数的平方，第二次调用计算从 3 到 7、步长为 1 的数的倒数。\n\n与第 2.6.12 节中的程序不同，匿名函数不需要放在圆括号中，因为这里并没有调用它。只是传递了函数的引用。\n\
  \n程序的输出如图 2.46 所示。\n\n![回调函数](img/img-f2.46.html)\n\n**图 2.46**     回调函数\n\n# 3\
  \    自定义对象\n\n在本章中，你将学习创建自己的对象，并更好地理解现有对象的结构。\n\n在 JavaScript 中，你以面向对象的方式进行编程。有一系列预定义的对象：\n\
  \n*   你已经了解了 `window`、`document` 和 `Math` 对象。\n\n*   在第 4 章的第 4.8 节中，你将使用 `location`\
  \ 对象。\n\n*   第 6 章描述了其他预定义对象。\n\n然而，你也可以创建自己的对象，正如我将在本章中描述的那样。这允许你将主题相关的数据打包并访问，从而使你更容易理解和处理众多预定义对象。如果你的应用程序需要特殊选项，你可以通过继承来扩展自己的对象和预定义对象。\n\
  \n传统上，在 JavaScript 中，自定义对象是使用原型和构造函数创建的。自 ECMAScript 2015 标准引入以来，出现了一种新的标准表示法，其中使用类、构造函数、属性和方法，就像其他面向对象语言一样。所有现代浏览器都使用这种表示法，本书也只使用这种表示法。\n\
  \n原型概念只会在个别、独立的上下文中讨论。\n\n## 3.1    对象和属性\n\n本节描述如何定义一个名为 `Car` 的类，以及属性 `color`\
  \ 和 `speed`。首先定义的类将在实际程序中使用，然后创建该类的两个对象并输出。同一类的不同对象彼此相关，它们具有相同的属性，但值不同。\n\n程序如下：\n\
  \n```\n... <head> ...\n   <script> \n```\n\n```\n class Car\n      {\n         constructor(c,\
  \ s)\n         {\n            this.color = c;\n            this.speed = s;\n   \
  \      }\n      } \n```\n\n```\n </script>\n</head>\n<body>\n   <p><script> \n```\n\
  \n```\n const dodge = new Car(\"Red\", 50);\n      document.write(\"Color: \" +\
  \ dodge.color\n        + \", Speed: \" + dodge.speed + \"<br>\");\n\n      dodge.speed\
  \ = 75;\n      document.write(\"Color: \" + dodge.color\n         + \", Speed: \"\
  \ + dodge.speed + \"<br>\");\n\n      let renault = new Car(\"Yellow\", 65);\n \
  \     renault = new Car(\"Blue\", 85);\n      document.write(\"Color: \" + renault.color\n\
  \         + \", Speed: \" + renault.speed); \n```\n\n```\n </script></p>\n</body></html>\
  \ \n```\n\n**清单 3.1**     `obj_property.htm` 文件\n\n\n\n\n\n`class` 关键字用于引入类的定义。注意，类的名称后面不跟括号，这与函数不同。\n\
  \n构造函数用于创建类的对象。它有固定的名称 `constructor`，其参数对应于该类对象的属性。\n\n在构造函数中定义了两个属性，每个属性都使用 `this`\
  \ 关键字、点运算符和一个名称。这两个属性被赋值为创建 `Car` 类对象时作为参数传递的值。`this` 关键字引用该对象（即当前对象），并确保访问当前对象的属性或为当前对象执行方法。\n\
  \n定义的类在实际程序中使用。声明了不可变的 `dodge` 变量，并使用 `new` 关键字为其分配了对 `Car` 类新对象的引用。两个值作为两个属性的初始值传递，然后可以使用点表示法访问对象的属性。这些值可以输出或更改。\n\
  \n然后，声明了 `renault` 变量，并连续两次将 `Car` 类的对象分配给该变量。这些对象也具有 `color` 和 `speed` 属性，但对象的属性值不同。\n\
  \n在声明引用对象的变量时，对象的情况与字段相同：如果不可变变量引用了一个对象，则只有引用是不可变的。你可以更改对象的各个元素，但不能将另一个对象分配给该变量。\n\
  \n程序的输出如图 3.1 所示。\n\n![对象与属性](img/img-f3.1.html)\n\n**图 3.1**     对象与属性\n\n## 3.2    方法\n\
  \n方法是一种只能为其定义所在类的对象调用的函数。例如，`write()` 方法只有在使用点运算符为 `document` 对象调用时才会表现出熟悉的行为。方法通常用于更改相关类对象的属性，类的属性和方法统称为该类的成员。\n\
  \n在下面的示例中，第 3.1 节中的 `Car` 类得到了扩展。定义了 `paint()` 和 `accelerate()` 方法，用于更改 `color`\
  \ 和 `speed` 属性。此外，还定义了一个名为 `toString()` 的特殊方法；它能够像输出变量一样简单地输出对象。\n\n程序如下：\n\n```\n\
  ... <head> ...\n   <script> \n```\n\n```\n class Car\n      {\n         constructor(c,\
  \ s)\n         {\n            this.color = c;\n            this.speed = s;\n   \
  \      }\n\n         accelerate(value)\n         {\n            this.speed += value;\n\
  \         }\n\n         paint(c)\n         {\n            this.color = c;\n    \
  \     }\n\n         toString()\n         {\n            return \"Color: \" + this.color\n\
  \               + \", speed: \" + this.speed;\n         }\n      } \n```\n\n```\n\
  \ </script>\n</head>\n<body><p>\n   <script> \n```\n\n```\n const dodge = new Car(\"\
  Red\", 50);\n      document.write(\"Color: \" + dodge.color\n         + \", Speed:\
  \ \" + dodge.speed + \"<br>\");\n\n      dodge.accelerate(35);\n      dodge.paint(\"\
  Blue\");\n      document.write(dodge); \n```\n\n```\n </script></p>\n</body></html>\
  \ \n```\n\n**清单 3.2**     obj_method.htm 文件\n\n`accelerate()` 方法通过点运算符为 `dodge`\
  \ 对象调用。该方法期望一个数值，用于更改 `speed` 属性的值，而 `paint()` 方法期望一个字符串，表示 `color` 属性的新值。\n\n当调用\
  \ `document.write()` 方法需要输出对象本身时，会自动调用特殊的 `toString()` 方法。`toString()` 方法返回一个包含对象所有属性值的字符串（参见图\
  \ 3.2）。\n\n### 注意\n\n你可以在本书的可下载材料中找到 `u_class` 练习，位于附加章节 1 的第 1.9 节，下载地址为 [www.rheinwerk-computing.com/5875](http://www.rheinwerk-computing.com/5875)。\n\
  \n![使用方法](img/img-f3.2.html)\n\n**图 3.2**     使用方法\n\n## 3.3    私有成员\n\n在本章之前的程序中，你可以直接从实际程序访问对象的属性和方法。因此，这些程序中的成员是公开可访问的，简称为公有成员。\n\
  \n然而，根据面向对象的数据封装原则，对象的属性应尽可能受到保护。应该通过方法对这些属性进行受控访问，并且某些仅用于类内部流程的方法也应受到保护。这种受保护的成员称为私有成员。\n\
  \n自 ECMAScript 2022 起，你可以使用井号字符 `#` 声明私有成员。以下是一个示例程序，其中声明了一个私有属性和一个私有方法：\n\n```\n\
  ... <head> ...\n   <script> \n```\n\n```\n class Car\n      {\n         #color;\n\
  \n         constructor(c, s)\n         {\n            this.#color = c;\n       \
  \     this.speed = s;\n         }\n\n         accelerate(value)\n         {\n  \
  \          this.speed += value;\n         }\n\n         #paint(c)\n         {\n\
  \            if(c == \"Red\" || c == \"Yellow\" || c == \"Blue\")\n            \
  \   this.#color = c;\n         }\n\n         change(c, value)\n         {\n    \
  \          this.#paint(c);\n              this.accelerate(value);\n         }\n\n\
  \         toString()\n         {\n            return \"Color: \" + this.#color\n\
  \               + \", speed: \" + this.speed;\n         }\n      } \n```\n\n```\n\
  \ </script>\n</head>\n<body>\n   <p><script> \n```\n\n```\n const dodge = new Car(\"\
  Red\", 50);\n      document.write(dodge + \"<br>\");\n      // document.write(\"\
  Color: \" + dodge.#color + \"<br>\");\n\n      dodge.change(\"Green\", 25);\n  \
  \    document.write(dodge + \"<br>\");\n      dodge.change(\"Blue\", 10);\n    \
  \  document.write(dodge + \"<br>\");\n      // dodge.#paint(\"Yellow\"); \n```\n\
  \n```\n </script></p>\n</body></html> \n```\n\n**清单 3.3**     obj_private.htm 文件\n\
  \n私有属性在方法外部声明，通常位于类定义的开头。这里通过 `#color;` 语句完成。在类定义内部，通过 `this.#color` 访问该属性。在类定义外部则无法再访问。\n\
  \n\n\n\n\n要定义私有方法，需要在方法名称前加上 `#`，如 `#paint(c)` 方法头所示。在类定义内部，通过 `this.#paint(...)`\
  \ 访问该方法。在类定义外部则无法访问。\n\n在 `paint()` 方法中，注意确保只能使用允许的颜色：红色、黄色或蓝色。这样，私有属性 `color` 就得到了保护。你可以在图\
  \ 3.3 中看到程序运行结果。\n\n![访问私有成员](img/img-f3.3.html)\n\n**图 3.3**     访问私有成员\n\n## 3.4    设置器与获取器\n\
  \n自 ECMA 2022 起，你也可以使用设置器（setter）和获取器（getter）（即所谓的访问器）来对属性进行受控访问。设置器用于写访问，使用 `set`\
  \ 关键字；获取器用于读访问，使用 `get` 关键字。\n\n以下是一个示例程序，其中为私有属性定义了访问器：\n\n```\n... <head> ...\n\
  \   <script> \n```\n\n```\n class Car\n      {\n         #speed;\n\n         constructor(c,\
  \ s)\n         {\n            this.color = c;\n            this.setSpeed = s;\n\
  \         }\n\n         get getSpeed()\n         {\n            return this.#speed;\n\
  \         }\n\n         set setSpeed(s)\n         {\n            if(s < 0)     \
  \   s = 0;\n            else if(s > 100) s = 100;\n            this.#speed = s;\n\
  \         }\n\n         accelerate(value)\n         {\n            this.setSpeed\
  \ = this.getSpeed + value;\n         }\n\n         toString()\n         {\n    \
  \        return \"Color: \" + this.color\n               + \", Speed: \" + this.getSpeed;\n\
  \         }\n      } \n```\n\n```\n </script>\n</head>\n<body>\n   <p><script> \n\
  ```\n\n```\n const dodge = new Car(\"Red\", 150);\n      document.write(dodge +\
  \ \"<br>\");\n      dodge.accelerate(20);\n      document.write(dodge + \"<br>\"\
  );\n      dodge.accelerate(-120);\n      document.write(dodge + \"<br>\");\n   \
  \   dodge.accelerate(30);\n      document.write(dodge + \"<br>\"); \n```\n\n```\n\
  \ </script></p>\n</body></html> \n```\n\n**清单 3.4**     obj_accessor.htm 文件\n\n\
  在程序中，私有属性 `speed` 的值只能通过 `accelerate()` 方法更改。在该方法中，首先使用 `getSpeed` 获取器获取 `speed`\
  \ 属性的当前值，获取器像方法一样通过 `return` 返回值。\n\n在赋值语句的右侧计算 `speed` 属性的新值。赋值本身会调用 `setSpeed`\
  \ 设置器，新值作为参数传递，就像调用方法一样。设置器确保速度的新值仅在 0 到 100 的允许范围内，然后将其赋给私有属性 `speed`。\n\n设置器也在类的构造函数中使用，以限制属性的值。程序的输出如图\
  \ 图 3.4 所示。\n\n![使用访问器进行控制](img/img-f3.4.html)\n\n**图 3.4**     使用访问器进行控制\n\n##\
  \ 3.5    静态成员\n\n同一类的不同对象通常具有不同的属性值。除了这些与对象相关的属性外，你还可以定义静态属性，这些属性与整个类相关，并且所有对象都可以使用相同的值。你还可以定义静态方法，这些方法也引用整个类，并针对该类进行调用。\n\
  \n以下是一个示例程序，其中使用 `static` 关键字在类中声明了一个静态属性，并定义了一个静态方法：\n\n```\n... <head> ...\n \
  \  <script> \n```\n\n```\n class Car\n      {\n         static quantity = 0;\n\n\
  \         constructor(c, s)\n         {\n            this.color = c;\n         \
  \   this.speed = s;\n\n            Car.quantity = Car.quantity + 1;\n          \
  \  this.number = Car.quantity;\n         }\n\n         toString()\n         {\n\
  \            return \"Color: \" + this.color + \", Speed: \"\n               + this.speed\
  \ + \", Number: \" + this.number;\n         }\n\n         static output_quantity()\n\
  \         {\n            document.write(\"Quantity: \" + Car.quantity + \"<br>\"\
  );\n         }\n      } \n```\n\n```\n </script>\n</head>\n<body>\n   <p><script>\
  \ \n```\n\n```\n const dodge = new Car(\"Red\", 50);\n      document.write(dodge\
  \ + \"<br>\");\n      const renault = new Car(\"Yellow\", 65);\n      document.write(renault\
  \ + \"<br>\");\n\n      document.write(\"Quantity: \" + Car.quantity + \"<br>\"\
  );\n\n      Car.output_quantity(); \n```\n\n```\n </script></p>\n</body></html>\
  \ \n```\n\n**清单 3.5**     obj_static.htm 文件\n\n静态属性在方法外部声明，通常位于类定义的开头，并赋予一个初始值。在这里，我们在构造函数中对其进行读写访问。\n\
  \n静态属性 `quantity` 用于确定类中创建的对象数量。它还为每个对象赋予一个独立的 `number` 属性值，该值表示对象按创建顺序的序号。\n\n\
  静态属性 `quantity` 必须在方法内部和程序中通过类名访问（即通过 `Car.quantity`）。\n\n静态方法 `output_quantity()`\
  \ 输出一行指定对象数量的信息，该方法必须在程序中或其他方法内部通过类名调用（即 `Car.output_quantity()`）。\n\n程序的输出如图 图\
  \ 3.5 所示。\n\n![静态成员的使用](img/img-f3.5.html)\n\n**图 3.5**     静态成员的使用\n\n## 3.6    静态块\n\
  \n自 ECMAScript 2022 起，你可以使用静态块对类进行一次性初始化。它们通常也写在类定义的开头，并且可以在这样的语句块中定义静态属性。这样的块还可以包含其他要执行的语句。\n\
  \n在下面的程序片段中，你只会看到与 obj_static.htm 程序不同的那些行：\n\n```\n... <head> ...\n   <script>\
  \ \n```\n\n```\n class Car\n      {\n         static\n         {\n            Car.quantity\
  \ = 0;\n         }\n\n         constructor(c, s)\n         { ... \n```\n\n**清单 3.6**    \
  \ obj_static_block.htm 文件片段\n\n静态块使用 `static` 关键字引入。在其中声明的变量是静态的，由于变量位于块内，必须通过类名访问。程序的输出与\
  \ obj_static.htm 程序相同，如 图 3.5 所示。\n\n## 3.7    空引用\n\n在与对象相关的场景中，一个给定的变量可以引用空值而不是一个对象。这种情况可能发生在该变量被赋值为\
  \ `null` 之后，也可能发生在变量本应引用一个文档中不存在的 DOM 元素时（参见第 5 章）。\n\n引用空值的变量具有值 `null`，而空引用常常导致程序中止。有两个运算符可以防止这种情况发生：\n\
  \n\n\n\n\n*   空值合并运算符 `??`\n*   可选链运算符 `?.`\n\n以下程序展示了这些运算符的使用示例：\n\n```\n... <head>\
  \ ...\n   <script> \n```\n\n```\n class Car\n      {\n         constructor(c, s)\n\
  \         {\n            this.color = c;\n            this.speed = s;\n        \
  \ }\n\n         toString()\n         {\n            return \"Color: \" + this.color\n\
  \               + \", speed: \" + this.speed;\n         }\n      } \n```\n\n```\n\
  \ </script>\n</head>\n<body><p>\n   <script> \n```\n\n```\n let dodge = new Car(\"\
  Red\", 50);\n      document.write((dodge ?? \"Object does not exist\") + \"<br>\"\
  );\n      document.write(\"Color: \" + dodge?.color + \"<br>\");\n\n      dodge\
  \ = null;\n      document.write((dodge ?? \"Object does not exist\") + \"<br>\"\
  );\n      // document.write(\"Color: \" + dodge.color + \"<br>\");\n      document.write(\"\
  Color: \" + dodge?.color + \"<br>\"); \n```\n\n```\n </script></p>\n</body></html>\
  \ \n```\n\n**清单 3.7**     obj_null.htm 文件\n\n使用空值合并运算符 `??` 时，会检查左操作数。如果其值为 `null`，则返回右操作数；否则返回左操作数。\n\
  \n然后，由于 `dodge` 变量引用的对象存在，因此输出该对象。为了演示，程序中随后将该引用赋值为 `null`，这意味着 `dodge` 不再引用任何对象，从而导致显示文本\
  \ `\"Object does not exist\"`。\n\n点运算符 `.` 用于访问对象的属性和方法。如果对象不存在，程序将中止。因此，程序中的倒数第二条语句被注释掉了。\n\
  \n可选链运算符 `?.` 也用于访问对象的属性和方法。如果对象不存在，则返回 `undefined` 值，程序不会中止。\n\n程序的输出如图 3.6 所示。\n\
  \n![引用空对象](img/img-f3.6.html)\n\n**图 3.6**     引用空对象\n\n## 3.8    对象中的对象\n\n一个类的对象的属性可以是另一个类的对象。为了阐明这种关系，我们通过\
  \ `Engine` 类的 `drive` 属性来扩展 `Car` 类。\n\n以下是示例程序：\n\n```\n... <head> ...\n   <script>\
  \ \n```\n\n```\n class Engine\n      {\n         constructor(p, c, f)\n        \
  \ {\n            this.power = p;\n            this.cylinders = c;\n            this.fuel\
  \ = f;\n         }\n\n         tune(x)\n         {\n            this.power += x;\n\
  \         }\n\n         toString()\n         {\n            return \"Power: \" +\
  \ this.power + \", Cylinders: \"\n               + this.cylinders + \", fuel: \"\
  \ + this.fuel;\n         }\n      }\n\n      class Car\n      {\n         constructor(c,\
  \ s, d)\n         {\n            this.color = c;\n            this.speed = s;\n\
  \            this.drive = d;\n         }\n\n         toString()\n         {\n  \
  \          return \"Color: \" + this.color + \", Speed: \"\n               + this.speed\
  \ + \", Drive: \" + this.drive;\n         }\n      } \n```\n\n```\n </script>\n\
  </head>\n<body><p>\n   <script> \n```\n\n```\n const dodge = new Car(\"Red\", 50,\n\
  \         new Engine(60, 4, \"Diesel\"));\n      dodge.drive.tune(10);\n      document.write(dodge\
  \ + \"<br>\");\n\n      dodge.drive.power = 80;\n      dodge.drive.cylinders = 6;\n\
  \      dodge.drive.fuel = \"Gasoline\";\n      document.write(dodge); \n```\n\n\
  ```\n </script></p>\n</body></html> \n```\n\n**清单 3.8**     obj_in_object.htm 文件\n\
  \n`Engine` 类的对象具有 `power`、`cylinders` 和 `fuel` 属性。此外，还有用于改变性能的 `tune()` 方法和用于输出三个属性值的\
  \ `toString()` 方法。\n\n`Car` 类中添加了 `drive` 属性，并且该属性的值也通过 `toString()` 方法输出。\n\n程序中创建了一个\
  \ `Car` 类的对象，第三个参数是一个 `Engine` 类的对象，该对象也通过 `new` 创建。\n\n`dodge` 对象名称后的第一个点用于访问 `Car`\
