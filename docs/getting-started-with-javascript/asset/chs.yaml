  \ type=color`）\n*   多行文本字段（`textarea`）\n## 1.7    一些特殊字符\n你可以使用以下程序输出一些特殊字符。你也可以直接用键盘输入一些特殊字符，而所有这些字符都可以通过所谓的实体来输出。\n\
