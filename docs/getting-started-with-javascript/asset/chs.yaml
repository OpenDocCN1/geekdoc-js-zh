  \n## 6.7    JavaScript 对象表示法\n\nJavaScript 对象表示法（JSON）是一种紧凑表示法的名称，可应用于对象和数组。我们将这种表示法称为\
  \ JSON 格式。\n\n现代浏览器都熟悉`JSON`对象，它拥有静态方法，可用于将 JSON 格式的对象转换为可传输的字符串。反过来，你也可以从这样的字符串创建\
  \ JSON 格式的对象。\n\n可传输的字符串不仅可由 JavaScript 处理，也可由其他语言处理，这简化了不同应用程序之间的数据传输。\n\n### 6.7.1    JSON\
  \ 格式与 JSON 对象\n\n在以下示例中，程序创建了一个 JSON 格式的对象，然后使用`JSON`对象对其进行转换。\n\n程序如下：\n\n```\n\
  ...\n<body><p>\n   <script> \n```\n\n```\n const dodge = { \"color\":\"Red\", \"\
  speed\":50.2 };\n      document.write(dodge.color + \" \" + dodge.speed + \"<br>\"\
  );\n\n      const tx = JSON.stringify(dodge);\n      document.write(tx + \"<br>\"\
  );\n\n      const renault = JSON.parse(tx);\n      document.write(renault.color\
  \ + \" \" + renault.speed + \"<br>\");\n      renault.speed += 2.5;\n      document.write(\"\
  Faster: \" + renault.speed); \n```\n\n```\n </script></p>\n</body></html> \n```\n\
  \n**清单 6.49**     json_compact.htm 文件\n\n在 JSON 格式中，对象用花括号括起来，各个属性-值对用逗号分隔，属性与值之间用冒号分隔，属性名放在双引号中。如果值是字符串，则同样用双引号；如果是数值，则不加引号。小数部分使用小数点分隔。\n\
  \n在程序中，JSON 格式的`dodge`对象通过`JSON`对象的`stringify()`方法转换为可传输的`tx`字符串。随后进行反向过程：`tx`字符串通过`JSON`对象的`parse()`方法转换为`renault`对象，该对象随后以\
