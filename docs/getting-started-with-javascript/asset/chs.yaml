  \      red++;\n            green++;\n            blue++;\n            area.style.color\
  \ = \"rgb(\" + (256-red)\n               + \",\" + (256-green) + \",\" + (256-blue)\
  \ + \")\";\n            area.style.backgroundColor =\n               \"rgb(\" +\
  \ red +\", \"+ green +\", \"+ blue + \")\";\n         }\n      } \n```\n\n```\n\
  \ </script>\n</head>\n... \n```\n\n**清单 8.15**     css_color.htm 文件，上半部分\n\n\n\n\
  \n`change()` 函数为 `style` 属性的 `color` 和 `backgroundColor` 子属性赋予新值（参见图 8.15）。它通过字符串中的\
