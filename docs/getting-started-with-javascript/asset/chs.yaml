  \ 文件，JavaScript 代码\n\n数字输入字段的值在`submit()`函数中输出，`changeRange()`函数用于输出滑块数值，保留一位小数。\n\
  \n`window`对象的`setTimeout()`方法会产生一个超时。一个函数在延迟一段时间后启动，参数包括相关函数的引用（此处为`startProgress()`）和所需的延迟时间（毫秒）。返回一个引用，并保存在`reference`变量中，该变量在整个程序中有效。由于`startProgress()`函数不断调用自身，进度条从起始值\
  \ 10 逐步动画到结束值 100。\n\n可以通过调用`clearTimeout()`函数来阻止已经计划好的下一次`startProgress()`函数调用。这需要将`setTimeout()`函数返回的引用作为参数，从而提前终止动画。你可以在第\
  \ 6 章的 6.5 节中了解更多关于时间控制过程的内容。\n\n`pValue`变量在整个程序中有效，包含进度条的当前值。\n\n### 4.9.3    时间信息元素\n\
