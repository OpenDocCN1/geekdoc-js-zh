  \n`value` 变量用于设置两张图像的 `style` 属性的 `opacity` 子属性。该变量的初始值为 1.0，以 0.01 为增量递减，最终为 0.0。该值直接赋给第一张图像，而第二张图像的透明度则按相反方向变化，因此需要预先计算差值\
  \ `1 - value`。\n\n### 8.3.2    菜单的可见性\n\n我们利用可见性来动态显示带有子菜单的菜单。在图 8.19 中，可以看到菜单的初始状态。当鼠标悬停在某个菜单项上时，对应的子菜单变为可见（参见图\
  \ 8.20），只有当鼠标离开关联菜单或显示的子菜单区域时，子菜单才会再次隐藏。\n\n![菜单初始状态](img/img-f8.19.html)\n\n**图\
  \ 8.19**     菜单初始状态\n\n![可见的子菜单](img/img-f8.20.html)\n\n**图 8.20**     可见的子菜单\n\n\
  以下是示例程序：\n\n```\n... <head> ...\n   <script> \n function subOn(x)\n      {\n   \
