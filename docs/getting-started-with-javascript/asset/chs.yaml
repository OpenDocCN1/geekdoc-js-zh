  \ 方法返回对这个新对象的引用。\n\n程序中调用了 `dodge` 对象的 `copy()` 方法，并将该方法的结果（即对新对象的引用）赋值给变量 `renault`。于是就有了两个对象，它们的属性可以具有不同的值。\n\
