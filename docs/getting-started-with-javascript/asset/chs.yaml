  \ John, $3,500, born on 03/15/1962\";\n      else\n         echo \"6714, Mayer,\
  \ John\";\n   }\n   else if($_GET[\"pno\"] == 81343)\n   {\n      if($_GET[\"scope\"\
  ] == \"all\")\n         echo \"81343, Smith, Peter, $3,750, born on 04/12/1958\"\
  ;\n      else\n         echo \"81343, Smith, Peter\";\n   }\n?> \n```\n\n**清单 7.5**    \
  \ ajax_parameters.php 文件\n\n点击两个超链接中的任意一个都会调用 `request()` 函数，该函数会传输两个参数：一个数字和一个字符串。\n\
  \n你使用 `XMLHttpRequest` 对象的 `setRequestHeader()` 方法来定义这些数据的传输形式。在本例中，数据被附加到网站地址后面。`XMLHttpRequest`\
  \ 对象的 `open()` 方法的参数对应于所谓的查询字符串的内容，查询字符串的各个部分之间用 `&` 符号分隔。对于第一个超链接，查询字符串是 `pno=6714&scope=all`。\n\
  \n数据发送后，PHP 文件中的 `$_GET[\"pno\"]` 和 `$_GET[\"scope\"]` 元素将分别包含各自的值。在分支中，决定返回哪个响应。\n\
  \n## 7.3    读取 XML 文件\n\n可扩展标记语言（XML）是一种广泛使用的、平台无关的数据格式，适用于通用数据交换。你可以使用 Ajax 将外部程序生成并存储在\
  \ Web 服务器上的 XML 文件内容整合到你的文档中。\n\nXML 实际上是一种关于语言如何构建的规范。XML 中有一个包含子节点的节点层次结构，正如你在第\
  \ 5 章中已经看到的 HTML 那样。XML 文件的元素也是通过标签、容器和属性创建的。XML 文件可以在简单的文本编辑器中编辑。\n\n### 7.3.1    单个对象\n\
  \n你可以使用 Ajax 将 Web 服务器上 XML 文件的内容集成到文档中。\n\n首先是 XML 文件：\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<car>\n   <color>红色</color>\n   <speed>50</speed>\n\
  \   <power displacement=\"1600\" cylinders=\"4\">76.2</power>\n</car> \n```\n\n\
  **清单 7.6**     ajax_xml_single.xml 文件\n\n现代浏览器可以直接显示 XML 文件的结构，无论该 XML 文件是通过 Web\
  \ 服务器检索还是直接从本地硬盘获取，这一点都成立。在图 7.6 中，你可以看到指定的 XML 文件。\n\nXML 文件可以链接到另一个文件以格式化 XML\
  \ 数据，但本章的示例中没有这样做。因此，图 7.6 中提供了带有文本 `此 XML 文件似乎未显示...` 的注释。\n\n![XML 文件结构](img/img-f7.6.html)\n\
  \n**图 7.6**     XML 文件结构\n\n\n\n\n\nXML 代码的第一行标识了内容为 XML。接下来的字符编码指定了所使用的字符集，这与 HTML\
  \ 文档类似。每个 XML 文件中都有一个主元素或根节点，你可以自由选择各个节点的名称，只要遵守 XML 规则并保持自身结构的一致性即可。\n\n这里的根节点是\
  \ `car` 元素。一个 `car` 有三个属性，其值被定义为子节点，而第三个子节点有两个属性，每个属性都有值。如果某个值是带小数的数字，则必须用小数点分隔。\n\
  \n点击超链接后，通过 Ajax 从 XML 文件中读取这些数据，并填充到段落中（参见图 7.7）。\n\n![单个对象的数据](img/img-f7.7.html)\n\
  \n**图 7.7**     单个对象的数据\n\n以下是相应的程序：\n\n```\n... <head> ...\n   <script> \n    \
  \  function request()\n      {\n         const req = new XMLHttpRequest();\n   \
  \      req.open(\"get\", \"ajax_xml_single.xml\", true);\n         req.onreadystatechange\
  \ = evaluate;\n         req.send();\n      }\n\n      function evaluate(e)\n   \
  \   {\n         if(e.target.readyState == 4 && e.target.status == 200)\n       \
  \  {\n            const response = e.target.responseXML;\n            const kcolor\
  \ = response.getElementsByTagName(\"color\")[0];\n            const kpower = response.getElementsByTagName(\"\
  power\")[0];\n            document.getElementById(\"idData\").firstChild.nodeValue\
  \ =\n               \"Color: \" + kcolor.firstChild.nodeValue\n                \
  \  + \", Power: \" + kpower.firstChild.nodeValue\n                  + \", Displacement:\
  \ \" + kpower.getAttribute(\"displacement\")\n                  + \", Cylinders:\
  \ \" + kpower.getAttribute(\"cylinders\");\n         }\n      } \n   </script>\n\
  </head>\n<body>\n   <p>Car data:</p>\n   <p><a id=\"idLink\" href=\"#\">Dodge</a></p>\n\
  \   <p id=\"idData\"> </p>\n   <script> \n      document.getElementById(\"idLink\"\
  ).addEventListener(\"click\", request); \n   </script>\n</body></html> \n```\n\n\
  **清单 7.7**     ajax_xml_single.htm 文件\n\n在 `request()` 函数中，`open()` 方法打开与响应 XML\
  \ 文件的通信。这里请求的是 XML 文档而非文本文档，因此 `evaluate()` 函数使用 `responseXML` 属性而非 `responseText`\
  \ 属性。\n\n在接下来的段落中，你会看到许多与第 5 章内容相似的地方。`document` 对象的 `getElementsByTagName()` 方法返回一个数组，其中包含对所有具有所需标签的\
  \ XML 元素的引用，在本例中，是针对 `color` 标签和 `power` 标签。示例中只有一个数组元素，索引为 0。\n\n第一个元素的第一个子节点通过\
  \ `node` 对象的 `firstChild` 属性输出。然后通过 `node` 对象的 `getAttribute()` 方法确定并输出两个不同属性的值。\n\
