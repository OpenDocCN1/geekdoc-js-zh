  \ `stop()` 函数中结束。\n\n## 6.6 其他数据结构\n\n\n\n\n数据结构用于将一组主题相关的数据存储在一个共同的名称下。这些数据由单个元素组成，这些元素通常具有相同的类型，但也可以具有不同的类型。\n\
  \n在第 6.1 节中，你学习了数组数据结构。在本节中，我们将添加更多称为集合和映射的数据结构。\n\n### 6.6.1 集合\n\n集合是一组唯一值的集合，这意味着每个值在集合中只出现一次。在\
  \ JavaScript 中，`Set`对象用于创建集合。集合具有可用于访问其值的属性和方法。\n\n以下程序展示了集合的一些典型操作：\n\n```\n...\n\
  <body><p>\n   <script> \n\n const s = new Set([23, 5, 28, -4, 5, 8, 23]);\n    \
  \  s.add(5);\n      s.add(36);\n\n      document.write(\"Values with forEach():\
  \ \");\n      function output(value)\n      {\n         document.write(value + \"\
  \ \");\n      }\n      s.forEach(output);\n      document.write(\"<br>\");\n\n \
  \     let v = 23;\n      if(s.has(v))\n         document.write(\"Value \" + v +\
  \ \" is in the set<br>\");\n      v=24;\n      if(!s.has(v))\n         document.write(\"\
  Value \" + v + \" is not in the set<br>\");\n\n      document.write(\"Values with\
  \ values(): \");\n      const it = s.values();\n      for(let i=0; i<s.size; i++)\n\
  \         document.write(it.next().value + \" \");\n      document.write(\"<br>\"\
  );\n\n      document.write(\"Number of values: \" + s.size + \"<br>\");\n      s.delete(8);\n\
  \      document.write(\"After deleting a value: \" + s.size + \"<br>\");\n     \
  \ s.clear();\n      document.write(\"After clearing the set: \" + s.size); \n\n\
  \ </script></p>\n</body></html> \n```\n\n**清单 6.47**     `set.htm` 文件\n\n你可以在创建集合时填充值。为此，需要在方括号中传递一个包含可能值的枚举。如果某个值出现两次，它只会被添加到集合中一次。\n\
  \n`add()` 方法用于添加单个值。这里遵循同样的原则：如果值已存在，则不会添加。\n\n你可以使用 `forEach()` 方法按照值添加的顺序完全遍历集合。该方法接受一个函数引用作为参数，该函数会为每个值执行。这里，它是用于显示值的\
  \ `output()` 方法。我们看不到的是，`forEach()` 方法确保将值作为第一个参数传递给 `output()` 方法。\n\n`has()` 方法用于确定某个特定值是否在集合中。\n\
  \n`values()` 方法返回一个迭代器类型的枚举对象，我们简称为迭代器。可以对此类型的对象调用 `next()` 方法，它提供对枚举中下一个元素的引用。该元素的值可以通过\
  \ `value` 属性确定。`size` 属性的值对应于集合中的值的数量，可以在 `for` 循环中使用它来输出集合的所有值。\n\n`delete()` 方法用于从集合中删除特定值，`clear()`\
  \ 方法用于删除集合中的所有值。程序的输出如图 6.39 所示。\n\n![集合：创建、属性和方法](img/img-f6.39.html)\n\n**图 6.39**\
  \     集合：创建、属性和方法\n\n### 6.6.2 映射\n\n在 JavaScript 中，`Map` 对象用于创建关联数组，我们简称为映射。映射由一组键值对组成，你可以通过使用例如由字符串组成的键来访问各个值。相比之下，对于标准数组（第\
  \ 6.1 节），你使用数字索引来访问各个值。映射具有可用于访问其键和值的属性和方法，并且与集合的属性和方法有一些相似之处。\n\n以下程序展示了涉及映射的一些典型操作：\n\
  \n```\n...\n<body><p>\n   <script> \n\n const m = new Map([[\"Peter\", 31], [\"\
