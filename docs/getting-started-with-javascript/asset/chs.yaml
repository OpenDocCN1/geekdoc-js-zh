  \n## 14.6    贪吃蛇\n\n你可以在 `snake.htm` 文件中找到这个程序。调用程序后，蛇会立即自动在屏幕上移动，你可以使用四个方向键控制它的移动方向，以便蛇能捕捉到它的猎物（参见图\
  \ 14.9）。一旦蛇撞到周围的墙壁，游戏结束。\n\n![蛇与猎物](img/img-f14.9.html)\n\n**图 14.9**     蛇与猎物\n\
  \n一旦蛇到达猎物位置，得分增加一分。然后猎物会出现在一个新的随机位置，蛇再次尝试到达那里。同时，蛇的速度会加快，因此更难控制，随着分数的增加，游戏自然走向终点。\n\
  \n# 15    媒体、绘图与传感器\n\n自 HTML 5 版本发布以来，HTML 提供了额外的功能，这些功能也与 JavaScript 结合使用。\n\n\
  自 HTML 5 版本发布以来，HTML 提供了一些额外的功能，这些功能与 JavaScript 结合也很有趣。这些功能包括音频和视频文件的播放、画布绘图，以及使用移动设备的定位数据、位置和加速度的接收器或传感器。\n\
  \n## 15.1    播放媒体文件\n\n与 HTML 5 版本之前存在的选项相比，`audio` 和 `video` 标签使得播放音频和视频文件变得更加容易。\n\
  \n### 15.1.1    音频文件\n\n在你的文档中，你可以使用 `audio` 标签部署一个音频播放器，它包含一些显示和控制元素：播放/暂停按钮、模拟和数字进度指示器以及音量控制。如果需要，你还可以隐藏音频播放器或通过事件来控制它。\n\
  \n以下是一个包含两个波形音频文件格式（WAV）文件和总共三个音频播放器的示例（参见图 15.1）。\n\n第一个音频播放器可以像平常一样操作，但第二个音频播放器不可见，你只能通过事件和\
  \ JavaScript 来控制它。\n\n第三个播放器展示了更多选项。你可以执行以下操作：\n\n*   暂停或继续播放过程。\n*   从某个特定点继续播放过程。\n\
  *   开启或关闭无限重复。\n*   调整音量。\n*   在两个 WAV 文件之间切换。\n\n![三个音频播放器](img/img-f15.1.html)\n\
  \n**图 15.1**     三个音频播放器\n\n让我们先看文档的下半部分：\n\n```\n...\n<body>\n   <p>音频播放器 1：</p>\n\
  \   <p><audio src=\"guitar.wav\" controls></audio></p>\n   <p> </p>\n\n   <!-- 音频播放器\
  \ 2： -->\n   <audio id=\"idAudioHidden\" src=\"chord.wav\" hidden></audio>\n   <p><input\
  \ id=\"idHidden\" type=\"button\"\n       value=\"播放隐藏的音频播放器\"></p>\n   <p> </p>\n\
  \n   <p>音频播放器 3：</p>\n   <p>\n      <audio id=\"idAudioThree\" src=\"guitar.wav\"\
  \ loop></audio>\n      <input id=\"idPlay\" type=\"button\" value=\"播放\">\n    \
  \  <input id=\"idPause\" type=\"button\" value=\"暂停\">\n      <input id=\"idSet\"\
  \ type=\"button\" value=\"设置到 1.5\">\n      <input id=\"idLoop\" type=\"checkbox\"\
  \ checked=\"checked\"> 循环</p>\n   <p><input id=\"idVolumeUp\" type=\"button\" value=\"\
  音量增大\">\n      <input id=\"idVolumeDown\" type=\"button\" value=\"音量减小\">\n    \
  \  <span id=\"idDisplayThree\">(100%)</span></p>\n   <p><input id=\"idGuitar\" name=\"\
  selection\" type=\"radio\"\n              value=\"Guitar\" checked=\"checked\">\
  \ guitar.wav\n   <input id=\"idChord\" name=\"selection\" type=\"radio\"\n     \
  \      value=\"Chord\"> chord.wav</p>\n\n   <script> \n```\n\n```\n const audioHidden\
  \ =\n         document.getElementById(\"idAudioHidden\");\n      document.getElementById(\"\
  idHidden\").addEventListener\n         (\"click\", function(){audioHidden.play();});\n\
  \n      const audioThree = document.getElementById(\"idAudioThree\");\n      document.getElementById(\"\
  idPlay\").addEventListener\n         (\"click\", function(){audioThree.play();});\n\
  \      document.getElementById(\"idPause\").addEventListener\n         (\"click\"\
  , function(){audioThree.pause();});\n      document.getElementById(\"idSet\").addEventListener\n\
  \         (\"click\", function(){audioThree.currentTime=1.5;});\n      document.getElementById(\"\
  idLoop\").addEventListener\n         (\"click\", function(){audioThree.loop = !audioThree.loop;});\n\
  \      document.getElementById(\"idVolumeUp\").addEventListener\n         (\"click\"\
  , function(){volume(0.2);});\n      document.getElementById(\"idVolumeDown\").addEventListener\n\
  \         (\"click\", function(){volume(-0.2);});\n      document.getElementById(\"\
  idGuitar\").addEventListener\n         (\"click\", function(){change(\"guitar\"\
  );});\n      document.getElementById(\"idChord\").addEventListener\n         (\"\
  click\", function(){change(\"chord\");}); \n```\n\n```\n </script>\n</body></html>\
  \ \n```\n\n**清单 15.1**     `audio.htm` 文件，音频元素和事件处理程序\n\n关于三个音频播放器的一些说明：\n\n*  \
  \ 对于第一个播放器，你使用 `src` 属性的值指定音频文件的名称，并使用 `controls` 属性显示操作元素。\n*   第二个播放器除了 `src`\
  \ 属性外，还有 `hidden` 属性。这确保它虽然存在且可用，但不可见。唯一的 ID 通过 JavaScript 建立了与控制器的连接。\n*   第三个播放器输入了\
  \ `loop` 属性，这会启动无限播放过程。\n\n接下来是一个用于操作隐藏播放器的按钮，并且在 JavaScript 部分设置了指向该播放器的链接。点击“播放隐藏的音频播放器”按钮会调用该播放器的\
  \ `play()` 方法。\n\n总共有五个按钮、一个复选框和一组两个单选按钮，用于操作第三个播放器。在 JavaScript 部分也设置了指向该播放器的引用。点击“播放”和“暂停”按钮会调用\
  \ `play()` 和 `pause()` 方法。你使用 `currentTime` 属性来确定或设置播放过程的当前位置，并使用复选框来激活或停用用于无限重复的布尔属性\
  \ `loop`。\n\n\n\n\n您无法预设音量值。最初，您听到的声音是输出设备（PC、智能手机等）当前设置的音量，这对应于 `volume` 属性的值 1。您通过音量增大和音量减小按钮调用\
  \ `volume()` 函数。改变音量的值作为参数传递，改变后的音量只能在 0 到 1 之间。您使用两个单选按钮来选择要播放的音频文件。\n\n现在，来看文档的上半部分：\n\
  \n```\n... <head> ...\n   <script> \n```\n\n```\n function volume(value)\n     \
  \ {\n         audioThree.volume += value;\n         document.getElementById(\"idDisplayThree\"\
  )\n            .firstChild.nodeValue =\n            \"(\" + (100 * audioThree.volume).toFixed(0)\
  \ + \"%)\";\n      }\n\n      function change(filename)\n      {\n         audioThree.src\
  \ = filename + \".wav\";\n         audioThree.load();\n         audioThree.play();\n\
  \      } \n```\n\n```\n </script>\n</head>\n... \n```\n\n**清单 15.2**     audio.htm\
  \ 文件\n\n您可以在 `volume()` 函数中更改 `volume` 属性的值，这将改变您最初听到的音量百分比，从 100% 变为新的百分比。\n\n\
  在 `change()` 函数中，您通过函数参数为 `src` 属性赋予新值。该属性包含播放器的音频文件名，`load()` 方法加载相应的音频文件，然后您可以通过\
  \ `play()` 播放它。\n\n### 15.1.2    视频文件\n\n您可以使用浏览器中的 `video` 标签播放视频文件。并非所有浏览器都支持所有视频格式，因此将视频文件转换为多种格式并使用\
  \ `source` 标签集成所有格式是合理的。将使用第一个被识别的格式，并且有许多免费软件程序允许您将一种格式转换为另一种格式。\n\n除了在标记 `audio`\
  \ 内容时学到的属性外，还有 `width` 和 `height` 属性，您可以使用它们在加载过程中为视频在网站内预留和定义区域。在 JavaScript 中，您可以使用与音频文件相同的属性。\n\
  \n在图 15.2 中，您可以看到一个短视频的显示。如果视频当前未播放或鼠标光标悬停在视频上，则会显示控制栏。\n\n![带控制栏的视频文件](img/img-f15.2.html)\n\
  \n**图 15.2**     带控制栏的视频文件\n\n以下是程序代码：\n\n```\n...\n<body>\n   <video width=\"400\"\
  \ height=\"300\" controls loop>\n      <source src=\"shadow1.mp4\"\n           \
  \   type='video/mp4; codecs=\"avc1.42E01E, mp4a.40.2\"'>\n      <source src=\"shadow1.ogv\"\
  \n              type='video/ogg; codecs=\"theora, vorbis\"'>\n      <source src=\"\
  shadow1.webm\"\n              type='video/webm; codecs=\"vp8, vorbis\"'>\n   </video>\n\
  </body></html> \n```\n\n**清单 15.3**     video.htm 文件\n\n为视频预留并定义了一个 400×300 像素的区域。一个\
  \ `video` 容器内可以有多个 `source` 标签，每种情况下，您都希望使用 `src` 属性指定正在播放的文件名。\n\n指定 MIME 类型（包括编解码器）有助于浏览器分配文件。编解码器标识模拟视频录制被数字化的过程。\n\
  \n## 15.2    Canvas\n\n`canvas` 标签在网站内创建一个空白画布。然后您可以使用 JavaScript 创建绘图、插入图像或输出格式化文本等。\n\
  \n### 15.2.1    绘图\n\n在图 15.3 中，您可以看到一些绘图元素，每次单击其中一个按钮时都会生成这些元素。您使用“清除”按钮清除画布。\n\
  \n先来看文档的下半部分：\n\n```\n...\n<body>\n   <canvas id=\"idCanvas\" width=\"400\" height=\"\
  300\"\n            style=\"border:solid 1px #000000;\"></canvas>\n   <p><input id=\"\
  idRect\" type=\"button\" value=\"Rectangle\">\n      <input id=\"idArc\" type=\"\
  button\" value=\"Arc\">\n      <input id=\"idLine\" type=\"button\" value=\"Line\"\
  >\n      <input id=\"idClear\" type=\"button\" value=\"Clear\"></p>\n   <p><input\
  \ id=\"idGradientLin\" type=\"button\"\n               value=\"Linear gradient\"\
  >\n      <input id=\"idGradientRad\" type=\"button\"\n               value=\"Radial\
  \ gradient\"></p>\n   <script> \n```\n\n```\n const c = document.getElementById(\"\
  idCanvas\");\n      const ct = c.getContext(\"2d\");\n      ct.fillStyle = \"#f0f0f0\"\
  ;\n      ct.lineWidth = 1;\n      ct.strokeStyle = \"#000000\";\n\n      document.getElementById(\"\
  idRect\").addEventListener(\"click\", rectangle);\n      document.getElementById(\"\
  idArc\").addEventListener(\"click\", arc);\n      document.getElementById(\"idLine\"\
  ).addEventListener(\"click\", line);\n      document.getElementById(\"idClear\"\
  ).addEventListener(\"click\", clear);\n      document.getElementById(\"idGradientLin\"\
  ).addEventListener(\"click\", gLinear);\n      document.getElementById(\"idGradientRad\"\
  ).addEventListener(\"click\", gRadial);\n```\n\n```\n </script>\n</body></html>\
  \ \n```\n\n**清单 15.4**     canvas.htm 文件，下半部分\n\n画布大小为 400×300 像素，周围环绕着细黑边框，以便在页面中更好地可见。然后是六个按钮。\n\
  \n![画布中的图形元素](img/img-f15.3.html)\n\n**图 15.3**     画布中的图形元素\n\n在 JavaScript 部分，变量\
  \ `c` 被引入作为对 `canvas` 元素的引用。`getContext()` 方法返回一个可用于绘图的对象。进行了一些默认设置，这些设置一直适用，直到进行其他设置；之后，新设置生效：\n\
  \n*   `fillStyle` 属性标识对象的填充类型和颜色。默认情况下，对象以黑色均匀填充。此处设置为灰色，但您可以指定图案或渐变（即颜色渐变）。\n\n\
  *   `lineWidth` 属性表示线条粗细。其默认值为 1。\n\n*   `strokeStyle` 属性标识线条样式和颜色。默认情况下，线条以黑色连续绘制，但您可以设置不同的线条类型。\n\
  \n最后，是六个按钮的事件处理程序。\n\n现在来看文档的上半部分，其中包含创建矩形、弧线和线条的函数：\n\n```\n... <head> ...\n  \
  \ <script> \n```\n\n```\n function rectangle()\n      {\n         ct.fillRect(5,\
  \ 25, 75, 100);\n         ct.strokeRect(5, 25, 75, 100);\n      }\n\n      function\
  \ pathArc()\n      {\n         ct.beginPath();\n         ct.arc(150, 75, 50, 0,\
  \ 1.5 * Math.PI);\n         ct.fill();\n         ct.stroke();\n      }\n\n     \
  \ function pathLine()\n      {\n         ct.beginPath();\n         ct.moveTo(225,\
  \ 25);\n         ct.lineTo(300, 50);\n         ct.lineTo(300, 100);\n         ct.lineTo(225,\
  \ 125);\n         ct.fill();\n         ct.stroke();\n      }\n... \n```\n\n**清单\
  \ 15.5**     canvas.htm 文件，上半部分\n\n\n\n\n\n在 `rectangle()` 函数中，你使用 `fillRect()`\
  \ 方法，根据当前设置的填充类型和颜色创建一个填充矩形。前两个参数表示左上角的 x 和 y 坐标，指示该角距离画布左边缘或上边缘的距离。接下来的两个参数指定矩形的宽度和高度值。\n\
  \n`strokeRect()` 方法使用当前设置的线条类型和颜色创建一个空心矩形。参数相同，因此空心矩形构成了填充矩形的边框。\n\n你可以沿路径创建填充或空心的圆弧，或填充或空心的折线。在\
  \ `pathArc()` 函数中，你使用 `beginPath()` 方法初始化路径。\n\n`arc()` 方法创建一个圆弧。前两个参数表示绘制圆弧所围绕的圆心的\
  \ x 和 y 坐标，下一个参数指定圆弧的半径。\n\n最后两个参数指示起始角度和结束角度。角度以弧度为单位，在示例中，起始角度为 0 度。通常，这位于 3 点钟方向，并顺时针旋转到\
  \ 270 度（即 12 点钟方向）。2π 弧度对应 360 度。\n\n`fill()` 方法创建路径的轮廓并填充它，你在路径的起点和终点之间绘制填充。`stroke()`\
  \ 方法仅绘制路径的轮廓。\n\n`pathLine()` 函数中的路径由单独的线段组成，而 `moveTo()` 方法将绘图笔移动到指定 x 和 y 坐标的点。`lineTo()`\
  \ 方法绘制一条连接到指定点的线。\n\n现在，这里是文档的中间部分，包含用于创建渐变和清除画布的函数：\n\n```\n...\n      function\
  \ gLinear()\n      {\n         const gr = ct.createLinearGradient(5, 150, 80, 250);\n\
  \         gr.addColorStop(0.0, \"#000000\");\n         gr.addColorStop(0.5, \"#ffffff\"\
  );\n         gr.addColorStop(1.0, \"#000000\");\n         ct.fillStyle = gr;\n\n\
  \         ct.fillRect(5, 150, 75, 100);\n         ct.fillStyle = \"#f0f0f0\";\n\
  \      }\n\n      function gRadial()\n      {\n         const gr = ct.createRadialGradient(150,\
  \ 200, 0, 150, 200, 50);\n         gr.addColorStop(0.0, \"#000000\");\n        \
  \ gr.addColorStop(0.5, \"#ffffff\");\n         gr.addColorStop(1.0, \"#000000\"\
  );\n         ct.fillStyle = gr;\n\n         ct.beginPath();\n         ct.arc(150,\
  \ 200, 50, 0, 2 * Math.PI);\n         ct.fill();\n\n         ct.fillStyle = \"#f0f0f0\"\
  ;\n      }\n\n      function clear()\n      {\n         ct.clearRect(0, 0, 400,\
  \ 300);\n      } \n```\n\n```\n </script>\n</head>\n... \n```\n\n**清单 15.6**    \
  \ canvas.htm 文件，中间部分\n\n你在 `gLinear()` 函数中生成线性渐变。你必须将渐变想象成一条直线，图形对象的填充颜色沿这条直线变化。`createLinearGradient()`\
  \ 方法的前两个参数表示直线起点的 x 和 y 坐标，接下来的两个参数表示直线终点的 x 和 y 坐标。\n\n该方法返回一个提供对直线访问的对象。`addColorStop()`\
  \ 方法将特定颜色分配给直线上的各个点，第一个参数标识直线上的点。0.0 点代表直线的起点，1.0 点代表直线的终点，0 到 1 之间的所有值都在中间（例如，0.5\
  \ 点位于中点）。\n\n创建渐变后，它被分配给 `fillStyle` 属性作为当前的填充类型和颜色。为了说明颜色渐变，你可以创建一个使用渐变的填充矩形，并选择渐变的坐标，使矩形的左上角位于渐变的起点，右下角位于渐变的终点。然后，你可以为随后创建的图形对象设置不同的填充类型和颜色。\n\
  \n你在 `gRadial()` 函数中创建径向颜色渐变。`createRadialGradient()` 方法需要两个圆的信息：第一个圆标记颜色渐变的起点，第二个圆标记其终点。你使用圆心的\
  \ x 和 y 坐标以及半径依次创建这两个圆。这产生了该方法的六个参数。\n\n为了说明颜色渐变，你可以创建一个使用渐变的圆弧。圆弧从 0 度到 360 度完整绘制，你选择渐变的坐标，使圆弧的圆心位于第一个圆上，圆弧的边缘位于第二个圆上。\n\
  \n### 15.2.2    图像\n\n你可以使用 `drawImage()` 方法在画布中显示图像。你可以按原始大小或缩放将图像添加到绘图中，也可以添加图像的一个部分（参见\
  \ 图 15.4 中的示例）。\n\n![多次显示图像](img/img-f15.4.html)\n\n**图 15.4**     多次显示图像\n\n以下是程序代码：\n\
  \n```\n...\n<body>\n   <canvas id=\"idCanvas\" width=\"400\" height=\"220\"\n  \
  \         style=\"border:solid 1px #000000;\"></canvas>\n   <p><input id=\"idOriginal\"\
  \ type=\"button\" value=\"Original\">\n      <input id=\"idScale\" type=\"button\"\
  \ value=\"Scale\">\n      <input id=\"idSection\" type=\"button\" value=\"Section\"\
  ></p>\n   <script> \n```\n\n```\n const c = document.getElementById(\"idCanvas\"\
  );\n      const ct = c.getContext(\"2d\");\n      const image = document.createElement(\"\
  img\");\n      image.src = \"im_paradise.jpg\";\n\n      document.getElementById(\"\
  idOriginal\").addEventListener\n         (\"click\", function() {ct.drawImage(image,\
  \ 5, 25);} );\n      document.getElementById(\"idScale\").addEventListener\n   \
  \      (\"click\", function()\n         {ct.drawImage(image, 205, 25, 120, 90);}\
  \ );\n      document.getElementById(\"idSection\").addEventListener\n         (\"\
  click\", function()\n         {ct.drawImage(image, 0, 60, 80, 60, 205, 150, 80,\
  \ 60);} ); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 15.7**     canvas_image.htm\
  \ 文件\n\n画布大小为 400 × 220 像素，带有细黑色边框。随后是三个用于创建三个对象的按钮。\n\n在 JavaScript 部分，你通过使用 `createElement()`\
  \ 方法创建一个新的 `img` 类型的 HTML 元素，并将其引用赋给 `image` 变量。图像文件的名称被赋给 HTML 元素的 `src` 属性，但图像尚未添加到文档中。\n\
  \n你可以通过使用 `drawImage()` 方法在文档中显示该 HTML 元素。随后是三个事件处理程序，它们导致对该方法的不同调用。你可以使用三个、五个或九个参数调用该方法，这些参数的作用如下：\n\
  \n*   第一个参数引用要显示的 `img` 类型的 HTML 元素。\n\n*   参数 2 和 3 表示图像左上角的 x 和 y 坐标。\n\n*   参数\
  \ 4 和 5 指定图像的可见宽度和高度。应保持宽高比。\n\n\n\n\n*   如果在调用时传递了九个参数，则参数 2 到 5 会被向后移动。新的参数 2\
  \ 和 3 标记图像中图像部分的左上角，图像部分的大小则跟在参数 4 和 5 中。与之前方法调用中的参数 2 到 5 一样，参数 6 到 9 表示坐标和图像的可见大小。\n\
  \n### 15.2.3 格式化文本\n\n`fillText()` 和 `strokeText()` 方法可在绘图中创建填充或轮廓文本，你可以使用 `textBaseline`\
  \ 属性来定义文本写入的基线（参见 图 15.5 中的示例）。\n\n![集成文本](img/img-f15.5.html)\n\n**图 15.5**    \
  \ 集成文本\n\n我们先来看文档的下半部分：\n\n```\n...\n<body>\n   <canvas id=\"idCanvas\" width=\"\
  400\" height=\"220\"\n           style=\"border:solid 1px #000000;\"></canvas>\n\
  \   <p><input id=\"idFilled\" type=\"button\" value=\"Text filled\">\n      <input\
  \ id=\"idFramed\" type=\"button\" value=\"Text framed\"></p>\n   <script> \n```\n\
  \n```\n const c = document.getElementById(\"idCanvas\");\n      const ct = c.getContext(\"\
  2d\");\n      ct.fillStyle = \"#000000\";\n      ct.lineWidth = 1;\n      ct.strokeStyle\
  \ = \"#000000\";\n      ct.font = \"italic bold 50px Arial\";\n\n      document.getElementById(\"\
  idFilled\").addEventListener(\"click\", filled);\n      document.getElementById(\"\
  idFramed\").addEventListener(\"click\", framed); \n```\n\n```\n </script>\n</body></html>\
  \ \n```\n\n**清单 15.8**     canvas_text.htm 文件，下半部分\n\n开头对线条和填充进行了一些默认设置，正如你在弧线中已经看到的那样。你可以使用\
  \ `font` 属性来定义字体属性。\n\n现在，这是文档的上半部分：\n\n```\n... <head> ...\n   <script> \n```\n\
  \n```\n function filled()\n      {\n         ct.beginPath();\n         ct.moveTo(0,\
  \ 100);\n         ct.lineTo(400, 100);\n         ct.stroke();\n\n         ct.textBaseline\
  \ = \"alphabetic\";\n         ct.fillText(\"Alp\", 10, 100);\n         ct.textBaseline\
  \ = \"top\";\n         ct.fillText(\"Top\", 110, 100);\n         ct.textBaseline\
  \ = \"middle\";\n         ct.fillText(\"Mid\", 210, 100);\n         ct.textBaseline\
  \ = \"bottom\";\n         ct.fillText(\"Bot\", 310, 100);\n      }\n\n      function\
  \ framed()\n      {\n         ct.textBaseline = \"alphabetic\";\n         ct.strokeText(\"\
  Framed\", 10, 200);\n      } \n```\n\n```\n </script>\n</head>\n... \n```\n\n**清单\
  \ 15.9**     canvas_text.htm 文件，上半部分\n\n在 `filled()` 函数中，首先绘制一条基准线以明确文本基线。然后针对文本基线的不同距离使用不同的值，并分别生成一个文字。`fillText()`\
  \ 方法的第一个参数包含输出文本，接下来的两个参数包含第一个字符左下角的位置。\n\n默认的 `alphabetic` 值会使大多数字符恰好位于线上。只有小写字母\
  \ `g`、`j`、`p`、`q` 和 `y` 会向下突出到线下方。使用 `top` 值时，线位于文字上方；使用 `middle` 时，线穿过文字中间；使用 `bottom`\
  \ 时，线位于文字下方。\n\n在 `framed()` 函数中，你使用 `strokeText()` 方法来创建轮廓文本。其参数与 `fillText()`\
  \ 方法相同。\n\n## 15.3 传感器\n\n现代移动设备中的浏览器提供了访问设备传感器数据（用于地理定位、位置和加速度）的选项。确定的值可以使用 JavaScript\
  \ 显示，并用于控制目的。\n\n### 15.3.1 地理定位\n\n你可以使用 `navigator` 对象的 `geolocation` 属性来访问地理定位数据，并可以将这些数据作为数值或在地图上使用。\n\
  \n在下面的 `geolocation.htm` 程序中，时间戳、纬度和经度分别以两种方式输出（参见 图 15.6）。在调用请求你地理定位数据的程序后，程序会首先征求你的同意。\n\
  \n![地理定位数据](img/img-f15.6.html)\n\n**图 15.6**     地理定位数据\n\n### 注意\n\n你可能需要多次调用传感器程序，传感器才会响应并首次提供数据。\n\
  \n你可以将纬度和经度的十进制值输入到 Google 地图的搜索字段中，例如用空格分隔。然后地图上会显示该地理位置。\n\n我们先来看程序的下半部分：\n\n\
  ```\n...\n<body>\n   <div id=\"idInfo\"> </div>\n   <script> \n```\n\n```\n const\
  \ info = document.getElementById(\"idInfo\");\n      if(navigator.geolocation)\n\
  \         navigator.geolocation.getCurrentPosition(receive, error);\n      else\n\
  \         error(); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 15.10**    \
  \ geolocation.htm 文件，下半部分\n\n你使用带有 `idInfo` ID 的 `div` 区域来输出地理定位数据。`info` 变量引用了这个\
  \ `div` 区域。\n\n下一步是检查浏览器是否识别 `geolocation` 属性。在标准情况下，你还会被询问是否允许在运行期间检索地理定位数据。如果浏览器识别该属性并且你同意检索地理定位数据，则使用\
  \ `getCurrentPosition()` 方法请求地理定位数据。两个函数引用作为参数传递。\n\n成功接收到的数据在 `receive()` 函数中输出。如果浏览器不认识该属性，或者你拒绝同意检索地理定位数据，则\
  \ `error()` 函数会抛出错误消息。\n\n这是程序的上半部分：\n\n```\n... <head> ...\n   <script> \n```\n\
  \n```\n function receive(e)\n      {\n         const lat = e.coords.latitude;\n\
  \         const latInteger = parseInt(lat);\n         const latDecimalPlace = (lat\
  \ - latInteger) * 60;\n         const latMinutes = parseInt(latDecimalPlace);\n\
  \         const latSeconds\n            = (latDecimalPlace - parseInt(latDecimalPlace))\
  \ * 60;\n\n         const lng = e.coords.longitude;\n         const lngInteger =\
  \ parseInt(lng);\n         const lngDecimalPlace = (lng - lngInteger) * 60;\n  \
  \       const lngMinutes = parseInt(lngDecimalPlace);\n         const lngSeconds\n\
  \            = (lngDecimalPlace - parseInt(lngDecimalPlace)) * 60;\n\n         const\
  \ time = new Date(e.timestamp);\n         info.innerHTML = \"<p>Timestamp: \" +\
  \ e.timestamp + \"<br>\"\n            + \"Time: \" + time.toUTCString() + \"<br>\"\
  \n            + \"Latitude: \" + lat.toFixed(4)\n            + \" = \" + latInteger\
  \ + \"&deg; \"\n            + latMinutes + \"&prime; \"\n            + latSeconds.toFixed(1)\
  \ + \"&Prime;<br>\"\n            + \"Longitude: \" + lng.toFixed(4)\n          \
  \  + \" = \" + lngInteger + \"&deg; \"\n            + lngMinutes + \"&prime; \"\n\
  \            + lngSeconds.toFixed(1) + \"&Prime;</p>\";\n      }\n\n      function\
  \ error()\n      {\n         info.innerHTML = \"No positioning\";\n      } \n```\n\
  \n```\n </script>\n</head>\n... \n```\n\n**清单 15.11**     geolocation.htm 文件，上半部分\n\
  \n\n\n\n一个包含地理定位数据的对象被传递给 `receive()` 函数。该对象包含 `timestamp` 和 `coords` 属性。`timestamp`\
  \ 可以转换为 `Date` 对象，而 `coords` 属性则包含表示纬度和经度的 `latitude` 和 `longitude` 属性。这些值输出时保留四位小数。\n\
  \n图 15.6 中的示例值中，纬度为正值，经度为负值。这表示北纬（赤道以北）和西经（英国格林尼治以西）。度数带有小数部分，这里将其转换为常见的表示形式：度、分、秒。纬度为\
  \ 0 度时位于赤道，北极位于纬度 90 度，南极位于纬度 –90 度。经度为 0 度时也称为本初子午线，它穿过格林尼治，并且像所有经线一样穿过两极。经度为 180\
  \ 度或 –180 度时，大致穿过新西兰等地，代表国际日期变更线。\n\n下面以 图 15.6 中的示例值 42.2757 度为例，说明如何转换为分和秒。小数部分（`dv`）的计算如下：辅助值\
  \ `x = dv * 60`，`bm = x` 的整数部分，`bs = (x 的小数部分) * 60`。当 `dv = 0.2757` 时：`x = dv *\
  \ 60 = 16.542`，`bm = 16`，`bs = 0.542 * 60 = 32.52`，四舍五入保留一位小数得 32.5（即 42°16'32.5''）。反之，小数度数的十进制部分可计算如下：`(bm\
  \ * 60 + bs) / 3600`。本例结果为 `(16 * 60 + 32.52) / 3600 = 0.2757`。\n\n### 15.3.2 路径追踪\n\
  \n你可以利用收集到的地理定位数据来确定步行、骑行或驾车所经路线的时间与地理轨迹。在本书的可下载资料中，你将找到 `waytracking.htm` 程序作为附加内容，其中包含大量解释性注释。\n\
  \n除了你在 第 15.3.1 节 中已经了解的数据外，你还可以使用 `coords.altitude` 子属性来记录海拔高度。该程序也考虑了移动设备可能无法记录该值的情况。\n\
  \n点击“开始”按钮后，每五秒记录一次地理定位数据，并将其作为新行添加到表格中。点击“停止”按钮后，记录和输出将结束。你可以在 图 15.7 中看到表格的标题。\n\
  \n![路径追踪表格标题](img/img-f15.7.html)\n\n**图 15.7** 路径追踪表格标题\n\n特别是在低速、海拔变化小且检测频繁的情况下，测定的值可能与实际值略有偏差。经验表明，随着距离增加，偏差会趋于平均。\n\
  \n以下是表格列的描述：\n\n*   纬度（度）：`coords.latitude` 属性\n*   经度（度）：`coords.longitude` 属性\n\
  *   单段距离（米）：当前检测点与前一检测点之间的大圆距离（见下文）\n*   总距离（米）：各段路径之和\n*   时间（时、分、秒）：`timestamp`\
  \ 属性\n*   单段时间（秒）：当前检测点与前一检测点的时间差\n*   总时间（秒）：当前检测点与第一个检测点的时间差\n*   单段速度（米/秒）：单段距离除以单段时间\n\
  *   总速度（米/秒）：总距离除以总时间\n*   海拔（米）：`coords.altitude` 属性\n*   单段海拔差（米）：当前检测点与前一检测点的海拔差\n\
  *   总上升（米）：各段海拔差中正值（至少 1 米）的总和\n*   总下降（米）：各段海拔差中负值（至少 1 米）的总和\n\n大圆是球面上两点之间的最短路径。转换的源代码可在\
  \ [`en.wikipedia.org/wiki/Great-circle_distance`](https://en.wikipedia.org/wiki/Great-circle_distance)\
  \ 找到。\n\n单段时间的平均值约为五秒。各个值会有波动，尤其是在开始时，因为尝试记录数据与实际接收数据之间存在不同的时间差。\n\n总速度在一段时间后会稳定在恒定速度附近。由于记录的不准确性，我决定在计算总上升和总下降时只考虑超过\
  \ 1 米的海拔差。\n\n### 注意\n\n请确保在自动检测结束前，你的移动设备屏幕不会因你不再操作而关闭。否则可能导致无法继续记录数据。\n\n### 15.3.3\
  \ 位置传感器\n\n你可以使用 `DeviceOrientationEvent` 对象来处理 `deviceorientation` 事件。这允许移动设备中的位置传感器检测并接收方向变化。位置传感器的工作原理示例如下：如果你旋转移动设备，屏幕会在竖屏和横屏模式之间切换。\n\
  \n然后你可以输出变化后的位置数据，也可以进一步处理这些数据。例如，你可以将其用于游戏和模拟。在下面的 `orientation.htm` 程序中，你可以看到一个简单的进一步处理，用于控制屏幕上的对象（参见\
  \ 图 15.8）。\n\n位置信息包含三个值：`alpha`、`beta` 和 `gamma` 角度。`alpha` 角表示移动设备纵轴与北极之间的夹角（参见\
  \ 图 15.9）。该值范围在 0 到 360 度之间。\n\n![位置数据、输出与控制](img/img-f15.8.html)\n\n**图 15.8**\
  \ 位置数据、输出与控制\n\n![移动设备纵轴](img/img-f15.9.html)\n\n**图 15.9** 移动设备纵轴\n\n为了说明这些角度，最好先将移动设备平放在面前的桌子上。然后执行以下操作：\n\
  \n*   如果移动设备仍平放在桌子上，你转动它，`alpha` 角会发生变化。在 0 度或 360 度时，移动设备的纵轴指向北极。\n*   如果你将移动设备的上边缘向上抬起，直到它直立在你面前，你会注意到\
  \ `beta` 角从 0 度缓慢变化到 90 度。对移动设备的下边缘做同样的操作（即将其朝远离你的方向倾斜，直到完全倒置），`beta` 角会从 0 度变化到\
  \ –90 度。总体而言，该角度的可能取值范围为 –180 度到 +180 度。\n\n\n\n\n*   如果抬起左边缘并将移动设备向侧面倾斜，`gamma`\
  \ 角会从 0 度变为 90 度，而抬起右边缘则会使 `gamma` 角从 0 度变为 –90 度。同样，这里也可能出现从 –180 度到 +180 度的总值。\n\
  \n此外，在 `orientation.htm` 程序中，当设备倾斜时，深色方块会在浅色矩形内部移动。因此，位置数据的变化被用来移动一个对象。\n\n让我们看看程序的下半部分：\n\
  \n```\n...\n<body>\n   <table>\n      <tr><td>alpha</td><td><input id=\"idAlpha\"\
  \n         style=\"text-align:right; width:100px;\" readonly></td></tr>\n      <tr><td>beta</td>\
  \ <td><input id=\"idBeta\"\n         style=\"text-align:right; width:100px;\" readonly></td></tr>\n\
  \      <tr><td>gamma</td><td><input id=\"idGamma\"\n         style=\"text-align:right;\
  \ width:100px;\" readonly></td></tr>\n   </table>\n   <div style=\"position:absolute;\
  \ top:300px; left:50px;\n        width:800px; height:350px; background-color:#e0e0e0;\"\
  ></div>\n   <div id=\"idRect\" style=\"position:absolute; top:300px; left:200px;\n\
  \        width:200px; height:200px; background-color:#b0b0b0;\"></div>\n   <script>\
  \ \n```\n\n```\n const rect = document.getElementById(\"idRect\");\n      if(DeviceOrientationEvent)\n\
  \         addEventListener(\"deviceorientation\", position, false); \n```\n\n```\n\
  \ </script>\n</body></html> \n```\n\n**清单 15.12**     orientation.htm 文件，下半部分\n\n\
  这里有一个包含三个只读输入字段的表格，用于输出位置数据，还有用于深色方块和浅色矩形的 `div` 区域，它们位于表格下方。\n\n系统会检查浏览器是否识别 `DeviceOrientationEvent`\
  \ 对象。如果识别，则会为 `window` 对象注册一个 `deviceorientation` 事件的事件监听器。因此，当位置发生变化时，会调用 `position()`\
  \ 函数。\n\n以下是程序的上半部分：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n let moveReference,\
  \ pTop = 300, pLeft = 200;\n\n      function position(e)\n      {\n         clearTimeout(moveReference);\n\
  \         document.getElementById(\"idAlpha\").value = Math.round(e.alpha);\n  \
  \       document.getElementById(\"idBeta\").value = Math.round(e.beta);\n      \
  \   document.getElementById(\"idGamma\").value = Math.round(e.gamma);\n        \
  \ move(e.beta, e.gamma);\n      }\n\n      function move(b,g)\n      {\n       \
  \  if(b > 3 && pTop < 450)       pTop += 5;\n         else if(b < -3 && pTop > 300)\
  \ pTop -= 5;\n         rect.style.top = pTop + \"px\";\n\n         if(g > 3 && pLeft\
  \ < 650)      pLeft += 5;\n         else if(g < -3 && pLeft > 50) pLeft -= 5;\n\
  \         rect.style.left = pLeft + \"px\";\n\n         moveReference = setTimeout(function()\
  \ { move(b,g); }, 50);\n      } \n```\n\n```\n </script>\n</head>\n... \n```\n\n\
  **清单 15.13**     orientation.htm 文件，上半部分\n\n要改变深色方块的位置，首先需要将位置的初始值存储在 `pTop` 和 `pLeft`\
  \ 变量中。\n\n此外，引入了一个变量作为时间控制过程的引用。这个引用有什么用呢？\n\n`deviceorientation` 事件仅在位置发生变化时触发，因此如果你倾斜移动设备然后保持倾斜状态，事件将不再发生。然而，深色方块应该继续按照物理规律移动。因此，每次位置变化时，都会启动一个时间控制过程，持续移动直到新的位置变化发生。只有新的位置变化才会以同样的方式被评估。\n\
  \n一个包含位置数据的对象被传递给 `position()` 函数，该对象包含 `alpha`、`beta` 和 `gamma` 属性。然后，当前移动的计时器被删除，调用\
  \ `move()` 函数，并将 `beta` 和 `gamma` 角度传递给 `move()` 函数。\n\n`move()` 函数检查设备是否在四个可能方向中的至少一个方向上倾斜了三度。这可以补偿手部的小抖动，并且你有机会通过将移动设备保持水平来停止深色方块的移动。其次，该函数检查深色方块是否已经到达浅色矩形的边缘。它不应该移动到边缘之外。\n\
  \n如果检查通过，深色方块会移动五个像素。然后，该函数在 50 毫秒后使用相同的位置数据再次调用自身，以便移动平滑地继续。如果在此期间移动设备被置于不同的位置，`position()`\
  \ 函数中的时间控制过程会终止，并启动新的位置变化。\n\n### 15.3.4    加速度传感器\n\n你可以使用 `DeviceMotionEvent`\
  \ 对象，它处理 `devicemotion` 事件。这允许测量加速度（即速度的变化）。\n\n你可以输出这些加速度数据并进一步处理（例如，用于游戏或模拟）。在下面的\
  \ `motion.htm` 程序中，屏幕上的一个对象被控制（参见图 15.10），但所需的移动设备动作与处理位置数据时不同。\n\n![加速度数据、最大值和控制](img/img-f15.10.html)\n\
  \n**图 15.10**     加速度数据、最大值和控制\n\n### 关于物理的说明\n\n如果一个物体沿某个方向运动，它具有以米/秒为单位的速度。如果这个速度发生变化（例如，当车辆启动或刹车时），这被称为加速度，它对应于单位时间内速度的变化，并以米/秒²（我们写作\
  \ m/s²）为单位。\n\n如果你以恒定速度沿某个方向移动你的移动设备，则不会产生加速度。传感器只测量加速度，并在移动设备停止或开始运动时触发 `devicemotion`\
  \ 事件。\n\n地球上所有物体都因重力而不断向地心加速。为简单起见，这种加速度也被称为重力加速度，其在地球表面的标准值约为 9.81 m/s² = 1 g。这解释了\
  \ `z` 的值。\n\n在图 15.10 中，你可以看到 `x`、`y`、`z`、`alpha`、`beta` 和 `gamma` 的值。为了澄清这些值，最好先将你的移动设备平放在光滑表面的桌子上，然后执行以下操作：\n\
  \n*   在桌子上快速向右移动设备，然后减速直至停止。在过程开始时，会短暂测量到一个正的 `x` 值，而在结束时则短暂测量到一个负的 `x` 值。\n\n\n\
  \n\n*   在桌面上将设备快速远离自己，然后减速直至停止。过程开始时，会短暂测量到正的 `y` 值，结束时则短暂测量到负的 `y` 值。\n*   拿起设备，快速向上举向天花板，然后减速直至停止。在序列开始时，由于施加的加速度与重力加速度叠加，会短暂测量到大于\
  \ 9.81 的 `z` 值；结束时，会短暂测量到小于 9.81 的 `z` 值。\n\n这些加速度用于改变浅色矩形中深色方块的位置和大小。\n\n在 `x`\
  \ 和 `y` 方向上，由于程序设定，方块表现出滞后的行为。当你在桌面上快速向右移动设备并减速直至停止时，方块最初会向左移动，因为它似乎无法快速跟上加速度；结束时，它会向右移动，因为它似乎无法快速减速。当你快速向上举起设备并减速直至停止时，方块在过程开始时变小，结束时又变大。\n\
  \n### 关于物理的补充说明\n\n物体在某个方向上的速度和加速度也被称为轨道速度和轨道加速度，因为物体沿轨道运动。与之相对的是角速度和角加速度，分别以度每秒和度每平方秒为单位测量。\n\
  \n移动设备可以测量角加速度。为了明确这一参数，将设备平放在面前的桌子上。在设备仍平放时旋转它，会导致 `gamma` 角产生加速度；快速抬起设备的上边缘，会导致\
  \ `alpha` 角产生加速度；快速抬起设备的侧边缘，会导致 `beta` 角产生加速度。\n\n这六种加速度都只持续很短的时间，因此程序中会永久显示它们的最大值。\n\
