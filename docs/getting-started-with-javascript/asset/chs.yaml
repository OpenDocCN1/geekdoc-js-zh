  \ 的循环依赖于在循环结束时检查的条件。与 `while` 循环不同，此循环至少执行一次。\n以下程序包含一个心算任务。两个介于 1 到 20 之间的随机数需要相加，程序会提示你，直到输入正确的结果。\n\
