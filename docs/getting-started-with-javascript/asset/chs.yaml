  \n前面示例中类的属性可以通过简单的赋值来复制，因为它们具有简单的数据类型，例如字符串、数字或布尔值。在这种情况下，浅拷贝就足够了。\n\n然而，如果某个属性具有非简单数据类型，例如字段或对象，则必须进行深拷贝。深拷贝涉及将字段中所有元素的值复制到新字段，或者将对象的属性值复制到新对象。\n\
