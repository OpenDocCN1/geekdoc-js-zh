  \ 文件\n\n主菜单项和子菜单都位于具有以下属性的 `div` 容器中：\n\n*   尺寸为 200 × 20 像素\n\n\n\n\n\n*   一条上边缘和一条下边缘\n\
  *   浅灰色背景\n*   距边缘五像素的内边距\n\n子菜单的属性通过 `sub` 类进行添加或覆盖：高度改为 60 像素，移除顶部边框，最重要的是，它们不可见。\n\
  \n子菜单中的菜单项是超链接，可用于调用其他页面等。对于这些超链接，定义了以下属性：文本颜色为黑色，无下划线。当鼠标悬停在某个超链接上时，背景颜色会发生变化。\n\
  \n菜单和子菜单在文档中相互定位，并且 `sub` 类被分配给子菜单。\n\n当鼠标悬停在某个主菜单项上时，会调用 `subOn()` 函数，并传递参数 1 或\
  \ 2。在 `subOn()` 函数内部，将对应子菜单的 `style` 属性的 `visibility` 子属性设置为 `visible`。\n\n相反，当鼠标离开某个主菜单项时，会调用\
  \ `subOff()` 函数，并传递相同的参数。在 `subOff()` 函数内部，将对应子菜单的 `style` 属性的 `visibility` 子属性设置为\
  \ `hidden`。\n\n悬停或离开某个子菜单会产生相同的结果。否则，一旦鼠标从关联的主菜单项移动到子菜单，相关的子菜单就会消失。\n\n位置的选择使得子菜单略微重叠主菜单项。否则，一旦鼠标离开关联的主菜单项，子菜单就会变得不可见。\n\
  \n### 8.3.3 动画投掷\n\n在本节的可下载资料中，你可以找到 `css_throw.htm` 程序，其中包含许多解释性注释作为额外内容。该程序让你模拟向目标投掷球。\n\
  \n为此，你可以调整投掷与地面的角度以及球在投掷开始时的速度。程序考虑了重力的影响，使球的轨迹呈抛物线状。你还可以将目标放置在固定或随机位置（参见图 8.21）。\n\
  \n球在 `time` 之后在 x 和 y 方向上的 `轨迹` 由两个物理公式确定（另请参见 [`en.wikipedia.org/wiki/Projectile_motion`](https://en.wikipedia.org/wiki/Projectile_motion)）：\n\
  \n```\nsx(t) = s0 + v0 * cos(w) * t\nsy(t) = s0 + v0 * sin(w) * t + 0.5 * a0 * t\
  \ * t \n```\n\n![向目标投掷球](img/img-f8.21.html)\n\n**图 8.21**     向目标投掷球\n\n以下是物理公式中各个项的更多信息：\n\
  \n*   `s[0]` 是投掷开始时的轨迹。该轨迹对应于起点的坐标。\n*   `v[0]` 是投掷开始时的速度（即输入字段中设置的速度）。速度在 x 方向和\
  \ y 方向上的分量可以根据角度 `w` 使用余弦和正弦计算。角度在输入字段中设置。\n*   `a[0]` 是投掷开始时的加速度，取决于重力。它只存在于 y\
  \ 方向。\n\n公式中的表达式在程序中赋予了因子，以使运动看起来更自然。\n\n# 9 使用 SVG 的二维图形和动画\n\n你可以使用 SVG 在浏览器中显示二维矢量图形和动画。\n\
  \n可缩放矢量图形（SVG）是一种基于 XML 的语言格式，可用于创建二维矢量图形。你可以通过描述创建矢量图形；它占用很少的存储空间，并且可以轻松更改而不会损失任何质量（例如，关于其位置、大小或旋转）。\n\
  \nSVG 可以包含动画，并且无需额外程序即可在现代浏览器中显示。使用 JavaScript 和你在第 5 章中学到的 DOM，你可以访问、更改或添加 SVG\
  \ 的各个元素。\n\n你可以将 SVG 代码直接嵌入到 HTML 代码中，或者将其保存在单独的 SVG 文件中，该文件提供一个（可能带有动画的）图像，你可以使用\
  \ `object` HTML 标签将其作为多媒体对象插入到不同 HTML 文档的任何位置。本章仅展示 SVG 广泛可能性的一部分。\n\n本章中的程序基于 SVG\
  \ 1.1 标准，该标准由万维网联盟（W3C）于 2011 年 8 月发布。自 2016 年 9 月起，已有 SVG 2 标准的草案，但迄今为止，各浏览器仅部分实现了该标准。\n\
  \n## 9.1 创建 SVG 文件\n\n在本节中，我们将创建第一个 SVG 文件并将其嵌入到 HTML 文档中。该 SVG 有一个用于说明的边框，并在特定位置包含一个黑色矩形（参见图\
  \ 9.1）。\n\n![带有 SVG 的 HTML 文档](img/img-f9.1.html)\n\n**图 9.1**     带有 SVG 的 HTML\
  \ 文档\n\n以下是 SVG 文件的代码：\n\n```\n<svg xmlns=\"https://www.w3.org/2000/svg\" width=\"\
  400\" height=\"150\">\n   <!-- 矩形 -->\n   <rect x=\"50\" y=\"20\" width=\"100\"\
  \ height=\"50\" />\n</svg> \n```\n\n**清单 9.1**     `svg_insert.svg` 文件\n\n`svg`\
  \ 标签引入 SVG 代码。根据第 5 章中的 DOM，此标签是根节点，所有子节点（图形元素）都嵌入其中。子节点又可以拥有子节点，依此类推，每个节点也可以拥有属性节点。\n\
  \n`xmlns` 属性使用指定的值定义所使用的 SVG 元素来自的 XML 命名空间，`width` 和 `height` 属性确定图形的宽度和高度（以像素为单位）。注释的创建方式与\
  \ HTML 相同，使用 `<!--` 和 `-->`。\n\n如果 SVG 元素没有子元素（即没有子节点），则不需要结束标签。在这种情况下，开始标签必须以 `/>`\
  \ 结束。子元素可以是例如引用该 SVG 元素的动画。\n\n`rect` 标签创建一个矩形，通过其左上角的 x 和 y 坐标进行定位。这些值相对于图形的左上角，矩形的大小通过\
  \ `width` 和 `height` 属性定义。如果没有提供更多信息，SVG 元素将被填充并显示为黑色。\n\n现在，以下是 HTML 文件的代码：\n\n\
  ```\n...\n<body>\n   <p>SVG 图形上方</p>\n   <p><object data=\"svg_insert.svg\" type=\"\
  image/svg+xml\"\n         width=\"400\" height=\"150\" style=\"border:1px solid\
  \ black;\">\n      此处为 SVG 图形\n   </object></p>\n   <p>SVG 图形下方</p>\n</body></html>\
  \ \n```\n\n**清单 9.2**     `svg_insert.htm` 文件\n\n你可以通过使用 `object` HTML 标签将 SVG 文件作为多媒体对象插入到\
  \ HTML 文档中。你也可以使用 `img` HTML 标签，但那样的话，现有的动画将不会执行。\n\n\n\n\n`data`属性引用 SVG 文件，`type`属性指文件类型。`width`和`height`属性定义\
  \ HTML 文档中多媒体对象的大小，此处为了清晰起见，添加了细黑边框。只有当浏览器无法显示 SVG 图形时，“这是一个 SVG 图形”文本才可见。\n\n##\
  \ 9.2 基本形状\n\n第一个基本形状显示在`svg_basic_shapes.htm`文件中：矩形（见图 9.2）、圆形和椭圆（见图 9.3）以及线条、折线和多边形（见图\
  \ 9.4）。\n\n在本章及本章其他示例中，SVG 代码直接嵌入在 HTML 代码中。你可以利用第 9.1 节学到的知识，将所有图形的 SVG 代码保存下来，也可以保存在单独的\
  \ SVG 文件中。\n\n### 9.2.1 矩形\n\n以下是图 9.2 中矩形的代码：\n\n```\n...\n<body>\n   <svg xmlns=\"\
  https://www.w3.org/2000/svg\" width=\"600\"\n         height=\"300\" style=\"border:1px\
  \ solid black;\">\n      <rect x=\"50\"  y=\"20\" width=\"100\" height=\"50\" />\n\
  \      <rect x=\"200\" y=\"20\" width=\"100\" height=\"50\" rx=\"10\" ry=\"10\"\n\
  \         fill=\"#bbbbbb\" stroke=\"#000000\" stroke-width=\"2\" />\n      <rect\
  \ x=\"350\" y=\"20\" width=\"100\" height=\"50\" />\n      <rect x=\"355\" y=\"\
  25\" width=\"50\"  height=\"25\" fill=\"#ffffff\" />\n...\n   </svg>\n</body></html>\
  \ \n```\n\n**清单 9.3**     `svg_basic_shapes.htm`文件、结构和矩形\n\n![矩形](img/img-f9.2.html)\n\
  \n**图 9.2**     矩形\n\nSVG 容器嵌入在 HTML 文档的`body`中，并且可以被其他 HTML 标签和文本包围。选择图形大小为 600×300\
  \ 像素，边框线直接分配给 SVG 元素。\n\n我们在第 9.1 节中描述了如何创建一个简单的黑色矩形。\n\n通过使用`rx`和`ry`属性，你可以给第二个矩形添加圆角。你可以使圆角在\
  \ x 和 y 方向上不同，并且可以使用`fill`属性为 SVG 元素定义填充颜色。在我们的示例中，颜色是灰色，但默认颜色是黑色。\n\n`stroke`属性定义\
  \ SVG 元素边框线的颜色（此处为黑色），并确保其显示。SVG 元素的边框线默认宽度为 1 像素；你可以使用`stroke-width`属性选择 2 像素的值。\n\
  \n一个 SVG 元素可以完全或部分覆盖先前在代码中创建的另一个 SVG 元素。小的白色矩形覆盖了大黑色矩形的一部分。\n\n### 9.2.2 圆形和椭圆\n\
  \n现在，以下是图 9.3 中圆形和椭圆的代码：\n\n```\n... \n      <circle cx=\"80\"  cy=\"130\" r=\"\
  30\" />\n      <circle cx=\"180\" cy=\"130\" r=\"30\" stroke=\"#000000\"\n     \
  \    stroke-width=\"2\" fill=\"#bbbbbb\" />\n      <circle cx=\"280\" cy=\"130\"\
  \ r=\"30\" />\n      <circle cx=\"295\" cy=\"130\" r=\"30\" fill=\"#ffffff\" />\n\
  \n      <ellipse cx=\"400\" cy=\"130\" rx=\"60\" ry=\"30\"/>\n... \n```\n\n**清单\
  \ 9.4**     `svg_basic_shapes.htm`文件、圆形和椭圆\n\n![圆形和椭圆](img/img-f9.3.html)\n\n**图\
  \ 9.3**     圆形和椭圆\n\n`circle`标签创建一个圆形，你使用`cx`和`cy`属性定位其中心的 x 和 y 坐标。通过使用`r`属性定义半径来确定圆形的大小，如果不做进一步输入，该\
  \ SVG 元素也将被填充为黑色，如第一个圆形所示。\n\n为第二个圆形定义了填充颜色以及边框线的颜色和线宽。\n\n通过用一个白色圆形覆盖黑色圆形的右侧部分，创建了“月牙”。\n\
  \n`ellipse`标签创建一个椭圆。与圆形一样，你使用`cx`和`cy`属性定位椭圆中心的坐标。椭圆有两个半径，你通过`rx`属性确定 x 方向的半径，通过`ry`属性确定\
  \ y 方向的半径。如果两个半径相同，那么椭圆实际上就是一个圆形。\n\n### 9.2.3 线条、折线和多边形\n\n以下是图 9.4 中线条、折线和多边形的代码：\n\
  \n```\n... \n      <line x1=\"20\" y1=\"190\" x2=\"20\" y2=\"250\"\n           \
  \ stroke=\"#000000\" stroke-width=\"2\" />\n\n      <polyline points=\" 50,250 \
  \ 80,190 110,250\" />\n      <polyline points=\"150,250 180,190 210,250\"\n    \
  \     stroke=\"#000000\" stroke-width=\"2\" fill=\"none\" />\n      <polyline points=\"\
  250,250 280,190 310,250\"\n         stroke=\"#000000\" stroke-width=\"2\" fill=\"\
  #bbbbbb\" />\n\n      <polygon points=\"350,250 380,190 410,250\"\n         stroke=\"\
  #000000\" stroke-width=\"2\" fill=\"#bbbbbb\" />\n... \n```\n\n**清单 9.5**     `svg_basic_shapes.htm`文件、线条、折线和多边形\n\
  \n`line`标签创建一条从`x1`、`y1`开始到`x2`、`y2`结束的线条。`stroke`属性定义线条的颜色并确保其显示。默认情况下，线条宽度为 1\
  \ 像素，但你可以使用`stroke-width`属性选择 2 像素的值。\n\n![线条、折线和多边形](img/img-f9.4.html)\n\n**图\
  \ 9.4**     线条、折线和多边形\n\n折线是一组线条，你将各个点（每个点由一对 x 和 y 坐标指定）相互连接起来形成折线。多边形也是一组线条，区别在于最后一个点与第一个点相连，从而使折线闭合。在这个程序中，你总是将三个点相互连接形成一个三角形，该三角形可以是折线或多边形。\n\
  \n`polyline`标签创建折线，`polygon`标签创建多边形。你使用`points`属性定位各个点，并依次指定 x 和 y 坐标对。允许使用空格和逗号作为分隔符，为了清晰起见，我建议用逗号分隔一对中的\
  \ x 和 y 坐标。不同的坐标对之间应该用空格分隔。\n\n如果不输入更多信息，该 SVG 元素也会被填充为黑色，如第一个折线所示。\n\n如果折线或多边形不应该被填充，你必须指定`fill`属性为`none`值。在这种情况下，你应该使用`stroke`属性，以便折线或多边形可见，就像第二个折线一样。\n\
  \n第三个折线有灰色填充，并且独立地有黑色边框。\n\n\n\n\n最右侧的多边形构造方式与相邻的第三条折线类似，但第三个点会自动连接到第一个点，从而使线条闭合。\n\
  \n如果一条折线只包含两个点，或者折线的所有点都位于同一条直线上，则不会形成区域。在这种情况下，无法进行填充，并且如果未为此类线条的 `stroke` 属性输入值，则线条将完全不可见。这也适用于路径（第\
  \ 9.3 节）。\n\n## 9.3 路径\n\n路径是一种线条，它不仅可由直线组成，还可由曲线组成。路径也可以中断，你可以使用在图形上移动的绘图笔创建各种线条形状。你可以从路径创建所有基本形状。\n\
  \n你可以使用绝对坐标或相对坐标创建路径的元素：\n\n*   绝对坐标由大写字母的规范引入，与之前已知的元素一样，它们参考图形左上角的零点。\n*   相对坐标由小写字母的规范引入，它们参考路径的前一个元素。它们通常比绝对坐标更容易处理。\n\
  \n你可以像基本形状一样用颜色填充路径。`svg_path.htm` 文件包含一些示例。\n\n### 9.3.1 填充的路径\n\n首先，我们来看一下图 9.5\
  \ 中四个填充路径的代码：\n\n```\n...\n<body>\n   <svg xmlns=\"https://www.w3.org/2000/svg\"\
  \ width=\"600px\"\n         height=\"250px\" style=\"border:1px solid black;\">\n\
  \      <path d=\"M  50,20 L 80,50 L 80,80 L 50,80\" />\n      <path d=\"M 120,20\
  \ L 150,50 V 80 H 120\" />\n      <path d=\"M 190,20 l 30,30 l 0,30 l -30,0\" />\n\
  \      <path d=\"M 260,20 l 30,30 v 30 h -30\" />\n...\n   </svg>\n</body></html>\
  \ \n```\n\n**清单 9.6** `svg_path.htm` 文件，填充的路径\n\n![填充的路径](img/img-f9.5.html)\n\n\
  **图 9.5** 填充的路径\n\n`path` 标签创建一条路径，你使用 `d` 属性定位各个点。`d` 属性的值中可以出现以下规范：\n\n*   `M`，表示移动到：此规范将绘图笔移动到下一对绝对坐标，而不绘制线条。可用于实现线条的中断。\n\
  *   `m`：此规范与 `M` 类似，但将绘图笔移动到下一对相对坐标。\n*   `L`，表示画线到：此规范绘制一条线到下一对绝对坐标。\n*   `l`：此规范与\
  \ `L` 类似，但绘制一条线到下一对相对坐标。\n*   `V`，表示垂直：此规范绘制一条垂直线到下一个绝对 y 坐标。\n*   `v`：此规范与 `V`\
  \ 类似，但绘制一条垂直线到下一个相对 y 坐标。正值将绘图笔向下移动，负值将其向上移动。\n*   `H`，表示水平：此规范绘制一条水平线到下一个绝对 x 坐标。\n\
  *   `h`：此规范与 `H` 类似，但绘制一条水平线到下一个相对 x 坐标。正值将绘图笔向右移动，负值将其向左移动。\n\n四个填充路径外观相同，但结构不同：\n\
  \n*   第一个路径使用 `M` 或 `L` 使用绝对坐标。\n*   第二个路径使用 `M`、`L`、`V` 和 `H` 使用绝对坐标。\n*   第三个路径使用\
  \ `M` 作为起点，使用 `l` 作为后续的相对坐标。\n*   第四个路径使用 `M` 作为起点，使用 `l`、`v` 和 `h` 作为后续的相对坐标。\n\
  \n第四个路径比之前的路径更易读。如果未输入更多信息，此 SVG 元素也会被填充并显示为黑色。\n\n### 9.3.2 组和路径\n\n以下是图 9.6 中组和三个未填充路径的代码：\n\
  \n```\n...\n      <g stroke=\"#000000\" stroke-width=\"2\" fill=\"none\">\n    \
  \     <path d=\"M 330,20 l 30,30 v 30 h -30\" />\n         <path d=\"M 400,20 l\
  \ 30,30 v 30 h -30 z\" />\n         <path d=\"M 470,20 l 30,30 m 0,30 h -30\" />\n\
  ...\n      </g>\n... \n```\n\n**清单 9.7** `svg_path.htm` 文件，未填充的路径和组\n\n![未填充的路径](img/img-f9.6.html)\n\
  \n**图 9.6** 未填充的路径\n\n你使用 `g` 标签对要分配共同属性和值的元素进行分组。`fill` 属性的 `none` 值表示此组中的三个未填充路径和其他元素不会被填充。你使用\
  \ `stroke` 属性使折线可见。这三个路径结构相似，但存在细微差别：\n\n*   第一个路径使用 `M` 作为起点，使用 `l`、`v` 和 `h` 作为后续的相对坐标。\n\
  *   第二个路径以 `z` 规范结束，你使用它来闭合折线（即，从最后一个元素连接到起点）。\n*   在第三个路径中，你使用了一次 `m` 规范而不是 `v`\
  \ 规范。这确保笔移动到下一个点而不绘制线条，因此路径显示为中断。然而，它仍然是一个逻辑上连续的路径。\n\n### 9.3.3 带曲线的路径\n\n带曲线的路径结构复杂。有椭圆弧以及二次和三次贝塞尔曲线。在本介绍中，我将只讨论椭圆弧。\n\
  \n以下是图 9.7 中路径的代码，该路径总共包含三条曲线：\n\n```\n...\n      <g stroke=\"#000000\" stroke-width=\"\
  2\" fill=\"none\">\n...\n         <path d=\"M 50,120\n                  v 60\n \
  \                 a 30,30 0 0 0 60,0\n                  v -30\n                \
  \  a 30,30 0 0 1 30,-30\n                  h 60\n                  a 30,30 0 1 1\
  \ -30,30\" />\n      </g>\n... \n```\n\n**清单 9.8** `svg_path.htm` 文件，带曲线的路径\n\n\
  ![带曲线的路径](img/img-f9.7.html)\n\n**图 9.7** 带曲线的路径\n\n为了清晰起见，`d` 属性的各个条目被上下排列。`A`\
  \ 或 `a` 规范创建一条椭圆弧。总共需要七个值：\n\n\n\n\n\n*   椭圆在 `x` 和 `y` 方向上的两个半径（另请参见第 9.2.2 节）。为简化起见，三个椭圆的两个半径值均选择相同，因此曲线呈圆形。\n\
  \n*   弧线绕 `x` 方向的旋转角度，以度为单位。这指定了弧线绕其 `x` 轴倾斜的度数。为简化起见，所有三条曲线均选择值 0，因此没有曲线发生倾斜。\n\
  \n*   一个值，用于确定弧线是从起点到终点沿短路径（值 = 0）还是长路径（值 = 1）绘制。此处，仅对第三条弧线选择长路径，以便它跨越四分之三的弧线绘制。\n\
  \n*   一个值，用于定义旋转方向（即弧线从起点到终点是逆时针 [值 = 0] 还是顺时针 [值 = 1] 运行）。此处，第二条和第三条曲线顺时针运行。\n\n\
  *   弧线终点的绝对（使用 `A` 的弧线）或相对（使用 `a` 的弧线）坐标。\n\n## 9.4 动画\n\n你可以使用动画更改 SVG 元素的属性。如同电影一样，这涉及位置、大小、颜色、透明度或其他属性的连续变化。\n\
  \n你可以确定动画的开始时间和持续时间。动画可以针对一个或多个 SVG 元素同时或顺序运行，并且可以由特定事件触发并按需重复。\n\n### 9.4.1 过程\n\
  \n`svg_animation.htm` 文件包含一些动画示例。首先，你会看到两个带有灰色填充的矩形（参见图 9.8）。短暂时间后，第一个矩形的动画开始。它向下移动，然后移回起始位置并同时变高。最后，它变得几乎透明（参见图\
  \ 9.9）。\n\n![第一个动画，初始状态](img/img-f9.8.html)\n\n**图 9.8**     第一个动画，初始状态\n\n![第一个动画，最终状态](img/img-f9.9.html)\n\
  \n**图 9.9**     第一个动画，最终状态\n\n点击第二个矩形会启动该元素的动画。它向下移动并同时变为白色（参见图 9.10），然后移回起始位置并同时变回灰色。整个过程重复一次。\n\
  \n![第二个动画，中间状态](img/img-f9.10.html)\n\n**图 9.10**     第二个动画，中间状态\n\n### 9.4.2 时间控制\n\
  \n以下是第一个矩形的时间控制动画的代码：\n\n```\n...\n<body>\n   <svg xmlns=\"https://www.w3.org/2000/svg\"\
  \ width=\"400px\"\n         height=\"300px\" style=\"border:1px solid black;\">\n\
  \      <g stroke=\"#000000\" stroke-width=\"2\" fill=\"#a0a0a0\">\n         <rect\
  \ x=\"50\" y=\"20\" width=\"100\" height=\"50\">\n            <animate attributeName=\"\
  y\"\n               begin=\"1\" dur=\"1\" from=\"20\" to=\"120\" fill=\"freeze\"\
  \ />\n            <animate attributeName=\"height\"\n               begin=\"2\"\
  \ dur=\"1\" by=\"100\" fill=\"freeze\" />\n            <animate attributeName=\"\
  y\"\n               begin=\"2\" dur=\"1\" by=\"-100\" fill=\"freeze\" />\n     \
  \       <animate attributeName=\"opacity\"\n               begin=\"3\" dur=\"1\"\
  \ from=\"1\" to=\"0.2\" fill=\"freeze\" />\n         </rect>\n...\n      </g>\n\
  \   </svg>\n</body></html> \n```\n\n**清单 9.9** `svg_animation.htm` 文件，第一个矩形的动画\n\
  \n两个矩形位于一个组中，该组定义了填充颜色和边框线的属性。四个不同的动画各自作为子节点从属于该矩形。\n\n你使用 `animate` 标签为父元素创建动画，并使用\
  \ `attributeName` 属性定义要动画化的属性。在本例中，这些属性是用于垂直位置的 `y`、用于高度的 `height` 以及用于透明度的 `opacity`。\n\
  \n我在此仅介绍 SVG 元素的透明度属性，因为它在与动画关联时更清晰。位于部分或完全透明的其他 SVG 元素后面的 SVG 元素是可见的，相关 `opacity`\
  \ 属性允许的值介于 0.0（完全透明）和默认值 1.0（完全不透明）之间。\n\n`begin` 和 `dur`（duration 的缩写）属性定义了时间控制动画的开始时间和持续时间。这使你能够为过程编写脚本。默认情况下，值以秒为单位指定，在此示例中，每个动画持续一秒。开始时间的选择方式使得第一个动画首先发生，第二个和第三个动画紧随其后同时发生，第四个动画紧随其后。\n\
  \n你也可以使用特定单位的缩写来指定时间值。例如，`h` 表示小时单位（例如 `2h`），`min` 表示分钟单位（例如 `0.5min`），`s` 表示秒单位（例如\
  \ `3.5s`），`ms` 表示毫秒单位（例如 `500ms`）。\n\n你使用 `from` 和 `to` 属性来确定动画属性的绝对起始值和结束值。为避免动画开始时发生突变，应将属性已有的值作为起始值。在此示例中，`y`\
  \ 的值在第一个动画期间从 20 连续变化到 120，`opacity` 的值从 1.0 连续变化到 0.2。\n\n你使用 `by` 属性来确定动画属性的相对变化。在此示例中，`height`\
  \ 的结束值比起始值大 100，而第三个连续动画中 `y` 的结束值比起始值小 100。\n\n动画的 `fill` 属性与填充无关，`freeze` 值确保值在动画结束时冻结。如果省略该属性或设置默认的\
  \ `remove` 值，则会重新设置属性的起始值。\n\n### 9.4.3 事件控制\n\n现在让我们看看第二个矩形的事件控制动画的代码：\n\n```\n\
  ...\n         <rect id=\"re2\" x=\"200\" y=\"20\" width=\"100\" height=\"50\">\n\
  \            <animate attributeName=\"y\" begin=\"re2.click\" dur=\"2\"\n      \
  \         repeatCount=\"2\" values=\"20;120;20\" />\n            <animate attributeName=\"\
  fill\" begin=\"re2.click\" dur=\"2\"\n               repeatCount=\"2\" values=\"\
  #a0a0a0;#ffffff;#a0a0a0\" />\n         </rect>\n... \n```\n\n**清单 9.10** `svg_animation.htm`\
  \ 文件，第二个矩形的动画\n\n该矩形具有 `id` 属性，此处值为 `re2`。需要唯一的 ID 才能将事件分配给 SVG 元素。两个不同的动画各自作为子节点从属于该矩形。\n\
  \n\n\n\n\n两个动画的 `begin` 属性值均为 `re2.click`，因此点击对应 ID 的矩形会同时启动两个动画。除了 `click`，还有 `mouseover`、`mouseout`\
  \ 等其他事件标识符，正如你在第 4 章中已经看到的，但没有 `on` 前缀。\n\n两个动画均持续 2 秒。`repeatCount` 属性定义了动画序列的次数，因此值为\
  \ `2` 并不意味着动画结束后还会再运行两次，而是总共运行两次。\n\n如果动画从起始值经过多个中间值到达最终值，`values` 属性尤其有用。在此例中，`y`\
  \ 的值首先从 `20` 连续变化到 `120`，然后再从 `120` 连续变化回 `20`。填充颜色的值从灰色开始，连续变化为白色，然后再连续变化回灰色。在这两种情况下，最终值都与起始值相同，因此可以省略带有\
  \ `freeze` 值的 `fill` 属性。\n\n## 9.5 旋转\n\n使用 `rotate` 语句旋转 SVG 元素属于变换（transformations）的范畴。我在这里介绍它，只是因为它在动画的上下文中更清晰。\n\
  \n除了旋转之外，还有其他类型的变换，这里不再赘述。你可以通过更改属性来实现它们，但需要一些额外的工作：\n\n*   你可以使用 `translate` 语句通过其他位置规格来实现平移。\n\
  *   你可以使用 `scale` 语句通过其他尺寸规格来实现缩放。\n*   你可以使用 `skewX` 和 `skewY` 语句通过其他形状规格来实现扭曲，但稍微复杂一些。\n\
  \n在 `svg_rotation.htm` 文件中，加载文档后你会看到三个灰色填充的矩形（参见图 9.11）。\n\n![左前矩形的固定旋转](img/img-f9.11.html)\n\
  \n**图 9.11** 左前矩形的固定旋转\n\n左侧的两个矩形上下重叠。上方的矩形相对于下方的矩形旋转了 30 度，旋转中心（更准确地说，是旋转轴穿过屏幕的点）是矩形的中心。你也可以定义其他旋转中心（例如，矩形的某个角点或左上角\
  \ SVG 图形的零点）。\n\n片刻之后，右侧的矩形开始动画。它从 0 度的起始位置连续旋转到 30 度的结束位置（参见图 9.12）。\n\n![右侧矩形动画旋转后](img/img-f9.12.html)\n\
  \n**图 9.12** 右侧矩形动画旋转后\n\n代码如下：\n\n```\n...\n<body>\n   <svg xmlns=\"https://www.w3.org/2000/svg\"\
  \ width=\"400px\"\n         height=\"200px\" style=\"border:1px solid black;\">\n\
  \      <g stroke=\"#000000\" stroke-width=\"2\" fill=\"#a0a0a0\">\n         <rect\
  \ x=\"50\"  y=\"75\" width=\"100\" height=\"50\" />\n         <rect x=\"50\"  y=\"\
  75\" width=\"100\" height=\"50\"\n            transform=\"rotate(30, 100, 100)\"\
  \ />\n         <rect x=\"250\" y=\"75\" width=\"100\" height=\"50\">\n         \
  \   <animateTransform attributeName=\"transform\"\n               type=\"rotate\"\
  \ begin=\"1\" dur=\"2\" from=\"0, 300, 100\"\n               to=\"30, 300, 100\"\
  \ fill=\"freeze\" />\n         </rect>\n      </g>\n   </svg>\n</body></html> \n\
  ```\n\n**清单 9.11** `svg_rotation.htm` 文件\n\n这两个矩形位于一个组中，该组定义了填充和边框线的属性。\n\n左侧上方的矩形具有\
  \ `transform` 属性。该属性的值指定了变换的类型，例如 `translate`、`scale`、`skewX`、`skewY` 或（本例中的）`rotate`，后面括号内是参数值。对于旋转，参数是旋转角度（以度为单位），然后是旋转中心的坐标。\n\
  \n动画是右侧矩形的子节点。使用 `animateTransform` 标签可以为父元素的变换创建动画，并且 `attributeName` 属性被赋予 `transform`\
  \ 值。\n\n对于旋转动画，`type` 属性被赋予 `rotate` 值。`begin`、`dur` 和 `fill` 属性的作用我们已经了解。`from`\
  \ 和 `to` 属性的值的写法与上面相同：首先是旋转角度（以度为单位），然后是旋转中心的坐标。\n\n## 9.6 SVG 与 JavaScript\n\n\
  借助 JavaScript 和你在第 5 章中了解的 DOM，你可以访问 SVG 图形的各个元素，修改它们或补充它们。\n\n使用 `svg_event.htm`\
  \ 中的程序，每次点击矩形时，都可以通过 JavaScript 将灰色矩形向右移动一点。你也可以直接在 SVG 中实现这一点，但我们将展示如何使用 JavaScript\
  \ 注册与 SVG 元素相关的事件、读取其属性值并修改它们。\n\n代码如下：\n\n```\n... <head> ...\n   <script> \n```\n\
  \n```\n function change()\n      {\n         let xPos = parseInt(re.getAttribute(\"\
  x\"));\n         xPos += 100;\n         re.setAttribute(\"x\", xPos);\n      } \n\
  ```\n\n```\n </script>\n</head>\n<body>\n   <svg xmlns=\"https://www.w3.org/2000/svg\"\
  \ width=\"400px\"\n         height=\"150px\" style=\"border:1px solid black;\">\n\
  \      <rect id=\"re\" x=\"50\" y=\"20\" width=\"100\" height=\"50\"\n         fill=\"\
  #a0a0a0\" stroke=\"#000000\" stroke-width=\"2\" />\n   </svg>\n   <script> \n```\n\
  \n```\n const re = document.getElementById(\"re\");\n      re.addEventListener(\"\
  click\", change); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 9.12**\
  \ `svg_event.htm` 文件\n\n矩形有一个 ID，与 HTML 元素一样，这是通过 `getElementById()` 方法与 JavaScript\
  \ 建立连接所必需的。在 `change()` 函数中，`getAttribute()` 方法以字符串形式返回属性的值，属性名称在字符串中指定。\n\n\n\n\
  \n如果该值需要进一步作为数字处理，则必须首先使用 `parseInt()` 方法进行转换。在这种情况下，数值增加 100，然后使用 `setAttribute()`\
  \ 方法将这个新值赋给属性。该方法需要两个参数：属性名称（字符串形式）和属性的新值。\n\n## 9.7    动态 SVG 元素\n\n你不仅可以使用 JavaScript\
  \ 访问现有的 SVG 元素，还可以创建新的 SVG 元素。这使你能够创建包含许多相似元素的动态 SVG 图形。\n\n### 9.7.1    动画序列\n\n\
  `svg_create.htm` 文件中的程序总共生成了 36 个矩形。它们被赋予随机颜色，并排列成 6×6 的网格（参见图 9.13）。\n\n![使用 JavaScript\
  \ 创建的 SVG 元素](img/img-f9.13.html)\n\n**图 9.13**     使用 JavaScript 创建的 SVG 元素\n\n\
  所有矩形随后经历类似的动画：它们向右移动，延迟一段时间后旋转 90 度（参见图 9.14），然后被赋予另一种随机颜色。\n\n![使用 JavaScript 动画化的\
  \ SVG 元素](img/img-f9.14.html)\n\n**图 9.14**     使用 JavaScript 动画化的 SVG 元素\n\n###\
  \ 9.7.2    创建初始状态\n\n创建初始状态的代码如下：\n\n```\n... <head> ...\n   <script> \n```\n\n\
  ```\n function create()\n      {\n         const svgCont = document.getElementById(\"\
  idSVG\");\n         const ns = \"http://www.w3.org/2000/svg\";\n         const colorArray\
  \ = [\"#ff0000\", \"#ffff00\", \"#00ff00\", \"#0000ff\"];\n\n         for(let i=0;\
  \ i<6; i++)\n         {\n            for(let k=0; k<6; k++)\n            {\n   \
  \            /* Add rectangle to SVG container */\n               const re = document.createElementNS(ns,\
  \ \"rect\");\n               const xValue = 20 + 40 * i;\n               re.setAttribute(\"\
  x\", xValue);\n               const yValue = 20 + 40 * k;\n               re.setAttribute(\"\
  y\", yValue);\n               re.setAttribute(\"width\", \"20\");\n            \
  \   re.setAttribute(\"height\", \"20\");\n               const fillValue = colorArray[Math.floor(Math.random()\
  \ * 4)];\n               re.setAttribute(\"fill\", fillValue);\n               re.setAttribute(\"\
  stroke\", \"#000000\");\n               re.setAttribute(\"stroke-width\", \"2\"\
  );\n               svgCont.appendChild(re);\n               ...\n            }\n\
  \         }\n      } \n```\n\n```\n </script>\n</head>\n<body>\n   <svg xmlns=\"\
  https://www.w3.org/2000/svg\" id=\"idSVG\" width=\"310px\"\n      height=\"260px\"\
  \ style=\"border:1px solid black;\" />\n   <script> \n```\n\n```\n create(); \n\
  ```\n\n```\n </script>\n</body></html> \n```\n\n**清单 9.13**     svg_create.htm 文件，初始状态\n\
  \n文档主体包含一个带有 ID 的 SVG 容器，该容器尚未包含任何元素。在这种情况下，不需要结束标签，但开始标签必须以 `/>` 结束。\n\n在此之下，调用了\
  \ JavaScript 函数 `create()`。这种顺序确保了在创建 SVG 元素之前，包含 SVG 容器的 HTML 文档已被加载。\n\n在 `create()`\
  \ 函数中，首先设置了一些变量。`svgCont` 变量引用 SVG 容器，而 `ns` 变量引用 SVG 元素所需的命名空间。`colorArray` 字段包含使用随机生成器选择的四种可能颜色。\n\
  \n通过嵌套循环，可以在 6×6 网格中排列 36 个 SVG 元素。要创建新的 SVG 元素，可以使用 `createElementNS()` 方法，该方法可以从特定命名空间创建元素。该方法需要两个参数：命名空间和元素类型，在本例中为\
  \ `rect`。该方法在指定 `https` 时存在问题，因此这里仍使用 `http`。\n\n使用 `setAttribute()` 方法将属性及其值赋给新创建的\
  \ SVG 元素。根据 6×6 网格中的当前行和当前列确定 x 和 y 坐标的值，并使用随机生成器和之前创建的字段确定颜色的值。\n\n一旦分配了所有属性，新创建的矩形就会使用\
  \ `appendChild()` 方法作为子节点添加到 SVG 容器中。\n\n### 9.7.3    创建动画\n\n现在让我们来看看动画的代码。它位于内层循环中，因此每次为一个矩形执行：\n\
  \n```\n ...\n               /* Add animated translation to rectangle */\n      \
  \         const animX = document.createElementNS(ns, \"animate\");\n           \
  \    animX.setAttribute(\"attributeName\", \"x\");\n               animX.setAttribute(\"\
  begin\", \"1\");\n               animX.setAttribute(\"dur\", \"1\");\n         \
  \      animX.setAttribute(\"by\", \"50\");\n               animX.setAttribute(\"\
  fill\", \"freeze\");\n               re.appendChild(animX);\n\n               /*\
  \ Add animated rotation to rectangle */\n               const animRot = document.createElementNS(ns,\
  \ \"animateTransform\");\n               animRot.setAttribute(\"attributeName\"\
  , \"transform\");\n               animRot.setAttribute(\"type\", \"rotate\");\n\
  \               const beginValue = 3 + 0.2 * i;\n               animRot.setAttribute(\"\
  begin\", beginValue);\n               animRot.setAttribute(\"dur\", \"1\");\n  \
  \             const fromValue = \"0, \" + (80+40*i) + \", \" + (30+40*k);\n    \
  \           animRot.setAttribute(\"from\", fromValue);\n               const toValue\
  \ = \"90, \" + (80+40*i) + \", \" + (30+40*k);\n               animRot.setAttribute(\"\
  to\", toValue);\n               animRot.setAttribute(\"fill\", \"freeze\");\n  \
  \             re.appendChild(animRot);\n\n               /* Add animated color change\
  \ to rectangle */\n               const animFill = document.createElementNS(ns,\
  \ \"animate\");\n               animFill.setAttribute(\"attributeName\", \"fill\"\
  );\n               animFill.setAttribute(\"begin\", \"6\");\n               animFill.setAttribute(\"\
  dur\", \"1\");\n\n               /* Color must change */\n               let fillToValue;\n\
  \               do\n                  fillToValue = colorArray[Math.floor(Math.random()\
  \ * 4)];\n               while(fillToValue == fillValue);\n               animFill.setAttribute(\"\
  to\", fillToValue);\n\n               animFill.setAttribute(\"fill\", \"freeze\"\
  );\n               re.appendChild(animFill);\n... \n```\n\n**清单 9.14**     svg_create.htm\
  \ 文件，动画\n\n要创建动画平移，可以使用 `createElementNS()` 方法创建一个 `animate` 类型的新 SVG 元素。使用 `setAttribute()`\
  \ 方法分配属性及其值后，新创建的动画将使用 `appendChild()` 方法作为子节点添加到相应的矩形中。\n\n\n\n你使用 `createElementNS()`、`setAttribute()`\
  \ 和 `appendChild()` 方法来创建并分配动画旋转。这次，SVG 元素的类型是 `animateTransform`，为了确保旋转有延迟，你根据\
  \ 6×6 网格中的当前列单独设置 `begin` 属性的值。请注意 `from` 和 `to` 属性的值：旋转从 0 度的起始状态到 90 度的结束状态，每个矩形围绕其自身中心旋转。\n\
  \n你还使用 `createElementNS()`、`setAttribute()` 和 `appendChild()` 方法来创建并分配动画颜色变化。这次，SVG\
  \ 元素再次使用 `animate` 类型，并且你使用 `do-while` 循环来确保新颜色值与旧颜色值始终不同。\n\n### 注意\n\n你可以在本书的可下载材料中找到\
  \ bonus 第 1 章第 1.19 节的 `u_svg` 练习，下载地址为 [www.rheinwerk-computing.com/5875](http://www.rheinwerk-computing.com/5875)。\n\
  \n# 10    使用 Three.js 的三维图形与动画\n\n你可以使用 Three.js 库来显示三维图形和动画。\n\nThree.js 是一个 JavaScript\
  \ 库，无需额外程序即可在浏览器中显示三维（3D）图形。这些 3D 图形还可以包含动画。\n\nThree.js 基于 Web 图形库（WebGL），这是一个图形编程接口，是许多现代浏览器的组成部分。该库在不断改进，部分得益于活跃的社区。\n\
  \n目前（截至 2024 年 8 月），Three.js 的版本为 167。包含整个库的 revision 157 的 `three.min.js` 文件大小为\
  \ 634 KB，你可以在本书的可下载材料中找到它以及示例文件。在以下示例中，我们访问此文件，它位于与示例文件相同的目录中。\n\n你可以在 [`threejs.org`](https://threejs.org)\
  \ 找到任何更新的版本，并使用下载链接下载大小约为 260 MB 的 `three.js-master.zip` 文件。所需的 `three.min.js` 文件位于解压后包的\
  \ `build` 子目录中。偶尔会出现下载问题，如果遇到这种情况，请使用本书可下载材料中提到的文件。\n\n本章涵盖 Three.js 的基础知识：不同的三维几何体、不同的相机位置，以及三维物体的位移、旋转和动画。它不涉及高级主题，如不同的材质、光照类型和投影。\n\
  \n## 10.1    第一个 3D 图形\n\n使用一个简单的立方体 3D 几何体来说明 3D 图形的各个元素（参见图 10.1）。\n\n![作为第一个\
  \ 3D 对象的立方体](img/img-f10.1.html)\n\n**图 10.1**    作为第一个 3D 对象的立方体\n\n我们从右上方向用相机观察立方体。这样，立方体的三个面以不同颜色可见。\n\
  \n### 10.1.1    3D 坐标系\n\n为了阐明 3D 图形的结构，我们首先需要了解 3D 坐标系的基础知识。3D 空间中的每个点都可以通过其 x\
  \ 坐标、y 坐标和 z 坐标唯一标识。\n\n坐标 `x=0`、`y=0` 和 `z=0` 表示系统的中心。默认情况下，该点位于屏幕中心。\n\n*   x\
  \ 坐标的值在中心右侧为正，左侧为负。我们系统的 x 轴在屏幕平面内从左向右延伸。\n\n*   在中心上方，y 坐标的值为正，中心下方为负。我们系统的 y 轴在屏幕平面内从下向上延伸。\n\
  \n*   我们系统的 z 轴垂直穿过屏幕平面，从屏幕后方指向我们（观察者）。z 坐标的值在屏幕前方为正，屏幕后方为负。\n\n在图 10.2 中，你可以看到带有三个轴的\
  \ 3D 坐标系。为了在书的二维（2D）平面中说明 3D 空间，我选择了一种透视表示法，其中距离观察者较远的物体看起来更小。出于同样的原因，我在示例中使用透视相机来在屏幕的\
  \ 2D 平面中显示 3D 图形。\n\n![带有 X、Y 和 Z 轴的 3D 坐标系](img/img-f10.2.html)\n\n**图 10.2**    带有\
  \ X、Y 和 Z 轴的 3D 坐标系\n\n### 10.1.2    程序结构\n\n以下是使用 Three.js 库对象的程序代码。在程序代码中，我将这些对象称为\
  \ Three.js 对象，以区别于屏幕上可见的 3D 对象。\n\n我的 3D 图形结构总是相似的，因此我对第一个程序的详细解释也将帮助你了解本章中的其他程序。\n\
  \n```\n... <head> ...\n   <script src=\"three.min.js\"></script>\n</head>\n<body\
  \ id=\"idBody\">\n   <script> \n\n /* 3D 对象 */\n      const geometry = new THREE.BoxGeometry(200,\
  \ 200, 200);\n      const material = new THREE.MeshNormalMaterial();\n      const\
  \ object = new THREE.Mesh(geometry, material);\n\n      /* 相机 */\n      const camera\
  \ = new THREE.PerspectiveCamera(45,\n         innerWidth/innerHeight, 1, 100000);\n\
  \      camera.position.set(200, 250, 500);\n      camera.lookAt(object.position);\n\
  \n      /* 绘图区域 */\n      const drawing = new THREE.WebGLRenderer();\n      drawing.setSize(innerWidth*0.8,\
  \ innerHeight*0.8);\n      drawing.setClearColor(0xc0c0c0);\n\n      /* 3D 场景 */\n\
  \      const scene = new THREE.Scene();\n      scene.add(object);\n      drawing.render(scene,\
  \ camera);\n\n      /* 将绘图添加到文档 */\n      document.getElementById(\"idBody\").appendChild(drawing.domElement);\
  \ \n\n</script>\n</body></html>\n```\n\n**清单 10.1**    th_grafic.htm 文件\n\n在程序开头，包含了\
  \ `three.min.js` 文件中的库。\n\n### 10.1.3    具有几何体和材质的 3D 对象\n\n3D 对象具有形状，也称为几何体。3D\
  \ 对象的几何体由许多单独的三角形表面组成，Three.js 库提供了一系列现成的常用几何体，包括球体、长方体和平截头圆锥体的几何体。这些现成的几何体将为你节省大量组装工作。\n\
  \n你可以使用 `BoxGeometry` 类型的 Three.js 对象来创建一个盒子。构造函数至少需要三个参数来指定长方体的宽度（x 方向）、高度（y 方向）和深度（z\
  \ 方向）。如果选择三个相同的值，则得到立方体的特殊情况。\n\n3D 对象具有表面材质，`MeshNormalMaterial` 类型的 Three.js 对象从\
  \ x 方向显示为红色，从 y 方向显示为绿色，从 z 方向显示为蓝色。\n\n你可以使用 `Mesh` 类型的 Three.js 对象以所需的几何体和所需的表面材质创建\
  \ 3D 对象。未指定对象的位置，因此其位置位于坐标系的原点。\n\n### 10.1.4    相机\n\n\n\n\n\n相机有多种类型。`PerspectiveCamera`\
  \ 类型的 Three.js 对象提供了一种相机，能够呈现图形场景的透视视图。该相机位于一个具有矩形底面的金字塔顶端。\n\n在图 10.3 中，相机由右侧的一个粗点表示。相机透过金字塔看向左侧的底面。金字塔之外的所有内容在图形场景中均不可见。\n\
  \n![带图层的透视相机](img/img-f10.3.html)\n\n**图 10.3**     带图层的透视相机\n\n构造函数需要以下四个参数：\n\n\
  *   `fov` = 视野：这是以度数为单位的视角。45 度时能获得自然的透视效果。\n\n*   `aspect` = 宽高比：这是矩形金字塔底面的宽度与高度之比。建议使用浏览器窗口的宽高比。\n\
  \n*   `near` = 近平面：这是图 10.3 中金字塔的一个（虚线）横截面。该图层之前的所有内容在图形场景中均不可见。\n\n*   `far` =\
  \ 远平面：这是金字塔的底面（在图 10.3 中用点线表示）。该图层之后的所有内容在图形场景中同样不可见。\n\n通过使用 `position` 类型的 Three.js\
  \ 对象，可以访问 Three.js 对象的位置属性。可以单独调用或设置 `position` 对象的 `x`、`y` 和 `z` 属性来设定坐标，也可以使用\
  \ `set()` 方法同时设置三个坐标。此处选择的 `x=200`、`y=250` 和 `z=500` 值将相机定位在坐标原点右上方且前方。\n\n在默认情况下，相机的观察方向是正前方，但可以使用\
  \ `lookAt()` 方法改变观察方向，使相机朝向原点。\n\n### 10.1.5    画布与场景\n\n`WebGLRenderer` 类型的 Three.js\
  \ 对象提供了一个绘图区域，即画布。`setSize()` 方法用于设置画布的大小，这里使用浏览器窗口宽度和高度的 80%，即 `window` 对象的 `innerWidth`\
  \ 和 `innerHeight` 属性值。\n\n`setClearColor()` 方法使用十六进制数字序列来确定画布背景颜色的红、绿、蓝分量。默认值为黑色。\n\
  \n`Scene` 类型的 Three.js 对象创建一个图形场景，可以在其中布置 3D 对象，而 `add()` 方法将之前创建的 3D 对象（即立方体）添加到场景中。\n\
  \n画布的 `render()` 方法用于在画布内显示场景及相机。\n\n画布的 `domElement` 属性引用了画布本身。它通过 `appendChild()`\
  \ 方法添加到文档中。\n\n## 10.2    移动相机\n\n为了展示三维结构，我们可以通过以下程序在三个方向上移动相机。\n\n这里仅展示与第 10.1\
  \ 节 程序相比新增的代码部分：\n\n```\n...\n<body id=\"idBody\">\n   <form>\n   <script> \n```\n\
  \n```\n ...\n      let cx = 200, cy = 250, cz = 500;\n      camera.position.set(cx,\
  \ cy, cz);\n      ... \n```\n\n```\n </script>\n\n   <p>\n   <input id=\"posPX\"\
  \ type=\"button\" value=\"+X\">\n   <input id=\"posMX\" type=\"button\" value=\"\
  -X\">\n   <input id=\"posPY\" type=\"button\" value=\"+Y\">\n   <input id=\"posMY\"\
