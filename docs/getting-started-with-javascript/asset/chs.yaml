  );\n      sub1.addEventListener(\"mouseover\", function() { subOn(1); });\n    \
  \  sub1.addEventListener(\"mouseout\",  function() { subOff(1); });\n      const\
  \ sub2 = document.getElementById(\"idSub2\");\n      sub2.addEventListener(\"mouseover\"\
