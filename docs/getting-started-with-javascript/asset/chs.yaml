  # 索引\n## 法律声明\n\n\n*   所有习题及解答\n\n\n\n\n\n\n\n\n\n\n\n\n\n*   它们实现了类似于你在其他计算机应用程序中所习惯的交互。你可以进行输入并触发处理，程序将返回结果。\n\
  为了简化程序的开发，你只需要一个能够高亮显示 HTML 标记和 JavaScript 关键字以便清晰识别的文本编辑器。Notepad++ 编辑器是众多能做到这一点的编辑器之一。\n\
  ## 1.2   JavaScript 不能做什么？\nJavaScript 无法自行开启。可能存在个别情况下浏览器中禁用了 JavaScript，但无法完全使用的网站比例相当高。不过，我们至少可以识别出\
  \ JavaScript 是否被禁用，并在这种情况下发送一条消息（第 1.11 节）。\nJavaScript 也无法在 Web 服务器上保存任何内容（除非借助额外工具）。JavaScript\
  \ 程序在浏览器中执行，而不是在加载它们的 Web 服务器上执行，因此无法在 Web 服务器上保存数据。\nJavaScript 在使用过程中只能在浏览器中存储少量数据。它不会在那里造成任何损害。\n\
  ## 1.3   浏览器与移动浏览器\n无论是否包含 JavaScript，互联网页面都会被不同终端设备上不同操作系统的不同浏览器接收，并在使用过程中实现。\n\
  互联网上有各种浏览器统计数据，例如在 [`www.w3schools.com/browsers/`](https://www.w3schools.com/browsers/)\
  \ 上，这些数据可用于确定哪些浏览器被使用以及使用频率。多年来，Google Chrome 浏览器的用户份额最高，因此它作为本书示例程序最重要（但非唯一）的参考。\n\
  某些 JavaScript 语句可能针对特定浏览器有不同的写法，但我建议始终使用标准形式，以便该语句尽可能适用于更多浏览器。这一原则也适用于本书中的示例程序。\n\
  配备移动浏览器的移动设备比例正在不断增加。移动设备提供了一些额外的选项，例如用于地理定位数据的接收器或传感器，以及移动设备的位置和加速度。这些过程中确定的数据可以由\
  \ JavaScript 进一步处理（参见第 15 章，第 15.3 节）。\n## 1.4   ECMAScript\nJavaScript 基于 ECMAScript。你可以以传统方式在\
  \ JavaScript 中应用面向对象编程，基于原型和构造函数。自 ECMAScript 2015 标准引入以来，出现了一种新的标准表示法，它使用类、构造函数、属性和方法，就像其他面向对象语言一样。在本书中，我们只使用这种表示法，所有现代浏览器也都实现了它。更多细节将在第\
  \ 3 章中详细说明。\nECMAScript 标准自 2015 年以来每年更新一次，ECMAScript 2024 标准已于 2024 年 7 月完成。你可以在以下网站上找到许多标准化元素及其在个别浏览器中实现的概述：[`compat-table.github.io/compat-table/es2016plus`](https://compat-table.github.io/compat-table/es2016plus)。\n\
  较新标准的许多元素对初学者也很有用，并且可以在本书的相关章节中找到。我将分别介绍它们。\n## 1.5   本书结构\n\n\n\n\n\n\n\n\n\n\n\
