  \ 提供对 HTML 文档所有元素的读写访问。\n\n文档对象模型（DOM）是一种用于访问特定类型文档（如 HTML、XML（参见第 7 章、第 7.3 节）和\
  \ SVG（参见第 9 章））元素的模型。\n\n\n\n\n该模型的结构类似于树，就像目录树一样，由各个节点组成。有一个根节点，它拥有子节点，子节点又可以拥有自己的子节点，以此类推。每个节点还可以拥有属性节点。\n\
  \n在 JavaScript 中，每个节点由一个 `node` 对象表示，它可以是 HTML 元素节点、HTML 属性节点或文本节点。节点对象可以被读取、修改、添加和删除。\n\
  \n在 JavaScript 中，你可以通过 `document` 对象访问文档的内容，该对象提供了创建新文档对象并访问它们的方法。你已经频繁使用过 `getElementById()`\
  \ 方法。\n\n本章将介绍如何访问和修改 HTML 文档的元素，这是后续章节中许多技术的前提条件。\n\n## 5.1    树与节点\n\n在本节中，我们将查看一个简单\
  \ HTML 文档的 DOM 树。首先，这是 HTML 代码：\n\n```\n<!DOCTYPE html><html lang=\"en-us\">\n<head>\n\
  \   <meta charset=\"utf-8\">\n   <title>DOM, first example</title>\n   <link rel=\"\
  stylesheet\" href=\"js5.css\">\n</head>\n<body>\n   <p>First paragraph</p>\n   <p>Second\
  \ paragraph with <span style=\"font-weight:bold;\">\n      bold font</span></p>\n\
  \   <p>Third paragraph with <a href=\"embed.htm\">a link</a></p>\n</body>\n</html>\
  \ \n```\n\n**清单 5.1**    dom_example.htm 文件\n\n该文档包含三个 `p` 容器，其中一些容器还包含其他容器。在浏览器中，它看起来如图\
  \ Figure 5.1 所示。\n\n![DOM 树的简单示例](img/img-f5.1.html)\n\n**图 5.1**    DOM 树的简单示例\n\
  \n现代浏览器提供了根据 DOM 可视化文档结构的功能。在 Google Chrome 浏览器中，你可以通过开发者工具实现这一点，你已经在第 2 章的第 2.5.5\
  \ 节中了解过它。\n\n假设浏览器已打开并运行上述程序。点击右上角的三个点打开浏览器菜单，选择“更多工具”•“开发者工具”菜单项。随后会显示开发者工具，它为你提供了许多不同的选项。\n\
  \n选择屏幕上方区域的“Elements”选项卡。与目录树类似，你现在可以显示或隐藏各个层级（见图 Figure 5.2）。如果代码显示选项卡太小，你可以将整个开发者工具区域向左拖动，从而为各个选项卡提供更多空间。\n\
  \n### 注意\n\n在接下来的示例中，我们将查看或修改不同层级的各个节点。为了清晰起见，你应该始终牢记根据 DOM 的文档结构。\n\n![开发者工具，Elements\
  \ 选项卡](img/img-f5.2.html)\n\n**图 5.2**    开发者工具，Elements 选项卡\n\n## 5.2    检索节点\n\
  \n除了 `getElementById()` 方法，你还可以使用 `getElementsByTagName()` 方法。该方法的参数是一个字符串，包含不带尖括号的标签名称，该方法返回一个字段，其中包含所有具有所需标签的\
  \ HTML 元素的引用。\n\n字段的元素从 0 开始编号。你可以通过方括号中的索引访问单个字段元素，字段的 `length` 属性提供元素的数量。关于字段的更多信息，请参见第\
  \ 6 章的第 6.1 节。\n\n你可以通过相关 `node` 对象的 `getAttribute()` 方法获取 HTML 元素的属性节点。该函数的参数是一个字符串，包含要搜索的属性名称。\n\
  \n以下是一个示例程序：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n function retrieve()\n\
  \      {\n         let output = \"\";\n         const parArray = document.getElementsByTagName(\"\
  p\");\n         for (let i=0; i<parArray.length; i++)\n            output += \"\
  Content: \" + parArray[i].firstChild.nodeValue + \"\\n\"\n              + \"Attribute\
  \ Style: \" + parArray[i].getAttribute(\"style\") + \"\\n\";\n         alert(output);\n\
  \      } \n```\n\n```\n </script>\n</head>\n<body>\n   <p style=\"font-family:Tahoma;\"\
  >First paragraph</p>\n   <p>Second paragraph</p>\n   <p style=\"font-weight:bold;\"\
