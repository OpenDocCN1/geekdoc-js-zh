  \ top:50px; left:50px;\n         width:100px; height:100px; color:rgb(192,192,192);\n\
  \         background-color:rgb(64,64,64);\">Light gray on dark gray</div>\n   <script>\
  \ \n```\n\n```\n const area = document.getElementById(\"idArea\");\n      document.getElementById(\"\
  idChange\").addEventListener(\"click\", change);\n      document.getElementById(\"\
  idAnimate\").addEventListener(\"click\",\n         function() { reference = setInterval(animate,\
  \ 20); } ); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 8.14**     css_color.htm\
  \ 文件，下半部分\n\n值 192/192/192 对应浅灰色，值 64/64/64 对应深灰色。`div` 容器包含当前颜色设置的信息。`area` 变量引用了定位的\
  \ `div` 容器，点击 Change 按钮调用 `change()` 函数，点击 Animate 按钮调用一个匿名函数，该函数调用 `setInterval()`\
  \ 方法。\n\n接下来是程序的上半部分，包含 JavaScript 代码：\n\n```\n... <head> ...\n   <script> \n```\n\
  \n```\n function change()\n      {\n         area.style.color = \"rgb(64,64,64)\"\
  ;\n         area.style.backgroundColor = \"rgb(192,192,192)\";\n         area.firstChild.nodeValue\
  \ = \"Dark gray on light gray\";\n      }\n\n      let reference, red = 64, green\
  \ = 64, blue = 64;\n      function animate()\n      {\n         if (red >= 192)\n\
  \         {\n            clearInterval(reference);\n            area.firstChild.nodeValue\
