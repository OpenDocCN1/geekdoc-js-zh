  \ `e`（表示错误）来命名这样的错误对象，你可以使用 `alert()` 输出该对象。\n图 2.27 中的输出包含一个 `ReferenceError`。与之前的程序相比，这个错误已被拦截，因此不会出现“Uncaught”，程序继续运行。\n\
