  \ });\n      menu1.addEventListener(\"mouseout\",  function() { subOff(1); });\n\
  \      const menu2 = document.getElementById(\"idMenu2\");\n      menu2.addEventListener(\"\
  mouseover\", function() { subOn(2); });\n      menu2.addEventListener(\"mouseout\"\
