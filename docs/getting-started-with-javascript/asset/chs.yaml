  \         req.send();\n      }\n\n      function evaluate(e)\n      {\n        \
  \ if(e.target.readyState == 4 && e.target.status == 200)\n            document.getElementById(\"\
  idParagraph\").firstChild.nodeValue =\n               e.target.responseText;\n \
  \     } \n \n </script>\n</head>\n<body>\n   <p>人员编号：</p>\n   <p><a id=\"idLink0\"\
  \ href=\"#\">6714</a></p>\n   <p><a id=\"idLink1\" href=\"#\">81343</a></p>\n  \
  \ <p id=\"idParagraph\"> </p>\n   <script> \n \n document.getElementById(\"idLink0\"\
  ).addEventListener\n         (\"click\", function() { request(6714, \"all\"); });\n\
  \      document.getElementById(\"idLink1\").addEventListener\n         (\"click\"\
  , function() { request(81343, \"part\"); }); \n \n </script>\n</body></html> \n\
  ```\n\n**清单 7.4**     ajax_parameters.htm 文件\n\n此外，以下是响应的 PHP 程序：\n\n```\n<?php\n\
  \   header(\"Content-type: text/html; charset=utf-8\");\n\n   if($_GET[\"pno\"]\
