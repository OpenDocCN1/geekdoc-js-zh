  \ 文件，`ready()` 方法的内容\n\n第一个超链接将宽度动画化到目标值 200 像素。你可以同时更改多个属性。第二个超链接将宽度动画化到目标值 200\
  \ 像素，并将高度动画化到目标值 50 像素。\n\n通过更改 `left` 和 `top` 的属性值，可以实现动画移动。第三个超链接将矩形移动到目标点 400\
  \ 像素/200 像素。你可以使用第四个超链接通过 `opacity` 属性将透明度更改为 0.5（另请参见第 8 章、第 8.2.4 节）。\n\n未进一步指定时，动画持续\
  \ 0.4 秒（即 400 毫秒）。你可以通过 `animate()` 方法的第二个参数中的 `duration` 属性设置动画持续时间。以毫秒为单位写入值，不带引号。第五个超链接在\
  \ 2 秒内将宽度更改为目标值 200 像素。\n\n`easing` 属性描述了动画的时间特性。默认值 `swing` 表示动画开始时加速，以稳定速度继续，并在结束时减速。这营造出自然过程的印象。\n\
  \n如果在 `animate()` 方法的第二个参数中为 `easing` 属性输入 `linear` 值，动画将以恒定速度运行，看起来不那么自然。你可以在互联网上找到的缓动插件提供了更多缓动函数的选项。第六个超链接用于在\
  \ 2 秒内将元素线性移动到目标值。\n\n你还可以将回调函数的引用作为附加参数传递，该函数在动画结束后执行。第七个超链接将元素移动到目标值 400 像素，然后元素再移动到目标值\
  \ 300 像素。\n\n到目前为止，我们为动画属性指定了绝对目标值，但你也可以使用 `+=` 和 `-=` 运算符进行相对更改。第八个超链接每次点击时将元素向右移动\
  \ 100 像素，并根据当前值将透明度更改 0.3。对于 `opacity` 属性，大于 1.0 或小于 0.0 的值没有意义，但不会导致错误。\n\n方法调用可以串联。第九个超链接用于将元素向右移动\
  \ 100 像素，然后向左移动 100 像素。\n\n你可以使用 `delay()` 方法在动画中添加延迟。第十个超链接与第九个超链接产生相同的移动，但在两个部分动画之间有一秒的等待。\n\
  \n在链中，动画的各个部分默认依次运行，但你可以使用 `queue` 参数确保它们同时发生。第十一个超链接在一秒内将宽度动画化到目标值 200 像素。高度在 2\
  \ 秒内动画化到目标值 50 像素，但同时进行。这是通过将 `queue` 属性设置为布尔值 `false`（不带引号）实现的。默认值为 `true`。\n\n\
  第十二个超链接用于恢复总共五个属性的初始状态：`width`、`height`、`left`、`top` 和 `opacity`。\n\n事件会被缓冲。如果在正在运行的动画结束前点击超链接，相应的操作将在之后执行。\n\
  \n以下方法不提供任何额外选项，但可用作快捷方式：\n\n*   `slideDown()`、`slideUp()` 和 `slideToggle()` 方法用于更改\
  \ `height` 属性\n*   `fadeIn()`、`fadeOut()`、`fadeToggle()` 和 `fadeTo()` 方法用于更改 `opacity`\
  \ 属性\n*   `show()`、`hide()` 和 `toggle()` 方法用于同时更改 `width`、`height` 和 `opacity` 属性\n\
  \n## 11.5    示例：正弦运动\n\n到目前为止，各个函数中只调用了 jQuery 方法，但我们不应忘记，我们还可以使用 JavaScript 的其他部分。以下示例展示了\
  \ jQuery 与 JavaScript 其他部分的结合。点击最左侧的小方块后，它将沿正弦曲线移动。此外，还有一些辅助线（参见图 11.8）。\n\n![正弦曲线动画，起始点](img/img-f11.8.html)\n\
  \n### 图 11.8    正弦曲线动画，起始点\n\n曲线由单个线段组成。每个线段由 jQuery 动画生成，`for` 循环确保动画按顺序执行。曲线划分得越细，曲线进展越平滑，但即使将其划分为每\
  \ 10 度一段，也能看到相当均匀的进展。\n\n以下是代码：\n\n```\n... <head> ...\n   <script src=\"jquery-3.7.1.min.js\"\
  ></script>\n   <script> \n```\n\n```\n function sine()\n     {\n        for(let\
  \ angle = 10; angle <= 360; angle += 10)\n        {\n           const pLeft = (10\
  \ + angle) + \"px\";\n           const pTop = (110 - Math.sin(angle / 180 * Math.PI)\
  \ * 100) + \"px\";\n           $(\"#idBlock\").animate({\"left\":pLeft, \"top\"\
  :pTop},\n              {\"duration\":\"100\", \"easing\":\"linear\"});\n       \
  \ }\n     }\n\n     $(document).ready(function() { $(\"#idLink\").click(sine); });\
  \ \n```\n\n```\n </script>\n</head>\n<body>\n   <div id=\"idBlock\" style=\"position:absolute;\
  \ left:10px; top:110px;\">\n   <a id=\"idLink\" href=\"#\"><img src=\"block.gif\"\
  \ alt=\"Block\"></a></div>\n   <script> \n```\n\n```\n for(let pTop = 10; pTop <\
  \ 211; pTop += 50)\n         document.write(\"<div style='position:absolute; left:20px;\
  \ top:\"\n            + pTop + \"px;'><img src='im_line.jpg' alt='Line'></div>\"\
  ); \n```\n\n```\n </script>\n</body></html> \n```\n\n### 清单 11.8    `jq_sine.htm`\
  \ 文件\n\n辅助线通过 `for` 循环生成，`pTop` 属性取值分别为 10、60、110、160 和 210 像素。\n\n\n\n\n\n在 `sine()`\
  \ 函数中，`angle` 变量以 10 为步长，取值从 10 到 360。图像在 x 方向上均匀向右移动，而 y 方向的移动则使用了 JavaScript 中\
  \ `Math` 对象的 `sin()` 方法。该方法要求角度以弧度为单位，因此需要事先进行转换。通过这种方式计算得到的目标点值被保存在 `pLeft` 和 `pTop`\
  \ 变量中，这些变量又可以用作 `animate()` 方法参数中 `left` 和 `top` 属性的目标值。\n\n## 11.6 jQuery 与 Ajax\n\
  \nAjax 允许你重新加载文档的部分内容，正如我们在第 7 章中所述。jQuery 中有许多方法在内部使用了 Ajax 技术，你可以像习惯使用 jQuery\
