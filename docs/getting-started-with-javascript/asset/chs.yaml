  \     `map.htm` 文件\n\n你可以在创建映射时填充它。为此，需要传递一个键值对的枚举。每个对以及整个列表都用方括号括起来。\n\n`set()`\
  \ 方法用于添加单个对。如果该对的键已存在，则相应的值将被覆盖。\n\n你可以使用 `forEach()` 方法按照对添加的顺序完全遍历映射。该方法接受一个函数引用作为参数，该函数会为每个值执行。这里，它是用于显示对的\
  \ `output()` 方法。我们看不到的是，`forEach()` 方法确保将键和值作为参数传递给 `output()` 方法。\n\n`has()` 方法用于确定某个特定键是否在映射中，`get()`\
  \ 方法可用于访问特定键的值。\n\n`values()` 方法返回一个包含映射所有值的迭代器（第 6.6.1 节），`keys()` 方法提供包含映射所有键的迭代器。`entries()`\
  \ 方法返回一个包含映射所有对的迭代器，`size` 属性的值对应于映射中的对数。在 `for` 循环中，可以利用这些关系输出映射的所有值、键或对。`delete()`\
  \ 方法用于从映射中删除特定对，`clear()` 方法用于删除映射中的所有对。\n\n程序的输出如图 6.40 所示。\n\n\n\n\n![映射：创建、属性和方法](img/img-f6.40.html)\n\
