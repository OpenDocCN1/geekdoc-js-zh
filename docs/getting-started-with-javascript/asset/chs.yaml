  \n**图 6.24**     Unicode 字符\n\n## 6.3    数字与数学\n\n预定义的 `Math` 和 `Number` 对象让你能更轻松地处理数字和数学计算。在本节中，我们将介绍许多你在计算器中熟悉的函数，同时还会学习简单的随机数生成器以及适用于加密的随机数生成器。\n\
  \n### 6.3.1    Math 对象\n\n`Math` 对象允许你使用一系列有用的数学方法，并且还提供了一些数学常量作为属性。\n\n首先来看示例程序：\n\
  \n```\n...\n<body><p>\n   <script> \n   const a = 4.75, b = -4.75;\n      let output\
  \ = \"a:\" + a + \" b:\" + b + \"<br>\"\n         + \"ceil(a):\" + Math.ceil(a)\
  \ + \" &nbsp; ceil(b):\" + Math.ceil(b) + \"<br>\"\n         + \"floor(a):\" + Math.floor(a)\n\
  \         + \" &nbsp; floor(b):\" + Math.floor(b) + \"<br>\"\n         + \"round(a):\"\
  \ + Math.round(a)\n         + \" &nbsp; round(b):\" + Math.round(b) + \"<br>\"\n\
  \         + \"abs(a):\" + Math.abs(a) + \" &nbsp; abs(b):\" + Math.abs(b) + \"<br>\"\
  \n         + \"sign(a):\" + Math.sign(a) + \" &nbsp; sign(b):\" + Math.sign(b)\n\
  \         + \" &nbsp; sign(0):\" + Math.sign(0) + \"<br>\"\n         + \"max(a,b):\"\
  \ + Math.max(a,b)\n         + \" &nbsp; min(a,b):\" + Math.min(a,b) + \"<br><br>\"\
  ;\n\n      const c = 64;\n      output += \"c:\" + c + \" &nbsp; sqrt(c):\" + Math.sqrt(c)\n\
  \         + \" &nbsp; cbrt(c):\" + Math.cbrt(c) + \"<br>\"\n         + \"pi:\" +\
  \ Math.PI + \" &nbsp; e:\" + Math.E + \"<br>\"\n         + \"exp(4.6):\" + Math.exp(4.6)\n\
  \         + \" &nbsp; log(100):\" + Math.log(100) + \"<br>\"\n         + \"pow(10,3):\"\
  \ + Math.pow(10,3)\n         + \" &nbsp; log10(1000):\" + Math.log10(1000);\n  \
  \    document.write(output); \n   </script></p>\n</body></html> \n```\n\n**清单 6.27**    \
  \ number_math.htm 文件\n\n首先，使用 `ceil()`、`floor()` 和 `round()` 取整方法将一个正数和一个负数取整为整数。`ceil()`\
  \ 方法将数字向上取整为下一个最大的整数，`floor()` 方法将数字向下取整为下一个最小的整数。\n\n`round()` 方法按照商业惯例将数字四舍五入为整数。例如，对于正数，3.000\
  \ 到 3.499 变为 3，3.500 到 3.999 变为 4。对于负数，–3.000 到 –3.499 变为 –3，–3.500 到 –3.999 变为\
  \ –4。\n\n`abs()` 方法计算数字的绝对值（即不带符号的数字）。`sign()` 方法自 ECMAScript 2015 起可用，它确定数字的符号，对于正数返回\
  \ 1，负数返回 –1，数字 0 返回 0。`max()` 和 `min()` 方法返回任意给定数字集合中的最大值或最小值。\n\n`sqrt()` 方法计算数字的平方根，而\
  \ `cbrt()` 方法计算立方根。`PI` 和 `E` 属性包含数学常量 Pi（π）或欧拉数 e（即指数函数的底数）。\n\n`exp()` 方法计算指数函数的结果（即\
  \ e 的幂）。这里，该方法计算 e 的 4.6 次方，结果约为 100。`log()` 方法计算数字的自然对数（即以 e 为底的对数），数学上称为 ln。这对应于\
  \ `exp()` 方法的逆运算。在示例中，该方法计算 100 的自然对数（ln 100），结果约为 4.6。\n\n`pow()` 方法计算幂函数的结果（即\
  \ x 的 y 次方）。这里，该方法计算 10 的 3 次方，结果为 1,000。`log10()` 方法自 ECMAScript 2015 起可用，它计算数字以\
  \ 10 为底的对数。这里，该方法计算 1,000 的对数，结果为 3。\n\n你可以在图 6.25 中看到程序的结果。\n\n![Math 对象、方法和属性](img/img-f6.25.html)\n\
