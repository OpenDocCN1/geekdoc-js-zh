  \n**图 6.8**     返回数组的引用\n\n### 6.1.4    回调函数\n\n你已经从第 2 章的 2.6.13 节中熟悉了回调函数这个术语。你可以将回调函数的引用赋值给一个函数，然后该函数在内部调用传入的回调函数，并使用其程序逻辑。\n\
  \n`Array` 对象有一些预定义的方法会使用回调函数。在这个例子中，传递了一些命名的回调函数，为了清晰起见，我将它们定义在调用附近。你也可以传递匿名回调函数。\n\
  \n以下是程序：\n\n```\n...\n<body><p>\n   <script> \n```\n\n```\n const za = [28.3, 16.5,\
  \ 23.6, 16.7];\n      document.write(\"Array: \" + za + \"<br><br>\");\n\n     \
  \ document.write(\"Run with forEach():<br>\");\n      function output(element, index)\n\
  \         { document.write(index + \":\" + element + \" \"); }\n      za.forEach(output);\n\
  \      document.write(\"<br><br>\");\n\n      document.write(\"Examine with function:<br>\"\
  );\n      function over(value)\n         { return value > this; }\n      document.write(\"\
  At least one value over 20: \"\n         + za.some(over, 20) + \"<br>\");\n    \
  \  document.write(\"All values over 20: \"\n         + za.every(over, 20) + \"<br><br>\"\
  );\n\n      document.write(\"Filtering with function:<br>\");\n      const zb =\
  \ za.filter(over, 20);\n      document.write(\"New array with values over 20: \"\
  \ + zb + \"<br><br>\");\n\n      document.write(\"Apply to function:<br>\");\n \
  \     function multiple(value)\n         { return value * this; }\n      const zc\
  \ = za.map(multiple, 4);\n      document.write(\"New array with values * 4: \" +\
  \ zc + \"<br>\"); \n```\n\n```\n </script></p>\n</body></html> \n```\n\n#### 清单\
  \ 6.11     array_callback.htm 文件\n\n`forEach()` `Array` 方法用于对数组的所有元素执行一个回调函数（本例中为\
  \ `output()` 函数）。调用 `forEach()` 方法时，会传入回调函数的名称。\n\n在内部，`forEach()` 方法确保向 `output()`\
  \ 回调函数传递多个参数（其中一些是可选的）。这些参数可以出现在 `output()` 回调函数的定义中。第一个参数是当前数组元素的副本，第二个参数是可选的，对应于当前元素的索引。`output()`\
  \ 回调函数输出数组的所有元素及其索引和值。\n\n`Array` 方法 `some()` 检查数组中是否至少有一个元素满足回调函数（此处为 `over()`）中的某个条件。`Array`\
  \ 方法 `every()` 对数组的所有元素执行相同的检查。参数（其中一些是可选的）也会在内部传递给 `over()` 回调函数。\n\n在调用某个 `Array`\
  \ 方法时，除了回调函数的名称外，还可以传递一个额外的参数。在回调函数内部，可以通过 `this` 访问这个参数。回调函数 `over()` 随后检查某些（或所有）元素的值是否大于额外传入的参数值。\n\
  \n`Array` 方法 `filter()` 创建一个新的 `Array` 对象，其中包含原始数组中满足回调函数中某个条件的所有元素的副本。这里再次调用了回调函数\
  \ `over()`，并且也传递了一个额外的参数。\n\n\n\n\n`Array` 方法 `map()` 也会创建一个新的 `Array` 对象，其中包含原始数组所有元素的副本。这里调用了\
  \ `multiple()` 回调函数，并将所有元素的值乘以一个作为附加参数传入的因子。\n\n以下是一个使用匿名回调函数调用 `map()` 函数的示例：`const\
  \ zd = za.map(function(value) { return value * this; }, 4);`。`map()` 函数的第一个参数不是命名函数的名称，而是函数的完整定义，不包含函数名。\n\
  \n程序的输出如图 6.9 所示。\n\n![回调函数](img/img-f6.9.html)\n\n**图 6.9**     回调函数\n\n### 6.1.5    添加和删除元素\n\
  \n在 JavaScript 中，数组是动态的。本节介绍 `Array` 对象的方法，这些方法允许你向数组添加元素或从数组中删除元素。\n\n方法如下：\n\n\
  *   `push()` 方法，用于在数组末尾添加元素\n*   `pop()` 方法，用于从数组末尾删除元素\n*   `unshift()` 方法，用于在数组开头添加元素\n\
  *   `shift()` 方法，用于从数组开头删除元素\n*   `splice()` 方法，用于在数组中间添加或删除元素\n\n`toSpliced()`\
  \ 方法自 ECMAScript 2023 起可用。它的工作方式与 `splice()` 方法类似，只是结果会保存到一个新数组中。\n\n除了这里提到的方法外，以下示例程序还使用了\
  \ `delete` 运算符来删除元素的内容：\n\n```\n...\n<body><p>\n   <script> \n\n      const city\
  \ = [\"Berlin\", \"Rome\"];\n      document.write(\"Array: \" + city + \"<br><br>\"\
  );\n\n      city.push(\"Bern\", \"Brussels\");\n      document.write(\"push: \"\
  \ + city + \"<br>\");\n\n      const p = city.pop();\n      document.write(\"pop:\
  \ \" + city + \"<br>\");\n      document.write(\"Removed: \" + p + \"<br><br>\"\
  );\n\n      city.unshift(\"Madrid\", \"London\");\n      document.write(\"unshift:\
  \ \" + city + \"<br>\");\n\n      const s = city.shift();\n      document.write(\"\
  shift: \" + city + \"<br>\");\n      document.write(\"Removed: \" + s + \"<br><br>\"\
  );\n\n      city.splice(2, 1, \"Prague\", \"Sofia\");\n      document.write(\"splice\
  \ to add: \" + city + \"<br>\");\n\n      city.splice(1, 2);\n      document.write(\"\
  splice to delete: \" + city + \"<br><br>\");\n\n      let cityTwo = city.toSpliced(1,\
  \ 1, \"Oslo\", \"Athens\");\n      document.write(\"add for new array: \" + cityTwo\
  \ + \"<br>\");\n\n      cityTwo = city.toSpliced(1, 1);\n      document.write(\"\
  remove for new array: \" + cityTwo + \"<br><br>\");\n\n      delete city[1];\n \
  \     document.write(\"delete: \" + city); \n\n   </script></p>\n</body></html>\
  \ \n```\n\n**清单 6.12**     array_dynamic.htm 文件\n\n创建了一个包含城市名称的数组，并对其进行了多次修改。每次修改后都会输出数组，如图\
  \ 6.10 所示。\n\n你可以使用 `push()` 方法在末尾追加一个或多个元素，追加顺序与调用时作为参数指定的顺序一致。`pop()` 方法从数组末尾删除一个元素，并将该元素作为返回值返回。\n\
  \n`unshift()` 和 `shift()` 方法在数组开头执行相同的操作。`shift()` 方法将删除的元素作为返回值返回。\n\n![添加和删除元素](img/img-f6.10.html)\n\
  \n**图 6.10**     添加和删除元素\n\n`splice()` 方法可以在任意位置修改数组。第一个参数指定开始删除或添加元素的位置，第二个参数确定要删除的元素数量，从第三个参数开始，可以指定一个或多个要添加的新元素。如果不指定新元素，则只会删除现有元素。\n\
  \n`toSpliced()` 方法的工作方式与 `splice()` 方法类似，但结果会保存到一个新数组中（此处为 `cityTwo` 数组）。\n\n`delete`\
  \ 运算符仅删除元素的内容，而不删除元素本身。这会产生一个空位，因此为了避免这种空位，可以使用 `splice()` 代替 `delete`。\n\n### 6.1.6    修改数组\n\
  \n本节包含一些可用于整体修改数组的方法。修改的结果可以保存在原数组中，也可以保存在新数组中。\n\n用于在原数组内修改的方法如下：\n\n*   `concat()`\
  \ 方法，用于连接两个数组\n*   `sort()` 方法，用于对数组进行排序\n*   `reverse()` 方法，用于反转数组元素的顺序\n*   `join()`\
  \ 方法，用于从数组元素创建字符串\n*   `copyWithin()` 方法，用于在数组内复制元素\n\n自 ECMAScript 2023 起新增的方法（结果保存到新数组中，不修改原数组）包括：\n\
  \n*   `toSorted()`，用于对数组进行排序\n*   `toReversed()`，用于反转数组元素的顺序\n*   `with()`，用于修改数组中的选定元素\n\
  \n以下是程序：\n\n```\n...\n<body><p>\n   <script> \n\n      let city = [\"Berlin\", \"\
  Rome\", \"Oslo\"];\n      document.write(\"Original: \" + city + \"<br><br>\");\n\
  \n      const cityTwo = [\"Brussels\", \"Madrid\", \"London\"];\n      city = city.concat(cityTwo);\n\
  \      document.write(\"Concatenated: \" + city + \"<br>\");\n      city.sort();\n\
  \      document.write(\"Sorted: \" + city + \"<br>\");\n      city.reverse();\n\
  \      document.write(\"Reversed: \" + city + \"<br><br>\");\n\n      const tx =\
  \ city.join(\" # \");\n      document.write(\"Concatenated to a string: \" + tx\
  \ + \"<br><br>\");\n\n      document.write(\"Previously: \" + city + \"<br>\");\n\
  \      city.copyWithin(1, 3, 5);\n      document.write(\"Internally copied: \" +\
  \ city + \"<br><br>\");\n\n      let cityThree = city.toSorted();\n      document.write(\"\
  Sorted into new array: \" + cityThree + \"<br>\");\n      cityThree = city.toReversed();\n\
  \      document.write(\"Reversed into new array: \" + cityThree + \"<br>\");\n \
  \     cityThree = city.with(2, \"Paris\");\n      document.write(\"With change into\
  \ new array: \" + cityThree); \n\n   </script></p>\n</body></html> \n```\n\n**清单\
  \ 6.13**     array_change.htm 文件\n\n同样，创建了一个包含城市名称的数组。对该数组应用了多种方法，图 6.11 显示了结果。\n\
  \n`concat()` 方法在最初创建的数组上调用，并将另一个数组的元素按指定顺序追加到该数组中。\n\n\n\n你可以使用 `sort()` 方法按字母顺序对数组进行排序。排序顺序基于\
  \ UTF-16 编码，这是一种用于 Unicode 字符的编码方式。其中，大写字母优先于小写字母，因此字符串 `oslo`（小写 `o`）会排在末尾。我在第\
  \ 6.1.8 节中描述了如何按数值对数组进行排序。\n\n`reverse()` 方法用于反转元素的顺序。由于数组之前已经排序，在这种情况下它会按相反顺序排序。\n\
  \n`join()` 方法用于将数组转换为字符串。该字符串包含数组的所有元素，每个元素之间由调用 `join()` 时作为参数指定的字符串分隔。对于反向操作（即将字符串转换为数组），可以使用\
  \ `split()` 方法（第 6.2.2 节）。\n\n`copyWithin()` 方法可以接受最多三个参数。第一个参数指定从哪个位置开始用复制的元素覆盖原数组中的元素。复制的元素按如下方式选择：第二个参数指定第一个元素的位置，第三个参数指定最后一个元素之后的位置。如果省略第三个参数，则从第一个元素开始复制所有元素。\n\
  \n![更改数组](img/img-f6.11.html)\n\n**图 6.11**     更改数组\n\n`toSorted()` 方法用于将数组的元素按字母顺序排序后保存到一个新数组中。相应地，`toReversed()`\
  \ 方法用于将数组的元素反转后保存到一个新数组中。\n\n使用 `with()` 方法时，会将一个数组保存到新数组中，并更改新数组中的某个选定元素。该方法的第一个参数指定该元素的位置，第二个参数指定其新值。\n\
  \n在这三种情况下，原始数组都不会被改变。\n\n### 6.1.7    复制数组\n\n`slice()` 方法用于从现有数组的特定（或全部）元素创建一个新数组。以下是一个示例程序：\n\
