  \n### 6.2.1    创建和检查字符串\n\n以下程序创建一个字符串并确定其长度。ECMAScript 2015 引入了`includes()`、`startsWith()`和`endsWith()`方法，你可以使用这些方法来确定一个字符串是否包含、以另一个字符串开头或结尾。\n\
