  \ 数学符号，第 2 部分\n\n## 13.6    动态生成的表达式\n\n在已完全加载的文档中动态插入数学表达式非常耗时。因此，在本节中，我使用了两个独立的文档：`location`\
  \ 对象和搜索字符串的传递（另请参见第 4 章，第 4.8 节）。\n\n数据在第一个文档中输入，然后通过 JavaScript 发送到第二个文档，在文档加载时数据将完全可用。然后，再次使用\
  \ JavaScript 将数据插入到数学表达式中。\n\n\n\n\n在本例中，计算了两个各含三个分量的向量的标量积。标量积等于对应分量乘积之和，本例中的计算结果如下：\n\
  \n```\nsp = 3.2 * (-2.6) + (-2.7) * 0.6 + 1.9 * 3.4 = -3.48 \n```\n\n输入分量并用空格分隔（参见图\
  \ 13.7）。提交后，计算结果并输出整个表达式（参见图 13.8）。\n\n![输入分量](img/img-f13.7.html)\n\n**图 13.7**    \
  \ 输入分量\n\n![计算结果与表示](img/img-f13.8.html)\n\n**图 13.8**     计算结果与表示\n\n此处展示的技术可应用于更复杂的示例，例如两个任意数量分量的向量的标量积，或两个矩阵的乘法。\n\
  \n首先，这是输入程序：\n\n```\n... <head> ...\n   <script> \n```\n\n```\n function calculate()\n\
  \      {\n         const tx1 = document.getElementById(\"idVector1\").value;\n \
  \        const v1 = tx1.split(\" \");\n         const tx2 = document.getElementById(\"\
  idVector2\").value;\n         const v2 = tx2.split(\" \");\n         if(v1.length\
  \ != 3 || v2.length != 3)\n         {\n            alert(\"There must be three components\
  \ in each case\");\n            return;\n         }\n\n         location.href =\
  \ \"mm_sp_output.htm\"\n            + \"?v10=\" + v1[0] + \"&v11=\" + v1[1] + \"\
  &v12=\" + v1[2]\n            + \"&v20=\" + v2[0] + \"&v21=\" + v2[1] + \"&v22=\"\
  \ + v2[2];\n      } \n```\n\n```\n </script>\n</head>\n<body>\n<p>Three components\
  \ of the first vector, separated by\n   spaces:<br><input size=\"20\" id=\"idVector1\"\
  ></p>\n<p>Three components of the second vector, separated by\n   spaces:<br><input\
  \ size=\"20\" id=\"idVector2\"></p>\n<p><input type=\"button\" id=\"idCalculate\"\
  \n   value=\"Calculate and display scalar product\"></p>\n<script> \n```\n\n```\n\
  \ document.getElementById(\"idCalculate\").addEventListener(\"click\", calculate);\n\
  ```\n\n```\n</script>\n</body></html> \n```\n\n**清单 13.7**     mm_sp_input.htm 文件\n\
  \n输入数据并点击按钮后，两个输入字符串按空格分割并存储到字段中。如果任一字段不包含恰好三个元素，程序将退出。利用所需的特殊字符 `?`、`&` 和 `=` 以及两个字段的内容，拼接出搜索字符串，并调用第二个文档。\n\
  \n接下来是评估程序：\n\n```\n...\n<body>\n<script> \n```\n\n```\n const v = new Array();\n\
  \   const search_field = location.search.split(\"&\");\n   for(let i=0; i<search_field.length;\
  \ i++)\n   {\n      if(i==0)\n         search_field[0] = search_field[0].substr(1);\n\
  \      const parts = search_field[i].split(\"=\");\n      v.push(parts[1]);\n  \
  \ }\n\n   document.write(\"Scalar product: <math>\");\n\n   document.write(\"<mfenced\
  \ separators=''> <mtable>\");\n   for(let i=0; i<3; i++)\n      document.write(\"\
  <mtr> <mtd> <mn>\" + v[i] + \"</mn> </mtd> </mtr>\");\n   document.write(\"</mtable>\
  \ </mfenced>\");\n\n   document.write(\"<mo>&sdot;</mo>\");\n\n   document.write(\"\
  <mfenced separators=''> <mtable>\");\n   for(let i=0; i<3; i++)\n      document.write(\"\
  <mtr> <mtd> <mn>\" + v[i+3] + \"</mn> </mtd> </mtr>\");\n   document.write(\"</mtable>\
  \ </mfenced>\");\n\n   let sp = 0;\n   for(let i=0; i<3; i++)\n      sp += v[i]\
  \ * v[i+3];\n   document.write(\"<mo>=</mo> <mn>\" + sp.toFixed(2) + \"</mn>\");\n\
  \n   document.write(\"</math>\"); \n```\n\n```\n</script>\n</body></html> \n```\n\
  \n**清单 13.8**     mm_sp_output 文件\n\n搜索字符串再次利用特殊字符进行拆分，两个向量的总共六个分量存储在一个字段中。使用 `<mfenced>`\
  \ 和 `<mtable>` 容器显示两个向量的值，计算并显示标量积。\n\n# 14 示例项目\n\n较大的项目能很好地展示 JavaScript 各种功能的交互。\n\
  \n在本章中，我将描述几个较大的示例项目。首先，你将看到三个面向实践的项目：\n\n*   金融投资价值的计算\n*   健身领域数值的计算与评估\n*   趣味跑报名，包含输入值检查\n\
  \n接着是三个游戏领域的项目：\n\n*   一款纸牌游戏，需要冷静思考后将扑克牌按特定顺序放置\n*   双人版本的记忆配对游戏\n*   技巧游戏贪吃蛇，玩家控制屏幕上的对象\n\
  \n这些程序在开发过程中也需要仔细规划，最终产品与严肃程序一样受欢迎。\n\n你可以在本书的可下载材料中找到所有程序作为附加内容，并附有大量解释性注释。通常，你可以通过这些程序理解\
  \ JavaScript 在交互中的能力，也可以根据自己的想法扩展这些程序。\n\n## 14.1 金融投资\n\n该程序位于 `investment.htm`\
  \ 文件中，页面底部显示了银行提供的各种条件。你可以输入投资金额和期望期限，点击“计算”按钮后，程序处理输入值并返回到期时的金额（参见图 14.1）。\n\n\
  ![金融投资](img/img-f14.1.html)\n\n**图 14.1**     金融投资\n\n## 14.2 健身数值\n\n你可以在 `fitness.htm`\
  \ 文件中找到该程序，页面顶部可以输入个人数据——年龄、身高、体重、静息心率和性别。\n\n点击“计算”按钮后，程序检查输入值，并使用它们根据卡沃宁公式计算身体质量指数和训练心率（参见图\
  \ 14.2）。\n\n![健身数值](img/img-f14.2.html)\n\n**图 14.2**     健身数值\n\n## 14.3 趣味跑\n\n\
  该程序位于 `fun_run.htm` 文件中，你可以输入个人数据（参见图 14.3）。姓氏、名字和同意数据存储为必填字段，并且必须选择性别、出生年份和距离，使其相互匹配。在图\
  \ 14.4 中，你可以看到可跑各种距离的展开选择菜单。\n\n在真实的趣味跑报名中，数据随后会通过 PHP 存储到 MySQL 数据库中，你可以查看已注册参与者列表以进行核对。组织者可以选择在受保护区域将所有数据从数据库导出为\
