  \ 三角函数表\n\n### 6.3.3    随机生成器与类型化数组\n\n`Math` 对象的 `random()` 方法在本书中已多次用于生成简单的随机数。这里，它被用来模拟掷骰子十次。\n\
  \n\n\n\n\n`crypto` 对象用于生成更优质的随机数，这些随机数也可用于加密目的。`crypto` 对象的 `getRandomValues()`\
  \ 方法会用随机数填充一个类型化数组。什么是类型化数组？默认情况下，JavaScript 中的变量没有数据类型，可以存储任何值（例如整数、小数、字符串、布尔值）。此外，对于存储数字，需要提供固定大小的存储区域的需求日益增长。类型化数组正是为此而创建的。\n\
  \n在下面的程序中，一个大小为 10 的 `Uint32Array` 类型的类型化数组被填充了随机数：\n\n```\n...\n<body><p>\n   <script>\
  \ \n```\n\n```\n let output = \"random(): \";\n      for(let i=0; i<10; i++)\n \
  \        output += Math.floor(Math.random() * 6 + 1) + \" \";\n\n      output +=\
  \ \"<br><br>crypto():\";\n      const za = new Uint32Array(10);\n      crypto.getRandomValues(za);\n\
  \      za.sort();\n      for(let i=0; i<za.length; i++)\n         output += \"<br>\"\
  \ + za[i];\n\n      document.write(output); \n```\n\n```\n </script></p>\n</body></html>\
  \ \n```\n\n**清单 6.29**     number_random.htm 文件\n\n`Math.random()` 方法返回一个介于 0 和\
  \ 1 之间的随机数，不包括上限 1。乘以 6 后得到介于 0 和 6 之间的值，不包括 6。加 1 后得到介于 1 和 7 之间的值，不包括 7。最后，`floor()`\
  \ 方法向下取整到最接近的整数（即得到 1 到 6 之间的值）。\n\n`za` 变量引用了一个 `Uint32Array` 类型的数组，该数组的引用作为参数传递给\
  \ `crypto` 对象的 `getRandomValues()` 方法。类型化数组在该方法中被填充，然后为了更清晰地展示而进行排序。类型化数组的 `sort()`\
  \ 方法按数值对数组进行排序，之后显示该数组。\n\n例如，程序的输出可能如图 图 6.27 所示。\n\n![随机数生成器与类型化数组](img/img-f6.27.html)\n\
  \n**图 6.27**     随机数生成器与类型化数组\n\n类型化数组有多种类型，既包括整数类型，也包括小数类型。这里只介绍 `Int32Array` 和\
  \ `Uint32Array` 类型。使用这些类型，可以在大小为 32 位 = 4 字节的存储区域中存储整数。\n\n`Int32Array` 的一个元素中可以存储从\
  \ –2,147,483,648 到 +2,147,483,647 的数字。`U` 代表无符号，`Uint32Array` 的一个元素中只能存储从 0 到 +4,294,967,295\
  \ 的正数。\n\n### 6.3.4    整数\n\n`Number` 对象提供了与 JavaScript 中数字范围和精度相关的属性和方法。此外，我还介绍了用于超大整数的\
