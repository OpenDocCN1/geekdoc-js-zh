  \ 2。\n\n### 6.1.3    数组作为参数和返回值\n\n数组可以作为参数传递给函数。传递是通过引用（按引用调用）进行的。因此，原始数组的值可以在函数中更改，无论对原始数组的引用是分配给可变变量还是不可变变量，这一点都适用。\n\
