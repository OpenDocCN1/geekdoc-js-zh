  \ css_transparency.htm 文件，上半部分\n\n首先，为 `div` 容器设置了一些常见的 CSS 属性。`change()` 函数将值 0.4\
  \ 赋给 `style` 属性的 `opacity` 子属性（参见图 8.11）。\n\n![透明度变化后](img/img-f8.11.html)\n\n**图\
  \ 8.11**     透明度变化后\n\n对于动画，`value` 变量包含该子属性的数值。`animate()` 函数以 0.01 的增量将 `value`\
  \ 变量从 1.0 更改为 0.0。动画开始时，元素完全不透明，结束时完全透明。当前透明度显示为 `div` 容器的文本内容。\n\n### 8.2.5    可见性\n\
  \n透明度为 0.0 会使元素不可见，你也可以通过使用 `visibility` CSS 属性来影响元素的可见性。`visible` 值使元素可见，而 `hidden`\
  \ 值使其不可见。不可见的元素在文档中占据空间，但不会响应 `mouseover` 或 `mouseout` 等事件。\n\n以下示例中的文档（参见图 8.12）包含两张图片。第一张图片在开始时不可见。当鼠标悬停在可见图片上时，另一张图片变为不可见。如果鼠标离开可见图片的区域，另一张图片变为可见（参见图\
  \ 8.13）。\n\n![使用 Visibility 属性控制可见性](img/img-f8.12.html)\n\n**图 8.12**     使用 Visibility\
  \ 属性控制可见性\n\n![离开第二张图片区域后](img/img-f8.13.html)\n\n**图 8.13**     离开第二张图片区域后\n\n\
  程序如下：\n\n```\n...\n<body>\n   <img src=\"im_tree.jpg\" alt=\"Tree\" id=\"idTree\"\
  \ style=\"visibility:hidden;\">\n   <img src=\"im_solar_eclipse.jpg\" alt=\"SolarEclipse\"\
  \ id=\"idSolarEclipse\">\n   <script> \n```\n\n```\n const tree = document.getElementById(\"\
  idTree\");\n      const se = document.getElementById(\"idSolarEclipse\");\n    \
  \  tree.addEventListener(\"mouseover\",\n         function() { se.style.visibility\
  \ = \"hidden\"; });\n      tree.addEventListener(\"mouseout\",\n         function()\
  \ { se.style.visibility = \"visible\"; });\n      se.addEventListener(\"mouseover\"\
  ,\n         function() { tree.style.visibility = \"hidden\"; });\n      se.addEventListener(\"\
  mouseout\",\n         function() { tree.style.visibility = \"visible\"; }); \n```\n\
  \n```\n </script>\n</body></html> \n```\n\n**清单 8.13**     css_visibility.htm 文件\n\
  \n程序创建了对两张图片的引用。通过 `mouseover` 和 `mouseout` 事件，使用匿名函数设置另一张图片的 `style` 属性的 `visibility`\
  \ 子属性的值。\n\n### 8.2.6    颜色\n\n你可以通过 `background-color` CSS 属性设置元素的背景颜色，通过 `color`\
  \ CSS 属性设置元素的文本颜色。有多种选择颜色的方法，但特别对于动画，我们建议使用 `rgb()` 公式来赋值。颜色的红、绿、蓝分量可以使用 0 到 255\
  \ 之间的值。\n\n在图 8.14 中，你可以看到深灰色 `div` 容器中的浅灰色文字。\n\n![文本颜色和背景颜色](img/img-f8.14.html)\n\
  \n**图 8.14**     文本颜色和背景颜色\n\n程序的第一部分如下：\n\n```\n...\n<body>\n   <p><input id=\"\
