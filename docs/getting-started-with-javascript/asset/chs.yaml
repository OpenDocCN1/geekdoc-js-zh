  \ 函数将这些比例从 64 到 192 以 1 为增量进行变化。这些值直接用于改变背景颜色，而文本颜色则按相反顺序变化。由于使用了三个变量，你可以为动画设置任意的起始和结束颜色。\n\
  \n![更改颜色后](img/img-f8.15.html)\n\n**图 8.15**     更改颜色后\n\n## 8.3    其他选项\n\n本节包含使用前述属性的其他程序。\n\
  \n### 注意\n\n`style` 属性的子属性名称与相关 CSS 属性的名称非常相似。如果 CSS 属性名称包含连字符，则连字符会被省略，且后面的字母大写。以下两个示例：`border-width`（总边框宽度）变为\
  \ `borderWidth`，`border-top-width` 变为 `borderTopWidth`。如果 CSS 属性的值由多个数值组成，则在 JavaScript\
  \ 中表示为字符串。\n\n### 8.3.1    图像切换时的透明度\n\n在以下程序中，两张图像被放置在同一位置。第一张图像显示时不设置透明度（参见图 8.16），第二张图像的透明度为\
  \ 0.0（即初始时完全透明）。\n\n点击“动画”按钮会改变透明度值。第一张图像逐渐变得透明，第二张图像逐渐变得不透明（参见图 8.17）。这样便实现了动画图像切换——最终只有第二张图像可见（参见图\
  \ 8.18）。\n\n![第一张图像可见，第二张图像透明](img/img-f8.16.html)\n\n**图 8.16**     第一张图像可见，第二张图像透明\n\
  \n![从第一张图像过渡到第二张图像](img/img-f8.17.html)\n\n**图 8.17**     从第一张图像过渡到第二张图像\n\n![第二张图像可见，第一张图像透明](img/img-f8.18.html)\n\
  \n**图 8.18**     第二张图像可见，第一张图像透明\n\n以下是程序：\n\n```\n... <head> ...\n   <script> \n\
  \ let reference, value = 1;\n      function animate()\n      {\n         if (value\
  \ <= 0)\n            clearInterval(reference);\n         else\n         {\n    \
  \        value -= 0.01;\n            pa.style.opacity = value;\n            se.style.opacity\
  \ = 1 - value;\n         }\n      } \n </script>\n</head>\n<body>\n   <p><input\
  \ id=\"idAnimate\" type=\"button\" value=\"Animate\"></p>\n   <img src=\"im_paradise.jpg\"\
