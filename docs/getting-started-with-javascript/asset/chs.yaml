  \   <p id=\"idData\"> </p>\n   <script> \n      document.getElementById(\"idLink0\"\
  ).addEventListener\n         (\"click\", function() { request(0); } );\n      document.getElementById(\"\
  idLink1\").addEventListener\n         (\"click\", function() { request(1); } );\
  \ \n   </script>\n</body></html> \n```\n\n**清单 7.9**     ajax_xml_collection.htm\
