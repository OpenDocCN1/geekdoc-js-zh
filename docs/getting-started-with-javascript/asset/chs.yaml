  **图 2.24**     程序响应\n### 三个提示\n*   在编程工作开始时，`while` 或 `do` ... `while` 循环的条件以及 `for`\
  \ 循环第二部分中的条件会带来一定挑战。请记住，这是一个运行条件，而不是终止条件，因此并非条件满足时循环就立即终止。只要条件成立，循环就会继续运行。\n*  \
  \ `for` 循环或 `while` 循环的开头后面不能跟分号，因此不应写成 `for(let i = 1; i <= 5; i++);` 或 `while(a\
  \ > b);`。这会导致循环立即终止，后续语句只执行一次。这种错误很难发现。\n*   相反，`do` ... `while` 循环的结尾后面必须跟分号。\n\
