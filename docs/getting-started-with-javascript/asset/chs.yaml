  \ 10.5 的八种不同几何形状。它们还可以被动画移动和旋转。\n\n# 11 jQuery\n\njQuery 库中与浏览器无关的标准化方法已成为许多网站不可或缺的一部分。\n\
  \njQuery 是使用最广泛的 JavaScript 库，并被用作许多内容管理系统和 Web 框架（如 Joomla 和 WordPress）的基础。jQuery\
  \ 提供了便捷、与浏览器无关的方法，用于处理 CSS、Ajax 和动画等。我在本章的示例中使用了当前（截至 2024 年 8 月）版本 3.7.1。\n\n包含整个库的\
  \ `jquery-3.7.1.min.js` 文件仅有 86 KB。你可以在本书的可下载资料中找到它以及示例文件。\n\n如果你想下载任何更新的版本，应访问\
  \ [`jquery.com`](https://jquery.com)。你可以通过压缩生产术语在下载页面上找到此处使用的文件。在以下示例中，我假设该文件与示例文件位于同一目录中。\n\
  \n## 11.1 结构\n\n通过一个初始示例，我将解释使用 jQuery 的不同方式。图 11.1 显示了一个文件，其中包含一个带有文本的段落和三个带有超链接的段落。\n\
  \n点击各个超链接后，由于使用了 jQuery，第一个段落的内容会发生变化，如图 11.2、图 11.3 和图 11.4 所示。\n\n![第一个 jQuery\
  \ 文件](img/img-f11.1.html)\n\n**图 11.1**     第一个 jQuery 文件\n\n![第一次更改](img/img-f11.2.html)\n\
  \n**图 11.2**     第一次更改\n\n![第二次更改](img/img-f11.3.html)\n\n**图 11.3**     第二次更改\n\
