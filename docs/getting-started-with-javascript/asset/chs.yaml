  \n在`mouse()`函数中输出三条信息：\n\n*   鼠标事件的名称\n\n*   鼠标事件发生位置在元素内的相对坐标（`offsetX`和`offsetY`）\n\
  \n*   相关`img`元素中显示的图像文件的名称\n\n你应该测试所有可能的事件，并记录事件的位置、相关信息以及信息出现的时间。\n\n### 注意\n\n\
