  \ value=\"Retrieve\">\n   </form>\n   <script> \n```\n\n```\n document.getElementById(\"\
  idRetrieve\").addEventListener(\"click\", retrieve);\n```\n\n```\n </script>\n</body></html>\
  \ \n```\n\n**清单 5.2**    dom_retrieve.htm 文件\n\n该文档的 HTML 部分包含三个 `p` 容器，因此 `parArray`\
  \ 字段有三个元素。\n\n你可以通过 `node` 对象的 `firstChild` 属性访问节点的第一个子节点。这三个段落各自只有一个文本节点作为子节点。\n\
  \n`node` 对象的 `nodeValue` 属性提供关联的文本作为值。调用 `getAttribute(\"style\")` 方法返回 HTML 元素节点的\
