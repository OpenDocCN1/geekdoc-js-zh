  \n在名字（first name）的输入元素中，使用 `placeholder` 属性以浅灰色显示占位符。占位符用于解释输入字段，如果在输入字段中开始输入内容，占位符就会消失。\n\
  \n调用程序后，由于 `autofocus` 属性，输入光标会自动出现在姓氏（family name）的输入元素中。你可以立即在那里开始输入数据，如果该元素中已有文本，则会被完全选中。\n\
  \n长期以来，可以通过将 `type` 属性设置为 `hidden` 来隐藏输入字段。这样，可以将使用过程中不应可见的附加数据传输到 Web 服务器。\n\n\
  `type` 属性的 `search` 值标识一个输入字段，该字段可被识别为典型的搜索字段。它还可以包含一个用于删除搜索词条的图标。\n\n搜索字段可以具有额外的\
  \ `list` 属性，其值对应于一个包含预定义条目的列表的 ID，这些条目可以在操作搜索字段时选择（另请参见图 4.21）。一旦在搜索字段中输入字符，列表中只会显示包含这些字符的条目。也可以输入其他搜索词。该列表使用\
  \ `datalist` 容器创建，每个条目代表一个 `option` 标签的 `value` 属性的值。\n\n![带有列表的搜索字段](img/img-f4.21.html)\n\
  \n**图 4.21**     带有列表的搜索字段\n\n`type` 属性的 `color` 值表示用于设置颜色的输入字段。选择输入字段后，会打开一个带有设置选项的对话框（另请参见图\
  \ 4.22）。\n\n![设置颜色](img/img-f4.22.html)\n\n**图 4.22**     设置颜色\n\n在 `type` 属性值为\
  \ `email` 的输入字段中可以输入电子邮件地址。该字段可以为空，如果不为空，则必须包含电子邮件地址的最基本组成部分，否则表单将无法提交。如果添加了值为 `multiple`\
  \ 的 `multiple` 属性，则可以输入多个地址，用逗号分隔。\n\n对于 `type` 属性值为 `url` 的输入字段，情况类似。该字段可以为空，如果不为空，则必须包含\
  \ URL 的最基本组成部分，否则表单将无法提交。但是，不能输入多个 URL。\n\n用于输入电话号码的元素具有 `type` 属性的 `tel` 值。它可以提供访问现有电话列表的选项。\n\
  \n`pattern` 属性用于使用正则表达式验证输入。如果输入的内容与模式不匹配，则无法提交表单。\n\n这里我们有一个车牌号的示例。我们假设它由两位数字开头，第一位不能是\
  \ 0。后面跟着一个大写字母、一个空格和另一个大写字母。最后是 1 或 2 位数字。有关正则表达式的更多信息，请参阅本书可下载材料中的附加章节 2，网址为 [www.rheinwerk-computing.com/5875](http://www.rheinwerk-computing.com/5875)。\n\
  \n提交后，会调用 `submit()` 函数。所有值都通过 `value` 属性显示。\n\n### 4.9.2    数字输入元素\n\n本节介绍一些可用于安全输入和清晰表示数值的元素（参见图\
