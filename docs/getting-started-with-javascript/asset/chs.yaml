  \ 3.10.2    创建和比较对象引用\n\n如果将引用对象的变量赋值给另一个变量，并不会创建新对象或原始对象的副本，而只是创建了对同一对象的第二个引用。然后你可以通过这两个变量访问同一个对象（另请参见图\
