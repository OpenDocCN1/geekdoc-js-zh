  \n**图 3.14**     原始副本与深拷贝\n\n# 4    表单与事件\n\n在本章中，你将学习如何检查表单和处理事件。\n\n表单能够实现类似于你在计算机上其他应用程序中习惯的交互。你可以进行输入并触发处理，然后程序返回结果。\n\
  \n表单也用于将数据传输到 Web 服务器。在发送之前，可以通过 JavaScript 检查其内容的有效性。这避免了不必要的网络流量。\n\nJavaScript\
  \ 还允许你编写能够响应浏览器事件的程序。通过这种方式，你可以与程序进行交互，而不仅仅是 `prompt()` 和 `confirm()` 函数的简单返回值。这些事件可能涉及按钮点击、从列表中选择条目、使用鼠标的特定操作、表单提交等等。\n\
  \n如果你希望程序响应某个事件，你需要开发包含在事件发生时必须执行的语句的 JavaScript 程序代码。事件处理程序用于处理事件；它在事件触发的文档部分、事件本身以及\
  \ JavaScript 程序代码之间建立联系。\n\n## 4.1    第一个表单和第一个事件\n\n在本节中，你将了解处理事件所需的一些典型元素。\n\n\
  以下示例展示了一个包含输入字段 Input 和按钮 Click 的表单。在输入字段中输入文本后，你必须点击按钮（参见图 4.1），然后会出现一个包含信息的对话框（参见图\
  \ 4.2）。\n\n![带输入字段和按钮的表单](img/img-f4.1.html)\n\n**图 4.1**     带输入字段和按钮的表单\n\n![对事件的响应](img/img-f4.2.html)\n\
  \n**图 4.2**     对事件的响应\n\n你也可以使用输入字段在已完全映射的文档中后续输出信息。在示例中，输出字段中显示的信息与对话框中的相同（参见图\
  \ 4.3）。你可以使用 `disabled` 属性确保无法在此字段中进行输入。\n\n![输出字段](img/img-f4.3.html)\n\n**图 4.3**    \
  \ 输出字段\n\n以下是程序：\n\n```\n... <head> ...\n   <script> \n function clicked()\n   \
  \   {\n         const inputField = document.getElementById(\"idInput\");\n     \
  \    const input = inputField.value;\n         alert(\"Click: \" + input);\n   \
  \      const outputField = document.getElementById(\"idOutput\");\n         outputField.value\
  \ = \"Click: \" + input;\n      } \n </script>\n</head>\n<body>\n   <form>\n   \
  \   <p><input id=\"idInput\"> Input</p>\n      <p><input id=\"idButton\" type=\"\
  button\" value=\"Click\"></p>\n      <p><input id=\"idOutput\" disabled> Output</p>\n\
  \   </form>\n   <script> \n const bu = document.getElementById(\"idButton\");\n\
  \      bu.addEventListener(\"click\", clicked); \n </script>\n</body></html> \n\
  ```\n\n**清单 4.1**     form_click.htm 文件\n\n表单的元素位于 `form` 容器中，而 `input` 类型的简单元素对应单行输入字段。如果为\
  \ `input` 元素的 `type` 属性指定了 `button` 值，则会显示一个按钮，并且 `value` 属性的值对应按钮上的文本。\n\n`id`\
  \ 属性的值作为文档中元素的唯一标识符（ID）。该 ID 用于访问元素并与 JavaScript 程序代码连接。\n\n在下面的 `script` 容器中，调用了\
  \ `document` 对象的 `getElementById()` 方法。它期望一个元素的 ID 作为参数，并返回一个引用，该引用指向表示该元素的对象。在示例中，该引用保存在\
  \ `bu` 变量中，因此 `bu` 引用了按钮。\n\n事件监听器检测事件并对其做出响应，而 `element` 对象的 `addEventListener()`\
  \ 方法将文档中的元素与特定事件以及命名函数或匿名函数的引用链接起来。在本例中，这意味着点击 `bu` 按钮会触发 `click` 事件，从而调用命名函数 `clicked()`。\n\
  \n在 `clicked()` 函数中，`inputField` 变量引用了输入字段。输入字段的 `value` 属性包含输入的文本，该文本显示在对话框中。\n\
  \n`outputField` 变量引用了用于输出的输入字段。`value` 属性也可以被赋值，从而改变输入字段的内容。\n\n### 注意\n\n你可以在本书的下载材料中找到\
  \ `u_form` 练习，位于附加章节 1 的第 1.11 节，下载地址为 [www.rheinwerk-computing.com/5875](http://www.rheinwerk-computing.com/5875)。\n\
  \n### 注意\n\n自 JavaScript 早期以来，文档元素与程序代码之间的连接使用了不同的技术。现代浏览器熟悉 `getElementById()`\
  \ 和 `addEventListener()` 方法及其多种用途。\n\n## 4.2    提交与重置\n\n对于表单，可能会发生提交和重置事件。可以使用表单将数据提交到\
  \ Web 服务器，而重置过程会将表单的值设置为其初始值。\n\n以下示例响应这两个事件。此外，表单的内容被发送到一个包含 PHP 程序的文件，该程序位于 Web\
  \ 服务器上并进一步处理数据。在此示例中，传输的数据仅显示在屏幕上。\n\n\n\n\nPHP 是一种广泛用于 Web 服务器的编程语言，但你无需学习 PHP\
  \ 也能理解本示例。这里只是要阐明完整的流程。\n\n### 4.2.1    提交过程\n\n在图 4.4 中，你可以看到对 `form_submit.htm`\
  \ 文件的调用。与之前的示例一样，它是从 JavaScript 程序的目录中调用的。在我的例子中，该目录是 `C:\\js`。\n\n![从目录调用表单](img/img-f4.4.html)\n\
  \n**图 4.4**     从目录调用表单\n\n图 4.5 展示了 JavaScript 对提交的响应。\n\n![JavaScript 对提交的响应](img/img-f4.5.html)\n\
  \n**图 4.5**     JavaScript 对提交的响应\n\n由于整个过程并非在 Web 服务器上进行，因此无法正确调用 PHP 文件。只会显示你的代码（参见图\
