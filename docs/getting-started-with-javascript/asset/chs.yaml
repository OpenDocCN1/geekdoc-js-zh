  \ [www.rheinwerk-computing.com/5875](http://www.rheinwerk-computing.com/5875)）的附加章节\
  \ 3 中，您可以找到一些包含第 6 章各元素的示例项目。\n\n# 7    使用 Ajax 进行更改\n\nAjax 技术使得无需完全重建显示的文档，即可用来自\
  \ Web 服务器的数据交换网站的部分内容。\n\n异步 JavaScript 与 XML（Ajax）提供了浏览器与 Web 服务器之间的异步数据传输。它允许您更改网站的部分内容，而无需重新创建并提交整个文档，从而降低了开发成本和网络流量，使网站更快、更灵活。Ajax\
  \ 技术是许多网站的标准组件。\n\n其过程如下：由于某个事件，从网站向 Web 服务器发送请求，Web 服务器返回响应。响应在仍在显示的文档中进行分析，分析结果导致文档的一部分被更改。整个流程的核心组件是\
  \ `XMLHttpRequest` 类型的对象。\n\n本章中的所有文档均通过 Web 服务器访问，您从该服务器请求数据以插入到页面中。在本章中，我通过我的域名\
  \ [theisweb.de](http://www.theisweb.de) 从 jse 目录中检索文档。数据可以以多种形式存在于 Web 服务器上：\n\n\
  *   作为 PHP 程序（第 7.1 节）\n\n*   作为文本文件中的文本（如第 7.1 节末尾所示）\n\n*   作为 XML 文件（第 7.3 节）\n\
  \n*   作为文本文件中的 JSON 对象（第 7.4 节）\n\n## 7.1    Hello Ajax\n\n通过第一个示例 `Hello Ajax`，我将解释适用于整章的基本流程。\n\
  \n在该示例中，显示了一个包含超链接的 HTML 文档（参见图 7.1）。此处，超链接并不引用其他文档，因此超链接目标仅由 `#` 字符组成。相反，超链接用于触发事件。\n\
  \n![永久显示的文档](img/img-f7.1.html)\n\n**图 7.1**     永久显示的文档\n\n该文档包含另一个段落。点击超链接会向 Web\
  \ 服务器发送请求，服务器响应返回一段文本，该文本成为段落的内容，并显示在文档中，如图 7.2 所示。文档的其余部分保持不变。\n\n![从 PHP 文件补充的文档](img/img-f7.2.html)\n\
  \n**图 7.2**     从 PHP 文件补充的文档\n\n首先，我们来看包含 JavaScript 代码的 HTML 文档：\n\n```\n... <head>\
  \ ...\n   <script> \n```\n\n```\n function request()\n      {\n         const req\
  \ = new XMLHttpRequest();\n         req.open(\"get\", \"ajax_hello.php\", true);\n\
  \         // req.open(\"get\", \"ajax_hello.txt\", true);\n         req.onreadystatechange\
  \ = evaluate;\n         req.send();\n      }\n\n      function evaluate(e)\n   \
  \   {\n         if(e.target.readyState == 4 && e.target.status == 200)\n       \
  \     document.getElementById(\"idParagraph\") \n               .firstChild.nodeValue\
  \ = e.target.responseText;\n      } \n```\n\n```\n </script>\n</head>\n<body>\n\
  \   <p><a id=\"idLink\" href=\"#\">请点击</a></p>\n   <p id=\"idParagraph\"> </p>\n\
  \   <script> \n```\n\n```\n document.getElementById(\"idLink\").addEventListener(\"\
  click\", request); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 7.1**    \
  \ ajax_hello.htm 文件\n\n此外，以下是响应的 PHP 程序：\n\n```\n<?php\n   header(\"Content-type:\
  \ text/html; charset=utf-8\");\n   echo \"PHP 文件：Hello Ajax\";\n?> \n```\n\n**清单\
  \ 7.2**     ajax_hello.php 文件\n\n`ajax_hello.htm` 文件包含超链接和段落，点击超链接会调用 `request()`\
  \ 函数。首先，创建一个新的 `XMLHttpRequest` 对象。\n\n该对象的 `open()` 方法打开与 Web 服务器上另一个文件的通信，此处为\
  \ `ajax_hello.php`，使用 `GET` 方法。`open()` 方法的第三个参数通常设置为 `true`。这确保了通信以异步方式处理，意味着其他进程无需等待请求结束。\n\
  \n`onreadystatechange` 事件处理程序被赋予一个对命名函数或匿名函数的引用，此处为 `evaluate()` 函数。发送后，`XMLHttpRequest`\
  \ 对象会多次改变其状态，事件处理程序响应此更改事件。简而言之，每次状态改变时都会调用 `evaluate()` 方法。\n\n`XMLHttpRequest`\
  \ 对象的 `send()` 方法将请求发送到 Web 服务器。最初不会传输其他数据，并且传输应在注册事件处理程序之后进行。这样，就不会有任何事件被遗漏。\n\n\
  \n\n\n一个事件对象被传递给 `evaluate()` 方法，该对象的 `target` 属性引用了 `XMLHttpRequest` 对象。首先，会检查它的\
  \ `readystate` 和 `status` 属性。只有当 `readystate` 取值为 `4` 且 `status` 取值为 `200` 时，评估才有意义。`status`\
  \ 属性表示超文本传输协议（HTTP）状态码的值。200 表示成功，404 表示页面未找到，500 表示服务器内部错误，以此类推。\n\n`XMLHttpRequest`\
  \ 对象的 `responseText` 属性包含来自 Web 服务器的响应——在本例中，是 `Hello Ajax` 文本，该文本通过 PHP 关键字 `echo`\
  \ 输出。这段文本被设置为段落的新内容。\n\n你也可以从 Web 服务器请求一个文本文件的内容，并将其插入到现有文档中。为此，你需要交换 `request()`\
  \ 函数中 `open()` 方法的调用（即，为第二行设置注释字符，并为第三行取消注释）。文本文件内容如下：\n\n```\nTXT 文件: Hello Ajax\
  \ \n```\n\n**清单 7.3**     ajax_hello.txt 文件\n\n### 注意\n\n以下内容适用于浏览器与 Web 服务器之间的传输：\n\
  \n*   通信通过 HTTP 进行规范。HTTPS 是 HTTP 的安全加密演进版本。\n*   浏览器向 Web 服务器发出的请求用于请求数据，而响应则是\
  \ Web 服务器对浏览器的回答。\n*   请求有多种方法。GET 方法传输较小数据量（最多 255 字节），而 POST 方法传输较大数据量。\n\n##\
  \ 7.2    发送参数\n\n本节包含一个示例，其中参数被发送到 Web 服务器。PHP 程序的响应取决于这些参数中的数据。\n\n显示一个包含两个超链接和一个空段落的\
  \ HTML 文档（参见图 7.3）。\n\n![带参数调用](img/img-f7.3.html)\n\n**图 7.3**     带参数调用\n\n当你点击第一个超链接时，系统请求人员编号为\
  \ 6714 的人员数据；当你点击第二个超链接时，系统请求人员编号为 81343 的人员数据。随后，该人员的数据会显示在超链接下方（参见图 7.4 和图 7.5）。\n\
  \n![人员编号 6714 的全部数据](img/img-f7.4.html)\n\n**图 7.4**     人员编号 6714 的全部数据\n\n![人员编号\
  \ 81343 的部分数据](img/img-f7.5.html)\n\n**图 7.5**     人员编号 81343 的部分数据\n\n首先来看包含 JavaScript\
  \ 代码的 HTML 文档：\n\n```\n... <head> ...\n   <script> \n \n function request(personnel_number,\
  \ scope)\n      {\n         const req = new XMLHttpRequest();\n         req.open(\"\
  get\", \"ajax_parameters.php?pno=\" + personnel_number\n            + \"&scope=\"\
  \ + scope, true);\n         req.setRequestHeader(\"Content-Type\",\n           \
