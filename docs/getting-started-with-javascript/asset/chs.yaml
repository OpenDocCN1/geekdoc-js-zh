  </body></html> \n```\n\n**清单 4.4**     `form_text.htm` 文件\n\n表单的结构如下：\n\n`input`\
  \ 元素的 `type` 属性的 `password` 值将该元素转换为密码输入字段。只能识别输入的字符数——字符本身无法读取。\n\n使用 `textarea`\
  \ 容器显示多行输入字段。字段的大小最初取决于 `rows` 和 `cols` 属性的值，但通常可以在浏览器中更改。与单行输入字段一样，可以通过 `value`\
  \ 属性在 JavaScript 中访问该条目。\n\n姓氏和密码的两个输入字段具有 `required` 属性，其值为 `required`，因此这些字段不能留空。如果两个输入字段都不为空，则会触发\
  \ `submit` 事件。\n\n事件处理程序中的过程如下：\n\n1.  `addEventListener()` 方法直接针对表单的引用调用，在后续的大多数示例中也使用这种简写表示法。\n\
  \n2.  将事件链接到函数时传递参数只能通过匿名函数实现。在此示例中，参数是对 `event` 对象的引用，当事件发生时，该对象会自动提供更多信息。按照惯例，该引用被命名为\
  \ `e`。\n\n3.  在匿名函数中，调用名为 `submit()` 的函数。匿名函数的参数被依次传递，`submit()` 函数向匿名函数返回一个真值。如果该值为\
  \ `false`，则表单不会提交。\n\n`submit()` 函数中的过程如下：\n\n1.  在 `submit()` 函数中，通过直接针对输入字段的引用调用\
  \ `value` 属性来确定输入的密码。这也是一种简写表示法，在后续示例中也会使用。\n\n2.  字符串的 `length` 属性包含字符串中的字符数。有关字符串的更多信息，请参见第\
  \ 6 章的第 6.2 节。如果密码太短或太长，`submit()` 函数返回值 `false` 并显示错误消息。\n\n3.  此外，还会调用 `event`\
  \ 对象的 `preventDefault()` 方法，以便不执行该元素的默认操作（在本例中为提交表单）。\n\n4.  如果密码长度正确，则会显示三个条目，`submit()`\
  \ 函数返回值 `true`，并且表单被提交。\n\n## 4.4    单选按钮和复选框\n\n一组单选按钮允许用户选择不同的选项，而复选框允许用户进行额外选择。你可以使用\
