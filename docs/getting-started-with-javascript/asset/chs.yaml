  \ 5 描述了另外三个使用 Onsen UI 库的程序。它们描述了显示多页文档的不同方法。\n\n# 13    使用 MML 和 MathJax 的数学表达式\n\
  \n你可以使用 MathML、MathJax 和 JavaScript 动态且交互地创建数学公式。\n\n你可以使用数学标记语言（MathML）将数学表达式集成到文档中。与\
  \ JavaScript 结合使用时，你还有更多动态和交互设计的可能性。W3C 于 2014 年 4 月发布了 MathML 3.0 标准第二版的推荐。MathML\
  \ 是 HTML 第 5 版的一部分，自 2015 年起已成为 ISO 标准。\n\n不幸的是，MathML 在某些浏览器中不会立即被处理。然而，JavaScript\
  \ 库 MathJax（[`www.mathjax.org`](https://www.mathjax.org)）使得 MathML 能够在所有现代浏览器中实现，因此我们在本章的示例程序中包含了\
  \ MathJax 库。\n\n## 13.1    基本元素\n\n以下程序展示了数学表达式结构的重要基本元素：\n\n```\n... <head> ...\n\
  \   <script id=\"MathJax-script\" async src=\"https://cdn.jsdelivr.net/\n      \
  \     npm/mathjax@3/es5/tex-mml-chtml.js\"></script>\n</head>\n<body>\n<p> 标识符、运算符、数字：\n\
  \    <math>\n       <mi>a</mi>\n       <mo>+</mo>\n       <mn>2.5</mn>\n       <mo>=</mo>\n\
  \       <mn>3</mn>\n       <mi>a</mi>\n       <mi>b</mi>\n    </math>\n</p>\n<p>\
  \ 平方根：\n    <math>\n        <msqrt> <mi>a</mi> <mo>+</mo> <mn>2.5</mn> </msqrt>\n\
  \    </math> </p>\n<p> 根：\n    <math> <mroot> <mi>b</mi> <mn>3</mn> </mroot> </math>\
  \ </p>\n<p> 下标：\n    <math> <msub> <mi>a</mi> <mn>2</mn> </msub> </math> </p>\n\
  <p> 上标：\n    <math> <msup> <mi>b</mi> <mn>-3.5</mn> </msup> </math> </p>\n<p> 下标和上标：\n\
  \    <math>\n        <msubsup> <mi>c</mi> <mn>0</mn> <mn>2</mn> </msubsup>\n   \
  \ </math> </p>\n<p> 格式：\n    <math mathbackground=\"#909090\" mathcolor=\"#ffffff\"\
  \ mathsize=\"16pt\">\n        <msqrt> <mi>a</mi> <mo>+</mo> <mn>2.5</mn> </msqrt>\n\
  \    </math> </p>\n</body></html> \n```\n\n**清单 13.1**     `mm_basic_element.htm`\
  \ 文件\n\nMathJax 库的在线版本包含在文件的头部。地址应该是连续的，并且在一行内。这里由于打印原因分为两行。我们使用 `async` 关键字来确保在构建文档其余部分的同时并行请求在线库。本章其他程序的集成方式相同，因此我们不再重复展示。\n\
  \n数学表达式和公式的所有元素都位于 `<math>` 容器内，而该容器又位于页面的普通文本和 HTML 代码中。\n\n\n\n\n你只需在一个简单的数学表达式中依次编写各个元素。数学标识符存储在\
  \ `<mi>` 容器中，运算符存储在 `<mo>` 容器中，数值存储在 `<mn>` 容器中。在数学中，表达式 `3ab` 默认表示乘法 `3 * a * b`，且不带任何乘号。标识符\
  \ `a` 和 `b` 是分开的，每个都位于各自的 `<mi>` 容器中。\n\n为了更清晰地概览，你会以更紧凑的形式编写许多以下 MathML 容器，因此嵌入的容器不再位于文件中的独立行中。\n\
  \n你使用 `<msqrt>` 容器来显示平方根。你将所谓的被开方数写在根号下；它是被开方的值。对于平方根，它可以是一个单独的标识符或数字，但也可以是一个更长的表达式，其元素依次编写。\n\
  \n你使用 `<mroot>` 容器来显示一般根。与 `<msqrt>` 容器不同，我们必须在 `<mroot>` 容器内编写两个元素：首先是被开方数（此处为\
  \ `b`），然后是根指数（此处为 `3`）。如果这两个元素之一由更长的表达式组成，则必须先将该表达式汇总。你可以使用 `<mrow>` 容器（第 13.3 节）来做到这一点，并且这个汇总规则也适用于后续示例中的许多容器。\n\
  \n你通过使用 `<msub>` 容器来编写标识符的下标。容器内必须有两个元素：首先是标识符，然后是下标。你通过使用 `<msup>` 容器来创建带指数的表达式，容器内也必须有两个元素：底数和指数。你通过使用\
  \ `<msubsup>` 容器来编写同时包含下标和指数的表达式。容器内必须有三个元素：标识符、下标和指数。\n\n对于 `<math>` 容器以及许多用于单个元素的容器，你可以通过\
  \ `mathbackground`、`mathcolor` 和 `mathsize` 属性来设置背景颜色、字体颜色和字体大小。\n\n数学表达式显示在图 13.1\
  \ 中。\n\n![MathML 基本元素](img/img-f13.1.html)\n\n**图 13.1**     MathML 基本元素\n\n## 13.2    括号与表格\n\
  \n在数学表达式中，子表达式通过括号组合在一起，以便优先计算。MathML 使用括号来直观地表示这种运算顺序。括号也是汇总表达式所必需的，并且用于表示向量或矩阵。你可以使用任何括号字符，并处理多个括号层级。\n\
  \n你可以使用表格来清晰地表示二维结构。在此示例中，使用表格显示了一个矩阵和一个方程组。\n\n首先来看示例程序：\n\n```\n...\n<body>\n\
  <p> 单层括号：\n    <math> <mfenced separators=\"\">\n              <mi>a</mi> <mo>+</mo>\
  \ <mi>b</mi>\n           </mfenced> </math> </p>\n<p> 双层括号：\n    <math>\n      <mfenced\
  \ open=\"{\" close=\"}\" separators=\"\">\n        <mfenced separators=\"\"> <mi>a</mi>\
  \ <mo>+</mo>\n                                <mi>b</mi> </mfenced>\n        <mfenced\
  \ separators=\"\"> <mi>c</mi> <mo>+</mo>\n                                <mi>d</mi>\
  \ </mfenced>\n      </mfenced>\n    </math> </p>\n<p> 表格，用于方程组：\n    <math> <mtable>\n\
  \              <mtr>\n                 <mtd> <mn>1.5</mn> <mo>+</mo> <mi>a</mi>\
  \ </mtd>\n                 <mtd> <mo>=</mo> </mtd>\n                 <mtd> <mi>b</mi>\
  \ </mtd>\n              </mtr>\n              <mtr>\n                 <mtd> <mi>a</mi>\
  \ </mtd>\n                 <mtd> <mo>=</mo> </mtd>\n                 <mtd> <mn>4.2</mn>\
  \ <mo>-</mo> <mi>b</mi> </mtd>\n              </mtr>\n           </mtable> </math>\
  \ </p>\n<p> 表格，用于矩阵：\n    <math> <mi>X</mi> <mo>=</mo>\n      <mfenced separators=\"\
  \">\n        <mtable>\n          <mtr> <mtd> <mn>1.5</mn> </mtd> <mtd> <mi>a</mi>\
  \   </mtd> </mtr>\n          <mtr> <mtd> <mi>b</mi>   </mtd> <mtd> <mn>2.8</mn>\
  \ </mtd> </mtr>\n        </mtable>\n      </mfenced>\n    </math> </p>\n</body></html>\
  \ \n```\n\n**清单 13.2**     mm_parenthesis_table.htm 文件\n\n你可以使用 `<mfenced>` 容器来显示一对带括号的定界符。元素在容器内依次编写，`separators`\
  \ 属性的值表示用于分隔各个元素的字符串。默认情况下，该字符串是逗号字符。在此示例中，它是一个空字符串。\n\n你可以使用嵌套的 `<mfenced>` 容器来实现多个括号层级，并且\
  \ `open` 和 `close` 属性允许你为每对括号定义两个字符串，分别用作左括号和右括号。\n\nMathML 表格的结构和用途与 HTML 表格类似。表格使用\
  \ `<mtable>` 容器，表格内的行使用 `<mtr>`，行内的数据单元格使用 `<mtd>`。\n\n在第一个表格示例中，两个方程式的左侧、等号和右侧借助表格上下对齐显示。你可以像第二个表格示例那样，将整个表格放在括号内。这样可以将数据显示为矩阵。\n\
  \n在图 13.2 中，你可以看到带括号和表格的数学表达式。\n\n![括号与表格](img/img-f13.2.html)\n\n**图 13.2**    \
  \ 括号与表格\n\n## 13.3    汇总表达式\n\n`<mrow>` 容器允许你将一个较长的表达式汇总为单个元素。许多容器要求对其元素执行此操作。\n\
  \n你可以使用 `<munderover>` 容器在字符下方和上方输入必要的信息。例如，这些可以是积分、求和或乘积的符号。\n\n下面是一些示例：\n\n\n\n\
  \n\n```\n...\n<body>\n<p>创建平方根的摘要：\n    <math> <mroot>\n              <mrow> <mi>a</mi>\
  \ <mo>+</mo> <mn>2.5</mn> </mrow> <mn>3</mn>\n           </mroot> </math> </p>\n\
  <p>积分：\n    <math> <munderover>\n              <mo>&int;</mo> <mn>0</mn> <mn>1</mn>\n\
  \           </munderover>\n           <mi>x</mi> <mi>d</mi> <mi>x</mi> </math> </p>\n\
  <p>创建求和的摘要：\n    <math> <munderover>\n              <mo>&sum;</mo>\n           \
  \   <mrow> <mi>k</mi> <mo>=</mo> <mn>3</mn> </mrow>\n              <mn>5</mn>\n\
  \           </munderover>\n           <mi>k</mi> <mo>=</mo>\n             <mn>3</mn>\
  \ <mo>+</mo> <mn>4</mn> <mo>+</mo> <mn>5</mn>\n           <mo>=</mo> <mn>12</mn>\
  \ </math> </p>\n<p>创建乘积的摘要：\n    <math> <munderover>\n              <mo>&prod;</mo>\n\
  \              <mrow> <mi>k</mi> <mo>=</mo> <mn>3</mn> </mrow>\n              <mn>5</mn>\n\
  \           </munderover>\n           <mi>k</mi> <mo>=</mo> <mn>3</mn> <mo>&sdot;</mo>\n\
  \             <mn>4</mn> <mo>&sdot;</mo> <mn>5</mn>\n           <mo>=</mo> <mn>60</mn>\
  \ </math> </p>\n</body></html> \n```\n\n**清单 13.3**     mm_summary.htm 文件\n\n根号下的被开方数是一个较长的表达式，因此需要将其放在\
  \ `<mrow>` 容器中。或者，你也可以使用不带可见括号的 `<mfenced>` 容器。\n\nHTML 特殊字符 `&int;` 用于创建积分符号。`<munderover>`\
  \ 容器中必须包含三个元素：实际的主元素、元素下方的信息和元素上方的信息。如果在示例中将 `dx` 字符串放在普通的 `<mi>` 容器中，则无法正确表示数学含义，因此最好将\
  \ `d` 和 `x` 字符分别放在各自的 `<mi>` 容器中。\n\nHTML 特殊字符 `&sum;` 和 `&prod;` 分别用于创建求和符号和乘积符号。`<munderover>`\
  \ 容器中的下方规格包含一个较长的表达式，因此必须进行汇总。在计算乘积的中间步骤中，使用 HTML 特殊字符 `&sdot;` 来显示乘号，以便更清晰。\n\n\
  在图 13.3 中，你可以看到汇总后的表达式、积分、求和以及乘积。\n\n![汇总表达式、积分、求和与乘积](img/img-f13.3.html)\n\n**图\
