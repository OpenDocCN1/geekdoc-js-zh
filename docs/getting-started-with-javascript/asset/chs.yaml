  \ 5.12**     创建表格后\n\n# 6    使用标准对象\n\n在本章中，你将学习如何使用数组、字符串、数字和时间规范。\n\n基于你在第 3 章中学到的知识，你可以创建自己的对象。然而，在\
  \ JavaScript 中，你经常也会使用许多预定义对象及其众多的属性和方法。本章将介绍预定义对象——`Array`、`String`、`Math`、`Number`\
  \ 和 `Date`——它们用于编辑数组、字符串、数字、数学问题以及日期。\n\n## 6.1    用于大量数据的数组\n\n你已经熟悉了第一个简单的数组。它们被简称为字段。本节将详细讨论该主题。\n\
  \n数组用于将一组主题相关的数据存储在一个共同的名称下。数组由单个元素组成，这些元素从 0 开始编号。元素的编号称为其索引。\n\n数组中的值通常具有相同的类型（例如，多个字符串作为城市名称，或几个数字作为温度值）。但是，你也可以在同一数组中保存不同类型的值。\n\
  \n在 JavaScript 中，使用 `Array` 对象来创建数组。它具有属性和方法，使你能够访问自己的数组和预定义数组。\n\n### 6.1.1    一维数组\n\
  \n在下面的程序中，我们将创建一些一维数组，遍历它们并输出它们。以下是第 1 部分：\n\n```\n...\n<body><p>\n   <script> \n\
  ```\n\n```\n let person = [\"Ben\", \"Angela\", \"Will\"];\n      person = [\"Peter\"\
  , \"Monica\", \"John\"];\n      const personTwo = person;\n      document.write(\"\
  简单输出: \" + personTwo + \"<br><br>\");\n\n      document.write(\"所有元素:<br>\");\n\n\
  \      document.write(\"for 循环: \");\n      for(let i=0; i<person.length; i++)\n\
  \         document.write(i + \":\" + person[i] + \" \");\n      document.write(\"\
  <br>\");\n\n      document.write(\"for-of 循环: \");\n      for(let p of person)\n\
  \         document.write(p + \" \");\n      document.write(\"<br><br>\");\n... \n\
  ```\n\n**清单 6.1**     array_one_dim.htm 文件，第 1 部分（共 4 部分）\n\n这里，数组由一组名称组成。默认情况下，`Array`\
  \ 对象写在方括号内，各个元素用逗号分隔。\n\n该数组被赋值给 `person` 变量，因此该变量作为对数组的引用。它使用 `let` 声明，因此也可以将另一个数组赋值给它。\n\
  \n你可以创建对数组的更多引用，就像我们在这里使用 `personTwo` 所做的那样，它不是一个新数组。`toString()` 方法已经为 `Array`\
  \ 对象预定义。它依次输出数组元素，仅用逗号分隔。\n\n`length` 属性包含数组的长度（即元素的数量）。例如，它可以用于控制 `for` 循环。\n\n\
  有两种方法可以使用循环访问数组的所有元素：\n\n*   通过 `for` 循环。数组的第一个元素索引为 0，因此称为 `person[0]`，第二个元素索引为\
  \ 1，第三个索引为 2，依此类推。可以在 `for` 循环内更改数组的元素。\n\n*   通过 `for`-`of` 循环，该循环是在 ECMAScript\
  \ 2015 中引入的。每次运行循环时，数组的另一个元素会被赋值给一个变量（在本例中为 `p` 变量）。由于此变量是元素的副本，因此在循环内更改此变量不会导致元素更改。\n\
