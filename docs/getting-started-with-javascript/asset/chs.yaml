  \ charset=utf-8\");\n   echo \"<b>总和</b>: \"\n      . (doubleval($_POST[\"number1\"\
  ]) + doubleval($_POST[\"number2\"]));\n?> \n```\n\n**清单 11.14** jq_ajax_test_data.php\
  \ 文件\n\n第六个超链接调用 `jq_ajax_test.xml` 文件，同样使用 jQuery 的 `post()` 方法。确定 `nodeA` 节点的值和\
  \ `nodeB` 节点的 `attributeA` 属性的值，并将其添加到段落的内容中。\n\n```\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<root>\n  <nodeA>节点 A 的值</nodeA>\n  <nodeB attributeA = \"节点 B 的属性 A\"\
  \n      attributeB = \"节点 B 的属性 B\">\n      节点 B 的值</nodeB>\n</root> \n```\n\n**清单\
  \ 11.15** jq_ajax_test.xml 文件\n\n第六个超链接中调用和匿名函数的嵌套令人困惑，因此我添加了第七个超链接，它产生相同的结果。这里使用了两个命名函数和部分结果，这有助于理解整个过程。\n\
  \n# 12 使用 Onsen UI 开发移动应用\n\n你可以使用 JavaScript 和 Onsen UI 库为移动设备创建用户界面。\n\nOnsen\
  \ UI 是一个框架，提供了用于开发移动应用的组件。这些 Onsen UI 应用的用户界面特别适合智能手机和平板电脑等移动设备。这些应用还可以轻松地与其他技术（例如\
  \ JavaScript 程序）集成。\n\n\n\n\n\n当前版本（截至 2024 年 8 月）为 2.12.8。你可以从 [`onsen.io`](https://onsen.io)\
  \ 下载所需的 CSS 和 JavaScript 文件，但通常页面是通过移动设备在线访问的。因此，我在示例程序中使用所需文件的在线版本，以便始终使用最新版本。\n\
  \n本章中的程序已在智能手机上测试，图片是在智能手机上的 Google Chrome 浏览器中创建的。在开发过程中，你也可以使用标准 PC 上的现代浏览器来测试大部分程序功能。\n\
  \nOnsen UI 框架使用自己的样式表，因此本章的文件中不包含 `js5.css` 文件（该文件在本书大多数示例中通过样式表确保统一显示）。\n\n## 12.1    页面的结构\n\
  \n首先，我想描述页面的基本结构，然后我会向你展示可用于设计页面的列表和表格。\n\n### 12.1.1    第一个页面\n\n第一个页面由一个导航栏和一个内容区域组成（参见图\
  \ 12.1）。导航栏可以包含页面标题和核心操作元素，内容区域则包含文档的实际内容：一个包含一个条目的列表，即一个按钮。\n\n按下按钮后，会出现一条信息提示（参见图\
  \ 12.2）。\n\n![第一个页面](img/img-f12.1.html)\n\n**图 12.1**    第一个页面\n\n程序如下：\n\n```\n\
  <!DOCTYPE html><html lang=\"en-us\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Onsen\
  \ UI, first page</title>\n  <link rel=\"stylesheet\" href=\"https://unpkg.com/onsenui/css/onsenui.css\"\
  >\n  <link rel=\"stylesheet\"\n     href=\"https://unpkg.com/onsenui/css/onsen-css-components.min.css\"\
  >\n  <script src=\"https://unpkg.com/onsenui/js/onsenui.min.js\"></script>\n</head>\n\
  <body>\n<ons-page>\n  <ons-toolbar>\n    <div class=\"left\" style=\"padding-left:10px;\"\
  >Links</div>\n    <div class=\"center\">Center</div>\n    <div class=\"right\" style=\"\
  padding-right:10px;\">Right</div>\n  </ons-toolbar>\n  <ons-list>\n    <ons-list-item>\n\
  \      <ons-button id=\"idHello\">Hello</ons-button>\n    </ons-list-item>\n  </ons-list>\n\
  </ons-page>\n\n<script> \n```\n\n```\n document.getElementById(\"idHello\").addEventListener(\"\
  click\",\n      function(){ons.notification.alert(\"Hello\");}); \n```\n\n```\n\
  </script>\n</body></html> \n```\n\n**清单 12.1**    `onsen_page.htm` 文件\n\n文件头部包含了我在本章开头提到的所需\
  \ CSS 和 JS 文件的在线版本链接。其他文件中的头部也类似，因此不再重复显示。\n\nOnsen UI 组件像 HTML 容器一样集成到文档中。`ons-page`\
  \ 类型的组件构成了页面的基本元素，它占据整个屏幕，并作为其他元素的容器。\n\n页面可以使用 `ons-toolbar` 类型的组件包含一个导航栏。导航栏通过\
  \ `div` 容器和 Onsen UI 的以下 CSS 类分为三个区域：\n\n*   `left`，用于左侧边缘的元素\n*   `center`，用于略微缩进的元素\n\
  *   `right`，用于右侧边缘的元素\n\n在左侧和右侧区域，使用了 `padding` CSS 属性来在左右边缘之前创建小的间隙。\n\n你可以使用 `ons-list`\
  \ 和 `ons-list-item` 类型的组件来创建列表或列表条目。关于列表的更多细节将在第 12.1.2 节中介绍。\n\n你可以使用 `ons-button`\
  \ 类型的组件在内容区域显示按钮。通过 `id` 属性以及 `getElementById()` 和 `addEventListener()` 方法，以通常的方式建立与\
  \ JavaScript 的连接。\n\n`ons.notification` 类型的组件提供了多种标准对话框的方法（另请参见第 12.2.2 节），而 `ons.notification.alert()`\
  \ 方法会生成一个带有消息的信息窗口（参见图 12.2）。\n\n![链接到 JavaScript](img/img-f12.2.html)\n\n**图 12.2**    链接到\
  \ JavaScript\n\n### 12.1.2    元素列表\n\n列表常用于以清晰的方式显示多个元素。你可以为列表指定标题，将列表中的相关元素分组，并将每个列表元素分为三个区域。你还可以将列表元素链接到操作。\n\
  \n在图 12.3 中，你可以看到一个分组的列表。\n\n![分组的列表](img/img-f12.3.html)\n\n**图 12.3**    分组的列表\n\
