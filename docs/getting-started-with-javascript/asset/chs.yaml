  \ 类型的组件作为整个列表，以及使用 `ons-list-item` 类型组件创建的条目。列表可以在 `ons-list-title` 类型的组件中拥有一个整体标题，你可以使用\
  \ `ons-list-header` 类型的组件来对元素进行分组并作为组标题。与导航栏类似，单个元素通过 `left`、`center` 和 `right`\
