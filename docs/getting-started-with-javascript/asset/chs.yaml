  \ + \"<br>\");\n```\n```\n</body></html> \n\n\n\n\n\n\n\n\n\n\n\n\n...\n   <script>\
  \ \n\n const y = 42;\n      try\n         document.write(x + \"<br>\");\n      }\n\
