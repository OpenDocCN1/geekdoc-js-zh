  \n文档下半部分创建了六个按钮，用于实现相机在 x、y、z 方向上的正向或负向移动（参见图 10.4）。点击按钮会调用 `move()` 函数，并传入三个方向上的位移值作为参数。\n\
  \n在文档下半部分的 `move()` 函数中，将传入的三个移动值加到相机当前的位置值上。相机获得新确定的位置后，程序确保相机再次看向立方体。最后，必须重新渲染绘图。\n\
  \n随着相机位置值的绝对值增大，相机与物体之间的距离也随之增加，因此从观察者的视角看，物体会变得越来越小。\n\n![移动按钮](img/img-f10.4.html)\n\
  \n**图 10.4**     移动按钮\n\n## 10.3    动画\n\n为了进一步展示 3D 结构，本节第一个程序中的立方体将通过动画绕 y 轴缓慢旋转总计\
  \ 90 度。\n\n这里仅展示与第 10.1 节 程序相比新增的代码部分：\n\n```\n...\n<body id=\"idBody\">\n   <script>\
  \ \n```\n\n```\n ...\n      function rotate()\n      {\n         object.rotation.y\
  \ += 0.2 * Math.PI / 180;\n         drawing.render(scene, camera);\n         if(object.rotation.y\
  \ <= 90 * Math.PI / 180)\n            requestAnimationFrame(rotate);\n      }\n\
  \      rotate(); \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 10.3**    \
  \ th_animation.htm 文件\n\n\n\n\n你可以使用 Three.js 对象的 `rotation` 类型来访问其旋转角度。你可以通过 `rotation`\
  \ 对象的 `x`、`y` 或 `z` 属性单独调用或设置绕相关轴的角度，并且必须以弧度为单位指定角度。如果以度为单位指定，则必须先乘以系数 π / 180。\n\
  \n绕 y 轴的旋转角度值增加 0.2 度，起初看起来非常小。然后使用 `render()` 方法重新绘制图形场景，如果绕 y 轴的旋转角度小于或等于 90 度，则调用\
  \ `window` 对象的 `requestAnimationFrame()` 方法，并再次传入对 `rotate()` 方法的引用。这确保了 `rotate()`\
  \ 方法会被再次调用。然后，对象再次旋转 0.2 度，图形场景再次绘制，依此类推。这就是创建动画的方式。默认情况下，这些操作每秒执行六十次，从而产生每秒 12\
  \ 度的旋转。因此，最终值 90 度在 7.5 秒后达到。如果移除分支，3D 对象将无限旋转下去。\n\n## 10.4 各种形状\n\n在本书的可下载资料中，你可以找到作为额外内容的\
  \ `th_multiple.htm` 程序。该程序可用于在网格视图中显示总共八种不同的形状：球体、长方体、圆锥体、四面体、八面体、胶囊体、圆环体和圆环结（参见图\
  \ 10.5）。摄像机看向原点，即绘图的中心。这就是为什么最左边和最右边的四个形状在透视中会发生变形。\n\n![八种不同形状](img/img-f10.5.html)\n\
  \n**图 10.5**     八种不同形状\n\n### 注意\n\n`th_change.htm` 程序在本书可下载资料的额外章节 4 中进行了描述，可访问\
