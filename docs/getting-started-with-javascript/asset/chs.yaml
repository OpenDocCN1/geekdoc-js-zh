  \n![删除后](img/img-f5.11.html)\n\n**图 5.11**     删除后\n\n## 5.7    创建表格\n\n在最后一个较大的示例中，你可以使用双重`for`循环创建一个全新的表格并将其嵌入文档中。在此上下文中，你使用`document`对象的`createTextNode()`和`createElement()`方法以及`node`对象的`appendChild()`方法。在\
  \ DOM 树中，你首先从外向内工作，然后再从内向外工作。\n\n你按如下方式创建表格：\n\n*   首先，为表格创建 HTML 元素节点。\n\n*   然后在外层循环中创建行的\
  \ HTML 元素节点。\n\n*   在内层循环中，依次执行以下步骤：\n\n    *   为单元格创建文本节点。\n\n    *   创建 HTML 元素节点。\n\
  \n    *   将文本节点嵌入到单元格的 HTML 元素节点中。\n\n    *   将单元格嵌入到行的 HTML 元素节点中。\n\n*   在外层循环中，将行的\
  \ HTML 元素节点插入到表格的 HTML 元素节点中。\n\n*   最后，将表格的 HTML 元素节点嵌入到文档中。\n\n这里是程序代码：\n\n```\n\
  ... <head> ...\n   <script> \n```\n\n```\n function createTable()\n      {\n   \
  \      const table = document.createElement(\"table\");\n\n         for(let r=1;\
  \ r<=3; r++)\n         {\n            const row = document.createElement(\"tr\"\
  );\n            for(let c=1; c<=5; c++)\n            {\n               const text\
  \ = document.createTextNode(\"Cell \" + r + \"/\" + c);\n               const cell\
  \ = document.createElement(\"td\");\n               cell.appendChild(text);\n  \
  \             row.appendChild(cell);\n            }\n            table.appendChild(row);\n\
  \         }\n\n         document.getElementById(\"idBody\").appendChild(table);\n\
  \      } \n```\n\n```\n </script>\n</head>\n<body id=\"idBody\">\n   <p><input id=\"\
  idTable\" type=\"button\" value=\"Table\"></p>\n   <script> \n```\n\n\n\n\n\n```\n\
  \ document.getElementById(\"idTable\")\n         .addEventListener(\"click\", createTable);\
  \ \n```\n\n```\n </script>\n</body></html> \n```\n\n**清单 5.7**     dom_table.htm\
