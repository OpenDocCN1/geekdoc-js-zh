  \n深色方块的位置和大小的初始值记录在 `pTop`、`pLeft` 和 `size` 变量中。此外，六个最大值被设置为 0，但有一个例外：`z` 的最大值被赋予起始值\
  \ 9.81。\n\n\n\n包含加速度数据的对象被传递给 `acceleration()` 函数，该对象除了其他属性外，还包含 `acceleration`、`accelerationIncludingGravity`\
  \ 和 `rotationRate` 属性。其中前两个属性包含不同轨道加速度的 `x`、`y` 和 `z` 属性。区别在于，如果移动设备处于静止状态，`acceleration`\
  \ 对象的 `z` 值为 0；否则，其值为 9.81。\n\n然后，程序会检查某个加速度值是否偏离静止状态下的值至少 3 m/s²，同时检查深色方块是否已到达浅色矩形的边缘。方块不应移出边缘。\n\
  \n如果检查结果均为肯定，深色方块将移动 50 像素，或者变大或变小 20 像素。\n\n在某些移动设备上，无法输出角加速度，因此需要事先查询相应的 `rotationRate`\
  \ 对象。该对象在 `alpha`、`beta` 和 `gamma` 属性中包含三个不同的值。\n\n对于所有六个加速度值，系统会检查当前值是否大于相应最大值的值。如果大于，则保存并输出新的最大值。\n\
  \n正确操作程序（即沿特定方向移动方块）并不容易，因此你应该缓慢启动移动并突然停止。只有在减速时才会出现超过 3 m/s² 的加速度，这会使效果更容易观察。\n\
  \n最后一条提示：测试加速度时请牢牢握住移动设备。\n\n# A 安装与关键字\n\n本附录介绍 XAMPP 的安装，然后提供 JavaScript 语言的关键字列表。关于\
  \ XAMPP 的使用，请参考第 4 章、第 4.2.2 节。\n\n## A.1 安装 XAMPP 软件包\n\n在本附录中，我将介绍免费 XAMPP 软件包的安装，你可以用它来测试\
  \ PHP 程序。目前可用的 XAMPP 版本（截至 2024 年 8 月）是 8.2.12 版。\n\n### A.1.1 在 Windows 上安装\n\n\
  你可以从 [`www.apachefriends.org`](https://www.apachefriends.org) 下载适用于 Windows 的 XAMPP\
  \ 软件包。\n\n然后，通过调用可执行文件 `xampp-windows-x64-8.2.12-0-VS16-installer.exe` 开始安装。开始时可能会出现两个警告，提示正在运行防病毒程序等。你可以继续操作并确认建议的安装选项。我建议选择\
  \ `C:\\xampp` 作为目标目录。\n\n安装完成后，启动 XAMPP 控制面板应用程序，你可以通过 Apache 字样右侧的按钮启动和停止 Apache\
  \ Web 服务器。\n\n如果在启动服务器时收到 `Unable to open process` 错误消息，可能是由于端口已被占用。你可以在以下地址找到解决此问题的清晰说明：[`www.coder-welten.com/windows-10-unable-to-open-process`](http://www.coder-welten.com/windows-10-unable-to-open-process)。（请注意，这篇非常详细的文章是德文的。在现代浏览器中，你可以让它自动翻译。）\n\
  \n你可以通过 localhost 地址在浏览器中访问本地 Web 服务器的起始页，并将 HTML 文件和 PHP 程序保存在 `C:\\xampp\\htdocs`\
  \ 目录及其子目录中。\n\n以下 PHP 程序可用于检查安装是否成功。你可以使用编辑器编写并保存到 `C:\\xampp\\htdocs\\phpinfo.php`\
  \ 文件中：\n\n```\n<?php\n   phpinfo();\n?> \n```\n\n**清单 A.1**     phpinfo.php 文件\n\
  \n在浏览器中输入相应的 `localhost/phpinfo.php` 地址后，将显示已安装 PHP 版本的信息。\n\n在 XAMPP 控制面板应用程序中停止\
  \ Apache Web 服务器，然后关闭该应用程序。\n\n### A.1.2 在 Ubuntu Linux 上安装\n\n你可以从 [`www.apachefriends.org/`](https://www.apachefriends.org/)\
  \ 下载适用于 Linux 的 XAMPP 软件包。下载后，将获得 `xampp-linux-x64-8.2.12-0-installer.run` 文件。\n\
  \n打开终端输入安装命令，如有必要，使用以下命令更改文件的访问权限：\n\n```\nchmod 744 xampp-linux-x64-8.2.12-0-installer.run\
  \ \n```\n\n通过以下命令开始安装：\n\n```\nsudo ./xampp-linux-x64-8.2.12-0-installer.run \n\
  ```\n\n你可以确认建议的安装选项，XAMPP 将安装在 `/opt/lampp` 目录中。\n\n安装结束时，你可以保留“启动 Xampp”复选框的勾选状态。这将打开一个用于管理各个服务器的对话框。在“管理服务器”选项卡中，你可以选择\
  \ Apache Web 服务器，并使用右侧的按钮启动和停止它。你也可以直接通过以下方式调用管理服务器的对话框：\n\n```\nsudo /opt/lampp/manager-linux-x64.run\
  \ \n```\n\n然而，Ubuntu Linux 的 Apache Web 服务器通常在系统启动后就已经运行。如果它正在运行，XAMPP 的 Apache\
  \ Web 服务器将无法启动。如果发生这种情况，你必须先使用以下命令终止 Ubuntu Linux 的 Apache Web 服务器一次：\n\n```\nsudo\
  \ /etc/init.d/apache2 stop \n```\n\n之后，你可以按照前面所述启动 XAMPP 的 Apache Web 服务器。\n\n为了避免每次系统启动后都要关闭\
  \ Ubuntu Linux 的 Apache Web 服务器，你可以使用以下命令禁用相关服务的自动启动：\n\n```\nsudo update-rc.d apache2\
  \ disable \n```\n\n如果将来想重新启用相关服务的自动启动，可以通过以下命令进行：\n\n```\nsudo update-rc.d apache2\
  \ enable \n```\n\n你可以通过 localhost 地址在浏览器中访问本地 Web 服务器的起始页，然后将 HTML 文件和 PHP 程序保存在\
  \ `/opt/lampp/htdocs` 目录及其子目录中。\n\n要测试安装是否成功，你可以使用下面的 PHP 程序。你可以使用 nano 编辑器编写并保存到\
  \ `phpinfo.php` 文件中，操作如下：\n\n```\nsudo nano /opt/lampp/htdocs/phpinfo.php \n```\n\
  \n退出 nano 编辑器的方法如下：按 (Ctrl)+(X)，在底部“保存”处确认“是”，然后确认建议的文件名。PHP 程序如下所示：\n\n```\n<?php\n\
  \   phpinfo();\n?> \n```\n\n**清单 A.2**     phpinfo.php 文件\n\n在浏览器中输入相应的 `localhost/phpinfo.php`\
  \ 地址后，将显示已安装 PHP 版本的信息。\n\n### A.1.3 在 macOS 上安装\n\n你可以从 [`www.apachefriends.org`](https://www.apachefriends.org)\
  \ 下载适用于 OS X 的 XAMPP 软件包。下载后，将获得 `xampp-osx-8.2.12-0-installer.dmg` 文件。双击此文件以创建一个新驱动器，然后你可以调用该新驱动器上的安装文件。\n\
  \n由于安装程序并非来自经过验证的 Apple 开发者，因此最初会被 macOS 阻止。在系统设置中调用“安全”菜单项，在那里你会找到“仍要打开”按钮，旁边有对\
  \ XAMPP 的引用。点击该按钮后，你将可以选择启动安装程序。\n\n默认情况下，XAMPP 安装在 `/Applications/XAMPP` 目录中，这对应于\
  \ Finder 中的 `Applications/XAMPP` 目录。\n\n\n\n\n安装结束时，你可以保留“启动 Xampp”复选框的勾选状态。这将打开一个用于管理各个服务器的对话框。在“管理服务器”选项卡中，你可以选择\
  \ Apache Web 服务器，并使用右侧的按钮启动和停止它。你也可以通过 `Applications/XAMPP/manager-osx` 调用管理各个服务器的对话框。\n\
  \n你可以在浏览器中通过 localhost 地址访问本地 Web 服务器的起始页，并将你的 HTML 文件和 PHP 程序保存在 `Applications/XAMPP/htdocs`\
  \ 目录及其子目录中。\n\n要测试安装是否成功，你可以使用以下 PHP 程序。你可以使用 App Store 中的 TextWrangler 编辑器编写并保存该程序到\
  \ `Applications/XAMPP/htdocs/phpinfo.php` 文件中。\n\nPHP 程序如下所示：\n\n```\n<?php\n  \
  \ phpinfo();\n?> \n```\n\n**列表 A.3**     phpinfo.php 文件\n\n在浏览器中输入相应的 `localhost/phpinfo.php`\
  \ 地址后，将显示已安装 PHP 版本的信息。\n\n## A.2    关键字列表\n\n在创建变量和自定义函数时，应尽量使用具有自解释性的自定义名称。命名应遵循一定规则（参见第\
  \ 2 章，第 2.1.2 节），尤其不能使用以下 JavaScript 语言的关键字名称，因为它们已被或将被 JavaScript 自身使用：\n\n`await`,\
  \ `abstract`, `boolean`, `break`, `byte`, `case`, `catch`, `char`, `class`, `const`,\
  \ `continue`, `debugger`, `default`, `delete`, `do`, `double`, `else`, `enum`, `export`,\
  \ `extends`, `false`, `final`, `finally`, `float`, `for`, `function`, `get`, `goto`,\
  \ `if`, `implements`, `import`, `in`, `instanceof`, `int`, `interface`, `let`, `long`,\
  \ `native`, `new`, `null`, `package`, `protected`, `private`, `prototype`, `public`,\
  \ `return`, `set`, `short`, `super`, `static`, `switch`, `synchronized`, `this`,\
  \ `throw`, `throws`, `true`, `transient`, `try`, `typeof`, `undefined`, `var`, `void`,\
  \ `volatile`, `while`, `with`, 和 `yield`。\n\n# B    作者\n\n![](img/img-f_none_A_00.html)\n\
