  >\n   <script> \n const pa = document.getElementById(\"idParadise\");\n      const\
  \ se = document.getElementById(\"idSolarEclipse\");\n      document.getElementById(\"\
  idAnimate\").addEventListener(\"click\",\n         function() { reference = setInterval(animate,\
