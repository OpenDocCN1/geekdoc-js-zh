  \ 方法返回 `Date` 对象的小时值，而 `setHours()` 方法则更改该值。\n\n有关 `Date` 对象的更多信息，请参见第 6 章的第 6.4\
  \ 节。\n\n在图 4.28 中，你可以看到表单提交后的显示效果。\n\n![时间数据的输出](img/img-f4.28.html)\n\n**图 4.28**    \
  \ 时间数据的输出\n\n### 4.9.4    验证表单\n\nJavaScript 在表单内容验证方面提供了更多选项。你可以设置是否检查单个元素或整个表单。文档中有两个表单，每个表单都有一个提交按钮（参见图\
