  **图 2.5**     真值的输出\n## 2.2    执行复杂计算\n以下各节将向你展示如何使用变量和数值进行计算。通过输入数字和输出结果，你的程序变得具有交互性。\n\
  ### 2.2.1    计算运算符\n除了 `+` 运算符，以下运算符也可用于执行计算：`-` 用于减法，`*` 用于乘法，`/` 用于除法，`%` 用于取模（计算整数除法的余数）。自\
  \ ECMAScript 2016 起，还增加了 `**` 运算符用于乘方。\n下面的程序进行了一些简单的数学运算：\n```\n<body><p>\n```\n\
  ```\n      z = 2 + 4 - 2.5;       document.write(\"2 + 4 - 2.5 = \" + z + \"<br>\"\
  );\n      z = (2 + 4) * (3 - 6) / 2;\n      z = 13.5 % 5;          document.write(\"\
  13.5 % 5 = \" + z + \"<br><br>\");\n      z = 6;                 document.write(\"\
