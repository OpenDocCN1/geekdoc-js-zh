    The semicolon at the end of the `statement` tells JavaScript that you are done
    declaring the variable:


    ```

    var phoneBill; own```


    The semicolon acts as a command `terminator`, or a separator between two different
    and independent commands. In other words, we are instructing JavaScript to stop
    and save that command or expression as an independent instruction from the next
    upcoming instruction.


    Going back to the variable name,


    **Keep this in mind:** JavaScript is case sensitive. `A` and `a` have independent
    meanings in JavaScript. `phoneBill` and `phonebill` are not the same word. At
    this moment `phoneBill` is an existing declared variable, and `phonebill` is nothing,
    JavaScript will throw an error if you write `phonebill` by mistake instead of
    `phoneBill` since you have declared `phoneBill` as the variable, and not `phonebill`.


    Of course we could also have two independent variables, one named `phoneBill`
    and another named `phonebill` and that is the point, for JavaScript they are two
    different words.


    ### Adding data to variables


    Once a variable is declared, a memory location is reserved for that variable and
    then we can assign the variable to some data.


    Isn’t it easier to remember `phoneBill` rather than making a written map of reserved
    memory locations?


    To assign data into a variable we use the `=` operator:


    ```

    phoneBill = 200;

    ```


    Do not use `$` before 200. That would trigger an error. You may use `$` later
    when you output the data if you so wish, but not when you enter your data into
    the computer memory. All JavaScript wants is the number 200 in its pure form.


    I have just saved the number 200 in a memory location listed as `phoneBill`. Notice
    the semicolon at the end. It terminates my `statement`.


    We could have declared and also included the data in just one-step:


    ```

    var utilitiesBill = 400;

    ```


    Sometimes we just want to tell JavaScript to reserve a location under a certain
    name. Other times we reserve the location and fill it with data all at once. Don’t
    worry about the size of memory needed. Contrary to other languages, JavaScript
    is dynamic: it adjusts the memory automatically.


    ### Changing the value in the variable


    What if we want to change the value of our `phoneBill` from 200 to 150?


    To change the value of a variable all we have to do is to reassign it (no declaration
    needed):


    ```

    phoneBill = 150;

    ```


    The 200 gets deleted and the computer memory at location `phoneBill` now holds
    the value of 150.


    - **Remember this:** Never use `var` twice on the same variable name. If you use
    `var` as a prefix when you rewrite an existing variable, you wipe out the old
    variable since you have just re-declared the variable again. This may be something
    you want to do on purpose, but for the most part, this is not a common practice.
    I have seen this done many times as a mistake by new programmers.


    ### Adding words to a variable instead of numbers


    So far we have been assigning data of `type number` to our variables. We can actually
    assign anything to a variable.


    Since a variable is just a memory location, we can assign it a `string` of characters
    also known as a value of type `string`, or even other types of data such as `arrays`,
    `functions`, `objects`... more about those later.


    ### Let’s talk about strings


    A string of characters can be assigned to a variable but we need to let JavaScript
    know it is a string. The way we let it know, is by wrapping our string of characters
    in `quotes`:


    ```

    var myName = "Tony";

    ```


    Any word not wrapped in quotes is considered to be a `reserved` term stored in
    the JavaScript library.


    - If I just write `var myName = Tony;` (with no quotes for the string ''Tony''),
    JavaScript will check its library in the computer’s memory looking for a command
    or a variable named `Tony`. Since `Tony` does not exist as a reserved term, JavaScript
    will throw an error on the screen. Any `word data` needs to be wrapped in quotes.


    After we declare the variable `myName`, the word `myName` then becomes a reserved
    term until it gets wiped out from memory or until the program is over. No quotes
    for variable names.


    - **Remember this:** Data of type `string` needs to be wrapped in quotes as opposed
    to declared variables names which are **never** written in quotes.


    When I say “remember this” it doesn’t mean to memorize it. It only means to focus
    a few seconds of extra attention to the statement that is about to follow.


    ### Which quotes to use: single or double?


    In JavaScript, a pair of single or double quotes work the same way. Just make
    sure the closing quote matches the style of the opening quote. Some other languages
    act differently in single or double quotes; not JavaScript.


    Below you will find another variable declaration and value assignment all at once.
    You will see how combining quotes can be useful. I start with a single quote,
    followed by a double quote. However JavaScript ignores the double quote because
    it knows the closing quote must by single in order to match the opening quote:


    ```

    var quoteOfTheDay = ''*living is not essential; creating is essential*" - Fernando
    Pessoa'';

    ```


    - **Remember this:** Never wrap a variable name in quotes. If you do that, you
    convert the name into a string. I mean, `quoteOfTheDay` and `"quoteOfTheDay"`
    don’t have the same meaning for JavaScript. The first one is a declared variable
    stored in the JavaScript temporary library. The second one is just a plain string
    of characters. JavaScript will not map it to the memory location assigned to `quoteOfTheDay`.


    ### Assigning variables to other variables


    We have seen already how to reassign a variable to a new value:


    ```

    phoneBill = 600;

    ```


    Now, `phoneBill` is no longer 150. It holds the value of 600.


    **What about assigning a variable to another variable?**


    It works the same way as assigning a regular value:


    ```

    phoneBill = quoteOfTheDay;

    ```


    *Note:* No quotes are being used because both words are previously declared variables.
    The real value, which is a string value, is passed inside of the variable `quoteOfTheDay`.


    - **Remember this rule:**


    Assignments work from `right` to `left`. What is on the right gets assigned to
    the left operand.


    The value of `phoneBill` has now been changed from the numeric 600 to the string
    `"living is not essential; creating is essential" - Fernando Pessoa`.


    Basically, JavaScript copied the string value from `quoteOfTheDay` to `phoneBill`.
    We now have two strings of the same value in two different memory locations. This
    copying is not always true as we will see later. Copying only happens with `primitive`
    data types, such as numbers and strings. When we reassign complex data such as
    `arrays` and `functions`, also known as `reference` types, we do not duplicate
    the data; we just point those two variables to the same data. But this is an advanced
    concept. For now, just think of duplicating variable `values` when we reassign
    a variable containing simple data to another variable.


