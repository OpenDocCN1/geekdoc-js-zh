- fmt: "\nThat is called `passing data by reference`. There is no duplication; these\
    \ variables just refer to the same data. If we delete one of the variables or\
    \ assign it to something else, the data remains untouched because there is another\
    \ variable holding it in place like it happened with the balloon.\n\n### Functions\
    \ are closed-in structures\n\nIn JavaScript, a function is the only [data structure](http://en.wikipedia.org/wiki/Data_structure)\
    \ able to protect its data from the outer world.\n\nWhat does that mean?\n\nIt\
    \ means that if we declare a variable inside of a function, it can’t be seen from\
    \ the global scope (outside of the function).\n\nThe global scope is in itself\
    \ an inner scope if we compare it to outer worlds, like for example another webpage\
    \ on a different tab. Everything we do on a web page is done under the `window`\
    \ object which wraps the whole page. This has nothing to do with the name Windows\
    \ from Microsoft. `window` here refers to the browser displaying of a page, the\
    \ shell, and it is called `window` in any computer system.\n\nThe `window` object\
    \ is, as far as a web page is concerned, the outer world or the `global scope`\
    \ of the page. Anything declared under the `window` object is a property or method\
    \ of the object `window`.\n\nWe could actually think of the `window` object as\
    \ a function that creates everything else inside it.\n\nWhen we declare a variable,\
    \ like for example\n\n```\nvar x = 33;\n```\n\nWe are creating this variable in\
    \ the global scope, which means that the parent of variable `x` is object `window`.\
    \ To call this variable, we write:\n\n```\nx;\n```\n\nAnd it displays 33. But\
    \ we could also call it like in the following example and it would work the same:\n\
    \n```\nwindow.x;\n```\n\nBy using dot syntax we are making sure we call the correct\
    \ variable `x`, not some other `x` from the outer galaxies. For the most part\
    \ `window` is understood and we don’t have to write it down, as we have seen throughout\
    \ the book.\n\nAnd what are those different galaxies? You might ask.\n\nRemember\
    \ when I said that we could think of the `window` object as a big function that\
    \ holds all the web page functionality inside of itself and it protects it from\
    \ other webpages?\n\nWell, I didn’t put it quite like that but it serves the purpose\
    \ which is to say that every function acts as a protective parent for its own\
    \ data. In JavaScript functions are closed in data structures.\n\nWe could actually\
    \ declare another variable `x` inside of a function because JavaScript will accept\
    \ it without conflict, even knowing that there is another `x` declared as a global\
    \ variable. This is because the global scope does not see the inner `x` from the\
    \ function.\n\nHowever, the function can see the outer variable `x`. That’s right!\
    \ Functions have access to global variables because functions are their siblings.\
    \ A function can see the outer variable world, but the outer world cannot see\
    \ what’s inside of a function. The siblings of a function can see the function,\
    \ but they cannot see what is inside of the function. The good news is that JavaScript\
    \ always picks the closest identifier called upon. I mean, if we would call `x`\
    \ from within the function, JavaScript would grab the first `x` that sees which\
    \ is the one inside of the function. So, even if there was another `x` outside\
    \ of the function and knowing that the function has access to it, the inner `x`\
    \ would be JavaScript’s first choice if we ever addressed `x` from within the\
    \ function.\n\nFor example:\n\n```\nvar x = 33; var test = function(){\n  var\
    \ x = 5;\n  return x;\n};\n```\n\nCall function `test`:\n\n```\ntest();\n```\n\
    \nIt returns 5.\n\nSo, how would we address the outer `x` from inside of the function\
    \ if we wanted to use its value in the function?\n\n`window.x` would come to mind.\n\
    \nWe will see next how to access the global `x` from within the function.\n\n\
    ### “This” as an object placeholder\n\nWhat if we wanted to return the outer variable\
    \ `x`, instead of the inner `x` like we did on the previous example?\n\nIn that\
    \ case we would have to use dot syntax to address the global `x`:\n\n```\nvar\
    \ x = 33; var test = function(){\nvar x = 5;\nreturn window.x;\n};\n\ntest();\n\
    ```\n\nNow it returns 33, which is the outer `x`, not the inner `x` which is 5.\
    \ That’s because `window.x` addresses the global variable `x` which is a child\
    \ of object `window`.\n\nBecause JavaScript is very dynamic and also because we\
    \ should write code as portable as possible (one that could apply to any object,\
    \ not just the window object), programmers have come up with a generic placeholder\
    \ to properly address the object currently calling the variable.\n\nThis placeholder\
    \ is the word `this`.\n\nIf we substitute the expression `window.x` for `this.x`,\
    \ at the time of execution JavaScript will search for the object owning the property\
    \ being called upon, and substitutes the placeholder `this` for the correct name,\
    \ which in our case is object `window`.\n\nBut you might ask, isn’t function `test`\
    \ also an object and if so, isn’t the owner of `this.x` the function itself, instead\
    \ of object `window`?\n\nNot really (but it is a great question). Who is the owner\
    \ of the act of calling function `test()`?\n\nAns: The object `window` owns the\
    \ command `test()`.\n\nNow if function `test(){}` was a method inside of some\
    \ other object, then `this` would no longer represent `window`, it would represent\
    \ the other object.\n\nJust as an example please look at this sample:\n\n```\n\
    var x = 33; var myObject = {\nx: 7,\ntest: function () {\nvar x = 5;\nreturn this.x;\n\
    }\n};\n```\n\nThere, we have a global `x` with value of 33, another `x` with value\
    \ 7 that belongs to `myObject`, and another `x` with value 5 inside the function.\n\
    \nWhen we call the method `test()`:\n\n```\nmyObject.test();\n```\n\nIt prints\
    \ out 7 which is the second `x`, that belongs to `myObject`. *window` is no longer\
    \ the immediate owner of `this.x` because `myObject` is. I have underlined earlier\
    \ that `this` gets assigned “at the time of execution”, not only because the substitution\
    \ happens at the time of execution but also because the object owning the property\
    \ may change from the time the property was declared to the time the property\
    \ is called upon. JavaScript is a dynamic language and we need to be careful with\
    \ our assumption of what is going dynamically. We will see ownership happening\
    \ and how to tackle each situation as we code more scripts ( for more of that\
    \ please read [JavaScript Objects and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Arrays-Explained/dp/B00GPBZQ/)).\n\
    \nHere’s the original function written in a more portable format where `this`\
    \ replaces `window`:\n\n```\nvar x = 33;\nvar test = function(){\n  var x = 5;\n\
    \  return this.x;\n};\n\ntest(); // Returns 33 instead of 5\n```\n\n## 3.4 Lab\
    \ work 12\n\n### Part A: Expressions, statements, arguments\n\n(*A link to my\
    \ answers will be posted at the end of this page. You may actually navigate to\
    \ the forum to mentally answer the questions because the answers are not visible\
    \ until you click on the individual answer button.*)\n\nLet’s review some of the\
    \ concepts we have covered in this section. Please try to answer all questions\
    \ before you check my answers.\n\nIn general an *expression* is something JavaScript\
    \ summarizes into one unit, and a *statement* is a complete sentence representing\
    \ a command and terminated by a semicolon.\n\n1- In the following example what\
    \ are the expression(s) and what are the statement(s)?\n\n```javascript\nif(10\
    \ < 11) {\n  console.log(\"I love JavaScript\");\n}\n```\n\n2- In the following\
    \ function assignment what is the value of variable `addTwo` and what is the value\
    \ of `addTwo` with post-fixed parentheses `addTwo()`?\n\n```javascript\nvar addTwo\
    \ = function (){\n  return 3 + 2;\n};\n```\n\n3- In the declaration of the above\
    \ source code, which section of `addTwo` is known as an ***anonymous*** function?\n"
