    ## 1.9 比较运算符


    ### `===`, `!==`, `<`, `>=`, `true`, `false`


    让我们学习更多的比较运算符，并向 JavaScript 提问更多问题。


    请记住，这些符号将左操作数与右操作数进行比较。


    小于：`<`


    大于：`>`


    小于等于：`<=`


    大于等于：`>=`


    不等：`!==`


    示例：


    12 < 10; 布尔答案为 `false`


    12 > 10; 布尔答案为 `true`


    12 === 12; 布尔答案为 `true`


    12 === "12"; 布尔答案为 `false`


    12 !== 13; 布尔答案为 `true`


    12 !== 12; 布尔答案为 `false`


    12 <= 12; 布尔答案为 `true`


    12 = 12; 布尔答案为 `true` (注：原文此处 12=12 似有笔误，通常应为 ===)

    '
- fmt: '

    **Note:** You may have seen double equals `==` used in JavaScript in another book
    somewhere. In a different programming language that should be ok. However, in
    JavaScript the double equals comparison operator is not recommended. This is because
    in JavaScript the double equals `==` does not fully check the condition. I mean
    it does not check the type of data the operands contain. That could lead to errors
    because sometimes we have numbers in quotes which makes them strings, a "12" is
    not the same value as 12. The first is a string of characters and the second is
    a number.


    In JavaScript always use the triple equals: `===` for comparing values.


