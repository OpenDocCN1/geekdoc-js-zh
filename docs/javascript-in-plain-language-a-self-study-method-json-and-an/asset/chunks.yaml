    ## 4- Call function `test2` and see the results for each one of these numbers:
    3,5,15,21:


    ```

    test2(3);

    test2(5);

    test2(15);

    test2(21);

    test2(11);

    ```

    etc.


    The input parameter(s) of a function act as a temporary internal variable. This
    is really useful because we can send data into a function to be processed. That’s
    what happened during our `test2()` function `calls`.


    Once we master the basic syntax of a function we start to create some real cool
    stuff.


    Functions may still be confusing for you. I will cover all the basics as we code
    along. It is not a difficult subject but it needs to be approached in the proper
    sequence.


    ### What is a function call?


    A picture is worth a gazillion words:


    ![](images/00008.jpeg)


    Fig 8 (See original file: [here](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/).
    ) bit.ly/1raw6pT


    Looking at figure 8, on the bottom left side we are calling function `addTen()`
    and passing an argument `data` of 4 to the function parameter `n`.


    Then 4 will become the temporary value for parameter `n`, and the sum of `10 +
    4` is executed.


    Finally, the `return` mechanism exports the result which is the numeric value
    of 14.


    We could have used `console.log(n + 10)`, but the `console.log` would display
    the value on the screen without exporting it out of the function. In other words,
    we would not be able to use the number 14 outside of the function because `console.log()`
    does not export data, it actually displays everything as a `string` value on the
    screen, even if it looks like a number.


    So, `return` is a very important mechanism in functions. Actually it is native
    to functions. We cannot use the command `return` outside of functions. JavaScript
    will not allow it.


    ### What is the purpose of return?


    The purpose of `return` is twofold:


    a) To export data from inside of a function in its raw form.


    b) To stop and end the function call. This is important. The return mechanism
    acts as a break and ends the act of calling a function. Anything written in the
    function below the `return` statement will not be processed because JavaScript
    exits the function as it returns. After the function returns, the function call
    is wiped out from the working memory. You don’t have to be concerned with this
    at this moment but it is good to know that function calls don’t linger in memory
    forever. They free up space by getting out of the way. This could be a third reason
    to include your code inside of a function: memory efficiency.


    ### What happens to the data when a function returns?


    If we want to reuse the data for further processing, we need to catch the `returned`
    data. Otherwise it just gets lost in space.


    *How do we catch the data being returned from a function?*


    One way to catch it is to assign the returned value to a variable. In other words,
    assign the `function call` to a variable.


    In the example of figure 8 (see the link below the image), instead of just calling
    the function:


    ```

    addTen(4);

    ```


    We could assign it to some variable:


    ```

    var y = addTen(4);

    ```


    Now `y` holds the value 14. The function call gets wiped out of memory but the
    value is retained by variable `y`.


    *   **In summary**, data coming from a function needs to be `returned` and assigned
    to a variable if we need to use it further down the script. When we output data
    from a function via a `console.log()`, `alert()`, `prompt()` or `confirm()`, we
    are just displaying it, not retaining it.


    ## 2.4 Lab work 6


    Ready for more lab work?


    ### Create a program to convert Fahrenheit to Celsius


    Operator [precedence](http://en.wikipedia.org/wiki/Order_of_operations) determines
    the order in which operators are evaluated. JavaScript precedence is close to
    math precedence:


    * Parentheses are evaluated before multiplication or division,

    * multiplication or division are evaluated before subtraction or addition.

    * All being equal, operands are evaluated from left to right and from inside of
    parentheses out.

    * ...nothing to memorize, just practice a lot.


    The following is the formula to convert Fahrenheit to Celsius:


    Deduct 32 from the variable `F`,

    then multiply the result by 5,

    then divide the new result by 9.


    We need to include the subtraction within parentheses so that it is done first.
    Then write the multiplication next so that it is done before the final division
    which should be placed on its right side. The formula looks like this:


    `(f - 32) * 5 / 9`


    That was the hard part. Now let’s code.


    1- Create a function named `f2c` that takes 1 input parameter called `f`.

    2- Inside of the function send the `result of the formula` to the screen.


    In other words use `console.log()` to print to screen. This is because we only
    want to display it, not to reuse it. Notice how the input parameter’s name `f`
    coincides with the variable given to our formula. That was done on purposes so
    the JavaScript interpreter knows where to plug the input number we are going to
    give it when we call the function.

    3- Call the function and pass in an argument of 212 degrees Fahrenheit. (write
    just the number by itself). Your displayed answer should be 100.


    See my own solution here (**first script**): [f2c](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)
    | bit.ly/1Dp2SKk


    ### Create a program to convert Celsius to Fahrenheit


    The formula to covert Celsius to Fahrenheit is:


    Multiply `c` by 9,

    then divide the result by 5,

    then add 32 to the new result.


    There is no need to insert parentheses, just make sure the multiplication comes
    first:


    `c * 9 / 5 + 32`


    1- Create a function named `c2f` that takes 1 parameter called `c`.

    2- Inside of the function send the result of the formula to the screen.


    In other words use `console.log()` to print to screen.

    3- Call the function and pass in an argument of 100 degrees Celsius (just the
    number).


    Your answer should be 212.


    See my own solution here (second script): [c2f](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)
    | bit.ly/1Dp2SKk


    ### A program to convert Fahrenheit to/from Celsius


    In this project we are going to introduce a function with two input parameters.
    The first input parameter will take a numeric value, and the second input parameter
    will serve as a condition to toggle between Celsius and Fahrenheit.


    *How will we toggle between Celsius and Fahrenheit?*


    a) If, the user enters an `f` for Fahrenheit, the `if()` output will convert Fahrenheit
    to Celsius.

    b) Else if, the user enters a `c`, the number gets converted from Celsius to Fahrenheit.

