    \ always make your own or copy from this [raw file](http://icontemp.com/jpl/colors1.txt)\
    \ | bit.ly/1ypn1A2):\n\n- Green is the color of balance and growth.\n- Blue is\
    \ the color of trust and peace.\n- Indigo is the color of intuition.\n- Purple\
    \ is the color of the imagination.\n- Orange is the color of social communication\
    \ and optimism.\n- Sorry, that color is not in the system yet!\n\n1. Please remember:\
    \ the purpose of creating a function is to recall the program without having to\
