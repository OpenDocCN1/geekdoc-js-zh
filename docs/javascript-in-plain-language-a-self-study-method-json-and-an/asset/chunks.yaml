  trans: "\n\n```javascript\n(10 > 9) && (10 < 11);\n``` <--- JavaScript 的答案是 true，因为\
    \ true 和 true 等于 true。\n\n```javascript\n(10 > 14) && (10 < 11);\n``` <--- JavaScript\
    \ 的答案是 false，因为 false 和 true 等于 false。\n\n```javascript\n5 === 7 && 5 === 5;\n\
    ``` <--- JavaScript 的答案是 false\n\n```javascript\n5 === \"5\" && 5=== 5;\n``` <---\
    \ JavaScript 的答案是 false\n\n```javascript\n5 === 5 && 7 > 5;``` <--- JavaScript\
    \ 的答案是 true\n\n### 或：||\n\n两个垂直竖线表示逻辑“或”（OR）运算符。在美版 Windows 系统中，你可以通过 `SHIFT`\
    \ 键和 *qwerty* 开头那行最右侧的键来输入 `||`。\n\n使用逻辑或 `||` 时，操作数中需要有一个为 true 才能得到布尔值 true\
    \ 输出。\n\n通常，如果 OR 语句中的左侧操作数已经是 true，JavaScript 将不会检查右侧操作数。这一点非常重要，尤其是当我们很快将看到的条件决策判断时。\n\
    \n示例：\n\n```javascript\n(10 > 9) || (10 < 9);\n``` <--- JavaScript 的答案是 true，因为第一个表达式为\
    \ true。\n\n```javascript\n(10 < 9) || (10 > 9);\n``` <--- JavaScript 的答案是 true，因为第二个表达式为\
    \ true。\n\n```javascript\n(10 < 9) || (10 < 8);\n``` <--- JavaScript 的答案是 false，因为没有任何一个表达式是\
    \ true。\n\n### 非：!\n\n非运算符 `!` 用于反转陈述语句。在 JavaScript 中，任何数据值都被视为 true，但以下情况除外：\n\
    \n布尔值 `false`、数字 `zero`、被称为 `undefined` 的值以及我们尚未介绍的 `null` 的 值。\n\n让我声明几个变量和值来做一些测试：\n\
    \n```javascript\nvar x = 3;\nvar y = 0;\nvar z = \"Tony\";\nvar a;\n```\n\n根据我的第一个陈述，变量\
    \ `x` 是 true 还是 false？它是 true，因为它有值。另一方面，变量 `y` 是 false。\n\n让我介绍一个 JavaScript\
    \ 方法来判断一个值何时是 true 何为 false（我们可以在脚本中使用此方法进行决策，但它并不常用。只需记住它即可）：\n\n`Boolean()`\n\
    \n现在我们将比较该方法的正常结果与反转问题后的结果。请记住，我们是在要求 JavaScript 检查该语句是 true 还是 false，而不是去检查变量并给我们返回一个值。这完全取决于我们在\
    \ `Boolean()` 方法内部的陈述。让我们尝试：\n\n例如，`Boolean(x);`。我们正在问：“这是 true 吗？”、“我说 x 以 true\
    \ 的形式存在，我的陈述是 true 吗？”，然后 JavaScript 用 true 或 false 回复：\n\n```javascript\nBoolean(x);\
    \ // <-- 陈述是 true（因为我们上一个示例中的 x 是 3）\nBoolean(!x); // <-- 陈述是 false（因为 x 有值，!x\
    \ 是一个 false 陈述）\nBoolean(y); // <-- 陈述是 false（y 是 0，而零是 false）\nBoolean(!y); //\
    \ <-- 陈述是 true（因为 y 是 0，!y 是一个 true 陈述）\nBoolean(z); // <-- 陈述是 true（z 是 \"Tony\"\
    ，且 Tony 是 true*）\nBoolean(!z); // <-- 陈述是 false（因为 z 有值，!z 陈述是 false）\nBoolean(a);\
    \ // <-- 陈述是 false（a 是 undefined，我们不能说它是 true）\nBoolean(!a); // <-- 陈述是 true（因为\
    \ a 是 undefined，!a 是一个 true 陈述）\n```\n\n让我们做一些实验工作来复习所有概念。\n\n## 1.13 实验工作\n\n\
    \ 获取来自用户的反馈\n\n在本次实验课程中，我们将逐步共同工作。请打开你的 JavaScript 控制台并随我一起操作：\n\n1- 让我们使用 `prompt()`\
    \ 来询问访问者的名字：\n\n```javascript\nprompt(\"What is your name\");\n```\n\n2- 在你按下\
    \ ENTER 键后，浏览器上应该会弹出一个窗口询问你的名字。\n\n回答问题，但不要在引号中写你的名字。作为一个文本框，你不需要引号。输入机制会自动加上引号：\n\
    \n输入 *Tony* 或你的名字，然后按 ENTER。\n\n好，发生了什么？没发生什么特别，对吧？名字显示在控制台中作为自动反馈，就此结束。\n\n这是因为我们没有捕获用户通过\
    \ `prompt()` 机制输入的名称。为了获取输入的名称，我们需要将结果赋值给变量。\n\n*让我们从头开始重新做一遍：*\n\n3- 声明一个变量 `userName`\
    \ 并给它赋值与之前相同的 `prompt()`。我没有单独使用 `name` 这个词，因为它是浏览器中的保留字，这使得它成为用作变量名的禁止术语：\n\n\
    ```javascript\nvar userName = prompt(\"What is your name?\");\n```\n\n当弹出窗口出现时，在框中输入你的名字并按\
    \ ENTER。\n\n我们仍然看不到名字，但在下一步中，我们将使用 `console.log()` 显示变量 `userName` 的值，这个值应该是你的名字。顺便说一下，那个自动反馈消息很可能是\
    \ `undefined` 这个词，对吧？那是因为反馈发生在变量声明时，然后才发生赋值。你不需要知道这些；我只是想提醒你，以免你在试图弄那里到底发生了什么时分心。\n\
    \n4- 使用 `console.log()` 显示 `userName` 的值：\n\n```javascript\nconsole.log(userName);\n\
    ```\n\n我的显示的是 *Tony*\n\n如果你遇到类似错误，例如 \"ReferenceError: myName is not defined\"\
    ，请确保声明的变量名和你在 `console.log()` 中使用的变量名相同。一个常见的错误是第一次写 *username*，然后第二次写 *userName*。如你所知，它们是不一样的。\n\
    \n5- 让我们让输出稍微漂亮一点。使用 `console.log` 显示以下句子：\n\n“Hi, Tony! Nice to meet you”，其中\
    \ Tony 是你在 prompt 中输入的名字。你将使用变量 `userName` 作为占位符（见下文解释）。\n\n```javascript\nconsole.log(\"\
    Hi, \" + userName + \"! Nice to meet you.\");\n```\n\n注意 *Hi,* 之后的空格，还要注意我使用了变量\
    \ `userName` 而不是真实的名字。这是因为作为程序员，我们创建脚本是为了处理任何名字，而不仅仅是我们的名字。始终编写通用的代码！\n\n6- 对你有效吗？你的输出句子中显示了正确的名字\
    \ 吗？\n\n**现在现在轮到你了...**\n\n在接下来的几个练习中，你将重复我们刚刚做过。准备好自己尝试了吗？请阅读以下配方说明，然后自己编写程序。\n\
    \n1- 声明变量 `color` 并给它赋值一个 `prompt()`，询问用户定义其最喜欢的颜色。\n\n2- 编写一个 `console.log`，显示\
    \ *Hmmm... orange is also one of my favorites!*，其中 orange 是变量 `color`，它代表用户选择的颜色。\n\
    \n3- 为了练习目的，额外添加一行使用 `confirm()` 来显示此消息：\n\n“Are you ready for more JavaScript?”。\n\
    \n（查看下一页的结果）。\n\n结果：\n\n1- 声明变量 `color` 并给它赋值一个 `prompt()`，询问用户定义其最喜欢的颜色：\n\n\
    ```javascript\nvar color = prompt(\"What is your favorite color?\");\n```\n\n\
    2- 编写一个 `console.log`，显示 *Hmmm... orange is also one of my favorites!*，其中 *orange*\
    \ 是他们选择的颜色：\n\n```javascript\nconsole.log(\"Hmmm... \" + color + \" is also one\
    \ of my favorites!\");\n```\n\n3- 为了练习目的，额外添加一行使用 `confirm()` 显示此消息：\n\n```javascript\n\
    confirm(\"Are you ready for more JavaScript?\");\n```\n\n实验结束\n\n***恭喜！***\n\n\
    你现在应该准备好进入编程冒险的第二阶段了。\n\n让我们从介绍条件分支技术开始，这样我们就可以在公路上跑得快一点！\n\n感谢你的留下。\n\n# 第二部分：进入第二个领域\n\
    \n“*我努力了一整晚想弹出一个优美的音符。*”\n\nJimi Hendrix\n\n## 2.1 添加更多语法\n\n 代码块 - 使用编辑器\n\n"
- fmt: "\nUp this this point we have been writing `one liner` statements and as soon\
    \ as we press `ENTER` on the Console, the code gets executed. We could actually\
    \ write several lines of code in the Console by holding the `shift-key` when we\
    \ press `Enter`. That would take us to the second line where we could continue\
    \ writing our script. Although this works, it is not an ideal arrangement. It\
    \ is much better to write code on a `text editor and then copy/paste it to the\
    \ Console when we are finished.\n\nI’m sure you have some sort of a text editor\
    \ on your computer. Do not use `Word` or `WordPad` because they add hidden formatting\
    \ code which interferes with your script. Microsoft Windows comes with `Notepad`.\
    \ Notepad works and I use it hundreds of times a day to filter out text as I copy\
    \ from one source to paste onto another because it strips any visible or hidden\
    \ format. But I also use other free editors such as the free [Notepad++](http://notepad-plus-plus.org/),\
    \ [Programmer's Notepad](http://www.pnotepad.org/), and [Brackets](http://brackets.io/),\
    \ to write real code.\n\nNOTE: Since May 2015, Microsoft has release a really\
    \ cool free source code editor called [Visual Studio Code](https://code.visualstudio.com/)\
    \ which works in Windows 7 and up, Linux and Mac. This is highly recommended but\
    \ for now I am going to recommend something much simpler to do our exercises and\
    \ you will see why. Please read on.\n\nOf course you may use any one of your favorite\
    \ `plain` text editors, but let me introduce to you an online editor that comes\
    \ really handy because you don’t have to rely on your computer to get going. I\
    \ use this online tool many times a day because it also allows me to beautify\
    \ the code when I click the `beautify` button (creating proper white space):\n\
    \n[jsbeautifier.org](http://jsbeautifier.org/)\n\nPlease `Bookmark` the site.\
    \ The only disadvantage with this arrangement is that you can’t save the code\
    \ directly, but right now we are not saving anything, we are experimenting and\
    \ jsbeautifier works well for this purpose because it actually teaches us how\
    \ JavaScript syntax should be presented.\n\n### What is a code block?\n\nA code\
    \ block is usually a collection of different statements that come together to\
    \ create a certain functionality. The best way to save groups of code is by creating\
    \ a `function`. We will get to play with functions soon.\n\nA code block is usually\
    \ limited (surrounded) by an opening curly brace `{` and a closing curly brace\
    \ `}`.\n\nHere’s an example of a code block:\n\n```javascript\nvar x = \"Hello\"\
    ;\nconsole.log(x);\n}\n```\n\nWe will use code blocks from our next project on.\n\
    \n### Commenting code\n\nSometimes we want to make a note in our code to explain\
    \ the purpose of a code line to another human being but we don’t want JavaScript\
    \ to throw an error when it sees our comment.\n\nThere are two ways to make comments:\n\
    \n1. **Using two forward slashes**.\n\nWith this style of commenting we can’t\
    \ press the `Enter` key and write a second comment line. It must be done all in\
    \ one continuous line:\n\n```javascript\n// This is a comment. Hello fellow reader,\
    \ how are you?\n```\n\n2. **Using a forward slash and an asterisk to start the\
    \ comment and an asterisk and a forward slash to end the comment: `/* */`**\n\n\
    This comment can span for as many lines as you wish:\n\n```javascript\n/* With\
    \ this comment I can comment a whole page\nand create as many lines as I want.\
    \ Once upon a time in a very far away land called New Jersey, formerly known as\
    \ Schejachbi, there was an American Indian tribe known as Lenape...  */\n```\n\
    \nLet’s move on to `conditional branching` which a very important step into real\
    \ programming.\n\n## 2.2 Conditional Branching\n\nWe have just learned how to\
    \ get feedback from a user but we could not do much with it because there were\
    \ no tools to make decisions based on the user’s given feedback. Well, we are\
    \ going to get some of those tools right now.\n\nSuppose we ask a user if he/she\
    \ wants to play along and based on the user’s answer, we either keep playing or\
    \ exit the program. It sounds like we need to apply an `if()` `else` conditional\
    \ code statement, right?\n\n### if, else conditionals\n\nTo make branching decisions\
    \ in JavaScript we need to know about the `if()`, `else` conditional statements.\n\
    \nBranching is when we either go this way, or go that way, depending on the `Boolean`\
    \ statement presented at the point of branching. In other words, “if true go this\
    \ way, else go that way”.\n\nThe basic `if`, `else` syntax is as follows:\n\n\
    `if(Boolean true) { do this stuff; } else { do that stuff; }`\n\nThe `else` part\
    \ is optional.\n\nNotice the term `Boolean true`. This is a very important concept\
    \ that many code students miss at the beginning. Inside of the parentheses we\
    \ have a `lock`. Independently from what you write inside of those parentheses,\
    \ the condition must always evaluate to a `Boolean` `true` in order to unlock\
    \ the code within the subsequent curly braces. The `Boolean` `true` is always\
    \ the correct key to unlock the `if() statement`. JavaScript will only execute\
    \ the code on the next code block if that condition is true. On the other hand,\
    \ if the condition evaluates to `false` the code block will be hidden from JavaScript,\
    \ and JavaScript will exit or execute the next code block if there is one available,\
    \ example: `else { }`.\n\n*   An `if()`, `else` statement is in a sense logical\
    \ OR:\n\n    Either the first block is executed, or the `else` block is, but never\
    \ both.\n\n*   **Please note:** From now on, some lab work and theory are going\
    \ to coexist. Please code along as we discuss the subject. **Part two** is going\
    \ to be a *hands-on* adventure.\n\nLet’s construct an example just to see how\
    \ `if()`, `else` works.\n\n1- On your editor (or [jsbeautifier.org](http://jsbeautifier.org/)),\
    \ assign a `prompt()` to a variable `x`.\n\nIn the `prompt()`, ask the user to\
    \ say *yes* if he/she want to continue,\n\nor to say *no*, if he/she wants to\
    \ leave the program.\n\nSomething like this:\n\n```javascript\nvar x = prompt(\"\
    Would you like to continue? yes or no\");\n```\n\n2- Construct an `if(x === \"\
    yes\")` statement that prints to screen the message\n\n\"Ok, let's play!\"\n\n\
    Otherwise, it prints to screen\n\n\"Ok, goodbye!\"\n\nAfter you finish coding,\
    \ if you are using jsBeautifier, press the button “Beautify JavaScript”, or `CTRL-ENTER`\
    \ to make your code more presentable. Notice how the editor adjusts the spacing\
    \ to conform to standard JavaScript styling.\n\nSee the image below.\n\n![](images/00001.jpeg)\n\
    \nFig 1 See original file:( [here](http://jsplain.com/index.php/Thread/8-branching1)\
    \ ) bit.ly/1uN96zN\n"
  raw: "Up this this point we have been writing *one liner* statements and as soon\
    \ as we press ENTER on the Console, the code gets executed. We could actually\
    \ write several lines of code in the Console by holding the *shift-key* when we\
    \ press *Enter*. That would take us to the second line where we could continue\
    \ writing our script. Although this works, it is not an ideal arrangement. It\
    \ is much better to write code on a ***text editor*** and then copy/paste it to\
    \ the Console when we are finished.\n\nI’m sure you have some sort of a text editor\
    \ on your computer. Do not use *Word* or *WordPad* because they add hidden formatting\
    \ code which interferes with your script. Microsoft Windows comes with ***Notepad***.\
    \ Notepad works and I use it hundreds of times a day to filter out text as I copy\
    \ from one source to paste onto another because it strips any visible or hidden\
    \ format. But I also use other free editors such as the free [Notepad++](http://notepad-plus-plus.org/),\
    \ [Programmer's Notepad](http://www.pnotepad.org/),  and [Brackets](http://brackets.io/),\
    \  to write real code.  \n\nNOTE: Since May 2015, Microsoft has release a really\
    \ cool free source code editor called [Visual Studio Code](https://code.visualstudio.com/)\
    \ which works in Windows 7 and up, Linux and Mac. This is highly recommended but\
    \ for now I am going to recommend something much simpler to do our exercises and\
    \ you will see why. Please read on.\n\nOf course you may use any one of your favorite\
    \ *plain* text editors, but let me introduce to you an online editor that comes\
    \ really handy because you don’t have to rely on your computer to get going. I\
    \ use this online tool many times a day because it also allows me to beautify\
    \ the code when I click the **beautify** button (creating proper white space):\n\
    \n[jsbeautifier.org](http://jsbeautifier.org/)\n\nPlease **Bookmark** the site.\
    \ The only disadvantage with this arrangement is that you can’t save the code\
    \ directly, but right now we are not saving anything, we are experimenting and\
    \ jsbeautifier works well for this purpose because it actually teaches us how\
    \ JavaScript syntax should be presented.\n\n***What is a code block?***\n\nA code\
    \ block is usually a collection of different statements that come together to\
    \ create a certain functionality. The best way to save groups of code is by creating\
    \ a *function*. We will get to play with functions soon.\n\nA code block is usually\
    \ limited (surrounded) by an opening curly brace **{** and a closing curly brace\
    \ **}**.\n\nHere’s an example of a code block:\n\n**{\n\n var x = \"Hello\";\n\
    \n console.log(x);\n\n}**\n\nWe will use code blocks from our next project on.\n\
    \n### Commenting code\n\nSometimes we want to make a note in our code to explain\
    \ the purpose of a code line to another human being but we don’t want JavaScript\
    \ to throw an error when it sees our comment.\n\nThere are two ways to make comments:\n\
    \n1- **Using two forward slashes**.\n\nWith this style of commenting we can’t\
    \ press the Enter key and write a second comment line. It must be done all in\
    \ one continuous line:\n\n**//** This is a comment. Hello fellow reader, how are\
    \ you?\n\n2- **Using a forward slash and an asterisk to start the comment and\
    \ an asterisk and a forward slash to end the comment: /* */**\n\nThis comment\
    \ can span for as many lines as you wish:\n\n**/*** With this comment I can comment\
    \ a whole page\n\nand create as many lines as I want. Once upon a time in a very\
    \ far away land called New Jersey, formerly known as Schejachbi, there was an\
    \ American Indian tribe known as Lenape...  ***/**\n\nLet’s move on to *conditional\
    \ branching* which a very important step into real programming.\n\n## 2.2 Conditional\
    \ Branching\n\nWe have just learned how to get feedback from a user but we could\
    \ not do much with it because there were no tools to make decisions based on the\
    \ user’s given feedback. Well, we are going to get some of those tools right now.\n\
    \nSuppose we ask a user if he/she wants to play along and based on the user’s\
    \ answer, we either keep playing or exit the program. It sounds like we need to\
    \ apply an if() else conditional code  statement, right?\n\n### if, else conditionals\n\
    \nTo make branching decisions in JavaScript we need to know about the ***if()***,\
    \ ***else*** conditional statements.\n\nBranching is when we either go this way,\
    \ or go that way, depending on the Boolean statement presented at the point of\
    \ branching. In other words, “*if true go this way, else go that way*”.\n\nThe\
    \ basic ***if***, ***else*** syntax is as follows:\n\nif(***Boolean true***) {\
    \ do this stuff; } **else {** do that stuff; **}**\n\nThe *else* part is optional.\n\
    \nNotice the term ***Boolean true***. This is a very important concept that many\
    \ code students miss at the beginning. Inside of the parentheses we have a *lock*.\
    \ Independently from what you write inside of those parentheses, the condition\
    \ must always evaluate to a Boolean *true* in order to unlock the code within\
    \ the subsequent curly braces.  The Boolean ***true*** is always the correct key\
    \ to unlock the *if() statement*. JavaScript will only execute the code on the\
    \ next code block if that condition is true. On the other hand, if the condition\
    \ evaluates to *false* the code block will be hidden from JavaScript, and JavaScript\
    \ will exit or execute the next code block if there is one available, example:\
    \ *else { }*.\n\n*   An ***if(), else*** statement is in a sense a logical OR\
    \ (or XOR):\n\n    Either the first code block is executed, or the *else* code\
    \ block is execute, but never both.\n\n    Notice how the else does not have a\
    \ condition, it works automatically when and only when the Boolean if() evaluates\
    \ to *false*. \n\nSo when the Boolean condition is *false*, JavaScript jumps over\
    \ the curly braces and moves on. In this case we can *catch the JavaScript execution*\
    \ with an optional ***else*** statement. The *else* statement does not take conditions;\
    \ it is just a catcher in case the first condition is not met. We include an *else*\
    \ option when we want JavaScript to choose one of two paths.\n\nSometimes we want\
    \ a certain code to execute only if a condition is met, but we do not have an\
    \ alternative condition. In this case, we use the ***if(){}*** by itself without\
    \ an ***else{}***.\n\nAn *if()* statement by itself is like saying  “*Nothing\
    \ to do here. Let’s keep going*” when the condition is false. Or “*Wait! There\
    \ is something to do here. Let’s take a detour and do this thing before we keep\
    \ going*” when the condition is true.\n\n*   **Please note:** From now on, some\
    \ lab work and theory lectures are going to coexist. Please code along as we discuss\
    \ the subject. **Part two** is going to be a *hands-on* adventure.\n\n*Let’s*\
    \ construct an example just to see how the *if(), else* works. Since some of these\
    \ scripts span for several lines, I have provided a link to an original file which\
    \ is located on one of my support websites. I recommend writing your own files\
    \ because you will not master the language if you copy/paste them, but at times\
    \ it becomes convenient to just copy and paste. *Use your best judgment*.\n\n\
    The link to the file on my server will be located below the image, like in the\
    \ example seen on the next page.\n\nLet’s start coding:\n\n1- On your editor (or\
    \ [jsbeautifier.org](http://jsbeautifier.org/)), assign a *prompt()* to a variable\
    \ ***x***.\n\nIn the *prompt()*, ask the user to say *yes* if he/she want to continue,\n\
    \nor to say *no*, if he/she wants to leave the program.\n\nSomething like this:\n\
    \n**var x = prompt(\"Would you like to continue? yes or no\");**\n\n2- Construct\
    \ an **if(x === \"yes\")** statement that prints to screen the message\n\n\"Ok,\
    \ let's play!\"\n\nOtherwise, it prints to screen\n\n\"Ok, goodbye!\"\n\nAfter\
    \ you finish coding, if you are using jsBeautifier, press the button “Beautify\
    \ JavaScript”, or CTRL-ENTER to make your code more presentable. Notice how the\
    \ editor adjusts the spacing to conform to standard JavaScript styling.\n\nSee\
    \ the image below.\n\n![](images/00001.jpeg)\n\nFig 1 See original file:( [here](http://jsplain.com/javascript/index.php/Thread/8-branching1)\
    \ ) bit.ly/1uN96zN"
