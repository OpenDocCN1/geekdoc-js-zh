    \ at the end of the first executable statement inside of the body code block.\n\
    \nOnce JavaScript runs the loop the first time, it returns to the form for a second\
    \ evaluation. The second evaluation will be as follows:\n\n`(for x starting at\
    \ one; and for x less than 5; increment x) { execute this code }`\n\nOn the second\
    \ iteration `x` is `1` but still less than `5` and therefore the code block is\
    \ executed again, and `x` is incremented again at the end. And so on until `x`\
    \ becomes `5`.\n\n## Let’s create a simple for loop to see how it works.\n\nThe\
    \ most common name for the temporary variable to be used as `x` is `i`. Perhaps\
    \ the reason is because it reminds us of the word `index*. So let’s use the classic\
    \ name `i` instead of `x`:\n\n```\nfor(var i = 0; i < 5; i++)\n```\n\nThat is\
    \ the header form which means:\n\n`for this declared variable `i` which starts\
    \ with the value of zero; as long as `i` is less than five; increment `i` by 1\
    \ after each loop cycle*.\n\nOn line 2 we include the executable instructions\
    \ in the code block. These instructions will be repeated 5 times by JavaScript:\n\
    \nThe following image illustrates the concept:\n\n![](images/00010.jpeg)\n\nFig\
    \ 10\n\n*   Please note: If you code this loop and paste it onto your console\
    \ you may have a one line result with a prefix of `(5)` telling you that the Console\
    \ ran it 5 times. This is normal behavior of Consoles. They don’t usually repeat\
    \ the same output more than once in order to save display real estate, they just\
    \ tell you how many times the loop ran with it, but in real life you would get\
