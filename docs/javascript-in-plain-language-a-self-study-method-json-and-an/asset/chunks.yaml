  trans: "\n到目前为止，我们一直在编写 `one liner`（单行）语句，一旦在控制台中按按下 `ENTER`，代码就会被执行。实际上，我们可以在按下\
    \ `Enter` 时按住 `shift-key`，从而在控制台中编写几行代码。这将带我们进入第二行，我们可以在那里继续编写脚本。虽然这种方法可行，但并不是理想的安排。更好的做法是在`text\
    \ editor`中编写代码，完成后再将其复制/粘贴到控制台中。\n\n我确定你的电脑上一定有某种文本编辑器。不要使用 `Word` 或 `WordPad`，因为它们会添加隐藏的格式代码，从而干扰你的脚本。Microsoft\
    \ Windows 自带 `Notepad`（记事本）。记事本非常好用，我每天使用它数百次来过滤从一个来源复制并粘贴到另一个来源的文本，因为它会去除任何可见或隐藏的格式。但我也会使用其他免费编辑器，例如免费的\
    \ [Notepad++](http://notepad-plus-plus.org/)、[Programmer's Notepad](http://www.pnotepad.org/)\
    \ 以及 [Brackets](http://brackets.io/) 来编写真正的代码。\n\n注意：自 2015 年 5 月起，Microsoft 发布了一个非常酷的免费开源代码编辑器名为\
    \ [Visual Studio Code](https://code.visualstudio.com/)，它支持 Windows 7 及以上版本、Linux\
    \ 和 Mac。这是非常推荐的，但目前我将推荐一种更简单的方法来完成练习，你会发现原因的。请继续阅读。\n\n当然，你可以使用任何你喜欢的 `plain`（纯文本）编辑器，但让我向你介绍一个非常实用的在线编辑器，因为你不需要依赖电脑就可以开始。我每天都会多次使用这个在线工具，因为当我点击\
    \ `beautify` 按钮时（创建适当的空格），它还允许我美化代码：\n\n[jsbeautifier.org](http://jsbeautifier.org/)\n\
    \n请将该网站加入`Bookmark`（收藏）。这种安排的唯一缺点是无法直接保存代码，但目前我们不需要保存任何东西，我们正在进行实验，jsbeautifier\
    \ 在此方面非常好，因为它实际上教了我们 JavaScript 语法应该如何呈现。\n\n### 什么是代码块（code block）？\n\n代码块通常是不同语句的集合，组合在一起创建一个特定的功能。保存代码组的最佳方法是创建一个`function`。我们很快就会学习使用函数。\n\
    \n代码块通常由左大括号 `{` 和右大括号 `}` 包围。\n\n这里有一个代码块的示例：\n\n```javascript\nvar x = \"Hello\"\
    ;\nconsole.log(x);\n}\n```\n\n从我们的下一个项目开始，我们将使用代码块。\n\n### 注释代码（Commenting code）\n\
    \n有时，我们想在代码中做一个标记，向另一个人类解释某行代码的作用，但又不希望 JavaScript 在看到我们的注释时抛出错误。\n\n制作注释有两种方法：\n\
    \n1. **使用两个正斜杠**。\n\n使用这种风格的注释，我们无法按 `Enter` 键编写第二行注释。它必须在连续的一行内完成：\n\n```javascript\n\
    // 这是一条注释。你好，亲爱的读者，你还好吗？\n```\n\n2. **使用正斜杠和星号开始注释，用星号和正斜杠结束注释：`/* */`**\n\n这种注释可以跨越任意数量的行：\n\
    \n```javascript\n/* 使用这个注释，我可以注释一整页\n并创建我想要的任何行。从前，在一个名为新泽西的遥远土地上，以前被称为 Schejachbi，有一个名为\
    \ Lenape 的美国印人部落... */\n```\n\n让我们进入 `conditional branching`（条件分支），这是实际编程中非常重要的一步。\n\
    \n## 2.2 条件分支（Conditional Branching）\n\n我们刚刚学会了如何从用户获取反馈，但我们无法利用它做什么，因为没有工具可以根据用户提供的反馈做出决策。很好，我们现在就要获取这些工具。\n\
    \n假设我们询问用户他她是否想一起玩，根据用户的回答，我们要么继续玩要么退出程序。这听起来我们需要应用一个 `if()` `else` 条件语句，对吧？\n\
    \n### if, else 条件语句\n\n在 JavaScript 中做出分支决策，我们需要了解 `if()`、`else` 条件语句。\n\n分支是指根据分支点呈现的\
    \ `Boolean`（布尔）语句，我们要么走这条路，要么走那条路。换句话之，“如果为真则走这条路，否则走那条路”。\n\n基础的 `if`, `else`\
    \ 语法如下：\n\n`if(Boolean true) { do this stuff; } else { do that stuff; }`\n\n`else`\
    \ 部分是可选的。\n\n注意 `Boolean true` 这个术语。这是许多学生在开始时忽略的重要概念。在括号内部我们有一个`锁`。无论你在括号内写了什么，条件必须始终评估为\
    \ `Boolean` `true` 才能解锁后续大括号内的代码。`Boolean` `true` 始终是解锁 `if()` 语句的正确钥匙。只有当条件为真时，JavaScript\
    \ 才会执行下一个代码块中的代码。相反，如果条件评估为 `false`，代码块将对 JavaScript 隐藏，JavaScript 将退出或执行下一个代码块（如果存在），例如：`else\
    \ { }`。\n\n*   一个 `if()`, `else` 语句在某种意义上是逻辑或（OR）：\n\n    要么执行第一个块，要么执行 `else`\
    \ 块，但绝不会两者都要。\n\n*   **请注意：** 从现在起，实验工作和理论将并存。在我们讨论主题时请跟着编码。**第二部分**将是一场*hands-on*（实操）冒险。\n\
    \n让我们构建一个示例，看看 `if()`, `else` 是如何工作的。\n\n1- 在你的编辑器（或 [jsbeautifier.org](http://jsbeautifier.org/)）上，将\
    \ `prompt()` 赋值给变量 `x`。\n\n在 `prompt()` 中，询问用户如果他她想继续就说 *yes*，\n\n或者如果他她想离开程序就说\
    \ *no*。\n\n类似于这样：\n\n```javascript\nvar x = prompt(\"Would you like to continue?\
    \ yes or no\");\n```\n\n2- 构建一个 `if(x === \"yes\")` 语句，在屏幕上打印消息\n\n\"Ok, let's\
    \ play!\"\n\n否则在屏幕上打印\n\n\"Ok, goodbye!\"\n\n完成编码后，如果你使用 jsBeautifier，点击“Beautify\
    \ JavaScript”按钮或 `CTRL-ENTER` 让你的代码更美观。注意编辑器如何调整间距以符合标准的 JavaScript 样式。\n\n查看下面的图片。\n\
    \n![](img/00001.jpeg)\n\n图 1 查看原始文件:( [here](http://jsplain.com/index.php/Thread/8-branching1)\
    \ ) bit.ly/1uN96zN\n\n"
- fmt: '

    ### 3- Copy your script from your own editor or from my own linked page and paste
    it on the `Console`. Then press `ENTER`.


    If you get an error, recheck your code. Debugging is what programmers do best
    because that’s where they spend 90% of their time (see step 4 to learn how to
    repeat the execution on the `Console`).


    When the prompt appears, type `yes` without quotes. If your script is well constructed
    you should have the following printout on your `Console`:


    *Ok, let''s play!*


    To copy the code from my own website, click on the `2-page icon` located to the
    right of the code script.


    ### 4- To repeat the execution, focus your mouse on the `Console` and press the
    `Up Arrow`. That will take you up to the last executed script. From there, (you
    can edit it if you need to do so) and then press `Enter` to run it again.


    This time, answer `no` to the prompt question.


    You should get: `ok, goodbye!* as a response.


    ### 5- Did you notice how the `prompt()` takes you to the main browser but then
    you have to look back at the console for an answer?


    You could replace `console.log()` with `confirm()` or with `alert()` in order
    to also get your answer on the browser.


    Just for practicing purposes, change your first `console.log` to `confirm()` and
    your second `console.log()` to `alert()`. Don’t worry about this inconstancy,
    we are just practicing.


    Use the editor at `jsbeautifier` to write your script. Then test both `if`, `else`
    outcomes like we did on steps 3 and 4:


    ```javascript

    confirm("Ok, let''s play!");

    alert("ok, goodbye!");

    ```


    ### Reviewing if(), else


    Inside of an `if(){ do this stuff; }` parentheses, we include a condition. Keep
    in mind that it is not the condition itself that unlocks the code block: it is
    the truthiness of the question you write in there that unlocks the code.


    Examples:


    `if(10 === 10){}` <-- since 10 is the same as 10, JavaScript will evaluate the
    statement as `true` and it unlocks the next code block.


    `if(10 === "10"){}` <-- since 10 is a number and `"10"` is a `string`, JavaScript
    evaluates the statement as `false` and jumps over the next code block without
    executing it.


    `var x = 33; if(x){}` <-- since `x` has a value other than `0`, `undefined`, or
    `null`, the statement is `true`.


    `if(!x){}` <-- since `x` has a value other than `0`, `undefined`, or `null`, this
    statement is `false`.


    `var y = "yes";`


    `if(y === "yes"){}` <-- since the value of `y` is string `yes`, this statement
    is `true`.


    `if(y !== "yes"){}` <-- since the value of `y` is `yes`, this statement is `false`.


    `if(y === "no"){}` <--- since the value of `y` is `yes`, this statement is `false`.


    `if(y === "no" || y === "yes"){}` <-- since one of the statement is `true`, the
    statement is `true`.


    `if(y === "no" && y === "yes"){}` <--- this statement is `false` since one of
    the operands is `false`.


    ### What about else?


    `else` is optional. We can have an `if()` conditional statement all by itself.
    However, we can’t have an `else` by itself since `else` is just a catcher helper
    for when `if()` fails. Or in other words, the alternate of `if()`.


    ### Adding a second condition in the middle of if(), else


    Sometimes, an `if(), else,` is not enough to accommodate all the outcomes. In
    that case there is an intermediate statement and it takes a condition just like
    `if()` does.


    This intermediate conditional is called `else if()`.


    Here’s the basic syntax:


    ![](images/00002.jpeg)

    Fig 2


    ### How to physically write the braces in a conditional statement


    Notice the opening brace on line 1. This is the JavaScript common way of doing
    it. If you come from an older language such as `C`, you may be used to code the
    opening brace on the second line by itself. That is perfectly fine. Whichever
    way you choose to use just make sure you don’t mix styles.


    Also, the closing brace is always at the beginning of a line (example: lines 3,
    5 and 7). After the `if()` closing brace we may write the `else` on the same line,
    or the `else if`, when applicable, and finish the line with an opening curly brace
    (see line 3).


    The very final closing brace always stand on its own (line 7). That is common
    to all languages that use braces. A very popular mistake is to write the closing
    brace to the right of the last statement. That is very ugly and very difficult
    to troubleshoot.


    Sometimes you will find JavaScript conditionals without braces and it also works.
    However I do not recommend such practice because it leads to inconstancies and
    it may trigger an error sooner or later because the JavaScript interpreter adds
    semicolons automatically when it thinks they are missing, and the lack of a curly
    brace may trigger the interpreter to think that is has reached the end of a statement.
    Until you master this styling concept use `jsBeautifier` to style your code after
    you are done writing it.


    ### When to use an else


    `else if()` is used when there are multiple conditions to check. It sits between
    the `if()` and the `else`.


    As mentioned before, we have to address the common condition first, which is when
    *x is divisible by both 3 and 5*. That should become our main `if()` condition.
    Then we create two additional `else if()`s for numbers that are divisible by 3
    or by 5.


    Finally, we assign the output “*No, x is not divisible by 3 nor 5*” to the catcher
    `else`.


    2- Let’s do the first condition and test:


    ![](images/00003.jpeg)

    Fig 3 (See original file: [here](http://jsplain.com/javascript/index.php/Thread/9-branching2/)
    ) bit.ly/1uoc1N8

