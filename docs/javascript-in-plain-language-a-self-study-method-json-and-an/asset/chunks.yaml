    \ items in positions 0,1,2 were deleted.\n\n### Adding items with `splice()`\n\
    \n4- Let’s add our items back into the array, starting at position zero and without\
    \ deleting any items in exchange: `x.splice(0,0, \"blue\",\"red\",\"green\");`\n\
    \n5- Call the array: `x;` returns `[\"blue\", \"red\", \"green\", \"violet\",\
    \ \"brown\"]`.\n\nWe started at position zero and added all the listed items,\
    \ and deleted zero items.\n\nYou may not use `splice()` extensively on your programming\
    \ but it is a great tool to understand and call upon it when needed.\n\nThere\
    \ are many more methods we can use with arrays. Learning all of them at once is\
