    I didn’t write any JavaScript code. AngularJS took care of the internal process.
    This is programming at a higher level of abstraction. Do we still need to know
    JavaScript? Of course we do! Your knowledge of JavaScript will become necessary
    when we go beyond this simple testing.


    ### Do I always have to include my expressions on my web page?


    No, we are doing it just for testing and understanding purposes before introducing
    the module and controller. But yes, you can always do this in production and it
    should work for simple stuff.


    ### ng-init


    Let’s introduce another directive so that we have more tools to play with.


    - An `ng-app` directive initializes the AngularJS application.

    - An `ng-init` directive initializes some `data` to be used on the application.


    Let’s see how `ng-init` works in its simplest form:


    1- Open your basic HTML script and modify the HTML tag to contain a second directive
    as follows:


    ```html

    <html ng-app ng-init="city=''Harrisburg''; state=''Pennsylvania''">

    ```


    2- Then in the body write the following:


    Do you know `{{city}}` is the capital of `{{state}}`?


    3- Save it as `ang5.html` and test it.


    You should see the following sentence on your browser display:


    *Do you know Harrisburg is the capital of Pennsylvania?*


    ![](images/00027.jpeg)


    Fig 26 [raw file](http://icontemp.com/jpl/ang14/ang5.txt) | [html](http://icontemp.com/jpl/ang14/ang5.html)


    ### Do you see what happened?


    We initialized two variables by using `ng-init`: `city` and `state`, and then
    we were able to process them via two expression tags on the HTML output. There
    was no need to address the DOM with complicated scripting. There are better ways
    to do this but right now the purpose is to become familiar with the AngularJS''
    basic tools.


    By initializing the arguments `city` and `state` on the HTML tag they became available
    to use on the web page. However these variables are normally placed on a separate
    sheet.


    ### ng-bind


    Just to illustrate the purpose of the double curly braces, let’s write the same
    script in a different way: by using a directive called `ng-bind`.


    6- I’m only doing it for variable `city` and not for variable `state` just to
    show how both will work:


    ```html

    Do you know <span ng-bind="city"></span> is the capital of {{state}}?

    ```


    And the display will be:


    *Do you know Harrisburg is the capital of Pennsylvania?*


    Actually, AngularJS always replaces the curly braces with `ng-bind` in its internal
    process. If you don’t mind writing the extra `SPAN` tag this actually works a
    bit faster. When you refresh the page (`CTRL f5` on Windows) and focus on the
    output, you will see that Harrisburg shows up immediately, whereas Pennsylvania
    will first show the braces and then it converts to the proper word. It happens
    very fast but you might be able to catch it.


    ### What does ng-bind do?


    It binds `data source` to target. No need to play the `getElementById` DOM game
    anymore.


    There is a lot more to know about AngularJS binding but we need to go slow and
    just grasp enough to understand what comes next. It is like that famous expression
    “[Rome wasn’t built in a day](https://en.wikipedia.org/wiki/Rome_wasn%27t_built_in_a_day)”.


    ### ng-cloak: Avoiding display flickering


    When using the curly braces `{{ }}` instead of `<span ng-bind="city">` you may
    notice a quick flicker on the display because the curly braces have not yet been
    evaluated by AngularJS.


    If that becomes a problem for you, include the link to the library in the HEAD
    section instead of the BODY section. This way the curly braces will be evaluated
    before the browser displays the document. Including the link in the head may have
    some side effects, depending on the complexity of your page, hence the reason
    why more and more developers are moving library links to the bottom of the page.


    If you are embedding AngularJS on a page but you have no access to the HEAD script,
    then you may use `ng-bind` instead of the curly braces, or you could use `ng-cloak`.


    Since `ng-cloak` involves CSS, I am not going to describe here. Please check the
    following link for a full description of this implementation:


    [docs.angularjs.org/api/ng/directive/ngCloak](https://docs.angularjs.org/api/ng/directive/ngCloak).
    | bit.ly/1pcTqjF


    ## 5.4 Lab work 14


    ### Part A: Initializing an object and outputting its contents in a paragraph


    Speaking of binding, let’s “bind” to memory all we have covered so far by doing
    a few exercises.


    This is actually a familiar exercise from our JavaScript lab sessions. Here we
    are going to initialize an object called `colors`. The object contains the following
    properties:


    a) `"green": "green is the color of balance and growth.",` `"blue": "blue is the
    color of trust and peace.",` `"indigo": "indigo is the color of intuition"`


    Then we will get the following display on the browser:


    b) The color green is the color of balance and growth.

    The color blue is the color of trust and peace.

    The color indigo is the color of intuition.


    The directives we are going to use are: `ng-app`, `ng-init='' ''` and the double
    brace `{{ }}` expressions where the output display evaluation will take place.


    Notice how `ng-ini` is using single quotes. This is because the object `colors`
    we are going to insert inside of the quotes have in itself double quotes. By using
    single quotes for the `init` we assure that JavaScript does not get confused and
    abort the expression prematurely.


    Please refer to the following link if you want to copy the opening HTML tag with
    both `ng-app` and `ng-init` plus the object code block: [this raw](http://icontemp.com/jpl/ang14/ang7b.txt)


    Try not to copy/paste it before you attempt to create your own version of it,
    or take just a quick look to refresh your mind and then try doing it yourself.


    **Let’s start**. (On the next page please find step by step instructions).


    1- Create a basic HTML page (as we’ve done before). See the starter [raw file](http://icontemp.com/jpl/ang14/1.txt)


    If you are not using the starter raw file make sure you do the following:


    a) In the HTML opening tag insert a directive to allow AngularJS to manage your
    web page.

    b) On the bottom of the BODY container insert the URL for the AngularJS library.


    2- After the `ng-app` directive, but still inside of the HTML opening tag, add
    a `ng-init='' ''` inside of the '' '' insert an object named `colors` with the
    properties described on the previous page under exhibit `a`.


    For your convenience I have included a file of the raw text to be inserted as
    an object from which you can copy/paste: [raw file](http://icontemp.com/jpl/ang14/ang7b.txt)


    3- In the BODY section add three paragraphs, one for each color. See the first
    sample for the color green below:


    ```html

    <p>The color {{colors.green}}</p>

    ```


    4- Save it as `ang7.html` or any other name you prefer. Open it on your browser.
    It should look like this: [html](http://icontemp.com/jpl/ang14/ang7.html)


    5- A whole script and further explanation can also be seen at the [forum](http://jsplain.com/javascript/index.php/Thread/36-Lab-14a)
    | bit.ly/1rk2jLx


    ### Part B: Initializing variables and outputting a calculation


    In this new exercise we want to initialize two variables, `length=9` and `width=3`
    and then output the following paragraph:


    **If the length is 9 and the width is 3, the perimeter is 24.**


    Please remember that where it says 9 and 3, the dynamic markup should be written
    like `{{length}}` and `{{width}}` which is later replaced by the value assigned
    to each variable.


    As for the total 24, it should be the perimeter of the rectangle. You can use
    your own formula. I am going to use `length * 2 + width * 2` as my expression.


    After finishing your script please compare it with mine here: [forum](http://jsplain.com/javascript/index.php/Thread/37-Lab-14b)
    | bit.ly/1rkKW8 | [raw file](http://icontemp.com/jpl/ang14/ang8.txt) | [html](http://icontemp.com/jpl/ang14/ang8.html)


