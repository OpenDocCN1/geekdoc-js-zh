    ## 2.9 列表


    ### 字符串与数组


    到目前为止，我们主要在处理 `string` 类型的值。这是一个赋值给由 `var` 初始变量 `x` 的字符串值示例：


    ```javascript

    x = "orange";

    ```


    在字符映射方面，`o` 是位于位置 `zero` 的第一个字符，`r` 是位于位置 1 的第二个字符，`a` 是位于位置 2 的第三个字符，以此此类推。


    这是另一个示例：


    ```javascript

    y = "orange banana apple";

    ```


    在上面的示例中，`b` 是第 8 个字符（我们必须计算空格），它位于位置数字 7（`0,1,2,3,4,5,6,7`）。


    **如果我们想统计单词数而不是字符数呢？**


    我们不能用单独的引号分隔单词，因为 JavaScript 会抛错：


    ```javascript

    y = "orange" "banana" "apple"; <-- 这样不起通。

    ```


    即使我们用逗号将它们分隔，


    ```javascript

    y = "orange","banana","apple";

    ```


    JavaScript 会先将 `y` 赋值为 `orange`，然后重新将 `y` 赋值为 `banana`，最后赋值为 `apple`，最终 `y` 中只会存储最后一个值。


    因此，在字符串值中，映射**限于单个字符**。整个字符串被视为一个包含多个字符的单元。


    *   **简而言之**，如果我们想将单词作为独立的独立单元保存在变量中，我们需要使用不同的 `data type`，因为 `string` 无法做到。其中一种类型被称为
    `array`（还有其他的）。


    `array` 类型和 `string` 类型的区别在于我们可以存储单个单词。数组的另一个优势是，我们还可以在同一个变量的独立数据包中存储 `number`
    类型的值，以及其他类型如 `functions`、`objects` 和 `Booleans`。


    就像字符串值一样，在数组中我们也从位置零开始数字地访问每个位置。事实上，字符串值是一个由单个字符组成的非常简单的数组。


    **把数组想象成一个活文件夹**。


    每个口袋都按顺序标记，在每个口袋中，我们可以存储任何想要的内容。


    要检索每个口袋的内容，我们使用括号语法调用数组，并使用位置数字来访问我们尝试获取的数据。


    #### 数组语法


    要声明一个 `array` 类型的值，我们使用一对方括号：


    ```javascript

    var x = [ ];

    ```


    你可以在网上读到关于括号语法，它被称为数组语法，这是因为括号语法源于数组口袋位置的概念。


    上面的示例是一个空数组，因为括号内部没有任何数据，但方括号已指示 JavaScript 解释器将变量 `y` 声明为 `type array`。


    回到我们上一个字符串示例，如果我们想保存独立的单词，可以按照以下方式声明并赋值变量 `y`：


    ```javascript

    var y = ["orange","banana","apple"];

    ```


    现在，如果我们调用 `y` 的位置 2，我们得到结果 "apple"：


    ```javascript

    y[2]; <-- 它显示 "apple"

    ```


    或者更隐式地：


    ```javascript

    console.log(y[2]); <-- 它显示 apple

    ```


    知道我们的数组 `y` 有三个值，从位置零延伸到位置 2，我们可以通过访问后续位置来向它添加更多值。例如：


    ```javascript

    y[3] = "peach";

    ```


    现在如果我们在控制台（Console）中输入 `y;` 调用变量 `y`，我们得到：


    ```javascript

    ["orange", "banana", "apple", "peach"]

    ```


    如果我们重新赋值已存在位置之一（例如位置零）会发生什么？


    ```javascript

    y[0] = "grape";

    ```


    我们覆盖了之前的值，因为我们刚刚将位置重新赋值为不同的值。数组不会为了容纳更多项目而移动位置，它只是通过将位置重新赋值为其他内容来删除现有值。


    数组 `y` 现在仍然包含之前数量的值：


    ```javascript

    ["grape", "banana", "apple", "peach"] "orange" 被删除了。

    ```


    ### 使用 push() 和 unshift() 向数组插入元素


    随着数组变得越来越大，几乎不可能知道数组包含多少项，这使得添加新项非常困难，因为当我们向数组的某个位置添加项而该位置已填充时，JavaScript 会用新项替换旧项。旧项从数组中删除。


    为了防止这种删除发生，JavaScript 有两种机制帮助我们向数组添加项：`push` 和 `unshift`。


    #### push()


    向数组添加新项最常见的方法是将它们添加到列表的最末尾。


    *   数组方法 `push()` 将项添加到列表的最末尾。


    你记得我们如何使用 `+=` 向字符串追加字符吗？


    使用 `+=` 的问题在于，它会将新项作为一个单元添加到最后一个项（通过连接）。


    例如，在


    ```javascript

    var y = ["orange","banana","apple"];

    ```


    如果我们添加 "cherry"，我们将得到：


    ```

    ["orange", "banana", "apple"]

    ```


    向末尾添加项的正确语法如下：


    ```javascript

    y.push("cherry");

    ```


    现在数组多了一个元素：


    ```

    ["orange", "banana", "apple", "cherry"]

    ```


    **push 的含义：**


    想象一堆砖块。当我们把一块新砖块放在堆的顶部时，由于它的重量会将其他的向下推。堆的顶部是数组的最后一个位置。我们这样做是为了向堆中插入一个新项。


    #### unshift()


    `unshift()` 方法将项添加到数组的开头。


    当我们垂直方向观察数组时，数组的开头是它的底部，而在水平方向上，它是数组的左侧。


    以上一个主题中数组 `y` 的实例为例，让我们 `blueberry` 添加到数组的开头：


    ```javascript

    y.unshift("blueberry");

    ```


    数组 `y` 现在是：


    ```

    ["blueberry", "orange", "banana", "apple"]

    ```


    注意 "orange" 如何移动到位置 1（即第二个项），为新位置零的 "blueberry" 让位。


    **unshift 的含义：**


    为了在堆底部插入一块新砖块，我们需要向上移动所有的砖块，这样就可以挤进一块新砖块作为堆的第一个项，因为第一个项位于底部。


    另一方面，当我们通过 `push` 向堆顶部插入一个新项时，我们实际上是在推的过程中将所有东西都向下移动，尽管底部没有地方去（Shift 实际上用于从底部移除一个项，我们稍后会看到）。当我们移除项时，砖块会向下移动，但它们并没有被推，因为我们没有在堆的顶部插入新项。


    现在我们知道了 `push()` 和 `unshift()`。


