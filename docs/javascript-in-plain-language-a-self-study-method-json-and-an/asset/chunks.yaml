    ## 2.3 The anatomy of a function


    On the last exercise we kept pressing the *Up Arrow* to recall the program in
    order to test it.


    What if we didn’t have an Up Arrow? We would have to write the script again and
    again, correct?


    This is where functions come handy. *Stop!* Don’t think of math when I mention
    functions in JavaScript. Think of *functionality*. In JavaScript functions are
    containers of program routines. We could have saved our if(), *else* script in
    a function and just recall it by *calling* the function. That’s one word, versus
    10 lines of text.


    ### Preliminary things to know about a function


    a) A function is a closed container like the blue rectangle in the picture seen
    below.


    b) To feed data into a function in order to be processed, we need one or more
    *input* **parameters**.


    c) To *export* data from a function in order to reuse it, we need to implement
    an interface called *return*, ***or*** alternatively assign some outer variable
    to the new result.


    ![](images/00006.jpeg)


    Fig 6


    ### Scripting a function


    A representation of a function goes like this:


    function funcName() { stuff to do; }


    The above function does not take any input data, it just does stuff.


    To create a function that takes an input parameter and processes it, we need to
    include the parameter inside of the parentheses:


    function funcName(***inputParameter***) { stuff to do; }


    When we say to “*call* a function” it means to have the function execute its *magic*.
    All we have to do to call a function, is to write the function’s name and attach
    a pair of parentheses as a postfix :


    **funcName()**;


    Or, if the function has an input *parameter* we must include and *argument* that
    will replace the parameter:


    **funcName(**123**)**;


    when 123 is a number.


    or


    **funcName(**x**)**;


    when x is a variable.


    or


    **funcName(**"Tony"**)**;


    When Tony is a string of characters.


    Here’s a function arbitrarily named *sizeMeUp* that converts a string value into
    uppercase:


    function sizeMeUp**(**x**){**console.log(x.toUpperCase());**}**


    Here, x is the input parameter that gets replaced by the data we pass in when
    we call the function.


    1- Calling the function in order to up case "red white blue": **sizeMeUp("red
    white blue");**  It displays *RED WHITE BLUE*.


    Let’s go back to our previous *conditional* exercise...


    Remember how we had to use the Up Arrow in order to repeat the code for another
    test run?


    We could make things easier by inserting our conditional exercise inside of a
    function because it saves us from having to retype the script every time we need
    to test it.


    All we have to do is to *call* the function by its name:


    functionName();


    *Shall we redo it?*


