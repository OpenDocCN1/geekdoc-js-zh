    \ framework library `AngularJS`, which is based on JavaScript.\n\nThis library\
    \ is revolutionizing the way we build websites and although still in its infancy,\
    \ it has already made a permanent impact and you will see why as you get to it.\
    \ By the time you finish the next few chapters you will be able to implement dynamic\
    \ data into your basic webpage in an easy and comprehensive way.\n\nPlease keep\
    \ in mind that I am only introducing AngularJS, this is not a complete book about\
    \ it since the topic spans over several volumes. What I hope to achieve by writing\
    \ this material, is to empower you to pursue further studies of AngularJS. This\
    \ information will unlock what I consider the hardest part of getting into. Through\
    \ the exercises and explanations given you should be able to conquer this first\
    \ barrier.\n\n## 4.2 An introduction to JSON\n\nJavaScript Object Notation, `JSON`\
    \ (it is pronounced J SON), is an open standard format that uses human-readable\
    \ text to transmit objects consisting of key-value pairs (JavaScript objects).\
    \ It has become an alternate technology to XML in its use for transmitting data\
    \ between a server and web application. The term ‘alternate’ may be outdated because\
    \ nowadays JSON is the preferred method for web services.\n\nThe reason why I\
    \ am introducing JSON at this point is because at the time of this writing JSON\
    \ has become the must know subset of JavaScript if one wants to build web pages\
    \ and web apps. It should be now any web literacy curriculum. JSON has achieved\
    \ such popularity that other languages are now implementing it. The good news\
    \ is that you have already been prepared for this technology throughout the book\
    \ and it is just a matter of becoming more aware of its existence.\n\nJSON format\
    \ is syntactically the same as when we create lists, being it numeric as an array\
