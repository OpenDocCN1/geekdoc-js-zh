  trans: "\n\na) 首先在此处获取原始 JavaScript 脚本副本：[原始文件](http://icontemp.com/jpl/f2c.txt)。\n\
    \nb) 我们需要将 `console.log` 替换为 `return`，因为我们要捕获结果并发送到 `$scope`，以便显示。\n\nc) 现在我们有两个选择（参见步骤\
    \ c 到 f）：\n\n我们可以通过这种方式将函数 `f2c` 赋值为 `$scope` 的属性：\n\n```javascript\n$scope.f2c\
    \ = function(f){return ((f-32) * 5 / 9);}\n```\n\nd) 那么，当我们进入 HTML 页面视图时，我们可以这样实现结果：\n\
    \n```html\n{{f2c(100)}}\n```\n\ne) 或者（这是一种更好的方法，因为它避免了在 HTML 视图中使用 JavaScript），我们可以将原始函数插入到控制器中（`console.log`\
    \ 除外），然后为 `$scope` 分配变量（例如 `result`），并将函数调的结果赋值给它。\n\n```javascript\nx.controller('myController',\
    \ function($scope){\n\nfunction f2c(f){\n\n  return (f-32) * 5 / 9;\n\n}\n\n$scope.result\
    \ = f2c(100);\n```\n\nf) 如果我们使用选项 (e)，我们就可以这样在视图中应用变量 `result`：\n\n```html\n{{result}}\n\
    ```\n\n7- 在 HTML 页面的 BODY 中，通过添加一个 DIV 容器创建一个视图。\n\n将起始 DIV 标签链接到 `ng-controller=\"\
    myController\"`。\n\n8- 在 DIV 容器内部添加带有以下消息的段落：\n\n```html\n<p>100 degrees Fahrenheit\
    \ is {{YOUR CODE HERE}} Celsius.</p>\n```\n\n9- 在显示 `YOUR CODE HERE` 的地方，根据你在\
    \ (c) 或 (e) 中编写的控制器 JavaScript 方式，将其替换为选项 (d) 或选项 (f)。\n\n10- 保存并测试你的应用。显示结果应该是：\n\
    \n100 degrees Fahrenheit is 37.77777777777778 Celsius\n\n完成后，将其与我此处的结果进行对比：\n\n\
    [论坛](http://jsplain.com/javascript/index.php/Thread/42-Lab-15c/) | bit.ly/1ruKCKT\n\
    \n[原始文件](http://icontemp.com/jpl/ang14/angc3m.txt) |\n\n[html](http://icontemp.com/jpl/ang14/angc3m.html)\
    \ |\n\n建议：尝试将其他一些 JavaScript 练习转换为 Angular。你可能得不到完美的解决方案，但将获得大量的练习。\n\n### 将控制器放在单独的文件中\n\
    \n现在我们已经从逻辑上分离了控制器和视图单元（它们都是模块的一部分），我们可以安全地将 `controller` 和 `module configuration`\
    \ 放在单独的文件中。这绝不是故事的结束，也许只是开始。\n\n对于简单的应用程序，我们可以像之前那样将它们留在同一个页面上。然而，作为多能的开发者，我们需要练习关注点分离，以便为应对更大的项目做准备。\n\
    \n这非常简单。以我们刚刚完成的练习（华氏度转摄度）为例：\n\n[原始文件](http://icontemp.com/jpl/ang14/angc3m.txt)\
    \ |\n\n1- 使用不同的名称保存它，例如 `f2cfinal.html`。\n\n现在我们可以编辑该文件：\n\n2- 复制并剪切（删除）`<script></script>`\
    \ 内部所有控制器和模块配置的所有内容。只保留 `SCRIPT` 标签，以便我们可以添加指向单独文件的链接。\n\n3- 将内容粘贴到新文件中并保存为 `mycontroller.js`（或任何其他名称）。\n\
    \n注意 `.js` 扩展名。确保该文件与 `f2cfinal.html` 在同一个文件夹中。\n\n4- 回到 `f2cfinal.html`，在属于控制器的起始\
    \ `SCRIPT` 标签中，输入新文件的路径，应包含 script 标签在内的内容：\n\n```html\n<script src=\"mycontroller.js\"\
    ></script>\n```\n\n5- 保存并测试。\n\n与我此处的结果对比：\n\n[原始文件](http://icontemp.com/jpl/ang14/f2cfinal.txt)\
    \ |\n\n[.js 文件](http://icontemp.com/jpl/ang14/mycontroller.js) |\n\n[html](http://icontemp.com/jpl/ang14/angc3m.html)\
    \ |\n\n### 附加信息\n\n有关控制器的更新和进一步探索（本电子书涵盖的内容之外），请访问 JSplain.com 上的文章：[控制器的笔记](http://jsplain.com/javascript/index.php/Thread/145-AngularJs-controllers-things-we-should-know/)。\n\
    \n### ng-model\n\nAngularJS 有时可以非常简单。\n\n请查看基于我们在 C 部分完成的 JavaScript 练习的以下脚本：\n\
    \n[华氏度 / 摄氏度转换](http://icontemp.com/jpl/conversions.html) | bit.ly/ZQgTRW\n\n\
    你还记得我们如何做这个算法的 JavaScript 原始版本吗？\n\n为了刷新记忆，请查看论坛中显示的 `第三` 个示例：\n\n[Lab 6](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)\
    \ | bit.ly/1Dp2SKk\n\n现在回到顶部的第一个链接，它看起来很酷，并且显示在网页上。当我们更改文本框中的值时，它会自动将值转换为摄氏度或华氏度。\n\
    \n让我们看看脚本看看它做了什么处理。它比我们实验室 6 中的原始 JavaScript 版本要简单得多。\n\n在论坛中，你会找到一个在线演示以及其下方的脚本。请阅读每行代码的解释：\n\
    \n[论坛板块](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
    \ | bit.ly/ZQieYU. \n\n在阅读了论坛中的描述并玩玩演示后，请回到这里进行实验工作。我们将在不到 10 分钟内完成这个项目，保证！\n\n\
    ### 实验工作，创建转换脚本\n\n你注意到温度转换程序中没有声明 `controller` 或 `module` 吗？\n\nAngularJS 很多时候可以节省我们数小时的工作，随着他们的不断改进，它变得越来越好。对于这项工作，我们只需要几个工具（以及对\
    \ `ng-model` 的介绍）：\n\na) 库链接\nb) 一个 `ng-app` 指令\nc) 一个 `ng-model` 指令\nd) 几个大括号\n\
    e) 两个 HTML 输入框\n\n准备好开始了吗？\n\n1- 获取我们的基础 HTML：[原始文件](http://icontemp.com/jpl/ang14/ang1.txt)\n\
    \n2- 保存为 `conversions.html`。\n\n3- 在 BODY 中，将 `hello` 替换为一个包含其他 DIV 的 DIV：\n\n\
    ```html\n<div>\n  <div></div>\n  <div>\n</div>\n``` (此处补充闭合标签)\n\n4- 如果你没有使用我的启动文件，请确保在你的起始标签（或包裹视图的\
    \ DIV）上包含 `ng-app` 指令。\n\n5- 在步骤 3 的顶层 DIV 上，声明 `ng-init` 来初始化变量，如下所示（`init` 是因为我们将不使用控制器）：\n\
    \n```html\n<div ng-init=\"f=32;c=0\">\n```\n\n6- 为了测试，我们在 DIV 容器内（任何 DIV 容器）写一些大括号：\n\
    \n```html\n{{f -c + f}}\n```\n\n然后保存并在浏览器中打开。\n\n* 如果显示 `{{f -c + f}}`，说明有问题。检查你的代码是否有缺失或拼写错误。\n\
    * 如果显示数字 `64`，说明你的脚本运行正常。\n\n一旦脚本正常运行，删除大括号并继续项目。早期测试总是一个好主意，可以节省大量时间和头疼。在进入下一个实现阶段之前，我们应该分阶段测试。\n\
    \n7- 下一步是设计第一个输入框。\n\n在第二对 DIV 创建的容器内部，编写一个类型为 `number` 的输入框。（关于输入框：[HTML input](https://en.wikipedia.org/wiki/Form_%28HTML%29)\
    \ | bit.ly/1qy2lvA))\n\n同时在左侧包含描述。这是我的示例：\n\n`Fahrenheit to Celsius: <input type=\"\
    number\">`\n\n注意：你可能习惯使用自合标签如 `/>`。两种方式都可以。随着 HTML5 的出现，我倾向于不使用自合标签。\n\n8- 太极了，现在让我们为输入框添加\
    \ `ng-model` 并将其赋值给变量 `f`：\n\n`Fahrenheit to Celsius: <input type=\"number\" ng-model=\"\
    f\">`\n\n"
- fmt: "\nIf you have read my explanation about `ng-model` on the `forum` `demo` you\
    \ will know that the directive `ng-model` is an object that saves the data inputted\
    \ by the user, and links it (or binds it) to the variable assigned to this `ng-model`,\
    \ the ` =”someName”` part of this declaration (sort of what `prompt()` does in\
    \ JavaScript when is assigned to a variable). In this case it is variable `f`\
    \ which although it defaults to 32, it can be changed by the input data the user\
    \ enters on this text box and thanks to the binding provided by `ng-model`.\n\n\
    *   Do not confuse these terms: `model` versus `module`.\n*   `Module` is the\
    \ complete application. `Model` is a little object that saves data and binds it\
    \ to some variable. There could be hundreds of little models in one `Module`.\n\
    \n### 9- Let’s finish this line by adding the `curly double braces` to the right\
    \ of the HTML input box.\n\nInside of the braces include the formula to convert\
    \ from Fahrenheit to Celsius:\n\n```\n{{(f-32) * 5 / 9}}c\n```\n\nNOTE: The little\
    \ `c` on the right is just a character to tell the user that this result is in\
    \ Celsius. It has nothing to do with the variable `c` previously declared.\n\n\
    The whole line should look like this:\n\n```\nFahrenheit to Celsius: <input type=\"\
    number\" ng-model=\"f\"> {{(f-32) * 5 / 9}}c\n```\n\n### 10- Save it and test\
    \ it.\n\nAt this time all your DIVs should look like the following:\n\n```html\n\
    <div ng-app ng-init=\"f=32;c=0\">\n  <div>\n    Fahrenheit to Celsius: <input\
    \ type=\"number\" ng-model=\"f\"> {{(f-32) * 5 / 9}}c\n  </div>\n  <div></div>\n\
    </div>\n```\n\n### 11- Now, let’s write the input box for the conversion of `Celsius\
    \ to Fahrenheit`.\n\nOn the next DIV container write the following code:\n\n```html\n\
    <div>\n  Celsius to Fahrenheit: <input type=\"number\" ng-model=\"c\"> {{c * 9\
    \ / 5 + 32}}f\n</div>\n```\n\n### 12- Test it, test both conversions.\n\nThe final\
    \ result can be seen on the [Forum board](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
    \ | bit.ly/ZQieYU.\n\n**Would you like extra practice?**\n\nYou can add an extra\
    \ box and initialize another variable like for example `k`:\n\n**Here are some\
    \ possible conversion formulas:**\n\na) Kelvin to Fahrenheit: `(K - 273.15) *\
    \ 9/5 + 32`\nb) Kelvin to Celsius: `K - 273.15`\n\n# More Project Ideas\n\nFor\
    \ more project ideas please visit the following link on the forum board created\
    \ for this book\n\n[Project Ideas In Angular](http://jsplain.com/javascript/index.php/Thread/144-Project-ideas-in-Angular/)\n\
    \n## Directives summary and resources\n\nAs a review, here are some of the directives\
    \ we have covered, along with other useful directives and their respective official\
    \ page link.\n\nI will continue to explain these and other directives by posting\
    \ examples on the JSplain forum for further practicing:\n\n[Forum thread starter](http://jsplain.com/javascript/index.php/Thread/49-Directives-Summary-and-Resources/)\
    \ | bit.ly/1roi5qc\n\n**For Modules/Controllers:**\n\n*   [ng-app](https://docs.angularjs.org/api/ng/directive/ngApp),\
    \ or `data-ng-app` or `ng-app=\"appName\"`\n*   [ng-controller](https://docs.angularjs.org/api/ng/directive/ngController)\n\
    \n**For Data Binding:**\n\n*   [ng-init](https://docs.angularjs.org/api/ng/directive/ngInit)\n\
    *   [ng-model](https://docs.angularjs.org/api/ng/directive/ngModel)\n*   [ng-bind](https://docs.angularjs.org/api/ng/directive/ngBind)\n\
    \n**For DOM Traversing:**\n\n*   [ng-hide](https://docs.angularjs.org/api/ng/directive/ngHide)\n\
    *   [ng-show](https://docs.angularjs.org/api/ng/directive/ngShow)\n*   [ng-view](https://docs.angularjs.org/api/ngRoute/directive/ngView)\n\
    *   [ng-repeat](https://docs.angularjs.org/api/ng/directive/ngRepeat)\n\n**For\
    \ Events:**\n\n*   [ng-mouseenter](https://docs.angularjs.org/api/ng/directive/ngMouseenter)\n\
    *   [ng-click](https://docs.angularjs.org/api/ng/directive/ngClick)\n*   [ng-keypress](https://docs.angularjs.org/api/ng/directive/ngKeypress)\n\
    \nFor a quick sample of a module and controller configurations see one of our\
    \ exercises here:\n\n[Forum](http://jsplain.com/javascript/index.php/Thread/43-Lab-15a2)\
    \ | bit.ly/1ve4e66.\n\n# In conclusion\n\nThank you for staying with me until\
    \ the end of this project. I always feel a bit emotional when I get to this part.\n\
    \nThere is so much I haven’t written about JavaScript and AngularJS, but we need\
    \ to take a break in order to digest all we have covered in this book.\n\nIt is\
    \ my belief that I have provided the necessary boost for you to feel empowered\
    \ and continue your own journey, and if you ever have a question that I may be\
    \ able to help, I’m only a click away on the [new forum platform](http://jsplain.com/javascript/index.php/Thread/49-Directives-Summary-and-Resources/)\
    \ purposely created for this project.\n\nPlease take the time to reread this book\
    \ and practice all the exercises again.\n\nIf you feel like expanding your JavaScript\
    \ understanding, my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ is all about the JavaScript library methods, objects, closures and memory management.\n\
    \nAs for AngularJS, it is a whole new world and there is so much to write about\
    \ it. We have covered the hardest part of learning to use AngularJS, the very\
    \ initial concepts.\n\n**Update:** There is a new supplemental exercise eBook\
    \ if you want to do more AngularJS exercises. Please take a look:\n\n[AngularJS\
    \ Supplement: Easy Projects on Filters](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\n"
  raw: 'If you have read my explanation about *ng-model* on the *forum* *demo* you
    will know that the directive **ng-model** is an object that saves the data inputted
    by the user, and links it (or binds it) to the variable assigned to this ng-model,
    the  =”someName” part of this declaration (sort of what prompt() does in JavaScript
    when is assigned to a variable). In this case it is variable ***f*** which although
    it defaults to 32, it can be changed by the input data the user enters on this
    text box and thanks to the binding provided by **ng-model**.


    *   Do not confuse these terms: ***model*** versus ***module***.


    *Module* is the complete application. *Model* is a little object that saves data
    and binds it to some variable. There could be hundreds of little models in one
    Module.


    9- Let’s finish this line by adding the *curly double braces* to the right of
    the HTML input box.


    Inside of the braces include the formula to convert from Fahrenheit to Celsius:


    {{(f-32) * 5 / 9}}c


    NOTE: The little ***c*** on the right is just a character to tell the user that
    this result is in Celsius. It has nothing to do with the variable c previously
    declared.


    The whole line should look like this:


    **Fahrenheit to Celsius: <input type="number" ng-model="f"> {{(f-32) * 5 / 9}}c**


    10- Save it and test it.


    At this time all your DIVs should look like the following:


    **<div ng-app ng-init="f=32;c=0">** <div>


    Fahrenheit to Celsius: <input type="number" ng-model="f"> {{(f-32) * 5 / 9}}c


    </div>


    <div></div>


    **</div>**


    11- Now, let’s write the input box for the conversion of **Celsius to Fahrenheit**.


    On the next DIV container write the following code:


    <div>


    **Celsius to Fahrenheit: <input type="number" ng-model="c"> {{c * 9 / 5 + 32}}f**


    </div>


    12- Test it, test both conversions.


    The final result can be seen on the


    [Forum board](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)
    | bit.ly/ZQieYU.


    **Would you like extra practice?**


    You can add an extra box and initialize another variable like for example k:


    **Here are some possible conversion formulas:**


    a) Kelvin to Fahrenheit: (K - 273.15) * 9/5 + 32


    b) Kelvin to Celsius: K - 273.15


    # More Project Ideas


    For more project ideas please visit the following link on the forum board created
    for this book


    [Project Ideas In Angular](http://jsplain.com/javascript/index.php/Thread/144-Project-ideas-in-Angular/)


    ## Directives summary and resources


    As a review, here are some of the directives we have covered, along with other
    useful directives and their respective official page link.


    I will continue to explain these and other directives by posting examples on the
    JSplain forum for further practicing:


    [Forum thread starter](http://jsplain.com/javascript/index.php/Thread/49-Directives-Summary-and-Resources/)
    | bit.ly/1roi5qc


    **For Modules/Controllers:**


    *   [ng-app](https://docs.angularjs.org/api/ng/directive/ngApp), or *data-ng-app*
    or *ng-app="appName"*


    *   [ng-controller](https://docs.angularjs.org/api/ng/directive/ngController)


    **For Data Binding:**


    *   [ng-init](https://docs.angularjs.org/api/ng/directive/ngInit)


    *   [ng-model](https://docs.angularjs.org/api/ng/directive/ngModel)


    *   [ng-bind](https://docs.angularjs.org/api/ng/directive/ngBind)


    **For DOM Traversing:**


    *   [ng-hide](https://docs.angularjs.org/api/ng/directive/ngHide)


    *   [ng-show](https://docs.angularjs.org/api/ng/directive/ngShow)


    *   [ng-view](https://docs.angularjs.org/api/ngRoute/directive/ngView)


    *   [ng-repeat](https://docs.angularjs.org/api/ng/directive/ngRepeat)


    **For Events:**


    *   [ng-mouseenter](https://docs.angularjs.org/api/ng/directive/ngMouseenter)


    *   [ng-click](https://docs.angularjs.org/api/ng/directive/ngClick)


    *   [ng-keypress](https://docs.angularjs.org/api/ng/directive/ngKeypress)


    For a quick sample of a module and controller configurations see one of our exercises
    here:


    [Forum](http://jsplain.com/javascript/index.php/Thread/43-Lab-15a2) |  bit.ly/1ve4e66.


    # In conclusion


    Thank you for staying with me until the end of this project. I always feel a bit
    emotional when I get to this part.


    There is so much I haven’t written about JavaScript and AngularJS, but we need
    to take a break in order to digest all we have covered in this book.


    It is my belief that I have provided the necessary boost for you to feel empowered
    and continue your own journey, and if you ever have a question that I may be able
    to help, I’m only a click away on the [new forum platform](http://jsplain.com/javascript/index.php/Thread/49-Directives-Summary-and-Resources/)
    purposely created for this project.


    Please take the time to reread this book and practice all the exercises again.


    If you feel like expanding your JavaScript understanding, my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)
    is all about the JavaScript library methods, objects, closures and memory management.


    As for AngularJS, it is a whole new world and there is so much to write about
    it. We have covered the hardest part of learning to use AngularJS, the very initial
    concepts.


    **Update:** There is a new supplemental exercise eBook if you want to do more
    AngularJS exercises. Please take a look:


    [AngularJS Supplement: Easy Projects on Filters and Directives](http://www.amazon.com/AngularJS-Supplement-Projects-Filters-Directives-ebook/dp/B016FOYH8A/)


    Thank you dear reader, I hope this has been time well spent.


    Tony de Araujo


    New Jersey, USA


    [Amazon Profile](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/) | amzn.to/1wMqHrb.


