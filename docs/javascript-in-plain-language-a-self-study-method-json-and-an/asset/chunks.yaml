    This sentence gets displayed: \"**The quick brown fox jumped over the lazy dog**\"\
    .\n\nNotice how `english` is not wrapped in quotes (and it is in lower case).\
    \ That tells us that it must be a variable name, not a string.\n\nI have used\
    \ [Google Translate](https://translate.google.com/) to convert my sentences from\
