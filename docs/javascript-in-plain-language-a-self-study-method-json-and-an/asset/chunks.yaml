  trans: "\n我们将从之前的练习中移除 `ng-init`，并将数据插入到控制器中，但首先，让我们先看看控制器的基本结构。从一个空控制器的图像开始：\n\n\
    ![](img/00031.jpeg)\n\n图 30 (控制器是模块 x 的子级。JavaScript 代码放在控制器中)\n\n控制器函数是模块的子级，在我们的示例中，它被赋值给变量\
    \ `x` 以于实现（`x` 变成了整个模块声明的快捷方式）。因此，模块 `myFirstAppModule` 被赋值给 `x`，然后我们从变量 `x` 中提取\
    \ `controller` [第 3 行]。在控制器方法内部，我们有两个参数。第一个参数是我们给控制器的名称，格式为字符串类型（我将其命名为 'myFirstController'）；第二个参数是一个名为\
    \ `$scope` 的 AngularJS 对象。`$scope` 是一个 Angular 对象，用于跟踪我们即将发送到网页的所有数据和属性，正如我们很快看到的。注意所有这些代码都在\
    \ `SCRIPT` 标签内 [第 1 行和第 7 行]，其中声明了 `ng-app=\"myFirstAppModule\"` 模块。\n\nAngularJS\
    \ 奇迹地将我们在控制器内部编写并分配给对象 `$scope` 的任何代码和数据提供给 HTML 视图（分配给控制器的视图）。\n\n我们可以说 `$scope`\
    \ 是控制器和页面视图之间的粘胶水。控制器与页面视图没有任何关系，因为它应该是通用化地编写的。我的意思是，我们可以有多个不同的视图使用来自控制器的相同数据：一个用于桌面屏幕的视图，另一个用于手机的视图，等。这取决于\
    \ `$scope` 如何与外部视图世界进行交互，而 AngularJS 在后台提供了此类功能。\n\n在进行练习之前，让我总结一些概念，以帮助你进一步理解正在发生什么。\n\
    \n### $scope\n\n`$scope` 是一个映射整个页面（DOM）的对象，并创建可以被访问的属性。在某种意义上，它就像并行的 DOM。稍后你将看到我们将\
    \ `$scope` 添加到控制器中，然后向 `$scope` 中添加变量和函数，反过来这些将对网页应用可用。（注意：`$` 看起来像字母“S”，对吧？这提醒我们\
    \ `$scope` 是一个 AngularJS 服务）。\n\n### View（视图）\n\n视图是应用程序中将显示在屏幕上的区域。就像图像、视频或其他嵌入文本一样，我们可以在页面上拥有多个视图，它们可能是硬编码的，也可以从不同的来源链接。与\
    \ HTML 标准呈现方式相反，视图数据不是持久的，这意味着它会根据 `$scope` 提供的逻辑（来自分配的控制器）或用户与页面交互的行为而变化。视图是由标准\
    \ HTML 元素结合 AngularJS 的数据绑定、指令（directives）增强功能以及花括号 `{{}}` 创建的。\n\n*   任何复杂逻辑都应该放在控制器中，并让\
    \ `$scope` 管理这些逻辑向视图的数据。这并不意味着视图不能有任何逻辑；简单的表达式可以放在视图中，正如我们在之前的第一次练习中所做的那样。\n\n\
    ### Controller（控制器）\n\n控制器是编写用于在页面运行时执行的 JavaScript 代码的地方。\n\n控制器的目的是提供 AngularJS\
    \ 所需的逻辑以初始化对象 `$scope`，该对象是像 DOM 一样映射网页的对象。\n\n在使用带有 `$scope` 的控制器之前，我们一直使用一个简单的\
    \ `ng-init` 来保存和初始化数据，但那是一个非常有限的实现。`$scope` 是更强大的对象，也是声明属性和方法最合适的方法。\n\n接下来的图像显示了我们如何以及在哪里实现之前分配给\
    \ `ng-init` 的数据：\n\n![](img/00032.jpeg)\n\n图 31\n\n如你所示，所有的 JavaScript 代码都被视为\
    \ `$scope` 的属性子级。AngularJS 将获取 `length` 和 `width` 并将它们保存为 `$scope` 的一部分（记住，`$scope`\
    \ 管理 DOM，这是事物显示的方式和位置）。\n\n只剩一件事了。我们现在有一个应用名称，还有一个包含一些待处理的 JavaScript 变量的控制器。但\
    \ AngularJS 如何知道在我们打开页面时在段落的何处显示这些变量？\n\n提醒一下，这是我们在旧练习的 HTML BODY 中拥有的：\n\n![](img/00033.jpeg)\n\
    \n图 32\n\n答案是，我们应该将整个段落封装在一个 DIV 中，并将该 DIV 分配给名为 `myFirstController` 的控制器：\n\n\
    ![](img/00034.jpeg)\n\n图 33 (我们将段落封装在分配给 myFirstController 的 div 中)\n\n### 轮到你了：为你的练习添加控制器\n\
    \n现在，让我们修改之前的练习，为它添加一个控制器。\n\n这是我们在添加模块 `myFirstAppModule` 之后留下的原始[原始文件](http://icontemp.com/jpl/ang14/ang8b.txt)。\n\
    \n1- 将控制器添加到脚本容器中，位于模块声明下方一行，如图 30 所示。\n2- 将 `length` 和 `width` 分配给 `$scope`，如图\
    \ 31 所示，然后从你的页面中移除 `ng-init`。\n3- 将你的段落封装在 DIV 中，并将该 DIV 分配给控制器，如图 33 所示。\n4-\
    \ 测试你的 HTML Angular 应用。这里有我自己的版本：\n\n[原始文件](http://icontemp.com/jpl/ang14/ang8c.txt)\
    \ | [html](http://icontemp.com/jpl/ang14/ang8c.html)。\n\n我们现在有一个完整的简单 Angular\
    \ 应用。\n\n#### 编写 length 和 width 的另一种方法\n\n在练习中包含 `length` 和 `width` 的另一种方法是将它们制为某些对象的属性，例如\
    \ `myPerimeter`，然后在控制器内部如下编写它们：\n\n```javascript\n$scope.myPerimeter = {\n  \"\
    length\": 9,\n  \"width\": 3\n};\n```\n\n而不是使用 `$scope.length =9;` 和 `$scope.width\
    \ = =3;`\n\n在 HTML 视图中，我们将它们写为：\n\n`{{myPerimeter .length}},{{ myPerimeter .width}}`\n\
    \n以及公式：`{{myPerimeter.length * 2 + myPerimeter.width * 2}}`\n\n让我们通过创建几个酷的小项目来继续练习。\n\
    \n## 创建一个将华氏度转换为摄氏度的程序\n\n我们*不会*从零开始创建这个程序，因为我们之前在**Lab work 6** 学习 JavaScript\
    \ 时已经做过了。\n\n查看 [论坛](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)\
    \ | bit.ly/1Dp2SK\n\n[原始文件](http://icontemp.com/jpl/f2c.txt) | bit.ly/1ruKrzi\n\
    \n我们要创建一个应用来显示结果。\n\n主目的是在页面上设置 AngularJS，并练习在控制器中包含代码实现。\n\n这里是我的示例食谱：\n\n* \
    \  **模块名称**：`myAppModule`\n*   **控制器名称**：`myController`\n*   **显示结果的变量**：`result`（提示：它在控制器中是\
    \ `$scope.result`）。\n*   **动态显示的句子**：*100 华氏度等于 37.778 摄氏度。*\n\n注意：在调用函数时，确保将原始的\
    \ `f2c(212)` 改为 `f2c(100)`。\n\n准备好接受挑战了吗？\n\n请自己完成。这里是总结指南：\n\n1- 创建你的 HTML 骨架。\n\
    这是我们的启动文件：[原始文件](http://icontemp.com/jpl/ang14/ang1.txt)。\n\n2- 链接 AngularJS（如果你使用的是启动文件，这已经完成了）。\n\
    \n3- 添加 ng-app 指令（已完成）并命名为 myAppModule。\n\n4- 在 AngularJS 链接下方添加一个新的 Script 容器并在其中声明模块。（我将其赋值给变量\
    \ `x`）。\n\n5- 在模块声明下方添加你的控制器。控制器的名称为 `myController`，它属于变量 `x`。此外，在它的参数中显示了一个字符串作为控制器的名称，在逗号隔开后，第二个参数引入了一个传入\
    \ `$scope` 的函数。\n\n6- 向控制器中添加华氏度到摄氏度的转换函数。\n\n这里有几种替代方案。让我解释一下：\n\n"
- fmt: "\na) First get a copy of the original JavaScript script here: [raw file](http://icontemp.com/jpl/f2c.txt).\n\
    \nb) We need to replace `console.log` with `return` because we are catching the\
    \ result and sending it to `$scope` so that it can be displayed.\n\nc) Now we\
    \ have two options (see steps c through f):\n\nWe could assign function `f2c`\
    \ as a property of `$scope` this way:\n\n```javascript\n$scope.f2c = function(f){return\
    \ ((f-32) * 5 / 9);}\n```\n\nd) Then, when we get to the HTML page view, we can\
    \ implement the result this way:\n\n```html\n{{f2c(100)}}\n```\n\ne) OR (and this\
    \ is a better way because it avoids using JavaScript in the HTML view), we can\
    \ insert the original function inside of the controller (except for the `console.log`),\
    \ and then assign to `$scope` a variable such as for example `result`, with the\
    \ result of a function call.\n\n```javascript\nx.controller('myController', function($scope){\n\
    \nfunction f2c(f){\n\n  return (f-32) * 5 / 9;\n\n}\n\n$scope.result = f2c(100);\n\
    ```\n\nf) If we use option (e), we then apply variable `result` in the view like\
    \ this:\n\n```html\n{{result}}\n```\n\n7- In the BODY of the HTML page create\
    \ a view by adding a DIV container.\n\nLink the opening DIV tag to `ng-controller=\"\
    myController\"`.\n\n8- Inside of the DIV container add the paragraph with the\
    \ following message:\n\n```html\n<p>100 degrees Fahrenheit is {{YOUR CODE HERE}}\
    \ Celsius.</p>\n```\n\n9- Where it says `YOUR CODE HERE`, replace it with option\
    \ (d) or option (f) based on the way you programmed your controller’s JavaScript\
    \ as stated in (c) or (e).\n\n10- Save and test your app. The display result should\
    \ be:\n\n100 degrees Fahrenheit is 37.77777777777778 Celsius\n\nWhen you’re done,\
    \ compare it with my result here:\n\n[forum](http://jsplain.com/javascript/index.php/Thread/42-Lab-15c/)\
    \ | bit.ly/1ruKCKT\n\n[raw file](http://icontemp.com/jpl/ang14/angc3m.txt) |\n\
    \n[html](http://icontemp.com/jpl/ang14/angc3m.html) |\n\nSuggestion: Try to convert\
    \ some of the other JavaScript exercises into Angular. You may not get a perfect\
    \ solution but you will get plenty of practice.\n\n### Placing the controller\
    \ on a separate file\n\nNow that we have logically separated the controller and\
    \ view units (both part of the module), we can safely place the `controller` and\
    \ `module configuration` on a separate file. This is by no means the end of the\
    \ story, perhaps just the beginning.\n\nOn simple applications we can just leave\
    \ it on the same page as we have done earlier. However, as versatile developers\
    \ we need to practice separation of concerns in order to get ready for bigger\
    \ things.\n\nIt’s pretty easy. Let’s take for example the exercise we just finished\
    \ (Fahrenheit to Celsius):\n\n[raw file](http://icontemp.com/jpl/ang14/angc3m.txt)\
    \ |\n\n1- Save it under a different name, like for example `f2cfinal.html`.\n\n\
    Now we can edit the file:\n\n2- Copy and cut (delete) all the contents inside\
    \ of the `<script></script>` where the controller and module configuration are.\
    \ Just leave the `SCRIPT` tags by themselves so that we can add a link to the\
    \ separate file.\n\n3- Paste the contents on a new file and save it as `mycontroller.js`\
    \ (or any other name).\n\nNotice the `.js` extension. Make sure the file is on\
    \ the same folder as `f2cfinal.html`.\n\n4- Go back to `f2cfinal.html` and in\
    \ the opening `SCRIPT` tag that belonged to the controller, type the path to the\
    \ new file which should be the following including the script tags:\n\n```html\n\
    <script src=\"mycontroller.js\"></script>\n```\n\n5- Save and test.\n\nCompare\
    \ with my result here:\n\n[raw file](http://icontemp.com/jpl/ang14/f2cfinal.txt)\
    \ |\n\n[.js file](http://icontemp.com/jpl/ang14/mycontroller.js) |\n\n[html](http://icontemp.com/jpl/ang14/angc3m.html)\
    \ |\n\n### Additional information\n\nFor updates and further exploration of controllers\
    \ (aside from what is covered in this eBook) please visit the following post at\
    \ JSplain.com: [Notes on controllers](http://jsplain.com/javascript/index.php/Thread/145-AngularJs-controllers-things-we-should-know/).\n\
    \n### The ng-model\n\nAngularJS can sometimes be really simple.\n\nPlease take\
    \ a look at the following script based on the JavaScript exercise we did on Part\
    \ C:\n\n[Fahrenheit to Celsius / to Fahrenheit conversion](http://icontemp.com/jpl/conversions.html)\
    \ | bit.ly/ZQgTRW\n\nDo you still remember how we did the JavaScript raw version\
    \ of this algorithm?\n\nTo refresh your mind see the `third` example shown in\
    \ the forum:\n\n[Lab 6](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)\
    \ | bit.ly/1Dp2SKk\n\nNow, back to the first link on the top, it looks pretty\
    \ cool and it is being displayed on a web page. When we change the value inside\
    \ of the text box, it converts the value to Celsius or Fahrenheit automatically.\n\
    \nLet’s take a look at the script to see what it was done to it. It is much simpler\
    \ than our original JavaScript version from lab 6.\n\nIn the forum you will find\
    \ a live demo and the script right below it. Please read the explanation for each\
    \ line of code:\n\n[forum board](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
    \ | bit.ly/ZQieYU. \n\nAfter reading the description in the forum and play with\
    \ the demo a bit, please return back here for some lab work. We are going to do\
    \ this project in less than 10 minutes, promise!\n\n### Lab work, creating the\
    \ conversion script\n\nDid you notice there is no `controller` or `module` declared\
    \ for the temperature conversion program?\n\nAngularJS can many times save us\
    \ hours of work and it is getting better as they improve their game. For the job\
    \ at hand all we need are a few tools (and an introduction to `ng-model`):\n\n\
    a) A link to library\nb) An `ng-app` directive\nc) An `ng-model` directive.\n\
    d) A few curly braces\ne) Two HTML input boxes.\n\nReady to begin?\n\n1- Let’s\
    \ get our basic HTML: [raw file](http://icontemp.com/jpl/ang14/ang1.txt)\n\n2-\
    \ Save it as `conversions.html`.\n\n3- In the BODY, replace `hello` with one DIV\
    \ containing other DIVs:\n\n```html\n<div>\n  <div></div>\n  <div>\n</div>\n```\n\
    \n4- If you are not using my starter file, make sure to include `ng-app` directive\
    \ on your opening tag (or on a DIV that wraps the view).\n\n5- On the top most\
    \ DIV from step 3, declare `ng-init` to initialize variables as shown below (the\
    \ `init` is because we are not going to use a controller):\n\n```html\n<div ng-init=\"\
    f=32;c=0\">\n```\n\nAt this point we should have the following on HTML:\n\na)\
    \ The link to library (it came with the skeleton script),\nb) The `ng-app` directive\
    \ somewhere on the page,\nc) And `ng-init` to introduce variables `f` and `c`.\n\
    \n6- Just for testing purposes let’s write some curly braces inside of the DIV\
    \ container (any of the DIV containers):\n\n```html\n{{f -c + f}}\n```\n\nThen\
    \ save it and open it on your browser.\n\n* If you see `{{f -c + f}}` on display,\
    \ you have a problem. Inspect your code to see what is missing or misspelled.\n\
    * If you see the number `64` displayed, then your script is working.\n\nOnce your\
    \ script is working properly, remove the curly braces and continue the project.\
    \ Early testing is always a good idea in order to save loads of time and headaches.\
    \ We should test in gradual stages before we move on to the next implementation\
    \ phase.\n\n7- The next step is to design the first input box.\n\nInside of the\
    \ container created by the second pair of DIVs, write an input box of type `number`.\
    \ (About input boxes: [HTML input](https://en.wikipedia.org/wiki/Form_%28HTML%29)\
    \ | bit.ly/1qy2lvA))\n\nAlso include a description on the left side. Here’s my\
    \ example:\n\n`Fahrenheit to Celsius: <input type=\"number\">`\n\nNOTE: You may\
    \ be accustomed to use self-closing tags like `/>`. It works either way. With\
    \ the advent of HTML5 I prefer to write without self-closing.\n\n8- Great, now\
    \ let’s add an `ng-model` to the input box and assign it to variable `f`:\n\n\
    `Fahrenheit to Celsius: <input type=\"number\" ng-model=\"f\">`\n"
