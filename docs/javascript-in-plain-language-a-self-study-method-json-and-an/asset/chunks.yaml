- fmt: "\nWe are going to remove the `ng-init` from our previous exercise and insert\
    \ the data into the controller but first let’s look at the basic structure of\
    \ a controller. Let’s start with the image of an empty controller:\n\n![](images/00031.jpeg)\n\
    \nFig 30 (controller is a child of module x. JavaScript code goes in the controller)\n\
    \nThe controller function is a child of module which in our example is assigned\
    \ to variable `x` in order to make it easy to implement the controller (`x` becomes\
    \ a shortcut to the whole module declaration). So, the module `myFirstAppModule`\
    \ is assigned to `x` and from variable `x` we extract a `controller` [line 3].\
    \ Inside of the controller method we have two parameters. The first parameter\
    \ is the name we are giving to the controller and in a string type format (I’m\
    \ calling it 'myFirstController'); the second parameter is an AngularJS object\
    \ called `$scope`. `$scope` is an Angular object that keeps track of all data\
    \ and properties we are going to send to the web page as we will see shortly.\
    \ Notice how all this code is inside of the `SCRIPT` tag [lines 1 and 7] where\
    \ the `ng-app=\"myFirstAppModule\"` module was declared.\n\nAngularJS demagically\
    \ makes available to the HTML view (the view assigned to this controller) whatever\
    \ code and data we write inside of the controller and assign to object `$scope`.\n\
    \nWe could say that `$scope` is the glue between the controller and the page view.\
    \ The controller wants nothing to do with the page view because it is supposed\
    \ to be generically written. I mean, we could have several different views using\
    \ the same data from the controller: one view for a desktop screen, another view\
    \ for a mobile phone, etc. It is up to `$scope` to interface with the external\
    \ world of views and AngularJS provides such functionality in the background.\n\
    \nBefore we do the exercise let me summarize some concepts to help you further\
    \ understand what is going on.\n\n### $scope\n\n`$scope` is an object that maps\
    \ the whole page (the DOM) and creates properties that can be addressed. In a\
    \ sense it is like the DOM in parallel. Later you will see that we add `$scope`\
    \ to our controller and then can add variables and functions into `$scope` which\
    \ in turn will be available to the web page app. (Note: the `$` looks like an\
    \ “S”, right? that reminds us that `$scope` is an AngularJS service).\n\n### View\n\
    \nView is the area of the application that will be placed on display. Just like\
    \ images, videos or other embedded text, we could have several views on one page\
    \ and they may be hardwired or linked from a different source. Contrary to the\
    \ HTML standard presentation, view data is not persistent which means that it\
    \ varies based on the logic provided by `$scope` (coming from the assigned controller),\
    \ or the behavior of a user interacting with the page. A view is created by standard\
    \ HTML elements in combination with AngularJS’ enhancements from data binding\
    \ and directives and curly braces `{{}}`.\n\n*   Any complex logic should be placed\
    \ in the controller and let `$scope` manage the feeding of this logic into the\
    \ view. This does not mean that a view can’t have any logic; simple expressions\
    \ can be placed in the view as we have done before during our first exercises.\n\
    \n### Controller\n\nThe controller is where we program the JavaScript code to\
    \ be executed when the page runs.\n\nThe controller’s purpose is to provide the\
    \ logic required by AngularJS in order to initialize the object `$scope`, which\
    \ is the object that maps the webpage like a DOM.\n\nBefore using a controller\
    \ with `$scope`, we were using a simple `ng-init` to save and initialize our data\
    \ but that was a very limited implementation. `$scope` is a more powerful object\
    \ and the most appropriate way to declare our properties and methods.\n\nThis\
    \ next image shows how and where we implement the data we previously assigned\
    \ to ng-init:\n\n![](images/00032.jpeg)\n\nFig 31\n\nAs you can see, all the JavaScript\
    \ code is treated as a property child of `$scope`. AngularJS will grab both `length`\
    \ and `width` and saves them as part of `$scope` (remember, `$scope` will manage\
    \ the DOM which is how and where things are displayed).\n\nThere is only one thing\
    \ left. We now have an app name and we have a controller with some JavaScript\
    \ variables to be processed. But how does AngularJS know where to display those\
    \ variables in the paragraph when we open the page?\n\nAs a reminder, this is\
    \ what we had in the HTML BODY of the old exercise:\n\n![](images/00033.jpeg)\n\
    \nFig 32\n\nThe answer is, we should wrap the whole paragraph in a DIV and assign\
    \ the DIV to the controller which is called `myFirstController`:\n\n![](images/00034.jpeg)\n\
    \nFig 33 (we wrap the paragraph in a div assigned to myFirstController)\n\n###\
    \ Your turn: Add a controller to your exercise\n\nAt this time let’s modify our\
    \ previous exercise to add a controller to it.\n\nHere’s the original [raw file](http://icontemp.com/jpl/ang14/ang8b.txt)\
    \ as we left it after adding the module `myFirstAppModule`.\n\n1- Add the controller\
    \ to the script container, one line below the module declaration as seen on figure\
    \ 30.\n2- Assign `length` and `width` to `$scope` as seen on figure 31 and then\
    \ remove the `ng-init` from your page.\n3- Wrap your paragraph in a DIV and assign\
    \ the DIV to the controller as seen on figure 33.\n4- Test your HTML Angular app.\
    \ Here’s my own version of it:\n\n[raw file](http://icontemp.com/jpl/ang14/ang8c.txt)\
    \ | [html](http://icontemp.com/jpl/ang14/ang8c.html).\n\nWe now have a complete\
    \ simple Angular app.\n\n#### Alternate way to code length and width\n\nAnother\
    \ way to include the `length` and `width` on our exercise is by making them properties\
    \ of some object like for example `myPerimeter` and then write them inside of\
    \ the controller as follows:\n\n```javascript\n$scope.myPerimeter = {\n  \"length\"\
    : 9,\n  \"width\": 3\n};\n```\n\nInstead of using `$scope.length =9;` and `$scope.width\
    \ = =3;`\n\nIn the HTML view we would write them as\n\n`{{myPerimeter .length}},{{\
    \ myPerimeter .width}}`\n\nand the formula: `{{myPerimeter.length * 2 + myPerimeter.width\
    \ * 2}}`\n\nLet’s keep practicing by creating a few cool mini projects.\n\n##\
    \ Create a program to convert Fahrenheit to Celsius\n\nWe are *not* going to create\
    \ this program from scratch because we have done earlier on **Lab work 6** when\
    \ learning JavaScript.\n\nSee [forum](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)\
    \ | bit.ly/1Dp2SKk\n\n[raw file](http://icontemp.com/jpl/f2c.txt) | bit.ly/1ruKrzi.\n\
    \nWhat we are going to do is to create an app to display the result on an HTML\
    \ page.\n\nThe idea is to practice setting up AngularJS on the page as well as\
    \ practicing ways to include code implementations in the controller.\n\nHere’s\
    \ the recipe menu for my sample:\n\n*   **Module name:** `myAppModule`\n*   **Controller’s\
    \ name:** `myController`\n*   **Variable to display the result:** `result` (hint:\
    \ it will be `$scope.result` in the controller).\n*   **Sentence to be dynamically\
    \ displayed:** *100 degrees Fahrenheit is 37.778 Celsius.*\n\n**NOTE:** make sure\
    \ you change the original `f2c(212)` to `f2c(100)` when calling the function.\n\
    \nAre you ready for the challenge?\n\nPlease do the exercise yourself. Here’s\
    \ a summarized guideline:\n\n1- Create your HTML skeleton.\nHere’s our starter\
    \ file: [raw file](http://icontemp.com/jpl/ang14/ang1.txt).\n\n2- Link to AngularJS\
    \ (if you’re using the starter file this is already done).\n\n3- Add the ng-app\
    \ directive (already done) and name it myAppModule.\n\n4- Below the link to AngularJS\
    \ add a new Script container and declare your module in there. (I’m assigning\
    \ mine to variable `x`).\n\n5- Add your controller below the module declaration.\
    \ The name of the controller is `myController` and it belongs to variable `x`.\
    \ Also in its parameters it shows a string with the name of the controller and\
    \ after separating with a comma, a second parameter introduces a function which\
    \ passes in `$scope`.\n\n6- Add the Fahrenheit to Celsius conversion function\
    \ to the controller.\n\nHere we have a few alternatives. Let me explain:\n"
  raw: 'We are going to remove the *ng-init* from our previous exercise and insert
    the data into the controller but first let’s look at the basic structure of a
    controller. Let’s start with the image of an empty controller:


    ![](images/00031.jpeg)


    Fig 30 (controller is a child of module x. JavaScript code goes in the controller)


    The controller function is a child of module which in our example is assigned
    to variable x in order to make it easy to implement the controller (x becomes
    a shortcut to the whole module declaration). So, the module *myFirstAppModule*
    is assigned to ***x*** and from variable x we extract a *controlle*r [line 3].
    Inside of the controller method we have two parameters. The first parameter is
    the name we are giving to the controller and in a string type format (I’m calling
    it ''myFirstController''); the second parameter is an AngularJS object called
    *$scope*. $scope is an Angular object that keeps track of all data and properties
    we are going to send to the web page as we will see shortly. Notice how all this
    code is inside of the SCRIPT tag [lines 1 and 7] where the *ng-app="myFirstAppModule"*
    module was declared.


    AngularJS *magically* makes available to the HTML **view** (the view assigned
    to this controller) whatever code and data we write inside of the controller and
    assign to object $scope.


    We could say that $scope is the glue between the *controller* and the page *view*.
    The controller wants nothing to do with the page view because it is supposed to
    be generically written. I mean, we could have several different views using the
    same data from the controller: one view for a desktop screen, another view for
    a mobile phone, etc. It is up to *$scope* to interface with the external world
    of views and AngularJS provides such functionality in the background.


    Before we do the exercise let me summarize some concepts to help you further understand
    what is going on.


    ### $scope


    $scope is an object that maps the whole page (the DOM) and creates properties
    that can be addressed. In a sense it is like the DOM in parallel. Later you will
    see that we add $scope to our controller and then can add variables and functions
    into $scope which in turn will be available to the web page app. (Note: The ***$***
    looks like an “S”, right? that reminds us that $scope is an AngularJS service).


    ### View


    View is the area of the application that will be placed on display. Just like
    images, videos or other embedded text, we could have several views on one page
    and they may be hardwired or linked from a different source. Contrary to the HTML
    standard presentation, *view* data is not persistent which means that it varies
    based on the logic provided by $scope (coming from the assigned controller), or
    the behavior of a user interacting with the page.  A view is created by standard
    HTML elements in combination with AngularJS’ enhancements from data binding and
    directives and curly braces {{}}.


    *   Any complex logic should be placed in the controller and let *$scope* manage
    the feeding of this logic into the view. This does not mean that a view can’t
    have any logic; simple expressions can be placed in the view as we have done before
    during our first exercises.


    ### Controller


    The controller is where we program the JavaScript code to be executed when the
    page runs.


    The controller’s purpose is to provide the logic required by AngularJS in order
    to initialize the object $scope, which is the object that maps the webpage like
    a DOM.


    Before using a controller with $scope, we were using a simple ***ng-init*** to
    save and initialize our data but that was a very limited implementation. $scope
    is a more powerful object and the most appropriate way to declare our properties
    and methods.


    This next image shows how and where we implement the data we previously assigned
    to ng-init:


    ![](images/00032.jpeg)


    Fig 31


    As you can see, all the JavaScript code is treated as a property child of $scope.
    AngularJS will grab both *length* and *width* and saves them as part of $scope
    (remember, $scope will manage the DOM which is how and where things are displayed).


    There is only one thing left. We now have an *app name* and we have a *controller*
    with some JavaScript variables to be processed. But how does AngularJS know where
    to display those variables in the paragraph when we open the page?


    As a reminder, this is what we had in the HTML BODY of the old exercise:


    ![](images/00033.jpeg)


    Fig 32


    The answer is, we should wrap the whole paragraph in a DIV and assign the DIV
    to the controller which is called *myFirstController*:


    ![](images/00034.jpeg)


    Fig 33 (we wrap the paragraph in a div assigned to myFirstController)


    ### Your turn: Add a controller to your exercise


    At this time let’s modify our previous exercise to add a controller to it.


    Here’s the original [raw file](http://icontemp.com/jpl/ang14/ang8b.txt) as we
    left it after adding the module *myFirstAppModule*.


    1- Add the controller to the script container, one line below the module declaration
    as seen on figure 30.


    2- Assign length and width to ***$scope*** as seen on figure 31 and then remove
    the ***ng-init*** from your page.


    3- Wrap your paragraph in a DIV and assign the DIV to the controller as seen on
    figure 33.


    4- Test your HTML Angular app. Here’s my own version of it:


    [raw file](http://icontemp.com/jpl/ang14/ang8c.txt) | [html](http://icontemp.com/jpl/ang14/ang8c.html).


    We now have a complete simple Angular app.


    **Alternate way to code length and width**


    Another way to include the *length* and *width* on our exercise is by making them
    properties of some object like for example ***myPerimeter*** and then write them
    inside of the controller as follows:


    $scope.myPerimeter = {


     "length": 9,


     "width": 3


    };


    Instead of using $scope.length =9; and $scope.width =3;


    In the HTML **view** we would write them as


    {{myPerimeter .length}},{{ myPerimeter .width}}


     and the formula: {{myPerimeter.length * 2 + myPerimeter.width * 2}}


    Let’s keep practicing by creating a few cool mini projects.


    ## Create a program to convert Fahrenheit to Celsius


    We are *not* going to create this program from scratch because we have done earlier
    on **Lab work 6** when learning JavaScript.


    See [forum](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/) | bit.ly/1Dp2SKk


    [raw file](http://icontemp.com/jpl/f2c.txt) | bit.ly/1ruKrzi.


    What we are going to do is to create an *app* to display the result on an HTML
    page.


    The idea is to practice setting up AngularJS on the page as well as practicing
    ways to include code implementations in the controller.


    Here’s the recipe menu for my sample:


    **Module name:** *myAppModule*


    **Controller’s name:** *myController*


    **Variable to display the result:** *result* (hint: it will be *$scope.result*
    in the controller).


    **Sentence to be dynamically displayed:**


    *100 degrees Fahrenheit is 37.778 Celsius.*


    **NOTE:** make sure you change the original f2c(212) to **f2c(100)** when calling
    the function.


    Are you ready for the challenge?


    Please do the exercise yourself. Here’s a summarized guideline:


    1- Create your HTML skeleton.


    Here’s our starter file: [raw file](http://icontemp.com/jpl/ang14/ang1.txt).


    2- Link to AngularJS (if you’re using the starter file this is already done).


    3- Add the ng-app directive (already done) and name it myAppModule.


    4- Below the link to AngularJS add a new Script container and declare your module
    in there. (I’m assigning mine to variable x).


    5- Add your controller below the module declaration. The name of the controller
    is myController and it belongs to variable x. Also in its parameters it shows
    a string with the name of the controller and after separating with a comma, a
    second parameter introduces a function which passes in $scope.


    6- Add the Fahrenheit to Celsius conversion function to the controller.


    Here we have a few alternatives. Let me explain:'
