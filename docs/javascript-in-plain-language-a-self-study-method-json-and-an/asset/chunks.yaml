  trans: "\n\n\"*El rápido zorro marrón saltó sobre el perro perezoso*\"\n\n### 2-\
    \ 声明一个名为 `langVersion` 的数组，包含以下元素：`english`、`portuguese`、`spanish`。\n\n记住，由于这些名称已经声明为变量，我们不应该给它们加引号，只需用逗号隔开即可。\n\
    \n这个数组的目的是按顺序保存每个变量。我们不能直接使用这些变量而忘记数组吗？是的，可以。然而，在大型程序中，这些变量将与其他许多变量一起保存，通过创建一个数组，我们列出了与语言翻译相关的变量，这些变量可以被进一步地操作、编辑、删除，甚至成为更大语言组的一部分。当然，还有其他方法可以实现，但现在我们正在练习数组，这是一项非常重要的练习。\n\
    \n### 3- 声明另一个名为 `sentence` 的变量，其数值值为 `0`。\n\n这个变量将用于存储我们要从数组所有语言中选择的语言索引位置。\n\
    \n我们之所以给这个变量赋值为零，是为了提前告诉 JavaScript 该变量将是数值型的。在实际上，JavaScript 会根据需要更改值的类型，但声明我们的意图是一个良好的习惯，即使这种意图可能只是有助于检查代码的人员，而不是帮助\
    \ JavaScript 处理它。\n\n(步骤 1、2、3 的方便复制/粘贴链接：[原始文件](http://icontemp.com/jpl/fox1.txt)\
    \ | bit.ly/1Dt7fnS )\n\n### 4- 在你当前代码下方，创建一个名为 `show` 的函数。\n\n该函数的目的是根据我们在调用函数时选择的语言，显示正确的句子。该句子将从语言数组中选取。\n\
    \n```\nfunction show() {}\n```\n\n### 5-为函数引入一个名为 `language` 的输入参数。\n\n### 6-\
    \ 在函数体第 1 行，将已声明的变量 `sentence` 重新赋值为选中语言的索引位置。我们通过 `indexOf()` 来查找位置，如下：\n\n```\n\
    sentence = langVersion.indexOf(language);\n```\n\n稍后，当我们调用函数时（例如 `show(portugese)`），参数\
    \ `language` 将由传递给函数的任何语言参数替换。`indexOf(language)` 将为变量 `sentence` 分配该语言正确的数组地址。\n\
    \n### 7- 最后，在下一行且仍在函数体内部，编写一个 `console.log` 来在有人调用函数时显示所选变量的内容：\n\n```\nconsole.log(langVersion[sentence]);\n\
    ```\n\n从步骤 6 我们知道，变量 `sentence` 是数组中某项的索引位置。\n\n### 8- 将你的代码粘贴到控制台（Console）并调用函数\
    \ `show()` 来测试每个句子\n\n（注意：如果你遇到错误，请感谢上获得调试的机会，因为这是一项非常好的习惯）：\n\n```\nshow(english);\n\
    show(portugese);\nshow(spanish);\n```\n\n你可能会在输出句子后看到 `undefined` 词。这在测试控制台中是正常的。它只是告诉我们函数\
    \ `show()` 没有显式地返回任何内容，因此它会自动返回 `undefined`，因为 JavaScript 函数总是会返回某些内容的。\n\n查看以下链接中的最终版本：\n\
    \n[论坛](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/) | [原始文本](http://icontemp.com/jpl/fox2.txt)。\n\
    \nbit.ly/1r0Ho2D | bit.ly/1mCJogu\n\n**旁记：**\n\n*   如果某些地方不清楚，在自觉地提出问题之前不要继续进行。停下来，后退一步，尝试观察每一行代码试图做什么。如果需要，就尝试\
    \ 100 次。然后，当你认为你知道不明白什么时，继续进行，看看在查看整个脚本时，理解是否会在作业结束时产生。如果你有任何疑问，不要放过。概念需要思考；我们不能直接跳过它们并认为以后会掌握它们。\n\
    \n*   另一方面，理解是分层的，但我们需要自觉地确保，即使我们没有完全掌握某事的观点也能继续我们的道路。在继续之前，先问自己一个问题并给自己一个诚实的回答。人们说，提问的行为本身就是答案的一半，很多时候当我们正确描述问题时，答案就会变得显而易见。\n\
    \n### 将法语添加到数组\n\n突然有人抱怨没有“快速棕色狐狸”的法语版本。\n\n### 1- 如果你的控制台还开着，在提示符处添加一个变量 `french`：\n\
    \n```\nvar french =\n```\n\n不要担心在脚本的最末尾。我们只是在测试东西。注意 `french` 是小写的。\n\n变量以小写字母开头。\n\
    \n### 2- 将以下行赋值给变量 `french`：\n\n\"*Le renard brun rapide saute par dessus le chien\
    \ paresseux*\"\n\n[原始文件](http://icontemp.com/jpl/fox3.txt). | bit.ly/1wGvYQS.\n\
    \n### 3- 现在，使用 `push()` 方法将变量 `french` 插入数组 `langVersion` 中。\n\n```\nlangVersion.push(french);\n\
    ```\n\n### 4- 通过调用以下代码测试脚本\n\n```\nshow(french);\n```\n\n*   在此处查看最终版本：\n    [论坛](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
    \ | [原始文本](http://icontemp.com/jpl/fox2.txt)。\n\n### 打印数组\n\n你还记得如何创建 *for* 循环吗？在这个项目中我们将\
    \ *console.log* 数组元素。\n\n### 1- 创建一个打印数组的 for 循环。\n\n我将使用常用的命名法 `i` 作为变量，并将 `langVersion.length`\
    \ 作为循环的限制条件。\n\n### 2- 在循环体中，*console.log* 内容。\n\n这是通过动态访问 `langVersion[i]` 实现的，它是循环重复时的当前位置。\n\
