  trans: '


    你可以使用上述 `if`、`else` 的强大组合来实现任何可能的结果。


    然而，有时另一种类型的分支结构更具意义。我说的是被称为 `Switch` 的分支，我只是想确保对它进行了解释，以防你可能需要使用它。


    它之所以被称为 `switch`，是因为有几个可能的结果，JavaScript 根据这些结果做出可执行的决策。这些可能的结果都处于 `off` 状态，JavaScript
    将根据一个匹配的布尔条件将其中一个设为 `on`，正如我们接下来将看到的。


    这是布局图：


    ![](img/00016.jpeg)


    图 16


    在第 1 行，我们声明了一个 `switch`。这个 switch 函数方法接收一个条件，JavaScript 将根据该条件比较所有结果，以选择其中一种可能的执行方式。


    在我们的通用示例中（基于我们拥有的 cases），“匹配条件”应该替换为 `1`、`2` 或 `3`，这样它就能匹配呈现的 case 之一。如果任何一个 case
    匹配条件，JavaScript 将执行 `case` 提供的代码。布尔值 `true` 是解锁 `case` 的钥匙。


    示例：如果正确的 case 是 3，JavaScript 将询问：


    “是 1 吗？答案：false”，


    “是 2 吗？答案：false”，


    “是 3 吗？答案：true”，运行代码，


    BREAK 并结束。


    在执行一个 `case` 之后，JavaScript 将由于其随后的 `break` 命令而退出 `switch`。如果不包含 `break` 命令，JavaScript
    将继续寻找更多可能的结果，你可能会有多个正确答案而不仅仅是一个。即使没有其他正确答案，JavaScript 仍然读取所有其他条件，如果 switch 中编写了成千上万种可能性，这会导致延迟。因此，`break`
    是一个非常重要的实现。


    当没有匹配的条件时，可选的 `default` 将作为最终的 `true` 选项接管并执行其代码。注意，我没有在 `default` 之后包含 `break`。你可以加上，但没有必要，因为
    JavaScript 此时就会退出 switch 了。


    欲了解更多信息，请访问 `forum` 上的[这篇文章](http://jsplain.com/javascript/index.php/Thread/20-How-does-a-switch-statement-work-in-JavaScript/)
    | bit.ly/1r4XRCL。让我们用 switch 练习一下。


    ## 3.6 实验 13


    ### 13a: Switch - 使用布尔匹配


    此脚本将使用一个具有 4 种可能结果的 `switch`。用户将尝试猜一个数字，程序将显示以下反馈消息之一：`too low`、`too high`、`right!`
    或 `That’s not a number`：


    1. 在名为 `guessNum` 的函数内部创建一个 `switch`。

    2. 该函数接收一个输入参数 `num`。

    3. `switch` 应该硬接连接到 `true`。


    示例：`switch(true)`


    4. `cases` 应该具有以下条件：

    - `num <= 3` 显示 "too low"

    - `num >= 5` 显示 "too high"

    - `num === 4` 显示 "right, the number was 4"

    - 对于 `default` 使用 "*That''s not a number*"


    5. 通过传递数字参数来调用函数，例如：

    ```

    guessNum(2);

    guessNum(7);

    guessNum(4);

    guessNum("a");

    ```


    - 欲快速查看或进一步解释以及我该项目的最终版本，请参考[论坛板块](http://jsplain.com/javascript/index.php/Thread/32-Lab-13a/)
    | bit.ly/1qqwkWc 或直接查看[原始文件](http://icontemp.com/jpl/switch1.txt) | bit.ly/1r50ODq

    - 表达式表达式`num <= 3` 将转换为 `true` 或 `false`。所有其他 `cases` 也是如此，因此 switch 要匹配的应该是布尔值
    `true`。


    ### 13b: Switch - 使用字面量匹配


    在下一个项目中，我们将使用以下内容：


    - 一个名为 `myFavColor` 的函数，

    - 使用 `prompt()` 获取用户输入，并将其转换为小写以匹配其中一个 `cases`。（JavaScript 是区分大小写敏感的）。

    - 使用一些 `confirm()` 输出，这样我们就不总是使用 `console.log`，

    - 以及关于 `color` 的一些有意义语句。


    语句如下（你可以随时编写自己的，或从这个[原始文件](http://icontemp.com/jpl/colors1.txt) | bit.ly/1ypn1A2）复制）：


    - 绿色是平衡与成长的颜色。

    - 蓝色是信任与和平的颜色。

    - 靛蓝色是直角的颜色。

    - 紫色是想象的颜色。

    - 橙色是社交沟通与乐观的颜色。

    - 不起，系统中还没有这种颜色！


    1. 请记住：创建函数的目的是再次调用程序而无需重新输入。它在测试目的和现实生活中都非常好。因此，整个 `switch` 应该封装在一个函数中。请自由选择你喜欢的函数样式：函数声明或赋值给变量的函数表达式。


    我将使用第一种：

    ```javascript

    function myFavColor() {}

    ```


    2. 在函数内部，`prompt()` 将赋值给变量 `color`。

    3. `switch` 表达式应该是 `color` 的值：

    ```javascript

    switch (color) {

    ```

    4. 每个 `case` 都应该是小写：

    ```javascript

    case "green":

    ```

    5. 每个 `case` 的输出应该是一个 `confirm()` 后面跟着一个 `break`：

    ```javascript

    confirm("Green is the color of balance and growth.");

    break;

    ```

    6. 当没有颜色匹配时，`default` 执行接管（不需要 break）：

    ```javascript

    default:

    confirm("Sorry, that color is not in the system yet!");

    ```

    7. 最后，不要忘记两个闭合括号：一个用于 `switch`，另一个用于函数（如代码所示所示）。


    - 欲快速查看或进一步解释以及我该项目的最终版本，请参考[论坛板块](http://jsplain.com/javascript/index.php/Thread/33-Lab-13b/)
    | bit.ly/Zca 或直接查看[原始文件](http://icontemp.com/jpl/colors2.txt) | bit.ly/1DwVBsd


    要测试你的脚本，只需调用函数：

    ```javascript

    myFavColor();

    ```


    ### 13c: 一个循环执行的 switch 程序


    有时我们希望脚本反复运行，例如在游戏中，直到我们特意决定退出。


    为了让我们之前的脚本可以重复，我们所做的只是在关闭函数之前调用函数 `myFavColor()`，该函数将触发游戏的新实例。当我第一次引入 `confirm()`
    机制时，我提到如果按下确定，`confirm()` 可以返回布尔值 `true`，如果按下取消则返回布尔值 `false`。我们可以捕获这个返回的数据来触发新的函数调用，一种方法是在关闭外部函数之前添加以下代码（变量
    `replay` 是任意的）：


    ```javascript

    var replay = confirm("点击确定再次玩游戏，或点击取消退出")


    if (replay === true) {

    myFavColor();

    }


    } <-- 这个大括号已经存在了，它是底部最后一个括号。

    ```


    所以从意义上说，我们从 `confirm` 机制中获取布尔值 `true` 并重用它来调用 `myFavColor()`。


    - 欲快速查看或进一步解释以及我该项目的最终版本，请参考[论坛板块](http://jsplain.com/javascript/index.php/Thread/34-Lab-13c/)
    | bit.ly/1ogVffh 或直接查看[原始文件](http://icontemp.com/jpl/colors3.txt) | bit.ly/1vdaYQT


    ### 13d: 使用 while 循环重复脚本


    我们还没有涵盖过 `while` 循环。我们涵盖过的循环只有用于数组的 `for` 循环和用于对象的 `for in` 循环。


    `while` 循环是一种无限运行的循环，直到某些触发条件使其退出。'
- fmt: "\nA popular example of a while loop is the mechanism that scans the computer\
    \ keyboard. The `while` loop keeps reading the input from the keyboard until it\
    \ gets a signal from one of the keys which in turn triggers another mechanism.\n\
    \nThe design for a while loop is as follows:\n\n```\nwhile(this Boolean expression\
    \ is true){\n  // do this stuff;\n  // something to change the condition to false\
    \ in order to end the loop;\n}\n```\n\nUntil that something triggers a Boolean\
    \ `false`, the `while loop` will always run.\n\nWe can use this while loop on\
    \ our previous color description game to run the switch forever until the user\
    \ clicks on the `confirm()`’s cancel button. In this way we don’t have to recall\
    \ the function again, all we have to do is to keep asking the user to enter his/her\
    \ favorite color, until the user press the cancel button.\n\n**So where do we\
    \ implement the change from Boolean `true`, to Boolean `false`?**\n\nWe implement\
    \ it on each case because only one case will apply. When the user confirms the\
    \ output message for the case, the user also has a chance to press cancel when\
    \ he/she wants to exit the game. Until the user presses `cancel` the game will\
    \ go on forever.\n\nPlease look at the next image to see what I mean:\n\n![](images/00017.jpeg)\n\
    \nFig 17\n\nOn line 3 we encapsulate the whole switch mechanism inside of a while\
    \ loop.\n\nWhile `replay` is `true` (which is its initial state), the switch will\
