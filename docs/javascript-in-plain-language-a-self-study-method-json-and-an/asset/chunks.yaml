    in order to use them. They represent some of the methods of a desktop computer.
    Their existence is based on the execution of some program routine.


    When we mention “execution” we immediately thing of functions, but there is a
    difference between what a function is and what a method is:


    *   A method may contain one or more functions.


     Do you see the difference? A function could be a method of an object, but it
    is not necessarily a method in itself. A method is a collection of functionality
    to accomplish a task on behalf of an object. Like a method to print out a list
    of contents, or a method to update the contents of an object, or a method to sort
    the contents, or a method to identify the person asking for the contents of an
    object, and so on.


    **Let’s add a method to our car object.**


    2- If you’ve been coding along with me, add a new comma to ***rating: 9,*** because
    we are about to add one more property, the method ***printRating***. (use the
    [editor](http://jsbeautifier.org/)).


    3- Assign to label *printRating* a function that prints on screen the following
    message:


    "*The car rates " + car.rating + " out of 10*"


    ![](images/00015.jpeg)


    Fig 15 see [raw file](http://icontemp.com/jpl/car2.txt). | bit.ly/1C6I5d5.


    4- Let’s play with this object a bit. Paste the object script from this last raw
    file (or your own script) on the Console.


    5- Print the car’s rating:


    **car.printRating();**


    Notice how we *call()* a method from an object. It starts like when we call any
    other property but then we add a pair of parentheses ( ) which creates a function
    *action*. What would happen if we excluded the parentheses? It would just print
    the contents of key *printRating* which are the explicit description of the function.
    That can be handy sometimes when we want to assign the same functionality to another
    variable, but in order to get an action we need to use the parentheses.


    6- What about bracket notation? How would we call the method *printRating* using
    ***bracket notation***? Methods are best called with ***dot notation*** because
    it is an easier syntax as you will see why next, but it is good to understand
    how the logic goes and here it is:


    **car["printRating"]();**


    Not as pretty as in dot syntax, right? Notice how the parentheses go outside of
    the brackets. So this is one area where dot syntax is mostly used. Bracket syntax
    is reserved more for the **dynamic calling** of a property. We use bracket syntax
    with for loops because there, each property needs to be accessed dynamically as
    the loop goes around.


    Let’s do that!


    ### Looping through an object


    Suppose you are aware of an object existence but you don’t really know what properties
    it contains.


    You can loop through the object to find its properties.


    ### Introducing the for in loop


    This loop is written specifically for the object we’ve been discussing:


    See original file here:  [raw file](http://icontemp.com/jpl/car2.txt) | bit.ly/1C6I5d5


    The loop goes like this:


    for(var k in car){


     console.log(k);


    }


    The ***for in*** loop is a variation of the regular *for loop* in the sense that
    some functionality is already preprogrammed in the JavaScript library. Let’s explore
    it line by line:


    **for(var k in car)** --- ***k*** is a variable introduced by the programmer.
    Its purpose is to temporarily grab and hold the *key label* for each loop count
    (the label that matches the location number in each loop cycle).


    Let me explain: objects are in a sense just like arrays. The only difference is
    how the keys are mapped. In arrays, JavaScript maps each location as location
    0,1,2, 3, etc. But in unordered lists or objects where keys are being used, JavaScript
    maps the internal location (whatever location it is) to the key that was originally
    declared for any given data value.


    So, the purpose of variable *k* is to count each location (one per cycle) and
    at the same time, to grab the key name that corresponds to the given count, so
    that we can get to the data value assigned to it. It’s not *k* that does all these.
    It is JavaScript that provides such information and stores it in *k*.


    As for the name k, we could use any name, such as for example ***i*** but ***k***
    makes more sense because in fact, JavaScript will temporarily store the *key*
    values on variable ***k***, one key per loop iteration. So the letter ***k***
    reminds us of what is being stored there, a temporary location instance. You may
    also see it on the field or in other texts as *key*, *prop*, or *property*.


    (Why am I telling you all this? because I don’t want you to start reading posts
    on the web and think that there are a thousand different kinds of *for in* loops.
    There is only one *for in* loop and each developer gets creative with temporary
    variable names).


    Going back to our “*for k in car*”, in this example we have a dedicated ***for
    in*** loop because we know the name of the object, ***car***. We could however
    make this loop *generic* and substitute *car* with another temporary variable
    to act as a *placeholder*, like for example a parameter from a function. Then
    we could insert the real object name as an argument when we call the function,
    and the function would substitute the *placeholder* with the correct object name.
    We will try that on another exercise.


    **console.log(k)** ---  This line is used to print all *key names* as they are
    passed to variable k. If however, we wanted to print the values instead of the
    keys, we need to address each key-value pair dynamically using bracket syntax:


    console.log(**car[**k**]**);


    JavaScript evaluates **car[k]** and replaces it with the value of the property
    corresponding to the *dynamic label* instance in k.


    *   Notice the lack of quotes on "k". k is a declared variable.Variables never
    take quotes because that will make them a string and JavaScript will think it
    is a different identifier other than the one we intend to target. k is a variable,
    "make" or "color" are not variables, they are real keys and a key is a string.
    Those would be wrapped in quotes if used in bracket notation: *car["color"]*.


    Also, remember that *dot notation* will not work here. This is because the loop
    is dynamically addressing the key values by mapping k to the key, and *dot notation*
    only accepts the real key name. Remember: *hard wire* versus *soft wire*.


    1- So let’s paste the object on the Console, then paste the ***for in*** loop
    just to print the key names


    *   Here’s the *complete* [raw file](http://icontemp.com/jpl/car3.txt) | bit.ly/1rjbSvB.


    You should see the following keys displayed:


    make


    model


    color


    year


    mileage


    rating


    printRating


    2- Replace **(k);** with **(car[k]);** on your console log. Remember, you can
    move up in the Console by click on the *Up Arrow*, then modify the script and
    press *ENTER*.


    Now the printout should look like this:


    **console.log(car[k]);**


    And the printout should be:


    Subaru


    Outback


    blue


    2014


    67,000


    9


    function () {


          console.log("The car rates " + car.rating + " out of 10");


        }


    Of course we could have made it prettier by adding the key, like for example in
    this way:


    console.log(**k + ": "** + car[k]);


    And that would give us:


    **make:** Subaru


    **model:** Outback


    **color:** blue


    **year:** 2014


    **mileage:** 67,000


    **rating:** 9


    **printRating**: function () {


            console.log("The car rates " + car.rating + " out of 10");


        }


    NOTE: I will show how to exclude the *printRating* method from the printout in
    a future exercise.


    P.S.'
