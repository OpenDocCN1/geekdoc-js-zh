- fmt: "\nAlmost all modern browsers have a `test` `Console` built into the browser\
    \ to assist us in debugging or experimenting with JavaScript. All Consoles provide\
    \ basically the same options once we have them open. The biggest differences are\
    \ how we access the `Console` and what the `Console` looks like on the screen.\n\
    \nSelect one of the following browsers. Download it if you don’t have it installed\
    \ on your computer. The reason to use one of these browsers is so that my instructions\
    \ may coincide with your actions as we code along using the JavaScript `Console`\
    \ that comes with it. Please feel free to use any other `Console` if you so desire,\
    \ but the way to access it may be different.\n\n[Google Chrome](https://www.google.com/chrome/browser/).\n\
    \n[Opera](http://www.opera.com/).\n\nOpen one of those two browsers and then press\
    \ the following key sequence to open the Console:\n\n1- If you are using Windows\
    \ or Linux:\n\n`CTRL SHIFT j`\n\nIf on a MAC:\n\n`CMD SHIFT j` or `ALT-CMD-j`\n\
    \nMost likely a window will open at the bottom of your screen.\n\n2- Make sure\
    \ the tab `Console` is selected.\n\nIf you get any `error` messages, just clear\
    \ the screen by `right clicking` on the white area and selecting `“Clear Console”`.\
    \ These errors will happen almost every time you open the console because the\
    \ `Console` is inspecting the current opened document, the one you see on screen\
    \ before you access the `Console`, and things may not be 100% as expected by the\
    \ `Console`, hence the error warnings. Just clear the message so that we gain\
    \ more window space.\n\n3- If you want (recommended), you can `detach` the `Console`\
    \ from the browser and minimize the browser so that it gets out of your way. After\
    \ you detach the `Console` for the first time, it will always stay detached unless\
    \ you attach it again by toggling the same button.\n\nTo detach the `Console`\
    \ look for a double square icon on the tab menu of the Console, and click on it.\
    \ Now you should have two different windows. Minimize the browser to get more\
    \ room on your `Console` screen.\n\n### Declaring some variables\n\nLet’s start\
    \ coding...\n\n1- `Declare` variables `x`, `y` and `z`\n\n(declaration only, no\
    \ assignments of values at this moment)\n\nand press ENTER after each semicolon\
    \ in order to activate the expression:\n\nIt should look like this:\n\n```\nvar\
    \ x;\nvar y;\nvar z;\n```\n\nYou could also just use one `var` and separate the\
    \ variable names with a `comma`. That might save you some time if you are simultaneously\
    \ declaring a bunch of variables with no values given. Don’t forget the `semicolon`\
    \ at the end:\n\n```\nvar x, y, z;\n```\n\n2- Now, declare another variable but\
    \ assign a value at the same time.\n\nI’m using variable `a` with the value of\
    \ `347`:\n\n```\nvar a = 347;\n```\n\n3- Declare a variable `b` containing your\
    \ first name ( remember, your name is a `string` of characters):\n\n```\nvar b\
    \ = \"Tony\";\n```\n\n*   **NOTE:** You can read the value of each variable on\
    \ the Console by just typing the variable name, followed by the semicolon, and\
    \ pressing ENTER. Example:\n\n    `b;` It should display `\"Tony\"`.\n\nTyping\
    \ the variable by itself in order to get a value displayed is only possible because\
    \ we are using a test Console. In real life we would have to use a print command\
    \ as we will see later.\n\n### Inspecting the data type of a variable\n\nGreat!\
    \ So far we have the following variables declared:\n\n`x, y, z, a, b`.\n\nWhat\
    \ kind of variable is variable `b`? I mean, what type of data does it contain?\
    \ We know `b` holds your first name, right?\n\n4- To inspect the variable use\
    \ the command `typeof`:\n\n```\ntypeof b;\n```\n\nIt displays `\"string\"`. Variable\
    \ `b` contains your first name in `quotes` and therefore it is a string of characters.\n\
    \n5- What about variable `a`?\n\n```\ntypeof a;\n```\n\nIt displays `\"number\"\
    `. Variable `a` contains the number `347` and therefore it contains data of type\
    \ `number`.\n\n*   **NOTE:** Did you notice how the Console tries to finish the\
    \ word `typeof`? If you don’t want to write the whole word yourself just press\
    \ the TAB key as soon as you see the hint on the display. Or if you’re like me,\
    \ you’d rather practice typing, just be aware of misspells. The automatic completion\
    \ can become very handy to speed up programming and avoid typing mistakes, especially\
    \ when it comes to long commands. Auto typing also helps us remember how each\
    \ command is written. The test Console is really useful; I use it in real life\
    \ hundreds of times a day because I’m constantly testing stuff.\n\n### What is\
    \ `typeof`?\n\n`typeof` is a unary operator. It is called unary (opposite of binary)\
    \ because it only takes one operand, the variable to the right of it. An example\
    \ of a binary operator would be the `+` sign where we need a left and a right\
    \ operands.\n\nLet’s do a few more inspections.\n\n6- What type of data is contained\
    \ in variables `x`, `y`, and `z`? (test them all)\n\nAnswer to all: `\"undefined\"\
    `.\n\n### Why it “undefined” and what is undefined?\n\nThese variables hold the\
    \ value of `undefined` because we haven’t assigned any data to them yet.\n\nJavaScript\
    \ reserves some memory for each one of these variables and puts a `placeholder`\
    \ as data. This placeholder is of type `\"undefined\"`. It is still a value, a\
    \ special value, and we can take it.\n\nClear the screen does not erase the variables\
    \ from memory. Let’s assign some values to `x`, `y`, `z`:\n\n7- Assign the following\
    \ string value to `x`. Make sure to wrap your string with quotes:\n\n```\nx =\
    \ \"The quick brown fox jumps over the lazy dog\";\n```\n\n8- Verify its type:\n\
    \n```\ntypeof x;\n```\n\nIt now displays `\"string\"` rather than `\"undefined\"\
    `.\n\n9- Assign the variable `b` to variable `y`\n\n(assignments go right to left):\n\
    \n```\ny = b;\n```\n\n`y` should now contain a copy of your first name like `b`\
    \ does, and its type of value also be `\"string\"`.\n\n*   **NOTE:** Assignments\
    \ work from the right operand to the left operand. The `=` sign does not mean\
    \ equality, it means to assign right to left.\n\n10- Assign a value of `number`\
    \ (any number) to variable `z`.\n\n*   **NOTE:** numbers don’t take quotes. If\
    \ you wrap a number in quotes it becomes a string and you can’t perform any calculations\
    \ with it.\n\n11- For further practicing, declare some new variables of your own,\
    \ assign some data to them and check their type of value.\n\nJust like any other\
    \ language, the only way to learn JavaScript is to practice daily. Memorizing\
    \ will not do it; just plain practice will succeed and persist.\n\n## 1.5 Manipulating\
    \ variable data\n\nWhen we store a value in the computer’s memory under JavaScript\
    \ supervision, this value inherits some *properties* and *methods* characteristic\
    \ of the *type* of data it represents.\n\n***Where do these properties/methods\
    \ come from?***\n\nThey exist in the JavaScript library located in your browser.\
    \ When we create a new instance of one of the types, our instance immediately\
    \ inherits lots of tools we can use to help us program outcomes.\n\n### Methods\
    \ and Properties\n\n[Properties](https://en.wikipedia.org/wiki/Property_(programming))\
    \ are `qualities` the new data inherits from its data type. It will make more\
    \ sense later.\n\n[Methods](https://en.wikipedia.org/wiki/Method_(computer_programming))\
    \ are functionality that creates actions upon the data.\n\n*   There is no need\
    \ to memorize these terms. They will be repeated so many times that you will know\
    \ them by heart before you finish reading the book. Just read along and understand\
    \ the concepts. However, if you’re curious, each term has a link to Wikipedia\
    \ where you can read to your heart’s delight.\n\nTo see an example of a property\
    \ in action let’s declare a new variable of the `string` type:\n\n```\nvar myName\
    \ = \"Tony\";\n```\n"
