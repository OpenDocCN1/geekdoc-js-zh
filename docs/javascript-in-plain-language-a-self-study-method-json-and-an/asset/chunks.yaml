  trans: "\n\n`while` 循环的一个流行例子是扫描计算机键盘的机制。`while` 循环会持续从键盘读取输入，直到收到某个按键的信号，该信号反过来触发另一个机制。\n\
    \n`while` 循环的设计如下：\n\n```\nwhile(this Boolean expression is true){\n  // do this\
    \ stuff;\n  // 某些操作，将条件改为 false 以结束循环;\n}\n```\n\n只要该操作没有触发布尔值 `false`，`while\
    \ loop` 就会一直运行。\n\n我们可以将这个 `while` 循环应用到之前的颜色描述游戏中，让切换语句无限运行，直到用户点击 `confirm()`\
    \ 的取消按钮。这样，我们就不需要再次调用该函数了，只需要不断要求用户输入他/她喜欢的颜色，直到用户按下取消按钮。\n\n**那么，我们在哪里实现从布尔 `true`\
    \ 到布尔 `false` 的改变呢？**\n\n我们在每个 `case` 中实现它，因为只有一个 `case` 会生效。当用户确认该类的输出消息时，如果他们想退出游戏，也有机会按下取消。在用户按下\
    \ `cancel` 之前，游戏将一直进行下去。\n\n请看下一张图片了解我的意思：\n\n![](img/00017.jpeg)\n\n图 17\n\n\
    在第 3 行，我们将整个切换机制封装在一个 `while` 循环中。\n\n只要 `replay` 为 `true`（这是它的初始状态），切换语句就会运行，循环会不断地重启切换语句，直到我们按下取消。按下\
    \ `ENTER` 等同于按下 `OK`，这意味着运行另一个周期。最终，我们玩腻了游戏，点击了确认框上的取消选项，这将触发 JavaScript 退出循环。\n\
    \n注意变量 `replay` 的值（它起初是一个布尔值 `true`）是如何在每次提示输出消息时被更新的。这为用户提供了退出游戏的机会。\n\n它看起来比我们之前做的脚本更专业，如果你对创建游戏感兴趣，这会变得非常有用。\n\
    \n* 在你编写了你自己的版本后，可以与[论坛板块](http://jsplain.com/javascript/index.php/Thread/35-Lab-13d/)\
    \ | bit.ly/1DwVNYo 上的代码进行对比。\n* 或者直接查看[原始文件](http://icontemp.com/jpl/colors4.txt)\
    \ | bit.ly/1sWgeWf\n\n# 第四部分：进入第三境界\n\n**请注意：**\n\n这本书已经变得越来越长了！如果你想休息一下，现在是时候了，因为我们接下来要涵盖的内容是补充性的，不是\
    \ JavaScript 语法 `core` 的一部分。\n\n另一方面，如果你急着学习 AngularJS，目前可以安全地跳过 JSON，直接进入第五部分：击败巨龙。\n\
    \nJSON 是一个必须了解的话题，因为你迟早会用到它，但我们在第五部分涵盖的内容并不需要它。\n\n我希望你的这段时间过得很有成效，非常感谢你对这些材料的投入和信任。\n\
    \n[Tony de Araujo](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)\n\n## 4.1\
    \ 关于本节\n\n我们已经涵盖了 JavaScript 的很多领域，还有很多内容要写。然而，一次性写完并不是一个好主意，因为这会降低效率并违背初衷。这就是我将\
    \ JavaScript 分为几个不同的小手册的原因：为了让读者有时间消化每本出版物涵盖的所有数据。持续的练习、重复以及有意识的认知扩展似乎是更好的方法。\n\
    \n[JavaScript Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ 对每个 JavaScript 库方法进行了更详细的介绍，并提供了更高级的概念练习。如果你完成了到目前为止的所有练习，你已经完全准备好应对另一卷了。\n\n\
    另一个非常流行且廉价的练习用电子书是 [画出六个幸运数字](http://www.amazon.com/Small-Projects-Learn-JavaScript-Mastering-ebook/dp/B00H4P987A/)，它涵盖了循环、随机数，并回顾了函数和数组。这是一个周日下午的快速项目。\n\
    \n**现在我们来了一个十字路口。**\n\n这本书的剩余部分将介绍两个每个 JavaScript 中级到高级程序员都应该知道的热门技术：\n\n**JSON**（**J**avaScript\
    \ **O**bject **N**otation）是一种数据格式化方法，使用人类可读的文本传输由键值对（JavaScript 对象）组成的对象。这种格式在许多方面正在取代\
    \ XML，并用于现代 Web 编程。从某种意义上说，我从书开始就开始介绍它，所以这些材料对你来说应该熟悉，因此这一部分相对短。\n\n最后一个涵盖领域是关于基于\
    \ JavaScript 的框架库 `AngularJS`。\n\n这个库正在彻底改变我们构建网站的方式，尽管仍处于婴儿阶段，但它已经产生了持久的影响，当你学习它时就会明白为什么。当你完成接下来的章节后，你就能以简单且全面的方式将动态数据实现到你的基础网页中。\n\
    \n请记住，我只是介绍了 AngularJS，这并不是一本关于它的完整书籍，因为这个主题跨越了几卷。我希望通过编写这些材料，赋予你进一步研究 AngularJS\
    \ 的能力。这些信息将开启我认为的最难入门的部分。通过给出的练习和解释，你应该能够克服这第一个障碍。\n\n## 4.2 JSON 简介\n\nJavaScript\
    \ Object Notation，`JSON`（读音为 J SON）是一种开放标准，使用人类可读的文本传输由键值对（JavaScript 对象）组成的对象。它在服务器和\
    \ Web 之间传输数据方面已成为 XML 的替代技术。“替代”一词可能过时了，因为现在 JSON 是 Web 服务的首选方法。\n\n我之所以在此处介绍\
    \ JSON，是因为在写作期间，如果有人想构建网页和 Web 应用程序，JSON 已经成为 JavaScript 中必须掌握的子集。它应该是任何 Web 素养课程的内容。JSON\
    \ 如此受欢迎，以其他语言现在也在实现它。好消息是，你在整本书中已经为这项技术做好了准备，这只是变得意识到它的存在的问题。\n\nJSON 格式在语法上与我们创建列表相同，无论是作为数组的数值，还是作为对象中的键值对。我们还可以结合两种格式来创建更复杂的\
    \ JSON 数据结构。以下是使用 JSON 格式编写的数据集：\n\n```json\n{\n  \"firstName\": \"Tony\",\n \
    \ \"lastName\": \"deAraujo\",\n  \"age\": 99\n}\n```\n\n或者我们也可以有一个数组：\n\n```json\n\
    [1, \"hello\", 33]\n```\n\n**请注意：** 如果你计划将数组转换为 JSON 格式，请避免使用混合数据类型，比如我刚刚向你展示的数组。这是因为\
    \ JSON 应该是一种**语言无关**的数据交换协议，许多编程语言不允许混合数组（包含混合值类型的数组），这会导致混淆。以下内容就可以，因为数字被视为字符串：\n\
    \n```json\n[\"1\", \"hello\", \"33\"]\n```\n\n回到我们顶部的第一个例子，注意 JSON 对象或数组没有进行变量赋值。对象的\
    \ JSON 部分是无缝导出到其他系统的部分。\n\n在以 JSON 格式编写时，我们必须将键（key）封装在双引号中。由于我们从一开始就使用了双引号，所以在这方面应该没有问题。\n\
    \n如果键没有封装在双引号中，JSON 将报错。单引号是不起作用的。\n\n"
