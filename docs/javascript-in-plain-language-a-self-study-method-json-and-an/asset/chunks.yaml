    这本书适合所有想要在不参加正式课程的情况下使用 `JavaScript` 语言学习基础编程的人。它也可以作为课堂的补充，用于练习和复习。


    - 目标读者是想要重新学习该主题的初级、中级或高级读者。


    书中包含许多带有答案和解释的练习。每个章节的长度为一页或更短，每个主题后面都有带有指向原始文件链接的实验。此外还有一个 `forum board` 以方便进一步的阅读和练习。由于所有脚本都很很短，这些链接只是为了消除你对自己的工作可能产生的任何疑问。


    我建议每天至少花 30 分钟时间来阅读和练习每个章节。不要急于进度，因为涵盖的主题是掌握该语言的基础。花时间来吸收每个概念。在进入新主题之前，请有意识地离开电脑，进行一些身体活动，例如简单的拉伸。


    阅读每个子主题并完成练习。从头到尾跟读这本书；此后，你可能希望将这些材料作为全面的参考，以温习记忆或用于练习目的。如需进一步练习，请参阅书中后部分介绍的专用论坛平台。


    如果你每天学习，将在大约两周内完成课程。


    如果你只是将其作为复习，可能在一个周末内就能完成。


    这本书利用了你浏览器的 `JavaScript Console`。我推荐使用 `Google Chrome` 的控制台，我将解释如何访问它以及如何将其用于我们的目的。`Opera`
    和 `Epic` 的用法也一样。当然，只要你知道如何访问，可以使用任何你需要的其他测试方法。新的 Microsoft Edge 浏览器也可以通过快捷键 `F12`
    访问 JavaScript 控制台。


    除了推荐 `Google Chrome`，我还会推荐使用 `jsbeautifier`（一个非常有用的在线编辑器），以及我自己的网站论坛，在那里你可以找到所有链接的练习以及进一步的阅读和练习材料。


    现在不用担心这些；在适当的时候会有大量的参考链接发布。


    ### 在阅读这些材料之前你应该知道的


    阅读和练习书中项目的唯一先决条件熟悉基础计算机技能，如 `copy/paste`（复制/粘贴）和 `editing`（编辑）文本行。


    为了获得完整的体验，你需要访问 `Internet`。


    你可以随时离线查看材料，但如果不在线，将无法访问我的任何示例文件。


    为了完全理解书中用通俗语言介绍 `AngularJS` 的最后部分，你需要了解基础 HTML 语法，例如理解如何创建基础 HTML 页面、`HTML tag`（HTML
    标签）、`BODY` 标签、如何创建段落或 `DIV` —— 都不复杂。


    这本书将为你提供基础，让你熟练掌握 `JavaScript`，这样无论你计划精通该语言的哪个领域，都能稳步进步。


    基础数学是一个加分项，但即使你认为数学不是你的擅长，书中所有的数学示例都有详细的解释。没有人应该在这些示例上遇到任何问题。


    这本书将帮助你理解现代 JavaScript。这包括对 `JSON` 和 `AngularJS` 的通俗易懂的深入介绍，这将为你打开大门并打破障碍，让你进入这些非常热门的技术。


    ### 代码学习的螺旋方法


    本电子书利用了下述的代码学习的“螺旋方法”理念：


    1. 保留开发历史过程。

    2. 首先提供简单的解决方案，然后用更高级、更健壮的解决方案取代。

    3. 仅解释螺旋中使用的概念，并提供进一步阅读材料的链接。


    每个项目都保留了其增量历史，作为可以回顾的有用快照，就像螺旋一样。螺旋方法是一种经常用于教学的技术，首先学习学科的基本事实，而不必担心细节。然后随着学习的进行，会引入越来越多的细节，同时将它们与基础联系起来，并多次强调基础以帮助概念的内化。


    **无需背诵**


    - 必须按顺序读本书，以获得更有效、强大且有意义的体验。

    - 练习不仅要在完成当前实验工作后重复，还要在完成整个章节或读完整本书后重复。

    - 练习就像练习吉他一样：每天且有意识地进行。将 JavaScript 练习想象成要弹奏的音阶。

    - 完成练习后，始终思考如何将所涵盖的概念应用于不同的配方。像主厨一样思考。编程就像烹饪。

    - 编程也像水水工程。我们通过促进连接来创建接口。

    - 最后，编程既是科学也是艺术。它结合了两个世界的精髓。


    ### 什么是 JavaScript


    JavaScript 是一种旨在与计算机浏览器交互的编程语言。目前没有其他语言具有与 JavaScript 相同的浏览器兼容性。大多数试图取代 JavaScript
    的语言实际上会将代码[反编译](http://en.wikipedia.org/wiki/Decompiler)为 JavaScript。


    ### JavaScript 和 HTML 有什么区别？


    HTML 是一种演示标记语言。它创建显示在页面上的对象（容器框）。它不会根据用户交互做出决策。HTML 是在计算机屏幕上涂画。


    JavaScript 扩展了 HTML，因为它能根据某些条件和结果与用户交互，从而使页面变得动态。


    为了创建结果并做出决策，我们需要学习 JavaScript 语法，这正是本书的主题。


    在随后的章节中，我们将学习如何使用名为 `AngularJS` 的最新实现技术之一来创建现代网络交互。


    这本书不会让你成为 `AngularJS` 专家。但它将为你提供一个非常坚实的基础，赋予你力量并推动你前进。


    这本书采用实操方法。请准备好进行高强度的锻炼。


    # 第一部分：启蒙之门


    “虚怀若，归初心”。


    ## 1.1 浏览器界面


    每当我们上线时，我们都会使用一个[接口](http://en.wikipedia.org/wiki/Interface_%28computing%29) 与互联网通信。这种特定的接口被称为“[浏览器](http://en.wikipedia.org/wiki/Web_browser)”，其目的是将来自外部世界的输入数据翻译到我们的计算机屏幕上。最流行的浏览器有
    Internet Explorer（称为 IE，现在由 Microsoft Edge 替换）、Google Chrome、Firefox、Opera 和 Safari，但还有数百种[其他浏览器](http://en.wikipedia.org/wiki/List_of_web_browsers)。


    浏览器根据程序员用 [HTML](http://en.wikipedia.org/HTML) 标记语言提供的指令在屏幕上放置文本和图像。然后，这些文本和图像将通过名为
    [CSS](http://en.wikipedia.org/wiki/Cascading_Style_Sheets) 的样式语言进行重新排列或美化。最后，网站通过
    [JavaScript](http://en.wikipedia.org/wiki/JavaScript) 与用户动态交互，这是本书的主题。


    JavaScript 是一种旨在与所有浏览器交互并被识别的计算机语言。这意味着通过编写 JavaScript 指令，我们可以在浏览器中创建各种程序。


