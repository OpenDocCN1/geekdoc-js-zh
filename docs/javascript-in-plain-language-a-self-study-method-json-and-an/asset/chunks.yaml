    指令（Directive）是为现有标准语法引入新功能的东西。它扩展了语法的能力，就像是“教老狗学新技巧”一样。通过在现有的 HTML 标签上挂载指令，该标签的行为会根据
    Angular 库中以该指令命命的内容而发生改变。在某些情况下，指令指定了全局行为，而在另一些情况下，它们只影响局部区域，例如一段程序代码。


    AngularJS 通过称为指令（directives）的构造结构向浏览器教授了新语法。


    如果你以前构建过 Web 应用程序，Angular 将是一个完全全新的范式。如果你是 Web 设计的新手，AngularJS 将教你现代且最佳实践的方法，并且你会认为自己很幸运，因为你不需要为了学习新知识而忘记旧知识。


    是的，起初是需要付出代价的，你失去了灵活性。但换来的是一致性、开发速度，以及在今天和明天都好用的东西。你不再需要知道如何制造发动机来开车，但你了解得越多，就越能充分利用汽车提供的功能。AngularJS
    并不是一项容易学会的技术，但如果你已经读到了这本书的这里，说明你已经具备学习和掌握 AngularJS 的自律和技能。


    ### ng-app 是什么意思？


    它只是告诉浏览器使用 AngularJS 作为页面的根，或者作为 DIV 的根，取决于我们在哪里插入 `ng-app` 标签。通过这种方式，一切都将相对于
    AngularJS，而 AngularJS 为你的页面提供了核心功能。


    在这个示例中，


    ```html

    <html ng-app>

    ```


    整个页面使用 AngularJS 作为它的根。


    在这个示例中，


    ```html

    <div ng-app>

    ```


    只有这个 DIV 使用 AngularJS 作为它的根。网页的其他部分感知不到 AngularJS。


    我们还可以通过在指令中添加*应用名称*来为我们正在构建的应用程序命名：


    ```html

    <html ng-app="myApp">

    ```


    正如你很快看到的，这变得非常有用。


    因为在 `ng-app` 指令中包含应用名称非常常见，你会在许多文章中看到以下语法：


    ```html

    <html ng-app="">

    ```


    这是另一种编写无名称指令的方法，而不是直接写一个 `ng-app`。


    *   **注意：** 除非该名称作为 `Module`（模块）存在，否则不要包含名称，因为 AngularJS 将无法工作。我们还没有介绍模块，所以目前我们只单独使用
    `ng-app` 本身，即使在生产环境中这样做也是完全没问题的。

    *   **注意：** 注意 `ng-app=""` 引号之间没有空格。空格会被视为一个名称（即使是空的），并且必须创建一个该名称下的模块。再次，我们现在只单独使用
    `ng-app` 本身即可。


    ### 不再有 DOM 操作任务


    文档对象模型（Document Object Module，或 `DOM`）是所有现有 HTML 标签或节点的映射布局。为了在 Web 页面中写入 JavaScript
    程序的结果，我们需要定位到想要实现脚本结果的 DOM 位置。由于浏览器的不一致性和实现错误，这一直是一个问题。那时，`jQuery` 诞生了。`jQuery`
    是一个用于处理 DOM 的方法库。当实现良好时，`jQuery` 效果非常好。遗憾，`jQuery` 的使用变成了一个问题，因为许多用户不学习 JavaScript，他们只是背诵
    `jQuery` 解决方案，而 `jQuery` 是手动驱动的，导致了实现错误。


    AngularJS 来救场了。底层实现将不再由程序员自己完成；将由 AngularJS 根据程序员对特定结果的表达性需求来完成。程序员变成了一个水工；他们为所需的结果插入正确的指令。这将确保了最佳实践和无错误的实现。有了
    AngularJS，你从底级操作任务中解放出来，你可以利用额外的时间来思考解决方案，而不是考虑代码语法和安全实现。


    当然，如果你知道 `jQuery`，你仍然可以在 AngularJS 中配合使用它，但我怀疑 AngularJS 将开发出越来越多的方法来规避某些 `jQuery`
    的流行实现。


    在 AngularJS 中，应用程序接触 DOM 的唯一地方是在 `directives` 内部。然而，如果你需要直接访问 DOM，仍然可以通过编写[自定义指令](https://docs.angularjs.org/guide/directive)
    | bit.ly/1tYW95Q 来。


    好了，我们现在对 `directives` 有了点了解。让我们回顾一下 `expressions`（表达式）的含义，以便我们扩展 AngularJS 的主题。


    ### 什么是表达式？


    你还记得在之前的章节中表达式是什么吗？


    表达式是 JavaScript 求值得到单个值的东西。


    ```javascript

    2 + 5;

    // 结果为 7

    ```


    ```javascript

    "tony"

    // 结果为 tony

    ```


    ```javascript

    "hello".toUpperCase();

    // 结果为 "HELLO"

    ```


    以此类推……


    如果在我们的 Web 页面上有一个传递给 AngularJS 以供 JavaScript 解释器求值的表达式，我们通过将其封装在双括号中来实现：


    ```html

    {{ this expression }}

    ```


    AngularJS 将将 JavaScript 求值的结果精确地写在双括号在 Web 页面上的位置。这不是 AngularJS 的发明；它在 AngularJS
    出现之前就被其他库实现了。只需看一眼 [Mustache](http://en.wikipedia.org/wiki/Mustache_%28template_system%29)
    | bit.ly/1DxihbF。


    让我们玩几个例子。这可能不会有什么实际作用，但它的目的是让我们熟悉如何将表达式传递给 AngularJS。


    注意：你仍然可以使用 jsbeautifier.org 作为编辑器，但遗憾的是，除非你将代码粘贴到另一个纯文本编辑器，否则你无法保存文件。想起了记事本（NOTEPAD）。如果你以前做过
    HTML，你可能已经有一个喜欢的编辑器可以使用了。


    1- 首先，我们获取示例 HTML 脚本：[原始文件](http://icontemp.com/jpl/ang14/ang1.txt)


    2- 将其粘贴到本地编辑器，例如 Windows 记事本（我也使用来自 [pnotepad.org](http://www.pnotepad.org/) 的免费且彩色的程序员记事本）。将其保存为
    HTML 文件。我将我的文件命名为 `ang2.htm`。确保你为我们的示例创建一个新文件夹。


    3- 要进行测试，进入文件列表并双击该文件。由于它是 HTML 文件，它将在浏览器中打开，你应该看到 *hello* 这个词。


    4- 现在我们已经知道文件可以工作了，回到编辑器并添加一个表达式。将单词 hello 替换为以下句子和表达式：


    ```text

    Convert the expression tony to uppercase: {"tony".toUpperCase();}

    ```


    5- 保存文件，刷新浏览器或重新打开文件，你应该能看到大写的 TONY。


    查看下方的图片解释：


    ![](img/00025.jpeg)


    图 24 查看 [原始文件](http://icontemp.com/jpl/ang14/ang2.txt) | [html](http://icontemp.com/jpl/ang14/ang2.html)


    HTML 脚本与之前相同。我们只是将单词 hello 替换成了第 11 行所示的句子，后面跟着 {"tony".toUpperCase()}}。


    在双括号内的任何内容都将由 JavaScript 求值。


