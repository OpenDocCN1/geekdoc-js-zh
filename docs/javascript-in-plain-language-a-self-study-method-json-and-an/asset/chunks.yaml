    由于 "Tony" 的类型是 `string`，我可以对这种类型的数据进行一些操作，或者获取关于 `string` 数据的一些信息，例如它的字符长度：


    ```

    myName.length;

    ```


    控制台将显示 4，这意味着变量 `myName` 的值为 "Tony"，它的长度为 4 个字符。


    `length` 是从 `type string` 继承的属性之一。其他类型的数据也使用这个属性，因为正如你将反复看到的，它在决策过程中非常有用。


    你注意到 `myName` 和 `length` 之间的**点（dot）** 了吗？


    ### 点运算符 (DOT operator)


    `myName.length` 中的点将变量 `myName` 与它的属性 `length` 连接在一起。


    点运算符将变量连接到它的属性，或者将父级连接到子级。我们先放置根节点（即属性的所有者），然后通过点来映射它的成员或子级：


    ```

    parent.child.grandchild;

    ```


    或者在一个更显式的示例中：


    ```

    window.myName.length;

    ```


    `window` 是变量 `myName` 的父级。我们稍后会回到这里。


    这几乎就像说“这个人的名字是什么？”，你看到 `''s` 了吗？它将名字与人联系起来。点表示法的工作原理也是如此。


    在这种情况下，它非常简单：我们从变量名开始，向下移动到它的属性 `length`。在其他情况下，目标地址可能会变得复杂，也许在链条后面还有另一个两个项。在整本书中，我们将多次机会使用点运算符。


    在使用**点运算符**时，我们使用的是所谓的**点符号表示法 (Dot Notation)**，但还有另一种替代语法称为**括号表示法 (Bracket Notation)**。


    请参阅下一页，获取括号表示法的简要介绍说明。


    ### 括号表示法 (The Bracket notation)


    我不想通过同时提到两种表示法来让你感到困惑。我们以后将大量使用括号表示法。请将其视为关于它的入门介绍。


    而不是：`myName.length;`


    在你的控制台中输入以下内容：


    ```

    myName["length"];

    ```


    它显示数字 4，就像使用点表示法时一样。注意 `length` 是在括号内部被包裹在引号中的。我们将 "length" 作为一个字符串或标签传递，JavaScript
    将把它重新转换回其库中正确的属性级别。使用括号表示法有优势，因为它更通用，但现在不要为此苦思过度。我们将同时使用点表示法和括号表示法。括号表示法主要用于动态情况。你以后会看到点表示法是“硬接线”的，而括号表示法是“软接线”的（当我们编写代码时不知道真实值）。


    *有时我们开轿车，有时我们开皮卡！* 表示法语法在这一点是一样的。


    ### 方法的示例


    字符串数据还继承了诸如 `.toUpperCase()` 等方法：


    ```

    myName.toUpperCase();

    ```


    它显示 "TONY" 而不是 "Tony"。


    变量 `myName` 变成大写了吗？


    没有，没有变。它只是在大写模式下显示了它，但值保持原始声明时的状态。


    不过，我们可以通过将变量 `myName` 重新赋值为其转换后的值，将原始值转换为大写：


    ```

    myName = myName.toUpperCase();

    ```


    现在 `myName` 包含值 "TONY"。原始的 Tony 被丢弃了。你看到它是如何发生的吗？我们将原始变量赋值了它自身的转换结果。这几乎就像那只能抓到自己尾巴的狗。


    ### 括号 ( ) 是什么？


