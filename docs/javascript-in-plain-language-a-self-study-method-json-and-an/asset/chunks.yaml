    ```javascript

    confirm("Ok, let''s play!");

    alert("ok, goodbye!");

    ```


    ### 检查 if(), else


    在 `if(){ do this stuff; }` 括号内部我们包含一个条件。请记住，并不是条件本身解锁了代码块：而是你在其中编写的问题的“真值（truthiness）”解锁了代码。


    示例：


    `if(10 === 10){}` <-- 因为 10 等于 10，JavaScript 将将该语句评估为 `true` 并解锁下一个代码块。


    `if(10 === "10"){}` <-- 因为 10 是数字而 `"10"` 是 `string`，JavaScript 将该语句评估为 `false`
    并跳过下一个代码块而不执行它。


    `var x = 33; if(x){}` <-- 因为 `x` 有除 0、`undefined` 或 `null` 以外的值，该语句为 `true`。


    `if(!x){}` <-- 因为 `x` 有除 0、`undefined` 或 `null` 以外的值，该语句为 `false`。


    `var y = "yes";`


    `if(y === "yes"){}` <-- 因为 `y` 的值是字符串 `yes`，该语句为 `true`。


    `if(y !== "yes"){}` <-- 因为 `y` 的值是 `yes`，该语句为 `false`。


    `if(y === "no"){}` <--- 因为 `y` 的值是 `yes`，该语句为 `false`。


    `if(y === "no" || y === "yes"){}` <-- 因为其中一个语句为 `true`，所以该语句为 `true`。


    `if(y === "no" && y === "yes"){}` <--- 因为其中操作数之一为 `false`，该语句为 `false`。


    ### else 是什么？


    `else` 是可选的。我们可以有一个单独的 `if()` 条件语句。然而，我们不能单独使用 `else`，因为 `else` 只是当 `if()` 失败时的捕获辅助。或者换句话说，它是
    `if()` 的替代方案。


    ### 在 if(), else 中间添加第二个条件


    有时，`if(), else,` 不足以容纳所有结果。在这种情况下，有一个中间语句，它像 `if()` 一样接受一个条件。


    这个中间条件被称为 `else if()`。


    这里是基本语法：


    ![](img/00002.jpeg)

    图 2


    ### 如何在条件语句中物理编写大括号


    注意第 1 行的左大括号。这是 JavaScript 常见的做法。如果你来自较旧的语言（如 `C`），你可能习惯于在第 2 行单独写左大括号。这完全没问题。无论你选择哪种方式，只需确保不要混合使用即可。


    此外，右大括号始终位于一行的开头（例如：第 3、5 和 7 行）。在 `if()` 合大括号之后，我们可以在同一行写上 `else`，或者在适用情况下写 `else
    if`，并以左大括号结束该行（参见第 3 行）。


    最后的右大括号始终单独成行（第 7 行）。这是所有使用大括号的语言的共同点。一个非常常见的错误是将右大括号写在最后一个语句的右侧。那样非常难看而且非常难以调试。


    有时你会发现没有大括号的 JavaScript 条件语句，它也是可以运行的。但我不建议这种做法，因为会导致不一致性，并且迟早可能会触发错误，因为 JavaScript
    解释器在认为缺少分号时会自动添加分号，而缺少大括号可能会导致解释器认为它到达了语句的结尾。在掌握这种样式概念之前，请在写完代码后使用 `jsBeautifier`
    来格式你的代码。


    ### 何时使用 else


    当有多个条件需要检查时使用 `else if()`。它位于 `if()` 和 `else` 之间。


    如前提到的，我们必须处理常见的条件，即 *x 同时被 3 和 5 整除*。这应该成为我们的主 `if()` 条件。然后我们为能被 3 或 5 整除的数字创建两个额外的
    `else if()`。


    最后，我们将输出“*No, x is not divisible by 3 nor 5*”赋值给捕获器 `else`。


    2- 让我们执行第一个条件并进行测试：


    ![](img/00003.jpeg)

