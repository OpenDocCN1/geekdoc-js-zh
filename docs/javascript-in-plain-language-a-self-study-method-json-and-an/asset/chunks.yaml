    `。变量 `b` 包含带`quotes`引号的你的，因此它是一个字符字符串。\n\n5- 变量 `a` 呢？\n\n```\ntypeof a;\n```\n\
    \n它显示 `\"number\"`。变量 `a` 包含数字 `347`，因此它包含`number`数字类型的数据。\n\n*   **NOTE：** 你注意到到控制台是如何尝试完成\
    \ `typeof` 单词的吗？如果你不想自己写整个单词，只需在显示器出现提示时立即按 TAB 键。或者如果你像我一样，更倾向于练习输入，只需注意拼写错误即可。自动补全对于加速编程和避免输入错误非常有用，特别是在处理长命令时。自动输入也有助于我们\
    \ 记住每个命令是如何写的。测试控制台非常有用；我在现实生活中每天使用数百次，因为我不断在测试东西。\n\n### `typeof` 是什么？\n\n`typeof`\
