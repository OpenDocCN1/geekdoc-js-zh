    \ Answers to Lab work 9\n\n1- Take the following array `y` as an example and sort\
    \ the array:\n\n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\ny.sort();\n\
    ```\n\nIt returns `[\"apple\", \"banana\", \"grape\"]`.\n\n2- Assign a new array\
    \ named `mySort` to the contents of a sorted array `y`:\n\n```javascript\nvar\
    \ mySort = y.sort();\n```\n\n3- Test `mySort`:\n\n```javascript\nmySort;\n```\n\
    \nIt returns `[\"apple\", \"banana\", \"grape\"]`.\n\n4- Now display the array\
    \ `mySort` is a string type format, and split the items whit 1 blank space. Hint:\
    \ use `join()`:\n\n```javascript\nmySort.join(\" \");\n```\n\nor you might have\
    \ done this which is also correct:\n\n```javascript\nconsole.log(mySort.join(\"\
    \ \"));\n```\n\nIt returns \"*apple banana grape*\" in a string format.\n\n5-\
    \ Now, instead of just displaying it, assign the items from `mySort` to a new\
    \ variable `z`, but in a string format. Use a combination of space, forward slash,\
    \ and space as a separator:\n\n```javascript\nvar z = mySort.join(\" / \");\n\
    ```\n\n6- Call `z`:\n\n```javascript\nz;\n```\n\nIt returns \"apple / banana /\
    \ grape\".\n\n7- Use the `indexOf()` method to find the position of \"banana\"\
    \ in array `y`:\n\n```javascript\ny.indexOf(\"banana\");\n```\n\nIt returns 1,\
    \ which means that \"banana\" exists and is located on position 1 (second item).\n\
    \n8- Test for the existence of \"banana\" in array `y` ( use an if conditional\
    \ statement), and display the following message on the screen using `console.log()`:\n\
    \n```javascript\nif(y.indexOf(\"banana\") >=0){\n  console.log(\"banana is contained\
    \ in array y\");\n}\n```\n\nIt returns \"*banana is contained in array y*\".\n\
    \n9- Using the same method as the last exercise, look for \"chestnut\". Then display\
    \ two messages, one for `if()` and another for `else` as follows:\n\n\"*chestnut\
    \ is contained in array y*\"\n\nelse: \"*chestnut is not found in array y*\":\n\
    \n```javascript\nif(y.indexOf(\"chestnut\") >=0){\n  console.log(\"chestnut is\
    \ contained in array y\");\n} else {\n  console.log(\"chestnut is not found in\
    \ array y\");\n}\n```\n\nIt returns \"*chestnut is not found in array y*\".\n\n\
    10- Remove the last item of array `mySort` using `pop()`:\n\n```javascript\nmySort.pop();\n\
    ```\n\nIt removes \"grape\".\n\n11- Remove the first item of array `mySort` using\
    \ `shift()`:\n\n```javascript\nmySort.shift();\n```\n\nIt removed \"apple\".\n\
    \n12- `mySort` should now only contain \"banana\". Add \"chestnut\" as the last\
    \ item. Use `push()`:\n\n```javascript\nmySort.push(\"chestnut\");\n```\n\n`mySort`\
    \ should now have 2 items, `[\"banana\", \"chestnut\"]`.\n\n13- Using `splice()`,\
    \ insert \"apple\" in array `mySort` at position 1 (as a second item). Do not\
    \ delete any existing item.\n\n```javascript\nmySort.splice(1,0,\"apple\");\n\
    ```\n\n`mySort` should now contain `[\"banana\", \"apple\", \"chestnut\"]`.\n\n\
    14- Using `slice()`, create a new array named `newArray` with a copy of the second\
    \ and third items (\"apple\" and \"chestnut\") from `mySort` array:\n\n```javascript\n\
    var newArray = mySort.slice(1,3);\n```\n\nThe `newArray` now contains `[\"apple\"\
    , \"chestnut\"]`. The argument 1 represents the second location from `mySort*,\
    \ and argument 3 represents the exclusion which starts at 3.\n\nEND OF LAB\n\n\
    ## 2.13 Lab work 10\n\n### Building a mechanism to fetch a variable from an array\n\
    \nThis exercise will review variable assignments, and creating arrays with variables\
    \ as elements, plus function declarations, reassignment of variables and the usage\
