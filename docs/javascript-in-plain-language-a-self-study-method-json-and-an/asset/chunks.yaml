    ## 1.11 引入 `console.log`, `alert`, `prompt`, `confirm`


    到目前为止，我们一直通过输入变量名并按回车键来测试变量的值。


    这之所以有效是因为我们正在使用测试控制台。


    然而，随着脚本变得越来越复杂，我们需要一种更显式的机制将数据输出到屏幕上。


    这就是 `console.log()` 大派用场的地方。


    ### `console.log`


    控制台有一种通过名为 `log()` 的机制将数据显式记录到屏幕的方法。


    要显示的数据放在括号内。如果数据是字符串形式，我们用引号括起来。然而，如果数据来自变量或数字，我们总是直接写变量名或数字而不加引号。


    示例：


    `log("Hello bluebird");`  <-- 这样写无法运行。在你的控制台尝试之前，请先阅读页面底部的注意事项。


    另一个示例是 `log(x)`。如果 `x` 是一个已声明变量，这将显示 `x` 的值。如果 `x` 不是变量，JavaScript 将抛出错误，因为任何不是变量的单词应该像这样用引号括：`log("x")`。


    我们还可以组合字符串和变量：


    例如：


    ```javascript

    var x = "big bird";

    log("Hello" + " " + x);

    ```


    显示为 *Hello big bird*


    或者如果你记得的话，我们可以这样做：


    ```javascript

    log("Hello " + x);

    ```


    **注意：**


    `log()` 本身无法工作。我们需要使用点语法（Dot syntax）将 `log()` 绑定到 console（小写 c）：


    ```javascript

    console.log("Hello " + x);

    ```


    这是使用 `log()` 的正确方式，即通过点语法将 console 附加到 log()。注意 console 是小写的。在编程时引用控制台的正确方式是小写的
    `console`。它是一个名为 `console` 的对象。`console` 大写将无效，因为 JavaScript 是大小敏感的。


    这里有更多示例：


    ```javascript

    console.log(3 + 5); // 显示 8

    console.log(3 > 5); // 显示 false

    ```


    或者字符串与数字比较的组合：


    ```javascript

    console.log("3 > 5 is " + (3 > 5));

    ```


    显示为 *3 > 5 is* false。


    ### `alert`


    `alert()` 是一个用于向用户显示消息的弹出框。


    ```javascript

    alert("hello!");

    ```


    ### `confirm`


    `confirm()` 是一个用于询问是/否问题的弹出框。


    ```javascript

    confirm("are sure you want to proceed?");

    ```


    ### `prompt`


    `prompt()` 用于从用户处收集信息。


    ```javascript

    var answer = prompt("yes or no?");

    ```'
