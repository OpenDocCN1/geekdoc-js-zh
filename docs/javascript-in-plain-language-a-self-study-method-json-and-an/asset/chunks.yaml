  trans: "\n以台式电脑作为一个对象为例；我们可以说显示器、键盘和鼠标是台式电脑的一些属性。然后我们也可以说 Firefox 和 Chrome 浏览器，以及\
    \ Microsoft Word 是台式电脑的方法，因为这些属性具有功能性，它们在物理意义上并不存在，我们需要像调用函数一样调用它们才能使用它们。它们代表了台式电脑的一些方法。它们的存在是基于某些程序例程的执行。\n\
    \n当我们提到“执行”时，会立即想到函数，但函数和方法之间是有区别的：\n\n- 一个方法可能包含一个或多个函数。\n\n你看出区别了吗？一个函数可以是一个对象的方法，但它本身并不一定是一个方法。方法是一组功能的集合，用于代表对象完成某任务。例如，打印目录列表的方法、更新对象内容的方法、排序内容的方法，或者识别请求对象内容的人的方法等。\n\
    \n### 为我们的汽车对象（car）添加一个方法\n\n2- 如果你一直在跟着我写代码，请在 `rating: 9,` 后面添加一个新逗号，因为我们正要添加另一个属性，即方法\
    \ `printRating`。（使用[编辑器](http://jsbeautifier.org/)）。\n\n3- 为标签 `printRating` 分配一个函数，在屏幕上打印以下消息：\n\
    \n`\"The car rates \" + car.rating + \" out of 10\"`\n\n![](img/00015.jpeg)\n\n\
    图 15 查看[原始文件](http://icontemp.com/jpl/car2.txt) | bit.ly/1C6I5d5。\n\n4- 我们来玩玩这个对象。将上一个原始文件的对象脚本（或自己的脚本）粘贴到控制台（Console）中。\n\
    \n5- 打印汽车的评分：\n\n```javascript\ncar.printRating();\n```\n\n注意我们如何从对象`call()`一个方法。它的起始方式与调用任何其他属性相似，但我们添加了一对括号\
    \ `()`，这创建了一个函数动作。如果我们排除括号会发生什么？它只会打印键名 `printRating` 的内容，即该函数的显式描述。当我们想要将相同的功能赋值给另一个变量时，这有时会很有用，但为了获得动作，我们需要使用括号。\n\
    \n6- 括号表示法（bracket notation）呢？我们该如何使用`括号表示法`调用方法 `printRating`？方法最好用`点表示法`（dot\
    \ notation）调用，因为它的语法更简单，你就会知道原因，但理解其逻辑是有好的，逻辑如下：\n\n```javascript\ncar[\"printRating\"\
    ]();\n```\n\n没有点语法那么漂亮，对吧？注意括号是在中括号之外。所以这是点语法主要被使用的一个领域。括号语法更多地保留给属性的**动态调用**。我们在\
    \ `for` 循环中使用括号语法，是因为在其中，每个属性都需要随着循环的进行被动态访问。\n\n让我们动手吧！\n\n### 遍历对象\n\n假设你知道一个对象的存在，但你并不确定它包含哪些属性。你可以遍历该对象来找到它的属性。\n\
    \n### 引入 for in 循环\n\n这个循环是为我们一直讨论的对象编写的：\n\n在此处查看原始文件：[原始文件](http://icontemp.com/jpl/car2.txt)\
    \ | bit.ly/1C6I5d5\n\n循环结构如下：\n\n```javascript\nfor(var k in car){\n  console.log(k);\n\
    }\n```\n\n`for in` 循环是普通`for 循环`的一种变体，从某种意义上说，JavaScript 库中预编程了一些功能。让我们逐行探索：\n\
    \n`for(var k in car)` --- `k` 是程序员引入的变量。它的目的是在每次循环计数中临时获取并持有`键标签`（key label）（即与每个循环周期中的位置编号匹配的标签）。\n\
    \n让我解释一下：在某种意义上，对象就像数组。唯一的区别是键的映射方式。在数组中，JavaScript 将每个位置映射为位置 0、1、2、3 等。但在使用键的无序列表或对象中，JavaScript\
    \ 将内部位置（无论是哪个位置）映射到最初为任何给定数据值声明的键。\n\n所以，变量 `k` 的目的是计算每个位置（每个周期一次），同时获取与给定计数对应的键名，以便我们获取分配给它的数据值。并不是\
    \ `k` 完成了这一切，而是 JavaScript 提供了此类信息并将其存储在 `k` 中。\n\n至于名字 `k`，我们可以使用任何名字，例如 `i`，但\
    \ `k` 更有意义，因为事实上，JavaScript 会将`键` 值临时存储在变量 `k` 中，每次循环迭代存储一个键。所以字母 `k` 让我们想起存储在那里的是什么，一个临时位置实例。你可能在字段或其他文本中看到它是\
    \ `key`、`prop` 或 `property`。\n\n（我为什么要告诉你这些？因为我不希望你开始阅读网络文章后就认为有一千种不同的 `for in`\
    \ 循环。只有一种 `for in` 循环，只是每个开发者对临时变量命名都很有创意）。\n\n回到“`for k in car`”，在这个例子中我们知道对象名称\
    \ `car`。然而，我们可以将其泛化并使用 `for in` 循环打印键名。我们将在另一个练习中尝试这一点。\n"
- fmt: "\nIn case you’re wondering about it, I don’t really know the rating for an\
    \ `Outback`, the number 9 is just for practicing purposes only.\n\n## 2.15 Lab\
    \ work 11 - redo lab work 10\n\nDo you still remember when in `Lab 10` we displayed\
    \ “The quick brown fox jumps over the lazy dog” in English, Portuguese, Spanish\
    \ and French?\n\nThere were four variables: `english`, `portuese`, `spanish` and\
    \ `french`. Then we added the variables to an array of variable names.\n\nThe\
    \ problem we encountered was attempting to list the array contents as variable\
    \ names, or as `key-value` pairs, like for example:\n\n`english: “The quick brown\
    \ fox jumps over the lazy dog”`.\n\nWe could not dynamically display the variable\
    \ name from the array, just the values themselves. This is because JavaScript\
    \ treated the variable as an `expression` and gave us the evaluation result, which\
    \ was the data inside of the variable. (Expressions will be further explained\
    \ on the next topic).\n\nWell, now we can! All we have to do is, instead of declaring\
    \ separate variables, we declare them as properties of an object.\n\n**Let’s do\
    \ this:**\n\n1- Create an object named `langVersion`.\n\n2- Assign to this object\
    \ four property keys: `english`, `portuese`, `spanish`, `french`.\n\n3- For each\
    \ key add the correct value based on the following text:\n\n[raw file](http://icontemp.com/jpl/fox5a.txt)\
    \ | bit.ly/1rt9dzZ\n\nDo not declare the variables, use property keys instead\
    \ as seen on the raw file.\n\n4- You should now have a complete object.\n\nNext\
    \ create a `for in` loop outside of the object, to print out the contents of the\
    \ object. The display of each property should look something like this:\n\n`english:\
    \ \"The quick brown fox jumped over the lazy dog\";`\n\n*   See my own results\
    \ here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/23-Lab-11/)\
    \ | bit.ly/1tWQddJ\n    or the [raw file](http://icontemp.com/jpl/fox5.txt) version\
    \ | bit.ly/1ofRRkS.\n\n### Transforming the for in loop into an object method\n\
    \n5- Once you have finished the project and everything is working, reengineer\
    \ the `for in` loop so it becomes an internal method of object `langVersion` as\
    \ follows:\n\n*a)* Add a new `comma` after the original last property in the object\
    \ so that you can write another property below it.\n\n*b)* Give this new property\
    \ a label named `list` so that you can call the method later,\n\n*c)* And then\
    \ write a function as the value for `list`.\n\nInside of the function place your\
    \ current `for in` loop.\n\n6- Paste your little program on the Console and call\
    \ the method to see how it prints:\n\n`langVersion.list();`\n\n*   Compare your\
    \ results with mine here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/24-Lab-11b/)\
    \ | bit.ly/1uUYgbd\n    [raw file](http://icontemp.com/jpl/fox6.txt) | bit.ly/1rl24Bl\n\
    *YourYour listing displays all the properties including the method and its internal\
    \ script, right?*\n\nWe can tweak the `list method` to filter out methods from\
    \ printing as part of the list.\n\nIf you want to eliminate the method from the\
    \ printed list you can use a `conditional statement` to filter out anything that\
    \ is not of `string` type since `list()` is a function. The logic behind it goes\
    \ like this: “if the type of property is a 'string', print it”.\n\nDo you still\
    \ remember how to use `typeof`? We covered it on Lab work 1:\n\nWhen we write:\n\
    \n`typeof \"tony\";`\n\nJavaScript replies with \"string\".\n\n7- Reengineer the\
    \ loop once again so that\n\n```javascript\nif (typeof langVersion[k] === \"string\"\
    ) {\n```\n\n`console.log` the desired output. No `else` is needed for this one..\n\
    \n*   Compare your results with mine here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/25-Lab-11c/)\
    \ | bit.ly/1tWSDsR\n    [raw file](http://icontemp.com/jpl/fox7.txt) | bit.ly/1pqbvtZ\n\
    \n**In summary**, there are times to use an `array data structure`, and there\
    \ are times when an `object data structure` is more appropriate. In the end, both\
    \ arrays and objects are `lists` from the JavaScript library wearing different\
    \ customs.\n\nIn arrays we use a regular `for loop` and with objects we use a\
    \ `for in loop` which is a for for loop preconfigured to print out label names\
    \ and with no length value declaration necessary.\n\nIf you want further practice\
    \ visit the new forum as I will expand the subject there. Also my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ has many real life exercises to drill and expand this subject.\n\nEND OF LAB\n\
    \n# PART III: STRENGTHENING THE WARRIOR'S ARSENAL\n\n*JavaScript is an instrument\
    \ that needs to be played*.\n\n## 3.1 Taking an inventory of what we’ve learned\n\
    \nGive me 5 minutes and I’ll tell you everything I know!\n\nSometimes it feels\
    \ like that, right?\n\nWell, we have covered quite a lot: The purpose of `variables`;\
    \ The type of data assigned to `var`; How we introduce `variables` as `reference`;\
    \ We have seen how `array` acts as numerically list; How to use `for loop` to\
    \ (scan) the array; We have used `push()` and `unshift()` to insert new items\
    \ into array, and `pop()` and `shift()` to remove items from array. We have also\
    \ experimented with `splice()` to remove, replace or add new items into any specific\
    \ location of array, and how to copy whole section of array by `slice()`. What\
    \ about sorting arrays And how to use `join()` to convert array into string. Last\
    \ but not less, we have seen `indexOf()` can be useful to find the location number\
    \ of certain item, or to check if the item has been inserted in array. So much\
    \ we’ve learned in such time!\n\n**What about objects?**\n\nWe know that almost\
    \ everything in JavaScript is an object of some sort, but normally we refer to\
    \ objects when we talk about unordered lists indexed by key labels. The items\
    \ in an object, which are called properties, can be addressed by either dot syntax\
    \ or bracket syntax. Some of the properties are called methods because they represent\
    \ functionality. for in loop is a variation of for loop specifically created to\
    \ traverse over objects. The temporary counter variable serves to dynamically\
    \ store the key names of each property so that we can manipulate the data, such\
    \ as printing to screen. We know that dot syntax does not work with dynamic representations\
    \ of properties. Also when we print a list of properties, we can filter out the\
    \ methods by creating a condition for output with a `typeof` verification. In\
    \ the process of learning all these we also learned about conditional statements\
    \ by using `if, else if, else`. Boolean true and false were introduced and we\
    \ learned that, in JavaScript, every value is considered true except Boolean false,\
    \ number zero, or the values undefined and null.\n\nFunctions are mechanisms that\
    \ save executable code. In a sense, a function does not hold a value, it holds\
    \ a potential value that only materializes when we call the function. A function\
    \ can have input parameters as temporary placeholders for data being passed into\
    \ the function when the function is called. Of course we can also have functions\
    \ that do not take any data, they just perform a certain task. We know that the\
    \ return mechanism is the only true raw output from a function and we need to\
    \ catch this returned data if we want to reuse it somewhere else before it gets\
    \ lost in cyberspace.\n"
