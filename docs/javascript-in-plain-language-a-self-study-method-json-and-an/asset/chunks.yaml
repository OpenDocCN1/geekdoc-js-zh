    ## 5.3 迈向 AngularJS 的坚实一步


    ### 简介


    AngularJS 是一个用于开发动态 Web 页面的框架。它由 Google 创建，旨在解决传统 Web 设计中的多个问题。与其他许多开发者一样，我认为
    AngularJS 是目前可用的最热门技术以及 Web 设计的未来，而且因为有 Google 的支持，会有大量的资源让它扎根。


    在某种程度上，AngularJS 扩展了 HTML 属性，得益于 AngularJS 提供的库，赋予了它们超能力。该库通过链接像你链接 CSS 或 JavaScript
    一样连接到你的网页上。


    HTML 是为静态页面设计的。AngularJS 就像如果 HTML 是为现代应用设计的它本该有的样子。


    此时，你真的需要了解基础的 HTML，因为我们将处理一个标准的 HTML 页面。你不需要成为专家，掌握最基础的内容即可。如果你需要温习一下知识或从零开始学习，请访问
    [Codecademy](https://www.codecademy.com/)。你可能偶尔在那里看到我担任版主，特别是在他们的 JavaScript 练习中，但他们的
    HTML 教程非常酷而且免费！！


    你感兴趣的链接（供未来参考）：


    [AngularJS.org](https://angularjs.org/) | [维基百科](http://en.wikipedia.org/wiki/AngularJS)
    | [文档](https://docs.angularjs.org/api/ng/directive/ngCloak)。


    在读阅读他们的材料而迷失之前，让我们先熟悉基础设置以及它能为试图设计更动态 Web 页面的 Web 开发者做什么。


    欢迎来到现代 Web 设计！


    ### 指令（Directives）


    AngularJS 如何扩展 HTML 能力的？


    首先，我们在网页上提供一个 AngularJS 库的链接，就像我们链接 JavaScript 或 CSS 文件一样。


    然后，页面就连接到了这些你可以使用的海量方法。


    假设我们想要增强页面上的某个 DIV 而不是页面其他任何部分，例如，你想在网页上创建一个带有动态数据的框。


    在链接到库之后，我们只需要对该 DIV 应用一个 `directive`（指令）。该指令是 `ng-app`，它使这个 DIV 变成一个由 AngularJS
    控制的应用程序。`ng-app` 指令告诉 AngularJS 需要扫描此 DIV 以可能的 AngularJS 功能。我们稍后来看它是如何工作的。


    如果我们希望对整个页面进行扫描和映射，我们将相同的指令应用到 HTML 标签上，而不是应用到 `DIV`。实际上，任何可以作为容器的 HTML 标签都可以变成一个
    Angular 增强元素，而完全不会影响页面的其他部分。我们可以使用段落标签、表单标签或有序列表。但在大多数情况下，AngularJS 是如此友好的，我们我们并不介意将其关联。

