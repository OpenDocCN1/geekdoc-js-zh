    `statement` 结尾的分号告诉 JavaScript 你已经完成了变量的声明：


    ```

    var phoneBill; own

    ```


    分号充当命令终止符 `terminator`，或者两个不同且独立命令之间的分隔符。换句话说，我们正在指示 JavaScript 停止并将该命令或表达式保存为一条独立于下一个即将出现的指令的独立指令。


    回到变量名，


    **记住这一点：** JavaScript 是区分大小写的。`A` 和 `a` 在 JavaScript 中具有独立的含义。`phoneBill` 和 `phonebill`
    不是同一个单词。此时，`phoneBill` 是一个已声明的变量，而 `phonebill` 则什么都不是。如果你不小心写了 `phonebill` 而不是
    `phoneBill`，JavaScript 将抛报错，因为你声明的是变量 `phoneBill` 而不是 `phonebill`。


    当然，我们也可以拥有两个独立的变量，一个命名为 `phoneBill`，另一个命名为 `phonebill`，这对于 JavaScript 来说，它们是两个不同的单词。


    ### 给变量添加数据


    一旦声明了变量，就会为该变量预留一个内存位置，然后我们就可以将数据赋值给该变量。


    难道记住 `phoneBill` 不比画一张预留内存位置的手写地图更容易吗？


    要将数据赋值到变量中，我们使用 `=` 运算符：


    ```

    phoneBill = 200;

    ```


    不要在 200 之前使用 `$`。那会触发错误。如果你愿意，稍后输出数据时可以使用 `$`，但在将数据输入计算机内存时不能使用。JavaScript 想要的只是纯形式的数字
    200。


    我刚刚将数字 200 保存在了一个名为 `phoneBill` 的内存位置中。注意末尾的分号。它终止了我的 `statement`。


    我们可以在一步到位内完成声明并包含数据：


    ```

    var utilitiesBill = 400;

    ```


    有时，我们只想让 JavaScript 在某个名称下预留一个位置。有时，我们一次性预留位置并填充数据。不要担心所需的内存大小。与其他语言不同，JavaScript
    是动态的：它会自动调整内存。


    ### 修改变量中的值


    如果我们想将 `phoneBill` 的值从 200 更改为 150 怎么办？


    要更改变量的值，我们做的只是重新赋值（不需要再次声明）：


    ```

    phoneBill = 150;

    ```


    200 被删除了，`phoneBill` 位置的计算机内存现在持有值 150。


    - **记住：** 永远不要在同一个变量名上使用两次 `var`。如果你在重写现有变量时使用 `var` 作为前缀，你将覆盖旧变量，因为你再次声明了该变量。这可能是你故意想做的，但在大多数情况下，这不是常见的做法。我见过很多新程序员反复犯这种错误。


    ### 给变量添加单词而不是数字


    到为止，我们一直在给变量赋值 `type number` 类型的数据。实际上，我们可以给变量赋值任何内容。


    由于变量只是一个内存位置，我们也可以给它赋值字符字符串 `string`（也称为 `string` 类型的值），甚至可以是其他类型的数据，如 `arrays`、`functions`、`objects`
    等……关于这些内容稍后会详细介绍。


    ### 让我们聊聊字符串


    字符字符串可以赋值给变量，但我们需要让 JavaScript 知道它是字符串。我们让它知道的方法是将字符串包裹在引号 `quotes` 中：


    ```

    var myName = "Tony";

    ```


    任何未包裹在引号中的单词都被视为存储在 JavaScript 库中的 `reserved` 保留术。


    - 如果我只写 `var myName = Tony;`（字符串 ''Tony'' 没有加引号），JavaScript 将检查计算机内存中的库，寻找一个名为
    `Tony` 的命令或变量。由于 `Tony` 并不是一个保留术，JavaScript 将在屏幕上报错。任何 `word data` 都需要包裹在引号中。


    在我们声明变量 `myName` 后，单词 `myName` 就会变成一个保留术，直到它从内存中被擦除或程序结束。变量名不需要引号。


    - **记住：** `string` 类型的数据需要包裹在引号中，而声明的变量名**永远**不要写在引号中。


    我说“记住这个”时，并不是让你去背它。它只是意味着对即将出现的语句额外关注几秒钟。


    ### 使用哪种引号：单引号还是双引号？


    在 JavaScript 中，单引号或双引号的作用是相同的。只需确保结束引号与起始引号样式匹配即可。其他某些语言在单、双引号下的表现不同；但 JavaScript
    不是。


    在下面你将看到另一个同时进行变量声明和值赋值的示例。你会看到组合引号是很有用的。我以单引号开头，后面跟着双引号。然而 JavaScript 忽略了双引号，因为它知道结束引号必须是单引号才能匹配起始引号：


    ```

    var quoteOfTheDay = ''*living is not essential; creating is essential*" - Fernando
    Pessoa'';

    ```


    - **记住：** 永远不要将变量名包裹在引号中。如果你这样做，你就将名称转换成了字符串。我的意思是，对于 JavaScript 来说，`quoteOfTheDay`
    和 `"quoteOfTheDay"` 的意义并不相同。第一个存储在 JavaScript 临时库中的声明变量。后者只是一个普通的字符串。JavaScript
    不会将其映射到分配 `quoteOfTheDay` 的内存位置。


    我们已经看到如何为变量重新赋值新值：


    ```

    phoneBill = 600;

    ```


    现在，`phoneBill` 不再是 150。它持有值 600。


    **将一个变量赋值给另一个变量呢？**


    它的工作方式与赋值普通值相同：


    ```

    phoneBill = quoteOfTheDay;

    ```


    *注：没有使用引号，因为这两个单词都是之前声明过的变量。实际值（一个字符串值）被传递到变量 `quoteOfTheDay` 内部。


    - **记住这条规则：**


    赋值从 `right` 到 `left` 执行。右侧的内容赋值给左侧的操作数。


    `phoneBill` 的值现在从数字 600 更改为字符串 `"living is not essential; creating is essential"
    - Fernando Pessoa`。


    基本上，JavaScript 将字符串值从 `quoteOfTheDay` 复制到了 `phoneBill`。现在我们在两个不同的内存位置中拥有两个相同值的字符串。这种复制并不总是成立，正如我们稍后看到的。复制只发生在
    `primitive` 数据类型上，如数字和字符串当我们重新赋值复杂数据（如 `arrays` 和 `functions`，也称为 `reference`
    类型）时，我们并没有复制数据；只是让这两个变量指向相同的数据。但这是一个高级概念。现在，当我们把一个包含简单数据的变量赋值给另一个变量时，只需认为是在复制变量
    `values` 即可。


    ### 1.4 实验 1


    *准备好做一些实验了吗？*


    ### 打开控制台

