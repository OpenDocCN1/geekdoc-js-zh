    1- On your Console declare the following array:\n\n**var x = [\"blue\",\"red\"\
    ,\"green\",\"violet\",\"brown\"];**\n\n2- Delete 3 items starting at positions\
    \ 0 which is *blue*.\n\nExclude from deletion position 3, which *violet*: **x.splice(0,3);**"
