    ## 4 调用函数 `test2` 并查看这些数字（3,5,15,21）的每一个结果：


    ```

    test2(3);

    test2(5);

    test2(15);

    test2(21);

    test2(11);

    ```

    等等。


    函数的输入参数充当临时内部变量。这非常有用，因为我们可以将数据发送到函数中进行处理。这就是我们在 `test2()` 函数`调用` 期间发生的情况。


    一旦我们掌握了函数的基本语法，就可以开始创建一些非常酷的东西。


    函数对你来说可能仍然很困惑。我将在我们编码的过程中涵盖所有的基础知识。这并不是一个困难的话题，但需要按照正确的顺序来处理。


    ### 什么是函数调用？


    一图胜千言：


    ![](img/00008.jpeg)


    图 8 (查看原始文件：[在此处](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/
    )。 bit.ly/1raw6pT


    观察图 8，在左下角，我们正在调用函数 `addTen()`，并将值为 4 的参数 `data` 传递给函数参数 `n`。


    然后 4 将成为参数 `n` 的临时值，并执行 `10 + 4` 之和。


    最后，`return` 机制导出结果，即数值 14。


    我们本可以使用 `console.log(n + 10)`，但 `console.log` 会在屏幕上显示该值，而不会将其从函数导出。换句话说，我们无法在函数外部使用数字
    14，因为 `console.log()` 不导出数据，它实际上是将所有内容作为 `string` 值显示在屏幕上，即使它看起来像一个数字。


    所以，`return` 是函数中一个非常重要的机制。。实际上，它是函数固有的特性。我们不能在函数外部使用 `return` 命令。JavaScript 不允许这样做。


    ### `return` 的目的是什么？


    `return` 的目的有两个：


    a) 以原始形式从函数内部导出数据。


    b) 停止并结束函数调用。这非常重要。`return` 机制充当了中断的作用并结束了调用函数的行为。函数中 `return` 语句之后编写的任何内容将不会被处理，因为
    JavaScript 在返回时会退出函数。函数返回后，函数调用将从工作内存中擦除。你现在不需要担心这一点，但最好知道函数调用不会永远留在内存中。它们通过让路来释放空间。这可能是将代码包含在函数内部的第三个原因：内存效率。


    ### 函数返回时数据会发生什么？


    如果我们想重用数据进行进一步处理，我们需要捕获`返回`的数据。否则，它就会消失在空间。


    *我们如何捕获从函数返回的数据？*


    捕获它的方法是将返回的值赋值给变量。换句话说，将`函数调用`赋值给变量。


    在图 8 的示例中（见图像下方的链接），不仅仅是调用函数：


    ```

    addTen(4);

    ```


    我们可以将其赋值给某个变量：


    ```

    var y = addTen(4);

    ```


    现在 `y` 持有值 14。函数调用已从内存中擦除，但值被变量 `y` 保留了。


    *   **总结来说**，如果我们需要在脚本后续使用来自函数的数据，则需要将其 `return` 并赋值给变量。当我们通过 `console.log()`、`alert()`、`prompt()`
    或 `confirm()` 从函数输出数据时，我们只是在显示它，而不是保留它。


