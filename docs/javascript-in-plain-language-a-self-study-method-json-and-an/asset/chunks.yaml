    ## 2.5 填写表单请求循环


    循环是一个[子程序](http://en.wikipedia.org/wiki/Subroutine)，它会不断重复执行一组编程指令，直到接收到*停止*命令为止。


    我们已经见过如何创建一个函数，用于存储每次调用该函数时都会运行的代码。


    我们也可以将代码存储在循环中，让它按照指定的次数重复。这样，如果我们想随时复用该循环，就可以将其插入函数中，并在以后任何时候调用该函数来运行循环，而无需重新编写另一个循环脚本。


    *   注意无限循环。


    务必确保你设计了一种停止循环的方法。这应该是你创建循环时的首要决定：**这个循环何时以及如何结束？** JavaScript 只有在内存耗尽时才会结束它。我们必须指令
    JavaScript 比此早得多结束它！


    *   如果在测试过程中遇到麻烦，点击通用键序列 `CTRL c` 停止程序。大多数情况下它会停止。


    我们希望循环重复多少次？一次、五次、一百次，或者直到某个条件发生，例如某个变量的值不再原始值。


    这些听起来都很抽象，对吧？让我们去掉这些抽象性。


    ### 关于循环的真相


    我们并不是真的自己创建循环。这种机制已经存在于浏览器 JavaScript 库中，并以多种样式存在（for 循环、while 循环、do while 循环等）。


    我们需要做的是为某种特定的*循环样式*填写申请表，然后为 JavaScript 提供指令，告诉我们在循环运行时希望它完成什么。


    是的，JavaScript 库中有几种样式的循环。它们都是循环的，但它们循环的方式会影响你对*循环样式*的选择。


    一种常见的样式是 **for 循环**。*for 循环*会按照指定的次数重复。


    然后我们有 **while 循环**。*while 循环*在条件仍然为真时重复执行。如果该条件始终为真，while 循环将永远运行。有时我们希望循环永远运行，比如当计算机扫描键盘等待人类按键时。如果人类在短期内不按键，while
    循环将继续扫描。不要担心内存，因为这种扫描并不占用多少内存，它只是像夜夜兵一样在四处张望。


    JavaScript 库中还有一种名为 **do while** 的循环样式。*do while* 循环与普通的 *while* 略有不同。*do* 部分让它无论条件真假都会运行一次。


    为什么 *do while* 循环至少运行一次呢？因为循环的 *while* 条件部分只出现在脚本的末尾。所以 JavaScript 会先运行循环，然后在结束时检查条件以判断是否应该运行第二次。这就像是在说“*先开枪后问路*”。


    * 记住：为了使用循环，我们必须填写循环样式申请单。


    我们将在适当时候介绍所有这些样式的循环。现在我们来谈谈 *for 循环*。


    不要为了试图记忆你尚不需要的东西而耗尽大脑。这只是一个简短的介绍。现在让我们通过创建循环项目来大干一场吧。


    ## 2.6 for 循环


    我们将学习如何以“*for 循环*”的形式填写循环的“申请表”，因为它将用于我们的下一个实验项目。


    *for 循环*的想法是按指定的次数重复。


    基本的表单声明包含头部和正体，如下方的[伪代码](http://en.wikipedia.org/Pseudocode)代码所示：


    ```

    for (x starting at zero; and for x less than 5; increment x) { execute this code
    }

    ```


    ![](img/00009.jpeg)


    图 9


    在这个表单中有三个需要求值的指令，因此用分号分隔了前两个指令（以使它们相互独立）。


    ***for x 从零开始;***


    在这里，JavaScript 将 x 存储为一个值为零的临时变量。名称 *x* 并不重要，大多数程序员使用使用名称 *i* 代替它。正确的脚本是：


    ```javascript

    for(var x = 0; *or for (var i = 0; etc...

    ```


    ***并且 x 小于 5;***


    此时 JavaScript 评估此条件。由于 x < 5（因为它是 0），该条件为*真*，JavaScript 执行正体中的代码一次。正确的表达式是：


    ```javascript

    x < 5;

    ```


    ***递增 x*** ++


    在 JavaScript 第一次运行代码块（步骤 3）之后，它返回 *for 循环* 声明并增加 *x* 的值（步骤 4）。现在 *x* 是 1 而不是 0。正确的递增脚本是：

