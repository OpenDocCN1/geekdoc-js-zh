    ### 创建一个将华氏度转换为摄氏度的程序


    运算符[优先级](http://en.wikipedia.org/wiki/Order_of_operations)决定了运算符求值的顺序。JavaScript
    的优先级接近数学优先级：


    * 括号在乘法或除法之前求值

    * 乘法或除法在减法或加法之前求值

    * 在相等的情况下，操作数从左到右从括号内部向求值

    * ……不需要记忆，只需大量练习。


    以下是将华氏度转换为摄氏度的公式：


    从变量 `F` 中减去 32，

    然后将结果乘以 5，

    然后将新结果除以 9。


    我们需要将减法放在括号内，以便它先执行。然后接着写乘法，以便它在最后的除法之前执行，最后的除法应该放在它的右侧。公式看起来如下：


    `(f - 32) * 5 / 9`


