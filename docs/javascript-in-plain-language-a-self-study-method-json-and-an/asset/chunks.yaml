    其他编程语言并不具备这种能力，它们需要运行在特殊的平台上，这些平台作为浏览器的进一步接口，并且它们需要 JavaScript 来协助完成这种交互。这就是为什么
    JavaScript 成为[互联网](http://en.wikipedia.org/wiki/Internet)上最流行的编程语言的原因。计算机使用它，网站使用它，其他软件（例如
    Photoshop、Word、PDF）使用它，最后但同样重要的是，计算机服务器开始在其后端处理中使用它，这对于 JavaScript 的未来是一个巨大的好消息。


    如果学习方法正确，JavaScript 可以是一门很容易的语言，但它也可能是一门很难学习的语言，因为它非常动态，规则会根据实际情况而变化。


    没有人能保证教好 JavaScript，因为学习是一个个人经历。但我可以向保证：按顺序阅读这本书，思考每个概念而不是死记硬背，完成所有练习，当你读完这本非常短的书时，你会成为一名更出色的程序员。


    作为作者，我可能是一个程序员或技术文档工程师，但最重要的是，我是一名技术导师。我的写作经验来自于对成千上万名学生的教学、指导和代码调试。当我编写这些概念时，我总是会想起我学习这些材料时的挣扎，以及看到其他学生在寻求帮助时的那种困惑。当我写作时，这些问题就会浮现出来，我会尝试提前解决它们，以防止掉进常见的陷阱。


    ## 1.2 需要的材料和工具


    书中的所有练习将使用 Google Chrome 浏览器的 JavaScript 控制台进行测试。偶尔我也会使用 `Opera`，它的工作原理类似。请随时使用你喜欢的任何测试控制台，因为每个浏览器都有一个。Firefox
    也是一个很好的替代方案，但我发现另外两个选项对于初学者来说更整洁、更容易编码。


    如果你的电脑上没有这些浏览器，可以从下方提供的链接下载。我建议两者都使用。Google [Chrome](https://www.google.com/intl/en/chrome/browser/)
    | [Opera](http://www.opera.com/computer/)


    1. 要访问控制台，加载你的 Chrome 浏览器或 `Opera`，然后按下以下组合键序列：


    对于 Windows 系统：`CTRL SHIFT j`


    对于 Mac：`CMD OPT j`


    这将弹出控制台。


    2. 如果这是你第一次使用控制台，可以通过点击控制台左下角显示的`小方块`（在最新浏览器中，此按钮似乎在右上角）将控制台从浏览器分离。分离控制台将为你的屏幕留出更多空间，因为你可以在最小化浏览器的同时保持控制台开启。


    3. 确保控制台顶部的标签设置为 `console`，而不是其他任何可用选项。


    4. 当你第一次打开控制台时，可能会看到几条错误信息。这是正常的。只需右键点击并选择 `Clear console` 即可清除屏幕。


    现在让我们再读几页并在脑中编码。几分钟后进入实验室章节时，我们将进行一些`实践`。


    ## 1.3 声明变量——内存位置的别名


    **基础信息：**


    浏览器使用计算机内存。计算机内存越大，浏览器运行得越快。由于`工作内存`是有限的，程序需要通过删除过期数据和重新定位仍在使用的数据来不断调整内存中的数据。


    当我们用 JavaScript 编程时，我们将数据存储在内存中。这些数据是短暂的，因为一旦关闭浏览器或结束程序，数据就会被清除。


    为了在内存中临时存储数据，我们需要用人类单词标记内存地址，这样我们就可以编写或操作这些数据。我们不能仅仅通过给浏览器 [0x7fffffff](http://en.wikipedia.org/wiki/Physical_address)
    地址就让它在内存中存储字符串“hello world!”。那些日子早已过去了，因为那样太复杂、不实用，而且由于自动内存重排，数据会在不同位置之间移动。因此，为了解决这个问题，我们使用名称作为分配位置的`别名`，并允许计算机根据需要管理数据的真实物理地址。


    这些内存位置的`别名`被称为`变量`。它们之所以被称为变量有两个原因：数据的地址可以在不经通知的情况下更改，而且每个变量中包含的数据也可以随时更改。保持不变的是变量名，它是人类与这块内存资产之间唯一的纽带。


    至于变量中值的更改，可以通过程序员在脚本指令的后续手动完成，也可以由 JavaScript 自身在值的动态重新赋值中自动完成。


    *   **记住这一点：**要创建一个内存变量，我们必须对其进行`声明`（声明变量就像向 JavaScript 引入变量）。示例：


    ```

    var phoneBill;

    ```


    （*只需跟着读即可。当我们到达章节末尾的实验工作部分时，你将有机会自己尝试。所有章节都刻意保持得很短。这是阅读并从概念上理解的时间。然后你将在实验室进行自我测试。所有实验练习后都附有答案，以便你双重检查工作*）


    ### 关于 var


    将 `var` 视为用于创建变量的命令（这有助于你记住在引入变量时使用 `var`）。


    `var` 做的另一件事是将变量固定到它被引入的位置，在某种程度上使其成为局部变量（稍后会详细介绍）。


    ### 关于变量名


    在编写 `var` 之后，我们提供变量 `name`，在我们的案例中是 `phoneBill`。名称并不重要，它可以是 `x`，因为 JavaScript
    不关心我们选择的含义。


    然而，JavaScript 关心我们使用的字符。确保第一个字符是字母表的小写（小写不是强制的，但是一个良好的习惯，稍后你会看到）。变量不能以数字或符号开头。随后的字母可以是数字，但永远不允许使用符号，划线
    `_` 除外。


    *   总结：始终让你的变量名以小写字母开头。忘记将划线作为开头字符，因为它通常用于特殊情况，因此不应考虑用于正常用途。


    我自己的变量 `phoneBill` 在中间有一个大写的 B。这是一种编写变量名的常用样式。JavaScript 不关心样式，但在检查脚本时，这确实让肉眼更容易观察。


    另一种流行的命名方式是使用划线来分隔变量名中每个单词的“人类含义”。使用划线的原因是因为变量名中不允许出现空格或连字符：`phone_bill`


    *   **记住这一点：**“单词的含义”仅供人类消费。如果我们不是引入 `phoneBill` 而是引入了 `x`，JavaScript 会接受它而不会抱怨。当我们编程时，既是为了让计算机理解，也是为了让人类理解，以便他们以后进行故障排除或更新程序。选择你自己的变量编写样式并坚持下去。*一致性非常重要*。然而，要熟悉所有常用样式，因为当你团队中工作时，你需要适应整个团队约定的通用样式。练习灵活性。


