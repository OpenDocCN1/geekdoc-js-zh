  trans: "\n几乎所有现代浏览器都内置了 `test` `Console`（控制台），用于帮助我们调试或实验 JavaScript。一旦打开，所有的控制台\
    \ 提供的选项基本上是相同的。最大的区别在于我们访问 `Console` 的方式以及 `Console` 在屏幕上的外观。\n\n选择以下浏览器之一。如果你的电脑上没有安装，请下载它。使用这些浏览器之一是为了确保在我们使用自带的\
    \ JavaScript `Console` 编写代码时，我的指令可以与你的操作保持一致。如果你愿意，也可以使用任何其他 `Console`，但访问方式可能不同。\n\
    \n[Google Chrome](https://www.google.com/chrome/browser/)。\n\n[Opera](http://www.opera.com/)。\n\
    \n打开这两个浏览器之一，然后按下按键序列打开控制台：\n\n1- 如果你正在使用 Windows 或 Linux：\n\n`CTRL SHIFT j`\n\
    \n如果你在 MAC 上：\n\n`CMD SHIFT j` 或 `ALT-CMD-j`\n\n屏幕底部可能会弹出一个窗口。\n\n2- 确保选中了 `Console`\
    \ 标签页。\n\n如果你收到任何 `error`（错误）消息，只需在白色区域`右键点击`并选择“Clear Console”（清除控制台）来清除屏幕。每次打开控制台时几乎都会出现这些错误，因为\
