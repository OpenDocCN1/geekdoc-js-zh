    \ 给变量 `z` 分配一个`number`数字（任意数字）。\n\n*   **NOTE：** 数字不需要引号。如果你给数字加上引号，它就会变成字符串，你无法对它进行任何计算。\n\
    \n11- 为了进一步练习，自己声明一些新变量，为它们分配数据并检查它们的值类型。\n\n就像任何其他语言一样，学习 JavaScript 的唯一方法就是每天练习。记忆是不行的；纯粹的练习才能成功并持久。\n\
    \n## 1.5 操作变量数据\n\n当我们在 JavaScript 监管下将值存储在计算机内存中，这个值继承了它所代表的数据`type`类型的特征某些*properties*属性和*methods*方法。\n\
    \n***这些属性/方法来自哪里？***\n\n它们存在于你浏览器中的 JavaScript 库中。当我们为其中一种类型创建一个新实例时，我们的实例会立即继承许多可以使用的工具，帮助我们实现输出结果。\n\
