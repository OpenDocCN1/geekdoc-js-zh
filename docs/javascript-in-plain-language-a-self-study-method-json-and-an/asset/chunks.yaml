- fmt: "\nYou can do any possible outcome by using the above powerful combination\
    \ of `if`, `elses`.\n\nSometimes however, a different kind of branching makes\
    \ more sense. I’m talking about the one known as `Switch` and I just want to make\
    \ sure it is explained in case you need to use it.\n\nIt is called `switch` because\
    \ there are several possible outcomes from which JavaScript makes an executable\
    \ decision. These possible outcomes are all in `off` state, and JavaScript will\
    \ turn one `on` based on a matching Boolean condition, as we you’ll see next.\n\
    \nHere’s the layout diagram:\n\n![](images/00016.jpeg)\n\nFig 16\n\nOn line 1\
    \ we declare a `switch`. This switch function method takes a condition from which\
    \ JavaScript will compare all the outcomes in order to select one of the possible\
    \ executions.\n\nIn our generic example (based on the cases we have), the “condition\
    \ to match” should be substituted by either a `1`, `2`, or `3`, so it matches\
    \ one of the cases presented. If any of these cases matches the condition, JavaScript\
    \ executes the code given by the `case`. The Boolean `true` is what unlocks the\
    \ `case`.\n\nExample: if the correct case is 3, JavaScript will ask:\n\n“is it\
    \ 1? Ans: false”,\n\nis it 2? Ans: false”,\n\nis it 3? Ans: true”, run the code,\n\
    \nBREAK and END.\n\nAfter the execution of a `case`, JavaScript exits the `switch`\
    \ due to the `break` command that follows. If we don’t include the `break` command,\
    \ then JavaScript will search for more possible results and you may have several\
    \ correct answers instead of just one. And even if there are no other correct\
    \ answers, JavaScript still reads all the other conditions which could be a time\
    \ delay if the switch has thousands of possibilities programmed in it. So the\
    \ `break` is a very important implementation.\n\nWhenever there are no conditions\
    \ that match, the optional `default` takes over as the final and `true` option\
    \ and its code is executed. Notice that I did not include a `break` after `default`.\
    \ You could, but it is not necessary because JavaScript exits the switch at this\
    \ time anyway. \n\nFor further reading please visit [this post](http://jsplain.com/javascript/index.php/Thread/20-How-does-a-switch-statement-work-in-JavaScript/)\
    \ | bit.ly/1r4XRCL on the `forum`. Let’s practice a bit with switches.\n\n## 3.6\
    \ Lab work 13\n\n### 13a: Switch - using Boolean matches\n\nThis script will employ\
    \ a `switch` with 4 possible outcomes. The user will try to guess a number, and\
    \ the program will display a feedback message of either, `too low`, `too high`,\
    \ `right!` or `That’s not a number`:\n\n1. Create a `switch` inside of a function\
    \ named `guessNum`.\n2. This function takes one input parameter, `num`.\n3. The\
    \ `switch` should be hard wired to `true`.\n\nExample: `switch(true)`\n\n4. The\
    \ `cases` should have the following conditions:\n- `num <= 3` displays \"too low\"\
    \n- `num >= 5` displays \"too high\"\n- `num === 4` displays \"right, the number\
    \ was 4\"\n- for `default` use \"*That's not a number*\"\n\n5. Call the function\
    \ by passing a numeric argument like for example:\n```\nguessNum(2);\nguessNum(7);\n\
    guessNum(4);\nguessNum(\"a\");\n```\n\n- For a quick peek or further explanation\
