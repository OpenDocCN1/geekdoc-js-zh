    *phoneBill*. The name does not matter, it could have been called ***x*** since
    JavaScript does not care about the ‘human meaning’ we choose to give it.


    However, JavaScript cares about the choice of characters we use. Make sure the
    first character is a lowercase letter of the alphabet (the lowercase is not mandatory,
    just good practice as you will see later). The variable cannot start with a number
    or a symbol. Subsequent letters can be numbers, but symbols are not allowed, ever,
    except for the underscore _.


    *   In summary: always start your variable names with a lower case letter. Forget
    about the underscore as the first character because it is usually used in very
    special situations and therefore should not be considered for normal usage.


    My own variable *phoneBill*  has a capital B in the middle. This is a common style
    of writing variable names. JavaScript doesn’t care about styles, but it does make
    it easier for the human eye when it comes to inspect the script.


    Another popular way of writing names is with an underscore separating the ‘human
    meaning’ of each word in the variable name. The reason for the underscore is because
    spaces or dashes are not permitted in variable names: *phone_bill*


    *   **Remember this:** The ‘meaning of a word’ is only for human consumption.
    If instead of introducing *phoneBill* we introduced just ***x***, JavaScript would
    have accepted it without complaining. When we program, we do it both for the computer
    to understand and also for a human to understand so that he/she can troubleshoot
    or update the program later. Choose your own style of writing variables and stick
    to it. *Consistency is important*. However, become familiar with all common styles
    because when you work in a team you need to adjust to an agreed common style for
    the whole team. Practice flexibility.


    ### About the semicolon ;'
