  trans: "\n这被称为`引用传递数据`。这里没有复制；这些变量只是指向同一数据。如果我们删除了其中一个变量或将其赋值为其他内容，数据仍然保持不变，因为还有另一个变量在原地持有它，就像气球发生的情况一样。\n\
    \n### 函数是闭合的结构\n\n在 JavaScript 中，函数是唯一的[数据结构](http://en.wikipedia.org/wiki/Data_structure)能够保护其数据免受外部世界的影响。\n\
    \n这意味着什么？\n\n这意味着如果我们在函数内部声明一个变量，它无法从全局作用域（函数外部）可见。\n\n如果我们把全局作用域与外部世界进行比较，全局作用域本身也是一个内部作用域，例如不同标签页上的另一个网页。我们在网页上进行的所有操作都是在封装整个页面的\
    \ `window` 对象下进行的。这与微软的 Windows 名称没有关系。这里的 `window` 指的是显示页面的浏览器外壳，在任何计算机系统中，它都被称为\
    \ `window`。\n\n对于网页而言，`window` 对象就是页面的外部世界或`全局作用域`。在 `window` 对象下声明任何内容都是 `window`\
    \ 对象的属性或方法。\n\n我们实际上可以认为 `window` 对象是一个创建其内部所有其他内容的函数。\n\n当我们声明一个变量时，例如：\n\n```\n\
    var x = 33;\n```\n\n我们在全局作用域中创建了这个变量，这意味着变量 `x` 的父级是 `window` 对象。要调用这个变量，我们写道：\n\
    \n```\nx;\n```\n\n它会显示 33。但我们也可以像下面的示例那样调用它，效果是一样的：\n\n```\nwindow.x;\n```\n\n\
    通过使用点符号语法，我们确保调用的是正确的变量 `x`，而不是来自“遥远星系”的其他 `x`。在大多数情况下，`window` 是被理解的，我们不需要写出它，正如我们在整书中看到的那样。\n\
    \n那么，那些不同的星系又是什么？你可能会问。\n\n还记得我说我们可以把 `window` 对象看作一个巨大的函数，它将所有的网页功能都包含在内部，并保护它们免受其他网页的影响吗？\n\
    \n嗯，我当时没有完全那样说的，但它的作用目的是每个函数都充当其自身数据的保护性父级。在 JavaScript 中，函数是闭合的数据结构。\n\n我们实际上可以在函数内部声明另一个变量\
    \ `x`，因为 JavaScript 会接受它而不会产生冲突，即使知道已经有一个声明为全局变量的 `x`。这是因为全局作用域看不到函数内部的 `x`。\n\
    \n然而，函数可以看到外部变量 `x`。没错！函数可以访问全局变量，因为函数是它们的兄弟关系。函数可以看到外部变量世界，但外部世界看不到函数内部的内容。函数的兄弟姐妹可以看到该函数，但它们看不到函数内部的东西。好消息是，JavaScript\
    \ 总是会选择被调用的最接近的标识符。我的意思是，如果我们在函数内部调用 `x`，JavaScript 将捕取第一个看到的 `x`，即函数内部的那个。所以，即使函数外部有另一个\
    \ `x`，并且知道函数有权访问它，但只要我们从函数内部引用 `x`，内部的 `x` 始终是 JavaScript 的首选。\n\n例如：\n\n```\n\
    var x = 33; var test = function(){\n  var x = 5;\n  return x;\n};\n```\n\n调用函数\
    \ `test`：\n\n```\ntest();\n```\n\n它返回 5。\n\n那么，如果我们想在函数内部使用外部 `x` 的值，我们该如何引用外部的\
    \ `x` 呢？\n\n会考虑到 `window.x`。\n\n我们接下来将看到如何从函数内部访问全局的 `x`。\n\n### “This” 作为对象占位符\n\
    \n如果我们想返回外部变量 `x`，而不是像上一个示例那样返回内部 `x` 呢？\n\n在这种情况下，我们必须使用点符号语法来引用全局的 `x`：\n\n\
    ```\nvar x = 33; var test = function(){\nvar x = 5;\nreturn window.x;\n};\n\n\
    test();\n```\n\n现在它返回 33，这是外部的 `x`，而不是内部值为 5 的变量。这是因为 `window.x` 指的是全局变量 `x`，它是\
    \ `window` 对象的子级。\n\n由于 JavaScript 是动态的，而且由于我们应该编写尽可能可移植的代码（适用于任何对象，而不只是 `window`\
    \ 对象），程序员们想出了一个通用占位符，用来正确引用当前调用变量的对象。\n\n这个占位符就是单词 `this`。\n\n如果我们把表达式 `window.x`\
    \ 替换为 `this.x`，在执行时 JavaScript 将搜索拥有所调用属性的对象，并将占位符 `this` 替换为正确的名称，在我们的案例中就是 `window`\
    \ 对象。\n\n但你可能会问，函数 `test` 不也是一个对象吗？如果是，那么 `this.x` 的所有者不是函数本身，而是 `window` 对象吗？\n\
    \n并不是 true（但这是一个好问题）。调用函数 `test()` 这一行为的所有者是谁？\n\n答：`window` 对象拥有 `test()` 命令。\n\
    \n现在如果函数 `test(){}` 是其他对象内部的方法，那么 `this` 就不再代表 `window` 了，它将代表另一个对象。\n\n作为一个例子，请看这个示例：\n\
    \n```\nvar x = 33; var myObject = {\nx: 7,\ntest: function () {\nvar x = 5;\n\
    return this.x;\n}\n};\n```\n\n在这里，我们有一个值为 33 的全局 `x`，一个属于 `myObject` 值为 7 的 `x`，以及函数内部一个值为\
    \ 5 的 `x`。\n\n当我们调用方法 `test()` 时：\n\n```\nmyObject.test();\n```\n\n它打印出 7，这是第二个\
    \ `x`，它属于 `myObject`。`window` 不再是 `this.x` 的直接所有者，因为 `myObject` 是。我之前强调过 `this`\
    \ 是“在执行时”赋值的，不仅是因为替换发生在执行时，还因为拥有属性的对象可能会从属性声明的时间到属性被调用的时间发生变化。JavaScript 是一种动态语言，我们需要对什么是动态的的假设保持谨慎。在我们编写更多脚本时，我们将看到所有权的发生以及如何处理每种情况（想了解更多内容，请阅读\
    \ [JavaScript Objects and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Arrays-Explained/dp/B00GPBZQ/)）。\n\
    \n这里是用更可移植格式编写的原始函数，其中 `this` 替换了 `window`：\n\n```\nvar x = 33;\nvar test = function(){\n\
    \  var x = 5;\n  return this.x;\n};\n\ntest(); // 返回 33 而不是 5\n```\n\n## 3.4 实验\
    \ 12\n\n### A 部分：表达式、语句、参数\n\n（我的答案链接将发布在页面末尾。你实际上可以导航到论坛来作答问题，因为在点击单个答案按钮之前答案是见的。）\n\
    \n让我们回顾一下在本节中涵盖的概念。请在查看我的答案之前尝试回答所有问题。\n\n通常，*表达式*是 JavaScript 总结成一个单元的东西，而*语句*是一个表示命令并以分号终止的完整句子。\n\
    \n1- 在下面的示例中，哪些是表达式？哪些是语句？\n\n```javascript\nif(10 < 11) {\n  console.log(\"I\
    \ love JavaScript\");\n}\n```\n\n2- 在接接的函数赋值中，变量 `addTwo` 的值是什么？带后缀括号的 `addTwo()`\
    \ 的值是多少？\n\n```javascript\nvar addTwo = function (){\n  return 3 + 2;\n};\n```\n\
    \n3- 在上述源码的声明中，`addTwo` 的哪个部分被称为***匿名***函数？\n"
