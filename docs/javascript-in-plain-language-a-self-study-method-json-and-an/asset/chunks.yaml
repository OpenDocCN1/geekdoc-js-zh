    \ customs.\n\nIn arrays we use a regular *for loop* and with objects we use a\
    \ *for **in** loop* which is a for loop preconfigured to print out label names\
    \ and with no length value declaration necessary.\n\nIf you want further practice\
    \ visit the new forum as I will expand the subject there. Also my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ has many real life exercises to drill and expand this subject.\n\nEND OF LAB\n\
    \n# PART III: STRENGTHENING THE WARRIOR'S ARSENAL\n\n*JavaScript is an instrument\
    \ that needs to be played*.\n\n## 3.1 Taking an inventory of what we’ve learned\n\
    \nGive me 5 minutes and I’ll tell you everything I know!\n\nSometimes it feels\
    \ like that, right?\n\nWell, we have covered quite a lot:\n\nThe purpose of ***variables***;\
    \ The type of data assigned to variables; How we introduce a variable name to\
    \ JavaScript by prefixing it with ***var***; How a simple variable data known\
    \ as a *primitive* value is stored in the same location as its variable name,\
    \ as opposed to complex variables known as *reference* variables, which are stored\
    \ on a separate memory location than the variable name that points to them...\n\
    \nWe have seen how a *data structure* such as an ***array*** acts as a numerically\
    \ indexed list of items, and how to use the ***for loop*** to traverse (scan)\
    \ the array and manipulate each one of its elements based on the *array.length*\
    \ property.\n\nWe have used ***push()*** and ***unshift()*** to  insert new items\
    \ into an array, and ***pop()*** and ***shift()*** to remove items from the array.\n\
    \nWe have also experimented with ***splice()*** to remove, replace or add new\
    \ items into any specific location of an array, and how we can copy a whole section\
    \ of the array into another array by using ***slice()***.\n\nWhat about *sorting*\
    \ arrays with sort()? And how to use ***join()*** to convert an array into a string.\n\
    \nLast but not least, we have seen how ***indexOf()*** can be useful to find the\
    \ location number of a certain item, or to check if the item has already been\
    \ inserted in the array.\n\nSo much we’ve learned in such a short time!\n\n**What\
    \ about objects?**\n\nWe know that almost everything in JavaScript is an object\
    \ of some sort, but normally we refer to objects when we talk about ***unordered\
    \ lists***, those lists indexed by key labels.\n\nThe items in an object, which\
    \ are called *properties*, can be addressed by either *dot* syntax or by *bracket*\
    \ syntax. Some of the properties are called *methods* because they represent functionality\
    \ and functionality involves at least one function mechanism.\n\nThe ***for in\
    \ loop*** is a variation of a *for loop* specifically created to traverse over\
    \ objects. The temporary counter variable serves to dynamically store the key\
    \ names of each property so that we can manipulate the data, such as printing\
    \ to screen.\n\nWe know that *dot syntax* does not work with **dynamic** representations\
    \ of properties. Also when we print a list of properties, we can filter out the\
    \ methods by creating a *condition for output* with a ***typeof*** verification.\n\
    \nIn the process of learning all these we also learned about *conditional statements*\
    \ by using ***if, else if, else***.\n\nBoolean **true** and **false** were introduced\
    \ and we learned that, in JavaScript, every value is considered *true* except\
    \ Boolean *false*, number *zero*, or the values *undefined* and *null*.\n\nFunctions\
    \ are mechanisms that save executable code. In a sense, a function does not hold\
    \ a value, it holds a potential value that only materializes when we call the\
    \ function. A function can have input parameters as temporary placeholders for\
    \ data being passed into the function when the function is called. Of course we\
    \ can also have functions that do not take any data, they just perform a certain\
    \ task.\n\nWe know that the ***return*** mechanism is the only true *raw output*\
    \ from a function and we need to catch this returned data if we want to reuse\
    \ it somewhere else before it gets lost in cyberspace."
