  trans: "\n\n# `x++` 或 `x = x + 1`\n\n由于 `x++` 是最后一个评估的表达式，因此不需要分号。实际上，这样做是不希望的，因为它会触发错误，阻止\
    \ JavaScript 运行该代码块，因为它认为它正处于 `for` 循环的结束。`x++` 之后的第一个分号应该位于主体代码块内第一个可执行语句的结尾。\n\
    \n一旦 JavaScript 第一次运行循环，它将返回并进行第二次评估。第二次评估如下：\n\n`(for x starting at one; and\
    \ for x less than 5; increment x) { execute this code }`\n\n在第二次迭代中，`x` 为 `1`\
    \ 但仍然小于 `5`，因此代码块被再次执行，并且 `x` 在结尾再次增加。依此类推，直到 `x` 变为 `5`。\n\n## 让我们创建一个简单的 for\
    \ 循环来看看它是如何工作的。\n\n作为 `x` 使用的临时变量常用的名称是 `i`。也许这是因为这让我们想起了 *index*（索引）这个词。所以，让我们用经典的名称\
    \ `i` 代替 `x`：\n\n```\nfor(var i = 0; i < 5; i++)\n```\n\n这是头部形式，意味着：\n\n`对于这个声明的变量\
    \ `i`，其初始值为零；只要 `i` 小于五；在每个循环周期后将 `i` 增加 1*`。\n\n在第 2 行，我们在代码块中包含了可执行指令。这些指令将由\
    \ JavaScript 重复 5 次：\n\n下面的图片说明了这一概念：\n\n![](img/00010.jpeg)\n\n图 10\n\n*   请注意：如果你编写了此循环并将其粘贴到控制台中，你可能会得到一个带有\
    \ `(5)` 前缀的单行结果，告诉控制台运行了 5 次。这是控制台的正常行为。为了节省显示空间，它们通常不会重复输出相同的内容，它们只会告诉你循环运行了多少次，但在现实中你会看到五行显示。然而，如果每次打印的内容都不同，那么控制台就会单独显示所有\
    \ 5 次迭代。\n\n要查看循环运行的真实显示，请将 `console.log(\"Say hi to Mary!\");` 替换为\n\n```\nconsole.log(i);\n\
    ```\n\n现在，它会在每次循环重复中打印变量 `i` 的值，由于每次输出都不同，控制台必须显示每一次迭代。\n\n如果你想要更美观的输出，可以尝试这个：\n\
    \n```\nconsole.log(\"the value of i is now \" + i);\n```\n\n你将得到：\n\nthe value\
    \ of i is now 0\nthe value of i is now 1\nthe value of i is now 2\nthe value of\
    \ i is now 3\nthe value of i is now 4\n\n它显示了 0 到 4，因为 `i` 的计数从 0 开始，第五次是 `4`。这没关系，它仍然循环了\
    \ 5 次。然而，如果你的意图是显示 1 到 5，那么让 `i` 从开始就等于 1，而不是从零开始。\n\n## 2.7 遍历字符串\n\n还记得 `bracket`（括号）表示法\
    \ `dot`（点）表示法吗？\n\n我在第一部分的 `Manipulating variable data` 章节介绍过它们。\n\n让我们回顾并进一步扩展一下这个主题。\n\
    \n我将声明变量 `x` 并赋值字符串值 \"orange\"：\n\n```\nvar x = \"orange\";\n```\n\n值 \"orange\"\
    \ 是一个顺序字符集合，每个字符都有一个从零开始的位置数字，比如 `o` 是零，`r` 是一，`a` 是二，`n` 是三，以此此类推。\n\n我们可以使用\
    \ `bracket notation` 来查找字符串中任何位置的字符数据：\n\n```\nx[location Number];\n``` <-- 它返回该位置内部的值。\n\
    \n示例：\n\n```\nx[2];\n```\n\n它将显示字符 `a`，它是第三个字符，位置为 `2`（从零计数）。\n\n我不能在这里使用 `dot\
    \ notation`，因为 `dot notation` 不接受数字或符号：\n\n```\nx.2\n``` <-- 这将给我一个错误。\n\n###\
    \ 我们可以用这种括号表示法语法做什么？\n\n括号表示法允许我们访问字符串值上的特定字符。\n\n这是一个通过 `console.log` 发送 `x[4]`\
    \ 来显示变量 `x` 中字符 `g` 的示例：\n\n```\nconsole.log(x[4]);\n```\n\n另一个示例：字符 `ge`：\n\n\
    ```\nconsole.log(x[4] + x[5]);\n```\n\n所以通过 `bracket notation`，我们可以探测字符字符串并获取位置数字的内容。\n\
    \n### 点表示法又如何？\n\n点表示法非常适合获取字符串值的属性，例如 `length`，记得吗？\n\n```\nx.length;\n``` 或\n\
    ```\nconsole.log(x.length);\n```\n\n*   点语法无法用于数字、符号以及在编写代码时值尚未知的名称。这防止了点语法在循环中使用，因为循环中的值会随着每个循环周期而变化。因此，**当动态数据时，只能使用括号语法**。\n\
    \n## 2.8 实验工作 7\n\n### 搜索字符串字符的位置\n\n在 own 项目中，我们将变量 `x` 赋值为 \"orange\"。\n\n其思路是搜索字符\
    \ \"g\" 并在屏幕上显示它的位置。\n\n1.  声明变量 `x` 并将其赋值为 \"orange\"：\n    ```\n    var x =\
    \ \"orange\";\n    ```\n2.  填充一个 `for` 循环，从 `i = 0` 开始，范围为 `i < x.length`：\n \
    \   ```\n    for(var i = 0; i < x.length; i++) {\n    ```\n3.  在 `for` 循环体中，创建一个\
    \ `if()` 条件来探测 \"g\" 是否存在：\n    ```javascript\n    if(x[i] === \"g\") {\n    ```\n\
    4.  如果条件为 `true`，将 \"g\" 的位置数字打印到屏幕上：\n    ```javascript\n    console.log(i);\n\
    \    ```\n5.  关闭 `if()` 条件然后关闭循环：\n    ```\n    }\n    }\n    ```\n\n额外练习：将 \"\
    g\" 替换为 \"orange\" 中不存在的其他字符，并创建一个 `else` 语句来捕获它，输出如下：“That character was not\
    \ found!” 表达式看起来像：\n`if(x[i] === \"g\") { ... } else { ... }`\n\n（讨论和结果见下一页）。\n\
    \n### 数字计数并声明它们的奇偶性\n\n1.  创建一个从 0 数到 10 的 `for` 循环。\n2.  对于每个计数显示它们的奇偶性，例如：1\
    \ 是奇数，2 是偶数，以此此类推。\n\n### 计数苹果\n\n1.  创建一个计数到 3 个苹果的 `for` 循环。不允许为零，且如果是单个时输出必须是\
    \ 1 apple，然后是 2 apples，最后是 3 apples。\n\n"
