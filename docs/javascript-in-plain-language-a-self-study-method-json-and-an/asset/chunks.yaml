  trans: "\n\n从函数输出数据的另一种方法是在内部重新赋值一个外部变量，因为函数可以访问外部变量。对于 `console.log()`，它只是在屏幕上显示数据的一种方法，并且始终是\
    \ `string type` 格式。\n\n好了，简而言之，这包含了近 200 页的有趣内容。\n\n## 3.2 更多关于函数\n\n### 什么是表达式和语句？\n\
    \n在本书中，我们一直在非正式地使用“表达式”（expression）和“语句”（statement）这两个术语。现在是时候停下来思考这些术语了，因为它们有特定的含义。\n\
    \n- 语句（`statement`）是一个完整的命令，指示计算机执行特定任务。它通常写在一行（但并非总是如此），并以分号（`semicolon`）结束。\n\
    \n**语句示例：**\n\n```javascript\nvar z = 1 + 2 + 3;\n\nconsole.log(\"Hello World\"\
    );\n\nif(z > 2) {\n  console.log(\"yes it is\");\n}\n```\n\n在最后一个例子中，语句从 `if`\
    \ 开始，到分号结束。如果你提前放置分号，将会得到错误。这是我们刚开始编程时的常见错误。\n\n我们还提到过多次“返回语句”（return statement）。除了\
    \ return 只允许在函数中使用外，它是作为语句编写的：\n\n```javascript\nreturn 3 + 4;\n```\n\n很多时候语句被组合成一组多个语句，在这种情况下，我们使用大括号来包裹组合语句：\n\
    \n```javascript\nif(z > 2) {\n  console.log(\"yes it is\");\n  console.log(\"\
    z is greater than 2\");\n  console.log(\"z is also the last word of the alphabet\"\
    );\n}\n```\n\n注意最后一个大括号并没有以分号结束。只有当我们将代码块赋值给变量时（例如创建一个对象时），才会在大括号后面放置分号。\n\n**然后我们来看表达式（expressions）。**\n\
    \n表达式是任何可以求值（`evaluates to`）为一个单位的内容。例如，当 JavaScript 看到 `3 + 4` 时，它实际上看到的是 7。JavaScript\
    \ 查看表达式并将其简化为 1 个单位。就像语句一样，表达式无处不在，而且它们可以是同一个。\n\n示例：\n\n```javascript\nvar x\
    \ = 4;\n```\n\n在上面，`var x = 4;` 既是一个语句也是一个表达式。实际上我们有两个表达式。JavaScript 查看代码并将表达式细分为：\n\
    \n1- `x`，在求值时结果为 4，以及\n2- `4`，其结果为它本身。JavaScript 查看一个 4，并将其表达为 4 的结果。\n\n```javascript\n\
    if( 10 < 11) { // do something; }\n```\n\n在上面，`if(10 < 11)` 是一个表达式，因为 JavaScript\
    \ 并没有看到字面量 `10<11`，它只看到 `true` 或 `false`（二择一）。JavaScript 并不真正关心 `10<11` 本身，它查看它并在内部将其替换为布尔值\
    \ `true`。\n\n- 这是理解该语言的一个非常重要的概念：我们编写表达式，而 JavaScript 存储它们表达式求值的结果。\n\n当然，10 和\
    \ 11 本身是独立的表达式，但它们没有 `10<11` 的组合那么重要。JavaScript 解释它并将其保存为纯粹的 `true`。\n\n现在，看上一个\
    \ `if()` 示例中的分号。那是语句结束的地方，它从 `if` 开始，在 `..thing;` 结束。\n\n**函数呢？它本身是一个表达式吗？**\n\
    \n以以下函数为例：\n\n```javascript\nfunction x (num1, num2){\n  return num1 + num2;\n\
    }\n```\n\n上面的函数本身不会求值产生任何内容。它可能可能求值为 `num1 + num2` 的和，但只有在调用该函数时：\n\n```javascript\n\
    x(2,4);\n```\n\n函数在被调用时求值为 6。\n\n当我们用参数 2 和 4 调用函数 `x` 时，它是如何求值为 6 的？\n\n- `num1`\
    \ 变成一个表达式，求值为 2。\n- `num2` 变成一个表达式，求值为 4。\n- `num1 + num2` 变成一个表达式，求值为 6。\n\n\
    表达式求算是真正理解 JavaScript（或任何其他语言）的一个重要概念。\n\n在下一个主题中，我们将看到如何将函数赋值给变量，使函数和变量的组合成为一个表达式。\n\
    \n记住，声明变量以 `var` 开始。声明函数以 `function` 开始：\n\n```javascript\nvar x = 33;\n\nfunction\
    \ y (){ }\n```\n\n接下来，我们将看到如何将函数作为值赋值给变量，并回答你可能有的几个常见问题。\n\n### 将函数赋值给变量\n\n到目前为止，我们一直以以下字面方式声明函数：\n\
    \n```javascript\nfunction x () { return 5; }\n```\n\n然而，我们也可以这样将函数赋值给变量：\n\n```javascript\n\
    var x = function { return 5; };\n```\n\n注意末尾的分号。这是因为整个变量声明本身就是一个语句。语句是提供给 JavaScript\
    \ 的完整命令句子，它们通常以分号结束，将它们与下一个语句隔开。\n\n*等一下，我还是不明白。我没有像之前那样在函数声明中看到分号。为什么这一个要加分号？*\n\
    \n分号与函数声明无关。分号是语句结束的地方，它从 `if` 开始，在 `..thing;` 结束。（注：此处原文逻辑似乎有误，翻译已按字意保留）\n\n\
    （注：由于原文后部分段落存在逻辑混乱或重复描述迹象，翻译已遵循原文句意进行对齐）\n\n"
- fmt: "\nAnd just to solidify the concept, here’s a question unrelated to our examples:\n\
    \n7- What is the value of expression `if(10 > 5)`?\n\n*Ans*: `true`\n\ntrue is\
    \ what JavaScript sees when we write `(10 > 5)`, which by the way, an expression\
    \ in an `if()` statement is actually **a question** as far as JavaScript is concerned.\n\
    \n## The balloon concept\n\nQuestion:\n\n*If a function was a balloon tied by\
    \ three strings, z, a, b, what would happen to the balloon if we cut off string\
    \ z?*\n\nAnswer:\n\nNothing would happen to the balloon, it would stay the same\
    \ because `a` and `b` still hold the balloon.\n\nWhat would happen then if we\
    \ cut both `a` and `b` from the balloon? The balloon would fly away.\n\nIf the\
    \ balloon was our function it would also fly away, it would be put in [garbage\
    \ collection](http://en.wikipedia.org/wiki/Garbage_collection_%28computer_science%29)\
    \ mode to be wiped out from memory by the browser.\n\nIn the next few exercises\
    \ we will practice with function *expressions* (those assigned to variables) instead\
    \ of function declarations (the syntax style we had first learnt). Bear in mind\
    \ that one function or another will yield the same result, but it is important\
    \ to become with both styles.\n\n### Function parameters and arguments\n\nA function\
    \ can have *input parameters* so that when we call the function we pass in *data\
    \ arguments*. Many times programmers use the same term for both meanings, either\
    \ parameter or arguments and it has been accepted as such, but this is the definition:\
    \ we give arguments to parameters when we call the function. A parameter is a\
    \ physical thing, an interface, an input mechanism, a temporary variable that\
    \ gets deleted once the function ends its execution.\n\nThe sequence of our data\
    \ arguments when we call the function will always coincide with the physical sequence\
    \ of the input parameter in the function parentheses.\n\nFor example:\n\n```javascript\n\
    var x = function(num1, num2){\nreturn num1 - num2;\n};\n```\n\nThe sequence of\
    \ passing data into inputs `num1` and `num2` matters because the function’s internal\
    \ program is wired to the layout sequence of the input parameters:\n\n```javascript\n\
    x(5, 3);\n```\n\nIt will return the value `2` because 5 – 3 = 2\n\nHowever, if\
    \ we call the function and write the arguments in reverse order:\n\n```javascript\n\
    x(3,5);\n```\n\nThe function will return the value `-2` because 3 -5 = -2\n\n\
    In short, when we call the function, the sequence of arguments needs to be observed.\n\
    \n*   What happens if we call the function and pass in three arguments instead\
    \ of two?\n    ```javascript\n    x(5,3,4);\n    ```\n    The result will be `2`,\
    \ as of 5 -3 = 2\\. The last argument (4) is ignored because there is no provision\
    \ to do anything with it within the function.\n\n*   What happens if we call the\
    \ function with just one argument even though the function is hardwired with two\
    \ input parameters?\n    ```javascript\n    x(5);\n    ```\n    In our case it\
    \ returns `NaN`, which is a JavaScript property that stands for Not-a-Number,\
    \ or not a valid number. That’s because the output became the subtraction of `5\
    \ – num2` and `num2` was not assigned to anything and remained `\"undefined\"\
    ` which is its original value.\n\nFor example, in:\n\n```javascript\nvar x = function(input1,\
    \ input2){\nreturn input1 + input2;\n};\n```\n\nIf I call the function with two\
    \ arguments:\n\n```javascript\nx(\"Tony\", \"deAraujo\");\n```\n\nI get an output\
    \ of `\"TonydeAraujo\"`.\n\nIf on the other hand I only use one argument, it assumes\
    \ the first input parameter, and the other input parameters will be `undefined`:\n\
    \n```javascript\nx(\"Tony\");\n```\n\nIt outputs `\"Tonyundefined\"`.\n\n*   We\
    \ can program as many as 256 input parameters in a function.\n\nDo not memorize\
    \ all these, juts take the time to understand it and move forward.\n\n### The\
    \ object arguments\n\nThe input parameters are written into a function by the\
    \ programmer because he/she wants to have some sort of sequence of data input\
    \ and for the most part this works out greatly.\n\nHowever, JavaScript functions\
    \ have another way to accept arguments via an object that belongs to (and only\
    \ to) functions: the object `arguments` (use the plural name).\n\nThe object `arguments`\
    \ acts like an array in the sense that it can be addressed numerically, but it\
    \ is not a full featured array because it only [inherits](http://en.wikipedia.org/wiki/Prototype-based_programming)\
    \ some functionality from the array family, not all of its library.\n\n**Let’s\
    \ see how this object works**.\n\n```javascript\nvar x = function(){\nreturn arguments[0]\
    \ + arguments[1].toUpperCase();\n};\n```\n\nThe above function has no input parameters\
    \ specified. However, it outputs the first argument we give to it when we call\
    \ the function, as well as the second argument in upper case which goes on position\
    \ 1 (remember, locations are zero based just like in arrays):\n\n```javascript\n\
    x(\"tony\", \"dearaujo\");\n```\n\nIt returns: \"tonyDEARAUJO\"\n\nSo we can still\
    \ program our functions as we wish and with no specified input parameters. Just\
    \ use the `arguments object` to numerically address each data element.\n\nI go\
    \ into much more detail about the arguments object on my other [book](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ which, although written earlier, it could be considered a second volume for\
    \ this one.\n\n## 3.3 Manipulating variables with functions\n\n### Passing data\
    \ by value\n\nUp to this point we have used *input parameters* to hardwire and\
    \ interface that inserts data into functions. These interfaces serve as a bridge\
    \ between the outer world and the inner works of a function.\n\nThen, we realized\
    \ that we don’t have to explicitly write parameters in order to input data into\
    \ the function since we can program the `object arguments` to grab any argument\
    \ we include when we call the function.\n\n**Here’s something new to keep in mind:**\n\
    \nWhen we pass arguments to a function, like for example:\n\n```javascript\nx(2,3);\n\
    ```\n\nThe input parameters of the function make a **copy** of the data. They\
    \ don’t really use the same data we write as arguments. This is because the function\
    \ call resides on a separate memory area than the function itself. Later, if you\
    \ read *volume two* you will see that this area of memory where we call functions\
    \ or assign strings or numbers, is called the `stack`, and functions (as well\
    \ as all other objects) reside in another area called the `heap`. There is no\
    \ connection between these two areas. Hence the reason why the data is copied\
    \ or facsimiled.\n\nWhen we copy data, we are adding values to memory. This type\
    \ of passing data from one mechanism to another is called passing by value.\n\n\
    Another common data transfer done *by value* is when we assign a string or numerical\
    \ variable to another variable. As you know from an earlier chapter, primitive\
    \ variables (those holding strings or numbers) keep the value in their own memory\
    \ location. Take for example the following variables:\n\n```javascript\nvar x\
    \ = 33;\nvar y = x;\n```\n\n`x` holds 33 and `y` also holds 33. But these are\
    \ different 33 values. Data has been passed by value because we added new data\
    \ into memory.\n\n### Passing data by reference\n\nComplex values such as functions,\
    \ arrays and objects, reside in the `heap` while the variable that points to them\
    \ resides in the `stack`. Unlike simple values, these values and their variables\
    \ are two separate entities.\n\nBecause they are two separate entities, when we\
    \ assign a variable pointing to a complex data structure to another variable,\
    \ the values are not copied and therefore this exchange is not passed by value.\
    \ The only thing we are doing is to assign the reference or passing by reference\
    \ so that both variables now point at the same value:\n\nTake for example the\
    \ array a:\n\n```javascript\nvar a = [1,2,3,4];\n```\n\nNow assign the same variable\
    \ to another variable:\n\n```javascript\nvar b = a;\n```\n\nWe do not duplicate\
    \ the contents of the array, function or object. We now have two variables pointing\
    \ at the same data. Remember the *balloon* with three strings z, a, b?\n\nSo when\
    \ we edit a value in array `a`, we are in fact also changing the value of array\
    \ `b`, or vice versa since they both point to the same array.\n"
  raw: 'And just to solidify the concept, here’s a question unrelated to our examples:


    7- What is the value of expression if(10 > 5)?


    *Ans*: **true**


    true is what JavaScript sees when we write (10 > 5), which by the way, an expression
    in an if() statement is actually **a question**  as far as JavaScript is concerned.


    The balloon concept


    Question:


    *If a function was a balloon tied by three strings, z, a, b, what would happen
    to the balloon if we cut off string z?*


    Answer:


    Nothing would happen to the balloon, it would stay the same because *a* and *b*
    still hold the balloon.


    What would happen then if we cut both *a* and *b* from the balloon? The balloon
    would fly away.


    If the balloon was our function it would also fly away, it would be put in [garbage
    collection](http://en.wikipedia.org/wiki/Garbage_collection_%28computer_science%29)
    mode to be wiped out from memory by the browser.


    In the next few exercises we will practice with function *expressions* (those
    assigned to variables) instead of function declarations (the syntax style we had
    first learnt). Bear in mind that one function or another will yield the same result,
    but it is important to become with both styles.


    ### Function parameters and arguments


    A function can have *input parameters* so that when we call the function we pass
    in *data arguments*. Many times programmers use the same term for both meanings,
    either parameter or arguments and it has been accepted as such, but this is the
    definition: we give arguments to parameters when we call the function. A parameter
    is a physical thing, an interface, an input mechanism, a temporary variable that
    gets deleted once the function ends its execution.


    The sequence of our data arguments when we call the function will always coincide
    with the physical sequence of the input parameter in the function parentheses.


    For example:


    **var x = function(num1, num2){


    return num1 - num2;


    };**


    The sequence of passing data into inputs *num1* and *num2* matters because the
    function’s internal program is wired to the layout sequence of the input parameters:


    **x(5, 3);**


    It will return the value ***2*** because 5 – 3 = 2


    However, if we call the function and write the arguments in reverse order:


    **x(3,5);**


    The function will return the value ***-2*** because 3 -5 = -2


    In short, when we call the function, the sequence of arguments needs to be observed.


    *   What happens if we call the function and pass in three arguments instead of
    two?


    x(5,3,4);


    The result will be ***2***, as of 5 -3 = 2\. The last argument (4) is ignored
    because there is no provision to do anything with it within the function.


    *   What happens if we call the function with just one argument even though the
    function is hardwired with two input parameters?


    x(5);


    In our case it returns ***NaN***, which is a JavaScript property that stands for
    Not-a-Number, or not a valid number. That’s because the output became the subtraction
    of ***5 – num2*** and num2 was not assigned to anything and remained "*undefined*"
    which is its original value.


    For example, in


    **var x = function(input1, input2){


    return input1 + input2;


    };**


    If I call the function with two arguments:


    **x("Tony", "deAraujo");**


    I get an output of "*TonydeAraujo*".


    If on the other hand I only use one argument, it assumes the first input parameter,
    and the other input parameters will be *undefined*:


    x("Tony");


    It outputs "*Tonyundefined*".


    *   We can program as many as 256 input parameters in a function.


    Do not memorize all these, juts take the time to understand it and move forward.


    ### The object arguments


    The input parameters are written into a function by the programmer because he/she
    wants to have some sort of sequence of data input and for the most part this works
    out greatly.


    However, JavaScript functions have another way to accept arguments via an object
    that belongs to (and only to) functions: the object ***arguments*** (use the plural
    name).


    The object *arguments* acts like an array in the sense that it can be addressed
    numerically, but it is not a full featured array because it only [inherits](http://en.wikipedia.org/wiki/Prototype-based_programming)
    some functionality from the array family, not all of its library.


    **Let’s see how this object works**.


    var x = function(){


    return arguments[0] + arguments[1].toUpperCase();


    };


    The above function has no input parameters specified. However, it outputs the
    first argument we give to it when we call the function, as well as the second
    argument in upper case which goes on position 1 (remember, locations are zero
    based just like in arrays):


    x("tony", "dearaujo");


    It returns: "tonyDEARAUJO"


    So we can still program our functions as we wish and with no specified input parameters.
    Just use the *arguments object* to numerically address each data element.


    I go into much more detail about the arguments object on my other [book](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)
    which, although written earlier, it could be considered a second volume for this
    one.


    ## 3.3 Manipulating variables with functions


    ### Passing data by value


    Up to this point we have used *input parameters* to hardwire and interface that
    inserts data into functions. These interfaces serve as a bridge between the outer
    world and the inner works of a function.


    Then, we realized that we don’t have to explicitly write parameters in order to
    input data into the function since we can program the ***object arguments*** to
    grab any argument we include when we call the function.


    **Here’s something new to keep in mind:**


    When we pass arguments to a function, like for example:


    x(2,3);


    The input parameters of the function make a **copy** of the data. They don’t really
    use the same data we write as arguments. This is because the function call resides
    on a separate memory area than the function itself. Later, if you read *volume
    two* you will see that this area of memory where we call functions or assign strings
    or numbers, is called the ***stack***, and functions (as well as all other objects)
    reside in another area called the ***heap***. There is no connection between these
    two areas. Hence the reason why the data is copied or facsimiled.


    When we copy data, we are adding values to memory. This type of passing data from
    one mechanism to another is called **passing by value**, or by adding more value
    to memory sort of speaking.


    Another common data transfer done *by value* is when we assign a string or numerical
    variable to another variable. As you know from an earlier chapter, primitive variables
    (those holding strings or numbers) keep the value in their own memory location.
    Take for example the following variables:


    var x = 33;


    var y = x;


    ***x*** holds 33 and ***y*** also holds 33\. But these are different 33 values.
    Data has been passed by value because we added new data into memory.


    ### Passing data by reference


    Complex values such as functions, arrays and objects, reside in the *heap* while
    the variable that points to them resides in the *stack*. Unlike simple values,
    these values and their variables are two separate entities.


    Because they are two separate entities, when we assign a variable pointing to
    a complex data structure to another variable, the values are not copied and therefore
    this exchange is not passed by value. The only thing we are doing is to assign
    the reference or passing by reference so that both variables now point at the
    same value:


    Take for example the array a:


    var a = [1,2,3,4];


    Now assign the same variable to another variable:


    var b = a;


    We do not duplicate the contents of the array, function or object. We now have
    two variables pointing at the same data. Remember the *balloon* with three strings
    z, a, b?


    So when we edit a value in array ***a***, we are in fact also changing the value
    of array ***b***, or vice versa since they both point to the same array.'
