    # 1.7 添加更多 JavaScript 运算符


    ### +, -, +=, -=, /=, %, *, *=


    - 如果两个操作数都是数字，它会将左操作数加到右操作数上。

    如果其中一个或两个操作数都是字符串，它将拼接这两个单词或字符。

    - 从左数字操作数中减去右数字操作数。

    - `+=` 将左侧加到右侧并自动赋值给左侧。

    - `-=` 从左侧减去右侧并自动赋值给左侧。

    - `/` 将左操作数除以右操作数。

    - `/=` 将左操作数除以右操作数并将 `quotient` 自动赋值给左操作数。

    - `%` 取模（获取左操作数除以右操作数的余数）。

    - `*` 将左操作数乘以右操作数。

    - `*=` 将左操作数乘以右操作数并将乘积自动赋值给左侧。


    注意：由于 `+=`、`-=`、`/=` 和 `*=` 是赋值运算符，左操作数必须是一个变量，不能是直接的数字。我们将在编码过程中扩展这些概念。


    ### + 加法运算符


    `+` 符号根据 JavaScript 处理的数据类型具有双重功能。


    在字符串类型中，`+` 运算符用于[拼接](http://en.wikipedia.org/wiki/Concatenation) 单词，如下例所示：


    ```javascript

    "Hello" + "World!";

    ```


    JavaScript 将它们组合为 "HelloWorld!"


    如果你真的想在单词之间留空格，有三种方法可以完成任务：


    (1)

    ```javascript

    "Hello" + " " + "World!";

    ```


    (2)

    ```javascript

    "Hello " + "World!";

    ```


    (3)

    ```javascript

    "Hello" + " World!";

    ```


    在第一个示例中，我通过用引号括起来添加了一个独立的空格。

    在第二个示例中，我在 Hello 之后、闭合引号之前放置了一个空格。

    在第三个示例中，我在 World! 单词后面添加了一个尾随空格。


    第一个示例在我们将两个变量相加时非常有用，因为由于缺少引号，我们无法将领先或结尾空格与变量结合。


    我的意思是：


    ```javascript

    var x = "Hello";

    var y = "World!";

    ```


    现在我将两个变量拼接并将它们赋值给另一个变量：


    ```javascript

    var z = x + y;

    ```


    `z` 的结果是 `HelloWorld!`。在 `x` 和 `y` 之间添加空格唯一的方法是使用第一种技术：


    ```javascript

    var z = x + " " + y;

    ```


    现在 `z` 包含 "Hello World!"


    ### 使用 + 加法运算符相两个数字


    涉及数字时，`+` 运算符的操作数如下例所示：


    ```javascript

    3 + 4 + 5;

    ```


    该表达式将结果为 12。


    ```javascript

    var a = 6;

    var b = 10;

    var c = a + b;

    ```


    变量 `c` 被赋值为 16，它是 `a` 和 `b` 的和。


    ### 使用 += 赋值运算符


    `+=` 非常有用。假设变量 `i` 的值为 3，你想给它加 7，我的意思是 3 + 7：


    ```javascript

    var i = 3;

    ```


    我们可以这样做：


    ```javascript

    i = i + 7;

    ```


    这将变量 `i` 赋值为 10。


    然而，这种操作非常常见（正如你稍后将看到的），所以程序员们创建了一个快捷运算符 `+=`（称之为 plus equals，永远不要写成 equals plus，因为那不起作用）：


    ```javascript

    i += 3;

    ```


    每当你看到 `+=`，它意味着取左操作数的值并将其加上右操作数。


    所以现在原本为 10 的 `i` 变成了 13。如果我再次这样做会怎样？


    ```javascript

    i += 1;

    ```


    现在 `i` 是 14。


    这一个呢：


    ```javascript

    i += i;

    ``` <-- 那是 `i` 不是 1。


    上面的示例等同于 14 + 14，结果为 28。


    `+=` 运算符也可以用于字符串，向原始值的右侧添加更多字符：


    ```javascript

    var n = "T";

    n += "o"; // 结果为 "To"

    n += "n"; // 结果为 "Ton"

    n += "y"; // 结果为 "Tony"

    ```


    这在循环中非常自动构建短语或名称列表，正如我们稍后看到的。


    ### ++（双加号）自增运算符


    很多时候我们希望值增加 1 个单位。这是编程中非常常用的技术。


    我们可以通过三种方式实现：


    假设 `var x = 5;`：


    ```javascript

    x = x + 1; // 现在 x 是 6

    x += 1;     // 现在 x 是 7

    x++;        // 现在 x 是 8（注意：原文说的是 7，但逻辑上 5++ 是 6）

    ```

