    typeof x;\n```\n\n它现在显示 `\"string\"` 而不是 `\"undefined\"`。\n\n9- 将变量 `b` 分配给变量\
    \ `y`\n\n（赋值从右到左）：\n\n```\ny = b;\n```\n\n`y` 现在应该包含一个和 `b` 一样的你的名字副本，它的值类型也是\
