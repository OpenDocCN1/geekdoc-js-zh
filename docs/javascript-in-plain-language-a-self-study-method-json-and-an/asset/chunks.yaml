    or just *call* the function manually by writing the function call each time.


    Don’t forget to include the parentheses ().


    **Another cool feature of a function is on the following explanation:**


    We could create a temporary variable that could be modified by some *argument
    data* we pass into the function when we call the function.


    Don’t worry about understanding everything right now. We will get there. Just
    go along with me and try the next step.


    3- Let’s modify the function by removing the permanent ***x*** variable declaration
    on the top (before the function script), and placing x as an input parameter.
