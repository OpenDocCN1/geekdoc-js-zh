    ## 5.5 进一步深入模块化


    ### 为 ng-app 分配模块名称


    模块化是一种设计技术，它强调*将程序的功能拆分为独立的模块*，并使得每个模块都包含执行目标结果某一方面所需的所有内容。


    模块是 `app` 不同部分的容器，包括相关的控制器（controllers）、服务（services）、过滤器和指令（directives）。


    **你的网页 `app` 是一个模块。**


    在我们的网页中，当我们在 HTML 标签上声明 `ng-app` 时，我们实际上是在创建一个模块（我们使用的是一个`unnamed` 模块）。我们没有给测试网页（或模块）命名的原因是，一旦命名，在配置好
    `module interface`（模块接口）之前，它将停止工作，这意味着我们需要通过在 `<script></script>` 块中编写声明来正式地向
    AngularJS 注册此模块。


    这就是为什么我们让 AngularJS 的声明保持尽可能简单，只声明了：


    ```html

    <html ng-app>

    ```


    然而，一种常见的最佳实践是通过给网页赋予一个模块名称来命名，例如：


    ```html

    <html ng-app="nameOfTheModule">

    ```


    `nameOfTheModule` 是该网页在 AngularJS 中的标识，你可以使用任何你喜欢的名称。


    除了命名模块是一种最佳实践外，如果你让页面变得超过了我们目前所做的程度，这实际上是强制性的。当然，为了快速测试，我们可以只是像这样创建一个未命名的 `ng-app`：


    ```html

    <html ng-app="">

    ```


    这里要留心，如果你使用了引号但没有写名称，请确保引号之间没有空格，因为该空格会让 AngularJS 认为该模块已命名，导致你将因为文件中没有该名称而收到错误。


    我最喜欢的测试语法仍然是 `ng-app`（为了兼容 HTML5 验证，可以使用 `data-ng-app`）。只有当我真的有一个需要包含的模块名称时，我才会使用扩展，这正是我们接下来要做的。


    ### 配置模块接口


    一旦我们为 `ng-app` 分配了名称，我们就必须配置该模块。


    以我们做的最后一个练习为例（**部分 B：初始化变量和输出计算结果**）。这个练习足够简单，可以帮助我们理解如何配置应用名称模块：


    ![](img/00028.jpeg)


    图 27（尚未应用模块名称）


    在上面的图片，`ng-app` 没有名称，但它运行良好。


    然而，如果我们在 `<html ng-app>` 中插入一个名称，例如：


    ```html

    <html ng-app="myFirstAppModule">

    ```


    页面将停止工作，直到我们配置了模块接口。


    配置应用模块的一种方法是在 HTML 页面 `BODY` 底部、AngularJS 链接正下方打开一个新的 `<script></script>` 容器。


    在脚本容器中，我们将一个 `function call` 赋值给某个变量（例如 `x`）。这个特定的函数或方法来自 Angular 库，它的名称是 `module`。示例：


    ```javascript

    var x = angular.module();

    ```


    下方可以看到此赋值的图像，但请先让我完成对该赋值的解释。


    在我们把 `module()` 赋值给变量 `x` 后，我们将 `app` 的名称作为方法 `module()` 的第一个参数引入。第二个参数是一个空数组，它看起来应该是这样的：


    ```javascript

    var x = angular.module("myFirstAppModule",[]);

    ```


    按照传统，变量 `x` 是根据模块名称命名的，在这个声明中会有两个 `myFirstAppModule` 单词（这些术语的重复不会产生冲突，因为它们位于代码的不同区域，但了解变量
    `x` 的用途会有帮助）。然而，由于名称匹配并非强制，我特意将其命名为 `x`，以清楚地说明模块名称所在的位置，以及它与变量没有任何关系。


    这个声明目前足够让我们的 `ng-app` 恢复运行了。


    请仔细学习以下图片。


    ![](img/00029.jpeg)


    图 28（给 ng-app 赋予名称后，我们将该名称注册为模块）


    自己尝试一下吧。获取你的原始文件（[原始原始文件](http://icontemp.com/jpl/ang14/ang8.txt)），为你的 `ng-app`
    添加一个名称，并通过在 `BODY` 底部编写声明来向 Angular 注册模块。注意模块名称是如何在引号内引入函数 `module()` 的。它是作为字符串传递进去的。


    如果你需要帮助，请查看我的这里文件：


    [最终原始文件](http://icontemp.com/jpl/ang14/ang8b.txt)。


    **进一步解释：**


    查看变量 `x` 的声明。`x` 被赋值给属于对象 `angular` 的函数。这个名为 `module()` 的函数接受两个参数。第一个参数是一个包含我们要声明的模块名称的字符串。然后，用逗号隔开的是一个空数组。它们都需要被声明。


    数组的目的是包含未来为该模块所需的依赖项。有时我们想要使用其他子模块来增强这个特定的模块。由于使用其他相关模块非常常见，第二个参数是硬编码的，在声明新模块时需要包含它。在我们的情况下，我们只需将数组写为空数组，这对我们就有效。然而，如果你跳过了
    `[]`，模块将无法工作。我们必须在那里放置这两个括号。


    ## 5.6 准备分离数据与显示


    ### 创建控制器


    恭喜，我们正在稳步地进入 AngularJS 的实际演示。请耐心等待，我们快完成了。


    到此为止，我们一直在使用 `ng-init` 初始化动态数据。这有时可能有用，但它并不是理想的实现方式。


    ![](img/00030.jpeg)


    图 29（ng-init 将将被底部的控制器取代）


    我们需要转向将位于正确标记文件夹中的文件进行分离，但我们还没有那一步。我的意思是，在开始将代码拆分为不同的文件之前，我们应该能够在一个页面上看到整个画面，这正是我们在本课程中所学习的：学习
    Angular 应用的基础部分。如果我们在这个理解水平上将代码拆分为文件夹只会增加不必要的复杂性，我们现在不想去那里。


    我们接下来要做的的是停止使用 `ng-init` 在页面顶部编写我们的数据，并将数据对象移动到 `BODY` 部分的底部（在我们插入模块声明的同一个脚本内部）。我们的
    JavaScript 代码将写在**控制器**（controller）内部，控制器是一个特殊的 AngularJS 函数（我们刚刚创建的模块的方法或属性）。


    所以，现在我们将把网页的体部拆分为以下概念区域：


    a) **标准 HTML 标记**及其常规数据，即不需要任何 AngularJS 影响的数据。这些数据实际上可以位于页面的任何位置，因为正如你看到的，动态数据将被封装在代码块中。


    b) **我们希望 AngularJS 显示某些动态数据的区域**。这个区域被称为 `view`（视图）。AngularJS 向页面注入了许多微动态 `views`，它们与其余的
    HTML 展示混合。取决于你真正想做什么，它可以只是一个 `view`，也可以是 `views`。将其想象成我们*嵌入*页面中的脚本，就像我们处理图片或 YouTube
    视频一样。


    c) **我们创建 JavaScript 代码的区域**。我们将此区域称为 `controller`（控制器）。该区域被 `<script></script>`
    标签包围，就像框架链接一样。此时控制器的思想是存储我们使用 `ng-init` 时存储的数据和功能。控制器是一个函数，在函数内部有我们的动态数据。记住，我们使用函数来存储可以在调用时运行的代码。


