    \ to a raw file below the image:\n\n![](images/00014.jpeg)\n\nFig 14 see [raw\
    \ file](http://icontemp.com/jpl/car1.txt) | bit.ly/ZbwxY3.\n\nNotice the *commas*.\
    \ Just like in a single line object, all elements are separated by a comma except\
    \ the last item. If you write a comma there (after the last item) you will get\
    \ an error because the JavaScript interpreter will expect another element to its\
    \ right (or in this case below it).\n\nNotice the quotes on numbers 2014 and 67,000.\
    \ The reason I added quotes is because I don’t plan to do any calculations with\
    \ these numbers, so I’ve decided to treat them as strings. This is optional; you\
    \ could skip the quotes and make them properties of type *number*. As for number\
    \ 9, I’ve decided to keep it as a numeric property in case I want to calculate\
    \ the average rating for all the cars in the lot. This gives us two possible approaches\
    \ on how to write number properties.\n\nAlso, as explained before, technologies\
    \ using JSON ( JavaScript Object Notation) want the key to be in double quotes\
    \ so I have placed \"make\", \"model\", \"color\", etc  in double quotes. In this\
    \ way this script becomes machine independent, sort of like when one writes in\
    \ xml notation. By writing it this way we can send the data to any machine that\
    \ reads JSON and it will be understood. Quotes in keys are optional. Do it as\
    \ you wish.\n\n### What is a property?\n\nA property is what we call the data\
    \ elements from an object.\n\nWe could call them variables since they are not\
    \ static (their values can be changed at any time), or just object elements, but\
    \ in object oriented language they are called *object properties*.\n\n*   Object\
    \ properties are the data contained in an object and they are represented by a\n\
    \n    *name: value* pair, also known as a *key: value* pair.\n\nThink of an object\
    \ as the owner of its *name: value pair* components. These components are properties\
    \ of the object, just like my car, bike and scuba equipment are my properties.\n\
    \nvar tony = {\"transportation\": \"car\", \"Computer\": \"desktop pc\"}\n\nAn\
    \ object may also own some *methods*.\n\nLet’s talk about methods next.\n\n* \
    \  Don’t get wrapped into this terminology trying to memorize what is called what.\
    \ That will slow you down.  Just move along and let your brain assimilate these\
    \ terms based on practicing, not based on memorization.\n\n### What is a method?\n\
    \nA method is a property that executes an action on behalf of the object. If the\
    \ property is not a “thing” but an action waiting to be called upon, then it is\
