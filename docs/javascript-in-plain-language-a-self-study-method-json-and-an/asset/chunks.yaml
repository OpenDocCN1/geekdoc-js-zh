    \ So the whole `switch` should be wrapped in a function. Please feel free to choose\
    \ the function style you prefer, a function declaration, or a function expression\
    \ which is the one assigned to a variable.\n\nI will use the first method:\n```javascript\n\
    function myFavColor() {}\n```\n\n2. Inside of the function, the `prompt()` will\
    \ be assigned to variable `color`.\n3. The `switch` expression should be the value\
    \ of `color`:\n```javascript\nswitch (color) {\n```\n4. Each `case` needs to be\
    \ in lowercase:\n```javascript\ncase \"green\":\n```\n5. The output from each\
    \ `case` should be a `confirm()` followed by a `break`:\n```javascript\nconfirm(\"\
    Green is the color of balance and growth.\");\nbreak;\n```\n6. When no color matches,\
    \ the `default` execution takes over (no break is necessary):\n```javascript\n\
    default:\nconfirm(\"Sorry, that color is not in the system yet!\");\n```\n7. Finally,\
    \ don’t forget the two closing braces: one for the `switch` and another for the\
    \ function ( ones shown in).\n\n- For a quick peek or further explanation and\
    \ my own final version of this project please refer to the [forum board](http://jsplain.com/javascript/index.php/Thread/33-Lab-13b/)\
    \ | bit.ly/Zca or just the [raw file](http://icontemp.com/jpl/colors2.txt) | bit.ly/1DwVBsd\n\
    \nTo test your script just call the function:\n```javascript\nmyFavColor();\n\
    ```\n\n### 13c: A repeating switch routine\n\nSometimes we want the script to\
    \ run repeatedly such as for example in a game, until we purposely decide to exit.\n\
    \nIn order to make our previous script repeatable all we have to do is to call\
