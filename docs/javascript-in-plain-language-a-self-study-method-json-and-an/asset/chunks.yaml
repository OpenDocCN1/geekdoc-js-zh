    Other programming languages don’t have this capability and they need to run on
    special platforms acting as further interfaces to the browser and they ask for
    JavaScript to assist them in this interaction. This is the reason why JavaScript
    has become the most popular programming language on the [internet](http://en.wikipedia.org/wiki/Internet).
    Computers use it, websites use it, other software such as for example Photoshop,
    Word, PDF use it, and last but not least, computer servers are starting to use
    it on their own backend processing which is great news for the future of JavaScript.


    JavaScript can be an easy language when learned the right way, but it can also
    be a difficult language to learn because it is very dynamic and rules change based
    on conditions on the ground.


    No one can promise to teach you JavaScript since learning is a personal experience.
    But I can promise you this: read the book in sequence, think about each concept
    without memorizing it, do all the exercises, and you will be a much better programmer
    by the time you reach the end of this very short book.


    As an author, I may be a programmer or a technical writer, but above all, I am
    a technical Instructor. My writing experience comes from teaching, coaching, and
    debugging code from thousands of students. When I write about these concepts I
    always think about the struggling I’ve experienced when I was learning this material,
    and the struggle I see on other students when they ask for help. As I write, those
    problems come to the surface and I try to address them ahead of time in order
    to prevent you from falling into common traps.


    ## 1.2 Material and tools needed


    All the exercises on this book will be tested using the JavaScript Console from
    the Google Chrome’s browser. Occasionally I also use `Opera` which works similarly.
    Please feel free to use any test console you so desire since every browser has
    one. Firefox is also a good alternative but I find the other two options cleaner
    and easier for beginners to code.


    If you don’t have one of those browsers on your computer you can download it from
    the links given below. I recommend using both of them. Experimenting with different
    browsers is part of being web-savvy and a must for web developers:


    Google [Chrome](https://www.google.com/intl/en/chrome/browser/) | [Opera](http://www.opera.com/computer/)


    1. To access the console, load you Chrome browser or `Opera`, and then press the
    following key sequence:


    For Windows systems: `CTRL SHIFT j`


    For Mac: `CMD OPT j`


    This will bring up the console.


    2. If this is your first time using the console, you can detach the console from
    the browser by clicking on the `small square` shown at the bottom left of the
    console (in the latest browser this button seems to be on the top right). Detaching
    the Console will give you more room on the screen since you will be able to minimize
    the browser while keeping the console up.


    3. Make sure the tab on the top of the console is set to `console` and not to
    any of the other available options.


    4. You may see a few error messages on the Console when you first open it. This
    is normal. Just clear the screen by right-clicking and selecting `Clear console`.


    Let’s now read a few more pages and code mentally. We will do some `hands on`
    work in a few minutes when we get to the Lab section.


    ## 1.3 Declaring a variable – an alias name for a memory location


    **Preliminary information:**


    Browsers use computer memory. The more memory a computer has, the faster the browser
    works. Since `working memory` is limited, programs need to constantly rearrange
    data in memory by deleting what expires and repositioning what is still in use.


    When we program in JavaScript we store data in memory. This data is short lived
    since once we close the browser or end the program, the data is wiped out.


    To temporarily store data in memory we need to label the memory address location
    with a word that makes sense to humans, so that we can program or manipulate that
    data. We can’t just tell the browser to store the string of characters “hello
    world!” in memory by giving it the address of [0x7fffffff](http://en.wikipedia.org/wiki/Physical_address).
    Those days are long gone as it would be too complex and unpractical as well as
    ever changing since data is shifted around from location to location due to automatic
    memory rearrangements. So to address this problem, we use names as `alias` for
    assigned locations and allow the computer to manage the real physical address
    of the data as it sees fit.


    Those memory location `aliases` are called `variables`. The reason they are called
    variables is twofold: the address of the data can be changed without notice, and
    the data contained in each variable can also be changed at any time. What remains
    constant is the variable name, which is the only link humans have to this piece
    of memory real estate.


    As for the change of a value in a variable, that may be either done manually by
    the programmer further down the script instructions, or automatically by JavaScript
    itself in a dynamic reassignment of values.


    *   **Know this:** To create a memory variable we have to `declare` it (declaring
    a variable is like introducing the variable to JavaScript). Example:


    ```

    var phoneBill;

    ```


    (*Just read along. You will have a chance to try it yourself when we get to the
    Lab Work section at the end of the chapter. All chapters are purposely short.
    This is the time to read and understand conceptually. Then you will test yourself
    during lab. All lab exercises are followed by the correct answers so that you
    can double check your work*)


    ### About var


    Think of `var` as the command used to create a variable (this helps you remember
    to use `var` when you introduce a variable).


    Another thing that `var` does is to ground the variable to the location where
    it is introduced, sort of making it local variable (more about that later).


    ### About the variable name


    After writing `var` we provide the variable `name` which in our case is `phoneBill`.
    The name does not matter, it could have been `x` since JavaScript does not care
    about the ‘human meaning’ we choose.


    However, JavaScript cares about the choice of characters we use. Make sure the
    first character is a lowercase letter of the alphabet (the lowercase is not mandatory,
    just good practice as you will see later). The variable cannot start with a number
    or a symbol. Subsequent letters can be numbers, but symbols are not allowed, ever,
    except for the underscore `_`.


    *   In summary: always start your variable names with a lowercase letter. Forget
    about the underscore as the first character because it is usually used in special
    situations and therefore should not be considered for normal usage.


    My own variable `phoneBill` has a capital B in the middle. This is a common style
    of writing variable names. JavaScript doesn’t care about styles, but it does make
    it easier for the human eye when it comes to inspect the script.


    Another popular way of writing names is with an underscore separating the ‘human
    meaning’ of each word in the variable name. The reason for the underscore is because
    spaces or dashes are not permitted in variable names: `phone_bill`


    *   **Remember this:** The ‘meaning of a word’ is only for human consumption.
    If instead of introducing `phoneBill` we introduced just `x`, JavaScript would
    have accepted it without complaining. When we program, we do it both for the computer
    to understand and also for a human to understand so that he/she can troubleshoot
    or update the program later. Choose your own style of writing variables and stick
    to it. *Consistency is important*. However, become familiar with all common styles
    because when you work in a team you need to adjust to an agreed common style for
    the whole team. Practice flexibility.


    ### About the semicolon ;

