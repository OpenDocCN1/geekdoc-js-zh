    长期以来，网页一直通过交换 JSON 数据与服务器进行通信。我的意思是，页面在你的浏览器上加载，每当你点击一个动态字段时，页面保持不变，但数据通过 JSON
    数据格式交换进行更新。这就是为什么必须意识到这项技术的原因之一。


    *   **记住此点：** JSON 格式的文本在语法上也是合法的 JavaScript 代码。然而，反过来或者其他一种情况可能并不成立。这就是为什么当我们之前学习创建对象时，我选择将键包含在双引号中，使其同时成为
    JavaScript 和 JSON 的合法语法。


    下一张图片将展示一个更广泛的 JSON 对象示例。你会看到外层对象被分为两个键：`staff`（员工）和 `management`（管理层）。


    每一个键（staff/management）将以 `array`（数组）作为值。数组将包含多个以对象形式存在的单独记录。每个对象代表 staff 或 management
