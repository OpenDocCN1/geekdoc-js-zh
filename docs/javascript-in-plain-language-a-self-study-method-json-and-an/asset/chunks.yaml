  trans: "\n\n# 创建一个打印数组内容的通用方法\n\n通用（Generic）与可移植性同义词。在编程中，脚本应该尽可能具有可移植性。这有助于代码复用和内存效率。通过创建一个通用的数组方法，我们可以将其用于任何数组，而不仅仅是目前正在编写的数组。\n\
    \n1- 创建一个名为 `printArray` 的方法（方法是一种函数机制），它接收一个任意命名为 `inputArray` 的输入参数。\n\n2- 然后在函数内部创建一个\
    \ `for loop`，将 `i` 初始化为零，并且只要 `i` 小于传递给 `inputArray` 的数组长度，循环就会运行。\n\n3- 在循环体内，使用\
    \ `console.log(inputArray[i])`，这将依次对应给定数组的每个项目位置。\n\n4- 关闭循环，关闭函数。你大功告成了。\n\n\
    ## 测试...\n\n5- 如果你在控制台中还有数组 `y`，请打印数组 `y`。如果没有，请按所示添加数组 `y`：\n\n```javascript\n\
    var y = [\"grape\", \"apple\", \"banana\"];\n```\n\n6- 通过调用函数 `printArray()` 并传入\
    \ `y` 作为参数来打印数组 `y`。\n\n7- 创建其他几个数组并使用通用的 `printArray()` 方法打印它们。\n\n（查看我的答案以及下一页的文件的链接）。\n\
    \n## 引导练习\n\n创建一个一个打印数组内容的通用方法\n\n1- 创建一个名为 `printArray` 的方法（方法是一种函数机制），它接收一个任意命名为\
    \ `inputArray` 的输入参数。\n\n```javascript\nfunction printArray(inputArray) {\n```\n\
    \n2- 然后，在函数内部创建一个 `for loop`，将 `i` 初始化为零；并且只要 `i` 小于传递给 `inputArray` 的数组长度，循环就会运行。\n\
    \n```javascript\nfor(var i = 0; i< inputArray.length; i++){\n```\n\n3- 在循环体内，使用\
    \ `console.log(inputArray[i])`，这将依次对应给定数组的每个项目。\n\n```javascript\nconsole.log(inputArray[i]);\n\
    ```\n\n4- 关闭循环，关闭函数。你大功告成了。\n\n```javascript\n  } }\n```\n\n5- 如果你在控制台中还有数组 `y`，请打印数组\
    \ `y`。如果没有，请按所示添加数组 `y` 并打印它：\n\n```javascript\nvar y = [\"grape\", \"apple\"\
    , \"banana\"];\n```\n\n6- 通过调用函数 `printArray()` 并传入 `y` 作为参数来打印数组 `y`。\n\n```javascript\n\
    printArray(y);\n```\n\n7- 创建其他几个数组并使用通用的 `printArray()` 方法打印它们。\n\n查看我的文件：[论坛](http://jsplain.com/javascript/index.php/Thread/15-Lab-8/)\
    \ (bit.ly/1rdSRuA)。\n\n## 讨论\n\n通用方法非常有用。将它们保存起来备用一直是一个好主意。然而，由于你正在练习，为了以后复制粘贴保存代码可能还没有那么有利。代码片段就像烹饪食谱。世界上有很多程序员的食谱，虽然它们现在可能对你没有帮助，但在未来可能会派上用场。（我个人没有拥有任何这些书籍，因为我喜欢创建自己的东西，但在专业环境中它们是有用的，特别是当涉及到更高级、更耗时的实现时）。\n\
    \n`inputArray` 参数充当你调用 `printArray` 函数时传递的任何 `array name` 的占位符。我们不是通过 `console.log()`\
    \ 将数组打印到屏幕，而是对数组进行其他操作，例如对其排序。等我引入 JavaScript 内部库中更多属性和数组方法时，我们就会那里。\n\n记住，这本书是关于学习如何使用\
    \ JavaScript 的，而不是方法的字典。你可以随时为此目的参考我的其他[电子书](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ)，但仅限在你完成这本之后。\n\
    \n## 额外奖励：创建一个向数组中添加项的通用方法\n\n要完成这个练习，请回到本次实验作业的第一个练习（图 12），并重新创建它，使能够向任何数组添加项目，而不仅仅是原始示例所示的数组\
    \ `x`。\n\n1- 你需要向我称之为 `addMe2` 的函数添加两个输入参数：\n\na) 一个用于数组名称的输入（我将其命名为 `inputArray`），\n\
    \nb) 另一个用于你想添加到数组中的项目的输入（我将其命名为 `inputItem`）。\n\n2- 然后在函数体内，创建一个脚本，将位置 `inputArray.length`\
    \ 分配给新项目（`inputItem`）：\n\n```javascript\ninputArray[inputArray.length] = inputItem;\n\
    ```\n\n**注意：** 由于脚本比原始脚本复杂一点，我使用了人类易理解的名字，以帮助他们理解脚本的作用。即使我们是为了自己使用而编码（而不是为了他人），我们明天回来时也不会忘记它是什么了。\n\
    \n3- 如果你愿意，在函数体内添加一个 `console.log(inputArray)` 以监控输出。\n\n4- 最后，在函数外部创建一些空数组，然后通过调用函数向每个数组中添加项目。\n\
    \n当你准备好时，请参考我的脚本：[论坛板块](http://jsplain.com/javascript/index.php/)\n\n## 实验结束\n\
    \n## 其他有用方法\n\n### sort( )\n\n为了对数组排序，我们使用 `sort()`：\n\n```javascript\nvar y =\
    \ [\"grape\", \"apple\", \"banana\"];\ny.sort();\n```\n\n**重要：** 虽然除非我们将输出赋值给原始变量，否则\
    \ `join()` 不影响原始数组，但 `sort()` 的工作不同。当我们对数组排序时，它在物理上重新排列了每个项目的位置。排序是永久的，不需要显式赋值。\n\
    \n### join( )\n\n`join()` 方法将数组转换为字符串格式。这里是一些分隔的示例：\n\n```javascript\nvar y =\
    \ [\"grape\", \"apple\", \"banana\"];\n```\n\n*   添加一对引号作为参数：`y.join(\"\")` ->\
    \ \"grapeapple\"\n*   添加一个空格：`y.join(\" \")` -> \"grape banana\"\n*   添加逗号和空格：`y.join(\"\
    , \")` -> \"grape, apple, banana\"\n*   添加一个斜杠：`y.join(\"/\")` -> \"grape/apple/banana\"\
    \n*   添加空格、斜杠、空格：`y.join(\" / \")` -> \"grape / apple / banana\"\n\n**转换为字符串之前排序会怎样？**\n\
    \n```javascript\ny.sort().join(\" \");\n```\n\"apple banana grape\"\n\n### indexOf(\
    \ )\n\n*   `indexOf()` 方法返回项目的位置。\n*   如果项目不存在，它返回 -1。\n\n"
- fmt: "\nIn the array\n\n`var y = [\"grape\", \"apple\", \"banana\"];`\n\n`y.indexOf(\"\
    banana\");` <-- returns 2 (for location 2)\n\n`y.indexOf(\"chestnut\");` <---\
    \ returns -1 ( as in ‘not found’)\n\n**Example:**\n\nIn\n\n`var y = [\"grape\"\
    , \"apple\", \"banana\"];`\n\nWe could see if `chestnut` exists and code a script\
    \ to dialog with the user:\n\n```javascript\nif(y.indexOf(\"chestnut\") < 0) {\n\
    \  console.log( \"Not found, would you like to add it?\");\n}\n```\n\nIt outputs:\n\
    \n“Not found, would you like to add it?””\n\nThen we would write a script to add\
    \ `chestnut` to the array as we have done in a previous lab work.\n\n* The `<\
    \ 0` bit is to check if the `indexOf` is -1, which means that the item does not\
    \ exist.\n* On the other hand, an `index` of zero or above, means that the item\
    \ is already in the array.\n* Each `index` corresponds to an item location.\n\n\
    ### pop() and shift()\n\nThe opposite of `push()`, which is the method used to\
    \ add an item to the top or rightmost place in an array, is called `pop()`.\n\n\
    Think of \"Pop! Goes the Weasel\"!\n\n`pop()` removes one item from the very end\
    \ of the array.\n\nIn\n\n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"\
    ];\ny.pop();\n```\n\nWill remove \"banana\". Now `y` is only `[\"grape\", \"apple\"\
    ]`.\n\n`shift()` is the opposite of `unshift()`.\n\nWe `unshift` all items to\
    \ insert an item at the bottom or leftmost place. When we remove an item from\
    \ the bottom or leftmost place, all the other items get shifted down.\n\nLet’s\
    \ remove \"grape\" which is currently the first item in array `y`:\n\n```javascript\n\
    y.shift();\n```\n\nNotice how `pop()` and `shift()` don’t take any argument in\
    \ their parentheses. That’s because they specifically remove the last or the first\
    \ item, not a named item.\n\nDo you still remember how to put the items back?\n\
    \n```javascript\ny.push(\"banana\");\ny.unshift(\"grape\");\n```\n\nNow array\
    \ `y` is back to its original state:\n\n`[\"grape\", \"apple\", \"banana\"]`\n\
    \n### slice()\n\nThe method `slice()` extracts specific items from one array and\
    \ outputs those items in the same format type: array. This means that, if we catch\
    \ the output by assigning it to another variable, we create another array.\n\n\
    **What is the difference between join() and slice()?**\n\n* `join()` converts\
    \ the output into a `string` value. We use the parentheses to determine how the\
    \ string words will be separated.\n* `slice()` converts the output from an array\
    \ into another array. Since we don’t need to determine how to separate the items\
    \ because they are already separated, we take advantage of the parentheses to\
    \ pass in some other parameters as follows:\n\n`myArray.slice(0,4);` <-- zero\
    \ is the first location to be included in the output, and 4 is the first location\
    \ to be excluded.\n\n**Example:**\n\nIn\n\n```javascript\nvar fruits = [\"apples\"\
    , \"bananas\", \"blueberries\", \"grapes\", \"avocado\", \"peaches\"];\n```\n\n\
    I am going to declare a new array an use `slice()` to extract some fruit items\
    \ from the fruits array:\n\n```javascript\nvar pickedFruits = fruits.slice(0,4);\n\
    ```\n\nArray `pickedFruits` now contains:\n\n`[\"apples\", \"bananas\", \"blueberries\"\
    , \"grapes\"]`\n\n* The two parameters (0,4) have the following meaning:\n   \
    \ * The first parameter represents the first location to be extracted.\n    *\
    \ The second parameter represents the first location to be excluded from extraction.\n\
    \nA (0,1) would extract just `apples` because it excluded bananas, which is in\
    \ position 1.\n\nA (1,4) would extract `bananas, blueberries, grapes`, because\
    \ it extracts from position 1 (location one) which is `bananas`, and it excludes\
    \ from position 4 which is `avocado`. \n\nFor more advanced techniques on slice\
    \ please refer to my eBook [JavaScript Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/).\n\
    \n### splice()\n\nThe Array method `splice()` is a very interesting one. Do you\
    \ still remember `push()` and `unshift()`? They add items to the end or beginning\
    \ of an array, right?\n\n* `splice()` adds items to a specific location in the\
    \ array.\n\nLet’s see how it works. Depending on how many arguments you use in\
    \ the parenthesis, you can do the following:\n\n**a) Delete items mode:**\n\n\
    When you use only two arguments you are giving the `index` positions in the following\
    \ manner:\n* *First argument*: where the action is to start (inclusively),\n*\
    \ *Second argument*: How many items will be removed.\n\nIn a way, having just\
    \ two arguments means to delete because there is nothing to add.\n\n`splice(0,3)`\
    \ (explanation further down the page)\n\n**b) Add items mode:**\n\nIf you insert\
    \ more than two arguments, the third and consecutive arguments are data to be\
    \ inserted, and in that case JavaScript assumes you want to insert items into\
    \ the array.\n\n`splice(2,0, \"yellow\")` \n\nIn just add mode, the second argument\
    \ is zero.\n\n**c) Replace items mode:**\n\nIf we insert more than two arguments\
    \ and the second argument is greater than zero, it will remove items and insert\
    \ new ones.\n\n`splice(2,1, \"yellow\")`\n\n### Splice lab work\n\nLet’s try a\
    \ few samples to illustrate the concept of `splice()`.\n\n**Deleting** items with\
    \ `splice()`:\n\n1- On your Console declare the following array:\n\n```javascript\n\
    var x = [\"blue\",\"red\",\"green\",\"violet\",\"brown\"];\n```\n\n2- Delete 3\
    \ items starting at positions 0 which is *blue*.\n\nExclude from deletion position\
    \ 3, which *violet*: `x.splice(0,3);`\n"
