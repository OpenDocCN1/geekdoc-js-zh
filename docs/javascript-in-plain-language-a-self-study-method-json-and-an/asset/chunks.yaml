    Instead of using `i` as a counter variable I am going to use a variable named
    `apples`. Please feel free to use whatever you want. The goal for this exercise
    is to practice more `for` loop constructs and to think on how would we distinguish
    between a single output and a plural output.


    See my own solution here on exercise number 4:


    [apples](http://jsplain.com/javascript/index.php/Thread/14-Lab-7/) ) bit.ly/XScVak


