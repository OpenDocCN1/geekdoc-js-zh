    \ which covers loops, random numbers and it reviews functions and arrays. This\
    \ is a quick project for a Sunday afternoon.\n\n**Now we have come to a cross\
    \ roads.**\n\nThe rest of this book will be introducing two very hot technologies\
    \ that every JavaScript intermediate to advanced programmer should know:\n\n**JSON**\
    \ (**J**avaScript **O**bject **N**otation) is a way of formatting data to become\
