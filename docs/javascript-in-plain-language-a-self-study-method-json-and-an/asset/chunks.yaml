    \ array y*\"\n\nelse: \"*chestnut is not found in array y*\".\n\n10- 使用 `pop()`\
    \ 移除数组 `mySort` 的最后一个项目：\n\n11- 使用 `shift()` 移除数组 `mySort` 的第一个项目：\n\n12- 数组 `mySort`\
    \ 现在应该只包含 \"banana\"。\n\n添加 \"chestnut\" 作为最后一个项目。\n\n使用 `push()`。\n\n`mySort`\
