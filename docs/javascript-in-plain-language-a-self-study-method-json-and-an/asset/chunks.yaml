    \ 左右两个操作数是否都为 `true`。注意每个操作数都必须是显式的。许多初学者倾向于这样写：`x % 3 && 5 === 0`，JavaScript\
    \ 无法理解这种语法。每种情况都必须有一个独立的布尔条件。\n\n我们可以将每个操作数包裹在圆括号中，以便于人类肉眼阅读：\n\n```javascript\n\
    if((x % 3 === 0) && (x % 5 === 0)){\n```\n\n如果你这样做，请务必关闭所有括号。括号的数量必须是偶数。\n\n在\
    \ `line 3` 上，我使用了 `console.log` 来打印恰当的消息。\n\n3- 测试你的脚本以寻找错误，并确保获得正确的输出。如果你愿意，将\
    \ `x` 重新赋值为另一个数字（例如 14），并再次运行条件语句。你可以使用 `Up Arrow key` 直到找到脚本，编辑变量 `x` 并按 ENTER。当\
    \ `x` 为 14 时，你将得不到任何输出，这意味着 JavaScript 跳过了代码块，因为条件不再为 `true`。在这种情况下，你会在 Console\
    \ 上看到 `undefined` 消息。没关系，这只是 Console 的自动回显，对你的脚本没有任何影响。\n\n**注意：** 将我们的代码项目细分为\
    \ `little test steps` 是一个良好的习惯。没有什么比花了一个小时编写脚本最后却发现它无法运行更糟糕的了。\n\n4- 现在我们准备好创建第一个\
    \ `else if()` 语句了。\n\n这些条件中应该先执行哪一个：\n\n是检查能否被 3 整除的那个，\n\n还是检查能否被 5 整除的那个？\n\n\
    在这一点并不重要，因为我们已经解决了两者都能被整除的歧义，但我会按照数字顺序编写，先写 3 的条件。查看下方图片中的第 4 到第 6 行：\n\n![](img/00004.jpeg)\n\
    \nFig 4（查看原始文件：[这里](http://jsplain.com/javascript/index.php/Thread/9-branching2/)\
    \ ） bit.ly/1uoc1N8\n\n在 `line 4` 上，注意 `else if` 是如何写在上一个 `if()` 的合括号右侧的。这不是强制性的，但它看起来更专业。\n\
    \n在 `line 6` 上，花括号关闭了 `else if()` 语句。\n\n5- 将你的脚本粘贴到 Console 并按 ENTER 运行。你应该仍然得到第一个输出，因为变量\
    \ `x` 仍然是 15，这使得第一个条件为 `true`。\n\n为了测试第二个条件，将变量 `x` 重新赋值为 `9`。要更改变量 `x` 的值，按 `Up\
    \ Arrow key` 直到看到整个脚本，将光标放在变量声明处，将值改为 9 并按 ENTER。\n\n现在我们应该得到第二个输出：`x is divisible\
    \ by 3`，因为 9 可以被 3 整除。\n\n6- 是时候写最后的 `else if` 以及最后的捕获器 `else` 了。看下一图：\n\n![](img/00005.jpeg)\n\
    \nFig 5（查看原始文件：[这里](http://jsplain.com/javascript/index.php/Thread/9-branching2/)\
    \ ） bit.ly/1uoc1N8\n\n在 `line 6` 上，我们可以看到第二个 `else if()` 条件。\n\n在 `line 8` 上，`else`\
    \ 最终捕获了任何不能被 3 整除也不能被 5 整除的内容。不需要任何条件，因为这是“其他所有”的可选结果。如果我们为为 `else` 编写条件，JavaScript\
    \ 将抛出错误。\n\n在 `line 10` 上是最后一个合括号，它关闭了 `else` 语句。\n\n你不觉得你快要成功了吗？我希望如此。`Conditional\
    \ branching`（条件分支）是创建程序的重要部分。\n\n稍后我们将看到如何在不使用 `else if()` 的情况下编写此脚本，以此说明另一个重要的概念：嵌套条件。现在，让我们通过做点别的事情休息一下。\n\
    \n## 2.3 函数的解剖结构\n\n在上一个练习中，我们不断按 `Up Arrow` 来调回程序进行测试。\n\n如果没有向上箭头会怎样？我们必须一遍又地编写脚本，对吧？\n\
    \n这就是函数派上用场的地方。*停止！*当我提到 JavaScript 中的函数时，不要考虑数学。要考虑 `functionality`（功能性）。在 JavaScript\
    \ 中，函数是程序例程的容器。我们可以将 `if()`、`else` 脚本保存在函数中，只需通过 `calling`（调用）函数即可调回。这是一个单词，对比\
    \ 10 行文本。\n\n### 关于函数的预备知识\n\na) 函数是一个闭合的容器，就像下面图片中的蓝色矩形。\n\nb) 为了向函数输入数据以进行处理，我们需要一个或多个\
    \ `input` **parameters**（参数）。\n\nc) 为了从函数 `export`（导出）数据以便重用，我们需要实现一个名为 `return`\
    \ 的接口，或者将某些外部变量赋值给新结果。\n\n![](img/00006.jpeg)\n\nFig 6\n\n### 编写函数\n\n函数的表示形式如下：\n\
    \n```javascript\nfunction funcName() { stuff to do; }\n```\n\n上面的函数不接受任何输入，它只是执行某些操作。创建一个接受输入的函数，我们需要包含参数：\n\
    \n```javascript\nfunction funcName(parameter) { stuff to do; }\n```\n\n当我们说调用函数时，意味着编写函数名并加上一对括号：\n\
    \n```javascript\nfuncName();\n```\n\n或者，如果函数有参数，我们包含：\n\n```javascript\nfuncName(123);\n\
    ```\n\n当 `123` 是一个数字。\n\n或者\n\n```javascript\nfuncName(\"Tony\");\n```\n\n当 `Tony`\
    \ 是一个字符串。\n\n这里有一个名为 `sizeUp` 的函数，它将字符串转换为大写：\n\n```javascript\nfunction sizeUp(x){console.log(x.toUpperCase());}\n\
    ```\n\n在这里，`x` 是调用函数时被替换的参数。调用函数 red blue：\n\n```javascript\nsizeUp(\"white blue\"\
    );\n```\n\n显示 `RED WHITE BLUE`。\n\n回到条件练习……记得我们必须使用向上箭头来重复代码吗？通过将条件练习插入函数，我们可以避免都重新输入脚本。我们要做的只是通过名称调用函数：\n\
    \n```javascript\nfuncName();\n```\n\n*我们要重做吗？* 这里是放在函数中的之前的脚本：\n\n```javascript\n\
    function test1() {\n    // conditional code\n}\n```\n\n[这里](http://jsplain.com/javascript/index.php/Thread/10-test1/)（\
    \ bit.ly/1wSjWZ ）\n\n1- 从链接中复制代码并粘贴到你的 Console。为了从帖子中复制代码，点击代码右上角的图标。将代码粘贴到控制台后，调用函数并按\
    \ ENTER：\n\n```javascript\ntest1();\n```\n\n2-再次调用它，直到你意识到输出总是相同的，因为变量 `x` 从未改变。使用\
    \ `Up Arrow` 回调函数，或者通过手动编写函数调用手动调用。\n\n函数的另一个酷功能在下面的解释中：我们可以创建一个临时变量，由调用函数时传递的某些\
    \ `argument` 数据进行修改。\n\n现在不要担心理解一切。我们会成功的。只需跟随我尝试下一步。\n\n3- 让我们通过删除函数脚本顶部的永久 `x`\
    \ 变量声明来修改函数，并将 `x` 作为输入参数。也将函数名称更改为 `test2`。查看下图了解更多细节：\n\n![](img/00007.jpeg)\n\
    \nFig 7\n\n现在我们要做的只是调用函数并传入一个数字以便对其进行测试：\n\n```javascript\ntest2(123);\n```\n"
