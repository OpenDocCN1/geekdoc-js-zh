    \n### splice( )\n\nThe Array method splice( ) is a very interesting one. Do you\
    \ still remember *push()* and *unshift()*? They add items to the end or beginning\
    \ of an array, right?\n\n*   ***splice()* adds items to a specific location in\
    \ the array**.\n\nLet’s see how it works.\n\nDepending on how many arguments you\
    \ use in the parenthesis, you can do the following:\n\na) **Delete** **items**\
    \ mode:\n\nWhen you use only **two arguments** you are giving the **index positions**\
    \ in the following manner:\n\n*First argument*:  where the action is to start\
    \ (inclusively), \n\n*Second argument*: How many items will be removed.\n\nIn\
    \ a way, **having just two arguments** means to delete because there is nothing\
    \ to add.\n\n**splice(0,3)** (explanation further down the page)\n\nb) **Add**\
    \ **items** mode,\n\nIf you insert **more than two arguments**, the ***third***\
    \ and consecutive arguments are **data to be inserted**, and in that case JavaScript\
    \ assumes you want to insert items into the array.\n\n**splice(2,0, \"yellow\"\
    )**  \n\nIn just add mode, the second argument is *zero*, which means that no\
    \ items will be deleted in exchange for the items we are adding with the third\
    \ and consecutive parameters.\n\nor...\n\nc) **Replace items** mode.\n\nIf the\
    \ second parameter in ***add mode*** is anything other than zero, this number\
    \ will indicate how many items will be deleted in exchange for the items being\
    \ added.\n\n**splice(2,1, \"yellow\")**\n\nFor example, **splice(0,3)** means\
    \ to delete 3 items: the first, the second and the third. Number 3 represents\
    \ the quantity of items to be removed. The number 3 coincides with the third item\
    \ on the array but it is not necessarily so. If we had splice(2,3) it would remove\
    \ the third, fourth and fifth items, which correspond to positions 2,3,4 and counting\
    \ from zero.\n\n*   The 3^(rd) and consecutive arguments represent the items to\
    \ be inserted.\n\nFor example,\n\n**splice(2,0,  \"yellow\")** means to insert\
    \ *yellow* in position two (third item) and un*shift* the others because the *zero*\
