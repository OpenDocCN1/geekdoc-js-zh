    ## Introduction


    HTML or Hyper Text Markup Language is the most commonly used language for developing
    web pages. It was created in the year 1991 by Berners-Lee. The standard HTML specification,
    HTML 2.0, was published in the year 1995. Another major version of this language,
    HTML 4.01 was released in late 1999. This was the most widely used version of
    HTML and it is now replaced by HTML 5, released in the year 2012. This is basically
    an extension to its previous version HTML 4.01.


    This is for?


    This tutorial on HTML is designed specifically for aspiring developers and web
    designers. This tutorial is explained in enough detail with practical examples
    and a simple overview so that it can be easily understood by beginners and provides
    enough knowledge to design their own webpages. You can get a higher level of expertise
    with some practice.


    ## Prerequisites


    The prerequisites for starting this tutorial are that it should have some basic
    knowledge of working with Linux operating system or Windows. In addition, you
    should also be familiar with:


    - Using a text editor like editplus, notepad, notepad++ or any other text editor.

    - Creating files and directories on your computer.

    - Navigation within different directories.

    - Different image formats like PNG, JPG, etc.

    - Typing content into a file and saving them.


    ## Chapter 1: Basic Tags in HTML


    ### Heading Tags


    Heading is the first thing in a document and every document starts with one.

    In HTML, you can set your heading in different sizes. There are six sizes of headings
    and they can be set using the elements **<h1>**, **<h2>**, **<h3>**, **<h4>**,
    **<h5>**, and **<h6>**. The browser will add a line before and after the heading
    while displaying. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Heading</title>

    </head>

    <body>

    <h1>This will be heading 1</h1>

    <h2>This will be heading 2</h2>

    <h3>This will be heading 3</h3>

    <h4>This will be heading 4</h4>

    <h5>This will be heading 5</h5>

    <h6>This will be Heading 6</h6>

    </body>

    </html>

    ```


    This code will produce the following output:


    # This will be heading 1


    ## This will be heading 2


    ### This will be heading 3


    #### This will be heading 4


    ##### This will be heading 5


    ###### This will be Heading 6


    ### Paragraph Tag


    You can structure your content into paragraphs using the **<p>** tag. For making
    your text into a paragraph, you should place it in between the opening tag **<p>**
    and closing tag **</p>**. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Paragraph</title>

    </head>

    <body>

    <p>This text will be the first paragraph.</p>

    <p>This text will be the second paragraph.</p>

    <p>This text will be the third paragraph.</p>

    </body>

    </html>

    ```


    This code will produce the following output:


    This text will be the first paragraph.


    This text will be the second paragraph.


    This text will be the third paragraph.


    ### Line Break Tag


    If you wish to add a line break in between your text, you can use the **<br />**
    element and any text following it will start in a new line. Some tags do not need
    closing tags and such tags are called empty elements. The **<br />** element is
    one such empty element. They are called so because no content goes in between
    them.


    There is a space between **br** and **/** characters and if it is not added, older
    browsers will fail to render the line break. If the **/** is not added and just
    use **<br>**, it won''t work in XHTML, as it is invalid. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Line Break</title>

    </head>

    <body>

    <p>Hey<br /> How are you doing today?.<br /> Good Luck<br /> Peter</p>

    </body>

    </html>

    ```


    This code will produce the following output:


    Hey


    How are you doing today?


    Good Luck


    Peter


    ### Centering Content


    Sometimes you''ll need to place your content at the center of the table cell or
    page. For such cases, you can use the tag **<center>**. Here is an example.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Centering the Content</title>

    </head>

    <body>

    <p>This text has the default alignment.</p>

    <center>

    <p>This text is centered.</p>

    </center>

    </body>

    </html>

    ```


    This code will produce the following the output:


    This text has the default alignment.


    This text is centered.


    ### Horizontal Lines


    You can visually break up the sections present in a document using the Horizontal
    lines. The <hr> tag is used for creating a horizontal line from the left margin
    to the right margin. This will break the line accordingly. For instance, if you
    want to insert a line break in between two paragraphs, you can use the code given
    below.


    Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Horizontal Line</title>

    </head>

    <body>

    <p>This is the first paragraph. This is on the top of the line break.</p>

    <hr />

    <p>This is the second paragraph. This is at the bottom of the line break.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This is the first paragraph. This is on the top of the line break.


    This is the second paragraph. This is at the bottom of the line break.


    The <hr /> tag is also categorized as an **empty** element. This doesn''t need
    opening tags and closing tags as there is no content going in between.

    There is a space in between the characters **hr** and / in the **<hr />** element.
    If the space is omitted, older versions of browsers will have problem with the
    rendering the horizontal line and if the / is missed, it won''t be a valid element
    in XHTML.'
