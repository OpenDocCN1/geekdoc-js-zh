  md: '# # Chapter 8: HTML Images


    Images can be very helpful to beautify and to explain the complex concepts of
    your web page in a simple way. In this chapter, we will add images to your webpages
    in simple steps.


    # ## Insert Image


    In HTML, you can add any image to your web page with the <img> tag. The syntax
    for using the <img> tag is given below.


    Syntax:


    <img src="Image URL" ... attributes-list/>


    The <img> tag is an empty one, it means that there will be no closing tag for
    it. You can only give the list of attributes to this tag. Here is an example.


    **Example**


    For trying the below example, you need to keep the .htm file and the image within
    the same directory.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Using Image in Webpage</title>

    </head>

    <body>

    <p>Simple Image Insert</p>

    <img src="/html/images/test.png" alt="Test Image" />

    </body>

    </html>

    ```


    The above code will produce an output with the image used.


    Simple Image Insert


    HTML supports image formats like JPEG, PNG or GIF. You can use any of these image
    formats basing on your comfort. You should always ensure that you specify the
    correct file name of the image in **src** attribute. Always remember that the
    image names are case sensitive.


    There is a mandatory attribute called the **alt** attribute, which will specify
    an alternate text for the image, in cases where the image fails to be displayed.


    # ### Set Image Location


    It is recommended that you keep your images in a specific directory separately.
    We will put our .htm file in the home directory and the images in'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'a subdirectory called **images**, within the home directory. Here is an example.


    **Example**


    Here, we will assume the image location to be "/html/image/test.png", for this
    example.


    ```

    <!DOCTYPE html> <html> <head> <title>Using Image in Webpage</title> </head> <body>
    <p>Simple Image Insert</p> <img src="/html/images/test.png" alt="Test Image" />
    </body> </html>

    ```


    The above code will produce an output with the specified image.


    # Set Image Width/Height


    Depending on your requirements, you can set the height and width of an image with
    the help of the **height** and **width** attributes. The height and width for
    the image can either be specified in terms of its percentage with its actual size
    or in terms of pixels. Not that the original resolution of the image will change
    if the ratios are not maintained. Here is an example.


    **Example**


    ```

    <!DOCTYPE html> <html> <head> <title>Set Image Width and Height</title> </head>
    <body> <p>Setting image width and height</p> <img src="/html/images/test.png"
    alt="Test Image" width="200" height="150"/> </body> </html>

    ```


    The above code will produce an output image with the width 200 and height 150.


    # Set Image Border


    Every image by default will have a border surrounding it. You can specify the
    thickness of the border using the **border** attribute, in terms of pixels. If
    you wish to remove the border around your image, you should set the thickness
    to 0. Here is an example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Set Image Border</title> </head> <body> <p>Setting
    image Border</p> <img src="/html/images/test.png" alt="Test Image" border="3"/>
    </body> </html>

    ```'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'The above code will produce an output with the border 3.


    # Set Image Alignment


    All the images, by default, will be aligned to the left. You can specify the alignment
    of the image using the **align** attribute to set the image to the right or center.
    Here is an example.


    ```

    Example


    <!DOCTYPE html> <html> <head> <title>Set Image Alignment</title> </head> <body>
    <p>Setting image Alignment</p> <img src="/html/images/test.png" alt="Test Image"
    border="3" align="right"/> </body> </html>

    ```


    The above code will produce an output image aligned to the right, with a border
    3.'
