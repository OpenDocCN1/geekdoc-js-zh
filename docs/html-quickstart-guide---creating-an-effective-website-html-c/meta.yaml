- img_proc: true
  md: 'To make use of these parameters, you have to add a certain symbol after the
    embedded URL. At this stage, you do not really need to know what the symbol means,
    it is sufficient for you to just know that you have to use it. This symbol is
    the question mark, which should be added at the end of the URL, followed by the
    parameter you want to make use of. If you want to add several parameters to the
    same link, then you have to make use of the “&” symbol. Basically, just use the
    question mark for the first parameter, and then use the ampersand symbol for the
    other parameters.


    Let us now take a look at an easy way of adding these parameters to your embedded
    link:


    ```

    http://www.youtube.com/embed/enter_your_video_ID_here?autoplay=1

    ```


    If you notice, there is a number equated to autoplay. A parameter can have different
    functions. For example, autoplay parameter has the capability of either playing
    the video by default when it is opened, or not. Thus, 0 and 1 are its values,
    where *autoplay=1* stands for enabling autoplay and *autoplay=0* stands for disabling
    autoplay. This holds true not just for autoplay, but for all the YouTube parameters.
    YouTube itself has defined these parameters and given them these values for the
    corresponding functions, so you have to stick to this format.


    In a case where you want multiple parameters to be added into a single URL, then
    the syntax would go something like this:


    ```

    http://www.youtube.com/embed/enter_your_video_ID_here?

    autoplay=1&controls=0

    ```


    Here, the controls like play, pause and seeking will not be displayed, and the
    video will start playing automatically. That is what the value 0 does to the controls
    parameter. Now that you know about these parameters, your interest in the values
    of the parameters has probably piqued. Given below are some of the YouTube parameters,
    along with their values and their corresponding functions:


    # **Autohide**


    It decides if the player controls should be displayed or not.


    Value 0 makes the autohide parameter display the player control always.'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'Value 1 hides the player controls, as soon as the video has started playing

    Value 2 lets the browser choose between 0 and 1, depending on the player size.
    If the player is in 16:9 or 4:3 ratio, then option 1 will be selected, otherwise,
    option 0 is selected. This value is selected by default.


    # Autoplay


    Just as the name says, it decides whether the video should play as soon as the
    player loads or not.

    Value 0 - The video will not play as soon as the player loads. The user has to
    click to play the video. This option is toggled by default, since the choice of
    watching the video should lie in the user’s hands.

    Value 1 - The video will play as soon as the player loads, automatically.


    # Loop


    The loop parameter is used to decide if the video should loop and play repeatedly
    or not. It’s never a good idea to keep a video on loop, and it would be in your
    best interests to select the option which disables the loop option.

    Value 0 - By default, this is selected, and the video gets played only once.

    Value 1 - The video keeps playing and looping forever.


    # Playlists


    You can also create a playlist of YouTube videos. You do not need to create separate
    src codes, you can create a playlist using just a single source URL.

    First off, note down the ID of the YouTube playlist. You need this ID so that
    your browser can refer to it when you embed the playlist on your webpage. Now
    you have to use the videoseries parameter.

    An example code for embedding a playlist in your webpage would be:

    **http://www.youtube.com/embed/videoseries?list=ID_you_took_note_of**

    The method used to embed videos (iframe) here is the simplest of them all, and
    is highly recommended by YouTube as well. That does not necessarily mean that
    this is the only way of embedding videos on your webpage. Before <iframe> tag
    became popular, two tags were generally used: <object> and <embed> . Though deprecated
    from early 2015, it is still possible to use these tags, and as a website creator
    and designer, you need to know about using'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'these tags as well.

    Let us look at an example to further understand the syntax of the object and embed
    tags:


    # Object


    Before iframe became popular, the object tag was the de facto way of embedding
    any video on to a web page. It worked really well, but had some serious demerits,
    which is why YouTube currently disapproves of using the the <object> tag to embed
    its videos. We will see more about about why iframe is preferred over object later
    on. For now, let us take a look at a small example to see how the <object> tag
    works:


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <object width="420" height="315"

    data="http://www.youtube.com/embed/enter_the_video_ID_here">

    </object>

    </body>

    </html>

    ```


    As with the <iframe> tag, the object tag also requires you to specify the width
    to height aspect ratio, or you will face problems as the video begins to load.
    A notable change with the <object> tag is that the video is specified in the **data**
    attribute. There is no source src attribute here. As with iframe, there are several
    attributes you can use with the <object> tag, but you will not be using <object>
    tag much, and hence it will not be discussed in detail here, but if you really
    want to learn about the <object> tag, there are plenty of tutorials online that
    will be able to answer all your queries.


    # Embed


    Embed works the same as object does, but here (once again) the src attribute is
    used to point to the YouTube video. If you are using a really old browser, then
    chances are embed tag is the only option for you to embed videos on to your web
    page. Most of the very old browsers do not support the <object>'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'tag.

    Here is an example that depicts how the <embed> tag ought to be used to embed
    YouTube videos (or any video):


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <embed width="420" height="315"

    src="http://www.youtube.com/embed/enter_video_ID_here">

    </body>

    </html>

    ```


    # Why iframe?


    With all this in mind, let us now try and understand why the <iframe> tag is *much*
    more widely used than the other 2 tags.

    Essentially, iframe and the code embedded along with it are dynamic or ''live''.
    What this means is that if some changes are made either intentionally or unintentionally
    to the settings, the embedded code will automatically adjust itself to accommodate
    the new changes. For example, to let some videos run you need to have shockwave
    flash player installed. If the user does not have this installed, then the code
    automatically allows the user to view the video with the help of the plug-in or
    player installed in the webpage. Another advantage in using the iframe tag is
    the format used. Some browsers do not allow certain formats, as discussed earlier.
    This is especially true in HTML5, which supports only 3 formats! But when you
    include the same source file in different formats using the **source src** attribute
    in the <iframe> tag, then the browser gets the ability to automatically decide
    which format to play without the user or designer intervening. By default, the
    browser selects the first format that it recognizes and supports. While this may
    sound as a meagre issue to you right now, you will understand the problems behind
    <object> tag when you include a video file in a format that your browser does
    not support and end up staring at a huge blank screen, almost like the White Screen
    of Death).'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'Coming to <object> tag, the greatest drawback is that it is static. To be more
    accurate, the embedded code added along with the <object> tag is static. What
    this means it that it does not allow its code to vary according to changes made
    in the settings. When you use the <iframe> tag in embed your videos, you do not
    need to give much importance to shockwave-flash player. In stark contrast, if
    you decide to embed your videos using the <object> tag and do not have the required
    software (player) installed on your browser, all you will end up seeing is the
    blank screen.


    In essence, it is safe to say that going the <iframe> way is best, and will work
    out the best results. Only in cases where <iframe> fails should you need to start
    using the <object> and <embed> tags.


    # Adding plug-ins


    You may have the term ‘plug-ins’ used throughout this chapter. Plug-ins are nothing
    but small, simple helper applications that give the browser an additional function.
    It may be more appropriate to say that the plug-ins *extend* the functionality
    of a browser. There will be times when you will be expected to add a plug-in to
    let the browser you are using support some video or audio file. A characteristic
    of a good website is to have as less plug-ins as possible, however that does not
    mean you should not have any. Plug-ins make your task much easier, by allowing
    the browser to support formats that would have previously result in a white screen.
    Among the several hundred thousands of plug-ins available, Java applets are widely
    used. This is because they are easy to code, and can be coded from any platform.


    Plug-ins are also the major reason why <object> and <embed> tags are used. You
    can add the helper application for a diverse operations. Listed below are only
    a few:


    +   - Virus scans

    - GPS

    - Flash players


    As you can see, flash players are also plug-ins. Imagine surfing the internet
    without adobe shockwave! Sounds ridiculous, doesn’t it? This is why knowing about
    plug-ins and how to add them into a webpage becomes important.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'To embed plug-ins, you are required to use the <object> and <embed> tags.

    Let us now take an example to further understand how the object tag works.


    ```

    <!DOCTYPE html>


    <html>


    <body>


    <object width="500" height="100" data=“example.swf”></object>


    </body>


    </html>

    ```


    The .swf format stands for Shockwave Flash, and it is a format that used by files
    that have small animations and sound. The .swf format was designed specifically
    with speed and efficiency in mind, and as such, using .swf formats to display
    small animations might be a good idea. Now, onto the attributes - **width** and
    **height** do the same function as explained before (they decide the object’s
    dimensions. The **data** attribute is used to specify the file you are going to
    be displaying, be it an audio or video file, along with the format.


    This concludes the chapter on HTML multimedia. HTML5 will create new standards
    for multimedia, and sharing it will become easier than ever. Therefore it is imperative
    that you know about the basics of HTML5 as well (only after you master HTML, though).'
