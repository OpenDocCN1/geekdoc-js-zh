- md: '## iframe


    YouTube videos on to your webpage, and is recommended.


    The general syntax is:


    ```

    <iframe src="document_you_want_to_add">

    </iframe>

    ```


    As with audio and video tags, if you want to see if your current browser supports
    the iframe tag, just add some text within the `<iframe>` and `</iframe>` tags.
    If it gets displayed on the screen, then the browser does not support the tag.
    If there is no text, then that means the browser is giving you the green signal
    to proceed.


    The following steps will give you a clear idea on adding videos from YouTube to
    your webpage:


    - 1. Note the video ID. When you play a video on YouTube, a unique ID is generated,
    which you should make a note of.

    - 2. Create the `<iframe>` tag in your webpage, and make sure to include whatever
    height and width ratio you want in your player.

    - 3. Within the iframe tag, let the src attribute point towards the URL of the
    YouTube video. This is where the video ID you took note of earlier becomes useful.
    And that’s it! It is really simple, isn’t it?


    An example code is given below:


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <iframe width="420" height="345"

    src="http://www.youtube.com/embed/enter_your_video_ID_here">

    </iframe>

    </body>

    </html>

    ```


    Is that all you can do with YouTube videos? Definitely not! You can create playlists,
    make use of autohide, autoplay, controls, and loop functions that YouTube gives
    you permission for.


    To make use of these parameters, you have to add a certain symbol after the embedded
    URL. At this stage, you do not really need to know what the symbol means, it is
    sufficient for you to just know that you have to use it. This symbol is the question
    mark, which should be added at the end of the URL, followed by the parameter you
    want to make use of. If you want to add several parameters to the same link, then
    you have to make use of the “&” symbol. Basically, just use the question mark
    for the first parameter, and then use the ampersand symbol for the other parameters.


    Let us now take a look at an easy way of adding these parameters to your embedded
    link:


    ```

    http://www.youtube.com/embed/enter_your_video_ID_here?autoplay=1

    ```


    If you notice, there is a number equated to autoplay. A parameter can have different
    functions. For example, autoplay parameter has the capability of either playing
    the video by default when it is opened, or not. Thus, 0 and 1 are its values,
    where *autoplay=1* stands for enabling autoplay and *autoplay=0* stands for disabling
    autoplay. This holds true not just for autoplay, but for all the YouTube parameters.
    YouTube itself has defined these parameters and given them these values for the
    corresponding functions, so you have to stick to this format.


    In a case where you want multiple parameters to be added into a single URL, then
    the syntax would go something like this:


    ```

    http://www.youtube.com/embed/enter_your_video_ID_here?

    autoplay=1&controls=0

    ```


    Here, the controls like play, pause and seeking will not be displayed, and the
    video will start playing automatically. That is what the value 0 does to the controls
    parameter. Now that you know about these parameters, your interest in the values
    of the parameters has probably piqued. Given below are some of the YouTube parameters,
    along with their values and their corresponding functions:


    ### Autohide


    It decides if the player controls should be displayed or not.


    - Value 0 makes the autohide parameter display the player control always.

    - Value 1 hides the player controls, as soon as the video has started playing.

    - Value 2 lets the browser choose between 0 and 1, depending on the player size.
    If the player is in 16:9 or 4:3 ratio, then option 1 will be selected, otherwise,
    option 0 is selected. This value is selected by default.


    ### Autoplay


    Just as the name says, it decides whether the video should play as soon as the
    player loads or not.

    - Value 0 - The video will not play as soon as the player loads. The user has
    to click to play the video. This option is toggled by default, since the choice
    of watching the video should lie in the user’s hands.

    - Value 1 - The video will play as soon as the player loads, automatically.


    ### Loop


    The loop parameter is used to decide if the video should loop and play repeatedly
    or not. It’s never a good idea to keep a video on loop, and it would be in your
    best interests to select the option which disables the loop option.

    - Value 0 - By default, this is selected, and the video gets played only once.

    - Value 1 - The video keeps playing and looping forever.


    ### Playlists


    You can also create a playlist of YouTube videos. You do not need to create separate
    src codes, you can create a playlist using just a single source URL.

    First off, note down the ID of the YouTube playlist. You need this ID so that
    your browser can refer to it when you embed the playlist on your webpage. Now
    you have to use the videoseries parameter.

    An example code for embedding a playlist in your webpage would be:

    `http://www.youtube.com/embed/videoseries?list=ID_you_took_note_of`


    The method used to embed videos (iframe) here is the simplest of them all, and
    is highly recommended by YouTube as well. That does not necessarily mean that
    this is the only way of embedding videos on your webpage. Before `<iframe>` tag
    became popular, two tags were generally used: `<object>` and `<embed>`. Though
    deprecated from early 2015, it is still possible to use these tags, and as a website
    creator and designer, you need to know about using these tags as well.


    ### Object


    Before iframe became popular, the object tag was the de facto way of embedding
    any video on to a web page. It worked really well, but had some serious demerits,
    which is why YouTube currently disapproves of using the `<object>` tag to embed
    its videos. We will see more about why iframe is preferred over object later on.
    For now, let us take a look at a small example to see how the `<object>` tag works:


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <object width="420" height="315"

    data="http://www.youtube.com/embed/enter_the_video_ID_here">

    </object>

    </body>

    </html>

    ```


    As with the `<iframe>` tag, the object tag also requires you to specify the width
    to height aspect ratio, or you will face problems as the video begins to load.
    A notable change with the `<object>` tag is that the video is specified in the
    **data** attribute. There is no source src attribute here. As with iframe, there
    are several attributes you can use with the `<object>` tag, but you will not be
    using `<object>` tag much, and hence it will not be discussed in detail here,
    but if you really want to learn about the `<object>` tag, there are plenty of
    tutorials online that will be able to answer all your queries.


    ### Embed


    Embed works the same as object does, but here (once again) the src attribute is
    used to point to the YouTube video. If you are using a really old browser, then
    chances are embed tag is the only option for you to embed videos on to your web
    page. Most of the very old browsers do not support the `<object>` tag.


    Here is an example that depicts how the `<embed>` tag ought to be used to embed
    YouTube videos (or any video):


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <embed width="420" height="315"

    src="http://www.youtube.com/embed/enter_video_ID_here">

    </body>

    </html>

    ```


    ### Why iframe?


    With all this in mind, let us now try and understand why the `<iframe>` tag is
    *much* more widely used than the other 2 tags.

    Essentially, iframe and the code embedded along with it are dynamic or ''live''.
    What this means is that if some changes are made either intentionally or unintentionally
    to the settings, the embedded code will automatically adjust itself to accommodate
    the new changes. For example, to let some videos run you need to have shockwave
    flash player installed. If the user does not have this installed, then the code
    automatically allows the user to view the video with the help of the plug-in or
    player installed in the webpage. Another advantage in using the iframe tag is
    the format used. Some browsers do not allow certain formats, as discussed earlier.
    This is especially true in HTML5, which supports only 3 formats! But when you
    include the same source file in different formats using the **source src** attribute
    in the `<iframe>` tag, then the browser gets the ability to automatically decide
    which format to play without the user or designer intervening. By default, the
    browser selects the first format that it recognizes and supports. While this may
    sound as a meagre issue to you right now, you will understand the problems behind
    `<object>` tag when you include a video file in a format that your browser does
    not support and end up staring at a huge blank screen, almost like the White Screen
    of Death).'
  mdcn: '

    ## iframe


    将 YouTube 视频嵌入到你的网页中，这是推荐的方式。


    通用语法如下：


    ```

    <iframe src="document_you_want_to_add">

    </iframe>

    ```


    与音频和视频标签一样，如果你想查看当前浏览器是否支持 iframe 标签，只需在 `<iframe>` 和 `</iframe>` 标签内添加一些文本。如果屏幕上显示了文本，说明浏览器不支持该标签。如果没有显示文本，则意味着浏览器已为你亮起绿灯，可以继续操作。


    以下步骤将帮助你清晰地了解如何将 YouTube 视频添加到你的网页：


    - 1. 记下视频 ID。当你在 YouTube 上播放视频时，会生成一个唯一的 ID，你应该记下来。

    - 2. 在你的网页中创建 `<iframe>` 标签，并确保在播放器中包含你想要的任何高度和宽度比例。

    - 3. 在 iframe 标签内，让 src 属性指向 YouTube 视频的 URL。这就是你之前记下的视频 ID 发挥作用的地方。就这么简单，不是吗？


    下面是一个示例代码：


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <iframe width="420" height="345"

    src="http://www.youtube.com/embed/enter_your_video_ID_here">

    </iframe>

    </body>

    </html>

    ```


    这就是你能用 YouTube 视频做的全部事情吗？当然不是！你可以创建播放列表，使用 YouTube 允许的自动隐藏、自动播放、控件和循环功能。


    要使用这些参数，你需要在嵌入的 URL 后添加一个特定符号。在这个阶段，你实际上不需要知道这个符号的含义，只需知道你需要使用它就足够了。这个符号是问号，应添加在
    URL 的末尾，后面跟着你要使用的参数。如果你想向同一个链接添加多个参数，则需要使用“&”符号。基本上，第一个参数使用问号，其他参数使用与符号。


    现在让我们看看一种将这些参数添加到嵌入链接的简便方法：


    ```

    http://www.youtube.com/embed/enter_your_video_ID_here?autoplay=1

    ```


    如果你注意到，autoplay 被赋值了一个数字。一个参数可以具有不同的功能。例如，autoplay 参数可以决定视频在打开时是默认播放还是不播放。因此，0
    和 1 是它的值，其中 *autoplay=1* 代表启用自动播放，*autoplay=0* 代表禁用自动播放。这不仅适用于 autoplay，也适用于所有
    YouTube 参数。YouTube 本身定义了这些参数，并为它们分配了对应功能的值，因此你必须遵循这种格式。


    如果你想将多个参数添加到一个 URL 中，那么语法将如下所示：


    ```

    http://www.youtube.com/embed/enter_your_video_ID_here?

    autoplay=1&controls=0

    ```


    在这里，播放、暂停和进度控制等控件将不会显示，视频将自动开始播放。这就是 0 值对 controls 参数的作用。现在你已经了解了这些参数，你可能对参数的值产生了兴趣。以下是一些
    YouTube 参数及其对应的值和功能：


    ### 自动隐藏


    它决定播放器控件是否应显示。


    - 值 0 使自动隐藏参数始终显示播放器控件。

    - 值 1 在视频开始播放后立即隐藏播放器控件。

    - 值 2 让浏览器根据播放器大小在 0 和 1 之间选择。如果播放器采用 16:9 或 4:3 比例，则选择选项 1，否则选择选项 0。默认选择此值。


    ### 自动播放


    顾名思义，它决定视频是否在播放器加载后立即播放。

    - 值 0 - 视频不会在播放器加载后立即播放。用户必须点击才能播放视频。由于观看视频的选择权应掌握在用户手中，因此此选项默认处于切换状态。

    - 值 1 - 视频会在播放器加载后自动开始播放。


    ### 循环


    循环参数用于决定视频是否应循环重复播放。让视频循环播放从来都不是个好主意，选择禁用循环选项对你最有利。

    - 值 0 - 默认选择此项，视频只播放一次。

    - 值 1 - 视频将持续播放并永远循环。


    ### 播放列表


    你也可以创建 YouTube 视频的播放列表。你不需要创建单独的 src 代码，可以只使用一个源 URL 来创建播放列表。

    首先，记下 YouTube 播放列表的 ID。你需要这个 ID，以便浏览器在将播放列表嵌入网页时能够引用它。现在你需要使用 videoseries 参数。

    将播放列表嵌入网页的示例代码为：

    `http://www.youtube.com/embed/videoseries?list=ID_you_took_note_of`


    这里用于嵌入视频的方法（iframe）是所有方法中最简单的，也是 YouTube 高度推荐的。这并不一定意味着这是在网页上嵌入视频的唯一方式。在 `<iframe>`
    标签流行之前，通常使用两个标签：`<object>` 和 `<embed>`。尽管自 2015 年初以来已弃用，但仍然可以使用这些标签，作为网站创建者和设计者，你也需要了解如何使用这些标签。


    ### Object


    在 iframe 流行之前，object 标签是嵌入任何视频到网页上的事实标准。它运行良好，但存在一些严重的缺点，这就是为什么 YouTube 目前不赞成使用
    `<object>` 标签来嵌入其视频。我们稍后将更详细地了解为什么 iframe 优于 object。现在，让我们看一个小例子，了解 `<object>`
    标签的工作原理：


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <object width="420" height="315"

    data="http://www.youtube.com/embed/enter_the_video_ID_here">

    </object>

    </body>

    </html>

    ```


    与 `<iframe>` 标签一样，object 标签也需要你指定宽度与高度的比例，否则视频开始加载时会遇到问题。与 `<object>` 标签的一个显著变化是视频在
    **data** 属性中指定。这里没有源 src 属性。与 iframe 一样，`<object>` 标签有几个可用的属性，但你不会经常使用 `<object>`
    标签，因此这里不会详细讨论，但如果你真的想了解 `<object>` 标签，网上有很多教程能够回答你所有的问题。


    ### Embed


    Embed 的工作方式与 object 相同，但这里（再次）使用 src 属性指向 YouTube 视频。如果你使用的是非常旧的浏览器，那么 embed 标签可能是你在网页上嵌入视频的唯一选择。大多数非常旧的浏览器不支持
    `<object>` 标签。


    以下是一个示例，展示了如何使用 `<embed>` 标签来嵌入 YouTube 视频（或任何视频）：


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <embed width="420" height="315"

    src="http://www.youtube.com/embed/enter_video_ID_here">

    </body>

    </html>

    ```


    ### 为什么是 iframe？


    考虑到所有这些，现在让我们来理解为什么 `<iframe>` 标签比其他两个标签使用得*多*得多。

    本质上，iframe 及其嵌入的代码是动态的或“活的”。这意味着，如果设置被有意或无意地做出一些更改，嵌入的代码将自动调整自身以适应这些新更改。例如，要让某些视频运行，你需要安装
    shockwave flash player。如果用户没有安装这个插件，代码会自动允许用户借助网页中安装的插件或播放器来观看视频。使用 iframe 标签的另一个优势是格式。如前所述，某些浏览器不允许某些格式。在
    HTML5 中尤其如此，它只支持 3 种格式！但是，当你使用 `<iframe>` 标签中的 **source src** 属性包含不同格式的相同源文件时，浏览器就能够自动决定播放哪种格式，而无需用户或设计者干预。默认情况下，浏览器会选择它识别并支持的第一种格式。虽然你现在可能觉得这是个微不足道的问题，但当你包含一个浏览器不支持格式的视频文件，最终只能盯着一个巨大的空白屏幕（几乎就像白屏死机）时，你就会理解
    `<object>` 标签背后的问题了。

    '
