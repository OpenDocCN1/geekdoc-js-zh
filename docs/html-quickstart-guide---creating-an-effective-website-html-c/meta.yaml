- md: "## Chapter 11: HTML Multimedia\n\nComing to the `<object>` tag, the greatest\
    \ drawback is that it is static. To be more accurate, the embedded code added\
    \ along with the `<object>` tag is static. What this means is that it does not\
    \ allow its code to vary according to changes made in the settings. When you use\
    \ the `<iframe>` tag to embed your videos, you do not need to give much importance\
    \ to the Shockwave Flash player. In stark contrast, if you decide to embed your\
    \ videos using the `<object>` tag and do not have the required software (player)\
    \ installed on your browser, all you will end up seeing is a blank screen.\n\n\
    In essence, it is safe to say that going the `<iframe>` way is best, and will\
    \ work out the best results. Only in cases where `<iframe>` fails should you need\
    \ to start using the `<object>` and `<embed>` tags.\n\n### Adding plug-ins\n\n\
    You may have the term ‘plug-ins’ used throughout this chapter. Plug-ins are nothing\
    \ but small, simple helper applications that give the browser an additional function.\
    \ It may be more appropriate to say that the plug-ins *extend* the functionality\
    \ of a browser. There will be times when you will be expected to add a plug-in\
    \ to let the browser you are using support some video or audio file. A characteristic\
    \ of a good website is to have as few plug-ins as possible, however that does\
    \ not mean you should not have any. Plug-ins make your task much easier, by allowing\
    \ the browser to support formats that would have previously resulted in a white\
    \ screen. Among the several hundred thousand plug-ins available, Java applets\
    \ are widely used. This is because they are easy to code, and can be coded from\
    \ any platform.\n\nPlug-ins are also the major reason why `<object>` and `<embed>`\
    \ tags are used. You can add the helper application for diverse operations. Listed\
    \ below are only a few:\n\n-   Virus scans\n-   GPS\n-   Flash players\n\nAs you\
    \ can see, flash players are also plug-ins. Imagine surfing the internet without\
    \ Adobe Shockwave! Sounds ridiculous, doesn’t it? This is why knowing about plug-ins\
    \ and how to add them into a webpage becomes important.\n\nTo embed plug-ins,\
    \ you are required to use the `<object>` and `<embed>` tags. Let us now take an\
    \ example to further understand how the object tag works.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<object width=\"500\" height=\"100\" data=\"example.swf\"\
    ></object>\n</body>\n</html>\n```\n\nThe .swf format stands for Shockwave Flash,\
    \ and it is a format that is used by files that have small animations and sound.\
    \ The .swf format was designed specifically with speed and efficiency in mind,\
    \ and as such, using .swf formats to display small animations might be a good\
    \ idea. Now, onto the attributes - **width** and **height** do the same function\
    \ as explained before (they decide the object’s dimensions). The **data** attribute\
    \ is used to specify the file you are going to be displaying, be it an audio or\
    \ video file, along with the format.\n\nThis concludes the chapter on HTML multimedia.\
    \ HTML5 will create new standards for multimedia, and sharing it will become easier\
    \ than ever. Therefore it is imperative that you know about the basics of HTML5\
    \ as well (only after you master HTML, though).\n\n## Chapter 12: HTML5 and Semantics\n\
    \nOnce you have truly mastered HTML, you will begin to notice that the tags you\
    \ use usually make no sense, unless you know what it does. For example, consider\
    \ the tag `<div>`. When a person who has no knowledge of HTML sees this tag, he\
    \ or she will *never* be able to figure out the true meaning of the tag, or its\
    \ function. This isn’t really much of an issue, but it is quite annoying. We evolved\
    \ from having to use just binary numbers to using text. Why not take it a step\
    \ further and use text that actually makes sense to both man and machine? This\
    \ is exactly what HTML5 does. With HTML5, semantic elements have been added, using\
    \ which HTML coding has become extremely easy. We have already discussed in detail\
    \ about one semantic element, though it was not mentioned at the time: `<form>`.\
    \ Yes, the form tag is a semantic element! When you see the tag `<form>`, you\
    \ automatically realize it has something to do with forms, and you can start adding\
    \ attributes accordingly.\n\nGiven below is a list of some of the semantic elements\
    \ that HTML5 offers:\n\n-   `<details>`\n-   `<article>`\n-   `<section>`\n- \
    \  `<summary>`\n-   `<time>`\n-   `<aside>`\n-   `<mark>`\n\nWe shall now proceed\
    \ to look at some examples to understand how these tags work.\n\n### Article\n\
    \nThe article tag lets you create an article. You can, of course, create an article\
    \ that has some relation to the web page, but the general idea of an article is\
    \ that each article should be different. Therefore, the `<article>` tag is used\
    \ when you want to mention something that goes out of context, or is not related\
    \ to the main topic of the website in the slightest.\n\nHere is an example code\
    \ which you can try out:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<article>\n\
    \ <h2>This is the article's heading</h2>\n <p>With the help of the article tag,\
    \ you can create articles that provide content not related to the webpage.</p>\n\
    </article>\n</body>\n</html>\n```\n\nThe above code will execute the text given,\
    \ with the heading in the `<h2>` size.\n\n### Section\n\nSections are groups of\
    \ content that are based on a single idea or theme. This is how they differ from\
    \ articles, where the theme can be anything. Sections have to stick to one theme\
    \ for the word to make sense. Here is an example of how 2 sections can be put\
    \ together in HTML:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<section>\n <h1>Section\
    \ 1</h1>\n <p>This is section 1's content. This section states that HTML coding\
    \ is easy to learn, and easy to forget, so stay in practice if you want to become\
