    # # Chapter 4: HTML Phrase Tags


    The phrase tags in HTML are designed for performing specific purposes. They look
    similar to other tags like <b>, <i>, <pre>, and <tt>, which we have already seen
    in our previous chapters. In this chapter we will go through the important phrase
    tags in HTML.


    # ## Emphasized Text


    Any content that is placed in between the <em>...</em> element will be shown as
    emphasized text. Here is an example.


    Example:


    ```

    <!DOCTYPE html> <html> <head> <title>Example for Emphasized Text</title> </head>
    <body> <p>The following word uses a <em>emphasized</em> typeface.</p> </body>
    </html>

    ```


    The above code will produce the following output:


    The following word uses an *emphasized* typeface.


    # ## Marked Text


    Any content that is placed in between the <mark>...</mark> element will be shown
    as marked text, with a yellow link. Here is an example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Marked Text Example</title> </head> <body>
    <p>The following word has been <mark>marked</mark> with yellow</p> </body> </html>

    ```


    The above code will produce the following output:


    The following word has been marked with yellow.


    # ## Strong Text


    Any content that is placed in between the <strong>...</strong> element will be
    shown as important text. Here is an example.


    Example'
