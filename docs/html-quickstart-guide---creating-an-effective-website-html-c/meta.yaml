    \ smaller in size.\n\nUncompressed wav audio files are surprisingly large, but\
    \ are supported by most of the browsers. Ogg has the smallest size, but it is\
    \ not universal unfortunately. Several browsers do not accept ogg audio files.\
    \ Therefore, mp3 audio files would be the best option to go for, as they are moderate\
