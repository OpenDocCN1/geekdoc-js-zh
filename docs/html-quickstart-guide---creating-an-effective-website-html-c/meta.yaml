    \n# 第 5 章：Meta 标签\n\n在 HTML 中，你被允许以不同方式指定元数据，即关于文档的额外重要信息。你可以使用 META 元素来包含名称/值对，以描述文档的属性，例如文档作者、作者、过期日期、关键词列表等。\n\
