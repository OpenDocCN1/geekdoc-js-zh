  md: '# Chapter 5: Meta Tags


    In HTML, you are allowed to specifying metadata, which is the additional important
    information regarding the document, in different ways. You can use the META elements
    for including name/value pairs for describing the properties of the document,
    such as document author, author, expiry date, the list of keywords, etc.,


    Such additional information can be provided using the <meta> tag. There are no
    closing tags for the Meta tag and hence it is an empty element. Though it is an
    empty element, but the information can be passed through its attributes.


    In general, you can add more than one meta tags to your document, basing on the
    information that you are adding to your document. The physical appearance of your
    document will not have any effect because of meta tags. From the application point
    of view, it doesn''t matter if meta tags are included or not.


    # Adding Meta Tags to Your Documents


    You can provide a Meta data to your pages by adding <meta> tags within The document’s
    header, represented by the tags <head> and </head>. In addition to their core
    attributes, they can have the following attributes:


    | Attribute | Description |

    | --- | --- |

    | Name | Name for the property. Can be anything. Examples include, keywords, description,
    author, revised, generator etc. |

    | content | Specifies the property''s value. |

    | scheme | Specifies a scheme to interpret the property''s value (as declared
    in the content attribute). |

    | http-equiv | Used for http response message headers. For example http-equiv
    can be used to refresh the page or to set a cookie. Values include content-type,
    expires, refresh and set-cookie. |


    # Specifying Keywords


    Important keywords that are related to the document can be specified using'
