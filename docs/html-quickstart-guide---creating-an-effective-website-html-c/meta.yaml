  md: 'This content will be aligned to the right.

    This content will be aligned to the center.

    This content will be aligned to the left.


    # Internationalization Attributes


    In HTML, there are a total of three internationalization attributes. These are
    available for most of the XHTML elements, but not for all.


    +   - dir

    - lang

    - xml:lang


    # The dir Attribute


    You can specify the text flow direction to the browser by using the **dir** attribute.
    This attribute can take two values, as shown in the table given below.


    | Value | Meaning |

    | --- | --- |

    | ltr | Left to right (this will be the default value) |

    | rtl | Right to left (for languages such as Hebrew or Arabic that are read right
    to left) |


    Example


    ```

    <!DOCTYPE html> <html dir="rtl"> <head> <title>Display Directions</title> </head>
    <body> This is how IE 5 renders right-to-left directed text. </body> </html>

    ```


    The above code will produce the following output:

    This is how IE 5 renders right-to-left directed text.


    If the **dir** attribute is placed inside the<html> tag, it will determine how
    the text of the entire document will be presented. If this attitude is use the
    inside another tag, it will just to control the direction of the text contained
    in that specific tag.


    # The lang Attribute


    You can indicate the main language that is to be used in your document by using
    the **lang** attribute. The only reason for keeping this attribute is HTML'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'is for the backwards compatibility with previous versions of HTML. In the new
    XHTML documents, this attribute is replaced with the **xml:lang** attribute.


    The *lang* attributes have the values as ISO 639 standard 2-character language
    codes. You can check the complete list of language codes with the [HTML Language
    Codes: ISO 639](https://www.tutorialspoint.com/html_tags/html_language_codes.htm).


    Example


    ```

    <!DOCTYPE html> <html lang="en"> <head> <title>English Language Page</title> </head>
    <body> This page is using English Language </body> </html>

    ```


    # The xml:lang Attribute


    In XHTML, the *xml:lang* attribute is used as a replacement for the original *lang*
    attribute used in earlier versions of HTML. As mentioned above, the *xml:lang*
    attribute value should be an ISO-639 country code.


    # Generic Attributes


    There are a few other attributes that can be readily used with most of the HTML
    tags. The list of those attributes is given in the table below.'
