    ## Chapter 7: HTML Forms


    Most websites have at least one page that asks its visitors for feedback, or requests
    them to subscribe by giving their e-mail. To be able to do this, you need to have
    several text boxes in the page, where the users give their inputs. Forms are used
    pretty much everywhere, though it goes unnoticed. When you log into your e-mail,
    Facebook, or anything that requires a username and password, you’re using a form
    to input your data. This can be done in HTML by using forms, and its elements.


    The idea behind a form is that the visitor uses the text box to input some data,
    and the data gets posted to a back-end application like ASP or PHP script. This
    application can be configured to perform whatever action the webpage creator wants
    using his own logical algorithms. Listed below are some commonly used elements
    and attribute which you *must* know about to create a form that can capture your
    visitor’s attention:


    ### Input

    The most important element out there, you use this to get the input from the user.
    There are various input attributes like text, radio buttons, and the submit button.
    Radio buttons are used to select from different options which you give, and the
    other two are fairly straightforward to understand. The syntax is `<input>`.


    ### TextArea

    When you want your user to enter something that goes beyond a single line, such
    as a paragraph to describe their professional expertise, you need to use the TextArea
    element.


    ### Button

    This element creates a button which when clicked, performs some action.


    ### Select

    Though not needed in forms where the user has to type his details, knowing about
    this element makes it easier for your visitors. Select element creates a drop-down
    list, from which the visitor can select one option.


    ## Legend


    An important element you should consider if you want your form to look organized,
    the legend creates a caption for the fieldset tag element which groups together
    related fields in the form.


    ## HTML5 elements


    These are elements unique to HTML5, and cannot be used elsewhere.


    ## Datalist


    When you want the user to get a list of options as soon as he starts typing, then
    Datalist can be used. This is different from the Select element, where the user
    can only select from a list of options. The Datalist element displays a list if
    the user clicks the arrow mark, and also displays the relevant choice as soon
    as the user starts typing.


    ## Keygen


    When you want to create a secure way to authenticate users, then the keygen element
    can be used. It creates 2 keys, out of which one is stored locally (the private
    key) and the other is sent to the server (the public key).


    This list covers some of the most commonly used HTML form elements, and there
    are lots more to experiment with. Try these out first, and then start experimenting
    with different elements! Below are some example codes that you can use, or modify
    to suit your needs. The `<form>` tag has to be used to use the form elements in
    your webpage. Compared to elements, there are several times more attributes, so
    most of the commonly used attributes will be explained after the corresponding
    codes.


    ## Form Action


    Before we head onto the example codes, there’s one form attribute which you *must*
    know about, which is the "**form action**". This attribute decides which the page
    the data entered should be sent to, as soon as the submit button is pressed. It
    is here where the input gets processed. By processing, what is meant is that you
    can either display the details to the user, or just send it to a MySQL database,
    where it can be stored for future use. However, using form action requires you
    have to prior knowledge of ASP or PHP scripts. Since this book focuses on HTML
    alone, ASP and PHP will not be discussed here. There are several tutorials online
    that explain PHP and ASP in detail. It''s not really all that difficult to understand,
    and you have to know about it, or HTML forms become useless since you need to
    send the details obtained from the user to a form handler in order to actually
    have some use for them. When it comes to the syntax of the form action, it''s
    quite simple:


    ```

    <form action="page.php" method="method_you_want">

    ```


    ## Get and Post


    Now this is pretty straightforward. The page.php refers to the page you want to
    send the details to. If you do not have a page defined previously, then all you
    will get is a ‘File not found’ message, since no such file exists. However, if
    you look at the URL or go through the information provided in the File not found
    message, you will notice that the details that the user had entered appear explicitly.
    This brings us to the method used in the form action.


    There are two form actions, GET and POST. If no option is selected in the beginning,
    then the GET option is set as default. The problem with GET is that whatever detail
    the user inputs, it gets displayed in the URL. While this may not pose a problem
    when the user is at home, imagine a scenario when he or she uses your form to
    enter details in a public place, or on a computer that’s common to all. A small
    history check will open up the previously visited websites, along with the passwords
    and usernames in the URL. This is a huge security threat, which moves this guide
    toward the POST method.


    In the POST method, the same action occurs - that is, the details get sent to
    the PHP or ASP script or a page where the details get processed - but nothing
    appears on the URL except the page that the form action sends the details to.


    If you want to use the POST method, use the following syntax:


    ```

    <form action="page.php" method="POST">

    ```


