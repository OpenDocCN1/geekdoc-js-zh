    # HTML Definition Lists


    XHTML an HDMI support a list style called the **definition list**. Here are the
    entities will be listed like as they are in a encyclopaedia or dictionary. Using
    the definition list is ideal for representing a list of items, glossary, or other
    value/name lists.


    The given tags will be used by the definition list.


    +   - <dl> - Defines the start of the list

    - <dt> - A term

    - <dd> - Term definition

    - </dl> - Defines the end of the list


