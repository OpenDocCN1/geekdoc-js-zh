    0\" max=\"100\">\n<input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\n\
    This would create a slider with a range of 0-100%, and you will be able to select\
    \ any value in between. This accepts only whole numbers however. An ideal example\
    \ of this would in a form that gets input from the user regarding their fat percentage,\
    \ height, and weight, and then give the Body Mass Index (BMI) as an output. Here,\
    \ instead of getting the input from the user as numbers for the fat percentage,\
    \ you can use a slider to do so. In the end, what matters is that the form is\
    \ easy to use, and not how the input is obtained.\n\nNote that the `<input type=\"\
    range\">` tag is not supported in Internet Explorer 9 and its previous versions.\n\
    \n## Time and Week\n\nThe time and week tags allow the user to input the time\
    \ and week, as well as year. If your form requires your user to input his or her\
    \ birth year, then using these tags will make it much easier, since it pops up\
