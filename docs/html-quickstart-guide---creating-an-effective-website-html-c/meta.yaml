    \ obtain a list that has several sub-headings (you get the same number of sub-headings\
    \ as the <optgroup> tags used) under which the models will be listed. If you are\
    \ using the <select> tag to get some input from the user, and your options are\
    \ quite large in number, then you *must* use the <optgroup> tag.\n\nThe 'label'\
    \ in the <optgroup> syntax is the name you want to give the sub-heading. Note\
    \ that only the options can be selected, and the sub-headings cannot.\n\n# Readonly\n\
    \nSometimes you require a field which has a set value or text in it, which the\
    \ user should not be able to change, but should be able to see. When you have\
    \ such a situation in your hands, the **<readonly>** attribute becomes useful.\
    \ Just as the name suggests, the user will be able to only read what is given\
    \ in the field, and will not be able to make changes to the field.\n\nThe syntax\
    \ for <readonly> tag is:\n\n```\n<input type=\"type_you_need\" name=\"name\" value=\"\
    value\" readonly>\n```"
