- md: "Let us now take a look at the different attributes included in this example.\n\
    \n## Width and Height\n\nUnder the `<video>` tag, width and height are mentioned,\
    \ which are the dimensions of the video as it appears on the webpage. If you do\
    \ not include the width and height attributes, the browser will automatically\
    \ select the default width to height ratio of the video. When you go for the default\
    \ video size as chosen by the browser, the video will begin to flicker whenever\
    \ it loads, which becomes an annoying issue.\n\nHowever, if you do include these\
    \ two attributes, but give lower aspect ratios than the actual video, then the\
    \ video displayed on the webpage will be scaled down proportionately. If you give\
    \ the width and height attributes a value greater than the video’s actual aspect\
    \ ratio, then the video will cover more screen, but the video size remains as\
    \ is. The rest of the area gets filled by a black space. For a user, this would\
    \ look absolutely horrible, and you should avoid giving greater aspect ratios\
    \ at all costs. When worst comes to worst and you are not able to find out the\
    \ aspect ratio of the video, then just include the video without any aspect ratio.\
    \ The default video size look will be much better than the same sized video being\
    \ displayed in large black space.\n\n## Controls\n\nYou must have seen the play,\
    \ pause, seeking, volume, toggle full-screen, captions/subtitles and other controls\
    \ in most of the video streaming websites you have used. These are nothing but\
    \ the ‘controls’ in HTML5. Instead of adding these options one by one, HTML5 makes\
    \ it extremely easy; all you have to do is include the term ‘controls’ in the\
    \ video tag, and all of these options become available in the video.\n\nIt’s important\
    \ to note that the full-screen option may not be available to you if the browser\
    \ does not support it. It is mandatory that you check which browser accepts the\
    \ video format you are using, and which browser allows the full-screen option.\n\
    \n## Source\n\nSource src is literally as it sounds - this is what you have to\
    \ use to specify which video you want to embed on to the website. When you include\
    \ multiple source files in different formats, then the browser will automatically\
    \ use the first format that it recognizes. Basically, the source attribute is\
    \ your way of telling the browser to pick whatever format it wants.\n\n## Allowfullscreen\n\
    \nAn attribute that would make users extremely happy, the allowfullscreen attribute\
    \ does what it says. It gives the user a choice of using the full-screen option.\
    \ Usually, when videos are played, they do not maximize automatically, and in\
    \ most cases there will not be an option to play the video in the entirety of\
    \ the screen since the videos are normally played within the specified iframes.\
    \ However, in HTML5, the allowfullscreen attribute makes everything better by\
    \ adding the full-screen feature. When the attribute is enabled, you should be\
    \ able to see a full-screen button at the bottom right corner of the video, which\
    \ when clicked opens the video in a fullscreen. This attribute should not really\
    \ pose a problem to you, since most browsers allow fullscreen options. An important\
    \ point for you to note here is that *only* if the browser used itself has a fullscreen\
    \ option will the allowfullscreen attribute work.\n\n## Autoplay\n\nThis is a\
    \ very dangerous attribute to experiment with. It does not really have any technical\
    \ problems, but this feature can either make or break your user-base. When the\
    \ `<autoplay>` attribute is included, the video you have embedded on to your website\
    \ starts playing as soon as the page loads. While this may make it seem like you\
    \ are actually doing the user a favor by automatically playing the video for him\
    \ or her, if the user has a slow connection then the page will take quite a long\
    \ time to load. This means that the chances of losing your users increases drastically.\n\
    \nTo enable autoplay, just add the ‘autoplay’ at the end of the video tag, as\
    \ shown in the following example:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<video>\n\
    \  <source src=\"example.mp4\" type=\"example/mp4\" autoplay>\n```\n\nLooks like\
    \ your browser does not support the mp4 format. Try another browser, or change\
    \ the format now.\n\n```\n</video>\n</body>\n</html>\n```\n\nThis is the same\
    \ code, with the addition of autoplay. If the browser supports the video format,\
    \ then the video automatically plays in the webpage.\n\nWith this, we come to\
    \ conclusion of the video tag being used in HTML5 to embed videos on to your webpage.\
    \ Embedding videos on to your webpage has become very easy with HTML5, but do\
    \ take care and ensure that the web browser your users will be using actually\
    \ supports the format.\n\nMP4, Ogg, and WebM are all together supported only by\
    \ Google Chrome, Mozilla Firefox and Opera at the moment. Make sure to use these\
    \ browsers, to ensure that the video you are embedding is able to be viewed on\
    \ the web page.\n\nLet us now take a look at integrating audio on to your webpage.\n\
    \n## Adding Audio\n\nAs with videos, prior to HTML5, audio could not be integrated\
    \ into a website easily. The website designer had to use additional programs called\
    \ plug-ins to let the audio play in the website. That is to say, there was no\
    \ standard. HTML5 once again swept away these hardships and brought us a new,\
    \ easy way for playing audio files in a web page: the `<audio>` tag.\n\nHTML supported\
    \ different audio formats, but only with the help of the annoying plug-ins (which\
    \ used to be the primary reason for the webpage crashing). HTML5 however, is picky\
    \ with audio as well as video, and allows *only 3* formats. These are the ogg,\
    \ mp3, and wav formats.\n\nWith these three options at hand, a question might\
    \ pop in your head, asking which format should be used. All these formats pale\
    \ in comparison to the size of the average video file, and you should be able\
    \ to use any of them. However, audio files with the mp3 extension traditionally\
    \ are bigger in size than the audio files with the ogg extension. With regards\
    \ to quality, mp3 is better than ogg, but the difference in the quality is so\
    \ tiny that you will not even be able to recognize it. It is safe to say that\
    \ it does not really matter either way. With respect to wav however, both ogg\
    \ and mp3 formats are smaller in size.\n\nUncompressed wav audio files are surprisingly\
    \ large, but are supported by most of the browsers. Ogg has the smallest size,\
    \ but it is not universal unfortunately. Several browsers do not accept ogg audio\
    \ files. Therefore, mp3 audio files would be the best option to go for, as they\
    \ are moderate in size, and are supported by all browsers.\n\nLet us now take\
    \ a look at an example for better understanding of how certain audio files can\
    \ be added to your webpage:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<audio controls>\n\
    \  <source src=\"example.ogg\" type=\"example/ogg\">\n  <source src=\"example.mp3\"\
    \ type=\"example/mpeg\">\n</audio>\n</body>\n</html>\n```\n\n## Source\n\nThe\
    \ `<source>` part of the code does exactly the same thing as the `<source>` in\
    \ the video section explained above. It simply tells the browser which audio file\
    \ to select. If multiple formats are given, then the browser will decide to take\
    \ the first format that it can support. The others would be disregarded.\n\n##\
    \ Controls\n\nThe controls attribute gives the audio file on the webpage options\
    \ like play, volume and pause, which are essential in any audio file.\n\nWhen\
    \ you are unsure of whether the browser you are using supports a particular file,\
    \ try executing the following example code:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n<audio controls>\n  <source src=\"example.ogg\" type=\"example/ogg\">\n\
    \  <source src=\"example.mp3\" type=\"example/mpeg\">\nDoes not support, apparently.\n\
    </audio>\n</body>\n</html>\n```\n\nIf you see the text that you have typed in\
    \ above on the screen, then that means the browser does not support the format\
    \ you are using. Basically, all the text within the `<audio>` and `</audio>` tags\
    \ will not be displayed if the browser supports the format. The displaying of\
    \ the text is a clear indication that you should either change the browser being\
    \ used, or the format being used.\n\n## Embedding YouTube videos\n\nHere is an\
    \ interesting and easy way of embedding videos that are online on your website.\
    \ Of course, you have to give credits to the original owners, but you *can* embed\
    \ online videos. The next part of this chapter will focus on how to embed YouTube\
    \ videos (the most widely used video-sharing website) on to your own website.\
    \ In HTML5, you can embed videos easily, but as stated before, embedding videos\
    \ and audio in HTML is very difficult, unless you just use YouTube.\n\nTo know\
    \ more about embedding YouTube videos, let us first take a look and try to understand\
    \ the function of a very important element in this context:\n\n## iframe\n\nThe\
    \ iframe tag is used to specify an inline frame (‘i’ in iframe stands for inline).\
    \ What this means is that you can embed another document within the document you\
    \ are currently working on. This is a really easy way to embed"
  mdcn: "\n现在让我们来看一下此示例中包含的不同属性。\n\n## 宽度和高度\n\n在 `<video>` 标签下，提到了宽度和高度，这是视频在网页上显示时的尺寸。如果你不包含宽度和高度属性，浏览器将自动选择视频的默认宽高比。当你选择浏览器默认的视频尺寸时，视频在加载时会开始闪烁，这成为一个恼人的问题。\n\
    \n但是，如果你确实包含了这两个属性，但给出的宽高比低于实际视频的宽高比，那么网页上显示的视频将按比例缩小。如果你给宽度和高度属性的值大于视频的实际宽高比，那么视频将覆盖更多屏幕，但视频大小保持不变。其余区域将由黑色空间填充。对于用户来说，这看起来会非常糟糕，你应该不惜一切代价避免给出更大的宽高比。当最坏的情况发生，而你又无法找出视频的宽高比时，那就直接在不指定宽高比的情况下嵌入视频。默认的视频大小观感，会比同样大小的视频显示在大片黑色空间中要好得多。\n\
    \n## Controls\n\n你一定在大多数使用过的视频流网站上见过播放、暂停、进度调节、音量、全屏切换、字幕/副标题和其他控件。这些不过是 HTML5\
    \ 中的 'controls'（控件）。HTML5 使得添加这些选项变得极其简单；你只需在视频标签中包含 'controls' 这个词，所有这些选项就会在视频中可用。\n\
    \n需要注意的是，如果浏览器不支持，全屏选项可能对你不可用。你必须检查哪个浏览器接受你使用的视频格式，以及哪个浏览器允许全屏选项。\n\n## Source\n\
    \nSource src 字面意思就是它的声音——这是你用来指定要嵌入网站的视频的。当你在不同格式中包含多个源文件时，浏览器将自动使用它识别的第一种格式。基本上，source\
    \ 属性是你告诉浏览器选择它想要的任何格式的方式。\n\n## Allowfullscreen\n\n一个会让用户非常高兴的属性，allowfullscreen\
