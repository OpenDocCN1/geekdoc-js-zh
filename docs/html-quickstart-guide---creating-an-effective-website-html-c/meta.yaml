  md: '```

    <body>

    <form action="action_page.php" autocomplete="on">

    Name:<input type="text" name="name"><br>

    Age:<input type="number" name="age"><br>

    Work ID <input type="number" name="id" autocomplete="off"><br>

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    This code will create 3 fields, one each for name, age and work ID. The first
    time the user uses the form, he or she will have to type in the details completely.
    From then on, whenever the form is used, autocomplete will kick in as soon as
    the field is double-clicked, or the first letter is typed, making everything so
    much more easier for the user.


    Note that autocomplete is switched off for the Work ID. This is done because the
    Work ID, which should be kept private should not be displayed to others who type
    in someone else’s name. What this basically means is that you can switch autocomplete
    attribute off to which field you want by adding an <autocomplete=“off”> at the
    end of the input type.


    This covers most of the HTML form elements, and you should be able to create your
    own form with different elements and attributes now. Always remember to keep trying
    different elements to find out what makes the form easy to use. The ultimate aim
    of a form is to make it easy to use so that even a layman will be able fill it
    up quickly.'
