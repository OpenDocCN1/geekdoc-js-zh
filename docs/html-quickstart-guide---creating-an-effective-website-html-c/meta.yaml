    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"page\" method=\"get\"\
    >\nUsername: <input type=\"text\" name=\"userid\">\nEncryption: <keygen name=\"\
    password\">\n<input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\n这里，名称\
    \ 'password' 指的是你发送到的页面中存储生成密钥的变量名。不幸的是，这个标签不被任何版本的 Internet Explorer 支持，所以在实际将其应用到你的网站之前请谨慎考虑。\n\
    \n这就涵盖了你需要了解的 HTML 表单中大多数常用的基本元素。请记住，仅仅阅读是没有用的；你必须实际执行这些代码，进行实验，根据你的喜好修改它们，并最终开始编写自己的代码，以真正掌握\
    \ HTML 表单这一强大的工具。这不仅适用于 HTML 表单，也适用于 HTML 中的其他元素。既然我们已经了解了常用元素，让我们继续来看看一些可用于使你的表单更有条理的元素和属性。\n\
    \n## Optgroup\n\n`<optgroup>` 标签有助于将不同的选项分组。你可能会问，为什么需要对已经组合在一个字段中（通常使用 `<select>`\
    \ 或 `<datalist>`）的东西进行分组。为了澄清这个疑惑，让我们看一个例子：\n\n假设你希望你的用户说明他或她当前使用的笔记本电脑型号。你可以简单地创建一个包含不同品牌笔记本电脑及其多个型号的巨大列表。虽然这可行，但用户从一个包含数千个选项的列表中选择笔记本电脑型号极其耗时。现在，如果你没有使用\
    \ `<datalist>` 而是使用了 `<select>`，这几乎让用户无法找到他或她的型号，因为用户甚至无法输入前几个数字或字母来简化搜索。这虽然能产生结果，但效率低下。编码的真正理念在于优化时间消耗，无论是用户的时间还是处理时间。\n\
    \n这就是 `<optgroup>` 标签发挥作用的地方。假设你将同一品牌下的不同型号分组，你就能创建一个包含品牌名称的列表，并在每个品牌名称之间有一个包含型号的子列表。这不仅会让用户的选择过程更容易，也使你的列表更有条理，呈现出更专业和美观的外观。\n\
    \n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<select>\n<optgroup label=\"\
