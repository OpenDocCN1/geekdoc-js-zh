  md: 'heading</h2> <p>This is <i>italic</i> text</p> </body> </html>


    The above code will produce the following output


    This is **bold** heading


    This is *italic* text


    # Attributes


    Till now, we have seen some of the tags like paragraph tag <p>, heading tags <h1>,
    <h2> and a few other tags in the most simple form. These bags can be given some
    extra information known as attributes.


    The characteristics of an element in HTML can be defined using an attribute. This
    will be placed inside the opening tag of the element and they contain two parts,
    **name** and **value**.


    The **name** of the attribute is nothing but the property that you wish to set.
    For example, the font element carries attributes like color, size, type, etc.,
    which are used for indicating the font color, font size and font type that is
    to be displayed on the page.


    The **value** of the attribute is nothing but the value for the property that
    you wish to set. The value of an attribute should always be placed inside quotations.
    The examples below will show you the values that can be given to the above given
    **name**: Red, 3 and Georgia, as font color, size and type.


    You should be careful when using names and values for attributes, as they are
    case sensitive. However, the W3C (World Wide Web Consortium), recommends the use
    of lowercase attributes and attribute values in their recommendation for HTML
    4.


    Here is an example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Align Attribute Example</title> </head> <body>
    <p align="right">This content will be aligned to the right</p> <p align="center">This
    content will be aligned to the center</p> <p align="left">This content will be
    aligned to the left</p> </body> </html>

    ```


    The above code will give us the following output:'
  merge: -1
