    <title>Example for Centering the Content</title>

    </head>

    <body>

    <p>This text has the default alignment.</p>

    <center>

    <p>This text is centered.</p>

    </center>

    </body>

    </html>

    ```


    This code will produce the following the output:


    This text has the default alignment.


    This text is centered.


    # Horizontal Lines


    You can visually break up the sections present in a document using the Horizontal
    lines. The <hr> tag is used for creating a horizontal line from the left margin
    to the right margin. This will break the line accordingly. For instance, if you
    want to insert a line break in between two paragraphs, you can use the code given
    below.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Horizontal Line</title>

    </head>

    <body>

    <p>This is the first paragraph. This is on the top of the line break.</p>

    <hr />

    <p>This is the second paragraph. This is at the bottom of the line break.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This is the first paragraph. This is on the top of the line break.


    This is the second paragraph. This is at the bottom of the line break.


    The <hr /> tag is also categorized as an **empty** element. This doesn''t need
    opening tags and closing tags as there is no content going in between.

    There is a space in between the characters **hr** and / in the **<hr />** element.
    If the space is omitted, older versions of browsers will have problem with the
    rendering the horizontal line and if the / is missed, it won''t be a valid element
    in XHTML.'
- md: "## Preserve Formatting\n\nIn some cases your text should follow the same format\
    \ as it is entered in the HTML document. You can make use of the `<pre>` tag in\
    \ such cases. It means preformatted text.\n\nAny text entered into between the\
    \ tags `<pre>` and `</pre>` will have the same text format as seen in the source\
    \ document. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>Example for Preserve Formatting</title>\n</head>\n<body>\n<pre>\n\
    int main(void) {\n    printf(\"Hello World!\\n\");\n    // return 0;\n}\n</pre>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output.\n\n\
    ```\nint main(void) {\n    printf(\"Hello World!\\n\");\n    // return 0;\n}\n\
    ```\n\n## Nonbreaking Spaces\n\nIn some cases you do not want your browser to\
    \ split the words across lines. In such cases you can use the nonbreaking space\
    \ entity `&nbsp;` instead of using the normal space. Have a look at the following\
    \ example for a better understanding.\n\nExample\n\nLet us use the words James\
    \ Bond 007 for our example and we do not want the browser to split these words.\
    \ We will add the nonbreaking space entity `&nbsp;` instead of space.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Example for Nonbreaking Spaces</title>\n\
    </head>\n<body>\n<p>\nThe agent in the movie is \"James&nbsp;Bond&nbsp;007.\"\n\
    </p>\n</body>\n</html>\n```\n\n## Chapter 2: HTML Elements\n\nAn element in this\
    \ family will be defined by a starting tag. If other content can be contained\
    \ within the element, it will have a closing tag. For the closing tag, the name\
    \ of the element will be preceded with a /. Some of such elements are given below.\n\
    \n| Start Tag | Content | End Tag |\n| :--- | :--- | :--- |\n| `<i>` | This is\
    \ italic font content | `</i>` |\n| `<marquee>` | This is marquee text content.\
    \ | `</marquee>` |\n| `<p>` | This is paragraph content. | `</p>` |\n| `<br />`\
    \ | | |\n\nHere, `<i>` and `</i>` is an element, `<marquee>` and `</marquee>`\
    \ is another element. There are a few HTML elements that don't need closing tags,\
    \ such as `<br />`, `<hr />`, `<img />`, etc. The HTML elements which don't require\
    \ closing tags are called as **void elements**.\n\nThe HTML document has a tree\
    \ for these elements and this tree specifies how the documents of HTML should\
    \ be built. It also specifies the type of content that is to be placed in what\
    \ part of the document.\n\n### HTML Tag vs. Element\n\nAn element of HTML will\
    \ be defined using a starting tag. If other content is placed inside it, it will\
    \ have a closing tag.\n\nFor instance, `<i>` is the starting tag for italic text\
    \ and `</i>` is the closing tag for it. But, `<i>This text is italic</i>` is an\
    \ italic text element.\n\n### Nested Elements in HTML\n\nHTML allows you to nest\
    \ HTML elements within other HTML elements.\nHere is an example:\n\nExample\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example for Nested Elements</title>\n\
    </head>\n<body>\n<h2>This is <b>bold</b> heading</h2>\n<p>This is <i>italic</i>\
    \ text</p>\n</body>\n</html>\n```\n\nThe above code will produce the following\
    \ output:\n\nThis is **bold** heading\n\nThis is *italic* text\n\n## Attributes\n\
    \nTill now, we have seen some of the tags like paragraph tag `<p>`, heading tags\
    \ `<h1>`, `<h2>` and a few other tags in the most simple form. These tags can\
    \ be given some extra information known as attributes.\n\nThe characteristics\
    \ of an element in HTML can be defined using an attribute. This will be placed\
    \ inside the opening tag of the element and they contain two parts, **name** and\
    \ **value**.\n\nThe **name** of the attribute is nothing but the property that\
    \ you wish to set. For example, the font element carries attributes like color,\
    \ size, type, etc., which are used for indicating the font color, font size and\
    \ font type that is to be displayed on the page.\n\nThe **value** of the attribute\
    \ is nothing but the value for the property that you wish to set. The value of\
    \ an attribute should always be placed inside quotations. The examples below will\
    \ show you the values that can be given to the above given **name**: Red, 3 and\
    \ Georgia, as font color, size and type.\n\nYou should be careful when using names\
    \ and values for attributes, as they are case sensitive. However, the W3C (World\
    \ Wide Web Consortium), recommends the use of lowercase attributes and attribute\
    \ values in their recommendation for HTML 4.\n\nHere is an example.\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Align Attribute Example</title>\n\
    </head>\n<body>\n<p align=\"right\">This content will be aligned to the right</p>\n\
    <p align=\"center\">This content will be aligned to the center</p>\n<p align=\"\
    left\">This content will be aligned to the left</p>\n</body>\n</html>\n```\n\n\
    The above code will give us the following output:\n\nThis content will be aligned\
    \ to the right.\nThis content will be aligned to the center.\nThis content will\
    \ be aligned to the left.\n\n## Internationalization Attributes\n\nIn HTML, there\
    \ are a total of three internationalization attributes. These are available for\
    \ most of the XHTML elements, but not for all.\n\n- dir\n- lang\n- xml:lang\n\n\
    ## The dir Attribute\n\nYou can specify the text flow direction to the browser\
    \ by using the **dir** attribute. This attribute can take two values, as shown\
    \ in the table given below.\n\n| Value | Meaning |\n| :--- | :--- |\n| ltr | Left\
    \ to right (this will be the default value) |\n| rtl | Right to left (for languages\
    \ such as Hebrew or Arabic that are read right to left) |\n\nExample\n\n```html\n\
    <!DOCTYPE html>\n<html dir=\"rtl\">\n<head>\n<title>Display Directions</title>\n\
    </head>\n<body>\nThis is how IE 5 renders right-to-left directed text.\n</body>\n\
    </html>\n```\n\nThe above code will produce the following output:\nThis is how\
    \ IE 5 renders right-to-left directed text.\n\nIf the **dir** attribute is placed\
    \ inside the `<html>` tag, it will determine how the text of the entire document\
    \ will be presented. If this attribute is used inside another tag, it will just\
    \ control the direction of the text contained in that specific tag.\n\n## The\
    \ lang Attribute\n\nYou can indicate the main language that is to be used in your\
    \ document by using the **lang** attribute. The only reason for keeping this attribute\
    \ in HTML is for the backwards compatibility with previous versions of HTML. In\
    \ the new XHTML documents, this attribute is replaced with the **xml:lang** attribute.\n\
    \nThe *lang* attributes have the values as ISO 639 standard 2-character language\
    \ codes. You can check the complete list of language codes with the [HTML Language\
    \ Codes: ISO 639](https://www.tutorialspoint.com/html_tags/html_language_codes.htm).\n\
    \nExample\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>English\
    \ Language Page</title>\n</head>\n<body>\nThis page is using English Language\n\
    </body>\n</html>\n```\n\n## The xml:lang Attribute\n\nIn XHTML, the *xml:lang*\
    \ attribute is used as a replacement for the original *lang* attribute used in\
    \ earlier versions of HTML. As mentioned above, the *xml:lang* attribute value\
    \ should be an ISO-639 country code.\n\n## Generic Attributes\n\nThere are a few\
    \ other attributes that can be readily used with most of the HTML tags. The list\
    \ of those attributes is given in the table below.\n\n| Attribute | Options |\
    \ Function |\n| :--- | :--- | :--- |\n| align | right, left, center | Horizontally\
    \ aligns tags |\n| valign | top, middle, bottom | Vertically aligns tags within\
    \ an HTML element. |\n| bgcolor | numeric, hexadecimal, RGB values | Places a\
    \ background color behind an element |\n| background | URL | Places a background\
    \ image behind an element |\n| id | User Defined | Names an element for use with\
    \ Cascading Style Sheets. |\n| class | User Defined | Classifies an element for\
    \ use with Cascading Style Sheets. |\n| width | Numeric Value | Specifies the\
    \ width of tables, images, or table cells. |\n| height | Numeric Value | Specifies\
    \ the height of tables, images, or table cells. |\n| title | User Defined | \"\
    Pop-up\" title of the elements. |\n\n## Chapter 3: Formatting in HTML\n\nIf you\
    \ are familiar with using the word processor, you probably must also be familiar\
    \ with making text bold, italicized or underlined. There are a total of 10 options\
    \ available in HTML and XHTML, which will indicate how your text will appear.\n\
    \n## Bold Text\n\nAny content that is placed in between `<b>...</b>` element will\
    \ be displayed as bold text. Here is an example.\n\nExample\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Example for Bold Text</title>\n</head>\n<body>\n\
    <p>The following word will be in a <b>bold</b> typeface.</p>\n</body>\n</html>\n\
    ```\n\nThe above code will produce the following output:\nThe following word will\
    \ be in a **bold** typeface.\n\n## Italic Text\n\nAny content that is placed in\
    \ between `<i>...</i>` element will be displayed as italicized text. Here is an\
    \ example.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example\
    \ for Italic Text</title>\n</head>\n<body>\n<p>The following word will be in a\
    \ <i>italicized</i> typeface.</p>\n</body>\n</html>\n```\n\nThe above code will\
    \ produce the following output:\nThe following word will be in an *italicized*\
    \ typeface.\n\n## Underlined Text\n\nAny content that is placed in between `<u>...</u>`\
    \ element will be displayed as underlined text. Here is an example.\n\nExample"
  mdcn: "\n## 保留格式\n\n在某些情况下，你的文本应遵循与HTML文档中输入时相同的格式。在这种情况下，你可以使用`<pre>`标签。它表示预格式化文本。\n\
    \n任何在`<pre>`和`</pre>`标签之间输入的文本都将具有与源文档中相同的文本格式。这里有一个示例。\n\n示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>保留格式示例</title>\n</head>\n<body>\n<pre>\nint main(void)\
    \ {\n    printf(\"Hello World!\\n\");\n    // return 0;\n}\n</pre>\n</body>\n\
    </html>\n```\n\n上述代码将产生以下输出。\n\n```\nint main(void) {\n    printf(\"Hello World!\\\
    n\");\n    // return 0;\n}\n```\n\n## 不换行空格\n\n在某些情况下，你不希望浏览器将单词跨行分割。在这种情况下，你可以使用不换行空格实体`&nbsp;`代替使用普通空格。请看以下示例以更好地理解。\n\
    \n示例\n\n让我们以词语 James Bond 007 为例，我们不希望浏览器分割这些词。我们将使用不换行空格实体`&nbsp;`代替空格。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>不换行空格示例</title>\n</head>\n<body>\n<p>\n\
    电影中的特工是 \"James&nbsp;Bond&nbsp;007。\"\n</p>\n</body>\n</html>\n```\n\n## 第2章：HTML\
    \ 元素\n\n这个家族中的元素将由一个起始标签定义。如果元素内部可以包含其他内容，它将有一个结束标签。对于结束标签，元素名称前会加上一个/。下面列出了一些这样的元素。\n\
    \n| 起始标签 | 内容 | 结束标签 |\n| :--- | :--- | :--- |\n| `<i>` | 这是斜体字体内容 | `</i>` |\n\
    | `<marquee>` | 这是滚动文本内容。 | `</marquee>` |\n| `<p>` | 这是段落内容。 | `</p>` |\n| `<br\
    \ />` | | |\n\n这里，`<i>`和`</i>`是一个元素，`<marquee>`和`</marquee>`是另一个元素。有一些HTML元素不需要结束标签，例如`<br\
    \ />`、`<hr />`、`<img />`等。不需要结束标签的HTML元素被称为**空元素**。\n\nHTML文档为这些元素定义了一个树状结构，这个结构规定了HTML文档应该如何构建。它还规定了在文档的哪个部分应放置何种类型的内容。\n\
    \n### HTML 标签 vs. 元素\n\nHTML元素将使用起始标签定义。如果其内部放置了其他内容，它将有一个结束标签。\n\n例如，`<i>`是斜体文本的起始标签，`</i>`是其结束标签。但是，`<i>This\
    \ text is italic</i>`是一个斜体文本元素。\n\n### HTML中的嵌套元素\n\nHTML允许你在其他HTML元素内嵌套HTML元素。\n\
    这里有一个示例：\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>嵌套元素示例</title>\n\
    </head>\n<body>\n<h2>This is <b>bold</b> heading</h2>\n<p>This is <i>italic</i>\
    \ text</p>\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n\nThis is **bold** heading\n\
    \nThis is *italic* text\n\n## 属性\n\n到目前为止，我们已经看到了一些最简单的标签，如段落标签`<p>`、标题标签`<h1>`、`<h2>`以及其他一些标签。这些标签可以被赋予一些额外的信息，称为属性。\n\
    \nHTML中元素的特性可以使用属性来定义。属性将放置在元素的开始标签内，它们包含两个部分：**名称**和**值**。\n\n属性的**名称**就是你希望设置的属性。例如，字体元素带有诸如颜色、大小、类型等属性，这些属性用于指示要在页面上显示的字体颜色、字体大小和字体类型。\n\
    \n属性的**值**就是你希望为该属性设置的值。属性的值应始终放在引号内。下面的示例将向你展示可以为上述给定的**名称**赋予的值：红色、3和Georgia，分别作为字体颜色、大小和类型。\n\
    \n在使用属性的名称和值时应小心，因为它们区分大小写。但是，W3C（万维网联盟）在其HTML 4建议中推荐使用小写的属性和属性值。\n\n这里有一个示例。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>对齐属性示例</title>\n</head>\n\
    <body>\n<p align=\"right\">此内容将右对齐</p>\n<p align=\"center\">此内容将居中对齐</p>\n<p align=\"\
    left\">此内容将左对齐</p>\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n\n此内容将右对齐。\n此内容将居中对齐。\n\
    此内容将左对齐。\n\n## 国际化属性\n\n在HTML中，总共有三个国际化属性。它们可用于大多数XHTML元素，但并非所有元素。\n\n- dir\n\
    - lang\n- xml:lang\n\n## dir 属性\n\n你可以使用**dir**属性向浏览器指定文本流向。此属性可以接受两个值，如下表所示。\n\
    \n| 值 | 含义 |\n| :--- | :--- |\n| ltr | 从左到右（这将是默认值） |\n| rtl | 从右到左（用于从右到左阅读的语言，如希伯来语或阿拉伯语）\
    \ |\n\n示例\n\n```html\n<!DOCTYPE html>\n<html dir=\"rtl\">\n<head>\n<title>显示方向</title>\n\
    </head>\n<body>\n这是IE 5渲染从右到左文本的方式。\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n这是IE\
    \ 5渲染从右到左文本的方式。\n\n如果**dir**属性放在`<html>`标签内，它将决定整个文档文本的呈现方式。如果此属性用于另一个标签内，它只会控制该特定标签内文本的方向。\n\
    \n## lang 属性\n\n你可以使用**lang**属性来指定文档中要使用的主要语言。在HTML中保留此属性的唯一原因是与HTML的早期版本保持向后兼容。在新的XHTML文档中，此属性已被**xml:lang**属性取代。\n\
    \n*lang*属性的值采用ISO 639标准的两字符语言代码。你可以通过[HTML语言代码：ISO 639](https://www.tutorialspoint.com/html_tags/html_language_codes.htm)查看完整的语言代码列表。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>英语页面</title>\n\
    </head>\n<body>\n此页面使用英语语言\n</body>\n</html>\n```\n\n## xml:lang 属性\n\n在XHTML中，*xml:lang*属性用作HTML早期版本中使用的原始*lang*属性的替代品。如上所述，*xml:lang*属性值应为ISO-639国家代码。\n\
    \n## 通用属性\n\n还有几个其他属性可以与大多数HTML标签一起直接使用。这些属性的列表如下表所示。\n\n| 属性 | 选项 | 功能 |\n| :---\
    \ | :--- | :--- |\n| align | right, left, center | 水平对齐标签 |\n| valign | top, middle,\
    \ bottom | 在HTML元素内垂直对齐标签。 |\n| bgcolor | 数字、十六进制、RGB值 | 在元素后放置背景色 |\n| background\
    \ | URL | 在元素后放置背景图像 |\n| id | 用户定义 | 为元素命名，以便与级联样式表一起使用。 |\n| class | 用户定义 |\
    \ 对元素进行分类，以便与级联样式表一起使用。 |\n| width | 数值 | 指定表格、图像或表格单元格的宽度。 |\n| height | 数值 |\
    \ 指定表格、图像或表格单元格的高度。 |\n| title | 用户定义 | 元素的“弹出”标题。 |\n\n## 第3章：HTML中的格式化\n\n如果你熟悉使用文字处理程序，你可能也很熟悉如何使文本加粗、斜体或下划线。HTML和XHTML中总共有10个选项可用于指示你的文本将如何显示。\n\
    \n## 粗体文本\n\n放置在`<b>...</b>`元素之间的任何内容都将显示为粗体文本。这里有一个示例。\n\n示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>粗体文本示例</title>\n</head>\n<body>\n<p>以下单词将以<b>粗体</b>字型显示。</p>\n\
    </body>\n</html>\n```\n\n上述代码将产生以下输出：\n以下单词将以**粗体**字型显示。\n\n## 斜体文本\n\n放置在`<i>...</i>`元素之间的任何内容都将显示为斜体文本。这里有一个示例。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>斜体文本示例</title>\n</head>\n\
    <body>\n<p>以下单词将以<i>斜体</i>字型显示。</p>\n</body>\n</html>\n```\n\n上述代码将产生以下输出：\n以下单词将以*斜体*字型显示。\n\
    \n## 下划线文本\n\n放置在`<u>...</u>`元素之间的任何内容都将显示为带下划线的文本。这里有一个示例。\n\n示例\n"
