    \ onto the different elements that you can use within these input types, to make\
    \ your form look even better and make it easy to use.\n\n## Select\n\nThe select\
    \ attribute of the HTML form creates a drop down list. This list contains options\
    \ that the user can select. This is different from the attributes like ‘Number’,\
    \ because the user will only be able to select the option, and cannot type anything\
    \ in it.\n\n## Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"\
    page.asp\" method=\"POST\">\nUsername:<input type=\"text\" name=\"userid\">\n\
    <input type=\"submit\" value=\"Store User ID\">\n<br>\nList:\n<select>\n<option\
    \ value=\"a\">A</option>\n<option value=\"b\">B</option>\n<option value=\"c\"\
    >C</option>\n<option value=\"d\">D</option>\n</select>\n</form>\n</body>\n</html>\n\
    ```\n\nHere, the POST method is used, which as stated before, will prevent the\
    \ details from appearing in the URL when the user hits the submit button. In the\
    \ list, you can add as many options as you want, but make sure to include the\
    \ </option> tag after each option. When you want the selected option to have a\
    \ specific variable name in the page you’re sending it to, then use the ‘name’\
    \ attribute. Your code should look something like this:\n\n```html\n<select name=\"\
    name_you_want_in_page\">\n```\n\n## FieldSet and Legend\n\nLegend is used to give\
    \ a caption to the <fieldset> tag. The **Fieldset** tag groups together the elements\
    \ you want. A visible border appears around the elements when the Fieldset tag\
    \ is used. This makes it much easier for your user to read and understand what\
    \ is required as an input. What the legend tag does is, it creates a caption just\
    \ at the top of the fieldset, which makes it even more easier for the users. As\
    \ a website designer, the user’s comfortability should be your primary aim, and\
    \ as such, these tags will come handy.\n\n**Example**\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<form>\n<fieldset>\n<legend>Education:</legend>\nSchool: <input\
    \ type=\"text\"><br>\nCollege: <input type=\"text\"><br>\nFurther qualifications:\
    \ <input type=\"text\">\n<input type=\"submit\">\n</fieldset>\n</form>\n</body>\n\
    </html>\n```\n\nThis code will create 3 text boxes, where the user will enter\
    \ the corresponding details, and the submit given at the end will create a Submit\
    \ button which performs the same action as stated before.\n\n## HTML5 Elements\n\
    \nThe elements given below are but two of the various elements that have been\
    \ added in HTML5. These elements work *only* in HTML5, and are not supported by\
    \ previous versions.\n\n## Datalist\n\nAt times, going through a list while looking\
    \ for a particular option can be quite annoying, especially if the list is very\
    \ large. In such cases, adding a datalist instead of just the `<option>` tag would\
    \ make it easier for the users. Datalist is different from the option tag, because\
    \ the user can actually type the input in the field you have provided. As soon\
    \ as he or she starts typing, the relevant choice pops up. You will notice that\
    \ the Datalist is quite similar the number tag, only this for text. It acts as\
    \ an auto-fill feature for the input field.\n\n### Example\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<form action=\"page.asp\" method=\"get\">\n  <input list=\"\
    bike\" name=\"bike\">\n  <datalist id=\"bike\">\n    <option value=\"bike1\">\n\
    \    <option value=\"bike2\">\n    <option value=\"bike3\">\n    <option value=\"\
    bike4\">\n    <option value=\"bike5\">\n  </datalist>\n  <input type=\"submit\"\
    >\n</form>\n</body>\n</html>\n```\n\nDespite being very useful, the datalist tag\
    \ can be used only in HTML5, and is not supported by Internet Explorer 9 or its\
    \ previous versions and is not supported even by Safari.\n\n## Keygen\n\nWhen\
    \ you want to authenticate your users, then you have to use the keygen tag. This\
    \ tag does the function of creating a pair of keys. One of these keys will be\
    \ stored locally, and the other will be sent to the server. Of course, the locally\
    \ stored key will be private, and the other will be public.\n\n```html\n<!DOCTYPE\
