    Simple Image Insert


    HTML supports image formats like JPEG, PNG or GIF. You can use any of these image
    formats basing on your comfort. You should always ensure that you specify the
    correct file name of the image in **src** attribute. Always remember that the
    image names are case sensitive.


    There is a mandatory attribute called the **alt** attribute, which will specify
    an alternate text for the image, in cases where the image fails to be displayed.


    ### Set Image Location


    It is recommended that you keep your images in a specific directory separately.
    We will put our .htm file in the home directory and the images in a subdirectory
    called **images**, within the home directory. Here is an example.


