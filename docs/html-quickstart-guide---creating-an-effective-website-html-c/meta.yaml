  mdcn: "\n## 第11章：HTML多媒体\n\n说到`<object>`标签，最大的缺点在于它是静态的。更准确地说，随`<object>`标签一同嵌入的代码是静态的。这意味着它不允许代码根据设置的更改而变化。当你使用`<iframe>`标签嵌入视频时，你无需过多关注Shockwave\
    \ Flash播放器。相反，如果你决定使用`<object>`标签嵌入视频，而你的浏览器上没有安装所需的软件（播放器），那么你最终只能看到一个空白屏幕。\n\
    \n本质上，可以肯定地说，采用`<iframe>`方式是最好的，能产生最佳效果。只有在`<iframe>`失效的情况下，你才需要开始使用`<object>`和`<embed>`标签。\n\
    \n### 添加插件\n\n你可能会在本章中多次遇到“插件”这个词。插件不过是些小巧、简单的辅助应用程序，它们能为浏览器提供额外功能。或许更准确地说，插件*扩展*了浏览器的功能。有时你需要添加一个插件，以便让你正在使用的浏览器支持某些视频或音频文件。优秀网站的一个特点是尽可能少用插件，但这并不意味着你应该完全不用。插件通过让浏览器支持那些原本会导致白屏的格式，使你的任务变得简单得多。在数十万种可用的插件中，Java小程序被广泛使用。这是因为它们易于编码，并且可以从任何平台编码。\n\
    \n插件也是使用`<object>`和`<embed>`标签的主要原因。你可以为各种操作添加辅助应用程序。以下仅列出几项：\n\n-   病毒扫描\n- \
    \  GPS\n-   Flash播放器\n\n如你所见，Flash播放器也是一种插件。想象一下没有Adobe Shockwave上网冲浪！听起来很荒谬，不是吗？这就是为什么了解插件以及如何将它们添加到网页中变得如此重要。\n\
    \n要嵌入插件，你需要使用`<object>`和`<embed>`标签。现在让我们举一个例子，进一步理解`<object>`标签的工作原理。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<object width=\"500\" height=\"100\" data=\"\
    example.swf\"></object>\n</body>\n</html>\n```\n\n.swf格式代表Shockwave Flash，它是一种用于包含小型动画和声音文件的格式。.swf格式在设计时特别考虑了速度和效率，因此，使用.swf格式来显示小动画可能是个好主意。现在来看属性\
    \ - **width**和**height**的功能与之前解释的相同（它们决定对象的尺寸）。**data**属性用于指定你要显示的文件，无论是音频还是视频文件，以及其格式。\n\
    \n至此，HTML多媒体章节结束。HTML5将为多媒体制定新标准，分享媒体将变得前所未有的容易。因此，你必须了解HTML5的基础知识（当然，前提是你已经掌握了HTML）。\n\
    \n## 第12章：HTML5与语义\n\n一旦你真正掌握了HTML，你就会开始注意到你使用的标签通常毫无意义，除非你知道它的功能。例如，考虑`<div>`标签。当一个不懂HTML的人看到这个标签时，他或她*永远*无法理解这个标签的真正含义或其功能。这虽然不算大问题，但确实挺烦人的。我们已经从只使用二进制数字进化到使用文本。为什么不更进一步，使用对人类和机器都有意义的文本呢？这正是HTML5所做的。HTML5添加了语义元素，使用它们使得HTML编码变得极其简单。我们已经详细讨论过一种语义元素，尽管当时没有提及：`<form>`。是的，表单标签就是一个语义元素！当你看到`<form>`标签时，你会立即意识到它与表单有关，并且可以开始相应地添加属性。\n\
    \n以下列出了HTML5提供的一些语义元素：\n\n-   `<details>`\n-   `<article>`\n-   `<section>`\n\
    -   `<summary>`\n-   `<time>`\n-   `<aside>`\n-   `<mark>`\n\n现在让我们继续看一些例子，了解这些标签是如何工作的。\n\
    \n### Article\n\narticle标签让你创建一篇文章。你当然可以创建一篇与网页有一定关联的文章，但文章的基本理念是每篇文章都应该是不同的。因此，当你想要提及一些脱离上下文或与网站主题毫不相关的内容时，可以使用`<article>`标签。\n\
    \n这是一个你可以尝试的示例代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<article>\n <h2>这是文章的标题</h2>\n\
    \ <p>借助article标签，你可以创建提供与网页无关内容的文章。</p>\n</article>\n</body>\n</html>\n```\n\n\
    上面的代码将执行给定的文本，标题使用`<h2>`的大小。\n\n### Section\n\n节是基于单一思想或主题的内容组。这就是它们与文章的区别，文章的主题可以是任何东西。节必须围绕一个主题展开，这样文字才有意义。下面是两个节在HTML中如何组合在一起的例子：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<section>\n <h1>第1节</h1>\n <p>这是第1节的内容。本节说明HTML编码易于学习，但也容易忘记，所以如果你想成为专业人士，请保持练习！</p>\n\
    </section>\n<section>\n  <h1>第2节</h1>\n  <p>这是第2节。本节想说的是，这本书涵盖了几乎所有概念，当你对基础知识有疑问时，总是可以回来参考它。</p>\n\
    </section>\n</body>\n</html>\n```\n\n如你所见，这两个节具有相同的主题 - HTML，但它们试图表达的内容却大不相同。\n\
    \n### Aside\n\n你可能经常看到主要内容显示在中间或左侧，而一些次要的、相关的内容显示在侧边栏中。这是借助`<aside>`标签实现的。此标签用于显示与主要主题相关的小段信息，可以放置在两侧。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这是关于HTML的主题。</p>\n<aside>\n  <h4>HTML</h4>\n\
    \  <p>HTML是超文本标记语言。</p>\n</aside>\n</body>\n</html>\n```\n\n### Details and Summary\n\
    \n你可能见过那个小箭头标记，点击它会展开一个小文本框并显示额外信息。因此，details是一种让用户选择查看信息的方式。summary标签让你为details标签添加标题。理解这一点的最好方法是看一个例子：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<details>\n  <summary>点击此处获取更多信息</summary>\n\
    \  <p>这是额外信息。</p>\n</details>\n</body>\n</html>\n```\n\n当你尝试这段代码时，你会注意到summary中的文本被显示为标题，而其他文本则进入可展开的文本框。这就是details和summary的工作原理。\n\
    \n### Figure and Figcaption\n\n这再简单不过了。你可以添加一张图片，并借助figure和figcaption标签为其添加说明文字。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这是你的描述。与其为上传的图片提供说明文字作为描述，更好的做法是使用如图所示的<figcaption>标签。</p>\n\
    <figure>\n  <img src=\"image.jpeg\" alt=\"输入图像\" width=\"300\" height=\"220\"\
    >\n  <figcaption>图1：这是你的说明文字。</figcaption>\n</figure>\n</body>\n</html>\n```\n\
    \n### 结语\n\n创建网页多年来一直被笼罩在神秘主义和技术术语的迷雾中，但我希望我已经向你展示了它并没有你想象的那么可怕。事实上，HTML实际上相当直接明了。如果你正在寻找一种真正能有所成就且易于解释的爱好，那么你来对地方了。这些是你构建网页并迈向更高层次（如CSS、Java、JavaScript、C++等，不胜枚举）的基础。记住，只要你掌握并真正理解你当下所处理的内容，你就永远不会力不从心。\n\
    \n如果有什么东西对你来说难以理解或令人困惑，我最好的建议是打开你的TextEdit或Notepad，开始动手实践。在浏览器中加载它，看看它对你的页面做了什么。循序渐进地学习，必将引导你走向成功之路。永远没有理由在没有完全理解自己所做之事的情况下就贸然前进。\n\
    \n如果你发现自己需要回顾基础知识，或者只是不记得如何做一些简单的事情，请回到这本书，看看这些基础内容。有了我在本书中向你介绍的一切，你应该能够掌握网页的入门知识。一旦你开了个头，接下来的事情就是一步一步地前进。所以祝你好运，行动起来，创建一个令人惊叹的网页吧。\n\
    \n感谢你的阅读！我需要你的帮助……\n"
