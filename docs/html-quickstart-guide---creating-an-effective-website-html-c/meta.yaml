    Username:<input type="text" name="username">

    </form>

    </body>

    </html>

    ```


    This code accepts text from the user when he gives his Username. The input from
    the user gets stored in a variable called username in the page you''re sending
    the file to. The form action has been left blank, and you can insert whichever
