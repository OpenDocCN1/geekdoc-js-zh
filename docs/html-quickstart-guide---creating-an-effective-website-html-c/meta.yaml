    \ | rgb(0,255,255) |\n| ![#ff00ff](https://via.placeholder.com/15/ff00ff/ff00ff?text=+)\
    \ | rgb(255,0,255) |\n| ![#c0c0c0](https://via.placeholder.com/15/c0c0c0/c0c0c0?text=+)\
    \ | rgb(192,192,192) |\n| ![#ffffff](https://via.placeholder.com/15/ffffff/ffffff?text=+)\
    \ | rgb(255,255,255) |\n\n### Example\n\nHere are the examples to set background\
    \ of an HTML tag by color code using rgb() values:\n\n```html\n<!DOCTYPE html>\
    \ <html> <head> <title>HTML Colors by RGB code</title> </head> <body text=\"rgb(0,0,255)\"\
    \ bgcolor=\"rgb(0,255,0)\"> <p>Use different color code for for body and table\
    \ and see the result.</p> <table bgcolor=\"rgb(0,0,0)\"> <tr> <td> <font color=\"\
    rgb(255,255,255)\">This text will appear white on black background. </font> </td>\
    \ </tr> </table> </body> </html>\n```\n\n**Note:** Not all browsers support the\
    \ rgb() color property. You should be careful on its usage for this reason.\n\n\
    ### Browser Safe Colors\n\nThere are a total of 216 colors that are supposed to\
    \ be browser safe. They are computer independent colors. These colors range from\
    \ the 000000 to FFFFFF in hex code. All computers having the 256 color palette\
    \ support these.\n\n| | | | | | |\n|--------|--------|--------|--------|--------|--------|\n\
    | 000000 | 000033 | 000066 | 000099 | 0000CC | 0000FF |\n| 003300 | 003333 | 003366\
    \ | 003399 | 0033CC | 0033FF |\n| 006600 | 006633 | 006666 | 006699 | 0066CC |\
    \ 0066FF |\n| 009900 | 009933 | 009966 | 009999 | 0099CC | 0099FF |\n| 00CC00\
    \ | 00CC33 | 00CC66 | 00CC99 | 00CCCC | 00CCFF |\n| 00FF00 | 00FF33 | 00FF66 |\
    \ 00FF99 | 00FFCC | 00FFFF |\n| 330000 | 330033 | 330066 | 330099 | 3300CC | 3300FF\
    \ |\n| 333300 | 333333 | 333366 | 333399 | 3333CC | 3333FF |\n| 336600 | 336633\
    \ | 336666 | 336699 | 3366CC | 3366FF |\n| 339900 | 339933 | 339966 | 339999 |\
    \ 3399CC | 3399FF |\n| 33CC00 | 33CC33 | 33CC66 | 33CC99 | 33CCCC | 33CCFF |\n\
    | 33FF00 | 33FF33 | 33FF66 | 33FF99 | 33FFCC | 33FFFF |\n| 660000 | 660033 | 660066\
