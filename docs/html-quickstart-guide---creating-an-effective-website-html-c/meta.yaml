    \nHTML 中的短语标签用于执行特定目的。它们看起来类似于其他标签，如 `<b>`、`<i>`、`<pre>` 和 `<tt>`，我们在前面的章节中已经见过。在本章中，我们将介绍\
    \ HTML 中重要的短语标签。\n\n### 强调文本\n\n任何放置在 `<em>...</em>` 元素之间的内容都将显示为强调文本。以下是一个示例。\n\
    \n**示例**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example for Emphasized\
    \ Text</title>\n</head>\n<body>\n    <p>The following word uses a <em>emphasized</em>\
    \ typeface.</p>\n</body>\n</html>\n```\n\n上面的代码将产生以下 output：\n以下单词使用了<em>强调</em>字体。\n\
    \n### 标记文本\n\n任何放置在 `<mark>...</mark>` 元素之间的内容都将显示为标记文本，带有黄色高亮。以下是一个示例。\n\n**示例**\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Marked Text Example</title>\n\
    </head>\n<body>\n    <p>The following word has been <mark>marked</mark> with yellow</p>\n\
    </body>\n</html>\n```\n\n上面的代码将产生以下 output：\n以下单词已被标记为<mark>黄色</mark>。\n\n###\
    \ 加重文本\n\n任何放置在 `<strong>...</strong>` 元素之间的内容都将显示为重要文本。以下是一个示例。\n\n**示例**\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Strong Text Example</title>\n\
    </head>\n<body>\n    <p>The following word uses a <strong>strong</strong> typeface.</p>\n\
    </body>\n</html>\n```\n\n上面的代码将产生以下 output：\n以下单词使用了<strong>加粗</strong>字体。\n\n\
    ## 文本缩写\n\n在 HTML 中，你可以缩写文本。你可以通过将文本放在开始标签 `<abbr>` 和结束标签 `</abbr>` 之间来实现。完整描述应添加到\
    \ title 属性中（如果存在）。以下是一个示例。\n\n**示例**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>Text Abbreviation</title>\n</head>\n<body>\n    <p>My best friend's\
    \ name is <abbr title=\"Abigail\">Abi</abbr>.</p>\n</body>\n</html>\n```\n\n上面的代码将产生以下\
    \ output：\n我最好的朋友的名字是 <abbr title=\"Abigail\">Abi</abbr>。\n\n## 首字母缩略词元素\n\n你可以使用\
    \ `<acronym>` 元素在 HTML 中将你的文本标识为首字母缩略词。你应该将文本放在开始标签 `<acronym>` 和结束标签 `</acronym>`\
    \ 之间以将其标识为首字母缩略词。以下是一个示例。\n\n**示例**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>Acronym Example</title>\n</head>\n<body>\n    <p>This chapter covers\
    \ marking up text in <acronym>XHTML</acronym>.</p>\n</body>\n</html>\n```\n\n\
    上面的代码将产生以下 output：\n本章介绍在 <acronym>XHTML</acronym> 中标记文本。\n\n## 文本方向\n\n元素 `<bdo>...</bdo>`\
    \ 代表双向覆盖。你可以使用此元素覆盖文本方向。以下是一个示例。\n"
