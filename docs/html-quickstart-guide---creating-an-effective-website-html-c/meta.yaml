    ## 第七章：HTML 表单


    大多数网站至少有一页会征求访客的反馈，或者请求他们通过提供电子邮件来订阅。为了做到这一点，您需要在页面上放置多个文本框，用户可以在其中提供输入。表单几乎无处不在，只是不被注意而已。当您登录您的电子邮件、Facebook或任何需要用户名和密码的网站时，您正在使用表单来输入数据。这可以通过HTML中的表单及其元素来完成。


    表单背后的理念是，访客使用文本框输入一些数据，然后这些数据被发布到后端应用程序，如ASP或PHP脚本。此应用程序可以配置为使用网页创建者自己的逻辑算法执行任何操作。下面列出了一些常用的元素和属性，您*必须*了解它们才能创建一个能够吸引访客注意力的表单：


    ### Input

    最重要的元素，您使用它从用户那里获取输入。有各种输入属性，如文本、单选按钮和提交按钮。单选按钮用于从您提供的不同选项中进行选择，其他两个则很容易理解。语法是`<input>`。


    ### TextArea

    当您希望用户输入超过单行的内容，例如描述其专业知识的段落时，您需要使用TextArea元素。


    ### Button

    此元素创建一个按钮，点击时执行某些操作。


    ### Select

    虽然在用户必须键入详细信息的表单中不需要，但了解此元素可以使您的访客更容易使用。Select元素创建一个下拉列表，访客可以从中选择一个选项。


    ## Legend


    如果您希望表单看起来井然有序，应该考虑的一个重要元素，legend为fieldset标签元素创建标题，该标签将表单中的相关字段分组在一起。


    ## HTML5 元素


    这些是HTML5独有的元素，不能在其他地方使用。


    ## Datalist


    当您希望用户在开始键入时立即获得一个选项列表时，可以使用Datalist。这与Select元素不同，后者用户只能从选项列表中进行选择。Datalist元素在用户单击箭头标记时显示列表，并且在用户开始键入时也显示相关选项。


    ## Keygen


    当您想创建一种安全的用户身份验证方式时，可以使用keygen元素。它创建2个密钥，其中一个本地存储（私钥），另一个发送到服务器（公钥）。


    此列表涵盖了最常用的HTML表单元素，还有很多可以尝试。首先尝试这些，然后开始尝试不同的元素！下面是一些示例代码，您可以使用或修改以满足您的需求。`<form>`标签必须用于在网页中使用表单元素。与元素相比，属性要多得多，因此大多数常用属性将在相应的代码之后进行解释。


    ## Form Action


    在我们继续示例代码之前，有一个表单属性您*必须*了解，即"**form action**"。此属性决定了按下提交按钮后，输入的数据应发送到哪个页面。输入的数据就是在这里被处理的。处理意味着您可以向用户显示详细信息，或者将其发送到MySQL数据库，以便将来存储和使用。然而，使用form
    action需要您事先了解ASP或PHP脚本。由于本书只专注于HTML，因此这里不会讨论ASP和PHP。网上有许多教程详细解释PHP和ASP。理解起来并不难，而且您必须了解它，否则HTML表单就变得毫无用处，因为您需要将从用户那里获得的详细信息发送到表单处理程序，才能真正利用它们。至于form
    action的语法，它相当简单：


    ```

    <form action="page.php" method="method_you_want">

    ```


    ## GET 和 POST


    现在这很简单。page.php指的是您想要发送详细信息的页面。如果您之前没有定义任何页面，那么您只会得到一个“文件未找到”消息，因为不存在这样的文件。但是，如果您查看URL或查看“文件未找到”消息中提供的信息，您会注意到用户输入的详细信息会明确显示出来。这引出了form
    action中使用的方法。


    有两种form action，GET和POST。如果一开始没有选择任何选项，则默认设置为GET选项。GET的问题是，无论用户输入什么详细信息，它都会显示在URL中。虽然当用户在家时可能不会造成问题，但想象一下，当他或她在公共场所或在一台共用的计算机上使用您的表单输入详细信息时。一次小小的浏览历史检查就会打开之前访问过的网站，以及URL中的密码和用户名。这是一个巨大的安全威胁，这使得本指南转向POST方法。


    在POST方法中，发生相同的动作——即将详细信息发送到PHP或ASP脚本或处理详细信息的页面——但URL上除了表单操作发送详细信息的页面外，不会显示任何内容。


    如果您想使用POST方法，请使用以下语法：


    ```

    <form action="page.php" method="POST">

    ```


    就这样！您现在已经成功创建了一个更注重安全性的表单。


