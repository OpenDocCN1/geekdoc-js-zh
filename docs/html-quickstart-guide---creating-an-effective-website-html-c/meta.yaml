    ### Set Image Width/Height


    Depending on your requirements, you can set the height and width of an image with
    the help of the **height** and **width** attributes. The height and width for
    the image can either be specified in terms of its percentage with its actual size
    or in terms of pixels. Not that the original resolution of the image will change
    if the ratios are not maintained. Here is an example.


    **Example**


    ```html

    <!DOCTYPE html>

    <html>

    <head>

