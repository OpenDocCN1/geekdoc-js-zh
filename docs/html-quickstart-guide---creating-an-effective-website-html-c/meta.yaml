    This chapter covers marking up text in XHTML.


    # Text Direction


    The element **<bdo>...</bdo>** stands for Bi-Directional Override. You can override
    the text direction using this element. Here is an example.'
- md: "## Special Terms\n\nYou can introduce special terms on your web page on for\
    \ doing it; you can use the element `<dfn>...</dfn>`. This is very much similar\
    \ to italicized text in the middle of a paragraph.\n\nYou would typically use\
    \ the element `<dfn>` when you introduce a key term for the first time. The recent\
    \ browsers will render the text of the `<dfn>` element in an italicized format.\
    \ Here is an example.\n\nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n \
    \   <title>Special Terms Example</title>\n</head>\n<body>\n    <p>The following\
    \ word is a <dfn>special</dfn> term.</p>\n</body>\n</html>\n```\nThe above code\
    \ will produce the following output:\nThe following word is a special term.\n\n\
    ## Quoting Text\n\nIn HTML, you can quote a passage from a different source. For\
    \ doing it, you should place the content in between the opening tag `<blockquote>`\
    \ and closing tag `</blockquote>`.\n\nAny text placed inside this element will\
    \ usually be indented from left and right edges of the text surrounding it. Sometimes\
    \ it uses italicized font. Here is an example.\n\nExample\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>Blockquote Example</title>\n</head>\n<body>\n\
    \    <p>The following description of XHTML is taken from the W3C Web site:</p>\n\
    \    <blockquote>XHTML 1.0 is the W3C's first Recommendation for XHTML, following\
    \ on from earlier work on HTML 4.01, HTML 4.0, HTML 3.2 and HTML 2.0. </blockquote>\n\
    </body>\n</html>\n```\nThe above code will produce the following output:\nThe\
    \ following description of XHTML is taken from the W3C Web site:\nXHTML 1.0 is\
    \ the W3C's first Recommendation for XHTML, following on from earlier work on\
    \ HTML 4.01, HTML 4.0, HTML 3.2 and HTML 2.0.\n\n## Short Quotations\n\nYou can\
    \ add double quotes inside a sentence by using the `<q>...</q>` element. Here\
    \ is an example.\n\nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example\
    \ for Double Quote</title>\n</head>\n<body>\n    <p>Paul is in Spain, <q>I think\
    \ I am right</q>.</p>\n</body>\n</html>\n```\nThe above code will produce the\
    \ following output:\nPaul is in Spain, I think I am right.\n\n## Text Citations\n\
    \nWhen you are quoting some text, by placing the source between the opening and\
    \ closing tags `<cite> </cite>`, you can indicate the source. Here is an example.\n\
    \nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example for Citations</title>\n\
    </head>\n<body>\n    <p>This HTML tutorial is derived from <cite>W3 Standard for\
    \ HTML</cite>.</p>\n</body>\n</html>\n```\nThe above code will produce the following\
    \ output:\nThis HTML tutorial is derived from W3 Standard for HTML.\n\n## Computer\
    \ Code\n\nIf you are adding any programming code to your web page, you should\
    \ place it inside the opening tag `<code>` and closing tag `</code>`. The content\
    \ placed inside this element will usually be presented in the monospaced font,\
    \ like any other code in other programming books. Here is an example.\n\nExample\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example Computer Code</title>\n\
    </head>\n<body>\n    <p>This is regular text. <code>This is code.</code> This\
    \ is regular text.</p>\n</body>\n</html>\n```\nThe above code will produce the\
    \ following output:\nThis is regular text. This is code. This is regular text.\n\
    \n## Keyboard Text\n\nIn some situations, you will need your reader to type text\
    \ using his keyboard. In such situations you can make use of the element `<kbd>...</kbd>`.\
    \ This element will indicate a text that is to be typed. Here is an example.\n\
    \nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example for Keyboard\
    \ Text</title>\n</head>\n<body>\n    <p>Regular text. <kbd>This is inside kbd\
    \ element</kbd> Regular text.</p>\n</body>\n</html>\n```\nThe above code will\
    \ produce the following output:\nRegular text. This is inside kbd element Regular\
    \ text.\n\n## Programming Variables\n\nUsually, this element will be used along\
    \ with the elements `<code>` and `<pre>` for indicating that the content placed\
    \ inside this element is variable. Here is an example.\n\nExample\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>Example Variable Text</title>\n</head>\n<body>\n\
    \    <p><code>document.write(\"<var>user-id</var>\")</code></p>\n</body>\n</html>\n\
    ```\nThe above code will produce the following output:\ndocument.write(\"user-id\"\
    )\n\n## Program Output\n\nThe sample output of a program can be indicated using\
    \ the element `<samp>...</samp>`. Script can also be indicated using this. However,\
    \ it is usually used for documenting coding concepts or programming. Here is an\
    \ example.\n\nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example\
    \ Program Output</title>\n</head>\n<body>\n    <p>The result of the program is\
    \ <samp>Hello World!</samp></p>\n</body>\n</html>\n```\nThe above code will produce\
    \ the following output:\nThe result of the program is Hello World!\n\n## Address\
    \ Text\n\nYou can give the address using the `<address>...</address>` element.\
    \ Here is an example.\n\nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n \
    \   <title>Example for Address</title>\n</head>\n<body>\n    <address>1719 c,\
    \ David Drive, Marietta, Atlanta, Georgia </address>\n</body>\n</html>\n```\n\
    The above code will produce the following output:\n1719 c, David Drive, Marietta,\
    \ Atlanta, Georgia\n\n# Chapter 5: Meta Tags\n\nIn HTML, you are allowed to specifying\
    \ metadata, which is the additional important information regarding the document,\
    \ in different ways. You can use the META elements for including name/value pairs\
    \ for describing the properties of the document, such as document author, author,\
    \ expiry date, the list of keywords, etc.,\n\nSuch additional information can\
    \ be provided using the `<meta>` tag. There are no closing tags for the Meta tag\
    \ and hence it is an empty element. Though it is an empty element, the information\
    \ can be passed through its attributes.\n\nIn general, you can add more than one\
    \ meta tags to your document, based on the information that you are adding to\
    \ your document. The physical appearance of your document will not have any effect\
    \ because of meta tags. From the application point of view, it doesn't matter\
    \ if meta tags are included or not.\n\n## Adding Meta Tags to Your Documents\n\
    \nYou can provide a Meta data to your pages by adding `<meta>` tags within the\
    \ document’s header, represented by the tags `<head>` and `</head>`. In addition\
    \ to their core attributes, they can have the following attributes:\n\n| Attribute\
    \ | Description |\n| --- | --- |\n| Name | Name for the property. Can be anything.\
    \ Examples include, keywords, description, author, revised, generator etc. |\n\
    | content | Specifies the property's value. |\n| scheme | Specifies a scheme to\
    \ interpret the property's value (as declared in the content attribute). |\n|\
    \ http-equiv | Used for http response message headers. For example http-equiv\
    \ can be used to refresh the page or to set a cookie. Values include content-type,\
    \ expires, refresh and set-cookie. |\n\n## Specifying Keywords\n\nImportant keywords\
    \ that are related to the document can be specified using `<meta>` tag. These\
    \ keywords will be later used by various search engines. They will also be used\
    \ for indexing your page for search. Here is an example.\n\nExample\n\nIn the\
    \ below example, we will add the words Ducati, Aprilia and BMW as the important\
    \ keywords related to the document.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>Meta Tags Example</title>\n    <meta name=\"keywords\" content=\"\
    Ducati, Aprilia, BMW\" />\n</head>\n<body>\n    <p>Hello World!</p>\n</body>\n\
    </html>\n```\nThe above code will produce the following output:\nHello World!\n\
    \n## Document Description\n\nYou can provide a short description of your document\
    \ by using `<meta>` tags. Similar to keywords, the description will also be used\
    \ by search engines while indexing the web page for searching purposes. Here is\
    \ an example.\n\nExample\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Example\
    \ for Meta Tags</title>\n    <meta name=\"keywords\" content=\"Ducati, Aprilia,\
    \ BMW\" />\n    <meta name=\"description\" content=\"Learning about Meta Tags.\"\
    \ />\n</head>\n<body>\n    <p>Hello World!</p>\n</body>\n</html>\n```\n\n## Document\
    \ Revision Date\n\nThe `<meta>` tag can be used for providing information regarding\
    \ the last updation of the document. Various web browsers use this information\
    \ while refreshing your web page. Here is an example.\n\nExample\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>Meta Tags Example</title>\n    <meta name=\"\
    keywords\" content=\"Ducati, Aprilia, BMW\" />\n    <meta name=\"description\"\
    \ content=\"Learning about Meta Tags.\" />\n    <meta name=\"revised\" content=\"\
    Topgear, 7/7/15\" />\n</head>\n<body>\n    <p>Hello HTML5!</p>\n</body>\n</html>\n\
    ```\n\n## Document Refreshing"
  mdcn: "\n## 专用术语\n\n你可以在网页中引入专用术语；为此可以使用元素 `<dfn>...</dfn>`。这非常类似于段落中*斜体*文本的用法。\n\
    \n通常，当你第一次引入关键术语时，会使用 `<dfn>` 元素。现代浏览器会将 `<dfn>` 元素中的文本渲染为斜体格式。下面是一个示例。\n\n示例\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>专用术语示例</title>\n</head>\n\
    <body>\n    <p>以下单词是一个<dfn>专用</dfn>术语。</p>\n</body>\n</html>\n```\n上述代码将产生以下输出：\n\
    以下单词是一个专用术语。\n\n## 引用文本\n\n在 HTML 中，你可以引用来自不同来源的段落。为此，你需要将内容放在开始标签 `<blockquote>`\
    \ 和结束标签 `</blockquote>` 之间。\n\n放置在此元素中的任何文本通常会相对于其周围文本的左右边缘进行缩进。有时它使用斜体字体。下面是一个示例。\n\
    \n示例\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>引用块示例</title>\n</head>\n\
    <body>\n    <p>以下关于 XHTML 的描述摘自 W3C 网站：</p>\n    <blockquote>XHTML 1.0 是 W3C 针对\
    \ XHTML 的首个推荐标准，延续了早期在 HTML 4.01、HTML 4.0、HTML 3.2 和 HTML 2.0 方面的工作。</blockquote>\n\
    </body>\n</html>\n```\n上述代码将产生以下输出：\n以下关于 XHTML 的描述摘自 W3C 网站：\nXHTML 1.0 是 W3C\
    \ 针对 XHTML 的首个推荐标准，延续了早期在 HTML 4.01、HTML 4.0、HTML 3.2 和 HTML 2.0 方面的工作。\n\n##\
    \ 短引用\n\n你可以使用 `<q>...</q>` 元素在句子中添加双引号。下面是一个示例。\n\n示例\n```html\n<!DOCTYPE html>\n\
