    \ 9966CC | 9966FF |\n| 999900 | 999933 | 999966 | 999999 | 9999CC | 9999FF |\n\
    | 99CC00 | 99CC33 | 99CC66 | 99CC99 | 99CCCC | 99CCFF |\n| 99FF00 | 99FF33 | 99FF66\
    \ | 99FF99 | 99FFCC | 99FFFF |\n| CC0000 | CC0033 | CC0066 | CC0099 | CC00CC |\
    \ CC00FF |\n| CC3300 | CC3333 | CC3366 | CC3399 | CC33CC | CC33FF |\n| CC6600\
    \ | CC6633 | CC6666 | CC6699 | CC66CC | CC66FF |\n| CC9900 | CC9933 | CC9966 |\
    \ CC9999 | CC99CC | CC99FF |\n| CCCC00 | CCCC33 | CCCC66 | CCCC99 | CCCCCC | CCCCFF\
    \ |\n| CCFF00 | CCFF33 | CCFF66 | CCFF99 | CCFFCC | CCFFFF |\n| FF0000 | FF0033\
    \ | FF0066 | FF0099 | FF00CC | FF00FF |\n| FF3300 | FF3333 | FF3366 | FF3399 |\
    \ FF33CC | FF33FF |\n| FF6600 | FF6633 | FF6666 | FF6699 | FF66CC | FF66FF |\n\
    | FF9900 | FF9933 | FF9966 | FF9999 | FF99CC | FF99FF |\n| FFCC00 | FFCC33 | FFCC66\
    \ | FFCC99 | FFCCCC | FFCCFF |\n| FFFF00 | FFFF33 | FFFF66 | FFFF99 | FFFFCC |\
    \ FFFFFF |\n\n## MPEG\n\nDeveloped by Moving Pictures Experts Group, the MPEG\
    \ format became the rage on the internet as soon as it came into existence. The\
    \ most popular format up to date, it’s supported by every browser out there. That’s\
    \ right, every single one of them! Unfortunately, being very picky, HTML5 allows\
    \ only a few video formats, namely the MP4, WebM and Ogg. As such, this format\
    \ will not be discussed here.\n\nIn previous versions of HTML, you are required\
    \ to install an additional plug-in in order to embed videos on to your webpage.\
    \ As tedious as it sounds, it was actually how things were done before. But now,\
    \ with HTML5, this problem has been solved, and videos can now be included with\
    \ just a simple `<video>` tag, much like how the HTML supports images using `<img>`\
    \ tag (as discussed in an earlier chapter).\n\n## Adding Videos\n\nThe basic syntax\
    \ for adding videos is :\n\n```html\n<video>\n<source>\n</video>\n```\n\nNow,\
    \ the source tag obviously should not be blank as given above. Let us take a look\
    \ at an example, and then we will see the different attributes used, and which\
    \ attributes you *can* use to further customize the video appearance on the web\
    \ page.\n\n### Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<video width=\"\
    640\" height=\"480\" controls>\n  <source src=\"example.mp4\" type=\"example/mp4\"\
    >\n  <source src=\"example.ogg\" type=\"example/ogg\">\n</video>\n</body>\n</html>\n\
    ```\n\nThe above code will embed the example video on to the website. If it has\
    \ not come to your attention yet, there are 2 videos included here. It’s actually\
    \ just one video in 2 different formats. The browser will automatically include\
    \ the video that it supports, and disregards the other video format. Also, when\
    \ you decide to include text within the video tags, it gets displayed *only* if\
    \ the browser does not support the format. Therefore, a good (and easy) way of\
    \ checking if the browser supports a specific format would be to try this code\
    \ out first before executing your actual code:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<video>\n  <source src=\"example.mp4\" type=\"example/mp4\">\n  Looks\
    \ like your browser does not support the mp4 format. Try another browser, or change\
    \ the format now.\n</video>\n</body>\n</html>\n```\n\nThe text given after the\
    \ `<source>` tag will get displayed on your screen only when the format of the\
    \ video you have taken is not supported by the browser."
  mdcn: "\n## 第11章：HTML 多媒体\n\n如今，随着多媒体在互联网上的风靡，当今世界没有哪位设计师不想在他们的网站上添加多媒体。添加多媒体能确保你的网站看起来引人注目，而如果你的网站需要稳定的流量，那么添加此类媒体就变得必不可少。\n\
    \n当第一批浏览器问世时，它们只支持文本。你能想象一个只显示文本的网页吗？没有图片，没有视频，没有声音，没有 GIF 动图。最糟糕的是，只有一种字体和一种颜色！听起来是不是枯燥又无聊？这很可能正是当时的浏览器开发者们的想法，因为此后推出的浏览器都开始支持媒体了！\n\
    \n添加多媒体既简单又有趣，但需要你自己弄清楚——你的用户将使用的浏览器——是否会支持该媒体。大多数浏览器支持本章讨论的流行格式，但有时也会失效。在这些并不少见的情况下，你可能需要安装额外的程序（称为插件）才能让媒体在网页浏览器中正常工作。幸运的是，随着\
    \ HTML5 的出现，所有这些问题都将消失，多媒体的前景一片光明。\n\n由于之前已经讨论过添加图像，本章将重点介绍如何将视频和声音集成到你的网页中。在你这样做的同时，你有责任让用户尽可能轻松地浏览你的网页。这意味着你需要决定是否希望一些图像和声音在页面一弹出就自动播放。如果你的网站面向富裕的用户，他们很可能拥有快速的互联网连接，这意味着加载这些图像和声音不会浪费他们的时间。想象一个网络连接非常慢的人。如果你开始在网页中添加声音和图像，使其在页面打开时就加载，那么由于网速慢，用户将永远无法正常使用你的网站。这是一个权衡：是让你的网页真正具有吸引力和吸引力，还是维护你的用户群。当你的网站是靠流量赚钱时，这是一个严肃的问题。维护你的用户群比向网页中添加大量媒体更重要，尤其是当你的网站主题并非围绕多媒体时。\n\
    \n解决了这个不幸但严肃的（关于加载的）问题，并完成了权衡决策后，让我们来看看如今最常用的一些流行视频和音频格式，以及一些将它们添加到网站中的示例代码。\n\
    \n| 颜色 | 颜色 RGB |\n| :--- | :--- |\n| ![#000000](https://via.placeholder.com/15/000000/000000?text=+)\
    \ | rgb(0,0,0) |\n| ![#ff0000](https://via.placeholder.com/15/ff0000/ff0000?text=+)\
    \ | rgb(255,0,0) |\n| ![#00ff00](https://via.placeholder.com/15/00ff00/00ff00?text=+)\
