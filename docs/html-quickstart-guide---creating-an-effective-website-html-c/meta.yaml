    hex code will be RRGGBB.


    You can take the hexadecimal value from graphics software like MS paint, Paintshop
    Pro or Adobe Photoshop.


    A hash sign # or pound will precede the hexadecimal code. Given below is a table
    with the colors using hex code.'
