  md: '# Conclusion


    Creating a webpage is something that has been wreathed in mysticism and cyber
    mumbo jumbo for years, but I hope that I’ve shown you that it’s not as scary as
    you might think. In fact, HTML is actually fairly straight forward. IF you’re
    looking for a hobby that can really accomplish something and is easy to explain,
    then you’ve come to the right place. These are the foundations upon which you
    can build your webpage and push on to greater things like CSS, Java, JavaScript,
    C++, and the list goes on and on. Remember, that you can never really get in over
    your head if you master and truly understand what it is that you’re working on
    in the moment.


    If something doesn’t make sense to you or is confusing, my best suggestion to
    you is to open up your TextEdit or Notepad and start working on it. Pull it up
    in your browser and have a look at what it does for your page. Taking everything
    step by step will inevitably lead you to the path of success. There is never a
    reason to jump ahead without fully understanding what it is that you’ve done.


    If you ever find yourself having a need to get back to the basics or you just
    don’t remember how to do something simple, come back to this book and have a look
    at the fundamentals. With everything that I have presented to you in this book,
    you should be able to get the grasp on the beginnings of a webpage and if you
    can get the beginning, it’s just a matter of taking the next step piece by piece.
    So good luck and get out there and make an amazing webpage.


    Thank you for Reading! I Need Your Help...'
