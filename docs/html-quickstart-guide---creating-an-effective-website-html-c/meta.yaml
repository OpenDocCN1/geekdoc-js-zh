    ## Chapter 9: HTML Lists


    In HTML, information can be specified using three types of lists. A list must
    contain at least one list element. Lists contain:


    **\<ul\>** - This is an unordered list. The list items will be listed using plain
    bullets.


    **\<ol\>** - This is an ordered list. The list items in this list will be listed
    with different schemes of numbers.


    **\<dl\>** - This is a definition list. The items in the definition list will
    be arranged in the same way as they are in a dictionary.


    ### HTML Unordered Lists


    An unordered list can be defined as a collection of items with no special sequence
    or order. You can create this list by using the **\<ul\>** tag. All the items
    in this list will be marked using bullets. Here is an example.


