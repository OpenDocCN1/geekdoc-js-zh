    # Autocomplete


    An element you should definitely be aware of to make things easier for your user,
    especially if your form is to be used repeatedly. If your user has to submit a
    report once in a couple of days using your HTML form, then using the `<autocomplete>`
    tag will make it much easier for him or her. If you’re aware of the Autofill setting
    in the Google Chrome browser, then understanding the function of this tag should
    be easy. It is the same, except that the user has to first input the details at
    least once, before the form starts autocompleting the fields.


    Let us look at the basic syntax for autocomplete, which is usually placed along
    with the form action. This enables the autocomplete attribute in all of the form’s
    elements.


    ```html

    <form action="page.php" autocomplete="on">

    ```


    # Example


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form action="action_page.php" autocomplete="on">

    Name:<input type="text" name="name"><br>

    Age:<input type="number" name="age"><br>

    Work ID <input type="number" name="id" autocomplete="off"><br>

    <input type="submit">

    </form>

    </body>

    </html>

    ```


    This code will create 3 fields, one each for name, age and work ID. The first
    time the user uses the form, he or she will have to type in the details completely.
    From then on, whenever the form is used, autocomplete will kick in as soon as
    the field is double-clicked, or the first letter is typed, making everything so
    much more easier for the user.


    Note that autocomplete is switched off for the Work ID. This is done because the
    Work ID, which should be kept private should not be displayed to others who type
    in someone else’s name. What this basically means is that you can switch autocomplete
    attribute off to which field you want by adding an `autocomplete="off"` at the
    end of the input type.


    This covers most of the HTML form elements, and you should be able to create your
    own form with different elements and attributes now. Always remember to keep trying
    different elements to find out what makes the form easy to use. The ultimate aim
    of a form is to make it easy to use so that even a layman will be able fill it
    up quickly.


    ## Chapter 8: HTML Images


    Images can be very helpful to beautify and to explain the complex concepts of
    your web page in a simple way. In this chapter, we will add images to your webpages
    in simple steps.


    ### Insert Image


    In HTML, you can add any image to your web page with the `<img>` tag. The syntax
    for using the `<img>` tag is given below.


    Syntax:


    `<img src="Image URL" ... attributes-list/>`


    The `<img>` tag is an empty one, it means that there will be no closing tag for
    it. You can only give the list of attributes to this tag. Here is an example.


    **Example**


    For trying the below example, you need to keep the .htm file and the image within
    the same directory.


    ```html

