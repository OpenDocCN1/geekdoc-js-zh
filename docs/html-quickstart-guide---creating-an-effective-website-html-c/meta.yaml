    \ 标签来包含。\n\n## 添加视频\n\n添加视频的基本语法是：\n\n```html\n<video>\n<source>\n</video>\n```\n\
    \n现在，source 标签显然不应该是空的，如上所示。让我们看一个示例，然后我们将看到使用的不同属性，以及你可以*使用*哪些属性来进一步自定义视频在网页上的外观。\n\
    \n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<video width=\"640\" height=\"\
    480\" controls>\n  <source src=\"example.mp4\" type=\"example/mp4\">\n  <source\
    \ src=\"example.ogg\" type=\"example/ogg\">\n</video>\n</body>\n</html>\n```\n\
    \n上述代码会将示例视频嵌入网站。如果你还没注意到，这里包含了 2 个视频。实际上只是一个视频的两种不同格式。浏览器会自动包含它支持的视频，并忽略其他视频格式。另外，当你决定在视频标签内包含文本时，*仅*在浏览器不支持该格式时才会显示。因此，检查浏览器是否支持特定格式的一个好（且简单）方法是在执行实际代码之前先尝试此代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<video>\n  <source src=\"example.mp4\"\
    \ type=\"example/mp4\">\n  Looks like your browser does not support the mp4 format.\
    \ Try another browser, or change the format now.\n</video>\n</body>\n</html>\n\
    ```\n\n只有在你选择的视频格式不被浏览器支持时，`<source>` 标签后给出的文本才会显示在你的屏幕上。\n"
