    <!DOCTYPE html> <html> <head> <title>HTML Ordered List</title> </head> <body>

    <ol type="1"> <li>Apple</li> <li>Mango</li> <li>Banana</li> <li>Pear</li>

    ```


    The above code will produce the following output:


