    \ qualifications: <input type=\"text\">\n<input type=\"submit\">\n</fieldset>\n\
    </form>\n</body>\n</html>\n```\n\n这段代码将创建 3 个文本框，用户将在其中输入相应的信息，最后提供的提交按钮将执行与前面所述相同的操作。\n\
    \n## HTML5 元素\n\n下面给出的元素只是 HTML5 中新增的各种元素中的两个。这些元素 *仅* 在 HTML5 中有效，不被以前的版本支持。\n\
    \n## Datalist\n\n有时，在一个很长的列表中寻找特定选项可能相当烦人，尤其是当列表非常大的时候。在这种情况下，添加一个 datalist 而不是仅仅使用\
    \ `<option>` 标签，会让用户更轻松。Datalist 与 option 标签不同，因为用户实际上可以在你提供的字段中输入内容。一旦他或她开始输入，相关的选项就会弹出。你会注意到\
    \ Datalist 与 number 标签非常相似，只不过这个是用于文本的。它充当输入字段的自动填充功能。\n\n### 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<form action=\"page.asp\" method=\"get\">\n \
    \ <input list=\"bike\" name=\"bike\">\n  <datalist id=\"bike\">\n    <option value=\"\
    bike1\">\n    <option value=\"bike2\">\n    <option value=\"bike3\">\n    <option\
    \ value=\"bike4\">\n    <option value=\"bike5\">\n  </datalist>\n  <input type=\"\
    submit\">\n</form>\n</body>\n</html>\n```\n\n尽管非常有用，但 datalist 标签只能在 HTML5 中使用，并且不被\
    \ Internet Explorer 9 或其之前的版本支持，甚至 Safari 也不支持。\n\n## Keygen\n\n当你需要对用户进行身份验证时，就需要使用\
