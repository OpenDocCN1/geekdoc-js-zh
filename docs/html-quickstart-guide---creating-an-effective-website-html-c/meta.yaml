  md: '# Chapter 12: HTML5 and Semantics


    Once you have truly mastered HTML, you will begin to notice that the tags you
    use usually make no sense, unless you know what it does. For example, consider
    the tag <div>. When a person who has no knowledge of HTML sees this tag, he or
    she will *never* be able to figure out the true meaning of the tag, or its function.
    This isn’t really much of an issue, but it is quite annoying.

    We evolved from having to use just binary numbers to using text. Why not take
    it a step further and use text that actually make sense to both man and machine?
    This is exactly what HTML5 does. With HTML5, semantic elements have been added,
    using which HTML coding has become extremely easy.

    We have already discussed in detail about one semantic element, thought it was
    not mentioned at the time : <form>. Yes, the form tag is a semantic element! When
    you see the tag <form>, you automatically realize it has something to do with
    forms, and you can start adding attributes accordingly.


    Given below is a list of some of the semantic elements that HTML5 offers:


    +   <details>

    <article>

    <section>

    <summary>

    <time>

    <aside>

    <mark>


    We shall now proceed to look at some examples to understand how these tags work.


    # Article


    The article tag lets you create an article. You can, of course, create an article
    that has some relation to the web page, but the general idea of an article is'
  merge: -1
  pgno: 83
- img_proc: true
  md: "that each article should be different. Therefore, the <article> tag is used\
    \ when you want to mention something that goes out of context, or is not related\
    \ to the main topic of the website in the slightest.\n\nHere is an example code\
    \ which you can try out:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<article>\n\
    \ <h2>This is the article's heading</h1>\n <p>With the help of the article tag,\
    \ you can create articles that provide content not related to the webpage.</p>\n\
    </article>\n</body>\n</html>\n```\n\nThe above code will execute the text given,\
    \ with the heading in the <h2> size.\n\n# Section\n\nSections are groups of content\
    \ that are based on a single idea or theme. This is how they differ from articles,\
    \ where the theme can be anything. Sections have to stick to one theme for the\
    \ word to make sense. Here is an example of how 2 sections can be put together\
    \ in HTML:\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<section>\n <h1>Section 1</h1>\n\
    \ <p>This is section 1's content. This section states that HTML coding is easy\
    \ to learn, and easy to forget, so stay in practice if you want to become a</p>\n\
    ```"
  merge: -1
  pgno: 84
- img_proc: true
  md: "```\nprofessional!</p>\n</section>\n<section>\n  <h1>Section 2</h1>\n  <p>This\
    \ is section 2. This section would like to say that this book covers almost all\
    \ the concepts, and you can always come back and refer to it when you get doubts\
    \ regarding the basics.</p>\n</section>\n</body>\n</html>\n```\n\nAs you can see,\
    \ the two sections have got the same theme - HTML, but are very different in what\
    \ they are trying to say.\n\n# Aside\n\nOftentimes you may have seen the main\
    \ content being displayed in the centre or towards the left, with some minor related\
    \ content being displayed in the sidebar. This is done with the help of the <aside>\
    \ tag. This tag is used to display small sections of information that is related\
    \ to the main topic, and can be placed at the sides.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>This is the main topic, about HTML.</p>\n<aside>\n  <h4>HTML</h4>\n\
    \  <p>HTML is Hyper Text Markup Language</p>\n</aside>\n</body>\n</html>\n```"
  merge: -1
  pgno: 85
- img_proc: true
  md: "# Details and Summary\n\nThis is the small arrow mark you might have seen,\
    \ which when clicked, expands a small text box and displays additional information.\
    \ Details is therefore, a way of adding information which the user can choose\
    \ to see. The summary tag lets you add the title for the details tag. The best\
    \ way to understand this is with an example:\n\n```\n<!DOCTYPE html>\n\n<html>\n\
    \n<body>\n\n<details>\n\n  <summary>Click here for more info</summary>\n\n  <p>This\
    \ is the extra information.</p>\n\n</details>\n\n</body>\n\n</html>\n```\n\nWhen\
    \ you try this code, you will notice that the text in the summary gets displayed\
    \ as the title, with the other text going into the expandable text box. This is\
    \ how the details and summary works.\n\n# Figure and Figcaption\n\nThis is as\
    \ easy as it gets. You can add an image, and attach a caption to it with the help\
    \ of the figure and fig caption tags.\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<body>\n\
    \n<p>This is your description. Instead of giving a caption for the image you are\
    \ uploading as a description, it might be a better idea to use the <figcaption>\
    \ tag as shown below.</p>\n\n<figure>\n\n  <img src=\"image.jpeg\" alt=\"Enter\
    \ Image\" width=\"300\" height=\"220\">\n```"
  merge: -1
  pgno: 86
