    # HTML Definition Lists


    XHTML and HTML support a list style called the **definition list**. Here the entities
    will be listed as they are in an encyclopaedia or dictionary. Using the definition
    list is ideal for representing a list of items, glossary, or other value/name
    lists.


    The given tags will be used by the definition list:


    - `<dl>` - Defines the start of the list

    - `<dt>` - A term

    - `<dd>` - Term definition

    - `</dl>` - Defines the end of the list


    Here is an example using `<dt>`:


    ## Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Definition List</title>

    </head>

    <body>

    <dl>

    <dt><b>HTML</b></dt>

    <dd>This stands for Hyper Text Markup Language</dd>

    <dt><b>HTTP</b></dt>

    <dd>This stands for Hyper Text Transfer Protocol</dd>

    </dl>

    </body>

    </html>

    ```


    The above code will produce the following output:


    HTML


    This stands for Hyper Text Markup Language


    HTTP


    This stands for Hyper Text Transfer Protocol


    # Chapter 10: HTML Colors


    Colors play a very important role in beautifying your web page, making it good
    to look and feel. On the page level, you can specify the colors by using the `<body>`
    tag. You can also use the **bgcolor** attribute for setting the colors with different
    tags.


    The following attributes are available with the `<body>` tag, with which different
    colors can be set.


    - **vlink** - This will set the color for the links that are visited (links clicked
    once or more)

    - **link** - The color of the linked text can be set using this.

    - **alink** - The color for the selected links or active links can be set using
    this.

    - **text** - The body text color can be set with this.

    - **bgcolor** - The color of the background can be set with this.


    ## HTML Color Coding Methods


    There are three different methods in HTML for setting colors for the web page.
    They are as follows:


    - **Color names** - you can directly specify the names of the colors like red,
    blue or green.

    - **Hex codes** - You can specify the color using a six digit hex code. Every
    color can be represented by the red, blue and green colors present in them. The
    hex code is nothing but a representation of this.

    - **Color decimal or percentage values** - This value will be specified by using
    the `rgb()` property.


    Now we will have a look at these coloring schemes in detail.


    ## HTML Colors - Color Names


    You can directly specify the name of the color for setting it as the background
    or text color. There are a total of 16 basic colors listed by W3C, that validate
    with the HTML validator. Most of the major browsers support more than 200 different
    colors.


    ### W3C Standard 16 Colors


    The list of 16 standard colors, recommended by W3C is given below.


    ![](img/f74ee827cb7499ae484bf6957e894a87_64_0.png)


    ### Example


    Here is an example where we set the background color using the color name.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Name</title>

    </head>

    <body text="blue" bgcolor="green">

    <p>Use different color names for body and table and see the result.</p>

    <table bgcolor="black">

    <tr>

    <td>

    <font color="white">This text will appear white on black background.</font>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ## HTML Colors - Hex Codes


    The hex code is nothing but the six digit representation for a color. The first
    two digits of the hex code represent the value of red, the next two digits represented
    the value of green and the last two digits represented the value of blue. The
    hex code will be RRGGBB.


    You can take the hexadecimal value from graphics software like MS paint, Paintshop
    Pro or Adobe Photoshop.


    A hash sign # or pound will precede the hexadecimal code. Given below is a table
    with the colors using hex code.


    | Color | Color HEX |

    | :--- | :--- |

    | ![#000000](https://via.placeholder.com/15/000000/000000?text=+) | #000000 |

    | ![#FF0000](https://via.placeholder.com/15/FF0000/FF0000?text=+) | #FF0000 |

    | ![#00FF00](https://via.placeholder.com/15/00FF00/00FF00?text=+) | #00FF00 |

    | ![#0000FF](https://via.placeholder.com/15/0000FF/0000FF?text=+) | #0000FF |

    | ![#FFFF00](https://via.placeholder.com/15/FFFF00/FFFF00?text=+) | #FFFF00 |

    | ![#00FFFF](https://via.placeholder.com/15/00FFFF/00FFFF?text=+) | #00FFFF |

    | ![#FF00FF](https://via.placeholder.com/15/FF00FF/FF00FF?text=+) | #FF00FF |

    | ![#C0C0C0](https://via.placeholder.com/15/C0C0C0/C0C0C0?text=+) | #C0C0C0 |

    | ![#FFFFFF](https://via.placeholder.com/15/FFFFFF/FFFFFF?text=+) | #FFFFFF |


    ### Example


    Here are the examples to set background of an HTML tag by color code in hexadecimal:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Hex</title>

    </head>

    <body text="#0000FF" bgcolor="#00FF00">

    <p>Use different color hex for body and table and see the result.</p>

    <table bgcolor="#000000">

    <tr>

    <td><font color="#FFFFFF">This text will appear white on black background.</font></td>

    </tr>

    </table>

    </body>

    </html>

    ```


