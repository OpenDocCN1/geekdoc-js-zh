    tag for it. But, <i>This text is italic</i> is a italic text element.


    # ## Nested Elements in HTML


    HTML allows you to nest HTML elements within other HTML elements.

    Here is an example:

    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Nested Elements</title>

    </head>

    <body>

    <h2>This is <b>bold</b></h2>

    ```'
