    \ and year instead of typing it out.\n\nExample\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n<form action=\"page.php\">\nChoose time:\n<input type=\"time\" name=\"\
    time\">\n<input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\nThis example\
    \ creates a field where the user has to type in the time, or select from a time-picker\
    \ which should pop up as soon as he or she starts typing. It’s important to know\
    \ that this time picker might not be supported in certain browsers, so do make\
    \ sure to check beforehand if what you need your user to do is select from the\
    \ picker and not type the input out.\n\nIn a similar way, the input type week,\
    \ datetime and month can be used. Week and month work with most browsers, but\
    \ datetime tag also gives the timezone. If you only want the local time in the\
    \ user’s country, then using"
  mdcn: "\n## 文本\n\n这支持一个单行输入字段（注意此字段仅接受文本）。\n\n示例\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n<form action=\"\">\nUsername:<input type=\"text\" name=\"username\">\n\
    </form>\n</body>\n</html>\n```\n\n此代码在用户提供用户名时接受文本。用户输入的内容将存储在你发送文件的目标页面中一个名为\
    \ `username` 的变量中。表单操作（form action）留空，你可以插入任何希望信息发送到的页面。\n\n## 提交\n\n这会创建一个名为“Submit”（提交）的按钮，其功能如其名所示。它将输入的详细信息发送到表单处理器（form\
    \ handler），这是表单操作的一个花哨名称。\n\n示例\n\n```\n<form action=\"action.php\">\nUsername:<br>\n\
    <input type=\"text\" name=\"userid\"><br>\nPassword:<br>\n<input type=\"password\"\
    \ name=\"pass\"><br>\n<input type=\"submit\" value=\"Submit\">\n</form>\n```\n\
    \n这里使用了另一个输入类型，称为密码（Password）。当指定 `<input type=\"password\">` 时，文本框也接受特殊字符，并且一旦按下提交按钮，详细信息就会发送到表单处理器。通过更改提交按钮的\
    \ `value`，你可以更改显示的文本。例如，设置 `value=\"Click to confirm\"` 将创建一个显示“Click to confirm”的按钮，但执行提交按钮的操作。\n\
    \n## 单选按钮\n\n单选按钮输入类型提供了一组用户可以选择的选项列表，用户在任何时候只能选择其中一个选项。\n\n示例\n\n```\n<form>\n\
    \    <input type=\"radio\" name=\"occupation\" value=\"student\"> Student<br>\n\
    \    <input type=\"radio\" name=\"occupation\" value=\"unemployed\"> Unemployed<br>\n\
    \    <input type=\"radio\" name=\"occupation\" value=\"teacher\"> Teacher\n</form>\n\
    ```\n\n这创建了一组关于用户职业的选项。如果你希望某个特定选项默认被选中，可以通过在输入类型末尾添加“checked”来实现。\n\n例如，将 `<input\
    \ type=\"radio\" name=\"occupation\" value=\"student\"> Student<br>` 替换为 `<input\
    \ type=\"radio\" name=\"occupation\" value=\"student\" checked> Student<br>` 将默认选中\
    \ Student。\n\n## 复选框\n\n当你想让用户从提供的选项中选择多个选项时，使用复选框。语法与其他输入类型相同。\n\n示例\n\n```\n\
    <form action=\"action_page.php\">\n<input type=\"checkbox\" name=\"gadget1\" value=\"\
    Laptop\">I have a laptop<br>\n<input type=\"checkbox\" name=\"gadget2\" value=\"\
    PC\">I have a PC<br>\n<input type=\"submit\">\n</form>\n```\n\n此示例创建了2个复选框，询问用户是否拥有笔记本电脑和台式机。同样，如果你想让某些选项默认被选中，请在输入类型末尾添加“checked”，如下所示：\n\
    \n```\n<input type=\"checkbox\" name=\"gadget1\" value=\"Laptop\" checked>I have\
    \ a laptop <br>\n```\n\n## 按钮\n\n你可以利用按钮输入类型来定义点击按钮时执行的操作。\n\n示例\n\n```\n<input\
    \ type=\"button\" onclick=\"alert('HTML form tutorial!')\" value=\"Click Here\
    \ Please!\">\n```\n\n这段小代码生成一个按钮，显示“Click Here Please!”，点击后会弹出一个消息框显示“HTML form\
    \ tutorial”。与其他输入类型一样，更改 `value` 会更改按钮内显示的消息。\n\n## 数字\n\n这是一种只接受用户输入数字的输入类型。你可以选择数字的范围，用户将能够输入一个仅存在于该范围内的数字。当你想为生日或年龄等信息提供输入字段时，这很有用。该字段自动带有选择箭头，可以使用，或者用户也可以手动输入。\n\
    \n示例\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"page.php\">\nBirthdate:\n\
    <input type=\"number\" name=\"quantity\" min=\"1\" max=\"31\">\n<input type=\"\
    submit\" value=\"Confirm\">\n</form>\n</body>\n</html>\n```\n\n此示例代码将创建一个用于出生日期的输入字段，最大值为31，最小值为1。你显然可以根据需要更改这些数字。正如你可能猜到的，关键字“min”和“max”分别代表最小值和最大值。但是，如果你的浏览器是\
    \ Internet Explorer 9 或更早版本，则此输入类型将不起作用。\n\n## 文本区域\n\n当你的表单要求用户输入个人详细信息时，你希望有一个可以接受多行输入的输入字段。在这种情况下，使用\
    \ `input type=\"text\"` 将不起作用，你需要使用 `TextArea`。\n\n示例\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n<textarea rows=\"5\" cols=\"75\">\nYou can use this space to type\
    \ whatever you want. All of this will be\ndisplayed in the text field. If you\
    \ decide to not give information or text that\nappears by default, you can leave\
    \ this space blank, and the user will be able\nto enter his or her personal details\
    \ or the relevant detail you want.\n</textarea>\n</body>\n</html>\n```\n\n遗憾的是，这个示例代码只获取详细信息，但不处理这些信息。为了处理信息，你需要包含一个提交输入类型（前面讨论过）和一个表单操作。此表单操作必须将详细信息发送到网站上的相关页面（通常在网页本身内），在那里可以处理详细信息，并可以使用最终结果。例如，如果你想将详细信息存储在数据库中，你需要通过表单操作来实现，而没有提交按钮这是不可能的。同样，很明显，“rows”代表你希望输入字段具有的行数，“cols”代表你希望的列数（基本上是每行的字母数，包括空格）。\n\
    \n## 范围\n\n你可能在许多HTML表单中见过一个滑块，你可以在其中点击一个圆形按钮并将其拖动到要指示的数字或百分比的位置。你可以借助 `<input\
    \ type=\"range\">` 标签来实现。这会创建一个滑块，其最小值和最大值由你设置，用户可以使用它。\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n<form action=\"action_page.php\" method=\"get\">\nPercentage:\n\
    <input type=\"range\" name=\"percent\" min=\"0\" max=\"100\">\n<input type=\"\
    submit\">\n</form>\n</body>\n</html>\n```\n\n这将创建一个范围在0-100%之间的滑块，你将能够选择其中的任何值。但是，它只接受整数。一个理想的例子是，在一个获取用户体脂百分比、身高和体重输入的表单中，然后输出身体质量指数（BMI）。这里，你可以使用滑块来获取用户的体脂百分比输入，而不是数字。最终，重要的是表单易于使用，而不是如何获取输入。\n\
    \n请注意，Internet Explorer 9 及其更早版本不支持 `<input type=\"range\">` 标签。\n\n## 时间和周\n\n\
    时间（time）和周（week）标签允许用户输入时间、周以及年份。如果你的表单要求用户输入他或她的出生年份，那么使用这些标签将使其变得更加容易，因为它会弹出一个时间或周选择器，用户只需从中选择时间、周和年份，而无需输入。\n\
    \n示例\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<form action=\"page.php\">\nChoose\
    \ time:\n<input type=\"time\" name=\"time\">\n<input type=\"submit\">\n</form>\n\
    </body>\n</html>\n```\n\n此示例创建了一个字段，用户必须输入时间，或者从时间选择器中选择（在他或她开始输入时应该会弹出）。重要的是要知道某些浏览器可能不支持此时间选择器，因此请务必事先检查，确保你需要用户做的是从选择器中选择，而不是输入。\n\
    \n类似地，可以使用 `input type=\"week\"`、`datetime` 和 `month`。`week` 和 `month` 在大多数浏览器中有效，但\
    \ `datetime` 标签还提供时区。如果你只想要用户所在国家/地区的本地时间，那么使用\n"
