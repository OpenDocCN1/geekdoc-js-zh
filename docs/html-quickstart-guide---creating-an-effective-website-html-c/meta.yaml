    ```\n\n尝试在没有 `<optgroup>` 标签的情况下执行上述代码。你会注意到一个包含 Envy、Pavilion、Y50 和 Y40 的列表，没有顺序。现在使用上面给出的完全相同的代码，你将获得一个具有多个子标题（子标题的数量与使用的\
    \ `<optgroup>` 标签数量相同）的列表，型号将列在这些子标题下。如果你使用 `<select>` 标签从用户那里获取输入，并且你的选项数量相当多，那么你\
    \ *必须* 使用 `<optgroup>` 标签。\n\n`<optgroup>` 语法中的 'label' 是你想要赋予子标题的名称。请注意，只有选项可以被选中，子标题则不能。\n\
    \n## Readonly\n\n有时你需要一个字段，其中包含一个固定的值或文本，用户不应能够更改，但应该能够看到。当你遇到这种情况时，**`<readonly>`**\
    \ 属性就很有用。顾名思义，用户将只能阅读字段中给出的内容，而无法对该字段进行更改。\n\n`<readonly>` 标签的语法是：\n\n```html\n\
    <input type=\"type_you_need\" name=\"name\" value=\"value\" readonly>\n```\n"
