  md: '# Chapter 3: Formatting in HTML


    If you are familiar with using the word processor, you probably must also be similar
    with making text bold, italicized or underlined. There are a total of 10 options
    available in HTML and XHTML, which will indicate your text will appear.


    # Bold Text


    Any content that is placed in between `<b>...</b>` element will be displayed as
    bold text. Here is an example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Example for Bold Text</title> </head> <body>
    <p>The following word will be in a <b>bold</b> typeface.</p> </body> </html>

    ```


    The above code will produce the following output:

    The following word will be in a **bold** typeface.


    # Italic Text


    Any content that is placed in between `<i>...</i>` element will be displayed as
    italicized text. Here is an example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Example for Italic Text</title> </head> <body>
    <p>The following word will be in a <i>italicized</i> typeface.</p> </body> </html>

