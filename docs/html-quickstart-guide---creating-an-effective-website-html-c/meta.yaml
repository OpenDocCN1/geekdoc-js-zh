    # Document Refreshing'
- md: 'You can use the <meta> tag for specifying the duration on when to auto refresh
    your page. Here is an example.


    ## Example


    If you wish to make your web page refreshed automatically for every 10 seconds,
    use the below syntax.


    ### Syntax:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    <meta name="revised" content="Topgear, 7/7/15" />

    <meta http-equiv="refresh" content="10" />

    </head>

    <body>

    <p>Hello HTML5!</p>

    </body>

    </html>

    ```


    ## Page Redirection


    Using <meta> tag, you can redirect your web page to other web pages. You can actually
    specify the duration when you want to redirect the page by specifying the number
    of seconds. Here is an example.


    ### Example


    In the following example, the current page will be redirected to another page
    after 10 seconds. If you leave the content attribute unspecified, the current
    web page will be redirected immediately.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    <meta name="revised" content="Topgear, 7/7/15" />

    <meta http-equiv="refresh" content="5; url=http://www.topgear.com" />

    </head>

    <body>

    <p>Hello HTML5!</p>

    </body>

    </html>

    ```


    ## Setting Cookies


    Cookies are nothing but a data that is stored on your computer in the form of
    small text files. Cookies are exchanged between the web server and the web browser
    for keeping track on the information that the web application needs.


    Using <meta> tag, the cookies can be stored on the client side and of this information
    can be later used by the web server for tracking the visitor of its site.


    ### Example


    In the following example, the current page will be redirected to another page
    after 10 seconds. If you leave the content attribute unspecified, the current
    web page will be redirected immediately.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    <meta name="revised" content="Topgear, 7/Jul/15" />

    <meta http-equiv="cookie" content="userid=xyz; expires=Wednesday, 08-Aug-15 23:59:59
    GMT;" />

    </head>

    <body>

    <p>Hello HTML5!</p>

    </body>

    </html>

    ```


    If the expiration date and time are not included, the cookie will then be considered
    as a session cookie. Session cookies will be deleted when the browser is closed.


    ## Setting Author Name


    You can set an author name in a web page using meta tag. See an example below:


    ### Example


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    <meta name="author" content="Mahnaz Mohtashim" />

    </head>

    <body>

    <p>Hello HTML5!</p>

    </body>

    </html>

    ```


    ## Specify Character Set


    You can use <meta> tag to specify character set used within the webpage.


    ### Example


    By default, Web servers and Web browsers use ISO-8859-1 (Latin1) encoding to process
    Web pages. Following is an example to set UTF-8 encoding:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    <meta name="author" content="Mahnaz Mohtashim" />

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    </head>

    <body>

    <p>Hello HTML5!</p>

    </body>

    </html>

    ```


    To serve the static page with traditional Chinese characters, the webpage must
    contain a <meta> tag to set Big5 encoding:


    ```html

