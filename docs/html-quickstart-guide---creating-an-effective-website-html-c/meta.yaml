    ```

    <!DOCTYPE html> <html> <head> <title>Strong Text Example</title> </head> <body>
    <p>The following word uses a <strong>strong</strong> typeface.</p> </body> </html>

    ```


    The above code will produce the following output:


    The following word uses a **strong** typeface.


    # Text Abbreviation


    In HTML, you are allowed to abbreviate your text. You can do it by placing the
    text inside the opening **<abbr>** and closing **</abbr>** tags. The full description
    should be added in the title attribute and nothing else, if present. Here is an
    example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Text Abbreviation</title> </head> <body>
    <p>My best friend''s name is <abbr title="Abigail">Abi</abbr>.</p> </body> </html>

    ```


    The above code will produce the following output:


    My best friend''s name is Abi.


    # Acronym Element


    You can indicate your text as an acronym in HTML by using the **<acronym>** element.
    You should place your text in between the opening tag <acronym> and closing tag
    </acronym> for indicating it as an acronym. Here is an example.


    Example


    ```

    <!DOCTYPE html> <html> <head> <title>Acronym Example</title> </head> <body> <p>This
    chapter covers marking up text in <acronym>XHTML</acronym>.</p> </body> </html>

    ```


