  md: 'Let us now take a look at the different attributes included in this example.


    # Width and Height


    Under the <video> tag, width and height are mentioned, which are the dimensions
    of the video as it appears on the webpage. If you do not include the the width
    and height attributes, the browser will automatically select the default width
    to height ratio of the video. When you go for the default video size as chosen
    by the browser, the video will begin to flicker whenever it loads, which becomes
    an annoying issue.


    However, if you do include these two attributes, but give lower aspect ratios
    than the actual video, then the video displayed on the webpage will be scaled
    down, proportionately. If you give the width and height attributes a value greater
    than the video’s actual aspect ratio, then the the video will cover more screen,
    but the video size remains as is. The rest of the area gets filled by a black
    space. For a user, this would look absolutely horrible, and you should avoid giving
    greater aspect ratios at all costs. When worst comes to worst and you are not
    able to find out the aspect ratio of the video, then just include the video without
    any aspect ratio. The default video size look will be much better than the same
    sized video being displayed in large black space.


    # Controls


    You must have seen the play, pause, seeking, volume, toggle full-screen, captions/subtitles
    and other controls in most of the video streaming websites you have used. These
    are nothing but the ‘controls’ in HTML5. Instead of adding these options one by
    one, HTML5 makes it extremely easy; all you have to do is include the term ‘controls’
    in the video tag, and all of these options become available in the video.


    It’s important to note that the the full-screen option may not be available to
    you if the browser does not support it. It is mandatory that you check which browser
    accepts the video format you are using, and which browser allows the full-screen
    option.


    # Source


    Source src is literally as it sounds - this is what you have to use to specify
    which video you want to embed on to the website. When you include multiple source
    files in different formats, then the browser will automatically'
