    \ FFFFFF |\n\n## MPEG\n\nMPEG 格式由动态图像专家组开发，一经问世就在互联网上风靡一时。作为迄今为止最流行的格式，它受到了所有浏览器的支持。没错，是所有浏览器！不幸的是，HTML5\
    \ 非常挑剔，只允许少数几种视频格式，即 MP4、WebM 和 Ogg。因此，这里将不讨论 MPEG 格式。\n\n在以前的 HTML 版本中，你需要安装额外的插件才能在网页上嵌入视频。尽管听起来很繁琐，但这在过去实际上是做事的方式。但现在，随着\
