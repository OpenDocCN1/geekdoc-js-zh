    \ mp3 的音频文件传统上比扩展名为 ogg 的音频文件更大。在质量方面，mp3 优于 ogg，但质量差异如此之小，你甚至无法识别。可以说，无论哪种方式，它都无关紧要。然而，就\
    \ wav 而言，ogg 和 mp3 格式在大小上都更小。\n\n未压缩的 wav 音频文件大得惊人，但受到大多数浏览器的支持。Ogg 体积最小，但不幸的是并非通用。有几个浏览器不接受\
