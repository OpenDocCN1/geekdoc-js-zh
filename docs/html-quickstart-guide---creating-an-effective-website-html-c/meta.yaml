- md: "## Chapter 11: HTML Multimedia\n\nWith multimedia being the rage these days\
    \ in the Internet, there are no designers in the world today who do not want to\
    \ add multimedia to their websites. Adding multimedia ensures that your website\
    \ looks stunning, and if your website requires a steady flow of traffic, then\
    \ adding such media becomes a necessity.\n\nWhen the first browsers were launched,\
    \ they supported only text. Can you imagine a webpage displaying nothing but text?\
    \ No pictures, no videos, no sounds, no gifs. The worst part was that only one\
    \ font and one color existed! Sounds dull and boring, doesn’t it? Which is exactly\
    \ what must have been going through the minds of the browser developers at that\
    \ time, because the browsers which came up after that started supporting media!\n\
    \nAdding multimedia is very easy and fun to do, but it lies up to you to figure\
    \ out if the browser - which your users will be using - will support the media\
    \ or not. Most browsers support the popular formats discussed in this chapter,\
    \ but sometimes, it will not work. In these not-so-rare cases, you might need\
    \ to install an additional programs (called a plug-in) to let the media work in\
    \ the web browser. Fortunately, with HTML5, all these problems will disappear,\
    \ and a promising future for multimedia lies ahead.\n\nSince adding images has\
    \ already been discussed previously, this chapter will focus specifically on integrating\
    \ videos and sounds into your webpage. While you do this, it is your responsibility\
    \ to make the perusal of your webpage by your users as easy as possible. What\
    \ this means is that you have to be able to decide if you want some images and\
    \ sounds to play automatically as soon as a page pops up. If your website targets\
    \ users who are well off, they most likely will be having a fast internet connection,\
    \ which means loading these images and sounds will not waste their time. Imagine\
    \ a person with really slow connection. If you start adding sounds and images\
    \ to your webpages to be loaded as soon as the page is opened, the user will never\
    \ be able to use your site properly because of the slow connection. It’s a tradeoff,\
    \ between making your webpage really attractive and catchy, and maintaining your\
    \ user-base. This is a serious issue when your website is one that earns money\
    \ from the traffic it gets. Maintaining your user-base is more important than\
    \ adding loads of media into your webpage, especially if your website doesn’t\
    \ revolve around the topic of multimedia.\n\nWith the unfortunately boring, but\
    \ serious issue out of the way and your decision in the tradeoff having been made,\
    \ let us take a look at some popular video and sound formats that are most commonly\
    \ used these days, along with some example codes on how to add them into your\
    \ website.\n\n| Color | Color RGB |\n| :--- | :--- |\n| ![#000000](https://via.placeholder.com/15/000000/000000?text=+)\
    \ | rgb(0,0,0) |\n| ![#ff0000](https://via.placeholder.com/15/ff0000/ff0000?text=+)\
    \ | rgb(255,0,0) |\n| ![#00ff00](https://via.placeholder.com/15/00ff00/00ff00?text=+)\
    \ | rgb(0,255,0) |\n| ![#0000ff](https://via.placeholder.com/15/0000ff/0000ff?text=+)\
    \ | rgb(0,0,255) |\n| ![#ffff00](https://via.placeholder.com/15/ffff00/ffff00?text=+)\
