    ## 72 对象：构造函数


    下面再次展示不同托管方案的图表版本。


    ![](img/00004.jpg)


    以下是我如何将 Basic 方案的信息封装到一个对象和五个属性中。


    ```

    1 var plan1 = {

    2   name:   "Basic",

    3   price: 3.99,

    4   space: 100,

    5   transfer: 1000,

    6   pages: 10

    7 };

    ```


    但这只得到了一个表示第一个方案的对象。对于 Professional 和 Ultimate 方案，我还得重复同样的操作。手工操作太多。我们需要一个工厂来批量生产这些东西。JavaScript
    允许你构建这样一个工厂。它被称为构造函数。


    ```

    1 function Plan(name, price, space, transfer, pages) {

    2   this.name = name;

    3   this.price = price;

    4   this.space = space;

    5   this.transfer = transfer;

    6   this.pages = pages;

    7 }

    ```


    这是一个普通的函数定义，但有两个不同之处：


    * 函数名首字母大写。JavaScript 并不在意你是否这样做，但按照惯例，这样做是为了将构造函数与普通函数区分开来。

    * 每个参数值都被赋值给一个变量。但这个变量是附加到某个尚未指定名称的对象上的属性。不过别担心。就像参数值将由调用代码填充一样，对象名称也将由调用代码填充。


    以下是创建 Basic 方案对象的调用代码。


    ```

    var plan1 = new Plan("Basic", 3.99, 100, 1000, 10);

    ```


    如果没有那个 `new`，这只是一个普通的函数调用。正是这个关键字告诉 JavaScript 创建一个新对象。新对象的名称是 `plan1`。它的属性在圆括号内列出。


    现在，使用相同的模式，你可以轻松地批量生产任意数量的对象。


    ```

    1 var plan1 = new Plan("Basic", 3.99, 100, 1000, 10);

    2 var plan2 = new Plan("Premium", 5.99, 500, 5000, 50);

    3 var plan3 = new Plan("Ultimate", 9.99, 2000, 20000, 500);

    ```


    通常，参数和属性使用相同的名称，但并非必须如此。你可以这样写：


    ```

    1 function Plan(name, price, space, transfer, pages) {

    2   this.doc = name;

    3   this.grumpy = price;

    4   this.sleepy = space;

    5   this.bashful = transfer;

    6   this.sneezy = pages;

    7 }

    ```


