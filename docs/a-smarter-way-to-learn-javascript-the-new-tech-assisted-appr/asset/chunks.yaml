    `if (totalCost === materialsCost + laborCost) {`


    `if (x + y === a - b) {`


    When you''re comparing strings, the equality operator is case-sensitive. "Rose"
    does not equal "rose."


    Another comparison operator, `!==`, is the opposite of `===`. It means is not
    equal to.


    `1 if (yourTicketNumber` `!==` `487208) {`


    `2   alert("Better luck next time.");`


    `3 }`


