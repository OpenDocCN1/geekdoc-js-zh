    \ me now”提示。\n\n这段代码能工作，但笨拙且略显丑陋，尤其当你有许多条件需要测试时。现在该学习一种更优雅的替代方案，用于测试众多条件，那就是 `switch`\
    \ 语句。你需要测试的条件越多，就越会喜欢 `switch` 语句。下面的 `switch` 语句实现了与上面示例相同的功能：\n\n```javascript\n\
    switch(dayOfWk) {\ncase \"Sat\" :\n  alert(\"Whoopee\");\n  break;\ncase \"Sun\"\
    \ :\n  alert(\"Whoopee\");\n  break;\ncase \"Fri\" :\n  alert(\"TGIF!\");\n  break;\n\
    default :\n  alert(\"Shoot me now!\");\n}\n```\n\n现在，我希望你只关注上面代码的前三行。\n\n1.  以关键字\
    \ `switch` 开头。紧接着是圆括号内被测试的变量。然后是一个左花括号。\n\n2.  第一种可能性：变量 `dayOfWeek` 的值为 \"Sat\"\
    。以关键字 `case` 开头。然后是尝试的值 \"Sat\"。接着是一个空格和一个冒号。\n\n3.  如果测试通过——即 `dayOfWeek` 确实等于\
    \ \"Sat\"——则执行该语句。该语句缩进。如果测试通过，可以执行任意数量的语句。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/39.html`](http://www.ASmarterWayToLearn.com/javascript/39.html)\n\
    \n## 40 switch 语句：如何完善它们\n\n上一章你关注了 `switch` 语句的前三行。\n\n```javascript\nswitch(dayOfWk)\
    \ {\ncase \"Sat\" :\n  alert(\"Whoopee\");\n  break;\ncase \"Sun\" :\n  alert(\"\
    Whoopee\");\n  break;\ncase \"Fri\" :\n  alert(\"TGIF!\");\n  break;\ndefault\
    \ :\n  alert(\"Shoot me now!\");\n}\n```\n\n本章你将处理剩余的代码。\n\n`if` 语句的第一行后面跟着一个（或多个）在条件为真时执行的语句。`switch`\
    \ 语句的工作方式类似。在每个 `case` 子句的下一行，有一个（或多个）在该 case 为真时执行的语句。\n\n同样，如果 case 为真，执行的代码缩进\
    \ 2 个空格。（通用约定是缩进一定量。关于最佳缩进量意见不一。我统一使用 2 空格缩进，这很常见但并非通用。）\n\n但为什么除了最后一个 case 之外，其他所有\
    \ case 都包含一个 `break` 语句？\n\nJavaScript 有一个不方便的特性：当找到真 case 后，JavaScript 不仅会执行该\
    \ case 下方的语句，还会执行其下方所有 case 的语句。因此，在找到真 case 并执行条件代码后，你需要通过编写 `break` 语句跳出 `switch`\
    \ 块。例如，如果你省略了上面代码中的 `break` 语句，会发生以下情况：\n\n1.  弹出一个提示框显示 \"Whoopee！\"\n\n2.  第二个提示框显示\
    \ \"Whoopee！\"\n\n3.  第三个提示框显示 \"TGIF！\"\n\n4.  第四个提示框显示 \"Shoot me now。\"\n\n\
    现在让我们看第 11 行。\n\n```javascript\ndefault :\n  alert(\"Shoot me now!\");\n}\n```\n\
    \n关键字 `default` 的作用类似于 `if...else` 语句中的 `else`。如果上面的条件都不满足，则执行其后的代码。因此，在上面的例子中，如果\
    \ `dayOfWk` 不是 \"Sat\"、\"Sun\" 或 \"Fri\"——即它不等于这三个值中的任何一个——则会弹出一个提示框显示 \"Shoot\
    \ me now。\"\n\n注意 `default` 后面跟一个空格和一个冒号，就像上面的 `case` 子句一样。\n\n还要注意没有 `break`\
    \ 语句。这是因为 `default` 总是在最后，这意味着它下面没有需要不当执行的语句。\n\n在 `switch` 语句中，default 代码是可选的，就像\
    \ `if` 语句后的 `else` 代码是可选的。如果没有 default 代码，且所有 case 都不为真，则什么也不会发生。\n\n当没有 default\
    \ 代码时，细心的程序员会在最后一个条件后仍然加上 `break` 语句作为保险，即使它可能是多余的。如果你以后决定在末尾添加一个新条件，就不必记得为上面的块添加\
    \ `break` 以避免灾难性的级联语句。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/40.html`](http://www.ASmarterWayToLearn.com/javascript/40.html)\n\
    \n## 41 while 循环\n\n这个 `for` 循环在每次迭代时显示一个提示框。\n\n```javascript\nfor (var i = 0;\
    \ i <= 3; i++) {\n  alert(i);\n}\n```\n\n如你所知，该过程由圆括号内的三个项控制：\n\n*   `var i =\
    \ 0` 建立一个计数器。\n\n*   `i <= 3` 表示只要 `i` 小于或等于 3，循环就继续运行。由于 `i` 初始赋值为 0，循环将运行 4\
    \ 次。\n\n*   `i++` 在每次迭代时递增 `i`。\n\n所有循环指令都打包在圆括号之间：从哪里开始计数器，循环持续多久，以及每次循环如何更新计数器。\n\
    \n`while` 循环做同样的事情，但组织方式不同。只有中间项（循环持续多久）放在圆括号内。计数器在 `while` 块的第一行之前定义。计数器在循环运行时执行的代码中更新。\n\
    \n```javascript\nvar i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n```\n\n\
    在其他方面，`while` 循环的组织方式与 `for` 循环类似。\n\n*   圆括号括住循环限制条件。\n\n*   花括号括住要执行的代码。\n\n\
    *   执行的代码缩进 2 个空格。\n\n由于任何 `for` 循环都可以转换为 `while` 循环，反之亦然，你可以使用你喜欢的任何一种。\n\n>\
    \ 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/41.html`](http://www.ASmarterWayToLearn.com/javascript/41.html)\n\
    \n## 42 do...while 循环\n\n在 `while` 循环中，指令的顺序是：\n\n1.  声明一个变量作为计数器，并为其赋值。\n\n2.\
    \  开始循环，指定循环运行多长时间。\n\n3.  执行一个或多个语句。\n\n4.  在循环内部，作为最后一个语句，递增计数器。\n\n```javascript\n\
    var i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n```\n\n`do...while` 循环完成与\
    \ `while` 循环几乎相同的任务。\n\n```javascript\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n\
    } while (i <= 3);\n```\n\n两种循环之间的区别：\n\n*   关键字 `do` 代替 `while` 作为语句的开头。\n\n*\
    \   `while` 子句（包括圆括号内的循环限制代码）移到了底部——在右花括号之后。\n\n注意 `while` 子句以分号结尾。\n\n在功能上，`while`\
    \ 循环和 `do...while` 循环的区别在于，可以编写一个 `while` 语句，其指令块永远不会执行。考虑这个 `while` 循环。\n\n```javascript\n\
    var i = 0;\nwhile (i < 0) {\n  alert(i);\n  i++;\n}\n```\n\n代码表示只要计数器小于 0，就持续显示提示框。但由于计数器从未小于\
    \ 0，花括号内的代码永远不会执行。\n\n将其与 `do...while` 循环进行比较。\n\n```javascript\nvar i = 0;\n\
    do {\n  alert(i);\n  i++;\n} while (i < 0);\n```\n\n提示框会显示一次，即使继续运行的条件——`i` 小于\
    \ 0——从未发生。由于 `do...while` 循环在到达底部的循环限制条件之前就执行了花括号内的代码，因此无论循环限制条件如何，它至少会执行一次该代码。\n\
    \n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/42.html`](http://www.ASmarterWayToLearn.com/javascript/42.html)\n\
    \n## 43 放置脚本\n\n"
- fmt: "\nJavaScript code doesn't care where it lives. It can be mixed in with—that\
    \ is, embedded in—the HTML that creates a Web page. Or, like an external CSS file,\
    \ it can be placed in a separate file that is loaded by the HTML file. In most\
    \ cases, it's best to have an external JavaScript file, for some of the same reasons\
    \ it's best to have an external CSS file. But you still need to know how to place\
    \ JavaScript within your HTML file, so let's start with that.\n\nAs you know,\
    \ the order of HTML code is important, because it determines the order of elements\
    \ on the page. If you want the headline to appear above the text, you put the\
    \ headline above the text in the HTML. But JavaScript doesn't work the same way.\
    \ All of your JavaScript functions, for example, are loaded into memory when the\
    \ page loads. Wherever the code may be, the browser finds it and stores it by\
    \ the time the page is finished loading. Once the page is loaded, all the JavaScript\
    \ code stays in memory, ready to execute, for as long as the page is displayed.\n\
    \nYou can legally put JavaScript code almost anywhere in the HTML file—in the\
    \ head section, at the beginning of the body section, somewhere in the middle\
    \ of the body section, or at the end of the body section. You could, if you wanted\
    \ to be perverse, sprinkle different Javascript functions all over your HTML file\
    \ in different places. The browser would sort it all out.\n\nGenerally, the best\
    \ place for scripts, though, is at the end of the body section. This guarantees\
    \ that CSS styling and image display won't get held up while scripts are loading.\n\
    \nWhen you embed blocks of JavaScript in HTML (as opposed to having a separate\
    \ JavaScript file), you must enclose the JavaScript code between `<script>` and\
    \ `</script>` tags. Here are two functions enclosed between the tags.\n\n```\n\
    <script>\nfunction sayHi() {\n  alert(\"Hello world!\");\n}\nfunction sayBye()\
    \ {\n  alert(\"Buh-bye!\");\n}\n</script>\n```\n\nYou can enclose any amount of\
    \ code—including any number of functions—between the `<script>` and `</script>`\
    \ tags. And, as I mentioned before, you can have different sections of code scattered\
    \ all over your HTML file if you want. But each section has to be enclosed between\
    \ the `<script>` and `</script>` tags.\n\nFor most purposes, coders prefer to\
    \ have all or most of their JavaScript code in a separate JavaScript file, then\
    \ have the browser load this external file at the same time it's loading the HTML\
    \ file.\n\nA JavaScript file is, like HTML and CSS files, a simple text file.\
    \ It doesn't have a header or any other special sections. It doesn't even have\
    \ `<script>` and `</script>` tags. It's just pure JavaScript code. The entire\
    \ contents of a JavaScript file that holds the two functions in the example above\
    \ would be:\n\n```\nfunction sayHi() {\n  alert(\"Hello world!\");\n}\nfunction\
    \ sayBye() {\n  alert(\"Buh-bye!\");\n}\n```\n\nWhat makes a JavaScript file a\
    \ JavaScript file is its file extension: .js. The front end of the file name is\
    \ up to you, as long as it's legal. Any of these would be fine.\n\n* `scripts.js`\n\
    * `coreJS.js`\n* `main-code.js`\n* `main_code.js`\n* `main.code.js`\n\nYou include\
    \ a JavaScript file in an HTML file the same way you include an external CSS file—with\
    \ an opening and closing tag.\n\n`<script src=\"whatever.js\"></script>`\n\nFor\
    \ the same reason that it's a good idea to put JavaScript code at the end of the\
    \ body section, it's a good idea to place the markup that includes JavaScript\
    \ files at the end of the body section.\n\nYou can include as many external JavaScript\
    \ files as you like.\n\nYou can include JavaScript files and also embed other\
    \ JavaScript code in the HTML.\n\n> Find the interactive coding exercises for\
    \ this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/43.html](http://www.ASmarterWayToLearn.com/javascript/43.html)\n\
    \n## 44. Commenting\n\nCommenting, as you know from your work with HTML and CSS,\
    \ is a way to tell the browser to ignore certain portions of text that you include\
    \ within the body of code. Comments are for the human, not the machine. They help\
    \ you and others understand your code when it comes time to revise. You can also\
    \ use commenting to comment out portions of your code for testing and debugging.\
    \ Since, compared with HTML or CSS, JavaScript is typically harder to understand\
    \ when you come back to it later, you may want to put extra effort into commenting\
    \ your JS code, especially if you're working in a team or if someone else may\
    \ be asked to maintain your code in the future.\n\nIn HTML there's only one way\
    \ to mark text as a comment. You write `<!--` to open and `-->` to close. And\
    \ in CSS there's only one way to mark text as a comment. You write `/*` to open\
    \ and `*/` to close. But in Javascript there are two ways mark text as a comment.\n\
    \nThe first way is to mark a single line as a comment, as in line 1 here.\n\n\
    ```\n// This is a comment, ignored by the browser\nfor (var i = 0; i\n  if (animals[i]\
    \ === \"bat\") {\n    animals[i] = \"cat\";\n  }\n}\n```\n\nThe two slashes mean,\
    \ \"Everything from here to the end of this line is a comment.\" In the example\
    \ above, that means the whole line, since the slashes are at the beginning. But\
    \ you can write a line that's part-code and part-comment, this way.\n\n`var animals\
    \ = [];` `// Declare an empty array`\n\nYou can write as many lines of comments\
    \ as you like. Every line must begin with the two slashes.\n\n```\n// Each comment\
    \ line must begin with a pair\n// of slashes, like this. (Most code editors,\n\
    // by the way, are smart enough to recognize\n// comments and render them in a\
    \ different\n// color so they're easy for you to\n// distinguish from code.)\n\
    ```\n\nWhen you comment with slashes, there's no closing tag, because the end\
    \ of the line closes the comment automatically.\n\nFor legibility, separate the\
    \ pair of slashes from the comment with a space. When you're combining code with\
    \ a comment on the same line, separate the code from the pair of slashes with\
    \ a space.\n\nWhen a comment requires more than one line, many coders prefer an\
    \ alternative method. As a user of CSS, you're already familiar with these tags.\n\
    \n```\n/*\nWhen a comment requires more than one line,\na block comment like this,\
    \ with its opening\nand closing tags, is the way to go.\n*/\n```\n\nJavaScript\
    \ multi-line comment tags are the same as CSS comment tags. Open with `/*`. Close\
    \ with `*/`.\n\n> Find the interactive coding exercises for this chapter at:\n\
    > \n> [http://www.ASmarterWayToLearn.com/js/44.html](http://www.ASmarterWayToLearn.com/javascript/44.html)\n\
    \n## 45. Events: link\n\nA good website is a responsive website. The user does\
    \ something—clicks a button, moves the mouse, presses a key—and something happens.\
    \ JavaScript gives you many ways to respond to the user's needs. A few examples:\n\
    \nThe user clicks a button saying \"Our Guarantee\" and an alert displays spelling\
    \ out the guarantee.\n\nA page displays a \"before\" picture of a model. When\
    \ the user mouses over the picture, it is replaced by an \"after\" picture of\
    \ her.\n\nThe user types a number in the Ounces field on a form. When she clicks\
    \ in the Grams field, the equivalent in grams displays.\n\nThe user has entered\
    \ her email address in a form, and is about to type a comment. When she moves\
    \ the cursor from the email field to the comment field, JavaScript checks to see\
    \ if the email address is valid. In this case, it isn't—she's omitted \".com\"\
    \ at the end of the address. A message displays letting her know that she's entered\
    \ an invalid email address.\n\nOn an online shopping site, there's a picture of\
    \ a black watch. Next to it is a drop-down list asking the user to choose a color.\
    \ When she chooses, the color of the watch in the picture changes to that color.\n\
    \nAll of these user actions—clicking a button, moving the mouse, moving from one\
    \ field to another in a form, selecting a different option—are known as events.\
    \ JavaScript code that responds to an event—for example, displaying a guarantee\
    \ or swapping an image when the pointer hovers over it—is called an event handler.\n"
