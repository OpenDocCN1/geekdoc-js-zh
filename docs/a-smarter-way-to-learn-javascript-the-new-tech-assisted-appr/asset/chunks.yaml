    `2  var pCounter = 0;`


    `3  for (var i = 0; i < d.childNodes.length; i++) {`


    `4    if (d.childNodes[i].nodeType === 1 ) {`


    `5      pCounter++;`


    `6    }`


    `7    if (pCounter === 2) {`


    `8      d.childNodes[i].innerHTML = "All his men.";`


    `9      break;`


    `10   }`


    `11 }`


    Here''s the breakdown:


    1 Assigns the div to the variable `d`


    2 Counts the number of paragraphs


    3 Goes through the children of the div looking for the next element node, i.e.
    Type 1, which we assume is a paragraph


    4-6 Adds 1 to the counter. We''re looking for the second paragraph.


    7-9 When the counter hits 2, we''ve reached the targeted paragraph. Change the
    text


    Of course, if you know you might want your JavaScript to change that second paragraph,
    it would be a lot easier to assign it an id, and go straight to it, like this.


    `document.``getElementById("p2")``.innerHTML = "All his men.";`


    You can see why the `getElementId` method is more popular with coders than tracing
    the DOM hierarchy. But there are some things you can''t do without working your
    way through the parent-child relationships of the DOM, as you''ll learn in subsequent
    chapters.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/61.html](http://www.ASmarterWayToLearn.com/javascript/61.html)


    62


    The DOM:


    More ways to target elements


    So far you''ve learned to use the DOM''s parent-child hierarchy to target a child
    node of a parent node by specifying its order in an array-like collection of children—`childNodes[0]`,
    `childNodes[1]`, `childNodes[2]`, and so on. But there are other ways to use the
    hierarchy for targeting. To begin with, instead of writing `childNodes[0]`, you
    can write `firstChild`. And instead of writing, for example, `childNodes[9]`,
    to target the 10th child in a 10-child collection of children, you can write `lastChild`.


    `var targetNode = parentNode.``childNodes[0]``;`


    ...is the same as...


    `var targetNode = parentNode.``firstChild``;`


    And if there are, for example, 3 child nodes...


    `var targetNode = parentNode.``childNodes[2]``;`


    ...is the same as...


    `var targetNode = parentNode.``lastChild``;`


    You can also work backwards, targeting the parent node of any child node. Let''s
    say you have this markup. Using the DOM, how do you find the parent of the highlighted
    div?


    `<div id="div1">`


    `<div id="div2">`


    `    <p>Chicago</p>`


    `    <p>Kansas City</p>`


    `    <p>St. Louis</p>`


    `  </div>`


    `</div>`


    You want to know the parent of the div with the id "div2". The following code
    assigns the parent of the "div2" div to the variable `pNode`.


    `1 var kidNode = document.getElementById("div2");`


    `2 var pNode = kidNode.``parentNode``;`


    You can use `nextSibling` and `previousSibling` to target the next child and the
    previous child in the collection of an element''s children. In the following code,
    the first statement targets a div with the id "div1". The second statement targets
    the next node that has the same parent as the "div1" id.


    `1 var firstEl = document.getElementById("div1");`


    `2 secondEl = firstEl.``nextSibling``;`


    If there is no `nextSibling` or `previousSibling`, you get null. In the following
    code, the variable `nonexistentEl` has a value of null, because JavaScript finds
    that there is no previous node that has the same parent as `firstEl`.


    `1 var firstEl = document.getElementById("div1");`


    `2 var nonexistentEl = firstEl.``previousSibling``;`


    Counting siblings can be tricky, because, as you know, some browsers treat whitespace
    created by HTML formatting as text nodes, even though they''re empty and without
    significance.


    In the HTML example above, with two divs and three paragraphs, you might think
    that the next sibling of the first paragraph is the second paragraph. But actually,
    in some browsers, the first paragraph''s next sibling is an empty text node. The
    next sibling of that node is the second paragraph.


    What this means is that in order to target a node with `nextSibling` or `previousSibling`,
    you have to either format your HTML markup defensively as I showed you in the
    last chapter, or else type-test each node to make sure it''s the kind you''re
    looking for, as I also showed you in the last chapter.


    Once again, I''ll say that you''re often better off assigning an id to any node
    you might want to "read" or change. Then you can target the node more directly,
    using `document.getElementById`.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/62.html](http://www.ASmarterWayToLearn.com/javascript/62.html)


    63


    The DOM:


    Getting a target''s name


    In a previous chapter you learned how to get a node''s node type with a statement
    like this.


    `var nType = targetNode.``nodeType``;`


    In the example above, if the node is an element, the variable `nType` will be
    assigned the number 1\. If the node is text, it''ll be assigned the number 3.


    You can get additional information about a node by using `nodeName`. In the following
    example, the node name of the target node is assigned to the variable `nName.`


    `1 var parent = document.getElementById("div1");`


    `2 var target = parent.firstChild;`


    `3 nName = target.``nodeName``;`


    Lines 1 and 2 target the first child of an element with the id "div1". Line 3
    assigns the node name of the target to the variable `nName`.


    In the example above, if the node is an element, the variable `nName` will be
    assigned a string, like P or DIV, that corresponds to the characters of the tag
    that are enclosed in the brackets. In HTML, the name is usually given in all-caps,
    even if the markup is in lowercase.


    | Tag | Node Name |


    | --- | --- |


    | <p> or <P> | P |


    | <div> or <DIV> | DIV |


    | <span> or <SPAN> | SPAN |


    | <img> or <IMG> | IMG |


    | <a> or <A> | A |


    | <em> or <EM> | EM |


    | <table> or <TABLE> | TABLE |


    | <li> or <LI> | LI |


    On the other hand, if the node is a text node, the name of the node is always
    #text—in lower-case.


    If it''s a text node, you can find out its value—i.e. its content—this way.


    `1 var parent = document.getElementById("div1");`


    `2 var target = parent.firstChild;`


    `3 var nTextContent = target.``nodeValue``;`


    Lines 1 and 2 target the first child of an element with the id "div1". Line 3
    assigns the node value to the variable `nTextContent`.'
