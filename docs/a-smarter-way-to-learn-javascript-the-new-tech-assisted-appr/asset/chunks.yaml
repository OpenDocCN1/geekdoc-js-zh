    for loops


    You know the song "99 Bottles of Beer on the Wall"? If you''re teaching someone
    the song, you could give them these instructions:


    1.  Sing "99 bottles of beer on the wall, 99 bottles of beer."


    2.  Sing "Take one down and pass it around, 98 bottles of beer on the wall."


    3.  Sing "98 bottles of beer on the wall, 98 bottles of beer."


    4.  Sing "Take one down and pass it around, 97 bottles of beer on the wall."


    5.  Sing "97 bottles of beer on the wall, 97 bottles of beer."


    6.  Sing "Take one down and pass it around, 96 bottles of beer on the wall."


    ...and so on, for 192 more lines of instructions.


    But that isn''t how you''d give the instructions, is it? You''d be more concise.
    You''d say something like this:


    Sing "99 bottles of beer on the wall, 99 bottles of beer. Take one down and pass
    it around, 98 bottles of beer on the wall." Repeat this, subtracting 1 each time,
    until there are no more bottles of beer on the wall.


    In coding, you run into the bottles-of-beer situation quite often. For example,
    suppose you''ve offered to check if the user''s city is one of the 5 cleanest
    in the U.S. The user has entered her city, and you''ve assigned her city to the
    variable `cityToCheck`.


    You''ve already assigned the list of the 5 cleanest cities to the array `cleanestCities`.


    `var cleanestCities = ["Cheyenne", "Santa Fe", "Tucson", "Great Falls", "Honolulu"];`


    Now you go through the array to see if there''s a match with the user''s city.
    If there is, you display an alert telling the user her city is one of the cleanest.
    If there''s no match, you display an alert telling the user her city isn''t on
    the list.


    `1  if (cityToCheck === cleanestCities[0]) {`


    `2    alert("It''s one of the cleanest cities");`


    `3  }`


    `4  else if (cityToCheck === cleanestCities[1]) {`


    `5    alert("It''s one of the cleanest cities");`


    `6  }`


    `7  else if (cityToCheck === cleanestCities[2]) {`


    `8    alert("It''s one of the cleanest cities");`


    `9  }`


    `10 else if (cityToCheck === cleanestCities[3]) {`


    `11   alert("It''s one of the cleanest cities");`


    `12 }`


    `13 else if (cityToCheck === cleanestCities[4]) {`


    `14   alert("It''s one of the cleanest cities");`


    `15 }`


    `16 else {`


    `17   alert("It''s not on the list");`


    `18 }`


    Conveniently, JavaScript provides a more concise coding approach. Here''s a for
    loop that accomplishes most of what the verbose code in the example above accomplishes.


    `1` `for (var i = 0; i <= 4; i++) {`


    `2   if (cityToCheck === cleanestCities[i]) {`


    `3     alert("It''s one of the cleanest cities");`


    `4   }`


    `5 }`


    Let me break down the first line for you.


    The first line begins with the keyword `for`.


    The three specifications that define the loop are inside the parentheses.


    1.  A variable that counts iterations and also serves as the changing array index
    is declared and set to a starting value, in this case 0.


    2.  The limit on the loop is defined. In this case, the loop is to keep running
    as long as the counter doesn''t exceed 4\. Since the counter, in this case, is
    starting at 0, the loop will run 5 times.


    3.  What happens to the counter at the end of every loop. In this case, the counter
    is incremented each time.


    The three specifications inside the parentheses are always in the same order:


    1.  What to call the counter (usually `i`) and what number to start it at (typically
    0)


    2.  How many loops to run (in this case, the number of elements in the array)


    3.  How to change the counter after each iteration (typically to add 1 each time
    through)


    Things to keep in mind:


    *   In the example, the counter, `i`, serves two purposes. It keeps track of the
    number of iterations so looping can halt at the right point. And it serves as
    the index number of the array, allowing the code to progress through all the elements
    of the array as the counter increments with each iteration.


    *   There is nothing sacred about using `i` as the counter. You can use any legal
    variable name. But coders usually use `i` because it keeps the first line compact,
    and because coders understand that `i` stands for "iteration."


    *   In the example, the initial count is 0, the index number of the first element
    of the array. But it could be any number, depending on your needs.


    *   In the example, the counter increments with each iteration. But, depending
    on your needs, you can decrement it, increase it by 2, or change it in some other
    way each time through.


    *   In the example, I specify that the loop is to run as long as `i <= 4`. Alternatively,
    I could have specified `i < 5`. Either way, since the counter starts at 0, the
    loop runs 5 times.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/18.html](http://www.ASmarterWayToLearn.com/javascript/18.html)


