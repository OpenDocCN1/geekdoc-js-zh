    Note that, even though the action is a click on the submit button, the `onSubmit`
    event handler is in the `form` tag, not in the submit button tag. That''s because
    the submission is an event that applies to the whole form, not the submit button.


    Here''s where things get interesting. When the form is submitted, the function
    `checkAddress` looks to see if the user has entered anything in the email field.
    If not, the function displays an alert reminding the user that the email address
    is required.


    In order to do this, the function needs a way to read what''s in the email field.
    This is where the id that I added to the field comes in. Here''s the code for
    the function.


    `1 function checkAddress(``fieldId``) {`


    `2   ``if (document.getElementById(fieldId).value === "") {`


    `3    alert("Email address required.");`


    `4   }`


    `5 }`


    If there''s no value in the email field, an alert displays telling the user that
    an email address is required.


    This is the sequence you need to memorize:


