  trans: "\n\n* 每个属性以名称开头，后跟冒号，然后是值。\n* 除最后一个属性定义外，每个属性定义末尾都有逗号。\n* 由于第一行有等号，右花括号后跟分号。\n\
    \n现在让我们再添加一个属性 `discountMonths`。如果当前月份是七月、八月或十二月，客户将获得托管计划 20%的折扣。为了跟踪这些特殊月份，我们将它们分配给一个新属性。这个新属性是一个数组，而不是一个简单变量。\n\
    \n`plan1.discountMonths = [6, 7, 11];`\n\n上面的语句为对象 `plan1` 创建了一个新属性 `discountMonths`，并将一个数组赋值给它，该数组表示客户获得折扣的三个月份。\n\
    \n引用这个数组属性的各个元素的方式与引用任何数组的元素相同，使用方括号内的数字，但使用对象-属性对的点表示法：`plan1.discountMonths`。\n\
    \n`var mo = plan1.discountMonths[2];`\n\n上面的语句将数组的第三个元素（代表十二月的数字）赋值给变量 `mo`。\n\
    \n到目前为止，我们只定义了一个对象 `plan1` 及其属性。要完成包含 `plan2` 和 `plan3` 的对象集合，你必须重复同样的操作，然后再重复一次。你可能会想，这比我在本章开头定义\
    \ 15 个简单变量要费事得多，但定义对象及其属性实际上是一种更好的方式，原因我将在后续章节中讨论。此外，还有一种更省力的方法，你也会学到。\n\n> 本章的交互式编码练习请访问：\n\
    > \n> [`www.ASmarterWayToLearn.com/js/69.html`](http://www.ASmarterWayToLearn.com/javascript/69.html)\n\
    \n# 70 对象：属性\n\n要更改对象数值属性的值，使用简单的赋值语句，就像给普通变量赋值一样。\n\n`deal3.cost = 79.95;`\n\n\
    无论 `deal3.cost` 之前的值是什么，现在它变成了 79.95。\n\n当然，你也可以赋值字符串而不是数字。\n\n`deal3.name = \"\
    Super-saver\";`\n\n无论 `deal3.name` 之前的值是什么，现在它变成了 \"Super-saver\"。\n\n你也可以将数组列表赋值给一个属性。\n\
    \n`deal3.features = [\"Guarantee\", \"Free Ship\"];`\n\n无论 `deal3.features` 之前的值是什么，现在它变成了一个包含元素\
    \ \"Guarantee\" 和 \"Free Ship\" 的数组。\n\n你还可以赋值布尔值。\n\n`deal3.membersOnly = false;`\n\
    \n无论 `deal3.membersOnly` 之前的值是什么，现在它变成了 `false`。\n\n你也可以使用赋值语句为对象定义一个新属性。假设对象\
    \ `deal3` 有一些属性，但其中没有 `deal3.market`。现在你想添加它，同时给它赋值。\n\n`deal3.market = \"regional\"\
    ;`\n\n就像你可以通过不赋值来创建一个未定义的变量一样，你也可以创建一个没有任何属性的对象。\n\n`var deal4 = {};`\n\n如果你想现在创建一个属性，稍后再赋值，你可以用\
    \ `undefined` 值创建它。\n\n`deal3.market = undefined;`\n\n注意，关键字 `undefined` 没有引号。它不是字符串。\n\
    \n你可以删除对象的一个属性。\n\n`delete deal3.market;`\n\n你可以检查对象的某个属性是否存在。下面的语句测试是否存在 `deal3.market`，并将结果（true\
    \ 或 false）赋值给变量 `propertyExists`。\n\n`propertyExists = \"market\" in deal3;`\n\
    \n需要注意的事项：\n\n* 你可以使用任何合法的变量名代替 `propertyExists`。\n* 关键字 `in` 询问：“属性 `market`\
    \ 是否在对象 `deal3` 中——true 还是 false？”\n* 属性 `market` 用引号括起来。\n* 对象 `deal3` 没有用引号括起来。\n\
    \n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/70.html`](http://www.ASmarterWayToLearn.com/javascript/70.html)\n\
    \n# 71 对象：方法\n\n让我们回到显示不同托管计划的图表。\n\n![](img/00010.jpg)\n\n我们将编写一个函数，根据此图表计算年费。请注意，如果用户在一年中的某些时间注册，他将获得全年折扣。如果他在七月或八月注册\
    \ Basic 计划，他将获得 20%的折扣。如果他在七月、八月或十二月注册 Professional 计划，他将获得 20%的折扣。如果他在七月或八月注册\
    \ Ultimate 计划，他将获得 20%的折扣。\n\n我们首先创建三个带有属性的对象。这是代表 Basic 计划的对象及其属性。\n\n```\nvar\
    \ plan1 = {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer: 1000,\n\
    \  pages: 10,\n  discountMonths: [6, 7]\n};\n```\n\n该函数遍历所有折扣月份（第 5 行），检查是否有任何月份恰好是当前月份（第\
    \ 6 行）。如果是，则通过将常规价格乘以 0.8 来计算 20%的折扣。然后，它将月价格（无论是否打折）乘以 12，得到年价格，并将数字返回给调用代码（第\
    \ 11 行）。\n\n```\nfunction calcAnnual() {\n  var bestPrice = plan1.price;\n  var\
    \ currDate = new Date();\n  var thisMo = currDate.getMonth();\n  for (var i =\
    \ 0; i < plan1.discountMonths.length; i++) {\n    if (plan1.discountMonths[i]\
    \ === thisMo) {\n      bestPrice = plan1.price * .8;\n      break;\n    }\n  }\n\
    \  return bestPrice * 12;\n}\n```\n\n这是执行该函数的调用语句。\n\n`var annualPrice = calcAnnual();`\n\
    \n但现在让我们让函数更灵活，使折扣率可以根据调用语句传递给它的值而变化。以下是修订版，如果用户符合折扣条件，则将收取的百分比传递给参数 `percentIfDisc`。\n\
    \n```\nfunction calcAnnual(percentIfDisc) {\n  var bestPrice = plan1.price;\n\
    \  var currDate = new Date();\n  var thisMo = currDate.getMonth();\n  for (var\
    \ i = 0; i < plan1.discountMonths.length; i++) {\n    if (plan1.discountMonths[i]\
    \ === thisMo) {\n      bestPrice = plan1.price * percentIfDisc;\n      break;\n\
    \    }\n  }\n  return bestPrice * 12;\n}\n```\n\n这是将值传递给函数并执行它的调用语句。在此示例中，它传递值\
    \ 0.85，表示 15%的折扣。\n\n`var annualPrice = calcAnnual(.85);`\n\n你已经了解到可以将变量附加到对象上，该变量就成为对象的属性。现在还有更多消息。你可以将函数附加到对象上，该函数就成为该对象的方法。它执行与普通函数相同的任务，但现在它附加到了对象上。为什么要使用方法而不是普通函数的原因将在后续章节中变得清晰。现在，让我展示如何操作。\n\
    \n以下代码将我之前编写的函数插入到对象定义中，因此现在它是一个方法。在操作上，它与普通函数相同，但现在它附加到了对象上。\n\n```\nvar plan1\
    \ = {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer: 1000,\n\
    \  pages: 10,\n  discountMonths: [6, 7],\n  calcAnnual: function(percentIfDisc)\
    \ {\n    var bestPrice = plan1.price;\n    var currDate = new Date();\n    var\
    \ thisMo = currDate.getMonth();\n    for (var i = 0; i < plan1.discountMonths.length;\
    \ i++) {\n      if (plan1.discountMonths[i] === thisMo) {\n        bestPrice =\
    \ plan1.price * percentIfDisc;\n        break;\n      }\n    }\n    return bestPrice\
    \ * 12;\n  }\n};\n```\n\n需要注意的事项：\n\n* 除了第一行，该方法的每一行都与我们开始时用来创建普通函数的代码相同。\n\n"
- fmt: '

    The method definition begins the same way a property definition begins, with the
    name followed by a colon.


    A comma ends every property definition and method definition except for the last
    property or method. If you were to add a property or method below the `calcAnnual`
    method definition, you''d need to insert a comma after the closing curly bracket
    of the `calcAnnual` definition.


    The parentheses that indicate that a variable name is the name of a function come
    immediately after the keyword `function`. Parameters, if there are any, go inside
    the parens, as in any function definition.


    This is how you''d call the method.


    ```

    var annualPrice = plan1.calcAnnual(.85);

    ```


    I''m going to add a refinement to the method definition. In the definition I coded
    above, the properties are referred to using the name of the object—for example,
    `plan1.price`. This works, but a better approach, for reasons that will become
    clear in subsequent chapters, is to replace the name of the object with the keyword
    `this`. When JavaScript sees this keyword, it knows you''re referring to the object
    that''s being defined.


    ```

    1  var plan1 = {

    2    name: "Basic",

    3    price: 3.99,

    4    space: 100,

    5    transfer: 1000,

    6    pages: 10,

    7    discountMonths: [6, 7],

    8    calcAnnual: function(percentIfDisc) {

    9      var bestPrice = this.price;

    10     var currDate = new Date();

    11     var thisMo = currDate.getMonth();

    12     for (var i = 0; i < this.discountMonths.length; i++) {

    13       if (this.discountMonths[i] === thisMo) {

    14         bestPrice = this.price * percentIfDisc;

    15         break;

    16       }

    17     }

    18     return bestPrice * 12;

    19   }

    20 };

    ```


    When you write `this.whatever`, JavaScript is smart enough to understand that
    you''re referring to a property of the object that''s being defined—in this case,
    `plan1`.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/71.html](http://www.ASmarterWayToLearn.com/javascript/71.html)


    ## 72 Objects: Constructors


    Again, here''s a version of the chart showing different hosting plans.


    ![](images/00004.jpg)


    This is how I encapsulated the information for the Basic plan in an object and
    five properties.


    ```

    1 var plan1 = {

    2   name:   "Basic",

    3   price: 3.99,

    4   space: 100,

    5   transfer: 1000,

    6   pages: 10

    7 };

    ```


    But that only gets us an object that represents the first plan. I''d have to do
    the same thing again for the Professional and Ultimate plans. This is too much
    hand craftsmanship. We need a factory to crank out these things by the dozen.
    JavaScript lets you build such a factory. It''s called a constructor function.


    ```

    1 function Plan(name, price, space, transfer, pages) {

    2   this.name = name;

    3   this.price = price;

    4   this.space = space;

    5   this.transfer = transfer;

    6   this.pages = pages;

    7 }

    ```


    This would be a plain-vanilla function definition but for two differences:


    * The function name is capitalized. JavaScript doesn''t care whether you do this
    or not, but it''s conventional to do it to distinguish constructor functions from
    regular functions.

    * Each of the parameter values is assigned to a variable. But the variable is
    a property attached to some object whose name hasn''t been specified yet. But
    don''t worry. Just as the parameter values will be filled in by the calling code,
    so will the name of the object.


    This is the calling code that creates the object for the Basic plan.


    ```

    var plan1 = new Plan("Basic", 3.99, 100, 1000, 10);

    ```


    This would be just a regular function call if it weren''t for that `new`. It''s
    the keyword that tells JavaScript to create a new object. The name of the new
    object is `plan1`. Its properties are enumerated inside the parentheses.


    Now it''s easy to mass-produce as many objects as you want, using the same pattern.


    ```

    1 var plan1 = new Plan("Basic", 3.99, 100, 1000, 10);

    2 var plan2 = new Plan("Premium", 5.99, 500, 5000, 50);

    3 var plan3 = new Plan("Ultimate", 9.99, 2000, 20000, 500);

    ```


    It''s common to use the same names for parameters and properties, but you don''t
    have to. You could write:


    ```

    1 function Plan(name, price, space, transfer, pages) {

    2   this.doc = name;

    3   this.grumpy = price;

    4   this.sleepy = space;

    5   this.bashful = transfer;

    6   this.sneezy = pages;

    7 }

    ```


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/72.html](http://www.ASmarterWayToLearn.com/javascript/72.html)


    ## 73 Objects: Constructors for methods


    Here''s the version of the hosting chart that includes discount months.


    ![](images/00010.jpg)


    In Chapter 71 I showed you how to attach a function to an object, using the same
    approach you use when you attach a variable to an object. When you attach a variable
    to an object, it''s called a property of the object. When you attach a function
    to an object, it''s called a method of the object. In the example below, the method
    checks to see if the current date is in a discount month and, if so, applies the
