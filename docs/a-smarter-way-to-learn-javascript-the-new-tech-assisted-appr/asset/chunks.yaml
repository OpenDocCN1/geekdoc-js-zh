    ## 数学运算与变量


    该语句将数学运算的结果赋值给变量 `newNumber`。当然，这个运算的结果是一个数值。


    示例中，数学表达式混合使用了变量和字面量数字。但你也可以只使用数字或只使用变量。对 JavaScript 来说，这都一样。


    我之前告诉过你，变量名不能以数字开头。下面的语句……


    ```javascript

    var 1stPresident = "Washington";

    ```


    ……是非法的，因为变量名开头有一个“1”。


    但变量名中可以包含数字，只要它们不在开头。下面的语句……


    ```javascript

    var prezWhoCame1st = "Washington";

    ```


    ……是合法的。


    方便的是，如果你在警告框中指定一个数字而不是字符串作为消息……


    ```javascript

    alert(144);

    ```


    ……或者指定一个代表数字的变量作为警告消息……


    ```javascript

    var caseQty = 144;

    alert(caseQty);

    ```


    ……JavaScript 会自动将其转换为字符串并显示。


    > 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/3.html`](http://www.ASmarterWayToLearn.com/javascript/3.html)


    ## 变量名的合法与非法


    你已经学到了关于变量命名的三条规则：不能将其括在引号中；名称不能是数字或以数字开头；不能是 JavaScript 的任何关键字——那些作为编程指令的特殊词，比如
    `alert` 和 `var`。


    以下是其余规则：


    * 变量名不能包含空格。

    * 变量名只能包含字母、数字、美元符号和下划线。

    * 虽然变量名不能是 JavaScript 的关键字，但可以包含关键字。例如，`userAlert` 和 `myVar` 是合法的。

    * 大写字母没问题，但要小心。变量名区分大小写。`rose` 不是 `Rose`。如果你将字符串 "Floribundas" 赋值给变量 `rose`，然后向
    JavaScript 请求 `Rose` 的值，你会得到空值。

    * 我教授驼峰命名法。为什么叫“驼峰”？因为如果名称由多个单词组成，中间会有一个或两个（或三个）驼峰。驼峰名称以小写字母开头。如果名称中有多个单词，每个后续单词的首字母大写，形成一个驼峰。如果你只用一个单词构成变量名，比如
    `response`，就没有驼峰。请采用驼峰命名法。它会让你的变量名更易读，并且你不太可能混淆变量名。


    示例：

    `userResponse`

    `userResponseTime`

    `userResponseTimeLimit`

    `response`


    * 让你的变量名具有描述性，这样当你或其他人三周或一年后回头再看代码时，更容易理解代码的含义。通常，`userName` 比 `x` 好，`faveBreed`
    比 `favBrd` 好，尽管较短的名称完全合法。不过，你需要在可读性和简洁性之间取得平衡。`bestSupportingActressInADramaOrComedy`
    是一个清晰的典范，但对大多数人来说可能太长，难以输入或阅读。我会缩短它。


    > 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/4.html`](http://www.ASmarterWayToLearn.com/javascript/4.html)


    ## 数学表达式：熟悉的运算符


    任何可以使用数字的地方，都可以使用数学表达式。例如，你熟悉下面这种语句。


    ```javascript

    var popularNumber = 4;

    ```


    但你也可以这样写。


    ```javascript

    var popularNumber = 2 + 2;

    ```


    你还可以写：


    ```javascript

    alert(2 + 2);

    ```


    这会在警告框中显示消息 "4"。当 JavaScript 看到数学表达式时，它总是会进行计算并返回结果。


    下面是一个从 12 中减去 24 的语句，将 -12 赋值给变量。


    ```javascript

    var popularNumber = 12 - 24;

    ```


    这个语句将 3 乘以 12 的乘积 36 赋值给变量。


    ```javascript

    var popularNumber = 3 * 12;

    ```


    在这个语句中，数字 10 被赋值给一个变量。然后给该变量加 1，并将和 210 赋值给第二个变量。和往常一样，你可以混合使用变量和数字。


    ```javascript

    var num = 10;

    var popularNumber = num + 200;

    ```


    你也可以只使用变量。


    ```javascript

    var num = 10;

    var anotherNum = 1;

    var popularNumber = num + anotherNum;

    ```


    我一直在使用的算术运算符 `+`、`-`、`*` 和 `/` 无疑是你熟悉的。下面这个可能不熟悉：


    ```javascript

    var whatsLeftOver = 10 % 3;

    ```


    `%` 是取模运算符。它不返回一个数除以另一个数的结果，而是返回除法执行后的余数。


    如果一个数能被另一个数整除，取模运算返回 0。在下面的语句中，0 被赋值给变量。


    ```javascript

    var whatsLeftOver = 9 % 3;

    ```


    > 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/5.html`](http://www.ASmarterWayToLearn.com/javascript/5.html)


    ## 数学表达式：不熟悉的运算符


    有几个专门的数学表达式你需要了解。这是第一个。


    ```javascript

    num++;

    ```


    这是下面写法的简写……


    ```javascript

    num = num + 1;

    ```


    它将变量递增 1。递减则使用减号而不是加号。


    ```javascript

    num--;

    ```


    你可以在赋值中使用这些表达式。但结果可能会让你惊讶。


    ```javascript

    var num = 1;

    var newNum = num++;

    ```


    在上面的例子中，`num` 的原始值被赋值给 `newNum`，然后 `num` 再递增。如果 `num` 在第一条语句中初始赋值为 1，那么第二条语句将其值提升为
    2。`newNum` 得到 `num` 的原始值 1。


    如果将加号放在变量前面，你会得到不同的结果。


    ```javascript

    var num = 1;

    var newNum = ++num;

    ```


    在上面的语句中，`num` 和 `newNum` 最终的值都是 2。


    如果将减号放在变量后面，新变量被赋予原始值，而第一个变量被递减。


    ```javascript

    var num = 1;

    var newNum = num--;

    ```


    `num` 递减为 0，`newNum` 得到 `num` 的原始值 1。


    但如果将减号放在变量前面，`newNum` 被赋予递减后的值，而不是原始值。`num` 和 `newNum` 最终的值都是 0。


    ```javascript

    var num = 1;

    var newNum = --num;

    ```


    > 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/6.html`](http://www.ASmarterWayToLearn.com/javascript/6.html)


    ## 数学表达式：消除歧义


    复杂的算术表达式可能会带来一个问题，你可能在高中代数中遇到过。看这个例子，告诉我 `totalCost` 的值是多少。


    ```javascript

    var totalCost = 1 + 3 * 4;

    ```


    `totalCost` 的值取决于你执行算术运算的顺序。如果你先加 1 + 3，然后将和乘以 4，`totalCost` 的值为 16。但如果你反过来，先乘
    3 乘以 4，然后将乘积加 1，你会得到 13。


    在 JavaScript 中，就像在代数中一样，歧义通过优先级规则消除。和代数一样，这里适用的规则是乘法运算在加法运算之前完成。所以 `totalCost`
    的值为 13。


    但你不必记住 JavaScript 复杂的优先级规则。你可以通过使用括号来消除歧义，从而巧妙地解决这个问题。括号会覆盖所有内置的优先级规则。它们强制 JavaScript
    在完成任何其他运算之前，先完成括号内的运算。


    当你使用括号向 JavaScript 明确你的意图时，这也使你的代码更容易理解，无论是对于其他程序员，还是对于一年后试图理解自己代码的你。在这个语句中，括号告诉
    JavaScript 先乘 3 乘以 4，再加 1。结果：13。


    ```javascript

    var totalCost = 1 + (3 * 4);

    ```


