  trans: "\n\n```javascript\nvar lastChar = name.charAt(name.length - 1);\n```\n\n\
    以下代码循环遍历一个字符串，查找感叹号。如果找到该字符，则显示一个警告框。\n\n```javascript\nfor (var i = 0; i < text.length;\
    \ i++) {\n  if (text.charAt(i) === \"!\") {\n    alert(\"找到感叹号！\");\n    break;\n\
    \  }\n}\n```\n\n注意：`indexOf` 方法只能识别特定位置的字符，不能更改该位置的字符。\n\n> 本章的交互式编程练习请访问：\n>\
    \ [`www.ASmarterWayToLearn.com/js/24.html`](http://www.ASmarterWayToLearn.com/javascript/24.html)\n\
    \n## 字符串：替换字符\n\n在前面的章节中，你学习了两种不同的方法，将字符串中的 \"World War II\" 替换为 \"the Second\
    \ World War\"。首先是循环加切片的方法。\n\n```javascript\nfor (var i = 0; i < text.length;\
    \ i++) {\n  if (text.slice(i, i + 12) === \"World War II\") {\n    text = text.slice(0,\
    \ i) + \"the Second World War\" + text.slice(i + 12);\n  }\n}\n```\n\n当你学习了 `indexOf`\
    \ 方法后，改进了这种相当粗糙的方法。\n\n```javascript\nvar firstChar = text.indexOf(\"World War\
    \ II\");\nif (firstChar !== -1) {\n  text = text.slice(0, firstChar) + \"the Second\
    \ World War\" + text.slice(firstChar + 12);\n}\n```\n\n但 JavaScript 还提供了一种更直接的方式，即\
    \ `replace` 方法。\n\n```javascript\nvar newText = text.replace(\"World War II\"\
    , \"the Second World War\");\n```\n\n括号内的第一个字符串是要替换的片段，第二个字符串是要插入的片段。在上述代码中，变量\
    \ `text` 所代表的字符串中的 \"World War II\" 被替换为 \"the Second World War\"，修改后的字符串被赋值给新变量\
    \ `newText`。\n\n如果像上面的例子那样将修改后的字符串赋值给一个新变量，原始字符串会被保留。如果你希望原始字符串被修改后的字符串替换，则将修改后的字符串赋值给原始变量。\n\
    \n`text = text.replace(\"World War II\", \"the Second World War\");`\n\n在上面的例子中，只替换了字符串的第一个实例。如果你想替换所有实例，必须让\
    \ JavaScript 知道你要进行全局替换。\n\n```javascript\nvar newText = text.replace(/World War\
    \ II/g, \"the Second World War\");\n```\n\n在全局替换中，你要替换的片段用斜杠括起来，而不是引号，并在结束斜杠后加上\
    \ `g` 表示“全局”。要插入的片段则用引号括起来，与一次性替换相同。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/25.html`](http://www.ASmarterWayToLearn.com/javascript/25.html)\n\
    \n## 数字取整\n\n你运营一个在线音乐服务，顾客可以对每首歌进行评分。你汇总所有顾客评分并计算平均值，给歌曲打 0 到 5 星。通常，平均值会产生小数。你需要将其四舍五入到最接近的整数，以便将数字转换为星数。假设平均值已赋值给变量\
    \ `scoreAvg`。以下是将其四舍五入到最接近整数的代码。\n\n`var numberOfStars = Math.round(scoreAvg);`\n\
    \n需要记住的事项：\n\n* `Math.` 是所有数学函数的开头。`M` 必须大写。\n* 当小数为 `.5` 时，函数向上取整。它将 `1.5` 取整为\
    \ `2`，`2.5` 取整为 `3`，以此类推。它将 `-1.5` 取整为 `-1`，`-2.5` 取整为 `-2`，以此类推。\n\n当结果赋值给一个新变量时（如上例所示），括号内未取整的数字会被保留。但你可以将取整后的数字赋值给原始变量，未取整的数字将被取整后的数字替换。\n\
    \n`scoreAvg = Math.round(scoreAvg);`\n\n除了变量，你也可以在括号内放入一个字面量数字。\n\n`var scoreAvg\
    \ = Math.round(.0678437);`\n\n要强制 JavaScript 向上取整到最接近的整数，无论小数有多小，请使用 `ceil` 而不是\
    \ `round`。以下代码将 `.000001`（通常向下取整为 `0`）向上取整到最接近的整数 `1`。\n\n`var scoreAvg = Math.ceil(.000001);`\n\
    \n`ceil` 代表“天花板”。它将 `.000001` 向上取整为 `1`，`-.000001` 向上取整为 `0`，`1.00001` 向上取整为 `2`，以此类推。\n\
    \n要强制 JavaScript 向下取整到最接近的整数，无论小数有多大，请使用 `floor` 而不是 `round`。以下代码将 `.999999`（通常向上取整为\
    \ `1`）向下取整为 `0`。\n\n`var scoreAvg = Math.floor(.999999);`\n\n`floor` 将 `.999999`\
    \ 向下取整为 `0`，`1.9` 向下取整为 `1`，`-.000001` 向下取整为 `-1`，以此类推。\n\n> 本章的交互式编程练习请访问：\n\
    > [`www.ASmarterWayToLearn.com/js/26.html`](http://www.ASmarterWayToLearn.com/javascript/26.html)\n\
    \n## 生成随机数\n\n假设你想模拟掷骰子。在模拟中，你希望随机出现 1、2、3、4、5 或 6。第一步是让 JavaScript 生成一个随机数。（嗯，它几乎是随机的，技术上称为伪随机，但对于大多数用途来说已经足够接近随机了。）\n\
    \n以下代码生成一个伪随机数，有 16 位小数，范围从 `0.0000000000000000` 到 `0.9999999999999999`，并将其赋值给变量\
    \ `randomNumber`。\n\n`var randomNumber = Math.random();`\n\n该函数总是返回一个 16 位小数，范围从\
    \ `0.0000000000000000` 到 `0.9999999999999999`。我们可以通过乘以一亿亿（1 后面跟 17 个零）来将小数转换为整数：\n\
    \n* `0.0000000000000000 * 100000000000000000 = 0`\n* `0.7474887706339359 * 100000000000000000\
    \ = 7474887706339359`\n* `0.9999999999999999 * 100000000000000000 = 9999999999999999`\n\
    \n数万亿个可能的数字对于我们的虚拟掷骰子来说太多了。我们只需要 6 个可能的数字，即 1 到 6。因此，我们的第一步不是乘以一亿亿，而是将这个巨大的小数乘以\
    \ 6。\n\n* `0.0000000000000000 * 6 = 0`\n* `0.7474887706339359 * 6 = 4.7474887706339359`\n\
    * `0.9999999999999999 * 6 = 5.9999999999999994`\n\n直觉可能会告诉你，可以通过取整来完成，但数学上这行不通。因为没有任何数能向上取整为\
    \ `0`，也没有任何数能向下取整为 `6`，而中间的数字（既可以通过向上取整也可以通过向下取整得到）出现的频率几乎会是其他数字的两倍。但如果我们先将结果加\
    \ 1，然后向下取整，就可以让所有数字有均等的机会。以下是我们的虚拟掷骰子的代码。\n\n```javascript\nvar bigDecimal = Math.random();\n\
    var improvedNum = (bigDecimal * 6) + 1;\nvar numberOfStars = Math.floor(improvedNum);\n\
    ```\n\n以上代码逐行执行的操作如下：\n\n1. 生成一个 16 位小数，并赋值给变量 `bigDecimal`。\n2. 将 16 位小数转换为范围从\
    \ `0.0000000000000000` 到 `5.9999999999999999` 的数字，然后加 1，因此范围变为 `1.0000000000000000`\
    \ 到 `6.9999999999999999`。该数字赋值给变量 `improvedNum`。\n3. 将 `improvedNum` 表示的值向下取整到最接近的整数，范围从\
    \ 1 到 6。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/27.html`](http://www.ASmarterWayToLearn.com/javascript/27.html)\n\
    \n## 将字符串转换为整数和小数\n\n有时 JavaScript 似乎能读懂你的心思。例如，假设你写...\n\n`var currentAge = prompt(\"\
    请输入你的年龄。\");`\n\n...JavaScript 将用户的回答作为字符串赋值给 `currentAge`。用户输入的内容，比如 32，对你来说可能看起来像数字，但对\
    \ JavaScript 来说它是一个字符串：`\"32\"`。\n\n尽管如此，假设你写...\n\n```javascript\nvar currentAge\
    \ = prompt(\"请输入你的年龄。\");\nvar yearsEligibleToVote = currentAge - 18;\n```\n\n"
- fmt: "\nIn the above code, the value assigned to the variable `currentAge` is a\
    \ string, because it comes from a user's prompt response. But in line 2, when\
    \ the variable appears in an arithmetic expression, the value is automatically\
    \ (and temporarily) converted to a number to make the math work.\n\nSimilarly,\
    \ if you ask JavaScript to divide \"100\" by 2 or multiply \"2.5\" by 2.5, JavaScript\
    \ seems to understand that you want the string treated as a number, and does the\
    \ math. You can even ask JavaScript to multiply, divide, or subtract using nothing\
    \ but strings as terms, and JavaScript, interpreting your intentions correctly,\
    \ does the math.\n\n```\nvar profit = \"200\" - \"150\";\n```\n\nIn the statement\
    \ above, the two strings are treated as numbers because they appear in a math\
    \ expression. The variable `profit`, in spite of the quotation marks, is assigned\
    \ the number 50.\n\nIt probably goes without saying that the string you ask JavaScript\
    \ to do math on has to be a number contained in quotes, like \"50\", not letter\
    \ characters. If you write...\n\n```\nvar profit = \"200\" - \"duck\";\n```\n\n\
    ...an alert will display saying \"NaN\" meaning \"not a number.\" No mystery here.\
    \ How can 200 minus \"duck\" be a number?\n\nYou may recall from a previous chapter\
    \ that when you mix strings and numbers in an expression involving a plus, JavaScript\
    \ does the opposite of what you see in the examples above. Rather than converting\
    \ strings to numbers, JavaScript converts numbers to strings. Rather than adding,\
    \ it concatenates.\n\n```\nvar result = \"200\" + 150;\n```\n\nIn the statement\
    \ above, JavaScript, seeing the string \"200\" and the number 150, resolves the\
    \ conflict by converting 150 to a string: \"150\". Then it concatenates the two\
    \ strings. The variable `result` is assigned \"200150\". If the `+` in the expression\
    \ were one of the other arithmetic operators (`-`, `*`, or `/`), JavaScript would\
    \ convert the string \"200\" to the number 200 and do the math.\n\nYou can see\
    \ there's going to be a problem with the following code.\n\n```\n1 var currentAge\
    \ = prompt(\"Enter your age.\");\n2 var qualifying Age = currentAge + 1;\n```\n\
    \nThe code above has an unintended consequence. The string represented by `currentAge`\
    \ is concatenated with 1 that has been converted to \"1\". Example: if the user\
    \ enters \"52,\" `qualifyingAge` is assigned not 53 but \"521\".\n\nIf you want\
    \ to do addition, you must convert any strings to numbers.\n\n```\n1 var currentAge\
    \ = prompt(\"Enter your age.\");\n2 var qualifyingAge = parseInt(currentAge) +\
    \ 1;\n```\n\nLine 2 converts the string represented by `currentAge` to a number\
    \ before adding 1 to it and assigning the sum to `qualifyingAge`.\n\n`parseInt`\
    \ converts all strings, including strings comprising floating-point numbers, to\
    \ integers. And shocking but true: It it doesn't round. It simply lops off the\
    \ decimals. In the following statement, `myInteger` is assigned not 2 as you might\
    \ expect, but 1.\n\n```\nvar myInteger = parseInt(\"1.9999\");\n```\n\nTo preserve\
    \ any decimal values, use `parseFloat`. In the following statement `myFractional`\
    \ is assigned 1.9999.\n\n```\nvar myFractional = parseFloat(\"1.9999\");\n```\n\
    \nTo minimize confusion, coders sometimes prefer to do explicit, manual conversions\
    \ even when JavaScript doesn't require them, as in mixing a string and a number\
    \ in a multiplication operation.\n\n> Find the interactive coding exercises for\
    \ this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/28.html](http://www.ASmarterWayToLearn.com/javascript/28.html)\n\
    \n## 29 Converting strings to numbers, numbers to strings\n\nIn the last chapter\
    \ you learned to use `parseInt` to convert a string representing a number into\
    \ an integer. And you learned to use `parseFloat` to convert a string representing\
    \ a number into a floating-point number. You can finesse the distinction between\
    \ integers and floating-point numbers by using `Number`. This handy conversion\
    \ tool converts a string representing either an integer or a floating-point number\
    \ to a number that's identical to the one inside the parentheses.\n\nThe following\
    \ code converts the string \"24\" to the number 24.\n\n```\n1 var integerString\
    \ = \"24\"\n2 var num = Number(integerString);\n```\n\nThe following code converts\
    \ the string \"24.9876\" to the number 24.9876.\n\n```\n1 var floatingNumString\
    \ = \"24.9876\";\n2 var num = Number(floatingNumString);\n```\n\nSuppose your\
    \ code has done an arithmetic calculation that yielded a big number. Now you want\
    \ to present the result of the calculation to your user. But before you display\
    \ the number, you want to format it with commas so it's readable. In order to\
    \ do that, you'll have to convert the number to a string. This is how you do it.\n\
    \nConverting a number to a string, perhaps so you can format it, is straightforward.\n\
    \n```\n1 var numberAsNumber = 1234;\n2 var numberAsString = numberAsNumber.toString();\n\
    ```\n\nThe code above converts the number 1234 to the string \"1234\" and assigns\
    \ it to the variable `numberAsString`.\n\n> Find the interactive coding exercises\
    \ for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/29.html](http://www.ASmarterWayToLearn.com/javascript/29.html)\n\
    \n## 30 Controlling the length of decimals\n\nThe price of the item is $9.95.\
    \ The sales tax is 6.5% of the price. You combine the two numbers to get the total.\n\
    \n```\nvar total = price + (price * taxRate);\n```\n\nThe variable `total` now\
    \ has a value of 10.59675.\n\nBut that isn't what you're going to charge the customer,\
    \ is it? You're going to charge her an amount rounded off to two decimal places:\
    \ $10.60.\n\nHere's how to do it.\n\n```\nvar prettyTotal = total.toFixed(2);\n\
    ```\n\nThe statement above rounds the number represented by `total` to 2 places\
    \ and assigns the result to the variable `prettyTotal`. The number inside the\
    \ parentheses tells JavaScript how many places to round the decimal to.\n\nNow\
    \ add a dollar sign, and you're all set.\n\n```\nvar currencyTotal = \"$\" + prettyTotal;\n\
    ```\n\nTo shorten a number to no decimals, leave the parentheses empty.\n\n```\n\
    var prettyTotal = total.toFixed();\n```\n\nUnfortunately, the `toFixed` method\
    \ comes with a surprise inside. If a decimal ends in 5, it usually rounds up,\
    \ as you would expect. But, depending on the browser, sometimes it rounds down!\
    \ If, for example, you apply the method to 1.555, specifying 2 decimal places,\
    \ it may give you \"1.56\". Or it may produce \"1.55\".\n\nThere are sophisticated\
    \ ways to address the problem. Here's an inelegant fix that uses methods you already\
    \ know and understand.\n\n```\n1 var str = num.toString();\n2 if (str.charAt(str.length\
    \ - 1) === \"5\") {\n3   str = str.slice(0, str.length - 1) + \"6\";\n4 }\n5 num\
    \ = Number(str);\n6 prettyNum = num.toFixed(2);\n```\n\nIf the decimal ends in\
    \ a 5, the code changes it to a 6 so the method is forced to round up when it\
    \ should. Here's what's happening, line-by-line:\n\n1. Converts the number to\
    \ a string and assigns it to the variable `str`.\n2. Checks to see if the last\
    \ character is \"5\".\n3. If so, slices off the \"5\" and appends \"6\".\n4. --\n\
    5. Converts it back to a number.\n6. Rounds it to 2 places.\n\n> Find the interactive\
    \ coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/30.html](http://www.ASmarterWayToLearn.com/javascript/30.html)\n\
    \n## 31 Getting the current date and time\n\nYour webpage includes a notice telling\
    \ the user the current local date and time in his particular time zone. But what\
    \ is the current date and time? Here's how JavaScript finds out.\n\n```\nvar rightNow\
    \ = new Date();\n```\n\nThe statement above creates something called a Date object.\
    \ This is what it looks like.\n\n![](images/00014.jpg)\n\nNote that JavaScript\
    \ gets this information from the user's computer. It is only as accurate as the\
    \ computer's date and time settings. For example, if the user just moved from\
    \ the U.S. West Coast to the U.S. East Coast and hasn't reset the time zone on\
    \ his computer, the computer will still be on Pacific Time. The Date object, too,\
    \ will be on Pacific Time.\n\nThe Date object may resemble a string, but it isn't\
    \ one. For example, you can't use methods on it like `charAt`, `indexOf`, or `slice`.\n"
  raw: 'In the above code, the value assigned to the variable `currentAge` is a string,
    because it comes from a user''s prompt response. But in line 2, when the variable
    appears in an arithmetic expression, the value is automatically (and temporarily)
    converted to a number to make the math work.


    Similarly, if you ask JavaScript to divide "100" by 2 or multiply "2.5" by 2.5,
    JavaScript seems to understand that you want the string treated as a number, and
    does the math. You can even ask JavaScript to multiply, divide, or subtract using
    nothing but strings as terms, and JavaScript, interpreting your intentions correctly,
    does the math.


    `var profit =` `"200" - "150"``;`


    In the statement above, the two strings are treated as numbers because they appear
    in a math expression. The variable `profit`, in spite of the quotation marks,
    is assigned the number 50.


    It probably goes without saying that the string you ask JavaScript to do math
    on has to be a number contained in quotes, like "50", not letter characters. If
    you write...


    `var profit = "200" -` `"duck"``;`


    ...an alert will display saying "NaN" meaning "not a number." No mystery here.
    How can 200 minus "duck" be a number?


    You may recall from a previous chapter that when you mix strings and numbers in
    an expression involving a plus, JavaScript does the opposite of what you see in
    the examples above. Rather than converting strings to numbers, JavaScript converts
    numbers to strings. Rather than adding, it concatenates.


    `var result =` `"200" + 150``;`


    In the statement above, JavaScript, seeing the string "200" and the number 150,
    resolves the conflict by converting 150 to a string: "150". Then it concatenates
    the two strings. The variable `result` is assigned "200150". If the `+` in the
    expression were one of the other arithmetic operators(`-`, `*`, or `/`), JavaScript
    would convert the string "200" to the number 200 and do the math.


    You can see there''s going to be a problem with the following code.


    `1 var currentAge = prompt("Enter your age.");`


    `2 var qualifying Age =` `currentAge + 1``;`


    The code above has an unintended consequence. The string represented by `currentAge`
    is concatenated with 1 that has been converted to "1". Example: if the user enters
    "52," `qualifyingAge` is assigned not 53 but "521".


    If you want to do addition, you must convert any strings to numbers.


    `1 var currentAge = prompt("Enter your age.");`


    `2 var qualifyingAge =` `parseInt``(currentAge) + 1;`


    Line 2 converts the string represented by `currentAge` to a number before adding
    1 to it and assigning the sum to `qualifyingAge`.


    `parseInt` converts all strings, including strings comprising floating-point numbers,
    to integers. And shocking but true: It it doesn''t round. It simply lops off the
    decimals. In the following statement, `myInteger` is assigned not 2 as you might
    expect, but 1.


    `var myInteger = parseInt(``"1.9999"``);`


    To preserve any decimal values, use `parseFloat`. In the following statement myFractional
    is assigned 1.9999.


    `var myFractional =` `parseFloat``("1.9999");`


    To minimize confusion, coders sometimes prefer to do explicit, manual conversions
    even when JavaScript doesn''t require them, as in mixing a string and a number
    in a multiplication operation.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/28.html](http://www.ASmarterWayToLearn.com/javascript/28.html)


    29


    Converting strings to numbers, numbers to strings


    In the last chapter you learned to use `parseInt` to convert a string representing
    a number into an integer. And you learned to use `parseFloat` to convert a string
    representing a number into a floating-point number. You can finesse the distinction
    between integers and floating-point numbers by using `Number`. This handy conversion
    tool converts a string representing either an integer or a floating-point number
    to a number that''s identical to the one inside the parentheses.


    The following code converts the string "24" to the number 24.


    `1 var integerString = "24"`


    `2 var num =` `Number``(integerString);`


    The following code converts the string "24.9876" to the number 24.9876.


    `1 var floatingNumString = "24.9876";`


    `2 var num =` `Number``(floatingNumString);`


    Suppose your code has done an arithmetic calculation that yielded a big number.
    Now you want to present the result of the calculation to your user. But before
    you display the number, you want to format it with commas so it''s readable. In
    order to do that, you''ll have to convert the number to a string. This is how
    you do it.


    Converting a number to a string, perhaps so you can format it, is straightforward.


    `1 var numberAsNumber = 1234;`


    `2 var numberAsString = numberAsNumber.``toString()``;`


    The code above converts the number 1234 to the string "1234" and assigns it to
    the variable `numberAsString`.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/29.html](http://www.ASmarterWayToLearn.com/javascript/29.html)


    30


    Controlling the length of decimals


    The price of the item is $9.95\. The sales tax is 6.5% of the price. You combine
    the two numbers to get the total.


    `var total = price + (price * taxRate);`


    The variable `total` now has a value of 10.59675.


    But that isn''t what you''re going to charge the customer, is it? You''re going
    to charge her an amount rounded off to two decimal places: $10.60.


    Here''s how to do it.


    `var prettyTotal = total.``toFixed(2)``;`


    The statement above rounds the number represented by `total` to 2 places and assigns
    the result to the variable `prettyTotal`. The number inside the parentheses tells
    JavaScript how many places to round the decimal to.


    Now add a dollar sign, and you''re all set.


    `var currencyTotal = "$" + prettyTotal;`


    To shorten a number to no decimals, leave the parentheses empty.


    `var prettyTotal = total.``toFixed()``;`


    Unfortunately, the `toFixed` method comes with a surprise inside. If a decimal
    ends in 5, it usually rounds up, as you would expect. But, depending on the browser,
    sometimes it rounds down! If, for example, you apply the method to 1.555, specifying
    2 decimal places, it may give you "1.56". Or it may produce "1.55".


    There are sophisticated ways to address the problem. Here''s an inelegant fix
    that uses methods you already know and understand.


    `1 var str = num.toString();`


    `2` `if (str.charAt(str.length - 1) === "5") {`


    `3   ``str = str.slice(0, str.length - 1) + "6";`


    `4` `}`


    `5 num = Number(str);`


    `6 prettyNum = num.toFixed(2);`


    If the decimal ends in a 5, the code changes it to a 6 so the method is forced
    to round up when it should. Here''s what''s happening, line-by-line:


    1.  Converts the number to a string and assigns it to the variable `str`.


    2.  Checks to see if the last character is "5".


    3.  If so, slices off the "5" and appends "6".


    4.  --


    5.  Converts it back to a number.


    6.  Rounds it to 2 places.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/30.html](http://www.ASmarterWayToLearn.com/javascript/30.html)


    31


    Getting the current date and time


    Your webpage includes a notice telling the user the current local date and time
    in his particular time zone. But what is the current date and time? Here''s how
    JavaScript finds out.


    `var rightNow = new Date();`


    The statement above creates something called a Date object. This is what it looks
    like.


    ![](images/00014.jpg)


    Note that JavaScript gets this information from the user''s computer. It is only
    as accurate as the computer''s date and time settings. For example, if the user
    just moved from the U.S. West Coast to the U.S. East Coast and hasn''t reset the
    time zone on his computer, the computer will still be on Pacific Time. The Date
    object, too, will be on Pacific Time.


    The Date object may resemble a string, but it isn''t one. For example, you can''t
    use methods on it like `charAt`, `indexOf`, or `slice`.'
