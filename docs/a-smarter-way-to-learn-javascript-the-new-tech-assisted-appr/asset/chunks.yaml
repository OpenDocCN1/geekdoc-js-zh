  trans: "\n\nJavaScript 代码并不在意它位于何处。它可以混入——即嵌入——创建网页的 HTML 中。或者，像外部 CSS 文件一样，它可以放在一个由\
    \ HTML 文件加载的独立文件中。大多数情况下，最好使用外部 JavaScript 文件，原因与最好使用外部 CSS 文件类似。但你仍然需要知道如何将 JavaScript\
    \ 放置在 HTML 文件中，所以我们先从这一点开始。\n\n如你所知，HTML 代码的顺序很重要，因为它决定了页面上元素的顺序。如果你希望标题出现在文本上方，你就在\
    \ HTML 中将标题放在文本上方。但 JavaScript 的工作方式不同。例如，你所有的 JavaScript 函数在页面加载时都会被加载到内存中。无论代码位于何处，浏览器都会在页面加载完成时找到并存储它们。一旦页面加载完成，所有\
    \ JavaScript 代码都会保留在内存中，随时准备执行，只要页面还在显示。\n\n你可以合法地将 JavaScript 代码放在 HTML 文件中的几乎任何位置——在\
    \ head 部分、body 部分的开头、body 部分的中间某处，或者 body 部分的末尾。如果你愿意，甚至可以将不同的 JavaScript 函数分散在\
    \ HTML 文件的不同位置。浏览器会自行整理。\n\n不过，通常脚本的最佳位置是在 body 部分的末尾。这可以确保 CSS 样式和图片显示不会因为脚本加载而延迟。\n\
    \n当你将 JavaScript 代码块嵌入 HTML 中（而不是使用独立的 JavaScript 文件）时，必须将 JavaScript 代码放在 `<script>`\
    \ 和 `</script>` 标签之间。以下是两个放在标签之间的函数。\n\n```\n<script>\nfunction sayHi() {\n  alert(\"\
    Hello world!\");\n}\nfunction sayBye() {\n  alert(\"Buh-bye!\");\n}\n</script>\n\
    ```\n\n你可以在 `<script>` 和 `</script>` 标签之间放置任意数量的代码——包括任意数量的函数。而且，正如我之前提到的，如果你愿意，可以将不同的代码段分散在\
    \ HTML 文件中的各个位置。但每个代码段都必须用 `<script>` 和 `</script>` 标签括起来。\n\n大多数情况下，程序员更倾向于将所有或大部分\
    \ JavaScript 代码放在一个独立的 JavaScript 文件中，然后让浏览器在加载 HTML 文件的同时加载这个外部文件。\n\nJavaScript\
    \ 文件与 HTML 和 CSS 文件一样，是一个纯文本文件。它没有头部或任何特殊部分，甚至没有 `<script>` 和 `</script>` 标签。它只是纯粹的\
    \ JavaScript 代码。一个包含上述两个函数的 JavaScript 文件的全部内容将是：\n\n```\nfunction sayHi() {\n\
    \  alert(\"Hello world!\");\n}\nfunction sayBye() {\n  alert(\"Buh-bye!\");\n\
    }\n```\n\n使一个文件成为 JavaScript 文件的是它的文件扩展名：`.js`。文件名的主体部分由你决定，只要合法即可。以下这些都可以。\n\n\
    * `scripts.js`\n* `coreJS.js`\n* `main-code.js`\n* `main_code.js`\n* `main.code.js`\n\
    \n将 JavaScript 文件包含到 HTML 文件中的方式与包含外部 CSS 文件相同——使用一个开始标签和一个结束标签。\n\n`<script src=\"\
    whatever.js\"></script>`\n\n出于与将 JavaScript 代码放在 body 部分末尾相同的原因，最好也将包含 JavaScript\
    \ 文件的标记放在 body 部分的末尾。\n\n你可以包含任意数量的外部 JavaScript 文件。\n\n你可以同时包含 JavaScript 文件并在\
    \ HTML 中嵌入其他 JavaScript 代码。\n\n> 本章的交互式编程练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/43.html`](http://www.ASmarterWayToLearn.com/javascript/43.html)\n\
    \n## 44. 注释\n\n从你使用 HTML 和 CSS 的经验可知，注释是一种告诉浏览器忽略你在代码正文中包含的某些文本的方式。注释是为人类而非机器服务的。它们能帮助你和他人日后修改代码时理解代码。你还可以使用注释来临时屏蔽部分代码，以便进行测试和调试。由于与\
    \ HTML 或 CSS 相比，JavaScript 在日后回顾时通常更难理解，你可能需要花更多精力为 JS 代码添加注释，尤其是在团队合作或未来可能由他人维护代码的情况下。\n\
    \n在 HTML 中，只有一种方式将文本标记为注释：使用 `<!--` 开头，`-->` 结尾。在 CSS 中，也只有一种方式：使用 `/*` 开头，`*/`\
    \ 结尾。但在 JavaScript 中，有两种方式将文本标记为注释。\n\n第一种方式是将单行标记为注释，如下面第 1 行所示。\n\n```\n// 这是一条注释，浏览器会忽略它\n\
    for (var i = 0; i < animals.length; i++) {\n  if (animals[i] === \"bat\") {\n\
    \    animals[i] = \"cat\";\n  }\n}\n```\n\n两个斜杠表示：“从这到行尾的所有内容都是注释。”在上面的例子中，由于斜杠位于行首，因此整行都是注释。但你也可以写一行既有代码又有注释的内容，像这样：\n\
    \n`var animals = [];` `// 声明一个空数组`\n\n你可以写任意多行的注释。每一行都必须以两个斜杠开头。\n\n```\n// 每一行注释都必须以一对\n\
    // 斜杠开头，就像这样。（顺便提一下，大多数代码编辑器\n// 足够智能，能够识别\n// 注释并以不同颜色显示，方便你\n// 与代码区分开来。）\n\
    ```\n\n当你使用斜杠注释时，没有结束标签，因为行尾会自动结束注释。\n\n为了可读性，请在两个斜杠与注释之间加一个空格。当你在同一行中混合代码和注释时，请在代码与两个斜杠之间加一个空格。\n\
    \n当注释需要多行时，许多程序员更喜欢另一种方法。作为 CSS 用户，你已经熟悉这些标签了。\n\n```\n/*\n当注释需要多行时，\n像这样的块注释，带有开始\n\
    和结束标签，是更好的选择。\n*/\n```\n\nJavaScript 的多行注释标签与 CSS 注释标签相同。以 `/*` 开头，以 `*/` 结尾。\n\
    \n> 本章的交互式编程练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/44.html`](http://www.ASmarterWayToLearn.com/javascript/44.html)\n\
    \n## 45. 事件：链接\n\n一个好的网站是一个响应式的网站。用户做了一些操作——点击按钮、移动鼠标、按下按键——然后某些事情发生了。JavaScript\
    \ 提供了多种方式来响应用户的需求。举几个例子：\n\n用户点击一个写着“我们的承诺”的按钮，然后弹出一个提示框，详细说明承诺内容。\n\n页面显示一张模特的“之前”照片。当用户将鼠标悬停在照片上时，它会被替换为她的“之后”照片。\n\
    \n用户在表单的“盎司”字段中输入一个数字。当她点击“克”字段时，会显示对应的克数。\n\n用户已在表单中输入了她的电子邮件地址，正准备输入评论。当她将光标从电子邮件字段移动到评论字段时，JavaScript\
    \ 会检查电子邮件地址是否有效。在这个例子中，它无效——她省略了地址末尾的“.com”。一条消息显示，告知她输入了无效的电子邮件地址。\n\n在一个在线购物网站上，有一张黑色手表的图片。旁边有一个下拉列表，要求用户选择颜色。当她选择时，图片中手表的颜色会变为所选颜色。\n\
    \n所有这些用户操作——点击按钮、移动鼠标、在表单中从一个字段移动到另一个字段、选择不同的选项——都被称为事件。响应事件的 JavaScript 代码——例如，当指针悬停在图片上时显示承诺或交换图片——被称为事件处理程序。\n\
    \n"
- fmt: "\n## Inline Event-Handling\n\nIn this chapter and the ones that immediately\
    \ follow, you'll learn the oldest and most straightforward approach to event-handling—inline\
    \ event-handling. When you're writing production code, this is not the best way\
    \ to handle events, for the same reason that inline CSS styling isn't the best\
    \ way to format HTML elements. But since it's the least abstract way to do it,\
    \ it's the easiest to learn, and can serve as a stepping stone to more advanced\
    \ methods. Later in the book, you'll learn the approach that's preferred by most\
    \ professionals—the scripting approach.\n\nInline event-handling means that you\
    \ combine bits of JavaScript with HTML markup. Here's a line that displays a link\
    \ and then displays an alert when the user clicks it.\n\n`<a href=\"#\" onClick=\"\
    alert('Hi');\">Click</a>`\n\nAs an HTML coder, you're familiar with the beginning\
    \ and end of this markup, `<a href=` and `>Click</a>`\n\nBut when the user clicks\
    \ this link, it behaves differently than normal hyperlinks. Instead of taking\
    \ the user to another page, or to a named anchor on the same page, it displays\
    \ an alert saying \"Hi\".\n\nWhen the user clicks the link, it goes nowhere, and\
    \ instead executes a JavaScript statement, in this case calling a function.\n\n\
    Let's break it down.\n\n*   When the user clicks the link, you don't want a new\
    \ webpage to be loaded in this case, so, instead of a URL, you place a `#` inside\
    \ the quotation marks. This tells the browser to reload the current page.\n\n\
    *   `onClick=` says, \"When the button is clicked, execute the following JavaScript.\"\
    \ `onClick` isn't case-sensitive. You could write `onclick`, `ONCLICK`, or `OnClIcK`\
    \ and it would work. But the convention is `onClick`, so we'll stick with that.\n\
    \n*   A JavaScript statement (or more than one), enclosed in quotes, follows.\
    \ When the user clicks the link, it executes.\n\nOne more thing to notice: `onClick=\"\
    alert('Hi');\"` The message inside the parens is surrounded by single quotes,\
    \ not the double quotes we've been using for an alert string. In JavaScript code,\
    \ you aren't allowed to nest double quotes within double quotes or single quotes\
    \ within single quotess. Since the entire JavaScript statement is enclosed in\
    \ double quotes, you have to enclose the alert message in single quotes.\n\nBut\
    \ there's a problem with the markup above. `<a href=\"#\"` tells the browser to\
    \ reload the page. This means that if the user has scrolled down to the link,\
    \ the click, in addition to running the JavaScript code, will scroll the page\
    \ back to the top—an action you don't normally want. I've included this flawed\
    \ approach, using `<a href=\"#\"`, because you'll run into here and there in other\
    \ people's work, but you'll probably prefer this approach:\n\n`<a href=\"JavaScript:void(0)\"\
    \ onClick=\"alert('Hi');\">Click</a>`\n\nNow you've got exactly what you want.\
    \ Nothing at all happens except for the JavaScript that executes.\n\nIn the example\
    \ above, the click executes only a single JavaScript statement. But there is no\
    \ limit to the number of JavaScript statements that you can enclose in the quotation\
    \ marks. No limit, that is, except for common sense. As you'll see, there are\
    \ better ways to trigger JavaScript than packing multiple statements into an online\
    \ `onClick` event. But let me show you the principle, with this example. When\
    \ the user clicks, a first statement assigns 'hi' to a variable and a second statement\
    \ displays an alert specifying the variable as the message.\n\n`<a href=\"JavaScript:void(0)\"\
    \ onClick=\"var greet='hi'; alert(greet);\">Click</a>`\n\nAs I've said, coding\
    \ professionals frown on inline JavaScript. But if you do use this approach, it's\
    \ more craftsmanlike to call a function.\n\nHere's a function.\n\n```\n1 function\
    \ popup(message) {\n2   alert(message);\n3 }\n```\n\nThis is the event-handler\
    \ that calls the function.\n\n`<a href=\"JavaScript:void(0)\" onClick=\"popup('Hi');\"\
    >Click</a>`\n\nWhen the user clicks the link, the event-handler calls the function,\
    \ passing the argument 'Hi' to it. The function displays an alert saying 'Hi'.\n\
    \n> Find the interactive coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/45.html](http://www.ASmarterWayToLearn.com/javascript/45.html)\n\
    \n## 46 Events: button\n\nIn the last chapter you learned how to repurpose a link\
    \ to make it trigger an event when it's clicked, instead of loading a new page.\
    \ You learned to do it with inline event-handling, not the best way, but the easiest\
    \ to learn. Later in the book, you'll learn the approach that's preferred by most\
    \ professionals—the scripting approach.\n\nBut even if you're using the inline\
    \ method, when you want to give the user something to click, a more professional\
    \ approach, usually, is to use a button rather than a link.\n\nSuppose that when\
    \ the user clicks a button, an alert displays saying, \"Hello world!\"\n\nHere's\
    \ the code.\n\n`<input type=\"button\" value=\"Click\" onClick=\"alert('Hello\
    \ world!');\">`\n\nThe event handler is the same, whether you're coding a link\
    \ or a button: `onClick=\"alert('Hello world!');\"`\n\nBut the beginning of the\
    \ code is different: `<input type=\"button\" value=\"Click\"`\n\nSome pros would\
    \ argue that the button code should be enclosed in form tags, but it's not absolutely\
    \ necessary. And anyway, since we're already violating best practices by using\
    \ inline event handlers, why not scandalize the pros with multiple violations?\
    \ (You'll learn more respectable alternatives to inline event handlers later in\
    \ the book.)\n\nAs an HTML coder you know that you can use an image as a hot link.\
    \ The markup would look something like this.\n\n`<a href=\"summary-page.html\"\
    ><img src=\"button-sum-pg.png\"></a>`\n\nYou can also use an image to trigger\
    \ an event. Let's say that when the user clicks an image, an alert pops up. This\
    \ is the code. Note that the code for the inline event handler is the same as\
    \ before.\n\n`<img src=\"button-greet.png\" onClick=\"alert('Hello world!');\"\
    >`\n\nOr, if you want to be more professional about it, you could have the event\
    \ trigger a function.\n\n`<img src=\"button-greet.png\" onClick=\"greetTheUser();\"\
    >`\n\n> Find the interactive coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/46.html](http://www.ASmarterWayToLearn.com/javascript/46.html)\n\
    \n## 47 Events: mouse\n\nYou've learned how to make things happen when the user\
    \ clicks a link, a button, or an image, by using inline event-handling. Inline\
    \ event handling isn't the best approach, but the easiest to learn. Later in the\
    \ book, you'll learn the approach that's preferred by most professionals—the scripting\
    \ approach.\n\nBut whether you're using the inline method or the preferred scripting\
    \ method, the `onClick` event is only one of many kinds of events that your code\
    \ can respond to. In this chapter, you'll learn how to make things happen when\
    \ the user mouses over something on the page, and also when the user mouses away\
    \ from it.\n\nSuppose your page initially displays a \"before\" picture of a model.\
    \ When the user mouses over the picture, it is replaced by an \"after\" picture.\
    \ You might prefer to do this with CSS, but since this is a JavaScript book, I'll\
    \ show you how to do it with an event handler.\n\nThis is the markup that replaces\
    \ the before picture with the after picture.\n\n`<img src=\"before-pic.jpg\" onMouseover=\"\
    src='after-pic.jpg'\">`\n\nIt begins as a plain vanilla image tag: `<img src=\"\
    before-pic.jpg\"`\n\nThen comes the event-handling keyword. The keyword is in\
    \ camelCase—optional but widely used: `onMouseover`\n\nAn equal sign follows the\
    \ keyword `onMouseover`, just as it does with `onClick`. Then comes the response\
    \ to the event, which is in quotes: `\"src='after-pic.jpg'\">`\n\nYou may be surprised\
    \ that the response to the event isn't written in JavaScript. It's HTML markup.\n\
    \nNote: The image source must be enclosed in single quotes, because of those double\
    \ quotes that enclose the whole phrase.\n\nYou can use `onMouseover` event handling\
    \ with other HTML elements, too. Here's a bit of inline code that displays an\
    \ alert when a heading is moused over.\n"
  raw: 'In this chapter and the ones that immediately follow, you''ll learn the oldest
    and most straightforward approach to event-handling—inline event-handling. When
    you''re writing production code, this is not the best way to handle events, for
    the same reason that inline CSS styling isn''t the best way to format HTML elements.
    But since it''s the least abstract way to do it, it''s the easiest to learn, and
    can serve as a stepping stone to more advanced methods. Later in the book, you''ll
    learn the approach that''s preferred by most professionals—the scripting approach.


    Inline event-handling means that you combine bits of JavaScript with HTML markup.
    Here''s a line that displays a link and then displays an alert when the user clicks
    it.


    `<a` `href="#" onClick="alert(''Hi'');"``>Click</a>`


    As an HTML coder, you''re familiar with the beginning and end of this markup,
    `<a href=` and `>Click</a>`


    But when the user clicks this link, it behaves differently than normal hyperlinks.
    Instead of taking the user to another page, or to a named anchor on the same page,
    it displays an alert saying "Hi".


    When the user clicks the link, it goes nowhere, and instead executes a JavaScript
    statement, in this case calling a function.


    Let''s break it down.


    *   When the user clicks the link, you don''t want a new webpage to be loaded
    in this case, so, instead of a URL, you place a `#` inside the quotation marks.
    This tells the browser to reload the current page.


    *   `onClick=` says, "When the button is clicked, execute the following JavaScript."
    `onClick` isn''t case-sensitive. You could write `onclick`, `ONCLICK`, or `OnClIcK`
    and it would work. But the convention is `onClick`, so we''ll stick with that.


    *   A JavaScript statement (or more than one), enclosed in quotes, follows. When
    the user clicks the link, it executes.


    One more thing to notice: `onClick="alert(''Hi'');"` The message inside the parens
    is surrounded by single quotes, not the double quotes we''ve been using for an
    alert string. In JavaScript code, you aren''t allowed to nest double quotes within
    double quotes or single quotes within single quotess. Since the entire JavaScript
    statement is enclosed in double quotes, you have to enclose the alert message
    in single quotes.


    But there''s a problem with the markup above. `<a href="#"` tells the browser
    to reload the page. This means that if the user has scrolled down to the link,
    the click, in addition to running the JavaScript code, will scroll the page back
    to the top—an action you don''t normally want. I''ve included this flawed approach,
    using `<a href="#"`, because you''ll run into here and there in other people''s
    work, but you''ll probably prefer this approach:


    `<a href=``"JavaScript:void(0)"` `onClick="alert(''Hi'');">Click</a>`


    Now you''ve got exactly what you want. Nothing at all happens except for the JavaScript
    that executes.


    In the example above, the click executes only a single JavaScript statement. But
    there is no limit to the number of JavaScript statements that you can enclose
    in the quotation marks. No limit, that is, except for common sense. As you''ll
    see, there are better ways to trigger JavaScript than packing multiple statements
    into an online `onClick` event. But let me show you the principle, with this example.
    When the user clicks, a first statement assigns ''hi'' to a variable and a second
    statement displays an alert specifying the variable as the message.


    `<a href="JavaScript:void(0)" onClick=``"var greet="hi''; alert(greet);"``>Click</a>`


    As I''ve said, coding professionals frown on inline JavaScript. But if you do
    use this approach, it''s more craftsmanlike to call a function.


    Here''s a function.


    `1 function popup(message) {`


    `2   alert(message);`


    `3 }`


    This is the event-handler that calls the function.


    `<a href="JavaScript:void(0)"` `onClick="popup(''Hi'');"``>Click</a>`


    When the user clicks the link, the event-handler calls the function, passing the
    argument ''Hi'' to it. The function displays an alert saying ''Hi''.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/45.html](http://www.ASmarterWayToLearn.com/javascript/45.html)


    46


    Events: button


    In the last chapter you learned how to repurpose a link to make it trigger an
    event when it''s clicked, instead of loading a new page. You learned to do it
    with inline event-handling, not the best way, but the easiest to learn. Later
    in the book, you''ll learn the approach that''s preferred by most professionals—the
    scripting approach.


    But even if you''re using the inline method, when you want to give the user something
    to click, a more professional approach, usually, is to use a button rather than
    a link.


    Suppose that when the user clicks a button, an alert displays saying, "Hello world!"


    Here''s the code.


    `<input type="button" value="Click"` `onClick="alert(''Hello world!'');"``>`


    The event handler is the same, whether you''re coding a link or a button: `onClick="alert(''Hello
    world!'');"`


    But the beginning of the code is different: `<input type="button" value="Click"`


    Some pros would argue that the button code should be enclosed in form tags, but
    it''s not absolutely necessary. And anyway, since we''re already violating best
    practices by using inline event handlers, why not scandalize the pros with multiple
    violations? (You''ll learn more respectable alternatives to inline event handlers
    later in the book.)


    As an HTML coder you know that you can use an image as a hot link. The markup
    would look something like this.


    `<a href="summary-page.html"><img src="button-sum-pg.png"></a>`


    You can also use an image to trigger an event. Let''s say that when the user clicks
    an image, an alert pops up. This is the code. Note that the code for the inline
    event handler is the same as before.


    `<img src="button-greet.png"` `onClick="alert(''Hello world!'');"``>`


    Or, if you want to be more professional about it, you could have the event trigger
    a function.


    `<img src="button-greet.png"` `onClick="greetTheUser();"``>`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/46.html](http://www.ASmarterWayToLearn.com/javascript/46.html)


    47


    Events: mouse


    You''ve learned how to make things happen when the user clicks a link, a button,
    or an image, by using inline event-handling. Inline event handling isn''t the
    best approach, but the easiest to learn. Later in the book, you''ll learn the
    approach that''s preferred by most professionals—the scripting approach.


    But whether you''re using the inline method or the preferred scripting method,
    the `onClick` event is only one of many kinds of events that your code can respond
    to. In this chapter, you''ll learn how to make things happen when the user mouses
    over something on the page, and also when the user mouses away from it.


    Suppose your page initially displays a "before" picture of a model. When the user
    mouses over the picture, it is replaced by an "after" picture. You might prefer
    to do this with CSS, but since this is a JavaScript book, I''ll show you how to
    do it with an event handler.


    This is the markup that replaces the before picture with the after picture.


    `<img src="before-pic.jpg"` `onMouseover="src=''after-pic.jpg''"``>`


    It begins as a plain vanilla image tag: `<img src="before-pic.jpg"`


    Then comes the event-handling keyword. The keyword is in camelCase—optional but
    widely used: `onMouseover`


    An equal sign follows the keyword `onMouseover`, just as it does with `onClick`.
    Then comes the response to the event, which is in quotes: `"src=''after-pic.jpg''">`


    You may be surprised that the response to the event isn''t written in JavaScript.
    It''s HTML markup.


    Note: The image source must be enclosed in single quotes, because of those double
    quotes that enclose the whole phrase.


    You can use `onMouseover` event handling with other HTML elements, too. Here''s
    a bit of inline code that displays an alert when a heading is moused over.'
