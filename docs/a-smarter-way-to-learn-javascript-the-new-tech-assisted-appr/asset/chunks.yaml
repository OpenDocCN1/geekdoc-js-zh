    ## 56


    Target all elements by tag name


    Suppose you want to give your users the option of doubling the size of the text
    in all the paragraphs of the document. To accomplish this, you could give each
    paragraph an id. When the user clicks the Double Text Size button, a function
    would cycle through all the paragraph ids and make the change. The function could
    upsize the font either by assigning a new class to each paragraph, with the class
    specifying a larger font size, or it could assign the new style property directly,
    like this:


    `getElementById(the id).style.fontSize = "2em";`


    An easier way to accomplish the same thing is to have the function say, "Find
    all the paragraphs in the document and increase their size."


    This statement finds all the paragraphs and assigns them to a variable:


    `var par = document.getElementsByTagName("p");`


    The variable, `par`, now holds an array-like collection of all the paragraphs
    in the document. Suppose, to keep things simple, that the body of the document
    comprises just three paragraphs.


    `<p>This bed is too small.</p>`


    `<p>This bed is too big.</p>`


    `<p>This bed is just right.</p>`


    `par[0]` is the first paragraph. `par[1]` is the second paragraph. `par[2]` is
    the third paragraph. `par.length` is 3, the number of items in the collection.


    If you write...


    `var textInMiddleParagraph = par[1].innerHTML;`


    ...the variable `textInMiddleParagraph` is assigned "This bed is too big."


    If you write...


    `par[1].innerHTML = "This SUV is too big.";`


    ...the paragraph text changes to "This SUV is too big."


    Here''s a loop that assigns a font family to all the paragraphs.


    ```

    1 for (var i = 0; i < par.length; i++) {

    2   par[i].style.fontFamily = "Verdana, Geneva, sans-serif";

    3 }

    ```


    This statement makes a collection of all the images in the document and assigns
    it to the variable `pics`.


    `var pics = document.getElementsByTagName("img");`


    This statement makes a collection of all the divs in the document and assigns
    it to the variable `divs`.


    `var divs = document.getElementsByTagName("div");`


    This statement makes a collection of all the unordered lists in the document and
    assigns it to the variable `ulists`.


