    ## If 语句嵌套


    看看这段代码。


    ```javascript

    1 if ((x === y || a === b) && c === d) {

    2   g = h;

    3 }

    4 else {

    5   e = f;

    6 }

    ```


    在上面的代码中，如果前两个条件中的任意一个为真，并且第三个条件也为真，则将 `g` 赋值为 `h`。否则，将 `e` 赋值为 `f`。


    还有另一种编码方式，使用嵌套。


    ```javascript

    1  if (c === d) {

    2    if (x === y) {

    3      g = h;

    4    }

    5    else if (a === b) {

    6      g = h;

    7    }

    8    else {

    9      e = f;

    10   }

    11 }

    12 else {

    13   e = f;

    14 }

    ```


    嵌套层级通过花括号的位置传达给 JavaScript。在顶层 `if` 内部嵌套了三个代码块。如果顶层 `if` 测试的条件——即 `c` 与 `d` 的值相等——为假，则不会执行任何嵌套的代码块。第
    1 行的左花括号和第 11 行的右花括号括起了所有嵌套代码，告诉 JavaScript 内部所有内容都是第二层级。


    为了可读性，较低层级比其上一层级缩进 2 个空格。


    在本例所示的相对简单的测试和结果组合中，我更倾向于使用更简洁的多条件结构。但当情况变得非常复杂时，嵌套的 `if` 语句是一个好方法。


    > 本章的交互式编程练习请访问：

    > [`www.ASmarterWayToLearn.com/js/14.html`](http://www.ASmarterWayToLearn.com/javascript/14.html)


    ## 数组


    让我们给一些变量赋值字符串。


    ```javascript

    var city0 = "Atlanta";

    var city1 = "Baltimore";

    var city2 = "Chicago";

    var city3 = "Denver";

    var city4 = "Los Angeles";

    var city5 = "Seattle";

    ```


    变量名都相同，只是末尾的数字不同。如果我想的话，也可以把变量命名为 `buffy`、`the`、`vampireSlayer` 等等，但我之所以这样命名，是因为接下来要讨论的内容。


    现在，完成这些赋值后，如果我编写代码...


    ```javascript

    alert("Welcome to " + city3);

    ```


    ...就会弹出一个提示框，显示 "Welcome to Denver"。


    我将向你介绍另一种类型的变量，它将在你后续章节学到的许多任务中派上用场。我指的是称为数组的变量类型。普通变量只能赋一个值——例如 `9` 或 `"Paris"`——而数组是一种可以赋多个值的变量。定义数组的方式如下：


    ```javascript

    var cities = ["Atlanta", "Baltimore", "Chicago", "Denver", "Los Angeles", "Seattle"];

    ```


    在本章开头的例子中，我以数字结尾命名每个变量。`city0` 是 "Atlanta"，`city1` 是 "Baltimore"，依此类推。我刚才定义的数组类似，但对于像我这样定义的数组，JavaScript
    会自动为不同的值（即元素）编号。（你也可以通过单独定义元素来自行控制编号，见下文。）并且你通过写数组名——此处为 `cities`——后跟方括号括起来的数字来引用每个元素。`cities[0]`
    是 "Atlanta"，`cities[1]` 是 "Baltimore"，依此类推。


    因为 JavaScript 会自动为数组元素编号，所以你无法控制编号。列表中的第一个元素索引总是 0，第二个元素索引是 1，依此类推。


    这是我上面编写的 alert 代码，但现在指定的是数组元素而不是普通变量。


    ```javascript

    alert("Welcome to " + cities[3]);

    ```


    数组可以赋任何可以赋给普通变量的值类型。你甚至可以在同一个数组中混合不同类型（尽管通常你不会想这样做）。


    ```javascript

    var mixedArray = [1, "Bob", "Now is", true];

    ```


    在上面的例子中，`mixedArray[0]` 的数值为 `1`，`mixedArray[1]` 的字符串值为 `"Bob"`，依此类推。


    需要记住的事项：


    * 第一项的索引始终是 `0`，而不是 `1`。这意味着如果列表中的最后一项索引为 `9`，那么列表中共有 10 项。

    * 适用于普通变量的命名规则同样适用。只允许使用字母、数字、`$` 和 `_`。首字符不能是数字。不能有空格。

    * 程序员通常喜欢将数组名设为复数形式——例如 `cities` 而不是 `city`——因为数组是一组事物的列表。

    * 与普通变量一样，数组只需声明一次。如果给已经声明的数组赋新值，则省略 `var`。


    > 本章的交互式编程练习请访问：

    > [`www.ASmarterWayToLearn.com/js/15.html`](http://www.ASmarterWayToLearn.com/javascript/15.html)


    ### 数组：添加和删除元素


    正如你在前面章节中学到的，你可以声明一个空变量，即没有值的变量。然后你可以在任何时候给它赋值。你也可以随意更改它的值。数组同样可以做到这些。


    声明空数组的方式如下：


    ```javascript

    var pets = [];

    ```


    假设数组 `pets` 已经声明。下面是如何给它赋值：


    ```javascript

    1 pets[0] = "dog";

    2 pets[1] = "cat";

    3 pets[2] = "bird";

    ```


    在上面的例子中，我按顺序定义了数组的前三个元素。但如果你愿意，也可以合法地在数组中留下空隙（尽管通常你不会这样做）。例如，假设你从同一个空数组开始，并编写以下代码行：


    ```javascript

    1 pets[3] = "lizard";

    2 pets[6] = "snake";

    ```


    现在，如果你引用 `pets[3]`，你会得到 "lizard"。如果你引用 `pets[6]`，你会得到 "snake"。但如果你引用 `pets[0]`
    到 `pets[2]` 或 `pets[4]` 或 `pets[5]`，你会得到 `undefined`。


    你可以给已有值的数组添加更多值。假设数组 `pets` 的前三个元素是 "dog"、"cat" 和 "bird"。然后你编写以下代码：


    ```javascript

    1 pets[3] = "lizard";

    2 pets[4] = "fish";

    3 pets[5] = "gerbil";

    4 pets[6] = "snake";

    ```


    现在数组有 7 个元素："dog"、"cat"、"bird"、"lizard"、"fish"、"gerbil" 和 "snake"。


    如果你给已有值的数组元素赋新值，旧值会被新值替换。


    使用关键字 `pop()`，你可以移除数组的最后一个元素。


    假设你有一个数组 `pets`，其元素为 "dog"、"cat" 和 "bird"。以下代码删除最后一个元素 "bird"，留下一个包含两个元素的数组。


    ```javascript

    pets.pop();

    ```


    使用关键字 `push()`，你可以在数组末尾添加一个或多个元素。


    假设你有同样的数组，包含 "dog"、"cat" 和 "bird"。以下代码在数组末尾添加两个新元素。


    ```javascript

    pets.push("fish", "ferret");

    ```


    > 本章的交互式编程练习请访问：

    > [`www.ASmarterWayToLearn.com/js/16.html`](http://www.ASmarterWayToLearn.com/javascript/16.html)


    ### 数组：移除、插入和提取元素


    使用 `shift()` 方法从数组开头移除一个元素。


    假设你有一个数组 `pets`，其元素为 "dog"、"cat" 和 "bird"。以下代码移除第一个元素 "dog"，留下一个包含两个元素的数组。


    ```javascript

    pets.shift();

    ```


    要在数组开头添加一个或多个元素，请使用 `unshift()` 方法。以下代码在数组开头添加两个元素。


    ```javascript

    pets.unshift("fish", "ferret");

    ```


