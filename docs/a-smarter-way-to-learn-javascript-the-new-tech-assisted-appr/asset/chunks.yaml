    Flags, Booleans, array length,


    and loopus interruptus


    There are several problems with the for loop example I gave you in the last chapter.
    The first problem is a potential communication problem. If a match between the
    user''s city and the list of cleanest cities is found, a confirming alert displays.
    But if there is no match, nothing happens. The user is left in the dark. If no
    match is found, we need to display an alert saying so. But how do we do that?


    We do it with a flag. A flag is just a variable that starts out with a default
    value that you give it, and then is switched to a different value under certain
    conditions. In our example, let''s say this is the flag.


    `var matchFound = "no";`'
