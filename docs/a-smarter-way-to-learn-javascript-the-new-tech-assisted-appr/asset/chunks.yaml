  trans: "\n\n如果找到匹配项，标志的值就会改变。最后，如果标志没有被改变——即它仍然保持原始的“no”值——就意味着没有找到匹配项，因此我们会弹出一个提示，说明该城市不在列表中。\n\
    \n```javascript\nvar matchFound = \"no\";\nfor (var i = 0; i <= 4; i++);\n  if\
    \ (cityToCheck === cleanestCities[i]) {\n    matchFound = \"yes\";\n    alert(\"\
    It's one of the cleanest cities\");\n  }\n}\nif (matchFound === \"no\") {\n  alert(\"\
    It's not on the list\");\n}\n```\n\n这种方法可行，但与其给标志赋值为字符串“no”和“yes”，更常规的做法是使用布尔值\
    \ `false` 和 `true`。\n\n```javascript\nvar matchFound = false;\nfor (var i = 0;\
    \ i <= 4; i++);\n  if (cityToCheck === cleanestCities[i]) {\n    matchFound =\
    \ true;\n    alert(\"It's one of the cleanest cities\");\n  }\n}\nif (matchFound\
    \ === false) {\n  alert(\"It's not on the list\");\n}\n```\n\n布尔值只有两个：`true` 和\
    \ `false`。注意它们不需要用引号括起来。\n\n我们示例中的另一个问题是它可能浪费计算周期。假设在第二次循环时找到了匹配项并显示了提示。按照循环的编码方式，循环会一直进行到结束。既然我们在第二次循环时已经得到了答案，这就没有必要了。这个问题可以通过关键字\
    \ `break` 解决。\n\n```javascript\nvar matchFound = false;\nfor (var i = 0; i <=\
    \ 4; i++);\n  if (cityToCheck === cleanestCities[i]) {\n    matchFound = true;\n\
    \    alert(\"It's one of the cleanest cities\");\n    break;\n  }\n}\nif (matchFound\
    \ === false) {\n  alert(\"It's not on the list\");\n}\n```\n\n最后一个问题：在示例中，我假设数组的元素数量是已知的。但如果不知道呢？JavaScript\
    \ 有一种方法可以找出。下面的代码将数组 `cleanestCities` 中的元素数量赋值给变量 `numElements`。\n\n`var numElements\
    \ = cleanestCities.length;`\n\n现在我们可以将循环次数限制为 JavaScript 计算出的数量。\n\n```javascript\n\
    var numElements = cleanestCities.length;\nvar matchFound = false;\nfor (var i\
    \ = 0; i < numElements; i++);\n  if (cityToCheck === cleanestCities[i]) {\n  \
    \  matchFound = true;\n    alert(\"It's one of the cleanest cities\");\n    break;\n\
    \  }\n}\nif (matchFound === false) {\n  alert(\"It's not on the list\");\n}\n\
    ```\n\n现在，只要 `i` 小于元素数量，循环就会继续。（由于 `length` 是从 1 开始计数的，而 `i` 是从 0 开始计数的，我们需要在长度值前停止\
    \ 1 位。）\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/19.html`](http://www.ASmarterWayToLearn.com/javascript/19.html)\n\
    \n## 嵌套 for 循环\n\n大西洋唱片公司雇佣了你和我来生成一份未来说唱明星的名字列表。为了简化操作，我们首先分别列出一些名字和姓氏。\n\n![](img/00012.jpg)\n\
    \n通过将每个名字与每个姓氏组合，我们可以生成 20 个不同的说唱歌手全名。\n\n从“BlueRay”开始，我们遍历姓氏列表，生成……\nBlueRay\
    \ Zzz\nBlueRay Burp\nBlueRay Dogbone\nBlueRay Droop\n\n然后转到下一个名字“Upchuck”。再次遍历姓氏列表，生成……\n\
    Upchuck Zzz\nUpchuck Burp\nUpchuck Dogbone\nUpchuck Droop\n\n以此类推，将每个名字与每个姓氏组合。\n\
    \n但是，为什么不让我们用 JavaScript 来完成这些重复的工作呢？我们将使用嵌套的 `for` 语句。\n\n```javascript\nvar\
    \ firstNames = [\"BlueRay \", \"Upchuck \", \"Lojack \", \"Gizmo \", \"Do-Rag\
    \ \"];\nvar lastNames = [\"Zzz\", \"Burp\", \"Dogbone\", \"Droop\"];\nvar fullNames\
    \ = [];\nfor (var i = 0; i < firstNames.length; i++) {\n  for (var j = 0; j <\
    \ lastNames.length; j++) {\n    fullNames.push(firstNames[i] + lastNames[j]);\n\
    \  }\n}\n```\n\n需要考虑的事项：\n\n* 外层循环每迭代一次，内层循环就会完整地运行一轮。如果外层循环计数器是 `i`，内层循环计数器是\
    \ `j`，那么当 `i` 为 0 时，`j` 会循环遍历 0、1、2 直到结束。然后 `i` 增加到 1，`j` 再次遍历所有值。外层循环就像时钟的分针，内层循环就像秒针。\n\
    * 你可以根据需要设置任意多层嵌套。\n* 嵌套循环相对于其外层循环缩进 2 个空格。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/20.html`](http://www.ASmarterWayToLearn.com/javascript/20.html)\n\
    \n## 大小写转换\n\n你让用户输入她的城市。然后你将她输入的城市与 5 个最清洁城市的列表进行比对。\n\n如果用户输入“Cheyenne”或任何其他最清洁城市，你的代码会显示一个提示，告诉她这是最清洁的城市之一。\n\
    \n但如果她输入的是“cheyenne”而不是“Cheyenne”——有些用户不可避免地会这样做——那么就不会匹配。JavaScript 是字面量思维的。\n\
    \n人类知道在这个上下文中“cheyenne”指的是“Cheyenne”。但 JavaScript 不知道。我们需要某种方法让 JavaScript 识别出未大写版本也是匹配项。\n\
    \n一种方法是扩展 `cleanestCities` 数组，使其包含所有城市名称的小写版本：\n\n`var cleanestCities = [\"Cheyenne\"\
    , \"cheyenne\", \"Santa Fe\", \"santa fe\", \"Tucson\", \"tucson\", \"Great Falls\"\
    , \"great falls\", \"Honolulu\", \"honolulu\"];`\n\n这种方法在一定程度上可行，但需要大量额外的编码。此外，如果用户输入“santa\
    \ Fe”、“Santa fe”或“sAnta Fe”，我们又回到了最初的问题。要涵盖所有这些可能性以及其他情况，需要编写一英里长的代码。\n\n解决方案是将数组元素编码为小写，并将用户的输入（无论是什么）转换为小写，这样我们就能始终用苹果来比较苹果。\n\
    \n```javascript\nvar cityToCheck = prompt(\"Enter your city\");\ncityToCheck =\
    \ cityToCheck.toLowerCase();\nvar cleanestCities = [\"cheyenne\", \"santa fe\"\
    , \"tucson\", \"great falls\", \"honolulu\"];\nfor (var i = 0; i <= 4; i++) {\n\
    \  if (cityToCheck === cleanestCities[i]) {\n    alert(\"It's one of the cleanest\
    \ cities\");\n  }\n}\n```\n\n第 2 行是这里的新内容：\n\n`cityToCheck = cityToCheck.toLowerCase();`\n\
    \n转换后的字符串被赋值给一个变量。在这个例子中，它正是被转换字符串的同一个变量 `cityToCheck`。注意关键字 `toLowerCase` 必须使用驼峰式大小写。\n\
    \n还要注意，`toLowerCase()` 方法会将字符串中的所有字符转换为小写，而不仅仅是首字母。例如，“ChEyEnNe”会变成“cheyenne”。\n\
    \n你也可以反过来，将所有内容转换为大写，然后与“CHEYENNE”、“SANTA FE”等进行比对。大多数程序员更喜欢小写方法。要将字符串转换为大写，你可以这样写：\n\
    \n`cityToCheck = cityToCheck.toUpperCase();`\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/21.html`](http://www.ASmarterWayToLearn.com/javascript/21.html)\n\
    \n## 字符串：测量长度和提取部分\n\n你让用户提供一个城市名称。你想将她提供的名称转换为首字母大写的名称。无论她输入的是“boston”、“BOSTON”还是“bosTon”，你都希望将输入标准化为“Boston”。你在上一章学到的\
    \ `toLowerCase()` 和 `toUpperCase()` 方法无法单独完成这项工作，因为它们会对字符串中的每个字符进行相同的全局更改。但是，如果你将字符串分成两段，就可以使用这些方法将字符串调整为你想要的形状。（目前，我忽略城市名称可能由两个或更多单词组成的情况，例如\
    \ New Orleans 或 Sault Ste. Marie。）\n\n"
- fmt: "\n# Strings: Finding Segments\n\nTo copy a section of a string, you use the\
    \ `slice` method. Suppose the user has entered a string, and the string has been\
    \ assigned to the variable `cityToCheck`. The following code copies the first\
    \ character of the string and assigns it to the variable `firstChar`. The original\
    \ value of `cityToCheck` doesn't change. If `cityToCheck` is \"Boston\", `firstChar`\
    \ is \"B\".\n\n```javascript\nvar firstChar = cityToCheck.slice(0, 1);\n```\n\n\
    ### Things to be aware of:\n\n* A string is indexed like an array. Only, instead\
    \ of each index number referring to an element, it refers to a character.\n* Like\
    \ array indexing, string indexing begins with 0.\n* In the `slice` method, the\
    \ first number inside the parentheses is the index of the first character in the\
    \ slice. The second number is not, however, the last character in the slice. It's\
    \ the first character after the slice. If you subtract the first index from the\
    \ second index, you'll always get the length of the slice.\n\nHere's another example.\n\
    \n```javascript\nvar someChars = cityToCheck.slice(2, 5);\n```\n\nAgain let's\
    \ say that the string is \"Boston\". The slice begins with the index-2 (the third)\
    \ character, \"s\". It ends with the character before the index-5 character, \"\
    n\". `someChars` is \"sto\".\n\nIf you omit the second number inside the parentheses,\
    \ JavaScript includes all the characters to the end of the string.\n\n```javascript\n\
    var someChars = cityToCheck.slice(2);\n```\n\nThe slice begins with the index-2\
    \ (the third) character, \"s\". Since no cutoff at the end is specified, the slice\
    \ ends with the last character of the string. `someChars` is \"ston\".\n\nNow\
    \ we have a way to capitalize the first character of a string and insure that\
    \ the remaining letters are lower-case.\n\n```javascript\nvar firstChar = cityToCheck.slice(0,\
    \ 1);\nvar otherChars = cityToCheck.slice(1);\nfirstChar = firstChar.toUpperCase();\n\
    otherChars = otherChars.toLowerCase();\nvar cappedCity = firstChar + otherChars;\n\
    ```\n\nHere's what happens in the code above, line-by-line:\n\n1. Copies the first\
    \ character of the string and assigns it to the variable `firstChar`.\n2. Copies\
    \ all the characters from the second one to the end and assigns them to the variable\
    \ `otherChars`.\n3. Caps the first character.\n4. Lower-cases the other characters.\n\
    5. Concatenates both parts to re-form the whole string.\n\nSometimes it's useful\
    \ to know how many characters are in a string. For example, suppose you want to\
    \ slice the first three characters from any string than exceeds three characters\
    \ in length, for example, slicing \"Nov\" from \"November\". To find the number\
    \ of characters in a string, you use the same language you've already learned\
    \ to find the number of elements in an array.\n\n```javascript\nvar month = prompt(\"\
    Enter a month\");\nvar charsInMonth = month.length;\nif (charsInMonth > 3) {\n\
    \  monthAbbrev = month.slice(0, 3);\n}\n```\n\nLine 2 counts the characters in\
    \ the string and assigns the number to the variable `charsInMonth`.\n\nBeing able\
    \ to measure the number of characters in a string can come in handy. For example,\
    \ suppose you want to loop through a string, checking to see if it has any double\
    \ spaces in it. You can use the character count as the loop limiter. Here's some\
    \ code that checks for double spaces in a string and displays an alert if they're\
    \ found.\n\n```javascript\nvar str = prompt(\"Enter some text\");\nvar numChars\
    \ = str.length;\nfor (var i = 0; i < numChars; i++) {\n  if (str.slice(i, i +\
    \ 2) === \"  \") {\n    alert(\"No double spaces!\");\n    break;\n  }\n}\n```\n\
    \nLine 2 counts the number of characters in the string and assigns the number\
    \ to the variable `numChars`. In line 3, this number is used as the loop limiter.\
    \ The loop continues to run only as long as the counter, `i`, is less than the\
    \ number of characters in the string. (Remember, the length is 1-based, and the\
    \ counter is 0-based, so the loop has to stop 1 short of the length number.) Line\
    \ 4 moves through the string character-by-character, examining each 2-character\
    \ segment, looking for double spaces.\n\n> Find the interactive coding exercises\
    \ for this chapter at: [http://www.ASmarterWayToLearn.com/js/22.html](http://www.ASmarterWayToLearn.com/javascript/22.html)\n\
    \n## Finding segments\n\nThe New Yorker magazine doesn't allow the phrase \"World\
    \ War II. \" They say it should be \"the Second World War.\" So let's search the\
    \ following sentence for the banned characters and replace them with the phrase\
    \ that the New Yorker prefers.\n\n| It is startling to think that, even in the\
    \ darkest depths of World War II, J. R. R. Tolkien was writing the trilogy, which\
    \ contains, with the weird applicability available only to poetry and myth, the\
    \ essential notion that the good gray wizard can understand the evil magi precisely\
    \ because he is just enough like them to grasp their minds and motives in ways\
    \ that they cannot grasp his. |\n\nYou already know a way to find the banned segment\
    \ and replace it. Suppose the paragraph above has been assigned to the variable\
    \ `text`.\n\n```javascript\nfor (var i = 0; i < text.length; i++) {\n  if (text.slice(i,\
    \ i + 12) === \"World War II\") {\n    text = text.slice(0, i) + \"the Second\
    \ World War\" + text.slice(i + 12);\n  }\n}\n```\n\nThe code loops through the\
    \ string looking for \"World War II.\" Line 2 progresses through the string character-by-character,\
    \ examining each 12-character sequence. If it finds \"World War II,\" line 3 concatenates\
    \ three segments: all the characters preceding \"World War II,\" the substitute\
    \ phrase \"the Second World War,\" and then all the characters following \"World\
    \ War II.\"\n\nBut JavaScript has a more efficient way to accomplish this, using\
    \ the `indexOf` method.\n\n```javascript\nvar firstChar = text.indexOf(\"World\
    \ War II\");\n```\n\nIf the segment exists, the method finds the index of the\
    \ first character of the segment and assigns it to the variable `firstChar`. If\
    \ the segment doesn't exist, the method assigns `-1` to the variable, so you know\
    \ it's not there.\n\nNow we can replace the banned phrase with the preferred phrase\
    \ with less coding.\n\n```javascript\nvar firstChar = text.indexOf(\"World War\
    \ II\");\nif (firstChar !== -1) {\n  text = text.slice(0, firstChar) + \"the Second\
    \ World War\" + text.slice(firstChar + 12);\n}\n```\n\nLine 1 checks for the phrase,\
    \ assigning the index of the first character of the phrase to the variable `firstChar`—if\
    \ the phrase is found. If it isn't found, `-1` is assigned to the variable. If\
    \ the variable doesn't have the value `-1` (line 2)—if the phrase has been found—the\
    \ concatenation in line 3 replaces the offending phrase with the correct phrase.\n\
    \nThe `indexOf` method finds only the first instance of the segment you're looking\
    \ for. In the example above, you could overcome this limitation by looping. You'd\
    \ change the first instance of \"World War II\" to \"the Second World War,\" then\
    \ in the next loop iteration, find the next surviving instance and change that,\
    \ and so on.\n\nTo find the last instance of a segment in a string, use `lastIndexOf`.\
    \ The following code finds the index of the first character of the last instance\
    \ of the segment, the second \"be\". The variable `segIndex` winds up with a value\
    \ of 16, the index of \"b\" in the second \"be\".\n\n```javascript\nvar text =\
    \ \"To be or not to be.\";\nvar segIndex = text.lastIndexOf(\"be\");\n```\n\n\
    > Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/23.html](http://www.ASmarterWayToLearn.com/javascript/23.html)\n\
    \n## Finding a character at a location\n\nThe user has entered his first name.\
    \ The string has been assigned to the variable `firstName`. You want to extract\
    \ the first character. You already know one way to do it.\n\n```javascript\nvar\
    \ firstChar = firstName.slice(0, 1);\n```\n\nHere's an alternate way to do it\
    \ that's more direct.\n\n```javascript\nvar firstChar = firstName.charAt(0);\n\
    ```\n\nThe code above finds a single character at index-0 (the beginning) of the\
    \ string represented by the variable `firstName` and assigns it to the variable\
    \ `firstChar`.\n\nThe following code finds the last character in the string.\n"
