    ## If Statements Nested


    Check out this code.


    ```javascript

    1 if ((x === y || a === b) && c === d) {

    2   g = h;

    3 }

    4 else {

    5   e = f;

    6 }

    ```


    In the code above, if either of the first conditions is true, and, in addition,
    the third condition is true, then `g` is assigned `h`. Otherwise, `e` is assigned
    `f`.


    There''s another way to code this, using nesting.


    ```javascript

    1  if (c === d) {

    2    if (x === y) {

    3      g = h;

    4    }

    5    else if (a === b) {

    6      g = h;

    7    }

    8    else {

    9      e = f;

    10   }

    11 }

    12 else {

    13   e = f;

    14 }

    ```


    Nest levels are communicated to JavaScript by the positions of the curly brackets.
    There are three blocks nested inside the top-level `if`. If the condition tested
    by the top-level `if`—that `c` has the same value as `d`—is false, none of the
    blocks nested inside executes. The opening curly bracket on line 1 and the closing
    curly bracket on line 11 enclose all the nested code, telling JavaScript that
    everything inside is second-level.


    For readability, a lower level is indented 2 spaces beyond the level above it.


    In the relatively simple set of tests and outcomes shown in this example, I would
    prefer to use the more concise structure of multiple conditions. But when things
    get really complicated, nested `if`s are a good way to go.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/14.html](http://www.ASmarterWayToLearn.com/javascript/14.html)


    ## Arrays


    Let''s assign some string values to some variables.


    ```javascript

    var city0 = "Atlanta";

    var city1 = "Baltimore";

    var city2 = "Chicago";

    var city3 = "Denver";

    var city4 = "Los Angeles";

    var city5 = "Seattle";

    ```


    The variable names are all the same, except they end in different numbers. I could
    have named the variables `buffy`, `the`, `vampireSlayer`, and so on if I''d wanted
    to, but I chose to name them this way because of where this discussion is going.


    Now, having made these assignments, if I code...


    ```javascript

    alert("Welcome to " + city3);

    ```


    ...an alert displays saying, "Welcome to Denver".


    I''m going to show you another type of variable, one that will come in handy for
    many tasks that you''ll learn about in later chapters. I''m talking about a type
    of variable called an array. Whereas an ordinary variable has a single value assigned
    to it—for example, `9` or `"Paris"`—an array is a variable that can have multiple
    values assigned to it. You define an array this way:


    ```javascript

    var cities = ["Atlanta", "Baltimore", "Chicago", "Denver", "Los Angeles", "Seattle"];

    ```


    In the example at the beginning of this chapter, I ended each variable name with
    a number. `city0` was "Atlanta", `city1` was "Baltimore", and so on. The array
    I just defined is similar, but in the case of an array defined the way I just
    defined one, JavaScript numbers the different values, or elements, automatically.
    (You can control the numbering yourself by defining elements individually. See
    below.) And you refer to each element by writing the array name—`cities` in this
    case—followed by a number enclosed in square brackets. `cities[0]` is "Atlanta",
    `cities[1]` is "Baltimore", and so on.


    Because JavaScript automatically numbers array elements, you have no say in the
    numbering. The first element in the list always has an index of 0, the second
    element an index of 1, and so on.


    This is the alert I coded above, but now specifying an array element instead of
    an ordinary variable.


    ```javascript

    alert("Welcome to " + cities[3]);

    ```


    An array can be assigned any type of value that you can assign to ordinary variables.
    You can even mix the different types in the same array (not that you would ordinarily
    want to).


    ```javascript

    var mixedArray = [1, "Bob", "Now is", true];

    ```


    In the example above, `mixedArray[0]` has a numerical value of `1`, `mixedArray[1]`
    has a string value of `"Bob"`, and so on.


    Things to keep in mind:


    * The first item always has an index of `0`, not `1`. This means that if the last
    item in the list has an index of `9`, there are 10 items in the list.

    * The same naming rules you learned for ordinary variables apply. Only letters,
    numbers, `$` and `_` are legal. The first character can''t be a number. No spaces.

    * Coders often prefer to make array names plural—`cities` instead of `city`, for
    example—since an array is a list of things.

    * Like an ordinary variable, you declare an array only once. If you assign new
    values to an array that has already been declared, you drop the `var`.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/15.html](http://www.ASmarterWayToLearn.com/javascript/15.html)


    ### Arrays: Adding and Removing Elements


    As you learned in earlier chapters, you can declare an empty variable, one that
    doesn''t have a value. Then you can assign it a value whenever you like. And you
    can change its value at will. You can do all these things with an array, as well.


    This is how you declare an empty array.


    ```javascript

    var pets = [];

    ```


    Assume that the array `pets` has already been declared. This is how you assign
    values to it.


    ```javascript

    1 pets[0] = "dog";

    2 pets[1] = "cat";

    3 pets[2] = "bird";

    ```


    In the example above, I defined the first three elements of the array, in order.
    But you can legally leave gaps in an array if you choose to (not that you normally
    would). For example, suppose you start with the same empty array and code these
    lines.


    ```javascript

    1 pets[3] = "lizard";

    2 pets[6] = "snake";

    ```


    Now, if you refer to `pets[3]`, you''ll get "lizard". If you refer to `pets[6]`,
    you''ll get "snake". But if you refer to `pets[0]` through `pets[2]` or `pets[4]`
    or `pets[5]`, you''ll get `undefined`.


    You can assign additional values to an array that already has values. Assume that
    the first three elements of the array `pets` are "dog", "cat", and "bird". Then
    you write this code.


    ```javascript

    1 pets[3] = "lizard";

    2 pets[4] = "fish";

    3 pets[5] = "gerbil";

    4 pets[6] = "snake";

    ```


    Now the array has 7 elements: "dog", "cat", "bird", "lizard", "fish", "gerbil",
    and "snake".


    If you assign a new value to an array element that already has one, the old value
    is replaced by the new one.


    Using the keyword `pop()`, you can remove the last element of an array.


    Suppose you have an array `pets`, whose elements are "dog", "cat", and "bird".
    The following code deletes the last element, "bird", leaving a two-element array.


    ```javascript

    pets.pop();

    ```


    Using the keyword `push()`, you can add one or more elements to the end of an
    array.


    Suppose you have that same array consisting of "dog", "cat", and "bird". The following
    code adds two new elements to the end of the array.


    ```javascript

    pets.push("fish", "ferret");

    ```


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/16.html](http://www.ASmarterWayToLearn.com/javascript/16.html)


    ### Arrays: Removing, Inserting, and Extracting Elements


    Use the `shift()` method to remove an element from the beginning of an array.


    Suppose you have an array `pets`, whose elements are "dog", "cat", and "bird".
    The following removes the first element, "dog", leaving you with a two-element
    array.


    ```javascript

    pets.shift();

    ```


    To add one or more elements to the beginning of an array, use the `unshift()`
    method. The following code adds two elements to the beginning of the array.


    ```javascript

    pets.unshift("fish", "ferret");

    ```

