  trans: "\n\n## 内联事件处理\n\n在本章及接下来的几章中，你将学习最古老、最直接的事件处理方法——内联事件处理。在编写生产代码时，这并不是处理事件的最佳方式，原因与内联\
    \ CSS 样式不是格式化 HTML 元素的最佳方式相同。但由于它是抽象程度最低的方式，因此最容易学习，并且可以作为更高级方法的垫脚石。在本书的后续部分，你将学习大多数专业人士偏好的方法——脚本方式。\n\
    \n内联事件处理意味着你将 JavaScript 代码片段与 HTML 标记结合起来。下面是一行代码，它显示一个链接，并在用户点击时显示一个警告框。\n\n\
    `<a href=\"#\" onClick=\"alert('Hi');\">Click</a>`\n\n作为 HTML 编码人员，你对这段标记的开头和结尾很熟悉：`<a\
    \ href=` 和 `>Click</a>`\n\n但当用户点击这个链接时，它的行为与普通超链接不同。它不会将用户带到另一个页面，也不会跳转到同一页面的命名锚点，而是显示一个显示“Hi”的警告框。\n\
    \n当用户点击链接时，它不会跳转到任何地方，而是执行一条 JavaScript 语句，在本例中调用了一个函数。\n\n我们来分解一下。\n\n*   当用户点击链接时，你并不希望加载新网页，因此，在引号内你放置了\
    \ `#` 而不是 URL。这告诉浏览器重新加载当前页面。\n\n*   `onClick=` 表示：“当按钮被点击时，执行以下 JavaScript。”`onClick`\
    \ 不区分大小写。你可以写成 `onclick`、`ONCLICK` 或 `OnClIcK`，都能正常工作。但惯例是 `onClick`，所以我们沿用这个写法。\n\
    \n*   后面跟着一条（或多条）用引号括起来的 JavaScript 语句。当用户点击链接时，它就会执行。\n\n还有一点需要注意：`onClick=\"\
    alert('Hi');\"` 括号内的消息被单引号包围，而不是我们通常用于警告字符串的双引号。在 JavaScript 代码中，不允许在双引号内嵌套双引号，也不允许在单引号内嵌套单引号。由于整个\
    \ JavaScript 语句被双引号括起来，因此你必须将警告消息用单引号括起来。\n\n但上面的标记有一个问题。`<a href=\"#\"` 告诉浏览器重新加载页面。这意味着如果用户已经滚动到链接位置，点击操作除了运行\
    \ JavaScript 代码外，还会将页面滚动回顶部——这通常不是你希望的行为。我之所以包含这个有缺陷的方法（使用 `<a href=\"#\"`），是因为你会在其他人的代码中偶尔遇到它，但你可能会更喜欢这种方法：\n\
    \n`<a href=\"JavaScript:void(0)\" onClick=\"alert('Hi');\">Click</a>`\n\n现在你得到了你想要的。除了执行的\
    \ JavaScript 之外，什么都不会发生。\n\n在上面的例子中，点击只执行了一条 JavaScript 语句。但你可以将任意数量的 JavaScript\
    \ 语句放在引号内，没有数量限制。当然，除了常识的限制。正如你将看到的，有比将多条语句塞进一个内联 `onClick` 事件中更好的触发 JavaScript\
    \ 的方法。但让我通过这个例子向你展示原理。当用户点击时，第一条语句将 'hi' 赋值给一个变量，第二条语句显示一个警告框，将变量作为消息。\n\n`<a\
    \ href=\"JavaScript:void(0)\" onClick=\"var greet='hi'; alert(greet);\">Click</a>`\n\
    \n正如我所说，专业编码人员不赞成使用内联 JavaScript。但如果你确实使用这种方法，更专业的方式是调用一个函数。\n\n这是一个函数。\n\n```\n\
    1 function popup(message) {\n2   alert(message);\n3 }\n```\n\n这是调用该函数的事件处理程序。\n\
    \n`<a href=\"JavaScript:void(0)\" onClick=\"popup('Hi');\">Click</a>`\n\n当用户点击链接时，事件处理程序调用该函数，并将参数\
    \ 'Hi' 传递给它。函数显示一个显示“Hi”的警告框。\n\n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/45.html`](http://www.ASmarterWayToLearn.com/javascript/45.html)\n\
    \n## 46 事件：按钮\n\n在上一章中，你学习了如何重新利用链接，使其在被点击时触发事件，而不是加载新页面。你学习了使用内联事件处理，这不是最佳方式，但最容易学习。在本书的后续部分，你将学习大多数专业人士偏好的方法——脚本方式。\n\
    \n但即使你使用内联方法，当你想给用户提供可点击的内容时，通常更专业的方法是使用按钮而不是链接。\n\n假设当用户点击一个按钮时，会显示一个警告框，内容为“Hello\
    \ world!”。\n\n代码如下。\n\n`<input type=\"button\" value=\"Click\" onClick=\"alert('Hello\
    \ world!');\">`\n\n无论你编写的是链接还是按钮，事件处理程序都是一样的：`onClick=\"alert('Hello world!');\"\
    `\n\n但代码的开头不同：`<input type=\"button\" value=\"Click\"`\n\n一些专业人士可能会认为按钮代码应该包含在表单标签中，但这并非绝对必要。而且，既然我们已经通过使用内联事件处理程序违反了最佳实践，为什么不通过多次违规来让专业人士震惊呢？（你将在本书的后续部分学习更体面的替代内联事件处理程序的方法。）\n\
    \n作为 HTML 编码人员，你知道可以将图像用作热链接。标记看起来像这样。\n\n`<a href=\"summary-page.html\"><img\
    \ src=\"button-sum-pg.png\"></a>`\n\n你也可以使用图像来触发事件。假设当用户点击图像时，会弹出一个警告框。代码如下。请注意，内联事件处理程序的代码与之前相同。\n\
    \n`<img src=\"button-greet.png\" onClick=\"alert('Hello world!');\">`\n\n或者，如果你想更专业一些，可以让事件触发一个函数。\n\
    \n`<img src=\"button-greet.png\" onClick=\"greetTheUser();\">`\n\n> 本章的交互式编码练习请访问：\n\
    > \n> [`www.ASmarterWayToLearn.com/js/46.html`](http://www.ASmarterWayToLearn.com/javascript/46.html)\n\
    \n## 47 事件：鼠标\n\n你已经学会了如何通过内联事件处理，在用户点击链接、按钮或图像时触发操作。内联事件处理不是最佳方法，但最容易学习。在本书的后续部分，你将学习大多数专业人士偏好的方法——脚本方式。\n\
    \n但无论你使用内联方法还是更受青睐的脚本方法，`onClick` 事件只是你的代码可以响应的众多事件类型之一。在本章中，你将学习如何在用户将鼠标悬停在页面上的某个元素上时，以及当用户将鼠标移开时触发操作。\n\
    \n假设你的页面最初显示一张模特的“之前”照片。当用户将鼠标悬停在照片上时，它会被替换为“之后”照片。你可能更愿意用 CSS 来实现，但由于这是一本 JavaScript\
    \ 书籍，我将向你展示如何使用事件处理程序来实现。\n\n这是将“之前”照片替换为“之后”照片的标记。\n\n`<img src=\"before-pic.jpg\"\
    \ onMouseover=\"src='after-pic.jpg'\">`\n\n它以一个普通的图像标签开始：`<img src=\"before-pic.jpg\"\
    `\n\n然后是事件处理关键字。关键字采用驼峰式大小写——可选但广泛使用：`onMouseover`\n\n在关键字 `onMouseover` 后面跟着一个等号，就像\
    \ `onClick` 一样。然后是事件的响应，用引号括起来：`\"src='after-pic.jpg'\">`\n\n你可能会惊讶地发现，事件的响应并不是用\
    \ JavaScript 编写的。它是 HTML 标记。\n\n注意：图像源必须用单引号括起来，因为整个短语被双引号括起来了。\n\n你也可以将 `onMouseover`\
    \ 事件处理用于其他 HTML 元素。下面是一段内联代码，当鼠标悬停在一个标题上时，会显示一个警告框。\n\n"
