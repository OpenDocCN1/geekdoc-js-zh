    ## 57


    按标签名定位部分元素


    在上一章中，你学会了如何创建文档中所有具有特定标签名的元素的类数组集合。例如，以下语句创建文档中所有段落的集合，并将其赋值给变量 `pars`。


    `var pars = document.getElementsByTagName("p");`


    你还学会了使用类似数组的表示法（方括号中的数字）来读取或设置元素集合中任何元素的属性。例如，以下语句“读取”集合 `pars` 中第二个元素的内容，并将字符串赋值给变量
    `textInMiddleParagraph`。


    `var textInMiddleParagraph = pars[1].innerHTML;`


    但假设你不想获取文档中所有段落的集合，而只想获取某个特定 div 内所有段落的集合。没问题。假设该 div 的 id 是 "rules"。代码如下。


    ```

    1 var e = document.getElementById("rules");

    2 var paragraphs = e.getElementsByTagName("p");

    ```


    第 1 行将 id 为 "rules" 的 div 赋值给变量 `e`。


    第 2 行创建该 div 中所有段落的集合，并将其赋值给变量 `paragraphs`。


    一旦目标 div 的 id 被赋值给变量（例如 `e`），你就可以收集该 div 内所有段落的集合。不再写...


    `document.getElementsByTagName("p");`


    ...（这会创建文档中所有段落的集合），而是写...


    `e.getElementsByTagName("p");`


    ...这会创建该 div 中所有段落的集合。


    假设你有一个白色背景的表格。当用户点击按钮时，单元格变为粉色。代码如下。


    ```

    1 var t = document.getElementById("table9");

    2 var cells = t.getElementsByTagName("td");

    3 for (var i = 0; i < cells.length; i++) {

    4   cells[i].style.backgroundColor = "pink";

    5 }

    ```


