    ## 63 DOM：节点值


    因此，如果标记如下，H2 元素的第一个子节点是一个名为 `"#text"` 的节点...


    `<h2>``Do` `<em>``not</em> hit!</h2>`


    ...那么节点值就是 `"Do "`。


    像 `P` 或 `IMG` 这样的元素节点有名称但没有值。如果你试图将一个元素节点值赋给一个变量，该变量将被赋值为 null。


    `<h2>``Do` `<em>``not</em> hit!</h2>`


    在上面的例子中，`<em>` 是一个元素，这意味着它的值为 null。


    文本节点的节点值很容易与 `innerHTML` 属性混淆。两者有两个区别。


    *   在上面的例子中，`innerHTML` 是元素节点 `<h2>` 的一个属性。而节点值是文本节点本身的属性，不是父元素的属性。


    *   `innerHTML` 包含元素的所有后代，包括像 `<em>` 这样的内部元素节点以及文本节点。而节点值只包含构成单个文本节点的字符。


    在下面的代码中，H2 元素的 `innerHTML` 被高亮显示。


    `<h2>``Do <em>not</em> hit!``</h2>`


    在下面的代码中，H2 元素的第一个子节点的节点值被高亮显示。


    `<h2>``Do` `<em>``not</em> hit!</h2>`


    由于在某些情况下，`nodeName` 可能会返回例如 `"p"` 而不是 `"P"`，或者 `"href"` 而不是 `"HREF"`，因此在测试名称时，最好将大小写标准化，如下所示。


    `if (targetNode.nodeName.``toLowerCase` `=== "img") {`


    如果节点名称原本是大写的，代码会将其转换为小写。如果原本就是小写，则不会造成任何影响。


    如果你正在检查节点名称以确定节点是否为文本节点，则无需转换为小写，因为文本节点的名称始终是 `"#text"`，而不会是 `"#TEXT"`。


    > 本章的交互式编程练习请访问：


    > [`www.ASmarterWayToLearn.com/js/63.html`](http://www.ASmarterWayToLearn.com/javascript/63.html)


    ## 64 DOM：计数元素


    在之前的章节中，你学习了如何创建一个类似数组的集合，其中包含所有共享特定标签名的元素。例如，以下代码创建了一个包含所有 `<li>` 元素的集合，并将该集合赋给变量
    `liElements`。


    `var liElements =` `getElementsByTagName``("li");`


    一旦你有了元素集合，就可以知道其中有多少个元素。在下面的代码中，`liElements` 所代表的集合中 `<li>` 元素的数量被赋给变量 `howManyLi`。


    `var howManyLi =` `liElements.length``;`


    然后，例如，你可以遍历该集合，查找没有文本的 `<li>` 元素，并插入一些占位文本。


    ```

    1 for (var i = 0; i < howManyLi; i++) {

    2   if (liElements[i].innerHTML === "") {

    3     liElements[i].innerHTML = "coming soon";

    4   }

    5 }

    ```


    我带你走了一遍这个过程，是为了向你介绍一个类似的操作，你可以使用 DOM 层级结构而不是标签名来完成。你可以创建一个目标节点的所有子节点的集合。


    ```

    1 var parentNode = document.getElementById("d1");

    2 var nodeList = parentNode.childNodes;

    ```


    第 1 行将 id 为 "d1" 的元素赋给变量 `parentNode`。第 2 行将 `parentNode` 的子节点集合赋给 `nodeList`。


    你可以获取集合中的项目数量。以下语句将节点集合中的项目数量赋给变量 `howManyKids`。


    `var howManyKids =` `nodeList.length``;`


    然后你可以定位集合中的任何项目。以下代码统计了 div 内的图片数量。


    ```

    1 var numberPics = 0;

    2 for (var i = 0; i < howManyKids; i++) {

    3   if (nodelist[i].nodeName.toLowerCase() === "img") {

    4     numberPics++;

    5   }

    6 }

    ```


    分解如下：


    1 声明图片计数器并将其初始化为 0


    2 遍历 div 的所有子节点


    3-5 如果节点名称（转换为小写后）是 `"img"`，则递增图片计数器


    > 本章的交互式编程练习请访问：


    > [`www.ASmarterWayToLearn.com/js/64.html`](http://www.ASmarterWayToLearn.com/javascript/64.html)


    ## 65 DOM：属性


    看看这段标记。


    `<a href="http://www.amazon.com">Shop</a>`


    你已经知道，在上述标记中，文本节点 "Shop" 是元素节点 `<a>` 的第一个（也是唯一的）子节点。但 `href="http://www.amazon.com"`
    是什么呢？它确实是 DOM 中的一个节点，你可以说它是 `<a>` 的附属。但它不是 `<a>` 的子节点。它是 `<a>` 的一个属性。


    每当你看到这种形式...


    `<``元素 某属性``="``引号内的值``"``>`


    ...你看到的就是一个带有属性的元素。等号和引号就是提示。等号左侧的词是属性名。等号右侧的词是属性值。


    以下是更多示例。属性值被高亮显示。


    `<div id=``"p1"``>`


    `<p class=``"special"``>`


    `<img src=``"images/slow-loris.png"``>`


    `<span style=``"font-size:24px;"``>`


    一个元素可以有任意数量的属性。在这个标签中，元素 `img` 有 4 个属性。我已将其值高亮显示。


    `<img src=``"dan.gif"` `alt=``"Dan"` `height=``"42"` `width=``"42"``>`


    你可以使用 `hasAttribute` 来检查一个元素是否具有某个特定属性。


    ```

    1 var target = document.getElementById("p1");

    2 var hasClass = target.hasAttribute("class");

    ```


    第 1 行将元素赋给变量 `target`。第 2 行检查该元素是否有一个名为 `"class"` 的属性。如果有，变量 `hasClass` 被赋值为 true。如果没有，则被赋值为
    false。


    你可以使用 `getAttribute` 来读取属性的值。


    ```

    1 var target = document.getElementById("div1");

    2 var attVal = target.getAttribute("class");

    ```


    第 1 行将元素赋给变量 `target`。第 2 行读取属性的值并将其赋给变量 `attVal`。


    你可以使用 `setAttribute` 来设置属性的值。


    ```

    1 var target = document.getElementById("div1");

    2 target.setAttribute("class", "special");

    ```


    第 1 行将元素赋给变量 `target`。第 2 行给它一个 `"class"` 属性（括号内的第一个参数），其值为 `"special"`（括号内的第二个参数）。实际上，标记变成了：


    `<div id="div1"` `class="special"``>`


    > 本章的交互式编程练习请访问：


    > [`www.ASmarterWayToLearn.com/js/65.html`](http://www.ASmarterWayToLearn.com/javascript/65.html)


    ## 66 DOM：属性名和属性值


    在前面的章节中，你学习了如何通过如下语句创建一个具有相同标签名的元素集合...


    `var list = document.``getElementsByTagName``("p");`


    ...以及如何通过如下语句创建一个元素的所有子节点的集合...


    `var list = document.getElementById("p1").``childNodes``;`


    类似地，你可以通过如下语句创建一个元素的所有属性的集合...


    `var list = document.getElementById("p1").``attributes``;`


    将集合赋给变量后，你可以获取集合中的项目数量...


    `var numOfItems =` `list.length``;`


    或者，你也可以将这些任务压缩成一条语句，而无需先将目标赋给变量。


    `var numOfItems = document.getItemById("p1").attributes.length;`


    使用类似数组的表示法，你可以找出集合中任何属性的名称。以下语句定位属性集合中的第三个项目，并将其名称赋给变量 `nName`。


    `var nName =` `list[2].nodeName``;`


    例如，如果标记是...


    `<p id="p1" class="c1"` `onMouseover="chgColor();"``>`


    ...那么变量 `nName` 被赋值为 `"onMouseover"`。


    你还可以获取属性的值...


    `var nValue =` `list[2].nodeValue``;`


    在上面的示例标记中，变量 `nValue` 被赋值为 `"chgColor();"`。


