    ## A Smarter Way to Learn JavaScript


    ### How I propose to cut your effort in half by using technology


    When you set out to learn anything as complicated as `JavaScript`, you sign up
    for some heavy cognitive lifting. If I had to guess, I''d say the whole project
    of teaching yourself a language burns at least a large garden-cart load of brain
    glucose. But here''s what you may not realize: When you teach yourself, your cognitive
    load doubles.


    Yes, all the information is right there in the book if the author has done a good
    job. But learning a language entails far more than reading some information. You
    need to commit the information to memory, which requires some kind of plan. You
    need to practice. How are you going to structure that? And you need some way to
    correct yourself when you go off-course. Since a book isn''t the best way to help
    you with these tasks, most authors don''t even try. Which means all the work of
    designing a learning path for yourself is left to you. And this do-it-yourself
    meta-learning, this struggle with the question of how to master what the book
    is telling you, takes more effort than the learning itself.


    Traditionally, a live instructor bridges the gap between reading and learning.
    Taking a comprehensive course or working one-on-one with a mentor is still the
    best way to learn `JavaScript` if you have the time and can afford it. But, as
    long as many people prefer to learn on their own, why not use the latest technology
    as a substitute teacher? Let the book lay out the principles. Then use an interactive
    program for memorization, practice, and correction. When the computer gets into
    the act, you''ll learn twice as fast, with half the effort. It''s a smarter way
    to learn `JavaScript`. It''s a smarter way to learn anything.


    And as long as we''re embracing new technology, why not use all the tech we can
    get our hands on to optimize the book? Old technology—i.e. the paper book—has
    severe limitations from an instructional point of view. New technology—i.e. the
    ebook—is the way to go, for many reasons. Here are a few:


    *   **Color is a marvelous information tool.** That''s why they use it for traffic
    lights. But printing color on paper multiplies the cost. Thanks to killer setup
    charges, printing this single word—color—in a print-on-demand book adds thirty
    dollars to the retail price. So color is usually out, or else the book is priced
    as a luxury item. With an ebook, color is free.

    *   **Paper itself is expensive**, so there usually isn''t room to do everything
    the author would like to do. A full discussion of fine points? Forget it. Extra
    help for the rough spots? Can''t afford it. Hundreds of examples? Better delete
    some. But no such limitation applies to an ebook. What do an extra hundred digital
    pages cost? Usually nothing.

    *   **Traditional publishing is slow.** When a book is published traditionally,
    it may take up to a year for the manuscript to get into print. This means there
    isn''t time for extensive testing on the target audience, or for the revisions
    that testing would inevitably suggest. And once the book is in print, it''s a
    big, expensive deal to issue revised editions. Publishers put it off as long as
    possible. Reader feedback usually doesn''t lead to improvements for years. An
    ebook can go from manuscript to book in a day, leaving lots of time for testing
    and revision. After it''s published, new editions with improvements based on reader
    feedback can come out as often as the author likes, at no cost.


    With all this going for them, is there any doubt that all the best instructional
    books are going to be ebooks? And would anyone deny that the most helpful thing
    an author can do for you, in addition to publishing a good book electronically,
    is to take on the whole teaching job, not just part of it, by adding interactivity
    to help you with memorization, practice, and correction?


    Here, then, is how I propose to use current technology to help you learn `JavaScript`
    in half the time, with half the effort:


    *   **Cognitive portion control.** Testing showed me that when they''re doing
    hard-core learning, even strong-minded people get tired faster than I would have
    expected. You may be able to read a novel for two hours at a stretch, but when
    you''re studying something new and complicated, it''s a whole different ballgame.
    My testing revealed that studying new material for about ten minutes is the limit,
    before most learners start to fade. But here''s the good news: Even when you''ve
    entered the fatigue zone after ten minutes of studying, you''ve still got the
    mental wherewithal to practice for up to thirty minutes. Practice that''s designed
    correctly takes less effort than studying, yet teaches you more. Reading a little
    and practicing a lot is the fastest way to learn.

    *   **500 coding examples** that cover every aspect of what you''re learning.
    Examples make concepts easy to grasp and focus your attention on the key material
    covered in each chapter. Color cues embedded in the code help you commit rules
    to memory. Did I go overboard and put in more examples that you need? Well, if
    things get too easy for you, just skip some them.

    *   **Tested on naive users.** The book includes many rounds of revisions based
    on feedback from programming beginners. It includes extra-help discussions to
    clarify concepts that proved to be stumbling blocks during testing. Among the
    testers: my technophobe wife, who discovered that, with good instruction, she
    could code—and was surprised to find that she enjoyed it. For that matter, I got
    a few surprises myself. Some things that are simple to me turned out not to be
    not so simple to some readers. Rewriting ensued.

    *   **Free interactive coding exercises** paired with each chapter—1,750 of them
    in all. They''re the feature that testers say helps them the most. No surprise
    there. According to the New York Times, psychologists "have shown that taking
    a test—say, writing down all you can remember from a studied prose passage—can
    deepen the memory of that passage better than further study." I would venture
    that this goes double when you''re learning to code. After reading each chapter,
    go online and practice everything you learned. Each chapter ends with a link to
    its accompanying online exercises. Find an index of all the exercises at `http://www.ASmarterWayToLearn.com/js/`.

    *   **Live coding experience.** In scripting, the best reward is seeing your code
    run flawlessly. Most practice sessions include live coding exercises that let
    you see your scripts execute in the browser.


    ### How to use this book


    This isn''t a book quite like any you''ve ever owned before, so a brief user manual
    might be helpful.

