  trans: "\n\n在上面的代码中，赋给变量 `currentAge` 的值是一个字符串，因为它来自用户的提示响应。但在第 2 行，当该变量出现在算术表达式中时，该值会自动（且临时）转换为数字，以使数学运算生效。\n\
    \n类似地，如果你让 JavaScript 将 \"100\" 除以 2 或将 \"2.5\" 乘以 2.5，JavaScript 似乎理解你希望将字符串视为数字，并执行数学运算。你甚至可以让\
    \ JavaScript 仅使用字符串作为操作数进行乘法、除法或减法，而 JavaScript 会正确理解你的意图并完成计算。\n\n```\nvar profit\
    \ = \"200\" - \"150\";\n```\n\n在上面的语句中，两个字符串被视为数字，因为它们出现在数学表达式中。变量 `profit` 尽管有引号，但被赋值为数字\
    \ 50。\n\n不言而喻，你让 JavaScript 进行数学运算的字符串必须是引号内的数字，例如 \"50\"，而不能是字母字符。如果你写...\n\n\
    ```\nvar profit = \"200\" - \"duck\";\n```\n\n...则会显示一个警告，显示 \"NaN\"，意思是 \"不是一个数字\"\
    。这没什么好奇怪的。200 减去 \"duck\" 怎么可能是一个数字呢？\n\n你可能还记得前一章的内容：当你在涉及加号的表达式中混合字符串和数字时，JavaScript\
    \ 会做出与上面示例相反的操作。JavaScript 不会将字符串转换为数字，而是将数字转换为字符串。它不会进行加法，而是进行拼接。\n\n```\nvar\
    \ result = \"200\" + 150;\n```\n\n在上面的语句中，JavaScript 看到字符串 \"200\" 和数字 150，通过将\
    \ 150 转换为字符串 \"150\" 来解决冲突。然后它将两个字符串拼接起来。变量 `result` 被赋值为 \"200150\"。如果表达式中的 `+`\
    \ 是其他算术运算符（`-`、`*` 或 `/`），JavaScript 会将字符串 \"200\" 转换为数字 200 并进行数学运算。\n\n你可以看到以下代码会出现问题。\n\
    \n```\n1 var currentAge = prompt(\"Enter your age.\");\n2 var qualifying Age =\
    \ currentAge + 1;\n```\n\n上面的代码有一个意想不到的后果。由 `currentAge` 表示的字符串与已转换为 \"1\" 的 1\
    \ 拼接在一起。例如：如果用户输入 \"52\"，`qualifyingAge` 被赋值的不是 53，而是 \"521\"。\n\n如果你想进行加法运算，必须将任何字符串转换为数字。\n\
    \n```\n1 var currentAge = prompt(\"Enter your age.\");\n2 var qualifyingAge =\
    \ parseInt(currentAge) + 1;\n```\n\n第 2 行将 `currentAge` 表示的字符串转换为数字，然后加 1，并将和赋给\
    \ `qualifyingAge`。\n\n`parseInt` 将所有字符串（包括由浮点数组成的字符串）转换为整数。但令人震惊且真实的是：它不会进行四舍五入。它只是简单地截断小数部分。在下面的语句中，`myInteger`\
    \ 被赋值为 1，而不是你可能期望的 2。\n\n```\nvar myInteger = parseInt(\"1.9999\");\n```\n\n要保留任何小数值，请使用\
    \ `parseFloat`。在下面的语句中，`myFractional` 被赋值为 1.9999。\n\n```\nvar myFractional =\
    \ parseFloat(\"1.9999\");\n```\n\n为了尽量减少混淆，程序员有时更喜欢进行显式的手动转换，即使 JavaScript 并不要求这样做，例如在乘法运算中混合字符串和数字时。\n\
    \n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/28.html`](http://www.ASmarterWayToLearn.com/javascript/28.html)\n\
    \n## 29 将字符串转换为数字，将数字转换为字符串\n\n在上一章中，你学会了使用 `parseInt` 将表示数字的字符串转换为整数。你还学会了使用\
    \ `parseFloat` 将表示数字的字符串转换为浮点数。你可以通过使用 `Number` 来巧妙地处理整数和浮点数之间的区别。这个方便的转换工具可以将表示整数或浮点数的字符串转换为与括号内内容相同的数字。\n\
    \n以下代码将字符串 \"24\" 转换为数字 24。\n\n```\n1 var integerString = \"24\"\n2 var num =\
    \ Number(integerString);\n```\n\n以下代码将字符串 \"24.9876\" 转换为数字 24.9876。\n\n```\n\
    1 var floatingNumString = \"24.9876\";\n2 var num = Number(floatingNumString);\n\
    ```\n\n假设你的代码进行了一次算术计算，得到了一个很大的数字。现在你想将计算结果呈现给用户。但在显示数字之前，你想用逗号格式化它，使其可读。为此，你必须将数字转换为字符串。以下是操作方法。\n\
    \n将数字转换为字符串（也许是为了格式化它）很简单。\n\n```\n1 var numberAsNumber = 1234;\n2 var numberAsString\
    \ = numberAsNumber.toString();\n```\n\n上面的代码将数字 1234 转换为字符串 \"1234\"，并将其赋给变量 `numberAsString`。\n\
    \n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/29.html`](http://www.ASmarterWayToLearn.com/javascript/29.html)\n\
    \n## 30 控制小数位数\n\n商品的价格是 $9.95。销售税是价格的 6.5%。你将这两个数字相加得到总额。\n\n```\nvar total =\
    \ price + (price * taxRate);\n```\n\n变量 `total` 现在的值为 10.59675。\n\n但这并不是你要向客户收取的金额，对吧？你要向她收取四舍五入到两位小数的金额：$10.60。\n\
    \n以下是操作方法。\n\n```\nvar prettyTotal = total.toFixed(2);\n```\n\n上面的语句将 `total`\
    \ 表示的数字四舍五入到 2 位小数，并将结果赋给变量 `prettyTotal`。括号内的数字告诉 JavaScript 要将小数四舍五入到多少位。\n\n\
    现在加上美元符号，就大功告成了。\n\n```\nvar currencyTotal = \"$\" + prettyTotal;\n```\n\n要将数字缩短到没有小数，请将括号留空。\n\
    \n```\nvar prettyTotal = total.toFixed();\n```\n\n不幸的是，`toFixed` 方法有一个意外之处。如果小数以\
    \ 5 结尾，它通常会像你期望的那样向上舍入。但是，根据浏览器的不同，有时它会向下舍入！例如，如果你对 1.555 应用该方法，指定 2 位小数，它可能会给出\
    \ \"1.56\"。也可能产生 \"1.55\"。\n\n有一些复杂的方法可以解决这个问题。这里有一个不太优雅的修复方法，使用了你已经知道和理解的方法。\n\
    \n```\n1 var str = num.toString();\n2 if (str.charAt(str.length - 1) === \"5\"\
    ) {\n3   str = str.slice(0, str.length - 1) + \"6\";\n4 }\n5 num = Number(str);\n\
    6 prettyNum = num.toFixed(2);\n```\n\n如果小数以 5 结尾，代码会将其改为 6，从而强制该方法在应该向上舍入时向上舍入。以下是逐行解释：\n\
    \n1. 将数字转换为字符串并赋给变量 `str`。\n2. 检查最后一个字符是否为 \"5\"。\n3. 如果是，则截掉 \"5\" 并追加 \"6\"\
    。\n4. --\n5. 将其转换回数字。\n6. 将其四舍五入到 2 位小数。\n\n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/30.html`](http://www.ASmarterWayToLearn.com/javascript/30.html)\n\
    \n## 31 获取当前日期和时间\n\n你的网页包含一条通知，告知用户其所在时区的当前本地日期和时间。但当前的日期和时间是什么？以下是 JavaScript\
    \ 如何获取的。\n\n```\nvar rightNow = new Date();\n```\n\n上面的语句创建了一个称为 Date 对象的东西。它看起来像这样。\n\
    \n![](img/00014.jpg)\n\n请注意，JavaScript 从用户的计算机获取此信息。它的准确性取决于计算机的日期和时间设置。例如，如果用户刚从美国西海岸搬到美国东海岸，并且没有重置计算机上的时区，那么计算机仍将使用太平洋时间。Date\
    \ 对象也将使用太平洋时间。\n\nDate 对象可能看起来像一个字符串，但它不是。例如，你不能对其使用像 `charAt`、`indexOf` 或 `slice`\
    \ 这样的方法。\n\n"
