    ## 55


    Setting styles


    In Chapter 52 you learned how to add a CSS class to any element to change its
    styling. For example, this function adds the class "big" to an element. If, for
    example, the new class, "big," specifies a larger font size for the element than
    it has originally, the result is that the text inside the element gets bigger.


    ```

    1 function makeBig() {

    2   document.getElementById("p1").className += " big";

    3 }

    ```


    There''s another way to specify style properties.


    ```

    1 function makeBig() {

    2   document.getElementById("p1").style.fontSize = "2em";

    3 }

    ```


    Like the first example, the function changes the default font size of an element
    with the id "p1". But, unlike the first example, it doesn''t remove any other
    styles assigned to the element, whether those styles are specified in CSS or inline.


    Example: If the heading, paragraph, or div has an initial size of 1em, the function
    doubles the size of its contents. If the element has an initial style of bold
    Georgia italic with 12-pixel borders, all of this formatting is preserved. Only
    the size changes.


    This statement left-floats an image.


    `document.getElementById("pic99").style.cssFloat = "left";`


    This statement makes an element invisible.


    `document.getElementById("div9").style.visibility = "hidden";`


    This statement gives an element left and right margins of 10 pix.


    `document.getElementById("mainPic").style.margin = "0 10px 0 10px;";`


    You can set many style properties this way. Sometimes the terms for property specs
    aren''t obvious, so it''s best to check the language rules—is it "float" or "cssFloat"?—rather
    than guessing.


    As usual, you can read properties as well as set them. However, the rules aren''t
    straightforward. If you write...


    `var m = document.getElementById("mainPic").style.margin;`


    ...it''ll tell you only the margins specified inline, if any. If margins are specified
    in CSS, you won''t get them. The following statement gives you all the style properties,
    specified in both CSS and inline, but it has a limitation. Versions of Internet
    Explorer before Version 9 don''t support it.


    `var m = document.getComputedStyle("mainPic").margin;`


