    Browser control:


    Filling the window with content


    Popup windows are the Rodney Dangerfield of browser features, thanks to their
    abuse by aggressive marketers. But they have their legitimate uses. If you plan
    to use them, you''ll have to deal with popup blockers, which you''ll learn to
    do shortly. This chapter and the next one teach you the code that creates the
    window.


    This is the basic, barebones statement.


    `var monkeyWindow =` `window.open()``;`


    The code above opens a blank window of maximum size and gives it a handle, a variable
    that refers to this particular window—in this case, `monkeyWindow`. Depending
    on the browser, the window may open on top of the previous window, in a new tab,
    or even in a new copy of the browser. You can''t control this.


    There are three ways to fill a new window with content, You can use the `write`
    method to put HTML content on the screen...


    `1 var monkeyWindow = window.open();`


    `2 var windowContent = "<h1>Capuchin monkey</h1><img src= ''monkey.jpg''><p>The
    word capuchin derives from a group of friars<br>named the Order of Friars Minor
    Capuchin who wear<br>brown`


    `robes with large hoods covering their heads.</p>";`


    `3 monkeyWindow.``document.write``(windowContent);`


    Here''s the line-by-line breakdown:


    1.  Opens a new window and assigns it the handle `monkeyWindow`


    2.  Assigns text to the variable `windowContent`


    3.  Fills the window with the text


    Things to notice:


    *   Inside the main quotes that enclose the whole string, any quoted text must
    be in single quotes, as in `<img src=''monkey.jpg''>`.


    *   Using the `document.write` method, you place the HTML string on the page.
    You designate the window by its handle, the variable that you declared when you
    opened the window.


    *   The `document.write` method in this example is used to fill an empty window
    with content. You could also use it to write to a window that already has content.
    But it will overwrite all the HTML of the original document, replacing its content
    entirely.


    *   Instead of assigning the HTML string to a variable and specifying the variable
    inside the parentheses, you could just put the HTML string inside the parentheses,
    enclosed in quotes of course. But this would be even more unwieldy than the example
    code.


    The second way to fill the window with content is to assign a document to it,
    as you learned to do in previous chapters.


    `monkeyWindow.location.assign("http://www.animals.com/capuchin.html");`


    ...or...


    `monkeyWindow.location.href = "http://www.animals.com/capuchin.html";`


    The third and most common way to fill the window with content is to include the
    document assignment in the statement that opens the window.


    `var monkeyWindow = window.open("http://www.animals.com/capuchin.html");`


    If the document you''re opening in the popup shares the same host and directory
    as the original document, you can just write...


    `var monkeyWindow = window.open("capuchin.html");`


    This is how you close a window.


    `monkeyWindow.close();`


