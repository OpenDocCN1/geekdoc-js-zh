- fmt: "\n## 39 switch statements\n\nIf it's a weekend day, the \"Whoopee!\" alert\
    \ displays. If it's Friday, the \"TGIF\" alert displays. If it's a weekday, the\
    \ \"Shoot me now\" alert displays.\n\nIt works, but it's unwieldy and a little\
    \ ugly, especially if you have many conditions to test. It's time for you to learn\
    \ a more elegant alternative that you can use for testing myriad conditions, the\
    \ `switch` statement. The more conditions you need to test, the more you'll like\
    \ the `switch` statement. This `switch` statement duplicates the functionality\
    \ of the example above\n\n```javascript\nswitch(dayOfWk) {\ncase \"Sat\" :\n \
    \ alert(\"Whoopee\");\n  break;\ncase \"Sun\" :\n  alert(\"Whoopee\");\n  break;\n\
    case \"Fri\" :\n  alert(\"TGIF!\");\n  break;\ndefault :\n  alert(\"Shoot me now!\"\
    );\n}\n```\n\nFor the moment, I want you to focus on just the first three lines\
    \ of the code above.\n\n1.  Begins with the keyword `switch`. Bumping up against\
    \ it is the variable that's being tested, inside parentheses. Then there's an\
    \ opening curly bracket.\n\n2.  The first possibility, that the variable `dayOfWeek`\
    \ has the value \"Sat\". Begins with the keyword `case`. Then the value that is\
    \ being tried, \"Sat\". Then a space and a colon.\n\n3.  The statement that executes\
    \ if the test passes—if `dayOfWeek` does, in fact, have the value \"Sat\". This\
    \ statement is indented. Any number of statements can execute if the test passes.\n\
    \n> Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/39.html](http://www.ASmarterWayToLearn.com/javascript/39.html)\n\
    \n## 40 switch statements: How to complete them\n\nIn the last chapter you focused\
    \ on the first three lines of this `switch` statement.\n\n```javascript\nswitch(dayOfWk)\
    \ {\ncase \"Sat\" :\n  alert(\"Whoopee\");\n  break;\ncase \"Sun\" :\n  alert(\"\
    Whoopee\");\n  break;\ncase \"Fri\" :\n  alert(\"TGIF!\");\n  break;\ndefault\
    \ :\n  alert(\"Shoot me now!\");\n}\n```\n\nIn this chapter you'll tackle the\
    \ rest of the code.\n\nThe first line of an `if` statement is followed by a statement\
    \ (or statements) that executes if the condition is true. A `switch` statement\
    \ works similarly. On the line below each `case` clause, there's a statement (or\
    \ statements) that executes if the case is true.\n\nOnce again, the code that\
    \ executes if the case is true is indented 2 spaces. (The universal convention\
    \ is that it is indented by some amount. Opinions differ on how much is best.\
    \ I standardize on a 2-space indentation, which is common but far from universal.)\n\
    \nBut why do all of the cases except the last one include a `break` statement?\n\
    \nJavaScript has an inconvenient quirk: After a true case is found, JavaScript\
    \ not only executes the statement(s) immediately below that case. It executes\
    \ all the statements for all the cases below it. So after a true case is found\
    \ and the conditional code executes, you need to jump out of the `switch` block\
    \ by coding a `break` statement. If, for example, you omit the `break` statements\
    \ in the code above, this happens:\n\n1.  An alert displays saying \"Whoopee!\"\
    \n\n2.  A second alert displays saying \"Whoopee!\"\n\n3.  A third alert displays\
    \ saying \"TGIF!\"\n\n4.  A fourth alert displays saying \"Shoot me now.\"\n\n\
    Now let's look at line 11.\n\n```javascript\ndefault :\n  alert(\"Shoot me now!\"\
    );\n}\n```\n\nThe keyword `default` works like `else` in an `if...else` statement.\
    \ The code that follows it executes if none of the conditions above it are met.\
    \ So, in the example above, if `dayOfWk` isn't \"Sat\" or \"Sun\" or \"Fri\"—if\
    \ it's anything other than those three values—an alert displays saying \"Shoot\
    \ me now.\"\n\nNote that `default` is followed by a space and a colon, just like\
    \ the `case` clauses above it.\n\nNote also that there's no `break` statement.\
    \ That's because `default` always comes last, which means there are no statements\
    \ below it to execute inappropriately.\n\nIn a `switch` statement, default code\
    \ is optional, just as `else` code is optional after an `if` statement. Without\
    \ the default code, if none of the cases test true, nothing happens.\n\nWhen there\
    \ is no default code, careful coders include a `break` statement after the last\
    \ condition anyway as insurance, even though it may be superfluous. If you decide\
    \ to add a new condition to the end later, you won't have to remember to add a\
    \ `break` to the block above it in order to avoid a disastrous cascade of statements.\n\
    \n> Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/40.html](http://www.ASmarterWayToLearn.com/javascript/40.html)\n\
    \n## 41 while loops\n\nThis `for` loop displays an alert on each iteration.\n\n\
    ```javascript\nfor (var i = 0; i <= 3; i++) {\n  alert(i);\n}\n```\n\nAs you know,\
    \ the process is controlled by the three terms inside the parentheses:\n\n*  \
    \ `var i = 0` establishes a counter.\n\n*   `i <= 3` says the loop is to keep\
    \ running as long as `i` is less than or equal to 3\\. Since `i` is assigned 0\
    \ initially, the loop will run 4 times.\n\n*   `i++` increments `i` on each iteration.\n\
    \nAll the how-to-loop directions are packed into the space between the parentheses:\
    \ where to start the counter, how long to keep the loop going, and how to update\
    \ the counter each time through.\n\nA `while` loop does the same thing, but it's\
    \ organized differently. Only the middle term, how long to keep the loop going,\
    \ is inside the parentheses. The counter is defined before the first line of the\
    \ `while` block. The counter is updated within the code that executes when the\
    \ loop runs.\n\n```javascript\nvar i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n\
    }\n```\n\nIn other ways, a `while` loop is organized along the same lines as a\
    \ `for` loop.\n\n*   Parentheses enclose the loop limiter.\n\n*   Curly brackets\
    \ enclose the code that executes.\n\n*   The code that executes is indented 2\
    \ spaces.\n\nSince any `for` loop can be translated into a `while` loop and vice\
    \ versa, you can use whichever one you prefer.\n\n> Find the interactive coding\
    \ exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/41.html](http://www.ASmarterWayToLearn.com/javascript/41.html)\n\
    \n## 42 do...while loops\n\nIn a `while` loop the order of instructions is:\n\n\
    1.  Declare a variable to serve as a counter, and assign a value to it.\n\n2.\
    \  Start the loop, specifying how long the loop is to run.\n\n3.  Execute one\
    \ or more statements.\n\n4.  Within the loop, as a final statement, advance the\
    \ counter.\n\n```javascript\nvar i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n\
    }\n```\n\nA `do...while` loop accomplishes almost the same task as a `while` loop.\n\
    \n```javascript\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n} while (i <= 3);\n```\n\
    \nThe differences between the two types of loops:\n\n*   Instead of `while`, the\
    \ keyword `do` leads off the statement.\n\n*   The `while` clause, including the\
    \ loop-limiting code inside the parentheses, moves to the bottom—after the closing\
    \ curly bracket.\n\nNote that the `while` clause ends with a semicolon.\n\nFunctionally,\
    \ the difference between a `while` loop and a `do...while` loop is that it's possible\
    \ to code a `while` statement whose block of instructions never execute. Consider\
    \ this `while` loop.\n\n```javascript\nvar i = 0;\nwhile (i < 0) {\n  alert(i);\n\
    \  i++;\n}\n```\n\nThe code says to keep running an alert as long as the counter\
    \ is less than 0\\. But since the counter is never less than 0, the code inside\
    \ the curly brackets never executes.\n\nCompare this with the `do...while` loop.\n\
    \n```javascript\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n} while (i < 0);\n```\n\
    \nThe alert will display once, even though the keep-going condition—`i` less than\
    \ 0—never occurs. Since a `do...while` loop executes the code inside the curly\
    \ brackets before it gets to the loop-limiter at the bottom, it always executes\
    \ that code at least once, no matter what the loop-limiter says.\n\n> Find the\
    \ interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/42.html](http://www.ASmarterWayToLearn.com/javascript/42.html)\n\
    \n## 43 Placing scripts\n"
