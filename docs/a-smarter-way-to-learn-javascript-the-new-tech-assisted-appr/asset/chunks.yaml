    is, embedded in—the HTML that creates a Web page. Or, like an external CSS file,
    it can be placed in a separate file that is loaded by the HTML file. In most cases,
    it''s best to have an external JavaScript file, for some of the same reasons it''s
    best to have an external CSS file. But you still need to know how to place JavaScript
    within your HTML file, so let''s start with that.


    As you know, the order of HTML code is important, because it determines the order
    of elements on the page. If you want the headline to appear above the text, you
    put the headline above the text in the HTML. But JavaScript doesn''t work the
    same way. All of your JavaScript functions, for example, are loaded into memory
    when the page loads. Wherever the code may be, the browser finds it and stores
    it by the time the page is finished loading. Once the page is loaded, all the
    JavaScript code stays in memory, ready to execute, for as long as the page is
    displayed.


    You can legally put JavaScript code almost anywhere in the HTML file—in the head
    section, at the beginning of the body section, somewhere in the middle of the
    body section, or at the end of the body section. You could, if you wanted to be
    perverse, sprinkle different Javascript functions all over your HTML file in different
    places. The browser would sort it all out.


    Generally, the best place for scripts, though, is at the end of the body section.
    This guarantees that CSS styling and image display won''t get held up while scripts
    are loading.


    When you embed blocks of JavaScript in HTML (as opposed to having a separate JavaScript
    file), you must enclose the JavaScript code between `<script>` and `</script>`
    tags. Here are two functions enclosed between the tags.


    `1` `<script>`


    `2 function sayHi() {`


    `3   alert("Hello world!");`


    `4 }`


    `5 function sayBye() {`


    `6   alert("Buh-bye!");`


    `7 }`


    `8` `</script>`


    You can enclose any amount of code—including any number of functions—between the
    `<script>` and `</script>` tags. And, as I mentioned before, you can have different
    sections of code scattered all over your HTML file if you want. But each section
    has to be enclosed between the `<script>` and `</script>` tags.


    For most purposes, coders prefer to have all or most of their JavaScript code
    in a separate JavaScript file, then have the browser load this external file at
    the same time it''s loading the HTML file.


    A JavaScript file is, like HTML and CSS files, a simple text file. It doesn''t
    have a header or any other special sections. It doesn''t even have `<script>`
    and `</script>` tags. It''s just pure JavaScript code. The entire contents of
    a JavaScript file that holds the two functions in the example above would be:


    `1 function sayHi() {`


    `2   alert("Hello world!");`


    `3 }`


    `4 function sayBye() {`


    `5   alert("Buh-bye!");`


    `6 }`


    What makes a JavaScript file a JavaScript file is its file extension: .js. The
    front end of the file name is up to you, as long as it''s legal. Any of these
    would be fine.


    *   scripts.js


    *   coreJS.js


    *   main-code.js


    *   main_code.js


    *   main.code.js


    You include a JavaScript file in an HTML file the same way you include an external
    CSS file—with an opening and closing tag.


    `<script src="whatever.js"></script>`


    For the same reason that it''s a good idea to put JavaScript code at the end of
    the body section, it''s a good idea to place the markup that includes JavaScript
    files at the end of the body section.


    You can include as many external JavaScript files as you like.


    You can include JavaScript files and also embed other JavaScript code in the HTML.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/43.html](http://www.ASmarterWayToLearn.com/javascript/43.html)


    44.


    Commenting


    Commenting, as you know from your work with HTML and CSS, is a way to tell the
    browser to ignore certain portions of text that you include within the body of
    code. Comments are for the human, not the machine. They help you and others understand
    your code when it comes time to revise. You can also use commenting to comment
    out portions of your code for testing and debugging. Since, compared with HTML
    or CSS, JavaScript is typically harder to understand when you come back to it
    later, you may want to put extra effort into commenting your JS code, especially
    if you''re working in a team or if someone else may be asked to maintain your
    code in the future.


    In HTML there''s only one way to mark text as a comment. You write `<!--` to open
    and `-->` to close. And in CSS there''s only one way to mark text as a comment.
    You write `/*` to open and `*/` to close. But in Javascript there are two ways
    mark text as a comment.


    The first way is to mark a single line as a comment, as in line 1 here.


    `1` `//``This is a comment, ignored by the browser`


    `2 for (var i = 0; i`


    `3   if (animals[i] === "bat") {`


    `4     animals[i] = "cat";`


    `5   }`


    `6 }`


    The two slashes mean, "Everything from here to the end of this line is a comment."
    In the example above, that means the whole line, since the slashes are at the
    beginning. But you can write a line that''s part-code and part-comment, this way.


    `var animals = [];` `// Declare an empty array`


    You can write as many lines of comments as you like. Every line must begin with
    the two slashes.


    `// Each comment line must begin with a pair`


    `// of slashes, like this. (Most code editors,`


    `// by the way, are smart enough to recognize`


    `// comments and render them in a different`


    `// color so they''re easy for you to`


    `// distinguish from code.)`


    When you comment with slashes, there''s no closing tag, because the end of the
    line closes the comment automatically.


    For legibility, separate the pair of slashes from the comment with a space. When
    you''re combining code with a comment on the same line, separate the code from
    the pair of slashes with a space.


    When a comment requires more than one line, many coders prefer an alternative
    method. As a user of CSS, you''re already familiar with these tags.


    `/*`


    `When a comment requires more than one line,`


    `a block comment like this, with its opening`


    `and closing tags, is the way to go.`


    `*/`


    JavaScript multi-line comment tags are the same as CSS comment tags. Open with
    `/*`. Close with `*/`.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/44.html](http://www.ASmarterWayToLearn.com/javascript/44.html)


    45


    Events: link


    A good website is a responsive website. The user does something—clicks a button,
    moves the mouse, presses a key—and something happens. JavaScript gives you many
    ways to respond to the user''s needs. A few examples:


    The user clicks a button saying "Our Guarantee" and an alert displays spelling
    out the guarantee.


    A page displays a "before" picture of a model. When the user mouses over the picture,
    it is replaced by an "after" picture of her.


    The user types a number in the Ounces field on a form. When she clicks in the
    Grams field, the equivalent in grams displays.


    The user has entered her email address in a form, and is about to type a comment.
    When she moves the cursor from the email field to the comment field, JavaScript
    checks to see if the email address is valid. In this case, it isn''t—she''s omitted
    ".com" at the end of the address. A message displays letting her know that she''s
    entered an invalid email address.


    On an online shopping site, there''s a picture of a black watch. Next to it is
    a drop-down list asking the user to choose a color. When she chooses, the color
    of the watch in the picture changes to that color.


    All of these user actions—clicking a button, moving the mouse, moving from one
    field to another in a form, selecting a different option—are known as events.
    JavaScript code that responds to an event—for example, displaying a guarantee
    or swapping an image when the pointer hovers over it—is called an event handler.'
