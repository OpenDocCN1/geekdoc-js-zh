- fmt: "\nLine 1 creates a new `Date` object for the current moment. Line \nLine 2\
    \ changes the milliseconds of the `Date` object to 867 milliseconds after the\
    \ second, leaving all other elements of the `Date` object intact.\n\n> Find the\
    \ interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/34.html](http://www.ASmarterWayToLearn.com/javascript/34.html)\n\
    \n## Functions\n\nA function is a block of JavaScript that robotically does the\
    \ same thing again and again, whenever you invoke its name. It saves you repetitive\
    \ coding and makes your code easier to understand.\n\nOn your website, suppose\
    \ there are several pages where you want to display an alert that tells the user\
    \ the current time. (To keep it simple, we'll settle for 24-hour time rather than\
    \ converting to a.m. and p.m.) The code might look like this.\n\n```javascript\n\
    1 var now = new Date();\n2 var theHr = now.getHours();\n3 var theMin = now.getMinutes();\n\
    4 alert(\"time: \" + theHr + \":\" + theMin);\n```\n\nYou could write this block\
    \ of code over and over again, every time you need it. Or you could write it once\
    \ as a function, naming it, say, `tellTime`. After that, this is the only code\
    \ you'll need in order to make the whole block execute:\n\n`tellTime();`\n\nWhenever\
    \ JavaScript sees that short statement, the time-telling block executes.\n\nThis\
    \ is how you package the one-off code above as a repeatable function:\n\n```javascript\n\
    1 function tellTime() {\n2   var now = new Date();\n3   var theHr = now.getHours();\n\
    4   var theMin = now.getMinutes();\n5   alert(\"Current time: \"+ theHr + \":\"\
    \ + theMin);\n6 }\n```\n\nThe time-telling code—the code that creates the `Date`\
    \ object, extracts the time, formats it, and displays an alert—is exactly the\
    \ same code we started with, but is now packaged as a function. Here are the parts:\n\
    \n1. On line 1 an opening declaration statement that includes:\n   - the keyword\
    \ `function`\n   - a name I made up for the function\n   - parentheses that identify\
    \ it as a function\n   - an opening curly bracket to enclose the code that will\
    \ execute\n2. On lines 2 through 5 the same block of code that you saw before\
    \ executes, but it's indented for clarity. Opinions vary on how much to indent.\
    \ I train you to indent 2 spaces.\n3. On line 6 a closing curly bracket on its\
    \ own line to enclose the code that will execute\n\nAgain, note that the calling\
    \ code—the code that invokes the function—does nothing more than state the name\
    \ of the function including its parentheses.\n\n`tellTime();`\n\nYou can give\
    \ a function any name that would be a legal variable name, then add parentheses.\
    \ Function-naming follows the same rules as variable naming because, technically,\
    \ a function is a variable. This will make more sense to you when you learn more\
    \ about functions in a subsequent chapter.\n\nFunctions and the statements that\
    \ call them may be separated by thousands of lines of code. Typically, functions\
    \ are in the same place as the main code—in an external JavaScript file, at the\
    \ end of the HTML body section, or in the HTML head section. Normally, all the\
    \ functions should precede the main code, so when they're called by the main code,\
    \ they're already loaded in memory and ready to go.\n\n> Find the interactive\
    \ coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/35.html](http://www.ASmarterWayToLearn.com/javascript/35.html)\n\
    \n### Functions: Passing them data\n\nA function is a block of code that does\
    \ something robotically, whenever you invoke its name. For example, when you write\
    \ `greetUser();` a function with that name executes. To be clear: The kind of\
    \ function I'm talking about is one that you've written yourself, and named yourself.\n\
    \nSuppose that when you write `greetUser();` a function is called that displays\
    \ an alert saying, \"Hello, there.\"\n\nThis is the code for the function.\n\n\
    ```javascript\n1 function greetUser() {\n2   alert(\"Hello, there.\");\n3 }\n\
    ```\n\nOne of the really useful things about functions is that those parentheses\
    \ in the calling code don't have to be empty. If you put some data inside the\
    \ parentheses, you can pass that data to the function that it'll use when it executes.\n\
    \nSuppose, instead of writing `greetUser();` you write...\n\n`greetUser(\"Hello,\
    \ there.\");`\n\nNow, instead of just calling the function, you're calling it\
    \ and passing data to it. The string inside the parentheses, i.e. the data you're\
    \ passing, is called an argument.\n\nThe function is now more versatile, because\
    \ the message it displays is no longer hard-wired into it. It'll display any message\
    \ that you pass to it from the calling code, via the argument.\n\nIn order for\
    \ a function to become a programmable robot rather than a one-job robot, you have\
    \ to set it up to receive the data you're passing. Here's how you do it.\n\n```javascript\n\
    1 function greetUser(greeting) {\n2   alert(greeting);\n3 }\n```\n\nSo now we've\
    \ filled the parentheses of both the calling code and the function definition.\
    \ The parentheses of the calling code contain an argument. In the example, the\
    \ argument is the string \"Hello, there.\" And, as you can see in the example\
    \ above, the parentheses of the function definition now contain a variable, `greeting`.\n\
    \nA variable inside the parentheses in a function statement is known as a parameter.\
    \ The parameter name is up to you. You can give it any name that would be legal\
    \ for a variable. Then you can use it to accomplish something in the body of the\
    \ function. On line 2 in the example above, I used it to specify the message in\
    \ an `alert`.\n\nYou don't have to declare a variable when it's used as a parameter\
    \ in a function definition. When it's used as a parameter, the declaration is\
    \ implicit.\n\nThe argument in the statement that calls the function —\"Hello,\
    \ there.\"—is the data that's passed to the function. The parameter inside the\
    \ parentheses in the function definition catches the data that's passed. It now\
    \ holds \"Hello, there.\" In other words, the string \"Hello, there\", specified\
    \ in the function call, is assigned to `greeting` in the function. Then that variable,\
    \ `greeting`, is used to specify the message in the alert statement.\n\nThe value\
    \ passed to a function is used in the body of the function to accomplish something.\
    \ In this case, the value is used to specify the message in the alert.\n\nIn the\
    \ example, the argument is a string, but it could just as easily be a variable.\
    \ In the following code, I declare the variable `greeting` and assign it the value\
    \ \"Hello, there.\" Then, rather than using the string itself as an argument in\
    \ the function call, I use the variable.\n\n```javascript\n1 var greeting = \"\
    Hello, there.\";\n2 greetUser(greeting);\n```\n\nIn the example above, the name\
    \ of the function `greetUser` shares some of its name with the parameter `greeting`,\
    \ but that's just to make the code easy to understand. The name of the function\
    \ and the name of the parameter don't have to have anything in common. And remember,\
    \ these names are up to you, as long as you follow the variable-naming rules.\n\
    \nIn the example, I named the argument in the calling code `greeting`, and also\
    \ named the parameter in the function code `greeting`. But this isn't necessary,\
    \ either. They don't have to match. No matter what an argument's name is, it is\
    \ accepted by the parameter, no matter what the parameter's name is. In the following\
    \ code, the variable `whatever` is the argument. The parameter `greeting` doesn't\
    \ match the name, but still catches the value.\n\nHere's the function, once again,\
    \ with the parameter `greeting`.\n\n```javascript\n1 function greetUser(greeting)\
    \ {\n2   alert(greeting);\n3 }\n```\n\nAnd here's the statement that calls the\
    \ function, with the argument `whatever`.\n\n```javascript\n1 var whatever = \"\
    Hello, there.\";\n2 greetUser(whatever);\n```\n\nIt's okay that the name of the\
    \ argument and the name of the parameter don't match. The parameter still catches\
    \ the argument, the string \"Hello, there.\"\n\nStill, it often makes sense to\
    \ give an argument and a parameter the same name, for clarity.\n"
