  trans: "\n\n正则表达式值得用一整本书来讲解，超出了本书的范围。不过，为了让你感受一下它们有多强大（而且简洁！），这里有一个例子。它测试了上面代码检查的所有非法情况，甚至更多。（本章练习中不会涉及这部分内容，所以不必试图记住示例中的任何东西。）\n\
    \n```\nfunction validateEmail() {\n  var eEntered = document.getElementById(\"\
    address\").value;\n  var regex = /^[\\w\\-\\.\\+]+\\@[a-zA-Z0-9\\. \\-]+\\.[a-zA-z0-9]{2,4}$/;\n\
    \  if (!(eEntered.match(emailCorrectPattern))) {\n    alert(\"Please correct email\
    \ address\");\n    return false;\n  }\n}\n```\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/86.html`](http://www.ASmarterWayToLearn.com/javascript/86.html)\n\
    \n## 87 异常：try 和 catch\n\n如果你运行以下代码，什么都不会发生。\n\n```\nfunction greetWorld() {\n\
    \  var greeting = \"Hello world!\";\n  aler(greeting);\n}\n```\n\n关键字 `alert`\
    \ 被拼写成了 `aler`，导致代码出错。但 JavaScript 不会告诉你哪里出了问题。就像一辆无法启动的汽车，是电池的问题？油路？还是火花塞？\n\n\
    当然，在上面这段小代码中，很容易发现问题。但如果函数有 40 行代码，并且调用了另外三个函数呢？如果 JavaScript 能报告具体问题而不是直接崩溃，那就太好了。这正是\
    \ `try`...`catch` 的作用。它的工作原理如下。\n\n```\nfunction greetWorld() {\n  try {\n   \
    \ var greeting = \"Hello world!\";\n    aler(greeting);\n  }\n  catch(err) {\n\
    \    alert(err);\n  }\n}\n```\n\n原始的操作代码被包裹在 `try` 块中。错误的 `aler` 导致 JavaScript\
    \ 错误，该错误被传递给 `catch` 块。一个警告框会显示导致问题的错误。\n\n当你将一些操作代码包裹在 `try` 块中时，你是在对 JavaScript\
    \ 说：“尝试执行这段代码。如果出现错误，停止执行，并转到 `catch` 块看看该怎么做。”在上面的例子中，JavaScript 抛出的错误被赋值给参数\
    \ `err`，然后该值显示在警告框中：\n\n“ReferenceError: Can't find variable: aler”\n\n好吧，在这个例子中，JavaScript\
    \ 并没有给出你想要的精确信息。它没有告诉你漏掉了 `alert` 关键字中的“t”，而是告诉你遇到了一个未定义的变量。但已经足够接近了。JavaScript\
    \ 为你指明了正确的方向。\n\n请注意，`try` 和 `catch` 总是成对出现。没有 `try`，错误就不会触发 `catch`。没有 `catch`，JavaScript\
    \ 在抛出错误时就不知道该怎么办。\n\n还有一些需要记住的事项：\n\n*   `try` 和 `catch` 块内的代码用花括号包裹。\n*   `try`\
    \ 块内的功能代码需要缩进。\n*   错误参数（本例中为 `err`）可以使用任何合法的变量名。\n*   在这个例子中，当错误发生时会显示一个警告框。但你也可以做其他事情。\n\
    \n`try` 和 `catch` 这对组合的用途有限。例如，在上面的例子中，如果你漏掉了一个括号、方括号或引号，或者数量过多，就不会显示任何警告框。代码只会崩溃，什么都不会发生。`try`\
    \ 和 `catch` 方法主要用于发现未定义的变量，或者像本例中这样，JavaScript 将其解释为未定义变量的错误。\n\n> 本章的交互式编程练习请访问：\n\
    > [`www.ASmarterWayToLearn.com/js/87.html`](http://www.ASmarterWayToLearn.com/javascript/87.html)\n\
    \n## 88 异常：throw\n\n通过添加一个或多个 `throw` 语句，你可以在 `try`...`catch` 对中定义自己的错误。这对于处理用户的不当行为非常有用。\n\
    \n假设你要求用户创建一个密码。密码长度必须在 8 到 12 个字符之间，必须包含至少一个数字，并且不能包含空格。以下是创建表单的标记，为了让你专注于要点而进行了简化：\n\
    \n```\n<form onSubmit=\"return checkPassword();\">\n  Enter a password<br>\n \
    \ (8-12 characters, at least 1 number, no spaces)<br>\n  <input type=\"text\"\
    \ id=\"f1\">\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n这是测试用户输入是否满足要求的函数。如果不满足，函数会显示一个警告框。\n\
    \n```\nfunction checkPassword() {\n  try {\n    var pass = document.getElementById(\"\
    f1\").value;\n    if (pass.length < 8) {\n      throw \"Please enter at least\
    \ 8 characters.\";\n    }\n    if (pass.indexOf(\" \") !== -1) {\n      throw\
    \ \"No spaces in the password, please.\";\n    }\n    var numberSomewhere = false;\n\
    \    for (var i = 0; i < pass.length; i++) {\n      if (isNaN(pass(i, i+1)) ===\
    \ false) {\n        numberSomewhere = true;\n        break;\n      }\n    }\n\
    \    if (numberSomewhere === false) {\n      throw \"Include at least 1 number.\"\
    ;\n    }\n  }\n  catch(err) {\n    alert(err);\n  }\n}\n```\n\n第 4 到 9 行以及第 17\
    \ 到 19 行测试了三种不同的用户错误，并为每个错误抛出了一个自定义字符串。`catch` 代码捕获的不是 JavaScript 生成的错误，而是 `throw`\
    \ 发送的字符串。这个字符串被赋值给第 21 行的变量 `err`，并作为第 22 行的显示消息。\n\n请注意，任何类型的值（包括数字或布尔值）都可以通过\
    \ `throw` 传递给 `catch` 参数。你也可以传递一个变量。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/88.html`](http://www.ASmarterWayToLearn.com/javascript/88.html)\n\
    \n## 89 在 JavaScript 内部处理事件\n\n在前面的章节中，你学习了如何使用内联事件处理程序来处理按钮点击或表单提交等事件。这是最古老、最不抽象的方式。但根据专业程序员“政教分离”的理念，JavaScript\
    \ 的功能应该与 HTML 的内容分开。首先，一个不太理想的内联方法示例：\n\n```\n<input type=\"button\" value=\"\
    Click\" onClick=\"sayHello();\">\n```\n\n我们将移除上面标记中高亮的部分，并添加一个 id。\n\n```\n<input\
    \ type=\"button\" value=\"Click\" id=\"button1\">\n```\n\n以下是处理事件的 JavaScript\
    \ 代码。\n\n```\nvar b1 = document.getElementById(\"button1\");\nb1.onclick = sayHello;\n\
    ```\n\n第 1 行将元素赋值给变量 `b1`。第 2 行监听该元素的点击事件。当点击发生时，它会调用函数 `sayHello`。\n\n需要注意的事项：\n\
    \n*   与内联事件处理使用的驼峰命名不同，事件名称必须全部小写，否则无法工作。应该是 `onclick` 而不是 `onClick`，`onfocus`\
    \ 而不是 `onFocus`，`onsubmit` 而不是 `onSubmit`。\n*   与内联事件处理不同，等号后面的函数名不加引号。\n*   与内联事件处理不同，函数名后面没有括号。\n\
    \n如果你愿意，可以将其压缩成一条语句，写成：\n\n```\ndocument.getElementById(\"button1\").onclick =\
    \ sayHello;\n```\n\n无论使用内联还是脚本化事件处理，函数代码都是相同的。例如：\n\n```\nfunction sayHello()\
    \ {\n  alert(\"Hi there.\");\n}\n```\n\n以下代码调用一个函数，当用户鼠标悬停在原始图像上时，将一张图像替换为另一张。\n\
    \n```\nvar targetImg = document.getElementById(\"i12\");\ntargetImg.onmouseover\
    \ = swapPic;\n```\n\n以下代码调用一个函数，在提交表单时验证电子邮件地址。\n\n```\nvar emailFrm = document.getElementById(\"\
    form5\");\nemailFrm.onsubmit = valEmail;\n```\n\n> 本章的交互式编程练习请访问：\n\n"
