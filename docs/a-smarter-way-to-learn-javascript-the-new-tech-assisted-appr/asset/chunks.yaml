    85


    Form validation: ZIP codes


    Now, a one-field form that asks the user to enter her ZIP code.


    You''ve already learned how to make sure the user hasn''t left the field blank.
    But how do you test whether she''s entered the right number of digits for a ZIP—5
    digits?


    HTML gives you a way to keep her from entering too many digits: `maxlength=5`.
    But if you want to make sure she hasn''t entered too few digits, you need to use
    JavaScript. Here''s the function.


    `1 function validateZIP() {`


    `2   var` `numChars` `= document.getElementById("zip").value.length;`


    `3   if (``numChars` `< 5) {`


    `4     alert("Please enter a 5-digit code.");`


    `5     return false;`


    `6   }`


    `7 }`


    If the number of characters in the field is fewer than 5, an alert displays and
    `false` is returned to the calling code, cancelling the form submission.


    Another question to ask about the ZIP field entry is whether the user has entered
    only numbers. Here''s the additional code for that.


    `1  function validateZIP() {`


    `2    var valueEntered = document.getElementById("zip").value;`


    `3    var numChars = valueEntered.length;`


    `4    if (numChars < 5) {`


    `5      alert("Please enter a 5-digit code.");`


    `6      return false;`


    `7    }`


    `8` `for (var i = 0; i <= 4; i++) {`


    `9` `var thisChar = parseInt(valueEntered[i]);`


    `10     ``if (isNaN(thisChar)) {`


    `11       ``alert("Please enter only numbers.");`


    `12       ``return false;`


    `13     ``}`


    `14` `}`


    `15 }`


    The highlighted code loops through the five characters that have been entered,
    checking to make sure that all the characters are string characters representing
    numbers. Because the five characters in the field are string characters, each
    one has to be converted to a number if possible before being tested. Line 9 does
    this. Line 10 tests to see whether the attempted conversion worked. If a number
    resulted from `parseInt` in line 9, no problem. But if the character isn''t a
    number after the conversion attempt—if it `isNaN` in line 10—an alert displays
    and `false` is returned, cancelling the form submission.


    ![](images/00009.jpg)


    A more elegant and more versatile way to validate forms is to use regular expressions.
    Regular expressions are outside the scope of this book, but I''ll give you a small
    taste of them in the next chapter.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/85.html](http://www.ASmarterWayToLearn.com/javascript/85.html)


    86


    Form validation: email


    Validating an email field includes checking to make sure there are no illegal
    characters, like spaces, and that all the essentials of a legal email address
    are there: one or more characters, followed by @, followed by one or more characters,
    followed by a dot, followed by two to four characters. The standard way to test
    for all this is to match the user''s entry with a regular expression. Regular
    expressions are beyond the scope of this book, but I''ll give you a taste of them
    at the end of the chapter. Meanwhile, here''s how to head off many user errors
    by using `indexOf`.


    Let''s start by checking for spaces, which are illegal in an email address.


    `1 function validateEmail() {`


    `2   var eEntered = document.getElementById("email").value;`


    `3   ``if (eEntered.indexOf(" ") !== -1) {`


    `4     alert("No spaces allowed in address");`


    `5     return false;`


    `6   }`


    `7 }`


    Line 3 is the key here. If the index of the illegal space character is anything
    other than -1, it means the character is in there somewhere, and an alert displays.


    If you wanted to, you could test for the presence of all the other illegal characters
    the same way. But in that case, you''d be better off using a regular expression,
    as I show at the end of this chapter.


    In an email address you want to see the @ sign at least one character from the
    beginning of the string and no closer to the end of the string than 5 characters
    away. Here''s a line that adds this test to the example function.


    `1   function validateEmail() {`


    `2     var addressIsLegal = true;`


    `3     var eEntered = document.getElementById("address").value;`


    `4     if (eEntered.indexOf(" ") !== -1) {`


    `5       addressIsLegal = false;`


    `6     }`


    `7     ``if (eEntered.indexOf("@") < 1 || eEntered.indexOf("@") > eEntered.length
    - 5) {`


    `8       addressIsLegal = false;`


    `9     }`


    `10    if (addressIsLegal === false) {`


    `11      alert("Please correct email address");`


    `12      return false;`


    `13    }`


    `14 }`


    About line 7: The first part, left of the pipes, tests whether the character is
    at the beginning of the address, which would be illegal. The second part, right
    of the pipes, tests whether there are fewer than 4 characters following the character.
    Since there must be at least one character for the domain name plus a dot plus
    at least two characters for the extension, fewer than 4 characters following the
    @ would be illegal.


    Finally, I''ll add a test for the dot that needs to be at least 1 character away
    from the "@" and have 2 to 4 characters following it.


    `1   function validateEmail() {`


    `2    var addressIsLegal = true;`


    `3    var eEntered = document.getElementById("address").value;`


    `4    if (eEntered.indexOf(" ") !== -1) {`


    `5      addressIsLegal = false;`


    `6    }`


    `7    if (eEntered.indexOf("@") < 1 || eEntered.indexOf("@") > eEntered.length
    - 5) {>`


    `8      addressIsLegal = false;`


    `9    }`


    `10   ``if (eEntered.indexOf(".") - eEntered.indexOf("@") < 2 ||`


    `eEntered.indexOf(".") > eEntered.length - 3) {`


    `11     addressIsLegal = false;`


    `12   }`


    `13   if (addressIsLegal === false) {`


    `14     alert("Please correct email address");`


    `15     return false;`


    `16   }`


    `14 }`


    Line 10: There must be at least one character between the dot and the @. The first
    part, left of the pipes, tests whether that one character (or more) is missing,
    which would be illegal. There must also be at least 2 characters following the
    dot. The second part, right of the pipes, tests whether there are fewer than 2
    characters following the character, which would be illegal.


    ![](images/00009.jpg)


    All of the tests shown above, and more besides, can be incorporated into a single
    regular expression test. A regular expression expresses a pattern that, in this
    case, the user''s entry must match in order to validate. If you''re familiar with
    the wildcard operator, *, which stands for "any combination of characters of any
    length," that''s the general idea. But regular expressions go far beyond the wildcard
    operator.'
