    loris\"` `onMouseover=\"expand();\"``>Slow Loris: Mouse over for more info</p>`\n\
    \nAt this point don't worry now about how the function `expand` grows the paragraph.\
    \ You'll learn about that later.\n\nIn the example we started with, the model's\
