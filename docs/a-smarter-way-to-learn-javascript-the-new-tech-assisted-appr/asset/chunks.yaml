    ## 52 Manipulating images and text


    Your webpage displays a picture of a blobfish. The blobfish is a fascinating animal,
    but it''s so ugly, some of your users go "Yuck." So you give them the option of
    making it disappear. When they click the image, it vanishes.


    You begin by giving the image an `id`.


    ```

    <img src="Blobfish.jpg" id="ugly" ...>

    ```


    Then you add an event handler.


    ```

    <img src="blobfish.jpg" id="ugly" onClick="makeInvisible();">

    ```


    You have a CSS class for invisibility.


    ```

    .hidden {display:none;}

    ```


    The function called by the event handler gives the image a class of "hidden,"
    so it disappears.


    ```

    1 function makeInvisible() {

    2   document.getElementById("ugly").className = "hidden";

    3 }

    ```


    When the function is called, it assigns the "hidden" class to the element with
    the `id` "ugly." The image disappears.


    Some things to keep in mind:


    * This is just a variation on things you''ve already learned, `document.getElementById(theElementId).value`
    (for form fields) and `document.getElementById(theElementId).innerHTML` (for paragraphs,
    `div`s, and other HTML elements).

    * It''s `className`, in camelCase, not `class`.

    * Assigning a class to an element this way replaces any classes that the element
    has been assigned in the static markup.


    If you want to add a class to an element, preserving its existing classes, you
    can do it. For example, suppose you have a paragraph with a class that styles
    it in Verdana, size 1 em. When the user mouses over it, you want to double its
    size to 2 em. But you don''t want to lose the Verdana styling of its original
    class. Rather than replace the class that styles it in Verdana, you want to retain
    that class and add the class that enlarges the font. Let''s say the element has
    the `id` "p1". This is the function.


    ```

    1 function makeBig() {

    2   document.getElementById("p1").className += " big";

    3 }

    ```


    Compared with the code that replaces all the existing classes with a new one,
    this code has two small differences.


    * It''s `+=` instead of just `=`.

    * A space before the class name is required.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/52.html](http://www.ASmarterWayToLearn.com/javascript/52.html)


    ## 53 Swapping images


    In Chapter 47 you learned how to replace one image with another when the user
    mouses over the image. When the page first displays, a "before" picture is what
    the user sees. When the user mouses over the picture, it is replaced by an "after"
    picture.


    You learned how to do this by coding an inline event handler that looks like this.


    ```

    <img src="before-pic.jpg" onMouseover="src=''after-pic.jpg''">

    ```


    Another way to do it is to call a function that makes the swap. This is the markup:


    ```

    <img src="before-pic.jpg" id="before" onMouseover="swapPic();">

    ```


    This is the function code.


    ```

    1 function swapPic() {

    2   document.getElementById("before").src = "after-pic.jpg";

    3 }

    ```


    But why not make the function a general-purpose routine that can swap any image
    for any other image? In order for this to work, the markup has to pass both the
    `id` and the name of the replacement image to the function as arguments.


    ```

    <img src="before-pic.jpg" id="before" onMouseover="swapPic(id,''after-pic.jpg'');">

    ```


    The function accepts these arguments as its parameters and uses them to swap the
    images.


    ```

    1 function swapPic(eId, newPic) {

    2   document.getElementById(eId).src = newPic;

    3 }

    ```


