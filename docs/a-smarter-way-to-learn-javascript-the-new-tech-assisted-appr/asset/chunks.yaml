  raw: 'The statement assigns to the variable `newNumber` the result of a mathematical
    operation. The result of this operation, of course, is a number value.


    The example mixes a variable and a literal number in a math expression. But you
    could also use nothing but numbers or nothing but variables. It''s all the same
    to JavaScript.


    I''ve told you that you can''t begin a variable name with a number. The statement...


    `var` `1``stPresident = "Washington";`


    ...is illegal, thanks to that initial "1" in the variable name.


    But you can include numbers in variable names, as long as none of them come first.
    The statement...


    `var prezWhoCame``1``st = "Washington";`


    ...is legal.


    Conveniently, if you specify a number instead of a string as an alert message...


    `alert(``144``);`


    ...or if you specify a variable that represents a number as an alert message...


    `1 var` `caseQty` `= 144;`


    `2 alert(``caseQty``);`


    ...JavaScript automatically converts it to a string and displays it.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/3.html](http://www.ASmarterWayToLearn.com/javascript/3.html)


    4


    Variable Names Legal and Illegal


    You''ve already learned three rules about naming a variable: You can''t enclose
    it in quotation marks. The name can''t be a number or start with a number. It
    can''t be any of JavaScript''s keywords—the special words that act as programming
    instructions, like `alert` and `var`.


    Here are the rest of the rules:


    *   A variable name can''t contain any spaces.


    *   A variable name can contain only letters, numbers, dollar signs, and underscores.


    *   Though a variable name can''t be any of JavaScript''s keywords, it can contain
    keywords. For example, `userAlert` and `myVar` are legal.


    *   Capital letters are fine, but be careful. Variable names are case sensitive.
    A `rose` is not a `Rose`. If you assign the string "Floribundas" to the variable
    `rose`, and then ask JavaScript for the value assigned to `Rose`, you''ll come
    up empty.


    *   I teach the camelCase naming convention. Why "camelCase"? Because there is
    a hump or two (or three) in the middle if the name is formed by more than one
    word. A camelCase name begins in lower case. If there''s more than one word in
    the name, each subsequent word gets an initial cap, creating a hump. If you form
    a variable name with only one word, like `response`, there''s no hump. It''s a
    camel that''s out of food. Please adopt the camelCase convention. It''ll make
    your variable names more readable, and you''ll be less likely to get variable
    names mixed up.


    Examples:


    `userResponse`


    `userResponseTime`


    `userResponseTimeLimit`


    `response`


    *   Make your variable names descriptive, so it''s easier to figure out what your
    code means when you or someone else comes back to it three weeks or a year from
    now. Generally, `userName` is better than `x`, and `faveBreed` is better than
    `favBrd`, though the shorter names are perfectly legal. You do have to balance
    readability with conciseness, though. `bestSupportingActressInADramaOrComedy`
    is a model of clarity, but may be too much for most of us to type or read. I''d
    shorten it.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/4.html](http://www.ASmarterWayToLearn.com/javascript/4.html)


    5


    Math expressions:


    Familiar operators


    Wherever you can use a number, you can use a math expression. For example, you''re
    familiar with this kind of statement.


    `var popularNumber = 4;`


    But you can also write this.


    `var popularNumber =` `2 + 2``;`


    You can also write:


    `alert(``2 + 2``);`


    This displays the messge "4" in an alert box.


    When it sees a math expression, JavaScript always does the math and delivers the
    result.


    Here''s a statement that subtracts 24 from 12, assigning -12 to the variable.


    `var popularNumber = 12 - 24;`


    This one assigns the product of 3 times 12, 36, to the variable.


    `var popularNumber = 3 * 12;`


    In this one, the number 10 is assigned to a variable. Then 1 is added to the variable,
    and the sum, 210, is assigned to a second variable.


    As usual, you can mix variables and numbers.


    `1 var num = 10;`


    `2 var popularNumber =` `num + 200``;`


    You can also use nothing but variables.


    `1 var num = 10;`


    `2 var anotherNum = 1;`


    `3 var popularNumber =` `num + anotherNum``;`


    The arithmetic operators I''ve been using, +, -, *, and /, are undoubtedly familiar
    to you. This one may not be:


    `var whatsLeftOver = 10` `%` `3;`


    % is the modulus operator. It doesn''t give you the result of dividing one number
    by another. It gives you the remainder when the division is executed.


    If one number divides evenly into another, the modulus operation returns 0\. In
    the following statement, 0 is assigned to the variable.


    `var whatsLeftOver = 9 % 3;`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/5.html](http://www.ASmarterWayToLearn.com/javascript/5.html)


    6


    Math expressions:


    Unfamiliar operators


    There are several specialized math expressions you need to know. Here''s the first
    one.


    `num++;`


    This is a short way of writing...


    `num = num + 1;`


    It increments the variable by 1.


    You decrement using minuses instead of pluses.


    `num--;`


    You can use these expressions in an assignment. But the result may surprise you.


    `1 var num = 1;`


    `2 var newNum = num++;`


    In the example above, the original value of `num` is assigned to `newNum`, and
    `num` is incremented afterward. If `num` is originally assigned 1 in the first
    statement, the second statement boosts its value to 2\. `newNum` gets the original
    value of `num`, 1.


    If you place the pluses before the variable, you get a different result.


    `1 var num = 1;`


    `2 var newNum = ++num;`


    In the statements above, both `num` and `newNum` wind up with a value of 2.


    If you put the minuses after the variable, the new variable is assigned the original
    value, and the first variable is decremented.


    `1 var num = 1;`


    `2 var newNum = num--;`


    `num` is decremented to 0, and `newNum` gets the original value of `num`, 1.


    But if you put the minuses before the variable, `newNum` is assigned the decremented,
    not the original, value. Both `num` and `newNum` wind up with a value of 0.


    `1 var num = 1;`


    `2 var newNum = --num;`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/6.html](http://www.ASmarterWayToLearn.com/javascript/6.html)


