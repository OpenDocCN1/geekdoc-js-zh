    # switch statements: How to start them


    Consider this chain of conditional statements.


    ```javascript

    1 if (dayOfWk === "Sat" || dayOfWk === "Sun") {

    2   alert("Whoopee!");

    3 }

    4 else if (dayOfWk === "Fri") {

    5   alert("TGIF!");

    6 }

    7 else {

    8   alert("Shoot me now!");

    9 }

    ```

