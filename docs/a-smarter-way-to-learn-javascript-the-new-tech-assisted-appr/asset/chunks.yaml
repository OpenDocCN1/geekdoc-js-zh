    ## 更聪明地学习 JavaScript


    ### 我如何提议利用技术将你的努力减半


    当你开始学习像 `JavaScript` 这样复杂的内容时，你就要承担相当重的认知负担。如果让我猜测，我会说自学一门语言这个整体工程至少会消耗一大车脑葡萄糖。但你可能没有意识到的是：当你自学时，你的认知负荷会加倍。


    是的，如果作者写得好，所有信息都在书里。但学习一门语言远不止阅读一些信息。你需要将信息牢记于心，这需要某种计划。你需要练习。你打算如何安排？当你偏离方向时，你需要某种方式来纠正自己。由于书籍并不是帮助你完成这些任务的最佳方式，大多数作者甚至不会尝试。这意味着所有为自己设计学习路径的工作都留给了你。而这种自学的元学习，这种如何掌握书中内容的挣扎，比学习本身还要费力。


    传统上，现场讲师弥合了阅读和学习之间的鸿沟。如果你有时间并且负担得起，参加全面的课程或与导师一对一学习仍然是学习 `JavaScript` 的最佳方式。但是，既然很多人更喜欢自学，为什么不利用最新的技术作为替代老师呢？让书来阐述原理。然后使用交互式程序进行记忆、练习和纠正。当计算机参与进来时，你将用一半的努力，以两倍的速度学习。这是更聪明地学习
    `JavaScript` 的方式。这也是更聪明地学习任何东西的方式。


    既然我们拥抱新技术，为什么不利用我们能获得的所有技术来优化这本书呢？从教学角度来看，旧技术——即纸质书——有严重的局限性。新技术——即电子书——是更好的选择，原因有很多。以下是一些：


    *   **颜色是一种极好的信息工具。** 这就是为什么交通灯使用颜色的原因。但在纸上印刷颜色会使成本成倍增加。由于高昂的启动费用，在按需印刷的书中打印这一个词——颜色——就会使零售价增加三十美元。所以颜色通常被排除在外，否则这本书就会被定价为奢侈品。而对于电子书，颜色是免费的。

    *   **纸张本身很昂贵**，所以通常没有空间来容纳作者想做的所有事情。详细讨论细节？别想了。对难点的额外帮助？负担不起。数百个示例？最好删掉一些。但电子书没有这种限制。额外增加一百页数字内容要花多少钱？通常什么都不花。

    *   **传统出版很慢。** 当一本书以传统方式出版时，手稿可能需要长达一年的时间才能付印。这意味着没有时间对目标受众进行广泛测试，也没有时间进行测试必然建议的修订。而且一旦书印出来，发行修订版就是一件昂贵的大事。出版商会尽可能推迟。读者反馈通常需要数年才能带来改进。电子书可以在一天内从手稿变成书，留下大量时间进行测试和修订。出版后，基于读者反馈的改进版新版本可以按作者意愿随时推出，且无需成本。


    有了这些优势，还有谁怀疑所有最好的教学书籍都将是电子书吗？还有谁会否认，作者能为你做的最有帮助的事情，除了以电子形式出版一本好书之外，就是承担整个教学任务，而不仅仅是部分任务，通过增加交互性来帮助你记忆、练习和纠正？


    那么，以下是我提议如何利用当前技术帮助你用一半的时间、一半的努力学习 `JavaScript`：


    *   **认知分块控制。** 测试告诉我，在进行高强度学习时，即使是意志坚强的人也会比我预期的更快疲劳。你可能能够连续读两小时小说，但当你学习新的复杂内容时，情况就完全不同了。我的测试显示，学习新材料大约十分钟是极限，之后大多数学习者开始疲劳。但好消息是：即使你在学习十分钟后进入了疲劳区，你仍然有足够的脑力去练习长达三十分钟。设计得当的练习比学习花费更少的精力，却能教你更多。少读多练是学习最快的方式。

    *   **500 个编码示例**，涵盖了你所学内容的各个方面。示例使概念易于掌握，并将你的注意力集中在每章涵盖的关键材料上。代码中嵌入的颜色提示帮助你记住规则。我是不是做得过火，放了比你需要的更多的示例？好吧，如果对你来说太简单了，就跳过一些。

    *   **在初学者身上测试过。** 本书包含多轮基于编程初学者反馈的修订。它包含额外的帮助讨论，以澄清在测试中被证明是绊脚石的概念。测试者中包括我的技术恐惧症妻子，她发现，在良好的指导下，她也能编程——并且惊讶地发现自己很喜欢。同样，我自己也有几个惊喜。一些对我来说简单的事情，对某些读者来说并不那么简单。于是进行了重写。

    *   **免费的交互式编码练习**，与每章配对——总共 1750 个。测试者说这是对他们帮助最大的功能。这并不意外。据《纽约时报》报道，心理学家“已经证明，进行一次测试——比如，写下你能记住的所有内容——比进一步学习更能加深对那段文字的记忆。”我敢说，在学习编程时，效果会加倍。阅读每章后，上网练习你学到的所有内容。每章末尾都有一个链接，指向其配套的在线练习。所有练习的索引可以在
    `http://www.ASmarterWayToLearn.com/js/` 找到。

    *   **实时编码体验。** 在脚本编写中，最好的回报是看到你的代码完美运行。大多数练习环节包括实时编码练习，让你在浏览器中看到脚本执行。


    ### 如何使用本书


    这本书和你以前拥有的任何书都不太一样，所以一份简短的使用说明可能会有所帮助。


