    \n## 82\n\n### 表单验证：文本字段\n\n用户是否正确填写了你的表单？JavaScript 可以帮助你找出答案——也就是说，帮助你验证表单。通过表单验证，如果出现问题，你可以要求用户重新尝试。首先，如果你有一个必填字段，你可以检查用户是否在其中输入了内容。让我们从一个简单的表单开始，该表单要求用户输入她的姓氏。\n\
    \n以下是该表单的一些标记。我省略了很多东西，包括样式，以便让你专注于这里需要学习的重要内容。\n\n```\n<form onSubmit=\"return\
    \ checkForLastName();\">\n  Please enter your last name.<br>\n  <input type=\"\
    text\" id=\"lastNameField\">\n  <input type=\"submit\" value=\"Submit Form\">\n\
    </form>\n```\n\n当用户点击提交按钮时，会调用函数 `checkForLastName`。\n\n以下是该函数。\n\n```\n1 function\
    \ checkForLastName() {\n2   if (document.getElementById(\"lastNameField\").value.length\
    \ === 0) {\n3     alert(\"Please enter your last name\");\n4     return false;\n\
    5   }\n6 }\n```\n\n第 2 行询问 id 为 `\"lastNameField\"` 的字段中的值的长度是否为 0。也就是说，那里没有输入任何内容吗？如果是，则会显示一个警告，要求用户输入她的名字。然后在第\
    \ 4 行发生了其他事情。布尔值 `false` 被返回给调用代码。这会阻止表单被提交。为了取消提交，在调用函数的标记中必须有一个匹配的关键字 `return`。如果没有这个调用代码中的\
    \ `return`，函数第 4 行的 `return` 将不会阻止表单被提交。\n\n`<form onSubmit=\"return checkForLastName();\"\
    >`\n\n作为一种用户友好的方式，你可以使用 `focus` 方法将光标放在需要完成的字段中。\n\n```\n1 function checkForLastName()\
    \ {\n2   if (document.getElementById(\"lastNameField\").value.length === 0) {\n\
    3     alert(\"Please enter your last name\");\n4     document.getElementById(\"\
    lastNameField\").focus();\n5     return false;\n6   }\n7 }\n```\n\n重复 `document.getElementById...`\
    \ 的写法相当笨拙，所以让我们把它放入一个变量中。\n\n```\n1 function checkForLastName() {\n2   var targetField\
    \ = document.getElementById(\"lastNameField\");\n3   if (targetField.value.length\
    \ === 0) {\n4     alert(\"Please enter your last name\");\n5     targetField.focus();\n\
    6     return false;\n7   }\n8 }\n```\n\n让我们再添加一个功能。我们将通过将需要完成的字段的背景色设置为黄色来引导用户的注意力。\n\
    \n这需要两个额外的语句。如果用户没有完成该字段，第 6 行将其背景色更改为黄色。在用户完成该字段后，当函数在用户后续提交时再次运行时，第 9 行将背景色恢复为白色。\n\
    \n```\n1  function checkForLastName() {\n2    var targetField = document.getElementById(\"\
    lastNameField\");\n3    if (targetField.value.length === 0) {\n4      alert(\"\
    Please enter your last name\");\n5      targetField.focus();\n6      targetField.style.background\
    \ = \"yellow\";\n7      return false;\n8    }\n9    targetField.style.background\
    \ = \"white\";\n10 }\n```\n\n![](img/00009.jpg)\n\n* 本章的示例代码通过 ID 定位表单和字段，这是最直接的方法。但你也可以通过名称、标签或\
    \ DOM 层次结构中的位置来定位。\n* 与其将 ID 硬编码到函数中，你可以通过将字段 ID 作为参数命名，并从调用代码中传递 ID 给它，从而使其可复用。\n\
    \n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/82.html`](http://www.ASmarterWayToLearn.com/javascript/82.html)\n\
    \n## 83\n\n### 表单验证：下拉菜单\n\n考虑一个带有选择州字段的表单。为了简单起见，我将州列表限制为仅 4 个。当用户点击“SELECT A\
    \ STATE”右侧的向上或向下箭头时，会下拉一个菜单。她从中选择一个州。\n\n但如果她忘记选择州会发生什么？\n\n以下是标记，为教学目的进行了简化。\n\
    \n```\n<form onSubmit=\"return checkForSelection();\">\n  <select id=\"states\"\
    >\n    <option value=\"\" selected=\"selected\">\n      SELECT A STATE</option>\n\
    \        <option value=\"AL\">Alabama</option>\n        <option value=\"AK\">Alaska</option>\n\
    \        <option value=\"AZ\">Arizona</option>\n        <option value=\"AR\">Arkansas</option>\n\
    \    </select>&nbsp;&nbsp;\n  <input type=\"submit\" value=\"Submit Form\">\n\
    </form>\n```\n\n当点击提交按钮时，会调用函数 `checkForSelection`。注意，关键字 `return` 再次出现在函数调用之前。\n\
    \n以下是该函数。\n\n```\n1 function checkForSelection() {\n2   if (document.getElementById(\"\
    states\").selectedIndex === 0) {\n3     alert(\"Please select a state.\");\n4\
    \     return false;\n5   }\n6 }\n```\n\n在函数中，如果 `selectedIndex` 为 0（第 2 行），则表示用户尚未做出选择。第\
    \ 3 行显示一个警告，要求她进行选择。第 4 行返回 `false`，取消表单提交。\n\n以下是该函数的修订版，有两种方式。首先，它接受元素 ID 作为参数，使其能够处理多个表单。其次，元素被赋值给一个变量。\n\
    \n```\n1 function checkForSelection(selecID) {\n2   var target = document.getElementById(selecID);\n\
    3   if (target.selectedIndex === 0) {\n4     alert(\"Please select a state.\"\
    );\n5     return false;\n6   }\n7 }\n```\n\n上面编码的函数需要事件处理程序将 ID 作为参数包含在内。\n\n\
    `<form onSubmit=\"return checkForSelection('states');\">`\n\n> 本章的交互式编程练习请访问：\n\
    > [`www.ASmarterWayToLearn.com/js/83.html`](http://www.ASmarterWayToLearn.com/javascript/83.html)\n\
    \n## 84\n\n### 表单验证：单选按钮\n\n让我们编写一个带有单选按钮组的表单。这些按钮是 Cat、Bat 和 Hat。\n\n以下是标记，为了让你专注于这里学习的内容而进行了简化。\n\
    \n```\n<form onSubmit=\"return validateRadios();\">\n<input type=\"radio\" name=\"\
    r1\" value=\"cat\"> Cat<br>\n<input type=\"radio\" name=\"r1\" value=\"bat\">\
    \ Bat<br>\n<input type=\"radio\" name=\"r1\" value=\"hat\"> Hat<br>\n  <input\
    \ type=\"submit\" value=\"Submit Form\">\n</form>\n```\n\n注意，所有单选按钮的名称相同，都是 `\"\
    r1\"`。\n\n这是验证函数，用于检查用户是否点击了其中一个按钮。\n\n```\n1  function validateRadios() {\n2\
    \    var radios = document.getElementsByName(\"r1\");\n3    for (var i = 0; i\
    \ < radios.length; i++) {\n4      if (radios[i].checked) {\n5        return true;\n\
    6      }\n7    }\n8    alert(\"Please check one.\");\n9    return false;\n10 }\n\
    ```\n\n"
