    # Learning Guidelines


    * Study, practice, then rest. If you''re intent on mastering the fundamentals
    of JavaScript, as opposed to just getting a feel for the language, work with this
    book and the online exercises in a 15-to-30-minute session, then take a break.
    Study a chapter for 5 to 10 minutes. Immediately go online at [http://www.ASmarterWayToLearn.com/js](http://www.ASmarterWayToLearn.com/js)
    and code for 10 to 20 minutes, practicing the lesson until you''ve coded everything
    correctly. Then go for a walk.

    * Use the largest, most colorful screen available. This book can be read on small
    phone screens and monochrome readers, but you''ll be happier if things appear
    in color on a larger screen. I use color as an important teaching tool, so if
    you''re reading in black-and-white, you''re sacrificing some of the extra teaching
    value of a full-color ebook. Colored elements do show up as a lighter shade on
    some black-and-white screens, and on those devices the effect isn''t entirely
    lost, but full color is better. As for reading on a larger screen— the book includes
    more than 2,000 lines of example code. Small screens break long lines of code
    into awkward, arbitrary segments, jumbling the formatting. While still decipherable,
    the code becomes harder to read. If you don''t have a mobile device that''s ideal
    for this book, consider installing the free Kindle reading app on your laptop.

    * If you''re reading on a mobile device, go horizontal. For some reason, I resist
    doing this on my iPad unless I''m watching a video. But even I, Vern Vertical,
    put my tablet into horizontal mode to proof this book. So please: starting with
    Chapter 1, do yourself a favor and rotate your tablet, reader, or phone to give
    yourself a longer line of text. It''ll help prevent the unpleasant code jumble
    mentioned above.

    * Do the coding exercises on a physical keyboard. A mobile device can be ideal
    for reading, but it''s no way to code. Very, very few Web developers would attempt
    to do their work on a phone. The same thing goes for learning to code. Theoretically,
    most of the interactive exercises could be done on a mobile device. But the idea
    seems so perverse that I''ve disabled online practice on tablets, readers, and
    phones. Read the book on your mobile device if you like. But practice on your
    laptop.

    * If you have an authority problem, try to get over it. When you start doing the
    exercises, you''ll find that I can be a pain about insisting that you get every
    little detail right. For example, if you indent a line one space instead of two
    spaces, the program monitoring your work will tell you the code isn''t correct,
    even though it would still run perfectly. Do I insist on having everything just
    so because I''m a control freak? No, it''s because I have to place a limit on
    harmless maverick behavior in order to automate the exercises. If I were to grant
    you as much freedom as you might like, creating the algorithms that check your
    work would be, for me, a project of driverless-car proportions. Besides, learning
    to write code with fastidious precision helps you learn to pay close attention
    to details, a fundamental requirement for coding in any language.

    * Subscribe, temporarily, to my formatting biases. Current code formatting is
    like seventeenth-century spelling. Everyone does it his own way. There are no
    universally accepted standards. But the algorithms that check your work when you
    do the interactive exercises need standards. They can''t grant you the latitude
    that a human teacher could, because, let''s face it, they aren''t that bright.
    So I''ve had to settle on certain conventions. All of the conventions I teach
    are embraced by a large segment of the coding community, so you''ll be in good
    company. But that doesn''t mean you''ll be married to my formatting biases forever.
    When you begin coding projects, you''ll soon develop your own opinions or join
    an organization that has a stylebook. Until then, I''ll ask you to make your code
    look like my code.

    * Email me with any problems or questions. The book and exercises have been tested
    on many learners, but haven''t been tested on you. If you hit a snag, if you''re
    just curious about something, or if I''ve found some way to give you fits, email
    me at mark@ASmarterWayToLearn.com. I''ll be happy to hear from you. I''ll reply
    promptly. And, with your help, I''ll probably learn something that improves the
    next edition.


    ## 1. Alerts


    An alert is a box that pops up to give the user a message. Here''s code for an
    alert that displays the message "Thanks for your input!"


    ```

    alert("Thanks for your input!");

    ```


    `alert` is a keyword—that is, a word that has special meaning for JavaScript.
    It means, "Display, in an alert box, the message that follows." Note that `alert`
    isn''t capitalized. If you capitalize it, the script will stop.


    The parentheses are a special requirement of JavaScript, one that you''ll soon
    get used to. You''ll be typing parens over and over again, in all kinds of JavaScript
    statements.


    In coding, the quoted text "Thanks for your input!" is called a text string or
    simply a string. The name makes sense: it''s a string of characters enclosed in
    quotes. Outside the coding world, we''d just call it a quotation.


    Note that the opening parenthesis is jammed up against the keyword, and the opening
    quotation mark is hugging the opening parenthesis. Since JavaScript ignores spaces
    (except in text strings), you could write...


    ```

    alert ( "Thanks for your input!" );

    ```


    But I want you to know the style conventions of JavaScript, so I''ll ask you to
    always omit spaces before and after parentheses.


    In English, a careful writer ends every declarative sentence with a period. In
    scripting, a careful coder ends every statement with a semicolon. (Sometimes complex,
    paragraph-like statements end with a curly bracket instead of a semicolon. That''s
    something I''ll cover in a later chapter.) A semicolon isn''t always necessary,
    but it''s easier to end every statement with a semicolon, rather than stop to
    figure out whether you need one. In this training, I''ll ask you to end every
    statement (that doesn''t end with a curly bracket) with a semicolon.


    ![](images/00009.jpg)


    * Some coders write `window.alert` instead of, simply, `alert`. This is a highly
    formal but perfectly correct way to write it. Most coders prefer the short form.
    We''ll stick to the short form in this training.

    * In the example above, some coders would use single rather than double quotation
    marks. This is legal, as long as it''s a matching pair. But in a case like this,
    I''ll ask you to use double quotation marks.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/1.html](http://www.ASmarterWayToLearn.com/javascript/1.html)


    ## 2. Variables for Strings


    Please memorize the following facts.


    * My name is Mark.

    * My nationality is U.S.


    Now that you''ve memorized my name and nationality, I won''t have to repeat them,
    literally, again. If I say to you, "You probably know other people who have my
    name," you''ll know I''m referring to "Mark."


    If I ask you whether my nationality is the same as yours, I won''t have to ask,
    "Is your nationality the same as U.S.?" I''ll ask, "Is your nationality the same
    as my nationality?" You''ll remember that when I say "my nationality," I''m referring
    to "U.S.", and you''ll compare your nationality to "U.S.", even though I haven''t
    said "U.S." explicitly.


    In these examples, the terms "my name" and "my nationality" work the same way
    JavaScript variables do. My name is a term that refers to a particular value,
    "Mark." In the same way, a variable is a word that refers to a particular value.


    A variable is created when you write `var` (for variable) followed by the name
    that you choose to give it. It takes on a particular value when you assign the
    value to it. This is a JavaScript statement that creates the variable `name` and
    assigns the value "Mark" to it.


    ```

    var name = "Mark";

    ```


    Now the variable `name` refers to the text string "Mark".

