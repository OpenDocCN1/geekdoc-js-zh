    ## 51 Reading and setting paragraph text


    Your webpage initially displays a picture of a little mammal known as the slow
    loris, along with a single sentence:


    > Slow lorises are a group of several species of strepsirrhine primates which
    make up the genus Nycticebus. Click for more.


    When the user clicks the link, the paragraph expands:


    > Slow lorises are a group of several species of strepsirrhine primates which
    make up the genus Nycticebus. They have a round head, narrow snout, large eyes,
    and a variety of distinctive coloration patterns that are species-dependent. The
    hands and feet of slow lorises have several adaptations that give them a pincer-like
    grip and enable them to grasp branches for long periods of time. Slow lorises
    have a toxic bite, a rare trait among mammals.


    This is the markup.


    ```

    <p id="slowLoris">

    Slow lorises are a group of several species of strepsirrhine primates which make
    up the genus Nycticebus. <a href="javascript:void(0);" onClick="expandLoris();"><em>Click
    for more.</em></a>

    </p>

    ```


    An `id` is assigned to the paragraph, which will be used by the function. When
    the user clicks the link, a function, `expandLoris`, is called.


    This is the function.


    ```

    1 function expandLoris() {

    2   var expandedParagraph = "Slow lorises are a group of several species of trepsirrhine
    primates which make up the genus Nycticebus. They have a round head, narrow snout,
    large eyes, and a variety of distinctive coloration patterns that are species-dependent.
    The hands and feet of slow lorises have several adaptations that give them a pincer-like
    grip and enable them to grasp branches for long periods of time. Slow lorises
    have a toxic bite, a rare trait among mammals.";

    3   document.getElementById("slowLoris").innerHTML = expandedParagraph;

    4 }

    ```


    Line 2 assigns the long version of the text to a variable. Then, identifying the
    paragraph by its `id`, line 3 replaces the original content, the `innerHTML`,
    with the text stored in the variable.


    Almost anything, including HTML tags, can be inserted into the web page this way.
    For example, you could make this list appear on the page within, say, a `div`
    with the `id` "lorisList".


    1. Slow loris

    2. Fast loris

    3. Just-right loris


    This is the function that loads the list markup into the `div`, which has been
    given an `id` of "lorisList".


    ```

    1 function placeAList() {

    2   var listToPlace = "<ol><li>Slow loris</li><li>Fast loris</li><li>Just-right
    loris</li></ol>";

    3   document.getElementById("lorisList").innerHTML = listToPlace;

    4 }

    ```


    Line 2 assigns all the HTML for the list to a variable. Line 3 places the HTML
    into the `div` that has been assigned the `id` "lorisList".


    You can use `document.getElementById(element id).innerHTML` to read as well as
    "write" the contents of an element. For example, this function assigns whatever
    is in the paragraph, `div`, or other element with the `id` "content" to the variable
    `whatsThere`.


    ```

    1 function peekAtContent() {

    2   var whatsThere = document.getElementById("content").innerHTML;

    3 }

    ```


    Line 2 reads all the HTML within the element with an `id` of "content" and assigns
    it to the variable `whatsThere`. If the element is, for example, a paragraph whose
    content is "<em>Hello, Sailor!</em>" the variable `whatsThere` captures "<em>Hello,
    Sailor!</em>"


