- fmt: "\n> Find the interactive coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/66.html](http://www.ASmarterWayToLearn.com/javascript/66.html)\n\
    \n# 67 The DOM: Adding nodes\n\nUsing the DOM hierarchy, you can add element,\
    \ attribute, and text nodes anywhere in the head or body sections of a document.\
    \ In this chapter you'll learn how to create a paragraph node, give it an attribute,\
    \ and fill it with text content. In the next chapter, you'll learn how to insert\
    \ the paragraph, along with its attributes and text content, into the page.\n\n\
    The first step is to create the paragraph node.\n\n```\nvar nodeToAdd = document.createElement(\"\
    p\");\n```\n\nThe example creates a paragraph element. To create a `div` element,\
    \ you'd put `\"div\"` in the parentheses. To create an image element, you'd put\
    \ `\"img\"` there. To create a link, you'd put `\"a\"` there. And so on.\n\nHere's\
    \ a statement that creates an image element.\n\n```\nvar imgNodeToAdd = document.createElement(\"\
    img\");\n```\n\nIn the last chapter, you learned how to add an attribute to an\
    \ element that's already part of the web page, using `setAttribute`. You can do\
    \ the same thing with an element that you've created but haven't yet placed in\
    \ the document body.\n\n```\nnodeToAdd.setAttribute(\"class\", \"regular\");\n\
    ```\n\nThe code above gives the new paragraph element that you just created the\
    \ class `\"regular\"`. If you wanted to, you could add, using separate statements\
    \ for each, more attributes to the paragraph element—for example, a `span`, a\
    \ `style`, even an `id`.\n\nIf the element were an `<img>` element, you could\
    \ add a `border` or an `alt` as an attribute. If it were an `<a>` element, you\
    \ could add the web address.\n\nThis statement adds a `border` attribute to an\
    \ image element.\n\n```\nimgNodeToAdd.setAttribute(\"border\", \"1\");\n```\n\n\
    The code above gives the image a 1-pixel border.\n\nRemember, at this point, we're\
    \ just creating nodes. The new attribute node has been connected to the new element\
    \ node, but we haven't added the nodes to the page yet.\n\nGetting back to the\
    \ paragraph element, we've created it and added a `class` attribute to it. Now\
    \ let's give it some text content. Again, we begin by creating the node we want.\n\
    \n```\nvar newTxt = document.createTextNode(\"Hello!\");\n```\n\nThe statement\
    \ above creates a text node with the content `\"Hello!\"`.\n\nNext, we place the\
    \ text into the paragraph element.\n\n```\nnodeToAdd.appendChild(newTxt);\n```\n\
    \nThe statement above adds the new text node, whose content is `\"Hello!\"`, to\
    \ the new paragraph node.\n\nNow we have a new paragraph node with a `class` attribute\
    \ and some text content. We're ready to insert it into the page.\n\n> Find the\
    \ interactive coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/67.html](http://www.ASmarterWayToLearn.com/javascript/67.html)\n\
    \n# 68 The DOM: Inserting nodes\n\nIn the last chapter you learned how to add\
    \ text content to an element by first creating a text node and then appending\
    \ the node to the element with `appendChild`. You can of course use the same method\
    \ to append the paragraph element itself, filled with content or not, to a parent\
    \ node, for example the body or a `div`. This set of statements targets a `div`\
    \ (line 1), creates a new paragraph element (line 2), creates the text to go in\
    \ it (line 3), places the text into the paragraph (line 4) and then appends the\
    \ paragraph element along with its text content to the targeted `div` (line 5).\n\
    \n```\n1 var parentDiv = document.getElementById(\"div1\");\n2 var newParagraph\
    \ = document.createElement(\"p\");\n3 var t = document.createTextNode(\"Hello\
    \ world!\");\n4 newParagraph.appendChild(t);\n5 parentDiv.appendChild(newParagraph);\n\
    ```\n\nWhen you add a node to your web page by appending it as a child to a parent,\
    \ as I did in the example above, the limitation is that you have no control over\
    \ where the new element lands among the parent's children. JavaScript always places\
    \ it at the end. So for example, if the `div` in the example above already has\
    \ three paragraphs, the new paragraph will become the fourth one, even if you'd\
    \ like to place it in a higher position.\n\nThe solution is `insertBefore`.\n\n\
    For example, suppose you want the paragraph to be the first one in the `div`,\
    \ rather than the last.\n\n```\n1 var parentDiv = document.getElementById(\"div1\"\
    );\n2 var newParagraph = document.createElement(\"p\");\n3 var t = document.createTextNode(\"\
    Hello world!\");\n4 newParagraph.appendChild(t);\n5 paragraph1 = parentDiv.firstChild;\n\
    6 parentDiv.insertBefore(newParagraph, paragraph1);\n```\n\nThe example above\
    \ selects one of the children of the parent element as the target (line 5), and\
    \ tells JavaScript to insert the new element and its text content before that\
    \ element (line 6).\n\nThere is no `insertAfter` method as such. But you can still\
    \ do it. Simply `insertBefore` the target node's next sibling.\n\n```\n1 var target\
    \ = parentDiv.childNodes[1];\n2 parentDiv.insertBefore(newE, target.nextSibling);\n\
    ```\n\nBy inserting the new node before the next sibling of the second child,\
    \ you insert the new node after the second child.\n\nTo remove a node, use `removeChild`.\n\
    \n```\n1 var parentDiv = document.getElementById(\"div1\");\n2 var nodeToRemove\
    \ = parentDiv.childNodes[2];\n3 parentDiv.removeChild(nodeToRemove);\n```\n\n\
    > Find the interactive coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/68.html](http://www.ASmarterWayToLearn.com/javascript/68.html)\n\
    \n# 69 Objects\n\nI'm sure you've seen tables like this, comparing different packages\
    \ offered by a webhost.\n\n![](images/00004.jpg)\n\nIf you wanted to use this\
    \ data in JavaScript, you could assign each value to a different variable, like\
    \ this.\n\n```\n1  var plan1Name = \"Basic\";\n2  var plan1Price = 3.99;\n3  var\
    \ plan1Space = 100;\n4  var plan1Data = 1000;\n5  var plan1Pages = 10;\n6  var\
    \ plan2Name = \"Professional\";\n7  var plan2Price = 5.99;\n8  var plan2Space\
    \ = 500;\n9  var plan2Data = 5000;\n10 var plan2Pages = 50;\n11 var plan3Name\
    \ = \"Ultimate\";\n12 var plan3Price = 9.99;\n13 var plan3Space = 2000;\n14 var\
    \ plan3Data = 20000;\n15 var plan3Pages = 500;\n```\n\nHaving made all these variable\
    \ assignments, you could then, for example, write this JavaScript statement...\n\
    \n```\nalert(\"The cost of the \" + plan2Name + \" package is $\" + plan2Price\
    \ + \" per month.\");\n```\n\n...and an alert would display saying, \"The cost\
    \ of the Professional package is $5.99 per month.\"\n\nBut assigning all these\
    \ values to variables is unwieldy, and can lead to problems if things get complicated.\
    \ A better way to handle the situation is to create objects with properties. This\
    \ is a handier scheme that more accurately reflects the 2-dimensional, gridlike\
    \ nature of the host company's table that we started with. This table shows all\
    \ the options expressed as objects and properties.\n\n![](images/00008.jpg)\n\n\
    In this example, each hosting plan is an object—`plan1`, `plan2`, `plan3`. And\
    \ each object has 5 properties—`name`, `cost`, `space`, `transfer`, and `pages`.\
    \ Properties are just variables that are attached to an object. In this case,\
    \ there's a string property (`name`) and four number properties (`price`, `space`,\
    \ `transfer`, and `pages`) for each object.\n\nIn code we refer to objects and\
    \ their properties using dot notation. Here's the statement that creates the alert\
    \ shown above, with object-property pairs replacing the simple variables.\n\n\
    ```\nalert(\"The cost of the \" + plan2.name + \" package is $\" + plan2.price\
    \ + \" per month.\");\n```\n\n`plan2.name` represents `\"Professional\"`. `plan2.price`\
    \ represents `5.99`.\n\nThe most straightforward way to define an object and its\
    \ properties is this.\n\n```\n1 var plan1 = {\n2   name: \"Basic\",\n3   price:\
    \ 3.99,\n4   space: 100,\n5   transfer: 1000,\n6   pages: 10\n7 };\n```\n\nThings\
    \ to notice:\n\n*   The code begins like any variable definition, with the keyword\
    \ `var`, followed by the object name, and then an equal sign.\n*   But then, instead\
    \ of a value, there's a curly bracket, whose twin comes at the end of the block.\n"
  raw: '> Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/66.html](http://www.ASmarterWayToLearn.com/javascript/66.html)


    67


    The DOM:


    Adding nodes


    Using the DOM hierarchy, you can add element, attribute, and text nodes anywhere
    in the head or body sections of a document. In this chapter you''ll learn how
    to create a paragraph node, give it an attribute, and fill it with text content.
    In the next chapter, you''ll learn how to insert the paragraph, along with its
    attributes and text content, into the page.


    The first step is to create the paragraph node.


    `var nodeToAdd = document.``createElement("p")``;`


    The example creates a paragraph element. To create a div element, you''d put "div"
    in the parentheses. To create an image element, you''d put "img" there. To create
    a link, you''d put "a" there. And so on.


    Here''s a statement that creates an image element.


    `var imgNodeToAdd = document.createElement(``"img"``);`


    In the last chapter, you learned how to add an attribute to an element that''s
    already part of the web page, using `setAttribute`. You can do the same thing
    with an element that you''ve created but haven''t yet placed in the document body.


    `nodeToAdd.``setAttribute``("class", "regular");`


    The code above gives the new paragraph element that you just created the class
    "regular". If you wanted to, you could add, using separate statements for each,
    more attributes to the paragraph element—for example, a span, a style, even an
    id.


    If the element were an `<img>` element, you could add a border or an alt as an
    attribute. If it were an `<a>` element, you could add the web address.


    This statement adds a border attribute to an image element.


    `imgNodeToAdd.setAttribute(``"border", "1"``);`


    The code above gives the image a 1-pixel border.


    Remember, at this point, we''re just creating nodes. The new attribute node has
    been connected to the new element node, but we haven''t added the nodes to the
    page yet.


    Getting back to the paragraph element, we''ve created it and added a class attribute
    to it. Now let''s give it some text content. Again, we begin by creating the node
    we want.


    `var newTxt = document.``createTextNode``("Hello!");`


    The statement above creates a text node with the content "Hello!"


    Next, we place the text into the paragraph element.


    `nodeToAdd.``appendChild``(newTxt);`


    The statement above adds the new text node, whose content is "Hello!", to the
    new paragraph node.


    Now we have a new paragraph node with a class attribute and some text content.
    We''re ready to insert it into the page.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/67.html](http://www.ASmarterWayToLearn.com/javascript/67.html)


    68


    The DOM:


    Inserting nodes


    In the last chapter you learned how to add text content to an element by first
    creating a text node and then appending the node to the element with `appendChild`.
    You can of course use the same method to append the paragraph element itself,
    filled with content or not, to a parent node, for example the body or a div. This
    set of statements targets a div (line 1), creates a new paragraph element (line
    2), creates the text to go in it (line 3), places the text into the paragraph
    (line 4) and then appends the paragraph element along with its text content to
    the targeted div (line 5).


    `1 var parentDiv = document.getElementById("div1");`


    `2 var newParagraph = document.createElement("p");`


    `3 var t = document.createTextNode("Hello world!");`


    `4 newParagraph.appendChild(t);`


    `5` `parentDiv.appendChild(newParagraph);`


    When you add a node to your web page by appending it as a child to a parent, as
    I did in the example above, the limitation is that you have no control over where
    the new element lands among the parent''s children. JavaScript always places it
    at the end. So for example, if the div in the example above already has three
    paragraphs, the new paragraph will become the fourth one, even if you''d like
    to place it in a higher position.


    The solution is `insertBefore`.


    For example, suppose you want the paragraph to be the first one in the div, rather
    than the last.


    `1 var parentDiv = document.getElementById("div1");`


    `2 var newParagraph = document.createElement("p");`


    `3 var t = document.createTextNode("Hello world!");`


    `4 newParagraph.appendChild(t);`


    `5` `paragraph1 = parentDiv.firstChild;`


    `6` `parentDiv.insertBefore(newParagraph, paragraph1);`


    The example above selects one of the children of the parent element as the target
    (line 5), and tells JavaScript to insert the new element and its text content
    before that element (line 6).


    There is no `insertAfter` method as such. But you can still do it. Simply `insertBefore`
    the target node''s next sibling.


    `1 var target = parentDiv.childNodes[1];`


    `2 parentDiv.insertBefore(newE,` `target.nextSibling``);`


    By inserting the new node before the next sibling of the second child, you insert
    the new node after the second child.


    To remove a node, use `removeChild`.


    `1 var parentDiv = document.getElementById("div1");`


    `2 var nodeToRemove = parentDiv.childNodes[2];`


    `3 parentDiv.``removeChild``(nodeToRemove);`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/68.html](http://www.ASmarterWayToLearn.com/javascript/68.html)


    69


    Objects


    I''m sure you''ve seen tables like this, comparing different packages offered
    by a webhost.


    ![](images/00004.jpg)


    If you wanted to use this data in JavaScript, you could assign each value to a
    different variable, like this.


    `1  var plan1Name = "Basic";`


    `2  var plan1Price = 3.99;`


    `3  var plan1Space = 100;`


    `4  var plan1Data = 1000;`


    `5  var plan1Pages = 10;`


    `6  var plan2Name = "Professional";`


    `7  var plan2Price = 5.99;`


    `8  var plan2Space = 500;`


    `9  var plan2Data = 5000;`


    `10 var plan2Pages = 50;`


    `11 var plan3Name = "Ultimate";`


    `12 var plan3Price = 9.99;`


    `13 var plan3Space = 2000;`


    `14 var plan3Data = 20000;`


    `15 var plan3Pages = 500;`


    Having made all these variable assignments, you could then, for example, write
    this JavaScript statement...


    `alert("The cost of the " + plan2Name + "package is $" + plan2Price + " per month.");`


    ...and an alert would display saying, "The cost of the Professional package is
    $5.99 per month."


    But assigning all these values to variables is unwieldy, and can lead to problems
    if things get complicated. A better way to handle the situation is to create objects
    with properties. This is a handier scheme that more accurately reflects the 2-dimensional,
    gridlike nature of the host company''s table that we started with. This table
    shows all the options expressed as objects and properties.


    ![](images/00008.jpg)


    In this example, each hosting plan is an object—plan1, plan2, plan3. And each
    object has 5 properties—name, cost, space, transfer, and pages. Properties are
    just variables that are attached to an object. In this case, there''s a string
    property (name) and four number properties (price, space, transfer, and pages)
    for each object.


    In code we refer to objects and their properties using dot notation. Here''s the
    statement that creates the alert shown above, with object-property pairs replacing
    the simple variables.


    `alert("The cost of the " +` `plan2.name` `+ " package is $" +` `plan2.price`
    `+ " per month.");`


    `plan2.name` represents "Professional". `plan2.price` represents 5.99.


    The most straightforward way to define an object and its properties is this.


    `1 var plan1 =` `{`


    `2   name``:` `"Basic"``,`


    `3   price``:` `3.99``,`


    `4   space``:` `100``,`


    `5   transfer``:` `1000``,`


    `6   pages``:` `10`


    `7 }``;`


    Things to notice:


    *   The code begins like any variable definition, with the keyword `var`, followed
    by the object name, and then an equal sign.


    *   But then, instead of a value, there''s a curly bracket, whose twin comes at
    the end of the block.'
