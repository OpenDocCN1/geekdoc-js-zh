    如果你需要将 `Date` 对象转换为字符串，可以像将数字转换为字符串一样进行转换。


    ```

    var dateString = rightNow.toString();

    ```


    上述代码将变量 `rightNow` 所代表的 `Date` 对象转换为字符串，并将该字符串赋值给变量 `dateString`。


    大多数情况下，你只想从 `Date` 对象中提取部分信息，而不将其转换为字符串。


    我将向你展示如何提取 `Date` 对象的各个部分。在本章中，我将带你了解第一个部分。下一章将介绍其余部分。


    以下代码创建一个新的 `Date` 对象，将其赋值给变量 `rightNow`，提取星期几，并将星期几赋值给变量 `theDay`。


    ```

    1 var rightNow = new Date();

    2 var theDay = rightNow.getDay();

    ```


    在我之前展示的 `Date` 对象示意图中，星期几表示为“Mon”。但当你从对象中提取星期几时，它是以数字形式表示的。星期几用数字表示，从 0（星期日）到
    6（星期六）。这意味着你需要一些代码将其转换回像“Mon”这样的星期名称。


    ```

    1 var dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    2 var now = new Date();

    3 var theDay = now.getDay();

    4 var nameOfToday = dayNames[theDay];

    ```


    以下是代码说明：


    1.  创建一个以“Sun”开头的星期数组，并将其赋值给 `dayNames`。

    2.  创建一个新的 `Date` 对象，并将其赋值给 `now`。

    3.  以数字形式提取星期几，并将其赋值给 `theDay`。

    4.  使用星期数字作为索引，指定正确的数组元素，即星期名称。


