    \n## 82\n\n### Form validation: text fields\n\nIs the user filling out your forms\
    \ correctly? JavaScript helps you find out—that is, helps you validate your form.\
    \ With form validation, if there's a problem, you can ask the user to try again.\
    \ To begin with, if you have a required field, you can check to see if the user\
    \ has entered something in it. Let's start with a simple form that asks the user\
    \ to enter her last name.\n\nHere's some markup for the form. I'm omitting lots\
    \ of things, including styling stuff, to keep you focused on what's important\
    \ to learn here.\n\n```\n<form onSubmit=\"return checkForLastName();\">\n  Please\
    \ enter your last name.<br>\n  <input type=\"text\" id=\"lastNameField\">\n  <input\
    \ type=\"submit\" value=\"Submit Form\">\n</form>\n```\n\nWhen the user clicks\
    \ the Submit button, the function `checkForLastName` is called.\n\nHere's the\
    \ function.\n\n```\n1 function checkForLastName() {\n2   if (document.getElementById(\"\
    lastNameField\").value.length === 0) {\n3     alert(\"Please enter your last name\"\
    );\n4     return false;\n5   }\n6 }\n```\n\nLine 2 asks whether the length of\
    \ the value found in the field with the id `\"lastNameField\"` is 0. That is,\
    \ is nothing entered there? If so, an alert displays asking the user to enter\
    \ her name. And then in line 4 something else happens. The Boolean value `false`\
    \ is returned to the calling code. This prevents the form from being submitted.\
    \ In order for the submission to be called off, there has to be a matching keyword\
    \ `return` in the markup that calls the function. Without this `return` in the\
    \ calling code, the `return` in line 4 of the function won't stop the form from\
    \ being submitted.\n\n`<form onSubmit=\"return checkForLastName();\">`\n\nAs a\
    \ user-friendly touch, you can use the `focus` method to place the cursor in the\
    \ field that needs to be completed.\n\n```\n1 function checkForLastName() {\n\
    2   if (document.getElementById(\"lastNameField\").value.length === 0) {\n3  \
    \   alert(\"Please enter your last name\");\n4     document.getElementById(\"\
    lastNameField\").focus();\n5     return false;\n6   }\n7 }\n```\n\nRepeating the\
    \ `document.getElementById...` designation gets pretty unwieldy, so let's put\
    \ it into a variable.\n\n```\n1 function checkForLastName() {\n2   var targetField\
    \ = document.getElementById(\"lastNameField\");\n3   if (targetField.value.length\
    \ === 0) {\n4     alert(\"Please enter your last name\");\n5     targetField.focus();\n\
    6     return false;\n7   }\n8 }\n```\n\nLet's add one more feature. We'll direct\
    \ the user's attention to the field that needs to be completed by giving it a\
