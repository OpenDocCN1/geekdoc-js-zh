    # 学习指南


    * 学习、练习，然后休息。如果你想要掌握 JavaScript 的基础知识，而不仅仅是感受这门语言，请以 15 到 30 分钟为一个单元，配合本书和在线练习进行学习，然后休息一下。先花
    5 到 10 分钟学习一个章节，然后立即前往 [`www.ASmarterWayToLearn.com/js`](http://www.ASmarterWayToLearn.com/js)
    在线编码 10 到 20 分钟，练习该课内容，直到你正确完成所有代码。之后去散散步。

    * 使用最大、最色彩丰富的屏幕。本书可以在小手机屏幕和单色阅读器上阅读，但如果你能在更大的屏幕上看到彩色内容，体验会更好。我将颜色作为重要的教学工具，因此如果你在黑白模式下阅读，就会失去全彩电子书的一些额外教学价值。彩色元素在某些黑白屏幕上会显示为较浅的色调，在这些设备上效果不会完全丢失，但全彩效果更佳。至于在大屏幕上阅读——本书包含超过
    2000 行示例代码。小屏幕会将长代码行分割成尴尬、随意的片段，打乱格式。虽然仍可辨认，但代码变得更难阅读。如果你的移动设备不适合阅读本书，可以考虑在笔记本电脑上安装免费的
    Kindle 阅读应用。

    * 如果在移动设备上阅读，请横屏。出于某种原因，我在 iPad 上除非看视频，否则不愿意这样做。但就连我——竖屏狂魔——在校对本书时也会把平板横过来。所以请从第
    1 章开始，帮自己一个忙，旋转你的平板、阅读器或手机，让文本行更长一些。这有助于避免上面提到的令人不快的代码混乱。

    * 在实体键盘上完成编码练习。移动设备可能适合阅读，但绝不适合编码。极少数 Web 开发者会尝试在手机上工作。学习编码也是如此。理论上，大多数交互式练习可以在移动设备上完成。但这个想法似乎太离谱了，所以我禁用了平板、阅读器和手机上的在线练习。你可以在移动设备上阅读本书，但请在笔记本电脑上练习。

    * 如果你有权威问题，请尽量克服。当你开始做练习时，你会发现我可能会在坚持让你把每个小细节都做对这件事上很烦人。例如，如果你缩进一行时只空了一个空格而不是两个，监控你工作的程序会告诉你代码不正确，尽管它仍然可以完美运行。我坚持一切都必须如此是因为我是个控制狂吗？不，是因为我必须限制无害的另类行为，以便实现练习的自动化。如果我给你你想要的那么多自由，那么创建检查你工作的算法对我来说将是一个无人驾驶汽车级别的项目。此外，学会以一丝不苟的精确度编写代码有助于你学会密切关注细节，这是任何语言编码的基本要求。

