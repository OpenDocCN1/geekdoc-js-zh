    Form validation: text fields


    Is the user filling out your forms correctly? JavaScript helps you find out—that
    is, helps you validate your form. With form validation, if there''s a problem,
    you can ask the user to try again. To begin with, if you have a required field,
    you can check to see if the user has entered something in it. Let''s start with
    a simple form that asks the user to enter her last name.


    Here''s some markup for the form. I''m omitting lots of things, including styling
    stuff, to keep you focused on what''s important to learn here.


    `<form onSubmit="return checkForLastName();">`


    `  Please enter your last name.<br>`


    `  <input type="text" id="lastNameField">`


    `  <input type="submit" value="Submit Form">`


    `</form>`


    When the user clicks the Submit button, the function `checkForLastName` is called.


    Here''s the function.


    `1 function checkForLastName() {`


    `2   if (document.getElementById("lastNameField").value.length === 0) {`


    `3     alert("Please enter your last name");`


    `4     return false;`


    `5   }`


    `6 }`


    Line 2 asks whether the length of the value found in the field with the id "lastNameField"
    is 0\. That is, is nothing entered there? If so, an alert displays asking the
    user to enter her name. And then in line 4 something else happens. The Boolean
    value `false` is returned to the calling code. This prevents the form from being
    submitted. In order for the submission to be called off, there has to be a matching
    keyword `return` in the markup that calls the function. Without this `return`
    in the calling code, the `return` in line 4 of the function won''t stop the form
    from being submitted.


    `<form onSubmit="``return` `checkForLastName();">`


    As a user-friendly touch, you can use the `focus` method to place the cursor in
    the field that needs to be completed.


    `1 function checkForLastName() {`


    `2   if (document.getElementById("lastNameField").value.length === 0) {`


    `3     alert("Please enter your last name");`


    `4     ``document.getElementById("lastNameField").focus();`


    `5     return false;`


    `6   }`


    `7 }`


    Repeating the `document.getElementId...` designation gets pretty unwieldy, so
    let''s put it into a variable.


    `1 function checkForLastName() {`


    `2 var` `targetField = document.getElementById("lastNameField");`


    `3   if (``targetField``.value.length === 0) {`


    `4     alert("Please enter your last name");`


    `5     ``targetField``.focus();`


    `6     return false;`


    `7   }`


    `8 }`


    Let''s add one more feature. We''ll direct the user''s attention to the field
    that needs to be completed by giving it a yellow background color.


    This requires two additional statements. If the user hasn''t completed the field,
    line 6 changes its background color to yellow. After the user completes the field,
    line 9 restores the background color to white when the function runs again on
    the user''s subsequent submission.


    `1  function checkForLastName() {`


    `2    var targetField = document.getElementById("lastNameField");`


    `3    if (targetField.value.length === 0) {`


    `4      alert("Please enter your last name");`


    `5      targetField.focus();`


    `6      ``targetField.style.background = "yellow";`


    `7      return false;`


    `8    }`


    `9    ``targetField.style.background = "white";`


    `10 }`


    ![](images/00009.jpg)


    *   The sample code in this chapter targets forms and fields by ID, which is the
    most straightforward approach. But you could target by name, by tag, or by position
    in the DOM hierarchy.


    *   Instead of hard-wiring the ID into the function, you could potentially make
    it multi-use by naming the field ID as a parameter, and passing the ID to it from
    the calling code.


