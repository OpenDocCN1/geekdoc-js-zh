  trans: "\n\n## 数组操作：splice 和 slice\n\n使用 `splice` 方法可以在数组的任意位置插入一个或多个元素，同时可以选择删除其后的一个或多个元素。假设你有一个包含元素\
    \ \"dog\"、\"cat\"、\"fly\"、\"bug\"、\"ox\" 的数组。以下代码在 \"cat\" 之后添加 \"pig\"、\"duck\"\
    \ 和 \"emu\"，同时删除 \"fly\" 和 \"bug\"。\n\n```javascript\npets.splice(2, 2, \"pig\"\
    , \"duck\", \"emu\");\n```\n\n括号内的第一个数字是你要开始添加（如果要添加）或删除（如果要删除）的位置的索引。第二个数字是要删除的现有元素的数量，从你插入的元素之后的第一个元素开始。上面的代码会得到一个由\
    \ \"dog\"、\"cat\"、\"pig\"、\"duck\"、\"emu\" 和 \"ox\" 组成的数组。\n\n你也可以只添加而不删除任何元素。以下代码添加\
    \ \"pig\"、\"duck\" 和 \"emu\"，但不删除任何元素。\n\n```javascript\npets.splice(2, 0, \"\
    pig\", \"duck\", \"emu\");\n```\n\n你也可以只删除元素而不添加任何元素。如果你从元素 \"dog\"、\"cat\"、\"\
    fly\"、\"bug\" 和 \"ox\" 开始，以下代码从索引 3 开始删除两个元素——\"bug\" 和 \"ox\"。这样会剩下 \"dog\"、\"\
    cat\" 和 \"fly\"。\n\n```javascript\npets.splice(2, 2);\n```\n\n使用 `slice` 方法可以复制任意位置的一个或多个连续元素，并将它们放入一个新数组。如果你从一个包含\
    \ \"dog\"、\"cat\"、\"fly\"、\"bug\" 和 \"ox\" 的数组 `pets` 开始，以下代码将 \"fly\" 和 \"bug\"\
    \ 复制到新数组 `noPets` 中，并保持原数组 `pets` 不变。\n\n```javascript\nvar noPets = pets.slice(2,\
    \ 4);\n```\n\n括号内的第一个数字是要复制的第一个元素的索引。第二个数字是要复制的最后一个元素之后的那个元素的索引。\n\n有两件事可能会让你困惑：\n\
    \n* 由于括号内的第一个索引数字指定了要复制的第一个元素，你可能会认为第二个索引数字指定了要复制的最后一个元素。实际上，第二个数字指定的是要复制的最后一个元素之后的那个元素的索引。\n\
    * 你必须将切片后的元素赋值给一个数组。当然，这个数组可以是进行切片的原数组。在这种情况下，你会将原数组缩减为仅包含被复制的元素。\n\n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/17.html`](http://www.ASmarterWayToLearn.com/javascript/17.html)\n\
    \n## For 循环\n\n你知道《墙上有 99 瓶啤酒》这首歌吗？如果你要教别人唱这首歌，你可以给出这样的指令：\n\n1. 唱“墙上有 99 瓶啤酒，99\
    \ 瓶啤酒。”\n2. 唱“拿下一瓶传一圈，墙上有 98 瓶啤酒。”\n3. 唱“墙上有 98 瓶啤酒，98 瓶啤酒。”\n4. 唱“拿下一瓶传一圈，墙上有\
    \ 97 瓶啤酒。”\n5. 唱“墙上有 97 瓶啤酒，97 瓶啤酒。”\n6. 唱“拿下一瓶传一圈，墙上有 96 瓶啤酒。”\n\n……以此类推，还有 192\
    \ 行指令。\n\n但这不是你给出指令的方式，对吧？你会更简洁。你会这样说：\n\n唱“墙上有 99 瓶啤酒，99 瓶啤酒。拿下一瓶传一圈，墙上有 98 瓶啤酒。”重复此过程，每次减\
    \ 1，直到墙上没有啤酒瓶为止。\n\n在编程中，你经常会遇到类似啤酒瓶的情况。例如，假设你主动提出要检查用户所在的城市是否是美国最干净的 5 个城市之一。用户输入了她的城市，你将她的城市赋值给变量\
    \ `cityToCheck`。\n\n你已经将最干净的 5 个城市的列表赋值给了数组 `cleanestCities`。\n\n```javascript\n\
    var cleanestCities = [\"Cheyenne\", \"Santa Fe\", \"Tucson\", \"Great Falls\"\
    , \"Honolulu\"];\n```\n\n现在你遍历数组，看看是否与用户的城市匹配。如果匹配，你显示一个警告框，告诉用户她的城市是最干净的城市之一。如果没有匹配，你显示一个警告框，告诉用户她的城市不在列表中。\n\
    \n```javascript\nif (cityToCheck === cleanestCities[0]) {\n    alert(\"It's one\
    \ of the cleanest cities\");\n}\nelse if (cityToCheck === cleanestCities[1]) {\n\
    \    alert(\"It's one of the cleanest cities\");\n}\nelse if (cityToCheck ===\
    \ cleanestCities[2]) {\n    alert(\"It's one of the cleanest cities\");\n}\nelse\
    \ if (cityToCheck === cleanestCities[3]) {\n    alert(\"It's one of the cleanest\
    \ cities\");\n}\nelse if (cityToCheck === cleanestCities[4]) {\n    alert(\"It's\
    \ one of the cleanest cities\");\n}\nelse {\n    alert(\"It's not on the list\"\
    );\n}\n```\n\n方便的是，JavaScript 提供了一种更简洁的编码方式。下面是一个 `for` 循环，它完成了上面冗长代码的大部分功能。\n\
    \n```javascript\nfor (var i = 0; i <= 4; i++) {\n    if (cityToCheck === cleanestCities[i])\
    \ {\n        alert(\"It's one of the cleanest cities\");\n    }\n}\n```\n\n让我为你分解第一行。第一行以关键字\
    \ `for` 开头。定义循环的三个规范位于括号内。\n\n1. 声明一个变量，用于计数迭代次数，同时也作为变化的数组索引，并将其设置为起始值，本例中为 `0`。\n\
    2. 定义循环的限制。在本例中，只要计数器不超过 `4`，循环就继续运行。由于本例中计数器从 `0` 开始，循环将运行 5 次。\n3. 每次循环结束时计数器如何变化。在本例中，每次循环计数器递增。\n\
    \n括号内的三个规范总是按相同的顺序排列：\n\n1. 计数器的名称（通常为 `i`）以及起始值（通常为 `0`）\n2. 循环运行的次数（本例中为数组元素的数量）\n\
    3. 每次迭代后如何改变计数器（通常每次加 1）\n\n需要记住的事项：\n\n* 在示例中，计数器 `i` 有两个作用。它跟踪迭代次数，以便循环在正确的位置停止。同时，它作为数组的索引，使得代码可以在每次迭代计数器递增时遍历数组的所有元素。\n\
    * 使用 `i` 作为计数器并非神圣不可侵犯。你可以使用任何合法的变量名。但程序员通常使用 `i`，因为它使第一行保持紧凑，并且程序员理解 `i` 代表“迭代”（iteration）。\n\
    * 在示例中，初始计数为 `0`，即数组第一个元素的索引。但根据需求，它可以是任何数字。\n* 在示例中，计数器每次迭代递增。但根据需求，你可以递减、每次增加\
    \ 2，或以其他方式改变它。\n* 在示例中，我指定循环在 `i <= 4` 时运行。或者，我可以指定 `i < 5`。无论哪种方式，由于计数器从 `0`\
    \ 开始，循环运行 5 次。\n\n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/18.html`](http://www.ASmarterWayToLearn.com/javascript/18.html)\n\
    \n## For 循环：标志、布尔值、数组长度和循环中断\n\n上一章中我给出的 `for` 循环示例存在几个问题。第一个问题是潜在的通信问题。如果用户所在城市与最干净城市列表匹配，会显示一个确认警告框。但如果没有匹配，则什么也不会发生。用户被蒙在鼓里。如果没有找到匹配，我们需要显示一个警告框来告知用户。但该怎么做呢？\n\
    \n我们使用一个标志（flag）来实现。标志只是一个变量，你给它一个默认值，然后在特定条件下将其切换为另一个值。在我们的示例中，假设标志如下：\n\n```javascript\n\
    var matchFound = \"no\";\n```\n\n"
- fmt: "\nIf a match is found, the value of the flag is changed. At the end, if the\
    \ flag hasn't been changed—if it still has the original value of \"no\"—it means\
    \ no match was found, and so we display an alert saying the city isn't on the\
    \ list.\n\n```javascript\nvar matchFound = \"no\";\nfor (var i = 0; i <= 4; i++);\n\
    \  if (cityToCheck === cleanestCities[i]) {\n    matchFound = \"yes\";\n    alert(\"\
    It's one of the cleanest cities\");\n  }\n}\nif (matchFound === \"no\") {\n  alert(\"\
    It's not on the list\");\n}\n```\n\nThis works, but rather than assigning the\
    \ strings \"no\" and \"yes\" to the switch, it's conventional to use the Boolean\
    \ values `false` and `true`.\n\n```javascript\nvar matchFound = false;\nfor (var\
    \ i = 0; i <= 4; i++);\n  if (cityToCheck === cleanestCities[i]) {\n    matchFound\
    \ = true;\n    alert(\"It's one of the cleanest cities\");\n  }\n}\nif (matchFound\
    \ === false) {\n  alert(\"It's not on the list\");\n}\n```\n\nThere are only two\
    \ Booleans, `true` and `false`. Note that they aren't enclosed in quotes.\n\n\
    The next problem with our example is that it potentially wastes computing cycles.\
    \ Suppose on the second loop a match is found and the alert displays. The way\
    \ the loop is coded, the loop goes on looping all the way to the end. This is\
    \ unnecessary, since we got our answer in the second loop. The problem is solved\
    \ with the keyword `break`.\n\n```javascript\nvar matchFound = false;\nfor (var\
    \ i = 0; i <= 4; i++);\n  if (cityToCheck === cleanestCities[i]) {\n    matchFound\
    \ = true;\n    alert(\"It's one of the cleanest cities\");\n    break;\n  }\n\
    }\nif (matchFound === false) {\n  alert(\"It's not on the list\");\n}\n```\n\n\
    The last problem: In the example, I assume that the number of elements in the\
    \ array is known. But what if it isn't? JavaScript has a way of finding out. The\
    \ following code assigns the number of elements in the array `cleanestCities`\
    \ to the variable `numElements`.\n\n`var numElements = cleanestCities.length;`\n\
    \nNow we can limit the number of loops to the count that JavaScript comes up with.\n\
    \n```javascript\nvar numElements = cleanestCities.length;\nvar matchFound = false;\n\
    for (var i = 0; i < numElements; i++);\n  if (cityToCheck === cleanestCities[i])\
    \ {\n    matchFound = true;\n    alert(\"It's one of the cleanest cities\");\n\
    \    break;\n  }\n}\nif (matchFound === false) {\n  alert(\"It's not on the list\"\
    );\n}\n```\n\nNow the loop keeps going as long as `i` is less than the number\
    \ of elements. (Since the `length` number is 1-based and the `i` number is 0-based,\
    \ we need to stop 1 short of the length.)\n\n> Find the interactive coding exercises\
    \ for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/19.html](http://www.ASmarterWayToLearn.com/javascript/19.html)\n\
    \n## Nested for loops\n\nAtlantic Records has hired you and me to generate a list\
    \ of names for future rap stars. To make things easy, we'll start by making separate\
    \ lists of some first names and last names.\n\n![](images/00012.jpg)\n\nBy combining\
    \ each of the first names with each of the last names, we can generate 20 different\
    \ full names for rappers.\n\nStarting with \"BlueRay,\" we go through the list\
    \ of last names, generating...\nBlueRay Zzz\nBlueRay Burp\nBlueRay Dogbone\nBlueRay\
    \ Droop\n\nWe move to the next first name, \"Upchuck.\" Again, we go through the\
    \ list of last names, generating...\nUpchuck Zzz\nUpchuck Burp\nUpchuck Dogbone\n\
    Upchuck Droop\n\nAnd so on, combining each first name with each last name.\n\n\
    But look, why not have JavaScript do the repetitive work? We'll use nested `for`\
    \ statements.\n\n```javascript\nvar firstNames = [\"BlueRay \", \"Upchuck \",\
    \ \"Lojack \", \"Gizmo \", \"Do-Rag \"];\nvar lastNames = [\"Zzz\", \"Burp\",\
    \ \"Dogbone\", \"Droop\"];\nvar fullNames = [];\nfor (var i = 0; i < firstNames.length;\
    \ i++) {\n  for (var j = 0; j < lastNames.length; j++) {\n    fullNames.push(firstNames[i]\
    \ + lastNames[j]);\n  }\n}\n```\n\nThings to think about:\n\n* The inner loop\
    \ runs a complete cycle of iterations on each iteration of the outer loop. If\
    \ the outer loop counter is `i` and the inner loop counter is `j`, `j` will loop\
    \ through 0, 1, 2, and all the way to the end while `i` is on 0. Then `i` will\
    \ increment to 1, and `j` will loop through all of its values again. The outer\
    \ loop is the minute hand of a clock. The inner loop is the second hand.\n* You\
    \ can have as many levels of nesting as you like.\n* A nested loop is indented\
    \ 2 spaces beyond its outer loop.\n\n> Find the interactive coding exercises for\
    \ this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/20.html](http://www.ASmarterWayToLearn.com/javascript/20.html)\n\
    \n## Changing case\n\nYou ask the user to enter her city. Then you check her city\
    \ against a list of the 5 cleanest cities.\n\nIf the user enters \"Cheyenne\"\
    \ or any of the other cleanest cities, your code displays an alert telling her\
    \ that it's one of the cleanest cities.\n\nBut what if she enters \"cheyenne\"\
    \ instead of \"Cheyenne\"—as some users inevitably will? When that happens, there\
    \ will be no match. JavaScript is literal-minded.\n\nA human knows that in this\
    \ context \"cheyenne\" means \"Cheyenne.\" But JavaScript doesn't. We need some\
    \ way to get JavaScript to recognize the uncapitalized version as a match.\n\n\
    One way would be to expand the `cleanestCities` array to include the uncapitalized\
    \ versions of all the city names:\n\n`var cleanestCities = [\"Cheyenne\", \"cheyenne\"\
    , \"Santa Fe\", \"santa fe\", \"Tucson\", \"tucson\", \"Great Falls\", \"great\
    \ falls\", \"Honolulu\", \"honolulu\"];`\n\nThis works up to a point, but it's\
    \ a lot of extra coding. Plus, if the user enters \"santa Fe,\" \"Santa fe,\"\
    \ or \"sAnta Fe,\" we're back to the original problem. To cover all these possibilites\
    \ and others, it would take a mile of code.\n\nThe solution is to code the array\
    \ elements in lower-case, and convert the user's input, whatever it is, to lower-case,\
    \ so we always have apples to compare with apples.\n\n```javascript\nvar cityToCheck\
    \ = prompt(\"Enter your city\");\ncityToCheck = cityToCheck.toLowerCase();\nvar\
    \ cleanestCities = [\"cheyenne\", \"santa fe\", \"tucson\", \"great falls\", \"\
    honolulu\"];\nfor (var i = 0; i <= 4; i++) {\n  if (cityToCheck === cleanestCities[i])\
    \ {\n    alert(\"It's one of the cleanest cities\");\n  }\n}\n```\n\nLine 2 is\
    \ what's new here:\n\n`cityToCheck = cityToCheck.toLowerCase();`\n\nThe converted\
    \ string is assigned to a variable. In this case, it's the same variable whose\
    \ string is being converted, `cityToCheck`. Note that the keyword `toLowerCase`\
    \ must be in camelCase.\n\nNote too that the `toLowerCase()` method converts all\
    \ the characters of the string to lower-case, not just the initial letters. For\
    \ example, \"ChEyEnNe\" becomes \"cheyenne.\"\n\nYou could go the other way and\
    \ convert everything to upper-case, then test against \"CHEYENNE,\" \"SANTA FE,\
    \ \" etc. Most coders prefer the lower-case method. To convert the string to upper-case,\
    \ you'd write:\n\n`cityToCheck = cityToCheck.toUpperCase();`\n\n> Find the interactive\
    \ coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/21.html](http://www.ASmarterWayToLearn.com/javascript/21.html)\n\
    \n## Strings: Measuring length and extracting parts\n\nYou've asked the user to\
    \ give you the name of a city. You want to convert the name she's given you to\
    \ a name with an initial cap. Whether she's input \"boston,\" \"BOSTON\", or \"\
    bosTon,\" you want to normalize the input to \"Boston.\" The `toLowerCase()` and\
    \ `toUpperCase()` methods you learned in the last chapter won't get the job done\
    \ on their own, because they make the same wholesale change to every character\
    \ in the string. But if you break the string up into two segments, you can use\
    \ these methods to get the string into the shape you want. (For now, I'll ignore\
    \ the possibility that the city name might be made up of two or more words, like\
    \ New Orleans or Sault Ste. Marie.)\n"
