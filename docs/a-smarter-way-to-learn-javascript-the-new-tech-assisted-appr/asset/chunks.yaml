    `\n\n`onMouseout=\"src='before-pic.jpg'\"``>`\n\n> Find the interactive coding\
    \ exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/47.html](http://www.ASmarterWayToLearn.com/javascript/47.html)\n\
    \n## 48 Events: fields\n\nLet's say you have a text field for the user's email\
    \ address. When the user clicks in the field to type her entry, the field turns\
    \ yellow.\n\nThis is the markup that makes it happen.\n\n`Email:<br>`\n\n`<input\
    \ type=\"text\" size=\"30\"` `onFocus=\"this.style.backgroundColor='yellow';\"\
    ``>`\n\nOnce again, I'm showing you the not-recommended inline way to handle an\
    \ event, using it as a stepping stone for learning more professional event-handling\
    \ later in the book. Again, I'm not explaining `this.style.backgroundColor`. Just\
    \ memorize the sequence to use in the exercises.\n\nThe keyword here is `onFocus`.\
    \ It tells JavaScript to do something when the user clicks in the field.\n\nThe\
    \ syntax is the same as for other event handlers that you've already learned to\
    \ code: a keyword, followed by an equal sign, followed by JavaScript or HTML in\
    \ quotes.\n\nAfter the user enters her email address—or not—and clicks outside\
    \ the field or presses the tab key to move to another field—that is, when this\
    \ field no longer has the focus—you want it to revert to a white background. You\
    \ do this with the `onBlur` keyword, which is the opposite of `onFocus`.\n\nThis\
    \ markup handles both the `onFocus` and the `onBlur` events.\n\n`Email:<br>`\n\
    \n`<input type=\"text\" size=\"30\" onFocus=\"this.style.backgroundColor='yellow';\"\
    ` `onBlur=\"this.style.backgroundColor='white';\"``>`\n\nWhen the user clicks\
    \ into the field, it turns yellow. When she clicks out of the field, it reverts\
    \ to white.\n\nA slightly more professional approach would be to call functions\
    \ that accomplish the same things.\n\n`Email:<br>`\n\n`<input type=\"text\" size=\"\
    30\"` `onFocus=\"makeFieldYellow();``\"` `onBlur=\"makeFieldWhite();\"``>`\n\n\
    > Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/48.html](http://www.ASmarterWayToLearn.com/javascript/48.html)\n\
    \n## 49 Reading field values\n\nSuppose you've included an email field in a form,\
    \ and you've made it a required field. The form has a submit button that the user\
    \ clicks to submit the information that he's entered in the form.\n\nThis is the\
    \ markup that creates the form. I've simplified it, omitting any form action and\
    \ other attributes, including linebreaks, that don't bear on what you're learning\
    \ here.\n\n`<form>`\n\n`  Email:`\n\n`  <input type=\"text\">`\n\n`  <input type=\"\
    submit\" value=\"Submit\">`\n\n`</form>`\n\nSo now in our stripped-down form markup,\
    \ we've got these three elements:\n\n1.  The text \"Email\"\n2.  The text field\
    \ for the user's email address\n3.  The submit button\n\nI'm going to give the\
    \ email field an id.\n\n`<form>`\n\n`  Email:`\n\n`<input type=\"text\"` `id=\"\
    email\"``>`\n\n`  <input type=\"submit\" value=\"Submit\">`\n\n`</form>`\n\nNext,\
    \ I'm going to add an event-handler, using the keyword `onSubmit`.\n\n`<form`\
    \ `onSubmit=\"checkAddress('email');\"``>`\n\n`  Email:`\n\n`  <input type=\"\
    text\" id=\"email\">`\n\n`  <input type=\"submit\" value=\"Submit\">`\n\n`</form>`\n\
    \nNow, when the user clicks the submit button, the function `checkAddress` executes.\
    \ Note that, even though the action is a click on the submit button, the `onSubmit`\
    \ event handler is in the `form` tag, not in the submit button tag. That's because\
    \ the submission is an event that applies to the whole form, not the submit button.\n\
    \nHere's where things get interesting. When the form is submitted, the function\
    \ `checkAddress` looks to see if the user has entered anything in the email field.\
    \ If not, the function displays an alert reminding the user that the email address\
    \ is required.\n\nIn order to do this, the function needs a way to read what's\
    \ in the email field. This is where the id that I added to the field comes in.\
    \ Here's the code for the function.\n\n```\nfunction checkAddress(fieldId) {\n\
    \  if (document.getElementById(fieldId).value === \"\") {\n    alert(\"Email address\
    \ required.\");\n  }\n}\n```\n\nIf there's no value in the email field, an alert\
    \ displays telling the user that an email address is required.\n\nThis is the\
    \ sequence you need to memorize:\n\n1.  The keyword `document`, followed by...\n\
    2.  a dot, followed by...\n3.  the keyword `getElementById`, followed by...\n\
    4.  the parameter, in parens, received from the calling code, `fieldId`, followed\
    \ by...\n5.  another dot, followed by...\n6.  the keyword `value`\n\nNote that\
    \ `getElementById` must be in strict camelCase. If you do what comes naturally\
    \ and write `getElementByID`, with a cap \"D,\" it won't work.\n\nSome coders\
    \ prefer to put the value found in the field into a variable, like this.\n\n```\n\
    function checkAddress(fieldId) {\n  var val = document.getElementById(fieldId).value;\n\
    \  if (val === \"\") {\n    alert(\"Email address required.\");\n  }\n}\n```\n\
    \n> Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/49.html](http://www.ASmarterWayToLearn.com/javascript/49.html)\n\
    \n## 50 Setting field values\n\nThe user has entered her ZIP code in a form field.\
    \ You want to save her the trouble of entering the city and state. So when she\
    \ clicks out of the field, you fill in the city field for her.\n\nLet me show\
    \ you how to do that. To keep things simple, we'll pretend there are only three\
    \ ZIP codes in the U.S. We'll also pretend that the user will infallibly enter\
    \ one of these codes. We won't check for errors. And for this example, the JavaScript\
    \ code will fill in only the city field, not the state. Here's the relevant markup\
    \ for the form. (I'm omitting a form action, a submit button, and everything else\
    \ that's not relevant to this chapter.)\n\n`<form>`\n\n`  ZIP:<br>`\n\n`  <input\
    \ type=\"text\" id=\"zip\" onBlur=\"fillCity();\"><br>`\n\n`  City:<br>`\n\n` \
    \ <input type=\"text\" id=\"city\">`\n\n`</form>`\n\nWhen the user clicks out\
    \ of the ZIP field, the `onBlur` event triggers the `fillCity` function. This\
    \ is the code.\n\n```\nfunction fillCity() {\n  var cityName;\n  var zipEntered\
    \ = document.getElementById(\"zip\").value;\n  switch (zipEntered) {\n    case\
    \ \"60608\":\n      cityName = \"Chicago\";\n      break;\n    case \"68114\"\
    :\n      cityName = \"Omaha\";\n      break;\n    case \"53212\":\n      cityName\
    \ = \"Milwaukee\";\n  }\n  document.getElementById(\"city\").value = cityName;\n\
    }\n```\n\nThis example shows that you can not only read a value in a field with\
    \ `document.getElementById...`, but can also \"write\" a value into a field.\n"
