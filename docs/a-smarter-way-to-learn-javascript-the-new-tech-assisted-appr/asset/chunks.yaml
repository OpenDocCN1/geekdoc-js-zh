    > [http://www.ASmarterWayToLearn.com/js/32.html](http://www.ASmarterWayToLearn.com/javascript/32.html)


    ## 33 Specifying a date and time


    How many days before the U.S. Social Security program goes broke?


    Let''s start with the estimated date. According to the system''s trustees, the
    money will run out in 2035. They didn''t pin down an exact date. Let''s pick the
    middle of the year—June 30.


    Okay, that''s the hard part—pinpointing doomsday. Once we have that, constructing
    a day-by-day countdown is a JavaScript romp.


    You already know how to do the first step, creating a `Date` object for the current
    date and time:


    ```

    1 var today = new Date();

    ```


    Next, you create a second `Date` object. But this time you specify the future
    date, June 30, 2035.


    ```

    2 var doomsday = new Date("June 30, 2035");

    ```


    Notice how the date is specified. It''s in quotes. The month is spelled out. There''s
    a comma after the day of the month. The year is expressed in four digits.


    Next, you extract from both dates the milliseconds that have elapsed since the
    reference date of January 1, 1970.


    ```

    3 var msToday = today.getTime();

    4 var msDoomsday = doomsday.getTime();

    ```


    You calculate the difference.


    ```

    5 var msDiff = msDoomsday - msToday;

    ```


    Some simple math converts the milliseconds to days.


    ```

    6 var dDiff = msDiff / (1000 * 60 * 60 * 24);

    ```


    The huge number created by the math inside the parentheses converts the milliseconds
    into seconds (1000), minutes (60), hours (60), and days (24).


    You want a number that represents whole days, so you round down. The following
    statement rounds the number of days, which is probably a floating-point number,
    down to an integer.


    ```

    7 dDiff = Math.floor(dDiff);

    ```


    Here''s the whole thing, condensed into something that looks more like production
    code


    ```

    1 var msDiff = new Date("June 30, 2035").getTime() - new Date().getTime();

    2 var daysTillDoom = Mathfloor(msDiff / (1000 * 60 * 60 * 24));

    ```


    Line 1 subtracts the milliseconds since the reference date of the current moment
    from the milliseconds since the reference date of June 30, 2035. Line 2 converts
    the milliseconds to days and rounds down.


    If the time is important, you can specify that as well.


    ```

    var d = new Date("July 21, 1983 13:25:00");

    ```


    Note the form used to specify the time: No comma after the date. 24-hour time.
    Colons separating hours, minutes, and seconds.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/33.html](http://www.ASmarterWayToLearn.com/javascript/33.html)


    ## 34 Changing elements of a date and time


    You can change individual elements of a `Date` object. Here''s a summary:


    ![](images/00016.jpg)


    `setFullYear` sets the year of an existing `Date` object without changing any
    other element.


    ```

    1 var d = new Date();

    2 d.setFullYear(2001);

    ```


    Line 1 creates a new `Date` object for the current moment. Line 2 changes the
    year of the `Date` object to 2001, leaving all other elements of the `Date` object
    intact.


    `setMonth` sets the month of an existing `Date` object without changing any other
    element.


    ```

    1 var d = new Date();

    2 d.setMonth(11);

    ```


    Line 1 creates a new `Date` object for the current moment. Line 2 changes the
    month of the `Date` object to 11 (December), leaving all other elements of the
    `Date` object intact.


    `setDate` sets the day of the month of an existing `Date` object without changing
    any other element.


    ```

    1 var d = new Date();

    2 d.setDate(15);

    ```


    Line 1 creates a new `Date` object for the current moment. Line 2 changes the
    date of the `Date` object to the 15th of the month, leaving all other elements
    of the `Date` object intact.


    `setHours` sets the hours of an existing `Date` object without changing any other
    element.


    ```

    1 var d = new Date();

    2 d.setHours(13);

    ```


    Line 1 creates a new `Date` object for the current moment. Line 2 changes the
    hours of the `Date` object to the 13th hour (1 p.m.), leaving all other elements
    of the `Date` object intact.


    `setMinutes` sets the minutes of an existing `Date` object without changing any
    other element.


    ```

    1 var d = new Date();

    2 d.setMinutes(05);

    ```


    Line 1 creates a new `Date` object for the current moment. Line 2 changes the
    minutes of the `Date` object to 5 minutes after the hour, leaving all other elements
    of the `Date` object intact.


    `setSeconds` sets the seconds of an existing `Date` object without changing any
    other element.


    ```

    1 var d = new Date();

    2 d.setSeconds(55);

    ```


    Line 1 creates a new `Date` object for the current moment. Line 2 changes the
    seconds of the `Date` object to the 55 seconds after the minute, leaving all other
    elements of the `Date` object intact.


    `setMilliseconds` sets the milliseconds of an existing `Date` object without changing
    any other element.


    ```

    1 var d = new Date();

    2 d.setMilliseconds(867);

    ```

