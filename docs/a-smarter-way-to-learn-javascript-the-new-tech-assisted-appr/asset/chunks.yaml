    74


    Objects:


    Prototypes


    In the last chapter you created three objects using a constructor. Each object
    corresponded to a hosting plan. Each object had six properties and one method.
    Here''s a chart showing the three objects and their properties and method. Check
    out the last row, colored green in the table, the one representing the methods
    for the three objects...


    ![](images/00019.jpg)


    There''s something inelegant about the green last row. The properties shown in
    the rows above it are customized for each object, but the method is always the
    same from object to object. The constructor function keeps duplicating the same
    method for each object, object after object. If we were to create 100 objects
    using the constructor, JavaScript would duplicate the same method 100 times, once
    for each object. It would work, but it ain''t pretty.


    This table, which shows all of the objects sharing a single method, makes more
    sense.


    ![](images/00005.jpg)


    We want only one copy of the method, shared by all objects created with the constructor,
    no matter how many objects are created.


    How do we do it? With a prototype statement.


    First, we don''t include the method in the constructor function, because that
    creates a copy of the method for every single object that''s created with the
    constructor.


    Instead, we define the method as a prototype of the constructor, this way.


    `1  ``Plan.prototype.calcAnnual = function(percentIfDisc) {`


    `2    var bestPrice = this.price;`


    `3    var currDate = new Date();`


    `4    var thisMo = currDate.getMonth();`


    `5    for (var i = 0; i < this.discountMonths.length; i++) {`


    `6      if (this.discountMonths[i] === thisMo) {`


    `7        bestPrice = this.price * percentIfDisc;`


    `8        break;`


    `9      }`


    `10   }`


    `11   return bestPrice * 12;`


    `12 };`


    Now, all objects created with the constructor `Plan` will share the same copy
    of the method `calcAnnual`. There''s no unnecessary duplication.


    Note that except for the first line, the method is coded exactly as I coded it
    when it was part of the constructor definition. Even the first line is the same,
    if you consider only the parts on the right side of the equal sign. The parts
    on the left side, connected by dots, are:


    *   the name of the constructor function, in this case `Plan`


    *   the keyword `prototype`


    *   the name of the method that all objects created with `Plan` will share, in
    this case `calcAnnual`


    Objects can have prototype properties as well as prototype methods. Suppose you
    wanted all objects created with the `Plan` to share the same property, `cancellable,`
    with a value of `true`. You''d code the prototype this way.


    `Plan.prototype.cancellable = true;`


    Now all objects created with the constructor function `Plan` share a property,
    `cancellable`, whose value is `true`.


    This is how the object table looks with the prototype method and the prototype
    property.


    ![](images/00007.jpg)


    It''s possible to override a prototype for any individual object. For example,
    suppose you want all objects created with the constructor to share the same `cancellable`
    property, except for the least expensive plan, `plan1`, with the name "Basic."
    This is the statement that does it.


    `plan1.cancellable = false;`


    All objects created with the constructor still share theproperty `cancellable`,
    but now the value of that property for one object is different from all the others.
    Here''s the chart.


    ![](images/00003.jpg)


    In the same way, you could override a shared prototype method for any individual
    objects as well.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/74.html](http://www.ASmarterWayToLearn.com/javascript/74.html)


    75


    Objects:


    Checking for properties and methods


    You can check to see if an object has a particular property by writing a simple
    statement like this.


    `var gotTheProperty =` `"price" in plan1``;`


    Here are the parts:


    *   the property in question, enclosed in quotes—in this case, `price`


    *   the keyword `in`


    *   the object, in this case, `plan1`


    Again, the question is, does the object named `plan1` have a property called `price`?
    In other words, is there such a thing as `plan1.price`? In the example of three
    hosting plans that we''ve been using, `plan1` does have a price, 3.99\. So `gotTheProperty`
    is assigned `true`. But `plan1` doesn''t have a property named `location`. So
    if we write...


    `var gotTheProperty = "location" in plan1;`


    ...the variable `gotTheProperty` is `false`.


    `plan1` in the example also has a method named `calcAnnual`. A method is a type
    of property of an object, so if you write...


    `var gotTheProperty = "calcAnnual" in plan1;`


    ...the variable `gotTheProperty` is `true`.


    Things to notice:


    The property, a variable, is enclosed in quotation marks. We''re not used to putting
    JavaScript variables inside quotation marks, so this is something to make a note
    of.


    The keyword is `in`—pretty intuitive. The code asks, "Is there a property called
    ''price'' in `plan1`?"


    If you want a list of an object''s properties, there''s a spiffy way to do it:


    `1 var listOfProperties = [];`


    `2 for (``var prop in plan1``) {`


    `3   listOfProperties.push(prop);`


    `4 }`


    Line 1 declares an empty array, `listOfProperties`. Lines 2-4 cycle through all
    the properties of `plan1`, adding each property (`push`), including any methods,
    to the array `listOfProperties`. Using the example we''ve been working with, the
    array `listOfProperties` winds up with a value of "name,price,space,transfer,pages,discountMonths,calcAnnual".


    Note that, unlike a regular for loop, this one doesn''t establish a limit on the
    number of loops or increment a counter. After each iteration, JavaScript automatically
    moves to the next property of the object and stops iterating when there are no
    more properties to enumerate.


    Note also that instead of `prop`, you could use any other legal variable name.


    In the example, the method, `calcAnnual`, wasn''t included in the original definition
    of the object `plan1`. It was later added to the prototype of the constructor
    function that I used to create the object, and so became a property of the object
    by inheritance. The code above includes inherited properties (including methods)
    in the collection. If you want to limit the list of properties to those that have
    been explicitly declared for the object, omitting those that are inherited from
    a prototype, you need to use `hasOwnProperty`.


    `1 var listOfProperties = [];`


    `2 for (var prop in plan1) {`


    `3   if (plan1.``hasOwnProperty``(prop)) {`


    `4    listOfProperties.push(prop);`


    `5   }`


    `6 }`


    In the example above, each property in turn is assigned to the variable `prop`.
    Then the if statement tests to see if it''s a property owned by the object as
    opposed to being inherited through a prototype.


    You can of course test a literal property name instead of using a variable.


    `var isOwnedProperty = plan1.hasOwnProperty(``"price"``);`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/75.html](http://www.ASmarterWayToLearn.com/javascript/75.html)


    76


    Browser control:


    Getting and setting the URL


    In addition to making things happen on the webpage, you can use JavaScript to
    control the browser. To begin with, you can get the browser to tell you its current
    location.


    `var whereWeAt =` `window.location.href``;`'
