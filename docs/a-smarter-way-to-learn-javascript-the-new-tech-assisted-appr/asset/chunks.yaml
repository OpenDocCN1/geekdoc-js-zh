    JavaScript variables can also change.


    If I code...


    `var name = "Mark";`


    `name` refers to "Mark". Then I come along and code the line...


    `name = "Ace";`


    Before I coded the new line, if I asked JavaScript to print `name`, it printed...


    Mark


    But that was then.


    Now if I ask JavaScript to print `name`, it prints...


    Ace


    A variable can have any number of values, but only one at a time.


    You may be wondering why, in the statement above that assigns "Ace" to `name`,
    the keyword `var` is missing. It''s because the variable was declared earlier,
    in the original statement that assigned "Mark" to it. Remember, `var` is the keyword
    that creates a variable—the keyword that declares it. Once a variable has been
    declared, you don''t have to declare it again. You can just assign the new value
    to it.


    You can declare a variable in one statement, leaving it undefined. Then you can
    assign a value to it in a later statement, without declaring it again.


    `var` `nationality``;`


    `nationality` `= "U.S.";`


    In the example above, the assignment statement follows the declaration statement
    immediately. But any amount of code can separate the two statements, as long as
    the declaration statement comes first. In fact, there''s no law that says you
    have to ever define a variable that you''ve declared.


    JavaScript variable names have no inherent meaning to JavaScript.


    In English, words have meaning. You can''t use just any word to communicate. I
    can say, "My name is Mark," but, if I want to be understood, I can''t say, "My
