  trans: "\n\n# 字符串：查找片段\n\n要复制字符串的一部分，可以使用 `slice` 方法。假设用户输入了一个字符串，并且该字符串已赋值给变量 `cityToCheck`。以下代码复制字符串的第一个字符，并将其赋值给变量\
    \ `firstChar`。`cityToCheck` 的原始值不会改变。如果 `cityToCheck` 是 \"Boston\"，那么 `firstChar`\
    \ 就是 \"B\"。\n\n```javascript\nvar firstChar = cityToCheck.slice(0, 1);\n```\n\n\
    ### 需要注意的事项：\n\n*   字符串的索引方式与数组类似。不同之处在于，每个索引号指向的不是元素，而是一个字符。\n*   与数组索引一样，字符串索引也从\
    \ 0 开始。\n*   在 `slice` 方法中，括号内的第一个数字是切片中第一个字符的索引。然而，第二个数字并不是切片中的最后一个字符，而是切片之后的第一个字符。如果用第二个索引减去第一个索引，你总是能得到切片的长度。\n\
    \n下面是另一个例子。\n\n```javascript\nvar someChars = cityToCheck.slice(2, 5);\n```\n\n\
    再次假设字符串是 \"Boston\"。切片从索引 2（第三个）字符 \"s\" 开始，到索引 5 字符之前的那个字符 \"n\" 结束。`someChars`\
    \ 的值是 \"sto\"。\n\n如果省略括号内的第二个数字，JavaScript 会包含从起始位置到字符串末尾的所有字符。\n\n```javascript\n\
    var someChars = cityToCheck.slice(2);\n```\n\n切片从索引 2（第三个）字符 \"s\" 开始。由于没有指定结束位置，切片会一直取到字符串的最后一个字符。`someChars`\
    \ 的值是 \"ston\"。\n\n现在我们有一种方法可以将字符串的第一个字符大写，并确保其余字母为小写。\n\n```javascript\nvar firstChar\
    \ = cityToCheck.slice(0, 1);\nvar otherChars = cityToCheck.slice(1);\nfirstChar\
    \ = firstChar.toUpperCase();\notherChars = otherChars.toLowerCase();\nvar cappedCity\
    \ = firstChar + otherChars;\n```\n\n以上代码逐行执行的操作如下：\n\n1.  复制字符串的第一个字符，并将其赋值给变量\
    \ `firstChar`。\n2.  复制从第二个字符到末尾的所有字符，并将其赋值给变量 `otherChars`。\n3.  将第一个字符转换为大写。\n\
    4.  将其他字符转换为小写。\n5.  将两部分拼接起来，重新组成完整的字符串。\n\n有时，知道字符串中有多少个字符是很有用的。例如，假设你想从任何长度超过三个字符的字符串中截取前三个字符，比如从\
    \ \"November\" 中截取 \"Nov\"。要查找字符串中的字符数，可以使用你已经学过的用于查找数组中元素数量的相同语法。\n\n```javascript\n\
    var month = prompt(\"Enter a month\");\nvar charsInMonth = month.length;\nif (charsInMonth\
    \ > 3) {\n  monthAbbrev = month.slice(0, 3);\n}\n```\n\n第 2 行统计字符串中的字符数，并将该数字赋值给变量\
    \ `charsInMonth`。\n\n能够测量字符串中的字符数会很有用。例如，假设你想遍历一个字符串，检查其中是否有双空格。你可以将字符数用作循环限制器。以下代码检查字符串中是否有双空格，如果发现则显示一个警告。\n\
    \n```javascript\nvar str = prompt(\"Enter some text\");\nvar numChars = str.length;\n\
    for (var i = 0; i < numChars; i++) {\n  if (str.slice(i, i + 2) === \"  \") {\n\
    \    alert(\"No double spaces!\");\n    break;\n  }\n}\n```\n\n第 2 行统计字符串中的字符数，并将该数字赋值给变量\
    \ `numChars`。在第 3 行中，这个数字被用作循环限制器。循环仅在计数器 `i` 小于字符串中字符数时继续运行。（记住，长度是基于 1 的，而计数器是基于\
    \ 0 的，因此循环必须在长度数减 1 的位置停止。）第 4 行逐个字符地遍历字符串，检查每个由两个字符组成的片段，寻找双空格。\n\n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/22.html`](http://www.ASmarterWayToLearn.com/javascript/22.html)\n\
    \n## 查找片段\n\n《纽约客》杂志不允许使用短语 \"World War II\"。他们认为应该用 \"the Second World War\"\
    。那么，让我们在下面的句子中搜索被禁止的字符，并将其替换为《纽约客》偏爱的短语。\n\n| 令人惊讶的是，即使在第二次世界大战最黑暗的深处，J. R. R.\
    \ 托尔金仍在撰写那部三部曲，其中包含（只有诗歌和神话才具有的奇特适用性）这样一个基本概念：善良的灰袍巫师能够理解邪恶的魔法师，恰恰是因为他与他们足够相似，能够以他们无法理解他的方式理解他们的思想和动机。\
    \ |\n\n你已经知道一种查找并替换被禁止片段的方法。假设上面的段落已赋值给变量 `text`。\n\n```javascript\nfor (var i\
    \ = 0; i < text.length; i++) {\n  if (text.slice(i, i + 12) === \"World War II\"\
    ) {\n    text = text.slice(0, i) + \"the Second World War\" + text.slice(i + 12);\n\
    \  }\n}\n```\n\n代码遍历字符串，查找 \"World War II\"。第 2 行逐个字符地遍历字符串，检查每个由 12 个字符组成的序列。如果找到\
    \ \"World War II\"，第 3 行将三个片段拼接起来：所有在 \"World War II\" 之前的字符、替换短语 \"the Second\
    \ World War\"，以及所有在 \"World War II\" 之后的字符。\n\n但 JavaScript 有一种更高效的方法来实现这一点，即使用\
    \ `indexOf` 方法。\n\n```javascript\nvar firstChar = text.indexOf(\"World War II\"\
    );\n```\n\n如果该片段存在，该方法会找到该片段第一个字符的索引，并将其赋值给变量 `firstChar`。如果该片段不存在，该方法会将 `-1`\
    \ 赋值给该变量，这样你就知道它不存在。\n\n现在我们可以用更少的代码将禁止短语替换为首选短语。\n\n```javascript\nvar firstChar\
    \ = text.indexOf(\"World War II\");\nif (firstChar !== -1) {\n  text = text.slice(0,\
    \ firstChar) + \"the Second World War\" + text.slice(firstChar + 12);\n}\n```\n\
    \n第 1 行检查该短语，如果找到，则将短语第一个字符的索引赋值给变量 `firstChar`。如果未找到，则将 `-1` 赋值给该变量。如果该变量的值不是\
    \ `-1`（第 2 行）——即找到了该短语——那么第 3 行的拼接操作会将违规短语替换为正确的短语。\n\n`indexOf` 方法只查找你要找的片段的第一个实例。在上面的例子中，你可以通过循环来克服这个限制。先将第一个\
    \ \"World War II\" 实例改为 \"the Second World War\"，然后在下一个循环迭代中，找到下一个幸存的实例并更改它，以此类推。\n\
    \n要查找字符串中某个片段的最后一个实例，请使用 `lastIndexOf`。以下代码找到该片段最后一个实例的第一个字符的索引，即第二个 \"be\"。变量\
    \ `segIndex` 最终值为 16，即第二个 \"be\" 中 \"b\" 的索引。\n\n```javascript\nvar text = \"\
    To be or not to be.\";\nvar segIndex = text.lastIndexOf(\"be\");\n```\n\n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/23.html`](http://www.ASmarterWayToLearn.com/javascript/23.html)\n\
    \n## 查找某个位置的字符\n\n用户输入了他的名字。该字符串已赋值给变量 `firstName`。你想提取第一个字符。你已经知道一种方法。\n\n```javascript\n\
    var firstChar = firstName.slice(0, 1);\n```\n\n这里有一种更直接的方法。\n\n```javascript\n\
    var firstChar = firstName.charAt(0);\n```\n\n上面的代码找到变量 `firstName` 所表示字符串中索引 0（开头）处的单个字符，并将其赋值给变量\
    \ `firstChar`。\n\n以下代码找到字符串中的最后一个字符。\n\n"
- fmt: "\n```javascript\nvar lastChar = name.charAt(name.length - 1);\n```\n\nThe\
    \ following code cycles through a string looking for an exclamation point. If\
    \ the character is found, an alert displays.\n\n```javascript\nfor (var i = 0;\
    \ i < text.length; i++) {\n  if (text.charAt(i) === \"!\") {\n    alert(\"Exclamation\
    \ point found!\");\n    break;\n  }\n}\n```\n\nNote: The `indexOf` method can\
    \ only identify the character at a particular location. It can't change the character\
    \ at a location.\n\n> Find the interactive coding exercises for this chapter at:\n\
    > [http://www.ASmarterWayToLearn.com/js/24.html](http://www.ASmarterWayToLearn.com/javascript/24.html)\n\
    \n## Strings: Replacing characters\n\nIn previous chapters you learned two different\
    \ ways to replace \"World War II\" with \"the Second World War\" in a string.\
    \ First, there was the loop-and-slice approach.\n\n```javascript\nfor (var i =\
    \ 0; i < text.length; i++) {\n  if (text.slice(i, i + 12) === \"World War II\"\
    ) {\n    text = text.slice(0, i) + \"the Second World War\" + text.slice(i + 12);\n\
    \  }\n}\n```\n\nYou improved on that rather crude approach when you learned the\
    \ `indexOf` method.\n\n```javascript\nvar firstChar = text.indexOf(\"World War\
    \ II\");\nif (firstChar !== -1) {\n  text = text.slice(0, firstChar) + \"the Second\
    \ World War\" + text.slice(firstChar + 12);\n}\n```\n\nBut JavaScript provides\
    \ a more straightforward way still, the `replace` method.\n\n```javascript\nvar\
    \ newText = text.replace(\"World War II\", \"the Second World War\");\n```\n\n\
    The first string inside the parentheses is the segment to be replaced. The second\
    \ string is the segment to be inserted. In the above code, the segment \"World\
    \ War II\" is replaced by the segment \"the Second World War\" in the string represented\
    \ by the variable `text`, and the revised string is assigned to the new variable\
    \ `newText`.\n\nIf you assign the revised string to a new variable, as in the\
    \ example above, the original string is preserved. If you want the original string\
    \ to be replaced by the revised string, assign the revised string to the original\
    \ variable.\n\n`text = text.replace(\"World War II\", \"the Second World War\"\
    );`\n\nIn the examples above, only the first instance of a string is replaced.\
    \ If you want to replace all instances, you must let JavaScript know that you\
    \ want a global replace.\n\n```javascript\nvar newText = text.replace(/World War\
    \ II/g, \"the Second World War\");\n```\n\nIn a global replace, you enclose the\
    \ segment to be replaced by slashes instead of quotation marks, and follow the\
    \ closing slash with `g` for \"global.\" The segment to be inserted is enclosed\
    \ by quotation marks, as in a one-time replace.\n\n> Find the interactive coding\
    \ exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/25.html](http://www.ASmarterWayToLearn.com/javascript/25.html)\n\
    \n## Rounding numbers\n\nYou run an online music service where customers rate\
    \ each song. You aggregate all the customer ratings and average them, awarding\
    \ a song from zero to five stars. Usually, averaging produces a fraction. You\
    \ need to round it to the nearest integer so you can translate the number into\
    \ stars. Suppose the average has been assigned to the variable `scoreAvg`. Here's\
    \ the code that rounds it to the nearest integer.\n\n`var numberOfStars = Math.round(scoreAvg);`\n\
    \nThings to keep in mind:\n\n* `Math.` is how all math functions begin. The \"\
    M\" must be capped.\n* The function rounds up when the decimal is `.5`. It rounds\
    \ `1.5` to `2`, `2.5` to `3`, etc. It rounds `-1.5` to `-1`, `-2.5` to `-2`, etc.\n\
    \nWhen the result is assigned to a new variable, as in the example above, the\
    \ unrounded number enclosed in parentheses is preserved. But you can assign the\
    \ rounded number to the original variable, and the unrounded number will be replaced\
    \ by the rounded number.\n\n`scoreAvg = Math.round(scoreAvg);`\n\nInstead of a\
    \ variable, you can enclose a literal number in the parentheses.\n\n`var scoreAvg\
    \ = Math.round(.0678437);`\n\nTo force JavaScript to round up to the nearest integer,\
    \ no matter how small the fraction, use `ceil` instead of `round`. The following\
    \ code rounds `.000001`, which would normally round down to `0`, up to the nearest\
    \ integer, `1`.\n\n`var scoreAvg = Math.ceil(.000001);`\n\n`ceil` stands for \"\
    ceiling.\" It rounds `.000001` up to `1`, `-.000001` up to `0`, `1.00001` up to\
    \ `2`, and so on.\n\nTo force JavaScript to round down to the nearest integer,\
    \ no matter how large the fraction, use `floor` instead of `round`. The following\
    \ code rounds `.999999`, which would normally round up to `1`, down to `0`.\n\n\
    `var scoreAvg = Math.floor(.999999);`\n\n`floor` rounds `.999999` down to `0`,\
    \ `1.9` down to `1`, `-.000001` down to `-1`, and so on.\n\n> Find the interactive\
    \ coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/26.html](http://www.ASmarterWayToLearn.com/javascript/26.html)\n\
    \n## Generating random numbers\n\nSuppose you want to simulate the throw of a\
    \ die. In the simulation, you want it to randomly come up 1, 2, 3, 4, 5, or 6.\
    \ The first step is to ask JavaScript to generate a random number. (Well, it's\
    \ almost random, technically known as pseudo-random, but it's close enough to\
    \ random for most purposes.)\n\nThe following code generates a pseudo-random number,\
    \ with 16 decimal places, ranging from `0.0000000000000000` through `0.9999999999999999`\
    \ and assigns it to the variable `randomNumber`.\n\n`var randomNumber = Math.random();`\n\
    \nThe function always delivers a 16-place decimal that ranges from `0.0000000000000000`\
    \ to `0.9999999999999999`. We can convert the decimal to an integer by multiplying\
    \ by one hundred quadrillion (1 followed by 17 zeroes):\n\n* `0.0000000000000000\
    \ * 100000000000000000 = 0`\n* `0.7474887706339359 * 100000000000000000 = 7474887706339359`\n\
    * `0.9999999999999999 * 100000000000000000 = 9999999999999999`\n\nTrillions of\
    \ possible numbers are more than we need in our virtual die throw. We just want\
    \ six possible numbers, 1 through 6. So instead of multiplying by a hundred quadrillion,\
    \ our first step is to multiply the giant decimal by 6.\n\n* `0.0000000000000000\
    \ * 6 = 0`\n* `0.7474887706339359 * 6 = 4.7474887706339359`\n* `0.9999999999999999\
    \ * 6 = 5.9999999999999994`\n\nIntuition may tell you that you can finish the\
    \ job by rounding, but that doesn't work out mathematically. Because nothing rounds\
    \ up to `0` and nothing rounds down to `6`, the numbers in the middle, which are\
    \ reached both by rounding up and rounding down, will come up almost twice as\
    \ often. But we can give all the numbers an equal chance if we add 1 to the result,\
    \ then round down. Here's the code for our virtual die throw.\n\n```javascript\n\
    var bigDecimal = Math.random();\nvar improvedNum = (bigDecimal * 6) + 1;\nvar\
    \ numberOfStars = Math.floor(improvedNum);\n```\n\nThis is what happens in the\
    \ code above, line by line:\n\n1. Generates a 16-place decimal and assigns it\
    \ to the variable `bigDecimal`.\n2. Converts the 16-place decimal to a number\
    \ ranging from `0.0000000000000000` through `5.9999999999999999`, then adds 1,\
    \ so the range winds up `1.0000000000000000` through `6.9999999999999999`. This\
    \ number is assigned to the variable `improvedNum`.\n3. Rounds the value represented\
    \ by `improvedNum` down to the nearest integer that ranges from 1 through 6.\n\
    \n> Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/27.html](http://www.ASmarterWayToLearn.com/javascript/27.html)\n\
    \n## Converting strings to integers and decimals\n\nSometimes JavaScript seems\
    \ to read your mind. For example, suppose you write...\n\n`var currentAge = prompt(\"\
    Enter your age.\");`\n\n...JavaScript assigns the user's answer to `currentAge`\
    \ as a string. Her entry, let's say 32, may look like a number to you, but to\
    \ JavaScript it's a string: `\"32\"`.\n\nNevertheless, suppose you write...\n\n\
    ```javascript\nvar currentAge = prompt(\"Enter your age.\");\nvar yearsEligibleToVote\
    \ = currentAge - 18;\n```\n"
