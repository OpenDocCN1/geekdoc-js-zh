    # 函数：局部变量与全局变量


    现在我们来讨论变量作用域的问题，也就是全局变量与局部变量的区别。有些变量具有全局作用域，因此被称为全局变量；另一些变量具有局部作用域，因此被称为局部变量。这再简单不过了，但不知为何，当这个话题出现在书籍或教程中时，往往会被搞得晦涩难懂。放轻松，这其实很容易理解。


    全局变量是在代码主体中声明的变量——也就是说，不在函数内部。


    局部变量是在函数内部声明的变量。它可以是函数的参数（通过作为参数被隐式声明），也可以是在函数中使用 `var` 关键字显式声明的变量。


    全局变量之所以是全局的，是因为它在代码的每个部分都有意义，无论这段代码是在主体中还是在任何函数中。全局作用域就像全球知名度一样——无论你走到世界哪个角落，人们都听说过比尔·克林顿。


    局部变量则只在其声明的函数内部有意义。局部作用域就像地方知名度——德卢斯市长在德卢斯广为人知，但在其他地方几乎无人知晓。


    因此，全局变量和局部变量有两个区别：它们声明的位置，以及它们被知晓和可被使用的位置。


    ![](img/00018.jpg)


    在我展示第一个例子之前，我希望你暂时放下通过参数向函数传递值、以及通过 `return` 语句将值返回给调用代码的知识。假装你对这些一无所知。我稍后会再回到这些话题。下面是一个例子。


    首先，在主代码中，声明一个变量并调用一个函数：


    ```javascript

    1 var theSum

    2 addNumbers();

    ```


    然后是函数：


    ```javascript

    1 function addNumbers() {

    2   theSum = 2 + 2;

    3 }

    ```


    在这个例子中，变量 `theSum` 在主代码中声明。函数 `addNumbers()` 被调用来为其赋值。由于该变量在主代码中声明，它具有全局作用域，因此这个函数或任何其他函数都可以使用它。主代码中的任何部分也都可以使用它。函数将
    `2 + 2` 的和赋给这个全局变量。由于变量具有全局作用域，这个赋值在代码的所有部分（主代码和所有函数）中都有意义。现在，无论在函数 `addNumbers()`
    中、主代码中，还是在任何其他使用它的函数中，该变量的值都是 `4`。无论我在哪里写：


    `alert(theSum);`


    无论我把它写在哪里——主代码中、函数 `addNumbers()` 中，还是任何其他函数中——都会弹出一个显示数字 `4` 的警告框。


    但是，如果我不在主代码中声明变量，而是在函数内部声明……


    ```javascript

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3 }

    ```


    ……那么该变量只在函数内部具有值 `4`。在其他任何地方，它都是未知的。在其他任何地方，它根本没有值。由于变量 `theSum` 在函数内部使用关键字 `var`
    声明，而不是在主代码中，因此它的作用域是局部的。它只在函数内部有意义。在其他函数和主代码中，它是未知的。如果我写：


    `alert(theSum);`


    ……在函数内部，会弹出一个显示数字 `4` 的警告框，因为变量 `theSum` 在其声明的函数内部是已知的。但如果我在其他地方——主代码或另一个函数中——写同样的
    alert 语句，代码就会出错，因为 `theSum` 在函数外部是未知的。


    **注意：** 我说当你在函数中声明变量时，该变量具有局部作用域。这里的“在函数中声明”是指你使用关键字 `var` 显式声明变量——而不是随意地在函数中引入一个没有
    `var` 的变量。（例外情况是，如果你将其命名为参数，那么它会被隐式声明为函数的局部变量。）如果你变得马虎，开始在函数体中使用一个新变量，却没有在函数中用关键字
    `var` 显式声明它，那么它就是全局变量——即使你在主代码中任何地方都没有声明它。


    现在，为了说明一个问题，我要做一件你在实际编码中绝不会想做的事。我将在主代码和函数中都声明一个变量。


    首先，在主代码中：


    ```javascript

    1 var theSum = 1000;

    2 addNumbers();

    ```


    然后在函数中：


    ```javascript

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3 }

    ```


    通过两次声明变量——一次在主代码中，一次在函数中——我创建了两个同名但不同的变量。一个 `theSum` 是全局的，另一个 `theSum` 是局部的。这绝不是你想做的事——它会让你犯编码错误，并使代码几乎无法理解——但我这样做是为了展示全局作用域和局部作用域的区别。通过在主代码中声明一次
    `theSum`，再在函数中声明一次，我创建了（1）一个几乎随处可用的全局变量，以及（2）一个同名的、仅在函数内部可用的局部变量。为什么我说全局变量几乎随处可用？因为它在函数内部无效。在函数内部，名称
    `theSum` 代表一个局部变量，因此该名称不能引用全局变量。在这种情况下，程序员会说全局变量被局部变量遮蔽了。在函数内部，它不可见。在函数内部，只能看到同名的局部变量。


    局部变量 `theSum` 在函数内部的值是 `4`，但函数外部的 `theSum` 的值是 `1000`。


    现在，让我们继续深入这个仙境，爱丽丝。


    首先，主代码中的一条语句：


    ```javascript

    1 var theSum = addNumbers();

    ```


    然后是一个函数：


    ```javascript

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3   return theSum;

    4 }

    ```


    同样，这不是你实际会编写的代码。我仅用这个例子来演示原理。在这段代码中，你仍然有两个不同的变量——一个全局变量和一个局部变量——它们共享同一个名称 `theSum`，但现在，借助
    `return` 语句，局部变量的值被赋给了全局变量。现在两个变量具有相同的名称和相同的值，但它们仍然是不同的变量。


    这引出了你可能想问的一个问题：


    如果一个函数可以使用全局变量，为什么还需要通过参数将值传递给形参？为什么不直接声明一个全局变量，然后让函数使用它呢？嗯，你可以这样做，但要求函数使用全局变量，就是要求它们“偷听”主代码，就像人类偷听一样，这会导致混乱和意想不到的后果。程序员们对此没有争议。最好始终通过参数显式地将值传递给函数。全局变量在函数中没有立足之地。


    同样的逻辑也适用于使用 `return` 语句的理由。你可以在函数内部改变全局变量的值。当你这样做时，它的值在所有地方都会改变，包括主代码中。不需要 `return`。但更好的做法是在函数内部使用局部变量，然后通过
    `return` 语句显式地将该值传递回去。


    > 本章的交互式编程练习请访问：

    > [`www.ASmarterWayToLearn.com/js/38.html`](http://www.ASmarterWayToLearn.com/javascript/38.html)


    # switch 语句：如何开始


    考虑下面这一连串的条件语句。


    ```javascript

    1 if (dayOfWk === "Sat" || dayOfWk === "Sun") {

    2   alert("Whoopee!");

    3 }

    4 else if (dayOfWk === "Fri") {

    5   alert("TGIF!");

    6 }

    7 else {

    8   alert("Shoot me now!");

    9 }

    ```


