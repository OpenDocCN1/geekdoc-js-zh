    ## 32 提取日期和时间的各个部分


    以下是提取 `Date` 对象各部分的重要方法总结。


    ![](img/00015.jpg)


    上一章我介绍了 `getDay`。现在我们来看看其余提取方法。与 `getDay` 类似，`getMonth` 返回的不是 `Date` 对象中显示的月份全名，而是一个数字。以下代码生成一个月份数字，范围从
    0（一月）到 11（十二月）。


    ```

    1 var d = new Date();

    2 var currentMonth = d.getMonth();

    ```


    `getDate` 返回当月的日期数字。


    ```

    var dayOfMonth = d.getDate();

    ```


    `getFullYear` 返回四位数的年份数字。


    ```

    var currYr = d.getFullYear();

    ```


    `getHours` 返回一个从 0 到 23 的数字，对应午夜到晚上 11 点。


    ```

    var currentHrs = d.getHours();

    ```


    `getMinutes` 返回一个从 0 到 59 的数字。


    ```

    var currMins = d.getMinutes();

    ```


    `getSeconds` 返回一个从 0 到 59 的数字。


    ```

    var currSecs = d.getSeconds();

    ```


    `getMilliseconds` 返回一个从 0 到 999 的数字。


    ```

    var currMills = d.getMilliseconds();

    ```


    `getTime` 返回自 1970 年 1 月 1 日午夜以来经过的毫秒数。


    ```

    var millsSince = d.getTime();

    ```


    > 本章的交互式编程练习请访问：

    > [`www.ASmarterWayToLearn.com/js/32.html`](http://www.ASmarterWayToLearn.com/javascript/32.html)


    ## 33 指定日期和时间


    距离美国社会保障体系破产还有多少天？


    我们先从预估日期开始。根据该体系的受托人，资金将在 2035 年耗尽。他们没有确定具体日期。我们选择年中——6 月 30 日。


    好了，最难的部分——确定末日——已经完成。一旦有了这个日期，构建逐日倒计时就是 JavaScript 的轻松活了。


    你已经知道第一步怎么做：为当前日期和时间创建一个 `Date` 对象：


    ```

    1 var today = new Date();

    ```


    接下来，创建第二个 `Date` 对象。但这次你要指定未来的日期，即 2035 年 6 月 30 日。


    ```

    2 var doomsday = new Date("June 30, 2035");

    ```


    注意日期的指定方式。它被引号括起来。月份是拼写出来的。日期后面有逗号。年份用四位数字表示。


    接着，从两个日期中提取自 1970 年 1 月 1 日参考日期以来经过的毫秒数。


    ```

    3 var msToday = today.getTime();

    4 var msDoomsday = doomsday.getTime();

    ```


    计算差值。


    ```

    5 var msDiff = msDoomsday - msToday;

    ```


    通过简单的数学运算将毫秒转换为天数。


    ```

    6 var dDiff = msDiff / (1000 * 60 * 60 * 24);

    ```


    括号内的数学运算产生的大数字将毫秒转换为秒（1000）、分钟（60）、小时（60）和天（24）。


    你需要一个表示整天的数字，因此向下取整。以下语句将天数（很可能是浮点数）向下取整为整数。


    ```

    7 dDiff = Math.floor(dDiff);

    ```


    以下是整个代码，压缩成更像生产代码的形式：


    ```

    1 var msDiff = new Date("June 30, 2035").getTime() - new Date().getTime();

    2 var daysTillDoom = Math.floor(msDiff / (1000 * 60 * 60 * 24));

    ```


    第 1 行将当前时刻自参考日期以来的毫秒数从 2035 年 6 月 30 日自参考日期以来的毫秒数中减去。第 2 行将毫秒转换为天数并向下取整。


    如果时间也很重要，你也可以指定时间。


    ```

    var d = new Date("July 21, 1983 13:25:00");

    ```


    注意指定时间的形式：日期后面没有逗号。使用 24 小时制。小时、分钟、秒之间用冒号分隔。


    > 本章的交互式编程练习请访问：

    > [`www.ASmarterWayToLearn.com/js/33.html`](http://www.ASmarterWayToLearn.com/javascript/33.html)


    ## 34 更改日期和时间的元素


    你可以更改 `Date` 对象的各个元素。以下是总结：


    ![](img/00016.jpg)


    `setFullYear` 设置现有 `Date` 对象的年份，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setFullYear(2001);

    ```


    第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的年份更改为 2001，保持 `Date` 对象的所有其他元素不变。


    `setMonth` 设置现有 `Date` 对象的月份，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setMonth(11);

    ```


    第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的月份更改为 11（十二月），保持 `Date` 对象的所有其他元素不变。


    `setDate` 设置现有 `Date` 对象的当月日期，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setDate(15);

    ```


    第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的日期更改为当月 15 日，保持 `Date` 对象的所有其他元素不变。


    `setHours` 设置现有 `Date` 对象的小时数，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setHours(13);

    ```


    第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的小时数更改为 13 时（下午 1 点），保持 `Date` 对象的所有其他元素不变。


    `setMinutes` 设置现有 `Date` 对象的分钟数，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setMinutes(05);

    ```


    第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的分钟数更改为 5 分，保持 `Date` 对象的所有其他元素不变。


    `setSeconds` 设置现有 `Date` 对象的秒数，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setSeconds(55);

    ```


    第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的秒数更改为 55 秒，保持 `Date` 对象的所有其他元素不变。


    `setMilliseconds` 设置现有 `Date` 对象的毫秒数，而不更改其他任何元素。


    ```

    1 var d = new Date();

    2 d.setMilliseconds(867);

    ```


