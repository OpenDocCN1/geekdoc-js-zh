  trans: "\n\n第 1 行创建一个新的`Date`对象，表示当前时刻。  \n第 2 行将`Date`对象的毫秒数改为秒后的 867 毫秒，同时保持`Date`对象的其他元素不变。\n\
    \n> 查找本章的交互式编程练习，请访问：  \n> [`www.ASmarterWayToLearn.com/js/34.html`](http://www.ASmarterWayToLearn.com/javascript/34.html)\n\
    \n## 函数\n\n函数是一段 JavaScript 代码块，每当调用它的名称时，它会自动重复执行相同的操作。它节省了重复编码的工作，并使代码更易于理解。\n\
    \n在你的网站上，假设有几个页面需要显示一个提示框，告诉用户当前时间。（为简单起见，我们使用 24 小时制，而不转换为上午和下午。）代码可能如下所示：\n\n\
    ```javascript\n1 var now = new Date();\n2 var theHr = now.getHours();\n3 var theMin\
    \ = now.getMinutes();\n4 alert(\"time: \" + theHr + \":\" + theMin);\n```\n\n\
    你可以在每次需要时反复编写这段代码块。或者，你可以将其编写为一个函数，并给它命名，比如`tellTime`。之后，只需以下代码即可执行整个代码块：\n\n\
    `tellTime();`\n\n每当 JavaScript 看到这个简短的语句时，时间显示代码块就会执行。\n\n以下是将上述一次性代码封装为可重复使用函数的方式：\n\
    \n```javascript\n1 function tellTime() {\n2   var now = new Date();\n3   var theHr\
    \ = now.getHours();\n4   var theMin = now.getMinutes();\n5   alert(\"Current time:\
    \ \"+ theHr + \":\" + theMin);\n6 }\n```\n\n时间显示代码——即创建`Date`对象、提取时间、格式化并显示提示框的代码——与我们开始时完全一样，但现在被封装成了一个函数。以下是各部分说明：\n\
    \n1. 第 1 行是一个声明语句，包含：\n   - 关键字`function`\n   - 我为函数起的名称\n   - 标识其为函数的括号\n   -\
    \ 用于包裹执行代码的左花括号\n2. 第 2 至 5 行是之前见过的相同代码块，但为了清晰进行了缩进。缩进多少因人而异。我训练你缩进 2 个空格。\n3.\
    \ 第 6 行是单独一行的右花括号，用于包裹执行代码。\n\n再次注意，调用代码——即调用函数的代码——只需写出函数名称及其括号。\n\n`tellTime();`\n\
    \n你可以为函数指定任何合法的变量名，然后加上括号。函数命名遵循与变量命名相同的规则，因为从技术上讲，函数也是一种变量。当你后续章节了解更多关于函数的知识时，这一点会更容易理解。\n\
    \n函数和调用它们的语句可能相隔数千行代码。通常，函数与主代码位于同一位置——在外部 JavaScript 文件中、HTML body 部分的末尾或 HTML\
    \ head 部分中。通常，所有函数应位于主代码之前，这样当主代码调用它们时，它们已经加载到内存中并准备就绪。\n\n> 查找本章的交互式编程练习，请访问：\
    \  \n> [`www.ASmarterWayToLearn.com/js/35.html`](http://www.ASmarterWayToLearn.com/javascript/35.html)\n\
    \n### 函数：向它们传递数据\n\n函数是一段代码块，每当调用其名称时，它会自动执行某些操作。例如，当你编写`greetUser();`时，一个同名的函数就会执行。需要明确的是：我这里讨论的函数是你自己编写并命名的。\n\
    \n假设当你编写`greetUser();`时，会调用一个函数，该函数显示一个提示框，内容为“Hello, there.”\n\n这是该函数的代码：\n\n\
    ```javascript\n1 function greetUser() {\n2   alert(\"Hello, there.\");\n3 }\n\
    ```\n\n函数的一个非常实用的特性是，调用代码中的括号不必为空。如果你在括号内放入一些数据，就可以将这些数据传递给函数，并在函数执行时使用。\n\n假设，不写`greetUser();`，而是写...\n\
    \n`greetUser(\"Hello, there.\");`\n\n现在，你不仅调用了函数，还向它传递了数据。括号内的字符串，即你传递的数据，被称为参数（argument）。\n\
    \n现在函数更加灵活了，因为它显示的消息不再硬编码在函数内部。它将显示你通过调用代码中的参数传递给它的任何消息。\n\n为了使函数成为一个可编程的机器人，而不是一个只能做单一工作的机器人，你需要设置它来接收你传递的数据。以下是实现方法：\n\
    \n```javascript\n1 function greetUser(greeting) {\n2   alert(greeting);\n3 }\n\
    ```\n\n现在，我们填充了调用代码和函数定义的括号。调用代码的括号内包含一个参数（argument）。在示例中，参数是字符串\"Hello, there.\"\
    。并且，如上面的示例所示，函数定义的括号内包含一个变量`greeting`。\n\n函数语句中括号内的变量被称为参数（parameter）。参数名称由你决定。你可以给它任何合法的变量名。然后你可以在函数体中使用它来完成某些操作。在上面的示例中，第\
    \ 2 行我用它来指定`alert`中的消息。\n\n当变量在函数定义中用作参数时，无需声明它。当用作参数时，声明是隐式的。\n\n调用函数语句中的参数（argument）——\"\
    Hello, there.\"——是传递给函数的数据。函数定义括号内的参数（parameter）捕获传递的数据。现在它持有\"Hello, there.\"\
    。换句话说，函数调用中指定的字符串\"Hello, there\"被赋值给函数中的`greeting`。然后该变量`greeting`被用于指定 alert\
    \ 语句中的消息。\n\n传递给函数的值在函数体中被用来完成某些操作。在这个例子中，该值用于指定 alert 中的消息。\n\n在示例中，参数是一个字符串，但它也可以是一个变量。在下面的代码中，我声明了变量`greeting`并赋值为\"\
    Hello, there.\"。然后，我没有在函数调用中使用字符串本身作为参数，而是使用了变量。\n\n```javascript\n1 var greeting\
    \ = \"Hello, there.\";\n2 greetUser(greeting);\n```\n\n在上面的示例中，函数名`greetUser`与参数名`greeting`部分相同，但这只是为了便于理解代码。函数名和参数名不必有任何共同之处。请记住，只要遵循变量命名规则，这些名称由你决定。\n\
    \n在示例中，我将调用代码中的参数命名为`greeting`，也将函数代码中的参数命名为`greeting`。但这也不是必须的。它们不必匹配。无论参数（argument）的名称是什么，它都会被参数（parameter）接受，无论参数（parameter）的名称是什么。在下面的代码中，变量`whatever`是参数（argument）。参数（parameter）`greeting`与名称不匹配，但仍然捕获了值。\n\
    \n以下是函数，再次使用参数`greeting`：\n\n```javascript\n1 function greetUser(greeting) {\n\
    2   alert(greeting);\n3 }\n```\n\n以下是调用函数的语句，使用参数`whatever`：\n\n```javascript\n\
    1 var whatever = \"Hello, there.\";\n2 greetUser(whatever);\n```\n\n参数（argument）的名称和参数（parameter）的名称不匹配是可以的。参数（parameter）仍然捕获了参数（argument），即字符串\"\
    Hello, there.\"。\n\n尽管如此，为了清晰起见，通常让参数（argument）和参数（parameter）同名是有意义的。\n\n"
- fmt: "\n# Functions: Passing Arguments and Returning Data\n\nA number, either a\
    \ literal number or a number represented by a variable, can be an argument. In\
    \ the following code I declare the variable `almostAMil` and assign the number\
    \ 999999 to it. Then I use `almostAMil` as the argument in the function call.\n\
    \n```javascript\nvar almostAMil = 999999;\nshowBigNum(almostAMil);\n```\n\nAlternatively,\
    \ if I wanted to, I could use the literal number 999999 as the argument.\n\n```javascript\n\
    showBigNum(999999);\n```\n\nYou can pass any number of arguments, separated by\
    \ commas, to a function. Typically, the function has the same number of parameters,\
    \ also separated by commas. (There are rare exceptions for special cases.) Again,\
    \ when you use variables as arguments, their names don't have to match the names\
    \ of the parameters. JavaScript matches up arguments and parameters according\
    \ to their order, not their names. The first argument in the list is passed to\
    \ the first parameter in the list, the second argument is passed to the second\
    \ parameter, and so on.\n\nAs arguments, you can use any combination of variables,\
    \ strings, and literal numbers. In the following example, the calling code passes\
    \ a variable, a string, and a number to the function. Three parameters catch the\
    \ values. The function concatenates them to create an alert message.\n\nFirst,\
    \ here's the function.\n\n```javascript\nfunction showMessage(m, string, num)\
    \ {\n  alert(m + string + num);\n}\n```\n\nNow here's the statement that calls\
    \ the function.\n\n```javascript\nvar month = \"March\";\nshowMessage(month, \"\
    's winner number is \", 23);\n```\n\nThe argument `month`, a variable, is passed\
    \ to the parameter `m`. The argument `\"'s winning number is \"`, a string, is\
    \ passed to the parameter `string`. The argument `23`, a literal number, is passed\
    \ to the parameter `num`.\n\nWhen the code executes, an alert displays saying,\
    \ \"March's winning number is 23.\"\n\nNormally, you'd use all the parameters\
    \ included in the function definition as variables in the code that executes,\
    \ because, why else would you want them in the function definition? But there's\
    \ nothing that says you must use them all. And you certainly don't have to use\
    \ them in the same order in which they appear within the parentheses. Each one\
    \ is a full-fledged variable that, within the function, you can use the way you'd\
    \ use any variable.\n\n> Find the interactive coding exercises for this chapter\
    \ at:\n> [http://www.ASmarterWayToLearn.com/js/36.html](http://www.ASmarterWayToLearn.com/javascript/36.html)\n\
    \n## Passing Data Back from Functions\n\nAs you learned in the last chapter, a\
    \ function becomes more versatile when you pass data to it so it can deliver a\
    \ custom job. But a function can do even more. It can pass data back to the calling\
    \ code.\n\nLet's say you charge a minimum shipping rate of $5, plus 3 percent\
    \ of the merchandise total above $50, up to $100. You offer free shipping when\
    \ the total hits $100. Here's the code that calculates the order total.\n\n```javascript\n\
    var orderTot;\nif (merchTot >= 100) {\n  orderTot = merchTot;\n}\nelse if (merchTot\
    \ < 50.01) {\n  orderTot = merchTot + 5;\n}\nelse {\n  orderTot = merchTot + 5\
    \ + (.03 * (merchTot - 50));\n}\n```\n\nIf the merchandise total is at least $100,\
    \ the order total is the same as the merchandise total. If the merchandise total\
    \ is $50 or less, the order total is the merchandise total plus $5. If the order\
    \ total is between $50 and $100, the order total is the merchandise total plus\
    \ $5 plus 3 percent of the amount over $50.\n\n- Something costing $150 is $150\
    \ total.\n- Something costing $15 is $20 total.\n- Something costing $70 is $75.60\
    \ total.\n\nHere's how we turn the code above into a function.\n\n```javascript\n\
    function calcTot(merchTot) {\n  var orderTot;\n  if (merchTot >= 100) {\n    orderTot\
    \ = merchTot;\n  }\n  else if (merchTot < 50.01) {\n    orderTot = merchTot +\
    \ 5;\n  }\n  else {\n    orderTot = merchTot + 5 + (.03 * (merchTot - 50));\n\
    \  }\n  return orderTot;\n}\n```\n\nThe thing to focus on here is that we declare\
    \ a variable `orderTot`, and then—here's what's new—after the processing is done\
    \ and the merchandise total is known, the function returns the value held in `orderTot`\
    \ to the calling code via the `return` statement. It passes data back.\n\nBut\
    \ then the calling code needs something to catch the data. What else could this\
    \ something be but a variable? Here's the code that calls the function.\n\n```javascript\n\
    var totalToCharge = calcTot(79.99);\n```\n\nIf you're new to coding, this statement\
    \ may look odd to you. How can a function be assigned to a variable? You may be\
    \ used to seeing a literal value assigned to a variable...\n\n```javascript\n\
    var totalToCharge = 85.00;\n```\n\nYou may be used to seeing a variable assigned\
    \ to a variable...\n\n```javascript\nvar totalToCharge = merchTotal;\n```\n\n\
    And you may be used to seeing an arithmetic or other expression assigned to a\
    \ variable...\n\n```javascript\nvar totalToCharge = merchTotal + ship + tax;\n\
    ```\n\nBut assigning a function to a variable? Well, it's not really that odd,\
    \ because, remember, what you're actually assigning to the variable is the value\
    \ passed back by the `return` statement in the function code. The statement `var\
    \ totalToCharge = calcTot(79.99);` is shorthand for: \"Assign to the variable\
    \ `totalToCharge` the value returned by the function `calcTot`.\"\n\nSo now there's\
    \ two-way communication between the calling code and the function. The calling\
    \ code passes the value `79.99` to the function, which is caught by the function's\
    \ parameter `merchTot`. This variable `merchTot` is used in the body of the function\
    \ to calculate an order total. Then, through the `return` statement, that order\
    \ total is passed back to `totalToCharge` in the calling code. It's a complete\
    \ circle.\n\nNotice that the variable in the calling code `totalToCharge` that\
    \ catches the value is different from the variable inside the function `merchTot`\
    \ that returns the value. I did this purposely, so you wouldn't think the two\
    \ variables have to share the same name. The same applies to the variable that's\
    \ returned from a function and the variable in the calling code that catches it.\
    \ They can share the same name, but don't have to.\n\n## Using Functions as Expressions\n\
    \nAnywhere you can use a variable, you can use a function. (Technically, a function\
    \ is a variable.) For example:\n\nYou can use a function to specify the message\
    \ in an alert.\n\n```javascript\nalert(calcTot(79.99));\n```\n\nIn the example\
    \ above, the alert message is the value returned by the function `calcTot` when\
    \ the function is passed `79.99` as a parameter.\n\nYou can use a function in\
    \ an expression.\n\n```javascript\nvar orderTot = merchTot + calcTax(merchTot);\n\
    ```\n\nIn the example above, the value assigned to `orderTot` is the sum of `merchTot`\
    \ and the value returned by the function `calcTax` when the function is passed\
    \ `merchTot` as an argument.\n\nYou can use a function in a function call.\n\n\
    ```javascript\nvar tot = calc(merchTot, calcTax(merchTot));\n```\n\nIn the example\
    \ above, the calling code passes two arguments to the function `calc`. The first\
    \ argument is `merchTot`. The second argument is the function `calcTax`, which\
    \ is also passed `merchTot`.\n\nWithin a function, you can call another function.\n\
    \n```javascript\nfunction calcTot(price) {\n  return price + calcShip(price);\n\
    }\n```\n\nIn the example above, the function `calcTot` calls the function `calcShip`.\
    \ It passes `price` as an argument and receives the shipping charge back. It adds\
    \ the shipping charge to the price, and returns the sum to the original calling\
    \ code as a total.\n\nYou've learned that you can pass any number of arguments\
    \ to any number of parameters. Unfortunately, you don't have this flexibility\
    \ in the `return` statement. No matter how many parameters it takes or how much\
    \ processing it does, a function can return only a single value to the code that\
    \ calls it.\n"
