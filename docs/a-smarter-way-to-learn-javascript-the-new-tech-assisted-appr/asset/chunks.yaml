    If you need the `Date` object to be a string, you can convert it to one the same
    way you convert a number to a string.


    ```

    var dateString = rightNow.toString();

    ```


    The code above converts the `Date` object represented by the variable `rightNow`
    to a string and assigns the string to the variable `dateString`.


    Most of the time, you''ll just want to extract some of the information from the
    `Date` object without converting it to a string.


    I''m going to show you how to extract the individual pieces of the `Date` object.
    In this chapter I''ll get you started with the first piece. In the next chapter
    I''ll cover the rest.


    The following code creates a new `Date` object, assigns it to the variable `rightNow`,
    extracts the day of the week, and assigns the day of the week to the variable
    `theDay`.


    ```

    1 var rightNow = new Date();

    2 var theDay = rightNow.getDay();

    ```


    In the diagram of the `Date` object that I showed you above, the day of the week
    was represented as "Mon." But when you extract the day of the week from the object,
    it''s represented as a number. Days are designated by a number from 0 for Sunday
    through 6 for Saturday. This means that you''ll need a bit of code to convert
    it back into a day name like "Mon."


    ```

    1 var dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    2 var now = new Date();

    3 var theDay = now.getDay();

    4 var nameOfToday = dayNames[theDay];

    ```


    Here''s what''s going on:


    1.  Creates an array of days starting with "Sun" and assigns it to `dayNames`.

    2.  Creates a new `Date` object and assigns it to `now`.

    3.  Extracts the day of the week as a number and assigns it to `theDay`.

    4.  Uses the day number as an index to specify the correct array element, i.e.
    the day name.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/31.html](http://www.ASmarterWayToLearn.com/javascript/31.html)


    ## 32 Extracting parts of the date and time


    Here''s a summary of important methods for extracting pieces of the `Date` object.


    ![](images/00015.jpg)


    I covered `getDay` in the last chapter. Let''s look at the rest of the extraction
    methods. Like `getDay`, `getMonth` gives you not the spelled-out name of the month
    shown in the `Date` object, but a number. The following code produces a month
    number ranging from 0 for January through 11 for December.


    ```

    1 var d = new Date();

    2 var currentMonth = d.getMonth();

    ```


    `getDate` gives you a number for the day of the month.


    ```

    var dayOfMonth = d.getDate();

    ```


    `getFullYear` gives you a 4-digit number for the year.


    ```

    var currYr = d.getFullYear();

    ```


    `getHours` gives you a number from 0 through 23 corresponding to midnight through
    11 p.m.


    ```

    var currentHrs = d.getHours();

    ```


    `getMinutes` gives you a number from 0 through 59.


    ```

    var currMins = d.getMinutes();

    ```


    `getSeconds` gives you a number from 0 through 59.


    ```

    var currSecs = d.getSeconds();

    ```


    `getMilliseconds` gives you a number from 0 through 999.


    ```

    var currMills = d.getMilliseconds();

    ```


    `getTime` gives you the number of milliseconds that have elapsed since midnight,
    Jan. 1, 1970.


    ```

    var millsSince = d.getTime();

    ```


