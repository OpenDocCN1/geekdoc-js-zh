  trans: "\n\n> 本章的交互式编程练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/66.html`](http://www.ASmarterWayToLearn.com/javascript/66.html)\n\
    \n# 67 DOM：添加节点\n\n利用 DOM 层级结构，你可以在文档的 head 或 body 部分的任何位置添加元素节点、属性节点和文本节点。本章你将学习如何创建一个段落节点，为其添加属性，并填充文本内容。下一章你将学习如何将该段落及其属性和文本内容插入到页面中。\n\
    \n第一步是创建段落节点。\n\n```\nvar nodeToAdd = document.createElement(\"p\");\n```\n\n\
    该示例创建了一个段落元素。要创建一个 `div` 元素，你可以在括号中放入 `\"div\"`。要创建一个图片元素，则放入 `\"img\"`。要创建一个链接，则放入\
    \ `\"a\"`，以此类推。\n\n下面是一条创建图片元素的语句。\n\n```\nvar imgNodeToAdd = document.createElement(\"\
    img\");\n```\n\n在上一章中，你学习了如何使用 `setAttribute` 为已存在于网页中的元素添加属性。对于已创建但尚未放入文档 body\
    \ 中的元素，你也可以执行同样的操作。\n\n```\nnodeToAdd.setAttribute(\"class\", \"regular\");\n\
    ```\n\n上面的代码为你刚刚创建的新段落元素赋予了 `\"regular\"` 类。如果你愿意，还可以通过单独的语句为该段落元素添加更多属性——例如 `span`、`style`，甚至\
    \ `id`。\n\n如果该元素是 `<img>` 元素，你可以添加 `border` 或 `alt` 作为属性。如果是 `<a>` 元素，则可以添加网址。\n\
    \n这条语句为图片元素添加了一个 `border` 属性。\n\n```\nimgNodeToAdd.setAttribute(\"border\", \"\
    1\");\n```\n\n上面的代码为图片设置了 1 像素的边框。\n\n请记住，目前我们只是在创建节点。新的属性节点已经连接到新的元素节点，但我们还没有将这些节点添加到页面中。\n\
    \n回到段落元素，我们已经创建了它并为其添加了 `class` 属性。现在让我们给它一些文本内容。同样，我们首先创建所需的节点。\n\n```\nvar newTxt\
    \ = document.createTextNode(\"Hello!\");\n```\n\n上面的语句创建了一个内容为 `\"Hello!\"` 的文本节点。\n\
    \n接下来，我们将文本放入段落元素中。\n\n```\nnodeToAdd.appendChild(newTxt);\n```\n\n上面的语句将内容为 `\"\
    Hello!\"` 的新文本节点添加到新的段落节点中。\n\n现在，我们有了一个带有 `class` 属性和文本内容的新段落节点。接下来就可以将其插入到页面中了。\n\
    \n> 本章的交互式编程练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/67.html`](http://www.ASmarterWayToLearn.com/javascript/67.html)\n\
    \n# 68 DOM：插入节点\n\n在上一章中，你学习了如何通过先创建文本节点，然后使用 `appendChild` 将该节点附加到元素上来为元素添加文本内容。当然，你也可以使用同样的方法将段落元素本身（无论是否填充内容）附加到父节点上，例如\
    \ body 或某个 `div`。下面这组语句定位了一个 `div`（第 1 行），创建了一个新的段落元素（第 2 行），创建了要放入其中的文本（第 3 行），将文本放入段落中（第\
    \ 4 行），然后将段落元素及其文本内容附加到目标 `div` 中（第 5 行）。\n\n```\n1 var parentDiv = document.getElementById(\"\
    div1\");\n2 var newParagraph = document.createElement(\"p\");\n3 var t = document.createTextNode(\"\
    Hello world!\");\n4 newParagraph.appendChild(t);\n5 parentDiv.appendChild(newParagraph);\n\
    ```\n\n当你像上面的示例那样通过将节点作为子节点附加到父节点来将其添加到网页中时，局限性在于你无法控制新元素在父节点的子节点中的位置。JavaScript\
    \ 总是将其放在末尾。例如，如果上面的 `div` 中已经有三个段落，那么新段落将成为第四个，即使你希望将其放在更靠前的位置。\n\n解决方案是使用 `insertBefore`。\n\
    \n例如，假设你希望该段落成为 `div` 中的第一个段落，而不是最后一个。\n\n```\n1 var parentDiv = document.getElementById(\"\
    div1\");\n2 var newParagraph = document.createElement(\"p\");\n3 var t = document.createTextNode(\"\
    Hello world!\");\n4 newParagraph.appendChild(t);\n5 paragraph1 = parentDiv.firstChild;\n\
    6 parentDiv.insertBefore(newParagraph, paragraph1);\n```\n\n上面的示例选择了父元素的一个子节点作为目标（第\
    \ 5 行），并告诉 JavaScript 将新元素及其文本内容插入到该元素之前（第 6 行）。\n\n并没有一个名为 `insertAfter` 的方法。但你仍然可以实现同样的效果。只需在目标节点的下一个兄弟节点之前执行\
    \ `insertBefore` 即可。\n\n```\n1 var target = parentDiv.childNodes[1];\n2 parentDiv.insertBefore(newE,\
    \ target.nextSibling);\n```\n\n通过将新节点插入到第二个子节点的下一个兄弟节点之前，你就将新节点插入到了第二个子节点之后。\n\
    \n要移除节点，请使用 `removeChild`。\n\n```\n1 var parentDiv = document.getElementById(\"\
    div1\");\n2 var nodeToRemove = parentDiv.childNodes[2];\n3 parentDiv.removeChild(nodeToRemove);\n\
    ```\n\n> 本章的交互式编程练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/68.html`](http://www.ASmarterWayToLearn.com/javascript/68.html)\n\
    \n# 69 对象\n\n我相信你见过这样的表格，它比较了某个虚拟主机提供的不同套餐。\n\n![](img/00004.jpg)\n\n如果你想在 JavaScript\
    \ 中使用这些数据，你可以将每个值赋给不同的变量，就像这样。\n\n```\n1  var plan1Name = \"Basic\";\n2  var plan1Price\
    \ = 3.99;\n3  var plan1Space = 100;\n4  var plan1Data = 1000;\n5  var plan1Pages\
    \ = 10;\n6  var plan2Name = \"Professional\";\n7  var plan2Price = 5.99;\n8  var\
    \ plan2Space = 500;\n9  var plan2Data = 5000;\n10 var plan2Pages = 50;\n11 var\
    \ plan3Name = \"Ultimate\";\n12 var plan3Price = 9.99;\n13 var plan3Space = 2000;\n\
    14 var plan3Data = 20000;\n15 var plan3Pages = 500;\n```\n\n完成所有这些变量赋值后，你就可以编写如下\
    \ JavaScript 语句：\n\n```\nalert(\"The cost of the \" + plan2Name + \" package is\
    \ $\" + plan2Price + \" per month.\");\n```\n\n……然后会弹出一个提示框，显示“The cost of the\
    \ Professional package is $5.99 per month.”\n\n但是，将所有这些值赋给变量显得笨重，而且如果情况变得复杂，可能会引发问题。更好的处理方式是创建带有属性的对象。这种方案更便捷，也能更准确地反映我们最初那个主机公司表格的二维网格特性。下面的表格展示了所有选项以对象和属性的形式表示。\n\
    \n![](img/00008.jpg)\n\n在这个例子中，每个托管计划都是一个对象——`plan1`、`plan2`、`plan3`。每个对象有 5 个属性——`name`、`cost`、`space`、`transfer`\
    \ 和 `pages`。属性就是附加到对象上的变量。这里，每个对象有一个字符串属性（`name`）和四个数值属性（`price`、`space`、`transfer`\
    \ 和 `pages`）。\n\n在代码中，我们使用点表示法来引用对象及其属性。下面是创建上述提示框的语句，其中用对象-属性对替换了简单的变量。\n\n```\n\
    alert(\"The cost of the \" + plan2.name + \" package is $\" + plan2.price + \"\
    \ per month.\");\n```\n\n`plan2.name` 代表 `\"Professional\"`。`plan2.price` 代表 `5.99`。\n\
    \n定义对象及其属性最直接的方式如下：\n\n```\n1 var plan1 = {\n2   name: \"Basic\",\n3   price:\
    \ 3.99,\n4   space: 100,\n5   transfer: 1000,\n6   pages: 10\n7 };\n```\n\n需要注意的事项：\n\
    \n*   代码以变量定义开始，使用关键字 `var`，后跟对象名称，然后是等号。\n*   但接下来，不是值，而是一个花括号，其另一半位于代码块的末尾。\n\
    \n"
- fmt: "\n* Each property begins with a name, followed by a colon, and then a value.\n\
    * Each property definition except the last ends with a comma.\n* The closing curly\
    \ bracket is followed by a semicolon, because of the equal sign in the first line.\n\
    \nNow let's add one more property, `discountMonths`. If the current month is July,\
    \ August, or December, the customer gets a 20 percent discount on the hosting\
    \ plan. To keep track of those special months, we'll assign them to a new property.\
    \ This new property is an array, not a simple variable.\n\n`plan1.discountMonths\
    \ = [6, 7, 11];`\n\nThe statement above creates a new property of the object `plan1`,\
    \ `discountMonths`, and assigns an array to it representing the three months when\
    \ the customer gets a discount.\n\nYou refer to the individual elements of this\
    \ array property the same way you'd refer to the elements of any array, with a\
    \ number inside brackets, but using the dot notation of the object-property pair,\
    \ `plan1.discountMonths`.\n\n`var mo = plan1.discountMonths[2];`\n\nThe statement\
    \ above assigns the third element of the array, the number representing December,\
    \ to the variable `mo`.\n\nSo far, we've defined only one object, `plan1`, and\
    \ its properties. To complete the set of objects that includes `plan2` and `plan3`,\
    \ you'd have to do the same thing again, and then again. You may be thinking that\
    \ this all takes more work than just defining 15 simple variables as I did early\
    \ in the chapter, but defining objects and their properties is actually a better\
    \ way to go, for reasons that I'll discuss in later chapters. Plus, there's a\
    \ less labor-intensive way to go about it, which you'll also learn.\n\n> Find\
    \ the interactive coding exercises for this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/69.html](http://www.ASmarterWayToLearn.com/javascript/69.html)\n\
    \n# 70 Objects: Properties\n\nTo change the value of an object's number value,\
    \ use a simple assignment statement, the same way you'd assign a value to a plain\
    \ variable.\n\n`deal3.cost = 79.95;`\n\nWhatever the value of `deal3.cost` was,\
    \ now it's 79.95.\n\nOf course, you can assign a string instead of a number.\n\
    \n`deal3.name = \"Super-saver\";`\n\nWhatever the value of `deal3.name` was, now\
    \ it's \"Super-saver\".\n\nYou can also assign an array list to a property.\n\n\
    `deal3.features = [\"Guarantee\", \"Free Ship\"];`\n\nWhatever the value of `deal3.features`\
    \ was, now it's an array with the elements \"Guarantee\" and \"Free Ship.\"\n\n\
    You can also assign a Boolean value.\n\n`deal3.membersOnly = false;`\n\nWhatever\
    \ the value of `deal3.membersOnly` was, now it's `false`.\n\nYou can also use\
    \ an assignment statement to define a new property for an object. Suppose the\
    \ object `deal3` has some properties, but none of them are `deal3.market`. Now\
    \ you want to add it, while assigning it a value.\n\n`deal3.market = \"regional\"\
    ;`\n\nJust as you can create an undefined variable by not assigning it a value,\
    \ you can create an object without any properties.\n\n`var deal4 = {};`\n\nIf\
    \ you want to create a property now and assign it a value later, you can create\
    \ it with a value of `undefined`.\n\n`deal3.market = undefined;`\n\nNote that\
    \ the keyword `undefined` isn't in quotation marks. It isn't a string.\n\nYou\
    \ can delete a property of an object.\n\n`delete deal3.market;`\n\nYou can check\
    \ to see if a property of an object exists. The following statement tests whether\
    \ there is such a thing as `deal3.market` and assigns the result (true or false)\
    \ to the variable `propertyExists`.\n\n`propertyExists = \"market\" in deal3;`\n\
    \nThings to notice:\n\n* You could use any legal variable name instead of `propertyExists`.\n\
    * The keyword `in` asks, \"The property `market` is in the object `deal3`—true\
    \ or false?\"\n* The property `market` is in quotes.\n* The object `deal3` is\
    \ not in quotes.\n\n> Find the interactive coding exercises for this chapter at:\n\
    > \n> [http://www.ASmarterWayToLearn.com/js/70.html](http://www.ASmarterWayToLearn.com/javascript/70.html)\n\
    \n# 71 Objects: Methods\n\nLet's return to the chart showing different hosting\
    \ plans.\n\n![](images/00010.jpg)\n\nWe're going to write a function that calculates\
    \ the annual charge based on this chart. Note that if the user signs up at certain\
    \ times of the year, he gets a discount for the entire year. If he signs up for\
    \ the Basic plan in July or August, he gets 20 per cent off. If he signs up for\
    \ the Professional plan in July, August, or December, he gets 20 per cent off.\
    \ If he signs up for the Ultimate plan in July or August, he gets 20 per cent\
    \ off.\n\nWe begin by creating three objects with properties. This is the object\
    \ and its properties that represent the Basic plan.\n\n```\nvar plan1 = {\n  name:\
    \ \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer: 1000,\n  pages: 10,\n\
    \  discountMonths: [6, 7]\n};\n```\n\nThe function cycles through all the discount\
    \ months (line 5) checking to see if any of them happen to be the current month\
    \ (line 6). If so, it calculates a 20 percent discount by multiplying the regular\
    \ price by .8. Then it multiplies the monthly price, discounted or not, by 12,\
    \ to get the annual price, and returns the number to the calling code (line 11).\n\
    \n```\nfunction calcAnnual() {\n  var bestPrice = plan1.price;\n  var currDate\
    \ = new Date();\n  var thisMo = currDate.getMonth();\n  for (var i = 0; i < plan1.discountMonths.length;\
    \ i++) {\n    if (plan1.discountMonths[i] === thisMo) {\n      bestPrice = plan1.price\
    \ * .8;\n      break;\n    }\n  }\n  return bestPrice * 12;\n}\n```\n\nThis is\
    \ the calling statement that executes the function.\n\n`var annualPrice = calcAnnual();`\n\
    \nBut now let's make the function more flexible so the discount rate can vary,\
    \ depending on the value that the calling statement passes to it. Here's the revision,\
    \ with the percentage to be charged, passed to the parameter `percentIfDisc`,\
    \ if the user qualifies for a discount.\n\n```\nfunction calcAnnual(percentIfDisc)\
    \ {\n  var bestPrice = plan1.price;\n  var currDate = new Date();\n  var thisMo\
    \ = currDate.getMonth();\n  for (var i = 0; i < plan1.discountMonths.length; i++)\
