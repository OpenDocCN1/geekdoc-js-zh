    \ the collection to the variable `radios`. This is possible because, though an\
    \ element can't share its id with any other elements, any number of elements can\
    \ share the same name. Lines 3 and 7 loop through collection to see whether any\
    \ of the buttons is checked. If so, the code breaks out of the function with the\
    \ `return` keyword in line 5, passing back the Boolean `true` so the form can\
    \ be submitted. If the loop runs its course without finding any buttons checked,\
    \ line 8 displays an alert and line 9 returns `false`, cancelling the form submission.\n\
    \nThe function can be used to validate button sections for any number of forms\
    \ if we specify a parameter, allowing the event-handler to pass the button group\
    \ name to the function.\n\n```\n1 function validateRadios(ename) {\n2   var radios\
    \ = document.getElementsByName(eName);\n```\n\nIn order to use the function coded\
