    ## 79 Browser control: Filling the window with content


    Popup windows are the Rodney Dangerfield of browser features, thanks to their
    abuse by aggressive marketers. But they have their legitimate uses. If you plan
    to use them, you''ll have to deal with popup blockers, which you''ll learn to
    do shortly. This chapter and the next one teach you the code that creates the
    window.


    This is the basic, barebones statement.


    `var monkeyWindow = window.open();`


    The code above opens a blank window of maximum size and gives it a handle, a variable
    that refers to this particular window—in this case, `monkeyWindow`. Depending
    on the browser, the window may open on top of the previous window, in a new tab,
    or even in a new copy of the browser. You can''t control this.


    There are three ways to fill a new window with content, You can use the `write`
    method to put HTML content on the screen...


    ```

    1 var monkeyWindow = window.open();

    2 var windowContent = "<h1>Capuchin monkey</h1><img src= ''monkey.jpg''><p>The
    word capuchin derives from a group of friars<br>named the Order of Friars Minor
    Capuchin who wear<br>brown

    robes with large hoods covering their heads.</p>";

    3 monkeyWindow.document.write(windowContent);

    ```


    Here''s the line-by-line breakdown:


    1.  Opens a new window and assigns it the handle `monkeyWindow`

    2.  Assigns text to the variable `windowContent`

    3.  Fills the window with the text


    Things to notice:


    *   Inside the main quotes that enclose the whole string, any quoted text must
    be in single quotes, as in `<img src=''monkey.jpg''>`.

    *   Using the `document.write` method, you place the HTML string on the page.
    You designate the window by its handle, the variable that you declared when you
    opened the window.

    *   The `document.write` method in this example is used to fill an empty window
    with content. You could also use it to write to a window that already has content.
    But it will overwrite all the HTML of the original document, replacing its content
    entirely.

    *   Instead of assigning the HTML string to a variable and specifying the variable
    inside the parentheses, you could just put the HTML string inside the parentheses,
    enclosed in quotes of course. But this would be even more unwieldy than the example
    code.


    The second way to fill the window with content is to assign a document to it,
    as you learned to do in previous chapters.


    `monkeyWindow.location.assign("http://www.animals.com/capuchin.html");`


    ...or...


    `monkeyWindow.location.href = "http://www.animals.com/capuchin.html";`


    The third and most common way to fill the window with content is to include the
    document assignment in the statement that opens the window.


    `var monkeyWindow = window.open("http://www.animals.com/capuchin.html");`


    If the document you''re opening in the popup shares the same host and directory
    as the original document, you can just write...


    `var monkeyWindow = window.open("capuchin.html");`


    This is how you close a window.


    `monkeyWindow.close();`


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/79.html](http://www.ASmarterWayToLearn.com/javascript/79.html)


    ## 80 Browser control: Controlling the window''s size and location


    In the last chapter you learned to open a new window without parameters—a full-size
    window.


    You also learned to open a window with a single parameter—a URL.


    A second parameter that you can include is a window name.


    `var monkeyWindow = window.open("monk.html", "win1");`


    In the statement above, the second item in the parentheses, "win1", is the name.


    The name is useful for specifying the target attribute of an `<a>` or `<form>`
    element in HTML.


    Things to know:


    *   The name, used in HTML, is not the handle. The handle is used in JavaScript
    statements that write to the window, assign a URL to it, or close it. The handle
    is the variable that precedes the equal sign.

    *   The name is in quotes.

    *   The name is separated from the URL by a comma followed by a space.

    *   The name itself can''t have spaces in it.


    You can specify a URL parameter without a name parameter, but you can''t specify
    a name parameter without a URL parameter. But it is okay to specify an empty URL
    parameter, like this.


    `var monkeyWindow = window.open("", "win1");`


    Often, you''ll want to specify a window size.


    `var monkeyWindow = window.open("monk.html", "win1", "width=420,height=380");`


    Things to know:


    *   Both parameters, width and height, are enclosed by a single set of quotation
    marks.

    *   The absence of spaces within the quotation marks isn''t a mere style preference
    but a requirement. Any spaces here will break JavaScript.

    *   The numbers refer to pixels. In the example above, the window will be 420
    pixels wide and 380 pixels high.

    *   Width and height must be a minimum of 100.

    *   Unlike the URL and name parameters, the order doesn''t matter. Width can come
    before height, height can come before width. But the width-and-height set must
    come third, after URL and name.

    *   In order to specify these parameters, you must specify a URL and name, even
    if you specify empty strings.


    A window that''s smaller than the screen will display in the upper-left corner
    of the screen. But you can optionally tell the browser where to place the window.


    `var w = window.open("", "", "width=420,height=380,left=200,top=100");`


    Things to know:


    *   Again, the numbers are pixels—number of pixels from the left edge of the screen
    and number of pixels from the top of the screen.

    *   The positioning parameters are included within the same set of quotation marks
    as the size parameters, and, like the size parameters, are separated by a comma
    and no space.

    *   The parameter order within the quotation marks doesn''t matter.

    *   You can specify window size without specifying window position, but if you
