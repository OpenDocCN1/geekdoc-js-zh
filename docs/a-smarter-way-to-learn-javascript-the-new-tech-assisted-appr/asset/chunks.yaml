    \n## 49 读取字段值\n\n假设你在表单中包含了一个电子邮件字段，并将其设为必填字段。表单有一个提交按钮，用户点击该按钮以提交在表单中输入的信息。\n\
    \n以下是创建表单的标记。我对其进行了简化，省略了任何表单动作和其他属性（包括换行符），这些与当前学习内容无关。\n\n`<form>`\n\n`  Email:`\n\
    \n`  <input type=\"text\">`\n\n`  <input type=\"submit\" value=\"Submit\">`\n\n\
    `</form>`\n\n现在，在我们精简后的表单标记中，有以下三个元素：\n\n1.  文本“Email”\n2.  用于输入用户电子邮件地址的文本字段\n\
    3.  提交按钮\n\n我将为电子邮件字段添加一个 id。\n\n`<form>`\n\n`  Email:`\n\n`<input type=\"text\"\
    ` `id=\"email\"``>`\n\n`  <input type=\"submit\" value=\"Submit\">`\n\n`</form>`\n\
    \n接下来，我将使用关键字 `onSubmit` 添加一个事件处理程序。\n\n`<form` `onSubmit=\"checkAddress('email');\"\
    ``>`\n\n`  Email:`\n\n`  <input type=\"text\" id=\"email\">`\n\n`  <input type=\"\
    submit\" value=\"Submit\">`\n\n`</form>`\n\n现在，当用户点击提交按钮时，函数 `checkAddress` 会执行。请注意，尽管操作是点击提交按钮，但\
    \ `onSubmit` 事件处理程序位于 `form` 标签中，而不是提交按钮标签中。这是因为提交是一个适用于整个表单的事件，而不是提交按钮。\n\n有趣的地方来了。当表单提交时，函数\
    \ `checkAddress` 会检查用户是否在电子邮件字段中输入了内容。如果没有，该函数会显示一个警告，提醒用户电子邮件地址是必填项。\n\n为了实现这一点，函数需要一种读取电子邮件字段内容的方法。这就是我添加到字段中的\
    \ id 的作用。以下是函数的代码。\n\n```\nfunction checkAddress(fieldId) {\n  if (document.getElementById(fieldId).value\
    \ === \"\") {\n    alert(\"Email address required.\");\n  }\n}\n```\n\n如果电子邮件字段中没有值，则会显示一个警告，告知用户需要输入电子邮件地址。\n\
    \n这是你需要记住的序列：\n\n1.  关键字 `document`，后跟...\n2.  一个点，后跟...\n3.  关键字 `getElementById`，后跟...\n\
    4.  括号中的参数，即从调用代码接收到的 `fieldId`，后跟...\n5.  另一个点，后跟...\n6.  关键字 `value`\n\n请注意，`getElementById`\
    \ 必须严格使用驼峰命名法。如果你按直觉写成 `getElementByID`（大写“D”），它将无法工作。\n\n有些程序员更喜欢将字段中找到的值放入变量中，如下所示。\n\
    \n```\nfunction checkAddress(fieldId) {\n  var val = document.getElementById(fieldId).value;\n\
    \  if (val === \"\") {\n    alert(\"Email address required.\");\n  }\n}\n```\n\
    \n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/49.html`](http://www.ASmarterWayToLearn.com/javascript/49.html)\n\
    \n## 50 设置字段值\n\n用户已在表单字段中输入了她的邮政编码。你想省去她输入城市和州的麻烦。因此，当她点击离开该字段时，你为她自动填充城市字段。\n\
    \n让我向你展示如何实现。为了简化，我们假设美国只有三个邮政编码。我们还假设用户会准确无误地输入其中一个代码。我们不会检查错误。在这个例子中，JavaScript\
    \ 代码只会填充城市字段，而不填充州。以下是表单的相关标记。（我省略了表单动作、提交按钮以及所有与本章节无关的内容。）\n\n`<form>`\n\n`  ZIP:<br>`\n\
    \n`  <input type=\"text\" id=\"zip\" onBlur=\"fillCity();\"><br>`\n\n`  City:<br>`\n\
    \n`  <input type=\"text\" id=\"city\">`\n\n`</form>`\n\n当用户点击离开邮政编码字段时，`onBlur`\
    \ 事件会触发 `fillCity` 函数。代码如下。\n\n```\nfunction fillCity() {\n  var cityName;\n \
    \ var zipEntered = document.getElementById(\"zip\").value;\n  switch (zipEntered)\
    \ {\n    case \"60608\":\n      cityName = \"Chicago\";\n      break;\n    case\
    \ \"68114\":\n      cityName = \"Omaha\";\n      break;\n    case \"53212\":\n\
    \      cityName = \"Milwaukee\";\n  }\n  document.getElementById(\"city\").value\
    \ = cityName;\n}\n```\n\n这个例子表明，你不仅可以使用 `document.getElementById...` 读取字段中的值，还可以将值“写入”字段中。\n\
    \n"
