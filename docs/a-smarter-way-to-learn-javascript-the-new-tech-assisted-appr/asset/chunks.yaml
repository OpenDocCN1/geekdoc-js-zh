    # Functions: Local vs. global variables


    Now we come to the subject of variable scope. That is, the difference between
    global and local variables. Some variables have global scope, which makes them
    global variables. Other variables have local scope, which makes them local variables.
    Nothing could be simpler, but for some reason, when the subject comes up in books
    and tutorials, obfuscation often rules. Relax. This will be easy.


    A global variable is one that''s declared in the main body of your code—that is,
    not inside a function.


    A local variable is one that''s declared inside a function. It can be either a
    parameter of the function, which is declared implicitly by being named as a parameter,
    or a variable declared explicitly in the function with the `var` keyword.


    What makes a global variable global is that it is meaningful in every section
    of your code, whether that code is in the main body or in any of the functions.
    Global scope is like global fame. Wherever you go in the world, they''ve heard
    of Bill Clinton.


    A local variable is one that''s meaningful only within the function that declares
    it. Local scope is like local fame. The mayor of Duluth is known within Duluth,
    but pretty much unknown everywhere else.


    So there are two differences between global and local variables—where they''re
    declared, and where they''re known and can be used.


    ![](images/00018.jpg)


    Before I show you the first example, I want you to set aside what you know about
    passing values to a function through arguments, and passing a value back to the
    calling code by way of the `return` statement. Pretend you don''t know anything
    about these things. I''ll come back to them later. Here''s an example.


    First, in the main code, a variable declaration followed by a call to a function:


    ```javascript

    1 var theSum

    2 addNumbers();

    ```


    Then the function:


    ```javascript

    1 function addNumbers() {

    2   theSum = 2 + 2;

    3 }

    ```


    In the example, the variable `theSum` is declared in the main code. The function
    `addNumbers()` is called to assign it a value. Having been declared in the main
    code, the variable has global scope, so this function or any other function can
    use it. So can anything in the main code. The function assigns the sum of `2 +
    2` to this global variable. Since the variable has global scope, the assignment
    is meaningful in all sections of your code, both the main code and in all functions.
    The variable now has the value `4` in the function `addNumbers()`, in the main
    code, and in any other functions that use it. It doesn''t matter where I write...


    `alert(theSum);`


    Wherever I write it—in the main code, in the function `addNumbers()`, or in any
    other function, an alert will display the number `4`.


    But if I declare the variable not in the main code, but inside the function...


    ```javascript

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3 }

    ```


    ...the variable has the value `4` only inside the function. Everywhere else, it''s
    unknown. Everywhere else, it has no value at all. Since the variable `theSum`
    is declared with the keyword `var` inside the function, not in the main code,
    its scope is local. It is meaningful only inside the function. In other functions
    and in the main code, it is unknown. If I write...


    `alert(theSum);`


    ...in the function, an alert displays the number `4`, because the variable `theSum`
    is known inside the function, where it was declared. But if I write the same alert
    statement anywhere else—in the main code or in another function—the code breaks,
    because `theSum` is unknown outside the function.


    **Note:** I say that a variable has local scope when you declare it in a function.
    By "declaring it in a function" I mean that you declare the variable explicitly
    with the keyword `var`—as opposed to casually introducing it into the function
    without `var`. (The exception is if you name it as a parameter, in which case
    it''s declared implicitly as a local variable of the function.) If you get sloppy
    and begin using a new variable in the body of a function without explicitly declaring
    it in the function with the keyword `var`, it is global—even though you haven''t
    declared it anywhere in the main code.


    Now, to illustrate a point, I''m going to do something you''d actually never want
    to do in your code. I''m going to declare a variable both in the main code and
    in the function.


    First, in the main code:


    ```javascript

    1 var theSum = 1000;

    2 addNumbers();

    ```


    Then in the function:


    ```javascript

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3 }

    ```


    By declaring the variable twice—once in the main code and again in the function—I''ve
    created two different variables that share the same name. One `theSum` is global.
    The other `theSum` is local. This is not something you would ever want to do—it
    sets you up for coding mistakes and makes your code almost impossible to follow—but
    I did it to show the difference between global and local scope. By declaring `theSum`
    once in the main code, and again in the function, I''ve created (1) a global variable
    that''s useable almost everywhere and (2) a local variable of the same name that''s
    useable only inside the function. Why do I say the global variable is useable
    almost everywhere? Because it''s no good inside the function. Inside the function,
    the name `theSum` stands for a local variable, so the name can''t refer to the
    global variable. In this situation, coders say the global variable is in the shadow
    of the local variable. Inside the function, it can''t be seen. Inside the function,
    only the local variable of that name can be seen.


    The local variable `theSum` has a value of `4` inside the function, but `theSum`
    outside the function has a value of `1000`.


    Now let''s journey a little farther into Wonderland, Alice.


    First, a statement in the main code:


    ```javascript

    1 var theSum = addNumbers();

    ```


    Then a function:


    ```javascript

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3   return theSum;

    4 }

    ```


    Again, this isn''t something you''d actually code. I use the example only to demonstrate
    principles. In this code, you still have two different variables—a global variable
    and a local variable—that share the same name, `theSum`, but now, thanks to the
    `return` statement, the value of the local variable is assigned to the global
    variable. Now both variables have the same name and the same value, but they''re
    still different variables.


    Which brings us to a question you may be asking:


    If a function can use a global variable, why do you have to pass a value from
    an argument to a parameter? Why not just declare a global variable, then have
    the function use it? Well, you can, but asking functions to work with global variables
    is asking them to eavesdrop on the main code, and like human eavesdropping, it
    invites mischief in the form of confusion and unintended consequences. There is
    no controversy among coders about this. It''s always best to pass values explicitly
    to functions through arguments. Global variables have no place in functions.


    The same logic applies to the the argument for using the `return` statement. You
    can change the value of a global variable within a function. When you do, the
    value of it changes everywhere, including in the main code. No `return` is needed.
    But it''s better practice to use a local variable within the function, then pass
    that value back explicitly through a `return` statement.


