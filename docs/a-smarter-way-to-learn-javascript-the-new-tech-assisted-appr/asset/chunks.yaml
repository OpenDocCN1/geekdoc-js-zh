  trans: "\n\n第 2 行将所有名称为\"r2\"的按钮收集到一个集合中，并将该集合赋值给变量`radios`。这是可行的，因为虽然一个元素不能与其他元素共享其\
    \ id，但任意数量的元素可以共享相同的名称。第 3 行和第 7 行遍历集合，检查是否有任何按钮被选中。如果有，代码在第 5 行通过`return`关键字跳出函数，并返回布尔值`true`，以便表单可以提交。如果循环遍历完所有按钮都没有找到被选中的，第\
    \ 8 行显示一个警告，第 9 行返回`false`，取消表单提交。\n\n如果我们指定一个参数，允许事件处理程序将按钮组名称传递给函数，那么该函数可以用于验证任意数量表单的按钮部分。\n\
    \n```\n1 function validateRadios(ename) {\n2   var radios = document.getElementsByName(eName);\n\
    ```\n\n为了使用上面编写的函数，事件处理程序需要将按钮组名称作为参数传递。\n\n```\n<form onSubmit=\"return validateRadios('r1');\"\
    >\n```\n\n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/84.html`](http://www.ASmarterWayToLearn.com/javascript/84.html)\n\
    \n## 85 表单验证：邮政编码\n\n现在，一个单字段表单要求用户输入她的邮政编码。\n\n你已经学会了如何确保用户没有留空字段。但是如何测试她是否输入了正确位数的邮政编码——5\
    \ 位数字呢？\n\nHTML 提供了一种方法防止她输入过多数字：`maxlength=5`。但如果你想确保她没有输入过少数字，就需要使用 JavaScript。以下是函数。\n\
    \n```\n1 function validateZIP() {\n2   var numChars = document.getElementById(\"\
    zip\").value.length;\n3   if (numChars < 5) {\n4     alert(\"请输入 5 位数字代码。\");\n\
    5     return false;\n6   }\n7 }\n```\n\n如果字段中的字符数少于 5，则显示警告并向调用代码返回`false`，取消表单提交。\n\
    \n关于邮政编码字段输入的另一个问题是用户是否只输入了数字。以下是为此添加的额外代码。\n\n```\n1 function validateZIP() {\n\
    2   var valueEntered = document.getElementById(\"zip\").value;\n3   var numChars\
    \ = valueEntered.length;\n4   if (numChars < 5) {\n5     alert(\"请输入 5 位数字代码。\"\
    );\n6     return false;\n7   }\n8   for (var i = 0; i <= 4; i++) {\n9     var\
    \ thisChar = parseInt(valueEntered[i]);\n10    if (isNaN(thisChar)) {\n11    \
    \  alert(\"请只输入数字。\");\n12      return false;\n13    }\n14  }\n15 }\n```\n\n高亮显示的代码循环遍历已输入的五个字符，检查所有字符是否都是表示数字的字符串字符。由于字段中的五个字符是字符串字符，每个字符在测试前必须尽可能转换为数字。第\
    \ 9 行执行此操作。第 10 行测试转换是否成功。如果第 9 行的`parseInt`产生了数字，则没问题。但如果转换尝试后字符不是数字——即第 10 行中它是`isNaN`——则显示警告并返回`false`，取消表单提交。\n\
    \n![](img/00009.jpg)\n\n一种更优雅且更通用的表单验证方法是使用正则表达式。正则表达式超出了本书的范围，但我将在下一章中让你简单了解一下。\n\
    \n> 本章的交互式编码练习请访问：\n> \n> [`www.ASmarterWayToLearn.com/js/85.html`](http://www.ASmarterWayToLearn.com/javascript/85.html)\n\
    \n## 86 表单验证：电子邮件\n\n验证电子邮件字段包括检查是否包含非法字符（如空格），以及合法电子邮件地址的所有必要元素是否存在：一个或多个字符，后跟@，后跟一个或多个字符，后跟一个点，后跟两到四个字符。测试所有这些的标准方法是将用户的输入与正则表达式进行匹配。正则表达式超出了本书的范围，但我将在本章末尾让你简单了解一下。同时，这里介绍如何使用`indexOf`来避免许多用户错误。\n\
    \n让我们从检查空格开始，空格在电子邮件地址中是非法的。\n\n```\n1 function validateEmail() {\n2   var eEntered\
    \ = document.getElementById(\"email\").value;\n3   if (eEntered.indexOf(\" \"\
    ) !== -1) {\n4     alert(\"地址中不允许有空格\");\n5     return false;\n6   }\n7 }\n```\n\
    \n第 3 行是关键。如果非法空格字符的索引不是-1，则意味着该字符存在于某处，并显示警告。\n\n如果你愿意，可以用同样的方法测试所有其他非法字符的存在。但那样的话，最好使用正则表达式，正如我在本章末尾所示。\n\
    \n在电子邮件地址中，你希望@符号距离字符串开头至少一个字符，并且距离字符串结尾不超过 5 个字符。以下是将此测试添加到示例函数中的一行代码。\n\n```\n\
    1 function validateEmail() {\n2   var addressIsLegal = true;\n3   var eEntered\
    \ = document.getElementById(\"address\").value;\n4   if (eEntered.indexOf(\" \"\
    ) !== -1) {\n5     addressIsLegal = false;\n6   }\n7   if (eEntered.indexOf(\"\
    @\") < 1 || eEntered.indexOf(\"@\") > eEntered.length - 5) {\n8     addressIsLegal\
    \ = false;\n9   }\n10  if (addressIsLegal === false) {\n11    alert(\"请更正电子邮件地址\"\
    );\n12    return false;\n13  }\n14 }\n```\n\n关于第 7 行：管道左侧的第一部分测试字符是否位于地址的开头，这是非法的。管道右侧的第二部分测试@符号后面是否少于\
    \ 4 个字符。由于域名至少需要一个字符，加上一个点，再加上至少两个字符的扩展名，因此@后面少于 4 个字符是非法的。\n\n最后，我将添加一个测试，检查点号需要距离\"\
    @\"至少 1 个字符，并且后面有 2 到 4 个字符。\n\n```\n1 function validateEmail() {\n2   var addressIsLegal\
    \ = true;\n3   var eEntered = document.getElementById(\"address\").value;\n4 \
    \  if (eEntered.indexOf(\" \") !== -1) {\n5     addressIsLegal = false;\n6   }\n\
    7   if (eEntered.indexOf(\"@\") < 1 || eEntered.indexOf(\"@\") > eEntered.length\
    \ - 5) {\n8     addressIsLegal = false;\n9   }\n10  if (eEntered.indexOf(\".\"\
    ) - eEntered.indexOf(\"@\") < 2 ||\n11      eEntered.indexOf(\".\") > eEntered.length\
    \ - 3) {\n12    addressIsLegal = false;\n13  }\n14  if (addressIsLegal === false)\
    \ {\n15    alert(\"请更正电子邮件地址\");\n16    return false;\n17  }\n18 }\n```\n\n第 10\
    \ 行：点号和@之间必须至少有一个字符。管道左侧的第一部分测试是否缺少该字符（或更多），这是非法的。点号后面还必须至少有两个字符。管道右侧的第二部分测试点号后面是否少于\
    \ 2 个字符，这是非法的。\n\n![](img/00009.jpg)\n\n上面展示的所有测试以及其他更多测试都可以整合到一个正则表达式测试中。正则表达式表达了一种模式，在这种情况下，用户的输入必须匹配该模式才能通过验证。如果你熟悉通配符运算符`*`（表示\"\
    任意长度的任意字符组合\"），那么大致就是这个概念。但正则表达式远不止通配符运算符。\n\n"
- fmt: "\nRegular expressions warrant a book of their own, and are beyond the scope\
    \ of this book. But, to give you a taste of how powerful (and succinct!) they\
    \ can be, here's an example. It tests for all the illegalities that the code above\
    \ checks for, and more. (This won't be covered in the exercises for the chapter,\
    \ so don't try to memorize anything in the example.)\n\n```\nfunction validateEmail()\
    \ {\n  var eEntered = document.getElementById(\"address\").value;\n  var regex\
    \ = /^[\\w\\-\\.\\+]+\\@[a-zA-Z0-9\\. \\-]+\\.[a-zA-z0-9]{2,4}$/;\n  if (!(eEntered.match(emailCorrectPattern)))\
    \ {\n    alert(\"Please correct email address\");\n    return false;\n  }\n}\n\
    ```\n\n> Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/86.html](http://www.ASmarterWayToLearn.com/javascript/86.html)\n\
    \n## 87 Exceptions: try and catch\n\nIf you run the following code, nothing will\
    \ happen.\n\n```\nfunction greetWorld() {\n  var greeting = \"Hello world!\";\n\
    \  aler(greeting);\n}\n```\n\nThe keyword `alert`, misspelled `aler`, breaks the\
    \ code. But JavaScript doesn't tell you what's wrong. It's like a car that won't\
    \ start. Is it the battery? The fuel line? A spark plug?\n\nOf course, in the\
    \ small piece of code above, it's easy to spot the problem. But what if the function\
    \ runs 40 lines and calls three other functions? It would be nice if JavaScript\
    \ reported the specific problem to you instead of just breaking. Well, that's\
    \ what `try`...`catch` is for. Here's how it works.\n\n```\nfunction greetWorld()\
    \ {\n  try {\n    var greeting = \"Hello world!\";\n    aler(greeting);\n  }\n\
    \  catch(err) {\n    alert(err);\n  }\n}\n```\n\nThe original operational code\
    \ is wrapped in the `try` block. The mis-formed `aler` causes a JavaScript error,\
    \ which is passed to the `catch` block. An alert displays the error that caused\
    \ the problem.\n\nWhen you wrap some operational code in a `try` block, you say\
    \ to JavaScript, \"Try to execute this code. If there's an error, stop executing,\
    \ and go to the `catch` block to see what to do.\" In the example above, the error\
    \ thrown by JavaScript is assigned to the parameter `err`, and that value is displayed\
    \ in an alert:\n\n\"ReferenceError: Can't find variable: aler\"\n\nOkay, so in\
    \ this case JavaScript doesn't give you exactly the information you want. Instead\
    \ of letting you know that you left a \"t\" off the `alert` keyword, it tells\
    \ you it has encountered a variable that hasn't been defined. But close enough.\
    \ JavaScript has pointed you in the right direction.\n\nNote that `try` and `catch`\
    \ are always paired. Without `try`, an error won't trigger `catch`. Without `catch`,\
    \ JavaScript won't know what to do when it throws an error.\n\nSome more things\
    \ to keep in mind:\n\n*   The code inside the `try` and the `catch` blocks is\
    \ wrapped in curly brackets.\n*   The functional code inside the `try` block is\
    \ indented.\n*   The error parameter, in this case `err`, can take any legal variable\
    \ name.\n*   In this example, an alert displays when an error occurs. But you\
    \ could do something else.\n\nThe `try` and `catch` pair have limited usefulness.\
    \ For example, in the example above, if you omit a parenthesis, bracket, or quotation\
    \ mark, or if you have too many of them, no alert will display. The code will\
    \ just break, and nothing will happen. The `try` and `catch` approach is useful\
    \ mainly for spotting variables that haven't been defined or, as in this case,\
    \ errors that JavaScript interprets as variables that haven't been defined.\n\n\
    > Find the interactive coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/87.html](http://www.ASmarterWayToLearn.com/javascript/87.html)\n\
    \n## 88 Exceptions: throw\n\nBy adding one or more `throw` statements, you can\
    \ define your own errors in a `try`...`catch` pair. This can be useful for dealing\
    \ with wayward user behavior.\n\nSuppose you've asked the user to create a password.\
    \ It must be at least 8 to 12 characters long, must contain at least one number,\
    \ and can't contain any spaces. This is the markup that creates the form, simplified\
    \ to keep you focused on the essentials:\n\n```\n<form onSubmit=\"return checkPassword();\"\
    >\n  Enter a password<br>\n  (8-12 characters, at least 1 number, no spaces)<br>\n\
    \  <input type=\"text\" id=\"f1\">\n  <input type=\"submit\" value=\"Submit\"\
    >\n</form>\n```\n\nThis is the function that tests whether the user's input has\
