    if...else and else if statements


    The if statements you''ve coded so far have been all-or-nothing. If the condition
    tested true, something happened. If the condition tested false, nothing happened.


    `1 var x = prompt("Where does the Pope live?");`


    `2 if (x === "Vatican") {`


    `3   alert("Correct!");`


    `4 }`


    Quite often, you want something to happen either way. For example:


    `1 var x = prompt("Where does the Pope live?");`


    `2` `if (x === "Vatican") {`


    `3   alert("Correct!");`


    `4 }`


    `5` `if (x !== "Vatican") {`


    `6   alert("Wrong answer");`


    `7 }`


    In this example, we have two if statements, one testing for "Vatican," and another
    testing for not-"Vatican". So all cases are covered, with one alert or another
    displaying, depending on what the user has entered.


    The code works, but it''s more verbose than necessary. The following code is more
    concise and, as a bonus, more readable.


    `1 if (x === "Vatican") {`


    `2   alert("Correct!");`


    `3 }`


    `4` `else {`


    `5   ``alert("Wrong answer");`


    `6` `}`


    In the style convention I follow, the else part has exactly the same formatting
    as the if part.


    As in the if part, any number of statements can execute within the else part.


    `1 var correctAnswer = "Vatican";`


    `2 if (x === correctAnswer) {`


    `3   alert("Correct!");`


    `4 }`


    `5 else {`


    `6   ``score--;`


    `7   ``userIQ = "problematic";`


    `8   ``alert("Incorrect");`


    `9 }`


