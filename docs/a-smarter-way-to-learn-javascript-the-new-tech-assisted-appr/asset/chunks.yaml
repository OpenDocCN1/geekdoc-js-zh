  trans: "\n\n# 58\n\n## DOM\n\n1.  通过 id 定位表格\n2.  收集表格中所有带有 `td` 标签的元素集合\n3.  遍历所有元素，更改它们的背景颜色\n\
    \n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/57.html`](http://www.ASmarterWayToLearn.com/javascript/57.html)\n\
    \n在前几章中，你学习了两种不同的方法来定位网页组件，以便读取或设置它们。你学会了 `getElementById`，也学会了 `getElementsByTagName`。这些通常是定位元素的最佳方法，但它们也有局限性。第一种方法\
    \ `getElementById` 只能让你访问那些被分配了 id 的组件。第二种方法 `getElementsByTagName` 适合批量修改，但对于精细的“手术式”操作则略显笨拙。这两种方法都能改变网页上的内容，但都无法处理页面上的所有元素，无法创建新元素、移动现有元素或删除它们。\n\
    \n幸运的是，这两种方法只是处理文档对象模型（DOM）的众多方法中的两种。DOM 是一个组织结构图，当你的网页加载时，浏览器会自动为整个网页生成它。你网页上的所有内容——标签、文本块、图片、链接、表格、样式属性等等——都在这个组织结构图中有自己的位置。这意味着你的\
    \ JavaScript 代码只需指出某个元素在图中的位置，就能获取网页上的任何内容，任何内容都可以。更重要的是，你的 JavaScript 可以通过操作这个图来添加、移动或删除元素。如果你愿意（当然你不会这么做），你甚至可以用\
    \ JavaScript 的 DOM 方法从头开始创建整个网页。\n\n下面是一个简化的网页。我用缩进表示了层级结构中的不同级别。对于标准网页来说，DOM\
    \ 的前三个级别总是相同的。文档是第一级。文档下面是第二级，即 html。html 下面是同级的第三级，即 head 和 body。每个级别下面还有更多级别。\n\
    \n```\n第 1 级：document\n第 2 级：   <html>\n第 3 级：     <head>\n第 4 级：       <title>\n\
    第 5 级：         Simple document\n                 </title>\n               </head>\n\
    第 3 级      <body>\n第 4 级        <p>\n第 5 级          There's not much to this.\n\
    \                 </p>\n               </body>\n             </html>\n```\n\n\
    下面是同样的内容，以组织结构图的形式展示。请注意，这是一个理想化的图表，去掉了大多数浏览器在 DOM 中插入的垃圾元素。我将在后面的章节中向你展示如何清除这些垃圾元素。\n\
    \n![](img/00020.jpg)\n\n如你所见，网页上的每一个元素都被包含在内，甚至包括标题文本和段落文本。让我们通过添加一个 div 和第二个段落来让它稍微复杂一些。以下是\
    \ HTML 形式。\n\n```\n第 1 级：document\n第 2 级：   <html>\n第 3 级：     <head>\n第 4 级：\
    \       <title>\n第 5 级：         Simple document\n                 </title>\n \
    \              </head>\n第 3 级      <body>\n第 4 级        <div>\n第 5 级         \
    \ <p>\n第 6 级            There's not much to this.\n                   </p>\n第\
    \ 5 级          <p>\n第 6 级            Nor to this.\n                   </p>\n \
    \                </div>\n               </body>\n             </html>\n```\n\n\
    以及组织结构图（去除了所有垃圾元素）……\n\n![](img/00021.jpg)\n\n在公司组织结构图中，每个方框代表一个人。在 DOM 组织结构图中，每个方框代表一个节点。上面表示的\
    \ HTML 页面，在其清理后的 DOM 形式中，有 11 个节点：文档节点、html 节点、head 和 body 节点、title 节点、div 节点、两个段落节点，以及三个文本节点（一个用于标题，另外两个分别用于两个段落）。\n\
    \n在这个特定的图表中，有三种类型的节点：文档节点、元素节点和文本节点。文档节点是顶层。元素节点是 `<html>`、`<head>`、`<body>`、`<title>`、`<div>`\
    \ 和 `<p>`。文本节点是构成标题和两个段落的字符串。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/58.html`](http://www.ASmarterWayToLearn.com/javascript/58.html)\n\
    \n# 59\n\n## DOM：父节点与子节点\n\n你能说出美国第 44 任总统的第二个孩子叫什么吗？那是萨莎。那么第 43 任总统的父亲（男性）呢？没错，是乔治。\n\
    \n欢迎来到指定文档对象模型（DOM）节点最基本的方式。你可以通过说某个节点是特定父节点的第 x 个子节点来指定 DOM 中的任何节点。你也可以通过说某个节点是任何子节点的父节点来指定它。\n\
    \n看看上一章中简化的 HTML 文档。\n\n```\n第 1 级：document\n第 2 级：   <html>\n第 3 级：     <head>\n\
    第 4 级：       <title>\n第 5 级：         Simple document\n                 </title>\n\
    \               </head>\n第 3 级      <body>\n第 4 级        <div>\n第 5 级        \
    \  <p>\n第 6 级            There's not much to this.\n                   </p>\n\
    第 5 级          <p>\n第 6 级            Nor to this.\n                   </p>\n \
    \                </div>\n               </body>\n             </html>\n```\n\n\
    除了文档节点，每个节点都包含在另一个节点内。`<head>` 和 `<body>` 节点包含在 `<html>` 节点内。`<div>` 节点包含在 `<body>`\
    \ 节点内。两个 `<p>` 节点包含在 `<div>` 节点内。每个 `<p>` 节点内包含一个文本节点。\n\n当一个节点包含在另一个节点内时，我们说被包含的节点是包含它的节点的子节点。例如，`<div>`\
    \ 节点是 `<body>` 节点的子节点。相反，`<body>` 节点是 `<div>` 节点的父节点。以下是上一章的组织结构图，同样去除了垃圾元素，显示了所有父节点及其子节点。\n\
    \n![](img/00013.jpg)\n\n如你所见，`<html>` 是文档的子节点……`<head>` 和 `<body>` 是 `<html>`\
    \ 的子节点……`<div>` 是 `<body>` 的子节点……两个 `<p>` 是 `<div>` 的子节点……每个文本节点是 `<p>` 的子节点。相反，文档是\
    \ `<html>` 的父节点，`<html>` 是 `<head>` 和 `<body>` 的父节点，`<head>` 是 `<title>` 的父节点，`<title>`\
    \ 是一个文本节点的父节点，以此类推。具有相同父节点的节点称为兄弟节点。因此，`<head>` 和 `<body>` 是兄弟节点，因为 `<html>` 是它们共同的父节点。两个\
    \ `<p>` 是兄弟节点，因为 `<div>` 是它们共同的父节点。\n\n从图表底部开始，文本 \"Nor to this.\" 是 `<p>` 的子节点，`<p>`\
    \ 是 `<div>` 的子节点，`<div>` 是 `<body>` 的子节点，`<body>` 是 `<html>` 的子节点，`<html>` 是文档的子节点。\n\
    \n现在看这个标记。\n\n```\n<p>This is <em>important</em>!</p>\n```\n\n如果你为这个段落制作一个图表，你可能会认为所有文本都是\
    \ `<p>` 节点的子节点。但请记住，每个被另一个节点包含的节点都是包含它的节点的子节点。由于文本节点 \"important\" 被元素节点 `<em>`\
    \ 包含，这个特定的文本节点是 `<em>` 的子节点，而不是 `<p>` 的子节点。文本节点 \"This is \" 和 \"!\" 以及元素节点 `<em>`\
    \ 是兄弟节点，因为它们都被 `<p>` 包含。它们都是 `<p>` 的子节点。\n\n![](img/00017.jpg)\n\n> 本章的交互式编程练习请访问：\n\
    > [`www.ASmarterWayToLearn.com/js/59.html`](http://www.ASmarterWayToLearn.com/javascript/59.html)\n\
    \n# 60\n\n## DOM：查找子节点\n\n"
- fmt: "\nAs you learned in the last chapter, the Document Object Model (DOM) is a\
    \ hierarchy of parents and children. Everything on the web page, excluding the\
    \ document itself, is a child of something else. So now let's talk about how your\
    \ JavaScript code can make use of this hierarchy of parents and children to read\
    \ or change virtually anything on a web page.\n\nLet's begin with the methods\
    \ you've already learned for targeting things on the web page. You'll recall from\
    \ earlier chapters that you can target an element by specifying its `id`, if it\
    \ has one.\n\n`var eField = document.getElementById(\"email\");`\n\nThe statement\
    \ above targets the element with the `id` of `\"email\"`.\n\nYou also learned\
    \ how to make an array-like collection of all the elements of a particular kind\
    \ within the document...\n\n`var eField = document.getElementsByTagName(\"p\"\
    );`\n\nHaving made a collection of paragraphs, you can target any paragraph within\
    \ the collection so that you can, for example, read its contents.\n\n`var contents\
    \ = p[2].innerHTML;`\n\nThe statement above assigns the text string contained\
    \ within the third paragraph of the document to the variable `contents`.\n\nAn\
    \ alternative to listing all the elements of a certain kind in the document is\
    \ to narrow the focus below the document level, for example to a `div`, and then\
    \ make a collection within that `div`.\n\n```\n1 var d = document.getElementById(\"\
    div3\");\n2 var p = d.getElementsByTagName(\"p\");\n3 var contents = p[2].innerHTML;\n\
    ```\n\nIn the example above, you generate a collection not of all the paragraph\
    \ elements in the document, but only those paragraph elements within the `div`\
    \ that has an `id` of `\"div3\"`. Then you target one of those paragraphs.\n\n\
    Now consider this markup.\n\n```\n<body>\n  <div id=\"cal\">\n     <p>Southern\
    \ Cal is sunny.</p>\n     <p>Northern Cal is rainy.</p>\n     <p>Eastern Cal is\
    \ desert.</p>\n  </div>\n  <div id=\"ny\">\n     <p>Urban NY is crowded.</p>\n\
    \     <p>Rural NY is sparse.</p>\n  </div>\n</body>\n```\n\nIf you wanted to read\
    \ the contents of the last paragraph in the markup, you could write...\n\n```\n\
    1 var p = document.getElementsByTagName(\"p\");\n2 var contents = p[4].innerHTML;\n\
    ```\n\nLine 1 makes a collection of all the `<p>`s in the document and assigns\
    \ the collection to the variable `p`. Line 2 \"reads\" the text contained in the\
    \ 5th paragraph of the document.\n\nAnother approach: You could target the same\
    \ paragraph by narrowing the collection of elements to those that are just in\
    \ the second `div`.\n\n```\n1 var div = document.getElementById(\"ny\");\n2 var\
    \ p = div.getElementsByTagName(\"p\");\n3 var contents = p[1].innerHTML;\n```\n\
    \nHere's the breakdown:\n\n1.  Assigns the `div` with the `id` `\"ny\"` to the\
    \ variable `div`\n2.  Makes a collection of all the `<p>`s in the `div` and assigns\
    \ the collection to the variable `p`\n3.  \"Reads\" the text contained in the\
    \ 2nd paragraph of the `div` and assigns it to the variable `contents`\n\nNow\
    \ I'll show you a new way to target the paragraph, by using the DOM organization\
    \ chart.\n\n`var p = document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\n\
    `var contents = p.innerHTML;`\n\nI'll highlight each child level and tell you\
    \ what it points to.\n\n1.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the first child of the document, `<html>`\n2.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the second child of `<html>`, `<body>`\n3.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the second child of `<body>`, `<div>` with the `id` `\"ny\"`\n4.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the second child of `<div>` with the `id` `\"ny\"`, the second `<p>` within\
    \ the `div`\n\nNote: The code above assumes the browser hasn't included any junk\
    \ artifacts in the DOM. I'll discuss these in the next chapter.\n\nAs we work\
    \ our way down the organization chart, each parent is followed by a dot, which\
    \ is followed by the keyword `childNodes`, which is followed by a number in brackets,\
    \ as in array notation. As in array notation, the first child is number 0.\n\n\
    Here's the markup again. The key players in the code above are highlighted.\n\n\
    ```\n<body>\n  <div id=\"cal\">\n    <p>Southern Cal is sunny.</p>\n    <p>Northern\
    \ Cal is rainy.</p>\n    <p>Eastern Cal is desert.</p>\n   </div>\n<div id=\"\
    ny\">\n     <p>Urban NY is crowded.</p>\n<p>Rural NY is sparse.</p>\n   </div>\n\
    </body>\n```\n\nIn the example above, I showed you how to work your way down to\
    \ the targeted node starting at the document level. But in practice, you'd normally\
    \ start at a lower level. For example, you could start with the second `div`,\
    \ specifying its `id`. Then you'd target one of its children.\n\n```\n1 var d\
    \ = document.getElementById(\"ny\");\n2 var p = d.childNodes[1];\n3 var contents\
    \ = p.innerHTML;\n```\n\n> Find the interactive coding exercises for this chapter\
    \ at:\n> [http://www.ASmarterWayToLearn.com/js/60.html](http://www.ASmarterWayToLearn.com/javascript/60.html)\n\
    \n## 61 The DOM: Junk artifacts and nodeType\n\nIt's time to talk about the junk\
    \ artifacts of the DOM, the pesky things that I've been referring to in the last\
    \ three chapters. Let's revisit the simplified web page that we've been using\
    \ as an example.\n\n```\n1st level: document\n2nd level:   <html>\n3rd level:\
    \     <head>\n4th level:       <title>\n5th level:         Simple document\n \
    \                </title>\n               </head>\n3rd level      <body>\n4th\
    \ level        <div>\n5th level          <p>\n6th level            There's not\
    \ much to this.\n                   </p>\n5th level          <p>\n6th level  \
    \          Nor to this.\n                   </p>\n                 </div>\n  \
    \             </body>\n             </html>\n```\n\nThis is how I diagrammed the\
    \ DOM for the page.\n\n![](images/00013.jpg)\n\nBut this diagram is valid for\
    \ only a couple of browsers. Most browsers interpret the whitespace that's created\
    \ by some carriage returns, tabs, and spaces used to format the code as text nodes.\
    \ When you look at the markup, you see 3 text nodes, the children of the `title`\
    \ element and of the two paragraph elements.\n\n```\n1st level: document\n2nd\
    \ level:   <html>\n3rd level:     <head>\n4th level:       <title>\n5th level:\
    \         Simple document\n                 </title>\n               </head>\n\
    3rd level      <body>\n4th level        <div>\n5th level          <p>\n6th level\
    \            There's not much to this.\n                   </p>\n5th level   \
    \       <p>\n6th level            Nor to this.\n                   </p>\n    \
    \             </div>\n               </body>\n             </html>\n```\n\nFirefox\
    \ sees this markup with 8 additional text nodes that are nothing but whitespace\
    \ created by indenting.\n\n![](images/00022.jpg)\n\nThese extra text nodes create\
    \ noise that makes it hard for your DOM-reading code to find the signal. In one\
    \ browser, the first child of the `body` node might be a `div`. In another browser,\
    \ the first child of the `body` might be an empty text node.\n\nThere are a number\
    \ of solutions. As one approach, the Mozilla Developer Network suggests a workaround\
    \ that's almost comically desperate but does solve the problem without any extra\
    \ effort from JavaScript. You format the markup like this.\n\n```\n<html\n  ><head\n\
    \    ><title\n      >Simple document\n    </title\n  ></head\n  ><body\n    ><div\n\
    \      ><p\n        >There's not much to this.\n      </p\n      ><p\n       >Nor\
    \ to this.\n      </p\n    ></div\n  ></body\n></html>\n```\n\nThis markup takes\
    \ advantage of the fact that any carriage returns, tabs, and spaces that are enclosed\
    \ in the `<` and the `>` of a tag are ignored by the browser. To the browser,\
    \ `<  p  >` is the same as `<p>`. And...\n\n```\n<  \ndiv\n>\n```\n\n...is the\
    \ same as `<div>`.\n"
  raw: 'As you learned in the last chapter, the Document Object Model (DOM) is a hierarchy
    of parents and children. Everything on the web page, excluding the document itself,
    is a child of something else. So now let''s talk about how your JavaScript code
    can make use of this hierarchy of parents and children to read or change virtually
    anything on a web page.


    Let''s begin with the methods you''ve already learned for targeting things on
    the web page. You''ll recall from earlier chapters that you can target an element
    by specifying its id, if it has one.


    `var eField = document.``getElementById``("email");`


    The statement above targets the element with the id of "email".


    You also learned how to make an array-like collection of all the elements of a
    particular kind within the document...


    `var eField = document.``getElementsByTagName``("p");`


    Having made a collection of paragraphs, you can target any paragraph within the
    collection so that you can, for example, read its contents.


    `var contents =` `p[2].innerHTML``;`


    The statement above assigns the text string contained within the third paragraph
    of the document to the variable `contents`.


    An alternative to listing all the elements of a certain kind in the document is
    to narrow the focus below the document level, for example to a div, and then make
    a collection within that div.


    `1 var` `d` `= document.getElementById("div3");`


    `2 var p =` `d``.getElementsByTagName("p");`


    `3 var contents = p[2].innerHTML;`


    In the example above, you a generate a collection not of all the paragraph elements
    in the document, but only those paragraph elements within the div that has an
    id of "div3". Then you target one of those paragraphs.


    Now consider this markup.


    `<body>`


    `  <div id="cal">`


    `     <p>Southern Cal is sunny.</p>`


    `     <p>Northern Cal is rainy.</p>`


    `     <p>Eastern Cal is desert.</p>`


    `  </div>`


    `  <div id="ny">`


    `     <p>Urban NY is crowded.</p>`


    `     <p>Rural NY is sparse.</p>`


    `  </div>`


    `</body>`


    If you wanted to read the contents of the last paragraph in the markup, you could
    write...


    `1 var p = document.``getElementsByTagName("p")``;`


    `2 var contents =` `p[4].innerHTML``;`


    Line 1 makes a collection of all the `<p>`s in the document and assigns the collection
    to the variable `p`. Line 2 "reads" the text contained in the 5th paragraph of
    the document.


    Another approach: You could target the same paragraph by narrowing the collection
    of elements to those that are just in the second div.


    `1 var` `div` `= document.getElementById("ny");`


    `2 var p =` `div``.getElementsByTagName("p");`


    `3 var contents = p[1].innerHTML;`


    Here''s the breakdown:


    1.  Assigns the div with the id "ny" to the variable `div`


    2.  Makes a collection of all the `<p>`s in the div and assigns the collection
    to the variable `p`


    3.  "Reads" the text contained in the 2nd paragraph of the div and assigns it
    to the variable `contents`


    Now I''ll show you a new way to target the paragraph, by using the DOM organization
    chart.


    `1 var p = document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`


    `2 var contents = p.innerHTML;`


    I''ll highlight each child level and tell you what it points to.


    1.  `document.``childNodes[0]``.childNodes[1].childNodes[1].childNodes[1];` is
    the first child of the document, `<html>`


    2.  `document.childNodes[0].``childNodes[1]``.childNodes[1].childNodes[1];` is
    the second child of `<html>`, `<body>`


    3.  `document.childNodes[0].childNodes[1].``childNodes[1]``.childNodes[1];` is
    the second child of `<body>`, `<div>` with the id "ny"


    4.  `document.childNodes[0].childNodes[1].childNodes[1].``childNodes[1]``;` is
    the second child of `<div>` with the id "ny", the second `<p>` within the div


    Note: The code above assumes the browser hasn''t included any junk artifacts in
    the DOM. I''ll discuss these in the next chapter.


    As we work our way down the organization chart, each parent is followed by a dot,
    which is followed by the keyword `childNodes`, which is followed by a number in
    brackets, as in array notation. As in array notation, the first child is number
    0.


    Here''s the markup again. The key players in the code above are highlighted.


    `<body>`


    `  <div id="cal">`


    `    <p>Southern Cal is sunny.</p>`


    `    <p>Northern Cal is rainy.</p>`


    `    <p>Eastern Cal is desert.</p>`


    `   </div>`


    `<div id="ny">`


    `     <p>Urban NY is crowded.</p>`


    `<p>Rural NY is sparse.</p>`


    `   </div>`


    `</body>`


    In the example above, I showed you how to work your way down to the targeted node
    starting at the document level. But in practice, you''d normally start at a lower
    level. For example, you could start with the second div, specifying its id. Then
    you''d target one of its children.


    `1 var` `d` `= document.getElementById("ny");`


    `2 var p =` `d``.childNodes[1];`


    `3 var contents = p.innerHTML;`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/60.html](http://www.ASmarterWayToLearn.com/javascript/60.html)


    61


    The DOM:


    Junk artifacts and nodeType


    It''s time to talk about the junk artifacts of the DOM, the pesky things that
    I''ve been referring to in the last three chapters. Let''s revisit the simplified
    web page that we''ve been using as an example.


    `1st level: document`


    `2nd level:   <html>`


    `3rd level:     <head>`


    `4th level:       <title>`


    `5th level:         Simple document`


    `                 </title>`


    `               </head>`


    `3rd level      <body>`


    `4th level        <div>`


    `5th level          <p>`


    `6th level            There''s not much to this.`


    `                   </p>`


    `5th level          <p>`


    `6th level            Nor to this.`


    `                   </p>`


    `                 </div>`


    `               </body>`


    `             </html>`


    This is how I diagrammed the DOM for the page.


    ![](images/00013.jpg)


    But this diagram is valid for only a couple of browsers. Most browsers interpret
    the whitespace that''s created by some carriage returns, tabs, and spaces used
    to format the code as text nodes. When you look at the markup, you see 3 text
    nodes, the children of the title element and of the two paragraph elements.


    `1st level: document`


    `2nd level:   <html>`


    `3rd level:     <head>`


    `4th level:       <title>`


    `5th level:         ``Simple document`


    `                 </title>`


    `               </head>`


    `3rd level      <body>`


    `4th level        <div>`


    `5th level          <p>`


    `6th level            ``There''s not much to this.`


    `                   </p>`


    `5th level          <p>`


    `6th level            ``Nor to this.`


    `                   </p>`


    `                 </div>`


    `               </body>`


    `             </html>`


    Firefox sees this markup with 8 additional text nodes that are nothing but whitespace
    created by indenting.


    ![](images/00022.jpg)


    These extra text nodes create noise that makes it hard for your DOM-reading code
    to find the signal. In one browser, the first child of the body node might be
    a div. In another browser, the first child of the body might be an empty text
    node.


    There are a number of solutions. As one approach, the Mozilla Developer Network
    suggests a workaround that''s almost comically desperate but does solve the problem
    without any extra effort from JavaScript. You format the markup like this.


    `<html`


    `  ><head`


    `    ><title`


    `      >Simple document`


    `    </title`


    `  ></head`


    `  ><body`


    `    ><div`


    `      ><p`


    `        >There''s not much to this.`


    `      </p`


    `      ><p`


    `       >Nor to this.`


    `      </p`


    `    ></div`


    `  ></body`


    `></html>`


    This markup takes advantage of the fact that any carriage returns, tabs, and spaces
    that are enclosed in the `<` and the `>` of a tag are ignored by the browser.
    To the browser, `<  p  >` is the same as `<p>`. And...


    `<  `


    `div`


    `>`


    `...`is the same as `<div>`.'
