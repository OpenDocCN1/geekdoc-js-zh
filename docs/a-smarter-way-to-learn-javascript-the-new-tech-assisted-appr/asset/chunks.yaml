    \n## 85 Form validation: ZIP codes\n\nNow, a one-field form that asks the user\
    \ to enter her ZIP code.\n\nYou've already learned how to make sure the user hasn't\
    \ left the field blank. But how do you test whether she's entered the right number\
    \ of digits for a ZIP—5 digits?\n\nHTML gives you a way to keep her from entering\
    \ too many digits: `maxlength=5`. But if you want to make sure she hasn't entered\
    \ too few digits, you need to use JavaScript. Here's the function.\n\n```\n1 function\
    \ validateZIP() {\n2   var numChars = document.getElementById(\"zip\").value.length;\n\
    3   if (numChars < 5) {\n4     alert(\"Please enter a 5-digit code.\");\n5   \
    \  return false;\n6   }\n7 }\n```\n\nIf the number of characters in the field\
    \ is fewer than 5, an alert displays and `false` is returned to the calling code,\
    \ cancelling the form submission.\n\nAnother question to ask about the ZIP field\
    \ entry is whether the user has entered only numbers. Here's the additional code\
    \ for that.\n\n```\n1 function validateZIP() {\n2   var valueEntered = document.getElementById(\"\
    zip\").value;\n3   var numChars = valueEntered.length;\n4   if (numChars < 5)\
    \ {\n5     alert(\"Please enter a 5-digit code.\");\n6     return false;\n7  \
    \ }\n8   for (var i = 0; i <= 4; i++) {\n9     var thisChar = parseInt(valueEntered[i]);\n\
    10    if (isNaN(thisChar)) {\n11      alert(\"Please enter only numbers.\");\n\
    12      return false;\n13    }\n14  }\n15 }\n```\n\nThe highlighted code loops\
    \ through the five characters that have been entered, checking to make sure that\
    \ all the characters are string characters representing numbers. Because the five\
    \ characters in the field are string characters, each one has to be converted\
    \ to a number if possible before being tested. Line 9 does this. Line 10 tests\
    \ to see whether the attempted conversion worked. If a number resulted from `parseInt`\
    \ in line 9, no problem. But if the character isn't a number after the conversion\
    \ attempt—if it `isNaN` in line 10—an alert displays and `false` is returned,\
    \ cancelling the form submission.\n\n![](images/00009.jpg)\n\nA more elegant and\
    \ more versatile way to validate forms is to use regular expressions. Regular\
    \ expressions are outside the scope of this book, but I'll give you a small taste\
    \ of them in the next chapter.\n\n> Find the interactive coding exercises for\
    \ this chapter at:\n> \n> [http://www.ASmarterWayToLearn.com/js/85.html](http://www.ASmarterWayToLearn.com/javascript/85.html)\n\
    \n## 86 Form validation: email\n\nValidating an email field includes checking\
    \ to make sure there are no illegal characters, like spaces, and that all the\
    \ essentials of a legal email address are there: one or more characters, followed\
    \ by @, followed by one or more characters, followed by a dot, followed by two\
    \ to four characters. The standard way to test for all this is to match the user's\
    \ entry with a regular expression. Regular expressions are beyond the scope of\
    \ this book, but I'll give you a taste of them at the end of the chapter. Meanwhile,\
    \ here's how to head off many user errors by using `indexOf`.\n\nLet's start by\
    \ checking for spaces, which are illegal in an email address.\n\n```\n1 function\
    \ validateEmail() {\n2   var eEntered = document.getElementById(\"email\").value;\n\
