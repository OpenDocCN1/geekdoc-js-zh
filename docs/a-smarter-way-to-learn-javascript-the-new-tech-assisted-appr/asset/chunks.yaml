  trans: "\n正如你在上一章所学到的，文档对象模型（DOM）是一个由父节点和子节点组成的层级结构。网页上的所有内容（除了文档本身）都是其他某个元素的子节点。那么现在，我们来谈谈你的\
    \ JavaScript 代码如何利用这种父节点和子节点的层级结构来读取或更改网页上的几乎任何内容。\n\n我们先从你已经学过的定位网页元素的方法开始。回顾之前的章节，你可以通过指定元素的\
    \ `id` 来定位它（如果它有 id 的话）。\n\n`var eField = document.getElementById(\"email\");`\n\
    \n上面的语句定位了 `id` 为 `\"email\"` 的元素。\n\n你还学会了如何生成一个类似数组的集合，其中包含文档中所有特定类型的元素……\n\n\
    `var eField = document.getElementsByTagName(\"p\");`\n\n生成了一个段落集合后，你可以定位集合中的任意段落，例如读取其内容。\n\
    \n`var contents = p[2].innerHTML;`\n\n上面的语句将文档中第三个段落包含的文本字符串赋值给变量 `contents`。\n\
    \n另一种方法不是列出文档中所有某种类型的元素，而是将焦点缩小到文档层级以下，例如一个 `div`，然后在该 `div` 内生成一个集合。\n\n```\n\
    1 var d = document.getElementById(\"div3\");\n2 var p = d.getElementsByTagName(\"\
    p\");\n3 var contents = p[2].innerHTML;\n```\n\n在上面的例子中，你生成的集合不是文档中所有的段落元素，而只是那些位于\
    \ `id` 为 `\"div3\"` 的 `div` 内的段落元素。然后你定位了其中一个段落。\n\n现在来看这个标记。\n\n```\n<body>\n\
    \  <div id=\"cal\">\n     <p>Southern Cal is sunny.</p>\n     <p>Northern Cal\
    \ is rainy.</p>\n     <p>Eastern Cal is desert.</p>\n  </div>\n  <div id=\"ny\"\
    >\n     <p>Urban NY is crowded.</p>\n     <p>Rural NY is sparse.</p>\n  </div>\n\
    </body>\n```\n\n如果你想读取标记中最后一个段落的内容，可以这样写……\n\n```\n1 var p = document.getElementsByTagName(\"\
    p\");\n2 var contents = p[4].innerHTML;\n```\n\n第 1 行生成文档中所有 `<p>` 的集合，并将该集合赋值给变量\
    \ `p`。第 2 行“读取”文档中第五个段落包含的文本。\n\n另一种方法：你可以将元素集合缩小到仅包含第二个 `div` 中的元素，从而定位同一个段落。\n\
    \n```\n1 var div = document.getElementById(\"ny\");\n2 var p = div.getElementsByTagName(\"\
    p\");\n3 var contents = p[1].innerHTML;\n```\n\n以下是分解说明：\n\n1.  将 `id` 为 `\"ny\"\
    ` 的 `div` 赋值给变量 `div`\n2.  生成该 `div` 中所有 `<p>` 的集合，并将该集合赋值给变量 `p`\n3.  “读取”该 `div`\
    \ 中第二个段落包含的文本，并将其赋值给变量 `contents`\n\n现在我将向你展示一种定位段落的新方法，即使用 DOM 组织结构图。\n\n`var\
    \ p = document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\n`var\
    \ contents = p.innerHTML;`\n\n我将高亮显示每个子层级，并告诉你它指向什么。\n\n1.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ 是文档的第一个子节点，即 `<html>`\n2.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ 是 `<html>` 的第二个子节点，即 `<body>`\n3.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ 是 `<body>` 的第二个子节点，即 `id` 为 `\"ny\"` 的 `<div>`\n4.  `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ 是 `id` 为 `\"ny\"` 的 `<div>` 的第二个子节点，即该 `div` 中的第二个 `<p>`\n\n注意：上面的代码假设浏览器没有在\
    \ DOM 中包含任何垃圾伪影。我将在下一章讨论这些。\n\n当我们沿着组织结构图向下移动时，每个父节点后面跟着一个点，然后是关键字 `childNodes`，再后面是方括号中的数字，就像数组表示法一样。与数组表示法一样，第一个子节点是编号\
    \ 0。\n\n这是再次给出的标记。上面代码中的关键元素已被高亮显示。\n\n```\n<body>\n  <div id=\"cal\">\n    <p>Southern\
    \ Cal is sunny.</p>\n    <p>Northern Cal is rainy.</p>\n    <p>Eastern Cal is\
    \ desert.</p>\n   </div>\n<div id=\"ny\">\n     <p>Urban NY is crowded.</p>\n\
    <p>Rural NY is sparse.</p>\n   </div>\n</body>\n```\n\n在上面的例子中，我向你展示了如何从文档层级开始向下定位到目标节点。但在实践中，你通常会从较低的层级开始。例如，你可以从第二个\
    \ `div` 开始，指定其 `id`。然后定位它的一个子节点。\n\n```\n1 var d = document.getElementById(\"\
    ny\");\n2 var p = d.childNodes[1];\n3 var contents = p.innerHTML;\n```\n\n> 本章的交互式编程练习请访问：\n\
    > [`www.ASmarterWayToLearn.com/js/60.html`](http://www.ASmarterWayToLearn.com/javascript/60.html)\n\
    \n## 61 DOM：垃圾伪影与 nodeType\n\n现在该谈谈 DOM 中的垃圾伪影了，也就是我在过去三章中一直提到的那些烦人的东西。让我们重新审视我们一直用作示例的简化网页。\n\
    \n```\n第 1 层：document\n第 2 层：   <html>\n第 3 层：     <head>\n第 4 层：       <title>\n\
    第 5 层：         Simple document\n                 </title>\n               </head>\n\
    第 3 层      <body>\n第 4 层        <div>\n第 5 层          <p>\n第 6 层            There's\
    \ not much to this.\n                   </p>\n第 5 层          <p>\n第 6 层      \
    \      Nor to this.\n                   </p>\n                 </div>\n      \
    \         </body>\n             </html>\n```\n\n这是我为该页面绘制的 DOM 图。\n\n![](img/00013.jpg)\n\
    \n但这个图只适用于少数浏览器。大多数浏览器会将由某些回车、制表符和空格（用于格式化代码）产生的空白符解释为文本节点。当你查看标记时，你会看到 3 个文本节点，它们是\
    \ `title` 元素和两个段落元素的子节点。\n\n```\n第 1 层：document\n第 2 层：   <html>\n第 3 层：     <head>\n\
    第 4 层：       <title>\n第 5 层：         Simple document\n                 </title>\n\
    \               </head>\n第 3 层      <body>\n第 4 层        <div>\n第 5 层        \
    \  <p>\n第 6 层            There's not much to this.\n                   </p>\n\
    第 5 层          <p>\n第 6 层            Nor to this.\n                   </p>\n \
    \                </div>\n               </body>\n             </html>\n```\n\n\
    Firefox 会在这个标记中看到额外的 8 个文本节点，它们只是由缩进产生的空白符。\n\n![](img/00022.jpg)\n\n这些额外的文本节点产生了噪声，使得你的\
    \ DOM 读取代码难以找到真正的信号。在一个浏览器中，`body` 节点的第一个子节点可能是一个 `div`。在另一个浏览器中，`body` 的第一个子节点可能是一个空的文本节点。\n\
    \n有多种解决方案。作为一种方法，Mozilla 开发者网络建议了一种几乎可笑地绝望但确实能解决问题且无需 JavaScript 额外工作的变通方法。你可以像这样格式化标记。\n\
    \n```\n<html\n  ><head\n    ><title\n      >Simple document\n    </title\n  ></head\n\
    \  ><body\n    ><div\n      ><p\n        >There's not much to this.\n      </p\n\
    \      ><p\n       >Nor to this.\n      </p\n    ></div\n  ></body\n></html>\n\
    ```\n\n这种标记利用了这样一个事实：任何包含在标签的 `<` 和 `>` 之间的回车、制表符和空格都会被浏览器忽略。对于浏览器来说，`<  p  >`\
    \ 等同于 `<p>`。并且……\n\n```\n<  \ndiv\n>\n```\n\n……等同于 `<div>`。\n"
- fmt: "\nWhen whitespace is inside the brackets, the browser doesn't count it as\
    \ a text node. So if you \"hide\" all carriage returns, tabs, and spaces inside\
    \ the brackets as the code above does, there's no junk in the DOM. Any noise that\
    \ would keep your JavaScript from reading the signal is removed.\n\nYou can also\
    \ clean out junk in the DOM by using a minifier program like the one at [http://www.willpeavy.com/minifier/](http://www.willpeavy.com/minifier/).\
    \ You will, of course, want to preserve the original, non-minified version of\
    \ the file so you can revise the page in the future without going crazy.\n\n```\n\
    <html><head><title>Simple document</title></head><body><div><p>There's not much\
    \ to this.</p><p>Nor to this.</p></div></body></html>\n```\n\nAnother approach\
    \ is to format your HTML conventionally and let your JavaScript sniff out the\
    \ junk nodes. JavaScript can check a node to see what type it is—element, text,\
    \ comment, and so on. For example, this statement checks the node type of a targeted\
    \ node and assigns it to the variable `nType`.\n\n```\nvar nType = targetNode.nodeType;\n\
    ```\n\nIn the statement above, JavaScript assigns a number representing the node\
    \ type to the variable `nType`. If the node is an element like `<div>` or `<p>`,\
    \ the number is 1. If it's a text node, the number is 3.\n\nSuppose you want to\
    \ replace the text content of the second paragraph in a particular div with the\
    \ string \"All his men.\" Here's the markup, with the text we're going to change\
    \ highlighted.\n\n```\n<div id=\"humpty\">\n  <p>All the king's horses.</p>\n\
    \  <p>All the dude's crew.</p>\n  <p>All the town's orthopedists.</p>\n</div>\n\
    ```\n\nThis is the code.\n\n```\n1  var d = document.getElementById(\"humpty\"\
    );\n2  var pCounter = 0;\n3  for (var i = 0; i < d.childNodes.length; i++) {\n\
    4    if (d.childNodes[i].nodeType === 1 ) {\n5      pCounter++;\n6    }\n7   \
    \ if (pCounter === 2) {\n8      d.childNodes[i].innerHTML = \"All his men.\";\n\
    9      break;\n10   }\n11 }\n```\n\nHere's the breakdown:\n\n1. Assigns the div\
    \ to the variable `d`\n2. Counts the number of paragraphs\n3. Goes through the\
    \ children of the div looking for the next element node, i.e. Type 1, which we\
    \ assume is a paragraph\n4-6. Adds 1 to the counter. We're looking for the second\
    \ paragraph.\n7-9. When the counter hits 2, we've reached the targeted paragraph.\
    \ Change the text\n\nOf course, if you know you might want your JavaScript to\
    \ change that second paragraph, it would be a lot easier to assign it an id, and\
    \ go straight to it, like this.\n\n```\ndocument.getElementById(\"p2\").innerHTML\
    \ = \"All his men.\";\n```\n\nYou can see why the `getElementById` method is more\
    \ popular with coders than tracing the DOM hierarchy. But there are some things\
    \ you can't do without working your way through the parent-child relationships\
    \ of the DOM, as you'll learn in subsequent chapters.\n\n> Find the interactive\
    \ coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/61.html](http://www.ASmarterWayToLearn.com/javascript/61.html)\n\
    \n## 62 The DOM: More ways to target elements\n\nSo far you've learned to use\
    \ the DOM's parent-child hierarchy to target a child node of a parent node by\
    \ specifying its order in an array-like collection of children—`childNodes[0]`,\
    \ `childNodes[1]`, `childNodes[2]`, and so on. But there are other ways to use\
    \ the hierarchy for targeting. To begin with, instead of writing `childNodes[0]`,\
    \ you can write `firstChild`. And instead of writing, for example, `childNodes[9]`,\
    \ to target the 10th child in a 10-child collection of children, you can write\
    \ `lastChild`.\n\n```\nvar targetNode = parentNode.childNodes[0];\n```\n\n...is\
    \ the same as...\n\n```\nvar targetNode = parentNode.firstChild;\n```\n\nAnd if\
    \ there are, for example, 3 child nodes...\n\n```\nvar targetNode = parentNode.childNodes[2];\n\
    ```\n\n...is the same as...\n\n```\nvar targetNode = parentNode.lastChild;\n```\n\
    \nYou can also work backwards, targeting the parent node of any child node. Let's\
    \ say you have this markup. Using the DOM, how do you find the parent of the highlighted\
    \ div?\n\n```\n<div id=\"div1\">\n  <div id=\"div2\">\n    <p>Chicago</p>\n  \
    \  <p>Kansas City</p>\n    <p>St. Louis</p>\n  </div>\n</div>\n```\n\nYou want\
    \ to know the parent of the div with the id \"div2\". The following code assigns\
    \ the parent of the \"div2\" div to the variable `pNode`.\n\n```\n1 var kidNode\
    \ = document.getElementById(\"div2\");\n2 var pNode = kidNode.parentNode;\n```\n\
    \nYou can use `nextSibling` and `previousSibling` to target the next child and\
    \ the previous child in the collection of an element's children. In the following\
    \ code, the first statement targets a div with the id \"div1\". The second statement\
    \ targets the next node that has the same parent as the \"div1\" id.\n\n```\n\
    1 var firstEl = document.getElementById(\"div1\");\n2 secondEl = firstEl.nextSibling;\n\
    ```\n\nIf there is no `nextSibling` or `previousSibling`, you get null. In the\
    \ following code, the variable `nonexistentEl` has a value of null, because JavaScript\
    \ finds that there is no previous node that has the same parent as `firstEl`.\n\
    \n```\n1 var firstEl = document.getElementById(\"div1\");\n2 var nonexistentEl\
    \ = firstEl.previousSibling;\n```\n\nCounting siblings can be tricky, because,\
    \ as you know, some browsers treat whitespace created by HTML formatting as text\
    \ nodes, even though they're empty and without significance.\n\nIn the HTML example\
    \ above, with two divs and three paragraphs, you might think that the next sibling\
    \ of the first paragraph is the second paragraph. But actually, in some browsers,\
    \ the first paragraph's next sibling is an empty text node. The next sibling of\
    \ that node is the second paragraph.\n\nWhat this means is that in order to target\
    \ a node with `nextSibling` or `previousSibling`, you have to either format your\
    \ HTML markup defensively as I showed you in the last chapter, or else type-test\
    \ each node to make sure it's the kind you're looking for, as I also showed you\
    \ in the last chapter.\n\nOnce again, I'll say that you're often better off assigning\
    \ an id to any node you might want to \"read\" or change. Then you can target\
    \ the node more directly, using `document.getElementById`.\n\n> Find the interactive\
    \ coding exercises for this chapter at:\n> [http://www.ASmarterWayToLearn.com/js/62.html](http://www.ASmarterWayToLearn.com/javascript/62.html)\n\
    \n## 63 The DOM: Getting a target's name\n\nIn a previous chapter you learned\
    \ how to get a node's node type with a statement like this.\n\n```\nvar nType\
    \ = targetNode.nodeType;\n```\n\nIn the example above, if the node is an element,\
    \ the variable `nType` will be assigned the number 1. If the node is text, it'll\
    \ be assigned the number 3.\n\nYou can get additional information about a node\
    \ by using `nodeName`. In the following example, the node name of the target node\
    \ is assigned to the variable `nName`.\n\n```\n1 var parent = document.getElementById(\"\
    div1\");\n2 var target = parent.firstChild;\n3 nName = target.nodeName;\n```\n\
    \nLines 1 and 2 target the first child of an element with the id \"div1\". Line\
    \ 3 assigns the node name of the target to the variable `nName`.\n\nIn the example\
    \ above, if the node is an element, the variable `nName` will be assigned a string,\
    \ like P or DIV, that corresponds to the characters of the tag that are enclosed\
    \ in the brackets. In HTML, the name is usually given in all-caps, even if the\
    \ markup is in lowercase.\n\n| Tag | Node Name |\n| --- | --- |\n| `<p>` or `<P>`\
    \ | P |\n| `<div>` or `<DIV>` | DIV |\n| `<span>` or `<SPAN>` | SPAN |\n| `<img>`\
    \ or `<IMG>` | IMG |\n| `<a>` or `<A>` | A |\n| `<em>` or `<EM>` | EM |\n| `<table>`\
    \ or `<TABLE>` | TABLE |\n| `<li>` or `<LI>` | LI |\n\nOn the other hand, if the\
    \ node is a text node, the name of the node is always `#text`—in lower-case.\n\
    \nIf it's a text node, you can find out its value—i.e. its content—this way.\n\
    \n```\n1 var parent = document.getElementById(\"div1\");\n2 var target = parent.firstChild;\n\
    3 var nTextContent = target.nodeValue;\n```\n\nLines 1 and 2 target the first\
    \ child of an element with the id \"div1\". Line 3 assigns the node value to the\
    \ variable `nTextContent`.\n"
