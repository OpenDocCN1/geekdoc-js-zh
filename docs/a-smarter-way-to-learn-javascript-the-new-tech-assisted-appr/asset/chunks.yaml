  trans: "\n\n# 函数：传递参数与返回数据\n\n数字，无论是字面量数字还是由变量表示的数字，都可以作为参数。在下面的代码中，我声明了变量 `almostAMil`\
    \ 并将数字 999999 赋值给它。然后我在函数调用中将 `almostAMil` 作为参数使用。\n\n```javascript\nvar almostAMil\
    \ = 999999;\nshowBigNum(almostAMil);\n```\n\n或者，如果我想的话，也可以直接使用字面量数字 999999 作为参数。\n\
    \n```javascript\nshowBigNum(999999);\n```\n\n你可以向函数传递任意数量的参数，参数之间用逗号分隔。通常，函数也有相同数量的参数（同样用逗号分隔）。（特殊情况下有极少数例外。）再次强调，当你使用变量作为参数时，变量名不必与参数名匹配。JavaScript\
    \ 根据参数的顺序进行匹配，而不是名称。列表中的第一个参数传递给列表中的第一个参数，第二个参数传递给第二个参数，以此类推。\n\n作为参数，你可以使用变量、字符串和字面量数字的任意组合。在下面的示例中，调用代码向函数传递了一个变量、一个字符串和一个数字。三个参数接收这些值。函数将它们拼接起来以创建一条警告消息。\n\
    \n首先，这是函数。\n\n```javascript\nfunction showMessage(m, string, num) {\n  alert(m\
    \ + string + num);\n}\n```\n\n现在，这是调用函数的语句。\n\n```javascript\nvar month = \"March\"\
    ;\nshowMessage(month, \"'s winner number is \", 23);\n```\n\n参数 `month`（一个变量）被传递给参数\
    \ `m`。参数 `\"'s winning number is \"`（一个字符串）被传递给参数 `string`。参数 `23`（一个字面量数字）被传递给参数\
    \ `num`。\n\n当代码执行时，会弹出一条警告，显示“March's winning number is 23”。\n\n通常，你会将函数定义中包含的所有参数作为变量在执行的代码中使用，因为，否则你为什么要将它们放在函数定义中呢？但并没有规定你必须全部使用它们。而且你当然不必按照它们在括号中出现的顺序来使用它们。每个参数都是一个完整的变量，在函数内部，你可以像使用任何变量一样使用它。\n\
    \n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/36.html`](http://www.ASmarterWayToLearn.com/javascript/36.html)\n\
    \n## 从函数返回数据\n\n正如你在上一章所学到的，当你向函数传递数据以便它能够完成定制任务时，函数会变得更加灵活。但函数还能做得更多。它可以将数据返回给调用代码。\n\
    \n假设你收取最低运费 5 美元，外加超过 50 美元部分的商品总额的 3%，最高不超过 100 美元。当总额达到 100 美元时，你提供免运费。以下是计算订单总额的代码。\n\
    \n```javascript\nvar orderTot;\nif (merchTot >= 100) {\n  orderTot = merchTot;\n\
    }\nelse if (merchTot < 50.01) {\n  orderTot = merchTot + 5;\n}\nelse {\n  orderTot\
    \ = merchTot + 5 + (.03 * (merchTot - 50));\n}\n```\n\n如果商品总额至少为 100 美元，则订单总额等于商品总额。如果商品总额为\
    \ 50 美元或以下，则订单总额为商品总额加 5 美元。如果订单总额在 50 美元到 100 美元之间，则订单总额为商品总额加 5 美元再加超过 50 美元部分的\
    \ 3%。\n\n- 一件价值 150 美元的商品，总价为 150 美元。\n- 一件价值 15 美元的商品，总价为 20 美元。\n- 一件价值 70 美元的商品，总价为\
    \ 75.60 美元。\n\n以下是我们如何将上述代码转换为函数。\n\n```javascript\nfunction calcTot(merchTot)\
    \ {\n  var orderTot;\n  if (merchTot >= 100) {\n    orderTot = merchTot;\n  }\n\
    \  else if (merchTot < 50.01) {\n    orderTot = merchTot + 5;\n  }\n  else {\n\
    \    orderTot = merchTot + 5 + (.03 * (merchTot - 50));\n  }\n  return orderTot;\n\
    }\n```\n\n这里需要关注的是，我们声明了一个变量 `orderTot`，然后——这是新内容——在处理完成并得知商品总额后，函数通过 `return`\
    \ 语句将 `orderTot` 中保存的值返回给调用代码。它传递回了数据。\n\n但随后调用代码需要某种东西来接收数据。除了变量，还能是什么呢？以下是调用函数的代码。\n\
    \n```javascript\nvar totalToCharge = calcTot(79.99);\n```\n\n如果你是编程新手，这条语句可能看起来很奇怪。函数怎么能赋值给变量呢？你可能习惯于看到字面量赋值给变量……\n\
    \n```javascript\nvar totalToCharge = 85.00;\n```\n\n你可能习惯于看到变量赋值给变量……\n\n```javascript\n\
    var totalToCharge = merchTotal;\n```\n\n你可能习惯于看到算术表达式或其他表达式赋值给变量……\n\n```javascript\n\
    var totalToCharge = merchTotal + ship + tax;\n```\n\n但是将函数赋值给变量？嗯，其实并不奇怪，因为请记住，你实际赋值给变量的是函数代码中\
    \ `return` 语句返回的值。语句 `var totalToCharge = calcTot(79.99);` 是以下操作的简写：“将函数 `calcTot`\
    \ 返回的值赋值给变量 `totalToCharge`。”\n\n因此，现在调用代码和函数之间有了双向通信。调用代码将值 `79.99` 传递给函数，该值被函数的参数\
    \ `merchTot` 接收。这个变量 `merchTot` 在函数体中被用来计算订单总额。然后，通过 `return` 语句，该订单总额被传递回调用代码中的\
    \ `totalToCharge`。这是一个完整的循环。\n\n请注意，调用代码中接收值的变量 `totalToCharge` 与函数内部返回值的变量 `merchTot`\
    \ 不同。我特意这样做，是为了让你不会认为这两个变量必须共享相同的名称。这同样适用于从函数返回的变量和调用代码中接收它的变量。它们可以共享相同的名称，但并非必须如此。\n\
    \n## 将函数用作表达式\n\n任何可以使用变量的地方，都可以使用函数。（从技术上讲，函数是一种变量。）例如：\n\n你可以使用函数来指定警告消息中的内容。\n\
    \n```javascript\nalert(calcTot(79.99));\n```\n\n在上面的示例中，警告消息是函数 `calcTot` 在传入参数\
    \ `79.99` 时返回的值。\n\n你可以在表达式中使用函数。\n\n```javascript\nvar orderTot = merchTot +\
    \ calcTax(merchTot);\n```\n\n在上面的示例中，赋值给 `orderTot` 的值是 `merchTot` 与函数 `calcTax`\
    \ 在传入参数 `merchTot` 时返回的值之和。\n\n你可以在函数调用中使用函数。\n\n```javascript\nvar tot = calc(merchTot,\
    \ calcTax(merchTot));\n```\n\n在上面的示例中，调用代码向函数 `calc` 传递了两个参数。第一个参数是 `merchTot`。第二个参数是函数\
    \ `calcTax`，它也接收 `merchTot` 作为参数。\n\n在函数内部，你可以调用另一个函数。\n\n```javascript\nfunction\
    \ calcTot(price) {\n  return price + calcShip(price);\n}\n```\n\n在上面的示例中，函数 `calcTot`\
    \ 调用了函数 `calcShip`。它将 `price` 作为参数传递，并接收回运费。它将运费加到价格上，并将总和作为总额返回给原始调用代码。\n\n你已经了解到，你可以向任意数量的参数传递任意数量的参数。不幸的是，在\
    \ `return` 语句中你没有这种灵活性。无论函数接收多少个参数或执行多少处理，它只能向调用它的代码返回一个值。\n\n"
