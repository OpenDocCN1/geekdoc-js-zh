    `this.``calcAnnual` `=` `function(percentIfDisc) {`


    There are two other differences. Because in the constructor function the method
    definition begins with an assignment (something = something else), you need a
    semicolon after the closing curly bracket. And no comma is necessary if another
    property or method definition follows.


    > Find the interactive coding exercises for this chapter at:


