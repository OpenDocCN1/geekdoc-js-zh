    of the screen. But you can optionally tell the browser where to place the window.


    `var w = window.open("", "", "width=420,height=380,``left=200,top=100``");`


    Things to know:


    *   Again, the numbers are pixels—number of pixels from the left edge of the screen
    and number of pixels from the top of the screen.


    *   The positioning parameters are included within the same set of quotation marks
    as the size parameters, and, like the size parameters, are separated by a comma
    and no space.


    *   The parameter order within the quotation marks doesn''t matter.


    *   You can specify window size without specifying window position, but if you
    specify window position without size, it will be ignored since it will be a full-size
    window that fills the whole screen.


    As usual, some or all of the parameters can be assigned to a variable, and the
