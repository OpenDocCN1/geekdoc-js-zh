    ## 52 操作图像和文本


    你的网页显示一张水滴鱼图片。水滴鱼是一种迷人的动物，但它太丑了，一些用户会发出“恶心”的声音。所以你给他们一个让它消失的选项。当他们点击图片时，它就会消失。


    你首先给图片一个`id`。


    ```

    <img src="Blobfish.jpg" id="ugly" ...>

    ```


    然后你添加一个事件处理器。


    ```

    <img src="blobfish.jpg" id="ugly" onClick="makeInvisible();">

    ```


    你有一个用于隐藏的 CSS 类。


    ```

    .hidden {display:none;}

    ```


    事件处理器调用的函数给图片一个"hidden"类，因此它消失。


    ```

    1 function makeInvisible() {

    2   document.getElementById("ugly").className = "hidden";

    3 }

    ```


    当函数被调用时，它将"hidden"类赋给`id`为"ugly"的元素。图片消失。


    需要记住的一些事项：


    * 这只是你已经学过的内容的变体，即`document.getElementById(theElementId).value`（用于表单字段）和`document.getElementById(theElementId).innerHTML`（用于段落、`div`和其他
    HTML 元素）。

    * 它是`className`，采用驼峰命名法，而不是`class`。

    * 以这种方式给元素分配类会替换该元素在静态标记中已分配的任何类。


    如果你想给一个元素添加一个类，同时保留其现有的类，你可以这样做。例如，假设你有一个段落，其类将其样式设置为 Verdana，大小为 1 em。当用户鼠标悬停时，你想将其大小加倍到
    2 em。但你不想丢失其原始类的 Verdana 样式。与其替换设置 Verdana 样式的类，不如保留该类并添加放大字体的类。假设该元素的`id`为"p1"。这是函数代码。


    ```

    1 function makeBig() {

    2   document.getElementById("p1").className += " big";

    3 }

    ```


    与用新类替换所有现有类的代码相比，这段代码有两个小区别。


    * 它是`+=`而不是单纯的`=`。

