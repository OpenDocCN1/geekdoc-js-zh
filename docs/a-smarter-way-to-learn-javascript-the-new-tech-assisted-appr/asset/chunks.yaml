- fmt: "\n# Arithmetic Order and Parentheses\n\nIf I move the parentheses, the arithmetic\
    \ is done in a different order. In this next statement, the placement of the parens\
    \ tells JavaScript to first add 1 and 3, then multiply by 4. The result is 16.\n\
    \n```javascript\nvar totalCost = (1 + 3) * 4;\n```\n\nHere's another example.\n\
    \n```javascript\nvar resultOfComputation = (2 * 4) * 4 + 2;\n```\n\nBy placing\
    \ the first multiplication operation inside parentheses, you've told JavaScript\
    \ to do that operation first. But then what happens next? The order could be:\n\
    \n1. Multiply 2 by 4.\n2. Multiply that product by 4.\n3. Add 2 to it.\n\n...giving\
    \ `resultOfComputation` a value of 34.\n\nOr the order could be...\n\n1. Multiply\
    \ 2 by 4.\n2. Multiply that product by the sum of 4 and 2.\n\n...giving `resultOfComputation`\
    \ a value of 48.\n\nThe solution is more parentheses. If you want the second multiplication\
    \ to be done before the 2 is added, write this...\n\n```javascript\nresultOfComputation\
    \ = ((2 * 4) * 4) + 2;\n```\n\nBut if you want the product of 2 times 4 to be\
    \ multiplied by the number you get when you total 4 and 2, write this...\n\n```javascript\n\
    resultOfComputation = (2 * 4) * (4 + 2);\n```\n\n> Find the interactive coding\
    \ exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/7.html](http://www.ASmarterWayToLearn.com/javascript/7.html)\n\
    \n## Concatenating Text Strings\n\nIn Chapter 1 you learned to display a message\
    \ in an alert, coding it this way:\n\n```javascript\nalert(\"Thanks for your input!\"\
    );\n```\n\nOr you could code it this way:\n\n```javascript\nvar message = \"Thanks\
    \ for your input!\";\nalert(message);\n```\n\nBut suppose you wanted to personalize\
    \ a message. In another part of your code you've asked the user for her name and\
    \ assigned the name that she entered to a variable, `userName`.\n\nNow, you want\
    \ to combine her name with a standard \"Thanks\" to produce an alert that says,\
    \ for example, \"Thanks, Susan!\"\n\nWhen the user provided her name, we assigned\
    \ it to the variable `userName`. This is the code:\n\n```javascript\nalert(\"\
    Thanks, \" + userName + \"!\");\n```\n\nUsing the plus operator, the code combines—concatenates—three\
    \ elements into the message: the string `\"Thanks, \"` plus the string represented\
    \ by the variable `userName` plus the string `\"!\"`. Note that the first string\
    \ includes a space. Without it, the alert would read, \"Thanks,Susan!\".\n\nYou\
    \ can concatenate any combination of strings and variables, or all strings or\
    \ all variables. For example, I can rewrite the last example this way:\n\n```javascript\n\
    var message = \"Thanks, \";\nvar banger = \"!\";\nalert(message + userName + banger);\n\
    ```\n\nHere it is, with three strings:\n\n```javascript\nalert(\"Thanks, \" +\
    \ \"Susan\" + \"!\");\n```\n\nYou can assign a concatenation to a variable:\n\n\
    ```javascript\nvar message = \"Thanks, \";\nvar userName = \"Susan\";\nvar banger\
    \ = \"!\";\nvar customMess = message + userName + banger;\nalert(customMess);\n\
    ```\n\nIf you put numbers in quotes, JavaScript concatenates them as strings rather\
    \ than adding them. This code...\n\n```javascript\nalert(\"2\" + \"2\");\n```\n\
    \n...displays the message \"22\". If you mix strings and numbers...\n\n```javascript\n\
    alert(\"2 plus 2 equals \" + 2 + 2);\n```\n\n...JavaScript automatically converts\
    \ the numbers to strings, and displays the message \"2 plus 2 equals 22\".\n\n\
    > Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/8.html](http://www.ASmarterWayToLearn.com/javascript/8.html)\n\
    \n## Prompts\n\nA prompt box asks the user for some information and provides a\
    \ response field for her answer.\n\nThis code asks the user the question \"Your\
    \ species?\" and provides a default answer in the response field, \"human\". Her\
    \ response is assigned to the variable.\n\n```javascript\nvar spec = prompt(\"\
    Your species?\", \"human\");\n```\n\n`prompt()` code is like `alert()` code, with\
    \ two differences:\n\n* In a prompt, you need a way to capture the user's response.\
    \ That means you need to start by declaring a variable, followed by an equal sign.\n\
    * In a prompt, you can specify a second string. This is the default response that\
    \ appears in the field when the prompt displays.\n\nAs you might expect, you can\
    \ assign the strings to variables, then specify the variables instead of strings\
    \ inside the parentheses:\n\n```javascript\nvar question = \"Your species?\";\n\
    var defaultAnswer = \"human\";\nvar spec = prompt(question, defaultAnswer);\n\
    ```\n\nThe user's response is a text string. Even if the response is a number,\
    \ it comes back as a string. For example, consider this code:\n\n```javascript\n\
    var numberOfCats = prompt(\"How many cats?\");\nvar tooManyCats = numberOfCats\
    \ + 1;\n```\n\nIf the user enters 3, you might expect `tooManyCats` to be 4. But\
    \ all responses to prompts come back as strings. When the string `\"3\"` is linked\
    \ with a plus to the number `1`, JavaScript converts the `1` to a string and concatenates.\
    \ So the value of `tooManyCats` winds up being `\"31\"`.\n\n* If the user enters\
    \ nothing and clicks OK, the variable is assigned an empty string: `\"\"`.\n*\
    \ If the user clicks Cancel, the variable is assigned a special value, `null`.\n\
    \nNote:\n* Some coders write `window.prompt` instead of simply `prompt`. This\
    \ is a highly formal but perfectly correct way to write it.\n* In the example\
    \ above, some coders would use single rather than double quotation marks. This\
    \ is legal, as long as it's a matching pair.\n\n> Find the interactive coding\
    \ exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/9.html](http://www.ASmarterWayToLearn.com/javascript/9.html)\n\
    \n## if Statements\n\nSuppose you code a prompt that asks, \"Where does the Pope\
    \ live?\" If the user answers correctly, you display an alert congratulating him.\n\
    \nThis is the code:\n\n```javascript\nvar x = prompt(\"Where does the Pope live?\"\
    );\nif (x === \"Vatican\") {\n   alert(\"Correct!\");\n}\n```\n\nIf the user enters\
    \ `\"Vatican\"` in the prompt field, the congratulations alert displays. If he\
    \ enters something else, nothing happens.\n\n### Breakdown of the if Statement\n\
    \nAn `if` statement always begins with `if`. The space that separates it from\
    \ the parenthesis is a matter of style, but common style rules sanction this inconsistency\
    \ compared to `alert(\"Hi\");`.\n\nFollowing the `if` keyword-plus-space is the\
    \ condition that's being tested—does the variable that's been assigned the user's\
    \ response have a value of `\"Vatican\"`? The condition is enclosed in parentheses.\n\
    \nIf the condition tests true, something happens. In this case, only one statement\
    \ executes: a congratulatory alert displays.\n\nThe first line of an `if` statement\
    \ ends with an opening curly bracket `{`. An entire `if` statement ends with a\
    \ closing curly bracket `}` on its own line. Note that this is an exception to\
    \ the rule that a statement ends with a semicolon.\n\nRegarding the triple equal\
    \ sign `===`: the single equal sign `=` is reserved for assigning a value to a\
    \ variable. If you're testing a variable for a value, you cannot use the single\
    \ equal sign.\n"
  raw: 'If I move the parentheses, the arithmetic is done in a different order. In
    this next statement, the placement of the parens tells JavaScript to first add
    1 and 3, then multiply by 4\. The result is 16.


    `var totalCost =` `(1 + 3)` `* 4;`


    Here''s another example.


    `var resultOfComputation = (2 * 4) * 4 + 2;`


    By placing the first multiplication operation inside parentheses, you''ve told
    JavaScript to do that operation first. But then what? The order could be..


    1.  Multiply 2 by 4.


    2.  Multiply that product by 4.


    3.  Add 2 to it.


    ...giving `resultOfComputation` a value of 34.


    Or the order could be...


    1.  Multiply 2 by 4.


    2.  Multiply that product by the sum of 4 and 2.


    ...giving `resultOfComputation` a value of 48.


    The solution is more parentheses.


    If you want the second multiplication to be done before the 2 is added, write
    this...


    `resultOfComputation =` `((2 * 4) * 4)` `+ 2;`


    But if you want the product of 2 times 4 to be multiplied by the number you get
    when you total 4 and 2, write this...


    `resultOfComputation =` `(2 * 4)` `*` `(4 + 2)``;`


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/7.html](http://www.ASmarterWayToLearn.com/javascript/7.html)


    8


    Concatenating text strings


    In Chapter 1 you learned to display a message in an alert, coding it this way.


    `alert("Thanks for your input!");`


    Or you could code it this way.


    `1 var` `message` `= "Thanks for your input!";`


    `2 alert(``message``);`


    But suppose you wanted to personalize a message. In another part of your code
    you''ve asked the user for her name and assigned the name that she entered to
    a variable, `userName`. (You don''t know how to do this yet. You''ll learn how
    in a subsequent chapter.)


    Now, you want to combine her name with a standard "Thanks" to produce an alert
    that says, for example, "Thanks, Susan!"


    When the user provided her name, we assigned it to the variable `userName`. This
    is the code.


    `alert("Thanks, " +` `userName` `+ "!");`


    Using the plus operator, the code combines—concatenates—three elements into the
    message: the string "Thanks, " plus the string represented by the variable `userName`
    plus the string "!"


    Note that the first string includes a space. Without it, the alert would read,
    "Thanks,Susan!".


    You can concatenate any combination of strings and variables, or all strings or
    all variables. For example, I can rewrite the last example this way.


    `1 var message = "Thanks, ";`


    `2 var banger = "!";`


    `3 alert(``message + userName + banger``);`


    Here it is, with three strings.


    `alert(``"Thanks, " + "Susan" + "!"``);`


    You can assign a concatenation to a variable.


    `1 var message = "Thanks, ";`


    `2 var userName = "Susan";`


    `3 var banger = "!";`


    `4 var` `customMess` `= message + userName + banger;`


    `5 alert(``customMess``);`


    If you put numbers in quotes, JavaScript concatenates them as strings rather than
    adding them. This code...


    `alert("2" + "2");`


    ...displays the message "22".


    If you mix strings and numbers...


    `alert("2 plus 2 equals " + 2 + 2);`


    ...JavaScript automatically converts the numbers to strings, and displays the
    message "2 plus 2 equals 22".


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/8.html](http://www.ASmarterWayToLearn.com/javascript/8.html)


    9


    Prompts


    A prompt box asks the user for some information and provides a response field
    for her answer.


    This code asks the user the question "Your species?" and provides a default answer
    in the response field, "human". She can change the response. Whether she leaves
    the default response as-is or changes it to something else, her response is assigned
    to the variable.


    `var spec =` `prompt``("Your species?", "human");`


    Prompt code is like alert code, with two differences.


    *   In a prompt, you need a way to capture the user''s response. That means you
    need to start by declaring a variable, followed by an equal sign.


    *   In a prompt, you can specify a second string. This is the default response
    that appears in the field when the prompt displays. If the user leaves the default
    response as-is and just clicks OK, the default response is assigned to the variable.
    It''s up to you whether you include a default response.


    As you might expect, you can assign the strings to variables, then specify the
    variables instead of strings inside the parentheses.


    `1 var` `question` `= "Your species?";`


    `2 var` `defaultAnswer` `= "human";`


    `3 var spec = prompt(``question``,` `defaultAnswer``);`


    The user''s response is a text string. Even if the response is a number, it comes
    back as a string. For example, consider this code.


    `1 var` `numberOfCats` `= prompt("How many cats?");`


    `2 var tooManyCats =` `numberOfCats` `+ 1;`


    Since you''re asking for a number, and the user is presumably entering one, you
    might expect the math in the second statement to work. For example, if the user
    enters 3, the variable `tooManyCats` should have a value of 4, you might think.
    But no such luck. All responses to prompts come back as strings. When the string,
    "3", is linked with a plus to the number, 1, JavaScript converts the 1 to a string
    and concatenates. So the value of `tooManyCats` winds up being not 4 but "31".
    You''ll learn how to solve this problem in a subsequent chaper.


    If the user enters nothing and clicks OK, the variable is assigned an empty string:
    ""


    If the user clicks Cancel, the variable is assigned a special value, null.


    ![](images/00009.jpg)


    *   Some coders write `window.prompt` instead of, simply, `prompt`. This is a
    highly formal but perfectly correct way to write it. Most coders prefer the short
    form. We''ll stick to the short form in this training.


    *   In the example above, some coders would use single rather than double quotation
    marks. This is legal, as long as it''s a matching pair. But in a case like this,
    I''ll ask you to use double quotation marks.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/9.html](http://www.ASmarterWayToLearn.com/javascript/9.html)


    10


    if statements


    Suppose you code a prompt that asks, "Where does the Pope live?"


    If the user answers correctly, you display an alert congratulating him.


    This is the code.


    `1 var x = prompt("Where does the Pope live?");`


    `2` `if (x === "Vatican") {`


    `3   alert("Correct!");`


    `4 }`


    If the user enters "Vatican" in the prompt field, the congratulations alert displays.
    If he enters something else, nothing happens. (This simplified code doesn''t allow
    for other correct answers, like "The Vatican." I don''t want to get into that
    now.)


    There''s a lot to take in here. Let''s break it down.


    An if statement always begins with `if`. The space that separates it from the
    parenthesis is new to you. I''ve taught you to code alerts and prompts with the
    opening parenthesis running up against the keyword: `alert("Hi");` Now I''m asking
    you not to do that in an if statement. It''s purely a matter of style, but common
    style rules sanction this inconsistency.


    Following the `if` keyword-plus-space is the condition that''s being tested—does
    the variable that''s been assigned the user''s response have a value of "Vatican"?


    The condition is enclosed in parentheses.


    If the condition tests true, something happens. Any number of statements might
    execute. In this case, only one statement executes: a congratulatory alert displays.


    The first line of an if statement ends with an opening curly bracket. An entire
    if statement ends with a closing curly bracket on its own line. Note that this
    is an exception to the rule that a statement ends with a semicolon. It''s common
    to omit the semicolon when it''s a complex statement that''s paragraph-like and
    ends in a curly bracket.


    But what about that triple equal sign? You might think that it should just be
    an equal sign, but the equal sign is reserved for assigning a value to a variable.
    If you''re testing a variable for a value, you can''t use the single equal sign.'
