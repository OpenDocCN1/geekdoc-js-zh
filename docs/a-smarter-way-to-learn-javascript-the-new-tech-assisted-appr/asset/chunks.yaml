    Functions:


    Passing data back from them


    As you learned in the last chapter, a function becomes more versatile when you
    pass data to it so it can deliver a custom job.


    But a function can do even more. It can pass data back to the calling code.


    Let''s say you charge a minimum shipping rate of $5, plus 3 percent of the merchandise
    total above $50, up to $100\. You offer free shipping when the total hits $100\.
    Here''s the code that calculates the order total.


    `1  var orderTot;`


    `2  if (merchTot >= 100) {`


    `3    orderTot = merchTot;`


    `4  }`


    `5  else if (merchTot < 50.01) {`


    `6    orderTot = merchTot + 5;`


    `7  }`


    `8  else {`


    `9    orderTot = merchTot + 5 + (.03 * (merchTot - 50));`


    `10 }`


    If the merchandise total is at least $100 (line 2), the order total is the same
    as the merchandise total (line 3). If the merchandise total is $50 or less (line
    5), the order total is the merchandise total plus $5 (line 6). If the order total
    is between $50 and $100 (line 8), the order total is the merchandise total plus
    $5 plus 3 percent of the amount over $50 (line 9).


    Something costing $150 is $150 total.


    Something costing $15 is $20 total.


    Something costing $70 is $75.60 total.


    Here''s how we turn the code above into a function.


    `1  function calcTot(merchTot) {`


    `2    ``var orderTot;`


    `3    if (merchTot >= 100) {`


    `4      ``orderTot` `= merchTot;`


    `5    }`


    `6    else if (merchTot < 50.01) {`


    `7      ``orderTot` `= merchTot + 5;`


    `8    }`


    `9    else {`


    `10     ``orderTot` `= merchTot + 5 + (.03 * (merchTot - 50));`


    `11   }`


    `12` `return orderTot;`


    `13 }`


    The thing to focus on here is that we declare a variable, `orderTot` (line 2),
    and then—here''s what''s new—after the processing is done and the merchandise
    total is known, the function returns the value held in `orderTot` to the calling
    code (line 12). It passes data back.


    But then the calling code needs something to catch the data. What else could this
    something be but a variable? Here''s the code that calls the function.


    `var totalToCharge =` `calcTot(79.99)``;`


    If you''re new to coding, this statement may look odd to you. How can a function
    be assigned to a variable? You may be used to seeing a literal value assigned
    to a variable....


    `var totalToCharge =` `85.00``;`


    You may be used to seeing a variable assigned to a variable...


    `var totalToCharge =` `merchTotal``;`


    And you may be used to seeing an arithmetic or other expression assigned to a
    variable...


    `var totalToCharge =` `merchTotal + ship + tax``;`


    But assigning a function to a variable?


    Well, it''s not really that odd, because, remember, what you''re actually assigning
    to the variable is the value passed back by the `return` statement in the function
    code. The statement...


    `var totalToCharge = calcTot(79.99);`


    ...is shorthand for: "Assign to the variable `totalToCharge` the value returned
    by the function `calcTot`."


    So now there''s two-way communication between the calling code and the function.
    The calling code passes the value 79.99 to the function, which is caught by the
    function''s parameter `merchTot`. This variable, `merchTot`, is used in the body
    of the function to calculate an order total. Then, through the `return` statement,
    that order total is passed back to `totalToCharge` in the calling code. It''s
    a complete circle.


    Notice that the variable in the calling code, `totalToCharge`, that catches the
    value is different from the variable inside the function, `merchTot`, that returns
    the value. I did this purposely, so you wouldn''t think the two variables have
    to share the same name. In the last chapter you learned that when an argument
    in the calling code passes a value to a parameter in the function definition,
    they can have the same name, but don''t have to. The same applies to the variable
    that''s returned from a function and the variable in the calling code that catches
    it. They can share the same name, but don''t have to.


    Anywhere you can use a variable, you can use a function. (Technically, a function
    is a variable.) For example...


    You can use a function to specify the message in an alert.


    `alert(``calcTot(79.99)``);`


    In the example above, the alert message is the value returned by the function
    `calcTot` when the function is passed 79.99 as a parameter.


    You can use a function in an expression.


    `var orderTot = merchTot +` `calcTax(merchTot)``;`


    In the example above, the value assigned to `orderTot` is the sum of `merchTot`
    and the value returned by the function `calcTax` when the function is passed `merchTot`
    as an argument.


    You can use a function in a function call.


    `var tot = calc(merchTot,` `calcTax(merchTot)``);`


    In the example above, the calling code passes two arguments to the function `calc`.
    The first argument is `merchTot`. The second argument is the function `calcTax`,
    which is also passed `merchTot`.


    Within a function, you can call another function.


    `1 function calcTot(price) {`


    `2   return price +` `calcShip(price)``;`


    `3 }`


    In the example above, the function `calcTot` calls the function `calcShip`. It
    passes `price` as an argument and receives the shipping charge back. It adds the
    shipping charge to the price, and returns the sum to the original calling code
    as a total.


    You''ve learned that you can pass any number of arguments to any number of parameters.
    Unfortunately, you don''t have this flexibility in the `return` statement. No
    matter how many parameters it takes or how much processing it does, a function
    can return only a single value to the code that calls it.'
