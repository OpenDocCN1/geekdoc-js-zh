  trans: "\n\n当空白字符位于尖括号内时，浏览器不会将其视为文本节点。因此，如果你像上面的代码那样将所有回车、制表符和空格“隐藏”在尖括号内，DOM 中就不会有垃圾节点。任何可能干扰\
    \ JavaScript 读取信号的噪声都会被移除。\n\n你也可以使用像 [`www.willpeavy.com/minifier/`](http://www.willpeavy.com/minifier/)\
    \ 这样的压缩程序来清理 DOM 中的垃圾节点。当然，你需要保留文件的原始未压缩版本，以便将来能够轻松地修改页面。\n\n```\n<html><head><title>Simple\
    \ document</title></head><body><div><p>There's not much to this.</p><p>Nor to\
    \ this.</p></div></body></html>\n```\n\n另一种方法是按常规方式格式化 HTML，然后让 JavaScript 嗅探出垃圾节点。JavaScript\
    \ 可以检查节点以确定其类型——元素、文本、注释等。例如，以下语句检查目标节点的节点类型并将其赋值给变量 `nType`。\n\n```\nvar nType\
    \ = targetNode.nodeType;\n```\n\n在上面的语句中，JavaScript 将一个代表节点类型的数字赋值给变量 `nType`。如果节点是像\
    \ `<div>` 或 `<p>` 这样的元素，数字为 1。如果是文本节点，数字为 3。\n\n假设你想将某个特定 div 中第二个段落的文本内容替换为字符串\
    \ \"All his men.\"。以下是标记，其中我们将要更改的文本高亮显示。\n\n```\n<div id=\"humpty\">\n  <p>All\
    \ the king's horses.</p>\n  <p>All the dude's crew.</p>\n  <p>All the town's orthopedists.</p>\n\
    </div>\n```\n\n这是代码。\n\n```\n1  var d = document.getElementById(\"humpty\");\n\
    2  var pCounter = 0;\n3  for (var i = 0; i < d.childNodes.length; i++) {\n4  \
    \  if (d.childNodes[i].nodeType === 1 ) {\n5      pCounter++;\n6    }\n7    if\
    \ (pCounter === 2) {\n8      d.childNodes[i].innerHTML = \"All his men.\";\n9\
    \      break;\n10   }\n11 }\n```\n\n以下是分解说明：\n\n1. 将 div 赋值给变量 `d`\n2. 统计段落数量\n\
    3. 遍历 div 的子节点，寻找下一个元素节点，即类型 1，我们假设它是一个段落\n4-6. 计数器加 1。我们正在寻找第二个段落。\n7-9. 当计数器达到\
    \ 2 时，我们就找到了目标段落。更改文本\n\n当然，如果你知道你可能希望 JavaScript 更改第二个段落，那么给它分配一个 id 并直接定位它会容易得多，就像这样。\n\
    \n```\ndocument.getElementById(\"p2\").innerHTML = \"All his men.\";\n```\n\n\
    你可以理解为什么 `getElementById` 方法比追踪 DOM 层级更受程序员欢迎。但有些事情如果不通过处理 DOM 的父子关系就无法完成，你将在后续章节中了解到。\n\
    \n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/61.html`](http://www.ASmarterWayToLearn.com/javascript/61.html)\n\
    \n## 62 DOM：更多定位元素的方法\n\n到目前为止，你已经学会了使用 DOM 的父子层级，通过指定子节点在类似数组的子节点集合中的顺序来定位父节点的子节点——`childNodes[0]`、`childNodes[1]`、`childNodes[2]`\
    \ 等等。但还有其他利用层级进行定位的方法。首先，你可以用 `firstChild` 代替 `childNodes[0]`。另外，例如，要定位一个有 10\
    \ 个子节点的集合中的第 10 个子节点，你可以用 `lastChild` 代替 `childNodes[9]`。\n\n```\nvar targetNode\
    \ = parentNode.childNodes[0];\n```\n\n...等同于...\n\n```\nvar targetNode = parentNode.firstChild;\n\
    ```\n\n如果有 3 个子节点...\n\n```\nvar targetNode = parentNode.childNodes[2];\n```\n\
    \n...等同于...\n\n```\nvar targetNode = parentNode.lastChild;\n```\n\n你也可以反向操作，定位任何子节点的父节点。假设你有以下标记。使用\
    \ DOM，如何找到高亮 div 的父节点？\n\n```\n<div id=\"div1\">\n  <div id=\"div2\">\n    <p>Chicago</p>\n\
    \    <p>Kansas City</p>\n    <p>St. Louis</p>\n  </div>\n</div>\n```\n\n你想知道 id\
    \ 为 \"div2\" 的 div 的父节点。以下代码将 \"div2\" div 的父节点赋值给变量 `pNode`。\n\n```\n1 var kidNode\
    \ = document.getElementById(\"div2\");\n2 var pNode = kidNode.parentNode;\n```\n\
    \n你可以使用 `nextSibling` 和 `previousSibling` 来定位元素子节点集合中的下一个子节点和上一个子节点。在以下代码中，第一条语句定位\
    \ id 为 \"div1\" 的 div。第二条语句定位与 \"div1\" id 具有相同父节点的下一个节点。\n\n```\n1 var firstEl\
    \ = document.getElementById(\"div1\");\n2 secondEl = firstEl.nextSibling;\n```\n\
    \n如果没有 `nextSibling` 或 `previousSibling`，你会得到 null。在以下代码中，变量 `nonexistentEl` 的值为\
    \ null，因为 JavaScript 发现没有与 `firstEl` 具有相同父节点的上一个节点。\n\n```\n1 var firstEl = document.getElementById(\"\
    div1\");\n2 var nonexistentEl = firstEl.previousSibling;\n```\n\n计算兄弟节点可能很棘手，因为正如你所知，某些浏览器会将\
    \ HTML 格式化产生的空白字符视为文本节点，即使它们是空的且没有意义。\n\n在上面的 HTML 示例中，有两个 div 和三个段落，你可能会认为第一个段落的\
    \ next sibling 是第二个段落。但实际上，在某些浏览器中，第一个段落的 next sibling 是一个空文本节点。该节点的 next sibling\
    \ 才是第二个段落。\n\n这意味着，为了使用 `nextSibling` 或 `previousSibling` 定位节点，你必须像上一章中展示的那样防御性地格式化\
    \ HTML 标记，或者像上一章中展示的那样对每个节点进行类型检查，以确保它是你正在寻找的类型。\n\n我再次强调，最好为你可能想要“读取”或更改的任何节点分配一个\
    \ id。然后你可以使用 `document.getElementById` 更直接地定位该节点。\n\n> 本章的交互式编程练习请访问：\n> [`www.ASmarterWayToLearn.com/js/62.html`](http://www.ASmarterWayToLearn.com/javascript/62.html)\n\
    \n## 63 DOM：获取目标的名称\n\n在之前的章节中，你学习了如何通过如下语句获取节点的节点类型。\n\n```\nvar nType = targetNode.nodeType;\n\
    ```\n\n在上面的例子中，如果节点是元素，变量 `nType` 将被赋值为数字 1。如果节点是文本，则赋值为数字 3。\n\n你可以使用 `nodeName`\
    \ 获取关于节点的更多信息。在以下示例中，目标节点的节点名称被赋值给变量 `nName`。\n\n```\n1 var parent = document.getElementById(\"\
    div1\");\n2 var target = parent.firstChild;\n3 nName = target.nodeName;\n```\n\
    \n第 1 行和第 2 行定位 id 为 \"div1\" 的元素的第一个子节点。第 3 行将目标的节点名称赋值给变量 `nName`。\n\n在上面的例子中，如果节点是元素，变量\
    \ `nName` 将被赋值为一个字符串，如 P 或 DIV，对应于尖括号内标签的字符。在 HTML 中，名称通常以全大写形式给出，即使标记是小写的。\n\n\
    | 标签 | 节点名称 |\n| --- | --- |\n| `<p>` 或 `<P>` | P |\n| `<div>` 或 `<DIV>` | DIV\
    \ |\n| `<span>` 或 `<SPAN>` | SPAN |\n| `<img>` 或 `<IMG>` | IMG |\n| `<a>` 或 `<A>`\
    \ | A |\n| `<em>` 或 `<EM>` | EM |\n| `<table>` 或 `<TABLE>` | TABLE |\n| `<li>`\
    \ 或 `<LI>` | LI |\n\n另一方面，如果节点是文本节点，其名称始终是 `#text`——小写形式。\n\n如果是文本节点，你可以通过以下方式获取其值（即内容）。\n\
    \n```\n1 var parent = document.getElementById(\"div1\");\n2 var target = parent.firstChild;\n\
    3 var nTextContent = target.nodeValue;\n```\n\n第 1 行和第 2 行定位 id 为 \"div1\" 的元素的第一个子节点。第\
    \ 3 行将节点值赋值给变量 `nTextContent`。\n\n"
