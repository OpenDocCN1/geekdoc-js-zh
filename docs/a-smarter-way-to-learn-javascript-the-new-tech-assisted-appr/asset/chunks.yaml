- fmt: "\n## Array Manipulation: splice and slice\n\nUse the `splice` method to insert\
    \ one or more elements anywhere in an array, while optionally removing one or\
    \ more elements that come after it. Suppose you have an array with the elements\
    \ \"dog\", \"cat\", \"fly\", \"bug\", \"ox\". The following code adds \"pig\"\
    , \"duck\", and \"emu\" after \"cat\" while removing \"fly\" and \"bug\".\n\n\
    ```javascript\npets.splice(2, 2, \"pig\", \"duck\", \"emu\");\n```\n\nThe first\
    \ digit inside the parentheses is the index of the position where you want to\
    \ start adding if you're adding and deleting if you're deleting. The second digit\
    \ is the number of existing elements to remove, starting with the first element\
    \ that comes after the element(s) that you're splicing in. The code above leaves\
    \ you with an array consisting of \"dog\", \"cat\", \"pig\", \"duck\", \"emu\"\
    , and \"ox\".\n\nYou could make additions without removing any elements. The following\
    \ code adds \"pig\", \"duck\", and \"emu\" without removing any elements.\n\n\
    ```javascript\npets.splice(2, 0, \"pig\", \"duck\", \"emu\");\n```\n\nYou can\
    \ also remove elements without adding any. If you start with the elements \"dog\"\
    , \"cat\", \"fly\", \"bug\", and \"ox\", the following code removes two elements\
    \ starting at index 3—\"bug\" and \"ox\". This leaves \"dog\", \"cat\", and \"\
    fly\".\n\n```javascript\npets.splice(2, 2);\n```\n\nUse the `slice` method to\
    \ copy one or more consecutive elements in any position and put them into a new\
    \ array. If you start with an array, `pets`, consisting of \"dog\", \"cat\", \"\
    fly\", \"bug\", and \"ox\", the following code copies \"fly\" and \"bug\" to the\
    \ new array `noPets` and leaves the original array, `pets`, unchanged.\n\n```javascript\n\
    var noPets = pets.slice(2, 4);\n```\n\nThe first digit inside the parentheses\
    \ is the index of the first element to be copied. The second digit is the index\
    \ of the element after the last element to be copied.\n\nTwo things could trip\
    \ you up here:\n\n* Since the first index number inside the parentheses specifies\
    \ the first element to be copied, you might think the second index number specifies\
    \ the last element to be copied. In fact, the second number specifies the index\
    \ number of the element after the last element to be copied.\n* You must assign\
    \ the sliced elements to an array. It could, of course, be the same array from\
    \ which you're doing the slicing. In that case, you'd be reducing the original\
    \ array to only the copied elements.\n\n> Find the interactive coding exercises\
    \ for this chapter at: [http://www.ASmarterWayToLearn.com/js/17.html](http://www.ASmarterWayToLearn.com/javascript/17.html)\n\
    \n## For Loops\n\nYou know the song \"99 Bottles of Beer on the Wall\"? If you're\
    \ teaching someone the song, you could give them these instructions:\n\n1. Sing\
    \ \"99 bottles of beer on the wall, 99 bottles of beer.\"\n2. Sing \"Take one\
    \ down and pass it around, 98 bottles of beer on the wall.\"\n3. Sing \"98 bottles\
    \ of beer on the wall, 98 bottles of beer.\"\n4. Sing \"Take one down and pass\
    \ it around, 97 bottles of beer on the wall.\"\n5. Sing \"97 bottles of beer on\
    \ the wall, 97 bottles of beer.\"\n6. Sing \"Take one down and pass it around,\
    \ 96 bottles of beer on the wall.\"\n\n...and so on, for 192 more lines of instructions.\n\
    \nBut that isn't how you'd give the instructions, is it? You'd be more concise.\
    \ You'd say something like this:\n\nSing \"99 bottles of beer on the wall, 99\
    \ bottles of beer. Take one down and pass it around, 98 bottles of beer on the\
    \ wall.\" Repeat this, subtracting 1 each time, until there are no more bottles\
    \ of beer on the wall.\n\nIn coding, you run into the bottles-of-beer situation\
    \ quite often. For example, suppose you've offered to check if the user's city\
    \ is one of the 5 cleanest in the U.S. The user has entered her city, and you've\
    \ assigned her city to the variable `cityToCheck`.\n\nYou've already assigned\
    \ the list of the 5 cleanest cities to the array `cleanestCities`.\n\n```javascript\n\
    var cleanestCities = [\"Cheyenne\", \"Santa Fe\", \"Tucson\", \"Great Falls\"\
    , \"Honolulu\"];\n```\n\nNow you go through the array to see if there's a match\
    \ with the user's city. If there is, you display an alert telling the user her\
    \ city is one of the cleanest. If there's no match, you display an alert telling\
    \ the user her city isn't on the list.\n\n```javascript\nif (cityToCheck === cleanestCities[0])\
    \ {\n    alert(\"It's one of the cleanest cities\");\n}\nelse if (cityToCheck\
    \ === cleanestCities[1]) {\n    alert(\"It's one of the cleanest cities\");\n\
    }\nelse if (cityToCheck === cleanestCities[2]) {\n    alert(\"It's one of the\
    \ cleanest cities\");\n}\nelse if (cityToCheck === cleanestCities[3]) {\n    alert(\"\
    It's one of the cleanest cities\");\n}\nelse if (cityToCheck === cleanestCities[4])\
    \ {\n    alert(\"It's one of the cleanest cities\");\n}\nelse {\n    alert(\"\
    It's not on the list\");\n}\n```\n\nConveniently, JavaScript provides a more concise\
    \ coding approach. Here's a `for` loop that accomplishes most of what the verbose\
    \ code in the example above accomplishes.\n\n```javascript\nfor (var i = 0; i\
    \ <= 4; i++) {\n    if (cityToCheck === cleanestCities[i]) {\n        alert(\"\
    It's one of the cleanest cities\");\n    }\n}\n```\n\nLet me break down the first\
    \ line for you. The first line begins with the keyword `for`. The three specifications\
    \ that define the loop are inside the parentheses.\n\n1. A variable that counts\
    \ iterations and also serves as the changing array index is declared and set to\
    \ a starting value, in this case `0`.\n2. The limit on the loop is defined. In\
    \ this case, the loop is to keep running as long as the counter doesn't exceed\
    \ `4`. Since the counter, in this case, is starting at `0`, the loop will run\
    \ 5 times.\n3. What happens to the counter at the end of every loop. In this case,\
    \ the counter is incremented each time.\n\nThe three specifications inside the\
    \ parentheses are always in the same order:\n\n1. What to call the counter (usually\
    \ `i`) and what number to start it at (typically `0`)\n2. How many loops to run\
    \ (in this case, the number of elements in the array)\n3. How to change the counter\
    \ after each iteration (typically to add 1 each time through)\n\nThings to keep\
    \ in mind:\n\n* In the example, the counter, `i`, serves two purposes. It keeps\
    \ track of the number of iterations so looping can halt at the right point. And\
    \ it serves as the index number of the array, allowing the code to progress through\
    \ all the elements of the array as the counter increments with each iteration.\n\
    * There is nothing sacred about using `i` as the counter. You can use any legal\
    \ variable name. But coders usually use `i` because it keeps the first line compact,\
    \ and because coders understand that `i` stands for \"iteration.\"\n* In the example,\
    \ the initial count is `0`, the index number of the first element of the array.\
    \ But it could be any number, depending on your needs.\n* In the example, the\
    \ counter increments with each iteration. But, depending on your needs, you can\
    \ decrement it, increase it by 2, or change it in some other way each time through.\n\
    * In the example, I specify that the loop is to run as long as `i <= 4`. Alternatively,\
    \ I could have specified `i < 5`. Either way, since the counter starts at `0`,\
    \ the loop runs 5 times.\n\n> Find the interactive coding exercises for this chapter\
    \ at: [http://www.ASmarterWayToLearn.com/js/18.html](http://www.ASmarterWayToLearn.com/javascript/18.html)\n\
    \n## For Loops: Flags, Booleans, Array Length, and Loopus Interruptus\n\nThere\
    \ are several problems with the `for` loop example I gave you in the last chapter.\
    \ The first problem is a potential communication problem. If a match between the\
    \ user's city and the list of cleanest cities is found, a confirming alert displays.\
    \ But if there is no match, nothing happens. The user is left in the dark. If\
    \ no match is found, we need to display an alert saying so. But how do we do that?\n\
    \nWe do it with a flag. A flag is just a variable that starts out with a default\
    \ value that you give it, and then is switched to a different value under certain\
    \ conditions. In our example, let's say this is the flag.\n\n```javascript\nvar\
    \ matchFound = \"no\";\n```\n"
  raw: 'Use the `splice` method to insert one or more elements anywhere in an array,
    while optionally removing one or more elements that come after it. Suppose you
    have an array with the elements "dog", "cat", "fly", "bug", "ox". The following
    code adds "pig", "duck", and "emu" after "cat" while removing "fly" and "bug".


    `pets.``splice``(2, 2, "pig", "duck", "emu");`


    The first digit inside the parentheses is the index of the position where you
    want to start adding if you''re adding and deleting if you''re deleting. The second
    digit is the number of existing elements to remove, starting with the first element
    that comes after the element(s) that you''re splicing in. The code above leaves
    you with an array consisting of "dog", "cat", "pig", "duck", "emu", and "ox".


    You could make additions without removing any elements. The following code adds
    "pig", "duck", and "emu" without removing any elements.


    `pets.splice(2,` `0``, "pig", "duck", "emu");`


    You can also remove elements without adding any. If you start with the elements
    "dog", "cat", "fly", "bug", and "ox", the following code removes two elements
    starting at index 3—"bug" and "ox". This leaves "dog", "cat", and "fly".


    `pets.splice(2, 2);`


    Use the `slice` method to copy one or more consecutive elements in any position
    and put them into a new array. If you start with an array, `pets`, consisting
    of "dog", "cat", "fly", "bug", and "ox", the following code copies "fly" and "bug"
    to the new array `noPets` and leaves the original array, `pets`, unchanged.


    `var noPets = pets.``slice``(2, 4);`


    The first digit inside the parentheses is the index of the first element to be
    copied. The second digit is the index of the element after the last element to
    be copied.


    Two things could trip you up here:


    *   Since the first index number inside the parentheses specifies the first element
    to be copied, you might think the second index number specifies the last element
    to be copied. In fact, the second number specifies the index number of the element
    after the last element to be copied.


    *   You must assign the sliced elements to an array. It could, of course, be the
    same array from which you''re doing the slicing. In that case, you''d be reducing
    the original array to only the copied elements.


    > Find the interactive coding exercises for this chapter at:


    > [http://www.ASmarterWayToLearn.com/js/17.html](http://www.ASmarterWayToLearn.com/javascript/17.html)


