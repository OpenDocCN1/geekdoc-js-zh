    ## 测试条件组合


    使用`if`语句，你已经学会了测试一个条件。如果条件满足，就会执行一条或多条语句。但假设测试成功需要满足两个条件，而不是一个。


    例如，如果一个家伙体重超过 300 磅，他只是一个超级大块头。但如果他体重超过 300 磅，并且 40 码冲刺跑进 6 秒以内呢？你会邀请他尝试加入 NFL
    担任前锋。你可以使用`&&`在 JavaScript 中测试条件的组合。


    代码如下：


    ```javascript

    1 if (weight > 300 && time < 6) {

    2   alert("Come to our tryout!");

    3 }

    4 else {

    5   alert("Come to our cookout!");

    6 }

    ```


    你可以将任意数量的条件串联起来。


