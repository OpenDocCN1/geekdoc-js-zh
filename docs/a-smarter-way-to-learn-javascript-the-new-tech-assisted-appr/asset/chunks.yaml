  trans: "\n\n# 算术顺序与括号\n\n如果移动括号，算术运算的顺序就会改变。在下面的语句中，括号的位置告诉 JavaScript 先计算 1 加 3，然后再乘以\
    \ 4。结果是 16。\n\n```javascript\nvar totalCost = (1 + 3) * 4;\n```\n\n再来看一个例子。\n\n\
    ```javascript\nvar resultOfComputation = (2 * 4) * 4 + 2;\n```\n\n通过将第一个乘法运算放在括号内，你告诉\
    \ JavaScript 先执行该运算。但接下来会发生什么？顺序可能是：\n\n1. 计算 2 乘以 4。\n2. 将结果乘以 4。\n3. 再加上 2。\n\
    \n……这样 `resultOfComputation` 的值就是 34。\n\n或者顺序可能是……\n\n1. 计算 2 乘以 4。\n2. 将结果乘以\
    \ 4 与 2 的和。\n\n……这样 `resultOfComputation` 的值就是 48。\n\n解决办法是使用更多的括号。如果你希望在加 2 之前先执行第二个乘法，可以这样写……\n\
    \n```javascript\nresultOfComputation = ((2 * 4) * 4) + 2;\n```\n\n但如果你希望将 2 乘以\
    \ 4 的结果再乘以 4 与 2 的和，可以这样写……\n\n```javascript\nresultOfComputation = (2 * 4) *\
    \ (4 + 2);\n```\n\n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/7.html`](http://www.ASmarterWayToLearn.com/javascript/7.html)\n\
    \n## 连接文本字符串\n\n在第 1 章中，你学会了在警告框中显示消息，代码如下：\n\n```javascript\nalert(\"Thanks for\
    \ your input!\");\n```\n\n或者你也可以这样写：\n\n```javascript\nvar message = \"Thanks\
    \ for your input!\";\nalert(message);\n```\n\n但假设你想让消息个性化。在代码的另一部分，你询问了用户的名字，并将她输入的名字赋值给变量\
    \ `userName`。\n\n现在，你想将她的名字与标准的“感谢”合并，生成一条警告消息，例如“Thanks, Susan!”。\n\n当用户提供名字时，我们将其赋值给变量\
    \ `userName`。代码如下：\n\n```javascript\nalert(\"Thanks, \" + userName + \"!\");\n\
    ```\n\n使用加号运算符，代码将三个元素连接（拼接）成一条消息：字符串 `\"Thanks, \"` 加上变量 `userName` 所代表的字符串，再加上字符串\
    \ `\"!\"`。注意第一个字符串中包含一个空格。如果没有空格，警告框会显示“Thanks,Susan!”。\n\n你可以连接任意组合的字符串和变量，或者全部是字符串或全部是变量。例如，我可以这样重写上一个例子：\n\
    \n```javascript\nvar message = \"Thanks, \";\nvar banger = \"!\";\nalert(message\
    \ + userName + banger);\n```\n\n下面是使用三个字符串的例子：\n\n```javascript\nalert(\"Thanks,\
    \ \" + \"Susan\" + \"!\");\n```\n\n你可以将连接结果赋值给一个变量：\n\n```javascript\nvar message\
    \ = \"Thanks, \";\nvar userName = \"Susan\";\nvar banger = \"!\";\nvar customMess\
    \ = message + userName + banger;\nalert(customMess);\n```\n\n如果你将数字放在引号中，JavaScript\
    \ 会将其作为字符串连接，而不是相加。以下代码……\n\n```javascript\nalert(\"2\" + \"2\");\n```\n\n……会显示消息“22”。如果你混合使用字符串和数字……\n\
    \n```javascript\nalert(\"2 plus 2 equals \" + 2 + 2);\n```\n\n……JavaScript 会自动将数字转换为字符串，并显示消息“2\
    \ plus 2 equals 22”。\n\n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/8.html`](http://www.ASmarterWayToLearn.com/javascript/8.html)\n\
    \n## 提示框\n\n提示框会向用户询问一些信息，并提供一个输入字段供其回答。\n\n以下代码向用户提问“Your species?”，并在输入字段中提供默认答案“human”。用户的回答被赋值给变量。\n\
    \n```javascript\nvar spec = prompt(\"Your species?\", \"human\");\n```\n\n`prompt()`\
    \ 代码与 `alert()` 代码类似，但有两点不同：\n\n* 在提示框中，你需要一种方式来捕获用户的回答。这意味着你需要先声明一个变量，然后加上等号。\n\
    * 在提示框中，你可以指定第二个字符串。这是提示框显示时输入字段中的默认回答。\n\n正如你所料，你可以将字符串赋值给变量，然后在括号内使用变量代替字符串：\n\
    \n```javascript\nvar question = \"Your species?\";\nvar defaultAnswer = \"human\"\
    ;\nvar spec = prompt(question, defaultAnswer);\n```\n\n用户的回答是一个文本字符串。即使回答是数字，它也会以字符串形式返回。例如，考虑以下代码：\n\
    \n```javascript\nvar numberOfCats = prompt(\"How many cats?\");\nvar tooManyCats\
    \ = numberOfCats + 1;\n```\n\n如果用户输入 3，你可能会认为 `tooManyCats` 是 4。但所有对提示框的回答都以字符串形式返回。当字符串\
    \ `\"3\"` 与数字 `1` 通过加号连接时，JavaScript 会将 `1` 转换为字符串并拼接。因此 `tooManyCats` 的值最终是 `\"\
    31\"`。\n\n* 如果用户不输入任何内容并点击“确定”，变量会被赋值为空字符串：`\"\"`。\n* 如果用户点击“取消”，变量会被赋值为特殊值 `null`。\n\
    \n注意：\n* 有些程序员会写 `window.prompt` 而不是简单的 `prompt`。这是一种非常正式但完全正确的写法。\n* 在上面的例子中，有些程序员会使用单引号而不是双引号。只要成对匹配，这是合法的。\n\
    \n> 本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/9.html`](http://www.ASmarterWayToLearn.com/javascript/9.html)\n\
    \n## if 语句\n\n假设你编写了一个提示框，询问“Where does the Pope live?”。如果用户回答正确，你会显示一个祝贺的警告框。\n\
    \n代码如下：\n\n```javascript\nvar x = prompt(\"Where does the Pope live?\");\nif (x\
    \ === \"Vatican\") {\n   alert(\"Correct!\");\n}\n```\n\n如果用户在提示框中输入 `\"Vatican\"\
    `，则会显示祝贺警告框。如果输入其他内容，则什么也不会发生。\n\n### if 语句的分解\n\n`if` 语句总是以 `if` 开头。`if` 与括号之间的空格是风格问题，但常见的风格规则允许这种与\
    \ `alert(\"Hi\");` 不一致的写法。\n\n在 `if` 关键字加空格之后，是正在测试的条件——即被赋予用户回答的变量是否等于 `\"Vatican\"\
    `？条件被括在圆括号内。\n\n如果条件测试为真，就会发生某些事情。在这个例子中，只执行一条语句：显示一个祝贺警告框。\n\n`if` 语句的第一行以左花括号\
    \ `{` 结束。整个 `if` 语句以单独一行的右花括号 `}` 结束。注意，这是对“语句以分号结束”这一规则的例外。\n\n关于三个等号 `===`：单个等号\
    \ `=` 用于给变量赋值。如果你要测试变量的值，不能使用单个等号。\n\n"
- fmt: '

    If you forget this rule and use a single equal sign when you should use the triple
    equal sign, the code won''t run properly.


    As you might expect, you can use a variable instead of a string in the example
    code.


    ```javascript

    1 var correctAnswer = "Vatican";

    2 if (x === correctAnswer) {

    3   alert("Correct!");

    4 }

    ```


    When a condition is met, you can have any number of statements execute.


    ```javascript

    1 var correctAnswer = "Vatican";

    2 if (x === correctAnswer) {

    3   score++;

    4   userIQ = "genius";

    5   alert("Correct!");

    6 }

    ```


    ![](images/00009.jpg)


    * Some coders write simple `if` statements without curly brackets, which is legal.
    Some put the opening curly bracket on its own line. Some put the whole `if` statement,
    if it''s simple, on a single line. I find it easiest not to have to make case-by-case
    decisions, so I format all `if` statements the same way, as shown in the example.
    In the exercises, I''ll ask you to follow these style rules for all `if` statements.

    * In most cases, a double equal sign `==` is just as good as a triple equal sign
    `===`. However, there is a slight technical difference, which you may never need
    to know. Again, to keep things simple, I always use the triple equal sign.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/10.html](http://www.ASmarterWayToLearn.com/javascript/10.html)


    ## Comparison operators


    Let''s talk a little more about `===`. It''s a type of comparison operator, specifically
    an equality operator. As you learned in the last chapter, you use it to compare
    two things to see if they''re equal.


    You can use the equality operator to compare a variable with a string, a variable
    with a number, a variable with a math expression, or a variable with a variable.
    And you can use it to compare various combinations. All of the following are legal
    first lines in `if` statements:


    `if (fullName === "Mark" + " " + "Myers") {`

    `if (fullName === firstName + " " + "Myers") {`

    `if (fullName === firstName + " " + "Myers") {`

    `if (fullName === "firstName + " " + lastName) {`

    `if (totalCost === 81.50 + 135) {`

    `if (totalCost === materialsCost + 135) {`

    `if (totalCost === materialsCost + laborCost) {`

    `if (x + y === a - b) {`


    When you''re comparing strings, the equality operator is case-sensitive. `"Rose"`
    does not equal `"rose"`.


    Another comparison operator, `!==`, is the opposite of `===`. It means is not
    equal to.


    ```javascript

    1 if (yourTicketNumber !== 487208) {

    2   alert("Better luck next time.");

    3 }

    ```


    Like `===`, the not-equal operator can be used to compare numbers, strings, variables,
    math expressions, and combinations.


    Like `===`, string comparisons using the not-equal operator are case-sensitive.
    It''s true that `"Rose" !== "rose"`.


    Here are 4 more comparison operators, usually used to compare numbers:

    * `>` is greater than

    * `<` is less than

    * `>=` is greater than or equal to

    * `<=` is less than or equal to


    In the examples below, all the conditions are true.


    `if (1 > 0) {`

    `if (0 < 1) {`

    `if (1 >= 0) {`

    `if (1 >= 1) {`

    `if (0 <= 1) {`

    `if (1 <= 1) {`


    ![](images/00009.jpg)


    * Just as the double equal sign can usually be used instead of the triple equal
    sign, `!=` can usually be used instead of `!==`. In the exercises, I''ll ask you
    to stick to `!==`.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/11.html](http://www.ASmarterWayToLearn.com/javascript/11.html)


    ## if...else and else if statements


    The `if` statements you''ve coded so far have been all-or-nothing. If the condition
    tested true, something happened. If the condition tested false, nothing happened.


    ```javascript

    1 var x = prompt("Where does the Pope live?");

    2 if (x === "Vatican") {

    3   alert("Correct!");

    4 }

    ```


    Quite often, you want something to happen either way. For example:


    ```javascript

    1 var x = prompt("Where does the Pope live?");

    2 if (x === "Vatican") {

    3   alert("Correct!");

    4 }

    5 if (x !== "Vatican") {

    6   alert("Wrong answer");

    7 }

    ```


    In this example, we have two `if` statements, one testing for `"Vatican"`, and
    another testing for not-`"Vatican"`. So all cases are covered, with one alert
    or another displaying, depending on what the user has entered.


    The code works, but it''s more verbose than necessary. The following code is more
    concise and, as a bonus, more readable.


    ```javascript

    1 if (x === "Vatican") {

    2   alert("Correct!");

    3 }

    4 else {

    5   alert("Wrong answer");

    6 }

    ```


    In the style convention I follow, the `else` part has exactly the same formatting
    as the `if` part. As in the `if` part, any number of statements can execute within
    the `else` part.


    ```javascript

    1 var correctAnswer = "Vatican";

    2 if (x === correctAnswer) {

    3   alert("Correct!");

    4 }

    5 else {

    6   score--;

    7   userIQ = "problematic";

    8   alert("Incorrect");

    9 }

    ```


    `else if` is used if all tests above have failed and you want to test another
    condition.


    ```javascript

    1 var correctAnswer = "Vatican";

    2 if (x === correctAnswer) {

    3   alert("Correct!");

    4 }

    5 else if (x === "Rome") {

    6   alert("Incorrect but close");

    7 }

    8 else {

    9   alert("Incorrect");

    10 }

    ```


    In a series of `if` tests, JavaScript stops testing whenever a condition tests
    true.


    ![](images/00009.jpg)


    * There are so many ways to format `if` statements and their variations that the
    range of possibilities is almost endless. I''m partial to the format I''ve showed
    you, because it''s easy to learn and produces readable code. I''ll ask you to
    stick to this format throughout the exercises.


    > Find the interactive coding exercises for this chapter at:

    > [http://www.ASmarterWayToLearn.com/js/12.html](http://www.ASmarterWayToLearn.com/javascript/12.html)


    ## Testing sets of conditions


    Using the `if` statement, you''ve learned to test for a condition. If the condition
    is met, one or more statements execute. But suppose not one but two conditions
    have to be met in order for a test to succeed.


    For example, if a guy weighs more than 300 pounds, he''s just a great big guy.
    But if he weighs more than 300 pounds and runs 40 yards in under 6 seconds? You''re
    going to invite him to try out for the NLF as a lineman. You can test for a combination
    of conditions in JavaScript by using `&&`.


    Here''s the code.


    ```javascript

    1 if (weight > 300 && time < 6) {

    2   alert("Come to our tryout!");

    3 }

    4 else {

    5   alert("Come to our cookout!");

    6 }

    ```


    You can chain any number of conditions together.


    ```javascript

    1 if (weight > 300 && time < 6 && age > 17 && gender === "male") {

    2   alert("Come to our tryout!");

    3 }

    4 else {

    5   alert("Come to our cookout!");

    6 }

    ```


    You can also test for any of a set of conditions. This is the `||` operator.


    Here''s an example.


    ```javascript

    1 if (SAT > avg || GPA > 2.5 || sport === "football") {

    2   alert("Welcome to Bubba State!");

    3 }

    4 else {

    5   alert("Have you looked into appliance repair?");

    6 }

    ```


