    ## 56


    按标签名定位所有元素


    假设你想让用户选择将文档中所有段落的文本大小加倍。为此，你可以给每个段落一个 id。当用户点击“加倍文本大小”按钮时，一个函数会遍历所有段落 id 并进行更改。该函数可以通过为每个段落分配一个新类（该类指定更大的字体大小）来放大字体，也可以直接分配新的样式属性，如下所示：


    `getElementById(the id).style.fontSize = "2em";`


    实现相同目的的更简单方法是让函数说：“找到文档中的所有段落并增大它们的大小。”


    以下语句找到所有段落并将其赋值给一个变量：


    `var par = document.getElementsByTagName("p");`


    现在，变量 `par` 保存了一个类似数组的集合，包含文档中的所有段落。假设为了简单起见，文档主体只包含三个段落。


    `<p>这张床太小了。</p>`


    `<p>这张床太大了。</p>`


    `<p>这张床刚刚好。</p>`


    `par[0]` 是第一个段落。`par[1]` 是第二个段落。`par[2]` 是第三个段落。`par.length` 是 3，即集合中的项目数。


    如果你写...


    `var textInMiddleParagraph = par[1].innerHTML;`


    ...那么变量 `textInMiddleParagraph` 被赋值为 "这张床太大了。"


    如果你写...


    `par[1].innerHTML = "这辆 SUV 太大了。";`


    ...那么段落文本变为 "这辆 SUV 太大了。"


    以下是一个循环，为所有段落分配字体族。


    ```

    1 for (var i = 0; i < par.length; i++) {

    2   par[i].style.fontFamily = "Verdana, Geneva, sans-serif";

    3 }

    ```


    以下语句创建文档中所有图片的集合，并将其赋值给变量 `pics`。


    `var pics = document.getElementsByTagName("img");`


    以下语句创建文档中所有 div 的集合，并将其赋值给变量 `divs`。


    `var divs = document.getElementsByTagName("div");`


    以下语句创建文档中所有无序列表的集合，并将其赋值给变量 `ulists`。


    `var ulists = document.getElementsByTagName("ul");`


