  \ Listing 9.12 中，你沿 y 轴旋转报纸的第二页 -30 度，使其向摩根靠近。你还让报纸向左稍微移动，并逆时针方向略微旋转，以模拟翻到另一页时报纸向上倾斜的动作。\n\
