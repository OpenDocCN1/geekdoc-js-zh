  \n## 关于作者\n\n**Alexis Goldstein** 在 20 世纪 90 年代中期读高中时自学 `HTML`，随后在哥伦大学获得计算机科学学士学位。Alexis\
  \ 曾与 Louis Lazaris 和 Estelle Weyl 共同合著书籍 *HTML5 & CSS3 for the Real World*。Alexis\
  \ 的职业生涯始于在华尔街科技领域的七年工作，曾在三家主要公司从事现金股票和股票衍生品业务，并学会了热爱每日的代码审查。Alexis 现在经营着一家软件开发和培训公司\
  \ aut faciam LLC。她还在纽约的 Girl Develop It 组织授课，这是一个为女性提供低成本编程课程的团体，并且是布鲁克林 NYC Resistor\
  \ 的成员。在空余时间，你可以发现 Alexis 在纽约市占领华尔街运动的同类小组组织活动。\n\n## 1. 使用 CSS3 动画\n\n`CSS3` 动画引起了巨大的关注和流行，这部分原因是因为\
  \ iPhone 等移动设备不支持传统的 Flash 动画。本章介绍了本书用于处理浏览器兼容性的工具。它回顾了如何使用 `Modernizr` JavaScript\
  \ 库来确保旧版浏览器能收到内容缺失的通知，并引导用户使用更新的浏览器。本章还回顾了其他让开发变得更容易工具和资源。\n\n### CSS3 动画简介\n\n\
  `CSS3` 驱动动画提供的效果通常可以通过其他手段实现，例如基于 `JavaScript` 的动画和 Flash®。那么为什么要使用 `CSS3` 动画呢？\n\
  \n就像许多 `HTML5` 内容一样，`CSS3` 动画和相关规范将通常通过插件或外部库完成的技术引入，并使其成为核心标准的一部分。`CSS3` 还简化了创建动画的过程，使我们能够利用网络标准来创建动态效果，而不是使用像\
  \ Flash® 这样无法在所有设备上运行的插件。\n\n***\n\n> **注意**\n> 当我在本书中使用“CSS3 动画”这一术语时，我指的是过渡效果（将在第\
  \ 3 章中讨论，使用过渡动画元素）和关键帧动画（在第 4 章中讨论，关键帧动画）。\n\n***\n\n本书探索了 `CSS3` 动画的新功能，通过演示核心概念的基础示例解释如何使用它们。本书不仅关注安全、保守或通用性，更挖掘了通过想象力可以实现的可能性。当你通过本书使用\
  \ `CSS3` 动画时，你不需要为了兼容旧版浏览器而屈指就膝。虽然完全可以使用 `jQuery` 或 `MooTools` 等 JavaScript 库重新创建书中构建的每一个动画以实现通用支持，但这并不是一本关于使用\
  \ JavaScript 库动画的书。相反，本书专注于为现代浏览器和移动设备创建动画，并避免了为不支持的旧浏览器重新创建。虽然本书没有在每一个章节都提供详尽的备选代码和解释，但它提供了足够的备选方案，让你拥有所需的知识和实践来根据需要编写自定义备选方案。\n\
  \n本书及后续所有章节的源代码可以在本书的 GitHub 站点找到：[`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)。我还提供了一个演示网站\
  \ alexisgo.github.com/LearningCSSAnimations/，你可以在那里找到所有示例的演示，这样你就可以阅读的过程中跟随代码并查看结果。\n\
  \n### CSS3 动画工具总结\n\nWeb 开发者、设计师和动画师可以使用许多工具让我们的生活变得更容易，并利用网络开发社区的专业知识。这些工具从 HTML5\
  \ Boilerplate 这样的模板，到 `css3please` 和 `Animation Fill Code` 等在线工具，再到像 `-prefix-free`\
  \ 这样的库。\n\n#### HTML5 Boilerplate\n\n\n\n\n\nHTML5 Boilerplate ([`html5boilerplate.com`](http://html5boilerplate.com))，简称“H5BP”，是由\
  \ Paul Irish 和 Divya Manian 发起的一个极佳模板，由包括 Shi Chuan、Mathias Bynens 和 Nicholas Gallagher\
  \ 在内的许多才华贡献者维护。H5BP 让你能够利用网络社区的集体智慧，并快速开始使用 HTML5 开发。你无需通过痛苦的亲身经历来学习那些必不可少的 Internet\
  \ Explorer 指令，或是那些本该已经添加的 CSS 重置样式，H5BP 为你提供了一个已经包含了这些代码的起点。\n\nH5BP 在其基础模板中包含了大量文件，包括一个\
  \ `404.html` 页面和一个默认的图标（favicon）。对于我们而言，H5BP 随带最重要的资源是它的样式表。与其自己重写自定义的重置样式，或者根据需要设置自己的\
  \ `@media` 查询以调整针对移动浏览器的样式，为什么不直接使用由专家小组已经编译好的工具呢？在整本书中，你会看到示例代码包含一个名为 `base.css`\
  \ 的 CSS 文件。该文件基于 H5BP 样式表中的约定，你可以在他们的 GitHub 页面 [`github.com/h5bp/html5-boilerplate`](https://github.com/h5bp/html5-boilerplate)\
  \ 上探索这些内容。\n\n## 生成厂商前缀的工具\n\n编写 CSS3 动画——特别是关键帧动画（将在第 4 章 中介绍）——最大的难题之一，就是生成所有正确的厂商前缀。有两个工具可以帮助你完成：`Prefixr`\
  \ 和 `css3please`。\n\n### Prefixr\n\n我强烈推荐的一个用于协助你生成特定厂商代码的工具是 Jeffrey Way 开发的 `Prefixr`\
  \ ([`prefixr.com`](http://prefixr.com))。该工具允许你仅使用标准语法编写所有的 CSS。当你完成并对页面感到满意时，将代码粘贴到工具中，它就会为你生成所有的厂商前缀。这是一项价值无量的的资源，可以为你节省大量时间，让你能够将编写的基础代码进行扩展，以使其适用于所有浏览器。\n\
  \n### css3please.com\n\n另一个可以协助生成特定厂商代码的工具是 `css3please` ([`css3please.com`](http://css3please.com))。你可以使用这个在线编辑器来指定某个属性，然后它会自动根据你指定的值更新其他厂商前缀。页面上有一个链接可以将生成的代码复制到剪贴板，还有一个简单的元素可以生成你所指定样式的预览。图\
  \ 1.1 显示了使用 `css3please` 为 `border-radius` 属性生成必要代码的示例。\n\n![Image](img/01fig01.jpg)\n\
  \n图 1.1. 使用 css3please 动态生成所有 border-radius 厂商前缀\n\n从最佳实践来看，选择你将使用哪个浏览器进行测试，然后在开发页面时仅针对该特定的厂商前缀进行编码。从一开始就尝试插入所有厂商前缀并不是好主意，因为你避免地需要在测试后更改代码，这意味着需要重新生成所有的厂商前缀。因此，我建议针对一个浏览器进行编码，当代码完成后，使用\
  \ `Prefixr` 或 `css3please` 生成其他厂商前缀，然后在所有浏览器中测试你的代码。\n\n### 动画填充代码\n\n另一个专门针对关键帧动画的工具是\
  \ Louis Lazaris 开发的 `Animation Fill Code` ([`animationfillcode.com`](http://animationfillcode.com))。通过这个在线工具，你可以在一个厂商前缀中编写关键帧规则（在第\
  \ 4 章中会有详细介绍），从一组单选按钮中选择你正在使用的前缀，并粘贴代码。该工具会为你生成其他所需的关键帧规则。你可以在图 1.2 中看到该工具的运行效果。\n\
  \n![Image](img/01fig02.jpg)\n\n图 1.2. 使用 Animation Fill Code 动态生成所有关键帧规则厂商前缀\n\n\
  ### -prefix-free\n\n另一个生成厂商前缀的工具是 Lea Verou 的 JavaScript 库 `-prefix-free`。`-prefix-free`\
  \ 是 JavaScript CSS 处理器，它可以根据访问者所使用的浏览器自动添加所需的厂商前缀。你可以从 [`leaverou.github.com/prefixfree/`](http://leaverou.github.com/prefixfree/)\
  \ 下载该库。你可以在 [`coding.smashingmagazine.com/2011/10/12/prefixfree-break-free-from-css-prefix-hell/`](http://coding.smashingmagazine.com/2011/10/12/prefixfree-break-free-from-css-prefix-hell/)\
  \ 阅读 Verou 描述该库的文章。\n\n## 查看浏览器支持的工具\n\n本书提供了每个所讨论功能的详细支持信息。关于浏览器支持的更多信息，最好的资源是\
  \ [`caniuse.com`](http://caniuse.com)，它允许按功能搜索或浏览并查看不同浏览器和版本的支持矩阵。另一个值得关注的网站是 [`html5please.com`](http://html5please.com)。\n\
  \n### Modernizr 库\n\n如果你用过 HTML5，就一定听说过 `Modernizr` 库 ([`modernizr.com`](http://modernizr.com))。`Modernizr`\
  \ 库允许你按功能测试访问者支持的内容。你可以使用它动态生成的类作为 CSS 钩，也可以查询它创建的全局对象，或者两者并用，并在功能不支持时对你的页面进行自定义处理。\n\
  \nModernizr 还包含一个名为 `html5shiv` 的关键功能，它解决了 Internet Explorer 8 及更早版本的问题。在 Internet\
  \ Explorer 8 及更早版本中，如果你对不识别的元素设置样式（例如某些新的 HTML5 元素，如 `section` 或 `article`），该元素将没有样式。这个问题阻止了许多设计师和开发者使用新的\
  \ HTML5 语义元素。作为回应，网络开发社区很快想出了解决方案。2009 年 1 月，Remy Sharp 创建了 HTML5 脚本，它利用 Sjoerd\
  \ Visscher 最初发现的技术，通过 JavaScript 动态创建未知元素来绕过 IE 的问题。`Modernizr` 在其 `html5shiv` 中利用了相同的技术，以确保不识别新元素的旧浏览器仍然对它们应用样式。\n\
  \n\n\n\n本书的示例代码包含一个生产环境的 Modernizr 副本，它被配置为检查所有这些功能。与其使用此书中附带的 Modernizr 副本，你可以自定义自己的\
  \ Modernizr 构建版本，选择你计划在网站中使用的功能。或者，你也可以下载 Modernizr 的开发版本，它包含了对所有功能的检查，并且由未压缩的 JavaScript\
  \ 代码组成，这样你就可以学习该库及其工作原理。但对于上线网站，你总是希望使用一个只检查你将要使用的功能的生产版本。\n\n## 利用 Modernizr 库\n\
  \n当你使用自定义的 Modernizr 构建版本时，你需要从 HTML 页面的 `head` 元素中引用它，因为 `html5shiv` 能够在 Internet\
  \ Explorer 中启用 HTML5 元素，因此它必须在 `body` 之前执行。HTML5 文档还建议将 Modernizr 脚本放置在样式表引用之后。在\
  \ Listing 1.1 中，我们在 `head` 部分包含了指向 Modernizr 的链接，还包含了指向我们将要使用的两个样式表的链接：`base.css`\
  \ 和 `error.css`（它们将在稍后在 Listing 1.3 中定义）。\n\n### Listing 1.1. 为 Modernizr 运行准备页面\
  \ (warning.html)\n\n点击此处查看代码图片\n\n* * *\n\n```html\n<html class=\"no-js\" lang=\"\
  en\">\n  <head>\n    <link rel=\"stylesheet\" href=\"css/base.css\">\n    <link\
  \ rel=\"stylesheet\" href=\"css/error.css\">\n    <script src=\"js/modernizr.custom.57498.js\"\
  ></script>\n  </head>\n```\n\n* *\n\nModernizr 特别有用，因为它为你提供了多种使用它的方法。你可以通过编写条件 CSS\
  \ 或查询库创建的全局 Modernizr 对象来使用它。本章重点关注如何使用 Modernizr 通过 CSS 创建样式钩子（Styling hooks）。\n\
  \n## 通过 Modernizr 实现 CSS 回退（Fallbacks）\n\nModernizr 运行时第一件事是遍历你要求它检查的所有功能，并通过在起始\
  \ `html` 元素的 `class` 属性中添加条目，记录哪些功能是被支持的，哪些是不支持的。\n\n但在 Modernizr 执行工作之前，你还需要为页面设置最后一项内容。你需要在\
  \ `html` 元素上添加 `no-js` 类：\n\n```html\n<html class=\"no-js\">\n```\n\n当 Modernizr\
  \ 运行时，如果你的浏览器启用了 JavaScript，它将把该类替换为 `\"js\"` 类：\n\n```html\n<html class=\"js\"\
  >\n```\n\n这为你提供了一个反映 JavaScript 是否启用的样式钩子。然后，Modernizr 会为它检测到的*每一个*功能添加类，如果浏览器不支持该功能，则会在类名前加上\
  \ `no-`。对于你在书中使用的 Modernizr 自定义构建，最新版本的 Chrome 会生成以下内容：\n\n```html\n<html class=\"\
  js cssanimations csstransforms csstransforms3d csstransitions\" lang=\"en\">\n```\n\
  \n## 不支持浏览器的默认消息\n\n对于在书中创建的每个动画，你将利用 Modernizr 进行检查，以查看浏览器是否支持运行动画所需的功能。在不支持相应功能的浏览器中，如果你愿意，可以提供一个默认消息来告知访问者问题所在，并提供下载具有相应支持的新浏览器的链接。\n\
  \n此消息将由一个简单的 `div` 元素、一些文本和链接以及最基本的样式组成。默认情况下，此 `div` 的样式为 `display: none`。但如果你为动画所依赖的任何必要功能不存在，选择器将接在默认样式之后更新此\
  \ `div` 以显示，并为其添加额外的样式。\n\nListing 1.2 概述了此回退消息的代码，代码包含在 `warning.html` 文件中。除了包含指向现代浏览器链接的无序列表的回退消息外，列表还包含一个名为\
  \ `#dismiss` 的小 `div`，可用于关闭此消息。在 Listing 1.2 的末尾，你可以找到将 `#dismiss` 元素挂载到点击事件的 JavaScript，并在点击时对\
  \ `#unsupportedBrowser` 元素应用样式 `display: none`。你可以在本书 GitHub 项目的 `ch1code/` 文件夹中找到完整的\
  \ `warning.html` 文件，地址为：[https://github.com/alexisgo/LearningCSSAnimations]。\n\n\
  ### Listing 1.2. 警告消息的 HTML 和 JavaScript (warning.html)\n\n点击此处查看代码图片\n\n* * *\n\
  \n```html\n<body>\n  <div id=\"unsupportedBrowser\">\n    <div id=\"dismiss\">\n\
  \      <span>x</span>\n    </div>\n    <div id=\"warningText\">\n      哦，不！你的浏览器不支持\
  \ CSS3 动画！请下载以下浏览器之一以查看你缺失了什么！\n      <ul>\n        <li><a href=\"http://www.mozilla.org/en-US/firefox/\"\
  >Firefox</a></li>\n        <li><a href=\"http://www.google.com/chrome\">Chrome</a></li>\n\
  \      </ul>\n    </div>\n  </div>\n  <script>\n    document.getElementById('dismiss').onclick\
  \ = function() {\n      document.getElementById('unsupportedBrowser').style.display\
  \ = 'none';\n    };\n  </script>\n</body>\n```\n*(注：由于原文中的 HTML 代码似乎不完整或有乱码，此处根据逻辑补全了基础\
  \ 结构)*\n\n\n\n\n\n当访问者使用旧版浏览器时，确实有更优雅但更耗费精力的方法进行回退——即使用 `jQuery` 库重写你的动画——但本书的目标是关注你利用新技术能做些什么，而不是如何使用旧技术。因此，本书并不会浪费空间去回顾旧技术，而是关注新属性以及如何最有效地使用它们。\n\
  \n在处理 CSS3 动画时，你可以采取的一种方法是回退到一个不进行动画的纯静态对象。这样，动画就变成了现代浏览器的额外奖励。在现实项目中，让动画降级为静态对象或对象组通常是最佳实践。\n\
  \n## 重复的 CSS 属性定义\n\n在书中，你将会用到另一个新的 CSS3 属性 `rgba`，它允许你为颜色添加 Alpha 值（透明度）以实现半透明。虽然\
  \ `Modernizr` 支持检查此属性，但你可以使用简单的方法来兼容不符合的浏览器：使用重复的 CSS 属性定义。\n\n每当你使用新的 `rgba` 属性时，在\
  \ particular 行代码前面加一个简单的 `background-color` 属性。这样，如果浏览器不支持 `rgba`，它将直接忽略该行并应用上一行的\
  \ `background-color` 属性。例如，参见列表 1.4 中的代码。\n\n列表 1.4. 用于兼容旧浏览器的重复 CSS\n\n```\n#someSelector\
  \ {\n  background-color: black;\n  background-color: rgba(0,0,0,0.4);\n}\n```\n\n\
  ## 硬件加速\n\n在书的后面，当你理解了基础知识并开始处理更复杂的动画时，性能问题变得非常重要。为了优化 CSS3 动画的运行方式，你将尽可能使用硬件加速属性。硬件加速是某些设备将工作从\
  \ CPU 卸载到 GPU（图形处理单元，通常简单称为“显卡”）的能力。为了查看硬件加速，你可以利用 Chrome 和 Safari 的某些功能。\n\n在 CSS3\
  \ 中，有几个属性可以利用硬件加速：\n\n- CSS3 过渡（transitions）\n- `translate3d`\n- `translateZ`\n\n\
  第 3 章讨论了 CSS3 过渡，第 6 章 和 第 7 章 探索了 `translate3d` 和 `translateZ`。查看使用这些属性是否生效的最佳方法是为任何硬件加速的层涂上独特的颜色，以便你可以轻松地看到它们。你可以通过设置某些浏览器选项在\
  \ Chrome 和 Safari 中都实现这一点。\n\n### 在 Chrome 中查看硬件加速层\n\n要在 Chrome 中查看硬件加速层，你只需在地址栏中输入\
  \ `about:flags`。这会启动 Chrome 中当前可实验性功能，包括合成渲染层边界。更改设置后，你需要重启 Chrome 以使更改生效。\n\n例如，你可以为任何在\
  \ GPU 上合成的层应用绿色边框。图 1.5 显示了 Chrome 在查看来自 Anthony Calzadilla 令人赞叹的 CSS3 驱动的 Madmanimation\
  \ 动画 ([`animatable.com/demos/madmanimation/`](http://animatable.com/demos/madmanimation/))\
  \ 场景时显示的的结果。\n\n![Image](img/01fig05.jpg)\n\n图 1.5. Chrome 的合成渲染层边界功能在 [`animatable.com/demos/madmanimation/`](http://animatable.com/demos/madmanimation/)\
  \ 上运行\n\n<multimedia/01vid01.m4v>\n\n![01vid01.m4v](img/posterimage02.jpg) \n\n\
  视频 1.1. 在 Chrome 中开启硬件加速层\n\n### 在 Safari 中查看硬件加速层\n\n要在 Mac 上查看硬件加速层，你需要启动终端应用程序（可以在\
  \ 应用程序 > 实用工具 > 终端找到）并输入以下命令：\n\n```bash\n$ CA_COLOR_OPAQUE=1 /Applications/Safari.app/Contents/MacOS/Safari\n\
  ```\n\n所有硬件加速层随后将被涂成红色，如图 1.6 所示。\n\n![Image](img/01fig06.jpg)\n\n图 1.6. Safari\
  \ 的硬件加速层着色在 [`animatable.com/demos/madmanimation/`](http://animatable.com/demos/madmanimation/)\
  \ 上运行\n\n<multimedia/01vid02.m4v>\n\n![01vid02.m4v](img/posterimage02.jpg) \n\n\
  视频 1.2. 启动可查看硬件加速层的视图 Safari\n\n> **注意**\n> 在 Chrome 中更改这些设置时要加小心。建议在检查页面时开启这些设置，完成后恢复到之前的设置。你可能无论也会这样做，因为这种配色方案会让内容变得有些难以阅读！\n\
  \n## 关于使用 CSS3 动画的结语\n\nCSS3 动画像许多其他 HTML5 特性一样，正处于变动中的标准中。例如，W3C 在 2012 年 1 月决定开发一种通用的动画规范，该规范将跨越\
  \ CSS、SVG 和 HTML。但这是否意味着我们不应该朝着现有标准继续前进呢？显然不是。这意味着我们今天学习的内容可以作为未来迭代的基石。本书的核心在于向你展示现在可以实现什么，以及如何有效地为你的访问者创建效果。让我们开始吧。\n\
  \n## 2 使用变换构建基础\n\n 变换是书中许多动画的基础。本章介绍了可以使用 CSS 实现的各种类型变换。作为一个示例项目，你将仅使用 CSS 绘制一辆自行车。###\
  \ 变换简介\n\n通过 CSS3 变换，你可以通过各种变换函数来操作元素，例如改变它们的倾斜、缩放和旋转。你使用 `transform` 属性结合一个或多个定义如何更改元素的函数：\n\
  \n- `rotate`：你使用此函数顺时针或逆时针旋转元素。\n- `scale`：你使用此函数通过缩放宽度、高度或两者来调整元素大小。\n- `skew`：你使用此函数沿特定轴为元素添加偏移。\n\
  - `translate`：你使用此函数沿 x 轴或 y 轴移动元素。\n- `matrix`：你使用此函数一次为元素指定多个变换。\n\n在本章中，你将首先通过操作简单的\
  \ `div` 元素熟悉每个可用变换属性的基础。然后你将使用回顾的概念，仅用 `div` 元素、少量 CSS 和一些变换画出一个自行车。\n\n#### transform\
  \ 的浏览器支持\n\nCSS3 变换在现代浏览器中几乎得到了通用支持。主要的异常是 Internet Explorer 8 及更早版本。（在书中你会反复听到这一点）。以下浏览器支持\
  \ `transform` 和变换函数：\n\n- Android 浏览器 2.1+\n- Chrome 4.0+\n- Firefox 3.5+\n- Internet\
  \ Explorer 9.0+\n- iOS Safari 3.2+ 和 Safari 3.1+\n- Opera 10.5+\n\n此处及书中所有其他浏览器支持列表的来源是极具价值的网站\
  \ [`caniuse.com`](http://caniuse.com)。\n\n#### transform 语法\n\n这是使用变换的基本语法：\n\n\
  ```css\ntransform: <transform-function>\n```\n\n\n\n\n\n如果你想应用多个一个转换函数，可以指定一个由空格分隔的转换函数列表：\n\
  \n```\ntransform: <transform-function1> <transform-function2> <transform-function3>\n\
  ```\n\n与书中使用的许多其他 CSS3 属性一样，你需要在指定实际属性名称之前，使用该属性的特定厂商特定版本列表。为了确保变换在所有支持的浏览器中生效，你可以按照如下方式指定\
  \ transform：\n\n```css\n-webkit-transform: <transform-function>;\n-moz-transform:\
  \ <transform-function>;\n-ms-transform: <transform-function>;\n-o-transform: <transform-function>;\n\
  transform: <transform-function>;\n```\n\n在编写本文时，标准版本（`transform`）已受 Internet Explorer\
  \ 10（Internet Explorer 9 仍需要 `-ms-` 前缀，因此我们仍然需要使用它以确保支持该版本）、Opera 12.5（Opera 12\
  \ 及之前的版本仍需要 `-o-` 前缀）以及 Firefox 16（较早版本的 Firefox 仍需要 `-moz-` 前缀）。Firefox 16 在本文编写期间即将发布，但新的标准语法支持已在\
  \ [`hacks.mozilla.org/2012/07/aurora-16-is-out/`](https://hacks.mozilla.org/2012/07/aurora-16-is-out/)\
  \ 中记录。\n\n***\n\n## 玩转厂商前缀\n\n如果你是 CSS3 的初学者，可能会疑惑为什么 `transform` 属性会在许多不同的变体中重复出现多次。与其他新技术一样，CSS3\
  \ 属性并非没有挑战。CSS3 的主要挑战之一就是使用厂商前缀（vendor prefixes）。这些是你在属性名称之前看到的针对特定浏览器的连字符缩写。以下是你最常看到的几个：\n\
  \n- `-webkit-`：这是任何基于 WebKit 浏览器的前缀。Chrome 和 Safari 都使用这个前缀，因为它们都是使用 WebKit 开源布局渲染引擎构建的。\n\
  - `-moz-`：这是 Firefox 浏览器的缀。\n- `-ms-`：这是 Internet Explorer 浏览的前缀。\n- `-o-`：这是 Opera\
  \ 浏览器的缀。\n\n浏览器厂商引入了自己的前缀，以允许开发者使用尚未进入规范或在规范中仍处于变动中的实验性功能。通过实现新属性的特定版本，浏览器厂商可以*现在*实现新功能，而无需担心语法会发生变化。\n\
  \n除了重复之外，让这变得困难的一点是所需的厂商前缀随属性而异。在某些情况下，你只需要实际的 CSS3 属性名称，不需要任何厂商前缀。在其他情况下，则所有的厂商前缀。而在另一些情况下，某些浏览器需要带前缀的版本，而其他浏览器使用标准属性名称。有很多内容需要记录。\n\
  \n幸运的是，正如第 1 章中“使用 CSS3 动画”部分提到的，有一个网站可以让你避免跟踪这些任何内容：[`css3please.com`](http://css3please.com)。该网站由\
  \ Paul Irish 和 Jonathan Neal 创建，允许你只需编辑他们准备好的示例以匹配你的值，然后点击“复制到剪贴板”。这样你就拥有了任何属性所需的完整列表。你也可以使用\
  \ Jeffrey Way 开发的网站 [`prefixr.com/`](http://prefixr.com/)。另一个值得注意的选择是 Lea Verou\
  \ 的 `-prefix-free` 库，可在 [`leaverou.github.com/prefixfree/`](http://leaverou.github.com/prefixfree/)\
  \ 获取。`-prefix-free` 是客户端 CSS 后处理器，它可以根据访问者正在使用的浏览器自动添加所需的厂商前缀。\n\n***\n\n## 转换函数\n\
  \n在接下来的章节中，我将通过操作简单的 `div` 元素带你熟悉每个可用转换函数的基础。然后，我将让你使用复过的概念，通过 `div` 元素、一些 CSS 属性和一些转换函数来构建一辆自行车。\n\
  \n### 转换函数对周围元素的影响\n\n在进入转换函数的细节之前，重要的是你需要知道，通过 transform 添加的元素变化与通过使用 `margin`、`padding`、`width`\
  \ 或 `height` 等属性添加的变化有何不同。这些属性的变化会导致周围元素也发生移动。增加元素的 `top margin` 会将其之前的元素推向页面靠上的位置。然而，`transform`\
  \ 属性的情况并非如此。\n\nW3C 规范规定“`transform` 属性不会影响变换元素周围的内容流”([`www.w3.org/TR/css3-transforms/#transform-rendering`](http://www.w3.org/TR/css3-transforms/#transform-rendering))。这意味着变换后的元素不会像\
  \ `margin`、`padding` 和其他属性那样导致周围的元素移动。此外，如果变换后的元素恰好溢出了父元素，它也不会导致滚动条出现（即使父元素被设置为\
  \ `overflow: auto`）。如果你将一个元素缩放到其原始高度的两倍，你很可能会与其之前或之后的元素重叠。这一点需要记住，并且在各个函数的章节中会再次提到。\n\
  \n### rotate\n\n`rotate` 函数允许你顺时针或反时针旋转元素。角度可以通过以下几种方式指定：\n\n- **角度 (Degrees)**：可能是最熟悉的方式。一个圆有\
  \ 360 度。(`deg`)\n- **等分度 (Gradians)**：400 个等分度组成一个圆。(`grad`)\n- **弧度 (Radians)**：2π\
  \ 弧度组成一个圆。(`rad`)\n- **圈数 (Turns)**：圆的圈数。一整圈是一个圈。(`turn`)\n\n\n\n\n要将此元素旋转 15 度，并确保它在所有现代浏览器中正常工作，你必须包含\
  \ `transform` 的所有厂商前缀，如列表 2.3 所示。\n\n### 列表 2.3. 将元素旋转 15 度 (box.css)\n\n```css\n\
  /* 接续列表 2.2 */\n#rotate {\n  -webkit-transform: rotate(15deg);\n  -moz-transform:\
  \ rotate(15deg);\n  -ms-transform: rotate(15deg);\n  -o-transform: rotate(15deg);\n\
  \  transform: rotate(15deg);\n}\n```\n\n图 2.2 展示了这种旋转的结果。图 2.2 中的虚线代表了 `.box div`\
  \ 元素的原始位置，以便清晰地显示元素是如何转换的。这个边框与本章涵盖的概念无关，但如果你想探索创建此虚线框的使用的代码，可以在[`alexisgo.github.com/LearningCSSAnimations/ch2code/boxWithBorders.html`](http://alexisgo.github.com/LearningCSSAnimations/ch2code/boxWithBorders.html)\
  \ 进行复习。此虚线框出现在后续所有 `.box div` 元素的图中，用于传达 `.box div` 在转换前的位置。\n\n![Image](img/02fig02.jpg)\n\
  \n图 2.2. 应用了 `transform:rotate(15deg)` 的 div 元素。虚线框代表了转换 之前的 div 原始位置。\n\n注意图 2.2，旋转超出了页面的左边缘。这是因为元素的原始边界框（bounding\
  \ box）没有改变。因此，如果你计划旋转一个元素，你可能想通过 `margin`、定位或其他手段为它留出足够的缓冲区，以免它与周围的元素重叠。\n\n你可能还会注意到旋转是围绕元素中心进行的。这是任何旋转的默认锚点。将锚点想象为旋转的起始位置——它是元素上被固定并在元素旋转时保持不变的位置。你可以通过更改\
  \ `transform-origin` 属性的值来调整该锚点以适应你的需求。\n\n在列表 2.4 中，你添加另一个新的 `div` 元素（`id` 属性设置为\
  \ `rotateFromBottomCorner`）并将其旋转 15 度。但这次你通过更改 `transform-origin` 属性改变了 `div` 元素的锚点。默认的\
  \ `transform-origin` 在元素的中间，即宽度的 50% 和高度的 50%。在列表 2.4 中，你将其改为左下角，即 0% 100%，这样任何旋转都会以元素的左下角为锚点进行。\n\
  \n### 列表 2.4. 旋转前元素的原点 (box.css)\n\n```css\n#rotateFromBottomCorner {\n  -webkit-transform-origin:\
  \ 0% 100%;\n  -moz-transform-origin: 0% 100%;\n  -ms-transform-origin: 0% 100%;\n\
  \  -o-transform-origin: 0% 100%;\n  transform-origin: 0% 100%;\n  -webkit-transform:\
  \ rotate(15deg);\n  -moz-transform: rotate(15deg);\n  -ms-transform: rotate(15deg);\n\
  \  -o-transform: rotate(15deg);\n  transform: rotate(15deg);\n}\n```\n\n你可以在图 2.3\
  \ 中看到应用新锚点后这种旋转的结果。\n\n![Image](img/02fig03.jpg)\n\n图 2.3. 在使用 `transform-origin`\
  \ 将锚点改为左下角后，应用了 `transform:rotate(15deg)` 的 div 元素。\n\n### scale（缩放）\n\n`scale`\
  \ 转换函数允许你增大或缩小元素的视觉尺寸。你可以对元素的宽度高度进行等比例缩放，也可以对每个维度应用不同的缩放。`scale` 的语法如下，其中 `scale\
  \ factor` 是一个数字：\n\n```css\ntransform: scale(<scale factor>);\n```\n\n要将元素缩放大到原始大小的\
  \ 200%，你需要写：\n```css\ntransform: scale(2);\n```\n\n要将元素缩小的到原始大小的 50%，你需要写：\n```css\n\
  transform: scale(0.5);\n```\n\n你也可以使用不同于垂直缩放的因子进行水平缩放。要垂直方向缩小到一半但保持宽度相同，你需要指定两个值并用逗号分隔：\n\
  \n```css\ntransform: scale(1, 0.5);\n```\n\n现在你可以向页面添加另一个一个 `div` 元素。这个 `div` 将具有\
  \ `class` 属性 `box`，其 `id` 属性设置为 `scale`：\n\n```html\n<div class=\"box\" id=\"scale\"\
  >\n```\n\n接下来，你应该编写一个新的 `id` 选择器 `#scale`，在保留 `div` 元素宽度的同时，将其高度设为原始大小的 150%（参见列表\
  \ 2.5）。\n\n### 列表 2.5. 将元素高度缩放大至高度的 150% (box.css)\n\n```css\n#scale {\n  -webkit-transform:\
  \ scale(1, 1.5);\n  -moz-transform: scale(1, 1.5);\n  -ms-transform: scale(1, 1.5);\n\
  \  -o-transform: scale(1, 1.5);\n  transform: scale(1, 1.5);\n}\n```\n\n与 `rotate`\
  \ 一样，`scale` 转换函数不会扩展元素的原始边界框。因此，如你在图 2.4 中看到的，缩放后的框超过了由虚线框表示的原始元素大小。在 `#scale`\
  \ `div` 之前和之后，缩放后的框超出了原始元素的大小。设置健康的 `margin` 可以防止缩放后的 `div` 溢出页面。\n\n![Image](img/02fig04.jpg)\n\
  \n图 2.4. 应用了 `scale(1, 1.5)` 的 div 元素。\n\n### skew（倾斜）\n\n`skew` 转换函数允许你沿 x 轴或 y\
  \ 轴倾斜元素。你可以使用 `rotate` 转换函数中相同的角度来指定 `skew`。在 `skew` 语法中，你可以只在 x 轴上指定 `skew`：\n\n\
  ```css\ntransform: skewX(15deg);\n```\n\n你可以在 y 轴上指定 `skew`：\n\n```css\ntransform:\
  \ skewY(25deg);\n```\n\n或者你可以通过同时对两个轴进行倾斜，先指定 x 轴倾斜角度再指定 y 轴倾斜角度，用逗号隔开：\n\n```css\n\
  transform: skew(15deg, 25deg);\n```\n\n现在你可以向页面添加另一个 `div` 元素。其 `class` 属性设置为 `box`，其\
  \ `id` 属性设置为 `skew`：\n\n```html\n<div class=\"box\" id=\"skew\">\n```\n\n接下来，如列表\
  \ 2.6 所示，你编写一个新的 `id` 选择器 `#skew`，并将 `div` 沿 x 轴倾斜 50 度。\n\n### 列表 2.6. 倾斜元素 (box.css)\n\
  \n```css\n#skew {\n  -webkit-transform: skewX(50deg);\n  -moz-transform: skewX(50deg);\n\
  \  -ms-transform: skewX(50deg);\n  -o-transform: skewX(50deg);\n  transform: skewX(50deg);\n\
  }\n```\n\n你可以在图 2.5 中看到 `skew` 的结果。与所有其他转换函数一样，`skew` 不会扩展原始边界框。因此，`skew` 转换导致元素超出了页面边缘。\n\
  \n![Image](img/02fig05.jpg)\n\n图 2.5. 应用了 `skewX(50deg)` 的 div 元素。\n\n为了更清楚地观察 `skew`\
  \ 并练习将两个转换函数组合到单个转换中，你可以在应用 `skew` 后，还可以将 `div` 的尺寸缩小到原始大小的 50%。在列表 2.7 中，你创建了一个新的\
  \ `id` 选择器 `#skewAndScale` 来实现此操作。结果显示在图 2.6 中。\n\n### 列表 2.7. 倾斜元素 (box.css)\n\n\
  点击此处查看代码图像\n\n```css\n#skewAndScale {\n  -webkit-transform: skewX(50deg) scale(0.5);\n\
  \  -moz-transform: skewX(50deg) scale(0.5);\n  -ms-transform: skewX(50deg) scale(0.5);\n\
  \  -o-transform: skewX(50deg) scale(0.5);\n}\n```\n\n\n\n```css\ntransform: skewX(50deg)\
  \ scale(0.5);\n}\n```\n\n* *\n\n![Image](img/02fig06.jpg)\n\n图 2.6. 应用了 skewX(50deg)\
  \ 和 scale(2.0) 的 div 元素\n\n### translate\n\n`translate` 变换函数允许你在页面上移动元素。你可以使用四种不同的移动类型：`translateX`、`translateY`、`translateZ`\
  \ 和 `translate3d`。第 6 章“使用 3D 变换增加深度”和第 7 章“为 2D 和 3D 变换动画”讨论了 `translateZ` 和 `translate3d`。\n\
  \n`translateX` 变换函数允许你沿 x 轴左右移动元素。`translateY` 允许你沿 y 轴向上或向下移动元素。要仅在 x 轴上指定 100\
  \ 像素的位移，你可以这样写：\n\n```css\ntransform: translateX(100px);\n```\n\n要仅在 y 轴上指定 250\
  \ 像素的位移，你可以这样写：\n\n```css\ntransform: translateY(250px);\n```\n\n或者你可以通过 `translate`\
  \ 同时指定两个轴的位移，先指定 x 轴位移，后指定 y 轴位移，两个值之间用逗号分隔：\n\n```css\ntransform: translate(100px,\
  \ 250px);\n```\n\n为了演示 `translateX`，你可以在页面上添加另一个 `div`，将其 `class` 属性设置为 `box`，`id`\
  \ 属性设置为 `translate`：\n\n```html\n<div class=\"box\" id=\"translate\">\n```\n\n在列表\
  \ 2.8 中，你定义了一个新的 id 选择器 `#translate`，并定义了沿 x 轴的 400 像素位移。这将有效地将元素向其原始位置右侧 400 像素。你可以在图\
  \ 2.7 中看到此 `translate` 的效果。\n\n![Image](img/02fig07.jpg)\n\n图 2.7. 应用了 translateX(400px)\
  \ 的 div 元素\n\n如前所述，变换不会影响周围元素，`translate` 变换函数也不例外。与相对定位一样，通过 `transform` 属性应用位移不会影响文档流。对于周围元素来说，仿佛被位移的元素仍然位于其原始边界框内。因此，你必须记住，当使用位移时，如果不注意，可能会与周围元素重叠。\n\
  \n列表 2.8. 使用 translateX 横跨移动元素 (box.css)\n\n* *\n\n```css\n#translate {\n  -webkit-transform:\
  \ translateX(400px);\n  -moz-transform: translateX(400px);\n  -ms-transform: translateX(400px);\n\
  \  -o-transform: translateX(400px);\n  transform: translateX(400px);\n}\n```\n\n\
  * *\n\n### 为旧浏览器添加回退消息\n\n在不支持新的 CSS3 变换的浏览器中，变换将被忽略，因此所有元素看起来将完全相同。为了警告用户他们的旧版浏览器（即\
  \ Internet Explorer 8 及更高版本）不支持 CSS3 变换，你可以添加一个回退消息。\n\n在列表 2.9 中，你添加了一个新的 `div`\
  \ 元素，其 `id` 属性设置为 `unsupported`，并在 `h1` 元素中包含一条消息。列表 2.9 中的加粗行代表你添加到 box.html 文件现有代码中的新代码。\n\
  \n列表 2.9. 为不支持的浏览器添加警告消息 (box.html)\n\n点击此处查看代码图像\n\n* *\n\n```html\n<div id=\"\
  unsupported\">\n  <h1>您的浏览器不支持\n  CSS3 变换。您将无法看到应用于下方元素的\n  整洁变换！\n  </<h1>>\n</div>\n\
  <div class=\"box\">\n  <h1>hello.</h1>\n</div>\n```\n\n* *\n\n你现在通过赋予样式 `display:\
  \ none` 使得 `#unsupported div` 元素默认隐藏。你可以利用 Modernizr（你可能记得在列表 2.1 中包含在 box.html\
  \ 文件中）来查看访问者的浏览器是否支持 CSS3 变换。\n\n如果支持 CSS3 变换，起始 `html` 元素的 `class` 属性将设置为 `csstransforms`。在列表\
  \ 2.10 中，你...\n\n\n\n\n我将首先引导你创建基础骨架，然后是轮子，最后逐个创建框架的各个。在列表 2.11 中，你将从框架所有组件的基本轮廓开始。\n\
  \n列表 2.11. 基础自行车框架 (bike.html)\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <link rel=\"stylesheet\"\
  \ href=\"css/bikestyles.css\">\n  </head>\n  <body>\n    <div id=\"bike\">\n   \
  \   <div id=\"frametop\"></div>\n      <div id=\"framechainstay\"></div>\n     \
  \ <div id=\"framefork\"></div>\n      <div id=\"frameseattube\"></div>\n      <div\
  \ id=\"frameseatstay\"></div>\n      <div id=\"framedowntube\"></div>\n      <div\
  \ id=\"seat\"></div>\n      <div class=\"handlebars\"></div>\n      <div id=\"backwheel\"\
  ></div>\n      <div id=\"frontwheel\"></div>\n    </div>\n  </body>\n</html>\n```\n\
  \n在列表 2.12 中，你将通过为这个基础骨架提供的元素设置样式来开始绘制自行车，这将结合基础 CSS 属性和本章之前讨论过的某些 CSS3 变换。\n\n\
  首先，你需要为容器 `div id=\"bike\"` 元素设置一些基础样式。你将给它一个特定的尺寸，并将 `position` 设置为 `relative`，这样你就可以相对于这个外部容器\
  \ `div` 对内部的 `div` 元素进行绝对定位。\n\n列表 2.12. 为容器 bike div 设置样式 (bikestyles.css)\n\n\
  ```css\n#bike {\n  width: 400px;\n  height: 250px;\n  position: relative;\n  margin:\
  \ 20px 0;\n}\n```\n\n### 使用 border-radius 创建自行车轮\n\n接下来，你可以为构成前后轮轮的两个 `div` 元素设置样式。这些样式在列表\
  \ 2.13 中列出。首先，你将两个轮都变为 125x125 像素的正方形。你将为它们都加上黑色边框以模拟轮子。你对它们进行绝对定位，将每个 `top` 值设置为\
  \ 68 像素。这将轮子距离 `div id=\"bike\"` 容器 `div` 的顶部 68 像素。你稍会在列表 2.14 中设置各个的 `left` 值。最后，你将通过将\
  \ `border-radius` 设置为轮宽的一半来使两个轮变为圆形。这样做的方法是先使用绝对像素值，然后使用 50% 的值。你必须这样做，是因为在某些版本的移动\
  \ Safari 中，50% 值不被识别。\n\n列表 2.13. 为自行车轮设置样式 (bikestyles.css)\n\n点击此处查看代码图像\n\n```css\n\
  #backwheel, #frontwheel {\n  width: 120px;\n  height: 120px;\n  border: 8px solid\
  \ black;\n  position: absolute;\n  top: 68px;\n  /* 使用 border-radius: 50% 在某些\n\
  \     移动 Safari 版本中不起作用，因此我们先使用\n     绝对像素值，如果 50% 不被理解，将使用这些\n     绝对值。 */\n  -webkit-border-radius:\
  \ 70px;\n  -moz-border-radius: 70px;\n  border-radius: 70px;\n  -webkit-border-radius:\
  \ 50%;\n  -moz-border-radius: 50%;\n  border-radius: 50%;\n}\n```\n\n为了完成轮子，你通过为每个轮单独设置\
  \ `left` 属性将它们分别放置在不同的位置，如列表 2.14 所示。\n\n列表 2.14. 放置自行车轮 (bikestyles.css)\n\n```css\n\
  #backwheel {\n  left: 35px;\n}\n#frontwheel {\n  left: 278px;\n}\n```\n\n### 绘制辐条\n\
  \n除了设置 `border-radius` 之外，我还没有在 CSS 中做过任何有趣的事情。但在列表 2.15 中，你将为每个轮添加轮毂和一些辐条，并练习 `transform:\
  \ rotate` 来这样做。每根辐条将是一个非常小很细的 `div`。你每个轮只使用五根辐条。一旦应用了更改，你将拥有两个带有中心毂且每个中心周围五根辐条的轮，如图图\
  \ 2.1 所示。注意，列表 2.15 中加粗的行是你将添加到 HTML 元素内部的新行。\n\n![Image](img/02fig11.jpg)\n图 2.1\
  \ 使用 CSS 创建的轮\n\n列表 2.15. 轮的辐条 (bike.html)\n\n```html\n/* 接续列表 11 */\n<div id=\"\
  backwheel\">\n  <div class=\"center\"></div>\n  <div class=\"spoke\"></div>\n  <div\
  \ class=\"spoke\"></div>\n  <div class=\"spoke\"></div>\n  <div class=\"spoke\"\
  ></div>\n  <div class=\"spoke\"></div>\n</div>\n<div id=\"frontwheel\">\n  <div\
  \ class=\"center\"></div>\n  <div class=\"spoke\"></div>\n  <div class=\"spoke\"\
  ></div>\n  <div class=\"spoke\"></div>\n  <div class=\"spoke\"></div>\n  <div class=\"\
  spoke\"></div>\n</div>\n```\n\n现在你准备好使用列表 2.16 中的 CSS 为每个轮设置轮毂了。通过给它们设置 5 像素的 `border-radius`\
  \ 使这两个 `div` 元素变为圆形。接下来，你将它们放置在中心。（记住，这些 `div` 的中心在 60 像素处，由于宽度为 10 像素，你需要偏移 5 像素。）\n\
  \n列表 2.16. 为轮毂设置样式和定位 (bikestyles.css)\n\n```css\n.center {\n  position: absolute;\n\
  \  top: 56px;\n  left: 58px;\n  width: 10px;\n  height: 10px;\n  border-radius:\
  \ 5px;\n  background-color: black;\n}\n```\n\n### 使用 transform-origin 锚辐条\n\n在旋转辐条\
  \ `div` 元素之前，你需要为它们设置一些共同的样式（参见列表 2.17）。辐条将具有相同的尺寸、颜色和位置。它们还将共享一个与默认锚点不同的锚点。这将允许你绕\
  \ `div` 的右侧旋转，而不是默认的（`div` 中心）。将 `transform-origin` 设置为 100% 50% 将使锚点位于 `div` 水平方向的最右侧，但在垂直方向的中间。变换原点通过图\
  \ 2.12 中的小正方形可视化。左侧的轮显示了在单独旋转之前的所有辐条（你将在列表 2.18 中进行），右侧的轮显示了旋转后的样子。\n\n列表 2.17.\
  \ 绘制和定位轮轮毂 (bikestyles.css)\n\n```css\ndiv[class*=\"spoke\"] {\n  height: 1px;\n\
  \  width: 62px;\n  background-color: black;\n  position: absolute;\n  top: 60px;\n\
  \  -webkit-transform-origin: 100% 50%;\n  -moz-transform-origin: 100% 50%;\n  -ms-transform-origin:\
  \ 100% 50%;\n  -o-transform-origin: 100% 50%;\n  transform-origin: 100% 50%;\n}\n\
  ```\n\n![Image](img/02fig12.jpg)\n图 2.12. 每个辐条的 transform-origin 都被设置为 100% 50%，这由浅色正方形所示\n\
  \n\n\n\n\n现在你已经定义了通用样式，最后一步是按 72 度的增量旋转每根辐条（因为你有五根辐条，360 度 / 5 = 72 度）。由于第一根辐条的旋转为\
  \ 0 度，所以你不需要对其设置样式。因此，你从 `spoke2` 开始到 `spoke5`。为了简洁起见，Listing 2.18 在 `.spoke2` 样式中包含了所有必要的厂商前缀，并仅在\
  \ `.spoke3`、`.spoke4` 和 `.spoke5` 的样式中定义了 `-webkit-` 厂商前缀。你可以在 `bikestyles.css`\
  \ 文件中找到完整的样式（带有厂商前缀），该文件位于书籍 GitHub 项目的 `ch2code/css/` 文件夹中（[`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)）。\n\
  \n代码列表 2.18. 绘制和定位轮毂 (bikestyles.css)\n\n点击此处查看代码图像\n\n```css\n.spoke2 {\n  -webkit-transform:\
  \ rotate(72deg);\n  -moz-transform: rotate(72deg);\n  -ms-transform: rotate(72deg);\n\
  \  -o-transform: rotate(72deg);\n  transform: rotate(72deg);\n}\n\n.spoke3 { -webkit-transform:\
  \ rotate(144deg); }\n.spoke4 { -webkit-transform: rotate(216deg); }\n.spoke5 { -webkit-transform:\
  \ rotate(288deg); }\n```\n\n### 绘制车架\n\n现在你需要为自行车车架设置样式并将每个部分放置在正确的位置。你可以从车架每个部分的共同属性开始：`height`、`background-color`\
  \ 和 `border-radius`。你将将车架的每个部分设置为绝对定位，并将 `z-index` 设置为 2，以确保车架位于轮毂和辐条之上。与辐条一样，你可以使用子字符串匹配属性选择器一次性针对所有的车架\
  \ `div` 元素，这次查找任何 `id` 属性包含 `\"frame\"` 字符串的 `div` 元素。Listing 2.19 概述了所有这些添加。\n\n\
  代码列表 2.19. 设置车架的默认样式 (bikestyles.css)\n\n```css\n#bike div[id*=\"frame\"] {\n  height:\
  \ 10px;\n  background-color: red;\n  position: absolute;\n  z-index: 2;\n  -webkit-border-radius:\
  \ 5px;\n  -moz-border-radius: 5px;\n  border-radius: 5px;\n}\n\n#frametop {\n  width:\
  \ 163px;\n  top: 20px;\n  left: 158px;\n}\n\n#framechainstay {\n  top: 131px;\n\
  \  left: 104px;\n  width: 85px;\n}\n```\n\n接下来，在 Listing 2.20 中，你定位车架中完全不需要旋转的两个部分：车架顶部和后叉。\n\
  \n代码列表 2.20. 为车架顶部和后叉设置样式 (bikestyles.css)\n\n```css\n#frametop {\n  width: 163px;\n\
  \  top: 20px;\n  left: 158px;\n}\n\n#framechainstay {\n  top: 131px;\n  left: 104px;\n\
  \  width: 85px;\n}\n```\n\n### 使用 transform: rotate 旋转车架叉和座管\n\n在 Listing 2.21 中，你创建了前叉和座管，它们彼此平行的，因此需要相同的旋转角度。你可以将大多数样式组合在一个分组选择器中，因为它们共享相同的旋转角度，然后在座管的选择器中根据需要进行覆盖。\n\
  \n代码列表 2.21. 为前叉和座管设置样式 (bikestyles.css)\n\n```css\n#framefork, #frameseattube {\n\
  \  top: 75px;\n  left: 270px;\n  width: 123px;\n  -webkit-transform: rotate(75deg);\n\
  \  -moz-transform: rotate(75deg);\n  -ms-transform: rotate(75deg);\n  -o-transform:\
  \ rotate(75deg);\n  transform: rotate(75deg);\n}\n\n#frameseattube {\n  left: 112px;\n\
  }\n```\n\n正如你在 Figure 2.13 中看到的，自行车正开始逐渐成形。\n\n![图像](img/02fig13.jpg)\n图 2.13. 车架顶部、后叉和座管\n\
  \n### 利用 Web 工具栏确定旋转角度\n\n创建自行车时一个棘手的部分是确定自行车任何部分的正确旋转角度。确定元素正确位置和所需转换的简单方法是使用开发者工具（例如\
  \ Firebug 或 Chrome/Safari 中的 Web Developer 工具栏）。你可以利用此类工具的 CSS 编辑功能来微调值，直到它们正确。例如，你可以通过开发者工具栏不断试错确定\
  \ 75 度是前叉和座管的正确旋转角度，如图 Figure 2.14\n图 2.14. 通过 Web 工具栏试错确定正确的旋转角度\n\n### 完成车架\n\n\
  车架的最后部分是后叉（将座椅连接到后轮毂）和立管。这些每个部分都有不同的旋转角度和宽度，因此你需要单独为它们设置样式，如 Listing 2.22\n\n```css\n\
  #framesestay {\n  top: 78px;\n  left: 66px;\n  height: 6px;\n  width: 130px;\n \
  \ -webkit-transform: rotate(-65deg);\n  -moz-transform: rotate(-65deg);\n  -ms-transform:\
  \ rotate(-65deg);\n  -o-transform: rotate(-65deg);\n  transform: rotate(-65deg);\n\
  }\n\n#framedowntube {\n  top: 78px;\n  left: 165px;\n  width: 170px;\n  -webkit-transform:\
  \ rotate(-40deg);\n  -moz-transform: rotate(-40deg);\n  -ms-transform: rotate(-40deg);\n\
  \  -o-transform: rotate(-40deg);\n  transform: rotate(-40deg);\n}\n```\n\n### 使用座椅和手柄完成自行车\n\
  \n为了给自行车收尾工作，你需要添加座椅和手柄。为了达到所需效果，你会在容器 `div` 中包装两个转换，如 Listing 2.23\n\n```html\n\
  <!-- 延续 Listing 15 -->\n<div id=\"framedowntube\">\n  <div id=\"base\"></div>\n\
  \  <div id=\"nose\"></div>\n</div>\n<div id=\"seat\">\n  <div id=\"top\"></div>\n\
  \  <div id=\"bottom\"></div>\n</div>\n<div class=\"handlebars\">\n  <div id=\"post\"\
  ></div>\n  <div id=\"bar\"></div>\n  <div id=\"handle\"></div>\n</div>\n```\n\n\
  ### 为自行车手柄设置样式\n\n设置手柄时，将使用定位来确定容器 `div` 的正确位置。内部有一个小立柱、一个作为手柄的旋转 `div` 以及一个代表橡胶手柄的\
  \ `div`。\n\n在 Listing 2.24 中，你首先为容器 `.handlebars` 设置位置。接下来，你为 `#post` 定义位置、颜色和大小。然后你定义\
  \ bar 和 handle 共享的样式，包括它们的基本大小、`position`、`border-radius` 和旋转。与本章之前的示例一样，在旋转之前，你会更改\
  \ `transform-origin`。在这种情况下，你更改它以便围绕此 `div` 的中心左边缘旋转。\n\n代码列表 2.24. 手柄样式设置 (bikestyles.css)\n\
  \n```css\n.handlebars {\n  position: relative;\n  left: 310px;\n}\n\n#post {\n \
  \ background-color: silver;\n  height: 10px;\n  width: 10px;\n  position: absolute;\n\
  \  top: 10px;\n}\n\n#bar, #handle {\n  position: absolute;\n  top: 5px;\n  width:\
  \ 50px;\n  height: 10px;\n  background-color: silver;\n  -webkit-border-radius:\
  \ 20px;\n  -moz-border-radius: 20px;\n  border-radius: 20px;\n  -webkit-transform-origin:\
  \ 0% 50%;\n  -moz-transform-origin: 0% 50%;\n}\n```\n\n\n\n\n```css\n  -o-transform-origin:\
  \ 0% 50%;\n  transform-origin: 0% 50%;\n  -webkit-transform: rotate(-20deg);\n \
  \ -moz-transform: rotate(-20deg);\n  -ms-transform: rotate(-20deg);\n  -o-transform:\
  \ rotate(-20deg);\n  transform: rotate(-20deg);\n}\n```\n\n最后，你可以为横条添加一个手柄。为了做到这一点，你需要将手柄旋转与条形相同的角度，但你需要添加第二个变换函数\
  \ `translateX`，以便将手柄推到条形的末端。你可以简单地用空格分隔，将两个变换函数合并为一个单个 `transform` 函数，如列表 2.25 所示。图\
  \ 2.15 显示了仅对手柄应用旋转时的样式，而图 2.16 显示了将旋转与 `translateX` 结合后的效果。\n\n列表 2.25. 手柄样式化 (bikestyles.css)\n\
  \n点击此处查看代码图片\n\n```css\n#handle {\n  background-color: black;\n  width: 25px;\n\
  \  height: 12px;\n  -webkit-transform: rotate(-20deg) translateX(25px);\n  -moz-transform:\
  \ rotate(-20deg) translateX(25px);\n  -ms-transform: rotate(-20deg) translateX(25px);\n\
  \  -o-transform: rotate(-20deg) translateX(25px);\n  transform: rotate(-20deg) translateX(25px);\n\
  }\n```\n\n![Image](img/02fig15.jpg)\n图 2.15. 仅使用 rotate 变换的手柄\n\n![Image](img/02fig16.jpg)\n\
  图 2.16. 通过结合使用 rotate 和 translateX 正确定位的手柄\n\n### 为自行车座垫样式化\n\n最后，你可以为自行车添加一个座椅。与车把一样，你可以通过样式化多个内部\
  \ `div` 来实现你想要的效果。内部 `div` `#base` 是一个较大的黑色圆形，而头部是一个带有单个圆角的黑色矩形，用来模拟自行车座头的形状。图 2.17\
  \ 显示了成品。列表 2.26 提供了代码。\n\n列表 2.26. 座垫样式化 (bikestyles.css)\n\n```css\n#seat {\n \
  \ background-color: black;\n  position: absolute;\n  left: 135px;\n  z-index: 3;\n\
  \  -webkit-border-radius: 20px;\n  -moz-border-radius: 20px;\n  border-radius: 20px;\n\
  }\n\n#base {\n  width: 30px;\n  height: 25px;\n}\n\n#nose {\n  background-color:\
  \ black;\n  width: 40px;\n  height: 15px;\n  position: absolute;\n  top: 0;\n  left:\
  \ 20px;\n  -webkit-border-right-radius: 15px;\n  -moz-bottom-right-radius: 15px;\n\
  \  border-bottom-right-radius: 15px;\n}\n```\n\n![Image](img/02fig17.jpg)\n图 2.17.\
  \ CSS 创建的成品\n\n### 为旧浏览器添加回退消息\n\n不支持 CSS3 变换的浏览器会直接忽略这些变换。由于你刚刚创建的自行车很大程度上取决于这些变换，在不支持它们的浏览器中，你的\
  \ CSS/HTML 构建的自行车看起来非常扭曲。为了避免这种情况，你可以对代码进行一些微调，在不支持 CSS3 变换的浏览器中隐藏自行车 `div`。相反，你可以显示一个包含完成自行车截图的\
  \ `img` 元素，并带上解释用户错过了什么内容的消息。\n\n正如你在列表 2.9 和 2.10 中所做的那样，这里你将利用 Modernizr 并为旧浏览器编写\
  \ CSS 选择器。在列表 2.27 中，你将利用 Modernizr 并为旧浏览器编写 CSS 选择器。\n\n\n\n\n\nCSS3 过渡在现代浏览器中拥有非常良好的支持，Internet\
  \ Explorer 9 除外。Internet Explorer 从 10 版本开始支持 CSS3 过渡。以下浏览器目前支持过渡效果：\n\n• Android\
  \ Browser 2.1+\n• Chrome 4.0+\n• Firefox 4.0+\n• Internet Explorer 10.0+\n• iOS\
  \ Safari 3.2+ 和 Safari 3.1+\n• Opera 10.5+\n\n### 创建简单的过渡\n\n要创建一个简单的过渡，你需要定义两个内容：当该属性的值发生变化时，要对哪些属性进行过渡，以及过渡应该持续多长时间。你通过\
  \ `transition-property` 属性定义前者，通过 `transition-duration` 属性定义后者。\n\n例如，假设你想对 `background-color`\
  \ 属性属性的任何变化进行过渡，并且你希望这些变化在 1 秒内完成。为了实现这一切，你编写了以下代码：\n\n```css\ntransition-property:\
  \ background-color\ntransition-duration: 1s;\n```\n\n在本文编写时，Internet Explorer 10、Opera\
  \ 12.5 和 Firefox 16 均支持标准属性（`transition-property` 或 `transition-duration`）。所有其他浏览器（以及支持标准语法的浏览器早期版本）仍然需要适当的前缀值。因此，为了确保支持支持过渡的浏览器，除了标准语法外，你包含\
  \ `-webkit-`、`-moz-` 和 `-o-` 厂商前缀，如 列表 3.1 所示。\n\n### 注意\n\n我没有对过渡使用 `-ms-` 前缀，因为\
  \ Internet Explorer 10 是第一个支持过渡的 Internet Explorer 版本。然而，本书仍将对变换（transforms）使用 `-ms-`\
  \ 前缀。这是因为与过渡不同，对变换的支持是从 Internet Explorer 9 开始的。因此，为了确保在 Internet Explorer 9 和 10\
  \ 中都支持变换，我们需要同时使用带前缀的版本和标准版本。\n\n### 列表 3.1. 针对 background-color 值变化时定义过渡\n\n```css\n\
  -webkit-transition-property: background-color;\n-moz-transition-property: background-color;\n\
  -o-transition-property: background-color;\ntransition-property: background-color;\n\
  -webkit-transition-duration: 1s;\n-moz-transition-duration: 1s;\n-o-transition-duration:\
  \ 1s;\ntransition-duration: 1s;\n```\n\n## 过渡简写属性\n\n与其在两行中分别指定 `transition-property`\
  \ 和 `transition-duration`，你可以通过使用 `transition` 简写属性将它们合并为一行。简写可以为你节省大量的打字工作，尤其是当你包含了所有相关的厂商前缀时。这是完整的简写语法：\n\
  \n点击此处查看代码图像\n\n```css\ntransition: <transition-property> <transition-duration>\n\
  <transition-timing-function> <transition-delay>;\n```\n\n我还没有描述 `transition-timing-function`\
  \ 和 `transition-delay` 属性（我会在本章稍后部分描述它们），但这两个属性都有默认值。因此，要使用 `transition` 简写配合之前在\
  \ 1 秒内动画 background-color 变化的示例，你可以这样写：\n\n```css\ntransition: background-color\
  \ 1s;\n```\n\n要使用带有所有厂商前缀的简写，你这样写：\n\n```css\n-webkit-transition: background-color\
  \ 2s;\n-moz-transition: background-color 2s;\n-o-transition: background-color 2s;\n\
  transition: background-color 2s;\n```\n\n## 使用悬停事件触发过渡动画\n\n`transition-property`\
  \ 和 `transition-duration` 属性仅定义了当该属性值变化时对哪个属性进行过渡，以及过渡应该持续多长时间。要实际触发过渡，你必须更改设置为\
  \ `transition-property` 的属性值，在本示例中是 `background-color`。实现此点的一种方法是在发生悬停操作时触发变化。\n\
  \n### 背景颜色变化的过渡\n\n考虑一个只有一个单个 `div` 元素的网页，颜色为紫色，其 `id` 属性设置为 `animateMe`。由于你将对此\
  \ `div` 的变化进行动画处理，因此你在这里设置过渡，以及所有适当的厂商前缀。\n\n假设你想在用户悬停在 `div` 上时将 `background-color`\
  \ 从紫色变为蓝色。列表 3.2 提供了此操作完整代码，图 3.1 显示了过渡的三个阶段。\n\n![Image](img/03fig01.jpg)\n\n图\
  \ 3.1. 过渡开始时、中间和结束时的背景颜色\n\n```\n<multimedia/03vid01.m4v>\n```\n\n![03vid01.m4v](img/posterimage02.jpg)\
  \ \n\n视频 3.1. 背景颜色变化的过渡\n\n列表 3.2. 悬停时的背景颜色动画 (colorchange.html)\n\n```css\n#animateMe\
  \ {\n  width: 100px;\n  height: 100px;\n  background-color: rgb(128, 0, 128);\n\
  \  -webkit-transition: background-color;\n  -moz-transition: background-color;\n\
  \  -o-transition: background-color;\n  transition: background-color;\n}\n#animateMe:hover\
  \ {\n  background-color: rgb(0, 0, 255);\n}\n```\n\n### 注意\n\n你可能奇怪为什么你将过渡设置在 `animateMe`\
  \ 而不是 `animateMe:hover` 伪类。如果你将过渡设置在 `:hover` 伪类中，动画只会在悬停时发生。\n\n### 注意\n\n当两个颜色之间进行过渡时，如何确定中间点？换句话说，浏览器如何知道中间颜色？通过插值，当你提供两个点时，浏览器会在\
  \ 2 秒的动画时间内计算出所有的中间颜色。\n\n### 悬停时值的过渡\n\n在第 2 章中你学习了 `transform` 属性。现在你可以将变换与过渡结合，对\
  \ `transform` 属性的值进行动画处理。为了演示，让我们回到第 2 章中简单的蓝色 `div`。\n\n首先，你设置 `transition` 属性对\
  \ `#box div` 的任何变化进行动画处理（参见列表 3.3）。在 `transition` 简写中定义的第一个属性是 `transition-property`。由于你想对\
  \ `transform` 属性的值进行动画处理，你将 `transition-property` 设置为 `transform`。注意每个厂商前缀的过渡都与相同的厂商前缀\
  \ `transform` 属性配对。\n\n接下来，你定义伪类 `#box:hover`。这设置了将框向页面右侧的 `translateX`。当用户悬停在 `#box`\
  \ 元素上时，框向右移动 400 像素。当用户悬停离开（即离开原始边界框——即元素开始的位置）时，`#box` 元素回到原始位置。\n\n列表 3.3. 使用\
  \ translateX 在悬停时向右移动框 (box.html)\n\n```css\n#box {\n  width: 150px;\n  height:\
  \ 150px;\n  background-color: blue;\n  color:white;\n  -webkit-transition: -webkit-transform\
  \ 2s;\n  -moz-transition: -moz-transform 2s;\n  -o-transition: -o-transform 2s;\n\
  }\n#box:hover {\n  -webkit-transform: translateX(400px);\n  -moz-transform: translateX(400px);\n\
  \  -o-transform: translateX(400px);\n}\n```\n\n\n\n\n```css\ntransition {\n  transform:\
  \ transform 2s;\n}\n\n#box:hover {\n  -webkit-transform: translateX(400px);\n  -moz-transform:\
  \ translateX(400px);\n  -ms-transform: translateX(400px);\n  -o-transform: translateX(400px);\n\
  \  transform: translateX(400px);\n}\n```\n\n### 通过点击事件触发过渡动画\n\n在桌面级计算机上，使用悬停（hover）事件是触发过渡动画的一种不错方法。但这种方法的问题在于，`:hover`\
  \ 伪类在 iPhone 或 Android 等移动设备并不支持。\n\n在本章前面的部分，在列表 3.2 中，你应用了用户悬停在某个元素上时对该元素背景颜色进行的更改；你利用过渡（transitions）来确保颜色变化具有动画效果。一种更通用的、同时适用于桌面和移动浏览器的方法是通过通过事件（例如点击事件）来触发过渡，而这些事件可以通过\
  \ JavaScript 进行处理。\n\n#### 在移动环境中触发背景颜色过渡\n\n你可以修改之前的代码，使其在移动设备和桌面设备上都能运行。为了在移动设备上触发颜色变化，你需要定义两个新的类选择器\
  \ `.blue` 和 `.purple`，并使用 JavaScript 在用户点击 `#animateMe` 元素时在这些类之间切换。\n\n首先，你将丰富列表\
  \ 3.2 中的代码，以实现在悬停时触发背景颜色变化。在列表 3.4 中，你丰富了代码，添加了两个新的类选择器 `.purple` 和 `.blue`，它们也会改变背景颜色。你还必须更新\
  \ `#animateMe:hover` 伪类，将其更改为 `#animateMe.purple:hover`。这样做是为了考虑到新的 `#animateMe.purple`\
  \ 选择器，除非我们在其后面追加 `.purple`，否则它将覆盖 `#animateMe:hover` 选择器。列表 3.4 用**粗体**字体显示了这些新选择器。\n\
  \n列表 3.4. 定义类选择器以更改背景颜色 (colorchange.html)\n\n```css\n#animateMe.purple:hover {\n\
  \  background-color: rgb(0,0,255);\n}\n\n#animateMe.blue {\n  background-color:\
  \ rgb(0,0,255);\n}\n\n#animateMe.purple {\n  background-color: rgb(128,0,128);\n\
  }\n```\n\n#### 注意\n\n你可能会疑惑为什么我没有在列表 3.4 中将新的 `.blue` 选择器与 `#animateMe:hover` 伪类结合起来，因为它们都定义了相同的样式。我没有让你将这些选择器分在一起，因为这样做会在移动浏览器中引起问题。正如\
  \ Mozilla 在其 `:hover` CSS 参考页面中所指出的，“在触摸屏上 `:hover` 是有问题的或无法实现的。`:hover` 伪类从不匹配，或者在触摸元素后仅匹配一短时间”([`developer.mozilla.org/en-US/docs/CSS/:hover`](https://developer.mozilla.org/en-US/docs/CSS/:hover))。在\
  \ iPad 上将 `.colorchange` 选择器与 `:hover` 伪类分组会导致第一次点击触发颜色过渡，但随后的点击会被忽略。\n\n定义这两个选择器确保了当在桌面浏览器中悬停在\
  \ `#animateMe` 元素上，以及在移动浏览器中点击应用 `colorchange` 类时，背景颜色都会发生变化。\n\n现在你需要一种方法在应用到 `#animateMe`\
  \ 元素上的类（蓝色和紫色）之间切换。你通过 JavaScript 实现这种切换。在列表 3.5 中，你设置了一个事件监听器，当元素被点击时运行 `transition`\
  \ 函数。如果 `#animateMe` 的类之前被设置为蓝色，则将其更改为紫色。如果之前被设置为紫色，将其更改为蓝色。你可以在 [`alexisgo.github.com/LearningCSSAnimations/ch3code/colorchange.html`](http://alexisgo.github.com/LearningCSSAnimations/ch3code/colorchange.html)\
  \ 查看此代码的运行情况。\n\n列表 3.5. 当 #animateMe 被点击时添加类 colorchange (colorchange.js)\n\n点击此处查看代码图像\n\
  \n```javascript\nvar elem = document.getElementById(\"animateMe\");\n\nelem.addEventListener(\"\
  click\", transition, false);\n\nfunction transition() {\n  if (this.className ==\
  \ \"purple\") {\n    this.className = \"blue\";\n  }\n  else if (this.className\
  \ == \"blue\"){\n    this.className = \"purple\";\n  }\n}\n```\n\n#### 注意\n\n在列表\
  \ 3.5 中，你使用 `addEventListener` 方法来设置你希望在响应用户点击 `#animateMe` 时运行的代码。\n\n#### 在移动环境中触发过渡\n\
  \n与其使用悬停，不如你可以使用 JavaScript 添加一个类。在列表 3.6 中，你定义了 `translate` 选择器。\n\n列表 3.6. 定义类选择器以应用变换\
  \ (box.html)\n\n```css\n#box.translate {\n  -webkit-transform: translateX(400px);\n\
  \  -moz-transform: translateX(400px);\n  -ms-transform: translateX(400px);\n  -o-transform:\
  \ translateX(400px);\n  transform: translateX(400px);\n}\n```\n\n在列表 3.7 中，你设置了一个事件监听器来监听点击。`transition()`\
  \ 函数在缺失时添加 `translate` 类。\n\n列表 3.7. 点击事件触发动画 (box.js)\n\n```javascript\nvar box\
  \ = document.getElementById(\"box\");\n\nbox.addEventListener(\"click\", transition,\
  \ false);\n\nfunction transition() {\n  if (this.className) {\n    this.className\
  \ = \"\";\n  }\n  else {\n    this.className = \"translate\";\n  }\n}\n```\n\n##\
  \ 过渡属性\n\n现在你已经掌握了过渡的基础，可以更详细地查看配置它们的所有方法。有四个可以用于自定义过渡的属性：\n\n- `transition-property`\n\
  - `transition-duration`\n- `transition-timing-function`\n- `transition-delay`\n\n\
  你已经在示例中使用 `transition-property` 和 `transition-duration`。现在你将深入研究这些属性，并学习你尚未实际过的计时和延迟属性。\n\
  \n#### transition-property\n\n正如你在章节前面的部分学到的，`transition-property` 属性允许你定义要动画化的属性。如果你想对某个元素进行透明度过渡，你可以设置：\n\
  \n```css\ntransition-property: opacity;\n```\n\n你可以通过指定逗号分隔列表来设置多个 `transition-property`\
  \ 值：\n\n```css\ntransition-property: opacity, background-color, transform;\n```\n\
  \n如果你希望所有变化都以相同的持续时间和相同的计时函数发生发生，可以将 `transition-property` 属性设置为特殊关键字 `all`，以确保所有可动画属性值的变化都以相同的方式进行动画：\n\
  \n```css\ntransition-property: all;\n```\n\n\n\n\n\n`all` 也是 `transition-property`\
  \ 的默认值，因此如果你没有指定 `transition-property` 值，所有的更改都将根据其他过渡相关属性中设置的值进行动画处理。\n\n只有当 CSS\
  \ 属性是可动画的，你才能将它们设置为 `transition-property` 的值。好消息是，大多数属性都是可以的。严格来说，可动画属性列表处于变动中并可能会发生变化。但在实践中，你几乎所有想要动画化的属性目前都是可动画的。如果你感兴趣并想查看当前可以动画化的（非常长的）列表，可以查看\
  \ W3C 的 CSS 过渡规范草案：[`dev.w3.org/csswg/css3-transitions/#animatable-properties-`](http://dev.w3.org/csswg/css3-transitions/#animatable-properties-)。Lea\
  \ Verou 在一个非常直观、非常有用的项目“Animatable”中，为 39 个可动画属性编写了良好的视觉描述：[`leaverou.github.com/animatable/`](http://leaverou.github.com/animatable/)。\n\
  \n***\n\n## Note\n\n`transform` 是一个可动画的属性——但是只在 `scale` 变换上定义过渡又如何呢？在编写本文期间，还没有办法在过渡属性中区分不同的变换类型。你无法在单个元素上特定地定义\
  \ `scale` 变换耗时 2 秒，而 `rotate` 变换耗时 3 秒；你只能指定该元素上所有变换将花费的持续时间。\n\n在 CSS3 W3C 邮件列表中，有人提问\
  \ `transform` 属性是否可以被拆分为原子元素以支持这种功能。对此，CSS 变换草案规范的作者之一 Simon Fraser 表明，这样做会增加太多的复杂度；请参见\
  \ [`lists.w3.org/Archives/Public/www-style/2011Feb/0795.html`](http://lists.w3.org/Archives/Public/www-style/2011Feb/0795.html)。\n\
  \n***\n\n### transition-duration\n\n`transition-duration` 属性允许你定义动画持续的时间，以秒（`s`）或毫秒（`ms`）为单位：\n\
  \n```css\ntransition-duration: 2s;\n```\n\n### transition-timing-function\n\n`transition-timing-function`\
  \ 属性允许你控制过渡动画在持续时间内中间点的播放速度。它允许你指定过渡动画的某些部分以不同的速度播放。计时函数允许你配置是否希望动画例如在开始时运行较慢、在结束时运行较慢，或在整个过程中保持一致的速度。有几种计时函数可选：\n\
  \n- `linear`: 动画在整个过程中以相同的速率播放。\n- `ease`: 这是默认的 `transition-timing-function` 函数。它与\
  \ `ease-in-out` 计时函数非常相似，但在动画开始时的加速更快，且减速开始得更早。\n- `ease-in`: 动画在开始时运行较慢。\n- `ease-out`:\
  \ 动画在结束时运行较慢。\n- `ease-in-out`: 动画在开始和结束时运行比中间部分慢。\n- `cubic-bezier`: 该函数允许你通过定义三次贝塞尔曲线来为动画指定自定义的计时速率。它接受四个参数——`x1`、`y1`、`x2`\
  \ 和 `y2`——这些参数决定了贝塞尔曲线的点。关于三次贝塞尔曲线的极佳可视化效果，请查看 Lea Verou 的 [`cubic-bezier.com`](http://cubic-bezier.com)。\n\
  \n如果没有显式设置计时函数，则使用默认的计时函数 `ease`。要了解更多关于计时函数和贝塞尔曲线工作原理的知识，请查看 The Art of Web 上这篇优秀的文章，它说明了不同的计时函数：[`www.the-art-of-web.com/css/timing-function/`](http://www.the-art-of-web.com/css/timing-function/)。\n\
  \n### transition-delay\n\n当你设置特定更改在给定时间范围内进行过渡时，过渡不需要立即开始。你可以使用 `transition-delay`\
  \ 属性定义浏览器在过渡开始之前应该等待多久：\n\n```css\ntransition-delay: 3s;\n```\n\n如前所述，你也可以用毫秒指定\
  \ `transition-delay`。如果你想要半秒的延迟，可以如下进行定义：\n\n```css\ntransition-delay: 500ms;\n\
  ```\n\n如果你使用 `transition` 简写属性并只指定单个时间值，则提供的第一个值将始终被用于 `transition-duration` 属性。因此，为了通过\
  \ `transition` 简写属性添加延迟，你必须包含 `transition-duration` 和 `transition-delay` 的值。\n\n\
  ***\n\n### 在 transition 简写属性中指定多个过渡\n\n正如前面讨论的，与其指定所有独立的过渡属性，不如使用 `transition` 简写。当你想要指定多个过渡时，`transition`\
  \ 简写会变得特别有用。\n\n要使用 `transition` 简写指定多个过渡，请用逗号分隔列表。例如，要在 2 秒持续时间内更改 `opacity`，但在\
  \ 4 秒持续时间内更改 `background-color`，且两者都使用 `ease-in` 计时函数和 1 秒延迟，你可以这样写：\n\n```css\n\
  transition: opacity 2s ease-in 1s,\n            background-color 4s ease-in 1s;\n\
  ```\n\n当你使用逗号分隔的多个过渡时，可以通过将每个过渡放在新行来使代码更具可读性。\n\n***\n\n## 旋转车轮\n\n在本节中，你将通过对你在\
  \ `第 2 章` 中编写的代码进行增强，练习你到为止学的所有过渡。你将修改 `bike.html` 文件，以便在用户悬停时让自行车车轮移动。\n\n首先，你需要定义过渡，并在\
  \ `列表 3.8` 中这样做，将其添加到 `#frontwheel` 和 `#backwheel` 选择器中。在这里使用 `transform` 属性作为 `transition-property`\
  \ 的值，并指定过渡持续 3 秒。最后，将 `transition-timing-function` 设置为 `ease-in-out`，以便车轮在过渡结束时缓慢旋转并缓慢停止。\n\
  \n在 CSS3 W3C 邮件列表中，有人提问 `transform` 属性是否可以被拆分为原子元素以支持这种功能。对此，CSS 变换草案规范的作者之一 Simon\
  \ Fraser 表明，这样做会增加太多的复杂度；请参见 [`lists.w3.org/Archives/Public/www-style/2011Feb/0795.html`](http://lists.w3.org/Archives/Public/www-style/2011Feb/0795.)。\n\
  \n你需要定义想要应用的变换。假设你想让车轮在有人悬停时旋转两圈——720 度。`图 3.2` 显示了应用到车轮的中间点——0 度、90 度和 180 度旋转。为了让车轮的旋转更加明显，`图\
  \ 3.2` 更改了其中一个辐条的样式，使其变得更大并具有虚线边框。\n\n\n\n\n\n你已经学习了如何让轮子旋转，在本章的最后一个示例中，你将旋转轮子与移动的自行车相结合，让自行车看起来在屏幕上来回移动。到目前为止，你的自行车动画是在鼠标悬停（hover）时触发的。现在你将添加一些\
  \ JavaScript，以便你可以监听点击事件，然后触发自行车响应地跨越屏幕。\n\n首先，你为 `#bike` 元素发生的任何 `transform` 变化设置了一个\
  \ 3 秒的过渡（transition），并使用 `linear`（线性）时间函数运行（参见列表 3.9）。\n\n列表 3.9. 为自行车设置过渡 (bikemotion.css)\n\
  \n点击此处查看代码图片\n\n```css\n#bike {\n  -webkit-transition: -webkit-transform 3s linear;\n\
  \  -moz-transition: -moz-transform 3s linear;\n  -o-transition: -o-transform 3s\
  \ linear;\n  transition: transform 3s linear;\n}\n```\n\n接下来，在列表 3.10 中，你定义了当 `#bike`\
  \ 元素的 `class` 属性被设置为 `move` 时应该发生的位移（translation）。最初，`#bike div` 没有设置 `class` 属性。你可以使用\
  \ JavaScript 在用户点击时程序化地向 `class` 属性添加新的 `move`。\n\n列表 3.10. 通过 .move 类选择器位移 #bike\
  \ 元素 (bikemotion.css)\n\n```css\n#bike.move {\n  -webkit-transform: translateX(500px);\n\
  \  -moz-transform: translateX(500px);\n  -ms-transform: translateX(500px);\n  -o-transform:\
  \ translateX(500px);\n  transform: translateX(500px);\n}\n```\n\n在列表 3.9 和 3.10\
  \ 中，你现在有两个不同的选择器（`#bike` 和分组的 `#frontwheel`, `#backwheel`）在设置过渡。你可能会想把将这些过渡设置合并到单个选择器中，因为它们的持续时间都是\
  \ 3 秒。然而，保持它们分开是重要的，因为这些过渡每个都使用了不同的时间函数。如果你定义了一个单一的过渡，你就无法让自行车的位移通过 `linear` 时间函数发生了。相反，轮子将使用\
  \ `ease-in-out`（淡入淡出）时间函数进行动画。\n\n当一个元素具有多个匹配选择器时，如果你想为不同的 `transform` 类型设置不同的过渡时长，那么在不同的匹配选择器上应用不同的过渡也是有帮助。正如前面提到的，目前还没有办法将特定的\
  \ `transform` 类型列为 `transition-property`；你被限制在 `transform` 属性上。但通过使用不同的选择器定义不同的过渡（如列表\
  \ 3.9 和 3.10 中所示），你可以为不同的 `transform` 类型指定不同的动画配置。\n\n### 自行车移动时旋转轮子\n\n除了响应用户点击自行车让其跨越屏幕外，你还可以让轮子旋转。列表\
  \ 3.11 定义了一个类选择器 `.spin`，它在被应用时会引起 1080 度的旋转。\n\n列表 3.11. 使用 transform 旋转轮子 (bikemotion.css)\n\
  \n```css\n.spin {\n  -webkit-transform: rotate(1080deg);\n  -moz-transform: rotate(1080deg);\n\
  \  -ms-transform: rotate(1080deg);\n  -o-transform: rotate(1080deg);\n  transform:\
  \ rotate(1080deg);\n}\n```\n\n### 触发动画\n\n现在你可以利用 JavaScript 在用户点击自行车时，为两个轮子都添加\
  \ `spin` 类。在列表 3.12 中，你为自行车的 `div` 元素设置了点击事件监听器。当自行车被点击时，你检查该 `div` 是否存在类名。如果没有（最初是没有的），你就向它添加\
  \ `move` 类名，并为前后轮添加 `spin` 类名。在随后的点击中，由于现在存在类名，你从元素中移除两个类名，自行车将动画回到页面左侧。你可以通过访问演示\
  \ [`alexisgo.github.com/LearningCSSAnimations/ch3code/bike.html`](http://alexisgo.github.com/LearningCSSAnimations/ch3code/bike.html)\
  \ 来亲自尝试。\n\n<multimedia/03vid04.m4v>\n\n![03vid04.m4v](img/posterimage02.jpg)\n\n\
  视频 3.4. 自行车移动屏幕\n\n列表 3.12. 点击时触发类名变更 (bike.js)\n\n点击此处查看代码图片\n\n```javascript\n\
  var bike = document.getElementById(\"bike\");\n\nbike.addEventListener(\"click\"\
  , pedal, false);\n\nfunction pedal() {\n  var frontwheel, backwheel, bike;\n  bike\
  \ = document.getElementById(\"bike\");\n  backwheel = document.getElementById(\"\
  backwheel\");\n  frontwheel = document.getElementById(\"frontwheel\");\n\n  if (bike.className)\
  \ {\n    bike.className = \"\";\n    backwheel.className = \"\";\n    frontwheel.className\
  \ = \"\";\n  } else {\n    bike.className = \"move\";\n    backwheel.className =\
  \ \"spin\";\n    frontwheel.className = \"spin\";\n  }\n}\n```\n\n### 其他资源\n\n为了学习更多关于\
  \ CSS 过渡的知识，我推荐以下资源：\n\n• CSS Transitions 工作草稿 [`www.w3.org/TR/css3-transitions/`](http://www.w3.org/TR/css3-transitions/)\n\
  \n来自 CSS3 Files 的过渡概览 [`www.css3files.com/transition/`](http://www.css3files.com/transition/)\n\
  \n• Mozilla 开发者网络关于时间函数的详细解释 [`developer.mozilla.org/en-US/docs/CSS/timing-function`](https://developer.mozilla.org/en-US/docs/CSS/timing-function)\n\
  \n## 总结\n\n在本章中，你学习了如何使用过渡动画某些 CSS 属性。你学习了所有可用配置：`transition-property`、`transition-duration`、`transition-timing-function`\
  \ 和 `transition-delay`。你还复习了使用过渡动画 transform 的细节。你增强了自行车示例，增加了旋转轮子并让自行车在屏幕上来回移动。\n\
  \n## 挑战\n\n增强你的自行车示例，添加两个速度略有不同的踏板。在添加了两个旋转踏板后，尝试让自行车在跨越屏幕时抬起轮。为了实现这一点，你可能想尝试更改\
  \ `#bike div` 的 `transform-origin` 属性，然后旋转 `#bike` 元素。\n\n\n\n\n过渡（Transitions）让你能够拥有起点和终点。相比之下，关键帧动画（keyframe\
  \ animations）允许你定义具有多个中间步骤的动画。在这些中间步骤中，你可以以强大的方式配置动画，例如在动画的不同阶段使用不同的计时函数。关键帧动画还具有过渡不具备的配置选项：你可以指定动画播放的次数、更改动画的方向，并在动画完成后仍将动画的样式应用到动画元素上。\n\
  \n### 关键帧动画的浏览器支持\n\n以下浏览器目前支持关键帧动画：\n\n• Android Browser 2.1+\n• Chrome 4.0+\n\
  • Firefox 5.0+\n• Internet Explorer 10.0+\n• iOS Safari 3.2+ 和 Safari 4.0+\n• Opera\
  \ 12.0+\n\n在本文写作时，Opera 12.5、Firefox 16 和 Internet Explorer 10 已经支持标准的关键帧动画语法（不带厂商前缀的语法）。\n\
  \n### 创建基础关键帧\n\n创建关键帧动画需要两个不同的步骤：\n\n1. 设置动画的关键帧。\n2. 通过通过设置控制动画播放方式的属性来配置动画。\n\
  \n你通过使用 `@keyframes` CSS 规则来设置关键帧动画。该规则允许你指定（例如）动画如何开始以及应该如何结束。以这种最基础的方式使用关键帧与使用过渡没有本质区别。事实上，如果你仅仅需要从一个值移动到另一个值，那么使用过渡会更好。\n\
  \n要创建一组新的关键帧，首先要添加 `@keyframes` 规则，并为你正在创建的关键帧动画命名。你需要使用带有厂商前缀的关键帧动画语法版本，以确保对 WebKit\
  \ 浏览器、Firefox 15 及更早版本以及 Opera 12 的支持。为了定义一个名为 `animation-name` 的新关键帧动画并确保所有浏览器的支持，你应该这样写：\n\
  \n```css\n@-webkit-keyframes animation-name { }\n@-moz-keyframes animation-name\
  \ { }\n@-o-keyframes animation-name { }\n@keyframes animation-name { }\n```\n\n\
  Internet Explorer 10 是第一个支持关键帧的 Internet Explorer 版本，因此在这种情况下你不需要担心 `-ms-` 前缀。\n\
  \n接下来，你定义组成动画的关键帧。如果你只定义两个关键帧，可以使用 `from` 和 `to` 关键字，每个关键字后面跟着一个 CSS 块，其中包含你想要应用到该关键帧的所有样式，如列表\
  \ 4.1 所示。\n\n列表 4.1 基础关键帧语法\n\n点击此处查看代码图像\n\n```css\n@-webkit-keyframes animation-name\
  \ {\n  from { /* 第一帧的 CSS 样式 */ }\n  to { /* 最后一帧的 CSS 样式*/ }\n}\n\n@-moz-keyframes\
  \ animation-name {\n  from { /* 第一帧的 CSS 样式 */ }\n  to { /* 最后一帧的 CSS 样式*/ }\n}\n\
  \n@-o-keyframes animation-name {\n  from { /* 第一帧的 CSS 样式 */ }\n  to { /* 最后一帧的\
  \ CSS 样式*/ }\n}\n\n@keyframes animation-name {\n  from { /* 第一帧的 CSS 样式 */ }\n \
  \ to { /* 最后一帧的 CSS 样式*/ }\n}\n```\n\n## 关键帧的组成\n\n根据 W3C CSS 动画规范([`www.w3.org/TR/css3-animations/#keyframes`](http://www.w3.org/TR/css3-animations/#keyframes))，关键帧由三个部分组成：\n\
  \n• `@keyframes` 规则\n• 关键帧选择器\n• 关键帧声明块\n\n`@keyframes` 规则由关键字 `@keyframes` 后跟一个动画名称以及一组\
  \ CSS 样式规则组成，如列表 4.1 所示。\n\n关键帧选择器可以是关键字 `from` 和 `to`（如列表 4.1 所示）、代表该帧在动画出现位置的百分比值（如你将在列表\
  \ 4.4 中看到的），或者是用逗号分隔的百分比值列表，用于定义动画中出现同一帧的多个位置（如你将在列表 4.7 中看到的）。\n\n最后，关键帧声明块由关键帧选择器内部指定的属性/值对组成。\n\
  \n以下是关于如何结合使用 `@keyframes`、关键帧选择器和关键帧声明来定义关键帧的总结：\n\n点击此处查看代码图像\n\n```css\n@keyframes\
  \ animation-name {\n  <keyframe selector>: { <keyframe declaration>; }\n}\n```\n\
  \n例如，如果你想让元素的 `background-color` 从黑色动画到浅灰色——`rgb(211,211,211)`，你可以像列表 4.2 所示设置关键帧。\n\
  \n列表 4.2 使用关键帧改变颜色\n\n```css\n@-webkit-keyframes animation-name {\n  from { /* 第一帧的\
  \ CSS 样式 */ }\n  to { /* 最后一帧的 CSS 样式*/ }\n}\n\n@-moz-keyframes animation-name {\n\
  \  from { /* 第一帧的 CSS 样式 */ }\n  to { /* 最后一帧的 CSS 样式*/ }\n}\n\n@-o-keyframes animation-name\
  \ {\n  from { /* 第一帧的 CSS 样式 */ }\n  to { /* 最后一帧的 CSS 样式*/ }\n}\n\n@keyframes animation-name\
  \ {\n  from { /* 第一帧的 CSS 样式 */ }\n  to { /* 最后一帧的 CSS 样式*/ }\n}\n```\n\n## 设置动画属性\n\
  \n设置 `@keyframes` 规则只是创建关键帧的第一步。接下来，你必须将创建的关键帧分配给元素，并配置动画的播放方式。为了播放动画，你至少必须设置两个属性：`animation-name`\
  \ 和 `animation-duration`。\n\n例如，假设你使用 HTML 定义了一个 `id` 设置为 `animateMe` 的元素。你可以通过将\
  \ `animation-name` 设置为 `colorchange`，让列表 4.2 中定义的 `colorchange @keyframes` 作用于 `animateMe`\
  \ 元素（参见列表 4.3）。\n\n列表 4.3 使用 animation-name 和 animation-duration 配置关键帧\n\n```html\n\
  <style>\n#animateMe {\n  width: 100px;\n  height: 100px;\n  background-color: black;\n\
  \  -webkit-animation-name: colorchange;\n  -moz-animation-name: colorchange;\n \
  \ -o-animation-name: colorchange;\n  animation-name: colorchange;\n  -webkit-animation-duration:\
  \ 5s;\n  -moz-animation-duration: 5s;\n  -o-animation-duration: 5s;\n  animation-duration:\
  \ 5s;\n}\n</style>\n\n<body>\n  <div id=\"animateMe\"></div>\n</body>\n```\n\n`animation-name`\
  \ 和 `animation-duration` 只是目前 CSS 动画规范中定义的八个动画属性中的两个。你将在本章的晚些部分学习其余动画属性，它们都是可选的。\n\
  \n\n\n\n\n虽然你完全可以按照本章目前演示的方式使用关键帧动画，但如果你只是简单地在两个值之间切换，关键帧动画相比过渡效果（transitions）并没有提供太大益处。但关键帧比过渡灵活得多的一种方式是，它们允许你只向一个方向进行动画，而不是像所有过渡那样绕一整圈。例如，你无法在过渡效果上进行悬停（hover）并让元素保留过渡所应用的样式；当鼠标移开时，元素的样式会恢复到原始状态。使用关键帧，正如我们在讨论\
  \ `animation-fill-mode` 属性时将会看到的，你可以指定在关键帧动画结束时添加的样式在动画结束后持续存在。\n\n关键帧动画另一个派上用场的场景是你想要定义三个或更多关键帧时。在这种情况下，你将不会使用\
  \ `from` 和 `to` 关键帧选择器，而是使用百分比值来定义关键帧在动画的何一点发生。请注意，使用 `from` 等同于使用 `0%`，使用 `to`\
  \ 等同于使用 `100%`。例如，如果你想创建一个具有三个主要帧的动画，每个帧发生在动画的三分之一处，你可以按照列表 4.4 所示设置关键帧。请注意，第一个关键帧\
  \ `0%` 表示动画的起始点。\n\n### 列表 4.4. 多次改变颜色的关键帧动画 (bwKeyframes.css)\n\n点击此处查看代码图片\n\n\
  ***\n\n```css\n@-webkit-keyframes rangeOfGrays {\n  0% { background-color: black;\
  \ }\n  33% { background-color: rgb(211,211,211); }\n  66% { background-color: rgb(105,105,105);\
  \ /*darkgray*/; }\n  100% { background-color: gray; }\n}\n\n@-moz-keyframes rangeOfGrays\
  \ {\n  0% { background-color: black; }\n  33% { background-color: rgb(211,211,211);\
  \ }\n  66% { background-color: rgb(105,105,105); /*darkgray*/; }\n  100% { background-color:\
  \ gray; }\n}\n\n@-o-keyframes rangeOfGrays {\n  0% { background-color: black; }\n\
  \  33% { background-color: rgb(211,211,211); }\n  66% { background-color: rgb(105,105,105);\
  \ /*darkgray*/; }\n  100% { background-color: gray; }\n}\n\n@keyframes rangeOfGrays\
  \ {\n  0% { background-color: black; }\n  33% { background-color: rgb(211,211,211);\
  \ }\n  66% { background-color: rgb(105,105,105); /*darkgray*/; }\n  100% { background-color:\
  \ gray; }\n}\n```\n\n***\n\n强调 `@keyframes` 规则中的帧是如何协同工作的是非常重要的。帧本身并不会做任何事情。重要的是帧*之间*的持续。两个帧总是协同工作以定义发生的变化。在列表\
  \ 4.4 中，定义变化的不是 `0%` 样式或 `33%` 样式，而是两者共同作用的结果。将执行动画的变化是 `0%` 帧中的样式与 `33%` 帧中的样式之间的差异。列表\
  \ 4.4 中的样式被应用于 HTML 中的元素 `#animation` 元素，它是一个简单的 `div` 元素：\n\n```html\n<div id=\"\
  animation\"></div>\n```\n\n现在你已经定义了关键帧，你还必须配置关键帧动画本身。在列表 4.5 中，你将动画分配给 `rangeOfGrays\
  \ @keyframes`，并将 `animation-duration` 设置为 5 秒。该代码的演示可以在 [`alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframes.html`](http://alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframes.html)\
  \ 获取。\n\n### 列表 4.5. 配置颜色改变动画 (bwKeyframes.css)\n\n***\n\n```css\n#animation {\n\
  \  width: 100px;\n  height: 100px;\n  background-color: black;\n  -webkit-animation-name:\
  \ rangeOfGrays;\n  -moz-animation-name: rangeOfGrays;\n  -o-animation-name: rangeOfGrays;\n\
  \  animation-name: rangeOfGrays;\n  -webkit-animation-duration: 5s;\n  -moz-animation-duration:\
  \ 5s;\n  -o-animation-duration: 5s;\n  animation-duration: 5s;\n}\n```\n\n***\n\n\
  #animation\n\n![图 1.1](img/image01.jpg)\n图 1.1 `@keyframes` 规则中的帧是如何协同工作的。\n\n***\n\
  \n### 使用关键帧制作背景颜色\n\n注意，到为止的示例至少有两个关键帧。然而，你只需要指定一个。如果 `to` 或 `from` 关键帧缺失，浏览器会自动构建。例如，假设你有一个蓝色背景的\
  \ `div`，并定义了一个名为 `makered` 的动画：\n\n```css\ndiv {\n  background-color: blue;\n  animation-name:\
  \ makered;\n  animation-duration: 2s;\n}\n\n@keyframes makered {\n  50% {\n    background-color:\
  \ red;\n  }\n}\n```\n\n由于 `makered` 动画只定义了 `50%`，元素将开始蓝色，然后在中间变为红色。\n\n### 控制动画\n\
  \n你可以配置六个可选属性来精细地控制动画：\n\n- `animation-fill-mode`：该属性定义动画样式应用于目标元素。默认值是 `none`。\n\
  - `animation-iteration-count`：该属性指示动画播放次数。默认值是 `one`。\n- `animation-direction`：该属性定义动画是否反向播放（从\
  \ `100%` 到 `0%`），或者在某些迭代中反向播放。默认值是 `normal`。\n- `animation-timing-function`：该属性控制动画中间点在其持续时间内播放的速度。默认值是\
  \ `ease`。\n- `animation-delay`：该属性定义动画在播放前等待多久。以秒 (`s`) 或毫秒 (`ms`) 为单位。默认值是 `0`。\n\
  - `animation-play-state`：该属性定义动画当前是运行还是暂停。默认值是 `running`。注意，此属性仅用于响应事件（例如悬停在元素上），而不能作为单个关键帧内部的状态。\n\
  \n#### animation-fill-mode\n\n如果你查看了列表 4.4 的演示页面，你会注意到在动画结束时，元素会跳回原始的 `background-color`（黑色）。这种变化很突兀，可能不是你想要实现的效果。为了防止这种情况，你可以利用可选动画属性之一的\
  \ `animation-fill-mode`。`animation-fill-mode` 定义了在动画运行之前或之后元素元素发生的情况。以下是 `animation-fill-mode`\
  \ 的可用值：\n\n- `none`（默认值）\n- `forwards`\n- `backwards`\n- `both`\n\n\n\n\n当 `animation-fill-mode`\
  \ 设置为 `none` 时，动画元素在开始动画之前应用的任何样式，都将在动画完成后应用到该元素。在我们的案例中，`div` 元素最初具有黑色的 `background-color`，因此一旦动画结束，它就会重新应用该颜色。\n\
  \n假设你想让动画的最终值（灰色的 `background-color`）在动画完成后仍应用到元素上。你可以通过将 `animation-fill-mode`\
  \ 设置为 `forwards` 来实现这一点。`forwards` 值会在动画完成后将最后一个关键帧中定义的样式应用到元素上。通常，最后一个关键帧是 `to`\
  \ 关键帧或 `100%` 关键帧。但并非总是如此，正如我们稍后在 Listing 4.7 中所示，如果动画是往复交替的，最后一个关键帧也可以是 `from`\
  \ 关键帧或 `0%` 关键帧。\n\n在 Listing 4.6 中，你添加了 `animation-fill-mode` 属性，以便让最终灰色的 `background-color`\
  \ 应用到动画结束之后。请注意，你指定的更改在一个新文件 `bwKeyframesStick.html` 中。与本章中的其他示例一样，该文件的源代码可以在书籍的\
  \ GitHub 页面（[`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)）找到，文件的演示可以在\
  \ [`alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframesStick.html`](http://alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframesStick.html)找到。\n\
  \nListing 4.6. 使用 animation-fill-mode: forwards 保留最终关键帧样式 (bwKeyframesStick.html)\n\
  \n点击此处查看代码图片\n\n* * *\n\n```html\n<head>\n  <!-- base css for bw keyframes animations\
  \ -->\n  <link rel=\"stylesheet\" href=\"css/bwKeyframes.css\">\n  <!-- custom css\
  \ for this file -->\n  <style>\n  #animation {\n    -webkit-animation-fill-mode:\
  \ forwards;\n    -moz-animation-fill-mode: forwards;\n    -o-animation-fill-mode:\
  \ forwards;\n    animation-fill-mode: forwards;\n  }\n  </style>\n</head>\n<body>\n\
  \  <div id=\"animation\"></div>\n</body>\n```\n\n* * *\n\n<multimedia/04vid02.m4v>\n\
  \n![04vid02.m4v](img/posterimage02.jpg)\n\n视频 4.2. 让动画属性的更改保持不变\n\n将 `animation-fill-mode`\
  \ 设置为 `backwards` 会导致第一个关键帧中应用的样式应用在 `animation-delay` 属性定义的期间内。将 `animation-fill-mode`\
  \ 设置为 `both` 则结合了 `forwards` 和 `backwards` 的效果。它会将第一个关键帧的样式应用到动画运行之前的延迟期间（如果有的话），并在动画执行完成后将最后一个关键帧的样式应用到元素上。\n\
  \n与其通过修改 `animation-fill-mode` 属性来让最终关键帧的 `background-color` 保持不变，你也可以简单地让最后一个关键帧以\
  \ `background-color: black` 结束。这样，动画将以它开始时的相同颜色结束，你就不会注意到动画结束时快速变回原始颜色的变化了。\n\n\
  如果你使用这种方法，而不是专门为 `100%` 创建一个单独条目来指定黑色作为 `background-color`，你可以使用选择器分组的概念来节省字数。`0%`\
  \ 关键帧已经定义了黑色为 `background-color`。因此，你可以通过将选择器组合，将此样式同时应用到 `0%` 和 `100%` 关键帧。这在 Listing\
  \ 4.7 中得到了演示，其中分组的选择器已加粗以示强调。\n\nListing 4.7. 分组关键帧选择器\n\n* * *\n\n```css\n@-webkit-keyframes\
  \ rangeOfGrays{\n  0%, 100% { background-color: black; }\n  25% { background-color:\
  \ lightgray; }\n  50% { background-color: darkgray; }\n}\n@-moz-keyframes rangeOfGrays{\n\
  \  0%, 100% { background-color: black; }\n  25% { background-color: lightgray; }\n\
  \  50% { background-color: darkgray; }\n}\n@-o-keyframes rangeOfGrays{\n  0%, 100%\
  \ { background-color: black; }\n  25% { background-color: lightgray; }\n  50% {\
  \ background-color: darkgray; }\n}\n@keyframes rangeOfGrays{\n  0%, 100% { background-color:\
  \ black; }\n  25% { background-color: lightgray; }\n  50% { background-color: darkgray;\
  \ }\n}\n```\n\n* * *\n\n#### animation-iteration-count\n\n使用 `animation-iteration-count`，你不再局限于播放一次。你可以配置动画播放的次数，或者让它无限循环。\n\
  \n要指定动画重复多少次，可以使用 `animation-iteration-count`。如果你想让动画无限循环，可以设置为 `infinite`。如果你将\
  \ `animation-iteration-count` 设置为 `2`，结果将是黑色、浅灰色、深灰色，然后回到黑色。因为 `100%` 关键帧是灰色而不是黑色，Listing\
  \ 4.8 演示了 `animation-iteration-count` 的用法。该演示可以在 [`alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframesStick.html`](http://alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframesStick.html)找到。\n\
  \nListing 4.8. 使用 animation-iteration-count 重复颜色变化 (bwKeyframesStick.html)\n\n点击此处查看代码图片\n\
  \n* * *\n\n```html\n<head>\n  <!-- base css for bw keyframes animations -->\n  <link\
  \ rel=\"stylesheet\" href=\"css/bwKeyframes.css\">\n  <!-- custom css for this file\
  \ -->\n  <style>\n  #animation {\n    -webkit-animation-fill-mode: forwards;\n \
  \   -moz-animation-fill-mode: forwards;\n    -o-animation-fill-mode: forwards;\n\
  \    animation-fill-mode: forwards;\n  }\n  </style>\n</head>\n```\n\n* * *\n\n\
  #### animation-direction\n\n将 `animation-direction` 设置为 `alternate` 会导致动画在偶数次迭代中*正向*播放（从\
  \ `0%` 关键帧到 `100%` 关键帧），在奇数次迭代中*反向*播放（从 `100%` 关键帧到 `0%` 关键帧）。注意为了使用 `animation-direction`，需要将\
  \ `animation-iteration-count` 属性设置为 `2` 或更高或 `infinite`。\n\n为了演示这一点，与其在变灰色时结束，你可以让动画反向播放，循环关键帧中定义的颜色。Listing\
  \ 4.9 通过将 `animation-direction` 设置为 `alternate` 实现了这一点。你可以在此处看到这种效果：http://alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframesReverse.html](http://alexisgo.github.com/LearningCSSAnimations/ch4code/bwKeyframesReverse.html)。\n\
  \nListing 4.9. 使用 animation-direction 反转动画 (bwKeyframesReverse.html)\n\n点击此处查看代码图片\n\
  \n\n\n\n\n由于你将 `animation-iteration-count` 设置为 `2`，`animation-fill-mode: forwards`\
  \ 会将 0% 关键帧设置为最终关键帧。这是因为动画重复了两次，在动画结束之前的最后一个关键帧实际上是 0% 关键帧。\n\n### animation-delay\n\
  \n你可以使用 `animation-delay` 属性来延迟动画的启动。`animation-delay` 会导致动画在第一次运行前等待指定的时间再开始执行。\n\
  \n请注意，延迟*仅*适用于动画的第一次迭代。在动画重复期间，不会发生延迟。\n\n如果你想让 `rangeOfGrays` 动画延迟 2 秒启动，你可以这样写：\n\
  \n```css\n-webkit-animation-delay: 2s;\n-moz-animation-delay: 2s;\n-o-animation-delay:\
  \ 2s;\nanimation-delay: 2s;\n```\n\n### animation-play-state\n\n如果你希望动画能够响应用户操作而暂停，可以利用\
  \ `animation-play-state` 属性。`animation-play-state` 有两个可能的值：`paused`（暂停）和 `running`（运行）。如果你想在用户悬停在变色元素上时冻结它，可以通过将\
  \ `:hover` 伪类中的 `animation-play-state` 设置为 `paused` 来实现。列表 4.10 增强了 `bwKeyframesReverse.html`\
  \ 文件，包含了悬停时暂停动画的能力。\n\n列表 4.10 使用 animation-play-state 暂停动画 (bwKeyframesReverse.html)\n\
  \n* * *\n\n```css\n#animation:hover {\n  -webkit-animation-play-state: paused;\n\
  \  -moz-animation-play-state: paused;\n  -o-animation-play-state: paused;\n  animation-play-state:\
  \ paused;\n}\n```\n\n* * *\n\n### The animation 简写属性\n\n由于你可以定义许多属性来微调动画，而且在任何生产环境的动画中都需要处理许多厂商前缀，因此利用\
  \ `animation` 简写属性是有意义的。这个简写允许你将几乎所有可用动画属性合并到一行中：\n\n点击此处查看代码图像\n\n```css\nanimation:\
  \ <animation-name> <animation-duration> <animation-timing-function>\n  <animation-delay>\
  \ <animation-iteration-count> <animation-direction>\n  <animation-fill-mode>\n```\n\
  \n如果缺少任何可选属性，它们将简单地恢复到默认值。\n\n请注意，有一个属性是简写属性没有考虑到的：`animation-play-state`。如果你想暂停动画，无法通过动画简写来实现；你必须通过\
  \ `animation-play-state` 属性来设置它。\n\n如果你想对单个元素应用多个关键帧动画，你仍然可以使用 `animation` 简写属性。但是，你必须列出应用到第一个动画的所有属性，插入一个逗号，然后列出下一个动画名称及其所有相关属性。\n\
  \n另外请注意，与 `transition` 简写属性一样，如果你使用 `animation` 简写并只指定了一个单一的时间值，则提供的第一个值将始终被用于 `animation-duration`\
  \ 属性。因此，为了通过 `animation` 简写属性添加延迟，你必须包含 `animation-duration` 和 `animation-delay`\
  \ 的值。\n\n列表 4.11 展示了如何使用两个 `@keyframes` 使用 `animation` 简写属性的示例。\n\n列表 4.11 多个 @keyframes\
  \ 使用 animation 简写\n\n* * *\n\n```css\n#animateMe {\n  animation: animation1 3s,\
  \ animation2 4s;\n}\n```\n\n* * *\n\n列表 4.12 再次演示了如何使用两个 `@keyframes` 使用动画简写，但这次还指定了所有可选的动画属性。\n\
  \n列表 4.12 多个 @keyframes 和所有定义的属性使用 animation 简写\n\n点击此处查看代码图像\n\n* * *\n\n```css\n\
  #animateMe {\n  /* 动画属性的顺序为：\n     <animation-name> <animation-duration> <animation-timing-function>\n\
  \     <animation-delay> <animation-iteration-count> <animation-direction>\n    \
  \ <animation-fill-mode>\n  */\n  animation:\n    animation1 3s ease-in 1s 2 alternate,\n\
  \    animation2 4s ease-in-out 2s normal none;\n}\n```\n\n* * *\n\n如 列表 4.13 所示，你可以重写配置\
  \ `rangeOfGrays @keyframes` 的代码以利用 `animation` 简写。\n\n列表 4.13 更新动画以使用简写 (bwKeyframesShorthand.html)\n\
  \n点击此处查看代码图像\n\n* * *\n\n```css\n#animation {\n  /* 动画属性的顺序为：\n     <animation-name>\
  \ <animation-duration> <animation-timing-function>\n     <animation-delay> <animation-iteration-count>\
  \ <animation-direction>\n     <animation-fill-mode>\n  */\n  -webkit-animation:\
  \ rangeOfGrays 5s ease-in 1s 2 alternate,\n  -moz-animation: rangeOfGrays 5s ease-in\
  \ 1s 2 alternate,\n  -o-animation: rangeOfGrays 5s ease-in 1s 2 alternate,\n  animation:\
  \ rangeOfGrays 5s ease-in 1s 2 alternate;\n}\n```\n\n* * *\n\n### 动画一个弹簧\n\n为了进一步练习关键帧，在本节中，我们将为一个弹簧的压缩和释放制作动画。当你压缩弹簧并释放时，它会弹回比起始长度更长的位置，由于累积的力量——见图\
  \ 4.2。\n\n你无法通过过渡效果轻松实现这个示例，因为你需要反复缩放弹簧。\n\n首先，设置 HTML。HTML 由一个容器 `div` 和另一个使用弹簧图像作为背景的\
  \ `div`，如 列表 4.14 所示。\n\n列表 4.14 为弹簧图像设置 div (spring.html)\n\n* * *\n\n```html\n\
  <body>\n  <div id=\"container\">\n    <div id=\"spring\"></div>\n  </div>\n</body>\n\
  ```\n\n* * *\n\n### 创建弹簧压缩和回弹的关键帧\n\n为了完成弹簧的压缩和回弹，你需要三个关键帧，它们在 列表 4.15 中创建。在 列表\
  \ 4.15 中，我们还为 `#spring` 元素定义了一些基础样式。\n\n* * *\n\n注意\n\n在本示例以及本章后续的所有列表中，为了简洁，我们只使用了\
  \ `-webkit-` 厂商前缀。不过，你可以在 `ch4code/css/` 文件夹中的 `spring.css` 文件找到所有的厂商前缀。\n\n* *\
  \ *\n\n列表 4.15 压缩释放弹簧 (spring.css)\n\n点击此处查看代码图像\n\n* * *\n\n```css\n#spring {\n\
  \  background-image: url('../img/spring.png');\n  width: 50px;\n  height: 182px;\n\
  }\n\n@-webkit-keyframes spring {\n  0% { -webkit-transform: scale(1);}\n  30% {\
  \ -webkit-transform: scale(1, 0.5); }\n  40% { -webkit-transform: scale(1, 1.5);\
  \ }\n}\n```\n\n* * *\n\n第一个关键帧 0% 定义了弹簧的起始点——没有任何缩放的原始图像。\n\n\n\n\n第二个关键帧 30% 定义了压缩弹簧的结束状态——换句话说，在弹簧释放之前应该被压缩到多大程度。在这里，你将弹簧图像的高度缩小为原来的一半，而保持宽度不变。回想第\
  \ 2 章 中的“使用变换构建基础”，如果你在 `scale` 变换函数中指定两个值，第一个值修改宽度的缩放，第二个值修改高度的缩放。在这一以及后续所有的关键帧中，你将保持弹簧的宽度不变，但向上向下缩放高度。\n\
  \n在这种情况下，你会让这部分（0% 和 30% 关键帧之间的动画）成为动画中最长的一个点，因为压缩弹簧通常是一项不会立即发生的困难任务。而且这项任务所需比弹簧释放后的后续反弹更长，而后者会发生得很快。\n\
  \n浏览器使用 0% 和 30% 这两个关键帧来制作这两个关键帧之间所有中间点的动画，从而创建动画。从时长来看，动画将花费整个动画时间的 30%（从 0% 到\
  \ 30%）将弹簧缩小到原来大小的一半。具体来说，如果整个动画持续 3 秒，那么 0% 和 30% 关键帧之间的变化将花费 0.9 秒。\n\n在最后一个关键帧\
  \ 40% 中，你将弹簧的大小放大到原来高度的一的一点五倍，再次保持宽度不变。动画将花费整个动画时间的 10%（从 30% 到 40%）将压缩的弹簧拉伸到原来大小的\
  \ 150%。图 4.3 显示了前三个关键帧触发的变化。\n\n![Image](img/04fig03.jpg)\n\n图 4.3。弹簧动画的前三个关键帧创建了两个动作：压缩和反弹。\n\
  \n<multimedia/04vid05.m4v>\n\n![04vid05.m4v](img/posterimage02.jpg) \n\n视频 4.3。制作前三个关键帧\n\
  \n### 控制动画的播放\n\n现在你已经定义了关键帧，需要设置动画将如何播放。你可以通过 `animation` 简写属性来实现（参见列表 4.16）。你将动画指向\
  \ `spring @keyframes` 并指定 `animation-duration` 应为 2.8 秒。\n\n列表 4.16.为弹簧配置动画属性 (spring.css)\n\
  \n```css\n#spring {\n  /* 接续列表 4.15  */\n  -webkit-animation: spring 2.8s;\n  -moz-animation:\
  \ spring 2.8s;\n  -o-animation: spring 2.8s;\n  animation: spring 2.8s;\n}\n```\n\
  \n### 添加额外的压缩和反弹关键帧\n\n如果你按下弹簧并松手，并不会简单地只有单次反弹。弹簧会反弹，伸展自己，然后再次压缩，然后再次反弹、压缩，以此此类推，直到它最终耗尽所有能量。\n\
  \n为了创建一个反映这种现象的动画，你可以添加额外的关键帧，如列表 4.17 所示。对于 50% 关键帧，你可以设置 `scale` 变换函数将高度缩小到 0.7，即原来高度的\
  \ 70%。\n\n在 61% 关键帧处，你可以再次让弹簧反弹，这次缩放为弹簧原来高度的 1.4 (140%)。注意，你不是在动画的 10% 内完成压缩，而是可以让这个关键帧持续久一点：动画的\
  \ 11%（从 50% 到 61%）。这里的想法是，第一次反弹是最快的，而后续的反弹（和压缩）持续时间更长。\n\n列表 4.17.为弹簧动画添加另一个压缩和反弹\
  \ (spring.css)\n\n点击此处查看代码图片\n\n```css\n@-webkit-keyframes spring {\n  0% { -webkit-transform:\
  \ scale(1);}\n  30% { -webkit-transform: scale(1, 0.5); }\n  40% { -webkit-transform:\
  \ scale(1, 1.5); }\n  /* 再次压缩 */\n  50% { -webkit-transform: scale(1, 0.7);}\n \
  \ /* 伸展 */\n  61% { -webkit-transform: scale(1, 1.4);}\n}\n```\n\n对于每个随后的反弹，你用一个较小的数字缩放弹簧（但缩放仍仍在原来大小的\
  \ 100% 以上）。在每个随后的压缩中，你用一个稍大的数字放大弹簧（但同样，小于原来大小的 100%）。最后，在 100% 关键帧处，你通过缩放将弹簧恢复到原始大小。列表\
  \ 4.18 显示了完整代码，图 4.4 显示了它的样子。\n\n列表 4.18.弹簧的额外压缩和反弹\n\n点击此处查看代码图片\n\n```css\n@-webkit-keyframes\
  \ spring {\n  0% { -webkit-transform: scale(1);}\n  30% { -webkit-transform: scale(1,\
  \ 0.5); }\n  40% { -webkit-transform: scale(1, 1.5); }\n  /* 再次压缩 */\n  50% { -webkit-transform:\
  \ scale(1, 0.7);}\n  /* 伸展 */\n  61% { -webkit-transform: scale(1, 1.4);}\n  72%\
  \ { -webkit-transform: scale(1, 0.8); }\n  83% { -webkit-transform: scale(1, 1.2);\
  \ }\n  100% { -webkit-transform: scale(1); }\n}\n```\n\n![Image](img/04fig04.jpg)\n\
  \n图 4.4。构成反弹弹簧的完整关键帧集。\n\n\n\n为了让气球以自然的方式向上漂浮，你将对它应用三种不同的变化：直直向上的移动、左右移动以及轻微的往复旋转。你可以将所有这些变化组合为一组关键帧。但将如此多个方面组合在一起是很困难的。为了方便你的工作，你可以将这些动作中的每一个定义为一组独立的关键帧，但将它们全部应用到同一个\
  \ `#container` 元素上。列表 4.21 显示了你需要创建的关键帧：`float-lr`、`float-up` 和 `wobble`。\n\n列表\
  \ 4.21. 设置让气球漂浮的关键帧 (balloon.html)\n\n点击此处查看代码图像\n\n```css\n@-webkit-keyframes float-lr\
  \ {\n  0%, 40%, 80% { left: -100px; }\n  20%, 60%, 100% { left: 100px;}\n}\n\n@-webkit-keyframes\
  \ float-up {\n  0% { top: 200px; }\n  88% { top: 0;}\n  92% { top: 10px;}\n  96%\
  \ { top: 0}\n  98% { top: 5px;}\n  100% { top: 0;}\n}\n\n@-webkit-keyframes wobble\
  \ {\n  0%, 40%, 80% { -webkit-transform: rotate(4deg);}\n  20%, 60% { -webkit-transform:\
  \ rotate(-4deg);}\n  100% { }\n}\n```\n\n`float-lr` 关键帧导致气球在 –100 像素到 100 像素之间往复波动。`float-up`\
  \ 关键帧让气球从距离顶部 200 像素上升到距离顶部 0 像素。然后你还有了一系列距离顶部的微小波动，以营造弹跳效果。气球平滑地上升，直到碰到浏览器顶部，然后在停止下来之前会向下弹跳几次。最后一个关键帧\
  \ `wobble` 让气球轻微往复旋转，以产生运动感。\n\n你可能会好奇为什么修改 `top` 和 `left` 值而不是使用 `translateX` 或\
  \ `translate`。你采用这种方法是因为在单个元素上应用多个动画的技术存在一种困难：只有当每个 `@keyframes` 规则修改不同的属性时它才有效。例如，如果你指定了两个\
  \ `@keyframes` 规则，且它们都修改 `transform` 属性，那么第二组关键帧将覆盖第一组关键帧的 transform。因此，你不能在 `float-lr`\
  \ 和 `float-up` 关键帧中使用相同的 `transform` 属性，即使它们都使用了不同的 transform 函数。为了解决这个问题，你可以简单地修改\
  \ `float-lr` 动画中 `left` 属性的值以及 `float-up` 动画中 `top` 属性的值。在列表 4.22 中，你更新了 `#container`\
  \ 样式以包含你在关键帧中定义的动画。注意，你将 `animation-fill-mode` 设置为 `forwards`，以确保气球的最终状态在动画结束后依然持续。\n\
  \n列表 4.22. 将动画分配给气球\n\n点击此处查看代码图像\n\n```css\n#container {\n  -webkit-animation:\
  \ float-up 10s ease-in-out forwards,\n  float-lr 10s ease-in-out forwards,\n  wobble\
  \ 10s ease-in-out forwards;\n}\n```\n\n你可以在 `http://alexisgo.github.com/LearningCSSAnimations/ch4code/balloon.html`\
  \ 查看此代码的演示。图 4.5 显示了动画进行到一半时的气球。\n\n![图像](img/04fig05.jpg)\n图 4.5. 气球动画 04vid03.mv\
  \ 的帧画面\n\n![04vid03.mv](img/posterimage02.jpg)\n视频 4.5. 漂浮动画\n\n### 为旧版浏览器添加回退消息\n\
  \n不支持关键帧动画的浏览器会直接忽略动画。为了提醒用户他们的旧浏览器（即 Internet Explorer 9 及更早版本）不支持 CSS 动画，你应该添加一个回退消息。在列表\
  \ 4.23 中，你添加了一个 `id` 设置为 `unsupported` 的新 `div` 元素，它在 `h1` 元素中包含一条消息。列表 4.23 中的代码显示了你添加到\
  \ `balloon.html` 文件现有代码中的新代码。\n\n列表 4.23. 为不支持的浏览器添加消息 (balloon.html)\n\n点击此处查看代码图像\n\
