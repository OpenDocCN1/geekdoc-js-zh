  \n### 使用视差制作多个场景动画\n\n与其创建一个单一的重复动画来营造深度感，你可以在多个场景中应用视差滚动技术，以创造更具浸式的体验。为了看到这些核心概念如何一起使用，你将构建一个包含三个场景的示例网站。延续本章建立的机器人主题，你将看到三个机器人穿过几条街道，前景物体经过它们，房间通过窗户显现。本章中所有的机器人都是感谢艺术家\
  \ Tabatha Paterni。\n\n\n\n\n\n```css\nbody {\n  border: 5px solid white;\n  margin:\
  \ 30px auto;\n  position: relative;\n}\n\nnav {\n  width: 400px;\n  height: 40px;\n\
  \  margin: 0 auto 50px;\n  text-align: center;\n}\n\nnav a {\n  background-color:\
  \ white;\n  padding: 5px;\n  -webkit-border-radius: 12px;\n  border-radius: 12px;\n\
  \  -moz-background-clip: padding;\n  -webkit-background-clip: padding-box;\n  background-clip:\
  \ padding-box;\n  color: gray;\n  text-decoration: none;\n  font-weight: bold;\n\
  \  font-size: 1.8em;\n}\n```\n\n接下来，你定义了 `nav` 元素内部链接的样式。这些链接将出现在 `#bgContainer`\
  \ 元素的底部，它们看起来和操作起来就像按钮，允许你点击并播放下一个场景。\n\n在 Listing 5.10 中，你设置了链接的基础，它们都共享类 `.scene`。对这些链接的透明度（opacity）的任何更改都将产生过渡——透明度的变化将在一秒内完成。除了第一个链接（`.one`）之外，所有链接的初始透明度都设置为\
  \ 0。这是因为你希望只有在场景 1 完全完成动画后，才让场景 2 的链接可用。\n\n你还定义了最初隐藏的链接是如何显的：在应用 `visible` 类后，它们的透明度将变为\
  \ `1`。\n\n代码列表 5.10. 场景链接的基础样式 (robotos.css)\n\n点击此处查看代码图像\n\n```css\n.scene {\n\
  \  -webkit-transition: opacity 1s;\n  -moz-transition: opacity 1s;\n  -o-transition:\
  \ opacity 1s;\n  transition: opacity 1s;\n}\n\n.one.invisible {\n  opacity: 0;\n\
  }\n\n/* scene2 和 3 链接初始隐藏 */\n.two, .three {\n  opacity: 0;\n}\n\n.two.visible,\
  \ .three.visible {\n  opacity: 1;\n}\n```\n\n在跳转到设置第一个场景之前的最后一点样式设置中，你设置了 Listing\
  \ 5.11 所示的两个背景元素。它们都具有固定的大小。\n\n代码列表 5.11. 两个背景图片的样式 (robotos.css)\n\n```css\n.bg\
  \ {\n  width: 1000px;\n  height: 400px;\n}\n```\n\n### 场景 1：创建一个滑板机器人\n\n在第一个场景中，前景中有一个踩着滑板的机器人，它正滑过一面涂鸦墙。背景中的这面涂鸦墙滚动得比滑板运动员慢一点。还有一个精灵，一个自行车架，它的移动速度比机器人慢，但比背景快。这些不同的速度让第一个场景看起来具有\
  \ 3D 深度，尽管你实际上在二维空间中工作。\n\n### 场景 1 的背景\n\n在 Listing 5.12 中，你将为第一个背景元素 `#background1`\
  \ 设置 CSS。该图像比容器 `#bgContrainer` 元素大一点，因此你使用 `background-position` 来调整显示图像的哪个部分。你对元素定位，并对\
  \ `background-position` 的任何更改设置了 2.2 秒的过渡，对 `left` 属性的任何更改设置了 1.5 秒的过渡。\n\n代码列表\
  \ 5.12. 场景 1 的背景 (robotos.css)\n\n点击此处查看代码图像\n\n```css\n#background1 {\n  background-image:\
  \ url('../img/SFffiti.jpg');\n  background-position: 0 -200px;\n  position: absolute;\n\
  \  left: 0; /* 在这里设置 left 很重要，否则 Opera\n  不会捕捉到后续 -1000px 的更改\n  也不会应用过渡 */\n  -webkit-transition:\
  \ background-position 2.2s ease-in-out,\n           left 1.5s ease-in-out;\n  -moz-transition:\
  \ background-position 2.2s ease-in-out,\n           left 1.5s ease-in-out;\n  -o-transition:\
  \ background-position 2.2s ease-in-out,\n         left 1.5s ease-in-out;\n  transition:\
  \ background-position 2.2s ease-in-out,\n             left 1.5s ease-in-out;\n}\n\
  ```\n\n#### 场景 1 的精灵\n\n第一个场景包含两个精灵，如图 5.5 所示，其中一个是骑滑板的机器人。另一个是出现在中景的自行车架。这些精灵使用的图像及其尺寸、位置和过渡在\
  \ Listing 5.13 中定义。\n\n![图像](img/05fig05.jpg)\n图 5.5. 视差滚场景 1，带有两个精灵（滑板机器人和自行车架）和滚动背景\n\
  \n![05vid02.m4](img/05vid02.m4)\n视频 5.2. 场景动画\n\n代码列表 5.13. 场景 1 的精灵 (robotos.css)\n\
  \n点击此处查看代码图像\n\n```css\n.robotUnit {\n  position: absolute;\n  left: -300px;\n \
  \ bottom: 10px;\n  -webkit-transition: left 2.7s ease-in-out;\n  -moz-transition:\
  \ left 2.7s ease-in-out;\n  -o-transition: left 2.7s ease-in-out;\n  transition:\
  \ left 2.7s ease-in-out;\n}\n\n#robot1, #skateboard {\n  width: 150px;\n  height:\
  \ 205px;\n  z-index: 2;\n  bottom: 10px;\n  left: 50px;\n  position: absolute;\n\
  \  background-image: url('../img/robot.png');\n}\n\n#skateboard {\n  background-image:\
  \ url('../img/skateboard.png');\n  width: 250px;\n  height: 50px;\n  bottom: 0;\n\
  \  left: 5px;\n}\n\n#bikerack {\n  left: -300px;\n  position: absolute;\n  bottom:\
  \ 10px;\n  -webkit-transition: left 2.5s ease-in-out;\n  -moz-transition: left 2.5s\
  \ ease-in-out;\n  -o-transition: left 2.5s ease-in-out;\n  transition: left 2.5s\
  \ ease-in-out;\n}\n```\n\n#### 场景 1 元素跨屏幕移动\n\n由于你在 `#background1` 上设置了 `.robotUnit`\
  \ 和 `#bikerack` 的过渡，一旦你更改 `left` 属性（背景情况下为 `left` 或 `background-position` 属性），这些元素就会开始动画。在\
  \ Listing 5.14 中，你在应用 `move` 类时更改了这些属性。添加 `move` 类是开始触发 Listing 5.13 中定义过渡的触发器。如\
  \ Listing 5.14 所示移动 `#background1` 元素的 `background-position` 属性，当精灵开始移动时，背景看起来在滚动。\n\
  \n代码列表 5.14. 移动第一个场景 (robotos.css)\n\n```css\n#background1.move {\n  background-position:\
  \ -250px -200px;\n}\n\n.robotUnit.move {\n  left: 600px;\n}\n\n#bikerack.move {\n\
  \  left: 450px;\n}\n```\n\n### 通过 JavaScript 触发过渡\n\n你已经设置了更改 `transition-property`\
  \ 属性的选择器，但还没有将 `move` 类应用于代码。你将使用 jQuery 添加 `move` 类，它在整个示例中作为动画触发器。要查看你为止编写的所有代码列表是如何协同工作的，请浏览\
  \ Listing 5.15，这是该示例的完整 JavaScript 代码。如果觉得内容量太大，不要担心；这只是一个预览。我们将逐部分检查这段代码。\n\n代码列表\
  \ 5.15. 完整的 JavaScript 代码 (robotos.js)\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(function(){\n\
  \  $('#background1, #bgContainer, .one').on('click', function() {\n    $('.robotUnit,\
  \ #bikerack, #background1').addClass('move');\n  });\n  var transEndEventNames =\
  \ {\n    'WebkitTransition' : 'webkitTransitionEnd',\n    'MozTransition'    : 'transitionend',\n\
  \    // per Ian Lunn http://www.ianlunn.co.uk/blog/articles/opera-12-transitionend-bugs-and-workarounds/\n\
  \    // 在 Opera 12 中他们将 oTransitionEnd 的大小写\n    // 变为 otransitionend\n    'OTransition'\
  \    : 'oTransitionEnd otransitionend',\n    'msTransition'    : 'MSTransitionEnd',\n\
  \    'transition'      : 'transitionend'\n  },\n  transEndEventName = transEndEventNames[\
  \ Modernizr.prefixed('transition') ];\n  $('.robotUnit').on(transEndEventName, function()\
  \ {\n    $('.one').addClass(\"invisible\");\n    $('.two').addClass(\"visible\"\
  );\n  });\n  $('.two').on('click', function() {\n    console.log('clicked');\n \
  \   $('#background1').addClass('slideOut');\n  });\n});\n```\n\n\n\n\n\n```javascript\n\
  $('#background2').addClass('slideIn');\n\n$('#cat').addClass('visible');\n\n});\n\
  \n$('#background2').on(transEndEventName, function() {\n  $('.two').removeClass(\"\
  visible\");\n  $('.three').addClass(\"visible\");\n});\n\n$('.three').on('click',\
  \ function() {\n  $('#robot2, #cat, #background2, #inside').addClass('move');\n\
  });\n\n});\n```\n\n### 为场景 1 的元素添加 move 类\n\n在 列表 5.16 中，你将设置一个事件监听器来监听 `#background1`\
  \ 元素、`#bgContainer` 元素或第一个 `a` 元素（`.one`）的点击事件。当这些元素中的任何一个一个被点击时，你将为场景 1 的背景和精灵应用\
  \ `move` 类，这会导致它们的过渡开始，并让它们开始向屏幕右侧移动。\n\n列表 5.16. 点击触发场景 1 的动画 (robotos.js)\n\n\
  点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n  $('#background1, #bgContainer,\
  \ .one').on('click', function() {\n    $('.robotUnit, #bikerack, #background1').addClass('move');\n\
  \  });\n  // 继续见列表 5.17\n});\n```\n\n### 响应过渡结束\n\n你正在创建的动画根据用户点击链接元素在不同场景之间移动。但你并不希望从一开始就让所有链接都可用。你希望只在场景\
  \ 1 完成后才显示场景 2 的链接。为了实现这一点，你需要一种方法，在场景的最后一次过渡结束时接收通知。幸运的是，CSS3 过渡规范 ([`www.w3.org/TR/css3-transitions/#transition-events`](http://www.w3.org/TR/css3-transitions/#transition-events))\
  \ 提供了这种事件：它被称为过渡结束事件（transition end event）。\n\n过渡结束事件存在一个问题：每个浏览器都为该事件定义了自己的名称。列表\
  \ 5.17 显示了一些辅助代码，允许你确定应该监听哪个过渡结束事件名称。此代码利用了 Modernizr 库中一个非常有用的方法 `prefixed()`，以便在代码中定义的数组中查找适当过渡结束事件名称。这段代码取自\
  \ Modernizr  way 文档概述的代码，位于 [`modernizr.com/docs/#prefixed`](http://modernizr.com/docs/#prefixed)。\n\
  \n列表 5.17. 监听第一次过渡的结束 (robotos.js)\n\n点击此处查看代码图片\n\n```javascript\n// 接接自列表 5.16\n\
  var transEndEventNames = {\n  'WebkitTransition' : 'webkitTransitionEnd',\n  'MozTransition'\
  \    : 'transitionend',\n  'OTransition'      : 'oTransitionEnd otransitionend',\n\
  \  'msTransition'     : 'MSTransitionEnd',\n  'transition'       : 'transitionend'\n\
  },\ntransEndEventName = transEndEventNames[ Modernizr.prefixed('transition') ];\n\
  ```\n\n### Modernizr 的 prefixed() 方法\n\n`Modernizr.prefixed()` 允许你将想要使用的 CSS 属性作为参数传递给方法，该方法将输出适当的属性名称。例如，如果用户使用\
  \ Firefox，调用 `Modernizr.prefixed('transition')` 将返回 `MozTransition`。如果用户使用 Safari\
  \ 或 Chrome（这两个浏览器都基于 WebKit 浏览器引擎），调用 `Modernizr.prefixed('transition')` 将返回 `WebkitTransition`。\n\
  \n拥有了表示用户当前浏览器中过渡的正确字符串后，你可以在 列表 5.17 中定义的 `transEndEventNames` 字典中查找过渡结束事件名称。\n\
  \n### Opera 与过渡结束事件\n\n列表 5.17 中有一行与其他略有不同——用于 Opera 前缀的行：\n\n`'OTransition' : 'oTransitionEnd\
  \ otransitionend',`\n\n事实证明，以前 Opera 的过渡结束事件是 `oTransitionEnd`，但从 Opera 12 版本开始，该事件的*大小写*发生了变化，事件变为了\
  \ `otransitionend`。因此，如果你想同时支持旧版本的 Opera 以及 12 及更高版本，你需要同时关注 `oTransitionEnd` 和\
  \ `otransitionend`。要了解更多关于此问题的信息，请参 Ian Lunn 的文章“Opera 12 otransitionend Bugs and\
  \ Workarounds”，位于 [`www.ianlunn.co.uk/blog/articles/opera-12-otransitionend-bugs-and-workarounds/`](http://www.ianlunn.co.uk/blog/articles/opera-12-otransitionend-bugs-and-workarounds/)。\n\
  \n在 列表 5.18 中，你将使用 jQuery 的 `on` 方法监听机器人（`.robotUnit`）上的过渡结束触发。当该机器人的过渡完成时，我们隐藏第一个链接并揭示场景\
  \ 2 的链接。图 6 列表 5.18. 隐藏场景 1 链接并显示场景 2 (robotos.js)\n\n点击此处查看代码图片\n\n```javascript\n\
  // 继续接列表 5.16\nvar transEndEventNames = {\n  'WebkitTransition' : 'webkitTransitionEnd',\n\
  \  'MozTransition'    : 'transitionend',\n  'OTransition'      : 'oTransitionEnd\
  \ otransitionend',\n  'msTransition'     : 'MSTransitionEnd',\n  'transition'  \
  \     : 'transitionend'\n},\ntransEndEventName = transEndEventNames[ Modernizr.prefixed('transition')\
  \ ];\n```\n\n### 场景 2：在场景之间移动\n\n当第一个场景完成后，你需要移出旧背景并移入精灵。这种动作在用户点击 Scene2 链接时开始，在\
  \ 列表 5.8 中带有 `two` 类。\n\n### 场景 2 的 HTML 和 CSS\n\n在场景 2 的 CSS 中，你首先定义了不再需要的第一个背景。在\
  \ `background1.slideOut` 选择器中，你将第一个背景设置隐藏。接下来，你把注意力放在 `background2` 元素列表 5.19 中定义。`background2`\
  \ 初始位于屏幕外，`left:1000px`。`background2` 也对 `left` 和 `background-position` 属性定义了过渡。\n\
  \n列表 5.19. 场景 2 的样式 (robotos.css)\n\n点击此处查看代码图片\n\n```css\n#background1.slideOut\
  \ {\n  left: -1000px;\n}\n#background2 {\n  background-image: url('../img/outsideWindow.png');\n\
