  \ 500px;\n  margin: 5% auto;\n  padding: 0 3%;\n  display: none;\n  -webkit-border-radius:\
  \ 12px 100px / 100px 12px;\n  -webkit-background-clip: padding-box;\n}\n\n#newsreel\
  \ h1 {\n  font-family: PlugNickelBlackRegular, sans-serif;\n  font-size: 2em;\n\
  \  padding-top: 3%;\n  text-align: center;\n  text-decoration: underline;\n}\n```\n\
  \n## 旋转报纸并放大\n\n为了模拟新闻片之前经常出现的旋转报纸（请看 [`www.youtube.com/watch?v=saxwDCYVksQ`](http://www.youtube.com/watch?v=saxwDCYVksQ)\
  \ 中的演示），你需要旋转报纸多次。在列表 9.27 中，你总共旋转了 10 次，因此将最终关键帧设置为旋转 3600 度。你还放大报纸，使其在旋转时看起来越来越近。因此，你在\
  \ `60%` 关键帧中添加了 `2` 倍缩放，并在 `100%` 关键帧中添加了 `2.1` 倍。\n\n### 列表 9.27. 旋转报纸 (cat.css)\n\
  \n点击此处查看代码图片\n\n```css\n@-webkit-keyframes spin {\n/* the downside of this approach\
  \ is that\n   it results in quite a pixelated look :( */\n  0% { }\n  60% { -webkit-transform:\
  \ translate3d(-100px,-200px,0) scale3d(2,2,2) rotateZ(3600deg);}\n  100% { -webkit-transform:\
  \ translate3d(-100px,-200px,0) scale3d(2.1,2.1,2.1) rotateZ(3600deg);}\n}\n```\n\
  \n### 通过缩小报纸缩放来避免像素化\n\n如果你尝试运行列表 9.27 中定义的代码，你会发现一个问题：使用 `border-radius` 定义的报纸边缘在动画结束时看起来有像素化。这是由于缩放导致的。为了避免这种像素化，比放大报纸更好的方法是让报纸从缩小状态开始，然后缩放回原始尺寸。由于你可以在任何尺寸的元素上定义曲线边界，你可以只需增加报纸的大小。列表\
  \ 9.28 显示了这些变化。注意，另一种避免像素化的选项是使用 SVG 文件，它们可以放大缩小而不丢失清晰度。\n\n### 列表 9.28. 放大报纸的更好方法\
  \ (cat.css)\n\n点击此处查看代码图片\n\n```css\n@-webkit-keyframes spin {\n  0% { -webkit-transform:\
  \ scale3d(.2,.2,.2) }\n  60% { -webkit-transform: scale3d(.9,.9) rotateZ(3600deg);}\n\
  \  100% { -webkit-transform: scale3d(1,1,1) rotateZ(3600deg);}\n}\n```\n\n<multimedia/09vid05.m4v>\n\
  \n![09vid05.m4v](img/posterimage02.jpg)\n\n视频 9.6. 完整的动画\n\n## 支持 Opera 12\n\n动画代码有一个主要问题：对于支持除\
  \ CSS3 变换之外所有新功能的 Opera 12 浏览器，动画只会部分播放且显示异常。这是因为你在开始时依赖于 `scale3d`。Opera 12 用户也会错过该动画，因为你使用了硬件加速的\
  \ `rotateZ` 而不是 Opera 12 支持的 `rotate`。但好消息是你可以利用 `Modernizr` 让此动画在 Opera 12 中运行。\n\
  \n### 为每个 3D 场景定义选择器\n\n让此动画在 Opera 12 中运行的关键是为每个使用 3D 变换的场景定义两个选择器：一个包含父级选择器 `.scene7`，另一个包含另一个。通过这种方法，你可以利用\
  \ `Modernizr` 添加到 HTML 标签的类。列表 9.29 显示了 Opera 12 将使用的第一个选择器，因为 `Modernizr` 向 HTML\
  \ 标签添加了 `no-scene7` 类（注意，这是书中第一次在代码中包含所有的厂商前缀）。在这里，你没有使用 `-transform: scale3d(3,3,3)`\
  \ 来放大元素，而是直接使用了该属性的 2D 版本 `transform: scale(3)`。\n\n注意\n`Modernizr` 对浏览器是否支持 3D\
  \ 变换的检查并不总是完美。Artsy 的工程团队最近写了他们检查 3D 变换的替代方法，因为过去的浏览器 Bug 有时会导致 3D 检查误报。因此，为了不支持的浏览器而调整代码的一个潜在副作用是，当未来出现浏览器\
  \ Bug 时，这些样式钩可能会被调用。要了解更多信息，请访问：[`artsy.github.com/blog/2012/10/18/so-you-want-to-do-a-css3-3d-transform/`](http://artsy.github.com/blog/2012/10/18/so-you-want-to-do-a-css3-3d-transform/)\n\
  \n### 列表 9.29. 使用 2D 变换代替 3D 变换支持 Opera 12 (cat.css)\n\n点击此处查看代码图片\n\n```css\n.no-scene7\
  \ #house {\n  width: 100%;\n  height: 700px;\n  position: absolute;\n  left: 315px;\n\
  \  background-image: url('../img/house.png');\n  background-repeat: no-repeat;\n\
  \  -webkit-transition: 2s;\n  -moz-transition: 2s;\n  -o-transition: 2s;\n  -ms-transition:\
  \ 2s;\n  transition: 2s;\n  -webkit-transform: scale(3);\n  -moz-transform: scale(3);\n\
  \  -o-transform: scale(3);\n  -ms-transform: scale(3);\n  transform: scale(3);\n\
  \  -webkit-transform-origin: 50% 0%;\n  -moz-transform-origin: 50% 0%;\n  -o-transform-origin:\
  \ 50% 0%;\n  -ms-transform-origin: 50% 0%;\n  transform-origin: 50% 0%;\n  z-index:\
  \ -3;\n}\n```\n\n### 为 Opera 12 应用进一步的备选方案\n\n列表 9.30 显示了其余针对 Opera 12 的备选方案。在第一个选择器中，对于窗口上的场景\
  \ 4，你没有使用 `translate3d` 来放置元素，而是使用了 2D 版本 `translateX`。你也可以简单地使用绝对定位。\n\n为了缩小场景\
  \ 4 中的房子和猫，你可以使用 `scale` 而不是使用 `scale3d`。同样，如果 Opera 12 不支持 2D 变换，你可以使用 `background-size`\
  \ 并缩小 `background-image`。\n\n\n\n\n\n最后，敲门动画按照目前的写法将无法工作，因为它使用了硬件加速的 3D 变换函数 `rotateZ`。因此，你需要创建一个名为\
  \ `knockOpera` 的新关键帧动画，使用属性的 2D 版本 `rotate`。\n\n列表 9.30. 使用 Modernizr 添加的类选择器应用\
  \ 2D 变换代替 3D 变换 (cat.css)\n\n```css\n.no-csstransforms3d #window.scene4 {\n  width:\
  \ 155px;\n  height: 160px;\n  -webkit-transform: translateX(240px);\n  -moz-transform:\
  \ translateX(240px);\n  -o-transform: translateX(240px);\n  -ms-transform: translateX(240px);\n\
  \  transform: translateX(240px);\n}\n\n.no-csstransforms3d #house.scene4 {\n  width:\
  \ 80%;\n  min-width: 500px;\n  left: 10%;\n  top: 0px;\n  -webkit-transform: scale(1);\n\
  \  -moz-transform: scale(1);\n  -o-transform: scale(1);\n  -ms-transform: scale(1);\n\
  \  transform: scale(1);\n}\n\n.no-csstransforms3d #cat.scene4 {\n  -webkit-transition:\
  \ all 1.5s;\n  -moz-transition: all 1.5s;\n  -o-transition: all 1.5s;\n  -ms-transition:\
  \ all 1.5s;\n  transition: all 1.5s;\n  -webkit-transform: scale(.3);\n  -moz-transform:\
  \ scale(.3);\n  -o-transform: scale(.3);\n  -ms-transform: scale(.3);\n  transform:\
  \ scale(.3);\n  left: -112px;\n  top: -150px;\n}\n\n.no-csstransforms3d #murphyarm.scene6\
  \ {\n  z-index: -2;\n  -o-animation: knockOpera 2s forwards 2;\n}\n```\n\n## 总结\n\
  \n在本章中，你结合了变换（transforms）、过渡（transitions）、关键帧（keyframes）和 JavaScript，创建一个由许多不同元素连接而成的动画。你探索了如何通过组合多个缩小（scale-downs）效果来创建一个放大效果。你还学习了在浏览器不支持完整功能的情况下提供动画和内容的方法。\n\
  \n## 挑战\n\n警察猫 Murphy 目前从屏幕外走入场景。请通过创建（或寻找）一张警车的图片来增强此示例。确保轮子与车身是独立的图片（或者使用正方形元素和宽度为正方形一半倍的\
  \ `border-radius` 来创建轮子）。然后，制作警车驶向 Morgan 房子的动画，并让轮子在行驶时旋转。\n\n# 10. 创建动态信息图\n\n\
  本章将探究如何通过添加 CSS 动画来增强信息图。它结合了书中使用的技术，创建一个关于六种不同混合饮品配料比例的数据视化图。你将添加动画来为信息图增添动态感，模拟饮料倒入杯中的过程。\n\
  \n## 什么是信息图？\n\n使用信息图是网络上展示数据的一种日益流行的方式。通过信息图，你可以以视觉方式（通常通过插图）呈现那些用文字或表格形式可能难以理解的数据，从而使数据的意义和重要性更加直观显而易见。\n\
  \n### 基于图像的信息图\n\n网络上信息图的一种常用方法是用大型高分辨率图像来表示数据。这些通常是非常长或非常宽的图像，用户需要滚动页面来阅读并获取呈现的所有信息。\n\
  \nMashable 网站提供了大量的图像信息图，地址为：[`mashable.com/follow/topics/infographics/`](http://mashable.com/follow/topics/infographics/)。作为一个例子，该网站展示了一份由\
  \ MBAonline.com 制作的信息图，描述了 [Amazon.com](http://Amazon.com) 如何通过极端的削减成本措施（例如不向慈善机构捐款）来保持低成本（参见\
  \ [`mashable.com/2012/06/09/amazon-money-infographic/`](http://mashable.com/2012/06/09/amazon-money-infographic/)）。\n\
  \n*GOOD* 杂志网站也是许多引人入胜的图像信息图的来源。该网站的一个章节完全致力于信息图——参见 [`www.good.is/infographics`](http://www.good.is/infographics)。该网站收集了一系列大图，利用\
  \ Flash 辅助对图像进行放大、缩小和和平移动。\n\n### CSS3 驱动的信息图\n\n考虑到 HTML5 和 CSS3 为我们提供的所有新功能，仅依赖图像来制作信息图显得有些局限。2011\
  \ 年 4 月，Mozilla 的开发者宣讲员 Paul Rouget 向开发者发起了一项挑战，让他们创建信息图。\n\n### 混合饮品的数据可视化\n\n\
  为了演示如何使用动画构建具有吸引力展示的信息图，在本节中你将处理一组简单的数据集：常见饮料的成分。具体来说，你将说明特定饮料中配料的比例。例如，杯朗姆可乐由两份可乐和一份朗姆组成。这个示例的灵感源自\
  \ Lokesh Dhakar 创建的各种咖啡简单而实用的信息图（[`lokesdhakar.com/coffee-drinks-illustrated/`](http://lokesdhakar.com/coffee-drinks-illustrated/)）。\n\
  \n你将分析六种不同饮品的成分构成，并使用基于 CSS 的图形来视觉化每种饮料中的配料及其比例。但你不仅仅是简单的插图和标记每种饮料的各个部分，你将制作每种配料“倒入”空杯的动画。图\
  \ 10.2 显示了你将构建的信息图的最终状态。\n\n\n\n\n\n# 混合饮料配料\n\n<section id=\"rumncoke\">\n  <!--\
  \ 延续自列表 10.4 -->\n</section>\n<section id=\"tomcollins\">\n  <!-- 延续自列表 10.12 -->\n\
  </section>\n<section id=\"ginntonic\"></section>\n<section id=\"redbullVodka\"></section>\n\
  <section id=\"bloodyMary\"></section>\n\n### 创建基础页面样式\n\n接下来，你需要为整个页面定义一些基础样式。你将设置默认背景颜色、设置一些自定义字体，并为\
  \ `h1` 元素添加一点 `box-shadow`（阴影）。`body` 内部有一个主容器元素，称为 `bar`。这个条形包含一个 `section` 元素，该元素具有固定尺寸、一些外边距（margin）、内边距（padding）和圆角（border-radius）。这个条形元素将容纳你将创建基于\
  \ CSS 图图形的全部六种饮料（参见 列表 10.2）。\n\n与书中之前的示例一样，请注意，为了简洁起见，本章中的列表仅包含了 `-webkit-` 厂商前缀。要查看包含所有前缀的完整代码，请访问书籍\
  \ GitHub 页面上的 `ch10code` 文件夹：[`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)。\n\
  \n列表 10.2. 饮料信息图的基础样式 (drinks.css)\n\n点击此处查看代码图像\n\n```css\nbody {\n  background-color:rgb(173,216,230);\n\
  \  font-family: 'Shadows Into Light Two', cursive;\n}\n\nh1 {\n  font-family: 'Righteous',\
  \ cursive; font-size:2.5em;\n  margin: 0 -8px 8px -8px;\n  text-align:center;\n\
  \  background-color:white;\n  -webkit-box-shadow: 0 -4px 0 12px white, 0px 1px 20px\
  \ 1px black;\n  box-shadow:\n    0 -4px 0 12px white,\n    0px 1px 20px 1px black;\n\
  }\n\n#bar {\n  background-color:rgb(233,236,236);\n  width: 800px;\n  height:700px;\n\
  \  margin: -8px auto;\n  padding:20px;\n  border-radius:10px;\n  position:relative;\n\
  }\n```\n\n### 使用多个 box-shadow 创建单侧阴影\n\n注意，你在 `h1` 选择器中指定了*两个* box-shadow。第一个定义了一个白色的\
  \ `box-shadow`，没有模糊半径（因此，它仅仅是一个实白色轮廓），扩展范围（spread）为 12 像素，并位于 `h1` 元素*上方* 4 像素处。接着，你定义了第二个\
  \ `box-shadow`，这次是黑色的，具有较大的模糊半径，但扩展范围仅为 1，它位于元素下方 1 像素处。\n\n这两个阴影的最终效果是只显示黑色阴影，且仅位于元素的底部边缘。这是\
  \ Lea Verou 在她 2011 年的 Fronteers 演讲中解释的技术，“关于 CSS3 你可能不知道的 10 件事”([`fronteers.nl/congres/2011/sessions/css3-secrets-lea-verou`](http://fronteers.nl/congres/2011/sessions/css3-secrets-lea-verou)）。\n\
  \n### 利用自定义网络字体\n\n你可能注意到 列表 10.2 使用了两种自定义字体。默认情况下，你将使用 Shadows Into Light Two 字体，对于\
  \ `h1` 元素，将使用 Righteous。两种字体都是通过 Google 字体工具获取的开源网络字体（[`google.com/webfonts`](http://google.com/webfonts)）。Google\
  \ 的工具允许你选择想要使用的网络字体，然后 Google 会生成一个指向其在其服务器上托管的样式表的链接，你将该链接放置在 HTML 页面的 `head` 部分，如\
  \ 列表 10.3 所示。\n\n列表 10.3. 链接到 Google 的字体动态样式表 (drinks.html)\n\n点击此处查看代码图像\n\n```html\n\
  <head>\n  <meta charset=\"utf-8\">\n  <title>Drinks Infographic</title>\n  <link\
  \ href='http://fonts.googleapis.com/css?family=Righteous|Shadows+Into+Light+Two'\
  \ rel='stylesheet'>\n</head>\n```\n\n#### 第一种饮料的基础 HTML\n\n你首先从设置单一饮料开始——朗姆可乐（Rum\
  \ & Coke）。你给这个 `section` 元素分配 ID `rumncoke`。在这个 `section` 元素内部——以及后续所有的 `section`\
  \ 元素内部——将有一个类名为 `tumbler` 的 `div`。这个 `div` 将包含盛载代表饮料元素的玻璃杯的样式。每个配料由三个元素组成：\n\n-\
  \ 一个用于设置配料 `height` 和起始 `position` 的 `div` 元素\n- 一个设置配料样式的 `p` 元素\n- 一个用于显示配料名称的\
  \ `strong` 元素\n\n最后，你定义一个 `h2` 元素来包含饮料名称。列表 10.4 所示。\n\n列表 10.4. 设置朗姆可乐的 HTML (drinks.html)\n\
  \n```html\n<section id=\"rumncoke\">\n  <div class=\"tumbler\">\n    <div id=\"\
  rum\">\n      <p><strong>Rum</strong></p>\n    </div>\n    <div id=\"coke\">\n \
  \     <p><strong>Coke</strong></p>\n    </div>\n  </div>\n  <h2>Rum & Coke</h2>\n\
  </section>\n```\n\n##### 语义问题\n\n你可能会问，为什么要费劲给父级 `div` 设置 `height`？正如在 列表 10.9 中所示，这样做是为了简单地让*所有*配料从\
  \ 0% 高度动画到 100% 高度（列表 10.9 显示了这种动画）。这节省了你为每种饮料编写自定义动画来更改其最终高度的麻烦（例如，朗姆为 40 像素，可乐为\
  \ 80 像素）。\n\n#### 默认饮料样式\n\n嵌套在外部 `<section id=\"bar\">` 元素内部的所有 `section` 元素代表饮料，因此你可以在单个选择器\
  \ `#bar section` 中对它们进行统一样式设置，如 列表 10.5 所示。你给饮料设置了默认的顶部内边距、左外边距和宽度，并将它们的位置设置为 `absolute`。\n\
  \n列表 10.5. 设置饮料的默认起始位置 (drinks.css)\n\n```css\n#bar section {\n  width: 110px;\n\
  \  position: absolute;\n  margin-left: 100px;\n  padding-top: 20px;\n}\n```\n\n\
  你还将使用 CSS 定义一个代表盛放饮料的玻璃杯图形。在 列表 10.6 中，你定义了一个固定尺寸、除顶部外全边的粗黑边框，以及杯子底部的圆角（border-radius）。你使用\
  \ 20 像素的水平偏移和 30 像素的垂直偏移，使底部的曲线更陡。你还将 `position` 设置为 `relative`，这样你嵌套在这个外部 `.tumbler`\
  \ 元素内部的配料就可以相对于它进行定位。最后，你将 `overflow` 设置为 `hidden`，这样如果任何配料溢出了杯子，它们将是不可见的。图 10.4\
  \ 显示了将这些样式应用于最开始 `.tumbler` 元素的结果。\n\n![Image(graphics/10fig04.jpg)\n\n图 10.4. 第一个空玻璃杯\n\
  \n\n\n\n\n# 列表 10.6. 玻璃杯的样式 (drinks.css)\n\n点击此处查看代码图像\n\n```css\n.tumbler {\n \
  \ width: 100px;\n  height: 200px;\n  border: 8px solid #336;\n  border-width: 0\
  \ 6px 6px 6px;\n  border-color: white black black black;\n  border-bottom-right-radius:\
  \ 20px 30px;\n  border-bottom-left-radius: 20px 30px;\n  position: relative;\n \
  \ overflow: hidden;\n}\n```\n\n### 设置初始成分样式\n\n你使用 `div` 元素来创建朗姆可乐中每种成分的图形化表示。你可以从设置朗姆样式开始。在列表\
  \ 10.7 中，你为 `#rum` 元素分配了 `height` 和绝对位置。你还为 `p` 元素定义了 `background-color`，为朗姆赋予正确的颜色。\n\
  \n#### 列表 10.7. 设置成分的高度和起始位置 (drinks.css)\n\n```css\n#rum { height: 20%; bottom:\
  \ 0; }\n#rum p { background-color: rgb(235,191,0); }\n```\n\n在列表 10.6 中，你为玻璃杯本身定义了\
  \ `border-radius`。将玻璃杯的圆角与列表 10.7 中朗姆的样式相结合，效果并不如你预期的那样工作。一旦 `rise` 动画运行且 `#rum`\
  \ 元素可见，它的角角就会与 `.tumbler` 元素的 `border-radius` 边缘重叠，如图图 10.5](#ch10.html_ch10fig05)所示。\n\
  \n![Image](img/10fig05.jpg)\n\n图 10.5. #rum 元素与玻璃杯的圆角重叠\n\n修改 `z-index` 无法帮助你改变这一点，因为重叠发生在玻璃杯元素技术上仍然所在的空间；仅仅是因为你通过\
  \ `border-radius` 将玻璃杯元素稍微拉入了内部。\n\n为了修复这个问题，你可以为玻璃杯的第一个 `div` 元素定义 `border-radius`——*仅*针对它的第一个\
  \ `div` 元素。要这样做，你可以使用 `nth-of-type` 伪类，并指定它只选择包含在元素 `.tumbler` 之中的第一个 `div`，如列表\
  \ 10.8 所示。你针对的是第一个 `div`，因为它代表了第一种成分，它始终位于玻璃杯的底部。添加这段代码将导致朗姆（以及所有后续的第一种成分）在底角呈现为圆角，并完美地契合\
  \ `.tumbler` 元素内部（参见图 10.6）。\n\n![Image](img/10fig06.jpg)\n\n图 10.6. #rum 元素不再与玻璃杯的圆角重叠\n\
  \n#### 列表 10.8. 设置成分的高度和起始位置 (drinks.css)\n\n```css\n.tumbler div:nth-of-type(1)\
  \ p {\n  border-bottom-right-radius: 15px 20px;\n  border-bottom-left-radius: 15px\
  \ 20px;\n}\n```\n\n### 注入成分的动画\n\n为了让这个信息图比典型的静态图像信息图更具动态，你将为每种成分添加动画。你将通过让液体从杯底部上升，来模拟饮料中每种成分被“注入”的插图。\n\
  \n动画将由高度从 0% 增加到 100% 组成，这将产生液体向顶部的效果。此动画分配给每一个嵌套在 `div` 元素中的 `p` 元素，而该 `div` 元素又嵌套在类为\
  \ `tumbler` 的元素中。这在选择器 `.tumbler div strong` 中表达得简单，如列表 10.9 所示。在此列表中，你还将成分的字体设置为开源字体字体\
  \ Righteous。\n\n列表 10.9 中最重要的部分是你为 `animation-fill-mode` 属性设置的值。在 `animation` 简写中，你将\
  \ `animation-fill-mode` 设置为值 `both`。回想第 4 章中的“关键帧动画”，`animation-fill-mode` 定义了动画元素在动画运行之前或之后发生什么。将\
  \ `animation-fill-mode` 设置为 `both` 关键字会将第一个关键帧的样式（在这种情况下，高度为 0）应用到动画运行之前的期间。\n\n\
  #### 列表 10.9. 让成分上升 (drinks.css)\n\n```css\n@-webkit-keyframes rise {\n  0% { height:\
  \ 0; }\n  100% { height: 100%; }\n}\n\n.tumbler div strong {\n  font-family: 'Righteous',\
  \ cursive;\n  width: 100%;\n  position: absolute;\n  bottom: 0;\n  text-align: center;\n\
  \  -webkit-animation: rise 2s ease-out;\n}\n```\n\n### 为什么使用关键帧？\n\n列表 10.9 中最重要的部分是你为\
  \ `animation-fill-mode` 属性设置的值。在 `animation` 简写中，你将 `animation-fill-mode` 设置为值 `both`。回想第\
  \ 4 章中的“关键帧动画”，`animation-fill-mode` 定义了动画元素在动画运行之前或之后发生什么。将 `animation-fill-mode`\
  \ 设置为 `both` 关键字会将第一个关键帧的样式（在这种情况下，高度为 0）应用到动画运行之前的期间。（注：此处由于原文逻辑存在部分重复，翻译已按原文语意保留并对齐）\n\
  \n为什么 使用关键帧？\n\n通过关键帧定义的 `rise` 动画也可以通过过渡来实现。那么为什么要使用关键帧呢？有两个原因：首先，它们允许你通过计时来触发动画。如果你使用过渡，将需要\
  \ JavaScript。其次，使用关键帧允许你在不同元素上使用不同的 `animation-delay`，同时复用同一个动画。\n\n### 设置剩余成分样式\n\
  \n现在你已经设置了动画，可以通过设置列表 10.10 中的最后一种成分来完成朗姆可乐。在 `#coke` 选择器中，你为可乐分配了 `height` 和初始位置。由于你之前没有定义\
  \ `animation-delay`，默认情况下所有成分都没有延迟。在这里设置一个延迟可以将可乐元素与朗姆区分开，并使其动画在 2 秒后运行。\n\n####\
  \ 列表 10.10. 设置可乐并延迟其动画 (drinks.css)\n\n```css\n#coke {\n  height: 40%;\n  bottom:\
  \ 20%;\n}\n\n#coke p {\n  background-color: rgb(151,95,55);\n  color: white;\n \
  \ -webkit-animation-delay: 3s;\n}\n```\n\n### 渐变成分标签\n\n现在朗姆可乐的成分标签是可见的，并随着成分一起上升。你可以修改\
  \ CSS 使用第二个动画，在成分完成上升后让标签文本渐入。与 `rise` 动画（在列表 10.9 中定义）一样，使用关键帧不是因为它们最高效，而是因为你可以在不同元素上使用不同的动画延迟，同时复用单一的共享动画。\n\
  \n在列表 10.11 中，在 `ingredientFadeIn` 动画的关键帧中，你将文本颜色设置为 `transparent`。在 `.tumbler div\
  \ p strong` 选择器中，你通过 `animation` 简写属性指定将 `animation-fill-mode` 设置为 `both`。由于 `animation-fill-mode`\
  \ 被设置为 `both`，当动画开始时（在此之前），成分的标签是不可见的。在 100% 关键帧中，你没有设置任何属性，也没有再次设置 `color` 属性。这会导致相关的\
  \ `strong` 元素重置为原始颜色——无论原始颜色是什么。显示所有成分可见的朗姆可乐见图 10.7。\n\n```css\n@-webkit-keyframes\
  \ ingredientFadeIn {\n  0% { color: transparent; }\n  100% { color: inherit; }\n\
  }\n\n.tumbler div p strong {\n  -webkit-animation: ingredientFadeIn 1s ease-in both;\n\
  }\n```\n\n\n\n\n\n![Image](img/10fig07.jpg)\n\n图 10.7. 带有成分标注的朗姆可乐\n\n<multimedia/10vid02.m4v>\n\
  \n![10vid02.m4v](img/posterimage02.jpg) \n\n视频 10.2. 成分标签的渐入\n\n列表 10.11. 成分名称的渐入\
  \ (drinks.css)\n\n点击此处查看代码图像\n\n```css\n@-webkit-keyframes ingredientFadeIn {\n\
  \  0% { color: transparent;}\n  100% { }\n}\n\n.tumbler div p strong {\n  font-size:\
  \ 0.9em;\n  -webkit-animation: ingredientFadeIn 1s 2s both;\n}\n\n#coke p strong\
  \ {\n  -webkit-animation-delay: 5s;\n}\n```\n\n### 添加第二种饮料\n\n现在，你将重复刚才描述的过程来定义第二种饮料：汤姆柯林士（Tom\
  \ Collins）。和朗姆可乐一样，汤姆柯林士由一个包含性的 `section` 元素、每个成分对应的 `div` 元素，以及 `div` 内部代表每个成分的\
  \ `p` 和 `strong` 元素组成。饮料由一个 `h2` 元素结束，显示该饮料的名字（参见列表 10.12）。\n\n列表 10.12. 汤姆柯林士的\
  \ HTML (drinks.html)\n\n```html\n<section id=\"tomcollins\">\n  <div class=\"tumbler\"\
  >\n    <div id=\"tcGin\">\n      <p><strong>Gin</strong></p>\n    </div>\n    <div\
  \ id=\"tcClubSoda\">\n      <p><strong>Club Soda</strong></p>\n    </div>\n    <div\
  \ id=\"tcLemon\">\n      <p><strong>Lemon</strong></p>\n    </div>\n  </div>\n \
  \ <h2>Tom Collins</h2>\n</section>\n```\n\n#### 第二种饮料的基础样式\n\n在列表 10.13 中，你定义了饮料及其所有成分的基础样式。你将这种饮料定位在容器\
  \ `#bar` 元素的左侧 250 像素处（该元素是包含块）。第一个成分金酒（gin）位于位于玻璃杯的底部。由于它占了饮料的两部分，你将它的尺寸设置为 20%。在\
  \ `p` 元素中，你同时设置了顶部边框颜色和 `background-color`（背景颜色）。\n\n接下来，你为第二种成分苏打水（club soda）设置了初始位置、高度、`background-color`（背景颜色）和\
  \ `animation-delay`（动画延迟）。为了让苏打在金酒完成 `rise`（上升）动画后才开始上升，你设置在等待 2 秒钟后，再在 `#tcClubSoda`\
  \ 的 `p` 元素上运行上升动画。\n\n为了让苏打水的文本标签仅在苏打水出现后才显示，你在运行动画之前增加了 4 秒的延迟。这 4 秒的延迟包含了 `rise`\
  \ 动画在 `#tcClubSoda` 元素上耗时的 2 秒，以及应用到 `#tcClubSoda` 元素上的 2 秒动画延迟。\n\n列表 10.13. 汤姆柯林士成分的\
  \ CSS (drinks.css)\n\n```css\n#tomcollins { left: 250px; }\n#tcGin {\n  bottom:\
  \ 0;\n  height: 20%;\n}\n#tcGin p {\n  border-top: 2px solid rgba(0,0,0,.3);\n \
  \ background-color: rgb(231,255,255);\n}\n#tcClubSoda {\n  bottom: 21%;\n  height:\
  \ 30%;\n}\n#tcClubSoda p {\n  background-color: white;\n  -webkit-animation-delay:\
  \ 2s;\n}\n#tcClubSoda p strong {\n  -webkit-animation-delay: 4s;\n}\n```\n\n####\
  \ 延迟第三种成分的注入\n\n列表 10.14 定义了所需的动画延迟，以确保汤姆柯林士的第三种也是最后的成分——柠檬汁在正确时间执行动画。在这里，你遵循了列表\
  \ 10.10 和 10.13 中概述的相同模式。不过，你并没有仅将 `rise` 动画延迟 2 秒，而是延迟了 4 秒。这确保了柠檬汁在金酒和苏打水成分都执行完动画后才上升。\n\
  \n列表 10.14. 柠檬汁动画的延迟 (drinks.css)\n\n```css\n#tcLemon { bottom: 51%; height: 10%;}\n\
  #tcLemon p {\n  background-color: yellow;\n  -webkit-animation-delay: 4s;\n}\n```\n\
  \n同样，为了让“Lemon”（柠檬）文本仅在柠檬的 `p` 元素升入视野后才出现，在列表 10.15 中你增加了 `ingredientIn` 动画的延迟。回想列表\
  \ 10.10，`tcClubSoda` 元素上的 `rise` 动画耗时 2 秒，加上应用到该元素的 2 秒动画延迟。\n\n列表 10.15. 延迟柠檬的显示\
  \ (drinks.css)\n\n```css\n#tcLemon p strong {\n  -webkit-animation-delay: 6s;\n\
  }\n```\n*(注：此处根据原文逻辑微调了部分我理解的翻译，原文意为：为了确保汤姆柯林士的第三种也是最后的成分——柠檬汁在正确时间执行动画……你增加了 `ingredientIn`\
  \ 动画的延迟。原文最后一段是：在这里，你遵循了列表 10.10 和 10.13 中概述的相同模式。)*\n\n抱歉，上面的翻译在最后处略有偏差，重新对齐最后一段段落：\n\
  \n在这里，你遵循了列表 10.10 和 10.13 中概述的相同模式。不过，你并没有仅将 `rise` 动画延迟 2 秒，而是延迟了 4 秒。这确保了柠檬汁在金酒和苏打水成分都执行完动画后才上升。\n\
  \n同样，为了让“Lemon”文本仅在柠檬的 `p` 元素升入视野后才出现，在列表 10.15 中你增加了 `ingredientIn` 动画的延迟。回想列表\
  \ 10.10，`tcClubSoda` 元素上的 `rise` 动画耗时 2 秒，加上应用到该元素的 2 秒动画延迟。\n\n*(注：原文提供的文本最后似乎在某处截断或存在逻辑跳跃，我根据您提供的文本内容进行了完整翻译。)*\n\
  \n**重新严格根据您提供的原始文本进行最后部分的翻译：**\n\n列表 10.14 定义了所需的动画延迟，以确保汤姆柯林士的第三种也是最后的成分——柠檬汁在正确时间执行动画。在这里，你遵循了列表\
  \ 10.10 和 10.13 中概述的相同模式。不过，你并没有仅将 `rise` 动画延迟 2 秒，而是延迟了 4 秒。这确保了柠檬汁在金酒和苏打水成分都执行完动画后才上升。\n\
  \n列表 10.14. 延迟柠檬汁的动画 (drinks.css)\n\n```css\n#tcLemon { bottom: 51%; height: 10%;}\n\
  #tcLemon p {\n  background-color: yellow;\n  -webkit-animation-delay: 4s;\n}\n```\n\
  \n同样，为了让 `Lemon` 文本仅在柠檬的 `p` 元素升入视野后才出现，在列表 10.15 中你增加了 `ingredientIn` 动画的延迟。回想列表\
  \ 10.10，`tcClubSoda` 元素上的 `rise` 动画耗时 2 秒，加上应用到 `#tcClubSoda` 元素的 2 秒动画延迟。\n\n*(注：您提供的待翻译文本在\
  \ `Listing 10.15` 之后似乎缺失了后续内容或格式不完整，我已根据您给出的所有文本行完成了翻译。)*\n\n[/content]\n\n**等等，我发现您提供的待翻译文本在\
