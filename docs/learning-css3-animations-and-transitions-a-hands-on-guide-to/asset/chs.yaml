  \nListing 9.5. Morgan 窗口的样式 (cat.html)\n\n点击此处查看代码图像\n\n* * *\n\n```\n#window {\n\
  \  width: 550px;\n  height: 564px;\n  position: absolute;\n  top: 30px;\n  left:\
  \ 220px;\n  overflow: hidden;\n  z-index: -1;\n  -webkit-transition: all 1.5s;\n\
  \  border: 2px solid black;\n  border-radius: 15px;\n  background: rgb(253,255,255);\n\
  \  background: rgb(253,255,255),\n  -webkit-radial-gradient(center, circle,\n  \
  \  rgba(253,255,255, 0) 70%,\n    rgba(255,255,255, 0.9)),\n  -webkit-linear-gradient(150px\
  \ 0px, rgba(0, 0, 0, 0.15), transparent);\n}\n```\n\n* * *\n\n#### 使用 JavaScript\
  \ 错开动画场景\n\n该动画中有许多不同的场景，你需要相应地安排每个场景的开始和结束时间，以便它们流畅运行。为了设置这种时间安排，你有一个选择。你可以利用 `animation-delay`\
  \ 属性——正如你在第 8 章中在许多地方做的那样——并触发所有动画，但让每个延迟适当的时间。或者你可以将你的 CSS3 动画和过渡与 JavaScript 结合，使用\
  \ JavaScript 和 CSS 类组合来触发动画的开始时间。你将在剩余的场景中采用这种方法。\n\n\n\n\n你在这里采用的方法需要两个部分：首先，你需要创建一个\
  \ CSS 类选择器，该选择器在待动画的元素上持有动画的定义。其次，你使用 JavaScript 的 `setTimeout` 函数来定义何时将该类添加到待动画元素上，从而有效地确定动画开始播放的时间。\n\
  \nListing 9.8 显示了启动第一个动画的 JavaScript。首先，你利用了一部分 jQuery 在执行任何代码之前等待 DOM 准备就。当页面加载完成后，你调用了\
  \ `setup` 方法。然后，你将类 `scene1` 赋值给容器元素 `#stage`、报纸及其第一页，以及摩根（Morgan）的两只眼睛。\n\n由于这些触发器都发生在动画的第一个场景中，你需要设置的延迟非常微其道。在显示\
  \ `#stage` 元素之前，你只需要等待十分之一秒（100 毫秒）。在触发报纸和摩根眼睛上的第一个动画之前，你只需要等待半秒。\n\nListing 9.8.\
  \ 使用 JavaScript 触发报纸移动 (cat.js)\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(setup);\n\
  \nfunction setup(){\n  setTimeout(function () { $('#stage').addClass('scene1');\
  \ }, 100);\n  setTimeout(function () { $('#newspaper').addClass('scene1'); }, 500);\n\
  \  setTimeout(function () { $('#page1').addClass('scene1'); }, 500);\n  setTimeout(function\
  \ () { $('#lefteye, #righteye').addClass('scene1');}, 500);\n}\n```\n\n### 场景 1：移动报纸\n\
  \n为了开始动画，你使用之前描述的方法来动画摩根移动报纸，以便他看到并阅读第一页。摩根会先让报纸向自己靠近，然后稍微降低第一页。你通过在 y 轴上旋转来制作摩根靠近报纸的动画。你通过对报纸的左下角应用\
  \ `rotateZ` 来制作报纸降低的动画。此动画的关键在于确定合适的 `transform-origin` 位置。\n\n为了触发这两个动作，你如 Listing\
  \ 9.9 所示，为几个不同的元素添加了类 `scene1`。\n\nListing 9.9. 移动报纸的动画 (cat.css)\n\n点击此处查看代码图像\n\
  \n```css\n#newspaper.scene1 { -webkit-transform: rotateZ(-2deg); }\n#page1.scene1\
  \ { -webkit-transform: rotateY(40deg); }\n#lefteye.scene1, #righteye.scene1 { -webkit-transition:\
  \ all 1s; }\n#lefteye.scene1 { left: 102px;}\n#righteye.scene1 { left: 182px; }\n\
  ```\n\n### 场景 2：阅读报纸\n\n现在摩根已经将报纸纳入视线，你就可以移动组成他眼睛的元素——通过左右移动它们来模拟阅读。在 Listing 9.10\
  \ 中，你设置了实际的动画，该动画定义在一个名为 `reading` 的关键帧动画中。\n\nListing 9.10. 移动摩根眼睛的关键帧动画 (cat.css)\n\
  \n点击此处查看代码图像\n\n```css\n@-webkit-keyframes reading {\n  0% {  }\n  30% { -webkit-transform:\
  \ translate3d(-3px,2px,0);}\n  50% { -webkit-transform: translate3d(3px,2px,0);}\n\
  \  80% { -webkit-transform: translate3d(-3px,2px,0);}\n  100% { -webkit-transform:\
  \ translate3d(3px,2px,0);}\n}\n#lefteye.scene2,\n#righteye.scene2 {\n  -webkit-animation:\
  \ reading 1s both 3 linear; } }\n```\n\n#### 在两个分离独立元素上组合动画\n\n你在 Listing 9.10 中使用\
  \ `translate3d` 而不是使用 `left` 属性进行定位，因为这允许你对左眼和右眼应用相同的关键帧动画。如果你使用 `left`，它会将两只眼睛移动到同一个水平位置——将其中一只眼睛移出原来的眼睛并进入另一只眼睛！你可以为每个眼睛定义一个选择器，但使用\
  \ `translate3d` 给你了一种更简单的方法。如果你指定只看第 30% 关键帧，无论左眼或右眼在哪里，此动画都会让它移动 -3 像素。\n\n和之前一样，你需要通过\
  \ JavaScript 触发这些新的类变化。从现在开始，你需要跟踪上一个动画的长度，以便正确安排后续动画的时间。场景 1 触发了对 `#newspaper`\
  \ 元素的变化，该元素的过渡在发生任何变化时都设置为 2 秒。因此，在继续下一步之前，你应该至少等待 2 秒加上初始延迟（500 毫秒）。Listing 9.11.\
  \ 触发阅读动画 (cat.js)\n\n点击此处查看代码图像\n\n```javascript\nfunction setup(){\n  // setup()\
  \ 延续自 9.8\n  setTimeout(function () { $('#lefteye, #righteye').removeClass('scene1');\
  \ }, 2700);\n  setTimeout(function () { $('#lefteye, #righteye').addClass('scene2');\
  \ }, 2800);\n}\n```\n\n#### 变换对层叠上下文的影响\n\n现在你对眼睛应用了变换，让我们回到 Listing 9.4 中提到的内容：`z-index`\
  \ 值非常重要。它的意思是，如果你不在 Listing 9.4 中设置较低的 z-index，你会看到眼睛向前移动，出现在所有其他元素之前（见图 9.2）。这仅在你尝试使用\
  \ `-webkit-transform` 时发生。这是为什么？\n\nW3C 的变换规范告诉我们：“变换的任何非 none 的值都会创建一个层叠上下文和一个包含块。”之前，`#lefteye`\
  \ 和 `#righteye` 元素根据它们的顺序堆叠。由于它们在 `#head` 元素之前，它们的隐含 z-index 较低，因此它们应该在 `#head`\
  \ 元素之后。但一旦通过动画应用了变换，就会创建一个层叠上下文，眼睛位于该新上下文的顶部。它们本质上被脱离了正常的流。因此，为了补偿这一点，你需要 Listing\
  \ 9.4 中定义的 `z-index : -1`。其他元素（如房屋）的适当堆叠同样重要。因为你为眼睛设置了 `z-index : -1`，我们将为房屋设置 `z-index:\
  \ -3`（参考 Listing 9.2），以确保眼睛不在房屋后面。\n\n要了解更多关于层叠上下文的内容，请访问 [`developer.mozilla.org/en/CSS/Understanding_z-index/The_stacking_context`](https://developer.mozilla.org/en/CSS/Understanding_z-index/The_stacking_context)。\n\
