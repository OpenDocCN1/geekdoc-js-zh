  \ HTML (cat.html)\n\n点击此处查看代码图片\n\n```html\n<div id=\"murphy\">\n  <img id=\"murphyarm\"\
  \ src=\"img/MurphyArm.png\">\n  <img src=\"img/MurphySansArm.png\" width=\"300\"\
  >\n</div>\n```\n\n列表 9.19. 为警察猫墨菲设置样式 (cat.css)\n\n```css\n#murphy {\n  position:\
  \ absolute;\n  top: 250px;\n  left: 1650px;\n  -webkit-transition:left 2s;\n  z-index:2;\n\
  }\n\n#murphyarm {\n  width: 100px;\n  position: absolute;\n  top: 87px;\n  left:\
  \ 105px;\n  -webkit-transform-origin: 100% 50%;\n}\n```\n\n### 使用 transform-origin\
  \ 对齐墨菲的部件\n\n你之前在 列表 9.19 中放置了猫猫墨菲的元素。在此过程中，你需要正确地对齐组成墨菲身体的独立图像——将他的手臂放置在相对于墨菲身体其他部分的正确位置。但现在，你将要旋转墨菲的手臂，以制作一个敲门的动画效果。为了正确地实现这一点，你需要在他的手臂上正确设置\
  \ `transform-origin` 属性。\n\n确定 `transform-origin` 属性位置的一个有效方法是手动旋转元素，然后通过开发者工具（如\
  \ Firebug 或 Safari 和 Chrome 中的 Web 开发者工具栏）通过实时修改 CSS 来调整 `transform-origin` 的值。你可以不断尝试\
  \ `transform-origin` 的值，直到找到一个看起来合适的值。\n\n图 9.5 展示了这种方法。该图展示了如何使用开发者工具为墨菲的手臂设置 25\
  \ 度旋转。在 列表 9.20 中，你将定义墨菲是如何敲门的——通过将其手臂从 10 度旋转移动到 35 度旋转——因此 25 度正好处于两者中间。此外，请注意图中，你编辑了\
  \ `transform-origin` 值，该值目前被设置为 `100% 90%`。这个值并不是你所需的正确值，正如你在墨菲的预览中看到的，他的手臂比它应该在的位置要靠右得多。但你可以继续通过开发者工具修改\
  \ `transform-origin` 数字，直到你找到一个看起来正确的值。\n\n![Image](img/09fig05.jpg)\n\n图 9.5. 使用开发者工具找到正确的\
