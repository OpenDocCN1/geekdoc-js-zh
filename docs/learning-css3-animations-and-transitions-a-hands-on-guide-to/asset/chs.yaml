  // 继续接列表 5.18\n$('.two').on('click', function() {\n  console.log('clicked');\n \
  \ $('#background1').addClass('slideOut');\n  $('#background2').addClass('slideIn');\n\
  });\n```\n\n\n\n\n\n图 5.7. 在场景 2 中切换背景切换\n\n<multimedia/05vid03.m4v>\n\n![05vid03.m4v](img/posterimage02.jpg)\
  \ \n\n视频 5.3. 场景 1 与场景 2 之间的过渡\n\n### 场景 3：让机器人行走\n\n第三也是最后一个场景由三个精灵组成：前景的一只黑猫、中景的机器人以及背景中的一张椅子图像。就像你在第一个场景中做的那样，你将让精灵和背景以不同的速度移动，以营造深度感。\n\
  \n<multimedia/05vid04.m4v>\n\n![05vid04.m4v](img/posterimage02.jpg) \n\n视频 5.4.\
  \ 最后的视差动画\n\n### 场景 3 的 HTML 和 CSS\n\n构成此示例的最后元素显示列表 5.21 和 5.22 中。它们包括另一个前景精灵（`#cat`）、一个中景精灵（`#robot2`）和一个背景精灵（元素\
  \ `#inside`，是一张椅子的图片）。\n\n列表 5.21. 最后场景中精灵的样式 (robotos.css)\n\n点击此处查看代码图片\n\n```css\n\
  #robot2 {\n  position: absolute;\n  bottom: 20px;\n  left: 0;\n  width: 300px;\n\
  \  height: 277px;\n  background-image: url('../img/spriteRobotSpringy.png');\n \
  \ -webkit-transition: left 2.4s ease-in-out;\n  -moz-transition: left 2.4s ease-in-out;\n\
  \  -o-transition: left 2.4s ease-in-out;\n  transition: left 2.4s ease-in-out;\n\
  }\n#cat, #inside {\n  -webkit-transition: left 2s ease-in-out;\n  -moz-transition:\
  \ left 2s ease-in-out;\n  -o-transition: left 2s ease-in-out;\n  transition: left\
  \ 2s ease-in-out;\n}\n#cat {\n  opacity: 0;\n  left: -400px;\n  position: absolute;\n\
  \  bottom: -70px;\n  z-index: 10;\n}\n```\n\n如之前提到的，场景 3 有一个通过打开的窗户可见的内部层。该内部层是一个椅子的\
  \ `img` 元素，随着场景的移动，它会从窗户的一端缓慢移动到另一端。列表 5.22 定义了 `#inside` 元素的样式。\n\n列表 5.22. 窗户内部层的样式\
  \ (robotos.css)\n\n```css\n#inside {\n  position: absolute;\n  left: 460px;\n  bottom:\
  \ 300px;\n  z-index: -1;\n}\n```\n\n列表 5.23 显示了在应用 `move` 类后，如何更改 `#background2`、`#robot2`\
  \ 和 `#cat` 的 `transition-property` 属性。因为它们都是为这些元素设置为 `transition-property` 的属性，所以当它们被应用时会触发过渡动画。\n\
  \n列表 5.23. 应用类 move 时触发过渡 (robotos.css)\n\n```css\n#background2.move {\n  background-position:\
  \ -250px -200px;\n}\n#robot2.move {\n  left: 520px;\n}\n#cat.move {\n  opacity:\
  \ 1;\n  left: 200px;\n}\n#inside.move {\n  left: 300px;\n}\n```\n\n### 场景 3 的 JavaScript\n\
  \n就像你在场景 2 中做的那样，你将等待上一个场景完成后显示最后的链接，即 Scene3! 链接。在列表 5.24 中，你再次等待过渡结束事件触发，但这次你是在\
  \ `#background2` 元素上监听它，它是场景 2 中最后一个完成过渡的元素。\n\n列表 5.24. 当第二次过渡结束时更改链接 (robotos.js)\n\
  \n点击此处查看代码图片\n\n```javascript\n// 接接列表 5.20\n$('#background2').on(transEndEventName,\
  \ function() {\n    $('.two').removeClass(\"visible\");\n    $('.three').addClass(\"\
  visible\");\n});\n```\n\n如之前提到的，场景 3 有一个通过打开的窗户可见的内部层。该内部层是一个椅子的 `img` 元素，随着场景的移动，它会从窗户的一端缓慢移动到另一端。列表\
  \ 5.22 定义了 `#inside` 元素的样式。\n\n列表 5.22. 窗户内部层的样式 (robotos.css)\n\n```css\n#inside\
  \ {\n  position: absolute;\n  left: 460px;\n  bottom: 300px;\n  z-index: -1;\n}\n\
  ```\n\n列表 5.23 显示了在应用 `move` 类后，如何更改 `#background2`、`#robot2` 和 `#cat` 的 `transition-property`\
  \ 属性。因为它们都是为这些元素设置为 `transition-property` 的属性，所以当它们被应用时会触发过渡动画。列表 5.23. 应用类 move\
  \ 时触发过渡 (robotos.css)\n\n```css\n#background2.move {\n  background-position: -250px\
  \ -200px;\n}\n#robot2.move {\n  left: 520px;\n}\n#cat.move {\n  opacity: 1;\n  left:\
  \ 200px;\n}\n#inside.move {\n  left: 300px;\n}\n```\n\n*(注：原文后续部分存在大量重复段落，已按要求不再重复输出)*\n\
  \n\n\n\n\n在使用这些属性时，视觉化将变换应用到不同轴上的效果将很有帮助。想象你用两只手的大拇指和食指夹住一张纸的顶端中间和底部中间。如果你向左和向右旋转这张纸，你就会实现绕\
  \ y 轴的旋转。图 6.1 演示了这一点。\n\n![Image](img/06fig01.jpg)\n\n图 6.1. 绕 y 轴旋转\n\n相反，如果你在纸的右边缘和左边缘中间夹住它，然后像点头一样前后旋转，你就会实现绕\
  \ x 轴的旋转。图 6.2 演示了这一点。\n\n![Image](img/06fig02.jpg)\n\n图 6.2. 绕 x 轴旋转\n\n你使用 `translateZ`\
  \ 属性沿 z 轴向前或后移动元素。这创建了一个元素在空间中向观众或远离观众的视觉效果，如图 6.3 所示。请注意，与之前的示例不同，`translateZ`\
  \ 的大值可能会导致元素移动过容器元素（由图 6.3 中的虚线框表示）。\n\n![Image](img/06fig03.jpg)\n\n图 6.3. 几种不同的\
  \ translateZ 变换结果\n\n为了正确应用这些属性，必须与许多其他新属性结合使用，这些属性将帮助你配置 3D 变换：\n\n- `perspective`：设置一个观察立方体，控制观众如何看到应用在子元素上的变换。`perspective`\
  \ 可以被视为观众沿 z 轴距离场景的远近程度​。\n- `perspective-origin`：设置 `perspective` 属性的起始点。\n- `transform-style`：决定子元素在空间中的渲染方式。它们是在父元素的平面内被扁平化，还是定位在\
  \ 3D 空间中（`preserve-3d`）？默认值为 `flat`。\n- `backface-visibility`：决定当元素面向观众时其背面是否可见。可用值为\
  \ `visible` 和 `hidden`，其中 `visible` 是默认值。\n\n你将在本章后面通过这些示例学习更多关于这些属性的知识。\n\n###\
  \ 在所有三个轴上定义变换\n\n三个属性允许你同时在三个轴上定义变换：`translate3d`、`rotate3d` 和 `scale3d`。\n\n###\
  \ translate3d(x, y, z)\n\n`translate3d` 属性允许你通过提供逗号分隔的平移列表，同时指定 x、y 和 z 轴上的平移。\n\
  \n使用 `translate3d`并不一定需要为三个轴都提供平移。事实上，你可以将三个参数中的两个设置为 `0` 并只平移单个轴。例如，`translate3d(100px,0,0)`\
  \ 是完全有效的。你之所以这样做而不是简单地使用 `translateX`、`translateY` 或 `translateZ`，是因为 `translate3d`\
  \ 还有一个额外好处：它是硬件加速的。当你开始为 3D 变换制作动画时，你将在第 7 章“制作 2D 和 3D 变换的动画”中学习更多信息。\n\n### scale3d(scale-x,\
  \ scale-y, scale-z)\n\n与 `translate3d` 类似，`scale3d` 允许你同时指定三个轴上的缩放。例如，指定 `-webkit-transform:\
  \ scale3d(0.5, 2, 0);` 会导致元素宽度变为原来的一半，高度变为两倍。传递给 `scale3d` 的三个值定义了一个向量，坐标定义了每个方向（x、y\
  \ 和 z）上进行了多少缩放。\n\n### rotate3d(x, y, z, angle)\n\n`rotate3d` 的工作原理与 `translate3d`\
  \ 或 `scale3d` 有不同。你将旋转角度作为 `rotate3d` 的第四个参数。前三个参数定义向量的 x、y 和 z 坐标，表示每个坐标上的旋转轴。\n\
  \n使用此属性需要对矩阵乘法的工作原理有深入理解。此属性及其对矩阵相关数学的深度依赖超出了本书的范围，因此我们在这里不使用 `rotate3d`。\n\n##\
  \ 浏览器对 3D 变换的支持\n\nCSS3 3D 变换在现代浏览器中的支持情况不不齐。最新版本的 Firefox、Safari 和 Chrome 提供了良好支持，但在本文编写期间，Opera\
  \ 还不支持它们。Internet Explorer 计划从 10 版本开始支持 CSS3 3D 变换。以下浏览器目前支持 3D 变换：\n\n- Android\
  \ Browser 3.0+\n- Chrome 12.0+\n- Firefox 10.0+\n- Internet Explorer 10，从 Internet\
  \ Explorer 10 开发者预览版开始([`en.wikipedia.org/wiki/Internet_Explorer_10#Release_history`](http://en.wikipedia.org/wiki/Internet_Explorer_10#Release_history))\n\
  - iOS Safari 3.2+ 和 Safari 4.0+\n\n## 绘制 3D 立方体\n\n你可以通过绘制一个立方体来练习使用 3D 变换属性。在这个示例中，你将调整立方体的方向，使得你从俯视图观察它，就像你就在它内部一样。如图\
  \ 6.1 所示，该立方体的 HTML 由一个容器元素 `stage`、第二个容器元素 `cube` 以及组成面的六个 `div` 元素。\n\n图 6.1.\
  \ 3D 立方体的基础 HTML (cube.html)\n\n```html\n<div id=\"stage\">\n  <div class=\"cube\"\
  >\n    <div id=\"top\"></div>\n    <div id=\"right\"></div>\n    <div id=\"bottom\"\
  ></div>\n    <div id=\"left\"></div>\n    <div id=\"front\"></div>\n    <div id=\"\
  back\"></div>\n  </div>\n</div>\n```\n\n想要查看立方体的效果预览，请查看 [`alexisgo.github.com/CSSAnimations/ch6code/cube.html`](http://alexisgo.github.com/CSSAnimations/ch6code/cube.html)\
  \ 演示。\n\n### 为场景创建元素\n\n编写好 HTML 后，如图 6.2 所示，定义 `stage` 元素的样式样式。为 `stage` 元素设置边距、位置、固定大小和边框。但你为\
  \ `stage` 定义最重要的属性是第一个：`perspective`。`perspective` 属性的正确使用确保了你可以看到将要应用的所有 3D 变换。\n\
  \n图 6.2. 为容器应用透视和其他样式 (cube.css)\n\n```css\n#stage {\n  -webkit-perspective: 800px;\n\
  \  -moz-perspective: 800px; /* FF10+ */\n  -ms-perspective: 800px; /* IE10+ */\n\
  \  perspective: 800px;\n  -webkit-perspective-origin: 50% 50%;\n  -moz-perspective-origin:\
  \ 50% 50%;\n  -ms-perspective-origin: 50% 50%;\n  -o-perspective-origin: 50% 50%;\n\
  \  perspective-origin: 50% 50%;\n  margin-top: 100px;\n  margin-left: 100px;\n \
  \ position: relative;\n  width: 200px;\n  height: 200px;\n}\n```\n\n在“CSS 变换”草案规范([`www.w3.org/TR/css3-3d-transforms/`](http://www.w3.org/TR/css3-3d-transforms/))中，W3C\
  \ 将 `perspective` 属性描述为一个观察立方体，该立方体位于一个底面距离观众无限的金字塔内部，顶点代表观众的位置。可见区域是由视口四条边界界定的区域。.\
  \ . . 作为函数参数的深度，代表了 z=0 平面到观众的距离。”\n\n\n\n\n\n以防这个解释让你感到困惑，我将用另一种方式来解释：想象你在博物馆里看一幅画。`perspective`（透视）可以被看作是你距离画的近或远程度。如果你离画非常近，你可能能看到颜料的纹理，但无法看到整幅画。只有当你从画前后退一步时，才能看到完整的构图。\n\
  \n`perspective` 属性允许你定义距离画的近或远程度（即浏览器的视口），这能让你更好地观察 3D 变换的效果。为了直这一点，请查看图 6.4，它展示了在不同的\
  \ `perspective` 值下，你的立方体（你从俯视图观察，且顶部面是透明的）最终版本看起来是什么样的。\n\n![Image](img/06fig04.jpg)\n\
  \n图 6.4. 具有四个不同透视值的相同立方体\n\n规范还规定，使用 `perspective` 属性会建立一个包含块，这类似于 `position: relative`。这很重要，因为这意味着如果\
  \ `perspective` 属性应用于父元素，该元素的所有后代将共享同一个 3D 空间——即同一个包含块。\n\n### 在 3D 空间中渲染嵌套元素\n\n\
  接下来你将为 `#cube div` 设置，它应用于包含立方体所有面的 `div`。在列表 6.3 中定义的最重要的样式是 `transform-style`\
  \ 属性。`transform-style` 决定了应用于该属性的元素的子如何在 3D 空间中渲染。默认情况下是平面的（`flat`）。将此属性设置为 `preserve-3d`\
  \ 可以确保如果你绕 x 轴或 y 轴旋转包含 `#cube` 的 `div`，该元素的子元素不会被扁平到父元素的平面。需要注意的是，该属性仅影响元素的子，而不影响元素本身。\n\
  \n列表 6.3. 为立方体容器的后代设置 transform-style (cube.css)\n\n```css\n.cube {\n  position:\
  \ absolute;\n  width: 200px;\n  height: 200px;\n  -webkit-transform-style: preserve-3d;\n\
  \  -moz-transform-style: preserve-3d;\n  -ms-transform-style: preserve-3d;\n  transform-style:\
  \ preserve-3d;\n}\n```\n\n下一步一步是为立方体的面设置默认样式，你将在列表 6.4 中完成此操作。你定位立方体并将默认透明度设置为 0.7。这在第\
  \ 7 章中添加一些 JavaScript 并让这个立方体可以移动时非常有用；透明度使侧面变为半透明，你可以看透它们。\n\n你还设置了每个立方体面的背景颜色。你将立方体的正面设置为\
  \ `transparent`，这样你可以看到内部的立方体。\n\n列表 6.4. 立方面的默认样式\n\n```css\n.cube div {\n  position:\
  \ absolute;\n  top: 0px;\n  left: 0px;\n  opacity: 0.7;\n  width: 100%;\n  height:\
  \ 100%;\n  #cubetop {\n    background-color: purple;\n  }\n  #cubebottom {\n   \
  \ background-color: red;\n  }\n  #cubeleft {\n    background-color: green;\n  }\n\
  \  #cuberight {\n    background-color: orange;\n  }\n  #cubefront {\n    background-color:\
  \ transparent;\n  }\n  #cubeback {\n    background-color: blue;\n  }\n}\n```\n\n\
  ### 旋转立方体的面\n\n现在，立方体的所有面都绝对定位在同一个位置。你需要旋转顶部、右侧、底部和左侧面以正确组装立方体。\n\n你将绕 x 轴将立方体的顶部和底部旋转\
  \ 87 度。这将使它们几乎与立方体其他面的当前位置垂直。图 6.5 展示了这种绕 x 轴旋转的结果。\n\n![Image](img/06fig05.jpg)\n\
  \n图 6.5. 中间的垂直面已绕 y 轴旋转了 87 度，而水平面已绕 x 轴旋转了 87 度\n\n接下来，你需要旋转立方体的右侧和左侧面。你将绕 y 轴而不是\
  \ x 轴来旋转这些面。图 6.5 展示了这种绕 x 轴旋转的结果。\n\n```css\n/* 左侧和右侧面 */\n#cubeleft {\n  background-color:\
  \ green;\n  -webkit-transform: rotateY(87deg);\n  -moz-transform: rotateY(87deg);\n\
  \  -ms-transform: rotateY(87deg);\n  transform: rotateY(87deg);\n}\n\n#cuberight\
  \ {\n  background-color: orange;\n  -webkit-transform: rotateY(87deg);\n  -moz-transform:\
  \ rotateY(87deg);\n  -ms-transform: rotateY(87deg);\n  transform: rotateY(87deg);\n\
  }\n\n/* 顶部和底部面 */\n#cubetop {\n  background-color: purple;\n  -webkit-transform:\
  \ rotateX(87deg);\n  -moz-transform: rotateX(87deg);\n  -ms-transform: rotateX(87deg);\n\
  \  transform: rotateX(87deg);\n}\n\n#cubebottom {\n  background-color: red;\n  -webkit-transform:\
  \ rotateX(90deg);\n  -moz-transform: rotateX(90deg);\n  -ms-transform: rotateX(90deg);\n\
  \  transform: rotateX(90deg);\n}\n```\n\n### 使用 translateZ 改变深度仅仅旋转立方体的面是不够的。你还必须重新定位这些面以正确地构建立方体。你可以通过\
  \ `translateZ` 属性来实现这一点。你可以从对一个已经旋转过的面应用 `translateZ` 属性开始：即立方体的左侧面。但是，你应该将立方体的这个这个面平移多远呢？\n\
  \n图 6.5 展示了 `#cubeleft` 元素在绕 y 轴旋转 87 度后的位置，以及 `#cubetop` 元素在绕 x 轴旋转 87 度后的位置。你已经完成了这些立方体面的旋转工作，但仍然需要将它们移动到立方体的正确边缘。\n\
  \n\n\n\n\n为了让 `#cubeleft` 面真正位于立方体的左侧，你还需要沿 `z-axis` 平移 100 像素——即该面本身宽度的一半，如代码列表\
  \ 6.6 所示。为了让 `#cubetop` 面真正位于立方体的顶部，你必须同样沿 `z-axis` 平移 `100` 像素。这是因为立方体各个面上的 `transform-origin`\
  \ 属性都使用了默认值：`50% 50%`（由于它们使用了默认值，所以我们不需要在代码中显式指定它们，因此你在代码列表中并没看到它们）。任何旋转操作都是从面的中心点开始的。这导致变换后的元素仍然位于容器的中间。为了将它们移动到边缘，你必须沿\
  \ `z-axis` 平移立方体面宽的一半。插图 6.6 显示了在 `#cubeleft` 的 transform 属性中添加 `translateZ(-100px)`\
  \ 以及在 `#cubetop` 中添加 `translateZ(100px)` 的结果。注意，你再次是在更新现有选择器内部的样式，因此新或修改的代码用**粗体**显示，以区别于先前的代码。\n\
  \n![Image](img/06fig06.jpg)\n\n图 6.6. 将 #cubeleft 面设置为 `translateZ(-100px)` 并将 #topcube\
  \ 面设置为 `translate(100px)`，使它们能够与平面立方体面的边缘对齐\n\n在修改代码的同时，你还可以将 87 度的旋转改为纯正的 90 度旋转。平移和旋转的结合将确保即使应用了\
  \ 90 度旋转，你也能看到立方体面。这在之前是不可能的；请记住，在没有额外的 `translate`（或其他）变换的情况下，应用 90 度旋转将使这些面变得不可见。\n\
  \n代码列表 6.6. 为左面和顶部添加平移 (Translates)\n\n点击此处查看代码图像\n\n* *\n\n```css\n#cubeleft {\n\
  \  background-color: green;\n  -webkit-transform: rotateY(90deg) translateZ(-100px);\n\
  \  -moz-transform: rotateY(90deg) translateZ(-100px);\n  -ms-transform: rotateY(90deg)\
  \ translateZ(-100px);\n  transform: rotateY(90deg) translateZ(-100px);\n}\n\n#cubetop\
  \ {\n  background-color: purple;\n  -webkit-transform: rotateX(90deg) translateZ(100px);\n\
  \  -moz-transform: rotateX(90deg) translateZ(100px);\n  -ms-transform: rotateX(90deg)\
  \ translateZ(100px);\n  transform: rotateX(90deg) translateZ(100px);\n}\n```\n\n\
  * *\n\n但为什么要在这个左侧立方体面沿 `z-axis` 平移呢？当你向左右移动物体时，倾向于沿 `x-axis` 平移。但请记住，你已经应用了一个变换：你已经沿\
  \ `y-axis` 旋转了 `#cubeleft` 元素。变换意味着坐标轴的位置不再是你预期的位置。插图 6.7 展示了 `#cubeleft` 面在 y 轴旋转前后的坐标轴情况。\n\
  \n![Image](img/06fig07.jpg)\n\n图 6.7. 在 y 轴旋转 90 度前后的 x 轴和 y 轴的位置\n\n接下来，你可以处理将立方体的其余面移动到位，如插图\
  \ 6.8 所示，通过为 `translate` 补充适当的值来丰富现有的变换来实现。（注意，你需要在应用代码列表 6.7 中的代码之前，才能看到插图 6.8\
  \ 所示的结果。）\n\n![Image](img/06fig08.jpg)\n\n图 6.8. 所有立方体的面已就位\n\n注意，立方体的背面和正面（为了能看到立方体内部，你将其背景颜色设置为透明）都不需要任何旋转。它们只需要一个\
  \ `translateZ` 来将面向后或向前推。同样注意，你将 `#cubefront` 面的背景颜色设置为 `transparent`，所以你实际上看不到立方体的正面。代码列表\
  \ 6.7 显示了组装立方体所需的完整变换。与之前一样，你正在更新现有的选择器，因此为了区分修改或添加的代码与旧代码，新或修改的代码将以**粗体**显示。\n\n\
  代码列表 6.7. 六个立方体面的最终变换 (cube.css)\n\n点击此处查看代码图像\n\n* *\n\n```css\n#cubeleft {\n \
  \ background-color: green;\n  -webkit-transform: rotateY(90deg) translateZ(-100px);\n\
  \  -moz-transform: rotateY(90deg) translateZ(-100px);\n  -ms-transform: rotateY(90deg)\
  \ translateZ(-100px);\n  transform: rotateY(90deg) translateZ(-100px);\n}\n\n#cubetop\
  \ {\n  background-color: purple;\n  -webkit-transform: rotateX(90deg) translateZ(100px);\n\
  \  -moz-transform: rotateX(90deg) translateZ(100px);\n  -ms-transform: rotateX(90deg)\
  \ translateZ(100px);\n  transform: rotateX(90deg) translateZ(100px);\n}\n\n#cubottom\
  \ {\n  background-color: red;\n  -webkit-transform: rotateX(90deg) translateZ(-100px);\n\
  \  -moz-transform: rotateX(90deg) translateZ(-100px);\n  -ms-transform: rotateX(90deg)\
  \ translateZ(-100px);\n  transform: rotateX(90deg) translateZ(-100px);\n}\n\n#cuberight\
  \ {\n  background-color: orange;\n  -webkit-transform: rotateY(-90deg) translateZ(100px);\n\
  \  -moz-transform: rotateY(-90deg) translateZ(100px);\n  -ms-transform: rotateY(-90deg)\
  \ translateZ(100px);\n  transform: rotateY(-90deg) translateZ(100px);\n}\n\n#cubefront\
  \ {\n  background-color: transparent;\n  -webkit-transform: rotateY(90deg) translateZ(100px);\n\
  \  -moz-transform: rotateY(90deg) translateZ(100px);\n  -ms-transform: rotateY(90deg)\
  \ translateZ(100px);\n  transform: rotateY(90deg) translateZ(100px);\n}\n\n#cubeback\
  \ {\n  background-color: blue;\n  -webkit-transform: rotateX(-90deg) translateZ(100px);\n\
  \  -moz-transform: rotateX(-90deg) translateZ(100px);\n  -ms-transform: rotateX(-90deg)\
  \ translateZ(100px);\n  transform: rotateX(-90deg) translateZ(100px);\n}\n```\n\n\
  * *\n\n#### 使用 perspective-origin 修改视角角度\n\n控制你观察场景的属性是 `perspective-origin`。`perspective-origin`\
  \ 的默认值（`50% 50%`）让观察者正面对。如果你调整了这个值，就可以改变“视角角度”并改变查看页面的方式。`perspective-origin` 可以接受绝对值和百分比值。插图\
  \ 6.9 展示了对立方体应用不同 `perspective-origin` 值的结果。\n\n* *\n\n#### 注意\n\n当你最初设置容器 `#stage`\
  \ 时可能没有注意到，但你给父元素设置了固定的大小（参考代码列表 6.2）。这很常见，但当你对子元素应用 3D 变换时，强调这一步是非常重要的。\n\n为容器元素设置尺寸是防止子元素随窗口大小变化而移动的关键。如果容器元素没有指定宽度或高度，随着窗口增大或缩小，后代立方体将像视角发生变化一样移动。\n\
  \n\n\n\n\n![Image](img/06fig10.jpg)\n\n图 6.10. 如果容器元素没有固定大小，由于 `perspective-origin`\
  \ 属性的变化，同一个立方体在较宽的窗口中看起来会非常不同\n\n<multimedia/06vid01.m4v>\n\n![06vid01.m4v](img/posterimage02.jpg)\
  \ \n\n视频 6.1. 如果容器没有固定大小，`perspective-origin` 如何随窗口大小变化。\n\n## 创建纸牌屋\n\n在本节中，你将把目前所学的知识应用于一个有趣的示例中。在这里，你将利用一些\
  \ 3D 变换属性，并结合 CSS3 样式来绘制卡牌本身，从而创建一个纸牌屋。\n\n你从 Listing 6.8 中的 HTML 开始。从一个容器元素开始，再次称为\
  \ `#stage`。接下来，你有两个容器 `div`，即 `#toprow` 和 `#bottomrow`。`#toprow` 将包含三张卡牌，而 `#bottomrow`\
  \ 将包含六张。一个名为 `card` 的通用类将用于提供一些基础样式，而一系列自定义类——`left`、`right`、`flat` 和 `secondcol`——将区分不同的卡牌。\n\
  \nListing 6.8. 纸牌屋的基础 HTML (houseOfCards.html)\n\n点击此处查看代码图片\n\n```html\n<div id=\"\
  stage\">\n  <div id=\"toprow\">\n    <div class=\"card left\"></</div>>\n    <div\
  \ class=\"card right\"></div>\n    <div class=\"card flat\"></div>\n  </div>\n \
  \ <div id=\"bottomrow\">\n    <div class=\"card left\"></div>\n    <div class=\"\
  card right\"></div>\n    <div class=\"card flat\"></div>\n    <div class=\"card\
  \ left secondcol\"></div>\n    <div class=\"card right secondcol\"></div>\n    <div\
  \ class=\"card flat secondcol\"></div>\n  </div>\n</div>\n```\n\n### 为纸牌屋设置容器元素样式\n\
  \n为了给容器元素 `#stage` 设置样式（如 Listing 6.9 所示），你将透视设置为 900 像素，这样你就能看到将执行的 3D 变换。你还将将\
  \ `perspective-origin` 设置为水平 100%（最左边缘）和垂直 0%。这使得看起来你正从页面的右侧和顶部边缘观察场景。\n\n注意，为了简洁起见，此示例仅包含了\
  \ `-webkit-` 厂商前缀。带有所有厂商前缀的完整代码可以在书籍的 GitHub 页面：[`github.com/alexisgo/LearningCSSAnimations/`](https://github.com/alexisgo/LearningCSSAnimations/)\
  \ 中的 `ch6code/` 文件夹。你可以在这里找到你即将构建的内容的完成演示：[`alexisgo.github.com/LearningCSSAnimations/ch6code/houseOfCards.html`](http://alexisgo.github.com/LearningCSSAnimations/ch6code/houseOfCards.html)。\n\
  \nListing 6.9. 设置容器元素的默认样式 (houseOfCards.css)\n\n```css\n#stage {\n  -webkit-perspective:\
  \ 900px;\n  -webkit-perspective-origin: 100% 0%;\n  width: 500px;\n  height: 300px;\n\
  \  margin: 10%;\n}\n```\n\n### 卡牌的定位与样式设置\n\nListing 6.10 设置了卡牌在两个容器元素 `#toprow`\
  \ 和 `#bottomrow` 中的位置。你将纸牌屋的两排都定位在左侧 100 像素处，以便将它们推离浏览器左边缘的默认位置。你将 `.right` 卡牌放在距离父元素\
  \ `#toprow` 左侧 40 像素处。你将 `.flat` 卡牌放在父元素 `#toprow` 左侧 20 像素、顶部 50 像素处。你还对 `#bottomrow`\
  \ 及其后代元素应用定位（这些元素在本章中未详细说明，但在 Listing 6.10 中显示）。\n\n最后，你为 `#bottomrow` 中的第二组堆叠卡牌（`.secondcol`）设置位置，将它们全部移动到\
  \ `#bottomrow` 中第一组卡牌的稍微左侧。\n\nListing 6.10. 根据行或类型定位卡牌 (houseOfCards.css)\n\n点击此处查看代码图片\n\
  \n```css\n#toprow, #bottomrow {\n  position: relative;\n  left: 100px;\n}\n#toprow\
  \ .right {\n  left: 40px;\n}\n#toprow .flat {\n  top: 50px;\n  left: 20px;\n}\n\
  #bottomrow {\n  top: 100px;\n  left: 60px;\n}\n#bottomrow .right { left: 40px; }\n\
  #bottomrow .flat {\n  top: 50px;\n  left: 15px;\n}\n#bottomrow .secondcol { left:\
  \ 100px; }\n#bottomrow .left.secondcol { left: 80px; }\n#bottomrow .right.secondcol\
  \ { left: 120px; }\n```\n\nListing 6.11 定义了所有卡牌的默认样式。你给每张卡牌设置了 `absolute` 位置和固定大小，以及\
  \ 10 像素的 `border-radius` 以使卡牌边缘变为圆角。你给它们设置了银色边框和浅蓝色默认背景色。对于左侧的卡牌（带有类 `left`），你将背景颜色设置为白色，代表卡牌的正面（通常是卡牌正面数字或图案的地方）。此时，由于你还没有对任何卡牌进行变换，它们看起来看起来都是平放的，如\
  \ Figure 6.1 所示。\n\nListing 6.11. 扑牌的基础样式 (houseOfCards.css)\n\n```css\n.card {\n\
  \  position: absolute;\n  width: 70px;\n  height: 100px;\n  -webkit-border-radius:\
  \ 10px;\n  -moz-border-radius: 10px;\n  border-radius: 10px;\n  border: 5px solid\
  \ rgb(179,179,179);\n  background-color: rgb(102,102,255);\n}\n.left {\n  background-color:\
  \ white;\n}\n```\n\n![Image](img/06fig11.jpg)\n图 6.11. 应用任何变换之前的卡牌\n\n### 卡牌的变换\n\
  \n现在，你需要设置想要应用到卡牌上的变换（参见 Listing 6.12）。你将在 `y-axis` 上旋转所有卡牌 90 度。接下来，对于将倾斜在一起形成顶峰的卡牌，你将其中一张旋转\
  \ 22 度，另一张旋转 –22 度。两张卡牌在顶点处汇合（参见 Figure 6.12）。你还将左卡牌的背景颜色设置为白色，以便卡牌正面可见。\n\n![Image](img/06fig12.jpg)\n\
  图 6.12. 变换卡牌后的纸牌屋\n\nflat 卡牌还有一个额外的变换。你沿 `z-axis` 旋转 flat 卡牌 90 度。你可以将其理解为让它们以横向而非垂直模式显示。\n\
  \nListing 6.12. 为类型类型设置变换 (houseOfCards.css)\n\n```css\n.left {\n  background-color:\
  \ white;\n  -webkit-transform: rotateY(90deg) rotateX(-22deg);\n}\n.right {\n  -webkit-transform:\
  \ rotateY(90deg) rotateX(22deg);\n}\n.flat {\n  -webkit-transform: rotateZ(90deg)\
  \ rotateY(90deg);\n}\n```\n\n### 调整堆叠卡牌的顺序\n\n目前纸牌屋的显示方式存在问题。堆叠卡牌的部分出现在本应该在其上面的卡牌的*后面*。你可能在\
  \ Figure 6.12 中注意到了这种效果，但如果你没有注意到，我在 Figure 6.13 中突出了该问题。\n\n![Image](img/06fig13.jpg)\n\
  图 6.13. 堆叠卡牌出现在平放卡牌后面\n\n你在 Figure 6.13 中看到的效果是由于 `transform-style`。默认的 `transform-style`\
  \ 是 `flat`，因此 `#toprow` 和 `#bottomrow` 目前都是设置为该值。这意味着它们的元素都被平化到所在的平面上，这就是为什么 `#bottomrow`\
  \ 的堆叠卡牌出现在 `#bottomrow` 的平放卡牌后面。\n\n在 Listing 6.13 中，你通过将 `transform-style` 设置为\
  \ `preserve-3d` 来修复这个问题。将 `transform-style` 改为 `preserve-3d` 确保了 `#toprow` 和 `#bottomrow`\
  \ 内部的卡牌在 3D 空间中定位，而不是被平化。\n\n\n\n\n\n由于你正在更新之前在 列表 6.10 中定义的选择器，因此你在此处添加的新代码将以**粗体**显示，以便清晰地看出需要向代码中添加哪些新行。图\
  \ 6.14 显示了两张图片：左侧，你可以看到卡片在更改之前的样子；右侧，你可以看到给卡片添加了 `transform-style: preserve-3d`\
  \ 后的结果。\n\n![Image](img/06fig14.jpg)\n\n图 6.14。左侧图显示了应用 `transform-style: preserve-3d`\
  \ *之前*的卡片，右侧图显示了应用*之后*。\n\n列表 6.13。使用 `preserve-3d` 修复元素重叠 (houseOfCards.css)\n\n\
  * * *\n\n```css\n#toprow, #bottomrow {\n  position: relative;\n  left: 100px;\n\
  \  -webkit-transform-style: preserve-3d;\n}\n```\n\n* * *\n\n正如你在 图 6.14 中看到的，卡片仍然不完全正确：第二行左侧卡片的顶端正位于本应该堆叠在其上方的平坦卡片前面。该问题在\
  \ 图 6.15 中被显式标出。\n\n![Image](img/06fig15.jpg)\n\n图 6.15。底部左侧卡片出现在它们本应该堆叠在其下的平坦卡片前面。\n\
  \n你可以通过对代码进行最后一次调整来修复 图 6.15 所示的问题。在 列表 6.14 中，你将 `#toprow` 的 `z-index` 设置为 `2`，以确保它显示在它所堆叠的第二行前面。\n\
  \n列表 6.14。使用 z-index 将 #toprow 移动到 #bottomrow 前面 (houseOfCards.css)\n\n* * *\n\n\
  ```css\n#toprow {\n  z-index: 2;\n}\n```\n\n* * *\n\n图 6.16 显示了 列表 6.13 和 6.14 结合后的结果（*同时添加*了\
  \ `preserve-3d` 和 `z-index:2`）。\n\n![Image](img/06fig16.jpg)\n\n图 6.16。修复 z-index\
  \ 和 transform-style 后的纸牌屋\n\n### 为卡片背面添加图案\n\n作为最后一步，你可以为卡片背面添加自定义的双条纹渐变，以使它们呈现出更逼真实的菱形纹理。这种双条纹渐变的基础代码（列表\
  \ 6.15）源自 Estelle Weyl 在其 CSS 渐变示例页面上的系列优秀渐变示例，该地址为 [`standardista.com/cssgradients`](http://standardista.com/cssgradients)。\n\
  \n列表 6.15 与本章所有其他代码列表一样，仅提供了 `-webkit-` 前缀，但你可以在书籍的 GitHub 页面找到带有所有前缀的完整代码。图 6.17\
  \ 显示了最终的纸牌屋。\n\n列表 6.15。为卡片添加双条纹渐变 (houseOfCards.css)\n\n点击此处查看代码图片\n\n* * *\n\n\
  ```css\n.card {\n/* double striped gradients example from Estelle Weyl:\n  http://standardista.com/cssgradients/\
  \ */\nbackground-image:\n  -webkit-linear-gradient(135deg,\n    rgba(255, 255, 255,\
  \ 0.2) 25%,\n    rgba(255, 255, 255, 0) 25%,\n    rgba(255, 255, 255, 0) 50%,\n\
  \    rgba(255, 255, 255, 0.2) 50%,\n    rgba(255, 255, 255, 0.2) 75%,\n    rgba(255,\
  \ 255, 255, 0) 75%,\n    rgba(255, 255, 255, 0) 100%\n  ),\n  -webkit-linear-gradient(45deg,\n\
  \    rgba(255, 255, 255, 0.2) 25%,\n    rgba(255, 255, 255, 0) 25%,\n    rgba(255,\
  \ 255, 255, 0) 50%,\n    rgba(255, 255, 255, 0.2) 50%,\n    rgba(255, 255, 255,\
  \ 0.2) 75%,\n    rgba(255, 255, 255, 0) 75%,\n    rgba(255, 255, 255, 0) 100%\n\
  \  );\n}\n```\n\n* * *\n\n![Image](img/06fig17.jpg)\n\n图 6.17。完成后的纸牌屋\n\n* * *\n\
  \n### 附加资源\n\n要学习更多 3D 变换，我推荐以下资源和教程：\n- CSS 3D Transforms Module 3, W3C 草草案：[`www.w3.org/TR/css3-d-transforms/`](http://www.w3.org/TR/css3-d-transforms/)\n\
  - Internet Explorer 10 开发者指南中的 3D 变换文章：[`msdn.microsoft.com/library/ie/hh06ex10/`](http://msdn.microsoft.com/library/ie/hh06ex10/)\n\
  \n\n\n\n\n在撰写本文时，`range` 输入类型和 `step` 属性尚未被 Firefox、Mobile Safari 或 Android 浏览器支持。它们被\
  \ Internet Explorer 10 支持，但更早的版本均不支持。不过，好消息是，在不支持 `range` 输入类型的浏览器中，该输入类型会被视为文本字段，你只需要在文本字段中输入所需的旋转角度并按回车即可旋转立方体。\n\
  \n***\n\n#### 列表 7.1. 为 x 轴设置滑块 (cube.html)\n\n点击此处查看代码图片\n\n***\n\n```html\n<div\
  \ id=\"xslider\">\n  <input name=\"range\" id=\"slider\" type=\"range\" min=\"0\"\
  \ max=\"360\" step=\"36\" value=\"0\"/>\n  <label for=\"slider\">X: </label>\n \
  \ <span id=\"xdegrees\">0</span\n</div\n```\n\n***\n\n#### 随着滑块变化旋转 3D 对象\n\n你可以使用\
  \ JavaScript 设置适当的事件处理器来监听每个滑块的变化。你可以在窗口加载完成后运行的 `init` 函数中执行此。在列表 7.2 中，你为三个滑块的每个\
  \ `onchange` 事件创建了事件处理器。当任何滑块发生变化时，都会调用 `rotate` 函数。\n\n#### 列表 7.2. 为滑块变化设置事件处理器\
  \ (cube.js)\n\n点击此处查看代码图片\n\n***\n\n```javascript\nwindow.onload = init;\n\nfunction\
  \ init() {\n  document.getElementById(\"slider\").onchange = rotate;\n  document.getElementById(\"\
  verticalslider\").onchange = rotate;\n  document.getElementById(\"nearnessslider\"\
  ).onchange = rotate;\n}\n```\n\n接下来，你将定义 `rotate` 函数，该函数有三个主要部分，接下来的几节将进行探讨。\n\n\
  ##### 根据滑块指定的旋转角度更新轴标签\n\n`rotate` 函数的第一部分如列表 7.3 所示，它获取每个滑块的值并将这些值存储在变量 `xRotation`、`yRotation`\
  \ 和 `zRotation` 中。然后你更新每个滑块旁边的文本，以指示立方体绕该轴旋转了多少度。\n\n#### 列表 7.3. 更新标签为滑块的当前值 (cube.js)\n\
  \n点击此处查看代码图片\n\n***\n\n```javascript\nfunction rotate(e) {\n  var xRotation = document.getElementById(\"\
  slider\").value;\n  var yRotation = document.getElementById(\"verticalslider\").value;\n\
  \  var zRotation = document.getElementById(\"nearnessslider\").value;\n  //update\
  \ labels\n  document.getElementById(\"xdegrees\").textContent = xRotation;\n  document.getElementById(\"\
  ydegrees\").textContent = yRotation;\n  document.getElementById(\"zdegrees\").textContent\
  \ = zRotation;\n  // 代码继续见列表 7.4\n}\n```\n\n##### 存储之前旋转的值\n\n在 `rotate` 函数的第二部分如列表\
  \ 7.4 所示，你构建字符串来存储将将应用于立方体的 3D 变换值。你将使用变量 `xRotation`、`yRotation` 和 `zRotation`（在列表\
  \ 7.3 中定义）来存储这些值，并在这每个值周围包围适当的字符串以定义旋转。例如，你将持有 x 轴当前旋转角度的 `xRotation` 变量插入字符串 `rotateX()`\
  \ 内部。你对每个轴都执行此操作，将每个完整的字符串存储在变量 `rx`、`ry` 和 `rz` 中。请参阅列表 7.4。\n\n#### 列表 7.4. 为变换创建旋转值的字符串\
  \ (cube.js)\n\n***\n\n```javascript\nfunction rotate(e) {\n  // 接续列表 7.3\n  var\
  \ rx = \"rotateX(\" + xRotation + \"deg) \";\n  var ry = \"rotateY(\" + yRotation\
  \ + \"deg) \";\n  var rz = \"rotateZ(\" + zRotation + \"deg)\";\n}\n```\n\n#####\
  \ 使用 Modernizr 的 prefixed() 方法在所有浏览器中变换立方体\n\n在 `rotate` 函数的最后部分（见列表 7.5）中，你将存储在\
  \ `rx`、`ry` 和 `rz` 变量中的 3D 变换应用于立方体。为了在所有支持这些浏览器中正确应用这些变换，你可以利用 Modernizr 的 `prefixed()`\
  \ 方法（该方法在第 5 章”中引入），以便为 CSS 生成正确的厂商前缀。\n\n#### 列表 7.5. 使用正确的前缀将变换应用于立方体 (cube.js)\n\
  \n点击此处查看代码图片\n\n***\n\n```javascript\nfunction rotate(e) {\n  // 接续列表 7.4\n  var\
  \ cube = document.getElementById(\"cube\");\n  cube.style[prefixed('transform')]\
  \ = rx + ry + rz;\n}\n```\n\n***\n\n#### 注意\n\n在本书中，我们使用了包含了 `prefixed()` 的自定义 Modernizr\
  \ 构建。如果你想使用该方法并下载了自己的 Modernizr 构建，你应该知道它默认是不包含的，但你可以指定包含。\n\n图 7.2 更新 Modernizr\
  \ 构建以包含 prefixed()\n\n![图 7.2](img/07fig2.jpg) （图片：）\n\n要获取更多关于 `prefixed()` 方法的信息，你可以参考\
  \ Modernizr 文档 [`modernizr.com/docs/#prefixed`](http://modernizr.com/docs/#prefixed)，或查看\
  \ Andi Smith 关于该方法的优秀教程，地址为 [`www.andismith.com/2012/02/modernizr-prefixed/`](http://www.andismith.com/2012/02/modernizr-prefixed/)。\n\
  \n***\n\n#### 添加基础样式\n\n现在你需要为滑块创建一些样式并适当放置立方体。由于立方体会在用户移动滑块时绕一个或多个轴旋转，你需要在立方体周围提供足够的空间。你通过绝对定位滑块来实现，为各种\
  \ 3D 旋转组合留出空间（见列表 7.6）。\n\n你还需要对滑块本身以及与每个滑块相关的标签进行样式设置。最难设计的滑块是 y 轴的，你希望将其变为垂直滑块。为了实现这一点，你可以使用\
  \ `-webkit-appearance` 属性。将 `-webkit-appearance` 设置为 `slider-vertical` 会让滑块在支持的浏览器中显示垂直而不是水平。在不支持的浏览器中，滑块将显示为普通的水平滑块。\n\
  \n#### 列表 7.6. 滑块样式 (cube.css)\n\n```css\n#slider {\n  left: 30px;\n}\n\n#yslider\
  \ {\n  position: absolute;\n  right: -110px;\n}\n\n#verticalslider {\n  -webkit-appearance:\
  \ slider-vertical;\n  width: 20px;\n  height: 100px;\n  top: 40px;\n}\n```\n\n\n\
  将 3D 变换与 CSS 动画结合，可以在页面上产生非常强大的效果。在下一节中，我们将概述如何将 3D 变换与 CSS 动画结合以创建复杂的动画。但随着示例变得越来越复杂，你需要开始考虑性能问题。页面上的动画越多、越复杂，你就越需要关注页面性能并查看哪些可以优化。\n\
  \n提高性能的一种方法是使用硬件加速。硬件加速涉及将通常由软件完成转移到硬件（CPU 或 GPU）中，在那里可以处理得更快。在 Web 开发领域，当我们谈论硬件加速时，我们通常特指某些设备将工作从\
  \ CPU 卸载到 GPU（图形处理单元，通常称为 `显卡`）的能力。\n\n## 使用过渡代替关键帧动画来提高性能\n\n为了让你的动画尽可能流畅地播放，一个重要的性能优化技巧是使用可以利用硬件加速的\
  \ CSS3 属性。在 CSS3 中，有几个属性可以利用硬件加速：CSS3 过渡（transitions）以及 `translate3d` 和 `translateZ`。\n\
  \n由于浏览器会在每个过渡的开始和结束之间进行插值计算（即找到中间点），因此过渡比等效的关键帧动画（仅有 0% 和 100% 关键帧）更快，并且可以将某些所需的工作卸载到\
  \ GPU，而 GPU 针对这类图形工作进行了优化。因此，在可能的情况下，你应该使用过渡代替关键帧动画，以最大化性能。\n\n然而，在许多情况下，你无法避免使用关键帧动画。例如，如果你想让动画重复，就必须使用关键帧动画。如果你想在动画中定义多个点，如\
  \ 第 4 章 中“关键帧动画”所述的，你就需要使用关键帧动画，因为它们允许你定义过渡简单无法实现的动画。\n\n## 通过 translate3d 和 translateZ\
  \ get 硬件加速\n\n当你需要使用关键帧动画时，可以做什么来提高动画的性能？你可以利用 `translate3d`、`scale3d`、`rotate3d`\
  \ 和 `translate` 属性。此外，即使你没有理由，也可以使用这些属性。例如，你只需向任何关键帧动画添加 `translate3d(0,0,0)` 即可实现硬件加速。\n\
  \n这种方法相当“黑科技”（hacky），但 script.aculo.us 的创建者 Thomas Fuchs 和 Google Chrome 开发者关系团队的\
  \ Paul Irish 都讨论过。Remy Sharp 还制作了一个惊人的前后对比视频，展示了在添加 `translate3d(0,0,0)` 之后缩放动画变得异常平滑；参见\
  \ [`www.youtube.com/watch?v=IKl78ZgJzm4`](http://www.youtube.com/watch?v=IKl78ZgJzm4)。你将在下一个示例中使用这种通过\
  \ `translate3d` 的方法来提高性能（例如，参见 列表 7.12）。\n\n正如 第 1 章 中“处理 CSS3 动画](#ch01.html_ch01)”所述的，查看使用这些属性是否生效的最佳方法是为任何硬件加速层涂上独特的颜色，以便你可以轻松地看到它们。第\
  \ 1 章 提供了如何在 Chrome 和 Safari 中开启硬件加速层查看的说明。\n\n要进一步讨论 HTML5 和 CSS3 中的性能技术，请参见 Malte\
  \ Ubl 撰写的优秀文章《提高你的 HTML5 的性能》，地址：[`www.html5rocks.com/en/tutorials/speed/html5/`](http://www.html5rocks.com/en/tutorials/speed/html5/)，以及\
  \ Paul Irish 的视频《HTML5, CSS3, 和 DOM 性能》，地址：[`www.youtube.com/watch?v=q_O9_C2ZjoA`](http://www.youtube.com/watch?v=q_O9_C2ZjoA)。\n\
  \n## 随风飘动：制作蒲英籽\n\n在本节中，你将使用一些基础 HTML、CSS 和一张蒲英籽的小型 PNG 图片来构建蒲英花的图形。你会对种子进行多次复制和变换，用许多种子组成一朵蒲英花。构建完成后，你对蒲英花应用一组动画，使其看起来种子正被风吹走并远离。图\
  \ 7.3 显示了应用任何动画之前蒲英花的样子。\n\n![图像](img/07fig03.jpg)\n\n图 7.3. 应用动画前完成的蒲英花\n\n对于此示例，带有所有前缀代码的\
  \ CSS 文件作为单独文件 `dandelion_prefixed.css` 位于书籍的 GitHub 页面：[`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)。要查看与本章列表匹配的精简\
  \ CSS 版本，请查看 `dandelion.css`。另注意，此示例相关的所有文件都在 `ch7code/` 文件夹下的 `dandelion/` 文件夹中。\n\
  \n### 基础 HTML\n\n你最初将从七个元素构建蒲英：容器元素 `dandelion`；一个代表茎的元素；一个蒲英籽的 PNG 图片（你将将其多次复制和变换，用许多种子组成一朵蒲英花）。一旦构建完成，你对蒲英花应用一组动画，使其看起来种子正被风吹走并远离。列表\
  \ 7.7 显示了蒲英的 HTML HTML。\n\n列表 7.7. 蒲英的基础 HTML (dandelion.html)\n\n### 基础 CSS\n\n\
  为了开始样式，你可以给蒲英、茎和种子头设置固定大小、绝对定位和颜色（参见 列表 7.8）。另注意，此示例定义了所有带有前缀的 CSS 代码。\n\n列表 7.8.\
  \ 茎和种子头的样式 (dandelion.css)\n\n### 动画：随风飘动\n\n为了营造出阵风刚刚从屏幕左侧吹过的感觉，你将通过应用一个在 z 轴上旋转的动画让蒲英茎向右弯曲。\n\
  \n在 列表 7.9 中，你首先将 `#stem` 元素的 `transform-origin` 设置为横中间和底部（`50% 100%`）。这确保了当你开始动画它时，茎是从底部旋转的。你还将将\
  \ `#stem` 分配动画 `stemBlow`，该动画同样在 列表 7.9 中定义。\n\n```css\n@keyframes stemBlow {\n\
  \  0% {\n    transform: rotate(0deg);\n  }\n  50% {\n    transform: rotate(15deg);\n\
  \  }\n  100% {\n    transform: rotate(0deg);\n  }\n}\n\n#stem {\n  animation: stemBlow\
  \ 3s infinite alternate;\n}\n```\n\n\n\n\n`stemBlow` 帧动画首先将茎干顺时针方向旋转 18 度。然后，从动画的\
  \ 7% 处开始，茎干向左摆动，一直旋转到超过原始位置 3 度的地方。最后，它再向右摆动，回到顺时针方向的 3 度。这些微小的旋转旨在模拟茎干在完成动作并回到原始位置之前的轻微摇晃。\n\
  \n### 注意\n\n关于此蒲公英示例中的列表 7.9 以及随后的列表，需要注意的一点是，当你在沿 z 轴旋转元素时，你将使用函数 `transform` 中的\
  \ `rotate` 而不是 `rotateZ`。这是因为 `rotate` 是一个 3D 变换，而某些浏览器（特别是 Opera 12 以及 Internet\
  \ Explorer 9 及更早版本）不支持这些 3D 变换。为了让这个示例在这些浏览器中更接近预期效果，你使用了 `rotate`，这样 Internet Explorer\
  \ 9 和 Opera 12 至少可以看到你将应用于蒲公英种子的众多变换中的子集。\n\n从 45% 到 100%，没有变化。这段长时间无变化的原因是，你希望茎干吹动动画的时间比后续涉及吹散种子的动画短。但为了方便协调这些动画，你将对所有动画使用相同的时长（6\
  \ 秒）。因此，为了让 `stemBlow` 动画比后续动画更短，它需要花费部分时间不执行任何更改。\n\n列表 7.9. 弯曲茎 (dandelion.css)\n\
  \n点击此处查看代码图像\n\n```css\n#stem {\n  /* 接续自 列表 7.8 */\n  -webkit-transform-origin:\
  \ 50% 100%;\n  -webkit-animation: stemBlow 6s forwards ease-in;\n}\n\n@-webkit-keyframes\
  \ stemBlow {\n  0%{}\n  7% {\n    -webkit-transform: rotate(18deg);\n  }\n  25%\
  \ {\n    -webkit-transform: rotate(-3deg);\n  }\n  35% {\n    -webkit-transform:\
  \ rotate(2deg);\n  }\n  45% {\n    -webkit-transform: rotate(0deg);\n  }\n  100%\
  \ {\n    -webkit-transform: rotate(0deg);\n  }\n}\n```\n\n### 放置和动画种子\n\n接下来，你将为列表\
  \ 7.7 中定义的三个种子元素添加一些基础样式。所有种子将共享类 `seed`，该类设置了它们的 `background-image` 并赋予它们一个特定的\
  \ `transform-origin`，该位置位于种子图像的底部中间。你还定义了一个选择器来绝对定位包含它的 `#looseSeeds` 元素。并且动画 `blowRight`\
  \ 被分配给了这个包含元素。\n\n动画 `blowRight` 动画是列表 7.10 中定义的最后一个项目，它创建了一个通过增加 `left` 属性值来让 `#looseSeeds`\
  \ 元素（及其所有子元素）跨越屏幕的动画。在 7% 处有一个中间关键帧，这样你可以确保当茎干向右吹动时，种子也以类似的速度向右移动。注意，列表 7.10 使用\
  \ `animation` 简写，并在该简写中将 `animation-fill-mode` 设置为 `forwards`。这确保了种子在动画完成后仍然保持在屏幕外。\n\
  \n列表 7.10. 种子样式化 (dandelion.css)\n\n点击此处查看代码图像\n\n```css\n.seed {\n  -webkit-transform-origin:\
  \ 35px 98px;\n  background-image: url('../img/DandelionSeed.png');\n  width: 100px;\n\
  \  height: 100px;\n  position: absolute;\n}\n\n#looseSeeds {\n  position: absolute;\n\
  \  bottom: 442px;\n  left: 171px;\n  -webkit-animation: blowRight 6s forwards ease-in-out;\n\
  }\n\n@-webkit-keyframes blowRight {\n  0% {  }\n  7% {  left: 290px; }\n  100% {\
  \ left: 1600px; }\n}\n```\n\n### 放置松散种子并分配自定义动画\n\n为了将 `#looseSeeds` 容器 `div` 中的每个种子放置在不同的位置，你为其中两个种子（`#zoomseed`\
  \ 和 `#flipseed`）赋予了自定义的 `rotate` 值，将它们放置在沿 `#seedhead` 的不同角度上（请参见列表 7.11）。`#floatseed`\
  \ 没有 `rotate` 值，将保持不旋转状态。（它看起来可能略微有旋转，但那是因为 `background-image` 中的种子本身略微旋转了。）图 7.4\
  \ 显示了集体放置的结果。\n\n![Image](img/07fig04.jpg)\n图 7.4. 通过变换放置的三个种子\n\n此外，每个种子都使用了它自己的动画：`zoomSeed`、`flip`\
  \ 和 `float`（这些动画在列表 7.12、7.13 以及 7.14 中定义）。你为这些每一个种子分配了各自的动画，持续 6 秒，以使 `stemBlow`\
  \ 动画更短。请记住，`blowRight` 动画应用于松散种子的父元素上。\n\n列表 7.11. 种子的自定义动画 (dandelion.css)\n\n\
  点击此处查看代码图像\n\n```css\n#zoomseed {\n  -webkit-transform: rotate(-80deg);\n  -webkit-animation:\
  \ zoomSeed 6s forwards;\n}\n\n#floatseed {\n  -webkit-animation: float 6s ease-out;\n\
  }\n```\n\n### 使用缩放让种子向观众移动\n\n列表 7.11 中定义的三个 3D 变换是 `zoomSeed`。首先，你将种子放大 3 倍。接下来，通过\
  \ `translate3d` 将其向上移动 105 像素。最后，你逆时针方向旋转 120 度。图 7.5 显示了 7% 和 30% 时的状态。注意，此图展示了应用于\
  \ `#seedseed` 元素的 `zoomSeed` 动画以及 `blowRight` 动画的效果。\n\n列表 7.12. 放大种子 (dandelion.css)\n\
  \n点击此处查看代码图像\n\n```css\n@-webkit-keyframes zoomSeed {\n  0% { }\n  100% {\n    -webkit-transform:\
  \ scale3d(3,3,3) translate3d(0,-105px,0) rotate(-120deg);\n  }\n}\n```\n\n\n\n\n\
  \n最后一个自定义种子动画是 `flip`，它被分配给 `#flipSeed` 元素。在代码列表 7.14 中定义的此动画中，你绕 x 轴旋转该元素。你还在 7%\
  \ 关键帧处通过更改 `translate3d` 来增加 y 值，将该种子略微向上推动。同时，你还在 7% 关键帧处将该元素逆时针旋转 190 度，但你没有将这一变化持续到\
  \ 100% 关键帧。这导致种子旋转回原始的 z 轴位置，产生出美妙的摇动效果。图 7.6 显示了该动画的两个帧。\n\n### 代码列表 7.14.绕 x 轴翻种子\
  \ (dandelion.css)\n\n点击此处查看代码图片\n\n* * *\n\n```css\n@-webkit-keyframes flip {\n\
  \  0% { -webkit-transform-origin: 50% 50%; }\n  7% { -webkit-transform: translate3d(0,\
  \ 25px, 0) rotateX(5deg) rotate(-190deg); }\n  100% { -webkit-transform: rotateX(160deg);\
  \ }\n}\n```\n\n* * *\n\n![Image](img/07fig06.jpg)\n\n图 7.6. 运行中的翻转动画，绕 x 轴旋转种子\n\
  \n```\n<multimedia/07vid03.m4v>\n```\n\n![07vid03.m4v](img/posterimage02.jpg)\n\n\
  视频 7.3. 使用 `rotateX` 绕 x 轴翻转种子\n\n### 添加更多种子\n\n在这一节中，你将增强 HTML 以添加额外的种子，让你的蒲公英看起来更完整。代码列表\
  \ 7.15 添加了五个象限元素。每个象限内都有四个种子。\n\n使用象限的思路是通过简单地旋转容器象限元素来复用种子的布局，从而节省时间并避免单独定位每个种子的麻烦。\n\
  \n### 代码列表 7.15. 带有额外蒲公英种子的丰富 HTML (dandelion.html)\n\n点击此处查看代码图片\n\n* * *\n\n```html\n\
  <div id=\"dandelion\">\n  <div id=\"stem\">\n    <div id=\"seedhead\"></</div>\n\
  \  </div\n  <div id=\"looseSeeds\">\n    <div class=\"seed\" id=\"zoomseed\"></</div>\n\
  \    <div class=\"seed\" id=\"floatupseed\"></</div>\n    <div class=\"seed\" id=\"\
  flipseed\"></</div>\n  </div\n  <div id=\"quadrant1\" class=\"quad\">\n    <div\
  \ class=\"seed\"></div>\n    <div class=\"seed\"></div>\n    <div class=\"seed\"\
  ></div>\n    <div class=\"seed\"></div>\n    <div class=\"seed\"></div>\n  </div\n\
  \  <div id=\"quadrant2\" class=\"quad\">\n    <div class=\"seed\"></div>\n    <div\
  \ class=\"seed\"></div>\n    <div class=\"seed\"></div>\n    <div class=\"seed\"\
  ></div>\n    <div class=\"seed\"></div>\n  </div\n  <div id=\"quadrant3\" class=\"\
  quad\">\n    <div class=\"seed\"></div>\n    <div class=\"seed\"></div>\n    <div\
  \ class=\"seed\"></div>\n    <div class=\"seed\"></div>\n    <div class=\"seed\"\
  ></div>\n  </div\n  <div id=\"quadrant4\" class=\"quad\">\n    <div class=\"seed\"\
  ></div>\n    <div class=\"seed\"></div>\n    <div class=\"seed\"></div>\n    <div\
  \ class=\"seed\"></div>\n    <div class=\"seed\"></div>\n  </div\n  <div id=\"quadrant5\"\
  \ class=\"quad\">\n    <div class=\"seed\"></div>\n    <div class=\"seed\"></div>\n\
  \    <div class=\"seed\"></div>\n    <div class=\"seed\"></div>\n    <div class=\"\
  seed\"></div>\n  </div\n</div\n```\n\n* * *\n\n#### 通过变换象限来放置额外种子\n\n现在，你将设置一个包含四个种子的象限，然后你将添加额外的象限，并旋转和定位这些象限及其包含的所有种子。这将省去你单独放置每个种子的麻烦。\n\
  \n在代码列表 7.16 中，所有象限默认都设置为运行相同的 `blowRight` 动画，该动画之前在单个种子上定义并使用过（在代码列表 7.10 中）。这导致每个象限稳定地向右移动，直到完全超出屏幕，看起来就像所有种子都在随风飘动。\n\
  \n在代码列表 7.16 中，你还为 `#quadrant3` 和 `#quadrant5` 中的种子提供了自定义的旋转和位置。\n\n### 代码列表 7.16.\
  \ 动画每个象限 (dandelion.css)\n\n点击此处查看代码图片\n\n* * *\n\n```css\ndiv[id^=\"quadrant\"\
  ] {\n  position: absolute;\n  bottom: 339px;\n  left: 171px;\n  -webkit-transform-origin:\
  \ 100% 100%;\n  width: 120px;\n  height: 120px;\n  -webkit-animation: blowRight\
  \ 6s ease-in;\n}\n\n#quadrant3 {\n  -webkit-transform: rotate(180deg);\n  bottom:\
  \ 378px;\n  left: 171px;\n}\n\n#quadrant5 {\n  -webkit-transform: rotate(40deg)\
  \ scale3d(.8,.8,.8);\n  bottom: 32px;\n  left: 10px;\n}\n```\n\n* * *\n\n#### 变换的自定义动画\n\
  \n处理变换和动画的挑战之一是，一旦你对元素进行了变换——如列表 17—设置 `left` 值将无法预期工作，因为 z 轴已经偏移。为了确保所有象限与茎同步移动，你为\
  \ `quadrant2` 和 `quadrant4` 定义了自定义动画（见图 7.7）。\n\n尽管你现在正将所有象限移动到屏幕右侧，但你仍然可以让这种动画更好。让所有新种子在原始位置仅向右移动并不有趣。当阵风吹过蒲公英时，种子往往向各个方向移动，而不仅仅是向风的方向。\n\
  \n你可以采取之前的方法，给每个种子分配自己的自定义动画。但这样做很复杂，而且为了获得种子被吹的效果并非如此。与其单独动画所有种子元素，不如利用 `nth-of-type`\
  \ 伪类，让给定象限中的第一个、第二个、第三等种子以相同的方式动画。\n\n##### 配置每个 .quad 中的第一个种子\n\n在代码列表 7.18 中，你将每个\
  \ `quad` 类元素中的第一个种子逆时针方向旋转 20 度。你还沿 x 轴正方向推 5 像素，并沿 y 轴负方向向上推 5 像素（将种子向上推外）。\n\n\
  你还为每个 `.quad` 元素的第一个种子分配了动画 `seedChange1`。该动画将种子从起始位置（z 轴上的 -20 度）旋转到动画结束时的 60 度旋转。它还将种子推得比开始时更远，一直到其原始位置上方\
  \ 50 像素。\n\n```css\n.quad div:nth-of-type(1) {\n  -webkit-transform:rotate(-20deg)\
  \ translate3d(5px,-5px,0);\n}\n```\n\n\n\n\n```css\n  -webkit-animation: seedChange1\
  \ 6s;\n}\n\n@-webkit-keyframes seedChange1 {\n  0% {}\n  100% { -webkit-transform:\
  \ rotate(60deg) translate3d(5px,-15px,0);}\n}\n```\n\n* *\n\n你将相同的概念应用于所有后续的种子上——从每个\
  \ `div class=\"quad\"` 中的第二个种子到每个 `div class=\"quad\"` 中的第五个种子。我们不需要逐个处理，接下来的章节将共同查看剩余定义。\n\
  \n### 为每个象限中的第 *n* 个种子赋予独立动画\n\n在列表 7.19 中，你定义了每个 `.quad`元素中第二、第三、第四和第五个种子的初始旋转角度，然后为它们每一个分配了不同的关键帧动画。对于第三和第五个种子，你还为它们添加了位移。这里的思路是改变种子经过的路径，以便它们的扩散效果看起来是半随机的。\n\
  \n**列表 7.19. 设置种子的动画 (dandelion.css)**\n\n点击此处查看代码图像\n\n* *\n\n```css\n.quad div:nth-of-type(2)\
  \ {\n  -webkit-transform: rotate(-30deg);\n  -webkit-animation: seedChange2 6s;\n\
  }\n\n.quad div:nth-of-type(3) {\n  -webkit-transform: rotate(-76deg) translate3d(-5px,0,0);\n\
  \  -webkit-animation: seedChange3 6s;\n}\n\n.quad div:nth-of-type(4) {\n  -webkit-transform:\
  \ rotate(-50deg);\n  -webkit-animation: seedChange4 6s;\n}\n\n.quad div:nth-of-type(5)\
  \ {\n  -webkit-animation: seedChange5 6s;\n  -webkit-transform: rotate(-100deg)\
  \ translate3d(-5px,-5px,0);\n}\n```\n\n* *\n\n在列表 7.20 中，你定义了所有剩余的关键帧动画，规定了每个 `.quad\
  \ div` 元素中第二到第五个种子的行为。\n\n这些动画的工作方式是：每个 `.quad div` 元素中的第二、第三、第四和第五个种子都会运行各自的动画。例如，每个象限中的第四个种子（总共有五个，因为有五个象限）都会运行\
  \ `seedChange4` 动画。然而，由于每个种子位于不同的象限中，且它们具有不同的绝对位置，`translate3d` 应用于种子实际开始的位置。因此，虽然象限\
  \ 3 中的种子 2 在某种程度上看起来像象限 1 中种子 2 的镜像，但这些动画与早先移动种子跨越屏幕的动画变化相结合，将提供足够的多样性来使这些动画保持趣味性。图\
  \ 7.8 显示了 50% 关键帧处的完成动画。\n\n![Image](img/07fig08.jpg)\n\n图 7.8. 动画进行一半\n\n<multimedia/07vid04.m4v>\n\
  \n![07vid04.m4v](img/posterimage02.jpg)\n\n视频 7.4. 完成的种子散射动画\n\n**列表 7.20. 单个种子动画\
  \ (dandelion.css)**\n\n点击此处查看代码图像\n\n* *\n\n```css\n@-webkit-keyframes seedChange2\
  \ {\n  0% {}\n  100% { -webkit-transform: rotate(40deg) translate3d(5px,5px,0);}\n\
  }\n\n@-webkit-keyframes seedChange3 {\n  0% {}\n  100% { -webkit-transform: rotate(20deg)\
  \ translate3d(50px,-5px,0);}\n}\n\n@-webkit-keyframes seedChange4 {\n  0% {}\n \
  \ 100% { -webkit-transform: rotate(10deg) translate3d(5px,-5px,0);}\n}\n\n@-webkit-keyframes\
  \ seedChange5 {\n  0% { -webkit-transform-origin: 100% 50%; }\n  30% { -webkit-transform:\
  \ rotateX(60deg) scale3d(2,1.2,2);}\n  100% { -webkit-transform:\n    rotate(-10deg)\
  \ rotateX(85deg) translate3d(5px,-5px,0);}\n}\n```\n\n* *\n\n* *\n\n### 更多资源\n\n\
  关于硬件加速的更多信息，我推荐以下资源：\n\n• Martin Kool 的《Let’s Play with Hardware-Accelerated CSS》：http://mobile.smashingmagazine.com/2012/06/21/play-with-hardware-accelerated-css/](http://mobile.smashingmagazine.com/2012/06/21/play-with-hardware-accelerated-css/)\n\
  \n\n\n\n\n在你开始制作本章示例的任何动画之前，让我们先回顾一下构成它的的 HTML 和基础 CSS 样式。你将为这些元素分配描述性的 ID，例如 `#paper`\
  \ 和 `#roller`，分别代表打字机中的纸和移动纸的滚轮。你还将利用类（classes）作为触发器，让动画从一个场景移动到另一个场景。此动画总共有五个场景，因此你将使用五个与场景相关的类：`scene1`\
  \ 到 `scene5`。\n\n请注意，为了简洁起见，本章对任何 CSS3 属性都仅使用了 `-moz-` 厂商前缀。你可以在书籍的 GitHub 站点的 `ch8code`\
  \ 文件夹中找到带有所有适当厂商前缀的代码：[`alexisgo.github.com/LearningCSSAnimations`](http://alexisgo.github.com/LearningCSSAnimations)。\n\
  \n### 动画的核心 HTML\n\n示例的 HTML 分为两个主要的 `section` 元素：`#quote` 和 `#subscenes`。`#quote`\
  \ 包含两个段落，每个段落存储引言的一部分。`#quote` 内部的第一个段落作为场景 1 的基础。`#subscenes` 内部的元素形成场景 2 到 4，然后\
  \ #`quote` 内部的第二个（也是最后一个）段落构成了场景 5。列表 8.1 显示了相关的 HTML 元素。\n\n列表 8.1. 引言动画的基础 HTML\
  \ (woolf.html)\n\n点击此处查看代码图像\n\n* *\n\n```html\n<div id=\"container\">\n  <div id=\"\
  roller\"></div>\n  <div id=\"paper\">\n    <div id=\"quote\">\n      <!-- 引言的第一部分将通过\
  \ JavaScript 填充 -->\n      <p id=\"one\"></p>\n      <p id=\"two\">\n        One\
  \ cannot<br class=\"skip\">\n        think well,<br class=\"skip\">\n        love\
  \ well,<br class=\"skip\">\n        sleep well<br class=\"skip\">\n        <!--\
  \ 引言的剩余部分将通过 JavaScript 填充 -->\n      </p>\n    </div> <!-- end quote -->\n    <div\
  \ id=\"subscenes\">\n      <div id=\"think\">\n        THINK\n      </div>\n   \
  \   <div id=\"well\">\n        WELL\n      </div>\n      <div id=\"love\">\n   \
  \     <p>LOVE WELL</p>\n      </div>\n      <div id=\"sleep\">\n        <span>SLEEP</span>\n\
  \        <span>WELL</span>\n      </div>\n    </div>\n  </div>  <!-- end paper -->\n\
  </div> <!-- end container -->\n```\n\n* *\n\n#### 使用 @font-face 使用自定义字体\n\n为了让动画引言中的字母看起来像是由打字机打印出来的，你可以使用使用由\
  \ Johan Holmdahl 设计的 1942Report 字体，该字体可以在 [`www.fontsquirrel.com/fonts/1942-report`](http://www.fontsquirrel.com/fonts/1942-report)\
  \ 找到。从该链接中，你可以下载 `@font-face` 套件包以节省时间。\n\n`@font-face` 规则规则的工作方式是：你定义你想要使用的字体族（font\
  \ family），然后在 `src` 属性中定义该字体所在的 URL。如果用户的电脑上没有该字体，浏览器将访问提供的 URL 并下载字体供浏览器使用（且*仅*供浏览器使用——它将无法用于其他应用程序，如\
  \ Microsoft Word）。\n\n并不是所有浏览器都支持相同的字体文件类型。例如，EOT 是在 Internet Explorer 8 及更早版本中唯一有效的文件类型。为了兼容所有浏览器，你必须为所选字体提供所有相关的文件类型。这就是像\
  \ Font Squirrel 这样的工具大显身手的地方。不需要从头生成所有代码，只需选择你喜欢的字体并从 [`www.fontsquirrel.com`](http://www.fontsquirrel.com)\
  \ 下载 `@font-face` 套件包。当你下载 `@font-face` 套件包时，不仅将获得所有的字体文件类型（包含在 `@font-face` 压缩文件中），所需的\
  \ CSS 也会提供在一个名为 `stylesheet.css` 的文件中。\n\n对于此示例，你可以将所有字体文件移动到名为 `fonts` 的专用文件夹，将\
  \ `stylesheet.css` 文件重命名为 `font.css`，并更新字体路径以反映其新位置。列表 8.2 显示了最终的 `@font-face` 规则。\n\
  \n列表 8.2. 为自定义字体定义 @font-face 规则 (font.css)\n\n点击此处查看代码图像\n\n* *\n\n```css\n@font-face\
  \ {\n    font-family: '1942report1942report';\n    src: url('../fonts/1942-webfont.eot');\n\
  \    src: url('../fonts/1942-webfont.eot#iefix') format('opentype'),\n    src: url('../fonts/1942-webfont.woff')\
  \ format('woff'),\n    src: url('../fonts/1942-webfont.ttf') format('truetype'),\n\
  \    src: url('../fonts/1942-webfont.svg#1942report') format('svg');\n    font-weight:\
  \ normal;\n}\n```\n\n* *\n\n由于该引言是你将使用的唯一字体，你将其分配给 `body` 选择器，如 列表 8.3 所示。\n\n列表\
  \ 8.3. Body 的字体和背景 (wolf.css)\n\n点击此处查看代码图像\n\n* *\n\n```css\nbody {\n  background-color:\
  \ #D3D3D3;\n  font-family: '1942report1942report', sans-serif;\n}\n```\n\n* *\n\n\
  打字机滚轮元素\n\n为了让它看起来像在移动，你稍后将使用一种关键帧（keyframes），如 列表 8.4 所示。这种方法通过渐变来实现滚轮的效果。（为了简洁起见，代码中仅包含了\
  \ `-moz-` 前缀）。\n\n列表 8.4. #roller 元素样式 (wolf.css)\n\n点击此处查看代码图像\n\n* *\n\n```css\n\
  #roller {\n  width: 100%;\n  height: 80px;\n  position: absolute;\n  bottom: 0px;\n\
  \  background: rgb(66,65,65); /* Old browsers */\n  background: -moz-linear-gradient(top,\n\
  \    rgba(66,65,65,1) 0%, rgba(66,65,65,1) 6%,\n    rgba(109,108,108,1) 38%, rgba(234,232,232,1)\
  \ 50%,\n    rgba(109,108,108,1) 64%, rgba(66,65,65,1) 94%,\n    rgba(66,65,65,1)\
  \ 100%); /* FF3.6+ */\n}\n```\n\n* *\n\n接下来，你可以对将打印引言的 `#paper` 元素设置样式。为了让它看起来像绕着滚轮，这将使用从白色到浅米色的\
  \ CSS 渐变，大部分颜色出现在元素底部。这提供了纸张卷曲的错觉。此外，你将在左下和右下角设置 `border-radius`，使纸张向内略微卷曲，从而产生透视感。列表\
  \ 8.5 提供了这些代码，而 图 8.2 显示了纸底部的特写。\n\n![Image](img/08fig02.jpg)\n\n图 8.2. #paper 元素的特写\n\
  \n列表 8.5. #paper 元素样式 (wolf.css)\n\n点击此处查看代码图像\n\n* *\n\n```css\n#paper {\n  width:\
  \ 85%;\n  margin: 0 auto;\n  height: 500px;\n  padding-bottom: 25px;\n  overflow:\
  \ hidden;\n  position: relative;\n  background: rgb(255,255,255); /* Old browsers\
  \ */\n  background: -moz-linear-gradient(top,\n    rgba(255,255,255,1) 0%,\n   \
  \ rgba(249,247,247,1) 88%, rgba(249,248,247,1) 92%,\n    rgba(239,233,222,1) 97%,\
  \ rgba(219,215,210,1) 99%,\n    rgba(211,207,201,1) 100%); /* FF3.6+ */\n  border-bottom-right-radius:\
  \ 5px 20px;\n  border-bottom-left-radius: 5px 12px;\n}\n```\n\n### 场景 1：让引言在屏幕上上升\n\
  \n\n\n\n如本章开头所述，你将构建的动画分为五个主要场景。第一个场景显示引用文字的前五行，纸张每次向上推一行，以显示引用文字的每个新部分。同时，你将对打字机滚轮的\
  \ `background-position` 变化制作动画。这将产生一种错觉，即打字机滚轮正在旋转并在移动时将纸张向上。\n\n为了实现预期的效果，你需要的几个动画。从的一行到下一行的每次转换都需要单独的动画。为了让它们一个接一个地播放，你需要确保之前的动画和随后的动画之间有适当的延迟。\n\
  \n将显示的所有引用文字行都直接包含在名为 `#quote` 的 `div` 中。该 `div` 的 `top` 属性将为每一行进行修改，逐渐将 `div` 向上拉得越高以显示更多文本。\n\
  \n### 使用关键帧动画使引用向上移动\n\n此时，你必须确定纸张向上移动多远，以产生打字机打字的印象。其中最困难的部分是确定 `top` 的正确值。确定此值最简单的方法是使用工具，例如\
  \ Firefox 的 Firebug ([`getfirebug.com`](http://getfirebug.com)) 或 Chrome 或 Safari\
  \ 中内置的 Web 开发人员工具。如果你不熟悉这些工具，可以在 [`developers.google.com/chrome-developer-tools/docs/overview#window`](https://developers.google.com/chrome-developer-tools/docs/overview#window)\
  \ 找到关于 Chrome 开发者工具的良好教程。\n\n在 Firebug 中，你可以尝试 `top` 的不同起始值，直到找到显示每行文字时 `div` 的合适位置。你需要找到正确的值，以便显示你将用于显示的引用文字所用的大字体。例如，在图\
  \ 8.3 中，你可以看到显示引用文字第三行的合适位置是 `top: 100px`。\n\n![Image](img/08fig03.jpg)\n\n图 8.3.\
  \ 使用 Firebug 为每个句子确定适当的 top 值\n\n一旦你确定了每一行 `#quote div` 的正确位置（并且根据选择的字体类型和大小，前五行的这些值分别为\
  \ 300、200、90、–20 和 -140 像素），你就可以设置适当的关键帧了。\n\n你不需要为第一行设置动画，因为当页面加载时，第一个句子已经在视图中了。第二行需要将\
  \ `#quote` `div` 从 `top:300px` 位置移动到 `top:200px` 位置，前者只显示第一行（“a good dinner”），后者则显示了下一行（“is\
  \ of great”）。列表 8.6 显示了代码。\n\n列表 8.6. 向上移动 #paper 元素以显示第二行 (woolf.css)\n\n```\n\
  @-moz-keyframes line2 {\n  0% {top: 300px;}\n  100% { top: 200px;}\n}\n```\n\n接下来，你使用用\
  \ `line2` 关键帧建立的基本模式，并定义如何继续向上移动纸张以一次显示一行（参见列表 8.7）。\n\n列表 8.7. 为后续行设置关键帧 (woolf.css)\n\
  \n```\n@-moz-keyframes line3 {\n  0% {top: 200px;}\n  100% { top: 90px;}\n}\n\n\
  @-moz-keyframes line4 {\n  0% {top: 90px;}\n  100% { top: -20px;}\n}\n\n@-moz-keyframes\
  \ line5 {\n  0% {top: -20px;}\n  100% { top: -140px;}\n}\n```\n\n### 将多个关键帧动画链联起来\n\
  \n按顺序播放每个动画的关键在于适当管理它们之间的延迟。第一行和第二行之间的延迟只需要足够阅读第一行文字的时间，因为第一行没有播放动画。但为了近似从第二行移动到第三行所需的时间，你必须考虑两点：在\
  \ `line2` 动画播放之前应用的延迟，以及 `line2` 动画本身的持续时间。\n\n让这变得复杂的原因是，正如你之后会看到的，你最终将为每个字母的出现制作动画，就像你实际上在打字一样。列表\
  \ 8.8 显示了应用到每一行的延迟以及注释。这段代码对延迟的使用在下一节之后将变得清晰，当你使用 `letters()` 函数添加打字效果时。带有适当延迟的链联动画在列表\
  \ 8.8 中详细列出。\n\n列表 8.8. 链联换行符动画 (woolf.css)\n\n点击此处查看代码图像\n\n```css\n#quote.scene1\
  \ {\n  position: absolute;\n  top: 300px;\n  -moz-transition: opacity 0.8s;\n  -moz-animation:\
  \ line2 0.8s,\n                   line3 0.8s,\n                   line4 0.8s,\n\
  \                   line5 0.8s;\n}\n```\n\n### 使用 JavaScript 触发动画\n\n你现在已经设置了第一个场景的所有动画，但还没有触发其中任何一个。`#quote`\
  \ 元素或 `#roller` 元素没有任何 `scene1` 类。为了改进，你将定义一个 JavaScript 函数 `setup` 来配置时间。列表 8.9\
  \ 显示了 `setup` 函数的开头。`text` 和 `text2` 变量包含了引用文字的片段，将在之后使用。\n\n列表 8.9. 使用 JavaScript\
  \ 触发动画 (woolf.js)\n\n点击此处查看代码图像\n\n```javascript\n$(document).ready(setup);\n\n\
  function setup() {\n  var text = \"...a good dinner/is of great/importance/to talk/One\
  \ cannot/\";\n  var text2 = \"if one has not/dined well/-Virginia Woolf\";\n  $('#roller,\
  \ #one').addClass('scene1');\n  letters(250, \"#one span, #one br\", \"#one\", text);\n\
  }\n```\n\n### 使用 JavaScript 和关键帧动画逐个显示字母\n\n接下来，你将设置代码让字母逐个出现在纸张元素上，这将通过一个名为 `letters`\
