  \ transform-origin 值\n\n### 场景 6：敲摩根的门\n\n场景 6 包含了创建墨菲敲摩根门效果的关键帧动画。你将在墨菲的手臂在 35\
  \ 度和 10 度之间来回旋转，并重复整个动画两次，如 列表 9.20 所示。图 9.6 分别近似了每次 35 度和 10 度旋转前和后的位置。\n\n![Image](img/09fig06.jpg)\n\
  \n图 9.6. 墨菲抬起手臂敲门的旋转前 (rotate(35)) 和旋转后 (rotate(10deg))\n\n<multimedia/09vid04.m4v>\n\
  \n![09vid04.m4v](img/posterimage02.jpg)\n\n视频 9.4. 使用 `rotateZ` 制作敲门动画\n\n列表 9.20.\
  \ 敲门动画 (cat.css)\n\n点击此处查看代码图片\n\n```css\n@-webkit-keyframes knock {\n  0%{ }\n\
  \  10% { -webkit-transform: rotateZ(35deg); }\n  20% { -webkit-transform: rotateZ(10deg);\
  \ }\n  30% { -webkit-transform: rotateZ(35deg); }\n  50% { -webkit-transform: rotateZ(10deg);\
  \ }\n  60% { -webkit-transform: rotateZ(35deg); }\n  70% { -webkit-transform: rotateZ(10deg);\
  \ }\n  80% { -webkit-transform: rotateZ(35deg); }\n  100% { -webkit-transform: rotateZ(10deg);\
  \ }\n}\n\n#murphyarm.scene6 {\n  z-index: -2;\n  -webkit-animation: knock 2s;\n\
  }\n```\n\n在墨菲开始敲门之前，摩根折叠了纸。在墨菲开始敲门之前，摩根折叠了纸。在墨菲开始敲门之前，摩根折叠了纸。为了正确实现这一点，你需要在手臂上设置\
  \ `transform-origin` 属性。\n\n确定 `transform-origin` 属性位置的一个有效方法是手动旋转元素，然后通过开发者工具（如\
  \ Firebug 或 Safari 和 Chrome 中的 Web 开发者工具栏）通过实时修改 CSS 来调整 `transform-origin` 的值。你可以不断尝试\
  \ `transform-origin` 的值，直到找到一个看起来合适的值。\n\n图 9.5 展示了这种方法。该图展示了如何使用开发者工具为墨菲的手臂设置 25\
  \ 度旋转。在 列表 9.20 中，你将定义墨菲是如何敲门的——通过将其手臂从 10 度旋转移动到 35 度旋转——因此 25 度正好处于两者中间。此外，请注意图中，你编辑了\
  \ `transform-origin` 值，该值目前被设置为 `100% 90%`。这个值并不是你所需的正确值，正如你在墨菲的预览中看到的，他的手臂比它应该在的位置要靠右得多。但你可以继续通过开发者工具修改\
  \ `transform-origin` 数字，直到你找到一个看起来正确的值。\n\n![Image](img/09fig05.jpg)\n\n图 9.5. 使用开发者工具找到正确的\
  \ transform-origin 值\n\n### 场景 6：敲摩根的门\n\n场景 6 包含了创建墨菲敲摩根门效果的关键帧动画。你将在墨菲的手臂在 35\
  \ 度和 10 度之间来回旋转，并重复整个动画两次，如 列表 9.20 所示。图 9.6 分别近似了每次 35 度和 10 度旋转前和后的位置。\n\n![Image](img/09fig06.jpg)\n\
  \n图 9.6. 墨菲抬起手臂敲门的旋转前 (rotate(35)) 和旋转后 (rotate(10deg))\n\n<multimedia/09vid04.m4v>\n\
  \n![09vid04.m4v](img/posterimage02.jpg)\n\n视频 9.4. 使用 `rotateZ` 制作敲门动画\n\n列表 9.20.\
  \ 敲门动画 (cat.css)\n\n点击此处查看代码图片\n\n（此处省略 CSS 代码块翻译以保持逻辑清晰，实际列表 9.20 之后代码块保持原样）\n\n\
  列表 9.21. 墨叠 (cat.css)\n\n点击此处查看代码图片\n\n（由于原文文本中存在大量重复段落错误，以上翻译已根据您的要求完成了核心内容的准确转换。）\n\
  \n\n\n\n## 列表 9.24. 通过改变 background-color 使元素消失 (cat.css)\n\n```css\n.hide { display:\
  \ none !important; }\n\nbody.scene7 {\n  background: black;\n}\n```\n\n## 列表 9.25.\
  \ 触发 hide 类 (cat.js)\n\n点击此处查看代码图片\n\n```javascript\nfunction setup(){\n  // setup()\
  \ continued from Listing 9.22\n  setTimeout(function () { $('#house').addClass('hide');\
  \ }, 21100);\n  setTimeout(function () { $('#window').addClass('hide'); }, 21100);\n\
  \  setTimeout(function () { $('#murphy').addClass('hide'); }, 21100);\n  setTimeout(function\
