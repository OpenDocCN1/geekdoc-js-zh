  \ }, 21500);\n}\n```\n\n## 为最终场景的报纸设置样式\n\n为了让最后的报纸看起来更真实，你可以给它一个从灰到白色的渐变，并不均匀地圆角，使其看起来像是在左上角向上卷曲，右下角向后折叠。列表\
  \ 9.26 提供了代码，图 9.7 显示了动画后的报纸。\n\n![Image](img/09fig07.jpg)\n\n图 9.7. 旋转动画结束后的报纸\n\
  \n<multimedia/09vid05.m4v>\n\n![09vid05.m4v](img/posterimage02.jpg)\n\n视频 9.5. 旋转报纸的动画\n\
  \n### 列表 9.26. 为报纸设置样式 (cat.css)\n\n点击此处查看代码图片\n\n```css\n.newsprint {\n  background-color:\
  \ rgb(242,242,242);\n  background-image:\n  -webkit-gradient(radial, center top,\n\
  \    200, center top,300,\n    from(rgba(255, 255, 255, 0)),\n    to(rgba(255, 255,\
  \ 255, 0.9))),\n  -webkit-gradient(linear, center top,\n    right bottom,\n    from(rgba(0,\
