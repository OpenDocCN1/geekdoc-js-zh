  <div id=\"container\">\n  <div id=\"balloon\"></div>\n  <div id=\"string\"></div>\n\
  </div>\n```\n\n## 总结\n\n在本章中，你学习了关键帧动画的基础，包括如何设置关键帧本身，以及在建立关键帧后通过一系列属性对动画进行配置。本章探讨了许多比过渡（transitions）提供更细粒度控制的属性，并且练习了在单个元素中组合多个关键帧。\n\
  \n## 挑战\n\n你在本章中创建的这个弹簧弹跳动画比较简单。在现实中，弹簧的弹跳次数可能会比你的多得多。以 `spring.html` 文件为基础，但修改关键帧以包含至少八次压缩和回弹，将示例目前的四个循环增加一倍。\n\
  \n另一个挑战是从气球动画示例开始，通过同时对字符串也进行动画处理使其更真实。你可能想以类似于气球旋转的方式让字符串往复旋转。如果你这样做，请记住将字符串的 `transform-origin`\
  \ 从默认值（50% 50%）更改为更真实的锚点（可能是 50% 0%）。\n\n\n\n作为最后一个挑战，尝试为支持 CSS 动画的浏览器为本章的示例添加一个回退错误消息。使用你之前为气球示例创建的回退方案作为模板，并为\
  \ `spring.html` 示例以及章节早期的各种颜色变化示例添加回退。\n\n## 5. 使用视差滚动创建 3D 效果\n\n将关键帧动画、变换（transforms）与视差滚动结合，可以让你创建出丰富且吸引人的内容，在无需进行任何\
  \ 3D 操作的情况下具有 3D 感。本章将引导你如何在 2D 空间创建一个具有深度感的沉浸式页面。\n\n## 视差滚动简介\n\n视差滚动是一种技术，其中背景图像相对于相机（或查看网页的人）移动的速度比前景图像慢。通过创建一个具有多个图层的页面，然后让每一层以不同的速度移动过屏幕，你可以营造出深度幻觉。\n\
  \n典型的视差滚动效果是背景移动速度最慢，中景移动比背景快，而前景移动最快。由于每一层的移动速度不同，网站看起来是 3D 的，但实际上每个层都是 2D 且存在于\
  \ 2D 空间中。\n\n为了在本章的示例中创建视差滚动，你将结合之前使用过的几个概念，包括 `transform` 属性和关键帧动画。\n\n### 三层视差滚动动画\n\
  \n在这个示例中，你将创建一个机器人穿过沙漠的动画。它将是一个简单的 GIF 风格动画，从左向右滚动并无限循环。为了创建这个动画，你将利用关键帧动画和视差滚动的概念。这个动画将三个移动部分：一个重复的背景、前景中的精灵和一个中景中的精灵。每个元素将以不同的速度移动，从而产生深度幻觉。\n\
  \n***\n\n注意\n\n为了保持章节代码示例简洁，在本例及后续所有示例中，我仅使用了 `-webkit-` 厂商前缀。一如既往，你可以在这本书的 GitHub\
  \ 页面上的代码中找到所有的厂商前缀：[`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)。与本章相关的代码可以在\
  \ `ch5code/` 文件夹中找到。你可以在此处找到你将创建的两个示例的演示：[`alexisgo.github.com/LearningCSSAnimations/ch3code/`](http://alexisgo.github.com/LearningCSSAnimations/ch3code/)。\n\
  \n***\n\nListing 5.1 显示了你用于沙漠动画的基础 HTML。\n\nListing 5.1. 沙漠动画的 HTML 元素 (parallaxLoop.html)\n\
  \n***\n\n```html\n<body\n  <div id=\"desert\">\n    <div id=\"tumbleweed\"></div>\n\
  \    <div id=\"shadow\"></div>\n    <div id=\"robot\"></div>\n  </>\n</body>\n```\n\
  \n***\n\n### 创建背景\n\n你需要创建的动画的第一层是背景。这一层将是三层中移动最慢的。你将通过使用关键帧动画来修改背景图像的 `background-position`\
  \ 属性，使背景产生重复。\n\n你用于背景的图像将不断重复。由于这种重复，图像的左边缘和右边缘需要是完全相同的，这样当背景重复时，它们就能融合在一起。图 5.1\
  \ 显示了一张沙漠的照片，你将用它作为背景图像。\n\n![Image](img/05fig01.jpg)\n\n图 5.1. 起始背景图像\n\n如果这张图像水平重复，它将无法良好融合，因为左右边缘差异很大。为了修复这个问题，你首先将图像的画布调整为原始宽度的两倍。然后，你复制并粘贴原始图像并进行水平翻转（参见图\
  \ 5.2）。你现在有一张由两张相同沙漠图片的镜像组成的沙漠图片。因为图像的两个边缘现在是相同的，当图像重复时，它们将融合在一起。\n\n![Image](img/05fig02.jpg)\n\
  \n图 5.2. 最终的背景沙漠图像，由于边缘相同，重复时将融合在一起\n\n为了使你对 `background-position` 属性的任何更改生效，你需要让动画的视口（换句话说，即可见区域）比实际背景图像小。在这种情况下，你将把\
  \ `#desert` 视口（动画所在区域的大小）设置为背景图像大小的一半（参见 Listing 5.2）。\n\nListing 5.2. 设置容器元素 (parallaxLoop.html)\n\
  \n点击此处查看代码图像\n\n***\n\n```css\n#desert {\n  background-image: url('img/desert.jpg');\n\
  \  overflow: hidden;\n  width: 400px;\n  height: 484px;\n  position: relative;\n\
  }\n```\n\n***\n\n在 Listing 5.3 中，你设置了关键帧和背景。循环背景的关键在于对 `background-position` 的巧妙使用。背景的垂直位置不会改变，因此保持为\
  \ `0%`。你可以通过将背景的最终位置设置为 `-800px` 来让背景水平移动。这会导致背景向左移动直到完全超出屏幕。虽然你没有显式设置 `background-repeat`\
  \ 属性，但由于默认值是 `repeat`，这是实现功能的关键。在 `100%` 关键帧处，页面视口将位于重复图像上，因为背景已经移出屏幕。由于你向现有选择器添加了新代码，我在\
  \ Listing 5.3 中加粗了新代码。\n\nListing 5.3. 使用关键帧和 background-position 让沙漠循环 (parallaxLoop.html)\n\
