  ![10vid02.m4v](img/posterimage02.jpg) \n\n视频 10.2. 成分标签的渐入\n\n列表 10.11. 成分名称的渐入\
  \ (drinks.css)\n\n点击此处查看代码图像\n\n```css\n@-webkit-keyframes ingredientFadeIn {\n\
  \  0% { color: transparent;}\n  100% { }\n}\n\n.tumbler div p strong {\n  font-size:\
  \ 0.9em;\n  -webkit-animation: ingredientFadeIn 1s 2s both;\n}\n\n#coke p strong\
  \ {\n  -webkit-animation-delay: 5s;\n}\n```\n\n### 添加第二种饮料\n\n现在，你将重复刚才描述的过程来定义第二种饮料：汤姆柯林士（Tom\
  \ Collins）。和朗姆可乐一样，汤姆柯林士由一个包含性的 `section` 元素、每个成分对应的 `div` 元素，以及 `div` 内部代表每个成分的\
  \ `p` 和 `strong` 元素组成。饮料由一个 `h2` 元素结束，显示该饮料的名字（参见列表 10.12）。\n\n列表 10.12. 汤姆柯林士的\
  \ HTML (drinks.html)\n\n```html\n<section id=\"tomcollins\">\n  <div class=\"tumbler\"\
  >\n    <div id=\"tcGin\">\n      <p><strong>Gin</strong></p>\n    </div>\n    <div\
  \ id=\"tcClubSoda\">\n      <p><strong>Club Soda</strong></p>\n    </div>\n    <div\
  \ id=\"tcLemon\">\n      <p><strong>Lemon</strong></p>\n    </div>\n  </div>\n \
  \ <h2>Tom Collins</h2>\n</section>\n```\n\n#### 第二种饮料的基础样式\n\n在列表 10.13 中，你定义了饮料及其所有成分的基础样式。你将这种饮料定位在容器\
  \ `#bar` 元素的左侧 250 像素处（该元素是包含块）。第一个成分金酒（gin）位于玻璃杯的底部。由于它占了饮料的两部分，你将它的尺寸设置为 20%。在\
  \ `p` 元素中，你同时设置了顶部边框颜色和 `background-color`（背景颜色）。\n\n接下来，你为第二种成分苏打水（club soda）设置了初始位置、高度、`background-color`（背景颜色）和\
  \ `animation-delay`（动画延迟）。为了让苏打在金酒完成 `rise`（上升）动画后才开始上升，你设置在等待 2 秒钟后，再在 `#tcClubSoda`\
  \ 的 `p` 元素上运行上升动画。\n\n为了让苏打水的文本标签仅在苏打出现后才显示，你在运行动画之前增加了 4 秒的延迟。这 4 秒的延迟包含了 `rise`\
  \ 动画在 `#tcClubSoda` 元素上耗时的 2 秒，以及应用到 `#tcClubSoda` 元素的 2 秒动画延迟。\n\n列表 10.13. 汤姆柯林士成分的\
  \ CSS (drinks.css)\n\n```css\n#tomcollins { left: 250px; }\n#tcGin {\n  bottom:\
  \ 0;\n  height: 20%;\n}\n#tcGin p {\n  border-top: 2px solid rgba(0,0,0,.3);\n \
  \ background-color: rgb(231,255,255);\n}\n#tcClubSoda {\n  bottom: 21%;\n  height:\
  \ 30%;\n}\n#tcClubSoda p {\n  background-color: white;\n  -webkit-animation-delay:\
  \ 2s;\n}\n#tcClubSoda p strong {\n  -webkit-animation-delay: 4s;\n}\n```\n\n####\
  \ 延迟第三种成分的注入\n\n列表 10.14 定义了所需的动画延迟，以确保汤姆柯林士的第三种也是最后的成分——柠檬汁在正确时间执行动画。在这里，你遵循了列表\
  \ 10.10 和 10.13 中概述的相同模式。不过，你并没有仅将 `rise` 动画延迟 2 秒，而是延迟了 4 秒。这确保了柠檬汁在金酒和苏打水成分都执行完动画后才上升。\n\
  \n列表 10.14. 延迟柠檬汁的动画 (drinks.css)\n\n```css\n#tcLemon { bottom: 51%; height: 10%;}\n\
  #tcLemon p {\n  background-color: yellow;\n  -webkit-animation-delay: 4s;\n}\n```\n\
  \n同样，为了让 Lemon 文本仅在柠檬的 `p` 元素升入视野后才出现，在列表 10.15 中你增加了 `ingredientIn` 动画的延迟。回想列表\
  \ 10.10，`tcClubSoda` 元素上的 `rise` 动画耗时 2 秒，加上应用到 `#tcClubSoda` 元素的 2 秒动画延迟。\n\n\n\
  \n\n• JavaScript 库 `D3.js`: [`d3js.org`](http://d3js.org)\n\n## 总结\n在本章中，你将 CSS3\
  \ 效果与 CSS 动画结合，制作出了比大尺寸静态图像更具吸引力的信息图。你定义了两个在页面所有元素中共享的主要动画：一个用于让配料的水平上升，另一个用于让文本标签渐入。你使用了\
  \ `keyframes` 为动画声明了特定的、针对每个元素的延迟，即使在多个元素共享同一个动画时也是如此。\n\n## 挑战\n虽然你已经为这些常见混合饮品中的每一种都添加了主要的液体配料，但你还没有添加通常随其一起的装饰品。作为本章的挑战，请增强饮品信息图以包含装饰品。例如，使用\
  \ CSS 和 CSS3 效果为血性玛利亚画一根芹芹，或为朗姆加可乐画一片柠檬片。\n\n一旦你创建了这些装饰品的图形，就请使用 CSS 动画为这些装饰品添加一些动作。你可以让血性玛利亚中的芹芹左右摇晃，或者模拟挤压柠檬片加入朗姆加乐的动作。\n\
  \n## 11. 构建交互式信息图\n网页信息图的一种自然增强方式是通过 JavaScript 等语言或 `jQuery` 等库添加交互性。在本章中，你将对来自第\
  \ 10 章的“创建动画信息图”信息图进行一些简单的改进，通过结合 CSS 动画和 jQuery，使用饮品配方的详细信息来增强它。\n\n第 10 章 示例中缺失的内容是对饮品配料的文字描述。例如，你*视觉上*展示了朗姆加可乐由一份朗姆酒和两份可乐组成，但你没有在页面的任何地方用文字详细说明这一点。在本章中，你对此进行修改。你将这些信息添加到\
  \ HTML 中，使其可以通过屏幕阅读器查看，但你将使用 CSS 最初将其隐藏。然后，你将使用 CSS 动画在响应用户点击时显示这些信息。\n\n### 创建存放饮品配方的元素\n\
  为了显示每种饮品的完整配方，你将使用一个新的 `section` 元素，并为其赋予类名 `recipes`。`recipes` 元素将包含一系列 `ul` 元素，列出呈现每种饮品的配料列表。一个\
  \ `strong` 元素将包含饮品的名称。每个 `li` 元素将包含一种配料，最后一个除外，它将链接到该混合饮品的基基百科。\n\n你需要确保玻璃杯中配料的顺序与配方页面\
  \ HTML 中的顺序匹配。这是因为你稍后将使用 `nth-of-type()` 伪类（参见列表 11.8）将点击的饮品与其相关的配方相匹配。\n\n列表 11.1\
  \ 显示了包含配方的前两个 `ul` 元素；为了简洁起见，该列表省略了最后四个，因为它们遵循在前两个 `ul` 元素中概述的相同模式。完整的 HTML 可以在书的\
  \ GitHub 页面找到，地址为 [`github.com/alexisgo/LearningCSSAnimations/`](https://github.com/alexisgo/LearningCSSAnimations/)。你还可以在\
  \ [`alexisgo.github.com/LearningCSSAnimations/ch11code/drinks.html`](http://alexisgo.github.com/LearningCSSAnimations/ch11code/drinks.html)\
  \ 查看你在本章中构建的网页的演示。\n\n列表 11.1. 为每种饮品的配方添加 HTML (drinks.html)\n点击此处查看代码图像\n\n```html\n\
  <section class=\"recipes\">\n  <h3>Rum & Coke</h3>\n  <ul>\n    <li>One Part Rum</li>\n\
  \    <li>Two Parts Coke</li>\n    <li>Garnish with Lemon or Lime</li>\n    <li><a\
  \ href=\"http://en.wikipedia.org/wiki/Cuba_Libre\">Complete Recipe at ![Image](img/star.jpg)</a></li>\n\
  \  </ul>\n  <h3>Tom Collins</h3>\n  <ul>\n    <li>Two Parts Gin</li>\n    <li>Four\
  \ Parts Soda</li>\n    <li>One Part Juice</li>\n    <li><a href=\"http://en.wikipedia.org/wiki/Tom_Collins\"\
  >Complete Recipe at ![Image](img/star.jpg)</a></li>\n  </ul>\n</section>\n```\n\n\
  ### 设置饮品配方的样式\n接下来，在列表 11.2 中，你概述了 `recipes` 元素的基础样式：它的 `width` 和起始位置。你将 `recipes`\
  \ 元素从屏幕右侧的 `-300px` 处开始。你将 `z-index` 设置为 `2`，以确保将 `recipes` 元素移动到视野时，它会重叠饮品元素。你还为\
  \ `right` 和 `top` 属性设置了 `transition`，以便一旦更新这些值将 `recipes` 元素移动到屏幕上，此变化就会带有动画。\n\n\
  最后，你为 `recipes` 元素赋予了一个渐变背景。图 11.1 显示了。\n\n![Image](img/11.jpg)\n图 11.1. 存放饮品配方的元素\n\
  \n列表 11.2. (recipes.css)\n```css\n.recipes {\n  width: 250px;\n  position: absolute;\n\
  \  top: 60px;\n  right: -300px;\n  z-index: 2;\n  transition: right 1s, top 1s;\n\
  \  background: radial-gradient(ellipse at center, #e3c97 67%, #dcbd87 87%, #cda567\
  \ 100%);\n}\n```\n（注：由于原文未提供完整的 11.2 代码，此处根据上下文推断样式。你可以在 [`github.com/alexisgo/LearningCSSAnimations/`](https://github.com/alexisgo/LearningCSSAnimations/)\
  \ 找到所有的前缀定义。）\n\n### 默认隐藏配料\n除非饮品被点击，否则你不希望显示其配方。因此，你必须将所有包含在 `ul` 元素中的配方的默认样式设置为不可见。\n\
  \n在列表 11.3 中，你将 `recipes` 元素内部 `ul` 元素的 `display` 属性设置为 `none`。你对 `ul` 元素使用 `display:none`\
  \ 而不是 `opacity:0`，因为如果你使用后者，当你从一种饮品点击到另一种时，虽然配方不可见，但 `recipes` 元素的高度会为了包含所有 `ul`\
  \ 元素的文本而增大。\n\n列表 11.3. 初始隐藏配方 ul 元素的 CSS \n\n```css\n.recipes ul {\n  margin-top:\
  \ 0;\n  padding: 0 10px;\n  display: none;\n}\n```\n\n在列表 11.4 中，你设置了 `h3` 元素以及\
  \ `recipes` 元素内部 `li` 元素的样式。你最初将 `h3` 元素的 `display` 类型设置为 `none`，并将 `recipes` 元素内部所有\
  \ `li` 元素的初始 `opacity` 设置为 `0`。\n\n```css\n.recipes h3 {\n  display: none;\n}\n\n\
  .recipes ul.active {\n  display: block; /* 假设的逻辑 */\n}\n\n.recipes li {\n  opacity:\
  \ 0;\n  transition: opacity 1s;\n}\n\n.recipes ul.active li {\n  opacity: 1;\n}\n\
  ```\n\n### 显示配方页面\n接下来，你将定义配方页面在显示时看起来应该是什么样。你通过定义一个名为 `visible` 的类的 CSS 来实现。你可以使用\
  \ jQuery 来同时设置事件处理程序，并在这些事件处理程序被调用时为相应的元素添加 `visible` 类。但在进入 jQuery 之前，让我们检查将使配方页面可见的\
  \ CSS。\n\n#### 滑入配方页面\n\n\n\n\n在 Listing 11.5 中，你指定一旦应用了 `visible` 类，`recipes` 元素的位置就会从初始的屏幕外移动到距离窗口右边缘\
  \ 20 像素处。你还为元素添加了基础的 `box-shadow`，使其看起来像是悬浮在饮料之上。\n\n回想一下在 Listing 11.2 中，你对 `right`\
  \ 属性的变化设置了过渡效果：\n\n```css\n-webkit-transition: right 1s;\n```\n\n由于你之前设置了此过渡，`right`\
  \ 属性的变化将具有动画效果，导致 `recipes` 元素从右侧滑入。图 11.2 展示了在应用 `visible` 类时食谱页面滑入的场景。请注意，你正在使用\
  \ `jQuery` 来应用 `visible` 类，而这段 `jQuery` 代码在稍后的 Listing 11.7 中定义。\n\n![Image](img/11fig02.jpg)\n\
  \n图 11.2. 食谱页滑入\n\n<multimedia/11vid01.m4v>\n\n![11vid01.m4v](img/posterimage02.jpg)\
  \ \n\n视频 11.1. 食谱页滑入\n\n你还想显示食谱包含的文本，包括 `h3` 元素中的饮料标题和存储在 `ul` 元素中的配料列表。回想 Listing\
  \ 11.3，这些 `ul` 和 `h3` 元素初始被设置为 `display:none`。在 Listing 11.5 中，当存在 `visible` 类时，你将\
  \ `ul` 和 `h3` 元素的 `display` 类型更改为 `block`。\n\nListing 11.5. 将食谱带入视野 (recipes.css)\n\
  \n点击此处查看代码图片\n\n* *\n\n```css\n.recipes.visible {\n  right: 20px;\n  -webkit-box-shadow:\
  \ -2px 2px 5px rgba(0,0,0,0.3);\n  box-shadow: -2px 2px 5px rgba(0,0,0,0.3);\n}\n\
  \n.recipes ul.visible,\n.recipes h3.visible {\n  display: block;\n}\n```\n\n* *\n\
  \n### 当用户点击饮料时显示食谱\n\n为了使用定义的 `visible` 类样式（参见 Listing 11.5），你必须在代码中添加此类。为了在响应用户点击相关饮料时显示食谱，你必须通过程序化的添加\
  \ `visible` 类。当点击饮料名称或饮料本身的任何部分时，食谱页面将如前所述从右侧滑入。\n\n要实现这一点，你可以使用 `jQuery`。首先，在 Listing\
  \ 11.6 中，你定义了一个名为 `setup` 的函数，该函数会在整个页面加载后立即调用（`$(document.ready(setup))`）。\n\n\
  Listing 11.6. Setup 方法 (drinks.js)\n\n* *\n\n```javascript\n$(document).ready(setup);\n\
  \nfunction setup() {\n  // 续见 Listing 11.\n}\n```\n\n* *\n\n接下来，你基于 Listing 11.6\
  \ 中开始的 `setup` 函数进行扩展，以设置在响应用户点击其中一个饮料标签（定义为 `h2` 元素——参见 `drinks.html` 文件或第 10 章中的\
  \ Listing 10.4）时运行的代码。你通过使用 `jQuery` 的 `on()` 方法来实现，它允许你定义在对给定元素执行某些特定用户操作时应该运行哪些代码。\n\
  \n在 Listing 11.7 中，你使用 `on()` 将容器 `#bar` 元素内每个 `h2` 元素的 `click` 事件绑定到一个匿名函数。当点击任何饮料\
  \ `h2` 元素时，就会调用该匿名函数中的代码。你添加到 `setup` 函数中的新代码在 Listing 11.7 中以粗体显示。\n\n在匿名函数中，你调用了两个额外的函数：`resetClasses`\
  \ 和 `revealRecipe`。`resetClasses` 稍后在 Listing 11.9 中定义，当你从一种饮料切换到另一种时，它会清除之前可见的食谱。`revealRecipe`\
  \ 在 Listing 11.8 中定义，触发引入食谱页的动画。\n\nListing 11.7. 基础 h2 点击处理器 (drinks.js)\n\n* *\n\
  \n```javascript\n$(document).ready(setup);\n\nfunction setup() {\n  // 续见 Listing\
  \ 11.\n}\n```\n\n*(注：由于原文中存在大量重复和不完整的描述，译文已根据核心逻辑进行了整理和翻译。)*\n\n\n\n\n```javascript\n\
  console.log(\"nth(1) \" + $('.recipes li:nth-of-type(1)').html());\n```\n\n图 11.3\
  \ 显示了代码的结果。如你所示，`nth-of-type(0)` 返回 `null`，而 `nth-of-type(1)` 返回第一个饮料食谱。\n\n![图像](img/11fig03.jpg)\n\
  \n图 11.3. `nth-of-type(0)` 返回 `null`\n\n***\n\n### 显示正确食谱的替代方法\n\n你可能会奇怪，为什么不给每种饮料分配一个\
  \ `id`，并给 `recipes` 元素中的每个食谱分配一个 `id`，然后为每个项目设置点击处理程序和相应的 CSS 选择器。你确实可以采取方法。但是，这种方法的缺点是它涉及的代码多得多的。而你采用的方法是确定被点击饮料的索引，这允许你将该索引与\
  \ `recipes` 元素中相应食谱的索引匹配，然后利用 `nth-of-type` 伪类来显示正确的食谱。这种方法减少了 CSS 自定义量以及实现你所需效果所需的总代码量。\n\
  \n***\n\n#### 视频 11.2. 点击新饮料时隐藏旧食谱\n\n当点击一种新饮料时，你不希望上一个饮料的食谱仍然显示。为了在下一次点击时隐藏最后一次点击饮料的食谱，你必须移除所有可见类（classes）。你通过\
  \ `resetClasses` 函数来实现这一点。\n\n列表 11.9 定义了 `resetClasses` 函数。你在该函数中做的第一件事是通过向元素添加\
  \ `visible` 类来使 `recipes` 元素可见。这是通过 jQuery 的 `addClass()` 方法实现的。\n\n接下来，你移除嵌套在 `recipes`\
  \ 元素中的 `ul` 元素上任何之前的 `class=\"visible\"` 实例。这是为了在从一个食谱点击到另一个食谱时清除早的食谱。如果没有这一行，之前的食谱文本将保持可见。\n\
  \n列表 11.9. `resetClasses` 函数 (drinks.js)\n\n点击此处查看代码图像\n\n***\n\n```javascript\n\
  function resetClasses($elem) {\n  // 从匹配这些 jQuery 选择器的\n  // 元素中移除所有类\n  $('.recipes\
  \ ul, .recipes h3, .recipes ul li').removeClass();\n  $('.recipes').removeClass('row2');\n\
  \  $('.recipes').addClass('visible');\n}\n```\n\n***\n\n<multimedia/11vid02.m4v>\n\
  \n![11vid02.m4v](img/posterimage02.jpg) \n\n视频 11.2. 点击新饮料时隐藏旧食谱\n\n#### 调整第二行饮料的\
  \ recipes 元素位置\n\n对于血血玛丽、红牛伏特加饮和威士忌酸源，`recipes` 元素的位置偏高。为了调低这三种饮料的 `recipes` 元素位置，你可以再次使用\
  \ `nth-of-type` 伪类。在列表 11.10 中，你向 `resetClasses` 函数添加了几行代码（添加的代码以粗体显示），以指定索引为 4\
  \ 或更大的任何饮料都将应用 `row2` 类。这个 `row2` 类（在列表 11.11 中定义）将改变 `recipes` 元素的位置，使其更靠近第二行的饮料。\n\
  \n列表 11.10. 为第二行的饮料添加 `row2` 类 (drinks.js)\n\n点击此处查看代码图像\n\n***\n\n```javascript\n\
  function resetClasses($elem) {\n  // 从匹配这些 jQuery 选择器的\n  // 元素中移除所有类\n  $('.recipes\
  \ ul, .recipes h3, .recipes ul li').removeClass();\n  $('.recipes').removeClass('row2');\n\
  \  $('.recipes').addClass('visible');\n\n  // 我当前在哪种饮料上\n  var drinkIndex = $elem.closest('section').index('#bar\
  \ section') + 1;\n  if (drinkIndex >= 4) {\n    $('.recipes').addClass('row2');\n\
  \  }\n}\n```\n\n***\n\n在列表 11.11 中，当同时应用 `visible` 和 `row2` 类时，你将食谱页的 `top` 值设为\
  \ `350px`。在此段代码列表中，你还修改了之前在 `.recipes` 选择器中定义的过渡（transition），为 `top` 属性的变化定义了额外的过渡，这将确保\
  \ `top` 的变化是带有动画效果的。\n\n列表 11.11. 为第二行饮料设置 recipes 元素的样式 (recipes.css)\n\n点击此处查看代码图像\n\
  \n***\n\n```css\n.recipes.visible.row2 {\n  top: 350px;\n}\n\n.recipes {\n  -webkit-transition:\
  \ top;\n}\n```\n\n***\n\n<multimedia/11vid02.m4v>\n\n![11vid02.m4v](img/posterimage02.jpg)\
  \ \n\n视频 11.2. 点击新饮料时隐藏旧食谱\n\n#### 淡食谱文本\n\n目前，当你从一个 `h2` 点击到另一个时，食谱文本会立即变化。现在将使用动画来淡入。在列表\
  \ 11.12 中，你设置了一个名为 `fadeIn` 的关键帧，将透明度从 `0` 变为 `1`。你通过将 `animation-fill-mode` 设置为\
  \ `forwards` 将此关键帧应用于 `.recipes.visible li` 选择器。\n\n列表 11.12. 设置食谱文本 (recipes.css)\n\
  \n点击此处查看代码图像\n\n***\n\n```css\n@keyframes fadeIn {\n  0% { opacity: 0; }\n  100%\
  \ { opacity: 1; }\n}\n\n.recipes ul.visible li {\n  /* forwards 保持动画结束 */\n  -webkit-animation:\
  \ fadeIn 1.5s forwards;\n  -moz-animation: fadeIn 1.5s forwards;\n  -o-animation:\
  \ fadeIn 1.5s forwards;\n  animation: fadeIn 1.5s forwards;\n}\n```\n\n***\n\n在列表\
  \ 11.12 中定义的代码有一个问题：它依赖 CSS 动画来将 `li` 元素的透明度变为 `1`。这对于支持 CSS 动画的浏览器没有问题，但对于不支持的浏览器，当你点击饮料时，食谱页会出现，但\
  \ `li` 元素不会出现。\n\n为了修复这个问题，你可以使用 Modernizr 并创建一个选择器。在列表 11.13 中，你在现有的选择器 `.recipes\
  \ ul.visible li` 前加上 `.cssanimations`。这确保只有在浏览器支持时才设置关键帧动画 `fadeIn`。你还添加了一个新选择器（以粗体显示，以便与现有代码区分），`.no-cssanimations\
  \ .recipes ul.visible li`。在针对不支持动画的选择器中，你手动将 `li` 元素的透明度改回 `1`，以便食谱页的文本可见。\n\n列表\
  \ 11.13. 设置 li 元素淡入 (recipes.css)\n\n点击此处查看代码图像\n\n***\n\n```css\n.cssanimations\
  \ .recipes ul.visible li {\n  -webkit-animation: fadeIn 1.5s forwards;\n  -moz-animation:\
  \ fadeIn 1.5s forwards;\n  -o-animation: fadeIn 1.5s forwards;\n  animation: fadeIn\
  \ 1.5s forwards;\n}\n\n.no-cssanimations .recipes ul.visible li {\n  opacity: 1;\n\
  }\n```\n\n\n\n\n\nListing 11.14 定义了一个动画，用于更改当前选中的配料 `div` 在 `recipes` 元素中 `li` 元素的\
  \ `text-shadow` 属性。发光动画开始时，`li` 没有任何应用任何 `text-shadow`。然后，在动画的 0% 到 50% 之间，你应用了四种不同的\
  \ `text-shadow` 属性，分别位于元素的右下角、左下角、左上角和右上。这在元素周围营造了一个烟雾般的发光效果。你通过让 `60%` 关键帧保持为空，使该效果在动画持续时间的\
  \ 10% 内保持不变（从而保留了从关键帧 50% 到 60% 之前的上一个效果）。然后，在动画的 60% 到 100% 期间，`text-shadow` 缩小为仅位于\
  \ `li` 文本右角的单个 `text-shadow`。\n\n由于 `.recipes ul.visible li` 选择器之前已经设置了动画（`fadeInText`\
  \ 动画），如果你仅在 `.recipes ul li.highlight` 选择器中设置发光动画，你将会覆盖覆盖 `fadeInText` 动画。因此，你必须同时指定两者。图\
  \ 11.4 近似展示了此动画的效果。\n\nListing 11.14. 高亮选中的配料 (recipes.css)\n\n点击此处查看代码图像\n\n* *\
  \ *\n\n```css\n@-webkit-keyframes glow {\n  0% {}\n  50% {  text-shadow: 2px 2px\
  \ 10px gray,\n          -2px -2px 10px gray,\n          -2px 2px 10px gray,\n  \
  \        2px -2px 10px gray; }\n  60% {}\n  100% { text-shadow: 1px 1px 10px black;}\n\
  }\n\n.recipes ul li.highlight {\n  -webkit-animation: fadeTextIn 1.5s both, glow\
  \ 2s forwards 0.5s;\n}\n```\n\n* * *\n\n![Image](img/11fig04.jpg)\n\n图 11.4. 高亮配料的脉动阴影效果\n\
  \n<multimedia/11vid03.m4v>\n\n![11vid03.m4v](img/posterimage02.jpg) \n\n视频 11.4.\
  \ 点击新配料时的脉动影子\n\n#### 通过 jQuery 触发配料高亮\n\n在 Listing 11.15 中，你设置了另一个 jQuery 点击处理器，在点击单个饮品配料时也显示食谱页面。\n\
  \n正如你在 Listing 11.7 中做的那样，在设置响应点击 `h2` 饮品元素的代码时，你首先调用了函数 `resetClasses` 和 `revealRecipe`（分别定义在\
  \ Listing 11.9 和 11.8 中）。作为提醒，`resetClasses` 函数向父级元素 `recipes` 添加 `visible` 类，并移除\
  \ `ul` 上任何其他先前的 `visible` 类实例。`revealRecipe` 处理显示食谱页面。\n\nListing 11.15. 使选中的配料的父级饮品可见\
  \ (drinks.js)\n\n* * *\n\n```javascript\n$('.tumbler div').on('click', function()\
  \ {\n  resetClasses($(this));\n  revealRecipe($(this));\n  // continued in Listing\
  \ 11.16\n}\n```\n\n* * *\n\n现在你已经确保显示了正确的食谱，你需要确定点击了哪个配料，以便你为该配料添加一个名为 `highlight`\
  \ 的类。\n\n在 Listing 11.16 中，你通过匹配点击的配料 `div` 的索引与 `recipes` 元素的 `li` 来确定要为哪个配料添加\
  \ `glow` 动画。通过对该 `li` 元素应用 `highlight` 类，将 `glow` 动画添加到该 `li` 元素上。Listing 11.16.\
  \ 高亮选中的配料 (recipes.css)\n\n点击此处查看代码图像\n\n* * *\n\n```javascript\n$('#bar section\
  \ .tumbler div').on('click', function() {\n  // continued from Listing 11.15\n \
  \ //add one since nth-of-type(1) is the first elem; nth-of-type(0) is null\n  var\
  \ ingredientIndex = $(this).index() + 1;\n  // find the right ingredient element\n\
  \  var elem = '.recipes '\n    + 'li:nth-of-type('\n    + ingredientIndex + ')';\n\
  \  $(elem).addClass('highlight');\n});\n```\n\n* * *\n\n#### 确保在旧浏览器中的兼容性\n\n目前，某些浏览器不支持\
  \ CSS 动画，因此 `text-shadow` 永远不会添加。为了改进 Listing 11.17，通过在 `.recipes ul li.highlight`\
  \ 选择器前面添加内容，你为支持的浏览器设置了 `text-shadow`。这种方法并不理想，因为某些浏览器不支持 CSS 动画。你可以使用 Modernizr\
  \ 在浏览器支持时才添加 `text-shadow`。\n\nListing 11.17. 为所有浏览器添加 text-shadow (recipes.css)\n\
  \n点击此处查看代码图像\n\n* * *\n\n```css\n@-webkit-keyframes glow {\n  0% {}\n  50% { text-shadow:\
  \ 2px 2px 10px gray,\n          -2px -2px 10px gray,\n          -2px 2px 10px gray,\n\
  \          2px -2px 10px gray; }\n  60% {}\n  100% { text-shadow: 1px 1px 10px black;}\n\
  }\n\n.recipes ul li.highlight {\n  -webkit-animation: fadeTextIn 1.5s both, glow\
  \ 2s forwards 0.5s;\n}\n\ncssanimations .recipes ul li.highlight {\n  text-shadow:\
  \ 2px 2px 10px gray,\n    -2px -2px 10px gray,\n    -2px 2px 10px gray,\n    2px\
  \ -2px 10px gray;\n}\n```\n\n* * *\n\n#### 修改光标\n\n你对此示例的最后一个微调是让信息图的哪些部分是可以点击的。目前由于\
  \ `h2` 饮品标签和配料都不是链接元素，悬停在它们上方时光标是简单的箭头。\n\n为了明显 `h2` 饮品元素和配料是可以点击的，你可以将这些元素的光标更改为指针，如\
  \ Listing 11.18 所示。Listing 11.18. 将饮品 h2 和配料的光标改为指针 (drinks.css)\n\n* * *\n\n```css\n\
  #bar section h2 {\n  font-size:1.1em;\n  margin:5px 0;\n  text-align:center;\n \
  \ cursor:pointer;\n}\n\n.tumbler div {\n  width:100px;\n  position:absolute;\n \
  \ cursor:pointer;\n}\n```\n\n* * *\n\n#### 更多资源\n\n为了看到他人如何使用 CSS3 和 JavaScript\
  \ 构建交互式信息图，我建议探索以下示例：\n\n• NASA 火星探测器*好奇号* 登陆的 HTML/CSS 信息图：[`mars.jpl.nasa.gov/msl/multimedia/interactives/edlcuriosity/index-2.html`](http://mars.jpl.nasa.gov/msl/multimedia/interactives/edlcuriosity/index-2.html)\n\
  \n来自 Designmodo 使用 HTML、CSS 和 JavaScript 创建的 8 个交互式信息图：[`designmodo.com/interactive-infographics/`](http://designmodo.com/interactive-infographics/)\n\
