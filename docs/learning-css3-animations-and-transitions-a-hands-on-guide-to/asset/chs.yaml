  \n* * *\n\n## 总结\n\n在本章中，你通过添加包含每种饮品食谱的 HTML，增强了你在 第 10 章 中创建的信息图。你还通过使信息图的部分元素变得可点击，使信息图具有交互性。你通过使用\
  \ jQuery 使这些元素变为可点击，并响应用户点击使用 CSS 动画对元素进行动画处理。\n\n## 挑战\n\n\n\n\n\n来自第 10 章的挑战是丰富信息图中的饮品，加入装饰品，例如为血玛丽加入芹芹茎，或为朗姆可乐加入柠檬片，并对它们制作动画。对于本章的挑战，请让你在上一章中添加的装饰品动画由点击触发，而不是在页面加载时播放。\n\
  \n如果你还没有添加装饰品，请现在添加，然后让它们在用户点击时产生产生动画。当点击芹芹茎时，让它搅拌血玛丽；让柠檬片在被点击时看起来像被挤压了一样（例如通过 `scale`\
  \ 变换）。\n\n## 索引\n\n### 符号\n\n- `/` (正斜杠)，166\n- `@font-face` 规则，160\n- `@keyframes`\
