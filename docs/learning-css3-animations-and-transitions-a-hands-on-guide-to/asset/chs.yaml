  \n\n\n本章结合了之前章节中使用的许多技术和属性，创建了一个连续的文本驱动动画。你利用了 CSS3 效果让你的动画看起来更加真实（带有圆角和渐变）。你还使用了\
  \ JavaScript 的正则表达式和 jQuery 选择器添加了字母像打字机一样字字的动态效果。\n\n## 挑战\n\n为打字机动画添加第六个场景，接上引言中断的地方。引言的下一行是“脊椎里的灯光不会因为牛肉和李子而点亮。”看看你是否能通过添加一个新的关键帧动画让纸张升起，并扩展\
  \ `letters` 函数中添加的打字动画。\n\n# 9. 使用关键帧动画构建闪电风格动画\n\n本章展示了一个卡通风格的猫动画，它结合了之前章节讨论的方法。你将学习如何逐部分构建一个角色，通过\
  \ `transform-origin` 对齐“关节”来确保它在屏幕上的移动是平滑的，并使用 JavaScript 计时器触发一系列动画。\n\n### 猫叫街肥猫动画介绍\n\
  \n你在本章中创建的短动画主角是一只名叫 Morgan Diamond 的猫。他是猫叫街（Meow Street）的居民，那里是猫市市中心的金融中心。他是一只肥猫，以残酷甚至是犯罪闻名。今天，当他像往常快速阅读晨报时，他看到期待已久的正义可能降临自己。\n\
  \n与第 8 章“使用过渡和变换制作文本动画”一样，本章将动画分为若干场景。你将使用匹配每个场景名称的类选择器在一个或多个元素上对场景进行样式化。就像你在第 8\
  \ 章](#ch08.html_ch08) 中做的那样，你将通过 JavaScript 触发类名的更改。\n\n你的动画将有七个场景。动画将从 Morgan 读报的放大开始。然后它将向外，使用动画变换来实现缩小的效果。这将揭示\
  \ Morgan 的豪宅，他正坐在室内，开着窗。接下来，一只警察猫出现在场景中，敲了多次 Morgan 的门。Morgan 的目光向下向窗外的警察猫移动。在最后一个场景中，一张旋转的报纸放大并最终停下，揭示了\
  \ Morgan 的命运。图 9.1 显示了其中一个场景，让你了解你将构建的内容。你也可以在 [`alexisgo.github.com/LearningCSSAnimations/ch9code/cat.html`](http://alexisgo.github.com/LearningCSSAnimations/ch9code/cat.html)\
  \ 查看完成项目的演示。\n\n![Image](img/09fig01.jpg)\n\n图 9.1. 你将构建的动画场景 1\n\n```\n<multimedia/09vid01.m4v>\n\
  ```\n\n![09vid01.m4v](img/posterimage02.jpg)\n\n视频 9.1. 动画场景 1\n\n我最感谢 Herbert Hoover，他是一位才华的艺术家和设计师，他创作了\
  \ Morgan 猫的原始形象。你可以访问他的网站 [`www.potus31.com/`](http://www.potus31.com/) 了解更多 Herb\
  \ 的作品。\n\n### 动画的布局和基础样式\n\n在开始制作此动画的任何部分之前，让我们回顾一下组成它的 HTML 和基础 CSS 样式。你将使用 `id`\
  \ 定义主要元素，包括包含整个动画的容器 `#stage` 元素，以及动画中的主要角色，如包含 Morgan Diamond 的 `#cat` 元素和组成 Murphy（猫叫街巡逻中最强硬的警察）的\
  \ `#murphy` 元素。你还将使用类来作为触发器，让动画从一个场景移动到另一个场景，就像你在第 8 章](#ch08.html_ch08) 中做的那样。此动画中有七个场景，因此你将使用七个与场景相关的类：`scene1`\
  \ 到 `scene7`。\n\n注意，为了简洁起见，本章对任何 CSS3 属性仅使用 `-webkit-` 厂商前缀。带有所有适当厂商前缀的完整代码可以在书籍\
  \ GitHub 页面上的 ch9code 文件夹中找到：[`github.com/alexisgo/LearningCSSAnimations/`](https://github.com/alexisgo/LearningCSSAnimations/)。\n\
  \n#### 动画的基础 HTML 元素\n\n此动画由多个不同的演员和对象组成。本章不会一次性回顾所有元素，而是按场景回顾相关的 HTML。列表 9.1 列出了此动画的前几个主要元素：包含元素的\
  \ `#stage` 元素、`#house` 以及通过它你可以看到 Morgan 猫的 `#window` 元素。\n\n列表 9.1. Morgan 猫的 HTML\
  \ 元素 (cat.html)\n\n点击此处查看代码图片\n\n* * *\n\n```html\n<div id=\"stage\">\n  <div id=\"\
  house\"></div>\n  <div id=\"window\">\n    <div id=\"cat\">\n      <div id=\"eyes\"\
  >\n        <div id=\"lefteye\"></div>\n        <div id=\"righteye\"></div>\n   \
  \   </div>\n      <div id=\"head\"></div>\n      <div id=\"neck\"></div>\n     \
  \ <div id=\"newspaper\">\n          <!-- 续接列表 9.6 -->\n      </div> <!-- end newspaper\
  \ -->\n    </div> <!-- end cat -->\n  </div> <!-- end window -->\n</div> <!-- end\
  \ stage -->\n```\n\n* * *\n\n我想解释一些不直观的元素放置。`#window` 元素没有嵌套在 `#house` 元素内部，因为你将对它们应用不同的变换，而应用于父元素的变换会被其后代继承。因此，你将\
  \ `#window` 元素作为 house 的兄弟元素。为了让你更清楚，请先查看列表 9.2](#ch09.html_ch09ex02) 中元素 `#house`\
  \ 的样式。Morgan 的房子有一个固定的高度，位置靠左，并有一张猫叫街住宅的背景图片——对于其他住宅来说，这是一栋豪宅。\n\n这段 CSS 的异常之处在于应用的变换。这是\
  \ `#house` 元素的初始样式，所以你可能会质疑为什么在动画开始之前就将其放大到三倍。你之所以这样做是因为稍后在场景 4 中，当你缩小以显示整个豪宅时，你可以在缩小猫的同时缩小房子。\n\
  \n* * *\n\n注意\n\n由于你将在代码中使用 3D 变换，因此利用 Modernizr 仅在 Modernizr 指示支持 3D 变换时应用列表 9.2](#ch09.html_ch09ex02)\
  \ 中定义的样式是合理的（通过在打开 html 标签上添加 `csstrforms3d` 类来实现）。在本章末尾，我将讨论针对不支持 3D 变换浏览器的策略。\n\
  \n* * *\n\n列表 9.2. Morgan 房子的样式 (cat.css)\n\n点击此处查看代码图片\n\n* * *\n\n```css.csstransforms3d\
  \ #house {\n  width: 100%;\n  height: 700px;\n  position: absolute;\n  left: 315px;\n\
  \  background-image: url('../img/house.png');\n  background-repeat: no-repeat;\n\
  \  -webkit-transition: 2s;\n  -webkit-transform: scale3d(3,3,3);\n  -webkit-transform-origin:\
  \ 50% 0%;\n  z-index: -3;\n}\n```\n\n\n\n\n下一组相关的元素是 `#window`——通过它你可以看到猫 Morgan——以及构成\
  \ Morgan 的所有其他元素。Listing 9.3 为最外层元素 `#cat` 及其前两个嵌套元素 `#head` 和 `#neck` 定义了样式。`#cat`\
  \ 元素设置了其 `perspective` 属性，以便你稍后将应用的 3D 变换能够正确显示（正如在第 6 章中讨论的，“使用 3D 变换添加深度”所示）。`#head`\
  \ 元素的 `background-image` 被 设置为一张仅有 Morgan 脸部的图像——而这张图像在 Morgan 眼睛的部分是透明的。通过这种方式，你可以用\
  \ HTML 元素构建 Morgan 的眼睛，然后轻松地对它们进行动画处理。`#neck` 元素也利用了 Morgan 另一个部分的 `background-image`——他的脖子，包裹在有领衬衫和蝴蝶结中。你将头的\
  \ `z-index` 设置为 `2`，以便在发生任何重叠时，头部位于脖子上方。\n\nListing 9.3. 猫咪 Morgan 的样式 (cat.css)\n\
