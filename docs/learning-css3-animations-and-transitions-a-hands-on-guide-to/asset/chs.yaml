  \ 总结\n- 挑战\n- 索引\n\n## 前言\n\n欢迎来到 *Learning CSS3 Animations* 的世界！我们非常高兴你加入我们，开启探索\
  \ CSS 动画带来的所有乐趣之旅。这本实战型、示例驱动的教程解释了 CSS 动画的基础知识以及你如何使用它们，并提供了许多从简单到复杂的示例，为你编写自己的代码提供许多切入点。你将探索完全由\
  \ HTML 和 CSS 驱动的示例，也将探索利用 JavaScript 和 jQuery 作为动画触发器或为页面添加交互的示例。\n\nCSS3 带来了一波为网站增添生命力、动感和整洁效果的新方法。这些效果可以是对现有页面的简单增强，也可以是为你的网站添加新内容的丰富且复杂的动画。\n\
  \n本书的基石是简单的代码示例以及对代码中所用技术的详细解释。书中介绍了一系列示例，突出了某种特定的 CSS 动画技术，并为你自定义自己的网站和项目提供了一个起点。\n\
  \n在实际操作可行的情况下，示例使用了 CSS 本身来制作 CSS 生成的图形，而不是依赖图像。这种方法背后的理念是，它能让你更多地练习 CSS3 的绘图和视觉效果创建能力。不过，你也可以同样容易地从这些示例中学习动画概念，并将其用于自定义的图像中。\n\
  \n### 本书适合的读者\n\n本书面向初级和中级 Web 开发人员和设计师，他们拥有坚实的 HTML 和 CSS 基础，并基础掌握了 HTML5 和 CSS3。虽然你不需要对\
  \ CSS3 的所有主题拥有专家级的知识（如果你有，就不需要这本书了），但你应该总体掌握供应商前缀以及它们在 CSS3 中的用法，以及 CSS3 中流行的新属性，如\
  \ `text-shadow` 和 `border-radius`。\n\n### 本书不适合的读者\n\n本书不适合从未用过 HTML 或 CSS 的绝对初学者。这本书也不适合那些具备基础\
  \ HTML 或 CSS 技能但对 CSS3 完全毫无经验、并希望快速上手的人。本书假设读者在 HTML/CSS 上有坚实的基础，并且至少对新的 CSS3 属性（即那些与动画无关属性）有一定了解。\n\
  \n如果你不熟悉基本的 CSS 概念，例如选择器是什么、可选选择器的类型以及如何使用它们，那么在阅读本书之前，你需要先获取这些知识。本书没有花费任何时间回顾 CSS\
  \ 的基础知识、它如何与 HTML 交互以及最常见的 CSS 属性。\n\n### 本书的结构\n\n本书由 11 章组成，每章都包含详细的代码示例来演示所讨论的概念。几乎所有章节都建立在之前章节内容的基础上。建议你连续阅读，而不是跳着读。\n\
  \n### 第 1 章，“使用 CSS3 动画”\n\n第 1 章 讨论了本书处理浏览器支持的方法，包括对 Modernizr JavaScript 库的审查，你可以用它来检测用户的浏览器支持哪些\
  \ HTML5 特性，以及在本书中使用的其他工具和资源，以使开发更加容易。\n\n### 第 2 章，“用变换构建基础”\n\n本书的大部分内容利用了 CSS3\
  \ 变换（transforms）的力量。第 2 章 介绍了可以使用 CSS3 实现的各种二维变换，以便你熟悉它能达到的效果。在本章中，你将使用变换仅用 CSS\
  \ 就绘制出一辆自行车。\n\n### 第 3 章，“通过过渡为元素制作动画”\n\n第 3 章 讨论了如何将变换与过渡（transitions）结合，以便实现一段时间内的变化动画。它讨论了其他\
  \ CSS 属性如何通过过渡制作动画。在本章中，你增强了 第 2 章 中的自行车示例，使车轮能够响应用户的操作进行旋转并移动自行车。\n\n### 第 4 章，“关键帧动画”\n\
  \n与过渡相比，关键帧动画能让你对动画的各个阶段进行更精细的控制。在第 4 章中，你将通过将其应用于简单的动画，学习了关键帧动画可用的许多属性。你还创建了一个弹跳弹簧和一个漂浮的气球，以观察通过关键帧动画实现的效果。\n\
  \n### 第 5 章，“通过差滚动创建 3D 效果”\n\n第 5 章 将关键帧动画与差滚动（parallax scrolling）概念相结合，允许你在不进行任何\
  \ 3D 操作的情况下构建具有 3D 感的内容。本章概述了两个示例项目，它们都使用差滚动在 2D 空间中创建深度。\n\n### 第 6 章，“通过 3D 变换添加深度”\n\
  \n第 6 章 回顾了如何通过 3D 变换改变元素的深度。它探索了适用于 `transform` 属性的各种变换函数，以及如何有效使用 `perspective`\
  \ 属性来查看结果。\n\n### 第 7 章，“2D 和 3D 变换”\n\n第 7 章 展示了如何将 2D 和 3D 变换与 CSS 过渡和关键帧动画结合，以创建有趣的效果。在本章中，你通过过渡、一些\
  \ HTML5 范围类型元素和少量 JavaScript 增强了你在第 6 章](#ch06.html_ch06)中构建的立方体，使其围绕三个轴旋转。\n\n\
  ### 第 8 章，“使用过渡和变换为文本制作动画”\n\n在第 8 章中，你结合关键帧动画、过渡、变换和少量 jQuery 创建了一个文本驱动动画。你使用 CSS3\
  \ 对元素进行基础样式，使其看起来像打字机的一部分，然后为打字机打出的文本制作动画，为弗吉尼亚·伍尔夫广受喜爱的引言赋予生命。\n\n### 第 9 章，“使用关键帧动画构建\
  \ Flash 风格动画”\n\n在第 9 章中，你创建了一个猫的卡通动画，结合了之前章节讨论的方法。该动画包含了不同场景中的两个角色，通过关键帧动画制作，并由\
  \ JavaScript 定器触发。\n\n### 第 10 章，“创建动画信息图”\n\n第 10 章 涵盖了信息图的基础知识以及你如何通过添加 CSS 动画来增强它们。结合本书之前使用的技术，第\
  \ 10 章](#ch10.html_ch10) 概述了构建六种混合饮品配料比例的简单数据可视化的步骤。CSS 动画被用作对基础信息图的改进。\n\n### 第\
  \ 11 章，“构建交互式信息图”\n\n\n\n\n\n网页信息图的一种自然增强方式是通过如 `JavaScript` 等语言或 `jQuery` 等库为图表添加交互性。在第\
  \ 11 章中，你将对第 10 章中的信息图进行一些简单的添加，并结合 `CSS` 动画和 `jQuery` 用饮品配方的细节来丰富其内容。\n\n## 关于示例代码\n\
  \n本书的示例代码全部在 GitHub 上进行了编译。代码可以在 [`github.com/alexisgo/LearningCSSAnimations`](https://github.com/alexisgo/LearningCSSAnimations)\
  \ 获取，方便进行分叉（fork）。如果你在示例代码中发现任何问题，我鼓励你在本书的 GitHub 项目页面上提交 issue（问题）。\n\n如果你以前从未用过\
  \ GitHub 或 `git`，不要担心！你也可以从 GitHub 网站下载包含所有代码的 zip 压缩包。zip 文件的特定链接为 [`github.com/alexisgo/LearningCSSAnimations/zipball/master`](https://github.com/alexisgo/LearningCSSAnimations/zipball/master)。\n\
  \n此外，还有一个网站概述了所有章节中的所有示例，并提供了示例演示的链接。该页面是 [`alexisgo.github.com/LearningCSSAnimations/`](http://alexisgo.github.com/LearningCSSAnimations/)，我鼓励你在阅读本书时打开它，这样你就可以测试在文中构建的示例。\n\
