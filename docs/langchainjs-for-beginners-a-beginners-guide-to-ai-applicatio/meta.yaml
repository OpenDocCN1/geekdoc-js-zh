  md: '# # PREFACE


    The goal of this book is to provide a gentle step-by-step instructions that help
    you learn LangChain.js gradually from basic to advanced.


    You will see why LangChain is a great tool for building AI applications and how
    it simplifies the integration of language models into your web applications.


    We’ll see how essential LangChain features such as prompt templates, chains, agents,
    document loaders, output parsers, and model classes are used to create a generative
    AI application that’s smart and flexible.


    After that, we will integrate LangChain into Next.js so you know how to create
    AI-powered web applications.


    # ## Working Through This Book


    This book is broken down into 16 concise chapters, each focusing on a specific
    topic in LangChain programming.


    I encourage you to write the code you see in this book and run them so that you
    have a sense of what LangChain development'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'looks like. You learn best when you code along with examples in this book.


    A tip to make the most of this book: Take at least a 10-minute break after finishing
    a chapter, so that you can regain your energy and focus.


    Also, don’t despair if some concept is hard to understand. Learning anything new
    is hard for the first time, especially something technical like programming. The
    most important thing is to keep going.


    # Requirements


    To experience the full benefit of this book, you need to have knowledge of basic
