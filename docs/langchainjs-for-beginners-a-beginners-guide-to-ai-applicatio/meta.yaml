  - '[PAGE 68]


    Let''s assume a compelling topic to proceed with.


    How about this title: "The Marvel of Quantum Computing"?


    In my case, I asked GPT to write an essay about bears, and it randomly suggested
    a title based on its training data.


    To minimize this kind of undesired response, you need to parse the output of the
    first chain using LangChain parsers.


    We''ll use another parser in the next chapter.


    # Summary


    The code for this chapter is available in the folder `07_LCEL` from the book source
    code.


    In this chapter, you''ve learned about the LangChain Expression Language, which
    can be used to compose LangChain components in a declarative way.


    A chain is simply a wrapper for these LangChain components:


    +   1. The prompt template

    2. The LLM to use

    3. The parser to process the output from LLM


    The components of a chain are interchangeable, meaning you can use the GPT model
    for the first prompt, and then use the Gemini model for the second prompt, as
    shown above.'
