    \ the LLM to not answer when asked about fictional places.\n\nNow if you ask again,\
    \ the LLM will respond as follows:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_58_0.png)\n\
    \nFigure 25. LLM Not Answering\n\nAs you can see, the LLM refused to answer when\
    \ asked about the currency of a fictional country.\n\nWith a prompt template,\
    \ the code is more maintainable and cleaner compared to using template strings\
    \ repeatedly.\n\n## Summary\n\nThe code for this chapter is available in the folder\
    \ *06_Prompt_Template* from the book source code.\n\nThe use of prompt templates\
    \ enables you to craft a sophisticated instruction for LLMs while requiring only\
    \ minimal inputs from the user.\n\nThe more specific your instruction, the more\
    \ accurate the response will be.\n\nYou can even instruct the LLM to avoid answering\
    \ unwanted prompts, as shown in the last section.\n\n# CHAPTER 7: THE LANGCHAIN\
    \ EXPRESSION LANGUAGE (LCEL)\n\nIn the previous chapter, we called the prompt.format()\
    \ method inside the llm.invoke() method as shown below:\n\n```javascript\nconst\
    \ response = await llm.invoke(\n  await prompt.format({ country, paragraph, language\
    \ })\n);\n\nconsole.log(response.content);\n```\n\nWhile this technique works,\
    \ LangChain actually provides a declarative way to sequentially execute the prompt\
    \ and llm objects.\n\nThis declarative way is called the LangChain Expression\
    \ Language (LCEL for short)\n\nUsing LCEL, you can wrap the prompt and the llm\
    \ object in a chain as follows:\n\n```javascript\nconst chain = prompt.pipe(llm);\n\
    ```\n\nLCEL is marked by the pipe() method, which can be used to wrap LangChain\
    \ components together.\n\nComponents in LangChain include the prompt, the LLM,\
    \ the chain itself, and parsers. We'll learn more about parsers in the next section.\n\
    \nYou can call the `invoke()` method from the `chain` object, and pass the inputs\
    \ required by the prompt as an object like this:\n\n```javascript\nconst response\
    \ = await chain.invoke({ country, paragraph, language });\nconsole.log(response.content);\n\
    ```\n\nThe `chain` object will format the prompt and then pass it automatically\
    \ to the `llm` object.\n\nThe `response` object is the same as when you call the\
    \ `llm.invoke()` method: it's a message object with the answer stored under the\
    \ `content` property.\n\n## Sequential Chains\n\nBy using LCEL, you can create\
    \ many chains and run the next prompt once the LLM responds to the previous prompt.\n\
    \nThis method of running the next prompt after the previous prompt has been answered\
    \ is called the sequential chain.\n\nBased on the input and output results, the\
    \ sequential chain is divided into 2 categories:\n\n- Simple Sequential Chain\n\
    - Regular Sequential Chain\n\nWe will explore the regular sequential chain in\
    \ the next chapter. For now, let’s explore the simple sequential chain.\n\n##\
    \ Simple Sequential Chain\n\nThe simple sequential chain is where each step in\
    \ the chain has a single input/ output. The output of one step will be the input\
    \ of the next prompt:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_62_0.png)\n\n\
    Figure 26. Simple Sequential Chain Illustration\n\nFor example, suppose you want\
    \ to create an application that can write a short essay.\n\nYou will provide the\
    \ topic, and the LLM will first decide on the title, and then continue by writing\
    \ the essay for that topic.\n\nTo create the application, you need to create a\
    \ prompt for the title first:\n\n```javascript\nconst titlePrompt = new PromptTemplate({\n\
    \  inputVariables: ['topic'],\n  template: `\n    You are an expert journalist.\n\
    \n    You need to come up with an interesting title for the following topic:\n\
    \    {topic}\n\n    Answer exactly with one title\n  `\n});\n```\n\nThe `titlePrompt`\
    \ above receives a single input variable: the topic for the title it will generate.\n\
    \nNext, you need to create a prompt for the essay as follows:\n\n```javascript\n\
    const essayPrompt = new PromptTemplate({\n  inputVariables: ['title'],\n  template:\
    \ `\n    You are an expert nonfiction writer.\n\n    You need to write a short\
    \ essay of 350 words for the following title:\n\n    {title}\n\n    Make sure\
    \ that the essay is engaging and makes the reader feel excited.\n  `\n});\n```\n\
    \nThis `essayPrompt` also takes a single input: the title generated by the `titlePrompt`\
    \ which we created before.\n\nNow you need to create two chains, one for each\
    \ prompt:\n\n```javascript\nconst firstChain = titlePrompt.pipe(llm).pipe(new\
    \ StringOutputParser());\n\nconst secondChain = essayPrompt.pipe(llm);\n```\n\n\
    The `firstChain` uses the `StringOutputParser` class to parse the LLM response\
    \ as a string, so you need to import the parser from LangChain:\n\n```javascript\n\
    import { StringOutputParser } from '@langchain/core/output_parsers';\n```\n\n\
    Using the string parser, the LLM response will be converted from an object into\
    \ a single string value, removing the metadata included in the response.\n\nNow\
    \ you can combine the `firstChain` and `secondChain` to create an `overallChain`\
    \ as follows:\n\n```javascript\nconst overallChain = firstChain\n    .pipe(firstChainResponse\
    \ => ({ title: firstChainResponse }))\n    .pipe(secondChain);\n```\n\nNote that\
    \ an arrow function is passed in the first `pipe()` method. This function formats\
    \ the value returned by the `firstChain` into an object that can be passed into\
    \ the `secondChain`.\n\nNow that you have an `overallChain`, let's update the\
    \ prompts questions to ask just one question:\n\n```javascript\nconsole.log('Essay\
    \ Writer');\n\nconst { topic } = await prompts([\n    {\n        type: 'text',\n\
    \        name: 'topic',\n        message: 'What topic to write?',\n        validate:\
    \ value => (value ? true : 'Topic cannot be empty'),\n    },\n]);\n\nconst response\
    \ = await overallChain.invoke({ topic });\nconsole.log(response.content);\n```\n\
    \nAnd you’re finished. If you run the application and ask for a topic, you’ll\
    \ get a response similar to this:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_65_0.png)\n\
    \n*Figure 27. Simple Sequential Chain Result*\n\nThere are a few paragraphs cut\
    \ from the result above, but you can already see that the `firstChain` prompt\
    \ generates the `title` variable used by the `secondChain` prompt.\n\nUsing simple\
    \ sequential chains allows you to break down a complex task into a sequence of\
    \ smaller tasks, improving the accuracy of the LLM results.\n\n## Using Multiple\
    \ LLMs in Sequential Chain\n\nYou can also assign a different LLM for each chain\
    \ you create using LCEL.\n\nThe following sample code runs the first chain using\
    \ Google Gemini, while the second chain uses OpenAI GPT:\n\n```javascript\nconst\
    \ llm = new ChatOpenAI({\n  model: 'gpt-4o',\n  apiKey: process.env.OPENAI_KEY,\n\
    });\n\nconst llm2 = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-pro-latest',\n\
    \  apiKey: process.env.GOOGLE_GEMINI_KEY,\n});\n\n// Use a different LLM for each\
    \ chain:\nconst firstChain = titlePrompt.pipe(llm).pipe(new StringOutputParser());\n\
    const secondChain = essayPrompt.pipe(llm2);\n```\n\nBecause LCEL is declarative,\
    \ you can swap the components in the chain easily.\n\n## Debugging the Sequential\
    \ Chains\n\nIf you want to see the process of sequential chains in more detail,\
    \ you can enable the debug mode when creating the llm object:\n\n```javascript\n\
    const llm = new ChatOpenAI({\n    model: 'gpt-4o',\n    apiKey: process.env.OPENAI_KEY,\n\
    \    debug: true\n});\n```\n\nWhen you rerun the application, you’ll see the debug\
    \ output on the terminal.\n\nYou can see the prompt sent by LangChain to LLM by\
