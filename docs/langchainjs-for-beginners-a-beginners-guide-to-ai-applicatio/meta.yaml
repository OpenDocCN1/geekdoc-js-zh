    # Chat With Document Application Process


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_95_0.png)


    Figure 37. Chat With Document Application Process


    You first need to split a single document into chunks so that the document can
    be processed and indexed effectively. The chunks are then converted into vector
    embeddings.


    Vector embeddings are arrays of numbers that represent information of various
    types, including text, images, audio, and more, by capturing their features in
    a numerical format.


    When you give a question, LangChain will convert the query into vectors, and then
    search the document vectors for the most relevant matches.


    LangChain then sends the user query and relevant text chunks to LLM so that the
    LLM can generate a response based on the given input.


    The process of finding relevant text information and sending it to the LLM is
    also known as Retrieval Augmented Generation,'
- md: "## Getting the Document\n\nYou're going to upload a document to the application\
    \ and ask questions about it. You can get the text file named ai-discussion.txt\
    \ from the source code folder.\n\nThe text file contains a fictional story that\
    \ discusses the impact of AI on humanity.\n\nBecause it's fictional, you can be\
    \ sure that the LLM obtains the answer from the document and not from its training\
    \ data.\n\n## Building the Chat With Document Application\n\nCreate a new JavaScript\
    \ file named `rag_app.js`, then import the packages required for the Chat With\
    \ Document application as follows:\n\n```javascript\nimport { ChatOpenAI, OpenAIEmbeddings\
    \ } from '@langchain/openai';\nimport { ChatPromptTemplate } from '@langchain/core/prompts';\n\
    import prompts from 'prompts';\n\n// New packages:\nimport { TextLoader } from\
    \ 'langchain/document_loaders/fs/text';\nimport { RecursiveCharacterTextSplitter\
    \ } from '@langchain/textsplitters';\nimport { MemoryVectorStore } from 'langchain/vectorstores/memory';\n\
    import { createRetrievalChain } from 'langchain/chains/retrieval';\nimport { createStuffDocumentsChain\
    \ } from 'langchain/chains/combine_documents';\nimport 'dotenv/config';\n```\n\
    \nThe `OpenAIEmbeddings` class is used to access the OpenAI embedding model.\n\
    \nThe `TextLoader` class is used to load a text file, while `RecursiveCharacterTextSplitter`\
    \ is used to split a text into small chunks so that it can be processed more efficiently\
    \ by LLMs.\n\nThe `MemoryVectorStore` class is used to store vector data in memory.\
    \ The `createRetrievalChain` retrieves a document and passes it to the `createStuffDocumentsChain`,\
    \ which passes the document to the LLM.\n\nWith the packages imported, you can\
    \ define the `llm` next as shown below:\n\n```javascript\nconst llm = new ChatOpenAI({\n\
    \  model: 'gpt-4o',\n  apiKey: process.env.OPENAI_KEY,\n});\n```\n\nAfter the\
    \ `llm`, load the text using `TextLoader` and pass the path to the document in\
    \ `TextLoader` as follows:\n\n```javascript\nconst loader = new TextLoader('./ai-discussion.txt');\n\
    const docs = await loader.load();\n```\n\nThe `docs` will be an array of `Document`\
    \ object. Now you need to create the text splitter and split the document into\
    \ chunks:\n\n```javascript\nconst splitter = new RecursiveCharacterTextSplitter({\n\
    \  chunkSize: 1000,\n  chunkOverlap: 200,\n});\n\nconst chunks = await splitter.splitDocuments(docs);\n\
    ```\n\nTo convert the document chunks into vectors, you need to use an embedding\
    \ model.\n\nOpenAI provides an API endpoint to turn documents into vectors, and\
    \ LangChain provides the OpenAIEmbeddings class so that you can use this embedding\
    \ easily.\n\nAdd the following code below the chunks variable:\n\n```javascript\n\
    const embeddings = new OpenAIEmbeddings({ apiKey: process.env.OPENAI_KEY });\n\
    \nconst vectorStore = await MemoryVectorStore.fromDocuments(chunks, embeddings);\n\
    \nconst retriever = vectorStore.asRetriever();\n```\n\nThe `MemoryVectorStore.from_documents()`\
    \ method sends the chunks and embeddings data to the vector store.\n\nNext, you\
    \ need to call the `asRetriever()` method to create a retriever object, which\
    \ accepts the user input and returns relevant chunks of the document.\n\nAfter\
    \ that, you need to create the prompt to send to the LLM:\n\n```javascript\nconst\
    \ systemPrompt = `You are an assistant for question-answering tasks.\nUse the\
    \ following pieces of retrieved context to answer\nthe question. If you don't\
    \ know the answer, say that you\ndon't know. Use three sentences maximum and keep\
    \ the\nanswer concise.\n\\n\\n{context}`;\n\nconst prompt = ChatPromptTemplate.fromMessages([\n\
    \  ['system', systemPrompt],\n  ['human', '{input}'],\n]);\n```\n\nWith the prompt\
    \ created, you need to create a chain by calling the createStuffDocumentsChain()\
    \ function and pass llm and prompt like this:\n\n```javascript\nconst questionAnswerChain\
    \ = await createStuffDocumentsChain({\n  llm: llm,\n  prompt: prompt,\n});\n```\n\
    \nThis questionAnswerChain will handle filling the prompt template and sending\
    \ the prompt to the LLM.\n\nNext, pass the questionAnswerChain to the createRetrievalChain()\
    \ function:\n\n```javascript\nconst ragChain = await createRetrievalChain({\n\
    \  retriever: retriever,\n  combineDocsChain: questionAnswerChain,\n});\n```\n\
    \nThe ragChain above will pass the input to the retriever, which returns a relevant\
    \ part of the document to the chain.\n\nThe relevant part of the chain and the\
    \ input are then passed to the questionAnswerChain to get the result.\n\nNow you\
    \ can ask for user input, then run the invoke() method with that input:\n\n```javascript\n\
    const { question } = await prompts([\n  {\n    type: 'text',\n    name: 'question',\n\
    \    message: 'Your question: ',\n    validate: value => (value ? true : 'Question\
    \ cannot be empty'),\n  },\n]);\n\nconst response = await ragChain.invoke(\n \
    \ { input: question },\n  {\n    configurable: {\n      sessionId: 'test',\n \
    \   },\n  }\n);\nconsole.log(response.answer);\n```\n\nWhen the LLM returns the\
    \ answer, you print the answer to the command line.\n\nNow the application is\
    \ completed. You can run it using Node.js from the command line:\n\n```bash\n\
    node rag_app.js\n```\n\nAnd then ask a question relevant to the document context.\
    \ Here's an example:\n\n```\nnode rag_app.js\nYour question:  ... Where does Mr.\
    \ Thompson work?\nMr. Thompson works at VegaTech Inc. as the Chief AI Scientist.\n\
    ```\n\nAs we can see, the LLM can answer the question by analyzing the prompt\
    \ created by LangChain and our input.\n\n## Adding Chat Memory for Context\n\n\
    To add chat memory to a RAG chain, you need to upgrade the retriever object by\
    \ creating a history-aware retriever.\n\nThis history-aware retriever is then\
    \ used to contextualize your latest question by analyzing the chat history.\n\n\
    You need to import the createHistoryAwareRetriever chain, then create a createHistoryAwareRetriever\
    \ object as follows:\n\n```javascript\nimport { createHistoryAwareRetriever }\
    \ from 'langchain/chains/history_aware_retriever';\n\n// ... other code\n\nconst\
    \ retriever = vectorStore.asRetriever();\n\nconst contextualizeSystemPrompt =\
    \ `\nGiven a chat history and the latest user question\nwhich might reference\
    \ context in the chat history, formulate a standalone question\nwhich can be understood\
    \ without the chat history. Do NOT answer the question,\njust reformulate it if\
    \ needed and otherwise return it as is.\n`;\n\nconst contextualizePrompt = ChatPromptTemplate.fromMessages([\n\
    \  ['system', contextualizeSystemPrompt],\n  new MessagesPlaceholder('chat_history'),\n\
    \  ['human', '{input}'],\n]);\n\nconst historyAwareRetriever = await createHistoryAwareRetriever({\n\
    \  llm,\n  retriever,\n  rephrasePrompt: contextualizePrompt,\n});\n```\n\nThe\
    \ contextualizePrompt is used to make the LLM rephrase the question in context\
    \ of the chat history.\n\nThe prompt is passed to the createHistoryAwareRetriever\
    \ object.\n\nNext, you need to add MessagesPlaceholder to the prompt object as\
    \ well:\n\n```javascript\nconst prompt = ChatPromptTemplate.fromMessages([\n \
    \ ['system', systemPrompt],\n  new MessagesPlaceholder('chat_history'),\n  ['human',\
    \ '{input}'],\n]);\n```\n\nAfter that, update the ragChain to use the historyAwareRetriever\
    \ as follows:\n\n```javascript\nconst ragChain = await createRetrievalChain({\n\
    \  retriever: historyAwareRetriever,\n  combineDocsChain: questionAnswerChain,\n\
    });\n```\n\nNow that you have an updated RAG chain, pass the chain to the RunnableWithMessageHistory()\
    \ class like we did in Chapter 9:\n\n```javascript\n// Add the imports\nimport\
    \ { ChatMessageHistory } from 'langchain/memory';\nimport { RunnableWithMessageHistory\
    \ } from '@langchain/core/runnables';\n\n// ... other code\n\nconst ragChain =\
    \ await createRetrievalChain({\n  retriever: historyAwareRetriever,\n  combineDocsChain:\
    \ questionAnswerChain,\n});\n\nconst history = new ChatMessageHistory();\n\nconst\
    \ conversationalRagChain = new RunnableWithMessageHistory({\n  runnable: ragChain,\n\
    \  getMessageHistory: sessionId => history,\n  inputMessagesKey: 'input',\n  historyMessagesKey:\
    \ 'chat_history',\n  outputMessagesKey: 'answer',\n});\n```\n\nAs the last step,\
    \ change the chain invoked when the application receives a question to conversationalRagChain,\
    \ and add the configurable parameter for the sessionId.\n\nTo repeat the prompt,\
    \ add a while loop as before:"
