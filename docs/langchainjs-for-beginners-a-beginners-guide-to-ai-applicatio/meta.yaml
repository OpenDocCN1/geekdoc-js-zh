  md: '# Types of AI Agents


    There are several types of AI agents identified today, and the one we created
    is called a ReAct (Reason + Act) agent.


    The ReAct agent is a general-purpose agent, and there are more specialized agents
    such as the XML agent and JSON agent.


    You can read more about the different agent types at https://js.langchain.com/v0.1/docs/modules/agents/agent_types/


    As LLM and LangChain improve, new types of agents might be created, so the definitions
    above won’t always be relevant.


    # Summary


    The code for this chapter is available in the folder *10_Agents_and_Tools* from
    the book source code.


    While we don’t have an autonomous robot helper (yet) in our world today, we can
    already see how the development of AI agents might one day be used as the brains
    of AI robots.


    AI agents are a wonderful innovation that shows how a machine can come up with
    a sequence of actions to take to accomplish a goal.


    When you create an agent, the LLM is used as a reasoning engine that needs to
    come up with steps of logic to accomplish a task.


    The agent can also use various tools to act, such as browsing the web or solving
    a math equation.'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'More complex tasks that use multiple tools can also be executed by these agents.


    Sometimes, a well-trained LLM can answer directly from the training data, bypassing
    the need to use tools.'
