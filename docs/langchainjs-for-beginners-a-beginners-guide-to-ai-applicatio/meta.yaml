    or RAG for short.


    Using LangChain, you can create an application that processes a document so you
    can ask the LLM questions relevant to the content of that document.


    Let’s jump in.


    # Getting the Document


    You’re going to upload a document to the application and ask questions about it.
    You can get the text file named ai-discussion.txt from the source code folder.


    The text file contains a fictional story that discusses the impact of AI on humanity.


    Because it’s fictional, you can be sure that the LLM obtains the answer from the
    document and not from its training data.


    # Building the Chat With Document Application


    Create a new JavaScript file named `rag_app.js`, then import the packages required
    for the Chat With Document application as follows:


    ```

    import { ChatOpenAI, OpenAIEmbeddings } from ''@langchain/openai'';

    import { ChatPromptTemplate } from ''@langchain/core/prompts'';

    import prompts from ''prompts'';


    // New packages:

    import { TextLoader } from ''langchain/document_loaders/fs/text'';

    import { RecursiveCharacterTextSplitter } from ''@langchain/textsplitters'';

    import { MemoryVectorStore } from ''langchain/vectorstores/memory'';

    import { createRetrievalChain } from ''langchain/chains/retrieval'';

    import { createStuffDocumentsChain } from ''langchain/chains/combine_documents'';

    ```'
