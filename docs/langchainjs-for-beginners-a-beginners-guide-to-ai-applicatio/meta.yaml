    \  template: `\n    You are a currency expert.\n    You give information about\
    \ a specific currency used in a specific country.\n\n    Answer the question:\
    \ What is the currency of {country}?\n\n    Answer in {paragraph} short paragraph\
    \ in {language}\n  `,\n});\n```\n\n由于我们有三个输入变量，我们需要向用户请求输入。\n\n就在 `prompts()`\
