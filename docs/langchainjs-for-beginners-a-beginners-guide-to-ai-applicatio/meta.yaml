  - '[PAGE 61]


    Components in LangChain include the prompt, the LLM, the chain itself, and parsers.
    We''ll learn more about parsers in the next section.


    You can call the `invoke()` method from the `chain` object, and pass the inputs
    required by the prompt as an object like this:


    ```

    const response = await chain.invoke({ country, paragraph, language });

    console.log(response.content);

    ```


    The `chain` object will format the prompt and then pass it automatically to the
    `llm` object.


    The `response` object is the same as when you call the `llm.invoke()` method:
    it''s a message object with the answer stored under the `content` property.


    # Sequential Chains


    By using LCEL, you can create many chains and run the next prompt once the LLM
    responds to the previous prompt.


    This method of running the next prompt after the previous prompt has been answered
    is called the sequential chain.


    Based on the input and output results, the sequential chain is divided into 2
    categories:


    +   - Simple Sequential Chain

    - Regular Sequential Chain'
