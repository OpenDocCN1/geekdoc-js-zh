  md: '# CHAPTER 16: DEPLOYING NEXT.JS AI APPLICATION TO PRODUCTION


    Now that the Next.js application is working, we’re going to make a few improvements
    so that the application can be deployed into production.


    We need to improve the user experience so that the application feels more interactive,
    and then ask for an API key from the user to use the application.


    # Streaming the Response


    So far, the response from the LLM is displayed all at once after the LLM has finished
    generating an answer. This delay makes the user experience less interactive.


    To improve the user experience, we can stream the response as the LLM generates
    one. This way, users will see the output gradually, making the interaction feel
    more dynamic and responsive.


    From the terminal, run `npm install ai` as follows:'
  merge: -1
  pgno: 143
- img_proc: true
  md: "```\nnpm install ai\n```\n\nThe ai package is a library used for managing chat\
    \ streams and UI updates. It enables you to develop dynamic AI-driven interfaces\
    \ more efficiently.\n\nNow open the openai.action.ts file and import the createStreamableValue\
    \ function from the ai/rsc package:\n\n```\nimport { createStreamableValue } from\
    \ 'ai/rsc';\n\nexport const getReply = async (message: string) => {\n  const stream\
    \ = createStreamableValue();\n\n  (async () => {\n    const response = await chainWithHistory.stream(\n\
    \      {\n        input: message,\n      },\n      {\n        configurable: {\n\
    \          sessionId: 'test',\n        },\n      }\n    );\n\n    for await (const\
    \ chunk of response) {\n      stream.update(chunk.content);\n    }\n\n    stream.done();\n\
    \  })();\n\n  return { streamData: stream.value };\n};\n```\n\nThe createStreamableValue()\
    \ function is used to create a streamable object. This object can be updated in\
    \ real-time as the response is coming."
  merge: -1
  pgno: 144
- img_proc: true
  md: "Instead of the usual invoke() method, we call the stream() method from the\
    \ chain.\n\nThe stream() method returns an iterable, which is updated as the response\
    \ is streamed by LangChain.\n\nThe for await...of syntax is used to handle asynchronous\
    \ iteration over the chunks of data received by the response object.\n\nWhen the\
    \ response is completed, the stream.done() method is called to signal the stream\
    \ process is finished, and the stream.value will be returned.\n\nThe stream process\
    \ is wrapped in an immediately invoked function expression (IIFE) so that the\
    \ streaming runs in parallel.\n\nIf we remove the IIFE, the streamData is immediately\
    \ returned to the front-end before the stream is finished.\n\nNext, open the chat/index.tsx\
    \ file and update the sendMessage() function to read the streamable value as follows:\n\
    \n```\nimport { readStreamableValue } from 'ai/rsc';\n\nconst sendMessage = async\
    \ (newMessage: Message) => {\n  setLoadingSubmit(true);\n  setMessages(prevMessages\
    \ => [...prevMessages, newMessage]);\n\n  const { streamData } = await getReply(newMessage.content);\n\
    \n  const reply: Message = {\n    role: 'assistant',\n    content: '',\n  };\n\
    ```"
  merge: -1
  pgno: 145
- img_proc: true
  md: "```\nsetLoadingSubmit(false);\nsetMessages(prevMessages => [...prevMessages,\
    \ reply]);\n\nfor await (const stream of readStreamableValue(streamData)) {\n\
    \  reply.content = `${reply.content}${stream}`;\n  setMessages(prevMessages =>\
    \ {\n    return [...prevMessages.slice(0, -1), reply];\n  });\n}\n};\n```\n\n\
    Here, we change the name of the response variable into streamValue, then we initialize\
    \ the reply object with an empty content property.\n\nWhen we receive a response,\
    \ call the setLoadingSubmit(false) to stop the thinking indicator, and then set\
    \ reply as the latest message.\n\nAfter that, create another for await...of loop\
    \ to read the streamable value and pass it as the value of reply.content.\n\n\
    The latest message is overwritten by the reply object constantly using the setMessages()\
    \ function\n\nNow when you send a message to the LLM, the response will have a\
    \ typed animation.\n\n# Creating API Key Input\n\nThis Next.js application is\
