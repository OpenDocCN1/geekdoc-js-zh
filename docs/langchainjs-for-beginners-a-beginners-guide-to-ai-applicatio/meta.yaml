    # # CHAPTER 2: YOUR FIRST LANGCHAIN APPLICATION


    It’s time to create our first LangChain application.


    We will create a simple question and answer application where we can ask any kind
    of question to a Large Language Model


    First, create a folder on your computer that will be used to store all files related
    to this project. You can name the folder ''beginning_langchain_js''.


    Next, open the Visual Studio Code, and select `File > Open Folder...` from the
    menu bar. Select the folder you’ve just created earlier.


    VSCode will load the folder and display the content in the Explorer sidebar, it
    should be empty as we haven’t created any files yet.


    To create a file, right-click anywhere inside the VSCode window and select `New
    Text File` or `New File...` from the menu.


    Once the file is created, press `Control + S` or `Command + S` to save the file.
    Name that file as app.js.'
  - '[PAGE 20]


    # # Installing LangChain Packages


    Now you need to install the packages required to create a LangChain application.


    In VSCode, right-click on the folder you''ve just created, then select *Open in
    Integrated Terminal* to show the command line inside VSCode.


    On the terminal, run the following command:


    ```

    npm install langchain @langchain/google-genai dotenv

    ```


    The above command will install three packages:


    +   - langchain contains all the core modules of LangChain

    - @langchain/google-genai is the Google Generative AI integration module

    - dotenv is used to load LLM API keys from environment variables


    Once the packages are installed, npm will generate a package.json file containing
    the versions of these installed packages.


    # # Creating the Question & Answer Application


    It''s time to write the code for the question and answer application.'
  - "[PAGE 21]\n\nOn the app.js file, import the Google Generative AI class and load\
    \ the environment variables:\n\n```\nimport { ChatGoogleGenerativeAI } from '@langchain/google-genai';\n\
    \n// load environment variables\nimport 'dotenv/config';\n```\n\nTo interact with\
    \ LLMs in LangChain, you need to create an object that represents the API for\
    \ that LLM.\n\nBecause we want to interact with Google's LLM, we need to create\
    \ an object from the ChatGoogleGenerativeAI class as follows:\n\n```\nconst llm\
    \ = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-pro-latest',\n  apiKey:\
    \ process.env.GOOGLE_GEMINI_KEY,\n});\n```\n\nThe GOOGLE_GEMINI_KEY contains the\
    \ API key which you're going to get in the next section.\n\nFor now, you just\
    \ need to understand that the ChatGoogleGenerativeAI object represents the Google\
    \ LLM you want to use.\n\nWhen instantiating a new llm object, you need to pass\
    \ an object specifying the options for that instance.\n\nThe model option is required\
    \ so that Google knows which model you want to use, and the apiKey option is used\
    \ to verify you have permission to use that model."
  - "[PAGE 22]\n\nNext, write the code for a simple question and answer application\
    \ as follows:\n\n```\nconsole.log('Q & A With AI');\nconsole.log('================');\n\
    \nconst question = \"What's the currency of Thailand?\";\nconsole.log(`Question:\
    \ ${question}`);\n\nconst response = await llm.invoke(question);\nconsole.log(`Answer:\
    \ ${response.content}`);\n```\n\nIn the code above, we simply print some text\
    \ showing the question we want to ask the model.\n\nThe llm.invoke() method will\
    \ send the input question to the LLM and return response object.\n\nThe answer\
    \ is stored under the content property, so we print response.content value.\n\n\
    Because we use the await syntax, we need to add the \"type\": \"module\" option\
    \ in the package.json file as follows:\n\n```\n{\n  \"type\": \"module\",\n  \"\
    dependencies\": {\n    // ...\n  }\n}\n```\n\nThis type option is also needed\
    \ when we use the import syntax for the packages instead of require().\n\nNow\
    \ the application is ready, but we still need to get the Google Gemini API key\
    \ to access the LLM."
- md: "## Getting Google Gemini API Key\n\nTo get the API key, you need to visit the\
    \ Gemini API page at [https://ai.google.dev/gemini-api](https://ai.google.dev/gemini-api).\n\
    \nOn the page, you need to click the 'Get API Key in Google AI Studio' button\
    \ as shown below:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_23_0.png)\n\n*Figure\
    \ 6. Get Gemini API Key*\n\nFrom there, you'll be taken to Google AI Studio.\n\
    \nNote that, you might be shown the page below when clicking the button:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_24_0.png)\n\
    \nFigure 7. Google AI Studio Available Regions Page\n\nThis page usually appears\
    \ when you are located in a region that's not served by Google AI Studio.\n\n\
    One way to handle this is to use a VPN service, but I would recommend you use\
    \ another LLM instead, such as OpenAI or Ollama which I will show in the next\
    \ chapters.\n\nIf this is your first time accessing the studio, it will show you\
    \ the terms of service like this:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_25_0.png)\n\
    \nFigure 8. Google AI Studio Terms of Service\n\nJust check on the 'I consent'\
    \ option, then click 'Continue'.\n\nNow click the 'Create API Key' button to create\
    \ the key:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_26_0.png)\n\nFigure 9.\
    \ Gemini Create API Key\n\nIf you’re asked where to create the API Key, select\
    \ create in new project:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_27_0.png)\n\
    \n*Figure 10. Create API Key in New Project*\n\nGoogle will create a Cloud project\
    \ and generate the key for you.\n\nAfter a while, you should see the key shown\
    \ in a pop-up box as follows:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_27_1.png)\n\
    \n*Figure 11. Gemini API Key Generated*\n\nCopy the API key string, then create\
    \ a .env file in your application folder with the following content:\n\n```\n\
    GOOGLE_GEMINI_KEY='Your Key Here'\n```\n\nReplace the Your Key Here string above\
    \ with your actual API key.\n\n## Running the Application\n\nWith the API key\
    \ obtained, you are ready to run the LangChain application.\n\nFrom the terminal,\
    \ run the app.js file using Node.js as follows:\n\n```\nnode app.js\n```\n\nYou\
    \ should see the following output in your terminal:\n\n```\nQ & A With AI\n============\n\
    Question: What's the currency of Thailand?\nAnswer: Thai baht\n```\n\nThis means\
    \ you have successfully created your first LangChain application and interacted\
    \ with Google's Gemini LLM using the API key.\n\nEach LLM model has its own characteristics.\
    \ The 'gemini-1.5-pro-latest' model usually answers a question directly with no\
    \ extra information.\n\nYou can try changing the model to 'gemini-1.5-flash-latest'\
    \ as shown below:\n\n```\nconst llm = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-flash-latest',\n\
    \  apiKey: process.env.GOOGLE_GEMINI_KEY,\n});\n```\n\nNow run the app.js file\
    \ again, and the answer is a bit different this time:\n\n```\nQ & A With AI\n\
    =============\nQuestion: What's the currency of Thailand?\nAnswer: The currency\
    \ of Thailand is the **Thai baht**, which is abbreviated as **THB**.\n```\n\n\
    Here, the 'gemini-1.5-flash' repeats the question first, then gives more information\
    \ such as the currency abbreviation and symbol.\n\nThe asterisk ** symbols around\
    \ THB are meant to make the text appear in bold, but it’s rendered as-is in the\
    \ terminal.\n\nNow try replacing the question variable with any question you want\
    \ to ask the LLM.\n\n## Resource Exhausted Error\n\nWhen using Google Gemini,\
    \ you might see an error like this when running the application:\n\n```\nResourceExhausted:\
    \ 429 Resource has been exhausted (e.g. check quota)..\n```\n\nThis error occurs\
    \ because the free tier resource has been exhausted. You need to try again at\
    \ a later time.\n\n## Summary\n\nThe code for this chapter is available in the\
    \ *02_Simple_Q&A_Gemini* folder.\n\nIn this chapter, you’ve created and run your\
    \ first LangChain application. Congratulations!\n\nThe application can connect\
    \ to Google’s Gemini LLM to ask questions and get answers.\n\nIn the next chapter,\
    \ we’re going to learn how to use OpenAI’s GPT model in LangChain.\n\n# CHAPTER\
    \ 3: USING OPENAI LLM IN LANGCHAIN\n\nIn the previous chapter, you've seen how\
    \ to communicate with Google's Gemini model using LangChain.\n\nIn this chapter,\
    \ I will show you how to use OpenAI in LangChain as an alternative.\n\nBut keep\
    \ in mind that the OpenAI API has no free tier. It used to give away $5 worth\
    \ of API usage, but it seems to have been quietly stopped.\n\nSo if you want to\
    \ use OpenAI API, you need to buy the minimum amount of credit, which is $5 USD.\n\
    \n## Getting Started With OpenAI API\n\nOpenAI is an AI research company that\
    \ aims to develop and promote capable AI software for the benefit of humanity.\
    \ The famous ChatGPT is one of the products developed by OpenAI.\n\nBesides the\
    \ ChatGPT application, OpenAI also offers GPT models, the LLM that powers ChatGPT,\
    \ in the form of HTTP API endpoints.\n\nTo use OpenAI's API, you need to register\
    \ an account on their website at https://platform.openai.com.\n\nAfter you sign\
    \ up, you can go to https://platform.openai.com/api-keys to create a new secret\
    \ key.\n\nWhen you try to create a key for the first time, you'll be asked to\
    \ verify by adding a phone number:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_32_0.png)\n\
    \nOpenAI only uses your phone number for verification purpose. You will receive\
    \ the verification code through SMS.\n\nOnce you're verified, you're going to\
    \ be asked to add credit balance for API usage. If not, go to https://platform.openai.com/account/billing\
    \ to add some credits.\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_33_0.png)\n\
    \nFigure 13. OpenAI Adding Credits\n\nOpenAI receives payment using credit cards,\
    \ so you need to have one. The lowest amount you can buy is $5 USD, and it will\
    \ be more than enough to run all the examples in this book using OpenAI.\n\nAlternatively,\
    \ if you somehow get the $5 free trial credits, then you don’t need to set up\
    \ your billing information.\n\nNext, input the name and select the project the\
    \ key will belong to:\n\n# Create new secret key\n\nOwned by\n\nYou  Service account\n\
    \nThis API key is tied to your user and can make requests against the selected\
    \ project. If you are removed from the organization or project, this key will\
    \ be disabled.\n\nName  Optional\n\nLangChain-Test\n\nProject\n\nDefault project\n\
    \nPermissions\n\n+   All  Restricted  Read Only\n\nCancel  Create secret key\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_34_0.png)\n\nClick the 'Create secret\
    \ key' button, and OpenAI will show you the generated key:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_35_0.png)\n\
    \n*Figure 15. OpenAI Copy API Key*\n\nYou need to copy and paste this API key\
    \ into the .env file of your project:\n\n```\nOPENAI_KEY='Your Key Here'\n```\n\
    \nNow that you have the OpenAI key ready, it’s time to use it in the LangChain\
    \ application.\n\n## Integrating OpenAI With LangChain\n\nTo use OpenAI in LangChain,\
    \ you need to install the @langchain/openai package using npm:\n\n```\nnpm install\
    \ @langchain/openai\n```\n\nOnce the package is installed, create a new file named\
    \ app_gpt.js and import the ChatOpenAI class from the package.\n\nWhen instantiating\
    \ the llm object, specify the model and openAIApiKey options as shown below:\n\
    \n```\nimport { ChatOpenAI } from '@langchain/openai';\n\nimport 'dotenv/config';\n\
    \nconst llm = new ChatOpenAI({\n  model: 'gpt-4o',\n  openAIApiKey: process.env.OPENAI_KEY,\n\
    });\n```\n\nYou can change the model parameter with the model you want to use.\
    \ As of this writing, GPT-4o is the latest LLM released by OpenAI.\n\nLet’s ask\
    \ GPT the same question we asked to Gemini:\n\n```\nconsole.log('Q & A With AI');\n\
    console.log('=============');\n\nconst question = \"What's the currency of Thailand?\"\
    ;\nconsole.log(`Question: ${question}`);\n\nconst response = await llm.invoke(question);\n\
    console.log(`Answer: ${response.content}`);\n```\n\nSave the changes, then run\
    \ the file using Node.js:\n\n```\nnode app_gpt.js\n```\n\nYou should get a response\
    \ similar to this:\n\n```\nQ & A With AI\n=============\nQuestion: What's the\
    \ currency of Thailand?\nAnswer: The currency of Thailand is the Thai Baht. Its\
    \ ISO code is THB.\n```"
  mdcn: "\n## 获取 Google Gemini API 密钥\n\n要获取 API 密钥，您需要访问 Gemini API 页面：[https://ai.google.dev/gemini-api](https://ai.google.dev/gemini-api)。\n\
    \n在页面上，您需要点击如下所示的“在 Google AI Studio 中获取 API 密钥”按钮：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_23_0.png)\n\
    \n*图 6. 获取 Gemini API 密钥*\n\n之后，您将被带到 Google AI Studio。\n\n请注意，点击该按钮时，您可能会看到如下页面：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_24_0.png)\n\n图 7. Google AI Studio\
    \ 可用区域页面\n\n此页面通常在您位于 Google AI Studio 不提供服务的地区时出现。\n\n一种解决方法是使用 VPN 服务，但我建议您改用其他\
    \ LLM，例如 OpenAI 或 Ollama，我将在后续章节中介绍。\n\n如果这是您第一次访问 Studio，它会显示如下服务条款：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_25_0.png)\n\
    \n图 8. Google AI Studio 服务条款\n\n只需勾选“我同意”选项，然后点击“继续”。\n\n现在点击“创建 API 密钥”按钮来创建密钥：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_26_0.png)\n\n图 9. Gemini 创建 API 密钥\n\
    \n如果被询问在何处创建 API 密钥，请选择在新项目中创建：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_27_0.png)\n\
    \n*图 10. 在新项目中创建 API 密钥*\n\nGoogle 将会创建一个 Cloud 项目并为您生成密钥。\n\n稍后，您应该会看到密钥显示在一个弹出框中，如下所示：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_27_1.png)\n\n*图 11. Gemini API 密钥已生成*\n\
    \n复制 API 密钥字符串，然后在您的应用程序文件夹中创建一个 .env 文件，内容如下：\n\n```\nGOOGLE_GEMINI_KEY='Your\
    \ Key Here'\n```\n\n将上面的 Your Key Here 字符串替换为您的实际 API 密钥。\n\n## 运行应用程序\n\n获得 API\
    \ 密钥后，您就可以运行 LangChain 应用程序了。\n\n在终端中，使用 Node.js 运行 app.js 文件，如下所示：\n\n```\nnode\
    \ app.js\n```\n\n您应该在终端中看到以下输出：\n\n```\nQ & A With AI\n============\nQuestion:\
    \ What's the currency of Thailand?\nAnswer: Thai baht\n```\n\n这意味着您已成功创建了第一个 LangChain\
    \ 应用程序，并使用 API 密钥与 Google 的 Gemini LLM 进行了交互。\n\n每个 LLM 模型都有其自身的特点。“gemini-1.5-pro-latest”模型通常直接回答问题，不提供额外信息。\n\
    \n您可以尝试将模型更改为“gemini-1.5-flash-latest”，如下所示：\n\n```\nconst llm = new ChatGoogleGenerativeAI({\n\
    \  model: 'gemini-1.5-flash-latest',\n  apiKey: process.env.GOOGLE_GEMINI_KEY,\n\
    });\n```\n\n现在再次运行 app.js 文件，这次的答案会有所不同：\n\n```\nQ & A With AI\n=============\n\
    Question: What's the currency of Thailand?\nAnswer: The currency of Thailand is\
    \ the **Thai baht**, which is abbreviated as **THB**.\n```\n\n这里，“gemini-1.5-flash”首先重复了问题，然后提供了更多信息，例如货币缩写和符号。\n\
    \nTHB 周围的星号 ** 符号旨在使文本显示为粗体，但在终端中它被原样渲染。\n\n现在，尝试将 question 变量替换为您想向 LLM 提出的任何问题。\n\
    \n## 资源耗尽错误\n\n使用 Google Gemini 时，运行应用程序时可能会看到如下错误：\n\n```\nResourceExhausted:\
    \ 429 Resource has been exhausted (e.g. check quota)..\n```\n\n此错误发生是因为免费套餐的资源已耗尽。您需要稍后再试。\n\
    \n## 总结\n\n本章的代码位于 *02_Simple_Q&A_Gemini* 文件夹中。\n\n在本章中，您已经创建并运行了您的第一个 LangChain\
    \ 应用程序。恭喜！\n\n该应用程序可以连接到 Google 的 Gemini LLM，以提出问题并获取答案。\n\n在下一章中，我们将学习如何在 LangChain\
    \ 中使用 OpenAI 的 GPT 模型。\n\n# 第 3 章：在 LANGCHAIN 中使用 OPENAI LLM\n\n在上一章中，您已经了解了如何使用\
    \ LangChain 与 Google 的 Gemini 模型进行通信。\n\n在本章中，我将向您展示如何在 LangChain 中使用 OpenAI 作为替代方案。\n\
    \n但请记住，OpenAI API 没有免费套餐。它曾经提供价值 5 美元的 API 使用额度，但似乎已经悄悄停止了。\n\n因此，如果您想使用 OpenAI\
    \ API，您需要购买最少的信用额度，即 5 美元。\n\n## OPENAI API 入门\n\nOpenAI 是一家人工智能研究公司，旨在开发并推广有益于人类的强大\
    \ AI 软件。著名的 ChatGPT 就是 OpenAI 开发的产品之一。\n\n除了 ChatGPT 应用程序外，OpenAI 还以 HTTP API\
    \ 端点的形式提供 GPT 模型，这是驱动 ChatGPT 的 LLM。\n\n要使用 OpenAI 的 API，您需要在他们的网站 https://platform.openai.com\
    \ 上注册一个帐户。\n\n注册后，您可以访问 https://platform.openai.com/api-keys 来创建一个新的密钥。\n\n当您首次尝试创建密钥时，会被要求通过添加电话号码进行验证：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_32_0.png)\n\nOpenAI 仅使用您的电话号码进行验证。您将通过短信收到验证码。\n\
    \n一旦验证通过，系统会要求您为 API 使用添加信用额度。如果没有，请访问 https://platform.openai.com/account/billing\
    \ 添加一些信用额度。\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_33_0.png)\n\n图 13. OpenAI\
    \ 添加信用额度\n\nOpenAI 接受信用卡支付，因此您需要有一张信用卡。您可以购买的最低金额是 5 美元，这足以使用 OpenAI 运行本书中的所有示例。\n\
    \n或者，如果您以某种方式获得了 5 美元的试用额度，那么您就不需要设置计费信息。\n\n接下来，输入名称并选择密钥所属的项目：\n\n# 创建新的密钥\n\
    \n所有者\n\n您  服务帐户\n\n此 API 密钥与您的用户关联，可以对所选项目进行请求。如果您被从组织或项目中移除，此密钥将被禁用。\n\n名称 \
    \ 可选\n\nLangChain-Test\n\n项目\n\n默认项目\n\n权限\n\n+   全部  受限  只读\n\n取消  创建密钥\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_34_0.png)\n\
    \n点击“创建密钥”按钮，OpenAI 将向您显示生成的密钥：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_35_0.png)\n\
    \n*图 15. OpenAI 复制 API 密钥*\n\n您需要将此 API 密钥复制并粘贴到项目的 .env 文件中：\n\n```\nOPENAI_KEY='Your\
    \ Key Here'\n```\n\n现在您的 OpenAI 密钥已准备好，是时候在 LangChain 应用程序中使用它了。\n\n## 将 OPENAI\
    \ 与 LANGCHAIN 集成\n\n要在 LangChain 中使用 OpenAI，您需要使用 npm 安装 @langchain/openai 包：\n\
    \n```\nnpm install @langchain/openai\n```\n\n安装完包后，创建一个名为 app_gpt.js 的新文件，并从包中导入\
    \ ChatOpenAI 类。\n\n实例化 llm 对象时，指定 model 和 openAIApiKey 选项，如下所示：\n\n```\nimport\
    \ { ChatOpenAI } from '@langchain/openai';\n\nimport 'dotenv/config';\n\nconst\
    \ llm = new ChatOpenAI({\n  model: 'gpt-4o',\n  openAIApiKey: process.env.OPENAI_KEY,\n\
    });\n```\n\n您可以将 model 参数更改为要使用的模型。截至撰写本文时，GPT-4o 是 OpenAI 发布的最新 LLM。\n\n让我们向\
    \ GPT 询问与 Gemini 相同的问题：\n\n```\nconsole.log('Q & A With AI');\nconsole.log('=============');\n\
    \nconst question = \"What's the currency of Thailand?\";\nconsole.log(`Question:\
    \ ${question}`);\n\nconst response = await llm.invoke(question);\nconsole.log(`Answer:\
    \ ${response.content}`);\n```\n\n保存更改，然后使用 Node.js 运行该文件：\n\n```\nnode app_gpt.js\n\
    ```\n\n您应该会得到类似于以下内容的响应：\n\n```\nQ & A With AI\n=============\nQuestion: What's\
    \ the currency of Thailand?\nAnswer: The currency of Thailand is the Thai Baht.\
    \ Its ISO code is THB.\n```\n"
