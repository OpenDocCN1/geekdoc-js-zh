    \  retriever: historyAwareRetriever,\n  combineDocsChain: questionAnswerChain,\n\
    });\n```\n\nNow that you have an updated RAG chain, pass the chain to the RunnableWithMessageHistory()\
    \ class like we did in Chapter 9:\n\n```\n// Add the imports\nimport { ChatMessageHistory\
