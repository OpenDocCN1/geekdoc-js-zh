    In this chapter, you''ve learned how to create a Chat With Document application
    using LangChain.


    Using the RAG technique, LangChain can be used to retrieve information from a
    document, and then pass the information to the LLM.


    The first thing you need to do is to process the document and turn it into chunks,
    which can then be converted into vectors using an embedding model.


    The vectors are stored in a vector database, and the retriever created from the
