    \ 'low',\n                },\n            },\n        ],\n    ],\n]);\n```\n\n\
    在上面的模板中，你可以看到作为人类消息传递了两个元素：用于问题的“text”和用于图像的“image_url”。\n\n我们可以传递公共图像URL，例如“https://”，但这里我们使用data:image\
