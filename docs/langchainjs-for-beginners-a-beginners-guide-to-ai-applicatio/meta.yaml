- img_proc: true
  md: "# CHAPTER 7: THE LANGCHAIN EXPRESSION LANGUAGE (LCEL)\n\nIn the previous chapter,\
    \ we called the prompt.format() method inside the llm.invoke() method as shown\
    \ below:\n\n```\nconst response = await llm.invoke(\n  await prompt.format({ country,\
    \ paragraph, language })\n);\n\nconsole.log(response.content);\n```\n\nWhile this\
    \ technique works, LangChain actually provides a declarative way to sequentially\
    \ execute the prompt and llm objects.\n\nThis declarative way is called the LangChain\
    \ Expression Language (LCEL for short)\n\nUsing LCEL, you can wrap the prompt\
    \ and the llm object in a chain as follows:\n\n```\nconst chain = prompt.pipe(llm);\n\
    ```\n\nLCEL is marked by the pipe() method, which can be used to wrap LangChain\
    \ components together."
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Components in LangChain include the prompt, the LLM, the chain itself, and
    parsers. We''ll learn more about parsers in the next section.


    You can call the `invoke()` method from the `chain` object, and pass the inputs
    required by the prompt as an object like this:


    ```

    const response = await chain.invoke({ country, paragraph, language });

    console.log(response.content);

    ```


    The `chain` object will format the prompt and then pass it automatically to the
    `llm` object.


