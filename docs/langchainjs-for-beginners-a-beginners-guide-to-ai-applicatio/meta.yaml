  md: '# # CHAPTER 11: INTERACTING WITH DOCUMENTS IN LANGCHAIN


    One of the most interesting AI use cases is the Chat With Document feature, which
    enables users to interact with a document using conversational queries.


    By simply asking questions, users can quickly find relevant information, summarize
    content, and gain insights without having to read and sort through pages of text.


    Here''s an illustration of the process required to create a Chat With Document
    application:'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Chat With Document Application Process


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_95_0.png)


    Figure 37. Chat With Document Application Process


    You first need to split a single document into chunks so that the document can
    be processed and indexed effectively. The chunks are then converted into vector
    embeddings.


    Vector embeddings are arrays of numbers that represent information of various
    types, including text, images, audio, and more, by capturing their features in
    a numerical format.


    When you give a question, LangChain will convert the query into vectors, and then
    search the document vectors for the most relevant matches.


    LangChain then sends the user query and relevant text chunks to LLM so that the
    LLM can generate a response based on the given input.


    The process of finding relevant text information and sending it to the LLM is
    also known as Retrieval Augmented Generation,'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'or RAG for short.


    Using LangChain, you can create an application that processes a document so you
    can ask the LLM questions relevant to the content of that document.


    Let’s jump in.


    # Getting the Document


    You’re going to upload a document to the application and ask questions about it.
    You can get the text file named ai-discussion.txt from the source code folder.


    The text file contains a fictional story that discusses the impact of AI on humanity.


    Because it’s fictional, you can be sure that the LLM obtains the answer from the
    document and not from its training data.


    # Building the Chat With Document Application


    Create a new JavaScript file named `rag_app.js`, then import the packages required
    for the Chat With Document application as follows:


    ```

    import { ChatOpenAI, OpenAIEmbeddings } from ''@langchain/openai'';

    import { ChatPromptTemplate } from ''@langchain/core/prompts'';

    import prompts from ''prompts'';


    // New packages:

    import { TextLoader } from ''langchain/document_loaders/fs/text'';

    import { RecursiveCharacterTextSplitter } from ''@langchain/textsplitters'';

    import { MemoryVectorStore } from ''langchain/vectorstores/memory'';

    import { createRetrievalChain } from ''langchain/chains/retrieval'';

    import { createStuffDocumentsChain } from ''langchain/chains/combine_documents'';

    ```'
  merge: -1
  pgno: 96
- img_proc: true
  md: "```\nimport 'dotenv/config';\n```\n\nThe `OpenAIEmbeddings` class is used to\
    \ access the OpenAI embedding model.\n\nThe `TextLoader` class is used to load\
    \ a text file, while `RecursiveCharacterTextSplitter` is used to split a text\
    \ into small chunks so that it can be processed more efficiently by LLMs.\n\n\
    The `MemoryVectorStore` class is used to store vector data in memory. The `createRetrievalChain`\
    \ retrieves a document and passes it to the `createStuffDocumentsChain`, which\
    \ passes the document to the LLM.\n\nWith the packages imported, you can define\
    \ the `llm` next as shown below:\n\n```\nconst llm = new ChatOpenAI({\n  model:\
    \ 'gpt-4o',\n  apiKey: process.env.OPENAI_KEY,\n});\n```\n\nAfter the `llm`, load\
    \ the text using `TextLoader` and pass the path to the document in `TextLoader`\
    \ as follows:\n\n```\nconst loader = new TextLoader('./ai-discussion.txt');\n\
    const docs = await loader.load();\n```\n\nThe `docs` will be an array of `Document`\
    \ object. Now you need to create the text splitter and split the document into\
    \ chunks:\n\n```\nconst splitter = new RecursiveCharacterTextSplitter({\n  chunkSize:\
    \ 1000,\n  chunkOverlap: 200,\n});\n```"
  merge: -1
  pgno: 97
- img_proc: true
  md: "```\nconst chunks = await splitter.splitDocuments(docs);\n```\n\nTo convert\
    \ the document chunks into vectors, you need to use an embedding model.\n\nOpenAI\
    \ provides an API endpoint to turn documents into vectors, and LangChain provides\
    \ the OpenAIEmbeddings class so that you can use this embedding easily.\n\nAdd\
    \ the following code below the chunks variable:\n\n```\nconst embeddings = new\
    \ OpenAIEmbeddings({ apiKey: process.env.OPENAI_KEY });\n\nconst vectorStore =\
    \ await MemoryVectorStore.fromDocuments(chunks, embeddings);\n\nconst retriever\
    \ = vectorStore.asRetriever();\n```\n\nThe `MemoryVectorStore.from_documents()`\
    \ method sends the chunks and embeddings data to the vectore store.\n\nNext, you\
    \ need to call the `asRetriever()` method to create a retriever object, which\
    \ accepts the user input and returns relevant chunks of the document.\n\nAfter\
    \ that, you need to create the prompt to send to the LLM:\n\n```\nconst systemPrompt\
    \ = `You are an assistant for question-answering tasks.\nUse the following pieces\
    \ of retrieved context to answer\nthe question. If you don't know the answer,\
    \ say that you\ndon't know. Use three sentences maximum and keep the\nanswer concise.\n\
    \\n\\n{context}`;\n\nconst prompt = ChatPromptTemplate.fromMessages([\n  ['system',\
    \ systemPrompt],\n  ['human', '{input}'],\n]);\n```"
  merge: -1
  pgno: 98
- img_proc: true
  md: "With the prompt created, you need to create a chain by calling the createStuffDocumentsChain()\
    \ function and pass llm and prompt like this:\n\n```\nconst questionAnswerChain\
    \ = await createStuffDocumentsChain({\n  llm: llm,\n  prompt: prompt,\n});\n```\n\
    \nThis questionAnswerChain will handle filling the prompt template and sending\
    \ the prompt to the LLM.\n\nNext, pass the questionAnswerChain to the create_retrieval_chain()\
    \ function:\n\n```\nconst ragChain = await createRetrievalChain({\n  retriever:\
    \ retriever,\n  combineDocsChain: questionAnswerChain,\n});\n```\n\nThe ragChain\
    \ above will pass the input to the retriever, which returns a relevant part of\
    \ the document to the chain.\n\nThe relevant part of the chain and the input are\
    \ then passed to the questionAnswerChain to get the result.\n\nNow you can ask\
    \ for user input, then run the invoke() method with that input:\n\n```\nconst\
    \ { question } = await prompts([\n  {\n    type: 'text',\n    name: 'question',\n\
    \    message: 'Your question: ',\n    validate: value => (value ? true : 'Question\
    \ cannot be empty'),\n  },\n```"
