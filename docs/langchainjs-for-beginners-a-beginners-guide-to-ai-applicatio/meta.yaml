  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_25_0.png)


    Figure 8. Google AI Studio Terms of Service


    Just check on the ''I consent'' option, then click ''Continue''.


    Now click the ''Create API Key'' button to create the key:'
  merge: -1
  pgno: 25
- img_proc: true
  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_26_0.png)


    Figure 9. Gemini Create API Key


    If you’re asked where to create the API Key, select create in new project:'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_27_0.png)


    *Figure 10. Create API Key in New Project*


    Google will create a Cloud project and generate the key for you.

    After a while, you should see the key shown in a pop-up box as follows:


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_27_1.png)


    *Figure 11. Gemini API Key Generated*'
  merge: -1
