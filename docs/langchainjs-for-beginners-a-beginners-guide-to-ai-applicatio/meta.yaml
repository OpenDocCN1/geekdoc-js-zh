    \           key={index}\n                    dangerouslySetInnerHTML={{\n    \
    \                  __html: marked.parse(message.content),\n                  \
    \  }}\n                  />\n                </span>\n              </div>\n \
    \           )}\n          </div>\n        </div>\n      ))}\n      {loadingSubmit\
    \ && (\n        <div className='flex pl-4 pb-4 gap-2 items-center'>\n        \
    \  <span className='relative h-10 w-10 shrink-0 overflow-hidden rounded-full flex\
    \ justify-start items-center'>\n            <Image\n              className='aspect-square\
    \ h-full w-full object-contain'\n              alt='AI'\n              width='32'\n\
    \              height='32'\n              src='/robot.png'\n            />\n \
    \         </span>\n          <div className='bg-blue-100 p-3 rounded-md max-w-xs\
    \ sm:max-w-2xl overflow-x-auto'>\n            <div className='flex gap-1'>\n \
    \             <span className='size-1.5 rounded-full bg-slate-700 motion-safe:animate-[bounce_1s_ease-in-out_infinite]'></span>\n\
    \              <span className='size-1.5 rounded-full bg-slate-700 motion-safe:animate-[bounce_0.5s_ease-in-out_infinite]'></span>\n\
    \              <span className='size-1.5 rounded-full bg-slate-700 motion-safe:animate-[bounce_1s_ease-in-out_infinite]'></span>\n\
    \            </div>\n          </div>\n        </div>\n      )}\n    </div>\n\
    \    <div id='anchor' ref={bottomRef}></div>\n  </div>\n);\n```\n\n当 `role` 属性为\
    \ `'user'` 时，用户聊天气泡将显示在右端。否则，我们将 AI 助手气泡显示在左端。\n\n当 `loadingSubmit` 状态为 `true`\
    \ 时，我们将显示一个思考动画：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_136_0.png)\n\n以上就是\
