  md: '# CHAPTER 1: INTRODUCTION TO GENERATIVE AI APPLICATIONS


    A Generative AI application is a computer application that can generate contextually
    relevant output based on a given input (or prompt).


    Generative AI application came to the attention of the general public in 2022,
    when OpenAI released ChatGPT and quickly gained 1 million users in just 5 days:'
  merge: -1
  pgno: 10
- img_proc: true
  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_11_0.png)


    *Figure 2. ChatGPT Reached 1 Million Users in 5 Days*


    Another example of a generative AI application is chatpdf.com, which enables users
    to upload a PDF and perform various tasks, such as extracting insights from the
    PDF.


    The answers provided by chatpdf.com contain references to their source in the
    original PDF document, so no more flipping pages to find the source.


    Behind the scenes, these generative AI applications use the power of Large Language
    Models to generate the answers.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# # What is a Large Language Model?


    A Large Language Model (LLM for short) is a machine learning model that can understand
    and generate an output that humans can understand.


    LLMs are usually trained on a vast amount of text data available on the internet
    so that they can perform a wide range of language-related tasks such as translation,
    summarization, question answering, and creative writing.


    Examples of LLMs include GPT-4 by OpenAI, Gemini by Google, Llama by Meta, and
    Mistral by Mistral.


    Some LLMs are closed-source, like GPT and Gemini, while some are open-source such
    as Llama and Mistral.


    # # What is LangChain?


    LangChain is an open-source framework designed to simplify the process of developing
    a LLM-powered application.


    LangChain enables you to integrate and call LLM which powers generative AI applications
    by simply calling the class that represents the model.


    Under the hood, LangChain will perform the steps required to interact with the
    language model API and manage the processing of input and output so that you can
    access different LLMs with minimal code change.


    What’s more, you can also use external data sources such as a PDF, a Wikipedia
    article, or a search engine result with LangChain to produce a contextually relevant
    response.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'By using LangChain, you can develop specialized generative AI applications
    that are optimized for certain use cases, such as summarizing a YouTube video,
    extracting insights from a PDF, or writing an essay.


    LangChain supports both Python and JavaScript. This book focuses on the JavaScript
    version of LangChain.


    # The Architecture of a Generative AI Application


    A traditional application commonly uses the client-server architecture as follows:


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_13_0.png)


    Figure 3. Client-Server Architecture


    The client and server communicate using HTTP requests. When needed, a server might
    interact with the database to fulfill the request sent by the client.


    On the other hand, a Generative AI application utilizes the power of LLM to understand
    human language prompts and generate relevant outputs:'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Example of Generative AI Architecture


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_14_0.png)


    Figure 4. AI-Powered Application Architecture


    While the architecture is similar to a traditional application, there’s an added
    layer to connect to LLMs.


    This added layer is where LangChain comes in, as it performs and manages tasks
    related to LLM, such as processing our input into a prompt that LLMs can understand.
    It also processes the response from LLM into a format that’s accepted in traditional
    applications.


    You’ll understand more as you practice building generative AI applications in
    the following chapters.


    For now, just think of LangChain as a management layer between your application
    server and the LLM.


    # Development Environment Set Up'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'To start developing AI applications with LangChain.js, you need to have three
    things on your computer:


    +   1. A web browser

    2. A code editor

    3. The Node.js program


    Let’s install them in the next section.


    # Installing Chrome Browser


    Any web browser can be used to browse the Internet, but for development purposes,
    you need to have a browser with sufficient development tools.


    The Chrome browser developed by Google is a great browser for web development,
    and if you don’t have the browser installed, you can download it here:


    https://www.google.com/chrome/


    The browser is available for all major operating systems. Once the download is
    complete, follow the installation steps presented by the installer to have the
    browser on your computer.


    Next, we need to install a code editor. There are several free code editors available
    on the Internet, such as Sublime Text, Visual Studio Code, and Notepad++.


    Out of these editors, my favorite is Visual Studio Code because it’s fast and
    easy to use.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Installing Visual Studio Code


    Visual Studio Code or VSCode for short is a code editor application created for
    the purpose of writing code. Aside from being free, VSCode is fast and available
    on all major operating systems.


    You can download Visual Studio Code here:

    https://code.visualstudio.com/


    When you open the link above, there should be a button showing the version compatible
    with your operating system as shown below:


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Click the button to download VSCode, and install it on your computer.


    Now that you have a code editor installed, the next step is to install Node.js


    # Installing Node.js


    Node.js is a JavaScript runtime application that enables you to run JavaScript
    outside of the browser. We need this program to install the TypeScript compiler.


    You can download and install Node.js from https://nodejs.org. Pick the recommended
    LTS version because it has long-term support. The installation process is pretty
    straightforward.


    To check if Node has been properly installed, type the command below on your command
    line (Command Prompt on Windows or Terminal on Mac):


    ```

    node -v

    ```


    The command line should respond with the version number of the Node.js you have
    on your computer.


    Node.js also includes a program called npm (Node Package Manager) which you can
    use to install and manage Node packages:


    ```

    npm -v

    ```


    Node packages are JavaScript libraries and frameworks that you can use for free
    in your project. We’re going to use npm to install some packages later.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Now you have all the software needed to start developing LangChain applications.
    Let’s do that in the next chapter.


    # Summary


    In this chapter, you’ve learned the architecture of a generative AI application,
    and how LangChain takes the role of an integration layer between the server and
    the LLM API endpoint.


    You’ve also installed the tools required to write and run a LangChain application
    on your computer.


    If you encounter any issues, you can email me at [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com)
    and I will do my best to help you.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# # CHAPTER 2: YOUR FIRST LANGCHAIN APPLICATION


    It’s time to create our first LangChain application.


    We will create a simple question and answer application where we can ask any kind
    of question to a Large Language Model


    First, create a folder on your computer that will be used to store all files related
    to this project. You can name the folder ''beginning_langchain_js''.


    Next, open the Visual Studio Code, and select `File > Open Folder...` from the
    menu bar. Select the folder you’ve just created earlier.


    VSCode will load the folder and display the content in the Explorer sidebar, it
    should be empty as we haven’t created any files yet.


    To create a file, right-click anywhere inside the VSCode window and select `New
    Text File` or `New File...` from the menu.


    Once the file is created, press `Control + S` or `Command + S` to save the file.
    Name that file as app.js.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# # Installing LangChain Packages


    Now you need to install the packages required to create a LangChain application.


    In VSCode, right-click on the folder you''ve just created, then select *Open in
    Integrated Terminal* to show the command line inside VSCode.


    On the terminal, run the following command:


    ```

    npm install langchain @langchain/google-genai dotenv

    ```


    The above command will install three packages:


    +   - langchain contains all the core modules of LangChain

    - @langchain/google-genai is the Google Generative AI integration module

    - dotenv is used to load LLM API keys from environment variables


    Once the packages are installed, npm will generate a package.json file containing
    the versions of these installed packages.


    # # Creating the Question & Answer Application


    It''s time to write the code for the question and answer application.'
  merge: -1
  pgno: 20
- img_proc: true
  md: "On the app.js file, import the Google Generative AI class and load the environment\
    \ variables:\n\n```\nimport { ChatGoogleGenerativeAI } from '@langchain/google-genai';\n\
    \n// load environment variables\nimport 'dotenv/config';\n```\n\nTo interact with\
    \ LLMs in LangChain, you need to create an object that represents the API for\
    \ that LLM.\n\nBecause we want to interact with Google's LLM, we need to create\
    \ an object from the ChatGoogleGenerativeAI class as follows:\n\n```\nconst llm\
    \ = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-pro-latest',\n  apiKey:\
    \ process.env.GOOGLE_GEMINI_KEY,\n});\n```\n\nThe GOOGLE_GEMINI_KEY contains the\
    \ API key which you're going to get in the next section.\n\nFor now, you just\
    \ need to understand that the ChatGoogleGenerativeAI object represents the Google\
    \ LLM you want to use.\n\nWhen instantiating a new llm object, you need to pass\
    \ an object specifying the options for that instance.\n\nThe model option is required\
    \ so that Google knows which model you want to use, and the apiKey option is used\
    \ to verify you have permission to use that model."
  merge: -1
  pgno: 21
- img_proc: true
  md: "Next, write the code for a simple question and answer application as follows:\n\
    \n```\nconsole.log('Q & A With AI');\nconsole.log('================');\n\nconst\
    \ question = \"What's the currency of Thailand?\";\nconsole.log(`Question: ${question}`);\n\
    \nconst response = await llm.invoke(question);\nconsole.log(`Answer: ${response.content}`);\n\
    ```\n\nIn the code above, we simply print some text showing the question we want\
    \ to ask the model.\n\nThe llm.invoke() method will send the input question to\
    \ the LLM and return response object.\n\nThe answer is stored under the content\
    \ property, so we print response.content value.\n\nBecause we use the await syntax,\
    \ we need to add the \"type\": \"module\" option in the package.json file as follows:\n\
    \n```\n{\n  \"type\": \"module\",\n  \"dependencies\": {\n    // ...\n  }\n}\n\
    ```\n\nThis type option is also needed when we use the import syntax for the packages\
    \ instead of require().\n\nNow the application is ready, but we still need to\
    \ get the Google Gemini API key to access the LLM."
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Getting Google Gemini API Key


