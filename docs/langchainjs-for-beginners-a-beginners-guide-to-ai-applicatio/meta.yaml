    \ a short essay of 350 words for the following title:\n\n    {title}\n\n    Make\
    \ sure that the essay is engaging and makes the reader feel {emotion}.\n  `,\n\
    });\n```\n\nThe emotion input required by the essay prompt doesn’t come from the\
    \ first chain, which only returns the title variable.\n\nYou need to inject the\
    \ emotion input when creating the overallChain as follows:\n\n```\nconst overallChain\
    \ = firstChain\n  .pipe(result => ({\n    title: result,\n    emotion,\n  }))\n\
    \  .pipe(secondChain);\n```\n\nThis way, the title input is obtained from the\
    \ output of the firstChain, while the emotion input is from another source.\n\n\
