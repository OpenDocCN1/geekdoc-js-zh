- md: "The code for this chapter is available in the folder *08_Sequential_Chain*\
    \ from the book source code.\n\nWhen you create a sequential chain, you can add\
    \ extra inputs to the next chain that are not sourced from the previous chain.\n\
    \nYou can also format the output as a JSON object to make the response better\
    \ organized and easier to process.\n\n## CHAPTER 9: IMPLEMENTING CHAT HISTORY\
    \ IN LANGCHAIN\n\nSo far, the LLM took the question we asked it and gave an answer\
    \ retrieved from the training data.\n\nGoing back to the simple question and answer\
    \ application in Chapter 5, you can try to ask the LLM a question such as:\n\n\
    1. When was the last FIFA World Cup held?\n2. Multiply the year by 2\n\nAt the\
    \ time of this writing, the last FIFA World Cup was held in 2022. Reading the\
    \ second prompt above, we can understand that the 'year' refers to '2022'.\n\n\
    However, because the LLM has no awareness of the previous interaction, the answer\
    \ won’t be related.\n\nWith GPT, the LLM refers to the current year instead of\
    \ the last FIFA World Cup year:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_78_0.png)\n\
    \nThe LLM can’t understand that we are making a follow-up instruction to the previous\
    \ question.\n\nTo address this issue, you need to save the previous messages and\
    \ use them when sending a new prompt.\n\nTo follow along with this chapter, you\
    \ can copy the code from Chapter 5 and use it as a starter.\n\n### Creating a\
    \ Chat Prompt Template\n\nFirst, you need to create a chat prompt template that\
    \ has the chat history injected into it.\n\nA chat prompt template is different\
    \ from the usual prompt template. It accepts an array of messages, and each message\
    \ can be associated with a specific role.\n\nHere’s an example of a chat prompt\
    \ template:\n\n```javascript\nimport {\n  ChatPromptTemplate\n} from '@langchain/core/prompts';\n\
    \nconst chatTemplate = ChatPromptTemplate.fromMessages([\n  ['system', 'You are\
    \ a helpful AI bot. Your name is {name}'],\n  ['human', 'Hello, how are you doing?'],\n\
    \  ['ai', \"I'm doing well, thanks!\"],\n  ['human', '{input}'],\n]);\n```\n\n\
    In the example above, the messages are associated with the 'system', 'human',\
    \ and 'ai' roles. The 'system' message is used to influence AI behavior.\n\nYou\
    \ can use the ChatPromptTemplate and MessagesPlaceholder classes to create a prompt\
    \ that accepts a chat history as follows:\n\n```javascript\nimport {\n  ChatPromptTemplate,\n\
    \  MessagesPlaceholder,\n} from '@langchain/core/prompts';\n\nconst prompt = ChatPromptTemplate.fromMessages([\n\
    \  [\n    'system',\n    `You are an AI chatbot having a conversation with a human.\n\
    \    Use the following context to understand the human question.\n    Do not include\
    \ emojis in your answer`,\n  ],\n  new MessagesPlaceholder('chatHistory'),\n \
    \ ['human', '{input}'],\n]);\n```\n\nThe MessagesPlaceholder class acts as an\
    \ opening from which you can inject the chat history. You need to pass a string\
    \ key that stores the chat history when instantiating the class.\n\n### Saving\
    \ Messages in LangChain\n\nTo save chat messages in LangChain, you can use the\
    \ provided ChatMessageHistory class:\n\n```javascript\nimport { ChatMessageHistory\
    \ } from 'langchain/memory';\n\nconst history = new ChatMessageHistory();\n```\n\
    \nThe ChatMessageHistory class provides methods to get, add, and clear messages.\n\
    \nBut you’re not going to manipulate the history object directly. Instead, you\
    \ need to pass this object into the RunnableWithMessageHistory class.\n\nThe RunnableWithMessageHistory\
    \ class creates a chain that injects the chat history for you. It will also add\
    \ new messages automatically when you invoke the chain:\n\n```javascript\nconst\
    \ chain = prompt.pipe(llm);\n\nconst chainWithHistory = new RunnableWithMessageHistory({\n\
    \  runnable: chain,\n  getMessageHistory: sessionId => history,\n  inputMessagesKey:\
    \ 'input',\n  historyMessagesKey: 'chatHistory',\n});\n```\n\nWhen creating the\
    \ RunnableWithMessageHistory object, you need to pass the chain that you want\
    \ to inject history into (runnable) and a function that returns the chat history\
    \ (getMessageHistory).\n\nThe inputMessagesKey is the input key that exists in\
    \ the prompt, while historyMessagesKey is the variable that accepts the history\
    \ (it should be the same as the string key passed to MessagesPlaceholder in the\
    \ prompt).\n\nNow that the chainWithHistory object is created, you can test the\
    \ AI and see if it’s aware of the previous conversation. Use a while loop here\
    \ to show the input again:\n\n```javascript\nconsole.log('Chat With AI');\nconsole.log('Type\
    \ /bye to stop the program');\n\nlet exit = false;\nwhile (!exit) {\n  const {\
    \ question } = await prompts([\n    {\n      type: 'text',\n      name: 'question',\n\
    \      message: 'Your question: ',\n      validate: value => (value ? true : 'Question\
    \ cannot be empty'),\n    },\n  ]);\n  if (question === '/bye') {\n    console.log('See\
    \ you later!');\n    exit = true;\n  } else {\n    const response = await chainWithHistory.invoke(\n\
    \      { input: question },\n      {\n        configurable: {\n          sessionId:\
    \ 'test',\n        },\n      }\n    );\n    console.log(response.content);\n \
    \ }\n}\n```\n\nWhen invoking the chainWithHistory object, you need to pass the\
    \ sessionId key into the config parameter as shown above.\n\nThe sessionId can\
    \ be of any string value.\n\nNow you can test the application by giving a follow-up\
    \ question:\n\n```\nQ: When was the last FIFA World Cup held?\nA: The last FIFA\
    \ World Cup was held in 2022 in Qatar.\nQ: Multiply the year by 2\nA: Multiplying\
    \ the year 2022 by 2 gives you 4044.\n```\n\nBecause the chat history is injected\
    \ into the prompt, the LLM can put the second question in the context of the first.\n\
    \nIf you pass the verbose option to the LLM:\n\n```javascript\nconst llm = new\
    \ ChatOpenAI({\n  model: 'gpt-4o',\n  apiKey: process.env.OPENAI_KEY,\n  verbose:\
