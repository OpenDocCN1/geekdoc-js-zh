    \n## CHAPTER 6: LANGCHAIN PROMPT TEMPLATES\n\nThe LangChain prompt template is\
    \ a JavaScript class used to create a specific prompt (or instruction) to send\
    \ to a Large Language Model.\n\nBy using prompt templates, we can reproduce the\
    \ same instruction while requiring minimal input from the user.\n\nTo show you\
    \ an example, suppose you are creating a simple AI application that only gives\
    \ currency information of a specific country.\n\nBased on what we already know,\
    \ the only way to do this is to keep repeating the question while changing the\
    \ country as shown below:\n\n```\nYour question:  ... What is the currency of\
    \ Malaysia?\n...\nYour question:  ... What is the currency of India?\n...\nYour\
    \ question:  ... What is the currency of Cambodia?\n```\n\nInstead of repeating\
    \ the question, you can create a template for that question as follows:\n\n```javascript\n\
    console.log('Currency Info');\nconsole.log('===============');\nconsole.log('You\
    \ can ask for the currency of any country in the world');\n\nconst { country }\
    \ = await prompts({\n  type: 'text',\n  name: 'country',\n  message: 'Input Country:\
    \ ',\n  validate: value => (value ? true : 'Country cannot be empty'),\n});\n\n\
    const response = await llm.invoke(`What is the currency of ${country}`);\nconsole.log(response.content);\n\
    ```\n\nNow you only need to give the country name to get the currency information.\n\
    \nWhile you can use a template string as shown above, LangChain recommends you\
    \ use the prompt template class instead for effective reuse. Let me show you how.\n\
    \n### Creating a Prompt Template\n\nTo create a prompt template, you need to import\
    \ the PromptTemplate class from @langchain/core/prompts as shown below:\n\n```javascript\n\
    import { PromptTemplate } from '@langchain/core/prompts';\n```\n\nThe next step\
    \ is to create the prompt itself.\n\nYou can create a variable named prompt, then\
    \ pass the call to PromptTemplate() constructor to that variable:\n\n```javascript\n\
    const prompt = new PromptTemplate({});\n```\n\nWhen calling the PromptTemplate()\
    \ constructor, you need to pass two arguments:\n\n1.  inputVariables - An array\
    \ of the names of the variables used in the template\n2.  template - The string\
    \ for the prompt template itself\n\nHere’s an example of the complete PromptTemplate()\
    \ call:\n\n```javascript\nconst prompt = new PromptTemplate({\n  inputVariables:\
    \ ['country'],\n  template: `What is the currency of {country}? Answer in one\
    \ short paragraph`,\n});\n```\n\nNow you can use the prompt object when calling\
    \ the llm.invoke() method.\n\nYou need to call the prompt.format() method and\
    \ pass the variable specified in the inputVariables parameter as shown below:\n\
    \n```javascript\nconst { country } = await prompts({\n  type: 'text',\n  name:\
    \ 'country',\n  message: 'Input Country: ',\n  validate: value => (value ? true\
    \ : 'Country cannot be empty'),\n});\n\nconst response = await llm.invoke(await\
    \ prompt.format({ country: country }));\nconsole.log(response.content);\n```\n\
    \nNow run the application and ask for the currency of a specific country.\n\n\
    Here’s an example of asking for the currency of Spain:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_55_0.png)\n\
    \nFigure 22. LLM Response\n\nThe PromptTemplate class provides a structure from\
    \ which you can construct a specific prompt.\n\n### Prompt Template With Multiple\
    \ Inputs\n\nThe prompt template can accept as many inputs as you need in your\
    \ template string.\n\nFor example, suppose you want to control the amount of paragraph\
    \ and the language of the answer. You can add two more variables to the prompt\
    \ template like this:\n\n```javascript\nconst prompt = new PromptTemplate({\n\
    \  inputVariables: ['country', 'paragraph', 'language'],\n  template: `\n    You\
    \ are a currency expert.\n    You give information about a specific currency used\
    \ in a specific country.\n\n    Answer the question: What is the currency of {country}?\n\
    \n    Answer in {paragraph} short paragraph in {language}\n  `,\n});\n```\n\n\
    Because we have three input variables, we need to ask the inputs from the user.\n\
    \nJust above the prompts() call, create an array of objects containing the input\
    \ details as shown below:\n\n```javascript\nconst questions = [\n  {\n    type:\
    \ 'text',\n    name: 'country',\n    message: 'What country?',\n    validate:\
    \ value => value ? true : 'Country cannot be empty',\n  },\n  {\n    type: 'number',\n\
    \    name: 'paragraph',\n    message: 'How many paragraphs (1 to 5)?',\n    validate:\
    \ value =>\n      value >= 1 && value <= 5 ? true : 'Paragraphs must be between\
    \ 1 and 5',\n  },\n  {\n    type: 'text',\n    name: 'language',\n    message:\
    \ 'What Language?',\n    validate: value => value ? true : 'Language cannot be\
    \ empty',\n  },\n];\n```\n\nNotice that the paragraph input is limited between\
    \ 1 and 5 to avoid generating a long article.\n\nNow pass the questions variable\
    \ to the prompts() function, and then extract the inputs using the destructuring\
    \ assignment syntax:\n\n```javascript\nconst { country, paragraph, language }\
    \ = await prompts(questions);\n```\n\nNow you can pass the inputs to the prompt.format()\
    \ method:\n\n```javascript\nconst response = await llm.invoke(\n  await prompt.format({\
    \ country, paragraph, language })\n);\n\nconsole.log(response.content);\n```\n\
    \nAnd that’s it. Now you can try running the application as shown below:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_57_0.png)\n\
    \nFigure 23. Multiple Inputs Result\n\nCombining the prompt template with prompts,\
    \ you can create a more sophisticated currency information application that can\
    \ generate an answer exactly N paragraphs long and in your preferred language.\n\
