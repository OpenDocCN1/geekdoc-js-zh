- img_proc: true
  md: "![](img/e0794cfae6ccfa863233c46659e3d9d8_78_0.png)\n\nThe LLM can’t understand\
    \ that we are making a follow-up instruction to the previous question.\n\nTo address\
    \ this issue, you need to save the previous messages and use them when sending\
    \ a new prompt.\n\nTo follow along with this chapter, you can copy the code from\
    \ Chapter 5 and use it as a starter.\n\n# Creating a Chat Prompt Template\n\n\
    First, you need to create a chat prompt template that has the chat history injected\
    \ into it.\n\nA chat prompt template is different from the usual prompt template.\
    \ It accepts an array of messages, and each message can be associated with a specific\
    \ role.\n\nHere’s an example of a chat prompt template:\n\n```\nimport {\n  ChatPromptTemplate\n\
    } from '@langchain/core/prompts';\n\nconst chatTemplate = ChatPromptTemplate.fromMessages([\n\
    \  ['system', 'You are a helpful AI bot. Your name is {name}'],\n  ['human', 'Hello,\
    \ how are you doing?'],\n  ['ai', \"I'm doing well, thanks!\"],\n  ['human', '{input}'],\n\
    ]);\n```"
  merge: -1
