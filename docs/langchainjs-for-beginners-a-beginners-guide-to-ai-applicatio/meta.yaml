    \ loadingSubmit={loadingSubmit} />\n      <ChatBottombar sendMessage={sendMessage}\
    \ />\n    </div>\n  );\n}\n```\n\nThe `Chat()` component contains the `sendMessage()`\
    \ function, which is used to send the user message to the server action.\n\nThere\
    \ are two states defined in this component. The `loadingSubmit` state will show\
    \ a loading animation while the LLM is generating a reply.\n\nThe `messages` state\
    \ will hold the conversation messages, which are displayed by the `ChatList` component.\n\
    \nNext, you need to create the `ChatList` component, so create a new file named\
