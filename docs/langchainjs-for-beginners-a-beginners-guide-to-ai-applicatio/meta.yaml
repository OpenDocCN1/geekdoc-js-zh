    Vercel is a cloud hosting company that you can use to build and deploy web applications
    to the internet. It’s also the same'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'company that created Next.js, so deploying a Next application

    on Vercel is very easy.


    You can sign up for a free account at [https://vercel.com](https://vercel.com),
    then

    select Create New Project on the Dashboard page:


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_157_0.png)


    Figure 43. Vercel Create New Project


    Next, you will be asked to provide the project that you want to

    build and deploy.


    Since the project is uploaded to GitHub, you can select *Continue

    With Github* as shown below:'
  merge: -1
  pgno: 157
- img_proc: true
  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_158_0.png)


    *Figure 44. Vercel Import Repository Menu*


    Once you grant access to your GitHub account, select the project to deploy. You
    can use the search bar to filter the repositories:'
  merge: -1
  pgno: 158
- img_proc: true
  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_159_0.png)


    Figure 45. Vercel GitHub Import


    Then, you will be taken to the project setup page. Click the *Deploy* button and
    Vercel will build the application for you.


    When the build is done, you will be shown the success page as follows:'
  merge: -1
  pgno: 159
- img_proc: true
  md: '![](img/e0794cfae6ccfa863233c46659e3d9d8_160_0.png)


    Figure 46. Vercel Congratulations! Page


    You can click on the image preview to open your application. The application will
    be assigned a free `vercel.app` domain. You can add your own domain from Vercel
    settings.


    The deployment is finished. Cheers!


    # Summary


    The code for this chapter is available in the `16_nextjs_langchain_prod` folder
    in the book source code.


    You have successfully deployed a Next.js application to the internet. Well done!'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'Because AI models are accessible using HTTP protocol, you need to ensure that
    an API key to access the models is added to the application.


    Instead of providing your API key and incurring charges from running the model,
    you can ask the users to provide their own keys.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# WRAPPING UP


    Congratulations on finishing this book! We''ve gone through many concepts and
    topics together to help you learn how to develop an AI-powered application using
    LangChain, Next.js, and LLMS such as GPT, Gemini, and Ollama.


    You''ve also learned how to deploy the application to Vercel so that it can be
    accessed from the internet.


    I hope you enjoyed learning and exploring LangChain.js with this book as much
    as I enjoyed writing it.


    I''d like to ask you for a small favor.


    If you enjoyed the book, I''d be very grateful if you would leave an honest review
    on Amazon (I read all reviews coming my way)


    Every single review counts, and your support makes a big difference.


    Thanks again for your kind support!


    Until next time,'
  merge: -1
