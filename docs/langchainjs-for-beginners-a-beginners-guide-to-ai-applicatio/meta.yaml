- md: "## Adding Chat History\n\nThe chat history can be added to the server action\
    \ that we've created before.\n\nImport ChatMessageHistory to save the history\
    \ on the memory and RunnableWithMessageHistory to create the chain with history:\n\
    \n```typescript\n// openai.action.ts\nimport { ChatMessageHistory } from 'langchain/memory';\n\
    import { RunnableWithMessageHistory } from '@langchain/core/runnables';\nimport\
    \ {\n  ChatPromptTemplate,\n  MessagesPlaceholder,\n} from '@langchain/core/prompts';\n\
    \n// ... other code\n\nconst history = new ChatMessageHistory();\n\nconst prompt\
    \ = ChatPromptTemplate.fromMessages([\n  ['system',\n    'You are an AI chatbot\
    \ having a conversation with a human. Use the following context to understand\
    \ the human question. Do not include emojis in your answer',\n  ],\n  new MessagesPlaceholder('chat_history'),\n\
    \  ['human', '{input}'],\n]);\n\nconst chain = prompt.pipe(llm);\n\nconst chainWithHistory\
    \ = new RunnableWithMessageHistory({\n  runnable: chain,\n  getMessageHistory:\
    \ sessionId => history,\n  inputMessagesKey: 'input',\n  historyMessagesKey: 'chat_history',\n\
    });\n```\n\nAfter creating the chainWithHistory object, you need to update the\
    \ chain called in the getReply() function:\n\n```typescript\nexport const getReply\
    \ = async (message: string) => {\n  const response = await chainWithHistory.invoke({\n\
    \    input: message\n  }, {\n    configurable: {\n      sessionId: \"test\"\n\
    \    }\n  });\n\n  return response.content;\n}\n```\n\nNow previous chat messages\
    \ will be added to the prompt.\n\nYou can try asking a question first, then ask\
    \ the last question you asked as shown below.\n\nNow the application looks like\
    \ a simpler version of ChatGPT. Very nice!\n\n## Summary\n\nThe code for this\
    \ chapter is available in the *15_nextjs_langchain* folder in the book source\
    \ code.\n\nIn this chapter, You have successfully integrated LangChain into a\
    \ Next.js application.\n\nAs you can see, developing an AI-powered application\
    \ is not so different than developing a regular web application.\n\nWhen using\
    \ Next.js, you can create the interface using React components, then define server\
    \ actions that use the LangChain library to call LLMs.\n\nWhen you receive a response,\
    \ you can store the response in a state, then show it to the user from there.\n\
    \n# CHAPTER 16: DEPLOYING NEXT.JS AI APPLICATION TO PRODUCTION\n\nNow that the\
    \ Next.js application is working, we’re going to make a few improvements so that\
    \ the application can be deployed into production.\n\nWe need to improve the user\
    \ experience so that the application feels more interactive, and then ask for\
    \ an API key from the user to use the application.\n\n## Streaming the Response\n\
    \nSo far, the response from the LLM is displayed all at once after the LLM has\
    \ finished generating an answer. This delay makes the user experience less interactive.\n\
    \nTo improve the user experience, we can stream the response as the LLM generates\
    \ one. This way, users will see the output gradually, making the interaction feel\
    \ more dynamic and responsive.\n\nFrom the terminal, run `npm install ai` as follows:\n\
    \n```bash\nnpm install ai\n```\n\nThe ai package is a library used for managing\
    \ chat streams and UI updates. It enables you to develop dynamic AI-driven interfaces\
    \ more efficiently.\n\nNow open the openai.action.ts file and import the createStreamableValue\
    \ function from the ai/rsc package:\n\n```typescript\nimport { createStreamableValue\
    \ } from 'ai/rsc';\n\nexport const getReply = async (message: string) => {\n \
    \ const stream = createStreamableValue();\n\n  (async () => {\n    const response\
    \ = await chainWithHistory.stream(\n      {\n        input: message,\n      },\n\
    \      {\n        configurable: {\n          sessionId: 'test',\n        },\n\
    \      }\n    );\n\n    for await (const chunk of response) {\n      stream.update(chunk.content);\n\
    \    }\n\n    stream.done();\n  })();\n\n  return { streamData: stream.value };\n\
    };\n```\n\nThe createStreamableValue() function is used to create a streamable\
    \ object. This object can be updated in real-time as the response is coming.\n\
    \nInstead of the usual invoke() method, we call the stream() method from the chain.\n\
    \nThe stream() method returns an iterable, which is updated as the response is\
    \ streamed by LangChain.\n\nThe for await...of syntax is used to handle asynchronous\
    \ iteration over the chunks of data received by the response object.\n\nWhen the\
    \ response is completed, the stream.done() method is called to signal the stream\
    \ process is finished, and the stream.value will be returned.\n\nThe stream process\
    \ is wrapped in an immediately invoked function expression (IIFE) so that the\
    \ streaming runs in parallel.\n\nIf we remove the IIFE, the streamData is immediately\
    \ returned to the front-end before the stream is finished.\n\nNext, open the chat/index.tsx\
    \ file and update the sendMessage() function to read the streamable value as follows:\n\
    \n```typescript\nimport { readStreamableValue } from 'ai/rsc';\n\nconst sendMessage\
    \ = async (newMessage: Message) => {\n  setLoadingSubmit(true);\n  setMessages(prevMessages\
    \ => [...prevMessages, newMessage]);\n\n  const { streamData } = await getReply(newMessage.content);\n\
    \n  const reply: Message = {\n    role: 'assistant',\n    content: '',\n  };\n\
    \n  setLoadingSubmit(false);\n  setMessages(prevMessages => [...prevMessages,\
    \ reply]);\n\n  for await (const stream of readStreamableValue(streamData)) {\n\
    \    reply.content = `${reply.content}${stream}`;\n    setMessages(prevMessages\
    \ => {\n      return [...prevMessages.slice(0, -1), reply];\n    });\n  }\n};\n\
    ```\n\nHere, we change the name of the response variable into streamValue, then\
    \ we initialize the reply object with an empty content property.\n\nWhen we receive\
    \ a response, call the setLoadingSubmit(false) to stop the thinking indicator,\
    \ and then set reply as the latest message.\n\nAfter that, create another for\
    \ await...of loop to read the streamable value and pass it as the value of reply.content.\n\
    \nThe latest message is overwritten by the reply object constantly using the setMessages()\
    \ function.\n\nNow when you send a message to the LLM, the response will have\
    \ a typed animation.\n\n## Creating API Key Input\n\nThis Next.js application\
    \ is using our API key to access the LLM provider’s API.\n\nThis is not recommended\
    \ for production because we will be charged every time a user uses the application.\n\
    \nInstead of supplying our API key, let’s enable users to add their own API keys\
    \ to the application.\n\nTo do so, we need to create a text input in the sidebar\
    \ for the API key, and run a process to instantiate the LLM on the server only\
    \ when this API key is added.\n\nWe will add the server action to process the\
    \ API key first.\n\n### Adding the setApi() Function\n\nBack in the openai.action.ts\
    \ file, you need to wrap the llm and chainWithHistory instantiation in a function.\n\
    \nThe setApi() function below accepts a string of apiKey that will be used to\
    \ instantiate the llm object:\n\n```typescript\nlet chainWithHistory: RunnableWithMessageHistory<any,\
    \ AIMessageChunk> | null = null;\n\nexport const setApi = async (apiKey: string)\
    \ => {\n  const llm = new ChatOpenAI({\n    model: 'gpt-4o',\n    apiKey: apiKey,\n\
    \  });\n\n  const history = new ChatMessageHistory();\n\n  const prompt = ChatPromptTemplate.fromMessages([\n\
    \    [\n      'system',\n      'You are an AI chatbot having a conversation with\
    \ a human. Use the following context to understand the human question. Do not\
    \ include emojis in your answer',\n    ],\n    new MessagesPlaceholder('chat_history'),\n\
    \    ['human', '{input}'],\n  ]);\n\n  const chain = prompt.pipe(llm);\n\n  chainWithHistory\
    \ = new RunnableWithMessageHistory({\n    runnable: chain,\n    getMessageHistory:\
    \ sessionId => history,\n    inputMessagesKey: 'input',\n    historyMessagesKey:\
    \ 'chat_history',\n  });\n};\n```\n\nHere, we initialize the chainWithHistory\
    \ variable as a null. It will hold the RunnableWithMessageHistory instance when\
    \ the setApi() function is executed.\n\nNow that chainWithHistory might contain\
    \ a null value, we need to assert the type of chainWithHistory in the getReply()\
    \ function as follows:\n\n```typescript\nimport { AIMessageChunk } from '@langchain/core/messages';\n\
    \n// inside getReply():\n(async () => {\n  const response = await (\n    chainWithHistory\
    \ as RunnableWithMessageHistory<any, AIMessageChunk>\n  ).stream(\n    // ...\n\
    \  )\n})\n```\n\nThe as type assertion tells TypeScript that we are certain that\
    \ the chainWithHistory variable is not a null when this function is executed.\n\
    \n### Adding a Chat Sidebar\n\nNow that we have the setApi() function, we need\
    \ to create a sidebar where users can input their API key to use the application."
  mdcn: "\n## 添加聊天记录\n\n聊天记录可以添加到我们之前创建的服务器操作中。\n\n导入 `ChatMessageHistory` 将历史记录保存在内存中，并导入\
    \ `RunnableWithMessageHistory` 来创建带有历史记录的链：\n\n```typescript\n// openai.action.ts\n\
    import { ChatMessageHistory } from 'langchain/memory';\nimport { RunnableWithMessageHistory\
    \ } from '@langchain/core/runnables';\nimport {\n  ChatPromptTemplate,\n  MessagesPlaceholder,\n\
    } from '@langchain/core/prompts';\n\n// ... 其他代码\n\nconst history = new ChatMessageHistory();\n\
    \nconst prompt = ChatPromptTemplate.fromMessages([\n  ['system',\n    '你是一个正在与人类进行对话的AI聊天机器人。使用以下上下文来理解人类的问题。你的回答中不要包含表情符号',\n\
    \  ],\n  new MessagesPlaceholder('chat_history'),\n  ['human', '{input}'],\n]);\n\
    \nconst chain = prompt.pipe(llm);\n\nconst chainWithHistory = new RunnableWithMessageHistory({\n\
    \  runnable: chain,\n  getMessageHistory: sessionId => history,\n  inputMessagesKey:\
    \ 'input',\n  historyMessagesKey: 'chat_history',\n});\n```\n\n创建 `chainWithHistory`\
    \ 对象后，你需要更新 `getReply()` 函数中调用的链：\n\n```typescript\nexport const getReply = async\
    \ (message: string) => {\n  const response = await chainWithHistory.invoke({\n\
    \    input: message\n  }, {\n    configurable: {\n      sessionId: \"test\"\n\
    \    }\n  });\n\n  return response.content;\n}\n```\n\n现在，之前的聊天消息将被添加到提示词中。\n\n\
    你可以尝试先问一个问题，然后如所示询问你上次问的问题。\n\n现在，这个应用程序看起来像是一个简化版的ChatGPT。非常不错！\n\n## 总结\n\n\
    本章的代码可在书籍源代码的 *15_nextjs_langchain* 文件夹中找到。\n\n在本章中，你已成功地将LangChain集成到一个Next.js应用中。\n\
    \n如你所见，开发一个AI驱动的应用程序与开发一个常规的Web应用程序没有太大区别。\n\n使用Next.js时，你可以使用React组件创建界面，然后定义使用LangChain库来调用LLM的服务器操作。\n\
    \n收到响应后，你可以将响应存储在一个状态中，然后从中向用户显示。\n\n# 第16章：将NEXT.JS AI应用部署到生产环境\n\n既然Next.js应用程序已经可以运行，我们将进行一些改进，以便将其部署到生产环境。\n\
    \n我们需要改进用户体验，让应用程序感觉更具交互性，然后向用户请求API密钥以使用该应用程序。\n\n### 流式传输响应\n\n到目前为止，LLM的响应在LLM完成生成答案后一次性显示。这种延迟使得用户体验不够交互。\n\
    \n为了改善用户体验，我们可以在LLM生成响应时流式传输响应。这样，用户将逐渐看到输出，使交互更具动态性和响应性。\n\n在终端中，运行 `npm install\
    \ ai`，如下所示：\n\n```bash\nnpm install ai\n```\n\n`ai` 包是一个用于管理聊天流和UI更新的库。它使你能够更高效地开发动态的AI驱动界面。\n\
    \n现在打开 `openai.action.ts` 文件，并从 `ai/rsc` 包导入 `createStreamableValue` 函数：\n\n```typescript\n\
    import { createStreamableValue } from 'ai/rsc';\n\nexport const getReply = async\
    \ (message: string) => {\n  const stream = createStreamableValue();\n\n  (async\
    \ () => {\n    const response = await chainWithHistory.stream(\n      {\n    \
    \    input: message,\n      },\n      {\n        configurable: {\n          sessionId:\
    \ 'test',\n        },\n      }\n    );\n\n    for await (const chunk of response)\
    \ {\n      stream.update(chunk.content);\n    }\n\n    stream.done();\n  })();\n\
    \n  return { streamData: stream.value };\n};\n```\n\n`createStreamableValue()`\
    \ 函数用于创建一个可流式传输的对象。该对象可以在响应传入时实时更新。\n\n我们不是调用通常的 `invoke()` 方法，而是调用链的 `stream()`\
    \ 方法。\n\n`stream()` 方法返回一个可迭代对象，该对象在LangChain流式传输响应时更新。\n\n`for await...of` 语法用于处理从响应对象接收到的数据块的异步迭代。\n\
    \n当响应完成时，调用 `stream.done()` 方法来通知流处理过程结束，并返回 `stream.value`。\n\n流处理过程被包装在一个立即调用函数表达式（IIFE）中，以便流处理可以并行运行。\n\
    \n如果我们移除IIFE，`streamData` 会在流完成之前立即返回给前端。\n\n接下来，打开 `chat/index.tsx` 文件，并按照以下方式更新\
    \ `sendMessage()` 函数以读取可流式传输的值：\n\n```typescript\nimport { readStreamableValue\
    \ } from 'ai/rsc';\n\nconst sendMessage = async (newMessage: Message) => {\n \
    \ setLoadingSubmit(true);\n  setMessages(prevMessages => [...prevMessages, newMessage]);\n\
    \n  const { streamData } = await getReply(newMessage.content);\n\n  const reply:\
    \ Message = {\n    role: 'assistant',\n    content: '',\n  };\n\n  setLoadingSubmit(false);\n\
    \  setMessages(prevMessages => [...prevMessages, reply]);\n\n  for await (const\
    \ stream of readStreamableValue(streamData)) {\n    reply.content = `${reply.content}${stream}`;\n\
    \    setMessages(prevMessages => {\n      return [...prevMessages.slice(0, -1),\
    \ reply];\n    });\n  }\n};\n```\n\n这里，我们将响应变量的名称改为 `streamValue`，然后用一个空的 `content`\
    \ 属性初始化 `reply` 对象。\n\n当我们收到响应时，调用 `setLoadingSubmit(false)` 来停止思考指示器，然后将 `reply`\
    \ 设置为最新的消息。\n\n之后，创建另一个 `for await...of` 循环来读取可流式传输的值，并将其作为 `reply.content` 的值。\n\
    \n最新的消息通过 `setMessages()` 函数不断被 `reply` 对象覆盖。\n\n现在，当你向LLM发送消息时，响应将具有打字动画效果。\n\
    \n### 创建API密钥输入\n\n这个Next.js应用程序使用我们的API密钥来访问LLM提供商的API。\n\n这在生产环境中不被推荐，因为每次用户使用该应用程序时我们都会被收费。\n\
    \n与其提供我们的API密钥，不如让用户添加他们自己的API密钥到应用程序中。\n\n为此，我们需要在侧边栏中为API密钥创建一个文本输入，并仅在添加此API密钥时在服务器上运行实例化LLM的过程。\n\
    \n我们将首先添加服务器操作来处理API密钥。\n\n#### 添加 setApi() 函数\n\n回到 `openai.action.ts` 文件，你需要将\
    \ `llm` 和 `chainWithHistory` 的实例化包装在一个函数中。\n\n下面的 `setApi()` 函数接受一个字符串 `apiKey`，该字符串将用于实例化\
    \ `llm` 对象：\n\n```typescript\nlet chainWithHistory: RunnableWithMessageHistory<any,\
    \ AIMessageChunk> | null = null;\n\nexport const setApi = async (apiKey: string)\
    \ => {\n  const llm = new ChatOpenAI({\n    model: 'gpt-4o',\n    apiKey: apiKey,\n\
    \  });\n\n  const history = new ChatMessageHistory();\n\n  const prompt = ChatPromptTemplate.fromMessages([\n\
    \    [\n      'system',\n      '你是一个正在与人类进行对话的AI聊天机器人。使用以下上下文来理解人类的问题。你的回答中不要包含表情符号',\n\
    \    ],\n    new MessagesPlaceholder('chat_history'),\n    ['human', '{input}'],\n\
    \  ]);\n\n  const chain = prompt.pipe(llm);\n\n  chainWithHistory = new RunnableWithMessageHistory({\n\
    \    runnable: chain,\n    getMessageHistory: sessionId => history,\n    inputMessagesKey:\
    \ 'input',\n    historyMessagesKey: 'chat_history',\n  });\n};\n```\n\n这里，我们将\
    \ `chainWithHistory` 变量初始化为 `null`。当 `setApi()` 函数执行时，它将持有 `RunnableWithMessageHistory`\
    \ 实例。\n\n现在 `chainWithHistory` 可能包含一个 `null` 值，我们需要在 `getReply()` 函数中断言 `chainWithHistory`\
    \ 的类型，如下所示：\n\n```typescript\nimport { AIMessageChunk } from '@langchain/core/messages';\n\
    \n// 在 getReply() 内部：\n(async () => {\n  const response = await (\n    chainWithHistory\
    \ as RunnableWithMessageHistory<any, AIMessageChunk>\n  ).stream(\n    // ...\n\
    \  )\n})\n```\n\n`as` 类型断言告诉TypeScript，在此函数执行时，我们确定 `chainWithHistory` 变量不是 `null`。\n\
    \n#### 添加聊天侧边栏\n\n既然我们已经有了 `setApi()` 函数，我们需要创建一个侧边栏，用户可以在其中输入他们的API密钥以使用该应用程序。\n"
