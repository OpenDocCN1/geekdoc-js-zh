  md: '# CHAPTER 12: UPLOADING DIFFERENT DOCUMENT TYPES


    Now that we can load a .txt document in LangChain, let’s improve the application
    so we can also load other document types or formats, such as .docx and .pdf.


    To load different file formats, you need to import the loader for each format
    as follows:


    ```

    import { TextLoader } from ''langchain/document_loaders/fs/text'';

    import { PDFLoader } from "@langchain/community/document_loaders/fs/pdf";

    import { DocxLoader } from "@langchain/community/document_loaders/fs/docx";

    ```


    Next, you need to check on the document extension and load the document using
    the matching loader.


    Right below the llm creation, specify the location of the file you want to use
    as a filePath variable, then get the extension of the document using the path.extname()
    method:


    ```

    import path from ''path'';


    // ...


    const filePath = ''./python.pdf'';

    ```'
