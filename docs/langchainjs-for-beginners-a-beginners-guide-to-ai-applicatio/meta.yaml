    \n## Installing Chrome Browser\n\nAny web browser can be used to browse the Internet,\
    \ but for development purposes, you need to have a browser with sufficient development\
    \ tools.\n\nThe Chrome browser developed by Google is a great browser for web\
    \ development, and if you don’t have the browser installed, you can download it\
    \ here:\n\nhttps://www.google.com/chrome/\n\nThe browser is available for all\
    \ major operating systems. Once the download is complete, follow the installation\
    \ steps presented by the installer to have the browser on your computer.\n\nNext,\
    \ we need to install a code editor. There are several free code editors available\
    \ on the Internet, such as Sublime Text, Visual Studio Code, and Notepad++.\n\n\
    Out of these editors, my favorite is Visual Studio Code because it’s fast and\
    \ easy to use.\n\n## Installing Visual Studio Code\n\nVisual Studio Code or VSCode\
    \ for short is a code editor application created for the purpose of writing code.\
    \ Aside from being free, VSCode is fast and available on all major operating systems.\n\
    \nYou can download Visual Studio Code here:\nhttps://code.visualstudio.com/\n\n\
    When you open the link above, there should be a button showing the version compatible\
    \ with your operating system as shown below:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_16_0.png)\n\
    \nClick the button to download VSCode, and install it on your computer.\n\nNow\
    \ that you have a code editor installed, the next step is to install Node.js\n\
    \n## Installing Node.js\n\nNode.js is a JavaScript runtime application that enables\
    \ you to run JavaScript outside of the browser. We need this program to install\
    \ the TypeScript compiler.\n\nYou can download and install Node.js from https://nodejs.org.\
    \ Pick the recommended LTS version because it has long-term support. The installation\
    \ process is pretty straightforward.\n\nTo check if Node has been properly installed,\
    \ type the command below on your command line (Command Prompt on Windows or Terminal\
    \ on Mac):\n\n```\nnode -v\n```\n\nThe command line should respond with the version\
    \ number of the Node.js you have on your computer.\n\nNode.js also includes a\
    \ program called npm (Node Package Manager) which you can use to install and manage\
    \ Node packages:\n\n```\nnpm -v\n```\n\nNode packages are JavaScript libraries\
    \ and frameworks that you can use for free in your project. We’re going to use\
    \ npm to install some packages later.\n\nNow you have all the software needed\
    \ to start developing LangChain applications. Let’s do that in the next chapter.\n\
    \n## Summary\n\nIn this chapter, you’ve learned the architecture of a generative\
    \ AI application, and how LangChain takes the role of an integration layer between\
    \ the server and the LLM API endpoint.\n\nYou’ve also installed the tools required\
    \ to write and run a LangChain application on your computer.\n\nIf you encounter\
    \ any issues, you can email me at [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com)\
    \ and I will do my best to help you.\n\n# CHAPTER 2: YOUR FIRST LANGCHAIN APPLICATION\n\
    \nIt’s time to create our first LangChain application.\n\nWe will create a simple\
    \ question and answer application where we can ask any kind of question to a Large\
    \ Language Model\n\nFirst, create a folder on your computer that will be used\
    \ to store all files related to this project. You can name the folder 'beginning_langchain_js'.\n\
    \nNext, open the Visual Studio Code, and select `File > Open Folder...` from the\
    \ menu bar. Select the folder you’ve just created earlier.\n\nVSCode will load\
    \ the folder and display the content in the Explorer sidebar, it should be empty\
    \ as we haven’t created any files yet.\n\nTo create a file, right-click anywhere\
    \ inside the VSCode window and select `New Text File` or `New File...` from the\
    \ menu.\n\nOnce the file is created, press `Control + S` or `Command + S` to save\
    \ the file. Name that file as app.js.\n\n## Installing LangChain Packages\n\n\
    Now you need to install the packages required to create a LangChain application.\n\
    \nIn VSCode, right-click on the folder you've just created, then select *Open\
    \ in Integrated Terminal* to show the command line inside VSCode.\n\nOn the terminal,\
    \ run the following command:\n\n```\nnpm install langchain @langchain/google-genai\
    \ dotenv\n```\n\nThe above command will install three packages:\n\n- langchain\
    \ contains all the core modules of LangChain\n- @langchain/google-genai is the\
    \ Google Generative AI integration module\n- dotenv is used to load LLM API keys\
    \ from environment variables\n\nOnce the packages are installed, npm will generate\
    \ a package.json file containing the versions of these installed packages.\n\n\
    ## Creating the Question & Answer Application\n\nIt's time to write the code for\
    \ the question and answer application.\n\nOn the app.js file, import the Google\
    \ Generative AI class and load the environment variables:\n\n```\nimport { ChatGoogleGenerativeAI\
    \ } from '@langchain/google-genai';\n\n// load environment variables\nimport 'dotenv/config';\n\
    ```\n\nTo interact with LLMs in LangChain, you need to create an object that represents\
    \ the API for that LLM.\n\nBecause we want to interact with Google's LLM, we need\
    \ to create an object from the ChatGoogleGenerativeAI class as follows:\n\n```\n\
    const llm = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-pro-latest',\n\
    \  apiKey: process.env.GOOGLE_GEMINI_KEY,\n});\n```\n\nThe GOOGLE_GEMINI_KEY contains\
    \ the API key which you're going to get in the next section.\n\nFor now, you just\
    \ need to understand that the ChatGoogleGenerativeAI object represents the Google\
    \ LLM you want to use.\n\nWhen instantiating a new llm object, you need to pass\
    \ an object specifying the options for that instance.\n\nThe model option is required\
    \ so that Google knows which model you want to use, and the apiKey option is used\
    \ to verify you have permission to use that model.\n\nNext, write the code for\
    \ a simple question and answer application as follows:\n\n```\nconsole.log('Q\
    \ & A With AI');\nconsole.log('================');\n\nconst question = \"What's\
    \ the currency of Thailand?\";\nconsole.log(`Question: ${question}`);\n\nconst\
    \ response = await llm.invoke(question);\nconsole.log(`Answer: ${response.content}`);\n\
    ```\n\nIn the code above, we simply print some text showing the question we want\
    \ to ask the model.\n\nThe llm.invoke() method will send the input question to\
    \ the LLM and return response object.\n\nThe answer is stored under the content\
    \ property, so we print response.content value.\n\nBecause we use the await syntax,\
    \ we need to add the \"type\": \"module\" option in the package.json file as follows:\n\
    \n```\n{\n  \"type\": \"module\",\n  \"dependencies\": {\n    // ...\n  }\n}\n\
    ```\n\nThis type option is also needed when we use the import syntax for the packages\
    \ instead of require().\n\nNow the application is ready, but we still need to\
    \ get the Google Gemini API key to access the LLM."
  mdcn: "\n通过使用LangChain，您可以开发针对特定用例优化的专用生成式AI应用，例如总结YouTube视频内容、从PDF中提取洞察或撰写文章。\n\
    \nLangChain支持Python和JavaScript。本书重点介绍JavaScript版本的LangChain。\n\n## 生成式AI应用的架构\n\
    \n传统应用通常采用如下客户端-服务器架构：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_13_0.png)\n\
    \n图3. 客户端-服务器架构\n\n客户端和服务器通过HTTP请求进行通信。必要时，服务器可能与数据库交互以处理客户端发送的请求。\n\n另一方面，生成式AI应用利用大语言模型（LLM）的力量来理解人类语言提示并生成相关输出：\n\
    \n## 生成式AI架构示例\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_14_0.png)\n\n图4. AI驱动的应用架构\n\
    \n虽然其架构与传统应用相似，但增加了一个用于连接LLM的额外层。\n\n这个额外的层正是LangChain发挥作用的地方，因为它执行和管理与LLM相关的任务，例如将我们的输入处理成LLM能理解的提示。它还将LLM的响应处理成传统应用可接受的格式。\n\
    \n随着您在后续章节中实践构建生成式AI应用，您会更深入地理解这一点。\n\n目前，您可以将LangChain视为应用服务器与LLM之间的管理层。\n\n\
    ## 开发环境设置\n\n要开始使用LangChain.js开发AI应用，您的计算机上需要具备三样东西：\n\n1.  网页浏览器\n2.  代码编辑器\n\
    3.  Node.js程序\n\n我们将在下一节中安装它们。\n\n## 安装Chrome浏览器\n\n任何网页浏览器都可用于浏览互联网，但出于开发目的，您需要安装一个具备足够开发工具的浏览器。\n\
    \nGoogle开发的Chrome浏览器是Web开发的绝佳选择。如果您尚未安装此浏览器，可以在此处下载：\n\nhttps://www.google.com/chrome/\n\
    \n该浏览器适用于所有主流操作系统。下载完成后，按照安装程序提供的步骤操作，即可将浏览器安装到您的计算机上。\n\n接下来，我们需要安装一个代码编辑器。互联网上有多款免费的代码编辑器可用，例如Sublime\
    \ Text、Visual Studio Code和Notepad++。\n\n在这些编辑器中，我最青睐Visual Studio Code，因为它快速且易于使用。\n\
    \n## 安装Visual Studio Code\n\nVisual Studio Code（简称VSCode）是一款专为编写代码而创建的代码编辑器应用。除了免费之外，VSCode还运行速度快，并且可在所有主流操作系统上使用。\n\
    \n您可以在此处下载Visual Studio Code：\nhttps://code.visualstudio.com/\n\n当您打开上述链接时，应该会看到一个按钮，显示与您操作系统兼容的版本，如下所示：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_16_0.png)\n\n点击按钮下载VSCode，并将其安装到您的计算机上。\n\
    \n现在代码编辑器已安装完毕，下一步是安装Node.js。\n\n## 安装Node.js\n\nNode.js是一个JavaScript运行时应用，使您能够在浏览器之外运行JavaScript。我们需要这个程序来安装TypeScript编译器。\n\
    \n您可以从 https://nodejs.org 下载并安装Node.js。请选择推荐的LTS版本，因为它提供长期支持。安装过程非常直接。\n\n要检查Node是否已正确安装，请在命令行（Windows上的命令提示符或Mac上的终端）中输入以下命令：\n\
    \n```\nnode -v\n```\n\n命令行应返回您计算机上安装的Node.js版本号。\n\nNode.js还包含一个名为npm（Node包管理器）的程序，您可以使用它来安装和管理Node包：\n\
    \n```\nnpm -v\n```\n\nNode包是您可以免费在项目中使用的JavaScript库和框架。我们稍后将使用npm来安装一些包。\n\n现在您已拥有开始开发LangChain应用所需的所有软件。让我们在下一章中开始实践。\n\
    \n## 总结\n\n在本章中，您了解了生成式AI应用的架构，以及LangChain如何在服务器与LLM API端点之间扮演集成层的角色。\n\n您还在计算机上安装了编写和运行LangChain应用所需的工具。\n\
    \n如果您遇到任何问题，可以发送电子邮件至 [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com)，我将尽力为您提供帮助。\n\
    \n# 第2章：您的第一个LangCHAIN应用\n\n现在是时候创建我们的第一个LangChain应用了。\n\n我们将创建一个简单的问答应用，可以向大型语言模型提出任何类型的问题。\n\
    \n首先，在计算机上创建一个用于存储与此项目相关的所有文件的文件夹。您可以将文件夹命名为'beginning_langchain_js'。\n\n接下来，打开Visual\
    \ Studio Code，从菜单栏选择 `File > Open Folder...`（文件 > 打开文件夹...）。选择您刚刚创建的文件夹。\n\nVSCode将加载该文件夹并在资源管理器侧边栏中显示其内容。由于我们尚未创建任何文件，它应该是空的。\n\
    \n要创建文件，请在VSCode窗口内任意位置右键单击，然后从菜单中选择 `New Text File`（新建文本文件）或 `New File...`（新建文件...）。\n\
    \n文件创建后，按 `Control + S` 或 `Command + S` 保存文件。将该文件命名为app.js。\n\n## 安装LangChain包\n\
    \n现在您需要安装创建LangChain应用所需的包。\n\n在VSCode中，右键单击您刚创建的文件夹，然后选择 *Open in Integrated\
    \ Terminal*（在集成终端中打开），以在VSCode内显示命令行。\n\n在终端中，运行以下命令：\n\n```\nnpm install langchain\
    \ @langchain/google-genai dotenv\n```\n\n上述命令将安装三个包：\n\n- langchain 包含LangChain的所有核心模块\n\
    - @langchain/google-genai 是Google生成式AI集成模块\n- dotenv 用于从环境变量加载LLM API密钥\n\n包安装完成后，npm将生成一个package.json文件，其中包含这些已安装包的版本信息。\n\
    \n## 创建问答应用\n\n现在是时候为问答应用编写代码了。\n\n在app.js文件中，导入Google生成式AI类并加载环境变量：\n\n```\n\
    import { ChatGoogleGenerativeAI } from '@langchain/google-genai';\n\n// load environment\
    \ variables\nimport 'dotenv/config';\n```\n\n要在LangChain中与LLM交互，您需要创建一个表示该LLM\
    \ API的对象。\n\n因为我们要与Google的LLM交互，所以需要从ChatGoogleGenerativeAI类创建一个对象，如下所示：\n\n```\n\
    const llm = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-pro-latest',\n\
    \  apiKey: process.env.GOOGLE_GEMINI_KEY,\n});\n```\n\nGOOGLE_GEMINI_KEY 包含您将在下一节中获取的API密钥。\n\
    \n目前，您只需理解ChatGoogleGenerativeAI对象代表了您想要使用的Google LLM。\n\n在实例化新的llm对象时，您需要传递一个指定该实例选项的对象。\n\
    \nmodel选项是必需的，以便Google知道您想使用哪个模型，而apiKey选项用于验证您是否有权使用该模型。\n\n接下来，编写一个简单的问答应用的代码，如下所示：\n\
    \n```\nconsole.log('Q & A With AI');\nconsole.log('================');\n\nconst\
    \ question = \"What's the currency of Thailand?\";\nconsole.log(`Question: ${question}`);\n\
    \nconst response = await llm.invoke(question);\nconsole.log(`Answer: ${response.content}`);\n\
    ```\n\n在上面的代码中，我们只是打印一些文本，显示我们要向模型提出的问题。\n\nllm.invoke() 方法将把输入的问题发送给LLM并返回响应对象。\n\
    \n答案存储在content属性下，因此我们打印response.content的值。\n\n由于我们使用了await语法，需要在package.json文件中添加\"\
    type\": \"module\"选项，如下所示：\n\n```\n{\n  \"type\": \"module\",\n  \"dependencies\"\
    : {\n    // ...\n  }\n}\n```\n\n当我们使用import语法而不是require()来导入包时，也需要这个type选项。\n\n\
    现在应用已准备就绪，但我们仍然需要获取Google Gemini API密钥才能访问LLM。\n"
