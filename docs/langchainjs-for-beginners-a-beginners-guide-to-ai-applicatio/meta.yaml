  md: "This chain is a little more complicated than a simple sequential chain because\
    \ we need to track multiple inputs and outputs.\n\nFor example, suppose you change\
    \ the essayPrompt from the previous chapter to have two inputVariables as follows:\n\
    \n```\nconst essayPrompt = new PromptTemplate({\n  inputVariables: ['title', 'emotion'],\n\
