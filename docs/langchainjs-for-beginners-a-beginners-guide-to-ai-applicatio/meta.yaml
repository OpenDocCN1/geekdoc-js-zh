    \ author\n\n## LangChainJS For Beginners\n\nA Step-By-Step Guide to AI Application\
    \ Development With LangChain, JavaScript/NextJS, OpenAI/ChatGPT and Other LLMs\n\
    \nBy Nathan Sebhastian\n\n## PREFACE\n\nThe goal of this book is to provide a\
    \ gentle step-by-step instructions that help you learn LangChain.js gradually\
    \ from basic to advanced.\n\nYou will see why LangChain is a great tool for building\
    \ AI applications and how it simplifies the integration of language models into\
    \ your web applications.\n\nWe’ll see how essential LangChain features such as\
    \ prompt templates, chains, agents, document loaders, output parsers, and model\
    \ classes are used to create a generative AI application that’s smart and flexible.\n\
    \nAfter that, we will integrate LangChain into Next.js so you know how to create\
    \ AI-powered web applications.\n\n### Working Through This Book\n\nThis book is\
    \ broken down into 16 concise chapters, each focusing on a specific topic in LangChain\
    \ programming.\n\nI encourage you to write the code you see in this book and run\
    \ them so that you have a sense of what LangChain development looks like. You\
    \ learn best when you code along with examples in this book.\n\nA tip to make\
    \ the most of this book: Take at least a 10-minute break after finishing a chapter,\
    \ so that you can regain your energy and focus.\n\nAlso, don’t despair if some\
    \ concept is hard to understand. Learning anything new is hard for the first time,\
    \ especially something technical like programming. The most important thing is\
    \ to keep going.\n\n### Requirements\n\nTo experience the full benefit of this\
    \ book, you need to have knowledge of basic JavaScript and NextJS.\n\nIf you need\
    \ some help in learning JavaScript or NextJS, you can get one of my books at https://codewithnathan.com\n\
    \n### Source Code\n\nYou can download the source code from GitHub at the following\
    \ link:\n\nhttps://github.com/nathansebhastian/langchain-js\n\nClick on the 'Code'\
    \ button, then click on the 'Download ZIP' link as shown below:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_9_0.png)\n\
    \n*Figure 1. Download the Source Code at GitHub*\n\nYou need to extract the archive\
    \ to access the code. Usually, you can just double-click the archive to extract\
    \ the content.\n\nThe number in the folder name indicates the chapter number in\
    \ this book.\n\n### Contact\n\nIf you need help, you can contact me at [nathan@codewithnathan.com](mailto:nathan@codewithnathan.com).\n\
    \nYou can also connect or follow me on LinkedIn at [https://linkedin.com/in/nathansebhastian](https://linkedin.com/in/nathansebhastian)\n\
    \n## CHAPTER 1: INTRODUCTION TO GENERATIVE AI APPLICATIONS\n\nA Generative AI\
    \ application is a computer application that can generate contextually relevant\
    \ output based on a given input (or prompt).\n\nGenerative AI application came\
    \ to the attention of the general public in 2022, when OpenAI released ChatGPT\
    \ and quickly gained 1 million users in just 5 days:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_11_0.png)\n\
    \n*Figure 2. ChatGPT Reached 1 Million Users in 5 Days*\n\nAnother example of\
    \ a generative AI application is chatpdf.com, which enables users to upload a\
    \ PDF and perform various tasks, such as extracting insights from the PDF.\n\n\
    The answers provided by chatpdf.com contain references to their source in the\
    \ original PDF document, so no more flipping pages to find the source.\n\nBehind\
    \ the scenes, these generative AI applications use the power of Large Language\
    \ Models to generate the answers.\n\n### What is a Large Language Model?\n\nA\
    \ Large Language Model (LLM for short) is a machine learning model that can understand\
    \ and generate an output that humans can understand.\n\nLLMs are usually trained\
    \ on a vast amount of text data available on the internet so that they can perform\
    \ a wide range of language-related tasks such as translation, summarization, question\
    \ answering, and creative writing.\n\nExamples of LLMs include GPT-4 by OpenAI,\
    \ Gemini by Google, Llama by Meta, and Mistral by Mistral.\n\nSome LLMs are closed-source,\
    \ like GPT and Gemini, while some are open-source such as Llama and Mistral.\n\
    \n### What is LangChain?\n\nLangChain is an open-source framework designed to\
    \ simplify the process of developing a LLM-powered application.\n\nLangChain enables\
    \ you to integrate and call LLM which powers generative AI applications by simply\
    \ calling the class that represents the model.\n\nUnder the hood, LangChain will\
    \ perform the steps required to interact with the language model API and manage\
    \ the processing of input and output so that you can access different LLMs with\
    \ minimal code change.\n\nWhat’s more, you can also use external data sources\
    \ such as a PDF, a Wikipedia article, or a search engine result with LangChain\
    \ to produce a contextually relevant response."
