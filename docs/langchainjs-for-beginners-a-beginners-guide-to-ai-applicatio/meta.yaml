- md: "And that’s it. Now you can ask questions about the image you passed to the\
    \ `encodeImage()` function.\n\nI’m using an image from [https://g.codewithnathan.com/lc-image](https://g.codewithnathan.com/lc-image)\
    \ for the example below:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_120_0.png)\n\
    \n*Figure 39. Chat With Image Result*\n\nTry asking for a certain detail, such\
    \ as how many people can you see on the image, or what color is dominant on the\
    \ image.\n\n## Ollama Multimodal Message\n\nIf you want to send a multimodal message\
    \ to Ollama, you need to download a model that supports the message format, such\
    \ as bakllava and llava.\n\nYou can run the command `ollama pull bakllava` to\
    \ download the model to your machine. Note that both models require 8GB of RAM\
    \ to run without any issues.\n\nTo send a multimodal message to Ollama, you need\
    \ to make sure that the `image_url` key holds a string value as follows:\n\n```\n\
    ['human',\n  [\n    { type: 'text', text: '{input}' },\n    {\n      type: 'image_url',\n\
    \      image_url: `data:image/jpeg;base64,${image}`,\n    },\n  ],\n],\n```\n\n\
    But then again, there’s a bug on LangChain side that converts the image_url key\
    \ to an object and adds a url property in that object.\n\nTo resolve this issue,\
    \ you need to open the ollama.js source code located on node_modules/@langchain/community/dist/chat_models\
    \ and change the code at line 468 as follows:\n\n```\nelse if (contentPart.type\
    \ === \"image_url\") {\n  console.log(contentPart.image_url);\n  const imageUrlComponents\
    \ = contentPart.image_url.url.split(\",\");\n  // Support both data:image/jpeg;base64,<image>\
    \ format as well\n  images.push(imageUrlComponents[1] ?? imageUrlComponents[0]);\n\
    }\n```\n\nThe console.log() above will print the content of the image_url key,\
    \ which looks like this:\n\n```\n{\n  url: '...'\n}\n```\n\nAs you can see, it’s\
    \ converted into an object by LangChain even though we passed a string.\n\nThis\
    \ makes the original ollama.js code that checks for a string type always cause\
    \ an error:\n\n```\nelse if (\n  contentPart.type === \"image_url\" &&\n  typeof\
    \ contentPart.image_url === \"string\"\n) {\n  const imageUrlComponents = contentPart.image_url.split(\"\
    ,\");\n  // Support both data:image/jpeg;base64,<image> format as well\n  images.push(imageUrlComponents[1]\
    \ ?? imageUrlComponents[0]);\n} else {\n  throw new Error(\n    `Unsupported message\
    \ content type. Must either have type \"text\" or type\n\"image_url\" with a string\
    \ \"image_url\" field.`\n  );\n}\n```\n\nI will update this section once the issue\
    \ is resolved by LangChain maintainers.\n\n## Summary\n\nThe code for this chapter\
    \ is available in the folder *14_Handling_Images* from the book source code.\n\
    \nIn this chapter, you've learned how to send a multimodal message to a language\
    \ model using LangChain.\n\nNote that not all models can understand a multimodal\
    \ message. If you're using Ollama, you need to use a model like bakllava and not\
    \ mistral or gemma.\n\nIf the LLM doesn't understand, it will usually tell you\
    \ that it can't understand the message you're sending.\n\n# CHAPTER 15: DEVELOPING\
    \ AI-POWERED NEXT.JS APPLICATION\n\nNow that you've explored the core concepts\
    \ of LangChain, let's learn how to integrate LangChain into a Next.js web application\
    \ next.\n\nNext.js is a JavaScript and React framework that enables you to develop\
    \ a fully functional web application.\n\nDon't worry if you never used Next.js\
    \ before. I will guide you to create the application and explain the code written.\n\
    \nIf you ever want to learn Next.js fundamentals in depth, you can get my Beginning\
    \ Next.js Development book at [https://codewithnathan.com/beginning-nextjs](https://codewithnathan.com/beginning-nextjs)\n\
    \nLet's get started!\n\n## Creating the Next.js Application\n\nTo create a Next.js\
    \ application, you need to run the create-next-app package using npx.\n\nAt the\
    \ time of this writing, the latest Next.js version is 14.2.4, and it has a build\
    \ issue with LangChain that's still unresolved.\n\nTo avoid the issue, let's use\
    \ Next.js version 14.1 instead. Run the following command from the terminal:\n\
    \n```\nnpx create-next-app@14.1.0 nextjs-langchain\n```\n\nThe npx command allows\
    \ you to execute a Javascript package directly from the terminal.\n\nYou should\
    \ see npm asking to install a new package as shown below. Proceed by typing 'y'\
    \ and pressing Enter:\n\n```\nNeed to install the following packages:\n  create-next-app@14.1.0\n\
    Ok to proceed? (y) y\n```\n\nOnce create-next-app is installed, the program will\
    \ ask you for the details of your Next.js project, such as whether you want to\
    \ use TypeScript and Tailwind CSS.\n\nTo change the option, press left or right\
    \ to select Yes or No, then hit Enter to confirm your choice. You can follow the\
    \ default setup from create-next-app as shown below:\n\n```\nnpx create-next-app@14.1.0\
    \ nextjs-langchain\nNeed to install the following packages:\n  create-next-app@14.1.0\n\
    Ok to proceed? (y) y\n✔ Would you like to use TypeScript? … Yes\n✔ Would you like\
    \ to use ESLint? … Yes\n✔ Would you like to use Tailwind CSS? … Yes\n✔ Would you\
    \ like to use `src/` directory? … No\n✔ Would you like to use App Router? (recommended)\
    \ … Yes\n✔ Would you like to customize the default import alias (@/*)? … No\n\
    ```\n\nThe package then generates a new project named 'nextjs-langchain' as follows:\n\
    \n```\nSuccess! Created nextjs-langchain at ...\n```\n\nThe next step is to use\
    \ the cd command to change the working directory to the application we've just\
    \ created, then run npm run dev to start the application:\n\n```\ncd nextjs-langchain\n\
    npm run dev\n\n> next-events@0.1.0 dev\n> next dev\n\n ▲ Next.js 14.1.0\n - Local:\
    \      http://localhost:3000\n\n ✓ Ready in 1156ms\n```\n\nNow you can view the\
    \ running application from the browser, at the designated localhost address:\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_126_0.png)\n\nIf you see the screen\
    \ above, it means you have successfully created and run your first Next.js application.\
    \ Good work!\n\n## Installing Required Packages\n\nStop the running application\
    \ with CTRL + C, then install the packages we’re going to use:\n\n```\nnpm install\
    \ langchain @langchain/openai\n```\n\nThe langchain and @langchain/openai packages\
    \ are the same ones we used in previous chapters.\n\nNext, install the packages\
    \ required to create the front-end React components:\n\n```\nnpm install @radix-ui/react-icons\
    \ react-textarea-autosize react-code-blocks marked\n```\n\nWith the packages installed,\
    \ let’s create a server action that will instruct LangChain to call the LLM next.\n\
    \n## Adding the Server Action\n\nServer Actions is a new feature added in Next.js\
    \ 14 as the new standard way to fetch and process data in Next.js applications.\n\
    \nA server action is basically an asynchronous function that’s executed on the\
    \ server. You can call the function from React components.\n\nIn your project\
    \ folder, create a new folder named `actions/`, then create a file named `openai.action.ts`\
    \ as follows:\n\n```\n.\n├── actions\n│   └── openai.action.ts\n└── app\n```\n\
    \nInside this file, import the langchain modules and create the chain that will\
    \ be used for communicating with the LLM:\n\n```\n'use server';\n\nimport { ChatOpenAI\
    \ } from '@langchain/openai';\nimport { ChatPromptTemplate } from '@langchain/core/prompts';\n\
    \nconst llm = new ChatOpenAI({\n  model: 'gpt-4o',\n  apiKey: process.env.OPENAI_KEY,\n\
    });\n\nconst prompt = ChatPromptTemplate.fromMessages([\n  ['system',\n'You are\
    \ an AI chatbot having a conversation with a human. Use the\nfollowing context\
    \ to understand the human question. Do not include emojis in\nyour answer',\n\
    ],\n['human', '{input}'],\n]);\n\nconst chain = prompt.pipe(llm);\n```\n\nThe\
    \ 'use server' directive is added on top of the file to let Next.js\nknow that\
    \ this file can only run on the server.\n\nYou don't need dotenv to load environment\
    \ variables in a\nNext.js application.\n\nAfter that, create an asynchronous function\
    \ named getReply()\nthat accepts a string parameter and calls the chain.invoke()\n\
    method as follows:\n\n```\nexport const getReply = async (message: string) =>\
    \ {\n    const response = await chain.invoke({\n        input: message\n    });\n\
    \    return response.content;\n};\n```\n\nThis way, you can call the getReply()\
    \ function whenever you\nwant to send a message to the LLM.\n\nNext, we're going\
    \ to create the components for the chat\ninterface.\n\n## Adding Profile Pictures\
    \ for User and Assistant"
