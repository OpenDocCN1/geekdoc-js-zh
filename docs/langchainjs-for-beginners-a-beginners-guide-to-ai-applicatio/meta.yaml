- md: "This means the LangChain application successfully communicated with the GPT\
    \ chat model from OpenAI. Awesome!\n\nYou can try asking another question by changing\
    \ the question variable value.\n\n## ChatGPT vs Gemini: Which One To Use?\n\n\
    Both ChatGPT and Gemini are very capable of performing the tasks we want them\
    \ to do in this book, so it’s really up to you.\n\nIn the past, OpenAI used to\
    \ give $5 credits for free. But it seems no longer to be the case, as many people\
    \ in the OpenAI forum said they don’t get it after registering.\n\nOn the other\
    \ hand, Google is offering a free tier for the Gemini model in exchange for using\
    \ our data to train the model, so it’s okay to use it for learning and exploring\
    \ LangChain.\n\nStill, Google has the right to stop the free tier at any time,\
    \ so let me introduce you to one more way to use LLMs in LangChain.\n\nThis time,\
    \ we’re going to use open-source models.\n\n## Summary\n\nThe code for this chapter\
    \ is available in the folder 03_Using_OpenAI from the book source code.\n\nIn\
    \ this chapter, you’ve learned how to create OpenAI API key and use it in a LangChain\
    \ application.\n\nHere, we start to see one of the benefits of using LangChain,\
    \ which is easy integration with LLMs of any kind.\n\nLangChain represents the\
    \ LLMs as packages that you can install and import into your project.\n\nYou only\
    \ need to create an instance of the model class and run the invoke() method to\
    \ access the LLM.\n\nWhenever you need to use another LLM, you only need to change\
    \ the class used and pass the right model and API key.\n\n## CHAPTER 4: USING\
    \ OPEN-SOURCE LLMs IN LANGCHAIN\n\nThe LangChain library enables you to communicate\
    \ with LLMs of any kind, from proprietary LLMs such as Google’s Gemini and OpenAI’s\
    \ GPT to open-source LLMs like Meta’s Llama and Mistral.\n\nThis chapter will\
    \ show you how to use open-source models in LangChain. Let’s jump in.\n\n## Ollama\
    \ Introduction\n\nOllama is a tool used to run LLMs locally. It handles downloading,\
    \ managing, and opening HTTP API endpoints for the models you want to use on your\
    \ computer.\n\nTo get started, head over to https://ollama.com and click the 'Download'\
    \ button.\n\nFrom there, you can select the version for your Operating System:\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_40_0.png)\n\n*Figure 16. Downloading\
    \ Ollama*\n\nOnce downloaded, open the package and follow the instructions until\
    \ you are asked to install the command line tool as follows:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_41_0.png)\n\
    \n*Figure 17. Installing Ollama Terminal Command*\n\nGo ahead and click the 'Install'\
    \ button.\n\nOnce the installation is finished, Ollama will show you how to run\
    \ a model:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_42_0.png)\n\n*Figure 18.\
    \ Ollama Running Your First Model*\n\nBut since Llama 3 is an 8 billion parameter\
    \ model, the model is quite large at 4.7 GB.\n\nI recommend you run the Gemma\
    \ model instead, which has 2 billion parameters:\n\n```\nollama run gemma:2b\n\
    ```\n\nThe Gemma model is a lightweight model from Google, so you can think of\
    \ it as an open-source version of Google Gemini.\n\nThe Gemma 2B model is only\
    \ 1.7 GB in size, so it comes in handy when you want to try out Ollama.\n\nOnce\
    \ the download is finished, you can immediately use the model from the terminal.\
    \ Ask it a question as shown below:\n\n```\nollama run gemma:2b\n>>> Who is the\
    \ founder of Facebook?\nMark Zuckerberg is the co-founder and CEO of Meta (formerly\
    \ Facebook). He co-founded Facebook in 2010 with Dustin Moskovitz and Chris Hughes.\n\
    >>> Send a message (/? for help)\n```\n\n*Figure 19. Example of Asking Gemma in\
    \ Ollama*\n\nTo exit the running model, type /bye and press Enter.\n\nAs long\
    \ as Ollama is running on your computer, the Ollama API endpoint is accessible\
    \ at localhost:11434 as shown below:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_44_0.png)\n\
    \n*Figure 20. Ollama Localhost API Endpoint*\n\nLangChain will use this API endpoint\
    \ to communicate with Ollama models, which we’re going to do next.\n\n## Using\
    \ Ollama in LangChain\n\nTo use the models downloaded by Ollama, you need to import\
    \ the ChatOllama class which was developed by the LangChain community.\n\nFrom\
    \ the terminal, install the community package using npm as follows:\n\n```\nnpm\
    \ install @langchain/community\n```\n\nNext, create a new file named `app_ollama.py`\
    \ and import the Ollama chat model as shown below:\n\n```\nimport { ChatOllama\
    \ } from '@langchain/community/chat_models/ollama';\n\nconst llm = new ChatOllama({\n\
    \  model: 'gemma:2b',\n});\n\nconsole.log('Q & A With AI');\nconsole.log('================');\n\
    \nconst question = \"What's the currency of Thailand?\";\nconsole.log(`Question:\
    \ ${question}`);\n\nconst response = await llm.invoke(question);\nconsole.log(`Answer:\
    \ ${response.content}`);\n```\n\nBecause Ollama is open-source and local, you\
    \ don't need to import the dotenv module and use API keys.\n\nNow you can run\
    \ the file using Node.js to communicate with the LLM. You should have a response\
    \ similar to this:\n\n```\nQ & A With AI\n================\nQuestion: What's the\
    \ currency of Thailand?\nAnswer: The currency of Thailand is the Thai baht (THB).\
    \ It is subdivided into 100 sen. The baht is denoted by the symbol THB.\n```\n\
    \nNote that because the LLM model is running on your computer, the answer may\
    \ take longer when compared to the Gemini and GPT models.\n\nAnd that's how you\
    \ use Ollama in LangChain. If you want to use other open-source models, you need\
    \ to download the model with Ollama first:\n\n```\nollama pull mistral\n```\n\n\
    The pull command downloads the model without running it on the command line.\n\
    \nAfter that, you can switch the model parameter when creating the ChatOllama\
    \ object:\n\n```\n// Switch the model\nconst llm = new ChatOllama({\n  model:\
    \ 'mistral',\n});\n```\n\nRemember that the larger the model, the longer it takes\
    \ to run.\n\nThe common guideline is that you should have at least 8 GB of RAM\
    \ available to run the 7B models, 16 GB to run the 13B models, and 32 GB to run\
    \ the 33B models.\n\nThere are many open-source models that you can run using\
    \ Ollama, such as Google’s Gemma and Microsoft’s Phi-3.\n\nYou can explore [https://ollama.com/library](https://ollama.com/library)\
    \ to see all available models.\n\n## Again, Which One To Use?\n\nSo far, you have\
    \ explored how to use Google Gemini, OpenAI GPT, and Ollama open-source models.\
    \ Which one to use in your application?\n\nI recommend you use OpenAI GPT if you\
    \ can afford it because the API isn’t rate-limited and the result is great.\n\n\
    If you can’t use OpenAI GPT for any reason, then you can use Google Gemini free\
    \ tier if it’s available in your country.\n\nIf not, you can use Ollama and download\
    \ the Gemma 2B model or Llama 3, based on your computer's RAM capacity.\n\nUnless\
    \ specifically noted, I'm going to use OpenAI GPT for all example codes shown\
    \ in this book.\n\nBut don't worry because replacing the LLM part in LangChain\
    \ is very easy. You only need to change the `llm` variable itself as shown in\
    \ this chapter.\n\nYou can get the code examples that use Gemini and Ollama on\
    \ the repository.\n\n## Summary\n\nThe code for this chapter is available in the\
    \ folder *04_Using_Ollama* from the book source code.\n\nIn this chapter, you've\
    \ learned how to use open-source LLMs using Ollama and LangChain.\n\nUsing Ollama,\
    \ you can download and run any Large Language Models that are open-source and\
    \ free to use.\n\nIf you look at the Ollama website, you will find many models\
    \ that are very capable and can even match proprietary models such as Gemini and\
    \ ChatGPT in performance.\n\nIf you are worried about the privacy of your data\
    \ and want to make sure that no one uses it for training their LLMs, then using\
    \ open-source LLMs like Llama 3, Mistral, or Gemma can be a great choice.\n\n\
    ## CHAPTER 5: ENABLING USER INPUT WITH PROMPTS\n\nSo far, you have asked the LLM\
    \ by writing the question in the question constant.\n\nInstead of having to type\
    \ the question explicitly, let's enable user input so that you can type the question\
    \ in the terminal.\n\nThis can be done by installing the prompts package from\
    \ npm:\n\n```\nnpm install prompts\n```\n\nThe prompts package is a lightweight\
    \ package used to add interactivity to the terminal.\n\nThis means you can ask\
    \ for user input when you run the question and answer application.\n\nBack to\
    \ the application, import the prompts package and ask for a question like this:\n\
    \n```\nimport prompts from 'prompts';\n\n// ...\n```"
  mdcn: "\n这意味着LangChain应用成功与OpenAI的GPT聊天模型进行了通信。太棒了！\n\n你可以通过修改问题变量的值来尝试提出另一个问题。\n\
    \n## ChatGPT 与 Gemini：该如何选择？\n\nChatGPT和Gemini都非常擅长完成我们希望它们在本书中执行的任务，所以这完全取决于你。\n\
    \n过去，OpenAI曾提供5美元的免费额度。但情况似乎已不再如此，因为OpenAI论坛上很多人表示注册后并未获得额度。\n\n另一方面，Google为Gemma模型提供了免费层级服务，作为交换，我们允许使用我们的数据来训练模型，因此用它来学习和探索LangChain是可以的。\n\
    \n不过，Google保留随时停止免费层级服务的权利，所以让我再为你介绍一种在LangChain中使用大语言模型（LLM）的方法。\n\n这次，我们将使用开源模型。\n\
    \n## 本章小结\n\n本章的代码位于书籍源代码的 03_Using_OpenAI 文件夹中。\n\n在本章中，你学习了如何创建OpenAI API密钥并在LangChain应用中使用它。\n\
    \n这里，我们开始看到使用LangChain的好处之一，即易于与任何类型的大语言模型（LLM）集成。\n\nLangChain将大语言模型（LLM）表示为你可以安装并导入到项目中的包。\n\
    \n你只需要创建一个模型类的实例并运行`invoke()`方法即可访问大语言模型（LLM）。\n\n每当你需要使用另一个大语言模型（LLM）时，你只需更改使用的类并传递正确的模型和API密钥。\n\
    \n## 第四章：在LangChain中使用开源大语言模型（LLMs）\n\nLangChain库使你能够与各种大语言模型（LLM）通信，从专有的大语言模型（LLM）（如Google的Gemini和OpenAI的GPT）到开源大语言模型（LLM）（如Meta的Llama和Mistral）。\n\
    \n本章将向你展示如何在LangChain中使用开源模型。让我们开始吧。\n\n## Ollama 简介\n\nOllama 是一个用于在本地运行大语言模型（LLM）的工具。它处理下载、管理以及为你想要使用的模型（在你的计算机上）开启\
    \ HTTP API 端点。\n\n要开始，请访问 https://ollama.com 并点击 \"Download\" 按钮。\n\n在那里，你可以选择适合你操作系统的版本：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_40_0.png)\n\n*图 16. 下载 Ollama*\n\n\
    下载后，打开安装包并按照说明操作，直到你被要求安装命令行工具，如下所示：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_41_0.png)\n\
    \n*图 17. 安装 Ollama 终端命令*\n\n继续并点击 \"Install\" 按钮。\n\n安装完成后，Ollama 会向你展示如何运行一个模型：\n\
    \n![](img/e0794cfae6ccfa863233c46659e3d9d8_42_0.png)\n\n*图 18. Ollama 运行你的第一个模型*\n\
    \n但由于 Llama 3 是一个拥有 80 亿参数的模型，其文件相当大，有 4.7 GB。\n\n我建议你改为运行 Gemma 模型，它只有 20 亿参数：\n\
    \n```\nollama run gemma:2b\n```\n\nGemma 模型是 Google 推出的一个轻量级模型，因此你可以将其视为 Google\
    \ Gemini 的开源版本。\n\nGemma 2B 模型的大小仅为 1.7 GB，因此当你想要试用 Ollama 时，它非常方便。\n\n下载完成后，你可以立即从终端使用该模型。如下所示向它提问：\n\
    \n```\nollama run gemma:2b\n>>> Who is the founder of Facebook?\nMark Zuckerberg\
    \ is the co-founder and CEO of Meta (formerly Facebook). He co-founded Facebook\
    \ in 2010 with Dustin Moskovitz and Chris Hughes.\n>>> Send a message (/? for\
    \ help)\n```\n\n*图 19. 在 Ollama 中向 Gemma 提问的示例*\n\n要退出正在运行的模型，请输入 /bye 并按回车键。\n\
    \n只要 Ollama 在你的计算机上运行，Ollama API 端点就可以通过 localhost:11434 访问，如下所示：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_44_0.png)\n\
    \n*图 20. Ollama 本地主机 API 端点*\n\nLangChain 将使用此 API 端点与 Ollama 模型进行通信，这正是我们接下来要做的。\n\
    \n## 在 LangChain 中使用 Ollama\n\n要使用 Ollama 下载的模型，你需要导入由 LangChain 社区开发的 ChatOllama\
    \ 类。\n\n在终端中，使用 npm 安装社区包，如下所示：\n\n```\nnpm install @langchain/community\n```\n\
    \n接下来，创建一个名为 `app_ollama.py` 的新文件，并如下所示导入 Ollama 聊天模型：\n\n```\nimport { ChatOllama\
    \ } from '@langchain/community/chat_models/ollama';\n\nconst llm = new ChatOllama({\n\
    \  model: 'gemma:2b',\n});\n\nconsole.log('Q & A With AI');\nconsole.log('================');\n\
    \nconst question = \"What's the currency of Thailand?\";\nconsole.log(`Question:\
    \ ${question}`);\n\nconst response = await llm.invoke(question);\nconsole.log(`Answer:\
    \ ${response.content}`);\n```\n\n因为 Ollama 是开源且本地运行的，你不需要导入 dotenv 模块或使用 API 密钥。\n\
    \n现在你可以使用 Node.js 运行该文件来与大语言模型（LLM）通信。你应该会得到类似于这样的响应：\n\n```\nQ & A With AI\n\
    ================\nQuestion: What's the currency of Thailand?\nAnswer: The currency\
    \ of Thailand is the Thai baht (THB). It is subdivided into 100 sen. The baht\
    \ is denoted by the symbol THB.\n```\n\n请注意，因为大语言模型（LLM）是在你的计算机上运行的，所以与 Gemini\
    \ 和 GPT 模型相比，答案可能需要更长时间。\n\n这就是你在 LangChain 中使用 Ollama 的方法。如果你想使用其他开源模型，你需要先用\
    \ Ollama 下载该模型：\n\n```\nollama pull mistral\n```\n\npull 命令会下载模型但不在命令行中运行它。\n\n\
    之后，你可以在创建 ChatOllama 对象时切换模型参数：\n\n```\n// 切换模型\nconst llm = new ChatOllama({\n\
    \  model: 'mistral',\n});\n```\n\n请记住，模型越大，运行所需的时间就越长。\n\n通用准则是：运行 7B 模型至少需要 8\
    \ GB RAM，运行 13B 模型需要 16 GB RAM，运行 33B 模型需要 32 GB RAM。\n\n有许多开源模型可以使用 Ollama 运行，例如\
    \ Google 的 Gemma 和 Microsoft 的 Phi-3。\n\n你可以浏览 [https://ollama.com/library](https://ollama.com/library)\
