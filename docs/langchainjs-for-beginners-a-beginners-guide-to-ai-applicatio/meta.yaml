- md: "## Summary\n\nThe code for this chapter is available in the folder `07_LCEL`\
    \ from the book source code.\n\nIn this chapter, you've learned about the LangChain\
    \ Expression Language, which can be used to compose LangChain components in a\
    \ declarative way.\n\nA chain is simply a wrapper for these LangChain components:\n\
    \n- The prompt template\n- The LLM to use\n- The parser to process the output\
    \ from LLM\n\nThe components of a chain are interchangeable, meaning you can use\
    \ the GPT model for the first prompt, and then use the Gemini model for the second\
    \ prompt, as shown above.\n\nBy using LCEL, you can create advanced workflows\
    \ and interact with Large Language Models to solve a complex task.\n\nIn the next\
    \ chapter, I will show you how to create a regular sequential chain.\n\n# CHAPTER\
    \ 8: REGULAR SEQUENTIAL CHAINS\n\nA regular sequential chain is a more general\
    \ form of sequential chains that allow multiple inputs and outputs.\n\nThe input\
    \ for the next chain is usually a mix of the output from the previous chain and\
    \ another source like this:\n\n![Diagram showing a chain with multiple inputs\
    \ and outputs.](img/e0794cfae6ccfa863233c46659e3d9d8_70_0.png)\n\nThis chain is\
    \ a little more complicated than a simple sequential chain because we need to\
    \ track multiple inputs and outputs.\n\nFor example, suppose you change the essayPrompt\
    \ from the previous chapter to have two inputVariables as follows:\n\n```javascript\n\
    const essayPrompt = new PromptTemplate({\n  inputVariables: ['title', 'emotion'],\n\
    \  template: `\n    You are an expert nonfiction writer.\n\n    You need to write\
    \ a short essay of 350 words for the following title:\n\n    {title}\n\n    Make\
    \ sure that the essay is engaging and makes the reader feel {emotion}.\n  `,\n\
    });\n```\n\nThe emotion input required by the essay prompt doesn’t come from the\
    \ first chain, which only returns the title variable.\n\nYou need to inject the\
    \ emotion input when creating the overallChain as follows:\n\n```javascript\n\
    const overallChain = firstChain\n  .pipe(result => ({\n    title: result,\n  \
    \  emotion,\n  }))\n  .pipe(secondChain);\n```\n\nThis way, the title input is\
    \ obtained from the output of the firstChain, while the emotion input is from\
    \ another source.\n\nNow you need to ask the user for the emotion input:\n\n```javascript\n\
    console.log('Essay Writer');\nconst questions = [\n  {\n    type: 'text',\n  \
    \  name: 'topic',\n    message: 'What topic to write?',\n    validate: value =>\
    \ (value ? true : 'Topic cannot be empty'),\n  },\n  {\n    type: 'text',\n  \
    \  name: 'emotion',\n    message: 'What emotion to convey?',\n    validate: value\
    \ => (value ? true : 'Emotion cannot be empty'),\n  },\n];\n\nconst { topic, emotion\
    \ } = await prompts(questions);\n```\n\nAnd now you have two inputs for the second\
    \ chain: title and emotion.\n\nMake sure that the overallChain is declared below\
    \ the `await prompts()` line.\n\n## Format the Output Variables\n\nA sequential\
    \ chain usually also tracks multiple output variables.\n\nTo keep track of multiple\
    \ output variables, you can use the StructuredOutputParser from LangChain to format\
    \ the output as a JSON object.\n\nFirst, import the parser from LangChain:\n\n\
    ```javascript\nimport {\n  StringOutputParser,\n  StructuredOutputParser,\n} from\
    \ '@langchain/core/output_parsers';\n```\n\nNext, create a parser that contains\
    \ the schema of the output as an object.\n\nSuppose you want to show the title,\
    \ emotion, and essay values in the response.\n\nCall the `StructuredOutputParser.fromNamesAndDescriptions()`\
    \ method and pass the schema as follows:\n\n```javascript\nconst firstChain =\
    \ titlePrompt.pipe(llm).pipe(new StringOutputParser());\n\nconst structuredParser\
    \ = StructuredOutputParser.fromNamesAndDescriptions({\n  title: 'the essay title',\n\
    \  emotion: 'the emotion conveyed by the essay',\n  essay: 'the essay content',\n\
    });\n```\n\nAfter that, pass the parser into the secondChain as follows:\n\n```javascript\n\
    const secondChain = essayPrompt.pipe(llm).pipe(structuredParser);\n```\n\nNow\
    \ the LLM is instructed to parse the output using the structuredParser.\n\nIn\
    \ the essayPrompt, update both inputVariables and template parameters to include\
    \ the format_instructions input:\n\n```javascript\nconst essayPrompt = new PromptTemplate({\n\
    \  inputVariables: ['title', 'emotion', 'format_instructions'],\n  template: `\n\
    You are an expert nonfiction writer.\n\nYou need to write a short essay of 350\
    \ words for the following title:\n\n{title}\n\nMake sure that the essay is engaging\
    \ and makes the reader feel {emotion}.\n\n{format_instructions}\n  `,\n});\n```\n\
    \nFor the last step, pass the format_instructions input by calling the `structuredParser.getFormatInstructions()`\
    \ method when creating the overallChain object:\n\n```javascript\nconst overallChain\
    \ = firstChain\n  .pipe(result => ({\n    title: result,\n    emotion,\n    format_instructions:\
    \ structuredParser.getFormatInstructions(),\n  }))\n  .pipe(secondChain);\n```\n\
    \nThe `getFormatInstructions()` method returns a string that contains the instruction\
    \ and the JSON schema. You can see the string by calling `console.log()` if you\
    \ want to:\n\n```javascript\nconsole.log(structuredParser.getFormatInstructions());\n\
    ```\n\nNow you can run the application and give the title and emotion inputs for\
    \ the essay. The LLM will return a JavaScript object:\n\n```\nEssay Writer\n✔\
    \ What topic to write? ... The Beauty of Earth\n✔ What emotion to convey? ...\
    \ proud\n{\n  title: \"Earth's Splendor: Exploring the Natural Wonders of Our\
    \ Planet\",\n  emotion: 'pride',\n  essay: \"Our planet Earth is a treasure trove\
    \ of natural wonders that inspire awe, wonder, and a deep sense of pride in our\
    \ collective heritage. From the snow-capped peaks of the Himalayas to the vast\
    \ and mysterious depths of the Amazon Rainforest, Earth's diverse landscapes are\
    \ a testament to the dynamic forces that have shaped our planet over millions\
    \ of years. These natural wonders not only highlight the incredible beauty of\
    \ our world but also underscore the importance of preserving these habitats for\
    \ future generations.\\n\" +\n  '\\n' +\n  'Consider the majestic Grand Canyon\
    \ in the United States, a colossal chasm carved by the Colorado River over millennia.\
    \ Its layered bands of red rock reveal the chronological history of Earth, exposing\
    \ us to the geological secrets spanning billions of years. Equally captivating\
    \ are the Northern Lights dancing across the Arctic skies, their ethereal light\
    \ displays a cosmic ballet that leaves viewers spellbound.\\n' +\n  '\\n' +\n\
    \  'Traveling to Africa, we encounter the Serengeti Migration, where millions\
    \ of wildebeest, zebras, and gazelles make a perilous journey across the plains\
    \ in a timeless cycle of life and survival. This natural spectacle is not only\
    \ a marvel of animal behavior but also a crucial component of the ecosystem\\\
    's balance. Similarly, the Great Barrier Reef in Australia stands as the world\\\
    's largest coral reef system, teeming with marine biodiversity, which serves as\
    \ both a natural wonder and a vital asset for scientific research.\\n' +\n  '\\\
    n' +\n  'However, these wonders are under constant threat from human activities\
    \ including deforestation, pollution, and climate change. The responsibility to\
    \ conserve and protect these splendid features of our planet falls upon each one\
    \ of us. It is through collective effort and sustainable practices that we can\
    \ ensure the continued existence of our planet\\'s natural treasures.\\n' +\n\
    \  '\\n' +\n  \"As we explore the planet's extraordinary features, we are reminded\
    \ of Earth's intricate and interconnected ecosystems, and how we, too, are a part\
    \ of this tapestry. This realization should fill us with immense pride for living\
    \ on such a magnificent planet, and a profound duty to protect and cherish it.\"\
    \n}\n```\n\n![Screenshot showing the output with title, emotion, and essay.](img/e0794cfae6ccfa863233c46659e3d9d8_75_0.png)\n\
    \nIf you want to write each output variable, you can access the properties directly\
    \ as follows:\n\n```javascript\nconst response = await overallChain.invoke({\n\
    \  topic,\n});\nconsole.log(response.title);\nconsole.log(response.emotion);\n\
    console.log(response.essay);\n```\n\nNow you have a sequential chain that tracks\
    \ multiple inputs and outputs. Very nice!"
  mdcn: "\n## 总结\n\n本章的代码可在书籍源代码的 `07_LCEL` 文件夹中找到。\n\n在本章中，你了解了LangChain表达式语言（LCEL），它可以用于以声明式方式组合LangChain组件。\n\
    \n一个链（Chain）本质上是这些LangChain组件的封装器：\n\n- 提示模板\n- 要使用的LLM\n- 用于处理LLM输出的解析器\n\n链的组件是可互换的，这意味着你可以对第一个提示使用GPT模型，然后对第二个提示使用Gemini模型，如上所示。\n\
    \n通过使用LCEL，你可以创建高级工作流，并与大型语言模型交互来解决复杂任务。\n\n在下一章中，我将向你展示如何创建一个常规的顺序链。\n\n# 第八章：常规顺序链\n\
    \n常规顺序链（Regular Sequential Chain）是顺序链的一种更通用的形式，允许多个输入和输出。\n\n下一个链的输入通常是前一个链的输出与另一个来源的混合，如下所示：\n\
    \n![显示具有多个输入和输出的链的图示。](img/e0794cfae6ccfa863233c46659e3d9d8_70_0.png)\n\n这个链比简单的顺序链稍微复杂一些，因为我们需要跟踪多个输入和输出。\n\
    \n例如，假设你将上一章的`essayPrompt`更改为具有两个`inputVariables`，如下所示：\n\n```javascript\nconst\
    \ essayPrompt = new PromptTemplate({\n  inputVariables: ['title', 'emotion'],\n\
    \  template: `\n    You are an expert nonfiction writer.\n\n    You need to write\
    \ a short essay of 350 words for the following title:\n\n    {title}\n\n    Make\
    \ sure that the essay is engaging and makes the reader feel {emotion}.\n  `,\n\
    });\n```\n\n作文提示所需的情感输入并非来自第一个链，第一个链只返回`title`变量。\n\n你需要在创建`overallChain`时注入情感输入，如下所示：\n\
    \n```javascript\nconst overallChain = firstChain\n  .pipe(result => ({\n    title:\
    \ result,\n    emotion,\n  }))\n  .pipe(secondChain);\n```\n\n这样，`title`输入从`firstChain`的输出中获取，而`emotion`输入来自另一个来源。\n\
    \n现在你需要向用户请求情感输入：\n\n```javascript\nconsole.log('Essay Writer');\nconst questions\
    \ = [\n  {\n    type: 'text',\n    name: 'topic',\n    message: 'What topic to\
    \ write?',\n    validate: value => (value ? true : 'Topic cannot be empty'),\n\
    \  },\n  {\n    type: 'text',\n    name: 'emotion',\n    message: 'What emotion\
    \ to convey?',\n    validate: value => (value ? true : 'Emotion cannot be empty'),\n\
    \  },\n];\n\nconst { topic, emotion } = await prompts(questions);\n```\n\n现在你为第二个链准备了两个输入：`title`和`emotion`。\n\
    \n确保`overallChain`在`await prompts()`行之下声明。\n\n## 格式化输出变量\n\n一个顺序链通常也跟踪多个输出变量。\n\
    \n要跟踪多个输出变量，你可以使用LangChain的`StructuredOutputParser`将输出格式化为JSON对象。\n\n首先，从LangChain导入解析器：\n\
    \n```javascript\nimport {\n  StringOutputParser,\n  StructuredOutputParser,\n\
    } from '@langchain/core/output_parsers';\n```\n\n接下来，创建一个解析器，该解析器包含以对象形式表示的输出模式（schema）。\n\
    \n假设你想在响应中显示`title`、`emotion`和`essay`值。\n\n调用`StructuredOutputParser.fromNamesAndDescriptions()`方法并传入模式，如下所示：\n\
    \n```javascript\nconst firstChain = titlePrompt.pipe(llm).pipe(new StringOutputParser());\n\
    \nconst structuredParser = StructuredOutputParser.fromNamesAndDescriptions({\n\
    \  title: 'the essay title',\n  emotion: 'the emotion conveyed by the essay',\n\
    \  essay: 'the essay content',\n});\n```\n\n之后，将解析器传入`secondChain`，如下所示：\n\n```javascript\n\
    const secondChain = essayPrompt.pipe(llm).pipe(structuredParser);\n```\n\n现在LLM被指示使用`structuredParser`解析输出。\n\
    \n在`essayPrompt`中，更新`inputVariables`和`template`参数以包含`format_instructions`输入：\n\
    \n```javascript\nconst essayPrompt = new PromptTemplate({\n  inputVariables: ['title',\
    \ 'emotion', 'format_instructions'],\n  template: `\nYou are an expert nonfiction\
    \ writer.\n\nYou need to write a short essay of 350 words for the following title:\n\
    \n{title}\n\nMake sure that the essay is engaging and makes the reader feel {emotion}.\n\
    \n{format_instructions}\n  `,\n});\n```\n\n对于最后一步，在创建`overallChain`对象时，通过调用`structuredParser.getFormatInstructions()`方法来传递`format_instructions`输入：\n\
    \n```javascript\nconst overallChain = firstChain\n  .pipe(result => ({\n    title:\
    \ result,\n    emotion,\n    format_instructions: structuredParser.getFormatInstructions(),\n\
    \  }))\n  .pipe(secondChain);\n```\n\n`getFormatInstructions()`方法返回一个包含指令和JSON模式的字符串。如果你想查看，可以通过调用`console.log()`来显示：\n\
    \n```javascript\nconsole.log(structuredParser.getFormatInstructions());\n```\n\
    \n现在你可以运行应用程序，并为作文提供`title`和`emotion`输入。LLM将返回一个JavaScript对象：\n\n```\nEssay Writer\n\
    ✔ What topic to write? ... The Beauty of Earth\n✔ What emotion to convey? ...\
    \ proud\n{\n  title: \"Earth's Splendor: Exploring the Natural Wonders of Our\
    \ Planet\",\n  emotion: 'pride',\n  essay: \"Our planet Earth is a treasure trove\
    \ of natural wonders that inspire awe, wonder, and a deep sense of pride in our\
    \ collective heritage. From the snow-capped peaks of the Himalayas to the vast\
    \ and mysterious depths of the Amazon Rainforest, Earth's diverse landscapes are\
    \ a testament to the dynamic forces that have shaped our planet over millions\
    \ of years. These natural wonders not only highlight the incredible beauty of\
    \ our world but also underscore the importance of preserving these habitats for\
    \ future generations.\\n\" +\n  '\\n' +\n  'Consider the majestic Grand Canyon\
    \ in the United States, a colossal chasm carved by the Colorado River over millennia.\
    \ Its layered bands of red rock reveal the chronological history of Earth, exposing\
    \ us to the geological secrets spanning billions of years. Equally captivating\
    \ are the Northern Lights dancing across the Arctic skies, their ethereal light\
    \ displays a cosmic ballet that leaves viewers spellbound.\\n' +\n  '\\n' +\n\
    \  'Traveling to Africa, we encounter the Serengeti Migration, where millions\
    \ of wildebeest, zebras, and gazelles make a perilous journey across the plains\
    \ in a timeless cycle of life and survival. This natural spectacle is not only\
    \ a marvel of animal behavior but also a crucial component of the ecosystem\\\
    's balance. Similarly, the Great Barrier Reef in Australia stands as the world\\\
    's largest coral reef system, teeming with marine biodiversity, which serves as\
    \ both a natural wonder and a vital asset for scientific research.\\n' +\n  '\\\
    n' +\n  'However, these wonders are under constant threat from human activities\
    \ including deforestation, pollution, and climate change. The responsibility to\
    \ conserve and protect these splendid features of our planet falls upon each one\
    \ of us. It is through collective effort and sustainable practices that we can\
    \ ensure the continued existence of our planet\\'s natural treasures.\\n' +\n\
    \  '\\n' +\n  \"As we explore the planet's extraordinary features, we are reminded\
    \ of Earth's intricate and interconnected ecosystems, and how we, too, are a part\
    \ of this tapestry. This realization should fill us with immense pride for living\
    \ on such a magnificent planet, and a profound duty to protect and cherish it.\"\
    \n}\n```\n\n![显示包含标题、情感和文章的输出的截图。](img/e0794cfae6ccfa863233c46659e3d9d8_75_0.png)\n\
    \n如果你想分别输出每个变量，可以直接访问属性，如下所示：\n\n```javascript\nconst response = await overallChain.invoke({\n\
    \  topic,\n});\nconsole.log(response.title);\nconsole.log(response.emotion);\n\
    console.log(response.essay);\n```\n\n现在你拥有一个跟踪多个输入和输出的顺序链。非常好！\n"
