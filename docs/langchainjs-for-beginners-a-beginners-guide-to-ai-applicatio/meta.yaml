- img_proc: true
  md: 'Copy the API key string, then create a .env file in your application folder
    with the following content:


    ```

    GOOGLE_GEMINI_KEY=''Your Key Here''

    ```


    Replace the Your Key Here string above with your actual API key.


    # Running the Application


    With the API key obtained, you are ready to run the LangChain application.


    From the terminal, run the app.js file using Node.js as follows:


    ```

    node app.js

    ```


    You should see the following output in your terminal:


    ```

    Q & A With AI

    ============

    Question: What''s the currency of Thailand?

    Answer: Thai baht

    ```


    This means you have successfully created your first LangChain application and
    interacted with Google''s Gemini LLM using the API key.


    Each LLM model has its own characteristics. The ''gemini-1.5-pro-latest'' model
    usually answers a question directly with no extra information.


    You can try changing the model to ''gemini-1.5-flash-latest'' as shown below:'
  merge: -1
