    \ empty'),\n});\n\nconst response = await llm.invoke(await prompt.format({ country:\
    \ country }));\nconsole.log(response.content);\n```\n\n现在运行应用程序并请求特定国家的货币。\n\n\
    以下是请求西班牙货币的示例：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_55_0.png)\n\n图 22.\
    \ LLM 响应\n\n`PromptTemplate` 类提供了一个结构，你可以用它来构建特定的提示。\n\n### 具有多个输入的提示模板\n\n提示模板可以在模板字符串中接受你需要的任意数量的输入。\n\
    \n例如，假设你想控制段落数量和答案的语言。你可以像这样在提示模板中添加两个变量：\n\n```javascript\nconst prompt = new\
