  md: '# # CHAPTER 14: INTERACTING WITH IMAGES USING MULTIMODAL MESSAGES


    Now that we can interact with different types of documents and chat with YouTube
    videos, let''s continue with making AI understand images.


    # ## Understanding Multimodal Messages


    A multimodal message is a message that uses more than one mode of communication
    to communicate.


    The communication modes known to humans are:


    +   - Text

    - Video

    - Audio

    - Image'
