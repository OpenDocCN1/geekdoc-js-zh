    \ terminal.\n\nNow try replacing the question variable with any question you want\
    \ to ask the LLM.\n\n# Resource Exhausted Error\n\nWhen using Google Gemini, you\
    \ might see an error like this when running the application:\n\n```\nResourceExhausted:\
