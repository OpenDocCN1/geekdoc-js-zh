- md: "## About The Vector Database\n\nWe have used the MemoryVectorStore to store\
    \ vector data in this application, but this store is actually not recommended\
    \ for production.\n\nWhen the application stops running, the vector data in memory\
    \ will be lost.\n\nMost modern database applications such as PostgreSQL, Redis,\
    \ and MongoDB support storing vector data, so you might want to use them in production.\n\
    \nYou can see vector database integration details at [https://js.langchain.com/v0.2/docs/integrations/vectorstores/](https://js.langchain.com/v0.2/docs/integrations/vectorstores/)\n\
    \nThe `MemoryVectorStore` database is recommended only for prototyping and testing.\n\
    \n## Switching the LLM\n\nIf you want to change the LLM used for this application,\
    \ you need to also change the embedding model used for the vector generation.\n\
    \nFor Google Gemini, you can import the `GoogleGenerativeAIEmbeddings` model as\
    \ follows:\n\n```javascript\nimport {\n  ChatGoogleGenerativeAI,\n  GoogleGenerativeAIEmbeddings,\n\
    } from '@langchain/google-genai';\n\n// llm\nconst llm = new ChatGoogleGenerativeAI({\n\
    \  model: 'gemini-1.5-pro-latest',\n  apiKey: process.env.GOOGLE_GEMINI_KEY\n\
    });\n\n// embeddings\nconst embeddings = new GoogleGenerativeAIEmbeddings({\n\
    \  apiKey: process.env.GOOGLE_GEMINI_KEY,\n  modelName: 'embedding-001',\n});\n\
    ```\n\nFor Ollama, you can use the community-developed `OllamaEmbeddings` class\
    \ like this:\n\n```javascript\nimport { ChatOllama } from '@langchain/community/chat_models/ollama';\n\
    import { OllamaEmbeddings } from '@langchain/community/embeddings/ollama';\n\n\
    // llm\nconst llm = new ChatOllama({ model: 'mistral' });\n\n// embeddings\nconst\
    \ embeddings = new OllamaEmbeddings({ model: 'mistral' });\n```\n\nMake sure that\
    \ you use the same model when instantiating the ChatOllama and OllamaEmbeddings\
    \ classes.\n\n## Summary\n\nThe code for this chapter is available in the folder\
    \ *11_Chat_With_Document* from the book source code.\n\nIn this chapter, you've\
    \ learned how to create a Chat With Document application using LangChain.\n\n\
    Using the RAG technique, LangChain can be used to retrieve information from a\
    \ document, and then pass the information to the LLM.\n\nThe first thing you need\
    \ to do is to process the document and turn it into chunks, which can then be\
    \ converted into vectors using an embedding model.\n\nThe vectors are stored in\
    \ a vector database, and the retriever created from the database is used when\
    \ the user sends a query or input.\n\nNext, let's see how we can load documents\
    \ in different formats, such as .docx and .pdf.\n\n## CHAPTER 12: UPLOADING DIFFERENT\
    \ DOCUMENT TYPES\n\nNow that we can load a .txt document in LangChain, let’s improve\
    \ the application so we can also load other document types or formats, such as\
    \ .docx and .pdf.\n\nTo load different file formats, you need to import the loader\
    \ for each format as follows:\n\n```javascript\nimport { TextLoader } from 'langchain/document_loaders/fs/text';\n\
    import { PDFLoader } from \"@langchain/community/document_loaders/fs/pdf\";\n\
    import { DocxLoader } from \"@langchain/community/document_loaders/fs/docx\";\n\
    ```\n\nNext, you need to check on the document extension and load the document\
    \ using the matching loader.\n\nRight below the llm creation, specify the location\
    \ of the file you want to use as a filePath variable, then get the extension of\
    \ the document using the path.extname() method:\n\n```javascript\nimport path\
    \ from 'path';\n\n// ...\n\nconst filePath = './python.pdf';\nconst extension\
    \ = path.extname(filePath);\n\nlet loader = null;\n\nif (extension === '.txt'){\n\
    \    loader = new TextLoader(filePath);\n} else if (extension === '.pdf') {\n\
    \    loader = new PDFLoader(filePath);\n} else if (extension === '.docx') {\n\
    \    loader = new DocxLoader(filePath);\n} else {\n    throw new Error('The document\
    \ format is not supported');\n}\n\nconst docs = await loader.load();\n```\n\n\
    The code above uses the 'python.pdf' file which you can get from the source code\
    \ folder.\n\nAfter you get the extension string, you need to check the value to\
    \ create the right loader.\n\nWhen the document format is not supported, throw\
    \ an error to stop the application.\n\nThe LangChain loaders depend on Node packages.\
    \ You need to install mammoth to load .docx files and pdf-parse to load .pdf files:\n\
    \n```\nnpm install mammoth pdf-parse\n```\n\nOnce the loader is created, you can\
    \ load and split the document into chunks, convert the chunks into vectors, and\
    \ create the chains like in the previous chapter:\n\n```javascript\nconst docs\
    \ = await loader.load();\n\nconst splitter = new RecursiveCharacterTextSplitter({\n\
    \    chunkSize: 1000,\n    chunkOverlap: 200,\n});\n\nconst chunks = await splitter.splitDocuments(docs);\n\
    // the rest is the same...\n```\n\nAnd that’s it. Now you can upload a .txt, .docx,\
    \ or .pdf document and ask questions relevant to the content of the document.\n\
    \nTo change the document you want to upload, you just need to change the filePath\
    \ variable to the location of the document.\n\nIf you upload a document that’s\
    \ not supported, Node will show 'The document format is not supported' error.\n\
    \n### Summary\n\nThe code for this chapter is available in the folder *12_Uploading_Different_Document_Types*\
    \ from the book source code.\n\nIn this chapter, you have improved the Chat With\
    \ Document application further by creating an interface for uploading a file,\
    \ then load the document using different loaders, depending on the type of the\
    \ document.\n\nIn the next chapter, I’m going to show you how to chat with YouTube\
    \ videos. See you there!\n\n## CHAPTER 13: CHAT WITH YOUTUBE VIDEOS\n\nNow that\
    \ you’ve learned how to make AI interact with documents, let’s continue with creating\
    \ a Chat with YouTube application.\n\nTo create this application, you can copy\
    \ the finished application from Chapter 11 and make the changes shown in this\
    \ chapter.\n\nLet’s get started!\n\n### Adding The YouTube Loader\n\nThe Chat\
    \ With YouTube application uses the RAG technique to augment the LLM with the\
    \ video’s transcript data.\n\nTo get a YouTube video’s transcript, you need to\
    \ install the youtube-transcript and youtubei.js packages using npm as follows:\n\
    \n```\nnpm install youtube-transcript youtubei.js\n```\n\nThis API is used by\
    \ LangChain’s YouTube loader to fetch the transcript of a video.\n\nAt the top\
    \ of the file, import the YoutubeLoader class from LangChain like this:\n\n```javascript\n\
    import { YoutubeLoader } from\n'@langchain/community/document_loaders/web/youtube';\n\
    ```\n\nWe're going to ask the user for a YouTube URL, then process that URL to\
    \ create the embeddings and RAG chain.\n\nJust below the history initiation, create\
    \ a function named processUrl() with the following content:\n\n```javascript\n\
    const history = new ChatMessageHistory();\n\nconst processUrl = async ytUrl =>\
    \ {\n    const loader = YoutubeLoader.createFromUrl(ytUrl);\n    const docs =\
    \ await loader.load();\n    const splitter = new RecursiveCharacterTextSplitter({\n\
    \        chunkSize: 1000,\n        chunkOverlap: 200,\n    });\n\n    const chunks\
    \ = await splitter.splitDocuments(docs);\n\n    const embeddings = new OpenAIEmbeddings({\
    \ apiKey: process.env.OPENAI_KEY });\n\n    const vectorStore = await MemoryVectorStore.fromDocuments(\n\
    \        chunks,\n        embeddings\n    );\n\n    const retriever = vectorStore.asRetriever();\n\
    \n    const historyAwareRetriever = await createHistoryAwareRetriever({\n    \
    \    llm,\n        retriever,\n        rephrasePrompt: contextualizePrompt,\n\
    \    });\n\n    const ragChain = await createRetrievalChain({\n        retriever:\
    \ historyAwareRetriever,\n        combineDocsChain: questionAnswerChain,\n   \
    \ });\n};\n```"
  mdcn: "\n## 关于向量数据库\n\n本应用中我们使用了 `MemoryVectorStore` 来存储向量数据，但实际上并不推荐在生产环境中使用这种存储方式。\n\
    \n当应用停止运行时，内存中的向量数据将会丢失。\n\n大多数现代数据库应用（如 PostgreSQL、Redis 和 MongoDB）都支持存储向量数据，因此你可能需要在生产环境中使用它们。\n\
    \n你可以在 [https://js.langchain.com/v0.2/docs/integrations/vectorstores/](https://js.langchain.com/v0.2/docs/integrations/vectorstores/)\
    \ 查看向量数据库集成的详细信息。\n\n`MemoryVectorStore` 数据库仅建议用于原型设计和测试。\n\n## 切换大语言模型\n\n如果你想更改此应用使用的大语言模型，还需要更改用于向量生成的嵌入模型。\n\
    \n对于 Google Gemini，你可以这样导入 `GoogleGenerativeAIEmbeddings` 模型：\n\n```javascript\n\
    import {\n  ChatGoogleGenerativeAI,\n  GoogleGenerativeAIEmbeddings,\n} from '@langchain/google-genai';\n\
    \n// llm\nconst llm = new ChatGoogleGenerativeAI({\n  model: 'gemini-1.5-pro-latest',\n\
    \  apiKey: process.env.GOOGLE_GENERAI_KEY\n});\n\n// embeddings\nconst embeddings\
    \ = new GoogleGenerativeAIEmbeddings({\n  apiKey: process.env.GOOGLE_GENERAI_KEY,\n\
    \  modelName: 'embedding-001',\n});\n```\n\n对于 Ollama，你可以使用社区开发的 `OllamaEmbeddings`\
    \ 类，如下所示：\n\n```javascript\nimport { ChatOllama } from '@langchain/community/chat_models/ollama';\n\
    import { OllamaEmbeddings } from '@langchain/community/embeddings/ollama';\n\n\
    // llm\nconst llm = new ChatOllama({ model: 'mistral' });\n\n// embeddings\nconst\
    \ embeddings = new OllamaEmbeddings({ model: 'mistral' });\n```\n\n确保在实例化 `ChatOllama`\
    \ 和 `OllamaEmbeddings` 类时使用相同的模型。\n\n## 总结\n\n本章的代码可在书籍源代码的 *11_Chat_With_Document*\
    \ 文件夹中找到。\n\n在本章中，你学习了如何使用 LangChain 创建一个与文档对话的应用程序。\n\n利用 RAG 技术，LangChain 可以从文档中检索信息，然后将信息传递给大语言模型。\n\
    \n你需要做的第一件事是处理文档并将其转换成块，然后使用嵌入模型将这些块转换为向量。\n\n向量存储在向量数据库中，当用户发送查询或输入时，会使用从数据库创建的检索器。\n\
    \n接下来，让我们看看如何加载不同格式的文档，例如 .docx 和 .pdf。\n\n## 第 12 章：上传不同类型的文档\n\n既然我们可以在 LangChain\
    \ 中加载 .txt 文档，让我们来改进应用程序，使其也能加载其他类型的文档或格式，例如 .docx 和 .pdf。\n\n要加载不同的文件格式，你需要按如下方式导入每种格式的加载器：\n\
    \n```javascript\nimport { TextLoader } from 'langchain/document_loaders/fs/text';\n\
    import { PDFLoader } from \"@langchain/community/document_loaders/fs/pdf\";\n\
    import { DocxLoader } from \"@langchain/community/document_loaders/fs/docx\";\n\
    ```\n\n接下来，你需要检查文档扩展名并使用匹配的加载器加载文档。\n\n在创建 llm 的代码下方，将你想使用的文件位置指定为 `filePath`\
    \ 变量，然后使用 `path.extname()` 方法获取文档扩展名：\n\n```javascript\nimport path from 'path';\n\
    \n// ...\n\nconst filePath = './python.pdf';\nconst extension = path.extname(filePath);\n\
    \nlet loader = null;\n\nif (extension === '.txt'){\n    loader = new TextLoader(filePath);\n\
    } else if (extension === '.pdf') {\n    loader = new PDFLoader(filePath);\n} else\
    \ if (extension === '.docx') {\n    loader = new DocxLoader(filePath);\n} else\
    \ {\n    throw new Error('The document format is not supported');\n}\n\nconst\
    \ docs = await loader.load();\n```\n\n上述代码使用了 'python.pdf' 文件，你可以从源代码文件夹中获取。\n\
    \n获取扩展名字符串后，你需要检查该值以创建正确的加载器。\n\n当文档格式不支持时，抛出错误以停止应用程序。\n\nLangChain 加载器依赖于 Node\
    \ 包。你需要安装 `mammoth` 来加载 .docx 文件，安装 `pdf-parse` 来加载 .pdf 文件：\n\n```\nnpm install\
    \ mammoth pdf-parse\n```\n\n加载器创建后，你可以加载并分割文档为块，将块转换为向量，并像上一章一样创建链：\n\n```javascript\n\
    const docs = await loader.load();\n\nconst splitter = new RecursiveCharacterTextSplitter({\n\
    \    chunkSize: 1000,\n    chunkOverlap: 200,\n});\n\nconst chunks = await splitter.splitDocuments(docs);\n\
    // 剩余部分相同...\n```\n\n就这样。现在你可以上传 .txt、.docx 或 .pdf 文档，并就文档内容提出相关问题。\n\n要更改你想上传的文档，只需将\
    \ `filePath` 变量更改为文档的位置。\n\n如果你上传的文档不支持，Node 将显示 'The document format is not supported'\
    \ 错误。\n\n### 总结\n\n本章的代码可在书籍源代码的 *12_Uploading_Different_Document_Types* 文件夹中找到。\n\
    \n在本章中，你通过创建文件上传界面，然后根据文档类型使用不同的加载器加载文档，进一步改进了与文档对话的应用程序。\n\n在下一章中，我将向你展示如何与 YouTube\
    \ 视频进行对话。到时见！\n\n## 第 13 章：与 YouTube 视频对话\n\n既然你已经学会了如何让 AI 与文档交互，让我们继续创建一个与 YouTube\
    \ 对话的应用程序。\n\n要创建此应用程序，你可以从第 11 章复制完成的应用程序，并进行本章所示的更改。\n\n让我们开始吧！\n\n### 添加 YouTube\
    \ 加载器\n\n与 YouTube 对话的应用程序使用 RAG 技术，用视频的转录数据来增强大语言模型。\n\n要获取 YouTube 视频的转录，你需要使用\
    \ npm 安装 `youtube-transcript` 和 `youtubei.js` 包，如下所示：\n\n```\nnpm install youtube-transcript\
    \ youtubei.js\n```\n\n此 API 被 LangChain 的 YouTube 加载器用于获取视频的转录。\n\n在文件顶部，像这样从\
    \ LangChain 导入 `YoutubeLoader` 类：\n\n```javascript\nimport { YoutubeLoader } from\n\
    '@langchain/community/document_loaders/web/youtube';\n```\n\n我们将向用户请求一个 YouTube\
    \ URL，然后处理该 URL 以创建嵌入和 RAG 链。\n\n在初始化历史记录的下方，创建一个名为 `processUrl()` 的函数，内容如下：\n\
    \n```javascript\nconst history = new ChatMessageHistory();\n\nconst processUrl\
    \ = async ytUrl => {\n    const loader = YoutubeLoader.createFromUrl(ytUrl);\n\
    \    const docs = await loader.load();\n    const splitter = new RecursiveCharacterTextSplitter({\n\
    \        chunkSize: 1000,\n        chunkOverlap: 200,\n    });\n\n    const chunks\
    \ = await splitter.splitDocuments(docs);\n\n    const embeddings = new OpenAIEmbeddings({\
    \ apiKey: process.env.OPENAI_KEY });\n\n    const vectorStore = await MemoryVectorStore.fromDocuments(\n\
    \        chunks,\n        embeddings\n    );\n\n    const retriever = vectorStore.asRetriever();\n\
    \n    const historyAwareRetriever = await createHistoryAwareRetriever({\n    \
    \    llm,\n        retriever,\n        rephrasePrompt: contextualizePrompt,\n\
    \    });\n\n    const ragChain = await createRetrievalChain({\n        retriever:\
    \ historyAwareRetriever,\n        combineDocsChain: questionAnswerChain,\n   \
    \ });\n};\n```\n"
