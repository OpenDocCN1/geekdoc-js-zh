  md: '# CHAPTER 9: IMPLEMENTING CHAT HISTORY IN LANGCHAIN


    So far, the LLM took the question we asked it and gave an answer retrieved from
    the training data.


    Going back to the simple question and answer application in Chapter 5, you can
    try to ask the LLM a question such as:


    +   1. When was the last FIFA World Cup held?

    2. Multiply the year by 2


    At the time of this writing, the last FIFA World Cup was held in 2022. Reading
    the second prompt above, we can understand that the ''year'' refers to ''2022''.


    However, because the LLM has no awareness of the previous interaction, the answer
    won’t be related.


    With GPT, the LLM refers to the current year instead of the last FIFA World Cup
    year:'
  merge: -1
