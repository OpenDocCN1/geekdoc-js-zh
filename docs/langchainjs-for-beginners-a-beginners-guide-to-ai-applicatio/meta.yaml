- img_proc: true
  md: "You need to import the createHistoryAwareRetriever chain, then create a createHistoryAwareRetriever\
    \ object as follows:\n\n```\nimport { createHistoryAwareRetriever } from 'langchain/chains/history_aware_retriever';\n\
    \n// ... other code\n\nconst retriever = vectorStore.asRetriever();\n\nconst contextualizeSystemPrompt\
    \ = `\nGiven a chat history and the latest user question\nwhich might reference\
    \ context in the chat history, formulate a standalone question\nwhich can be understood\
    \ without the chat history. Do NOT answer the question,\njust reformulate it if\
    \ needed and otherwise return it as is.\n`;\n\nconst contextualizePrompt = ChatPromptTemplate.fromMessages([\n\
    \  ['system', contextualizeSystemPrompt],\n  new MessagesPlaceholder('chat_history'),\n\
    \  ['human', '{input}'],\n]);\n\nconst historyAwareRetriever = await createHistoryAwareRetriever({\n\
    \  llm,\n  retriever,\n  rephrasePrompt: contextualizePrompt,\n});\n```\n\nThe\
    \ contextualizePrompt is used to make the LLM rephrase the question in context\
    \ of the chat history.\n\nThe prompt is passed to the createHistoryAwareRetriever\
    \ object.\n\nNext, you need to add MessagesPlaceholder to the prompt object as\
    \ well:\n\n```\nconst prompt = ChatPromptTemplate.fromMessages([\n  ['system',\
    \ systemPrompt],\n  new MessagesPlaceholder('chat_history'),\n```"
