    \ with different types of documents and chat with YouTube videos, let's continue\
    \ with making AI understand images.\n\n## Understanding Multimodal Messages\n\n\
    A multimodal message is a message that uses more than one mode of communication\
    \ to communicate.\n\nThe communication modes known to humans are:\n\n- Text\n\
    - Video\n- Audio\n- Image\n\nAdvanced models like GPT-4 and Gemini Pro already\
    \ have vision capabilities, meaning the models can \"see\" images and answer questions\
    \ about them.\n\nUsing the multimodal message, we can use AI to interact with\
    \ images, like asking how many persons are shown on an image or what color is\
    \ dominant in the image.\n\nLet's learn how to create such an application using\
    \ LangChain next.\n\n## Sending Multimodal Messages in LangChain\n\nTo send a\
    \ multimodal message in LangChain, you only need to adjust the prompt template\
    \ and pass a list for the human message.\n\nFirst, create a new file named handle_image.js,\
    \ import the required packages, and define the LLM to use as follows:\n\n```\n\
    import { ChatOpenAI } from '@langchain/openai';\n\nimport { ChatPromptTemplate\
    \ } from '@langchain/core/prompts';\n\nimport { readFile } from 'node:fs/promises';\n\
    import prompts from 'prompts';\n\nimport 'dotenv/config';\n\nconst llm = new ChatOpenAI({\n\
    \  model: 'gpt-4o',\n  apiKey: process.env.OPENAI_KEY,\n});\n```\n\nThe readFile\
    \ module from Node is used to read the image file and encode it in base 64 string\
    \ format.\n\nWrite the function to encode images below the llm variable:\n\n```\n\
    const encodeImage = async imagePath => {\n    const imageData = await readFile(imagePath);\n\
    \    return imageData.toString('base64');\n}\n\nconst image = await encodeImage('./image.jpg');\n\
    ```\n\nChange the './image.jpg' passed to the encodeImage() function with an image\
    \ you have in your computer.\n\nYou can pass any image you have on your computer\
    \ to the function, but make sure it doesn’t contain any sensitive data.\n\nThe\
    \ encoded image can then be passed into a chat prompt template as follows:\n\n\
    ```\nconst prompt = ChatPromptTemplate.fromMessages([\n    ['system', 'You are\
    \ a helpful assistant that can describe images in detail.'],\n    ['human',\n\
    \        [\n            { type: 'text', text: '{input}' },\n            {\n  \
    \              type: 'image_url',\n                image_url: {\n            \
    \        url: `data:image/jpeg;base64,${image}`,\n                    detail:\
    \ 'low',\n                },\n            },\n        ],\n    ],\n]);\n```\n\n\
    In the template above, you can see that there are two messages passed as the human\
    \ message: the \"text\" for the question and the \"image_url\" for the image.\n\
    \nWe can pass a public image url such as 'https://', but here we use the data:image\
    \ URI because we upload an image from our computer.\n\nBehind the scenes, LangChain\
    \ automatically converts the message into a multimodal message.\n\nCreate a chain\
    \ from the prompt and the llm, and ask the user for an input:\n\n```\nconst chain\
    \ = prompt.pipe(llm);\nconst response = await chain.invoke({\"input\": \"What\
    \ do you see on this image?\"})\n\nconsole.log(response.content);\n```\n\nThe\
    \ LLM will process the image, and then give you the appropriate answer.\n\n##\
    \ Adding Chat History\n\nNow that you can ask questions about an image using a\
    \ language model, let's improve the application by adding a chat history.\n\n\
    As always, import the packages needed to add the web interface and history first:\n\
    \n```\nimport { ChatOpenAI } from '@langchain/openai';\n\nimport { ChatMessageHistory\
    \ } from 'langchain/memory';\nimport { RunnableWithMessageHistory } from '@langchain/core/runnables';\n\
    import {\n  ChatPromptTemplate,\n  MessagesPlaceholder,\n} from '@langchain/core/prompts';\n\
    \nimport { readFile } from 'node:fs/promises';\n\nimport prompts from 'prompts';\n\
    \nimport 'dotenv/config';\n```\n\nNext, you need to instantiate the ChatMessageHistory\
    \ class and upgrade the chain to include chat history, similar to Chapter 9.\n\
    \n```\nconst history = new ChatMessageHistory();\n\nconst chain = prompt.pipe(llm);\n\
    \nconst chainWithHistory = new RunnableWithMessageHistory({\n  runnable: chain,\n\
    \  getMessageHistory: sessionId => history,\n  inputMessagesKey: 'input',\n  historyMessagesKey:\
    \ 'chat_history',\n});\n```\n\nThe next step is to ask for a question from the\
    \ user. Use prompts to do so:\n\n```\nconsole.log('Chat With Image');\nconsole.log('Type\
    \ /bye to stop the program');\n\nlet exit = false;\nwhile (!exit) {\n  const {\
    \ question } = await prompts([\n    {\n      type: 'text',\n      name: 'question',\n\
    \      message: 'Your question: ',\n      validate: value => (value ? true : 'Question\
    \ cannot be empty'),\n    },\n  ]);\n  if (question === '/bye') {\n    console.log('See\
    \ you later!');\n    exit = true;\n  } else {\n    const response = await chainWithHistory.invoke(\n\
    \      { input: question },\n      {\n        configurable: {\n          sessionId:\
    \ 'test',\n        },\n      }\n    );\n    console.log(response.content);\n \
    \ }\n}\n```"
