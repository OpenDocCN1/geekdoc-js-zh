    \nconst response = await agentExecutor.invoke({ input: question });\nconsole.log(response);\n\
    ```\n\nThe AI agent is now completed. You can run the agent using Node.js as follows:\n\
    \n```bash\nnode react_agent.js\n```\n\nNow give a task for the agent to finish,\
    \ such as 'Who was the first president of America?'\n\nBecause the verbose parameter\
    \ is set to true in AgentExecutor, you will see the reasoning and action taken\
    \ by the LLM:\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_87_0.png)\n\nFigure\
    \ 32. LLM Agent Reasoning and Taking Actions\n\nThe LLM will take action using\
    \ the agent we have created to seek the final answer.\n\nThe following log shows\
    \ the thinking done by the LLM:\n\n```\n[llm/end] [1:chain:AgentExecutor > 10:chain:ReactAgent\
    \ > 15:llm:ChatOpenAI] [2.35s] Exiting LLM run with output: {\n  \"generations\"\
    : [\n    [\n      {\n        \"text\": \"I have gathered enough information to\
    \ provide a reliable answer.\\n\\nThe first president of the United States was\
    \ George Washington. He won a unanimous vote of the Electoral College and served\
    \ as president from 1789 to 1797. Washington is a significant historical figure\
    \ and is well known for being the only U.S. president never affiliated with any\
    \ political party.\\n\\nFinal Answer: The first president of the United States\
    \ was George Washington.\",\n        \"generationInfo\": {\n          \"prompt\"\
    : 0,\n          \"completion\": 0,\n          \"finish_reason\": \"stop\"\n  \
    \      }\n      }\n    ]\n  ]\n}\n```\n\nFigure 33. LLM Agent Finished\n\nAfter\
    \ the agent finished running, it will return an object with two properties: input\
    \ and output as shown below:\n\n```javascript\n{\n  input: 'Who was the first\
    \ president of America?',\n  output: 'The first president of the United States\
    \ was George Washington.'\n}\n```\n\nIf the LLM you use already has the answer\
    \ in its training data, you might see the output immediately without any [agent/action]\
    \ logs.\n\nFor example, I asked 'When is America Independence Day?' below:\n\n\
    ```\nYour question:  ... When is America Independence Day?\n\nAmerica's Independence\
    \ Day is a well-known historical event that does not require searching for current\
    \ updates or detailed information from an encyclopedia.\n\nIt is generally known\
    \ information.\\n\\nFinal Answer: America's Independence Day is on July 4th.\n\
    \n{\n  input: 'When is America Independence Day?',\n  output: \"America's Independence\
    \ Day is on July 4th.\"\n}\n```\n\nBecause the answer is already in its training\
    \ data, the LLM decides to answer directly.\n\n## Asking Different Questions to\
    \ the Agent\n\nYou can now ask different kinds of questions to see if the LLM\
    \ is smart enough to use the available tools.\n\nIf you ask 'Who is the Prime\
    \ Minister of Singapore today?', the LLM should use DuckDuckGo search to seek\
    \ the latest information:\n\n```\n[agent/action] [1:chain:AgentExecutor] Agent\
    \ selected action: {\n\"tool\": \"duckduckgo-search\",\n\"toolInput\": \"Current\
    \ Prime Minister of Singapore\",\n\"log\": \"The Prime Minister of Singapore may\
    \ have current and up-to-date information available through a search engine.\\\
    n\\nAction: duckduckgo-search\\nAction Input: Current Prime Minister of Singapore\"\
    \n}\n```\n\nFigure 34. LLM Agent Doing Search\n\nIf you ask a math question such\
    \ as 'Take 5 to the power of 2 then multiply that by the sum of six and three',\
    \ the agent should use the calculator tool:\n\n```\n[agent/action] [1:chain:AgentExecutor]\
    \ Agent selected action: {\n\"tool\": \"calculator\",\n\"toolInput\": \"25 * 9\"\
    ,\n\"log\": \"Now that I have both intermediate results, I can multiply 25 by\
    \ 9 to get the final answer.\\n\\nAction: calculator\\nAction Input: 25 * 9\\\
    n\"\n}\n```\n\nFigure 35. LLM Agent Doing Math\n\nThe latest LLMs are smart enough\
    \ to understand the intent of the question and pick the right tool for the job.\n\
    \n## List of Available AI Tools\n\nAn AI agent can only use the tools you added\
    \ when you create the agent.\n\nThe list of tools provided by LangChain can be\
    \ found at [https://js.langchain.com/v0.2/docs/integrations/tools](https://js.langchain.com/v0.2/docs/integrations/tools).\n\
    \nHowever, some tools like Calculator and BingSerpAPI are not listed on the integration\
    \ page above, so you need to dive into the source code of the LangChain community\
    \ package to find all available tools.\n\nJust open the node_modules/ folder,\
    \ then go into @langchain/community/tools and you'll see all tools there:\n\n\
    ![](img/e0794cfae6ccfa863233c46659e3d9d8_91_0.png)\n\n*Figure 36. LLM Agent Available\
    \ Tools*\n\nYou can see other tools like Google search and Bing search here, but\
    \ these tools require an API key to run.\n\n## Types of AI Agents\n\nThere are\
    \ several types of AI agents identified today, and the one we created is called\
    \ a ReAct (Reason + Act) agent.\n\nThe ReAct agent is a general-purpose agent,\
    \ and there are more specialized agents such as the XML agent and JSON agent.\n\
    \nYou can read more about the different agent types at https://js.langchain.com/v0.1/docs/modules/agents/agent_types/\n\
    \nAs LLM and LangChain improve, new types of agents might be created, so the definitions\
    \ above won’t always be relevant.\n\n## Summary\n\nThe code for this chapter is\
    \ available in the folder *10_Agents_and_Tools* from the book source code.\n\n\
    While we don’t have an autonomous robot helper (yet) in our world today, we can\
    \ already see how the development of AI agents might one day be used as the brains\
    \ of AI robots.\n\nAI agents are a wonderful innovation that shows how a machine\
    \ can come up with a sequence of actions to take to accomplish a goal.\n\nWhen\
    \ you create an agent, the LLM is used as a reasoning engine that needs to come\
    \ up with steps of logic to accomplish a task.\n\nThe agent can also use various\
    \ tools to act, such as browsing the web or solving a math equation.\n\nMore complex\
    \ tasks that use multiple tools can also be executed by these agents.\n\nSometimes,\
    \ a well-trained LLM can answer directly from the training data, bypassing the\
    \ need to use tools.\n\n# CHAPTER 11: INTERACTING WITH DOCUMENTS IN LANGCHAIN\n\
    \nOne of the most interesting AI use cases is the Chat With Document feature,\
    \ which enables users to interact with a document using conversational queries.\n\
    \nBy simply asking questions, users can quickly find relevant information, summarize\
    \ content, and gain insights without having to read and sort through pages of\
    \ text.\n\nHere's an illustration of the process required to create a Chat With\
    \ Document application:\n\n## Chat With Document Application Process\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_95_0.png)\n\
    \nFigure 37. Chat With Document Application Process\n\nYou first need to split\
    \ a single document into chunks so that the document can be processed and indexed\
    \ effectively. The chunks are then converted into vector embeddings.\n\nVector\
    \ embeddings are arrays of numbers that represent information of various types,\
    \ including text, images, audio, and more, by capturing their features in a numerical\
    \ format.\n\nWhen you give a question, LangChain will convert the query into vectors,\
    \ and then search the document vectors for the most relevant matches.\n\nLangChain\
    \ then sends the user query and relevant text chunks to LLM so that the LLM can\
    \ generate a response based on the given input.\n\nThe process of finding relevant\
    \ text information and sending it to the LLM is also known as Retrieval Augmented\
    \ Generation."
  mdcn: "\n接下来，实例化我们希望提供给LLM的工具，然后按照以下方式创建代理执行器对象：\n\n```javascript\nconst wikipedia\
    \ = new WikipediaQueryRun();\nconst ddgSearch = new DuckDuckGoSearch({ maxResults:\
    \ 3 });\nconst calculator = new Calculator();\nconst tools = [wikipedia, ddgSearch,\
    \ calculator];\nconst agent = await createReactAgent({ llm, tools, prompt });\n\
    const agentExecutor = new AgentExecutor({\n  agent,\n  tools,\n  verbose: true\
    \ // 显示日志\n});\n```\n\n我们为代理提供了三个工具：\n1.  wikipedia 用于访问和总结维基百科文章\n2.  ddgSearch\
    \ 用于使用DuckDuckGo搜索引擎搜索互联网\n3.  calculator 用于计算数学方程式\n\n要运行DuckDuckGo搜索工具，你需要使用npm安装\
    \ duck-duck-scrape 包：\n\n```bash\nnpm install duck-duck-scrape\n```\n\n其余的工具已经可以从\
    \ @langchain/community 模块中获取。\n\n安装完成后，通过添加问题提示并调用 `invoke()` 方法来完成代理：\n\n```javascript\n\
    const { question } = await prompts([\n  {\n    type: 'text',\n    name: 'question',\n\
    \    message: 'Your question: ',\n    validate: value => (value ? true : 'Question\
    \ cannot be empty'),\n  },\n]);\n\nconst response = await agentExecutor.invoke({\
    \ input: question });\nconsole.log(response);\n```\n\nAI代理现已完成。你可以按照以下方式使用Node.js运行代理：\n\
    \n```bash\nnode react_agent.js\n```\n\n现在给代理一个任务来完成，例如“美国的第一任总统是谁？”\n\n由于在 `AgentExecutor`\
    \ 中将 `verbose` 参数设置为 `true`，你将看到LLM的推理过程和所采取的行动：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_87_0.png)\n\
    \n图32。LLM代理推理和采取行动\n\nLLM将使用我们创建的代理来采取行动，以寻求最终答案。\n\n以下日志显示了LLM的思考过程：\n\n```\n\
    [llm/end] [1:chain:AgentExecutor > 10:chain:ReactAgent > 15:llm:ChatOpenAI] [2.35s]\
    \ Exiting LLM run with output: {\n  \"generations\": [\n    [\n      {\n     \
    \   \"text\": \"I have gathered enough information to provide a reliable answer.\\\
    n\\nThe first president of the United States was George Washington. He won a unanimous\
    \ vote of the Electoral College and served as president from 1789 to 1797. Washington\
    \ is a significant historical figure and is well known for being the only U.S.\
    \ president never affiliated with any political party.\\n\\nFinal Answer: The\
    \ first president of the United States was George Washington.\",\n        \"generationInfo\"\
    : {\n          \"prompt\": 0,\n          \"completion\": 0,\n          \"finish_reason\"\
    : \"stop\"\n        }\n      }\n    ]\n  ]\n}\n```\n\n图33。LLM代理完成\n\n代理运行完成后，它将返回一个包含两个属性的对象：`input`\
    \ 和 `output`，如下所示：\n\n```javascript\n{\n  input: 'Who was the first president\
    \ of America?',\n  output: 'The first president of the United States was George\
    \ Washington.'\n}\n```\n\n如果你使用的LLM在其训练数据中已经有了答案，你可能会立即看到输出，而没有任何 [agent/action]\
    \ 日志。\n\n例如，我下面问了“美国独立日是什么时候？”\n\n```\nYour question:  ... When is America Independence\
    \ Day?\n\nAmerica's Independence Day is a well-known historical event that does\
    \ not require searching for current updates or detailed information from an encyclopedia.\n\
    \nIt is generally known information.\\n\\nFinal Answer: America's Independence\
    \ Day is on July 4th.\n\n{\n  input: 'When is America Independence Day?',\n  output:\
    \ \"America's Independence Day is on July 4th.\"\n}\n```\n\n因为答案已经在其训练数据中，LLM决定直接回答。\n\
    \n## 向代理提出不同的问题\n\n你现在可以问不同类型的问题，以查看LLM是否足够智能，能够使用可用的工具。\n\n如果你问“今天新加坡的总理是谁？”，LLM应该使用DuckDuckGo搜索来获取最新信息：\n\
    \n```\n[agent/action] [1:chain:AgentExecutor] Agent selected action: {\n\"tool\"\
    : \"duckduckgo-search\",\n\"toolInput\": \"Current Prime Minister of Singapore\"\
    ,\n\"log\": \"The Prime Minister of Singapore may have current and up-to-date\
    \ information available through a search engine.\\n\\nAction: duckduckgo-search\\\
    nAction Input: Current Prime Minister of Singapore\"\n}\n```\n\n图34。LLM代理进行搜索\n\
    \n如果你问一个数学问题，例如“5的2次方，然后乘以6和3的和”，代理应该使用计算器工具：\n\n```\n[agent/action] [1:chain:AgentExecutor]\
    \ Agent selected action: {\n\"tool\": \"calculator\",\n\"toolInput\": \"25 * 9\"\
    ,\n\"log\": \"Now that I have both intermediate results, I can multiply 25 by\
    \ 9 to get the final answer.\\n\\nAction: calculator\\nAction Input: 25 * 9\\\
    n\"\n}\n```\n\n图35。LLM代理进行数学计算\n\n最新的LLM足够智能，能够理解问题的意图并选择正确的工具来完成任务。\n\n## 可用AI工具列表\n\
    \nAI代理只能使用你在创建代理时添加的工具。\n\nLangChain提供的工具列表可以在 [https://js.langchain.com/v0.2/docs/integrations/tools](https://js.langchain.com/v0.2/docs/integrations/tools)\
    \ 找到。\n\n但是，像 Calculator 和 BingSerpAPI 这样的工具并未在上面的集成页面中列出，因此你需要深入研究LangChain社区包的源代码来找到所有可用的工具。\n\
    \n只需打开 `node_modules/` 文件夹，然后进入 `@langchain/community/tools`，你就能看到所有的工具：\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_91_0.png)\n\
    \n*图36。LLM代理可用工具*\n\n你可以在这里看到其他工具，如Google搜索和Bing搜索，但这些工具需要API密钥才能运行。\n\n## AI代理的类型\n\
    \n目前已确定几种类型的AI代理，我们创建的称为ReAct（推理+行动）代理。\n\nReAct代理是一种通用代理，还有更专业的代理，例如XML代理和JSON代理。\n\
    \n你可以在 https://js.langchain.com/v0.1/docs/modules/agents/agent_types/ 阅读更多关于不同代理类型的信息。\n\
    \n随着LLM和LangChain的改进，可能会创建新的代理类型，因此以上定义并不总是适用。\n\n## 总结\n\n本章的代码可在书籍源代码的 *10_Agents_and_Tools*\
    \ 文件夹中找到。\n\n虽然我们目前的世界还没有自主机器人助手（还没有），但我们已经可以看到AI代理的发展有一天可能被用作AI机器人的大脑。\n\nAI代理是一项了不起的创新，它展示了一台机器如何能提出一系列行动步骤来实现一个目标。\n\
    \n当你创建一个代理时，LLM被用作推理引擎，需要提出一系列逻辑步骤来完成任务。\n\n代理也可以使用各种工具来行动，例如浏览网页或解数学方程。\n\n使用多个工具的更复杂任务也可以由这些代理执行。\n\
    \n有时，训练有素的LLM可以直接从训练数据中回答，从而绕过使用工具的需要。\n\n# 第11章：在LANGCHAIN中与文档交互\n\n最有趣的AI用例之一是“与文档聊天”功能，它允许用户通过对话式查询与文档进行交互。\n\
    \n只需提出问题，用户就可以快速找到相关信息、总结内容并获得见解，而无需阅读和整理大量文本。\n\n以下是创建“与文档聊天”应用程序所需过程的说明：\n\n\
    ## 与文档聊天应用程序流程\n\n![](img/e0794cfae6ccfa863233c46659e3d9d8_95_0.png)\n\n图37。与文档聊天应用程序流程\n\
    \n你首先需要将单个文档分割成块，以便有效地处理和索引文档。然后将这些块转换为向量嵌入。\n\n向量嵌入是数字数组，通过以数字格式捕捉各种类型信息（包括文本、图像、音频等）的特征来表示这些信息。\n\
    \n当你提出问题时，LangChain会将查询转换为向量，然后在文档向量中搜索最相关的匹配项。\n\n然后，LangChain将用户查询和相关的文本块发送给LLM，以便LLM可以根据给定的输入生成响应。\n\
    \n寻找相关信息并将其发送给LLM的过程也称为检索增强生成。\n"
