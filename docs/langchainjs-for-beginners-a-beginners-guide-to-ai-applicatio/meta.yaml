    \ must be rendered on the browser.\n\nThe `ChatList` and `ChatBottombar` are parts\
    \ of the chat interface that we will create later.\n\nNext, you need to define\
    \ an interface for the Message object as follows:\n\n```\nexport interface Message\
    \ {\n  role: string;\n  content: string;\n}\n```\n\nThis interface is used to\
    \ type the Message object, which will store the messages in the front-end.\n\n\
    Next, create the `Chat()` function component as follows:\n\n```\nexport default\
    \ function Chat() {\n  const [loadingSubmit, setLoadingSubmit] = useState(false);\n\
    \  const [messages, setMessages] = useState<Message[]>([]);\n\n  const sendMessage\
    \ = async (newMessage: Message) => {\n    setLoadingSubmit(true);\n    setMessages(prevMessages\
    \ => [...prevMessages, newMessage]);\n\n    const response = await getReply(newMessage.content);\n\
    \n    const reply: Message = {\n      role: 'assistant',\n      content: response\
