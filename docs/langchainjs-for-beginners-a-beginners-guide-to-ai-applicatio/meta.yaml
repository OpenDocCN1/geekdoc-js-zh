    \ } from 'react';\nimport ChatList from './chat-list';\nimport ChatBottombar from\
    \ './chat-bottombar';\nimport { getReply } from '@/actions/openai.action';\n```\n\
    \nWhen you use React functionalities such as `useState`, you need to define the\
