  md: '# CHAPTER 8: REGULAR SEQUENTIAL CHAINS


    A regular sequential chain is a more general form of sequential chains that allow
    multiple inputs and outputs.


    The input for the next chain is usually a mix of the output from the previous
    chain and another source like this:


    ![](img/e0794cfae6ccfa863233c46659e3d9d8_70_0.png)'
