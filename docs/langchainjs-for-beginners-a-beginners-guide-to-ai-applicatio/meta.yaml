  md: '# # CHAPTER 3: USING OPENAI LLM IN LANGCHAIN


    In the previous chapter, you''ve seen how to communicate with Google''s Gemini
    model using LangChain.


    In this chapter, I will show you how to use OpenAI in LangChain as an alternative.


    But keep in mind that the OpenAI API has no free tier. It used to give away $5
    worth of API usage, but it seems to have been quietly stopped.


    So if you want to use OpenAI API, you need to buy the minimum amount of credit,
    which is $5 USD.


