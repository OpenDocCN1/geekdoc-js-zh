    \n```javascript\nconst ragChain = await createRetrievalChain({\n  retriever: historyAwareRetriever,\n\
    \  combineDocsChain: questionAnswerChain,\n});\n```\n\n现在您有了一个更新后的 RAG 链，像我们在第\
