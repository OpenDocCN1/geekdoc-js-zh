  让我们进入 ES6 类。\n### ES6 classes\n使用 ES6（ECMAScript 6 或 JavaScript 6）类就像使用 `new` 关键字配合用户定义的构造函数一样。构造函数简单地被类所取代。这是一个简短的示例：\n\
