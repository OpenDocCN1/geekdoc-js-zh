  \n创建了五个数组。每个包含一个字符串值和两个数值。然后创建了另一个数组，它包含了五个数组，因此变成了多维。最后，使用 `for` 循环遍历数组，并将其打印到页面上，如所示。\n\
  \n# 总结 (#toc.xhtml_s264a)\n\n在本章中，我们学习了如何使用数组。你学习了如何从数组中移除项以及向数组中添加项。你还学习了什么是多维数组。\n\
  \n在下一章中，我们将介绍 JavaScript 中的正则表达式。\n\n# 问题 (#toc.xhtml_s265a)\n\n1.  定义数组术。\n2. \
  \ `shift` 方法的作用是什么？\n3.  举例使用 `splice` 移除数组项的例子。\n4.  什么是多维数组？\n5.  `pop` 方法的作用是什么？\n\
  \n\n\n\n在字符串中搜索文本可能是困难的，特别是当你只知道字符串中短语的一部分时。幸运的是，JavaScript 包含了正则表达式。正则表达式帮助你通过特殊字符和模式的组合来识别文本部分。\n\
  \n在本节中，你将学习如何使用正则表达式来识别特定的文本片段。\n\n## 结构\n\n*   正则表达式定义\n*   正则表达式修饰符/标志（flags）\n\
  *   正则表达式模式\n\n## 目标\n\n*   了解正则表达式。\n*   了解如何使用修饰符/标志来改进搜索结果。\n*   利用模式搜索文本或短语。\n\
  \n## 正表达式定义\n\n`JavaScript` 中的正则表达式是用于匹配字符串中各种字符组合的模式。这些字符序列形成搜索模式，可以用于搜索字符串内部的文本以及替换字符串中的文本。它可以是一个单个字符，也可以是一个更复杂的模式。\n\
  \n正则表达式可以通过以下两种方式之一构建：\n\n*   使用正则表达式字面量（regular expression literal）\n*   调用 `RegExp`\
  \ 对象的构造函数。\n\n让我们进入更多细节。\n\n## 使用正则表达式字面量\n\n正则表达式字面量由包含在斜杠之间的模式组成，例如：\n\n```javascript\n\
  let exp = /ab+c/;\n```\n\n正则表达式字面量有助于正则表达式在脚本加载时被编译。如果一个正则表达式保持不变，使用正则表达式字面量可以提高性能。\n\
  \n## 调用 RegExp 对象的构造函数\n\n你通过使用关键字 `new`（在 `第 2 章：JavaScript 对象` 中已解释）来调用 `RegExp`\
  \ 对象的构造函数，例如：\n\n```javascript\nlet exp = new RegExp('‘ab+c’);\n```\n\n当你知道正则表达式模式可能会发生，或者你不知道模式并正在从其他来源获取它时，这种方法是最好的。\n\
  \n正则表达式模式可以由简单字符组成，例如 `/xyz/`，也可以由简单字符和特殊字符组合，例如 `/xy*z/` 或 `/Student Number (\\\
  d+)\\.\\d*/`。稍后我会详细介绍模式。现在，让我们来看正则表达式的修饰符。\n\n## 正则表达式修饰符/标志\n\n所有的正则表达式都可以包含影响搜索的修饰符或标志。`JavaScript`\
  \ 有 6 个标志，如下表所示：\n\n| 修饰符 | 描述 |\n| :--- | :--- |\n| `i` | 不区分大小写的搜索 |\n| `g` |\
  \ 搜索所有匹配项 |\n| `m` | 多行模式 |\n| `s` | 启用点全模式（dotall） |\n| `u` | 启用全 Unicode 支持 |\n\
  | `y` | 粘性模式（Sticky mode）。在精确位置搜索 |\n\n**表 17.1:** 正则表达式标志\n\n正则表达式显然有很多需要学习的，但我觉得我们可以做一个快速练习，将我们目前所学的内容整合在一起。\n\
  \n这个练习利用了上述标志和 `match` 方法（字符串函数在 `第 12 章：变量` 中介绍过）来使用正则表达式查找某些文本。\n\n1.  打开你选择的文本编辑器并输入以下\
  \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n    <h1>RegEx Example 1</h1>\n\
  \    <p>RegEx Example 1</p>\n    <script>\n        let str = “Ob-La-Di, ob-la-da”;\n\
  \        document.write( str.match(/Ob/gi) + “</br>” ;\n        let result = str.match(/La/i);\n\
  \        document.write( result[0] + “</br>”) ;\n        document.write( result.length\
  \ + “</br>”) ;\n        // Details:\n        document.write( result.index + “</br>”)\
  \ ;\n        document.write( result.input + “</br>”) ;\n        try {\n        \
  \    let matches = str.match(/JavaScript/);\n            if (!matches.length) {\n\
  \            }\n        } catch(err) {\n            document.write(“Error in the\
  \ line above”);\n        }\n    </script>\n</body>\n</html>\n```\n\n2.  用 HTML 扩展保存文件，例如\
  \ `Chapter 17.1.html`。\n3.  双击文件在默认浏览器中打开它。\n\n上述代码的输出显示如下所示：\n\n![](img/Img_17_01.jpg)\n\
  \n**图 17.1:** `string.match` 正则表达式\n\n我首先创建一个包含 `Ob-La-Di, ob-la-da` 的字符串。这是一首 1968\
  \ 年发行的披头士老歌，仍然是经典。无论如何，然后我使用了字符串的 `match` 方法来搜索术语 `Ob`。因为我提供了 `g` 和 `i` 修饰符，它忽略字符串中的大小写搜索了所有的\
  \ `Ob` 实例。\n\n接下来，我创建名为 `results` 的变量，它将是正则表达式搜索 `La` 的结果。注意我在这里没有包含 `g` 标志，所以只会找到第一个实例。它的索引是。最后，我包含了\
  \ `try` 和 `catch` 块来演示当没有匹配项时该做什么。\n\n## 正则表达式模式\n\n正则表达式模式可以由简单字符组成，例如 `/xyz/`，也可以由简单字符和特殊字符组合，例如\
  \ `/xy*z/` 或 `/Student Number (\\d+)\\.\\d*/`。以下是你可以使用的特殊字符列表：\n\n| 字符 | 描述 |\n\
  | :--- | :--- |\n| `\\` | 当反斜杠位于字符之前，表示该字符是特殊的且不进行解释 |\n| `^` | 匹配输入的开头 |\n| `$`\
  \ | 匹配输入的结尾 |\n| `*` | 匹配前面的表达式 0 次或多次 |\n| `+` | 匹配前面的表达式 1 次或多次 |\n| `?` | 匹配前面的表达式\
  \ 0 次或 1 次 |\n| `.` | 匹配除换行符以外的单个字符 |\n| `(x)` | 匹配 `x` 并记录结果 |\n| `(?:x)` | 匹配\
  \ `x` 但不记录结果 |\n| `x(?=y)` | 仅当 `x` 后面跟着 `y` 时匹配 `x` |\n| `x(?!y)` | 仅当 `x` 后面不是\
  \ `y` 时匹配 `x` |\n| `(?<=y)x` | 仅当 `x` 前面是 `y` 时匹配 `x` |\n| `(?<!y)x` | 仅当 `x` 前面不是\
  \ `y` 时匹配 `x` |\n| `x|y` | 匹配 `x` 或 `y`（当没有匹配到 `x` 时） |\n| `{n}` | 匹配表达式 `n` 次 |\n\
  | `{n,}` | 匹配前面的表达式至少 `n` 次 |\n| `{n,m}` | 匹配前面的表达式至少 `n` 次最多 `m` 次 |\n| `[xyz]`\
  \ | 匹配括号内的任意一个字符 |\n| `[^xyz]` | 匹配不在括号内的任意内容 |\n| `[\\b]` | 匹配退格符 |\n| `\\b` |\
  \ 匹配单词字符与非单词字符之间的边界 |\n| `\\B` | 匹配以下位置： |\n\n*   字符串第一个字符之前 |\n\n*   字符串最后一个字符之后\
  \ |\n\n*   两个单词字符之间 |\n\n*   两个非单词字符之间 |\n\n*   空字符串。 |\n| `\\cX` | 匹配字符串中的控制字符\
  \ |\n| `\\d` | 匹配数字字符 |\n| `\\D` | 匹配非数字字符 |\n| `\\f` | 匹配分页符 |\n\n\n\n\n\n| 模式\
  \ | 描述 |\n| --- | --- |\n| `\\n` | 匹配换行符 |\n| `\\r` | 匹配回车符 |\n| `\\s` | 匹配空白字符\
  \ |\n| `\\S` | 匹配非空白字符的字符 |\n| `\\t` | 匹配制表符 |\n| `\\v` | 匹配垂直制表符 |\n| `\\w` | 匹配任何字母数字字符\
  \ |\n| `\\W` | 匹配任何非单词字符 |\n| `\\0` | 匹配 NULL 字符 |\n| `\\xhh` | 匹配代码为 `hh` 的字符（两个十六进制数字）\
  \ |\n| `\\uhhhh` | 匹配代码为 `hhhh` 的字符（四个十六进制数字） |\n\n表 17.2: 特殊字符模式\n\n让我们来做个快速练习吧！\n\
  \n1. 打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html><body><h1>RegEx Example\
  \ 2</h1><p>RegEx Example 2</p><script>\nvar Num = /^\\d{10}$/;\nconsole.log(Num.test‘7795483645’));\n\
  var Dt = /^(\\d{1,2}-){2}\\d{2}(\\d{2})?$/;\nconsole.log(Dt.test‘01-01-1990’));\n\
  console.log(Dt.test‘01-01-90’));\nvar Txt = /^(.{3}\\.){3}.{3}$/;\nconsole.log(Txt.test‘abc.def.123.456’));\n\
  console.log(Txt.test‘abc.def.ghi.jkl’));\n</script></body></html>\n```\n\n2. 以 HTML\
  \ 扩展名保存文件，例如 `Chapter 17.2.html`。\n3. 双击该文件在默认浏览器中打开。\n4. 在 Google Chrome 中按 `Ctrl`\
  \ + `Shift` + `F12` 打开控制台窗口。\n\n这看起来非常复杂！其实其实不是。让我来拆解一下。\n\n* 变量 `Num` 包含一个正则表达式模式。\n\
  \    * 在此模式中，你通过在开头包含 `^` 在字符串结尾包含 `$` 来确保匹配跨越整个字符串。\n    * 表达式中的 `\\d` 匹配数字。\n\
  \    * `{10}` 精确匹配前一个表达式 10 次。\n* 变量 `Dt` 也以 `^` 开头并以 `$` 结尾，以便查看整个字符串。\n    * 第一个左括号开始第一个子表达式。\n\
  \    * `\\d{1,2}` 匹配 1 个数字，但最多可以有 2 个数字。\n    * 匹配一个连字符 `-`。\n    * 右括号结束第一个子表达式。\n\
  \    * `{2}` 将第一个子表达式匹配 2 次。\n* 变量 `Txt` 仅允许由四个三字母组组成的字符串输入，每组之间由点隔开。\n\n在每个表达式中，都使用了\
  \ `test` 方法。该方法将返回 `true` 或 `false`，取决于表达式是否匹配成功。\n\n结果如如下截图所示：\n\n![](img/Img_17_02.jpg)\n\
