  \n有三个国家：`America`、`India` 和 `South Africa`。每个国家在每个地方都有独特的 `Stops`数量。因此，当选择南非洲时，你有\
  \ 10、20 和 30 个站点的可选；而如果你选择印度，你将有 5、15 和 25 个站点。\n\n## 条件运算符 ‘？’\n\n在第 4 章：JavaScript\
  \ 运算符中，我介绍过三元运算符。三元运算符也称为条件运算符。该运算符之所以被称为三元，是因为它接受三个操作数才能运行。\n\n三元运算符接受的三个操作数是：\n\
  \n* 条件\n* 真表达式\n* 假表达式\n\n以下是其外观的一个小示例：\n\n`Condition ? Value if true : Value if\
  \ false`\n\n条件是进行测试的内容。当条件为真时，执行问号后面的代码；如果条件为假，则执行冒号后面的代码。\n\n让我们来看嵌套 `if` 语句的运行：\n\
  \n1. 打开你任用的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n\
  <h1>条件语句示例</h1>\n<p>条件语句示例</p>\n<script>\nvar studentAge = 19;\nvar greeting = (studentAge\
  \ < 18) ? “Not Allowed” : “Welcome!”;\ndocument.write(greeting);\n</script>\n</body>\n\
  </html>\n```\n\n2. 将文件以 HTML 扩展名保存，例如 `Chapter 13.8.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\
  \n变量 `studentAge` 的值被经过了测试，因此成为了条件。如果 `studentAge` 小于 `18`，则页面上将打印 `Not Allowed`；否则（正如当前情况，因为\
  \ `studentAge` 为 `19`），网页上将打印 `Welcome!`。\n\n## 总结\n\n在本章中，我们进行了大量的实操练习，演示了各种控制流语句的使用。你学习了脚本的大部分内容仅取决于需要测试的逻辑和条件。你看到了\
  \ `switch` 语句、`if` 语句与条件运算符之间的区别。\n\n在下一章中，我们将学习 JavaScript 中的各种循环。\n\n## 问题\n\n\
  1. 为什么你会使用 `switch` 语句而不是 `else…if` 语句？\n2. 什么是三元运算符？\n3. 为什么你会使用 `else` 子句？\n4.\
  \ 解释“条件”这一术语。\n\n# 第 14 章\n\n## 循环\n\n## 简介\n\n在任何编程环境或语言中，你都无法避免循环。JavaScript 拥有多种类型的循环，包括计数循环和条件循环。JavaScript\
  \ 还包含了提前退出循环或跳过迭代的功能。\n\n在本节中，你将学习 JavaScript 中存在哪些循环以及它们在语法和内部工作原理上的差异。你将进行大量的实践练习，因为通过实践学习总是更容易。\n\
  \n## 结构\n\n* JavaScript 循环\n* `for`\n* `for…in`\n* `for…of`\n* `while`\n* `do…while`\n\
  * 退出循环\n    * `break` 语句\n    * 带有标签的 `break`\n* `continue` 语句\n\n## 目标\n\n* 识别\
  \ JavaScript 中不同的循环。\n* 利用 `for` 循环执行固定次数。\n* 利用 `for…in` 循环遍历对象属性。\n* 利用 `for…of`\
  \ 循环遍历数组、字符串、Maps 和 NodeLists。\n* 利用 `while` 循环根据条件进行循环。\n* 学习如何退出循环。\n\n## JavaScript\
  \ 循环\n\n循环是重复的内容。在 JavaScript 中，有几种类型的循环可以使用来多次重复一段代码块。最常见的循环是 `for`、`for…in`、`for…of`、`while`\
  \ 和 `do…while`。\n\n循环是一种只要特定条件为真就会不断重复的结构。\n\n JavaScript 提供了以下循环：\n\n* `for`\n\
  * `for…in`\n* `for…of`\n* `while`\n* `do…while`\n\n`for` 循环是最常见的循环。当你知道想要循环执行代码块的次数时，可以使用它。`for`\
  \ 循环的语法为：\n\n`for (initialization; condition; increment/decrement)`\n\n`initialization`\
  \ 是设置循环变量的地方。`condition` 是每次迭代之前测试的内容。如果条件为真，则执行循环体。`increment/decrement` 是在每次迭代后更新循环变量的内容。\n\
  \n这是一个 `for` 循环的示例：\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n  document.write(i\
  \ + \"<br>\");\n}\n```\n\n在这个示例中，变量 `i` 被初始化为 `0`。每次迭代之前测试条件 `i < 10`。如果条件为真，则执行\
  \ `document.write(i)`。在每次迭代后，`i` 加 1。这会持续进行直到 `i` 不再小于 10。\n\n`while` 循环用于在你不知道想要循环执行代码块的次数，但知道应该停止循环的条件时。`while`\
  \ 循环的语法为：\n\n```javascript\nwhile (condition) {\n  // 要执行的代码\n}\n```\n\n`condition`\
  \ 在每次迭代之前测试。如果条件为真，则执行循环体。如果为假，则循环不运行。\n\n这是一个 `while` 循环的示例：\n\n```javascript\n\
  var i = 0;\nwhile (i < 10) {\n  document.write(i + \"<br>\");\n  i++;\n}\n```\n\n\
  在这个示例中，变量 `i` 被初始化为 `0`。每次迭代之前测试条件 `i < 10`。如果条件为真，则执行 `document.write(i)`。然后，`i`\
  \ 加 1。这会持续进行直到 `i` 不再小于 10。\n\n`do…while` 循环类似于 `while` 循环，但在测试条件之前，循环体至少会执行一次。`do…while`\
  \ 循环的语法为：\n\n```javascript\ndo {\n  // 要执行的代码\n} while (condition);\n```\n\n这是一个\
  \ `do…while` 循环的示例：\n\n```javascript\nvar i = 0;\ndo {\n  document.write(i + \"\
  <br>\");\n  i++;\n} while (i < 10);\n```\n\n在这个示例中，变量 `i` 被初始化为 `0`。代码体执行一次，打印 `0`。然后测试条件\
  \ `i < 10`。如果为真，循环再次运行。这会持续进行直到 `i` 不再小于 10。\n\n`for…in` 循环用于遍历对象的属性。`for…in` 循环的语法为：\n\
  \n```javascript\nfor (var property in object) {\n  // 要执行的代码\n}\n```\n\n这是一个 `for…in`\
  \ 循环的示例：\n\n```javascript\nvar person = {name: \"John\", age: 30, city: \"New York\"\
  };\nfor (var property in person) {\n  console.log(property + \": \" + person[property]);\n\
  }\n```\n\n`for…of` 循环用于遍历数组、字符串、Maps 和 NodeLists 的值。`for…of` 循环的语法为：\n\n```javascript\n\
  for (var value of iterable) {\n  // 要执行的代码\n}\n```\n\n这是一个 `for…of` 循环的示例：\n\n```javascript\n\
  var fruits = [\"apple\", \"banana\", \"cherry\"];\nfor (var fruit of fruits) {\n\
  \  console.log(fruit);\n}\n```\n\n有时你想提前退出循环或跳过迭代。对于这种情况，可以使用 `break` 和 `continue`\
  \ 语句。\n\n`break` 语句用于跳出循环。\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n  if\
  \ (i === 5) {\n    break;\n  }\n  document.write(i + \"<br>\");\n}\n```\n\n`continue`\
  \ 语句用于跳过当前迭代并移动到下一个。\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n  if (i ===\
  \ 5) {\n    continue;\n  }\n  document.write(i + \"<br>\");\n}\n```\n\n你也可以配合标签使用\
  \ `break` 和 `continue` 来跳出嵌套循环。\n\n```javascript\nouterLoop:\nfor (var i = 0; i\
  \ < 10; i++) {\n  for (var j = 0; j < 10; j++) {\n    if (i === 2 && j === 2) {\n\
  \      break outerLoop;\n    }\n    document.write(i + \", \" + j + \"<br>\");\n\
  \  }\n}\n```\n\n\n\n\n3. 双击文件在默认浏览器中打开它。\n\n`for` 循环从 `9` 开始。然后你进行测试以确保 `i` 大于 `-1`，最后循环使用递减运算符进行递减。运算符在`第\
  \ 4 章：JavaScript 运算符`中讨论过。最终结果如下一个截图所示：\n\n![](img/Img_14_02.jpg)\n\n**图 14.2：**\
  \ 逆向 for 循环\n\n`for` 循环也经常与数组结合使用。数组将在`第 16 章：数组`中进行讨论，所以稍后会进行详细介绍。`for` 循环有几种变体，让我们检查一下它们。\n\
  \n## for…in\n\n`for…in` 语句遍历对象的属性。它的语法如下：\n\n```\nfor (variable in object)\n{\n\
  \  Statement(s)\n}\n```\n\n如你所见，这个 `for` 循环与我们之前讨论的完全不同。在此语境中，变量是当前属性的临时占位符。在此语文中，对象是被遍历的那个对象。让我们做一个小练习。\n\
  \n这是一个更实用的例子。下一个示例展示了 `for…in` 循环的运行。\n\n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n```html\n<!doctype html>\n<body>\n  <h1>for…in loop example</h1>\n  <p>for…in\
  \ loop example</p>\n  <script>\n    var student = {studentName: “Ockert”, studentSubject:\
  \ “JavaScript”, studentAge: 41};\n    var output = “”;\n    var stu;\n    for (stu\
  \ in student)\n    {\n      output += student[stu] + “</br>”;\n      document.write(“<b>”\
  \ + ‘${stu}’ + “</b> = “ + ‘${student[stu]}’ + “</br>”);\n    }\n    document.write(“<p>”\
  \ + output);\n  </script>\n</body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter\
  \ 14.3.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\n这个练习合二为一。让我们拆解一下：创建一个名为 `student` 的对象。它的属性包括\
  \ `studentName`、`studentSubject` 和 `studentAge`。我们创建了两个名为 `output` 和 `stu` 的变量。然后开始\
  \ `for…in` 循环。`stu` 变量作为 `student` 对象内部属性的占位符。此循环将运行三次，因为学生对象有三个属性。`output` 变量会被加上当前属性的值。`+=`\
  \ 运算符表示将新值加到现有值，正如`第 4 章：JavaScript 运算符`中所解释的那样。下一行使用反引号加粗写入属性名及其设置，正如`第 12 章：变量`中所解释的那样。最后，`output`\
  \ 变量的值也会写入页面。\n\n最终输出如`图 14.3`：\n\n![](img/Img_14_03.jpg)\n\n**图 14.3：** for…in\
  \ 循环\n\n我想讨论的下一个也是最后一个 `for` 语句是 `for…of` 语句。\n\n## for…of\n\n`for…of` 循环遍历可迭代数据结构，如数组、字符串、NodeLists\
  \ 和 Maps。它的语法如下：\n\n```\nfor (variable of iterable)\n{\n  Statement(s)\n}\n```\n\
  \n它看起来与 `for…in` 循环相似，不同在于它遍历的是内容。它遍历一个可迭代对象。在`第 10 章：JavaScript 生成器和迭代器`中你已经学习过迭代对象是可以重复的东西，因此在这种情况下，变量会遍历迭代对象的每个部分直到完成。为了给出更好的解释，让我们做一个练习！\n\
  \n下一个示例展示了 `for…of` 循环的运行。\n\n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
  <!doctype html>\n<body>\n  <h1>for…of loop example</h1>\n  <p>for…of loop example</p>\n\
  \  <script>\n    var subject = ‘JavaScript’;\n    var s;\n    for (s of subject)\n\
  \    {\n      document.write(s + “<br >”);\n    }\n  </script>\n</body>\n</</html>\n\
  ```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 14.4.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\n首先，创建一个名为\
  \ `subject` 的变量并赋值为 `JavaScript`。创建另一个名为 `s` 的变量。开始 `for…of` 循环。变量 `s` 等于存储在 `subject`\
  \ 变量中的字符串 `JavaScript` 中的一个字符。它被写入页面，如`图 14.4`所示：\n\n![](img/Img_14_04.jpg)\n\n\
  **图 14.4：** for…of 循环运行\n\n让我们再做另一个例子。这个例子将遍历数组，数组将在`第 16 章：数组`中更详细地介绍。\n\n下一个示例展示了\
  \ `for…of` 循环遍历数组。\n\n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype\
  \ html>\n<body>\n  <h1>for…of loop example</h1>\n  <p>for…of loop example</p>\n\
  \  <script>\n    var arraySubjects = [‘JavaScript’, ‘HTML’, ‘CSS’, ‘PHP’, ‘jQuery’];\n\
  \    var sub;\n    for (sub of arraySubjects) {\n      document.write(sub + “<br\
  \ >”);\n    }\n  </script>\n</body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter\
  \ 14.5.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\n`arraySubjects` 是我们 true 数组。数组存储了多个值，所以从某种意义上说，数组是一组同名的变量。该数组提供了五个字符串，现在这五个字符串都存储在一个地方，即数组中。\n\
  \n创建了一个变量 `sub`。与 `for…in` 示例以及上一个 `for…of` 示例一样，该变量将用于获取数组（或值组）中的当前值。然后，我们只需简单地将该值写入页面，如`图\
  \ 14.5`所示：\n\n![](img/Img_14_05.jpg)\n\n**图 14.5：** 遍历数组的 for…of 循环\n\n让我们条件循环。\n\
  \n## while\n\n`while` 循环只要给定条件为真就会执行代码块。它的语法如下：\n\n```\nwhile (condition)\n{\n \
  \ Statement(s)\n}\n```\n\n这很简单。条件可以是测试一个值是否为假，或者例如一个数值是否小于 100。只要条件存在，语句就会重复。这被称为条件循环，因为与\
  \ `for` 循环指定起始和结束参数不同，在 `while` 循环中，你可能不知道它将执行几次。\n\n让我们做一个真正的例子。\n\n下一个示例展示了条件循环的威力：\n\
  \n1. 打开你喜欢的任何文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n\
  \  <h1>while loop example</h1>\n  <p>while loop example</p>\n  <script>\n    let\
  \ total = 0;\n    while (total < 100) {\n      let newVal = + prompt(“Enter a number”,\
  \ ‘’);\n      total += newVal;\n    }\n    alert( ‘Total: ‘ + total );\n  </script>\n\
  </body>\n</</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 14.6.html`。\n\n3. 双击文件在默认浏览器中打开它。\n\
  \n在上面的练习中，你创建了一个名为 `total` 的变量并赋值为 `0`。`while` 循环检查 `total` 变量是否小于 `100`。这意味着如果\
  \ `total` 变量变为 100 或更多，循环应该退出。\n\n在循环内部，另一个名为 `newVal` 的变量接收提示框中输入的任何值，然后这个值会被加到\
  \ `total` 变量上。\n\n这里非常重要的一点是，测试的是变量 `total` 的值，如果值在循环某处没有发生变化，循环将是无限循环且永远不会结束，例如\
  \ total 永远不会变成 100 或更多。\n\n\n\n\n打开此页面时，你将看到一个类似于图 14.6 的框，你可以在其中输入数字。现在，你可以每次输入\
  \ `1`，它会不断累加 `1` 直到达到 `100`。或者你可以输入 `50` 和 `50`，甚至直接输入 `100`。\n\n如果你每次都 `1`，它将循环\
  \ `100` 次；如果你再次输入 `50` 和 `50`，它将循环两次；如果你立即输入 `100`，它将只循环一次。要测试这一点，在达到 `100` 后刷新页面，并尝试不同的数字组合：\n\
  \n![](img/Img_14_06.jpg)\n\n**图 14.6：** 运行中的 while 循环\n\n`do…while` 循环（我将在下文中介绍）与\
  \ `while` 循环几乎相同，让我们来看一下：\n\n## do…while\n\n`do…while` 循环也是一种条件循环，就像你之前做的 `while`\
  \ 循环一样。它们只有一个主要区别：在 `while` 循环中，条件是在循环开始时测试的，而在 `do…while` 循环中，条件是在循环结束测试的。这意味着循环将至少执行一次。它的语法如下：\n\
  \n```\ndo\n{\n  Statement(s)\n} while (condition);\n```\n\n下一个示例演示了 `do…while` 循环。\n\
  \n1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n\
  <h1>while 循环示例</h1>\n<p>while 循环示例</p>\n<script>\n  let i = 0; // 更改为 6\n  do\n\
  \  {\n    i += 1;\n    document.write(i);\n  } while (i < 5);\n</script>\n</body>\n\
  </html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 14.7.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\
  \n这段代码在运行时将简单地在页面上输出 `12345`。现在由于条件是在循环结束时评估的，这可能会带来麻烦。例如，如果你在循环之前将 `1` 的值改为 `6`\
  \ 而不是 `0`，循环仍然会执行一次并产生 `7`。\n\n## 退出循环\n\n有时你可能提前退出循环。在这种情况下，你应该使用 `break` 语句。你有两种方法在循环中使用\
  \ `break` 语句：\n\n* `break`\n* 带有标签的 `break`\n\n让我们看看它们是如何工作的。\n\n## break\n\n你可以通过在想要退出的地方包含\
  \ `break` 语句来退出循环。这通常基于一个已变为真的条件。\n\n下一个示例演示了如何提前退出循环。\n\n1. 打开你选择的文本编辑器，并输入以下 HTML\
  \ 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>使用 break 退出循环的示例</h1>\n\
  <p>使用 break 退出循环的示例</p>\n<script>\n  var num = \"\";\n  var i = 0;\n  while (i <\
  \ 5)\n  {\n    num += \"<br>当前数字: \" + i;\n    i++;\n    if (i === 3)\n    {\n \
  \     break;\n    }\n  }\n  document.write(num);\n</script>\n</body>\n</html>\n\
  ```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 14.8.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n循环本应该从\
  \ 0 循环到 5，但 `if` 语句测试了 `i` 是否为 `3`。如果是，循环应该通过 `break` 语句退出。图 14.7 显示了未完成的循环。\n\n\
  ![](img/Img_14_07.jpg)\n\n**图 14.7：** 循环提前退出\n\n让我们增加一个花样。\n\n## 带有标签的 break\n\n\
  正如你所看到的，`break` 语句会导致循环提前退出。你可以通过包含一个标签并跳转到该标签来指定开始执行代码的位置。你只需要添加一个带标签的语句，并在之后添加代码即可。\n\
  \n让我们来看一个例子。\n\n下一个示例演示了如何使用标签提前退出循环。\n\n1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>使用 break 退出循环的示例</h1>\n<p>使用 break\
  \ 退出循环的示例</p>\n<script>\n  let i = 0;\n  let j = 0;\n  Repeat: while (true)\n  {\n\
  \    document.write('外层: ' + i + '<br>');\n    i++;\n    j = 1;\n    while (true)\n\
  \    {\n      document.write('内层: ' + j + '<br>');\n      j++;\n      if (i ===\
  \ 5 && j === 5)\n      {\n        break Repeat;\n      }\n      else if (j === 5)\n\
  \      {\n        break;\n      }\n    }\n  }\n</script>\n</body>\n</html>\n```\n\
  （注：原文中关于 `break with label` 的部分文本有些杂乱，我已根据提供的代码字符串重构了逻辑。）\n\n\n\n\n*   了解如何在 JavaScript\
  \ 中使用注释。\n\n## 调试\n\n给我看一个没有任何错误的脚本，我就给你看“尼湖湖水怪”。虽然在浏览网站时，它看起来似乎是完美的，而且从任何意义上来说，它确实如此，但它曾经存在大量的错误，也许现在可能仍然存在。错误会发生。失误也会发生。这是编程的一部分。然而，技巧之处在于你如何处理它们。\n\
  \nJavaScript 中主要有两种类型的错误；它们是：\n\n*   **语法错误 (Syntax errors)**：语法错误发生在输入代码时。当人打字速度很快时，他或她并不总是能立即发现错误。这些错误可能很难找到，除非你手头有一个调试工具，否则你可能需要逐行扫描代码。\n\
  \n*   **逻辑错误 (Logical errors)**：逻辑错误让开发者陷入噩梦。这些错误通常发生在你预期某个结果但实际发生了不同情况时。例如：假设你想把背景变成蓝色，并编写了相关代码，但背景最终变成了红色。这就是逻辑错误。\n\
  \n*   **运行时错误 (Runtime errors)**：运行时错误发生在用户正在使用页面时。假设用户输入了错误信息或提供了格式错误的信息。这些都是运行时错误，你应该能够处理它们。\n\
  \n为了修复这些任何一类型的错误，你需要工具。记住，JavaScript 并没有一个带有调试工具和功能的全功能 `IDE`（集成开发环境），因此可用的选项并不多。\n\
  \n## JavaScript 调试语言特性\n\nJavaScript 语言包含两个调试特性；它们是：\n\n*   控制台窗口 (the console window)\n\
  *   `debugger` 关键字\n\n让我们进入更多细节。\n\n## 控制台窗口\n\n控制台窗口比你想象的要强大得多！你不仅可以向它输出重要内容，还可以对某些过程计时，查看它们需要多长时间。这可能是一个长循环或复杂的语句。毕竟，速度在\
  \ Web 应用中至关重要。\n\n## console.log\n\n`console.log` 函数的功能是将信息输出到浏览器的控制台窗口。在目前为止的所有课程中，我一直在控制台窗口演示各种代码输出，但以防你忘记，让我们来做一个小练习，演示\
  \ `console.log()` 的用法。\n\n*   打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n    ```html\n\
  \    <html>\n    <body>\n    <h1>console.log Output</h1>\n    <p>The following code\
  \ demonstrates the use of console.log</p>\n    <script>\n    console.log(“I love\
  \ JavaScript”);\n    var myObj = { firstname : “Ockert”, lastname : “du Preez” };\n\
  \    console.log(myObj);\n    var myArr = [“JavaScript”, “CSS”, “HTML5”, “jQuery”\
  \ ];\n    console.log(myArr);\n    </script>\n    </body>\n    </html>\n    ```\n\
  \n*   用 HTML 扩展名保存文件，例如 `Chapter 15.1.html`。\n*   双击该文件在默认浏览器中打开它。\n*   在 Google\
  \ Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\n当控制台窗口打开时，你将看到被写入其中的三个不同类型的内容。首先是字符串：`I\
  \ love JavaScript!`，然后是显示我名字和姓氏的对象。最后，数组的内容也被打印出来。*图 15.1** 显示了结果：\n\n![](img/Img_15_01.jpg)\n\
  \n**图 15.1：** console.log\n\n控制台窗口的另一个有用功能是 `console.time` 关键字。\n\n## console.time\
  \ 和 console.timeEnd 关键字\n\n有时你需要确保代码在每个浏览器上运行得足够快。为此，你可以使用 `console` 对象的 `time()`\
  \ 和 `timeEnd` 方法分别启动和停止内置计时器。让我们来快速快速练习！\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n    ```html\n    <html>\n    <body>\n    <h1>console timing features</h1>\n\
  \    <p>The following code demonstrates the use of console.time and console.timeEnd</p>\n\
  \    <script>\n    console.time(‘Timer1’);\n    var items = [];\n    for(var i =\
  \ 0; i < 500000; i++){\n    items.push({index: i});\n    }\n    console.timeEnd(‘Timer1’);\n\
  \    </script>\n    </body>\n    </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter\
  \ 15.2.html`。\n3.  双击该文件在默认浏览器中打开它。\n4.  在 Google Chrome 中按 `Ctrl` + `Shift` + `J`\
  \ 或 `F12` 打开控制台窗口。\n\n我得到的输出显示在*图 15.2*中：\n\n![](img/Img_15_02.jpg)\n\n**图 15.2：**\
  \ console timing features\n\n控制台告诉我们，完成 `for` 循环的所有迭代耗时 `114` 毫秒。你指定了计时器应该在哪里开始，在哪里结束。\n\
  \n## 更多 console 方法\n\n`console` 对象包含了许多其他方法来帮助调试。它们列在下表中：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `assert()` | 如果断言为假，则向控制台写入错误消息 |\n| `clear()` | 清空控制台 |\n| `count()`\
  \ | 记录 count() 函数被调用的次数 |\n| `error()` | 向控制台输出错误消息 |\n| `group()` | 在控制台中创建一个新的内联分组\
  \ |\n| `groupCollapsed()` | 在控制台中创建一个新的折叠内联分组 |\n| `groupEnd()` | 退出控制台中的当前内联分组\
  \ |\n| `info()` | 向控制台输出信息消息 |\n| `table()` | 将表格数据显示为表格 |\n| `trace()` | 向控制台输出堆栈跟踪\
  \ |\n| `warn()` | 向控制台输出警告消息 |\n\n**表 15.1：** 控制台方法\n\n让我们来做一个练习！\n\n还有几个 console\
  \ 方法，下一个练习将演示：\n\n1.  打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n    ```html\n  \
  \  <html>\n    <body>\n    <h1> more console methods</h1>\n    <p>The following\
  \ code demonstrates the use of console methods</p>\n    <script>\n    var myObj\
  \ = { firstname : “Ockert”, lastname : “du Preez” };\n    console.assert(document.getElementById(“demo”),\
  \ myObj);\n    console.clear();\n    for (i = 0; i < 10; i++) {\n    console.count();\n\
  \    }\n    console.error(“I am a mistake!”);\n    console.log(“Hello world!` `-\
  \ Normal”);\n    console.group();\n    console.log(“Hello again!` `- Inside a group”);\n\
  \    console.info(“I love JavaScript!”);\n    function myFunction() {\n    anotherFunction();\n\
  \    }\n    function anotherFunction() {\n    console.trace();\n    }\n    console.warn(“This\
  \ is a warning!”);\n    console.table([“JavaScript”, “HTML5”, “CSS”]);\n    </script>\n\
  \    </body>\n    </html>\n    ```\n\n2.  用 HTML 扩展名保存文件，例如 `Chapter 15.3.html`。\n\
  3.  双击该文件在默认浏览器中打开它。\n4.  在 Google Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\
  \n上述代码的输出如下方的所示：\n\n![](img/Img_15_03.jpg)\n\n**图 15.3：** 更多 console 方法\n\n如所见，控制台比想象的要强大得多。通过使用\
  \ `assert`、`warn` 和 `error` 方法，你可以快速检查错误，通过分组和表格方法，你可以组织数据的输出。\n\n接下来的 JavaScript\
  \ 调试语言特性是 `debugger` 关键字，将在后面解释。\n\n\n\n\n接下来的这个小练习演示了 `debugger` 关键字的使用：\n\n1.\
  \  打开你任选的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n<h1>debugger\
  \ 语句</h1>\n<p>以下代码演示了 debugger 语句的使用</p>\n<script>\nvar x = 30 * 5;\ndebugger;\n\
  document.getElementbyId(“Answer”).innerHTML = x;\n</script>\n</body>\n</html>\n\
  ```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 15.4.html`。\n\n3.  双击该文件在默认浏览器中打开它。\n4.  在\
  \ Google Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\n屏幕将显示暂停的浏览器窗口：\n\n\
  ![](img/Img_15_04.jpg)\n\n**图 15.4：** 调试器中暂停的代码\n\n如你所见，在调试模式下，屏幕会变成灰色并高亮 debugger\
  \ 所在的行。此外，注意浏览器窗口中的黄色黄色窗口。它显示代码已在调试器中暂停，并提供了两个按钮。Resume execution（恢复执行）将继续执行代码，直到遇到下一个断点（如果有的话）。Step\
  \ over the next function（单步下一个函数）将进入下一行（在本例中）。如果按下 `Resume`，下一行将显示为错误，因为文档中不存在 `Answer`\
  \ 字段。\n\n让我们看看如何处理运行时错误。\n\n# try 和 catch 块 #toc.xhtml_s243a\n\n`try…catch` 语句处理运行代码时可能发生的错误。你将可能出错的代码放在\
  \ `try` 块中，调试器会尝试执行它。如果发生错误，`catch` 块中的代码将触发。这可以防止页面崩溃以及浏览器产生错误。\n\n你可以选择性在 `catch`\
  \ 块之后添加一个 `finally` 语句，它无论是否发生错误都会执行。\n\n下一个练习演示了 `try…catch` 语句的使用。\n\n1.  打开你任选的文本编辑器，并输入以下\
  \ HTML 和 JavaScript 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>try and\
  \ catch</p>\n<p>请输入一个 15 到 20 之间的数字：</p>\n<input id=”userInput” type=”text\">\n\
  <button type=”button” onclick=”Check()\">测试输入</button>\n<p id=”output”></p>\n<script>\n\
  function Check() {\n  var message, x;\n  message = document.getElementById(“output”);\n\
  \  message.innerHTML = “”;\n  x = document.getElementById(“userInput”).value;\n\
  \  try {\n    if(x == “”) throw “is Empty”;\n    if(isNaN(x)) throw “not a number”;\n\
  \    if(x > 20) throw “too high”;\n    if(x < 15) throw “too low”;\n  }\n  catch(err)\
  \ {\n    message.innerHTML = “Input “ + err;\n  }\n}\n</script>\n</body>\n</html>\n\
  ```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 15.5.html`。\n\n3.  双击该文件在默认浏览器中打开它。\n4.  在\
  \ Google Chrome 中按 `Ctrl` + `Shift` + `J` 或 `F12` 打开控制台窗口。\n\n输出示例所示：\n\n![](img/Img_15_05.jpg)\n\
  \n**图 15.5：** try and catch 示例\n\n`try` 块用于确定用户输入到 `userInput` 字段的内容。如果数字在 `15`\
  \ 到 `20` 之间，什么都不会发生；换句话说，不会产生错误。然而，如果没有输入值、输入单词而不是数字、或者值大于 `20`（如 `Figure 15.5`所示），或值小于\
  \ `15`，将抛出错误并在 `catch` 块内部处理。\n\n# 编码风格 #toc.xhtml_s244a\n\n每种编程语言都有一套开发者应该遵循的不成文规则。好吧，并非完全不成文，而是一些被遵循的规则，你可以称之为标准，以提高代码的可读性。这是必要的，因为脚本可能会变得非常非常长，你很快就会在大量糟糕的变量和对象名称以及混乱的条件语句和循环中迷失。\n\
  \n# 变量和对象名称 #toc.xhtml_s245a\n\n变量命名主要有两种规范，即：驼峰命名法（camel case）和帕斯命名法（pascal case）。它们在大写方式上有所不同，如下：\n\
  \n* `camelCase`\n* `PascalCase`\n\n在本书中，我尽量保持 `camelCase` 命名规范。\n\n使用大写的全局变量也很常见。\n\
  \n变量名可以包含字母、数字、美元符号和下划线。以下是几个例子：\n\n`full_Name`\n`student1`\n`student_Name$`\n\n\
  但记住，你应该在整个脚本始终保持相同的命名规范。变量在 `第 12 章：变量` 中已经讨论过。\n\n# 运算符和缩进 #toc.xhtml_s246a\n\n\
  运算符的通用规则是在所有操作数之间始终保持空格格。比较以下内容：\n\n`Result=varibale1+variable2`\n\n对比\n\n`Result\
  \ = varibale1 + variable2`\n\n空格让代码更易读。运算符在 `第 4 章：JavaScript 运算符` 中讨论过。\n\n说到空格，当你在代码中使用控制流语句\
  \ `第 13 章：控制流语句` 或使用函数 `第 5 章：JavaScript 函数` 时，你绝对应该利用空格来提高代码流。比较以下代码段：\n\n```javascript\n\
  var time = new Date().getHours();\nif (time < 12) {\n  greeting = “morning”;\n}\
  \ else if (time < 18) {\n  greeting = “afternoon”;\n} else {\n  greeting = “evening”;\n\
  }\n```\n\n对比\n\n```javascript\nvar time = new Date().getHours();\nif (time < 12)\
  \ {greeting =“morning”;}else if (time < 18) {greeting =“afternoon”;}else {greeting\
  \ =“evening”;}\n```（注：根据文本上下文重构）\n\n带有空格的部分要易读得多。这可能是一个非常简单的例子，但当嵌套控制流语句时，你会感到困惑。\n\
  \n# 对象规则 #toc.xhtml_s247a\n\n`第 2 章：对象` 定义的常见做法如下：\n\n* 左括号应放在与对象名称同一行。\n* 在属性名和值之间使用冒号和一个空格。\n\
  * 仅对字符串值使用引号，除非数值应该是字符串。\n* 最后一个属性-值对之后不需要逗号。\n* 右括号应放在新行，且没有领先空格。\n* 用分号结束对象定义。\n\
  \n这是一个使用了所有规则的小示例：\n\n```javascript\nvar student = {\n  firstName: “Ockert”,\n \
  \ lastName: “du Pz”,\n  age: 41,\n  course: “JavaScript”\n};\n```\n\n很容易看出对象由什么组成。\n\
  \n# 注释 #toc.xhtml_s248a\n\n注释用于描述代码正在做什么。相信我，在太晚之前你不会这有多重要。想象你在解决一个复杂的问题，过了一段时间你解决了。进一步想象你没有添加注释来描述代码，并在\
  \ 6 个月后回到代码处进行更新。记住你做了什么以及在哪里做的可能极其困难。\n\n另一个需要记住的事实是，你可能在团队环境中工作。注释可以帮助理解理解团队成员的代码，反之亦然。\n\
  \n注释有两种类型：\n\n* 单行注释\n* 多行注释\n\n让我们仔细观察。\n\n# 单行注释 #toc.xhtml_s249a\n\n单行注释可以放在一行的任何位置，例如：\n\
  \n```javascript\nvar objstudent; //在此处声明学生对象\n```\n\n在上述代码中，注释以两个斜杠开头，并放在对象声明之后。\n\
  \n# 多行注释 #toc.xhtml_s250a\n\n多行注释可以跨多行，例如：\n\n```javascript\n/*这个条件语句测试时间\n显示的结果取决于一天中的时间*/\n\
  ```\n\n\n\n`创建者：OJ du Preez`\n\n`2019 */`\n\n```javascript\nvar time = new Date().getHours();\n\
  if (time < 12) {\n  greeting = “Good morning”;\n}\nelse if (time < 18) {\n  greeting\
  \ = “Good afternoon”;\n}\nelse {\n  greeting = “Good evening”;\n}\ndocument.write(greeting);\n\
  ```\n\n正杠和星号之间的代码描述了代码的功能以及开发者。\n\n注释不会显示在网页上；它们仅用于信息提示。\n\n## 结论\n\n这是*高效使用 JavaScript*（Using\
  \ JavaScript Productively）章节的最后一章。在本章中，我们学习了编写良好代码以及利用所有可用调试和编码工具的重要性。代码结构越良好，导航和调试就越易如反。\n\
  \n在下一章中，我们将开启*高级概念*（Advanced Concepts）章节，并将涵盖 JavaScript 中的数组。虽然你可能已经见过这个术语，甚至在书中的代码中使用过它们，但你并不了解所有的复杂细节以及如何高效地使用它们。这就是你接下来要做的。\n\
  \n## 问题\n\n1. 写出 JavaScript 中两种最常见的错误类型\n2. `console.time` 和 `console.timeEnd` 关键字的作用是什么？\n\
  3. 如何在调试器中暂停代码？\n4. 为什么需要使用 `try…catch`？\n5. 写出 JavaScript 中的两种注释类型。\n\n# 第四部分\n\
  \n## 高级概念\n\n## 引言\n\n第 4 节探索了 JavaScript 的一些高级概念。第 16 章涉及数组。你将学习如何高效地创建和使用数组。第\
  \ 17 章探索了正则表达式的世界，并演示了搜索字符串中的文本以及限制文本输入有多简单。第 18 章将函数向前迈进了一大步，解释了部分应用和柯里化等函数编程概念。\n\
  \n本节包含：\n\n1. 数组\n2. 正则表达式\n3. 部分应用与柯里化。\n\n# 第 16 章\n\n## JavaScript 数组\n\n## 引言\n\
  \n数组让你能够在命名的容器内存储多个值。你通过使用数组的索引来访问数组元素。\n\n在本节中，你将学习如何向数组中添加和删除元素，如何访问项目以及如何遍历数组。\n\
  \n## 结构\n\n*   数组\n    * 创建数组\n        * 向数组中添加项目\n        * 从数组中删除项目\n    * 多维数组\n\
  \n## 目标\n\n* 理解数组是什么以及你可以用它们做什么。\n* 了解向数组中添加元素的各种方式。\n* 了解从数组中删除项目的各种方式。\n* 了解什么是多维数组。\n\
  \n## 数组\n\n在某些情况下，普通的对象是不够的。如果我有一组想要存储的信息（例如结果）怎么办？在这种情况下，一个对象无法存储多个值。数组是一个组织良好的值列表。你可能记得我在书中到为止已经多次提到过这个术语，但我从未详细地解释过它。\n\
  \n## 创建数组\n\n创建数组本质上有两种方法：\n\n* `let arr = new Array();`\n* `let arr = [];`\n\n\
  虽然后者更受青睐，但我将从实践角度解释两种方法。\n\n## 方法 1\n\n第一种方法利用 `Array` 关键字来创建数组。有一种简单的方法和一种困难的方法，正如你很快将在接下来的练习中看到的：\n\
  \n1. 打开你任选的文本编辑器，并输入以下 HTML 和：\n\n```javascript\nvar time = new Date().getHours();\n\
  if (time < 12) {\n  greeting = “Good morning”;\n}\nelse if (time < 18) {\n  greeting\
  \ = “Good afternoon”;\n}\nelse {\n  greeting = “Good evening”;\n}\ndocument.write(greeting);\n\
  ```\n\n\n\n控制台窗口显示了 `Sachin` 和 `CSS`，如预期所示。尝试操作其他元素，不要害怕在初始数组中添加更多元素。\n\n数组的妙之处在于，你可以通过向其添加或删除元素来操作它的元素。你还可以在特定位置插入元素并从特定位置删除元素。\n\
  \n# 向数组中添加项 (#toc.xhtml_s261a)\n\n数组在向其添加项时，功能性强大得令人惊讶。你可以将元素添加到数组的开头、末尾或数组的中间。\n\
  \n### 使用 push 向数组的末尾添加项\n\n为了向数组的末尾添加元素，你需要使用 `push` 方法，如下所示：\n\n```javascript\n\
  let arrStudents = [“Ockert”, “Sachin”, “Shoaib”]; //Easy\narrStudents.push(“John”);\n\
  ```\nJohn 被添加到数组的末尾\n\n### 使用 unshift 向数组的开头添加项\n\n利用 `unshift` 向数组的开头添加项。这里有一个小示例：\n\
  \n```javascript\nlet arrStudents = [“Ockert”, “Sachin”, “Shoaib”];\narrStudents.unshift(“Sam”);\n\
  ```\nSam 现在位于开头。\n\n### 使用 splice 向数组的中间添加项\n\n要向数组的中间（或开头、结尾以外的任何地方）添加项，你需要使用 `splice`\
  \ `array` 方法。如下所示：\n\n```javascript\nlet arrStudents = [“Ockert”, “Sachin”, “Shoaib”];\n\
  arrStudents.splice(2, 0, “Peter”);\n```\n在这里 `Peter` 被放置在数组的第三位置。`splice` 方法的一点是，你也可以删除项，但在这种情况下你提供了\
  \ `0`，因为你不想删除项，你只是想插入。\n\n为了将所有的添加方法整合在一起，让我们来快速做个练习：\n\n1.  打开你喜欢的文本编辑器，并输入以下 HTML\
  \ 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n<h1>Adding Array elements</h1>\n\
  <p>Adding Array elements</p>\n<script>\nlet arrStudents = [“Ockert”, “Sachin”, “Shoaib”];\n\
  console.log(arrStudents);\narrStudents.push(“John”);\nconsole.log(arrStudents);\n\
  arrStudents.unshift(“Sam”);\nconsole.log(arrStudents);\narrStudents.splice(2, 0,\
  \ “Peter”);\nconsole.log(arrStudents);\n</script>\n</body>\n</html>\n```\n\n2. \
  \ 用 HTML 扩展保存文件，例如 `Chapter 16.4.html`。\n3.  双击文件在默认浏览器中打开。\n4.  在 Google Chrome\
