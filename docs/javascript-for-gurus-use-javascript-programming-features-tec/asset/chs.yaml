  \nmyCar = new Car(“BMW”, “i8 Roadster”);\n\n\n\n\n* 单独使用\n* 在严格模式下的函数中\n\n\n\nvar\
  \ Student = {\n  lastName : “du Preez”,\n  score : 85,\n    return this.firstName\
  \ + “ wrote “ + this.subject + “ and got “ + this.score + “%”;\n};\n\n\n\n\n\nvar\
  \ objWindow = this; //returns [object window]\n\n\n\nfunction mainWindow() {\n}\n\
  \n\n\n“use strict”;\n  return this; //returns undefined\n```\n### In an event\n\
  当 `this` 在事件中使用时，`this` 指向接收事件的 HTML 元素：\n```html\nClick Me!\n```\n### Conclusion\n\
  在本章中，我们探索了 JavaScript 中的对象。我们学习了各种对象创建技术：`new` 关键字、用户定义构造函数、对象构造、ES6 类，然后学习了 `Object.create()`\
  \ 和 `Object.assign()` 方法。最后，我们学习了 `this` 关键字的不同实现方式。\n在下一章中，我们将学习 JavaScript 语句（它们是什么以及如何构造）和\
  \ JavaScript 关键字。\n### Questions\n1. `Object.create()` 和 `Object.assign()` 方法的区别是什么？\n\
  3. 什么是用户定义的构造函数？\n5. 解释参数（parameter）。\n# 第 3 章\n## JavaScript Statements\n## Introduction\n\
  没有语句，就不会有程序。语句是发送给解释器或编译器的指令。你组合语句的方式对于整个脚本的成功至关重要。是的，这听起来有点极端，但如果你使用没有空格或换行的粗糙代码，它很快就会变得混乱。\n\
  在本节中，你将学习 JavaScript 语句是什么，以及为了可读性和理解性组合它们有多重要。\n## Structure\n本章涵盖的主题有：\n* 语句结构\n\
  * 空格和换行\n\n\n* 学习如何创建 JavaScript 语句\n* 学习空格和换行\n\n\n\n\nvar objWidth, objHeight;\n\
  objHeight = 100;\ndocument.getElementById(“displaySizeLabel”).innerHTML = size;\
  \ /*显示屏幕尺寸*/\n\n\nJavaScript 语句应该以分号（`;`）结束。你也可以在一行中包含多个语句，只要它们之间用分号隔开，如下例所示：\n\
  ```\n```\n通过用分号隔开，三个语句被合并了一行。\n## JavaScript 代码块\n代码块将语句组合在一起。因为语句被分组在代码块内部，它们会被一起执行。在代码块中组合语句的常用方法是使用函数。JavaScript\
  \ 函数的格式如下：\n```javascript\n//statement_1;\n//statement_3;\n```\n函数以关键字 `function`\
  \ 开始。左括号和右括号允许你为函数输入参数。代码块存在于函数的左右大括号之间。在 *第 5 章：JavaScript 函数* 中，我们将更深入地探讨函数。\n\
  单独的代码块也可以出现在另一个代码块（如函数）内部。例如，一个函数可以包含分组的语句，如 `while` 循环、`for` 循环或 `if` 语句。这里是对每种语句的简短说明和示例。\n\
  ## 语句分组\nJavaScript 中的语句分组包括循环和条件测试。JavaScript 中的循环是一段重复执行的代码块，直到某个条件变为真。条件是用于进行测试的事物，例如：如果某个值小于\
  \ 100，则应该发生某些事情。条件语句是判断特定条件为真还是为假的语句，例如：是否输入了名称。\n接下来的几个代码块将演示各种循环和条件测试。\n## while\
  \ 循环\n`while` 循环只要指定的条件存在，就会循环执行代码块。让我们来看一个示例：\n```javascript\nwhile (counter <=\
  \ 100)\ndocument.write(counter + “<br>);\n}\n\n\n\n\nfor (let i = 0; i <= 100; i++)\n\
  document.write(i + “<br>”);\n```\n`for` 循环与 `while` 循环略有不同。`while` 循环被称为*条件*循环（它在某个条件存在时循环，或者直到某个条件变为真），而\
  \ `for` 循环是计数器循环。通过 `for` 循环，你可以精确指定循环从哪里开始，在哪里停止。为了演示区别，我保持了与上面 `while` 循环相同的参数。`for`\
  \ 循环将从 `0` 循环到 `100`。\n它随后会将循环计数器的值写入文档。正如你所见的，不需要手动增加循环变量，因为它是自动增加的。我现在不会细说太详细，因为循环将在\
  \ *第 14 章：循环* 中进行详细解释。\n## if 语句\nJavaScript 的 `if` 语句在特定条件为真时执行分组的语句。这里有一个小示例：\n\
  ```javascript\n{\nbreak;\n```\n上面的 `if` 语句也通过使用大括号将一组语句组合在一起。在上面的示例中，它判断 `counter`\
  \ 变量是否大于 `50`。如果是，它将显示一个带有 `stop it!` 的弹出框；如果 `counter` 小于或等于 `50`，则什么都不会发生。我现在不会细说太详细，因为\
  \ `if` 语句将在 *第 13 章：控制流语句* 中进行详细解释。\n## 空格和换行\n代码会变得非常杂乱，你可能会更快迷失在代码中。想象一个包含 1000\
  \ 行的脚本。进一步想象你必须更改其中某处的几行。现在，如果没有空格，你将挣苦于寻找你的函数和分组语句何时结束。你将在寻找需要编辑的地方时面临极大困难。\n这就是空格和换行的用武之地。空格允许你以一种优化的方式格式化代码的流：\n\
  # 空格\n空格简单地添加空格、制表符或换行符，以便你的代码更具读性。JavaScript 解释器忽略空格，让我们把 `while` 循环、`for` 循环和\
  \ `if` 语句在没有空格的情况下写出来。\n## 没有空格的 while 循环\n```javascript\nwhile (counter <= 100)\n\
  document.write(counter + “<br>);\n}\n\n\n\nfor (let i = 0; i <= 100; i++)\ndocument.write(i\
  \ + “<br>”);\n```\n## 没有空格的 if\n```javascript\n{\nbreak;\n```\n正如你所见的，代码不再容易阅读了，尽管代码并不长。现在，想象有一个包含几十个\
  \ `if` 语句和循环组合在一起的长脚本。不仅对你来说，对你团队中的其他开发者来说，跟踪代码都将极其困难。你现在可能知道脚本中发生的一切切，但一个月后可能就不如此了。\n\
  让我们让代码变得漂亮起来！\n## 带有空格的 while 循环\n```javascript\nwhile (counter <= 100)\ndocument.write(counter\
  \ + “<br>);\n}\n\n\n\nfor (let i = 0; i <= 100; i++)\ndocument.write(i + “<br>”);\n\
  ```\n## 带有空格的 if\n```javascript\n{\nbreak;\n```\n代码看起来已经清晰多了。通过添加换行符，你可以让它更易读。\n\
  ## 换行符\n一条长的 JavaScript 语句可以分成多行。通常，超过 80 个字符的行会让阅读和跟踪代码变得困难。像这样的行就很长：\n```javascript\n\
  ```\n一个很好的断行位置是在运算符之后（*第 4 章：JavaScript 运算符* 将详细介绍运算符），如下下面的代码段所示：\n```javascript\n\
  size; /*Display screen size*/\n\n\n\n\n\nvar counter = 0;\n{\n  counter++;\n```\n\
  以上是一个小型 `while` 循环在添加了一些空格和换行后的简短示例。让我们为 `for` 循环添加一些换行。\n## 带有换行和空格的 for 循环\n```javascript\n\
  {\n}\n\n\n\nif (counter > 50)\n  alert(\"stop it!\");\n}\n\n\n\n\n| `arguments`\
  \ | `boolean` |\n| `byte` | `catch` |\n| `class` | `continue` |\n| `default` | `do`\
  \ |\n| `else` | `eval` |\n| `extends` | `final` |\n| `float` | `function` |\n| `if`\
  \ | `import` |\n| `instanceof` | `interface` |\n| `long` | `new` |\n| `package`\
  \ | `protected` |\n| `return` | `static` |\n| `switch` | `this` |\n| `throws` |\
  \ `TRUE` |\n| `typeof` | `void` |\n| `while` | `yield` |\n**表 3.1：** JavaScript\
  \ 关键字\n在本书的学习过程中，我们将涵盖这些关键字，因为本章只是一个介绍。\n## 结论\n在本章中，我们学习了 JavaScript 语句的细节。我们学习了如何创建语句、语句是如何形成的，然后学习了空白字符和换行。最后，我们快速查看了可用的\
  \ JavaScript 关键字。\n# 第 4 章：JavaScript 运算符\n## 引言\n运算符允许我们对不同的操作数进行操作。这些操作数可以是我们想要加、减、乘、除的对象名称。有很多运算符，每个运算符都有自己的功能。本章将解释什么是运算符，并将它们分为类别和类型以便更好地理解，并提供了如何使用常用运算符的实用示例。\n\
  ## 目标\n* 什么是运算符？\n* 了解什么是算术运算符\n* 理解赋值运算符\n* 学习运算符优先级\n## 什么是运算符？\n运算符可以被解释为行为几乎像函数的结构，但在语义或语法上与普通函数不同。有许多类型的运算符，甚至还有我们很快将涵盖的类别。一些常用的运算符包括：\n\
  | 运算符类型/类别 | 运算符(s) |\n| 算术 | `+ - / %` |\n| 逻辑 | `||` |\n\n\n\n主要运算符可以归类为实现相似目标的任何运算符类别。主要运算符包括算术、赋值、比较和逻辑运算符。我将在接下来的几个表格和标题中逐一强调每个主要类型。\n\
  \n## 算术运算符\n\n算术运算符主要用于对数字进行算术运算。JavaScript 中可用的算术运算符如表 4.2 所示：\n\n| 运算符类型 | 运算符\
  \ | 描述 |\n| :--- | :--- | :--- |\n| 算术 | `+` | 加法 |\n| 算术 | `-` | 减法 |\n| 算术 | `*`\
  \ | 乘法 |\n| 算术 | `**` | 幂 |\n| 算术 | `/` | 除法 |\n| 算术 | `%` | 取模（余数） |\n| 算术 | `++`\
  \ | 增一 |\n| 算术 | `--` | 减一 |\n\n**表 4.2：** 算术运算符\n\n## 比较运算符\n\n比较运算符用于确定值之间的相等性或差异：\n\
  \n| 运算符类型 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 比较 | `==` | 等于 |\n| 比较 | `===`\
  \ | 值和类型相等 |\n| 比较 | `!=` | 不相等 |\n| 比较 | `!==` | 值不等或类型不相等 |\n| 比较 | `>` | 大于 |\n\
  | 比较 | `<` | 小于 |\n| 比较 | `>=` | 大于等于 |\n| 比较 | `<=` | 小于等于 |\n| 比较 | `?` | 三元运算符\
  \ |\n\n**表 4.3：** 条件运算符\n\n## 逻辑运算符\n\n逻辑运算符用于确定值之间的逻辑关系。JavaScript 中可用的逻辑运算符如表\
  \ 4.4 所示：\n\n| 运算符类型 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 逻辑 | `&&` | 逻辑与 |\n\
  | 逻辑 | `||` | 逻辑或 |\n| 逻辑 | `!` | 逻辑非 |\n\n**表 4.4：** 逻辑运算符\n\n## 赋值运算符\n\n赋值运算符将值赋给变量。JavaScript\
  \ 中可用的赋值运算符如表 4.5 所示：\n\n| 运算符 | 示例 | 等价 |\n| :--- | :--- | :--- |\n| `=` | `a =\
  \ b` | `a = b` |\n| `+=` | `a += b` | `a = a + b` |\n| `-=` | `a -= b` | `a = a\
  \ - b` |\n| `*=` | `a *= b` | `a = a * b` |\n| `/=` | `a /= b` | `a = a / b` |\n\
  | `%=` | `a %= b` | `a = a % b` |\n| `**=` | `a **= b` | `a = a ** b` |\n\n**表 4.5：**\
  \ 赋值运算符\n\n## 运算符子类型\n\n除了作为运算符具有不同功能外，还有使用各种运算符构建语句的多种方法。在大多数情况下，你需要两个操作数（运算符作用于的对象）和一个运算符。有时你可能需要三个操作数和两个运算符。我所称的运算符子类型列在下方：\n\
  \n* 一元\n* 二元\n* 三元\n\n## 一元运算符\n\n当运算符是一元的时，意味着该运算符只有一个操作数。接下来的示例显示了一些一元运算符的用法：\n\
  \n1.  打开你任选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码\n\n```html\n<html>\n<body>\n  <h1>一元运算符</h1>\n\
  \  <p>以下代码演示了对操作数进行的一元操作</p>\n  <script>\n    let a = 1;\n    let b = 1;\n    let\
  \ c = 5;\n    let d = 5;\n    a = -a;\n    alert( a ); // -1, 应用了一元否定\n    b = +b;\n\
  \    alert( b ); // +1, 应用了一元加法\n    c++;\n    alert( c ); // 6, 应用了增一\n    d--;\n\
  \    alert( d ); // 4, 应用了减一\n  </script>\n</body>\n</html>\n```\n\n\n\n\n\n###\
  \ 3. 双击文件并在默认浏览器中打开它。\n\n一旦加载，该网页将连续产生四个警告框（alert boxes）。在上面的示例中，输出了以下答案：\n\n`名为\
  \ a 的变量值为 -1\\.` ` `这是因为我们对其进行了取反，将其变为负数。`\n\n`名为 b 的变量值为 1\\.` ` `它没有变化，因为已经是正数了。`\n\
  \n`名为 c 的变量值为 6\\.` ` `我们在它现有的值 5 的基础上加了 1。`\n\n`名为 d 的变量值为 4\\.` ` `我们在它现有的值 5\
  \ 的基础上减去了 1。`\n\n## 二元运算符\n\n当一个运算符是二元的时，它有两个操作数。下面的示例展示了一些二元运算符的操作：\n\n1. 打开你任选的文本编辑器，并输入以下\
  \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Binary Operators</h1>\n\
  \  <p>The following code demonstrates Binary operations on operands</p>\n  <script>\n\
  \    let a = 1;\n    let b = 2;\n    let c = 5;\n    let d = 2;\n    var e;\n  \
  \  a = a + b;\n    alert( a ); // 3, 将 b 的值加到 a 上\n    b = b - c;\n    alert( b\
  \ ); // -1, 从 b 中减去 c 的值\n    e = c % d;\n    alert( e ); // 1, 余数为 1\n  </script>\n\
  </body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 4.2.html`。\n\n3. 双击文件并在默认浏览器中打开它。\n\
  \n一旦加载，该网页将连续产生三个警告框。在上面的示例中，输出了以下答案：\n\n`名为 a 的变量值为 3\\.` ` `这是因为将 b 的值加到了 a。`\n\
  \n`名为 b 的变量值为 -1\\.` ` `从 b 中减去了 c 的值。`\n\n`名为 e 的变量值为 1\\.` ` `余数为 1。`\n\n## 三元运算符\n\
  \n三元运算符是一种接受三个操作数的运算符。下面的示例展示了一些二元运算符的操作（注：此处原文应为三元运算符）：\n\n1. 打开你任选的文本编辑器，并输入以下\
  \ HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Ternary Operators</h1>\n\
  \  <p>The following code demonstrates Ternary operations on operands</p>\n  <script>\n\
  \    // 常规 if 条件\n    var age = 21;\n    var canEnterCollege;\n    if (age > 18)\
  \ {\n      canEnterCollege = “Old enough”;\n    }\n    else {\n      canEnterCollege\
  \ = “Too young”;\n    }\n    alert(canEnterCollege);\n    // 使用三元条件运算符简化\n    var\
  \ canEnterCollege = (age < 18) ? “Too young” : “Old enough”;\n    alert(canEnterCollege);\n\
  \  </script>\n</body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如 `Chapter 4.2.html`。\n\
  \n3. 双击文件并在默认浏览器中打开它。\n\n一旦加载，该网页将连续产生两个警告框。在上面的示例中，输出了以下答案。\n\n名为 `canEnterCollege`\
  \ 的变量值为 `21`。在第一个控制流语句中（我们将在 *第 13 章：控制流语句* 中介绍控制流语句），我们测试变量 `canEnterCollege` 是否大于\
  \ `18`。如果是，警告框将显示 `old enough`；`else`，另一个警告框将显示 `Too young`。\n\n在代码的最后部分，注意同时同时使用了\
  \ `?` 和 `:`。条件写在括号中——在本例中，为 `age < 18`。如果条件为真，则执行 `?`（问号）旁边的代码；如果条件为假（`age` 不小于\
  \ 18），则触发 `:`（冒号）旁边的代码。\n\n## 运算符优先级\n\n如果表达式包含多个运算符，其执行顺序由它们的优先级顺序定义，即优先级。下表显示了\
  \ JavaScript 中的运算符优先级：\n\n| 运算符类型 | 逐个运算符 |\n| :--- | :--- |\n| 分组 | `()` |\n| 成员访问\
  \ | `.` |\n| 计算的成员访问 | `[ ]` |\n| new (带参数列表) | `new ( )` |\n| 函数调用 | `( )` |\n\
  | 可选链 | `?.` |\n| new (不带参数列表) | `new` |\n| 后置递增 | `++` |\n| 后置递减 | `--` |\n| 逻辑非\
  \ | `!` |\n| 按位非 | `~` |\n| 一元加号 | `+` |\n| 一元取反 | `-` |\n| 前缀递增 | `++` |\n| 前缀递减\
  \ | `--` |\n| 一元类型 | `typeof` |\n| 一元 void | `void` |\n| 一元删除 | `delete` |\n| 一元\
  \ await | `await` |\n| 幂 | `**` |\n| 乘法 | `*` |\n| 除法 | `/` |\n| 余数 | `%` |\n| 加法\
  \ | `+` |\n| 减法 | `-` |\n| 按位左移 | `<<` |\n| 按位右移 | `>>` |\n| 无符号符号右移 | `>>>` |\n\
  | 小于 | `<` |\n| 小于或等于 | `<=` |\n| 大于 | `>` |\n| 大于或等于 | `>=` |\n| 在 | `in` |\n|\
  \ 实例类型 | `instanceof` |\n| 等于 | `==` |\n| 不等于 | `!=` |\n| 严格相等 | `===` |\n| 严格不相等\
  \ | `!==` |\n| 按位与 | `&` |\n| 按位异或 | `^` |\n| 按位或 | `|` |\n| 逻辑与 | `&&` |\n| 逻辑或\
  \ | `||` |\n| 空值合并 | `??` |\n| 逗号 | `,` |\n\n### 还没有结束\n\n到为止我们学习了许多函数和各种运算符，但我们可以使用运算符来拼接字符串。字符串将在\
  \ *第 12 章：原始类型* 中介绍，并在 *第 2 章：对象* 中提到过。\n\n运算符可以用于判断类型，还有按位运算符。我们将在后续内容介绍它们。\n\n\
  ## 总结\n\n在本章中，我们探索了运算符的世界。我们学习了什么是运算符，以及它们不同的类型和分组。我们对一元、二元和三元运算符进行了一些有趣的示例。最后，我们对运算符优先级进行了简单的介绍。\n\
  \n# 第 5 章\n\n## JavaScript 函数\n\n## 引言\n\n函数让事情发生。我们作为程序员编写函数是为了在代码中重复使用。每个函数在何时可以使用或何时应该触发，这取决于调用（invocation）。我们向函数传递信息以产生相似但又不同的结果。\n\
  \n## 结构\n\n* 什么是函数？\n* 函数声明\n* 参数\n* 默认值\n* 函数表达式\n\n## 目标\n\n* 理解函数\n* 学习如何声明函数\n\
  * 学习函数参数\n* 理解函数表达式\n\n\n\n\n\n通俗地来说，`function` 是一个返回特定值的代码块。它可以被比作脚本或程序内部的一个小型子程序，从另一个方法或函数中调用（或触发）。调用它的方法、函数或对象将使用被调用函数返回的值。函数应该始终返回一个值。如果没有指定返回值，则将返回\
  \ `undefined`。\n\nJavaScript 中的函数是一等对象，这意味着它们可以拥有属性和方法。任何函数都由一个声明或表达式、可选参数和默认值组成。\n\
  \n## 函数声明\n\n通过声明函数，你告诉解释器该函数应该被存储在内存中以备后用。当函数从代码的某处被调用时，就会发生这种情况。要声明一个函数，你应该使用类似于以下的代码：\n\
  \n```javascript\nfunction functionName(parameters) {\n  // code block\n}\n```\n\n\
  首先编写 `function` 关键字。这是为了告诉解释器你正在创建一个函数。名称紧随 `function` 关键字之后。它可以可以是任何名称，JavaScript\
  \ 关键字除外，并记住它是区分大小写的。在括号内，你可以包含一个用逗号分隔的参数列表。这是一个小例子：\n\n```javascript\nfunction showGreeting()\
  \ {\n  alert(‘Good morning!’\n}\n```\n\n在上面的代码段中，创建了一个名为 `showGreeting` 的没有任何参数的函数，并显示一个包含\
  \ `Good morning!` 消息的警告框。\n\n## 你有了一个函数，现在怎么办？\n\n嗯，函数如果没有从某处被调用（或触发），它是无法运行的。在调用函数时，你只需要引用函数名并包含它的可选参数。函数可以从以下任何方式被调用：\n\
  \n* 当事件发生时\n* 当被直接调用时\n* 自执行\n\n## 事件触发的函数示例\n\n以下是一个如何从按钮点击或鼠标移动等事件调用函数的示例：\n\n\
  1. 打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Invoke\
  \ function from button click</h1>\n  <p>The following code Calls a function from\
  \ a button click</p>\n  <script>\n    function showGreeting() {\n      alert(‘Good\
  \ morning!’);\n    }\n  </script>\n  <button onclick=”showGreeting()\">Greeting</button>\n\
  </body>\n</html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.1.html`。\n3. 双击文件在默认浏览器中打开它。\n\
  \n正如你将看到的，页面正常加载，还没有弹出警告框。这是因为我们从按钮的点击事件中调用了该函数。如果没有点击按钮，函数将不会执行。\n\n点击按钮，注意弹出的消息，如下截图所示：\n\
  \n![](img/Img_05_01.jpg)\n\n**图 5.1：** 从按钮点击调用的函数\n\n## 直接调用的函数示例\n\n以下是一个如何直接调用函数的示例：\n\
  \n1. 打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Invoke\
  \ function directly</h1>\n  <p>The following code Calls a function just after the\
  \ function is created</p>\n  <script>\n    function showGreeting() {\n      alert(‘Good\
  \ morning!’);\n    }\n    showGreeting();\n  </script>\n</body>\n</html>\n```\n\n\
  2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.2.html`。\n3. 双击文件在默认浏览器中打开它。\n\n## 自执行函数示例\n\n\
  以下是一个如何自动调用函数的示例。这意味着它是一个函数，但不需要添加单独的调用来触发它，因为它调用了它自己：\n\n1. 打开你任选的文本编辑器并输入以下 HTML\
  \ 和 JavaScript 代码：\n\n```html\n<html>\n<body>\n  <h1>Self-Invoke function expression</h1>\n\
  \  <p>The following code creates a function and invokes it automatically</p>\n \
  \ <script>\n    (function showGreeting(){\n      alert(‘Good morning!’);\n    })()\n\
  \  </script>\n</body>\n</html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.3.html`。\n\
  3. 双击文件在默认浏览器中打开它。\n\n这里的函数声明看起来有一点不同，原因是因为我们现在创建了一个函数表达式（我们将在本章稍后部分介绍函数表达式）。名为\
  \ `showGreeting` 的函数被创建并自动执行，无需手动调用。\n\n## 参数\n\n参数或函数参数是用来传递给函数的额外数据。函数随后可以以它喜欢的方式使用并操纵该参数。在函数中包含参数的另一个好处是，你可以传递不同的值作为参数，函数仍然会相应地工作。\n\
  \n这里是一个如何使用其参数向函数发送不同值的示例：\n\n1. 打开你任选的文本编辑器并输入以下 HTML 和 JavaScript 代码：\n\n```html\n\
  <html>\n<body>\n  <h1>Function Parameters</h1>\n  <p>The following code creates\
  \ a function with parameters and makes use of the parameters inside the function</p>\n\
  \  <script>\n    function showGreeting(from, message) { // arguments: from, message\n\
  \      alert(from + ‘: ‘ + message);\n    }\n    showGreeting(‘Ockert’, ‘Hello!’);\
  \ // Outputs - Ockert: Hello!\n    showGreeting(‘BpB’, “Hi!”); // Outputs - BPB:\
  \ Hi!\n  </script>\n</body>\n</html>\n```\n\n2. 将文件保存为 HTML 扩展名，例如 `Chapter 5.4.html`。\n\
  3. 双击文件在默认浏览器中打开它。\n\n声明了一个名为 `showGreeting` 带有两个参数 `from` 和 `message` 的函数。在代码块内部调用了警告框并将值复制到参数中。第一次调用\
  \ `showGreeting` 函数包括：`Ockert`、`Hello!`。第二次调用 `showGreeting` 函数包括：`BpB`、`Hi!`。当运行此脚本时，你将看到两个警告框相继弹出。第一个警告包含输入数据；第二个警告包含最后的输入数据。\n\
  \n## 默认值\n\n当未提供参数时，它的值将变为 `undefined`。例如，如果你这样做：\n\n```javascript\nfunction showGreeting(from,\
  \ message) { // arguments: from, message\n  alert(from + ‘: ‘ + message);\n}\nshowGreeting(‘Ockert’);\
  \ // Outputs - Ockert: undefined\n```\n\n这是完全可以的，解释器不会产生错误。这就是默认值发挥作用的地方。你可以给参数一个默认值，这样即使没有提供值，它仍然有一个可以使用的设置默认值。\n\
  \n这是一个小例子：\n\n```javascript\nfunction showGreeting(from, message = ‘Hey there!’)\
  \ { // arguments: from, message\n  alert(from + ‘: ‘ + message);\n}\nshowGreeting(‘Ockert’);\
  \ // Outputs - Ockert: Hey there!\n```\n\n## 函数表达式\n\nJavaScript 函数也可以通过表达式定义，并且通常存储在变量中。该变量随后可以被作函数使用。这是一个小例子：\n\
  \n```javascript\nvar answer = function (operand1, operand2) {return operand1 * operand2};\n\
  ```\n\n在 `Chapter 12: Variables` 中，我们将对变量和函数进行更详细的介绍。\n\n## 总结\n\n在本章中，我们通过一些很好的示例学习了\
  \ `JavaScript` 函数。我们学习了 `Functions` 如何改进我们的代码，以及如何通过参数和默认值进一步改进它。在本书稍后部分（在 `Chapter\
  \ 12: Variables` 中），我们将再次回到函数并探索函数表达式的世界。\n\n\n\n\n\n在下一章中，我们将深入探讨 JavaScript 类。你将学习如何创建\
  \ JavaScript 类、属性、方法以及混入（Mixins）。你还将了解 JavaScript 中现有的类以及继承。\n\n## 问题\n\n1. 解释 `function`\
  \ 术语。\n2. 列出调用函数的三个方式。\n3. 什么是参数（parameter）？\n4. 给出一个带有默认值的函数示例。\n5. 解释 `function\
  \ expression` 术语。\n\n# 第二部分：JavaScript 的力量\n\n## 引言\n\n第二部分将直接进入 JavaScript 的真实威力。理解\
  \ JavaScript 的运行原理对于创建极其强大的网站和 Web 应用至关重要。在本节中，你将学习如何创建类，然后学习原型、属性和承诺，最后是生成器和模块。\n\
  \n本节将包含以下章节：\n\n1. 类\n2. 原型\n3. 属性\n4. 承诺\n5. 生成器\n6. 模块\n\n# 第 6 章：JavaScript 类\n\
  \n## 引言\n\nJavaScript 类创建了其子对象的结构。虽然 JavaScript 并不是一种完全的面向对象编程（`OOP`）语言，但它仍然包含许多\
  \ OOP 特性。学习如何使用类对于创建适当的可重用对象至关重要。\n\n在本章中，我们将专注于 JavaScript 类。你将学习创建类的不同方法以及如何从类实例化子对象。接下来是属性和方法。你将学习如何创建基础属性和方法，以为你的类提供更好的结构和适应性。最后，你将快速了解继承。内容很多，让我们开始开始吧！\n\
  \n## 结构\n\n* 什么是类？\n    * 创建类\n    * 类声明\n    * 类表达式\n* 属性\n    * 属性的属性\n* 方法\n\
  \    * 静态方法\n* 继承\n\n## 目标\n\n* 学习什么是类\n* 理解属性的概念\n* 理解方法的概念\n* 学习什么是继承\n\n## 什么是类？\n\
  \n在 OOP 中，类是一个模板或蓝图，可以根据它创建对象。JavaScript 中的类是函数的一种类型，可以通过类声明或类表达式来创建。\n\n## 创建类\n\
  \n在 JavaScript 中创建类本质上只有两种方式，它们是：\n\n* 声明类\n* 使用类表达式\n\n让我们来看看每种示例。\n\n## 类声明\n\n\
  要声明一个类，你只需要使用 `class` 关键字并提供类的名称，以及一个 `constructor`。`constructor` 是一种特殊的方法，可以在其中对对象进行初始化，并且会被自动调用。你也可以在这里为类提供参数并对它们进行初始化。初始化是为对象或变量分配（设置）初始值。这是一个示例：\n\
  \n```javascript\nclass Student {\n  constructor(studentName, studentCourse) {\n\
  \    this.studentName = studentName;\n    this.studentCourse = studentCourse;\n\
  \  }\n}\n```\n\n在上面的代码中，我们创建了一个名为 `Student` 的类。`constructor` 函数接收两个提供的参数。这两个参数是\
  \ `studentName` 和 `studentCourse`。\n\n让我们进一步探讨。下面的示例显示了如何声明一个类、初始化它的某些对象并在类外部使用该类：\n\
  \n```html\n<html>\n<body>\n  <h1>类声明示例</h1>\n  <p>类声明示例示例</p>\n  <script>\n    class\
  \ Student {\n      constructor(studentName, studentCourse) {\n        this.studentName\
  \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n      showInfo()\
  \ {\n        alert('Student: ' + this.studentName + ' is doing: ' + this.studentCourse);\n\
  \      }\n    }\n    // 使用:\n    student = new Student('ckert', 'JavaScript');\n\
  \    student.showInfo();\n  </script>\n</body>\n</html>\n```\n\n1. 以 HTML 扩展名保存文件，例如\
  \ `Chapter 6.1.html`。\n2. 双击文件在默认浏览器中打开它。\n将出现一个与下一个截图类似的警告框：`Img_06_01.jpg`\n\n\
  **图 6.1：** 类声明的运行\n\n让我解释一下发生了什么：我们创建了 `Student` 类及其 `constructor` 函数。然后我们初始化了 `studentName`\
  \ 和 `studentCourse` 变量。在 `Student` 类内部，你创建了一个名为 `showInfo` 的函数。`showInfo` 函数显示一个带有提供的\
  \ `studentName` 和 `studentCourse` 的警告框。然后我们创建了一个名为 `student` 的对象（注意 JavaScript 是区分大小写的）。在\
  \ student 对象内部，你提供了详细信息，如你的名字（在这种情况下是我的）和课程。最后，你从 `student` 对象调用 `showInfo` 函数，这就会显示图\
  \ 6.1 所示的警告框。\n\n现在你已经知道如何创建类，让我们看看如何创建表达式来创建类。\n\n## 类表达式\n\n类就像函数一样，可以定义在表达式内部，正如第\
  \ 5 章：函数中所述。类表达式可以是命名的，也可以是不命名的。让我们对两者都做一个示例。\n\n下面的示例显示了一个匿名类表达式示例：\n\n```html\n\
  <html>\n<body>\n  <h1>匿名类表达式示例</h1>\n  <p>匿名类表达式示例示例</p>\n  <script>\n    let Student\
  \ = class {\n      constructor(studentName, studentCourse) {\n        this.studentName\
  \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n      showInfo()\
  \ {\n        alert('Student: ' + this.studentName + ' is doing: ' + this.studentCourse);\n\
  \      }\n    };\n    // 使用:\n    var student = new Student('ckert', 'JavaScript');\n\
  \    student.showInfo();\n  </script>\n</body>\n</html>\n```\n\n1. 以 HTML 扩展名保存文件，例如\
  \ `Chapter 6.2.html`。\n2. 双击文件在默认浏览器中打开它。\n\n好的，这里发生了什么？你通过使用表达式创建了一个匿名类。然后你创建了一个\
  \ `constructor`，初始化了参数并创建了 `showInfo` 函数来显示输入的值。\n\n下面的示例显示了一个命名的类表达式示例：\n\n```html\n\
  <html>\n<body>\n  <h1>命名的类表达式示例</h1>\n  <p>命名的类表达式示例示例</p>\n  <script>\n    let\
  \ student = class Student {\n      constructor(studentName, studentCourse) {\n \
  \       this.studentName = studentName;\n        this.studentCourse = studentCourse;\n\
  \      }\n      showInfo(){\n        alert('Student: ' + this.studentName + ' is\
  \ doing: ' + this.studentCourse);\n      }\n    };\n    // 使用:\n    var newStudent\
  \ = new student('ckert', 'JavaScript');\n    newStudent.showInfo();\n  </script>\n\
  </body>\n</html>\n```\n\n1. 以 HTML 扩展名保存文件，例如 `Chapter 6.3.html`。\n2. 双击文件在默认浏览器中打开它。\n\
  \n如你所见，它与之前的两个示例非常相似，但仍然有所不同。你在类表达式中为类指定名称，创建了构造函数，然后创建了一个基于链接 `Student` 类的 `newStudent`\
  \ 对象。\n\n## 属性\n\n\n\n\n\n属性描述了一个对象。任何对象都具有某些可以设置和检索的属性。以汽车对象为例，可以为汽车设置许多属性，这些包括：\n\
  \n*   汽车品牌\n*   汽车型号\n*   变速箱\n*   燃料类型\n*   颜色\n*   座位数量\n\n尽管汽车有不同的品牌、型号、颜色、变速箱和燃料类型，但每辆汽车仍然被归类为汽车。为什么？因为汽车对象仍然是由相同的汽车模板或类创建的。\n\
  \n在本章之前的所有代码示例中，我们已经学习了如何设置属性。这些属性被称为实例属性。这里需要注意的重要的一点是，你使用了点表示法（dot notation）来设置属性的值并进行赋值。让我们更进一步。\n\
  \n要访问 JavaScript 属性，请使用以下语法：\n\n`objectName.property      // student.studentName`\n\
  \nOR\n\n`objectName[\"property\"]      // student[\"studentName\"]`\n\nOR\n\n`objectName[expression];\
  \      // newStudent = \"studentName\";`\n\n`student[newStudent]`\n\n你可能想知道如何向对象添加新属性呢？嗯，这非常简单！你只需要给它一个值即可。这里有一个示例：\n\
  \n`student.studentCourse = \"JavaScript\";`\n\n等号左侧包含对象，然后是它的属性。等号右侧包含将存储在属性中的值。\n\
  \n# 属性的属性 #toc.xhtml_s104a\n\n属性最常见的特征是它的值和名称。你通过它的名称来访问属性，但它提供了请求的值。这里就变得复杂了！某些属性是不可写入的，这意味着它们是只读的且不能更改。某些属性无法通过循环遍历。它们必须是可枚举的（enumerable）。某些属性不能被删除。\n\
  \n这些都取决于特定属性的属性（或标记）。主要有三个可以设置的属性（或标记）。它们是：\n\n*   `writable`: 决定属性的值是否可以更改。\n*\
  \   `enumerable`: 属性可以在循环列表中列出？\n*   `configurable`: 允许删除属性或修改属性。\n\n为了访问任何属性的属性，你可以使用\
  \ `Object.getOwnPropertyDescriptor` 方法。你提供想要查询的对象，然后是该对象的属性。这是一个小练习。\n\n以下示例显示了\
  \ `Object.getOwnPropertyDescriptor` 的用法：\n\n1.  打开你喜欢的文本编辑器，并输入以下 HTML 和 JavaScript\
  \ 代码：\n\n```html\n<html>\n<body>\n  <h1>Object.getOwnPropertyDescriptor example</h1>\n\
  \  <p>Object.getOwnPropertyDescriptor example</p>\n  <script>\n    let student =\
  \ class Student {\n      constructor(studentName, studentCourse) {\n        this.studentName\
  \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n      showInfo()\
  \ {\n        let descriptor = Object.getOwnPropertyDescriptor(newStudent, 'studentName');\n\
  \        alert(JSON.stringify(descriptor, null, 2));\n      }\n    };\n    // Usage:\n\
  \    var newStudent = new student('Ockert', 'JavaScript');\n    newStudent.showInfo();\n\
  \  </script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存文件，例如 `Chapter 6.4.html`。\n\
  3.  双击文件在默认浏览器中打开它。\n\n在上面的代码段中，你创建了一个对象。然后在 `showInfo` 方法中，你利用 `getOwnPropertyDescriptor`\
  \ 方法来调查 `newStudent` 对象中 `studentName` 属性的属性。\n\n`studentName` 属性的属性：\n\n![](img/Img_06_02.jpg)\n\
  \n**图 6.2:** studentName 属性\n\n要更改这些属性，你应该使用 `Object` 类的 `defineProperty` 方法。\n\n\
  下一个示例将 `studentName` 属性的 `writable` 属性改为 `false`。这意味着该属性现在是只读的，无法通过代码更改：\n\n```javascript\n\
  Object.defineProperty(newStudent, \"studentName\", {\n  writable: false\n});\nnewStudent.studentName\
  \ = \"Test\"; // Error: Cannot assign to read only property ‘studentName’\n```\n\
  \n如果在浏览器中运行上述代码段的代码，产生的错误：\n\n![](img/Img_06_03.jpg)\n\n**图 6.3:** defineProperty\
  \ 错误\n\n在第 8 章：属性中，我们将更详细地讨论 getter（getters）和 setter（setters）、标记（flags）和描述符（descriptors）。\n\
  \n# 方法 #toc.xhtml_s105a\n\n任何编程语言中的方法都意味着对象可以做什么。因此，在我们持续的学生对象示例上下文中，学生对象可以考试、通过或未通过考试、旷课、上到或不交学费。\n\
  \n在我们所做的所有练习中，我们使用了 `showInfo`。接下来的示例显示了如何创建一个方法：\n\n```html\n<html>\n<body>\n \
  \ <h1>Method example</h1>\n  <p>Method example</p>\n  <script>\n    let student\
  \ = class Student {\n      constructor(studentName, studentCourse) {\n        this.studentName\
  \ = studentName;\n        this.studentCourse = studentCourse;\n      }\n      AllInfo()\
  \ {\n        return 'Student: ' + this.studentName + ' is doing: ' + this.studentCourse;\n\
  \      }\n    };\n    // Usage:\n    var newStudent = new student('Ockert', 'JavaScript').AllInfo();\n\
  \    alert(newStudent);\n  </script>\n</body>\n</html>\n```\n\n1.  打开你喜欢的文本编辑器，并输入以下\
  \ HTML 和 JavaScript 代码。\n2.  以 HTML 扩展名保存文件，例如 `Chapter 6.5.html`。\n3.  双击文件在默认浏览器中打开它。\n\
  \n你创建了带有其属性的类。`AllInfo` 方法返回一个包含学生姓名、学生课程和一些组成漂亮句子的文本字符串。然后你创建了一个名为 `newStudent`\
  \ 的新学生对象，赋予了它初始化值，并立即调用了 `AllInfo` 函数。最后，alert 框显示了结果。\n\n# 静态方法 #toc.xhtml_s106a\n\
  \n静态方法与普通方法略有不同。静态方法是在类本身中创建的，而不是在使用类的对象（原型）上。这意味着你不能在对象上调用静态方法，但可以在类上调用。\n\n以下示例显示了静态方法的用法：\n\
  \n\n\n\n\n## 继承\n\n对象从其他对象继承特征。在本章的早些部分，我提到了汽车对象。我解释了每辆汽车都有四个轮子和其他共同特征，但卡车或巴士又是呢？\n\
  \n虽然卡车的轮子通常比四个多，但它们仍然是车辆家族的一部分。巴士可能有四个轮子，但它们的座位比汽车和卡车多得多；尽管如此，它们仍然是车辆家族的一部分。\n\n\
  另一个例子是你从父母那里继承特征。你可能拥有母亲的头发和眼睛，可能拥有父亲的性格，但你仍然是独一无二的，你依然是你自己。这个过程被称为继承。\n\n在`Chapter\
  \ 7: Prototypes` 中，我们将进一步探索继承，并使用 Mixins（混合器）来在不需要继承的情况下使用不同类的方法。\n\n## 结论\n\n在本章中，我们学习了\
  \ JavaScript 类以及如何使用它们。我们学习了为什么类非常重要，以及我们如何向 JavaScript 类添加属性和方法。我们在本章中创建了许多示例，因为这是学习任何东西最简单的方法！熟能生巧。\n\
  \n在下一章中，我们将处理原型。虽然我们在本章中接触了这一主题，但我们将深入探讨。我们还将学习继承、Mixins 和原始类型的重要性。\n\n## 问题\n\n\
  1. 解释 `class` 术语。\n2. 列出创建类的两种方法。\n3. 方法和静态方法之间有什么区别？\n4. 列出属性的三个特征（attributes）。\n\
  5. 解释继承术语。\n\n# 第 7 章：JavaScript 原型\n\n## 引言\n\nJavaScript 中的原型使我们能够让代码更加面向对象。JavaScript\
  \ 原型帮助我们很好地构建对象。是的，类也做相同的事情，但原型解决了普通 JavaScript 类的几个缺点。\n\n有许多不同的原型，我们将研究其中几个。本章的有趣部分从继承和\
  \ Mixins 开始，通过我们可以从其他 JavaScript 类中借用属性和方法。\n\n## 结构\n\n- 什么是原型？\n- 原型继承\n- Mixins\n\
  \n## 目标\n\n- 学习不同类型的原型\n- 理解原型的需求\n- 理解原型继承\n- 理解 Mixins\n\n## 什么是原型？\n\nJavaScript\
  \ 中的原型使我们能够让代码更加面向对象。JavaScript 原型帮助我们很好地构建对象。是的，类也做相同的事情，但原型解决了普通 JavaScript 类的几个缺点。\n\
  \nJavaScript 中有两种原型，即 `prototype` 和 `[[Prototype]]`：\n\n- `prototype`：原型被赋值为你在 JavaScript\
  \ 中创建的任何函数的属性，正如 `Chapter 6: JavaScript Classes` 中解释的那样。\n- `[[Prototype]]`：每个由运行上下文访问的对象都有一个\
  \ `[[Prototype]]` 属性，当读取对象的某个属性不可用时，就会读取它。\n\n好了，这现在听起来真的不太通，对吗？不。让我们仔细观察。\n\n我们在\
  \ `Chapter 6: JavaScript Classes` 中学习过，你可以使用构造函数来创建对象。来看下面的示例：\n\n```\nfunction\
  \ Student(studentFirstName, studentLastName) {\n  this.studentFirstName = studentFirstName,\n\
  \  this.studentLastName = studentLastName,\n  this.studentFullName = function()\
  \ {\n    return this.studentFirstName + \" \" + this.studentLastName;\n  }\n}\n\n\
  var student1 = new Student(\"Ockert\", \"du Preez\");\nvar student2 = new Student(\"\
  BpB\", \"Publications\");\nconsole.log(student1);\nconsole.log(student2)\n```\n\n\
  函数 `Student` 是 `Student` 对象的构造函数。它包含了名和姓参数，或者在本例中，是属性。`studentFullName` 是一个组合名和姓字符串的函数。\n\
  \n然后了两个 `Student` 对象：`student1` 和 `student2`，结果显示在控制台窗口中。\n\n现在，看这段代码，似乎没有任何异常之处。确实如此。它创建了两个\
  \ `Student` 构造函数的副本，分别用于 `student1` 和 `student2`。这意味着使用 `Student` 构造函数创建的每个对象都将拥有它自己的方法和属性副本。这正是问题出现的地方。构造函数中的\
  \ `studentFirstName` 方法通过拥有它的两个实例浪费了内存，并且在每个独立的对象中都执行相同的操作。\n\n我们通过创建原型来解决这个问题。\n\
  \n每当创建一个函数时，JavaScript 引擎都会自动向其添加一个原型属性。这被称为原型对象，它默认包含它自己的构造函数。构造函数指向该原型对象作为属性的那个函数。你使用\
  \ `functionName.prototype` 访问函数的原型属性。\n\n`Figure 7.1` 显示 `Student` 构造函数包含一个指向原型对象的原型属性。该原型对象包含一个指向回函数的构造函数。\n\
  \n\n\n\n函数的 `prototype` 属性是一个对象，它包含两个属性：\n\n- `constructor` 属性：它指向 `Student` 函数。\n\
  - `__proto__` 属性：它指向构造函数的原型对象。\n\n## 在原型对象上添加属性\n\n通过在原型对象上附加属性和方法，你可以让使用该构造函数创建的所有对象都共享这些内容。\n\
  \n在下一个练习中，你将向原型对象上附加属性和方法。\n\n以下示例演示了如何向原型对象添加属性：\n\n```html\n<html>\n<body>\n<h1>Add\
  \ properties to prototype object example</h1>\n<p>Add properties to prototype object\
  \ example</p>\n<script>\nfunction Student(studentFirstName, studentLastName) {\n\
  \  this.studentFirstName = studentFirstName,\n  this.studentLastName = studentLastName,\n\
  \  this.studentFullName = function() {\n    return this.studentFirstName + “ “ +\
  \ this.studentLastName;\n  }\n}\nvar student1 = new Student(“Ockert”, “du Preez”);\n\
  var student2 = new Student(“BpB”, “Publications”);\n//Method 1 - dot notation\n\
  Student.prototype.studentID = ‘Student001’\nconsole.log(Student.prototype.studentID)\n\
  //Method 2 - square brackets\nStudent.prototype[\"studentCourse\"] = ‘JavaScript’\n\
  console.log(Student.prototype)\n</script>\n</body>\n</html>\n```\n\n2. 以 HTML 扩展名保存文件，例如\
  \ `Chapter 7.3.html`。\n\n3. 双击该文件在默认浏览器中打开它。\n\n4. 如果浏览器是 Google Chrome，按下 `Ctrl`\
