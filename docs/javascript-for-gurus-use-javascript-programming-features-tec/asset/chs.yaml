  \n# 第 13 章\n\n## 控制流语句\n\n## 简介\n\n控制流语句根据其执行的条件或微小测试来决定你脚本的执行流。这些测试可以包括测试一天的时间、用户的年龄，或者是否提供了某些特定信息。\n\
  \n在本节中，你将学习什么是控制流语句，以及哪些语句最适合你的特定需求。你将学习如何利用 `if` 语句、`else…if` 语句和 `else` 来根据情况执行代码。然后，你将学习\
  \ `switch` 语句和条件运算符如何为你节省时间。最后，你将学习如何嵌套语句。\n\n## 结构\n\n*   控制流语句定义\n*   if\n*  \
  \ else…if\n*   else\n*   switch\n*   嵌套语句\n*   条件运算符‘`?’`\n\n## 目标\n\n*   理解控制流语句的工作原理。\n\
  *   利用 `if` 语句测试条件。\n*   利用 `else…if` 语句测试多个条件。\n*   当条件为假时利用 `else` 语句。\n*   理解\
  \ `switch` 语句的工作原理。\n*   理解如何嵌套 `if` 语句和 `switch` 语句。\n*   知道如何使用条件运算符。\n\n## 控制流语句定义\n\
  \n语句是逐行执行的。浏览解释器从上到下开始执行语句。这被称为脚本或程序的控制流。很多时候，脚本的控制流可以根据某些条件发生改变。这些条件判断是开发者作为开发者需要测试的未知值或情况。\n\
  \n一个很好的例子是，如果网站要求输入密码。如果没有输入文本，或者输入的密码太短，会发生什么？根据这些情况，应该执行不同的代码分支。如果输入的密码是错误的呢？应该执行另一条代码。如果输入的密码是正确的呢？随后执行的分支将允许用户进一步进入网站。\n\
  \n我们如何做到这一点？答案很简单。控制流语句如 `if`、`if…else`、`else`、`switch` 和条件运算符。让我们来看其中的每一个。\n\n\
  ## if 语句\n\n如果你中了票你会做什么？我知道我会怎么做！我会还清所有债务，买一辆好车。退休和我妻子孩子一起住在一个远离世俗、荒无人烟的地方。听我解释；我正试图表达一个观点。\n\
  \n晚上到了，你会做什么？你打开灯，当黎明来临时，你开始关灯。下雨了，而你在外面。如果你有伞，你就把它拿出来使用。如果你没有伞，你就去寻找避难所。\n\n注意我在类比中不断使用的那个两个字母关键词了吗？\n\
  \n`if` 语句在脚本中的工作方式一样。它只是不同的平台。你需要测试的几点内容如下：\n\n*   用户交互\n*   脚本中的某些事件或情况\n*   计算机事件。\n\
  \n为了解释得更清楚。你可能需要检查变量的状态以完成任务。例如，如果未提供某些信息，用户无法继续进入网站。或者，你可能忙于以下事务：\n\n```html\n\
  <!doctype html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n\
  \  let student = {\n  name: “Ockert”\n  };\n  let id = Symbol(“id”);\n  student[id]\
  \ = 123;\n  alert( student[id] );\n</script>\n</body>\n</html>\n```\n\n1.  打开你选择的文本编辑器，并输入以下\
  \ HTML 和 JavaScript 代码：\n\n    ```html\n<!doctype html>\n<body>\n<h1>Symbol example</h1>\n\
  <p>Symbol example</p>\n<script>\n  let student = {\n  name: “Ockert”\n  };\n  let\
  \ id = Symbol(“id”);\n  student[id] = 123;\n  alert( student[id] );\n</script>\n\
  </body>\n</html>\n    ```\n\n2.  以 HTML 扩展名保存该文件，例如 `Chapter 12.8.html`。\n\n3. \
  \ 双击该文件在默认浏览器中打开它\n\n运行后，ID `idsymbol` 会被赋值给 `student` 对象，它将产生 `123`。\n\n这也许是 `if`\
  \ 语句最基本的演示。因为 `time` 是一个 `Date` 对象，我们可以访问 `Date` 属性如 `getHours`。\n\n```html\n<!doctype\
  \ html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n  var\
  \ time = new Date().getHours();\n  if (time < 12) {\n    greeting = “Good morning”;\n\
  \  }\n  document.write(greeting);\n</script>\n</body>\n</html>\n```\n\n如果小时小于 12，那么另一个变量\
  \ `greeting` 将填充为：`Good morning`。最后，greeting 的值被写入页面。\n\n![](img/Img_13.jpg)\n\n\
  **图 13.1：** if 语句的应用\n\n有时一个 `if` 语句是不够的。这就是 `else…if` 语句。\n\n## else…if 语句\n\n\
  `else…if` 语句用于检查多个条件。如果原始条件不存在，流跳转到下一个 `else…if` 语句，如果该条件不存在，它继续到下一个，以此此类推。如果所有条件都不，则什么都不会发生，所有\
  \ `if` 和 `else…if` 语句中的代码都不会被执行。\n\n下面的示例添加了一个 `else…if` 语句：\n\n```html\n<!doctype\
  \ html>\n<body>\n<h1>Symbol example</h1>\n<p>Symbol example</p>\n<script>\n  var\
  \ time = new Date().getHours();\n  if (time < 12) {\n    greeting = “Good morning”;\n\
  \  }\n  else if (time < 18) {\n    greeting = “Good afternoon”;\n  }\n  document.write(greeting);\n\
  </script>\n</body>\n</html>\n```\n\n2.  以 HTML 扩展名保存该文件，例如 `Chapter 13.2.html`。\n\
  \n3.  双击该文件在默认浏览器中打开它。\n\n如果时间小于 18，那么 greeting 变量 `greeting` 将包含消息 `Good afternoon`。\n\
  \n之前我提到过，当没有 `else…if` 条件存在时，什么都不会发生。好吧，我们可以让某些事情发生！\n\n\n\n\n\n## else 语句\n\n`else`\
  \ 语句用于在特定条件不存在时执行。所以，回到我最初那个关于我中彩票的类比。如果我没有中彩票，我必须继续工作而不能退休。在上面的两个练习中，如果时间既小于 12\
  \ 也小于 18，那么目前什么都不会发生。\n\n让我们改变一下！下面的示例添加了一个 `else` 语句：\n\n1. 打开你选择的文本编辑器，并输入以下 HTML\
  \ 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>If Statement example</h1>\n\
  <p>If Statement example</p>\n<script>\nvar time = new Date().getHours();\nif (time\
  \ < 12) {\ngreeting = “Good morning”;\n}\nelse if (time < 18) {\ngreeting = “Good\
  \ afternoon”;\n}\nelse {\ngreeting = “Good evening”;\n}\ndocument.write(greeting);\n\
  </script>\n</body>\n</html>\n```\n\n2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.3.html`。\n\
  \n3. 双击该文件并在默认浏览器中打开。\n\n当时间既小于 12 也小于 18 时，问候语将是 `Good evening`。\n\n## switch 语句\n\
  \n在 JavaScript 中，你可以使用 `switch` 语句代替多个 `if` 和 `else if` 语句。`switch` 语句提供了一种更具描述性的方法来检查值相对于多个变体。\n\
  \n下面的示例展示了如何创建一个 `switch` 语句：\n\n1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n\
  ```html\n<!doctype html>\n<body>\n<h1>Switch Statement example</h1>\n<p>Switch Statement\
  \ example</p>\n<script>\nvar objDay = new Date();\nswitch (objDay.getDay())\n{\n\
  case 0:\nconsole.log(“Sunday”);\nbreak;\ncase 1:\nconsole.log(“Monday”);\nbreak;\n\
  case 2:\nconsole.log(“Tuesday”);\nbreak;\ncase 3:\nconsole.log(“Wednesday”);\nbreak\n\
  \ncase 4:\nconsole.log(“Thursday”);\nbreak;\ncase 5:\nconsole.log(“Friday”);\nbreak;\n\
  case 6:\nconsole.log(“Saturday”);\nbreak;\ndefault:\nconsole.log(“Choose a proper\
  \ day”);\nbreak;\n}\n</script>\n</body>\n</html>\n```\n\n2. 将该文件保存为 HTML 扩展名，例如\
  \ `Chapter 13.4.html`。\n\n3. 双击该文件并在默认浏览器中打开。\n\n它看起来比实际情况复杂得多！你创建了一个名为 `objDay`\
  \ 的新 `Date` 对象。然后，`switch` 语句开始测试当前是星期几。这是通过使用 `getDay()` 方法实现的。根据是哪一天，该会被记录到控制台中。在我的情况下，第\
  \ 0 是 `Sunday`（星期日），第 6 是 `Saturday`（星期六）。如果你眼睛更敏锐，你会注意到每个 case 语句之间的小小的 `break;`。这是为了表示当前分支的代码已执行完毕，不应继续执行其他\
  \ case。最后，放在那里的 `default` 是当没有任何 case 满足时的值。让我们通过快速修改上面的代码再做另一个例子：\n\n1. 打开你选择的文本编辑器，并输入以下\
  \ HTML 和 JavaScript 代码：\n\n```html\n<!doctype html>\n<body>\n<h1>Switch Statement\
  \ example</h1>\n<p>Switch Statement example</p>\n<script>\nvar objDay = new Date();\n\
  switch (objDay.getDay())\n{\ncase 0:\ncase 5:\ncase 6:\nconsole.log(“Weekend!”);\n\
  break;\ncase 1:\ncase 2:\ncase 4:\nconsole.log(“Work”);\nbreak;\ncase 3:\nconsole.log(“Off”);\n\
  break;\n}\n</script>\n</body>\n</html>\n```\n\n2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.5.html`。\n\
  \n3. 双击该文件并在默认浏览器中打开。\n\n这里有一些不同之处。你可能会注意到 case 0 和 5 并没有以 `break` 语句结束。为什么？因为 case\
  \ 0、5 和 6 执行的是相同的操作，即 `Weekend`（周末）。这被称为“分组”，可以节省大量时间，而无需编写重复的代码。case 1、2 和 4 也是如此，它们代表工作日。例如，case\
  \ 3 (`Wednesday`，星期三）将是休息。\n\n现在我们已经理解了这些语句的基础知识，让我们来来点复杂的吧！\n\n## 嵌套语句\n\n嵌套意味着它被放置在类似的结构中。好吧，这告诉我不多！嵌套\
  \ `if` 语句是另一个 `if` 语句内部的 `if` 语句。嵌套 `switch` 语句是另一个 `switch` 语句内部的 `switch` 语句。让我们来看看嵌套\
  \ `if` 语句的操作：\n\n1. 打开你选择的文本编辑器，并输入以下 HTML 和 JavaScript 代码：\n\n```html\n<!doctype\
  \ html>\n<body>\n<h1>Nested If Statement example</h1>\n<p>nested If Statement example</p>\n\
  <script>\nvar studentAge = 15;\nif( studentAge < 18 )\n{\ndocument.write(“Under\
  \ the age of 18!<br>”);\ndocument.write(“Needs parent’s consent to enroll.`);\n\
  }\nelse\n{\nif (studentAge >= 18 && studentAge <= 60 )\n{\ndocument.write(“Eligible\
  \ to enroll<br>”);\ndocument.write(“Please continue to application page.”);\n}\n\
  else\n{\ndocument.write(“Older than most students here.<br>”);\ndocument.write(“Would\
  \ you prefer a softer chair and different time slot?”);\n}\n}\n}\n</script>\n</body>\n\
  </html>\n```\n\n2. 将该文件保存为 HTML 扩展名，例如 `Chapter 13.6.html`。\n\n3. 双击该文件并在默认浏览器中打开。\n\
  \n如你所见，在代码中包含空白有助于观察脚本的流程。创建了一个名为 `studentAge` 的变量并赋值为 15。外层 `if` 语句测试 `studentAge`\
  \ 是否小于 18。如果 `studentAge` 小于 18（目前它确实为 15），则页面将告知用户年龄未满 18 岁，且父母需要对学生的入学授权。\n\n\
  这里是有趣开始的地方。\n\n在 `else` 语句中（意味着 `studentAge` 变量的值为 18 或更高），我放置了另一个 `if` 语句。这就是嵌套。嵌套的\
  \ `if` 语句检查 `studentAge` 是否大于或等于 18 且小于或等于 60。如果这两个条件都满足，即 `studentAge` 大于或等于 18\
  \ 且小于或等于 60，页面将通知用户其有资格入学。\n\n如果 `studentAge` 大于 60，嵌套 `if` 语句的 `else` 子句就会触发，并告知用户他们可能比其他人大，并询问是否需要更软的椅子。\n\
